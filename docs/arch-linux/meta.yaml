- md: " A controller really should do what it's supposed to do and controlling minimum\
    \ of bloat; so we will shift most of the code from it to a model. So I create\
    \ a model called Datamodel.php which physically goes into:\n/srv/http/joesoapdev/app/Models\n\
    \nThe code of the model is as follows:\n\n```\n<?php namespace App\\Models;\n\
    use CodeIgniter\\Database\\ConnectionInterface;\nuse CodeIgniter\\Model;\nclass\
    \ Datamodel extends Model\n{\n    protected $table     = 'items';\n    protected\
    \ $primaryKey = 'Id';\n    protected $allowedFields = ['Item','Price'];\n    protected\
    \ $db;\n    public function getAll()\n    {\n        $this->db = \\Config\\Database::connect();\n\
    \        return $this->findAll();\n    }\n}\n```\n\nCouple of things to note the\
    \ Model class has some built in features so we will use them to get the data.\
    \ We define the table name, name of primary key and other fields. In the controller\
    \ we will instantiate the above model and using the instantiated object we will\
    \ get data. The code in the controller Datacontroller is now:\n\n```\n<?php namespace\
    \ App\\Controllers;\nuse CodeIgniter\\Controller;\nuse \\App\\Models\\Datamodel;\n\
    class Datacontroller extends BaseController\n{\n    public function data()\n \
    \   {\n        $handle= new Datamodel();\n        $result= $handle->getAll();\n\
    \        $data =[\n            'info'=> ' checking stage of development',\n  \
    \          'theData'=>$result,\n        ];\n        echo view('info',$data);\n\
    \    }\n}\n```\n\nBecause we used the inbuilt findAll() within our class method\
    \ called getAll() we will adapt rendering out the data from using the object way\
    \ to the array form. So the code inside our view info.php that we use is now:\n\
    \n```\n<?=$this->extend('webLayout') ?>\n<?=$this->section('content') ?>\n```\n\
    \n```\n<?php echo $info;?>\n```\n\n```\n<?php\nforeach ($theData as $stuff)\n\
    {\n    echo \"<h4>Id is :\". $stuff['Id'].\"</h4>\";\n    echo \"<h4> Item is\
    \ :\" .$stuff['Item'].\"</h4>\";\n    echo \"<h4>Price is :\". $stuff['Price']\
    \ .\"</h4>\";\n    echo \"<br>\";\n}\n\n?>\n<?=$this->endSection()?>\n```\n\n\
    The output is exactly the same. So really that should be enough to get started.\
    \ The docs for CodeIgniter are at:\n\nhttps://codeigniter4.github.io/userguide/index.html\n\
    \nOnce you get things working with sqlite you could shift to maria or other MySQL;\
    \ I've not found any advantages to do so myself.\n\nIn the controller you can\
    \ use try catch blocks to for instance see if there is any data in a database\
    \ before you try and render. I've done it with the following approach\n\n```\n\
    $db = \\Config\\Database::connect(\"default\");\n$query = $db->query(\"SELECT\
    \ COUNT(*) FROM portfolio \");\n$count = $query->getRowArray();\nreturn $count;\n\
    ```\n\nSo really we now have the basics of CodeIgniter4 up and running. To progress\
    \ it's only a matter of reading the docs at:\n\nhttps://codeigniter4.github.io/userguide/index.html\n\
    \nTo get help with problems go to the forum at:\n\nhttps://forum.codeigniter.com/\n\
    \nWhat we can look at however is getting version control going, which I have found\
    \ is a life saver if you mess up and code just doesn't work; you can at least\
    \ revert to point when it last did. For that we will set up git. Also we can have\
    \ a look at introducing style and responsive web for CI4 using Bootstrap. We will\
    \ have a look at using SASS which is more efficient than plain CSS for style and\
    \ how to override Bootstrap CSS; also using Grunt which is a JavaScript task runner\
    \ to convert SASS to CSS.\n\n## Git\n\nI'm on a new (old HP from eBay) so will\
    \ have to first set up git globally; then I will change directory using a terminal\
    \ to the web root of my web app and run an init command to start version control\
    \ specifically for that web app.\n\nOK so I launched my terminal Alacritty and\
    \ as you can see from the ~ as far as the terminal is concerned it is working\
    \ from my home directory\n\n```\n[andrew@darkstar ~]$\n```\n\nNow with git, I\
    \ know it's going to want to know which software it should launch to show conflicts\
    \ due to differences in code and be able to merge them. I have just used \"meld\"\
    \ for that and I know I don't have it on this laptop so will now install it. I\
    \ need that before moving on to set up git globals.\n\n```\n[andrew@darkstar ~]$\
    \ pacman -Ss meld\nextra/meld 3.22.0-2 [installed]\n    Compare files, directories\
    \ and working copies\n```\n\nOh I was wrong I do have it. I know I have geany\
    \ so:\n\n```\n[andrew@darkstar ~]$ git config --global user.name \"andy brookes\"\
    \n[andrew@darkstar ~]$ git config --global core.editor geany\n[andrew@darkstar\
    \ ~]$ git config --global color.uc auto\n[andrew@darkstar ~]$ git config --global\
    \ merge.tool meld\n[andrew@darkstar ~]$ git config --global user.email andybrookestar@gmail.com\n\
    ```\n\n```\n[andrew@darkstar ~]$ git config --list\nuser.name=andy brookes\nuser.email=andybrookestar@gmail.com\n\
    core.editor=geany\ncolor.uc=auto\nmerge.tool=meld\n```\n\nOK my CodeIgniter web\
    \ doc root is at path:\n/srv/http/joesoapdev\n\nSo I will change directory to\
    \ web root and issue a git starter command:\n\n```\n[andrew@darkstar ~]$ cd /srv/http/joesoapdev\n\
    [andrew@darkstar joesoapdev]$ git init\n```\n\n```\nhint: Using 'master' as the\
    \ name for the initial branch. This default branch name\nhint: is subject to change.\
    \ To configure the initial branch name to use in all\nhint: of your new repositories,\
    \ which will suppress this warning, call:\nhint:\n    git config --global init.defaultBranch\
    \ <name>\nhint: Names commonly chosen instead of 'master' are 'main', 'trunk'\
    \ and\nhint: 'development'. The just-created branch can be renamed via this command:\n\
    hint:\n    git branch -m <name>\nInitialized empty Git repository in /srv/http/joesoapdev/.git/\n\
    ```\n\nAs you can see it didn't complain and gave us some handy hints. We have\
    \ code from our last efforts so I want to make sure everything is added and set\
    \ up an initial starting point comment and a tag or easy use to get to each stage\
    \ should I need to:\n\n```\n[andrew@darkstar joesoapdev]$ git add  .\n[andrew@darkstar\
    \ joesoapdev]$ git commit -a -m  \"starting point\"\n[master (root-commit) fb76749]\
    \ starting point\n95 files changed, 8463 insertions(+)\n```\n\nNotice the trailing\
    \ period i.e. a dot a few white spaces after the \"git add\" above, that adds\
    \ everything in my web doc. Now I will add a tag and have a look at the git tree\
    \ for my web doc.\n\n```\n[andrew@darkstar joesoapdev]$ git tag -a  v1.0 -m \"\
    \ first point of dev\"\n```\n\nIt's not quite true it was our very first point\
    \ of dev because we coded some stuff, but hey it was all working. Now let's see\
    \ what we have in tree:\n\n```\n[andrew@darkstar joesoapdev]$ git  --all\n```\n\
    \nYou should get something like the image below come up\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_114_0.png)\n\
    \nI only show a section of the image that came up from the output of issuing the\
    \ command\n\n```\n[andrew@darkstar ~]$ gitk  --all\n```\n\nNow as you progress\
    \ with code the time to make another commit is where you have moved forward a\
    \ few steps, the sequence is always the same. Have your terminal be at the location\
    \ of your web root, that you want to update git in my case `/srv/http/joesoapdev`\
    \ then:\n\n```\n[andrew@darkstar joesoapdev]$ git add  .\n[andrew@darkstar joesoapdev]$\
    \ git commit -a -m \"some relevant comment \"\n[andrew@darkstar joesoapdev]$ git\
    \ tag -a  v1.1  -m  \"  \"\n```\n\nmake a new tag with logical progression name\
    \ e.g. it was v1.0 so next time we make it 1.1\n\nYou won't see it unless you\
    \ enable \"view hidden files\", but git places its data in a .git directory in\
    \ the web root. Now for development there is a lot of stuff you want but don't\
    \ want to upload to the server. So for instance `node_modules` is a directory\
    \ that's been in my web root, that I need while developing but it's not needed\
    \ for live so in my .gitignore file which is at web root I add an entry:\n\n```\n\
    node_modules/*\n```\n\nSo that lightens the load on what git is going to store.\
    \ Also I use rsync to first filter out from my dev to a directory on my Desktop.\
    \ Install rsync with pacman if you don't have it. First I change directory for\
    \ the terminal to `/srv/http/` e.g.\n\n```\n[andrew@darkstar ~]$ cd /srv/http\n\
    [andrew@darkstar http]$ ls\nindex.php  joesoapdev\n[andrew@darkstar http]$ rsync\
    \ joesoapdev/  -avu --exclude .git  --exclude node_modules  --exclude README.md\
    \    /home/andrew/Desktop/joesoap4liveserver/\n```\n\nThat command will place\
    \ the contents of inside joesoapdev directory into a directory called joesoap4liveserver\
    \ on my Desktop. That way I don't mess up my dev directory and I make a start\
    \ removing what I don't want uploaded to the live server. From my Desktop I use\
    \ a terminal to zip up each directory. First we need to install zip\n\n```\n[andrew@darkstar\
    \ ~]$ sudo pacman -S zip\n```\n\nto zip up the app directory...\n\n```\n[andrew@darkstar\
    \ joesoap4liveserver]$ zip  -r  app.zip app\n```\n\nThen I just upload app.zip\
    \ to live web hosting and extract it using cPanel on my web hosting, same idea\
    \ for other directories. If you not using sub-directories and sub domains, then\
    \ the contents INSIDE the public directory will want to go directly into your\
    \ web hosting root. Pack the other directories into one directory, place that\
    \ above the web root directory level on your web hosting and edit path in index.php\
    \ so system can find the app etc"
  mdcn: "\n控制器确实应该只做它该做的事，并尽量减少冗余；因此，我们将把大部分代码从控制器转移到模型。所以我创建了一个名为 Datamodel.php 的模型，它物理上位于：\n\
    /srv/http/joesoapdev/app/Models\n\n模型的代码如下：\n\n```\n<?php namespace App\\Models;\n\
