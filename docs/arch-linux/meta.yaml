- md: ' Accessing and using systemd information


    To show the boot log you can use this command:


    ```

    [andrew@darkstar:~]$ journalctl -b

    ```


    To show errors on boot this one:


    ```

    [andrew@darkstar:~]$ journalctl -b -p err

    ```


    to narrow down the problem using time:


    ```

    [andrew@darkstar:]$ journalctl -b -p err --since=20:00 --until=20:15

    ```


    You can use journalctl to even look at Apache web server:


    ```

    andrew@darkstar:]$ journalctl -u httpd --since=00:00  --until=9:30

    (04-19 09:56)

    -- No entries --

    ```


    using UID''s and time period


    ```

    [andrew@darkstar:~]$ journalctl _UID=1000 --since="2023-04-21 12:00:00"

    ```


    You can have a look at security of units using this command:


    ```

    [andrew@darkstar:]$ systemd-analyze security

    ```


    man pages :


    ```

    [andrew@darkstar:]$ man systemd.unit

    [andrew@darkstar:]$ man systemd-system.conf

    [andrew@darkstar:]$ apropos systemd

    ```


    A look at pacman and commands


    To optimize downloads we need to populate the file /etc/pacman.d/mirrorlist file
    with mirrors nearest to you. A simple way of doing it is to go to https://archlinux.org/mirrorlist/
    on the countries list scroll down to where you are then click generate list. Select
    the generated list scroll over to highlight, right click copy.


    ```

    [andrew@darkstar ~]$ sudo nano /etc/pacman.d/mirrorlist

    ```


    Go under the title with cursor as in the image left.


    using all three keys together ctrl+ shift + v that will paste the list into the
    nano editor.


    At the front of every line there is a hash character get rid of as many as you
    want probably 7 using back space. Ctrl+ o, hit enter, ctrl + x


    On the left cursor is aligned behind the hash on a line, ready to use backspace
    to get rid of it.


    When finished ctrl+ o, hit return, ctrl +x to exit


    The configuration file for pacman is at:

    /etc/pacman.conf


    I wonder how many people go there and read the file. This statement is somewhat
    hidden in there:

    " NOTE: You must run `pacman-key --init` before first using pacman; the local
    # keyring can then be populated with the keys of all official Arch Linux # packagers
    with `pacman-key --populate archlinux`"


    I did cover the above on the install but worth highlighting again.


    if you want to install wine and use its libraries you have to edit the multilib
    entry to look like this:


    ```

    [multilib]

    Include = /etc/pacman.d/mirrorlist

    ```


    That is you have to remove the #, both from in front of the #[multilib] as well
    as from the front of the second line above.


    packages are stored in /var/cache/pacman/pkg in the form of tar.zst files.


    I have left out the tar.zst.sig entries.


    lets say pacman installed the latest version but there is an issue. lets see the
    current one :


    You can query like this :


    ```

    [andrew@darkstar:~]$ ls /var/cache/pacman/pkg/calibre*               (04-19 10:20)


    /var/cache/pacman/pkg/calibre-6.15.0-1-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-2-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-2-x86_64.pkg.tar.zst.sig

    [andrew@darkstar:~]$ pacman -Qi calibre

    Name            : calibre

    Version         : 6.15.1-2

    Description     : Ebook management application

    Architecture    : x86_64

    URL             : https://calibre-ebook.com.......etc

    ```


    I am going to revert the the last but one version this way:


    ```

    [andrew@darkstar:~]$ sudo pacman -U

    /var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst

    ```


    And now I''m going to stop pacman updating to the package that does not work by
    editing /etc/pacman.conf so i edit /etc/pacman.conf and add the lines below


    #Pacman won''t upgrade packages listed in IgnorePkg and members of IgnoreGroup

    IgnorePkg=calibre


    Then i will test to see if that works :


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu              (04-19 10:31)

    :: Synchronising package databases...

    core is up to date

    extra        1763.6 KiB  5.02 MiB/s 00:00 [-----------------------------] 100%

    community     7.2 MiB  6.50 MiB/s 00:01 [-----------------------------] 100%

    multilib is up to date

    :: Starting full system upgrade...

    warning: calibre: ignoring package upgrade (6.15.1-1 => 6.15.1-2)

    resolving dependencies...

    looking for conflicting packages...etc

    ```


    Yep ,so looking at above i managed to revert to package 6.15.1-1 and stopped upgrading
    to 6.15.1-2


    You can do the same approach for a kernel if there is a problem


    OK now for some commands I have found useful :


    ```

    [andrew@darkstar:~]$  pacman -Rns $(pacman -Qtdq)

    ```


    The above will search for packages not needed anymore by any other package and
    remove them. When you install packages on Arch Linux its done either from the
    official repositories and you mostly don''t have to worry ,since they are automatically
    updated. The others will be from AUR


    These packages the approach I use is I leave the directory that was created in
    my home directory. Lets take telegram-desktop-bin now because i came from Slackware
    and am a bit of a control freak I like to do everything manually. So when i think
    its about time to update a package my approach (grapejuice ) would be this:


    ```

    [andrew@darkstar:~]$ cd grapejuice

    [andrew@darkstar:~/grapejuice]$ git pull

    remote: Enumerating objects: 11, done. remote: Counting objects: 100% (11/11),
    done.

    etc etc That updates the source code :

    now run:

    ```


    ```

    [andrew@darkstar:~/grapejuice]$ makepkg

    ```


    That will create an updated tar.zst , you can see which is newest by the numbers
    largest number is latest . Then to update:


    ```

    [andrew@darkstar:~]$ sudo pacman -U telegram-desktop-bin-4.7.1-1-x86_64.pkg.tar.zst

    ```


    Now you can just browse your home folder to see what you have , another way to
    separate and get a list of packages you installed is by using pacman command.


    ```

    [andrew@darkstar:~]$ pacman -Q

    The above outputs all packages including AUR

    [andrew@darkstar:~]$ pacman -Qqem

    The above outputs packages only installed from the AUR

    [andrew@darkstar:~]$ pacman -Qen

    The above only shows packages explicitly installed using pacman from official
    repositories

    ```


    The command below will remove a package, its now not required dependencies and
    configuration files associated with package.


    ```

    [andrew@darkstar:~]$ sudo pacman -Rns  pkgName

    eg [andrew@darkstar:~]$ sudo pacman -Rns geany

    ```


    List information on a package :


    ```

    [andrew@darkstar:~]$ pacman -Qii      pkgName

    ```


    Searching for a package  eg searching for kitty :


    ```

    [andrew@darkstar:~]$ pacman -Ss kitty

    community/kitty 0.28.0-1

    A modern, hackable, featureful, OpenGL-based terminal emulator

    ```


    i have already quoted this one (install a package) but a reminder eg :


    ```

    [andrew@darkstar:~]$ pacman -S  kitty

    ```


    This command shows what other packages depend on it; useful when you want to have
    a clear out . here is see what depends on


    get help of flags on a command eg -R is remove , what options do i have


    ```

    [andrew@darkstar:~]$ pacman -R   --help

    ```


    ## Arch User Repository (AUR)


    The package manager pacman is used to get software from the main official repositories.
    But there is repository well worth looking at which has software provided by the
    users of Arch Linux. The approach to getting software from the AUR is a little
    different from the usual pacman approach.


    So i will go the the approach and stages of getting brave web browser from the
    AUR , installing it and how to update it .IN a previous edition of this book I
    went through the process of getting Timeshift from the AUR, but it as since been
    made available directly using pacman .


    The web site for Arch linux is at :

    [https://archlinux.org/](https://archlinux.org/)

    At the top of the menu on the right there is a menu link to the AUR; obviously
    you needed to have included getting a web browser at the time of installing Linux
    are I think subsequently very soon after the main install.


    Icing on the menu link takes you to :

    [https://aur.archlinux.org/](https://aur.archlinux.org/)

    On the right of that page is a search text box. Writing "brave" without the quotation
    marks gives this page:


    | Name | Version | Votes | Popularity | Description |

    |---|---|---|---|---|

    | brave-bin | 1:1.65.114-1 | 762 | 14.87 | Web browser that blocks ads and trackers
    by default |

    | brave-beta-bin | 1.66.83-1 | 40 | 0.69 | Web browser that blocks ads and trackers
    by default |

    | brave | 1.52.129-1 | 145 | 0.26 | Web browser that blocks ads and trackers by
    default |

    | brave-nightly-bin | 1.67.26-1 | 25 | 0.10 | Web browser that blocks ads and
    trackers by default |

    | brave-git | 1.25.33.g0126e4e-1 | 28 | 0.03 | A web browser that stops ads and
    trackers by default |

    | brave-extension-bitwarden-git | 2024.2.1.r14420.g7240285-1 | 1 | 0.01 | Bitwarden
    browser extension for Brave |

    | profile-sync-daemon-brave | 2022.08.18-1 | 3 | 0.00 | Brave browser support
    for profile-sync-daemon |

    | unbrave-git | r5046.f567e657-1 | 2 | 0.00 | A web browser that stops ads and
