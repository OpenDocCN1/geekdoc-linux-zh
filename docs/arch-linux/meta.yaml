- img_proc: true
  md: 'So what you will type in for your the size of the first partition (efi) will
    be something like : +400M


    When you have entered a figure for partition end, it will confirm and show a partition
    number.

    Repeat process by typing "n" again ; accept default start and type in the size
    of the partition you want.


    When all partitions have been created type in "w" to affect the changes You can
    then use one of the three commands on page 14 to show (check might be a better
    word) what your disk now looks like:


    lets say we now have :


    ```

    /dev/sda1   will be or efi

    /dev/sda2   will be for swap

    /dev/sda    will be for root install.

    ```


    Note if you don''t create a separate /home partition , its no problem. When you
    create a user via the useradd command, then a directory for the user will be created
    within the root partition. If you do have a /home partition then the command will
    create a user account within /home .


    So now we format the partitions :


    ```

    root@archiso ~#     mkfs.fat -F32 /dev/sda1

    root@archiso ~#     mkswap /dev/sda2

    root@archiso ~#     swapon /dev/sda2

    root@archiso ~#     mkfs.ext4 -b 2048  /dev/sda3

    ```


    in the above last line -b 2048 is a flag that tells the system to create file
    system in block of 2048 bytes at a time


    you can use e2label command to label partitions such as


    ```

    root@archiso ~#  e2label /dev/sda6       home

    ```


    The next stage is we are going to "mount" our partitions . "Mounting" , put simply
    is to make a partition in use and accessible to be able to work on .


    > **Note**

    [

    In the structure of an installed system there are commonly directories call "mnt"
    and also "run" . When you attach say a USB stick to a laptop, the partition something
    like /dev/sdb1 will be auto-mounted to the run directory we will be mounting the
    root directory, which will be where our Arch is installed to the /mnt. The Arch
    install system allows use to mount a partition to /mnt . Other partitions we will
    need to create the place to mount them. Root will be mounted to /mnt

    the efi partition will be mounted to /mnt/boot . More later

    ]'
  merge: -1
