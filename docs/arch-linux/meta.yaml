    \ If you're going to do a lot of graphic stuff with files that eat up space then\
    \ you would need a big home directory to put them in.\n\nNow you can do everything\
    \ from the Arch install command line; but you can also do it graphically using\
    \ gParted. So if you put the Mint ISO onto your Ventoy stick, power down and hit\
    \ the power button. Then as it starts to boot straight away hit your PC boot option\
    \ key which for H.P is usually F9 and for BIOS F10. This is structure of one of\
    \ my sticks that was mounted at `/run/media/andrew:`\n\n```\n/run/media/andrew/ventoy\n\
    └── ISO\n    ├── archlinux-2023.01.01-x86_64.iso\n    └── linuxmint-21.1-xfce-64bit.iso\n\
