  md: 'The configuration file for pacman is at:

    /etc/pacman.conf


    I wonder how many people go there and read the file. This statement is somewhat
    hidden in there:

    " NOTE: You must run `pacman-key --init` before first using pacman; the local
    # keyring can then be populated with the keys of all official Arch Linux # packagers
    with `pacman-key --populate archlinux`"


    I did cover the above on the install but worth highlighting again.


    if you want to install wine and use its libraries you have to edit the multilib
    entry to look like this:


    ```

    [multilib]

    Include = /etc/pacman.d/mirrorlist

    ```


    That is you have to remove the #, both from in front of the #[multilib] as well
    as from the front of the second line above.


    packages are stored in /var/cache/pacman/pkg in the form of tar.zst files.


    I have left out the tar.zst.sig entries.


    lets say pacman installed the latest version but there is an issue. lets see the
    current one :


    You can query like this :


    ```

    [andrew@darkstar:~]$ ls /var/cache/pacman/pkg/calibre*               (04-19 10:20)


    /var/cache/pacman/pkg/calibre-6.15.0-1-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-2-x86_64.pkg.tar.zst

    /var/cache/pacman/pkg/calibre-6.15.1-2-x86_64.pkg.tar.zst.sig

    [andrew@darkstar:~]$ pacman -Qi calibre

    Name            : calibre

    Version         : 6.15.1-2

    Description     : Ebook management application

    Architecture    : x86_64

    URL             : https://calibre-ebook.com.......etc

    ```


    I am going to revert the the last but one version this way:


    ```

    [andrew@darkstar:~]$ sudo pacman -U

    /var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst

    ```'
