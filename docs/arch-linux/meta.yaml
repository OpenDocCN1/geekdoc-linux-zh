    现在，我们将对已经安装但尚未运行 systemd 的系统进行一些配置。这是因为配置主要涉及用数据填充文件，或者创建文件然后再用数据填充。


    ## 设置时区


    清单上的第一件事是设置时区。让我们提醒自己，我们目前处于 chroot 环境中，这意味着我们输入的内容，是以我们部分安装的系统为上下文的。当 Arch 启动并运行时，你将可以访问
    systemd 及其 journalctl、systemctl 和 timedatectl。然而 systemd 尚未启动运行。我不想让读者承受太多安装前的东西，所以没有在安装前言中涉及时区。


    但没问题；有两种方法。在 chroot 提示符下输入：


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Europe/London  /etc/localtime

    ```


    这会将时区设置为 GMT，当系统启动后你可以重新设置它。另一种方法是退出 chroot，回到 Arch ISO 安装提示符。不用担心，你挂载的分区会一直保持挂载状态，直到你卸载它。所以你可以直接回去。


    要查看所有时区列表，从 Arch 安装 ISO 提示符输入：


    ```

    root@archiso ~# timedatectl list-timezones

    ```


    你应该能够使用键盘上下键滚动浏览列表。当你看到后，记下它。然后按 Q 退出列表。


    别忘了回到 chroot，所以输入：


    ```

    root@archiso ~#  arch-chroot    /mnt

    ```


    然后假设你最近的时区是 Africa/Accra，那么你输入：


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Africa/Accra  /etc/localtime

    ```


    好了，时区设置完成。


    etc 目录是 Linux 系统配置的主要位置。例如，你会在那里找到 HTTP，其中包含 Apache 网页服务器和任何虚拟主机文件的配置。该命令基本上是从
    /usr/share/zoneinfo/<地区>/<城市> 到文件 /etc/localtime 建立一个链接。


    ## 硬件时钟


    现在我们将使用以下命令将硬件时钟设置为系统时钟：


    ```

    root@archiso : / # hwclock --systohc

    ```


    ## 本地化


    ```

    root@archiso : / # nano /etc/locale.gen

    ```


    该命令将在 nano 中打开文件 /etc/locale.gen。我们之前提到过使用 nano，以尽量让我们所做的这一切不那么痛苦。文件 /etc/locale.gen
    是一个长列表，格式为：<locale> <charset>，前面带有 #。要启用列表中的任何项目，只需从你所选行的前面移除 #追上即可。我的区域设置是英国英语，我想要
    utf-8，所以在 nano 中上下移动光标，查找 #en_GB.UTF-8 UTF-8。然后我将光标定位在 # 前面，按一次键盘退格键来移除 #。所以我
    /etc/locale.gen 中的条目看起来像这样：


    ```

    en_GB.UTF-8 UTF-8

    ```


    然后我输入 ctrl + o，这会高亮显示 nano 将要保存到的文件，基本上只需按回车键即可保存到文件。然后输入 ctrl + x 退出 nano 编辑器。


    ## 主机名


    什么是主机名，简单来说就是计算机的名称，它将在网络上显示。所以我决定我的计算机叫做 "darkstar"，这非常原创，是我在 Slackware 上使用的名字。所以要将我的计算机命名为
    "darkstar"，我只需输入：


