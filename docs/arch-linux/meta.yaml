  - '[PAGE 38]


    A part of the software which gets your operating system up and running is a boot
    manager. I have used Lilo boot mangr with Slackware but probably the most common
    boot manager is Grub , which stands for GRand Unified Bootloader. You can read
    all about grub at :


    [https://www.gnu.org/software/grub/](https://www.gnu.org/software/grub/)


    If there grub issues then the Arch operating system will not boot up , you may
    be able to get to a


    **grub >**


    which is a grub prompt , which is a command line scenario ; you can fix issues
    from that prompt but its probably not a situation you want to find yourself in
    .


    For general issues of the core operating system including Grub a better idea is
    to have a back up plan and the means to implement the plan and the kowledge to
    use what you have set up . Its not a nice feeling when you dont know anything
    about grub how to naviagate around, understand what your looking at if you have
    never been dropped into that situation before . Its not a nice learning curve
    I can tell you.


    So i will look at some approaches of what you can do and prepare to get ready
    in case of emergencies. If say the issue of not being able to boot to a login
    involves only the boot mangr, then if it were possible to boot up the system and
    login then it would be possible to fix the boot manager since you would have a
    running system up with all tools available .


    # eEFInd


    eEFInd is a tool that can get your operating system up and running even if there
    is a problem with the boot manager. See :


    [https://www.rodsbooks.com/refind/index.html](https://www.rodsbooks.com/refind/index.html)


    To use it we are going to download a USB flash drive image file from : [https://www.rodsbooks.com/refind/getting.html](https://www.rodsbooks.com/refind/getting.html)


    Specifically we will "DD" file refind-flashdrive-0.13.3.2.img to a USB stick which
    we can then use to boot up our OS. rEFInd as the name suggests works with 64 bit
    computers that have a gpt table , an EFI partition and files such as grub.efi
    which it is not only good at finding but also uses to boot up your system.


    So as before attach a virgin USB stick to your PC and find ,the block device name
    the PC understands Eg use from a terminal prompt: fdisk -l'
