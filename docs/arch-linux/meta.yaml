  md: '**phpinfo();**

    is a built in function of PHP . When you open a browser and type in a URL or click
    on a link what your doing is connecting to a server which holds a web page and
    your actually requesting that page t be rendered and displayed in your browser.


    When you make a land line phone call to someone there is a procedure and a protocol.
    Its not much difference web wise. Behind the scenes a client computer (yours)
    via the web browser begins with a "handshake" and an agreement how they communicate
    with each other. If you look in the address bar you used to see http which stands
    for Hyper Text Transfer Protocol; now you mostly see https which is secure


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_81_0.png)


    So in the image left your computer via your internet service provider is able
    to make a request to the server which is holding the wanted web page .With our
    file index.PHP we used PHP''s built in server facility which is a bare bones system.
    We will carry on a little further then have a look at using our own fully fledged
    web server "apache" , which will run on our machine and we will have connecting
    to it via "localhost"


    The real power of web development is when you can implement the interaction with
    a database. Data in the form of records can be stored, retrieved and so on commonly
    refereed to these days as "CRUD" operations .


    We Will have an initial look at that to show at least that its maybe not as difficult
    as you thought.


    We will do it using sqlite which is a "server-less" database meaning unlike say
    MySQL it doesn''t need a daemon running in the background for it. Don''t make
    the cognitive distortion that sqlite is less secure than MySQL. It depends on
    how its used. It might be harder to get access to the database directly but if
    you look at say WordPress , its extremely easy to make that CMS offer up whats
    in the database for "users" unless steps have been put in place. Mostly on most
    web sites live out there using WordPress they haven''t.


    OK lets install sqlite and a browser for it


