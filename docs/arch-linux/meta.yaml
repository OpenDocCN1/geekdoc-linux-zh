    使用菜单 文件 -> 打开数据库，你应该看到 myDatabase.db 被高亮显示。点击打开按钮。你应该看到这样。它显示 GUI 已经打开了我们的数据库
    myDatabase.db，但里面什么都没有。所以接下来，看图片左侧，你可以看到"创建表"


