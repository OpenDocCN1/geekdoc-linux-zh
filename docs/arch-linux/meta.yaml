- md: " A part of the software which gets your operating system up and running is\
    \ a boot manager. I have used Lilo boot manager with Slackware but probably the\
    \ most common boot manager is Grub, which stands for GRand Unified Bootloader.\
    \ You can read all about grub at:\n\n[https://www.gnu.org/software/grub/](https://www.gnu.org/software/grub/)\n\
    \nIf there are grub issues then the Arch operating system will not boot up, you\
    \ may be able to get to a\n\n**grub >**\n\nwhich is a grub prompt, which is a\
    \ command line scenario; you can fix issues from that prompt but it's probably\
    \ not a situation you want to find yourself in.\n\nFor general issues of the core\
    \ operating system including Grub a better idea is to have a back up plan and\
    \ the means to implement the plan and the knowledge to use what you have set up.\
    \ It's not a nice feeling when you don't know anything about grub, how to navigate\
    \ around, understand what you're looking at if you have never been dropped into\
    \ that situation before. It's not a nice learning curve I can tell you.\n\nSo\
    \ I will look at some approaches of what you can do and prepare to get ready in\
    \ case of emergencies. If say the issue of not being able to boot to a login involves\
    \ only the boot manager, then if it were possible to boot up the system and login\
    \ then it would be possible to fix the boot manager since you would have a running\
    \ system up with all tools available.\n\n## rEFInd\n\nrEFInd is a tool that can\
    \ get your operating system up and running even if there is a problem with the\
    \ boot manager. See:\n\n[https://www.rodsbooks.com/refind/index.html](https://www.rodsbooks.com/refind/index.html)\n\
    \nTo use it we are going to download a USB flash drive image file from: [https://www.rodsbooks.com/refind/getting.html](https://www.rodsbooks.com/refind/getting.html)\n\
    \nSpecifically we will \"DD\" file refind-flashdrive-0.13.3.2.img to a USB stick\
    \ which we can then use to boot up our OS. rEFInd as the name suggests works with\
    \ 64 bit computers that have a gpt table, an EFI partition and files such as grub.efi\
    \ which it is not only good at finding but also uses to boot up your system.\n\
    \nSo as before attach a virgin USB stick to your PC and find the block device\
    \ name the PC understands. E.g. use from a terminal prompt: fdisk -l\n\nlet's\
    \ say my USB is /dev/sdc then command for me is:\n\n```\nsudo dd if=/path/to/refind-flashdrive-0.14.2.img\
    \ of=/dev/sdc\n```\n\n[note no spaces between if, equals sign and /path]\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_39_0.png)\n\
    \nOnce booted up rEFInd will show as above what it has found in the form of icons.\
    \ In this one Ubuntu is found and is highlighted.\n\nHitting the return would\
    \ attempt it to boot up Ubuntu.\n\nOn image right it shows options and that it\
    \ found Arch.\n\nBy the way in a communication from Rodney he told me if on seeing\
    \ the boot option you hit the F10 key then a snapshot image will be taken of the\
    \ options you can see and put that image in the root system\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_39_1.png)\n\
    \nTo use your rEFInd on USB stick attach it to your PC; then power down your PC.\
    \ As soon as you have hit the power up button, hit the key which will give you\
    \ boot options; in the case of my H.P laptop the key is F9.\n\nLook for the first\
    \ entry that you see mentioning a USB e.g.: USB hard drive (uefi) Kingston\n\n\
    make sure it's highlighted and hit return key.\n\nIf you can get your Arch OS\
    \ up, then you can start to see if anything is amiss with boot entry. You can\
    \ do that using \"efibootmgr\" which is available in the main repositories, so\
    \ you can install it using pacman.\n\n```\n[andrew@darkstar:~]$ efibootmgr\nBootCurrent:\
    \ 0000\nTimeout: 15 seconds\nBootOrder: 0000,9999\nBoot0000* GRUB\tHD(1,GPT,96fb1b5b-4349-4cce-bcea-5330528e2565,0x800,0xc7000)/File(\\\
    EFI\\GRUB\\grubx64.efi)\n```\n\nI've cleaned mine up quite a bit. OK Boot order\
    \ is 0000,9999 which is good. Suppose you find the boot order is: 9999,0000\n\n\
    To change boot order to the one you want in my case 0000 command would be:\n\n\
    ```\nsudo efibootmgr -o 0000,9999\n```\n\n[where o is a lowercase letter o, not\
    \ a zero!]\n\nto delete say entry 9999 it would be:\n\n```\nsudo efibootmgr -b\
    \ 9999 -B 9999\n```\n\nOK so that's one thing you can set up and try if you can't\
    \ boot up. Another approach as you will have seen if have come from Windows, as\
    \ most people do, then you will have seen its \"restore\" capability.\n\nIn simple\
    \ terms a snapshot of the system is taken when things are running as they should.\
    \ If things go wrong then the concept is to put the system back to the snapshot\
    \ when everything was working fine.\n\nThe slight problem is that if say you find\
    \ you can not get your system up and running you might find it a tad difficult\
    \ to use a none running system and shift it back to when it was running.\n\nThe\
    \ approach where you would be able to do that would be to use your computer to\
    \ boot from a Linux Distribution appropriately installed onto a USB stick. Using\
    \ the operating system from the USB stick, you would be able to access a program\
    \ if it existed to find a snapshot of the main computer operating system when\
    \ it was running properly and to restore the system to that snapshot.\n\nWell\
    \ a program that can take snapshots either at regular scheduled times or when\
    \ you want is called Timeshift. It can also be used to restore a computer operating\
    \ system back to a snapshot.\n\n## Timeshift\n\nSo timeshift is a nifty program\
    \ that can help you revert your PC back to a point when Arch was working. In order\
    \ to do that you need to have a couple of things in place:\n\n1. You need to have\
    \ Timeshift installed on your working computer\n\n2. You need to have Timeshift\
    \ on your working computer configured so that it knows where to place a \"snapshot\"\
    \ of your computer when it was all working properly.\n\n3. You need to have that\
    \ snapshot stored somewhere where it can be accessed easily\n\n4. You also need\
    \ to have Timeshift available as a default program of a Linux distribution which\
    \ is appropriately installed onto a USB stick.\n\nSo let's address the requirements:\n\
    \nNot that long ago to install Timeshift on Arch you had to go to the AUR, which\
    \ meant I had to explain how to get a package from the AUR and then install it.\
    \ Now it is available from the main repositories so you can install it using pacman.\n\
    \n```\n[andrew@darkstar:~]$ sudo pacman -S timeshift\n```\n\nA Timeshift snapshot\
    \ needs to be stored somewhere; a good place is on the hard drive of the computer\
    \ itself. To demonstrate how I set up my computer let me show you an image.\n\n\
    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_41_0.png)\n\nIf you look at the image\
    \ which it's using gParted to show the partitions I have on the laptop I'm writing\
    \ this book with. You will see I have the usual EFI partition, swap, root, home\
    \ and then lastly I have a partition of file type ext4, of size circa 27 Gig dedicated\
    \ to snapshots for Timeshift.\n\nPreviously I have used SD cards and other options\
    \ to store the Timeshift snapshots, but this way it's all in one place, won't\
    \ get lost and I have found creating Timeshift snapshots very fast with this approach.\
    \ Now my experience is that a single Timeshift snapshot is going to take up to\
    \ circa 8gig of file space. I have allocated enough space for roughly 3 snapshots.\
    \ I don't need more file space since before I create a new snapshot I use Timeshift\
    \ to remove the very oldest snapshot. To set up Timeshift select from main menu.\
    \ Mouse left click on the Wizard icon.\n\n### Set up Timeshift\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_42_0.png)\n\
    \nIf you look at the menu in the image on the left, you can see that there are\
    \ menu icons to create, restore and browse.\n\nBefore you can use Timeshift it\
    \ needs to be set up to tell it where snapshots are going to be saved and in what\
    \ file format. So before doing anything click on the wizard icon.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_42_1.png)\n\
    \nOn clicking the wizard icon you get a choice as in the image on the left.\n\n\
    Since our file system on our install is ext4, we will select using rsync; in fact\
    \ it's selected for us.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_0.png)\n\
    \nHere Timeshift is showing suitable location for storing snapshots.\n\nAs has\
    \ been seen I have set up a dedicated partition for snapshots being /dev/sda5.\
    \ So I made that selection and clicked next.\n\nTimeshift now asks for frequency\
    \ of auto creation of snapshots; personally I unselect everything on the left.\
    \ That's because I like to manually remove the oldest snapshot, before I create\
    \ a new snapshot. I also tend to synch Timeshift snapshot with my work flow.\n\
    \nUsually that is after there has been a full system update.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_1.png)\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_2.png)\n\nTimeshift will then ask\
    \ about home directories of users. The directory of \"root\" in the image left\
    \ is not the root, where the operating system is installed. Rather it is the personal\
    \ directory for root user. Who's Dorothy by the way. Ok I'm writing this book\
    \ on a friends laptop.\n\nFiles in the personal directory for root and for Dorothy\
    \ will have no affect on what's needed to boot, that's why I have excluded them."
  mdcn: "\n操作系统得以启动运行的一部分软件是引导管理器。我曾在 Slackware 上使用过 Lilo 引导管理器，但最常见的引导管理器可能是 Grub，即\
    \ GRand Unified Bootloader（大统一引导加载器）。你可以在以下网址详细了解 grub：\n\n[https://www.gnu.org/software/grub/](https://www.gnu.org/software/grub/)\n\
    \n如果 grub 出现问题，Arch 操作系统将无法启动，你可能会进入一个\n\n**grub >**\n\ngrub 提示符，即命令行场景；你可以在这个提示符下修复问题，但这很可能不是你希望遇到的情况。\n\
    \n对于包括 Grub 在内的核心操作系统常见问题，更好的做法是准备一个备用计划，并具备实施该计划的方法以及使用所搭建工具的知识。当你对 grub 一无所知、不知道如何操作、在从未经历过的情况下不理解眼前的内容时，那种感觉可不太好。我可以告诉你，这绝不是一个愉快的学习曲线。\n\
    \n因此，我将介绍一些你可以采取的方法，为紧急情况做好准备。假设无法启动到登录界面的问题仅涉及引导管理器，那么如果能启动系统并登录，就可以修复引导管理器，因为你将拥有一个正在运行的系统，所有工具都可以使用。\n\
    \n## rEFInd\n\nrEFInd 是一个工具，即使引导管理器出现问题，它也能让你的操作系统正常启动运行。参见：\n\n[https://www.rodsbooks.com/refind/index.html](https://www.rodsbooks.com/refind/index.html)\n\
    \n要使用它，我们需要从以下地址下载一个 USB 闪存驱动器镜像文件：[https://www.rodsbooks.com/refind/getting.html](https://www.rodsbooks.com/refind/getting.html)\n\
    \n具体来说，我们将使用 \"DD\" 命令将文件 refind-flashdrive-0.13.3.2.img 写入 USB 闪存盘，然后就可以用它来启动我们的操作系统。rEFInd\
    \ 顾名思义适用于具有 GPT 分区表、EFI 分区以及 grub.efi 等文件的 64 位计算机，它不仅能很好地找到这些文件，还能使用它们来启动你的系统。\n\
    \n和之前一样，将一个全新的 USB 闪存盘连接到你的电脑，并找到电脑识别的块设备名称。例如，在终端提示符下使用：fdisk -l\n\n假设我的 USB\
    \ 是 /dev/sdc，那么我的命令是：\n\n```\nsudo dd if=/path/to/refind-flashdrive-0.14.2.img\
    \ of=/dev/sdc\n```\n\n[注意 if、等号和 /path 之间没有空格]\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_39_0.png)\n\
    \n启动后，rEFInd 将以上图所示的形式，通过图标展示它所找到的内容。在这张图中，Ubuntu 被找到并高亮显示。\n\n按下回车键将尝试启动 Ubuntu。\n\
    \n在右侧的图片中显示了选项，并且发现了 Arch。\n\n顺便说一下，Rodney 在一次沟通中告诉我，如果你在看到启动选项时按下 F10 键，就会对你所看到的选项进行截图，并将该截图保存到根系统中。\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_39_1.png)\n\n要使用 USB 闪存盘上的 rEFInd，将其连接到你的电脑，然后关闭电脑电源。在你按下开机按钮后，立即按下能给你提供启动选项的按键；在我的惠普笔记本电脑上，这个按键是\
    \ F9。\n\n找到你看到的第一个提及 USB 的条目，例如：USB hard drive (uefi) Kingston\n\n确保它被高亮显示，然后按下回车键。\n\
    \n如果你能启动 Arch 操作系统，就可以开始检查启动项是否有问题。你可以使用 \"efibootmgr\" 来完成，它在主软件仓库中可用，因此可以使用\
    \ pacman 安装。\n\n```\n[andrew@darkstar:~]$ efibootmgr\nBootCurrent: 0000\nTimeout:\
    \ 15 seconds\nBootOrder: 0000,9999\nBoot0000* GRUB\tHD(1,GPT,96fb1b5b-4349-4cce-bcea-5330528e2565,0x800,0xc7000)/File(\\\
    EFI\\GRUB\\grubx64.efi)\n```\n\n我已经对我的输出做了不少清理。好的，启动顺序是 0000,9999，这很好。假设你发现启动顺序是：9999,0000\n\
    \n要将启动顺序更改为你想要的，在我的情况下是 0000，命令如下：\n\n```\nsudo efibootmgr -o 0000,9999\n```\n\
    \n[其中 o 是小写字母 o，不是数字零！]\n\n要删除某个条目，比如 9999，命令是：\n\n```\nsudo efibootmgr -b 9999\
    \ -B 9999\n```\n\n好的，这是你可以设置并在无法启动时尝试的一个方法。另一个方法，如果你从 Windows 过来的话，就像大多数人一样，你可能已经见过它的\"\
    恢复\"功能。\n\n简单来说，当系统运行正常时，会对系统进行一次快照。如果出了问题，其概念就是将系统恢复到一切正常运行时的快照状态。\n\n稍微有点麻烦的是，假设你发现无法启动系统，你可能会发现用一个无法运行的系统将其恢复到之前运行时的状态有些困难。\n\
    \n你能做到这一点的方法是使用一台已适当安装了 Linux 发行版到 USB 闪存盘的电脑来启动。使用 USB 闪存盘上的操作系统，你将能够访问一个程序（如果存在的话），找到主计算机操作系统正常运行时的快照，并将系统恢复到该快照状态。\n\
    \n嗯，一个能够在定期计划时间或在你需要时创建快照的程序叫做 Timeshift。它也可以用于将计算机操作系统恢复到某个快照。\n\n## Timeshift\n\
    \n所以 Timeshift 是一个很棒的程序，可以帮助你将电脑恢复到 Arch 正常工作的某个时间点。为此，你需要做好以下几件事：\n\n1.  你需要在正常工作的电脑上安装\
    \ Timeshift\n\n2.  你需要在正常工作的电脑上配置 Timeshift，使其知道在电脑正常运行时将\"快照\"保存到哪里。\n\n3.  你需要将该快照存储在便于访问的地方\n\
    \n4.  你还需要让 Timeshift 作为已适当安装到 USB 闪存盘上的 Linux 发行版的默认程序可用。\n\n那么让我们来解决这些需求：\n\n\
    不久前，在 Arch 上安装 Timeshift 需要去 AUR，这意味着我必须解释如何从 AUR 获取软件包并安装它。现在它已可从主软件仓库获取，因此可以使用\
    \ pacman 安装。\n\n```\n[andrew@darkstar:~]$ sudo pacman -S timeshift\n```\n\nTimeshift\
    \ 快照需要存储在某个地方；一个好地方就是电脑本身的硬盘上。为了演示我是如何设置电脑的，让我展示一张图片。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_41_0.png)\n\
    \n如果你看这张图片，它使用 gParted 显示了我用来写这本书的笔记本电脑上的分区。你会看到我有通常的 EFI 分区、交换分区、根分区、home 分区，最后我还有一个文件类型为\
    \ ext4、大小约 27G、专门用于 Timeshift 快照的分区。\n\n之前我使用过 SD 卡和其他选项来存储 Timeshift 快照，但这种方式所有东西都在一个地方，不会丢失，而且我发现用这种方式创建\
    \ Timeshift 快照非常快。根据我的经验，单个 Timeshift 快照最多占用约 8G 的文件空间。我已经分配了足够的空间来存储大约 3 个快照。我不需要更多文件空间，因为在创建新快照之前，我会使用\
    \ Timeshift 删除最旧的快照。要设置 Timeshift，从主菜单中选择。鼠标左键单击向导图标。\n\n### 设置 Timeshift\n\n\
    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_42_0.png)\n\n如果你看左侧图片中的菜单，你可以看到有创建、恢复和浏览的菜单图标。\n\
    \n在使用 Timeshift 之前，需要先设置它，告诉它快照将保存到哪里以及使用什么文件格式。因此在进行任何操作之前，先点击向导图标。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_42_1.png)\n\
    \n点击向导图标后，你会看到如左侧图片所示的选项。\n\n由于我们安装的文件系统是 ext4，我们将选择使用 rsync；实际上它已经为我们选好了。\n\n\
    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_0.png)\n\n这里 Timeshift 显示了存储快照的合适位置。\n\
    \n如前所述，我已经为快照设置了一个专用分区 /dev/sda5。所以我做出了该选择并点击了下一步。\n\nTimeshift 然后会询问自动创建快照的频率；我个人取消选择左侧的所有选项。这是因为我喜欢在创建新快照之前手动删除最旧的快照。我也倾向于将\
    \ Timeshift 快照与我的工作流程同步。\n\n通常是在完成完整的系统更新之后。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_1.png)\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_43_2.png)\n\n然后 Timeshift 会询问关于用户主目录的问题。左侧图片中的\
    \ \"root\" 目录并非操作系统安装所在的根目录，而是 root 用户的个人目录。顺便说一下，root 的名字是 Dorothy。好吧，我是在朋友的笔记本电脑上写这本书的。\n\
    \nroot 和 Dorothy 的个人目录中的文件对启动所需的内容没有影响，这就是为什么我把它们排除在外了。\n"
