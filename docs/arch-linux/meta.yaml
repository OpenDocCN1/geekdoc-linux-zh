    \ $primaryKey = 'Id';\n    protected $allowedFields = ['Item','Price'];\n    protected\
    \ $db;\n    public function getAll()\n    {\n        $this->db = \\Config\\Database::connect();\n\
    \        return $this->findAll();\n    }\n}\n```\n\n有几件事需要注意，Model 类有一些内置功能，所以我们将利用它们来获取数据。我们定义了表名、主键名称和其他字段。在控制器中，我们将实例化上述模型，并使用实例化的对象来获取数据。控制器\
    \ Datacontroller 中的代码现在是：\n\n```\n<?php namespace App\\Controllers;\nuse CodeIgniter\\\
