  - '[PAGE 48]


    # Linux on USB - Swiss Army Knife


    To try and make the learning curve less steep I previously suggested putting Linux
    Mint along with the Arch install ISO onto a USB stick. That''s because Timeshift
    is installed as a package as default, so you wouldn''t have to mess about with
    trying to install it.


    With a fully installed Linux distribution on your computer hard drive, when you
    install software its there when you boot up. Linux distributions used live via
    a USB stick behave slightly differently, they are running in RAM; you can install
    additional extra software that comes with the ISO and use it it but it will be
    gone next time you boot up from the USB stick . Its all to do with the way that
    Linux in the form of an ISO run in RAM which is ethereal .


    A Linux distribution on a USB stick can be a very effective Swiss Army knife;
    you can use gParted to graphically format hard drives, run fsck which can scan
    the file system on your computer hard drive for errors and also fix them.


    I found that there were a few programs i wanted which were not installed by default
    and I wanted them there to be there ready when ever I booted the Linux distribution
    from the USB. So now I''m going to look at how you can use Ventoy with a USB stick
    for a Linux Live distribution ISO and get persistence with it.


    There are things you can do from Linux running from a USB stick that you can not
    do from a Linux distribution running from your hard drive.


    One of them is running the command fsck such as


    ```

    $ sudo fsck -vy /dev/sda2

    ```


    In the above /dev/sda2 is one of the partitions on my laptop. You can not run
    fsck directly on partitions of your laptop while working from the running operating
    system that has fsck; that''s because in order to be able to run fsck on a partition
    , that partition has to be unmounted; a partition on a running Linux distribution
    on your laptop is in use and mounted.


    There is a way to get a live Linux OS on a USB stick to remember your WiFi settings
    and also retain , anything you found you needed to download and install .


    There will be a little More work to do with Ventoy; it involves creating a .dat
    file for persistence and adding a Ventoy.json entry. I think its worth it , since
    with the combination of having Kali live with persistence, you can prepare and
    have ready at your side a Swiss army knife ready to use to fix things. I am going
    to give you the bare bones of what you need , but you can see further information
    at the Ventoy site.


    https://www.ventoy.net/en/plugin.html

    https://www.ventoy.net/en/plugin_entry.html'
  - "[PAGE 49]\n\nNow I guess the first question is going to be:\n\nOK we know Linux\
    \ operating systems in the form of an ISO file will boot up and run from a USB\
    \ stick, but which Linux distribution candidates look good in that they are responsive\
    \ in terms of being fast, have a lot of stuff already installed and they also\
    \ work well with file created to make them have persistence?\n\nWell I can save\
    \ you a lot of time and trouble ; I have played around with different Linux live\
    \ OS on USB sticks, with Ventoy I found Kali Linux to work well, when booted up\
    \ and you run commands from a terminal they operate with \"root\" power. Also\
    \ I found that if you want to save something on the Desktop area of your none\
    \ running PC operating system, such as an image screen shot, Kali Linux will put\
    \ it there without moaning.\n\nWith Mint you get \"permission denied\" and you\
    \ don't want to have to faff about when you have a problem. Once i got the right\
    \ command to create the appropriate dat file for kali, it worked a treat.\n\n\
    Let me give you an overview of what you need and what you can have. Can you have\
    \ Kali Linux on the same USB stick as the Arch install ISO and still have persistence-\
    \ yes you can.First I will show you the structure of a USB stick with Kali Linux\
    \ where persistence works.\n\nI suggest going for a USB stick of 16Gig ; you don't\
    \ have to put it onto the stick with the Arch ISO by the way, instead you can\
    \ have around 4 to 5 different Distros all on the same stick. You can have some\
    \ without persistence facility and some with. Its all about how you set up the\
    \ structure, have the right files in place, then configure the file Ventoy.json\
    \ below I use the tree command from a terminal to get the structure layout of\
    \ whats on my ventoy formatted stick:\n\n```\n[andrew@darkstar:media/andrew]$\
    \ tree -L 2 Ventoy\n```\n\n```\nVentoy\n├── ISO\n│   └── kali-linux-2022.4-live-amd64.iso\n\
    ├── persistence.dat\n└── ventoy\n    └── ventoy.json\n```\n\nIn the above \"Ventoy\"\
    \ is the label for the USB stick when attached to my laptop. On my Arch laptop\
    \ it mounts to :\n\n```\n/run/media/andrew/Ventoy\n```"
- md: " So inside the Ventoy directory, there are 2 directories one called \"ISO\"\
    \ and the other \"ventoy\". When i first played with Ventoy i found that confusing;\
    \ you have a USB stick with the label \"Ventoy\" and a directory inside called\
    \ \"ventoy\". Inside the ISO directory is where you drag and drop your Live Linux\
    \ ISO files.\n\nIn the Ventoy directory there is a single file called ventoy.json\
    \ and a persistence.dat file at the same level as the ventoy & ISO directories.\n\
    \nBy default the Ventoy system will look first in any directory called \"ISO\"\
    \ for ISO files. You have to create the persistence.dat using scripts in the unpacked\
    \ files you got from:\n\n[https://github.com/ventoy/Ventoy/releases](https://github.com/ventoy/Ventoy/releases)\n\
    \nUsing Linux to create the dat file using a terminal where, you have changed\
    \ directories to the unpacked Ventoy download it would be:\n\n```\nsudo ./CreatePersistentImg.sh\
    \ -l persistence -c persistence.conf\n```\n\nThat will create a dat file called\
    \ \"persistence.dat\" inside the unpacked ventoy download file, at the same place\
    \ where the script CreatePersistentImg.sh resides. If you get any failure to run\
    \ run this command from a terminal prompt Eg:\n\n```\n[andrew@darkstar:~]$ sudo\
    \ chmod +x CreatePersistentImg.sh\n```\n\nThat will give execute permission to\
    \ the script\n\nAny issues you get with read write to the persistence.dat file\
    \ you can use:\n\n```\n[andrew@darkstar:~]$ chmod 666 persistence.dat\n```\n\n\
    So now just drag and drop the CreatePersistentImg.sh onto your Ventoy formatted\
    \ stick.\n\nThe last bit is to create a ventoy.json file with some data, which\
    \ basically lets the Ventoy system know which Linux ISO is going to use the dat\
    \ file. You can use a text editor to both create the ventoy.json file and populate\
    \ it with what I'm going to show you bellow.\n\ncontents of my ventoy.json file:\n\
    \n```\n{\n  \"control\": [\n    { \"VTOY_DEFAULT_MENU_MODE\": \"0\" },\n    {\
    \ \"VTOY_filt_DOT_UNDERSCORE_FILE\": \"1\" },\n    { \"VTOY_DEFAULT_SEARCH_ROOT\"\
    : \"/ISO\" }\n  ],\n\n  \"persistence\": [\n    {\n      \"image\": \"/ISO/kali-linux-2022.4-live-amd64.iso\"\
    ,\n      \"backend\": \"/persistence.dat\"\n    }\n  ]\n\n}\n```\n\nThe first\
    \ few lines describe basic things for the Ventoy system. I for instance define\
    \ that the default place to look for ISO files in in the ISO directory. In the\
    \ persistence block i state the ISO that should use the persistence.dat file.\
    \ Its an easy file to get wrong. You can use json verify software on the web to\
    \ make sure syntax is correct. I think new versions even come with a new script\
    \ to help with that.\n\nNow because it has been configured for kali to have persistence\
    \ you could if you wanted actually update the OS on the USB stick via:\n\n```\n\
    kali@kali:~$  sudo apt update\nkali@kali:~$ sudo apt full-upgrade    -y\n```\n\
    \nHowever using lateral thinking its best to just replace the ISO file with an\
    \ updated one and re-generate the dat file\n\n## Post Install\n\n### Initial Look\
    \ at Maintenance\n\nI don't know about you but when i am given or I purchase something\
    \ new, I have a bit of a Donald R愿sfeld moment. With a Linux Operating system\
    \ on say a laptop, the known knows are, my laptop needs to have power in order\
    \ for my Linux operating system to keep running. Do I have my laptop battery re-charging\
    \ unit plugged in and its working.\n\nThen there are known unknowns; i guess I\
    \ will have to keep the operating system updated. Lastly - anything i will have\
    \ to do to keep my operating system trim or that may cause an issue.\n\nWell on\
    \ updating your system, I previously mentioned you have to initiate the pacman\
    \ keys. The the main total system update command for Arch Linux is simply:\n\n\
    ```\n[andrew@darkstar:~]$ sudo pacman -Syu\n```\n\nNow you can find out, what\
    \ can cause a problem by experience but I will tell you what I have found needed\
    \ attending to. I guess we are going to have a cursory look at systemd and it\
    \ associated useful commands. I will use a metaphor of a car and a car stater\
    \ engine.\n\nWith a car you can imagine that if there is a bit of inertia, then\
    \ to get a car engine going it needs a bit of a push so to speak. That's putting\
    \ it quite simply; but it is a fact that cars have a \"starter engine\" that does\
    \ just that.\n\nOK now if we apply loosely the same idea to a computer, you might\
    \ imagine that to get a computer operating system up and running there are going\
    \ to be various steps and stages.\n\nWithout being too complicated computers use\
    \ virtual memory or RAM; in order for a computer operating system to be running,\
    \ well first it needs to be loaded, read and executed. With older Linux Distros\
    \ (and still today Slackware 15) the initial program was init; that runs the the\
    \ /etc/rc.d/rc.S script which enables the virtual memory and mounts the file systems.\n\
    \nNothing stays still they say and another approach to starting and managing a\
    \ computer operating system was introduced. Systemd was developed by Lennart Poettering\
    \ and Kay Sievers in 2010 and has since become the default init system for many\
    \ Linux distributions. As mentioned one of the oldest Linux distributions which\
    \ does not use systemd is Slackware. Now I was a user and contributor (still am\
    \ technically) to maintaining slackbuilds; on the forums comments can be seen\
    \ along the lines of \"i would rather die first than use systemd\".\n\nYep nerds\
    \ can get a little bit melodramatic at time. Time for an admission, I quite like\
    \ systemd in that its quite straight forward to use very productively\n\nSo to\
    \ round off, systemd (for those Linux distros that use it) is a system that initiates\
    \ the running of a Linux operating system and helps manage it. With the management\
    \ system is something called journalctl. You will see quite a few options if you\
    \ run this command:\n\n```\n[andrew@darkstar:~]$ journalctl --help\n```\n\nAnyway\
    \ you could imagine that the developer of the systemd system would definitely\
    \ thought about how a user is going to get information about anything going on.\
    \ Well systemd produces all the time log files. They are extremely useful because\
    \ if you get any glitch with your system you can use commands to filter the logs\
    \ to help find out, what the problem is.\n\nFrom a maintenance problem, the amount\
    \ of log files is quite considerable and they take up disc space. When you get\
    \ a problem your definitely going to look at recent log files and then really\
    \ you don't need those old log files. Being succinct you only really need to keep\
    \ an amount of recent log files, because you looked at the old ones connected\
    \ to problems didn't you! Run this command to see how much journal log files are\
    \ taking up:\n\n```\n[andrew@darkstar:~]$ journalctl --disk-usage\n```\n\nSo this\
    \ command you definitely need to run maybe weekly:\n\n```\n[andrew@darkstar:~]$\
    \ sudo journalctl --vacuum-size=10M\n```\n\nWhat the above command from a terminal\
    \ does is reduce the volume of journal log records to 10 megabytes. Later I will\
    \ looking at commands i have found to be useful including leveraging the journalctl\
    \ command.\n\nNow another area that can eat up disk space is connected to the\
    \ Arch Linux updating process. Run this command:\n\n```\n[andrew@darkstar:~]$\
    \ ls /var/cache/pacman/pkg\n```\n\nYou will see a load of files; an example of\
    \ a file in my system is:\n\n```\nwebkit2gtk-2.40.0-2-x86_64.pkg.tar.zst\n```\n\
    \nFor your information zst file like the above is exactly the same type of file\
    \ produced when you get a PKGBUILD file from the ARCH AUR for example I got a\
    \ PKGBUILD for sqliteman from\n\nhttps://aur.archlinux.org/packages?O=0&K=sqliteman\n\
    \nThe file produced was:\n\n```\nsqliteman-1.2.2-12-x86_64.pkg.tar.zst\n```\n\n\
    So you might guess that zst files are a package form in which software can be\
    \ installed from. The idea of /var/cache/pacman/pkg is that it keeps copies of\
    \ older zst files in case you get a glitch with the most current. You can revert\
    \ to the older working version. However you only need to keep a few recent versions.\n\
    \nWe can from a terminal use a utility called paccache which will help us trim\
    \ the number of versions of packages kept in /var/cache/pacman/pkg to the number\
    \ of versions we want. But first we need to install a package that its part of.\n\
    \nInstall pacman-contrib via:\n\n```\n[andrew@darkstar ~]$ sudo pacman -S pacman-contrib\n\
    ```\n\nNow to trim all packages in /var/cache/pacman/pkg to say 2 versions:\n\n\
    ```\n[andrew@darkstar:~]$ sudo paccache -rk 2\n```\n\nThe command will also tell\
    \ you have much space it has freed up; now taking into account you need to run\
    \ pacman -Syu frequently then you should also run paccache frequently. A quick\
    \ word why you need to run pacman -Syu often. it hasn't happened to me but to\
    \ put it succinctly Arch Linux is a rolling release and boy is there a quick turnaround\
    \ on new versions of the kernel and packages.\n\nIn theory if you get too far\
    \ behind there build up a glitch of packages that can not be updated, because\
    \ you never got the updates for the ones you need. Another consideration I have\
    \ found is the size of the update and the number of packages involved. Due to\
    \ budget I got a laptop with a very small hard drive of 60Gig.i have everything\
    \ I need but at times things have got tight. So it prudent of me to get updates\
    \ often and thus in smaller amounts.\n\nAfter updates i then trim /var/cache/pacman/pkg\n\
    \nThe other place that bloat can build up is in your user .cache space. To see\
    \ usage use this command:\n\n```\nsudo du -sh ~/.cache/\n```\n\nTo clean your\
    \ user cache, logged in as a normal user:\n\n```\n[andrew@darkstar:~]$ rm -rf\
    \ ~/.cache/*\nzsh: sure you want to delete all 8 files in /home/andrew/.cache\
    \ [yn]? y\n```"
  mdcn: "\n所以在 Ventoy 目录内，有两个目录，一个叫\"ISO\"，另一个叫\"ventoy\"。我第一次使用 Ventoy 时就觉得很困惑；你的\
    \ U 盘标签是\"Ventoy\"，而里面又有个目录叫\"ventoy\"。ISO 目录则是你拖放 Live Linux ISO 文件的地方。\n\n在\
    \ Ventoy 目录中，有一个名为 ventoy.json 的单独文件，以及一个 persistence.dat 文件，它们与 ventoy 和 ISO\
    \ 目录位于同一层级。\n\n默认情况下，Ventoy 系统会首先在名为\"ISO\"的目录中查找 ISO 文件。你需要使用从以下地址下载的解压文件中的脚本来创建\
    \ persistence.dat：\n\n[https://github.com/ventoy/Ventoy/releases](https://github.com/ventoy/Ventoy/releases)\n\
    \n使用 Linux 通过终端创建 dat 文件时，你需要先切换到解压后的 Ventoy 下载目录，然后执行：\n\n```\nsudo ./CreatePersistentImg.sh\
    \ -l persistence -c persistence.conf\n```\n\n这会在解压后的 ventoy 下载文件中创建一个名为\"persistence.dat\"\
    的 dat 文件，位置与 CreatePersistentImg.sh 脚本相同。如果在终端中运行此命令时遇到任何失败，例如：\n\n```\n[andrew@darkstar:~]$\
    \ sudo chmod +x CreatePersistentImg.sh\n```\n\n这将为脚本赋予执行权限。\n\n如果在读写 persistence.dat\
    \ 文件时遇到任何问题，你可以使用：\n\n```\n[andrew@darkstar:~]$ chmod 666 persistence.dat\n```\n\
    \n现在只需将 CreatePersistentImg.sh 拖放到格式化为 Ventoy 的 U 盘上即可。\n\n最后一步是创建一个包含一些数据的 ventoy.json\
    \ 文件，这基本上让 Ventoy 系统知道哪个 Linux ISO 将使用 dat 文件。你可以使用文本编辑器来创建 ventoy.json 文件并填入我下面要展示的内容。\n\
    \n我的 ventoy.json 文件内容：\n\n```\n{\n  \"control\": [\n    { \"VTOY_DEFAULT_MENU_MODE\"\
    : \"0\" },\n    { \"VTOY_filt_DOT_UNDERSCORE_FILE\": \"1\" },\n    { \"VTOY_DEFAULT_SEARCH_ROOT\"\
    : \"/ISO\" }\n  ],\n\n  \"persistence\": [\n    {\n      \"image\": \"/ISO/kali-linux-2022.4-live-amd64.iso\"\
    ,\n      \"backend\": \"/persistence.dat\"\n    }\n  ]\n\n}\n```\n\n前几行描述了 Ventoy\
    \ 系统的基本设置。例如，我定义了查找 ISO 文件的默认位置是 ISO 目录。在 persistence 块中，我指定了应该使用 persistence.dat\
    \ 文件的 ISO。这个文件很容易出错。你可以使用网上的 json 验证软件来确保语法正确。我认为新版本甚至附带了一个新脚本来帮助完成这项工作。\n\n现在，由于它已为\
    \ Kali 配置了持久化，如果你愿意，实际上可以通过以下方式更新 U 盘上的操作系统：\n\n```\nkali@kali:~$  sudo apt update\n\
    kali@kali:~$ sudo apt full-upgrade    -y\n```\n\n不过，运用横向思维，最好还是直接用更新后的 ISO 文件替换旧的，然后重新生成\
    \ dat 文件。\n\n## 安装后\n\n### 初步了解维护\n\n我不知道你的情况如何，但当别人给我或我自己购买新东西时，我会有点像唐纳德·拉姆斯菲尔德时刻。就拿笔记本电脑上的\
    \ Linux 操作系统来说，**已知的已知**是，我的笔记本电脑需要供电才能让 Linux 操作系统持续运行。我是否插上了笔记本电脑的充电单元，并且它正在工作。\n\
    \n然后是**已知的未知**；我想我得保持操作系统更新。最后是——任何我需要做的来保持操作系统精简或可能导致问题的事情。\n\n关于更新系统，我之前提到过你必须初始化\
    \ pacman 密钥。Arch Linux 的主要完整系统更新命令很简单：\n\n```\n[andrew@darkstar:~]$ sudo pacman\
    \ -Syu\n```\n\n现在你可以通过经验发现什么可能导致问题，但我会告诉你我发现需要注意的事项。我想我们要粗略地看一下 *systemd* 及其相关的有用命令。我将使用汽车和汽车启动马达的比喻。\n\
    \n对于汽车，你可以想象如果有一点惯性，那么要让汽车引擎运转起来，就需要推一把，可以这么说。说得很简单；但事实是汽车有\"启动马达\"就是干这个的。\n\n\
    好吧，现在如果我们粗略地将同样的想法应用到计算机上，你可能会想象要让计算机操作系统启动并运行，会有各种步骤和阶段。\n\n不必太复杂地说，计算机使用虚拟内存或\
    \ RAM；为了让计算机操作系统运行，首先需要加载、读取和执行它。在较老的 Linux 发行版中（以及今天仍然如此，如 Slackware 15），初始程序是\
    \ init；它运行 /etc/rc.d/rc.S 脚本，启用虚拟内存并挂载文件系统。\n\n俗话说没有什么是一成不变的，另一种启动和管理计算机操作系统的方法被引入了。Systemd\
    \ 由 *Lennart Poettering* 和 *Kay Sievers* 于 2010 年开发，此后已成为许多 Linux 发行版的默认 init\
    \ 系统。如前所述，不使用 systemd 的最古老的 Linux 发行版之一是 Slackware。我曾经是 Slackbuilds 的维护者和贡献者（技术上仍然是），在论坛上可以看到类似\"\
    我宁死也不用 systemd\"的评论。\n\n是的，极客们有时确实会有点戏剧化。是时候承认了，我相当喜欢 systemd，因为它使用起来相当简单且非常高效。\n\
    \n所以总结来说，*systemd*（对于那些使用它的 Linux 发行版）是一个启动 Linux 操作系统运行并帮助管理它的系统。在管理系统中有一个叫做\
    \ journalctl 的东西。如果你运行这个命令，你会看到相当多的选项：\n\n```\n[andrew@darkstar:~]$ journalctl\
    \ --help\n```\n\n无论如何，你可以想象 systemd 系统的开发者肯定会考虑用户如何获取任何正在发生的事情的信息。好吧，systemd 一直在产生日志文件。它们非常有用，因为如果你的系统出现任何故障，你可以使用命令来过滤日志以帮助找出问题所在。\n\
    \n从维护的角度来看，日志文件的数量相当可观，它们会占用磁盘空间。当你遇到问题时，你肯定会查看最近的日志文件，然后你真的不需要那些旧的日志文件。简而言之，你只需要保留一定数量的最近日志文件，因为你已经看过与问题相关的旧日志了，不是吗！运行此命令查看\
    \ journal 日志文件占用了多少空间：\n\n```\n[andrew@darkstar:~]$ journalctl --disk-usage\n\
    ```\n\n所以这个命令你肯定需要每周运行一次左右：\n\n```\n[andrew@darkstar:~]$ sudo journalctl --vacuum-size=10M\n\
    ```\n\n从终端运行上述命令的作用是将 journal 日志记录量减少到 10 兆字节。稍后我将查看我发现有用的命令，包括利用 journalctl 命令。\n\
    \n现在另一个可能耗尽磁盘空间的领域与 Arch Linux 的更新过程有关。运行此命令：\n\n```\n[andrew@darkstar:~]$ ls\
    \ /var/cache/pacman/pkg\n```\n\n你会看到一堆文件；我系统中的一个文件示例是：\n\n```\nwebkit2gtk-2.40.0-2-x86_64.pkg.tar.zst\n\
    ```\n\n供你参考，像上面的 zst 文件与当你从 ARCH AUR 获取 PKGBUILD 文件时产生的文件类型完全相同，例如我从\n\nhttps://aur.archlinux.org/packages?O=0&K=sqliteman\n\
    \n获取了 sqliteman 的 PKGBUILD。\n\n产生的文件是：\n\n```\nsqliteman-1.2.2-12-x86_64.pkg.tar.zst\n\
    ```\n\n所以你可能猜到 zst 文件是软件可以从中安装的包形式。/var/cache/pacman/pkg 的理念是保留较旧 zst 文件的副本，以防最新的版本出现问题。你可以回退到较旧的可用版本。然而你只需要保留几个最近的版本。\n\
    \n我们可以从终端使用一个叫做 paccache 的工具来帮助我们修剪 /var/cache/pacman/pkg 中保留的包版本数量到我们想要的数量。但首先我们需要安装它所属的包。\n\
    \n通过以下方式安装 pacman-contrib：\n\n```\n[andrew@darkstar ~]$ sudo pacman -S pacman-contrib\n\
    ```\n\n现在将 /var/cache/pacman/pkg 中的所有包修剪为例如保留 2 个版本：\n\n```\n[andrew@darkstar:~]$\
    \ sudo paccache -rk 2\n```\n\n该命令还会告诉你释放了多少空间；考虑到你需要经常运行 `pacman -Syu`，那么你也应该经常运行\
    \ paccache。快速说明一下为什么你需要经常运行 `pacman -Syu`：这虽然没发生在我身上，但简而言之 Arch Linux 是滚动发布，而且内核和软件包的新版本更新速度相当快。\n\
    \n理论上讲，如果你落后太多，会积累出一批无法更新的软件包，因为你从未获取所需的那些更新。我发现的另一个考虑因素是更新的大小和涉及的软件包数量。由于预算限制，我买了一台只有\
    \ 60G 硬盘的笔记本电脑。我有我需要的一切，但有时空间会很紧张。所以对我来说，经常获取更新从而每次更新量较小是明智的。\n\n更新后我会修剪 /var/cache/pacman/pkg\n\
    \n另一个可能膨胀积累的地方是你的用户 .cache 空间。要查看使用情况，使用此命令：\n\n```\nsudo du -sh ~/.cache/\n```\n\
    \n要清理你的用户缓存，以普通用户身份登录：\n\n```\n[andrew@darkstar:~]$ rm -rf ~/.cache/*\nzsh: sure\
    \ you want to delete all 8 files in /home/andrew/.cache [yn]? y\n```\n"
