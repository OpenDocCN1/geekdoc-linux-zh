- img_proc: true
  md: '# Localization


    ```

    root@archiso : / # nano /etc/locale.gen

    ```


    That command is going to open file /etc/locale.gen in nano. We touched on using
    nano earlier to try and make all this we are doing less painful. The file /etc/locale.gen
    is a file with a long list in the form of : <locale> <charset> with # in front.
    To enable any item in the list its just a matter of removing the # from the front
    of the line of your choice. My locale is Great Britain English and I want utf-8
    so , moving cursor up and down in nano i looked for #en\_GB.UTF-8 UTF-8 . I then
    positioned the cursor, in front of the # and hit my keyboard backspace key, once
    to remove the #.So the entry in my /etc/locale.gen it looks like:

    en\_GB.UTF-8 UTF-8


    Then I typed ctrl + o ,which highlights file nano is going to save to, basically
    just hit the return key to save to file. Then type ctrl + x to leave nano editor.


    # Hostname


    What is the hostname , simply put its the name of your computer, and it will be
    display on a network. So I decide my computer will be called "darkstar" its very
    original , its what ti used when i was on Slackware. So to name my computer "darkstar"
    I simply type:


    ```

    root@archiso : / # echo darkstar > /etc/hostname

    ```


    Create /etc/host file and populate it with needed minimum

    There is a command that can be used from a terminal oddly named but what it does
    is create a file with the name you give it, at the location specified. Example
    lets create /etc/hosts


    ```

    root@archiso : / # touch /etc/hosts

    ```


    Then edit our file:


    ```

    root@archiso : / # nano /etc/hosts

    ```


    Now in your nano editor type in exactly what yo see below except replace the word
    "darkstar" with the name you gave your computer


    ```

    127.0.0.1   localhost

    ::1          localhost

    127.0.1.1   darkstar.localdomain   darkstar

    127.0.0.3   joesoapdev

    ```


    > *Note*

    [

    you will edit /etc/hosts if doing web development on your PC. At the bottom line
    you see above I have added :

    127.0.0.3   joesoapdev

    Now with web sever running, if i type in ,directly into your web browser address
    bar : 127.0.0.3 then the landing page for my web dec of joesoapdev will be displayed

    ]'
