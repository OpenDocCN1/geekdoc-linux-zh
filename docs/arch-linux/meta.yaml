  md: 'And now I''m going to stop pacman updating to the package that does not work
    by editing /etc/pacman.conf so i edit /etc/pacman.conf and add the lines below


    #Pacman won''t upgrade packages listed in IgnorePkg and members of IgnoreGroup

    IgnorePkg=calibre


    Then i will test to see if that works :


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu              (04-19 10:31)

    :: Synchronising package databases...

    core is up to date

    extra        1763.6 KiB  5.02 MiB/s 00:00 [-----------------------------] 100%

    community     7.2 MiB  6.50 MiB/s 00:01 [-----------------------------] 100%

    multilib is up to date

    :: Starting full system upgrade...

    warning: calibre: ignoring package upgrade (6.15.1-1 => 6.15.1-2)

    resolving dependencies...

    looking for conflicting packages...etc

    ```


    Yep ,so looking at above i managed to revert to package 6.15.1-1 and stopped upgrading
    to 6.15.1-2


    You can do the same approach for a kernel if there is a problem

    OK now for some commands I have found useful :


    ```

    [andrew@darkstar:~]$  pacman -Rns $(pacman -Qtdq)

    ```


    The above will search for packages not needed anymore by any other package and
    remove them. When you install packages on Arch Linux its done either from the
    official repositories and you mostly don''t have to worry ,since they are automatically
    updated. The others will be from AUR


    These packages the approach I use is I leave the directory that was created in
    my home directory. Lets take telegram-desktop-bin now because i came from Slackware
    and am a bit of a control freak I like to do everything manually. So when i think
    its about time to update a package my approach (grapejuice ) would be this:


    ```

    [andrew@darkstar:~]$ cd grapejuice

    [andrew@darkstar:~/grapejuice]$ git pull

    remote: Enumerating objects: 11, done. remote: Counting objects: 100% (11/11),
    done.

    etc etc That updates the source code :

    now run:

    ```


    ```

    [andrew@darkstar:~/grapejuice]$ makepkg

    ```


    That will create an updated tar.zst , you can see which is newest by the numbers
    largest number is latest . Then to update:


    ```

    [andrew@darkstar:~]$ sudo pacman -U telegram-desktop-bin-4.7.1-1-x86_64.pkg.tar.zst

    ```'
