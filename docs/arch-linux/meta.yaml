  md: '# Android phones


    In days past for pictures i would reach for my camera but inevitably i would have
    my camera and would take pics with my phone. These days with smart phones having
    very competitive photo taking specs to cameras most people will now just use their
    phone. I still like to have pictures on my laptop; the larger screen makes for
    better editing.


    There are a few ways you can get photo''s from your phone to your laptop. For
    single pictures I just email a photo to myself using a yahoo email account to
    email to my google account and i just pic the photo from my email.

    Now to be able to get your phone physically mounted you just need a cable with
    male USB and male micro Android fitting to ports on phone an laptop.

    On Arch Linux you need the following packages :


    +   - gvfs-mtp

    - android-file-transfer

    - android-udev

    - libmtp


    When the above have been installed , your phone is connected by appropriate cable
    you should see an icon of your phone on your laptop Desktop .When you click on
    it an get a blank, that''s because you have probably been timed out of your phone,
    its to do with security of your phone and not allowing anyone access to file unless
    they have logged into phone. So you need to go to phone and log your self back
    in . This time when you click on the phone icon you should see something like


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_74_0.png)


    Phone camera pics are in DCIM camera and whatsapp images are in WhatsApp/Media/WhatsApp
    Images


    You Can just drag and drop onto your laptop Desktop'
