- md: ' ## Arch Linux


    By


    Andrew Brookes


    ## Dedication


    I dedicate this book to my late wife Georgina Acheampong Brookes - sorely missed,
    leaving behind myself and two kids.


    ## Copyright


    Copyright Andrew Brookes © 2024


    All rights reserved. No part of this book may be reproduced or distributed in
    any form without prior written permission from the author, with the exception
    of non-commercial uses permitted by copyright law.


    No part of this book may be reproduced or transmitted by any means, except as
    permitted by UK copyright law or the author. For licensing requests, please contact
    the author at:


    [andybrookestar@gmail.com](mailto:andybrookestar@gmail.com)


    ## Disclaimer


    With a computer that is in good working order, if you apply prudence and follow
    instructions you should be fine. However if your computer becomes inoperable or
    you wiped it ready for install but forgot there was stuff on it, that you didn''t
    have the foresight to back up and you actually did''t want to wipe then:


    As Yoda might not have once said, "Not so strong thee force, that I can predict
    every permutation where something can go unexpectedly". Or you instructions wrongly
    or got commands from some other source, then don''t blame me.


    My advice is this. From e-bay you can get a in working order quad core H.P 500Gig
    Laptop for circa 60 quid and if needed a new battery for circa 14 quid - i know
    this to be possible 2023 since that''s the price I paid. I even managed to increase
    the amount of RAM since in a HP 255 G1 there are 2 slots. I got compatible ram
    from:


    [https://www.offtek.co.UK](https://www.offtek.co.UK)


    For fun i decided to change the SSD as well, I got a compatible SSD from Crucial.
    Bios is old but SSD was recognised. If there is a failure with the Laptop that
    can''t be fixed I would still have my SSD with data, which i could access via
    an adapter of other compatible device.


    So for a minimum outlay get a cheap laptop, that has none of your stuff on it
    and install Arch on that for starters.


    ## About the Author


    In 1975 at Durham Technical College, Framwellgate Moor Campus we were extremely
    lucky that someone had decided to have "computer science" as one of the modules
    on an O.N.D science course.


    Thus there I was one day, using a sort of typewriter that punched holes into IBM
    cards, so that the FORTRAN IV code I was typing could be run. That involved stacking
    the cards into a hopper.


    I bet your thinking 1975.....the guy must be some sort of wizard by now. Not really,
    I hardly understood what the ICT teacher was saying and thought he might need
    psychiatric help when he said questions might have "and" and "and" in them or
    perhaps an AND & an OR, and a guy who''s name rhymed with cabbage he said (Charles
    Babbage).


    Anyway i went to University to study biology and it wasn''t for quite some time
    that I got back into computing as a hobby. I actually value the fact that I''m
    not clever enough to be in the same ball park as Richard Stallman, since it enables
    me not to loose site of the sort of issues that those relatively new to computers
    find an issue. The really clever guys just assume, that code instructions are
    so simple and obvious everybody when they were born would know them. They thus
    tend to leave out crucial information, which you actually need and will get stuck
    without.


    I can tell you that a lot of my approach involves trial and error until i find
    it works.


    Currently and technically I maintain the latex2html install slackbuild script:


    https://slackbuilds.org/repository/15.0/academic/latex2html/?search=latex2html


    I have also written some documentation for the Slackware wiki:


    https://docs.slackware.com/howtos:misc:anatomy_of_a_slackbuild


    https://docs.slackware.com/howtos:misc:approach_to_web_development_on_slackware


    My handles on forums are captain-sensible for Codeigniter forum at:


    https://forum.codeigniter.com/


    ## Fonts and Syntax Used in this Book


    Lines of code that have been entered into a terminal emulator will look like this:


    ```

    [andrew@darkstar:~]$   pwd

    ```


    Your prompt at a terminal will be somewhat similar, but the main thing is to clarify
    that in the above, that a command is being entered at a terminal prompt, but not
    only that, in the above case the command is being entered at a terminal with normal
    user permissions. That''s shown by the $ sign. You can also see that the user
    name is andrew and the host name of the machine is darkstar. The ~ sign denotes
    that, from the context of where the terminal is working from it is from the home
    directory of user andrew.


    If a user is set up to have sudo permissions, then equivalent root permissions
    can be gained by using something like the command


    ```

    [andrew@darkstar:~]$   sudo  ...command

    ```


    ```

    [root@darkstar:/home/andrew]#

    ```


    The prompt above shows with the hash sign at the end of the line that any commands
    entered will be with full root permissions


    A command entered into a terminal and its subsequent output can be differentiated
    like so :


    ```

    [andrew@darkstar:~]$ pwd

    /home/andrew

    ```


    The text below the command pwd (present working directory) is shown as /home/andrew
    .For showing a command at a terminal from a generic prompt I use


    ```

    [prompt:~] $

    ```


    Where there is not enough space to show code that was entered on one line but
    wraps to 2 lines here, a red arrow will be used to show that both lines should
    be used as one code line in your terminal:


    ```

    [andrew@darkstar:~]$   sudo pacman -U

    /var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst

    ```


    html markup text will look like:


    ```

    <!DOCTYPE html>

    <html lang="en">

    ```


    A file name or path like:


    ```

    /etc/hosts

    ```


    ## Contents


    | | |

    |:---|:---|

    | Dedication | i |

    | Copyright | ii |

    | Disclaimer | ii |

    | About The Author | iii |

    | Fonts & syntax used in Book | iv |


    ### Introduction To Linux


    1


    ### Arch Installation :


    - pre-amble ……………………………………………………… 3

    - ISO Files ………………………………………………………… 5

    - Ventoy …………………………………………………………… 6

    - Overview of install thought and checks …………………… 9

    - Main Install Procedure ……………………………………… 15

    - Install Bootloader …………………………………………… 23

    - After thoughts ………………………………………………… 24

    - Install Graphical Environment Desktop …………………… 25

    - Post Install Tweaks and additions ………………………… 27


    ### Rescue & Fix:


    - Desktop Issues ………………………………………………… 28

    - rEFInd …………………………………………………………… 31

    - Timeshift ………………………………………………………… 34

    - Linux on USB - Swiss Army Knife ………………………… 41


    ### Post Install


    - Initial Look at Maintenance ……………………………… 45

    - Systemd in more depth …………………………………… 49

    - Accessing and using systemd information ……………… 53

    - Pacman commands ………………………………………… 54

    - Arch User Repository (AUR) ……………………………… 58


    Misc Stuff … 62


    ## Web development


    - **Introduction** … 70

    - **Apache web server** … 82

    - **Composer** … 88

    - **CodeIgniter4** … 89

    - **GIT** … 106

    - **Bootstrap5** … 109

    - **Grunt TaskRunner** … 121


    ## Introduction to Linux


    The opinion I hear from people who know nothing about Linux is that its too complicated
    to be worth the trouble. I don''t accept the argument that its beyond the capacity
    of most people. Lets go back in history to a point in time when one car existed,
    and people on horseback were looking at it with a sideways cowboy look. What might
    they say?


    I couldn''t work with a car; it doesn''t eat grass. Looks extremely complicated
    to me, it will never catch on.


    Well it seems Millions were prepared to embrace a slight learning curve to drive
    a car, if there was the right motivation. So what does Gnu/Linux have to offer
    as a motivation? The main observation to me was that when I was using Windows
    and started exploring something like like web development and needed new software
    in order to be able to do it, was I had to fork out money every time. Then more
    often than not, fork out again when a major new version was released. Same with
    the operating system. For example Windows 98 or XP, security updates no longer
    available forcing you to buy the next newest version.


    With Gnu/Linux the operating system is in the vast majority of Bistros is "free
    as in beer" and "free as in speech". Same for software. That''s possible because
    due to the fact that a GNU licence allows someone to have access to the kernel
    code for instance and i guess from there a vast community grew, with people collaborating.
    So basically we all contribute, that way people may use my contributions and I
    use their theirs. Its really all very transparent, ethical and friendly. Well
    i say that; just don''t go on the Slackware forum of Linuxquestions.org and ask
    "is Slackware dead".


    Now technically the word Linux refers specifically to software called the "kernel"
    and other supporting software that works around and with the kernel is referred
    to as GNU. It so happens that a lot of code that would find itself being used
    in conjunction with the kernel was already written by people such as Richard Stallman.
    If you want to give a nod of acknowledgement to GNU and Richard Stallman you would
    properly say call Slackware GNU/Slackware which Richard Stallman pointed out to
    me in an email.


    Now there are many different manifestations of GNU/Linux, the common element being
    the kernel but other software has been written that interacts with it so that
    the feel, look and approach is different. This is output in the form of different
    Linux Bistros such as Mint, Debian, Slackware, Red Hat and Arch for instance.


    There is an associated time line with Debian and Slackware Linux, they being two
    of the oldest still in existence. As to which you would want to start with its
    a matter of horses for courses. Slackware is good if you want to be forced to
    learn how to use the command line and about the system and others like Mint tend
    to be (in essence) more beginner friendly.


    I have seen in the forums that people have managed to go straight from windows
    to Arch. I''m going to try to help people coming straight from Windows to be able
    to install Arch Linux. Everything I write will be from my perspective as a normal
    user, using stuff I have found useful'
  mdcn: "\n ## Arch Linux\n\n作者\n\nAndrew Brookes\n\n## 献词\n\n谨以此书献给我已故的妻子 Georgina\
    \ Acheampong Brookes——她令人思念，留下我和两个孩子。\n\n## 版权\n\n版权所有 Andrew Brookes © 2024\n\
    \n保留所有权利。未经作者事先书面许可，不得以任何形式复制或分发本书的任何部分，但版权法允许的非商业用途除外。\n\n本书的任何部分不得以任何方式复制或传播，除非英国版权法或作者允许。如需授权请求，请通过以下方式联系作者：\n\
    \n[andybrookestar@gmail.com](mailto:andybrookestar@gmail.com)\n\n## 免责声明\n\n如果你的电脑运行良好，只要你谨慎行事并遵循说明，应该不会有问题。然而，如果你的电脑变得无法使用，或者你擦除了硬盘准备安装却忘记了上面还有东西，而且你没有远见去备份，实际上也不想擦除，那么：\n\
    \n就像尤达可能不会说的那样：\"原力并非如此强大，我无法预测所有事情可能出意外的每一种排列组合\"。或者你错误地理解了说明，或者从其他来源获取了命令，那么不要怪我。\n\
    \n我的建议是这样的。你可以在 eBay 上花大约 60 英镑买到一台能正常工作的四核 H.P 500G 笔记本电脑，如果需要的话，再花大约 14 英镑买块新电池——我知道这在\
    \ 2023 年是可能的，因为我就是那个价买的。我甚至还增加了内存，因为在 HP 255 G1 上有两个插槽。我从以下网站购买了兼容的内存：\n\n[https://www.offtek.co.UK](https://www.offtek.co.UK)\n\
    \n为了好玩，我决定把 SSD 也换了，我从 Crucial 买了一块兼容的 SSD。BIOS 很旧，但 SSD 被识别了。如果笔记本电脑出现无法修复的故障，我仍然可以保留我的\
    \ SSD 数据，通过一个适配器或其他兼容设备来访问。\n\n所以，花最少的钱买一台便宜的笔记本电脑，上面没有任何你的东西，先在那上面安装 Arch 吧。\n\
    \n## 关于作者\n\n1975 年，在达勒姆技术学院 Framwellgate Moor 校区，我们非常幸运，有人决定将\"计算机科学\"作为 O.N.D\
    \ 科学课程的一个模块。\n\n于是有一天，我在那里使用一种类似打字机的设备，在 IBM 卡片上打孔，这样我输入的 FORTRAN IV 代码就可以运行了。这涉及到将卡片堆叠到料斗中。\n\
    \n我打赌你在想 1975 年……这家伙现在一定是个巫师了吧。并非如此，我几乎听不懂 ICT 老师在说什么，当他说题目里可能有\"and\"和\"and\"\
    ，或者一个 AND 和一个 OR，还有一个名字与 cabbage 押韵的人（查尔斯·巴贝奇）时，我觉得他可能需要心理治疗。\n\n总之，我去大学学习生物学，过了很长一段时间我才把计算机作为爱好重新捡起来。我其实很庆幸自己不够聪明，无法与理查德·斯托曼相提并论，因为这使我不会忽略那些相对新手遇到的困难。那些真正聪明的人只是假设，代码指令如此简单明了，每个人出生时就应该知道。因此他们往往遗漏了关键信息，而你实际上需要这些信息，没有就会卡住。\n\
    \n我可以告诉你，我的很多方法都涉及反复试验，直到找到可行的办法。\n\n目前，从技术角度，我维护 latex2html 的 install slackbuild\
    \ 脚本：\n\nhttps://slackbuilds.org/repository/15.0/academic/latex2html/?search=latex2html\n\
    \n我还为 Slackware 维基撰写了一些文档：\n\nhttps://docs.slackware.com/howtos:misc:anatomy_of_a_slackbuild\n\
    \nhttps://docs.slackware.com/howtos:misc:approach_to_web_development_on_slackware\n\
    \n我在论坛上的用户名是 captain-sensible，在以下 Codeigniter 论坛：\n\nhttps://forum.codeigniter.com/\n\
    \n## 本书中使用的字体和语法\n\n在终端模拟器中输入的代码行看起来像这样：\n\n```\n[andrew@darkstar:~]$   pwd\n\
    ```\n\n你在终端的提示符会有点类似，但主要是要说明在上面的例子中，命令是在终端提示符下输入的，不仅如此，在上面这个例子中，命令是在具有普通用户权限的终端中输入的。这由\
    \ $ 符号表示。你还可以看到用户名是 andrew，机器的主机名是 darkstar。~ 符号表示，从终端工作的上下文来看，它来自用户 andrew 的主目录。\n\
    \n如果用户被设置为具有 sudo 权限，那么可以通过使用类似以下命令获得等效的 root 权限：\n\n```\n[andrew@darkstar:~]$\
    \   sudo  ...command\n```\n\n```\n[root@darkstar:/home/andrew]#\n```\n\n上面的提示符末尾显示了\
    \ # 符号，表示输入的任何命令都将具有完整的 root 权限\n\n在终端中输入的命令及其后续输出可以这样区分：\n\n```\n[andrew@darkstar:~]$\
    \ pwd\n/home/andrew\n```\n\npwd 命令（当前工作目录）下方的文本显示为 /home/andrew。对于从通用提示符在终端中显示命令，我使用：\n\
    \n```\n[prompt:~] $\n]\n\n当一行代码没有足够的空间显示但在此处换行为 2 行时，将使用红色箭头表示两行应作为终端中的一行代码使用：\n\
    \n```\n[andrew@darkstar:~]$   sudo pacman -U\n/var/cache/pacman/pkg/calibre-6.15.1-1-x86_64.pkg.tar.zst\n\
    ```\n\nhtml 标记文本看起来像这样：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n```\n\n文件名或路径像这样：\n\
    \n```\n/etc/hosts\n```\n\n## 目录\n\n| | |\n|:---|:---|\n| Dedication | i |\n| Copyright\
    \ | ii |\n| Disclaimer | ii |\n| About The Author | iii |\n| Fonts & syntax used\
    \ in Book | iv |\n\n### Introduction To Linux\n\n1\n\n### Arch Installation :\n\
    \n- pre-amble ……………………………………………………… 3\n- ISO Files ………………………………………………………… 5\n\
    - Ventoy …………………………………………………………… 6\n- Overview of install thought and checks ……………………\
    \ 9\n- Main Install Procedure ……………………………………… 15\n- Install Bootloader ……………………………………………\
    \ 23\n- After thoughts ………………………………………………… 24\n- Install Graphical Environment\
    \ Desktop …………………… 25\n- Post Install Tweaks and additions ………………………… 27\n\n###\
    \ Rescue & Fix:\n\n- Desktop Issues ………………………………………………… 28\n- rEFInd ……………………………………………………………\
    \ 31\n- Timeshift ………………………………………………………… 34\n- Linux on USB - Swiss Army Knife\
    \ ………………………… 41\n\n### Post Install\n\n- Initial Look at Maintenance ………………………………\
    \ 45\n- Systemd in more depth …………………………………… 49\n- Accessing and using systemd\
    \ information ……………… 53\n- Pacman commands ………………………………………… 54\n- Arch User Repository\
    \ (AUR) ……………………………… 58\n\nMisc Stuff … 62\n\n## Web development\n\n- **Introduction**\
    \ … 70\n- **Apache web server** … 82\n- **Composer** … 88\n- **CodeIgniter4**\
    \ … 89\n- **GIT** … 106\n- **Bootstrap5** … 109\n- **Grunt TaskRunner** … 121\n\
    \n## Linux 简介\n\n我从对 Linux 一无所知的人那里听到的说法是，它太复杂了，不值得费那个劲。我不接受大多数人无力掌握这种说法。让我们回到历史上只有一辆汽车的时候，骑马的人们侧目看着它。他们可能会说什么？\n\
    \n我没法用汽车；它不吃草。看起来极其复杂，它永远不会流行起来。\n\n嗯，似乎数以百万计的人愿意接受轻微的学习曲线来驾驶汽车，如果有合适的动机的话。那么\
    \ Gnu/Linux 能提供什么作为动机呢？对我来说主要的观察是，当我使用 Windows 并开始探索诸如 Web 开发之类的东西，需要新软件才能做到时，我必须每次都掏钱。然后更多情况是，当主要的新版本发布时，又得再掏一次。操作系统也是如此。例如\
    \ Windows 98 或 XP，安全更新不再提供，迫使你购买下一个最新版本。\n\n使用 Gnu/Linux，绝大多数发行版的操作系统都是\"像啤酒一样免费\"\
    和\"像言论一样自由\"。软件也是如此。这是可能的，因为 GNU 许可证允许某人访问内核代码等，我想从那里开始，一个庞大的社区成长起来，人们相互协作。所以基本上我们都做出贡献，这样人们可以使用我的贡献，我也使用他们的贡献。这一切都非常透明、道德和友好。好吧，我这么说；只是不要去\
    \ Linuxquestions.org 的 Slackware 论坛问\"Slackware 是不是死了\"。\n\n从技术上讲，Linux 这个词特指称为\"\
    内核\"的软件，而围绕内核工作并与内核一起工作的其他支持软件称为 GNU。碰巧的是，很多会与内核一起使用的代码已经被理查德·斯托曼等人编写好了。如果你想向\
    \ GNU 和理查德·斯托曼致意，你应该正确地说 Slackware GNU/Slackware，这是理查德·斯托曼在一封电子邮件中向我指出的。\n\n现在有许多\
    \ GNU/Linux 的不同实现形式，共同点是内核，但已经编写了与之交互的其他软件，使得感觉、外观和方法各不相同。这以不同 Linux 发行版的形式输出，例如\
    \ Mint、Debian、Slackware、Red Hat 和 Arch。\n\nDebian 和 Slackware Linux 有一个相关的时间线，它们是仍然存在的最古老的两个。至于你想从哪个开始，这要看具体情况。如果你想被迫学习如何使用命令行和了解系统，Slackware\
    \ 很好，而像 Mint 这样的发行往往在本质上对初学者更友好。\n\n我在论坛上看到有人成功地从 Windows 直接过渡到 Arch。我将尝试帮助直接从\
    \ Windows 过来的人能够安装 Arch Linux。我写的所有内容都将从我作为普通用户的角度出发，使用我发现有用的东西。\n"
