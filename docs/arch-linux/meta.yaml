- md: " Now Apache is slightly different; the basics are that root is involved in\
    \ the kick starting of Apache and that there is a \"hand over\" with Apache running\
    \ with user and group http:http\n\nA bug bear with Apache on Linux is that you\
    \ will find as a normal user you can not edit, with your normal user powers files\
    \ within http. Of course as a web developer that's exactly what you want and will\
    \ need to do. Much better as an approach to get your web in development and problems\
    \ acknowledged and addressed then update file to the live server, than do live\
    \ editing of files via cPanel.\n\nOn a live server directories usually have 755\
    \ permissions and files 644.\n\nOne approach to the editing issue is to set the\
    \ group ownership for /srv/http to http, then add write permissions for the group\
    \ http. Also add yourself as a user to the group http. That means you should be\
    \ able to edit. One thing that might trip you up. Is that you need to logout and\
    \ back in to take affect. Lets do that.\n\nIf you forgot who you are as a user:\n\
    \n```\n[andrew@darkstar ~]$ whoami\nandrew\n```\n\nlet 'andrew' joining the exclusive\
    \ club 'http':\n\n```\n[andrew@darkstar Desktop]$ sudo usermod -a -G http andrew\n\
    ```\n\nThe above lets the user andrew join the group http, whilst retaining membership\
    \ of other groups already joined. Next we group the group owner shop of /srv/http\
    \ and add write permissions for the group.\n\n```\n[andrew@darkstar Desktop]$\
    \ sudo chgrp --recursive http /srv/http\n[andrew@darkstar Desktop]$ sudo chmod\
    \ --recursive g+w /srv/http\n```\n\nRemember to log out and log back in or reboot\
    \ for changes to take effect. We will fine tune permissions later on. Next lets\
    \ try a php file. One way to do that is use the mv command to rename index.html\
    \ to index.php\n\n```\n[andrew@darkstar ~]$ mv /srv/http/index.html index.php\n\
    ```\n\nLets create a backup of httpd.conf:\n\n```\n[andrew@darkstar conf]$ sudo\
    \ cp /etc/httpd/conf/httpd.conf /etc/httpd/conf/httpd_bk.conf\n```\n\nThat's way\
    \ if we mess anything up we have our original to refer to\n\nLets have another\
    \ look at /etc/httpd/conf/httpd.conf\n\n```\n[andrew@darkstar ~]$ cat -n /etc/httpd/conf/httpd.conf\
    \ | less\n```\n\non lines 289 -291 its basically saying its only going to recognise\
    \ index files with html suffix\n\n```\n<IfModule dir_module>\n    DirectoryIndex\
    \ index.html\n</IfModule>\n```\n\nSo we are going to edit that file using nano\
    \ and add index.php after index.html\n\nhit keys alt+shift+3 to show line numbers\
    \ and go to line 290 and add index.php\n\nThe lines now loos like\n\n```\n<IfModule\
    \ dir_module>\n    DirectoryIndex index.html index.php\n</IfModule>\n```\n\nAl\
