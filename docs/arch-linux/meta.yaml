    <html lang=\"en\">\n<!--\n  untitled.html\n    Copyright 2023 Unknown <andrew@darkstar>\n\
    \  This program is free software  etc etc\n-->\n<head>\n<meta charset=\"utf-8\"\
    \ />\n<title>untitled</title>\n<meta name=\"generator\" content=\"Geany 1.38\"\
    \ />\n</head>\n<body>\n</html>\n```\n\nThe above relative to what you might see\
    \ with other html producing software is quite lean . A couple of things to mention\
