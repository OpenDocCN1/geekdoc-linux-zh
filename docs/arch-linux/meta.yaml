    # Overview of Install Process, thoughts and checks


    Before we go further lets have an overview of whats going to happen and gather
    some info and if necessary do a little pre-preparation. The first thing once you
    boot up the arch install ISO, your going to notice is that its command line only,
    no nice graphics. This can cause a little anxiety in those that like GUI''s.


    Also the install needs connection to good bandwidth internet, because the install
    ISO doesn''t actually have all the packages you are going to need for your full
    install ; that''s why its only circa 800MB. You will get the packages you need
    with the help of commands. So make sure you know the name of your WiFi and its
    pass phrase (i.e password).


    Also you will need to install the right drivers for your PC or laptop graphics
    card, or built in graphics hard ware. So you will need to find out the specs.
    You don''t really want to do that in the middle of an install. Also the install
    is not going to know automatically what partitions you already have nor mount
