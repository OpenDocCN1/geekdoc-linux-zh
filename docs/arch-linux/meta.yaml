    \ hitting return key for all partition start suggestions. When you get to the\
    \ stage, of last sector for your first partition you enter a size in the form\
    \ of:\n\nThen hit return key. Don't worry about the partition file types yet."
  mdcn: "\n一台64位UEFI计算机需要一个EFI分区和一个GPT类型的分区表。如今SWAP的大小大约是内存大小 + 2GB。你可以看看我在我的HP 255\
    \ G1笔记本电脑上的配置。你需要根据自己的需求来确定最佳方案。如果你要进行大量图形处理，处理占用大量空间的文件，那么你需要一个较大的home目录来存放它们。\n\
    \n现在你可以从Arch安装命令行完成所有操作；但你也可以使用gParted以图形化方式完成。所以如果你把Mint ISO放到你的Ventoy U盘上，关机然后按下电源按钮。然后在开始启动时立即按下你的PC启动选项键，对于惠普（H.P）通常是F9，对于BIOS是F10。这是我其中一个挂载在`/run/media/andrew`的U盘的结构：\n\
    \n```\n/run/media/andrew/ventoy\n└── ISO\n    ├── archlinux-2023.01.01-x86_64.iso\n\
    \    └── linuxmint-21.1-xfce-64bit.iso\n```\n\n好的，让我们首先从Ventoy U盘启动Mint。现在你需要完全关机，开机但立即按下启动选项键。\n\
    \n在惠普（H.P）上是F9。你可以先看一下BIOS设置，在冷启动时按F10。我已启用从USB启动，关闭安全启动（secure boot），启用传统启动（legacy\
    \ boot）。\n\n![Ventoy启动菜单显示USB设备选项](img/0740bd8ebbd6ea87ab1327b2fc9132c4_18_0.png)\n\
    \n所以我连接了我的Ventoy格式化U盘，开机并按下F9键。左侧的图像显示了我的选项。顶部高亮显示的是金士顿（Kingston）品牌的USB。\n\n就是这个，如果现在按下回车键，那么我应该能看到Ventoy的启动画面\n\
    \n稍微耐心一点，你应该就能看到Mint Live的漂亮绿色界面。现在因为是图形界面，在继续安装Arch之前先玩一玩是很好的选择。我的Mint启动得很顺利。\n\
    \n如果你的不行，你可能需要尝试另一个USB U盘，并检查ISO的完整性。校验和的说明在Mint网站上。`linuxmint-21.1-xfce-64bit.iso`比mate版本更轻量，但我检查过，它默认安装了inxi、gParted、Nano和Timeshift。我发现它在仅有4GB内存的笔记本电脑上运行得相当流畅和快速。\n\
    \n让我们利用它；从终端提示符获取图形信息的命令是：\n\n```\n[prompt:~]$ inxi -G\n```\n\n在右侧的图像中，我正在使用从USB启动的Mint\
    \ xfce live版，我打开了一个终端并输入了相同的命令\n\n![终端显示inxi -G输出UIApplicationDelegate，标识AMD显卡](img/0740bd8ebbd6ea87ab1327b2fc9132c4_19_0.png)\n\
    \n你可以看到我的图形设备被识别为AMD\n\n从命令行你也可以使用：\n\n```\n[prompt:~]$ lspci -v | grep -A1 -e\
    \ VGA -e 3D\n```\n\n记下你的信息；当你到达安装桌面阶段时，你需要这些信息，因为需要安装相应的显卡驱动。我的显卡硬件是AMD，所以当我到达安装桌面阶段时，我通过pacman安装：\n\
    \n```\n[prompt:~]$ sudo pacman -S xf86-video-amdgpu\n```\n\n对于英特尔（Intel）：\n\n\
    ```\n[prompt:~]$ sudo pacman -S xf86-video-intel mesa\n```\n\n对于英伟达（nVIDIA）：\n\
    \n```\n[prompt:~]$ sudo pacman -S nvidia nvidia-utils\n```\n\n`inxi`是一个有用的工具，可以用来查找你的CPU和其他信息。命令是：\n\
    \n```\n[prompt:~]$ inxi -C\n```\n\n查看完整信息：\n\n```\n[prompt:~]$ inxi --help\n```\n\
    \n既然我们已经运行着Mint live，我们可以用它来准备一些技能并熟悉终端的使用。你可以选择gParted，它是parted的GUI版本，可以用来查看电脑硬盘上的分区，以及连接了运行Mint\
    \ live的USB。如果你愿意，也可以用它来准备分区\n\n![gParted显示惠普笔记本电脑硬盘分区](img/0740bd8ebbd6ea87ab1327b2fc9132c4_20_0.png)\n\
    \n上图是我的惠普（H.P）笔记本电脑的硬盘，我买它的时候预算有点紧张。我有一个FAT32类型的EFI分区，在`/dev/sda1`分区上。交换分区（Swap）在`/dev/sda2`，我的主要安装在`/dev/sda4`，大约55GB，文件类型为ext4。\n\
    \n我在这台笔记本上编写Arch Linux书籍，并且也用它进行Web开发。所以以今天的硬盘标准来看，至少说明如果你节俭一些，你的Arch安装以及随后你发现需要的所有软件包并不会占用太多空间。\n\
    \n在主要安装过程中，我解释了如何使用fdisk创建分区；但你也可以在Mint live中使用parted设置分区，然后只需选择这些分区即可。你可以练习格式化连接在另一个USB端口上的另一个USB\
    \ U盘。我建议你熟悉一些Mint live工具，比如使用nano，它比VIM更容易使用。\n\n当然，很有可能你会发现你非常喜欢Mint，决定就安装它了。如果你这样做，非常简单，只需鼠标左键点击安装图标即可。你随时可以回来安装ARCH。我在这个阶段想要做的是解决可能出现的一些问题。例如，如果你看上面的图像，Arch安装在：\n\
    \n`/dev/sda4`\n\n那么用户home目录安装在哪里呢？嗯，在我的笔记本上，我没有创建单独的home分区。如果你不创建，当你使用创建用户的命令时，系统会寻找单独的home分区，如果找到，就把用户目录放在那里。如果找不到，就像我的情况一样，它就会在主Arch安装架构中创建用户目录作为子目录。\n\
    \n使用gParted的过程只是浏览菜单并做出正确的选择。要清除你电脑上的所有内容，从设备的下拉菜单中选择（通常是`/dev/sda`），然后选择\"创建分区表\"\
    。\n\n对于UEFI计算机，选择GPT选项。现在如果你在你的PC上看到一个efi分区，比如如果你正在运行Windows 10但想清除它，如果它足够大（至少300MB），你可以保留该分区。在这种情况下，不要创建分区，只需删除efi分区下面的其他所有内容。如果你想创建一个新的efi分区，选择efi或FAT32类型。注意顶部菜单中的绿色对勾。你必须鼠标左键点击它，gParted才会执行你的选择。我通常一次做一件事，每次点击绿色对勾。如果菜单项变灰，到菜单中取消挂载，取消挂载你要操作的分区。创建efi分区后，进入标志（flags）并勾选启动（boot）和ESP选项。\n\
    \n现在你可以用一个USB U盘来练习使用gParted，以及我稍后介绍的fdisk。在使用命令行方面有信心，知道如何使用nano，能够舒适地使用终端，然后再尝试Arch安装，这对你是最好的选择。让我们在你运行Mint时看一下nano。\n\
    \n在Mint live上打开一个终端，输入：\n\n```\n[andrew@darkstar:~]$ touch play.txt\n```\n\n这将在home目录中创建一个名为play.txt的文件，如果你想确认，可以通过图形显示的文件目录结构来导航查看。\n\
    \n输入：\n\n```\n[andrew@darkstar:~]$ nano play.txt\n```\n\nplay.txt打开后当然是空白的。输入一些内容然后\n\
    \n```\nctrl+o\n按回车键\nctrl+x\n```\n\n好的，让我们离开Mint live，看看能否从Arch安装ISO启动。完全关机，开机，按下启动选项键（通常是惠普电脑上的F9）。\n\
    \n这次从Ventoy提示符选择Arch安装ISO。耐心等待，给它时间加载。你会看到文字在屏幕上闪烁，某个时刻会提到\"Welcome to Arch\"\
    。会有更多文本输出，然后停在：\n\n```\nroot@archiso ~#\n```\n\n在提示符下输入一些文本，看看文本是否与按键匹配\n\n试一下shift键\
    \ + @键，你得到的是&符号还是其他东西\n\n基本上，你的键盘布局将是你所说语言的**国家代码**。\n\n对于英国是 `root@archiso ~#\
    \ loadkeys uk`\n\n对于德国是 `root@archiso ~# loadkeys de`\n\n稍后我们会\"chroot\"，所以请注意提示符将从上面变为：\n\
    \n`root@archiso:/#`\n\n另外值得现在一提的是，要退出chroot回到主ISO安装提示符，你输入`exit`。`archiso ~#`中的`#`表示我们处于root权限的上下文中。好的，所以我们已经小试牛刀。我将展示关闭安装的命令。之后就是思考一下，掂量掂量你是否准备好安装Arch并放手一搏了？我想补充一点，在2013年的惠普笔记本上安装Arch的经验是，我发现它无法启动，但rEFInd仍然能让操作系统运行起来。所以我想说，把rEFInd做到USB\
    \ U盘上，准备好，以防万一。\n\n要干净地关闭正在运行的Arch安装，使用以下命令：\n\n`root@archiso ~# shutdown now\
    \ -h`\n\n## 主要安装过程\n\n从Arch安装提示符开始，有几个命令可以查看你当前PC硬盘的样子；尝试以下命令之一：\n\n`fdisk -l`、`blkid`、`lsblk`\n\
    \n如果你已经完成了分区并且也格式化好了分区，那么使用上述命令来提醒自己哪个是哪个，然后跳到我们挂载分区的部分。假设你还没有对磁盘进行分区。我们将从Arch安装提示符使用fdisk命令来完成。顺便说一下，你可以在USB\
    \ U盘上练习使用fdisk，即使出错了也不是什么大不了的事。如果我在Arch ISO安装提示符下运行`fdisk -l`：\n\n`root@archiso\
    \ ~# fdisk -l`\n\n我在其他输出中看到：\n\n`Disk /dev/sda: 58.24 GiB, 62537072640 bytes,\
    \ 122142720 sectors`\n\n好的，所以我的硬盘是`/dev/sda`。所以开始分区应该是：\n\n`root@archiso ~# fdisk\
    \ /dev/sda`\n\n- `+500M`（500兆字节）\n- `+30G`（30吉字节）\n\n输入字母`g`；这将创建一个GPT类型的分区表。顺便说一下，在你输入`w`之前不会写入任何内容。要创建分区，输入`n`\n\
    \n你会看到一堆数字和一个关于分区应该从哪开始的建议提示。对于所有分区起始建议，选择默认选项，按回车键。当你到达第一个分区的最后一个扇区阶段时，输入以下形式的大小：\n\
    \n然后按回车键。暂时不要担心分区文件类型。\n"
