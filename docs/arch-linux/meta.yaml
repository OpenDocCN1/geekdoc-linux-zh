- md: " After making your choice to include or not include user directories, next\
    \ you will see set up wizard complete and that the wizard dialogue box can be\
    \ closed. At this point you have 2 choices either to click on the create icon,\
    \ or to shutdown Timeshift graphic user interface and to work from a command line.\n\
    \nThe syntax for using Timeshift at a command line is pretty straight forward.\
    \ You need sudo permissions so it basically sudo timeshift with a flag e.g\n\n\
    ```\n[andrew@darkstar:~]$ sudo timeshift --list\n```\n\nThe output of the command\
    \ can be seen below\n\n```\n[andrew@darkstar:~]$ sudo timeshift --list\nMounted\
    \ '/dev/sdc1' at '/run/timeshift/3655/backup'\nDevice : /dev/sdc1\nUUID : d94e6913-fcef-45f8-92ef-d28c570b6468\n\
    Path : /run/timeshift/3655/backup\nMode : RSYNC\nStatus : OK\n1 snapshots, 32.3\
    \ GB free\n\nNum Name Tags Description\n0 > 2023-05-18_10-25-21 0\n```\n\nTo delete\
    \ a snapshot its:\n\n```\n[andrew@darkstar:~]$ sudo timeshift --delete\n```\n\n\
    Note I don't type in any details of a snapshot to delete. That's because i will\
    \ be asked for that via a number that Timeshift has allocated as a reference to\
    \ each snapshot\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_44_0.png)\n\nSo to\
    \ delete the snapshot listed i would just enter at the prompt: 0\n\nTo create\
    \ a new snapshot its something like below, i added a comment, which will be shown\
    \ when i use timeshift --list:\n\n```\n[andrew@darkstar:~]$ sudo timeshift --create\
    \ --comments ' 2nd snapshot'\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_45_0.png)\n\
    \nOK so now we have timeshift installed and a snapshot created which we will be\
    \ able to easily access.\n\nNext its about the process of booting up a Live Linux\
    \ distribution from a USB stick and if needed restore a selected snapshot to the\
    \ computer from which the USB and Linux distribution are booting from.\n\nCouple\
    \ of things before we get to that. First one is that with Arch because its a rolling\
    \ release updates to your OS are frequent. That means you also have to frequently\
    \ create new snapshots and delete old ones as required to make room.\n\nNow the\
    \ process of restoring your computer to a snapshot involves booting up for example\
    \ Mint or other Linux distribution on a USB. You will have to select timeshift\
    \ from the menu and go through the GUI wizard again for Timeshift you are now\
    \ using on a Linux booted from USB.\n\nSo for instance you will again choose rsync\
    \ that's so timeshift can confirm you want to use rsync and you will select where\
    \ the snapshots are from a navigation list Timeshift will give you. Now if as\
    \ I did on a friends laptop I setup a dedicated partition with label \"timeshift\"\
    \ its not too difficult to find the snapshots\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_46_0.png)\n\
    \nIn the above which is a screenshot of timeshift from a Live Linux Distro from\
    \ a USB, where Timeshift with help from myself navigating successfully found the\
    \ snapshots. So to continue it would be a case of left mouse click on the snapshot\
    \ you want normally the most recent snapshot. Then from the menu click on the\
    \ restore option\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_46_1.png)\n\nIf you\
    \ look at the image above you will see I am using Kali linux live, booted from\
    \ the USB stick. If you find that software is not installed as default you can\
    \ use in the case of kali from a command line:\n\n```\n$ apt search timeshift\n\
    $ sudo apt install timeshift\n```\n\nThat will give you temporary use of any program\
    \ you installed but it will be gone next time you boot up from the USB. With ventoy\
    \ there is a way to have persistence so that anything you install will be there\
    \ next time you boot up. Also the configuration for your wifi will be remembered\
    \ which is handy.\n\nThe next choice that comes up as see to the right of the\
    \ above snapshot is target device. It came up with default choices. My main Arch\
    \ install on my H.P laptop is on partition /dev/sda4, so the above was correct\
    \ for me. I have a boot directory on my root install.\n\nThe H.P laptop had a\
    \ small sized hard drive so i didn't set up a separate home partition.\n\n/dev/sda1\
    \ is my EFI partition\n\n/dev/sda2 is swap\n\nand the last partition is\n\n/dev/sda4.\n\
    \nA boot directory is listed as one of the directories in root\n\nThis is what\
    \ mine contains in case you want to compare to yours:\n\n```\nboot\n├── amd-ucode.img\n\
    ├── EFI\n│   ├── arch\n│   └── GRUB\n├── grub\n│   ├── fonts\n│   ├── grub.cfg\n\
    │   ├── grubenv\n│   ├── locale\n│   ├── themes\n│   └── x86_64-efi\n├── initramfs-linux-lts-fallback.img\n\
    ├── initramfs-linux-lts.img\n└── vmlinuz-linux-lts\n```\n\nSo for my H.P laptop\
    \ I left the selections that Timeshift gave\n\nSo yes leave that as selected.\
    \ When I installed I didn't have a dedicated partition for home, so my home directory\
    \ is actually a sub directory inside the main root install. So leave that. basically\
    \ next just click next. Hopefully you will see the restore before your eyes ending\
    \ with \"no errors\".\n\n## Linux on USB - Swiss Army Knife\n\nTo try and make\
    \ the learning curve less steep I previously suggested putting Linux Mint along\
    \ with the Arch install ISO onto a USB stick. That's because Timeshift is installed\
    \ as a package as default, so you wouldn't have to mess about with trying to install\
    \ it.\n\nWith a fully installed Linux distribution on your computer hard drive,\
    \ when you install software its there when you boot up. Linux distributions used\
    \ live via a USB stick behave slightly differently, they are running in RAM; you\
    \ can install additional extra software that comes with the ISO and use it it\
    \ but it will be gone next time you boot up from the USB stick. Its all to do\
    \ with the way that Linux in the form of an ISO run in RAM which is ethereal.\n\
    \nA Linux distribution on a USB stick can be a very effective Swiss Army knife;\
    \ you can use gParted to graphically format hard drives, run fsck which can scan\
    \ the file system on your computer hard drive for errors and also fix them.\n\n\
    I found that there were a few programs i wanted which were not installed by default\
    \ and I wanted them there to be there ready when ever I booted the Linux distribution\
    \ from the USB. So now I'm going to look at how you can use Ventoy with a USB\
    \ stick for a Linux Live distribution ISO and get persistence with it.\n\nThere\
    \ are things you can do from Linux running from a USB stick that you can not do\
    \ from a Linux distribution running from your hard drive.\n\nOne of them is running\
    \ the command fsck such as\n\n```\n$ sudo fsck -vy /dev/sda2\n```\n\nIn the above\
    \ /dev/sda2 is one of the partitions on my laptop. You can not run fsck directly\
    \ on partitions of your laptop while working from the running operating system\
    \ that has fsck; that's because in order to be able to run fsck on a partition,\
    \ that partition has to be unmounted; a partition on a running Linux distribution\
    \ on your laptop is in use and mounted.\n\nThere is a way to get a live Linux\
    \ OS on a USB stick to remember your WiFi settings and also retain, anything you\
    \ found you needed to download and install.\n\nThere will be a little more work\
    \ to do with Ventoy; it involves creating a .dat file for persistence and adding\
    \ a Ventoy.json entry. I think its worth it, since with the combination of having\
    \ Kali live with persistence, you can prepare and have ready at your side a Swiss\
    \ army knife ready to use to fix things. I am going to give you the bare bones\
    \ of what you need, but you can see further information at the Ventoy site.\n\n\
    https://www.ventoy.net/en/plugin.html\n\nhttps://www.ventoy.net/en/plugin_entry.html\n\
    \nNow I guess the first question is going to be:\n\nOK we know Linux operating\
    \ systems in the form of an ISO file will boot up and run from a USB stick, but\
    \ which Linux distribution candidates look good in that they are responsive in\
    \ terms of being fast, have a lot of stuff already installed and they also work\
    \ well with file created to make them have persistence?\n\nWell I can save you\
    \ a lot of time and trouble; I have played around with different Linux live OS\
    \ on USB sticks, with Ventoy I found Kali Linux to work well, when booted up and\
    \ you run commands from a terminal they operate with \"root\" power. Also I found\
    \ that if you want to save something on the Desktop area of your none running\
    \ PC operating system, such as an image screen shot, Kali Linux will put it there\
    \ without moaning.\n\nWith Mint you get \"permission denied\" and you don't want\
    \ to have to faff about when you have a problem. Once i got the right command\
    \ to create the appropriate dat file for kali, it worked a treat.\n\nLet me give\
    \ you an overview of what you need and what you can have. Can you have Kali Linux\
    \ on the same USB stick as the Arch install ISO and still have persistence- yes\
    \ you can. First I will show you the structure of a USB stick with Kali Linux\
    \ where persistence works.\n\nI suggest going for a USB stick of 16Gig; you don't\
    \ have to put it onto the stick with the Arch ISO by the way, instead you can\
    \ have around 4 to 5 different Distros all on the same stick. You can have some\
    \ without persistence facility and some with. Its all about how you set up the\
    \ structure, have the right files in place, then configure the file Ventoy.json\
    \ below I use the tree command from a terminal to get the structure layout of\
    \ whats on my ventoy formatted stick:\n\n```\n[andrew@darkstar:media/andrew]$\
    \ tree -L 2 Ventoy\n```\n\n```\nVentoy\n├── ISO\n│   └── kali-linux-2022.4-live-amd64.iso\n\
    ├── persistence.dat\n└── ventoy\n    └── ventoy.json\n```\n\nIn the above \"Ventoy\"\
    \ is the label for the USB stick when attached to my laptop. On my Arch laptop\
    \ it mounts to:\n\n```\n/run/media/andrew/Ventoy\n```"
  mdcn: "\n在做出是否包含用户目录的选择后，接下来你会看到设置向导已完成，并且向导对话框可以关闭。此时你有两个选择：点击创建图标，或者关闭 Timeshift\
    \ 图形用户界面，从命令行进行操作。\n\n在命令行使用 Timeshift 的语法非常直接。你需要 sudo 权限，所以基本上是 `sudo timeshift`\
    \ 加上一个标志，例如：\n\n```\n[andrew@darkstar:~]$ sudo timeshift --list\n```\n\n该命令的输出如下所示：\n\
