    ```\n\n```\nVentoy\n├── ISO\n│   └── kali-linux-2022.4-live-amd64.iso\n├── persistence.dat\n\
    └── ventoy\n    └── ventoy.json\n```\n\nIn the above \"Ventoy\" is the label for\
