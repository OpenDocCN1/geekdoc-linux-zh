    # Tor


    In today''s world we seem to be more and more monitored where it seems our permission
    has not been asked. Tor works by redirecting your web traffic through a series
    of different routers known as nodes. So I''ve seen where a page is trying to determine
    my location as coming up as in Germany. Basically you can browse and to put it
    succinctly without people tracking where you go. There is another application
    which is pen-testing a web site (white hat of course) where your IP address from
    where your launching a test can not be determined.


    Now it may not be immediately obvious but if yo try to go to https://www.torproject.org/
    to read up on Tor you might find your browser prevents you certainly that''s what
    I got using Virgin broadband. So probably the first thing you need to do is go
    into your internet settings.


    With virgin you have to log into " my virgin " and turn child safe off . Then
    install via packman :


    ```

    [andrew@darkstar ~]$ sudo pacman -S tor torbrowser-launcher torsocks

    ```


    Then enable tor :


    ```

    [andrew@darkstar ~]$ systemctl enable tor

    [andrew@darkstar ~]$ systemctl start tor

    ```


    ```

    [andrew@darkstar ~]$ sudo nano /etc/tor/torrc

    ```


    Find line stating #ControlPort 9051 and uncomment by removing the hash sign at
    the front .In nano move cursor to in front of C and just use backspace. Crtl +
    o, hit return , Ctrl +x


    Now we check out by launching tor browser from menu and we will go to https://check.torproject.org
    ( Make sure your wifi is on and your connected ) It will confirm if everything
    is OK . For docs see tor in man pages , or https://www.torproject.org/docs/tor-manual.html


    An example of using tor (perhaps your friend has asked you to do some white hat
    checking of their web security )


    ```

    [andrew@darkstar ~]$ sudo wpscan --url https://someDomain.com --proxy socks5://127.0.0.1:9050
    --enumerate u

    ```


    ```

    [andrew@darkstar ~]$ pacman -Ss wpscan

    extra/wpscan 1:3.8.22-3

    ```


