- md: " ## Tor\n\nIn today's world we seem to be more and more monitored where it\
    \ seems our permission has not been asked. Tor works by redirecting your web traffic\
    \ through a series of different routers known as nodes. So I've seen where a page\
    \ is trying to determine my location as coming up as in Germany. Basically you\
    \ can browse and to put it succinctly without people tracking where you go. There\
    \ is another application which is pen-testing a web site (white hat of course)\
    \ where your IP address from where your launching a test can not be determined.\n\
    \nNow it may not be immediately obvious but if you try to go to https://www.torproject.org/\
    \ to read up on Tor you might find your browser prevents you certainly that's\
    \ what I got using Virgin broadband. So probably the first thing you need to do\
    \ is go into your internet settings.\n\nWith virgin you have to log into \"my\
    \ virgin\" and turn child safe off. Then install via pacman:\n\n```\n[andrew@darkstar\
    \ ~]$ sudo pacman -S tor torbrowser-launcher torsocks\n```\n\nThen enable tor:\n\
    \n```\n[andrew@darkstar ~]$ systemctl enable tor\n[andrew@darkstar ~]$ systemctl\
    \ start tor\n```\n\n```\n[andrew@darkstar ~]$ sudo nano /etc/tor/torrc\n```\n\n\
    Find line stating #ControlPort 9051 and uncomment by removing the hash sign at\
    \ the front. In nano move cursor to in front of C and just use backspace. Crtl\
    \ + o, hit return, Ctrl + x\n\nNow we check out by launching tor browser from\
    \ menu and we will go to https://check.torproject.org (Make sure your wifi is\
    \ on and your connected) It will confirm if everything is OK. For docs see tor\
    \ in man pages, or https://www.torproject.org/docs/tor-manual.html\n\nAn example\
    \ of using tor (perhaps your friend has asked you to do some white hat checking\
    \ of their web security)\n\n```\n[andrew@darkstar ~]$ sudo wpscan --url https://someDomain.com\
    \ --proxy socks5://127.0.0.1:9050 --enumerate u\n```\n\n```\n[andrew@darkstar\
    \ ~]$ pacman -Ss wpscan\nextra/wpscan 1:3.8.22-3\n```\n\nBlack box WordPress vulnerability\
    \ scanner\n\nYou can use wpscan which tests Wordpress webs, if you have it in\
    \ dev and have set up a landing page via /etc/hosts eh 127.0.0.3\n\n## Android\
    \ phones\n\nIn days past for pictures i would reach for my camera but inevitably\
    \ i would have my camera and would take pics with my phone. These days with smart\
    \ phones having very competitive photo taking specs to cameras most people will\
    \ now just use their phone. I still like to have pictures on my laptop; the larger\
    \ screen makes for better editing；\n\nThere are a few ways you can get photo's\
    \ from your phone to your laptop. For single pictures I just email a photo to\
    \ myself using a yahoo email account to email to my google account and i just\
    \ pic the photo from my email.\n\nNow to be able to get your phone physically\
    \ mounted you just need a cable with male USB and male micro Android fitting to\
    \ ports on phone an laptop.\n\nOn Arch Linux you need the following packages:\n\
    \n- gvfs-mtp\n- android-file-transfer\n- android-udev\n- libmtp\n\nWhen the above\
    \ have been installed, your phone is connected by appropriate cable you should\
    \ see an icon of your phone on your laptop Desktop. When you click on it an get\
    \ a blank, that's because you have probably been timed out of your phone, its\
    \ to do with security of your phone and not allowing anyone access to file unless\
    \ they have logged into phone. So you need to go to phone and log your self back\
    \ in. This time when you click on the phone icon you should see something like\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_74_0.png)\n\nPhone camera pics are\
    \ in DCIM camera and whatsapp images are in WhatsApp/Media/WhatsApp Images\n\n\
    You Can just drag and drop onto your laptop Desktop\n\n## printer\n\nFor Linux\
    \ I have always found that Hewlett Packard printers are most likely to be compatible.\
    \ With printers it as a bit of a licence to print money for small personal printers;\
    \ i can tell you that my HP Smart Tank Wireless 455 doesn't fit into the category;\
    \ it has ink reservoirs at the side, the ink is relatively cheap and when they\
    \ say will last you 2 years with the ink it comes with they were not far wrong.\
    \ I wonder how long it will last? Too uneconomical for them?\n\nPackage for Arch:\n\
    \n```\n[andrew@darkstar ~]$ pacman -Ss hplip\nextra/hplip 1:3.23.5-1\n    Drivers\
    \ for HP DeskJet, OfficeJet, Photosmart, Business Inkjet and some LaserJet\n```\n\
    \nrun sudo hp-setup as root\n\nCUPS (common unix printing system) The name is\
    \ a legacy of the days of a system that was used to print from unix systems. With\
    \ cups you get a nice GUI via a URL usually:\n\n*localhost:631*\n\nAt that address\
    \ you can add printers and manage them. Lets install the package\n\n```\n[andrew@darkstar\
    \ ~]$  sudo pacman -S cups\ncheck its status :\n```\n\n```\n[andrew@darkstar ~]$\
    \ systemctl status cups\n○ cups.service - CUPS Scheduler\n    Loaded: loaded (/usr/lib/systemd/system/cups.service;\
    \ disabled; preset: disabled)\n    Active: inactive (dead)\nTriggeredBy: ○ cups.socket\n\
    \      Docs: man:cupsd(8)\n```\n\nenable cups\n\n```\n[andrew@darkstar ~]$ systemctl\
    \ enable cups\nstart cups\n[andrew@darkstar ~]$  systemctl start cups\n```\n\n\
    Once cups is up and running you can use the command line like so:\n\n```\n[andrew@darkstar\
    \ Desktop]$  lpstat -p -d\nprinter HP_Smart_Tank_Wireless_450_series is idle.\
    \  enabled since Fri Jun 23 08:23:21 2023\nno system default destination Lets\
    \ have a look at the GUI\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_76_0.png)\n\
    \nTo get to the CUPS GUI i simply opened up a browser and went to the URL:\n\n\
    [http://localhost:631/](http://localhost:631/)\n\nChoosing the Administration\
    \ menu option and then \"add printer option\" it was simply a matter of choosing\
    \ the nearest choice to my printer specifications which as you can see was 450\
    \ series. Its pretty straight forward in the blanks such as \"Location\" I just\
    \ typed in \"my office\". One thing that will save you time is to click the box\
    \ where it says \"share printer\". You will also get a chance to review how you\
    \ want the defaults set up, such as A4 etc\n\n## Web Development\n\n### introduction\n\
    \nI hear from a lot of people that they use wix and other sites to build webs.\
    \ My take is that its a bit like objective is to built a wall and you control\
    \ a robot who does the brick placing, one by one. So 5 years of doing that and\
    \ you still can't lay a single brick yourself. But if you start slow, step by\
    \ step, one element at a time then in much less than 5 years, you will never have\
    \ to rely on anything or anyone yourself to build a web. We will take it slow\
    \ and easy. html5 is the latest specification you can read all about it at:\n\n\
    https://html.spec.whatwg.org/\n\nWith geany installed you can produce a ready\
    \ to go html file spec 5 via:\n\nfile->new with template-> file_html5.html this\
    \ is what I got:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<!--\n  untitled.html\n\
    \    Copyright 2023 Unknown <andrew@darkstar>\n  This program is free software\
    \  etc etc\n-->\n<head>\n<meta charset=\"utf-8\" />\n<title>untitled</title>\n\
    <meta name=\"generator\" content=\"Geany 1.38\" />\n</head>\n<body>\n</html>\n\
    ```\n\nThe above relative to what you might see with other html producing software\
    \ is quite lean. A couple of things to mention html is what they call a \"markup\
    \ language\" its all about how things are configured to look. So when you edit\
    \ one line don't put \"kernel hacker\" on your CV just yet!\n\nTo save it we will\
    \ have to give the file a name. Now one question you might be thinking is when\
    \ there is a whole bunch of html files on a web server how does the server know\
    \ which to file to start with to render? Well the simple answer is that web servers\
    \ are configured to look for files index.html, index.php. Render means take the\
    \ markup and use it to display a web page.\n\nThe difference between html and\
    \ php is that html files are or used to be called \"static pages\"; that's because\
    \ their content is always the same unless you either login to your hosting and\
    \ do a live edit or you produce an edited version and upload it to your web hosting,\
    \ this will overwrite the old page. Access to web servers for shared hosting is\
    \ typically done say using cPanel."
  mdcn: "\n ## Tor\n\n在当今世界，我们似乎越来越多地受到监控，而且似乎都没有征求过我们的同意。Tor 通过将你的网络流量重定向到一系列不同的路由器（称为节点）来工作。所以我见过的情况是，某个页面试图确定我的位置，结果显示我在德国。基本上你可以浏览网页，简而言之，就是不让别人追踪你去哪里。还有另一个用途，就是对网站进行渗透测试（当然是白帽），这样从你发起测试的\
    \ IP 地址就无法被确定。\n\n现在可能不是一眼就能看出来的，但如果你想访问 https://www.torproject.org/ 了解 Tor，你可能会发现浏览器阻止了你——当然，这是我使用\
    \ Virgin 宽带时遇到的情况。所以你可能需要做的第一件事是进入你的互联网设置。\n\n使用 Virgin 的话，你必须登录\"my virgin\"\
    并关闭 child safe。然后通过 pacman 安装：\n\n```\n[andrew@darkstar ~]$ sudo pacman -S tor\
    \ torbrowser-launcher torsocks\n```\n\n然后启用 tor：\n\n```\n[andrew@darkstar ~]$\
    \ systemctl enable tor\n[andrew@darkstar ~]$ systemctl start tor\n```\n\n```\n\
    [andrew@darkstar ~]$ sudo nano /etc/tor/torrc\n```\n\n找到显示 #ControlPort 9051 的行，通过删除前面的井号来取消注释。在\
    \ nano 中，将光标移到 C 前面，然后按退格键。按 Crtl + o，回车，Ctrl + x\n\n现在我们通过从菜单启动 tor 浏览器来检查，并访问\
    \ https://check.torproject.org（确保你的 wifi 已开启且已连接）它会确认一切是否正常。有关文档，请参见 man pages\
    \ 中的 tor，或 https://www.torproject.org/docs/tor-manual.html\n\n使用 tor 的示例（也许你的朋友请你做一些白帽的安全检查）\n\
    \n```\n[andrew@darkstar ~]$ sudo wpscan --url https://someDomain.com --proxy socks5://127.0.0.1:9050\
    \ --enumerate u\n```\n\n```\n[andrew@darkstar ~]$ pacman -Ss wpscan\nextra/wpscan\
    \ 1:3.8.22-3\n```\n\n黑盒 WordPress 漏洞扫描器\n\n你可以使用 wpscan 来测试 Wordpress 网站，如果你在开发环境中并通过\
    \ /etc/hosts 设置了登录页面，比如 127.0.0.3\n\n## Android 手机\n\n在过去，我会拿相机来拍照，但 inevitably\
    \ 我虽然有相机，却还是用手机拍照。如今智能手机的拍照规格与相机相比非常有竞争力，大多数人现在只会使用手机。我仍然喜欢把照片放在笔记本电脑上；更大的屏幕更适合编辑；\n\
    \n有几种方法可以把照片从手机传到笔记本电脑。对于单张照片，我只是用雅虎邮箱把照片发给自己，发到我的谷歌邮箱，然后从邮件中挑选照片。\n\n要让手机物理挂载到电脑上，你只需要一根两端分别是\
    \ USB 公头和 micro Android 公头的数据线，连接到手机和笔记本电脑的端口。\n\n在 Arch Linux 上，你需要安装以下软件包：\n\
    \n- gvfs-mtp\n- android-file-transfer\n- android-udev\n- libmtp\n\n当上述软件包安装完毕，你的手机通过合适的线缆连接后，你应该能在笔记本电脑桌面上看到手机的图标。当你点击它时显示空白，那是因为你可能已经超时退出了手机，这与手机的安全性有关，不允许任何人访问文件，除非他们已登录手机。所以你需要去手机上重新登录自己。这次当你点击手机图标时，你应该会看到类似这样的内容\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_74_0.png)\n\n手机相机照片在 DCIM camera 中，whatsapp\
    \ 图片在 WhatsApp/Media/WhatsApp Images 中\n\n你可以直接拖放到笔记本电脑桌面上\n\n## 打印机\n\n对于 Linux，我一直认为惠普打印机最有可能兼容。对于打印机来说，小型个人打印机有点像印钞许可证；我可以告诉你，我的\
    \ HP Smart Tank Wireless 455 不属于那个类别；它侧面有墨水仓，墨水相对便宜，而且他们说随附的墨水能用 2 年，他们并没有太离谱。我在想它能用多久？对他们来说太不经济了？\n\
    \nArch 的软件包：\n\n```\n[andrew@darkstar ~]$ pacman -Ss hplip\nextra/hplip 1:3.23.5-1\n\
    \    Drivers for HP DeskJet, OfficeJet, Photosmart, Business Inkjet and some LaserJet\n\
    ```\n\n以 root 身份运行 sudo hp-setup\n\nCUPS（通用 Unix 打印系统）这个名字是过去从 Unix 系统打印的系统的遗留。使用\
    \ cups，你可以通过 URL 获得一个友好的图形界面，通常是：\n\n*localhost:631*\n\n在该地址，你可以添加和管理打印机。让我们安装这个软件包\n\
    \n```\n[andrew@darkstar ~]$  sudo pacman -S cups\ncheck its status :\n```\n\n\
    ```\n[andrew@darkstar ~]$ systemctl status cups\n○ cups.service - CUPS Scheduler\n\
    \    Loaded: loaded (/usr/lib/systemd/system/cups.service; disabled; preset: disabled)\n\
    \    Active: inactive (dead)\nTriggeredBy: ○ cups.socket\n      Docs: man:cupsd(8)\n\
    ```\n\n启用 cups\n\n```\n[andrew@darkstar ~]$ systemctl enable cups\nstart cups\n\
    [andrew@darkstar ~]$  systemctl start cups\n```\n\n一旦 cups 启动并运行，你可以像这样使用命令行：\n\
    \n```\n[andrew@darkstar Desktop]$  lpstat -p -d\nprinter HP_Smart_Tank_Wireless_450_series\
    \ is idle.  enabled since Fri Jun 23 08:23:21 2023\nno system default destination\
    \ Lets have a look at the GUI\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_76_0.png)\n\
    \n要进入 CUPS 图形界面，我只需打开浏览器并访问 URL：\n\n[http://localhost:631/](http://localhost:631/)\n\
    \n选择 Administration 菜单选项，然后选择\"add printer option\"，只需选择与我的打印机规格最接近的选项即可，如你所见是\
    \ 450 系列。填写空白处非常简单，比如\"Location\"我就输入了\"my office\"。有一点可以节省你的时间，就是勾选\"share printer\"\
    的复选框。你还有机会查看如何设置默认值，比如 A4 等\n\n## Web 开发\n\n### 简介\n\n我听很多人说他们使用 wix 和其他网站来构建网页。我的看法是，这有点像目标是砌一堵墙，而你控制一个机器人一块一块地放砖。所以这样做了\
    \ 5 年，你仍然不能自己砌一块砖。但如果你从慢开始，一步一步，一次一个元素，那么用不到 5 年，你就再也不用依赖任何东西或任何人来构建网页了。我们会慢慢来，轻松学习。html5\
    \ 是最新的规范，你可以在以下网址阅读全部内容：\n\nhttps://html.spec.whatwg.org/\n\n安装 geany 后，你可以通过以下方式生成一个现成的\
    \ html5 规范文件：\n\nfile->new with template-> file_html5.html 这就是我得到的结果：\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<!--\n  untitled.html\n    Copyright 2023\
    \ Unknown <andrew@darkstar>\n  This program is free software  etc etc\n-->\n<head>\n\
    <meta charset=\"utf-8\" />\n<title>untitled</title>\n<meta name=\"generator\"\
    \ content=\"Geany 1.38\" />\n</head>\n<body>\n</html>\n```\n\n相对于你可能在其他 html 生成软件中看到的，上面的代码相当简洁。有几点要提一下：html\
    \ 就是他们所说的\"标记语言\"，它全部关于如何配置事物的外观。所以当你编辑了一行代码时，先别急着在简历上写\"内核黑客\"！\n\n保存时我们需要给文件命名。现在你可能在想的一个问题是，当网页服务器上有一堆\
    \ html 文件时，服务器怎么知道要从哪个文件开始渲染？简单的答案是，网页服务器被配置为查找 index.html、index.php 文件。渲染的意思是获取标记并用它来显示网页。\n\
    \nhtml 和 php 的区别在于，html 文件过去被称为\"静态页面\"；这是因为它们的内容始终相同，除非你登录到你的托管服务进行实时编辑，或者你制作一个编辑过的版本并上传到你的网页托管，这将覆盖旧页面。访问共享托管的网页服务器通常通过\
    \ cPanel 等方式完成。\n"
