    值得一说的是，SQLite 可以支持高达 281 TB 数据的数据库。我认为这对大多数人来说已经足够了，我真的不知道为什么更多人不用 sqlite。当我们开始使用
    Code Igniter 时，你会看到它确实简化了生活。我在我所有的网站中都使用 sqlite，而且它从未成为安全问题。


