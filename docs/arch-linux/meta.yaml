    <h4> Item is :\" .$stuff['Item'].\"</h4>\";\n    echo \"<h4>Price is :\". $stuff['Price']\
    \ .\"</h4>\";\n    echo \"<br>\";\n}\n\n?>\n<?=$this->endSection()?>\n```\n\n\
    输出是完全一样的。所以这真的足以让你开始入门了。CodeIgniter 的文档位于：\n\nhttps://codeigniter4.github.io/userguide/index.html\n\
    \n一旦你用 sqlite 让一切运行起来，你可以切换到 maria 或其他 MySQL；我自己并没有发现这样做有什么优势。\n\n在控制器中，你可以使用\
    \ try catch 代码块来例如，在尝试渲染之前检查数据库中是否有任何数据。我是用以下方法实现的：\n\n```\n$db = \\Config\\Database::connect(\"\
    default\");\n$query = $db->query(\"SELECT COUNT(*) FROM portfolio \");\n$count\
    \ = $query->getRowArray();\nreturn $count;\n```\n\n所以现在我们已经让 CodeIgniter4 的基本功能运行起来了。要进一步学习，只需阅读文档：\n\
    \nhttps://codeigniter4.github.io/userguide/index.html\n\n遇到问题时，可以去论坛寻求帮助：\n\n\
    https://forum.codeigniter.com/\n\n然而，我们可以看看如何进行版本控制，我发现如果你搞砸了、代码根本用不了的时候，这是一个救命稻草；你至少可以回退到上次正常工作的状态。为此我们将设置\
    \ git。另外，我们还可以看看如何使用 Bootstrap 为 CI4 引入样式和响应式网页。我们将看看如何使用 SASS，它在样式方面比纯 CSS 更高效，以及如何覆盖\
    \ Bootstrap CSS；还有使用 Grunt，这是一个 JavaScript 任务运行器，用于将 SASS 转换为 CSS。\n\n## Git\n\
    \n我现在在一台新的（eBay 上的旧 HP）电脑上，所以首先要在全局设置 git；然后我会用终端切换目录到我的 web 应用的 web 根目录，并运行 init\
    \ 命令来专门为该 web 应用启动版本控制。\n\n好的，我启动了终端 Alacritty，正如你从 `~` 看到的，终端正在从我的主目录开始工作\n\n\
    ```\n[andrew@darkstar ~]$\n```\n\n现在使用 git，我知道它会想知道应该启动哪个软件来显示代码差异引起的冲突并能够合并它们。我一直用的是\
    \ \"meld\"，我知道这台笔记本上没有，所以现在要安装它。在设置 git 全局配置之前我需要先装好它。\n\n```\n[andrew@darkstar\
    \ ~]$ pacman -Ss meld\nextra/meld 3.22.0-2 [installed]\n    Compare files, directories\
    \ and working copies\n```\n\n哦，我错了，我已经装好了。我知道我有 geany，所以：\n\n```\n[andrew@darkstar\
    \ ~]$ git config --global user.name \"andy brookes\"\n[andrew@darkstar ~]$ git\
    \ config --global core.editor geany\n[andrew@darkstar ~]$ git config --global\
    \ color.uc auto\n[andrew@darkstar ~]$ git config --global merge.tool meld\n[andrew@darkstar\
    \ ~]$ git config --global user.email andybrookestar@gmail.com\n```\n\n```\n[andrew@darkstar\
    \ ~]$ git config --list\nuser.name=andy brookes\nuser.email=andybrookestar@gmail.com\n\
    core.editor=geany\ncolor.uc=auto\nmerge.tool=meld\n```\n\n好的，我的 CodeIgniter web\
    \ 文档根目录位于路径：\n/srv/http/joesoapdev\n\n所以我要切换到 web 根目录并执行 git 启动命令：\n\n```\n[andrew@darkstar\
    \ ~]$ cd /srv/http/joesoapdev\n[andrew@darkstar joesoapdev]$ git init\n```\n\n\
    ```\nhint: Using 'master' as the name for the initial branch. This default branch\
    \ name\nhint: is subject to change. To configure the initial branch name to use\
    \ in all\nhint: of your new repositories, which will suppress this warning, call:\n\
    hint:\n    git config --global init.defaultBranch <name>\nhint: Names commonly\
    \ chosen instead of 'master' are 'main', 'trunk' and\nhint: 'development'. The\
    \ just-created branch can be renamed via this command:\nhint:\n    git branch\
    \ -m <name>\nInitialized empty Git repository in /srv/http/joesoapdev/.git/\n\
    ```\n\n如你所见，它没有报错，还给了我们一些有用的提示。我们有上次努力的代码，所以我想确保所有内容都被添加，并设置一个初始起点注释和一个标签，以便在需要时轻松到达每个阶段：\n\
    \n```\n[andrew@darkstar joesoapdev]$ git add  .\n[andrew@darkstar joesoapdev]$\
    \ git commit -a -m  \"starting point\"\n[master (root-commit) fb76749] starting\
    \ point\n95 files changed, 8463 insertions(+)\n```\n\n注意上面 \"git add\" 后面跟着一个点，即一个句点，在几个空格之后，这会将我的\
    \ web 文档中的所有内容添加进来。现在我要添加一个标签，并看看我的 web 文档的 git 树。\n\n```\n[andrew@darkstar joesoapdev]$\
    \ git tag -a  v1.0 -m \" first point of dev\"\n```\n\n这并不完全是我们开发的真正第一个点，因为我们已经写了一些代码，但是嘿，它都能正常工作。现在让我们看看树里有什么：\n\
    \n```\n[andrew@darkstar joesoapdev]$ git  --all\n```\n\n你应该会看到类似下面图片的内容\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_114_0.png)\n\
    \n我只显示了执行命令后出现的输出图片的一部分\n\n```\n[andrew@darkstar ~]$ gitk  --all\n```\n\n现在，随着代码的进展，进行另一次提交的时机是在你向前推进了几步之后，流程总是一样的。让终端位于你的\
    \ web 根目录位置，也就是你想要更新 git 的地方，我的情况就是 `/srv/http/joesoapdev`，然后：\n\n```\n[andrew@darkstar\
    \ joesoapdev]$ git add  .\n[andrew@darkstar joesoapdev]$ git commit -a -m \"some\
    \ relevant comment \"\n[andrew@darkstar joesoapdev]$ git tag -a  v1.1  -m  \"\
    \  \"\n```\n\n用逻辑递进的名字创建一个新标签，例如，上次是 v1.0，所以下次我们设为 1.1\n\n除非你启用\"查看隐藏文件\"，否则你看不到，但\
    \ git 会在 web 根目录的 .git 目录中放置它的数据。现在对于开发来说，有很多你想要的东西，但不想上传到服务器。例如，`node_modules`\
    \ 是一个在我的 web 根目录中的目录，我在开发时需要它，但上线时并不需要，所以我在位于 web 根目录的 .gitignore 文件中添加一条：\n\n\
    ```\nnode_modules/*\n```\n\n这样可以减轻 git 要存储的内容的负担。另外，我使用 rsync 先从我的开发目录过滤到我的桌面上的一个目录。如果你没有\
    \ rsync，用 pacman 安装它。首先我将终端的目录切换到 `/srv/http/` 例如：\n\n```\n[andrew@darkstar ~]$\
    \ cd /srv/http\n[andrew@darkstar http]$ ls\nindex.php  joesoapdev\n[andrew@darkstar\
    \ http]$ rsync joesoapdev/  -avu --exclude .git  --exclude node_modules  --exclude\
    \ README.md    /home/andrew/Desktop/joesoap4liveserver/\n```\n\n这个命令会将 joesoapdev\
    \ 目录内的内容放入我桌面上名为 joesoap4liveserver 的目录中。这样我就不会搞乱我的开发目录，并且可以开始删除我不想上传到直播服务器的内容。从桌面我用终端将每个目录压缩成\
    \ zip。首先我们需要安装 zip\n\n```\n[andrew@darkstar ~]$ sudo pacman -S zip\n```\n\n将 app\
    \ 目录压缩成 zip...\n\n```\n[andrew@darkstar joesoap4liveserver]$ zip  -r  app.zip\
    \ app\n```\n\n然后我只用将 app.zip 上传到直播 web 托管，并使用我 web 托管上的 cPanel 解压，其他目录也是同样的做法。如果你不使用子目录和子域名，那么\
    \ public 目录**里面**的内容将直接放入你的 web 托管根目录。将其他目录打包到一个目录中，在你的 web 托管上将该目录放在 web 根目录级别之上，并编辑\
    \ index.php 中的路径，以便系统能找到 app 等\n"
