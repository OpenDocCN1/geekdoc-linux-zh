  md: '# Systemd in more depth


    If you think about a car, basically full confidence comes, when you feel you can
    understand what controls the car and are also to do so. Systems is running from
    the off. I want to try and demystify systemd for you a bit. if you can engage
    with it, then i think you will feel more comfortable with your OS. In the older
    SysV system there were scripts which when ran and could be referred to as "daemons".
    So for instance in Slackware Linux you have /etc/rc.d/rc.wireless from the Slackware
    site is says:


    rc.wireless This script sets up PCI, USB, and 32-bit Cardbus wireless devices
    - NOT 16-bit PCMCIA cards (those are configured in /etc/pcmcia/). Basically if
    you wanted to get your WiFi working, you would first have to give the rc.wireless
    script executive permission to run, then it would automatically run as a "daemon"
    on the next boot. That''s why Slackware was good for learning, things didn''t
    work until you made them work.


    Systemd has its own concepts, the way it refers to things and also the approach
    to get things enabled and running. What i would like to do is give an idea of
    whats involved, by creating our very own very small cog in the systemd ecosystem
    and do it in a way that is acknowledged, excepted and works. Systemd putting it
    succinctly manages an OS service and system by way of acting on units which can
    be defined as mostly service. A unit is defined by way of a "unit file" which
    is a file with plain text ini-style file and contains configuration directives
    that describe the unit and define its behaviour. We will create a unit file. For
    the full Monty see example man commands. All systemd files that are part of the
    your installed Linux operating system can be found in /lib/systemd/system/ To
    get an output you can use from a terminal prompt for example:


    ```

    [andrew@darkstar:~]$ ls /lib/systemd/system/

    ```


    leave those in /lib/systemd/system/ alone and don''t touch them. I''m going to
    show how to first create a script, that will be used to trim the quantity of our
    journal logs so you won''t have to do it manually. We will create a systemd unit
    which will control the script and give information on it. This will give a basic
    introduction to systemd and a basic understanding of how things work. You will
    see that new systemd units files will be stored in /etc/systemd/system


    After that i think a look at how you can leverage systemd to get information and
    how. We will need a text editor to do that, I use geany. I use it for PHP programming
    and other functions. If you don''t have it, then lets install it and its plugins
    using pacman:


    ```

    [andrew@darkstar:~]$ pacman -S geany geany-plugins

    ```


    So lets look at our script that we are going to produce. A command entered at
    any terminal emulator, that we can use to first see journal log volume and then
    keep the volume of journal log data on our system are:


    ```

    journalctl --disk-usage

    sudo journalctl --vacuum-size=10M

    ```


    In the above case I reduce volume of journal logs to 10 megabytes. That''s the
    ones that are in storage. But we can also put that command into a script.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'When the script is run, it will also run the command . because we will locate
    the script to /usr/bin it will have root powers. Lets use geany to create a script
    that we will use systemd to manage launch geany from your menu and left mouse
    click file->new on the geany menu


    Into the blank space type the 2 lines below :


    ```

    #!/bin/bash

    journalctl --vacuum-size=3M

    ```


    Then file->save as -> clean.sh that will save a file clean.sh in your home directory.
    Next because we are going to move the script to /usr/bin we want to make sure
    it has the right ownership and permissions so open a terminal and run:

    When you open a terminal by default it opens from the context of being in your
    home directory. Geany should also have stored script to home, so you should have
    to change directories.


    ```

    [andrew@darkstar:~]$    sudo chown root:root clean.sh

    [andrew@darkstar:~]$    sudo +x  clean.sh

    ```


    The above 2 commands gave permission to root and also made the script executable.


    next we will move the script clean.sh to /usr/bin via command :


    ```

    [andrew@darkstar:~]$  sudo mv clean.sh    /usr/bin/

    ```


    Now we will create a systemd unit to make use of the script. It will by the appropriate,
    and standardised way of using systemctl allow us to enable, disable get status
    etc of our unit, which in turn controls the use of the script.


    We will call our unit "clean" its full name in terms of systemd will be "clean.service".
    OK from a terminal lets create our service.


    ```

    sudo systemctl edit --force --full clean.service

    ```


    what that did on my system is bring up a nano text editor with the destination
    for the file to be saved being /etc/systemd/system

    into the blank screen of nano type exactly as seen:


    ```

    [Unit]

    Description=example use of systemd unit files

    [Service]

    ExecStart=/bin/bash  /usr/sbin/clean.sh

    Environment=SYSTEMD_LOG_LEVEL=debug

    [Install]

    WantedBy=multi-user.target

    ```'
