    I only show a section of the image that came up from the output of issuing the
    command

    `[andrew@darkstar ~]$ gitk  --all`


    Now as you progress with code the time to make another commit is where you have
    moved forward a few steps, the sequence is always the same . Have your terminal
    be at the location of your web root, that you want to update git in my case `/srv/http/joesoapdev`
    then:


    ```

    [andrew@darkstar joesoapdev]$ git add  .

    [andrew@darkstar joesoapdev]$ git commit -a -m "some relevant comment "

    [andrew@darkstar joesoapdev]$ git tag -a  v1.1  -m  "  "

    ```


    make a new tag with logical progression name Eg it was v1.0 so next time we make
    it 1.1


    You won''t see it unless you enable "view hidden files", but git places its data
    in a .git directory in the web root. Now for development there is a lot of stuff
    you want but don''t want to upload to the server. So for instance `node_modules`
    is a directory that''s been in my web root , that I need while developing but
    its not needed for live so in my .gitignore file which is at web root I add an
    entry :


    ```

    node_modules/*

    ```


    So that''s lightens the load on what git is going to store. Also i use rsync to
    first filter out from my dev to a directory on my Desktop. Install rsync with
    pacman if you don''t have it. First I change directory for the terminal to `/srv/http/`
    Eg


    ```

    [andrew@darkstar ~]$ cd /srv/http

    [andrew@darkstar http]$ ls

    index.php  joesoapdev

    [andrew@darkstar http]$ rsync joesoapdev/  -avu --exclude .git  --exclude node_modules  --exclude
    README.md    /home/andrew/Desktop/joesoap4liveserver/

    ```


    That command will place the contents of inside joesoapdev directory into a directory
    called joesoap4liveserver on my Desktop .That way I don''t mess up my dev directory
    and I make a start removing what I don''t want uploaded to the live server. From
    my Desktop i use a terminal to zip up each directory. First we need to install
    zip


    ```

    andrew@darkstar ~]$ sudo pacman -S zip

    ```


    to zip up the app directory ..


    ```

    [andrew@darkstar joesoap4liveserver]$ zip  -r  app.zip app

    ```


    Then i just upload app.zip to live web hosting and extract it using cPanel on
    my web hosting , same idea for other directories. If you not using sub-directories
    and sub domains, then the contents INSIDE the public directory will want to go
    directly into your web hosting root. Pack the other directories into one directory,
    place that above the web root directory level on your web hosting and edit path
    in index.php so system can find the app etc'
- md: ' ## Bootstrap5


    Bootstrap for PHP websites including CodeIgniter4 is great for front end. From
    memory Bootstrap was devised from the people who did Twitter. Bootstrap is being
    continually developed so it means you don''t have to; its quite functional particularly
    now its based on flexbox and is mobile responsive first. So I''m going to use
    that for our front end presentation for CodeIgniter.


    When you install CodeIgniter it has a default route called home, defined in routes
    at app/Config/Routes.php on line 14. In Route Definitions line 32 it sets out


    ```

    $routes->get(''/'', ''Home::index'');

    ```


    So on a URL just going to the domain name or my case 127.0.0.3 it will invoke
    the controller class home and its method index (index is default method). Looking
    at the index method of controller class home it has:


    ```

    return view(''welcome_message'');

    ```


    If you look in views you will see welcome_message.php. Now we want to start working
    on our default install, so that it becomes the website we want. My approach is
    to leave things working as they are, get something new working anyway you can
    then, finally tweak it, to your needs. So I''m not going to advocate replacing
    the default landing page yet. Instead I will work on a new prototype landing page;
    then when its working with a couple of tweaks make it the default landing page.


    Basically I will be aiming at a site with a navbar menu that has home, about me,
    contact me and have it so it collapses to a "burger" navigation icon on small
    viewing devices i.e mobile phones.


    So what do we need to have Bootstrap? Well in the past I used composer to install
    Bootstrap SASS into Vendor; actually all that''s needed is to override Bootstrap
    with a custom style sheet. So all you need to have Bootstrap functionality (I
    think only popper is missing) as of Bootstrap 5 is:


    ```

    bootstrap.css

    bootstrap.bundle.js

    ```


    You can have it via live links but I''m going to override the style sheet by calling
    style sheets into a single one which I will reference in my web header.


    So I got Bootstrap from:


    https://getbootstrap.com/docs/5.3/getting-started/download/


    Click on Compiled CSS and JS button and extract. I found the only 2 files you
    need are:

    - bootstrap.css

    - bootstrap.bundle.js


    I will progress to using sass for my custom style sheet since sass is more functional
    than CSS; I will at that point set up a task runner to convert custom.sass into
    custom.css. There are at least a couple I have used before such as Gulp and Grunt.
    Grunt should suffice.


    Also I will use some fancy font I will select and use at least one icon such as
    Facebook from Font Awesome since I think they look neat and crisp. So lets look
    at the directory architecture I will use in the public directory of CodeIgniter:


    ```

    [andrew@darkstar joesoapdev]$ tree -L 1 public

    public

    ├── css

    ├── favicon.ico

    ├── fonts

    ├── images

    ├── index.php

    ├── js

    ├── robots.txt

    └── sounds

    ```


    Because the Gruntfile.js we will use later is going to be at the web root I will
    have a directory at the web root called scss and inside it a file called custom.scss


    By the way when you echo out base_url() it equates to your domain name, and on
    my dev its http://127.0.0.3/ ; also since CodeIgniter is working from the public
    directory if you want to reference something in a view it will be in the form
    of:


    ```

    <script src="<?php echo base_url(''js/bootstrap.bundle.js'');?>"></script>

    ```


    In the above that will reference bootstrap js files if placed in a directory called
    "js" which is located in public (you don''t need to write public, because CI4
    is working from public). No forward slash needed in front of the js because echoing
    out base_url() ends in a forward slash.


    So looking at the output of the tree command. Css files will go into the directory
    css, images into the images directory, sass files into scss, web font into fonts
    and sound files into sounds. So drop bootstrap.css into the css directory and
    bootstrap.bundle.js into the js directory. I going to use a single reference for
    a style sheet in our webLayout.php file; I will do that by calling into it the
    other style sheets I want. For Font awesome I will just get it by putting this
    line into the header section of webLayout.php:


    ```

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">

    ```


    One thing you have to do is set the viewport in the header section of your web
    page. We will be using a layout for all pages, with the pages as content being
    effectively injected into the layout file which is webLayout.php.


    So now lets edit our layout template which is webLayout.php in the app/views directory;
    I placed


    ```

    <meta name="viewport" content="width=device-width, initial-scale=1" >

    ```


    in the header section. Now I''m probably not going to be satisfied with the font
    of bootstrap so I also will create a custom.css, also a font-face.css and place
    them both in public/css. I will edit my Style.css. I will take out the following
    code below from my Style.css that we had before and place it in custom.css:


    ```

    h1

    {

    color:green;

    }

    h4

    {

    font-family: "Times New Roman", Times, serif;

    color:maroon;

    }

    ```


    So now the only text entries in my Style.css will be:


    ```

    @import url("bootstrap.css");

    @import url("custom.css");

    @import url("font-face.css");

    ```


    All additional style code will go into custom.css the order is important because
    I want bootstrap.css first and custom.css after it, so that anything that is the
    same in bootstrap and custom.css will be overridden by whats in the custom.css.
    Also by doing it this way any code in custom.scss which will be converted to css
    won''t have any effect on the way we set things up in my Style.css. We previously
    set it up so that there is a single layout page and the content of any view is
    basically injected into the layout when rendered.


    So the main file we want to work on will be webLayout.php, whatever is done to
    that file, will be rendered out and visually displayed when any view is rendered.
    Visually the basics of our web will be as in the image left.


    So really all we want is to have say three divisions (divs) have them so that
    they are stacked in a column in the right order and that the contents will be
    responsive to the viewport size of devices. We can apply that to our webLayout.php
    file quite easily by defining divs and a little other code lets look at what we
    have at the moment.


    This is what webLayout.php in views looks like at the moment I took out the `<h1>`
    and also comment about it was produced by geany:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" >

    <title>

    <?php echo $title ?>

    </title>

    <link rel="stylesheet" type="text/css" href ="<?php echo base_url("css/myStyle.css");
    ?>">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">

    </head>

    <body>

    <?=$this->renderSection(''content'')?>

    <script src="<?php echo base_url(''js/bootstrap.bundle.js'');?>"></script>

    </body>

    </html>

    ```


    I added <?php echo $title ?> into the header section and we will pass data to
    the variable accordingly later via the controller.


    Next lets create a page which will become our homepage lets call it landingPage.php,
    we can create that just using geany and save it in views. All I will put in it
    for now is:


    ```

    <?=$this->extend(''webLayout'') ?>

    <?=$this->section(''content'') ?>

    <h1>Hello world </h1>

    <?=$this->endSection()?>

    ```


    Nice and succinct isn''t it? So the view extends our webLayout.php file. We define
    the start and end of what will be effectively injected into webLayout.php using:


    ```

    <?=$this->section(''content'') ?>  //start of content

    ```


    ```

    <?=$this->endSection()?>  //end of content)

    ```


    If you look at webLayout.php the stuff above gets put here:


    ```

    <?=$this->renderSection(''content'')?>

    ```


    So now we need to define a route in app/Config/Routes.php so as to invoke the
    view from a URL. I will use the Controller Class Home.php to do that, I will just
    create another method.'
  mdcn: "\n ## Bootstrap5\n\n为 PHP 网站（包括 CodeIgniter4）使用 Bootstrap 对于前端开发来说非常棒。据我所知，Bootstrap\
    \ 是由 Twitter 的开发者们设计的。Bootstrap  continuously being developed so it means you\
    \ don't have to; its quite functional particularly now its based on flexbox and\
    \ is mobile responsive first. So I'm going to use that for our front end presentation\
    \ for CodeIgniter.\n\n当你安装 CodeIgniter 时，它有一个名为 home 的默认路由，在 app/Config/Routes.php\
    \ 文件的第 14 行定义。在路由定义的第 32 行，它设置了：\n\n```\n$routes->get('/', 'Home::index');\n```\n\
    \n因此，当 URL 仅访问域名名或我的情况下 127.0.0.3 时，它将调用控制器类 home 及其方法 index（index 是默认方法）。查看控制器类\
    \ home 的 index 方法，它有：\n\n```\nreturn view('welcome_message');\n```\n\n如果你在 views\
    \ 中查看，你会看到 welcome_message.php。现在我们想开始处理我们的默认安装，使其成为我们想要的网站。我的方法是让事物保持原样运行，先以任何方式让新功能运行起来，最后根据需要进行调整。所以我不会主张立即替换默认的着陆页。相反，我将开发一个新的原型着陆页；然后当它运行时，只需稍作调整，即可将其设为默认着陆页。\n\
    \n基本上，我将目标设定为一个带有导航栏菜单的网站，菜单包含首页、关于我、联系我，并且在小型浏览设备（即手机）上能折叠为“汉堡包”导航图标。\n\n那么，我们需要什么来使用\
    \ Bootstrap 呢？过去我曾使用 composer 将 Bootstrap SASS 安装到 Vendor 目录；实际上，所有需要做的就是用一个自定义样式表覆盖\
    \ Bootstrap。所以，你只需要拥有 Bootstrap 功能（我认为只有 popper 缺失）即可，自 Bootstrap 5 起：\n\n```\n\
    bootstrap.css\nbootstrap.bundle.js\n```\n\n你可以通过实时链接获取，但我将通过调用样式表到一个单一文件中，以覆盖样式表，并在我的网页头部引用它。\n\
    \n所以我从以下地址获取了 Bootstrap：\n\nhttps://getbootstrap.com/docs/5.3/getting-started/download/\n\
    \n点击 Compiled CSS and JS 按钮并解压。我发现你只需要 2 个文件：\n- bootstrap.css\n- bootstrap.bundle.js\n\
    \n我将逐步使用 sass 作为我的自定义样式表，因为 sass 比 CSS 更 functional；届时我会设置一个任务运行器来将 custom.sass\
    \ 转换为 custom.css。至少有几个我以前用过的，比如 Gulp 和 Grunt。Grunt 应该足够了。\n\n另外，我会选择并使用一些漂亮的字体，并且至少会使用\
    \ Font Awesome 中的一个图标，比如 Facebook，因为我觉得它们看起来 neat and crisp。那么，让我们看看我将在 CodeIgniter\
    \ 的 public 目录中使用的目录架构：\n\n```\n[andrew@darkstar joesoapdev]$ tree -L 1 public\n\
    public\n├── css\n├── favicon.ico\n├── fonts\n├── images\n├── index.php\n├── js\n\
    ├── robots.txt\n└── sounds\n```\n\n因为稍后我们将使用的 Gruntfile.js 将位于 web 根目录，所以我会在 web\
    \ 根目录下有一个名为 scss 的目录，并在其中放置一个名为 custom.scss 的文件。\n\n顺便说一句，当你输出 base_url() 时，它等效于你的域名，在我的开发环境中是\
    \ http://127.0.0.3/；另外，由于 CodeIgniter 是从 public 目录运行的，如果你想在视图中引用某些内容，它将采用以下形式：\n\
    \n```\n<script src=\"<?php echo base_url('js/bootstrap.bundle.js');?>\"></script>\n\
    ```\n\n在上面的例子中，如果 bootstrap js 文件放置在名为 \"js\" 的目录中，它将引用这些文件，该目录位于 public 中（你不需要写\
    \ public，因为 CI4 是从 public 运行的）。js 前面不需要加斜杠，因为输出 base_url() 时末尾已有斜杠。\n\n所以，看看 tree\
    \ 命令的输出。Css 文件将放入 css 目录，图片放入 images 目录，sass 文件放入 scss 目录，网络字体放入 fonts 目录，声音文件放入\
    \ sounds 目录。所以将 bootstrap.css 放入 css 目录，将 bootstrap.bundle.js 放入 js 目录。我将在我们的\
    \ webLayout.php 文件中仅使用一个样式表引用；我将通过调用我想要其他样式表来实现这一点。对于 Font Awesome，我将通过将这一行放入\
    \ webLayout.php 的 header 部分来获取它：\n\n```\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css\"\
    >\n```\n\n有一件事你必须做，就是在网页的 header 部分设置视口。我们将对所有页面使用一个布局，页面作为内容实际上会被注入到布局文件 webLayout.php\
    \ 中。\n\n所以现在让我们编辑我们的布局模板，即 app/views 目录中的 webLayout.php；我放置了：\n\n```\n<meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1\" >\n```\n\n在 header\
    \ 部分。现在我可能对 bootstrap 的字体不会太满意，所以我还会创建一个 custom.css，以及一个 font-face.css，并将它们都放入\
    \ public/css 中。我将编辑我的 Style.css。我将从之前的 Style.css 中取出以下代码，并将其放入 custom.css：\n\n\
    ```\nh1\n{\ncolor:green;\n}\nh4\n{\nfont-family: \"Times New Roman\", Times, serif;\n\
    color:maroon;\n}\n```\n\n所以现在我的 Style.css 中唯一的文本条目将是：\n\n```\n@import url(\"bootstrap.css\"\
    );\n@import url(\"custom.css\");\n@import url(\"font-face.css\");\n```\n\n所有额外的样式代码都将放入\
    \ custom.css 中，顺序很重要，因为我想让 bootstrap.css 在前，custom.css 在后，这样 bootstrap 和 custom.css\
    \ 中相同的内容将被 custom.css 中的内容覆盖。另外，通过这种方式，custom.scss 中的任何代码（将被转换为 css）不会影响我们在 Style.css\
    \ 中设置的方式。我们之前已经设置了只有一个布局页面，任何视图的 content 基本上在渲染时注入到布局中。\n\n所以我们主要想处理的文件将是 webLayout.php，对该文件所做的任何更改，在渲染任何视图时都会被渲染并\
    \ visually displayed。我们网站的基本视觉效果如左图所示。\n\n所以实际上，我们想要的只是让三个 division（div）按照正确的顺序堆叠成一列，并且内容能响应设备的视口大小。我们可以很容易地将这一点应用到我们的\
    \ webLayout.php 文件中，通过定义 divs 和少量其他代码，让我们看看目前有什么。\n\n这是目前 webLayout.php 在 views\
    \ 中的样子，我移除了 `<h1>` 以及关于它是由 geany 生成的 comment：\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\" >\n<title>\n<?php echo $title ?>\n</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href =\"<?php echo base_url(\"css/myStyle.css\"\
    ); ?>\">\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css\"\
    >\n</head>\n<body>\n<?=$this->renderSection('content')?>\n<script src=\"<?php\
    \ echo base_url('js/bootstrap.bundle.js');?>\"></script>\n</body>\n</html>\n```\n\
    \n我在 header 部分添加了 <?php echo $title ?>，稍后我们将通过控制器向该变量传递数据。\n\n接下来让我们创建一个将成为我们主页的页面，我们称之为\
    \ landingPage.php，我们可以直接使用 geany 创建并将其保存在 views 中。目前我只在里面放置：\n\n```\n<?=$this->extend('webLayout')\
    \ ?>\n<?=$this->section('content') ?>\n<h1>Hello world </h1>\n<?=$this->endSection()?>\n\
    ```\n\n简洁明了，不是吗？所以该视图扩展了我们的 webLayout.php 文件。我们使用以下方式定义将 effectively injected\
    \ 到 webLayout.php 中的内容的开始和结束：\n\n```\n<?=$this->section('content') ?>  //content\
    \ 的开始\n```\n\n```\n<?=$this->endSection()?>  //content 的结束)\n```\n\n如果你查看 webLayout.php，上面的内容会被放置在这里：\n\
    \n```\n<?=$this->renderSection('content')?>\n```\n\n所以我们现在需要在 app/Config/Routes.php\
    \ 中定义一个路由，以便从 URL 调用该视图。我将使用控制器 Class Home.php 来完成，我会创建另一个方法。\n"
