  md: 'So now we will look at  views and how we can render data to a view; every web
    page has in common the footer and header, it would be nice is we could just have
    a template page and inject only the  relevant  data specific to a page.


    Well we can do that , since CI4 allows to leverage a layout. We will do that first  and
    put a link in the header to style sheet. A very simple one but,  the concept can
    easily be leveraged much further . You can for instance  link your pages to Bootstrap
    so you can access its powerful layout features and simply have another  style
    sheet of your own which you will call in after the bootstrap style sheet which
    means the part that are in common between the 2  will be overwritten by anything
    in the last sheet. That''s the approach I took.  So you can tweak  the look to
    your taste.


