    So in terms of today''s hard drives it at least shows that if you are frugal then
    your  Arch Install and all the subsequent packages you find you need are not that
    great in size.


    In the main install procedure I explain how to create partitions using fdisk;
    but you can set up partitions using parted from Mint live and then its just a
    case of selecting those partitions. You can play around with formatting another
    USB stick that''s attached in another USB port for practice. I suggest playing
    around with some of Mint live tools such has using nano, which is an easier  to
    use editor than VIM.


    Of course its quite possible that you find that you like Mint so much , you decide
    to install that instead. if you do its quite simple, you just left mouse click
    on the install icon. You can always come back to Arch later . What I''m trying
    to d oat this stage is address some questions that might come up. If you look
    at the above image, for instance Arch is installed to :

    /dev/sda4


    so where are user home directories  installed ? Well on my laptop i didn''t create
    a dedicated home partition. If you don''t when you use the command to create a
    user , the system will lookfor dedicated home partitions and if it finds any,
    put user directory there. if it doesn''t as in my case then it simply creates
    user directories as sub directories within the main Arch install architecture'
  - '[PAGE 21]


    The process to use gParted is just a matter of navigating the menu and making
    the right choices.To wipe everything on your PC select from drop down for device
    (usually /dev/sda) and select "create partition table".


    For an uefi computer choose the gpt option. Now if you see an efi partition on
    your PC, say if you are running Windows 10 but want to wipe it, you can leave
    the partition alone if its big enough at least 300MB. In this case don''t create
    a partition just delete everything else below the efi partition. If you do want
    to create a new efi partition choose type efi or FAT32. Note that green tick in
    top menu. You have to left mouse click that before g Parted will carry out for
    choices. I normally do one thing at a time, and click the green tick each time.If
    menu items are grey out, go to unmount in menu and unmount the partition you want
    to work on. When an efi partition has been created go to flags and tick the boot
    and ESP options.


    Now you can use a USB stick to have a play with gParted and also fdisk which I
    will go through later. It would be a good move for you to be confident with using
    the command line and how to use nano, be comfortable using a terminal before attempting
    an Arch Install. Lets have a look at nano while you have Mint up.


    Open a terminal on Mint live, and type:


    ```

    [andrew@darkstar:~]$ touch play.txt

    ```


    That will create a file called play.txt in home , which if you want you can confirm
    by navigating through the graphics display of directory structure.


    type in :


    ```

    [andrew@darkstar:~]$ nano play.txt

    ```


    play.txt opens and its of course blank. Type in something then


    ```

    ctrl+ o

    hit enter button

    ctrl +x

    ```


    OK lets leave using Mint live and lets have a go to see if we can boot up from
