- md: " This is what I got\n\n```\n[andrew@darkstar http]$ tree -L 1 joesoapdev\n\
    joesoapdev\n├── LICENSE\n├── README.md\n├── app\n├── builds\n├── composer.json\n\
    ├── composer.lock\n├── env\n├── phpunit.xml.dist\n├── preload.php\n├── public\n\
    ├── spark\n├── tests\n├── vendor\n└── writable\n```\n\nNow let me show you what\
    \ I have on live hosting using CI4, which is all you need.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_97_0.png)\n\
    \nThere is also a tecnickcom directory, that's just it was the way I originally\
    \ set it up.\n\nOn the next page I show a diagram of my web hosting and explain\
    \ how its set up.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_98_0.png)\n\nFor\
    \ security CodeIgniter has been developed so that the only contents that can be\
    \ accessed from the web are those inside the public directory. If you intend to\
    \ only have CI4 and nothing else in your main hosting, then the way you would\
    \ set it up is that the contents inside the public directory would go into your\
    \ main web hosting root.\n\nYou can bundle the other components app, writable\
    \ and vendor, into one directory which you will place one level above the main\
    \ hosting directory. You would then edit index.php which is inside the public\
    \ directory. The line below is the one you would modify\n\n```\nrequire FCPATH\
    \ . '../app/Config/Paths.php';\n```\n\nYou would reference the name of your directory\
    \ containing app, writable and vendor in the above line, say if you called it\
    \ \"other components\" to something like:\n\n```\nrequire FCPATH . '../othercomponents/app/Config/Paths.php';\n\
    ```\n\nNow with my setup of a sub-directory it's slightly different. Using cPanel\
    \ on my hosting I have to use add on domains so that the domain name points to\
    \ the hosting and make the document root:\n\n```\ndomainName.org/public\n```\n\
    \nIf using subdomains the way it works on my hosting anyone using one of my domains\
    \ the URL will point to the public directory inside the subdomain in the diagram\
    \ above\n\nI had a look at packagist for CI4 at:\nhttps://packagist.org/packages/codeigniter4/framework\n\
    \nThe suggested install is along the lines of:\n\n```\n[andrew@darkstar http]$\
    \ composer create-project codeigniter4/framework myweb2 --no-dev\n```\n\nwhere\
    \ myweb2 would be the name of the sub-directory; I say would be because I got\
    \ a problem stating intl not on my platform. Let's have a quick look at /etc/php/php.ini\n\
    \n```\n[andrew@darkstar ~]$ grep -n 'intl' /etc/php/php.ini\n929:;extension=intl\n\
    ```\n\nOK the extension I was looking for is found on line 929, is not enabled\
    \ for intl, so let's enable it because its bound to show up as a problem for something\
    \ else. So using nano I took away the \";\" from the front of that line so its\
    \ now:\n\n```\nextension=intl\n```\n\n```\n& from line 938\nextension=pdo_sqlite\n\
    ctl+o, hit return, ctl+x\n```\n\nOK this time no problem. Let's see the structure\
    \ using the tree command if you don't have it install it via pacman\n\n```\n[andrew@darkstar\
    \ http]$ tree -L 1 myweb2\nmyweb2\n├── LICENSE\n├── README.md\n├── app\n├── composer.json\n\
    ├── composer.lock\n├── env\n├── phpunit.xml.dist\n├── preload.php\n├── public\n\
    ├── spark\n├── system\n├── tests\n├── vendor\n└── writable\n```\n\nThis one is\
    \ not as clean with both a vendor and system folder. I only have a small brain\
    \ and am easily confused so I like the app starter first method\n\nNow will will\
    \ set up /etc/hosts file to serve up our landing page as we want it.\n\nCurrently\
    \ in **/etc/hosts:**\n\n```\n# Static table lookup for hostnames.\n# See hosts(5)\
    \ for details.\n127.0.0.1 localhost\n::1\n127.0.1.1 darkstar.localdomain darkstar\n\
    ```\n\nI'm going to edit that with nano to:\n\n```\n# Static table lookup for\
    \ hostnames.\n# See hosts(5) for details.\n127.0.0.1 localhost\n::1\n127.0.1.1\
    \ darkstar.localdomain darkstar\n127.0.0.3 joesoapdev\n```\n\nI have previously\
    \ had several subdomains and set up their landing pages using:\n\n- 127.0.0.3\n\
    - 127.0.0.4\n- 127.0.0.5\n- 127.0.0.6\n\nwith no problem, each local URL will\
    \ serve up the landing pages for different web debs. Basically it's a similar\
    \ set up on live, except I go to where I bought the domain from and point it to\
    \ my hosting. I add the domain to my hosting, then edit domain/subdomain document\
    \ root so that it points to the public directory of CodeIgniter\n\nNow we are\
    \ going to use virtual hosts to cater for the issue in that we need to point the\
    \ document root of the web for our set up to the public directory. You can do\
    \ that by adding code directory to /etc/httpd/conf/httpd.conf but it's neater\
    \ if you have several debs to edit /etc/httpd/conf/httpd.conf to look for accept\
    \ using virtual host files and place those files with the appropriate name in\
    \ **/etc/httpd/conf/vhosts**\n\nLet's start by editing: **/etc/httpd/conf/httpd.conf**\n\
    \nAround line 292 you will see the line:\n\n```\nAllowOverride None\n\n# hash\
    \ that out so its\n#AllowOverride None\n\n# and underneath write\nAllowOverride\
    \ All\n```\n\nAround line 519 you will see:\n\n```\n# Virtual hosts\n#Include\
    \ conf/extra/httpd-vhosts.conf\n```\n\nTake the hash sign away from the line stating\
    \ Include so it's now\n\n```\nInclude conf/extra/httpd-vhosts.conf\n```\n\nAround\
    \ lines 542 of httpd.conf I checked that this line was present, if it isn't add\
    \ it\n\n```\nInclude conf/extra/php_module.conf\n```\n\nwe will need a directory\
    \ to place our virtual host files in appropriately called \"vhosts\". So let's\
    \ create it.\n\n```\n[andrew@darkstar ~]$ cd /etc/httpd/conf\n[andrew@darkstar\
    \ conf]$\n[andrew@darkstar conf]$ ls\nextra httpd.conf httpd_bk.conf httpd_bk2.conf\
    \ magic mime.types\n[andrew@darkstar conf]$ sudo mkdir vhosts\n[sudo] password\
    \ for andrew:\n```\n\nOur structure of httpd now looks like this:\n\n```\n[andrew@darkstar\
    \ etc]$ tree -L 2 httpd\nhttpd\n├── conf\n│   ├── extra\n│   ├── httpd.conf\n\
    │   ├── httpd_bk.conf\n│   ├── httpd_bk2.conf\n│   ├── magic\n│   ├── mime.types\n\
    │   └── vhosts\n└── modules -> /usr/lib/httpd/modules\n```\n\nNow we can open\
    \ up geany and create a virtual host file for our web dev joesoapdev. The properties\
    \ of the file will be plain text\n\nrecapping on our entries in /etc/hosts they\
    \ are:\n\n```\n[andrew@darkstar etc]$ cat /etc/hosts\n# Static table lookup for\
    \ hostnames.\n# See hosts(5) for details.\n127.0.0.1  localhost\n::1\n127.0.1.1\
    \  darkstar.localdomain darkstar\n127.0.0.3  joesoapdev\n```\n\nwe will reflect\
    \ this in our virtualhost file here it is:\n\n```\n[andrew@darkstar etc]$ cat\
    \ /etc/httpd/conf/vhosts/joesoapdev\n<VirtualHost 127.0.0.3:80>\n    ServerAdmin\
    \ webmaster@joesoapdev\n    DocumentRoot \"/srv/http/joesoapdev/public\"\n   \
    \ ServerName joesoapdev\n    ServerAlias joesoapdev\n    ErrorLog \"/var/log/httpd/joesoapdev-error_log\"\
    \n    CustomLog \"/var/log/httpd/joesoapdev-access_log\" common\n    <Directory\
    \ \"/srv/http/joesoapdev/public\">\n        Order allow,deny\n        Allow from\
    \ All\n        AllowOverride All\n        Require all granted\n    </Directory>\n\
    </VirtualHost>\n```\n\nIf I go to /var/log/httpd this is what I have:\n\n```\n\
    [andrew@darkstar etc]$ ls /var/log/httpd\naccess_log  error_log  joesoapdev-access_log\
    \  joesoapdev-error_log\n```\n\nSo there are some handy log files should we get\
    \ errors. By the way on a server those files can start building up but you can\
    \ install \"logrotate\" to clean them\n\nedit /etc/logrotate.conf and add log\
    \ file:\n\n```\nCode:\n/var/log/httpd/joesoapdev-access_log\n{\nminsize 1M\nrotate\
    \ 1\n}\n```\n\nthen run Code manually:\n\n```\n[andrew@darkstar ~]$ sudo logrotate\
    \ -vf /etc/logrotate.conf\n```\n\n```\n[andrew@darkstar Desktop]$ sudo mv joesoapdev\
    \ /etc/httpd/conf/vhosts\n```\n\nthe writable directory with read write permissions\n\
    \n```\n[andrew@darkstar ~]$ cd /srv/http/joesoapdev\n[andrew@darkstar joesoapdev]$\
    \ ls writable\ncache debug bar logs session uploads\n```\n\n```\n[andrew@darkstar\
    \ joesoapdev]$ sudo chmod 777 writable -R\n```\n\nopen env file, to edit geany\
    \ works fine\n\nLine 17 we will change to:\n\n**CI_ENVIRONMENT = development**\n\
    \nLine 25 we remove the # as make it:\n\n**app.baseURL = 'http://127.0.0.3/'**\n\
    \n127.0.0.3 is the URL we set up to server the landing page for web dev joesoapdev\n\
    \nLine 137 we remove hash and make it:\n\n**logger.threshold = 9**\n\nsave the\
    \ env file to .env (period at front) we save it to a file with a period (or dot)\
    \ because the system will look for that file in terms of configuration.\n\nWe\
    \ can use systemd to check httpd.conf and virtual host file\n\n```\n[andrew@darkstar\
    \ ~]$ sudo apachectl -S\n[andrew@darkstar ~]$ sudo apachectl\nAH00526: Syntax\
    \ error on line 530 of /etc/httpd/conf/httpd.conf:\nInvalid command 'Inclue',\
    \ perhaps misspelled or defined by a module not included in the server configuration\n\
    ```"
  mdcn: "\n这是我得到的\n\n```\n[andrew@darkstar http]$ tree -L 1 joesoapdev\njoesoapdev\n\
    ├── LICENSE\n├── README.md\n├── app\n├── builds\n├── composer.json\n├── composer.lock\n\
    ├── env\n├── phpunit.xml.dist\n├── preload.php\n├── public\n├── spark\n├── tests\n\
    ├── vendor\n└── writable\n```\n\n现在让我给你看看我在使用 CI4 的实时托管环境上所部署的内容，这正是你所需要的。\n\n\
    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_97_0.png)\n\n还有一个 tecnickcom 目录，那只是我最初设置它时的样子。\n\
    \n在下一页，我会展示我的网络托管结构图，并解释它是如何设置的。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_98_0.png)\n\
    \n为了安全起见，CodeIgniter 的设计使得只有 **public** 目录中的内容可以从 web 访问。如果你打算只在你的主托管环境中部署 CI4\
    \ 而不放其他东西，那么你部署的方式应该是，将 **public** 目录中的内容放到你的主 web 托管根目录中。\n\n你可以把其他的组件 app、writable\
    \ 和 vendor 打包到一个目录中，并将这个目录放在主托管目录的上一级。然后你需要编辑 public 目录中的 index.php。下面这一行就是你需要修改的\n\
    \n```\nrequire FCPATH . '../app/Config/Paths.php';\n```\n\n你可以在上面的行中引用包含 app、writable\
    \ 和 vendor 的目录名称，比如说你把它叫做 \"othercomponents\"，就变成类似这样：\n\n```\nrequire FCPATH\
    \ . '../othercomponents/app/Config/Paths.php';\n```\n\n现在对于我在子目录上的设置，做法略有不同。在我的托管环境中使用\
    \ cPanel，我必须使用附加域名（add on domains），让域名指向托管空间，并设置文档根目录为：\n\n```\ndomainName.org/public\n\
    ```\n\n如果使用子域名，在我的托管环境中，任何人使用我的某个域名时，URL 都会指向上面图中子域名的 public 目录。\n\n我在 packagist\
    \ 上查看了 CI4 的地址：\nhttps://packagist.org/packages/codeigniter4/framework\n\n推荐的安装方式大致如下：\n\
    \n```\n[andrew@darkstar http]$ composer create-project codeigniter4/framework\
    \ myweb2 --no-dev\n```\n\n其中 myweb2 会是子目录的名称；我之所以说\"会是\"，是因为我遇到了一个问题，提示 intl 在我的平台上不可用。让我们快速看一下\
    \ /etc/php/php.ini\n\n```\n[andrew@darkstar ~]$ grep -n 'intl' /etc/php/php.ini\n\
    929:;extension=intl\n```\n\n好的，我找的扩展在第 929 行，但 intl 没有被启用，所以我们把它启用吧，因为不启用的话其他东西肯定会出问题。所以使用\
    \ nano，我把该行前面的 \";\" 去掉，现在变成：\n\n```\nextension=intl\n```\n\n```\n& 从第 938 行\n\
    extension=pdo_sqlite\nctl+o, 回车, ctl+x\n```\n\n好的，这次没问题了。我们用 tree 命令看看目录结构，如果你没有这个命令，请通过\
    \ pacman 安装\n\n```\n[andrew@darkstar http]$ tree -L 1 myweb2\nmyweb2\n├── LICENSE\n\
    ├── README.md\n├── app\n├── composer.json\n├── composer.lock\n├── env\n├── phpunit.xml.dist\n\
    ├── preload.php\n├── public\n├── spark\n├── system\n├── tests\n├── vendor\n└──\
    \ writable\n```\n\n这个版本不太干净，同时有 vendor 和 system 文件夹。我的脑子比较小，很容易被搞糊涂，所以我更喜欢先用 app\
    \ starter 的方法。\n\n现在我们来设置 /etc/hosts 文件，以便按照我们想要的方式展示我们的着陆页。\n\n目前在 **/etc/hosts**\
    \ 中：\n\n```\n# Static table lookup for hostnames.\n# See hosts(5) for details.\n\
    127.0.0.1 localhost\n::1\n127.0.1.1 darkstar.localdomain darkstar\n```\n\n我要用\
    \ nano 把它编辑成：\n\n```\n# Static table lookup for hostnames.\n# See hosts(5) for\
    \ details.\n127.0.0.1 localhost\n::1\n127.0.1.1 darkstar.localdomain darkstar\n\
    127.0.0.3 joesoapdev\n```\n\n我以前有过多个子域名，使用以下方式设置了它们的着陆页：\n\n- 127.0.0.3\n- 127.0.0.4\n\
    - 127.0.0.5\n- 127.0.0.6\n\n一切正常，每个本地 URL 都会为不同的 web 开发项目展示对应的着陆页。基本上与实时环境类似的设置，只不过我要到购买域名的服务商那里，将域名指向我的托管空间。我在托管空间中添加了域名，然后编辑域名/子域名的文档根目录，使其指向\
    \ CodeIgniter 的 public 目录。\n\n现在我们要使用虚拟主机来解决这个问题：我们需要将 web 环境的文档根目录指向 public 目录。你可以通过向\
    \ /etc/httpd/conf/httpd.conf 添加代码目录来实现，但如果你有好多个开发项目，更整洁的做法是编辑 /etc/httpd/conf/httpd.conf，让它查找并接收使用虚拟主机文件，然后将这些适当命名的文件放在\
    \ **/etc/httpd/conf/vhosts** 中。\n\n让我们从编辑 **/etc/httpd/conf/httpd.conf** 开始：\n\
    \n大约在第 292 行，你会看到这一行：\n\n```\nAllowOverride None\n\n# 把这行注释掉，变成\n#AllowOverride\
    \ None\n\n# 然后在下面写\nAllowOverride All\n```\n\n大约在第 519 行，你会看到：\n\n```\n# Virtual\
    \ hosts\n#Include conf/extra/httpd-vhosts.conf\n```\n\n去掉 Include 那行前面的井号，使它变成：\n\
    \n```\nInclude conf/extra/httpd-vhosts.conf\n```\n\n在 httpd.conf 大约第 542 行，我检查了这行是否存在，如果没有的话加上：\n\
    \n```\nInclude conf/extra/php_module.conf\n```\n\n我们需要一个目录来放置虚拟主机文件，恰当地叫它 \"vhosts\"\
    。所以我们来创建它。\n\n```\n[andrew@darkstar ~]$ cd /etc/httpd/conf\n[andrew@darkstar conf]$\n\
    [andrew@darkstar conf]$ ls\nextra httpd.conf httpd_bk.conf httpd_bk2.conf magic\
    \ mime.types\n[andrew@darkstar conf]$ sudo mkdir vhosts\n[sudo] password for andrew:\n\
    ```\n\n现在我们的 httpd 目录结构看起来是这样的：\n\n```\n[andrew@darkstar etc]$ tree -L 2 httpd\n\
    httpd\n├── conf\n│   ├── extra\n│   ├── httpd.conf\n│   ├── httpd_bk.conf\n│ \
    \  ├── httpd_bk2.conf\n│   ├── magic\n│   ├── mime.types\n│   └── vhosts\n└──\
    \ modules -> /usr/lib/httpd/modules\n```\n\n现在我们可以打开 geany，为我们的 web 开发环境 joesoapdev\
    \ 创建一个虚拟主机文件。文件的属性为纯文本。\n\n回顾一下我们在 /etc/hosts 中的条目：\n\n```\n[andrew@darkstar etc]$\
    \ cat /etc/hosts\n# Static table lookup for hostnames.\n# See hosts(5) for details.\n\
    127.0.0.1  localhost\n::1\n127.0.1.1  darkstar.localdomain darkstar\n127.0.0.3\
    \  joesoapdev\n```\n\n我们将在虚拟主机文件中反映这一点，如下：\n\n```\n[andrew@darkstar etc]$ cat\
    \ /etc/httpd/conf/vhosts/joesoapdev\n<VirtualHost 127.0.0.3:80>\n    ServerAdmin\
    \ webmaster@joesoapdev\n    DocumentRoot \"/srv/http/joesoapdev/public\"\n   \
    \ ServerName joesoapdev\n    ServerAlias joesoapdev\n    ErrorLog \"/var/log/httpd/joesoapdev-error_log\"\
    \n    CustomLog \"/var/log/httpd/joesoapdev-access_log\" common\n    <Directory\
    \ \"/srv/http/joesoapdev/public\">\n        Order allow,deny\n        Allow from\
    \ All\n        AllowOverride All\n        Require all granted\n    </Directory>\n\
    </VirtualHost>\n```\n\n如果我进入 /var/log/httpd，这就是我有的：\n\n```\n[andrew@darkstar etc]$\
    \ ls /var/log/httpd\naccess_log  error_log  joesoapdev-access_log  joesoapdev-error_log\n\
    ```\n\n所以如果我们遇到错误，这些日志文件会很方便。顺便说一下，在服务器上，这些文件可能会开始堆积，但你可以安装 \"logrotate\" 来清理它们\n\
    \n编辑 /etc/logrotate.conf 并添加日志文件：\n\n```\nCode:\n/var/log/httpd/joesoapdev-access_log\n\
    {\nminsize 1M\nrotate 1\n}\n```\n\n然后手动运行 Code：\n\n```\n[andrew@darkstar ~]$ sudo\
    \ logrotate -vf /etc/logrotate.conf\n```\n\n```\n[andrew@darkstar Desktop]$ sudo\
    \ mv joesoapdev /etc/httpd/conf/vhosts\n```\n\nwritable 目录需要读写权限\n\n```\n[andrew@darkstar\
    \ ~]$ cd /srv/http/joesoapdev\n[andrew@darkstar joesoapdev]$ ls writable\ncache\
    \ debug bar logs session uploads\n```\n\n```\n[andrew@darkstar joesoapdev]$ sudo\
    \ chmod 777 writable -R\n```\n\n打开 env 文件进行编辑，geany 就很好用\n\n第 17 行我们将改为：\n\n**CI_ENVIRONMENT\
    \ = development**\n\n第 25 行我们去掉 #，使其成为：\n\n**app.baseURL = 'http://127.0.0.3/'**\n\
    \n127.0.3 是我们为 web 开发环境 joesoapdev 配置的服务器着陆页 URL。\n\n第 137 行我们去掉 #，使其成为：\n\n**logger.threshold\
    \ = 9**\n\n将 env 文件保存为 .env（前面有个点），我们把它保存为带点（或句点）的文件名，因为系统在配置上会查找那个文件。\n\n我们可以使用\
    \ systemd 检查 httpd.conf 和虚拟主机文件\n\n```\n[andrew@darkstar ~]$ sudo apachectl -S\n\
    [andrew@darkstar ~]$ sudo apachectl\nAH00526: Syntax error on line 530 of /etc/httpd/conf/httpd.conf:\n\
    Invalid command 'Inclue', perhaps misspelled or defined by a module not included\
    \ in the server configuration\n```\n"
