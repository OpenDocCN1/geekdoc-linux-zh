    Now we will do some configuration to our part installed but not systemd running
    system. That''s because configuration is mostly either about populating files
    with data or about creating files and then populating them with data.


    # Set Time Zone


    The first thing on the list is to set the time zone. Now lets remind ourselves
    that we are currently in chroot, meaning what we type in , is in the context from
    our part installed system. Now when Arch is up and running you will have access
    to systemd and its journalctl ,systemctl and timedatectl. However systemd is not
    up and running. I didn''t want to overload the reader with too much pre-install
    stuff , so didn''t touch timezone in the install pre-able.


    But no problem; there are 2 approaches.From the chroot prompt type:


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Europe/London  /etc/localtime

    ```


    That will set time zone to GMT and when your system is up you can re-set it. The
    other approach is to come out of chroot, back to the Arch ISO install prompt.
    Do not worry the partition you mounted will stay mounted until you unmount it.
    So yo can just go back.


    To see a list of all timezones type from the Arch install ISO prompt:


    ```

    root@archiso ~# timedatectl list-timezones

    ```


    You should be able to scroll through the list  using keyboard up and down keys.
    When you see where you make a note of it. Then type Q to quit list.


    Don''t forget to get back to chroot so  type :


    ```

    root@archiso ~#  arch-chroot    /mnt

    ```


    Then  say your  nearest time zone is Africa/Accra then you type:


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Africa/Accra  /etc/localtime

    ```


    OK that''s the time zone done.


    The etc directory is the main place  for Linux system configuration. You will
    find for instance HTTP there which has configuration for Apache web server and
    any virtual hosts files. The command basically formed a link from  /usr/share/zoneinfo/\<Zone\>/\<City\>
    to the file /etc/localfile


    # Hardware Clock


    Now we are going to set the hardware clock to the system clock using :


    ```

    root@archiso : / # hwclock --systohc

    ```'
  - '[PAGE 29]


    # Localization


    ```

    root@archiso : / # nano /etc/locale.gen

    ```


    That command is going to open file /etc/locale.gen in nano. We touched on using
    nano earlier to try and make all this we are doing less painful. The file /etc/locale.gen
    is a file with a long list in the form of : <locale> <charset> with # in front.
    To enable any item in the list its just a matter of removing the # from the front
    of the line of your choice. My locale is Great Britain English and I want utf-8
    so , moving cursor up and down in nano i looked for #en\_GB.UTF-8 UTF-8 . I then
    positioned the cursor, in front of the # and hit my keyboard backspace key, once
    to remove the #.So the entry in my /etc/locale.gen it looks like:

    en\_GB.UTF-8 UTF-8


    Then I typed ctrl + o ,which highlights file nano is going to save to, basically
    just hit the return key to save to file. Then type ctrl + x to leave nano editor.


    # Hostname


    What is the hostname , simply put its the name of your computer, and it will be
    display on a network. So I decide my computer will be called "darkstar" its very
    original , its what ti used when i was on Slackware. So to name my computer "darkstar"
    I simply type:


    ```

    root@archiso : / # echo darkstar > /etc/hostname

    ```


    Create /etc/host file and populate it with needed minimum

    There is a command that can be used from a terminal oddly named but what it does
    is create a file with the name you give it, at the location specified. Example
    lets create /etc/hosts


    ```

    root@archiso : / # touch /etc/hosts

    ```


    Then edit our file:


    ```

    root@archiso : / # nano /etc/hosts

    ```


    Now in your nano editor type in exactly what yo see below except replace the word
    "darkstar" with the name you gave your computer


    ```

    127.0.0.1   localhost

    ::1          localhost

    127.0.1.1   darkstar.localdomain   darkstar

    127.0.0.3   joesoapdev

    ```


    > *Note*

    [

    you will edit /etc/hosts if doing web development on your PC. At the bottom line
    you see above I have added :

    127.0.0.3   joesoapdev

    Now with web sever running, if i type in ,directly into your web browser address
    bar : 127.0.0.3 then the landing page for my web dec of joesoapdev will be displayed

    ]'
  - '[PAGE 30]


    # Install Boot Loader


    There is where people get nervous because if it goes wrong . Lets recap ; our
    efi partition in my case the first one, /dev/sda1 is currently mounted to all
    intents and purposes to /boot. That''s because root is mounted to /mnt and we
    have chrooted /mnt. In other words /boot is a relative relative path which will
    be found because our chroot prompt works from the context of being in /mnt . OK
    then the command to install grub as out boot loader will be:


    ```

    root@archiso : / #  grub-install --target=x86_64-efi   --efi-directory=/boot --bootloader-id=GRUB   --recheck

    ```


    Does that make sense ? grub-install is the command to install GRUB , --target=x86_64-efi
    says the PC is a 64bit one and the motherboard is UEFI . --efi-directory=/boot
    says the place to put boot entries is /boot because that''s where we mounted the
    efi partition. The command will create an efi directory so don''t worry about
    that. What about " --bootloader-id=GRUB" . Well that''s just a means of allocating
    a label, you can have --bootloader-id=MyArchInstall if you like


    Then lastly


    ```

    root@archiso : / # grub-mkconfig   -o    /boot/grub/grub.cfg

    ```


    That''s an "o" in the above line not a 0 (zero). That will create the grub con
    fig stuff. Finishing Off ,we had better create a root password, which we will
    need on booting up or dormant installed OS


    ```

    root@archiso : / #  passwd root

    ```


    type in your password for root and write it down. Whats left is to install a Desktop
    , install graphic drivers , create a user account. Also edit sudoers so that a
    user can function with the equivalent of root powers. There will be some other
    post install tweaks. Further on I will approach maintenance tasks.


    You will find when your Arch operating system is running it produces log reports,
    which are really useful but can build up. Stuff builds up in your user account
    cache directory and if you decide to do web development , then logs will also
    start building up from the production of Apache logs. I am going to address all
    of that and also introduce you to systemd. What else, well we need to install
    a firewall .Probably a few other things. You might be feeling a tad overwhelmed
    but the good news is that when things are set up and running, really there is
    little to do, except update your system which will just take one command as a
    user.


    ```

    sudo  pacman -Syu

    ```


    before using pacman there is a little command, to initiate keys etc. Also install
    an email account.Then I will review pacman commands I have found useful.'
  - '[PAGE 31]


    # After thoughts


    Well we have the core of Arch Installed; we could now come out of chroot using
    the command "exit" , shutdown, reboot and be able to do a text login of root.
    Trouble is we might encounter a few problems ; the Arch install ISO that we have
    booted up has the availability of the package IWD, that is a package that allowed
    us to connect to the Internet via WIFI. You could install IWD, and as long as
    we have installed a terminal emulator then we could do everything from our installed
    and running system. But that''s more work to do. So at this stage we will stay
    in chroot and carry on.


    If you have a look at file /etc/pacman.conf It states :


    > # NOTE: You must run `pacman-key --init` before first using pacman; the local
    # keyring can then be populated with the keys of all official Arch Linux # packagers
    with `pacman-key --populate archlinux`.


    So we can do that now.


    ```

    root@archiso : / # pacman-key --init

    root@archiso : / # pacman-key --populate archlinux

    root@archiso : / # pacman -Syy

    ```


    Now lets add a user who''s name is gina so that when we boot up our new Arch we
    can work in none root mode.


    ```

    [root@darkstar:~]# useradd -m -G wheel -s /bin/bash gina

    ```


    create a password for gina


    ```

    [root@darkstar:~]# passwd gina

    ```


    it will ask yo to type in again. Now we have a user, and its always best to avoid
    working as root .Trouble is our user has limited power . We need to edit sudoers
    list. With the sudoers list you have to be a tad careful. Its the place that when
    correctly edited will give power to users who are in the wheel group, by using
    sudo. Its always done with the command visudo. In the above line I stipulate I
    want to use the editor nano to do that. lets edit sudoers :


    ```

    root@archiso : / # EDITOR=nano visudo

    ```


    Using nano remove the # in the first line you see quoting wheel i.e to %wheel
    ALL=(All) All hit keyboard keys Ctrl + o , then hit return key to write to file
    then Ctrl +x to exit. Couple of things I want to say. You may find you have trouble
    logging in as a user but not as root. Couple of reasons for that .if you have
    edited sudoers, but have not installed the "sudo" you will find you can log in
    after you have installed that package. The other one is that systemd-homed might
    not be running check with for example:'
- md: " # Install Graphical Environment - the Desktop\n\nBefore Arch I had tried quite\
    \ a few Linux Distros and their Desktops. I like things plain and simple but with\
    \ functionality. XFCE was fine on Slackware; I just couldn't get on with Desktops\
    \ where things bounce up and down. On Arch I have tried GNOME, Budgie, LXDE, Openbox\
    \ but still prefer Cinnamon. Cinnamon is actually a fork of Gnome, but as default\
    \ you can have icons like home, trash etc on your Desktop.\n\nTo use the Cinnamon\
    \ Desktop on Arch, you also need a display manager, and a graphical login which\
    \ is the greeter. We also need xorg and the right drivers for your graphic hardware.\n\
    \nSo I previously mentioned we would need that information and showed you how\
    \ to get it using inxi. Mine is: AMD Stoney [Radeon R2/R3/R4/R5 Graphics]\n\n\
    So to install Cinnamon Desktop for Arch that has AMD graphic hardware.\n\n```\n\
    root@archiso : / # pacman -S xorg\n```\n\nNote in the above line the word \"xorg\"\
    \ is actually representing in terms of pacman a group download. So the command\
    \ above will install all the x server stuff. Next I'm going to install the graphics\
    \ drivers for my laptop. I have previously given the other options if you need\
    \ the drivers for Intel or Nvidia.\n\n```\nroot@archiso : / # pacman -S xf86-video-amdgpu\n\
    ```\n\nNow we will install the Cinnamon Desktop and needed pkgs\n\n```\nroot@archiso\
    \ : / # pacman -S cinnamon lightdm lightdm-gtk-greeter\n```\n\nNow lets remind\
    \ ourselves were we are at and whats running. We are working from the Arch ISO\
    \ install system, in chroot, so in the context of being in our installed system.\
    \ Now a little mention of systemd. What is systemd? Well put succinctly its a\
    \ system and service manager for your operating system. Problem is, its not actually\
    \ running. Never mind the way that it works is that you can enable units now from\
    \ chroot of the none running system, so that the units will atomically start when\
    \ the system boots.\n\nThe most important will be so that we can get our graphical\
    \ Desktop up. So lets enable our desktop manager, in my case lightdm. That's all\
    \ you need to enable to be able to get a graphical login and your Desktop up.\n\
    \n```\nroot@archiso : / # systemctl enable lightdm\n```\n\nYou should see a link\
    \ being created. That's how systemd does its enabling\n\n```\nroot@archiso : /\
    \ # systemctl enable NetworkManager\n```\n\nOK I think we can now come out of\
    \ chroot, power down, and on powering up be able to login as a normal none root\
    \ user but still be able to get root privileges to do things.\n\nCome out of chroot:\n\
    \n```\nroot@archiso : / # exit\n```\n\nPowerdown:\n\n```\nroot@archiso ~# shutdown\
    \ now -h\n```\n\n# Post Install Tweaks and additions\n\nAfter this section I will\
    \ be writing about how to rescue your Arch operating system if something awry\
    \ happens. If you have a working system you can do just about anything; for instance\
    \ install the Long term support kernel (LTS) and then remove the current one.\
    \ Install another Desktop.\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_34_0.png)\n\
    \nBut you can not do anything, if you can not get your operating system up and\
    \ running.\n\nOne possible procedure to write about now that trumps writing about\
    \ rescuing your system is putting a fire wall in place.\n\nI use \"uncomplicated\
    \ Firewall\" UFW, which also has a GUI for it. I have tested my laptop via the\
    \ Shield up service via the web at URL\n\n[https://www.grc.com](https://www.grc.com)\n\
    \nBasically the site can test live your PC and see how vulnerable the ports are\
    \ to being maliciously penetrated. I got back they were not able to penetrate.\
    \ Their exact message was \"THE EQUIPMENT AT THE TARGET IP ADDRESS DID NOT RESPOND\
    \ TO OUR UPnP PROBES!\" try it yourself.\n\nLet's install UFW and its GUI\n\n\
    ```\n[andrew@darkstar:~]$ sudo pacman -S ufw gufw\n```\n\nThe above command will\
    \ install uncomplicated firewall and its accompany GUI\n\n```\n[andrew@darkstar:~]$\
    \ sudo systemctl enable ufw\n```\n\n```\n[andrew@darkstar:~]$ systemctl status\
    \ ufw\n• ufw.service - CLI Netfilter Manager\n  Loaded: loaded (/usr/lib/systemd/system/ufw.service;\
    \ enabled; preset: disabled)\n  Active: active (exited) since Mon 2023-03-\n```\n\
    \nDon't be dismayed by \"preset:disabled\". My understanding is that it means\
    \ the unit does not run automatically, you have to enable it first, then it will\
    \ start at each boot\n\n# Rescue & Fix\n\n## Desktop Graphic Issues\n\nI am looking\
    \ at rescue straight after installing Arch Linux simply because that the last\
    \ thing you want to find is that your system is borked and your Arch operating\
    \ system won't boot up. That would mean having to start a learning curve to know\
    \ how to fix it. Learning is never good when your under stress.\n\nThe first problem\
    \ I will look at will be graphic problems. Most people come from windows where\
    \ you don't see what goes on behind the scenes as the operating system boots up\
    \ and you are taken straight to a graphic login. You can with Arch and other Linux\
    \ distributions simply bypass booting to a graphical environment and instead boot\
    \ to a command line.\n\nBasically if you can successfully boot to a command line,\
    \ login then find you have internet connection and functionality with the package\
    \ manager pacman, then one can assume if you had problems booting and logging\
    \ in at a graphical environment, well there was some issue with the Window manager/Desktop\n\
    \nI had recently such an issue with Cinnamon; I thought I could trawl through\
    \ systemd logs or as I've had been meaning to try Budgie Desktop why not kill\
    \ two birds with one stone and see if I can get to a command line and if so, install\
    \ and configure budgie to boot as default.\n\nOk so first how do we bypass booting\
    \ to the graphic greeter? Well we will simply request to boot to runtime level\
    \ 3, by adding the parameter of 3 at the grub boot stage. To do that, after powering\
    \ up from a cold boot and seeing the grub splash, simply press the \"e\" key on\
    \ your keyboard, this will bring up an option to \"set params\".\n\nUsing the\
    \ up and down keys move down to the line that has the words \"Linux vmlinuz ....\"\
    \ at the beginning of the line. (see image below).\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_35_0.png)\n\
    \nAt the end of that line with a space type in the single digit \"3\" without\
    \ the quotation marks.\n\nWhen you have typed in the number 3, don't then hit\
    \ the return button instead hit the ctrl key and x key.(together). That will make\
    \ the system boot to runtime 3.\n\nYou should see a load of text code flashing\
    \ before your eyes on the screen, when it's done you will see the hostname for\
    \ the computer with \"login\" prompt.\n\nSo type in your usual login name and\
    \ then you will get a prompt for the user password. After doing the above I then\
    \ saw :\n\n```\n[andrew@darkstar:~]$\n```\n\nNext I tested to see if internet\
    \ was connected by issuing the command :\n\n```\n[andrew@darkstar:~]$ ping 8.8.8.8\n\
    PING 8.8.8.8 (8.8.8.8) 56(84) bytes of data.\n```\n\nOutput was:\n\nCtl+c to put\
    \ a stop to that then check pacman by typing :\n\n```\n[andrew@darkstar:~]$ pacman\
    \ -Syy\n```\n\nOutput showed repositories were synchronised\n\nNext what came\
    \ to mind is if I'm going to install budgie what display manager is有关单位Renee和\
    \ by the way what is my system using as a display manager at the moment as default?\n\
    \nWell this should show it :\n\n```\n[andrew@darkstar:~]$ systemctl status display-manager\n\
    ● lightdm.service - Light Display Manager\n```\n\nNow to be fair I knew that,\
    \ since I know I installed and enabled it when I installed the Cinnamon Desktop.\
    \ What if you knew you were using Gnome and had installed GDM and wanted to try\
    \ budgie.\n\nNo problem one approach disable GDM with systemctl, install lightdm,\
    \ enable lightdm.\n\ne.g.\n\n```\n[andrew@darkstar:~]$ sudo systemctl disable\
    \ gdm.service\n\n[andrew@darkstar:~]$ sudo pacman -S lightdm\n[andrew@darkstar:~]$\
    \ sudo systemctl enable lightdm\n```\n\nThe above command will make lightdm run\
    \ at next boot up.\n\nIf you search for budgie with pacman using the command below\
    \ it shows that the term \"budgie\" represents a group of packages and not one.\n\
    \n```\n[andrew@darkstar:~]$ pacman -Ss budgie\n```\n\n```\nextra/budgie-backgrounds\
    \ 3.0-1 (budgie)\n    The default background set for the Budgie Desktop\nextra/budgie-control-center\
    \ 1.4.0-1 (budgie)\n    Budgie's main interface to configure various aspects of\
    \ the system\nextra/budgie-desktop 10.9.1-2 (budgie)\n    A familiar, modern desktop\
    \ environment\nextra/budgie-desktop-view 1.3-2 (budgie)\n    Desktop icons implementation\
    \ for the Budgie Desktop\nextra/budgie-extras 1.7.1-1\n    Additional Budgie Desktop\
    \ components from the Ubuntu Budgie team\nextra/budgie-screensaver 5.1.0-2 (budgie)\n\
    \    Screensaver for the Budgie Desktop\nextra/budgie-session 0.9.1-1 (budgie)\n\
    \    The Budgie Desktop session handler\nextra/magpie-wm 0.9.3-1\n    Budgie's\
    \ X11 window manager and compositor library forked from Mutter\n```\n\nOk that\
    \ looks fine so, to install the budgie Desktop group of packages :\n\n```\n[andrew@darkstar:~]$\
    \ sudo pacman -S budgie\n```\n\nNext I will want budgie to be default Desktop\
    \ environment. Since I have xorg server installed I'm going to edit the .xinitrc\
    \ file which if you click on your file manager \"see hidden files\" you will find\
    \ in your home directory.\n\nSince the file is in your home directory sudo permissions\
    \ are not required and you can edit the file with any suitable text editor such\
    \ as geany.\n\nAt the bottom I have entry:\n\n```\nexec budgie-desktop\n```\n\n\
    When budgie Desktop environment has been installed and .xinitrc edited, on reboot\
    \ you should find the system boots to a graphical login."
  mdcn: "\n# 安装图形环境——桌面\n\n在 Arch 之前，我尝试过不少 Linux 发行版及其桌面。我喜欢简洁但功能齐全的东西。XFCE 在 Slackware\
    \ 上表现不错；我就是受不了那些图标上下弹跳的桌面。在 Arch 上，我尝试过 GNOME、Budgie、LXDE、Openbox，但还是更喜欢 Cinnamon。Cinnamon\
    \ 实际上是 Gnome 的一个分支，但默认情况下你可以在桌面上放置主页、回收站等图标。\n\n要在 Arch 上使用 Cinnamon 桌面，你还需要一个显示管理器，以及图形登录界面，也就是\
    \ greeter。我们还需要 xorg 以及适合你显卡硬件的驱动。\n\n所以我之前提到过我们需要这些信息，并展示了如何使用 inxi 获取。我的是：AMD\
    \ Stoney [Radeon R2/R3/R4/R5 Graphics]\n\n因此，要为拥有 AMD 显卡硬件的 Arch 安装 Cinnamon 桌面。\n\
    \n```\nroot@archiso : / # pacman -S xorg\n```\n\n注意，在上面的命令中，\"xorg\" 这个词实际上在 pacman\
    \ 中表示一个组下载。所以上面的命令会安装所有 x 服务器相关的组件。接下来我要为我的笔记本电脑安装显卡驱动。我之前已经给出了其他选项，如果你需要 Intel\
    \ 或 Nvidia 的驱动。\n\n```\nroot@archiso : / # pacman -S xf86-video-amdgpu\n```\n\n\
    现在我们将安装 Cinnamon 桌面及所需的软件包\n\n```\nroot@archiso : / # pacman -S cinnamon lightdm\
    \ lightdm-gtk-greeter\n```\n\n现在让我们回顾一下当前的进度和正在运行的内容。我们是从 Arch ISO 安装系统工作的，处于\
    \ chroot 环境中，也就是处于已安装系统的上下文中。现在简单提一下 systemd。什么是 systemd？简而言之，它是你操作系统的系统和服务管理器。问题是，它实际上并没有在运行。不过没关系，它的工作方式是你可以在尚未运行的系统的\
    \ chroot 环境中启用单元，这样这些单元会在系统启动时自动启动。\n\n最重要的是让我们能够启动图形桌面。所以让我们启用我们的桌面管理器，我的情况是\
    \ lightdm。这就是你需要启用的全部内容，以便能够进行图形登录并启动桌面。\n\n```\nroot@archiso : / # systemctl\
    \ enable lightdm\n```\n\n你应该会看到正在创建链接。这就是 systemd 启用服务的方式\n\n```\nroot@archiso\
    \ : / # systemctl enable NetworkManager\n```\n\n好了，我想我们现在可以退出 chroot，关机，然后重新开机时能够以普通非\
    \ root 用户登录，但仍然能够获取 root 权限来执行操作。\n\n退出 chroot：\n\n```\nroot@archiso : / # exit\n\
    ```\n\n关机：\n\n```\nroot@archiso ~# shutdown now -h\n```\n\n# 安装后的调整和补充\n\n在本节之后，我将介绍如何在\
    \ Arch 操作系统出现问题时进行救援。如果你有一个能正常工作的系统，你几乎可以做任何事情；例如安装长期支持内核（LTS），然后移除当前内核。安装另一个桌面。\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_34_0.png)\n\n但是，如果你无法让操作系统启动和运行，你就什么都做不了。\n\
    \n现在有一个可能比写系统救援更值得介绍的操作，那就是设置防火墙。\n\n我使用\"简易防火墙\"（*Uncomplicated Firewall*，UFW），它也有图形界面。我通过网页上的\
    \ Shield up 服务测试了我的笔记本电脑，网址是\n\n[https://www.grc.com](https://www.grc.com)\n\n\
    基本上，该网站可以实时测试你的电脑，查看端口被恶意入侵的脆弱程度。我得到的结果是它们无法入侵。他们的确切信息是\"目标 IP 地址上的设备未响应我们的 UPnP\
    \ 探测！\"你自己可以试试。\n\n让我们安装 UFW 及其图形界面\n\n```\n[andrew@darkstar:~]$ sudo pacman -S\
    \ ufw gufw\n```\n\n上面的命令将安装简易防火墙及其配套的图形界面\n\n```\n[andrew@darkstar:~]$ sudo systemctl\
    \ enable ufw\n```\n\n```\n[andrew@darkstar:~]$ systemctl status ufw\n• ufw.service\
    \ - CLI Netfilter Manager\n  Loaded: loaded (/usr/lib/systemd/system/ufw.service;\
    \ enabled; preset: disabled)\n  Active: active (exited) since Mon 2023-03-\n```\n\
    \n不要被\"preset:disabled\"吓到。我的理解是，这意味着该单元不会自动运行，你必须先启用它，然后它才会在每次启动时启动\n\n# 救援与修复\n\
    \n## 桌面图形问题\n\n我在安装 Arch Linux 后立即介绍救援，原因很简单：你最不想发现的就是系统坏了，Arch 操作系统无法启动。那意味着不得不开始学习如何修复它的知识曲线。在压力之下学习可不是什么好事。\n\
    \n我要看的第一个问题是图形问题。大多数人来自 Windows，在那里你看不到操作系统启动时后台发生了什么，直接被带到图形登录界面。使用 Arch 和其他\
    \ Linux 发行版，你可以简单地绕过启动到图形环境，改为启动到命令行。\n\n基本上，如果你能成功启动到命令行，登录后发现你有互联网连接并且 pacman\
    \ 软件包管理器功能正常，那么可以假设，如果你之前在启动和登录图形环境时遇到问题，那就是窗口管理器/桌面有问题。\n\n我最近就遇到了 Cinnamon 的这样的问题；我想我可以翻阅\
    \ systemd 日志，或者既然我一直想尝试 Budgie 桌面，为什么不一举两得呢，看看能否进入命令行，如果可以，安装并配置 budgie 作为默认启动。\n\
    \n好的，首先我们如何绕过启动到图形 greeter？很简单，我们将通过在 grub 启动阶段添加参数 3 来请求启动到运行级别 3。要做到这一点，在冷启动开机并看到\
    \ grub 启动画面后，只需按键盘上的 \"e\" 键，这将弹出一个\"设置参数\"的选项。\n\n使用上下键移动到以 \"Linux vmlinuz ....\"\
    \ 开头的行。（见下图）。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_35_0.png)\n\n在该行的末尾加一个空格，然后输入单个数字\
    \ \"3\"，不带引号。\n\n输入数字 3 后，不要按回车键，而是同时按 ctrl 键和 x 键。这将使系统启动到运行级别 3。\n\n你应该会看到屏幕上闪过大量文本代码，完成后你会看到计算机的主机名和\
    \ \"login\" 提示。\n\n所以输入你通常的登录名，然后你会得到用户密码提示。完成上述操作后，我看到了：\n\n```\n[andrew@darkstar:~]$\n\
    ```\n\n接下来我测试互联网是否连接，通过执行命令：\n\n```\n[andrew@darkstar:~]$ ping 8.8.8.8\nPING 8.8.8.8\
    \ (8.8.8.8) 56(84) bytes of data.\n```\n\n输出为：\n\n按 Ctl+c 停止，然后输入以下命令检查 pacman：\n\
    \n```\n[andrew@darkstar:~]$ pacman -Syy\n```\n\n输出显示仓库已同步\n\n接下来想到的是，如果我要安装 budgie，应该使用什么显示管理器，顺便问一下，我的系统目前默认使用什么显示管理器？\n\
    \n这个命令应该能显示：\n\n```\n[andrew@darkstar:~]$ systemctl status display-manager\n●\
    \ lightdm.service - Light Display Manager\n```\n\n公平地说，我知道这一点，因为我知道我在安装 Cinnamon\
    \ 桌面时安装并启用了它。如果你知道自己在使用 Gnome 并安装了 GDM，想尝试 budgie，怎么办？\n\n没问题，一种方法是先用 systemctl\
    \ 禁用 GDM，安装 lightdm，启用 lightdm。\n\n例如：\n\n```\n[andrew@darkstar:~]$ sudo systemctl\
    \ disable gdm.service\n\n[andrew@darkstar:~]$ sudo pacman -S lightdm\n[andrew@darkstar:~]$\
    \ sudo systemctl enable lightdm\n```\n\n上面的命令将使 lightdm 在下次启动时运行。\n\n如果你用下面的命令用\
    \ pacman 搜索 budgie，它会显示 \"budgie\" 这个词代表一组软件包，而不是一个。\n\n```\n[andrew@darkstar:~]$\
    \ pacman -Ss budgie\n```\n\n```\nextra/budgie-backgrounds 3.0-1 (budgie)\n   \
    \ The default background set for the Budgie Desktop\nextra/budgie-control-center\
    \ 1.4.0-1 (budgie)\n    Budgie's main interface to configure various aspects of\
    \ the system\nextra/budgie-desktop 10.9.1-2 (budgie)\n    A familiar, modern desktop\
    \ environment\nextra/budgie-desktop-view 1.3-2 (budgie)\n    Desktop icons implementation\
    \ for the Budgie Desktop\nextra/budgie-extras 1.7.1-1\n    Additional Budgie Desktop\
    \ components from the Ubuntu Budgie team\nextra/budgie-screensaver 5.1.0-2 (budgie)\n\
    \    Screensaver for the Budgie Desktop\nextra/budgie-session 0.9.1-1 (budgie)\n\
    \    The Budgie Desktop session handler\nextra/magpie-wm 0.9.3-1\n    Budgie's\
    \ X11 window manager and compositor library forked from Mutter\n```\n\n好的，看起来不错，所以，要安装\
    \ budgie 桌面软件包组：\n\n```\n[andrew@darkstar:~]$ sudo pacman -S budgie\n```\n\n接下来我希望\
    \ budgie 成为默认桌面环境。由于我已经安装了 xorg 服务器，我将编辑 .xinitrc 文件，如果你点击文件管理器的\"显示隐藏文件\"，你会在你的主目录中找到它。\n\
    \n由于该文件在你的主目录中，不需要 sudo 权限，你可以用任何合适的文本编辑器（如 geany）编辑该文件。\n\n在底部我有条目：\n\n```\n\
    exec budgie-desktop\n```\n\n当 budgie 桌面环境已安装并且 .xinitrc 已编辑后，重新启动时你应该会发现系统启动到图形登录界面。\n"
