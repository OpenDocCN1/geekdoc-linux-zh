    Mode : RSYNC\nStatus : OK\n1 snapshots, 32.3 GB free\n\nNum Name Tags Description\n\
    0 > 2023-05-18_10-25-21 0\n```\n\n删除快照的命令是：\n\n```\n[andrew@darkstar:~]$ sudo\
    \ timeshift --delete\n```\n\n注意，我没有输入任何要删除的快照详细信息。这是因为我将通过 Timeshift 为每个快照分配的编号作为参考来被要求输入。\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_44_0.png)\n\n所以要删除列出的快照，我只需在提示符处输入：0\n\
    \n创建新快照的命令大致如下，我添加了一条注释，在使用 `timeshift --list` 时会显示：\n\n```\n[andrew@darkstar:~]$\
    \ sudo timeshift --create --comments ' 2nd snapshot'\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_45_0.png)\n\
    \n好的，现在我们已经安装了 Timeshift 并创建了一个快照，我们可以轻松地访问它。\n\n接下来是关于从 U 盘启动 Live Linux 发行版的过程，以及在需要时将选定的快照恢复到从中启动\
    \ U 盘和 Linux 发行版的计算机。\n\n在此之前有几件事需要注意。第一，由于 Arch 是滚动更新版本，你的操作系统更新会很频繁。这意味着你也必须频繁地创建新快照，并根据需要删除旧快照以腾出空间。\n\
    \n现在，将计算机恢复到某个快照的过程涉及从 U 盘启动例如 Mint 或其他 Linux 发行版。你需要从菜单中选择 Timeshift，并再次通过 GUI\
    \ 向导操作，这次你使用的是从 U 盘启动的 Linux 上的 Timeshift。\n\n例如，你仍然会再次选择 rsync，这样 Timeshift 可以确认你想使用\
    \ rsync，然后你会从 Timeshift 给出的导航列表中选择快照所在的位置。如果像我在朋友的笔记本电脑上那样，我设置了一个标记为 \"timeshift\"\
    \ 的专用分区，那么找到快照并不太困难。\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_46_0.png)\n\n\
    上图是从 U 盘启动的 Live Linux 发行版上的 Timeshift 截图，Timeshift 在我导航的帮助下成功找到了快照。所以要继续的话，通常只需用鼠标左键点击你想要恢复的快照（通常是最新的快照）。然后从菜单中点击恢复选项。\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_46_1.png)\n\n看上面的图片，你可以看到我正在使用从 U 盘启动的\
    \ Kali Linux live。如果你发现默认没有安装某些软件，在 Kali 的情况下，你可以从命令行使用：\n\n```\n$ apt search\
    \ timeshift\n$ sudo apt install timeshift\n```\n\n这会给你临时使用任何已安装程序的能力，但下次从 U 盘启动时它就会消失。使用\
    \ Ventoy 有一种方法可以实现持久化，这样下次启动时你安装的任何东西都会保留。此外，你的 WiFi 配置也会被记住，这很方便。\n\n接下来出现的选项如上面快照右侧所示是目标设备。它显示了默认选择。我的\
    \ HP 笔记本电脑上的主要 Arch 安装在分区 /dev/sda4 上，所以上述选择对我来说是正确的。我在根安装上有一个 boot 目录。\n\n这台\
    \ HP 笔记本电脑的硬盘容量较小，所以我没有设置单独的家目录分区。\n\n/dev/sda1 是我的 EFI 分区\n\n/dev/sda2 是交换分区\n\
    \n最后一个分区是\n\n/dev/sda4。\n\nboot 目录被列为根目录中的目录之一\n\n这是我的 boot 目录内容，如果你想和你的比较的话：\n\
    \n```\nboot\n├── amd-ucode.img\n├── EFI\n│   ├── arch\n│   └── GRUB\n├── grub\n\
    │   ├── fonts\n│   ├── grub.cfg\n│   ├── grubenv\n│   ├── locale\n│   ├── themes\n\
    │   └── x86_64-efi\n├── initramfs-linux-lts-fallback.img\n├── initramfs-linux-lts.img\n\
    └── vmlinuz-linux-lts\n```\n\n所以对于我的 HP 笔记本电脑，我保留了 Timeshift 给出的选择。\n\n是的，保持那样选择即可。我安装时没有为家目录设置专用分区，所以我的家目录实际上是主根安装内部的一个子目录。所以保留那个选择。基本上接下来只需点击下一步。希望你会看到恢复过程在你眼前完成，并以\"\
    no errors\"结束。\n\n## U 盘上的 Linux —— 瑞士军刀\n\n为了尝试降低学习曲线，我之前建议将 Linux Mint 和 Arch\
    \ 安装 ISO 一起放到 U 盘上。这是因为 Timeshift 作为默认包已经安装，所以你不必费心尝试安装它。\n\n当 Linux 发行版完全安装在你的计算机硬盘上时，安装的软件会在你启动时可用。通过\
    \ U 盘以 live 方式使用的 Linux 发行版行为略有不同，它们在 RAM 中运行；你可以安装 ISO 附带的额外软件并使用它，但下次从 U 盘启动时它就会消失。这完全与\
    \ Linux 以 ISO 形式在 RAM 中运行的方式有关，RAM 是临时的。\n\nU 盘上的 Linux 发行版可以是非常有效的瑞士军刀；你可以使用\
    \ gParted 以图形方式格式化硬盘，运行 fsck 可以扫描计算机硬盘上的文件系统错误并修复它们。\n\n我发现有一些我想要的程序默认没有安装，我希望它们在我从\
    \ U 盘启动 Linux 发行版时随时可用。所以现在我来看看如何使用 Ventoy 配合 U 盘上的 Linux Live 发行版 ISO 并实现持久化。\n\
    \n有一些从 U 盘运行的 Linux 可以做到的事情，是从硬盘运行的 Linux 发行版无法做到的。\n\n其中之一是运行 fsck 命令，例如：\n\n\
    ```\n$ sudo fsck -vy /dev/sda2\n```\n\n上面的 /dev/sda2 是我笔记本电脑上的分区之一。你无法在运行中的操作系统上直接对笔记本电脑的分区运行\
    \ fsck；这是因为为了能够对分区运行 fsck，该分区必须被卸载；笔记本电脑上正在运行的 Linux 发行版的分区正在使用中且已挂载。\n\n有一种方法可以让\
    \ U 盘上的 live Linux 操作系统记住你的 WiFi 设置，并保留你发现需要下载和安装的任何内容。\n\n使用 Ventoy 会有一点额外的工作要做；它涉及创建一个用于持久化的\
    \ .dat 文件并添加一个 ventoy.json 条目。我认为这是值得的，因为结合使用具有持久化的 Kali live，你可以准备并随时准备好一把瑞士军刀来修复问题。我将给你提供你需要的基本要点，但你可以在\
    \ Ventoy 网站上看到更多信息。\n\nhttps://www.ventoy.net/en/plugin.html\n\nhttps://www.ventoy.net/en/plugin_entry.html\n\
    \n现在我想第一个问题会是：\n\n我们知道以 ISO 文件形式的 Linux 操作系统可以从 U 盘启动并运行，但哪些 Linux 发行版候选看起来不错，它们在响应速度方面快、已经安装了很多东西，而且它们也能很好地与用于实现持久化的文件配合工作？\n\
    \n好吧，我可以为你节省大量时间和麻烦；我已经尝试使用不同的 USB 上的 Linux live 操作系统，使用 Ventoy 时我发现 Kali Linux\
    \ 工作良好，启动后你从终端运行命令时它们以\"root\"权限操作。我还发现，如果你想在非运行中的 PC 操作系统桌面区域保存某些内容，比如图像截图，Kali\
    \ Linux 会将其放到那里而不会抱怨。\n\n使用 Mint 时你会得到\"permission denied\"（权限被拒绝），而当你有问题时你不想费心折腾。一旦我得到了为\
    \ Kali 创建合适 dat 文件的正确命令，它就能很好地工作了。\n\n让我给你概述一下你需要什么以及你可以拥有什么。你能否在 U 盘上同时放置 Kali\
    \ Linux 和 Arch 安装 ISO 并实现持久化——是的，你可以。首先，我将向你展示一个持久化正常工作的 USB 盘上的 Kali Linux 的结构。\n\
    \n我建议选择 16G 的 U 盘；顺便说一下，你不必把它和 Arch ISO 放在同一个 U 盘上，相反，你可以在同一个 U 盘上放置大约 4 到 5 个不同的发行版。你可以让一些没有持久化功能，一些有。这完全取决于你如何设置结构，在正确的位置放置正确的文件，然后配置\
    \ Ventoy.json 文件。下面我使用终端中的 tree 命令来获取我的 Ventoy 格式化 U 盘的结构布局：\n\n```\n[andrew@darkstar:media/andrew]$\
    \ tree -L 2 Ventoy\n```\n\n```\nVentoy\n├── ISO\n│   └── kali-linux-2022.4-live-amd64.iso\n\
    ├── persistence.dat\n└── ventoy\n    └── ventoy.json\n```\n\n上面的 \"Ventoy\" 是\
    \ U 盘连接到我的笔记本电脑时的标签。在我的 Arch 笔记本电脑上，它挂载到：\n\n```\n/run/media/andrew/Ventoy\n```\n"
