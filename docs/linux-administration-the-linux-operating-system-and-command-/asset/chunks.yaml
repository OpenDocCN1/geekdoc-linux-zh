    You also learned how to manage disks and create file systems. We talked about
    creating and managing users and groups on a Linux system. You learned about TCP/IP
    networking and how to configure network interfaces on a Linux server. You also
    learned some techniques to troubleshoot common network problems.


    From there you learned how to manage jobs and processes. Next, you tackled the
