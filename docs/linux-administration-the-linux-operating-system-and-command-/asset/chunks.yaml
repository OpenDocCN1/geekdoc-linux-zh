    `-u` 选项来指定 `UID`。


    ```

    useradd -c “MySQL Server” -d /opt/mysql -u 97 -s /usr/sbin/nologin mysql

    tail -1 /etc/passwd

    ```


    `mysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin`


    - `-u UID` 为用户指定数字 `UID`。


    ## 删除账户


    要删除账户，请使用 `userdel` 命令后跟用户名。如果你想删除账户的家目录，请使用 `-r` 选项。它还会删除用户的邮件邮箱池（如果存在）。


    在示例中，我们将删除 `eharris` 账户，但保留他的家目录完整，因为里面有一些我们以后想用的文件。我们还将删除 `grant` 账户并移除他的家目录。


    ```

    ls /home

    eharris grant

    userdel eharris

    ls /home

    eharris grant

    userdel -r grant

    ls /home

    eharris

    ```


    ## 更新账户


    要更新或修改现有账户，请使用 `usermod` 命令。以下是 `usermod` 命令最常用的选项。要查看可用选项的列表，请参 `man usermod`
    或 `usermod —help`。


    `usermod [options] username`


    - `-c “COMMENT"` 更新注释字段。

    - `-g GROUP` 更改主组。

    - `-G GROUP1,GROUPN` 更改账户所属的附加组。

    - `-s /path/to/shell` 更改账户的 shell。


    在本例中，我们更新与 `mysql` 账户关联的注释。


    ```

    grep mysql /etc/passwd

    mysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin

    usermod -c “MySQL User” mysql

    grep mysql /etc/passwd

    mysql:x:97:1003:MySQL User:/opt/mysql:/usr/sbin/nologin

    ```


    ## 组


    组详情存储在 `/etc/group` 文件中


    `/etc/group` 文件的第一项是 `root` 组。


    `root:x:0:`


    这是 `/etc/group` 中的另一个示例条。


    `sales:x:1001:john,mary`


    `/etc/group` 文件的格式如下。


    `group_name:password:GID:account1,accountN`


    每个字段由冒号分隔。组名是你在通过 `ls` 等命令显示组信息时看到的类可读名称。


    密码用于特权组，但该功能很少被使用。当该字段中有 `x` 时，意味着正在使用 shadow 组密码。该信息存储在 `/etc/gshadow` 文件中。


    `GID` 是组 ID。它只是一个代表组的唯一数字。


    剩余字段列出了用逗号分隔的组组员。


    你可能注意到 `root` 组没有包含成员列表。记住 `/etc/passwd` 文件指定了账户的默认组。对于 root 用户，默认的 `GID` 是 `0`。当账户的默认
    `GID` 列在 `/etc/passwd` 中时，它也会在 `/etc/group` 中被列出（不，此处原文逻辑是：当账户的默认 GID 列在 /etc/passwd
    中时...此处原文表述略显生硬，意应为：当账户的默认 GID 列在 /etc/passwd 中时...）。


    在 `/etc/passwd` 中：


    ```

    ```bash

    root:x:0:root:/root:/bin/bash

    ```


    要显示某个成员所属的组，将用户名传递给 `groups` 命令。


    ```

    ```

    grep root /etc/passwd

    root:x:0:root:/root:/bin/bash

    groups root

    root : root

    ```


    ## 创建组


    要创建一个组，使用 `groupadd` 命令。


    `groupadd [options] group`


    - `-g GID` 为组指定数字值。


    `groupadd` 命令最常用的选项是 `-g`，允许你指定 `GID`。让我们创建两个组。对于第一个组，让 `groupadd` 命令自动选择 `GID`。对于第二个组，我们将指定
    `GID`。


    ```

    groupadd web

    tail -1 /etc/group

    web:x:1003:

    groupadd -g 2500 db

    tail -1 /etc/group

    db:x:2500:

    ```


    ## 删除组


    要删除组，只需将组名传递给 `groupdel` 命令。


    `groupdel group`


    让我们删除 `db` 组。


    ```

    groupdel db

    ```


    ## 更新组


    要修改现有的属性，使用 `groupmod` 命令。


    `groupmod [options] group`


    - `-g GID` 更改组 ID。

    - `-n GROUP` 更改组名。


    在本例中，我们将 `web` 组的 `GID` 从 `1003` 更改为 `1234`。接下来，将名称从 `web` 更改为 `http`。


    ```

    grep web /etc/group

    web:x:1003:

    groupmod -g 1234 web

    grep web /etc/group

    web:x:1234:

    groupmod -n http web

    grep http /etc/group

    http:x:1234:

    ```


    ## 将组和用户结合


    在以下示例中，我们将创建一个 writers 组、tv 组和 movie 组。接下来我们将创建一些账户。所有这些账户都属于 writers 组，但只有其中一部分属于
    tv 组，而其他的属于 movie 组。


    ```

    groupadd writers

    groupadd tv

    groupadd movie

    useradd -c “Carlton Cuse” -g writers -G tv -m -s /bin/bash ccuse

    passwd ccuse

    输入新的 UNIX 密码：

    重新输入新的 UNIX 密码：

    passwd: password updated successfully

    groups ccuse

    ccuse : writers tv

    useradd -c “David Fury” -g writers -G tv -m -s /bin/bash dfury

    passwd dfury

    输入新的 UNIX 密码：

    重新输入新的 UNIX 密码：

    passwd: password updated successfully

    groups dfury

    dfury : writers tv

    useradd -c “Matt Damon” -g writers -G movie -m -s /bin/bash mdamon

    passwd mdamon

    输入新的 UNIX 密码：

    重新输入新的 UNIX 密码：

    passwd: password updated successfully

    groups mdamon

    mdamon : writers movie

    ```

