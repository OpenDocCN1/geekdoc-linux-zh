- fmt: "\n`gedit` - The default text editor for the Gnome desktop environment.\n\n\
    `gvim` - The graphical version of `vim`.\n\n`kedit` - The default text editor\
    \ for the KDE desktop environment.\n\nIf you are looking for a Microsoft Word\
    \ replacement, consider `AbiWord` or `LibreOffice`. `LibreOffice` not only includes\
    \ a word processor, but it is a complete office suite with a spreadsheet program,\
    \ a database, and presentation software.\n\nIf you are looking for a source code\
    \ editor to aid in computer programming, look at `Geany`, `jEdit`, or `Kate`.\
    \ `Sublime Text` is another option. It is a commercial product that runs on Windows,\
    \ Mac, and Linux.\n\n## Specifying a Default Editor\n\nSome commands rely on the\
    \ `$EDITOR` environment variable to tell them which program to use for editing.\
    \ Since `cron`’s primary purpose is to schedule jobs, it delegates the task of\
    \ editing files to another program. The `crontab -e` command invokes the editor\
    \ specified by the `$EDITOR` environment variable. You can set `$EDITOR` in your\
    \ personal initialization files to ensure your favorite editor is used, be it\
    \ `nano`, `emacs`, `vi`, or something else.\n\n```\n$ echo $EDITOR\nvi\n```\n\n\
    ## Summary\n\nIn this chapter, you learned how to view and edit files. First you\
    \ learned how to display the contents of a file using the `cat`, `more`, `less`,\
    \ `head`, and `tail` commands. Next you learned how to use the `nano` text editor.\
    \ From there you were introduced to the `vim` editor. Next, the `emacs` text editor\
    \ was covered. Finally, graphical text editors were explained.\n\n## Quiz\n\n\
    Which of the following commands display the first line of the file named “file.txt”?\n\
    \n- `top file.txt`\n- `top +1 file.txt`\n- `head file.txt`\n- `head -1 file.txt`\n\
    \nWhat command would you use to view the changes as they occur to the `/var/log/messages`\
    \ file?\n\n- `watch /var/log/messages`\n- `tail /var/log/messages`\n- `tail -f\
    \ /var/log/messages`\n- `tail -1 /var/log/messages`\n\nUse the `nano` editor if\
    \ you need powerful and complex editing capabilities.\n- True\n- False\n\nWhich\
    \ is not a valid `vi` mode?\n\n- command\n- insert\n- line\n- fundamental\n\n\
    `Emacs` can be used as a graphical editor as well as from the command line.\n\
    - True\n- False\n\n## Quiz Answers\n\nD\nC\nB\nD\nA\n\n# Shell Scripting\n\nA\
    \ script is a command line program that contains a series of commands. The commands\
    \ contained in the script are executed by an interpreter. In the case of shell\
    \ scripts, the shell acts as the interpreter and executes the commands listed\
    \ in the script one after the other.\n\nAnything you can execute at the command\
    \ line, you can put into a shell script. Shell scripts are great at automating\
    \ tasks. If you find yourself running a series of commands to accomplish a given\
    \ task, and know you will need to perform that task again in the future, you can—and\
    \ probably should—create a shell script for that task.\n\nLet’s look at a simple\
    \ shell script. The name of this script is `script1.sh`.\n\n```bash\n#!/bin/bash\n\
    echo “Scripting is fun!”\n```\n\nBefore you try to execute the script, make sure\
    \ that it is executable.\n\n```\n$ chmod 755 script1.sh\n```\n\nHere is what happens\
    \ when you execute the script.\n\n```bash\n$ ./script1.sh\nScripting is fun!\n\
    $\n```\n\n## The Shebang\n\nYou’ll notice that the first line of the script starts\
    \ with `#!` followed by the path to the bash shell program, `/bin/bash`. The number\
    \ sign is very similar to the sharp sign used in music notation. Also, some people\
    \ refer to the exclamation mark as a “bang.” So, `#!` can be spoken as “sharp\
    \ bang.” The term Shebang is an inexact contraction of “sharp bang.”\n\nWhen a\
    \ script’s first line starts with a shebang, what follows is used as the interpreter\
    \ for the commands listed in the script. Here are three examples of shell scripts,\
    \ each using a different shell program as the interpreter.\n\n```csh\n#!/bin/csh\n\
    echo “This script uses csh as the interpreter.”\n```\n\n```bash\n#!/bin/ksh\n\
    echo “This script uses ksh as the interpreter.”\n```\n\n```zsh\n#!/bin/zsh\necho\
    \ “This script uses zsh as the interpreter.”\n```\n\nWhen you execute a script\
    \ that contains a shebang, what actually happens is that the interpreter is executed\
    \ and the path used to call the script is passed as an argument to the interpreter.\
    \ You can prove this by examining the process table.\n\nLet’s start this script,\
    \ `sleepy.sh`, in the background and look at the process table.\n\nThe contents\
    \ of `sleepy.sh`:\n\n```bash\n#!/bin/bash\nsleep 90\n```\n\nLet’s execute it in\
    \ the background and take a look at the processes.\n\n```bash\n$ ./sleepy.sh &\n\
    [1] 16796\n$ ps -fp 16796\nUID PID PPID C STIME TTY TIME CMD\njason 16796 16725\
    \ 0 22:50 pts/0 00:00:00 /bin/bash ./sleepy.sh\n$\n```\n\nYou can see that what\
    \ is actually running is `/bin/bash ./sleepy.sh`. Let’s use a full path to the\
    \ script.\n\n```bash\n$ /tmp/sleepy.sh &\n[1] 16804\n$ ps -fp 16804\nUID PID PPID\
    \ C STIME TTY TIME CMD\njason 16804 16725 0 22:51 pts/0 00:00:00 /bin/bash /tmp/sleepy.sh\n\
    $\n```\n\nSure enough, `/bin/bash /tmp/sleepy.sh` is being executed. Also, you\
    \ can see that `/bin/bash` is executing the `sleep` command.\n\n## Variables\n\
    \nYou can use variables in your shell scripts. Variables are simply storage locations\
    \ that have a name. You can think of variables as name-value pairs. To assign\
    \ a value to a variable, use the syntax `VARIABLE_NAME=\"Value\"`. Do not use\
    \ spaces before or after the equals sign. Also, variables are case sensitive,\
    \ and, by convention, variable names are in uppercase.\n\n```bash\nMY_SHELL=\"\
    bash\"\n```\n\nTo use a variable, preceed the variable name with a dollar sign.\n\
    \n```bash\nMY_SHELL=\"bash\"\necho “I like $MY_SHELL.”\n```\n\nYou can also enclose\
    \ the variable name in curly braces and preceed the opening brace with a dollar\
    \ sign. Syntax: `${VARIABLE_NAME}`.\n\n```bash\nMY_SHELL=\"bash\"\necho “I like\
    \ ${MY_SHELL}.”\n```\n\nThe curly brace syntax is optional unless you need to\
    \ immediately precede or follow the variable with additional data.\n\n```bash\n\
    MY_SHELL=\"bash\"\necho “I am ${MY_SHELL}ing on my keyboard.”\n```\n\nIf you do\
    \ not encapsulate the variable name in curly braces, the shell will treat the\
    \ additional text as part of the variable name. Since a variable with that name\
    \ does not exist, nothing is put in’s place.\n\n```bash\nMY_SHELL=\"bash\"\necho\
    \ “I am $MY_SHELLing on my keyboard.”\n```\n\nYou can also assign the output of\
    \ a command to a variable. To do this, enclose the command in parentheses and\
    \ precede it with a dollar sign.\n\n```bash\nSERVER_NAME=$(hostname)\necho “You\
    \ are running this script on ${SERVER_NAME}.”\n```\n\nThe output of the command\
    \ `hostname` is stored in the variable `SERVER_NAME`.\n\nYou can also enclose\
    \ the command in back ticks. This is an older syntax that is being replaced by\
    \ the `$()` syntax. \n\n```bash\nSERVER_NAME=`hostname`\necho “You are running\
    \ this script on ${SERVER_NAME}.”\n```\n"
