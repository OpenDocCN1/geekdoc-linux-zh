    As a system administrator, you can decide what partitioning scheme to use. For
    example, you could use four partitions, allocating one partition for the operating
    system data, another partition for the application data, yet another one for the
    user data, and finally a partition dedicated to swap space. Another example scheme
    would simply be to use two partitions and separate the user’s home directories
    from the rest of the system.


    Having separate partitions is one way to prevent one part of the system from adversely
    affecting another part of the system. Having a dedicated partition for user home
    directories, for example, prevents a user from filling up the entire disk and
    interfering with the normal operation of the operating system. Even though a user,
    or group of users, may fill up the storage allocated for home directories and
    prevent another user from using more space, the operating system and any applications
    that are running will still be able to function normally. If this system hosts
    a website, the operating system will continue to run as well as the web server
    and a service outage will have been avoided.


    ## The MBR Partitioning Scheme


    The `MBR`, or master boot record, is a boot sector at the beginning of a storage
    device. The partition table that resides in the `MBR` contains information on
    how the logical partitions are organized on the disk. Because the partition table
    in the `MBR` can only address storage space up to 2 TB, it is being replaced by
    the `GUID Partition Table (GPT)`.


    The `MBR` partitioning scheme allows for up to four primary partitions. If you
    want to create more than four partitions, you’ll need to use an extended partition.
    An extended partition is a special kind of primary partition that is used as a
    container for other partitions. This allows you to create an unlimited number
    of logical partitions.


    ## The GUID Partition Table (GPT)


    The `GUID` (global unique identifier) Partition Table, or `GPT` for short, is
    replacing the older `MBR` partitioning system. It is part of the Unified Extensible
    Firmware Interface (UEFI) standard. The `UEFI` is replacing the traditional `BIOS`;
    however, `GPT` has been used on some `BIOS` systems primarily due to the disk
    size limitations of `MBR` partition tables.


    There are no primary and extended partitions with `GPT`. Using the default configuration,
    `GPT` supports up to 128 partitions. Also, `GPT` supports storage devices up to
    9.4 ZB. The primary downside of `GPT` is that it is not supported on older operating
    systems. Also, you’ll need to use newer partitioning utilities that support `GPT`.


    ## Mount Points


    A mount point is simply a directory that is used to access the data on a partition.
    At minimum, there will be one partition mounted on the `/` mount point. Any additional
    partitions will be mounted on mount points below `/` in the directory tree. For
    example, if you allocated a partition for user home directories, that partition
    would be mounted at `/home`. The files and directories that are at or below the
    `/home` mount point will reside on that partition. For example, the files in my
    home directory, `/home/jason`, will be on the partition mounted at `/home`.


    If you were to disconnect, or unmount, that partition and mount it to another
    directory (mount point), all the data would be available at that new mount point.
    If `/home` were unmounted and the partition was then mounted at `/export/home`,
    the files in my home directory would become available at `/export/home/jason`.


    It’s important to point out that you can mount partitions over existing data.
    For example, if files are created in `/home` before `/home` is mounted, those
    files will not be accessible. Let’s say you only have the `/` partition mounted
    and you create a home directory for Sarah at `/home/sarah`. The directory `/home/sarah`
    resides on the partition that is mounted on `/`. If you were to then mount another
    partition on `/home`, you would no longer be able to access the `/home/sarah`
    directory. The data for `/home/sarah` still exists, but it is on the partition
    associated with `/`. Once you unmounted `/home` you would then see that `/home/sarah`
    still exists.


    You can mount partitions anywhere in the Linux directory tree. You can even have
    mount points that reside on other mounted partitions. Let’s say you have a partition
    mounted on `/home`. You could then mount yet another partition on `/home/jason`.
    It’s important that `/home` be mounted before `/home/jason`. You’ll learn how
    to associate partitions with mount points as well as control the order that partitions
    are mounted later in this chapter.


    ## Creating Partitions


    When performing interactive Linux installations you will most likely end up using
    a partitioning tool provided by the Linux distribution. However, if you want to
    manipulate disks after the initial installation you will most likely need to use
    a standard Linux tool. The `fdisk` utility has been traditionally used to create
    and modify partitions on a disk, but there are other viable alternatives including
    `gdisk` and `parted`. Earlier version of `fdisk` lacked support for `GPT`, but,
    as of this writing, `fdisk` supports `GPT`. To manage the partitions on a disk
    with `fdisk`, simply provide the path to the device you wish to manage as an argument
    to the command.


    ### `fdisk /dev/sdb`


    ```

    Welcome to fdisk (util-linux 2.23.2).


    Changes will remain in memory only, until you decide to write them.


    Be careful before using the write command.


    Device does not contain a recognized partition table


    Building a new DOS disklabel with disk identifier 0x1c0ae930.


    Command (m for help): q


    #

    ```


    If you are unsure what disks are available, run `fdisk -l` to display a list of
    devices. This server has two disks. The first disk, `/dev/sda`, has already been
    partitioned and the second disk, `/dev/sdb`, has not.


    ### `fdisk -l`


    ```

    Disk /dev/sda: 214.7 GB, 214748364800 bytes, 419430400 sectors


    Units = sectors of 1 * 512 = 512 bytes


    Sector size (logical/physical): 512 bytes / 512 bytes


    I/O size (minimum/optimal): 512 bytes / 512 bytes


    Disk label type: dos


    Disk identifier: 0x000ad6ec


    Device Boot Start End Blocks Id System


    /dev/sda1 2048 4098047 2048000 82 Linux swap / Solaris


    /dev/sda2 * 4098048 417794047 206848000 83 Linux


    Disk /dev/sdb: 549.8 GB, 549755813888 bytes, 1073741824 sectors


    Units = sectors of 1 * 512 = 512 bytes


    Sector size (logical/physical): 512 bytes / 512 bytes


    I/O size (minimum/optimal): 512 bytes / 512 bytes


    #

    ```


    Let’s choose to work with `/dev/sdb` and ask `fdisk` for some help by typing in
    `m`.


    ### `fdisk /dev/sdb`


    ```

    Welcome to fdisk (util-linux 2.23.2).


    Changes will remain in memory only, until you decide to write them.


    Be careful before using the write command.


    Device does not contain a recognized partition table


    Building a new DOS disklabel with disk identifier 0xde069e1a.


    Command (m for help): m


    Command action


    a toggle a bootable flag


    b edit bsd disklabel


    c toggle the dos compatibility flag


    d delete a partition


    g create a new empty GPT partition table


    G create an IRIX (SGI) partition table


    l list known partition types


    m print this menu


    n add a new partition


    o create a new empty DOS partition table


    p print the partition table


    q quit without saving changes


    s create a new empty Sun disklabel


    t change a partition’s system id


    u change display/entry units


    v verify the partition table


    w write table to disk and exit


    x extra functionality (experts only)


    Command (m for help):

    ```


    The following example demonstrates how to create a new MBR partition table. We
    will create three primary partitions. The first one will be a 1GB swap partition,
    the second will be a 20GB partition, and the final partition will use the remaining
    space on the disk.

    '
