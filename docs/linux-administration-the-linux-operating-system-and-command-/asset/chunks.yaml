    ;; Query time: 13 msec

    ;; SERVER: 10.0.2.3#53(10.0.2.3)

    ;; WHEN: Wed Jan 13 03:30:17 JST 2016

    ;; MSG SIZE rcvd: 62


    $ dig -x 1.2.1.6

    ; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1 <<>> -x 52.5.196.34

    ;; global options: +cmd

    ;; Got answer:

    ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 23203

