    /sbin/mkfs.ext3

    /sbin/mkfs.ext4

    /sbin/mkfs.minix

    /sbin/mkfs.xfs

    ```


    ## Mounting and Unmounting Partitions


    To mount a partition, use the `mount` command followed by the path to the device
    and then the directory where you want to mount that device. For example, to mount
    `/dev/sdb3` on `/opt`, run `mount /dev/sdb3 /opt`.


    ```

    # mount /dev/sdb3 /opt

    ```


    You can use the `mount` command without any arguments to see what is currently
    mounted. Be aware that `mount` will not only show physical filesystems but also
    virtual filesystems. These virtual filesystems are often RAM based filesystems
    that provide ways to interact with other parts of the system. If you want a shorter
    list of mount points that contain storage devices, use the `df` command. You can
    think of the `df` command as the “disk-free” command, as it reports file system
    usage.


    ```

    mount

    proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)


    sysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime)


    devtmpfs on /dev type devtmpfs (rw,nosuid,size=500196k,nr_inodes=125049,mode=755)


    securityfs on /sys/kernel/security type securityfs (rw,nosuid,nodev,noexec,relatime)


    tmpfs on /dev/shm type tmpfs (rw,nosuid,nodev)

    ```

