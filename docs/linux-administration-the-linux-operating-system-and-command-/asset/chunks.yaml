    ## Packet Sniffing


    Sometimes it’s not enough to know that network connectivity is in place. Sometimes
    you need to examine the contents of the network traffic to ensure payloads are
    actually being delivered. Perhaps one host is claiming to send data to another;
    to be sure that data is reaching its destination, you can look at the traffic
    it is receiving. To do this, you’ll want to use some sort of packet sniffing tool,
    such as tcpdump.


    Even though there are several other tools that perform this same task, tcpdump
    is one of the older and most commonly installed tools. It requires root privileges
    to run. If you run it without arguments, it prints out a description of the contents
    of network packets being received.


    It will display information such as a timestamp, the source system address and
    port, the destination system address and port, and packet specific information.
    The tcpdump utility will continue to examine packets until you stop it with Control-c.


    Like other networking commands we’ve covered, tcpdump uses the -n option to both
    suppress DNS queries and display numerical addresses and ports.


    To display information in ASCII—or human readable—format, use the -A option. This
    will allow you to see human readable text, if that type of data is being received
    on the host. For example, if you are using tcpdump to examine incoming traffic
    on a webserver, you can see the URL paths that are being requested if you use
    the -A option.


    If you want even more output and information, use the -v option. To increase the
    verbosity, use -vv; for the most verbosity, use -vvv.


    The following is some sample output from tcpdump. On the far left hand side of
    the output is the time stamp. Next is the source information followed by the destination.
    Finally, information about the network packet is displayed at the end of the line.


    $ sudo tcpdump


    tcpdump: verbose output suppressed, use -v or -vv for full protocol decode


    listening on eth0, link-type EN10MB (Ethernet), capture size 65535 bytes


    19:25:49.639495 IP linuxsvr.ssh > 10.0.2.2.64440: Flags [P.], seq 3312803324:3312803408,
    ack 2443835, win 40880, length 84


    19:25:49.639586 IP linuxsvr.ssh > 10.0.2.2.64440: Flags [P.], seq 84:120, ack
    1, win 40880, length 36


    19:25:49.639750 IP 10.0.2.2.64440 > linuxsvr.ssh: Flags [.], ack 84, win 65535,
    length 0


    19:25:49.639763 IP 10.0.2.2.64440 > linuxsvr.ssh: Flags [.], ack 120, win 65535,
    length 0


    The following output shows an example of verbose ASCII output. You’ll notice that
    a client requested the /about page from the web server on this host. Remember
    to use root privileges when executing tcpdump.


    $ sudo tcpdump -Anvvv


    tcpdump: listening on eth0, link-type EN10MB (Ethernet), capture size 65535 bytes


    19:44:27.067530 IP (tos 0x10, ttl 64, id 5120, offset 0, flags [DF], proto TCP
    (6), length 64)


    10.0.2.44.37534 > 10.0.2.15.80: Flags [P.], cksum 0xfe34 (incorrect -> 0xce40),
    seq 1:13, ack 1, win 683, options [nop,nop,TS val 1585227 ecr 1584441], length
    12


    E..@..@.@.(…………P..>.:…….0K..-9GET /about


    ## Telnet


    The telnet command is practically obsolete. It was originally used to log into
    remote systems. Today, SSH has taken its place, but telnet can be used in network
    troubleshooting. Since telnet has fallen out of favor for interactive logins,
    it may not be installed by default on some linux distributions.


    You can use telnet to initiate a TCP connection to a host on a specific port.
    Let’s go back to a previous hypothetical situation. Let’s say we cannot ping google.com
    from our host. We know that in and of itself doesn’t necessarily mean that google.com
    is down. To see if google.com is accepting web traffic, we can connect to the
    HTTP port, which is port 80\. To do this, we type telnet google.com 80.


    If the port is open, we’ll get a message like “connected to google.com.” If you
    want to, you can send data directly to the port by typing in some data. The HTTP
    protocol does accept human readable commands. For example, to request a web page,
    use “GET” followed by the path. To get the home page, type “GET /”. Once you are
    ready to close the connection, hold down the ctrl key and press the right bracket
    key (^]). This will bring you to a telnet prompt. To exit telnet, type quit and
    press enter.


    When you connect, you may get a message like “operation timed out” or “connection
    refused”. “Operation timed out” means a connection could not be established. This
    could because traffic is silently getting dropped before it reaches the port or
    that port is not open on that host. If you get a “connection refused” message,
    that means the port is being blocked by a firewall.


    $ telnet google.com 80


    Trying 216.58.2.7…


    Connected to google.com.


    Escape character is ‘^]’.


    GET /


    HTTP/1.0 200 OK


    ^]


    telnet> quit


    closed.


    ## Summary


    In this chapter, you learned how the ping command can be used to determine if
    network connectivity exists between two hosts. You also learned that even if ping
    fails it does not necessarily mean the host you are pinging is down.


    Next you learned how to trace the path network traffic takes on the way to a host.
    You also learned how to list network interfaces, show the route table, and display
    the applications that are listening on ports by using the netstat command.


    We also covered how to perform sniff network packets using tcpdump. Finally, you
    learned how to test for port connectivity with the telnet command.


    ## Quiz


    Which commands can be used for network troubleshooting?


    ping


    traceroute


    netstat


    tcpdump


    All of the above.


    If you can’t ping a host, you can always be assured that the host you are attempting
    to ping is down.


    True


