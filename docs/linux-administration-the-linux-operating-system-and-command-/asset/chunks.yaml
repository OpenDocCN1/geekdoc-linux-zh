    `configfs` on `/sys/kernel/config` type `configfs` (`rw,relatime`)


    `/dev/sda2` on `/` type `xfs` (`rw,relatime,attr2,inode64,noquota`)


    `systemd-1` on `/proc/sys/fs/binfmt_misc` type `autofs` (`rw,relatime,fd=32,pgrp=1,timeout=300,minproto=5,maxproto=5,direct`)


    `debugfs` on `/sys/kernel/debug` type `debugfs` (`rw,relatime`)


    `mqueue` on `/dev/mqueue` type `mqueue` (`rw,relatime`)


    `hugetlbfs` on `/dev/hugepages` type `hugetlbfs` (`rw,relatime`)


    `/dev/sdb3` on `/opt` type `ext4` (`rw,relatime,data=ordered`)


    # `df -h`


    | 文件系统 | 大小 | 已用 | 可用 | 使用率 | 挂载点 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `/dev/sda2` | 198G | 1.7G | 196G | 1% | `/` |

    | `devtmpfs` | 489M | 0 | 489M | 0% | `/dev` |

    | `tmpfs` | 497M | 0 | 497M | 0% | `/dev/shm` |

    | `tmpfs` | 497M | 6.5M | 491M | 2% | `/run` |

    | `tmpfs` | 497M | 0 | 497M | 0% | `/sys/fs/cgroup` |

    | `/dev/sdb3` | 484G | 73M | 459G | 1% | `/opt` |


    注意，从命令行手动挂载文件系统不会导致其在重启后依然有效。为了使挂载持久化，你需要在 `/etc/fstab` 文件中添加条目。这将在本书的后续章节中介绍。


    要卸载分区，请使用 `umount` 命令，后跟跟设备路径或挂载点。要卸载 `/opt`，你可以运行 `umount /opt` 或 `umount /dev/sdb3`。


    # `umount /opt`


    # `df`


    | 文件系统 | 1K-块 | 已用 | 可用 | 使用率 | 挂载点 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `/dev/sda2` | 206747000 | 1766844 | 204980156 | 1% | `/` |

    | `devtmpfs` | 500196 | 0 | 500196 | 0% | `/dev` |

    | `tmpfs` | 508740 | 0 | 508740 | 0% | `/dev/shm` |

    | `tmpfs` | 508740 | 6612 | 502128 | 2% | `/run` |

    | `tmpfs` | 508740 | 0 | 508740 | 0% | `/sys/fs/cgroup` |


    ## 创建交换空间


    交换空间不是通过创建文件系统并挂载它，而是创建一个交换区域并启用它。要准备交换分区供使用，使用 `mkswap` 命令后跟分区的路径。要启用交换分区，使用
    `swapon` 命令后跟设备路径。要查看正在使用的交换设备，请运行 `swapon -s`。


    # `mkswap /dev/sdb1`


    ```

    正在设置交换空间版本 1，大小 = 104872 KiB

    no label, UUID=619dc6d9-1b0b-4a9a-9df5-bfc43fb8d6e

    ```


    # `swapon /dev/sdb1`


    # `swapon -s`


    ```

    | 文件名 | 类型 | 大小 | 使用 | 优先级 |

    | :--- | :--- | :--- | :--- | :--- |

    | `/dev/sda1` | 分区 | 204799 | 0 | -1 |

    | `/dev/sdb1` | 分区 | 104857 | 0 | -2 |

    ```


    ## 文件系统表


    `/etc/fstab` 文件控制 Linux 系统上的设备挂载位置以及挂载这些设备时使用的选项。每个条目由六列组成。如果一行以 `#` 开头，它是注释会被忽略。这六列分别是设备、挂载点、文件系统类型、选项、dump
    和文件系统检查顺序。这些列之间通过空格或制表符分隔。这里有一个 `/etc/fstab` 示例。


    | 设备 | 挂载点 | 文件系统类型 | 选项 | dump | fsck |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `/dev/sda2` | `/` | `xfs` | defaults | 0 | 1 |

    | `/dev/sda1` | `swap` | `swap` | defaults | 0 | 0 |


    ### 设备


    此列包含设备的路径。


    ### 挂载点


    此列决定设备挂载的位置。


    ### 文件系统类型


    第三列包含文件系统类型。


    ### 选项


    第四列包含挂载选项。


    ### dump


    第五列是 dump 值。


    ### fsck


    第六列是文件系统检查顺序。


