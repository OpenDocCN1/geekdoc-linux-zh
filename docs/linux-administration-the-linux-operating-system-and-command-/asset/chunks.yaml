    如果你在通过网络连接到主机时遇到问题，你可以做的第一件事就是 `ping` 该主机。`ping` 命令会向你指定的主机发送一个或多个 ICMP 数据包并等待回复。


    要使用 `ping` 命令，只需运行 `ping` 并提供主机名或 IP 地址即可。默认情况下，`ping` 会持续发送数据包，直到你用 `Control-C`
    停止程序。如果你想指定要发送的数据包数量，请使用 `-c` 选项。例如，要向 `google.com` 发送三个包，请运行 `ping -c 3 google.com`。


    以下是 `ping` 命令的输出。


    ```

    $ ping -c 3 google.com


    PING google.com (2.5.2.7) 56 bytes of data.

    64 bytes from 2.5.2.7: icmp_seq=1 ttl=53 time=20.1 ms

    64 bytes from 2.5.2.7: icmp_seq=2 ttl=53 time=20.2 ms

    64 bytes from 2.5.2.7: icmp_seq=3 ttl=53 time=23.9 ms

    – google.com ping statistics –

    3 packets transmitted, 3 received, 0% packet loss, time 2004ms

    rtt min/avg/max/mdev = 21.489/22.924/24.154/1.111 ms

    ```


    你应该注意到主机名被翻译成了 IP 地址。在这种情况下，`google.com` 被解析为 `2.5.2.7`。如果名称无法解析，你将收到“unknown
    host”（未知主机）错误。在这种情况下，你应该使用你尝试连接的那个系统的 IP 地址。此外，如果你可以通过 IP 地址 `ping` 但不能通过名称 `ping`，说明
    DNS 域名解析存在问题。


    该 `ping` 命令发送了三个数据包。统计部分报告收到了 3 个回复，因此没有遇到数据包丢失。这意味着我们与 `google.com` 具有网络连通性。你还会注意到每个数据包都关联有一个时间。在这个例子中，第一个回复在
    20 毫秒内收到，第二个包也是如此。第三个回复花费了 23.9 毫秒。你将在输出的最后一行看到此活动的的总结。RTT 代表“往返时间”（Round Trip
    Time）。


    这是一个没有收到任何回复的示例。你会看到报告了 100% 的数据包丢失。这意味着该主机与 `google.com` 之间没有网络连通性。


    ```

    $ ping -c 3 google.com


    PING google.com (2.5.2.7) 56 bytes of data.

    From 2.5.2.7 icmp_seq=1 Destination Host Unreachable

    From 2.5.2.7 icmp_seq=2 Destination Host Unreachable

    From 2.5.2.7 icmp_seq=3 Destination Host Unreachable

    – google.com ping statistics –

    3 packets transmitted, 0 received, +3 errors, 100% packet loss, time 2002ms

    ```


    此时，我们唯一知道的是我们无法 `ping` `google.com`。这并不意味着 `google.com` 已经宕机。此时，我应该尝试 `ping` 我本地网络上的某个设备。如果我无法
    `ping` 本地网络上的任何设备，说明我的主机出了问题。也许我的网线被意外断开了。也许是我对服务器执行了升级，但网络驱动程序没有正确更新。又可能是我在执行某些维护后忘记在服务器上启动网络服务。重点是，我至少知道该从哪里开始寻找。


    如果我能成功 `ping` 本地网络上的另一个主机，那么问题就出现在我的系统之外。也许公司网络边缘的路由器故障了，我无法访问公共互联网上的任何主机。我们可以通过
    `ping` `facebook.com` 或 `youtube.com` 等其他主机来测试这种场景。如果我们能 `ping` `Facebook` 和 `Youtube`，那么专门在访问
    `Google` 时出了问题。也许 `Google` 安装了防火墙，直接丢弃了 ICMP 数据包，因此 `ping` 永远无效。如果确实如此，我们需要使用其他工具来测试网络连通性，我们很快就会涵盖这些内容。


    这个示例演示了如何 `ping` 一个 IP 地址。这个 IP 地址与我运行命令的主机处于同一个本地网络，响应速度非常快。事实上小于 1 毫秒。


    ```

    $ ping -c 3 10.0.2.2


    PING 10.0.2.2 (10.0.2.2) 56(84) bytes of data.

    64 bytes from 10.0.2.2: icmp_seq=1 ttl=63 time=0.272 ms

    64 bytes from 10.0.2.2: icmp_seq=2 ttl=63 time=0.103 ms

    64 bytes from 10.0.2.2: icmp_seq=3 ttl=63 time=0.202 ms

    – 10.0.2.2 ping statistics –

    3 packets transmitted, 3 received, 0% packet loss, time 2001ms

    rtt min/avg/max/mdev = 0.103/0.192/0.202/0.111 ms

    ```


    ### Trace Route


    `traceroute` 命令向你指定的主机发送 ICMP 数据包并等待回复。要使用 `traceroute` 命令，只需运行 `traceroute` 并提供主机名或
    IP 地址即可。默认情况下，`traceroute` 会持续发送数据包，直到你用 `Control-C` 停止程序。如果你想指定要发送的数据包数量，请使用
    `-c` 选项。例如，要向 `google.com` 发送三个包，请运行 `traceroute -c 3 google.com`。

