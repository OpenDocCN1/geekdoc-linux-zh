    In this chapter, you learned what partition tables are and some of the reasons
    to use partitions. You also learned about the `GPT` and `MBR` partition tables.
    This chapter covered mount points and how they are simply directories that are
    used to access the data on a partition. You also learned how to create partitions
    using the `fdisk` utility.


    Creating file systems with the `mkfs` command was covered as well as how to mount
    those file systems with the `mount` command. Once a file system is mounted you
    learned how to view the disk usage with the `df` command. Next, we talked about
    using the `umount` command to unmount file systems. You also learned how to prepare
    swap space using the `mkswp` command and how to enable it with `swapon`.


    ## Quiz


    Partitioning a disk allows you to allocate different sections of the disk for
    different purposes.


    True

    False


    How many primary partitions does the `MBR` partitioning scheme allow?


    2

    3

    4

    Unlimited


    A mount point is simply a directory that is used to access data on a partition.


    True

    False


    These two commands perform the same task:


    ```

    mkfs -t ext4 /dev/sdb3

    mkfs.ext4 /dev/sdb3

    ```


    True

    False


    Which command is used to unmount a filesystem.


    unmount

    umount

    dismount


    The `/etc/filetab` file controls where devices are mounted on a Linux system and
    what options to use when mounting those devices.


    True

    False


    Which command or commands can be used to view a UUID?


    Only the `uuid` command.

    Only the `lsblk` command.

    Only the `blkid` command.

    Both the `lsblk` and `blkid` commands.


    What command prepares a swap partition for use. Afterwards, you can enable the
    swap partition with the `swapon` command.


    mkswap

    mkswp

    makeswap


    ## Quiz Answers


    A

    C

    A

    A

    B

    B

    D

