    The plus sign (+) in thejobsoutput represents the current job while the minus
    sign (-) represents the previous job. The current job is considered to be the
    last job that was stopped while it was in the foreground or the last job started
    in the background. The current job can be referred to by%%or%+. If no job information
    is supplied to thefgorbgcommands, the current job is operated upon. The previous
    job can be referred to by%-.


    You will notice that jobs 1 and 2 are reported as being done. The shell does not
    interrupt your current command line, but will report job statuses right before
    a new prompt is displayed. For example, if you start a program in the background,
    a prompt is returned. The shell will not report the status of the job until a
    new prompt is displayed. You can request a new prompt be displayed simply by hittingEnter.


    To bring a job back to the foreground, type in the name of the job or use thefg
    command. To foreground the current job,execute%%,%+,fg,fg %%,fg %+, or fg%num.
    To foreground job 3, execute%3 orfg %3.


    $ jobs


