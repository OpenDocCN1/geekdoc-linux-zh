    # Managing Users and Groups


    Linux is a multi-user operating system. Not only can multiple accounts exist on
    the system, but each of those accounts can be used at the same time. Each account
    consists of a username and a unique number called the `UID`, short for user ID.
    Also, each account has a default group to which it belongs, some comments associated
    with the account, a shell to execute when the user logs into the system, and a
    home directory. All this information is stored in the `/etc/passwd` file.


    The first entry in the `/etc/passwd` file is the root account.


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    The format of the `/etc/passwd` file is as follows.


    `username:password:UID:GID:comments:home_dir:shell`


    Each field is separated by a colon. Let’s take a look at each of them individually.


    - **Username**: `root`

    - **Password**: `x` (This means the encrypted password is stored in `/etc/shadow`
    which you will learn about shortly.)

    - **UID**: `0`

    - **GID**: `0`

    - **Comment**: `root`

    - **Home directory**: `/root`

    - **Shell**: `/bin/bash`


    Let’s look at another entry in the `/etc/passwd` file. This is for the `joe` account.


    ```

    joe:x:1000:1000:Joe Henderson:/home/joe:/bin/bash

    ```


    - **Username**: `joe`

    - **Password**: `x`

    - **UID**: `1000`

    - **GID**: `1000`

    - **Comment**: `Joe Henderson`

    - **Home directory**: `/home/joe`

    - **Shell**: `/bin/bash`


    Even though Linux supports usernames up to 32 characters in length, it is customary
    to keep usernames to 8 or fewer characters. When using usernames longer than 8
    characters, you will see run into situations where the `UID` is displayed in place
    of the username or a truncated version of the username is displayed. For example,
    when looking at output from the `ps` command.


    Here is an example of a long username being truncated.


    ```

    ps -fu jasoncannon

    UID PID PPID C STIME TTY TIME CMD

    jasonca+ 2973 1 0 01:43 ? 00:00:00 bash

    ```


    This is what it might look like on an older version of Linux. The long username
    is simply replaced by it’s `UID`.


    ```

    ps -fu jasoncannon

    UID PID PPID C STIME TTY TIME CMD

    1000 2973 1 0 01:43 ? 00:00:00 bash

    ```


    Usernames are case sensitive. Even though uppercase letters are allowed in usersnames,
    by convention usernames are in all lower case letters. Digits are also allowed
    in usernames, but avoid special characters.


    Historically, encrypted password information was stored in the `/etc/passwd` file
    following the username. However the `/etc/passwd` file is readable by anyone on
    the system so storing password information, even encrypted, is a security risk.
    Now, by default, the encrypted password information is stored in `/etc/shadow`
    which is readable only by the superuser account.


    The `UID` is a unique number. The root account is always `UID 0`. Accounts meant
    to be used by the system typically have `UIDs` lower than 1000. This is configurable
    by updating the `/etc/login.defs` file.


    The group ID, or `GID`, listed in the password file entry for an account is the
    account’s default group. When a user creates a file that will will belong to the
    user’s default group. If a user wants to create files using another group, they
    can use the `newgrp` command to change to a new group before creating the files.


    The comment field typically contains the user’s real name or a description of
    what the account is used for. It can also remain empty. You’ll sometimes hear
    this field refered to as the `GECOS` field. This is a historical hold over from
    the early years of Unix.


    When a user logs into the system they are placed in their home directory, listed
    in the `passwd` file. If this directory does not exist, they will be placed into
    the root directory.


    The shell will be executed when the user logs into the system with their account.
    You can see a list of installed shells on your Linux system by looking at `/etc/shells`.
    Whatever is listed in the shell field will be executed upon login even if the
    program is not actually a shell. For example, you may see `/usr/sbin/nologin`
    or `/bin/false` in the shell field for certain accounts. This ensures that no
    one can use those accounts interactively. You can also use the shell field to
    execute a program when a user logs into the system. For example, you could force
    users into a menu driven application that only allows them access to certain actions.


    ## The Shadow File


    Like the `/etc/passwd` file, the `/etc/shadow` file contains a series of fields
    separated by a colon.


    ```

    root:$6$9g1IC8AYzqPorEZSHjWeZP8o21:16502:0:99999:7:::

    ```


    The first field is the username. The second field contains the encrypted password.
    The third field is the number of days since January 1, 1970 since the password
    has been changed. The fourth field is the number of days before the password can
    be changed. The fifth field is the number of days after which the password must
    be changed. If this field contains `99999` the user never has to change their
    password. The sixth field is the number of days at which to warn the user that
    their password will expire. The seventh field is the number of days after the
    password expires that the account is disabled. The eighth field is the number
    of days since Janary 1, 1970 that an account has been disabled. The ninth field
    is reserved for future use.


    ## Creating Accounts


    Now that you know where account information is stored, let’s create an account
    using the `useradd` command. Adding accounts requires superuser privileges, so
    make sure you are using the root account or `sudo`. Here is the format of the
    `useradd` command.


    ```

    useradd [options] username

    ```


    The most commonly used options for the `useradd` command are:


    - `-c “COMMENT”`: Comments for the account, such as the user’s full name.

    - `-m`: Use the `-m` option to create the user’s home directory.

    - `-s /shell/path`: The path to the user’s shell.


    In this example, an account is created for Grant Stewart. His username is `grant`
    and his shell is `bash`.


    ```

    useradd -c “Grant Stewart” -m -s /bin/bash grant

    ```


    Next, let’s assign the account a password. To do this, use the `passwd` command
    followed by the username. You’ll be prompted to enter a password for the user
    and then confirm that password.


    ```

    passwd grant

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully own```


    Here is the entry for the account in the `/etc/passwd` file and `/etc/shadow`
    file.


    ```

    tail -1 /etc/passwd

    grant:x:1000:1000:Grant Stewart:/home/grant:/bin/bash


    tail -1 /etc/shadow

    ```

    '
