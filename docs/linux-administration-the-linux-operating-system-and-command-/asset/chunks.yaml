    (Wait, checking list below)\n\n## Other Books by the Author\n\n### Command Line\
    \ Kung Fu: Bash Scripting Tricks, Linux Shell Programming Tips, and Bash One-liners\n\
    http://www.linuxtrainingacademy.com/command-line-kung-fu-book\n\n### High Availability\
    \ for the LAMP Stack: Eliminate Single Points of Failure and Increase Uptime for\
    \ Your Linux, Apache, MySQL, and PHP Based Web Applications\nhttp://www.linuxtrainingacademy.com/ha-lamp-book\n\
    \n### Linux for Beginners: An Introduction to the Linux Operating System and Command\
    \ Line\nhttp://www.linuxtrainingacademy.com/linux\n\n### Python Programming for\
    \ Beginners: An Introduction to the Python Computer Language and Computer Programming\n\
    http://www.linuxtrainingacademy.com/python-programming-for-beginners\n\n# Introduction\n\
    \nAfter releasing my first book, *Linux for Beginners*, readers kept telling me,\
    \ “I love Linux! It opened up a whole new world for me and I want to learn even\
    \ more.” Some even wanted to turn their newfound passion into a career as a Linux\
    \ professional. “What’s next?” they would ask.\n\nI would point them to one of\
    \ my courses or suggest they take a Linux system administration class. “That’s\
    \ great, but what book should I read next? What book would be a great companion\
    \ to a Linux administration course?” I didn’t have a good answer for them.\n\n\
    Most of the books on Linux system administration, as great as they are, are simply\
    \ outdated. They all seem to come from a time when Linux more closely resembled\
    \ Unix. Even recently released books didn’t cover the fundamental shift in how\
    \ system services are started and managed on modern Linux systems. With every\
    \ year that passes, every new version of the Linux kernel that is released, and\
    \ every new Linux distribution update, Linux looks less and less like a traditional\
    \ Unix system. Now, more than ever before, Linux has to be treated as its own\
    \ entity.\n\nNow when someone asks me, “What book should I read next?”, I have\
    \ an answer for them. It’s this book. This book is the next step after you understand\
    \ how to use a Linux system. It teaches you how to manage a Linux system like\
    \ a Linux system. \n\nIf you’re ready to take that next step, let’s get started.\n\
    \nJason\n\n# Booting\n\nAs a system administrator you need to understand the Linux\
    \ boot process. In this chapter, you will learn about the BIOS, the boot loader,\
    \ the Linux kernel and runlevels.\n\n## The BIOS\n\nBIOS stands for Basic Input/Output\
    \ System. It’s a special type of firmware used in the booting process and it’s\
    \ the first piece of software that is run when a computer is powered on. The BIOS\
    \ is operating system independent. Its primary purpose is to test the underlying\
    \ hardware components and to load a boot loader or operating system.\n\nThe BIOS\
    \ performs a `POST`, which stands for Power-On Self Test. The `POST` performs\
    \ some basic checks of various hardware components such as the CPU, memory, and\
    \ storage devices. Only if the `POST` succeeds will the BIOS attempt to load the\
    \ boot loader.\n\nThe BIOS contains a list of boot devices such as hard disks,\
    \ a DVD drive, USB devices, and others depending on the hardware being used. The\
    \ BIOS searches that list for a bootable device in the order specified. You can\
    \ change this order by interrupting the boot sequence and entering into the configuration\
    \ for the BIOS. The key combination used to do this will vary from one hardware\
    \ manufacturer to another.\n\nOnce a bootable device has been found, the BIOS\
    \ will run the boot loader. Typically the `GRUB` boot loader will be used, but\
    \ you may run into older Linux systems that use the `LILO` boot loader. `LILO`\
    \ stands for `LInux LOader`, while `GRUB` stands for `GRand Unified Bootloader`.\
    \ In any case, the primary purpose of the boot loader is to start the operating\
    \ system. You will typically see a message or series of messages from the boot\
    \ loader which will allow you to interrupt the boot process and interact with\
    \ the boot loader. If there are multiple operating systems installed, you can\
    \ tell the boot loader which operating system to run. You can also instruct the\
    \ boot loader to pass different boot options to the operating system.\n\n## The\
    \ Initial RAM Disk\n\nThe initial RAM disk, abbreviated as `initrd`, is a temporary\
    \ file system that’s loaded into memory when the system boots. This file system\
    \ can contain helpers that perform hardware detection and load the necessary modules,\
    \ sometimes called drivers, to get the actual file system mounted. For example,\
    \ if the root file filesystem is stored on an `LVM` (Logical Volume Manager) volume,\
    \ the `initrd` image will contain the kernel modules required to mount that logical\
    \ volume as the root file system. Once the `initrd` mounts the actual root file\
    \ system its job is done and the operating system continues loading from the real\
    \ root file system.\n\n## Kernel and Initial RAM Disk Location\n\nThe Linux kernel,\
    \ the initial RAM disk, and other files needed to boot the operating system are\
    \ stored in `/boot`. Here is a listing of the `/boot` directory for an Ubuntu\
    \ system.\n\n```bash\n$ ls -1F /boot\n\nabi-3.13.0-46-generic\nconfig-3.13.0-46-generic\n\
    grub/\ninitrd.img-3.13.0-46-generic\nSystem.map-3.13.0-46-generic\nvmlinuz-3.13.0-46-generic\n\
    ```\n\nThe Linux kernel is typically named `vmlinux` or `vmlinuz`. If the kernel\
    \ is compressed its name is in the `vmlinuz` format. In this example, the kernel\
    \ is `vmlinuz-3.13.0-46-generic`. The initial RAM disk in this example is `initrd.img-3.13.0-46-generic`.\n\
    \n## The Kernel Ring Buffer\n\nThe kernel ring buffer contains messages related\
    \ to the Linux kernel. A ring buffer is a data structure that is always the same\
    \ size. Once the buffer is completely full, old messages are discarded when new\
    \ messages arrive. To see the contents of the kernel ring buffer, use the `dmesg`\
    \ command.\n\n```bash\n$ dmesg\n\n[ 0.000000] Initializing cgroup subsys cpuset\n\
    [ 0.000000] Initializing cgroup subsys cpu\n[ 0.000000] Initializing cgroup subsys\
    \ cpuacct\n[ 0.000000] Linux version 3.13.0-46-generic (buildd@orlo) (gcc version\
    \ 4.8.2 (Ubuntu 4.8.2-19ubuntu1) ) #79-Ubuntu SMP Mar 10 20:06:50 UTC 2015 (3.13.11-ckt15)\n\
    [ 0.000000] Command line: BOOT_IMAGE=/boot/vmlinuz-3.13.0-46-generic root=UUID=736134da-c6b8-4a97-911c-650146a68b3\
    \ ro console=tty1 console=ttyS0\n[ 0.000000] KERNEL supported cpus:\n[ 0.000000]\
    \ Intel GenuineIntel\n[ 0.000000] AMD AuthenticAMD\n[ 0.000000] Centaur CentaurHauls\n\
    [ 0.000000] e820: BIOS-provided physical RAM map:\n…\n```\n\nOn most Linux distributions\
    \ these messages are also stored on disk in the `/var/log/dmesg` file. Between\
    \ the `dmesg` command and the `/var/log/dmesg` log file, you will be able to see\
    \ the messages the kernel is generating, even during the earliest stages of the\
    \ boot process when those messages can quickly fly by your screen.\n\n## Runlevels\
    \ and Targets\n\nLinux uses runlevels to determine what processes and services\
    \ to start. Each distribution can be configured differently, but, in general,\
    \ runlevel 0 is used to power off a system, runlevel 1 is single-user mode, runlevels\
    \ 2-5 are for normal system operations, and runlevel 6 is used to reboot a system.\n\
    \n| Runlevel | Description |\n| :--- | :--- |\n| 0 | Shuts down the system |\n\
    | 1, S, s | Single user mode. Used for maintenance. |\n| 2 | Multi-user mode with\
    \ graphical interface (Debian/Ubuntu) |\n| 3 | Multi-user text mode (RedHat/CentOS)\
    \ |\n| 4 | Undefined |\n| 5 | Multi-user mode with graphical interface (RedHat/CentOS)\
    \ |\n| 6 | Reboot |\n"
