    # 网络


    在本章中，你将学习 TCP/IP 协议以及 IP 网络中最重要的方面。你还将将介绍网络分类和有类网络。此外，你将学习到子网掩码和广播地址。接下来，你将学习无类域间路由（CIDR），最后，你将学习
    IP 地址在私有网络中的用途。


    今天，TCP/IP 是网络数据传输的实事实标准。TCP/IP 代表传输控制协议 (TCP) 和网际协议 (IP)。TCP 建立建立维护网络会话，以便两个设备可以交换数据。网际协议负责将数据从网络中的一个设备发送到另一个设备。这些网络设备中的每一个被称为主机，并至少有一个
    IP 地址。


    为了让网络上的设备能够正常通信，它需要三项信息：IP 地址、子网掩码和广播地址。这些数字中的每一个都由由点分隔的四个字节（octets）组成。一个字节代表八位，因此其值范围可以从
    0 到 255。


    示例 IP 地址：`199.83.131.168`


    示例子网掩码：`255.255.255.0`


    示例广播地址：`199.83.131.255`


    在 `199.83.131.186` 示例 IP 地址中，第一个字节包含键值 199，第二个字节是 83，第三字节是 131，最后一个字节是 186。


    IP 地址由两部分组成。IP 地址的第一部分是网络地址，第二部分是主机地址。IP 地址的网络部分告诉路由器主机属于哪个网络，从而决定了路由发往该主机的数据。主机地址告诉路由器应该将数据发送到的特定设备。为了让路由正常工作，每组设备（或网络）都需要一个唯一的网络地址。此外，该网络内的每个设备都需要唯一的主机地址。


    地址的类别决定了哪部分被用作网络地址，哪部分被用于主机地址。


    | 类 | 网络 | 允许的主机数 |

    | :--- | :--- | :--- |

    | A | 1 -> 127 (例：`17.24.88.9`) | 16,777,216 |

    | B | 128.0 -> 191.255 (例：`183.194.46.31`) | 65,536 |

    | C | 192.0.0 -> 233.255.255 (例：`199.83.131.186`) | 255 |


    通过查看 IP 地址的第一个字节，可以判断它是哪一类。第一个字节在 1 到 127 之间的 IP 地址是 A 类。例如：`17.24.88.9`。第一个字节在
    128.0 到 191.255 之间的 IP 地址是 B 类。例如：`183.194.46.31`。第一个字节在 192.0.0 到 233.255.255
    之间的 IP 地址是 C 类。例如：`199.83.131.186`。


    ## 无类域间路由


    CIDR 代表无类域间路由。它允许不受其传统类别地划分网络。这些划分后的网络被称为子网。例如，IP 地址 `121.67.198.94` 属于 A 类网络。默认情况下，网络是
    `121.0.0.0`，子网掩码是 `255.0.0.0`，广播地址是 `121.255.255.255`。然而，如果你指定了子网掩码，就可以更改 IP 地址中作为网络地址和作为主机地址的部分。通过为
    `121.67.198.94` 地址指定 `255.255.255.0` 子网，网络变为 `121.67.198.0`，广播地址变为 `121.67.198.255`。


    ## 预留私有地址空间


    有一些 IP 地址范围是专用于私有网络的。你经常会在公司内部网络中使用这些类型的 IP 地址，你很可能在家庭网络中这些这些 IP 地址范围。


    '
- fmt: '

    These private addresses are also called non-routable IPs since they are not routed
    through the public Internet. You’ll also hear these IP addresses referred to as
    `RFC1918` address, which refers to the `RFC1918` standards document where these
    private ranges were initially defined.


    As you can see in the following table, there is a dedicated range of non-routable
    private address space for each network class. Keep in mind that you can subnet
    these networks however you like, regardless of their associated traditional class.


    | Class | Range | Private Address Space |

    | :--- | :--- | :--- |

    | A | 1.0.0.0 - 127.255.255.255 | 10.0.0.0 - 10.255.255.255 |

    | B | 128.0.0.0 - 191.255.255.255 | 172.16.0.0 - 172.31.255.255 |

    | C | 192.0.0.0 - 233.255.255.255 | 192.168.0.0 - 192.168.255.255 |


    ## Summary


    In this chapter, you learned how the TCP/IP protocol is the defacto standard of
    transmitting data over a network. You also learned about Class A, B, and C networks.
    You learned about the default subnet masks and broadcast addresses used by the
    various network classes. You also learned that you can specify a subnet mask to
    divide larger networks into smaller ones called subnets. Finally, you learned
    what IP ranges are dedicated for use in private networks and how these IP address
    are not routed over the public Internet.


    ## Quiz


    257.19.21.228 is a valid IP address.


    - True

    - False


    Given an IP address of `199.83.131.0` and a subnet mask of `255.255.255.0`, what
    is the broadcast address?


    - `199.83.131.0`

    - `199.83.131.1`

    - `199.83.131.255`

    - `199.255.255.255`


    Which of the following IP addresses does not fall within a private address range?


    - `10.11.12.13`

    - `11.12.13.14`

    - `172.16.255.255`

    - `192.168.1.100`


    ## Quiz Answers


    - B

    - C

    - B


    # Linux Networking


    In this chapter, you’ll learn how to configure and control the network interfaces
    on a Linux system as well as its hostname. You’ll learn what DNS is and how to
    use the `host` and `dig` tools to resolve hostnames and IP addresses. You’ll learn
    the roles that the `/etc/hosts` and `/etc/nsswitch.conf` files play in name resolution.
    You’ll also be introduced to network ports. Next, you’ll learn what DHCP is and
    how to configure your Linux system as a DHCP client. Finally, we’ll look at menu
    driven tools that can assist you in managing the various network settings on the
    most popular Linux distributions.


    To show your current IP address, or to get a list of all the IP addresses in use
    on your system, run the `ip` command with an argument of `address`. With the `ip`
    command, you can use abbreviations, so instead of running `ip address` you can
    run `ip addr` or even `ip a`. You can also be more explicit by running `ip address
    show`.


    The following is some sample output from the `ip address` command. You can see
    two devices listed: `lo` and `eth0`. The `lo` device is the loopback device. This
    is a special virtual network interface that a Linux system uses to communicate
    with itself. The loopback device has an IP address of `127.0.0.1`. The other network
    device on this system is the `eth0` device. This is an actual hardware device
    and it has an ip address of `192.168.1.122`.


    # ip address


    ```

    1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN

    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00

    inet 127.0.0.1/8 scope host lo

    valid_lft forever preferred_lft forever

    inet6 ::1/128 scope host

    valid_lft forever preferred_lft forever

    2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    qlen 1000

    link/ether 08:00:27:43:f5:18 brd ff:ff:ff:ff:ff:ff

    inet 192.168.1.122/24 brd 192.168.1.255 scope global dynamic eth0

    valid_lft 84249sec preferred_lft 84249sec

    inet6 fe80::a00:27ff:fe43:f518/64 scope link

    valid_lft forever preferred_lft forever

    ```


    In addition to the `ip` command, the `ifconfig` tool can be used to display IP
    address information. At this point the `ifconfig` utility is considered to be
    deprecated. However, this little utility hasn’t quite yet disappeared on modern
    Linux systems and may be around for quite some time to come. If this is a refresher
    for you or if you are coming from a Unix background, you may already be familiar
    with the `ifconfig` command, but not its newer replacement, the `ip` command.
    In this chapter, you will learn how to use both the `ip` and `ifconfig` commands.


    To display the ip address in use with the `ifconfig` command, execute it without
    any arguments. Here is some output from the `ifconfig` command. It lists two interfaces:
    `eth0` and the loopback device. You’ll notice that the output is slightly different
    from the `ip` command. However, it gets the job done by displaying the IP address,
    netmask, and more. Just like with the `ip` command, you can see that the `eth0`
    device has an IP of `192.168.1.122` and the loopback device has an IP of `127.0.0.1`.


    # ifconfig


    ```

    eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500

    inet 192.168.1.122 netmask 255.255.255.0 broadcast 192.168.1.255

    inet6 fe80::a00:27ff:fe43:f518 prefixlen 64 scopeid 0x20<link>

    ether 08:00:27:43:f5:18 txqueuelen 1000 (Ethernet)

    RX packets 82371 bytes 95773879 (91.3 MiB)

    RX errors 0 dropped 0 overruns 0 frame 0

    TX packets 32907 bytes 3386585 (3.2 MiB)

    TX errors 0 dropped 0 overruns 0 carrier 0 collisions 0

    lo: flags=73<UP,LOOPBACK,RUNNING> mtu 65536

    inet 127.0.0.1 netmask 255.0.0.0

    inet6 addr: ::1/128 Scope:Host

    UP LOOPBACK RUNNING MTU:65536 Metric:1

    RX packets:250935 errors:0 dropped:0 overruns:0 frame:0

    TX packets:250935 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuelen:0

    RX bytes:70966872 (70.9 MB) TX bytes:70966872 (70.9 MB)

    ```


    ## Hostnames


    A host is a device connected to a network. Since we are talking about TCP/IP networking,
    a host in this case is a device with an IP address.


    A hostname is simply a human-readable name that corresponds to an IP address.
    Let’s say we have a Linux server that will act as a web server in production.
    We can give that server a hostname, `webprod01` for example, and refer to it by
    that hostname instead of its IP address, which might be something like `10.109.155.174`.
    A one word hostname like this is sometimes called the short hostname or the unqualified
    hostname.


    ## DNS Hostnames


    The primary purpose of DNS, which stands for Domain Name System, is to translate
    human readable names into IP addresses. Of course, DNS does the reverse as well.
    It can translate an IP address to a hostname.


    The fully qualified domain name, or FQDN, of a host also contains a domain name
    and a top-level domain. Each section of the FQDN is separated by a period.


    TLD stands for top-level domain and is the rightmost portion of a DNS name. Common
    top level domains include `.com`, `.net`, and `.org`, but there actually hundreds
    of other top level domains.


    A domain appears just to the left of a top-level domain. This is often a company
    name, an organization name, or a brand name.


    The FQDN, or long hostname, of our Linux server would contain at least three strings
    separated by periods. For example, its FQDN could be `webprod01.mycompany.com`.


    However, domains can be further divided into sub-domains. Let’s say “My Company”
    wants to use subdomains to identify where a server is located. It could use a
    country domain such as `us.mycompany.com` and maybe even a state subdomain, something
    like `ny.us.mycompany.com`. If our web server were in New York, its FQDN might
    actually be `webprod01.ny.us.mycompany.com`. Subdomains do not have to correspond
    to geographical regions; they can be anything the DNS administrator has configured.


    You can display the current hostname by using the `hostname` command or by running
    `uname -n`. In the following example, the hostname is `webprod01`. If you want
    to display the FQDN, run `hostname -f`.


    ```

    $ hostname

    webprod01


    $ uname -n

    webprod01


    $ hostname -f

    webprod01.mycompany.com

    ```

