  trans: "\n\nDHCP 代表动态主机配置协议（Dynamic Host Configuration Protocol）。DHCP 主要用于为网络上的主机分配\
    \ IP 地址。当 DHCP 客户端想要请求一个 IP 地址时，它会发送一个广播消息来寻找 DHCP 服务器。随后，DHCP 服务器会响应客户端并为其提供一个\
    \ IP 地址以及其他附加信息，例如子网掩码、网关和用于名称解析的 DNS 服务器。DHCP 客户端使用这些信息进行配置，并在网络上开始通信。\n\n分配给\
    \ DHCP 客户端的 IP 地址是从 DHCP 服务器租借的。客户端可以在 DHCP 服务器配置的租约到期之前使用该 IP 地址。如果 DHCP 客户端想在租约到期后继续使用该\
    \ IP 地址，它必须向 DHCP 服务器发送续约请求。如果 DHCP 服务器没有收到续约请求，它将把此 IP 地址放回可用地址池中。\n\n要将基于 RedHat\
    \ 的系统配置为 DHCP 客户端，请编辑位于 `/etc/sysconfig/network-scripts` 目录下的网络设备配置文件。该文件的名称为\
    \ `ifcfg-network-device-name`。根据系统配置和底层硬件，它可能是 `ifcfg-eth0` 甚至是像 `ifcfg-enp5s2`\
    \ 这样的名称。要获取系统上的网络设备列表，请运行 `ifconfig -a` 或 `ip link`。\n\n一旦确定了网络设备的配置文件，将 `BOOTPROTO`\
    \ 变量设置为“dhcp”。\n\n```bash\nip link\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536\
    \ qdisc noqueue state UNKNOWN mode DEFAULT\n\nlink/loopback 00:00:00:00:00:00\
    \ brd 00:00:00:00:00:00\n\n2: enp0s3: <BROADCAST,MULTAST,UP,LOWER_UP> mtu 1500\
    \ qdisc pfifo_fast state UP mode DEFAULT qlen 1000\n\nlink/ether 08:00:27:ba:8f:35\
    \ brd ff:ff:ff:ff:ff:ff\n```\n\n```bash\ncat /etc/sysconfig/network-scripts/ifcfg-enp0s3\n\
    \nDEVICE=“enp0s3”\nONBOOT=yes\nNETBOOT=yes\nIPV6INIT=yes\nBOOTPROTO=dhcp\nTYPE=Ethernet\n\
    NAME=“enp0s3”\n```\n\n要将 Ubuntu 系统配置为 DHCP 客户端，请编辑 `/etc/network/interfaces` 文件。为接口的\
    \ `inet` 地址族语句添加 `dhcp` 方法。该行内容将为 `iface <network-device-name> inet dhcp`。对于 `eth0`，这将是\
    \ `iface eth0 inet dhcp`。以下是示例 `/etc/network/interfaces` 文件的内容。\n\n```bash\n#/etc/network/interfaces\n\
    \n# 此文件描述了系统上 \n# 可用的网络接口以及如何激活它们。\n# 需更多信息，请参见 interfaces(5)。\n# 回环网络接口\nauto\
    \ lo\niface lo inet loopback\n\n# 主接口 interface\nauto eth0\niface eth0 inet dhcp\n\
    ```\n\n你也可以为 Linux 系统分配静态 IP 地址。对于基于 RedHat 的系统，请编辑位于 `/etc/sysconfig/network-scripts`\
    \ 中的网络接口配置文件。确保将 `BOOTPROTO` 变量设置为 `static`。按照示例所示分配 IP 地址、子网掩码、网络、广播和网关。如果你希望网络设备在启动时激活，请将\
    \ `ONBOOT` 设置为 `yes`。\n\n```bash\nDEVICE=“enp0s3”\nBOOTPROTO=static\nIPADDR=10.109.155.174\n\
    NETMASK=255.255.255.0\nNETWORK=10.109.155.0\nBROADCAST=10.109.155.255\nGATEWAY=10.109.155.1\n\
    ONBOOT=yes\n```\n\n要在 Ubuntu 系统上的接口分配静态 IP 地址，请编辑 `/etc/network/interfaces` 文件。在网络接口的\
    \ `iface` 行中，`inet` 之后使用 `static` 关键字。接下来，提供 IP 地址、子网掩码和网关地址。\n\n```bash\nauto\
    \ eth0\niface eth0 inet static\naddress 10.109.155.174\nnetmask 255.255.255.0\n\
    gateway 10.109.155.1\n```\n\n你可以使用 `ip` 命令手动为网络接口分配 IP 地址。格式为 `ip address add\
    \ IP[/NETMASK] dev NETWORK_DEVICE`。若要向 `eth0` 添加 IP 地址 `10.11.12.13`，请运行 `ip address\
    \ add 10.11.12.13 dev eth0`。你也可以在 IP 地址后面加上正斜杠并提供子网掩码来指定，例如：`ip address add 10.11.12.13/255.255.255.0\
    \ dev eth0`。要启用接口，请运行 `ip link set eth0 up`。\n\n如果可用 `ifconfig` 工具，你也可以用它为网络接口分配\
    \ IP 地址。格式为 `ifconfig NETWORK_DEVICE addr netmask SUBNET_MASK`。若要添加 IP 地址 `10.11.12.13`，请运行\
    \ `ifconfig eth0 add 10.11.12.13`。通过在 IP 地址后跟随正斜杠并提供子网掩码，你也可以提供子网掩码，例如：`ifconfig\
