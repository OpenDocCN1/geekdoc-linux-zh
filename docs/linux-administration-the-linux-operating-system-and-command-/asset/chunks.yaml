    ## 重温目录权限


    此示例演示了权限如何影响目录及其内容。一个常见的问题是：目录内的文件设置了正确的权限，但目录本身的权限却是错误的。例如，目录缺少正确的权限可能会阻止文件的执行。如果你确定文件的权限已设置正确，请查看父目录。通过在当前目录运行
    `ls -ld .` 向目录树根节点移动，使用 `cd ..` 移动到父目录，并重复这两个步骤，直到找到问题。


    ```bash

    $ ls -dl directory/

    drwxr-xr-x 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    total 0

    -rwxr—r— 1 bob users 0 Sep 29 22:02 testprog

    $ chmod 400 directory

    $ ls -dl directory/

    dr––— 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    ls: cannot access directory/testprog: Permission denied

    total 0

    -????????? ? ? ? ? ? test testprog

    $ directory/testprog

    su: directory/testprog: Permission denied

    $ chmod 500 directory/

    $ ls -dl directory/

    dr-x–– 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    total 0

    -rwxr—r— 1 bob users 0 Sep 29 22:02 testprog

    $ directory/testprog

    该程序运行成功。

    ```


    ## 默认权限与文件创建掩码


    文件创建掩码（file creation mask）决定了文件在创建时将分配的权限。掩码限制或屏蔽权限，从而决定了文件或目录将获得的最终权限。如果没有掩码，目录将以
    `777` (rwxrwxrwx) 权限创建，文件将以 `666` (rw-rw-rw-) 权限创建。掩码可以由系统管理员设置且通常也是这样做，但也可以通过在个人初始化文件中包含
    `umask` 语句来按账户进行覆盖。


    `umask [-S] [mode]` - 如果指定，则将文件创建掩码设置为 `mode`。如果省略了 `mode`，将显示当前模式。使用 `-S` 参数允许
    `umask` 以符号表示显示或设置 `mode`。


    传递给 `umask` 的模式工作方式与提供给 `chmod` 的模式完全相反。当你提供 `7` 时，它被解释为开启所有权限，`rwx`。当你提供 `0`
    时，它被解释为关闭所有权限，`-`。将 `chmod` 视为开启、添加或赋予权限；将 `umask` 视为关闭、撤销权限。


    估算 `umask` 模式对默认权限影响的一种快速方法是：目录目录从 `777` 减去八进制 `umask` 模式，文件则从 `666`。以下是 `umask
    022` 的示例，这通常是 Linux 发行版使用的默认 `umask` 或由系统管理员设置的值。


    | | 基础权限 | 减去 Umask | 创建权限 |

    | :--- | :--- | :--- | :--- |

    | 目录 | 777 | -022 | 755 |

    | 文件 | 666 | -022 | 644 |


    使用 `002` 的 `umask` 非常适合与组员协作。你会发现，当创建文件或目录时，权限允许组成员操作这些文件和目录。


    | | 基础权限 | 减去 Umask | 创建权限 |

    | :--- | :--- | :--- | :--- |

    | 目录 | 777 | -002 | 775 |

    | 文件 | 666 | -002 | 664 |


    这是另一个可用于与组员协作的 `umask`。使用 `007` 使得不向组之外的用户授予任何权限。


    | | 基础权限 | 减去 Umask | 创建权限 |

    | :--- | :--- | :--- | :--- |

    | 目录 | 777 | -007 | 770 |

    | 文件 | 666 | -007 | 660 |


    再次，使用这种八进制方法是一种很好的估算。你可以看到，当 `umask` 模式为 `007` 时该方法会失效。实际上，为了每次都获得准确的结果，你需要将八进制权限转换为二进制值。从那里开始，对
    `umask` 模式进行位 `NOT` 操作，然后对该结果与基础权限进行位 `AND` 操作。在这里略过这些细节是可以接受的，因为只有只有几种实用的 `umask`
    模式：`022`、`002` 和 `007`。省去你的二进制作业吧，直接查看下表包含八种排列组合产生的所有权限结果。


    | 八进制 | 二进制 | 目录权限 | 文件权限 |

    | :--- | :--- | :--- | :--- |

    | 0 | 000 | rwx | rw- |

    | 1 | 001 | rw- | rw- |

    | 2 | 010 | r-x | r— |

    | 3 | 011 | r— | r— |

    | 4 | 100 | -wx | -w- |

    | 5 | 101 | -w- | -w- |

    | 6 | 110 | —x | — |

    | 7 | 111 | — | — |


    ## 特殊模式


    查看掩码设置为 `022` 时的 `umask` 输出。


    ```bash

    $ umask 022

    ```


    你会注意到开头多了一个零。到目前为止，你只处理了代表用户、组和其他权限的三个字符。有一类特殊模式：`setuid`、`setgid` 和 `sticky`。记住，这些特殊模式是通过在通常用于
    `umask` 或 `chmod` 的八进制模式前加上一个字符来定义的。这里的要点是知道 `umask 022` 等于 `umask 022`。同样，`chmod
    644` 等于 `chmod 0644`。


    尽管书中将涵盖特殊模式，但将其包含在此供你参考。章节末有链接，如果你感兴趣可以了解更多这些模式。


    - `setuid` 权限：允许进程以文件所有者的身份运行，而不是执行它的用户。

    - `setgid` 权限：允许进程以文件的组运行，而不是执行它的用户的组运行。

    - `sticky bit`（粘滞位）：防止用户删除其他用户的文件，即使他们通常有权限这样做。


    ## umask 示例


    以下是 `umask` 模式对文件和目录创建影响的两个示例。


    ```bash

    $ umask 0022

    $ umask -S u=rwx,g=rx,o=rx

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxr-xr-x 2 bob users 4096 Dec 5 00:03 a-dir

    -rw-r—r— 1 bob users 0 Dec 5 00:03 a-file

    $ rmdir a-dir

    $ rm a-file


    $ umask 007

    $ umask 0007

    $ umask -S u=rwx,g=rwx,o=

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxrwx– 2 bob users 4096 Dec 5 00:04 a-dir

    -rw-rw– 1 bob users 0 Dec 5 00:04 a-file

    ```


    ## 总结


    在本章中，你学习了如何查看和管理文件目录权限。你学习了读、写、执行权限，以及如何将这些权限分配给用户、组和其他。你学习了使用符号模式以及八进制权限使用 `chmod`
    命令。接下来，你学习了如何通过 `newgrp` 和 `chgrp` 命令与组协作。最后，你学习了文件创建掩码以及如何使用 `umask` 命令控制它。


