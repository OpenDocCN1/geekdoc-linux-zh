    tar: Removing leading `/’ from member names


    $


    ## Getting User Input


    If you want to accept standard input, use the read command. Remember that standard
    input typically comes from a person typing at the keyboard, but it can also come
    from other sources, like the output of a command in a command pipeline. The format
    for the read command is read -p “PROMPT” VARIABLE_NAME. This version of the archive_user.sh
    script asks for the user account.


    #!/bin/bash


    read -p “Enter a user name: ” USER


    echo “Archiving user: $USER”


    # Lock the account


    passwd -l $USER


    # Create an archive of the home directory.


    tar cf /archives/${USER}.tar.gz /home/${USER}


    Let’s run this script and archive the mitch account.


    $ ./archive_user.sh


    Enter a user name: mitch


    Archiving user: mitch


    passwd: password expiry information changed.


    tar: Removing leading `/’ from member names


    $


    ## Summary


    The first line in a shell script should start with a shebang followed by the path
    to the interpreter that should be used to execute the script.


    To assign a value to a variable, start with the variable name, followed by an
    equals sign, followed by the value. Do not use a space before or after the equals
    sign.


    You can access the value stored in a variable by using $VARIABLE_NAME or ${VARIABLE_NAME}.
    The latter form is required if you want to precede or follow the variable with
    additional data.


    To assign the output of a command to a variable, enclose the command in parentheses
    and precede it with a dollar sign. VARIABLE_NAME=$(command)


    Perform tests by placing an expression in brackets. Tests are typically combined
    with if statements.


    Use if, if/else, or if/elif/else statements to make decisions in your scripts.


    To perform an action or series of actions on multiple items, use a for loop.


    To access items on the command line, use positions parameters. The name of the
    program is represented by $0, the first parameter is represented by $1, and so
    on. To access all the items on the command line starting at the first parameter
    ($1), use the special variable $@.


    You can place comments in your scripts by using the pound sign.


    Accept user input by using the read command.


    ## Quiz


