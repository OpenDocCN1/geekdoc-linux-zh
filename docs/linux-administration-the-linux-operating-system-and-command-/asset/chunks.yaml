    # System Logging


    Linux uses the syslog standard for message logging. This allows programs and applications
    to generate messages that can be captured, processed, and stored by the system
    logger. It eliminates the need for each and every application having to implement
    a logging mechanism. It also means that logging can be configured and controlled
    in a central location.


    The syslog standard uses facilities and severities to categorize messages. Each
    message is labeled with a facility code and a severity level. The various combinations
    of facilities and severities can be used to determine how a message is handled.


    Facilities are used to indicate what type of program or what part of the system
    the message originated from. For example, messages that are labeled with the kern
    facility originate from the Linux kernel. Messages that are labeled with the mail
    facility come from applications involved in handling mail.


    Each facility has a number and a keyword associated with it. This table lists
    the syslog facilities.


    Number Keyword Description


    0 kern kernel messages


    1 user user-level messages


    2 mail mail system


    3 daemon system daemons


    4 auth security/authorization messages


    5 syslog messages generated by syslogd


    6 lpr line printer subsystem


    7 news network news subsystem


    8 uucp UUCP subsystem


    9 clock daemon


    10 authpriv security/authorization messages


    11 ftp FTP daemon


    12 - NTP subsystem


    13 - log audit


    14 - log alert


    15 cron clock daemon


    16 local0 local use 0 (local0)


    17 local1 local use 1 (local1)


    18 local2 local use 2 (local2)


    19 local3 local use 3 (local3)


    20 local4 local use 4 (local4)


    21 local5 local use 5 (local5)


    22 local6 local use 6 (local6)


    23 local7 local use 7 (local7)


    This table lists each of the severities, including their code, keyword, and description.


    Code Severity Keyword Description


    0 Emergency emerg (panic) System is unusable


    1 Alert alert Action must be taken


    immediately


    2 Critical crit Critical conditions


    3 Error err (error) Error conditions


    4 Warning warning (warn) Warning conditions


    5 Notice notice Normal but


    significant condition


    6 Info info Informational


    messages


    7 Debug debug Debug-level messages


    A syslog server accepts syslog messages and process those messages based on a
    set of configurable rules. Traditionally, the syslogd daemon filled this role,
    but many Linux distributions today ship with alternatives such as rsyslog and
    syslog-ng. For the remainder of this chapter, we are going to focus on rsyslog;
    however, the concepts apply to any syslog server.


    ## Logging Rules'
