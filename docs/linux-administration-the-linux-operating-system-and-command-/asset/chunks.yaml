- fmt: "\nVim stands for “Vi IMproved.” It is compatible with the commands found in\
    \ `vi`. Some of the additional features of `vim` include syntax highlighting,\
    \ the ability to edit files over the network, multi-level undo/redo, and screen\
    \ splitting. On many Linux distributions, when you invoke `vi`, you are actually\
    \ running `vim`.\n\nOne advantage of knowing `vi` is that `vi` or its variant,\
    \ like `vim`, is always available on the system. Another advantage is that once\
    \ you learn the key mappings for `vi`, you can apply them to other commands—like\
    \ `man`, `more`, `less`, `view`—and even your shell.\n\n## Vi Modes\n\n### Command\
    \ Mode\n\n`vi` has the concept of modes. You are always working in one of three\
    \ modes: command mode, insert mode, or line mode. When `vi` starts, you are placed\
    \ in command mode. To get back to command mode at any time, hit the escape key\
    \ (`Esc`). Letters typed while in command mode are not sent to the file, but are\
    \ rather interpreted as commands. Command mode allows you to navigate about the\
    \ file, perform searches, delete text, copy text, and paste text.\n\nHere are\
    \ some commonly used key bindings for navigation.\n\n- `k` - Up one line.\n- `j`\
    \ - Down one line.\n- `h` - Left one character.\n- `l` - Right one character.\n\
    - `w` - Right one word.\n- `b` - Left one word.\n- `^` - Go to the beginning of\
    \ the line.\n- `$` - Go to the end of the line.\n\nNote that commands are case\
    \ sensitive. For example, if you want to move down one line, type the lowercase\
    \ `j`. The uppercase `J` joins lines together. The original `vi` editor did not\
    \ employ the use of arrow keys; however, `vim` does, so you may find that you\
    \ can use arrow keys on your system. The advantages of learning the original key\
    \ bindings are 1) they always work and 2) it’s faster since your hand does not\
    \ have to leave the home row.\n\n![](Images/00003.jpeg)\n\n### Insert mode\n\n\
    To enter insert mode, press one of the following keys.\n\n- `i` - Insert at the\
    \ cursor position.\n- `I` - Insert at the beginning of the line.\n- `a` - Append\
    \ after the cursor position.\n- `A` - Append at the end of the line.\n\nAfter\
    \ entering insert mode, type the desired text. When you are finished, type `Esc`\
    \ to return to command mode.\n\n### Line mode\n\nTo enter line mode, you must\
    \ start from command mode and then type a colon (`:`) character. If you are in\
    \ insert mode, type `Esc` to get back to command mode and then type a colon for\
    \ line mode. Here are some of the most common line mode commands you will want\
    \ to know.\n\n- `:w` - Writes (saves) the file.\n- `:w!` - Forces the file to\
    \ be saved even if the write permission is not set. This only works on files you\
    \ own.\n- `:q` - Quit. This will only work if there have not been any modifications\
    \ to the file.\n- `:q!` - Quit without saving changes made to the file.\n- `:wq!`\
    \ - Write and quit. After modifying a file, this command ensures it gets saved\
    \ and closes `vi`.\n- `:x` - Same as `:wq`.\n- `:n` - Positions the cursor at\
    \ line `n`. For example, `:5` will place the cursor on the fifth line in the file.\n\
    - `:$` - Positions the cursor on the last line of file.\n- `:set nu` - Turn on\
    \ line numbering.\n- `:set nonu` - Turn off line numbering.\n- `:help [subcommand]`\
    \ - Get help. If you want more information on the `:w` command, type `:help :w`.\n\
    \n| Mode | Key | Description |\n| :--- | :--- | :--- |\n| Command | `Esc` | Used\
    \ to navigate, search, and copy/paste text. |\n| Insert | `i I a A` | Also called\
    \ text mode. Allows text to be inserted in the file. |\n| Line | `:` | Also called\
    \ command-line mode. Save the file, quit `vi`, replace text, and perform some\
    \ navigation. |\n\nHere is a screenshot of `vim`. Tildes (`~`) represent lines\
    \ beyond the end of the file.\n\n![](Images/00004.jpeg)\n\n## Advanced Editing\
    \ with vi\n\nYou can repeat commands in `vi` by preceding them with a number.\
    \ For instance, if you would like to move the cursor up 5 lines, type `5k`. If\
    \ you would like to insert a piece of text 80 times, type `80i` and start entering\
    \ the text. Once you hit `Esc` to return to command mode, the text you typed will\
    \ be repeated 80 times. If you would like to make a line of asterisks, you could\
    \ type `80i*Esc`. Can you start to see how `vi` is more powerful than an editor\
    \ like `nano`?\n\n### Deleting Text\n\n- `x` - Delete a character.\n- `dw` - Delete\
    \ a word. To delete five words, type `5w`. The repeating concept in `vi` shows\
    \ up in many places.\n- `dd` - Delete a line. To delete three lines, type `3dd`.\n\
    - `D` - Delete from the current position to the end of the line.\n\n### Changing\
    \ Text\n\n- `r` - Replace the current character.\n- `cw` - Change the current\
    \ word.\n- `cc` - Change the current line.\n- `c$` - Change the text from the\
    \ current position to the end of the line.\n- `C` - Same as `c$`.\n- `~` - Reverses\
    \ the case of a character.\n\n### Copying and Pasting\n\n- `yy` - Yank (copy)\
    \ the current line.\n- `y<position>` - Yank the `<position>`. For example, to\
    \ yank a word, type `yw`. To yank three words type `y3w`.\n- `p` - Paste the most\
    \ recent deleted or yanked text.\n\n### Undo / Redo\n\n- `u` - Undo.\n- `Ctrl-r`\
    \ - Redo.\n\n### Searching\n\n- `/<pattern>` - Start a forward search for `<pattern>`.\n\
    - `?<pattern>` - Start a reverse search for `<pattern>`.\n\n### Tutorial\n\nRun\
    \ `vimtutor` from the command line to start the vim tutorial.\n\n## Emacs\n\n\
    `Emacs` is another powerful editor. Some people really find themselves drawn to\
    \ `vi` while others thoroughly enjoy using `emacs`. It’s a bit of a rivalry in\
    \ the Linux world, actually. Experiment with `emacs` and `vi` to see which one\
    \ works for you. You can’t make a bad choice as they are both great editors.\n\
    \n`emacs [file]` - Edit file.\n\nWhen reading `emacs` documentation, know that\
    \ `C-<char>` means to hold down the `Ctrl` key while pressing `<char>`. For example,\
    \ `C-h` means to hold down the `Ctrl` key while pressing the `h` key. If you see\
    \ `C-h t`, that means hold down the `Ctrl` key while pressing the `h` key, release\
    \ the `Ctrl` key and then type the letter `t`.\n\nWhen you see `M-<char>`, that\
    \ means hold down the “meta” key, which is the `Alt` key, while pressing `<char>`.\
    \ You can also substitute the `Esc` key for the `Alt` key. `M-f` translates to\
    \ holding down the `Alt` key and pressing for pressing and releasing Esc followed\
    \ by typing the `f` key. You may need to use `Esc` for the meta key since `Alt`\
    \ may be intercepted by your terminal program, for instance. If you want to simplify\
    \ things, always use `Esc` for the meta key as it will work in all situations.\n\
    \nHere are some helpful `emacs` commands.\n\n- `C-h` - Help.\n- `C-x C-c` - Exit.\
    \ While holding down `Ctrl`, press `x`, continue to hold down `Ctrl`, and press\
    \ `c`.\n- `C-x C-s` - Save the file.\n- `C-h t` - Emacs has a nice built-in tutorial.\n\
    - `C-h k <key>` - Describe key. Use this to get help on a specific key command\
    \ or key combination.\n\n### Navigating \n\n- `C-p` - Previous line.\n- `C-n`\
    \ - Next line.\n- `C-b` - Backward one character.\n- `C-f` - Forward one character.\n\
    - `M-f` - Forward one word.\n- `M-b` - Backward one word.\n- `C-a` - Go to the\
    \ beginning of the line.\n- `C-e` - Go to the end of the line.\n- `M-<` - Go to\
    \ the beginning of the file.\n- `M->` - Go to the end of the file.\n\n### Deleting\
    \ Text\n\n- `C-d` - Delete a character.\n- `M-d` - Delete a word.\n\n### Copying\
    \ and Pasting\n\n- `C-k` - Kill (cut) the rest of the current line of text. To\
    \ kill the entire line, position the cursor at the beginning of the line.\n- `C-y`\
    \ - Yank (or paste) from the previously killed text.\n\n- `C-x u` - Undo. Keep\
    \ repeating for multi-level undo.\n\n### Searching\n\n- `C-s` - Start a forward\
    \ search. Type the text you are looking for. Press `C-s` again to move to the\
    \ next occurrence. Press `Enter` when you are done.\n- `C-r` - Start a reverse\
    \ search.\n\n### Repeating\n\nLike `vi`, emacs provides a way to repeat a command.\n\
    \n`C-u N <command>` - Repeat `<command>` `N` times.\n\nFor instance, to kill three\
    \ lines of text, type `Ctrl-U 3 Ctrl-k`.\n\n![](Images/00005.jpeg)\n\nYou have\
    \ only scratched the surface with the `vi` and `emacs` editors. There is so much\
    \ more to learn if you are interested. Both editors have features that include\
    \ macros, global replace, and more. Entire books have been written on each of\
    \ these editors.\n\n### Graphical Editors\n\nSo far, you have learned about command\
    \ line editors that are appropriate to use when you connect to a server via ssh.\
    \ However, if you are running Linux as a desktop operating system you might be\
    \ interested in some graphical text editors and word processors. Here are some\
    \ for your consideration.\n\n`emacs` - Emacs has a graphical mode, too.\n"
