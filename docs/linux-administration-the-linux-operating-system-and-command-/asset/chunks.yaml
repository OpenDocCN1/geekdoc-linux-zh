    When a command is backgrounded, two numbers are displayed. The number in brackets
    is the job number and can be referred by preceding it with the percent sign. The
    second number is the PID. Here is what starting multiple processes in the background
    looks like.


    $ ./long-running-program &


    [1] 22703


    $ ./long-running-program &


    [2] 22705


    $ ./long-running-program &


    [3] 22707


