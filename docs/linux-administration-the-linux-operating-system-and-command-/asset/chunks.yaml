    ## The Hosts File


    The /etc/hosts file contains a list of IP addresses and hostnames. You can create
    entries in the hosts file by starting a line with an IP address and then following
    it with the name or names you want to translate that IP address to. The following
    example entry uses multiple names, but if you don’t need or want to access the
    system by multiple names, you can simply list one name. This entry could be one
    of many in the hosts file.


    10.11.12.13 webprod02.mycorp.com webprod02


    After you have created an entry in /etc/hosts, you can start communicating with
    that IP address by using the name listed in the host file. This can be useful
    if you want to access computers that do not have DNS hostnames. Also, it’s common
    to use /etc/host entries to override the DNS entry of a system. For example, if
    you have a cluster of web servers you could have a private network that only the
    web cluster members can access. You can create an entry for the members of the
    cluster in /etc/hosts and use their private address, thus forcing network communications
    through the private network.


    It’s important to note that /etc/hosts is local to the system. Adding an entry
    to the /etc/hosts file does not add an entry into DNS.


    Here is an example /etc/hosts file. You’ll see the first line contains an entry
    for localhost. Remember that this is used by the loopback device for internal
    communications. The next line contains the public IP address of the system followed
    by the FQDN and then the short name. The third line contains a non-routable IP
    address for webprod02. In this example, it’s the private IP address of that system.
    There is another similar entry for webprod03 on the next line. The last line is
    only contains one name: dbcluster.


    127.0.0.1 localhost


    1.2.1.6 webprod01.mycompany.com webprod01


    10.11.12.14 webprod02.mycompany.com webprod02


    10.11.12.15 webprod03.mycompany.com webprod03


    10.11.13.7 dbcluster


    ## Name Service Switch


    Typically, the /etc/hosts file is checked first before a DNS server is queried,
    but you can change this behavior by editing the /etc/nsswitch.conf file. NSS stands
    for Name Service Switch and it controls the order in which lookups are performed.


    The hosts line determines the order for name resolution. For example, if you have
    hosts: files dns in the nsswitch.conf file, the /etc/hosts file will be searched
    first. If an IP address is found, that IP is used and the search stops. If it
    is not found, then DNS is queried.


    There are other services that can resolve hostnames. If you want to use NIS for
    name resolution you can add it to the hosts line in /etc/nsswitch.conf. Here is
    an example.


    hosts: files nis dns


    Here is an example /etc/nsswitch.conf file.


    #


    # /etc/nsswitch.conf


    #


    # An example Name Service Switch config file. This


    # file should be sorted with the most-used services


    # at the beginning.


    #


    # The entry ‘[NOTFOUND=return]’ means that the search


    # for an entry should stop if the search in the


    # previous entry turned up nothing. Note that if the


    # search failed due to some other reason(like no NIS


    # server responding) then the search continues with


    # the# next entry.


    passwd: files sss


    shadow: files sss


    group: files sss


    hosts: files dns myhostname


    bootparams: nisplus [NOTFOUND=return] files


    ethers: files


    netmasks: files


    networks: files


    protocols: files


    rpc: files


    services: files sss


    netgroup: files sss


    publickey: nisplus


    automount: files


    aliases: files nisplus


    ## Network Ports


    Just like IP addresses identify hosts on a network, ports identify the services
    on a host. When a service starts on a system, it binds itself to a port and listens
    for traffic destined for its port.


    Ports range from 1 to 65,535\. Ports from 1 through 1,023 are called well-known
    ports or system ports. These ports are pre-assigned ports and are used for common
    system services. These ports are also called privileged ports since it requires
    superuser privileges to open these ports. Ports above 1,024 can be opened and
    used by normal users on a system and are called unprivileged ports.


    The following is a very short list of common ports. For example, port 22 is reserved
    for SSH, 25 for SMTP, 80 for HTTP, 143 for IMAP, 389 for LDAP, and 443 for HTTPS.
    For a complete list of ports visit http://www.linuxtrainingacademy.com/ports.


    Port


    Service


    22


    SSH


    25


    SMTP


    80


    HTTP


    143


    IMAP


    389


    LDAP


    443


    HTTPS


    When you type https://www.mybank.com into address bar of your web browser, your
    computer translates www.mybank.com into an IP address. Then, your web browser
    initiates a request to that IP address on port 443\. The service—in this case
    a web server—will receive the traffic on port 443.


    The /etc/services file translates human-readable names into port numbers. Here
    you’ll find a list of predefined ports. You can also add to this list. For instance,
    when you install third party software, you may need to add an entry in /etc/services
    for the service that software provides. You can also create entries for your own
    custom written applications that use ports.


    Here is what the ports from the previous table would look like in the /etc/services
    file.


    ssh 22/tcp # SSH Remote Login Protocol


    smtp 25/tcp # SMTP


    https 80/tcp # HTTP


    imap2 143/udp # IMAP


    ldap 389/tcp # LDAP


    https 443/tcp # HTTP protocol over TLS/SSL


