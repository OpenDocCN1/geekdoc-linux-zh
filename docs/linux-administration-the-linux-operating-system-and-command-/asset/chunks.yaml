    这是第三行。

    这是第四行。

    这是第五行。

    ```


    ```bash

    tail file.txt

    这是文件的最后一行。

    这是倒数第二行。

    这是倒数第三行。

    这是倒数第四行。

    ```


    ```bash

    more file.txt

    这是第一行。

    这是第二行。

    这是第三行。

    这是第四行。

    这是第五行。

    (按空格键继续，按回车键换行，输入 q 退出)

    ```

