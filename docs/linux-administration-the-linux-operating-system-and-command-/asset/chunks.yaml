    $IncludeConfig /etc/rsyslog.d/*.conf


    Logging rules consist of two fields. The first field is called the selector field
    and it lists the facilities and severities of messages to include in the rule.
    The second field is called the action field and it determines what will happen
    to the messages matched by the selector field. The most common action is to write
    the messages to a log file. The selector field and action field can be separated
    by one or more spaces or tabs.


