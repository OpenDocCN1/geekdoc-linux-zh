  trans: "\n\n与其在分钟字段上使用 0,30，你也可以使用 `*/2`。你甚至可以使用带连字符的范围。如果你想在每小时的前四分钟内每分钟运行一次作业，可以使用此时间规范：`0-4\
    \ * * * * command`。\n\ncron 调度器有多种实现，某些实现允许你在 crontabs 中使用快捷方式和关键字。下面提供了一些常用关键字，但请参考你系统上的\
    \ cron 文档以确保这些内容有效。\n\n| 关键字 | 描述 | 等效于 |\n| :--- | :--- | :--- |\n| `@yearly`\
    \ | 每年 1 月 1 日凌晨运行一次 | `0 0 1 1 *` |\n| `@annually` | 与 `@yearly` 相同 | `0 0 1\
    \ 1 *` |\n| `@monthly` | 每月 1 号凌晨运行一次 | `0 0 1 * *` |\n| `@weekly` | 每周日凌晨运行一次\
    \ | `0 0 * * 0` |\n| `@daily` | 每天凌晨运行一次 | `0 0 * * *` |\n| `@midnight` | 与 `@daily`\
    \ 相同 | `0 0 * * *` |\n| `@hourly` | 每小时开始时运行一次 | `0 * * * *` |\n| `@reboot` |\
    \ 启动时运行 | N/A |\n\n## 使用 crontab 命令\n\n使用 `crontab` 命令来管理 cron 作。\n\n- `crontab\
    \ [file]` - 从文件安装新的 crontab。\n- `crontab -l` - 列出你的 cron 作。\n- `crontab -e` -\
    \ 编辑你的 cron 作。\n- `crontab -r` - 移除你所有的 cron 作。\n\n```bash\n$ crontab -l\nno crontab\
    \ for bob\n$ cat my-cron\n# 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n\
    $ crontab my-cron\n$ crontab -l\n# 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n\
    $ crontab -e\n# 调用了 $EDITOR。\n$ crontab -r\n$ crontab -l\nno crontab for bob\n\
    $\n```\n\n## 总结\n\n在本章中，你学习了如何使用 `ps`、`pstree`、`top` 和 `htop` 命令查看运行进程。接下来，你学习了如何在后台启动作业，以及如何查看、挂起、恢复和杀死这些作业。你还学习了如何使用\
    \ `kill`、`pkill` 和 `killall` 命令杀死进程。接着涵盖了进程优先级和 nice 值（niceness）。你学习了如何使用 `nohup`\
    \ 命令确保即使在断开 Linux 系统连接的情况下长时间进程也能继续运行。你还学习了负载平均值以及如何确定 Linux 系统中 CPU 的数量。最后，你学习了如何使用\
    \ cron 服务调度作业。\n\n## 测验\n\n哪个命令用于查看运行的进程？\n- `ps` \n- `pid`\n- `proc`\n- `lsproc`\n\
    \n在命令行末尾放置什么字符可以在后台启动该命令？\n- `-`\n- `?`\n- `\\`\n- `&`\n\n`kill` 命令可以用于杀死进程和作业。\n\
    - 正\n- 错\n\n哪个命令用于创建、读取、更新和删除 cron 作？\n- `cron`\n- `crond`\n- `crontab`\n- `vicron`\n\
    \n以下哪个 cron 作会在每天上午 08:00 运行？\n- `8 0 0 * * /opt/acme/bin/backup`\n- `8 0 * *\
    \ * /opt/acme/bin/backup`\n- `8 * * * * /opt/acme/bin/backup`\n- `0 8 * * * /opt/acme/bin/backup`\n\
    \n## 测验答案\n\nA\nD\nA\nC\nD\n\n## 文件和目录权限\n\n回看 `ls` 命令提供的长列表，你可以看到显示的第一位信息是针对定文件或目录的权限。\n\
    \n```bash\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n\
    ```\n\n权限字符串中的第一个字符揭示了类型。例如，`-` 是普通文件，`d` 是目录，`l` 是符号链接。这些是你会遇到的最常见类型。要查看完整列表，请阅读\
    \ `ls` 的 man 页。\n\n| 符号 | 类型 |\n| :--- | :--- |\n| `-` | 普通文件 |\n| `d` | 目录 |\n\
    | `l` | 符号链接 |\n\n你会在权限字符串中注意到其他字符。它们代表三种主要的权限类型：读、写和执行。每个权限由一个字母表示，也称为符号。读由 `r`\
    \ 表示，写由 `w` 表示，执行由 `x` 表示。\n\n| 符号 | 权限 |\n| :--- | :--- |\n| `r` | 读 |\n| `w`\
    \ | 写 |\n| `x` | 执行 |\n\n读、写和执行是非常自言自懂的。如果你有“读”权限，你可以查看文件内容。如果你有“写”权限，你可以修改文件。如果你有“执行”权限，你可以将文件作为程序运行。然而，当这些权限被应用于目录时，它们的含义与应用于文件时略有不同。\n\
    \n| 权限 | 文件含义 | 目录含义 |\n| :--- | :--- | :--- |\n| 读 | 允许文件被读取。 | 允许读取目录中的文件名。\
    \ |\n| 写 | 允许文件被修改。 | 允许修改目录内的条目。 |\n| 执行 | 允许执行文件。 | 允许访问目录内条目的的内容和元数据。 |\n\n\
    这些权限可以应用于三类用户。这些类别（或类）是：用户（user）、组（group）和其他用户（other）。就像权限类型一样，每组都由一个字母表示。拥有文件的用户由\
    \ `u` 表示，文件所在组的用户由 `g` 表示，其他不拥有文件也不属于该文件组的用户由 `o` 表示。字符 `a` 代表所有，意味着用户、组和其他用户。\n\
    \n| 符号 | 类别 |\n| :--- | :--- |\n| `u` | 用户 |\n| `g` | 组 |\n| `o` | 其他 |\n| `a`\
    \ | 所有，用户、组和其他。 |\n\n每个用户至少属于一个组，称为主组。然而，用户通常属于多个组。例如，如果销售团队需要访问某些文件，他们可以被放入 `sales`\
    \ 组。\n\n运行 `groups` 命令查看你属于哪些组。如果你向 `groups` 命令提供另一个用户 ID，将看到该用户所属的组列表。\n\n```bash\n\
    $ groups\nusers sales\n$ id -Gn\nusers sales\n$ groups pat\nusers projectx\n$\
    \ groups jill\nusers manager\n```\n\n## 权限解码环\n\n现在你有足够的背景信息来解码权限字符串。第一个字符是类型。下一个三个字符代表用户的权限。下一个三个字符代表文件组成员的权限。最后的三个字符代表所有其他的权限。\n\
    \n在这种情况下，顺序是有意义的。将显示用户，用户组，最后和其他。同样，读、写和执行权限类型按此顺序显示。如果未授予特定权限，连字符（`-`）将占据位置。\n\
    \n这是 `ls -l` 显示权限信息的图形化表示。\n\n![](img/00001.jpeg)\n\n如果在权限字符串末尾看到额外的字符，说明应用另一种访问控制方法。如果你看到点（`.`），该文件或目录应用了\
    \ SELlinux（安全增强 Linux）安全上下文。如果你看到加号（`+`），则使用了 ACL（访问控制列表）。SELinux 和 ACL 超出了本书的涉及范围。然而，你会高兴地发现这两者的使用都很罕见。如果你在权限遇到问题并在权限字符串中注意到额外字符，请知道可能需要进一步调查。\n\
    \n```bash\n$ ls -l sales.data.selnx\n-rw-r—r—. 1 bob users 10400 Sep 27 08:52\
    \ sales.data.selnx\n$ ls -l sales.data.acl\n-rw-r—r—+ 1 bob users 10400 Sep 27\
    \ 08:52 sales.data.acl\n```\n\n"
- fmt: '

    The permissions. One or more for read, for write, and x for execute.


    You can add, subtract, or set permissions using user category and permission pairs.
    For example, if you want to add the write permission for the members of a file’s
    group, you would specify `chmod g+w file`.


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g+w sales.data

    $ ls -l sales.data

    -rw-rw-r— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    Notice that after running `chmod g+w sales.data`, the permissions string changed
    from ‘-rw-r—r—’ to ‘-rw-rw-r—’.. Remember that the permissions are displayed in
    the order of user, group, and other. The group permission set now includes the
    `w` symbol, indicating that the write permission has been granted. Now the owner
    of the file (`bob`) and members of the group (`users`) can read and write to the
    `sales.data` file. Here is the reverse. This is how you would subtract the write
    permission.


    ```

    $ ls -l sales.data

    -rw-rw-r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g-w sales.data

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    You can change more than one permission at a time. This time, write and execute
    permissions are added for the file’s group.


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod g+wx sales.data

    $ ls -l sales.data

    -rw-rwxr— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    You can even set permissions on different user categories simultaneously. Here
    is how to change permissions for the user and group. Notice that before running
    this command, the user already has the write permissions. Using `+` to add permissions
    does not negate any existing permissions; it just adds to them.


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod ug+wx sales.data

    $ ls -l sales.data

    -rwxrwxr— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you want to set different permissions for different user categories, you can
    separate the specifications with a comma. You can mix and match to produce the
    outcome you desire. Here is how you can specify `rwx` for user while adding `x`
    for group.


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod u=rwx,g+x sales.data

    $ ls -l sales.data

    -rwxr-xr— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you want to set the file to be just readable by everyone, run `chmod a=r file`.
    When you use the equal sign (`=`), the permissions are set to exactly what you
    specify. If you specify just read, then only read will be available, regardless
    of any existing permissions.


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod a=r sales.data

    $ ls -l sales.data

    -r—r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    If you do not specify permissions following the equal sign, the permissions are
    removed. Here is an illustration of this behavior:


    ```

    $ ls -l sales.data

    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data

    $ chmod u=rwx,g=rx,o= sales.data

    $ ls -l sales.data

    -rwxr-x– 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    ## Numeric Based Permissions


    In addition to symbolic mode, octal mode can be used with `chmod` to set file
    and directory permissions. Understanding the concepts behind symbolic mode will
    help you learn octal mode. However, once you learn octal mode, you may find that
    it is even quicker and easier to use than symbolic mode. Since there are only
    a few common and practical permission modes, they can be readily memorized and
    recalled.


    In octal mode, permissions are based in binary. Each permission type is treated
    as a bit that is either set to off (0) or on (1). In permissions, order has meaning.
    Permissions are always in read, write, and execute order. If `r`, `w`, and `x`
    are all set to off, the binary representation is `000`. If they are all set to
    on, the binary representation is `111`. To represent read and execute permissions
    while omitting write permissions, the binary number is `101`.


    | r | w | x |

    |---|---|---|

    | 0 | 0 | 0 | Binary Value for off |

    | 1 | 1 | 1 | Binary Value for on |


    | r | w | x |

    |---|---|---|

    | 0 | 0 | 0 | Base 10 (decimal) value for off |

    | 4 | 2 | 1 | Base 10 (decimal) value for on |


    To get a number that can be used with `chmod`, convert the binary representation
    into base 10 (decimal). The shortcut here is to remember that read equals 4, write
    equals 2, and execute equals 1. The permissions number is determined by adding
    up the values for each permission type. There are eight possible values from zero
    to seven, hence the name octal mode. This table demonstrates all eight of the
    possible permutations.


    | Octal | Binary | String | Description |

    ||---|---|---|

    | 0 | 000 | – | No permissions |

    | 1 | 001 | —x | Execute only |

    | 2 | 010 | -w- | Write only |

    | 3 | 011 | -wx | Write and execute (2 + 1) |

    | 4 | 100 | r— | Read only |

    | 5 | 101 | r-x | Read and execute (4 + 1) |

    | 6 | 110 | rw- | Read and write (4 + 2) |

    | 7 | 111 | rwx | Read, write, and execute (4+2+1) |


    ## Commonly Used Permissions


    Here are the most used permissions. These five will let you do about anything
    you need.


    | Symbolic | Octal | Use Case / Meaning |

    |---|---|---|

    | -rwxrwxrwx | 777 | U, G, O |

    | -rwxrxr-x | 755 | Allows everyone on the system to execute the file but only
    the owner can edit it |

    | -rwx------ | 700 | Only the owner has access |

    | -rw-rw-r— | 664 | Allows a group of people to modify the file and let others
    read it |

    | -rw-rw--- | 660 | Allows a group of people to modify the file and not let others
    read it |

    | -r--r--r— | 444 | Allows everyone on the system to read the file but only the
    owner can edit it |


    When you encounter `777` or `666`, ask yourself “Is there a better way to do this?”
    “Does everybody on the system need write access to this?” For example, if a script
    or program is set to `777`, then anyone on the system can make changes to it.
    Since the execute bit is set for everyone, that program can be executed.


    ## Working with Groups


    If you work on the sales team and each member needs to update the `sales.report`,
    you would set the group to `sales` using the `chgrp` command and then set the
    permissions to `664(rw-rw-r--)`. You could even use `660(rw-rw--)` if you want
    to make sure only members of the sales team can read the report.


    When you create a file, its group is set to your primary group. This behavior
    can be overridden by using the `newgrp` command, but keep in mind when you create
    a file it typically inherits your default group. In the following example, Bob’s
    primary group is `users`. Note that the format of the `chgrp` command is `chgrp
    GROUP FILE`.


    ```

    $ nano sales.report

    $ ls -l sales.report

    -rw-r—r— 1 bob users 6 Dec 4 20:41 sales.report

    $ chgrp sales sales.report

    $ ls -l sales.report

    -rw-r—r— 1 bob sales 6 Dec 4 20:41 sales.report

    $ chmod 664 sales.report

    $ ls -l sales.report

    -rw-rw-r— 1 bob sales 6 Dec 4 20:41 sales.report

    ```

