    ```bash\n#!/bin/bash\n\nread -p “Enter a user name: ” USER\n\necho “Archiving\
    \ user: $USER”\n\n# Lock the account\n\npasswd -l $USER\n\n# Create an archive\
    \ of the home directory.\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n```\n\
    \nLet’s run this script and archive the mitch account.\n\n```bash\n$ ./archive_user.sh\n\
    \nEnter a user name: mitch\n\nArchiving user: mitch\n\npasswd: password expiry\
    \ information changed.\ntar: Removing leading `/’ from member names\n$\n```\n\n\
    ## Summary\n\n- The first line in a shell script should start with a shebang followed\
    \ by the path to the interpreter that should be used to execute the script.\n\
    - To assign a value to a variable, start with the variable name, followed by an\
    \ equals sign, followed by the value. Do not use a space before or after the equals\
    \ sign.\n- You can access the value stored in a variable by using `$VARIABLE_NAME`\
    \ or `${VARIABLE_NAME}`. The latter form is required if you want to precede or\
    \ follow the variable with additional data.\n- To assign the output of a command\
    \ to a variable, enclose the command in parentheses and precede it with a dollar\
    \ sign. `VARIABLE_NAME=$(command)`.\n- Perform tests by placing an expression\
    \ in brackets. Tests are typically combined with `if` statements.\n- Use `if`,\
    \ `if/else`, or `if/elif/else` statements to make decisions in your scripts.\n\
    - To perform an action or series of actions on multiple items, use a `for` loop.\n\
    - To access items on the command line, use positions parameters. The name of the\
    \ program is represented by `$0`, the first parameter is represented by `$1`,\
    \ and so on. To access all the items on the command line starting at the first\
