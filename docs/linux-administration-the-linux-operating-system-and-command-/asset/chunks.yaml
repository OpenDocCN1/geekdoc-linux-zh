    ## 测试 (Tests)


    脚本的设计是为了取代人工物理坐在键盘前输入一系列命令。如果你有一个想要自动化的任务，但它需要根据不同的情况执行不同的操作，会怎样？由于在脚本运行时，人可能不在场做决定，我们需要对这些条件进行测试并让脚本采取相应的行动。


    要创建一个测试，在括号之间放置一个条件表达式。语法为：`[ condition-to-test-for ]`。你可以测试多种类型的情况。例如，你可以比较字符串是否相等、一个数字是否大于另一个数字，或者文件是否存在。此测试检查
    `/etc/passwd` 是否存在。如果存在，它返回 true。换句话说，命令以状态 `0` 退出。如果文件不存在，它返回 false。即，命令以状态 `1`
    退出。


    ```bash

    [ -e /etc/passwd ]

    ```


    如果你正在使用 `bash` shell，可以运行命令 `help test` 来查看你可以执行的各种类型的测试。你也可以阅读测试的 man 页：`man
    test`。这里是你可以执行的一些更常见的测试。


    文件操作符：

    - `-d FILE` 如果文件是目录，则为 True。

    - `-e FILE` 如果文件存在，则为 True。

    - `-f FILE` 如果文件存在且是普通文件，则为 True。

    - `-r FILE` 如果你可以读取，则为 True。

    - `-s FILE` 如果文件存在且为空，则为 True。

    - `-w FILE` 如果文件可写，则为 True。

    - `-x FILE` 如果文件可执行，则为 True。


    字符串操作操作符：

    - `-z STRING` 如果字符串为空，则为 True。

    - `-n STRING` 如果字符串不为空，则为 True。

    - `STRING` 如果字符串不为空，则为 True。

    - `STRING1 = STRING2` 如果字符串相等，则为 True。

    - `STRING1 != STRING2` 如果字符串不相等，则为 True。


    算术操作符：

    - `arg1 -eq arg2` 如果 `arg1` 等于 `arg2`，则为 True。

    - `arg1 -ne arg2` 如果 `arg1` 不等于 `arg2`，则为 True。

    - `arg1 -lt arg2` 如果 `arg1` 小于 `arg2`，则为 True。

    - `arg1 -le arg2` 如果 `arg1` 小于等于 `arg2`，则为 True。

    - `arg1 -gt arg2` 如果 `arg1` 大于 `arg2`，则为 True。

    - `arg1 -ge arg2` 如果 `arg1` 大于等于 `arg2`，则为 True。


    ## if 语句 (The if Statement)


    现在你知道如何判断某个条件是否成立，你可以将其与 `if` 语句结合起来，在脚本中做出决策。


    `if` 语句以单词 `if` 开头，后面跟着一个测试。下一行包含单词 `then`。接下来是一系列如果测试条件为真将执行的命令。最后，`if` 语句以 `fi`
    结束，它是 `if` 的反拼写。以下是语法。


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    fi

    ```


    这里是一个示例：


    ```bash

    #!/bin/bash

    MY_SHELL="bash"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    fi

    ```


    在执行条件测试时，将变量括在引号中是最佳实践，可以防止意外的副作用。这是运行脚本的输出：


    ```

    You seem to like the bash shell.

    ```


    你也可以使用 `if/else` 语句在条件不成立时执行某个操作。以下是 `if/else` 语句的样式。


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    else #

    command 3

    command 4

    …

    fi

    ```


    让我们更新脚本，以便在语句不成立时执行某个操作。


    ```bash

    #!/bin/bash

    MY_SHELL="csh"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    else

    echo "You don’t seem to like the bash shell."

    fi

    ```


    这是输出。因为 `[ "$MY_SHELL" = "bash" ]` 结果为假，所以执行了 `else` 之后的语句。


    ```

    You don’t seem to like the bash shell.

    ```


    你还可以使用 `elif` 测试多个条件。`elif` 是 “else if”的缩写。像 `if` 一样，`elif` 后面跟着要测试的条件。在下一行，使用单词
    `then`。最后，提供一系列如果条件求值为真时执行的命令。


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    elif [ condition-true ]

    then

    command 3

    command 4

    …

    else #

    command 5

    command 6

    …

    fi

    ```


    这里是一个使用 `elif` 更新后的脚本：


    ```bash

    #!/bin/bash

    MY_SHELL="csh"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    elif [ "$MY_SHELL" = "csh" ]

    then

    echo "You seem to like the csh shell."

    else

    echo "You don’t seem to like the bash or csh shells."

    fi

    ```


    输出：

    ```

    You seem to like the csh shell.

    ```


    ## for 循环 (The for Loop)


    如果你想对项目列表执行某些操作，请使用 `for` 循环。`for` 循环的第一行以单词 `for` 开头，后面跟着变量名，然后是单词 `in` 和一个项目列表。下一行包含单词
    `do`。在后续行中放置你想要执行的语句；最后用单行的单词 `done` 结束 `for` 循环。


    ```bash

    for VARIABLE_NAME in ITEM_1 ITEM_2 ITEM_N

    do

    command 1

    command 2

    ```


    本质上，`for` 循环会将列表中的每个项赋值给变量并执行代码块。这是一个显示 `for` 循环如何工作的简单脚本：


    ```bash

    for color in red blue green

    do

    echo

    The color is $color"

    done

    ```


    输出：

    ```

    The color is red

    The color is blue

    The color is green

    ```


    ## 位置参数 (Positional Parameters)


    位置参数是包含命令行内容的变量。这些变量是 `$0` 到 `$9`。脚本本身存储在 `$0` 中，第一个参数在 `$1`，第二个在 `$2`，以此此类推。参考此命令行示例：


    ```

    $ script.sh parameter1 parameter2 parameter3

    ```


    `$0` 的内容是 `script.sh`， `$1` 是 `parameter1`， `$2` 是 `parameter2`， `$3` 是 `parameter3`。


    脚本 `archive_user.sh` 接受一个作为用户名的参数：


    ```bash

    #!/bin/bash

    echo "Executing script: $0"

    echo "Archiving user: $1"

    # 锁定账户

    passwd -l $1

    # 创建家目录的存档

    tar cf /archives/${1}.tar.gz /home/${1}

    ```


    当我们执行 `archive_user.sh` 脚本时，输出如下：


    ```

    $ ./archive_user.sh elvis

    Executing script: ./archive_user.sh

    Archiving user: elvis

    passwd: password expiry information changed.

    tar: Removing leading ‘/ from member names

    ```


    ## 注释 (Comments)


    井号之后的所有内容都是注释。唯一的例外是第一行的 shebang。在脚本的其他地方，当遇到井号时，它标记了注释的开始。注释会被解释器忠实地忽略，因为它们是为了我们人类的利益。


    井号之后的内容都会被忽略。如果井号从行开始，则整行都会被忽略。如果在行中间遇到井号，则井号右侧的信息将被忽略。


    '
