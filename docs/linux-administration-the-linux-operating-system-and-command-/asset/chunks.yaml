    ## The File System Table


    The /etc/fstab file controls where devices are mounted on a Linux system and what
    options to use when mounting those devices. Each entry consists of one line with
    six columns. If a line starts with #, it’s a comment and is ignored. The six columns
    are the device, mount point, filesystem type, options, dump, and file system check
    order. Each of these columns is separated by a space or a tab. Here is an example
    /etc/fstab file.


    # device mount point filesystem options dump fsck


    /dev/sda2 / xfs defaults 0 1


    /dev/sda1 swap swap defaults 0 0


    ### Device


    This column contains a path to a device, a label for a device, or a UUID (universally
    unique identifier) of a device.


    ### Mount Point


    This column determines where the device will be mounted.


    ### Filesystem Type


    The third column contains the filesystem type. Use the same type here are as you
    did when you created the filesystem with the mkfs command.


    ### Mount Options


    Use this column to specify which options to mount the filesystem with. The keyword
    defaults represents the defaults for the filesystem which are typically the rw,
    suid, dev, exec, auto, nouser, and async options. Consult the man page for fstab,
    mount, and the filesystem for a full list of options. To specify multiple options
    separate them with a comma. Do not use spaces before or after the commas.


    ### Dump


    This column is used by dump utility. If it contains a 0, dump will ignore this
    filesystem. If it contains a 1, dump will backup this filesystem. You can safely
    ignore this column if you do not use the dump utility to perform backups. Today,
    dump is rarely used for backups.


    ### Fsck


    This column is used by the fsck program at boot time to determine if a filesystem
    is to be checked and in what order to check the filesystems. Valid values are
    0, 1, and 2\. If this column contains a 0, fsck will skip checking this filesystem.
    File systems with a value of 1 will be checked first then the filesystems with
    a value of 2 will be checked next. For filesystems that you want to have checked,
    it’s a best practice to set the / filesystem to 1 with the remaining filesystems
    set to 2.


    Let’s look at the example /etc/fstab file again.


    # device mount point filesystem options dump fsck


    /dev/sda2 / xfs defaults 0 1


    /dev/sda1 swap swap defaults 0 0


    The first entry ensures that /dev/sda2 will get mounted on /. Its filesytem type
    is xfs and it uses the default options. Since the dump column contains a 0, the
    dump utility will not backup this filesystem. The value in the fsck column is
    1, so this filesystem will get checked first during the boot up.


    The second entry ensures that /dev/sda1 will be used as a swap device. For swap
    devices, use the swap keyword as the mount point and filesystem type. The dump
    and fsck columns are set to 0 as swap space does not need to be backed up or checked.


    This fstab uses UUIDs ands labels in the device column. The device with the UUID
    of dbae4fe7-b06f-4319-85dc-b93ba4a16b17 will be mounted on /. The device with
    the label opt will be mounted on /opt and the /dev/sda1 device will be used as
    swap space.


    UUID=dbae4fe7-b06f-4319-85dc-b93ba4a16b17 / xfs defaults 0 1


    LABEL=opt /opt ext4 defaults 1 1


    /dev/sda1 swap swap defaults 0 0


    To view labels and UUIDs, use the lsblk -f command. If you are only interested
    in the UUIDs, you can use the blkid command.


    # lsblk -f


    NAME FSTYPE LABEL UUID MOUNTPOINT


    sda


    +-sda1 swap 1cb76bec-a1fa-4ac6-8296-c508e936b744 [SWAP]


    +-sda2 xfs dbae4fe7-b06f-4319-85dc-b93ba4a16b17 /


    sdb


    +-sdb1 swap 619dc6d9-1b0b-4a9a-9df5-bfc343fb8d6e [SWAP]


    +-sdb2 ext3 6517c68b-3671-42e7-9f37-e2fb9a549322


    +-sdb3 ext4 opt 8b885f83-0d2c-4fe5-a4f1-dc678a9dec5a


    sdc


    +-sdc1


    sr0


    # blkid


    /dev/sda1: UUID=“1cb76bec-a1fa-4ac6-8296-c508e936b744” TYPE=“swap”


    /dev/sda2: UUID=“dbae4fe7-b06f-4319-85dc-b93ba4a16b17” TYPE=“xfs”


    /dev/sdb1: UUID=“619dc6d9-1b0b-4a9a-9df5-bfc343fb8d6e” TYPE=“swap”


    /dev/sdb2: UUID=“6517c68b-3671-42e7-9f37-e2fb9a549322” SEC_TYPE=“ext2” TYPE=“ext3”


    /dev/sdb3: LABEL=“opt” UUID=“8b885f83-0d2c-4fe5-a4f1-dc678a9dec5a” TYPE=“ext4”


    Each filesystem type will have a utility that you can use to create or modify
    the label for the filesystem. For ext filesystems, you can use the e2label command.
    Simply pass the path to the device as the first argument and the label as the
    second argument. Here is how to add the label “opt” to the /dev/sdb3 device.


    # e2label /dev/sdb3 opt


