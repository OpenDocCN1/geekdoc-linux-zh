  trans: '

    Vim 代表“Vi 的改进版”。它与 `vi` 中的命令兼容。`vim` 的一些额外功能包括语法高亮、通过网络编辑文件、多层级撤销/重做以及屏幕分屏。在许多
    Linux 发行版中，当你调用 `vi` 时，实际上运行的是 `vim`。


    学习 `vi` 的一个优势是 `vi` 或其变体（如 `vim`）在系统中总是可用的。另一个优势是，一旦你学会了 `vi` 的键映射，你就可以将其应用于其他命令——如
    `man`、`more`、`less`、`view`——甚至是你的 shell。


    ## Vi 模式


    ### 命令模式 (Command Mode)


    `vi` 有模式的概念。你始终处于三种模式之一：命令模式、插入模式或行模式。当 `vi` 启动时，你处于命令模式。若要随时返回命令模式，请按下退格键（`Esc`）。在命令模式下输入的字母不会发送到文件中，而是被解释为命令。命令模式允许你在文件中进行导航、执行搜索、删除文本、复制文本和粘贴文本。


    这里是一些常用的导航键位绑定。


    - `k` - 向上一行。

    - `j` - 向下一行。

    - `h` - 向左移动一个字符。

    - `l` - 向右移动一个字符。

    - `w` - 向右一个单词。

    - `b` - 向左一个单词。

    - `^` - 回到行首。

    - `$` - 到行尾。


    注意命令是区分大小写的。例如，如果你想向下移动一行，输入小写的 `j`。大写的 `J` 则合并行。原始的 `vi` 编辑器没有使用方向键；但 `vim` 使用了，所以你可能会发现你的系统可以使用方向键。学习原始键位的优势在于：1)
    它们始终有效；2) 速度更快，因为你的手不需要离开主位键。


    ![](img/00003.jpeg)


    ### 插入模式 (Insert mode)


    要进入插入模式，请按下以下键之一。


    - `i` - 在光标位置插入。

    - `I` - 在行首插入。

    - `a` - 在光标位置后追加。

    - `A` - 在行尾追加。


    进入插入模式后，输入所需的文本。完成后，输入 `Esc` 返回命令模式。


    ### 行模式 (Line mode)


    要进入行模式，你必须先从命令模式开始，然后输入冒号（`:`）字符。如果你处于插入模式，先输入 `Esc` 返回命令模式，然后输入冒号进入行模式。这里是你可能需要知道的一些常用行模式命令。


    - `:w` - 写入（保存）文件。

    - `:w!` - 强制保存文件，即使没有设置写权限。这仅适用于你拥有的文件。

    - `:q` - 退出。如果文件没有任何修改，此命令将生效。

    - `:q!` - 不保存对文件的修改直接退出。

    - `:wq!` - 写入并退出。在修改文件后，此命令确保文件被保存并关闭 `vi`。

    - `:x` - 与 `:wq` 相同。

    - `:n` - 将光标置于第 `n` 行。例如，`:5` 将将光标放在文件的第五行。

    - `:$` - 将光标置于文件的最后一行。

    - `:set nu` - 开启行号。

    - `:set nonu` - 关闭行号。

    - `:help [subcommand]` - 获取帮助。如果你想获取关于 `:w` 命令的更多信息，输入 `:help :w`。


    | 模式 | 键 | 描述 |

    | :--- | :--- | :--- |

    | 命令 | `Esc` | 用于导航、搜索和复制/粘贴文本。 |

    | 插入 | `i A` | 也称为插入模式。允许在文件中插入文本。 |

    | 行 | `:` | 也称为命令行模式。保存文件、退出 `vi`、替换文本并执行导航。 |


    这是 `vim` 的一个截图。波号（`~`）表示文件末的行。


    ![](img/00004.jpeg)


    ## 高级编辑


    你可以通过在命令前加上数字来重复 `vi` 中的命令。例如，如果你想向上移动 5 行，输入 `5k`。如果你想插入 80 次文本，输入 `80i`。一旦按下
    `Esc` 返回命令模式，你输入的内容将重复 80 次。如果你想生成一行星号，可以输入 `80*`。


    你能看到 `vi` 是比 `nano` 多强大的吗？


    ### 删除文本


    - `x` - 删除一个字符。

    - `dw` - 删除一个单词。要删除五个单词，输入 `5w`。在 `vi` 中的重复概念出现在很多地方。

    - `dd` - 删除一行。要删除三行，输入 `3dd`。

    - `D` - 从当前位置删除到行尾。


    ### 修改文本


    - `r` - 替换当前字符。

    - `cw` - 修改当前单词。

    - `cc` - 修改当前行。

    - `c$` - 从当前位置修改到行尾。

    - `C` - 与 `c$` 相同。

    - `~` - 反转字符大小。


    ### 复制与粘贴


    - `yy` - 复制（拷贝）当前行。

    - `y<position>` - 复制 `<position>`。例如，复制一个单词输入 `yw`。复制三个单词输入 `y3w`。

    - `p` - 粘贴最近删除的或复制的文本。


    ### 撤销 / 重做


    - `u` - 撤销。


    - `Ctrl-r` - 重做。


    ### 搜索


    - `/<pattern>` - 正向搜索 `<pattern>`。

    - `?<pattern>` - 反向搜索 `<pattern>`。


    ### 教程


    从命令行运行 `vimtutor` 开始 vim 教程。


    ## Emacs


    `Emacs` 是另一个强大的编辑器。有些人真的发现自己迷上了 `vi`，而另一些人非常喜欢使用 `emacs`。在 Linux 世界中这像是一种竞争。尝试
    `emacs` 和 `vi` 看看哪一个更适合你。你不会选错，它们都是优秀的编辑器。


    `emacs [file]` - 编辑文件。


    阅读 `emacs` 文档时，知道 `C-<char>` 表示按下 `Ctrl` 键的同时按下 `<char>`。例如，`C-h` 表示按下 `Ctrl`
    键的同时按下 `h` 键。如果你看到 `C-h t`，意味着按下 `Ctrl` 键并按下 `h`，释放 `Ctrl` 然后输入字母 `t`。


    当你看到 `M-<char>`，意味着按下“元”键（即 `Alt` 键）的同时按下 `<char>`。你可以用 `Esc` 键替换 `Alt` 键。`M-f`
    翻译为按下 `Alt` 键，按下并释放 `Esc`，然后输入 `f` 键。你可能需要使用 `Esc` 作为元键，因为 `Alt` 可能会被终端程序拦截。如果你想简化操作，始终使用
    `Esc` 作为元键，因为它在所有情况下都有效。


    是一些实用的 `emacs` 命令。


    - `C-h` - 帮助。

    - `C-x C-c` - 退出。按住 `Ctrl`，按下 `x`，继续按住 `Ctrl`，按下 `c`。

    - `C-x C-s` - 保存文件。

    - `C-h t` - Emacs 有一个很好的内置教程。

    - `C-h k <key>` - 描述键。用此来获取特定键命令或键组合的帮助。


    ### 导航


    - `C-p` - 上一行。

    - `C-n` - 下一行。

    - `C-b` - 向后移动一个字符。

    - `C-f` -向前移动一个字符。

    - `M-f` - 向前一个单词。

    - `M-b` - 向后一个单词。

    - `C-a` - 到行首。

    - `C-e` - 到行尾。

    - `M-<` - 到文件开头。

    - `M->` - 到文件结尾。


    ### 删除文本


    - `C-d` - 删除一个字符。

    - `M-d` - 删除一个单词。


    ### 复制与粘贴


    - `C-k` - 剪切（杀掉）当前行的剩余文本。要剪掉整行，将光标置于行首。

    - `C-y` - 从之前剪切的文本中恢复（粘贴）。

    - `C-x u` - 撤销。重复操作实现多级撤销。


    ### 搜索


    - `C-s` - 开始正向搜索。输入你要查找的文本。再次按下 `C-s` 移动到下一个匹配项。完成后按下 `Enter`。

    - `C-r` - 开始反向搜索。


    ### 重复


    像 `vi` 一样，emacs 提供了一种重复命令的方法。


    `C-u N <command>` - 重复 `<command>` `N` 次。


    例如，删除三行文本，输入 `Ctrl-U 3 Ctrl-k`。


    ![](img/00005.jpeg)


    你对 `vi` 和 `emacs` 编辑器的了解只是触山一角。如果你感兴趣，还有许多内容可以学习。这两个编辑器都包含宏、全局替换等功能。针对每种编辑器都写了整整本书。


    ### 图形化编辑器


    到为止，你学习的是适用于通过 ssh 连接到服务器时使用的命令行编辑器。但如果你将 Linux 作为桌面操作系统运行，你可能对一些图形文本编辑器和文字处理器感兴趣。这里是一些供你参考的。


    `emacs` - Emacs 也有图形模式。


