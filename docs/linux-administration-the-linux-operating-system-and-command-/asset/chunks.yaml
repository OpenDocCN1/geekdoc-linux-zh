    \ to a more meaningful variable name.\n\n```bash\n#!/bin/bash\n\nUSER=$1 # The\
    \ first parameter is the user.\n\necho “Executing script: $0”\n\necho “Archiving\
    \ user: $USER”\n\n# Lock the account\n\npasswd -l $USER\n\n# Create an archive\
    \ of the home directory.\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n```\n\
    \nThe output remains the same.\n\n```bash\n$ ./archive_user.sh elvis\n\nExecuting\
    \ script: ./archive_user.sh\n\nArchiving user: elvis\n\npasswd: password expiry\
    \ information changed.\ntar: Removing leading `/’ from member names\n$\n```\n\n\
    You can access all the positional parameters starting at `$1` to the very last\
    \ one on the command line by using the special variable `$@`. Here is how to update\
    \ the `archive_user.sh` script to accept one or more parameters.\n\n```bash\n\
    #!/bin/bash\n\necho “Executing script: $0”\n\nfor USER in $@\n\ndo\n\necho “Archiving\
    \ user: $USER”\n\n# Lock the account\n\npasswd -l $USER\n\n# Create an archive\
    \ of the home directory.\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n\n\
