    在历史上，运行级别（runlevels）由 `init` 程序控制。`init` 的配置存储在 `/etc/inittab` 中。要使用 `init` 更改默认运行级别，你需要编辑
    `/etc/inittab` 文件，并在 `initdefault` 行上设置运行级别数字。以下是一个将运行级别 3 设置为默认运行级别的示例。


    ```

    id:3:initdefault:

    ```


    然而，`init` 的备选方案（如 `systemd` 和 `upstart`）正在迅速取代 `init`，其中 `systemd` 是目前应用最广泛的替代者。


    `systemd` 并没有使用运行级别，而是使用了“目标（targets）”的概念。这些目标大致等同于运行级别。要查看可用目标的列表，请查看 `/lib/systemd/system`
    目录。你会发现运行级别目标实际上是向正在使用的真实软链接。例如，`runlevel5.target` 是 `graphical.target` 的软链接。


    ```bash

    cd /lib/systemd/system

    ls -l runlevel*target


    lrwxrwxrwx. 1 root root 15 Jul 17 2014 runlevel0.target -> poweroff.target

    lrwxrwxrwx. 1 root root 13 Jul 17 2014 runlevel1.target -> rescue.target

    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel2.target -> multi-user.target

    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel3.target -> multi-user.target

    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel4.target -> multi-user.target

    lrwxrwxrwx. 1 root root 16 Jul 17 2014 runlevel5.target -> graphical.target

    lrwxrwxrwx. 1 root root 13 Jul 17 2014 runlevel6.target -> reboot.target

    ```


    要使用 `systemd` 更改默认运行级别或目标，请使用 `systemctl` 命令后跟 `set-default`，最后是所需的目标。可选，你也可以手动从
    `/etc/systemd/system/default.target` 文件创建一个指向所需目标的软链接。此示例将默认目标设置为图形，等同于运行级别 5。


    ```bash

    set-default multi-user.target

    rm ‘/etc/systemd/system/default.target’

    ln -s ‘/usr/lib/systemd/system/multi-user.target’ ‘/etc/systemd/system/default.target’

    ```


    ## 更改运行级别或目标


    在 `init` 系统中，你可以使用 `telinit` 命令更改运行级别。只需将你想要更改的运行级别作为 `telinit` 命令的参数提供。


    ```bash

    telinit 5

    ```


    要更改目标（即 `systemd` 中等同于运行级别的的概念），请使用 `systemctl` 命令后跟 `isolate`，最后是所需的目标。以下是切换到图形目标的方法。


    ```bash

    systemctl isolate graphical.target

    ```


    ## 重启系统


    尽管在使用 `systemd` 时有运行级别/目标，但在重启时，你也可以使用 `reboot` 或 `shutdown` 命令。


    以下是使用 `init` 重启的方法。


    ```bash

    telinit 6

    ```


    使用 `systemd` 重启请使用 `systemctl` 命令。


    ```bash

    systemctl isolate reboot.target

    ```


    使用 `reboot` 命令重启只需执行 `reboot`。


    ```bash

    reboot

    ```


    `shutdown` 命令的格式如下。


    ```

    shutdown [options] time [message]

    ```


    告诉 `shutdown` 执行重启的选项是 `-r`。你可以使用“HH:MM”格式指定关机时间。你也可以使用 `+N`，其中 `N` 代表在执行操作之前等待的分钟数。最后，你可以使用
    `now` 关键字立即启动。可选，你可以指定一条将广播到所有登录系统用户的消息。


    ```bash

    shutdown -r now

    ```


    ## 关机系统


    要关机系统，请使用运行级别 0、`poweroff` 目标或 `poweroff` 命令。


    以下是使用 `init` 发出关机指令。


    ```bash

    telinit 0

    ```


    以下是使用 `systemctl` 关机的方法。


    ```bash

    systemctl isolate poweroff.target

    ```


    最后，你可以使用 `poweroff` 命令。


    ```

    poweroff

    ```


    ## 总结


    在本章中，你学习了 Linux 启动过程。你学习了 `BIOS` 的工作是执行基本的硬件检查并从可启动设备启动引导加载程序。你还学习了两种常用的引导加载程序，`LILO`
    和 `Grub`。任何引导加载程序的主要工作都是启动操作系统。


    你还学习了启动 Linux 系统所需的文件存储在 `/boot` 目录中。初始内存磁盘 `initrd` 是加载到内存中的临时文件系统。它的主要工作是挂载存储操作系统的文件系统。Linux
    内核通常命名为 `vmlinux`，或者如果经过压缩，则是 `vmlinuz`。


    你学习了如何使用 `dmesg` 命令或通过检查 `/var/log/` 来查看内核环形缓冲区中的消息。


    你学习了在在使用 `systemd` 时，对于重启，仍有运行级别/目标。你学习了 `BIOS` 的工作是执行基本的硬件检查并从可启动设备启动引导加载程序。你还学习了两种常用的引导加载程序，`LILO`
    和 `Grub`。任何引导加载程序的主要工作都是启动操作系统。


    你还学习了启动 Linux 系统所需的文件存储在 `/boot` 目录中。初始内存磁盘 `initrd` 是加载到内存中的临时文件系统。它的主要工作是挂载存储操作系统的文件系统。Linux
    内核通常命名为 `vmlinux`，或者如果经过压缩，则是 `vmlinuz`。


    你学习了如何使用 `dmesg` 命令或通过检查 `/var/log/` 来查看内核环形缓冲区中的消息。


    你学习了在在使用 `systemd` 时，对于重启，仍有运行级别/目标。


