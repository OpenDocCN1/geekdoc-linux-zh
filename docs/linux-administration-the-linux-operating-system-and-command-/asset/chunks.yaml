    ## 进程优先级与 Nice 值 (Niceness)


    Linux 系统上的所有进程都分配有一个 nice 值（niceness value）。nice 值的范围从 -20 到 19，其中 -20 优先级最高，19
    优先级最低。优先级进程会被调度更频繁地运行。你可以将高 nice 值的进程理解为对低 nice 值的进程比较“友善”。例如，nice 值为 10 的进程会对优先级为
    0 的进程保持“友善”，允许其以更高的优先级运行。nice 值为 0 的进程将获得比 nice 值为 10 的进程更多的 CPU 时间。


