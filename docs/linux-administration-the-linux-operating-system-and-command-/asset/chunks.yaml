    ## Creating Swap Space


    Instead of creating a file system and mounting it, with swap you create a swap
    area and enable it. To prepare the swap partition for use, use the `mkswap` command
    followed by the path to the partition. To enable the swap partition, use the `swapon`
    command followed by the path to the device. To see the swap devices in use, run
    `swapon -s`.


    # `mkswap /dev/sdb1`


