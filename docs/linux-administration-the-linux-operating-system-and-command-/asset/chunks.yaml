  trans: '


    要显示当前运行的进程，请使用 `ps` 命令。如果没有指定选项，`ps` 将显示与你当前会话相关的进程。要查看所有进程（包括不属于你的进程），使用 `ps
    -e`。要查看特定用户运行的进程，使用 `ps -u username`。


    ### `ps` - 显示进程状态


    #### 常用 `ps` 选项：

    - `-e` - 所有，所有进程。

    - `-f` - 完整格式列表。

    - `-u username` - 显示以 `username` 用户运行的进程。

    - `-ppid` - 显示 `pid` 的进程信息。`PID` 是进程 ID。


    #### 常用 `ps` 命令：

    - `ps -e` - 显示所有进程。

    - `ps -ef` - 以完整格式显示所有进程。

    - `ps -eH` - 显示进程树。

    - `ps -e --forest` - 显示进程树。

    - `ps -u username` - 显示以 `username` 用户运行的进程。


    ```

    $ ps

    PID TTY TIME CMD

    19511 pts/2 00:00:00 bash

    19554 pts/2 00:00:00 ps


    $ ps -p 19511

    PID TTY TIME CMD

    19511 pts/2 00:00:00 bash


    $ ps -f

    UID PID PPID C STIME TTY TIME CMD

    bob 19511 19509 0 16:50 pts/2 00:00:00 -bash

    bob 19556 19511 0 16:50 pts/2 00:00:00 ps -f


    $ ps -e | head

    PID TTY TIME CMD

    1 ? 00:00:02 init

    2 ? 00:00:00 kthreadd

    3 ? 00:00:19 ksoftirqd/0

    5 ? 00:00:00 kworker/0:0H

    7 ? 00:00:00 migration/0

    8 ? 00:00:00 rcu_bh

    9 ? 00:00:17 rcu_sched

    10 ? 00:00:12 watchdog/0

    11 ? 00:00:00 khelper


    $ ps -ef | head

    UID PID PPID C STIME TTY TIME CMD

    root 1 0 0 Dec27 ? 00:00:02 /sbin/init

    root 2 0 0 Dec27 ? 00:00:00 [kthreadd]

    root 3 2 0 Dec27 ? 00:00:19 [ksoftirqd/0]

    root 5 2 0 Dec27 ? 00:00:00 [kworker/0:0H]

    root 7 2 0 Dec27 ? 00:00:00 [migration/0]

    root 8 2 0 Dec27 ? 00:00:00 [rcu_bh]

    root 9 2 0 Dec27 ? 00:00:17 [rcu_sched]

    root 10 2 0 Dec27 ? 00:00:12 [watchdog/0]

    root 11 2 0 Dec27 ? 00:00:00 [khelper]


    $ ps -fu www-data

    UID PID PPID C STIME TTY TIME CMD

    www-data 941 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    www-data 942 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    www-data 943 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    ```


    这里是其他允许你查看运行进程的命令：

    - `pstree` - 以树状显示运行中的进程。

    - `top` - 交互式进程查看器。

    - `htop` - 交互式进程查看器。此命令比 `top` 不常见，系统上可能不可用。


    ## 在前台和后台运行进程


    到目前为止，你执行的所有命令都是在前台运行的。当一个命令、进程或程序在前台运行时，在进程退出之前，shell 提示符将不会显示。对于运行时间较长的程序，将它们发送到后台会非常方便。在后台运行的进程仍会执行并完成其任务；但是，它们不会阻止你在
    shell 提示符处输入后续命令。要将进程放入后台，请在命令末尾加上和符号（`&`）。


    - `command &` - 在后台启动命令。

    - `Ctrl-c` - 杀死前台进程。

    - `Ctrl-z` - 挂起前台进程。

    - `bg [%num]` - 将挂起的进程放入后台。

    - `fg [%num]` - 将后台进程调至前台。

    - `kill [%num]` - 通过作业号或 `PID` 杀死进程。

    - `jobs [%num]` - 列出作业。


    ```

    $ ./long-running-program &

    [1] 22686


    $ ps -p 22686

    PID TTY TIME CMD

    19511 pts/2 00:00:00 bash


    $ ps -f

    UID PID PPID C STIME TTY TIME CMD

    bob 19511 19509 0 16:50 pts/2 00:00:00 -bash

    bob 19556 19511 0 16:50 pts/2 00:00:00 ps -f


    $ ps -e | head

    PID TTY TIME CMD

    1 ? 00:00:02 init

    2 ? 00:00:00 kthreadd

    3 ? 00:00:19 ksoftirqd/0

    5 ? 00:00:00 kworker/0:0H

    7 ? 00:00:00 migration/0

    8 ? 00:00:00 rcu_bh

    9 ? 00:00:17 rcu_sched

    10 ? 00:00:12 watchdog/0

    11 ? 00:00:00 khelper


    $ ps -ef | head

    UID PID PPID C STIME TTY TIME CMD

    root 1 0 0 Dec27 ? 00:00:02 /sbin/init

    root 2 0 0 Dec27 ? 00:00:00 [kthreadd]

    root 3 2 0 Dec27 ? 00:00:19 [ksoftirqd/0]

    root 5 2 0 Dec27 ? 00:00:00 [kworker/0:0H]

    root 7 2 0 Dec27 ? 00:00:00 [migration/0]

    root 8 2 0 Dec27 ? 00:00:00 [rcu_bh]

    root 9 2 0 Dec27 ? 00:00:17 [rcu_sched]

    root 10 2 0 Dec27 ? 00:00:12 [watchdog/0]

    root 11 2 0 Dec27 ? 00:00:00 [khelper]


    $ ps -fu www-data

    UID PID PPID C STIME TTY TIME CMD

    www-data 941 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    www-data 942 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    www-data 943 938 0 Dec27 ? 00:00:00 /usr/sbin/apache2 -k start

    ```


    当命令放入后台时，会显示两个数字。括号中的数字是作业号，可以使用百分号（`%`）引用。第二个数字是 `PID`。以下是在后台启动多个进程的情况：


    ```

    $ ./long-running-program &

    [1] 22686


    $ ps -p 22686

    PID TTY TIME CMD

    22686 pts/2 00:00:00 bash


    $ jobs

    [1]+ Running ./long-running-program &


    $ fg

    ./long-running-program

    ```


    加号（`+`）代表当前作业，减号（`-`）代表上一个作业。当前作业被视为在前台运行时停止的作业，或者是在后台启动的最后一个作业。如果没有提供作业信息给 `fg`
    或 `bg`，则操作的是当前作业。上一个作业可以通过 `%-` 引用。你会注意到作业 1 和 2 被报告为已完成（done）。shell 不中断你的当前命令行，但在显示新提示符之前报告作业状态。例如，如果你在后台启动程序，会返回提示符。你可以通过按回车请求显示新的提示符。要将作业调回前台，输入作业名称或使用
    `fg`。将当前作业调至前台，执行 `fg %`、`fg %+` 或 `fg %num`。将作业 3 调至前台，执行 `fg3` 或 `fg %3`。


    ```

    $ jobs

    [3]- Running ./long-running-program &

    [4]+ Running ./long-running-program &


    $ fg %3

    ./long-running-program

    ```


    要暂停或挂起在前台运行的作业，输入 `Ctrl-z`。作业挂起后在前台或后台恢复。要将挂起的作业放入后台，输入作业名称后加上和符号或通过作业名称使用 `bg`。


    ```

    $ jobs

    [1] Running ./long-running-program &

    [2]- Running ./long-running-program &

    [3]+ Running ./another-program &


    $ fg

    ./another-program

    ^Z


    $ jobs

    [1] Running ./long-running-program &

    [2]- Running ./long-running-program &

    [3]+ Stopped ./another-program


    $ bg %3

    [3]+ ./another-program &


    $ jobs

    [1] Running ./long-running-program &

    [2]- Running ./long-running-program &

    [3]+ Running ./another-program &

    ```


    你可以使用 `kill` 命令停止或杀死后台作业。例如，要杀死作业 1，执行 `kill %1`。要杀死在前台运行的任务，输入 `Ctrl-c`。


    ```

    $ jobs

    [1] Running ./long-running-program &

    [2]- Running ./long-running-program &

    [3]+ Running ./another-program &


    $ kill %1

    [1] Terminated ./long-running-program


    $ jobs

    [2]- Running ./long-running-program &

    [3]+ Running ./another-program &


    $ fg %2

    ./long-running-program

    ^C

    ```


    ## 杀死进程


    - `Ctrl-c` - 杀死前台进程。

    - `kill [signal] pid` - 向进程发送信号。

    - `kill -l` - 显示信号列表。


    `kill` 使用的默认信号是终止（termination）。你会看到该信号被称为 `SIGTERM` 或简称 `TERM`。信号数字与其名称对应。默认的
    `TERM` 信号数字为 15，因此 `kill pid`、`kill -15 pid` 和 `kill -TERM pid` 都是等价的。如果进程在发送
    `TERM` 信号后没有终止，请使用数字为 9 的 `KILL` 信号。


    ```

    $ ps | grep hard-to-stop

    27398 pts/1 00:00:00 hard-to-stop


    $ kill 27398

    $ ps | grep hard-to-stop

    27398 pts/1 00:00:00 hard-to-stop


    $ kill -9 27398

    $ ps | grep hard-to-stop

    ```


    与其运行 `ps` 命令并将其输出传递给 `grep` 命令，你可以使用 `pgrep` 命令，它是专门为此目的设计的。它会打印匹配你提供的搜索模式的命令的
    `PID`。


    `pgrep [options] search_pattern`


    让我们使用 `pgrep` 来确定 `crond` 进程的 `PID`。


    ```

    $ pgrep crond

    13813


    $ ps -fp 13813

    UID PID PPID C STIME TTY TIME CMD

    root 13813 1 0 20:47 ? 00:00:00 /usr/sbin/crond -n

    ```


    如果存在多个匹配，将返回每个匹配项的 `PID`。在这个示例中，我们正在搜索“nd”，它恰好匹配 `crond` 和 `systemd-logind`。


    ```

    $ pgrep nd

    13813

    13949


    $ ps -fp 13813 13949

    UID PID PPID C STIME TTY STAT TIME CMD

    root 13813 1 0 20:47 ? Ss 0:00 /usr/sbin/crond -n

    root 13949 1 0 20:47 ? Ss 0:00 /usr/lib/systemd/systemd-logind

    ```


    如果你想执行精确匹配，请使用 `-x` 选项。这个示例证明了“nd”没有精确匹配任何进程，因此没有返回 `PID`。然而，搜索“crond”确实精确匹配一个进程。


    '
- fmt: '

    ```bash

    $ pgrep -x nd


    $ pgrep -x crond


    13813


    $ ps -fp 13813


    UID PID PPID C STIME TTY TIME CMD

    root 13813 1 0 20:47 ? 00:00:00 /usr/sbin/crond -n

    ```


    The `pkill` command acts in much the same was was the `pgrep` command, except
    it sends the `TERM` signal to the matching processes by default. You can send
    a different signal in the same manner as the `kill` command. This example kills
    the `crond` process. We use the `pgrep` command to ensure the process is indeed
    killed.


    ```bash

    # pkill crond

    # pgrep crond

    ```


    You can also kill a process by name with the `killall` command. The `killall`
    command is similar to the `kill` and `pkill` commands.


    ```bash

    killall [options] process_name

    ```


    For example, to kill all the `httpd` process, run this command.


    ```bash

    # killall httpd

    ```


    If the `httpd` processes didn’t die, you can use the `KILL` signal as we did in
    a previous example.


    ```bash

    # killall -9 httpd

    ```


    You can also use the `killall` command to kill all the processes for a given user
    by using the `-u` option followed by the username. A normal user cannot kill another
    user’s processes. The only exception is for the superuser, the `root` account.
    `Root` can kill anyone’s processes on a system. This is an example of using the
    `root` account to kill all of the processes that are being executed by the user
    `john`.


    ```bash

    # killall -u john

    ```


    To show when a process gets killed by the `kill` command, use the `-v` option.


    ```bash

    # killall -vu john

    Killed bash(624) with signal 15

    ```


    ## Process Priorities and Niceness


    All processes on a Linux system are assigned a niceness value. The niceness value
    ranges from -20 to 19, with -20 being the highest priorty and 19 being the lowest
    priority. Processes with higher priority get scheduled to run more often. You
    can think of processes with higher niceness numeric values as being nice to the
    processes that have lower niceness numeric values. For example, a process with
    a niceness of 10 will be “nice” to a process with a priorty of 0 and allow it
    to run at a higher priority. The process with the niceness of 0 will get more
    CPU time than the process with the niceness of 10.


    To view the niceness value of a given process, use the `-l` option of the `ps`
    command. The niceness value is listed in the `NI` column. In this example, the
    niceness value is 0 for both processes shown.


    ```bash

    $ ps -l

    F S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD

    0 S 1000 1972 1971 0 80 0 - 28838 wait pts/0 00:00:00 bash

    0 R 1000 22893 1972 0 80 0 - 30319 - pts/0 00:00:00 ps

    ```


    You can also give `ps` a format to use with the `-o` option followed by a comma
    separated list of columns you would like to display. This command displays the
    `PID`, the niceness, and the command.


    ```bash

    $ ps -o pid,nice,cmd

    PID NI CMD

    1972 0 -bash

    22922 0 ps -o pid,nice,cmd

    ```


    Additionally, you can also use the `top` command to view the niceness of processes.
    Like the `ps` command, the niceness value is listed in the `NI` column.


    ```text

    top - 22:25:27 up 2:55, 1 user, load average: 0.00, 0.01, 0.05

    Tasks: 82 total, 2 running, 80 sleeping, 0 stopped, 0 zombie

    %Cpu(s): 0.0 us, 0.0 sy, 0.0 ni,100.0 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st

    KiB Mem : 1018256 total, 272180 free, 114936 used, 631140 buff/cache

    KiB Swap: 2048576 total, 2048576 free, 0 used

    ```


