  trans: '

    作为系统管理员，你可以决定使用何种分区方案。例如，你可以使用四个分区：分配一个分区用于操作系统数据，另一个分区用于应用程序数据，再分配一个用于用户数据，最后设置一个专门用于交换空间（swap
    space）的分区。另一种方案是简单地使用两个分区，并将用户的家目录与系统的其余部分隔离开。


    使用独立的分区是防止系统某部分对另一部分产生不利影响的方法。例如，为用户家目录设置专用分区，可以防止用户填满整个磁盘并干扰操作系统的正常运行。尽管某个用户（或一组用户）可能会耗尽分配给家目录的存储空间并导致其他用户无法使用更多空间，操作系统以及任何正在运行的应用程序仍然能够正常运行。如果该系统托管着网站，操作系统以及
    Web 服务器将继续运行，从而避免了服务中断。


    ## MBR 分区方案


    `MBR`，即主引导记录（master boot record），是位于存储设备开头的引导扇区。存储在 `MBR` 中的分区表包含了逻辑分区在磁盘上组织方式的信息。由于
    `MBR` 中的分区表只能寻址最高达 2 TB 的存储空间，它正在被 `GUID 分区表 (GPT)` 所取代。


    `MBR` 分区方案允许最多创建四个主分区。如果你想创建四个以上的分区，则需要使用扩展分区（extended partition）。扩展分区是一种特殊的主分区，用作其他分区的容器。这允许你创建无限数量的逻辑分区。


    ## GUID 分区表 (GPT)


    `GUID`（全局唯一标识符）分区表，简称为 `GPT`，正在取代旧的 `MBR` 分区系统。它是统一可扩展固件接口（UEFI）标准的一部分。`UEFI`
    正在取代传统的 `BIOS`；然而，由于 `MBR` 分区表的磁盘大小限制，`GPT` 已在某些 `BIOS` 系统上使用。


    `GPT` 中没有主分区和扩展分区之分。使用默认配置，`GPT` 支持多达 128 个分区。此外，`GPT` 支持高达 9.4 ZB 的存储设备。`GPT`
    的主要缺点是它不支持旧的操作系统。此外，你需要使用支持 `GPT` 的较新分区工具。


    ## 挂载点


    挂载点（mount point）简单来说用于访问分区上数据的目录。至少会有一个分区挂载在 `/` 挂载点。任何额外的分区将挂载在目录树中 `/` 下的挂载点。例如，如果你为用户家目录分配了一个分区，该分区将挂载在
    `/home`。位于 `/home` 挂载点或其下的文件和目录将位于该分区。例如，我的家目录 `/home/jason` 中的文件将位于挂载在 `/home`
    的分区上。


    如果你断开（或卸载）该分区并将其挂载到另一个目录（挂载点），所有数据都将在新挂载点处可用。如果卸载了 `/home` 然后将该分区挂载到 `/export/home`，那么我家目录中的文件将通过
    `/export/home/jason` 可访问。


    需要指出，你可以将分区挂载到现有数据之上。例如，如果在挂载 `/home` 之前在 `/home` 中创建了文件，这些文件将无法访问。假设你只挂载了 `/`
    分区，并在 `/home/sarah` 为 Sarah 创建了家目录。`/home/sarah` 目录位于挂载在 `/` 上的分区上。如果你随后在 `/home`
    上挂载另一个分区，你将无法访问 `/home/sarah` 目录。`/home/sarah` 的数据仍然存在，但它位于与 `/` 相关的分区上。一旦你卸载了
    `/home`，你就会发现 `/home/sarah` 仍然存在。


    你可以在 Linux 目录树的任何地方挂载分区。你甚至可以位于其他已挂载分区上的挂载点。假设你有一个挂载在 `/home` 的分区。你可以在 `/home/jason`
    上再次挂载另一个分区。确保 `/home` 在 `/home/jason` 之前挂载很重要。在本章后面，你将学习如何将分区与挂载点关联，以及控制分区挂载的顺序。


    ## 创建分区


    在执行交互式 Linux 安装时，你很可能会使用由 Linux 发行版提供的分区工具。然而，如果你想在初始安装后操作磁盘，你很可能需要使用标准的 Linux
    工具。`fdisk` 工具传统上被用于创建和修改磁盘上的分区，但还有其他可行的替代方案包括 `gdisk` 和 `parted`。早期版本的 `fdisk`
    缺乏对 `GPT` 的支持，但截至本文编写时，`fdisk` 已支持 `GPT`。使用 `fdisk` 管理磁盘上的分区，只需将要管理的设备路径作为参数提供给命令即可。


    ### `fdisk /dev/sdb`


    ```

    Welcome to fdisk (util-linux 2.23.2).


    Changes 将仅留在内存中，直到你决定写入它们。


    在使用 write 命令前请要小心。


    Device does not contain a recognized partition table


    Building a new DOS disklabel with disk identifier 0x1c0ae930.


    Command (m for help): q


    #

    ```


    如果你不确定哪些磁盘可用，运行 `fdisk -l` 显示设备列表。这台服务器有两个磁盘。第一个磁盘 `/dev/sda` 已经分区，第二个磁盘 `/dev/sdb`
    尚未分区。


