    Instead of keeping files in the home directories of various team members, it is
    easier to keep them in a location dedicated to the team. For example, you could
    ask the system administrator of the server to create a `/usr/local/sales` directory.
    The group should be set to `sales` and the permissions should be set to `775`
    (rwxrwxr-x) or `770` (rwxrwx—-). Use `770` (rwxrwx--) if no one outside the sales
    team needs access to any files, directories, or programs located in `/usr/local/sales`.


    ```bash

    $ ls -ld /usr/local/sales

    drwxrwxr-x 2 root sales 4096 Dec 4 20:53 /usr/local/sales

    $ mv sales.report /usr/local/sales/

    $ ls -l /usr/local/sales

    total 4

    -rw-rw-r— 1 bob sales 6 Dec 4 20:41 sales.report

    ```


    ## Directory Permissions Revisited


    This example demonstrates how permissions affect directories and their contents.
    A common problem is having proper permissions set on a file within a directory
    only to have the incorrect permissions on the directory itself. Not having the
    correct permissions on a directory can prevent the execution of the file, for
    example. If you are sure a file’s permissions have been set correctly, look at
    the parent directory. Work your way toward the root of the directory tree by running
    `ls -ld .` in the current directory, moving up to the parent directory with `cd
    ..`, and repeating those two steps until you find the problem.


    ```bash

    $ ls -dl directory/

    drwxr-xr-x 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    total 0

    -rwxr—r— 1 bob users 0 Sep 29 22:02 testprog

    $ chmod 400 directory

    $ ls -dl directory/

    dr––— 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    ls: cannot access directory/testprog: Permission denied

    total 0

    -????????? ? ? ? ? ? test testprog

    $ directory/testprog

    su: directory/testprog: Permission denied

    $ chmod 500 directory/

    $ ls -dl directory/

    dr-x–– 2 bob users 4096 Sep 29 22:02 directory/

    $ ls -l directory/

    total 0

    -rwxr—r— 1 bob users 0 Sep 29 22:02 testprog

    $ directory/testprog

    This program ran successfully.

    ```


    ## Default Permissions and the File Creation Mask


    The file creation mask is what determines the permissions a file will be assigned
    upon its creation. The mask restricts or masks permissions, thus determining the
    ultimate permission a file or directory will be given. If no mask were present,
    directories would be created with `777` (rwxrwxrwx) permissions and files would
    be created with `666` (rw-rw-rw-) permissions. The mask can and is typically set
    by the system administrator, but it can be overridden on a per account basis by
    including a `umask` statement in your personal initialization files.


    `umask [-S] [mode]` - Sets the file creation mask to `mode` if specified. If `mode`
    is omitted, the current mode will be displayed. Using `-S` argument allows `umask`
    to display or set the `mode` with symbolic notation.


    The mode supplied to `umask` works in the opposite way as the mode given to `chmod`.
    When you supply `7`, it is interpreted to mean all permissions on, `rwx`. When
    you supply `0`, it is interpreted to mean all permissions off, `-`. Think of `chmod`
    as turning on, adding, or giving permissions. Think of `umask` as turning off,
    taking away permissions.


    A quick way to estimate what `umask` mode will do to the default permissions is
    to subtract octal `umask` mode from `777` in the case of directories and `666`
    in the case of files. Here is an example of `umask 022`, which is typically the
    default `umask` used by Linux distributions or set by system administrators.


    | | Base Permission | Minus Umask | Creation Permission |

    | :--- | :--- | :--- | :--- |

    | Dir | 777 | -022 | 755 |

    | File | 666 | -022 | 644 |


    Using `umask` of `002` is ideal for working with members of your group. You will
    see that when files or directories are created, the permissions allow members
    of the group to manipulate those files and directories.


    | | Base Permission | Minus Umask | Creation Permission |

    | :--- | :--- | :--- | :--- |

    | Dir | 777 | -002 | 775 |

    | File | 666 | -002 | 664 |


    Here is another possible `umask` to use for working with members of your group.
    Use `007` so that no permissions are granted to users outside of the group.


    | | Base Permission | Minus Umask | Creation Permission |

    | :--- | :--- | :--- | :--- |

    | Dir | 777 | -007 | 770 |

    | File | 666 | -007 | 660 |


    Again, using this octal method is a good estimation. You can see that the method
    breaks down with `umask` mode of `007`. In reality, to get an accurate result
    each time, you need to convert octal permissions into binary values. From there,
    use a bitwise `NOT` operation on the `umask` mode and then perform a bitwise `AND`
    operation against that and the base permissions. It is fine to gloss over the
    subtleties here since there are only a few practical `umask` modes to use: `022`,
    `002`, and `007`. Save yourself the binary homework and look at the following
    table containing all the resulting permissions created by each of the eight permutations.


    | Octal | Binary | Dir Perms | File Perms |

    | :--- | :--- | :--- | :--- |

    | 0 | 000 | rwx | rw- |

    | 1 | 001 | rw- | rw- |

    | 2 | 010 | r-x | r— |

    | 3 | 011 | r— | r— |

    | 4 | 100 | -wx | -w- |

    | 5 | 101 | -w- | -w- |

    | 6 | 110 | —x | — |

    | 7 | 111 | — | — |


    ## Special Modes


    Look at this output of `umask` when the mask is set to `022`.


    ```bash

    $ umask 022

    ```


    You will notice an extra leading zero. So far, you have only been dealing with
    three characters that represent permissions for user, group, and other. There
    is a class of special modes: `setuid`, `setgid`, and `sticky`. Know that these
    special modes are declared by prepending a character to the octal mode that you
    normally use with `umask` or `chmod`. The important point here is to know that
    `umask 022` is the same as `umask 022`. Also, `chmod 644` is the same as `chmod
    0644`.


    Even though special modes will not be covered in this book, they are included
    here for your reference. There are links at the end of this chapter so you can
    learn more about these modes if you are so inclined.


    - `setuid` permission: Allows a process to run as the owner of the file, not the
    user executing it.

    - `setgid` permission: Allows a process to run with the group of the file, not
    the group of the user executing it.

    - sticky bit: Prevents a user from deleting another user’s files even if they
    would normally have permission to do so.


    ## umask Examples


    Here are two examples of the effects `umask` modes have on file and directory
    creation.


    ```bash

    $ umask 0022

    $ umask -S u=rwx,g=rx,o=rx

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxr-xr-x 2 bob users 4096 Dec 5 00:03 a-dir

    -rw-r—r— 1 bob users 0 Dec 5 00:03 a-file

    $ rmdir a-dir

    $ rm a-file


    $ umask 007

    $ umask 0007

    $ umask -S u=rwx,g=rwx,o=

    $ mkdir a-dir

    $ touch a-file

    $ ls -l

    total 4

    drwxrwx– 2 bob users 4096 Dec 5 00:04 a-dir

    -rw-rw–- 1 bob users 0 Dec 5 00:04 a-file

    ```


    ## Summary


    In this chapter, you learned how to view and manage file and directory permissions.
    You learned about read, write, and execute permissions and how you can assign
    those permissions to users, groups, and others. You learned how to use the `chmod`
    command with symbolic mode as well as octal mode permissions. Next, you learned
    how to work with groups by using the `newgrp` and `chgrp` commands. Finally, you
    learned about the file creation mask and how you can control it with the `umask`
    command.


    ## Resources


    - Every Possible Umask Mode: An article that lists every `umask` mode. http://linuxtrainingacademy.com/all-umasks

    - Linux Permissions Explained Videos: Watch these two videos that explain and
    demonstrate Linux file system permissions. http://www.linuxtrainingacademy.com/perms/

    - Modes: Detailed permission information. https://en.wikipedia.org/wiki/Modes_(Unix)

    - SELlinux: The official SELinux project page. http://selinuxproject.org/

    - Special File Permissions: An article describing setuid, setgid, and the sticky
    bit. http://docs.oracle.com/cd/E19683-01/806-4078/secfiles-69

    - Ubuntu ACL Documentation: This applies not only to Ubuntu, but to other Linux
    distributions as well. http://help.ubuntu.com/community/FilePermissionsACLs


