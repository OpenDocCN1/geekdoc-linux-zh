    ## 创建文件系统


    在 Linux 系统使用分区之前，需要一个文件系统。最初专门为 Linux 创建的 `ext` 扩展系统很快被 `ext2`（第二个扩展系统）取代。之后，`ext3`（第三个扩展系统）和
    `ext4`（第四个扩展系统）被发布。这些是 Linux 上最常用的文件系统，通常作为 Linux 发行版的默认文件系统。如果你有特殊需求，应该研究 Linux
    提供的其他流行文件系统，包括 ReiserFS、`JFS`、`XFS` 和 `Btrfs`。


    要创建文件系统，使用 `mkfs` 命令。格式为 `mkfs -t TYPE DEVICE`。`TYPE` 是如 `ext3`、`btrfs` 等类型。`DEVICE`
    是你希望文件系统所在的分区路径。这里是在 `sdb` 磁盘第二个分区上创建 `ext3` 文件系统的方法。


    ```

    # mkfs -t ext3 /dev/sdb2


