    root 13813 1 0 20:47 ? 00:00:00 /usr/sbin/crond -n


    The pkill command acts in much the same was the pgrep command, except it sends
    the TERM signal to the matching processes by default. You can send a different
    signal in the same manner as the kill command. This example kills the crond process.
    We use the pgrep command to ensure the process is indeed killed.


    # pkill crond


    # pgrep crond


    #


    You can also kill a process by name with the killall command. The killall command
    is similar to the kill and pkill commands.


    killall [options] process_name


    For example, to kill all the httpd process, run this command.


    # killall httpd


    If the httpd processes didn’t die, you can use the KILL signal as we did in a
    previous example.


    # killall -9 httpd


    You can also use the killall command to kill all the processes for a given user
    by using the -u option followed by the username. A normal user cannot kill another
    user’s processes. The only exception is for the superuser, the root account. Root
    can kill anyone’s processes on a system. This is an example of using the root
    account to kill all of the processes that are being executed by the user john.


    # killall -u john


    To show when a process gets killed by the kill command, use the -v option.


    # killall -vu john


    Killed bash(624) with signal 15


    ## Process Priorities and Niceness


    All processes on a Linux system are assigned a niceness value. The niceness value
    ranges from -20 to 19, with -20 being the highest priorty and 19 being the lowest
    priority. Processes with higher priority get scheduled to run more often. You
    can think of processes with higher niceness numeric values as being nice to the
    processes that have lower niceness numeric values. For example, a process with
    a niceness of 10 will be “nice” to a process with a priorty of 0 and allow it
    to run at a higher priority. The process with the niceness of 0 will get more
    CPU time than the process with the niceness of 10.


    To view the niceness value of a given process, use the -l option of the ps command.
    The niceness value is listed in the NI column. In this example, the niceness value
    is 0 for both processes shown.


    $ ps -l


    F S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD


    0 S 1000 1972 1971 0 80 0 - 28838 wait pts/0 00:00:00 bash


    0 R 1000 22893 1972 0 80 0 - 30319 - pts/0 00:00:00 ps


    You can also give ps a format to use with the -o option followed by a comma separated
    list of columns you would like to display. This command displays the PID, the
    niceness, and the command.


    $ ps -o pid,nice,cmd


    PID NI CMD


    1972 0 -bash


    22922 0 ps -o pid,nice,cmd


    Additionally, you can also use the top command to view the niceness of processes.
    Like the ps command, the niceness value is listed in the NI column.


    top - 22:25:27 up 2:55, 1 user, load average: 0.00, 0.01, 0.05


    Tasks: 82 total, 2 running, 80 sleeping, 0 stopped, 0 zombie


    %Cpu(s): 0.0 us, 0.0 sy, 0.0 ni,100.0 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st


    KiB Mem : 1018256 total, 272180 free, 114936 used, 631140 buff/cache


    KiB Swap: 2047996 total, 2047988 free, 8 used. 721392 avail Mem


    PID USER PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND


    1 root 20 0 54180 3900 2412 S 0.0 0.4 0:00.90 systemd


    2 root 20 0 0 0 0 S 0.0 0.0 0:00.00 kthreadd


    3 root 20 0 0 0 0 S 0.0 0.0 0:00.30 ksoftirqd/0


    5 root 0 -20 0 0 0 S 0.0 0.0 0:00.00 kworker/0:0H


    6 root 20 0 0 0 0 S 0.0 0.0 0:00.11 kworker/u2:0


    7 root rt 0 0 0 0 S 0.0 0.0 0:00.00 migration/0


    To view the default niceness value, use the nice command without any arguments.
    Typcially, the default niceness value for normal users is 0.


    $ nice


    0


    $


    To start a process, or program, with a different niceness level, run nice -n ADJUSTMENT
    COMMAND. Let’s assume you want to convert a very large video file from one format
    to another. This type of process will be very CPU intensive. You don’t want this
    process to make your Linux system unresponsive because you are currently using
    it for other, more important tasks. Additionally, you are not concerned with the
    amount of time it takes to convert the video. You can start this process at a
    lower priority by running the following command.


    $ nice -n 10 avconv -i movie.avi movie.mp4


    Since the default nicencess value is 0 and an offset of 10 was applied, the niceness
    value of the process will be 10\. Let’s check the niceness of this process with
    the ps command.


    $ ps -o pid,nice,cmd


    1394 0 /bin/bash


    3815 10 avconv -I movie.avi movie.mp4


    What if you want to change the niceness of a process that is already running?
    Use the renice command, supplying the new niceness value after -n and end the
    command with the PID of the process you are altering. Let’s change the niceness
    value to the lowest priorty with this command.


    $ renice -n 19 3815


    3815 (process ID) old priority 10, new priority 19


    If you attempt to lower the niceness value, you will get a permission denied error.
    This is because only the superuser can set the niceness value to a lower number,
    giving a process a higher priority than it currently has. Said another way, normal
    users can only make their processes nicer.


    $ renice -n 0 3815


    renice: failed to set priority for 3815 (process ID): Permission denied


    $ su -


    Password:


    # renice -n 0 3815


    3815 (process ID) old priority 19, new priority 0


    ## Processes and Disconnecting from Your Session


    When you log out of a Linux system, all of your processes associated with that
    session are sent the SIGHUP, or hangup, signal. This effectively kills all of
    the processes associated with your session. If you want to leave a process running
    after you log out, you can use the nohup command. The nohup command will ignore
    the SIGHUP signal, allowing the process to continue running.


    nohup COMMAND [command_arguments]


    The output generated by the command supplied to nohup will be saved in a file
    called nohup.out, located in the directory in which you started the process. To
    save the output to a different file, use redirection.


    Typically, the nohup command is used to background a process. This example starts
    a shell script called do-backup.sh in the background with the nohup command. If
    you log out and log back in again, you can see that the process is still running
    and the output is being sent to the nohup.out file.


    $ nohup do-backup.sh &


    [1] 23364


    nohup: ignoring input and appending output to ‘nohup.out’


    $ exit


    Connection to linuxsvr closed


    $ ssh linuxsvr


    $ ps -fp 23364


    UI PID PPID C STIME TTY TIME CMD


    jason 23364 1 0 18:31 ? 00:00:00 do-backup.sh


    $ cat nohup.out


    Apr 5 18:34:20 - Creating backup.


    $


    If we wanted to redirect the output to a file other than nohup.out, we would use
    the greater-than sign followed by a file.


    $ nohup do-backup.sh > /var/tmp/backup.log &


    [1] 23401


    nohup: ignoring input and redirecting stderr to stdout


    $ cat /var/tmp/backup.log


    Apr 5 18:37:24 - Creating backup.


    $


    You can also use a terminal multiplexer to accomplish the same task. The two most
    popular terminal multiplexers are GNU Screen and tmux. To leave processes running
    in the background, first start the terminal multiplexer program. Next, start the
    process you would like to keep running after you log out. Finally, detach from
    your terminal multiplexer. When you log out, the terminal multiplexer and all
    of its child processes are still running. You can then come back at a later time
    and reattach to the session.'
