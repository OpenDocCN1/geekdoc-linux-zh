    ## Summary


    Account information is stored in the `/etc/passwd` and `/etc/shadow` files. In
    addition to a username, each account consists of a unique number called the UID,
    a default group, a comment, a home directory location, and a login shell.


    Accounts can be created with the `useradd` command. To delete an account, use
    the `userdel` command. To modify an account, use the `usermod` command.


    Group information is stored in the `/etc/group` file. To create a group, use the
    `groupadd` command. You can delete groups by using the `groupdel` command. To
    update an existing group use the `groupmod` command. To list group memberships
    for an account, use the `groups` command.


