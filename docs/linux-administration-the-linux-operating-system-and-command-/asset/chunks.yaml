  trans: "\n\n![](img/cover.jpeg)\n\n# Linux 系统管理\n\nJASON CANNON\n\nCopyright (c)\
    \ 2016 Jason Cannon\n\n保留所有权利。\n\n## 目录\n\n- 绪言\n- 启动\n- 系统日志\n- 磁盘管理\n- 用户与用户组管理\n\
    - 网络\n  - Linux 网络\n  - 网络故障排除\n- 进程管理\n- 文件和目录权限\n- 软件管理\n- 查看和编辑文件\n- Shell\
    \ 脚本编写\n- 结论\n- 关于作者\n- 作者的其它书籍\n- 更多资源\n- 附录：商标\n\n## 作者的其它书籍\n（稍等，检查下方列表）\n\n\
    ## 作者的其它书籍\n\n### Command Line Kung Fu: Bash Scripting Tricks, Linux Shell Programming\
    \ Tips, and Bash One-liners\nhttp://www.linuxtrainingacademy.com/command-line-kung-fu-book\n\
    \n### High Availability for the LAMP Stack: Eliminate Single Points of Failure\
    \ and Increase Uptime for Your Linux, Apache, MySQL, and PHP Based Web Applications\n\
    http://www.linuxtrainingacademy.com/ha-lamp-book\n\n### Linux for Beginners: An\
    \ Introduction to the Linux Operating System and Command Line\nhttp://www.linuxtrainingacademy.com/linux\n\
    \n### Python Programming for Beginners: An Introduction to the Python Computer\
    \ Language and Computer Programming\nhttp://www.linuxtrainingacademy.com/python-programming-for-beginners\n\
    \n# 绪言\n\n在发布我的第一本书*Linux for Beginners*（Linux 入门）后，读者们不断告诉我：“我喜欢 Linux！它为我开启了一个全新的世界，我想学习更多内容。”有些人甚至想将这种新发现的热情转化为\
    \ Linux 专业人员的职业。“接下来是什么？”他们会问我。\n\n我会引导他们去听我的课程之一，或者建议他们去上一个 Linux 系统管理课程。“这很棒，但我接下来应该读哪本书？哪本书是\
    \ Linux 系统管理课程的绝佳伙伴？”我无法给他们一个好的答案。\n\n大多数关于 Linux 系统管理的书籍尽管内容优秀，但由于已经过时了。它们似乎都来自一个\
    \ Linux 更加像 Unix 的时代。即使是最近发布的书籍，也没有涵盖现代 Linux 系统启动和管理系统服务方式的根本性变化。随着时间的推移，每一个新版本的\
    \ Linux 内核发布以及每一个新 Linux 发行版的更新，Linux 看起来越来越不像传统的 Unix 系统。现在，比以往任何时候都，Linux 必须被视为一个独立的实体来对待。\n\
    \n现在当有人问我“我接下来应该读哪本书？”时，我有了答案。就是这本书。这本书是你理解了如何使用 Linux 系统后的下一步。它教你如何像管理 Linux\
    \ 系统一样去管理 Linux 系统。\n\n如果你准备好迈出下一步，让我们让我们开始吧。\n\nJason\n\n# 启动\n\n作为系统管理员，你需要理解\
    \ Linux 的启动过程。在本章，你将学习 BIOS、引导加载程序、Linux 内核和运行级别（runlevels）。\n\n## BIOS\n\nBIOS\
    \ 代表基本输入输出系统（Basic Input/Output System）。它是启动过程中使用的一种特殊类型的固件，是计算机开机时运行的第一段软件。BIOS\
    \ 是独立于操作系统的。它的主要目的是测试底层硬件组件并加载引导加载程序或操作系统。\n\nBIOS 会执行 `POST`，即上电自检（Power-On Self\
    \ Test）。`POST` 会对 CPU、内存和存储设备等各种硬件组件进行一些基础检查。只有在 `POST` 成功后，BIOS 才会尝试加载引导加载程序。\n\
    \nBIOS 包含一个启动设备列表，例如硬盘、DVD 驱动器、USB 设备等，取决于所使用的硬件。BIOS 会按照指定的顺序在该列表中查找可启动设备。你可以通过中断启动序列并进入\
    \ BIOS 配置来更改此顺序。用于此操作的按键组合会随硬件制造商的不同而异。\n\n一旦找到可启动设备，BIOS 就会运行引导加载程序。通常会使用 `GRUB`\
    \ 引导加载程序，但你可能会遇到使用 `LILO` 引导加载程序的旧 Linux 系统。`LILO` 代表 `LInux LOader`，而 `GRUB`\
    \ 代表 `GRand Unified Bootloader`。无论如何，引导加载程序的主要目的是启动操作系统。你通常会看到来自引导加载程序的一条或一系列消息，这些消息允许你中断启动过程并与引导加载程序交互。如果安装了多个操作系统，你可以告诉引导加载程序运行哪一个操作系统。你还可以指示引导加载程序向操作系统传递不同的启动选项。\n\
    \n## 初始内存磁盘\n\n初始内存磁盘，缩写为 `initrd`，是系统启动时加载到内存中的临时文件系统。该文件系统可以包含执行硬件检测并加载必要的模块（有时称为驱动程序）的辅助程序，以挂载实际的文件系统。例如，如果根文件系统存储在\
    \ `LVM`（逻辑卷管理器）卷上，`initrd` 镜像将包含挂载该逻辑卷作为根文件所需的所需的模块。一旦 `initrd` 挂载了实际根文件系统，它的任务就完成了，操作系统将从真实的根文件系统加载。\n\
    \n## 内核和初始内存磁盘的位置\n\nLinux 内核、初始内存磁盘以及启动操作系统所需的其他文件存储在 `/boot` 中。这里是一个 Ubuntu\
    \ 系统 `/boot` 目录列表。\n\n```bash\n$ ls -1F /boot\n\nabi-3.13.0-46-generic\nconfig-3.13.0-46-generic\n\
    grub/\ninitrd.img-3.13.0-46-generic\nSystem.map-3.13.0-46-generic\nvmlinuz-3.13.0-46-generic\n\
    ```\n\nLinux 内核通常命名为 `vmlinux` 或 `mlinuz`。如果内核是压缩过的，格式为 `vmlinuz`。在本示例中，初始内存磁盘是\
    \ `initrd.img-3.13.0-46-generic`。内核是 `vmlinuz-3.13.0-46-generic`。\n\n## 内核缓冲区\n\
    \n内核缓冲区包含与 Linux 内核相关的消息。缓冲区是一个固定大小的数据结构。当缓冲区完全满时，旧消息会被丢弃。要查看内核缓冲区的内容，请使用 `dmesg`\
    \ 命令。\n\n```bash\n$ dmesg\n\n[ 0.000000] Initializing cgroup cpuset\n[ 0.000000]\
    \ Initializing cgroup cpu\n[ 0.000000] Initializing cgroup cpuacct\n[ 0.000000]\
    \ Linux version 3.13.0-46-generic (buildd@or) (gcc version 4.8.2 (Ubuntu 4.8.2-19ubuntu1)\
    \ ) #79-Ubuntu SMP Mar 10 20:06:50 UTC 2015) (3.13.11-ckt15)\n[ 0.000000] Command\
    \ line: BOOT_IMAGE=/boot/vmlinuz-3.13.0-46-generic root=UUID=736134da-c6b8-4a97-911c-650146a68b3\
    \ ro console=tty1 console=ttyS0\n[ 0.000000] KERNEL supported cpus:\n[ 0.000000]\
    \ Intel GenuineIntel\n[ 0.000000] AMD AuthenticAMD\n[ 0.000000] Centaur CentaurHauls\n\
    [ 0.000000] e820: BIOS-provided physical RAM map:\n```\n\n消息也存储在磁盘的 `/var/log/dmesg`\
    \ 文件中。通过 `dmesg` 命令和 `/var/log/dmesg` 日志文件，你可以看到内核生成的消息，即使在启动过程的最早期阶段，这些消息也会飞掠你的屏幕。\n\
    \n## 运行级别与目标\n\nLinux 使用运行级别来确定启动哪些进程和服务。每个发行版的配置可能不同，但通常情况下，运行级别 0 用于关闭系统，运行级别\
    \ 1 是单用户模式，运行级别 2-5 用于正常系统操作，运行级别 6 用于重启系统。\n\n| 运行级别 | 描述 |\n| :--- | :--- |\n\
    | 0 | 关闭系统 |\n| 1, S, s | 单用户模式。用于维护。 |\n| 2 | 带图形界面的多用户模式（Debian/Ubuntu） |\n\
    | 3 | 多用户文本模式（RedHat/CentOS） |\n| 4 | 未定义 |\n| 5 | 带图形界面的多用户模式（RedHat/CentOS）\
    \ |\n| 6 | 重启 |\n\n"
- fmt: "\nHistorically, runlevels were controlled by the `init` program. The `init`\
    \ configuration was stored in `/etc/inittab`. To change the default runlevel using\
    \ `init`, you would edit the `/etc/inittab` file and set the runlevel number on\
    \ the `initdefault` line. Here is an example of setting runlevel 3 to be the default\
    \ runlevel.\n\n```\nid:3:initdefault:\n```\n\nHowever, `init` alternatives such\
    \ as `systemd` and `upstart` are quickly taking the place of `init` with `systemd`\
    \ currently being the most widely adopted replacement.\n\nInstead of runlevels,\
    \ `systemd` has the concepts of targets. These targets are roughly equivalent\
    \ to runlevels. To see a list of available targets, look in `/lib/systemd/system`.\
    \ You’ll notice the runlevel targets are actually symlinks to the real targets\
    \ being used. For example, `runlevel5.target` is a symlink to `graphical.target`.\n\
    \n```bash\ncd /lib/systemd/system\nls -l runlevel*target\n\nlrwxrwxrwx. 1 root\
    \ root 15 Jul 17 2014 runlevel0.target -> poweroff.target\nlrwxrwxrwx. 1 root\
    \ root 13 Jul 17 2014 runlevel1.target -> rescue.target\nlrwxrwxrwx. 1 root root\
    \ 17 Jul 17 2014 runlevel2.target -> multi-user.target\nlrwxrwxrwx. 1 root root\
    \ 17 Jul 17 2014 runlevel3.target -> multi-user.target\nlrwxrwxrwx. 1 root root\
    \ 17 Jul 17 2014 runlevel4.target -> multi-user.target\nlrwxrwxrwx. 1 root root\
    \ 16 Jul 17 2014 runlevel5.target -> graphical.target\nlrwxrwxrwx. 1 root root\
    \ 13 Jul 17 2014 runlevel6.target -> reboot.target\n```\n\nTo change the default\
    \ runlevel, or target, with `systemd`, use the `systemctl` command followed by\
    \ `set-default` and finally the desired target. Optionally, you can manually create\
    \ a symlink to the desired target from the `/etc/systemd/system/default.target`\
    \ file. This example sets the default target to be graphical, which is equivalent\
    \ to runlevel 5.\n\n```bash\nset-default multi-user.target\nrm ‘/etc/systemd/system/default.target’\n\
    ln -s ‘/usr/lib/systemd/system/multi-user.target’ ‘/etc/systemd/system/default.target’\n\
    ```\n\n## Changing Runlevels or Targets\n\nWith the `init` system, you can change\
    \ runlevels using the `telinit` command. Simply supply the runlevel you want to\
    \ change to as an argument to the `telinit` command.\n\n```bash\ntelinit 5\n```\n\
    \nTo change the target, the runlevel equivalent for `systemd`, use the `systemctl`\
    \ command followed by `isolate` and finally the desired target. Here is how to\
    \ change to the graphical target.\n\n```bash\nsystemctl isolate graphical.target\n\
    ```\n\n## Rebooting a System\n\nEven though there is a runlevel/target if you’re\
    \ using `systemd`, for rebooting you can also use the `reboot` or `shutdown` commands.\n\
    \nHere’s how to reboot with `init`.\n\n```bash\ntelinit 6\n```\n\nTo reboot using\
    \ `systemd` use the `systemctl` command.\n\n```bash\nsystemctl isolate reboot.target\n\
    ```\n\nTo reboot using the `reboot` command simply execute `reboot`.\n\n```bash\n\
    reboot\n```\n\nThe format of the `shutdown` command is as follows.\n\n```\nshutdown\
    \ [options] time [message]\n```\n\nThe option to tell `shutdown` to perform a\
    \ reboot is `-r`. You can specify the time to shutdown using the “HH:MM” format.\
    \ You can also use `+N` where `N` represents the number of minutes to wait before\
    \ performing the action. Finally, you can use the `now` keyword to start immediately.\
    \ Optionally, you may specify a message that will be broadcast to all users logged\
    \ into the system.\n\n```bash\nshutdown -r now\n```\n\n## Powering Off a System\n\
    \nTo power off a system, use runlevel 0, the `poweroff` target, or the `poweroff`\
    \ command.\n\nHere is how to issue a power-off with `init`.\n\n```bash\ntelinit\
    \ 0\n```\n\nHere is how to power off a system with `systemctl`.\n\n```bash\nsystemctl\
    \ isolate poweroff.target\n```\n\nFinally, you can use the `poweroff` command.\n\
    \n```bash\npoweroff\n```\n\n## Summary\n\nIn this chapter, you learned about the\
    \ Linux boot process. You learned that the job of the `BIOS` is to perform basic\
    \ hardware checks and to start the boot loader from a bootable device. You also\
    \ learned about the two most commonly used bootloaders, `LILO` and `Grub`. The\
    \ primary job of any boot loader is to start the operating system.\n\nYou also\
    \ learned that the files required to boot a Linux system are stored in the `/boot`\
    \ directory. The initial ram disk, or `initrd`, is a tempory file system that\
    \ is loaded into memory. Its main job is to mount the file system where the operating\
    \ system is stored. The Linux kernel is typically named `vmlinux`, or, if it is\
    \ compressed, `vmlinuz`.\n\nYou learned how to view the messages in the kernel\
    \ ring buffer by using the `dmesg` command or by examining the `/var/log/dmesg`\
    \ file.\n\nYou also learned about run levels and how `systemd` has an equivalent\
    \ concept known as targets. You learned how to change the runlevel with the `telinit`\
    \ command for the traditional `init` system, and the `systemctl` command for systems\
    \ the use system. Finally, you learned about the `shutdown`, `reboot`, and `poweroff`\
    \ commands.\n\n## Quiz\n\nThe `BIOS` begins the computer’s boot process and passes\
    \ control to the boot loader. \n- True\n- False\n\nWhich of the following are\
    \ Linux boot loaders?\n- LILO\n- GRUB\n- Both LILO and GRUB\n- BIOS\n\nWhich of\
    \ the following is a temporary file system which is loaded into memory when the\
    \ system boots.\n- kernel\n- vmlinux\n- vmlinuz\n- initrd\n\nThe `/linux` directory\
    \ contains the files required to boot Linux.\n- True\n- False\n\nWhich command\
    \ displays the contents of the kernel ring buffer?\n- ringbuf\n- ringb\n- rmesg\n\
    - dmesg\n\n## Quiz Answers\n\nA\nC\nD\nB\nD\n\n## System Logging\n\nLinux uses\
    \ the `syslog` standard for message logging. This allows programs and applications\
    \ to generate messages that can be captured, processed, and stored by the system\
    \ logger. It eliminates the need for each and every application having to implement\
    \ a logging mechanism. It also means that logging can be configured and controlled\
    \ in a central location.\n\nThe `syslog` standard uses facilities and severities\
    \ to categorize messages. Each message is labeled with a facility code and a severity\
    \ level. The various combinations of facilities and severities can be used to\
    \ determine how a message is handled.\n\nFacilities are used to indicate what\
    \ type of program or what part of the system the message originated from. For\
    \ example, messages that are labeled with the `kern` facility originate from the\
    \ Linux kernel. Messages that are labeled with the `mail` facility come from applications\
    \ involved in handling mail.\n\nEach facility has a number and a keyword associated\
    \ with it. This table lists the syslog facilities.\n\n| Number | Keyword | Description\
    \ |\n| :--- | :--- | :--- |\n| 0 | kern | kernel messages |\n| 1 | user | user-level\
    \ messages |\n| 2 | mail | mail system |\n| 3 | daemon | system daemons |\n| 4\
    \ | auth | security/authorization messages |\n| 5 | syslog | messages generated\
    \ by syslogd |\n| 6 | lpr | line printer subsystem |\n| 7 | news | news subsystem\
    \ |\n| 8 | uucp | UUCP subsystem |\n| 9 | clock | clock daemon |\n| 10 | authpriv\
    \ | security/authorization messages |\n| 11 | ftp | FTP daemon |\n| 12 | - | NTP\
    \ subsystem |\n| 13 | - | log audit |\n| 14 | - | log alert |\n| 15 | cron | clock\
    \ daemon |\n| 16 | local0 | use 0 (local0) |\n| 17 | local1 | use 1 (local1) |\n\
    | 18 | local2 | use 2 (local2) |\n| 19 | local3 | use 3 (local3) |\n| 20 | local4\
    \ | use 4 (local4) |\n| 21 | local5 | use 5 (local5) |\n| 22 | local6 | use 6\
    \ (local6) |\n| 23 | local7 | use 7 (local7) |\n\nThis table lists each of the\
    \ severities, including their code, keyword, and description.\n\n| Code | Severity\
    \ | Keyword | Description |\n| :--- | :--- | :--- | :--- |\n| 0 | Emergency |\
    \ emerg | System is unusable |\n| 1 | Alert | alert | Action must be taken immediately\
    \ |\n| 2 | Critical | crit | Critical conditions |\n| 3 | Error | err | Error\
    \ conditions |\n| 4 | Warning | warn | Warning conditions |\n| 5 | Notice | notice\
    \ | Normal but significant condition |\n| 6 | Info | info | Informational messages\
    \ |\n| 7 | Debug | debug | Debug-level messages |\n\nA syslog server accepts syslog\
    \ messages and process those messages based on a set of configurable rules. Traditionally,\
    \ the `syslogd` daemon filled this role, but many Linux distributions today ship\
    \ with alternatives such as `rsyslog` and `syslog-ng`. For the remainder of this\
    \ chapter, we are going to focus on `rsyslog`; however, the concepts apply to\
    \ any syslog server.\n"
