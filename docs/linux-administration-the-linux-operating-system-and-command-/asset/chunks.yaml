- fmt: '

    DHCP stands for Dynamic Host Configuration Protocol. DHCP is primarily used to
    assign IP addresses to hosts on a network. When a DHCP client wants to request
    an IP address it sends a broadcast message looking for a DHCP server. The DHCP
    server then responds to the client and provides it with an IP address and other
    additional information such as the netmask, gateway, and DNS servers to use for
    name resolution. The DHCP client configures itself with this information and begins
    to communicate on the network.


    The IP address assigned to a DHCP client is leased from the DHCP server. The client
    will be able to use that IP address for the lease expiration time configured by
    the DHCP server. If the DHCP client wants to continue using the IP address beyond
    the lease expiration time, it must send a renewal request to the DHCP server.
    If no renewal is received by the DHCP server, it will place this IP back into
    the pool of available addresses.


    To configure a RedHat based system as a DHCP client, edit the network device configuration
    file located in the `/etc/sysconfig/network-scripts` directory. The name of this
    file will be `ifcfg-network-device-name`. Depending on the system configuration
    and the underlying hardware, it might be `ifcfg-eth0` or even something like `ifcfg-enp5s2`.
    To get a list of network devices on your system, run `ifconfig -a` or `ip link`.


    Once you’ve identified the configuration file for the network device, set the
    `BOOTPROTO` variable to “dhcp.”


    ```bash

    ip link


    1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN mode DEFAULT


    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00


    2: enp0s3: <BROADCAST,MULTAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    mode DEFAULT qlen 1000


    link/ether 08:00:27:ba:8f:35 brd ff:ff:ff:ff:ff:ff

    ```


    ```bash

    cat /etc/sysconfig/network-scripts/ifcfg-enp0s3


    DEVICE=“enp0s3”

    ONBOOT=yes

    NETBOOT=yes

    IPV6INIT=yes

    BOOTPROTO=dhcp

    TYPE=Ethernet

    NAME=“enp0s3”

    ```


    To configure an Ubuntu system as a DHCP client, edit the `/etc/network/interfaces`
    file. Add the `dhcp` method to the `inet` address family statement for the interface.
    The line will read `iface <network-device-name> inet dhcp`. For `eth0`, this will
    be `iface eth0 inet dhcp`. Here are the contents of an example `/etc/network/interfaces`
    file.


    ```bash

    #/etc/network/interfaces


    # This file describes the network interfaces

    # available on your system and how to activate them.

    # For more information, see interfaces(5).

    # The loopback network interface

    auto lo

    iface lo inet loopback


    # The primary interface interface

    auto eth0

    iface eth0 inet dhcp

    ```


    You can also assign a static IP address to a Linux system. For RedHat based systems,
    edit the network interface configuration file located in `/etc/sysconfig/network-scripts`.
    Be sure to set the `BOOTPROTO` variable to `static`. Assign the IP address, netmask,
    network, broadcast, and gateway as shown in the following example. If you want
    the network device to be activated at boot time, set `ONBOOT` to `yes`.


    ```bash

    DEVICE=“enp0s3”

    BOOTPROTO=static

    IPADDR=10.109.155.174

    NETMASK=255.255.255.0

    NETWORK=10.109.155.0

    BROADCAST=10.109.155.255

    GATEWAY=10.109.155.1

    ONBOOT=yes

    ```


    To assign an interface a static IP address on an Ubuntu system, edit the `/etc/network/interfaces`
    file. Use the `static` keyword following `inet` on the `iface` line for the network
    interface. Next, supply the IP address, netmask, and gateway address.


    ```bash

    auto eth0

    iface eth0 inet static

    address 10.109.155.174

    netmask 255.255.255.0

    gateway 10.109.155.1

    ```


    You can use the `ip` command to manually assign an IP address to a network interface.
    The format is `ip address add IP[/NETMASK] dev NETWORK_DEVICE`. To add the IP
    address `10.11.12.13` to `eth0`, run `ip address add 10.11.12.13 dev eth0`. You
    can also supply the netmask by following the IP address with a forward slash and
    then providing the netmask like so: `ip address add 10.11.12.13/255.255.255.0
    dev eth0`. To bring the interface up, run `ip link set eth0 up`.


    If the `ifconfig` tool is available, you can use it to assign IP addresses to
    network interfaces as well. The format is `ifconfig NETWORK_DEVICE addr netmask
    SUBNET_MASK`. To add the IP address `10.11.12.13` to `eth0` with `ifconfig`, run
    `ifconfig eth0 10.11.12.13`. To specify the netmask, use the `netmask` keyword
    and follow it by the netmask you intend to use. Run `ifconfig eth0 10.11.12.13
    netmask 255.255.255.0`, for example. To bring the interface up, run `ifconfig
    eth0 up`.


    An easier way to bring network interfaces up and down is by using the `ifup` and
    `ifdown` commands. These commands are actually scripts that are provided by many
    Linux distributions. They use the information specified in the network configuration
    files to configure the interfaces. If you make a configuration change you can
    test your change by using the `ifup` and `ifdown` commands. Here are a few examples.


    ```bash

    ifup eth0

    ifup enp5s2

    ifdown eth0

    ifdown enp5s2

    ```


    Instead of manually editing network configuration files, some distributions supply
    GUI or TUI tools. GUI stands for graphical user interface and TUI stands for textual
    user interface.


    RedHat supplies a TUI called `nmtui`. You can run `nmtui` as root and use the
    simple menu driven interface to configure your network devices. Older versions
    of RedHat include a very similar utility called `system-config-network`. You can
    use `YaST`, which stands for Yet Another Setup Tool, on Suse systems. At the time
    of this writing, there are no official Ubuntu network configuration tools available.


    ## Summary


    In this chapter, you learned to see what IP addresses are assigned to the network
    interfaces on a Linux system. You also learned how to manually add IP addresses
    using the `ip` and `ifconfig` utilities. Next, you learned how to set and get
    the hostname of a system. We also talked about DNS and using the `host` and `dig`
    utilities to resolve names and IP addresses. You learned how to make entries in
    `/etc/hosts` and how to control the order in which name resolutions take place
    by using the `/etc/nsswitch.conf` file.


    Network ports were covered and you learned how superuser privileges are required
    to open ports below 1,024. You also learned that the primary purpose of DHCP is
    to assign IP addresses to hosts on a network. You learned how to configure Linux
    servers to use DHCP to obtain their networking information and how to assign static
    IP addresses.


    You learned that the `ifup` and `ifdown` scripts are available on many linux distributions
    and that they can be used to easily bring up or down a network interface. Finally,
    you learned about GUI and TUI tools that you can use to configure the networking
    settings on a Linux server.


    ## Quiz


    What command can be used to display the hostname of a Linux system?

    - `hostname`

    - `uname -n`

    - `hostname -f`

    - All of the above.


    Entries added to the `/etc/hosts` file become automatically available in DNS.

    - `True`

    - `False`


    Which configuration file controls the order in which lookups are performed?

    - `/var/nsswitch.conf`

    - `/etc/nsswitch.conf`

    - `/etc/resolv.conf`

    - `/var/resolv.conf`


    What range of ports are considered unprivileged ports?

    - `0 - 1023`

    - `0 - 1000`

    - `1024 - 2048`

    - `1024 - 65535`


    DHCP stands for Dynamic Host Configuration Protocol.

    - `True`

    - `False`


    ## Quiz Answers

    D

    B

    B

    D

    A


    ## Network Troubleshooting


    Network troubleshooting is a large and complex topic. How you approach a situation
    will largely depend on the circumstances and environment in which you are doing
    the network troubleshooting. However, in this chapter, you will learn some of
    the most common tools you can use to perform network diagnostics.


    First you’ll learn about the `ping` command and how to test network connectivity
    with it. Next you’ll learn how to examine network routes using the `traceroute`
    and `tracepath` commands. You’ll also learn how to see various network statistics
    with the `netstat` command. We’ll cover how to analyze raw network traffic using
    `tcpdump`. Finally, you’ll learn how to test if a port is actually open by connecting
    to it with the `telnet` command.

