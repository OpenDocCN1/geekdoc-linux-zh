    Variable names can contain letters, digits, and underscores. They can start with
    letters or underscores, but cannot start with a digit. Here are examples of valid
    variable names.


    `FIRST3LETTERS="ABC"`

    `FIRST_THREE_LETTERS="ABC"`

    `firstThreeLetters="ABC"`


    Here are some examples of invalid variable names.


    `3LETTERS="ABC"`

    `first-three-letters="ABC"`

    `first@Three@Letters="ABC"`


    ## Tests


    Scripts are designed to replace the need for a person to physically sit at a keyboard
    and type in a series of commands. What if you have a task you want to automate,
    but it requires different actions based on different circumstances? Since a person
    may not be around to make decisions when the script needs to run, we’ll need to
    test for those conditions and have the script act accordingly.


    To create a test, place a conditional expression between brackets. The syntax
    is: `[ condition-to-test-for ]`. You can test for several types of situations.
    For example, you can compare if strings are equal, if a number is greater than
    another one, or if a file exists. This test checks to see if `/etc/passwd` exists.
    If it does, it returns true. In other words, the command exits with a status of
    `0`. If the file doesn’t exist, it returns false. I.e., the command exits with
    a status of `1`.


    ```bash

    [ -e /etc/passwd ]

    ```


    If you are using the `bash` shell, you can run the command `help test` to see
    the various types of tests you can perform. You can also read the man page for
    tests: `man test`. Here are some of the more common tests you can perform.


    File operators:

    - `-d FILE` True if file is a directory.

    - `-e FILE` True if file exists.

    - `-f FILE` True if file exists and is a regular file.

    - `-r FILE` True if file is readable by you.

    - `-s FILE` True if file exists and is not empty.

    - `-w FILE` True if the file is writable by you.

    - `-x FILE` True if the file is executable by you.


    String operators:

    - `-z STRING` True if string is empty.

    - `-n STRING` True if string is not empty.

    - `STRING` True if string is not empty.

    - `STRING1 = STRING2` True if the strings are equal.

    - `STRING1 != STRING2` True if the strings are not equal.


    Arithmetic operators:

    - `arg1 -eq arg2` True if `arg1` is equal to `arg2`.

    - `arg1 -ne arg2` True if `arg1` is not equal to `arg2`.

    - `arg1 -lt arg2` True if `arg1` is less than `arg2`.

    - `arg1 -le arg2` True if `arg1` is less than or equal to `arg2`.

    - `arg1 -gt arg2` True if `arg1` is greater than `arg2`.

    - `arg1 -ge arg2` True if `arg1` is greater than or equal to `arg2`.


    ## The if Statement


    Now that you know how to determine if a certain condition is true or not, you
    can combine that with the `if` statement to make decisions in your scripts.


    The `if` statement starts with the word `if` and is then followed by a test. The
    following line contains the word `then`. Next is a series of commands that will
    be executed if the tested condition is true. Finally, the `if` statement ends
    with `fi`, which is `if` spelled backwards. Here is the syntax.


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    fi

    ```


    Here is an example:


    ```bash

    #!/bin/bash

    MY_SHELL="bash"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    fi

    ```


    It is a best practice to enclose variables in quotes to prevent unexpected side
    effects when performing conditional tests. Here is the output of running the script:


    ```

    You seem to like the bash shell.

    ```


    You can also perform an action if the condition is not true by using an `if/else`
    statement. Here is what an `if/else` statement looks like.


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    else #

    command 3

    command 4

    …

    fi

    ```


    Let’s update the script to perform an action if the statement is not true.


    ```bash

    #!/bin/bash

    MY_SHELL="csh"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    else

    echo "You don’t seem to like the bash shell."

    fi

    ```


    Here is the output. Because `[ "$MY_SHELL" = "bash" ]` evaluated as false, the
    statements following `else` were executed.


    ```

    You don’t seem to like the bash shell.

    ```


    You can also test for multiple conditions using `elif`. The word `elif` is a contraction
    for “else if.” Like `if`, follow `elif` with a condition to test for. On the following
    line, use the word `then`. Finally, provide a series of commands to execute if
    the condition evaluates as true.


    ```bash

    if [ condition-true ]

    then

    command 1

    command 2

    …

    elif [ condition-true ]

    then

    command 3

    command 4

    …

    else #

    command 5

    command 6

    …

    fi

    ```


    Here is an updated script using `elif`:


    ```bash

    #!/bin/bash

    MY_SHELL="csh"

    if [ "$MY_SHELL" = "bash" ]

    then

    echo "You seem to like the bash shell."

    elif [ "$MY_SHELL" = "csh" ]

    then

    echo "You seem to like the csh shell."

    else

    echo "You don’t seem to like the bash or csh shells."

    fi

    ```


    Output:

    ```

    You seem to like the csh shell.

    ```


    ## The for Loop


    If you want to perform an action on a list of items, use a `for` loop. The first
    line of a `for` loop starts with the word `for` followed by a variable name, followed
    by the word `in` and then a list of items. The next line contains the word `do`.
    Place the statements you want to execute on the following lines; then end the
    `for` loop with the word `done` on a single line.


    ```bash

    for VARIABLE_NAME in ITEM_1 ITEM_2 ITEM_N

    do

    command 1

    command 2

    …

    done

    ```


    Essentially, what happens happens that the first item in the list is assigned
    to the variable and the code block is executed. The next item in the list is then
    assigned to the variable and the commands are executed. This happens for each
    item in the list.


    Here is a simple script that shows how a `for` loop works:


    ```bash

    #!/bin/bash

    for COLOR in red green blue

    do

    echo "COLOR: $COLOR"

    done

    ```


    Output:

    ```

    COLOR: red

    COLOR: green

    COLOR: blue

    ```


    It’s common practice for the list of items to be stored in a variable as in this
    example.


    ```bash

    #!/bin/bash

    COLORS="red green blue"

    for COLOR in $COLORS

    do

    echo "COLOR: $COLOR"

    done

    ```


    Output:

    ```

    COLOR: red

    COLOR: green

    COLOR: blue

    ```


    This shell script, `rename-pics.sh`, renames all of the files that end in `jpg`
    by prepending today’s date to the file name.


    ```bash

    #!/bin/bash

    PICTURES=$(ls *.jpg)

    DATE=$(date +%F)

    for PICTURE in $PICTURES

    do

    echo "Renaming $PICTURE to ${DATE}-${PICTURE}"

    mv $PICTURE ${DATE}-${PICTURE}

    done

    ```


    Here’s what happens when you run this script:


    ```

    $ ls

    bear.jpg man.jpg pig.jpg rename-pics.sh

    $ ./rename-pics.sh

    Renaming bear.jpg to 2015-03-06-bear.jpg

    Renaming man.jpg to 2015-03-06-man.jpg

    Renaming pig.jpg to 2015-03-06-pig.jpg

    $ ls

    2015-03-06-bear.jpg 2015-03-06-man.jpg 2015-03-06-pig.jpg rename-pics.sh

    ```


    ## Positional Parameters


    Positional parameters are variables that contain the contents of the command line.
    These variables are `$0` through `$9`. The script itself is stored in `$0`, the
    first parameter in `$1`, the second in `$2`, and so on. Take this command line
    as an example:


    ```

    $ script.sh parameter1 parameter2 parameter3

    ```


    The contents of `$0` is `script.sh`, `$1` is `parameter1`, `$2` is `parameter2`,
    and `$3` is `parameter3`.


    This script, `archive_user.sh`, accepts a parameter which is a username:


    ```bash

    #!/bin/bash

    echo "Executing script: $0"

    echo "Archiving user: $1"

    # Lock the account

    passwd -l $1

    # Create an archive of the home directory.

    tar cf /archives/${1}.tar.gz /home/${1}

    ```


    Here is what the output looks like when we execute the `archive_user.sh` script:


    ```

    $ ./archive_user.sh elvis

    Executing script: ./archive_user.sh

    Archiving user: elvis

    passwd: password expiry information changed.

    tar: Removing leading ‘/ from member names

    ```


    ## Comments


    Anything that follows the pound sign is a comment. The only exception to this
    is the shebang on the first line. Everywhere else in the script, when a pound
    sign is encountered it marks the beginning of a comment. Comments are dutifully
    ignored by the interpreter as they are for the benefit of us humans.


    Anything that follows the pound sign is ignored. If a pound sign starts at the
    beginning of a line the entire line is ignored. If a pound sign is encountered
    in the middle of a line, the information to the right of the pound sign is ignored.

