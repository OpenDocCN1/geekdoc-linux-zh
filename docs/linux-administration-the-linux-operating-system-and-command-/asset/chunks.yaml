    http://www.linuxtrainingacademy.com/python-programming-for-beginners


    # Introduction


    After releasing my first book, Linux for Beginners, readers kept telling me, “I
    love Linux! It opened up a whole new world for me and I want to learn even more.”
    Some even wanted to turn their newfound passion into a career as a Linux professional.
    “What’s next?” they would ask.


    I would point them to one of my courses or suggest they take a Linux system administration
    class. “That’s great, but what book should I read next? What book would be a great
    companion to a Linux administration course?” I didn’t have a good answer for them.


    Most of the books on Linux system administration, as great as they are, are simply
    outdated. They all seem to come from a time when Linux more closely resembled
    Unix. Even recently released books didn’t cover the fundamental shift in how system
    services are started and managed on modern Linux systems. With every year that
    passes, every new version of the Linux kernel that is released, and every new
    Linux distribution update, Linux looks less and less like a traditional Unix system.
    Now, more than ever before, Linux has to be treated as its own entity.


    Now when someone asks me, “What book should I read next?”, I have an answer for
    them. It’s this book. This book is the next step after you understand how to use
    a Linux system. It teaches you how to manage a Linux system like a Linux system.


    If you’re ready to take that next step, let’s get started.


    Jason


    # Booting


    As a system administrator you need to understand the Linux boot process. In this
    chapter, you will learn about the BIOS, the boot loader, the Linux kernel and
    runlevels.


    ## The BIOS


    BIOS stands for Basic Input/Output System. It’s a special type of firmware used
    in the booting process and it’s the first piece of software that is run when a
    computer is powered on. The BIOS is operating system independent. Its primary
    purpose is to test the underlying hardware components and to load a boot loader
    or operating system.


    The BIOS performs a POST, which stands for Power-On Self Test. The POST performs
    some basic checks of various hardware components such as the CPU, memory, and
    storage devices. Only if the POST succeeds will the BIOS attempt to load the boot
    loader.


    The BIOS contains a list of boot devices such as hard disks, a DVD drive, USB
    devices, and others depending on the hardware being used. The BIOS searches that
    list for a bootable device in the order specified. You can change this order by
    interrupting the boot sequence and entering into the configuration for the BIOS.
    The key combination used to do this will vary from one hardware manufacturer to
    another.


    Once a bootable device has been found, the BIOS will run the boot loader. Typically
    the GRUB boot loader will be used, but you may run into older Linux systems that
    use the LILO boot loader. LILO stands for LInux LOader, while GRUB stands for
    GRand Unified Bootloader. In any case, the primary purpose of the boot loader
    is to start the operating system. You will typically see a message or series of
    messages from the boot loader which will allow you to interrupt the boot process
    and interact with the boot loader. If there are multiple operating systems installed,
    you can tell the boot loader which operating system to run. You can also instruct
    the boot loader to pass different boot options to the operating system.


    ## The Initial RAM Disk


    The initial RAM disk, abbreviated as “initrd,” is a temporary file system that’s
    loaded into memory when the system boots. This file system can contain helpers
    that perform hardware detection and load the necessary modules, sometimes called
    drivers, to get the actual file system mounted. For example, if the root file
    filesystem is stored on an LVM (Logical Volume Manager) volume, the initrd image
    will contain the kernel modules required to mount that logical volume as the root
    file system. Once the initrd mounts the actual root file system its job is done
    and the operating system continues loading from the real root file system.


    ## Kernel and Initial RAM Disk Location


    The Linux kernel, the initial RAM disk, and other files needed to boot the operating
    system are stored in /boot. Here is a listing of the /boot directory for an Ubuntu
    system.


    $ ls -1F /boot


    abi-3.13.0-46-generic


    config-3.13.0-46-generic


    grub/


    initrd.img-3.13.0-46-generic


    System.map-3.13.0-46-generic


    vmlinuz-3.13.0-46-generic


    The Linux kernel is typically named vmlinux or vmlinuz. If the kernel is compressed
    its name is in the vmlinuz format. In this example, the kernel is vmlinuz-3.13.0-46-generic.
    The initial RAM disk in this example is initrd.img-3.13.0-46-generic.


    ## The Kernel Ring Buffer


    The kernel ring buffer contains messages related to the Linux kernel. A ring buffer
    is a data structure that is always the same size. Once the buffer is completely
    full, old messages are discarded when new messages arrive. To see the contents
    of the kernel ring buffer, use the dmesg command.


    $ dmesg


    [ 0.000000] Initializing cgroup subsys cpuset


    [ 0.000000] Initializing cgroup subsys cpu


    [ 0.000000] Initializing cgroup subsys cpuacct


    [ 0.000000] Linux version 3.13.0-46-generic (buildd@orlo) (gcc version 4.8.2 (Ubuntu
    4.8.2-19ubuntu1) ) #79-Ubuntu SMP Tue Mar 10 20:06:50 UTC 2015 (Ubuntu 3.13.0-46.79-generic
    3.13.11-ckt15)


    [ 0.000000] Command line: BOOT_IMAGE=/boot/vmlinuz-3.13.0-46-generic root=UUID=736134da-c6b8-4a97-911c-650146a68b3c
    ro console=tty1 console=ttyS0


    [ 0.000000] KERNEL supported cpus:


    [ 0.000000] Intel GenuineIntel


    [ 0.000000] AMD AuthenticAMD


    [ 0.000000] Centaur CentaurHauls


    [ 0.000000] e820: BIOS-provided physical RAM map:


    …


    On most Linux distributions these messages are also stored on disk in the /var/log/dmesg
    file. Between the dmesg command and the /var/log/dmesg log file, you will be able
    to see the messages the kernel is generating, even during the earliest stages
    of the boot process when those messages can quickly fly by your screen.


    ## Runlevels and Targets


    Linux uses runlevels to determine what processes and services to start. Each distribution
    can be configured differently, but, in general, runlevel 0 is used to power off
    a system, runlevel 1 is single-user mode, runlevels 2-5 are for normal system
    operations, and runlevel 6 is used to reboot a system.


    Runlevel Description


    0 Shuts down the system


    1, S, s Single user mode. Used for maintenance.


    2 Multi-user mode with graphical interface.


    (Debian/Ubuntu)


    3 Multi-user text mode (RedHat/CentOS)


    4 Undefined


    5 Multi-user mode with graphical interface.


    (RedHat/CentOS)


    6 Reboot'
