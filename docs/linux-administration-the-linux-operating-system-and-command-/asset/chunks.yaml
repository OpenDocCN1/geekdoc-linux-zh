  trans: "\n\n这是一个使用 `GNU Screen` 的示例。要启动 `Screen`，请运行 `screen` 命令。看起来似乎没有发生任何变化，但你现在已经进入了一个\
    \ screen 会话。要列出所有会话，请使用 `-ls` 选项。现在你可以启动你想要在断开连接后仍保持运行的进程。我们不需要特意让它在后台运行启动，因为\
    \ `screen` 会捕获它的输出。要从 screen 会话中断开，请输入 `Ctrl-A` 然后按 `D`。如果你再次运行 `screen -ls`，它将显示有一个\
    \ screen 会话正在运行，但你尚未连接到它。此时，你可以断开与服务器和 Screen 的连接，与之启动的任何进程都将继续运行。要重新连接到 screen\
    \ 会话，请使用 `-r` 选项。如果有多个 screen 会话，你需要提供在 `screen -ls` 输出中显示的会话名称。\n\n```\n[jason@laptop\
    \ ~]$ ssh linuxsvr\n[jason@linuxsvr ~]$ screen\n[jason@linuxsvr ~]$ screen -ls\n\
    There is a screen on: 23478.pts-0.linuxsvr (Attached)\n1 Socket in /var/run/screen/S-jason.\n\
    [jason@linuxsvr ~]$ do-backup.sh\nApr 5 18:42:51 - Creating backup\n[detached\
    \ from 23478.pts-0.linuxsvr]\n[jason@linuxsvr ~]$ screen -ls\nThere is a screen\
    \ on: 23478.pts-0.linuxsvr (Detached)\n1 Socket in /var/run/screen/S-jason.\n\
    [jason@linuxsvr ~]$ exit\nConnection to linuxsvr closed.\n[jason@laptop ~]$ ssh\
    \ linuxsvr\n[jason@linuxsvr ~]$ screen -r\nApr 5 18:53:51 - Backup complete\n\
    [jason@linuxsvr ~]$\n```\n\n## 负载平均 (Load Average)\n\n你可能已经注意到 `top` 命令的输出中有一个\
    \ `load average` 字样后面跟着三个数字。第一个数字是过去一分钟的平均负载，第二个数字是过去五分钟的平均负载，最后一个数字是过去 15 分钟的平均负载。这里是\
    \ `top` 命令的一些示例输出。\n\n```\ntop - 20:41:23 up 5:07, 2 users, load average: 0.90,\
    \ 2.32, 1.05\n```\n\n负载平均代表系统的忙碌程度。负载平均为 `0.00` 的系统是完全空闲的。通常情况下，你可以将负载平均理解为使用或等待\
    \ CPU 时间的进程数。实际计算要复杂得多，它包含了等待其他资源的进程，包括 I/O 操作（如从磁盘读取或写入数据）。然而，离开上下文的负载平均值是没有意义的。你需要知道系统有多少个\
    \ CPU，以便确定给定的负载平均值意味着什么。\n\n假设一个单 CPU Linux 系统具有以下负载平均：`0.80`、`1.75` 和 `5.00`。这意味着在过去的一分钟内，CPU\
    \ 的利用率是 80%。你也可以说 CPU 的空闲时间占 20%。在过去的五分钟里，CPU 平均负载过载了 75%。单 CPU 系统上的负载平均值为 `1.75`\
    \ 意味着有 `.75` 个进程必须等待才能在那个 CPU 上运行。在过去的 15 分钟内，负载为 `5.00`，这意味着系统过载了 400%。\n\n如果我们在拥有\
    \ 16 个 CPU 的系统上取相同的负载平均 `0.80`、`1.75` 和 `5.00`，那么这些数字的意义就会发生巨大的变化。在单 CPU 系统上，负载平均值为\
    \ `5.00` 是非常高的，而在 16 CPU 系统上，相同的负载平均值意味着只有大约 31% 的系统资源正在使用。\n\n要查看系统中 CPU 的数量，请查看\
    \ `/proc/cpuinfo` 文件。这是一个单 CPU 系统的示例。\n\n```\n$ cat /proc/cpuinfo\nprocessor :\
    \ 0\nvendor_id : GenuineIntel\ncpu family : 6\nmodel : 61\nmodel name : Intel(R)\
    \ Core(TM) i7-5557U CPU @ 3.10GHz\nstepping : 4\nmicrocode : 0x19\ncpu MHz : 3103.175\n\
    cache size : 6144 KB\nphysical id : 0\nsiblings : 1\ncore id : 0\ncpu cores :\
    \ 1\napicid : 0\ninitial apicid : 0\nfpu : yes\nfpu_exception : yes\ncpuid level\
    \ : 5\nwp : yes\nflags : fpu vme de pse tsc msr pae mce cx8 apic sep mtrr pge\
    \ mca cmov pat pse36 clflush mmx fxsr sse sse2 syscall nx rdtscp lm constant_tsc\
    \ rep_good nopl pni monitor ssse3 lahf_lm\nbogomips : 6206.35\nclflush size :\
    \ 64\ncache_alignment : 64\naddress sizes : 39 bits physical, 48 bits virtual\n\
    power management:\n```\n\n除了 `top` 命令外，你还可以使用 `uptime` 和 `w` 命令查看负载平均值。\n\n```\n\
    $ uptime\n21:11:53 up 5:38, 2 users ,load average: 1.08, 2.03, 4.35\n$ w\n21:11:59\
    \ up 5:38, 2 users ,load average: 1.08, 2.03, 4.35\nUSER TTY FROM LOGIN@ IDLE\
