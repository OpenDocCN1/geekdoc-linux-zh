    ## Creating System or Application Accounts


    Not every account on a Linux system is meant to be used by a person. Some accounts
    exist to run applications or perform system functions. Some common examples of
    this include accounts that run web server processes, database processes, or application
    processes.


    Let’s create an account that will be used to run the Apache web server process.


    ```

    useradd -c “Apache Web Server User” -d /opt/apache -r -s /usr/sbin/nologin apache

    tail -1 /etc/passwd

    ```


    `apache:x:999:999:Apache Web Server User:/opt/apache:/usr/sbin/nologin`


    You’ll notice that the shell was set to `/usr/sbin/nologin`. This is because we
    don’t want someone to be able to log into the system using the account. We also
    use the `-r` option, which instructs `useradd` to create a system account. Effectively,
    this means the account will receive a `UID` in the system account range as defined
    in `/etc/login.defs`. In this instance the user received `UID` 999.


    The home directory was specified using the `-d` option. By default, the home directory
    for a new account is created in the `/home` directory. The actual directory will
    be the name of the user account. By default, the `apache` account’s home directory
    will be `/home/apache`. However, since this account will be used by an application,
    we set the home directory to the directory where the application is installed.


    Notice that the `-m` option was not used in this instance. When using the `-m`
    option the contents of the skeleton directory, `/etc/skel` by default, are copied
    into the user’s home directory. The contents of `/etc/skel` usually include shell
    configuration files which are not needed for application accounts.


    Here are the new options we used to create this account:


    - `-r` Create a system account.

    - `-d /path/to/home` Use `-d` to specify a home directory.


    It’s a common practice to use the same `UID` for an account across multiple systems.
    This makes syncing data or sharing data easier to do as Linux uses `UID`s to determine
    a file’s ownership. The account name is really for the sake of us humans. Let’s
    use the `-u` option to specify a `UID` when creating an account.


    ```

    useradd -c “MySQL Server” -d /opt/mysql -u 97 -s /usr/sbin/nologin mysql

    tail -1 /etc/passwd

    ```


    `mysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin`


    - `-u UID` Specify the numeric `UID` for the user.


    ## Deleting Accounts


    To delete an account, use the `userdel` command followed by the username. If you
    want to delete the account’s home directory use the `-r` option. It also removes
    the users mail spool if it exists.


    In the example, we’ll delete the `eharris` account, but leave his home directory
    intact since there are some files in there we want to use later. We’ll also delete
    the `grant` account and remove his home directory.


    ```

    ls /home

    eharris grant

    userdel eharris

    ls /home

    eharris grant

    userdel -r grant

    ls /home

    eharris

    ```


    ## Updating Accounts


    To update, or modify, an existing account, use the `usermod` command. Here are
    the most commonly used options to the `usermod` command. For a full listing of
    all the options available see `man usermod` or `usermod —help`.


    `usermod [options] username`


    - `-c “COMMENT"` Update the comment field.

    - `-g GROUP` Change the primary group.

    - `-G GROUP1,GROUPN` Change the additional groups the account belongs to.

    - `-s /path/to/shell` Change the account’s shell.


    In this example, we update the comment associated with the `mysql` account.


    ```

    grep mysql /etc/passwd

    mysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin

    usermod -c “MySQL User” mysql

    grep mysql /etc/passwd

    mysql:x:97:1003:MySQL User:/opt/mysql:/usr/sbin/nologin

    ```


    ## Groups


    Group details are stored in the `/etc/group` file.


    The first entry in the `/etc/group` file is the `root` group.


    `root:x:0:`


    Here is another sample entry from `/etc/group`.


    `sales:x:1001:john,mary`


    The format of the `/etc/group` file is as follows.


    `group_name:password:GID:account1,accountN`


    Each field is separated by a colon. The group name is the human readable name
    that you will see when group information is displayed by commands such as `ls`.


    The password is used for privileged groups, but that functionality is rarely used.
    When there is an `x` in this field it means that shadow group passwords are being
    used. That information is stored in the `/etc/gshadow` file.


    The `GID` is the group ID. It is simply a unique number which represents the group.


    The remaining field lists the members of the group separated by commas.


    You might have noticed that the `root` group did not contain a list of members.
    Remember that the `/etc/passwd` file specifies an account’s default group. In
    the case of the root user, the default `GID` is `0\`. When an account’s default
    `GID` is listed in the `/etc/passwd` file, that account is in that group even
    if it is not listed in the members field in the `/etc/group` file.


    ```

    grep root /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    grep root /etc/group

    root:x:0:

    ```


    To display the groups that a member belongs to, pass the username to the `groups`
    command. If you execute the `groups` command without supplying a username, your
    group memberships will be listed.


    `groups [options] [username]`


    Let’s confirm that the `root` user is in fact in the `root` group.


    ```

    groups root

    root

    ```


    ## Creating Groups


    To create a group, use the `groupadd` command.


    `groupadd [options] group`


    - `-g GID` Assign the numerical value for the group ID.


    The most commonly used option for the `groupadd` command is `-g`, which allows
    you to specify the `GID`. Let’s create two groups. For the first group, we’ll
    let the `group` command automatically select the `GID`. For the second group,
    we’ll specify the `GID`.


    ```

    groupadd web

    tail -1 /etc/group

    web:x:1003:

    groupadd -g 2500 db

    tail -1 /etc/group

    db:x:2500:

    ```


    ## Deleting Groups


    To delete a group, simply pass the group name to the `groupdel` command.


    `groupdel group`


    Let’s delete the `db` group.


    ```

    groupdel db

    ```


    ## Updating Groups


    To change the properties of an existing group, use the `groupmod` command.


    `groupmod [options] group`


    - `-g GID` Change the group ID.

    - `-n GROUP` Change the name of the group.


    In this example, we changed the `GID` of the `web` group from `1003` to `1234\`.
    Next’ll change the name from `web` to `http`.


    ```

    grep web /etc/group

    web:x:1003:

    groupmod -g 1234 web

    grep web /etc/group

    web:x:1234:

    groupmod -n http web

    grep http /etc/group

    http:x:1234:

    ```


    ## Putting Groups and Users Together


    In the following example, we are going to create a writers group, a tv group,
    and a movie group. Next we are going to create some user accounts. All of these
    user accounts will belong to the writers groups, but only some of them will belong
    to the tv group, while the others will belong to the movie group.


    ```

    groupadd writers

    groupadd tv

    groupadd movie

    useradd -c “Carlton Cuse” -g writers -G tv -m -s /bin/bash ccuse

    passwd ccuse

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    groups ccuse

    ccuse : writers tv

    useradd -c “David Fury” -g writers -G tv -m -s /bin/bash dfury

    passwd dfury

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    groups dfury

    dfury : writers tv

    useradd -c “Matt Damon” -g writers -G movie -m -s /bin/bash mdamon

    passwd mdamon

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    groups mdamon

    mdamon : writers movie

    ```

