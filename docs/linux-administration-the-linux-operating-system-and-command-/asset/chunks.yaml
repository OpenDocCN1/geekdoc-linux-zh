    Here is an example using `GNU Screen`. To start `Screen`, run the `screen` command.
    It may not appear as if anything has happened, but you are now in a screen session.
    To list the sessions, use the `-ls` option. Now you can start the process you
    want to ensure stays running after you have disconnected. We won’t bother starting
    it in the background since `screen` will be caputuring the output. To disconnect
    from the screen session, type `Ctrl-A` followed by `D`. If you run `screen -ls`
    again, it will show that a screen session is running, but you are not attached
    to it. At this point, you can disconnect from the server and Screen, as well as
    any processes started with it, will continue to run. To reconnect to a screen
    session, use the `-r` option. If there are multiple screen sessions, you will
    need to supply the session name as it is displayed in the `screen -ls` output.


    ```

    [jason@laptop ~]$ ssh linuxsvr

    [jason@linuxsvr ~]$ screen

    [jason@linuxsvr ~]$ screen -ls

    There is a screen on: 23478.pts-0.linuxsvr (Attached)

    1 Socket in /var/run/screen/S-jason.

    [jason@linuxsvr ~]$ do-backup.sh

    Apr 5 18:42:51 - Creating backup

    [detached from 23478.pts-0.linuxsvr]

    [jason@linuxsvr ~]$ screen -ls

    There is a screen on: 23478.pts-0.linuxsvr (Detached)

    1 Socket in /var/run/screen/S-jason.

    [jason@linuxsvr ~]$ exit

    Connection to linuxsvr closed.

    [jason@laptop ~]$ ssh linuxsvr

    [jason@linuxsvr ~]$ screen -r

    Apr 5 18:53:51 - Backup complete

    [jason@linuxsvr ~]$

    ```


    ## Load Average


    You may have noticed the words `load average` followed by a series of three numbers
    in the output of the `top` command. The first number is the load average over
    the last minute, the second number is the load average over the last five minutes,
    and the final number is the load average over the last 15 minutes. Here is some
    example output from the `top` command.


    ```

    top - 20:41:23 up 5:07, 2 users, load average: 0.90, 2.32, 1.05

    ```


    The load average represents how busy a system is. A system with a load average
    of `0.00` is completely idle. In general, you can think of load average as the
    number of processes using or waiting for CPU time. The actual calculation is a
    bit more complex and includes processes that are waiting on other resources including
    I/O operations such as reading from or writing to a disk. However, a load average
    without context is meaningless. You need to know how many CPUs a system has in
    order to determine what a given load average means.


    Let’s say a single CPU Linux system has the following load average: `0.80`, `1.75`,
    and `5.00\.`. This means that over that last minute the CPU was utilized 80% of
    the time. You could also say that the CPU was idle 20% of the time. Over the last
    five minutes, the CPU was overloaded by 75% on average. A load average of `1.75`
    on a single CPU system means that `.75` processes had to wait for a turn to run
    on that CPU. Over the last 15 minutes, the load was `5.00`, meaning that the system
    was overloaded by 400%.


    If we take the same load averages of `0.80`, `1.75`, and `5.00` on a system that
    has 16 CPUs, then the meaning of those numbers change dramatically. Having a load
    average of `5.00` on a single CPU system is a very high load average, while having
    that same load average on a 16 CPU system means that only about 31% of the system
    resources are in use.


    To view the number of CPUs in your system, look at the `/proc/cpuinfo` fie. Here
    is a single CPU system.


    ```

    $ cat /proc/cpuinfo

    processor : 0

    vendor_id : GenuineIntel

    cpu family : 6

    model : 61

    model name : Intel(R) Core(TM) i7-5557U CPU @ 3.10GHz

    stepping : 4

    microcode : 0x19

    cpu MHz : 3103.175

    cache size : 6144 KB

    physical id : 0

    siblings : 1

    core id : 0

    cpu cores : 1

    apicid : 0

    initial apicid : 0

    fpu : yes

    fpu_exception : yes

    cpuid level : 5

    wp : yes

    flags : fpu vme de pse tsc msr pae mce cx8 apic sep mtrr pge mca cmov pat pse36
    clflush mmx fxsr sse sse2 syscall nx rdtscp lm constant_tsc rep_good nopl pni
    monitor ssse3 lahf_lm

    bogomips : 6206.35

    clflush size : 64

    cache_alignment : 64

    address sizes : 39 bits physical, 48 bits virtual

    power management:

    ```


    In addition to the `top` command, you can view the load average with the `uptime`
    and `w` commands.


    ```

    $ uptime

    21:11:53 up 5:38, 2 users ,load average: 1.08, 2.03, 4.35

    $ w

    21:11:59 up 5:38, 2 users ,load average: 1.08, 2.03, 4.35

    USER TTY FROM LOGIN@ IDLE JCPU PCPU WHAT

    jason pts/0 10.0.2.2 18:52 4.00s 0.01s 0.01s screen -r

    ellen pts/1 :pts/0:S.0 18:52 4.00s 47.65s 0.00s w

    ```


    ## Memory Usage


    The `top` command also displays memory utilization for a system.


    ```

    top - 21:16:03 up 5:42, 2 users, load average: 1.07, 0.60, 0.28

    Tasks: 89 total, 3 running, 86 sleeping, 0 stopped, 0 zombie

    %Cpu(s): 94.2 us, 5.8 sy, 0.0 ni, 0.0 id, 0.0 wa, 0.0 hi, 0.0 si, 0.0 st

    KiB Mem : 1018256 total, 223076 free, 117360 used, 677820 buff/cache

    KiB Swap: 2047996 total, 2047988 free, 8 used. 718068 avail Mem

    ```


    You can also use the `free` command to display memory usage. To display in units
    of megabytes, use the `-m` option. To display in gigabytes, use the `-g` option.
    Use the `-t` option to display the totals.


    ```

    $ free -m

    total used free shared buff/cache available

    Mem: 994 114 217 6 661 701

    Swap: 1999 0 1999

    $ free -mt

    total used free shared buff/cache available

    Mem: 994 114 217 6 661 701

    Swap: 1999 0 1999

    Total: 2994 114 2217

    ```


    ## Scheduling Repeated Jobs with Cron


    If you need to repeat a task on a schedule, you can use the `cron` service. Every
    minute,the cron service checks to see if there are any scheduled jobs to run and
    if so runs them. Cron jobs are often used to automate a process or perform routine
    maintenance. You can schedule cron jobs by using the `crontab` command.


    - `cron` - A time based job scheduling service. This service is typically started
    when the system boots.

    - `crontab` - A program to create, read, update, and delete your job schedules.


    A `crontab` (cron table) is a configuration file that specifies when commands
    are to be executed by `cron`. Each line in a `crontab` represents a job and contains
    two pieces of information: 1) when to run and 2) what to run. The time specification
    consists of five fields: minute, hour, day of the month, month, and day of the
    week. After the time specification, you provide the command to be executed.


    ## Crontab Format


    `* * * * * command`


    `| | | | |`

    `| | | | — Day of the Week (0-6)`

    `| | | —- Month of the Year (1-12)`

    `| —- Day of the Month (1-31)`

    `| —- Hour (0-23)`

    `— Minute (0-59)`


    The command will only be executed when all of the time specification fields match.
    You can specify that a command be run only once, but this is not the typical use
    case for cron. Typically, one or more of the time specification fields will contain
    an asterisk (`*`) which matches any time or date. Here is an example crontab.


    # Run every Monday at 07:00.

    ```

    0 7 * * 1 /opt/sales/bin/weekly-report

    ```


    Here is a graphical representation of the above crontab entry.


    `0 7 * * 1 /opt/sales/bin/weekly-report`

    `| | | | |`

    `| | | | — Day of the Week (0-6)`

    `| | | —- Month of the Year (1-12)`

    `| | —- Day of the Month (1-31)`

    `| —- Hour (0-23)`

    `— Minute (0-59)`


    This job will run only when the minute is `0`, the hour is `7`, and the day of
    the week is `1\.`. In the day of the week, field 0 represents Sunday, 1 Monday,
    etc. This job will run on any day and during any month since the asterisk was
    used for those two fields.


    If any output is generated by the command,isit mailed to you. You can check your
    local mail with the `mail` command. If you prefer not to get email, you can redirect
    the output of the command as in this example.


    # Run at 02:00 every day and send output to a log.

    ```

    0 2 * * * /opt/acme/bin/backup > /tmp/backup.log 2>&1

    ```


    You can provide multiple values for each of the fields. If you would like to run
    a command every half-hour, you could do this.


    # Run every 30 minutes.

    ```

    0,30 * * * * /opt/acme/bin/half-hour-check

    ```


    # Another way to do the same thing.

    ```

    */2 * * * * /opt/acme/bin/half-hour-check

    ```

