    \ 地址，这指的是最初定义这些私有范围的 `RFC1918` 标准文档。\n\n如如下表所示，每个网络类都有一个专用的不可路由私有地址空间。请记住，你可以根据意愿对这些网络进行子网划分，无论它们所属的传统分类是什么。\n\
    \n| 类 | 范围 | 私有地址空间 |\n| :--- | :--- | :--- |\n| A | 1.0.0.0 - 127.255.255.255\
    \ | 10.0.0.0 - 10.255.255.255 |\n| B | 128.0.0.0 - 191.255.255.255 | 172.16.0.0\
    \ - 172.31.255.255 |\n| C | 192.0.0.0 - 233.255.255.255 | 192.168.0.0 - 192.168.255.255\
    \ |\n\n## 总结\n\n在本章中，你学习了 TCP/IP 协议如何作为网络传输数据的默认标准。你还学习了 A 类、B 类和 C 类网络。你学习了各种网络类使用的默认子网掩码和广播地址。你还学习了可以通过指定子网掩码将较大的网络划分为较小的子网。最后，你学习了哪些\
    \ IP 范围专门专门用于私有网络，以及这些 IP 地址为什么不在公共 Internet 上路由。\n\n## 测验\n\n257.19.21.228 是一个有效的\
    \ IP 地址。\n\n- 正确\n- 错误\n\n给定 IP 地址 `199.83.131.0` 和子网掩码 `255.255.255.0`，广播地址是什么？\n\
    \n- `199.83.131.0`\n- `199.83.131.1`\n- `199.83.131.255`\n- `199.255.255.255`\n\
    \n以下哪个 IP 地址不属于私有地址范围？\n\n- `10.11.12.13`\n- `11.12.13.14`\n- `172.16.255.255`\n\
    - `192.168.1.100`\n\n## 测验答案\n\n- B\n- C\n- B\n\n# Linux 网络\n\n在本章中，你将学习如何配置和控制\
    \ Linux 系统上的网络接口以及其主机名。你将学习什么是 DNS，以及如何使用 `host` 和 `dig` 工具来解析主机名和 IP 地址。你将学习\
    \ `/etc/hosts` 和 `/etc/nsswitch.conf` 文件在名称解析中起的作用。你还将介绍网络端口。接下来，你将学习什么是 DHCP\
    \ 以及如何将你的 Linux 系统配置为 DHCP 客户端。最后，我们将查看菜单驱动工具，它们可以帮助你管理最流行的 Linux 发行版中的各种网络设置。\n\
    \n要显示当前的 IP 地址，或获取系统上使用的所有 IP 地址列表，请运行带有 `address` 参数的 `ip` 命令。使用 `ip` 命令，你可以使用缩写，因此不需要运行\
    \ `ip address`，而是运行 `ip addr` 甚至 `ip a`。你也可以通过运行 `ip address show` 来更加显式。\n\n\
    以下是 `ip address` 命令的一些示例输出。你可以看到列出的两个设备：`lo` 和 `eth0`。`lo` 设备是环回设备。这是 Linux 系统用于与自身通信的特殊虚拟网络接口。环回设备的\
    \ IP 地址为 `127.0.0.1`。该系统上的另一个网络设备是 `eth0` 设备。这是一个实际硬件设备，它的 IP 地址为 `192.168.1.122`。\n\
    \n# ip address\n\n```\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state\
    \ UNKNOWN\nlink/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\ninet 127.0.0.1/8\
    \ scope host lo\nvalid_lft forever preferred_lft forever\ninet6 ::1/128 scope\
    \ host\nvalid_lft forever preferred_lft forever\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
    \ mtu 1500 qdisc pfifo_fast state UP qlen 1000\nlink/ether 08:00:27:43:f5:18 brd\
    \ ff:ff:ff:ff:ff:ff\ninet 192.168.1.122/24 brd 192.168.1.255 scope global dynamic\
    \ eth0\nvalid_lft 84249sec preferred_lft 84249sec\ninet6 fe80::a00:27ff:fe43:f518/64\
    \ scope link\nvalid_lft forever preferred_lft forever\n```\n\n除了 `ip` 命令外，还可以使用\
    \ `ifconfig` 工具来显示 IP 地址信息。在此时，`ifconfig` 实用程序被认为是过时的。然而，这个小工具在现代 Linux 系统上尚未完全消失，可能还会存在很一段时间。如果这是对你的复习，或者你来自\
    \ Unix 背景，你可能已经熟悉 `ifconfig` 命令，但不熟悉它新的替代者 `ip` 命令。在本章中，你将学习如何同时使用 `ip` 和 `ifconfig`\
    \ 命令。\n\n要使用 `ifconfig` 命令显示使用的 IP 地址，请不带任何参数地执行它。这里是 `ifconfig` 命令的一些输出。它列出了两个接口：`eth0`\
    \ 和环回设备。你会发现输出与 `ip` 命令略有不同。然而，它通过显示 IP 地址、子网掩码等更多信息完成了任务。就像使用 `ip` 命令一样，你可以看到\
    \ `eth0` 设备的 IP 为 `192.168.1.122`，环回设备的 IP 为 `127.0.0.1`。\n\n# ifconfig\n\n```\n\
    eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500\ninet 192.168.1.122\
    \ netmask 255.255.255.0 broadcast 192.168.1.255\ninet6 fe80::a00:27ff:fe43:f518\
    \ prefixlen 64 scopeid 0x20<link>\nether 08:00:27:43:f5:18 txqueuelen 1000 (Ethernet)\n\
    RX packets 82371 bytes 95773879 (91.3 MiB)\nRX errors 0 dropped 0 \n\n## 主机名\n\
    \n主机是连接到网络的设备。由于我们正在讨论 TCP/IP 网络，主机是一个服务器。主机名简单来说是对应于 IP 地址的人类易读名称。我们可以给服务器设置一个主机名，例如\
    \ `webprod01`，并通过该主机名而不是其 IP 地址（可能是 `10.9.155.174`）。这种单词主机名有时被称为短主机名或未限定主机名。\n\
    \n## DNS 主机名\n\nDNS（即域名系统）的主要用途是将人类易读的名称翻译成 IP 地址。当然，DNS 也可以反向操作。它可以将 IP 地址翻译为主机名。\n\
    \n完全限定域名名（或 FQDN）的主机还包含域名和顶级域名。FQDN 的每个部分用点分隔。\n\nTLD 代表顶级域名，是 DNS 名称的最右侧部分。常见的顶级域名包括\
    \ `.com`、`.net` 和 `.org`，但实际上还有数百种其他顶级域名。\n\n域名出现在顶级域名的左侧。这通常是公司名称、组织名称或品牌名称。\n\
    \n服务器的 FQDN 或长主机名至少包含三个用点分隔的字符串。例如，它的 FQDN 可以是 `webprod01.mycompany.com`。\n\n\
    然而，域名可以进一步划分为子域名。假设“公司”想使用子域名来识别服务器的位置。它可以使用国家域名如 `us.mycompany.com`，甚至可能有一个州子域名，类似于\
    \ `ny.us.mycompany.com`。如果我们的 Web 服务器位于纽约，它的 FQDN 可能是 `webprod01.ny.us.mycompany.com`。子域名不必对应于地理区域；它们可以是\
    \ DNS 管理员配置的任何内容。\n\n你可以通过 `hostname` 命令或运行 `uname -n` 来显示当前主机名。在下面的示例中，主机名是 `webprod01`。如果你想显示\
    \ FQDN，请运行 `hostname -f`。\n\n```\n$ hostname\nwebprod01\n\n$ uname -n\nwebprod01\n\
    \n$ hostname -f\nwebprod01.mycompany.com\n```\n\n"
