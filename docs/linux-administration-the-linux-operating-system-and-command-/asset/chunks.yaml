    You can also temporarily change the hostname of a system by supplying it as an
    argument to the `hostname` command. However, to make this persist between reboots,
    you’ll need to update the hostname configuration. This configuration varies slightly
    from distribution to distribution. For Ubuntu and RedHat systems, edit the `/etc/hostname`
    file and place your desired hostname there. For earlier versions of RedHat, you
    can edit the `/etc/sysconfig/network` file and set the `HOSTNAME` variable to
    the desired value.


    # `hostname webprod01`


    # `echo ‘webprod01’ > /etc/hostname`


    # `vi /etc/sysconfig/network`


    `HOSTNAME=webprod01`


    ## Resolving DNS Names


    Ifif you want to lookup or resolve a DNS name or an IP address, you can use the
    `host` or `dig` tools. In their simplest forms, you specify the IP address or
    dns name you want to lookup as an argument to the command. Here is an example
    of using the `host` command.


    ```

    $ host www.mycompany.com

    webprod01.mycompany.com has address 1.2.1.6


    $ host 1.2.1.6

    6.1.2.1.in-addr.arpa domain name pointer www.mycompany.com.

    ```


    Here is an example using `dig`. Use the `-x` option to perform a reverse lookup.


    ```

    $ dig www.mycompany.com

    ; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1 <<>> www.mycompany.com

    ;; global options: +cmd

    ;; Got answer:

    ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 22904

    ;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1

    ;; OPT PSEUDOSECTION:

    ; EDNS: version: 0, flags:; udp: 512

    ;; QUESTION SECTION:

    ;www.mycompany.com. IN A

    ;; ANSWER SECTION:

    www.mycompany.com. 292 IN A 1.2.1.6

    ;; Query time: 13 msec

    ;; SERVER: 10.0.2.3#53(10.0.2.3)

    ;; WHEN: Wed Jan 13 03:30:17 JST 2016

    ;; MSG SIZE rcvd: 62


    $ dig -x 1.2.1.6

    ; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1 <<>> -x 52.5.196.34

    ;; global options: +cmd

    ;; Got answer:

    ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 23203

    ;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1

    ;; OPT PSEUDOSECTION:

    ; EDNS: version: 0, flags:; udp: 512

    ;; QUESTION SECTION:

    ;6.1.2.1.in-addr.arpa. IN PTR

    ;; ANSWER SECTION:

    6.1.2.1.in-addr.arpa. 299 IN PTR www.mycompany.com

    ;; Query time: 34 msec

    ;; SERVER: 10.0.2.3#53(10.0.2.3)

    ;; WHEN: Wed Jan 13 03:33:16 JST 2016

    ;; MSG SIZE rcvd: 106

    ```


    ## The Hosts File


    The `/etc/hosts` file contains a list of IP addresses and hostnames. You can create
    entries in the hosts file by starting a line with an IP address and then following
    it with the name or names you want to translate that IP address to. The following
    example entry uses multiple names, but if you don’t need or want to access the
    system by multiple names, you can simply list one name. This entry could be one
    of many in the hosts file.


    ```

    10.11.12.13 webprod02.mycorp.com webprod02

    ```


    After you have created an entry in `/etc/hosts`, you can start communicating with
    that IP address by using the name listed in the host file. This can be useful
    if you want to access computers that do not have DNS hostnames. Also, it’s common
    to use `/etc/hosts` entries to override the DNS entry of a system. For example,
    if you have a cluster of web servers you could have a private network that only
    the web cluster members can access. You can create an entry for the members of
    the cluster in `/etc/hosts` and use their private address, thus forcing network
    communications through the private network.


    It’s important to note that `/etc/hosts` is local to the system. Adding an entry
    to the `/etc/hosts` file does not add an entry into DNS.


    Here is an example `/etc/hosts` file. You’ll see the first line contains an entry
    for `localhost`. Remember that this is used by the loopback device for internal
    communications. The next line contains the public IP address of the system followed
    by the FQDN and then the short name. The third line contains a non-routable IP
    address for `webprod02`. In this example, it’s the private IP address of that
    system. There is another similar entry for `webprod03` on the next line. The last
    line is only contains one name: `dbcluster`.


    ```

    127.0.0.1 localhost

    1.2.1.6 webprod01.mycorp.com webprod01

    10.11.12.13 webprod02.mycorp.com webprod02

    10.11.12.14 webprod03.mycorp.com webprod03

    10.11.12.15 dbcluster

    ```


    ## Name Service Switch


    NSS stands for Name Switch and it controls the order in which lookups are performed.
    Typically, the `/etc/nsswitch.conf` file determines that `hosts` file is checked
    before DNS. You can change this behavior by editing `/etc/nsswitch.conf`.


    ## Network Ports


    Just like IP addresses identify hosts on a network, ports identify the services
    on a host. When a service starts on a system, it binds itself to a port and listens
    for traffic destined for its port.


    Ports range from 1 to 65,535. Ports from 1 through 1023 are called well-known
    ports or system ports. These ports are pre-assigned ports and are used for common
    system services. These ports are also called privileged ports since it requires
    superuser privileges to open these ports. Ports above 1024 can be opened and used
    by normal users on a system are called unprivileged ports.


    The following is a very short list of common ports. For example, port 22 is reserved
    for `SSH`, 25 for `SMTP`, 80 for `HTTP`, 143 for `IMAP`, 389 for `LDAP`, and 443
    for `HTTPS`.


    | Port | Service |

    | :--- | :--- |

    | 22 | SSH |

    | 25 | SMTP |

    | 80 | HTTP |

    | 143 | IMAP |

    | 389 | LDAP |

    | 443 | HTTPS |


    When you type `https://www.mybank.com` into address bar of your web browser, your
    computer translates `www.mybank.com` into an IP address. Then, your web browser
    initiates a request to that IP address on port 443. The service—in this case a
    web server—will receive the traffic on port 443.


    The `/etc/services` file translates human-readable names into port numbers. Here
    you’ll find a list of predefined ports. You can also add to this list. For instance,
    when you install third party software, you may need to add an entry in `/etc/services`
    for the service that software provides. You can also create entries for your own
    custom written applications that use ports.


    Here is what the ports from the previous table would look like in the `/etc/services`
    file.


    ```

    ssh 22/tcp # SSH Remote Login Protocol

    smtp 25/tcp # SMTP

    https 80/tcp # HTTP

    imap2 143/udp # IMAP

    ldap 389/tcp # LDAP

    https 443/tcp # HTTP protocol over TLS/SSL

    ```

