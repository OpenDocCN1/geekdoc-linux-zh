    \ Markdown 格式)*\n"
- fmt: "\nInstead of using 0,30 for the minute field, you could have used `*/2`. You\
    \ can even use ranges with a dash. If you want to run a job every minute for the\
    \ first four minutes of the hour, you can use this time specification: `0-4 *\
    \ * * * command`.\n\nThere are several implementations of the cron scheduler and\
    \ some allow you to use shortcuts and keywords in your crontabs. Common keywords\
    \ have been provided below, but refer to the documentation for cron on your system\
    \ to ensure these will work.\n\n| Keyword | Description | Equivalent |\n| :---\
    \ | :--- | :--- |\n| `@yearly` | Run once a year at midnight in the morning on\
    \ January 1 | `0 0 1 1 *` |\n| `@annually` | Same as `@yearly` | `0 0 1 1 *` |\n\
    | `@monthly` | Run once a month at midnight in the morning on the first day of\
    \ the month | `0 0 1 * *` |\n| `@weekly` | Run once a week at midnight in the\
    \ morning on Sunday | `0 0 * * 0` |\n| `@daily` | Run once a day at midnight |\
    \ `0 0 * * *` |\n| `@midnight` | Same as `@daily` | `0 0 * * *` |\n| `@hourly`\
    \ | Run once an hour at the beginning of the hour | `0 * * * *` |\n| `@reboot`\
    \ | Run at startup | N/A |\n\n## Using the Crontab Command\n\nUse the `crontab`\
    \ command to manipulate cron jobs.\n\n- `crontab [file]` - Install a new crontab\
    \ from file.\n- `crontab -l` - List your cron jobs.\n- `crontab -e` - Edit your\
    \ cron jobs.\n- `crontab -r` - Remove all of your cron jobs.\n\n```bash\n$ crontab\
    \ -l\nno crontab for bob\n$ cat my-cron\n# Run every Monday at 07:00.\n0 7 * *\
    \ 1 /opt/sales/bin/weekly-report\n$ crontab my-cron\n$ crontab -l\n# Run every\
    \ Monday at 07:00.\n0 7 * * 1 /opt/sales/bin/weekly-report\n$ crontab -e\n# $EDITOR\
    \ is invoked.\n$ crontab -r\n$ crontab -l\nno crontab for bob\n$\n```\n\n## Summary\n\
    \nIn this chapter, you learned how to view the running processes with the `ps`,\
    \ `pstree`, `top`, and `htop` commands. Next, you learned how to start jobs in\
    \ the background as well as how to view, suspend, resume, and kill those jobs.\
    \ You also learned how to kill processes with the `kill`, `pkill`, and `killall`\
    \ commands. Next, process priority and niceness were covered. You learned how\
    \ to use the `nohup` command to ensure a long running process continues to run\
    \ even if you disconnect from the Linux system. You also learned about load averages\
    \ and how to determine the number of CPUs in a Linux system. Finally, you learned\
    \ how to schedule jobs using the cron service.\n\n## Quiz\n\nWhich command is\
    \ used to view running processes?\n- `ps` \n- `pid`\n- `proc`\n- `lsproc`\n\n\
    What character is placed at the end of a command line to start the command in\
    \ the background?\n- `-`\n- `?`\n- `\\`\n- `&`\n\nThe `kill` command can be used\
    \ to kill processes and jobs.\n- True\n- False\n\nWhich command is used to create,\
    \ read, update, and delete cron jobs?\n- `cron`\n- `crond`\n- `crontab`\n- `vicron`\n\
    \nWhich of the following cron jobs will run at 08:00 AM every day?\n- `8 0 0 *\
    \ * /opt/acme/bin/backup`\n- `8 0 * * * /opt/acme/bin/backup`\n- `8 * * * * /opt/acme/bin/backup`\n\
    - `0 8 * * * /opt/acme/bin/backup`\n\n## Quiz Answers\n\nA\nD\nA\nC\nD\n\n## File\
    \ and Directory Permissions\n\nLooking back at the long listings provided by the\
    \ `ls` command, you can see that the first bit of information displayed is the\
    \ permissions for the given file or directory.\n\n```bash\n$ ls -l sales.data\n\
    -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\nThe first character\
    \ in the permissions string reveals the type. For example, `-` is a regular file,\
    \ `d` is a directory, and `l` is a symbolic link. Those are the most common types\
    \ you will encounter. For a full listing, read the `ls` man page.\n\n| Symbol\
    \ | Type |\n| :--- | :--- |\n| `-` | Regular file |\n| `d` | Directory |\n| `l`\
    \ | Symbolic link |\n\nYou will also notice other characters in the permissions\
    \ string. They represent the three main types of permissions: read, write, and\
    \ execute. Each one is represented by a single letter, also known as a symbol.\
    \ Read is represented by `r`, write by `w`, and execute by `x`.\n\n| Symbol |\
    \ Permission |\n| :--- | :--- |\n| `r` | Read |\n| `w` | Write |\n| `x` | Execute\
    \ |\n\nRead, write, and execute are rather self explanatory. If you have “read”\
    \ permissions, you can see the contents of the file. If you have “write” permissions,\
    \ you can modify the file. If you have “execute” permissions, you can run the\
    \ file as a program. However, when these permissions are applied to directories,\
    \ they have a slightly different meaning than when they are applied to files.\n\
    \n| Permission | File Meaning | Directory Meaning |\n| :--- | :--- | :--- |\n\
    | Read | Allows a file to be read. | Allows file names in the directory to be\
    \ read. |\n| Write | Allows a file to be modified. | Allows entries to be modified\
    \ within the directory. |\n| Execute | Allows the execution of a file. | Allows\
    \ access to contents and metadata for entries in the directory. |\n\nThere are\
    \ three categories of users that these permissions can be applied to. These categories—or\
    \ classes—user, group, and other. Like the permission types, each set is represented\
    \ by a single letter. The user who owns the file is represented by `u`, the users\
    \ in the file’s group are represented by `g`, and the other users who do not own\
    \ the file or are not in the file’s group are represented by `o`. The character\
    \ `a` represents all, meaning user, group, and other. Even though these characters\
    \ do not show up in `ls` listing, they can be used to change permissions.\n\n\
    | Symbol | Category |\n| :--- | :--- |\n| `u` | User |\n| `g` | Group |\n| `o`\
    \ | Other |\n| `a` | All - user, group, and other. |\n\nEvery user is a member\
    \ of at least one group, called their primary group. However, users can and often\
    \ are members of many groups. Groups are used to organize users into logical sets.\
    \ For-example, if members of the sales team need access to some of the same files\
    \ and directories, they can be placed into the `sales` group.\n\nRun the `groups`\
    \ command to see what groups you are a member of. If you supply another users\
    \ ID as an argument to the `groups` command, you will see the list of groups to\
    \ which that user belongs. You can also run `id -Gn [user]` to get the same result.\n\
    \n```bash\n$ groups\nusers sales\n$ id -Gn\nusers sales\n$ groups pat\nusers projectx\
    \ apache\n$ groups jill\nusers sales manager\n```\n\n## Secret Decoder Ring for\
    \ Permissions\n\nNow you have enough background information to start decoding\
    \ the permissions string. The first character is the type. The next three characters\
    \ represent the permissions available to the user, also known as the owner of\
    \ the file. The next three characters represent the permissions available to the\
    \ members of the file’s group. The final three characters represent the permissions\
    \ available to all others.\n\nIn this case, order has meaning. Permission types\
    \ will be displayed for user, followed by group, and finally for others. Also,\
    \ the permission types of read, write, and execute are displayed in that order.\
    \ If a particular permission is not granted, a hyphen (`-`) will take its place.\n\
    \nHere is a graphical representation of the permission information displayed by\
    \ `ls -l`.\n\n![](Images/00001.jpeg)\n\nIf you happen to see an extra character\
    \ at the end of the permissions string, an alternative access control method has\
    \ been applied. If you see a period (`.`), the file or directory has an SELinux\
    \ (Security Enhanced Linux) security context applied to it. If you see a plus\
    \ sign (`+`), ACLs (Access Control Lists) are in use. SELlinux and ACLs are beyond\
    \ the scope of this book. However, you will be pleased to know that the use of\
    \ either is rare. If you are having trouble with permissions and notice an extra\
    \ character in the permissions string, know that further investigation may be\
    \ necessary.\n\n```bash\n$ ls -l sales.data.selnx\n-rw-r—r—. 1 bob users 10400\
    \ Sep 27 08:52 sales.data.selnx\n$ ls -l sales.data.acl\n-rw-r—r—+ 1 bob users\
    \ 10400 Sep 27 08:52 sales.data.acl\n```\n"
