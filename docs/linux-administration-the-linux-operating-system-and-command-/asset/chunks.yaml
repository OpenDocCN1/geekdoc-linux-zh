    \ mca cmov pat pse36 clflush mmx fxsr sse sse2 syscall nx rdtscp lm constant_tsc\
    \ rep_good nopl pni monitor ssse3 lahf_lm\nbogomips : 6206.35\nclflush size :\
    \ 64\ncache_alignment : 64\naddress sizes : 39 bits physical, 48 bits virtual\n\
    power management:\n```\n\n除了 `top` 命令外，你还可以使用 `uptime` 和 `w` 命令查看负载平均值。\n\n```\n\
    $ uptime\n21:11:53 up 5:38, 2 users ,load average: 1.08, 2.03, 4.35\n$ w\n21:11:59\
    \ up 5:38, 2 users ,load average: 1.08, 2.03, 4.35\nUSER TTY FROM LOGIN@ IDLE\
    \ JCPU PCPU WHAT\njason pts/0 10.0.2.2 18:52 4.00s 0.01s 0.01s screen -r\nellen\
    \ pts/1 :pts/0:S.0 18:52 4.00s 47.65s 0.00s w\n```\n\n## 内存使用 (Memory Usage)\n\
    \n`top` 命令也显示系统的内存利用率。\n\n```\ntop - 20:41:23 up 5:07, 2 users, load average:\
