    你也可以通过将主机名作为 `hostname` 命令的参数传递来临时更改系统的主机名。然而，为了使此更改在重启后依然有效，你需要更新主机名配置。该配置在不同的发行版之间略有不同。对于
    Ubuntu 和 RedHat 系统，请编辑 `/etc/hostname` 文件并将所需的主机名写入其中。对于较早版本的 RedHat，你可以编辑 `/etc/sysconfig/network`
    文件，并将 `HOSTNAME` 变量设置为所需的值。


    # `hostname webprod01`


    # `echo ‘webprod01’ > /etc/hostname`


    # `vi /etc/sysconfig/network`


    `HOSTNAME=webprod01`


    ## 解析 DNS 名称


    如果你想查询或解析 DNS 名称或 IP 地址，可以使用 `host` 或 `dig` 工具。在最简单的形式下，你将要查询的 IP 地址或 DNS 名称作为命令的参数即可。以下是使用
    `host` 命令的示例。


    ```

    $ host www.mycompany.com

    webprod01.mycompany.com has address 1.2.1.6


    $ host 1.2.1.6

    6.1.2.1.in-addr.arpa domain name pointer www.mycompany.com.

    ```


    这里是一个使用 `dig` 的示例。使用 `-x` 选项执行反向查询。


    ```

    $ dig www.mycompany.com

