    ```


    The `mkfs` utility is actually a front-end for the various file builders. Running
    `mkfs -t ext4 /dev/sdb3` is actually the same as running `mkfs.ext4 /dev/sdb3`.
    If you want to see the options available for a file system, consult the man page
    for the given command. For example, you can run `man mkfs.xfs` to find more information
    about creating XFS file systems.


