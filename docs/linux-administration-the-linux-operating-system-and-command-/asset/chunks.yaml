    ## Creating Filesystems


    Before a partition can be used by a Linux system, it will need a filesystem. The
    extended file system, or `ext` for short, was created specifically for Linux.
    It was soon replaced with `ext2`, the second extended file system. Since then,
    `ext3` (the third extended file system) and `ext4` (the fourth extended file system)
    have been released. These are the most commonly used file systems on Linux systems
    and are often found as the default file systems on Linux distributions. If you
    have special needs, you should research some of the other popular filesystems
    available on Linux. These include ReiserFS, `JFS`, `XFS`, `ZFS`, and `Btrfs`.


    To create a filesystem, use the `mkfs` command. The format is `mkfs -t TYPE DEVICE`.
    The `TYPE` will be a file system type such as `ext3`, `btrfs`, etc. The `DEVICE`
    is the path to the partition on which you want the file system to reside. Here
    is how to create an `ext3` file system on the second partition of the `sdb` disk
    (`/dev/sdb2`).


    ```

    # mkfs -t ext3 /dev/sdb2


    mke2fs 1.42.9 (28-Dec-2013)


    Filesystem label=

    OS type: Linux


    Block size=4096 (log=2)


    Fragment size=4096 (log=2)


    Stride=0 blocks, Stripe width=0 blocks

    ```


