- fmt: "\nThe main configuration file for rsyslog is `/etc/rsyslog.conf`. You can\
    \ include additional configuration files by using the `$IncludeConfig` directive.\
    \ For example, this line will cause rsyslog to read and include all the configuration\
    \ files that end in `.conf` in the `/etc/rsyslog.d` directory.\n\n```\n$IncludeConfig\
    \ /etc/rsyslog.d/*.conf\n```\n\nLogging rules consist of two fields. The first\
    \ field is called the selector field and it lists the facilities and severities\
    \ of messages to include in the rule. The second field is called the action field\
    \ and it determines what will happen to the messages matched by the selector field.\
    \ The most common action is to write the messages to a log file. The selector\
    \ field and action field can be separated by one or more spaces or tabs.\n\nThe\
    \ format of the selector field is `FACILITY.SEVERITY`. Note that wildcards are\
    \ supported. For example, use the `mail.*` selector to match all the mail messages.\
    \ You can also omit the `.SEVERITY` if you want to include all messages from the\
    \ facility. In short, `mail.*` and `mail` are equivalent. If you do not want to\
    \ match any messages from a facility use `FACILITY.none`. If you want to match\
    \ multiple facility/severity pairs, separate each pair with a semicolon.\n\nThis\
    \ example rule matches messages that have the facility of mail and any severity.\
    \ It writes all the matching messages to `/var/log/mail.log`.\n\n```\nmail.* /var/log/mail.log\n\
    ```\n\nIf the path starts with a minus sign that tells rsyslog that it doesn’t\
    \ have to perform a `sync()` operation for each log message. This is sometimes\
    \ called caching mode. When using caching mode, know that some message might be\
    \ lost if a system crashes immediately after a write attempt. However, you may\
    \ see performance improvements during normal operations if you have a system that\
    \ performs many logging operations. The default configurations that ship with\
    \ a Linux distribution will probably have a mix of caching (`-/path`) and non-caching\
    \ (`/path`) rules with less critical messages using caching. Here’s an example.\n\
    \n```\nmail.* -/var/log/mail.log\n```\n\nIn this example, there are separate actions\
    \ for different severities of mail messages. Notice that the less critical mail\
    \ messages are using caching mode.\n\n```\nmail.info -/var/log/mail.info\nmail.warn\
    \ -/var/log/mail.warn\nmail.err /var/log/mail.err\n```\n\nThis example is taken\
    \ from an Ubuntu system. The first line ensures all messages from the auth and\
    \ authpriv facilities are written to `/var/log/auth.log`. The second line writes\
    \ all messages except ones originating from the auth and authpriv facilities to\
    \ `/var/log/syslog`.\n\n```\nauth,authpriv.* /var/log/auth.log\n*.*;auth.none,authpriv.none\
    \ -/var/log/syslog\n```\n\nThis example is taken from a RedHat Enterprise Linux\
    \ system. The rule tells rsyslog to write all messages except mail, authpriv,\
    \ and cron to `/var/log/messages`.\n\n```\n*.info;mail.none;authpriv.none;cron.none\
    \ /var/log/messages\n```\n\nHopefully you can see why it’s important to understand\
    \ how to determine where messages are being sent instead of simply memorizing\
    \ that system messages are stored in `/var/log/messages`. Different distributions\
    \ ship with different configurations and different companies, organizations, and\
    \ system administrators may alter the default rules to suit their particular needs.\n\
    \n## Creating Your Own Syslog Messages\n\nYou can use the `logger` command to\
    \ generate syslog messages. This can prove useful if you want to test any configuration\
    \ changes you’ve made to the system logger or if you want to generate log message\
    \ from your own shell scripts. Use the `-p` option to provide a `FACILITY.SEVERITY`\
    \ level. If you don’t specify a facility/severity pair, it will default to `user.notice`.\
    \ You can also use the `-t` option to tag your message.\n\n```\nlogger [options]\
    \ message\n```\n\nIn this example, we generate a message with the mail facility\
    \ at a severity level of info. You can see that the message made its way to the\
    \ proper log file.\n\n```\n$ logger -p mail.info -t mailtest “Testing 123.”\n\
    $ sudo tail -1 /var/log/mail.log\nApr 4 14:33:16 linuxsvr mailtest: Testing 123.\n\
    ```\n\n## Rotating Log Files\n\nYou can use the `logrotate` tool to rotate, compress,\
    \ remove, and even mail log files. This provides an automated way to manage log\
    \ files and can help prevent filling up your storage space with log messages.\n\
    \nThe configuration file for `logrotate` is located at `/etc/logrotate.conf`.\
    \ Like many other configuration files it may use an include directive. This line\
    \ tells `logrotate` to read configuration files located in the `/etc/logrotate.d`\
    \ directory.\n\n```\ninclude /etc/logrotate.d\n```\n\nHere is a sample `logrotate.conf`\
    \ file.\n\n```text\n# see “man logrotate” for details\n# rotate log files weekly\n\
    weekly\n# keep 4 weeks worth of backlogs\nrotate 4\n# create new (empty) log files\
    \ after rotating\n# old ones\ncreate\n# uncomment if you want your log files compressed\n\
    #compress\n# packages drop log rotation information\n# into this directory\ninclude\
    \ /etc/logrotate.d\n```\n\nThe configuration in the main file contains some defaults.\
    \ For example, the `weekly` keyword ensures that log files will be rotated every\
    \ week. The `rotate 4` line tells `logrotate` to keep 4 weeks worth of logs. Logs\
    \ older than this will be removed. The `create` line makes sure that a new empty\
    \ log file is created after it is rotated.\n\nThis is a sample `logrotate` configuration\
    \ file from an Ubuntu system. It is located at `/etc/logrotate.d/rsyslog`. It\
    \ handles the log rotation for all the files associated with rsyslog.\n\n```text\n\
    /var/log/syslog\n{\n    rotate 7\n    daily\n    missingok\n    notifempty\n \
    \   delaycompress\n    compress\n    postrotate\n    reload rsyslog >/dev/null\
    \ 2>&1 || true\n    endscript\n}\n\n/var/log/mail.info\n/var/log/mail.warn\n/var/log/mail.err\n\
    /var/log/mail.log\n/var/log/daemon.log\n/var/log/kern.log\n/var/log/auth.log\n\
    /var/log/user.log\n/var/log/lpr.log\n/var/log/cron.log\n/var/log/debug\n/var/log/messages\n\
    {\n    rotate 4\n    weekly\n    missingok\n    notifempty\n    compress\n   \
    \ delaycompress\n    sharedscripts\n    postrotate\n    reload rsyslog >/dev/null\
    \ 2>&1 || true\n    endscript\n}\n```\n\nNotice that the format is a single log\
    \ file, or list of log files, followed by the configuration that controls those\
    \ log files. The configuration is enclosed in brackets. Here are the configuration\
    \ options used.\n\n- `rotate count`: Rotate the files by count times before removing\
    \ them.\n- `daily`: Rotate log files every day.\n- `weekly`: Rotate log files\
    \ weekly.\n- `missingok`: Ignore missing log files. (Do not issue an error.)\n\
    - `notifempty`: Do not rotate the log file if it is empty.\n- `compress`: Compress\
    \ rotated log files.\n- `postrotate`: The lines between `postrotate` and `endscript`\
    \ are executed using `/bin/sh`. These commands are executed after the rotation.\n\
    \n## Testing Your Logrotate Configuration\n\nIf you make changes to your logrotate\
    \ configuration and want to test it, use the following command.\n\n```bash\nlogrotate\
    \ -fv /etc/logrotate.conf\n```\n\nThe `-f` option tells `logrotate` to force a\
    \ rotation while the `-v` option enables verbose logging.\n\n## Summary\n\nIn\
    \ this chapter, you learned about the syslog standard and how it assigns a facility\
    \ and severity to each message. You also learned that syslog servers employ the\
    \ use of logging rules to determine what action to perform on a given message.\
    \ Typically, the action is to simply store the message in a log file. You also\
    \ learned how to test the syslog server configuration by generating messages with\
    \ the `logger` utility. Finally, you learned how to use `logrotate` to automatically\
    \ prune system logs.\n\n## Quiz\n\nThe syslog standard:\nA. Aids in the processing\
    \ of messages.\nB. Allows logging to be centrally controlled.\nC. Uses facilities\
    \ and severities to categorize messages.\nD. All of the above.\n\nWhich command\
    \ can you use to generate log messages?\nA. `logger`\nB. `log`\nC. `logit`\nD.\
    \ There is no such command.\n\n## Quiz Answers\n\nD, A\n\n# Disk Management\n\n\
    When a disk or storage device is “partitioned” it is divided into parts. Each\
    \ one of these parts is called a partition. Partitioning a disk allows you to\
    \ allocate different sections of the disk for different purposes.\n"
