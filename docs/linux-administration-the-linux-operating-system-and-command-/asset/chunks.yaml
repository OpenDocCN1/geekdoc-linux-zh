    ## Trace Route


    Ping tests an endpoint, but it doesn’t tell you anything about the path or route
    the network packets take. To examine the route, use the traceroute command. Note
    that the traceroute command requires root privileges to function properly.


    By default, traceroute will attempt to translate IP addresses into DNS names.
    If you want to skip that step and just work with IP address, use the -n option.
    This will speed things up a bit and can be helpful if you are experiencing DNS
    issues. This output is easier to read than DNS names, in my opinion.


    # traceroute -n google.com


    traceroute to google.com (2.5.2.7), 30 hops max, 60 byte packets


    Diagnosing Network Connections 413


    1 10.0.2.2 0.296 ms 0.178 ms 0.220 ms


    2 192.168.1.1 2.529 ms 2.713 ms 2.630 ms


    3 72.14.237.231 23.750 ms 22.087 ms 12.12.132.137 22.701 ms


    4 216.58.216.78 20.549 ms 12.250.16.30 22.904 ms 216.58.216.78 20.724 ms


    The traceroute command sends 3 packets to each hop along the way. You can see
    the response times for each hop along the route. The first hop is very quick while
    the last hop is slower. This is expected behavior. However, if one of the hops
    along the path takes a very long time to respond, that’s an indication of where
    an issue may exist. Maybe there is network congestion on that particular router,
    for instance.


    If you see an asterisk where you normally see times, that means a reply wasn’t
    received. Some routers are actually configured to block traceroute data. In these
    cases the traceroute command may be of little use to you. If network connectivity
    is otherwise working and you see asterisks in the traceroute output, that probably
    means a router is blocking traceroute data and not that there is an actual problem.


    Network troubleshooting consists of looking at the same situation from multiple
    angles, using multiple tools, and drawing conclusions from the overall picture.
    It also helps to know how your particular network is configured. Situational awareness
    is the key to network troubleshooting. You cannot simply rely on one tool like
    ping or traceroute and be guaranteed you know what is happening on a network.


    An alternative to traceroute is tracepath. The tracepath command does not require
    root privileges. You can use the -n option to use IP addresses instead of DNS
    names just like you can with traceroute.


    The tracepath command will produce one line of output for each response it receives,
    unlike tracreoute which produces one line of output per hop. In the following
    example, you’ll see that two responses were received from 10.0.2.2.


    $ tracepath -n google.com


    1?: [LOCALHOST] pmtu 1500


    1: 10.0.2.2 0.470ms


    1: 10.0.2.2 0.649ms


    2: 192.168.1.1 2.147ms asymm 64


    …


    For simple checks, tracepath can do the trick. For advanced options, you’ll probably
    end up using traceroute.


    ## Network Statistics


    The netstat command can be used to collect a wide variety of network information.
    Here are some of my favorite and most used netstat options.


    -n Display numerical addresses and ports.


    -i Displays a list of network interfaces.


    -r Displays the route table. (netstat -rn)


    -p Display the PID and program used.


    -l Display listening sockets. (netstat -nlp)


    -t Limit the output to TCP (netstat -ntlp)


    -u Limit the output to UDP (netstat -nulp)


    The -n option is used to display numerical IP addresses and ports as opposed to
    hostnames and service names. You can use this option in conjunction with most
    other netstat options.


    Get a list of network interfaces on your system by using the -i option.


    To display routing information, use -r. I often use netstat -rn to display the
    routes using IP addresses.'
