    If you are having trouble connecting to a host over a network, one of the first
    things you can is to `ping` the host. The `ping` command sends one or more ICMP
    packets to a host that you specify and waits for a reply.


    To use the `ping` command, simply run `ping` and provide a hostname or IP address.
    By default, `ping` will keep sending packets until you stop the program with `Control-C`.
    If you want to specify the number of packets to send, use the `-c` option. For
    example, to send three packets to `google.com` run `ping -c 3 google.com`.


    Here is the output of a `ping` command.


    ```

    $ ping -c 3 google.com


    PING google.com (2.5.2.7) 56 bytes of data.

    64 bytes from 2.5.2.7: icmp_seq=1 ttl=53 time=20.1 ms

    64 bytes from 2.5.2.7: icmp_seq=2 ttl=53 time=20.2 ms

    64 bytes from 2.5.2.7: icmp_seq=3 ttl=53 time=23.9 ms

    – google.com ping statistics –

    3 packets transmitted, 3 received, 0% packet loss, time 2004ms

    rtt min/avg/max/mdev = 21.489/22.924/24.154/1.111 ms

    ```


    You should notice that the hostname was translated into an IP address. In this
    case, `google.com` resolved to `2.5.2.7`. If the name doesn’t resolve you’ll get
    an “unknown host” error. In that case you should use the IP address, of the system
    you are trying to connect to. Also, if you can `ping` by IP address but not by
    name, there is a problem with the resolution of the DNS name.


    That `ping` command sent three packets. The statistics section reported that 3
    replies were received and thus no packet loss was encountered. This means we have
    network connectivity to `google.com`. You’ll also notice that each packet has
    a time associated with it. In this example the first reply was received in 20
    milliseconds as was the second packet. The third reply took 23.9 milliseconds.
    You’ll see a summary of this activity on the last line in the output. RTT stands
    for “Round Trip Time”.


    Here is an example where no replies were received. You’ll see that 100% packet
    loss is reported. This means there is no network connectivity between this host
    and `google.com`.


    ```

    $ ping -c 3 google.com


    PING google.com (2.5.2.7) 56 bytes of data.

    From 2.5.2.7 icmp_seq=1 Destination Host Unreachable

    From 2.5.2.7 icmp_seq=2 Destination Host Unreachable

    From 2.5.2.7 icmp_seq=3 Destination Host Unreachable

    – google.com ping statistics –

    3 packets transmitted, 0 received, +3 errors, 100% packet loss, time 2002ms

    ```


    At this point, the only thing we know is we can’t `ping` `google.com`. It doesn’t
    necessarily mean that `google.com` is down. At this point, I should try to `ping`
    something on my local network. If I cannot `ping` anything on my local network,
    then I have a problem with my host. Maybe my network cable was accidentally disconnected.
    Maybe I performed an upgrade on my server and the network drivers didn’t update
    properly. Maybe I forget to start the networking services on my server after I
    performed some maintenance. The point is I at least know where to start looking.


    If I could successfully `ping` another host on my local network, then the problem
    lies outside of my system. Maybe the router on the edge of my company’s network
    is down and I cannot reach any hosts on the public internet. We could test that
    scenario by `pinging` other hosts like `facebook.com` or `youtube.com`. If we
    can `ping` `Facebook` and `Youtube`, then it’s a problem specifically getting
    to `Google`. Perhaps `Google` installed a firewall that simply discards ICMP packets
    and thus `pings` will never work. If that turns out to be the case, then we’ll
    need to use other tools to test network connectivity, which we’ll be covering
    soon.


    This example demonstrates `pinging` an IP address. This IP address is on same
    local network as the host I’m running the command from and the responce times
    are very fast. It’s less than 1 millisecond in fact.


    ```

    $ ping -c 3 10.0.2.2


    PING 10.0.2.2 (10.0.2.2) 56(84) bytes of data.

    64 bytes from 10.0.2.2: icmp_seq=1 ttl=63 time=0.272 ms

    64 bytes from 10.0.2.2: icmp_seq=2 ttl=63 time=0.103 ms

    64 bytes from 10.0.2.2: icmp_seq=3 ttl=63 time=0.202 ms

    – 10.0.2.2 ping statistics –

    3 packets transmitted, 3 received, 0% packet loss, time 2001ms

    rtt min/avg/max/mdev = 0.103/0.192/0.202/0.111 ms

    ```


