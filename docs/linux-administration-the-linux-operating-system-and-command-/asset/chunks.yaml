    `gedit` - Gnome 桌面环境的默认文本编辑器。


    `gvim` - `vim` 的图形版本。


    `kedit` - KDE 桌面环境的默认文本编辑器。


    如果你正在寻找 Microsoft Word 的替代品，可以考虑 `AbiWord` 或 `LibreOffice`。`LibreOffice` 不仅包含文字处理器，还是一个完整的办公套件，包含电子表格程序、数据库和演示文稿。


    如果你正在寻找辅助计算机编程的源代码编辑器，可以查看 `Geany`、`jEdit` 或 `Kate`。`Sublime Text` 是另一个选择。它是一个运行在
    Windows、Mac 和 Linux 上的商业产品。


    ## 指定默认编辑器


    某些命令依赖 `$EDITOR` 环境变量来告诉它们使用哪个程序进行编辑。由于 `cron` 的主要目的是调度作业，它将编辑文件的任务委托给另一个程序。`crontab
    -e` 命令会调用 `$EDITOR` 环境变量指定的编辑器。你可以在个人初始化文件中设置 `$EDITOR`，以确保使用你喜欢的编辑器，无论是 `nano`、`emacs`、`vi`
    还是其他。


    ```

    $ echo $EDITOR

    vi

    ```


    ## 总结


    在本章中，你学习了如何查看和编辑文件。首先，你学习了如何使用 `cat`、`more`、`less`、`head` 和 `tail` 命令显示文件内容。接着，你学习了如何使用
    `nano` 文本编辑器。随后，介绍了 `vim` 编辑器。接着介绍了 `emacs` 文本编辑器。最后，解释了图形化文本编辑器。


