    mode. When using caching mode, know that some message might be lost if a system
    crashes immediately after a write attempt. However, you may see performance improvements
    during normal operations if you have a system that performs many logging operations.
    The default configurations that ship with a Linux distribution will probably have
    a mix of caching (-/path) and non-caching (/path) rules with less critical messages
    using caching. Here’s an example.


    mail.* -/var/log/mail.log


    In this example, there are separate actions for different severities of mail messages.
    Notice that the less critical mail messages are using caching mode.


    mail.info -/var/log/mail.info


    mail.warn -/var/log/mail.warn


    mail.err /var/log/mail.err


    This example is taken from an Ubuntu system. The first line ensures all messages
    from the auth and authpriv facilities are written to /var/log/auth.log. The second
    line writes all messages except ones originating from the auth and authpriv facilities
    to /var/log/syslog.


    auth,authpriv.* /var/log/auth.log


    *.*;auth.none,authpriv.none -/var/log/syslog


    This example is taken from a RedHat Enterprise Linux system. The rule tells rsyslog
    to write all messages except mail, authpriv, and cron to /var/log/messages.


    *.info;mail.none;authpriv.none;cron.none /var/log/messages


    Hopefully you can see why it’s important to understand how to determine where
    messages are being sent instead of simply memorizing that system messages are
    stored in /var/log/messages. Different distributions ship with different configurations
    and different companies, organizations, and system administrators may alter the
    default rules to suit their particular needs.


    ## Creating Your Own Syslog Messages


    You can use the logger command to generate syslog messages. This can prove useful
    if you want to test any configuration changes you’ve made to the system logger
    or if you want to generate log message from your own shell scripts. Use the -p
    option to provide a FACILITY.SEVERITY level. If you don’t specify a facility/severity
    pair, it will default to user.notice. You can also use the -t option to tag your
    message.


    logger [options] message


    In this example, we generate a message with the mail facility at a severity level
    of info. You can see that the message made its way to the proper log file.


    $ logger -p mail.info -t mailtest “Testing 123.”


    $ sudo tail -1 /var/log/mail.log


    Apr 4 14:33:16 linuxsvr mailtest: Testing 123.


    ## Rotating Log Files


    You can use the logrotate tool to rotate, compress, remove, and even mail log
    files. This provides an automated way to manage log files and can help prevent
    filling up your storage space with log messages.


    The configuration file for logrotate is located at /etc/logrotate.conf. Like many
    other configuration files it may use an include directive. This line tells logrotate
    to read configuration files located in the /etc/logrotate.d directory.


    include /etc/logrotate.d


    Here is a sample logrotate.conf file.


    # see “man logrotate” for details


    # rotate log files weekly


    weekly


    # keep 4 weeks worth of backlogs


    rotate 4


    # create new (empty) log files after rotating


    # old ones


    create


    # uncomment if you want your log files compressed


    #compress


    # packages drop log rotation information


    # into this directory


    include /etc/logrotate.d


    The configuration in the main file contains some defaults. For example, the weekly
    keyword ensures that log files will be rotated every week. The rotate 4 line tells
    logrotate to keep 4 weeks worth of logs. Logs older than this will be removed.
    The create line makes sure that a new empty log file is created after it is rotated.


    This is a sample logrotate configuration file from an Ubuntu system. It is located
    at /etc/logrotate.d/rsyslog. It handles the log rotation for all the files associated
    with rsyslog.


    /var/log/syslog


    {


    rotate 7


    daily


    missingok


    notifempty


    delaycompress


    compress


    postrotate


    reload rsyslog >/dev/null 2>&1 || true


    endscript


    }


    /var/log/mail.info


    /var/log/mail.warn


    /var/log/mail.err


    /var/log/mail.log


    /var/log/daemon.log


    /var/log/kern.log


    /var/log/auth.log


    /var/log/user.log


    /var/log/lpr.log


    /var/log/cron.log


    /var/log/debug


    /var/log/messages


    {


    rotate 4


    weekly


    missingok


    notifempty


    compress


    delaycompress


    sharedscripts


    postrotate


    reload rsyslog >/dev/null 2>&1 || true


    endscript


    }


    Notice that the format is a single log file, or list of log files, followed by
    the configuration that controls those log files. The configuration is enclosed
    in brackets. Here are the configuration options used.


    rotate count Rotate the files by count times before removing them.


    daily Rotate log files every day.


    weekly Rotate log files weekly.


    missingok Ignore missing log files. (Do not issue an error.)


    notifempty Do not rotate the log file if it is empty.


    compress Compress rotated log files.


    postrotate The lines between postrotate and endscript are executed using /bin/sh.
    These commands are executed after the rotation.


    ## Testing Your Logrotate Configuration


    If you make changes to your logrotate configuration and want to test it, use the
    following command.


    # logrotate -fv /etc/logrotate.conf


    The -f option tells logrotate to force a rotation while the -v option enables
    verbose logging.


    ## Summary


    In this chapter, you learned about the syslog standard and how it assigns a facility
    and severity to each message. You also learned that syslog servers employ the
    use of logging rules to determine what action to perform on a given message. Typically,
    the action is to simply store the message in a log file. You also learned how
    to test the syslog server configuration by generating messages with the logger
    utility. Finally, you learned how to use logrotate to automatically prune system
    logs.


    ## Quiz


    The syslog standard:


    Aids in the processing of messages.


    Allows logging to be centrally controlled.


    Uses facilities and severities to categorize messages.


    All of the above.


    Which command can you use to generate log messages?


    logger


    log


    logit


    There is no such command.


    ## Quiz Answers


    D


    A


