    ## Video on Installing Linux Software


    If you would like to see exactly what it’s like to install software on a Linux
    system, check out this video that I put together for you: http://www.linuxtrainingacademy.com/installing-software/


    ## Summary


    In this chapter, you learned how packages are typically used to install software
    on Linux systems. You learned how to manipulate packages with a package manager.
    Two of the most popular package formats are RPM and Debian. For RPM based distributions,
    you learned how to use the `yum` and `rpm` commands. For Debian based distributions
    you learned how to use the `apt` and `dpkg` commands to manage packages.


    ## Resources


    Managing Software with Yum

    https://www.centos.org/docs/5/html/yum/


    AptGet Howto

    https://help.ubuntu.com/community/AptGet/Howto


    Ubuntu - Installing Software

    https://help.ubuntu.com/community/InstallingSoftware


    Installing Linux Software Video

    http://www.linuxtrainingacademy.com/installing/


    ## Quiz


    The Debian and RedHat Enterprise Linux distributions use the same package format.

    True

    False


    How would you search for “apache” using yum?

    `yum search apache`

    `yum find apache`

    `yum get apache`

    `yum-cache search apache`


    Which command lists all of the RPM packages installed on a system?

    `rpm -a`

    `rpm -q`

    `rpm -qa`

    `rpm -ea`


    How would you install the htop package on a Debian based distribution?

    `apt-get htop`

    `apt-get install htop`

    `apt-cache install htop`

    `yum-get htop`


    Which of the following commands will list the contents of the htop Debian package?

    `dpkg -S htop`

    `dpkg -i htop`

    `dpkg -l htop`

    `dpkg -L htop`


    ## Quiz Answers


    B

    A

    C

    D


    ## Viewing and Editing files


    Here are some simple commands that display the contents of files on the screen.


    `cat file` - Display the entire contents of file.


    `more file` - Browse through a text file. Press Space to advance to the next page.
    Press Enter to advance to the next line. Type `q` to quit viewing the file. Commands
    are based on the `vi` editor, which is covered in the next section.


    `less file` - Like more but allows backward movement and pattern searches.


    `head file` - Output the beginning (or top) portion of file.


    `tail file` - Output the ending (or bottom) portion of file.


    This is how you might examine a file named `file.txt` with the commands `cat`,
    `tail`, and `more`.


    ```bash

    $ cat file.txt

    This is the first line.

    This is the second.

    Here is some more interesting text.

    Knock knock.

    Who’s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    All my base are belong to you.

    Finally, the 12th and last line.

    ```


    ```bash

    $ head file.txt

    This is the first line.

    This is the second.

    Here is some more interesting text.

    Knock knock.

    Who’s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    ```


    ```bash

    $ tail file.txt

    Here is some more interesting text.

    Knock knock.

    Who’s there?

    More filler text.

    The quick brown fox jumps over the lazy dog.

    The dog was rather impressed.

    Roses are red,

    Violets are blue,

    All my base are belong to you.

    Finally, the 12th and last line.

    ```


    ```bash

    $ more file.txt

    Here is some more interesting text.

    Knock knock.

    Who’s there?

    …

    ```


    By default, `head` and `tail` only display ten lines. You can override this behavior
    and tell them to display a specified number of lines. The format is `-n` where
    `n` is the number of lines you want to display. If you only want to display the
    first line of a file, use `head -1`. Want to display the last three lines, use
    `tail -3`.


    ```bash

    $ head file.txt

    This is the first line.

    ```


    ```bash

    $ tail file.txt

    Finally, the 12th and last line.

    ```


    ## Viewing Files In Real Time


    Using `cat` can be a fine way to view files that have static content. However,
    if you are trying to keep up with changes that are made in real time, `cat` is
    not the best choice. A good example of files that change often are log files.


    Oct 10 16:41:17 app: [ID 107833 user.info] Processing request 768067

    Oct 10 16:42:28 app: [ID 107833 user.err] User denied access to admin functions


    For example, you may need to start a program and look at its log file. For this
    case, use `tail -f`.


    ```bash

    $ tail -f /opt/app/var/log.txt

    Oct 10 16:41:17 app: [ID 107833 user.info] Processing request 768067

    Oct 10 16:42:28 app: [ID 107833 user.err] User denied access to admin functions

    ```


    ## Editing Files


    ### Nano


    If you need to edit a file right now and do not want to spend any time learning
    editor commands, use `nano`. Nano is a clone of `pico`, so if for some reason
    a command is not available, `pico` probably is. It’s not as powerful as some other
    editors, but it’s definitely easier to learn.


    When you start `nano`, you will see the file’s contents and a list of commands
    at the bottom of the screen. To run the commands, replace the caret symbol (^)
    with `Ctrl`. For example, to exit `nano`, type `Ctrl+x`.


    ![](Images/00002.jpeg)


    Editing in `nano` is quite easy. The up and down arrow keys will take you to the
    previous or next lines as expected. The right and left arrow keys let you navigate
    forwards and backwards on the same line. Simply type the desired text into the
    editor. To save the file, type `Ctrl+o`. If you forget to save the file before
    you exit, `nano` will ask you if you want to save the file. To learn more, type
    `Ctrl+g` for help.


    ### Vi


    While `nano is great for simple edits, `vi` and `em` have more advanced and powerful
    features. There is a learning curve to using these editors as they are not exactly
    intuitive. It will require a bit of a time investment to become proficient. Let’s
    start by looking at `vi`.


    `vi [file]` - Edit file.


    `vim [file]` - Same as `vi`, but with more features.


    `view [file]` - Start `vim` in read-only mode. Use `view` when you want to examine
    a file but not make any changes.

