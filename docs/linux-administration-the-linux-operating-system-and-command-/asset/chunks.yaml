    ## The File System Table


    The `/etc/fstab` file controls where devices are mounted on a Linux system and
    what options to use when mounting those devices. Each entry consists of one line
    with six columns. If a line starts with `#`, it’s a comment and is ignored. The
    six columns are the device, mount point, filesystem type, options, dump, and file
    system check order. Each of these columns is separated by a space or a tab. Here
    is an example `/etc/fstab` file.


    | device | mount point | filesystem | options | dump | fsck |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | `/dev/sda2` | `/` | `xfs` | defaults | 0 | 1 |

    | `/dev/sda1` | `swap` | `swap` | defaults | 0 | 0 |


    ### Device


    This column contains a path to the device.


    ### Mount Point


    This column determines where the device is mounted.


    ### Filesystem Type


    The third column contains the filesystem type.


    ### Options


    The fourth column contains the mount options.


    ### Dump


    The fifth column is the dump value.


    ### fsck


    The sixth column is the file system check order.

