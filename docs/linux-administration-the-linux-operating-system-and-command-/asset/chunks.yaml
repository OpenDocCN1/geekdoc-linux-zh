    # 管理用户和组


    Linux 是一个多用户操作系统。系统不仅可以存在多个账户，而且这些账户中的每一个都可以同时被使用。每个账户由一个用户名和一个名为 `UID`（user ID
    的缩写）的唯一数字组成。此外，每个账户都有其所属的默认组、与账户关联的一些注释、用户登录系统时执行的 shell 以及一个主目录。所有信息都存储在 `/etc/passwd`
    文件中。


    `/etc/passwd` 文件的第一条目是 root 账户。


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    `/etc/passwd` 文件的格式如下。


    `username:password:UID:GID:comments:home_dir:shell`


    每个字段由冒号分隔。让我们逐一查看它们。


    - **用户名 (Username)**：`root`

    - **密码 (Password)**：`x`（这意味着加密密码存储在 `/etc/shadow` 中，稍后你会学习它。）

    - **UID**：`0`

    - **GID**：`0`

    - **注释 (Comment)**：`root`

    - **主目录 (Home directory)**：`/root`

    - **Shell**：`/bin/bash`


    让我们 `/etc/passwd` 文件中的另一个条目。这是 `joe` 账户的。


    ```

    joe:x:1000:1000:Joe Henderson:/home/joe:/bin/bash

    ```


    - **用户名 (Username)**：`joe`

    - **密码 (Password)**：`x`

    - **UID**：`1000`

    - **GID**：`1000`

    - **注释 (Comment)**：`Joe Henderson`

    - **主目录 (Home directory)**：`/home/joe`

    - **Shell**：`/bin/bash`


    尽管 Linux 支持长度达 32 个字符的用户名，但习惯上是将用户名保持在 8 个字符以内。当使用超过 8 个字符的用户名时，你会遇到显示 `UID` 代替用户名或显示用户名的截断版本的情况。例如，在查看
    `ps` 命令的输出时。


    这是一个长用户名被截断的示例。


    ```

    ps -fu jasoncannon

    UID PID PPID C STIME TTY TIME CMD

    jasonca+ 2973 1 0 01:43 ? 00:00:00 bash

    ```


    这在旧版本的 Linux 上可能是它的样子。长用户名直接被其 `UID` 替换。


    ```

    ps -fu jasoncannon

    UID PID PPID C STIME TTY TIME CMD

    1000 2973 1 0 01:43 ? 00:00:00 bash

    ```


    用户名是区分大小写的。尽管用户名中允许大写字母，但按照惯例，用户名全为小写。用户名中也允许数字，但要避免特殊字符。


    从历史上看，加密密码信息存储在 `/etc/passwd` 文件的用户名之后。然而，`/etc/passwd` 文件对系统中的任何人都可以读取，因此存储密码信息（即使是加密的）存在安全风险。现在，默认情况下，加密密码信息存储在
    `/etc/shadow` 中，只有超级用户账户可以读取。


    `UID` 是一个唯一的数字。root 账户始终是 `UID 0`。通常供系统使用的账户其 `UID` 小于 1000。这可以通过更新 `/etc/login.defs`
    文件进行配置。


    账户密码文件条目中列出的组 ID（或 `GID`）是该账户的组。`/etc/passwd` 文件中的注释字段通常包含账户的真实姓名或描述，即早期的 GCOS
    字段。该字段可以为空。


    当用户登录系统时，shell 字段将执行。你可以通过查看 `/etc/shells` 看到系统中安装的 shell。例如，你可以看到 `/usr/sbin/nologin`
    或 `/bin/false`，这确保了用户无法交互式访问。


    ## Shadow 文件 (Shadow File)


    类似于 `/etc/passwd` 文件，`/etc/shadow` 文件包含一组由冒号分隔的字段。


    ```

    root:$6$9g1AYzqPorEZSHjWeZP8o21:16502:::

    ```


    第一个字段是用户名。第二个字段包含加密密码。第三字段是自 1970 年 1 月 1 日以来密码更改的天数。第四字段是密码有效期的天数。第五字段是必须更改密码的天数。如果此字段包含
    `99999`，则用户不需要更改密码。第六字段是警告用户密码将过期的天数。第七字段是密码过期后账户禁用的天数。第八字段是自 1970 年 1 月 1 日以来账户禁用的天数。第九字段留供后用。


    ## 创建账户


    现在你已经知道账户信息存储在哪里，让我们使用 `useradd` 命令创建一个账户。添加账户需要超级权限，因此请确保你正在使用 root 账户或 `sudo`。这是
    `useradd` 命令的格式。


    ```

    useradd [options] username

    ```


    `useradd` 命令常用的选项有：


    - `-c “COMMENT”`：账户注释，例如用户的全名。

    - `-m`：使用 `-m` 选项创建用户的主目录。

    - `-s /shell/path`：用户 shell 的路径。


    在这个示例中，为 Grant Stewart 创建了一个账户。他的用户名是 `grant`，shell 是 `bash`。


    ```

    useradd -c “Grant Stewart” -m -s /bin/bash grant

    ```


    接下来，为账户分配密码。要执行此操作，请使用 `passwd` 命令加上用户名。系统会提示输入用户密码并确认该密码。


    ```

    passwd grant

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    这是该账户在 `/etc/passwd` 文件和 `/etc/shadow` 文件中的条目。


    ```

    tail -1 /etc/passwd

    grant:x:1000:1000:Grant Stewart:/home/grant:/bin/bash


    tail -1 /etc/shadow

    ```


