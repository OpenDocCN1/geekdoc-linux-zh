    ## Installing Software on Debian and Ubuntu


    The Debian and Ubuntu distributions use a package manager called APT, the Advanced
    Packaging Tool. APT is comprised of a few small utilities with the two most commonly
    used ones beingapt-cacheandapt-get.


    apt-cache search search-string - Search for search-string.


    apt-get install [-y] package- Install package. Use the-y option to automatically
    answer yes to apt-get’s questions.


    apt-get remove package - Remove/uninstall package, leaving behind configuration
    files.


    apt-get purge package - Remove/uninstall package, deleting configuration files.


    apt-cache show package - Display information about package.


