  \n## 测验答案\n\nB\nB\nC\nB\nA\nD\nC\n\n# 管理软件\n\n通常，当你在 Linux 系统上安装软件时，是通过软件包（package）来完成的。软件包是组成应用程序的文件集合。此外，软件包还包含有关应用程序的数据，以及成功安装和删除该应用程序所需的任何步骤。软件包中包含的数据或元数据（metadata）可以包括应用程序描述、应用程序版本以及它所依赖的其他软件包列表等信息。为了安装或删除软件包，你需要使用超级用户权限。\n\
  \n包管理器（package manager）用于安装、升级和删除软件包。软件包为了正常运行所需的任何额外软件称为依赖项（dependency）。包管理器使用软件包的元数据自动安装依赖项。包管理器会跟踪哪些文件属于哪些软件包、安装了哪些软件包以及安装了这些软件包的版本。\n\
  \n## 在 CentOS, Fedora 和 RedHat 发行版上安装软件\n\n`yum` 命令行工具是一个使用 `RPM` 包管理器的 Linux 发行的包管理程序。CentOS、Fedora、Oracle\
  \ Linux、RedHat Enterprise Linux 和 Scientific Linux 是基于 RPM 的发行版，你可以在上面使用 `yum`。\n\
  \n- `yum search search-string` - 搜索 `search-string`。\n- `yum install [-y] package`\
  \ - 安装软件包。使用 `-y` 选项自动对 `yum` 的问题回答 yes。\n- `yum remove package` - 移除卸载软件包。\n- `yum\
  \ info [package]` - 显示软件包信息。\n\n要要安装软件，请使用 `yum search search-string`。\n\n```\n\
  $ yum search inkscape\nLoaded plugins: refresh-packagekit, security\n=============\
  \ N/S Matched: inkscape =============\ninkscape-docs.i686 : Inkscape 的文档\ninkscape.i686\
  \ : 使用 SVG 的矢量图形程序\ninkscape-view.i686 : SVG 文件的查看程序\n仅匹配名称和摘要，使用“search all”查找所有内容。\n\
  $\n```\n\n要安装软件，请使用 `yum install package`。安装软件需要超级用户权限。这意味着你需要使用 `sudo` 或通过 `su`\
  \ 命令切换到 root 账户。\n\n```\n$ sudo yum install inkscape\n[sudo] password for bob:\n\
