  ## 总结\n\n在本章中，你学习了 Linux 启动过程。你学习了 `BIOS` 的工作是执行基本的硬件检查并从可启动设备启动引导加载程序。你还学习了两种常用的引导加载程序，`LILO`\
  \ 和 `Grub`。任何引导加载程序的主要工作都是启动操作系统。\n\n你还学习了启动 Linux 系统所需的文件存储在 `/boot` 目录中。初始内存磁盘\
  \ `initrd` 是加载到内存中的临时文件系统。它的主要工作是挂载存储操作系统的文件系统。Linux 内核通常命名为 `vmlinux`，或者如果经过压缩，则是\
  \ `vmlinuz`。\n\n你学习了如何使用 `dmesg` 命令或通过检查 `/var/log/` 来查看内核环形缓冲区中的消息。\n\n（注：原文末尾部分存在大量重复的乱码和练习题，已根据高级文档工程师逻辑进行清理与翻译，确保核心内容完整。）\n\
  \n\n\nrsyslog 的主配置文件是 `/etc/rsyslog.conf`。你可以使用 `$IncludeConfig` 指令来包含额外的配置文件。例如，此行将导致\
  \ rsyslog 读取并包含 `/etc/rsyslog.d` 目录下所有以 `.conf` 结尾的配置文件。\n\n```\n$IncludeConfig\
  \ /etc/rsyslog.d/*.conf\n```\n\n日志规则由两个字段组成。第一个字段称为选择器字段（selector field），它列出了要包含在规则中的设施（facilities）和严重性（severities）。第二个字段称为动作字段（action\
  \ field），它决定了对匹配选择器字段的消息将进行什么处理。最常见的动作是将消息写入日志文件。选择器字段和动作字段之间可以用一个或多个空格或制表符分隔。\n\
  \n选择器字段的格式为 `FACILITY.SEVERITY`。请注意，支持通配符。例如，使用 `mail.*` 选择器来匹配所有邮件消息。如果你想包含来自设施的所有消息，可以省略\
  \ `.SEVERITY`。简而言之，`mail.*` 和 `mail` 是等价的。如果你不想匹配来自某个设施的任何消息，请使用 `FACILITY.none`。如果你想匹配多个设施/严重性对，请用分号分隔每一对。\n\
  \n此示例规则匹配设施为 mail 且严重性为任意的消息。它将所有匹配的消息写入 `/var/log/mail.log`。\n\n```\nmail.* /var/log/mail.log\n\
  ```\n\n如果路径以减号开头，则告诉 rsyslog 无需为每条日志消息执行 `sync()` 操作。这有时被称为缓存模式。当使用缓存模式时，请注意，如果系统在写入尝试后立即崩溃，某些消息可能会丢失。然而，如果你的系统执行许多日志操作，在正常运行期间你可能会看到性能的提升。Linux\
  \ 发行版带的默认配置可能混合使用了缓存（-/path`）和非缓存（`/path`）规则，其中不重要的消息使用缓存。这里是一个示例：\n\n```\nmail.*\
  \ -/var/log/mail.log\n```\n\n在示例示例中，针对不同严重性的邮件消息有不同的动作。请注意，不重要的邮件消息使用了缓存模式。\n\n\
  ```\nmail.info -/var/log/mail.info\nmail.warn -/var/log/mail.warn\nmail.err /var/log/mail.err\n\
  ```\n\n此示例摘自 Ubuntu 系统。第一行确保所有来自 auth 和 authpriv 设施的消息都写入 `/var/log/auth.log`。第二行将除源自\
  \ auth 和 authpriv 设施以外的所有消息写入 `/var/log/syslog`。\n\n```\nauth,authpriv.* /var/log/auth.log\n\
  *.*;auth.none,authpriv.none -/var/log/syslog\n```\n\n此示例摘自 RedHat Enterprise Linux\
  \ 系统。该规则告诉 rsyslog 将除 mail、authpriv 和 cron 以外的所有消息写入 `/var/log/messages`。\n\n```\n\
  *.info;mail.none;authpriv.none;cron.none /var/log/messages\n```\n\n希望你明白为什么理解如何确定消息发送到何处是重要的，而不仅仅是简单地记住系统消息存储在\
  \ `/var/log/messages` 中。不同的发行版带有不同的配置，不同的公司、组织和系统管理员可能会修改默认规则以适应其特定需求。\n\n## 创建你自己的\
  \ Syslog 消息\n\n你可以使用 `logger` 命令生成 syslog 消息。如果你想测试对系统日志器所做的任何更改，或者想从自己的 shell 脚本生成日志消息，这将非常有用。使用\
  \ `-p` 选项提供 `FACILITY.SEVERITY` 级别。如果你没有指定设施/严重性对，它将默认为 `user.notice`。你还可以使用 `-t`\
  \ 选项为你的消息添加标记。\n\n```\nlogger [options] message\n```\n\n在示例中，我们生成了一个具有 mail 设施且严重性为\
  \ info 的消息。你可以看到该消息已到达正确的日志文件。\n\n```\n$ logger -p mail.info -t mailtest “Testing\
  \ 123.”\n$ sudo tail -1 /var/log/mail.log\nApr 4 14:33:16 linuxsvr mailtest: Testing\
  \ 123.\n```\n\n## 日志文件轮转\n\n你可以使用 `logrotate` 工具对日志文件进行轮转、压缩、删除甚至发送邮件。这提供了一种管理日志文件的方法，有助于防止日志消息填满存储空间。\n\
  \n`logrotate` 的配置文件位于 `/etc/logrotate.conf`。与许多其他配置文件一样，它可能使用包含指令。此行告诉 `logrotate`\
  \ 读取位于 `/etc/logrotate.d` 目录下的配置文件。\n\n```\ninclude /etc/logrotate.d\n```\n\n这是一个示例\
  \ `logrotate.conf` 文件。\n\n```text\n## 详情请参阅“man logrotate”\n## 每周轮转日志文件\nweekly\n\
  ## 保留 4 周的备份\nrotate 4\n## 轮转后创建新的（空）日志文件\n## 旧文件\ncreate\n## 如果你想压缩日志文件，请取消注释\n\
  #compress\n## 软件包将日志轮转信息\n## 放入此目录\ninclude /etc/logrotate.d\n```\n\n主文件中的配置包含一些默认值。例如，`weekly`\
  \ 关键字确保日志文件每每周轮转一次。`rotate 4` 行告诉 `logrotate` 保留 4 周的日志。早于此的日志将被删除。`create` 行确保在轮转后创建一个新的空日志文件。\n\
  \n这是一个来自 Ubuntu 系统的示例 `logrotate` 配置。它位于 `/etc/logrotate.d/rsyslog`。它处理与 rsyslog\
  \ 相关的所有文件的日志轮转。\n\n```text\n/var/log/syslog\n{\n    rotate 7\n    daily\n    missingok\n\
  \    notifempty\n    delaycompress\n    compress\n    postrotate\n    reload rsyslog\
  \ >/dev/null 2>&1 || true\n    endscript\n}\n\n/var/log/mail.info\n/var/log/mail.warn\n\
  /var/log/mail.err\n/var/log/mail.log\n/var/log/daemon.log\n/var/log/kern.log\n/var/log/auth.log\n\
  /var/log/user.log\n/var/log/lpr.log\n/var/log/cron.log\n/var/log/debug\n/var/log/messages\n\
  {\n    rotate 4\n    weekly\n    missingok\n    notifempty\n    compress\n    delaycompress\n\
  \    sharedscripts\n    postrotate\n    reload rsyslog >/dev/null 2>&1 || true\n\
  \    endscript\n}\n```\n\n注意格式为单个日志文件或日志文件列表，随后是控制这些文件的配置。配置位于括号中。以下是使用的配置选项：\n\n\
  - `rotate count` 对于删除前轮转 count 次。\n- `daily`：每天轮转。\n- `weekly`：每周轮转。\n- `missingok`：忽略缺失的文件。（不发出错误。）\n\
  - `notifempty`：如果日志文件为空，则不轮转。\n- `compress`：压缩轮转后的日志文件。\n- `postrotate`：`postrotate`\
  \ 和 `endscript` 之间的行使用 `/bin/sh` 执行。这些在轮转后执行。\n\n## 测试你的 Logrotate 配置\n\n如果你对 logrotate\
  \ 配置进行了更改并想测试它，请使用以下命令。\n\n```bash\nlogrotate -fv /etc/logrotate.conf\n```\n\n`-f`\
  \ 选项强制 `logrotate` 执行轮转，而 `-v` 选项启用详细日志。\n\n## 总结\n\n在本章，你学习了 syslog 标准以及它是如何为消息分配设施和严重性的。你还学习了\
  \ syslog 服务器利用日志规则来确定对给定消息执行什么动作。通常，动作是将消息存储在日志文件中。你还学习了如何通过 `logger` 工具生成消息来测试日志服务器配置。最后，你学习了如何使用\
  \ `logrotate` 自动修剪系统日志。\n\n## 测验\n\nsyslog 标准：\nA. 有助于处理消息。\nB. 允许集中控制日志。\nC. 使用设施和严重性对消息分类。\n\
  D. 以上所有。\n\n可以使用哪个命令生成日志消息？\nA. `logger`\nB. `log`\nC. `logit`\nD. 没有这样的命令。\n\n\
  ## 测验答案\n\nD, A\n\n# 磁盘管理\n\n当磁盘或存储设备“分区”时，它会被分成若干部分。这些部分中的每一个都被称为分区。磁盘分区允许你为不同的目的分配磁盘的不同区域。\n\
  \n\n\n\n作为系统管理员，你可以决定使用何种分区方案。例如，你可以使用四个分区：分配一个分区用于操作系统数据，另一个分区用于应用程序数据，再分配一个用于用户数据，最后设置一个专门用于交换空间（swap\
  \ space）的分区。另一种方案是简单地使用两个分区，并将用户的家目录与系统的其余部分隔离开。\n\n使用独立的分区是防止系统某部分对另一部分产生不利影响的方法。例如，为用户家目录设置专用分区，可以防止用户填满整个磁盘并干扰操作系统的正常运行。尽管某个用户（或一组用户）可能会耗尽分配给家目录的存储空间并导致其他用户无法使用更多空间，操作系统以及任何正在运行的应用程序仍然能够正常运行。如果该系统托管着网站，操作系统以及\
  \ Web 服务器将继续运行，从而避免了服务中断。\n\n## MBR 分区方案\n\n`MBR`，即主引导记录（master boot record），是位于存储设备开头的引导扇区。存储在\
  \ `MBR` 中的分区表包含了逻辑分区在磁盘上组织方式的信息。由于 `MBR` 中的分区表只能寻址最高达 2 TB 的存储空间，它正在被 `GUID 分区表\
  \ (GPT)` 所取代。\n\n`MBR` 分区方案允许最多创建四个主分区。如果你想创建四个以上的分区，则需要使用扩展分区（extended partition）。扩展分区是一种特殊的主分区，用作其他分区的容器。这允许你创建无限数量的逻辑分区。\n\
  \n## GUID 分区表 (GPT)\n\n`GUID`（全局唯一标识符）分区表，简称为 `GPT`，正在取代旧的 `MBR` 分区系统。它是统一可扩展固件接口（UEFI）标准的一部分。`UEFI`\
  \ 正在取代传统的 `BIOS`；然而，由于 `MBR` 分区表的磁盘大小限制，`GPT` 已在某些 `BIOS` 系统上使用。\n\n`GPT` 中没有主分区和扩展分区之分。使用默认配置，`GPT`\
  \ 支持多达 128 个分区。此外，`GPT` 支持高达 9.4 ZB 的存储设备。`GPT` 的主要缺点是它不支持旧的操作系统。此外，你需要使用支持 `GPT`\
  \ 的较新分区工具。\n\n### 挂载点\n\n挂载点（mount point）简单来说用于访问分区上数据的目录。至少会有一个分区挂载在 `/` 挂载点。任何额外的分区将挂载在目录树中\
  \ `/` 下的挂载点。例如，如果你为用户家目录分配了一个分区，该分区将挂载在 `/home`。位于 `/home` 挂载点或其下的文件和目录将位于该分区。例如，我的家目录\
  \ `/home/jason` 中的文件将位于挂载在 `/home` 的分区上。\n\n如果你断开（或卸载）该分区并将其挂载到另一个目录（挂载点），所有数据都将在新挂载点处可用。如果卸载了\
  \ `/home` 然后将该分区挂载到 `/export/home`，那么我家目录中的文件将通过 `/export/home/jason` 可访问。\n\n需要指出，你可以将分区挂载到现有数据之上。例如，如果在挂载\
  \ `/home` 之前在 `/home` 中创建了文件，这些文件将无法访问。假设你只挂载了 `/` 分区，并在 `/home/sarah` 为 Sarah 创建了家目录。`/home/sarah`\
  \ 目录位于挂载在 `/` 上的分区上。如果你随后在 `/home` 上挂载另一个分区，你将无法访问 `/home/sarah` 目录。`/home/sarah`\
  \ 的数据仍然存在，但它位于与 `/` 相关的分区上。一旦你卸载了 `/home`，你就会发现 `/home/sarah` 仍然存在。\n\n你可以在 Linux\
  \ 目录树的任何地方挂载分区。你甚至可以位于其他已挂载分区上的挂载点。假设你有一个挂载在 `/home` 的分区。你可以在 `/home/jason` 上再次挂载另一个分区。确保\
  \ `/home` 在 `/home/jason` 之前挂载很重要。在本章后面，你将学习如何将分区与挂载点关联，以及控制分区挂载的顺序。\n\n## 创建分区\n\
  \n在执行交互式 Linux 安装时，你很可能会使用由 Linux 发行版提供的分区工具。然而，如果你想在初始安装后操作磁盘，你很可能需要使用标准的 Linux\
  \ 工具。`fdisk` 工具传统上被用于创建和修改磁盘上的分区，但还有其他可行的替代方案包括 `gdisk` 和 `parted`。早期版本的 `fdisk`\
  \ 缺乏对 `GPT` 的支持，但截至本文编写时，`fdisk` 已支持 `GPT`。使用 `fdisk` 管理磁盘上的分区，只需将要管理的设备路径作为参数提供给命令即可。\n\
