- "# Linux 管理：Linux 管理员的 Linux 操作系统与命令行指南\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n\n\
  \n## 作者的其它书籍\n（稍等，检查下方列表）\n\n## 作者的其它书籍\n\n### Command Line Kung Fu: Bash Scripting\
  \ Tricks, Linux Shell Programming Tips, and Bash One-liners\nhttp://www.linuxtrainingacademy.com/command-line-kung-fu-book\n\
  \n### High Availability for the LAMP Stack: Eliminate Single Points of Failure and\
  \ Increase Uptime for Your Linux, Apache, MySQL, and PHP Based Web Applications\n\
  http://www.linuxtrainingacademy.com/ha-lamp-book\n\n### Linux for Beginners: An\
  \ Introduction to the Linux Operating System and Command Line\nhttp://www.linuxtrainingacademy.com/linux\n\
  \n### Python Programming for Beginners: An Introduction to the Python Computer Language\
  \ and Computer Programming\nhttp://www.linuxtrainingacademy.com/python-programming-for-beginners\n\
  \n# 绪言\n\n在发布我的第一本书*Linux for Beginners*（Linux 入门）后，读者们不断告诉我：“我喜欢 Linux！它为我开启了一个全新的世界，我想学习更多内容。”有些人甚至想将这种新发现的热情转化为\
  \ Linux 专业人员的职业。“接下来是什么？”他们会问我。\n\n我会引导他们去听我的课程之一，或者建议他们去上一个 Linux 系统管理课程。“这很棒，但我接下来应该读哪本书？哪本书是\
  \ Linux 系统管理课程的绝佳伙伴？”我无法给他们一个好的答案。\n\n大多数关于 Linux 系统管理的书籍尽管内容优秀，但由于已经过时了。它们似乎都来自一个\
  \ Linux 更加像 Unix 的时代。即使是最近发布的书籍，也没有涵盖现代 Linux 系统启动和管理系统服务方式的根本性变化。随着时间的推移，每一个新版本的\
  \ Linux 内核发布以及每一个新 Linux 发行版的更新，Linux 看起来越来越不像传统的 Unix 系统。现在，比以往任何时候都，Linux 必须被视为一个独立的实体来对待。\n\
  \n现在当有人问我“我接下来应该读哪本书？”时，我有了答案。就是这本书。这本书是你理解了如何使用 Linux 系统后的下一步。它教你如何像管理 Linux 系统一样去管理\
  \ Linux 系统。\n\n如果你准备好迈出下一步，让我们让我们开始吧。\n\nJason\n\n# 启动\n\n作为系统管理员，你需要理解 Linux 的启动过程。在本章，你将学习\
  \ BIOS、引导加载程序、Linux 内核和运行级别（runlevels）。\n\n## BIOS\n\nBIOS 代表基本输入输出系统（Basic Input/Output\
  \ System）。它是启动过程中使用的一种特殊类型的固件，是计算机开机时运行的第一段软件。BIOS 是独立于操作系统的。它的主要目的是测试底层硬件组件并加载引导加载程序或操作系统。\n\
  \nBIOS 会执行 `POST`，即上电自检（Power-On Self Test）。`POST` 会对 CPU、内存和存储设备等各种硬件组件进行一些基础检查。只有在\
  \ `POST` 成功后，BIOS 才会尝试加载引导加载程序。\n\nBIOS 包含一个启动设备列表，例如硬盘、DVD 驱动器、USB 设备等，取决于所使用的硬件。BIOS\
  \ 会按照指定的顺序在该列表中查找可启动设备。你可以通过中断启动序列并进入 BIOS 配置来更改此顺序。用于此操作的按键组合会随硬件制造商的不同而异。\n\n\
  一旦找到可启动设备，BIOS 就会运行引导加载程序。通常会使用 `GRUB` 引导加载程序，但你可能会遇到使用 `LILO` 引导加载程序的旧 Linux 系统。`LILO`\
  \ 代表 `LInux LOader`，而 `GRUB` 代表 `GRand Unified Bootloader`。无论如何，引导加载程序的主要目的是启动操作系统。你通常会看到来自引导加载程序的一条或一系列消息，这些消息允许你中断启动过程并与引导加载程序交互。如果安装了多个操作系统，你可以告诉引导加载程序运行哪一个操作系统。你还可以指示引导加载程序向操作系统传递不同的启动选项。\n\
  \n## 初始内存磁盘\n\n初始内存磁盘，缩写为 `initrd`，是系统启动时加载到内存中的临时文件系统。该文件系统可以包含执行硬件检测并加载必要的模块（有时称为驱动程序）的辅助程序，以挂载实际的文件系统。例如，如果根文件系统存储在\
  \ `LVM`（逻辑卷管理器）卷上，`initrd` 镜像将包含挂载该逻辑卷作为根文件所需的所需的模块。一旦 `initrd` 挂载了实际根文件系统，它的任务就完成了，操作系统将从真实的根文件系统加载。\n\
  \n## 内核和初始内存磁盘的位置\n\nLinux 内核、初始内存磁盘以及启动操作系统所需的其他文件存储在 `/boot` 中。这里是一个 Ubuntu 系统\
  \ `/boot` 目录列表。\n\n```bash\n$ ls -1F /boot\n\nabi-3.13.0-46-generic\nconfig-3.13.0-46-generic\n\
  grub/\ninitrd.img-3.13.0-46-generic\nSystem.map-3.13.0-46-generic\nvmlinuz-3.13.0-46-generic\n\
  ```\n\nLinux 内核通常命名为 `vmlinux` 或 `mlinuz`。如果内核是压缩过的，格式为 `vmlinuz`。在本示例中，初始内存磁盘是\
  \ `initrd.img-3.13.0-46-generic`。内核是 `vmlinuz-3.13.0-46-generic`。\n\n## 内核缓冲区\n\n\
  内核缓冲区包含与 Linux 内核相关的消息。缓冲区是一个固定大小的数据结构。当缓冲区完全满时，旧消息会被丢弃。要查看内核缓冲区的内容，请使用 `dmesg`\
  \ 命令。\n\n```bash\n$ dmesg\n\n[ 0.000000] Initializing cgroup cpuset\n[ 0.000000]\
  \ Initializing cgroup cpu\n[ 0.000000] Initializing cgroup cpuacct\n[ 0.000000]\
  \ Linux version 3.13.0-46-generic (buildd@or) (gcc version 4.8.2 (Ubuntu 4.8.2-19ubuntu1)\
  \ ) #79-Ubuntu SMP Mar 10 20:06:50 UTC 2015) (3.13.11-ckt15)\n[ 0.000000] Command\
  \ line: BOOT_IMAGE=/boot/vmlinuz-3.13.0-46-generic root=UUID=736134da-c6b8-4a97-911c-650146a68b3\
  \ ro console=tty1 console=ttyS0\n[ 0.000000] KERNEL supported cpus:\n[ 0.000000]\
  \ Intel GenuineIntel\n[ 0.000000] AMD AuthenticAMD\n[ 0.000000] Centaur CentaurHauls\n\
  [ 0.000000] e820: BIOS-provided physical RAM map:\n```\n\n消息也存储在磁盘的 `/var/log/dmesg`\
  \ 文件中。通过 `dmesg` 命令和 `/var/log/dmesg` 日志文件，你可以看到内核生成的消息，即使在启动过程的最早期阶段，这些消息也会飞掠你的屏幕。\n\
  \n## 运行级别与目标\n\nLinux 使用运行级别来确定启动哪些进程和服务。每个发行版的配置可能不同，但通常情况下，运行级别 0 用于关闭系统，运行级别\
  \ 1 是单用户模式，运行级别 2-5 用于正常系统操作，运行级别 6 用于重启系统。\n\n| 运行级别 | 描述 |\n| :--- | :--- |\n\
  | 0 | 关闭系统 |\n| 1, S, s | 单用户模式。用于维护。 |\n| 2 | 带图形界面的多用户模式（Debian/Ubuntu） |\n| 3\
  \ | 多用户文本模式（RedHat/CentOS） |\n| 4 | 未定义 |\n| 5 | 带图形界面的多用户模式（RedHat/CentOS） |\n\
  | 6 | 重启 |\n\n\n\n\n在历史上，运行级别（runlevels）由 `init` 程序控制。`init` 的配置存储在 `/etc/inittab`\
  \ 中。要使用 `init` 更改默认运行级别，你需要编辑 `/etc/inittab` 文件，并在 `initdefault` 行上设置运行级别数字。以下是一个将运行级别\
  \ 3 设置为默认运行级别的示例。\n\n```\nid:3:initdefault:\n```\n\n然而，`init` 的备选方案（如 `systemd`\
  \ 和 `upstart`）正在迅速取代 `init`，其中 `systemd` 是目前应用最广泛的替代者。\n\n`systemd` 并没有使用运行级别，而是使用了“目标（targets）”的概念。这些目标大致等同于运行级别。要查看可用目标的列表，请查看\
  \ `/lib/systemd/system` 目录。你会发现运行级别目标实际上是向正在使用的真实软链接。例如，`runlevel5.target` 是 `graphical.target`\
  \ 的软链接。\n\n```bash\ncd /lib/systemd/system\nls -l runlevel*target\n\nlrwxrwxrwx.\
  \ 1 root root 15 Jul 17 2014 runlevel0.target -> poweroff.target\nlrwxrwxrwx. 1\
  \ root root 13 Jul 17 2014 runlevel1.target -> rescue.target\nlrwxrwxrwx. 1 root\
  \ root 17 Jul 17 2014 runlevel2.target -> multi-user.target\nlrwxrwxrwx. 1 root\
  \ root 17 Jul 17 2014 runlevel3.target -> multi-user.target\nlrwxrwxrwx. 1 root\
  \ root 17 Jul 17 2014 runlevel4.target -> multi-user.target\nlrwxrwxrwx. 1 root\
  \ root 16 Jul 17 2014 runlevel5.target -> graphical.target\nlrwxrwxrwx. 1 root root\
  \ 13 Jul 17 2014 runlevel6.target -> reboot.target\n```\n\n要使用 `systemd` 更改默认运行级别或目标，请使用\
  \ `systemctl` 命令后跟 `set-default`，最后是所需的目标。可选，你也可以手动从 `/etc/systemd/system/default.target`\
  \ 文件创建一个指向所需目标的软链接。此示例将默认目标设置为图形，等同于运行级别 5。\n\n```bash\nset-default multi-user.target\n\
  rm ‘/etc/systemd/system/default.target’\nln -s ‘/usr/lib/systemd/system/multi-user.target’\
  \ ‘/etc/systemd/system/default.target’\n```\n\n## 更改运行级别或目标\n\n在 `init` 系统中，你可以使用\
  \ `telinit` 命令更改运行级别。只需将你想要更改的运行级别作为 `telinit` 命令的参数提供。\n\n```bash\ntelinit 5\n\
  ```\n\n要更改目标（即 `systemd` 中等同于运行级别的的概念），请使用 `systemctl` 命令后跟 `isolate`，最后是所需的目标。以下是切换到图形目标的方法。\n\
  \n```bash\nsystemctl isolate graphical.target\n```\n\n## 重启系统\n\n尽管在使用 `systemd`\
  \ 时有运行级别/目标，但在重启时，你也可以使用 `reboot` 或 `shutdown` 命令。\n\n以下是使用 `init` 重启的方法。\n\n```bash\n\
  telinit 6\n```\n\n使用 `systemd` 重启请使用 `systemctl` 命令。\n\n```bash\nsystemctl isolate\
  \ reboot.target\n```\n\n使用 `reboot` 命令重启只需执行 `reboot`。\n\n```bash\nreboot\n```\n\
  \n`shutdown` 命令的格式如下。\n\n```\nshutdown [options] time [message]\n```\n\n告诉 `shutdown`\
  \ 执行重启的选项是 `-r`。你可以使用“HH:MM”格式指定关机时间。你也可以使用 `+N`，其中 `N` 代表在执行操作之前等待的分钟数。最后，你可以使用\
  \ `now` 关键字立即启动。可选，你可以指定一条将广播到所有登录系统用户的消息。\n\n```bash\nshutdown -r now\n```\n\n\
  ## 关机系统\n\n要关机系统，请使用运行级别 0、`poweroff` 目标或 `poweroff` 命令。\n\n以下是使用 `init` 发出关机指令。\n\
  \n```bash\ntelinit 0\n```\n\n以下是使用 `systemctl` 关机的方法。\n\n```bash\nsystemctl isolate\
  \ poweroff.target\n```\n\n最后，你可以使用 `poweroff` 命令。\n\n```\npoweroff\n```\n\n## 总结\n\
