  \ to linuxsvr closed.\n[jason@laptop ~]$ ssh linuxsvr\n[jason@linuxsvr ~]$ screen\
  \ -r\nApr 5 18:53:51 - Backup complete\n[jason@linuxsvr ~]$\n```\n\n## 负载平均 (Load\
  \ Average)\n\n你可能已经注意到 `top` 命令的输出中有一个 `load average` 字样后面跟着三个数字。第一个数字是过去一分钟的平均负载，第二个数字是过去五分钟的平均负载，最后一个数字是过去\
  \ 15 分钟的平均负载。这里是 `top` 命令的一些示例输出。\n\n```\ntop - 20:41:23 up 5:07, 2 users, load\
  \ average: 0.90, 2.32, 1.05\n```\n\n负载平均代表系统的忙碌程度。负载平均为 `0.00` 的系统是完全空闲的。通常情况下，你可以将负载平均理解为使用或等待\
  \ CPU 时间的进程数。实际计算要复杂得多，它包含了等待其他资源的进程，包括 I/O 操作（如从磁盘读取或写入数据）。然而，离开上下文的负载平均值是没有意义的。你需要知道系统有多少个\
  \ CPU，以便确定给定的负载平均值意味着什么。\n\n假设一个单 CPU Linux 系统具有以下负载平均：`0.80`、`1.75` 和 `5.00`。这意味着在过去的一分钟内，CPU\
  \ 的利用率是 80%。你也可以说 CPU 的空闲时间占 20%。在过去的五分钟里，CPU 平均负载过载了 75%。单 CPU 系统上的负载平均值为 `1.75`\
  \ 意味着有 `.75` 个进程必须等待才能在那个 CPU 上运行。在过去的 15 分钟内，负载为 `5.00`，这意味着系统过载了 400%。\n\n如果我们在拥有\
  \ 16 个 CPU 的系统上取相同的负载平均 `0.80`、`1.75` 和 `5.00`，那么这些数字的意义就会发生巨大的变化。在单 CPU 系统上，负载平均值为\
  \ `5.00` 是非常高的，而在 16 CPU 系统上，相同的负载平均值意味着只有大约 31% 的系统资源正在使用。\n\n要查看系统中 CPU 的数量，请查看\
  \ `/proc/cpuinfo` 文件。这是一个单 CPU 系统的示例。\n\n```\n$ cat /proc/cpuinfo\nprocessor : 0\n\
  vendor_id : GenuineIntel\ncpu family : 6\nmodel : 61\nmodel name : Intel(R) Core(TM)\
  \ i7-5557U CPU @ 3.10GHz\nstepping : 4\nmicrocode : 0x19\ncpu MHz : 3103.175\ncache\
  \ size : 6144 KB\nphysical id : 0\nsiblings : 1\ncore id : 0\ncpu cores : 1\napicid\
  \ : 0\ninitial apicid : 0\nfpu : yes\nfpu_exception : yes\ncpuid level : 5\nwp :\
  \ yes\nflags : fpu vme de pse tsc msr pae mce cx8 apic sep mtrr pge mca cmov pat\
  \ pse36 clflush mmx fxsr sse sse2 syscall nx rdtscp lm constant_tsc rep_good nopl\
  \ pni monitor ssse3 lahf_lm\nbogomips : 6206.35\nclflush size : 64\ncache_alignment\
  \ : 64\naddress sizes : 39 bits physical, 48 bits virtual\npower management:\n```\n\
  \n除了 `top` 命令外，你还可以使用 `uptime` 和 `w` 命令查看负载平均值。\n\n```\n$ uptime\n21:11:53 up 5:38,\
  \ 2 users ,load average: 1.08, 2.03, 4.35\n$ w\n21:11:59 up 5:38, 2 users ,load\
  \ average: 1.08, 2.03, 4.35\nUSER TTY FROM LOGIN@ IDLE JCPU PCPU WHAT\njason pts/0\
  \ 10.0.2.2 18:52 4.00s 0.01s 0.01s screen -r\nellen pts/1 :pts/0:S.0 18:52 4.00s\
  \ 47.65s 0.00s w\n```\n\n## 内存使用 (Memory Usage)\n\n`top` 命令也显示系统的内存利用率。\n\n```\n\
  top - 20:41:23 up 5:07, 2 users, load average: 0.90, 2.32, 1.05\nMiMem : total,\
  \ used, free, shared, buff/cache\n       16000   4000.0   8000.0     500.0   4000.0\n\
  ```\n*(注：由于用户提供的原文中 Memory Usage 之后的代码块不完整，此处仅根据用户给出的文字进行翻译，并保持其 Markdown 格式)*\n\
  \n\n\n\n与其在分钟字段上使用 0,30，你也可以使用 `*/2`。你甚至可以使用带连字符的范围。如果你想在每小时的前四分钟内每分钟运行一次作业，可以使用此时间规范：`0-4\
  \ * * * * command`。\n\ncron 调度器有多种实现，某些实现允许你在 crontabs 中使用快捷方式和关键字。下面提供了一些常用关键字，但请参考你系统上的\
  \ cron 文档以确保这些内容有效。\n\n| 关键字 | 描述 | 等效于 |\n| :--- | :--- | :--- |\n| `@yearly` |\
  \ 每年 1 月 1 日凌晨运行一次 | `0 0 1 1 *` |\n| `@annually` | 与 `@yearly` 相同 | `0 0 1 1 *`\
  \ |\n| `@monthly` | 每月 1 号凌晨运行一次 | `0 0 1 * *` |\n| `@weekly` | 每周日凌晨运行一次 | `0 0\
  \ * * 0` |\n| `@daily` | 每天凌晨运行一次 | `0 0 * * *` |\n| `@midnight` | 与 `@daily` 相同\
  \ | `0 0 * * *` |\n| `@hourly` | 每小时开始时运行一次 | `0 * * * *` |\n| `@reboot` | 启动时运行\
  \ | N/A |\n\n## 使用 crontab 命令\n\n使用 `crontab` 命令来管理 cron 作。\n\n- `crontab [file]`\
  \ - 从文件安装新的 crontab。\n- `crontab -l` - 列出你的 cron 作。\n- `crontab -e` - 编辑你的 cron\
  \ 作。\n- `crontab -r` - 移除你所有的 cron 作。\n\n```bash\n$ crontab -l\nno crontab for bob\n\
  $ cat my-cron\n### 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n$ crontab\
  \ my-cron\n$ crontab -l\n### 每周一 07:00 运行。\n0 7 * * 1 /opt/sales/bin/weekly-report\n\
  $ crontab -e\n### 调用了 $EDITOR。\n$ crontab -r\n$ crontab -l\nno crontab for bob\n\
  $\n```\n\n## 总结\n\n在本章中，你学习了如何使用 `ps`、`pstree`、`top` 和 `htop` 命令查看运行进程。接下来，你学习了如何在后台启动作业，以及如何查看、挂起、恢复和杀死这些作业。你还学习了如何使用\
  \ `kill`、`pkill` 和 `killall` 命令杀死进程。接着涵盖了进程优先级和 nice 值（niceness）。你学习了如何使用 `nohup`\
  \ 命令确保即使在断开 Linux 系统连接的情况下长时间进程也能继续运行。你还学习了负载平均值以及如何确定 Linux 系统中 CPU 的数量。最后，你学习了如何使用\
  \ cron 服务调度作业。\n\n## 测验\n\n哪个命令用于查看运行的进程？\n- `ps` \n- `pid`\n- `proc`\n- `lsproc`\n\
  \n在命令行末尾放置什么字符可以在后台启动该命令？\n- `-`\n- `?`\n- `\\`\n- `&`\n\n`kill` 命令可以用于杀死进程和作业。\n\
  - 正\n- 错\n\n哪个命令用于创建、读取、更新和删除 cron 作？\n- `cron`\n- `crond`\n- `crontab`\n- `vicron`\n\
  \n以下哪个 cron 作会在每天上午 08:00 运行？\n- `8 0 0 * * /opt/acme/bin/backup`\n- `8 0 * * *\
  \ /opt/acme/bin/backup`\n- `8 * * * * /opt/acme/bin/backup`\n- `0 8 * * * /opt/acme/bin/backup`\n\
  \n## 测验答案\n\nA\nD\nA\nC\nD\n\n# 文件和目录权限\n\n回看 `ls` 命令提供的长列表，你可以看到显示的第一位信息是针对定文件或目录的权限。\n\
  \n```bash\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n\
  ```\n\n权限字符串中的第一个字符揭示了类型。例如，`-` 是普通文件，`d` 是目录，`l` 是符号链接。这些是你会遇到的最常见类型。要查看完整列表，请阅读\
  \ `ls` 的 man 页。\n\n| 符号 | 类型 |\n| :--- | :--- |\n| `-` | 普通文件 |\n| `d` | 目录 |\n\
  | `l` | 符号链接 |\n\n你会在权限字符串中注意到其他字符。它们代表三种主要的权限类型：读、写和执行。每个权限由一个字母表示，也称为符号。读由 `r`\
  \ 表示，写由 `w` 表示，执行由 `x` 表示。\n\n| 符号 | 权限 |\n| :--- | :--- |\n| `r` | 读 |\n| `w` |\
  \ 写 |\n| `x` | 执行 |\n\n读、写和执行是非常自言自懂的。如果你有“读”权限，你可以查看文件内容。如果你有“写”权限，你可以修改文件。如果你有“执行”权限，你可以将文件作为程序运行。然而，当这些权限被应用于目录时，它们的含义与应用于文件时略有不同。\n\
  \n| 权限 | 文件含义 | 目录含义 |\n| :--- | :--- | :--- |\n| 读 | 允许文件被读取。 | 允许读取目录中的文件名。 |\n\
  | 写 | 允许文件被修改。 | 允许修改目录内的条目。 |\n| 执行 | 允许执行文件。 | 允许访问目录内条目的的内容和元数据。 |\n\n这些权限可以应用于三类用户。这些类别（或类）是：用户（user）、组（group）和其他用户（other）。就像权限类型一样，每组都由一个字母表示。拥有文件的用户由\
  \ `u` 表示，文件所在组的用户由 `g` 表示，其他不拥有文件也不属于该文件组的用户由 `o` 表示。字符 `a` 代表所有，意味着用户、组和其他用户。\n\
  \n| 符号 | 类别 |\n| :--- | :--- |\n| `u` | 用户 |\n| `g` | 组 |\n| `o` | 其他 |\n| `a` |\
  \ 所有，用户、组和其他。 |\n\n每个用户至少属于一个组，称为主组。然而，用户通常属于多个组。例如，如果销售团队需要访问某些文件，他们可以被放入 `sales`\
  \ 组。\n\n运行 `groups` 命令查看你属于哪些组。如果你向 `groups` 命令提供另一个用户 ID，将看到该用户所属的组列表。\n\n```bash\n\
  $ groups\nusers sales\n$ id -Gn\nusers sales\n$ groups pat\nusers projectx\n$ groups\
  \ jill\nusers manager\n```\n\n## 权限解码环\n\n现在你有足够的背景信息来解码权限字符串。第一个字符是类型。下一个三个字符代表用户的权限。下一个三个字符代表文件组成员的权限。最后的三个字符代表所有其他的权限。\n\
  \n在这种情况下，顺序是有意义的。将显示用户，用户组，最后和其他。同样，读、写和执行权限类型按此顺序显示。如果未授予特定权限，连字符（`-`）将占据位置。\n\n\
  这是 `ls -l` 显示权限信息的图形化表示。\n\n![](img/00001.jpeg)\n\n如果在权限字符串末尾看到额外的字符，说明应用另一种访问控制方法。如果你看到点（`.`），该文件或目录应用了\
  \ SELlinux（安全增强 Linux）安全上下文。如果你看到加号（`+`），则使用了 ACL（访问控制列表）。SELinux 和 ACL 超出了本书的涉及范围。然而，你会高兴地发现这两者的使用都很罕见。如果你在权限遇到问题并在权限字符串中注意到额外字符，请知道可能需要进一步调查。\n\
  \n```bash\n$ ls -l sales.data.selnx\n-rw-r—r—. 1 bob users 10400 Sep 27 08:52 sales.data.selnx\n\
  $ ls -l sales.data.acl\n-rw-r—r—+ 1 bob users 10400 Sep 27 08:52 sales.data.acl\n\
  ```\n\n\n\n\n权限说明。一个或多个 `r` 表示读取，`w` 表示写入，而 `x` 表示执行。\n\n你可以使用用户类别和权限对来添加、减去或设置权限。例如，如果你想为文件组的成员添加写入权限，可以指定\
  \ `chmod g+w file`。\n\n```\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep 27\
  \ 08:52 sales.data\n$ chmod g+w sales.data\n$ ls -l sales.data\n-rw-rw-r— 1 bob\
  \ users 10400 Sep 27 08:52 sales.data\n```\n\n注意，在运行 `chmod g+w sales.data` 后，权限字符串从‘-rw-r—r—’\
  \ 变为‘-rw-rw-r—’。记住权限的显示顺序是用户（user）、组（group）和其他其它（other）。组权限现在包含了 `w` 符号，表示已授予写入权限。现在文件的所有者（`bob`）和组员（`users`）都可以读取和写入\
  \ `sales.data` 文件。这里是反操作。这是减去写入权限的方法。\n\n```\n$ ls -l sales.data\n-rw-rw-r— 1 bob\
  \ users 10400 Sep 27 08:52 sales.data\n$ chmod g-w sales.data\n$ ls -l sales.data\n\
  -rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n你可以一次性更改多个一个权限。这次，为文件的组添加了写入和执行权限。\n\
  \n```\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n\
  $ chmod g+wx sales.data\n$ ls -l sales.data\n-rw-rwxr— 1 bob users 10400 Sep 27\
  \ 08:52 sales.data\n```\n\n你甚至可以同时对不同的用户类别设置权限。以下是更改用户和组权限的方法。注意，在运行此命令之前，用户已经拥有写入权限。使用\
  \ `+` 添加权限不会取消任何现有权限；它只是在现有基础上添加。\n\n```\n$ ls -l sales.data\n-rw-r—r— 1 bob users\
  \ 10400 Sep 27 08:52 sales.data\n$ chmod ug+wx sales.data\n$ ls -l sales.data\n\
  -rwxrwxr— 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n如果你想为不同的用户类别设置不同的权限，可以使用逗号分隔这些规格说明。你可以组合使用以产生你想要的结果。以下是如何为用户指定\
  \ `rwx` 的同时为组添加 `x`。\n\n```\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep\
  \ 27 08:52 sales.data\n$ chmod u=rwx,g+x sales.data\n$ ls -l sales.data\n-rwxr-xr—\
  \ 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n如果你想让文件仅对所有人可读，请运行 `chmod a=r\
  \ file`。当你使用等号（`=`）时，权限将被设置为你指定的精确。如果你只指定了读取，那么无论现有权限如何，都只有读取可用。\n\n```\n$ ls -l\
  \ sales.data\n-rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n$ chmod a=r sales.data\n\
  $ ls -l sales.data\n-r—r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n如果你在等号后面没有指定权限，则将移除权限。以下是这种行为的插图：\n\
  \n```\n$ ls -l sales.data\n-rw-r—r— 1 bob users 10400 Sep 27 08:52 sales.data\n\
  $ chmod u=rwx,g=rx,o= sales.data\n$ ls -l sales.data\n-rwxr-x– 1 bob users 10400\
  \ Sep 27 08:52 sales.data\n```\n\n## 数字进制权限\n\n除了符号模式外，`chmod` 还可以配合八进制模式来设置文件和目录权限。理解符号模式背后的概念将帮助你学习八进制模式。然而，一旦学会了八进制模式，你可能会发现它比符号模式更快、更容易用。由于只有几种常见的实用的权限模式，它们可以被轻松记忆和提取。\n\
  \n在八进制模式中，权限基于二进制。每个权限类型被视为一个位，可以设置为关闭（0）或开启（1）。在权限中，顺序是有意义的。权限始终按照读取、写入和执行的顺序。如果\
  \ `r`、`w` 和 `x` 都设置为关闭，二进制表示为 `000`。如果它们都设置为开启，二进制表示为 `111`。要表示读取和执行权限而省略写入权限，二进制数为\
  \ `101`。\n\n| r | w | x |\n|---|---|---|\n| 0 | 0 | 0 | 关闭的二进制值 |\n| 1 | 1 | 1 |\
  \ 开启的二进制值 |\n\n| r | w | x |\n|---|---|---|\n| 0 | 0 | 0 | 关闭的十进制（decimal）值 |\n\
  | 4 | 2 | 1 | 开启的十进制（decimal）值 |\n\n要获得一个可用于 `chmod` 的数字，请将二进制表示转换为十进制（decimal）。这里的快捷方法是记住读取等于\
  \ 4，写入等于 2，执行等于 1。权限数字通过相加每种权限类型的值来确定。从零到七共有八种可能的值，因此被称为八进制模式。此表展示了所有八种可能的排列组合。\n\
  \n| 八进制 | 二进制 | 字符串 | 描述 |\n|---|---|---|---|\n| 0 | 000 | – | 无权限 |\n| 1 | 001\
  \ | —x | 仅执行 |\n| 2 | 010 | -w- | 仅写入 |\n| 3 | 011 | -wx | 写入并执行 (2 + 1) |\n| 4\
  \ | 100 | r— | 仅读取 |\n| 5 | 101 | r-x | 读取并执行 (4 + 1) |\n| 6 | 110 | rw- | 读取并写入\
  \ (4 + 2) |\n| 7 | 111 | rwx | 读取、写入和执行 (4+2+1) |\n\n## 常用权限\n\n这里是最常用的权限。这五种可以让你完成几乎需要的任何操作。\n\
  \n| 符号模式 | 八进制 | 用例 / 含义 |\n|---|---|---|\n| -rwxrwxrwx | 777 | U, G, O |\n| -rwxrxr-x\
  \ | 755 | 允许系统上的所有人执行该文件，但只有所有者可以编辑 |\n| -rwx------ | 700 | 仅所有者有访问 |\n| -rw-rw-r—\
  \ | 664 | 允许一组人修改文件并让其他人读取 |\n| -rw-rw--- | 660 | 允许一组人修改文件但不让其他人读取 |\n| -r--r--r—\
  \ | 444 | 允许系统上的所有人读取文件，但只有所有者可以编辑 |\n\n当你遇到 `777` 或 `666` 时，问自己“有没有更好的方法来这样做？”“系统上的每个人都需要对此写入权限吗？”例如，如果一个脚本或程序被设置为\
  \ `777`，那么系统上的任何人都可以对其进行更改。由于对所有人设置执行位，该程序可以执行。\n\n## 与组协作\n\n如果你在销售团队工作，并且每个成员都需要更新\
  \ `sales.report`，你可以使用 `chgrp` 命令将组设置为 `sales`，然后将权限设置为 `664(rw-rw-r--)`。如果你想确保只有销售团队的成员才能读取报告，甚至可以使用\
  \ `660(rw-rw--)`。\n\n当你创建一个文件时，它的组被设置为你的主组。这种行为可以通过使用 `newgrp` 命令来覆盖，但请记住当你创建一个文件时，它通常会继承你的默认组。在以下示例中，Bob\
  \ 的主组是 `users`。注意 `chgrp` 命令的格式为 `chgrp GROUP FILE`。\n\n```\n$ nano sales.report\n\
  $ ls -l sales.report\n-rw-r—r— 1 bob users 6 Dec 4 20:41 sales.report\n$ chgrp sales\
  \ sales.report\n$ ls -l sales.report\n-rw-r—r— 1 bob sales 6 Dec 4 20:41 sales.report\n\
  $ chmod 664 sales.report\n$ ls -l sales.report\n-rw-rw-r— 1 bob sales 6 Dec 4 20:41\
  \ sales.report\n```\n\n\n\n\n\n与其将文件保存在各个团队成员的家目录下，不如将它们保存在团队专用的位置更为方便。例如，你可以要求服务器管理员创建一个\
  \ `/usr/local/sales` 目录。该目录组应设置为 `sales`，权限应设置为 `775` (rwxrwxr-x) 或 `770` (rwxrwx—-)。如果没有销售团队之外的人需要访问\
  \ `/usr/local/sales` 中的任何文件、目录或程序，请使用 `770` (rwxrwx--)。\n\n```bash\n$ ls -ld /usr/local/sales\n\
  drwxrwxr-x 2 root sales 4096 Dec 4 20:53 /usr/local/sales\n$ mv sales.report /usr/local/sales/\n\
  $ ls -l /usr/local/sales\ntotal 4\n-rw-rw-r— 1 bob sales 6 Dec 4 20:41 sales.report\n\
  ```\n\n## 重温目录权限\n\n此示例演示了权限如何影响目录及其内容。一个常见的问题是：目录内的文件设置了正确的权限，但目录本身的权限却是错误的。例如，目录缺少正确的权限可能会阻止文件的执行。如果你确定文件的权限已设置正确，请查看父目录。通过在当前目录运行\
  \ `ls -ld .` 向目录树根节点移动，使用 `cd ..` 移动到父目录，并重复这两个步骤，直到找到问题。\n\n```bash\n$ ls -dl directory/\n\
  drwxr-xr-x 2 bob users 4096 Sep 29 22:02 directory/\n$ ls -l directory/\ntotal 0\n\
  -rwxr—r— 1 bob users 0 Sep 29 22:02 testprog\n$ chmod 400 directory\n$ ls -dl directory/\n\
  dr––— 2 bob users 4096 Sep 29 22:02 directory/\n$ ls -l directory/\nls: cannot access\
  \ directory/testprog: Permission denied\ntotal 0\n-????????? ? ? ? ? ? test testprog\n\
  $ directory/testprog\nsu: directory/testprog: Permission denied\n$ chmod 500 directory/\n\
  $ ls -dl directory/\ndr-x–– 2 bob users 4096 Sep 29 22:02 directory/\n$ ls -l directory/\n\
  total 0\n-rwxr—r— 1 bob users 0 Sep 29 22:02 testprog\n$ directory/testprog\n该程序运行成功。\n\
  ```\n\n## 默认权限与文件创建掩码\n\n文件创建掩码（file creation mask）决定了文件在创建时将分配的权限。掩码限制或屏蔽权限，从而决定了文件或目录将获得的最终权限。如果没有掩码，目录将以\
  \ `777` (rwxrwxrwx) 权限创建，文件将以 `666` (rw-rw-rw-) 权限创建。掩码可以由系统管理员设置且通常也是这样做，但也可以通过在个人初始化文件中包含\
  \ `umask` 语句来按账户进行覆盖。\n\n`umask [-S] [mode]` - 如果指定，则将文件创建掩码设置为 `mode`。如果省略了 `mode`，将显示当前模式。使用\
  \ `-S` 参数允许 `umask` 以符号表示显示或设置 `mode`。\n\n传递给 `umask` 的模式工作方式与提供给 `chmod` 的模式完全相反。当你提供\
  \ `7` 时，它被解释为开启所有权限，`rwx`。当你提供 `0` 时，它被解释为关闭所有权限，`-`。将 `chmod` 视为开启、添加或赋予权限；将 `umask`\
  \ 视为关闭、撤销权限。\n\n估算 `umask` 模式对默认权限影响的一种快速方法是：目录目录从 `777` 减去八进制 `umask` 模式，文件则从 `666`。以下是\
  \ `umask 022` 的示例，这通常是 Linux 发行版使用的默认 `umask` 或由系统管理员设置的值。\n\n| | 基础权限 | 减去 Umask\
  \ | 创建权限 |\n| :--- | :--- | :--- | :--- |\n| 目录 | 777 | -022 | 755 |\n| 文件 | 666\
  \ | -022 | 644 |\n\n使用 `002` 的 `umask` 非常适合与组员协作。你会发现，当创建文件或目录时，权限允许组成员操作这些文件和目录。\n\
  \n| | 基础权限 | 减去 Umask | 创建权限 |\n| :--- | :--- | :--- | :--- |\n| 目录 | 777 | -002\
  \ | 775 |\n| 文件 | 666 | -002 | 664 |\n\n这是另一个可用于与组员协作的 `umask`。使用 `007` 使得不向组之外的用户授予任何权限。\n\
  \n| | 基础权限 | 减去 Umask | 创建权限 |\n| :--- | :--- | :--- | :--- |\n| 目录 | 777 | -007\
  \ | 770 |\n| 文件 | 666 | -007 | 660 |\n\n再次，使用这种八进制方法是一种很好的估算。你可以看到，当 `umask` 模式为\
  \ `007` 时该方法会失效。实际上，为了每次都获得准确的结果，你需要将八进制权限转换为二进制值。从那里开始，对 `umask` 模式进行位 `NOT` 操作，然后对该结果与基础权限进行位\
  \ `AND` 操作。在这里略过这些细节是可以接受的，因为只有只有几种实用的 `umask` 模式：`022`、`002` 和 `007`。省去你的二进制作业吧，直接查看下表包含八种排列组合产生的所有权限结果。\n\
  \n| 八进制 | 二进制 | 目录权限 | 文件权限 |\n| :--- | :--- | :--- | :--- |\n| 0 | 000 | rwx |\
  \ rw- |\n| 1 | 001 | rw- | rw- |\n| 2 | 010 | r-x | r— |\n| 3 | 011 | r— | r— |\n\
  | 4 | 100 | -wx | -w- |\n| 5 | 101 | -w- | -w- |\n| 6 | 110 | —x | — |\n| 7 | 111\
  \ | — | — |\n\n## 特殊模式\n\n查看掩码设置为 `022` 时的 `umask` 输出。\n\n```bash\n$ umask 022\n\
  ```\n\n你会注意到开头多了一个零。到目前为止，你只处理了代表用户、组和其他权限的三个字符。有一类特殊模式：`setuid`、`setgid` 和 `sticky`。记住，这些特殊模式是通过在通常用于\
  \ `umask` 或 `chmod` 的八进制模式前加上一个字符来定义的。这里的要点是知道 `umask 022` 等于 `umask 022`。同样，`chmod\
  \ 644` 等于 `chmod 0644`。\n\n尽管书中将涵盖特殊模式，但将其包含在此供你参考。章节末有链接，如果你感兴趣可以了解更多这些模式。\n\n\
  - `setuid` 权限：允许进程以文件所有者的身份运行，而不是执行它的用户。\n- `setgid` 权限：允许进程以文件的组运行，而不是执行它的用户的组运行。\n\
  - `sticky bit`（粘滞位）：防止用户删除其他用户的文件，即使他们通常有权限这样做。\n\n## umask 示例\n\n以下是 `umask` 模式对文件和目录创建影响的两个示例。\n\
  \n```bash\n$ umask 0022\n$ umask -S u=rwx,g=rx,o=rx\n$ mkdir a-dir\n$ touch a-file\n\
  $ ls -l\ntotal 4\ndrwxr-xr-x 2 bob users 4096 Dec 5 00:03 a-dir\n-rw-r—r— 1 bob\
  \ users 0 Dec 5 00:03 a-file\n$ rmdir a-dir\n$ rm a-file\n\n$ umask 007\n$ umask\
  \ 0007\n$ umask -S u=rwx,g=rwx,o=\n$ mkdir a-dir\n$ touch a-file\n$ ls -l\ntotal\
  \ 4\ndrwxrwx– 2 bob users 4096 Dec 5 00:04 a-dir\n-rw-rw– 1 bob users 0 Dec 5 00:04\
  \ a-file\n```\n\n## 总结\n\n在本章中，你学习了如何查看和管理文件目录权限。你学习了读、写、执行权限，以及如何将这些权限分配给用户、组和其他。你学习了使用符号模式以及八进制权限使用\
  \ `chmod` 命令。接下来，你学习了如何通过 `newgrp` 和 `chgrp` 命令与组协作。最后，你学习了文件创建掩码以及如何使用 `umask`\
  \ 命令控制它。\n\n## 练习\n\n1. 给定以下 `ls -l` 命令的输出，分配给“staff”组的权限是什么？\n\n\n\n\n\n```\n-rwxrw-r—\
