  \ on `/` type `xfs` (`rw,relatime,attr2,inode64,noquota`)\n\n`systemd-1` on `/proc/sys/fs/binfmt_misc`\
  \ type `autofs` (`rw,relatime,fd=32,pgrp=1,timeout=300,minproto=5,maxproto=5,direct`)\n\
