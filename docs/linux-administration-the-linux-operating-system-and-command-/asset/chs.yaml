  \n`cat file` - 显示文件的全部内容。\n\n`more file` - 浏览文本文件。按空格键翻到下一页。按回车键翻到下一行。输入 `q` 退出查看。这些命令基于\
  \ `vi` 编辑器，将在下一节介绍。\n\n`less file` - 类似于 more，但允许向后移动和进行模式搜索。\n\n`head file` - 输出文件的开头（或顶部）部分。\n\
  \n`tail file` - 输出文件的结尾（或底部）部分。\n\n以下是你如何使用 `cat`、`tail` 和 `more` 命令检查名为 `file.txt`\
  \ 的文件：\n\n```bash\ncat file.txt\n这是文件的第一行。\n这是第二行。\n这是第三行。\n这是第四行。\n这是第五行。\n```\n\
  \n```bash\ntail file.txt\n这是文件的最后一行。\n这是倒数第二行。\n这是倒数第三行。\n这是倒数第四行。\n```\n\n```bash\n\
  more file.txt\n这是第一行。\n这是第二行。\n这是第三行。\n这是第四行。\n这是第五行。\n(按空格键继续，按回车键换行，输入 q 退出)\n\
  ```\n\n\n\nVim 代表“Vi 的改进版”。它与 `vi` 中的命令兼容。`vim` 的一些额外功能包括语法高亮、通过网络编辑文件、多层级撤销/重做以及屏幕分屏。在许多\
  \ Linux 发行版中，当你调用 `vi` 时，实际上运行的是 `vim`。\n\n学习 `vi` 的一个优势是 `vi` 或其变体（如 `vim`）在系统中总是可用的。另一个优势是，一旦你学会了\
  \ `vi` 的键映射，你就可以将其应用于其他命令——如 `man`、`more`、`less`、`view`——甚至是你的 shell。\n\n## Vi 模式\n\
  \n### 命令模式 (Command Mode)\n\n`vi` 有模式的概念。你始终处于三种模式之一：命令模式、插入模式或行模式。当 `vi` 启动时，你处于命令模式。若要随时返回命令模式，请按下退格键（`Esc`）。在命令模式下输入的字母不会发送到文件中，而是被解释为命令。命令模式允许你在文件中进行导航、执行搜索、删除文本、复制文本和粘贴文本。\n\
  \n这里是一些常用的导航键位绑定。\n\n- `k` - 向上一行。\n- `j` - 向下一行。\n- `h` - 向左移动一个字符。\n- `l` - 向右移动一个字符。\n\
  - `w` - 向右一个单词。\n- `b` - 向左一个单词。\n- `^` - 回到行首。\n- `$` - 到行尾。\n\n注意命令是区分大小写的。例如，如果你想向下移动一行，输入小写的\
  \ `j`。大写的 `J` 则合并行。原始的 `vi` 编辑器没有使用方向键；但 `vim` 使用了，所以你可能会发现你的系统可以使用方向键。学习原始键位的优势在于：1)\
  \ 它们始终有效；2) 速度更快，因为你的手不需要离开主位键。\n\n![](img/00003.jpeg)\n\n### 插入模式 (Insert mode)\n\
  \n要进入插入模式，请按下以下键之一。\n\n- `i` - 在光标位置插入。\n- `I` - 在行首插入。\n- `a` - 在光标位置后追加。\n- `A`\
  \ - 在行尾追加。\n\n进入插入模式后，输入所需的文本。完成后，输入 `Esc` 返回命令模式。\n\n### 行模式 (Line mode)\n\n要进入行模式，你必须先从命令模式开始，然后输入冒号（`:`）字符。如果你处于插入模式，先输入\
  \ `Esc` 返回命令模式，然后输入冒号进入行模式。这里是你可能需要知道的一些常用行模式命令。\n\n- `:w` - 写入（保存）文件。\n- `:w!`\
  \ - 强制保存文件，即使没有设置写权限。这仅适用于你拥有的文件。\n- `:q` - 退出。如果文件没有任何修改，此命令将生效。\n- `:q!` - 不保存对文件的修改直接退出。\n\
  - `:wq!` - 写入并退出。在修改文件后，此命令确保文件被保存并关闭 `vi`。\n- `:x` - 与 `:wq` 相同。\n- `:n` - 将光标置于第\
  \ `n` 行。例如，`:5` 将将光标放在文件的第五行。\n- `:$` - 将光标置于文件的最后一行。\n- `:set nu` - 开启行号。\n- `:set\
  \ nonu` - 关闭行号。\n- `:help [subcommand]` - 获取帮助。如果你想获取关于 `:w` 命令的更多信息，输入 `:help :w`。\n\
  \n| 模式 | 键 | 描述 |\n| :--- | :--- | :--- |\n| 命令 | `Esc` | 用于导航、搜索和复制/粘贴文本。 |\n|\
  \ 插入 | `i A` | 也称为插入模式。允许在文件中插入文本。 |\n| 行 | `:` | 也称为命令行模式。保存文件、退出 `vi`、替换文本并执行导航。\
  \ |\n\n这是 `vim` 的一个截图。波号（`~`）表示文件末的行。\n\n![](img/00004.jpeg)\n\n## 高级编辑\n\n你可以通过在命令前加上数字来重复\
  \ `vi` 中的命令。例如，如果你想向上移动 5 行，输入 `5k`。如果你想插入 80 次文本，输入 `80i`。一旦按下 `Esc` 返回命令模式，你输入的内容将重复\
  \ 80 次。如果你想生成一行星号，可以输入 `80*`。\n\n你能看到 `vi` 是比 `nano` 多强大的吗？\n\n### 删除文本\n\n- `x`\
  \ - 删除一个字符。\n- `dw` - 删除一个单词。要删除五个单词，输入 `5w`。在 `vi` 中的重复概念出现在很多地方。\n- `dd` - 删除一行。要删除三行，输入\
  \ `3dd`。\n- `D` - 从当前位置删除到行尾。\n\n### 修改文本\n\n- `r` - 替换当前字符。\n- `cw` - 修改当前单词。\n\
  - `cc` - 修改当前行。\n- `c$` - 从当前位置修改到行尾。\n- `C` - 与 `c$` 相同。\n- `~` - 反转字符大小。\n\n###\
  \ 复制与粘贴\n\n- `yy` - 复制（拷贝）当前行。\n- `y<position>` - 复制 `<position>`。例如，复制一个单词输入 `yw`。复制三个单词输入\
  \ `y3w`。\n- `p` - 粘贴最近删除的或复制的文本。\n\n### 撤销 / 重做\n\n- `u` - 撤销。\n\n- `Ctrl-r` - 重做。\n\
  \n### 搜索\n\n- `/<pattern>` - 正向搜索 `<pattern>`。\n- `?<pattern>` - 反向搜索 `<pattern>`。\n\
  \n### 教程\n\n从命令行运行 `vimtutor` 开始 vim 教程。\n\n## Emacs\n\n`Emacs` 是另一个强大的编辑器。有些人真的发现自己迷上了\
  \ `vi`，而另一些人非常喜欢使用 `emacs`。在 Linux 世界中这像是一种竞争。尝试 `emacs` 和 `vi` 看看哪一个更适合你。你不会选错，它们都是优秀的编辑器。\n\
  \n`emacs [file]` - 编辑文件。\n\n阅读 `emacs` 文档时，知道 `C-<char>` 表示按下 `Ctrl` 键的同时按下 `<char>`。例如，`C-h`\
  \ 表示按下 `Ctrl` 键的同时按下 `h` 键。如果你看到 `C-h t`，意味着按下 `Ctrl` 键并按下 `h`，释放 `Ctrl` 然后输入字母\
  \ `t`。\n\n当你看到 `M-<char>`，意味着按下“元”键（即 `Alt` 键）的同时按下 `<char>`。你可以用 `Esc` 键替换 `Alt`\
  \ 键。`M-f` 翻译为按下 `Alt` 键，按下并释放 `Esc`，然后输入 `f` 键。你可能需要使用 `Esc` 作为元键，因为 `Alt` 可能会被终端程序拦截。如果你想简化操作，始终使用\
  \ `Esc` 作为元键，因为它在所有情况下都有效。\n\n是一些实用的 `emacs` 命令。\n\n- `C-h` - 帮助。\n- `C-x C-c` -\
  \ 退出。按住 `Ctrl`，按下 `x`，继续按住 `Ctrl`，按下 `c`。\n- `C-x C-s` - 保存文件。\n- `C-h t` - Emacs\
  \ 有一个很好的内置教程。\n- `C-h k <key>` - 描述键。用此来获取特定键命令或键组合的帮助。\n\n### 导航\n\n- `C-p` - 上一行。\n\
  - `C-n` - 下一行。\n- `C-b` - 向后移动一个字符。\n- `C-f` -向前移动一个字符。\n- `M-f` - 向前一个单词。\n- `M-b`\
  \ - 向后一个单词。\n- `C-a` - 到行首。\n- `C-e` - 到行尾。\n- `M-<` - 到文件开头。\n- `M->` - 到文件结尾。\n\
  \n### 删除文本\n\n- `C-d` - 删除一个字符。\n- `M-d` - 删除一个单词。\n\n### 复制与粘贴\n\n- `C-k` - 剪切（杀掉）当前行的剩余文本。要剪掉整行，将光标置于行首。\n\
  - `C-y` - 从之前剪切的文本中恢复（粘贴）。\n- `C-x u` - 撤销。重复操作实现多级撤销。\n\n### 搜索\n\n- `C-s` - 开始正向搜索。输入你要查找的文本。再次按下\
  \ `C-s` 移动到下一个匹配项。完成后按下 `Enter`。\n- `C-r` - 开始反向搜索。\n\n### 重复\n\n像 `vi` 一样，emacs\
  \ 提供了一种重复命令的方法。\n\n`C-u N <command>` - 重复 `<command>` `N` 次。\n\n例如，删除三行文本，输入 `Ctrl-U\
  \ 3 Ctrl-k`。\n\n![](img/00005.jpeg)\n\n你对 `vi` 和 `emacs` 编辑器的了解只是触山一角。如果你感兴趣，还有许多内容可以学习。这两个编辑器都包含宏、全局替换等功能。针对每种编辑器都写了整整本书。\n\
  \n### 图形化编辑器\n\n到为止，你学习的是适用于通过 ssh 连接到服务器时使用的命令行编辑器。但如果你将 Linux 作为桌面操作系统运行，你可能对一些图形文本编辑器和文字处理器感兴趣。这里是一些供你参考的。\n\
  \n`emacs` - Emacs 也有图形模式。\n\n\n\n\n\n`gedit` - Gnome 桌面环境的默认文本编辑器。\n\n`gvim` - `vim`\
  \ 的图形版本。\n\n`kedit` - KDE 桌面环境的默认文本编辑器。\n\n如果你正在寻找 Microsoft Word 的替代品，可以考虑 `AbiWord`\
  \ 或 `LibreOffice`。`LibreOffice` 不仅包含文字处理器，还是一个完整的办公套件，包含电子表格程序、数据库和演示文稿。\n\n如果你正在寻找辅助计算机编程的源代码编辑器，可以查看\
  \ `Geany`、`jEdit` 或 `Kate`。`Sublime Text` 是另一个选择。它是一个运行在 Windows、Mac 和 Linux 上的商业产品。\n\
  \n## 指定默认编辑器\n\n某些命令依赖 `$EDITOR` 环境变量来告诉它们使用哪个程序进行编辑。由于 `cron` 的主要目的是调度作业，它将编辑文件的任务委托给另一个程序。`crontab\
  \ -e` 命令会调用 `$EDITOR` 环境变量指定的编辑器。你可以在个人初始化文件中设置 `$EDITOR`，以确保使用你喜欢的编辑器，无论是 `nano`、`emacs`、`vi`\
  \ 还是其他。\n\n```\n$ echo $EDITOR\nvi\n```\n\n## 总结\n\n在本章中，你学习了如何查看和编辑文件。首先，你学习了如何使用\
  \ `cat`、`more`、`less`、`head` 和 `tail` 命令显示文件内容。接着，你学习了如何使用 `nano` 文本编辑器。随后，介绍了 `vim`\
  \ 编辑器。接着介绍了 `emacs` 文本编辑器。最后，解释了图形化文本编辑器。\n\n## 验\n\n下列哪个命令显示名为“file.txt”的文件的第一行？\n\
  \n- `top file.txt`\n- `top +1 file.txt`\n- `head file.txt`\n- `head -1 file.txt`\n\
  \n你会使用什么命令来查看 `/var/log/messages` 文件的实时变化？\n\n- `watch /var/log/messages`\n- `tail\
  \ /var/log/messages`\n- `tail -f /var/log/messages`\n- `tail -1 /var/log/messages`\n\
  \n如果你需要强大复杂的编辑功能，请使用 `nano` 编辑器。\n- 正确\n- 错误\n\n哪一个不是有效的 `vi` 模式？\n\n- command\n\
  - insert\n- line\n- fundamental\n\n`Emacs` 既可以作为图形编辑器，也可以从命令行使用。\n- 正确\n- 错误\n\n\
  ## 练习答案\n\nD\nC\nB\nD\nA\n\n# Shell 脚本\n\n脚本是一种包含系列命令的命令行程序。脚本包含的命令由解释器执行。在 shell\
  \ 脚本的情况下，shell 充当解释器，并顺序执行脚本中列出的命令。\n\n任何可以在命令行执行的命令都可以放入 shell 脚本中。shell 脚本非常适合自动化任务。如果你发现自己正在运行一系列命令来完成特定任务，并且知道将来需要再次执行该任务，你可以并且可能应该为该任务创建一个\
  \ shell 脚本。\n\n让我们来看简单的 shell 脚本。这个脚本名为 `script1.sh`。\n\n```bash\n#!/bin/bash\n\
  echo “Scripting is fun!”\n```\n\n在尝试执行脚本之前，确保它是可执行的。\n\n```\n$ chmod 755 script1.sh\n\
  ```\n\n以下是执行脚本时发生的情况。\n\n```bash\n$ ./script1.sh\nScripting is fun!\n$\n```\n\n\
  ## Shebang (解释器路径)\n\n你会注意到脚本的第一行以 `#!` 开头，后面跟着 bash shell 程序的路径 `/bin/bash`。井号与音乐记谱法中使用的升号非常相似。此外，有些人将感叹号称为“bang”。因此，`#!`\
  \ 可以读作“sharp bang”。Shebang 这个词是“sharp bang”的一种不精确缩写。\n\n当脚本的第一行以 shebang 开头时，后续内容被用作脚本列表中命令的解释器。这里有三个\
  \ shell 脚本示例，每个示例都使用不同的 shell 程序作为解释器。\n\n```csh\n#!/bin/csh\necho “This script\
  \ uses csh as the interpreter.”\n```\n\n```bash\n#!/bin/ksh\necho “This script uses\
  \ ksh as the interpreter.”\n```\n\n```zsh\n#!/bin/zsh\necho “This script uses zsh\
  \ as the interpreter.”\n```\n\n当你执行包含 shebang 的脚本时，实际发生的是执行了解释器，并将调用脚本的路径作为参数传递给解释器。你可以通过检查进程表来证明这一点。\n\
  \n让我们在后台启动脚本 `sleepy.sh` 并查看进程表。\n\n`sleepy.sh` 的内容：\n\n```bash\n#!/bin/bash\nsleep\
  \ 90\n```\n\n让我们在后台执行它并查看进程。\n\n```bash\n$ ./sleepy.sh &\n[1] 16796\n$ ps -fp 16796\n\
  UID PID PPID C STIME TTY TIME CMD\njason 16796 16725 0 22:50 pts/0 00:00:00 /bin/bash\
  \ ./sleepy.sh\n$\n```\n\n你可以看到实际运行的是 `/bin/bash ./sleepy.sh`。让我们使用脚本的完整路径。\n\n```bash\n\
  $ /tmp/sleepy.sh &\n[1] 16804\n$ ps -fp 16804\nUID PID PPID C STIME TTY TIME CMD\n\
  jason 16804 16725 0 22:51 pts/0 00:00:00 /bin/bash /tmp/sleepy.sh\n$\n```\n\n确实，`/bin/bash\
  \ /tmp/sleepy.sh` 正在执行。我们可以看到 `/bin/bash` 正在执行 `sleep` 命令。\n\n## 变量\n\n你可以在 shell\
  \ 脚本中使用变量。变量是带有名称的存储位置。你可以将变量理解为键值对。为变量赋值时使用语法 `VARIABLE_NAME=\"Value\"`。在等号前后不要留空格。此外，变量对大小写敏感，按照习惯，变量名使用大写。\n\
  \n```bash\nMY_SHELL=\"bash\"\n```\n\n使用变量时，在变量名前面加上美元符号。\n\n```bash\nMY_SHELL=\"\
  bash\"\necho “I like $MY_SHELL.”\n```\n\n你也可以将变量名放在括号中，并在括号前加上美元符号。语法为：`${VARIABLE_NAME}`。\n\
  \n```bash\nMY_SHELL=\"bash\"\necho “I like ${MY_SHELL}.”\n```\n\n除非紧跟变量的是额外数据，否则括号语法是可选的。\n\
  \n```bash\nMY_SHELL=\"bash\"\necho “I am ${MY_SHELL}ing on my keyboard.”\n```\n\n\
  如果不将变量封装在括号中，shell 将把额外文本视为变量名的一部分。由于不存在该名称的变量，因此不会填充任何内容。\n\n```bash\nMY_SHELL=\"\
  bash\"\necho “I am $MY_SHELLing on my keyboard.”\n```\n\n你还可以将命令的输出赋值给变量。这样做只需将命令放在括号中并在其前面加上美元符号。\n\
  \n```bash\nSERVER_NAME=$(hostname)\necho “You are running this script on ${SERVER_NAME}.”\n\
  ```\n\n`hostname` 命令的输出存储在变量 `SERVER_NAME` 中。\n\n你也可以将命令放在反引号中。这是一种正在被 `$()` 语法取代的旧语法。\n\
  \n```bash\nSERVER_NAME=`hostname`\necho “You are running this script on ${SERVER_NAME}.”\n\
  ```\n\n\n\n\n\n变量名可以包含字母、数字和下划线。它们可以字母字母或下划开头，但不能以数字开头。以下是有效变量名的示例。\n\n`FIRST3LETTERS=\"\
  ABC\"`\n`FIRST_THREE_LETTERS=\"ABC\"`\n`firstThreeLetters=\"ABC\"`\n\n以下是一些无效变量名的示例。\n\
  \n`3LETTERS=\"ABC\"`\n`first-three-letters=\"ABC\"`\n`first@Three@Letters=\"ABC\"\
  `\n\n## 测试 (Tests)\n\n脚本的设计是为了取代人工物理坐在键盘前输入一系列命令。如果你有一个想要自动化的任务，但它需要根据不同的情况执行不同的操作，会怎样？由于在脚本运行时，人可能不在场做决定，我们需要对这些条件进行测试并让脚本采取相应的行动。\n\
  \n要创建一个测试，在括号之间放置一个条件表达式。语法为：`[ condition-to-test-for ]`。你可以测试多种类型的情况。例如，你可以比较字符串是否相等、一个数字是否大于另一个数字，或者文件是否存在。此测试检查\
  \ `/etc/passwd` 是否存在。如果存在，它返回 true。换句话说，命令以状态 `0` 退出。如果文件不存在，它返回 false。即，命令以状态 `1`\
  \ 退出。\n\n```bash\n[ -e /etc/passwd ]\n```\n\n如果你正在使用 `bash` shell，可以运行命令 `help test`\
  \ 来查看你可以执行的各种类型的测试。你也可以阅读测试的 man 页：`man test`。这里是你可以执行的一些更常见的测试。\n\n文件操作符：\n- `-d\
  \ FILE` 如果文件是目录，则为 True。\n- `-e FILE` 如果文件存在，则为 True。\n- `-f FILE` 如果文件存在且是普通文件，则为\
  \ True。\n- `-r FILE` 如果你可以读取，则为 True。\n- `-s FILE` 如果文件存在且为空，则为 True。\n- `-w FILE`\
  \ 如果文件可写，则为 True。\n- `-x FILE` 如果文件可执行，则为 True。\n\n字符串操作操作符：\n- `-z STRING` 如果字符串为空，则为\
  \ True。\n- `-n STRING` 如果字符串不为空，则为 True。\n- `STRING` 如果字符串不为空，则为 True。\n- `STRING1\
  \ = STRING2` 如果字符串相等，则为 True。\n- `STRING1 != STRING2` 如果字符串不相等，则为 True。\n\n算术操作符：\n\
  - `arg1 -eq arg2` 如果 `arg1` 等于 `arg2`，则为 True。\n- `arg1 -ne arg2` 如果 `arg1` 不等于\
  \ `arg2`，则为 True。\n- `arg1 -lt arg2` 如果 `arg1` 小于 `arg2`，则为 True。\n- `arg1 -le arg2`\
  \ 如果 `arg1` 小于等于 `arg2`，则为 True。\n- `arg1 -gt arg2` 如果 `arg1` 大于 `arg2`，则为 True。\n\
  - `arg1 -ge arg2` 如果 `arg1` 大于等于 `arg2`，则为 True。\n\n## if 语句 (The if Statement)\n\
  \n现在你知道如何判断某个条件是否成立，你可以将其与 `if` 语句结合起来，在脚本中做出决策。\n\n`if` 语句以单词 `if` 开头，后面跟着一个测试。下一行包含单词\
  \ `then`。接下来是一系列如果测试条件为真将执行的命令。最后，`if` 语句以 `fi` 结束，它是 `if` 的反拼写。以下是语法。\n\n```bash\n\
  if [ condition-true ]\nthen\ncommand 1\ncommand 2\n…\nfi\n```\n\n这里是一个示例：\n\n```bash\n\
  #!/bin/bash\nMY_SHELL=\"bash\"\nif [ \"$MY_SHELL\" = \"bash\" ]\nthen\necho \"You\
  \ seem to like the bash shell.\"\nfi\n```\n\n在执行条件测试时，将变量括在引号中是最佳实践，可以防止意外的副作用。这是运行脚本的输出：\n\
  \n```\nYou seem to like the bash shell.\n```\n\n你也可以使用 `if/else` 语句在条件不成立时执行某个操作。以下是\
  \ `if/else` 语句的样式。\n\n```bash\nif [ condition-true ]\nthen\ncommand 1\ncommand 2\n\
  …\nelse #\ncommand 3\ncommand 4\n…\nfi\n```\n\n让我们更新脚本，以便在语句不成立时执行某个操作。\n\n```bash\n\
  #!/bin/bash\nMY_SHELL=\"csh\"\nif [ \"$MY_SHELL\" = \"bash\" ]\nthen\necho \"You\
  \ seem to like the bash shell.\"\nelse\necho \"You don’t seem to like the bash shell.\"\
  \nfi\n```\n\n这是输出。因为 `[ \"$MY_SHELL\" = \"bash\" ]` 结果为假，所以执行了 `else` 之后的语句。\n\n\
  ```\nYou don’t seem to like the bash shell.\n```\n\n你还可以使用 `elif` 测试多个条件。`elif`\
  \ 是 “else if”的缩写。像 `if` 一样，`elif` 后面跟着要测试的条件。在下一行，使用单词 `then`。最后，提供一系列如果条件求值为真时执行的命令。\n\
  \n```bash\nif [ condition-true ]\nthen\ncommand 1\ncommand 2\n…\nelif [ condition-true\
  \ ]\nthen\ncommand 3\ncommand 4\n…\nelse #\ncommand 5\ncommand 6\n…\nfi\n```\n\n\
  这里是一个使用 `elif` 更新后的脚本：\n\n```bash\n#!/bin/bash\nMY_SHELL=\"csh\"\nif [ \"$MY_SHELL\"\
  \ = \"bash\" ]\nthen\necho \"You seem to like the bash shell.\"\nelif [ \"$MY_SHELL\"\
  \ = \"csh\" ]\nthen\necho \"You seem to like the csh shell.\"\nelse\necho \"You\
  \ don’t seem to like the bash or csh shells.\"\nfi\n```\n\n输出：\n```\nYou seem to\
  \ like the csh shell.\n```\n\n## for 循环 (The for Loop)\n\n如果你想对项目列表执行某些操作，请使用 `for`\
  \ 循环。`for` 循环的第一行以单词 `for` 开头，后面跟着变量名，然后是单词 `in` 和一个项目列表。下一行包含单词 `do`。在后续行中放置你想要执行的语句；最后用单行的单词\
  \ `done` 结束 `for` 循环。\n\n```bash\nfor VARIABLE_NAME in ITEM_1 ITEM_2 ITEM_N\ndo\n\
  command 1\ncommand 2\n```\n\n本质上，`for` 循环会将列表中的每个项赋值给变量并执行代码块。这是一个显示 `for` 循环如何工作的简单脚本：\n\
  \n```bash\nfor color in red blue green\ndo\necho\nThe color is $color\"\ndone\n\
  ```\n\n输出：\n```\nThe color is red\nThe color is blue\nThe color is green\n```\n\n\
  ## 位置参数 (Positional Parameters)\n\n位置参数是包含命令行内容的变量。这些变量是 `$0` 到 `$9`。脚本本身存储在 `$0`\
  \ 中，第一个参数在 `$1`，第二个在 `$2`，以此此类推。参考此命令行示例：\n\n```\n$ script.sh parameter1 parameter2\
  \ parameter3\n```\n\n`$0` 的内容是 `script.sh`， `$1` 是 `parameter1`， `$2` 是 `parameter2`，\
  \ `$3` 是 `parameter3`。\n\n脚本 `archive_user.sh` 接受一个作为用户名的参数：\n\n```bash\n#!/bin/bash\n\
  echo \"Executing script: $0\"\necho \"Archiving user: $1\"\n## 锁定账户\npasswd -l $1\n\
  ## 创建家目录的存档\ntar cf /archives/${1}.tar.gz /home/${1}\n```\n\n当我们执行 `archive_user.sh`\
  \ 脚本时，输出如下：\n\n```\n$ ./archive_user.sh elvis\nExecuting script: ./archive_user.sh\n\
  Archiving user: elvis\npasswd: password expiry information changed.\ntar: Removing\
  \ leading ‘/ from member names\n```\n\n## 注释 (Comments)\n\n井号之后的所有内容都是注释。唯一的例外是第一行的\
  \ shebang。在脚本的其他地方，当遇到井号时，它标记了注释的开始。注释会被解释器忠实地忽略，因为它们是为了我们人类的利益。\n\n井号之后的内容都会被忽略。如果井号从行开始，则整行都会被忽略。如果在行中间遇到井号，则井号右侧的信息将被忽略。\n\
  \n\n\n\n\n与其在整个脚本中引用 `$1`，不如将其值赋值给一个更有意义的变量名。\n\n```bash\n#!/bin/bash\n\nUSER=$1\
  \ # 第一个参数是用户。\n\necho “Executing script: $0”\n\necho “Archiving user: $USER”\n\n\
  ## 锁定账户\n\npasswd -l $USER\n\n# 创建家目录的存档。\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n\
  ```\n\n输出保持不变。\n\n```bash\n$ ./archive_user.sh elvis\n\nExecuting script: ./archive_user.sh\n\
  \nArchiving user: elvis\n\npasswd: password expiry information changed.\ntar: Removing\
  \ leading `/’ from member names\n$\n```\n\n你可以使用特殊变量 `$@` 访问从 `$1` 开始到命令行最后一个参数的所有位置参数。以下是如何更新\
  \ `archive_user.sh` 脚本以接受一个或多个参数。\n\n```bash\n#!/bin/bash\n\necho “Executing script:\
  \ $0”\n\nfor USER in $@\n\ndo\n\necho “Archiving user: $USER”\n\n## 锁定账户\n\npasswd\
  \ -l $USER\n\n# 创建家目录的存档。\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n\ndone\n\
  ```\n\n让我们向脚本传递多个用户。\n\n```bash\n$ ./archive_user.sh chet joe\n\nExecuting script:\
  \ ./archive_user.sh\n\nArchiving user: chet\n\npasswd: password expiry information\
  \ changed.\ntar: Removing leading `/’ from member names\nArchiving user: joe\n\n\
  passwd: password expiry information changed.\ntar: Removing leading `/’ from member\
  \ names\n$\n```\n\n## 获取用户输入\n\n如果你想接受标准输入，请使用 `read` 命令。记住，标准输入通常来自人在键盘上的输入，但也可以来自其他源，例如命令管道中命令的输出。`read`\
  \ 命令的格式为 `read -p “PROMPT” VARIABLE_NAME`。这个版本的 `archive_user.sh` 脚本会请求账户。\n\n```bash\n\
  #!/bin/bash\n\nread -p “Enter a user name: ” USER\n\necho “Archiving user: $USER”\n\
  \n## 锁定账户\n\npasswd -l $USER\n\n# 创建家目录的存档。\n\ntar cf /archives/${USER}.tar.gz /home/${USER}\n\
  ```\n\n让我们运行此脚本并存档 mitch 账户。\n\n```bash\n$ ./archive_user.sh\n\nEnter a user name:\
  \ mitch\n\nArchiving user: mitch\n\npasswd: password expiry information changed.\n\
  tar: Removing leading `/’ from member names\n$\n```\n\n## 总结\n\n- Shell 脚本的第一行应该以\
  \ shebang 开头，后面紧跟用于执行脚本的解释器路径。\n- 要给变量赋值，请以变量名开始，后跟一个等号，然后是值。不要在等号之前或之后使用空格。\n-\
  \ 你可以使用 `$VARIABLE_NAME` 或 `${VARIABLE_NAME}` 访问存储在变量中的。如果你想在变量前后添加额外数据，则需要使用后一种形式。\n\
  - 要将命令的输出赋值给变量，请将命令括在括号中并在前面加一个美元符号。`VARIABLE_NAME=$(command)`。\n- 通过将表达式放在括号中来执行测试。测试通常与\
  \ `if` 语句结合。\n- 使用 `if`、`if/else` 或 `if/elif/else` 语句在脚本中进行决策。\n- 要对多个项目执行操作或一系列操作，请使用\
  \ `for` 循环。\n- 要访问命令行上的项目，请使用位置参数。程序名称由 `$0` 表示，第一个参数由 `$1` 表示，依此类推。要访问从第一个参数（`$1`）开始的命令行所有项目，请使用特殊变量\
  \ `$@`。\n- 你可以使用井号在脚本中编写注释。\n- 使用 `read` 命令接受用户输入。\n\n## 测验\n\n1. Shell 脚本的第一行通常以\
  \ shebang 开头，后面紧跟用于执行脚本中命令的解释器路径。\n   - 正确\n   - 错误\n\n2. 下列哪个变量有效？\n   - `3LETTERS=“ABC”`\n\
  \   - `first-three-letters=“ABC”`\n   - `first@Three@Letters=“ABC”`\n   - `FIRST3LETTERS=“ABC”`\n\
  \n3. 在给定命令行的情况下，“$1” 的值是：\n   `$ ./add-user.sh tom richard harry`\n   - `./add-user.sh`\n\
  \   - `tom`\n   - `richard`\n   - `harry`\n\n4. 给变量赋值的正确方法是哪种？\n   - `VAR=“VALUE”`\n\
  \   - `VAR = “VALUE”`\n\n5. 下列哪项会将 `hostname` 命令的输出赋值给变量 `HOSTNAME`？\n   - `HOSTNAME=$(hostname)`\n\
  \   - `HOSTNAME=`hostname``\n   - 以上所有。\n\n## 测验答案\n\n- A\n- D\n- B\n- A\n- C\n\n\
