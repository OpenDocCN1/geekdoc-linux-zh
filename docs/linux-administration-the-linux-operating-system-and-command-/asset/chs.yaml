  \ 大小 (最小/最优): 512 bytes / 512 bytes\n\n磁盘标签类型: gpt\n\n### Start End Size Name\n\n\
  1 2048 83886046 40G Linux\n\n命令 (m 帮助): w\n\n分区表已更改！\n\n正在调用 ioctl 读取分区表。\n\n正在同步。\n\
  ```\n\n## 创建文件系统\n\n在 Linux 系统使用分区之前，需要一个文件系统。最初专门为 Linux 创建的 `ext` 扩展系统很快被 `ext2`（第二个扩展系统）取代。之后，`ext3`（第三个扩展系统）和\
  \ `ext4`（第四个扩展系统）被发布。这些是 Linux 上最常用的文件系统，通常作为 Linux 发行版的默认文件系统。如果你有特殊需求，应该研究 Linux\
  \ 提供的其他流行文件系统，包括 ReiserFS、`JFS`、`XFS` 和 `Btrfs`。\n\n要创建文件系统，使用 `mkfs` 命令。格式为 `mkfs\
  \ -t TYPE DEVICE`。`TYPE` 是如 `ext3`、`btrfs` 等类型。`DEVICE` 是你希望文件系统所在的分区路径。这里是在 `sdb`\
  \ 磁盘第二个分区上创建 `ext3` 文件系统的方法。\n\n```\n# mkfs -t ext3 /dev/sdb2\n\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\
  \nFilesystem label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096\
  \ (log=2)\n\nStride=0 blocks, Stripe width=0 blocks\n```\n\n（注：源文本包含 mke2fs 输出的重复块；我按照要求保留了核心命令结构）。\n\
  \n```\n# mkfs -t ext3 /dev/sdb2\n```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\nFilesystem\
  \ label=\nOS type: Linux\n\nBlock size=4096 (log=2)\n\nFragment size=4096 (log=2)\n\
  \nStride=0 blocks, Stripe width=0 blocks\n```\n\n```\n# mkfs -t ext3 /dev/sdb2\n\
  ```\n\n```\nmke2fs 1.42.9 (28-Dec-2013)\n\nFilesystem label=\nOS type: Linux\n\n\
  Block size=4096 (log=2)\n\nFragment size=4096 (log=2)\n\nStride=0 blocks, Stripe\
  \ width=0 blocks\n```\n\n`mkfs` 工具实际上是各种文件系统构建器的前端。运行 `mkfs -t ext4 /dev/sdb3` 实际上等同于运行\
  \ `mkfs.ext4 /dev/sdb3`。如果你想查看文件系统的可用选项，请咨询对应命令的帮助页。例如，你可以运行 `man mkfs.xfs` 来查找关于创建\
  \ XFS 文件系统的更多信息。\n\n```\n# ls -1 /sbin/mkfs*\n```\n\n```\n/sbin/mkfs\n/sbin/mkfs.btrfs\n\
  /sbin/mkfs.cramfs\n/sbin/mkfs.ext2\n/sbin/mkfs.ext3\n/sbin/mkfs.ext4\n/sbin/mkfs.minix\n\
  /sbin/mkfs.xfs\n```\n\n## 挂载和卸载分区\n\n要挂载分区，使用 `mount` 命令，跟随设备路径以及你想挂载该设备的目录。例如，要将\
  \ `/dev/sdb3` 挂载到 `/opt`，运行 `mount /dev/sdb3 /opt`。\n\n```\n# mount /dev/sdb3 /opt\n\
  ```\n\n你可以不带任何参数使用 `mount` 命令查看当前挂载情况。注意，`mount` 不仅显示物理文件系统，还会显示虚拟文件系统。这些虚拟文件系统通常基于内存的文件系统，提供了与系统部分交互的方法。如果你想要包含存储设备的挂载点快捷列表，请使用\
  \ `df` 命令。你可以将 `df` 命令视为“磁盘剩余”命令，因为它报告文件系统使用情况。\n\n```\nmount\nproc on /proc type\
  \ proc (rw,nosuid,nodev,noexec,relatime)\n\nsysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime)\n\
  \ndevtmpfs on /dev type devtmpfs (rw,nosuid,size=500196k,nr_inodes=125049,mode=755)\n\
  \nsecurityfs on /sys/kernel/security type securityfs (rw,nosuid,nodev,noexec,relatime)\n\
  \ntmpfs on /dev/shm type tmpfs (rw,nosuid,nodev)\n```\n\n\n\n\n\n`devpts` on `/dev/pts`\
