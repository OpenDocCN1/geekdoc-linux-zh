  \ `ifconfig eth0 add 10.11.12.13`。通过在 IP 地址后跟随正斜杠并提供子网掩码，你也可以提供子网掩码，例如：`ifconfig\
  \ eth0 add 10.11.12.13/255.255.255.0`。要启用接口，请运行 `ip link set eth0 up`。\n\n如果 `ifconfig`\
