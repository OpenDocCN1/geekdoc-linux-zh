  \ 创建交换空间\n\n交换空间不是通过创建文件系统并挂载它，而是创建一个交换区域并启用它。要准备交换分区供使用，使用 `mkswap` 命令后跟分区的路径。要启用交换分区，使用\
  \ `swapon` 命令后跟设备路径。要查看正在使用的交换设备，请运行 `swapon -s`。\n\n### `mkswap /dev/sdb1`\n\n\
  ```\n正在设置交换空间版本 1，大小 = 104872 KiB\nno label, UUID=619dc6d9-1b0b-4a9a-9df5-bfc43fb8d6e\n\
  ```\n\n### `swapon /dev/sdb1`\n\n### `swapon -s`\n\n```\n| 文件名 | 类型 | 大小 | 使用 |\
  \ 优先级 |\n| :--- | :--- | :--- | :--- | :--- |\n| `/dev/sda1` | 分区 | 204799 | 0 |\
  \ -1 |\n| `/dev/sdb1` | 分区 | 104857 | 0 | -2 |\n```\n\n## 文件系统表\n\n`/etc/fstab`\
  \ 文件控制 Linux 系统上的设备挂载位置以及挂载这些设备时使用的选项。每个条目由六列组成。如果一行以 `#` 开头，它是注释会被忽略。这六列分别是设备、挂载点、文件系统类型、选项、dump\
  \ 和文件系统检查顺序。这些列之间通过空格或制表符分隔。这里有一个 `/etc/fstab` 示例。\n\n| 设备 | 挂载点 | 文件系统类型 | 选项 |\
  \ dump | fsck |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `/dev/sda2` | `/`\
  \ | `xfs` | defaults | 0 | 1 |\n| `/dev/sda1` | `swap` | `swap` | defaults | 0 |\
  \ 0 |\n\n### 设备\n\n此列包含设备的路径。\n\n### 挂载点\n\n此列决定设备挂载的位置。\n\n### 文件系统类型\n\n第三列包含文件系统类型。\n\
  \n### 选项\n\n第四列包含挂载选项。\n\n### dump\n\n第五列是 dump 值。\n\n### fsck\n\n第六列是文件系统检查顺序。\n\
  \n\n\n\n\n在本章中，你学习了什么是分区表以及使用分区的一些原因。你还学习了 `GPT` 和 `MBR` 分区表。本章涵盖了挂载点（mount points）以及它们如何简单作为用于访问分区上数据的目录。你还学习了如何使用\
  \ `fdisk` 工具创建分区。\n\n本章还涵盖了如何使用 `mkfs` 命令创建文件系统，以及如何使用 `mount` 命令挂载这些文件系统。一旦文件系统被挂载，你就学会了如何使用\
  \ `df` 命令查看磁盘使用情况。接下来，我们讨论了如何使用 `umount` 命令卸载文件系统。你还学习了如何使用 `mkswp` 命令准备交换空间（swap\
  \ space），以及如何使用 `swapon` 启用它。\n\n## 测验\n\n对磁盘进行分区允许你为不同的用途分配磁盘的不同区域。\n\n正确\n错误\n\
  \n`MBR` 分区方案允许多少个主分区？\n\n2\n3\n4\n无限制\n\n挂载点仅仅是用于访问分区上数据的目录。\n\n正确\n错误\n\n这两个命令执行相同的任务：\n\
  \n```\nmkfs -t ext4 /dev/sdb3\nmkfs.ext4 /dev/sdb3\n```\n\n正确\n错误\n\n哪个命令用于卸载文件系统。\n\
  \nunmount\numount\ndismount\n\n`/etc/filetab` 文件控制设备在 Linux 系统上的挂载位置，以及在挂载这些设备时使用哪些选项。\n\
  \n正确\n错误\n\n可以使用哪个命令或命令查看 UUID？\n\n仅限 `uuid` 命令。\n仅限 `lsblk` 命令。\n仅限 `blkid` 命令。\n\
  同时使用 `lsblk` 和 `blkid` 命令。\n\n哪个命令准备交换分区供使用？之后，你可以使用 `swapon` 命令启用交换分区。\n\nmkswap\n\
  mkswp\nmakeswap\n\n## 测验答案\n\nA\nC\nA\nA\nB\nB\nD\nA\n\n# 管理用户和组\n\nLinux 是一个多用户操作系统。系统不仅可以存在多个账户，而且这些账户中的每一个都可以同时被使用。每个账户由一个用户名和一个名为\
  \ `UID`（user ID 的缩写）的唯一数字组成。此外，每个账户都有其所属的默认组、与账户关联的一些注释、用户登录系统时执行的 shell 以及一个主目录。所有信息都存储在\
  \ `/etc/passwd` 文件中。\n\n`/etc/passwd` 文件的第一条目是 root 账户。\n\n```\nroot:x:0:0:root:/root:/bin/bash\n\
  ```\n\n`/etc/passwd` 文件的格式如下。\n\n`username:password:UID:GID:comments:home_dir:shell`\n\
  \n每个字段由冒号分隔。让我们逐一查看它们。\n\n- **用户名 (Username)**：`root`\n- **密码 (Password)**：`x`（这意味着加密密码存储在\
  \ `/etc/shadow` 中，稍后你会学习它。）\n- **UID**：`0`\n- **GID**：`0`\n- **注释 (Comment)**：`root`\n\
  - **主目录 (Home directory)**：`/root`\n- **Shell**：`/bin/bash`\n\n让我们 `/etc/passwd`\
  \ 文件中的另一个条目。这是 `joe` 账户的。\n\n```\njoe:x:1000:1000:Joe Henderson:/home/joe:/bin/bash\n\
  ```\n\n- **用户名 (Username)**：`joe`\n- **密码 (Password)**：`x`\n- **UID**：`1000`\n-\
  \ **GID**：`1000`\n- **注释 (Comment)**：`Joe Henderson`\n- **主目录 (Home directory)**：`/home/joe`\n\
  - **Shell**：`/bin/bash`\n\n尽管 Linux 支持长度达 32 个字符的用户名，但习惯上是将用户名保持在 8 个字符以内。当使用超过\
  \ 8 个字符的用户名时，你会遇到显示 `UID` 代替用户名或显示用户名的截断版本的情况。例如，在查看 `ps` 命令的输出时。\n\n这是一个长用户名被截断的示例。\n\
  \n```\nps -fu jasoncannon\nUID PID PPID C STIME TTY TIME CMD\njasonca+ 2973 1 0\
  \ 01:43 ? 00:00:00 bash\n```\n\n这在旧版本的 Linux 上可能是它的样子。长用户名直接被其 `UID` 替换。\n\n```\n\
  ps -fu jasoncannon\nUID PID PPID C STIME TTY TIME CMD\n1000 2973 1 0 01:43 ? 00:00:00\
  \ bash\n```\n\n用户名是区分大小写的。尽管用户名中允许大写字母，但按照惯例，用户名全为小写。用户名中也允许数字，但要避免特殊字符。\n\n从历史上看，加密密码信息存储在\
  \ `/etc/passwd` 文件的用户名之后。然而，`/etc/passwd` 文件对系统中的任何人都可以读取，因此存储密码信息（即使是加密的）存在安全风险。现在，默认情况下，加密密码信息存储在\
  \ `/etc/shadow` 中，只有超级用户账户可以读取。\n\n`UID` 是一个唯一的数字。root 账户始终是 `UID 0`。通常供系统使用的账户其\
  \ `UID` 小于 1000。这可以通过更新 `/etc/login.defs` 文件进行配置。\n\n账户密码文件条目中列出的组 ID（或 `GID`）是该账户的组。`/etc/passwd`\
  \ 文件中的注释字段通常包含账户的真实姓名或描述，即早期的 GCOS 字段。该字段可以为空。\n\n当用户登录系统时，shell 字段将执行。你可以通过查看 `/etc/shells`\
  \ 看到系统中安装的 shell。例如，你可以看到 `/usr/sbin/nologin` 或 `/bin/false`，这确保了用户无法交互式访问。\n\n\
  ## Shadow 文件 (Shadow File)\n\n类似于 `/etc/passwd` 文件，`/etc/shadow` 文件包含一组由冒号分隔的字段。\n\
  \n```\nroot:$6$9g1AYzqPorEZSHjWeZP8o21:16502:::\n```\n\n第一个字段是用户名。第二个字段包含加密密码。第三字段是自\
  \ 1970 年 1 月 1 日以来密码更改的天数。第四字段是密码有效期的天数。第五字段是必须更改密码的天数。如果此字段包含 `99999`，则用户不需要更改密码。第六字段是警告用户密码将过期的天数。第七字段是密码过期后账户禁用的天数。第八字段是自\
  \ 1970 年 1 月 1 日以来账户禁用的天数。第九字段留供后用。\n\n## 创建账户\n\n现在你已经知道账户信息存储在哪里，让我们使用 `useradd`\
  \ 命令创建一个账户。添加账户需要超级权限，因此请确保你正在使用 root 账户或 `sudo`。这是 `useradd` 命令的格式。\n\n```\nuseradd\
  \ [options] username\n```\n\n`useradd` 命令常用的选项有：\n\n- `-c “COMMENT”`：账户注释，例如用户的全名。\n\
  - `-m`：使用 `-m` 选项创建用户的主目录。\n- `-s /shell/path`：用户 shell 的路径。\n\n在这个示例中，为 Grant Stewart\
  \ 创建了一个账户。他的用户名是 `grant`，shell 是 `bash`。\n\n```\nuseradd -c “Grant Stewart” -m -s\
  \ /bin/bash grant\n```\n\n接下来，为账户分配密码。要执行此操作，请使用 `passwd` 命令加上用户名。系统会提示输入用户密码并确认该密码。\n\
  \n```\npasswd grant\nEnter new UNIX password:\nRetype new UNIX password:\npasswd:\
  \ password updated successfully\n```\n\n这是该账户在 `/etc/passwd` 文件和 `/etc/shadow` 文件中的条目。\n\
  \n```\ntail -1 /etc/passwd\ngrant:x:1000:1000:Grant Stewart:/home/grant:/bin/bash\n\
  \ntail -1 /etc/shadow\n```\n\n\n\n\n\ngrant: $6$iDDgPYtR$0D1s0AMkFkQ7NvQe8c2Uc.:16507:0:99999:7:::\n\
  \ngrant 的 `UID` 是 1000，他的 `GID` 是 1000，家目录是 `/home/grant`，其 shell 是 `/bin/bash`。\n\
  \n`useradd` 命令的其他选项还包括：\n\n- `-g GROUP` 指定账户的默认组。\n- `-G GROUP1,GROUPN` 将账户添加到附加组。\n\
  \n让我们为 Eddie Harris 创建一个账户。他的登录名为为 `eharris`，默认组为 `sales`。我们还将让他成为 `projectx` 组的成员。\n\
  \n```\nuseradd -c “Eddie Harris” -m -s /bin/bash -g sales -G projectx eharris\n\
  passwd eharris\n```\n\n输入新的 UNIX 密码：\n\n重新输入新的 UNIX 密码：\n\n`passwd: password updated\
  \ successfully`\n\n## 创建系统账户或应用程序账户\n\nLinux 系统上的并非每个账户都是供人类使用的。某些账户是为了运行应用程序或执行系统功能而存在的。一些常见示例包括运行\
  \ Web 服务器进程、数据库进程或应用程序进程的账户。\n\n让我们创建一个用于运行 Apache Web 服务器进程的账户。\n\n```\nuseradd\
  \ -c “Apache Web Server User” -d /opt/apache -r -s /usr/sbin/nologin apache\ntail\
  \ -1 /etc/passwd\n```\n\n`apache:x:999:999:Apache Web Server User:/opt/apache:/usr/sbin/nologin`\n\
  \n你会注意到 shell 被设置为 `/usr/sbin/nologin`。这是因为我们不希望有人能够使用该账户登录系统。我们还使用了 `-r` 选项，它指示\
  \ `useradd` 创建一个系统账户。实际上，这意味着账户将根据 `/etc/login.defs` 中定义的系统账户范围获得 `UID`。在本例中，用户获得了\
  \ `UID` 999。\n\n使用 `-d` 选项指定了家目录。默认情况下，新账户的家目录在 `/home` 目录下创建。实际目录将是用户账户名。默认情况下，`apache`\
  \ 账户的家目录将是 `/home/apache`。但由于此账户将由应用程序使用，我们将家目录设置为安装应用程序的目录。\n\n注意，在本例中没有使用 `-m`\
  \ 选项。使用 `-m` 选项时，骨架目录（默认为 `/etc/skel`）的内容会被复制到用户的家目录。`/etc/skel` 的内容通常包含应用程序账户不需要的\
  \ 配置文件。\n\n以下是我们创建此账户时使用的新选项：\n\n- `-r` 创建系统账户。\n- `-d /path/to/home` 使用 `-d` 指定家目录。\n\
  \n在多个系统中为账户使用相同的 `UID` 是一种常见做法。这使得同步数据或共享数据变得更容易，因为 Linux 使用 `UID` 来确定文件的所有者。账户名实际上是为了我们人类考虑。让我们在创建账户时使用\
  \ `-u` 选项来指定 `UID`。\n\n```\nuseradd -c “MySQL Server” -d /opt/mysql -u 97 -s /usr/sbin/nologin\
  \ mysql\ntail -1 /etc/passwd\n```\n\n`mysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin`\n\
  \n- `-u UID` 为用户指定数字 `UID`。\n\n## 删除账户\n\n要删除账户，请使用 `userdel` 命令后跟用户名。如果你想删除账户的家目录，请使用\
  \ `-r` 选项。它还会删除用户的邮件邮箱池（如果存在）。\n\n在示例中，我们将删除 `eharris` 账户，但保留他的家目录完整，因为里面有一些我们以后想用的文件。我们还将删除\
  \ `grant` 账户并移除他的家目录。\n\n```\nls /home\neharris grant\nuserdel eharris\nls /home\n\
  eharris grant\nuserdel -r grant\nls /home\neharris\n```\n\n## 更新账户\n\n要更新或修改现有账户，请使用\
  \ `usermod` 命令。以下是 `usermod` 命令最常用的选项。要查看可用选项的列表，请参 `man usermod` 或 `usermod —help`。\n\
  \n`usermod [options] username`\n\n- `-c “COMMENT\"` 更新注释字段。\n- `-g GROUP` 更改主组。\n\
  - `-G GROUP1,GROUPN` 更改账户所属的附加组。\n- `-s /path/to/shell` 更改账户的 shell。\n\n在本例中，我们更新与\
  \ `mysql` 账户关联的注释。\n\n```\ngrep mysql /etc/passwd\nmysql:x:97:1003:MySQL Server:/opt/mysql:/usr/sbin/nologin\n\
  usermod -c “MySQL User” mysql\ngrep mysql /etc/passwd\nmysql:x:97:1003:MySQL User:/opt/mysql:/usr/sbin/nologin\n\
  ```\n\n## 组\n\n组详情存储在 `/etc/group` 文件中\n\n`/etc/group` 文件的第一项是 `root` 组。\n\n`root:x:0:`\n\
  \n这是 `/etc/group` 中的另一个示例条。\n\n`sales:x:1001:john,mary`\n\n`/etc/group` 文件的格式如下。\n\
  \n`group_name:password:GID:account1,accountN`\n\n每个字段由冒号分隔。组名是你在通过 `ls` 等命令显示组信息时看到的类可读名称。\n\
  \n密码用于特权组，但该功能很少被使用。当该字段中有 `x` 时，意味着正在使用 shadow 组密码。该信息存储在 `/etc/gshadow` 文件中。\n\
  \n`GID` 是组 ID。它只是一个代表组的唯一数字。\n\n剩余字段列出了用逗号分隔的组组员。\n\n你可能注意到 `root` 组没有包含成员列表。记住\
  \ `/etc/passwd` 文件指定了账户的默认组。对于 root 用户，默认的 `GID` 是 `0`。当账户的默认 `GID` 列在 `/etc/passwd`\
  \ 中时，它也会在 `/etc/group` 中被列出（不，此处原文逻辑是：当账户的默认 GID 列在 /etc/passwd 中时...此处原文表述略显生硬，意应为：当账户的默认\
  \ GID 列在 /etc/passwd 中时...）。\n\n在 `/etc/passwd` 中：\n\n```\n```bash\nroot:x:0:root:/root:/bin/bash\n\
  ```\n\n要显示某个成员所属的组，将用户名传递给 `groups` 命令。\n\n```\n```\ngrep root /etc/passwd\nroot:x:0:root:/root:/bin/bash\n\
  groups root\nroot : root\n```\n\n## 创建组\n\n要创建一个组，使用 `groupadd` 命令。\n\n`groupadd\
  \ [options] group`\n\n- `-g GID` 为组指定数字值。\n\n`groupadd` 命令最常用的选项是 `-g`，允许你指定 `GID`。让我们创建两个组。对于第一个组，让\
  \ `groupadd` 命令自动选择 `GID`。对于第二个组，我们将指定 `GID`。\n\n```\ngroupadd web\ntail -1 /etc/group\n\
  web:x:1003:\ngroupadd -g 2500 db\ntail -1 /etc/group\ndb:x:2500:\n```\n\n## 删除组\n\
  \n要删除组，只需将组名传递给 `groupdel` 命令。\n\n`groupdel group`\n\n让我们删除 `db` 组。\n\n```\ngroupdel\
  \ db\n```\n\n## 更新组\n\n要修改现有的属性，使用 `groupmod` 命令。\n\n`groupmod [options] group`\n\
  \n- `-g GID` 更改组 ID。\n- `-n GROUP` 更改组名。\n\n在本例中，我们将 `web` 组的 `GID` 从 `1003` 更改为\
  \ `1234`。接下来，将名称从 `web` 更改为 `http`。\n\n```\ngrep web /etc/group\nweb:x:1003:\ngroupmod\
  \ -g 1234 web\ngrep web /etc/group\nweb:x:1234:\ngroupmod -n http web\ngrep http\
  \ /etc/group\nhttp:x:1234:\n```\n\n## 将组和用户结合\n\n在以下示例中，我们将创建一个 writers 组、tv 组和\
  \ movie 组。接下来我们将创建一些账户。所有这些账户都属于 writers 组，但只有其中一部分属于 tv 组，而其他的属于 movie 组。\n\n```\n\
  groupadd writers\ngroupadd tv\ngroupadd movie\nuseradd -c “Carlton Cuse” -g writers\
  \ -G tv -m -s /bin/bash ccuse\npasswd ccuse\n输入新的 UNIX 密码：\n重新输入新的 UNIX 密码：\npasswd:\
  \ password updated successfully\ngroups ccuse\nccuse : writers tv\nuseradd -c “David\
  \ Fury” -g writers -G tv -m -s /bin/bash dfury\npasswd dfury\n输入新的 UNIX 密码：\n重新输入新的\
  \ UNIX 密码：\npasswd: password updated successfully\ngroups dfury\ndfury : writers\
  \ tv\nuseradd -c “Matt Damon” -g writers -G movie -m -s /bin/bash mdamon\npasswd\
  \ mdamon\n输入新的 UNIX 密码：\n重新输入新的 UNIX 密码：\npasswd: password updated successfully\n\
  groups mdamon\nmdamon : writers movie\n```\n\n\n\n\n`passwd: password updated successfully`\n\
  \n# groups mdamon\n\n`mdamon : writers movie`\n\n# useradd -c “Ben Affleck” -g writers\
  \ -G movie -m -s /bin/bash baffleck\n\n# passwd mdamon\n\nEnter new UNIX password:\n\
  \nRetype new UNIX password:\n\n`passwd: password updated successfully`\n\n# groups\
  \ baffleck\n\n`baffleck : writers movie`\n\n# tail -3 /etc/group`\n\n`writers:x:1235:`\n\
  \n`tv:x:1236:ccuse,dfury`\n\n`movie:x:1237:mdamon,baffleck`\n\n# grep 1235 /etc/passwd`\n\
  \n`ccuse:x:1000:1235:Carlton Cuse:/home/ccuse:/bin/bash`\n\n`dfury:x:1001:1235:David\
  \ Fury:/home/dfury:/bin/bash`\n\n`mdamon:x:1002:1235:Matt Damon:/home/mdamon:/bin/bash`\n\
  \n`baffleck:x:1003:1235:Ben Affleck:/home/baffleck:/bin/bash`\n\n#\n\n## 总结\n\n\
  账户信息存储在 `/etc/passwd` 和 `/etc/shadow` 文件中。除了用户名外，每个账户还包含一个称为 UID 的唯一数字、一个默认组、一条注释、一个主目录位置以及登录\
  \ shell。\n\n可以使用 `useradd` 命令创建账户。要删除账户，请使用 `userdel` 命令。要修改账户，请使用 `usermod` 命令。\n\
  \n组信息存储在 `/etc/group` 文件。要创建一个组，请使用 `groupadd` 命令。你可以使用 `groupdel` 命令删除组。要更新现有组请使用\
  \ `groupmod` 命令。要列出账户的组组成，请使用 `groups` 命令。\n\n## 测验\n\n哪个文件存储账户信息？\n\n`/etc/accounts`\n\
  \n`/etc/passwordfile`\n\n`/etc/password`\n\n`/etc/passwd`\n\n`/etc/shadow` 文件存储加密后的密码。\n\
  \n正确\n\n错误\n\n哪个 UID 总是分配给 root 账户？\n\n0\n\n1\n\n100\n\n1000\n\n哪个命令显示用户的组组成？\n\n\
  `groupshow`\n\n`lsgroups`\n\n`listgroups`\n\n`groups`\n\n哪个文件存储组信息？\n\n`/etc/groups`\n\
  \n`/etc/group`\n\n`/etc/memberships`\n\n`sudo` 命令允许用户以其他用户的身份运行进程，最常见的是 root 用户。\n\
  \n正确\n\n错误\n\n哪个命令用于为 Linux 账户设置或更改密码？\n\n`password`\n\n`pwd`\n\n`passwd`\n\n`pswd`\n\
  \n## 测验答案\n\nD\n\nA\n\nA\n\nD\n\nB\n\nA\n\nC\n\n# 网络\n\n在本章中，你将学习 TCP/IP 协议以及 IP\
  \ 网络中最重要的方面。你还将将介绍网络分类和有类网络。此外，你将学习到子网掩码和广播地址。接下来，你将学习无类域间路由（CIDR），最后，你将学习 IP 地址在私有网络中的用途。\n\
  \n今天，TCP/IP 是网络数据传输的实事实标准。TCP/IP 代表传输控制协议 (TCP) 和网际协议 (IP)。TCP 建立建立维护网络会话，以便两个设备可以交换数据。网际协议负责将数据从网络中的一个设备发送到另一个设备。这些网络设备中的每一个被称为主机，并至少有一个\
  \ IP 地址。\n\n为了让网络上的设备能够正常通信，它需要三项信息：IP 地址、子网掩码和广播地址。这些数字中的每一个都由由点分隔的四个字节（octets）组成。一个字节代表八位，因此其值范围可以从\
  \ 0 到 255。\n\n示例 IP 地址：`199.83.131.168`\n\n示例子网掩码：`255.255.255.0`\n\n示例广播地址：`199.83.131.255`\n\
  \n在 `199.83.131.186` 示例 IP 地址中，第一个字节包含键值 199，第二个字节是 83，第三字节是 131，最后一个字节是 186。\n\n\
  IP 地址由两部分组成。IP 地址的第一部分是网络地址，第二部分是主机地址。IP 地址的网络部分告诉路由器主机属于哪个网络，从而决定了路由发往该主机的数据。主机地址告诉路由器应该将数据发送到的特定设备。为了让路由正常工作，每组设备（或网络）都需要一个唯一的网络地址。此外，该网络内的每个设备都需要唯一的主机地址。\n\
  \n地址的类别决定了哪部分被用作网络地址，哪部分被用于主机地址。\n\n| 类 | 网络 | 允许的主机数 |\n| :--- | :--- | :--- |\n\
  | A | 1 -> 127 (例：`17.24.88.9`) | 16,777,216 |\n| B | 128.0 -> 191.255 (例：`183.194.46.31`)\
  \ | 65,536 |\n| C | 192.0.0 -> 233.255.255 (例：`199.83.131.186`) | 255 |\n\n通过查看\
  \ IP 地址的第一个字节，可以判断它是哪一类。第一个字节在 1 到 127 之间的 IP 地址是 A 类。例如：`17.24.88.9`。第一个字节在 128.0\
  \ 到 191.255 之间的 IP 地址是 B 类。例如：`183.194.46.31`。第一个字节在 192.0.0 到 233.255.255 之间的 IP\
  \ 地址是 C 类。例如：`199.83.131.186`。\n\n## 无类域间路由\n\nCIDR 代表无类域间路由。它允许不受其传统类别地划分网络。这些划分后的网络被称为子网。例如，IP\
  \ 地址 `121.67.198.94` 属于 A 类网络。默认情况下，网络是 `121.0.0.0`，子网掩码是 `255.0.0.0`，广播地址是 `121.255.255.255`。然而，如果你指定了子网掩码，就可以更改\
  \ IP 地址中作为网络地址和作为主机地址的部分。通过为 `121.67.198.94` 地址指定 `255.255.255.0` 子网，网络变为 `121.67.198.0`，广播地址变为\
  \ `121.67.198.255`。\n\n## 预留私有地址空间\n\n有一些 IP 地址范围是专用于私有网络的。你经常会在公司内部网络中使用这些类型的 IP\
  \ 地址，你很可能在家庭网络中这些这些 IP 地址范围。\n\n\n\n\n\n这些私有地址也被称为不可路由 IP，因为它们不会通过公共 Internet 进行路由。你还会听到人们将这些\
  \ IP 地址称为 `RFC1918` 地址，这指的是最初定义这些私有范围的 `RFC1918` 标准文档。\n\n如如下表所示，每个网络类都有一个专用的不可路由私有地址空间。请记住，你可以根据意愿对这些网络进行子网划分，无论它们所属的传统分类是什么。\n\
  \n| 类 | 范围 | 私有地址空间 |\n| :--- | :--- | :--- |\n| A | 1.0.0.0 - 127.255.255.255 |\
  \ 10.0.0.0 - 10.255.255.255 |\n| B | 128.0.0.0 - 191.255.255.255 | 172.16.0.0 -\
  \ 172.31.255.255 |\n| C | 192.0.0.0 - 233.255.255.255 | 192.168.0.0 - 192.168.255.255\
  \ |\n\n## 总结\n\n在本章中，你学习了 TCP/IP 协议如何作为网络传输数据的默认标准。你还学习了 A 类、B 类和 C 类网络。你学习了各种网络类使用的默认子网掩码和广播地址。你还学习了可以通过指定子网掩码将较大的网络划分为较小的子网。最后，你学习了哪些\
  \ IP 范围专门专门用于私有网络，以及这些 IP 地址为什么不在公共 Internet 上路由。\n\n## 测验\n\n257.19.21.228 是一个有效的\
  \ IP 地址。\n\n- 正确\n- 错误\n\n给定 IP 地址 `199.83.131.0` 和子网掩码 `255.255.255.0`，广播地址是什么？\n\
  \n- `199.83.131.0`\n- `199.83.131.1`\n- `199.83.131.255`\n- `199.255.255.255`\n\n\
  以下哪个 IP 地址不属于私有地址范围？\n\n- `10.11.12.13`\n- `11.12.13.14`\n- `172.16.255.255`\n-\
  \ `192.168.1.100`\n\n## 测验答案\n\n- B\n- C\n- B\n\n# Linux 网络\n\n在本章中，你将学习如何配置和控制\
  \ Linux 系统上的网络接口以及其主机名。你将学习什么是 DNS，以及如何使用 `host` 和 `dig` 工具来解析主机名和 IP 地址。你将学习 `/etc/hosts`\
  \ 和 `/etc/nsswitch.conf` 文件在名称解析中起的作用。你还将介绍网络端口。接下来，你将学习什么是 DHCP 以及如何将你的 Linux 系统配置为\
  \ DHCP 客户端。最后，我们将查看菜单驱动工具，它们可以帮助你管理最流行的 Linux 发行版中的各种网络设置。\n\n要显示当前的 IP 地址，或获取系统上使用的所有\
  \ IP 地址列表，请运行带有 `address` 参数的 `ip` 命令。使用 `ip` 命令，你可以使用缩写，因此不需要运行 `ip address`，而是运行\
  \ `ip addr` 甚至 `ip a`。你也可以通过运行 `ip address show` 来更加显式。\n\n以下是 `ip address` 命令的一些示例输出。你可以看到列出的两个设备：`lo`\
  \ 和 `eth0`。`lo` 设备是环回设备。这是 Linux 系统用于与自身通信的特殊虚拟网络接口。环回设备的 IP 地址为 `127.0.0.1`。该系统上的另一个网络设备是\
  \ `eth0` 设备。这是一个实际硬件设备，它的 IP 地址为 `192.168.1.122`。\n\n## ip address\n\n```\n1: lo:\
  \ <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\nlink/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\ninet 127.0.0.1/8 scope host lo\nvalid_lft forever preferred_lft\
  \ forever\ninet6 ::1/128 scope host\nvalid_lft forever preferred_lft forever\n2:\
  \ eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP qlen\
  \ 1000\nlink/ether 08:00:27:43:f5:18 brd ff:ff:ff:ff:ff:ff\ninet 192.168.1.122/24\
  \ brd 192.168.1.255 scope global dynamic eth0\nvalid_lft 84249sec preferred_lft\
  \ 84249sec\ninet6 fe80::a00:27ff:fe43:f518/64 scope link\nvalid_lft forever preferred_lft\
  \ forever\n```\n\n除了 `ip` 命令外，还可以使用 `ifconfig` 工具来显示 IP 地址信息。在此时，`ifconfig` 实用程序被认为是过时的。然而，这个小工具在现代\
  \ Linux 系统上尚未完全消失，可能还会存在很一段时间。如果这是对你的复习，或者你来自 Unix 背景，你可能已经熟悉 `ifconfig` 命令，但不熟悉它新的替代者\
  \ `ip` 命令。在本章中，你将学习如何同时使用 `ip` 和 `ifconfig` 命令。\n\n要使用 `ifconfig` 命令显示使用的 IP 地址，请不带任何参数地执行它。这里是\
  \ `ifconfig` 命令的一些输出。它列出了两个接口：`eth0` 和环回设备。你会发现输出与 `ip` 命令略有不同。然而，它通过显示 IP 地址、子网掩码等更多信息完成了任务。就像使用\
  \ `ip` 命令一样，你可以看到 `eth0` 设备的 IP 为 `192.168.1.122`，环回设备的 IP 为 `127.0.0.1`。\n\n##\
  \ ifconfig\n\n```\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST> mtu 1500\ninet\
  \ 192.168.1.122 netmask 255.255.255.0 broadcast 192.168.1.255\ninet6 fe80::a00:27ff:fe43:f518\
  \ prefixlen 64 scopeid 0x20<link>\nether 08:00:27:43:f5:18 txqueuelen 1000 (Ethernet)\n\
  RX packets 82371 bytes 95773879 (91.3 MiB)\nRX errors 0 dropped 0 \n\n## 主机名\n\n\
  主机是连接到网络的设备。由于我们正在讨论 TCP/IP 网络，主机是一个服务器。主机名简单来说是对应于 IP 地址的人类易读名称。我们可以给服务器设置一个主机名，例如\
  \ `webprod01`，并通过该主机名而不是其 IP 地址（可能是 `10.9.155.174`）。这种单词主机名有时被称为短主机名或未限定主机名。\n\n\
  ## DNS 主机名\n\nDNS（即域名系统）的主要用途是将人类易读的名称翻译成 IP 地址。当然，DNS 也可以反向操作。它可以将 IP 地址翻译为主机名。\n\
  \n完全限定域名名（或 FQDN）的主机还包含域名和顶级域名。FQDN 的每个部分用点分隔。\n\nTLD 代表顶级域名，是 DNS 名称的最右侧部分。常见的顶级域名包括\
  \ `.com`、`.net` 和 `.org`，但实际上还有数百种其他顶级域名。\n\n域名出现在顶级域名的左侧。这通常是公司名称、组织名称或品牌名称。\n\n\
  服务器的 FQDN 或长主机名至少包含三个用点分隔的字符串。例如，它的 FQDN 可以是 `webprod01.mycompany.com`。\n\n然而，域名可以进一步划分为子域名。假设“公司”想使用子域名来识别服务器的位置。它可以使用国家域名如\
  \ `us.mycompany.com`，甚至可能有一个州子域名，类似于 `ny.us.mycompany.com`。如果我们的 Web 服务器位于纽约，它的\
  \ FQDN 可能是 `webprod01.ny.us.mycompany.com`。子域名不必对应于地理区域；它们可以是 DNS 管理员配置的任何内容。\n\n\
  你可以通过 `hostname` 命令或运行 `uname -n` 来显示当前主机名。在下面的示例中，主机名是 `webprod01`。如果你想显示 FQDN，请运行\
  \ `hostname -f`。\n\n```\n$ hostname\nwebprod01\n\n$ uname -n\nwebprod01\n\n$ hostname\
  \ -f\nwebprod01.mycompany.com\n```\n\n\n\n\n你也可以通过将主机名作为 `hostname` 命令的参数传递来临时更改系统的主机名。然而，为了使此更改在重启后依然有效，你需要更新主机名配置。该配置在不同的发行版之间略有不同。对于\
  \ Ubuntu 和 RedHat 系统，请编辑 `/etc/hostname` 文件并将所需的主机名写入其中。对于较早版本的 RedHat，你可以编辑 `/etc/sysconfig/network`\
  \ 文件，并将 `HOSTNAME` 变量设置为所需的值。\n\n### `hostname webprod01`\n\n### `echo ‘webprod01’\
  \ > /etc/hostname`\n\n### `vi /etc/sysconfig/network`\n\n`HOSTNAME=webprod01`\n\n\
  ## 解析 DNS 名称\n\n如果你想查询或解析 DNS 名称或 IP 地址，可以使用 `host` 或 `dig` 工具。在最简单的形式下，你将要查询的 IP\
  \ 地址或 DNS 名称作为命令的参数即可。以下是使用 `host` 命令的示例。\n\n```\n$ host www.mycompany.com\nwebprod01.mycompany.com\
  \ has address 1.2.1.6\n\n$ host 1.2.1.6\n6.1.2.1.in-addr.arpa domain name pointer\
  \ www.mycompany.com.\n```\n\n这里是一个使用 `dig` 的示例。使用 `-x` 选项执行反向查询。\n\n```\n$ dig www.mycompany.com\n\
  ; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1 <<>> www.mycompany.com\n;; global options:\
  \ +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 22904\n\
  ;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1\n;; OPT PSEUDOSECTION:\n\
  ; EDNS: version: 0, flags:; udp: 512\n;; QUESTION SECTION:\n;www.mycompany.com.\
  \ IN A\n;; ANSWER SECTION:\nwww.mycompany.com. 292 IN A 1.2.1.6\n;; Query time:\
  \ 13 msec\n;; SERVER: 10.0.2.3#53(10.0.2.3)\n;; WHEN: Wed Jan 13 03:30:17 JST 2016\n\
  ;; MSG SIZE rcvd: 62\n\n$ dig -x 1.2.1.6\n; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.1\
  \ <<>> -x 52.5.196.34\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<-\
  \ opcode: QUERY, status: NOERROR, id: 23203\n;; flags: qr rd ra; QUERY: 1, ANSWER:\
  \ 1, AUTHORITY: 0, ADDITIONAL: 1\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:;\
  \ udp: 512\n;; QUESTION SECTION:\n;6.1.2.1.in-addr.arpa. IN PTR\n;; ANSWER SECTION:\n\
  6.1.2.1.in-addr.arpa. 299 IN PTR www.mycompany.com\n;; Query time: 34 msec\n;; SERVER:\
  \ 10.0.2.3#53(10.0.2.3)\n;; WHEN: Wed Jan 13 03:33:16 JST 2016\n;; MSG SIZE rcvd:\
  \ 106\n```\n\n## Hosts 文件\n\n`/etc/hosts` 文件包含 IP 地址和主机名的列表。你可以通过以 IP 地址开头并在其后跟随你想要将该\
  \ IP 地址解析的一个或多个名称在主机文件中创建条目。以下示例条目使用了多个名称，但如果你不需要或不想通过多个名称访问系统，只需列出一个名称即可。该条目可以是\
  \ hosts 文件中的许多条目之一。\n\n```\n10.11.12.13 webprod02.mycorp.com webprod02\n```\n\n\
  在 `/etc/hosts` 中创建条目后，你可以使用主机文件中列出的名称与该 IP 地址开始通信。如果你想访问没有 DNS 主机名的计算机，这非常有用。此外，使用\
  \ `/etc/hosts` 条目来覆盖系统的 DNS 条目也是常见的。例如，如果你有一个 Web 服务器集群，可以建立一个只有 Web 集群成员才能访问的私有网络。你可以在\
  \ `/etc/hosts` 为集群成员创建条目并使用它们的私有地址，从而强制网络通信通过私有网络进行。\n\n注意的是，`/etc/hosts` 是本地系统的。在\
  \ `/etc/hosts` 文件中添加条目不会向 DNS 中添加条目。\n\n这是一个 `/etc/hosts` 文件的示例。你会看到第一行包含一个 `localhost`\
  \ 的条目。记住，这是回环设备用于内部通信的。下一行包含系统的公共 IP 地址，随后是完全限定域名 (FQDN)，然后是短名称。第三行包含一个 `webprod02`\
  \ 的不可路由 IP 地址。在此示例中，它是该系统的私有 IP 地址。下一行是另一个针对 `webprod03` 的类似条目。最后一行是 `dbcluster`。\n\
  \n```\n127.0.0.1 localhost\n1.2.1.6 webprod01.mycompany.com webprod01\n10.11.12.13\
  \ webprod02.mycorp.com webprod02\n10.11.12.14 webprod03.mycorp.com webprod03\n```\n\
  \n## 名称服务切换 (NSS)\n\nNSS 代表名称服务切换，它控制查询的执行顺序。通常，`/etc/nsswitch.conf` 文件决定了先检查 `hosts`\
  \ 文件还是 DNS。\n\n## 网络端口\n\n正如 IP 地址识别网络上的主机一样，端口识别主机上的服务。当服务在系统上启动时，它会绑定到一个端口并监听针对该端口的流量。\n\
  \n端口范围从 1 到 65535。1 到 1023 的端口被称为已知端口或系统端口。这些端口是预分配给系统服务的。这些端口也被称为特权端口，因为打开这些端口需要超级权限。1024\
  \ 以上的端口可以由用户打开，被称为非特权端口。\n\n以下是常用端口的简短列表。例如，端口 22 留给 `SSH`，25 留 `SMTP`，80 留 `HTTP`，143\
  \ 留 `IMAP`，389 留 `LDAP`，443 留 `HTTPS`。\n\n| 端口 | 服务 |\n| :--- | :--- |\n| 22 | SSH\
  \ |\n| 25 | SMTP |\n| 80 | HTTP |\n| 143 | IMAP |\n| 389 | LDAP |\n| 443 | HTTPS\
  \ |\n\n当你在浏览器的地址栏中输入 `https://www.mybank.com` 时，你的电脑会将 `www.mybank.com` 转换为 IP 地址。然后，你的浏览器向该\
  \ IP 地址的端口 443 发起请求。该服务（在此情况下为 Web 服务器）将接收端口 443 的流量。\n\n`/etc/services` 文件将可读名称转换为端口号。在这里你会找到预定义的端口列表。你也可以向此列表添加内容。例如，当你安装第三方软件时，你可能需要在\
  \ `/etc/services` 中为该软件提供的服务添加条目。你也可以为你自己编写的自定义端口自定义应用程序创建条目。\n\n上一个表格中的端口在 `/etc/services`\
  \ 文件中看起来是这样的。\n\n```\nssh 22/tcp # SSH Remote Login Protocol\nsmtp 25/tcp # SMTP\n\
  http 80/tcp # HTTP\nimap2 143/udp # IMAP\nldap 389/tcp # LDAP\nhttps 443/tcp # HTTP\
  \ protocol over TLS/SSL\n```\n\n\n\n\nDHCP 代表动态主机配置协议（Dynamic Host Configuration\
  \ Protocol）。DHCP 主要用于为网络上的主机分配 IP 地址。当 DHCP 客户端想要请求一个 IP 地址时，它会发送一个广播消息来寻找 DHCP\
  \ 服务器。随后，DHCP 服务器会响应客户端并为其提供一个 IP 地址以及其他附加信息，例如子网掩码、网关和用于名称解析的 DNS 服务器。DHCP 客户端使用这些信息进行配置，并在网络上开始通信。\n\
  \n分配给 DHCP 客户端的 IP 地址是从 DHCP 服务器租借的。客户端可以在 DHCP 服务器配置的租约到期之前使用该 IP 地址。如果 DHCP 客户端想在租约到期后继续使用该\
  \ IP 地址，它必须向 DHCP 服务器发送续约请求。如果 DHCP 服务器没有收到续约请求，它将把此 IP 地址放回可用地址池中。\n\n要将基于 RedHat\
  \ 的系统配置为 DHCP 客户端，请编辑位于 `/etc/sysconfig/network-scripts` 目录下的网络设备配置文件。该文件的名称为 `ifcfg-network-device-name`。根据系统配置和底层硬件，它可能是\
  \ `ifcfg-eth0` 甚至是像 `ifcfg-enp5s2` 这样的名称。要获取系统上的网络设备列表，请运行 `ifconfig -a` 或 `ip link`。\n\
  \n一旦确定了网络设备的配置文件，将 `BOOTPROTO` 变量设置为“dhcp”。\n\n```bash\nip link\n\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN mode DEFAULT\n\nlink/loopback 00:00:00:00:00:00\
  \ brd 00:00:00:00:00:00\n\n2: enp0s3: <BROADCAST,MULTAST,UP,LOWER_UP> mtu 1500 qdisc\
  \ pfifo_fast state UP mode DEFAULT qlen 1000\n\nlink/ether 08:00:27:ba:8f:35 brd\
  \ ff:ff:ff:ff:ff:ff\n```\n\n```bash\ncat /etc/sysconfig/network-scripts/ifcfg-enp0s3\n\
  \nDEVICE=“enp0s3”\nONBOOT=yes\nNETBOOT=yes\nIPV6INIT=yes\nBOOTPROTO=dhcp\nTYPE=Ethernet\n\
  NAME=“enp0s3”\n```\n\n要将 Ubuntu 系统配置为 DHCP 客户端，请编辑 `/etc/network/interfaces` 文件。为接口的\
  \ `inet` 地址族语句添加 `dhcp` 方法。该行内容将为 `iface <network-device-name> inet dhcp`。对于 `eth0`，这将是\
  \ `iface eth0 inet dhcp`。以下是示例 `/etc/network/interfaces` 文件的内容。\n\n```bash\n#/etc/network/interfaces\n\
  \n# 此文件描述了系统上 \n# 可用的网络接口以及如何激活它们。\n## 需更多信息，请参见 interfaces(5)。\n## 回环网络接口\nauto\
  \ lo\niface lo inet loopback\n\n## 主接口 interface\nauto eth0\niface eth0 inet dhcp\n\
  ```\n\n你也可以为 Linux 系统分配静态 IP 地址。对于基于 RedHat 的系统，请编辑位于 `/etc/sysconfig/network-scripts`\
  \ 中的网络接口配置文件。确保将 `BOOTPROTO` 变量设置为 `static`。按照示例所示分配 IP 地址、子网掩码、网络、广播和网关。如果你希望网络设备在启动时激活，请将\
  \ `ONBOOT` 设置为 `yes`。\n\n```bash\nDEVICE=“enp0s3”\nBOOTPROTO=static\nIPADDR=10.109.155.174\n\
  NETMASK=255.255.255.0\nNETWORK=10.109.155.0\nBROADCAST=10.109.155.255\nGATEWAY=10.109.155.1\n\
  ONBOOT=yes\n```\n\n要在 Ubuntu 系统上的接口分配静态 IP 地址，请编辑 `/etc/network/interfaces` 文件。在网络接口的\
  \ `iface` 行中，`inet` 之后使用 `static` 关键字。接下来，提供 IP 地址、子网掩码和网关地址。\n\n```bash\nauto eth0\n\
  iface eth0 inet static\naddress 10.109.155.174\nnetmask 255.255.255.0\ngateway 10.109.155.1\n\
  ```\n\n你可以使用 `ip` 命令手动为网络接口分配 IP 地址。格式为 `ip address add IP[/NETMASK] dev NETWORK_DEVICE`。若要向\
  \ `eth0` 添加 IP 地址 `10.11.12.13`，请运行 `ip address add 10.11.12.13 dev eth0`。你也可以在\
  \ IP 地址后面加上正斜杠并提供子网掩码来指定，例如：`ip address add 10.11.12.13/255.255.255.0 dev eth0`。要启用接口，请运行\
  \ `ip link set eth0 up`。\n\n如果可用 `ifconfig` 工具，你也可以用它为网络接口分配 IP 地址。格式为 `ifconfig\
  \ NETWORK_DEVICE addr netmask SUBNET_MASK`。若要添加 IP 地址 `10.11.12.13`，请运行 `ifconfig\
  \ eth0 add 10.11.12.13`。通过在 IP 地址后跟随正斜杠并提供子网掩码，你也可以提供子网掩码，例如：`ifconfig eth0 add\
  \ 10.11.12.13/255.255.255.0`（注：此处原文逻辑略有重复，已按字意思翻译）。如果 `ifconfig` 工具可用，你也可以用它为网络接口分配\
