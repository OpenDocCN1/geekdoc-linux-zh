- img_proc: true
  md: '# Floating Windows


    Another common behavior on Web pages is the appearance of a small window that
    pops up when a page is loaded or when the user clicks on a designated image or
    other object. The window seems to be "floating" over the main Web page and, usually,
    contains an advertisement, a notice about a new product or service, or other secondary
    information. To create a floating pop-up window, use the Open Browser Window behavior.


    # 1.


    First, decide what you want to have pop up in the floating window. Use Dreamweaver
    to create a separate page for that window. The floating window can include an
    audio file that has to be played with a built-in browser program called plug-in.
    To add a sound file you have already created, choose Insert|Media|Plugin.


    To create an audio file, you need a microphone and sound card connected to your
    computer. Make a recording using your computer''s built-in sound program (on Windows,
    Sound Recorder; on the Macintosh, the Sound Control Panel) and save the file in
    an audio format such as .AU (Mac) or .WAV (Windows).


    # 2.


    In the Select File dialog box, select the audio file you want to add to your Web
    page. Click on Select to close the Select File dialog box.


    When you insert a plug-in and then point to an audio file, you are embedding the
    audio file in the body of the Web page and telling the browser to use your audio
    plug-in (a program that is configured to work with the browser) to play the file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_195_0.png)'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# 3.


    A plug-in icon appears in the Document Window. Save your changes by selecting
    File|Save.


    Initially, the plug-in icon is small; you might have to click on it, select one
    of its handles, and drag the handle down and to the right to enlarge it. That
    way, the browser''s audio player plug-in will fully display when the page is viewed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_196_0.png)


    # 4.


    When you preview the page, the plug-in graphic used by your browser appears. In
    this case, Netscape Navigator''s audio plug-in graphic is shown. Now that you
    have created your floating browser window page, you can attach it to another Web
    page so it can pop up.


    ![](img/eb7bf63026b0f3188f312686de439a8a_196_1.png)


    # 5.


    Open the Web page to which you want to attach the floating window. Select the
    object that you want to associate with the behavior. Open the Behaviors panel,
    click on the plus sign (+), and choose Open Browser Window.


    You don''t have to associate the floating window with an object; you can also
    have it appear whenever the page is loaded.


    ![](img/eb7bf63026b0f3188f312686de439a8a_196_2.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 6.


    The Open Browser Window dialog box appears. Enter the URL for the page you created
    earlier in the URL To Display box, or click on Browse and select the file. A size
    in pixels in the Window Width and Window Height boxes to make the floating window
    a specific size (usually such windows are relatively small). Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_197_0.png)


    # 7.


    The behavior appears in the Behaviors panel. Click on the arrow next to the behavior
    (Open Browser Window) to select a user event to attach to that behavior, such
    as onClick or onMouseOver.


    ![](img/eb7bf63026b0f3188f312686de439a8a_197_1.png)


    # 8.


    When you preview the page and perform the event, the browser window should pop
    up and float above the page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_197_2.png)'
