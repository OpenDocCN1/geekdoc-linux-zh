  md: '# Understanding Web Formats


    The process of creating graphics for the World Wide Web differs considerably from
    designing for print or other media. The goal, however, is the same: effective
    visual communication that conveys a powerful message. This chapter will get you
    started with creating Web graphics with Dreamweaver so you can meet your communications
    goals.


    # Bitmaps

    Vector Graphics


    Computer graphics fall into two general categories: images made up of bitmaps,
    and those made up of vectors. Although both types can be found on the Internet,
    bitmaps are by far the common Web graphics and the ones you are likely to create
    yourself. Bitmaps are images made up of tiny squares called pixels, each of which
    represents one bit of information.


    ![](img/eb7bf63026b0f3188f312686de439a8a_103_0.png)


    # GIF Images


    High-resolution image formats as TIFF (Tagged Image File Format) or EPS (Encapsulated
    PostScript) cannot be used on Web pages because the file sizes are too big. Compressed
    formats are used instead, the most popular being GIF and JPEG. GIF, which is pronounced
    either “jif” or “gif,” stands for Graphics Interchange Format. GIF is best suited
    for type, line art, or images.


    ![](img/eb7bf63026b0f3188f312686de439a8a_103_1.png)


    # JPEG Images


    JPEG (pronounced "joy-peg") stands for Joint Photographic Experts Group, the name
    of the group that originated the format. JPEG is optimal for photographs and complex
    illustrations that need greater compression.


    ![](img/eb7bf63026b0f3188f312686de439a8a_103_2.png)


    PNG (pronounced "ping") stands for Portable Network Graphics. This format is being
    developed as an improvement over GIF. PNG images are still not widely used on
    the Web.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Adding and Formatting Images


    # Clip Art Images


    Clip art gets its name from the catalogs of free illustrations that are sold to
    newspapers, magazines, and other publishers and can be clipped out or literally
    pasted into a publication by hand. Some friendly artists have made icons, buttons,
    and other illustrations available for downloading on the Web so other people can
    put them on their Web pages.


    Clip art images usually have restrictions that prohibit their use on commercial
    Web sites or require you to give credit to the creators—be sure to read the fine
    print before you download.


    ![](img/eb7bf63026b0f3188f312686de439a8a_104_0.png)


    # Working with Web-Page Images


    Dreamweaver makes it easy to add graphic interest to your Web pages by quickly
    inserting, manipulating, and adjusting images, as described in the following sections.


    # Inserting an Existing Image


    Browsers display a Web graphic by first recognizing its Internet media type (also
    called MIME type).Usually, the MIME type is determined by the three- or four-character
    file extension at the end of the image''s file name You can view a list of extensions
    that Dreamweaver recognizes by selecting Edit|Preferences, clicking on File Types/Editors,
    and in the Extensions box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_104_1.png)


    Choose Insert|Image

    To add an image to the Web page currently displayed in the Document Window, first
    position the cursor at the point on the page where you want the image to appear.
    Then select Insert|Image or press Ctrl+Alt+I (Option+Cmd+I on a Mac) to display
    the Select Image Source dialog


    ![](img/eb7bf63026b0f3188f312686de439a8a_104_2.png)'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Chapter 4


    You can also add an image to the currently displayed Web page by clicking on the
    Insert Image button in the Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_105_0.png)


    # Select Image Source Dialog Box


    The Select Image Source dialog box contains more information than the usual Open
    dialog box. You not only learn the location and name of the file, but you also
    see, in the Image Preview area, a thumbnail of the image along with its height
    and width in pixels, its file type, and the file size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_105_1.png)


    If you don''t need to see previews and would rather save space, deselect the Image
    Preview box.


    # Placing an Image in a Layer


    You can add an image to a layer just as you can add text to a layer (see Chapter
    3). In fact, you can combine text and images; when you place a group of objects
    in a layer, you can move them around on a Web page with great precision.


    Some viewers with older browsers (earlier than version 3 of Microsoft Internet
    Explorer or Netscape Navigator) won''t see content placed in layers; you need
    to provide such users with an alternate page layout that uses tables (see Chapter
    5) or frames (see Chapter 8).


    # 1.


    Select File|New or press Ctrl+N to open a new page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_105_2.png)'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# 2.


    You can select InsertLayer to insert a layer with the default size. You can also
    draw your own layer to place it exactly where you want, however. Click on the
    Draw Layer button in the Objects menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_106_0.png)


    # 3.


    When you click on the Draw Layer button, the text cursor turns into a crosshair.
    Click in the Document Window on a spot that you want to serve as a corner of the
    layer. If, for instance, click on the upper-left corner, drag down and to the
    right until you reach the lower-right corner.


    Choose ViewGrid to display in the Document Window a grid that can help in positioning
    layers.


    ![](img/eb7bf63026b0f3188f312686de439a8a_106_1.png)


    # 4.


    You can type, copy and paste, or import text into the layer. To add an image,
    first position the text cursor where you want the image to appear. Then choose
    Insert|Image or click on the Insert button in the Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_106_2.png)


    # 5.


    When the Select Image Source dialog box appears, locate the file you want to add,
    select it on once, then click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_106_3.png)'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 6.


    If you have not yet saved the file in which you are placing the image, Dreamweaver
    displays the dialog box shown here. Click on OK to proceed.


    ```

    ### To make a document relative path, your document should be saved first.

    A file: "//" path will be used until you save your document.


    Don''t show me this message again

    OK

    ```


    # 7.


    If the image you want to insert is in a different directory than the root folder
    of the Web site in which the current document is located, Dreamweaver displays
    this dialog box. Click on Yes you want to place a copy of the image in the root
    folder so it can be easily published with your other Web files.


    ```

    The file is outside the root folder of site ''Lessons - Dreamweaver", and may
    not be accessible when you publish the site.

    Your root folder is

    :\Program Files\Macromedia\Dreamweaver 4 Beta\Lessons\Lesson Files\

    Would you like to copy the file here?

    Yes No

    ```


    If you click No, you''ll have to keep track of the file''s location and maintain
    the link to the file if you decide to publish the page in which the image will
    appear.


    # 8.


    If you decide to copy the file into your root folder, a Copy File As dialog box
    appears so you can click Save. The file is copied, and the image is added to the
    current page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_107_0.png)


    # Selection Handles


    You can copy, delete, or move an image just as you can any other Web-page object.
    Click on the image and a set of selection handles appears around it to show that
    the image has been selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_107_1.png)'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Adding and Formatting Images


    Move an Image

    Don''t expect to be able to select an image and then drag it over the Document
    Window the way you can in a paint or page-layout program. When the handles are
    visible, you can press Backspace or Delete to clear the image, or you can choose
    Edit|Cut the image to the clipboard so you can paste it elsewhere on the page.
    Then click to position the cursor in a new location on the page and choose Edit|Paste
    to insert the image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_108_0.png)


    You can drag the image straight up or down on the Web page, but the image will
    move only in small increments.


    Resize an Image

    To resize an image quickly, click on the image once to select it. Then pass the
    mouse arrow over one of the handles so that it turns into a double-sided arrow.
    Click on the handle, hold down the mouse button, and drag the image to change
    the size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_108_1.png)


    > In many cases, simply dragging an image distorts it. Dragging can distort photographic
    images unless you hold down Shift or Ctrl to resize them proportionately: But
    some line art still look acceptable after resizing, whether or not you hold down
    Shift or Ctrl.


    Editing Images

    Once you have added an image to your Web page, you can alter its properties to
    make it fit in effectively with the rest of your page contents. You can also specify
    an image-editing program that Dreamweaver will recognize so you can switch back
    and forth easily between the two programs, improving the image at the same time
    that you edit the rest of the Web page.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# The Image Property Inspector


    When you select an image, the Image Property Inspector appears with general information
    about the image. A preview of the image appears at the left, along with the image
    size.


    You can also display the Image Property Inspector, if it''s not visible, by selecting
    the image, then choosing Modify|Selection Properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_109_0.png)


    # Name an Image


    The name of an image is different from the file name. You need to name an image
    only when you plan to refer to it in JavaScript or other Web-page. To name the
    image, enter text in the box next to the small version of the image in the Property
    Inspector. Then click on the small image—not only is it a thumbnail of the full-size
    graphic, it functions as the Apply button as well.


    ![](img/eb7bf63026b0f3188f312686de439a8a_109_1.png)


    # Specify an Alt Name


    An Alt name gets its name from the HTML tag that identifies it (<IMG ALT="name">).
    In contrast to the image name, which is not seen by the user, when the user passes
    a mouse arrow over the image. Alt names are useful as alternatives to the image
    itself—if the user has image display turned off, or if images are too slow to
    load, the Alt name appears to identify what''s supposed to go in the space. The
    following steps show how to add and then verify an Alt name.


    ![](img/eb7bf63026b0f3188f312686de439a8a_109_2.png)'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Adding and Formatting Images


    # 1.


    Add the image to your Web page, then select it to display the Image Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_110_0.png)


    # 2.


    In the Alt box, enter a short but descriptive name for the image. Then click on
    the Apply button—the thumbnail of the image at the far left.


    ![](img/eb7bf63026b0f3188f312686de439a8a_110_1.png)


    # 3.


    Press F12 or select File|Preview In Browser and select a browser with which to
    preview the page and the image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_110_2.png)


    # 4.


    When the image opens in the browser window, pass your mouse pointer over it and
    make sure the Alt name appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_110_3.png)'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Chapter 4


    A border around an image calls extra attention to it. A border can also be used
    if the image is to function as a link (see Chapter 6); although Dreamweaver adds
    a border automatically to an image that to function as a link, you can still adjust
    the default border. To adjust a border or to create a new one, follow these steps.


    # 1.


    To add a visible border to an image, select the image, then click on the expand
    arrow at the lower-right corner of the Image Property Inspector to view the larger
    version of the inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_111_0.png)


    # 2.


    Enter a number (in points) in the Border box. Then click on the thumbnail image
    to apply the change.


    ![](img/eb7bf63026b0f3188f312686de439a8a_111_1.png)


    # 3.


    A border appears around the image when you click somewhere else in the Document
    Window to deselect it. If you don''t like the border width, enter a new number
    and click on the thumbnail to apply it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_111_2.png)


    Change Height and Width

    The height and width of an image you place in the Document Window are determined
    by the size it was in your image-editing program when you finished editing it.
    You can adjust the height and width by selecting the Image Property Inspector
    and replacing the height and width figures. Press Enter/Return or click on the
    thumbnail to apply the new size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_111_3.png)


    If you don''t like the new size, click on the Reset Size button in the lower (expanded)
    part of the Image Property Inspector to undo the change.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Adding and Formatting Images


    By default, an image is aligned with the left margin unless you place the cursor
    in the middle of a block of text or to the right of another image when you first
    place the image you are working with. You can change image alignment by clicking
    on one of the alignment buttons in the lower (expanded) part of the Image Property
    Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_112_0.png)


    # Specifying an Image Editor


    You can use Dreamweaver to place and make some adjustments to images; when it
    comes to changing the contrast or color quality, however, you need a separate
    image-editing program. You can configure Dreamweaver so you can quickly edit an
    image while it is in the Document Window.


    # 1.


    Select Edit|Preferences or Press Ctrl+U to open the Preferences dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_112_1.png)


    # 2.


    Click on File Types/Editors. Then, in the Extensions box, click on the extension
    that represents the type of image file you want to edit, as .gif for GIF images.
    Then click on the plus sign (+) above the Editors box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_112_2.png)'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 3.


    In the Select External Editor dialog box, locate the image-editing program you
    want to use. Select the program and click Open.


    In Windows, programs end in .exe (such as Paint Pro.exe). On the Mac, programs
    are labeled as "application program" in the Finder.


    ![](img/eb7bf63026b0f3188f312686de439a8a_113_0.png)


    # 4.


    The selected program appears in the Editors box. Repeat Steps 2 and 3 for each
    of the types of images you expect to edit—you''ll probably want to choose JPEG
    (.jpg/.jpeg) images as well, and possibly PNG (.png) files.


    You can specify more than one possible image editor for a file extension.


    ![](img/eb7bf63026b0f3188f312686de439a8a_113_1.png)


    # 5.


    When you need to edit an image, right-click on it to display the context menu.
    Select Edit With, then choose the specified editor. The editor automatically launches
    with the image open for editing.


    You can also expand the Property Inspector and click on Edit to launch the editor.


    ![](img/eb7bf63026b0f3188f312686de439a8a_113_2.png)'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Adding and Formatting Images


    6.

    Save your changes in your image editor, then return to Dreamweaver. Click on the
    image, and it is instantly refreshed to reflect your changes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_114_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_114_1.png)


    # Text and Image Interaction


    Some of the most important adjustments you can make to Web-page images involve
    the way the images interact with adjacent text. Adding extra space between text
    and images can make a page look more professional.


    # Wrapping Text around Images


    You can make text wrap around adjacent images in one of two ways.


    1.


    When wrapping text around images, either position the text cursor before the text
    and then insert the image, or place the text cursor to the side of the image and
    then insert the text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_114_2.png)'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 2.


    Select the image and choose Modify|Selection Properties to display the Image Property
    Inspector. Click on the arrow next to the Align box and choose Left from the drop-down
    list of alignment options.


    ![](img/eb7bf63026b0f3188f312686de439a8a_115_0.png)


    # 3.


    The text wraps around the image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_115_1.png)


    # Adjusting Space around Images


    By default, there are only about three points of space between an image and adjacent
    text. You can adjust the space by selecting the image and entering a number of
    points in the expanded Property Inspector''s V Space and H Space boxes.


    # 1.


    The V Space setting controls the vertical space above or below the image: H Space
    controls horizontal space to the left or right side of the image. Change V Space
    to 6 points and H Space to 9 points.


    ![](img/eb7bf63026b0f3188f312686de439a8a_115_2.png)'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# 2.


    Click on the thumbnail Apply to see the changes in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_116_0.png)


    # Images and Line Breaks


    Sometimes, you don''t want text to wrap around the image. You can specify that
    the text break before the image and then resume the image.


    # 1.


    Select the image, then choose Top from the Align menu of the Image Property Inspector
    to see the changes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_116_1.png)


    # 2.


    Select Middle from the Align menu to start the first line of text at the middle
    of the image and to have the subsequent text appear below the image. This alignment
    is good for one-line captions.


    ![](img/eb7bf63026b0f3188f312686de439a8a_116_2.png)'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Background Images


    Every Web page has a background color that appears behind the primary text and
    graphics. By default, the color is gray or white, but the designer can assign
    another color or a graphic image that can be tiled (repeated over and over) to
    appear as wallpaper behind the page content. See this books'' accompanying color
    selector for examples.


    # Assigning Colors


    # Ensure Adequate Contrast


    Avoid choosing background colors that clash with or are too similar to the color
    of the text on the Web page. A red background will make orange or blue text virtually
    unreadable, for example. There''s nothing wrong with a black or dark background,
    as long as you specify that the text be white or any other light color.


    ![](img/eb7bf63026b0f3188f312686de439a8a_117_0.png)


    # Use Browser-Safe Colors


    Sticking to a set of 216 standard or Web-safe colors ensures uniform display by
    all browsers. Dreamweaver''s color picker comes with a variety of palettes; the
    colors shown in the Color Cubes and Continuous Tone palettes are Web safe. To
    choose a palette, click on either the Background or Text box in the Page Properties
    dialog box. click the arrow in the upper-right corner. Choose Color Cubes or Continuous
    Tone from the menu that appears.


    The number 216 results from six values each of red, green, and blue—6 x 6 x 6
    = 216 possible color combinations. If you are using a color palette or any color
    that is not Web safe and you select Snap To Web Safe, Dreamweaver automatically
    replaces the selected color with the closest Web-safe color.


    | | #FFFFFF | | Color Cubes |

    |---|---|---||

    | Text | | Continuous Tone |

    | Links | | Windows OS |

    | Left Margin | | Mac OS |

    | Top Margin | | Grayscale |

    | Document Encoding | | Snap to Web Safe |'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Creating Background Images


    The best images for Web-page backgrounds are usually small ghosted designs that
    don''t interfere with the rest of a Web page''s contents. Using an image in the
    background makes the page to appear as wallpaper behind it and adds depth as well
    as graphic interest.


    # 1.


    Create the ghosted image in your graphics program.


    ![](img/eb7bf63026b0f3188f312686de439a8a_118_0.png)


    # 2.


    Choose Modify|Page Properties to display the Page Properties dialog box. Click
    on the Browse button next to the Background Image box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_118_1.png)


    # 3.


    In the Select Image Source dialog box, select the image file, then click on Select
    to return to Properties. Click on OK to close Page Properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_118_2.png)'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# 4.


    You return to the Dreamweaver Document Window, where the image appears to be tiled
    in the background of the current Web page.


    # Special Web-Page Images


    Web pages really get interesting, in a graphic sense, when you create interactive
    images or use images as headings or other navigational landmarks. Once you are
    comfortable with the basics of placing and adjusting images, you can apply special
    images to make your pages more compelling.


    # Using Headings as Images


    For additional impact, many designers avoid using standard Web-page headings and
    instead use graphic design programs such as Photoshop to create them. They save
    the headings in GIF or JPEG format and place them as images on Web pages.


    ![](img/eb7bf63026b0f3188f312686de439a8a_119_0.png)


    # Creating Rollover Images


    One of the most popular image behaviors seen on Web pages is a rollover—an image
    that, when you pass your mouse over it, changes into something else. The effect
    is achieved by means of the Web-page scripting language JavaScript. Often, rollovers
    are used for buttons: the original button image changes into something that hints
    at your browser will go when you click on the button.


    ![](img/eb7bf63026b0f3188f312686de439a8a_119_1.png)'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Adding and Formatting images


    Create the two images you want to use—the “before” image and the “after” image
    that will appear after the mouse arrow passes over that original image.


    Position the cursor at the spot where you want to create the rollover effect.
    Choose Insert Interactive Images|Rollover Image from the Document Window menu
    bar. The Insert Rollover Image dialog box appears.


    In the Insert Rollover Image dialog box, you can assign the rollover image a name.
    Enter the file name of the “before” image in the Original Image box and the file
    name of the “after” image in the Rollover Image box. You can also specify the
    URL of a page that the viewer’s browser should display after clicking on the rollover
    image. Click on OK.


    Make sure the Web page on which you want to include the rollover, and the images
    themselves, are located in the same directory. If they’re not, you could end up
    with a “broken image” icon, which appears in Dreamweaver can’t make the link from
    the Web page to the images.


    ![](img/eb7bf63026b0f3188f312686de439a8a_120_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_120_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_120_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_120_3.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 5.


    If all the files are not in the same directory, re-create the rollover and on
    the Browse buttons next to the Original Image and Rollover Image boxes in the
    Insert Rollover Image dialog box. In the respective selection dialog boxes, locate
    the image files so Dreamweaver can make the links.


    # 6.


    When the Insert Image Rollover dialog box closes and the original image appears
    on the page, press F12 to preview the image in a Web browser so you can test the
    rollover. Pass the mouse arrow over the image to see it roll over.


    By creating a series of buttons that use rollovers, you can create an interactive
    navigation bar on a Web page. Rather than creating each button separately, you
    can create the rollovers all at once by selecting Insert|Interactive Images|Navigation
    Bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_121_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_121_1.png)'
  merge: -1
