  md: '# Setting Up a Local Web Site


    Content, as they say, is King on the Web, and it makes sense to start crafting
    the text of your Web pages even before you select and format images and interconnect
    your files to create a well-organized Web site, which is a collection of Web pages
    that work together to convey a message.


    Before delving into Dreamweaver''s text-formatting tools, however, consider one
    more element of Website organization—placing your files and the rest of your Web
    content in a Web site that you can test on your computer before publishing it
    online.


    # Site Menu Options


    The options under the Site menu in the Document Window toolbar allow you to create
    or edit Web sites that you have made. Select Site|New Site to create a new Web
    site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_83_0.png)


    # The Site Definition Window


    When you select Site|New Site, the Site Definition Window appears. Enter a name
    for your site in the Site Name box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_83_1.png)


    # Define Existing Sites


    After you have created a local web site, you can select Site|Define Sites to add
    information about it. You can duplicate a site to make a backup of it, for instance.
    You can also edit an existing site or associate a site with a remote Web server
    (a computer that enables your files to be seen on the Internet).


    ![](img/eb7bf63026b0f3188f312686de439a8a_83_2.png)


    In some ways, it''s easiest to define a Web site before you have any files to
    put in it. However, you can also define a site by pointing to the location of
    an already existing folder that contains Web pages and other files.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Choose Your Site Location


    When your site has a name, select a location for it one of your hard disks. You
    will create a folder in the location that will contain your HTML Web-page files
    as well as images and other contents. Dreamweaver recommends that you create the
    Web-site folder in your local root folder—that is, the top level of your hard
    disk. If your site is named MySite, the location would be C:\MySite in Windows.


    ![](img/eb7bf63026b0f3188f312686de439a8a_84_0.png)


    You can also locate your site on your computer desktop—consider creating a folder
    called Sites and locating various Web sites within it. Dreamweaver checks the
    links that join your Web-page contents (such as images) to the Web pages in which
    they appear. Keeping your Web site in an easy-to-access location makes it easy
    for Dreamweaver to locate the files you need—not to mentioning it easy for you
    to find them,


    # Links and Cache


    When you set up your Web site, enter the Web address (URL, or Uniform Resource
    Locator, which begins with http://) that your site will have when you publish
    the files on a remote Web server so they can be viewed on the Internet. That way,
    Dreamweaver can make links to your images and other files; when you transfer the
    files to the remote Web server, the links will be ready to work.


    Cache is a part of your computer''s memory that is reserved for specific options.
    The Enable Cache checkbox in the bottom half of the Site Definition dialog box
    tells Dreamweaver to set aside a cache for site-management tasks as maintaining
    a list of your site''s contents in the Assets panel. Check this unless you are
    extremely low on memory.


    ![](img/eb7bf63026b0f3188f312686de439a8a_84_1.png)'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Working with Web-Page Text


    Once you have set aside a folder for your files, you can concentrate on your Web-site
    content. This section runs through the many text and paragraph formatting options
    you can use with Dreamweaver.


    # Entering Text in the Document Window


    The most obvious way to enter text in your Web page is simply to position the
    text cursor within the Document Window and start typing. Do not press Return or
    Enter at the end of line; Dreamweaver wraps the text automatically for you, which
    is known as word wrap.


    To insert multiple consecutive spaces, use Insert(Special Characters)(Non-Breaking
    Space (Ctrl+Shift+Space) or press Enter/Return.


    ![](img/eb7bf63026b0f3188f312686de439a8a_85_0.png)


    # Selecting Text


    You can select text in the Document Window by using techniques that are common
    to most word processing programs: Double-click on a word to select it; click and
    drag the text cursor across a word or phrase to select it; and press Backspace
    to delete one character at a time or choose Ctrl+A (Cmd-A on a Mac) to select
    all at once. A narrow space about one p wide at the left edge of the Document
    Window functions as a selection area; click in the area to select the adjacent
    line.


    ![](img/eb7bf63026b0f3188f312686de439a8a_85_1.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Working with Text


    If you have prepared text in Microsoft Word, Notepad, or another word processor,
    you can copy it to Dreamweaver. Highlight the text and then press Ctrl+C (Cmd+C
    on a Mac). Switch to Dreamweaver, insert the position point in the Document, and
    choose Edit|Paste or press Ctrl+V (Cmd+V on a Mac). Dreamweaver doesn''t preserve
    text formatting in the other application, but it does preserve line breaks.


    The Edit|Paste HTML option takes you raw HTML code from Web editing program and
    paste it into the Document Window with the formatting displayed.


    # Importing HTML


    If you are more comfortable creating content in a word-processing program such
    as Microsoft Word, you can use one of Dreamweaver''s File|Import options to bring
    the text into Dreamweaver''s Document Window.


    # 1.


    Create the text in Word and save your changes by selecting File|Save. (You may
    want to check the spelling as well.) Switch to Dreamweaver by clicking on the
    Document Window, if it''s open on your desktop. If it''s not open on your desktop,
    click the Taskbar button (Windows) or select Dreamweaver from the Finder (Mac).
    File|Import|Import Word HTML.


    You can also import text and numerical data that has been formatted in a table
    by choosing File|Import|Import Tabular Data. See Chapter 5 for more information.'
