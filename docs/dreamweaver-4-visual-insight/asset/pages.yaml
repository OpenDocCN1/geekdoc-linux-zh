  md: '# Saving Frames and Framesets


    To preview a frame-composed page in a browser, you must save the frames or frameset.
    You can use any of Dreamweaver''s several options to save either the entire frameset
    or the individual frames it contains.


    # 24.


    Once you have created a frameset layout you wish to save, choose File|Save Frameset.


    ![](img/eb7bf63026b0f3188f312686de439a8a_320_0.png)


    # 25.


    In the Save As dialog box, select the folder in which you want to save the frameset,
    type a name for it into Name text box so you''ll be able to identify it later.
    Click on Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_320_1.png)


    # 26.


    Use a similar method to save individual frames. Select a frame and choose File|Save
    Frame. When the dialog box opens, make sure the file is being saved in the correct
    folder, give it a name, and click on Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_320_2.png)'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Setting Individual Frame Properties


    Each frame in a frameset is essentially a separate Web page. As such, you alter
    its properties and content as you would any Web page: by opening the frame in
    a Document Window and using Dreamweaver''s tools to set its attributes.


    # 27.


    From the list of frames you''ve saved, select a frame to work on and open it in
    a Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_321_0.png)


    # 28.


    Choose Modify|Page Properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_321_1.png)


    # 29.


    In the Page Properties dialog box that appears, you can set new properties for
    the frame, including background color, background image (as you learned to do
    in Chapter 4), and once you have set the new properties to your satisfaction,
    choose File|Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_321_2.png)'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 30.


    Go ahead and open other frames from your frameset in other Document Windows. Give
    each one new properties and save the files.


    ![](img/eb7bf63026b0f3188f312686de439a8a_322_0.png)


    # 31.


    Open the frameset file that incorporates the frames you just altered. You''ll
    find that the frameset has updated to reflect the changes you made in each individual
    frame.


    ![](img/eb7bf63026b0f3188f312686de439a8a_322_1.png)'
