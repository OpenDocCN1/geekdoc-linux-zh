- img_proc: true
  md: '# Varieties of Web-Page Hyperlinks


    This book thus has concentrated on creating standalone Web pages. In practice,
    few, if any, Web pages stand alone. One of the Web''s most powerful attributes
    is that it gives you the ability to link one page to another. You can create links
    at any time. You can add links at the same time you''re adding text and formatting
    images, or you can finish the page completely and add links later.


    # General Concepts


    Before delving into detail on the subject of links, it''s important for you to
    understand some fundamental concepts involving hypertext links.


    # Referral Pages and Targets


    A hypertext link (also sometimes called a hyperlink) gets its name from hypertext,
    the concept of information retrieval that allows you to find information by clicking
    on text or images (or linking) from one location to another. Every link has a
    starting point, or referring page. From the referring page, the link points points
    to a destination, or target. The target can be a Web page, a word or phrase on
    a page, an image, a multimedia file, or downloadable software.


    ![](img/eb7bf63026b0f3188f312686de439a8a_141_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_141_1.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Anchors in HTML


    In HTML, a hypertext link is made by using the anchor tag. Most often, the tag
    takes the form <A HREF="linkdestination.html"> highlighted clickable link</A>.
    HREF stands for hypertext reference.


    ![](img/eb7bf63026b0f3188f312686de439a8a_142_0.png)


    # Linking to a Local Web Page


    One of the simplest and most common links you can make is to another page in your
    own Web site. The referring page and the target are located on different Web pages,
    but they''re both in the site (although you can place the two pages wherever you
    want—on your computer or on a remote Web server—they''re likely to be in the same
    directory).


    This URL for a same-site link is constructed in a way that is relative to the
    page on which the link originates. Because you are not making a link to a page
    on another Web site, you don''t need the // prefix. So, if the originating page
    is located in the directory named Pages and the destination page is in the same
    directory, the URL need include only the name of the destination page (for instance,
    /destination.html).


    # 1.


    Highlight the text that will serve as the starting point for the link—what the
    visitor will click on to get the specified target.


    Although this example uses text for the sake of simplicity, the highlighted, clickable
    "starting point" for a link can be text, an image, or another object.


    ![](img/eb7bf63026b0f3188f312686de439a8a_142_1.png)'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 2.


    If the Property Inspector is not visible, select Modify|Selection Properties to
    display it. In the Link box, enter the name of the Web page that you want to designate
    as the target for the link. If the page is named table.htm, for instance, enter
    "table.htm" in the Link box. Press Enter/Return.


    You are entering the URL of the target Web page in the Link box. If you keep all
    your Web-page files in the same directory, you need to enter only the file name.


    ![](img/eb7bf63026b0f3188f312686de439a8a_143_0.png)


    # 3.


    The clickable hypertext link is highlighted (by default, the link is underscored;
    however, you can change the highlighting to a color, if you want. To test your
    link, preview the page in a browser window and click on the link-self. The browser
    should go to the new page. If not, return to Dreamweaver, highlight the link text,
    and adjust the URL you entered in the Link box in the Property Inspector.


    > WomanLore brings to life powerful women of bygone eras who have been waiting
    in the wings to invoke their spirits, to give them space for a time, to live again
    in hearts and minds.. to live again the moment.


    > WomanLore brings to life powerful women of bygone eras who have been waiting
    in the wings


    # Point to a Local File


    The Point To File icon, which is located just to the right of the Link box in
    the Property Inspector, gives you another way to create a link from the file currently
    displayed in the Document Window to another file on your computer.


    # 1.


    Highlight the text or image that you want to serve as the clickable link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_143_1.png)'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# 2.


    Identify the file to which you want to link, and make the file''s icon visible
    on your desktop.

    Locate the file in Windows Explorer or My Computer (on the Mac, in the Finder),
    or use Dreamweaver''s Site Window. To make the Site window visible, choose Site|Map
    or press Alt+F8.


    ![](img/eb7bf63026b0f3188f312686de439a8a_144_0.png)


    When you click on the Point To File icon, instructions appear in the Link box
    that tell you what to do: "Drag a file to make a link." On a Mac, choose Site|Open
    Site, click on the Site button in the Launcher bar, or choose View|Sites to display
    the Site Window.


    # 3.


    Click and hold down on the Point To File icon and drag the mouse pointer to the
    file you want to point to. As you drag, an arrow appears and the selected file
    is highlighted. Release the mouse button to make the link. The URL for the link
    automatically appears in the Link box in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_144_1.png)


    Link to a Page in Another Directory

    If you need to move up to another directory, use two dots followed by a forward
    slash (../). Suppose the root directory of your Web site is C:\Mysite (or, on
    a Mac, the folder Mysite is on the top level of your hard disk). Within Mysite,
    you have a folder called pages, and within pages is a directory called catalog.
    Within catalog is a page called table.htm. To create a link from table.htm to
    a file index.htm in the folder pages, you would enter "../pages/index.htm" in
    the Link box in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_144_2.png)'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Linking to an External Web Page


    The first two steps involved in making a link to a Web page on someone''s site
    (that is, to another location on the Internet) are the same as the steps for making
    a link to a local page: Highlight the link text, enter the URL of the remote Web
    page in the Link box. The difference is that you need to use the full URL of the
    remote page, including the http:// prefix.


    The http:// prefix is used only for links to Web pages. You can make links to
    documents contained on other parts of the Internet. Gopher pages have the prefix
    gopher://, FTP files use ftp://, and so on.


    # Same-Page Links


    You can create a link to a specific point on the current page instead of another
    file or Web page. Often, Web pages are so long that intrapage links help the viewer
    get from one point to another with a single click. Sometimes, a Web page has a
    series of links near the top that leads to sections further.


    ![](img/eb7bf63026b0f3188f312686de439a8a_145_0.png)'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Extending a Web Site with Links


    # 1.


    To create a same-page link, use a named anchor. You create a named anchor by first
    highlighting the destination point of the link (this can be text, an image, or
    another object) and then choosing Insert||Named Anchor.


    ![](img/eb7bf63026b0f3188f312686de439a8a_146_0.png)


    In HTML, a named anchor uses the NAME attribute together with the A anchor tag,
    like this: <A NAME="fred">


    ![](img/eb7bf63026b0f3188f312686de439a8a_146_1.png)


    # 2.


    When the Insert Named Anchor dialog box appears, enter a name for the link. The
    name can be anything you want; just be sure it''s something you can remember easily.
    (When you create the starting point for the link, you''ll need to remember this
    name.) Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_146_2.png)


    # 3.


    A highlighted anchor symbol appears next to the destination of the same-page link.
    In addition, the Property Inspector displays information about the named anchor.


    In order to see the anchor symbol, you need to have Invisible Elements turned
    on; select View|Visual Aids|Invisible Elements if you need to.


    # 4.


    ![](img/eb7bf63026b0f3188f312686de439a8a_146_3.png)


    Creating the other part of the named anchor is easy: Highlight the text, image,
    or other object that you want to serve as the starting point. In the Link box
    in the Property Inspector, enter the name of the link you created in Step 3 preceded
    by the pound sign (#). Press Enter/Return to finish making the link.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Using the Site Window


    The Site Window, which you display by choosing Site|Site Map, gives you a list
    of all the files in your Web-site root directory, as well as a visual map of the
    links between files in your site.


    # Viewing Web-Site Links


    As you saw earlier in this chapter, the Local Folder half of the Website contains
    a list of the Web-page file files and folders in your site. The Site Navigation
    half presents you with a visual representation of the links between the pages
    on your site. To display the Site Navigation contents, click on the Site Map button
    in the Site Window''s toolbar.


    Click on the Files button in the Site Window''s toolbar to display the contents
    of the Local Folder pane if they aren''t displayed already.


    ![](img/eb7bf63026b0f3188f312686de439a8a_147_0.png)


    # Link from the Site Window


    You can make links from the Site Window without using the Property Inspector.
    Click on the File Icon appear next to it. Click on the icon, hold and drag the
    pointer to the icon of the file you want to link to in the Local Files area. Release
    the mouse button, and the link is made.


    ![](img/eb7bf63026b0f3188f312686de439a8a_147_1.png)


    # Remove a Link


    To remove a link from the Site Navigation half of the Site Window, right-click
    on the file that represents the link destination. Then choose Remove Link from
    the context menu.


    On a Mac, click on the destination file, hold down the mouse button, and choose
    Remove Link from the context menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_147_2.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Special Types of Links


    Web-page links dont necessarily have to join text to a file or other object. You
    can designate parts of a Web page other than text to serve as starting points.
    You can also set up links to open email or other windows.


    # Creating an Email (Mailto)


    The ability to contact someone almost instantly by email is one of the things
    that makes the Web such a popular commercial medium. When a visitor clicks on
    an email, or mailto, her email program launches (if it isn''t already running)
    and opens to a preaddressed message-composition window. She only has to compose
    the message and send it.


    +   1.

    Highlight the text or other object that will serve as the starting point for the
    link.


    Some Web authors use their email address as the link, but you don''t have.


    ![](img/eb7bf63026b0f3188f312686de439a8a_148_0.png)


    +   2.

    Select Insert|Email Link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_148_1.png)


    +   3.

    The Insert Email Link dialog box appears. In the E-Mail box, enter the email address
    you want to associate with the link. You can edit the highlighted text in the
    Text box; you can also leave it as is.


    ![](img/eb7bf63026b0f3188f312686de439a8a_148_2.png)


    +   4.

    The Insert Email Link dialog box closes and the text you highlighted in Step 1
    is now highlighted as a link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_148_3.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 5.


    If you use the procedure in Step 5 to create an email link, make sure you don''t
    insert a blank space between the colon and the @ sign in the mailto email address.


    ![](img/eb7bf63026b0f3188f312686de439a8a_149_0.png)


    # Targeted Links


    By specifying a target for a link, you can control what happens when the user
    clicks on the link. If you highlight the link and click on the arrow next to the
    Target box in the Property Inspector, four options (_blank, _parent, _self, and
    _top) appear that enable you to choose a target. Choosing a target causes the
    text, image, or other content that''s connected to the link to replace the content
    currently displayed in the viewer''s browser.


    Targeted links are used primarily in Web pages that have been divided into frames.
    You can specify a frame as the target for linked content, too (the _parent and
    _self options are useful with frames). See Chapter 8 for more information.


    ![](img/eb7bf63026b0f3188f312686de439a8a_149_1.png)


    # Open a New Browser Window


    If you select _blank from the Target drop-down menu in the Property Inspector,
    the linked content will open in a new, blank browser window. This keeps the referring
    page (the page that included the original highlighted link) on the viewer''s desktop
    as well.


    ![](img/eb7bf63026b0f3188f312686de439a8a_149_2.png)'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Turning an Image into a Hyperlink


    Images can serve as either the beginning or the end points for links as well.
    Using images gives Web pages more graphic interest as well as interactivity.


    # A Single-Image Link


    The most common type of Web-page image link is one that associates a single image
    with a destination. The viewer knows the image is a link by passing the mouse
    arrow over the image and seeing the link destination in the browser''s status
    bar.


    # 1.


    Select the image you want to serve as the clickable link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_150_0.png)


    # 2.


    If necessary, select Modify/Selection Properties to display the Property Inspector.
    Then follow one of the options described earlier for creating links: You can enter
    a URL or address in the Link box, you can click on the Point To icon and drag
    it to a file, and so on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_150_1.png)


    # 3.


    Press Enter/Return. The link is made. You can make it easier for the viewer to
    tell that the image is a link by adding a black border around it. Select the image.
    In the Property Inspector, enter a number (of pixels) in the Border box. Press
    Enter/Return again to create the border.


    ![](img/eb7bf63026b0f3188f312686de439a8a_150_2.png)'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# A Navigation Bar


    A navigation bar (also sometimes called a buttons bar) is a series of buttons
    that act as lead your visitors through areas of your Web site. Each button in
    the bar is linked to a Web page. With Dreamweaver, you can make the navigation
    bar interactive by assigning each of the buttons behaviors that make them appear
    to change when the user passes over them or clicks on them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_0.png)


    You can use the Button Editor in Macromedia Fireworks to create your buttons,
    export them to Dreamweaver.


    # 1.


    Dreamweaver gives you the ability to make buttons take on a different appearance
    when each of four events happens: The user simply looks at the buttons on the
    page (the button is in what is called the Up style), passes the mouse arrow over
    the button (Over), clicks on the button (Down), and passes the mouse arrow over
    a button that has been clicked or "pushed in" (Over While Down). To achieve these
    effects, you need to make four separate versions of each button, each with a different
    appearance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_1.png)


    Up


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_2.png)


    Over


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_3.png)


    Down


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_4.png)


    Over While Down


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_5.png)


    # 2.


    Save the four image files in the same directory on your Web site. Select Insert|Interactive
    Images|Navigation Bar to display the Insert Bar dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_151_6.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Extending a Web Site with Links


    In the Up Image box, enter the file name of the image you want to serve as the
    Up version of the navigation bar. Or click on Browse, locate the file in the Select
    Image Source dialog box, and click on Select to select the image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_152_0.png)


    Repeat Step 3 for the three other versions of the navigation bar. When you''re
    finished with all three, click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_152_1.png)


    The Up version of the navigation bar appears in the Dreamweaver Document Window.
    Pre-view the page to see how the navigation bar works when you pass the mouse
    over the buttons and click on them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_152_2.png)


    # Image Maps and Hotspots


    An image map is a GIF or JPEG image whose contents have been divided or mapped
    into two or more regions called hotspots. Each hotspot (a circle, rectangle, or
    polygon) can be linked to the URL of a file or object on the Web. When the user
    positions the mouse arrow within the hotspot and clicks there, the browser connects
    to the URL that has been linked to it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_152_3.png)'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Chapter 6


    The Property Inspector''s Image Map Tools

    Images containing clearly defined multiple elements (such as maps showing individual
    states of the United States of America) make the best candidates for image mapping.

    Dreamweaver provides you with tools to create and manipulate image maps. To create
    the image map, click on the image and then use the tools in the expanded Property
    Inspector.


    The user needs to be able to determine where to click to the link. In some cases,
    it may be helpful to augment the image with some text to guide the user.


    ![](img/eb7bf63026b0f3188f312686de439a8a_153_0.png)


    # Link to a Hotspot


    Once you draw a hotspot on an image, the Property Inspector becomes the Hotspot
    Inspector. Enter the URL for the file you want to link to the hotspot in the Link
    box. Then, in the Target field, specify the window into which the linked file
    should load. Click on the drop-down menu and select one of four options; then
    press Return to make the link. When viewed in a browser, the URL for the linked
    file will be displayed in the status bar when you move the cursor over the hotspot.


    ![](img/eb7bf63026b0f3188f312686de439a8a_153_1.png)


    # Changing Link Properties


    Once you have created links, you can use Dreamweaver to manage them in many different
    ways. You can check the links to make sure they work correctly or change the appearance
    of the clickable link text.


    # Adjusting Link Color


    There''s no reason why you need to use the default link colors for a page. You
    can choose colors for links that complement the background and other colors you''re
    using—as long as the link highlights are visible and do not interfere with nearby
    contents. Web pages have three kinds of link colors: Link (the link hasn''t been
    clicked on yet), Active Link (the link changes color as the user clicks on it),
    and Visited Link (the link has been visited recently).


    126'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Extending a Web Site with Links


    # 1.


    Choose Modify|Page Properties from the Document Window menu bar to display the
    Page Properties dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_154_0.png)


    # 2.


    Click on a box that corresponds to one of the three types of links: Links, Visited
    Links, and Active Links. When the color selection box appears, click on a color
    box to select it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_154_1.png)


    # 3.


    Repeat Steps 1 and 2 for each type of link you want to adjust. Then click on OK
    to close the Page Properties dialog box. Press F12 to pre-view your page in a
    browser window and see how the new colors work.


    ![](img/eb7bf63026b0f3188f312686de439a8a_154_2.png)


    # Checking Links


    Once you have linked a page to others on your site, you can check links by first
    displaying the page in the Document Window, choosing File|Check Links. The Link
    Checker dialog box appears. Any links that are "broken" (that is, links that don''t
    work because the ''objects'' locations don''t match the URL you entered for them)
    appear in the Broken Links area.


    ![](img/eb7bf63026b0f3188f312686de439a8a_154_3.png)


    Choose External Links from the Show drop-down menu at the top of the Link Checker
    dialog to check any links you''ve made from the currently displayed page to external
    Web sites.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Changing a Link across a Web Site


    Suppose you made links to a Web page and then changed the name or location of
    the page. With Dreamweaver, you can change all occurrences of that link at once.
    Display the Site Window, then choose Site|Change Link Sitewide to display the
    Link Checker dialog box. Change Link Sitewide dialog box. Enter the old link''s
    URL in the top text box; enter the new URL in the bottom text box. Click on OK
    to make the change globally.


    ![](img/eb7bf63026b0f3188f312686de439a8a_155_0.png)'
