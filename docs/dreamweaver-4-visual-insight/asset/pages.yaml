  md: '# Project 3: Attach a File to a Template


    Once you have created a template that contains the standard elements you want
    to apply to all the pages in a site, you can attach a new file to the template.
    By attaching an existing file to a template, you are essentially copying the template''s
    layout attributes to the file while preserving the file''s existing content.


    # 1.


    You have a couple of options for attaching a file to a template. Here is the first:
    If you''re just starting to create a new page from scratch, select New From.


    ![](img/eb7bf63026b0f3188f312686de439a8a_351_0.png)


    # 2.


    In the Select Template dialog box, select the site that contains the template
    by selecting it from the Site drop-down menu. Click once on the template''s name
    to select it, then click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_351_1.png)


    # 3.


    The template opens. Scroll down to the editable regions of the template and add
    your new page''s text. When you''re finished, click FileSave and save the file
    with the name Profiles.htm.


    ![](img/eb7bf63026b0f3188f312686de439a8a_351_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_351_3.png)'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Using Dreamweaver''s Site Management Tools


    # 4.


    Now try the second way to attach a file to a template. First create the file,
    and attach it to the template. Create a new page for your site. Assign the Heading
    1 style to the page heading. Save the file and assign it the file name Profiles2.htm.


    ![](img/eb7bf63026b0f3188f312686de439a8a_352_0.png)


    # 5.


    With the file you want to open in the Document Window, choose Modify|Templates|Apply
    Template To Page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_352_1.png)


    # 6.


    When the Select Template dialog box appears, select the template to which you
    want to attach the currently active page. Click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_352_2.png)


    # 7.


    The Choose Editable Region for Orphaned Content dialog box appears. The editable
    regions contained in the selected template are displayed. Select the name of an
    editable region. This region will contain the current content of the page you
    want to attach to the template.


    Don''t worry if you don''t pick the correct region the first time. You can easily
    move the content from one editable region to another after you place it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_352_3.png)'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Chapter 15


    8. The template''s background color, type selections, and any other standard page
    elements you created earlier are applied to the current page. The current page''s
    content is placed in the editable region you specified in Step 7. You can now
    move text around, if you need to, from one region to another.


    ![](img/eb7bf63026b0f3188f312686de439a8a_353_0.png)'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Using Dreamweaver''s Site Management Tools


    # Project 4: Create and Apply a Style Sheet


    In Chapter 10, you learned about style sheets, which can be used to apply a standard
    set of formatting instructions to a single element (such as a paragraph), on a
    Web page, a single Web page, or a group of pages. To apply the same styles to
    a set of pages and thus achieve a consistent look and feel, you need to create
    an external style sheet and then apply it to the pages, as described in the following
    steps.


    # Creating a Style Sheet


    To apply an external style sheet to a group of Web pages, you first need to create
    the style sheet. Dreamweaver, as usual, makes it unnecessary for you to actually
    work with the Cascading Style Sheet (CSS) code that browsers use to display the
    formatting (unless you want to display the Code Inspector and work with the code
    directly, of course).


    Style sheet formatting will display only in versions 4 and later of browsers,
    including Microsoft Internet Explorer and Netscape Navigator. If you think a significant
    number of your Web site visitors will be using earlier browsers, don''t use style
    sheets—or provide an alternate version of your site for "older" browsers.


    # 1.


    Begin by clicking on the Show CSS Styles button in the Launcher bar at the bottom
    of the Document Window to open the CSS Styles panel.


    You can, of course, open the CSS Styles panel via the Window menu by choosing
    Window|CSS Styles. You can also press Shift+F11.


    ![](img/eb7bf63026b0f3188f312686de439a8a_354_0.png)'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Chapter 15


    # 2. CSS Styles


    The CSS Styles panel appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_355_0.png)


    # 3.


    Click on the New Style button in the set of buttons at the bottom of the CSS Styles
    panel.


    If you have a document that contains sections that you want to add to a style
    sheet, open that document first (rather than a new, blank file) and then open
    the CSS Styles panel. You''ll have a head start on creating a style sheet.


    ![](img/eb7bf63026b0f3188f312686de439a8a_355_1.png)


    # 4.


    The New Style dialog box appears. Click on the Redefine HTML radio button to define
    a particular type of Web-page element.


    ![](img/eb7bf63026b0f3188f312686de439a8a_355_2.png)


    # 5.


    When you select Redefine HTML Tag, the options in the drop-down at the top of
    the dialog box change. You can click on the Tag drop-down menu and select an HTML
    tag whose attributes you want to define. In this case, the body tag <BODY> is
    a good place to start. Click on OK to close the New Style dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_355_3.png)'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Using Dreamweaver''s Site Management Tools


    # 6.


    Because this is a new style sheet, the Save Style File As dialog appears. Enter
    the name “Womanlestyles” for your style in the File Name text box. Select a location
    for the style sheet from the Save In-down menu—in this case, the WomanLore folder.
    When you are finished, click on Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_356_0.png)


    # 7.


    The Style Definition dialog box appears. Select options in this dialog box to
    apply to the tag you want to define (Georgia, "Times New Roman", Times, serif;
    Size: 12 points; Color: #993300). When you’re finished, click on OK. The Style
    Definition dialog closes and you return to the CSS Styles panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_356_1.png)


    # 8.


    When you want to format another tag or create a custom Web-page style called a
    class, click on the Edit Style Sheet button at the bottom of the CSS Styles panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_356_2.png)


    # 9.


    The Edit Style Sheet dialog box appears. Select the style you want to edit. If
    you want to change an existing style, click on Edit. If you want to create a new
    style, click on New to open the New Style dialog box; repeat Steps 4 through 7
    to create new styles as needed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_356_3.png)'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Attaching a Style Sheet


    Once you have created and saved a style sheet, it''s easy to attach it to a file
    you''re working on. That way, you quickly apply all of the formatting instructions
    embedded in the style sheet without having to choose menu options and click on
    buttons for each element you want to format.


    With style sheets, you can also achieve some formatting effects, such as indents,
    that you can''t achieve otherwise.


    10. Open the file to which you want to attach the style sheet. Click on CSS Styles
    in the Launcher bar to open the CSS Styles panel. Click on the Attach Style Sheet
    button at the bottom of the panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_357_0.png)


    11. The Select Style Sheet File dialog box appears. Locate the style sheet file
    you want to attach. Click on the file''s name (which in this case is Womanrolet)
    to select the file. Then click on Select. The styles are applied to any existing
    text. When you enter new text, the style sheet instructions will apply as well.


    Repeat Steps 10 and 11 for any other files in your Web site for which you want
    to use the same style sheet.


    ![](img/eb7bf63026b0f3188f312686de439a8a_357_1.png)'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Project 5: Publish Your Files


    After you''ve created and corrected your content, checked your links, and applied
    any templates and style sheets you''ve created to improve the consistency of your
    site''s presentation, the fun part begins: putting your site on the World Wide
    Web so you and others can view it with a Web browser.


    You''ll want to keep two versions of your site active: the one you publish on
    the Web and the local version that exists on your computer. After you put your
    files online, you can update the content of your local files. Then you can use
    Dreamweaver to synchronize the Web and local versions so only the files you''ve
    updated will be transferred automatically.


    The first step in making the connection from your computer to the Web is to enter
    your FTP directory and access information.


    # 1.


    Choose|Define Sites from the Document Window menu bar.


    Before you publish your files, make sure you have tested the pages by opening
    them in one or two browsers to make sure everything looks the way you want it
    to look.


    # 2.


    The Define Sites dialog box appears. Click on the name of the site you want to
    publish (such as WomanLore), then click on Edit.


    ![](img/eb7bf63026b0f3188f312686de439a8a_358_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_358_1.png)'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 3.


    When the Site Definition For WomanLife dialog box appears, click on Remote Info
    in the list of categories on the left. Choose FTP from the Access drop-down menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_359_0.png)


    # 4.


    When you choose FTP from the Access menu, a new set of data entry fields appears.
    Enter the FTP information given to you by your Internet Service Provider (ISP)
    or Web-hosting service. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_359_1.png)


    Most ISPs give their customers space for a personal or business website. Ask your
    provider for the information you need to get your files online. As you can see
    from the image shown here, you don''t always have to enter "ftp" at the beginning
    of the hostname, and you don''t always have to specify a directory.


    # 5.


    The Define Sites dialog box appears. Click on Done.


    ![](img/eb7bf63026b0f3188f312686de439a8a_359_2.png)


    # 6.


    The Site Window opens. From the Site Window''s menu bar, select Site|Connect to
    initiate the connection to the remote site that will host your files.


    If you aren''t already connected to the Internet when you choose Site|Connect,
    Dreamweaver will tell you dial-up software to make the connection.


    ![](img/eb7bf63026b0f3188f312686de439a8a_359_3.png)'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Using Dreamweaver''s Site Management Tools


    # 7.


    A window appears briefly to let you know the host has been found and the connection
    is being made.


    ![](img/eb7bf63026b0f3188f312686de439a8a_360_0.png)


    If you are unable to connect, you''ll see an error message. Usually, you''re unable
    to connect because you didn''t enter your password or hostname correctly. Return
    to the Document Window, click on Site|Define Sites, select the site you want to
    publish, click on Edit, and re-enter the information in the Remote Info section
    of the Site Definition dialog box.


    # 8.


    The remote site''s directories (that is, any directories you have already created
    to contain other Web site content) appear in the Remote Site area on the left
    half of the Site Window. Choose File|New Folder to create a new folder to hold
    your files.


    ![](img/eb7bf63026b0f3188f312686de439a8a_360_1.png)


    # 9.


    Select the files you want to transfer in the Local folder of the Site Window.
    Then click on the Put File(s) arrow in the Site Window toolbar to actually transfer
    the files.


    Click on a file, then press Shift+click to select subsequent files. Press Ctrl+click
    (Cmd+click on a Mac) to select files that aren''t listed continuously.


    ![](img/eb7bf63026b0f3188f312686de439a8a_360_2.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 10.


    Once the files have been transferred, connect to your site with a Web browser
    (get the URL from your ISP or Web host) and test the files to make sure they appear.
    If you need to make corrections to certain files rather than all the files in
    the site, you can transfer the new files by choosing Synchronize.


    ![](img/eb7bf63026b0f3188f312686de439a8a_361_0.png)


    # 11.


    The Synchronize Files dialog appears. Select options from the Synchronize and
    Direction drop-down menus. Click on Preview.


    ![](img/eb7bf63026b0f3188f312686de439a8a_361_1.png)


    # 12.


    If any files need to be updated in the direction in which you choose to synchronize,
    Dreamweaver will list them for you in the Synchronize dialog box. (In other words,
    if you choose to synchronize newer files than the files currently on the local
    disk with the remote site, the newer files will be listed in the Synchronize dialog
    box.) Click on OK to synchronize the local Web site and the “public” version of
    your Web site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_361_2.png)


    Congratulations! After all your hard work, your Web site is now available for
    everyone to view.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Glossary


    Dreamweaver has such a varied set of tools and commands that it practically has
    its own language. On top of that, when you start working with Web pages, you run
    into terms that you don''t normally see in the world of professional graphic design.
    This glossary provides you with a set of terms that you might encounter when using
    Dreamweaver and will help you get started using the program.


    background—Every Web page has a background that appears behind the primary text
    and graphics. By default, the background is a solid color (gray or white), but
    the designer can assign another color or a graphic image that can be "tiled" (repeated
    over and over) to appear as "wallpaper" behind the page contents.


    active link—A link that changes color as the user clicks on it.


    behavior—Something that happens on a Web page when someone performs an action
    as clicking on a link or loading a page: A new page appears, image loads, and
    so on.


    Alt name—Text that appears when the user passes a mouse arrow over an image on
    a Web page. Alt names are useful as alternatives to an image.


    Behaviors panel—A Dreamweaver element that enables the designer to assign a behavior
    (such as a pop-up message or pop-up window) to an event (such as a Web page loading
    or a user moving the mouse cursor over an image).


    anchor tag—The HTML element <A> is used to make a hyperlink. Most often, the tag
    takes the form <A HREF="linkdestination.html">clickable link</</a>. HREF stands
    for hypertext reference.


    bitmaps—Computer images made up of tiny squares called pixels, each of which represents
    one data bit of information.


    assets—All of the images, multimedia files, and other elements that give a Web
    site and color. Assets are displayed in Dreamweaver''s Assets panel.


    broken icon—An icon that appears in Dreamweaver (or a Web browser) can''t make
    the link from the Web page to an image.


    browser-safe colors—A set of 216 standard or "Web-safe" colors that ensures uniform
    display by all browsers.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Glossary


    +   bulleted list—A series of items, each of which is preceded by a round dot
    or a square; also known as an unordered list.


    +   dock—To save panel by combining or more separate panels so they become rate
    tabs in a single panel.


    +   cache—A part of the computer''s memory that is reserved for specific options.


    +   Document Window—The primary element of the Dreamweaver interface. This is
    the area where the document being worked on is displayed; the file name of the
    document appears in the title bar.


    +   Cascading Style Sheets (CSS)—A set of instructions used to specify type and
    layout attributes that can be applied to selected, single Web page files, or groups
    of Web pages.


    +   download—To move files from a remote server “down” to the computer via the
    Internet.


    +   cell—An element of a table that holds information.


    +   Dynamic HTML features—Special Web-page features that can be controlled precisely
    or add interactivity. Examples include layers and behaviors.


    +   cell padding—The space in pixels between the contents of a cell and the cell
    border.


    +   editable region—Part of a template; the editable region can contain text and
    can be edited.


    +   cell spacing—The space in pixels between cells.


    +   clip art—Icons, buttons, and other illustrations that can be downloaded from
    the Web and used on Web pages.


    +   Extensible Markup Language (XML)—A markup language that, like HTML, is derived
    from SGML (Standard Generalized Markup Language). You can create tags that enclose
    Web page contents so a browser can then parse those contents and perform actions
    upon them.


    +   Code Inspector—A Dreamweaver panel that can be used with the HTML code for
    the currently displayed Web page.


    +   file field—A form that enables a user to submit a file to a Web site.


    +   Common Gateway Interface (CGI)—A way of passing information back and forth
    between an application as a browser and a Web server, usually called a CGI script.


    +   file name—A short designation that can be assigned to a file. The file name
    appears in the Uniform Resource Locator (URL) that users use to view the file
    with a Web browser. The file name appears in Dreamweaver’s title bar when the
    file is opened.


    +   definition list—A list that consists of pairs of items. Each pair contains
    a term (the thing being defined) and the definition it.


    +   frame—A division within a single browser window. Each frame contains a document
    in its own right and has its own URL.


    +   Design Notes—Instructions that include a description of how a Web page was
    created, on house style, or information about what marketing factors influenced
    a design decision. Notes can be shared with others in a workgroup who might be
    working on the same Web pages.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Joint Photographic Experts Group (JPEG)—


    Frames panel—A Dreamweaver tool that enables the settings that apply to individual
    frames within a frameset to be viewed and thus modified.


    A graphics compression format that is optimal for photographs and complex illustrations
    that need greater compression.


    frameset—A group of frames that make up a Web page.


    jump menu—A type of drop-down menu. The user''s browser “jumps” to a URL that
    has been associated with the selected menu.


    Graphics Interchange Format (GIF)—A graphics compression format. GIF is best suited
    to line, art, or images.


    Kbps—Kilobits (one thousand data bits) per second.


    hidden field—An actu field that doesn''t appear to the user. It can be added to
    a form to include some reference data to be sent along with the data submits.


    Launcher—A panel that contains buttons for closing and opening (or launching)
    other Dreamweaver panels.


    horizontal rule—A line that is inserted between sections of a Web page.


    Launcher bar—An area on the right side of the status bar at the bottom of the
    Dreamweaver Window contains buttons for opening and closing other Dreamweaver
    panels. If the Launcher bar does not appear, check the Show Launcher In Status
    bar in Status Bar preferences.


    hyperlink—Short for hypertext link. The term comes from hypertext, the concept
    of information retrieval that allows information to be found by clicking on text
    or images and jumping (or linking) from one location to another.


    layer—A container that can be created and precisely positioned on a Web page to
    contain text, images, or other content.


    HyperText Markup Language (HTML)—A set of instructions designed to mark up text,
    images, and other objects so they can be displayed in a Web browser window.


    library file—A bit of JavaScript that can be accessed quickly and reused by storing
    it in Dreamweaver’s library.


    indenting—Moving a paragraph, image, or other object from the outer layers toward
    the middle of the page.


    line break—A break (in contrast to a paragraph break) does not add a blank space
    between a line and adjacent text.


    inspector—A dialog box that provides information about the currently selected
    Web-page object. Usually, the term Property Inspector is seen most often. Occasionally,
    Dreamweaver’s Help files refer to the Image Inspector when the Property Inspector
    displays image information.


    Link Checker—A Dreamweaver utility that checks a site for links that are “broken”.


    mailto link—A link that causes the visitor’s email program to launch (if it isn''t
    already running) and open a new email message window. The email address of a specified
    recipient automatically appears in the Field.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Glossary


    MIME type—A-three or four-character extension at the end of an image''s file name
    that designates what type of object it is so that a program such as a browser
    can decide how to handle it.


    publishing—The process of moving files to a Web server where they can be viewed
    by any-one with a Web browser.


    mouseover—A JavaScript behavior that occurs when a viewer passes the mouse pointer
    over a Web-page object.


    radio button—A round button on a Web page. In a set of radio buttons, only one
    at a time can be clicked. When clicked, the button displays a solid black dot
    in its center.


    named anchor—A variation on the <A> anchor tag in HTML that is used to create
    a same-page link.


    referring—The Web page that contains the highlighted text or other object that
    serves as the starting point for a link.


    navigation bar—A series of buttons that act as links to visit areas of a Web site.
    Each button in the list is linked to a Web page.


    rollover—An image that has been assigned a behavior. When the mouse is passed
    over it, the rollover image changes into something else.


    numbered list—A series of items, preceded by a number, letter, or Roman numeral;
    also called an ordered list.


    selection handle—The small square near the upper-left corner of a layer. The selection
    handle can be used to select the layer so it can be positioned.


    Objects panel—A Dreamweaver element that presents the user with shortcut buttons
    that allow common items as images or links to be quickly inserted into the Web
    page worked on.


    Show Code And Design View—A Dreamweaver View option that can be used to view both
    the HTML code and the content of a Web page. The Document splits: One half shows
    the code, and the other half shows the page as it appears in a browser.


    outdent—Reverses the effect of indenting, moving paragraph text break toward the
    margins.


    swap image—An image that has been assigned the behavior as a rollover—one image
    replaces another on a Web page when the user clicks, does a mouseover, or performs
    another action.


    paragraph break—A break that adds a single blank space that separates a paragraph
    from other text or images.


    Portable Network Graphics (PNG)—A graph-ics format.


    table—A Web-page element to present “tabular” data in columns and rows as a spreadsheet.


    proportional font—A kind of typeface typically used for body text and headings
    (fixed-width fonts are used for code). The amount of space each character is proportional
    to the character’s size—narrow takes up less space than “w,” for instance.


    tag—HTML tag. Often, the tags come in pairs: The first tag is called a start tag;
    the second (one with the forward slash) is an end tag.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Glossary


    tag selector—An area on the left side of the status bar at the bottom of the Dreamweaver
    Document Window that displays the HTML tags containing the ''currently selected
    Web page contents or the spot in the Web page where the text cursor is positioned.


    target—A window or frame in which the content associated with a link opens.


    upload—To move files from the computer “up” to a remote server via the Internet.


    visited link—A link that has been visited recently. When the link is a text link,
    the color of the font changes so the user knows he or she has visited the link
    previously.


    zero point—The point at which Dreamweaver''s vertical and horizontal rulers meet.'
  merge: -1
  pgno: 366
- img_proc: true
