  md: '# Managing Your Web Site


    # Viewing Style Sheet Information


    Style sheet information is automatically added to every Dreamweaver Web page.
    You can view the style sheet for the current page by choosing View|Code or View|Code
    Design. Scroll to the <STYLE> tag (which is contained in the <HEAD> section of
    the document), which marks the start of the style sheet information.


    ![](img/eb7bf63026b0f3188f312686de439a8a_206_0.png)


    # The CSS Styles Panel


    Any styles that are linked to your document are contained in the CSS Styles panel,
    which you display by selecting Window|CSS Styles or by clicking on the CSS Styles
    icon in the Launcher bar at the bottom of the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_206_1.png)


    # Attach a Style Sheet


    If you are familiar with HTML style sheet commands and have already created a
    style sheet that you want to attach to the currently displayed page, click on
    the Attach Style Sheet button at the bottom of the CSS panel. The Select Style
    Sheet File dialog box appears. Locate the file, click on the file''s name to select
    it, and click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_206_2.png)


    > Attach Style Sheet'
