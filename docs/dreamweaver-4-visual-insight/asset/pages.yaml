- img_proc: true
  md: '# Web Site Design 101


    In Chapter 2, you learned how to perform the basic functions associated with creating
    and editing Web pages. In this chapter, you''ll put what you''ve learned into
    practice by beginning to create a simple Web site. Dreamweaver makes it easy—not
    to mention fun——to create your own Web pages and begin to weave them into an interconnected
    and well-coordinated Web site.


    # Project 1: Create a New Web Page


    In this first project, you''ll follow the initial steps for creating a professionally
    designed set of Web pages. Follow along as graphic designer Scott Wills as the
    contents and sets up the files that make up the WomanLore Web site. This is a
    real Web site put together and published online using Dreamweaver. The goal is
    to master the basics so you can apply them to your own business or personal Web
    site.


    Web-site design involves a sequence of steps, beginning with setting up the Web
    site file structure. As you design the page, you''ll create a page title and add
    layers, place and format text, add bulleted and numbered lists, and work with
    HTML code.


    # Setting Up the Site Structure


    First, you''ll set up a new Web site and create a group of Web pages that will
    serve as the site''s contents. Refer to Chapter 3 for details on relevant tools
    and techniques.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Creating a Simple Site


    # 1.


    First, set up a site structure to hold your “sites in progress” and all related
    materials. Start at the root level of your hard drive (Windows) or on your Desktop
    (Mac), create a new-folder, and name it Sample Sites. Create another folder inside
    to serve as the root folder for the site you''ll be working on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_232_0.png)


    Dreamweaver will refer to the root level folder and its contents whenever you
    work on a site. It will also act as a local server when you check your site with
    a browser.


    # 2.


    ![](img/eb7bf63026b0f3188f312686de439a8a_232_1.png)


    To define a local site, launch Dreamweaver and choose Site|New Site. In the Site
    Definition dialog box, make sure Local Info is selected in the Category list.
    Type your site''s name (in this case, Womanlore) in the Site Name field. The name
    appears in the Site Window.


    # 3.


    ![](img/eb7bf63026b0f3188f312686de439a8a_232_2.png)


    In the Local Root Folder field, specify the root folder you created in Step 1
    (Sample Sites) by clicking on the folder icon and browsing to find and select
    the folder. In the HTTP Address field, enter the URL that will designate your
    Web site (http://womanlore.com). Select the Cache option, click on OK, and you''re
    ready to create your first Web page!'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Chapter 11


    # Using Layers to Build a Web Page

    Working with layers allows you to create and reposition page elements quickly
    and easily. With your site structure now in place, you''re ready to build a home
    page for the site.


    # 4.


    First, save the document. With your Document Window open, choose File|Save. In
    the Save dialog box, select your site''s root folder, type the name Dreamweaver
    hp.html in the Name field, and click on Save.


    This file name will appear in a browser''s title bar when the page is viewed in
    a browser. If the page is bookmarked the file name is added to the bookmark list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_233_0.png)


    # 5.


    Choose Modify|Properties to view the Page Properties dialog box. In the Title
    field, enter a name (Dreamweaver hp) for the page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_233_1.png)


    # 6.


    Change the background color to blue. (Click on the drop-down menu by the Background
    field. See Chapter 4 for more details on adding color to Web page backgrounds.


    Dreamweaver''s color picks use only the 216 colors in the Web-safe palette. Web-safe
    colors are compatible with all popular browsers and will display in your document
    as they will appear on the Web. See the accompanying color section for a version
    of Dreamweaver''s palette.


    ![](img/eb7bf63026b0f3188f312686de439a8a_233_2.png)'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 7.


    Next, create a layer for the page''s text. Choose Window|Layers to open the Layers
    panel, and then select the Prevent Overlaps checkbox. This will allow the layers
    to be converted to tables later on for display in browsers. With the Document
    Window active, choose Insert|Layer.


    ![](img/eb7bf63026b0f3188f312686de439a8a_234_0.png)


    # 8.


    You can use an alternate technique to create a layer: With the Objects panel''s
    Common panel active, click on the Draw Layer button. You can then click and drag
    a new layer in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_234_1.png)


    # 9.


    To resize a layer, click on its border to select it and drag one of the handles
    until the layer is the desired size and shape. You can move the layer by using
    the arrow keys (holding down the Shift key while using an arrow key moves the
    layer five pixels in the direction of the arrow key you''re using) or by clicking
    on the tab in the upper-left corner and dragging the layer to a new location.
    Unwanted layers may be deleted by selecting Edit|Clear.


    ![](img/eb7bf63026b0f3188f312686de439a8a_234_2.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 10.


    The layer is in position, ready to receive text.

    Next, you''ll bring some text into your document for styling.


    ![](img/eb7bf63026b0f3188f312686de439a8a_235_0.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Project 2: Import Web-Page Text


    In this project, you''ll import some text from a Word document.


    # 1.


    Prepare a Microsoft Word document saved in HTML format. You can then import the
    text and allow Dreamweaver to check and clean its code. Choose File|Import to
    open a new Dreamweaver document. Then choose File|Import Word HTML. In the Select
    Word HTML Import dialog box, navigate to your HTML file and click Open to select
    the file. When you are prompted to select your document, click OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_236_0.png)


    # 2.


    The Dreamweaver document containing the text opens in the background with the
    Clean Up HTML dialog box open in front. Make sure all the default options are
    selected and click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_236_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_236_2.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 3.


    The cleanup results are displayed in the Clean Up Word HTML log box. Click on
    OK to close the log box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_237_0.png)


    # 4.


    Choose Edit|Select All to select the document text, then Edit|Copy. Close the
    text document. In your home page document, select a frame and choose Edit|Paste
    to insert the text into the layer.


    ![](img/eb7bf63026b0f3188f312686de439a8a_237_1.png)


    # 5.


    Divide the text into paragraphs by adding paragraph returns between sentences.
    You are now ready to use the Property Inspector to format the text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_237_2.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# 6.


    Choose Window Properties to open the Property Inspector. With the text layer selected,
    select all text in the layer.


    ![](img/eb7bf63026b0f3188f312686de439a8a_238_0.png)


    # 7.


    Click on the Property Inspector''s second Format drop-down menu and select a font
    style for the text. (In this case, choose Georgia, Times New Roman, Times.) The
    font in the selected layer will update to reflect the changes you''ve made.


    ![](img/eb7bf63026b0f3188f312686de439a8a_238_1.png)


    # 8.


    In the Property Inspector''s Size drop-down menu, select 4. The text size in the
    selected layer will update to reflect the changes you''ve made.


    ![](img/eb7bf63026b0f3188f312686de439a8a_238_2.png)'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 9.


    To add emphasis to some of the words in your text, create an HTML style to apply
    to the text. First, choose Window|HTML Styles to open the HTML Styles panel. Click
    on the New Style icon at the bottom of the HTML Styles panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_239_0.png)


    # 10.


    The Define HTML Style dialog box appears. In the Name field, type the style name
    WL 1 for the new style you wish to create. For the Apply option, choose Selection;
    this will limit the style''s application to a selected range of text. Leave the
    Clear Existing Style radio button selected; this is the default.


    ![](img/eb7bf63026b0f3188f312686de439a8a_239_1.png)


    # 11.


    Under Font Attributes, select the attributes you wish to apply. Select Georgia,
    Times New Roman, Times, serif from the Font drop-down menu. Select 5 from the
    Size drop down menu. In the Colorbox, enter #CC3333. For Style, click on Other,
    select Emphasis, and then click on OK. The new style you created is added to the
    HTML Styles panel. The "a" icon preceding the style name indicates that it is
    a selection style rather than a paragraph style.


    ![](img/eb7bf63026b0f3188f312686de439a8a_239_2.png)'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 12.


    In the Document Window, select the frame containing the text, select the portion
    of the text which you want to apply any new style.


    ![](img/eb7bf63026b0f3188f312686de439a8a_240_0.png)


    # 13.


    Select the new style in the HTML Styles panel. The selected text in the document
    displays the newly applied style.


    To undo the new style, select Edit/Undo Apply Style.


    ![](img/eb7bf63026b0f3188f312686de439a8a_240_1.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Project 3: Format Paragraph Text


    Now you are ready to format the text in your Web site. Using Dreamweaver''s paragraph
    formatting and alignment tools gives your site a uniform, orderly, and readable
    appearance. See Chapter 3 for more information on working with text.


    # Basic Paragraph Formatting


    First, assign heading and alignment options to your Web page text.


    # 1.


    Begin with the Dreamweaver text that has been created for the Web site you are
    working on. The file contains two types of text: headings and paragraph.


    ![](img/eb7bf63026b0f3188f312686de439a8a_241_0.png)


    # 2.


    Place the insertion point anywhere in the inline text. Choose Text|Paragraph Format
    and scroll down to choose a heading option (such as Heading 5, as shown).


    ![](img/eb7bf63026b0f3188f312686de439a8a_241_1.png)'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 3.


    Next, select a paragraph (or a series of paragraphs) and again scroll down the
    list of text options, selecting one (as Size). Continue these steps until all
    of the text is formatted as you wish. If you decide to remove a format applied
    from the Paragraph Format list, choose None.


    Choosing None as the format for a selected paragraph removes any paragraph formatting
    previously applied to that text. You may also want to apply this setting before
    typing new text into a document.


    # Text Alignment


    There are three choices for the alignment of HTML text: left aligned, right aligned,
    and centered.


    # 4.


    The default for HTML text is left aligned, with out indentation and a ragged right
    margin. Lines of text wrap wherever spaces appear.


    # 5.


    To change the text to right alignment, select the text you wish to realign and
    click the Align Right button in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_242_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_242_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_242_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_242_3.png)'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 6.


    Next, center text by clicking on the Align button in the Property Inspector.


    Center alignment is best used with heads and short sections of text; it is awkward
    and difficult to read in longer passages.


    ![](img/eb7bf63026b0f3188f312686de439a8a_243_0.png)


    # Indenting Text


    Indented text works within the limits of HTML formatting to differentiate sections
    of text. Indentation affects both right and left margins as well as the vertical
    space that text occupies (the text wraps to fit). It is applied in two-space increments.


    ![](img/eb7bf63026b0f3188f312686de439a8a_243_1.png)


    # 7.


    Select the text to be indented.


    ![](img/eb7bf63026b0f3188f312686de439a8a_243_2.png)


    # 8.


    Click the TextIndent button in the Property Inspector to indent the two spaces.


    ![](img/eb7bf63026b0f3188f312686de439a8a_243_3.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Creating a Simple Site


    # 9.


    To continue indenting, click on the button as many times as it takes for the effect
    you want.


    ![](img/eb7bf63026b0f3188f312686de439a8a_244_0.png)


    # Outenting Text


    Outenting reverses the effect of indenting, moving paragraph text outward toward
    the margins. As indenting, text is outented in two-space increments, and only
    text that is already indented can be outented.


    ![](img/eb7bf63026b0f3188f312686de439a8a_244_1.png)


    # 10.


    Select the text to be outented.


    # 11.


    Click the Text Outdent button in the Property Inspector to indent the two spaces.


    ![](img/eb7bf63026b0f3188f312686de439a8a_244_2.png)'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 12.


    By default, you won''t be able to outdent text past the margins.


    ![](img/eb7bf63026b0f3188f312686de439a8a_245_0.png)'
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Project 4: Add Bulleted and Numbered Lists\n\nNext, create lists to make\
    \ your Web pages more readable, which will help to encourage your visitors to\
    \ return to your Web site. \n\n# Bulleted Lists\n\nThe most common sort of list\
    \ you can add to a Web page is a series of items that are indented from the left\
    \ margin and marked by a solid-colored dot called a bullet. In the vocabulary\
    \ of Web pages, these are called unordered lists.\n\n# 1.\n\nBegin by typing your\
    \ list. Each list item should have a paragraph of its own, so press Enter (or\
    \ Return on a Mac) after each one. Don't press Shift+Return to create a line break.\n\
    \n> If your list items are more than a line in length, don't worry about indenting\
    \ or adjusting word wrap when you first enter the text. When you format the bulleted\
    \ list, Dreamweaver will do the indenting for you.\n\n# 2.\n\nHighlight the list\
    \ items you want to format. Be sure to exclude any text that isn't going to be\
    \ part of the list.\n\nUse the selection area near the left margin of the Document\
    \ Window to select multiple paragraphs all at once.\n\n![](img/eb7bf63026b0f3188f312686de439a8a_246_0.png)\n\
    \n![](img/eb7bf63026b0f3188f312686de439a8a_246_1.png)"
  merge: -1
  pgno: 246
- img_proc: true
  md: "# 3.\n\nOnce all the items in the list have been selected, choose Text|List|Unordered\
    \ List.\n\n![](img/eb7bf63026b0f3188f312686de439a8a_247_0.png)\n\n# 4.\n\nAs an\
    \ alternative to using the Text menu option described in Step 3, click on the\
    \ Unordered List button in the Property Inspector.\n\n# 5.\n\nWhen the selected\
    \ list item paragraphs are formatted as unordered lists, they each get a bullet,\
    \ and the line spacing changes from double to single spaced.\n\n![](img/eb7bf63026b0f3188f312686de439a8a_247_1.png)\n\
    \n+   * women's and men's clubs\n* women's and men's study groups\n* libraries\n\
    * corporate events\n* private parties\n* sorees\n* museums\n* senior citizens\n\
    * universities\n* high schools\n* \n\nThese performances will delight...\n\n#\
    \ 6.\n\nAs you can see, when the list shown in Step 5 was formatted, there was\
    \ an extra blank paragraph at the end. This, too, was formatted as a list item.\
    \ You can click on this empty paragraph and press Backspace to delete the paragraph\
    \ altogether. Or, select Text|List|None to cancel the Unordered List style for\
    \ this paragraph.\n\n![](img/eb7bf63026b0f3188f312686de439a8a_247_2.png)\n\n+\
    \   * women's and men's clubs\n* private parties\n* sorees\n* museums\n* senior\
    \ citizens\n* universities\n* high schools\n*"
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Creating a Simple Web Site


    Change List and Bullet Style

    By default, each item in an unordered list is marked by a solid round dot. You
    can change the appearance of the bullet with the help of the Property Inspector.


    # 7.


    To change the appearance of the unordered list as a whole, click on any item in
    the list. Choose Window|Properties or press Ctrl+F3 to make the Property Inspector
    visible. Click on the expander arrow in the lower-right corner to expand the inspector.
    Then click on the List Item button.


    The List Item button is highlighted only when the text cursor is positioned in
    a single list item, not when you select the entire list or a group of list items.


    ![](img/eb7bf63026b0f3188f312686de439a8a_248_0.png)


    # 8.


    When you click on the highlighted List Item button, the List Properties dialog
    box appears. The upper part of the dialog box affects the list as a whole. Select
    Square from the Style drop-down list, then click on OK. All the list items are
    now preceded by squares.


    You can also select Text|List|Properties to open List Properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_248_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_248_2.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 9.


    To change a single item in the list, position the text cursor in the item''s paragraph.
    Click on the List button to display the List Properties dialog box. Then select
    an option from the List Section of the List Properties dialog box. The bullet
    is changed, but only for that item.


    # List Properties


    ![](img/eb7bf63026b0f3188f312686de439a8a_249_0.png)


    # Nest a List


    You can place a list within another list. This is a great way to call attention
    to subcategories of information while keeping them easy to read. And there is
    additional benefit: When you create a "nested list," its items are assigned a
    different bullet style, which gives your Web page more visual variety.


    ![](img/eb7bf63026b0f3188f312686de439a8a_249_1.png)


    # 10.


    Position the text cursor at the spot in the list where you want to create a list,
    then type your first nested list item. Press Enter/Return, then enter the other
    list items as needed. Select all the items in the list that you want to nest.


    +   These performances will delight:

    - women and men''s clubs

    - women and men''s study groups

    - libraries

    - corporate events

    - annual meetings

    - community relief

    - private parties

    - museums

    - senior citizens


    Alternatively, you can type only one nested list item, then indent the item as
    described below in Step 11, then type subsequent nested list items without having
    to indent them.


    # 11.


    Click on the Text indent button in the Property Inspector or select Text|Indent
    to indent or "nest".


    If the items you want to nest have already been entered, you need to select only
    those items and indent them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_249_2.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 12.


    By default, the nested list bullet is a hollow bullet with a black outline. You
    can change the default nested list format by clicking on List Item and choosing
    a new bullet style, as deiscribed in the preceding set of steps.


    ![](img/eb7bf63026b0f3188f312686de439a8a_250_0.png)


    # 13.


    You can keep indenting a nested list. When you do, the bullet style changes again.
    To undo your indenting, select the nested list items, and then press the Outdent
    button in the Property Inspector or select TextOutdent.


    ![](img/eb7bf63026b0f3188f312686de439a8a_250_1.png)


    # Numbered Lists


    A numbered list (also called an ordered list) is usually used to illustrate a
    series of steps that occur in sequence, like the steps you''re following in this
    book''s projects. Dreamweaver makes creating them just as easy as it is to create
    bulleted lists.


    # 14.


    Begin by typing your list. Press Enter/Return after each item. The important thing
    is not to type the actual step number with each list item; Dreamweaver will assign
    numbers to the items.


    It''s a pretty common mistake to enter the numbers yourself and then create the
    numbered list, so that you end up with two numbers before each item. In that case,
    you can just press Backspace to delete the second number—the one you entered.


    ![](img/eb7bf63026b0f3188f312686de439a8a_250_2.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 15.


    Highlight the list items you want to format.

    Be sure to exclude any text that isn''t going to be part of the list.


    # 16.


    Once all the items in the list have been selected, choose Text|List|Ordered List
    or press the Ordered List button in the Property Inspector.


    # 17.


    When the selected list item paragraphs are formatted as ordered lists, each will
    get a number, and the line spacing changes from double to single spaced.


    Change Number Style


    By default, each item in an ordered list gets a regular number (1, 2, 3, and so
    on) followed by a period. You can use the Property Inspector to change the number
    style.


    # 18.


    Click on any item in the ordered list (don''t select items). Choose Window|Properties
    or press Ctrl+F (Cmd+F3 on a Mac) to make the Property inspector visible. Click
    on expand the expander arrow in the lower-right corner to expand the Inspector.
    Then click on the List item button.


    ![](img/eb7bf63026b0f3188f312686de439a8a_251_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_251_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_251_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_251_3.png)'
