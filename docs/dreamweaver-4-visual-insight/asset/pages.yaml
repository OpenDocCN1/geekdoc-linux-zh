    The page is now divided into two frames. The layout is updated in the Frames panel
    to show the two frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_313_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_313_3.png)'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Making Your Web Site Interactive


    # 6.


    You can continue in this manner to create as many frames as you wish. Note, however,
    the borders of frames generated this way run the full length or height of the
    page, producing a "patchwork" effect. You''ll learn how to create alternate layouts
    later in this project.


    ![](img/eb7bf63026b0f3188f312686de439a8a_314_0.png)


    # 7.


    Click and drag the left frame''s right border to resize the frame.


    ![](img/eb7bf63026b0f3188f312686de439a8a_314_1.png)


