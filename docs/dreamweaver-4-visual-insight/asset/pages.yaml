- img_proc: true
  md: '# Project 5: Add a Behavior


    In Chapter 9, you learned how to make a floating window appear when the viewer
    clicks on an object. Often, a Web''page is configured so that a pop-up window
    appears when a page is loaded. Typically, a page contains additional marketing
    or promotional information, such as announcements of new products. For example,
    at the time this book was written, Netscape Communications’ home page, www.netscape.com,
    displayed a pop-up window announcing the new version of its browser.)


    # Creating a Floating Window


    First, create the window that you want to float above the main one. Typically,
    such windows are smaller than the “main” ones which they float. The size will
    be specified in the following steps.


    # 1.


    Return to the frameset created in Project 2. Click on the left-hand frame to select
    it. Choose File|Save Frame As.


    Copying the frame enables you to “borrow” the background color so you can use
    it for the floating window. You could also choose Modify Properties to view the
    background color for the frame in the Properties dialog box and create a new page
    and assign it the same color.


    ![](img/eb7bf63026b0f3188f312686de439a8a_334_0.png)


    # 2.


    In the Save As dialog box, assign the page the new name “floater” and click on
    Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_334_1.png)'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Chapter 14


    # 3.


    Select File|Open or press Ctrl+O (Cmd+O on a Mac) to open the page you just created.
    Select the current content and press Del or Ctrl+X to cut it off so you can add
    new text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_335_0.png)


    # 4.


    Add images and text to your window. Select File|Save to save your changes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_335_1.png)


    # Adding the Behavior


    Once you have created and saved the floating window, switch back to the main page—the
    one over which the new window will float—and assign the behavior.'
  merge: -1
  pgno: 335
- img_proc: true
