  md: '# How Framesets Work


    In previous chapters, you learned how to use tables to organize Web-page content
    into rows and columns and how to add interactivity by creating links. Frames combine
    aspects of organization and interactivity, dramatically changing the look of Web
    pages and making an entire Web-site''s contents available to visitors.


    Frames are subdivisions of a single Web browser window. Each frame contains a
    Web document in its own right and has its own Uniform Resource Locator (URL).
    A page can be broken into as many frames as the designer wants, but typically
    only, two to four frames are used because frames make the page considerably more
    complex and slower in its entirety.


    # The Frameset File


    A group of frames is called a *frameset*. The name comes from the HTML command
    used to identify and lay out the individual frames, `<FRAMESET> /</FRAMESET>`.
    The tag gives the general layout of the frames. For instance, a simple HTML document
    that divides a page into two vertical frames would look like this:


    ```

    <HTML>

    <HEAD>

    <TITLE>Some Simple Frames</TITLE>

    </HEAD>

    <FRAMESET cols="200,\*>

    <FRAME SCROLLING="no" NORESIZE NAME="menubar" SRC="frames/menus.htm">

    <FRAME SCROLLING="yes" NAME="main" SRC="frames/main.htm">

    </FRAMESET>

    <NOFRAMES>

    If your browser does not support frames, you''ll see this alternate text:

    </NOFRAMES>

    </HTML>

    ```


    ![](img/eb7bf63026b0f3188f312686de439a8a_173_0.png)


    The resulting page is shown here. The left-hand frame presents the file "menus.htm",
    and the frame on the right presents "main.htm". The Web page that contains the
    frameset information shown above is a third separate document; a two-frame layout
    consists of three separate Web pages.


    The `<NOFRAMES> </NOFRAMES>` section of this HTML document contains alternate
    text that will be displayed by browsers that don''t support frames. Most recent
    browsers support frames, but a few early versions of Netscape Navigator and Microsoft
    Internet Explorer do not.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Creating a Frameset


    When it comes to creating a set of frames, two things can help you get started.
    First, draw a rough sketch of the frames layout you want out on a piece of good
    old-fashioned paper. Then check Dreamweaver''s prearranged frames layouts to see
    if the one you want is available—or if different one will work well. If you don''t
    see a preset layout you like, you can draw your own frames in the Document Window.


    # Using the Frames Menu Options


    Frames layouts tend to have similar forms, and you can quickly choose among Dreamweaver''s
    selection of common layouts by choosing Insert|Frames and then selecting an option
    from the submenu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_174_0.png)


    # Using the Objects Panel


    You can also access the selection of common frames layouts from the Objects panel.


    # 1.


    Select File|New or press Ctrl+N (Cmd+N) on a Mac to open a new blank page.


    # 2.


    Select Frames from the drop-down menu at the top of the Objects panel. A set of
    eight buttons appears, representing a common arrangement of frames. Click on one
    of the buttons to insert the corresponding arrangement quickly into the current
    page.


    Because so many different options exist for the layout of frames, it can be helpful
    to display text along icons in the Objects panel. Select Edit|Preferences to open
    the Preferences dialog box. Select Icons And Text from the drop-down menu next
    to Objects panel and click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_174_1.png)'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 3.


    For instance, if you click on the button labeled Left (or select Insert|Frames|Left),
    the Web page displayed in the Document Window is, in fact, a frame—a separate
    page with its own URL. Each column is, a separate frame. The divider that appears
    between frames in the Document Window appears as a simple dotted line. The Property
    Inspector displays the properties for the frameset you just created.


    # 4.


    To add content, click in one of the frames to position the text cursor. Then,
    type, insert an image, or paste content from another document. You need to add
    content separately to each frame you create. When you click in a frame, the Property
    Inspector displays text attributes so you can format any text you enter.


    Because each frame is a separate Web page in its own right, you can assign to
    different frames their own background colors so they stand out from one another.


    # 5.


    If you need to change the attributes of a frameset, click on the border on the
    edge of the Document Window.


    Click on the divider between the frames to select the entire frameset so you change
    the attributes of all the frames at once.


    ![](img/eb7bf63026b0f3188f312686de439a8a_175_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_175_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_175_2.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# 6.


    When you click on the border around the Document Window, the border takes on a
    dotted appearance to indicate that it is selected.


    # 7.


    To select one of the individual frames in your frameset, choose Window|Frames
    or press Shift+F2 to display the Frames panel. The frame is highlighted (look
    closely to the slightly darker border around the selected frame). The Property
    Inspector also has the frame highlighted.


    You can also change the border colors of each frame: Click on the box next to
    the expanded Property Inspector and choose a color from the color selection box
    that appears. The border color is applied to the currently selected frame.


    ![](img/eb7bf63026b0f3188f312686de439a8a_176_0.png)


    # 8.


    Once you''ve added some content, you need to save your frameset. Because you''re
    working on a Web page that has been divided into frames, you''ll notice some new
    options when you open the File menu. You have the option of saving the contents
    of the displayed frames, or the frameset. If you choose File|Save Frameset, you
    save only the frameset''s structure—not the contents of the component frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_176_1.png)


    Choosing Save Frameset enables you to save the frameset under a different name.
    Choose Save All Frames to save the contents of all displayed frames—be sure to
    choose this if you want to preserve any editorial changes to your frames.'
