  md: '# Project 2: Add a Library File to a New Template


    A Web-page template enables you to create a uniform set of new Web-page files
    with standard typography and color schemes. A template is created by choosing
    the same menu options or clicking on the same buttons you create any Web page,
    with the exception of editable regions—areas of a page you set aside to hold text.


    # 1.


    Open the site you want to work on, then display the Assets panel by choosing Window|Assets.
    Click on the Template icon to display any templates that are available for the
    site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_346_0.png)


    # 2.


    Click on the New Template button in the set of four buttons at the bottom of the
    Assets panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_346_1.png)


    # 3.


    A new template named Untitled appears at the bottom of the list of templates.
    Some helpful instructions appear in the top half of the Assets panel. Enter the
    name "Newpage" for your template and press Enter/Return to replace the highlighted
    file name Untitled.


    ![](img/eb7bf63026b0f3188f312686de439a8a_346_2.png)'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 4.


    The new template name Newpage is entered and placed in alphabetical order in the
    list of templates. Click on the Edit button at the bottom of the Assets panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_347_0.png)


    # 5.


    The blank template opens behind the Assets panel. Move or close the Assets panel
    so you can see the Template window clearly and begin to edit it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_347_1.png)


    # 6.


    Choose Modify|Page Properties to open the Page Properties dialog box. Specify
    background color #FFFFCC, the text color #993300, and margins of 6 pixels. When
    you''re finished, click on OK to return to the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_347_2.png)'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 7.


    Choose Insert|Image to add an image and Insert|Layer to add a layer to the template.


    ![](img/eb7bf63026b0f3188f312686de439a8a_348_0.png)


    # 8.


    Select Modify|Templates|New Editable Region or press Ctrl+Shift+V (Cmd+Option+V
    on a Mac) to add an editable region to your document.


    ![](img/eb7bf63026b0f3188f312686de439a8a_348_1.png)


