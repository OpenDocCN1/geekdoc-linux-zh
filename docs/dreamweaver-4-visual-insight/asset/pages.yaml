- img_proc: true
  md: '# Entering Radio Buttons and Checkboxes


    Next, enter some radio buttons and checkboxes to enable the viewer to specify
    one or more options in a series.


    # 13.


    For the next bit of information, Tell Us About Your Group, we expect the user
    to choose only one correct answer out of the choices given, so enter a heading
    and three radio button choices.


    ![](img/eb7bf63026b0f3188f312686de439a8a_306_0.png)


    # 14.


    For the following piece of information, Where Do You Meet?, the user may well
    choose more than one option from those presented; in that case, insert checkboxes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_306_1.png)


    # 15.


    While you are adding elements within the layout table, don''t be alarmed if some
    boxes or textual labels seem to get out of alignment. When you are finishing the
    elements, save your changes and preview the layout in the browser window to make
    sure that everything lines up.


    ![](img/eb7bf63026b0f3188f312686de439a8a_306_2.png)


    You can also check alignment while working in Dreamweaver by forcing the screen
    to redraw itself. Minimize the Dreamweaver window to a Taskbar button and then
    restore it to its previous size. Or, drag the Document Window so that it''s smaller
    than it would normally be, then drag it back out to its original size. This forces
    the screen to be redrawn, thus rearranging the contents.'
