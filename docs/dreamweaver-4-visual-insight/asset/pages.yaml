  md: '# Making Your Web Site Interactive


    # Project 3: Swap Images


    Dreamweaver features tools with which you can assign behaviors to images, including
    image swaps (which you learned about Chapter 9 and rollovers (which you learned
    about Chapter 4). The Swap Image behavior substitutes one file for another when
    a Web-page visitor passes a mouse over the image or clicks on it. This project
    discusses rollovers in more detail.


    # 1.


    In a Document Window, open a page that contains an image to which you''d like
    to assign a swap behavior. Choose Window|Behaviors to display the Behaviors panel.


    To avoid graphic distortion, it is best to swap images that are the same size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_328_0.png)


    # 2.


    Select the image to which you would like to assign the behavior and click on the
    plus sign (+) in the Behaviors panel; then scroll down the drop-down menu to Swap
    Image to select that option.


    ![](img/eb7bf63026b0f3188f312686de439a8a_328_1.png)'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 3.


    The Swap Image dialog box appears. From the list of images, select the one you
    wanted to replace with a swapped image. Click on the Browse button by the Set
    Source To text box and browse to select the "swap to" image file. Make sure that
    Preload Images and Restore Image onMouse boxes are checked. Click on OK to complete
    the process.


    ![](img/eb7bf63026b0f3188f312686de439a8a_329_0.png)


    # 4.


    The Behaviors panel updates to show the new behaviors associated with the selected
    image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_329_1.png)


    # 5.


    Choose File|Preview In Browser to open the page you''ve just altered in a browser
    of your choice. When you pass your mouse cursor over the image, you can see the
    action you''ve specified. Notice that the swapped image is restored to the original
    after the cursor has passed over it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_329_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_329_3.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_329_4.png)'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Project 4: Create a Simple Rollover Image


    A simple rollover is essentially an image-swap behavior that exchanges one image
    for another when a mouse cursor is passed over it. Rollovers are commonly used
    for navigation or command buttons on Web pages. In this project, you will create
    the two related button images that will be used in the rollover event that was
    set up in Dreamweaver.


    Button images may be created in any image-editing program, such as Fireworks or
    Photoshop. In this example, Photoshop was used to build the images.


    # 1.


    Open a new document in your image-editing program and specify its size as 72 pixels
    wide by 21 pixels high, with a resolution of 72 dpi. Fill the background with
    the color of your choice (in this example, a reddish brown was used).


    ![](img/eb7bf63026b0f3188f312686de439a8a_330_0.png)


    # 2.


    Add the text you wish to display on the button.


    If you work in layers and save the original file, you can use it as a template
    for other button images, including the second rollover image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_330_1.png)


    # 3.


    If you are not already working with Web-safe colors, convert the image to the
    Web-compatible Index color mode, using a Web-safe 216-color palette, and save
    or export the image as a GIF file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_330_2.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 4.


    Repeat Steps 1 through 3, altering the color of the button or its text to create
    the second rollover image.


    # 5.


    With a Web-page Document Window open in Dreamweaver, select the place where you
    want to insert your rollover and choose Insert|Image. Navigate to the image file
    you wish to insert and select it. Open the Behaviors panel by choosing Window|Behaviors.


    ![](img/eb7bf63026b0f3188f312686de439a8a_331_0.png)


    # 6.


    Display the Property Inspector by choosing Window|Properties and type a name for
    the image in the text window in the upper-left corner of the Property Inspector.


    # 7.


    With the rollover image selected, click on the sign (+) in the Behaviors panel
    and choose Swap Image from the drop-down menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_331_1.png)'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# 8.


    Select the image you want to use as the original image from the Images list. Click
    on the Browse to browse and select the swap image file. The new image''s file
    name appears in the Set Source text field. Check the Preload Images option box
    to prevent downloading delays when one image is replaced by another.


    ![](img/eb7bf63026b0f3188f312686de439a8a_332_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_332_1.png)'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 9.


    When the process described in Steps 5 through 8 is completed, the Behaviors panel
    updates to show the behaviors you have just specified. The Property Inspector
    also updates: You will notice that the Link text box displays the word “javascript”,
    indicating that Dreamweaver has applied this behavior to the selected images.


    ![](img/eb7bf63026b0f3188f312686de439a8a_333_0.png)


    # 10.


    Now comes the moment of truth! With your rollover behavior set up, choose File|Preview
    In Browser to open your page in a browser window and test the rollover. Does it
    work as expected?


    ![](img/eb7bf63026b0f3188f312686de439a8a_333_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_333_2.png)'
  merge: -1
