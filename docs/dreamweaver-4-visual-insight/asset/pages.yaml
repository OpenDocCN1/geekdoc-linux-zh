  md: '# Using Images on the Web


    One of the Web''s most important features is that it gives you the ability to
    display graphic images on Web pages to beautify, instruct, and serve as navigational
    devices. In Chapter 4, you learned some essentials on Web image formats and processes.
    In this chapter, you''ll learn to use Dreamweaver''s image-import and -manipulation
    tools to dress up your Web page with clip art, photos, and your own artwork.


    Because Dreamweaver does not include image-editing capabilities, it is necessary
    to use an external image editor—such as Adobe Photoshop or Macromedia Fireworks—to
    prepare your images for use on the Web. In these projects, you''ll learn techniques
    for creating and optimizing images for import to a Dreamweaver document. You will
    find supplementary illustrations in this book''s accompanying color section.


    # Project 1: Edit and Insert a Clip Art Image


    Although the vast majority of clip art may be used as is, you may want to alter
    or optimize an illustration for use on your Web page. In this project, you''ll
    learn processes for preparing an illustration for Web use.


    Macromedia Fireworks specializes in creating and optimizing images for Web use.
    In this section, you will explore some of the capabilities of Fireworks as you
    prepare a clip art illustration for export to Dreamweaver.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# 1.


    Open a clip art illustration in Fireworks by clicking on File|Open and choosing
    the art you want to work on. You can open and work on either a bitmap or a vector
    image. In this example, a vector-based EPS file has been opened in Fireworks.


    ![](img/eb7bf63026b0f3188f312686de439a8a_262_0.png)


    If you open a vector image, the Vector File Options dialog box will appear, prompting
    you to specify the size, resolution, and other attributes of the image. Stay with
    the default 72-pixel-per-inch resolution. Remember that vector images contain
    paths, which allow you to scale and alter the image''s shape in ways that bitmaps
    do not. Some of Fireworks''s features, such as effects, work only with vector
    images.


    # 2.


    Because this is a vector image, a Fireworks effect can be applied to enhance it:
    a drop shadow will give the flat illustration some depth. With the cat''s outline
    selected, choose Shadow from the Effects panel menu; a drop shadow with a feathered
    edge then appears behind the image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_262_1.png)


    # 3.


    The shadow''s characteristics (size, color, transparency, edge feathering, angle)
    can now be manipulated from the Shadow drop-down menu. Other Fireworks effects,
    such as Stroke and Fill, are controlled by similar menus.


    ![](img/eb7bf63026b0f3188f312686de439a8a_262_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_262_3.png)'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 4.


    When you are satisfied with the appearance of your edited image, export the image
    as a GIF file.


    You can facilitate the export process and obtain results by choosing Fireworks''s
    Export Wizard from the File menu. The wizard will walk you through the steps of
    optimizing and exporting the image to a Web-friendly file format, advising you
    along the way.


    ![](img/eb7bf63026b0f3188f312686de439a8a_263_0.png)


    # 5.


    Insert your image into a new Dreamweaver document by either choosing Insert|Image
    or clicking on the Insert Image button on the Objects panel''s Common panel. A
    dialog box opens, prompting you to navigate to the image and select it by clicking
    on Open.


    ![](img/eb7bf63026b0f3188f312686de439a8a_263_1.png)


    # 6.


    If your image was not stored in the root folder for the Web site you are building,
    Dreamweaver very helps you you dialog box offering to copy the image file into
    the root folder. Select this option and you won''t have to search for and copy
    the image again.


    ![](img/eb7bf63026b0f3188f312686de439a8a_263_2.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Adding Graphic Interest to Your Web Site


    # 7.


    With your image placed in Dreamweaver you can now adjust its size and position.
    To resize the image, click on it to select it; the border that appears has three
    resizing handles. To resize it uniformly, press the Shift key as you drag the
    lower-right handle.


    ![](img/eb7bf63026b0f3188f312686de439a8a_264_0.png)


    When resizing images, remember that a radical change in size can degrade its display
    quality. If it is to be enlarged or reduced by more than 20 percent, you''ll obtain
    better results if you resize the original image in the image-editing application
    with which you created it and then reintroduced it to your Dreamweaver editor.
    Edits made to Fireworks images are automatically updated in Dreamweaver.


    ![](img/eb7bf63026b0f3188f312686de439a8a_264_1.png)


    # 8.


    Paste or import a paragraph of text to go with your image. To align the image
    and text on the page, select the image by clicking on it. Choose Left from the
    Align drop-down menu in the Property Inspector to place the image''s left border
    flush against the left margin of the page; text will wrap around it to the right.


    ![](img/eb7bf63026b0f3188f312686de439a8a_264_2.png)


    > How do I find my lost pet?

    This question is related to thousands of people each year in Chicago. Chicago,
    annually over 20,000 animals are lost and their owners are left calling the local
    police station, animal shelters, and posting flyers in neighborhoods, placing
    ads in newspapers. Stray pets in Chicago are not re reunited with their owners
    unless a picture is repeated nationally over and over under the skin to be read
    by microchip numbers. Shelters that hold pets in the city of Chicago have implemented
    a program that ensures lost pets can be traced and returned back to you. All your
    pets, even your indoor-only pets, can be given this easy way out by microchipping.
    It is cheap, it is permanent, and it saves your pet life.


    ![](img/eb7bf63026b0f3188f312686de439a8a_264_3.png)'
  merge: -1
  pgno: 264
