  md: '# Project 5: Work with Code


    Once you have formatted your text, get a complete picture of your Web site''s
    content by looking behind the scenes and working with its HTML code.


    # Viewing Code


    First, change the way your code is displayed in Dreamweaver to make editing easier.


    # 1.


    Open the page you want to edit in the Document Window, then choose View|Code or
    View|Code Design—click on one of the corresponding toolbar buttons.


    ![](img/eb7bf63026b0f3188f312686de439a8a_254_0.png)


    # 2.


    To change the appearance of the page''s code, select Edit|Preferences to open
    the Preferences dialog box, then click on Format in the Category list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_254_1.png)


    # 3.


    Select different formatting options to change the appearance of the code on your
    page. Specify that tags will be displayed in lowercase and attributes in UPPERCASE.
    When you''re done, click on OK to close Preferences and view the changes in the
    Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_254_2.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Changing Code Colors


    One way Dreamweaver makes working with code less intimidating for beginners is
    light types of code in different colors. The default colors can be hard to read,
    however, so you should change them.


    # 4.


    In case you find the sections of the page difficult to read, change the highlighting
    system by choosing Edit|Preferences.


    ![](img/eb7bf63026b0f3188f312686de439a8a_255_0.png)


    # 5.


    When the Preferences dialog box opens, click on Code Colors. Click on one of the
    color boxes next to the type of page content you want to change (text, comments,
    etc.) and choose a color from the color selection box that pops up.


    ![](img/eb7bf63026b0f3188f312686de439a8a_255_1.png)


    # 6.


    To highlight a specific type of HTML tag, select the tag''s name in the Tag Specific
    section (in this case, "FORM\ click on the radio button next to the color box,
    and select the color you want to associate with the particular tag (green in this
    example, although it''s not readily apparent). Click on OK to view the changes
    in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_255_2.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Creating a Simple Web Site


    # The Quick Tag Editor


    Next, you can quickly adjust the code without having to change the Document Window—by
    using the Quick Tag Editor.


    # 7.


    Click on the text you want to edit. The HTML tags associated with that text are
    displayed in the Quick Tag Editor section at the far left of the Document Window
    status bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_256_0.png)


    # 8.


    In the Quick Tag Editor, right-click on the tag that you want to edit and choose
    Edit Tag from the context menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_256_1.png)


    # 9.


    The full HTML tag and attributes for the selected items are selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_256_2.png)'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 10.


    Change the part of the HTML you want to alter. If you let your mouse arrow hover
    over the element, a list of possible choices appears.


    # 11.


    Press Enter/Return to see the changes reflected in the Document Window.


    # Using the Reference Panel


    Dreamweaver makes it easy for you to edit the code that underlies your Web pages,
    but that doesn''t mean you have to know every detail about, for instance, HTML
    or Cascading Style Sheets.


    # 12.


    You already know that you can open the Reference panel by choosing Window|Reference.
    If you are in Code View or Design View, however, right-click on any tag and choose
    Reference from the context menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_257_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_257_1.png)'
