  md: '# Basic Tools


    Add a Launcher Button

    To add a button to the Launcher, select Edit>Preferences and then click on the
    Panels category. In the Panels preferences, click the plus sign button (+) above
    the list of buttons currently present in the Launcher. In the drop-down list that
    appears, the names of panels that currently appear in the Launcher are grayed
    out. Select a panel that isn''t grayed out to add that corresponding panel to
    the list.


    The changes you make to the Launcher in the Preferences window will affect the
    buttons in the Launcher bar as well. The buttons are the same on each component.


    ![](img/eb7bf63026b0f3188f312686de439a8a_58_0.png)


    # Remove a Launcher Button


    To remove a Launcher button, select the button you want to delete in the list
    of current buttons in the Panel Preferences window. Then click the minus sign
    (-) above the list of buttons. The selected option is removed from the list, and,
    when you close Preferences, the button will be gone from the Launcher.


    Select an option in the list of current buttons in the Preferences window, click
    on the up or down buttons, and you can rearrange the position of the selected
    button in relation to the others. The button at the top of the list appears on
    the far left on the Launcher and Launcher bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_58_1.png)'
