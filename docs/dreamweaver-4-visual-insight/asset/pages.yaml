    \ details that apply to the file as well. The casual visitor does not see the\
    \ Head information (unless he decides to view the source code for the page), it\
    \ can be viewed by programs that index Web pages for search engines. You can add\
    \ to the Head section keywords that make the page easier to find. You can also\
    \ make the page contents automatically redirect the viewer to another page after\
    \ a specified period by adding code to the Head section.\n\n```\n<html>\n  <head>\n\
    \    <title>Document</title>\n    <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=utf-8\">\n  </head>\n<body bgcolor=\"#######\">\n</body>\n\
    </html>\n```\n\n![](img/eb7bf63026b0f3188f312686de439a8a_66_4.png)"
  merge: -1
