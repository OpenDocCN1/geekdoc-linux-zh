- img_proc: true
  md: '# 5.


    Press Tab again and a text field appears beneath the item you just entered. Repeat
    Step 4 for all the items you want to appear in the list. Select an item and press
    the up or down arrow to change its position in the finished list/menu. When you''re
    finished, click on OK to close the List Values dialog box and return to the Dreamweaver
    window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_167_0.png)


    To delete a list item, click on it, then click on the minus sign. Add a new item,
