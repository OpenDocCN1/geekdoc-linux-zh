  md: '# The Color Wheel


    The color wheel is the traditional tool for making color-scheme choices, and it
    is a useful reference for the Web designer. This color wheel, based on the color
    spectrum, follows the same model as Dreamweaver''s HLS and HSV color pickers.
    Colors may be combined to produce various effects: analogous (or neighboring)
    colors used together can produce a subtle, harmonious composition; alternatively,
    complementary (or opposite) colors can produce an energetic or jarring effect.
    Warm colors advance and cool colors recede. The two combined on a Web page can
    create a multidimensional appearance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_214_0.png)'
  merge: -1
