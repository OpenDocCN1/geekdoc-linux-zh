  md: '# Directing Traffic on Your Web Site


    # Project 4: Add a

    Feedback Form


    In both business and personal Web sites, it’s useful to give visitors a way to
    submit information. Sometimes, the information can be relatively simple, such
    as a username and a password you’ve assigned the individual to access password-protected
    information. Other times, it’s extensive, such as information about a person’s
    background and needs.


    When the data-entry part of a form becomes complex, you can use tables or other
    Web page-formatting tools to arrange the form’s elements to fit a large amount
    of data entry information into a small space and still keep the form easy to read
    and use, as you’ll see in this project.


    # Importing a Template


    If the form you are creating for a Web site that has a standard design, it’s a
    good idea to create a Web page that contains colors and images that will be used
    consistently from page to page and then use it as a template (you do this by choosing
    File|Save As Template, as discussed in Chapter 10).


    # 1.


    Open the template by choosing File|New From Template.


    # 2.


    When the Select Template dialog box appears, click on the name of the template
    you want to use (such as WL Template), and then click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_302_0.png)'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 3.


    The template opens in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_303_0.png)


    # Adding a Heading and Text


    The heading of a form should be short and should explain clearly what you want
    from the reader. The heading does not have to be part of the actual form; it can
    be entered before you insert the form in your web page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_303_1.png)


    # 4.


    Select the placeholder Heading in the template and replace it with a heading for
    your form. Here, “Request a Performance” has been added.


    Don''t worry if the names of the editable regions in your template overlap the
    visible text. When you preview the page, the names won''t appear.


    ![](img/eb7bf63026b0f3188f312686de439a8a_303_2.png)


    # 5.


    Select the body text in the template and replace it with a paragraph that explains
    what you want the viewer to do in filling out the form. Click File>Save As to
    save the page with a new name so it''s no longer a template but a Web page in
    its own right. Then preview the page in the browser window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_303_3.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 6.


    Return to the Dreamweaver Document Window and press Enter/Return to enter a new
    blank line. Then choose Insert|Form to begin creating your request form.


    ![](img/eb7bf63026b0f3188f312686de439a8a_304_0.png)


    # Dividing the Form into Columns


    One way to organize your form so that all contents appear neat and aligned to
    divide the form into two or more columns by creating a table. This example illustrates
    a two-column table.


    ![](img/eb7bf63026b0f3188f312686de439a8a_304_1.png)


    # 7.


    While the text cursor is still positioned in the form you just created, select
    Insert|Table.


    ![](img/eb7bf63026b0f3188f312686de439a8a_304_2.png)


    # 8.


    In the Insert Table dialog box, specify a table with one row and two columns that
    take up 100 percent of the browser width. It''s important to keep the table border
    at 0 so that it isn''t evident you''re using a table to organize the form. Click
    on OK.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 9.


    The table appears within the form you are working on page.


