- img_proc: true
  md: '# How Web-Page Forms Work


    The form is one of the most important sources of interactivity on the Web. Forms
    allow an individual user to send information to a Web site by filling out text
    boxes and checkboxes or radio buttons and then clicking a Submit or similarly
    labeled button to transmit the information to a Web server. The data is then processed
    by a Common Gateway Interface (CGI) script that parses, or reads, and presents
    it (often by emailing it) to the Webmaster of the Web site so it can be read easily.


    # Data-Entry Elements


    Typical Web-page form elements include radio buttons, checkboxes, drop-down menus,
    text boxes, and other buttons. The appearance of these items is determined by
    the HTML commands used to create the page; Dreamweaver lets you create the basic
    data-entry part of the form without having to work with the HTML directly (unless
    you want to, of course).


    ![](img/eb7bf63026b0f3188f312686de439a8a_157_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_157_1.png)'
  merge: -1
  pgno: 157
- img_proc: true
  md: "# Processing the Data\n\nThe invisible part of any form is the CGI script that\
    \ is written in a language such as Perl or JavaScript and collects the data and\
    \ presents it to you in a readable form. For example, the form shown here can\
    \ be processed by associating it with the following script, which has the name\
    \ submit.cgi:\n\n```\n#!/usr/local/bin/perl\nprint \"content-type:text/html\"\
    ;\nprint \"\\$ENV{QUERY_STRING}\";\\n($name, $phone, $color) = \nsplit(/&/,\\\
    $ENV{QUERY_STRING});\n($LeftSideOfEqualSign, $username) = \nsplit(/=,\\$name);\
    \ ($firstname, \nsplit(/\\+,\\$username); =\n($LeftSideOfEqualSign, $phone) =\
    \ \nsplit(/=,\\$phone);\n($LeftSideOfEqualSign, $usercolor) = \nsplit(/=,\\$color);\n\
    print<<heredoc\n<html><title>The results</title>\n<body bgcolor=\"#ffffff\">\n\
    <b>Name:</b> $firstname $lastname</b><br>\nPhone: $phone<br>\nColor: $usercolor<p>\n\
    </body>\n</html>\nheredoc\n```\n\n```\nopen(FILE,\"*records/$usercolor.html\"\
    );\nprint FILE \"<b>Name: $firstname $lastname</b><br>\\n\";\nprint FILE \"Phone:\
    \ $phone<br>\\n\";\nprint FILE \"Color: $usercolor<p>\\n\";\nclose FILE;\n```\n\
    \nYou can identify the script you write by entering its file name in the Action\
    \ field of the Property Inspector. You can also use a number of ready-CGI scripts\
    \ you can find on the Web.\n\nCheck with your Internet Service Provider (ISP)\
    \ to make sure you can run CGI scripts on your server. The ISP will probably have\
    \ a location where you can run Perl (or another application) needed to process\
    \ the script. You'll need to make a reference, in the script, to the program.\n\
    \n![](img/eb7bf63026b0f3188f312686de439a8a_158_0.png)"
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Creating a Form


    Although Dreamweaver can''t help you write the CGI script that handles a form,
    it gives you a head start when it comes to designing the front end, which is the
    data-entry part of the form that the viewer uses to send data.


    # Finding Form Objects


    The place to start creating a form is the Objects-panel, which contains a complete
    set of objects you can add to a form to enable a user to enter data. Select Forms
    from the drop-down menu at the top of the Objects panel to display the form-related
    options you can use.


    You can insert form objects in one of three ways: you can click on the button
    in the Objects panel; you can select Insert|Form Object and choose a submenu item;
    or you can click on an Objects panel button and drag that button into the Document
    Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_159_0.png)


    # Creating a New Form


    You don''t have to be a programmer to create the Web-page form''s front end, which
    consists of the elements user fills out, clicks on, or chooses and finally submits
    to communicate with you. You can even design the form to be compatible with the
    design of the other Web pages on your site.


    In case you haven''t noticed, Dreamweaver''s own Property Inspector uses the same
    sorts of data-entry objects as a Web-page form, including radio buttons, text
    boxes, images, and so on.


    # 1.


    Position the text cursor at the point in the currently displayed Web page where
    you want the form to appear. Then click on the Insert Form icon in the Objects
    panel or choose InsertForm.


    ![](img/eb7bf63026b0f3188f312686de439a8a_159_1.png)


    You don''t have to make a form be the only thing on a Web page. A small form,
    such as a search box, can go anywhere in the middle of the contents of a page.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Constructing Forms


    # 2.


    A dotted red line appears (or should appear) around the spot where the form has
    been placed. If you don''t see the dotted line, select View/Visual Aids/Invisible
    Elements. All the data-entry elements that the user will see are contained within
    the dotted line.


    ![](img/eb7bf63026b0f3188f312686de439a8a_160_0.png)


    # 3.


    Click anywhere on the form outline to display it (if it isn''t displayed because
    you''ve been working on another part of the Web page, for instance). The Property
    Inspector displays a set of form options. You can enter a name in the Form Name
    field if you want to, though this is optional—such names are useful if the form
    data needs to be validated by means of a program written in JavaScript or VBA.


    ![](img/eb7bf63026b0f3188f312686de439a8a_160_1.png)


    # 4.


    +   - Specify the location of the CGI script that will process the form data.
    Either enter the URL of the CGI script relative to the Web page you''re working
    on or click on the folder icon next to the Action field in the Property Inspector
    to display the Select File dialog box. Locate the file and click on Select.


    Before you create your form, you need to write or obtain a CGI script; it doesn''t
    do any good to design a form without having a CGI script ready to process it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_160_2.png)'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 5.


    If you haven''t yet saved the Web page currently displayed in the Document Window,
    this dialog box appears. Click on OK to proceed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_161_0.png)


    # 6.


    Next, you need to choose a method that the user''s Web browser will use to transmit
    the data to a remote Web server. Select one of the three options—Default, GET,
    or POST—from the Method drop-down menu in the Property Inspector.


    The GET method causes the form data to be sent to the CGI script in the form of
    a URL—each form value is separated from others by a plus sign (+). The POST method
    encodes the material sent to the script. Check with your Web host or ISP to see
    which is preferred.


    ![](img/eb7bf63026b0f3188f312686de439a8a_161_1.png)


    # Common Data-Entry Elements


    Icons for the nine common data-entry elements used in Web page forms are arranged
    at the top of the Objects panel along with the Insert Form button. Position the
    cursor within the outlined box that represents the form you just inserted. Then
    insert elements as needed. The elements can be formatted like the other elements
    of the text—they can be aligned or placed on their own lines, and you can move
    them or remove them by choosing Edit|Cut and Edit|Paste.


    ![](img/eb7bf63026b0f3188f312686de439a8a_161_2.png)'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Constructing Forms


    When you click on the Insert Text Field button on the Objects panel, a text field
    appears. Using the set of options that appears in the Property Inspector when
    the text field appears, you can change the default number of characters the text
    field will accept (about 25 characters) and you can change other attributes


    ![](img/eb7bf63026b0f3188f312686de439a8a_162_0.png)


    If you enter some text in the Init Val field in the Property Inspector, that text
    will appear whenever visitors connect to your form.


    # Change Text Box Width


    The user can enter his name, address, or other textual information in a text field.
    It''s important to give the user enough room to write a full address, for instance.
    To change the box width, enter a new number in the Char Width box. If you want
    to limit the box so that the user can enter no more than a certain number of characters,
    enter that number in the Max Char box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_162_1.png)


    The text box options, and the options specific to other form elements, appear
    in the Property Inspector only when the element is selected. Usually, a dashed
    line appears around the element to indicate that it''s been selected.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Chapter 7.


    Create a Multiline Text Box

    If you want someone to send you a detailed text message, a single-line box isn''t
    enough. You can create a multiline text box by positioning the text cursor within
    the form, clicking on Insert Text Field, then clicking on the Multiline radio
    button in the Property Inspector. A box with a scrollbar appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_163_0.png)


    You can change the number of lines displayed in the multiline text box by entering
    a number (of lines) in the Num Lines box in the Property Inspector.


    Create a Password Box

    If you want visitors to type in a password in order to enter a protected area
    of your Web site, it''s a good idea to restrict their Web browser to enter asterisks
    (****) rather than visible characters as a security measure. Select the text box
    you want to turn into a password box. Click on the Password button in the Property
    Inspector. Press Enter/Return to create the password box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_163_1.png)


    Radio Buttons

    A radio button is a round button that displays a solid black dot in its center
    when a user clicks on it. Radio buttons are displayed in groups, and the user
    is usually allowed to click on only one button in the group. You can use buttons
    to have viewers answer Yes/No questions or to choose an answer (A, B, or C) from
    a multiple-choice question.


    I plan to use Dreamweaver for the following:

    Web page design E-commerce site Corporate site design'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Constructing Forms


    Position the text cursor at the point within the Web-page form where you want
    the button to appear and click on the Insert Radio Button in the Objects panel.
    You can add a textual label for the button by typing directly on the page where
    you want the button to appear, the label can be above or below the button or to
    the right or left of it.


    | A | B. | C |

    |---|---|---|

    | C | C | C |

    | age 12-21 | C |

    | age 22-31 | C |

    | age 32-41 | E |


    Different labeling options


    To add space between buttons or between a button and its textual label, insert
    a nonbreaking space by pressing Ctrl+Shift+Spacebar. Remember, also, you can cut
    and paste buttons (or other form objects) to reposition them.


    # Name a Button


    Don''t just name a button and leave it as is in the form. In order for the form
    to register results if the button is checked, you need to specify two parameters.
    First, set the name of the button (replace the default name “radiobutton” in the
    RadioButton box in the Property Inspector). Then, replace the default name “radiobutton”
    in the Checked Value box. These names identify the button and its checked value
    for the CGI script that processes the form.


    ![](img/eb7bf63026b0f3188f312686de439a8a_164_0.png)


    If you want a button to appear checked when the form is initially viewed, select
    that button, then click on the Checked button in the Property Inspector.'
  merge: -1
  pgno: 164
- img_proc: true
  md: "# Checkboxes\n\nCheckboxes differ from radio buttons not only in appearance\
    \ (they're square and marked with an \"X\" or a checkmark when selected) but also\
    \ in how they are used. The user can check more than one box in a group, which\
    \ is useful if you visitors have the chance to select several choices from a set.\n\
    \nCheck all that apply:\n\n+   - I grind my own coffee beans.\n- I drink soy milk.\n\
    - I have triedgrass and lived to talk about it\n- I do wear hemp\n\n# Insert a\
    \ Checkbox\n\nTo create a checkbox, position the text cursor at the appropriate\
    \ spot in the form, then click on the Insert Check button in the Objects panel.\
    \ The checkbox appears with a highlighted box around it indicating that it has\
    \ been selected. Press Ctrl+Shift+Space to add one or more nonbreaking spaces\
    \ after the box so you can add some identifying text.\n\nCheck all that apply:\n\
    \n+   - \n\n![](img/eb7bf63026b0f3188f312686de439a8a_165_0.png)\n\n# Name a Checkbox\n\
    \nThe Property Inspector options for naming a checkbox are similar to those for\
    \ naming a radio button. You have to replace the default text in the Checkbox\
    \ Name box with a new name, even if it is something as simple as A. The Checked\
    \ Value box should contain text that clearly identifies the user has chosen, such\
    \ as drinks_soy or is_married.\n\nIf you want the checkbox to appear checked when\
    \ the form first appears, then click on the Checked radio button in the Property\
    \ Inspector.\n\n![](img/eb7bf63026b0f3188f312686de439a8a_165_1.png)"
  merge: -1
  pgno: 165
- img_proc: true
  md: '# List/Menus


    A list/menu (also known as a drop-down menu), or less often as a pull-down menu)
    is a common element in many Web-page forms (and in Dreamweaver itself): click
    an arrow to the right of the menu and a set of options drops down. You click on
    one of the options from the list to select it; the option remains chosen even
    if you select other options in the same list.


    # 1.


    Position the text cursor at the point in the form where you want the menu to appear.
    Insert the menu by clicking on the Insert List/Menu button in the Objects panel,
    dragging the button into the Document Window, or by selecting Insert|Form Objects|List/Menu.
    A miniature drop-down menu appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_166_0.png)


    # 2.


    Click on the list to select it (a highlight box appears around the list to indicate
    that it''s selected). Choose Modify|Selection Properties to display the Property
    Inspector if it''s not already displayed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_166_1.png)


    # 3.


    Click on the List Values to display the List Values dialog box. This dialog allows
    you to name the menu options you want to appear when the user clicks on arrow
    next to the drop-down list. A text field appears beneath the heading with a blinking
    text cursor in it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_166_2.png)


    # 4.


    Enter an item that you want to appear in the drop-down list. Then press the Tab
    key and another highlighted text field appears beneath the Value heading. Enter
    a number that you want to represent the value of the list item—the number of value
    corresponds to the place in the list where the item will appear. If you want the
    item to appear at the top of the list, enter "1"; if you want it to be the second
    item, enter "2"; and so on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_166_3.png)'
