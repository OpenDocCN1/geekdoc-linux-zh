  md: '# Entering Text in a Layer


    A layer is a container that you can create on a Web page to hold text, images,
    or other content. Web-page layers of the sort you can create and edit with Dreamweaver
    are called dynamic because they can be moved around easily on the page—Dreamweaver
    enables you to stack layers on top of others, for instance. The design possibilities
    of layers are so powerful, although they are advanced HTML features, it makes
    sense to mention them briefly because they can improve the layout of text on your
    Web pages.


    # Create a Layer


    Select Insert>Layer from the Document Window''s menu bar to insert a layer at
    the upper-left corner of the window. The layer''s size is predetermined, but you
    can easily resize and position it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_88_0.png)


    # Select a Layer


    The small square near the upper-left corner of the layer is a selection handle.
    Click on it to select the layer. Eight black handles appear around the outline
    of the layer. In addition, the text cursor turns into a four-headed arrow when
    you pass over the layer.


    ![](img/eb7bf63026b0f3188f312686de439a8a_88_1.png)


    # Resize/Reposition a Layer


    To move a layer, click on the selection handle, hold down the mouse button, and
    drag the layer to another part of the Document Window. Release the layer when
    it''s where you want it to be. To resize a layer, click and drag on a handle.
    Drag out to make the larger layer; drag in to make it smaller.


    Layers can be located anywhere on a Web page; if you make the grid visible, you
    can use it to help position the layer precisely.


    ![](img/eb7bf63026b0f3188f312686de439a8a_88_2.png)'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Chapter 3


    # View Layer Properties


    The Property Inspector turns into a Layers Inspector when you select a layer.
    You can view the layer''s attributes in the inspector and assign a layer name
    other than the default Layer1, Layer2, and so on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_89_0.png)


    The problem with layers is that they are not supported by browsers earlier than
    Microsoft Internet Explorer 4 and Netscape Navigator 4. Visitors who try to view
    a page that uses layers won''t be able to see anything unless you create an alternate
    version of the page using tables. See Chapter 5 for more information on tables,
    and see Chapter 4 for layers.


    # Working with Type Fonts


    Specifying fonts in Dreamweaver or any other Web-page layout program isn''t as
    straightforward as it is in a graphics program because the Web pages you will
    create will be viewed in a Web-browser, not printed on paper. Nevertheless, you
    can control some aspects of text display, and they are easily specified by Dreamweaver''s
    text tools.


    # Choosing a Font


    The end user has control over how the body text and headings on a Web page are
    displayed. If you don''t specify a font, the user''s browser will use its default
    font to show your Web page contents. However, you can specify a group of fonts
    by choosing Font and selecting one of the groups from the drop-down list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_89_1.png)


    You can also access the list of font groups by clicking on the Font drop-down
    menu in the Property Inspector.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Working with Text


    Change the Font List

    If you have a font installed on your system that you would like to use on a Web
    page and that font does not appear in the FontList, select Text!|Edit Font List.
    Select one or more fonts from the list of the Edit Font List dialog box, click
    on the left-pointing arrows to move the font to the box in the lower left, and
    click on OK. The new fonts are added to your font list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_90_0.png)


    The short font list does not contain every font available on your system but is
    intended to suggest fonts you might use. By default, it does not contain single
    font names because you can''t control whether the viewer has the specified font
    installed on her computer. Rather, the list includes groups of fonts (fixed-width,
    sans-serif, or serif), so the viewer can find the most convenient match from her
    system.


    # Specifying Text Sizes


    Unless you use style sheets (see Chapter 10), you have to express font size using
    relative size designations rather than precise points. The viewer of your Web
    page has control over the base size of the body text. Usually this is 10, 12,
    or 14 points. You can, however, specify that the text is displayed in a size that''s
    relative to the user''s base font size by choosing Text|Size or by clicking on
    the Size drop-down menu in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_90_1.png)


    # Base Font Size


    The default base font size is 3; if you select 3, you probably won''t see any
    change in the Document Window. The sizes range from +7 to -7; +7 is 7 points larger
    than the base font; -7 is 7 points smaller.


    ![](img/eb7bf63026b0f3188f312686de439a8a_90_2.png)'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Assigning Text Styles


    To make selected text bold, italic, or underlined, select the text you want to
    format, select an option from the Text submenu.

    Many of the styles shown are logical styles—rather than telling a browser exactly
    what to do with the text (make it bold, italic, etc.), you can use a logical style
    such as Strong or Citation to let the browser decide how to format the text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_91_0.png)


    HTML Styles

    If you''ll be assigning the same styles to selected text in multiple locations
    on a Web page, choose Text|HTML StylesNew Style to define the HTML Style dialog
    box. You can create a style of your own that includes several text attributes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_91_1.png)


    Assign an HTML Style

    Assign a name to your style, and it is added to the Text|HTML submenu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_91_2.png)'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Assigning a Text Color


    To assign a color to an individual character, word, or other text segment, select
    Text|Color to display the Color selection dialog box for either Windows or Macintosh.


    ![](img/eb7bf63026b0f3188f312686de439a8a_92_0.png)


    # The Property Inspector Color Box


    You can also select text and use the Property Inspector to assign a color; click
    on the color box next to the Size drop-down menu, and the Color dialog box appears.
    Click on a color to select it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_92_1.png)


    # Other Common Text Features


    Now that you''ve learned how to do some basic text formatting, you''re ready to
    take the next step and perform functions that are common but more complex than
    simply assigning styles or changing font sizes.


    # Adding Special Characters


    Many important characters, such as the copyright symbol (©), cannot be reproduced
    in standard ASCII text. Rather, they have to be added to Web pages by using designated
    character sequences: &copy; for the copyright symbol, for example. Luckily, you
    don''t have to remember such sequences. You can insert special characters by accessing
    the Characters panel of the Objects panel. Click on the button corresponding to
    the special character you want to use to insert the item in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_92_2.png)'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Chapter 3.


    If you want to add extra space between characters or on a Web page, pressing the
    spacebar won''t work. You need to insert a nonbreaking space. Position the text
    cursor at the appropriate location, and then Insert|Special Characters|Non-breaking
    Space.


    ![](img/eb7bf63026b0f3188f312686de439a8a_93_0.png)


    # Use the Objects Panel


    You can also press the Insert Non-breaking Space button in the Invisibles section
    of the Objects panel to add a nonbreaking space.


    You can add multiple nonbreaking spaces, one after another, to create more space
    in your text. Once you add one space, use Edit/Redo or press Ctrl+Y to repeat
    the insertion.


    ![](img/eb7bf63026b0f3188f312686de439a8a_93_1.png)


    # Checking Your Spelling


    You don''t need to use your word processor''s spellchecker to ferret out textual
    mistakes before you create your Web pages in Dreamweaver. You can use Dreamweaver''s
    built-in utility to check the page currently displayed in the Document Window
    by selecting Text|Check Spelling or by pressing Shift+F7.


    ![](img/eb7bf63026b0f3188f312686de439a8a_93_2.png)


    # The Checking Spelling Dialog Box


    In the Word Not Found in Dictionary field in the Checking Spelling dialog box,
    Dreamweaver displays the first word it doesn''t recognize on the page you''re
    checking. Click ignore if you want to retain the current spelling. Click Ignore
    All to keep Dreamweaver from checking the same word if it appears again. Click
    on Change to change the spelling; you can use Dreamweaver''s suggestion in the
    Change box, or you can type your own word. Click on Change All to change all instances
    of the displayed word.


    ![](img/eb7bf63026b0f3188f312686de439a8a_93_3.png)


    66'
  merge: -1
