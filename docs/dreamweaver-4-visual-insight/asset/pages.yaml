  md: '# Your First Dreamweaver Session


    Dreamweaver is a powerful Web-site design and management program that lets you
    achieve complex and interactive Web-page effects without learning the technical
    languages that make those effects possible. Although you don''t necessarily have
    to learn HTML, JavaScript, or other programming languages, you do have to make
    an initial investment and familiarize yourself with Dreamweaver''s work environment.
    By learning how to use the program''s array of basic tools—including dialog boxes,
    menus, and buttons—you can tackle more advanced features that let you create complex
    design elements. Before long, you''ll be able to create Web sites that are as
    rich and well organized as sites created by any highly trained Webmaster.


    In this chapter, we''ll introduce you to the application interface. Then you''ll
    learn how to use the program''s three fundamental elements (windows, panels, and
    inspectors) and how to manage your desktop so you can view and easily find the
    tools you need. Finally, we''ll touch on the topic of customizing the most commonly
    used Dreamweaver settings.


    # Opening Dreamweaver


    After installing Dreamweaver, start the program by choosing: Start|Programs|Dreamweaver|
    Dreamweaver 4. When you open Dreamweaver for the first time, you will be greeted
    with the splash screen, which verifies that you''re the registered owner.


    On a Mac, double-click on the Dreamweaver icon to open the program.


    # Create a Shortcut


    If you plan to use Dreamweaver often want to start the program quickly from your
    desktop, create a desktop shortcut. Locate the Dreamweaver file (which has the
    name Dreamweaver.exe) in Windows Explorer or My Computer, right-click on its icon,
    and choose Create Shortcut from the context menu. Drag the resulting shortcut
    icon onto your desktop.


    On the Mac, select the Dreamweaver program icon in the Finder and select File|Make
    Alias (or press Cmd+A) to make an alias you can then drag onto your desktop.


    ![](img/eb7bf63026b0f3188f312686de439a8a_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Exploring the Interface


    After Dreamweaver has finished loading, you''re ready to begin creating Web pages
    and manipulating their component parts. The windows, panels, and toolbars open
    in different parts of your desktop. You''re first presented with a default set
    of elements, and you can rearrange them and add or subtract from a wide range
    of options when you get to know this program better. Don''t panic if you see more
    panels open on your screen or if they don''t match exactly the ones shown here.
    Later in this chapter, you''ll learn how to move, delete, or add windows. For
    now, we''ve selected and arranged the components you''ll probably find most useful:


    +   1. Document Window

    2. Objects panel

    3. Property Inspector

    4. Launcher


    ![](img/eb7bf63026b0f3188f312686de439a8a_32_0.png)


    # Windows


    Windows in Dreamweaver have toolbars, menu bars, and scrollbars and appear as
    buttons on the Windows Taskbar (or, on the Mac, as items in the Finder menu).
    The window you''re likely to use most often is the Document Window. This is where
    you do most of your work in Dreamweaver.


    ![](img/eb7bf63026b0f3188f312686de439a8a_32_1.png)


    # Literary Chicago


    Welcome to the Web for Literary Chicago: A Book Lover''s Guide to the Windy City,
    written by Greg Holden. Here you''ll find a collection of updates, corrections,
    and information to supplement your reading. |


    ![](img/eb7bf63026b0f3188f312686de439a8a_32_2.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Panels


    Panels, like the Objects shown here, contain menu options or buttons that let
    you format parts of a Web site. A panel has a close box and title bar no scrollbar
    You can grab the title bar to move the panel around. Panel components stay constant
    no matter what of a Web site you''re working on; an inspector''s contents change
    depending on the currently selected item.


    The Objects panel you see here is the same one shown earlier—it''s just been resized.
    You can resize panels or windows (not inspectors, however) by clicking on their
    edges or on their lower-right corner and dragging them in (to make them narrower)
    or out (to make them wider).


    ![](img/eb7bf63026b0f3188f312686de439a8a_33_0.png)


    # Inspectors


    An Inspector is a familiar item to users of Photoshop, PageMaker, and other design
    programs. It provides information specific to the currently selected Web-page
    object. If an image is selected, you see the Image Inspector. If a word or other
    textual element is selected, the Text Inspector appears with specs about the font
    being used (including font size) and with controls that let you change the settings.


    ![](img/eb7bf63026b0f3188f312686de439a8a_33_1.png)


    # Context Menus


    Another way to get information that is specific to a certain aspect of the Dreamweaver
    interface is to look at the context menu associated with the element. When you
    right-click (Windows) or Ctrl+click (Mac) on an element, a context menu pops up
    on the screen; it contains menu options that pertain only to that element.


    ![](img/eb7bf63026b0f3188f312686de439a8a_33_2.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Basic Tools


    Hold the mouse cursor over any icon for a few seconds. A tooltip message pops
    up to name the icon, and explanatory text appears in the status bar. Tooltips
    are helpful when you forget what a particular icon does or when you''re searching
    for the right function.


    ![](img/eb7bf63026b0f3188f312686de439a8a_34_0.png)


    # Invisible Elements


    Web pages, like word processors and other software, include formatting elements
    that are initially invisible and that indicate empty spaces, paragraph marks,
    line breaks, and other things. In Dreamweaver, you make the invisible elements
    appear by choosing View|Visual Aids||Invisible Elements.


    ![](img/eb7bf63026b0f3188f312686de439a8a_34_1.png)'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Formatting with the Document Window


    The Document Window is where most of the business of creating and editing Web-page
    content takes place in Dreamweaver. This window comes equipped with an extensive
    variety of tools, so this is an essential element to get know right from the beginning.
    The Document Window has 10 primary components:


    ![](img/eb7bf63026b0f3188f312686de439a8a_35_0.png)


    +   1. Title bar

    2. Menu bar

    3. Toolbar

    4. Rulers

    5. Status bar

    6. Quick Tag Editor

    7. Window Size indicator

    8. Download stats

    9. Launcher bar

    10. Content area'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Basic Tools


    Every Web-page file you work with in Dreamweaver—even untitled files that you
    haven''t yet begun to edit—are identified by information in the title bar at the
    top of the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_36_0.png)


    The following items are important parts of the title bar:


    +   - Dreamweaver logo

    - Title of the current page

    - Location of file/file name [in brackets]

    - Minimize/Maximize/Restore boxes


    > The title of a Web page is different from the file name. The file name is a
    short designation that you assign to the file and that appears in the Uniform
    Resource Locator (URL) that visitors use to locate the file with a Web browser.
    The title of the page appears in the title bar when the page is opened.


    # The Menu Bar


    Dreamweaver menu bar is located directly beneath the title bar and is similar
    to the menu bars you''ve used with other Windows programs. The menu options that
    are needed to create and format Web pages (such as Modify, Commands, and Site)
    will be covered in later chapters.


    ![](img/eb7bf63026b0f3188f312686de439a8a_36_1.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 1


    The Toolbar

    The toolbar appears just beneath the menu bar and contains the Title text box
    as well as buttons that control it is as well, just as you view the displayed
    document.


    ![](img/eb7bf63026b0f3188f312686de439a8a_37_0.png)


    From left to right, these buttons are as follows:


    +   * Show Code View—Clicking on this button displays the HTML code for the current
    page.


    Code View is useful for Web designers who are use to entering or editing the raw
    HTML for their Pages. In Code View, you not only view the HTML, you can edit it
    as well, just as you would type and replace text that will appear on the Web page
    itself.


    +   * Show Code and Design Views—This button splits the Document into two halves.
    The top half displays the code; the bottom half displays the Design View. (In
    Design View, text and images appear as they do in a browser window.) Make a change
    to the code, and you can instantly see the effect in the bottom half of the window.


    +   * Design View—If you are in Code View or Design View, press this button to
    return the Document Window to the original Design View.


    +   * Title Text Box—Enter a short, clear title for the current Web page in this
    box. The title you enter in the title bar for the page. The default title is Untitled.


    +   * File Status Menu—Use this button, which contains options that help you work
    collaboratively on a Web site. You can check files in and out from local and remote
    servers and use Design Notes to add comments and notes for your team.


    +   * Preview/Debug In Browser—Click on this button when you want to launch a
    browser and preview your how it will look so you can debug problems and make changes
    if necessary.


    +   * Refresh Design View—If you make a change to a page and it doesn''t show
    up immediately, click on this button to refresh the page so you can see the effects
    of any recent changes.


    +   * Reference—This button opens the Reference panel, which you can use to look
    information about HTML commands, JavaScript code, or style sheet instructions
    in case you forget exactly what command you need to achieve a particular effect.


    +   * Code Navigator—Click on this button to open the Code Navigator menu, which
    contains options for editing code elements as scripts. If you have added Javascript
    to a page, for example, you can insert a breakpoint that tells a browser to stop
    executing code at that point.


    +   * Options Menu—This button, which contains options for hiding or displaying
    frame or table borders, rulers, the grid, or any other visual aids.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Rulers and a Grid


    Although it is impossible to achieve perfection when designing Web pages, Dreamweaver
    gives you a high degree of control when it comes to positioning, images, or other
    elements. That control comes from the rulers and from a grid of vertical and horizontal
    lines. You display these positioning aids by choosing View|Rulers and View|Grid,
    respectively. Each of these menu options has a submenu of options to let you control
    zero points and other settings.


    ![](img/eb7bf63026b0f3188f312686de439a8a_38_0.png)


    Status Bar

    This strip at the bottom of the Document contains lots of useful information about
    the file you''re working on. It also contains a set of controls (the Launcher
    bar) that lets you open other windows and panels.


    ```

    <body><p><img></body>

    ```


    Here are the main components of the status bar:


    +   * Tag Selector—The HTML tags control the formatting of the currently selected
    contents appear in this area on the left side of the status bar.

    * Window Size Indicator—This area displays the size of the current window in pixels.
    Click on the size to display a drop-menu window with standard window sizes you
    can select to configure the current page.

    * Download Stats—This area of the status bar keeps track of how complex your Web
    page is getting by telling you the size of the page in kilobytes (K) plus the
    time it would take to download the entire page with 28.8Kbps modem.

    * Launcher bar—This set of buttons on the right-hand side of the status bar lets
    you open (or launch) different Dreamweaver windows and panels. The buttons toggle—click
    once to open a window, the Launcher bar opens (from left to right) the Site Window,
    the Assets panel, the HTML Styles panel, the CSS Styles panel, the Behaviors panel,
    the History panel, and the Code Inspector.

    * Resize Handle—Click and drag this standard Dreamweaver element to resize the
    Dreamweaver window. (Watch the Window Size indicator numbers change as you do
    so.)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Select Tags


    Depending on where the text cursor is positioned in the current page in the Document
    Window, different HTML tags appear in the tag selector. Click on an image, `<body>`,
    `<img>`, and other tags. You can also click on one of the tags to select relevant
    parts of the currently displayed Web page. Selecting the `<body>` tag causes the
    entire body of the Web page to be highlighted, for instance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_39_0.png)


    # The Document Window Size


    The Window Size indicator not only indicates the current size of the Document
    Window, it can also be used to select a new size. Click on the small arrow to
    the right to open the Window Size drop-down. A set of predetermined sizes appears.
    When you pick a size, the current page readjusts to fit the dimensions


    When designing Web pages, it''s important to remember that those who view your
    work won''t necessarily have a 17-inch or larger monitor. You should also keep
    in mind that viewers can resize browser windows to make them smaller than their
    monitor''s viewing area. To tailor your Web pages so that most viewers will be
    able to see your content, choose a standard size such as 800x600 pixels.


    ![](img/eb7bf63026b0f3188f312686de439a8a_39_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_39_2.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# The Launcher Bar


    As you''ll see when you first start Dreamweaver, this is a program with an array
    of windows, panels, and inspectors. To keep your desktop workspace cluttered,
    you can close each of these components by clicking their individual box. You can
    deselect or select a window, panel, or inspector from the Window menu. The Launcher
    bar provides a quick, convenient way to close and open components as needed. It
    is a set of buttons that appears near the right edge of the status bar. Because
    the Launcher bar is a miniature version of the Launcher, the two components are
    discussed later in this chapter.


    To find out what the Launcher bar buttons, let your mouse arrow hover over each
    so you can see its tooltip. The Launcher bar is ideal for use when the Launcher
    is closed. You can use the two together, but you can also use the Launcher alone.
    To close the Launcher bar, choose Edit|Preferences (or press Ctrl+U) to open the
    Preferences window, click on the Status Bar category, and uncheck the box next
    to Show Launcher bar in the status bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_40_0.png)


    # Content Area


    The content area is where you view and edit the contents of the Web-page document
    or the Web site you are working on. Because Dreamweaver is a WYSIWYG (What You
    See Is What You Get) editor, the contents closely approximate how the page will
    appear in a Web browser window. The left margin, the usual text cursor changes
    to an arrow. When the arrow is visible, you can click once to select the adjacent
    line and triple-click to select the adjacent paragraph. Click, hold down your
    mouse button, and scroll up or down to select a group of paragraphs or images.


    ![](img/eb7bf63026b0f3188f312686de439a8a_40_1.png)'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Using the Property Inspector


    In many Web-page editors, you can format text or images by selecting menu options:
    You click on a menu, select an option, possibly slide your mouse arrow to a submenu
    option, open a dialog box, then select options from the dialog box. Finally, you
    click on OK to make the changes. Dreamweaver streamlines this process considerably
    by giving you constant access to the formatting options on the Property Inspector.
    The options available on the inspector vary depending on what''s being selected.
    For example, different options are available for text, images, or clickable hotspots.


    | Format | Heading 2 | Default Font | Size | None | | | |

    |---|---|---|---|---|---|---||}{

    | Link | | | | | | |


    Some important options common to each of these elements of the Property Inspector
    are discussed here:


    +   * Drag Bar—Drags the Property Inspector to a new location.

    * Close Box—Closes the inspector.

    * Point To File—Opens a link to a local file.

    * Browse—Opens a navigation window in which you can browse your computing resources
    for a file or object.

    * Help—Opens a browser window containing detailed explanations of each of the
    elements in the current Property Inspector.

    * Quick Tag Editor—Opens a window that displays the HTML for the currently selected
    element so you can edit the code if you want to.

    * Expander Arrow—Makes the Property Inspector larger to display additional options
    you may need.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Basic Tools


    When you click on the Expander arrow, the Property Inspector displays new options
    depending on the inspector you''re working with. The options for the Text Property
    Inspector, shown here, are pretty prettier. The List Item button appears; it''s
    highlighted only when an item in a list has been selected, and you can use it
    to change the format of bullets or numbers. But the options for images and tables
    are more extensive. Click on the Expander arrow in the "enlarged" version of the
    inspector to return it to its original size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_42_0.png)


    # View Image Properties


    With the options for the Image Property Inspector, you can specify properties
    for an image such as height and width, alignment, and spacing. In the image here,
    the small version of the Image Property Inspector is shown on top, the expanded
    version below. covered in detail in Chapter 4.


    ![](img/eb7bf63026b0f3188f312686de439a8a_42_1.png)


    # Using the Objects Panel


    The Objects panel presents you with a selection of shortcut buttons that enable
    you to insert common items quickly into the Web page you''re working on. To add
    an image, a horizontal rule, or an entire table to the current page, either click
    on the button or drag the button into the Document Window. The object will be
    added at the insertion point.


    ![](img/eb7bf63026b0f3188f312686de439a8a_42_2.png)


    The Objects panel doesn''t appear by default in the Launcher bar, but you can
    add a button for this component by changing panel preferences, as described later
    in this chapter.


    ![](img/eb7bf63026b0f3188f312686de439a8a_42_3.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Chapter 1


    # Add Common Objects


    By default, the buttons that appear in the Objects panel are a set of common Web
    items (as you can see by the heading “Common” near the panel''s title bar). Depending
    on what you''ve selected, a dialog box may appear asking you to specify a file
    or provide information about what you''re adding, such as the number of rows or
    columns of a table you want to create.


    Dreamweaver gives you the option of adding an object without having a dialog box
    appear when it normally would. The object will function as a placeholder on the
    Web page you''re editing so you can add it later. Hold down Ctrl (or, on the Macintosh,
    Option key) while clicking the button or dragging it into the Document Window.
    In many cases, the object will be added without a dialog box (exceptions are navigation
    bars, frames, and Flash buttons).


    ![](img/eb7bf63026b0f3188f312686de439a8a_43_0.png)


    # Stretch the Panel


    By default, the Objects panel is a thin, vertical panel. You can adjust the shape
    to fit your available desktop space. Pass your mouse-over any of the four edges
    of the panel. When the usual single-pointed arrow turns into a double-pointed
    arrow, click and hold the mouse button, then drag the window-out or in to give
    it a new shape.


    ![](img/eb7bf63026b0f3188f312686de439a8a_43_1.png)


    The Layout and View areas of the Objects panel help streamline the process of
    laying out a Web page with table cells. These are discussed later in this chapter
    and in Chapter 5.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Basic Tools


    You can change the contents of the Objects panel from the default common objects
    to other sets of elements by clicking the arrow next to the word "Common" and
    choosing another option. If you are creating a Web-page form, select the Forms
    option. If you''re dividing a page into frames, select Frames. The Character option
    lets you select special characters, which are symbols and elements such as copyright
    symbols that, in HTML, are represented by a hard-to-remember series of characters.
    Rather than having to look up the characters and type them in, you can click a
    button in the Characters Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_44_0.png)


    If you''re working with a small monitor, or you just don''t like having a lot
    of panels open on your desktop, you can also insert objects by choosing options
    on the Insert menu. Some options, such as Form Objects, have submenus that present
    you with more specific options.


    ![](img/eb7bf63026b0f3188f312686de439a8a_44_1.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Viewing Other Panels


    The Dreamweaver panels described so far are the ones you''re most likely to use,
    but they''re by means the only ones available to you. Other panels will be described
    throughout this book; some are shown here:


    ![](img/eb7bf63026b0f3188f312686de439a8a_45_0.png)


    +   1. Objects

    2. Reference

    3. History

    4. Document Window

    5. Property Inspector

    6. Launcher bar

    7. Code Inspector

    8. Behaviors


    The following sections provide quick overviews some of the more useful Dreamweaver
    panels.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# The Assets Panel


    When the time comes to update a site or move its files from one directory to another,
    it can be difficult to keep track of all of the site''s assets—tables, images,
    and other recurring elements. The Assets panel gives you one place to view all
    of the recurring elements in a site so you can update them all at once, ensuring
    consistency throughout your site. Click on one of the list of elements of that
    type (templates, Flash buttons, images, and so on) in the bottom part of the panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_46_0.png)


    # The Reference Panel


    Select Window>Reference to access a reference library that explains HTML and JavaScript
    commands, and comes with a set of references ready to use. Select an option from
    the Tag drop-down menu, then select an option from the Description drop-down menu
    to get more specific information.


    ![](img/eb7bf63026b0f3188f312686de439a8a_46_1.png)


    # The Behaviors Panel


    You can use the options on the Behaviors panel to make your Web sites more interactive.
    Select an object such as a navigation bar button in the Document Window, then
    select a behavior from the Behaviors panel to associate that object with an event
    such as a menu popping up or an image linking to another element in the Web site.
    See Chapters 9 and 14 for more information.


    ![](img/eb7bf63026b0f3188f312686de439a8a_46_2.png)'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# The HTML Styles Inspector


    Choosing Window|HTML Styles or clicking the HTML Styles button in the Launcher
    displays the HTML Styles Inspector, which provides you with a place to select
    common HTML styles that you can apply. Other tabs in the HTML Styles Inspector
    contain Cascading Style Sheet (CSS) styles or behaviors you can select.


    The Selection Style and Clear Paragraph Style options are especially useful. They
    let you "erase" any formatting that''s been applied to currently selected text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_47_0.png)


    # The History Panel


    Creating and editing Web sites involves many repetitive tasks. You can "replay"
    tasks, speeding up your work, by using the History panel. This panel displays
    a list of all the steps you''ve performed in the active document since you created
    or opened the file. You can redo actions you performed earlier and even create
    shortcuts to automate repetitive tasks.


    Don''t be surprised if some actions are missing from the History panel; you won''t
    see actions you performed in other frames, in other Document Windows, or in the
    Site Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_47_1.png)


    # Managing Your Desktop


    With all its inspectors, windows, and panels, Dreamweaver is optimally used on
    a large desktop, so a 19-inch or 21-inch monitor is ideal. Even, you are likely
    to have Web browsers, word processors, or open windows. If you can manage your
    desktop efficiently, you''ll find what you want more easily, speeding up your
    work. In this section, we''ll describe some common techniques for making Dreamweaver''s
    components fit your work habits and available desktop space.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Basic Tools


    One way to bring order to your desktop is to click on each open panel''s title
    bar/drag bar and drag it to a new location. You can choose Window|Arrange to tell
    Dreamweaver all open windows and panels—they snap into place around the edges
    of the desktop.


    You can use Window menu options to arrange open panels quickly. Choose Hide Panels
    or press F4 to conceal all open panels (the Document Window remains). The Hide
    Panels option then becomes Show Panels, which causes any "hidden" panels to reappear.


    ![](img/eb7bf63026b0f3188f312686de439a8a_48_0.png)


    # Stack Panels


    Another way to arrange panels is to drag them around so they are stacked on top
    of the other.


    ![](img/eb7bf63026b0f3188f312686de439a8a_48_1.png)


    Minimize Windows

    Choosing Window|Minimize All doesn''t affect just the panels you have open. It
    reduces all open Document windows and panels to a button on the Windows toolbar
    (or, on the Mac, the Finder menu). On Windows, Minimize All option does the same
    thing as clicking the Minimize button in the title bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_48_2.png)


    Choosing Window|Restore reopens any Document windows that you have previously
    minimized to the Taskbar.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Snap Panels


    When you''re dragging a panel and it comes close to another, the one you''re dragging
    snaps into place adjacent to the stationary one. When you drag a panel or window
    near the boundary of your monitor''s visible area, the component snaps itself
    in place.


    ![](img/eb7bf63026b0f3188f312686de439a8a_49_0.png)


    # Dock Panels


    A slick way to save panel space is to combine, or dock, two or more separate panels
    so they become separate tabs in a single panel. Most panels in Dreamweaver can
    be docked—that is, combined into a single floating panel with multiple tabs. Drag
    one panel on top of another one to dock them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_49_1.png)


    The Launcher, Property Inspector, and Site Window cannot be docked.


    ![](img/eb7bf63026b0f3188f312686de439a8a_49_2.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Customizing Your Work Environment


    Just as Web pages are tailored to reflect the style of the person or business
    they describe, Dreamweaver can be customized to fit your working style. In addition
    to altering the look and feel of the Document Window, you can make subtle, internal
    alterations to personalize the panels, HTML or JavaScript display, and many other
    features. In the following sections, we''ll cover the most common alterations,
    optimizations, and tweaks. (It is good to be familiar with their preferences from
    the beginning.)


    # Opening Program Preferences


    Most of the customization options for the Dreamweaver interface can be found (by
    pressing Ctrl+U) to open the Preferences dialog box, which controls Dreamweaver''s
    application options. This dialog box includes a list of customization options;
    we''ll cover the most common ones here.


    ![](img/eb7bf63026b0f3188f312686de439a8a_50_0.png)


    # The Preferences Window


    The Preferences dialog box has two main components. On the left is a list of Dreamweaver
    features. When you click on one in the list, a set of controls appears on the
    right.


    If you don''t understand all of the Preferences options, click on the Help button.
    Dreamweaver''s Help window opens to an explanation of the options that apply to
    the currently selected feature''s preferences.


    ![](img/eb7bf63026b0f3188f312686de439a8a_50_1.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# General Program Preferences


    The General Dreamweaver preferences are divided into two sections. The top section''s
    options control how files are handled. Open Files In New Window controls whether
    Web pages open in a separate Dreamweaver Document Window; leaving this option
    unchecked means the new file will replace the old one in the same window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_51_0.png)


    Update Links When Moving Files tells Dreamweaver how much control it should have
    over links when a file is moved from one directory to another. When you choose
    Always, Dreamweaver updates links automatically; Prompt tells Dreamweaver to alert
    you when a link needs to be updated. Never is dangerous—if you choose this option,
    links might not be updated.


    ![](img/eb7bf63026b0f3188f312686de439a8a_51_1.png)


    The second part of the General Preferences window controls how Dreamweaver helps
    you edit files. The Objects drop-down menu controls how items appear with text
    captions only, text and images, or images only.


    ![](img/eb7bf63026b0f3188f312686de439a8a_51_2.png)


    The three options for the Objects panel are shown here.


    ![](img/eb7bf63026b0f3188f312686de439a8a_51_3.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Fonts/Encoding Preferences


    The Fonts/Encoding preferences let you specify the default Fonts Dreamweaver will
    use to display body, heading, and other text. During editing, you can select and
    specify font sizes and attributes, but these edits apply to the text you have
    just specified. The preferences settings control how text appears before you start
    editing.


    ![](img/eb7bf63026b0f3188f312686de439a8a_52_0.png)


    Proportional fonts are typically used for body text and headings, whereas fixed-width
    fonts are used for computer code that you want to display in the text of your
    Web page. The HTML Inspector option lets you select the font to be used in the
    HTML Inspector panel.


    > This is a proportional font.


    > This is a fixed font.


    The fonts that are displayed in the drop-down list in the Text Property Inspector
    represent only a short list of fonts that you''re likely to use most often, rather
    than a complete list of all fonts in your system. If you don''t see the particular
    font you like, you can edit the drop-down list to include your preferred font.


    # Changing the Default Font List


    # 1.


    In the Property Inspector, click on the arrow next to Default Font to display
    the font list. Select Edit Font List.


    ![](img/eb7bf63026b0f3188f312686de439a8a_52_1.png)


    # 2.


    The Available Fonts scroll box in the Edit Font Window lists the fonts that are
    available on your system. Scroll down the list and click on a font name to select
    it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_52_2.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 3.


    Click on the arrow button to move the selected font to the Chosen Fonts list—the
    ones that appear in the Property Inspector font list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_53_0.png)


    # 4.


    Click on OK to close the Edit Font List window, and check the list of fonts in
    the Property Inspector to see the addition.


    # Customizing Document Window Preferences


    The Document Window is where most of the Web-page editing action takes place in
    Dreamweaver. You can customize a number of Document Window elements.


    # View the Document Grid


    Choose View|Grid to bring up the Grid submenu, which you use to show or hide the
    grid or change grid settings.


    ![](img/eb7bf63026b0f3188f312686de439a8a_53_1.png)'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Basic Tools


    When you choose Edit Grid from the Grid submenu, the Grid Settings dialog box
    appears. You can control the appearance and spacing of grid lines as well as whether
    objects should snap to the grid.


    ![](img/eb7bf63026b0f3188f312686de439a8a_54_0.png)


    # Change Ruler Settings


    Choosing View|Rulers brings up the Ruler submenu, with which, as you might expect,
    you can customize ruler settings. The ruler markings can be in pixels, inches,
    or centimeters.


    ![](img/eb7bf63026b0f3188f312686de439a8a_54_1.png)


    # Adjust the Zero Point


    The crosshair box located at the point where the vertical and horizontal rulers
    meet controls the zero point. To move the zero point, click on the box and drag
    down and into the content area.


    ![](img/eb7bf63026b0f3188f312686de439a8a_54_2.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Chapter 1


    # Restore the Original Ruler Origin


    You can either choose View|Ruler|Reset Origin or right-click on the zero point
    box and choose Reset Origin from the context menu to restore the original ruler
    settings.


    ![](img/eb7bf63026b0f3188f312686de439a8a_55_0.png)


    # Customizing Status Bar Preferences


    As described earlier in this chapter, the status bar presents you with an array
    of controls that help you launch editing tools and keep track of the current Web
    page''s contents and window size. With so many resources, you need to be able
    to customize them; the following sections describe how.


    # Change Download Stats Settings


    The default settings in the download stats area are based on the average user''s
    Internet connection speeds, and you should change them to fit your own situation.
    If you are designing Web pages for the World Wide Web, the default setting—the
    average Internet connection speed of 28.8—is a good indicator to follow. If you''re
    designing pages to be viewed within your organization on an intranet, however,
    you can assume that users will be connecting at high speeds such as 1.5Mbps, and
    you should change the preferences.


