  md: '# Finalizing Form Actions


    Simply creating data-entry elements won''t do any good if you forget to include
    a button that submits the user''s data to a remote location so it can be processed
    by a form handler.


    # 24.


    ![](img/eb7bf63026b0f3188f312686de439a8a_309_0.png)


