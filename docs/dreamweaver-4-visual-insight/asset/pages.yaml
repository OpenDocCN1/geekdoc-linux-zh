  md: '# Creating a Predefined Frameset with the Frames Objects Panel


    Dreamweaver makes it easy to create a frameset quickly with a selection of predesigned
    framesets. The frames icons in the Objects panel provide thumbnail views of the
    layouts available to you.


    # 9.


    Select Frames from the drop-down menu at the top of the Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_315_0.png)


    # 10.


    Click inside the Document Window to make it active. Then select the frameset you
    want to create from the Frames panel and click on its icon.


    ![](img/eb7bf63026b0f3188f312686de439a8a_315_1.png)


    # 11.


    The borders of the frameset you chose can now appear in the Document Window. You
    can now alter or delete these frames as you would the frames you created by clicking
    and dragging.


    ![](img/eb7bf63026b0f3188f312686de439a8a_315_2.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Making Your Web Site Interactive


    # Selecting Frames and Framesets


    In this part of the project, you''ll learn to select frames and framesets in order
    to make them available for modification.


    # 12.


    With a document open, make the Frames panel visible by choosing Window|Frames.
    Activate the Property Inspector by choosing Window|Properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_316_0.png)


    # 13.


    To select a frame, click inside its representation in the Frames panel. Notice
    that the frame''s outline turns from gray to black in the Frames panel. To select
    the entire frameset, click on its outline in the Frames panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_316_1.png)


    # 14.


    Check the Property Inspector and you''ll see that it has changed to display the
    name and properties of the selected frame. As you''ll learn in the projects that
    follow, you can alter many of the frame''s characteristics from within the Property
    Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_316_2.png)'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 15.


    You can also select a frame in the Document Window by clicking on the frame''s
    border. A dotted line will appear around the frame, and its representation in
    the Frames panel will be highlighted, letting you know it''s selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_317_0.png)


    # Modifying Frames and Framesets


    For the purposes of this Web-page design, we are going to alter the structure
    of the frames by splitting them and changing their individual characteristics.
    Dreamweaver gives you the tools to do this.


    ![](img/eb7bf63026b0f3188f312686de439a8a_317_1.png)


    # 16.


    Begin by setting the frameset properties. Select the frameset by clicking on its
    border, either in the Frames panel or in the Document Window. The Property Inspector
    changes to show the frameset''s current properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_317_2.png)


    # 17.


    Click on the Borders drop-down menu and scroll down to select Yes. This sets the
    frameset''s borders to display as 3D bars in a browser. In the Border Width text
    box, type "10" (pixels). Click on the Border Color box and select a color from
    the palette. The results of your choices will appear in the Document Window.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# 18.


    Set the proportions of the frames in the frameset with the Value box at the bottom
    of the Property Inspector Type "25" into the box and experiment with choosing
    different units of measurement by clicking on the Units row button, scrolling
    through the drop-down menu, and selecting Pixels, Percent, and Relative; notice
    the result with each. Then select Percent as your Unit.


    ![](img/eb7bf63026b0f3188f312686de439a8a_318_0.png)


    # 19.


    Click on the thumbnail graphic in the lowerright corner of the Property Inspector
    to select a different row or column within the frameset to which to apply a unit
    of measurement. Select Relative from the Unit menu, specifying that a browser
    will fill the remaining space in a window with that frame.


    ![](img/eb7bf63026b0f3188f312686de439a8a_318_1.png)


    # Dividing a Frame into Multiple Frames


    When you want to open new areas to display content on your Web page, Dreamweaver
