- img_proc: true
  md: '# Frames


    Using frames means more than one Page can be displayed at the same time. This
    combination of frames, the frameset, can be useful for keeping a navigation bar
    or a company logo constantly in view while other content changes, providing multiple
    links to other pages in the Web site or other sites, while displaying images that
    the user can choose from a menu. Dreamweaver offers a selection of preformatted
    framesets to choose from, or you can create or modify your own—as shown in Chapters
    8 and 14.


    All of the images shown on this page, in addition to showing frames, feature several
    treatments of text, images, and colors.


    ![](img/eb7bf63026b0f3188f312686de439a8a_226_0.png)


    The company logo on top and the navigation bar on the left remain constant when
    the rest of the content changes.


    The links in the righth frame allow the user to jump to another page in the Web
    site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_226_1.png)


    These two examples show what happens to one frame''s contents after the user clicks
    on different links in a menu contained in a separate frame.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# # Rollovers


    Rollovers are simple JavaScript animations produced by swapping one image for
    another; when

    pass your mouse arrow over the original image, it turns into something else. Once
    you have

    created the original images in an image-editing program, Dreamweaver imports the
    images,

    tracks their locations, and applies and tests the behaviors applied to them.


    The examples on this page show "before" and "after". In the first example, notice
    how

    the text changes from white to yellow when you click on it. In the second example,
    the brain

    acquires a fiery glow. In the third example, the word seems to light up.


    See Chapters 4 and 14 for more information on creating rollers.


