- img_proc: true
  md: '# Insert Head Tags


    One way to add Head tags is to use the Objects panel. Select Head from the drop-down
    list at the top of the panel. The Head objects appear—as a common Head section
    tag, such as the ones for keywords, page descriptions, or refresh information.
    Position the cursor in the Head area in Code View, then click on the Objects panel
    button to add the tag you want.


    ```

    <html>

    <head>

    <title>Untitled Document</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="keywords" content="woman, history, biography">

    <meta name="Description" content="dramatizations of the lives of famous women
    brought to life by actresses">

    </head>

    ```


    # Cleaning Up Your Code


    You don''t have to be an expert in HTML, JavaScript, or XML to create Web pages
    with Dreamweaver. But if you do find yourself having to edit code, you can get
    help from the Web editor in at least two places. You can display the Reference
    Panel and look up the meaning or usage of a particular command. You can also choose
    Commands>Clean Up HTML to open the dialog box. Select an option and click on OK
    to have Dreamweaver clean up specified code that''s redundant or unnecessary.


    | | | |

    |---|---|---|n| | Empty Tags | |

    | | Redundant Tags | |

    | | Non-Dreamweaver Comments | |

    | | Dreamweaver Comments | Help |

    | | Specific Tags | |


    +   - Options: Combine Nested tags when Possible

    - Show on Completion


    # Specify an External Editor


    If you''re more comfortable working with a text editor or another program to edit
    your code, you can configure Dreamweaver to work with that program. Choose Edit>Edit
    External Editor (or press Ctrl+E) to open the Preferences window in the File Types/Editors
    category. Click on Browse, select the program you want to use, double-click on
    the program''s icon, and then click on OK to close Preferences.


    | File Types / Editors | |

    |---|---|

    | General | Open in Code View: *.html |

    | Code Format | | |

    | Code Highlighting Elements | | |

    | CSS Styles | | |

