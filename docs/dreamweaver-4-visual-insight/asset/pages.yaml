    # Choosing Color Schemes for Readability


    Color choice can dramatically affect the character and readability of a Web page.
    Use analogous colors for a relaxed, friendly appearance. Similarly, contrasting
    values of color lend a subtle, elegant look. With too much contrast in hue or
    tone overpower graphic elements and make your text difficult to read. You will
    find much more about using color and preparing graphics in Chapters 4 and 12.


