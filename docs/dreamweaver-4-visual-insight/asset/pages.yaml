  md: '# Adding Drop-Down Lists and Menus


    In the request form we are creating, we need to enable prospective clients to
    make a single selection to define the size of their audience.

    Additionally, prospective clients need to define the day of the week when they
    want to request a performance. The perfect form option in this case is a drop-down
    listbox or menu.


    # 16.


    To create a menu, first type a heading; then press the spacebar and select InsertForm
    Object|List/Menu. A miniature menu appears in your form.


    ![](img/eb7bf63026b0f3188f312686de439a8a_307_0.png)


    # 17.


    Select the list and click on the List Values button in the Property Inspector
    to display the List Values box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_307_1.png)


    # 18.


    Enter a group of values, pressing Tab to move from field to field. (Here, we''ve
    entered 0-10, 11-20, 21-30, 31-40, 41-50, and more than 50.) When you''re finished,
    click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_307_2.png)


    # 19.


    Select File|Save to save your changes and preview the page to test your drop-down
    menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_307_3.png)'
