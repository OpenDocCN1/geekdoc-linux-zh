  md: '# Project 2: Scan, Edit, and Insert a Photo


    Preparing a photo for Web use means working with a bitmap image. In this project,
    you will scan an original photo, optimize it for the Web in an image-editing application,
    and place it into a Dreamweaver document. You''ll then add a border to augment
    the image''s appearance.


    # 1.


    Scan your photograph in RGB (red, green, and blue) mode, at a high enough resolution
    to capture good detail. You can save the file in any format that is compatible
    with the image editor you''ll be using. In this example (in which Fireworks is
    used), Photoshop, JPEG, GIF, and TIFF are all good file format choices.


    ![](img/eb7bf63026b0f3188f312686de439a8a_266_0.png)


    # 2.


    Modify the image size. Adjust the image''s vertical and horizontal dimensions
    (in most cases, as here, choose Constrain Proportions to resize the image uniformly
    and to avoid distortion). As you do, also adjust the image''s pixel dimensions
    to 72 ppi for Web compatibility at the smallest file size. Under Print Size, set
    Resolution to 72 and choose Pixels/Inch from the drop-down menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_266_1.png)


    Fireworks will adapt your image''s color range to a Web-safe palette of 216 colors
    automatically. You can do this in Photoshop and other image-editing programs,
    by selecting a Web-compatible color table for it. See this book''s accompanying
    color section for comparisons among various types of color images.


    | Image Size | | |

    | --- | --- | --- |

    | | 96 | Pixels |

    | | 170 | Pixels |

    | Print Size | | |

    | | 1.333 | Inches |

    | | 2.365 | Inches |

    | Resolution: 72 | Pixels/Inch |'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 3.


    Fireworks offers several viewing options, which can be accessed by clicking the
    tabs on top of the Document Window. The default Original tab shows the unaltered
    image in Fireworks native PNG format. Preview displays the image altered by the
    application of effects and optimization settings. The 2-Up and 4-Up tabs (shown
    here) display the original image alongside multiple alterations, allowing you
    to choose the look you want.


    ![](img/eb7bf63026b0f3188f312686de439a8a_267_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_267_1.png)


    # 4.


    When you have explored all the options and are ready to export the image, the
    Export Wizard will help you to choose the format and settings. The Export Preview
    dialog box further aids the process by showing several optimization possibilities
    and related information, such as file size and download time. Here, a JPEG format
    is chosen for export.


    ![](img/eb7bf63026b0f3188f312686de439a8a_267_2.png)'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Adding Graphic Interest to Your Website


    # 5.


    Bring the image into Dreamweaver by clicking on the Insert Image button in the
    Objects panel or by choosing insert|Image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_268_0.png)


    # 6.


    Frame the image and set it apart from the surrounding page by placing a border
    around it. To do this, select the image. In the Property Inspector''s Border box,
    enter a border width of 3 pixels and click outside the Property Inspector; a border
    appears around the image.


    In general, a narrow border, from 1 to 6 pixels, creates the best appearance on
    a Web page; borders greater than 12 pixels in width tend to look clumsy. Dreamweaver
    matches the default frame color for a document to the default text color, which
    may be set in the Page Properties dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_268_1.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Project 3: Create a Logo


    One way to overcome the limitations inherent in HTML-coded text is to treat key
    text areas as images. In this way, you can give a unique treatment to headlines,
    mastheads, banners, and section dividers on your Web pages. In this project, you
    will create a logo out of type in an illustration program, optimize it for Web
    use in an image-editing program, and place it into a Dreamweaver document as a
    prominent element.


    # 1.


    Begin with a vector-based type design (in this case, created in Adobe Illustrator).


    ![](img/eb7bf63026b0f3188f312686de439a8a_269_0.png)


    # 2.


    Import the design into an image-editing application (Adobe Photoshop is used here)
    as an RGB bitmap image.


    ![](img/eb7bf63026b0f3188f312686de439a8a_269_1.png)


    # 3.


    In Photoshop, convert the image to indexed color by choosing Image|Mode|Indexed
    Color. Convert the image''s colors to a Web-friendly palette by choosing Image|Mode|Color
    Table and the Web option.


    ![](img/eb7bf63026b0f3188f312686de439a8a_269_2.png)'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# 4.


    Because this logo is to appear on the Web page superimposed over a background
    color, it needs to be anti-aliased to avoid an awkward-looking "halo" of white
    around the logo''s edge. By filling the logo''s back-ground with the Web-safe
    color used in the Web page''s background.


    ![](img/eb7bf63026b0f3188f312686de439a8a_270_0.png)


    # 5.


    Choose File|Export|GIF89a. When the GIF Export dialog box appears, select the
    background color as the transparent one. You can make additional colors transparent
    by holding down the Shift key as you select other colors in the thumbnail image.
    Save the new GIF file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_270_1.png)


    # 6.


    Open a new Dreamweaver Document Window and change the background color to the
    one used in Step 5 by choosing Modify|Page Properties and selecting a swatch from
    the Background drop-down palette.


    ![](img/eb7bf63026b0f3188f312686de439a8a_270_2.png)'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 7.


    Import the logo image by clicking on the Insert Button on the Objects panel and
    then navigating to the image file, selecting it, and clicking on Open.


    ![](img/eb7bf63026b0f3188f312686de439a8a_271_0.png)


    # 8.


    Position the inserted image and resize.


    ![](img/eb7bf63026b0f3188f312686de439a8a_271_1.png)


    # 9.


    Note that the logo''s outline stands out sharply against the background color,
    thanks to the transparent GIF effect.


    ![](img/eb7bf63026b0f3188f312686de439a8a_271_2.png)'
  merge: -1
