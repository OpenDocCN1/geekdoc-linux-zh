  md: '# Dividing Pages into Frames and Columns


    What do you do when you want to create a layout that''s not provided for in one
    of the eight “shortcut” layouts? You can drag frames into a page to drag your
    own custom layout.


    # 1.


    Open a new blank Web page or an existing Web page.


    It doesn''t matter whether the page you “draw” frames on has already been divided
    into frames; you can draw new ones in addition to the existing ones.


    ![](img/eb7bf63026b0f3188f312686de439a8a_178_0.png)


    # 2.


    Choose View|Visual Aids|Frame Borders.


    ![](img/eb7bf63026b0f3188f312686de439a8a_178_1.png)


    # 3.


    An extra border appears around the edge of the Document Window. Click on the border
    to highlight it with a dotted line.


    ![](img/eb7bf63026b0f3188f312686de439a8a_178_2.png)


    # 4.


    Click and hold down on any one of the four sides of the frames border. Drag the
    border of the Document Window to a new location and let go. You''ve now divided
    the Web page into two separate frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_178_3.png)'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 5.


    Repeat Step 4 by clicking and dragging on other sides of the border around the
    Document Window to create new frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_179_0.png)


    # Modifying Frames Layouts


    Without a Web editor like Dreamweaver, changing the look of frames would be a
    complex matter. You''ve had to alter the size of frames in either pixels or percentages
    of screen width, searching through an HTML file to find the correct tags or attributes
    to modify. Dreamweaver gives you user-friendly visual aids you can use to make
    frames look exactly the way you want them to.


    # Dragging a Divider


    Probably the simplest modification you can make to a set of frames is to click
    on one of the dividers and drag it to a new location, thus enlarging or reducing
    the size of adjacent frames.


    When the mouse arrow passes over a frame divider, it turns into the two-headed
    arrow. This tells you you''re in the right position to click on the divider and
    move it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_179_1.png)


    # Viewing Frames Properties


    Dreamweaver gives you two tools for viewing (and thus being able to modify) the
    settings that apply to individual frames within a frameset: The Frames panel and
    the Property Inspector.


    # Open the Frames Panel


    You can view the Frames panel any time by choosing Window|Frames or pressing Shift+F2.
    If a page hasn''t yet been divided into two or more frames, you''ll see only a
    single frame displayed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_179_2.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Dividing Pages into Frames and Columns


    # View Frames Properties


    If the Property Inspector isn''t displayed, select Window|Properties to display
    it. Simply clicking in the frame and choosing Modify|Selection Properties doesn''t
    display the frame properties. To see those, press Alt and click in the frame (or,
    on a Mac, press Option+Shift and click in the frame). Once you have a frame''s
    properties displayed in the Property Inspector, you can change the frame''s appearance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_180_0.png)


    You can view frames properties in the Property Inspector only for a page that
    has been divided into two or more frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_180_1.png)


    # Change Margin Height and Width


    The Margin Height box affects the space between the top and bottom frame borders
    and their contents. The Margin Width box affects the space between the left and
    right frame borders and the contents. Enter a number (in pixels) in either box
    to change the default settings (which is about 12 pixels in each).


    Be sure to click the expander arrow in the lower-right corner of the Property
    Inspector if you need to see the full set of properties, including Margin Width
    and Margin Height.


    # Increase Margin Size


    When you enter a margin height or width greater than 12 pixels, the margins increase
    accordingly.


    ![](img/eb7bf63026b0f3188f312686de439a8a_180_2.png)'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Decrease Margin Size

    When you enter a margin height or width smaller than 12 pixels, the margin decreases.
    Notice that there is always a built-in top margin, even if you set margin height
    to 0.


    # Adding Scrollbars


    Scrollbars are important features of frames whose contents do not display completely
    in the viewer''s Web browser window. When additional contents are present, the
    viewer can scroll down the frame''s individual vertical and horizontal scrollbars
    and read them. The question facing the Web designer is: Under what circumstances
    will the scrollbars appear?


    # Specify Scrollbar Status


    The Scroll drop-down menu in the lower area of the expanded Property Inspector
    determines under what circumstances scrollbars will appear in the currently selected
    frame. You can choose one of four options:


    +   - Yes—This means the scrollbars appear under any circumstances, no matter
    what the length of the frame''s contents.

    - No—This means scrollbars will never appear in the frame.

    - Auto—This means the frame will show scrollbars only when they are needed—when
    the contents are too long to appear in the browser.

    - Default—This means the browser''s default settings will be used, and the default
    settings are usually Auto.


    ![](img/eb7bf63026b0f3188f312686de439a8a_181_0.png)'
  merge: -1
  pgno: 181
