    # 6.


    When you click on the arrow next to your drop-down list, the menu items you just
    entered appear—in the expanded Property Inspector, not in the Document Window.
    Although the drop-down list is a little bigger than before, you don''t see the
    list items actually displayed until you preview the page. If you need to edit
    the list, highlight it and click on List Values again to display the List Values
    dialog box, in which you can make your changes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_167_1.png)


    Click on the Allow Multiple checkbox in the Property Inspector if you want users
    to be able to select more than one option. Change the default value (1) in the
    Height box if you want the list to display more than one line at a time.'
