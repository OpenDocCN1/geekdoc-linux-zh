  md: '# Adding Design Notes


    Whether you work in a group and need to communicate extra information about a
    Web page you''ve created for your co-workers, or whether you just need a place
    to keep your notes so you can find them later, you''ll enjoy using Dreamweaver''s
    Design Notes feature.


    Design Notes can include documentation about how a Web page was created, information
    on your style, or comments about what marketing factors influenced your design
    decision.


    # Selecting the Site


    To add notes to a site or template within a site, choose Site|Define Sites to
    open the Define Sites dialog box. Click on the name of the site which you want
    to attach notes, then click on Edit.


    ![](img/eb7bf63026b0f3188f312686de439a8a_207_0.png)


    # Enabling Design Notes


    When you click on Edit, the Site Definition [name of site] dialog box appears.
    Check the Maintain Design Notes box if it isn''t checked already. (If it is checked,
    don''t check it). If you want to share your notes with other members of a workgroup,
    check the Upload Design Notes For Sharing box. Click on OK to close the Site Definition
    dialog box, and then click Done in the Define Sites dialog box to return to the
    Site Window.


    # Open the Design Notes Dialog Box


    To actually create the notes, you can either choose File|Design Notes from the
    Document Window while the file to which you want to attach the notes is displayed,
    or in the Site Window, you can select a file and choose File|Design Notes. The
    Design Notes dialog box appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_207_1.png)'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Managing Your Web Site


    # Create the Notes


    In the Design Notes dialog box, type your notes in the Notes box. Choose an option
    from the Status drop-down menu (Draft, Beta, Needs-Attention, and so on) to designate
    the status of the file, if you want to. Check the Show File Is Opened box to make
    the notes appear when someone opens the file to work on it. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_208_0.png)


    If you check Show When File Is Opened, the Design Notes dialog box will open first
    whenever the file is opened in the Document Window. The user has to read the notes
    and click on OK to close the dialog box before actually beginning to work on the
    file.


    # Publishing Files


    Publishing, in terms of the World Wide Web, is the process of moving your files
    to a Web server where they can be viewed by anyone with a Web browser, either
    on an intranet or on the world Internet.


    Before you publish your files, it''s essential to test them in different browsers
    to make sure all links work correctly and all images appear.


    # Working with a Remote Site


    Often, when you publish your files by moving them from your computer to a directory
    on a remote server, use a File Transfer Protocol (FTP) program as WS_FTP or Cute
    FTP for Windows or Fetch for the Macintosh. When you use Dreamweaver to publish
    your files, you won''t have to install and use a separate program; does the moving
    for you.


    ![](img/eb7bf63026b0f3188f312686de439a8a_208_1.png)


    To configure Dreamweaver to connect to a remote site using FTP, you need to know
    the address of the FTP site, your username and password, and the name of the directory
    to which you connect.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Identify a Remote Site


    Begin by identifying the site you want to publish. Choose Site Define Sites from
    the menu bar in either the Site Window or the Document Window. Select a name,
    then click on Edit to Remote Info. Click on FTP from Access drop-down menu to
    display a new set of FTP options in the Remote Info area of the dialog box.


    | Category | Remote Info |

    | :--- | :--- |

    | Local Info | |

    | Access Notes | Access: Name

    | Design Notes | None

    | Site Map Layout | FTP: https.com

    | File View Columns | Local/Remote Database

    WebDAV |


    # Enter FTP Information


    Enter the FTP information for your remote site, as provided by your Web host,
    or if you are publishing on an intranet, your network administrator. Click on
    OK to close the Site Definition dialog box and return to the Define Sites dialog
    box. Click on Done to close Define Sites box and return to the Site Window.


    | Category | Remote Info |

    | :--- | :--- |

    | Local Info | |

    | Design Notes | Access: FTP

    | Site Map Layout | FTP Host: https.com

    | File View Columns | |

    | Host Directory | Login: enabled

    | Password | [ ] Use FTP

    [ ] Use Firewall (in protection)


    You don''t need to add a protocol name as ftp:// in FTP Host box. If you''re not
    sure what directory name to enter in the Host Directory box, leave it blank. The
    Save checkbox next to the Password text box is automatically checked when you
    fill in a password. This enables Dreamweaver to remember your password so you
    don''t have to reenter it when you subsequently reconnect. Need to check the Check
    In/Out box only if you are working on a file with a team.


    # Connecting to the Remote Site


    Once you have entered your remote site''s information and closed Define Sites,
    Dreamweaver automatically attempts to connect to the site, and the Connecting
    To [site name] dialog box appears. Click on Cancel only if you don''t want to
    connect at this time. Otherwise, Dreamweaver will complete the connection.


    ![](img/eb7bf63026b0f3188f312686de439a8a_209_0.png)'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Managing Your Web Site


    View a Remote Site''s Contents

    When the connection is made, the remote site''s contents appear on the left side
    of the Site Window. The message “Connected to [siteite name or folder name]” appears
    in the status bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_210_0.png)


    Upload Files

    Uploading is the process of moving files from your computer “up” to a remote server
    via the Internet. To use Dreamweaver''s Site Window to move files from your computer
    to the remote site, you must first display the files you want to move in the Local
    Folder area of the Site Window and select the folder to you want to move the files
    in the Remote Site part of the Site Window. Select the files you want to move,
    then click on the Put File(s) button in the Site Window toolbar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_210_1.png)


    If you need to create a folder in the remote site or on your local directory,
    click on the folder that you want to contain the new folder, then choose File>New
    Folder or press Ctrl+Alt+Shift+N (Cmd+Shift+Option+N on a Mac).


    Download Files

    Downloading is the process of moving files from a remote server “down” to your
    own computer via the Internet. Select the files you want to download in the Remote
    Sites panes of the Site Window, then click on the Get File(s) button.


    ![](img/eb7bf63026b0f3188f312686de439a8a_210_2.png)'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Synchronize Files


    Once you have a local version of the site on your own computer and a remote site
    on the Internet, you''ll probably update files on the local site and upload them
    to the remote one. Dreamweaver can help streamline the process of synchronizing
    the two sites. First, identify the newer version of the site by choosing either
    Edit|Select Newer Local or Edit|Select Newer Remote. Dreamweaver will compare
    the dates of the files contained in the sites displayed in the Site Window. Once
    the dates are compared, select Site|Synchronize to synchronize the files.


    ![](img/eb7bf63026b0f3188f312686de439a8a_211_0.png)'
  merge: -1
