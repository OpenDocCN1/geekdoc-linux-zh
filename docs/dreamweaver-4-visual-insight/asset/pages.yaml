- img_proc: true
  md: '# Adding Graphic Interest to Your Web Site


    # Project 4: Work with Background Colors and Graphics


    As discussed elsewhere, the ability to display colors on Web pages is a powerful
    tool for the designer. Color, when used with taste and thoughtfulness, can greatly
    enhance a Web site''s message by capturing the viewer''s eye and directing it
    to elements on the page that the site''s designer intended to emphasize.


    When color is overused, or is used improperly, however, a Web page can become
    a drab, lifeless muddle or a garish mess. In this project, and in the corresponding
    color section examples, you''ll learn some useful guidelines for using color on
    the Web, and you''ll learn about the Dreamweaver tools for working with color.


    # Changing Background and Other Colors


    Often the best color for a Web page''s background is white. It lends a crisp,
    clean look. Colored text and images stand out against this color; when there are
    a great number of multicolored page elements, a simple white background can show
    the other colors to good advantage, without conflicts.


    But color can also set the tone for the Web site—for example, warm colors can
    add energy and excitement; cool or neutral colors tend to recede and create a
    “quieter” look. You may wish to experiment with various color combinations and
    effects in your background and page elements, and Dreamweaver makes it easy to
    do this. See the color section for examples of color relationships and the applications
    of various effects. In this section, you will learn to match and apply colors
    from various sources in a Dreamweaver document.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 1.


    Begin by introducing some text into a new Dreamweaver document; the text will
    appear as black against a white background.


    ![](img/eb7bf63026b0f3188f312686de439a8a_273_0.png)


    # 2.


    Alter the background color by choosing Modify|Page Properties. The Page Properties
    dialog opens. You can specify background color in two ways: by typing the hex
    hexadecimal number of the color into the selection text box, or by using the Eydropper
    tool to select a color from the drop-down Web-safe color palette. This contains
    the 216 colors that will display regardless of the system, platform, or browser
    employed. Select Black (#000000) and click on OK; the background color changes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_273_1.png)


    # 3.


    Select the text by choosing Edit|Select All. In the Property Inspector, click
    on the text specification box and choose a color; for this example, choose white
    (#FFFFFF) and note the appearance of text reversed over the black background.


    ![](img/eb7bf63026b0f3188f312686de439a8a_273_2.png)'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Adding Graphic Interest to Your Web Site


    # 4.


    Repeat the preceding steps, experimenting with various combinations of background
    and text colors. Notice the ways in which different juxtapositions of light and
    dark, related and contrasting hues affect readability and appearance. Try selecting
    individual words and phrases and making them stand out by applying different colors
    to them. This graphic device is useful when applying links to text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_274_0.png)


    # Matching Colors within Web-Page Graphics and Text


    With Dreamweaver, you can easily copy colors between Web-page elements with the
    Property Inspector''s Eyedropper tool.


    # 5.


    Insert a color graphic image into a Dreamweaver document that contains some text.
    In this example, a large orange uppercase letter I is placed in a layer overlapping
    another layer containing black text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_274_1.png)


    # 6.


    With the text selected, click on the Property Inspector''s text color box; note
    that the cursor becomes an Eyedropper tool when the drop-down color box appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_274_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_274_3.png)'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 7.


    Continue to click and drag the Eyedropper''s tip to a portion of the color graphic
    image; note that the color selection swatch in the Property Inspector turns the
    same color as the portion of the image selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_275_0.png)


    # 8.


    Click on the page away from the selected image, and the text color is altered
    to match the color of the image selection (in this case, orange).


    ![](img/eb7bf63026b0f3188f312686de439a8a_275_1.png)


    The colors in placed images may be matched and copied to text and backgrounds
    in Dreamweaver, but the colors in an image itself cannot be altered. Any alterations
    to the image must be done in an image-editing program.


    # Applying a Color Scheme to an Image and Text


    The combination of colors used in a Web page may be chosen individually with the
    Page Properties dialog box or the Property Inspector. You may also take advantage
    of Dreamweaver''s many preset color schemes.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 9.


    Choose Commands|Set Color Scheme. In the dialog box that opens, you can try various
    combinations of preset colors for background, text, and links. Your choices will
    appear in the preview window so you can choose the effect you want. By clicking
    on the Apply button, you can see the color scheme effect on your Web-page design.


    Click on several background color names; note that the text and link colors change
    correspondingly. Try a few different combinations to see how they look.


    # 10.


    Choose one of the combinations and apply it to your document by clicking on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_276_0.png)


    # Adding a Tiling Strip Background Image


    Background images add interesting color and texture to Web pages. Browsers display
    background images by means of tiling: A small image repeats until it fills the
    entire page area. In this way, small-image files may be used, thus reducing download
    time.


    A tiling-strip image tiles vertically down the Web page. It allows for varying
    color and tonal value across the page, which can be useful for creating sidebars
    and other navigational elements. In this section, you''ll create a simple tiling
    strip. The example shown in the following pages was originated in Photoshop.


    ![](img/eb7bf63026b0f3188f312686de439a8a_276_1.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 11.


    Create a new file in an image-editing program (such as Photoshop). Specify the
    file''s dimensions as the pixel width of the target Web page; in this case, the
    width was specified as 600 pixels wide and 8 pixels deep. Working in RGB mode,
    create a gradient from a darker color to a lighter one.


    Keep in mind the colors of the text and foreground images you''ll be using on
    your Web page when choosing background colors so they remain harmonious without
    overpowering each other.


    ![](img/eb7bf63026b0f3188f312686de439a8a_277_0.png)


    # 12.


    Convert your gradient image to indexed color, choosing the Adaptive color palette
    from the Indexed Color dialog box. Save the image as a GIF file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_277_1.png)


    # 13.


    In a new Dreamweaver document, choose Modify|Page Properties and click on the
    Browse button for the Background image text box. Navigate to your gradient image
    file and select it; its path and file names appear in the text box. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_277_2.png)


    # 14.


    The gradient image shows up in your document as a background for the page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_277_3.png)'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 15.


    You can now add text, images, layers, and other elements as you would over a background
    color.


    ![](img/eb7bf63026b0f3188f312686de439a8a_278_0.png)


    # Using Tiling Squares as a Background Image


    You can use subtle patterns to create a "wall-paper" effect behind other Web-page
    elements. The trick here is to prepare the image so that it will tile seamlessly
    across the page, with all four edges matching up. In this section, you will work
    with a background image to produce this effect in Dreamweaver.


    # 16.


    Create a simple, light-colored design within a square. Here, Illustrator was used.


    ![](img/eb7bf63026b0f3188f312686de439a8a_278_1.png)'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 17.


    The tile design is opened in Photoshop as a 100-by-100-pixel RGB Filter; Choose
    Other/Offset and enter “50” (for pixels, half the image size) in each box. In
    the Undefined Areas section, choose Wrap Around to complete the tile.


    For best results, make your tile image file’s pixel dimensions an even multiple
    of the width of the Web page you are planning to use it in.


    ![](img/eb7bf63026b0f3188f312686de439a8a_279_0.png)


    # 18.


    Convert the image to indexed color. Because this is a simple two-color graphic,
    choose a 4-bit color depth, thus greatly reducing the file size. Save the image
    as a GIF file by choosing File|Export|GIF89a, and choosing the Interlaced option.


    ![](img/eb7bf63026b0f3188f312686de439a8a_279_1.png)


    # 19.


    The completed tile now incorporates four copies of the original graphic, arranged
    so that all edges meet seamlessly in the center.


    ![](img/eb7bf63026b0f3188f312686de439a8a_279_2.png)'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 20.


    In a new Dreamweaver document, select ModifyPage Properties to open the Page Properties
    dialog box and click on the Background Image section''s Browse button. Navigate
    to your tile image file, select it, and click on Open; then click on OK in the
    Page Properties dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_280_0.png)


    # 21.


    The background image tiles to fill up the Dreamweaver document page in all directions.


    ![](img/eb7bf63026b0f3188f312686de439a8a_280_1.png)'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Project 5: Add a Table


    Chapter 5 shows you how to organize data into rows and columns, but you can do
    much more with tables. You can also use them to present organized information
    in a graphically interesting way. Follow along to see how a table can be informative
    and well designed, too.


    # Setting Up the Table Structure


    Use the techniques discussed in Chapter 5 to decide what you want your table to
    contain. You don''t have to have the contents exactly right to begin with because
    it''s easy to alter the table properties later on if you need to. Once you have
    a rough idea of what you want the table to contain, you can begin creating it.


    # 1.


    Position the insertion point at the point in the document where you want the table
    to appear. Click on the Insert Table button in the Objects panel (or choose Insert|Table).


    ![](img/eb7bf63026b0f3188f312686de439a8a_281_0.png)


    # 2.


    In the Insert Table dialog box, give the table five rows, three columns, and a
    two-pixel border. Make the table occupy 50 percent of the page width and click
    on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_281_1.png)


    # 3.


    Click anywhere in the table, and center it on the page by choosing Center from
    the Align drop-down menu in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_281_2.png)'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Adding Graphic Interest to Your Web Site


    # Adding Table Content


    Table cells can hold images as well as text and numbers, and each table cell can
    be assigned its own background. Next, add content to your table, one cell at a
    time.


    If you plan to add images to your table, place the image files in the directory
    that holds the Web page containing the table. That way, Dreamweaver won''t have
    to look for the images or make complicated links.


    # 4.


    Click in the first cell and choose Insert|Image (or press Ctrl+Alt+I, or Cmd+Option+I
    on the Mac).


    ![](img/eb7bf63026b0f3188f312686de439a8a_282_0.png)


    # 5.


    In the Select Image Source dialog box, locate the image file you want to add and
    click on it. Then click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_282_1.png)


    # 6.


    The image is added to the table cell. Don''t worry about the other table cells
    looking distorted; you can adjust them later.


    ![](img/eb7bf63026b0f3188f312686de439a8a_282_2.png)'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 7.


    Click in the next table cells and add content.


    If you want to use a special type font for the text you plan to add to your table,
    select all the text at once, and choose the font from the Font drop-down menu
    in the Property Inspector. That way, you can assign the type attributes only once
    instead of on a cell-by-cell basis.


    # 8.


    To make the text snap to the top of the table cell, select it, and then choose
    from the Align drop-down menu in the Property Inspector.


    # 9.


    To center the image vertically within its table cell, click on the image to select
    it. Then enter the number (of pixels) in the V Space box in the Property Inspector
    (in this example, 6). Click on the thumbnail image on the left to apply the change.


    ![](img/eb7bf63026b0f3188f312686de439a8a_283_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_283_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_283_2.png)'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Adding Graphic to Your Web Site


    # 10.

    Repeat Steps 1 through 6 for the other rows in your table.


    Be sure choose File(Save or press Ctrl+S) to save your changes periodically.


    ![](img/eb7bf63026b0f3188f312686de439a8a_284_0.png)


    # Adjusting Table Properties


    Once you get all the contents you want in your table, don''t leave them there.
    You can improve the table''s appearance considerably by adjusting the table properties.


    # 11.

    The first design problem you can solve involves the table cells in the third column.
    Some of the quotations in this example are so long that they make the adjacent
    cells unnecessarily deep. You can make the third column less deep by selecting
    the row, entering a higher percentage in the W (width) box in the Property Inspector
    (in this example, 40%).


    ![](img/eb7bf63026b0f3188f312686de439a8a_284_1.png)


    The thumbnail image of the table in the Property Inspector has a single column
    highlighted to indicate that the change is applied to an entire column.'
  merge: -1
  pgno: 284
- img_proc: true
  md: "# 12.\n\nYou can also center the images in its respective table cell. Select\
    \ each image in turn, then click on the Align Center button in the Property Inspector.\
    \ \n\n![](img/eb7bf63026b0f3188f312686de439a8a_285_0.png)\n\n# 13.\n\nTo vertically\
    \ center the quotation in the first row, click anywhere in that cell, then choose\
    \ Middle from the Vert drop-down menu in the Property Inspector. \n\n![](img/eb7bf63026b0f3188f312686de439a8a_285_1.png)\n\
    \n# 14.\n\nOne thing that's missing from this table is a header: a row that contains\
    \ the name of the table. Create the row at the top of the table by clicking anywhere\
