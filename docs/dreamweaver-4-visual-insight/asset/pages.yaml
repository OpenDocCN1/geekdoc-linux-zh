  md: '# Background Tiling Effects


    Background effects are limited only by your imagination and the limitations of
    the Internet. Although you must use other programs to create the images, Dreamweaver
    can then import the image, tile it as a browser would do, and save the file to
    the site folder.


    Square images may be used as tiles, using edge seams as part of the pattern, or
    processed to hide the seams. A tiling strip or color band can tile horizontally
    or vertically to create various striated patterns, or to produce a sidebar effect.
    Finally, complementary colors and textures may be juxtaposed on the same page
    or in framesets.


    Several techniques for creating image tiles and importing to Dreamweaver are found
    in Chapter 12.


