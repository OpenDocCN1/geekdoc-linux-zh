    # The Code Inspector as an HTML


    One way to track the colors used in your Dreamweaver document is to display the
    Code Inspector window, shown here with a page layout in Design/Code view. The
    Code Inspector displays all HTML code used in the document, including hexadecimal
    color names. Notice that the selected text, "British Museum," is highlighted in
