  md: '# Dreamweaver Studio


    Dreamweaver''s Image Mapping tools enable you to divide a single image into multiple
    hotspots; these, when moused over or clicked in a browser, will perform a preset
    behavior. Each hotspot in a Dreamweaver document is displayed by a bright green
    overlay. The display can be turned off and will not display in a browser.


    Chapters 6 and 13 have more information on image maps and hotspots.


    ![](img/eb7bf63026b0f3188f312686de439a8a_225_0.png)


    Original image


    ![](img/eb7bf63026b0f3188f312686de439a8a_225_1.png)


    An image map applied to the original figure, as seen on screen.


    The same image map when moused over in a browser. The green overlay does not appear,
    and the cursor changes to a hand icon.'
