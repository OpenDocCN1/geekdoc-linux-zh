  md: '# Working Onstage/Behind the Curtain


    If you''ve used a Web-page creation program before, you''re aware that its primary
    purpose is to enable you to add images, format text, and design the overall look
    of Web pages without having to enter HyperText Markup Language (HTML) commands
    by hand. Dreamweaver gives you a robust selection of buttons, menus, panels, and
    other user-friendly elements that streamline the process of adding the visible
    parts of a Web page. Dreamweaver has ingened an advanced advantage: It is specially
    easy to peek "behind the curtain" with the code that controls how Web pages (and
    Web sites) work. That includes not only HTML, JavaScript and Cascading Style Sheets
    (CSSs) as well.


    In this chapter, you''ll learn basic techniques for using Dreamweaver to create
    Web pages and to edit or design them. If you''re an experienced Web designer,
    much of this material will serve as a review, although the descriptions of Dreamweaver''s
    powerful features for editing and working with code may be new material for you.
    If you''re just starting out, you''ll get an overview of how Web pages work and
    how you can use Dreamweaver to interact with them.


    # Anatomy of a Web Page


    Virtually all Web editors allow you to view and edit HTML or other code. But Dreamweaver
    is unmatched in the variety of options it gives you for working with code and
    switching back and forth between viewing the code and viewing its formatted results.
    Even designers who are more comfortable editing "raw" code than working with an
    editor will find that Dreamweaver gives plenty of room to meet their programming
    needs.


    # Viewing Web-Page Code


    The Edit and View menus contain many options related to going "behind the curtain"
    so you can see the code behind the Web page currently displayed in the Document
    Window. The code underlying any Web page is written in HTML, a set of instructions
    designed to mark up text, images, and other objects so they can be displayed in
    a Web browser window. An HTML file is a document written in HTML and saved with
    the file-name extension .htm or .html. A Web browser recognizes the file by displays
    it as you formatted it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_61_0.png)'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Code View


    Some designers create HTML files by typing the commands in a text field, saving
    the file with the .html or .htm extension, opening the file in a Web browser window
    to see the results. With Dreamweaver, you can easily enter HTML by typing View|
    to switch to Code View, or by clicking on the Code toolbar


    ![](img/eb7bf63026b0f3188f312686de439a8a_62_0.png)


    # Code in the Document Window


    When you choose Code View or you click on the Code button, the Document Window
    fills with HTML and other code. Different types of code are displayed in different
    colors: By default, blue is used for HTML; gray is for CSSs, which are used to
    specify type and layout attributes that can be applied to selected text, single
    Web-page files, or groups of Web pages (see Chapters 10 and 15 more on CSSs).


    ![](img/eb7bf63026b0f3188f312686de439a8a_62_1.png)


    # Code and Design View


    Dreamweaver lets you look simultaneously at both the "behind the curtain" view
    and the "public" view of the current Web page if you select Code And Design click
    on the Show Code And Design Views button on the toolbar. The Document Window splits;
    one half shows the code, and the other half shows the page as it would appear
    in a browser.


    ![](img/eb7bf63026b0f3188f312686de439a8a_62_2.png)


    ```

    <img src="images/page01.jpg" title="Greg" width="1075" height="1075" />

    ```


    ![](img/eb7bf63026b0f3188f312686de439a8a_62_3.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Chapter 2


    Locate Code to Edit

    If you''re having trouble locating a segment of code in the Code View half of
    the Document Window, select the element you want to edit in the Design View half.
    The code you want to edit will then be highlighted in the Code View window.


    The correspondence between Code and Design Views works the other way too. Select
    some code in the Code View part of the Document Window and the relevant content
    appears in the Design part of the window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_63_0.png)


    Switch Code and Design Views

    If you want to change the way anything works in Dreamweaver, search the Help menu
    (or the index to this book) or look for a menu option. For instance, if you don''t
    like Code View on the top and Design View on the bottom, choose View|Design View
    On Top. The two views will switch around.


    To return to the original arrangement, select View|Design View On Top again. Design
    View will flip back to the bottom half of the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_63_1.png)


    Display the Code Inspector

    The Document Window isn''t the only place where you can view code. You can keep
    the entire Document Window reserved for Design View and still work with your code
    at any time using the Code Inspector. To display the Code Inspector, you can choose
    View|Code Inspector, press the F10 key, or click on the Code Inspector button
    in the Launcher or Launcher bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_63_2.png)'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Working with Web-Page Files


    # The Code Inspector Toolbar


    Several of the Document Window''s buttons that pertain to code editing are in
    the Code Inspector''s own mini-toolbar. For instance, if you change a code in
    the Code Inspector window, you can see the effect in the Document Window by clicking
    the Refresh Design view. (Other buttons are discussed in this chapter.)


    Code Inspector can be open at the same time that code is displayed in the Document
    Window. This enables you to view and/or edit two parts of the same HTML file simultaneously—if
    you want.


    ![](img/eb7bf63026b0f3188f312686de439a8a_64_0.png)


    # Understanding HTML Tags


    Every HTML document is defined by two commands (tags) that may or may not (the
    presence is optional) at the beginning and end of the file: `<HTML>` and `</html>`.
    The first tag is called a `start tag`; the second (the one with the forward slash)
    is an `end tag`. Between these two enclosing tags, the HTML file has a Head section
    and a Body section. The Body section is marked by `<BODY>` and `</BODY>` and contains
    the contents of the Web page that are displayed in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_64_1.png)


    ```

    <html>

    <head>

    <title>Untitled Document</title>

    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">

    </head>

    <body bgcolor="#FFFFFFFF">

    </body>

    </html>

    ```


    # View Head Content


    The Head section contains information that isn''t visible to the end user, except
    for the page title, which is enclosed by the tags `<TITLE>` and `</TITLE>`. But
    as a Web-page author, you can view and edit the Head content by selecting View|Head
    Content or pressing Ctrl+Shift+W. A separate section opens in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_64_2.png)


    37'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Chapter 2


    Head Content Icons

    The icons in the Head section of the Document represent the tags currently contained
    in the Head section of the Web-page file you are working on. In the page shown
    here, the first is for the page title, and the second is for metainformation—as
    a document description or keywords that describe the document''s contents—that
    a search engine can use to find the page more easily.


    ![](img/eb7bf63026b0f3188f312686de439a8a_65_0.png)


    # Working behind the Curtain

    Most users like the fact that Dreamweaver shields them from having to work with
    HTML and other code. But for many experienced users, it''s useful to access code.
    As Web pages get more complicated with the addition of CSS and XML (Extensible
    Markup Language), some commands are best tracked down by editing the code directly.
    The following sections describe useful techniques for working with Web-page code
    in Dreamweaver.


    # Editing Code


    One advantage of using Code And Design Views is that, if you make a change to
    the code by editing it in one half of the Document Window, you can see the results
    almost instantly in the other half by following a few steps.


    # 1.


    Open the file you want to edit and click on Show Code And Design Views on the
    toolbar or choose View|Code And Design Views. When the Document Window splits
    into two views, you may have to resize the window to see your Web page more fully.


    ![](img/eb7bf63026b0f3188f312686de439a8a_65_1.png)'
  merge: -1
  pgno: 65
