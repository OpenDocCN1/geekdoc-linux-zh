- img_proc: true
  md: '# Launch an External Editor


    The selected editor is added to the Edit menu. For instance, if you specified
    Wordpad as your HTML editor, the option Edit With WORDPAD appears, replacing Edit
    With External Editor. When you choose the new option, Wordpad launches automatically,
    and the current file is displayed in the Wordpad window, ready for editing.


    The Macintosh version of Dreamweaver is integrated to work with the popular HTML
    editor BBEdit. To enable this feature, click EditPreferences, click on External
    Editors, and select the next box to Enable BBEdit Integration. You can then have
    the same document open in both Dreamweaver and BBEdit, and and changes you make
    in one program will be automatically reflected in the other.


    ![](img/eb7bf63026b0f3188f312686de439a8a_68_0.png)


    # Integrate an External Editor with Dreamweaver


    After you make a change in your file with your chosen external editor, save the
    file. Then return to Dreamweaver. You''ll see a dialog box alerting that changes
    have been made. Click on Yes to refresh the page being displayed in Dreamweaver
    and see the change.


    ![](img/eb7bf63026b0f3188f312686de439a8a_68_1.png)


    # Working with Files


    Whether you want to create a completely new Web page or edit one that you or a
    colleague originally created, you can start easily with Dreamweaver.


    # Opening an Existing File


    Opening already existing Web-page files in Dreamweaver is pretty much the same
    as opening already existing files in other applications: You choose File|Open
    or press Ctrl+O (Cmd+O on the Mac) and an Open dialog box appears. Navigate to
    the file you want, and double-click on it or select it and click on Open. The
    file (provided that it''s a Web-page file type, such as an HTML file or JPEG or
    GIF image) opens in the Document Window.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Chapter 2


    Dreamweaver displays Web-page files (those that end in .htm or .html) by default.
    You can also open image files or Active Pages by selecting All Documents from
    the Files Of Type box (on the Mac, choose All Documents from the Show drop-down
    menu).


    ![](img/eb7bf63026b0f3188f312686de439a8a_69_0.png)


    # Reopen Recent Files


    The last four files that you have had open are quickly accessed from a list at
    the bottom of the File menu.


    # Creating a New File


    Creating a Web-page file is in some ways even simpler than editing an existing
    document: Choose File|New or press Ctrl+N (Cmd+N on a Mac) and you''re off and
    running. But Dreamweaver provides you with some options and additional steps for
    new files that will get you running even more quickly.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Changing File Preferences


    Normally, when you choose File|New, the file you create in a new Dreamweaver window.
    You can save a bit of real estate by changing your preferences so that new files
    open in the existing Dreamweaver window too.


    # 1.


    Select Edit|Preferences to open the Preferences window, and click on the General
    category to display Dreamweaver''s General preferences.


    ![](img/eb7bf63026b0f3188f312686de439a8a_70_0.png)


    # 2.


    Click on the checkbox next to Open Files In New Window to deselect it. Click on
    OK to choose the Preferences window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_70_1.png)


    # 3.


    Now, when you create a new file, it won''t create a new Dreamweaver window. You
    can switch between one file and another by choosing the file names from the bottom
    of the Window menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_70_2.png)'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Entering a Title


    After you create a new Web page, you need to assign a page title. The easiest
    way to do this is in the Title box at the top of the Document Window. Scroll across
    the default title (“Untitled Document”) and type the new title. Press Return or
    Enter, and the new title replaces the default title in the title bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_71_0.png)


    # Previewing Web Pages


    The Document Window gives you a fairly good representation of how your Web page
    will look when it''s online. But it doesn''t show every single HTML element. Additionally,
    different browsers display Web content differently. The best way to preview your
    Web pages is to Dreamweaver launch them in a Web browser window.


    # Launching the Primary Browser


    After you''ve made changes to the current Web page, preview it by choosing [File]Preview
    In Browser and then selecting a browser from the submenu that appears. Initially,
    only one browser appears in the list (in the example shown, “explore” is Microsoft
    Internet Explorer). You can edit the list to specify many as 20 different browsers.
    The browser will launch if it isn''t open already, and your page will appear in
    the browser window.


    The fastest way to preview a page in a browser is to press F12; the will open
    in the program that Dreamweaver considers to be the primary browser. To display
    the page in the secondary browser, press Ctrl+F12 (Cmd+F12 on the Mac).


    ![](img/eb7bf63026b0f3188f312686de439a8a_71_1.png)'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Viewing Browser Preferences


    It''s always a good idea to test a Web page in at least two browsers (if not more)
    because different browsers contain web content very differently. To add to the
    browser list, select File|Preview In Browser|Edit Browser List to open the Preview
    In Browser category of the Preferences window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_72_0.png)


    # Editing the Browser List


    Click on the plus sign (+) to open the Add Browser dialog box. Click on Browse
    to open the Select Browser dialog box, from which you can locate a browser to
    add to the list of those Dreamweaver uses. Navigate through your computer resources
    until you locate the icon for the browser you want, then click on Open. It is
    added to the Browsers list in the Preview In Browser preferences window. Select
    a browser and check the box next to either Primary or Secondary Browser to indicate
    how Dreamweaver should access the program.


    You can leave both the Primary and Secondary checkboxes unselected. The selected
    browser will still be available in the File|Preview In Browser submenu so you
    can select it if you want. The Preview Using Local Server box should be checked
    only if you are running a Web server on your computer so you can test your site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_72_1.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Saving Files


    It''s a good idea to save your work every 15 minutes or so. When you choose File|Save
    or press Ctrl+S (Cmd+S on a Mac), the As save dialog box appears. Select a directory
    in which to save the file, assign a name, and click on Save.


    When you save files, Dreamweaver adds the .htm (Windows) or .html (Mac) extension
    automatically. If you manually delete the file extension, Dreamweaver treats the
    document as a plain-text file.


    # Using Save As


    Choose File|Save As you want to save a file under a different name or with the
    same name in a different location (this option creates a copy of the file). The
    Save As dialog box opens, enabling you to choose a location and/or name for the
    copy of the file. Click on Save, and the copy is made. Remember, though, when
    you use File|Save As, the file''s left open in the Document Window is the copy,
    not the original.


    ![](img/eb7bf63026b0f3188f312686de439a8a_73_0.png)


    If you try to save a file without changing the file name, Dreamweaver will prompt
    you to verify that you really want to make that change. If you click on Yes, you
    will overwrite the previous version.


    # Save As Template


    The Save As Template option opens the Save As Template dialog box. When you save
    a file as a template, you can specify areas that cannot be changed (i.e., not
    moved or otherwise changed) and areas that can be edited. Templates can speed
    up the process of copying groups of pages that share common design elements; see
    Chapter 10 for more information.


    Save All Frames, grayed out also appears as a File menu option, is grayed out
    the page you''re working on is part of a frames—a set of individual Web-page documents
    that, together, make up a single Web page that has been divided into sections
    called frames.


    ![](img/eb7bf63026b0f3188f312686de439a8a_73_1.png)'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Working with Web-Page Files


    Choose File|Revert to revert to the previously saved version of the file currently
    displayed in the Document Window. Any changes you''ve made since the last time
    you saved are lost when you do this, it''s a quick way to delete a series of changes
    if you change your them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_74_0.png)


    # Closing a File


    When you''re finished with your work, you should close the file you''ve been editing.
    Closing a file in Dreamweaver is easy to do—but it does carry a couple of “gotchas”
    that you should know about.


    # Closing without Saving Changes


    Choose File|Close or press Ctrl+W (Cmd+W on a Mac) to close the file in the Document
    Window. If you haven''t saved your most recent changes, Dreamweaver asks if you
    want to save changes before you close the file. Most of the time, when this dialog
    box appears, you should click on Yes. If you click on No, you''ll lose all changes
    since the most recent save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_74_1.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Closing Dreamweaver


    If you select File|Close and close a file that is not the only one you''ve been
    working on—that is, you have another open file, because either you''ve been working
    in two Dreamweaver windows or you''ve been working on two or more files in the
    same window—the document will close and the other files remain open. If the file
    you close is the only one open in Dreamweaver, however, the entire program will
    quit. Don''t close a "one" open unless you want to quit the program altogether.


    To quit Dreamweaver by more traditional methods, click on the Exit button or close
    File|Exit or Ctrl+Q (File)|Quit or Cmd+Q on the Mac).


    ![](img/eb7bf63026b0f3188f312686de439a8a_75_0.png)


    # Page Properties


    Earlier in this chapter, you learned an easy way to assign a title to a Web page.
    Page properties apply to the file as a whole rather than to a particular element
    such as a table, paragraph or image. Learning how to locate and specify page properties
    can help you with designing and locating the page within a Web site.


    # Viewing Page Properties


    Select Modify|Page Properties or press Ctrl+J (Cmd+1 on a Mac) to view the page
    properties for the file currently being displayed in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_75_1.png)


    The Property Inspector does not allow you to view page properties, only the properties
    for selected elements within a page. You can also choose Modify|Selection Properties
    to view properties for a selected item in the Property Inspector.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Working with Web-Page Files


    Set the Background Color

    When you choose Page Properties, the Page Properties dialog box opens. You can
    enter a file for the Title box. You can specify a background image by clicking
    on the Browse button next to the Background image and locating a file to insert
    behind the text and other contents on the page. (See Chapter 4 for more on background
    images and colors.) You can also specify a solid background color other than the
    default white.


    Page Properties has an Apply button on which you can click to apply a particular
    change (such as a title''ve entered or a color you''ve selected) to the page;
    the Page Properties dialog box remains open so you can make further changes. Click
    on OK if you want to apply a change and close the dialog box as well.


    ![](img/eb7bf63026b0f3188f312686de439a8a_76_0.png)


    # 1.


    To select a background color for the page, click on the white button next to Background.
    A color selection box drops down and the mouse arrow turns into an eyedropper.
    Click on the color you want to assign as the background.


    The box next to Background displays the hexadecimal code for the color you''ve
    selected. The code for the color white is #FFFFFF, for instance.

    If you edit the HTML for your Web pages, you may need this code; in HTML, codes
    are sometimes displayed in this form, though common color names (red, green) are
    also recognized.


    ![](img/eb7bf63026b0f3188f312686de439a8a_76_1.png)'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# 2.


    Click on OK or on Apply to add the background color to the page. When you close
    the Page Properties dialog box by clicking on OK, you can also view the color
    you''ve selected.


    You can also use Page Properties to assign colors to the body and heading text
    on a page; see Chapter 3 for more information.


    # Document Encoding


    The Document Encoding option lets you-select a special encoding for your Web page
    if you want to include text in a language such as Chinese, Greek, or Japanese.
    When you set the encoding for the page, Web browsers will be able to load the
    correct fonts so you can read the contents. Setting the encoding doesn''t change
    the appearance of the page; instead, it helps Web browsers load the fonts required
    to make the foreign language readable.


    ![](img/eb7bf63026b0f3188f312686de439a8a_77_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_77_1.png)


    # Change Margins


    The margin boxes in the Page Properties dialog box can be used to adjust the empty
    space at the top of the page or on the right and left margins. They can be confusing,
    however. Top Margin and Left Margin are used only by Microsoft Explorer; Margin
    Height and Width are used only by Netscape Navigator. To make your page look the
    same for both of these browsers, enter the same numbers in both sets of boxes.


    ![](img/eb7bf63026b0f3188f312686de439a8a_77_2.png)'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Previewing Your Page


    The numbers you enter in the margin boxes appear to be arbitrary values rather
    than definite measures (pixels, inches, etc.); export with the numbers and preview
    the page in a browser to check the effect. To preview the page, click on OK to
    close Page Properties, then click the Preview In Browser button on the Document
    Window toolbar and select the browser you want to use from the drop-down menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_78_0.png)


    # Printing a Page


    You can''t print directly from Dreamweaver''s File menu; there is no File|Print
    option. Rather, you need to open the current document in a browser window (see
    the section above, “Previewing Your Page”), then print from the selected browser''s
    File menu, as shown here.


    ![](img/eb7bf63026b0f3188f312686de439a8a_78_1.png)


    # Using Print Preview


    Both Microsoft Internet Explorer and Netscape Navigator include a Print Preview
    option that gives you an overview of how the page will look when it''s printed.
    It''s a good way to check page breaks, if there are any. Choose File|Print Preview
    to open the Print Preview window (this applies to both browsers).


    ![](img/eb7bf63026b0f3188f312686de439a8a_78_2.png)'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Getting Help


    If you ever need assistance with editing Web pages (or any aspect of Dreamweaver''s
    operations, for that matter), click on the Help menu in the Document menu bar
    to access Dreamweaver''s extensive—and not surprisingly—helpful system.


    Some Help menu options, like Dreamweaver Support or Dreamweaver Exchange, require
    you to be connected to the Internet. If you''re not already connected, choosing
    one of these options will prompt your computer to make a connection.


    # General Program Help


    To get general help about Dreamweaver, select Help Using Dreamweaver or press
    F1. Your default web browser program (defined in the Preview In browser preferences;
    "Previewing Web Pages" early in this chapter) will launch if it''s not already
    running, and the Welcome To Dreamweaver help page appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_79_0.png)


    # Help Contents


    The Help window is divided into two frames. Use the frame on the left to find
    a topic; the information for that topic is displayed on the right. When you first
    open the window, the left-hand frame displays Help Contents. Scroll through the
    list of topics and click on an expander next to a topic to see the subtopics within.
    Click on the name of an individual topic or subtopic, and it appears at the right.


    As you pass your mouse pointer over each Help topic, its name appears in your
    browser''s status bar to verify your selection.


    ![](img/eb7bf63026b0f3188f312686de439a8a_79_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_79_2.png)


    52'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Help Index


    Click on Index in the left-hand Help frame to access an alphabetical list of Help
    topics. Click on a letter and a list of topics beginning with that letter. Click
    on an individual topic to view its Help instructions.


    ![](img/eb7bf63026b0f3188f312686de439a8a_80_0.png)


    # Search Help


    Click on Search in the left-hand Help frame, and a new Search window opens. In
    the box at the top of the Search window, type one or two keywords that identify
    the topic you want to locate. Click on List Topics, and a set of topics that contains
    the keyword(s) appears in the Select Topic To Display box. Click on one of the
    topics, then click on Display to view help for that topic in the main browser
    window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_80_1.png)'
  merge: -1
