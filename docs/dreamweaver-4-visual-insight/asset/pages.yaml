  md: '# Managing Assets


    Dreamweaver is great for creating individual Web pages, but the program really
    excels in keeping-tracking of an entire Web site. One of the primary ways it manages
    a group of related pages is to list, and then let you make changes to, what Dreamweaver
    calls your assets—that is, all of the images, multimedia files, and other elements
    that give your site life and color.


    # The Assets Panel


    When you create a Web site, Dreamweaver automatically keeps a list of site''s
    assets in the Assets panel, which you can display by selecting Window|Assets.
    The elements that Dreamweaver considers assets are shown here; click on an icon
    to see the list displayed in the main part of Assets panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_199_0.png)


    Dreamweaver lists assets for a site only after you have defined the site by choosing
    Site|Define Sites. It might take a few seconds for Dreamweaver to compile the
    list of assets and display it after you choose Window|Assets.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Managing Your Web Site


    Refresh the Assets Panel

    The Assets panel doesn''t refresh its contents immediately as you create pages
    and add files, links, or colors. To see your most current site assets, click on
    the Refresh Site List button, which is the first of the three buttons in the lower-right
    corner of the Assets panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_200_0.png)


    Edit an Asset

    When you click on an asset, a visual representation appears in the upper section
    of the Assets panel. If you want to change the asset, you can begin the process
    of editing it from the Assets panel by clicking on the Edit button, which is one
    of the buttons at the bottom of the panel. If the selected image is the template
    (see the section “Using Templates” later in this chapter), when you click on Edit,
    the template opens in the Document Window so you can begin adding content.


    ![](img/eb7bf63026b0f3188f312686de439a8a_200_1.png)


    Notice that, depending on the asset being displayed, the buttons at the bottom
    of the Assets panel change. Most assets, such as Images, Colors, and URLs, have
    only three buttons. For templates, a New Template button replaces the Add To Favorites
    button and a fourth button—the Trash icon—appears at the bottom of the Assets
    panel so you can delete the asset.


    +   Assemble Favorites

    For large Web sites, the list of available assets can become very long. It can
    be difficult to find important assets that you plan to use. You can add such assets
    to a list of favorites that you can access easily. To make an asset a favorite,
    select it in the Assets panel, then click on the Add To Favorites button.


    ![](img/eb7bf63026b0f3188f312686de439a8a_200_2.png)


    You can''t save templates or library items (textual items that you can reuse from
    page to page) as favorites.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Chapter 10


    # View Favorites


    To view your available favorites, click on the Favorites button at top of the
    Assets panel. To switch back to viewing all available assets of a particular type,
    click on the Site button to move back to Site View.


    Click here to view favorites


    ![](img/eb7bf63026b0f3188f312686de439a8a_201_0.png)


    # Using Templates


    One aspect of managing a Web site is achieving a consistent appearance from page
    to page. On many Pages, you can achieve consistency by repeating standard elements
    from page to page—a background color, a heading, a logo, a navigation bar, or
    all of the above. In a large organization, though, any number of designers and
    editors might work on different pages in the same site.


    ![](img/eb7bf63026b0f3188f312686de439a8a_201_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_201_2.png)


    # Performance


    Thank you for your interest in having WomanLore perform for your group. Please
    fill out this form to tell us about your needs and place of the event where you
    want the performance to occur. The more information you provide, the better we...


    # Preformatted text


    (with new text)


    Non-editable region of template


    Dreamweaver''s lets you identify standard elements of a page and make fixed elements
    that cannot be edited. You can set aside areas of the page that can be edited
    (Dreamweaver calls these editable regions); “Define Editable Regions” later in
    this chapter, ensuring that your Web-page body text will be the same width and
    font size from page to page no matter who works on the file.


    # Creating a Template from Scratch


    If you want to create a new template and don''t have a Web page as a model to
    follow, by opening the Assets panel and clicking on the Templates button on the
    left side of the panel. Click on the New Template button at the bottom of the
    panel. A new template appears in the Document Window. Follow the instructions
    in the top half of the Assets panel to begin editing the template.


    ![](img/eb7bf63026b0f3188f312686de439a8a_201_3.png)'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Creating a Template from an Existing File


    If you want to convert an existing file to a template, display the document in
    the Document Window and choose File|Save As Template.


    ![](img/eb7bf63026b0f3188f312686de439a8a_202_0.png)


    # Choose a Location for a Template


    When you choose File|Save As Template, the Save As Template dialog box appears.
    Choose the site for your template from the Site drop-down menu, which contains
    all the sites you have defined. Give the template a name by entering the name
    in the Save As text box. Click on OK. The file is saved, and the designation <<Template>>
    appears in its title bar.


    ![](img/eb7bf63026b0f3188f312686de439a8a_202_1.png)


    When you create a template, a new folder called Templates is automatically stored
    within the root folder for the site. Any templates you create for the site are
    created in this folder.


    # Define Editable Regions


    A template doesn''t much good if you or a co-worker can''t add content to it.
    To be able to add content, you need to designate editable regions—places in the
    template that hold text that can be edited. An editable region can contain text
    that you preformat to contain a site''s desired type style, size, and color. The
    editable region can be given a specific width to conform to your site''s design,
    too. Open the template, position the cursor where you want the editable region
    to appear, then choose Modify|Templates|New Editable Region or press Ctrl+Alt+V
    (Cmd+Option+V on a Mac). The New Editable Region dialog box appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_202_2.png)'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 10


    Name Editable Regions

    Enterter a name for the editable region in the Name box in the New Editable Region
    dialog box. If you want to create a region that will contain a heading, enter
    "Heading". If you are creating a text region, enter "Text" or "Body Text". Click
    on OK. The editable region appears in the Document Window. You can edit the text
    that initially appears in the editable region.


    ![](img/eb7bf63026b0f3188f312686de439a8a_203_0.png)


    You might want to enter in the editable region some instructions that indicate
    to other editors what''s supposed to go there.


    Create a Page from a Template

    Once you have created and saved a template, you can use it to create new Web pages
    that contain the template''s standard elements and formatting.


    1.

    Choose File|New Template from the Document''s menu bar to display the Select Template
    dialog box. Click on the template''s name to select it, then click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_203_1.png)


    2.

    The template opens in the Document Window. You can begin editing the editable
    regions by selecting their contents and modifying them.


    You cannot add behaviors or style sheets (see the section "Creating Styles" in
    this chapter) to a document that is based on a template. If you (or another editor)
    need to do so, you should detach the file from the template by selecting Modify|Templates|
    Detach From [name of template] while the template is displayed in the Document
    Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_203_2.png)


    176'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# # Designating Library Files


    Another type of Web-page element that you can reuse from page to page is a library
    file. A library file is a bit of text or JavaScript that you can access quickly
    and reuse by storing it in Dreamweaver''s library. Good candidates for library
    items include copyright and contact information that you would place at the bottom
    of each Web page, a navigation bar, and a mission statement.


    # ## Creating a Library File


    Creating a library file is easy, and it will save you lots of time spent cutting
    and pasting as you assemble your site.


    # 1.


    Save your file and select the text that you want to save as a library file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_204_0.png)


    # 2.


    Select Modify|Library|Add Object To Library or press Ctrl+Shift+B (Cmd+Shift+B
