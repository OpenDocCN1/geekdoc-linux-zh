- img_proc: true
  md: '# Linking Up with the Web


    Links make your Web site truly interactive and dynamic, connecting the user to
    a world of information on your site and beyond. In Chapters 6 and 8, you learned
    about links, how you can use them, and how to work with them in Dreamweaver. In
    this chapter, you will create links from pages in your Web site to other locations.
    You''ll use both text and image links to refer to other URLs.


    Dreamweaver offers some very handy tools for creating and working with links,
    such as the Site Map and the image map tools. In this chapter, you will work with
    these tools to create an interconnecting system of links for your Web pages. You
    will find supplementary illustrations in this book''s color section.


    # Project 1: Add a Navigation Bar


    A navigation bar gives the user access to various locations on a Web site. It
    may be composed of text links, it may take the form of a set of image links, or
    it could be a combination of both.


    In this first project, you''ll create a set of graphical links to dress up your
    Web page and connect with other locations in your Web site.


    > There are several ways to design a navigation bar in Dreamweaver, including
    the use of the Insert Navigation Bar menu option or buttons on the Objects panel.
    In this example, you''ll construct a bar "from scratch."'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# # Creating a Navigation Bar with a Rollover Image


    A rollover image is a Web graphic device frequently used by designers; it gives
    users a visual cue when they have moused over or clicked a link in the navigation
    bar.


    # 1.


    Set up a local site, as you did in Chapter 11, and open a new Web page, adding
    any text and graphics you want from your site''s local root folder.


    ![](img/eb7bf63026b0f3188f312686de439a8a_290_0.png)


    # 2.


    For this project, you''ll use layers to contain your image links, making it easy
    to position the navigation bar where you want it. Choose Window|Layers and select
    the Prevent Overlaps box in the Layers panel. Click in the Document Window to
    make it active, then on the Draw Layer button in the Common Objects panel. Use
    the drawing tool to click and drag a new layer into your document.


    ![](img/eb7bf63026b0f3188f312686de439a8a_290_1.png)'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 3.


    You can “dress up” your navigation bar and aid you by inserting rollover images
    as navigation buttons so the display will change when a cursor is moved over an
    image. To accomplish this, assign a behavior to the images. Begin by placing the
    insertion point where you want the first button to go and click on the Insert
    Rollover Image icon in the Common Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_291_0.png)


    # 4.


    The Insert Rollover Image dialog box appears. Type a name for the image in the
    Image Name field (in this case, “thewomen”). Click on the Browse button next to
    the Original Image field, navigate to the original image file, and select it.
    The file’s name appears. Follow the same procedure with the Rollover Image field.
    Select the Preload Rollover Image option so both images will load in the browser’s
    cache and thus display quickly on the page. Browse and select the file for a destination
    link for the When Clicked, Go To URL field and then click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_291_1.png)


    # 5.


    Choose File|Preview in Browser to try the effect. Notice that the cursor changes
    to a hand icon when it passes over the button image, which is replaced by the
    rollover image you selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_291_2.png)'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# 6.


    Clicking on the button opens the link to the

    URL you specified, which appears in the

    browser''s window.


    Two types of URLs may come into play when you''re

    sifying links. Relative URLs refer to files within the

    same Web-site folder and are represented by abbre-

    viated addresses. Absolute URLs generally refer to

    any file outside the Web site, with correspondingly

    more detailed addresses.


    ![](img/eb7bf63026b0f3188f312686de439a8a_292_0.png)'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Project 2: Insert Email and Other Links


    In this project, you''ll add links to your Web page, using several different Dreamweaver
    methods and tools.


    # Creating a Basic Email Link


    You''ll find email links as essential elements on most Web sites. When a user
    clicks on an email link, it opens a blank message window in the user''s mail program;
    the blank message window is addressed to the location specified in the link.


    # 1.


    In the Document Window, select the text or image you want to designate as the
    email link. Choose Insert|E-Mail Link or click on the E-Mail Link icon in the
    Common Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_293_0.png)


    # 2.


    The Insert E-Mail Link dialog box appears. In the Text field, type or edit the
    text you want to appear as an email link. If you are designating an image, leave
    this field blank. In the E-Mail field, enter the address to which you want email
    to be addressed automatically. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_293_1.png)'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# 3.


    ![](img/eb7bf63026b0f3188f312686de439a8a_294_0.png)


    # Using the Site Map to Create a Link


    Dreamweaver''s Site Map feature provides a clear picture of your site''s layout,
    showing the various links and allowing you to alter structure conveniently from
    one window.


    Next, you will create a site map and use it and the Point To File button to add
    a new link.


    # 4.


    Open the Site Window by clicking on the Site Window button on the Launcher bar.
    The Site Window appears with files related to the site listed in the right column.


    ![](img/eb7bf63026b0f3188f312686de439a8a_294_1.png)


    # 5.


    Click on the Site Map button on the Site Window''s toolbar and choose Map And
    Files from the drop-down menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_294_2.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 6.


    The icon for the home page you have designated for the site (in this example,
    WomanLore 2) will display in the Site Map Window, along with any links you have
    already created.


    # 7.


    If your site does not have a designated home page, however, a prompt box will
    open, asking you to define the home page. Click on the Define Sites button.


    # 8.


    In the Define Sites dialog box, select the site you are working with and click
    on the Edit button; this opens the Site Definition dialog box.


    # 9.


    In the Site Definition dialog box, select the Site Map Layout category and click
    on the folder icon by the Home Page field to browse for and select the home page''s
    HTML file. The path appears in the Home Page field. Click on OK; the Site Window
    will open, displaying your newly defined home page on the Site Map.


    ![](img/eb7bf63026b0f3188f312686de439a8a_295_0.png)'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 10.


    In the Site Map, click on and select a page you would like to link to. A Point
    To File button will appear next to the icon.


    Leaving the pointer on the icon''s abbreviated name will display the full address
    for that page. The file name will be highlighted in the Local Folder column.


    ![](img/eb7bf63026b0f3188f312686de439a8a_296_0.png)


    # 11.


    Click and drag from the Point To File button to a file either shown in the Site
    Map or the Local Folder column. (This example shows the Local Folder column.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_296_1.png)


    # 12.


    A text link is added to the designated page at the upper-left corner of the window—in
    this case, the default cursor location.


    ![](img/eb7bf63026b0f3188f312686de439a8a_296_2.png)'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Adding a Link with the Property Inspector


    Using the Property Inspector is a convenient way to attach links quickly to various
    types of page elements.


    # 13.


    Select the image or text on the page to you would like to attach a link. The Property
    Inspector adjusts to the type of page element chosen.


    ![](img/eb7bf63026b0f3188f312686de439a8a_297_0.png)


    # 14.


    In the Property Inspector, click on the folder icon next to the Link field and
    browse to select the file you wish to link to. Its address appears in the Link
    field.


    # 15.


    If you have created a text link, as shown, the linked text, Hungry Brain, will
    display underlined, in blue (the default characteristics). The link will also
    be recorded in the Site Map.


    ![](img/eb7bf63026b0f3188f312686de439a8a_297_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_297_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_297_3.png)'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# 16.


    Test your links by choosing File|Preview In Browser. Clicking on the linked elements
    you''ve designated (the Kingsley page and the Hungry Brain nightclub) should cause
    new pages to load in your browser. If not, you can go back and check these links
    in the Property Inspector and Site Map.


    Dreamweaver offers another tool for checking links within a site: the Link Checker.
    Offsite links must be checked manually in a browser or with the aid of another
    application, such as InfoLink.


    ![](img/eb7bf63026b0f3188f312686de439a8a_298_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_298_1.png)


    # Mary Kingsley


    The long list of explorers includes one remarkable woman Mary Kingsley (1862-1900)
    who wrote A Bush in 1893. She had two objectives to collect specimens for the
    British Museum and inform others on African religion. She undertook one trip from
    July to December 1893 and the other from January 1894 to November 1895.


    ![](img/eb7bf63026b0f3188f312686de439a8a_298_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_298_3.png)'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Project 3: Create an Image Map


    An image map is an image on a Web page that contains multiple links. Each of these
    links, known as hotspots, leads to a different link on or off the site.


    In this project, you will bring an image into a Dreamweaver document and create
    an image map with links to other pages on your site.


    Image maps may also be created in other programs, such as Fireworks, and brought
    into Dreamweaver.


    # 1.


    Open a new Dreamweaver document and insert an image and any text you wish for
    that page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_299_0.png)


    # 2.


    Click on the expander arrow on the Property Inspector so that the image-mapping
    tools are displayed. Type a name for the map into the Map text box (such as “balloons”),
    as would be done in this box example.


    ![](img/eb7bf63026b0f3188f312686de439a8a_299_1.png)'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# 3.


    Decide what shape you would like your hotspot to take and select either the rectangle,
    circle, or polygon tool under the Map box. Click and drag over the area you want
    to place the hotspot in (in our example, the CD Clocks balloon).


    ![](img/eb7bf63026b0f3188f312686de439a8a_300_0.png)


    # 4.


    A hotspot appears on the image (in the default indicator color, a transparent
    blue). You can alter the hotspot''s position by selecting the arrow tool, then
    clicking to select the hotspot and dragging it to a new area. To alter the size
    or shape, select the hotspot and drag a selector handle.


    ![](img/eb7bf63026b0f3188f312686de439a8a_300_1.png)


    # 5.


    The Property Inspector window now changes to the Hotspot Property Inspector. Click
    on the folder icon next to the Link field to browse and select the file that will
    open when a user clicks on the hotspot. Then, in the Target field, specify the
    window into which the linked file should load. Click on the drop-down menu and
    four options appear: _blank, _parent, _self, and _top. In this case, select _self,
    specifying that the linked file will appear in the same window as the link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_300_2.png)'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Chapter 13


    # 6.


    Repeat Steps 3, 4, and 5, adding as many hotspots as your image will hold.


    ![](img/eb7bf63026b0f3188f312686de439a8a_301_0.png)


    # 7.


