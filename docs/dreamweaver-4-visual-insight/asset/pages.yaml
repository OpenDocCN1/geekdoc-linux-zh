    # 8.


    The image is added to the frame. You can insert a second image for additional
    interest.


    ![](img/eb7bf63026b0f3188f312686de439a8a_325_1.png)


    # 9.


    With the top frame selected, choose File|Save Frame to display the Save As dialog
    box. Enter a file name for the frame, then click on Save.


    ![](img/eb7bf63026b0f3188f312686de439a8a_325_2.png)


    # 10.


    So that content in the left-hand frame won''t interfere with the main heading
    in the top frame, we have used a graphics program (in this case, Paint Shop Pro
    for Windows) to create a blank, transparent “spacer” GIF image, saved with the
    file name spacer.gif.


    ![](img/eb7bf63026b0f3188f312686de439a8a_325_3.png)'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 11.


    Click in the left-hand frame and choose Insert|Image to display the Select Image
    Source dialog box. Select the spacer file and click on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_326_0.png)


    # 12.


    The spacer image is added to the frame. To get more room, click on one of the
