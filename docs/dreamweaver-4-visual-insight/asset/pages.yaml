- img_proc: true
  md: '# Anatomy of a Web-Page Table


    Tables are features of Web pages that, at their simplest level, enable text or
    images to arranged in rows and columns, as in a spreadsheet. But you don''t have
    to be a financial genius to use them. With Dreamweaver, you can format and edit
    tables to function as sophisticated page layout tools.


    # Rows and Columns


    The most basic use of tables is to present tabular data in columns and rows, much
    like data presented in a spreadsheet. This table has six rows. The top row has
    one column. The other five rows have three columns.


    | Name | Dates | Type of Writing |

    |---|---|--|

    | George Ade | 1866-1934 | Newspaper columns, plays |

    | Nelson Algen | 1902-1938- | Novels, short stories, articles |

    | Sherwood Anderson | 1876-1941 | Novels, short stories |

    | Finley Peter Dunne | 1867-1936 | Newspaper columns featuring "Mr. Dooley" |


    # Borders


    By default, a visible border appears around the table. The default border has
    a three-dimensional appearance and is the same color as the page background (although
    you can change this and virtually all other aspects of tables). Borders can also
    be used to separate lots of different information on a page into cells.


    # Cell Padding and Cell Spacing


    Cell padding refers to the space, in pixels, between the contents of a cell and
    the cell border. Cell spacing refers to the space between cells, in pixels.


    +   - Default cell spacing/cell padding.

    - Add 6 pixels to cell spacing.

    - Add 6 pixels to cell padding.


    | | | | |

    |---|---|---||

    | Brownsville, TX | 1926 | | |

    | Fargo, ND | 1228 | 1376 | 727 |

    | Norfolk, VA | 2546 | 1986 | 1363 |


    | | | |

    |---|---|--|

    | Brownsville, TX | 1926 | | |

    | Fargo, ND | 1228 | | |

    | Norfolk, VA | 2546 | | |'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Creating a New Table


    It''s useful to have at least a passing knowledge of the primary components of
    tables because, when you use one of the options Dreamweaver gives you to create
    a new table, you are immediately asked to specify the table properties. Although
    you can change a table''s layout, it''s easier to get it right the first time.


    # Using the Insert Menu


    To add a new table, position the text cursor at the place in the current document
    where you want the table to appear. Then select Insert|Table or press Ctrl+Alt+T
    (Option+Cmd+T on a Mac). When the Insert Table dialog box appears, specify the
    size and dimensions of the table.


    ![](img/eb7bf63026b0f3188f312686de439a8a_124_0.png)


    It''s often helpful to draw a rough version of your table before you start to
    create it on the computer. Sketch the table by hand using pencil and paper, or
    use a drawing program such as MacDraw for the Mac or Paint for Windows.


    ![](img/eb7bf63026b0f3188f312686de439a8a_124_1.png)


    # Dragging the Table Button


    If you''re a fan of drag-and-drop, you can drag the Insert button into your document
    using the Objects panel to open the Insert Table dialog box. Try to drag the button
    to the spot where you want the table to appear. (The arrow gains a plus sign when
    you pass over the Document Window). When you release the mouse button, the Insert
    Table dialog box appears.


    If you don''t place the table exactly where you want it, you can select the entire
    table by clicking on the outside border. Choose Edit|Cut to cut the table to the
    clipboard and then Edit|Paste to paste it in the desired location.


    ![](img/eb7bf63026b0f3188f312686de439a8a_124_2.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# The Insert Table Dialog Box


    When the Insert Table dialog box appears, you specify the initial settings for
    the table you want to create. (You can always change the settings later.)


    The settings you see when the Insert Table dialog box first opens are the ones
    you used the last time you inserted a table. Feel free to change them.


    # 1.


    Enter the number of rows and columns you want the new table to have, as well as
    any cell padding (the space between the cell content and the cell border) and
    cell spacing (the space between cells).


    # 2.


    In the Width field, you have two options. In one case, you can specify the width
    as a fixed number of pixels; the width stays no matter what the browser window
    size.


    ![](img/eb7bf63026b0f3188f312686de439a8a_125_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_125_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_125_2.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# 3.


    You can also specify table width as a percentage of the browser window. In this
    case, the width varies depending on the width of the browser window, and the table
    cells adjust accordingly.


    ![](img/eb7bf63026b0f3188f312686de439a8a_126_0.png)


    # 4.


    In the Border field, enter a number that specifies the width of the table’s outer
    border. If you enter “6”, for instance, the border will be 6 pixels wide. The
    border will have a highly visible “beveled” appearance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_126_1.png)


    # 5.


    If you change the border width to 0, the table will have no visible border.


    The setting in the Border box does not control the width of the border between
    cells—that’s cell padding.


    ![](img/eb7bf63026b0f3188f312686de439a8a_126_2.png)'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Insert Table without Using the Dialog Box


    If you want to insert a table without having to specify these options first, select
    Edit|Preferences to open the Preferences dialog box. Make sure General preferences
    are displayed. Deselect Show When Inserting objects box. Click on OK to close
    Preferences. Now when you insert|Table or drag the Table icon from the Objects
    panel into the Document Window, the table will appear immediately.


    ![](img/eb7bf63026b0f3188f312686de439a8a_127_0.png)


    The table that appears immediately will have the same settings as the table you
    most recently created. You can modify the table settings, as explained later in
    this chapter.


    # Adding Content to Cells


    Once you''ve created a table and have established the general configuration, the
    next logical step is to add content to the individual cells within the table.


    # Type Text


    Position the text cursor anywhere within a cell, then click. The cursor appears
    within the cell so you can begin entering text.


    ![](img/eb7bf63026b0f3188f312686de439a8a_127_1.png)


    # Format Table-Cell Text


    You can format the text within a table cell the same way you format text in any
    other part of a Web-page file: Position the text cursor within the cell, then
    choose Modify|Selection Properties to display the Property Inspector if it''s
    not displayed already.


    ![](img/eb7bf63026b0f3188f312686de439a8a_127_2.png)'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Organizing Web-Page Content with Tables


    Turn Off Wrap

    Normally, when you add text to a table cell, the text wraps at the end of each
    line. You, however, disable word wrap. This forces the table cell to expand to
    fit the text. Click on the cell, then check the No Wrap box in the Property Inspector.


    Novels, short stories, articles


    Wrap


    Novels, short stories, articles


    No Wrap


    Copy and Paste Content

    Another way to add text or images to a table cell is to copy and paste. Copy the
    contents to the clipboard, paste the position cursor in the cell where you want
    the contents to appear, and choose Edit|Paste or press Ctrl+V (Cmd+V for you Macintosh
    users). The contents appear in the table cell.


    If the contents you are pasting are wider than the table cell, the cell width
    adjusts to accommodate what you''ve pasted.


    ![](img/eb7bf63026b0f3188f312686de439a8a_128_0.png)


    Insert an Image

    You can, of course, insert an Image into a table cell the same way you''d add
    the image to another part of a Web page. Just position the cursor in the desired
    cell, then choose Insert|Image. When the Select Image Source dialog box appears,
    locate the image you want, click on its icon, and click on Select to add the image
    to the table cell.


    You can also add interactive images such as rollovers (select Insert|Interactive
    Image) to table cells, as well as many of the other options shown in the Insert
    menu.


    ![](img/eb7bf63026b0f3188f312686de439a8a_128_1.png)'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Importing Table Data


    You can import spreadsheet or database information into a Dreamweaver table, provided
    you are working with a spreadsheet file, the content is comma or tab delimited.
    You need to save it as a data file that you can import into Dreamweaver.


    # 1.


    If you want to import spreadsheet data such as an Excel or Access file, save the
    file as Text (tab delimited) or CSV (comma delimited) or a similar format.


    ![](img/eb7bf63026b0f3188f312686de439a8a_129_0.png)


    # 2.


    Open the Dreamweaver Document Window that contains the page where you want to
    insert data. Position the cursor where you want the table to appear and select
    Insert|Tabular Data.


    You can also choose File|Import|Tabular Data. If you do this, the Insert Table
    Data dialog box appears, but it''s the same as the Insert Tabular Data dialog
    box described in Step 3.


    ![](img/eb7bf63026b0f3188f312686de439a8a_129_1.png)


    # 3.


    The Insert Tabular Data dialog box appears. In the Data File field, enter the
    name of the data file you saved earlier, if you know it. Choose the delimiter
    you used from the delimiter drop-down menu. Choose Fit To Data if you want the
    table size to be determined automatically by the content. Otherwise, click on
    the Set button and choose a width. Add specifications in the other fields if you
    want to establish the table appearance before you create it. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_129_2.png)


    If you don''t know the name of the data file, click on Browse to open the Open
    dialog box. Locate the file, select it, and click on Open.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Organizing Web-Page Content with Tables


    # 4.


    The table appears where you inserted it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_130_0.png)


    # Changing Table Properties


    Up to this point, you''ve learned about Dreamweaver''s different options for inserting
    tables in a Web page. Once you''ve made a table, the fun begins. You can apply
    colors and other design features to a table to make it an integral part of your
    Web page''s appearance.


    # Selecting Parts of a Table


    To make changes to one or more table cells, you need to select them. It can sometimes
    be tricky to select just the parts of a table you want. Individual cells aren''t
    highlighted clearly as images as you click on them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_130_1.png)


    # Select an Entire Table


    To select the entire table quickly by clicking on the upper-left corner when the
    mouse turns into a four-headed arrow. Alternatively, click anywhere in the table
    and select Modify|Table|Select Table or press Ctrl+A.


    ![](img/eb7bf63026b0f3188f312686de439a8a_130_2.png)


    # Select a Row or Column


    One way to select all the cells in a row or column involves bringing mouse pointer
    close to the edge of the row or column. When the pointer turns into a black arrow
    pointing into the cell, click the mouse button. The row or column is selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_130_3.png)'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Chapter 5


    Drag across Table Cells


    Click in one cell, hold down the mouse button, and drag across adjacent cells
    in order select more than one.


    You can also select multiple adjacent cells by clicking in one cell, then holding
    down the Shift key and clicking in the other cells as needed.


    # Select Nonadacent Cells


    If you need to select cells in different parts of the table, click in the first
    cell, then hold down the Ctrl key (Windows) or the Cmd key (Mac) in the other
    cells you want to select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_131_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_131_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_131_2.png)


    # Changing Table Dimensions


    Once you know how to select a table or the cells within it, you can change it
    in any way you want. One way is to first select the table, then change options
    within the Property Inspector. After you make a change, click on the Table icon
    on the left side of the Property Inspector; The Table icon functions as the Apply
    button.


    If you select an entire table, you can click and drag one of the selection handles
    to change the table size.


    # Remove Rows and Columns


    The options in the submenu appears when you click in a table and choose Modify|Table
    gives you lots of control over the properties of a table. If you ever want to
    remove rows or columns from a table, click in the rows or columns and then choose
    Modify|Table|Delete Row or Delete Column.


    ![](img/eb7bf63026b0f3188f312686de439a8a_131_3.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_131_4.png)


    104'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Add Rows and Columns


    Adding rows or columns to a table is a little more tricky than removing them.
    The trick is in where the new column or row appears. For instance, if you click
    in the bottom row of a cell and choose Modify|Table|Insert Row, the new row appears
    after the selected row. If you want the row to appear after the selected row,
    choose Modify|Table|Insert Rows Or Columns.


    | Name | Dates | Type of Writing |

    |---|---|---|n| George Ade | 1866-1944 | Newspaper columns, plays |

    | Nelson | 1909-1981 | Novels, short stories, articles |

    | Sherwood Anderson | 1876-1941 | Novels, short stories |

    | Fisher Peter Dunne | 1867-1936 | Newspaper columns featuring "Mr. Dooley" |


    # Control New Row or Column Location


    When you choose Modify|Table|Insert Rows Or Columns, the Insert Rows Or Columns
    dialog box appears. The options at the bottom of the dialog box change depending
    on whether Rows or Columns is selected. If Rows is selected, you can specify that
    the row appear above or below the current selection. If Columns is selected, you
    can specify the new column appear before or after the current selection.


    ![](img/eb7bf63026b0f3188f312686de439a8a_132_0.png)


    # Change Column or Row Size


    Suppose you want to make one column slightly wider or narrower than the others
    in the table. Select the column, then let your mouse arrow hover over one of the
    column borders. When the arrow changes into a two-headed arrow, click and drag
    the border to change the column size.


    | Name | Dates | Type |

    |---|---||

    | Algen | 1909-1981 | Novels, short stories, articles |


    Clicking and dragging works not only with rows and columns, but also with individual
    cells.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Change Column or Row Span


    By default, a cell spans a single row or column. A cell''s span can be adjusted,
    however, so that it spans two or more adjacent cells.


    # 1.


    Select the cell that you want to span two or more columns or rows. You can simply
    click anywhere in the cell you want to change.


    ![](img/eb7bf63026b0f3188f312686de439a8a_133_0.png)


    # 2.


    If you want the cell to become wider, choose Modify|Table|Increase Column Span.
    (Choose Modify|Table|Decrease Column Span to reduce the cell''s width.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_133_1.png)


    # 3.


    If you want the cell to become deeper, choose Modify|Table|Increase Row Span.
    (Choose Modify|Table|Decrease Row Span to reduce the cell''s depth.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_133_2.png)


    # Split Cells


    Splitting a cell is pretty much the same as decreasing its row or column span.
    To split a single cell into two separate cells, click in the cell, then choose
    Modify|Table|Split Cell (or press Ctrl+Alt+S) to open the Split Cell dialog box.
    Select Rows or Columns, specify the number of rows or columns you want to create,
    and click on OK to split the cells.


    ![](img/eb7bf63026b0f3188f312686de439a8a_133_3.png)'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Organizing Web-Page Content with Tables


    Merge Cells

    When you merge cells, you combine two or more cells into a single, larger one.
    Select the cells you want to combine, then select Modify|Table|Merge Cells to
    combine them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_134_0.png)


    # Dreamweaver’s Preset Tables


    A quick and elegant shortcut to redesigning a table you’ve already inserted is
    to use one of Dreamweaver’s preset layouts.


    1.

    Select the table you want to rearrange and choose Commands|Format Table.


    ![](img/eb7bf63026b0f3188f312686de439a8a_134_1.png)


    2.

    The Format Table dialog box appears. Click on one of the options listed in the
    box on the upper left (such as Simple1,Simple2, and so on) to see the corresponding
    table design scheme illustrated. The design schemes include different, attractive
    combinations of colors and fonts that are used to distinguish rows and columns.


    ![](img/eb7bf63026b0f3188f312686de439a8a_134_2.png)'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 3.


    You can modify a selected table design, if you wish, by selecting options from
    the fields and menus in the bottom half of the Format Table dialog box. When you''re
    finished, click on OK.


    | Row Colors | First: #CC9900 | Second: #CCCCCC |

    |---|---||

    | Alternate | Every Other Row | |

    | | not alternate | Text Style: Italic |

    | Top Row | Align: Every Other Row | |

    | | Every Two Rows | |

    | Bg Color | Text Color: #CC9900 |

    | LetCol | Align: None | Regular |

    | Border | 0 |

    | Options | Apply All Attributes to Td Tag Instead of TR Tags


    # 4.


    The table is modified according to the scheme you specified.


    # Designing a Web Page with Tables


    The enterprise Web-page designer can use tables to arrange an entire page, or
    a large portion of a page, by setting the table border 0 to make the table outline
    inline and filling some table cells with blank space so they act as empty columns
    that add more white space to a page. But it''s awkward and tedious to use this
    way. Dreamweaver, however, gives you Layout View for easily designing pages using
    tables.


    ![](img/eb7bf63026b0f3188f312686de439a8a_135_0.png)


    # Using Layout View


    To start using Layout View, select View|Table|Layout View or click on the Layout
    View button at the bottom of the Objects panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_135_1.png)


    # 1.


    The first time you use Layout View, the Getting Started In Layout View dialog
    box appears. Read it and click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_135_2.png)'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Organizing Web-Page Content with Tables


    2.

    Use the two buttons in the Layout section of the Objects panel to draw table elements
    directly on the Web page being displayed in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_136_0.png)


    3.

    Click on the Draw Layout Cell button, then click in the Document Window. The pointer
    turns into a plus sign (+) when it passes over the Document Window. Drag down
    and to the right to draw an individual cell.


    ![](img/eb7bf63026b0f3188f312686de439a8a_136_1.png)


    4.

    When you release the mouse after drawing the table cell, a larger box appears
    around it outlined in green. The larger container is, in fact, a table that Dreamweaver
    creates to contain the table cell. By default, the cell appears outlined in blue.


    ![](img/eb7bf63026b0f3188f312686de439a8a_136_2.png)


    To create multiple table cells without having to click on the Draw Layout Cell
    button each time, hold down the Ctrl key (Windows) or Cmd key (Mac) as you draw.


    5.

    The cell you draw doesn''t have to be exactly the right size. Click on the cell
    to select it, then change settings in the Property Inspector to adjust the cell
    properties.


    ![](img/eb7bf63026b0f3188f312686de439a8a_136_3.png)'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 6.


    To draw an entire table, click on the Draw Layout Table button in the Objects
    panel, then click in the Document Window and drag down to the right.


    To create multiple tables without having to click on the Draw Layout Table button
    each time, hold down the Ctrl key (Windows) or Cmd key (Macintosh) as you draw.


    # 7.


    The tables or cells you can draw be filled with content, as described earlier
    in this chapter. However, Layout View becomes powerful when you insert cells or
    tables that don''t have any contents—their purpose is to create empty space on
    the Web page in order to give the page additional graphic interest.


    # Adding Spot Color to a Table


    The cells in a table can contain images as well as text, and the colors of individual
    cells can be different from the colors of the cells around them. This sets up
    some attractive options for designers.


    # 1.


    Click on the cell to which you want to add color to select it.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 2.


    In the Property Inspector, click on the Back-ground (Bg) button and select a color
    from the color selection box that appears. The color is added to the cell.


    ![](img/eb7bf63026b0f3188f312686de439a8a_138_0.png)


    # 3.


    Preview the page to see how the color appears; make sure the color complements
    the type or images within the cell.


    ![](img/eb7bf63026b0f3188f312686de439a8a_138_1.png)'
