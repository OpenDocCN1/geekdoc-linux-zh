- img_proc: true
  md: '# Understanding Behaviors


    The Web page “behaviors” you''re probably best acquainted with, at a beginning
    level, involve what happens when someone clicks on a link: A new page appears,
    an image loads, the viewer''s browser jumps to a new location (either in the current
    page or another page), and so on.


    # Common Mouse Events


    Dreamweaver, however, lets you integrate JavaScript behaviors and effects into
    your Web pages without having to learn this low-level Web programming language.
    You can create common JavaScript effects such as the mouseovers shown on the online
    bookstore pages operated by your book''s publisher. Pass your mouse over one of
    the categories on the left, and a new menu pops up.


    # Behaviors, Events, and Actions


    Behaviors do not occur in a vacuum. A behavior, in reality, is the result of a
    combination of things: An event happens to an object associated with a behavior.
    Usually, an event is the user using the object or Web page, such as onMouse or
    onClick, which is JavaScript''s description of the user does. An event can also
    be the JavaScript onload, which is the loading of a Web page by a browser. An
    action is what happens when the event occurs on the Web page you''ve created.
    A partial list of the approximately dozen actions Dreamweaver supports is shown
    here.


    ![](img/eb7bf63026b0f3188f312686de439a8a_187_0.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_187_1.png)


    When you assign an action to an object, you''re actually using Dreamweaver to
    add JavaScript to your Web page “behind the scenes.” If you know JavaScript, you
    can assign many more actions than the ones Dreamweaver supports. Choose WindowReference
    to display the Reference panel, where you can find out more about the JavaScript
    language.


    Get More Behaviors...'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# # Adding Behaviors


    The Behaviors panel controls and tracks the behaviors you assign to parts of a
    Web page. Select Window|Behaviors or press Shift+F3 (Cmd+F3 on a Mac) to display
    the Behaviors panel.


    The terms behaviors and events are used interchangeably in Dreamweaver''s Help
    files, which can be confusing. In this chapter, "behaviors" are combinations of
    actions and events. Both actions and events are listed in Dreamweaver''s Behaviors
    panel. Events are the things that occur (such as mouse clicks or page loads) that
    trigger one or more actions (such as popup messages).


    ![](img/eb7bf63026b0f3188f312686de439a8a_188_0.png)


    # # Actions Related to Selected Objects


    If you select an object in a Web page and click on the plus (+) in the Behaviors
    panel, a list of the possible actions you can associate with that object. The
    behaviors that are "lit up" (that is, highlighted) in the dropown list are the
    ones that pertain to the object selected. If you select a word or phrase, for
    instance, only text-related actions are activated.


    ![](img/eb7bf63026b0f3188f312686de439a8a_188_1.png)


    # # Third-Party Behaviors


    If you select Get More Behaviors from the dropdown list that appears when you
    click on the plus (+) in the Behaviors panel, your default browser connects to
    the Macromedia Exchange page, where you can access behaviors that others have
    developed.


    ![](img/eb7bf63026b0f3188f312686de439a8a_188_2.png)'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Attaching Behaviors


    Behaviors don''t sound simple, but Dreamweaver makes them simple to add to your
    Web pages. This is one place where Dreamweaver earns its keeps by bringing highly
    technical Web-page effects within the reach of nonprogrammers. This chapter will
    get you started by showing you how to attach one action to an event that the user
    causes to occur on an object or Web page. The sequence of creating a Web-page
    behavior is as follows:


    +   1. Identify the Web-page object. The object can be a link, an image, a layer,
    or the body of the Web page. You can''t attach a behavior to plain text, however.


    +   2. Associate the event that users should perform on the object. It doesn''t
    have to involve a mouseover or click; the event can be the act of loading the
    body of the Web page itself. When the page loads, a pop-up message can appear,
    for instance.


    +   3. Determine the action that should occur when the event occurs. You can assign
    more than one action to an event; you can also determine the order in which the
    actions occur.


    The following steps illustrate this object-action-event sequence.


    1. First, have a general idea of the action you''d like to occur. Do you want
    a message or window to appear when the user loads (or reloads) the page? If so,
    click on the <BODY>-tag in the tag selector in the status bar at the bottom of
    the Document Window. For specified objects, select the object itself. For example,
    click on an image to select it.


    ![](img/eb7bf63026b0f3188f312686de439a8a_189_0.png)


    2. Choose Window|Behaviors to display the Behaviors panel. The main content area
    of the panel initially appears blank unless you''ve previously associated an action
    with the selected object. However, the title bar of the Behaviors panel displays
    the HTML tag (in this case,<IMG>) of the selected object.


    ![](img/eb7bf63026b0f3188f312686de439a8a_189_1.png)'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Adding Behaviors


    # 3.


    Click on the plus sign (+) in the Behaviors panel to specify an action that you
    want to associate with the object (in this case, an image). The options that appear
    are those that can be associated with the type of object selected.


    ![](img/eb7bf63026b0f3188f312686de439a8a_190_0.png)


    # 4.


    Select an action from the list. Dreamweaver presents you with a dialog box or
    message that either provides you with further information about the action or
    asks you to provide more information. If you select Popup Message, for instance,
    the Popup Message dialog box appears. Enter a message that you want to appear
    when the user acts (that is, clicks or does a mouseover) on the image, and click
    on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_190_1.png)


    # 5.


    The selected action appears in the Actions column of the Behaviors panel. The
    event that triggers the action—onMouseOver—appears in the Events column of the
    Behaviors panel by default.


    ![](img/eb7bf63026b0f3188f312686de439a8a_190_2.png)'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 6.


    If you want to change the default event that triggers the action you selected,
    click on the drop-down menu arrow between the name of the event and the name of
    the action; a list appears with events that you can associate with the action
    instead of the default event.


    ![](img/eb7bf63026b0f3188f312686de439a8a_191_0.png)


    # 7.


    If you want to specify certain browsers to which the selected event will apply,
    click on Show Events For and choose a type of browser from the additional pop-up
    list that appears. When you make the selection, the pop-up list disappears. Click
    on the drop-down list menu once again and a different set of events appears. If
    you choose a widely used browser such as IE (Internet Explorer) 4, the list could
    be much longer than before.


    Different user-created events work only in certain browsers. All of Dreamweaver''s
    built-in events work with Netscape Navigator version 4 or higher and Internet
    Explorer version 4 or higher, but some events (instance, onMove) work only with
    Navigator, and others (onRowEnter and onRowExit) will appear only in Internet
    Explorer. Consult the Dreamweaver Help files for a full list of events and which
    browsers support them.


    ![](img/eb7bf63026b0f3188f312686de439a8a_191_1.png)'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 8.


    Choose File|Save to save your changes. Choose File|Preview In Browser or press
    F12 to preview the page you can test the behavior.


    If you''re curious about what you''ve just done, open the HTML Inspector commands
    that have been added. (This is a good way to learn some basic JavaScript, by the
    way.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_192_0.png)


    # 9.


    If you need to change or delete the behavior later, reopen the Web page in the
    Document Window, then select the object to which the event and action are attached.
    Choose Window|Behaviors to display the Behaviors panel, then select the event/action
    set itself. Press the Delete key to delete the event/action if you want to, or
    click on the drop-down arrow and select a different event.


    ![](img/eb7bf63026b0f3188f312686de439a8a_192_1.png)


    If you want to change the action, you''ll need to delete the event/action then
    reattach a new event and action to the selected object. If, however, you want
    to edit an action, double-click on the action''s name, then enter new information
    in the dialog box that appears. To change the order of actions (if you have attached
    more than one to an object), select the event/action and then click on the up
    or down arrow in the Behaviors panel.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Swapping Images


    In Chapter 4, you learned how to make a simple rollover, a behavior in which one
    changes into a second image when the viewer passes the mouse arrow over it. In
    example, you used the Insert|Interactive Images|Rollover Image command from the
    Document menu bar to start creating the rollover effect.


    When you use the Behaviors panel, you can choose the Swap Image option. Swap Image
    enables you to create a behavior that is the same as a rollover. One difference
    is that, when you use Swap Image, you have to name both images beforehand.


    ![](img/eb7bf63026b0f3188f312686de439a8a_193_0.png)


    ```

    JavaScript

    Change Property

    Check Browser

    Check Page

    Create Slideshow or Flash

    Embed

    Go To URL

    Jump to To/Go

    Open Browser Window

    Play Sound

    Popup Message

    Println Image

    Set Nav Bar Image

    Set Text

    Hide Tool

    ```


    # 1.


    Create the two separate images you want to use for the Swap Image behavior. Give
    them different file names.


    ![](img/eb7bf63026b0f3188f312686de439a8a_193_1.png)


    # 2.


    Insert the first image into your Web page and select it. Enter a name for the
    image in the Image text box in the Property Inspector, then press Enter/Return.


    Even though you''ve given the image a file name, you need to give it a name in
    the Property Inspector for the Swap File effect to work.


    ![](img/eb7bf63026b0f3188f312686de439a8a_193_2.png)


    # 3.


    With the image still selected, choose Window|Behaviors to display the Behaviors
    panel, if needed. Click on the plus sign (+) and choose Swap Image from the drop-down
    menu. The Swap Image dialog box appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_193_3.png)'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Adding Behaviors


    4.

    The Swap Image dialog box displays the name of the selected image as any others
    on the currently displayed page. In the Set Source box, enter the name of the
    second image (the one you want to swap for the first one) or click on Browse and
    locate the second image in the Select Source dialog box. Then click on Select
    to choose the Select Source dialog box and return to the Swap Image dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_194_0.png)


    5.

    The name of the second image (as well as the path leading to that image) appears
    in the Set Source box in the Swap Image dialog box. Click on OK.


    ![](img/eb7bf63026b0f3188f312686de439a8a_194_1.png)


    > If you want Dreamweaver to load the images along with the Web page, select the
    Preload Images checkbox. If you want the first image to revert to its original
    appearance when the mouse arrow is no longer over it, check the Restore Images
    onMouseOut checkbox.


    6.

    in the Behaviors panel, the Swap Image behavior is listed. If you checked Restore
    Images onMouseOut, that second behavior is listed as well.


    ![](img/eb7bf63026b0f3188f312686de439a8a_194_2.png)


    7.

    Choose File|Save to save your changes, then preview your page to test the behavior.


    ![](img/eb7bf63026b0f3188f312686de439a8a_194_3.png)'
  merge: -1
