  md: '# Project 2: Create a Targeted Frame


    In the first project in this chapter, you divided a page into frames. When they
    are interlinked so that a link in one frame targets another frame, they can help
    a user navigate a site. You can make the target a new window, or even the same
    frame that contained the originating link, as you''ll see in this project.


    # Naming Your Frames


    It may seem confusing, but each frame in a frameset has two names: a file name
    (for example, linkframe.htm) and a frame name (such as LinkFrame). When you create
    a link and identify a target frame in which you want the linked contents to appear,
    you point to the target frame''s name.


    # 1.


    Open the frameset created in the preceding project. Choose Window|Frames or press
    Shift+F2 (in both Windows and the Mac) to display the Frames panel if it''s not
    already on.


    ![](img/eb7bf63026b0f3188f312686de439a8a_323_0.png)


    # 2.


    Click on one of the frames displayed in the Frames panel to select it. (The border
    of the miniature version of the frame displayed in the Frames panel, as well as
    the frame''s name, is highlighted to indicate that the frame has been selected.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_323_1.png)'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 3.


    Now, choose Modify|Selection Properties or Window|Properties to display the Property
    Inspector if it''s not already displayed. The Property Inspector displays the
    properties for the selected frame; the frame''s name appears in (appropriately
    enough) the frameName box.


    By default, each frame is assigned a name (leftFrame, topFrame, mainFrame, and
    so on), and you can change these if you want to, as shown in this project.


    ![](img/eb7bf63026b0f3188f312686de439a8a_324_0.png)


    # 4.


    Select the frame''s name and enter your own name, if you want to.


    Sometimes, a shorter frame name is even easier to remember than the default.


    ![](img/eb7bf63026b0f3188f312686de439a8a_324_1.png)


    # 5.


    Rename each of the frames in your frameset (or make sure you know the default
    names).


    ![](img/eb7bf63026b0f3188f312686de439a8a_324_2.png)


    In Dreamweaver, no matter which frame is selected, the miniature frames''|image
    always shows the one on the right selected.


    # Adding Frames Content


    Once you''ve named your frames, add content to each one in turn just as you would
    Dreamweaver Web page. (The difference, of course, is that each frame is a Web
    page in its own right.)


    ![](img/eb7bf63026b0f3188f312686de439a8a_324_3.png)


    # 6.


    Click in the top frame to position the text cursor, then select Insert|Image.'
