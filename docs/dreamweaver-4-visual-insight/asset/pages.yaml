  md: '# # Dreamweaver Keyboard Shortcuts

    Keep this handy list of shortcuts close to your keyboard for quick reference.


    | File Menu | Windows | Macintosh | Edit Menu | Windows | Macintosh |

    |---|---|---|---|---|--|

    | New Document | Ctrl+N | Cmd+N | Undo | Ctrl+Z | Cmd+Z |

    | Open | Ctrl+O | Cmd+O | Redo | Ctrl+Y | Cmd+Y |

    | In Frame | Ctrl+Shift+O | Cmd+Shift+O | Cut | Ctrl+Shift+Z | Cmd+Shift+X |

    | Save | Ctrl+W | Cmd+W | or or Shift+Del | or Shift+Del |

    | Save As | Ctrl+Shift+S | Cmd+Shift+S | Copy | Ctrl+C | Cmd+C |

    | Check Links | Shift+F8 | Cmd+F8 | or Ctrl+Ins | or Cmd+Ins |

    | Exit/Quit | Ctrl+Q | Cmd+Q | Paste | Ctrl+V | Cmd+V |


    | Page Views | Windows | Macintosh | Clear | Windows | Macintosh |

    |---|---|---|---|---|--|

    | Standard view | Ctrl+Shift+F6 | Cmd+Shift+F6 | Select All | Ctrl+A | Cmd+A |

    | Layout view | Ctrl+F6 | Cmd+F6 | Parent Tag | Ctrl+Shift+C | Cmd+Shift+<< |

    | Toolbar | Ctrl+Shift+T | Cmd+Shift+T | Select Child | Ctrl+Shift+S | Cmd+Shift+>>
    |


    | Getting Help | Windows | Macintosh | Find | Windows | Macintosh |

    |---|---|---|---|---|--|

    | Using Dreamweaver | F1 | F1 | Find And Replace | Ctrl+F | Cmd+F |

    | Reference | Shift+F1 | Shift+F1 | Next | Ctrl+G | Cmd+G |

    | Support Center | Ctrl+F1 | Cmd+F1 | Balance Braces | Ctrl+'' | Cmd+'' |


    | Editing Text | Windows | Macintosh | Viewing Page | Windows | Macintosh |

    |---|---|---|---|---|--|

    | Create a new paragraph | Enter | Return | Visual Aids | Ctrl+Shift+I | Cmd+Shift+I
    |

    | Insert line break | Shift+Enter | Shift+Return | Rulers | Ctrl+Alt+R | Cmd+Option+R
    |

    | Insert nonbreaking space | Ctrl+Space | Option+Space | Show Grid | Ctrl+Alt+G
    | Cmd+Option+G |

    | Add selected items to library | Ctrl+Shift+B | Cmd+Shift+B | Snap To Grid |
    Ctrl+Shift+G | Cmd+Option+G |


    | Finding | Windows | Macintosh | Inserting Objects | Windows | Macintosh |

    |---|---|---|---|---|--|

    | Replacing Text | Ctrl+F | Cmd+F | Image | Ctrl+Alt+I | Cmd+Option+I |

    | Find Next/Again | F3 | Cmd+3 | Table | Ctrl+Alt+T | Cmd+Option+T |

    | Replace | Ctrl+H | Cmd+H | Flash movie | Ctrl+Alt+F | Cmd+Option+F |

    | | | | Shockwave Director | Ctrl+Alt+D | Cmd+Option+D |


    | Working with Images | Windows | Macintosh | Targeting/Previewing | Windows |
    Macintosh |

    |---|---|---|---|---|--|

    | Change source attribute | Double-click on image | Double-click on image | Preview
    in primary browser | F12 | F12 |

    | Edit image in external editor | Ctrl+double-click on image | Cmd+double-click
    on image | Preview in secondary browser | Ctrl+F12 | Cmd+F12 |'
