  md: '# # Using Background Images with Text


    Dreamweaver allows you to preview background images as they will appear on your
    Web site, to make sure you get the look you want. At the same time, it is wise
    to consider your site''s color scheme.


    Since readability is paramount, your background should not fight with text and
    other elements. A proper background complements other.elements while adding an
    interesting textural dimension. The appropriate background may take the form of
    a simple fade, a combination of background image and solid colors, a tiled image
    for a "wallpaper" effect, or a full-frame image.


    You''ll find tips for creating and incorporating background images in Chapters
    4 and 12.


