  md: '# Customizing Launcher and Launcher Bar Preferences


    The Launcher is a panel that contains buttons for closing and opening (or launcher)
    Dreamweaver panels. Click on a button and the corresponding panel opens; click
    again and the open panel closes.


    Default Launcher Buttons


    The default buttons contained in both the Launcher and its miniature version,
    the Launcher bar in the status bar, can be customized to include controls for
    the tools you use most often.


    ![](img/eb7bf63026b0f3188f312686de439a8a_57_0.png)


    The following list includes some of the common buttons you''re likely to encounter
    as follows:


    +   - Site—Opens the Site Window, which you can use to visually track the arrangement
    of Web pages in the current site as it is contained on your local hard disk.

    - HTML Styles—Opens the HTML Styles panel, in which you assign styles or create
    new ones.

    - CSS Styles—Controls the CSS Styles options, which you can use to track any custom
    style sheets you attach to a Web page or a site.

    - Code Inspector—Opens the Code Inspector, with which you can view and quickly
    edit the HTML code for the current page.'
