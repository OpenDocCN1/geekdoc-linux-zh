  md: '# Viewing the Site Map


    When the Site Window opens for the site just defined, you see a simple list of
    the files and folders contained in the site.


    The Local Folder pane of the Site Window is divided into columns with the standard
    headings Local Folder, Notes, Size, Type, Modified, and Checked Out By. You can
    delete some of these headings or add new ones by opening the Site Definition dialog
    box, clicking on File View Columns to view the column heading names, and clicking
    the plus sign (+) or minus (-), respectively, to add or delete names.


    # 4.


    +   Click on the Site Map button on the Site Window toolbar to view a visual representation
    of the site in the left pane of the Site Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_343_0.png)


    # 5.


    Check the links on your pages by choosing Site|Check Links Sitewide or by pressing
    Ctrl+F8 (Cmd+F8 on a Mac).


    ![](img/eb7bf63026b0f3188f312686de439a8a_343_1.png)


    # 6.


    The links in the site are reviewed, and the Checker dialog box appears with a
    report on the state of your links.


    ![](img/eb7bf63026b0f3188f312686de439a8a_343_2.png)'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# 7.


    To fix a broken link (a link to a file not found on the local disk), double-click
    on it. The Properties Inspector appears. Enter the correct URL for the link in
    the Link box or click on the folder icon next to the link box and navigate to
    the file you need to link.


    ![](img/eb7bf63026b0f3188f312686de439a8a_344_0.png)


    # 8.


    When you''ve repaired your links, the Site Window by clicking on its close box.
    Click on the Document Window to make it active. Choose Window|Assets or press
    F11 to open the Assets panel.


    # 9.


    Click on the Images icon on the left side of the Assets panel to view your site''s
    images.


    # 10.


    Create or add the "Send Us Feedback!" image shown here (created in an image-editing
    program) to all of the pages in your site. Other images that can be added include
    notices.


    ![](img/eb7bf63026b0f3188f312686de439a8a_344_1.png)'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 11.


    Refresh the Assets panel to display the image by clicking on the Refresh Site
    List. Make the Document Window visible as well as the Assets panel.


    ![](img/eb7bf63026b0f3188f312686de439a8a_345_0.png)


    # 12.


    Scroll down the page in the Document Window until you reach the spot where you
    want the image to appear. Click in the location, then click on the Insert button
