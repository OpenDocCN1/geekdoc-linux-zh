- img_proc: true
  md: '# Aligning Paragraphs


    You can align individual words or paragraphs (as well as images—see Chapter 4)
    at the left margin at the right margin or you can center them on the page. Select
    the text you want to align, click on the Align Left, Align Center, or Align Right
    buttons in the Property Inspector.


    You can also align text or other objects by selecting them, selecting Text|Align|Left
    (or Center or Right).


    ![](img/eb7bf63026b0f3188f312686de439a8a_99_0.png)


    # Use the Intent Buttons


    Another way to indent text is to first position the text cursor before the line
    or paragraph you want to indent and click on the Intent button in the Property
    Inspector. You can also select Text|Indent or press Ctrl+Alt+I. Click on Intent
    or select Text|Indent multiple times to indent text from the left margin.


    ![](img/eb7bf63026b0f3188f312686de439a8a_99_1.png)


    The Outdent button next to the Intent button moves indent text back towards the
    left margin. You can also select Text/Outdent or press Ctrl+Alt+[;


    # Adding Horizontal Rules


    Anything you can do to add white space to a Web page and separate the important
    parts of the page from one helps make your content more readable on a computer
    monitor. One of the easiest and most effective ways to divide text on a page is
    to add a horizontal rule.


    # Insert a Page Divider


    To make a horizontal rule, position the cursor at the part of your document you
    want the rule to appear. Press Enter/Return to create a blank paragraph where
    you want to insert the rule; by default, it will stretch across the entire width
    of the Web page and not interfere with your text. Then choose Insert|Horizontal
    Rule to add the line, which has a paragraph break before and after.


    ![](img/eb7bf63026b0f3188f312686de439a8a_99_2.png)'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Change Horizontal Rule Properties


    By default, a horizontal rule appears as an outline rather than a solid black
    line; it also has 3D shading. The rule also stretches across the full width of
    the Web page no matter how narrow or wide the page is. You can change the rule
    to make it a solid black line, or you can change the thickness or width by clicking
    on the rule to highlight it, then selecting ModifySelection Properties to display
    the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_100_0.png)


    # Change Horizontal Rule Width


    The width of the currently selected horizontal rule can be expressed as a measurement
    of pixels or as a percentage of the width of the Web page. A Web page, can be
    resized to be very narrow or very wide.) Select pixels or % from the drop-down
    menu, then enter a measurement in the box next to W to specify a width. Enter
    "100" for a 100-pixel rule or "50" for a rule that takes up 50 percent of the
    width of the Web page.


    ![](img/eb7bf63026b0f3188f312686de439a8a_100_1.png)


    To make a rule solid black, deselect the checkbox next to Shading in the Property
    Inspector. Select an option from the Align drop-down menu to align a rule that
    is shorter to the left or right to center it.


    # Change Horizontal Rule Thickness


    You can change the thickness of a horizontal rule by selecting it, then entering
    a number in the box next to H (height) in the Property Inspector. The number you
    enter represents the height in points—enter "3" for a rule that''s 3 points tall,
    for instance.


    ![](img/eb7bf63026b0f3188f312686de439a8a_100_2.png)'
  merge: -1
