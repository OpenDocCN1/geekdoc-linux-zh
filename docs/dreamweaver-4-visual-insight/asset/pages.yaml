  md: '# Creating a Simple Site


    19.

    Select an item, such as Roman or Alphabet (Roman Small in this example), from
    the Style drop-down list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_252_0.png)


    20.

    Click on OK to change all the numbers in the list at one time.


    ![](img/eb7bf63026b0f3188f312686de439a8a_252_1.png)


    Change the Starting Point

    By default, numbered lists on Web pages start at 1 (or i, or A) and proceed from
    there. You might want your list to start at another number, however.


    21.

    Position the text cursor on an item in the list, then select List|Properties to
    open the List Properties dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_252_2.png)


    22.

    In the Start Count text box, enter the number that you want to have as the first
    number in the list, such as 4; then click OK.


    Dreamweaver doesn''t recognize 0 (zero) as a new starting point.


    ![](img/eb7bf63026b0f3188f312686de439a8a_252_3.png)'
