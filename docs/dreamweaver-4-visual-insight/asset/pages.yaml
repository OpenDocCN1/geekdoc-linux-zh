  md: '# Dreamweaver’s Site Management Tools


    Many applications give you the ability to format individual Web pages and link
    them to other Web pages, but only a few programs (Dreamweaver being one of them)
    let you graphically view all the pages in a site and streamline the process of
    changing links and making other changes across an entire site.


    Dreamweaver’s capabilities include several tools for managing entire Web sites
    at once—such as the Site Map for viewing how pages are linked to one another,
    the Link Checker for checking any links that don''t work, the Assets panel for
    viewing many recurring Web site components across an entire site, and library
    files for adding standard text to multiple pages—which are described in detail
    in Chapter 10. In this chapter, you’ll create projects that incorporate online
    editing, inserting text, and moving multiple Web pages to simplify the process
    of Web site management.


    # Project 1: Manage Your Web Site’s Assets


    In Chapter 1, you learned how to create some of the many types of Web-page files
    that Dreamweaver regards as a Web site’s assets. You also learned how to use the
    Assets panel to view your site’s assets and add them to a list of favorites (files
    you want to use often). In this project, you’ll learn how to move assets from
    one site to another and how to change a link on several pages at a time.'
  merge: -1
  pgno: 341
- img_proc: true
