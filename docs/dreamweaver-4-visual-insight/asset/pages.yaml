  md: '# About the Authors


    Greg Holden makes his living as a writer. Explaining technical subjects in understandable
    ways is what he''s best known for in the computer world. Together with authoring
    columns and books, he prepares documentation for companies and creates online
    courses. As founder and president of a small business called Stylus Media, he
    produces a variety of both print and electronic publications. His previous books
    for the Coriolis Group includes Windows 98 Registry Little Black Book, Apache
    Server Server Commentary. Among the publications that have recently given him
    the most delight are those that have been written and illustrated by his daughters,
    Zosia and Lucy Holden. He also took a short break from computer-related material
    to write Literary Chicago: A Book Lower''s Guide to the Windy City, which will
    soon be published by Lake Claremont Press. He is an active member of Jewel Heart,
    a Tibetan meditation and study group based in Ann Arbor, Michigan. To find out
    more about Greg, visit his personal and business Web sites at www.gregholden.com,
    or send email to greg@gregholden.com.


    Scott Wills is principal of Scott Wills & Associates, a communications design
    firm in Chicago, where he has practiced, taught, and studied graphic communication
    since 1980. His office is in the Victorian row house where he lives with his wife,
    actress Betsey Means; his daughter, Emily; his father, Gordon; and various creatures.
    Scott''s other foray into authoring include Computer Tips for Artists, Designers,
    and Desktop Publishers and Tips on Type, both published by W.W. Norton. As of
    this writing, his Web site is "under construction".'
