  md: '# Setting Up Targeted Frames


    Once you have designed frames that look the way you want them to look and have
    the content you want to have, you can make them interact with one another. Frames
    become interactive when a click on a link in one frame causes content to appear
    in another frame (or in the same frame that contains the link).


    # Name Frames


    To target a frame so that it responds to a link, you first need to name each frame
    in your frameset (or at least know what the standard names are). By default, frames
    are given generic names. The name appears in the Frame Name box in the Property
    Inspector. In the three-frame standard layout Left Top, the top frame is called
    topFrame, the left frame is called leftFrame, and the bottom frame is called main.
    You can either keep the default names or enter new, clearer names in each frame''s
    Frame Name box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_183_0.png)


    # Target Links


    Once each frame has a name you are satisfied with, you can associate a frame with
    a link. Either click on an existing link or create a new one. In the Target box
    in the Property Inspector, enter the name of the frame you want to target.


    # Test a Targeted Link


    Press Enter/Return to make the link. Save the page and preview it; when you click
    on the link, the Web page that is associated with the link appears in the frame
    you targeted.


    ![](img/eb7bf63026b0f3188f312686de439a8a_183_1.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_183_2.png)'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Dividing Pages into Frames and Columns


    Set Targets

    You can set targets for links that do more than just open the linked Web page
    in a specific frame. By clicking on the Target drop-down menu in the Property
    Inspector, you can choose one of four special targeted links (as well as any other
    frames in the current frameset):


    +   - _blank—Opens the link in a new blank browser window.

    - _parent—Opens the link in the parent frame when you have a nested frameset.

    - _self—Opens the link in the same frame that contains the link.

    - _top—Opens the link in a new window, replacing the current one.


    # Setting No-Frames Content


    Not all Web browsers display frames. Those that won''t simply display a blank
    page instead of your nicely designed frameset—unless you have prepared some content
    that which Dreamweaver calls no-frames content. Web browsers that don''t display
    frames will display the content you provide. Tables often provide a good alternative
    to frames (see Chapter 5 for more information on tables). Select Modify|Frameset|Edit
    NoFrames Content to open a blank no-frames page. You can then create the frames
    alternative.


    ![](img/eb7bf63026b0f3188f312686de439a8a_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Combining Behaviors with Frames


    Several dynamic Web page behaviors (see Chapter 9) work with frames. For instance,
    you can use the behavior called Go To URL to open content in two different frames
    at once with a single mouse click. Select the text or object you want to target
    (such as a link). Then choose Window|Behaviors to open the Behaviors panel. Click
    on the plus sign (+), and choose Go To URL from the drop-down list of behaviors.


    Associate Frames with Behaviors

    Select a frame from the list of frames displayed in the Go To URL dialog box.
    Enter the URL of the document you want to open in the selected frame when the
    user clicks on the link. Click on OK. Keep the link selected, and repeat the previous
    step and this one for associating another frame in the frameset.


    ![](img/eb7bf63026b0f3188f312686de439a8a_185_0.png)'
  merge: -1
  pgno: 185
