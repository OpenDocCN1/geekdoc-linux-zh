  md: '# # Navigation Bars


    Navigation bars may take numerous forms, from the simplest text links to button
    bars incorporating text and images to image maps and more complex JavaScript image
    sets. The images themselves must be created in image-editing programs, Dreamweaver''s
    tools bring all the assets of a navigation device together. You may apply a custom-written
    behavior, in addition to Dreamweaver''s prepared behaviors, to a navigation bar.
    The key to a successful navigation bar is simplicity, with functions and outcomes
    that''re easily understood by the user.


    You can learn more about creating a navigation bar in Chapter 13.


    ![](img/eb7bf63026b0f3188f312686de439a8a_224_0.png)


    Simple text links


    ![](img/eb7bf63026b0f3188f312686de439a8a_224_1.png)


