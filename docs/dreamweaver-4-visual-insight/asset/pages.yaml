  md: '# # Acknowledgments


    The image of a writer has traditionally been that of a solitary figure. With the
    advent of the computer age, my contact with editors and collaborators is usually,
    at best, a series of emails and shared files. So I can scarcely believe my luck
    in finding a qualified and congenial coauthor literally in my back yard. How wonderful
    it was to be able to consult with Scott Wills simply by walking around the corner.
    The book you are holding is the beneficiary of our partnership, but it is the
    giggles of our daughters, who regularly play together, that are the best tributes
    to a very important friendship. Speaking of friends, I want to thank Ann Lindner
    for being in her unusually wonderful usual way. And, on the business side, Lucinda
    Scharbach provided able assistance is gathering permissions. Neil Salkind, Kristen
    Pickens, and David and Sherry Rogelberg of Studio B have been instrumental in
    shaping my career, and I want to express my particular appreciation for their
    help in starting out the new millennium with the best year ever. On this book,
    the staff at Corolis has been great, with particular credit going to Beth Kohler,
    Sally Scott, Michelle Stroup, Greg Turecek, Laura Wellander, Jody Winkler, and
    April Nielsen. I am a most fortunate fellow.


    --Greg Holden


    If anyone besides Greg Holden had invited me to participate in the writing of
    this book, I would have begged off immediately. But thanks to Greg''s availability,
    patience, and astute guidance, the writing process has flowed smoothly between
    the many other projects we''ve both been juggling. Whenever I broke a sweat at
    the mountain of work on my desk, Greg stepped into the breach and helped me to
    find a foothold. Never have I enjoyed a more amiable collaboration. I thank the
    good folks at Studio B for holding down the business end for us, and our editorial
    friends at Corolis for their acumen, especially the unfailingly gracious Sally
    Scott. My thanks, go to WomanLore Productions and to other friends and clients
    for whom I''ve created communication designs, some of which appear on these pages.
    But not least, I want to express my appreciation to the software developers at
    Macromedia for creating a remarkable tool for us all to use.


    --Scott Wills'
  merge: -1
