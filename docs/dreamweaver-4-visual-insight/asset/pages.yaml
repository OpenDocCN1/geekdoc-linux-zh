  md: '# You''re the Director!


    Computers are interactive devices, and, because the World Wide Web is a network
    of computers, anything published there has interactive characteristics. In response
    to a user''s input, a Web page can answer a question, show a picture, calculate
    a loan amortization, or perform myriad functions, from simple to complex. The
    possibilities are limited only by the Web designer''s imagination. It is the designer''s
    task to direct the user through the interactive portions of a Web page, orchestrating
    its instruments with the needs of the site''s visitors. It''s like directing a
    movie with actors you''ve never met!


    In Chapters 8 and 9, you learned about using frames, behaviors, and other elements
    to expand the functionality of a Web site. In this chapter, you''ll put some of
    what you just learned to work as you build interactive features into your Web
    pages. So take your seat in the director''s chair, and let''s get started.


    # Project 1: Divide a Page into Frames


    As you learned in Chapter 8, frames are useful design elements to maintain one
    portion of design page in view while the content of other portions changes. Here,
    we will divide a Web site into different frames: one to hold a navigation bar,
    one to display a logo graphic, and one to show content chosen from the menu.


    A frame is basically an individual Web page. A frameset is a group of frames that
    appear together, a way to show several pages at once. You''ll find examples of
    Web page frames in this book''s color section.


    ![](img/eb7bf63026b0f3188f312686de439a8a_311_0.png)'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Making Your Web Site Interactive


    In this first project, you''ll learn to use several of Dreamweaver''s tools and
    methods to divide a Web page into frames, each of which can contain its own unique
    content. You''ll also learn to modify the frames and framesets you create so that
    they work together effectively.


    # Creating Frames by Dragging Borders


    Start by creating some simple frames.


    # 1.


    With a Document Window open, choose View|Visual Aids|Frame Borders to make your
    frame''s borders visible.


    ![](img/eb7bf63026b0f3188f312686de439a8a_312_0.png)


    # 2.


    Enable the Frames panel by choosing Window|Frames. Because there are no frames
    as yet, the Frames panel is blank. As frames are added, you will see a graphic
    image of them in the inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_312_1.png)'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 3.


    To create a new frame, place the cursor on the gray border of the window. Notice
    that the cursor’s arrow becomes a double arrow.


    ![](img/eb7bf63026b0f3188f312686de439a8a_313_0.png)


    # 4.


    ![](img/eb7bf63026b0f3188f312686de439a8a_313_1.png)


