- img_proc: true
  md: '# Create Paragraphs


    A Web paragraph can be a single word, phrase, or many lines of text. Type the
    text you want to be in a paragraph, letting Dreamweaver wrap the text automatically
    at the end of each line. Press Return or Enter on your keyboard. A blank space
    is inserted between the paragraph you just created and the text cursor. If you
    enable the Invisible Elements, you''ll see the paragraph symbol in the Document
    Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_97_0.png)


    # Create Line Breaks


    Line breaks are especially useful for lists of items that aren''t necessarily
    going to be presented as bulleted or numbered lists (covered a bit later in this
    chapter). To create a line break, simply position the text cursor at the spot
    where you want the line break, then press Shift+Enter Insert|Special Characters
    Break. If you enable the Invisible Elements option, you''ll see the line break
    symbol on screen.


    ![](img/eb7bf63026b0f3188f312686de439a8a_97_1.png)


    # Paragraph Format Options


    The options in the Text|Paragraph Format submenu are standard HTML designations
    for body text and headings. Such designations are needed because Web pages are
    intended to be viewed across hardware platforms, operating systems, and different
    Web browsers. Heading 1 is the largest size; Heading 6 is the smallest-estimated.
    Preformatted text appears in a monospaced font as Counter.


    ![](img/eb7bf63026b0f3188f312686de439a8a_97_2.png)


    The 5 and 6 sizes are seldom because they are so hard to read. The convention
    is to use Heading 1 headings at the top of a Web page, Heading 2 beside Heading
    1, Heading 3 beneath Heading 2, and so on, though you can bend the rules to your
    taste.


    ![](img/eb7bf63026b0f3188f312686de439a8a_97_3.png)'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# # Adding Lists


    Inserting a line break after each item in a series or group is only one way to
    create a list. A better way to call attention to a group of textual items is to
    group them into a numbered or other type of Web-page list.


    # Numbered Lists


    In a numbered list (also called an ordered list), each item in a series automatically
    gets a number (or letter or Roman number, as described in Chapter 11). Press Enter/Return
    after each item, select all the items in the list, then click the Ordered List
    button in the Property Inspector to create the list.


    As you can see from the image shown here, you don''t have to select the entire
    contents of a paragraph in order to format it as a list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_98_0.png)


    # Bulleted Lists


    In a bulleted list (also known as an unordered list), each item is preceded by
    a round dot (or a square—see Chapter 11). Press Enter/Return after typing each
    item, select all the list items, then click the Unordered List button in the Property
    Inspector to create the list.


    ![](img/eb7bf63026b0f3188f312686de439a8a_98_1.png)


    # Definition Lists


    A definition list consists of pairs of items. Each pair contains a definition
    term (the term being defined) and the definition itself. You create the list by
    entering the pais, one after another. Press Enter/Return after typing each definition
    term and each definition, select all the items in the list, then select Text|List|Definition
    List to create the list.


    Types of Web-page lists:


    +   - Ordered List

    Contains a series of numbered items

    - Unordered List

    Presents a series of bulleted items

    - Definition List

    Looks pretty much like this list'
  merge: -1
