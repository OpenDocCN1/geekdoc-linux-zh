- img_proc: true
  md: '# Finding and Replacing Text


    One of Dreamweaver''s most powerful features is its ability to search for words
    and replace them with text that you specify. Suppose, in the WomanLore site being
    created in this book, the name has been changed to WomanLore. You can find and
    replace all instances of WomanLore quickly.


    # 1.


    Begin by choosing Edit|Find And Replace, or by pressing Ctrl+F, to display the
    Find And Replace-dialog box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_94_0.png)


    # 2.


    In the box next to the Search For, enter the text you want to find, then click
    on Find Next. If Dreamweaver finds the text, that text is highlighted in the Web
    page currently displayed in the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_94_1.png)


    You can search for part of a word; you don''t have to search for an entire word.


    # 3.


    If you want to replace the text, enter the replacement-text in the Replace With
    box. Check the Match Case if you want Dreamweaver to exactly match the upper-
    and lowercase letters in it finds. Check the box to Ignore Whitespace Differences
    to tell Dreamweaver to ignore white space differences when it finds text. Click
    on Replace to replace the highlighted text Dreamweaver has just found; click on
    Replace All to replace all instances of the search term in the current document.


    ![](img/eb7bf63026b0f3188f312686de439a8a_94_2.png)'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 4.


    You can extend the search-replace coverage to other documents in the same Web
    site by choosing an option from the Find In dropdown menu at the top of the Find
    And Replace dialog box. You can search through the entire Web site that contains
    the document, through selected files in the site, or in all files in the folder
    that contains the Web site that includes the current document.


    When it comes time to make links to images and other files, it will be simplest
    if you all files that belong to a single Web site are kept in a single folder.
    Nevertheless, a single folder can contain more than one site, or it can contain
    different subfolders, each of which holds a single Web site or some of the files
    that belong to a site (one folder can contain text files, one images, and so on).


    ![](img/eb7bf63026b0f3188f312686de439a8a_95_0.png)


    # 5.


    To change the location, click on the folder icon next to the Find button. Then
    navigate through your computing resources in the Choose Search Folder dialog box,
    click on the folder you want to search, and click on Select.


    ![](img/eb7bf63026b0f3188f312686de439a8a_95_1.png)


    # Exporting Text


    Exporting some or all of the contents of your Web pages is different from copying
    text and pasting it into another format. When you export, you either retain some
    special formatting or save some aspect of the contents in a special format. When
    you choose File|Export, you can save parts of the currently displayed Web page
    in Extensible Markup Language (XML) format. You can also save the style sheet
    information for the current page or select a table on the page and export its
    contents to another document.


    ![](img/eb7bf63026b0f3188f312686de439a8a_95_2.png)'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Converting for Earlier Browsers


    Many Web surfers use old versions of Microsoft Internet Explorer, Netscape Navigator,
    or other browsers—often because they don''t have memory to run newer versions.
    Web-page attributes aren''t compatible with version 3 or earlier versions of Web
    browsers. As an alternative to your regular Web page, you can provide a version
    that visitors with older browsers can view. Select File|Convert To|3.0 Browser
    Compatible. Select an option from the Convert To 3.0 Browser Compatible dialog
    box and click on OK to convert the file.


    ![](img/eb7bf63026b0f3188f312686de439a8a_96_0.png)


    Be sure you convert only when you''re finished editing your file—otherwise, you''ll
    have to convert it every time you make a change.


    # Paragraphs and Page Divisions


    The text you create for Web pages holds your visitors'' attention, but it''s the
    way that text is arranged in readable paragraphs that first attracts their attention
    and keeps them moving from page to page on your site. This section provides a
    brief overview of some of the more important paragraph alignment features; you
    will learn more about them in the projects in Chapter 11.


    # Creating Breaks


    In contrast to other aspects of Web page design, breaks are pretty simple. They
    fall into only two categories: paragraphs and line breaks.


    A paragraph is separated from other text or images by a blank space. A line break
    is used when you want to break a line but not add a blank space between that line
    and adjacent text or images.


    Press Return to create a paragraph here


    # Line Breaks


    In contrast to other aspects of Web page design, line breaks fall into only two
    categories.


    paragraphs line breaks.


    A paragraph is separated from other text or images by break is used when you want
    to break a line but not add that line and adjacent text or images.


    Press Shift+Return to create a line break here'
  merge: -1
