  md: '# Transparent GIF Image Effects


    A logo in its original vector form can take several forms when saved as a GIF
    file. If edited and saved as an opaque GIF, it will display in a Web document
    bordered by a rectangle with its own background color (in this case white, which
    is the default). Saved as a transparent GIF with anti-aliasing, the logo edges
    display a slight halo. When the image is placed against the background color,
    this halo will appear in the Web document; when saved as a transparent GIF, the
    halo will not appear.


