    This layout is getting a bit crowded. To delete a frame, simply click and drag
    the border of the frame to the nearest edge of the Document Window.


    ![](img/eb7bf63026b0f3188f312686de439a8a_314_2.png)


    ![](img/eb7bf63026b0f3188f312686de439a8a_314_3.png)'
