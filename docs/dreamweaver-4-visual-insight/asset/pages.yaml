  md: '# Dreamweaver 4


    # VISUAL


    # Insight


    Dreamweaver 4 Visual Insight leads both novice and professional Web designers
    step-by-step through the process of designing and managing fully-featured sites.
    Dreamweaver 4 brings complex Web-design tasks within the reach of everyone—and
    you don''t have to learn programming! The visual nature of this book teaches the
    program''s key features such as adding behaviors, designing with frames and tables,
    and many more amazing features.


    Layer backgrounds, images, colors, and text to create professional, content-rich
    Web pages.


    # About the Authors


    Greg Holden is the author of more than 12 books on Web- and computer-related topics,
    including Apache Server Little Black. He also writes a column for CNET and contributes
    to Publish and other publications.


    Scott Wills teaches graphic design and runs a design firm in Chicago. He has authored
    several books on computer-aided design and typography, including Computer Tips
    for Artists, Designers, and Desktop Publishers and Tips on Type.


    # This book shows you how to:


    +   - Master the Dreamweaver 4 interface


    +   - Customize the program''s panels and inspectors


    +   - Organize with bulleted and numbered lists


    +   - Add background images and colors to Web pages


    +   - Use layers to design with precision


    +   - Create flashy Fireworks graphics for your Web pages


    +   - Design tables to add rows, columns, and spot color


    +   - Devise interactive Web-page image maps


    +   - Divide a page into individual frames


    +   - Manage Web-site links visually with the Site Map


    +   - Attach MouseOvers and other behaviors to objects


    +   - Track Web-site components and make situate changes instantly


