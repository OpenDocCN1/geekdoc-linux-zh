- img_proc: true
  md: '# 16.


    Select all cells in the row and click on the Merge Cells button in the expanded
    Property Inspector (or choose Modify|Table|Merge Cells, or press Ctrl+Alt+M (Cmd+Option+M
    on a Mac).


    The three cells in the top row merge into a single cell.


    # 17.


    Enter a heading in the new cell and format it as you would any other text.


    # 18.


    When you''re finished formatting your table, choose File|Save to save your changes,
    then press F12 to preview the page using the default browser.


    ![](img/eb7bf63026b0f3188f312686de439a8a_286_0.png)


    # The Women of WomanLore


