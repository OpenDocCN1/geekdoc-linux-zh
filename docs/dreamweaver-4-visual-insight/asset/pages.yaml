  md: '# Constructing Forms


    Create a Drop-Down Menu

    In a menu, the items drop down. The purpose of a drop-down menu is to give the
    viewer an easy way to view a large number of options. If you plan to have only
    a handful of items in your list, you can display them all at once. Create a menu
    as described in the preceding steps. Select the menu, then click on List in the
    Property Inspector. Enter the number of lines you need to display. The list appears
    highlighted in the Document Window.


    If you want a list item other than the first one to appear highlighted, select
    that item in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_168_0.png)


    # List Buttons


    An essential part of any Web-page form is a button that tells the user''s browser
    to perform a particular action. That action might be to activate a CGI script
    on a Web server; it might also be to email the data. To add a button, click on
    Insert Button in the Objects panel, drag that button into the Document Window,
    or choose Insert|Form Objects|Button. The button appears in the Document Window;
    it is labeled Submit by default.


    ![](img/eb7bf63026b0f3188f312686de439a8a_168_1.png)'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Choose the Button Type


    Choose the type of button you want by clicking on one of the Action radio buttons
    in the Property Inspector. A Submit button sends the data to the CGI script that
    handles the form. A Reset button clears all form data and returns the form to
    its original appearance. The None option inserts a blank button—a button that
    does nothing. It can be assigned a purpose, though, if you write JavaScript commands
    for it.


    The button you create does not have to say Submit, Reset, or anything at all.
    To rename a button, click on the button so that a highlighted box appears around
    it to indicate that it''s selected. In the Property Inspector, enter a new name
    in the ButtonName box.


    ![](img/eb7bf63026b0f3188f312686de439a8a_169_0.png)


    # Image Fields


    You can add an image to a form just as you can to any other part of a Web page.
    On the Insert Image Field button in the Objects panel, drag the button into the
    Document Window, or choose Insert|Form|Image Field. The Select Image Source dialog
    box appears. Locate the image and click on Select. The image appears in the form
    with a dashed line around it. You can adjust its height, width, and other properties
    in the Property Inspector.


    ![](img/eb7bf63026b0f3188f312686de439a8a_169_1.png)'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Jump Menus


    A jump menu looks and acts like a conventional drop-down menu with one big difference:
    When the user selects a menu item, her browser "jumps" to a URL that you have
    associated with that menu option. To insert a jump menu, click on the Insert Jump
    Menu button, drag the button into the Document Window, or select InsertForm ObjectsJump
    Menu. The Insert Jump Menu dialog box appears.


    ![](img/eb7bf63026b0f3188f312686de439a8a_170_0.png)


    Jump menus work by means of JavaScript. Dreamweaver inserts the necessary JavaScript
    commands automatically. Web browsers that don''t support JavaScript, include conventional
    hyperlinks as an alternative to jump menus.


    ###

    In the Insert Jump Menu dialog box, enter the name of the menu in the Text box.
    Then associate a URL with that item. If the destination is a local file on your
    site, click on Browse, locate the file, and click on OK to insert it. If it is
    a remote URL, copy and paste it into the box labeled When Selected, Go To URL.


    ![](img/eb7bf63026b0f3188f312686de439a8a_170_1.png)


    ###

    Edit a Jump Menu

    You can use the Property Inspector to preselect an item or to change the menu
    to a list.


    If you need to add items to a jump menu list, select the menu, then click on the
    plus (+) at the top of the Insert Jump Menu dialog box. Reorder an item by selecting
    it, then clicking on the up or down arrows to change its placement in the list.
    Click on the minus sign (-) to delete an item.


    ![](img/eb7bf63026b0f3188f312686de439a8a_170_2.png)'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Hidden Fields


    A hidden field, as you might expect, doesn''t actually appear in the form. You
    can add it to a form to include some reference data to be sent along with the
    data user submits. To add the hidden field, click on the Insert Hidden Field button
    in the Objects panel, drag the button into the Document Window, or choose Insert|Form
    Object|Hidden Field. Add the data you want to associate with the hidden field
    in the Value text box


    In a hidden field, you might include the URL on which the form appears, the author,
    or other data you would find helpful when reviewing the data that a user has submitted.


    ![](img/eb7bf63026b0f3188f312686de439a8a_171_0.png)


    # File Fields


    If the information you want to gather from your visitors is too extensive to be
    included in the usual data-entry fields, you can include a file field. Click on
    the Insert File Field button or choose Insert|Form Objects|File Field. A user
    can click on the file field to upload a file from his computer to the URL you
    entered in the Action field in the Property Inspector; this inspector appears
    when he selects the form by clicking on the dashed line that encloses it. A file
    field looks like a text box but includes a Browse button. The user can enter the
    URL of the file in the text box or click on Browse, locate the file, and click
    on OK to enter the URL in the file field.


    ![](img/eb7bf63026b0f3188f312686de439a8a_171_1.png)


    A file field won''t work unless you set the form method to POST.'
  merge: -1
