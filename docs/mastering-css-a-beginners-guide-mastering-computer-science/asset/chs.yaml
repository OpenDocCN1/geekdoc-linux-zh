  \ class=\"image-5\"> rotateZ(10deg) </div>\n      <p> 负值 </p>\n      <div class=\"\
  image-6\"> rotateZ(-60deg) </div>\n    </div>\n  </div>\n</div>\n</body>\n</html>\n\
  ```\n\n\n\n\nPostCSS 将将你现有的 CSS 文件转换为 JavaScript 可读的数据，然后 JavaScript 插件将进行修改，最后由\
  \ PostCSS 返回原始文件的修改版本。\n\n## 各种基于 PostCSS 的 CSS 插件\n\n市场上有多种可用插件，如下：\n\n1. Autoprefixer\n\
  2. CSSnext\n3. CSSNano\n4. PreCSS\n5. StyleLint\n6. PostCSS Assets\n7. Font Magician\n\
  8. Lost Grid\n9. PostCSS\n10. PostCSS-modules\n\n## AUTOPREFIXER\n\nAutoprefixer\
  \ 根据最新的浏览器流行度数据，并自动为你应用前缀。你可以尝试 Autoprefixer 的交互式演示。\n\n你可以像下面一样编写任何不需要厂商前缀的 CSS\
  \ 规则：\n\n```css\n.container {    box-shadow: 0 0 10px #cecece;    transition: all\
  \ .5s;  }\np{ color: red; } \n.section a{ display: flex; }\n```\n\n## 编写纯 CSS\n\n\
  使用 `Autoprefixer` 非常简单，你只需要忘记厂商前缀，并根据最新的 W3C 规范编写普通的 CSS。你不需要特殊的语言（如 Sass、Less），也不需要记住何时必须使用\
  \ mixins。\n\n`Autoprefixer` 支持选择器（如 `:fullscreen` 和 `::selection`）、单位函数（`calc()`）、at-rules（`@support`\
  \ 和 `@keyframes`）以及属性。\n\n它是一个后处理器，你可以配合 Sass、Stylus 或 LESS 等预处理器一起使用。\n\n只需按照最新的\
  \ W3C 规范编写普通 CSS，`Autoprefixer` 就会为旧浏览器生成代码。如果 CSS 未经压缩，`Autoprefixer` 会更改 CSS 缩进以创建一个良好的的前缀级联结构。\n\
  \n使用 `Autoprefixer` 的输出如下（你可以在线通过 [`tools.webdevpuneet.com/css-autoprefixer/`](https://tools.webdevpuneet.com/css-autoprefixer/)\
  \ 查看 Autoprefixer 的代码）：\n\n```css\n/* * Prefixed by: * PostCSS: v7.0.29, * Autoprefixer:\
  \ v9.7.6 * Browsers: last 4 version */   .container {    -webkit-box-shadow: 0 0\
  \ 10px #cecece;                box-shadow: 0 0 10px #cecece;    -webkit-transition:\
  \ all .5s;    -o-transition: all .5s;    transition: all .5s;  } \np{ color: red;\
  \ } \n.section a{ display: -webkit-box; display: -ms-flexbox; display: flex; }\n\
  ```\n\n问题在于，某些 CSS 属性在不同浏览器中的显示方式不同，而你希望每个网站访问者都能获得预测且准确的体验。对于较旧、更成熟的属性（如 border\
  \ 或 border-radius），不需要担心；它们已经标准化并能跨浏览器工作。但像 grid 或 flexbox 这样的新功能并没有那么简单。\n\n制作浏览器的厂商（如\
  \ Google 和 Mozilla）不想等到酷炫的新事物被标准化之后才实现它们。相反，他们创建了自己的版本，并添加一个前缀将其与其他浏览器的实现区分开来。新属性将会在标准化并在所有浏览器中同样工作，从而消除对前缀的需要。在此之前，你必须在代码中使用厂商前缀。\n\
  \n“Autoprefixer”是一个插件，可以让我们从单调的 -webkit- 和 -moz- 中解救出来。它的功能顾如其名：它会自动为你的 CSS 添加前缀。你所做的只是提供一个\
  \ CSS 表，它将读取它并在必要时添加厂商前缀。\n\n### 在你的项目文件夹中安装 Autoprefixer\n\n在 VS code 中打开终端并使用\
  \ `npm` 安装它，以及 `postcss` 及其配套工具 `postcss-cli`（后者是你运行 `Autoprefixer` 的命令行工具）。该过程与安装\
  \ Sass 相同，只是你一次性安装三个包。你可以根据需要一次性安装多个包，每个包之间用空格隔开：\n\n一旦 `npm` 下载并安装了这些包，需要回到 `package.json`\
  \ 并为 `npm` 添加一个运行脚本，就像你安装 Sass 时一样。在 \"sass\" 脚本之后添加一个名为“prefix”的新脚本：\n\n```json\n\
  {\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"abc\",\n\
  \  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
  \ -w --style compressed\",\n    \"prefix\": \"\"\n  },\n  \"author\": \"\",\n  \"\
  license\": \"ISC\",\n}\n```\n\n在脚本内部，需要告诉 `npm` 使用你刚刚安装的 `postcss` 包，以及在哪里找到你编译后的\
  \ CSS 文件：\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
  \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css\"\n\
  \  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\n之后，你需要指示 `npm` 使用哪个包以及在哪里找到\
  \ CSS 文件，通过实现 `–use` 标志后接 `Autoprefixer` 来使用它，如下所示：\n\n```json\n{\n  \"name\": \"\
  abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"abc\",\n  \"main\": \"index.js\"\
  ,\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
  \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css --use\
  \ autoprefixer\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\n\
  最后，你需要指示它将新的、带前缀的 CSS 表放在哪里，如下所示：\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\"\
  : \"1.0.0\",\n  \"description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\"\
  : {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\"\
  ,\n    \"prefix\": \"postcss ./public/css/style.css --use autoprefixer -d ./public/css/prefixed/\"\
  \n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\n现在你的前缀脚本就完成了。\n\n\
  添加一个名为 `browserslist` 的新键，如下所示：\n\n```json\n{\n  \"browserslist\": \"\"\n}\n```\n\
  \n然后给 `browserslist` 赋值为最后四个版本：\n\n```json\n{\n  \"name\": \"joeblow\",\n  \"version\"\
  : \"1.0.0\",\n  \"description\": \"Joe Blow’s web portfolio\",\n  \"main\": \"index.js\"\
  ,\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
  \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css --use\
  \ autoprefixer -d ./public/css/prefixed/\"\n  },\n  \"author\": \"\",\n  \"license\"\
  : \"ISC\",\n  \"browserslist\": \"last 4 versions\"\n}\n```\n\n现在你准备好为 CSS 自动添加前缀了！进入终端并运行\
  \ `prefix` 脚本：\n\n```bash\n$ npm run prefix\n```\n\n查看你 CSS 文件中新的带前缀的 CSS，会添加一个新块：\n\
  \n```css\n.section {\n  background: #15DEA5;\n  height: 10rem;\n  display: -webkit-box;\n\
  \  display: -ms-flexbox;\n  display: flex;\n  -webkit-box-align: center;\n  -ms-flex-align:\
  \ center;\n  align-items: center;\n  -ms-flex-wrap: wrap;\n  flex-wrap: wrap;\n\
  \  width: 100%;\n}\n```\n\n现在我们的网站将在所有兼容浏览器上正常且统一地显示。\n\n## 它在何时运行？\n\n`Autoprefixer`\
  \ 是处理 CSS 时最后运行的。因此，如果你使用 Sass、LESS 或 Stylus，它们会先处理，然后是 `Autoprefixer`。如果你愿意，仍然可以自由使用预处理器插件（例如\
  \ Compass、LESHat 等）来添加前缀，但我认为 `Autoprefixer` 更简单、效果更好，而且你不需要两者都用。\n\n### Autoprefixer\
  \ 和 PrefixFree 有什么区别\n\nPrefixFree 是一个客户端 JavaScript 库。它作为额外的请求包含在你的页面中。它运行，寻找能找到的所有\
  \ CSS，计算需要哪些前缀，并将新的 CSS 注入页面中。\n\n*   **缺点**：额外的请求、未前缀样式闪烁（flash-of-unprefixed-styles）、无法缓存、某些无法处理的样式（例如\
  \ filter）。\n*   **优点**：CSS 体积更小、只注入当前浏览器需要的前缀。\n\n`oprefixer` 在服务器端处理你的 CSS。至少我们是这么这么的。\n\
  \n*   **缺点**：CSS 体积稍大（但比“直接添加所有前缀”要小）。\n*   **优点**：前缀完美匹配你支持的内容、最终 CSS 可以缓存、处理棘手的回退方案（例如\
  \ flexbox）。\n\n\n\n\n\n`cssnext` 让你现在就能使用 CSS 的未来。你可以使用并非所有浏览器都支持的功能，例如 CSS 变量和\
  \ CSS 颜色函数。`cssnext` 将你的样式转换为可以在所有浏览器中运行的代码。换句话说，`cssnext` 允许使用真实的 CSS 语法而不是另一种预处理器语法来编写样式。`cssnext`\
  \ 会为你的样式添加厂商前缀（vendor prefixes），所以你在编写 CSS 时不需要手动使用这些前缀。\n\n为了给你个例子，假设你有以下 CSS 样式：\n\
  \n```css\n:root {  --text: pink;  --bg-color: #FFEC31;  --flex-center: {    display:\
  \ flex;    margin: auto;  } } \n  .box {  background-color: var(--bg-color);  color:\
  \ color(hotpink whiteness(25%));  @apply(--flex-center); } \n  .warn {  @apply(--flex-center);\
  \ }\n```\n\n`cssnext` 将样式转换为如下所示：\n\n```css\n.box {  background-color: #F9EC31;\
  \  color: rgb(255, 64, 159);  display: -webkit-box;  display: -ms-flexbox;  display:\
  \ flex;  margin: auto; } \n  .warn {  display: -webkit-box;  display: -ms-flexbox;\
  \  display: flex;  margin: auto; }\n```\n\n这个插件是 CSS 的 Babel，它允许你使用现代 CSS 特性，同时将它们转换为旧版浏览器更容易理解的\
  \ CSS：\n\n- 使用 `Autoprefixer` 添加前缀（所以如果你使用此项，就不需要直接使用 `Autoprefixer` 了）。\n- 允许使用\
  \ CSS 变量。\n- 允许使用嵌套语法，就像 Sass 一样。\n\n## CSSnano\n\n`cssnano` 用于精简和压缩你的 CSS。它会移除空白、消除重复规则、过时的厂商前缀、注释，并执行许多其他优化。`cssnext`\
  \ 和 `cssnano` 都可以根据特定需求进行配置。\n\n## 安装 PostCSS、PostCSS-CLI、cssnext 和 cssnano\n\n\
  使用 `npm`：\n\n```bash\n$ npm install --save-dev postcss postcss-cli postcss-cssnext\
  \ cssnano\n```\n\n或者通过 `Yarn` 命令：\n\n```bash\n$ yarn add postcss postcss-cli postcss-cssnext\
  \ cssnano --dev\n```\n\n## 使用 PostCSS-CLI\n\n你通过为 `PostCSS` 命令行 (`cmd`) 接口提供输入、输出文件以及要使用的\
  \ PostCSS 插件。它通过 `-- use` 标志指定插件，通过 `-- output` 标志指定输出文件，输入文件在最后不带任何标志直接提供，具体使用如下命令：\n\
  \n```bash\n$ postcss --use postcss-cssnext --use cssnano --output styles-out.css\
  \ styles.css\n```\n\n你可以在监听模式（watch mode）下使用 `PostCSS CLI`，通过以下命令监听输入文件的变化：\n\n\
  ```bash\n$ postcss --use postcss-cssnext --use cssnano --output styles-out.css styles.css\
  \ --watch\n```\n\n你可以在 json 配置文件中指定更细粒度的配置选项，通过 `-- config` 标志指定配置文件：\n\n```bash\n\
  $ postcss --config postcss-config.json\n```\n\n你的配置文件看起来像这样：\n\n```json\n{\n  \"\
  use\": [\"postcss-cssnext\", \"cssnano\"],\n  \"input\": \"styles.css\",\n  \"output\"\
  : \"styles-out.css\"\n}\n```\n\n## npm Script\n\n为了让你的工作流运行更顺畅，只需在项目的 `package.json`\
  \ 文件中设置 `postcss` 脚本：`\"scripts\": { \"postcss\": \"postcss --use postcss-cssnext\
  \ --use cssnano --output styles-out.css styles.css\" }`。\n\n现在你只需要运行以下命令：\n\n```bash\n\
  $ npm run postcss\n```\n\n## PreCSS\n\n它让你在 CSS 中使用类似 Sass 的标记和分阶段的 CSS 特性。给出的示例如下：\n\
  \n```scss\n$blue: #056ef0; $column: 200px; \n  .menu {    width: calc(4 * $column);\
  \ } \n  .menu_link {  background: $blue;  width: $column; }\n```\n\n结果如下：\n\n```css\n\
  .menu {  width: calc(4 * 200px); } \n  .menu_link {  background: #056ef0;  width:\
  \ 200px; }\n```\n\n它将类似 Sass 的语法糖（如变量、条件判断和迭代器）与新兴的 CSS 特性（如逻辑属性和自定义属性、媒体查询范围以及图像集）结合在一起。\n\
  \n## 使用\n\n你可以将 `PreCSS` 添加到你的构建工具中：\n\n```bash\n$ npm install precss --save-dev\n\
  ```\n\n## 其他各种插件\n\n它由以下插件驱动（按此顺序）：\n\n- `postcss-extend-rule`：你可以将此 PostCSS 扩展规则添加到你的项目中：\n\
  \n  ```bash\n  $ npm install postcss postcss-extend-rule --save-dev\n  ```\n\n \
  \ 使用 `PostCSS Extend Rule` 处理你的 CSS：\n\n  ```javascript\n  const postcssExRule =\
  \ require('postcss-extend-rule');\n  postcssExRule.process(CSS_CODE /*, processOptions,\
  \ pluginOptions */);\n  ```\n\n  该插件中有许多可用的 `Options`。\n\n  `name` 选项决定了用于扩展选择器的\
  \ 规则（at-rule）名称。默认情况下，该名称为 `extend`，意味着 `@extend` 规则会被解析。\n\n  如果将 `name` 选项更改为例如\
  \ `postcss-extend`，那么只有 `@postcss-extend` 规则会被解析。\n\n  ```css\n  main {  @postcss-extend.some-rule;\
  \ }\n  ```\n\n- `postcss-advanced-variables`：它的 `variables` 让你在 CSS 中可以使用类似 Sass\
  \ 的变量、条件判断和迭代器。\n\n  你可以将 `PostCSS advanced variables` 添加到你的构建工具中：\n\n  ```bash\n\
  \  $ npm install postcss-advanced-variables --save-dev\n  ```\n\n  你可以将 `PostCSS`\
  \ 添加到你的构建工具中：\n\n  ```bash\n  $ npm install postcss --save-dev\n  ```\n\n  将 `PostCSS\
  \ advanced variables` 作为插件使用：\n\n  ```javascript\n  postcss([  require('postcss-advanced-variables')(/*\
  \ options */ ]).process(YOUR_CSS);\n  ```\n\n- `postcss-preset-env`：它将现代 CSS 转换为大多数浏览器都能理解的内容，并根据目标浏览器或运行时环境确定所需的垫填充（polyfills）。\n\
  \n  你可以将 `PostCSS Preset Env` 添加到你的项目中：\n\n  ```bash\n  $ npm install postcss-preset-env\
  \ --save-dev (在终端中运行此命令)\n  ```\n\n  现在使用 `PostCSS Preset Env` 如下所示处理你的 CSS：\n\n\
  \  ```javascript\n  const postCSSPresetEnv = require('postcss-preset-env');\n  postCSSPresetEnv.process(YOUR_CSS\
  \ /*, processOptions, pluginOptions */);\n  ```\n\n## 各种 Options\n\n1. **stage**：此选项根据成为\
  \ Web 标准的稳定程度来决定要垫填充哪些 CSS 特性。`postcssPresetEnv({ stage: 0 })`\n\n  此阶段可以是 0（实验性）到\
  \ 4（稳定），或为 false。通过将 `stage` 设置为 `false` 将禁用所有垫填充。如果你打算专门使用 `features` 选项，这将非常有用。\n\
  \n  在没有任何任何配置选项的情况下，`PostCSS` 允许 `Preset Env Stage`。\n\n2. **features**：通过 ID 启用或禁用特定的垫填充。向特定特性\
  \ ID 传递 `true` 将启用其垫填充，传递 `false` 则会禁用。\n\n  该插件中有多种可用的 `id`，如下所示：\n\n  1. `postcssAttributeCaseInsensitive`\n\
  \  2. `postcssBlankPseudo`\n  3. `postcssColorFunctionalNotation`\n  4. `postcssEnvFunction`\n\
  \  5. `postcssLogical`\n  6. `postcssReplaceWrap`\n  7. `postcssSelectorNot` 等\n\
  \n     你只需通过在代码中导入它们即可使用这些 ID。\n\n3. **insertBefore / insertAfter**：`insertBefore`\
  \ 和 `insertAfter` 键允许将其他 PostCSS 插件插入链中。如果你在使用在特定垫填充之前或之后执行的糖 PostCSS 插件，这将非常有用。`insertBefore`\
  \ 和 `insertAfter` 都支持一个或多个插件的链式调用。\n\n4. **autoprefixer**：它包含了 `autoprefixer` 和\
  \ `browsers` 选项并将自动传递给它。指定 `autoprefixer` 选项允许向 `autoprefixer` 传递额外的选项。`postcssPresetEnv({\
  \ autoprefixer: { grid: true } })`\n\n- `postcss at-root`：`@at-root` 会导致一个或多个规则在文档根部输出，而不是嵌套在它们的父选择器之下：\n\
  \n  结果如下：\n\n  ```css\n  .child { ... } .parent { ... }\n  ```\n\n  在代码中使用它：\n\n\
  \  ```javascript\n  postcss([ require('postcss-atroot')() ])\n  ```\n\n- `postcss-property-lookup`：PostCSS\
  \ 插件允许引用属性值而不是变量，类似于 Stylus。\n\n  ```css\n  .section {  margin-left: 20px;  margin-right:\
  \ @margin-left;  color: red;  background: @color url('test.png');  line-height:\
  \ 1.5;  font-size: @(line-height)em; } \n  .section {  margin-left: 20px;  margin-right:\
  \ 20px;  color: red;  background: red url('test.png');  line-height: 1.5;  font-size:\
  \ 1.5em; }\n  ```\n\n  在代码中使用它：\n\n  ```javascript\n  postcss([ require('postcss-property-lookup')\
  \ ])\n  ```\n\n- `postcss-nested`\n\n## 安装插件\n\n- 第一步：\n\n\n\n\n\n## 第 2 步：检查你现有项目中的\
  \ PostCSS 配置：项目根目录下的 `postcss.config.js`、`package.json` 中的 `postcss` 部分或拆包配置中的 `postcss`。\n\
  \n如果你没有使用 `PostCSS`，请根据官方文档添加并在设置中配置此插件。\n\n## 第 3 步：将插件添加到插件列表：\n\n有多种可用选项：\n\n\
  1. `bubble`：默认情况下，插件只会泡化 `@media` 和 `@supports` 嵌套规则。你可以通过 `bubble` 选项向列表添加自定义的嵌套规则：`postcss([\
  \ require('postcss-nested')({ bubble: ['phone'] }) ])`\n\n2. `unwrap`：默认情况下，插件将解包\
  \ `@font-face`、`@keyframes` 和 `@document` 嵌套规则。你可以通过 `unwrap` 选项向列表添加自定义的嵌套规则：`postcss([\
  \ require('postcss-nested')({ unwrap: ['phone'] }) ])`\n\n## preserveEmpty\n\n默认情况下，插件会剔除由中间嵌套级生成的任何空选择器。你可以将\
  \ `preserveEmpty` 设置为 `true` 来保留它们。\n\n它将被编译为：\n\n`.a { } .a .b { color: black;\
  \ }`\n\n你可以使用命令安装 `postcss-nested`。\n\n## STYLELINT\n\n它是一个强大且现代的 CSS linter，有助于强制样式表的一致性并避免错误。\n\
  \n## 安装 Stylelint\n\n首先，确保你已经安装了 `stylelint`。它是一个 npm 包，可以通过运行以下命令安装：\n\n```\nnpm\
  \ install -g stylelint\n```\n\n## 使用\n\n安装 `stylelint` 后，你可能需要创建一个 `.stylelintrc.json`\
  \ 文件。在这里你可以配置你希望 `stylelint` 检查的所有 lint 规则。然后查看规则规则页面以获取所有可用规则的详情。\n\n一旦设置了带有 lint\
  \ 规则的 `.stylelintrc.json` 文件，就可以可以使用命令在 SCSS 文件上运行 `stylelint`。这假设你处于 `.scss` 文件所在的目录。你可以根据需要更新路径。\n\
  \n它将在当前工作目录中查找 `.stylelintrc.json` 文件。如果你的任何配置文件不在当前工作目录，可以在运行 `stylelint` 时通过 `config`\
  \ 选项将其传递。\n\n如果你想在 npm-scripts 中使用 `stylelint`，请使用以下命令：\n\n```\nnpm install stylelint\
  \ -D\n```\n\n## PostCSS ASSETS\n\nPostCSS Assets 是一个 CSS 资源管理器。它将样式表与环境变化隔离，获取图像大小并内联文件。\n\
  \n安装：\n\n```\nnpm install postcss-assets --save-dev\n```\n\n## Gulp (gulp-postcss)\n\
  \nPostCSS gulp 插件用于将 CSS 通过管道到多个插件，但仅解析一次 CSS。\n\n安装 `gulp-postcss`：\n\n```npm\n\
  npm install --save-dev postcss gulp-postcss\n```\n\n## Basic\n\n配置将此处所述从 `postcss.config.js`\
  \ 自动加载，因此你不需要指定任何选项。\n\n使用 `gulp` 直接传递插件：\n\n```javascript\nvar postcss = require('gulp-postcss');\
  \ \nvar gulp = require('gulp'); \nvar autoprefixer = require('autoprefixer'); \n\
  var cssnano = require('cssnano');   \ngulp.task('css', function () { \n    var plugins\
  \ = [ \n        autoprefixer({browsers: ['last 1 version']}), \n        cssnano()\
  \ \n    ]; \n    return gulp.src('./src/*.css') \n        .pipe(postcss(plugins))\
  \ \n        .pipe(gulp.dest('./dest')); \n});\n```\n\n## Grunt\n\n现在我们将解释如何创建一个\
  \ `Gruntfile` 并安装和使用 `Grunt` 插件。一旦你熟悉了该过程，可以使用此命令安装此插件：\n\n```\nnpm install grunt-postcss\
  \ --save-dev\n```\n\n一旦安装了插件，可以在 `Gruntfile` 中通过此行 JavaScript 代码启用它：\n\n```javascript\n\
  grunt.loadNpmTasks('grunt-postcss');\n```\n\n如何在在代码中使用插件：\n\n```javascript\nnpm\
  \ install grunt-postcss pixrem autoprefixer cssnano \ngrunt.initConfig({ \n  postcss:\
  \ { \n    options: { \n      map: true, // 内联 sourcemaps \n      // 或者 \n      map:\
  \ { \n          inline: false, // 将所有 sourcemaps 保存为单独的文件... \n          annotation:\
  \ 'dist/css/maps/' // ...保存到指定的目录 \n      }, \n      processors: [ \n        require('pixrem')(),\
  \ // 为 rem 单位添加回退 \n        require('autoprefixer')({browsers: 'last 2 versions'}),\
  \ // 添加厂商前缀 \n        require('cssnano')() // 压缩结果 \n      ] \n    }, \n    dist:\
  \ { \n      src: 'css/*.css' \n    } \n  } \n});\n```\n\n## FONT MAGICIAN\n\nFont\
  \ Magician 是一个 PostCSS 插件，可以神奇地生成你所有的 `@font-face` 规则。再也不需要编写 `@font-face` 规则了。\n\
  \n这里是 font magician 的示例：\n\n只需像魔法一样使用 font 和 font-family 属性。\n\n安装：你可以将 Font Magician\
  \ 添加到你的构建工具中：\n\n```\nnpm install postcss postcss-font-magician --save-dev\n```\n\
  \n## LOST GRID\n\nLostGrid 是一个在 PostCSS 中的强大的网格系统，它可以与任何预处理器甚至原生 CSS 工作。\n\nLost\
  \ Grid 是一个优秀的 PostCSS 插件，提供了一个令人印象的 CSS 网格系统，不仅适用于普通 CSS，也适用于处理器语言（Sass, LESS, Stylus）。它使用\
  \ `calc()` 函数创建精美的网格，无需花费大量时间自定义即可轻松使用。\n\n你可以使用以下库进行安装：\n\n## Gulp\n\n首先，你必须安装\
  \ NodeJs，然后使用以下命令全局安装 `gulp`：\n\n```\nnpm install --global gulp\n```\n\n你也安装了依赖项：\n\
  \n```\nnpm install --save-dev gulp-postcss gulp-cemaps autoprefixer lost\n```\n\n\
  创建 `gulpfile.js`：\n\n```javascript\nvar gulp = require('gulp'); \nvar postcss =\
  \ require('gulp-postcss'); \nvar sourcemaps = require('gulp-cemaps'); \nvar autoprefixer\
  \ = require('autoprefixer'); \nvar lost = require('lost'); \nvar paths = { \n  cssSource:\
  \ 'src/', \n  cssDestination: 'dist/' \n}; \ngulp.task('styles', function () { \n\
  \    return gulp.src(paths.cssSource + '**css') \n        .pipe(sourcemaps.init())\
  \ \n        .pipe(postcss([ \n            lost(), \n            autoprefixer() \n\
  \        ])) \n        .pipe(sourcemaps.write('./')) \n        .pipe(gulp.dest(paths.cssDestination));\
  \ \n}); \ngulp.watch(paths.cssSource + '**css', ['styles']);\n```\n\n## Grunt\n\n\
  首先，你必须安装 NodeJs，然后使用此命令安装 `Grunt`：\n\n安装依赖项：\n\n```\nnpm install --save-dev grunt-postcss\
  \ autoprefixer lost\n```\n\n创建 `Gruntfile.js`：\n\n```javascript\nmodule.exports\
  \ = function(grunt) { \n  grunt.initConfig({ \n    postcss: { \n      options: {\
  \ \n        map: true, // 内联 sourcemaps \n        // 或者 \n        map: { \n    \
  \        inline: false, // 将所有 sourcemaps 保存为单独的文件... \n            annotation:\
  \ 'dist/css/maps/' // ...保存到指定的目录 \n        }, \n        processors: [ \n      \
  \    require('autoprefixer')(), \n          require('lost') \n        ] \n     \
  \ }, \n      dist: { \n        src: 'css/*.css' \n      } \n  }, \n  watch: { \n\
  \    files: ['css/*.css'], \n    tasks: ['postcss'] \n  } \n}); \ngrunt.loadNpmTasks('grunt-postcss');\
  \ \ngrunt.loadNpmTasks('autoprefixer'); \ngrunt.loadNpmTasks('grunt-contrib-watch');\
  \ \ngrunt.registerTask('default', ['watch']); \n```\n\n## Brunch\n\n首先，你安装 NodeJS\
  \ 然后使用此命令安装 `Brunch`：\n\n```\nbrunch new\n```\n\n安装依赖项：\n\n```\nnpm install --save\
  \ postcss-brunch autoprefixer lost\n```\n\n更新 `brunch-config.coffee`：\n\n```coffee\n\
  exports.config = { \n  files: { \n    javascripts: { joinTo: 'app.js' }, \n    stylesheets:\
  \ { joinTo: 'app.css' }, \n    templates: { joinTo: 'app.js' } \n  }, \n  plugins:\
  \ { \n    postcss: { \n      processors: [ \n        require('autoprefixer')(),\
  \ \n        require('lost') \n      ] \n    } \n  } \n}\n```\n\n\n\n\n\n这是一个用于开发\
  \ CSS 工具的框架。它也可以用于开发如 `Sass` 和 `LESS` 等模板语言。\n\nPostCSS 包含以下列出的核心组件：\n\n* `CSS parser`\
  \ 生成抽象语法树。\n* 它是一组组成树的类集合。\n* `CSS generator` 为对象树生成代码行。\n* `Code map generator`\
  \ 用于记录所做的更改。\n\n## 特性\n\n插件是与对象树一起的小型程序。在核心模块将 CSS 字符串转换为对象树后，插件会解析并修改该树。然后，PostCSS\
  \ 将为插件修改过的树生成新的 CSS 字符串。PostCSS 及其插件用 JavaScript 编写，并通过 `npm` 安装，`npm` 为各种低层 JavaScript\
  \ 操作提供了 API。\n\n有官方工具允许你结合 `Webpack`、`Gulp` 和 `Grunt` 等构建系统使用 PostCSS。此外还可以控制台界面。可以使用\
  \ `Browserify` 或 `Webpack` 在浏览器中打开 PostCSS。PostCSS 插件执行各种 CSS 处理任务，从属性的解析和排序到压缩。\n\
  \n你可以在 `postcss.parts` 找到完整的插件列表，下面列出了一些示例：\n\n* `Autoprefixer` 用于添加和删除浏览器前缀。`CSS\
  \ modules` 用于隔离 CSS 选择器并组织代码。它作为 `Webpack` 的一部分。\n* `stylelint` 用于分析 CSS 代码错误并检查样式一致性。\n\
  * `stylefmt` 根据 `stylelint` 设置修复 CSS 代码。\n* `PreCSS` 用于执行某些 Sass/Less 预处理功能。\n*\
  \ `postcss-preset-env` 用于模拟草案 CSS 规范中的特性。\n* `cssnano` 通过移除空白和重写代码来减小 CSS 体积。\n\
  * `RTLCSS` 修改 CSS 代码以适应从右向左的字体布局。\n* `postcss-assets`、`postcss-inline-svg` 和 `postcss-sprites`\
  \ 用于处理图形。\n\n我们将简要讨论其中一些插件。\n\n## POSTCSS-MODULES ( CSS MODULES )\n\nCSS Module\
  \ 是一个 CSS 文件，其中所有的类名和动画名称默认都是局部作用域的。所有的 URL (`url(...)`) 和 `@imports` 均采用模块请求格式（`./xxx`\
  \ 和 `. ./xxx` 表示相对路径，`xxx` 和 `xxx/yyy` 表示在模块文件夹中，即在 `node_modules` 中）。\n\nCSS Modules\
  \ 编译为一种名为 `ICSS` 或互操作 CSS 的低级交换格式，但其写法像普通的 CSS 文件：\n\n当从 JS 模块导入 CSS Module 时，它会导出一个包含从本地名称到全局名称所有映射的对象。\n\
  \n## 命名 (localsConvention)\n\n对于本地类名，推荐使用 `camelCase` 命名：\n\n类型：`String | (originalClassName:\
  \ string, generatedClassName: string, inputFile: string) => className: string` Default：`null`\n\
  \n导出类名的样式，即你 `json` 中的键。\n\n1. `camelCase` - `{String}`：类名应转换为驼峰命名。\n2. `camelCaseOnly`\
  \ - `{String}`：类名将被转换为驼峰命名，并从 locals 中移除原始类名。\n3. `dashes` - `{String}`：只有类名中的连字符部分会被转换为驼峰命名。\n\
  4. `dashesOnly` - `{String}`：类名中的连字符部分将被转换为驼峰命名。\n\n## 特性\n\n* 模块化且可复用的 CSS。\n*\
  \ 不再有冲突。\n* 显式依赖。\n* 无全局作用域。\n\n## CSS MarqueeMenu PLUGIN\n\n这是一种用于网页开发的动画效果，用于实现垂直或水平方向上吸引人的文本或图像滚动。\n\
  \n注意：你可以在工作文件夹中下载 CSS MarqueeMenu 插件，并在 HTML 代码的 head 部分包含所需的文件。\n\n```css\nStyle.css\
