  \ 250)` `RGB(245, 255, 245)` `RGB(139, 205, 50)` |\n\n## 选择器的不同类型\n\n有许多不同的选择器。上面的示例使用了选择器来选择给定类型的项目。但我们也可以做出特定的选择。以下是一些选择器类型：\n\
  \n### 选择器名称\n\n- 选择器：此选择器根据元素名称选择 HTML 元素。\n- ID 选择器：选择器使用 `id` 属性来选择特定元素。`id` 在页面中是唯一的。选择具有特定\
  \ `id` 的元素，编写 `#` 符号，后跟 id。\n- 类选择器：选择器选择具有特定类的 HTML 元素。选择这些元素，编写 `.` 字符，后跟类名。\n\
  - 属性选择器：具有特定属性的元素。\n- 通用选择器：通用 `*` 选择所有 HTML 元素。\n- 分组选择器：分组选择器选择具有相同元素的元素。现在看以下代码（`h1`、`h2`\
  \ 和 `p` 元素具有相同的样式）。\n- 伪类选择器：指定的元素，但在特定状态下（例如当光标悬停在链接上时）选择 `<a>`，当鼠标悬悬在链接上时生效。\n\
  \n## CSS 背景\n\n`background` 属性允许控制元素的背景。它是一个允许在一个属性中编写多个 CSS 属性的属性。在 `background`\
  \ 下方还有其他可用属性：\n\n- `background-repeat`\n- `background-attachment`\n- `background-image`\n\
  - `background-clip`\n- `background-color`\n- `background-position`\n- `background-size`\n\
  - `background-origin`\n\n你可以按照任何顺序使用你喜欢的这些属性的任何组合。\n\n## 多背景\n\nCSS3 增加了对各种背景的支持，它们相互叠加。任何与背景相关的属性都可以接受逗号（`,`）分隔的列表，如下：\n\
  \n```css\ntagname {\n  background: URL(image1.jpg), URL(image2.jpg) black;\n  background-repeat:\
  \ repeat-x, no-repeat;\n}\n```\n\n## CSS 边框\n\n`border` 属性是 CSS 中的语法，接受多个值用于在其元素周围绘制线条：\n\
  \n```css\n.container {\n  border: 3px solid red;\n  height: 200px;\n  width: 200px;\n\
  }\n```\n\n### 边框\n\n`border` 属性接受组合多个以下值：\n\n- `border-width`：它定义了边框的厚度。\n    -\
  \ `thin`\n    - `medium`\n    - `thick`\n- `border-style`：它指定了元素周围绘制的线条的类型，包括：\n\
  \    - `dotted`：定义点线。\n    - `dashed`：定义虚线。\n    - `solid`：定义实线。\n    - `double`：定义双线。\n\
  \    - `groove`：定义三维凹槽边框，效果取决于 `border-color`。\n    - `ridge`：定义三维脊形边框，取决于 `border-color`。\n\
  \    - `inset`：定义三维内凹边框，取决于 `border-color`。\n    - `outset`：定义三维凸出边框，取决于 `border-color`。\n\
  \    - `none`：定义无边框。\n    - `hidden`：定义隐藏边框。\n- `border-color`：它指定四个边框的颜色并接受所有有效的颜色值。\n\
  \n## 边框宽度与颜色\n\n\n\n\nCSS 内边距（padding）属性用于在任何定义的参数内在元素内容周围生成空间。通过 CSS，你可以对内边距（pads）进行完全控制。元素的每个侧（上、右、下、左）都有内边距设置属性。CSS\
  \ 为元素的每个部分提供了内边距规格：\n\n* `padding-top`\n* `padding-right`\n* `padding-floor`\n*\
  \ `padding-left`\n\n所有完成属性都可能具有以下值：\n\n* `length` – 指定以 `px`、`pt`、`cm` 等单位的内边距。\n\
  * `%` – 指定为内容宽度百分比的内边距。\n* `inheritance` – 指定内边距继承自父元素。\n\n# CSS 盒模型\n\n该模型是一个封装\
  \ HTML 包含的所有内容的盒子：外边距、边框、内边距和原始内容。在 CSS 中，引用设计和结构时使用“盒模型”一词。\n\n不同部分的描述：\n\n* `Content`（内容）\
  \ – 盒的内容，文本和图像出现的地方。\n* `Padding`（内边距） – 清除内容周围的区域。内边距是可见的。\n* `Border`（边框） – 内边距和内容周围的边框。\n\
  * `Margin`（外边距） – 可以清除边框之外的区域。外边距是清晰的。\n\n# CSS 表格\n\nCSS 中的表格用于对 HTML 表格元素应用各种样式元素，以便以行和列或更复杂的格式组织数据。表格被用于通信和研究数据分析。CSS\
  \ 中的表格布局可用于显示表格布局。此功能主要用于设置用于编辑 `<table>` 单元格、行和列的算法。\n\n`Border`（边框）：用于指定表格中的参数。\n\
  \n# CSS 字体\n\n元素的四个侧可以并排设置，例如 `margin-top`、`margin-right`、`margin-bottom`、`margin-left`（外边距），以及\
  \ `padding-top`、`padding-right`、`padding-bottom`、`padding-left`（内边距），这些都是你可以使用的自言自懂的属性。你可以设置元素的以下字体属性：\n\
  \n* `font-family` 属性用于更改字体的字体类型。\n* `font-style` 属性用于使字体变为斜体或倾斜。\n* `font-variant`\
  \ 属性用于创建小型大写效果。\n* `font-weight` 属性用于增加或减少字体的粗细程度。\n* `font-size` 属性用于增加或减小字体的大小。\n\
  * `font` 属性用于指定其他字体属性的数量。\n\n# CSS 文本\n\n* `color` 属性用于设置文本颜色。\n* `direction` 属性用于设置文本方向。\n\
  * `letter-spacing` 属性用于增加或减少单词中字母之间的间距。\n* `word-spacing` 属性用于增加或减少句子单词之间的间距。\n\
  * `text-indent` 属性用于缩进落落。\n* `text-align` 属性用于对齐文档内容。\n* `text-decoration` 属性用于文本的下划线、上线和删除线。\n\
  * `text-transform` 属性用于将内容或文本转换为大写或小写字母。\n* `white-space` 属性用于控制文本的流和格式。\n* `text-shadow`\
  \ 属性用于设置文本周围的阴影。\n\n# CSS 函数\n\nCSS 函数用于许多不同的 CSS 结构。例如，你可以使用 `RGB()` 函数分配颜色值（类似于\
  \ `color: RGB(205, 0, 215)`），使用 `attr()` 函数获取 HTML 属性值。许多函数被用于 CSS 转换。例如，旋转函数 `()`\
  \ 可以用于旋转元素，`scale()` 函数可以用于缩放对象，而 `translate()` 函数可以用于移动元素。\n\n还有其他实用的函数，例如 `circle()`\
  \ 可以将对象附加到圆形，或为文本环绕流创建一个圆形，还有一个计数函数 `()` 可以用于为图表提供计算值。\n\n以下是 CSS3 中的 CSS 函数列表：\n\
  \n* `attr()`\n* `blur()`\n* `brightness()`\n* `calc()`\n* `circle()`\n* `contrast()`\n\
  * `counter()`\n* `counters()`\n* `cubic-bezier()`\n* `drop-shadow()`\n* `ellipse()`\n\
  * `filter()`\n* `grayscale()`\n* `HSL()`\n* `hsla()`\n* `hue-rotate()`\n* `hwb()`\n\
  * `image()`\n* `inset()`\n* `invert()`\n* `linear-gradient()`\n* `matrix()`\n* `matrix3d()`\n\
  * `opacity()`\n* `perspective()`\n* `polygon()`\n* `radial-gradient()`\n* `repeating-linear-gradient()`\n\
  * `repeating-radial-gradient()`\n* `RGB()`\n* `rgba()`\n* `rotate()`\n* `rotate3d()`\n\
  * `rotateX()`\n* `rotateY()`\n* `rotateZ()`\n* `saturate()`\n* `sepia()`\n* `scale()`\n\
  * `scale3d()`\n* `scaleX()`\n* `scaleY()`\n* `scaleZ()`\n* `skew()`\n* `skewX()`\n\
  * `symbols()`\n* `translate()`\n* `translate3d()`\n* `translateX()`\n* `translateY()`\n\
  * `translateZ()`\n* `URL()`\n* `var()`\n\n# 为什么用 FLEXBOX（弹性布局）？\n\n长期以来，创建布局的唯一可靠浏览器兼容工具是浮动（floats）和定位等功能。这些工具虽然有效，但在某些方面具有局限性且令人沮丧。\n\
  \n以下构建设计在任何形式的简单、灵活的方法中都是难以或无法实现的：\n\n* 在父元素内将内容块元素垂直居中。\n* 让容器容器的所有子元素占据相同的宽度/高度。\n\
  * 让多列布局中的所有列具有相同的高度，即使它们包含的内容量不同。\n\n# CSS FLEXBOX\n\nFlexbox CSS 布局允许你轻松格式化 HTML。Flexbox\
  \ 允许你使用行和列轻松地水平和垂直地引导对象。项目将“变为”不同的大小以填充空间。它让响应式设计变得更容易。\n\nCSS flexbox 是标准网站设计或应用程序的理想选择。它易于阅读，支持所有现代浏览器，并且掌握基础知识不需要花费长时间。在本节结束时，你将准备好在\
  \ Web 项目开始开始 flexbox。\n\nFlexbox 是一种在行或列中排列对象的 1D 布局。项目可以伸缩填充空白或缩小到较小的空间。\n\n弹性容器属性有：\n\
  \n* `flex-direction`\n* `flex-wrap`\n* `flex-flow`\n* `justify-content`\n* `align-items`\n\
  * `align-content`\n\n# CSS 媒体类型\n\n## 媒体类型简介\n\n样式表最重要的功能之一是你可以为不同类型的媒体指定不同的样式表。这是创建适用于打印机的\
  \ Web 页面的好方法——它只是为“打印（print）”媒体类型提供单独的样式表。\n\n某些 CSS 功能仅用于媒体。例如，页面排序功能仅适用于带有页码的页面。还有少数几个可以被不同媒体类型共享的内容，但它们对该功能可能需要不同的值。例如，字体大小功能可以用于屏幕和打印媒体，但可能值不同。\n\
  \n文档通常为了更好的阅读体验，电脑屏幕上的字体比纸张需要更大，而无衬线字体（sans-serif）被认为在屏幕上易读，而衬线字体（serif）则因打印而闻名。因此，有必要明确样式表或一组样式规则适用于特定类型的媒体。\n\
  \n## 方法 1：使用 @MEDIA 规则\n\n`@media` 规则用于在单个样式表中为不同的媒体定义不同的样式规则。它后面跟着由逗号分隔的媒体类型列表以及包含目标媒体样式规则的\
  \ CSS 声明块。\n\n**示例：**样式告诉浏览器在屏幕上使用 14 像素 Arial 字体显示主体内容，但在打印时将使用 12 点的 Times 字体。\n\
  \n## 方法 2：使用 @IMPORT 规则\n\n`@import` 规则是指定特定媒体细节的另一种方法——它只是在导入样式表的 URL 之后指定逗号分隔的媒体类型。\n\
  \n## 方法 3：使用 <LINK> 元素\n\n`<link>` 功能中的 `media` 属性用于在 HTML 文档中为外部样式表指定目标媒体。\n\n\n\
  \n\n\n## 媒体类型\n\n以下列出了用于目标打印机、设备、计算机屏幕等不同类型设备的各种媒体类型。\n\n- `all`: 用于所有媒体类型设备。\n\
  - `aural`: 用于语音和声音合成器。\n- `braille`: 用于触觉反馈设备。\n- `embossed`: 用于凸起式盲文打印机。\n- `handheld`:\
  \ 用于小型或手持设备设备，如手机手机或 PDA 的小屏设备。\n- `print`: 用于打印机。\n- `projection`: 用于投影演示，例如投影仪。\n\
  - `screen`: 主要用于彩色计算机屏幕。\n- `tty`: 用于使用固定间距字符网格的媒体，如电打字机、终端和显示能力有限的便携设备。\n- `tv`:\
  \ 用于低分辨率、彩色、具有有限滚动能力的屏幕并带有音频的电视类型设备。\n\n## 媒体查询与响应式网页设计\n\n媒体查询允许在不改变标记语言的情况下，针对特定设备范围（如手机、平板电脑、桌面电脑等）自定义网页页的呈现方式。媒体查询包含媒体类型以及零或多个表达式，例如某些媒体特征的类型和条件，如设备宽度或屏幕分辨率。这里有一个针对标准设备的典型媒体查询简单示例。\n\
  \n## 媒体查询\n\n响应式设计之所以出现，是因为媒体查询。媒体查询第 3 定义是 2009 年的候选建议（Candidate Recommendations），这意味着它被认为已准备好在浏览器中实现。媒体查询允许我们创建一系列测试，并通过选择自定义页面样式以满足用户需求来应用\
  \ CSS。\n\n例如，以下媒体查询问题用于检查当前网页是否作为屏幕媒体显示（因此它不是打印文档），并且查看区域宽度是否为 800 像素。只有当这两个条件都满足时，CSS\
  \ 选择器 `.container` 才会使用。\n\n## 你可能知道的优点\n\n让我们学习更多关于 CSS 的优点，例如：\n\n1. CSS 的主要优点之一是它对数字营销非常有用，因为你网页的每一次推广都提供了一个商业机会。因此，借助\
  \ CSS 技术使用带有代码公式的更多内容，最终对数字营销和你的业务更有利。\n2. CSS 通过对你的网站进行微小更改，让网站的其他部分也看到类似的变化。网站越大，在转换方面涉及的内容和布局，CSS\
  \ 就能为你节省大量时间。它还会检查并验证每个页面是否符合 CSS 优点。\n3. W3C 的目标是让整个网站能够像普通用户使用那样供残障用户访问。CSS 首先通过创建布局和文档来实现访问，使得任何屏幕阅读器都能准确地读取内容。这对于听障用户有用，因为他们依赖屏幕阅读器运行\
  \ Web 应用。\n4. 为了让网站正常工作，它必须具有快速下载时间。如今，人们通常只需等待几秒钟即可加载。因此，确保快速至关重要。对于希望确保网站信息快速流畅的公司来说，CSS\
  \ 成为他们成功的关键。\n5. CSS 由于维护时间短，非常易于维护。这是因为单行代码转换会影响整个网页。此外，如果需要升级，只需花一点精力即可减少对网页代码的更改。\n\
  6. CSS 赋能开发者，使其确保样式特征在每几个网页上一致应用。\n7. 由于加载速度快，CSS 在 Web 开发过程中节省了大量的时间和精力。在这里，一点时间就能确保设计师的良好性能。\n\
  \n## CSS 的缺点\n\n使用 CSS 时会有一些不足。在设计网站时，必须意识到这些糟糕的情况，以便发现并处理它们。\n\n1. CSS 层级过多导致的困惑：初学者在这方面风险很高。他们在选择阅读\
  \ CSS 时可能会感到困惑，因为有许多 CSS 层级，如 CSS2、CSS3 等。\n2. 浏览器问题：不同浏览器的工作方式不同。因此，你应该检查 CSS 代码对网站的更改是否对所有浏览器都可见。\n\
  3. 安全问题：在如今这个技术和数据驱动的世界中，安全性至关重要。CSS 的缺点之一是它的安全性有限。\n4. 额外的开发工作：设计服务要求在所有不同浏览器中考虑并测试所有\
  \ CSS 代码以确保兼容性。由于在不同浏览器中测试开发者兼容性，他们的工作量正在增加。\n\n总而言之，我们可以说如果你喜欢 Web 开发，请尝试学习 HTML\
  \ 和 CSS。对于设备兼容性，请阅读 Bootstrap 框架。虽然你可能会看到 CSS 的一些缺点，但许多优点是相反的，并能确保你的 Web 开发过程顺畅高效。\n\
  \n## 章节总结\n\n在这里我们涵盖了 CSS 的所有基本概念，每个人都可以利用它们让自己的页面具有吸引力。使用 CSS 最重要的事情就是实践，一旦你开始练习，就能很快入门。在接下来的章节中，你将学习让你的工作变得非常简单的\
  \ CSS 属性。\n\n# 第 2 章 CSS 属性\n\nDOI: [10.1201/9781003358060-2](https://doi.org/10.1201/9781003358060-2)\n\
