  \ -gradient()` ( ) ).\n\n## `repeating-radial-gradient()`\n\nCSS `repeating-radial-gradient()`\
  \ 允许创建一个无限重复的径向渐变。CSS 渐变允许为元素应用多种背景颜色，这些颜色从单一颜色过渡到下一种。重复径向渐变是颜色停止点无限重复的渐变。径向渐变具有圆形或椭圆形。在创建径向渐变时，指定渐变的中心以及大小和形状。\n\
