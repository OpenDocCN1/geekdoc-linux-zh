  \n# Zeba Academy – 精通计算机科学\n\n“Mastering Science”系列书籍由 Sufyan bin Uzayr 领导的 Zeba\
  \ Academy 团队编写，包括：\n\n*   Divya Sachdeva\n*   Jaskiran Kaur\n*   Simran Rao\n* \
  \  Aruqqa Khateib\n*   Suleymen Fez\n*   Ibbi Yasmin\n*   Alexander Izbassar\n\n\
  Zeba Academy 是一家教育科技初创企业，主要为 STEM 领域的学习者开发课程和内容，并为全球学习者和教育者提供教育咨询和指导。\n\n此外，Zeba\
