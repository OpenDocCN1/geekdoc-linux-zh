  \ 和 `counter-set` 属性创建并操作计数器。\n\n例如，你可以使用 `counter()` 输出元素的大罗马数字、阿拉伯数字等计数器。你还可以指定\
  \ Unicode 代码点来指定使用的特殊符号或图标作为标记表示。\n\n**语法：** `counter()` 函数有两种形式，如 `counter(name)`\
  \ 或 `counter(name, style)`。文本是伪元素作用范围内给定名称的内层计数器的值；它按指定的样式格式化（默认认为进制）。\n\n`counter()`\
  \ 函数的语法如下：`counter( <ident> [, [ <counter-style> | none ]?)`\n\n代码的输出所示：\n\n![](img/ufig4_11.jpg)\n\
