  \ -ms-user-select: none; user-select: none; padding: 10vh 0 25vh; --marquee-width:\
  \ 100vw; --offset: 20vw; --move-initial: calc(-25% + var(--offset)); --move-final:\
  \ calc(-50% + var(--offset)); --item-font-size: 10vw; counter-reset: menu; } .menu__item\
  \ { cursor: default; position: relative; padding: 0 5vw; } .menu__item-link { display:\
  \ inline-block; cursor: pointer; position: relative; -webkit-text-stroke: 1.5px\
