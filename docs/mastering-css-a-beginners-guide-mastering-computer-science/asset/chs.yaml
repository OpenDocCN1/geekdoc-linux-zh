  \ 属性：`text-shadow` 属性用于为文本应用阴影效果。你也可以使用 `text-shadow` 为文本应用投影阴影、外光和其他阴影效果。该属性接受一个值列表。列表中的每个项目可以有两个、三个或四个值。\n\
  \n代码的输出所示：\n\n![](img/ufig2_49.jpg)\n\nCSS `text-shadow` 属性。\n\n## CSS 变换属性\n\n\
  `transform` 属性用于在二维 (2D) 或三维 (3D) 空间中变换元素。例如，旋转元素、缩放元素、倾斜元素等。\n\n### 2D 变换函数\n\n\
  `transform` 属性接受一组“变换函数”作为值。这些函数具有名称，如 `scale()`、`rotate()`、`skew()` 等，它们接受参数来确定变换的程度（例如，旋转元素的角度）。\n\
  \n`transform` 的语法所示：`transform: none | <transform-function> [ <transform-function>\
  \ ]`\n\n这些函数按 2D（二维）和 3D（三维）函数进行分组。\n\n`matrix()`：它指定以由六个值 a-f 组成的矩阵形式的 2D 变换。\n\
  \n`matrix` 的语法所示：`matrix() = matrix( <number> [,<number> ]{5,5} )`\n\n`translate()`：它移动元素的位置。它通过向量\
  \ `[x, y]` 指定一个 2D 平移，其中 `tx` 是第一个平移值参数，`y` 是可选的第二个平移值参数。\n\n`translate` 的语法所示：`translate(\
  \ <translation-value>[, <translation-value>]? )`\n\n`translateX()`：它水平移动元素。它指定在\
  \ X 方向上按给定量平移。\n\n`translateX` 的语法所示：`translateX( <translation-value> )`\n\n`translateY()`：它垂直移动元素。它指定在\
  \ Y 方向上按量平移。\n\n`translateY` 的语法所示：`translateY( <translation-value> )`\n\n`scale()`：它修改元素的大小。它通过两个参数描述的\
  \ `[sx,sy]` 向量指定 2D 缩放操作。\n\n`scale` 的语法所示：`scale( <number>[, <number>]? )`\n\n\
  `scaleX()`：它使用 `[sx,1]` 向量指定 2D 缩放操作，其中 `sx` 作为参数给出。\n\n`scaleX` 的语法所示：`scaleX(\
  \ <number>[, <number>]? )`\n\n`scaleY()`：它使用 `[1,sy]` 向量指定 2D 缩放操作，其中 `sy` 作为参数给出。\n\
  \n`scaleY` 的语法所示：`scaleY( <number>[, <number>]? )`\n\n`rotate()`：它指定围绕 `transform-origin`\
  \ 属性定义的原点，按指定的角度参数进行 2D 旋转。\n\n`rotate` 的语法所示：`rotate( <angle> )`\n\n`skew()`：它按给定角度沿\
  \ X 轴和 Y 轴指定 2D 倾斜变换。如果没有提供第二个参数，则其值为零。\n\n`skew` 的语法所示：`skew( <angle> [, <angle>\
  \ ]? )`\n\n`skewX()`：它按给定角度沿 X 轴指定 2D 变换。\n\n`skewX` 的语法所示：`skewX( <angle> )`\n\n\
  `skewY()`：它按给定角度沿 Y 轴指定 2D 变换。\n\n`skewY` 的语法所示：`skewY( <angle> )`\n\n代码的输出所示：\n\
  \n![](img/ufig2_50.jpg)\n\n2D 变换函数。\n\n### 3D 变换函数\n\n它允许沿三个轴（x、y、z 轴）应用变换，如三维笛卡尔坐标系所示。CSS\
  \ 中提供的 3D 变换函数所示：\n\n`matrix3d()`：它以列主顺序的 16 个值的 4x4 相同矩阵指定 3D 变换。\n\n`matrix3d`\
  \ 的语法所示：`matrix3d() = matrix3d( <number> [, <number> ]{15,15} )`\n\n`translate3d()`：它通过向量\
  \ `[tx,ty,tz]` 指定 3D 平移，其中 `tx`、`ty` 和 `tz` 分别是第一、第二和第三平移值参数。\n\n`translate3d` 的语法所示：`translate3d()\
  \ = translate3d( <translation-value>, <translation-value>, <length> )`\n\n`translateZ()`：它通过向量\
  \ `[0,0,tz]` 指定在 Z 方向上按给定量进行 3D 平移。\n\n`translateZ` 的语法所示：`translateZ() = translateZ(\
  \ <length> )`\n\n`scale3d()`：它通过三个参数描述的 `[sx,sy,sz]` 向量指定 3D 缩放操作。\n\n`scaleZ()`：它使用\
  \ `[1,1,sz]` 向量指定 3D 缩放操作，其中 `sz` 作为参数给出。\n\n`scaleZ` 的语法所示：`scaleZ() = scaleZ(\
  \ <number> )`\n\n`rotate3d()`：它通过前三个参数描述的 `[x,y,z]` 向量，按最后一个参数指定的角度指定 3D 旋转。\n\n\
  `rotate3d` 的语法所示：`rotate3d() = rotate3d( <number>, <number>, <number>, <number>\
  \ )`\n\n`rotateX()`：这与 `rotate3d(1, 0, 0, <angle>)` 相同。\n\n`rotateX` 的语法所示：`rotateX()\
  \ = rotateX( <angle> )`\n\n`rotateY()`：这与 `rotate3d(0, 1, 0, <angle>)` 相同。\n\n`rotateY`\
  \ 的语法所示：`rotateY() = rotateY( <angle> )`\n\n`rotateZ()`：这与 `rotate3d(0, 0, 1, <angle>)`\
  \ 相同（同时也与 `rotate( <angle> )` 相同）。\n\n`rotateZ` 的语法所示：`rotateZ() = rotateZ( <angle>\
  \ )`\n\n`perspective()`：它定义了 `z=0` 平与用户之间的距离，以便为 3D 定位的元素提供透视效果。\n\n`perspective`\
  \ 的语法所示：`perspective() = perspective( <length> )`\n\n代码的输出所示：\n\n![](img/ufig2_51.jpg)\n\
  \n3D 变换函数。\n\n## CSS 过渡属性\n\nCSS `transition` 属性用于定义 CSS 过渡的属性，并将四个过渡属性合并到一个属性中。`transition`\
  \ 属性合并了以下属性，如 `transition-property`、`transition-duration`、`transition-timing-function`\
  \ 和 `transition-delay`。\n\n代码的输出所示：\n\n![](img/ufig2_52.jpg)\n\nCSS 过渡属性。\n\n##\
  \ 章节总结\n\n在本章中，我们通过示例简要地学习了许多 CSS 属性，以便清楚地理解如何在 CSS 中编写代码语法。下一章将关于 CSS 中最重要的概念之一——CSS\
