  \nHSL（代表 Hue Saturation Lightness）是计算机图形 RGB 色彩空间的一种基于色调的表示。\n\nHSL 模型被认为比 RGB 模型更直观。HSL\
  \ 模型允许选择基础色调，然后根据需要调整其饱和度和亮度。它接受 HSL 值作为参数。HSL 值以逗号分隔的三个值提供，分别提供色调、饱和度和亮度分量。可以通过观察色轮来识别色调。\n\
  \n这里有一个显示蓝色的示例：`HSL(240, 100%, 50%)`\n\n### 如何选取颜色\n\nHSL（Hue Saturation Lightness）是基于色调的\
