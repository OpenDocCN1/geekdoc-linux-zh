  \nCSS 函数 (HSL）。\n\n## hsla()\n\n`hsla()` 函数可以在使用 CSS 时提供颜色值。它允许通过指定颜色的色调、饱和度和亮度分量来指定该值。HSL（代表\
  \ Hue Saturation Lightness）是计算机图形 RGB 色彩空间的一种基于色调的表示。\n\nHSL 模型被认为比 RGB 模型更直观。HSL\
  \ 模型允许选择基础色调，然后根据需要调整其饱和度和亮度。它接受 HSLA 值作为参数。HSLA 值以逗号分隔的四个值提供，分别提供色调、饱和度和亮度分量，第四个值是透明度（alpha）。\n\
