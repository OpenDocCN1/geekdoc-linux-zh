  \n![](img/ufig3_43.jpg)\n\n网格结构选择器（`:nth-col()`）。\n\n## 章节总结\n\n在本章中，我们涵盖了 CSS 中所有有价值和常用的属性并附带了描述。通过阅读这些内容，初级用户可以获得良好的知识。下一章将关于\
  \ CSS 内置函数。\n\n# 第 4 章 CSS 函数\n\nDOI: [10.1201/9781003358060-4](https://doi.org/10.1201/9781003358060-4)\n\
  \n## 引言\n\nCSS 函数用于各种 CSS 属性。例如，你可以使用 `RGB()` 函数提供颜色值（例如 `color: RGB(105, 0, 215)`），或者使用\
  \ `attr()` 函数获取 HTML 属性的值。\n\n各种函数被用于 CSS 变换（transforms）。例如，`rotate()` 函数可以用于旋转元素，`scale()`\
  \ 函数可以改变元素的大小，而 `translate()` 函数可以移动元素。\n\n还有一些函数，例如 `circle()` 可以将元素裁剪为圆形，或者为文本创建一个可以环绕的圆形；`calc()`\
  \ 函数可以为属性提供计算后的值。\n\n## CSS 函数基础\n\n## attr()\n\n`attr()` 函数检索所选元素的值并可以在样式表中使用。它可以用于伪元素，在这种情况下，将返回伪元素源元素上的属性值。\n\
  \n上述代码的输出所示：\n\n![](img/ufig4_1.jpg)\n\nCSS 函数（`:attr()`）。\n\n## attr() 的用法\n\n\
  另一个超链接 URL 的示例。\n\n代码的输出所示：\n\n![](img/ufig4_2.jpg)\n\nCSS 函数（`:attr()`）。\n\n这里有一个示例，通过它将了解如何使用\
  \ `attr()` CSS 附加文本。\n\n代码的输出所示：\n\n![](img/ufig4_3.jpg)\n\nCSS 函数（`:attr()`）。\n\
  \n## blur()\n\n`blur()` 与 `filter` 配合使用，对图像应用模糊效果。`blur()` 函数的语法如下：`blur() = blur(\
  \ <length> )`\n\n代码的输出所示：\n\n![](img/ufig4_4.jpg)\n\nCSS 函数（`:blur()`）。\n\n## brightness()\n\
  \n`brightness()` 函数用于调整图像的亮度。\n\n`brightness()` 函数的语法如下：`brightness() = brightness(\
  \ [ <number> | <percentage> ] )`\n\n解释：`brightness()` 函数接受数字或百分比作为参数。它决定了图像的亮度水平。图像值为\
  \ 0% 将完全变为黑色。图像值为 100% 将保持不变。高于 100% 的值会产生更亮的图像。数值 0.2 的效果与百分比值 20% 相同。不允许负值。它与\
  \ `filter` 属性配合调整图像亮度。该函数对输入图像应用线性乘法，使其看起来更亮或更暗。它需要传递一个参数，用于确定应用于图像的亮度水平。参数可以是百分比或数字。\n\
  \n上述代码的输出所示：\n\n![](img/ufig4_5.jpg)\n\nCSS 函数（`:blur()`）。\n\n## calc()\n\nCSS `calc()`\
  \ 函数允许在 CSS 属性值中使用计算。在设置宽度、高度、角度、频率等时，`calc()` 可以替代其他单位类型。浏览器使用的精确值将是 `calc()` 函数执行的结果。\n\
  \n上述代码的输出所示：\n\n![](img/ufig4_6.jpg)\n\nCSS 函数（`:calc ()`）。\n\n## circle()\n\n`circle()`\
  \ 是 CSS 形状模块的一部分，是一种基础形状值。像 `circle()` 这样的基础形状可以作为 `shape-outside` 等属性的值，用于控制内容（代码）环绕元素的流向，并用于\
  \ `clip-path` 将元素的内容裁剪为基础形状。这意味着你的文本以圆形的形状环绕元素，图像被裁剪为圆形。\n\n`circle()` 函数的语法如下：`circle()\
  \ = circle( [<shape-radius>]? [at <position>]? )`\n\n### 如何定位圆形\n\n你可以通过各种半径参数和有效的\
  \ CSS 位置为圆形指定位置。它指定了圆心的中心。它像这样分离半径和位置：`shape-outside: circle(100px 50px);`\n\n代码的输出所示：\n\
  \n![](img/ufig4_7.jpg)\n\nCSS 函数（`:circle()`）。\n\n代码的输出所示：\n\n![](img/ufig4_8.jpg)\n\
  \nCSS 函数（`:circle()`）。\n\n代码的输出所示：\n\n![](img/ufig4_9.jpg)\n\nCSS 函数（`:circle()`）。\n\
  \n## contrast()\n\nCSS `contrast()` 与 `filter` 属性配合使用，调整图像的亮度。`contrast()` 需要传递一个参数。它决定了应用于图像的亮度水平。参数可以是百分比或数字。\n\
