  \ 属性：`border-bottom-color` 属性单独设置元素底部边框的颜色。然而，在其他情况下，使用 `border color` 或 `border\
  \ bottom` 等简属性更加方便且更优。该属性的语法如下：`border-bottom-color: color | transparent | inherit`\n\
  \n### 4. `border-bottom-left-radius` 属性：`border-bottom-left-radius` 属性设置元素边框框“左下”角的圆角形状。\n\
  \n代码的输出如下：\n\n![](img/ufig2_15.jpg)\n\nCSS 边框底部左属性 – 左、右。\n\n### 5. `border-bottom-style`\
  \ 属性：`border-bottom-style` 属性单独设置元素底部边框的样式。然而，在其他情况下，使用 `border style` 或 `border\
  \ bottom` 等简属性更加方便且更优。\n\n该属性的语法如下：`border-bottom-style: none | hidden | dashed\
  \ | dotted | solid | double | groove | ridge | inset | outset | initial | inherit`\n\
  \n代码的输出如下：\n\n![](img/ufig2_16.jpg)\n\nCSS 各种边框样式。\n\n### 6. `border-image` 属性：`border-image`\
  \ CSS 属性指定如何使用图像代替边框样式。这是一个用于同时设置 `border-image-source`、`border-image-width`、`border-image-slice`、`border-image-outset`\
  \ 和 `border-image-repeat` 属性的属性。该属性的语法如下：`border-image: [ source slice width outset\
  \ repeat ] | initial | inherit`\n\n代码的输出如下：\n\n![](img/ufig2_17.jpg)\n\nCSS border-image\
  \ 属性。\n\n## CSS 颜色属性\n\nCSS 颜色功能设置文本元素内容的颜色。所有现代网络浏览器都支持不同的颜色以保持丰富的显示效果。在 CSS 中，颜色可以用多种方式表示，甚至可以使用诸如“color:\
  \ blue”这样的颜色单词。然而，这种方法仅支持某些颜色的名称。因此，在 CSS 中使用了其他更的方法的方法显示颜色，如 `RGB`、`HSL`、`HEX`\
  \ 等。\n\n代码的输出如下：\n\n![](img/ufig2_18.jpg)\n\nCSS 颜色属性 (color)。\n\n### RGB 颜色\n\n\
  RGB 是三种颜色（红、绿、蓝）的组合，用于所有计算机程序中显示颜色。正如我们所知，这些是基础色，通过组合它们，我们可以找到光谱中出现的任何颜色。\n\n代码的输出如下：\n\
  \n![](img/ufig2_19.jpg)\n\nCSS 颜色属性 (RGB)。\n\n### RGBA 颜色\n\n在 CSS 中，`RGBA` 也是带有\
  \ Alpha 扩展的颜色显示格式。这种颜色工作的结构如下：\n\n```\nrgba (Red, Green, Blue, Alpha)\n```\n\n在此项中，`Alpha`\
  \ 用于表示颜色的模糊。在 CSS `opacity` 中，该区域用于设置颜色亮度，其范围在 0.0 到 1.0 之间，其中 0.0 代表完全透明，1.0 代表完全不透明。你将在提供的示例中更好地理解。\n\
  \n代码的输出如下：\n\n![](img/ufig2_20.jpg)\n\nCSS 颜色属性 (RGBA)。\n\n### CSS HEX 颜色\n\nCSS\
  \ 颜色也可以通过十六进制值定义，这是另一种表示颜色的方法。在 CSS 中，它是使用“#”符号配合十六进制定义颜色最常用的方式，例如 `#RRGGBB`。尽管\
  \ `R`、`G`、`B` 分别红、绿、蓝。\n\n使用 0-9 和 A-F 组合的十六进制数用于在 CSS 中表示颜色。下面是 HEX 基础色的示例。\n\n\
