  \ 和 `counter()` 函数配合使用，这些函数允许按指定的格式显示计数器的值。\n\n`counters()` 有两种形式：`counters(name,\
  \ string)` 或 `counters(such as name, string, style)`。文本是伪元素作用范围内给定名称的计数器的值，根据指定的字符串从最外层到最内层排列。计数器按指定的样式渲染（默认认为进制）。\n\
