  ### CSS 动画属性\n\n`animation` 属性是 `animation-name`, `animation-duration`, `animation-direction`,\
  \ `animation-timing-function`, `animation-delay`, `animation-iteration-count`, `animation-fill-mode`\
  \ 和 `animation-play-state` 的。以下是动画属性的默认值：\n\n它适用于所有元素、`::before` 和 `::after` 伪元素。下表描述了动画属性的值：\n\
  \n1.  `animation-name` 属性：`animation-name` CSS 属性定义了应用于所选元素的 `@keyframes` 定义的动画名称。属性语法如下：`animation-name:\
  \  keyframe name | none | initial | inherit`\n2.  `animation-duration` 属性：`animation-duration`\
  \ CSS 属性定义了完成一个周期所需的秒数或毫秒。该属性的语法为：`animation-duration: time | initial | inherit`\n\
  3.  `animation-timing-function` 属性：`animation-timing-function` CSS 属性指定了 CSS 动画在周期内的进展方式。该属性的语法为：`animation-timing-function:\
  \ linear | ease | ease-in | ease-out | ease-in-out | cubic-bezier(n,n,n,n) | initial\
  \ | inherit`\n4.  `animation-delay`: 它指定了动画开始前的延迟。`animation-delay` CSS 属性定义了动画何时开始。该属性的值可以用秒（s）或毫秒（ms）指定。\n\
  \n    语法为：`animation-delay:  time | initial | inherit`\n5.  `animation-iteration-count`\
  \ 属性：`animation-iteration-count` 属性定义了动画周期在停止前播放的次数。\n\n\n\n\n\n### 6. `animation-direction`\
  \ 属性：`animation-direction` CSS 属性指定动画在交替循环中是否反向播放。\n\n该属性的语法如下：`animation-direction:\
  \ normal | reverse | alternate | alternate-reverse | initial | inherit`\n\n### 7.\
  \ `animation-fill-mode` 属性：`animation-fill-mode` 属性定义了 CSS 动画在执行之前和之后如何向目标应用样式。\n\
  \n该属性的语法如下：`animation-fill-mode: none | backwards | forwards | both | initial |\
  \ inherit`\n\n下表定义了该属性的值：\n\n| Value | Description |\n| --- | --- |\n| none | 动画在执行前或执行后都不会应用到目标上。\
  \ |\n| forwards | 动画结束后，动画将应用动画结束时刻的值。 |\n| backwards | 动画在属性定义的期间，将应用启动动画第 1 次迭代的关键帧中定义的值。可以是\
  \ `from` 帧的值，也可以是 `to` 帧的值。 |\n\n### 8. `animation-play-state` 属性：`animation-play-state`\
  \ 属性指定动画是在播放中还是暂停状态。\n\n该属性的语法如下：`animation-play-state: paused | running | initial\
  \ | inherit`\n\n### 9. `initial`：将属性设置为其默认值。\n\n### 10. `inherit`：如果指定此值，关联元素将继承其父元素动画属性的计算值。\n\
  \n## @KEYFRAMES 规则\n\n当我们在 `@keyframes` 规则内部指定 CSS 样式时，动画会在特定时间从当前样式变为新样式。\n\n代码的输出所示：\n\
