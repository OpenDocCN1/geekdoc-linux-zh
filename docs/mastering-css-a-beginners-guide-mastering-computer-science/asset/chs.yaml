  \n# 第 1 章：CSS 简介\n\nDOI: [10.1201/9781003358060-1](https://doi.org/10.1201/9781003358060-1)\n\
  \n在本章中，我们将学习 `CSS`（层级样式表）、其基本概念、版本、语法以及如何将 HTML 页面与 CSS 文件关联。其他概念如模块、选择器、ID、边框、属性、表格、表单、颜色等将在整个课程中涵盖。。让我们从\
  \ CSS 的基础知识开始吧。\n\n\n\n\n\n文档通常是使用标签语言创建文本文件——`HTML` 是常用的标记语言，但你也可以与其他标签语言（如 `SVG`\
  \ 或 `XML`）结合。向其他用户展示文档意味着将其转换为你的观众所使用的格式。其他浏览器，如 `Firefox`、`Chrome` 或 `Edge`，旨在通过视图传递文本，例如在计算机屏幕、投影仪或打印机上。\n\
  \n层级样式表（`CSS`）是一种整合了所有与网页显示相关信息的编程语言。`CSS` 定义了网站或页面的样式和格式，包括布局、字体、内边距（每个元素周围的空间）等。`CSS`\
  \ 与 `HTML` 共同构成了互联网运行的基础。所有标准和规范也由万维联盟（`W3C`）维护。\n\n`CSS` 可用于基本样式——例如更改标题和链接的颜色和大小。它可以用于构建结构，例如，将单列文本转换为主区域和相关信息栏。它还可以用于动画等效果。\n\
  \n## 历史\n\n`CSS` 受到挪威人 `Håkon Wium Lie` 的高度评价，他在 `1994` 年想要为万维网创建一个标准的样式表。第一个 `CSS`\
  \ 是在 Arena 浏览器中尝试的。自创建以来，`Lie` 与 `Tim Berners-Lee` 和 `Robert Cailliau` 共同生产了多个版本的\
  \ `CSS`——`CSS1`、`CSS2`。在第一个十年中（`1994`–`2004`），`CSS` 成为网页标准，对我们现在所知的万维网外观产生了重大影响。`CSS3`\
  \ 于 `1999` 年发布。\n\n`CSS` 是网页上使用的三种核心技术之一（另外两个是 `HTML` 和 `JavaScript`）。`CSS` 代表 Cascading\
  \ Style Sheets（层级样式表）——链接实际上是指“级联”和“样式”，这两个词描述了样式如何从一个传递到另一个。\n\n`CSS` 的多种优点之一是单个文档内可以使用多种样式。`CSS`\
  \ 用于定义 `HTML` 代码将变成什么样。虽然 `HTML`（超文本标记语言）用于创建内容（包括文本），但 `CSS` 改变了网页的外观。因此，根据想要显示的数据，开发者可能会选择使用标题和副标题样式，以确保文字出现在页面的顶部或侧边。\n\
  \n## 为什么我们需要 CSS？\n\n首先，应用 `CSS` 确保了你的网页的一致性。如果你的网站有 100 个页面，想象一下你每次想生成新网页时都必须输入代码来定义标题大小、布局和其他显示数据，并合并所有内容。再想象一下拥有一个\
  \ 100 个页面的网站，可以在保持其他一切不变的情况下更改其中一个页面。`CSS` 也让这成为可能。使用 `CSS` 在需要的地方带来了灵活性，能够对单个页面或部分进行更改。\n\
  \n## 为什么我们使用 CSS？\n\n为了让网站正常运行，它必须具有快速的下载时间。如今，人们通常只需等待几秒钟即可加载。因此，确保快速运行至关重要。对于寻求确保网站信息快速流畅的公司来说，`CSS`\
  \ 成为他们成功的关键。\n\n由于维护时间短，`CSS` 很容易维护。这是因为单行代码转换会影响整个网页。此外，如果需要升级，只需付出少量精力。\n\n你可能找不到许多优秀且易于使用的网站。所有这些网站的一个共同点是构建的一致性。`CSS`\
  \ 赋予开发者能力，确保样式特征在每个网页上得到一致应用。\n\n由于其速度快且易于维护，`CSS` 因其加载快速而在网页开发过程中节省了大量的时间和精力。在这里，短的时间确保了设计师良好的性能。\n\
  \n人们使用不同的智能设备查看特定网站。可以是智能手机、`PC` 或笔记本电脑。出于这一目的，网站需要与设备兼容。`CSS` 通过提供更好的对齐来确保运行顺畅。\n\
  \n你可以借助 `CSS` 更改 `HTML` 标签的位置。你可以根据需要将网页的任何部分设置为图像。\n\n## CSS 的不同版本\n\n- `CSS1`\
  \ 和 `CSS2`（不再适用）：于 `1996` 年 12 月由 `W3C` 作为建议发布。该版本定义了 `CSS` 语言和所有 `HTML` 标签的视觉格式模型。这些是不再更新或维护的两个\
  \ `CSS` 版本。\n- `CSS2.1`（推荐）：`W3C` 于 `1998` 年 5 月提出的建议，基于 `CSS1` 构建。该版本增加了对特定媒体样式表的支持，例如音频打印机和设备、可下载字体、对象布局和表格。此版本修复了\
  \ `CSS2` 中的许多错误和问题，现在是 `CSS` 的官方推荐版本。\n- `CSS3`：`CSS3` 于 `1999` 年 6 月成为 `W3C` 建议，并基于旧版本的\
  \ `CSS` 构建。它被分为名为 `Modules`（模块）的文本，这里的每个模块都定义了 `CSS2` 中定义的新扩展功能。这些版本在 `CSS2.1` 的基础上增加了新功能，并保持了背景兼容性。某些功能仍在测试中，并可能在未来发生变化。请谨慎使用，因为它可能会导致你的网站出现问题。\n\
  \n`CSS3` 是早期 `CSS` 版本（`CSS2`）的最新标准。`CSS2` 和 `CSS3` 之间的主要区别如下：\n\n- `Media Queries`（媒体查询）\n\
  - `Namespaces`（命名空间）\n- `Selectors Level 3`（选择器 3 级）\n- `Color`（颜色）\n\n`CSS4` 从未成为过正式版本。\n\
  \n\n\n\n\nCSS 工作组有时会开发新的 CSS 特性，有时是因为特定的浏览器对特定功能感兴趣，有时是因为 Web 设计师和开发者请求某项功能，或者是工作组确定了某项需求。CSS\
  \ 在不断演进，新功能不断出现。然而，CSS 最重要的一点是，大家都会努力确保不会以破坏旧版网站的方式更改内容。一个在 2000 年构建并使用当时有限 CSS\
  \ 构建的网站，在今天的浏览器中应该仍然可以运行！\n\n作为 CSS 的初学者，你可能会觉得 CSS 规范过于巨大——它的目的是让开发者将功能支持应用于用户代理，而不是让\
  \ Web 开发者学习理解 CSS。许多经验丰富的开发者更倾向于查看 MDN 文档或其他课程。然而，值得知道这些功能的存在，并理解你正在使用的 CSS、浏览器支持（见下文）以及细节之间的关系。\n\
  \n# CSS 模块\n\n由于有很多可以使用 CSS 样化的内容，该语言被分成了多个模块。当你探索 MDN 时，你会看到对这些模块的引用。许多文本页面是围绕特定模块组织的。例如，你可以参考“背景与边界”（Background\
  \ and Boundaries）模块中的 MDN 参考，来了解它包含的属性和特性的目的。\n\n在本节中，你不需要过多担心 CSS 是如何创建的；但是，如果你知道某个地方可以在其他内容中找到，那么获取信息可能会更容易，因此，它几乎处于相同的情况。\n\
  \n例如，让我们回到“背景与边界”模块——你可能认为背景颜色和边框颜色结构定义在这个模块中是合理的。你是对的。如果你对 HTML 有所了解，那就很好；如果没有，让我们简要介绍一下\
  \ HTML 以及如何将 CSS 文件链接到 HTML 中以更改样式。\n\n# 基础 HTML\n\n接下来的部分提供了 HTML 的介绍。没有 HTML，我们无法想象网页和万维网。它是编写网页最常用的语言。它代表“超文本标记语言”。你应该知道，在网页上找到的任何链接通常被称为“超文本”（Hypertext），而“标记”（mark）指的是标签或页面布局，以便列表中的文本能以正确的格式显示。开发\
  \ HTML 的目的是理解任何文本的结构：标题、正文、内容或分类。\n\n所以，基本上 HTML 提供了一种显示网页内容的结构化格式。它非常简单易懂。在 20\
  \ 世纪 90 年代，它由 Tim Berners-Lee 开发，随后经历了许多变化和修改。HTML `5` 是 HTML 的最新版本。\n\n你知道 HTML\
  \ 是一种简单的语言，可以使用许多标签来格式化内容。所有标签都包含在尖括号 `<tagname>` 中。除了少数标签外，大多数标签都以尖括号开始并以相应的尖括号结束。\n\
  \n`<! DocType Html>` 定义了 HTML 的文档类型和版本。`Html` 代码紧接 `<html>` 尖标记开始，并以 `</html>` 结束（上面的屏幕图中未显示）。\n\
  \n它通常有两个主要部分，即头部（head）和主体（body）。每个类别都有其与要求相关的特定要求。你会在 HTML 结构中看到不同的部分。让我们讨论每一个部分。\n\
  \n## Head 部分 (头部 Section)\n\n`header` 标签代表网页文档头部，你可以用 `<head>` 和 `<link>` 来标记它。它以\
  \ `<head>` 开始，以 `</head>` 结束。它内部包含标题部分。例如 `<title>` 这是你的网页标题。`</li>`。\n\n## Body\
  \ 部分 (主体 Section)\n\n它代表网页文档的主体，通常包含标题、文本和章节。主题以 `<title>` 开始，以 `</title>` 结束。在这些标签中，内容可以标记为“这是第一个主题”。\n\
  \n段落以 `<p>` 开始，以 `</p>` 结束。章节的内容应该写在这些尖括号字符之间。在概述部分显示的下方基础 HTML 代码用于创建一个简单的 HTML\
  \ 页面。\n\n我们可以向 HTML 代码中添加各种元素；让我们来看一看。\n\n*   HTML 标题是使用标签 `<h1>` 到 `<h6>` 定义的元素，其中\
  \ `<h1>` 定义了重要性最的标签，`<h6>` 定义了重要性较小的标签。HTML 段落是一个使用 `<p>` 标签定义的 HTML 元素。\n*   HTML\
  \ 图像是 HTML 的一个功能，由 `<img>` 标签定义，并需要指定属性，如图像 `src`、`alt`（表示替代文本）、`width` 和 `height`。\n\
  *   HTML 列表是元素，使用 `<ul>` 或 `<ol>` 标签定义，其中 `<ul>` 是无序列表，`<ol>` 是有序列表。\n*   HTML 表格是\
  \ HTML 的一部分，可以使用标签 `<table>`、行标签 `<tr>` 和单元格标签 `<td>` 来定义。\n*   HTML 链接是元素，可以使用\
  \ `<a>` 标签和下方的示例代码定义：\n    *   HTML 属性 `style` 可以与任何元素（如 `<p>`）结合使用。\n    *   在\
  \ HTML 中，我们使用 `lang` 属性，可以使用 `<html>` 标签说明文档语言以及使用 `lang` 属性定义的语言。\n    *   在 HTML\
  \ 中，我们可以使用格式化元素格式化文档，并定义具有特殊含义的特殊文本特征。HTML 元素如 `<b>` 加粗，`<i>` 斜体。\n    *   在 HTML\
  \ 中，我们可以使用 `<mark>` 特性突出文档中的特定文本，突出包含 `<mark>` 元素中的文本。\n    *   在 HTML 中，我们可以使用\
  \ HTML 文档中的 `<sup>` 元素将文本定义为上方文本，以便嵌入 `<sup>` 元素中的文本变得更大（注：此处通常指上标）。\n\n# 开始特定的\
  \ HTML\n\nHTML 和 CSS 是两种标签（代码）方法，它们有自己独特的语法。两者之间存在差异。你可以将 HTML 设为页面布局，而 CSS 为 HTML\
  \ 提供了自己的样式。\n\n## 链接你的 HTML 和 CSS 文件\n\n在编写 CSS 之前，我们必须回到 HTML。你需要写新行来将 HTML 文件和\
  \ CSS 文件链接在一起。因此，打开 HTML 文件并添加提供的 `<link href =\"style.css \"rel =\" stylesheet\
  \ \"type =\" text / CSS \"</link>`。你的文件代码看起来如下：\n\n![](img/ufig1_1.jpg)\n\n简单 CSS\
  \ 示例。\n\n上面的代码将新的 CSS 文件链接到你的 HTML 文件。让我们拆分一下：`href` 属性指定了与 CSS 文件关联的链接。我们会讨论链接，现在只需\
  \ `style.css` 文件与 `index.html` 在同一个文件夹中。`rel` 属性告诉浏览器这是一个样式表。`type` 属性告诉浏览器链接的文件应该被视为\
  \ CSS 语法。\n\n\n\n\n\nCSS 仅关注网页布局，而页面内容则使用如 `HTML` 等标记语言来定义。样式与内容分离具有多种优点，其中提高可访问性以及对网页设计更具控制力。\n\
  \nCSS 文档用于定义网页样式，然后链接到包含页面内容和布局的 `HTML` 文档（或使用不同标记语言的文档）。直接将样式设置到 `HTML` 文档中是可能的，但不建议这样做。可以使用任何文本编辑器创建\
  \ CSS 文本，例如 Mac 上的 `Text Editor` 或 Windows 上的 `Notepad`，以及你可以下载的许多其他免费或付费选项。\n\n\
  # CSS 是如何工作的？\n\nCSS 包含了网页浏览器可以在网页内容中使用中规则和值，以便更好地显示其内容。例如，你可以使用它来定义页面的 `body` 部分具有蓝色背景，文本以大小为\
  \ `18px` 的白色 `Helvetica` 字体显示。CSS 规则由特定的文档格式读取（这就是为什么“级联样式表”中出现“级联”一词的缘）。通常情况下，CSS\
  \ 文档中的下一步是胜者——除非第一条规则非常明确。例如，你可能为你冲突的 CSS 文件设置了两个规则——例如将 `body` 字体设为蓝色并将 `section`\
  \ 字体设绿色。在这种情况下，有效的规则将是分类字体，因为它比正文字体清晰得多。\n\n# CSS 语法\n\n现在转向原始 CSS。我们做的第一件事是让段落内容变为不同的颜色。因此将其输入或粘贴到你的样式文件\
  \ `style.css` 中。\n\n这与 `HTML` 文件中的代码不同，因为它是不同的语法。我将添加一个白色区域并如下切入代码：\n\n```css\n\
  p { color: blue; }\n```\n\n上述两个示例对你的浏览器来说完全相同。但开发者经常像最后一个示例那样编写 CSS 以区分样式。\n\nCSS\
  \ 是一种基于规则的语言——通过指定应用于网页上特定对象或对象组样式组来定义规则。例如，你可能决定页面上的主要主题显示为红色标记。代码显示了一个简单的 CSS\
  \ 规则。\n\n*   例如，CSS 规则以选择器开头。\n*   选择将对其设置样式的 `HTML` 元素。在这种情况下，我们为一级标题 `<p>` 设置样式。\n\
  *   然后我们有一组大括号的代码 `{}`。\n*   在工具内部，将有一个或多个声明，它们以属性和键值对的形式出现。在冒号之前指定位置（上述示例中的 `color`），在冒号之后指定属性的值（例如\
  \ `red`）。\n*   此示例包含两个声明，一个颜色和一个字体大小。每对值都指定了我们选择的元素（s）的位置（在本例中为 `<p>`），然后是我们想要赋予该结构的值。\n\
  \nCSS 布局具有不同的有效值，取决于指定的格式。在我们的示例中，我们有一个颜色包，它可以接受不同的颜色值。我们还有一个字体大小结构。该结构可以接受各种大小的单位作为值。\n\
  \nCSS 样式表将包含许多此类规则，按顺序编写。\n\n# CSS 继承\n\n当你将一个元素嵌套在另一个元素内部时，嵌套元素会分配给容器元素的属性。除非你独立更改内部项目的值。例如，在\
  \ `body` 中声明的字体会被文件中的所有文本继承，无论它包含什么项目，除非你为特定的嵌套项目声明了另一种字体。\n\n示例：`body {font-family:\
  \ Verdana, serif;}`\n\n现在 `HTML` 文件中的所有文本都将设置为 `Verdana` 字体族。如果你想用另一种字体格式化某些文本（如\
  \ `h1` 或段落），你可以执行以下操作。\n\n示例：`p {font-family: Tahoma, serif;}, h1 {font-family:\
  \ Georgia, sans-serif;}`\n\n# 注释标签\n\n注释可以解释为什么向 CSS 文件中添加某些选择器。帮助帮助可能看到你文件的其他人，或者在以后记住我们当时的想法。你可以像下面一样添加会被浏览器忽略的注释：\n\
  \n`/* This is a comment */` 以 `/`（斜杠）开头，紧接着是 `*`（星号），然后是注释，紧接着开启标签之后是结束标签 `*`（星号）后跟\
  \ `/`（斜杠）。\n\n合并选择器。\n\n你可以如下所示在单个选择器中组合项目。\n\n示例：`h1, h2, h3, h4, h5, h6 { color:\
  \ #009900; font-family: Georgia, sans Serif; }`\n\n如你从上面的代码所示，我们将所有标题元素分组到单个选择器中。每个元素都用逗号分隔。上述代码的最终结果将所有标题设置为绿色和指定的字体。如果用户没有我们声明的第一个字体，他们将使用另一种无衬线字体。\n\
  \n# 你可以使用的不同类型的 CSS\n\n为网页编写 CSS 有三种方法。你必须决定哪种对你来说更好，但我们推荐使用外部样式表，这是我们今天要学习的第三种。\n\
  \n这里是使用 CSS 的三种方法：\n\n1.  **内联样式：** 放置在 `HTML` 元素内部。\n2.  **内部样式：** 放置在你编写的网页的 `<head>`\
  \ 标签部分。\n3.  **外部样式：** 放置在外部样式表中，它是一个链接到网页的独立页面（推荐）。\n\n下面是 CSS 方法的说明：\n\n*   **外部样式表：**\
  \ 可以使用任何文本或 HTML 编辑器（如“Notepad”或“Dreamweaver”）创建外部 CSS 文件。CSS 文件不包含任何 `HTML` 元素标签，只有\
  \ CSS。现在用 `.css` 文件扩展名保存它。你可以通过在每个想要用 CSS 文件设置样式的 (X)`HTML` 文件的头 部分中保留以下链接之一来外部链接该文件。\n\
  \n或者，`<head><title> Title <title> <style type=\"text/css\"> @import url('Path of\
  \ stylesheet.css') </style></head><body>`\n\n`Styless.css`\n\n```css\nh2, p { font-size:\
  \ 32px; color: lightseagreen; text-shadow: 2px 2px black; }\nh1 { font-size: 42px;\
  \ font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; }\n\
  .container { align-items: center; max-width: 800px; max-height: auto; margin: 280px\
  \ auto; border: 1px solid black; border-radius: 20px; padding: 50px; }\n```\n\n\
  ![](img/ufig1_2.jpg)\n\n外部样式表。\n\n*   **内部样式表：** 这种方法只是简单将 CSS 代码放置在想要用 CSS 设置样式的每个\
  \ `HTML` 文件的 `<head>` 和 `</head>` 标签内。格式如下例所示：\n\n    使用上述方法，每个 `HTML` 文件都包含设置页面所需的\
  \ CSS 样式代码。这意味着你想对页面进行的任何更改都必须对所有文件进行。如果你只需要为单个页面设置样式，或者你想让其他页面具有不同的样式，这种方法会是很好的。\n\
  \n    ![](img/ufig1_3.jpg)\n\n    内部样式表。\n\n*   **内联样式：** 这违背了使用 CSS 的目的。内联样式定义在\
  \ `HTML` 文件中，就在你想设置样式的元素旁边。它可能会出现在队列中，位于 CSS 文字旁边。\n\n    ![](img/ufig1_4.jpg)\n\
  \n    内联样式表。\n\n外部样式表包含 CSS 指令，这些是特殊文件，并具有 `.css` 文件扩展名。如果在任何网页上安装了外部样式表，CSS 文件将控制其声音和外观。\n\
  \n    使用外部样式表，你所有的 `HTML` 文件都链接到单个 CSS 文件以格式化页面。这意味着如果你需要更改所有页的设计，只需要编辑一个 `.css`\
  \ 文件即可对你的整个网站进行常规更改。以下是这样做更好的几个原因：\n\n    *   更易维护\n    *   减小文件大小\n    *   减少带宽\n\
  \    *   提高灵活性\n\n# CSS 类\n\n\n\n\n类选择器（class selector）允许你对同一个 HTML 元素应用不同的样式。这与我在引言中提到的内联样式类似。不同于类的是，样式可以通过更改样式表来覆盖。你可以在一个\
  \ HTML 文件中多次使用同一个类选择器。\n\n简单来说，你正在阅读的这句话在我的 CSS 文件中是通过以下方式定义的。\n\n示例：\n```css\n\
  p { font-size: small; color: #333333 }\n```\n\n这看起来非常简单，但假设我们想将“sentence”一词改为绿色加粗文本，并保持句子的其余部分不变。你将对我的\
  \ HTML 文件进行如下操作：\n\n```html\n<p> In simple terms, this <span class=\"text\"> You\
  \ can write your sentence here </span> in my CSS file you are reading, it is formatted\
  \ as follows. </p>\n```\n\n然后在我的 CSS 文件中添加以下样式选择器：\n\n```css\n.text { font-size:\
  \ small; color: #008080; font-weight: bold; }\n```\n\n## CSS IDs\n\nID 与类相似。假设一旦声明了特定的\
  \ id，它在同一个 HTML 文件中就不能再次使用。我们通常使用 ID 来设置页面中只需要一次的布局元素，而使用类来设置可能被声明多次的文本等。页面的容器由以下示例定义：\n\
  \n```html\n<div id=\"container\">\n```\n\n我的文档中的所有内容都在这个 `</div>` 标签内。你为 `container`\
  \ 区域选择了 id 选择器而不是类，是因为你只需要在该文件中使用它一次。那么，在我的 CSS 文件中，你将看到如下示例：\n\n```css\n#container\
  \ { width: 60%; margin: auto; padding: 10px; border: 2px solid #666; background:\
  \ #ffffff; }\n```\n\n你会注意到 id 选择器应该以 `#` 号开头，而不是像类选择器那样以 `.` 点号开头。\n\n## ID 和 CLASS\
  \ 有什么区别？\n\n我们使用 ID 和类来定位特定的 HTML 元素，通过 CSS 使它们与其他相似元素产生不同的渲染效果，但它们的区别是什么呢？\n\n\
  ID 是“唯一”类型：\n\n- 每个项目只能设置一个 ID。\n- ID 应该只在页面内使用。\n\n当你页面上只有一个想要渲染的元素时，应该使用 id。你的代码无法通过验证测试，这对于\
  \ Web 开发人员是非常重要的。\n\n示例：\n```html\n<div id=\"main-header\"> text </div>\n```\n\n\
  ## CSS DIVISION\n\n之前，你已经学习了 CSS 的基础知识、语法如何工作，并在这里学习了一点关于类和 id 的知识。现在我们将暂时离开 CSS，专注于使用它时的\
  \ HTML 方面。`section`（区块）是块级 HTML 元素，用于描述 HTML 文件的各个章节。一个 section 可以包含组成你网站的所有部分，包括额外的\
  \ section、span、图像、文本等。你通过在 HTML 文件的 `<body> </body>` 之间放置以下内容来定义一个 section。\n\n\
  示例：\n```html\n<body> <div> Site content go here </div> </body>\n```\n\n你很可能想为它添加一些样式。你可以在下面的示例中实现：\n\
  \n```html\n<div id=\"container\"> Site content go here </div>\n```\n\nCSS 文件包含：\n\
  \n```css\n#container { width: 70%; margin: auto; padding: 20px; border: 1px solid\
  \ #666; background: #ffffff; }\n```\n\n现在，此章节中的所有内容将根据我在 CSS 文件中定义的 `container`\
  \ 样式规则进行格式化。默认情况下，分割会换行。你可以在网站中使用类和 section。\n\n## 如何使用 CSS 属性\n\nCSS 布局用于对结构化文档应用样式，例如在\
  \ HTML 或 XML 中创建的。CSS 布局在 CSS 层指定。每个属性都有一组可能的值。某些属性可以影响元素的类型，而另一些仅适用于特定的元素组。样式表由规则列表组成。每个规则或规则集包含一个或多个选择器，以及一个声明块。\n\
  \nCSS 特性在声明中使用相应的值使用。\n\n让我们简要讨论各种 CSS 属性。我们为每个属性都有单独的章节。\n\n## CSS 颜色\n\n颜色使用预定义的颜色名称、RGB、HEX、HSL、RGBA、HSLA\
  \ 值来指定。\n\n### 名称\n\n在 CSS 中，可以使用预定义的颜色名称指定颜色，例如：\n\n1. Tomato（西红柿红）\n2. Orange（橙色）\n\
  3. Dodger Blue（奇者蓝）\n4. Medium Sea Green（中海绿）\n5. Gray（灰色）\n6. SlateBlue（石板蓝）\n\
  7. Violet（紫色）\n8. LightGray（浅灰色）\n\n### 颜色值列表\n\n这里是适用于 CSS 的颜色值列表。\n\n- 命名颜色（Named\
  \ Colors）\n- `transparent` 关键字\n- `currentColor` 当前颜色关键字\n- 3 位十六进制代码\n- 4 位十六进制代码\n\
  - 6 位十六进制代码\n- CSS 8 位十六进制代码\n- `RGB()` 函数\n- `rgba()` 函数\n- `HSL()` 函数\n- `hsla()`\
  \ 函数\n- `hwb()` 函数\n- 系统颜色\n\n以下是所有浏览器支持的颜色名称完整列表：\n\n1. Alice blue（爱丽丝蓝）\n2. antique\
  \ white（古董白）\n3. Aqua（青色）\n4. Aquamarine（海蓝绿色）\n5. Azure（天蓝）\n6. Beige（米色）\n7. Bisque（奶油色）\n\
  8. Black（黑色）\n9. dark orchid（深兰紫色）\n10. DarkRed（深红色）\n11. DarkSalmon（深鲑鱼色）\n12.\
  \ dark turquoise（深青色）\n13. DarkViolet（深紫色）\n14. DeepPink（深粉色）\n15. DeepSkyBlue（深天蓝）\n\
  16. Fuchsia（洋红色）\n17. Gainsboro（浅灰色）\n18. GhostWhite（幽灵白）\n19. Gold（金色）\n20. HotPink（热粉色）\n\
  21. Indian（印度红）\n22. Indigo（靛蓝）\n23. Ivory（象牙白）\n\n### RGB 颜色\n\n不同的颜色为各种设计增加了不同的氛围。正确的颜色选择可以让设计和作品看起来整洁、美且现代。但糟糕的颜色会让用户难以交互，因为它们对其他人来说没有吸引力。\n\
  \n页面边框（`border`）、背景（`background`）或前景（`color`）的颜色具有巨大影响，因此你必须花精力让它们正确。\n\nCSS 允许你使用各种不同的颜色和颜色系统。从命名颜色到十六进制颜色、`RGB()`\
  \ 颜色、`hsl` 颜色等。\n\n### 在 HTML 中使用 RGB 颜色\n\n为 HTML 元素应用颜色最简单的方法是在 `.html` 文件中编写\
  \ HTML。然后，在该文件中，只需将你的 `.css` 样式表与指定的所有颜色和样式关联起来。\n\n这使得代码更易读，并消除了任何关于最佳实践的顾虑。我们可以有一个带有如下\
