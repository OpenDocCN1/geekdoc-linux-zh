    ## CSS TRANSFORM PROPERTIES


    The `transform` property is used to transform an element in two-dimensional (2D)
    or thre-dimensional (3D) spaces. For example, rotate elements, scale them, skew
    them, and more.


    ### 2D Transform Functions


    The `transform` property accepts a list of “transform functions” as values. These
    functions have names such as `scale()`, `rotate()`, `skew()`, etc, which take
    parameters to determine the level of transformation (e.g., the angle to rotate
    an element).


    The syntax of `transform` is given below: `transform: none | <transform-function>
    [ <transform-function> ]`


    These are grouped by 2D (two-dimensional) and 3D (three-dimensional) functions.


    `matrix()`: It specifies a 2D transformation in the form of a matrix of the six
    values a-f.


    The syntax of `matrix` is given below: `matrix() = matrix( <number> [,<number>
    ]{5,5} )`


    `translate()`: It moves the position of the element. It specifies a 2D translation
    by the vector `[x, y]`, where `tx` is the first translation-value parameter and
    `y` is the optional second translation-value parameter.


    The syntax of `translate` is given below: `translate( <translation-value>[, <translation-value>]?
    )`


    `translateX()`: It moves the element horizontally. It specifies a translation
    by the given amount in the X direction.


    The syntax of `translateX` is given below: `translateX( <translation-value> )`


    `translateY()`: It moves the element vertically. It specifies a translation by
    the amount in the Y direction.


    The syntax of `translateY` is given below: `translateY( <translation-value> )`


    `scale()`: It modifies the size of the element. It specifies a 2D scale operation
    by the `[sx,sy]` vector described by two parameters.


    The syntax of `scale` is given below: `scale( <number>[, <number>]? )`


    `scaleX()`: It specifies a 2D scale operation using the `[sx,1]` vector, where
    `sx` is given as the parameter.


    The syntax of `scaleX` is given below: `scaleX( <number>[, <number>]? )`


    `scaleY()`: It specifies a 2D scale operation using the `[1,sy]` vector, where
    `sy` is given as the parameter.


    The syntax of `scaleY` is given below: `scaleY( <number>[, <number>]? )`


    `rotate()`: It specifies a 2D rotation by the angle specified parameter about
    the origin, as defined by the `transform-origin` property.


    The syntax of `rotate` is given below: `rotate( <angle> )`


    `skew()`: It specifies a 2D skew transformation along the X and Y axis by the
    given angles. If the second parameter is not provided, it has a zero value.


    The syntax of `skew` is given below: `skew( <angle> [, <angle> ]? )`


    `skewX()`: It specifies a 2D transformation along the X-axis by the given angle.


    The syntax of `skewX` is given below: `skewX( <angle> )`


    `skewY()`: It specifies a 2D transformation along the Y axis by the given angle.


    The syntax of `skewY` is given below: `skewY( <angle> )`


    The output of the code is given below:


    ![](images/ufig2_50.jpg)


    2D transform functions.


    ### 3D Transform Functions


    It allows to apply transformations along three axes: x, y, and z axes, as demonstrated
    by a three-dimensional Cartesian coordinate system. The 3D transform functions
    available in CSS are given below.


    `matrix3d()`: It specifies a 3D transformation as a 4x4 same matrix of 16 values
    in column-major order.


    The syntax of `matrix3d` is given below: `matrix3d() = matrix3d( <number> [, <number>
    ]{15,15} )`


    `translate3d()`: It specifies a 3D translation by the vector `[tx,ty,tz]`, `tx`,
    `ty`, and `tz` will be the first, second, and third translation value parameters,
    respectively.


    The syntax of `translate3d` is given below: `translate3d() = translate3d( <translation-value>,
    <translation-value>, <length> )`


    `translateZ()`: It specifies a 3D translation by the vector `[0,0,tz]` with the
    given amount in the Z direction.


    The syntax of `translate3d` is given below: `translateZ() = translateZ( <length>
    )`


    `scale3d()`: It specifies a 3D scale operation by the `[sx,sy,sz]` vector described
    by the three parameters.


    `scaleZ()`: It specifies a 3D scale operation using the `[1,1,sz]` vector, where
    `sz` is given as the parameter.


    The syntax of `translate3d` is given below: `scaleZ() = scaleZ( <number> )`


    `rotate3d()`: It specifies a 3D rotation by the angle specified in the last parameter
    about the `[x,y,z]` vector described by the first three parameters.


    The syntax of `translate3d` is given below: `rotate3d() = rotate3d( <number>,
    <number>, <number>, <number> )`


    `rotateX()`: This is the same as `rotate3d(1, 0, 0, <angle>)`.


    The syntax of `rotateX` is given below: `rotateX() = rotateX( <angle> )`


    `rotateY()`: This is the same as `rotate3d(0, 1, 0, <angle>)`.


    The syntax of `rotateY` is given below: `rotateY() = rotateY( <angle> )`


    `rotateZ()`: The same as `rotate3d(0, 0, 1, <angle>)` (which is also the same
    as `rotate( <angle> )`.


    The syntax of `rotateZ` is given below: `rotateZ() = rotateZ( <angle> )`


    `perspective()`: It defines the distance between the `z=0` plane and the user
    in order to give to the 3D-positioned element some perspective.


    The syntax of `perspective` is given below: `perspective() = perspective( <length>
    )`


    The output of the code is given below:


    ![](images/ufig2_51.jpg)


    3D transform functions.


    ## CSS TRANSITIONS PROPERTIES


    CSS `transition` property is a property for defining CSS transitions that combines
    the four transition properties into one single property. The `transition` property
    combines the following properties such as `transition-property`, `transition-duration`,
    `transition-timing-function`, and `transition-delay`.


    The output of the code is given below:


    ![](images/ufig2_52.jpg)


    CSS transition properties.


