    It is a framework to develop CSS tools. It can also be used to develop a template
    language such as `Sass` and `LESS`.


    PostCSS has core components which are given as below:


    * `CSS parser` generates an abstract syntax tree.

    * It is a set of classes that comprise the tree.

    * `CSS generator` generates a line for the object tree.

    * `Code map generator` for the changes made.


    ### Features


    Plugins are small programs working with a tree of objects. After the core transforms
    the CSS string into a tree of objects, the plugins parse and modify the tree.
    Then PostCSS will generate a new CSS string for the tree changed by the plugin.
    PostCSS & its plugins are written in JavaScript and installed through `npm`, which
    offers an API for various low-level JavaScript operations.


    There are official tools that allow you to use PostCSS with build systems such
    as `Webpack`, `Gulp`, and `Grunt`. A console interface is also available. `Browserify`
    or `Webpack` can use to open PostCSS in a browser. PostCSS plugins perform a variety
    of CSS processing tasks, from parsing and sorting properties to minification.


    A full list of plugins can be found at `postcss.parts` with some examples listed
    below:


    * `Autoprefixer` for adding and deleting browser prefixes. `CSS modules` for isolating
    CSS selectors and organizing code. It comes as part of `Webpack`.

    * `stylelint` for analyzing CSS code errors and checking style consistency.

    * `stylefmt` fixes CSS code according to `stylelint` settings.

    * `PreCSS` to perform some Sass/Less preprocessing functionality.

    * `postcss-preset-env` to emulate features from draft CSS specifications.

    * `cssnano` to reduce CSS size by removing whitespace and rewriting code.

    * `RTLCSS` to change the CSS code so that the design is suitable for right-to-left
    typing.

    * `postcss-assets`, `postcss-inline-svg`, and `postcss-sprites` for working with
    graphics.


    We discuss some of the plugins in brief.


    ## POSTCSS-MODULES ( CSS MODULES )


    A CSS Module is a CSS file in which all class and animation names are scoped locally
    by default. All URLs (`url(...)`) and `@imports` are in module request format
    (`./xxx` and `. ./xxx` means relative, `xxx` and `xxx/yyy` means in modules folder,
    i. e. in `node_modules`).


    CSS Modules compile to a low-level interchange format called `ICSS` or Interoperable
    CSS but are written like normal CSS files:


    When importing the CSS Module from a JS Module, it exports an object with all
    mappings from local names to global names.


    ### Naming (localsConvention)


    For local class names `camelCase` naming is recommended:


    Type: `String | (originalClassName: string, generatedClassName: string, inputFile:
    string) => className: string` Default: `null`


    Style of exported classnames, the keys in your `json`.


    1. `camelCase` - `{String}`: The class names should be camelized.

    2. `camelCaseOnly` - `{String}`: The class names will be camelized, and the class
    name will be removed from the locals.

    3. `dashes` - `{String}`: It is only dashes in class names that will be camelized.

    4. `dashesOnly` - `{String}`: It is dashes in class names that will be camelized.


    ### Features


    * Modular and reusable CSS.

    * No more conflicts.

    * Explicit dependencies.

    * No global scope.


    ## CSS MarqueeMenu PLUGIN


    It is a type of animation effect used in developing web pages for getting attractive
    text or image scrolling in vertical or horizontal directions.


    Note: You can download the CSS MarqueeMenu plugin in the working folder and include
    the required files in the head section of the HTML code.


    ```css

    Style.css *, *::after, *::before { box-sizing: border-box; } :root { font-size:
    15px; } body { margin: 0; --color-text: #111; --color-bg: #f8ecde; --color-link:
    #b19e7f; --color-link-hover: #000; color: var(--color-text); background-color:
    var(--color-bg); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing:
    grayscale; font-family: stratos, sans-serif; } a { text-decoration: none; color:
    var(--color-link); outline: none; } a:hover, a:focus { color: var(--color-link-hover);
    outline: none; } .menu { -webkit-touch-callout: none; -webkit-user-select: none;
    -moz-user-select: none; -ms-user-select: none; user-select: none; padding: 10vh
    0 25vh; --marquee-width: 100vw; --offset: 20vw; --move-initial: calc(-25% + var(--offset));
    --move-final: calc(-50% + var(--offset)); --item-font-size: 10vw; counter-reset:
    menu; } .menu__item { cursor: default; position: relative; padding: 0 5vw; } .menu__item-link
    { display: inline-block; cursor: pointer; position: relative; -webkit-text-stroke:
    1.5px #000; -webkit-text-fill-color: transparent; color: transparent; transition:
    opacity 0.4s; } .menu__item-link::before { all: initial; font-family: sofia-pro,
    sans-serif; counter-increment: menu; content: counter(menu); position: absolute;
    bottom: 60%; left: 0; pointer-events: none; } .menu__item-link:hover { transition-duration:
    0.1s; opacity: 0; } .menu__item-link:hover +. menu__item-img { opacity: 1; transform:
    translate3d(calc(-100% - 6vw),-30%,0) rotate3d(0,0,1,4deg); transition: all 0.4s;
    } .marquee { position: absolute; top: 0; left: 0; width: var(--marquee-width);
    overflow: hidden; pointer-events: none; mix-blend-mode: color-burn; } .marquee__inner
    { display: flex; position: relative; transform: translate3d(var(--move-initial),
    0); animation: marquee 5s infinite; animation-play-state: paused; } .marquee__inner:hover
    { animation-play-state: running; }

    @keyframes marquee { 0% { transform: translate3d(var(--move-initial), 0); } 100%
    { transform: translate3d(var(--move-final), 0); } }

    ```

