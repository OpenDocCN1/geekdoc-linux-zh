- fmt: "\nPostCSS will take your existing CSS file and convert it to JavaScript readable\
    \ data, then the JavaScript plugins will make the modifications and PostCSS will\
    \ return the modified version of the original file.\n\n## VARIOUS CSS PLUGINS\
    \ PostCSS BASED\n\nThere are various plugins available in the market as given\
    \ below:\n\n1. Autoprefixer\n2. CSSnext\n3. CSSNano\n4. PreCSS\n5. StyleLint\n\
    6. PostCSS Assets\n7. Font Magician\n8. Lost Grid\n9. PostCSS\n10. PostCSS-modules\n\
    \n## AUTOPREFIXER\n\nAutoprefixer uses the data based on the latest browser popularity\
    \ that supports to apply prefixes for you. You can try the interactive demo of\
    \ Autoprefixer.\n\nYou can write any CSS rules without vendor prefixes as given\
    \ below:\n\n```css\n.container {    box-shadow: 0 0 10px #cecece;    transition:\
    \ all .5s;  }\np{ color: red; } \n.section a{ display: flex; }\n```\n\n### Write\
    \ Pure CSS\n\nWorking with `Autoprefixer` is simple, you need to forget about\
    \ vendor prefixes and write normal CSS according to the latest W3C specs. You\
    \ do not need a special language (like Sass, Less) or remember where you must\
    \ use mixins.\n\n`Autoprefixer` supports selectors (such as `:fullscreen` & `::selection`),\
    \ unit function (`calc()`), at‑rules (`@support` & `@keyframes`) and with properties.\n\
    \nIt is a postprocessor, you can use it with preprocessors like Sass, Stylus,\
    \ or LESS.\n\nJust write normal CSS according to the latest W3C specs and `Autoprefixer`\
    \ will produce the code for old browsers. `Autoprefixer` changes CSS indentation\
    \ to create a nice visual cascade of prefixes if the CSS is uncompressed.\n\n\
    The output with `Autoprefixer` will be like this (you can check the Autoprefixers\
    \ code online using, [https://tools.webdevpuneet.com/css-autoprefixer/](https://tools.webdevpuneet.com/css-autoprefixer)):\n\
    \n```css\n/* * Prefixed by: * PostCSS: v7.0.29, * Autoprefixer: v9.7.6 * Browsers:\
    \ last 4 version */   .container {    -webkit-box-shadow: 0 0 10px #cecece;  \
    \              box-shadow: 0 0 10px #cecece;    -webkit-transition: all .5s; \
    \   -o-transition: all .5s;    transition: all .5s;  } \np{ color: red; } \n.section\
    \ a{ display: -webkit-box; display: -ms-flexbox; display: flex; }\n```\n\nThe\
    \ thing is that some CSS properties will display differently in different browsers,\
    \ and you want every site visitor to have a predictable and accurate experience.\
    \ For older, more established properties, such as a border or border, there is\
    \ nothing to worry about; they have been standardized and work across browsers.\
    \ But newer features like grid or flexbox are not so simple.\n\nThe vendors that\
    \ make your browsers, like Google and Mozilla, don’t want to wait for cool new\
    \ things to be standardized before implementing them. Instead, they create their\
    \ own version and add a prefix that differentiates it from other browsers’ implementations.\
    \ The new property will be standardized and work the same across all browsers,\
    \ eliminating the need for prefixes. Until then, you must use vendor prefixes\
    \ in your code.\n\n“Autoprefixer” is a plugin that can save us from the monotony\
    \ of -webkit- and -moz-. It does exactly sounds like: it automatically adds prefixes\
    \ to your CSS. All you have to do is supply it using a CSS sheet that will read\
    \ it and add vendor prefixes if necessary.\n\n### Installing Autoprefixer in Your\
    \ Project Folder\n\nOpen a terminal in VS code and use `npm` to install it, well\
    \ as `postcss` and its companion `postcss-cli`, the command-line tool you’ll use\
    \ to run `Autoprefixer`. The process is the same as installing Sass, only you\
    \ install three packages at once. You can install so many at once you’d like,\
    \ each separated by a space as\n\nOnce `npm` has downloaded and installed the\
    \ packages, need to go back into `package.json` and add a script for `npm` to\
    \ run, just like when you installed Sass. Add a new script named “prefix” after\
    \ the “sass”s script:\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\"\
    ,\n  \"description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n\
    \    \"sass\": \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\"\
    ,\n    \"prefix\": \"\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n\
    }\n```\n\nAnd inside the script need to tell `npm` to use the new `postcss` package\
    \ you just installed and also where to find your compiled CSS file:\n\n```json\n\
    {\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"abc\"\
    ,\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
    \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css\"\
    \n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\nAfter that you\
    \ need to instruct `npm` which package to use and where to find the CSS file,\
    \ to use `Autoprefixer` by implementing `–use` flag followed by `Autoprefixer`\
    \ as given below:\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\"\
    ,\n  \"description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n\
    \    \"sass\": \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\"\
    ,\n    \"prefix\": \"postcss ./public/css/style.css --use autoprefixer\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\nAnd then, finally, you\
    \ need to instruct it where to put new, prefixed, CSS sheet as given below:\n\n\
    ```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass\
    \ ./sass/main.scss:./public/css/style.css -w --style compressed\",\n    \"prefix\"\
    : \"postcss ./public/css/style.css --use autoprefixer -d ./public/css/prefixed/\"\
    \n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\nNow your prefixing\
    \ script is complete.\n\nAdd a new key named `browserslist` as given below:\n\n\
    ```json\n{\n  \"browserslist\": \"\"\n}\n```\n\nAnd then give `browserslist` a\
    \ value of last four versions :\n\n```json\n{\n  \"name\": \"joeblow\",\n  \"\
    version\": \"1.0.0\",\n  \"description\": \"Joe Blow’s web portfolio\",\n  \"\
    main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
    \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css --use\
    \ autoprefixer -d ./public/css/prefixed/\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\",\n  \"browserslist\": \"last 4 versions\"\n}\n```\n\nNow you are ready\
    \ to autoprefix CSS! Let’s move into the terminal and run the `prefix` script:\n\
    \n```bash\n$ npm run prefix\n```\n\nTake a look at the new, prefixed, CSS in your\
    \ CSS file, a new block will be added:\n\n```css\n.section {\n  background: #15DEA5;\n\
    \  height: 10rem;\n  display: -webkit-box;\n  display: -ms-flexbox;\n  display:\
    \ flex;\n  -webkit-box-align: center;\n  -ms-flex-align: center;\n  align-items:\
    \ center;\n  -ms-flex-wrap: wrap;\n  flex-wrap: wrap;\n  width: 100%;\n}\n```\n\
    \nNow our website will display properly and uniformly across all compatible.\n\
    \n### When Does It Run?\n\n`Autoprefixer` is the very last thing that runs when\
    \ processing your CSS. So if you use Sass, LESS, or Stylus, that will process\
    \ first, then `Autoprefixer`. You are still free to use a preprocessor add-on\
    \ (e.g., Compass, LESSHat, etc.) in which to use for prefixing if you’d like,\
    \ but I’d argue that `Autoprefixer` is easier, does a better job, and you don’t\
    \ need both.\n\n### What is the Difference Between Autoprefixer and -Prefix-Free?\n\
    \n-Prefix-free is a client-side JavaScript library. It is included on your page\
    \ as an additional request. It runs, finds all the CSS it can find, figures out\
    \ what prefixes may be needed, and injects that new CSS onto the page after the\
    \ CSS it finds.\n\n*   **Downsides**: extra request, flash-of-un-prefixed-styles,\
