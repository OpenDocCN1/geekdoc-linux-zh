    For more info, please visit [https://zeba.academy](https://zeba.academy)


    # CHAPTER 1: CSS Introduction


    DOI: [10.1201/9781003358060-1](https://doi.org/10.1201/9781003358060-1)


    In this chapter, we will learn about `CSS` (Cascading Style Sheets), its fundamental
    concepts, versions, syntax, and how we can link our HTML page with CSS files.
    The other concepts like modules, selectors, ids, borders, attributes, tables,
    form, colors, etc. will also be covered in this whole lesson. So let’s get started
    with the basics of `CSS`.

