  trans: "\n\nCSS 工作组有时会开发新的 CSS 特性，有时是因为特定的浏览器对特定功能感兴趣，有时是因为 Web 设计师和开发者请求某项功能，或者是工作组确定了某项需求。CSS\
    \ 在不断演进，新功能不断出现。然而，CSS 最重要的一点是，大家都会努力确保不会以破坏旧版网站的方式更改内容。一个在 2000 年构建并使用当时有限 CSS\
    \ 构建的网站，在今天的浏览器中应该仍然可以运行！\n\n作为 CSS 的初学者，你可能会觉得 CSS 规范过于巨大——它的目的是让开发者将功能支持应用于用户代理，而不是让\
    \ Web 开发者学习理解 CSS。许多经验丰富的开发者更倾向于查看 MDN 文档或其他课程。然而，值得知道这些功能的存在，并理解你正在使用的 CSS、浏览器支持（见下文）以及细节之间的关系。\n\
    \n# CSS 模块\n\n由于有很多可以使用 CSS 样化的内容，该语言被分成了多个模块。当你探索 MDN 时，你会看到对这些模块的引用。许多文本页面是围绕特定模块组织的。例如，你可以参考“背景与边界”（Background\
    \ and Boundaries）模块中的 MDN 参考，来了解它包含的属性和特性的目的。\n\n在本节中，你不需要过多担心 CSS 是如何创建的；但是，如果你知道某个地方可以在其他内容中找到，那么获取信息可能会更容易，因此，它几乎处于相同的情况。\n\
    \n例如，让我们回到“背景与边界”模块——你可能认为背景颜色和边框颜色结构定义在这个模块中是合理的。你是对的。如果你对 HTML 有所了解，那就很好；如果没有，让我们简要介绍一下\
    \ HTML 以及如何将 CSS 文件链接到 HTML 中以更改样式。\n\n# 基础 HTML\n\n接下来的部分提供了 HTML 的介绍。没有 HTML，我们无法想象网页和万维网。它是编写网页最常用的语言。它代表“超文本标记语言”。你应该知道，在网页上找到的任何链接通常被称为“超文本”（Hypertext），而“标记”（mark）指的是标签或页面布局，以便列表中的文本能以正确的格式显示。开发\
    \ HTML 的目的是理解任何文本的结构：标题、正文、内容或分类。\n\n所以，基本上 HTML 提供了一种显示网页内容的结构化格式。它非常简单易懂。在 20\
    \ 世纪 90 年代，它由 Tim Berners-Lee 开发，随后经历了许多变化和修改。HTML `5` 是 HTML 的最新版本。\n\n你知道 HTML\
    \ 是一种简单的语言，可以使用许多标签来格式化内容。所有标签都包含在尖括号 `<tagname>` 中。除了少数标签外，大多数标签都以尖括号开始并以相应的尖括号结束。\n\
    \n`<! DocType Html>` 定义了 HTML 的文档类型和版本。`Html` 代码紧接 `<html>` 尖标记开始，并以 `</html>`\
    \ 结束（上面的屏幕图中未显示）。\n\n它通常有两个主要部分，即头部（head）和主体（body）。每个类别都有其与要求相关的特定要求。你会在 HTML\
    \ 结构中看到不同的部分。让我们讨论每一个部分。\n\n## Head 部分 (头部 Section)\n\n`header` 标签代表网页文档头部，你可以用\
    \ `<head>` 和 `<link>` 来标记它。它以 `<head>` 开始，以 `</head>` 结束。它内部包含标题部分。例如 `<title>`\
    \ 这是你的网页标题。`</li>`。\n\n## Body 部分 (主体 Section)\n\n它代表网页文档的主体，通常包含标题、文本和章节。主题以\
    \ `<title>` 开始，以 `</title>` 结束。在这些标签中，内容可以标记为“这是第一个主题”。\n\n段落以 `<p>` 开始，以 `</p>`\
    \ 结束。章节的内容应该写在这些尖括号字符之间。在概述部分显示的下方基础 HTML 代码用于创建一个简单的 HTML 页面。\n\n我们可以向 HTML 代码中添加各种元素；让我们来看一看。\n\
    \n*   HTML 标题是使用标签 `<h1>` 到 `<h6>` 定义的元素，其中 `<h1>` 定义了重要性最的标签，`<h6>` 定义了重要性较小的标签。HTML\
    \ 段落是一个使用 `<p>` 标签定义的 HTML 元素。\n*   HTML 图像是 HTML 的一个功能，由 `<img>` 标签定义，并需要指定属性，如图像\
    \ `src`、`alt`（表示替代文本）、`width` 和 `height`。\n*   HTML 列表是元素，使用 `<ul>` 或 `<ol>` 标签定义，其中\
    \ `<ul>` 是无序列表，`<ol>` 是有序列表。\n*   HTML 表格是 HTML 的一部分，可以使用标签 `<table>`、行标签 `<tr>`\
    \ 和单元格标签 `<td>` 来定义。\n*   HTML 链接是元素，可以使用 `<a>` 标签和下方的示例代码定义：\n    *   HTML 属性\
    \ `style` 可以与任何元素（如 `<p>`）结合使用。\n    *   在 HTML 中，我们使用 `lang` 属性，可以使用 `<html>`\
    \ 标签说明文档语言以及使用 `lang` 属性定义的语言。\n    *   在 HTML 中，我们可以使用格式化元素格式化文档，并定义具有特殊含义的特殊文本特征。HTML\
    \ 元素如 `<b>` 加粗，`<i>` 斜体。\n    *   在 HTML 中，我们可以使用 `<mark>` 特性突出文档中的特定文本，突出包含 `<mark>`\
    \ 元素中的文本。\n    *   在 HTML 中，我们可以使用 HTML 文档中的 `<sup>` 元素将文本定义为上方文本，以便嵌入 `<sup>`\
    \ 元素中的文本变得更大（注：此处通常指上标）。\n\n# 开始特定的 HTML\n\nHTML 和 CSS 是两种标签（代码）方法，它们有自己独特的语法。两者之间存在差异。你可以将\
    \ HTML 设为页面布局，而 CSS 为 HTML 提供了自己的样式。\n\n## 链接你的 HTML 和 CSS 文件\n\n在编写 CSS 之前，我们必须回到\
    \ HTML。你需要写新行来将 HTML 文件和 CSS 文件链接在一起。因此，打开 HTML 文件并添加提供的 `<link href =\"style.css\
    \ \"rel =\" stylesheet \"type =\" text / CSS \"</link>`。你的文件代码看起来如下：\n\n![](img/ufig1_1.jpg)\n\
    \n简单 CSS 示例。\n\n上面的代码将新的 CSS 文件链接到你的 HTML 文件。让我们拆分一下：`href` 属性指定了与 CSS 文件关联的链接。我们会讨论链接，现在只需\
    \ `style.css` 文件与 `index.html` 在同一个文件夹中。`rel` 属性告诉浏览器这是一个样式表。`type` 属性告诉浏览器链接的文件应该被视为\
    \ CSS 语法。\n\n"
- fmt: "\nCSS is only concerned with web page layout, while page content is defined\
    \ using marker language such as `HTML`. The separation of style and content has\
    \ various advantages, among them improved accessibility, and more control over\
    \ web design.\n\nCSS documents are used to define a web page style, then linked\
    \ to an `HTML` document (or document in a different tag language) that contains\
    \ the content and layout of the page. Setting the style directly to the `HTML`\
    \ document is possible but not recommended. CSS texts can be created in any text\
    \ editor, such as `Text Editor` on Mac or `Notepad` for Windows, as well as many\
    \ other free also paid options that you can download.\n\n# HOW DOES CSS WORK?\n\
    \nCSS contains the rules and values that a web browser can use in the content\
    \ of a web page to better display its content. For example, you can use to define\
    \ that the `body` part of a page has a blue background, that the text is displayed\
    \ in a white `Helvetica` font with a size of `18px`. CSS rules are read by a specific\
    \ document format (hence the word “cascading” in Cascading Style Spreadsheets).\
    \ In general, the next step in a CSS document is the winner – unless the first\
    \ rule is very clear. For example, you might have two rules for your conflicting\
    \ CSS file – such as setting `body` font in blue and `section` font in green.\
    \ In this case, the effective rule will be the category font, because it is much\
    \ clearer than the body font.\n\n# CSS SYNTAX\n\nNow move on to the original CSS.\
    \ The first thing we do is make the paragraph content a different color. So the\
    \ type or paste into your style file `style.css`.\n\nThis looks different from\
    \ the code in the `HTML` file because it is a different syntax. I will add a white\
    \ area and cut into that code as follows:\n\n```css\np { color: blue; }\n```\n\
    \nBoth of the above examples are exactly the same about your browser. But developers\
    \ often write CSS as the latest example to differentiate styles.\n\nCSS is a rule-based\
    \ language – defines rules by specifying groups of styles to be applied to specific\
    \ objects or groups of objects on your web page. For example, you may decide that\
    \ a major topic on your page is shown as a red flag. The following code shows\
    \ a simple CSS rule.\n\n*   For example, the CSS rule opens with a selector.\n\
    *   Selects the `HTML` element that will style it. In this case, we style the\
    \ first-level titles `<p>`.\n*   Then we have a set of twisted pieces `{}`.\n\
    *   Inside the instruments, there will be one or more announcements, which take\
    \ the form of the goods and pairs of values. It specifies the location (`color`\
    \ in the example above) before the colon and the value of the property after the\
    \ colon (`red` for example).\n*   This example contains two declarations, one\
    \ color and one font size. Each pair specifies the location of the element (s)\
    \ we select `<p>` in this case), and then the value we would like to give the\
    \ structure.\n\nCSS layouts have different valid values, depending on the specified\
    \ format. In our example, we have a color package, which can take on different\
    \ color values. We also have a font size structure. This structure can take units\
    \ of various sizes as a value.\n\nThe CSS style sheet will contain many such rules,\
    \ written in sequence.\n\n# INHERITANCE CSS\n\nWhen you nest an element inside\
    \ another, the nested element inherits the properties assigned to the containing\
    \ element. Unless you change the values of the inner items independently. For\
    \ instance, a font declared in the `body` is inherited by all text in the file,\
    \ regardless of the item it contains, unless you declare another font for a particular\
    \ nested item.\n\nSample: `body {font-family: Verdana, serif;}`\n\nAll text in\
    \ the `HTML` file will now be set to the `Verdana` font family. If you want to\
    \ format certain text with another font like `h1` or paragraph, you can do the\
    \ following.\n\nSample: `p {font-family: Tahoma, serif;}, h1 {font-family: Georgia,\
    \ sans-serif;}`\n\n# COMMENT TAGS\n\nComments can be used to explain why you’re\
    \ adding certain selectors to your CSS file. To help others who might see your\
    \ file or remember what we thought at a later date. You can add comments that\
    \ would be ignored by browsers as given below:\n\n`/* This is a comment */` starts\
    \ with `/` (slash), followed by `*` (asterisk), followed by the comment, followed\
    \ by the closing tag immediately after the opening tag `*` (asterisks) followed\
    \ by `/` (slash).\n\nMerge selectors.\n\nYou can combine items in a single selector\
    \ as follows.\n\nSample: `h1, h2, h3, h4, h5, h6 { color: #009900; font-family:\
    \ Georgia, sans Serif; }`\n\nAs you can look on the code above, we’ve grouped\
    \ all the header elements into a single selector. Each one is separated by a comma.\
    \ The final result of the above code will set all headers to green and to the\
    \ specified font. If the user doesn’t have the first font we declared, they will\
    \ go for another sans-serif font.\n\n# DIFFERENT TYPES OF CSS YOU CAN USE\n\n\
    There are three ways to write CSS for a web page. You have to decide which one\
    \ is better for you, but we recommend using an External Style Sheet, which is\
    \ the third type we’ll learn today.\n\nHere are three ways to use CSS:\n\n1. \
    \ **Inline styles:** It is placed inside `HTML` elements.\n2.  **Internal styles:**\
    \ It is placed in the `<head>` tag section of the web page you are writing.\n\
    3.  **External Styles:** It is placed in the External Style Sheet, which is a\
    \ separate page that links to the web page (recommended).\n\nAn explanation of\
    \ CSS methods is given below:\n\n*   **External style sheet:** The external CSS\
    \ file can be created using any text or HTML editor like “Notepad” or “Dreamweaver.”\
    \ A CSS file contains no `HTML` elements tags, only CSS. Now save it with the\
    \ `.css` file extension. You can link the file externally by keeping that one\
    \ of the following links in the head section of each (X)`HTML` file that you want\
    \ to style with CSS file.\n\nor, `<head><title> Title <title> <style type=\"text/css\"\
    > @import url('Path of stylesheet.css') </style></head><body>`\n\n`Styless.css`\n\
    \n```css\nh2, p { font-size: 32px; color: lightseagreen; text-shadow: 2px 2px\
    \ black; }\nh1 { font-size: 42px; font-family: 'Franklin Gothic Medium', 'Arial\
    \ Narrow', Arial, sans-serif; }\n.container { align-items: center; max-width:\
    \ 800px; max-height: auto; margin: 280px auto; border: 1px solid black; border-radius:\
    \ 20px; padding: 50px; }\n```\n\n![](images/ufig1_2.jpg)\n\nThe external style\
    \ sheet.\n\n*   **Internal style sheet:** It is a way you are simply placing that\
    \ CSS code within the `<head>` and `</head>` tags of each `HTML` file you want\
    \ to style with the CSS. The format is shown in the example below:\n\n    With\
    \ the above method, each `HTML` file contains the CSS styling code needed to style\
    \ the page. That means any changes you want to make to a page, will have to be\
    \ made to all. The method can be good if you need to style only a page, or if\
    \ you want other pages to have varying styles.\n\n    ![](images/ufig1_3.jpg)\n\
    \n    The internal style sheet.\n\n*   **Inline styles:** It is a defeat purpose\
    \ of using CSS in the first place. Inline styles are defined well in the `HTML`\
    \ file alongside the element you want to style. It may appear in the queue, next\
    \ to the CSS text.\n\n    ![](images/ufig1_4.jpg)\n\n    The inline style sheet.\n\
    \nExternal style sheets contain CSS instructions, and these are special files,\
    \ and have a `.css` file extension. If an external style sheet is installed on\
    \ any web page, the CSS file will control its sound and appearance.\n\n    Using\
    \ an external style sheet, all your `HTML` files are linked to a single CSS file\
    \ to format the pages. This means that if you need to change the design of all\
    \ your pages, you only need to edit one `.css` file to make general changes to\
    \ your entire website. Here are a few reasons why this is better.\n\n    *   Easier\
    \ Maintenance\n    *   Reduced File Size\n    *   Reduced Bandwidth\n    *   Improved\
    \ Flexibility\n\n# CSS CLASSES\n"
