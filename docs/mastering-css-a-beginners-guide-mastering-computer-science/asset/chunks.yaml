  trans: '


    文档通常是使用标签语言创建文本文件——`HTML` 是常用的标记语言，但你也可以与其他标签语言（如 `SVG` 或 `XML`）结合。向其他用户展示文档意味着将其转换为你的观众所使用的格式。其他浏览器，如
    `Firefox`、`Chrome` 或 `Edge`，旨在通过视图传递文本，例如在计算机屏幕、投影仪或打印机上。


    层级样式表（`CSS`）是一种整合了所有与网页显示相关信息的编程语言。`CSS` 定义了网站或页面的样式和格式，包括布局、字体、内边距（每个元素周围的空间）等。`CSS`
    与 `HTML` 共同构成了互联网运行的基础。所有标准和规范也由万维联盟（`W3C`）维护。


    `CSS` 可用于基本样式——例如更改标题和链接的颜色和大小。它可以用于构建结构，例如，将单列文本转换为主区域和相关信息栏。它还可以用于动画等效果。


    ## 历史


    `CSS` 受到挪威人 `Håkon Wium Lie` 的高度评价，他在 `1994` 年想要为万维网创建一个标准的样式表。第一个 `CSS` 是在 Arena
    浏览器中尝试的。自创建以来，`Lie` 与 `Tim Berners-Lee` 和 `Robert Cailliau` 共同生产了多个版本的 `CSS`——`CSS1`、`CSS2`。在第一个十年中（`1994`–`2004`），`CSS`
    成为网页标准，对我们现在所知的万维网外观产生了重大影响。`CSS3` 于 `1999` 年发布。


    `CSS` 是网页上使用的三种核心技术之一（另外两个是 `HTML` 和 `JavaScript`）。`CSS` 代表 Cascading Style Sheets（层级样式表）——链接实际上是指“级联”和“样式”，这两个词描述了样式如何从一个传递到另一个。


    `CSS` 的多种优点之一是单个文档内可以使用多种样式。`CSS` 用于定义 `HTML` 代码将变成什么样。虽然 `HTML`（超文本标记语言）用于创建内容（包括文本），但
    `CSS` 改变了网页的外观。因此，根据想要显示的数据，开发者可能会选择使用标题和副标题样式，以确保文字出现在页面的顶部或侧边。


    ## 为什么我们需要 CSS？


    首先，应用 `CSS` 确保了你的网页的一致性。如果你的网站有 100 个页面，想象一下你每次想生成新网页时都必须输入代码来定义标题大小、布局和其他显示数据，并合并所有内容。再想象一下拥有一个
    100 个页面的网站，可以在保持其他一切不变的情况下更改其中一个页面。`CSS` 也让这成为可能。使用 `CSS` 在需要的地方带来了灵活性，能够对单个页面或部分进行更改。


    ## 为什么我们使用 CSS？


    为了让网站正常运行，它必须具有快速的下载时间。如今，人们通常只需等待几秒钟即可加载。因此，确保快速运行至关重要。对于寻求确保网站信息快速流畅的公司来说，`CSS`
    成为他们成功的关键。


    由于维护时间短，`CSS` 很容易维护。这是因为单行代码转换会影响整个网页。此外，如果需要升级，只需付出少量精力。


    你可能找不到许多优秀且易于使用的网站。所有这些网站的一个共同点是构建的一致性。`CSS` 赋予开发者能力，确保样式特征在每个网页上得到一致应用。


    由于其速度快且易于维护，`CSS` 因其加载快速而在网页开发过程中节省了大量的时间和精力。在这里，短的时间确保了设计师良好的性能。


    人们使用不同的智能设备查看特定网站。可以是智能手机、`PC` 或笔记本电脑。出于这一目的，网站需要与设备兼容。`CSS` 通过提供更好的对齐来确保运行顺畅。


    你可以借助 `CSS` 更改 `HTML` 标签的位置。你可以根据需要将网页的任何部分设置为图像。


    ## CSS 的不同版本


    - `CSS1` 和 `CSS2`（不再适用）：于 `1996` 年 12 月由 `W3C` 作为建议发布。该版本定义了 `CSS` 语言和所有 `HTML`
    标签的视觉格式模型。这些是不再更新或维护的两个 `CSS` 版本。

    - `CSS2.1`（推荐）：`W3C` 于 `1998` 年 5 月提出的建议，基于 `CSS1` 构建。该版本增加了对特定媒体样式表的支持，例如音频打印机和设备、可下载字体、对象布局和表格。此版本修复了
    `CSS2` 中的许多错误和问题，现在是 `CSS` 的官方推荐版本。

    - `CSS3`：`CSS3` 于 `1999` 年 6 月成为 `W3C` 建议，并基于旧版本的 `CSS` 构建。它被分为名为 `Modules`（模块）的文本，这里的每个模块都定义了
    `CSS2` 中定义的新扩展功能。这些版本在 `CSS2.1` 的基础上增加了新功能，并保持了背景兼容性。某些功能仍在测试中，并可能在未来发生变化。请谨慎使用，因为它可能会导致你的网站出现问题。


    `CSS3` 是早期 `CSS` 版本（`CSS2`）的最新标准。`CSS2` 和 `CSS3` 之间的主要区别如下：


    - `Media Queries`（媒体查询）

    - `Namespaces`（命名空间）

    - `Selectors Level 3`（选择器 3 级）

    - `Color`（颜色）


    `CSS4` 从未成为过正式版本。


