    \ the colon and the value of the property after the colon (red for example).\n\
    \n*   This example contains two declarations, one color and one font size. Each\
    \ pair specifies the location of the element (s) we select (<p> in this case),\
    \ and then the value we would like to give the structure.\n\nCSS layouts have\
    \ different valid values, depending on the specified format. In our example, we\
    \ have a color package, which can take on different color values. We also have\
    \ a font size structure. This structure can take units of various sizes as a value.\n\
    \nThe CSS style sheet will contain many such rules, written in sequence.\n\n##\
    \ INHERITANCE CSS\n\nWhen you nest an element inside another, the nested element\
    \ inherits the properties assigned to the containing element. Unless you change\
    \ the values of the inner items independently. For instance, a font declared in\
    \ the body is inherited by all text in the file, regardless of the item it contains,\
    \ unless you declare another font for a particular nested item.\n\nSample: body\
    \ {font-family: Verdana, serif;}\n\nAll text in the HTML file will now be set\
    \ to the Verdana font family. If you want to format certain text with another\
    \ font like h1 or paragraph, you can do the following.\n\nSample:  p {font-family:\
    \ Tahoma, serif;},  h1 {font-family: Georgia, sans-serif;}\n\n## COMMENT TAGS\n\
    \nComments can be used to explain why you’re adding certain selectors to your\
    \ CSS file. To help others who might see your file or remember what we thought\
    \ at a later date. You can add comments that would be ignored by browsers as given\
    \ below:\n\n/* This is a comment */ starts with / (slash), followed by * (asterisk),\
    \ followed by the comment, followed by the closing tag immediately after the opening\
    \ tag * (asterisks) followed by / (slash).\n\nMerge selectors.\n\nYou can combine\
    \ items in a single selector as follows.\n\nSample: h1, h2, h3, h4, h5, h6 {     color:\
    \ #009900;     font-family: Georgia,     sans Serif; }\n\nAs you can look on the\
    \ code above, we’ve grouped all the header elements into a single selector. Each\
    \ one is separated by a comma. The final result of the above code will set all\
    \ headers to green and to the specified font. If the user doesn’t have the first\
    \ font we declared, they will go for another sans-serif font.\n\n## DIFFERENT\
    \ TYPES OF CSS YOU CAN USE\n\nThere are three ways to write CSS for a web page.\
    \ You have to decide which one is better for you, but we recommend using an External\
    \ Style Sheet, which is the third type we’ll learn today.\n\nHere are three ways\
    \ to use CSS:\n\n1.  **Inline styles:** It is placed inside HTML elements.\n\n\
    2.  **Internal styles:** It is placed in the <head> tag section of the web page\
    \ you are writing.\n\n3.  **External Styles:** It is placed in the External Style\
    \ Sheet, which is a separate page that links to the web page (recommended).\n\n\
    An explanation of CSS methods is given below:\n\n*   **External style sheet:**\
    \ The external CSS file can be created using any text or HTML editor like “Notepad”\
    \ or “Dreamweaver.” A CSS file contains no HTML elements tags, only CSS. Now save\
    \ it with the .css file extension. You can link the file externally by keeping\
    \ that one of the following links in the head section of each (X)HTML file that\
    \ you want to style with CSS file.\n\n    or, <head> <title> Title <title> <style\
    \ type=\"text/css\"> @import url('Path of stylesheet.css') </style> </head> <body>\n\
    \n    Styless.css\n\n    h2, p {     font-size: 32px;       color: lightseagreen;\
    \       text-shadow: 2px 2px black;   }   h1 {       font-size: 42px;       font-family:\
    \ 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;   }   .container\
    \ {       align-items: center;       max-width: 800px;       max-height: auto;\
    \       margin: 280px auto;       border: 1px solid black;       border-radius:\
    \ 20px;       padding: 50px;   }\n\n    ![](images/ufig1_2.jpg)\n\n    The external\
    \ style sheet.\n\n*   **Internal style sheet:** It is a way you are simply placing\
    \ that CSS code within the <head> and </head> tags of each HTML file you want\
    \ to style with the CSS. The format is shown in the example below:\n\n    With\
    \ the above method, each HTML file contains the CSS styling code needed to style\
    \ the page. That means any changes you want to make to a page, will have to be\
    \ made to all. The method can be good if you need to style only a page, or if\
    \ you want other pages to have varying styles.\n\n    ![](images/ufig1_3.jpg)\n\
    \n    The internal style sheet.\n\n*   **Inline styles:** It is a defeat purpose\
    \ of using CSS in the first place. Inline styles are defined well in the HTML\
    \ file alongside the element you want to style. It may appear in the queue, next\
    \ to the CSS text.\n\n    ![](images/ufig1_4.jpg)\n\n    The inline style sheet.\n\
    \n    External style sheets contain CSS instructions, and these are special files,\
    \ and have a .css file extension. If an external style sheet is installed on any\
    \ web page, the CSS file will control its sound and appearance.\n\n    Using an\
    \ external style sheet, all your HTML files are linked to a single CSS file to\
    \ format the pages. This means that if you need to change the design of all your\
    \ pages, you only need to edit one .css file to make general changes to your entire\
    \ website. Here are a few reasons why this is better.\n\n    *   Easier Maintenance\n\
    \n    *   Reduced File Size\n\n    *   Reduced Bandwidth\n\n    *   Improved Flexibility\n\
    \n## CSS CLASSES"
