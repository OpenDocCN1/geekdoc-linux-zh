  trans: "\n\nCSS 仅关注网页布局，而页面内容则使用如 `HTML` 等标记语言来定义。样式与内容分离具有多种优点，其中提高可访问性以及对网页设计更具控制力。\n\
    \nCSS 文档用于定义网页样式，然后链接到包含页面内容和布局的 `HTML` 文档（或使用不同标记语言的文档）。直接将样式设置到 `HTML` 文档中是可能的，但不建议这样做。可以使用任何文本编辑器创建\
    \ CSS 文本，例如 Mac 上的 `Text Editor` 或 Windows 上的 `Notepad`，以及你可以下载的许多其他免费或付费选项。\n\
    \n# CSS 是如何工作的？\n\nCSS 包含了网页浏览器可以在网页内容中使用中规则和值，以便更好地显示其内容。例如，你可以使用它来定义页面的 `body`\
    \ 部分具有蓝色背景，文本以大小为 `18px` 的白色 `Helvetica` 字体显示。CSS 规则由特定的文档格式读取（这就是为什么“级联样式表”中出现“级联”一词的缘）。通常情况下，CSS\
    \ 文档中的下一步是胜者——除非第一条规则非常明确。例如，你可能为你冲突的 CSS 文件设置了两个规则——例如将 `body` 字体设为蓝色并将 `section`\
    \ 字体设绿色。在这种情况下，有效的规则将是分类字体，因为它比正文字体清晰得多。\n\n# CSS 语法\n\n现在转向原始 CSS。我们做的第一件事是让段落内容变为不同的颜色。因此将其输入或粘贴到你的样式文件\
    \ `style.css` 中。\n\n这与 `HTML` 文件中的代码不同，因为它是不同的语法。我将添加一个白色区域并如下切入代码：\n\n```css\n\
    p { color: blue; }\n```\n\n上述两个示例对你的浏览器来说完全相同。但开发者经常像最后一个示例那样编写 CSS 以区分样式。\n\n\
    CSS 是一种基于规则的语言——通过指定应用于网页上特定对象或对象组样式组来定义规则。例如，你可能决定页面上的主要主题显示为红色标记。代码显示了一个简单的\
    \ CSS 规则。\n\n*   例如，CSS 规则以选择器开头。\n*   选择将对其设置样式的 `HTML` 元素。在这种情况下，我们为一级标题 `<p>`\
    \ 设置样式。\n*   然后我们有一组大括号的代码 `{}`。\n*   在工具内部，将有一个或多个声明，它们以属性和键值对的形式出现。在冒号之前指定位置（上述示例中的\
    \ `color`），在冒号之后指定属性的值（例如 `red`）。\n*   此示例包含两个声明，一个颜色和一个字体大小。每对值都指定了我们选择的元素（s）的位置（在本例中为\
    \ `<p>`），然后是我们想要赋予该结构的值。\n\nCSS 布局具有不同的有效值，取决于指定的格式。在我们的示例中，我们有一个颜色包，它可以接受不同的颜色值。我们还有一个字体大小结构。该结构可以接受各种大小的单位作为值。\n\
    \nCSS 样式表将包含许多此类规则，按顺序编写。\n\n# CSS 继承\n\n当你将一个元素嵌套在另一个元素内部时，嵌套元素会分配给容器元素的属性。除非你独立更改内部项目的值。例如，在\
    \ `body` 中声明的字体会被文件中的所有文本继承，无论它包含什么项目，除非你为特定的嵌套项目声明了另一种字体。\n\n示例：`body {font-family:\
    \ Verdana, serif;}`\n\n现在 `HTML` 文件中的所有文本都将设置为 `Verdana` 字体族。如果你想用另一种字体格式化某些文本（如\
    \ `h1` 或段落），你可以执行以下操作。\n\n示例：`p {font-family: Tahoma, serif;}, h1 {font-family:\
    \ Georgia, sans-serif;}`\n\n# 注释标签\n\n注释可以解释为什么向 CSS 文件中添加某些选择器。帮助帮助可能看到你文件的其他人，或者在以后记住我们当时的想法。你可以像下面一样添加会被浏览器忽略的注释：\n\
    \n`/* This is a comment */` 以 `/`（斜杠）开头，紧接着是 `*`（星号），然后是注释，紧接着开启标签之后是结束标签 `*`（星号）后跟\
    \ `/`（斜杠）。\n\n合并选择器。\n\n你可以如下所示在单个选择器中组合项目。\n\n示例：`h1, h2, h3, h4, h5, h6 { color:\
    \ #009900; font-family: Georgia, sans Serif; }`\n\n如你从上面的代码所示，我们将所有标题元素分组到单个选择器中。每个元素都用逗号分隔。上述代码的最终结果将所有标题设置为绿色和指定的字体。如果用户没有我们声明的第一个字体，他们将使用另一种无衬线字体。\n\
    \n# 你可以使用的不同类型的 CSS\n\n为网页编写 CSS 有三种方法。你必须决定哪种对你来说更好，但我们推荐使用外部样式表，这是我们今天要学习的第三种。\n\
    \n这里是使用 CSS 的三种方法：\n\n1.  **内联样式：** 放置在 `HTML` 元素内部。\n2.  **内部样式：** 放置在你编写的网页的\
    \ `<head>` 标签部分。\n3.  **外部样式：** 放置在外部样式表中，它是一个链接到网页的独立页面（推荐）。\n\n下面是 CSS 方法的说明：\n\
    \n*   **外部样式表：** 可以使用任何文本或 HTML 编辑器（如“Notepad”或“Dreamweaver”）创建外部 CSS 文件。CSS 文件不包含任何\
    \ `HTML` 元素标签，只有 CSS。现在用 `.css` 文件扩展名保存它。你可以通过在每个想要用 CSS 文件设置样式的 (X)`HTML` 文件的头\
    \ 部分中保留以下链接之一来外部链接该文件。\n\n或者，`<head><title> Title <title> <style type=\"text/css\"\
    > @import url('Path of stylesheet.css') </style></head><body>`\n\n`Styless.css`\n\
    \n```css\nh2, p { font-size: 32px; color: lightseagreen; text-shadow: 2px 2px\
    \ black; }\nh1 { font-size: 42px; font-family: 'Franklin Gothic Medium', 'Arial\
    \ Narrow', Arial, sans-serif; }\n.container { align-items: center; max-width:\
    \ 800px; max-height: auto; margin: 280px auto; border: 1px solid black; border-radius:\
    \ 20px; padding: 50px; }\n```\n\n![](img/ufig1_2.jpg)\n\n外部样式表。\n\n*   **内部样式表：**\
    \ 这种方法只是简单将 CSS 代码放置在想要用 CSS 设置样式的每个 `HTML` 文件的 `<head>` 和 `</head>` 标签内。格式如下例所示：\n\
    \n    使用上述方法，每个 `HTML` 文件都包含设置页面所需的 CSS 样式代码。这意味着你想对页面进行的任何更改都必须对所有文件进行。如果你只需要为单个页面设置样式，或者你想让其他页面具有不同的样式，这种方法会是很好的。\n\
    \n    ![](img/ufig1_3.jpg)\n\n    内部样式表。\n\n*   **内联样式：** 这违背了使用 CSS 的目的。内联样式定义在\
    \ `HTML` 文件中，就在你想设置样式的元素旁边。它可能会出现在队列中，位于 CSS 文字旁边。\n\n    ![](img/ufig1_4.jpg)\n\
    \n    内联样式表。\n\n外部样式表包含 CSS 指令，这些是特殊文件，并具有 `.css` 文件扩展名。如果在任何网页上安装了外部样式表，CSS 文件将控制其声音和外观。\n\
    \n    使用外部样式表，你所有的 `HTML` 文件都链接到单个 CSS 文件以格式化页面。这意味着如果你需要更改所有页的设计，只需要编辑一个 `.css`\
    \ 文件即可对你的整个网站进行常规更改。以下是这样做更好的几个原因：\n\n    *   更易维护\n    *   减小文件大小\n    *   减少带宽\n\
    \    *   提高灵活性\n\n# CSS 类\n\n"
