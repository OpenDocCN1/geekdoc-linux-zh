  raw: '*   If you learn and understand, you can learn and work with many CSS-based
    frameworks like Bootstrap.


    ## PROPERTIES OF CSS


    *   Knowledge of CSS and HTML is essential if anyone wants to pursue a career
    in web design professionally.


    *   With the use of CSS, we can control various styles such as text color, font
    style, spacing between paragraphs, column size and layout, background color and
    images, layout design, display variations for different screens and device sizes,
    and many other effects too.


    *   CSS has control over HTML documents, so it’s easy to learn. It is integrated
    with HTML and XHTML markup languages.


    *   Understanding of other associated technologies such as Angular, PHP, and JavaScript
    becomes clearer once we know some of the basics of CSS and HTML.


    In CSS, you can use various CSS properties such as:


    *   CSS Color Codes: It is a color picker, color charts, and code examples all
    in one page. It includes hex values, RGB, color names, transparency, and opacity.


    *   CSS @-Rules: There is a list of CSS at-rules. At-rules (or @-rules) define
    processing rules or values for the stylesheet. They start with an @ followed by
    their name.


    *   CSS3 Properties: There is a list of properties introduced in CSS3\. It includes
    animations, flexbox, gradients, multi-column layouts, and more.


    *   CSS Marquees: To create scrolling text and images in a standards-compliant
    way, we use CSS Marquees.


    *   CSS Patterns: CSS gradients are just fading from one color to another.


    *   You can use gradients to create interesting background patterns.


    *   CSS Media Types: It is used with media queries. You can apply a separate style
    depending on the media type that’s displaying your web page.


    *   CSS Media Features: You can use media queries to apply a separate style depending
    on the media features available in the output device such as phone, tablet, and
    laptop.


    *   Floating Menu: You can add a quick code to make a hovering menu.


    *   CSS Background Color: You can also set the background color of an HTML element.


    *   CSS Leading: You can also apply the CSS equivalent of leading to your text.


    *   CSS Align: You can align your elements vertically and horizontally.


    *   CSS Table Width and Cellpadding: You can use CSS to set the width of your
    tables with cellpadding.


    *   CSS Cellspacing: You can modify the space between table cells using CSS.


    *   CSS Scrollbars: You can use CSS to add scrollbars to an HTML element when
    its contents become too big.


    *   CSS Print Version: You can use CSS to apply a separate style to the printed
    version of your web pages.


