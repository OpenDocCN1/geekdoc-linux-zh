    ## CSS 颜色属性


    CSS 颜色功能设置文本元素内容的颜色。所有现代网络浏览器都支持不同的颜色以保持丰富的显示效果。在 CSS 中，颜色可以用多种方式表示，甚至可以使用诸如“color:
    blue”这样的颜色单词。然而，这种方法仅支持某些颜色的名称。因此，在 CSS 中使用了其他更的方法的方法显示颜色，如 `RGB`、`HSL`、`HEX`
    等。


    代码的输出如下：


    ![](img/ufig2_18.jpg)


    CSS 颜色属性 (color)。


    ### RGB 颜色


    RGB 是三种颜色（红、绿、蓝）的组合，用于所有计算机程序中显示颜色。正如我们所知，这些是基础色，通过组合它们，我们可以找到光谱中出现的任何颜色。


    代码的输出如下：


    ![](img/ufig2_19.jpg)


    CSS 颜色属性 (RGB)。


    ### RGBA 颜色


    在 CSS 中，`RGBA` 也是带有 Alpha 扩展的颜色显示格式。这种颜色工作的结构如下：


    ```

    rgba (Red, Green, Blue, Alpha)

    ```


