    ### Names


    In CSS, a color can be specified by using a pre-defined color name, such as,


    1.  Tomato


    2.  Orange


    3.  Dodger Blue


    4.  Medium Sea Green


    5.  Gray


    6.  SlateBlue


    7.  Violet


    8.  LightGray


