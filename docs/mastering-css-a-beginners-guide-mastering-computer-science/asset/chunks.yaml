    The class selector lets you style elements in the same HTML element differently.
    It’s similar to what I mentioned in the introduction about inline styles. Except
    for classes, the style can be overwritten by changing the style sheets. You can
    use the same class selector over and over in an HTML file.


    To put it more simply, the sentence you are reading is defined in my CSS file
    with the following.


    Sample:

    ```css

    p { font-size: small; color: #333333 }

    ```


    It’s pretty simple, but let’s say we want to change the word “sentence” to green
    bold text and leave the rest of the sentence untouched. You would do the following
    to my HTML file.


    ```html

    <p> In simple terms, this <span class="text"> You can write your sentence here
    </span> in my CSS file you are reading, it is formatted as follows. </p>

    ```


    Then you add the following style selector to my CSS file:


    ```css

    .text { font-size: small; color: #008080; font-weight: bold; }

    ```


    ## CSS IDs


    IDs are similar to classes. Suppose once a specific id has been declared, it cannot
    be used again within the same HTML file. We commonly use IDs to style the layout
    elements of a page that will only be needed once, whereas we use classes to style
    text and such that may be declared various times. The main container for the page
    is defined by the following example:


    ```html

    <div id="container">

    ```


    It is everything within my document is inside this division `</div>`. You have
    chosen the id selector for the `container` division over a class because you only
    need to use it one time within this file. Then in my CSS file, you will have the
    following example:


    ```css

    #container { width: 60%; margin: auto; padding: 10px; border: 2px solid #666;
    background: #ffffff; }

    ```


    You will get notice that the id selector should begin with a `#` number sign instead
    of a `.` period, as the class selector does.


    ## WHAT IS THE DIFFERENCE BETWEEN ID AND CLASS?


    We use IDs and Classes to target a particular HTML element to render differently
    from other similar elements via CSS, but what is the difference?


    Ids are of the “Unique” type:


    - Only one ID can be set for each Item.

    - The ID should only be used within a page.


    You should use the id when you have only one element on the page that you want
    to render. Your code cannot pass the validation test, which is important for web
    developers.


    Sample:

    ```html

    <div id="main-header"> text </div>

    ```


    ## CSS DIVISION


    Previously, you’ve learned the basics of CSS, how syntax works, and a little bit
    about classes and ids here. We’ll now take a short break from CSS and focus on
    the HTML side of using it. Sections are block-level HTML elements used to describe
    sections of an HTML file. A section can contain all the parts that make up your
    website, including additional sections, spans, images, text, etc. You define a
    section within an HTML file by placing the following between `<body> </body>`.


    Sample:

    ```html

    <body> <div> Site content go here </div> </body>

    ```


    You will most likely want to add some style to it. You can do this in the example
    below:


    ```html

    <div id="container"> Site content go here </div>

    ```


    The CSS file contains:


    ```css

    #container { width: 70%; margin: auto; padding: 20px; border: 1px solid #666;
    background: #ffffff; }

    ```


    Now everything in this section will be formatted according to the `container`
    style rule I defined in my CSS file. A split creates a line break by default.
    You can use both classes and sections of your website.


    ## HOW TO USE CSS PROPERTIES


    CSS layouts are used to apply styles to structured documents, such as those created
    in HTML or XML. CSS layouts are specified at the CSS level. Each property has
    a set of some possible values. Some properties can affect the type of element,
    while others apply only to certain groups of elements. The style sheet consists
    of a list of rules. Each rule or set of rule contains one or more selectors, as
    well as a declaration block.


    CSS features are used within the ad with the corresponding value.


    Let’s discuss various CSS properties in short. We have a separate chapter for
    each of the properties.


    ## CSS COLORS


    Colors are specified using predefined color names, RGB, HEX, HSL, RGBA, HSLA values.


    ### Names


    In CSS, a color can be specified by using a pre-defined color name, such as:


    1. Tomato

    2. Orange

    3. Dodger Blue

    4. Medium Sea Green

    5. Gray

    6. SlateBlue

    7. Violet

    8. LightGray


    ### List of Color Values


    Here’s a list of color values that can be used with CSS.


    - Named Colors

    - `transparent` Keyword

    - `CS` current color Keyword

    - 3-Digit Hex Codes

    - 4-Digit Hex Codes

    - 6-Digit Hex Codes

    - CSS 8-Digit Hex Codes

    - `RGB()` Function

    - `rgba()` Function

    - `HSL()` Function

    - `hsla()` Function

    - `hwb()` Function

    - System Colors


    Here is the complete list of names of colors that are supported by all browsers
    given below:


    1. Alice blue

    2. antique white

    3. Aqua

    4. Aquamarine

    5. Azure

    6. Beige

    7. Bisque

    8. Black

    9. dark orchid

    10. DarkRed

    11. DarkSalmon

    12. dark turquoise

    13. DarkViolet

    14. DeepPink

    15. DeepSkyBlue

    16. Fuchsia

    17. Gainsboro

    18. GhostWhite

    19. Gold

    20. HotPink

    21. Indian

    22. Indigo

    23. Ivory


    ## RGB COLOR


    There are different colors that add a different atmosphere to various designs.
    The right choice of colors can make designs and creations look clean, aesthetic,
    and modern. But the bad colors can make a project difficult for users to interact
    with because it will look not attractive to others.


    The color of the border (`border`), background (`background color`), or foreground
    (`color`) – the text decorations on the page have a huge impact, so you have to
    put some effort into getting them right.


    CSS lets you use a wide variety of different colors and color systems. They range
    from named colors to hexagonal colors, `RGB()` colors, `hsl` colors, and more.


    ### How to Use RGB Colors in HTML


    The easiest way to apply color to your HTML elements is to write your HTML in
    a `.html` file. Then, in that file, simply associate your `.css` style sheet with
    all the colors and styles you specify.


    It makes code easier to read and removes any considered best practice concerns.
    We can have an `about.html` file with some HTML code like this:


    ![](images/ufig1_5.jpg)


    Use of RGB in CSS.


    These are the common color user in CSS, you can change its value to create a new
    color.


    | Color Value in RGB | Color Name |

    | --- | --- |

    | `RGB(0, 255, 255)` `RGB(0, 0, 0)` `RGB(0, 0, 255)` `RGB(255, 0, 255)` `RGB(128,
    128, 128)` `RGB(0, 128, 0)` `RGB(0, 255, 0)` `RGB(128, 0, 0)` `RGB(0, 0, 128)`
    | aqua black blue fuchsia gray green lime maroon navy |

    | `RGB(128, 128, 0)` `RGB(128, 0, 128)` `RGB(255, 0, 0)` `RGB(192, 192, 192)`
    `RGB(0, 128, 128)` `RGB(255, 255, 255)` `RGB(255, 255, 0)` | olive purple red
    silver teal white yellow |


    ### Extended Color Keywords


    The following table lists the color keywords defined in the CSS3 specification.


    | Color Name | RGB Value |

    | --- | --- |

    | aliceblue antique white aqua aquamarine azure beige bisque black blanched almond
    blue blue violet brown burlywood cadet blue chartreuse chocolate coral flower
    blue corn silk crimson cyan darkblue dark cyan dark goldenrod dark gray darkgreen
    dark khaki magenta dark olivegreen orange orchid | `RGB(240, 248, 255)` `RGB(250,
    235, 215)` `RGB(0, 255, 255)` `RGB(127, 255, 212)` `RGB(1240, 255, 255)` `RGB(245,
    245, 220)` `RGB(255, 228, 196)` `RGB(0, 0, 0)` `RGB(255, 235, 205)` `RGB(0, 0,
    255)` `RGB(138, 43, 226)` `RGB(165, 42, 42)` `RGB(222, 184, 135)` `RGB(95, 158,
    160)` `RGB(95, 158, 160)` `RGB(210, 105, 30)` `RGB(255, 127, 80)` `RGB(100, 149,
    237)` `RGB(255, 248, 220)` `RGB(220, 20, 60)` `RGB(0, 255, 255)` `RGB(0, 0, 139)`
    `RGB(0, 139, 139)` `RGB(184, 134, 11)` `RGB(169, 169, 169)` `RGB(0, 100, 0)` `RGB(189,
    183, 107)` `RGB(139, 0, 139)` `RGB(85, 107, 47)` |

