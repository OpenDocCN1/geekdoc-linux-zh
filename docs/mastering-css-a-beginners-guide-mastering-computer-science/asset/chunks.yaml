    # CHAPTER 4 CSS Functions


    DOI: [10.1201/9781003358060-4](https://doi.org/10.1201/9781003358060-4)


    ## INTRODUCTION


    CSS functions are used for various CSS properties. For example, you can use the
    function `RGB()` to provide a color value (such as `color: RGB(105, 0, 215)`),
    or the `attr()` function to get the value of an HTML attribute.


    Various functions are used in CSS transforms. For example, the `rotate()` function
    can be used to rotate an element, the `scale()` function can be used to change
    the size of an element, and the `translate()` function can be used to move an
    element.


    There are also some functions, such as `circle()` to clip an element to a circle
    or create a circle for text to flow around, the `calc()` function can provide
    a calculated value for a property.


    ## BASICS OF CSS FUNCTIONS


    ### attr()


    The `attr()` function retrieves the value of the selected element and can be used
    in the stylesheet. It can be used on pseudo elements, in which case the value
    of the attribute on the pseudo element’s originating element is returned.


    The output of the above code is given below:


    ![](images/ufig4_1.jpg)


    CSS function (`:attr()`).


