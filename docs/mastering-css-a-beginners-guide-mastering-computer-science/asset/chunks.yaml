  trans: "\n\n`cssnext` 让你现在就能使用 CSS 的未来。你可以使用并非所有浏览器都支持的功能，例如 CSS 变量和 CSS 颜色函数。`cssnext`\
    \ 将你的样式转换为可以在所有浏览器中运行的代码。换句话说，`cssnext` 允许使用真实的 CSS 语法而不是另一种预处理器语法来编写样式。`cssnext`\
    \ 会为你的样式添加厂商前缀（vendor prefixes），所以你在编写 CSS 时不需要手动使用这些前缀。\n\n为了给你个例子，假设你有以下 CSS\
    \ 样式：\n\n```css\n:root {  --text: pink;  --bg-color: #FFEC31;  --flex-center:\
    \ {    display: flex;    margin: auto;  } } \n  .box {  background-color: var(--bg-color);\
    \  color: color(hotpink whiteness(25%));  @apply(--flex-center); } \n  .warn {\
    \  @apply(--flex-center); }\n```\n\n`cssnext` 将样式转换为如下所示：\n\n```css\n.box {  background-color:\
    \ #F9EC31;  color: rgb(255, 64, 159);  display: -webkit-box;  display: -ms-flexbox;\
    \  display: flex;  margin: auto; } \n  .warn {  display: -webkit-box;  display:\
    \ -ms-flexbox;  display: flex;  margin: auto; }\n```\n\n这个插件是 CSS 的 Babel，它允许你使用现代\
    \ CSS 特性，同时将它们转换为旧版浏览器更容易理解的 CSS：\n\n- 使用 `Autoprefixer` 添加前缀（所以如果你使用此项，就不需要直接使用\
    \ `Autoprefixer` 了）。\n- 允许使用 CSS 变量。\n- 允许使用嵌套语法，就像 Sass 一样。\n\n## CSSnano\n\n\
    `cssnano` 用于精简和压缩你的 CSS。它会移除空白、消除重复规则、过时的厂商前缀、注释，并执行许多其他优化。`cssnext` 和 `cssnano`\
    \ 都可以根据特定需求进行配置。\n\n### 安装 PostCSS、PostCSS-CLI、cssnext 和 cssnano\n\n使用 `npm`：\n\
    \n```bash\n$ npm install --save-dev postcss postcss-cli postcss-cssnext cssnano\n\
    ```\n\n或者通过 `Yarn` 命令：\n\n```bash\n$ yarn add postcss postcss-cli postcss-cssnext\
    \ cssnano --dev\n```\n\n### 使用 PostCSS-CLI\n\n你通过为 `PostCSS` 命令行 (`cmd`) 接口提供输入、输出文件以及要使用的\
    \ PostCSS 插件。它通过 `-- use` 标志指定插件，通过 `-- output` 标志指定输出文件，输入文件在最后不带任何标志直接提供，具体使用如下命令：\n\
    \n```bash\n$ postcss --use postcss-cssnext --use cssnano --output styles-out.css\
    \ styles.css\n```\n\n你可以在监听模式（watch mode）下使用 `PostCSS CLI`，通过以下命令监听输入文件的变化：\n\n\
    ```bash\n$ postcss --use postcss-cssnext --use cssnano --output styles-out.css\
    \ styles.css --watch\n```\n\n你可以在 json 配置文件中指定更细粒度的配置选项，通过 `-- config` 标志指定配置文件：\n\
    \n```bash\n$ postcss --config postcss-config.json\n```\n\n你的配置文件看起来像这样：\n\n```json\n\
    {\n  \"use\": [\"postcss-cssnext\", \"cssnano\"],\n  \"input\": \"styles.css\"\
    ,\n  \"output\": \"styles-out.css\"\n}\n```\n\n### npm Script\n\n为了让你的工作流运行更顺畅，只需在项目的\
    \ `package.json` 文件中设置 `postcss` 脚本：`\"scripts\": { \"postcss\": \"postcss --use\
    \ postcss-cssnext --use cssnano --output styles-out.css styles.css\" }`。\n\n现在你只需要运行以下命令：\n\
    \n```bash\n$ npm run postcss\n```\n\n## PreCSS\n\n它让你在 CSS 中使用类似 Sass 的标记和分阶段的\
    \ CSS 特性。给出的示例如下：\n\n```scss\n$blue: #056ef0; $column: 200px; \n  .menu {    width:\
