    \nThere are many different selectors. The examples above use item selectors that\
    \ select all items of a given type. But we can also make more specific choices.\
    \ Here are some of the common types of selectors:\n\n### Selector Name\n\n*  \
    \ The CSS element selector: This element selector selects HTML elements based\
    \ on the element name.\n\n*   The CSS id selector: The selector id uses the id\
    \ attribute of an element to select a particular element. The id is unique in\
    \ a single page, so the id is used to select a unique element. To select a particular\
    \ element with an id, write a hash (#) symbol, followed by the id of the element.\n\
    \n*   The CSS class selector: The selector class selects HTML elements with a\
    \ specific class attribute. To select these elements with a particular class,\
    \ write a dot (.) character, followed by the class name.\n\n*   Attribute selector:\
    \ The elements on the page with the particular attribute.\n\n*   The CSS universal\
    \ selector: The universal (*) selects all HTML elements on the page. To select\
    \ these elements with a specific class, write an asterisk (*) character, followed\
    \ by the tag name.\n\n*   The CSS grouping selector: The grouping selector selects\
    \ every element with the same style definitions. Now, look at the following code\
    \ (the h1, h2, and p elements have the same style definitions).\n\n*   Pseudo-class\
    \ selector: The specified elements, but only when in a certain state. (For instance,\
    \ when a cursor hovers over a link.)\n\n    selects <a>, works when the mouse\
    \ pointer is hovering over the link.\n\n## CSS BACKGROUND\n\nThe background property\
    \ allows to control the background of the element. It is a property, which means\
    \ that it allows to write what would be multiple CSS properties in one.\n\nThere\
    \ are eight other properties available under the background given below:\n\n*\
    \   background-repeat\n\n*   background-attachment\n\n*   background-image\n\n\
    *   background-clip\n\n*   background-color\n\n*   background-position\n\n*  \
    \ background-size\n\n*   background-origin\n\nYou can use any of the combinations\
    \ of these properties that you love to use, in almost any order\n\n## MULTIPLE\
    \ BACKGROUNDS\n\nCSS3 added support for various backgrounds, which layer over\
    \ the top of each other. Any property related to the  backgrounds can take a comma\
    \ (,)separated list, like this: .tagname {   background: URL(image1.jpg), URL(image2.jpg)\
    \ black;   background-repeat: repeat-x, no-repeat; }\n\n## CSS BORDER\n\nThe border\
    \ property is a syntax in CSS that accepts multiple values for drawing a line\
    \ around the element it is applied to: .container{   border: 3px solid red;   height:\
    \ 200px;   width: 200px; }\n\n### Border\n\nThe border property accepts more than\
    \ one  of the following values in combination:\n\nborder-width: It defines the\
    \ thickness of the border.\n\n*   thin\n\n*   medium\n\n*   thick\n\nborder-style:\
    \ It specifies the type of the line drawn around the element, including:\n\n*\
    \   dotted – It defines a dotted border.\n\n*   dashed – It defines a dashed border.\n\
    \n*   solid – It defines a solid border.\n\n*   double – It defines a double border.\n\
    \n*   groove – It defines a 3D grooved border. The effect depends on the border-color\
    \ value.\n\n*   ridge – It defines a 3D ridged border. The effect depends on the\
    \ border-color value.\n\n*   inset – It defines a 3D inset border. The effect\
    \ depends on the border-color value.\n\n*   outset – It defines a 3D outset border.\
    \ The effect depends on the border-color value.\n\n*   none – It defines no border.\n\
    \n*   hidden – It defines a hidden border.\n\nborder-color: It specifies the color\
    \ of the border and accepts all valid color values.\n\n## CSS BORDER WIDTH AND\
    \ COLOR\n\nThe border-width property defines the width of the four borders. The\
    \ width can also be set as a specific size (such as in px, pt, cm, em, etc.) or\
    \ by using the three pre-defined values such as thin, medium, or thick.\n\nThe\
    \ border color property is used to define the color of the four borders. The color\
    \ can be set by:\n\n*   name – It specifies a color name, like “red.”\n\n*   HEX\
    \ – It specifies a HEX value, like “#ff0000.”\n\n*   RGB – It specifies an RGB\
    \ value, like “rgb(255,0,0).”\n\n*   HSL – It specifies an HSL value, like “hsl(0,\
    \ 90%, 50%).”\n\n*   Transparent\n\n## CSS MARGINS\n\nCSS genetic features are\
    \ used to create space around elements, without any defined parameters. With CSS,\
    \ you have full control over margins. There are features for setting the margin\
    \ for each element of the element such as top, right, bottom, and left. CSS has\
    \ features that specify a margin for each element:\n\n*   margin-top\n\n*   margin-right\n\
    \n*   margin-bottom\n\n*   margin-left\n\nAll genetic features can have the following\
    \ values:\n\n*   default – The browser calculates limit.\n\n*   length – It specifies\
    \ margin in px, pt, cm, etc.\n\n*   % – It specifies margin in% of the width of\
    \ the content.\n\n*   inheritance – it specifies that the margin should inherit\
    \ from the parent.\n\n## CSS PADDING"
