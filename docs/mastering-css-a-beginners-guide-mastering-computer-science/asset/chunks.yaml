  trans: "\n\n### 6. `animation-direction` 属性：`animation-direction` CSS 属性指定动画在交替循环中是否反向播放。\n\
    \n该属性的语法如下：`animation-direction: normal | reverse | alternate | alternate-reverse\
    \ | initial | inherit`\n\n### 7. `animation-fill-mode` 属性：`animation-fill-mode`\
    \ 属性定义了 CSS 动画在执行之前和之后如何向目标应用样式。\n\n该属性的语法如下：`animation-fill-mode: none | backwards\
    \ | forwards | both | initial | inherit`\n\n下表定义了该属性的值：\n\n| Value | Description\
    \ |\n| --- | --- |\n| none | 动画在执行前或执行后都不会应用到目标上。 |\n| forwards | 动画结束后，动画将应用动画结束时刻的值。\
    \ |\n| backwards | 动画在属性定义的期间，将应用启动动画第 1 次迭代的关键帧中定义的值。可以是 `from` 帧的值，也可以是 `to`\
    \ 帧的值。 |\n\n### 8. `animation-play-state` 属性：`animation-play-state` 属性指定动画是在播放中还是暂停状态。\n\
    \n该属性的语法如下：`animation-play-state: paused | running | initial | inherit`\n\n###\
    \ 9. `initial`：将属性设置为其默认值。\n\n### 10. `inherit`：如果指定此值，关联元素将继承其父元素动画属性的计算值。\n\n\
    ## @KEYFRAMES 规则\n\n当我们在 `@keyframes` 规则内部指定 CSS 样式时，动画会在特定时间从当前样式变为新样式。\n\n代码的输出所示：\n\
    \n![](img/ufig2_1.jpg)\n\nCSS 动画属性。\n\n代码的的输出所示：\n\n![](img/ufig2_2.jpg)\n\nCSS\
    \ 动画属性（第二个示例）。\n\n现在在下方的示例中，我们将使用上面讨论过的属性来使用动画。\n\n代码的输出所示：\n\n![](img/ufig2_3.jpg)\n\
    \nCSS 动画属性（第三个示例）。\n\n## CSS 背景属性\n\n`background` 是一个简写属性，用于在单个声明中设置单个背景属性，即 `background-image`、`background-position`、`background-size`、`background-repeat`、`background-attachment`、`background-origin`、`background-clip`\
    \ 和 `background-color`。\n\n该属性的语法如下：`background: [ the image position/size repeat\
    \ attachment the origin clip color ] | initial | inherit`\n\n1. `background-attachment`\
    \ 属性：`background-attachment` CSS 属性定义背景图像是随文档滚动还是固定在可视区域。该属性的语法如下：`background-attachment:\
    \ scroll | fixed | initial | inherit`。\n\n2. `background-color` 属性：`background-color`\
    \ 属性设置元素的背景颜色。你可以通过颜色值或关键字 `transparent` 设置背景颜色。\n\n任何元素的背景都是元素的整个尺寸，包括内边距（padding）和边框（border），但不包括外边距（margin）。参见盒模型。该属性的语法如下：`background-color:\
    \ color | transparent | initial | inherit`。\n\n3. `background-clip` 属性：`background-clip`\
    \ 属性指定元素的背景（颜色或图像）是否扩展到它的边框。该属性的语法如下：`background-clip: border-box | padding-box\
    \ | content-box | initial | inherit`。\n\n代码的输出所示：\n\n![](img/ufig2_4.jpg)\n\n\
    CSS 背景裁剪。\n\n4. `background-image` 属性：`background-image` 属性为元素设置背景图像。通常使用简属性 `background`\
    \ 属性更好。\n\n该属性的语法如下：`background-image: url | none | initial | inherit`\n\n代码的输出所示：\n\
    \n![](img/ufig2_5.jpg)\n\nCSS 背景图像。\n\n5. `background-origin` 属性：`background-origin`\
    \ CSS 属性指定背景的定位区域，即使用 `background-image` 属性指定的图像的起始位置。该属性的语法如下：`background-origin:\
    \ border-box | padding-box | content-box | initial | inherit`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<style>\n  .demo_container{\n    text-align: center;\n\
    \  }\n  .parent {\n    height:500px; display: flex; align-items: center; justify-content:\
    \ center;\n  }\n  .child {\n    width: 500px;\n    height:400px;\n    padding:\
    \ 10px;\n    border: 6px dashed #333;\n    background: url(\"/images-1.jpg\")\
    \ no-repeat;\n    background-size: cover;\n    background-origin: content-box;\n\
    \  }\n</style>\n</head>\n<body>\n<div class=\"demo_container\">\n  <div class=\"\
    parent\">\n    <div class=\"child\">\n      <h1>CSS Background Origin - Here in\
    \ this you can apply padding</h1>\n    </div>\n  </div>\n</div>\n</body>\n</html>\n\
    ```\n\n代码的输出所示：\n\n![](img/ufig2_6.jpg)\n\nCSS 背景起始。\n\n代码的输出所示：\n\n![](img/ufig2_7.jpg)\n\
    \nCSS 背景起始 - 内边距框。\n\n6. `background-position` 属性：`background-position` 属性设置元素背景图像的初始位置（即起始位置）。通常使用简写\
    \ `background` 属性更好。\n\n它的默认值为 `0% 0%`。\n\n该属性的语法如下：`background-position: [ percentage\
    \ | length | left | right ] 1 或 2 个值 | initial | inherit`\n\n代码的输出所示：\n\n![](img/ufig2_8.jpg)\n\
    \nCSS 背景位置。\n\n7. `background-repeat` 属性：`background-repeat` CSS 属性指定背景图像在调整尺寸和位置后是否重复或平铺。通常使用简写\
    \ `background` 属性更好。\n\n该属性的语法如下：`background-repeat: repeat | repeat-x | repeat-y\
    \ | no-repeat | initial | inherit`\n\n代码的输出所示：\n\n![](img/ufig2_9.jpg)\n\nCSS\
    \ 背景重复(y)。\n\n代码的输出所示：\n\n![](img/ufig2_10.jpg)\n\nCSS 背景重复(x)。\n\n8. `background-size`\
    \ 属性：`background-size` 属性定义背景图像的大小。\n\n该属性的语法如下：`background-size: length attribute|\
    \ percentage attribute| auto attribute | cover attributes | contain attribute|\
    \ initial attribute| inherit attribute`\n\n代码的输出所示：\n\n![](img/ufig2_11.jpg)\n\
    \nCSS 背景尺寸 - 包含和填充。\n\n## CSS 边框属性\n\n`border` 属性设置元素边框四边的宽度、样式和颜色。它是设置单个边框属性的简写属性，即在单个声明中设置\
    \ `border-width`、`border-style` 和 `border-color`。\n\n该属性的语法如下：\n\n`border: [ border-width\
    \ border-style border-color ] | initial | inherit`\n\n代码的输出所示：\n\n![](img/ufig2_12.jpg)\n\
    \nCSS 边框属性。\n\n1. `border-width` 属性：`border-width` CSS 属性是设置单个边框宽度属性的简写属性，即在单个声明中设置\
    \ `border-top-width`、`border-right-width`、`border-bottom-width` 和 `border-left-width`。该属性的语法如下：`border-width\
    \ : [ thin | medium | thick | length ] 1 到 4 个值 | inherit`\n\n代码的输出所示：\n\n![](img/ufig2_13.jpg)\n\
    \nCSS 边框属性-宽度。\n\n"
