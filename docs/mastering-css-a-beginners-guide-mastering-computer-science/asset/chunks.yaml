    \ its purpose is with the properties and features it contains\n\nIn this section,\
    \ you do not need to worry much about how CSS is created; however, it may be easier\
    \ to get information if, for example, you know that a certain place may be found\
    \ among other things, therefore, it is almost in the same situation.\n\nFor example,\
    \ let’s go back to the Background and Borders module – you may think it makes\
    \ sense that background color and border color structures are defined in this\
    \ module. And you will be right. If you know something about HTML, then it is\
    \ good; if not, let’s have a brief introduction to HTML and how to link a CSS\
    \ file with HTML for changing styles.\n\n## BASIC HTML\n\nThe following section\
    \ provides an introduction to HTML. We cannot imagine web pages and the World\
    \ Wide Web without HTML. It is the language most used to write web pages. It represents\
    \ Hyper-Text Mark-up Language. You should know that any link found on web pages\
    \ is usually called Hypertext, and the mark refers to the tag or page layout in\
    \ such a way that the text in the webpage list is displayed in the correct format.\
    \ The purpose of developing HTML was to understand the structure of any text:\
    \ title, body, content, or categories.\n\nSo, basically, HTML provides a structured\
    \ format to display the content of web pages. It is very simple and easy to understand.\
    \ In the early nineties, it was developed by Tim Berners-Lee and later went through\
    \ many changes and modifications. HTML 5 is the latest version of Html.\n\nYou\
    \ know that HTML is a simple language that can use many tags to format content.\
    \ All tags are enclosed within angular brackets <tagname>. With the exception\
    \ of a few tags, most tags start with angular tags and end with corresponding\
    \ angular tags.\n\n<! DocType Html> defines the document type and version of Html.\
    \ The Html code starts just after the <html> angular marker and ends with </html>\
    \ not seen in the screenshot above.\n\nIt usually has two major parts, namely\
    \ the head and the body. Each category has its set of requirements related to\
    \ requirements. You will get various sections in HTML structure. Let’s discuss\
    \ each.\n\n### Head Section\n\nThe header tag represents a web document header\
    \ that you can tag <head> and <link> with. It starts with <head> and ends with\
    \ </head>. It has parts of the title inside. For example, <title> This will be\
    \ your webpage title. </li>>.\n\n### Body Section\n\nIt represents the body of\
    \ a web document that usually contains titles, text, and sections. Topics start\
    \ with <title> and end with </title>. Among these tags, the content can be labeled\
    \ as “this is the first topic.”\n\nThe paragraph will start with <p> and end with\
    \ </p>. The content of the section should be written between these angular characters.\
    \ The basic Html code shown below in the overview section is used to create a\
    \ simple Html page.\n\nThere are various elements we can add to our HTML code;\
    \ let’s take a look.\n\n*   HTML headings are elements defined by tags <h1> to\
    \ <h6> where <h1> defines the important tag and <h6> defines the less important\
    \ tag. The HTML section is an HTML element that will be defined using the <p>\
    \ tag.\n\n*   HTML images are a feature of HTML and are defined by the <img> tag,\
    \ and need to specify attributes such as image src, alt means other text, width,\
    \ and height.\n\n*   HTML lists are elements and are defined using <ul> or <ol>\
    \ tags where <ul> is a random list and <ol> has an ordered list.\n\n*   The HTML\
    \ table is part of the HTML and can be defined using tag <table> and tag lines\
    \ <tr> and tag cells <td>.\n\n*   HTML links are elements, and can be defined\
    \ using the <a> tag and sample code below:\n\n    *   The HTML attribute style\
    \ can be used with a combination of any elements such as <p>.\n\n    *   In HTML,\
    \ we use the lang attribute, we can say the language of a document using the <html>\
    \ tag and the language defined using the lang attribute.\n\n    *   In HTML, we\
    \ can use the formatting elements to format the document and we can define special\
    \ text features that have a special meaning. HTML elements like <b> bold, <i>\
    \ by italics.\n\n    *   In HTML, we can highlight specific text in a document\
    \ using the <mark> feature to highlight text included in the <mark> element.\n\
    \n    *   In HTML, we can define a text as the text above using the <sup> element\
    \ in the HTML document so that the text embedded in the <sup> element becomes\
    \ larger text.\n\nThe <!DOCTYPE> represents the document type and helps browsers\
    \ to display web pages correctly. It appears once, at the top of the page (before\
    \ any of the HTML tags). The <!DOCTYPE> declaration is not case sensitive.\n\n\
    Wherever the web is, it is HTML. HTML usage is distributed across all devices.\
    \ Here is the list of features of HTML to know where we can use it.\n\n*   Browsers\
    \ like Chrome, Firefox, and Safari all use HTML to render content on the web for\
    \ better display.\n\n*   Various mobile browsers like Opera, Firefox Focus, Microsoft\
    \ Edge, Dolphin, and Puffin all use HTML to better present and visualize online\
    \ content on mobile phones.\n\n*   Various smart devices are embedded with HTML\
    \ functions to better browse and navigate during their operations.\n\n*   HTML\
    \ supports the first channel verification method on any web page to stop unwanted\
    \ traffic.\n\n*   HTML accepts great content but gives the same visibility to\
    \ smaller screen devices and larger screen devices.\n\n*   HTML supports a variety\
    \ of colors, formats, and layouts.\n\n*   HTML uses templates that make website\
    \ design easy.\n\n*   The HTML and XML syntax are very similar, so it is easy\
    \ to work between the two domains.\n\n*   FrontPage, Dreamweaver, and many other\
    \ development tools support HTML.\n\n## STARTING WITH A SPECIFIC HTML\n\nHTML\
    \ and CSS are two methods of tags (code), with their own unique syntax. There\
    \ is a difference between the two. You can think of HTML as a page layout, while\
    \ CSS gives HTML its own style.\n\n## LINKING YOUR HTML AND CSS FILES\n\nBefore\
    \ we can write CSS, we have to go back to HTML. You need to write a new line to\
    \ link the HTML file and CSS file together. So, open the HTML file and add the\
    \ provided line “<link href =\" style.css “rel =\" stylesheet “type =\" text /\
    \ CSS “/\uFEFF>\uFEFF\". Your file code looks like this,\n\n![](images/ufig1_1.jpg)\n\
    \nExample of simple CSS.\n\nAbove line of code links a new CSS file to your HTML\
    \ file. Let’s split it: the href attribute specifies the link associated with\
    \ the CSS file. We’ll get to the links later, for now, just make sure that style.css\
    \ file is in the same folder as index.html file. The rel attribute tells your\
    \ browser that this is a style sheet. The attribute type tells the browser that\
    \ the linked file should be translated as CSS syntax.\n\n## HOW CSS AND HTML WORK\
    \ TOGETHER"
