    ## CSS 过渡属性


    CSS `transition` 属性用于定义 CSS 过渡的属性，并将四个过渡属性合并到一个属性中。`transition` 属性合并了以下属性，如 `transition-property`、`transition-duration`、`transition-timing-function`
    和 `transition-delay`。


