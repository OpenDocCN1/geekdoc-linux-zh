    100% 的值会产生更亮的图像。数值 0.2 的效果与百分比值 20% 相同。不允许负值。它与 `filter` 属性配合调整图像亮度。该函数对输入图像应用线性乘法，使其看起来更亮或更暗。它需要传递一个参数，用于确定应用于图像的亮度水平。参数可以是百分比或数字。


