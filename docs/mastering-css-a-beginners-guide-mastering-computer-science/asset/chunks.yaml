    ### contrast()


    The CSS `contrast()` is used with the `filter` property to adjust the brightness
    of an image. The `contrast()` requires an argument to be passed to it. It determines
    the brightness level that is applied to the image. The argument can be either
    a % value or a number.


    The syntax of the `contrast()` function is as follows: `contrast() = contrast(
    <number> | <percentage> )`


    The output of the code is given below:


    ![](images/ufig4_10.jpg)


    CSS function (`:contrast()`).


    ### counter()


    The `counter()` allows you to display the counter that was generated by the element.
    Each element has a collection of counters that are inherited from the document
    tree much like property values. You can create and manipulate counters using the
    `counter-increment`, `counter-reset`, and `counter-set` properties.


    For example, you can use the `counter()` to output an element’s counter in Upper
    Roman, Decimal, etc. You can also specify Unicode code points to specify special
    symbols or icons to use as mark representations.


    **Syntax:** The `counter()` function has two forms such as `counter(name)` or
    `counter(name, style)`. The text is the value of the innermost counter of the
    given name in scope at the pseudo-element; it is formatted in the indicated style
    (decimal by default).


    The syntax of the `counter()` function is as follows: `counter( <ident> [, [ <counter-style>
    | none ]?)`


    The output of the code is given below:


    ![](images/ufig4_11.jpg)


    CSS function (`:counter()`).


    ### counters()


    The `counters()` enables you to display nested counters that have been generated
    by an element and its parent/s. Every element has a collection of more counters,
    which are inherited from the document tree in a way similar to property values.
    You can create and manipulate counters with the `counter-increment`, `counter-reset`,
    `counter-set` properties. It has no visible effect by itself, but it can be used
    with the `counters()` and `counter()` functions, which allow the values of counters
    to be displayed, in the format you specify.


    The `counters()` have two forms: `counters(name, string)` or `counters(such as
    name, string, style)`. The text is the value of the counters with the given name
    in scope at pseudo-element, from outermost to innermost by the specified string.
    The counters are rendered in the indicated style (decimal by default).

