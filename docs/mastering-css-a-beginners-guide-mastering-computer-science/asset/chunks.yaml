    CSS finishing features are used to generate space near element content, within
    any defined parameters. With CSS, you have complete control over the pads. There
    are pads setup properties on each side of the element (top, right, bottom, and
    left). CSS has paddling specifications for each element of the element:


    * `padding-top`

    * `padding-right`

    * `padding-floor`

    * `padding-left`


    All completion buildings may have the following values:


    * `length` – It specifies padding in `px`, `pt`, `cm`, etc.

    * `%` – It specifies padding in% of the width of the content.

    * `inheritance` – It specifies that padding should inherit from the parent element.


    # CSS BOX MODEL


    This model is a box that wraps everything HTML contains: margins, borders, padding,
    and original content. In CSS, the term “box model” is used when referring to design
    and structure.


    Description of different parts:


    * `Content` – The contents of the box, in which the text and images appear.

    * `Padding` – It clears the area around the content. The padding is obvious.

    * `Border` – A border around padding and content.

    * `Margin` – It can clear an area outside of the border. The margin is clear.


    # CSS TABLES


    The table in CSS is used to apply various style elements to HTML Table elements
    to organize data in rows and columns or in a more complex format. Tables are used
    in communication and research data analysis. The table layout in CSS can be used
    to display table layouts. This feature is used primarily to set the algorithm
    used to edit `<table>` cells, rows, and columns.


    `Border`: Used to specify parameters in a table.


    # CSS FONTS


    The four sides of an element can be set side by side such as `margin-top`, `margin-right`,
    `margin-bottom`, `margin-left`, `padding-top`, `padding-right`, `padding-bottom`,
    and `padding-left` are the self-explanatory properties you can use. You can set
    the following font properties of an element:


    * The `font-family` property is used to change the writing of a font.

    * The `font-style` property is used to make a font italic or oblique.

    * The `font-variant` property is used to create a small-caps effect.

    * The `font-weight` property is used to increase or decrease how bold light a
    font appears.

    * The `font-size` property is used to increase or decrease the size of a font.

    * The `font` property is used to specify the number of other font properties.


    # CSS TEXT


    * The `color` property is used to set the color of a text.

    * The `direction` property is used to set the text direction.

    * The `letter-spacing` property is used to add or subtract space between letters
    that make a word.

    * The `word-spacing` property is used to add or subtract space between words of
    a sentence.

    * The `text-indent` property is used to indent the content of a paragraph.

    * The `text-align` property is used to align the content of a document.

    * The `text-decoration` property is used to underline, overline, and strikethrough
    text.

    * The `text-transform` property is used to capitalize content or content text
    to uppercase or lowercase letters.

    * The `white-space` property is used to control the flow and formatting of text.

    * The `text-shadow` property is used to set text shadow around a text.


    # CSS FUNCTIONS


    CSS functions are used as a number of different CSS structures. For example, you
    can use `RGB()` function to assign a color value (similar to the `color: RGB(205,
    0, 215)`), the `attr()` function to retrieve the HTML attribute value. Many functions
    are used in CSS conversion. For example, a rotating function `()` could be used
    to rotate an element, a `scale()` function could be used to resize an object,
    and a `translate()` function can be used to move an element.


    There are other useful functions, such as a `circle()` to attach an object to
    a circle or to create a circle for text to flow around, as well as a counting
    function `()` that can be used to give a calculated value to a plot.


