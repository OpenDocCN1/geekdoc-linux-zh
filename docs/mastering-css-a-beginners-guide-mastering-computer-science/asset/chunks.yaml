    \  $ npm install postcss-advanced-variables --save-dev\n  ```\n\n  你可以将 `PostCSS`\
    \ 添加到你的构建工具中：\n\n  ```bash\n  $ npm install postcss --save-dev\n  ```\n\n  将 `PostCSS\
    \ advanced variables` 作为插件使用：\n\n  ```javascript\n  postcss([  require('postcss-advanced-variables')(/*\
    \ options */ ]).process(YOUR_CSS);\n  ```\n\n- `postcss-preset-env`：它将现代 CSS 转换为大多数浏览器都能理解的内容，并根据目标浏览器或运行时环境确定所需的垫填充（polyfills）。\n\
    \n  你可以将 `PostCSS Preset Env` 添加到你的项目中：\n\n  ```bash\n  $ npm install postcss-preset-env\
    \ --save-dev (在终端中运行此命令)\n  ```\n\n  现在使用 `PostCSS Preset Env` 如下所示处理你的 CSS：\n\
    \n  ```javascript\n  const postCSSPresetEnv = require('postcss-preset-env');\n\
    \  postCSSPresetEnv.process(YOUR_CSS /*, processOptions, pluginOptions */);\n\
    \  ```\n\n### 各种 Options\n\n1. **stage**：此选项根据成为 Web 标准的稳定程度来决定要垫填充哪些 CSS 特性。`postcssPresetEnv({\
    \ stage: 0 })`\n\n  此阶段可以是 0（实验性）到 4（稳定），或为 false。通过将 `stage` 设置为 `false` 将禁用所有垫填充。如果你打算专门使用\
    \ `features` 选项，这将非常有用。\n\n  在没有任何任何配置选项的情况下，`PostCSS` 允许 `Preset Env Stage`。\n\
    \n2. **features**：通过 ID 启用或禁用特定的垫填充。向特定特性 ID 传递 `true` 将启用其垫填充，传递 `false` 则会禁用。\n\
    \n  该插件中有多种可用的 `id`，如下所示：\n\n  1. `postcssAttributeCaseInsensitive`\n  2. `postcssBlankPseudo`\n\
    \  3. `postcssColorFunctionalNotation`\n  4. `postcssEnvFunction`\n  5. `postcssLogical`\n\
    \  6. `postcssReplaceWrap`\n  7. `postcssSelectorNot` 等\n\n     你只需通过在代码中导入它们即可使用这些\
    \ ID。\n\n3. **insertBefore / insertAfter**：`insertBefore` 和 `insertAfter` 键允许将其他\
    \ PostCSS 插件插入链中。如果你在使用在特定垫填充之前或之后执行的糖 PostCSS 插件，这将非常有用。`insertBefore` 和 `insertAfter`\
    \ 都支持一个或多个插件的链式调用。\n\n4. **autoprefixer**：它包含了 `autoprefixer` 和 `browsers` 选项并将自动传递给它。指定\
    \ `autoprefixer` 选项允许向 `autoprefixer` 传递额外的选项。`postcssPresetEnv({ autoprefixer:\
    \ { grid: true } })`\n\n- `postcss at-root`：`@at-root` 会导致一个或多个规则在文档根部输出，而不是嵌套在它们的父选择器之下：\n\
    \n  结果如下：\n\n  ```css\n  .child { ... } .parent { ... }\n  ```\n\n  在代码中使用它：\n\
    \n  ```javascript\n  postcss([ require('postcss-atroot')() ])\n  ```\n\n- `postcss-property-lookup`：PostCSS\
    \ 插件允许引用属性值而不是变量，类似于 Stylus。\n\n  ```css\n  .section {  margin-left: 20px;  margin-right:\
    \ @margin-left;  color: red;  background: @color url('test.png');  line-height:\
    \ 1.5;  font-size: @(line-height)em; } \n  .section {  margin-left: 20px;  margin-right:\
    \ 20px;  color: red;  background: red url('test.png');  line-height: 1.5;  font-size:\
    \ 1.5em; }\n  ```\n\n  在代码中使用它：\n\n  ```javascript\n  postcss([ require('postcss-property-lookup')\
    \ ])\n  ```\n\n- `postcss-nested`\n\n### 安装插件\n\n- 第一步：\n\n"
- fmt: "\n## Step 2: Check your existing project for PostCSS config: `postcss.config.js`\
    \ in the project root, `postcss` section in `package.json` or `postcss` in bundle\
    \ config.\n\nIf you don’t use `PostCSS`, add it according to official docs and\
    \ set this plugin in settings.\n\n## Step 3: Add the plugin to plugins list:\n\
    \nThere are various options available:\n\n1. `bubble`: By default, plugin will\
    \ bubble only the `@media` and `@supports` at-rules. You can add custom at-rules\
    \ to list by `bubble` option: `postcss([ require('postcss-nested')({ bubble: ['phone']\
    \ }) ])`\n\n2. `unwrap`: By default, plugin will unwrap the `@font-face`, `@keyframes`,\
    \ and `@document` at-rules. You can add custom at-rules to the list by `unwrap`\
    \ option: `postcss([ require('postcss-nested')({ unwrap: ['phone'] }) ])`\n\n\
    ### preserveEmpty\n\nBy default, plugin will strip out any empty selector generated\
    \ by intermediate nesting levels. You can set `preserveEmpty` to `true` to preserve\
    \ them.\n\nIt will be compiled as:\n\n`.a { } .a .b { color: black; }`\n\nYou\
    \ can install `postcss-nested` using the command.\n\n## STYLELINT\n\nIt is a mighty,\
    \ modern CSS linter that helps to enforce consistency and avoid errors in your\
    \ stylesheets.\n\n### Installing Stylelint\n\nFirst, ensure you have `stylelint`\
    \ installed. It is an npm package which can be installed by running the following\
    \ command:\n\n```\nnpm install -g stylelint\n```\n\n### Usage\n\nAfter you have\
    \ `stylelint` installed, you will want to create a `.stylelintrc.json` file. This\
    \ is where will configure all the lint rules want `stylelint` to check for. Then\
    \ take a look at the documentation rules page for details of all the available\
    \ rules.\n\nOnce have a `.stylelintrc.json` file set up with lint rules, you can\
    \ run `stylelint` on SCSS files with the following command. This assumes that\
    \ you are in the directory where `.scss` files are located. You can update the\
    \ path accordingly.\n\nIt will look for a `.stylelintrc.json` file in the present\
    \ working directory. If any of your config file is not in the present working\
    \ directory, you can pass it along when run `stylelint` with the `config` option.\n\
    \nIf you want to use `stylelint` with npm-scripts, use the below command:\n\n\
    ```\nnpm install stylelint -D\n```\n\n## PostCSS ASSETS\n\nA PostCSS Assets is\
    \ an asset manager for CSS. It isolates stylesheets from environmental changes,\
    \ gets image sizes and inlines files.\n\nInstallation:\n\n```\nnpm install postcss-assets\
    \ --save-dev\n```\n\n### Gulp (gulp-postcss)\n\nPostCSS gulp plugin to pipe CSS\
    \ through several plugins, but parse CSS only once.\n\nInstallation of `gulp-postcss`:\n\
    \n```\nnpm install --save-dev postcss gulp-postcss\n```\n\n### Basic\n\nThe configuration\
    \ is loaded by own from `postcss.config.js` as described here, so you don’t have\
    \ to specify any options.\n\nPassing plugins directly using `gulp`:\n\n```javascript\n\
    var postcss = require('gulp-postcss'); \nvar gulp = require('gulp'); \nvar autoprefixer\
    \ = require('autoprefixer'); \nvar cssnano = require('cssnano');   \ngulp.task('css',\
    \ function () { \n    var plugins = [ \n        autoprefixer({browsers: ['last\
    \ 1 version']}), \n        cssnano() \n    ]; \n    return gulp.src('./src/*.css')\
    \ \n        .pipe(postcss(plugins)) \n        .pipe(gulp.dest('./dest')); \n});\n\
    ```\n\n### Grunt\n\nNow we will explain how to create a `Gruntfile` and install\
    \ and use `Grunt` plugins. Once you are familiar with that process, you can install\
    \ this plugin with this command:\n\n```\nnpm install grunt-postcss --save-dev\n\
    ```\n\nOnce the plugin has been installed, then may enable inside `Gruntfile`\
    \ with this line of JavaScript:\n\n```javascript\ngrunt.loadNpmTasks('grunt-postcss');\n\
    ```\n\nHow to use the plugins in the code:\n\n```javascript\nnpm install grunt-postcss\
    \ pixrem autoprefixer cssnano \ngrunt.initConfig({ \n  postcss: { \n    options:\
    \ { \n      map: true, // inline sourcemaps \n      // or \n      map: { \n  \
    \        inline: false, // save all sourcemaps as separate files... \n       \
    \   annotation: 'dist/css/maps/' // ...to the specified directory \n      }, \n\
    \      processors: [ \n        require('pixrem')(), // add fallbacks for rem units\
    \ \n        require('autoprefixer')({browsers: 'last 2 versions'}), // add vendor\
    \ prefixes \n        require('cssnano')() // minify the result \n      ] \n  \
    \  }, \n    dist: { \n      src: 'css/*.css' \n    } \n  } \n});\n```\n\n## FONT\
    \ MAGICIAN\n\nFont Magician is a PostCSS plugin that magically generates all of\
    \ your `@font-face` rules. Never write a `@font-face` rule again.\n\nHere is an\
    \ example of font magician:\n\nJust use the font and font-family properties as\
    \ if they were magic.\n\nInstallation: You can add Font Magician to your build\
    \ tool:\n\n```\nnpm install postcss postcss-font-magician --save-dev\n```\n\n\
    ## LOST GRID\n\nLostGrid is a powerful grid system built in PostCSS that works\
    \ with any preprocessor and even vanilla CSS.\n\nLost Grid is a great PostCSS\
    \ plugin that provides an impressive CSS grid system that not only works with\
    \ plain CSS but with preprocessor languages (Sass, LESS, Stylus). It uses the\
    \ `calc()` function to create beautiful grids that can be easily used without\
    \ spending much time with customization.\n\nYou can do installation by using the\
    \ below libraries:\n\n### Gulp\n\nFirst, you have to install NodeJs then install\
    \ `gulp` globally using the below command:\n\n```\nnpm install --global gulp\n\
    ```\n\nYou also install dependencies:\n\n```\nnpm install --save-dev gulp-postcss\
    \ gulp-cemaps autoprefixer lost\n```\n\ncreate `gulpfile.js` with:\n\n```javascript\n\
    var gulp = require('gulp'); \nvar postcss = require('gulp-postcss'); \nvar sourcemaps\
    \ = require('gulp-cemaps'); \nvar autoprefixer = require('autoprefixer'); \nvar\
    \ lost = require('lost'); \nvar paths = { \n  cssSource: 'src/', \n  cssDestination:\
    \ 'dist/' \n}; \ngulp.task('styles', function () { \n    return gulp.src(paths.cssSource\
    \ + '**css') \n        .pipe(sourcemaps.init()) \n        .pipe(postcss([ \n \
    \           lost(), \n            autoprefixer() \n        ])) \n        .pipe(sourcemaps.write('./'))\
    \ \n        .pipe(gulp.dest(paths.cssDestination)); \n}); \ngulp.watch(paths.cssSource\
    \ + '**css', ['styles']);\n```\n\n### Grunt\n\nFirst, you have to install NodeJs\
    \ then install `Grunt` using this command:\n\nInstall dependencies:\n\n```\nnpm\
    \ install --save-dev grunt-postcss autoprefixer lost\n```\n\ncreate `Gruntfile.js`\
    \ with:\n\n```javascript\nmodule.exports = function(grunt) { \n  grunt.initConfig({\
    \ \n    postcss: { \n      options: { \n        map: true, // inline sourcemaps\
    \ \n        // or \n        map: { \n            inline: false, // save all sourcemaps\
    \ as separate files... \n            annotation: 'dist/css/maps/' // ...to the\
    \ specified directory \n        }, \n        processors: [ \n          require('autoprefixer')(),\
    \ \n          require('lost') \n        ] \n      }, \n      dist: { \n      \
    \  src: 'css/*.css' \n      } \n  }, \n  watch: { \n    files: ['css/*.css'],\
    \ \n    tasks: ['postcss'] \n  } \n}); \ngrunt.loadNpmTasks('grunt-postcss');\
    \ \ngrunt.loadNpmTasks('autoprefixer'); \ngrunt.loadNpmTasks('grunt-contrib-watch');\
    \ \ngrunt.registerTask('default', ['watch']); \n```\n\n### Brunch\n\nFirst, you\
    \ install NodeJS then install `Brunch` using this command:\n\n```\nbrunch new\n\
    ```\n\nInstall dependencies:\n\n```\nnpm install --save postcss-brunch autoprefixer\
    \ lost\n```\n\nUpdate `brunch-config.coffee`:\n\n```coffee\nexports.config = {\
    \ \n  files: { \n    javascripts: { joinTo: 'app.js' }, \n    stylesheets: { joinTo:\
    \ 'app.css' }, \n    templates: { joinTo: 'app.js' } \n  }, \n  plugins: { \n\
    \    postcss: { \n      processors: [ \n        require('autoprefixer')(), \n\
    \        require('lost') \n      ] \n    } \n  } \n}\n```\n"
