    ### 4. `empty-cells` 属性

    `empty-cells` 属性显示或隐藏没有内容的表格单元格的边框。不间断空格被视为可见内容。


    该属性的语法如下：`empty-cells: show | hide | initial | inherit`


    描述值如下：


    1. `show`: 空单元格周围有像普通单元格一样的边框和背景。这是默认值。

    2. `hide`: 空单元格周围没有边框。


