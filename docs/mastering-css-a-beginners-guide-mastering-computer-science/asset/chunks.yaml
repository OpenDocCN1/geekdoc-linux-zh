    271.  word-wrap\n\n272.  writing-mode\n\n273.  z-index\n\n |  |\n\n## CSS LAYOUTS\
    \ (PROPERTIES)\n\nThe CSS feature is used to set the style of HTML objects. The\
    \ CSS layout consists of two parts, the name of the property and the value of\
    \ the property. Property value included between two (“”quotes).\n\nCSS style styles\
    \ are part of the HTML object. Here are a few examples: <div style = \"border:\
    \ 1px solid black; font size: 18px; \"> Style is an attribute of division tag\
    \ </div>\n\nIn this example, two CSS features are used in the div feature: border\
    \ and font size structures.\n\nThe CSS layout declaration contains the layout\
    \ name and layout value. The name of the structure comes first, then the colon,\
    \ then the value. Here a common pattern for the following CSS property-value is\
    \ given below:\n\nProperty-name: property-value\n\nIf you specify more than one\
    \ CSS property, each word – the cooked value is divided into a semicolon as follows:\n\
    \nproperty1: property-value; property2: property-value;\n\nThe final local declaration\
    \ does not have to end with a semicolon, but it makes it easy to add more CSS\
    \ features without forgetting to add that extra semicolon. There are many CSS\
    \ features that you can specify in different HTML elements. These CSS layouts\
    \ are covered in their text.\n\n## CSS RULES\n\nCSS rule is a set of one or more\
    \ CSS elements to be applied to one or more targeted HTML elements. CSS rule contains\
    \ a CSS selector and a set of CSS layouts. The CSS selector determines which HTML\
    \ elements should be targeted by the CSS rule. CSS features specify what styles\
    \ of HTML objects are intended.\n\nThis example creates a CSS rule that governs\
    \ all div features, as well as a set of CSS locations and font size for target\
    \ objects. The part of the CSS selector CSS rule is the front part {. In the above\
    \ example, it is part of the div of the CSS rule. CSS layouts are listed within\
    \ the block {...}. CSS rules must be specified within the style element or within\
    \ the external CSS file.\n\nHere is an example of CSS rule:\n\ndiv {     border:\
    \ 1px solid black;       font size: 18px; }\n\nThe following section consists\
    \ of the complete list of standard CSS properties belonging to the latest CSS3\
    \ specifications. All the properties are grouped into categories given below:\n\
    \n*   CSS animation properties: The animation property is a CSS property for animation-name,\
    \ animation-duration, animation-direction, animation-timing-function, animation-delay,\
    \ animation-iteration-count,  animation-fill-mode, and animation-play-state. Here\
    \ is the default value of the animation property:\n\nIt applies to all elements,\
    \ before and ::after (other pseudo-elements). The following table describes the\
    \ values of animation property.\n\n1.  animation-name property: The animation-name\
    \ CSS property defines the name of @keyframes defined animations that should be\
    \ applied to the selected element. The syntax of the property is given below:\
    \ animation-name:  keyframe name | none | initial | inherit\n\n2.  animation-duration\
    \ property: The animation-duration CSS property defines the number of seconds\
    \ or milliseconds animation must take to complete one cycle. The syntax of this\
    \ property is given as: animation-duration: time | initial | inherit\n\n3.  animation-timing-function\
    \ property: : The animation-timing-function CSS property specifies how a CSS animation\
    \ should progress over the duration of each cycle. The syntax of this property\
    \ is given as: animation-timing-function: linear | ease | ease-in | ease-out |\
    \ ease-in-out | cubic-bezier(n,n,n,n) | initial | inherit\n\n4.  animation-delay:\
    \ It specifies a delay before the animation will start. The animation-delay CSS\
    \ property defines when the animation will start. The value of this property can\
    \ be specified in seconds (s) or milliseconds (ms).\n\n    The syntax of this\
    \ property is given as:\n\n    animation-delay:  time | initial | inherit\n\n\
    5.  animation-iteration-count property: The animation iteration count property\
    \ defines the number of times an animation cycle should play before stopping.\n\
    \n    The syntax of this property is given as: animation-iteration-count:  number\
    \ | infinite | initial | inherit"
