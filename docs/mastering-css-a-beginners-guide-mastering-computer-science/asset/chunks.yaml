    \ the third parties packages. Second, the world of technology is constantly changing.\
    \ With the growing demand of technologies to provide the effective code product,\
    \ various companies introduce all the new technologies.\n\nTo make or look at\
    \ your website, we use HTML with CSS. Basically, CSS is used to design any page\
    \ or website.\n\nCSS makes the front end of a website clean and it also creates\
    \ a great user experience. Without CSS, websites could be less attractive to others.\
    \ In addition to layout and format, CSS is only responsible for font color and\
    \ so on.\n\n*   CSS helps to keep the informational content of a document separate.\n\
    \n*   It also helps us in various ways such as:\n\n    *   It is used to avoid\
    \ duplication.\n\n    *   It can take care of maintenance well.\n\n    *   It\
    \ is the same content with different styles for different purposes.\n\nYour website\
    \ may have thousands of pages that look similar. With CSS, you store style information\
    \ in common files that everyone can share. When a user displays a web page, the\
    \ browser loads the style along with the content of the page. When a user prints\
    \ a webpage, you can provide information about a different style that makes the\
    \ printed page easy to read.\n\nIn general, HTML is used to describe the content\
    \ of a document, not its style; you use CSS to determine its style, not its content.\
    \ Of course, there are various exceptions to the rule, and HTML also provides\
    \ some ways to specify style. For example, in HTML you can use the <b> tag to\
    \ make text bold, and in its <body> tag you can specify the background color of\
    \ the page. When you use CSS, you usually avoid using these HTML style features,\
    \ so all of your document’s styling information is in one place.\n\nCSS stands\
    \ for Cascading Style Sheets. It is a language used to stylize a web page. Also,\
    \ changing the look and layout of a web page using it is absolutely simple. You\
    \ can also control how a website appears on different screens of different devices\
    \ such as mobile phones, desktops, and tablets. You must have a thorough understanding\
    \ of style sheet language to use it properly.\n\nYou can set the font, color,\
    \ and size for an entire web page or a specific HTML element. However, a single\
    \ CSS can be redirected to multiple web pages, allowing you to change the look\
    \ of multiple pages at once. CSS is easy to learn and understand and provides\
    \ a robust command over viewing an HTML document. Often CSS is combined with markup\
    \ languages, that is, HTML or XHTML.\n\n## HOW CASCADING STYLE SHEETS WORK\n\n\
    Cascading Style Sheet has a completely different approach to a web page style\
    \ and layout. Every time an HTML document is viewed in a browser, the content\
    \ comes with style information. Basically, the HTML file contains the content\
    \ of a page and the style sheet contains information about the style of a page.\
    \ Therefore, the main purpose of Cascade Style Sheets is to allow elements to\
    \ appear in the HTML document. And these specified standards guide how content\
    \ will be executed.\n\nThere are various versions of CSS such as:\n\n*   CSS1\n\
    \n*   CSS2\n\n*   CSS3\n\nThere are various types of CSS such as:\n\n*   Embedded\
    \ CSS\n\n*   Inline CSS\n\n*   External CSS\n\n*   Import CSS (link tag)\n\n##\
    \ WHY SHOULD SOMEONE LEARN CSS?\n\n*   It is must to learn the language for web\
    \ development.\n\n*   Using it you will be able to design unique looking websites.\n\
    \n*   Gives you access to almost any item that appears on the screen.\n\n*   You\
    \ can shape any item to your liking.\n\n*   You can add effects to great looking\
    \ web pages.\n\n*   You can create animations such as moving objects or shapes\
    \ using CSS.\n\n*   Learning CSS lets you design responsive websites that fit\
    \ any device size."
