    ### blur()


    The `blur()` is used with the `filter` to apply a blurred effect to an image.
    The syntax of the `blur()` function is as follows: `blur() = blur( <length> )`


    The output of the code is given below:


    ![](images/ufig4_4.jpg)


    CSS function (`:blur()`).


    ### brightness()


    The `brightness()` function is used to adjust an image’s brightness.


    The syntax of the `brightness()` function is as follows: `brightness() = brightness(
    [ <number> | <percentage> ] )`


    Explanation: The `brightness()` function accepts a number or also percentage as
    its argument. It determines the brightness level of the image. A value of 0% in
    the image will be completely black. A value of 100% in an image will be unchanged.
    The value above 100% produces a brighter image. A number value of 0.2 has the
    same effect as the percentage value of 20%. The negative values are not allowed.
    It is used with the `filter` property to adjust the brightness of an image. The
    function applies a linear multiplier to the input image, making it appear more
    or less bright. It requires an argument to be passed to it. It determines the
    brightness level that is applied to the image. The argument can be either a %
    value or a number.


    The output of the above code is given below:


    ![](images/ufig4_5.jpg)


    CSS function (`:blur()`).


    ### calc()


    The CSS `calc()` function allows the use of calculations within CSS property values.
    The `calc()` can be used in place of other unit types when setting widths, heights,
    angles, frequencies, etc. The exact value that the browser uses will be a result
    of the calculation performed by the `calc()` function.


    The output of the above code is given below:


    ![](images/ufig4_6.jpg)


    CSS function (`:calc ()`).


    ### circle()


    The `circle()` is a basic shape value that is the part of the CSS shapes module.
    Basic shapes such as `circle()` can be used as a value for properties such as
    `shape-outside` to control the flow of content (code) around the element and `clip-path`
    to clip the element’s contents to the basic shape. It means that you have text
    flowing around the element in the shape of a circle, has an image clipped to the
    shape of a circle.


    The syntax of the `circle()` function is as follows: `circle() = circle( [<shape-radius>]?
    [at <position>]? )`


    ### How to Position the Circle


    You can specify a position for the circle by various radius argument with a valid
    CSS position. It specifies the circle’s center. It just separates the radius and
    the position like this: `shape-outside: circle(100px 50px);`


