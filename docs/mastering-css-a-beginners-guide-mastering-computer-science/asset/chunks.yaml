    # 关于本系列


    `Mastering Computer Science`（精通计算机科学）涵盖了广泛的主题，涉及编程语言以及现代技术框架。该系列特别关注初级内容，并以易于理解的方式呈现，包括：


    *   清晰的文字，涵盖按相关性排序的各种主题，

    *   特别关注实践练习，包含大量的代码示例和程序，

    *   引导式的编程方法，为绝对初学者提供分步演示的教程，

    * 强调技能的现实实用性，从而删减冗余和很少使用的概念，转而专注于行业通用的编码范式，

    *   广泛的参考和资源，帮助初级和中级开发者充分利用这些书的价值。


    `Mastering Computer Science` 系列书籍从核心概念开始，然后迅速过渡到行业标准的编码实践，帮助学习者尽可能在短时间内获得高效关键的技能。这些书籍假设读者没有任何编程基础，因此即使是完全的新手程序员也能从本系列中受益。


    `Mastering Computer Science` 系列由 Sufyan bin Uzayr 编辑，他是一位在计算领域拥有十年经验的作家和教育者。


