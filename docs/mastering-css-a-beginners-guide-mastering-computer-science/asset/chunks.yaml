    ## CSS MARGIN PROPERTIES


    The `margin` property sets the margin on all four sides of the element. It is
    a shorthand property for `margin-top`, `margin-right`, `margin-bottom`, and `margin-left`
    property.


    The syntax of this property is given as: `margin:  [ length | percentage | auto
    ] 1 to 4 values | initial | inherit`


    This notation can take one, two, three, or four whitespace-separated values.


    1. If set one value, then `margin` applies to all four sides.

    2. If you set two values, then first value applies to the top and bottom, and
    the second value applies to the right and left side.

    3. If set three values, then values apply to the top, horizontal (i.e., right
    and left) bottom side.

    4. If set four values, then to the top, right, bottom, left side in the same order.


    Instead of `margin`, you should use other various `margin-top`, `margin-right`,
    `margin-bottom`, and `margin-left`.


