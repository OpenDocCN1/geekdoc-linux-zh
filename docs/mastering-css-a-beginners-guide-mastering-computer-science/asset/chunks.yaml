    ## 媒体类型


    以下列出了用于目标打印机、设备、计算机屏幕等不同类型设备的各种媒体类型。


    - `all`: 用于所有媒体类型设备。

    - `aural`: 用于语音和声音合成器。

    - `braille`: 用于触觉反馈设备。

    - `embossed`: 用于凸起式盲文打印机。

    - `handheld`: 用于小型或手持设备设备，如手机手机或 PDA 的小屏设备。

    - `print`: 用于打印机。

    - `projection`: 用于投影演示，例如投影仪。

    - `screen`: 主要用于彩色计算机屏幕。

    - `tty`: 用于使用固定间距字符网格的媒体，如电打字机、终端和显示能力有限的便携设备。

    - `tv`: 用于低分辨率、彩色、具有有限滚动能力的屏幕并带有音频的电视类型设备。


    ## 媒体查询与响应式网页设计


    媒体查询允许在不改变标记语言的情况下，针对特定设备范围（如手机、平板电脑、桌面电脑等）自定义网页页的呈现方式。媒体查询包含媒体类型以及零或多个表达式，例如某些媒体特征的类型和条件，如设备宽度或屏幕分辨率。这里有一个针对标准设备的典型媒体查询简单示例。


    ## 媒体查询


    响应式设计之所以出现，是因为媒体查询。媒体查询第 3 定义是 2009 年的候选建议（Candidate Recommendations），这意味着它被认为已准备好在浏览器中实现。媒体查询允许我们创建一系列测试，并通过选择自定义页面样式以满足用户需求来应用
    CSS。


    例如，以下媒体查询问题用于检查当前网页是否作为屏幕媒体显示（因此它不是打印文档），并且查看区域宽度是否为 800 像素。只有当这两个条件都满足时，CSS 选择器
    `.container` 才会使用。


    ## 你可能知道的优点


    让我们学习更多关于 CSS 的优点，例如：


    1. CSS 的主要优点之一是它对数字营销非常有用，因为你网页的每一次推广都提供了一个商业机会。因此，借助 CSS 技术使用带有代码公式的更多内容，最终对数字营销和你的业务更有利。

    2. CSS 通过对你的网站进行微小更改，让网站的其他部分也看到类似的变化。网站越大，在转换方面涉及的内容和布局，CSS 就能为你节省大量时间。它还会检查并验证每个页面是否符合
    CSS 优点。

    3. W3C 的目标是让整个网站能够像普通用户使用那样供残障用户访问。CSS 首先通过创建布局和文档来实现访问，使得任何屏幕阅读器都能准确地读取内容。这对于听障用户有用，因为他们依赖屏幕阅读器运行
    Web 应用。

    4. 为了让网站正常工作，它必须具有快速下载时间。如今，人们通常只需等待几秒钟即可加载。因此，确保快速至关重要。对于希望确保网站信息快速流畅的公司来说，CSS
    成为他们成功的关键。

    5. CSS 由于维护时间短，非常易于维护。这是因为单行代码转换会影响整个网页。此外，如果需要升级，只需花一点精力即可减少对网页代码的更改。

    6. CSS 赋能开发者，使其确保样式特征在每几个网页上一致应用。

    7. 由于加载速度快，CSS 在 Web 开发过程中节省了大量的时间和精力。在这里，一点时间就能确保设计师的良好性能。


    ## CSS 的缺点


    使用 CSS 时会有一些不足。在设计网站时，必须意识到这些糟糕的情况，以便发现并处理它们。


    1. CSS 层级过多导致的困惑：初学者在这方面风险很高。他们在选择阅读 CSS 时可能会感到困惑，因为有许多 CSS 层级，如 CSS2、CSS3 等。

    2. 浏览器问题：不同浏览器的工作方式不同。因此，你应该检查 CSS 代码对网站的更改是否对所有浏览器都可见。

    3. 安全问题：在如今这个技术和数据驱动的世界中，安全性至关重要。CSS 的缺点之一是它的安全性有限。

    4. 额外的开发工作：设计服务要求在所有不同浏览器中考虑并测试所有 CSS 代码以确保兼容性。由于在不同浏览器中测试开发者兼容性，他们的工作量正在增加。


    总而言之，我们可以说如果你喜欢 Web 开发，请尝试学习 HTML 和 CSS。对于设备兼容性，请阅读 Bootstrap 框架。虽然你可能会看到 CSS
    的一些缺点，但许多优点是相反的，并能确保你的 Web 开发过程顺畅高效。


    ## 章节总结


    在这里我们涵盖了 CSS 的所有基本概念，每个人都可以利用它们让自己的页面具有吸引力。使用 CSS 最重要的事情就是实践，一旦你开始练习，就能很快入门。在接下来的章节中，你将学习让你的工作变得非常简单的
    CSS 属性。


    # 第 2 章 CSS 属性


    DOI: [10.1201/9781003358060-2](https://doi.org/10.1201/9781003358060-2)


    在上一章中，我们学习了 CSS 的基础知识、历史、类型、版本和其他属性，例如如何在类、id 上添加 CSS、注释代码、基础 HTML 以及将 HTML 与
    CSS 链接。现在我们将讨论 CSS 的各种重要属性，如显示、定位、边框、网格、flex 高、宽、颜色、字体等。


    你通过 CSS 属性对 HTML 元素进行样式。不同的 HTML 元素可以设置不同的 CSS 布局。CSS 布局可以组织成 CSS 规则。CSS 规则将一组布局绑定，并将所有元素应用于匹配
    CSS 规则的 HTML 元素。本文将更详细地包含 CSS 布局和 CSS 规则。


    在 CSS 中，有各种属性；下面你将获得所有属性列表，然后我们将这些属性分为不同的部分。


