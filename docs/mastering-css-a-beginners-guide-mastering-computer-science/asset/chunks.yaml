    \ The purpose of developing HTML was to understand the structure of any text:\
    \ title, body, content, or categories.\n\nSo, basically, HTML provides a structured\
    \ format to display the content of web pages. It is very simple and easy to understand.\
    \ In the early nineties, it was developed by Tim Berners-Lee and later went through\
    \ many changes and modifications. HTML `5` is the latest version of Html.\n\n\
    You know that HTML is a simple language that can use many tags to format content.\
    \ All tags are enclosed within angular brackets `<tagname>`. With the exception\
    \ of a few tags, most tags start with angular tags and end with corresponding\
    \ angular tags.\n\n`<! DocType Html>` defines the document type and version of\
    \ Html. The `Html` code starts just after the `<html>` angular marker and ends\
    \ with `</html>` not seen in the screenshot above.\n\nIt usually has two major\
    \ parts, namely the head and the body. Each category has its set of requirements\
    \ related to requirements. You will get various sections in HTML structure. Let’s\
    \ discuss each.\n\n## Head Section\n\nThe `header` tag represents a web document\
    \ header that you can tag `<head>` and `<link>` with. It starts with `<head>`\
    \ and ends with `</head>`. It has parts of the title inside. For example, `<title>`\
    \ This will be your webpage title. `</li>`.\n\n## Body Section\n\nIt represents\
    \ the body of a web document that usually contains titles, text, and sections.\
    \ Topics start with `<title>` and end with `</title>`. Among these tags, the content\
    \ can be labeled as “this is the first topic.”\n\nThe paragraph will start with\
    \ `<p>` and end with `</p>`. The content of the section should be written between\
    \ these angular characters. The basic Html code shown below in the overview section\
    \ is used to create a simple Html page.\n\nThere are various elements we can add\
    \ to our HTML code; let’s take a look.\n\n*   HTML headings are elements defined\
    \ by tags `<h1>` to `<h6>` where `<h1>` defines the important tag and `<h6>` defines\
    \ the less important tag. The HTML section is an HTML element that will be defined\
    \ using the `<p>` tag.\n*   HTML images are a feature of HTML and are defined\
    \ by the `<img>` tag, and need to specify attributes such as image `src`, `alt`\
    \ means other text, `width`, and `height`.\n*   HTML lists are elements and are\
    \ defined using `<ul>` or `<ol>` tags where `<ul>` is a random list and `<ol>`\
    \ has an ordered list.\n*   The HTML table is part of the HTML and can be defined\
    \ using tag `<table>` and tag lines `<tr>` and tag cells `<td>`.\n*   HTML links\
    \ are elements, and can be defined using the `<a>` tag and sample code below:\n\
    \    *   The HTML attribute `style` can be used with a combination of any elements\
    \ such as `<p>`.\n    *   In HTML, we use the `lang` attribute, we can say the\
    \ language of a document using the `<html>` tag and the language defined using\
    \ the `lang` attribute.\n    *   In HTML, we can use the formatting elements to\
    \ format the document and we can define special text features that have a special\
    \ meaning. HTML elements like `<b>` bold, `<i>` by italics.\n    *   In HTML,\
    \ we can highlight specific text in a document using the `<mark>` feature to highlight\
    \ text included in the `<mark>` element.\n    *   In HTML, we can define a text\
    \ as the text above using the `<sup>` element in the HTML document so that the\
    \ text embedded in the `<sup>` element becomes larger.\n\n## STARTING WITH A SPECIFIC\
    \ HTML\n\nHTML and CSS are two methods of tags (code), with their own unique syntax.\
    \ There is a difference between the two. You can think of HTML as a page layout,\
    \ while CSS gives HTML its own style.\n\n## LINKING YOUR HTML AND CSS FILES\n\n\
    Before we can write CSS, we have to go back to HTML. You need to write a new line\
    \ to link the HTML file and CSS file together. So, open the HTML file and add\
    \ the provided line `<link href =\"style.css \"rel =\" stylesheet \"type =\" text\
    \ / CSS \"</link>`. Your file code looks like this,\n\n![](images/ufig1_1.jpg)\n\
    \nExample of simple CSS.\n\nAbove line of code links a new CSS file to your HTML\
    \ file. Let’s split it: the `href` attribute specifies the link associated with\
    \ the CSS file. We’ll get to the links later, for now, just make sure that `style.css`\
    \ file is in the same folder as `index.html`. The `rel` attribute tells your browser\
    \ that this is a style sheet. The attribute `type` tells the browser that the\
    \ linked file should be translated as CSS syntax.\n"
