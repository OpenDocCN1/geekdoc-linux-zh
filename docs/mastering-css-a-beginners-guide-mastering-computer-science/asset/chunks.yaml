    ### 2. `border-bottom` 属性：`border-bottom` CSS 属性设置元素底部边框的宽度、样式和颜色。这是一个用于同时设置单个底部边框属性的属性，即
    `border-bottom-width`、`border-bottom-style` 和 `border-bottom-color`。该属性的语法如下：`border-bottom:
    [ border-bottom-width border-bottom-style border-bottom-color ] | initial | inherit`


    代码的输出如下：


    ![](img/ufig2_14.jpg)


    CSS 边框属性 – 左、下、右、上。


    ### 3. `border-bottom-color` 属性：`border-bottom-color` 属性单独设置元素底部边框的颜色。然而，在其他情况下，使用
    `border color` 或 `border bottom` 等简属性更加方便且更优。该属性的语法如下：`border-bottom-color: color
    | transparent | inherit`


    ### 4. `border-bottom-left-radius` 属性：`border-bottom-left-radius` 属性设置元素边框框“左下”角的圆角形状。


    代码的输出如下：


    ![](img/ufig2_15.jpg)


    CSS 边框底部左属性 – 左、右。


    ### 5. `border-bottom-style` 属性：`border-bottom-style` 属性单独设置元素底部边框的样式。然而，在其他情况下，使用
    `border style` 或 `border bottom` 等简属性更加方便且更优。


    该属性的语法如下：`border-bottom-style: none | hidden | dashed | dotted | solid | double
    | groove | ridge | inset | outset | initial | inherit`


    代码的输出如下：


