    ### 如何选取颜色


    HSL（Hue Saturation Lightness）是基于色调的 RGB 色彩空间的一种表示。以下是选取颜色的几种步骤/方法：


    1. 调整色调

    2. 调整饱和度

    3. 调整亮度


    代码的输出如下：


    ![](img/ufig4_18.jpg)


    CSS 函数 (HSL）。


    ## hsla()


    `hsla()` 函数可以在使用 CSS 时提供颜色值。它允许通过指定颜色的色调、饱和度和亮度分量来指定该值。HSL（代表 Hue Saturation Lightness）是计算机图形
    RGB 色彩空间的一种基于色调的表示。


    HSL 模型被认为比 RGB 模型更直观。HSL 模型允许选择基础色调，然后根据需要调整其饱和度和亮度。它接受 HSLA 值作为参数。HSLA 值以逗号分隔的四个值提供，分别提供色调、饱和度和亮度分量，第四个值是透明度（alpha）。


    这里有一个显示蓝色的示例：`hsla(240, 100%, 50%, 0.5)`


    代码的输出如下：


    ![](img/ufig4_19.jpg)


    CSS 函数 (hsla）。


    ## hue-rotate()


    使用 `hue-rotate()` 对图像应用色调旋转。CSS `hue-rotate()` 与 `filter` 属性一起用于对图像进行旋转。`hue-rotate()`
    需要一个参数来告知旋转多少。


    `hue-rotate()` 函数的语法如下：`hue-rotate() = hue-rotate( <angle> | <zero> ] )`


    ### 色调旋转如何工作


    HSL（Hue Saturation Lightness）是基于色调的 RGB 色彩的一种表示。HSL 模型被认为比 RGB 模型更直观，因为 HSL 模型允许选择基础色调，然后根据需要调整其饱和度和亮度。


    代码的输出如下：


    ![](img/ufig4_20.jpg)


    CSS 函数 (hue-rotate）。


    ## inset()


    `inset()` 是一个 CSS 基础形状值，是 CSS 形状模块的一部分。像 `inset()` 这样的形状可以作为 `shape-outside` 等属性的值，用于控制内容环绕元素的流动，以及使用
    `clip-path` 将元素的内容裁剪为基础形状。


    代码的输出如下：


    ![](img/ufig4_21.jpg)


    CSS 函数 (inset）。


    ## linear-gradient()


    `linear-gradient()` 函数允许 CSS 创建线性渐变。CSS 渐变允许为元素应用多种背景颜色并从一种颜色过渡到另一种颜色。


    要创建线性渐变，可以将 `linear-gradient()` 作为任何接受图像属性的值（例如 `background-image`、`background`
    或 `border-image` 属性）。线性渐变使用这些属性来构建指定的图像。


    这些沿直线运行的渐变。线性渐变可以指向任何方向，如向上、向下、侧向、50 度、73 度或你喜欢的任何角度。


    这些渐变通过建立一条称为渐变线的轴来创建。颜色停止点放置在该变线上，以创建每种颜色之间的渐变。


    ### 如何设置渐变角度


    你也可以设置角度使其沿着该角度运行。你可以通过角度值（例如 `45deg`、`90deg` 和 `180deg`）或指定角度的关键字（如 `to top`、`to
    bottom`、`to top left` 等）来指定。

