- fmt: "\n## `matrix3d()`\n\nThe CSS `matrix3d()` can be used with CSS transforms\
    \ to style elements in a three-dimensional space. The `matrix3d()` is an alternative\
    \ to the three-dimensional transform functions `rotate3d()`, `rotateX()`, `rotateY()`,\
    \ `rotateZ()`, `translate3d()`, `translateZ()`, `scale3d()`, `scaleZ()`, and `perspective()`.\n\
    \nThe output of the code is given below:\n\n![](images/ufig4_24.jpg)\n\nCSS function-matrix3d()`.\n\
    \n## `opacity()`\n\nUse the `opacity()` function to make an image partially or\
    \ completely transparent. The `opacity()` is used with the filter property to\
    \ apply transparency to the samples in an image. The `opacity()` requires an argument\
    \ to be passed to it. Also, it determines the proportion of the transparency that’s\
    \ applied to the image. The argument can be either a value or a number.\n\nThe\
    \ output of the code is given below:\n\n![](images/ufig4_25.jpg)\n\nCSS function-opacity()`.\n\
    \n## `perspective()`\n\nThe `perspective()` function defines the distance between\
    \ the z=0 plane and the user in order to give the 3D-positioned element some perspective.\n\
    \nThe `perspective()` function works like this: `perspective(l)`\n\nThe `l` parameter\
    \ specifies the distance from the ones to the z=0 plane. The argument is also\
    \ specified as a length value (e.g., `1px`, `1vw`, etc.). The greater the length,\
    \ the less pronounced the “3D effect” will be.\n\nThe output of the code is given\
    \ below:\n\n![](images/ufig4_26.jpg)\n\nCSS function ( `perspective()` ).\n\n\
    ## `radial-gradient()`\n\nThe `radial-gradient()` function allows to create a\
    \ radial gradient using CSS.\n\nCSS gradients allow to apply multiple background\
    \ colors to an element that blend from one color to the next.\n\nThe output of\
    \ the code is given below:\n\n![](images/ufig4_27.jpg)\n\nCSS Function (`radial-gradient()`\
    \ ( ) )\n\n## `repeating-linear-gradient()`\n\nThe CSS `repeating-linear-gradient()`\
    \ allows to create a linear gradient that repeats over and over again infinitely\
    \ in both directions. The gradients allow to apply multiple background colors\
    \ to an element that blend from one color to the next. These gradients are linear\
    \ gradients where the color stops are repeated infinitely in both directions.\
    \ It is repeating linear gradients work the same way that (are non-repeating)\
    \ linear gradients work.\n\nSyntax: The `repeating-linear-gradient()` function\
    \ accepts the following values:\n\n* `angle`: It specifies an angle for the direction\
    \ of the gradient. For example, `45deg`.\n\nThe following keywords specify to\
    \ point the gradient-line given below:\n\n* `to top`\n* `to right`\n* `to bottom`\n\
    * `to left`\n\nThe following keywords specify to point the gradient-line given\
    \ below:\n\n* `to top left`\n* `to top right`\n* `to bottom right`\n* `to bottom\
    \ left`\n* `color-stop`\n\nThe output of the code is given below:\n\n![](images/ufig4_28.jpg)\n\
    \nCSS function (`repeating-linear -gradient()` ( ) ).\n\n## `repeating-radial-gradient()`\n\
    \nThe CSS `repeating-radial-gradient()` allows to create a radial gradient that\
    \ repeats over and over again. CSS gradients allow you to apply multiple bg colors\
    \ to an element that blend from single color to the next. Repeating radial gradients\
    \ are gradients where the color stops are repeated infinitely. Radial gradients\
    \ have a circular or elliptical shape. When creating a radial gradient, indicate\
    \ the center of the gradient as well as the size and shape.\n\n**Syntax:** This\
    \ function uses the same syntax as the `radial-gradient()` function, which is\
    \ as follows: `<radial-gradient> = radial-gradient( [ [ <shape> || <size> ] [\
    \ at <position> ]?, | at <position>,]? <color-stop> [, <color-stop> ]+)`\n\nThe\
    \ `repeating-radial-gradient()` function accepts the following values:\n\n* `shape`:\
    \ It specifies the shape of the gradient. It can be either `circle` or `ellipse`.\n\
    * `size`: It specifies the size of the ending shape. The values are given below:\n\
    \    * `closest side`\n    * `farthest side`\n    * `closest corner`\n    * `farthest\
    \ corner`\n    * `length` (for circles)\n    * `[length | percentage]` (for ellipses)\n\
    * `position`: it specifies where the gradient should be located. The values are\
    \ given below:\n    * `top`\n    * `right`\n    * `bottom`\n    * `left`\n   \
    \ * `center`\n\nThe output of the code is given below:\n\n![](images/ufig4_29.jpg)\n\
    \nCSS function (`repeating-radial -gradient()` ).\n\n## `rgb()`\n\nThe `rgb()`\
    \ function can be used to provide a value when using CSS. It allows to specify\
    \ an RGB color value by specifying the red, green, and blue channels directly.\n\
    \nRGB (stands for Red, Green, Blue) is a color model in which red, green, and\
    \ blue light can be added together to reproduce a color.\n\nThe `RGB()` accepts\
    \ the RGB value as a parameter. The `RGB` function is provided as comma-separated\
    \ three values. It provides red, green, and blue hues, respectively.\n\nEach of\
    \ the three values can be provided as an integer or as a percentage.\n\nWe can\
    \ use the property on any element.\n\nThe output of the code is given below:\n\
    \n![](images/ufig4_30.jpg)\n\nCSS function (`RGB()` ( ).\n\n## `rotate()`\n\n\
    The CSS `rotate()` is used to rotate elements in two-dimensional space. The `rotate()`\
    \ rotates an element based on the angle that you provide as an argument. You can\
    \ also provide the angle using any valid CSS angle value.\n\nThere are various\
    \ properties used in `rotate` such as:\n\n1. Degrees\n2. Gradians\n3. Turns\n\n\
    The output of the code is given below:\n\n![](images/ufig4_31.jpg)\n\nCSS function\
    \ (`rotate()` ( ).\n\n## `rotate3d()`\n\nThe `rotate3d()` function is used to\
    \ rotate elements in three-dimensional space. The `rotate3d()` function rotates\
    \ the element along the x, y, and z axes using the angle provided as an argument.\n\
    \nThe syntax of the `rotate3d()` function is as follows: `rotate3d() = rotate3d(\
    \ <number>, <number>, <number>, <angle> )`.\n\nThe first three parameters describe\
    \ the [x, y, z] direction vectors. The fourth parameter specifies the angle to\
    \ be used. It works like this:\n\n`rotate3d(x, y, z, a)`\n\n* `x`: It describes\
    \ the x-coordinate of the vector denoting the axis of rotation.\n* `y`: It describes\
    \ the y-coordinate of the vector denoting the axis of rotation.\n* `z`: It describes\
    \ the z-coordinate of the vector denoting the axis of rotation.\n* `a`: It represents\
    \ the angle of the rotation. A positive results in a clockwise rotation, and a\
    \ negative results in a counter-clockwise rotation.\n* `deg`: It represents as\
    \ degrees. There are 360 degrees of angle in a full circle.\n* `grad`: It is gradians,\
    \ also known as “gons” or “grades.” There are 400 gradians in a whole circle.\n\
    * `rad`: It is radians. There are 2Ï€ radians in a circle.\n* `turn`: It is turns.\
    \ There is one turn in a circle.\n\nThe output of the code is given below:\n\n\
    ![](images/ufig4_32.jpg)\n\nCSS function (`rotate3d()` () ).\n\n## `rotateX()`\n\
    \nThe CSS `rotateX()` is used to rotate elements around the x-axis in three-dimensional\
    \ space. The `rotateX()` is used in 3D-transforms. It’s used with the transform\
    \ property to rotate an element around the x-axis. It can be used in other rotation\
    \ functions such as `rotateY()`, `rotateZ()` to rotate the element around the\
    \ y and z axes if required.\n\nThe syntax of the `rotateX()` function is as follows:\
    \ `rotateX() = rotateX( <angle> )`.\n\nThe angle can be represented with the following\
    \ unit:\n\n* `deg`\n* `grad`\n* `rad`\n* `turn`\n\n## `rotateY()`\n\nThe CSS `rotateY()`\
    \ is used to rotate elements around the x-axis in three-dimensional space. The\
    \ `rotateY()` function is used in 3D-transforms. It is used with the transform\
    \ property to rotate an element around the x-axis.\n\nThe syntax of the `rotateY()`\
    \ function is as follows: `rotateY() = rotateY( <angle> )`.\n\nThe angle can be\
    \ represented with any of the following identifiers:\n\n* `deg`\n* `grad`\n* `rad`\n\
    * `turn`\n\n## `rotateZ()`\n\nThe CSS `rotateZX()` function is used to rotate\
    \ elements around the x-axis in three-dimensional space. The `rotateZ()` is used\
    \ in 3D-transforms. It’s used with the transform property to rotate an element\
    \ around the y-axis.\n"
