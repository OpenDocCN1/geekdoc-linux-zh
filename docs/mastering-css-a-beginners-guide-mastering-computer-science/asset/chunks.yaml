  trans: "\n\nPostCSS 将将你现有的 CSS 文件转换为 JavaScript 可读的数据，然后 JavaScript 插件将进行修改，最后由\
    \ PostCSS 返回原始文件的修改版本。\n\n## 各种基于 PostCSS 的 CSS 插件\n\n市场上有多种可用插件，如下：\n\n1. Autoprefixer\n\
    2. CSSnext\n3. CSSNano\n4. PreCSS\n5. StyleLint\n6. PostCSS Assets\n7. Font Magician\n\
    8. Lost Grid\n9. PostCSS\n10. PostCSS-modules\n\n## AUTOPREFIXER\n\nAutoprefixer\
    \ 根据最新的浏览器流行度数据，并自动为你应用前缀。你可以尝试 Autoprefixer 的交互式演示。\n\n你可以像下面一样编写任何不需要厂商前缀的 CSS\
    \ 规则：\n\n```css\n.container {    box-shadow: 0 0 10px #cecece;    transition:\
    \ all .5s;  }\np{ color: red; } \n.section a{ display: flex; }\n```\n\n### 编写纯\
    \ CSS\n\n使用 `Autoprefixer` 非常简单，你只需要忘记厂商前缀，并根据最新的 W3C 规范编写普通的 CSS。你不需要特殊的语言（如\
    \ Sass、Less），也不需要记住何时必须使用 mixins。\n\n`Autoprefixer` 支持选择器（如 `:fullscreen` 和 `::selection`）、单位函数（`calc()`）、at-rules（`@support`\
    \ 和 `@keyframes`）以及属性。\n\n它是一个后处理器，你可以配合 Sass、Stylus 或 LESS 等预处理器一起使用。\n\n只需按照最新的\
    \ W3C 规范编写普通 CSS，`Autoprefixer` 就会为旧浏览器生成代码。如果 CSS 未经压缩，`Autoprefixer` 会更改 CSS\
    \ 缩进以创建一个良好的的前缀级联结构。\n\n使用 `Autoprefixer` 的输出如下（你可以在线通过 [`tools.webdevpuneet.com/css-autoprefixer/`](https://tools.webdevpuneet.com/css-autoprefixer/)\
    \ 查看 Autoprefixer 的代码）：\n\n```css\n/* * Prefixed by: * PostCSS: v7.0.29, * Autoprefixer:\
    \ v9.7.6 * Browsers: last 4 version */   .container {    -webkit-box-shadow: 0\
    \ 0 10px #cecece;                box-shadow: 0 0 10px #cecece;    -webkit-transition:\
    \ all .5s;    -o-transition: all .5s;    transition: all .5s;  } \np{ color: red;\
    \ } \n.section a{ display: -webkit-box; display: -ms-flexbox; display: flex; }\n\
    ```\n\n问题在于，某些 CSS 属性在不同浏览器中的显示方式不同，而你希望每个网站访问者都能获得预测且准确的体验。对于较旧、更成熟的属性（如 border\
    \ 或 border-radius），不需要担心；它们已经标准化并能跨浏览器工作。但像 grid 或 flexbox 这样的新功能并没有那么简单。\n\n\
    制作浏览器的厂商（如 Google 和 Mozilla）不想等到酷炫的新事物被标准化之后才实现它们。相反，他们创建了自己的版本，并添加一个前缀将其与其他浏览器的实现区分开来。新属性将会在标准化并在所有浏览器中同样工作，从而消除对前缀的需要。在此之前，你必须在代码中使用厂商前缀。\n\
    \n“Autoprefixer”是一个插件，可以让我们从单调的 -webkit- 和 -moz- 中解救出来。它的功能顾如其名：它会自动为你的 CSS 添加前缀。你所做的只是提供一个\
    \ CSS 表，它将读取它并在必要时添加厂商前缀。\n\n### 在你的项目文件夹中安装 Autoprefixer\n\n在 VS code 中打开终端并使用\
    \ `npm` 安装它，以及 `postcss` 及其配套工具 `postcss-cli`（后者是你运行 `Autoprefixer` 的命令行工具）。该过程与安装\
    \ Sass 相同，只是你一次性安装三个包。你可以根据需要一次性安装多个包，每个包之间用空格隔开：\n\n一旦 `npm` 下载并安装了这些包，需要回到 `package.json`\
    \ 并为 `npm` 添加一个运行脚本，就像你安装 Sass 时一样。在 \"sass\" 脚本之后添加一个名为“prefix”的新脚本：\n\n```json\n\
    {\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"abc\"\
    ,\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
    \ -w --style compressed\",\n    \"prefix\": \"\"\n  },\n  \"author\": \"\",\n\
    \  \"license\": \"ISC\",\n}\n```\n\n在脚本内部，需要告诉 `npm` 使用你刚刚安装的 `postcss` 包，以及在哪里找到你编译后的\
    \ CSS 文件：\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"\
    description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\"\
    : \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\",\n  \
    \  \"prefix\": \"postcss ./public/css/style.css\"\n  },\n  \"author\": \"\",\n\
    \  \"license\": \"ISC\",\n}\n```\n\n之后，你需要指示 `npm` 使用哪个包以及在哪里找到 CSS 文件，通过实现 `–use`\
    \ 标志后接 `Autoprefixer` 来使用它，如下所示：\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\"\
    ,\n    \"prefix\": \"postcss ./public/css/style.css --use autoprefixer\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\n最后，你需要指示它将新的、带前缀的 CSS\
    \ 表放在哪里，如下所示：\n\n```json\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n\
    \  \"description\": \"abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n  \
    \  \"sass\": \"sass ./sass/main.scss:./public/css/style.css -w --style compressed\"\
    ,\n    \"prefix\": \"postcss ./public/css/style.css --use autoprefixer -d ./public/css/prefixed/\"\
    \n  },\n  \"author\": \"\",\n  \"license\": \"ISC\",\n}\n```\n\n现在你的前缀脚本就完成了。\n\
    \n添加一个名为 `browserslist` 的新键，如下所示：\n\n```json\n{\n  \"browserslist\": \"\"\n}\n\
    ```\n\n然后给 `browserslist` 赋值为最后四个版本：\n\n```json\n{\n  \"name\": \"joeblow\",\n\
    \  \"version\": \"1.0.0\",\n  \"description\": \"Joe Blow’s web portfolio\",\n\
    \  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:./public/css/style.css\
    \ -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css --use\
    \ autoprefixer -d ./public/css/prefixed/\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\",\n  \"browserslist\": \"last 4 versions\"\n}\n```\n\n现在你准备好为 CSS 自动添加前缀了！进入终端并运行\
    \ `prefix` 脚本：\n\n```bash\n$ npm run prefix\n```\n\n查看你 CSS 文件中新的带前缀的 CSS，会添加一个新块：\n\
    \n```css\n.section {\n  background: #15DEA5;\n  height: 10rem;\n  display: -webkit-box;\n\
    \  display: -ms-flexbox;\n  display: flex;\n  -webkit-box-align: center;\n  -ms-flex-align:\
    \ center;\n  align-items: center;\n  -ms-flex-wrap: wrap;\n  flex-wrap: wrap;\n\
    \  width: 100%;\n}\n```\n\n现在我们的网站将在所有兼容浏览器上正常且统一地显示。\n\n### 它在何时运行？\n\n`Autoprefixer`\
    \ 是处理 CSS 时最后运行的。因此，如果你使用 Sass、LESS 或 Stylus，它们会先处理，然后是 `Autoprefixer`。如果你愿意，仍然可以自由使用预处理器插件（例如\
    \ Compass、LESHat 等）来添加前缀，但我认为 `Autoprefixer` 更简单、效果更好，而且你不需要两者都用。\n\n### Autoprefixer\
    \ 和 PrefixFree 有什么区别\n\nPrefixFree 是一个客户端 JavaScript 库。它作为额外的请求包含在你的页面中。它运行，寻找能找到的所有\
    \ CSS，计算需要哪些前缀，并将新的 CSS 注入页面中。\n\n*   **缺点**：额外的请求、未前缀样式闪烁（flash-of-unprefixed-styles）、无法缓存、某些无法处理的样式（例如\
    \ filter）。\n*   **优点**：CSS 体积更小、只注入当前浏览器需要的前缀。\n\n`oprefixer` 在服务器端处理你的 CSS。至少我们是这么这么的。\n\
    \n*   **缺点**：CSS 体积稍大（但比“直接添加所有前缀”要小）。\n*   **优点**：前缀完美匹配你支持的内容、最终 CSS 可以缓存、处理棘手的回退方案（例如\
    \ flexbox）。\n\n"
- fmt: "\n`cssnext` lets you use the future of CSS today. You can use features that\
    \ are not supported in all browsers, such as CSS variables and CSS color functions.\
    \ `cssnext` transforms your styles to work in all browsers. In other words, `cssnext`\
    \ allows to write styles with real CSS syntax instead of another preprocessor\
    \ syntax. `cssnext` will automatically add vendor prefixes to your styles, so\
    \ you dont have to use the the prefixes yourself when writing CSS.\n\nTo give\
    \ you an example, let’s say you have the following CSS styles:\n\n```css\n:root\
    \ {  --text: pink;  --bg-color: #FFEC31;  --flex-center: {    display: flex; \
    \   margin: auto;  } } \n  .box {  background-color: var(--bg-color);  color:\
    \ color(hotpink whiteness(25%));  @apply(--flex-center); } \n  .warn {  @apply(--flex-center);\
    \ }\n```\n\n`cssnext` will transform the styles into this:\n\n```css\n.box { \
    \ background-color: #F9EC31;  color: rgb(255, 64, 159);  display: -webkit-box;\
    \  display: -ms-flexbox;  display: flex;  margin: auto; } \n  .warn {  display:\
    \ -webkit-box;  display: -ms-flexbox;  display: flex;  margin: auto; }\n```\n\n\
    This plugin is the Babel of CSS, it allows you to use modern CSS features and\
    \ at the same time takes care of translating them into CSS that is more digestible\
    \ for older browsers:\n\n- adds prefixes using `Autoprefixer` (so if you use this\
    \ you don’t need to use `Autoprefixer` directly).\n- allows you to use CSS variables.\n\
    - allows you to use nesting, like in Sass.\n\n## CSSnano\n\n`cssnano` minifies\
    \ and compresses your CSS. It removes whitespace, eliminates duplicate rules,\
    \ outdated vendor prefixes, comments, and performs a lot of other optimizations.\
    \ Both `cssnext` and `cssnano` can be configured to work according to specific\
    \ needs.\n\n### Installing PostCSS, the PostCSS-CLI, cssnext, and cssnano\n\n\
    Using `npm`:\n\n```bash\n$ npm install --save-dev postcss postcss-cli postcss-cssnext\
    \ cssnano\n```\n\nOr through `Yarn` command:\n\n```bash\n$ yarn add postcss postcss-cli\
    \ postcss-cssnext cssnano --dev\n```\n\n### Using the PostCSS-CLI\n\nYou use the\
    \ `PostCSS` command line (`cmd`) interface by giving the input, output files,\
    \ and PostCSS plugin(s) to use. It specifies the plugins with the `-- use` flag,\
    \ the output file with the `-- output` flag, and the input file is provided last\
    \ without any flags using the below command:\n\n```bash\n$ postcss --use postcss-cssnext\
    \ --use cssnano --output styles-out.css styles.css\n```\n\nYou can use the `PostCSS\
    \ CLI` in watch mode, to listen for changes to the input file using the below\
    \ command:\n\n```bash\n$ postcss --use postcss-cssnext --use cssnano --output\
    \ styles-out.css styles.css --watch\n```\n\nYou can specify more fine-grained\
    \ configuration options in a json configuration file to specify the config file\
    \ with the `-- config` flag:\n\n```bash\n$ postcss --config postcss-config.json\n\
    ```\n\nYour config file will look like this:\n\n```json\n{\n  \"use\": [\"postcss-cssnext\"\
    , \"cssnano\"],\n  \"input\": \"styles.css\",\n  \"output\": \"styles-out.css\"\
    \n}\n```\n\n### npm Script\n\nTo make your workflow run smooth, simply set up\
    \ a `postcss` script in your project’s `package.json` file: `\"scripts\": { \"\
    postcss\": \"postcss --use postcss-cssnext --use cssnano --output styles-out.css\
    \ styles.css\" }`.\n\nNow all you have to do is run the following command:\n\n\
    ```bash\n$ npm run postcss\n```\n\n## PreCSS\n\nIt will let you use Sass-like\
    \ markup and staged CSS features in CSS. This is the given example:\n\n```scss\n\
    $blue: #056ef0; $column: 200px; \n  .menu {    width: calc(4 * $column); } \n\
    \  .menu_link {  background: $blue;  width: $column; }\n```\n\nThe result will\
    \ be like this:\n\n```css\n.menu {  width: calc(4 * 200px); } \n  .menu_link {\
    \  background: #056ef0;  width: 200px; }\n```\n\nIt combines Sass-like syntactical\
    \ suga like variables, conditionals, and iterators, with emerging CSS features,\
    \ like logical and custom properties, media query ranges, and image sets.\n\n\
    ### Usage\n\nYou can add `PreCSS` to your build tool:\n\n```bash\n$ npm install\
    \ precss --save-dev\n```\n\n### Other Various Plugins\n\nIt has powered by the\
    \ following plugins (in this order):\n\n- `postcss-extend-rule`: You can add this\
    \ PostCSS Extend Rule to your project:\n\n  ```bash\n  $ npm install postcss postcss-extend-rule\
    \ --save-dev\n  ```\n\n  Use `PostCSS Extend Rule` to process your CSS:\n\n  ```javascript\n\
    \  const postcssExRule = require('postcss-extend-rule');\n  postcssExRule.process(CSS_CODE\
    \ /*, processOptions, pluginOptions */);\n  ```\n\n  There are various `Options`\
    \ available in this plugins.\n\n  The `name` option determines the at-rule name\
    \ being used to extend selectors. By default, this name is `extend`, meaning `@extend`\
    \ rules are parsed.\n\n  If the `name` option were changed to, say, `postcss-extend`,\
    \ then only `@postcss-extend` at-rules would be parsed.\n\n  ```css\n  main {\
    \  @postcss-extend.some-rule; }\n  ```\n\n- `postcss-advanced-variables`: Its\
    \ `variables` let you use Sass-like variables, conditionals, and iterators in\
    \ CSS.\n\n  You can add `PostCSS advanced variables` to your build tool:\n\n \
    \ ```bash\n  $ npm install postcss-advanced-variables --save-dev\n  ```\n\n  You\
    \ can add `PostCSS` to your build tool:\n\n  ```bash\n  $ npm install postcss\
    \ --save-dev\n  ```\n\n  Use `PostCSS advanced variables` as a plugin:\n\n  ```javascript\n\
    \  postcss([  require('postcss-advanced-variables')(/* options */) ]).process(YOUR_CSS);\n\
    \  ```\n\n- `postcss-preset-env`: It lets us to convert modern CSS into something\
    \ that most browsers can understand, determining the polyfills need based on targeted\
    \ browsers or runtime environments.\n\n  You can add `PostCSS Preset Env` into\
    \ your project:\n\n  ```bash\n  $ npm install postcss-preset-env --save-dev (run\
    \ this command in the terminal)\n  ```\n\n  Now use `PostCSS Preset Env` to process\
    \ your CSS as given below:\n\n  ```javascript\n  const postCSSPresetEnv = require('postcss-preset-env');\n\
    \  postCSSPresetEnv.process(YOUR_CSS /*, processOptions, pluginOptions */);\n\
    \  ```\n\n### Various Options\n\n1. **stage**: this option determines which CSS\
    \ features to polyfill, based on the stability in the process of becoming implemented\
    \ web standards. `postcssPresetEnv({ stage: 0 })`\n\n  This stage can be 0 (experimental)\
    \ through 4 (stable), or false. By setting `stage` to `false` will disable all\
    \ polyfill. This would be useful if you intended to use the `features` option\
    \ exclusively.\n\n  Without any configuration options, `PostCSS` allows `Preset\
    \ Env Stage`.\n\n2. **features**: the features enable or disable specific polyfills\
    \ by ID. By passing `true` to a specific feature ID will enable its polyfill,\
    \ during passing `false` will disable it.\n\n  There are various `id` available\
    \ in this plugin as given below:\n\n  1. `postcssAttributeCaseInsensitive`\n \
    \ 2. `postcssBlankPseudo`\n  3. `postcssColorFunctionalNotation`\n  4. `postcssEnvFunction`\n\
    \  5. `postcssLogical`\n  6. `postcssReplaceWrap`\n  7. `postcssSelectorNot`,\
    \ and so on\n\n     You can use these IDs just by importing them in the code.\n\
    \n3. **insertBefore / insertAfter**: the `insertBefore` and `insertAfter` keys\
    \ allow to insert other PostCSS plugins into the chain. This is useful if you\
    \ are using sugary PostCSS plugins that execute before after particular polyfills.\
    \ Both `insertBefore` and `insertAfter` support chaining with one or multiple\
    \ plugins.\n\n4. **autoprefixer**: It also includes `autoprefixer` and `browsers`\
    \ option will be passed to it automatically. It specifying the `autoprefixer`\
    \ option enables passing additional options into `autoprefixer`. `postcssPresetEnv({\
    \ autoprefixer: { grid: true } })`\n\n- `postcss at-root`: The `@at-root` causes\
    \ one or more rules to be emitted at the root of a document, rather than nested\
    \ beneath their parent selectors:\n\n  The result will be as given below:\n\n\
    \  ```css\n  .child { ... } .parent { ... }\n  ```\n\n  How to use it in code:\n\
    \n  ```javascript\n  postcss([ require('postcss-atroot')() ])\n  ```\n\n- `postcss-property-lookup`:PostCSS\
    \ plugin that allows referencing property values without a variable, similar to\
    \ Stylus.\n\n  ```css\n  .section {  margin-left: 20px;  margin-right: @margin-left;\
    \  color: red;  background: @color url('test.png');  line-height: 1.5;  font-size:\
    \ @(line-height)em; } \n  .section {  margin-left: 20px;  margin-right: 20px;\
    \  color: red;  background: red url('test.png');  line-height: 1.5;  font-size:\
    \ 1.5em; }\n  ```\n\n  How to use in code:\n\n  ```javascript\n  postcss([ require('postcss-property-lookup')\
    \ ])\n  ```\n\n- `postcss-nested`\n\n### Install Plugin\n\n- Step 1:\n"
