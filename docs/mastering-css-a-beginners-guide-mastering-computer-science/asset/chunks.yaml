  trans: "\n\n## 第 2 步：检查你现有项目中的 PostCSS 配置：项目根目录下的 `postcss.config.js`、`package.json`\
    \ 中的 `postcss` 部分或拆包配置中的 `postcss`。\n\n如果你没有使用 `PostCSS`，请根据官方文档添加并在设置中配置此插件。\n\
    \n## 第 3 步：将插件添加到插件列表：\n\n有多种可用选项：\n\n1. `bubble`：默认情况下，插件只会泡化 `@media` 和 `@supports`\
    \ 嵌套规则。你可以通过 `bubble` 选项向列表添加自定义的嵌套规则：`postcss([ require('postcss-nested')({ bubble:\
    \ ['phone'] }) ])`\n\n2. `unwrap`：默认情况下，插件将解包 `@font-face`、`@keyframes` 和 `@document`\
    \ 嵌套规则。你可以通过 `unwrap` 选项向列表添加自定义的嵌套规则：`postcss([ require('postcss-nested')({ unwrap:\
    \ ['phone'] }) ])`\n\n### preserveEmpty\n\n默认情况下，插件会剔除由中间嵌套级生成的任何空选择器。你可以将 `preserveEmpty`\
    \ 设置为 `true` 来保留它们。\n\n它将被编译为：\n\n`.a { } .a .b { color: black; }`\n\n你可以使用命令安装\
    \ `postcss-nested`。\n\n## STYLELINT\n\n它是一个强大且现代的 CSS linter，有助于强制样式表的一致性并避免错误。\n\
    \n### 安装 Stylelint\n\n首先，确保你已经安装了 `stylelint`。它是一个 npm 包，可以通过运行以下命令安装：\n\n```\n\
    npm install -g stylelint\n```\n\n### 使用\n\n安装 `stylelint` 后，你可能需要创建一个 `.stylelintrc.json`\
    \ 文件。在这里你可以配置你希望 `stylelint` 检查的所有 lint 规则。然后查看规则规则页面以获取所有可用规则的详情。\n\n一旦设置了带有\
    \ lint 规则的 `.stylelintrc.json` 文件，就可以可以使用命令在 SCSS 文件上运行 `stylelint`。这假设你处于 `.scss`\
    \ 文件所在的目录。你可以根据需要更新路径。\n\n它将在当前工作目录中查找 `.stylelintrc.json` 文件。如果你的任何配置文件不在当前工作目录，可以在运行\
    \ `stylelint` 时通过 `config` 选项将其传递。\n\n如果你想在 npm-scripts 中使用 `stylelint`，请使用以下命令：\n\
    \n```\nnpm install stylelint -D\n```\n\n## PostCSS ASSETS\n\nPostCSS Assets 是一个\
    \ CSS 资源管理器。它将样式表与环境变化隔离，获取图像大小并内联文件。\n\n安装：\n\n```\nnpm install postcss-assets\
    \ --save-dev\n```\n\n### Gulp (gulp-postcss)\n\nPostCSS gulp 插件用于将 CSS 通过管道到多个插件，但仅解析一次\
    \ CSS。\n\n安装 `gulp-postcss`：\n\n```npm\nnpm install --save-dev postcss gulp-postcss\n\
    ```\n\n### Basic\n\n配置将此处所述从 `postcss.config.js` 自动加载，因此你不需要指定任何选项。\n\n使用 `gulp`\
    \ 直接传递插件：\n\n```javascript\nvar postcss = require('gulp-postcss'); \nvar gulp\
    \ = require('gulp'); \nvar autoprefixer = require('autoprefixer'); \nvar cssnano\
    \ = require('cssnano');   \ngulp.task('css', function () { \n    var plugins =\
    \ [ \n        autoprefixer({browsers: ['last 1 version']}), \n        cssnano()\
    \ \n    ]; \n    return gulp.src('./src/*.css') \n        .pipe(postcss(plugins))\
    \ \n        .pipe(gulp.dest('./dest')); \n});\n```\n\n### Grunt\n\n现在我们将解释如何创建一个\
    \ `Gruntfile` 并安装和使用 `Grunt` 插件。一旦你熟悉了该过程，可以使用此命令安装此插件：\n\n```\nnpm install grunt-postcss\
    \ --save-dev\n```\n\n一旦安装了插件，可以在 `Gruntfile` 中通过此行 JavaScript 代码启用它：\n\n```javascript\n\
    grunt.loadNpmTasks('grunt-postcss');\n```\n\n如何在在代码中使用插件：\n\n```javascript\nnpm\
    \ install grunt-postcss pixrem autoprefixer cssnano \ngrunt.initConfig({ \n  postcss:\
    \ { \n    options: { \n      map: true, // 内联 sourcemaps \n      // 或者 \n    \
    \  map: { \n          inline: false, // 将所有 sourcemaps 保存为单独的文件... \n        \
    \  annotation: 'dist/css/maps/' // ...保存到指定的目录 \n      }, \n      processors:\
    \ [ \n        require('pixrem')(), // 为 rem 单位添加回退 \n        require('autoprefixer')({browsers:\
    \ 'last 2 versions'}), // 添加厂商前缀 \n        require('cssnano')() // 压缩结果 \n   \
    \   ] \n    }, \n    dist: { \n      src: 'css/*.css' \n    } \n  } \n});\n```\n\
    \n## FONT MAGICIAN\n\nFont Magician 是一个 PostCSS 插件，可以神奇地生成你所有的 `@font-face` 规则。再也不需要编写\
    \ `@font-face` 规则了。\n\n这里是 font magician 的示例：\n\n只需像魔法一样使用 font 和 font-family\
    \ 属性。\n\n安装：你可以将 Font Magician 添加到你的构建工具中：\n\n```\nnpm install postcss postcss-font-magician\
    \ --save-dev\n```\n\n## LOST GRID\n\nLostGrid 是一个在 PostCSS 中的强大的网格系统，它可以与任何预处理器甚至原生\
    \ CSS 工作。\n\nLost Grid 是一个优秀的 PostCSS 插件，提供了一个令人印象的 CSS 网格系统，不仅适用于普通 CSS，也适用于处理器语言（Sass,\
    \ LESS, Stylus）。它使用 `calc()` 函数创建精美的网格，无需花费大量时间自定义即可轻松使用。\n\n你可以使用以下库进行安装：\n\n\
    ### Gulp\n\n首先，你必须安装 NodeJs，然后使用以下命令全局安装 `gulp`：\n\n```\nnpm install --global\
    \ gulp\n```\n\n你也安装了依赖项：\n\n```\nnpm install --save-dev gulp-postcss gulp-cemaps\
    \ autoprefixer lost\n```\n\n创建 `gulpfile.js`：\n\n```javascript\nvar gulp = require('gulp');\
    \ \nvar postcss = require('gulp-postcss'); \nvar sourcemaps = require('gulp-cemaps');\
    \ \nvar autoprefixer = require('autoprefixer'); \nvar lost = require('lost');\
    \ \nvar paths = { \n  cssSource: 'src/', \n  cssDestination: 'dist/' \n}; \ngulp.task('styles',\
    \ function () { \n    return gulp.src(paths.cssSource + '**css') \n        .pipe(sourcemaps.init())\
    \ \n        .pipe(postcss([ \n            lost(), \n            autoprefixer()\
    \ \n        ])) \n        .pipe(sourcemaps.write('./')) \n        .pipe(gulp.dest(paths.cssDestination));\
    \ \n}); \ngulp.watch(paths.cssSource + '**css', ['styles']);\n```\n\n### Grunt\n\
    \n首先，你必须安装 NodeJs，然后使用此命令安装 `Grunt`：\n\n安装依赖项：\n\n```\nnpm install --save-dev\
    \ grunt-postcss autoprefixer lost\n```\n\n创建 `Gruntfile.js`：\n\n```javascript\n\
    module.exports = function(grunt) { \n  grunt.initConfig({ \n    postcss: { \n\
    \      options: { \n        map: true, // 内联 sourcemaps \n        // 或者 \n   \
    \     map: { \n            inline: false, // 将所有 sourcemaps 保存为单独的文件... \n   \
    \         annotation: 'dist/css/maps/' // ...保存到指定的目录 \n        }, \n        processors:\
    \ [ \n          require('autoprefixer')(), \n          require('lost') \n    \
    \    ] \n      }, \n      dist: { \n        src: 'css/*.css' \n      } \n  },\
    \ \n  watch: { \n    files: ['css/*.css'], \n    tasks: ['postcss'] \n  } \n});\
    \ \ngrunt.loadNpmTasks('grunt-postcss'); \ngrunt.loadNpmTasks('autoprefixer');\
    \ \ngrunt.loadNpmTasks('grunt-contrib-watch'); \ngrunt.registerTask('default',\
    \ ['watch']); \n```\n\n### Brunch\n\n首先，你安装 NodeJS 然后使用此命令安装 `Brunch`：\n\n```\n\
    brunch new\n```\n\n安装依赖项：\n\n```\nnpm install --save postcss-brunch autoprefixer\
    \ lost\n```\n\n更新 `brunch-config.coffee`：\n\n```coffee\nexports.config = { \n\
    \  files: { \n    javascripts: { joinTo: 'app.js' }, \n    stylesheets: { joinTo:\
    \ 'app.css' }, \n    templates: { joinTo: 'app.js' } \n  }, \n  plugins: { \n\
    \    postcss: { \n      processors: [ \n        require('autoprefixer')(), \n\
    \        require('lost') \n      ] \n    } \n  } \n}\n```\n\n"
