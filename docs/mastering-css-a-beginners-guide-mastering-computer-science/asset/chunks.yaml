    ## linear-gradient()


    The `linear-gradient()` function allows to create a linear-gradient using CSS.
    CSS gradients allow to apply multiple background colors to an element that blend
    from one color to the next.


    To create a linear-gradient, use the `linear-gradient()` as a value to any property
    that accepts images (such as `background-image`, `background`, or `border-image`
    properties). Linear-gradients use these properties to build an image of the specified
    gradient.


    These are gradients that run in a straight line. Linear-gradients can go in any
    direction such as up, down, sideways, 50 degrees, 73 degrees, or any other angle
    you like.


    These gradients are created by establishing an axis called the gradient line.
    The color stops are placed along that gradient to create a gradient that runs
    between each color.


