    \ to what you support, final CSS is cacheable, handles tricky fallbacks (e.g.,\
    \ flexbox).\n\n## CSSnext\n\nPostCSS is a new tool that makes easy to develop\
    \ JavaScript plugins that transform styles. This opens up a new world of possibilities\
    \ for new plugins that make working with CSS easier and easier. The post introduces\
    \ two popular PostCSS plugins: `cssnext` and `cssnano`.\n"
  raw: 'PostCSS will take your existing CSS file and convert it to JavaScript readable
    data, then the JavaScript plugins will make the modifications and PostCSS will
    return the modified version of the original file.


    ## VARIOUS CSS PLUGINS PostCSS BASED


    There are various plugins available in the market as given below:


    1.  Autoprefixer


    2.  CSSnext


    3.  CSSNano


    4.  PreCSS


    5.  StyleLint


    6.  PostCSS Assets


    7.  Font Magician


    8.  Lost Grid


    9.  PostCSS


    10.  PostCSS-modules


    ## AUTOPREFIXER


    Autoprefixer uses the data based on the latest browser popularity that supports
    to apply prefixes for you. You can try the interactive demo of Autoprefixer.


    You can write any CSS rules without vendor prefixes as given below:


    .container {     box-shadow: 0 0 10px #cecece;     transition: all .5s;  }   p{
    color: red; }   .section a{ display: flex; }


    ### Write Pure CSS


    Working with Autoprefixer is simple, you need to forget about vendor prefixes
    and write normal CSS according to the latest W3C specs. You do not need a special
    language (like Sass, Less) or remember where you must use mixins.


    Autoprefixer supports selectors (such as :fullscreen &  ::selection), unit function
    (calc()), at‑rules (@support & @keyframes) and with properties.


    It is a postprocessor, you can use it with preprocessors like Sass, Stylus, or
    LESS.


    Just write normal CSS according to the latest W3C specs and Autoprefixer will
    produce the code for old browsers. Autoprefixer changes CSS indentation to create
    a nice visual cascade of prefixes if the CSS is uncompressed.


    The output with Autoprefixer will be like this (you can check the Autoprefixers
    code online using, [https://tools.webdevpuneet.com/css-autoprefixer/](https://tools.webdevpuneet.com)):


    /* * Prefixed by: * PostCSS: v7.0.29, * Autoprefixer: v9.7.6 * Browsers: last
    4 version */   .container {     -webkit-box-shadow: 0 0 10px #cecece;             box-shadow:
    0 0 10px #cecece;     -webkit-transition: all .5s;     -o-transition: all .5s;
        transition: all .5s;  }   p{ color: red; }   .section a{ display: -webkit-box;
    display: -ms-flexbox; display: flex; }


    The thing is that some CSS properties will display differently in different browsers,
    and you want every site visitor to have a predictable and accurate experience.
    For older, more established properties, such as a border or border, there is nothing
    to worry about; they have been standardized and work across browsers. But newer
    features like grid or flexbox are not so simple.


    The vendors that make your browsers, like Google and Mozilla, don’t want to wait
    for cool new things to be standardized before implementing them. Instead, they
    create their own version and add a prefix that differentiates it from other browsers’
    implementations. The new property will be standardized and work the same across
    all browsers, eliminating the need for prefixes. Until then, you must use vendor
    prefixes in your code.


    “Autoprefixer” is a plugin that can save us from the monotony of -webkit- and
    -moz-. It does exactly sounds like: it automatically adds prefixes to your CSS.
    All you have to do is supply it using a CSS sheet that will read it and add vendor
    prefixes if necessary.


    ### Installing Autoprefixer in Your Project Folder


    Open a terminal in VS code and use npm to install it, well as postcss and its
    companion postcss-cli, the command-line tool you’ll use to run Autoprefixer. The
    process is the same as installing Sass, only you install three packages at once.
    You can install so many at once you’d like, each separated by a space as


    Once npm has downloaded and installed the packages, need to go back into package.json
    and add a script for npm to run, just like when you installed Sass. Add a new
    script named “prefix” after the “sass”s script:


    {   "name": "abc",   "version": "1.0.0",   "description": abc",   "main": "index.js",
      "scripts": {     "sass": "sass ./sass/main.scss:./public/css/style.css -w --style
    compressed",     "prefix":   },   "author": "",   "license": "ISC", }


    And inside the script need to tell npm to use the new postcss package you just
    installed and also where to find your compiled CSS file:


    {   "name": "abc",   "version": "1.0.0",   "description": "abc",   "main": "index.js",
      "scripts": {     "sass": "sass ./sass/main.scss:./public/css/style.css -w --style
    compressed",     "prefix": "postcss ./public/css/style.css"   },   "author": "",
      "license": "ISC", }


    After that you need to instruct npm which package to use and where to find the
    CSS file, to use Autoprefixer by implementing  – use flag followed by Autoprefixer
    as given below:


    {   "name": "abc",   "version": "1.0.0",   "description": "abc",   "main": "index.js",
      "scripts": {     "sass": "sass ./sass/main.scss:./public/css/style.css -w --style
    compressed",     "prefix": "postcss ./public/css/style.css --use autoprefixer"
      },   "author": "",   "license": "ISC", }


    And then, finally, you need to instruct it where to put new, prefixed, CSS sheet
    as given below:


    {   "name": "abc",   "version": "1.0.0",   "description": "abc",   "main": "index.js",
      "scripts": {     "sass": "sass ./sass/main.scss:./public/css/style.css -w --style
    compressed",     "prefix": "postcss ./public/css/style.css --use autoprefixer
    -d ./public/css/prefixed/"   },   "author": "",   "license": "ISC", }


    Now your prefixing script is complete.


    Add a new key named  browserslist as given below:


    {   "browserslist": }


    And then give browserslist a value of last four versions :


    {   "name": "joeblow",   "version": "1.0.0",   "description": "Joe Blow’s web
    portfolio",   "main": "index.js",   "scripts": {     "sass": "sass ./sass/main.scss:./public/css/style.css
    -w --style compressed",     "prefix": "postcss ./public/css/style.css --use autoprefixer
    -d ./public/css/prefixed/"   },   "author": "",   "license": "ISC",   "browserslist":
    "last 4 versions" }


    Now you are ready to autoprefix CSS!   Let’s move into the terminal and run the
    prefix  script:


    $ npm run prefix


    Take a look at the new, prefixed, CSS in your CSS file, a new block will be added:


    .section {   background: #15DEA5;   height: 10rem;   display: -webkit-box;   display:
    -ms-flexbox;   display: flex;   -webkit-box-align: center;       -ms-flex-align:
    center;           align-items: center;   -ms-flex-wrap: wrap;       flex-wrap:
    wrap;   width: 100%; }


    Now our website will display properly and uniformly across all compatible browsers.


    ### When Does It Run?


    Autoprefixer is the very last thing that runs when processing your CSS. So if
    you use Sass, LESS, or Stylus, that will process first, then Autoprefixer. You
    are still free to use a preprocessor add-on (e.g., Compass, LESSHat, etc.) in
    which to use for prefixing if you’d like, but I’d argue that Autoprefixer is easier,
    does a better job, and you don’t need both.


    ### What is the Difference Between Autoprefixer and -Prefix-Free?


    -Prefix-free is a client-side JavaScript library. It is included on your page
    as an additional request. It runs, finds all the CSS it can find, figures out
    what prefixes may be needed, and injects that new CSS onto the page after the
    CSS it finds.


    *   Downsides: extra request, flash-of-un-prefixed-styles, not cached, a few styles
    it can’t do (e.g., filter).


    *   Upsides: smaller CSS, only injects prefixes current browser needs.


    Autoprefixer processes your CSS server-side. At least, that’s how we’re doing
    it because that seems to be the canonical source for the project.


    *   Downsides: larger CSS (but not as big as “just prefixing everything”).


    *   Upsides: prefixes perfectly to what you support, final CSS is cacheable, handles
    tricky fallbacks (e.g., flexbox).


    ## CSSnext


    PostCSS is a new tool that makes easy to develop JavaScript plugins that transform
    styles. This opens up a new world of possibilities for new plugins that make working
    with CSS easier and easier. The post introduces two popular PostCSS plugins: cssnext
    and cssnano.'
