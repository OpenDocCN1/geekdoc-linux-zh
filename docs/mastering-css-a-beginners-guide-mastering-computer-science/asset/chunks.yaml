    ## saturate()


    The saturate() function is used to adjust the saturation of an image. This function
    is used with the filter to adjust the saturation levels in an image.


    The syntax of the saturate() function is as follows: saturate() = saturate( [
    <number> | <percentage> ] )


    The output of the code is given below:


    ![](images/ufig4_34.jpg)


    CSS function ( saturate() ).


    ## scale()


    The CSS scale() is used to scale elements in two-dimensional space. The scale()
    scales an element based on the number that provides as an argument. You can scale
    in the direction of the x-axis, the y-axis, or both. The scale() function works
    like this:


    *   scale(sx) or


    *   scale(sx, sy)


    *   scale(sx) or


    *   scale(sx, sy)


    The syntax of the scale() function is as follows: scale() = scale( <number> [,
    <number> ]? )


    The output of the code is given below:


    ![](images/ufig4_35.jpg)


    CSS function ( scale() ).


    ## scale3d()


    The scale3d() is used to scale elements in three-dimensional space. The scale3d()
    scales an element based on the numbers that provide an argument. It specifies
    a 3D scale operation using the [sx,sy,sz] scaling vector described by three parameters.
    The scale3d() function is a three-dimensional primitive, with the following derived
    functions:


    scalex(), scaleY(), scaleZ(), and scale().


    The syntax of the scale3d() function is as follows: scale3d() = scale3d( <number>,
    <number>, <number> )


    The output of the code is given below:


    ![](images/ufig4_36.jpg)


    CSS function ( scale3d() ).


    ## scaleX()


    The CSS scaleX() is used to scale elements in two-dimensional space along the
    x-axis. The scaleX() scales an element based on the number/s that provide an argument.


    The syntax of the scaleX() function is as follows: scaleX() = scaleX( <number>
    )


    The output of the code is given below:


    ![](images/ufig4_37.jpg)


    CSS function (scaleX()).


    ## scaleY()


    The CSS scaleY() is used to scale elements in two-dimensional space along the
    x-axis. The scaleY() scales an element based on the number/s that provide an argument.
    The syntax of the scaleY() function is as follows: scaleY () = scaleY ( <number>
    )


    The output of the code is given below:


    ![](images/ufig4_38.jpg)


    CSS function (scaleY()).


    ## scaleZ()


    The CSS scaleZ () is used to scale elements in two-dimensional space along the
    x-axis. The scaleZ() scales an element based on the number/s that provide an argument.
    The syntax of the scaleZ () function is as follows: scaleZ () = scaleZ ( <number>
    )


    The output of the code is given below:


    ![](images/ufig4_39.jpg)


    CSS function (scaleZ()).


    ## skew()


    The CSS skew() function is used to skew elements in two-dimensional space. The
    skew() element performs a shear transformation (also known as a shear mapping
    or a transvection), which displaces each point of an element by a given angle
    in each direction.


    Skewing an element is kind of like taking the points of an element, and pushing
    or pulling them in different directions, based on a given angle.


    The skew() function works like this:


    *   skew(ax) or


    *   skew(ax, ay)


    The output of the code is given below:


    ![](images/ufig4_40.jpg)


    CSS function (skew()).


    ## skewX()


    The skewX() element performs a shear transformation (also known as a shear mapping
    or a transvection), which displaces each point of an element by a given angle
    along the x-axis.


    The skewX() function works like this: skewX(a)


    The skewX() function accepts one argument which specifies the angle of the skew
    for the x-axis. It can be any valid angle value.


    The output of the code is given below:


    ![](images/ufig4_41.jpg)


    CSS function (skewX()).


    ## CHAPTER SUMMARY


    In this chapter, we saw various built-in methods like attr(), RGB(), rgba(), and
    so on. These functions have their own unique functionality and properties. So
    next chapter is about CSS plugins.


    # CHAPTER 5CSS Plugins


    DOI: [10.1201/9781003358060-5](https://doi.org/10.1201/9781003358060-5)


    In the last chapter, we studied about CSS functions. In this chapter, we will
    discuss some plugins that are based on CSS and also work with JavaScript or any
    other programming language. So PostCSS plays a major role in it. All other plugins
    are defined in PostCSS. PostCSS is a versatile tool that allows to transform CSS
    styles using JavaScript plugins. Its flexibility lies in the way it is built.
    The core of PostCSS is a Node.js module that you can install using npm, it has
    over 200 plugins that you can choose to use in your project. PostCSS is a framework
    for developing various CSS tools. It can be used to develop template languages
    like Sass and LESS. PostCSS consists of a CSS parser that generates an abstract
    syntax tree.


    We also have pre- and post-processing scripts that run before an item is saved.
    The difference between the two is that the pre-processing scripts run before the
    value checking and validation rules are completed, and the postprocessing scripts
    run after these processes.


    PostCSS is neither preprocessor nor postprocessor, as various PostCSS plugins
    can fall into one or both of these categories; it’s entirely up to you what you
    make of it. With PostCSS, you don’t have to learn another syntax like Sass or
    LESS; you can start using it immediately.'
