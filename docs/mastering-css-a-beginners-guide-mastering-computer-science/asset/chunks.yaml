- fmt: "\nNew CSS features are developed by the CSS Working Group sometimes because\
    \ a specific browser is interested in a specific skill, sometimes because web\
    \ designers and developers request a feature, and because the Working Group has\
    \ identified a requirement. CSS is constantly evolving, with new features available.\
    \ However, the important thing about CSS is that everyone works hard so that they\
    \ never change things in a way that can break old websites. A website built in\
    \ 2000 that used the limited CSS that existed then, should still be used in the\
    \ browser today!\n\nAs a newcomer to CSS, you may find the CSS specification too\
    \ great – it is intended for developers to apply feature support to user agents,\
    \ not for web developers to learn to understand CSS. Many experienced developers\
    \ would prefer to look at MDN documents or other courses. However, it is worth\
    \ knowing that these features exist and to understand the relationship between\
    \ the CSS you are using, browser support (see below), and details.\n\n# CSS MODULES\n\
    \nAs there are many things you can style using CSS, the language is divided into\
