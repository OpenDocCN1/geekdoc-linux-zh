  trans: "\n\n## `matrix3d()`\n\nCSS `matrix3d()` 可配合 CSS 变换在三维空间内为元素设置样式。`matrix3d()`\
    \ 是三维变换函数 `rotate3d()`、`rotateX()`、`rotateY()`、`rotateZ()`、`translate3d()`、`translateZ()`、`scale3d()`、`scaleZ()`\
    \ 和 `perspective()` 的替代方案。\n\n代码的输出如下：\n\n![](img/ufig4_24.jpg)\n\nCSS 函数-matrix3d()`.\n\
    \n## `opacity()`\n\n使用 `opacity()` 函数使图像部分或完全透明。`opacity()` 与 filter 属性一起使用，对图像样本应用透明度。`opacity()`\
    \ 需要传入一个参数。此外，它决定了应用到图像上的透明度比例。参数可以是值或数字。\n\n代码的输出如下：\n\n![](img/ufig4_25.jpg)\n\
    \nCSS 函数-opacity()`.\n\n## `perspective()`\n\n`perspective()` 函数定义了 z=0 平与用户之间的距离，以便为\
    \ 3D 定位的元素提供透视效果。\n\n`perspective()` 函数的工作原理如下：`perspective(l)`\n\n`l` 参数指定了从起点到\
    \ z=0 平面的距离。该参数也指定为长度值（例如 `1px`、`1vw` 等）。长度越大，“3D 效果”越不明显。\n\n代码的输出如下：\n\n![](img/ufig4_26.jpg)\n\
    \nCSS 函数 ( `perspective()` )\n\n## `radial-gradient()`\n\n`radial-gradient()`\
    \ 函数允许使用 CSS 创建径向渐变。\n\nCSS 渐变允许为元素应用多种背景颜色，这些颜色从一种颜色过渡到下一种颜色。\n\n代码的输出如下：\n\n\
    ![](img/ufig4_27.jpg)\n\nCSS 函数 (`radial-gradient()` ( ) )\n\n## `repeating-linear-gradient()`\n\
    \nCSS `repeating-linear-gradient()` 允许创建一个在两个方向上无限重复的线性渐变。渐变允许为元素应用多种背景颜色，这些颜色从一种颜色过渡到下一种颜色。这些渐变是线性渐变，其中颜色停止点在两个方向上无限重复。重复线性渐变的工作方式与（非重复的）线性渐变相同。\n\
    \n语法：`repeating-linear-gradient()` 函数接受以下值：\n\n* `angle`：它指定了渐变方向的角度。例如 `45deg`。\n\
    \n以下关键字指定了下方渐变线的指向：\n\n* `to top`\n* `to right`\n* `to bottom`\n* `to left`\n\n\
    以下关键字指定了下方渐变线的指向：\n\n* `to top left`\n* `to top right`\n* `to bottom right`\n\
    * `to bottom left`\n* `color-stop`\n\n代码的输出如下：\n\n![](img/ufig4_28.jpg)\n\nCSS\
    \ 函数 (`repeating-linear -gradient()` ( ) ).\n\n## `repeating-radial-gradient()`\n\
    \nCSS `repeating-radial-gradient()` 允许创建一个无限重复的径向渐变。CSS 渐变允许为元素应用多种背景颜色，这些颜色从单一颜色过渡到下一种。重复径向渐变是颜色停止点无限重复的渐变。径向渐变具有圆形或椭圆形。在创建径向渐变时，指定渐变的中心以及大小和形状。\n\
    \n**语法：** 此函数使用与 `radial-gradient()` 函数相同的语法，如下：`<radial-gradient> = radial-gradient(\
    \ [ [ <shape> || <size> ] [ at <position> ]?, | at <position>,]? <color-stop>\
    \ [, <color-stop> ]+)`\n\n`repeating-radial-gradient()` 函数接受以下值：\n\n* `shape`：它指定渐变的形状。可以是\
    \ `circle` 或 `ellipse`。\n* `size`：指定结束形状的大小。值如下：\n    * `closest side`\n    *\
    \ `farthest side`\n    * `closest corner`\n    * `farthest corner`\n    * `length`（用于圆形）\n\
    \    * `[length | percentage]`（用于椭圆）\n* `position`：它指定渐变所在的位置。值如下：\n    * `top`\n\
    \    * `right`\n    * `bottom`\n    * `left`\n    * `center`\n\n代码的输出如下：\n\n![](img/ufig4_29.jpg)\n\
    \nCSS 函数 (`repeating-radial -gradient()` ).\n\n## `rgb()`\n\n`rgb()` 函数可用于在使用\
    \ CSS 时提供值。它允许通过直接指定红、绿、蓝通道来指定 RGB 颜色值。\n\nRGB（代表 Red, Green, Blue）是一种色彩模型，其中可以将红色、绿色和蓝光相加以还原出颜色。\n\
    \n`RGB()` 接受 RGB 值作为参数。`RGB` 函数以逗号分隔的三个值提供。它分别提供红色、绿色和蓝色色调。\n\n三个值中的每一个值都可以以整数或百分比的形式提供。\n\
    \n我们可以在任何元素上使用该属性。\n\n代码的输出如下：\n\n![](img/ufig4_30.jpg)\n\nCSS 函数 (`RGB()` ( ).\n\
    \n## `rotate()`\n\nCSS `rotate()` 用于在二维空间内旋转元素。`rotate()` 根据你提供的角度进行旋转。可以使用任何有效的角度。\n\
    \n`rotate()` 如下：\n\n1. 度 (Degrees)\n2. 梯度度 (Gradians)\n3. 转 (Turns)\n\n代码的输出如下：\n\
    \n![](img/ufig4_31.jpg)\n\nCSS 函数 (`rotate()` )\n\n## `rotate3d()`\n\n`rotate3d()`\
    \ 函数用于在三维空间内旋转。`rotate3d()` 沿着 x、y、z 轴根据提供的角度进行旋转。它的工作原理如下：`rotate3d(x, y, z,\
    \ a)`\n\n* `x`：指定沿 x 轴的向量。\n* `y`：指定沿 y 轴的向量。\n* `z`：指定沿 z 轴的向量。\n* `a`：指定旋转的角度。正值表示顺时针旋转，负值表示逆时针旋转。\n\
    * `deg`：度。一圈有 360 度。\n* `grad`：梯度度。一圈有 400 梯度度。\n* `rad`：弧度。一圈有 2π 弧度。\n* `turn`：转。一圈有\
    \ 1 转。\n\n代码的输出如下：\n\n![](img/ufig4_32.jpg)\n\nCSS 函数 (`rotate3d()` () ).\n\n\
    ## `rotateX()`\n\nCSS `rotateX()` 在三维空间内绕 x 轴旋转元素。`rotateX()` 用于 3D 变换。它配合 transform\
    \ 属性绕 x 轴旋转元素。它可以在其他旋转函数如 `rotateY()`、`rotateZ()` 中使用，以绕 y 和 z 轴旋转。\n\n`rotateX()`\
    \ 的语法如下：`rotateX() = rotateX( <angle> )`\n\n角度可以接受以下单位：\n\n* `deg`\n* `grad`\n\
    * `rad`\n* `turn`\n\n## `rotateY()`\n\nCSS `rotateY()` 在三维空间内绕 x 轴旋转元素。`rotateY()`\
    \ 用于 3D 变换。它配合 transform 属性绕 x 轴旋转元素。\n\n`rotateY()` 的语法如下：`rotateY() = rotateY(\
    \ <angle> )`\n\n角度可以使用任何以下标识表示：\n\n* `deg`\n* `grad`\n* `rad`\n* `turn`\n\n##\
    \ `rotateZ()`\n\nCSS `rotateZX()` 函数在三维空间内绕 x 轴旋转元素。`rotateZ()` 用于 3D 变换。它配合 transform\
    \ 属性绕 y 轴旋转元素。\n\n"
