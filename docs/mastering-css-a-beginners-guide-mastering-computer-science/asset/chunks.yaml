  raw: "## DIFFERENT MEDIA TYPES\n\nThe following lists the various media types that\
    \ are used to target various types of devices such as printers, devices, computer\
    \ screens, etc.\n\n*   all: It is used for all media-type devices.\n\n*   aural:\
    \ It is used for speech and sound synthesizers.\n\n*   braille : It is used for\
    \ tactile feedback devices.\n\n*   embossed: It is used for paged braille printers.\n\
    \n*   handheld: It is used for small or handheld devices small screen devices\
    \ such as mobile phones or PDAs.\n\n*   print: It is used for printers.\n\n* \
    \  projection: It is used for projected presentations, for example, projectors.\n\
    \n*   screen: It is used primarily for color computer screens.\n\n*   tty: It\
    \ is used for media using a fixed pitch character grid such as teletypes, terminals,\
    \ and portable devices with limited display capabilities.\n\n*   tv: It is used\
    \ for television-type devices with low resolution, color, limited scrollability\
    \ screens, and sound available.\n\n## MEDIA QUESTIONS AND RESPONSIVE WEB DESIGN\n\
    \nMedia queries allow to customize the presentation of web pages to a specific\
    \ range of devices such as mobile phones, tablets, desktops, etc., without change\
    \ in markups. A media query contains media type and zero or more expressions such\
    \ as the type and conditions of certain media features such as device width or\
    \ screen resolution. Here’s a simple example of a typical media query for standard\
    \ devices.\n\n## MEDIA QUERIES\n\nResponsive design was able to emerge due to\
    \ media query. The definition of Media Queries Level 3 was Candidate Recommendations\
    \ in 2009, which means it was considered ready for implementation in browsers.\
    \ Media queries allow us to create a series of tests and apply CSS by choosing\
    \ to customize the page style to the user’s needs.\n\nFor example, the following\
    \ media quiz questions to see if the current web page is displayed as screen media\
    \ (so it is not a printed document) and the viewing area is 800 pixels wide. CSS\
    \ selector .container will only be used if these two are true.\n\n## BENEFITS\
    \ YOU MAY KNOW\n\nLet’s learn more about CSS benefits such as:\n\n1.  One of the\
    \ main benefits of CSS is that CSS is very useful for Digital Marketing purposes\
    \ where every promotion of your web page provides a business opportunity. Therefore,\
    \ more content with a code formula with the help and use of CSS techniques is\
    \ better for digital marketing and your business in the end.\n\n2.  CSS offers\
    \ its users, by making small changes to your website, similar changes are seen\
    \ in other parts of the website. The bigger your website, the more content and\
    \ layouts are where CSS saves you a lot of time when it comes to conversions.\
    \ It also checks and verifies that each page is consistent with the CSS benefits.\n\
    \n3.  W3C works with the goal of making the entire website equally accessible\
    \ to disabled users the way normal users use it. First CSS gains access by creating\
    \ layout and document making it easy for any screen reader to read content accurately.\
    \ This is useful for deaf users as they rely on the screen reader to run web applications.\n\
    \n4.  For a website to work properly, it must have a fast download time. Nowadays,\
    \ people usually wait a few seconds for a website to load. Therefore, it is important\
    \ to ensure a fast pace. For companies looking to ensure fast and smooth website\
    \ information, CSS becomes key to their success.\n\n5.  CSS is easy to maintain\
    \ due to the short maintenance time. This is because single-line code conversion\
    \ affects the entire web page. Also, if upgrades are needed, a little more effort\
    \ is needed to minimize changes to the webpage code.\n\n6.  CSS empowers developers\
    \ to ensure that style features are applied consistently across every few web\
    \ pages.\n\n7.  CSS saves a lot of time and effort in the web development process\
    \ due to fast loading time. Here, a little time ensures the good performance of\
    \ the designer.\n\n## CSS CONS\n\nThere are a few drops while using CSS. One has\
    \ to be aware of these bad situations in order to know and take care of them while\
    \ designing a website.\n\n1.  Confusion due to too many CSS levels: Beginners\
    \ are at high risk in this regard. They may be confused when choosing to read\
    \ CSS as there are many CSS levels like CSS2, CSS3, etc.\n\n2.  Browser problems:\
    \ Different browsers work differently. Therefore, you should check if the changes\
    \ made to the website by the CSS codes are visible to all browsers.\n\n3.  Security\
    \ issues: Security is critical in today’s world driven by technology and data.\
    \ One of the bad things about CSS is that it has limited security.\n\n4.  Additional\
    \ developer work: Design services are required to consider and test all CSS codes\
    \ in all different browsers for compatibility. As a result of testing developer\
    \ compatibility in different browsers, their workload is growing.\n\nAll in all,\
    \ we can say that if you like web development, try learning HTML and CSS. For\
    \ device compatibility, read the Bootstrap framework. While you may see some disadvantages\
    \ of CSS, many of the benefits are counterproductive and make sure your web development\
    \ process is smooth and efficient.\n\n## CHAPTER SUMMARY\n\nHere we have covered\
    \ all the basic concepts of CSS that everyone can use to make their pages attractive.\
    \ So important thing for working with CSS is just only practice, once you start\
    \ practicing it, you will get to the point easily. Then in the coming chapter,\
    \ you will learn CSS properties that make your work so easy.\n\n# CHAPTER 2CSS\
    \ Properties\n\nDOI: [10.1201/9781003358060-2](https://doi.org/10.1201/9781003358060-2)\n\
    \nIn the last chapter, we learned about the basics of CSS, its history, types,\
    \ versions, and other properties such as how to add CSS on classes, id, commenting\
    \ out code, basic HTML, and linking HTML with CSS. Now here we are going to discuss\
    \ various important properties of CSS such as display, positioning, border, grid,\
    \ flex height, width, color, font, and so on.\n\nYou style HTML elements via CSS\
    \ properties. Different HTML elements may have different CSS layouts to set. CSS\
    \ layouts can be organized into CSS rules. CSS rule binds a set of CSS layouts\
    \ together, and applies all the elements to HTML elements that match the CSS rule.\
    \ This document will include both CSS layouts and CSS rules in more detail.\n\n\
    In CSS, there are various properties; below you will get the list of all attributes\
