    # 257. `will-change`\n# 258. `width`\n# 259. `word-break`\n# 260. `word-spacing`\n\
    # 261. `word-wrap`\n# 262. `z-index`\n## 布局属性 (PROPERTIES)\n\n以下列表包含标准 CSS 属性，如\
    \ `column-gap`, `column-rule`, `column-rule-color`, `column-rule-style`, `column-rule-width`,\
    \ `column-span`, `column-width`, `content`, `counter-increment`, `counter-reset`,\
    \ `cue-after`, `cue-before`, `cue`, `cursor`, `direction`, `display`, `elevation`,\
    \ `empty-cells`, `filter`, `flex`, `flex-basis`, `flex-direction`, `flex-flow`,\
    \ `flex-grow`, `flex-shrink`, `flex-wrap`, `float`, `flood-color`, `flood-opacity`,\
    \ `font-family`, `font-feature-settings`, `font-kerning`, `font-language-override`,\
    \ `font-size-adjust`, `font-size`, `font-stretch`, `font-style`, `font-synthesis`,\
    \ `font-variant`, `font-variant-alternates`, `font-variant-caps`, `font-variant-east-asian`,\
    \ `font-variant-ligatures`, `font-variant-numeric`, `font-variant-position`, `font-weight`,\
    \ `font`, `gap`, `grid-area`, `grid-auto-columns`, `grid-auto-flow`, `grid-auto-rows`,\
    \ `grid-column-end`, `grid-column-gap`, `grid-column-start`, `grid-column`, `grid-gap`,\
    \ `grid-row-end`, `grid-row-gap`, `grid-row-start`, `grid-row`, `grid-template-areas`,\
    \ `grid-template-columns`, `grid-template-rows`, `grid-template`, `grid`, `hanging-punctuation`,\
    \ `height`, `hyphens`, `image-rendering`, `isolation`, `justify-content`, `justify-items`,\
    \ `justify-self`, `left`, `letter-spacing`, `lighting-color`, `line-break`, `line-height`,\
    \ `list-style-image`, `list-style-position`, `list-style-type`, `list-style`,\
    \ `margin-bottom`, `margin-left`, `margin-right`, `margin-top`, `margin`, `marker-offset`,\
    \ `marks`, `max-height`, `max-width`, `min-height`, `min-width`, `mix-blend-mode`,\
    \ `nav-up`, `nav-down`, `nav-left`, `nav-right`, `object-fit`, `object-position`,\
    \ `opacity`, `order`, `orphans`, `outline-color`, `outline-offset`, `outline-style`,\
    \ `outline-width`, `outline`, `overflow`, `overflow-wrap`, `overflow-x`, `overflow-y`,\
    \ `padding-bottom`, `padding-left`, `padding-right`, `padding-top`, `padding`,\
    \ `page-break-after`, `page-break-before`, `page-break-inside`, `page`, `pause-after`,\
    \ `pause-before`, `pause`, `perspective`, `perspective-origin`, `pitch-range`,\
    \ `pitch`, `place-content`, `place-items`, `place-self`, `play-during`, `position`,\
    \ `quotes`, `resize`, `rest-after`, `rest-before`, `rest`, `richness`, `right`,\
    \ `row-gap`, `size`, `speak-header`, `speak-numeral`, `speak-punctuation`, `speak`,\
    \ `speech-rate`, `stress`, `tab-size`, `table-layout`, `text-align`, `text-align-all`,\
    \ `text-align-last`, `text-combine-upright`, `text-decoration`, `text-decoration-color`,\
    \ `text-decoration-line`, `text-decoration-skip`, `text-decoration-style`, `text-justify`,\
    \ `text-indent`, `text-orientation`, `text-overflow`, `text-shadow`, `text-transform`,\
    \ `text-underline-position`, `top`, `transform`, `transform-box`, `transform-origin`,\
    \ `transform-style`, `transition`, `transition-delay`, `transition-duration`,\
    \ `transition-property`, `transition-timing-function`, `unicode-b`, `vertical-align`,\
    \ `visibility`, `white-space`, `will-change`, `width`, `word-break`, `word-spacing`,\
    \ `word-wrap`, `z-index`。\n\n## 规则\n\n以下部分包含最新规范中的标准 CSS 属性：\n\n### CSS 动画属性\n\
    \n`animation` 属性是 `animation-name`, `animation-duration`, `animation-direction`,\
    \ `animation-timing-function`, `animation-delay`, `animation-iteration-count`,\
    \ `animation-fill-mode` 和 `animation-play-state` 的。以下是动画属性的默认值：\n\n它适用于所有元素、`::before`\
    \ 和 `::after` 伪元素。下表描述了动画属性的值：\n\n1.  `animation-name` 属性：`animation-name` CSS\
    \ 属性定义了应用于所选元素的 `@keyframes` 定义的动画名称。属性语法如下：`animation-name:  keyframe name |\
    \ none | initial | inherit`\n2.  `animation-duration` 属性：`animation-duration`\
    \ CSS 属性定义了完成一个周期所需的秒数或毫秒。该属性的语法为：`animation-duration: time | initial | inherit`\n\
    3.  `animation-timing-function` 属性：`animation-timing-function` CSS 属性指定了 CSS 动画在周期内的进展方式。该属性的语法为：`animation-timing-function:\
    \ linear | ease | ease-in | ease-out | ease-in-out | cubic-bezier(n,n,n,n) | initial\
    \ | inherit`\n4.  `animation-delay`: 它指定了动画开始前的延迟。`animation-delay` CSS 属性定义了动画何时开始。该属性的值可以用秒（s）或毫秒（ms）指定。\n\
    \n    语法为：`animation-delay:  time | initial | inherit`\n5.  `animation-iteration-count`\
    \ 属性：`animation-iteration-count` 属性定义了动画周期在停止前播放的次数。\n\n"
- fmt: "\n### 6. `animation-direction` property: The `animation-direction` CSS property\
    \ specifies whether the animation should be played in reverse on alternate cycles\
    \ or not.\n\nThe syntax of this property is given as: `animation-direction: normal\
    \ | reverse | alternate | alternate-reverse | initial | inherit`\n\n### 7. `animation-fill-mode`\
    \ property: The `animation-fill-mode` property defines how a CSS animation should\
    \ apply styles to the target before and after it is executing.\n\nThe syntax of\
    \ this property is given as: `animation-fill-mode: none | backwards | forwards\
    \ | both | initial | inherit`\n\nThe following table defines the values of this\
    \ property:\n\n| Value | Description |\n| --- | --- |\n| none | The animation\
    \ will not apply to the target before or after it is executing. |\n| forwards\
    \ | After the animation ends, the animation will apply the values for the time\
    \ the animation ended. |\n| backwards | The animation will apply the values defined\
    \ in the keyframe that will start the 1st iteration of the animation, during the\
    \ period defined by the property. Either the values of the from keyframe or to\
    \ those of the to keyframe. |\n\n### 8. `animation-play-state` property: The `animation-play-state`\
    \ property specifies whether an animation is playing or paused.\n\nThe syntax\
    \ of this property is given as: `animation-play-state: paused | running | initial\
    \ | inherit`\n\n### 9. `initial`: It sets the property to its default value.\n\
    \n### 10. `inherit`: If it specifies, the associated element takes the calculated\
    \ value of its parent element’s animation property.\n\n## THE @KEYFRAMES RULE\n\
    \nWhen we specify CSS styles inside the `@keyframes` rule, the animation will\
    \ change from the current style to new style at certain times.\n\nThe output of\
    \ the code is given below:\n\n![](images/ufig2_1.jpg)\n\nCSS animation property.\n\
    \nThe output of the code is given below:\n\n![](images/ufig2_2.jpg)\n\nCSS animation\
    \ property (second example).\n\nNow in the below example, we are going to use\
    \ animation with its properties that we discussed above.\n\nThe output of the\
    \ code is given below:\n\n![](images/ufig2_3.jpg)\n\nCSS animation property (third\
    \ example).\n\n## CSS BACKGROUND PROPERTIES\n\nThe background is a shorthand property\
    \ for setting a single background property, that is, `background-image`, `background-position`,\
    \ `background-size`, `background-repeat`, `background-attachment`, `background-origin`,\
    \ `background-clip`, and `background-color` in a single declaration.\n\nThe syntax\
    \ of this property is given as: `background: [ the image position/size repeat\
    \ attachment the origin clip color ] | initial | inherit`\n\n1. `background-attachment`\
    \ property: The `background-attachment` CSS property defines whether the background\
    \ image scrolls with the document or remains fixed to the viewing area. The syntax\
    \ of this property is given as: `background-attachment: scroll | fixed | initial\
    \ | inherit`.\n\n2. `background-color` property: The `background-color` property\
    \ sets the background color of an element. You can set the color of the background\
    \ either through a color value or the keyword `transparent`.\n\nThe background\
    \ of any element is the whole size of the element, including padding and border\
    \ (not the margin). See the box model. The syntax of this property is given as:\
    \ `background-color: color | transparent | initial | inherit`\n\n3. `background-clip`\
    \ property: The `background-clip` property specifies whether an element’s background,\
    \ either the color or image, extends it’s border or not. The syntax of this property\
    \ is given as: `background-clip: border-box | padding-box | content-box | initial\
    \ | inherit`\n\nThe output of the code is given below:\n\n![](images/ufig2_4.jpg)\n\
    \nCSS background clip.\n\n4. `background-image` property: The `background-image`\
    \ property sets the background image for an element. It is often more good to\
    \ use the shorthand `background` property.\n\nThe syntax of the property is given\
    \ as: `background-image: url | none | initial | inherit`\n\nThe output of the\
    \ code is given below:\n\n![](images/ufig2_5.jpg)\n\nCSS background image.\n\n\
    5. `background-origin` property: The `background-origin` CSS property specifies\
    \ the positioning area of the background, that is, the position of the origin\
    \ of an image specified using the `background-image` property. The syntax of this\
    \ property is given as: `background-origin: border-box | padding-box | content-box\
    \ | initial | inherit`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
    \  .demo_container{\n    text-align: center;\n  }\n  .parent {\n    height:500px;\
    \ display: flex; align-items: center; justify-content: center;\n  }\n  .child\
    \ {\n    width: 500px;\n    height:400px;\n    padding: 10px;\n    border: 6px\
    \ dashed #333;\n    background: url(\"/images-1.jpg\") no-repeat;\n    background-size:\
    \ cover;\n    background-origin: content-box;\n  }\n</style>\n</head>\n<body>\n\
    <div class=\"demo_container\">\n  <div class=\"parent\">\n    <div class=\"child\"\
    >\n      <h1>CSS Background Origin - Here in this you can apply padding</h1>\n\
    \    </div>\n  </div>\n</div>\n</body>\n</html>\n```\n\nThe output of the code\
    \ is given below:\n\n![](images/ufig2_6.jpg)\n\nCSS background origin.\n\nThe\
    \ output of the code is given below:\n\n![](images/ufig2_7.jpg)\n\nCSS background\
    \ origin – padding box.\n\n6. `background-position` property: The `background-position`\
    \ property sets the initial position (i.e. origin) of the element’s background\
    \ image. It is often more good to use the shorthand `background` property.\n\n\
    Its default value is : `0% 0%`.\n\nThe syntax of this property is given as: `background-position:\
    \ [ percentage | length | left | center | right ]1 or 2 values | initial | inherit`\n\
    \nThe output of the code is given below:\n\n![](images/ufig2_8.jpg)\n\nCSS background\
    \ position.\n\n7. `background-repeat` property: The `background-repeat` CSS property\
    \ specifies whether the background image is repeated or tiled after it has been\
    \ sized and positioned. It is often good to use the shorthand `background` property.\n\
    \nThe syntax of the property is given as: `background-repeat: repeat | repeat-x\
    \ | repeat-y | no-repeat | initial | inherit`\n\nThe output of the code is given\
    \ below:\n\n![](images/ufig2_9.jpg)\n\nCSS background repeat(y).\n\nThe output\
    \ of the code is given below:\n\n![](images/ufig2_10.jpg)\n\nCSS background repeat(x).\n\
    \n8. `background-size` property: The `background-size` property defines the size\
    \ of the background images.\n\nThe syntax of the property is given as: `background-size:\
    \ length attribute| percentage attribute| auto attribute | cover attributes attribute\
    \ | contain attribute| initial attribute| inherit attribute`\n\nThe output of\
    \ the code is given below:\n\n![](images/ufig2_11.jpg)\n\nCSS background size\
    \ – contained cover and full cover.\n\n## CSS BORDER PROPERTIES\n\nThe `border`\
    \ property sets the width, style, and color for all four sides of an element’s\
    \ border. It is a shorthand property for setting the individual border properties,\
    \ that is, `border-width`, `border-style`, and `border-color` in a single declaration.\n\
    \nThe syntax of the property is given as:\n\n`border: [ border-width border-style\
    \ border-color ] | initial | inherit`\n\nThe output of the code is given below:\n\
    \n![](images/ufig2_12.jpg)\n\nCSS border property.\n\n1. `border-width` property:\
    \ The `border-width` CSS property is a shorthand property for setting a singleborder\
    \ width property, that is, `border-top-width`, `border-right-width`, `border-bottom-width`,\
    \ and `border-left-width` in a single declaration. The syntax of this property\
    \ is given as: `border-width : [ thin | medium | thick | length ] 1 to 4 values\
    \ | inherit`\n\nThe output of the code is given below:\n\n![](images/ufig2_13.jpg)\n\
    \nCSS border property-width.\n"
