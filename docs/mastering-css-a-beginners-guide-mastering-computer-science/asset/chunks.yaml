    ### 4. `column-rule` property

    The `column-rule` CSS property specifies a straight line, “rule,” to be drawn
    between each column. It is a property for setting the individual properties, that
    is, `column-rule-width`, `column-rule-style`, and `column-rule-color` at once.


    `column-rule: [ column-rule-width column-rule-style column-rule-color ] | initial
    | inherit`


    The output of the code given is below:


    ![](images/ufig2_36.jpg)


    CSS column-rule property.


    ### 5. `column-rule-width` property

    The `column-rule-width` property property sets the width of the rule drawn between
    columns in a multi-column layout.


    The syntax of this property is given as: `column-rule-width: length | medium |
    thin | thick | initial | inherit`


    ### 6. `column-rule-style` property

    This Property sets the style of the rule set between columns in a multi-column
    layout.


    The syntax of this property is given as: `column-rule-style: none | hidden | dashed
    | dotted | solid | double | groove | ridge | inset | outset | initial | inherit`


    ### 7. `column-rule-color` property

    The `column-rule-color` property sets the color of all the rules drawn between
    columns in a multi-column layout.


    The syntax of this property is given as: `column-rule-color: color | initial |
    inherit`


    The output of the code is given below:


    ![](images/ufig2_37.jpg)


    CSS various column property.


    ## CSS OUTLINE PROPERTIES


    ### 1. `outline` property

    The `outline` property sets the width, style, and color for all four sides of
    an element’s outline. It is a property for setting the individual outline, that
    is, `outline-width`, `outline-style`, and `outline-color` in a single declaration.


    The syntax of this property is given as: `outline: [ outline-width outline-style
    outline-color ] | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_38.jpg)


    CSS outline property.


    ### 2. `outline-width` property

    The `outline-width` CSS property sets the width of the outline of an element.
    However, in many cases the shorthand CSS properties `outline` is more convenient
    to use and preferable.


    The syntax of the property is given as: `outline-width: thin | medium | thick
    | length | initial | inherit`


    ### 3. `outline-style` property

    The outline style property sets style of the outline of an element. However, in
    many cases the shorthand properties `outline` is more convenient to use and preferable.


    The syntax of this property is given as: `outline-style: none | dotted | dashed
    | double | groove | ridge | inset | outset | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_39.jpg)


    CSS various outline property.


    ## CSS PADDING


    The `padding` CSS property sets the margin on all four sides of the element. It
    is a property used for `padding-top`, `padding-right`, `padding-bottom`, and `padding-left`
    properties.


    The syntax of this property is given as: `padding : [ length | percentage | auto
    ] 1 to 4 values | initial | inherit`


    This notation can take one, two, three, or four whitespace-separated values.


    1. If we set one value, then margin applies to all four sides.

    2. If we set two values, then a value applies to the top and bottom, and the second
    value applies to the right and left sides.

    3. If we set three values, then values apply to the top, horizontal (i.e. right
    and left), and bottom sides.

    4. If we set four values, then values apply to the top, right, bottom, left sides
    in that order.


    Instead of `padding`, you can use other various `margin-top`, `padding-right`,
    `padding-bottom`, `padding-left`.


    ## CSS PRINT PROPERTIES


    ### 1. `page-break-after` property

    The `page-break-after` CSS property inserts page breaks after an element when
    printing a document. This property applies to block-level elements that generate
    a box. It won’t apply on an empty `<p>` that won’t generate a box. The syntax
    of this Property is given as: `page-break-after: auto | always | avoid | left
    | right | initial | inherit`


    The result of the code is given below:


    ![](images/ufig2_40.jpg)


    page-break-after property.


    We have two more properties in the print section, they are:


    1. `page-break-before` property

    2. `page-break-inside` property


    ## CSS TABLE PROPERTIES


    ### 1. `border-collapse` property

    The `border-collapse` CSS property specifies whether the cell borders of a table
    are collapsed in a single border or separated as usual. There are two distinct
    models for setting borders on table cells in CSS.


    *   Separated border model

    *   Collapsing border model


    The syntax of this property is given as: `border-collapse: separate | collapse
    | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_41.jpg)


    CSS border collapse – with and without.


    ### 2. `border-spacing` property

    The `border-spacing` CSS property sets the spacing between the borders of adjacent
    cells using the border model. If the border model is used, the property is ignored.
    Here see the `border-collapse` property.


    The syntax of this property is given as: `border-spacing: [ length ] 1 to 2 values
    | initial | inherit`


    The output of the code is given:


    ![](images/ufig2_42.jpg)


    CSS border-spacing property.


    ### 3. `caption-side` property

    The `caption-side` CSS property sets the vertical position of the caption box.
    To align text horizontally within the caption box, use the `text-align` property.


    The syntax of this property is given as: `caption-side: top | bottom | initial
    | inherit`


    The output is given:


    ![](images/ufig2_43.jpg)


    CSS caption property.


    ### 4. `empty-cells` property

    The `empty-cells` property shows or hides borders of table cells that have no
    content. A non-breaking space is considered as a visible content.


    The syntax of this property is given as: `empty-cells: show | hide | initial |
    inherit`


    The description values are as follows:


    1. `show`: It is borders and backgrounds around empty cells like normal cells.
    This is the default value.

    2. `hide`: There are no borders around empty cells.


    The output is given:


    ![](images/ufig2_44.jpg)


    CSS empty-cells property.


    ## CSS TEXT PROPERTIES


    ### 1. `text-align` and `text-align-all` property

    The `text-decoration` property is a property for setting `text-decoration-line`,
    `text-decoration-style`, and `text-decoration-color` in one declaration.


    The syntax of `text-align` is given as: `text-align: start | end | right | left
    | center | justify | match-parent`


    The syntax for `text-align-all` is given as: `text-align-all: start | end | left
    | right | center | justify`


    The output is given:


    ![](images/ufig2_45.jpg)


    CSS text-align and text-align-all property.


    ### 2. `text-decoration` property

    The `text-decoration` property is a property for setting `text-decoration-line`,
    `text-decoration-style`, and `text-decoration-color` in one declaration.


    The syntax of the `text-decoration` is given as: `text-decoration: <text-decoration-line>
    || <text-decoration-style> || <text-decoration-color>`


    Here are some possible values under `text-decoration-line`:


    1. `none`: It is neither produces nor inhibits text decoration.

    2. `underline`: Each line of text is underlined.

    3. `overline`: In each line of text has a line over it.

    4. `line-through`: In each line of text has a line through the middle.

    5. `blink`: The text blinks means the alternates between visible and invisible.


    Here are some possible values under `text-decoration-style`:


    1. `solid`: It is a solid line.

    2. `wavy`: It is a wavy line.

    3. `dotted`: It is a dotted line.

    4. `dashed`: It is a line consisting of dashes.

    5. `double`: It is a double solid line.


    Here are some possible values under `text-decoration-color`:


    1. `initial`: It represents the value specified as the property’s initial value.

