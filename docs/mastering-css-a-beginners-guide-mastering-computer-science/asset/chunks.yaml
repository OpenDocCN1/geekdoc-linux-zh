    ### 2. `border-bottom` property: The `border-bottom` CSS property sets the width,
    style, and color of the bottom border of an element. It is a property for setting
    the individual bottom border properties, that is, `border-bottom-width`, `border-bottom-style`,
    and `border-bottom-color` at once. The syntax of this property is given as: `border-bottom:
    [ border-bottom-width border-bottom-style border-bottom-color ] | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_14.jpg)


    CSS border property – left, bottom, right, top.


    ### 3. `border-bottom-color` property: The `border-bottom-color` property sets
    the color of an element’s bottom border individually. However, in other cases
    the shorthand properties like `border color` or `border bottom` are more convenient
    to use and preferable. The syntax of this property is given as: `border-bottom-color:
    color | transparent | inherit`


    ### 4. `border-bottom-left-radius` property: The `border-bottom-left-radius` property
    sets the rounded shape for the “bottom-left” corner of an element border box.


    The output of the code is given below:


    ![](images/ufig2_15.jpg)


    CSS border bottom left property – left, right.


    ### 5. `border-bottom-style` property: The `border-bottom-style` property sets
    the style of an element’s bottom border individually. However, in other cases
    the shorthand properties like `border style` or `border bottom` are more convenient
    to use and preferable.


    The syntax of this property is given as: `border-bottom-style: none | hidden |
    dashed | dotted | solid | double | groove | ridge | inset | outset | initial |
    inherit`.


    The output of the code is given below:


    ![](images/ufig2_16.jpg)


    CSS various border style.


    ### 6. `border-image` property: The `border-image` CSS property specifies how
    an image is to be used in place of the border styles. This is a property for setting
    `border-image-source`, `border-image-width`, `border-image-slice`, `border-image-outset`,
    and `border-image-repeat` properties at once. The syntax of this property is given
    as: `border-image: [ source slice width outset repeat ] | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_17.jpg)


    CSS border-image property.


    ## CSS COLOR PROPERTIES


    The CSS color feature sets the color of the text element content. All modern web
    browsers support different colors to maintain a colorful display. In CSS, colors
    can be represented in several ways and even use a color word such as “color: blue.”
    However, this method only supports names for certain colors. Therefore, in CSS,
    other advanced methods are used to display colors such as `RGB`, `HSL`, `HEX`,
    etc.


    The output of the code is given below:


    ![](images/ufig2_18.jpg)


    CSS color property (color).


    ### RGB Colors


    RGB is a combination of three colors (red, green, and blue) which are used in
    all computer programs to display colors. As we know, these are the basic colors,
    and by combining them, we can find any color that appears in the color spectrum.


    The output of the code is given below:


    ![](images/ufig2_19.jpg)


    CSS color property (RGB).


    ### RGBA Colors


    In CSS, `RGBA` is also a color display format with Alpha extension. The structure
    of this color work is given below:


    ```

    rgba (Red, Green, Blue, Alpha)

    ```


    In this work, `Alpha` is used to express color blurring. In CSS `opacity`, the
    area is used to set the color brightness and its width is between 0.0 and 1.0,
    where 0.0 stands for absolute transparency and 1.0 represents absolute opaque.
    You will understand better in the example provided.


    The output of the code is given below:


    ![](images/ufig2_20.jpg)


    CSS color property (RGBA).


    ### CSS HEX Colors


    CSS colors can also be defined by hexadecimal values, which is another way of
    representing colors. In CSS, it is the most common way to define color using hexadecimal
    values with a “#” symbol such as `#RRGGBB`. Although, `R`, `G`, `B` codes red,
    green, and blue, respectively.


    Hexadecimal numbers with a combination of 0-9 and A-F are used to represent color
    in CSS. Some examples of HEX basic colors are given below.


    The output of the code given below:


    ![](images/ufig2_21.jpg)


    CSS color property (HEX).


    ### 1. `opacity` property: The `opacity` property specifies the transparency of
    an element. The syntax of this property is given as: `opacity: alphavalue | initial
    | inherit`


    ### 2. The output of the code is given below:


    ![](images/ufig2_22.jpg)


    CSS color opacity property.


    ## CSS DIMENSION PROPERTIES


    ### 1. `height` property: The `height` CSS property specifies the height of the
    content area of an element. The content area does not include padding, borders,
    or margins.


    The syntax of this property is given as: `height: length | percentage | auto |
    initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_23.jpg)


    CSS dimension property – height, width.


    ### 2. `max-height` and `max-width` property: The `max-height` CSS property specifies
    the maximum height of the content area of an element. This maximum height does
    not include padding, borders, or margins.


    The `max-width` property defines the max width of the content area of an element.
    This maximum width does not include padding, borders, or margins.


    The syntax of this property is given as: `max-height: length | percentage | none
    | initial | inherit`


    The syntax of this property is given as: `max-width: length | percentage | none
    | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_24.jpg)


    CSS dimension property – max-height, max-width.


    ### 3. `min-height` property: The `min-height` CSS property specifies the minimum
    height of the content area of an element. This minimum height does not include
    padding, borders, or margins.


    The syntax of this property is given as: `min-height: length | percentage | initial
    | inherit`


    ## CSS GENERATED CONTENT PROPERTIES


    ### 1. `content` property: The `content` CSS property is used in combination with
    the `::before` and `::after` pseudo-elements to generate content in an element.
    The syntax of this property is given as: `content: normal | none | counter | string
    | url(url) | attr(attribute) | open-quote | close-quote | no-open-quote | no-close-quote
    | initial | inherit`


    The output of the code is given below:


    ![](images/ufig2_25.jpg)


    CSS content property.


    ### 2. `quotes` property: The `quotes` CSS property specifies the quotation marks
    for the embedded quotations. The quotes characters specified for this property
    are used for the `open-quote` and `close-quote` values of the `content` property.


    The syntax of this property is given as: `quotes: [string string]one or more pairs
    | none | initial | inherit`


    ### 3. `counter-reset` property: The `counter-reset` CSS property is used in combination
    with the `counter-increment` property for creating auto-incrementing counters,
    and with the `content` property to display the generated counter values.


    The syntax of the property is given as: `counter-reset: [ identifier integer ]one
    or more pairs | none | initial | inherit`


    The output of the code given below:


    ![](images/ufig2_26.jpg)


    CSS counter-reset property.


    ## CSS FLEXIBLE BOX LAYOUT


    The `alignment-content` feature changes the behavior of the `flex-wrap` structure.
    Aligns dynamic lines. Used to specify alignment between lines within a flexible
    container. This feature describes how each flexible line is aligned within the
    flexbox and only works if the `flex-wrap: wrap` is used, that is, when multiple
    flexbox lines are present.


    List of content alignment items:


    1.  `center`: In this, the items are positioned at the center of the flex container.


    2.  `stretch`: In this, the items are stretched to fit the flex container. The
    free-space is divided between all the items. This is the default value.


    3.  `flex-start`: In this, the items are positioned at the beginning of the flex
    container.


    4.  `flex-end`: In this, the items are positioned at the end of the flex container.

