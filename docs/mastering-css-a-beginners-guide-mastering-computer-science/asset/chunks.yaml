    # 第 1 章：CSS 简介


    DOI: [10.1201/9781003358060-1](https://doi.org/10.1201/9781003358060-1)


    在本章中，我们将学习 `CSS`（层级样式表）、其基本概念、版本、语法以及如何将 HTML 页面与 CSS 文件关联。其他概念如模块、选择器、ID、边框、属性、表格、表单、颜色等将在整个课程中涵盖。。让我们从
    CSS 的基础知识开始吧。


    '
- fmt: '

    A document is usually a text file created using tag language – `HTML` is the common
    markup language, but you can also merge with other tag languages such as `SVG`
    or `XML`. It is presenting a document to other user means converting it into a
    form used by your audience. The other browsers, such as `Firefox`, `Chrome`, or
    `Edge`, are designed to deliver text by a view, for example, on a computer screen,
    projector, or printer.


    Cascading Style Sheets (`CSS`) is a programming language that integrates all relevant
    information related to web page displays. `CSS` defines the style and format of
    a website or page, including layout, fonts, padding (space around each element),
    and more. Along with `HTML`, `CSS` forms the basis of how the Internet works.
    All standards and specifications are also maintained by the World Wide Consortium
    (`W3C`).


    `CSS` can be used to create basic style – for example, to change the color and
    size of titles and links. It can be used to build a structure, for example, to
    convert single column of text into the main area and bar for related information.
    It can be used for effects such as animation.


    ## HISTORY


    `CSS` is highly regarded by Norwegian `Håkon Wium Lie`, who in `1994` wanted to
    create a standard style sheet for the World Wide Web. The first `CSS` tried for
    Arena web browser. Since its initial creation, `Lie` has gone on to produce versions
    of `CSS` – `CSS1`, `CSS2`, with `Tim Berners-Lee` and `Robert Cailliau`. In its
    first decade (`1994`–`2004`), `CSS` became a web standard that had a significant
    impact on the look of the World Wide Web as we know now. `CSS3` was released in
    `1999`.


    `CSS` is one of three core technologies used on the web (other two being `HTML`
    and `JavaScript`). `CSS` stands for Cascading Style Sheets – links are actually
    in terms “cascading” and “style” describing how one style can go from one to another.


    One of various benefits of `CSS` is that more than single style can be used within
    a single document. `CSS` is used to define what `HTML` code will look. Although
    `HTML` (Hypertext Markup Language) is used to create content, including text,
    `CSS` changes the way a web page will look. Thus, depending on data they want
    to display, developer may choose to use titles and subtitle styles to ensure words
    appear on the top or the side of the page.


    ## WHY DO WE NEED CSS?


    First, applying `CSS` ensures that your web pages are consistent. If your website
    has 100 pages, imagine you have to enter code to define title sizes, layout, and
    other display data and combine all content each time you want to produce a new
    web page. Also imagine having 100-page site and being able to change one of them
    while keeping everything the same. `CSS` also makes that possible. Using `CSS`
    brings flexibility where needed, able to make changes to an individual page or
    section.


    ## WHY DO WE USE CSS?


    For a website to work properly, it must have a fast download time. Nowadays, people
    usually wait a few seconds for a website to load. Therefore, it is important to
    ensure a fast pace. For companies looking to ensure fast and smooth website information,
    `CSS` becomes key to their success.


    `CSS` is easy to maintain due to the short maintenance time. This is because single-line
    code conversion affects the entire web page. Also if upgrades are needed, it makes
    a small effort.


    You would not find many good and easy-to-use websites. One thing that is common
    to all of these websites is consistency of construction. `CSS` empowers developers
    to ensure that style features are applied consistently across every web page.


    Due to its fast speed and easy maintenance, `CSS` saves a lot of time and effort
    in the web development process due to its fast loading time. Here, little time
    ensures good performance of the designer.


    People use different smart devices to view a particular website. It can be a smartphone,
    `PC`, or laptop. For this purpose, websites are required to be compatible with
    the device. `CSS` ensures smooth operation by providing better alignment.


    You can change the location of the `HTML` tag with the help of `CSS`. You can
    set things as an image on any part of a web page as needed.


    ## DIFFERENT VERSION OF CSS


    - `CSS1` and `CSS2` (no longer applicable): Released from `W3C` as a recommendation
    in `December 1996`. This version defines the `CSS` language and the visual formatting
    model for all `HTML` tags. These were the two versions of `CSS` that are no longer
    updated or maintained.

    - `CSS2.1` (recommended): `W3C` recommendation in `May 1998` and built on `CSS1`.
    This version adds support for specific media style sheets, for example, audio
    printers and devices, downloadable fonts, object layouts, and tables. This version
    has fixed many bugs and problems in `CSS2` and is now the official, recommended
    version of `CSS`.

    - `CSS3`: `CSS3` became a `W3C` recommendation in `June 1999` and was built on
    older versions of `CSS`. It is divided into texts called `Modules`, and here each
    module has new extension features defined in `CSS2`. These versions build in `CSS2.1`,
    adding new functionality and maintaining background compliance. Some features
    are still being tested and may change in the future. Use this with caution, as
    it may cause problems with your site.


    `CSS3` is the latest standard for earlier `CSS` versions (`CSS2`). The main differences
    between `CSS2` and `CSS3` are as follows:


    - `Media Queries`

    - `Namespaces`

    - `Selectors Level 3`

    - `Color`


    `CSS4` has never become an official version.

