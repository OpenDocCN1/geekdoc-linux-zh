    ## 有用的应用程序


    这里是适用于你的 `Ubuntu` 系统的最佳应用程序列表，它们将帮助你充分利用计算机。


    *   办公效率 – Abiword, `VI`, `Emacs`, `LibreOffice`, `nano`

    *   多媒体 – `VLC`, `DeaDBeef`, `Cmus`, `AquaLung`, `MPlayer`, `Miro`

    *   网络浏览 – `Firefox`, `Chromium`, `Midori`, `W3M`

    *   创意 – `Aud`

    *   `acity`, `GIMP`

    *   其他 – `Kupfer`, `Thunderbird`, `qBittorrent`


    对于有助于提高易用性的程序，有许多不同的选择，取决于你想要实现什么。发现程序的最佳方法是在互联网上搜索你想要添加的功能。例如，如果你正在寻找一种快速打开和关闭终端的方法，你可能会遇到
    `Guake` 程序。或者如果你想在终端中使用音频，它可能会推荐 `Cmus`。找到最适合你的应用程序是 Linux 定制化方面的一部分，它让每次安装对每个用户都更具个性化。


    ## 管理


    如果你在寻找某种意义的“控制面板”，你可以从 `System Settings` 应用程序内部找到管理工具的快捷方式，如网络、打印、键盘、外观等等。某些 `Ubuntu`
    变体使用 `Settings Manager` 或仅 `Settings` 实现相同的目的。


    启动它后，将会有指向其他默认配置应用程序的链接；只需点击你需要更改的任何一项，即可获得设置几个选项的 GUI。但并不是所有管理内容都能通过 GUI 找到。大多数低级设置只能通过命令行可用，因此你需要确切知道要输入什么来编辑它们。


    例如，在 `Ubuntu` 中添加新用户需要 `adduser` 命令。通过在命令后加上用户名，终端将提示基本信息和密码。将该新用户设置为管理员的操作通过
    `usermod -aG sudo nameofuser` 完成。此外，可以使用 `deluser` 删除用户。这些选项在 GUI 中很难找到，但在终端中几秒钟内即可完成。


    “任务管理器”，或对 `Ubuntu` 内运行程序的管理也是通过终端完成的。`top` 程序标准地安装在所有（大部分）发行版，启动它会显示类似于任务管理器的所有正在运行进程列表。但默认情况下，进程列表将更新并移动，导致可能难以读取我们所需的数据。按
    `f` 键调出排序列表，用方向键导航到 `PID` 并按 `s` 设置该选项。现在使用 escape 键返回 `top`，我们现在可以使用页上键和页下键滚动列表以查看任务。例如，假设我们想关闭
    `Pidgin` 程序，因为它没有响应。在列表中找到它（或使用上述过滤命令搜索它）并记下 `PID`（进程 ID）数字。按 `q` 退出 `top`，然后输入
    `kill 4653`，显然将数字替换为 PID。在 `top` 运行的任何时候，你都可以按 `h` 查看各种操作的键盘快捷键列表。如果 `top` 太难用，可以考虑安装
    `htop`，它是该程序的“人类可读”版本。它实际上显示了整洁的 ASCII 图形，详细说明 CPU、RAM 和其他使用统计。使用 F3 搜索程序，然后使用
    F9 和 Enter 杀死它。


    至于服务，你可能注意到我们使用 `service` 命令来更改它们的状态。因此，启动 Web 服务器将通过 `service apache2 start`
    完成，重启通过将 start 替换为 restart 完成，停止通过将 start 替换为 stop 完成。通过 `service ---status-all`
    获取服务列表。服务是持续运行守护进程或后台任务。它们可以收集数据、运行如 `Bluetooth` 和 `Wi-Fi` 等服务或等待。


    ## 安全协议


    Linux 专注于安全，这有助于保持安全。一个从 UNIX 继承的特性是文件权限。每个文件有一组权限——所有者、组和权限。`chown` 命令更改文件的所有者，`chgrp`
    更改组，`chmod` 更改权限。发现文件或文件夹的权限通过输入 `ls -l` 完成。它将返回一条起困惑的行，例如 `-rw-rw--`。`R` 表示读，`W`
    代表写，第三种选项是执行的 `X`。这三组分别是所有者、组和其他。因此，我们上面的示例文件为所有者及其组设置了读写权限，但其他人只有读权限。这意味着所有者和他所属的组（很可能是
    sudo 用户）有权访问文件并更改内容，但网络或 PC 上的其他用户只能查看内容而不能编辑。脚本文件需要 `X` 才能执行，没有它就无法运行。


    大多数人只需要使用 `chmod` 命令来更改他们使用的文件的权限。我们使用命令和一组数字来设置文件的权限。数字决定实体拥有的权限，使用的数字计算如下：


    *   从数字 0 开始。

    *   增加 4 表示可读性。

    *   增加 2 表示可写性。

    *   增加 1 表示可执行性。

    *   你剩下的数字决定了权限。


    6 是读/写，但 1 仅可执行。5 是可读可执行的但不可更改。更保守的权限集将是 775。利用安全权限以实现安全计算。


