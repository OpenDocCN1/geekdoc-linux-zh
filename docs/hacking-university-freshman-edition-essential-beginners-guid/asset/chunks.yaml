    \ 安装光盘，以防你决定切换回来。如果你确实已准备好切换，请继续。\n\n在安装介质仍然插入的情况下，启动电脑。你看到的第一个屏幕是 `BIOS / UEFI`\
    \ 的自检（POST）屏幕，它会显示一个你应该按下的键盘按键以进入设置。这个屏幕在每次启动时都会显示，但你可能并没有注意它。按下指定的按键进入 `BIOS`\
    \ 设置。如果你操作太慢，屏幕将会消失，你常用的操作系统将开始加载。如果发生这种情况，只需关机电脑并重试即可。\n\n一旦进入 `BIOS / UEFI`，你必须导航到“启动顺序”（boot\
    \ order）设置。每台电脑的 `BIOS / UEFI` 略有不同，因此我们无法详细解释这一过程。但通常情况下，你可以按照屏幕底部的按钮提示来了解如何导航。到达启动顺序设置后，将你的启动介质放在列表的最顶部。例如，如果你使用的是\
    \ USB 驱动器，你会看到它的名称并将其移至列表顶部。这些设置控制了 PC 搜索操作系统的顺序。将我们的启动介质放在列表顶部，它将启动到我们下载的 Linux\
    \ 镜像，而不是常用的操作系统。保存你的设置并重启电脑。如果一切操作正确，电脑将开始启动进入 `Ubuntu`。\n\n但如果出现问题，请尝试通过以下提示进行故障排除：\n\
    \n*   启动的是主操作系统而非 Linux – 你可能没有保存将备用启动介质放在列表顶部的设置。PC 仍然默认从内部 `HDD` 启动。\n*   “未找到启动介质”（No\
    \ boot media found）—— 你是在介质上“拖放”了 Linux 镜像而不是写入它？如果不显式告诉电脑它是可启动的，它将不知道如何处理介质上的数据文件。或者，你下载的镜像损坏，或者写入不完整。尝试重新下载镜像并再次进行安装。\n\
    *   “内核恐”（Kernel Panic）—— 启动过程出现问题。请参上文关于安装损坏的可能性。否则，你尝试安装的镜像可能与你的硬件不兼容。如果你看到任何其他错误信息，请在互联网上搜索它们。对于预装电脑和笔记本电脑，搜索型号名称和\
    \ Linux 以查找其他用户的经验。最后，你可能尝试在 32 位的电脑上安装 64 位镜像。在下次下载镜像时，请专门选择 32 位镜像。\n*   “从\
    \ CD-ROM 读取数据错误”（Problem reading data from CD-ROM…）– 尝试使用不同的安装介质，因为某些发行版不再支持 CD\
    \ 和 DVD 安装。建议使用 USB 驱动器。\n*   PC 似乎启动了，但屏幕上没有任何 – 如果你使用的是独立显卡（相对于 CPU 的集成显），Linux\
    \ 可能无法完全识别它。请将显示器直接插入主板而不是显卡。\n\n但大多数此类问题都是罕见的，或者仅仅是由于用户操作失误。Linux 具有很高的兼容性，而且在初始安装之后，相对容易安装/使用。典型用户此时应该已经成功启动了\
    \ `Ubuntu`，他们将获得一个可以使用的计算环境。\n\n你看到的桌面被称为“现场版”（Live CD），这基本上是操作系统及其工作方式的演示。你尚未将操作系统实际安装到硬盘中，因为它仍然直接从你的启动介质运行。这是一个让你测试\
    \ Linux 而无需实际移除主操作系统的机会，所以请利用这个机会探索 Linux 发行版是如何工作的。\n\n## Ubuntu 基础\n\n与 Windows\
    \ 类似，`Ubuntu` 拥有桌面图形用户界面。窗口内打开的应用程序可以通过顶栏进行最大化、最小化、关闭和移动。Ubuntu 也有某种类似于“任务栏”，其功能与\
    \ Windows 的对应物非常相似——图标代表了点击即可启动的程序。任务栏上的“Windows 按钮”（称为 Dash 按钮）用于打开搜索功能，你可以在其中输入计算机程序或文件的名称来快速启动它们。\n\
    \n此外，屏幕顶部有一条栏，作用类似于其他操作系统的“菜单”栏。当程序处于激活状态，这里将出现如“文件”、“编辑”、“帮助”等下拉菜单。\n\n除了功能上一些细微的差异外，Ubuntu\
    \ 的运行方式非常熟悉。事实上，你可能已经在其他操作系统使用的许多程序（例如 `Firefox`）在 Linux 发行版中也是可用的，有时甚至是预装。通过足够的实验和练习，你将能够像专业人士一样操作\
    \ `Ubuntu` 的图形界面。继续探索系统吧，如果你准备好用这个 Linux 替换你的主操作系统，请继续下去。\n\n## 安装 Linux\n\n在桌面上，你会看到一个“安装\
    \ Ubuntu 16.04 LTS”图标。双击它将启动一个让安装变得非常简单的应用程序。如果你没有连接互联网，请现在插入以太网线或通过右上角的图标连接 Wi-Fi。选择你的语言并点击“继续”。下一个提示将询问你是否希望在操作系统安装期间下载更新并安装第三方软件。这些选项对初学者是强烈建议的，因此勾选它们并点击“继续”。\n\
    \n应用程序将进入另一个屏幕，询问你的安装方法。有多种选项，例如完全擦除磁盘、与你的主操作系统一起安装，或更新之前的 Linux 版本。选择一个最适合你的选项。如果你对完全切换仍犹豫不决，请选择将\
    \ `Ubuntu` 作为次要操作系统。该选项将允许你在 `BIOS` 界面之后选择进入哪种操作系统。尽管如此，选择你的选项并点击“现在安装”。\n\n在\
    \ `Ubuntu` 安装期间，你可以指定其他选项，例如时区、计算机名称、帐户名称和密码。整个安装过程不会花费太长时间，但耗的时间足够让你的电脑插上电源（如果是笔记本电脑）。完成后，操作系统将需要重启。恭喜，你现在电脑上有了一个可用的\
    \ Linux 系统。\n\n 管理硬件与软件\n\nLinux 中的硬件管理实际上比 Windows 硬件要容易得多。无需为设备下载单独的驱动程序，大多数驱动程序内置在操作系统本身中。这意味着大多数流行设备仅需安装后，无需其他后续步骤即可使用。打印机、网络、硬盘和其他常见设备都包含在内——在\
    \ Linux 上通常不需要折腾驱动程序。\n\n"
