- fmt: "\n# Security\n\nSecurity within Linux expands beyond just permissions. Ensure\
    \ that you practice good security practices, and that you are following common\
    \ sense in regards to security- install only needed programs, do not follow all\
    \ internet advice, do not use `sudo` too often, use passwords, use encrypted networks,\
    \ keep software up to date, encrypt important files, and make regular backups.\
    \ As a final word of advice, look into using a distribution with `SELinux`, a\
    \ module that supports AC and other security policies.\n\n# Scripting\n\n`Bash`\
    \ is the “programming language” or the terminal. When we type a command, we are\
    \ doing so within `bash`. A script is a list of `bash` commands that execute in\
    \ order, meaning we can create a script with a list of commands and run it to\
    \ save time or automate terminal tasks that we normally have to type. As an intermediate\
    \ and advanced Linux administrator, you can use scripts to greatly shorten the\
    \ amount of work required for repetitive or constantly running tasks. \n\nTo start\
    \ a script, create a new file `script.sh` within `nano`. The first line must always\
    \ be `#!/bin/bash` to mark it as a `bash` script. Type the following lines for\
    \ your first script:\n\n```\necho “What is your name?”\nread name\necho “Hey,\
    \ $name. Here is your current directory, followed by the files.”\npwd\nls\n```\n\
    \nSave the script. Now we have to set the permissions to allow it to be run. Use\
    \ `sudo chmod 777 script.sh`, and then run the script with `./script.sh`. So long\
    \ as you copied the script exactly, it will ask for your name and then show you\
    \ your directory and files. Take the concept and expand it further in your own\
    \ scripts. You can run commands from installed programs as well, so you can write\
    \ a script that automatically joins a domain, or one that connects to the network\
    \ specified. Shutting down remote computers is a great automatic task as well.\
    \ \n\nScripts can either be run manually or set to execute at certain times. To\
    \ run a certain script every time the user logs in, open the “startup applications”\
    \ program from dash and create a new app with the script as the source. Now every\
    \ time that user logs in the script will run automatically. This is useful for\
    \ setting up certain options or starting background services without requiring\
    \ the user to do it themselves. \n\nScheduling tasks for a certain time can be\
    \ done with the `Cron` system daemon. It is installed be default on some systems,\
    \ but if not `sudo apt-get install cron` can be used. Start the service with `service\
    \ cron start` and create a new crontab file with `crontab -e`. Select `nano` as\
    \ your text editor. At the bottom of the created file, add a new line with our\
    \ scheduled task. The format goes as follows:\n\n`minute, hour, day, month, weekday,\
    \ command`\n\nAnd we format it with these options to specify when to run the command.\
    \ Time numbers start with 0, so the hours range from 0 to 23 and minutes are from\
    \ 0 to 59. Replace any option with an asterick to specify that it will run on\
    \ any value. Pay attention to these examples:\n\n```\n0 12 * * * ~/script.sh\n\
    ```\nThis will run `script.sh` found in the Home directory every day at noon.\n\
    \n```\n30 18 25 12 * /usr/bin/scripts/test.sh\n```\nAnd this will run `test.sh`\
    \ within the `/usr/bin/scripts` directory at 6:30 on Christmas day every year.\
    \ \n\nConclusively, scripting and automating scripts are fantastic ways to take\
    \ administrative control of regularly occurring tasks. Continue writing scripts,\
    \ or look up examples online to see how your computing experience can be made\
    \ easier with `bash`.\n\n# Advanced Terminal Concepts\n\nMastering Linux comes\
    \ down to intimate comprehension of the tools available in the OS and how to utilize\
    \ them. Many of the topics discussed in this chapter will focus on more tasks\
    \ and how to accomplish them, or a few QOL improvements to the OS in general.\n\
    \nCompression and decompression of files often confuses Linux beginners. The tools\
    \ are typically already installed, but the command line must be used. Furthermore,\
    \ the strange `.tar` and `.gz` file-types are Linux-specific formats that you\
    \ might often come across. All files can be unzipped or zipped with the `gzip`\
    \ tool. Preinstalled on Ubuntu, we access it with the `tar` command. To compress\
    \ a folder and the files contained within, navigate to it in terminal and type\
    \ `tar –czvf name.tar.gz foldername`. `C` stands for “create”, `z` means “compress\
    \ (gzip)”, `v` is for “verbose”, and `f` allows filename specification. If you\
    \ want more compression (but at the cost of time), zip the folder with `gzip2`\
    \ by replacing the `-z` switch with the `-j` switch instead. \n\nNow extracting\
    \ that same archive can be done with `tar –xzvf name.tar.gz`. You will notice\
    \ that the `-c` was replaced with an `-x`, and this indicates extraction. Once\
    \ again if you are dealing with `bzip2` files use the `-j` switch instead.\n\n\
    Continuing with advanced terminal concepts, let us talk about a few quality tips\
    \ and tricks that can save you time in the terminal. When typing a command or\
    \ file name, press tab halfway through. This feature, tab completion, will guess\
    \ what you are attempting to type and fill in the rest of the phrase. For files\
    \ it will complete the name as shown in the directory, or complete a command by\
    \ considering what you are trying to do. Linux experts and anyone that has to\
    \ use the terminal regularly may seem as they are typing exactly what they want\
    \ with speed, but they are actually using tab completion. \n\nUsers, especially\
    \ administrators, will spend a decent amount of time with the `sudo` command because\
    \ instructions require elevated privileges to run. But when typing out a long\
    \ command and forgetting to type `sudo`, you will be angered at having to type\
    \ it again. Instead simply type `sudo !!`, shorthand for “super user do again”.\
    \ It generously saves from typing an entire command. Another method of repeating\
    \ commands is to use the up and down arrows. Pressing up continuously cycles through\
    \ previously commands. You can also edit the commands with the left and right\
    \ arrows to change the text within.\n\nAnd the most requested terminal tip involves\
    \ copy and pasting. Attempting to paste a line into the terminal results in the\
    \ strange character `^v`. The keyboard shortcut is not configured to work in the\
    \ terminal, and that is why the strange combination is displayed. To actually\
    \ paste, right click and select the option; or use the key combination `shift+insert`.\
    \ Copy in the same way, but with `ctrl+insert`. While it might be okay to copy\
    \ and paste terminal commands from the Internet (provided you understand the risk\
    \ and know what they are doing), do not try to paste from this publication. The\
    \ formatting introduced through the medium in which you are reading it might have\
    \ inserted special characters that are not recognized by the terminal, so it is\
    \ best if you do not copy and paste, but rather you should type manually any commands\
    \ presented.\n\nLinux has a hidden feature that not many users know about. Files\
    \ are displayed to the user when you visit that directory or type `ls`, but actually\
    \ not all of the files are viewable this way. In Linux if you name a file with\
    \ a period as the first character it will be marked as hidden. Hidden files are\
    \ not normally visible by common users, and it acts as a way to protect configuration\
    \ files from accidental editing/deleting/so forth. To see those files, we only\
    \ need to add the `-a` tag to our `ls` search. In the GUI press `ctrl+h` in a\
    \ directory to reveal the secret content. And as you create scripts and other\
    \ configuration files consider hiding them with the period as a form of user protection.\n\
    \nAny command within terminal can be interrupted or quit with the `ctrl+d` key\
    \ combination. Use it to stop a lengthy process or to exit out of a program/command\
    \ that you do not understand.\n"
  raw: 'Security within Linux expands beyond just permissions.  Ensure that you practice
    good security practices, and that you are following common sense in regards to
    security- install only needed programs, do not follow all internet advice, do
    not use sudo too often, use passwords, use encrypted networks, keep software up
    to date, encrypt important files, and make regular backups.  As a final word of
    advice, look into using a distribution with SELinux, a module that supports AC
    and other security policies.  


    Scripting


    Bash is the “programming language” or the terminal.  When we type a command, we
    are doing so within bash.  A script is a list of bash commands that execute in
    order, meaning we can create a script with a list of commands and run it to save
    time or automate terminal tasks that we normally have to type.  As an intermediate
    and advanced Linux administrator, you can use scripts to greatly shorten the amount
    of work required for repetitive or constantly running tasks. 


    To start a script, create a new file “script.sh” within nano.  The first line
    must always be “#!/bin/bash” to mark it as a bash script.  Type the following
    lines for your first script.


    echo “What is your name?”


    read name


    echo “Hey, $name. Here is your current directory, followed by the files.”


    Pwd


    Ls


    Save the script.  Now we have to set the permissions to allow it to be run.  Use
    “sudo chmod 777 script.sh”, and then run the script with “./script.sh”.  So long
    as you copied the script exactly, it will ask for your name and then show you
    your directory and files.  Take the concept and expand it further in your own
    scripts.  You can run commands from installed programs as well, so you can write
    a script that automatically joins a domain, or one that connects to the network
    specified.  Shutting down remote computers is a great automatic task as well.


    Scripts can either be run manually or set to execute at certain times.  To run
    a certain script every time the user logs in, open the “startup applications”
    program from dash and create a new app with the script as the source.  Now every
    time that user logs in the script will run automatically.  This is useful for
    setting up certain options or starting background services without requiring the
    user to do it themselves. 


    Scheduling tasks for a certain time can be done with the Cron system daemon. 
    It is installed be default on some systems, but if not “sudo apt-get install cron”
    can be used.  Start the service with “service cron start” and create a new crontab
    file with “crontab -e”.  Select nano as your text editor.  At the bottom of the
    created file, add a new line with our scheduled task.  The format goes as follows:


    minute, hour, day, month, weekday, command


    And we format it with these options to specify when to run the command.  Time
    numbers start with 0, so the hours range from 0 to 23 and minutes are from 0 to
    59.  Replace any option with an asterick to specify that it will run on any value. 
    Pay attention to these examples:


    0 12 * * * ~/script.sh


    This will run the script.sh found in the Home directory every day at noon.


    30 18 25 12 * /usr/bin/scripts/test.sh


    And this will run test.sh within the /usr/bin/scripts directory at 6:30 on Christmas
    day every year. 


    Conclusively, scripting and automating scripts are fantastic ways to take administrative
    control of regularly occurring tasks.  Continue writing scripts, or look up examples
    online to see how your computing experience can be made easier with bash. 


    Advanced Terminal Concepts


    Mastering Linux comes down to intimate comprehension of the tools available in
    the OS and how to utilize them.  Many of the topics discussed in this chapter
    will focus on more tasks and how to accomplish them, or a few QOL improvements
    to the OS in general.


    Compression and decompression of files often confuses Linux beginners.  The tools
    are typically already installed, but the command line must be used.  Furthermore,
    the strange .tar and .gz file-types are Linux-specific formats that you might
    often come across.  All files can be unzipped or zipped with the gzip tool.  Preinstalled
    on Ubuntu, we access it with the “tar” command.  To compress a folder and the
    files contained within, navigate to it in terminal and type “tar –czvf name.tar.gz
    foldername”.  C stands for “create”, z means “compress (gzip)”, v is for “verbose”,
    and f allows filename specification.  If you want more compression (but at the
    cost of time), zip the folder with gzip2 by replacing the –z switch with the –j
    switch instead. 


    Now extracting that same archive can be done with “tar –xzvf name.tar.gz”.  You
    will notice that the –c was replaced with an –x, and this indicates extraction. 
    Once again if you are dealing with bzip2 files use the –j switch instead.


    Continuing with advanced terminal concepts, let us talk about a few quality tips
    and tricks that can save you time in the terminal.  When typing a command or file
    name, press tab halfway through.  This feature, tab completion, will guess what
    you are attempting to type and fill in the rest of the phrase.  For files it will
    complete the name as shown in the directory, or complete a command by considering
    what you are trying to do.  Linux experts and anyone that has to use the terminal
    regularly may seem as though they are typing exactly what they want with extreme
    accuracy and speed, but they are actually just using tab completion. 


    Users, especially administrators, will spend a decent amount of time with the
    sudo command because their instructions require elevated privileges to run.  But
    when typing out a long command and forgetting to type sudo, you will be angered
    at having to type it again.  Instead simply type “sudo !!”, shorthand for “super
    user do again”.  It generously saves from typing an entire command again.


    Another method of repeating commands is to use the up and down arrows.  Pressing
    up continuously cycles through previously typed commands.  You can also edit the
    commands with the left and right arrows to change the text contained within. 


    And the most requested terminal tip involves copy and pasting.  Attempting to
    paste a line into the terminal results in the strange character ^v. The keyboard
    shortcut is not configured to work in the terminal, and that is why the strange
    combination is displayed.  To actually paste, right click and select the option;
    or use the key combination shift+insert.  Copy in the same way, but with ctrl+insert
    instead.  While it might be okay to copy and paste terminal commands from the
    Internet (provided you understand the risk and know what they are doing in the
    command), do not try to paste from this publication.  The formatting introduced
    through the medium in which you are reading it might have inserted special characters
    that are not recognized by the terminal, so it is best if you do not copy and
    paste, but rather you should type manually any commands presented. 


    Linux has a hidden feature that not many users know about.  Files are displayed
    to the user when you visit that directory or type ls, but actually not all of
    the files are viewable this way.  In Linux if you name a file with a period as
    the first character it will be marked as hidden.  Hidden files are not normally
    visible by common users, and it acts as a way to protect configuration files from
    accidental editing/deleting/so forth.  To see those files, we only need to add
    the –a tag to our ls search.  In the GUI press ctrl+h in a directory to reveal
    the secret content.  And as you create scripts and other configuration files consider
    hiding them with the period as a form of user protection.


    Any command within terminal can be interrupted or quit with the ctrl+d key combination. 
    Use it to stop a lengthy process or to exit out of a program/command that you
    do not understand. '
