    # 安全


    Linux 内部的安全不仅限于权限。请确保你遵循良好的安全实践，并就安全方面遵循常识——即只安装需要的程序，不要盲目遵循网上的建议，不要频繁使用 `sudo`，使用密码，使用加密网络，保持软件更新，加密重要文件，并定期备份。最后的一点建议是，考虑使用带有
    `SELinux` 的发行版，它是一个支持 AC（强制访问控制）和其他安全策略的模块。


    # 脚本编写


    `Bash` 是终端的“编程语言”。当我们输入命令时，我们是在 `bash` 中进行操作。脚本是一系列按顺序执行的 `bash` 命令列表，这意味着我们可以创建一个包含命令列表的脚本并运行它，以节省时间或自动化我们通常需要输入的终端任务。作为一名中高级
    Linux 管理员，你可以使用脚本极地缩短重复性或持续运行任务的工作量。


    要启动脚本，请在 `nano` 中创建一个新文件 `script.sh`。第一行必须是 `#!/bin/bash` 以将其标记为 `bash` 脚本。为你的第一个脚本输入以下行：


    ```

    echo “What is your name?”

    read name

    echo “Hey, $name. Here is your current directory, followed by the files.”

    pwd

    ls

    ```


    保存脚本。现在我们必须设置权限允许其运行。使用 `sudo chmod 777 script.sh`，然后使用 `./script.sh` 运行。只要你完整复制了脚本，它就会询问你的名字，然后显示你的目录和文件。借鉴这个概念并在你自己的脚本中进一步扩展。你也可以运行已安装程序的命令，因此你可以编写一个自动加入域的脚本，或者编写一个连接到指定网络的脚本。关闭远程计算机也是一项很棒的自动化任务。


    脚本可以手动运行也可以设置为在特定时间执行。若要在用户每次登录时运行某个脚本，请从 dash（启动栏）打开“启动应用程序”程序，并以脚本为源创建一个新应用。现在每当该用户登录时，脚本都会自动运行。这对于设置某些选项或启动后台服务而无需要求用户自己操作非常有用。


    在特定安排任务可以通过 `Cron` 系统守护进程来完成。它在某些系统上默认安装，但如果没有安装，可以使用 `sudo apt-get install cron`。使用
    `service cron start` 启动服务，并使用 `crontab -e` 创建一个新的 crontab 文件。选择 `nano` 作为你的文本编辑器。在创建的文件底部，添加包含我们调度任务的新行。格式如下：


    `分钟, 时, 日, 月, 星期, 命令`


    我们通过这些选项进行格式化以指定运行命令的时间。时间数字从 0 开始，因此小时范围为 0 到 23，分钟为 0 到 59。用星号 * 替换任何选项以指定它将在任何值运行时。请注意这些示例：


    ```

    0 12 * * * ~/script.sh

    ```

    这将在每天中午运行位于主目录下的 `script.sh`。


    ```

    30 18 25 12 * /usr/bin/scripts/test.sh

    ```

    这将在每年圣诞节的 6:30 运行 `/usr/bin/scripts` 目录下的 `test.sh`。


    总之，脚本编写和脚本自动化是接管定期发生任务极好的方式。继续编写脚本，或在网上查找示例，查看 `bash` 如何让你的计算体验变得更简单。


    # 高级终端概念


    精通 Linux 归结为对操作系统中可用工具的深入理解以及如何利用它们。本章讨论的许多主题将重点关注更多任务以及如何完成它们，或者对操作系统进行的一些通用质量（QOL）改进。


    文件的压缩和解压缩经常让 Linux 初学者感到困惑。工具通常已经安装，但必须使用命令行。此外，奇怪的 `.tar` 和 `.gz` 文件类型是 Linux
    特有的格式，你可能会经常遇到。所有文件都可以用 `gzip` 工具解压缩或压缩。Ubuntu 预装了它，我们通过 `tar` 命令访问它。要压缩文件夹及其包含的文件，在终端中进入该目录并输入
    `tar –czvf name.tar.gz foldername`。`C` 代表“create”（创建），`z` 表示“compress (gzip)”（`v`
    用于 verbose（详细），`f` 允许指定文件名。如果你需要更高的压缩率（但代价是时间），可以通过将 `-z` 开关替换为 `-j` 开关使用 `gzip2`
    来压缩文件夹。


    现在可以使用 `tar –xzvf name.tar.gz` 提取相同的归包。你会发现 `-c` 被替换成了 `-x`，这表示提取。再次，如果你正在处理 `bzip2`
    文件，请使用 `-j` 开关。


    继续高级终端概念，让我们谈谈一些可以在终端中节省时间的质量技巧和技巧。在输入命令或文件名时，在途中按下 Tab 键。此功能——Tab 补全（tab completion），将猜测你正在尝试输入的内容并填充短语的剩余部分。对于文件，它将按目录所示的形式完成名称，或通过考虑你正在尝试的操作来完成命令。Linux
    专家和任何经常使用终端的人看起来像是在极快速地输入他们想要的内容，但他们实际上是在使用 Tab 补全。


    用户（特别是管理员）会在 `sudo` 命令上花费大量时间，因为指令需要特权权限。但当你输入一个长命令并忘记输入 `sudo` 时，你会为必须重新输入而烦恼。只需输入
    `sudo !!`，它是“再次执行超级用户”的简写。这非常方便。另一种重复命令的方法是使用上下箭头。连续向上按可以循环之前的命令。你还可以使用左右箭头编辑命令中的文本。


    而且最常用的终端提示涉及复制和粘贴。尝试向终端粘贴一个行时会产生奇怪的字符 `^v`。该快捷键没有配置在终端中工作，这就是为什么显示了该组合。要实际粘贴，右键点击并选择该选项；或使用键组合
    `shift+insert`。复制方法相同，使用 `ctrl+insert`。虽然从互联网复制粘贴终端命令可能是安全的（只要你理解风险并知道它们做什么），但不要尝试从本文中粘贴。通过你正在阅读的媒介引入的格式可能包含了终端无法识别的特殊字符，因此最好不要复制粘贴，而是应该手动输入呈现的任何命令。


    终端中的任何命令都可以通过 `ctrl+d` 键组合来中断或退出。使用它来停止长时间运行的进程或退出你不熟悉的程序/命令。


