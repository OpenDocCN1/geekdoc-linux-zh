    `apt`（高级软件包工具）是 Ubuntu 中用于管理应用程序的命令。其他发行版可能使用自己的工具，但 `apt` 因其庞大的软件库和简单的命令而被广泛使用。使用
    `apt-get install` 格式安装软件包，在其中指定你想要安装的程序名称。在上面的示例中，我们通过包名 `chromium-browser` 指定了
    Chromium 程序。鉴于你并不认识每一个包名，另一个命令 `apt-cache search` 可用于查找与所提供字符串匹配的包名。因此，执行 `apt-cache
    search chromium` 将显示 `chromium-browser`，你可以指定正确的名称进行安装。


    `apt` 的用处不仅于此，你还可以使用几条命令来更新系统上的每一个应用程序。使用 `apt-get update` 刷新软件库，然后使用 `apt-get
    upgrade` 让每个应用程序自行升级到最新版本。Windows OS 用户应该对这种简单的过程感到羡慕，因为更新 Windows 程序通常需要卸载并重新安装最新版本。


    随着时间的推移，你可能需要更新 Ubuntu 版本。每年都会发布新版本，可以通过 `apt-get dist-upgrade` 进行安装。保持最新的修复和新增功能，可以确保你的
    Linux 系统长期健康地运行。你可能已经注意到，安装和更新系统不需要重启；这一特性有助于 Linux 计算机实现长时间运行并保持稳定性。最后，删除应用程序通过
    `apt-get remove` 后接包名来完成。


    要运行我们安装的程序，我们可以从启动栏（dash）中搜索它们，也可以直接在终端中输入包名。输入 `chromium-browser` 启动程序与双击其图标完全相同。有些程序必须通过仅输入包名来从命令行启动，因为这些包不会出现在启动搜索中。总的来说，利用终端是一项节省时间的方法，也是摆脱缓慢笨重的图形用户界面的极佳方式。


    软件包的易于安装和管理是 Linux 的一项非常实用的功能——精通它将提升你的体验。安装软件包还有第三种方法，从网上下载并运行 `.deb` 文件。某些软件是以这种格式打包的，它们的作用类似于
    `.exe` 文件，只需双击即可开始安装过程。


    ## 更多终端命令


    这里有几个你应该记住并在系统中运用的更多基础终端命令。完全理解基础知识将为你后续的构建打下坚实的基础。


    *   `cp` – `cp image1.jpg image2.jpg` – 将第一个参数复制（并重命名）到第二个参数。使用 `-r` 切换拷贝目录。

    *   `mv` – `mv cat.jpg /home/Pictures` – 将指定的文件移动到给定目录。

    *   `shutdown` – `shutdown –h now` – 关闭计算机。`-h` 是表示“停止(halt)”的标签，但你也可以使用 `-r`
    重启。`now` 指执行的时间。

    *   `date` – `date` – 显示当前日期和时间。

    *   `free` – `free –g` – 显示程序的 RAM 使用情况。

    *   `du` – `du –h` – 显示硬盘（HDD）使用情况。

    *   `ps` – `ps` – 显示占用 CPU 时间的活动进程。

    *   `touch` – `touch memo.txt` – 用于在当前目录下创建一个指定名称的新空文件。

    *   `ifconfig` – `ifconfig` – Linux 版的 `ipconfig`，用于显示网络信息。


    某些命令带有相关的“标签”或“开关”。这些是以破折号开头的字母。它们的功能各异，学习为了什么目的使用哪些开关最好的方法是查看该命令的帮助页（manual pages）。查看高级章节以打开手册。


    命令行中最实用的程序之一 `nano` 是一个简单的文本编辑器，可用于编辑文件并快速更改设置或脚本。通过在命令行输入 `nano` 访问它。你可以根据需要输入文件名，然后按
    `ctrl+x` 保存并退出。在保存时，你将指定与其相关的名称和文件扩展；`notes.txt` 将创建一个名为 `notes` 的文本文件。或者，你也可以通过
    `nano notes.txt` 来编辑文件。在那个示例中，我们在编辑器中打开 notes 并以可编辑的状态显示其内容。


    `Nano` 可能非常简单，但它对于快速更改和创建文件来说，无疑是强大且节省时间的。


    ## 连接到 Windows / Mac 计算机


    Windows 和 OSX 计算机内置了网络功能，如工作组、域、共享等。尽管如此，将 Linux 计算机集成到由 Windows 服务器主导的网络基础设施中相当容易，正确的设置将允许你看到
    Windows 共享并加入公司域。


    相互通信的第一步是安装 `samba` 软件包。可以通过软件中心找到它，或者输入 `sudo apt-get install samba` 来获取并安装必要的软件。


    从你的 Ubuntu 机器向其他计算机共享文件涉及创建一个 samba 共享。Samba 运行在与其他流行的文件共享方法相同的协议上，因此从 Ubuntu
    共享的文件可以轻松在 Windows 上看到。安装 samba 后，使用 `sudo nano /etc/samba/smb.conf` 开始编辑配置文件。


    ```

    [share]

    comment = File Share from Ubuntu

    path = /srv/samba/share

    browsable = yes

    guest ok = yes

    read only = no

    create mask = 0755

    ```


    现在，创建 `path` 中指定的文件夹（`sudo mkdir -p /srv/samba/share`）并设置权限（`sudo chown nobody:nogroup
    /srv/samba/`），以便任何人访问其内容。将你想共享的文件放入该目录，然后重启服务（`sudo restart smbd, sudo restart
    nmbd`）使共享生效。最后，登录另一台计算机并导航到网络共享。在 Windows 中，它们将出现在文件管理器的左面板。如果共享没有自动出现，在文件路径框中输入
    IP（通过 `ifconfig` 找到 Ubuntu IP）。你现在可以从操作系统访问 Ubuntu 的文件。


    你可能还需要在 Ubuntu 计算机查看来自操作系统的文件。首先，打开 Ubuntu 文件管理器。从菜单栏点击“文件”，然后选择“连接服务器”。在结果框中，输入你想访问的共享
    URL。它可以是 FTP 地址（`ftp://ftp.test.com`）、HTTP 地址（`http://test.com`）或共享地址（`smb://share/Folder`）。在不需要任何额外硬件或设置的情况下，你可以通过这种方式查看文件。


    最后，加入 Active Directory 等域允许你的计算机与网络上的其他操作系统交互并完成其他面向业务的任务。无论你拥有的是小型家庭网络，还是将 Linux
    计算机加入公司域，过程都是一样的。安装一些额外的包（`realmd, sssd, ssd-tools, samba-common, samba-common-bin,
    samba-libs, krb5-user, adcli, packagekit`）。在安装它们时，它会要求输入域名。用全大写输入。执行 `kinit -V
    adminname` 将该名称替换为域中的实际管理员账户名称。输入密码后，你就通过了域的身份验证。现在加入域的操作通过执行 `realm --verbose
    join -U adminmame domainname.loc` 完成。


