    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥全部效率。因为尽管你的显卡在 Linux 下默认可以工作，但其内部秘密且往往被隐藏的技术只有通过该公司的软件才能被充分利用。在
    Ubuntu 上，这个过程非常简单——打开“附加驱动”（additional drivers）应用程序并让操作系统为你搜索。在确定你拥有这些设备后，它会询问你想要使用哪个版本的驱动。按照屏幕上的任何提示启用第三方驱动。对于未出现的设备，请在制造商的网站上进行网络研究，确定他们是否发布了你可以下载的特定
    Linux 驱动。


    软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 有一种类似于应用商店，你可以在其中搜索与设备兼容的应用程序仓库，只需点击几次即可下载并安装。只需在
    Dash 启动器搜索“Ubuntu 软件中心”（Ubuntu Software Center）即可打开应用程序。在那里，你可以浏览“游戏”（Games）、“办公”（Office）或“系统”（System）等类别的程序列表，也可以直接按名称搜索。找到程序后，点击它，然后点击“安装”（install）将下载加入队列。在验证身份后，软件将自动下载并安装。此后，可以通过在
    Dash 中搜索来运行该应用程序。


    安装软件的另一种方法是通过终端，我们稍后会讨论。Ubuntu 并不完全限于应用商店中的软件，因为从互联网下载的程序也可以安装。再次，我们将在讨论完终端后提到这个主题。


    总的来说，在 Ubuntu 中管理硬件和软件是非常毫不费力的。无论是安装新硬件设备还是下载流行程序，Linux 发行版都能让你的计算体验毫无故障。这并不是说
    Linux 完全是为初学者设计的，因为我们将学习，Linux 绝对是高级用户和经验丰富的管理员的绝选择。


    # 命令行 / 终端


    在现代计算机之前，硬件和软件完全通过键盘进行交互。鼠标带来了图形化界面并简化了流程，但许多功能仍然保持纯文本形式，以避免向终端用户呈现复杂的选项。在 Linux
    中，这一过程一直持续今天。大多数发行版都存在 GUI，但每个 Linux 发行版也内置了基于文本的界面，可以在其中输入并执行强大的命令。将终端想象为一个得强大的命令行提示符，因为你完全可以通过终端单独使用你的计算机。拥有足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。


    通过 Dash 启动或使用键盘快捷键 `Ctrl+Alt+T` 启动终端。一个紫色窗口将打开并等待你的输入。你可以输入命令并按回车激活它。对于我们的第一个命令，输入
    `ls`。它是 list（列表）的缩写，将显示当前目录下的所有文件。你将看到 `Home`（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入
    `pwd` 来打印工作目录并显示你当前浏览的文件夹名称。在学习命令时，将它们记录下来有助于更好地内化它们的用法。


    ## 管理目录


    目录（Directories）是文件夹的另一个名称，它们的工作方式与其他操作系统相同。文件夹存放文件，你必须当前访问某个目录才能与其中的文件进行交互。你可以使用终端命令
    `cd` 来更改目录并在文件系统中移动。例如，在 `Home` 文件夹中输入 `cd Desktop` 将带你进入该文件夹。现在使用 `ls` 将不会显示任何内容（除非你向桌面上添加了文件）。要退回上一级，输入
    `cd ..`。按照这种方式在文件系统中练习导航；`cd` 进入目录并使用 `ls` 查看文件。


    由于你正在输入命令，Linux 期望你的输入是精确的。如果你拼错了命令，它将无法工作。（注：原文此处后续有大量重复内容，译文已按核心逻辑处理）。

