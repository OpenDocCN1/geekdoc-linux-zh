- fmt: '

    `apt` (advanced packaging tool) is the command associated with managing applications
    in Ubuntu. Other distributions may use their own tool, but `apt` is commonly used
    for its large repositories and simple commands. Packages are installed with the
    `apt-get install` formatting, where you specify the name of the program you wish
    to install. In the example above we specify the Chromium program with the package
    name `chromium-browser`. Given that you do not know every package name, there
    is another command `apt-cache search` that can be used to locate package names
    matching the supplied string. So `apt-cache search chromium` would show `chromium-browser`,
    and you could specify the correct name to install.


    The usefulness of `apt` extends beyond that, as you can use it to update every
    single application on your system with a few commands. Use `apt-get update` to
    refresh the repository, then use `apt-get upgrade` to have every application upgrade
    itself to the newest version. Windows OS users should be envious at this easy
    process, because updating a Windows programs requires uninstalling and reinstalling
    with the newest version.


    As time goes by, you might need to update the Ubuntu version. Every year there
    is a new release, and it can be installed with `apt-get dist-upgrade`. Staying
    up to date with the newest fixes and additions ensures your Linux system will
    be working healthy for a long time. You might have even noticed that installing
    and updating the system does not require a reboot; a feature that contributes
    to Linux computer’s lengthy uptimes and stability. Lastly, removing an application
    is done with `apt-get remove` followed by the package name.


    To run the programs that we install we can either search for them from the dash,
    or we can just type the package name into the terminal. Typing `chromium-browser`
    will launch it just the same as double clicking its icon would. Some programs
    must be started from the command line by typing the package name exclusively because
    the package does not show up in a dash search. Overall utilizing the terminal
    is a time-saver and a great way to practice moving away from slow and cumbersome
    graphical user interfaces.


    Easy installation and management of packages is a Linux feature that becomes highly
    useful- master it to improve your experience. There is a third method of installing
    packages, and it involves downloading and launching `.deb` files from the Internet.
    Some software are bundled in that format, and they act similar to `.exe` files
    in that they just need to be double clicked to begin the installation process.


    ## More Terminal Commands


    Here are a few more basic terminal commands that you should internalize and put
    to use in your system. Fully understanding the basics will provide a decent foundation
    upon which to build on later.


    *   `cp` – `cp image1.jpg image2.jpg` – copies (and renames) the first parameter
    to the second supplied parameter. Copy directories with the `-r` switch.

    *   `mv` – `mv cat.jpg /home/Pictures` – Move the specified file to the given
    directory.

    *   `shutdown` – `shutdown –h now` – shuts down the computer. `-h` is a tag meaning
    “halt”, but you can also use `-r` to restart. Now refers to the time until it
    executes.

    *   `date` – `date` – Displays the current date and time.

    *   `free` – `free –g` – Show the current RAM usage of programs.

    *   `du` – `du –h` – Give the HDD usage.

    *   `ps` – `ps` – Show the active processes using CPU time.

    *   `touch` – `touch memo.txt` – Used to create a new blank file in the current
    directory with the specified name.

    *   `ifconfig` – `ifconfig` – The Linux equivalent of `ipconfig`, it shows network
    information.


    Some commands have “tags” or “switches” associated with them. These are the letters
    preceded by dashes. They all do different things, and learning which switches
    to use for what purpose is best found through that command’s manual pages. See
    the advanced section for opening the manual.


    One of the most useful programs from the command line, `nano` is a simple text
    editor that can be used to edit files and quickly make changes to settings or
    scripts. It is accessed by typing `nano` into a command line. You can type a file
    as needed and then press `ctrl+x` to save and quit. As you save, you will give
    it the name and file extension associated with it; `notes.txt` will create a text
    file with the name `notes`. Alternatively, you can edit a file by typing `nano
    notes.txt`. In that example, we open notes in the editor and display its contents
    in an editable state.


    `Nano` may be very simple, but it is undoubtedly powerful and a time saver for
    quick changes and file creation.


    ## Connecting to Windows / Mac Computers


    Windows and OSX computers have built-in networking functions such as workgroups,
    domains, shares, and more. Integrating Linux computers into the network infrastructure
    that has been dominated by Windows server computers is fairly easy, though, and
    correct setup will allow you to see Windows shares as well as join corporate domains.


    The first step to intercommunication is installing the `samba` package. Either
    find it through the software center, or type in `sudo apt-get install samba` to
    obtain and install the necessary software.


    Sharing files from your Ubuntu machine to other computers involves creating a
    samba share. Samba runs off of the same protocols that other popular file sharing
    methods use, so files shared from the Ubuntu machine can easily be seen on Windows.
    After installing samba, use `sudo nano /etc/samba/smb.conf` to start editing the
    configuration file.


    ```

    [share]

    comment = File Share from Ubuntu

    path = /srv/samba/share

    browsable = yes

    guest ok = yes

    read only = no

    create mask = 0755

    ```


    Now, create the folder specified in `path` (`sudo mkdir -p /srv/samba/share`)
    and set permissions (`sudo chown nobody:nogroup /srv/samba/`) so that anybody
    can access its contents. Place any files you want to share within that directory,
    and then restart the service (`sudo restart smbd, sudo restart nmbd`) to make
    the share active. Lastly, log on to your other computer and navigate to the network
    shares. In Windows, they will appear in the left panel of file explorer. If the
    share does not appear automatically, type the IP into the file path box (find
    Ubuntu IP with `ifconfig`). You are now able to access Ubuntu’s files from operating
    systems.


    You might also need to see files from other operating systems in the Ubuntu computer.
    Firstly, open the Ubuntu file explorer. From the menu bar, click “files”, and
    then select “connect to server”. In the resulting box, type the URL of the share
    you wish to access. It could be an ftp address (`ftp://ftp.test.com`), an http
    address (`http://test.com`), or a share address (`smb://share/Folder`). Without
    any additional hardware or setup, you can see the files this way.


    Finally, joining a domain such as Active Directory allows your computer to interact
    with other operating systems on the network and achieve other business-oriented
    tasks. Whether you have a small home network, or whether you are adding Linux
    computers to a corporate domain, the process is the same. Install a few extra
    packages (`realmd, sssd, ssd-tools, samba-common, samba-common-bin, samba-libs,
    krb5-user, adcli, packagekit`). While installing them, it will ask for your domain
    name. Enter it in all caps. Enter `kinit -V adminname` replacing that with an
    actual admin account name in the domain. After entering the password you will
    have been authenticated to the domain. Now joining it is done with `realm --verbose
    join -U adminmame domainname.loc`.

