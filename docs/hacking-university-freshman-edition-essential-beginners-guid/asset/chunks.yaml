- fmt: '

    First, `Linux` is free. The background of `GNU` places `Linux` into a “free and
    open source” mentality where most (if not all) of the software shipping with `Linux`
    is free. Free and open source (`FOSS`) refers to two things- the software is both
    monetarily free and the source code is also transparent. `FOSS` differs from proprietary
    software in that everything is open with `FOSS`, and there are no hidden spyware,
    fees, or catches involved with using it. The software is often more secure because
    anybody can contribute to the readily available source code and make it better.
    Because `Linux` and most of the software you can download for it is free, it is
    a fantastic operating system for small businesses or individual users on a budget.
    Certainly no quality is sacrificed by not charging a fee, because the Linux Linux
    project and its various distributions are community-driven and funded through
    donations. Compare this to the cost of `Windows`, which is often many hundreds
    of dollars for the OS alone. `Microsoft Office` is a popular document writing
    program suite, but it also prices high. Free alternatives to these programs exist
    in `Linux`, and they definitely compare in quality to the big name products.


    Probably the largest complaint held by PC owners is viruses. `Windows` computers
    are especially susceptible to them, and even anti-virus software companies are
    always playing catch-up to the newest threats. Simply visiting a malicious website
    is often enough to infect a computer, and many users choose `Mac` computers because
    of the significantly less frequency of incidents relating to malware. `Linux`-based
    operating systems are similar to `Macs` in that viruses are virtually non-existent.
    This increased security makes switching to `Linux` a must for anybody concerned
    about privacy, security, or reliability.


    `Linux` is very popular within corporations and government agencies. This is because
    high-powered servers and critical devices will run remarkably better with `Linux`
    as the operating system. The OS is known for reliability and stability too. While
    a `Windows` computer will need regular restarts and maintenance to “freshen” it
    up and keep it from running slow, `Linux` servers can run months or even years
    without a single restart. IT professionals inevitably choose `Linux` to be the
    backbone of their network because of its reputation. Its renowned stability is
    available to consumers as well on the desktop platform, and it is definitely useful
    for us as well.


    Perhaps the best benefit to using `Linux` is the speed. Low system requirements
    mean that computers that are normally slow and groggy on `Windows` will be zippy
    and quick on `Linux`. Users frustrated with computer slowdowns can replace their
    OS for a more responsive experience. Furthermore, `Linux` can be installed on
    older computers to reinvigorate them. So even though that old laptop may be too
    outdated for the newest version of `Windows`, there will probably be a distribution
    of `Linux` that will squeeze a few more years of useful life out of it.


    Customization is a sought after feature in technology. `Windows`, and especially
    `OSX`, limit the amount that you can do with your operating system out of fear
    that the average user would break it. This is not the case with `Linux`, as it
    encourages editing and changing visuals and functionality of the OS. Of course
    it is not necessary, and the default configuration of most `Linux` distributions
    is extremely stable and difficult to break unintentionally. But for those that
    love jailbreaking, modding, and playing around with computers, `Linux` can facilitate
    the creative side and even provide curious hackers with access to tools unavailable
    in other systems.


    And finally, `Linux` is compatible with a huge range of devices. `Linux` can run
    on almost any architecture, meaning it can be installed on cell phones, desktops,
    laptops, servers, game consoles, and “smart” devices. Hobbyists take pleasure
    in simply installing `Linux` on niche, old, or quirky devices simply because they
    can. For the average user, it means that `Linux` is probably compatible with your
    computer.


    Overall, `Linux` beats out the mainstream operating systems in many areas. All
    of these things definitely make `Linux` the better choice for your computer, and
    you should use it to gain access to these revered features. Artists, hackers,
    creative individuals, small business owners, techies, non-techies, and just about
    everyone can find something to like about `Linux`. The wide range of distributions
    means there is something for everyone, so install `Linux` today to see what you
    can gain from it.


    ## Linux Distributions


    Installing `Linux` can be done in a few ways, such as burning an image of the
    OS onto a disc, writing it to a `USB`, ordering a `Live CD` from online, formatting
    an `SD card`, or trying one out via `Virtual Box`. Ultimately though you cannot
    just install “Linux” and have a usable OS. Because `Linux` is just the kernel,
    you will need the other software as well that gives you graphical user interfaces,
    Internet access, etc… As previously mentioned, “distributions” of `Linux` exist.
    Distributions are versions of `Linux` containing preinstalled programs and a distinctive
    style and focus. A distribution takes the core of `Linux` and makes it into an
    entire operating system fit for daily use.


    There are a mind-boggling amount of distributions. Some have specific purposes,
    such as `Kali Linux` for hacking, `Sugar Linux` for education, or `Arch Linux`
    for customization. Others are more general purpose, such as `Ubuntu` and `Debian`.
    Getting the most out of installing `Linux` means you will need to understand about
    different distributions and make a choice as to which will work best for you.
    Read the following sections to understand what a few of the most popular distributions
    are used for.


    `Ubuntu` is the most widely known distribution at the time of writing. Throughout
    the 2000’s it gained popularity for being user friendly and intuitive. Based off
    of the earlier `Debian` distro, `Ubuntu` is very similar to `Windows` computers
    in use, meaning it is an excellent choice for the Linux newbie. Because of this,
    we will be installing an Ubuntu variant later in the book. `Canonical Ltd` is
    the company that actively develops `Ubuntu`- yearly versions updates mean that
    the OS is always up to date and usable with emerging technology. Despite this,
    Ubuntu still work on many older devices at a reasonable speed. Applications can
    be installed from a “store” of sorts, meaning that the beginning user does not
    need to understand the often complicated command line. Conclusively, the Ubuntu
    distro is a great choice for the first time Linux user, and you should install
    it to learn how Linux works without diving into the harder distros.


    For more specific cases of computing, Ubuntu has various sub-distributions or
    “flavors”. These are distros that use Ubuntu as a base but have a different focus,
    such as `Lubuntu`’s emphasis on lightweight applications. Here are a few:


    - Lubuntu: A version of Ubuntu designed to run on older hardware or computers
    with limited resources. The install file is less than 1GB, and the hardware requirements
    are much lower than standard Ubuntu. Use this distro for revitalizing older computers
    but while retaining the usability of Ubuntu.


    - Ubuntu Studio: Ubuntu for artists including digital painters, sound producers,
    and video editors. Ubuntu studio is Ubuntu but with editing tools installed already.


    - Kubuntu: Ubuntu reskinned with the KDE desktop environment. The look and feel
    of Kubuntu differs from the classic Ubuntu feel by providing a desktop environment
    that is more traditional to other operating systems.

    '
