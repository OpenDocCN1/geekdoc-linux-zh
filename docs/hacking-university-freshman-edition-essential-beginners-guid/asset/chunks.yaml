    [![](images/00003.jpeg)](https://www.amazon.com/Hacking-University-Sophomore-Essential-Consoles-ebook/dp/B01KVZ9KM2/keywords=hacking)


    [Hacking University: Junior Edition. Learn Python Computer Programming From Scratch.
    Become a Python Zero to Hero. The Ultimate Beginners Guide in Mastering the Python
    Language](https://www.amazon.com/Hacking-University-Programming-Beginners-Mastering-ebook/dp/B01LXKKBDN/keywords=hacking)


    ![](images/00004.jpeg)


    Hacking University: Graduation Edition. 4 Manuscripts (Computer, Mobile, Python,
    & `Linux`). Hacking Computers, Mobile Devices, Apps, Game Consoles and Learn Python
    & `Linux`


    ![](images/00005.jpeg)


    [Data Analytics: Practical Data Analysis and Statistical Guide to Transform and
    Evolve Any Business, Leveraging the power of Data Analytics, Data Science, and
    Predictive Analytics for Beginners](https://www.amazon.com/Data-Analytics-Practical-Statistical-Leveraging-ebook/dp/B01JTIIRCG/keywords=data+analytics)


    [![](images/00006.jpeg)](https://www.amazon.com/Data-Analytics-Practical-Statistical-Leveraging-ebook/dp/B01JTIIRCG/keywords=data+analytics)


    ## About the Author


    Isaac D. Cody is a proud, savvy, and ethical hacker from New York City. After
    receiving a Bachelors of Science at Syracuse University, Isaac now works for a
    mid-size Informational Technology Firm in the heart of NYC. He aspires to work
    for the United States government as a security hacker, but also loves teaching
    others about the future of technology. Isaac firmly believes that the future will
    heavily rely on computer "geeks" for both security and the successes of companies
    and future jobs alike. In his spare time, he loves to analyze and scrutinize everything
    about the game of basketball.

