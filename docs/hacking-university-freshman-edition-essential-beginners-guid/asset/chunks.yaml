    首先，`Linux` 是免费的。`GNU` 的背景将 `Linux` 置于一种“免费且开源”的理念中，大部分（不是全部）随 `Linux` 分发的软件都是免费的。免费开源（`FOSS`）指的是两点：软件在金上是免费的，而且源代码也是透明的。`FOSS`
    与专有软件的区别在于，`FOSS` 的一切都是开放的，在使用时不涉及任何隐藏的间谍软件、费用或陷阱。软件通常更安全，因为任何人都可以对公开的源代码做出贡献并使其变得更好。由于
    `Linux` 以及你为其下载的大多数软件都是免费的，因此对于预算有限的小型企业或个人用户来说，这是一个极好的操作系统。当然，不收费并不会牺牲质量，因为 Linux
    项目及其各种发行版都是社区驱动的，并通过捐赠维持资金。相比之下，`Windows` 的成本通常仅操作系统就需要几百美元。`Microsoft Office`
    是一个流行的文档写作套件，但它的价格也很高。`Linux` 中存在这些程序的免费替代方案，它们在质量上完全可以与大牌产品相比。


    PC 所有者最大的抱怨可能是病毒。`Windows` 计算机特别容易受到感染，甚至反病毒软件公司也一直在追赶最新的威胁。仅仅是访问一个恶意网站通常就足以感染计算机，许多用户选择
    `Mac` 计算机是因为与恶意软件相关的事件频率显著低得多。基于 `Linux` 的操作系统与 `Mac` 相似之处在于，病毒几乎不存在。这种安全性的提升使得任何担心隐私、安全或可靠性的人切换到
    `Linux` 都是必经之路。


    `Linux` 在企业和政府机构中非常流行。这是因为高功率服务器和关键设备在使用 `Linux` 作为操作系统时，运行表现会明显得多。该操作系统也以可靠性和稳定性著名。虽然
    `Windows` 计算机需要定期重启和维护来“刷新”一下状态并防止其运行变慢，但 `Linux` 服务器可以运行几个月甚至几年而无需重启。IT 专业人员由于其声誉，不可避免地选择
    `Linux` 作为其网络的骨干。其闻名的稳定性在桌面平台也适用于消费者，而且对我们来说也绝对有用。


    也许使用 `Linux` 最大的好处是速度。低系统要求意味着，在 `Windows` 上通常运行缓慢迟钝的电脑在 `Linux` 上会变得敏捷快速。对电脑运行变慢感到沮丧的用户可以更换操作系统以获得更响应的体验。此外，`Linux`
    可以安装在旧电脑上以使其重发生机。因此，尽管那台旧笔记本电脑可能已经过时无法运行最新版本的 `Windows`，但可能有一个 `Linux` 发行版可以再压榨出几年的实用寿命。


    定制化是技术领域备受推崇的功能。`Windows` 尤其是 `OSX`，由于担心普通用户会弄坏它，限制了你对操作系统可以做的操作。`Linux` 并非如此，因为它鼓励编辑和更改操作系统的视觉效果和功能。当然，这并非必须，而且大多数
    `Linux` 发行版的默认配置非常稳定，难以被无意破坏。但对于那些喜欢越狱、模组化和玩电脑的人来说，`Linux` 可以促进创意方面的发挥，甚至为好奇的黑客提供在其他系统中无法使用的工具。


    最后，`Linux` 兼容极其广泛的设备。`Linux` 可以运行在几乎任何架构上，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏主机和“智能”设备上。爱好者乐于仅仅在小众、老旧或奇特的设备上安装
    `Linux`，仅仅是因为他们这样做。对于普通用户来说，这意味着 `Linux` 可能与你的电脑兼容。


    总的来说，`Linux` 在许多领域胜过了主流操作系统。所有这些因素绝对让 `Linux` 成为你电脑的更好选择，你应该使用它来获得这些受崇的功能。艺术家、黑客、创意人士、小企业主、技术极客、非技术人员以及几乎每个人都能在
    `Linux` 中找到自己喜欢的东西。广泛的发行版意味着每个人都有适合自己的，所以今天就安装 `Linux` 吧，看看你能从中获得什么。


    ## Linux 发行版


    安装 `Linux` 可以可以通过方式完成，例如将操作系统的镜像刻入光盘、写入 `USB`、从网上订购 `Live CD`、格式化 `SD 卡` 或通过 `Virtual
    Box` 尝试。但归结底，你不能仅仅安装“Linux”就获得一个可用的操作系统。由于 `Linux` 只是内核，你还需要其他提供图形用户界面、互联网访问等等软件。如前所述，存在
    `Linux` 的“发行版”。发行版是 `Linux` 的版本，包含了预装的程序以及独特的风格和侧重点。发行版提取 `Linux` 的核心并将其转化为一个适合日常使用的整个操作系统。


    发行版的数量多到令人难以信。某些具有特定用途，例如用于黑客的 `Kali Linux`、用于教育的 `Sugar Linux` 或用于定制的 `Arch Linux`。其他的更具通用性，例如
    `Ubuntu` 和 `Debian`。要让安装 `Linux` 发挥最大作用，你需要了解不同的发行版，并决定哪一个最适合你。阅读以下章节以了解一些最流行的发行版分别用途的。


    `Ubuntu` 是写本文时最广为人知的发行版。在整个 2000 年代，它因用户友好和直观而广受欢迎。`Ubuntu` 基于此较早的 `Debian` 发行版，在在使用上与
    `Windows` 计算机非常相似，这意味着它是 Linux 新新手的极佳选择。正因如此，我们将在书的后半部分安装 Ubuntu 变体。`Canonical
    Ltd` 是积极开发 `Ubuntu` 的公司—— yearly 版本意味着操作系统始终保持更新，并能与新兴技术兼容。尽管如此，Ubuntu 仍然可以在许多旧设备上以合理的速度运行。应用程序可以从某种“商店”中安装，这意味着初学者不需要理解复杂的命令行。结论是，Ubuntu
    发行版是首次 Linux 用户的很好的选择，你应该安装它来学习 Linux 是如何工作的，而无需深入更困难的发行版。


    对于更具体的计算情况，Ubuntu 拥有各种子发行版或“口味”。这些是以 Ubuntu 为基础但侧重点不同的发行版，例如 `Lubuntu` 对轻量级应用的强调。这里有几个：


    - Lubuntu：一种为旧旧硬件或资源有限的计算机设计的 Ubuntu 版本。安装文件小于 1GB，且硬件要求比标准 Ubuntu 低得多。使用此发行版来恢复旧电脑，同时保留
    Ubuntu 的易用性。


    - Ubuntu Studio：面向艺术家的 Ubuntu，包括数字画家、音频制作和视频视频编辑。Ubuntu Studio 是 Ubuntu 但预安装了编辑工具。


    - Kubuntu：使用 KDE 桌面环境重新装皮肤的 Ubuntu。Kubuntu 的外观和感觉与经典的 Ubuntu 感觉不同，它提供了一个更符合其他操作系统传统的桌面环境。

    '
- fmt: '

    ## Ubuntu Distributions


    - `Xubuntu` is another lightweight distro that is not as quite as bare bones as
    `Lubuntu`. `Xubuntu` sacrifices size and hardware requirements to provide an OS
    that works on old, but not too old computers. It certainly is more aesthetic than
    other minimal Linux distributions, and it also uses `Ubuntu` as a base for user-friendliness
    and familiarity.

    - `Ubuntu Server` – A `Ubuntu` variant more suited to industrial and corporate
    needs, `Ubuntu server` can be run headless and provide functionality for other
    Linux systems in a network.

    - `Mythbuntu` – A variant with TV streaming and live television programs preinstalled.
    This is a great distro for converting old computers into “smart TV” devices via
    `Kodi`.


    In conclusion, the wide range of `Ubuntu` distributions mean that there is a beginner
    OS for everybody. It is highly recommended that you take advantage of the ease
    of use features and general familiarity contained within Ubuntu. It serves as
    a stepping stone OS, one that will gradually introduce you to Linux. Definitely
    install it as your first Linux experience.


    ## Popular Distributions


    `Linux Mint` is a highly used OS in the Linux world. “Powerful and easy to use”,
    `Mint` contains `FOSS` and proprietary software as well with the purpose of being
    a complete experience for Linux beginners. While not totally Linux-like, `Mint`
    is an excellent choice for a first-time alternate operating system. It consistently
    ranks among the most used operating systems ever, and its default layout is very
    similar to Windows facilitating a smooth transition into the Linux world.


    `Debian` is one of the oldest Linux distributions, being created in 1993. Combining
    with the Linux philosophy, `Debian` keeps stability and solidity as the guiding
    development principal. Certainly the amount of time `Debian` has been around is
    an indicator of refinement, so those seeking an experience free of bugs and glitches
    can turn to `Debian`. Free and open source software also has a home in `Debian`,
    because most of the software contained within is `FOSS`. This does not mean that
    you are limited, though, because there is an official repository of non-free software
    for proprietary programs such as `Adobe Flash`. `Debian` is a decent choice for
    beginners, but `Ubuntu` still stands as the best introductory OS. Install `Debian`
    for stability, `FOSS`, and a wholly Linux experience.


    `Slackware` is an OS that goes back even further than `Debian`. It stays close
    to the original Linux intent, meaning that you will have to install your own GUI
    and program dependencies. Because of that fact, `Slackware` is mostly for intermediate
    Linux users, as beginners will be confused at the unfamiliar methods. However,
    if you want to experience a Linux distribution that is closer to the `UNIX` roots,
    `Slackware` can provide for you.


    `Fedora` is an OS more oriented towards workstations and business uses. Even `Linus
    Torvalds` himself is a user of `Fedora`, attributing to the operating system’s
    popularity and use. `Fedora` is updated very often, meaning that it is always
    up-to-date and on the cutting edge of Linux technology. Security and `FOSS` are
    also a focus within the OS, which is why it is commonly used on endpoint computers
    in small businesses. There could be a challenge with working with `Fedora`, though,
    so consider it as an intermediate OS.


    `Arch Linux` is another distribution, but one that is mostly designed for experienced
    users. The OS comes as a shell of a system that the user can customize to their
    liking, by adding only the programs and services that they want. Because of this,
    `Arch` is difficult to set up, but a rewarding and learning experience as well.
    By building your own personal system, you will understand the deeper Linux concepts
    that are hidden from you on the higher level distributions. Install this advanced
    OS after becoming very comfortable with the basics.


    ## Unique Distributions


    And finally, there is an abundance of other unique distributions that are worth
    mentioning. In the following list, we will talk about a few of them. Just note
    that there are so many distributions, this entire book could be filled describing
    each and every niche use.


    - `CrunchBang` – A `Debian`-based distribution that aims to be less resource intensive.
    It is simple and without some of the bloatware that some distributions include
    by default. `CrunchBang` can run fast and be efficient at computing.

    - `Android` – The popular phone OS is actually a Linux variant. Since many phones
    have lower specifications than full desktop PCs, the OS is a great choice for
    laptops, touchscreen devices, or home media computers. Furthermore, you can use
    many of the `Google Apps` from the `Play` store, meaning that thousands of apps,
    games, and utilities are available to be used on your phone and computer. While
    it is not recommended as your first Linux OS, it is definitely a neat choice for
    experimenting with older computers or children’s PCs.

    - `Chrome OS` – Another mobile-type OS developed by `Google`, `Chrome OS` is essentially
    a lightweight Linux browser meant for online use. `Google` has this OS preinstalled
    on their `ChromeBooks`, which have lower specifications than other laptops. But
    the OS is really only a full screen `Chrome` browser, so the OS is perfect for
    users wanting an uncomplicated experience or a dedicated Internet machine.

    - `Tiny Core` – An OS measured in megabytes, `Tiny Core` is for antique computers
    or embedded devices. This OS is mostly for intermediate users that have a hobby
    project or dedicated purpose in mind.

    - `Damn Small Linux` – Another minimal Linux variant, this OS is best for quick
    access to a Linux command line.

    - `openSUSE` – This is a distribution for experienced computer users. With many
    tools for administrators and program developers, `openSUSE` is the best OS for
    users confident in their skills.


    Positively the number of operating systems based off of the Linux kernel is astounding.
    With a huge amount of choices, you might be confused as to where to start and
    how to install it. When in doubt (and as we will demonstrate shortly), install
    `Ubuntu` or one of its variants. The OS is great for beginners and makes the Linux
    transition smoother. But as you increase in skill and wish to learn more, you
    can install another operating system.


    ## Booting Into Linux


    If you are ready to take the plunge into a Linux based distribution, the first
    thing you must do is back up your files. Overwriting the OS on your hard drive
    will erase any data, meaning you must back up any pictures, music, or files you
    wish to keep. Use an external hard drive, or an online storage site (such as `Google
    Drive`) to temporarily hold your files. We are not responsible for you losing
    something important, back it up!


    Next we will need to choose an OS. This book will use `Ubuntu 16.04` as an extended
    example, and it is recommended you do the same. Navigate to Canonical’s official
    website (`http://www.ubuntu.com/`(http://www.ubuntu.com/)) and acquire a copy
    of the OS. You will download the image from the site to your computer.


    Next we need to obtain an installation media. This can be a DVD, a USB drive,
    an SD card, or any other writable media that your computer can read. The only
    restriction is that the device must be able to hold an image as large as the OS
    download, so 4GB should be suffice. Remove everything from the drive, as it will
    also be formatted.


    Download a tool for writing the image file. For DVDs install `Imgburn` (`http://www.imgburn.com/`(http://www.imgburn.com/)),
    and for flash media download `Rufus` ([https://rufus.akeo.ie/](https://rufus.akeo.ie/)).
    The most common method of OS installation is to use a 4GB USB drive, and it is
    more recommended. Insert your media, start the appropriate program, select the
    OS image that was downloaded, and begin the writing process. It will take some
    time, as the image needs to be made bootable on the media. When it is finished,
    you can shut down your computer fully.

    '
