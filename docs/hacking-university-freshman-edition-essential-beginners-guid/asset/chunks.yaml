  trans: "\n别名（Aliasing）是在终端中创建个人专属快捷方式的方法。与其输入一条长命令或一系列短命令，不如使用别名将它们合并成单个用户自定义的选项。正如其名所暗示，别名是你指定的任何内容的备名称。每个别名都包含在一个隐藏的配置文件中——使用\
    \ `nano ~/.bashrc` 开始编辑它。因为它存在于用户的家目录中，因此每个别名都只对该用户有效。在文件的底部，我们可以按照下面的示例开始创建别名：\n\
    \n```bash\nalias gohome='cd ~ && ls'\n```\n\n此别名允许你通过输入 `gohome` 将目录更改到主目录并显示内容。在创建别名时，你必须严格遵循上述的格式，这意味着命令和等号之间没有空格。多个命令通过\
    \ `&&` 连接并串联在单引号内。为了获得更具健壮性的别名，请改用函数代之。下面的示例将 `cd` 和 `ls` 合并为一个单一命令。\n\n```bash\n\
    function cdls () {\n    cd \"$@\" && ls\n}\n```\n\n编写别名后，保存文件并重启电脑。之后你就可以使用新命令了。\n\
    \n我们编辑的那个文件 `.bashrc` 是 Ubuntu 终端的配置文件。除了制作别名，我们还可以使用它来自定义终端设置，例如颜色、大小等……一个小技巧是通过删除\
    \ `#` 来取消 `#force_color_prompt=yes` 的注释，并确保 `yes` 在等号后面。这为终端增加了颜色，使某些单词显示不同的颜色。打开终端时，右键点击它并选择“配置”（profiles）然后选择“配置选项”（profile\
    \ preferences），可以看到更多选项。通过这里的选项卡，你可以自定义字体、大小、颜色、背景颜色等许多。如果你打算频繁使用终端，建议对其进行自定义，因为这有助于你对将要使用的工具感到顺手。\n\
    \n## I/O 重定向\n\n在标准的终端命令执行期间，“正常输入”（由用户输入，或从文件/属性/硬件读取）会被命令输入并解析。有时命令还有“标准输出”，即显示在终端中的返回文本。在\
    \ `ls` 命令中，标准输入是当前工作目录，而标准输出是文件夹的内容。\n\n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以让终端完成更多事情。例如，`cat`\
    \ 命令（连接）后跟文件会将该文件输出到屏幕。单独运行 `cat` 会打开一个解析器，输入的任何行都会被立即输出（使用 `ctrl+d` 退出）。但通过 I/O\
    \ 重定向快捷键（`<`, `>`, `<<`, `>>`, `|`），我们可以将输出重定向到另一个源，例如文件。`cat > test.txt` 现在会将标准输出存入该新文件中。双等号表示追加，因此\
    \ `cat >> test.txt` 将输出置于文件末尾，而不是删除开头的内容。\n\n竖线字符，或“管道”（pipe）使用了另一种形式的 I/O 重定向，将一个命令的输出直接插入到另一个命令的输入中。`ls\
    \ | sort –r` 会获取 `ls` 的输出并将其反向排序列表。我们通过重定向输出并将其交给另一个命令来实现这一点。\n\n最后，`grep` 命令在\
    \ I/O 重定向中被频繁使用。`grep` 可以在指定文件中搜索特定字符串并将结果返回到标准输出。通过重定向，此输出可以放入其他命令中。Linux 中值得注意的有趣特性是：一切皆文件，甚至是硬件。因此，我们的\
    \ CPU 实际上是一个在内部存储相关数据的文件，我们可以使用 `grep` 和其他工具对其进行搜索。那个例子相当高级，但这里有一个更简单的实例：\n\n\
    ```bash\ngrep Conclusion report.txt\n```\n\n它将在文件中搜索那个特定单词。由于所有新符号和命令，I/O 重定向可能会变成一个复杂的过程，但它是你可以整合到脚本和日常使用的功能，通常允许在单行内完成\
    \ Linux 的某些特性和功能。\n\nLinux 和终端是很难完全掌握的概念。但通过实践和持续的奉献，你将能够执行出色的计算任务，并完成在 Windows\
    \ 或 OSX 中无法完成的有用任务。学习更多命令以及如何使用它们无疑在这方面有所帮助，因此请坚持学习新命令及其用法。实际上，你唯一真正需要记忆的命令是 `man`，这个命令会显示指定的任何其他命令的手册页和文档。手册页显示了系统上每个命令的开关、示例和预期用途。利用这个工具，获取对你系统深入的知识。\n\
    \n## 更多 Linux 信息\n\n为了继续学习 Linux 及其能提供的可能性，请考虑本节中的示例。它将简要讨论 Linux 的更多用途以及一些尚未谈到的其他概念。\n\
    \n“Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果你在终端中继续执行 `cd ..`，或者在图形用户界面（GUI）上点击返回按钮直到无法移动，你就会遇到“根”（root）目录。这里的\
    \ `bin`、`boot`、`etc`、`usr` 等文件夹是你的硬件和设置配置的方式。每个文件夹都有特定的用途和功能，你可以通过探索其内容来理解它们。例如，用户数据存储在\
    \ `home` 中，但用户程序存储在 `usr` 中。由于文件系统多样且复杂，此处将不再进行讨论，但如果你想了解更多，请进行搜索或阅读与你的系统相关的文档。\n\
    \nLinux 系统通常用于桌面用途之外的其他目的。专用机器运行 Linux 变体是因为它们提供的强大和稳定性。甚至我们的汽车也运行着 Linux 内核，以跟踪错误代码并帮助机械师。\n\
    \n服务器通常安装 Linux 是因为其可靠性以及发行版具备的功能。例如，Linux 机器被用作防火墙是因为 `iptables` 应用程序提供了端口阻塞和智能过滤。你也可以通过该应用程序在系统上运行防火墙，从而免费获得企业级软件。通过这种方式，Linux\
    \ 对于网络也是极好的。只需安装相关应用程序，机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。\n\n最后，Linux 系统并不局限于我们所看到的界面。每个发行版都有其偏好的桌面环境，但界面可以根据个人的喜好进行极大的自定义。终端甚至有用于文件浏览器和\
    \ Web 浏览器，这对于那些使用 SSH 或远程计算的人非常有帮助。总而言之，你应该尝试安装不同的 DE（桌面环境）并根据你的喜好进行配置。\n\n##\
    \ 接下来做什么以及结论\n\n你如何继续取决于你想对你的 Linux 发行版做什么。对于普通的的浏览和简单使用，请继续使用 Ubuntu 并安装你需要的程序。对于更有冒险精神的人，考虑安装一个新的发行版来查看它们能提供什么。想要更深入学习\
    \ Linux 的人可以安装如 Arch 或 DSL 等系统，从零开始构建自己独特的操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux\
    \ 网络，或者他们考虑将环境从其他操作系统切换到完全免费的系统。\n"
- fmt: '

    Conclusively, `Linux` is a powerful and relatively easy to use set of operating
    systems. But their real potential comes from the hard-to-master terminal and command
    line functions. Thank you for reading this publication, and I hope that it has
    shed some light on the mysterious subject of the defacto alternative operating
    system. If `Linux` has confused you or did not live up to expectations, I implore
    you to take a second look at the features it can offer. While it may not have
    the same caliber of games or 3rd party proprietary software, the OS is simple
    and customizable enough to be used as a primary OS with maybe `Windows` or `OSX`
    as a secondary OS. Alternatives exist for just about every program, so if it is
    possible to get rid of Microsoft and Apple entirely, it is highly recommended
    you do so. Thank you again, and make good use of your new `Linux` knowledge.


    ## Related Titles


    [Hacking University: Freshman Edition Essential Beginner''s Guide on How to Become
    an Amateur Hacker](https://www.amazon.com/Hacking-University-Essential-Beginner%E2%80%99s-Beginners-ebook/dp/B01J023VTU/keywords=hacking)


    [![](images/00002.jpeg)](https://www.amazon.com/Hacking-University-Essential-Beginner%E2%80%99s-Beginners-ebook/dp/B01J023VTU/keywords=hacking)


