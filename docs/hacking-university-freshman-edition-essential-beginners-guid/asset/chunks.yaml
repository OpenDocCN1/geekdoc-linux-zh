  trans: '


    ## Ubuntu 发行版


    - `Xubuntu` 是另一个轻量级发行版，但不如 `Lubuntu` 那么精简。`Xubuntu` 牺牲了体积和硬件要求，以提供一个可以在旧但不过太老的电脑上运行的操作系统。它显然比其他极简的
    Linux 发行版更美观，而且它以 `Ubuntu` 为基础，具有易用性和熟悉感。

    - `Ubuntu Server` – 一种更适合工业和企业需求的 `Ubuntu` 变体，`Ubuntu server` 可以无头模式运行，并为网络中的其他
    Linux 系统提供功能。

    - `Mythbuntu` – 一个预装了电视流媒体和直播电视节目的变体。这是一个对于通过 `Kodi` 将旧电脑转换为“智能电视”设备的绝佳发行版。


    总之，`Ubuntu` 广泛的发行版意味着每个人都有一个适合初学者的操作系统。强烈建议你利用 Ubuntu 包含的易用性特性和通用熟悉度。它可以作为一个阶梯式的操作系统，逐步引导你接触
    Linux。务必将其作为你的第一个 Linux 体验来安装。


    ## 流行发行版


    `Linux Mint` 是 Linux 世界中使用非常频繁的操作系统。“强大且易用”，`Mint` 包含了 `FOSS`（自由开源软件）和专有软件，旨在为
    Linux 初学者提供完整的体验。虽然不是完全像 Linux，但 `Mint` 是作为第一个备用操作系统的极佳选择。它一直位列全球最常用的操作系统之列，其默认布局与
    Windows 非常相似，有助于平滑过渡到 Linux 世界。


    `Debian` 是最古老的 Linux 发行版之一，创建于 1993 年。结合了 Linux 哲学，`Debian` 将稳定和稳固作为指导开发的内核原则。显然，`Debian`
    存在的时间长度就是其精炼程度的指标，因此那些追求无 Bug 无故障体验的用户可以转向 `Debian`。自由开源软件在 `Debian` 中也有一席之地，因为包含的大部分软件都是
    `FOSS`。不过，这并不意味着你受到了限制，因为有一个官方的非免费软件库，用于运行像 `Adobe Flash` 这样的专有程序。`Debian` 对初学者来说是一个不错的选择，但
    `Ubuntu` 仍然是最好的入门操作系统。安装 `Debian` 是为了稳定性、`FOSS` 以及纯正的 Linux 体验。


    `Slackware` 是一个比 `Debian` 还要老的操作系统。它保持接近原始 Linux 的设计，这意味着你必须安装自己的 GUI 和程序依赖项。由于这个事实，`Slackware`
    主要面向中级 Linux 用户，因为初学者会由于这些不熟悉的方法感到困惑。然而，如果你想体验一个接近 `UNIX` 根的 Linux 发行版，`Slackware`
    可以为你提供服务。


    `Fedora` 是一个更倾向于工作站和业务用途的操作系统。甚至 `Linus Torvalds` 本人也是 `Fedora` 的用户，这归功于该操作系统的流行和使用。`Fedora`
    更新非常频繁，意味着它始终处于最新状态并处于 Linux 技术的最前沿。安全和 `FOSS` 也是该操作系统的重点，这就是为什么它通常被用于小型企业的终端电脑。不过，使用
    `Fedora` 可能会面临挑战，因此请将其视为一个中级操作系统。


    `Arch Linux` 是另一个发行版，但它主要为经验丰富的用户设计。该操作系统以系统外壳的形式出现，用户可以根据喜好进行自定义，只添加他们需要的程序和服务。由于这个原因，`Arch`
    很难安装，但也是非常有收获的学习性体验。通过构建自己的个人系统，你将理解那些在高级别发行版中被隐藏的深层 Linux 概念。在非常熟悉基础知识后再安装这个高级操作系统。


    ## 特色发行版


    最后，还有许多值得提及的独特发行版。在接下来的列表中，我们将讨论其中几个。请注意，发行版如此之多，这整本书都可以用来描述每一个细分领域的用用例。


    - `CrunchBang` – 一个基于 `Debian` 的发行版，旨在减少资源消耗。它非常简单，没有包含某些发行版默认包含的臃肿软件。`CrunchBang`
    运行速度快且在计算方面非常高效。

    - `Android` – 这个流行的手机操作系统实际上是 Linux 的变体。由于许多手机的配置低于全功能桌面电脑，该操作系统是笔记本电脑、触摸屏设备或家庭媒体电脑的极佳选择。此外，你可以使用
    `Play` 商店中的许多 `Google Apps`，这意味着你的手机和电脑上可以使用成千上万的应用程序、游戏和工具。虽然不建议将其作为你的第一个 Linux
    操作系统，但它绝对是实验旧电脑或孩子电脑的巧妙精妙选择。

    - `Chrome OS` – 另一个由 `Google` 开发的移动类型操作系统，`Chrome OS` 本质上是一个用于在线使用的轻量级 Linux 浏览器。`Google`
    在他们的 `ChromeBooks` 上预装了该系统，这些设备的配置比其他笔记本低。但该系统实际上就是一个全屏 `Chrome` 浏览器，因此它对于想要简单体验或专用上网机器的用户非常完美。

    - `Tiny Core` – 一个以兆字节为单位的操作系统，`Tiny Core` 用于老旧电脑或嵌入式设备。该操作系统主要面向心有爱好项目或特定用途的中级用户。

    - `Damn Small Linux` – 另一个极简的 Linux 变体，该操作系统最适合快速访问 Linux 命令行。

    - `openSUSE` – 这是一个面向经验丰富的电脑用户的发行版。带有许多面向管理员和程序开发的工具，`openSUSE` 是对技能有心的用户的最佳操作系统。


    基于 Linux 内核的操作系统数量多得惊人。面对如此多的选择，你可能对从何开始以及如何安装感到困惑。如果有疑问（我们稍后会演示），请安装 `Ubuntu`
    或其变体。该系统对初学者非常友好，让 Linux 转换变得顺畅。但随着你技能的提高并想要更多，你可以安装另一个操作系统。


    ## 进入 Linux


    如果你已经准备好投入 Linux 发行版，要做的第一件事就是备份你的文件。重写硬盘上的操作系统将擦除任何数据，这意味着你备份任何想要保留的照片、音乐或文件。使用外部硬盘或在线存储站点（例如
    `Google Drive`）来临时存放你的文件。我们不对你丢失任何东西负责，请务必备份！


    '
- fmt: "\nThis is the point to make double sure you are ready to install Linux. Check\
    \ that your files are backed up, understand that you will be erasing your current\
    \ OS, and preferably have a Windows/OSX install disc handy in case you decide\
    \ to switch back. If you are indeed ready to switch, continue.\n\nWith the installation\
    \ media still inserted, turn on your computer. The first screen that you will\
    \ see is the `BIOS / UEFI` POST screen, and it will give a keyboard button that\
    \ you should press to enter setup..This screen shows every time you boot, but\
    \ you probably pay no attention to it. Press the indicated key to enter the `BIOS`\
    \ setup. If you are too slow, the screen will disappear and your usual OS will\
    \ begin to load. If this happens, simply shut the computer back down and try again.\n\
    \nOnce within the `BIOS / UEFI`, you will have to navigate to the “boot order”\
    \ settings. Every computer’s `BIOS / UEFI` is slightly different, so we cannot\
    \ explain the process in detail. But generally you can follow button prompts at\
    \ the bottom of the screen to understand how to navigate. After arriving at the\
    \ boot order settings, place your boot medium at the top of the list. As an example,\
    \ if you used a USB drive, then you would see its name and have to bring it to\
    \ top of the list. These settings control the order in which the PC searches for\
    \ operating systems. With our boot medium at the top of the list, it will boot\
    \ into our downloaded Linux image instead of our usual OS. Save your settings\
    \ and restart the computer. If everything was done correctly the computer will\
    \ begin to boot into `Ubuntu`.\n\nBut if something goes wrong, try troubleshooting\
    \ it with these tips:\n\n*   Primary OS boots instead of Linux – You probably\
    \ did not save the settings with your alternate boot medium at the top of the\
    \ list. The PC is still defaulting to the internal `HDD` to boot.\n*   “No boot\
    \ media found” – Did you “drag and drop” your Linux image onto the media instead\
    \ of writing it? Without explicitly telling the computer it is bootable, it will\
    \ not know what to do with the data files on the media. Alternatively, you could\
    \ have a corrupted download, or an incomplete write. Try downloading the image\
    \ again and making another installation.\n*   “Kernel Panic” – Something is wrong\
    \ with the boot process. See above for the possibility of a corrupted installation.\
    \ Otherwise, the image you are trying to install may not be compatible with your\
    \ hardware. IF you see any other error messages, do an Internet search on them.\
    \ For prebuilt computers and laptops, search for the model name and Linux to find\
    \ other user’s experiences. Finally, you might have attempted to install a 64-bit\
    \ image on a 32-bit computer. With your next image download, specifically select\
    \ a 32-bit image.\n*   “Problem reading data from CD-ROM…” – Try using a different\
    \ install medium, because some distributions no longer support CD and DVD installations.\
    \ USB drives are recommended.\n*   PC seems to boot, but there is nothing at all\
    \ on the screen – If you are using a dedicated graphics card (compared to integrated\
    \ GFX from the CPU), Linux might not be recognizing it completely. Plug your monitor\
    \ into the motherboard directly instead of the card.\n\nBut most of those problems\
    \ are rare or simply due to user error. Linux has high compatibility and is relatively\
    \ easy to install/use past the initial installation. The typical user will have\
    \ `Ubuntu` boot successfully at this point, and they will be presented with a\
    \ working computing environment.\n\nThe desktop you see is referred to as a “Live\
    \ CD”, which is pretty much a demonstration of the OS and how it works. You have\
    \ not actually installed the OS to your hard drive yet, as it is still running\
    \ directly from your boot media. It is a chance for you to test out Linux without\
    \ actually removing your primary OS, so take the opportunity to explore how Linux\
    \ distributions work.\n\n## Ubuntu Basics\n\nSimilar to Windows, `Ubuntu` has\
    \ a desktop graphical user interface. Applications open within Windows that can\
    \ be maximized, minimized, closed, and moved around with the top bar. Ubuntu also\
    \ has a “task bar” of sorts that functions much like its Windows counterpart-\
    \ icons resemble programs that can be launched by clicking on them. The “Windows\
    \ Button” (called the Dash Button) on the task bar is used to open a search functionality\
    \ from which you can type in the name of a program or file on your computer to\
    \ quickly start it.\n\nFurthermore, there is a bar at the top of the screen that\
    \ works like the “menu” bar of other operating systems. This is where drop-down\
    \ menus such as “file”, “edit”, “help”, etc… will appear once a program is active.\n\
    \nBesides a few nominal differences Ubuntu functions is a very familiar way. In\
    \ fact, many of the programs that you may already use on other operating systems,\
    \ such as `Firefox`, are available and sometimes preinstalled on Linux distributions.\
    \ With enough experimentation and practice, you will be able to navigate the GUI\
    \ of `Ubuntu` as if you were a professional. Continue exploring the system, and\
    \ continue if you are ready to replace your main operating system with this Linux\
    \ one.\n\n## Installing Linux\n\nOn the desktop, you will see an “Install Ubuntu\
    \ 16.04 LTS” icon. Double clicking it will launch an application that makes installation\
    \ very easy. If you are not connected to the Internet, do so now by plugging in\
    \ an Ethernet cord or by connecting to Wi-Fi from the top right icon. Select your\
    \ language and click “continue”. The next prompt will ask whether you would like\
    \ to download updates and install third-party software during the OS installation.\
    \ These options are highly recommended for beginners, so check them and click\
    \ “continue”.\n\nThe application will move on to another screen asking for your\
    \ install method. There are various options, such as erasing the disk altogether,\
    \ installing alongside your primary OS, or updating a previous version of Linux.\
    \ Select an option that works best for you. If you are still hesitant about making\
    \ a full switch, elect to install `Ubuntu` as your secondary OS. That option will\
    \ allow you to choose which OS to boot into after the `BIOS` screen. Nevertheless,\
    \ select your option and click “install now”.\n\nWhile `Ubuntu` installs, you\
    \ can specify a few other options, such as your time zone, computer name, account\
    \ name, and password. The entire installation should not take too long, but it\
    \ will take long enough that your computer should be plugged in (if it is a laptop).\
    \ After finishing, the OS will require a reboot. Congratulations, you now have\
    \ a usable Linux system on your computer.\n\n Managing Hardware and Software\n\
    \nHardware in Linux is actually much easier to manage than hardware on Windows.\
    \ Instead of downloading individual drivers for devices, most of the drivers are\
    \ built-in to the OS itself. This means that most popular devices can simply be\
    \ installed with no further steps involved before they are usable. Printers, networks,\
    \ hard drives, and other common devices are included- fiddling with drivers is\
    \ not usually needed on Linux.\n"
  raw: 'This is the point to make double sure you are ready to install Linux.  Check
    that your files are backed up, understand that you will be erasing your current
    OS, and preferably have a Windows/OSX install disc handy in case you decide to
    switch back.  If you are indeed ready to switch, continue.


    With the installation media still inserted, turn on your computer.  The first
    screen that you will see is the BIOS / UEFI POST screen, and it will give a keyboard
    button that you should press to enter setup.  This screen shows every time you
    boot, but you probably pay no attention to it.  Press the indicated key to enter
    the BIOS setup.  If you are too slow, the screen will disappear and your usual
    OS will begin to load.  If this happens, simply shut the computer back down and
    try again. 


    Once within the BIOS / UEFI, you will have to navigate to the “boot order” settings. 
    Every computer’s BIOS / UEFI is slightly different, so we cannot explain the process
    in detail.  But generally you can follow button prompts at the bottom of the screen
    to understand how to navigate.  After arriving at the boot order settings, place
    your boot medium at the top of the list.  As an example, if you used a USB drive,
    then you would see its name and have to bring it to the top of the list.  These
    settings control the order in which the PC searches for operating systems.  With
    our boot medium at the top of the list, it will boot into our downloaded Linux
    image instead of our usual OS.  Save your settings and restart the computer. 
    If everything was done correctly the computer will begin to boot into Ubuntu.


    But if something goes wrong, try troubleshooting it with these tips:


    *   Primary OS boots instead of Linux – You probably did not save the settings
    with your alternate boot medium at the top of the list.  The PC is still defaulting
    to the internal HDD to boot.


    *   “No boot media found” – Did you “drag and drop” your Linux image onto the
    media instead of writing it?  Without explicitly telling the computer it is bootable,
    it will not know what to do with the data files on the media.  Alternatively,
    you could have a corrupted download, or an incomplete write.  Try downloading
    the image again and making another installation.


    *   “Kernel Panic” – Something is wrong with the boot process.  See above for
    the possibility of a corrupted installation.  Otherwise, the image you are trying
    to install may not be compatible with your hardware.  IF you see any other error
    messages, do an Internet search on them.  For prebuilt computers and laptops,
    search for the model name and Linux to find other user’s experiences.  Finally,
    you might have attempted to install a 64-bit image on a 32-bit computer.  With
    your next image download, specifically select a 32-bit image. 


    *   “Problem reading data from CD-ROM…” – Try using a different install medium,
    because some distributions no longer support CD and DVD installations. USB drives
    are recommended.


    *   PC seems to boot, but there is nothing at all on the screen – If you are using
    a dedicated graphics card (compared to integrated GFX from the CPU), Linux might
    not be recognizing it completely.  Plug your monitor into the motherboard directly
    instead of the card.   


    But most of those problems are rare or simply due to user error.  Linux has high
    compatibility and is relatively easy to install/use past the initial installation. 
    The typical user will have Ubuntu boot successfully at this point, and they will
    be presented with a working computing environment. 


    The desktop you see is referred to as a “Live CD”, which is pretty much a demonstration
    of the OS and how it works.  You have not actually installed the OS to your hard
    drive yet, as it is still running directly from your boot media.  It is a chance
    for you to test out Linux without actually removing your primary OS, so take the
    opportunity to explore how Linux distributions work. 


    Ubuntu Basics


    Similar to Windows, Ubuntu has a desktop graphical user interface.  Applications
    open within Windows that can be maximized, minimized, closed, and moved around
    with the top bar. Ubuntu also has a “task bar” of sorts that functions much like
    its Windows counterpart- icons resemble programs that can be launched by clicking
    on them.  The “Windows Button” (called the Dash Button) on the task bar is used
    to open a search functionality from which you can type in the name of a program
    or file on your computer to quickly start it. 


    Furthermore, there is a bar at the top of the screen that works like the “menu”
    bar of other operating systems.  This is where drop-down menus such as “file”,
    “edit”, “help”, etc… will appear once a program is active. 


    Besides a few nominal differences Ubuntu functions is a very familiar way.  In
    fact, many of the programs that you may already use on other operating systems,
    such as Firefox, are available and sometimes preinstalled on Linux distributions. 
    With enough experimentation and practice, you will be able to navigate the GUI
    of Ubuntu as if you were a professional.  Continue exploring the system, and continue
    if you are ready to replace your main operating system with this Linux one. 


    Installing Linux


    On the desktop, you will see an “Install Ubuntu 16.04 LTS” icon.  Double clicking
    it will launch an application that makes installation very easy. If you are not
    connected to the Internet, do so now by plugging in an Ethernet cord or by connecting
    to Wi-Fi from the top right icon.  Select your language and click “continue”.
    The next prompt will ask whether you would like to download updates and install
    third-party software during the OS installation.  These options are highly recommended
    for beginners, so check them and click “continue”. 


    The application will move on to another screen asking for your install method. 
    There are various options, such as erasing the disk altogether, installing alongside
    your primary OS, or updating a previous version of Linux.  Select an option that
    works best for you.  If you are still hesitant about making a full switch, elect
    to install Ubuntu as your secondary OS.  That option will allow you to choose
    which OS to boot into after the BIOS screen.  Nevertheless, select your option
    and click “install now”.


    While Ubuntu installs, you can specify a few other options, such as your time
    zone, computer name, account name, and password.  The entire installation should
    not take too long, but it will take long enough that your computer should be plugged
    in (if it is a laptop).  After finishing, the OS will require a reboot.  Congratulations,
    you now have a usable Linux system on your computer.  Throughout the next chapters
    in this publication we will focus on Linux concepts, how do achieve certain tasks,
    and how to further your knowledge of your system. 


    Managing Hardware and Software


    Hardware in Linux is actually much easier to manage than hardware on Windows. 
    Instead of downloading individual drivers for devices, most of the drivers are
    built-in to the OS itself.  This means that most popular devices can simply be
    installed with no further steps involved before they are usable.  Printers, networks,
    hard drives, and other common devices are included- fiddling with drivers is not
    usually needed on Linux.'
