- "# 黑客大学：新生版：如何成为业余黑客必备初学者指南（黑客、如何黑客、初学者黑客指南，……（黑客自由与数据驱动）（第一卷）\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n精准学习和征服 Linux 操作系统的最佳入门指南。一份关于 Linux 命令行如何工作原理的完整分步指南。\n\n\n![](img/00001.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n\n# 免责声明\n\n\n## 引言\n\n电脑包含两个功能组件——软件和硬件。硬件是用于旋转、计算和使用电力执行计算的物理部分，但软件是一个更虚拟的概念。本质上，软件由向硬件提供指令的编程代码组成——告诉各个部分要做什么。有“高级”软件，如网络浏览器、文字处理器、音乐播放器等。但经常被忽视的组件是被称为操作系统的“低级”软件。\n\
  \n我们的个人电脑运行需要操作系统。在办公室或使用相对廉价的台式电脑时，使用的操作系统可能是微软的 `Windows`。内容创作者、作家和图形艺术家更喜欢苹果电脑，因为它们配备了专注于创意的\
  \ `OSX` 操作系统。这两个操作系统 `Windows` 和 `OSX` 多年来一直主导消费市场。然而，存在另一种替代操作系统，它在易用性、自定义、安全性和价格方面表现出色。基于相对不为人知的\
  \ `Linux` 的操作系统在所有这些领域都达到并超过了要求，但它仍然是一个许多人甚至听说过的冷门选项。\n\n\n\n\n首先，`Linux` 是免费的。`GNU`\
  \ 的背景将 `Linux` 置于一种“免费且开源”的理念中，大部分（不是全部）随 `Linux` 分发的软件都是免费的。免费开源（`FOSS`）指的是两点：软件在金上是免费的，而且源代码也是透明的。`FOSS`\
  \ 与专有软件的区别在于，`FOSS` 的一切都是开放的，在使用时不涉及任何隐藏的间谍软件、费用或陷阱。软件通常更安全，因为任何人都可以对公开的源代码做出贡献并使其变得更好。由于\
  \ `Linux` 以及你为其下载的大多数软件都是免费的，因此对于预算有限的小型企业或个人用户来说，这是一个极好的操作系统。当然，不收费并不会牺牲质量，因为 Linux\
  \ 项目及其各种发行版都是社区驱动的，并通过捐赠维持资金。相比之下，`Windows` 的成本通常仅操作系统就需要几百美元。`Microsoft Office`\
  \ 是一个流行的文档写作套件，但它的价格也很高。`Linux` 中存在这些程序的免费替代方案，它们在质量上完全可以与大牌产品相比。\n\nPC 所有者最大的抱怨可能是病毒。`Windows`\
  \ 计算机特别容易受到感染，甚至反病毒软件公司也一直在追赶最新的威胁。仅仅是访问一个恶意网站通常就足以感染计算机，许多用户选择 `Mac` 计算机是因为与恶意软件相关的事件频率显著低得多。基于\
  \ `Linux` 的操作系统与 `Mac` 相似之处在于，病毒几乎不存在。这种安全性的提升使得任何担心隐私、安全或可靠性的人切换到 `Linux` 都是必经之路。\n\
  \n`Linux` 在企业和政府机构中非常流行。这是因为高功率服务器和关键设备在使用 `Linux` 作为操作系统时，运行表现会明显得多。该操作系统也以可靠性和稳定性著名。虽然\
  \ `Windows` 计算机需要定期重启和维护来“刷新”一下状态并防止其运行变慢，但 `Linux` 服务器可以运行几个月甚至几年而无需重启。IT 专业人员由于其声誉，不可避免地选择\
  \ `Linux` 作为其网络的骨干。其闻名的稳定性在桌面平台也适用于消费者，而且对我们来说也绝对有用。\n\n也许使用 `Linux` 最大的好处是速度。低系统要求意味着，在\
  \ `Windows` 上通常运行缓慢迟钝的电脑在 `Linux` 上会变得敏捷快速。对电脑运行变慢感到沮丧的用户可以更换操作系统以获得更响应的体验。此外，`Linux`\
  \ 可以安装在旧电脑上以使其重发生机。因此，尽管那台旧笔记本电脑可能已经过时无法运行最新版本的 `Windows`，但可能有一个 `Linux` 发行版可以再压榨出几年的实用寿命。\n\
  \n定制化是技术领域备受推崇的功能。`Windows` 尤其是 `OSX`，由于担心普通用户会弄坏它，限制了你对操作系统可以做的操作。`Linux` 并非如此，因为它鼓励编辑和更改操作系统的视觉效果和功能。当然，这并非必须，而且大多数\
  \ `Linux` 发行版的默认配置非常稳定，难以被无意破坏。但对于那些喜欢越狱、模组化和玩电脑的人来说，`Linux` 可以促进创意方面的发挥，甚至为好奇的黑客提供在其他系统中无法使用的工具。\n\
  \n最后，`Linux` 兼容极其广泛的设备。`Linux` 可以运行在几乎任何架构上，这意味着它可以安装在手机、台式机、笔记本电脑、服务器、游戏主机和“智能”设备上。爱好者乐于仅仅在小众、老旧或奇特的设备上安装\
  \ `Linux`，仅仅是因为他们这样做。对于普通用户来说，这意味着 `Linux` 可能与你的电脑兼容。\n\n总的来说，`Linux` 在许多领域胜过了主流操作系统。所有这些因素绝对让\
  \ `Linux` 成为你电脑的更好选择，你应该使用它来获得这些受崇的功能。艺术家、黑客、创意人士、小企业主、技术极客、非技术人员以及几乎每个人都能在 `Linux`\
  \ 中找到自己喜欢的东西。广泛的发行版意味着每个人都有适合自己的，所以今天就安装 `Linux` 吧，看看你能从中获得什么。\n\n## Linux 发行版\n\
  \n安装 `Linux` 可以可以通过方式完成，例如将操作系统的镜像刻入光盘、写入 `USB`、从网上订购 `Live CD`、格式化 `SD 卡` 或通过 `Virtual\
  \ Box` 尝试。但归结底，你不能仅仅安装“Linux”就获得一个可用的操作系统。由于 `Linux` 只是内核，你还需要其他提供图形用户界面、互联网访问等等软件。如前所述，存在\
  \ `Linux` 的“发行版”。发行版是 `Linux` 的版本，包含了预装的程序以及独特的风格和侧重点。发行版提取 `Linux` 的核心并将其转化为一个适合日常使用的整个操作系统。\n\
  \n发行版的数量多到令人难以信。某些具有特定用途，例如用于黑客的 `Kali Linux`、用于教育的 `Sugar Linux` 或用于定制的 `Arch Linux`。其他的更具通用性，例如\
  \ `Ubuntu` 和 `Debian`。要让安装 `Linux` 发挥最大作用，你需要了解不同的发行版，并决定哪一个最适合你。阅读以下章节以了解一些最流行的发行版分别用途的。\n\
  \n`Ubuntu` 是写本文时最广为人知的发行版。在整个 2000 年代，它因用户友好和直观而广受欢迎。`Ubuntu` 基于此较早的 `Debian` 发行版，在在使用上与\
  \ `Windows` 计算机非常相似，这意味着它是 Linux 新新手的极佳选择。正因如此，我们将在书的后半部分安装 Ubuntu 变体。`Canonical\
  \ Ltd` 是积极开发 `Ubuntu` 的公司—— yearly 版本意味着操作系统始终保持更新，并能与新兴技术兼容。尽管如此，Ubuntu 仍然可以在许多旧设备上以合理的速度运行。应用程序可以从某种“商店”中安装，这意味着初学者不需要理解复杂的命令行。结论是，Ubuntu\
  \ 发行版是首次 Linux 用户的很好的选择，你应该安装它来学习 Linux 是如何工作的，而无需深入更困难的发行版。\n\n对于更具体的计算情况，Ubuntu\
  \ 拥有各种子发行版或“口味”。这些是以 Ubuntu 为基础但侧重点不同的发行版，例如 `Lubuntu` 对轻量级应用的强调。这里有几个：\n\n- Lubuntu：一种为旧旧硬件或资源有限的计算机设计的\
  \ Ubuntu 版本。安装文件小于 1GB，且硬件要求比标准 Ubuntu 低得多。使用此发行版来恢复旧电脑，同时保留 Ubuntu 的易用性。\n\n- Ubuntu\
  \ Studio：面向艺术家的 Ubuntu，包括数字画家、音频制作和视频视频编辑。Ubuntu Studio 是 Ubuntu 但预安装了编辑工具。\n\n\
  - Kubuntu：使用 KDE 桌面环境重新装皮肤的 Ubuntu。Kubuntu 的外观和感觉与经典的 Ubuntu 感觉不同，它提供了一个更符合其他操作系统传统的桌面环境。\n\
  \n\n\n\n## Ubuntu 发行版\n\n- `Xubuntu` 是另一个轻量级发行版，但不如 `Lubuntu` 那么精简。`Xubuntu` 牺牲了体积和硬件要求，以提供一个可以在旧但不过太老的电脑上运行的操作系统。它显然比其他极简的\
  \ Linux 发行版更美观，而且它以 `Ubuntu` 为基础，具有易用性和熟悉感。\n- `Ubuntu Server` – 一种更适合工业和企业需求的 `Ubuntu`\
  \ 变体，`Ubuntu server` 可以无头模式运行，并为网络中的其他 Linux 系统提供功能。\n- `Mythbuntu` – 一个预装了电视流媒体和直播电视节目的变体。这是一个对于通过\
  \ `Kodi` 将旧电脑转换为“智能电视”设备的绝佳发行版。\n\n总之，`Ubuntu` 广泛的发行版意味着每个人都有一个适合初学者的操作系统。强烈建议你利用\
  \ Ubuntu 包含的易用性特性和通用熟悉度。它可以作为一个阶梯式的操作系统，逐步引导你接触 Linux。务必将其作为你的第一个 Linux 体验来安装。\n\
  \n## 流行发行版\n\n`Linux Mint` 是 Linux 世界中使用非常频繁的操作系统。“强大且易用”，`Mint` 包含了 `FOSS`（自由开源软件）和专有软件，旨在为\
  \ Linux 初学者提供完整的体验。虽然不是完全像 Linux，但 `Mint` 是作为第一个备用操作系统的极佳选择。它一直位列全球最常用的操作系统之列，其默认布局与\
  \ Windows 非常相似，有助于平滑过渡到 Linux 世界。\n\n`Debian` 是最古老的 Linux 发行版之一，创建于 1993 年。结合了 Linux\
  \ 哲学，`Debian` 将稳定和稳固作为指导开发的内核原则。显然，`Debian` 存在的时间长度就是其精炼程度的指标，因此那些追求无 Bug 无故障体验的用户可以转向\
  \ `Debian`。自由开源软件在 `Debian` 中也有一席之地，因为包含的大部分软件都是 `FOSS`。不过，这并不意味着你受到了限制，因为有一个官方的非免费软件库，用于运行像\
  \ `Adobe Flash` 这样的专有程序。`Debian` 对初学者来说是一个不错的选择，但 `Ubuntu` 仍然是最好的入门操作系统。安装 `Debian`\
  \ 是为了稳定性、`FOSS` 以及纯正的 Linux 体验。\n\n`Slackware` 是一个比 `Debian` 还要老的操作系统。它保持接近原始 Linux\
  \ 的设计，这意味着你必须安装自己的 GUI 和程序依赖项。由于这个事实，`Slackware` 主要面向中级 Linux 用户，因为初学者会由于这些不熟悉的方法感到困惑。然而，如果你想体验一个接近\
  \ `UNIX` 根的 Linux 发行版，`Slackware` 可以为你提供服务。\n\n`Fedora` 是一个更倾向于工作站和业务用途的操作系统。甚至\
  \ `Linus Torvalds` 本人也是 `Fedora` 的用户，这归功于该操作系统的流行和使用。`Fedora` 更新非常频繁，意味着它始终处于最新状态并处于\
  \ Linux 技术的最前沿。安全和 `FOSS` 也是该操作系统的重点，这就是为什么它通常被用于小型企业的终端电脑。不过，使用 `Fedora` 可能会面临挑战，因此请将其视为一个中级操作系统。\n\
  \n`Arch Linux` 是另一个发行版，但它主要为经验丰富的用户设计。该操作系统以系统外壳的形式出现，用户可以根据喜好进行自定义，只添加他们需要的程序和服务。由于这个原因，`Arch`\
  \ 很难安装，但也是非常有收获的学习性体验。通过构建自己的个人系统，你将理解那些在高级别发行版中被隐藏的深层 Linux 概念。在非常熟悉基础知识后再安装这个高级操作系统。\n\
  \n## 特色发行版\n\n最后，还有许多值得提及的独特发行版。在接下来的列表中，我们将讨论其中几个。请注意，发行版如此之多，这整本书都可以用来描述每一个细分领域的用用例。\n\
  \n- `CrunchBang` – 一个基于 `Debian` 的发行版，旨在减少资源消耗。它非常简单，没有包含某些发行版默认包含的臃肿软件。`CrunchBang`\
  \ 运行速度快且在计算方面非常高效。\n- `Android` – 这个流行的手机操作系统实际上是 Linux 的变体。由于许多手机的配置低于全功能桌面电脑，该操作系统是笔记本电脑、触摸屏设备或家庭媒体电脑的极佳选择。此外，你可以使用\
  \ `Play` 商店中的许多 `Google Apps`，这意味着你的手机和电脑上可以使用成千上万的应用程序、游戏和工具。虽然不建议将其作为你的第一个 Linux\
  \ 操作系统，但它绝对是实验旧电脑或孩子电脑的巧妙精妙选择。\n- `Chrome OS` – 另一个由 `Google` 开发的移动类型操作系统，`Chrome\
  \ OS` 本质上是一个用于在线使用的轻量级 Linux 浏览器。`Google` 在他们的 `ChromeBooks` 上预装了该系统，这些设备的配置比其他笔记本低。但该系统实际上就是一个全屏\
  \ `Chrome` 浏览器，因此它对于想要简单体验或专用上网机器的用户非常完美。\n- `Tiny Core` – 一个以兆字节为单位的操作系统，`Tiny\
  \ Core` 用于老旧电脑或嵌入式设备。该操作系统主要面向心有爱好项目或特定用途的中级用户。\n- `Damn Small Linux` – 另一个极简的 Linux\
  \ 变体，该操作系统最适合快速访问 Linux 命令行。\n- `openSUSE` – 这是一个面向经验丰富的电脑用户的发行版。带有许多面向管理员和程序开发的工具，`openSUSE`\
  \ 是对技能有心的用户的最佳操作系统。\n\n基于 Linux 内核的操作系统数量多得惊人。面对如此多的选择，你可能对从何开始以及如何安装感到困惑。如果有疑问（我们稍后会演示），请安装\
  \ `Ubuntu` 或其变体。该系统对初学者非常友好，让 Linux 转换变得顺畅。但随着你技能的提高并想要更多，你可以安装另一个操作系统。\n\n## 进入\
  \ Linux\n\n如果你已经准备好投入 Linux 发行版，要做的第一件事就是备份你的文件。重写硬盘上的操作系统将擦除任何数据，这意味着你备份任何想要保留的照片、音乐或文件。使用外部硬盘或在线存储站点（例如\
  \ `Google Drive`）来临时存放你的文件。我们不对你丢失任何东西负责，请务必备份！\n\n\n\n\n\n在这里，请务必再次确认你已准备好安装 Linux。检查你的文件是否已备份，理解你将擦除当前的操作系统，并且最好手头准备好\
  \ Windows/OSX 安装光盘，以防你决定切换回来。如果你确实已准备好切换，请继续。\n\n在安装介质仍然插入的情况下，启动电脑。你看到的第一个屏幕是 `BIOS\
  \ / UEFI` 的自检（POST）屏幕，它会显示一个你应该按下的键盘按键以进入设置。这个屏幕在每次启动时都会显示，但你可能并没有注意它。按下指定的按键进入\
  \ `BIOS` 设置。如果你操作太慢，屏幕将会消失，你常用的操作系统将开始加载。如果发生这种情况，只需关机电脑并重试即可。\n\n一旦进入 `BIOS / UEFI`，你必须导航到“启动顺序”（boot\
  \ order）设置。每台电脑的 `BIOS / UEFI` 略有不同，因此我们无法详细解释这一过程。但通常情况下，你可以按照屏幕底部的按钮提示来了解如何导航。到达启动顺序设置后，将你的启动介质放在列表的最顶部。例如，如果你使用的是\
  \ USB 驱动器，你会看到它的名称并将其移至列表顶部。这些设置控制了 PC 搜索操作系统的顺序。将我们的启动介质放在列表顶部，它将启动到我们下载的 Linux\
  \ 镜像，而不是常用的操作系统。保存你的设置并重启电脑。如果一切操作正确，电脑将开始启动进入 `Ubuntu`。\n\n但如果出现问题，请尝试通过以下提示进行故障排除：\n\
  \n*   启动的是主操作系统而非 Linux – 你可能没有保存将备用启动介质放在列表顶部的设置。PC 仍然默认从内部 `HDD` 启动。\n*   “未找到启动介质”（No\
  \ boot media found）—— 你是在介质上“拖放”了 Linux 镜像而不是写入它？如果不显式告诉电脑它是可启动的，它将不知道如何处理介质上的数据文件。或者，你下载的镜像损坏，或者写入不完整。尝试重新下载镜像并再次进行安装。\n\
  *   “内核恐”（Kernel Panic）—— 启动过程出现问题。请参上文关于安装损坏的可能性。否则，你尝试安装的镜像可能与你的硬件不兼容。如果你看到任何其他错误信息，请在互联网上搜索它们。对于预装电脑和笔记本电脑，搜索型号名称和\
  \ Linux 以查找其他用户的经验。最后，你可能尝试在 32 位的电脑上安装 64 位镜像。在下次下载镜像时，请专门选择 32 位镜像。\n*   “从 CD-ROM\
  \ 读取数据错误”（Problem reading data from CD-ROM…）– 尝试使用不同的安装介质，因为某些发行版不再支持 CD 和 DVD 安装。建议使用\
  \ USB 驱动器。\n*   PC 似乎启动了，但屏幕上没有任何 – 如果你使用的是独立显卡（相对于 CPU 的集成显），Linux 可能无法完全识别它。请将显示器直接插入主板而不是显卡。\n\
  \n但大多数此类问题都是罕见的，或者仅仅是由于用户操作失误。Linux 具有很高的兼容性，而且在初始安装之后，相对容易安装/使用。典型用户此时应该已经成功启动了\
  \ `Ubuntu`，他们将获得一个可以使用的计算环境。\n\n你看到的桌面被称为“现场版”（Live CD），这基本上是操作系统及其工作方式的演示。你尚未将操作系统实际安装到硬盘中，因为它仍然直接从你的启动介质运行。这是一个让你测试\
  \ Linux 而无需实际移除主操作系统的机会，所以请利用这个机会探索 Linux 发行版是如何工作的。\n\n## Ubuntu 基础\n\n与 Windows\
  \ 类似，`Ubuntu` 拥有桌面图形用户界面。窗口内打开的应用程序可以通过顶栏进行最大化、最小化、关闭和移动。Ubuntu 也有某种类似于“任务栏”，其功能与\
  \ Windows 的对应物非常相似——图标代表了点击即可启动的程序。任务栏上的“Windows 按钮”（称为 Dash 按钮）用于打开搜索功能，你可以在其中输入计算机程序或文件的名称来快速启动它们。\n\
  \n此外，屏幕顶部有一条栏，作用类似于其他操作系统的“菜单”栏。当程序处于激活状态，这里将出现如“文件”、“编辑”、“帮助”等下拉菜单。\n\n除了功能上一些细微的差异外，Ubuntu\
  \ 的运行方式非常熟悉。事实上，你可能已经在其他操作系统使用的许多程序（例如 `Firefox`）在 Linux 发行版中也是可用的，有时甚至是预装。通过足够的实验和练习，你将能够像专业人士一样操作\
  \ `Ubuntu` 的图形界面。继续探索系统吧，如果你准备好用这个 Linux 替换你的主操作系统，请继续下去。\n\n## 安装 Linux\n\n在桌面上，你会看到一个“安装\
  \ Ubuntu 16.04 LTS”图标。双击它将启动一个让安装变得非常简单的应用程序。如果你没有连接互联网，请现在插入以太网线或通过右上角的图标连接 Wi-Fi。选择你的语言并点击“继续”。下一个提示将询问你是否希望在操作系统安装期间下载更新并安装第三方软件。这些选项对初学者是强烈建议的，因此勾选它们并点击“继续”。\n\
  \n应用程序将进入另一个屏幕，询问你的安装方法。有多种选项，例如完全擦除磁盘、与你的主操作系统一起安装，或更新之前的 Linux 版本。选择一个最适合你的选项。如果你对完全切换仍犹豫不决，请选择将\
  \ `Ubuntu` 作为次要操作系统。该选项将允许你在 `BIOS` 界面之后选择进入哪种操作系统。尽管如此，选择你的选项并点击“现在安装”。\n\n在 `Ubuntu`\
  \ 安装期间，你可以指定其他选项，例如时区、计算机名称、帐户名称和密码。整个安装过程不会花费太长时间，但耗的时间足够让你的电脑插上电源（如果是笔记本电脑）。完成后，操作系统将需要重启。恭喜，你现在电脑上有了一个可用的\
  \ Linux 系统。\n\n 管理硬件与软件\n\nLinux 中的硬件管理实际上比 Windows 硬件要容易得多。无需为设备下载单独的驱动程序，大多数驱动程序内置在操作系统本身中。这意味着大多数流行设备仅需安装后，无需其他后续步骤即可使用。打印机、网络、硬盘和其他常见设备都包含在内——在\
  \ Linux 上通常不需要折腾驱动程序。\n\n\n\n\n然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥全部效率。因为尽管你的显卡在 Linux\
  \ 下默认可以工作，但其内部秘密且往往被隐藏的技术只有通过该公司的软件才能被充分利用。在 Ubuntu 上，这个过程非常简单——打开“附加驱动”（additional\
  \ drivers）应用程序并让操作系统为你搜索。在确定你拥有这些设备后，它会询问你想要使用哪个版本的驱动。按照屏幕上的任何提示启用第三方驱动。对于未出现的设备，请在制造商的网站上进行网络研究，确定他们是否发布了你可以下载的特定\
  \ Linux 驱动。\n\n软件是 Linux 优于 Windows 的另一个方面。就像苹果电脑一样，Ubuntu 有一种类似于应用商店，你可以在其中搜索与设备兼容的应用程序仓库，只需点击几次即可下载并安装。只需在\
  \ Dash 启动器搜索“Ubuntu 软件中心”（Ubuntu Software Center）即可打开应用程序。在那里，你可以浏览“游戏”（Games）、“办公”（Office）或“系统”（System）等类别的程序列表，也可以直接按名称搜索。找到程序后，点击它，然后点击“安装”（install）将下载加入队列。在验证身份后，软件将自动下载并安装。此后，可以通过在\
  \ Dash 中搜索来运行该应用程序。\n\n安装软件的另一种方法是通过终端，我们稍后会讨论。Ubuntu 并不完全限于应用商店中的软件，因为从互联网下载的程序也可以安装。再次，我们将在讨论完终端后提到这个主题。\n\
  \n总的来说，在 Ubuntu 中管理硬件和软件是非常毫不费力的。无论是安装新硬件设备还是下载流行程序，Linux 发行版都能让你的计算体验毫无故障。这并不是说\
  \ Linux 完全是为初学者设计的，因为我们将学习，Linux 绝对是高级用户和经验丰富的管理员的绝选择。\n\n# 命令行 / 终端\n\n在现代计算机之前，硬件和软件完全通过键盘进行交互。鼠标带来了图形化界面并简化了流程，但许多功能仍然保持纯文本形式，以避免向终端用户呈现复杂的选项。在\
  \ Linux 中，这一过程一直持续今天。大多数发行版都存在 GUI，但每个 Linux 发行版也内置了基于文本的界面，可以在其中输入并执行强大的命令。将终端想象为一个得强大的命令行提示符，因为你完全可以通过终端单独使用你的计算机。拥有足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。\n\
  \n通过 Dash 启动或使用键盘快捷键 `Ctrl+Alt+T` 启动终端。一个紫色窗口将打开并等待你的输入。你可以输入命令并按回车激活它。对于我们的第一个命令，输入\
  \ `ls`。它是 list（列表）的缩写，将显示当前目录下的所有文件。你将看到 `Home`（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入\
  \ `pwd` 来打印工作目录并显示你当前浏览的文件夹名称。在学习命令时，将它们记录下来有助于更好地内化它们的用法。\n\n## 管理目录\n\n目录（Directories）是文件夹的另一个名称，它们的工作方式与其他操作系统相同。文件夹存放文件，你必须当前访问某个目录才能与其中的文件进行交互。你可以使用终端命令\
  \ `cd` 来更改目录并在文件系统中移动。例如，在 `Home` 文件夹中输入 `cd Desktop` 将带你进入该文件夹。现在使用 `ls` 将不会显示任何内容（除非你向桌面上添加了文件）。要退回上一级，输入\
  \ `cd ..`。按照这种方式在文件系统中练习导航；`cd` 进入目录并使用 `ls` 查看文件。\n\n由于你正在输入命令，Linux 期望你的输入是精确的。如果你拼错了命令，它将无法工作。（注：原文此处后续有大量重复内容，译文已按核心逻辑处理）。\n\
  \n\n\n\n`apt`（高级软件包工具）是 Ubuntu 中用于管理应用程序的命令。其他发行版可能使用自己的工具，但 `apt` 因其庞大的软件库和简单的命令而被广泛使用。使用\
  \ `apt-get install` 格式安装软件包，在其中指定你想要安装的程序名称。在上面的示例中，我们通过包名 `chromium-browser` 指定了\
  \ Chromium 程序。鉴于你并不认识每一个包名，另一个命令 `apt-cache search` 可用于查找与所提供字符串匹配的包名。因此，执行 `apt-cache\
  \ search chromium` 将显示 `chromium-browser`，你可以指定正确的名称进行安装。\n\n`apt` 的用处不仅于此，你还可以使用几条命令来更新系统上的每一个应用程序。使用\
  \ `apt-get update` 刷新软件库，然后使用 `apt-get upgrade` 让每个应用程序自行升级到最新版本。Windows OS 用户应该对这种简单的过程感到羡慕，因为更新\
  \ Windows 程序通常需要卸载并重新安装最新版本。\n\n随着时间的推移，你可能需要更新 Ubuntu 版本。每年都会发布新版本，可以通过 `apt-get\
  \ dist-upgrade` 进行安装。保持最新的修复和新增功能，可以确保你的 Linux 系统长期健康地运行。你可能已经注意到，安装和更新系统不需要重启；这一特性有助于\
  \ Linux 计算机实现长时间运行并保持稳定性。最后，删除应用程序通过 `apt-get remove` 后接包名来完成。\n\n要运行我们安装的程序，我们可以从启动栏（dash）中搜索它们，也可以直接在终端中输入包名。输入\
  \ `chromium-browser` 启动程序与双击其图标完全相同。有些程序必须通过仅输入包名来从命令行启动，因为这些包不会出现在启动搜索中。总的来说，利用终端是一项节省时间的方法，也是摆脱缓慢笨重的图形用户界面的极佳方式。\n\
  \n软件包的易于安装和管理是 Linux 的一项非常实用的功能——精通它将提升你的体验。安装软件包还有第三种方法，从网上下载并运行 `.deb` 文件。某些软件是以这种格式打包的，它们的作用类似于\
  \ `.exe` 文件，只需双击即可开始安装过程。\n\n## 更多终端命令\n\n这里有几个你应该记住并在系统中运用的更多基础终端命令。完全理解基础知识将为你后续的构建打下坚实的基础。\n\
  \n*   `cp` – `cp image1.jpg image2.jpg` – 将第一个参数复制（并重命名）到第二个参数。使用 `-r` 切换拷贝目录。\n\
  *   `mv` – `mv cat.jpg /home/Pictures` – 将指定的文件移动到给定目录。\n*   `shutdown` – `shutdown\
  \ –h now` – 关闭计算机。`-h` 是表示“停止(halt)”的标签，但你也可以使用 `-r` 重启。`now` 指执行的时间。\n*   `date`\
  \ – `date` – 显示当前日期和时间。\n*   `free` – `free –g` – 显示程序的 RAM 使用情况。\n*   `du` – `du\
  \ –h` – 显示硬盘（HDD）使用情况。\n*   `ps` – `ps` – 显示占用 CPU 时间的活动进程。\n*   `touch` – `touch\
  \ memo.txt` – 用于在当前目录下创建一个指定名称的新空文件。\n*   `ifconfig` – `ifconfig` – Linux 版的 `ipconfig`，用于显示网络信息。\n\
  \n某些命令带有相关的“标签”或“开关”。这些是以破折号开头的字母。它们的功能各异，学习为了什么目的使用哪些开关最好的方法是查看该命令的帮助页（manual pages）。查看高级章节以打开手册。\n\
  \n命令行中最实用的程序之一 `nano` 是一个简单的文本编辑器，可用于编辑文件并快速更改设置或脚本。通过在命令行输入 `nano` 访问它。你可以根据需要输入文件名，然后按\
  \ `ctrl+x` 保存并退出。在保存时，你将指定与其相关的名称和文件扩展；`notes.txt` 将创建一个名为 `notes` 的文本文件。或者，你也可以通过\
  \ `nano notes.txt` 来编辑文件。在那个示例中，我们在编辑器中打开 notes 并以可编辑的状态显示其内容。\n\n`Nano` 可能非常简单，但它对于快速更改和创建文件来说，无疑是强大且节省时间的。\n\
  \n## 连接到 Windows / Mac 计算机\n\nWindows 和 OSX 计算机内置了网络功能，如工作组、域、共享等。尽管如此，将 Linux 计算机集成到由\
  \ Windows 服务器主导的网络基础设施中相当容易，正确的设置将允许你看到 Windows 共享并加入公司域。\n\n相互通信的第一步是安装 `samba`\
  \ 软件包。可以通过软件中心找到它，或者输入 `sudo apt-get install samba` 来获取并安装必要的软件。\n\n从你的 Ubuntu 机器向其他计算机共享文件涉及创建一个\
  \ samba 共享。Samba 运行在与其他流行的文件共享方法相同的协议上，因此从 Ubuntu 共享的文件可以轻松在 Windows 上看到。安装 samba\
  \ 后，使用 `sudo nano /etc/samba/smb.conf` 开始编辑配置文件。\n\n```\n[share]\ncomment = File\
  \ Share from Ubuntu\npath = /srv/samba/share\nbrowsable = yes\nguest ok = yes\n\
  read only = no\ncreate mask = 0755\n```\n\n现在，创建 `path` 中指定的文件夹（`sudo mkdir -p /srv/samba/share`）并设置权限（`sudo\
  \ chown nobody:nogroup /srv/samba/`），以便任何人访问其内容。将你想共享的文件放入该目录，然后重启服务（`sudo restart\
  \ smbd, sudo restart nmbd`）使共享生效。最后，登录另一台计算机并导航到网络共享。在 Windows 中，它们将出现在文件管理器的左面板。如果共享没有自动出现，在文件路径框中输入\
  \ IP（通过 `ifconfig` 找到 Ubuntu IP）。你现在可以从操作系统访问 Ubuntu 的文件。\n\n你可能还需要在 Ubuntu 计算机查看来自操作系统的文件。首先，打开\
  \ Ubuntu 文件管理器。从菜单栏点击“文件”，然后选择“连接服务器”。在结果框中，输入你想访问的共享 URL。它可以是 FTP 地址（`ftp://ftp.test.com`）、HTTP\
  \ 地址（`http://test.com`）或共享地址（`smb://share/Folder`）。在不需要任何额外硬件或设置的情况下，你可以通过这种方式查看文件。\n\
  \n最后，加入 Active Directory 等域允许你的计算机与网络上的其他操作系统交互并完成其他面向业务的任务。无论你拥有的是小型家庭网络，还是将 Linux\
  \ 计算机加入公司域，过程都是一样的。安装一些额外的包（`realmd, sssd, ssd-tools, samba-common, samba-common-bin,\
  \ samba-libs, krb5-user, adcli, packagekit`）。在安装它们时，它会要求输入域名。用全大写输入。执行 `kinit -V\
  \ adminname` 将该名称替换为域中的实际管理员账户名称。输入密码后，你就通过了域的身份验证。现在加入域的操作通过执行 `realm --verbose\
  \ join -U adminmame domainname.loc` 完成。\n\n\n\n\n\n如果失败了，意味着我们设备上的 `DNS` 配置错误。输入\
  \ `echo ‘ad_hostname = nix01.domainname.loc’ >> /etc/sssd/sssd.conf`，然后输入 `echo\
  \ ‘dyndns_update = True’ >> /etc/sssd/sssd.conf`，最后使用 `service sssd restart` 使用新设置重启。第一行设置了我们计算机的\
  \ `FQDN`，因此需要根据我们的域设置更改该行。在正确配置并成功重启后，终端将声称它已加入域。使用 `realm list` 测试此项。现在连接到 `AD`\
  \ 后，你可以从服务器管理该 Linux 设备了！\n\n然而，对于大多数用户来说，创建共享和加入域远超了连接需求。简单的文件共享通过 USB 驱动器传输或如\
  \ `Dropbox` 等服务完成要更好。事实上，`Dropbox` 可以安装在三大操作系统上，并且无需额外设置即可在它们之间同步文件。在 `Ubuntu` 上，可以直接从网站下载\
  \ `.deb` 文件、从软件中心安装，或者使用 `sudo apt-get install nautilus-dropbox` 获取该程序。在 `Dropbox`\
  \ 文件夹内，放置任何你想在计算机间传输的文件，它将自动在你拥的所有其他 `Dropbox` 计算机上下载并更新。\n\n当它们连接在一起时，使用其他操作系统并不复杂。只要计算机在同一网络上，你就可以创建文件共享、将它们加入域或使用如\
  \ `Dropbox` 的简单服务。\n\n## 有用的应用程序\n\n这里是适用于你的 `Ubuntu` 系统的最佳应用程序列表，它们将帮助你充分利用计算机。\n\
  \n*   办公效率 – Abiword, `VI`, `Emacs`, `LibreOffice`, `nano`\n*   多媒体 – `VLC`, `DeaDBeef`,\
  \ `Cmus`, `AquaLung`, `MPlayer`, `Miro`\n*   网络浏览 – `Firefox`, `Chromium`, `Midori`,\
  \ `W3M`\n*   创意 – `Aud`\n*   `acity`, `GIMP`\n*   其他 – `Kupfer`, `Thunderbird`,\
  \ `qBittorrent`\n\n对于有助于提高易用性的程序，有许多不同的选择，取决于你想要实现什么。发现程序的最佳方法是在互联网上搜索你想要添加的功能。例如，如果你正在寻找一种快速打开和关闭终端的方法，你可能会遇到\
  \ `Guake` 程序。或者如果你想在终端中使用音频，它可能会推荐 `Cmus`。找到最适合你的应用程序是 Linux 定制化方面的一部分，它让每次安装对每个用户都更具个性化。\n\
  \n## 管理\n\n如果你在寻找某种意义的“控制面板”，你可以从 `System Settings` 应用程序内部找到管理工具的快捷方式，如网络、打印、键盘、外观等等。某些\
  \ `Ubuntu` 变体使用 `Settings Manager` 或仅 `Settings` 实现相同的目的。\n\n启动它后，将会有指向其他默认配置应用程序的链接；只需点击你需要更改的任何一项，即可获得设置几个选项的\
  \ GUI。但并不是所有管理内容都能通过 GUI 找到。大多数低级设置只能通过命令行可用，因此你需要确切知道要输入什么来编辑它们。\n\n例如，在 `Ubuntu`\
  \ 中添加新用户需要 `adduser` 命令。通过在命令后加上用户名，终端将提示基本信息和密码。将该新用户设置为管理员的操作通过 `usermod -aG sudo\
  \ nameofuser` 完成。此外，可以使用 `deluser` 删除用户。这些选项在 GUI 中很难找到，但在终端中几秒钟内即可完成。\n\n“任务管理器”，或对\
  \ `Ubuntu` 内运行程序的管理也是通过终端完成的。`top` 程序标准地安装在所有（大部分）发行版，启动它会显示类似于任务管理器的所有正在运行进程列表。但默认情况下，进程列表将更新并移动，导致可能难以读取我们所需的数据。按\
  \ `f` 键调出排序列表，用方向键导航到 `PID` 并按 `s` 设置该选项。现在使用 escape 键返回 `top`，我们现在可以使用页上键和页下键滚动列表以查看任务。例如，假设我们想关闭\
  \ `Pidgin` 程序，因为它没有响应。在列表中找到它（或使用上述过滤命令搜索它）并记下 `PID`（进程 ID）数字。按 `q` 退出 `top`，然后输入\
  \ `kill 4653`，显然将数字替换为 PID。在 `top` 运行的任何时候，你都可以按 `h` 查看各种操作的键盘快捷键列表。如果 `top` 太难用，可以考虑安装\
  \ `htop`，它是该程序的“人类可读”版本。它实际上显示了整洁的 ASCII 图形，详细说明 CPU、RAM 和其他使用统计。使用 F3 搜索程序，然后使用\
  \ F9 和 Enter 杀死它。\n\n至于服务，你可能注意到我们使用 `service` 命令来更改它们的状态。因此，启动 Web 服务器将通过 `service\
  \ apache2 start` 完成，重启通过将 start 替换为 restart 完成，停止通过将 start 替换为 stop 完成。通过 `service\
  \ ---status-all` 获取服务列表。服务是持续运行守护进程或后台任务。它们可以收集数据、运行如 `Bluetooth` 和 `Wi-Fi` 等服务或等待。\n\
  \n## 安全协议\n\nLinux 专注于安全，这有助于保持安全。一个从 UNIX 继承的特性是文件权限。每个文件有一组权限——所有者、组和权限。`chown`\
  \ 命令更改文件的所有者，`chgrp` 更改组，`chmod` 更改权限。发现文件或文件夹的权限通过输入 `ls -l` 完成。它将返回一条起困惑的行，例如\
  \ `-rw-rw--`。`R` 表示读，`W` 代表写，第三种选项是执行的 `X`。这三组分别是所有者、组和其他。因此，我们上面的示例文件为所有者及其组设置了读写权限，但其他人只有读权限。这意味着所有者和他所属的组（很可能是\
  \ sudo 用户）有权访问文件并更改内容，但网络或 PC 上的其他用户只能查看内容而不能编辑。脚本文件需要 `X` 才能执行，没有它就无法运行。\n\n大多数人只需要使用\
  \ `chmod` 命令来更改他们使用的文件的权限。我们使用命令和一组数字来设置文件的权限。数字决定实体拥有的权限，使用的数字计算如下：\n\n*   从数字\
  \ 0 开始。\n*   增加 4 表示可读性。\n*   增加 2 表示可写性。\n*   增加 1 表示可执行性。\n*   你剩下的数字决定了权限。\n\n\
  6 是读/写，但 1 仅可执行。5 是可读可执行的但不可更改。更保守的权限集将是 775。利用安全权限以实现安全计算。\n\n\n\n\n\n# 安全\n\n\
  Linux 内部的安全不仅限于权限。请确保你遵循良好的安全实践，并就安全方面遵循常识——即只安装需要的程序，不要盲目遵循网上的建议，不要频繁使用 `sudo`，使用密码，使用加密网络，保持软件更新，加密重要文件，并定期备份。最后的一点建议是，考虑使用带有\
  \ `SELinux` 的发行版，它是一个支持 AC（强制访问控制）和其他安全策略的模块。\n\n# 脚本编写\n\n`Bash` 是终端的“编程语言”。当我们输入命令时，我们是在\
  \ `bash` 中进行操作。脚本是一系列按顺序执行的 `bash` 命令列表，这意味着我们可以创建一个包含命令列表的脚本并运行它，以节省时间或自动化我们通常需要输入的终端任务。作为一名中高级\
  \ Linux 管理员，你可以使用脚本极地缩短重复性或持续运行任务的工作量。\n\n要启动脚本，请在 `nano` 中创建一个新文件 `script.sh`。第一行必须是\
  \ `#!/bin/bash` 以将其标记为 `bash` 脚本。为你的第一个脚本输入以下行：\n\n```\necho “What is your name?”\n\
  read name\necho “Hey, $name. Here is your current directory, followed by the files.”\n\
  pwd\nls\n```\n\n保存脚本。现在我们必须设置权限允许其运行。使用 `sudo chmod 777 script.sh`，然后使用 `./script.sh`\
  \ 运行。只要你完整复制了脚本，它就会询问你的名字，然后显示你的目录和文件。借鉴这个概念并在你自己的脚本中进一步扩展。你也可以运行已安装程序的命令，因此你可以编写一个自动加入域的脚本，或者编写一个连接到指定网络的脚本。关闭远程计算机也是一项很棒的自动化任务。\n\
  \n脚本可以手动运行也可以设置为在特定时间执行。若要在用户每次登录时运行某个脚本，请从 dash（启动栏）打开“启动应用程序”程序，并以脚本为源创建一个新应用。现在每当该用户登录时，脚本都会自动运行。这对于设置某些选项或启动后台服务而无需要求用户自己操作非常有用。\n\
  \n在特定安排任务可以通过 `Cron` 系统守护进程来完成。它在某些系统上默认安装，但如果没有安装，可以使用 `sudo apt-get install cron`。使用\
  \ `service cron start` 启动服务，并使用 `crontab -e` 创建一个新的 crontab 文件。选择 `nano` 作为你的文本编辑器。在创建的文件底部，添加包含我们调度任务的新行。格式如下：\n\
  \n`分钟, 时, 日, 月, 星期, 命令`\n\n我们通过这些选项进行格式化以指定运行命令的时间。时间数字从 0 开始，因此小时范围为 0 到 23，分钟为\
  \ 0 到 59。用星号 * 替换任何选项以指定它将在任何值运行时。请注意这些示例：\n\n```\n0 12 * * * ~/script.sh\n```\n\
  这将在每天中午运行位于主目录下的 `script.sh`。\n\n```\n30 18 25 12 * /usr/bin/scripts/test.sh\n```\n\
  这将在每年圣诞节的 6:30 运行 `/usr/bin/scripts` 目录下的 `test.sh`。\n\n总之，脚本编写和脚本自动化是接管定期发生任务极好的方式。继续编写脚本，或在网上查找示例，查看\
  \ `bash` 如何让你的计算体验变得更简单。\n\n# 高级终端概念\n\n精通 Linux 归结为对操作系统中可用工具的深入理解以及如何利用它们。本章讨论的许多主题将重点关注更多任务以及如何完成它们，或者对操作系统进行的一些通用质量（QOL）改进。\n\
  \n文件的压缩和解压缩经常让 Linux 初学者感到困惑。工具通常已经安装，但必须使用命令行。此外，奇怪的 `.tar` 和 `.gz` 文件类型是 Linux\
  \ 特有的格式，你可能会经常遇到。所有文件都可以用 `gzip` 工具解压缩或压缩。Ubuntu 预装了它，我们通过 `tar` 命令访问它。要压缩文件夹及其包含的文件，在终端中进入该目录并输入\
  \ `tar –czvf name.tar.gz foldername`。`C` 代表“create”（创建），`z` 表示“compress (gzip)”（`v`\
  \ 用于 verbose（详细），`f` 允许指定文件名。如果你需要更高的压缩率（但代价是时间），可以通过将 `-z` 开关替换为 `-j` 开关使用 `gzip2`\
  \ 来压缩文件夹。\n\n现在可以使用 `tar –xzvf name.tar.gz` 提取相同的归包。你会发现 `-c` 被替换成了 `-x`，这表示提取。再次，如果你正在处理\
  \ `bzip2` 文件，请使用 `-j` 开关。\n\n继续高级终端概念，让我们谈谈一些可以在终端中节省时间的质量技巧和技巧。在输入命令或文件名时，在途中按下\
  \ Tab 键。此功能——Tab 补全（tab completion），将猜测你正在尝试输入的内容并填充短语的剩余部分。对于文件，它将按目录所示的形式完成名称，或通过考虑你正在尝试的操作来完成命令。Linux\
  \ 专家和任何经常使用终端的人看起来像是在极快速地输入他们想要的内容，但他们实际上是在使用 Tab 补全。\n\n用户（特别是管理员）会在 `sudo` 命令上花费大量时间，因为指令需要特权权限。但当你输入一个长命令并忘记输入\
  \ `sudo` 时，你会为必须重新输入而烦恼。只需输入 `sudo !!`，它是“再次执行超级用户”的简写。这非常方便。另一种重复命令的方法是使用上下箭头。连续向上按可以循环之前的命令。你还可以使用左右箭头编辑命令中的文本。\n\
  \n而且最常用的终端提示涉及复制和粘贴。尝试向终端粘贴一个行时会产生奇怪的字符 `^v`。该快捷键没有配置在终端中工作，这就是为什么显示了该组合。要实际粘贴，右键点击并选择该选项；或使用键组合\
  \ `shift+insert`。复制方法相同，使用 `ctrl+insert`。虽然从互联网复制粘贴终端命令可能是安全的（只要你理解风险并知道它们做什么），但不要尝试从本文中粘贴。通过你正在阅读的媒介引入的格式可能包含了终端无法识别的特殊字符，因此最好不要复制粘贴，而是应该手动输入呈现的任何命令。\n\
  \n终端中的任何命令都可以通过 `ctrl+d` 键组合来中断或退出。使用它来停止长时间运行的进程或退出你不熟悉的程序/命令。\n\n\n\n\n别名（Aliasing）是在终端中创建个人专属快捷方式的方法。与其输入一条长命令或一系列短命令，不如使用别名将它们合并成单个用户自定义的选项。正如其名所暗示，别名是你指定的任何内容的备名称。每个别名都包含在一个隐藏的配置文件中——使用\
  \ `nano ~/.bashrc` 开始编辑它。因为它存在于用户的家目录中，因此每个别名都只对该用户有效。在文件的底部，我们可以按照下面的示例开始创建别名：\n\
  \n```bash\nalias gohome='cd ~ && ls'\n```\n\n此别名允许你通过输入 `gohome` 将目录更改到主目录并显示内容。在创建别名时，你必须严格遵循上述的格式，这意味着命令和等号之间没有空格。多个命令通过\
  \ `&&` 连接并串联在单引号内。为了获得更具健壮性的别名，请改用函数代之。下面的示例将 `cd` 和 `ls` 合并为一个单一命令。\n\n```bash\n\
  function cdls () {\n    cd \"$@\" && ls\n}\n```\n\n编写别名后，保存文件并重启电脑。之后你就可以使用新命令了。\n\
  \n我们编辑的那个文件 `.bashrc` 是 Ubuntu 终端的配置文件。除了制作别名，我们还可以使用它来自定义终端设置，例如颜色、大小等……一个小技巧是通过删除\
  \ `#` 来取消 `#force_color_prompt=yes` 的注释，并确保 `yes` 在等号后面。这为终端增加了颜色，使某些单词显示不同的颜色。打开终端时，右键点击它并选择“配置”（profiles）然后选择“配置选项”（profile\
  \ preferences），可以看到更多选项。通过这里的选项卡，你可以自定义字体、大小、颜色、背景颜色等许多。如果你打算频繁使用终端，建议对其进行自定义，因为这有助于你对将要使用的工具感到顺手。\n\
  \n## I/O 重定向\n\n在标准的终端命令执行期间，“正常输入”（由用户输入，或从文件/属性/硬件读取）会被命令输入并解析。有时命令还有“标准输出”，即显示在终端中的返回文本。在\
  \ `ls` 命令中，标准输入是当前工作目录，而标准输出是文件夹的内容。\n\n输入和输出通常是直接的，但通过使用 I/O 重定向，我们可以让终端完成更多事情。例如，`cat`\
  \ 命令（连接）后跟文件会将该文件输出到屏幕。单独运行 `cat` 会打开一个解析器，输入的任何行都会被立即输出（使用 `ctrl+d` 退出）。但通过 I/O\
  \ 重定向快捷键（`<`, `>`, `<<`, `>>`, `|`），我们可以将输出重定向到另一个源，例如文件。`cat > test.txt` 现在会将标准输出存入该新文件中。双等号表示追加，因此\
  \ `cat >> test.txt` 将输出置于文件末尾，而不是删除开头的内容。\n\n竖线字符，或“管道”（pipe）使用了另一种形式的 I/O 重定向，将一个命令的输出直接插入到另一个命令的输入中。`ls\
  \ | sort –r` 会获取 `ls` 的输出并将其反向排序列表。我们通过重定向输出并将其交给另一个命令来实现这一点。\n\n最后，`grep` 命令在 I/O\
  \ 重定向中被频繁使用。`grep` 可以在指定文件中搜索特定字符串并将结果返回到标准输出。通过重定向，此输出可以放入其他命令中。Linux 中值得注意的有趣特性是：一切皆文件，甚至是硬件。因此，我们的\
  \ CPU 实际上是一个在内部存储相关数据的文件，我们可以使用 `grep` 和其他工具对其进行搜索。那个例子相当高级，但这里有一个更简单的实例：\n\n```bash\n\
  grep Conclusion report.txt\n```\n\n它将在文件中搜索那个特定单词。由于所有新符号和命令，I/O 重定向可能会变成一个复杂的过程，但它是你可以整合到脚本和日常使用的功能，通常允许在单行内完成\
  \ Linux 的某些特性和功能。\n\nLinux 和终端是很难完全掌握的概念。但通过实践和持续的奉献，你将能够执行出色的计算任务，并完成在 Windows\
  \ 或 OSX 中无法完成的有用任务。学习更多命令以及如何使用它们无疑在这方面有所帮助，因此请坚持学习新命令及其用法。实际上，你唯一真正需要记忆的命令是 `man`，这个命令会显示指定的任何其他命令的手册页和文档。手册页显示了系统上每个命令的开关、示例和预期用途。利用这个工具，获取对你系统深入的知识。\n\
  \n## 更多 Linux 信息\n\n为了继续学习 Linux 及其能提供的可能性，请考虑本节中的示例。它将简要讨论 Linux 的更多用途以及一些尚未谈到的其他概念。\n\
  \n“Linux 文件系统”指的是计算机上文件和文件夹的主要布局。如果你在终端中继续执行 `cd ..`，或者在图形用户界面（GUI）上点击返回按钮直到无法移动，你就会遇到“根”（root）目录。这里的\
  \ `bin`、`boot`、`etc`、`usr` 等文件夹是你的硬件和设置配置的方式。每个文件夹都有特定的用途和功能，你可以通过探索其内容来理解它们。例如，用户数据存储在\
  \ `home` 中，但用户程序存储在 `usr` 中。由于文件系统多样且复杂，此处将不再进行讨论，但如果你想了解更多，请进行搜索或阅读与你的系统相关的文档。\n\
  \nLinux 系统通常用于桌面用途之外的其他目的。专用机器运行 Linux 变体是因为它们提供的强大和稳定性。甚至我们的汽车也运行着 Linux 内核，以跟踪错误代码并帮助机械师。\n\
  \n服务器通常安装 Linux 是因为其可靠性以及发行版具备的功能。例如，Linux 机器被用作防火墙是因为 `iptables` 应用程序提供了端口阻塞和智能过滤。你也可以通过该应用程序在系统上运行防火墙，从而免费获得企业级软件。通过这种方式，Linux\
  \ 对于网络也是极好的。只需安装相关应用程序，机器就可以充当交换机、路由器、DNS 服务器、DHCP 服务器等。\n\n最后，Linux 系统并不局限于我们所看到的界面。每个发行版都有其偏好的桌面环境，但界面可以根据个人的喜好进行极大的自定义。终端甚至有用于文件浏览器和\
  \ Web 浏览器，这对于那些使用 SSH 或远程计算的人非常有帮助。总而言之，你应该尝试安装不同的 DE（桌面环境）并根据你的喜好进行配置。\n\n## 接下来做什么以及结论\n\
  \n你如何继续取决于你想对你的 Linux 发行版做什么。对于普通的的浏览和简单使用，请继续使用 Ubuntu 并安装你需要的程序。对于更有冒险精神的人，考虑安装一个新的发行版来查看它们能提供什么。想要更深入学习\
  \ Linux 的人可以安装如 Arch 或 DSL 等系统，从零开始构建自己独特的操作系统。管理员和高级用户可以安装发行版的服务器版本来构建自己的 Linux\
  \ 网络，或者他们考虑将环境从其他操作系统切换到完全免费的系统。\n\n\n\n总之，`Linux` 是一套强大且相对易于使用的操作系统。但它们真正的潜力源于难以精通的终端和命令行功能。感谢阅读本文，我希望它能对这一事实上的替代性操作系统的神秘主题提供一些启发。如果\
  \ `Linux` 曾让你感到困惑，或者没有达到你的预期，我恳请你重新审视一下它能提供的功能。虽然它可能没有同等水准的游戏或第三方专有软件，但该操作系统足够简单且易于定制，可以作为主操作系统使用，或许可以将\
  \ `Windows` 或 `OSX` 作为备操作系统。几乎每个程序都有替代方案，因此，如果可能完全摆脱微软和苹果，强烈建议你这样做。再次感谢，并善加利用你新的\
  \ `Linux` 知识。\n\n## 相关标题\n\n[黑客大学：大一版——如何成为业余黑客的必备入门指南](https://www.amazon.com/Hacking-University-Essential-Beginner%E2%80%99s-Beginners-ebook/dp/B01J023VTU/keywords=hacking)\n\
