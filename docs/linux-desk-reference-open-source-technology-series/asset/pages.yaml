  md: '# kill [-s signal | -a] [-p] pid ...


    # kill -l [ signal ]


    Kill a process. More specifically, the kill command sends one of a variety of
    possible signals to the specified process. The default signal is TERM. The pid
    parameter is a process id, which may be obtained using the ps command. You need
    to be superuser to use this command on anyone other than yourself.


    **Example:** To kill process 1234 immediately without giving it a chance to finish
    what it is doing:


    # kill -9 1234


    One way to kill processes by process id number. To get the process id number,
    run ps aux and grep for the name of the command you''re targeting. Another is
    to kill by job number:


    # kill %1


    To kill someone else''s process, you must be superuser.


    # -s signal


    Use the specified signal, rather than the default.


    +   -p Print the pid of the named process, but do not signal it.

    -l Output a list of possible signals.


    # killall [-eiqvw] [-signal] command_name ...


    # killall -l


    # killall -V


    killall attempts to kill all processes executing the command specified by command_name.
    By default, this is accomplished by use of the SIGTERM signal. However, other
    signals may be specified either by name (see /usr/include/linux/signal.h) or by
    number.


    **Example:** To kill all processes (not just those by you) currently running the
    mail command:'
