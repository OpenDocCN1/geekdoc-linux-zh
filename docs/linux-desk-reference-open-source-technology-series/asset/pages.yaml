  md: '# CHAPTER 11


    # # FILESYSTEMS


    # ## Introduction


    A filesystem is Linux’s mechanism for organizing the various types of mass storage
    (hard disk, floppy disk, CD-ROM) and presenting them to the user. In order to
    better understand the applicable commands, a cursory description of the structure
    of a filesystem is presented below:


    | boot | super | inode list | data blocks and directory blocks |

    |---|---|---|---||

    | blocks | block | i1 | i2 | ... | iX |


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_172_0.png)


    **Figure 11-1** Filesystem Structure


    The boot block contains information necessary for Linux to access the filesystem.
    The superblock contains information about the structure of the filesystem itself
    (length, size and location of the inode tables, usage information, size of the
    cylinder groups).'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'The inode list is a collection of data structures which contain information
    about individual files within the system. Data blocks are fixed-length sections
    of disk space used for storing the actual information within the files.


    We speak of filesystems being either mounted or unmounted depending on whether
    or not the disk space they represent is currently available for use. At boot,
    the init process tries to mount filesystems specified in the /etc/fstab file.
    If you have root privileges, you can mount and unmount those (and any other filesystems)
    at will, provided they are not currently in use.


    Filesystems may be of different types, depending on the information they contain.
    For example, although the most common type is ext2, you might use a filesystem
    of msdos to access MS-DOS files.


    Important properties of filesystems include:


    +   **mount point** The point in the directory tree at which the filesystem is
    attached (e.g., /tmp, /home, /usr/local).


    +   **type** One of: minix, ext, ext2, xiafs, hpfs, msdos, umsdos, vfat, proc,
    nfs, os9660, smbfs, ncpfs, affs, uds, romfs, sys, xenix, coherent.


    +   **device name** The device file which corresponds to a given filesystem (e.g.,
    /dev/sda1, /dev/sda2 ...).


    The following commands are covered in this section:


    | debugfs | Inspect and possibly debug a filesystem. |

    | df | Display information about filesystems. |

    | dumpe2fs | Superblock and group information for an e2fs. |

    | e2fsck | Consistency check on an e2fs. |

    | fsck | Consistency check on a filesystem. |

    | fsck.minix | Consistency check on a minix filesystem. |

    | fuser | Process id''s of processes using the specified filesystems. |

    | lsattr | List attributes of files on filesystem. |'
  merge: -1
