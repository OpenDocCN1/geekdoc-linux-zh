  md: '# Commands


    -p Translate decoded carriage return/line feed sequences into what-ever the local
    newline convention is during decoding


    -o file Send output to the specified file rather than standard output.


    # rmail user...


    rmail interprets incoming mail received via uecp. It collapses From lines into
    a single line of the form "return-path!finder" and passes the processed mail to
    sendmail.


    # rwall host [file]


    rwall command sends a message to all users logged in to the specified host. By
    default, the message is taken from standard input, but if a file is specified,
    that will be used instead.


    Example: To send the message contained in the file go.away users currently logged
    in to the host local.net:


    ```

    rwall local.net go.away

    ```


    # sendmail [flags] [address...]


