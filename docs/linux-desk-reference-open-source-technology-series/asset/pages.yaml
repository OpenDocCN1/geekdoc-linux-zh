    # Yanking and Putting


    Yanking and putting are more or less the same as the copying and pasting operations
    found in GUI word processors. You first select some section of text (with one
    of the yank commands, below). The text is stored in a buffer either explicitly
    specified or implied. You then select a new position to place it and use one of
    the put commands to put it there.


    In the descriptions below, **buffer** is the text buffer specified by a single
    letter from a to z.


    | Yank Character | Action |

    | y | Copy current line to new buffer |

    | yy | Copy current line |

    | "<buffer><count>yy | Yank count lines to specified buffer |

    | "<buffer>d | Delete into specified buffer |

    | ye | Copy to end of word |


    | Put Character | Action |

    | "<buffer>p | Put contents of specified buffer |

    | P | Put most recently deleted line after cursor |

    | P | Put most recently deleted line before cursor |'
