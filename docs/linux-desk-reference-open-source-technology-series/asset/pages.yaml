    # Sections


    # Just Enough to Get By


    As the heading suggests, in this section I attempt to present a subset of the
    vi commands large enough to enable you to accomplish basic tasks, but small enough
    that a beginner can remember most of them. Note that the topics covered in this
    section are covered in more detail in other sections.


    # OPENING & CLOSING


    You open a file by typing “vi <filename>” on the command line:


    ```

    vi chapter29.txt

    ```


    You close a file by getting into command mode (use the <Esc> key)


    # INSERTING TEXT


    You insert new text by getting into edit mode. There are a lot of ways to get
    into edit mode. An incomplete list is presented below:


    | Key | Function |

    | i | Insert new text at cursor position |

    | A | Append new text to the end of the current line |


    # DELETING TEXT


    Delete text by getting into command mode (press <Esc> ) and using one of the following
    keys:


    | Key | Function |

    | x | Delete a character.'
