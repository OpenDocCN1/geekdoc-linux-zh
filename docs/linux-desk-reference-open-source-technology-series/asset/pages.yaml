  md: '# Introduction


    # IP Addresses


    An IP address is a sequence of 4 bytes used to uniquely identify a host on a network.
    The bytes are usually presented in dotted octet form. For example:


    # 127.0.0.1


    is the loopback address which is included in the /etc/hosts file to enable a machine
    to refer to itself.


    Recall that a byte is a set of eight binary digits (zeros or ones) called bits.
    Because each byte contains eight bits, the maximum value a single byte can take
    is 255:


    | Value of byte | 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255 |

    |---|---|---|---|---|---|---|---|---|---||

    | Decimal equivalent | (2⁷=128) (2⁶=64) (2⁵=32) (2⁴=16) (2³=8) (2²=4) (2¹=2) (2⁰=1)
    | | | | | | |

    | Bit value | | 1 | 1 | 1 | 1 | 1 | 1 | 1 |

    | Bit number | | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |


    | Value of byte | 0 + 0 + 0 + 0 + 0 + 0 + 0 + 1 = 1 |

    |---|---|---|---|---|---|---|---|---||

    | Decimal equivalent | (2⁷=128) (2⁶=64) (2⁵=32) (2⁴=16) (2³=8) (2²=4) (2¹=2) (2⁰=1)
    | | | | | | |

    | Bit value | | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | Bit number | | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |


    | Value of byte | 128 + 64 + 0 + 16 + 8 + 4 + 0 + 1 = 221 |

    |---|---|---|---|---|---|---|---|---||

    | Decimal equivalent | (2⁷=128) (2⁶=64) (2⁵=32) (2⁴=16) (2³=8) (2²=4) (2¹=2) (2⁰=1)
    | | | | | |\ |

    | Bit value | | 1 | 1 | 0 | 0 | 0 | 0 | 0 |

    | Bit number | | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |


    Figure 29-2 Byte Values


    # Address Classes


    IP addresses are divided into classes. Depending on the class, either the first
    byte, the first two bytes, or first three bytes of the IP address refer to the
    Network address of the node. The remaining bytes refer to the host'
