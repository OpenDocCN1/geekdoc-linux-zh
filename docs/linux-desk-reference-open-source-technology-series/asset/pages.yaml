    The cpio command works on archives. An archive file may be on the hard drive,
    floppy disk, or tape. Generally it accepts a list of files to be processed from
    standard input (unless otherwise specified), processes them, and sends the resultant
    archive to standard output or some device. There are three modes of operation:


    **Copy-out mode**copy the list of input files into an archive. Typically, the
    list of input files are generated via the find command. Once generated, the archive
    goes to standard output.


    **Copy-in mode**copy files out of an archive or list the archive contents. The
    archive is read from standard input. If shell pattern matching characters are
    included in the command line, only those files which match the specified pattern
    will be disentered; otherwise, all files are extracted.


    **Copy-pass mode**copy files from one directory tree to another. The list of files
    to be copied is read from standard input and the target directory is passed as
    an argument.


    Example: To archive the current directory, list all the files in it, pipe to cpio,
    and redirect the output to the file directory.cpio:


    ```

    ls | cpio -ov > directory.cpio

    ```


    Example: To extract (-i option) the archive created in the previous example, redirect
    the contents of the archive to the program:


    ```

    cpio -iv < directory.cpio

    ```


    +   - **0, --null** Specify that the input list will be terminated by a null character
    rather than a newline.\

    - **a, --reset-access-time** Reset the access times of files after reading them
    so it looks like they haven''t been read.

    - **A, --append** In copy-out mode, append to an existing archive.'
