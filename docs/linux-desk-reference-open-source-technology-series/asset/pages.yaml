  md: '# CHAPTER 29


    # TCP/IP


    # Introduction


    TCP/IP stands for Transmission Control Protocol/Internet Protocol and refers to
    a collection of data transmission protocols used for transmitting messages among
    a distributed network of computers.


    The examples in this section will be based on the following network (see Figure
    29-1):


    | Odin | Fenris | Loki | Thor |

    |---|---|---|--|

    | red Hat 5.2 | Caldera 1.3 | Win ''95 | Win ''98 |

    | 192.168.100.1 | 192.168.100.80 | 192.168.100.10 | 192.168.100.20 |


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_442_0.png)


    Figure 29-1 Sample Network


    # OSI Reference Model


    Most discussions of TCP/IP open with a few words about the OSI (Open Systems Interconnect)
    reference model. The OSI model was created in 1978 to specify a standard used
    for the development of network systems. Real world protocol designers have been'
  merge: -1
