  md: '# Command History


    As I mentioned in the introduction, **bash** stores commands in a history file
    (**$HISTFILE**) as you type them. Those commands are, of course, accessible at
    a later time. The following key combinations allow you to do various stuff with
    your command history:


    +   - <Enter> Accept the line regardless of where the cursor is.

    - <Ctrl> >P Move "up" through the history list.

    - <Ctrl>-n Move "down" through the history list.

    - <Meta>-< Move to the first line in the history.

    - <Meta>-> Move to the end of the input history.

    - <Ctrl>-r Search backward starting at the current line and moving "up" through
    the history as necessary.

    - <Ctrl>-s Search forward starting at the current line and moving "down" through
    the history as necessary.

    - <Meta>-p Search backward starting at the current line and moving "up" through
    the history as necessary using a non-incremental search for a string supplied
    by the user.

    - <Meta>-n Search forward starting at the current line and moving "down" through
    the history as necessary using a non-incremental search for a string supplied
    by the user.

    - <Meta>-<Ctrl>-y Yank nth argument of previous command.

    - <Meta>., M_- Insert last argument to the previous command.


    Alternatively, and (to my mind, at least) somewhat less conveniently, you have
    the ! (pronounced "bang!\—honest) method of accessing your history:


    +   ! Start a history substitution, except when followed by a space, tab, the
    end of the line, or = (


    +   !! Refer to the previous command. This is a synonym for ''!-1.'
