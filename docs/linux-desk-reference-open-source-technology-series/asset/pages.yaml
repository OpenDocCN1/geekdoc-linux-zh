  md: '# FOREWORD


    Books are very important to me, particularly books about Linux. Not just because
    we de sell books on LinuxMall.com, either. Rather the reason is that books about
    Linux help people learn more about Linux, empowering and helping the Linux OS
    grow in the process.


    As acceptance of the Linux OS grows, more and more people are liberated by the
    ability to have a powerful computing infrastructure that they can control, rather
    than just be controlled by megalithic software companies that think they know
    what is good for everyone. Freedom has always required responsibility, with self
    education being part of that responsibility.


    Not long ago, in 1994 we wrote an essay titled "Why Linux is Significant.\ Basically,
    I outlined the reasons that I thought Linux was going to thrive and take a significant
    place in the world of computing. I gave Linux about five years to become a common
    standard, and sure enough Linux has done, and is continuing to do just that.


    It''s gratifying to see my predictions becoming reality. This book, and every
    book about Linux, is a testament to the popularity of Linux. That''s what LinuxMall.com
    is all about, and I''m happy to see so many other companies getting behind Linux.


    Just a few years ago, books on Linux were few and far between. Becoming Linux-literate
    is increasingly important, and Scott''s book will provide newbies, UNIX groups
    and everyone in-between with a valuable reference for their journey with Linux.
    The Linux Desk Reference is a well-organized and complete Linux companion that
    will assist you in learning and using all the power Linux has to offer. I hope
    this book, and Linux serve you well!


    Mark Bolzen


    CEO LinuxMall.com


    PS: For those who care, "Why Linux is Significant" can be found at: http://www.LinuxMall.com/announce/lsig'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# "State of the State"


    The Linux kernel is eight years old as I write this. In September of 1991, a 21-year-old
    student at the University of Helsinki uploaded version 0.01 of the Linux kernel.
    Linus Torvalds could not have predicted that the code he had written would be
    the core of an industry less than a decade later.


    What we know as the Linux operating system now, however, is much more than Linux''
    kernel. The kernel only handles the core functions of an operating system; it
    does not provide a user interface or tools for everyday use. Happily, the Free
    Software Foundation''s GNU project had already developed most of the tools for
    a UNIX-style system. Most of the work toward a free OS had already been done;
    what was lacking was that Linux provided.


    Slowly at first, and with a little more momentum each month, people began downloading
    and using Linux. Because the code was available as well, they began refining it
    and adding to it, and returning the changes to Linux to be incorporated into new
    versions of the kernel. Thanks to the General Public License, anyone could look
    at and improve the code, and many of them did.


    To make Linux more accessible, people started putting together “distributions,”
    that is, creating installation programs and generally simplifying the process
    of using Linux. If you think installing Linux off of a CD-ROM is hard, imagine
    having to gather the source code for all the parts of the OS, compiling them and
    putting them in the right place, writing all the configuration files by doing
    everything manually.


    To make Linux more readily available, a few companies started selling distributions.
    At the time, many people thought that this was a little crazy, because everyone
    knew that you couldn''t make money free software. When it turned out you could
    make a successful business case for Linux, big companies started to get interested
    in Linux. Taking a cure from Eric S. Raymond''s “The Cathedral and the Bizarre,”
    Netscape decided to go to the Open Source route as well.


    While the Mozilla project has not been as successful as hoped, Netscape''s foray
    into Open Source software brought a lot of attention to Open Source software—especially
    Linux. The more people and businesses heard about Linux, the more they liked.


    It''s only a little over a year since Netscape went Open Source, and Linux has
    grown tremendously. Companies are stumbling over one another to make announcements
    with “Open Source” or “Linux” in them. A day passes without a major company issuing
    a press release declaring their commitment to Linux. Almost every major software
    and hardware company has made some kind of commitment to Linux, with one notable
    exception.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# "State of the State"


    Wall Street apparently likes Linux as well. Red Hat''s IPO went through the roof.
    Starting at $14 a share in August, Red Hat''s stock has consistently been valued
    over $100 a share. Several other Linux companies are poised to go public soon
    as.


    Linux has long been regarded as a technical success, and now it has become a commercial
    success as well. Linux has come a long way from its humble beginnings. While it
    is not clear how far Linux will go, it is clear that Linux is here to stay. The
    growth of Linux, and the impact Linux has on the computer industry, is nothing
    short of amazing. That doesn''t mean Linux has “won”—there''s quite bit of ground
    to cover yet. I''m sure that the next eight years are going to be even more exciting
    for Linux than the last eight have been.


    The Chinese curse “you may live in exciting times” rings true as well. Now that
    there''s gold in their hills, everyone wants to get into the Linux act. Companies
    are consolidating at an alarming rate and existing players who built the Linux
    Community are in danger of losing their shirts to newcomers who desire a piece
    of the Linux pie. The house that Linux built doesn''t rest on code alone. We can
    only hope that the newcomers to the party don''t crash this house by treating
    it like any other industry.


    Microsoft is unlikely to take Linux lying down, either. Their recent “Linux Myths”
    page is evidence that the giant is beginning to awaken to the threat that Linux
    represents to Microsoft. Unlike companies that have threatened Microsoft''s hegemony,
    Linux represents more than a threat to a singular revenue stream for software
    monthly. Linux and Open Source are nothing less than a revolution against Microsoft''s
    business model. It would be interesting to see how the beast from Redwood takes
    on Linux. Old tactics of FUD (fear, uncertainty, doubt) are unlikely to work,
    and Microsoft can''t buy the competitor. The proverbial 800 pound gorilla may
    be going on a diet soon.


    The greatest threat to Linux—if there is one—from within, not without. The Community
    has shown the ability to take the technical hurdles in stride. The question is
    how we''ll handle it.


    However, I think the roots of Open Source are too strong to be rotten by creeping
    commercialism. Yes, Linux will be a money-maker for companies willing to invest
    in it. However, I see Linux changing the way in which computer companies make
    money in the long run. Service, support and source will all be required for successful
    software and hardware companies, in the not so distant future.


    Many companies and individuals have already seen the advantages that Open and
    Linux offer. If you''re new to Linux you''ll find that it offers a much richer
    computing environment than the proprietary offerings of Microsoft, Apple and others.
    Not only is Linux comparable to other server and'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'desktop OSes now, you can expect that at its present rate of development, Linux
    will surpass these systems in features and stability in short order.


    Whether you are a seasoned UNIX or Linux hacker, or if you''re new to Linux’ just
    want to see what all the fuss is about, Scott''s Linux Desk Reference-ence should
    serve well. This book can serve as a cornerstone to your Linux education if you
    are new to Linux, or as an essential reference if you are already familiar with
    Linux. Almost everything you need to know about Linux is between these covers.


    Enjoy!


    Joe “Zonker” Brockmeier

    Editor of the Linux Newsletter'
  merge: -1
  pgno: 15
