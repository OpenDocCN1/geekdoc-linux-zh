    see the others these days. Also included here are a few of the more specialized
    text display programs (e.g., tac, rev) that come in handy from time to time.


    The commands covered in this section are designed to display the contents of an
    ASCII file, in whole or in part, to the screen. They include:


    | | |

    |---|---n| cat | Send contents of a file to standard output. |

    | head | Display the top of a file to standard output. |

    | less | Display a file, with scrolling. |

    | look | Display lines which begin with a given string. |

    | rev | Display lines from last character to first. |

    | tac | Display lines in reverse order. |

    | tail | Display the bottom of a file to standard output. |'
