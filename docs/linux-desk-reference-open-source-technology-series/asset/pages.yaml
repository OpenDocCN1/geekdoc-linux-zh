  md: '# Commands


    The **at (at, atq, atm, batch)** is a utility for executing commands at a later
    time. More than one command may be scheduled for execution at a time. A set of
    scheduled commands is called a **queue**.


    **at**


    Execute commands at a specified time.


    **atq**


    List the current user''s queued jobs. (If superuser, list all jobs.)


    **atrm**


    Delete jobs from the queue.


    **batch**


    Run only the commands when the system load levels permit.


    # SPECIFYING A TIME:


    There are three ways to specify a time: Absolute, Relative, or Verbal.


    Absolute:


    MM/DD/YY or DD.MM.YY or MMDDYY (with or without HH:MM)


    Relative:


    <some absolute time> + <delay>


    where


    Delay is:


    <some number> [minuteshoursdays/weeks]


    Verbal:


    noon, midnight, teatime, AM, PM, tomorrow, +


    **Example:** To run the script "backup.sh" at midnight:


    ```

    at midnight -f backup.sh

    ```


    **Example:** To find out what job number the job submitted in the example above
    is:


    ```

    atq

    ```


    which would produce results like


    ```

    3 1999-07-25 00:00 a

    ```


    **Example:** To cancel execution of the script "backup.sh" as implemented in the
    examples above:'
