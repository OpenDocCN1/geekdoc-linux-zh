  md: '# Startup Time: If ~/.bashrc exists, then source it.


    # Non-interactive Shells


    Startup Time: If the environment variable ENV is non-null, expand the variable
    and source the file named by the value. If bash is not started in Posix mode,
    it looks for BASH_ENV before ENV.

    So, typically, your ~/.bash_profile contains the line


    ```

    if [ -f ~/.bashrc ]; then source ~/.bashrc; fi

    ```


    In non-interactive instances of bash, the $PS1 variable is unset.


    # Aliases


    Aliases are a shell mechanism which enable you to create shortened versions of
    common commands. You create an alias by typing the word "alias", the character
    sequence you want to be your new alias, an equal sign, and the value alias expands
    to.


    Example: These are two of my favorite aliases:


    ```

    alias l=''ls -a --color''

    alias ll=''ls -al --color''

    ```


    Create a file in your home directory .alias and source it in one of your startup
    scripts. The .alias file is just a plain ASCII text file containing a list of
    your favorite aliases, exactly as you would type them on the command line. To
    source the alias file you might include the following line in the ~/.bashrc file:


    ```

    ./.alias

    ```


    This will give you back all your favorite aliases at login time and provide a
    central location for storing and referencing your aliases


    ```

    alias [NAME=VALUE] ...

    ```


    Without arguments, print the current list of aliases. Otherwise, define an alias.
    When the NAME is typed, bash will expand the name into VALUE and run VALUE as
    the command.


    ```

    unalias [-a] [NAME] ...

    ```


    Remove the specified NAME from the list of aliases. If -a is supplied, all aliases
    are removed.'
