  md: '# CHAPTER

    25


    # FINDING STUFF


    # Introduction


    This section is an amalgamation of some very different programs which are united
    under the eponymous purpose of "finding stuff," but work in quite different ways.


    Generally speaking, find (the biggie), searches the directory tree for a file
    or files specified by the command line. This happens to present a golden opportunity
    for hard-core programming in that it is a real world example of a classic computer
    science problem. As such, the command has quite a few options and is perhaps more
    complex than necessary. For those of you simply wishing to learn the location
    of a particular file in a timely and painless manner, I recommend locate.


    # REGULAR EXPRESSIONS


    Most of the search mechanisms listed below use regular expressions in one form
    or another. A regular expression is a mathematical mechanism for specifying the
    ordering of symbols. Historically, regular expressions originated from discussions
    of the Theory of Computation, a seriously hard-core branch of mathematics which
    is far removed from the day-to-day rigors of say, locating the smutty email to
    your girlfriend you misplaced in some gargantuan file system at.


    However, the same principles govern both tasks. In order to get full value for
    your Linux dollar, you will need some understand-'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'regular expressions and how they are used to specify search patterns.


    Regular expressions exist to give you a mechanism to specify patterns of characters.
    The implementation of a regular expression includes three classes of characters:


    literals The literal character you typed in (a, b, c, ..., 1,2,3... etc.).


    wildcards Special characters used to represent one or more characters other than
    themselves. For example, the * character will match any number of any other characters
    ("d*" matches "date", "day", "dally" and anything else starting with the letter
    d). The .character will match one instance of any other character ("d.te" matches
    with "date" and "dote\).


    metacharacters Metacharacters are characters which have a special meaning. For
    example, the caret character "^" usually matches the beginning of a line. The
    "$ character matches the end of a line.


    In addition, it is possible to specify groups of characters. For example, the
    regular expression "[aAbB]" would match any string of any length which started
