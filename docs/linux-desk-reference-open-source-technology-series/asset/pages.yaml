    -S Specify the number of sectors-per-track.


    -P [rlislt] Display the partition table in raw, standard, or table formats.


    # du [OPTION]... [FILE]...


    No arguments, "du" reports the disk space used by the current directory. The output
    is in 1024-byte units by default, unless the environment variable "POSIXLY_CORRECT"
    is set, in which case 512-byte blocks are used (unless "k" is specified).


    Example: To display disk usage information for all files in the /filesystem, not
    just the directories (-a option):


    ```

    du -a /

    ```


    +   -a, --all Include all files in output, rather than just directories.


    +   -b, --bytes Output file size in bytes rather than kilobytes.


    +   -c, --total Display totals after processing.


    +   -D, --dereference-args Dereference symbolic links.


    +   -h, --human-readable Append a size letter to the end of each quantity displayed.
    (M=megabytes, K=kilobytes,...)


    +   -k, --kilobytes Display size in kilobytes.


    +   -l, --count-links Count the size of all files even if they have already been
    counted as a hard link.


    +   -L, --dereference Dereference symbolic links.


