  md: '# CHAPTER 19

    DOCUMENT FORMATTING


    # Introduction


    The commands and systems in this section are concerned with document formatting.
    For the most part, this means embedding control sequences in regular ASCII text
    files which are interpreted as printable symbols by some document formatting system
    (e.g., TeX, groff).


    # TeX


    The TeX document formatting system is the creation of Donald Knuth, one of the
    big names in computer science. Among other things, he is the author of the Art
    of Computer Programming series. Legend has it that the TeX system was created
    when Knuth realized he needed a typesetting system that could display the equations
    in the series. He took a quick eight years off to write TeX, then got right back
    to work. A popular extension to the TeX system is LaTeX, which provides extensions
    that enable you to structure the documents.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Document Formatting with Tex


    +   1. Create an ASCII document containing the embedded control codes with \<favorite
    text editor>.. By convention, these documents are stored with a .tex extension.


    +   2. Compile the document into a device independent intermediate file with tex
    (or latex). .dvi extension.


    +   3. View and print the resulting .dvi file with xdvi.


    +   4. Depending on your printer type, you can use one of the dvi printer commands
    (dvips, dvil) to print the dvi file.


    If you''re so inclined, you can type in the following example file to get a feel
    for how TeX works. If not, pretend you did, as the file is used repeatedly in
    the examples below (see Figure 19.1).


    ```

    \documentclass{12pt}

    \begin{document}

    ```


    # \section{A Short Introduction to \LaTeX}


    Note the use of the \begin{verbatim} \LaTeX\end{verbatim} control sequences in
    the section heading generated the LaTeX symbol. There are a wide variety of control
    sequences available, including most of the mathematical symbols and associated
    greek letters and the standard typographical symbols. \LaTeX reserves the following
    symbols: \$, \&, \#, \^, \_, \(, which must be preceded with a backslash in the
    course of normal typing.


    # \section{Document Classes}


    Documents have classes (e.g. letter, article, book) which must be defined with
    the \begin{verbatim}

    \documentclass{}

    \end{verbatim}


    specifier at the head of your document.


    # \section{Sample Equation}


    In this section we''ll see how to create a sample equation. In general you''re
    going to be using function specifiers


    ```

    \begin{verbatim}

    \sqrt{}

    ```'
