  md: '# CHAPTER

    20


    # THE VI EDITOR


    # Introduction


    The vi program is the default text editor on most Unix systems. If you''re new
    to vi, you may be under the impression that the phrase “text editor” is semantically
    equivalent to “word processor.” If so, allow me to gently disillusion you. The
    vi editor is designed to manipulate ASCII files, such as program source code,
    shell scripts, and other plain text files.¹


    When you''re just getting started, vi will irritate you. Badly. Prepare for this
    fact. I once saw a guy with a 140 IQ—normally a very civilized sort—bang on his
    keyboard like a mountain gorilla because he slipped up and deleted two days worth
    of work.


    > TIP


    # Modes of Operation


    Vi doesn''t use the function keys, which will probably confuse those of you coming
    in from the commercial word processing world. Virtually all of the vi features
    are accessed via some combination of the normal alphanumeric keys. Vi uses modes
    between the times a key will just put a letter on the keyboard and the times a
    key will invoke some other vi function.


    +   1. If you want something with a million fonts, font sizes, embedded images,
    etc., allow me to refer you to the good people at Core, who have—God bless them—ported
    over an absolutely sammich version of WordPerfect for use right on your own Linux
    system. Mine cost about $60.00. I paid up fully and with sincere gratitude in
    my heart.'
  merge: -1
  pgno: 308
