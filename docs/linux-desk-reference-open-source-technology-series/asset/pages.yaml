    # Subnet Masks


    A subnet mask is another dotted octet sequence used to specify which bits in the
    IP address will refer to the network address and which will refer to the host
    address. In the simplest case, the bits used in the subnet mask are determined
    by the address class:


    | Address Class | Default Subnet Mask |

    |---|---|

    | A | 255.0.0.0 |

    | B | 255.255.0.0 |

    | C | 255.255.255.0 |


    Note that the above subnet mask is only the default—masking doesn''t have to be
    done at the byte boundaries. However, a full description of subnetting is beyond
    the scope of this book. If you''re connecting to a network that uses some funky
    subnet mask, talk to your network administrator. Otherwise, just accept the default
    for now.


