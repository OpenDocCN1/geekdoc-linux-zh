    | :!command | Run the specified command |

    | :!! | Repeat last command |

    | :start,stop! command | Send the specified range of lines to command. Replace
    the lines with output of command |

    | :count! command | Send count lines to command and replace with output |

    | :<Ctrl>-Z | Suspend edit session |

    | :r file | Read in contents of specified file |

    | :r !command | Read in output of command |

    | :sh | Invoke a subshell |

    | :so file | Source (execute) commands in file |'
