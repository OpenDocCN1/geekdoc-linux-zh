  md: '# INTRODUCTION


    I hope you get a lot of use out of this book. Since I first got started in Unix
    in 1986, I''ve spent a ton of cash buying reference books. I''ve always been a
    bibliophile, and computer books have the advantage of being tax deductible, so
    I''ve amassed quite a collection. It always annoys me when I get home and the
    glitzy, well-packaged 400 page document-o-rama I just shelled out $50 turns out
    to contain only 5 pages of actual information or, worse, be full of information
    but so poorly organized that it''s more trouble than it''s worth to find what
    I need. I''ve got a shelf full of them, which I will sell.


    What I''ve tried to do here is incorporate the best features from my collection.
    I know what I like—a good index, thorough technical coverage, relevant examples,
    and concise explanations (in English). Also, in the process of writing this book
    I become almost supernaturally attuned to the subject of computer reference books—you
    can whisper "Linux in a Nutshell" from thirty feet away across a crowded room
    and my ears will perk up like a retriever on point. The number one complaint I
    hear about reference books is "not enough examples." I''m not unsympathetic thinking
    up, configuring, and testing all the examples for this book slowed the writing
    process down to a crawl. But, as my editor pointed out, I''m not doing this for
    my health. So you will find that for every command in this book there is an accompanying
    example.


    To some extent, Linux commands tend to come in clusters. For example, there are
    a dozen or so that handle filesystems,'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'another half dozen for fiddling with disks, a whole slew that do things with
    files. Sometimes the command clusters follow a naming convention, in the case
    of the “remote” commands (rlogin, rsh, ...); other times they do not. It occurred
    to me it wouldn''t be entirely wrong to group the Linux commands into clusters
    (one for users, another for disks, etc.) and then treat the clusters as data structures.
    Technically, a data structure consists of two things:


    +   - a specification for how data will be stored

    - a specification of methods by which the data will be accessed


    That’s not a perfect description of how the chapters are arranged, but it isn’t
    bad either. At the beginning of each chapter there is a high-level discussion
    of what purpose each “data structure” serves, how that service is accomplished,
    and the jargon that has sprung up around it. That provides background for the
    detailed description of commands which follows. Hopefully, this will provide enough
    information for newcomers to get started and perhaps of some value for experienced
    users as well.


    Of course, as you can tell from a quick glance through the contents, the main
    thrust of this book is information on actual user commands. I have collected what
    I believe to be a fairly thorough subset of the most useful Linux commands, together
    with their options and some suggestions for use. Information on configuration
    and use of the various subsystems (e.g. NIS, Samba, Networking) is also included,
    either explicitly or as part of the examples.


    # How to Use This Book


    # When You Know Exactly What You Need


    For the advanced users who know exactly what command they are after and are looking
    only for examples or command line options, the book has two command indexes:


    +   - all commands are indexed in the back of the book, as term definitions, procedures,
    and the rest of the content.

    - there is a second index in the front for executable programs only.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Conventions of This Book


    # When You Know What You Need But Not What''s Called


    Did you ever yourself digging around looking for a command that you know must
    exist, only you don''t have any idea what it might be called? Back when I was
    in school I clearly remember fumbling around for an hour trying to figure out
    what I''d use to lower the priority of a running process. There was nothing in
    the man pages under "priority" or "process", but I knew it had to be out there
    somewhere.


    This book is arranged by concept. If you want to find out how to do something
    with filesystems, flip to the chapter on filesystems. In each chapter, there''s
    a brief discussion of relevant terms and concepts, followed by a one-line summary
    of all the relevant commands, a list of related files, and finally a complete
    listing of the commands with options and examples.


    # When You''re Just Getting Started


    This book explains all of the basic concepts you need to understand in order to
    use your Linux system. If you''re not familiar with particular terms, they are
    defined in the text and indexed in the back. There''s also a glossary. For every
    command, there is at least one example. For the more popular or confusing commands,
    there are frequently two or more. Where I thought it would be helpful, I included
    diagrams and sample output.


    # Conventions of This Book


    # Introductions


    There''s a certain amount of overhead involved in learning the Linux system. Some
    of the concepts can be counterintuitive at first glance, particularly if you''re
    still in the process of switching over from one of the lesser operating systems.
    Each chapter in this book starts off with a few pages of notes about the concepts,
    terms, and theory underlying the commands. Hopefully, this will help you get a
    feel for how the commands make up subsystems and how the subsystems make up Linux.


    # Related Files


    Most Unix commands take configuration or startup information from one or more
    files. The entries in this section are a listing of the files associated with
    the commands in each chapter.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Commands


    Each chapter contains a detailed listing of commands, together with options and
    examples. The typographical conversions used in the command section are explained
    below:


    **Commands** are in large bold italic print.


    **Options** are listed line by line in bold italics.


    **Tips** are set off with the following icon:


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_21_0.png)


    **File names** and **paths** are listed in bold italics.


    Examples are centered and in bold print:


    example


    Commands which must be run as the superuser are indicated with the following icon:


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_21_1.png)


    Occasionally I will put comments within an example command. In that case, the
    command will appear as usual, but the comment will be off to the side, not in
    bold type, and indicated with the pound sign (#).


    ```

    command# comment

    ```


    Sample output of system commands is listed in plain text:


    This is typed exactly as it appeared on screen.


    # A Final Word


    Any single book that purports to cover the entire Linux operating system is probably
    lying. There''s so much going on that what you can fit between two covers is,
    of necessity, a reflection of the experiences and prejudices of its author. To
    the extent that I neglected <your favorite consolation/suite/utility> I really
    do apologize. If it''s any consolation, it wasn''t from lack of effort. If you
    have comments, corrections, or suggestions for improvement, free to contact me
    at:


    ```

    s_hawkins@mindspring.com

    ```


    As a post script, some may be wondering about the significance of the Minotaur
    on the cover of this book. Tradition has it that Daedalus, mythological inventor
    and the spiritual ancestor of hackers everywhere, built a large and complex maze
    in Crete (the Labyrinth, capital L) at the behest of king Minos. The Minotaur
    was a bastard child of the Queen Pasiphae (Minos'' wife) and so unusually attractive
    livestock. A man''s body and the head of a bull (understandably) made him a mit'
  merge: -1
  pgno: 21
- img_proc: true
  md: shy and grumpy. Territorial and ferocious, he lived in the center of the Labyrinth,
    which he ran with an iron fist. He guarded its secrets jealously, and was famous
    throughout the kingdom for biting the heads off ignorant new-bies. When I was
    asked to suggest a creature for the cover of this guide to deciphering the intricacies
    of the Linux OS, there was really only one choice.
  merge: -1
