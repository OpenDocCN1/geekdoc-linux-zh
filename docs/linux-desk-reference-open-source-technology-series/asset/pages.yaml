  md: '230


    Displaying Files


    {


    If a left curly bracket appears in the top line displayed on the screen, the {
    command will trace through the file to the matching right curly bracket.


    }


    If a right curly bracket appears in the bottom line displayed on the screen, the
    } command will trace through the file to the matching left curly bracket.


    (


    Like {, but applies to parentheses rather than curly brackets.


    )


    Like }, but applies to parentheses rather than curly brackets.


    [


    Like {, but applies to square brackets rather than curly brackets.


    ]


    Like }, but applies to square brackets rather than curly brackets.


    ESC^F


    Followed by two characters, acts like {, but uses the two characters as open and
    close brackets.


    ESC^B


    Followed by two characters, acts like }, but uses the two characters as open and
    close brackets.


    m


    Followed by any lowercase letter, marks the current position with that letter.


    '', X^X


    Followed by any lowercase letter, returns to the position which was previously
    marked with that letter.


    /pattern, ESC-/pattern


    Search forward in the file for the N-th line containing the pattern.


    ^N or !


    Search for lines which do NOT match the pattern.


    ^E or *


    If the specified pattern is not found in the current file, continue looking in
    the next file listed.


    ^F or @


    Begin searching for pattern in the first line of the first file listed (regardless
    of which file is currently displayed).'
