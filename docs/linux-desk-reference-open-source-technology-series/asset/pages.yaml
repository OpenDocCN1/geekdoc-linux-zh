  md: '# Introduction


    # 477


    NFS filesystem mounted across the network appears to the local user almost exactly
    like a local filesystem mounted from the local hard disk. (See the chapter on
    filesystems for more information on what it means to "mount" a filesystem.) Again,
    this is useful in real-world network situations where it would be impractical
    to maintain multiple copies of files accessed by users across a network.


    Running NFS will open up some security holes on your network. Before setting up
    NFS, take a little time and read up on the security risks associated with network
    filesystems. You can''t plug all the holes, but you can minimize your risks if
    you have a better idea of what you''re getting yourself into.


    # Setting Up NFS


    +   1. Invoke the mount and nfsd daemons (later you will want to configure your
    system so this happens automatically at boot time).

    2. Edit the /etc/exports file on the exporting computer to include the directories
    you want exported and the domains/users you want them exported.

    3. Edit the /etc/fstab file on the mounting computer to include the network filesystem.

    4. Mount the filesystem as usual with the mount command.


