    used when the original superblock has been corrupted.


    +   -B blocksize Force e2fsck to search for the superblock at the specified blocksize.


    +   -c Find and mark any bad blocks on the filesystem.


    +   -C fd Write completion information to the specified file descriptor so that
    the progress of the filesystem check can be monitored.


    +   -d Print debugging output.


    +   -f Force checking of the filesystem.


    +   -F Flush the buffer caches before beginning check.


    +   -I filename Add the blocks listed in the file specified by filename to the
    list of bad blocks.


