    which are designed to be easy on the eyes (e.g., movies, celebrities, neat graphical
    hacks...). A vast assortment of cool themes are freely available from:


    www.themes.org


    Please note that most of the commands in this section are GUI and interactive,
    so the examples provided may not be very informative. Fortately, the programs,
    once invoked, are more or less self-explanatory.


    The way to shut down an X session gracefully is with the key combination: <Ctrl><Alt><Backspace>


    To copy text from one Window to another:


