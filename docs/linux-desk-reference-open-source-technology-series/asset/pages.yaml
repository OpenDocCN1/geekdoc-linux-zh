- img_proc: true
  md: '# CHAPTER 13


    # DAEMONS


    # Introduction


    Daemons are the invisible workhorses of the Linux world. A daemon is a program
    run in the background (that is, not attached to any particular terminal) that
    performs some system task. Typically, system task is to service a request by some
    user program for a piece of information (e.g., rwhod), access to some system resource
    (e.g., lpd), or to facilitate communication between two systems or two parts of
    the same system (e.g., telneted, talkd).


    The word "daemon" should be pronounced the same as "demon" but lots of people
    say "day-mon" or "die-mon" and no one laughs. In general, I try to stick with
    whichever pronunciation my boss prefers. The word originates somewhere in Greek
    mythology and refers to a supernatural agent somewhere above human but below a
    god in the order of things. Classical daemons are distinct from demons in that
    they are capable of both good and evil, which also fits in pretty well my experience
    of the Linux variety.


    By convention, the individual "d" at the end of each daemon name is pronounced,
    and people will look at you funny if you mess this up. For example, the program
    "named" is pronounced "name-dee".


    If you are working with your system at the user level, you may go for months without
    having to mess with daemons. If you are managing a medium-sized or large network,
    you may do nothing else. Either way, the actual mechanics of configuring daemons
    are beyond the scope of this book.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 184


    # Daemons


    Lots of times, configuration files are found in the /etc directory. If you''re
    hunting a particular configuration file, you might try this:


    ```

    ls -l /etc/*.conf | grep <yourcommand>

    ```


    These days, most commercial Linux distributions configure the big daemons for
    you as part of the installation process. This is both good, in that configuring
    daemons can be an enormous pain in the butt, and bad, in that you don''t have
    a feel for Linux daemonology you''ll never have a complete understanding of your
    system works.


    Daemons are usually started without human intervention. This usually happens in
    three ways:


    +   - invoked by an rc script at boot time

    - invoked by init at boot time

    - invoked by the inetd daemon as needed, sometimes via tcpd


    The examples in this chapter will reflect that fact. In the case where the daemon
    might profitably be invoked by inetd, I''ll give you a line to put in the inetd.conf
    file. Note that inetd relies on the /etcservices file for information about what
    ports to monitor for service requests.


    Obviously, the daemon programs may not be in the same place as your system as
    they are on. Before modifying your inetd.conf, do a sanity check on program location.


    An Internet port is a logical network connection associated with a particular
    service. Note that these are distinct from the actual physical ports into which
    you might plug a serial line. An Internet port is born when the network programmers
    of the world get together and decide that thus-and-such port number will be associated
    with thus-and-service from now on. There''s nothing special about the port numbers,
    just that everyone agrees on what they are and what they stand for. The /etc/services
    file contains the port/service associations for your machine.


    The ultimate aim of daemon configuration is to get to a state where they start
    up and shut down as needed without human intervention whatsoever. To this end,
    inetd program (itself a daemon) has been created. Inetd monitors certain ports
    for Internet service requests and invokes daemons associated with those ports
    as needed. To put a daemon under the control of inetd, you must add a line in
    the following format for the /etc/inetd.conf file:


    ```

    service socket_type protocol wait user program arguments

    ```'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Introduction


    # 185


    where


    +   - **service** is a network service defined in `/etc/services`.

    - **socket_type** is one of (stream | dgram | raw | rdm | seqpacket).

    - **protocol** is a valid protocol (e.g., tcp, udp) as specified in `/etc/protocols`.

    - **wait** is either wait or nowait.

    - **user** is the name of the user as whom the service is run.

    - **program** the program to be executed when inetd receives a request on the
    associated socket.

    - **arguments** are the arguments associated with the program to be run.


    The daemons described in this chapter are:


    | | |

    |--- |--- |

    | fingerd | Services finger requests. |

    | erd | Services finger requests. |

    | ftpd | Services ftp requests. |

    | gated | Handles network routing. |

    | gde | Program to control gated. |

    | identd | TCP/IP identification protocol. |

    | imapd | Remote mail access. |

    | inetd | Invokes other daemons, as necessary. |

    | klogd | Kernel log daemon. |

    | lpd | Services line printer requests. |

    | mountd | NFS mount daemon. |

    | named | Internet domain name service. |

    | pppd | Handles point-to-point protocol communication. |

    | reexecd | Remote command execution. |'
