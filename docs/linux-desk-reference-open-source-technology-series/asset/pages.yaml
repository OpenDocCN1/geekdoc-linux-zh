  md: '# CHAPTER

    17

    COMPARING & MERGING FILES


    # # Introduction


    The commands in this section operate on the contents of files, usually text files.
    In most cases they are capable of including or excluding patterns, as specified
    by regular expressions. See the chapter on "Finding Stuff" for more information
    about regular expressions.

    The dash character, "-", is usually used to specify standard input one of the
    input files.


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_266_0.png)


    +   - comm Compare 2 sorted files; outputs common lines.

    - cmp Compare 2 files, usually binaries.

    - diff Show the difference between 2 files.

    - diff3 Show the differences between 3 files.

    - sdiff Merge 2 files


    # # Commands


    ```

    comm [OPTION]... FILE1 FILE2

    ```


    Compares two files and prints the results in three-column output: unique to file1
    unique to file2 common lines.'
