  md: '# Related Files


    | ~/.bashrc | Executed when starting a bash subshell |


    | ~/.bash_profile | Executed at login time. |


    | /etc/profile | Systemwide profile. |


    | ~/.bash_login | Synonym for bash_profile. |


    | ~/.bash_logout | Executed when a bash shell exits. |


    # Commands


    # Invoking bash


    Typically, the shells are invoked when you log in. The last thing the login program
    does is look in your /etc/passwd file to see what shell your system administrator
    has specified for you to use. If it isn''t bash, you can either edit the /etc/passwd
    file or invoke bash from another shell by typing /bin/bash at the command line.
    The following options apply:


    +   - norc Don''t read the “/.bashrc” initialization file in an interactive shell.


    +   - rcfile FILENAME Execute commands from the specified file rather than ~/.bashrc
    in an interactive shell.


    +   - noprofile Don''t load the system-wide startup file /etc/profile or any of
    your personal initialization files (~/.bash_login, ~/.profile).


    +   - version Display version information.


    +   - login Make this shell act as if it were directly invoked from login.


    +   - nobraceexpansion Do not perform brace expansion.'
