  md: '# CHAPTER 23


    # X WINDOW SYSTEM


    # Introduction


    The X Window system is Linux''s Graphical User Interface (GUI).


    These days may most of the commercial Linux distributions will do a good bit of
    the work of configuring the X system for you. However, in order for things to
    run smoothly, you will need the follow-ing information:


    +   * Horizontal Synchronization Rate of your monitor

    * Vertical Refresh Rate of your monitor

    * Chipset and Memory size of your video card


    The SuperProbe program may or may be able to automatically detect some of this
    information for you. There was a time when you could count on that information
    being included in the documentation that came with your machine. These days you''re
    probably going to have to go to your manufacturer''s Web site. Encouragingly,
    however, I have noted that many manufacturers are starting to provide Linux-specific
    documentation.


    Having installed X successfully, you may wish to ran xxdtune to tweak your video
    settings.


    X purists will probably want to configure xdm. The Display Manager. This program
    can be used in place of the init-getty-login triptych familiar to the text-based
    Linux world to control access to your machine.'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'The X Window system allows you to specify a window manager (e.g., fwwm, WindowMaker)
    which will be your gateway to the system.


