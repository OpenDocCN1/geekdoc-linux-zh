    e2fsck is used to check a Linux second extended filesystem for internal consistency.
    If errors are found, it can sometimes make repairs. If the system thinks the filesystem
    was unmounted cleanly, it will not perform a thorough check.


    Example: To force a check of the /dev/hda2 filesystem:


