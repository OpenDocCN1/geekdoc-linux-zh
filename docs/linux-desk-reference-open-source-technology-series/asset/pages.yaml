  md: '# Word Designation Operators


    These operators allow you to specify one or more words within a command line.


    +   - Separate the event specification from the word designator.

    - 0 (zero) The "0"th word. Usually, the 0th word is the command word.

    - n The Nth word.

    - ^ The first argument; that is, word 1.

    - $ The last argument.

    - % The word matched by the most recent "?string?" search.

    - x-y A range of words; "-Y"ing "0-Y".

    - . All words except the 0th.

    - x* Abbreviates "x-$".

    - x- Abbreviates "x-$\$ like "x*", but omits the last word.


    # Modifiers


    After the optional word designator, you can add a sequence of one or more of the
    following modifiers, each preceded by a colon (:).


    +   - h Remove a trailing pathname component, leaving only the head.

    - r Remove a trailing suffix of the form SUFFIX, leaving the basename.

    - e Remove all but the trailing suffix.

    - t Remove all leading pathname components, leaving the tail.

    - p Print the new command, but do not execute it.

    - q Quote the substituted words, escaping further substitutions.

    - x Quote the substituted words as with q.

    - s/old/new/ Substitute NEW for the first occurrence of OLD in the event line.'
