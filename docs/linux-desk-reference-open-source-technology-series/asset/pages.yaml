  md: '# killall mail


    +   - **e** Requires long filenames (> 15 char) to be matched exactly.

    - **i** Prompt the user for confirmation before killing.

    - **l** List possible signals.

    - **q** Run quietly. Suppress error messages.

    - **v** Run verbosely. Display a message for each successful termination.

    - **V** Output version information.

    - **w** Wait for signaled processes to die.


    # nice [OPTION]... [COMMAND [ARG]...]


    Start a command with the specified priority rather than the default. By default,
    commands are run with a priority of zero. To give your command a lower priority
    (and thereby make it slower), you may specify a value between 1 and 19. To make
    it run faster, you may specify a value between -1 and -20. You must be the superuser
    to specify a negative value.


    **Example:** To start up `big_program` but force it to yield some of its processor
    time to other programs


    ```

    nice 19 big_program

    ```


    **Example:** To start up `big_program`, but enable it to snatch some processor
    time from other, less deserving programs:


    ```

    nice -20 big_program

    ```


    Use **renice** to modify the priority of a command which is already running. To
    start a process with a higher priority (e.g., a lower priority number) you must
    be superuser.


    # -n ADJUSTMENT


    **-ADJUSTMENT** --adjustment=ADJUSTMENT Use the specified ADJUSTMENT instead of
    the default.'
