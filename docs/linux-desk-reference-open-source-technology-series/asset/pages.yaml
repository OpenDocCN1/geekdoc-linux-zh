  md: '# THE BASH SHELL


    # Introduction


    "Shell" is the name given to the program which handles user commands and starts
    other programs. The term "shell" is another one of those weak UNIX jokes; the
    "shell" is the program between you and the "kernel". After you log in, the shell
    prompt is the first thing you see. There are a lot of different shells available
    for Linux (e.g., Korn, Bourne, tsh); which particular one you use at login time
    is determined by your entry in the /etc/passwd file (it''s the rightmost field
    on the line). One''s choice of shell isn''t quite the fountain of jihad that one''s
    choice of operating system is, but it is a semi-touchy issue.


    Bash stands for Bourne Again Shell, a reference to the fact that bash is based
    on another shell (the Bourne shell, obviously). Bash contains features found in
    Bourne shell, csh (the C shell), Korn Shell, and some that are in bash only. All
    of the Bourne shell built-in commands are available in bash.


    # Quick Overview of Shell Operation


    When you log in or otherwise invoke the shell, it checks system variables and
    the /etc/passwd file to determine who you are and where your login session is
    supposed to begin. It then searches the system for default configuration files
    and looks for configuration files in your home directory. Typically, these system
    files set up a few aliases, do some security checks. Configure your prompt, and
    perform half a dozen other user and site specific tasks only'
