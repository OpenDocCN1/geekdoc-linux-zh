    Tar is the archive utility, though you don''t necessarily need to use it with
    tapes. Its purpose in life is to pack a bunch of files all together into one file
    in such a way that they can be unpacked and separated to their original state.
    Most Linux distributions rely on tar in one format or another.


    By default, tar does not compress the files it is archiving. This means that your
    archive file takes up more or less the same amount of disk space as the files
    that went into it. Generally you''ll want to use one of the compression options
    (--gzip, --compress) when archiving.


    Example: To create (-c option) a tar archive of all the files under your home
    directory and store them in the archive file mystuff.tar (-f option tells tar
    the next argument will be the default file, in this case, "mystuff.tar")


    ```

    tar -cvf mystuff.tar /home/myhomedir

    ```


    The -v option tells tar to list the files as it''s saving them, just so you have
    something to watch.


    Example: To extract (-x option) all the files from the archive created in the
    previous example:


    ```

    tar -xvf mystuff.tar

    ```


    Example: To create a tar archive just like the one in the first example (above),
    but compress (-gzip option) at the same time:


    ```

    tar -gzip -cvf mystuff.tar /home/myhomedir

    ```


    The file would be uncompressed


    ```

    tar -gunzip -xvf mystuff.tar

    ```'
