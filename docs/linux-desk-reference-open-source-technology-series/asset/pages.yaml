  md: '# CHAPTER 10


    # DISKS


    The Linux concept of a disk is not particularly intuitive. First, a physical disk
    may contain several disk devices (/dev/hda1, /dev/hda2, ...). Second, it is fairly
    rare to deal with disks directly in the course of day-to-day operations. Once
    a disk has been defined, you usually must put a filesystem on it in order to get
    any use out of it (see Chapter 11 for more information on the creation and maintenance
    of filesystems).


    Those of you whoveve reading these introductory sections have probably noticed
    a common theme by now: Linux does not care about the name of a particular resource;
    it is usually much more interested in what its number is. Disks are no exception.
    All Linux devices have two numbers associated with them: the major number, which
    corresponds to a device driver (program for manipulating the device hardware)
    within the kernel, and the minor device number, which specifies a particular device
    handled by that driver.


    | Humans Think of | The Kernel Prefers |

    | Timmy | uid=508 |

    | ls | inode=2026 |

    | /dev/hda5 | major=3, minor=5 |'
  merge: -1
