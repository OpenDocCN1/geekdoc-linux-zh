- img_proc: true
  md: '# bg job_num


    The **bg** command takes a stopped job and starts it in the background.

    **Example:** You said started running a **find** command and it was taking forever.
    You''ve got only one window available, so you want to move it to the background
    without restarting it:


    ```

    $ find / -type f -print | grep sammich

    ^Z # Stop current job

    $ jobs # Display job list

    [2]+ Stopped find / -type f -print | grep sammich

    $ bg 2 # Run job in background

    ```


    TIP To use this command, you will need to know the job number. Obtain the job
    number with the **jobs** command.


    # fg job_num


    The **fg** command moves a running background job to the foreground.

    **Example:** To get the job numbers of your background and stopped jobs, start
    bigsort running in the foreground:


    ```

    $ jobs # Tell system to display job list

    [2] Running bigsort

    [3] Stopped find / -type f -print | grep sammich

    $ fg 2 # Move bigsort to foreground

    ```


    TIP To use this command, you must know the job number. Obtain the job number with
    the jobs command.


