    smbclient is a client program designed to communicate with a Lan server. Its functionality
    is not unlike ftp in that it is mostly used for the getting and putting of files
    and directory information. It can also be used as an interface to other server
    resources (e.g., printers).


    Example: To use smbclient to print the file.txt to the printer HPL6 on the server
    Loki


    ```

    cat test.txt | smbclient \\Loki\HPLJ6

    ```


    Example: The following example shows using smbclient to retrieve the file "test"
    from the "etc" on the machine "Loki." Commands which I actually typed are in boldface,
    the machine responses are in regular text:


    ```

    [shawkins@odin shawkins]$$ smbclient \\Loki\e''

    Server time is Sun Aug 1 14:16:50 199

    Timezone is UTC-4.0

    Password:

    security=share

    smb: \> get test.txt localest.txt

    getting file \test.txt of size 30 bytes as

    localest.txt (3.66206 kb/s) (average 3.66211 kb/s)

    smb: \> quit

    ```


