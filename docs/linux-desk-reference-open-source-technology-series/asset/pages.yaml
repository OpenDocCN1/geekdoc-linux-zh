    Returns a human-readable status report on either the system or a particular person.
    Options to this command should be specified in /etc/inetd.conf.

    Example: This daemon is usually invoked by inetd (which uses tcpd to provide access
    control and logging services). To start fingerd, add the following line to your
    inetd.conf file:


    ```

