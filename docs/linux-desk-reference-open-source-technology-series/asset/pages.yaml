    +   -V Display version information.


    +   -q queue Specify a queue. Valid values for [a-z][A-Z], and = for currently
    running jobs. Default values are a for at and b for batch. Queues with higher
    letters run with increased nice values.


    +   -m Send mail to the user when the job finishes running.


    +   -f file Commands to be run will be taken from the specified file rather than
    standard input.


    +   -l List queued jobs.


    +   -d Remove previously queued daemon job.


    +   -v For atq, shows completed but not yet deleted jobs in the queue. For all
    others, it shows the time the job will be executed.


    +   -c Display the jobs listed on the command line to standard output.


    # crontab [-u user ] file


    # crontab [-u user ] { -l | -r | -e }


    Crontab is the command used to maintain your list of cron jobs. A cron job is
    a job scheduled to be executed automatically by the system at specified time or
    interval. In order for this to work, the cron daemon must be running.


    Confusing, cron jobs are stored in files which are also called crontabs. On most
    systems, each user can set up his or her own crontab. It is possible to configure
    cron such that no one but the superuser can use cron. If your user name is listed
    in a file /etc/cron.deny, you cannot use cron. Similarly, if the file /etc/cron.allow
    exists, you must be listed in it or you cannot use cron.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# Commands 353


    When you use crontab for the first time, your default editor (usually vi) is invoked
    and you''re looking at a blank file. You use crontab by adding and deleting entries
    from this file. Entries are in the format:


    Variable: minutes hours day-of-month month weekday command


    | Range: | 0-59 | 0-23 | 1-31 | 1-12 | 0-6 |


    When you''re done editing, quit out of the editor the normal way. Cron will look
    at what you''ve done and tell you if you made formatting errors. Otherwise, the
    jobs will be executed as specified. Note that for the weekdays field, 0=sunday.


    **Note:** Depending on what you''re trying to do with cron, some of the fields
    will be blank. **Always mark the unused fields with asterisks.**


    Example: To edit your crontab:


    ```

    crontab -e

    ```


    To run the shell script "cleanup.sh" at midnight on Fridays, add the following
    line to the crontab file:


    ```

    0 0 * * 5 crontab.sh

    ```


    You can, technically, edit your cron files without using crontab. But it isn''t
    a good idea.


    > TIP


    +   -u user Specify crontab other than the default.


    +   -l List the crontab to standard output.


    +   -r Remove the entire crontab.


    +   -e Edit the crontab. Note that when you exit the editor, any changes you make
    will be automatically submitted to the cron daemon.'
  merge: -1
