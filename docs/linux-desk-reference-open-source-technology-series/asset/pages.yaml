  md: '# CHAPTER

    3


    # PROCESS


    # Introduction


    A process is a program which is currently running. It consists of the executable
    instructions for the program, the program data, and stack data. Processes are
    uniquely identified by their number, called PID or process id.


    Processes are always created by other processes via the fork() system call. For
    example, when you type ls and hit <enter>, the process which is your shell fork,
    creating a nearly exact (except the pid) duplicate of itself. The copy then immediately
    cedes control of its system resources to the ls program by running an exec() system
    call. In this way, all processes are descended from init.


    The process created via a fork() is referred to as the child, the process which
    forked is called the parent. In some process information listings you will see
    a PPID field: this contains the Process ID of the processes'' Parent.


    Processes may communicate with each other via signals, standardized numeric messages
    corresponding to a variety of system events. (usr/include/linux/signal.h for details).


    Processes have a priority, a numeric value between -19 (high-priority) and 20
    (lowest priority) used by the kernel to calculate who gets next crack at the CPU.
    By default, processes are created with a priority of 0.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Processes may be run in the foreground (visibly executing on your) or in the
    background (running but not in control of your terminal). It is possible to explicitly
    move running processes between the foreground and background; see the entries
    for &, ^Z, bg, fg, and jobs.


    A zombie process is a process which has been killed and had its system resources
    freed but has not yet been removed from the list of running processes.


    The following are some of the commands which deal directly with processes:


    +   & Run the specified process in the background.

    ^Z Suspend the current foreground process.

    bg Put the specified process in the background.

    fg Bring a specified process to the foreground.

    fuser Display the pid of any process using a specified file.

    jobs Display a list of of background processes.

    kill Stop the execution of a process.

    killall Kill all processes executing a specified command.

    nice Change priority of a process.

    hnup Run a process that will ignore signaling.

    pidof Locate and print the process id of the specified program.

    ps Get process status information.

    pstree Display family tree of running processes.

    renice Change the id of a running process.

    top Display CPU usage information.'
