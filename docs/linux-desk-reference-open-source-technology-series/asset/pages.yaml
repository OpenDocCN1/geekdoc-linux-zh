  md: "# Conditional Statements\n\nConditional statements are statements which affect\
    \ the flow of the execution. The common characteristic is that they evaluate conditions\
    \ present and may take action based on those conditions. The two most common are\
    \ the if statement and the case statement:\n\n```\nif [CONDITION] then\n    STATEMENTS;\n\
    \  elif CONDITION-JR then\n    STATEMENTS-JR;\n  else ALTERNATE STATEMENTS\n \
    \ fi\n```\n\nThis command executes the STATEMENTS if the final command in the\
    \ CONDITION sequence has an exit status of zero.\n\nIf the exit status of the\
    \ CONDITION is non-zero, the elifs are executed in turn, again evaluating the\
    \ exit status of the final command and either executing the CONDITION-JR commands\
    \ or not, depending on the exit status of STATEMENTS-JR.\n\nIf ALTERNATE-CONSEQUENTS\
    \ exist and the final TEST-COMMAND has a non-zero exit status, the ALTERNATE-CONSEQUENTS\
    \ are executed.\n\nExample: To test whether the script file ~/startup (-e flag)\
    \ and run it it does:\n\n```\nif [ -e ~/startup ]; then\n    ~/startup\n```\n\n\
    case WORD in [PATTERN [ PATTERN],...) COMMANDS ;;]... esac\nThe command is used\
    \ to selectively execute commands. Conceptually, it's a lengthy statement with\
    \ a lot of conditions. If WORD matches PATTERN the COMMANDS associated with PATTERN\
    \ are executed.\n\nExample: To test the value of the first argument passed in\
    \ and execute various scripts based on its value:\n\n```\ncase $1 in\n    0) .script1;\n\
    \    1) .script2;\n    2) .script3;\n  esac\n```"
