  md: '# CHAPTER 33

    MAIL & OTHER COMMUNICATION


    Introduction Modern email systems are a suite of programs working together. User
    agents (e.g., elm, mail) are the programs which interface with the end user for
    creation and display of email. Transport agents (sendmail, small, fetchmail) are
    responsible for forwarding mail to the system for which it is intended. Delivery
    agents (rmail) put mail in the system in the proper mailbox.


    The topic of configuring an Internet-connected email service would fill a large
    book by itself (in fact, it does: Sendmail, 2nd edition, the definitive reference).
    The sendmail and fetchmail commands are included in this section primarily to
    give a feel for how they fit into the overall Linux world.


    In addition, Linux provides several utilities (wall, write, talk, rwall) for communicating
    directly with another user''s terminal. These are fairly invasive programs and
    should be used sparingly. If having messages show up on your screen uninvited
    irritates you. use the mesg utility to deny other users permission to display
    to your terminal.


    | biff | Toggle message notification. |

    | elm | Email user interface. |

    | fetchmail | Retrieve mail from remote servers. |'
  merge: -1
