- img_proc: true
  md: '# CHAPTER 4


    # STANDARD INPUT, OUTPUT, AND ERROR


    # Introduction


    The concept of a standard input and a standard output is one of the most useful
    features of Unix-like operating systems. The idea is that every program, no matter
    how diverse, should be reading input and generating output in a uniform, clearly
    understood way. Once you have that, it makes it much easier for programs to talk
    to one another directly. It is also possible to write generic programs which bridge
    the in-and-out of any two programs, which is an amazingly handy ability to have.


    To put it another way, for the most part, standard input and standard output are
    nothing more than the keyboard and the monitor, respectively. But if you want
    to, you can redirect the output that would have gone to your monitor to somewhere
    useful—like a file, or even the input of another program. Similarly, you can set
    up files that contain sheaves of data and use that as input to some command, or
    read the input for command A directly from the output of command B.


    In addition, a third mechanism known as standard error has been provided to programs
    for displaying error messages.


    +   > Send standard output to a file.


    +   < Read standard input from a file.


