- img_proc: true
  md: '# 414 TCP/IP


    cheerfully ignoring it ever since, but it comes up whenever people start to

    talk about TCP/IP. Rather than tradition, I hereby include the 7-layer

    OSI reference model:


    Application The application which you are invoking at the command

    line to do stuff (e.g., telnet)


    Presentation This layer concerns itself with the format in which data

    will be handed to the adjoining layers. For example,

    EBCDIC to ASCII translation or encryption might be

    handled here.


    Session As the name implies, this layer is concerned with setup

    and shutdown of a communication session between two

    machines.


    Transport Concerned with reliable delivery and data integrity.


    Network This layer concerns itself with the routing of packets

    from one point in the network to another.


    Data Link In this layer, the bits received from the adjoining layers

    grouped into logical units called frames**.


    Physical This layer includes cabling and whatnot, and is respon-

    sible for the actual transmission of data over an actual

    physical link.


    # TCP/IP Protocol


    Like most network protocols, TCP/IP bears only a peripheral resemblance

    to the OSI model. The TCP/IP designers had their own layers in mind:


    Application Implementation of a protocol for a specific task (e.g., Simple Mail

    Transport Protocol—SMTP—for mail, telnet for remote logins).


    Transport The procedure two machines use to communicate with one

    another. For example, the TCP protocol which exists at this layer

    is a reliable, connection-oriented protocol (see definitions,

    below).


    Internet This layer is concerned with shuffling information (arranged into

    packets called datagrams) between two hosts. The hosts need not

    know anything about how the network is organized or how the

    data will get there.


    Host-to-Network Concerned with the physical connection to a network and the

    transmission of data across subnetsworks.'
  merge: -1
  pgno: 443
