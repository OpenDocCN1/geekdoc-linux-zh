  md: '# basename NAME [SUFFIX]


    This command takes a full UNIX path and strips away all but the last element.
    Generally used in scripting. If the optional suffix is supplied and it matches
    the last element, it is stripped away as well.


    Example: Say your current working directory is /var/spool/mail. In that case:


    ```

    basename $PWD

    ```


    would display


    ```

    mail

    ```


    Of course, basename can be used on text strings as well as environment variables:


    ```

    basename /var/spool/mail

    ```


    would also display


    ```

    mail

    ```


    +   - --help Display usage information.


    +   - --version Display version information.


    # dirname NAME


    This command takes a full UNIX path and displays all but the last element. Generally
    used in scripting.


    Example: Say you were writing a script that needed to know the directory name
    of your mail folder:


    ```

    dirname $MAIL

    ```


    This command is a good example of a general scripting principle: don''t hard code.
    "Hard coding" means treating a value in your script (e.g., the mail directory,
    /var/spool/mail) as a constant when it may not necessarily constant.


    For example, while /var/spool/mail is in fact a wise choice for a mail directory,
    we can flat-out promise that the systems administrator of the company to whom
    you are pitching your million-dollar mail utility chose'
