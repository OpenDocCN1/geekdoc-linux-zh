  md: '# Introduction


    # 417


    # Reliable


    When used in the network context, this word refers to a protocol that guarantees
    delivery of all packets transmitted.


    # Unreliable


    Protocols described as unreliable are not necessarily unreliable in the common
    English sense of the word; they just don''t guarantee delivery of any particular
    packet.


    # ConnectionOriented


    A protocol is connection-oriented if it establishes a connection between the two
    communicating hosts. A connectionless protocol transmits data without any direct
    communication (''handshaking'') between the two hosts.


    # Name Resolution


    The process of turning a dotted IP address into an English word (e.g., 192.168.100.1
    = odin).


    former doesn''t, you have a name resolution problem. Cheer up, things could be
    worse.


    Most network problems are physical. For example, I spent almost an hour last Saturday
    trying to figure out why me & the little woman couldn''t get X-Wing by. TIE fighter
    to work before realizing that Puppy Dog chewed up the cable. Similar things happen
    in industry, particularly when your wiring runs through the sales department.


    The following commands are covered in this chapter:


    | arp | Maintain the Address Resolution Protocol table |

    | bootpd | Network boot daemon |

    | bootptap | Dump bootp table |

    | bootpgw | bootp gateway |

    | boottest | Test bootp |

    | dip | Handle dialup IP links |

    | hostname | Set or display host name |

    | gated | Implementation of the gated routing protocol |

    | gdc | Gated controller |


