    -e Set the erase character as specified.

    -l Do not set terminal or tab initialization strings.

    -i Set the interrupt character as specified.

    -k Set the line kill character as specified.

    -m Specify a mapping from a port type to a terminal.

    -Q Suppress display for line kill, erase, and interrupt characters.

    -r Output terminal type to standard error.

    -s Output the shell commands needed to initialize the TERM environment variable.'
