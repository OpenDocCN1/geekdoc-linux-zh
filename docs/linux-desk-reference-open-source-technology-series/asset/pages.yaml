    # Arithmetic Expansion


    Arithmetic expansion allows the evaluation of an arithmetic expression and the
    substitution of the result. There are two formats for arithmetic expansion:


    ```

    $[ expression ]

    $(( expression ))

    ```


    Example: The following expression adds the values of the variables A and B:


    ```

    $((A + B))

    ```


    Example: To print out the results of an arithmetic expression, use echo:


    ```

    echo "A + B is $((A+B))"

    ```


    # Arithmetic Builtins


    ```

    let EXPRESSION [EXPRESSION]

    ```


