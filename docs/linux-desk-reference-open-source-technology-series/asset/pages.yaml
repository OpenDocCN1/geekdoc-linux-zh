    # Commands


    ```

    find [path...][expression]

    ```


    The find command searches the directory tree specified by the path argument for
    the pattern(s) indicated in the expression argument.


    The expression consists of options, tests, and actions. Options affect overall
    operation rather than the processing of a specific file. Tests return a true or
    false value based on evaluation of some condition. Actions have side effects and
    return a true or false value.


    Example: To search the entire system for a file named "abcd.txt":


    ```

    find / -name abcd.txt -print

    ```


    Example: To search all the files in the directory tree of user "someguy" for the
    string "blah":


    ```

    find /home/someguy -type f -print xargs grep -n "blah"

    ```


    A common mistake with the find command is assuming that it displays output by
    default. It doesn''t. If you want to see what find, you must specify one of the
    various print options (e.g., -print).


    +   -daystart Tell find to measure times relative to the start of the current
    calendar day rather than 24 hours ago.


    +   -depth Perform a depth first search rather than a breadth first search. That
    is, search the contents of each directory before the directory itself.


    +   -follow Follow any symbolic links encountered in the search.


    +   -help, --help Display a help summary and exit.


    +   -maxdepth levels Descend to the specified number of levels below the starting
    point.'
