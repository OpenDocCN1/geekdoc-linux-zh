  md: '# Related Files


    | /proc | Location of the process filesystem |

    | /usr/include/linux/signal.h | List of valid signals |


    # Commands


    ```

    &

    ```


    The & command, used on the command line, forces the specified process to run in
    the background.


    Example: To start a lengthy program running in the background:

    sort_everything &


    > TIP As soon as they are successfully invoked, background processes release control
    of your terminal to the shell which invoked them. This means you can continue
    to work without waiting for a lengthy process to finish.


    ^Z command stops the current foreground process.


    Example: This command works on any process. For example, say you''re running a
    lengthy sort and you want to check what time it is:


    ```

    $ biglongsort # Start lengthy process

    ^Z # Suspend with ^Z

    [3]+ Stopped (signal)

    $ date # Check time

    Sun Jul 11 12:22:41 EDT 1999

    $ fg 3 # Restart process

    ```'
  merge: -1
