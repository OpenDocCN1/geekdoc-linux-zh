  md: '# CHAPTER 32


    # DOS & WINDOWS


    # Introduction


    The world being what it is, the odds are that even the most fervent Linux partisan
    will, from time to time, be forced to interact with the various Microsoft products.
    The commands in this section enable Linux to work directly with Microsoft file
    systems and networking protocols. In the discussion below, the term “Windows”
    is used as shorthand for the DOS, Windows, and OS/2 operating systems.


    The differences between the Linux environment and the Windows environment are
    innumerable as the differences between good and evil. For that reason, the introduction
    to this chapter is likely to be a little topheavy. I want to give you enough information
    to get the job done, but at the same time this book needs to be light enough for
    an average human to lift it without mechanical assistance. Let me know if you
    need more details.


    # Windows Filesystems


    Historically, Windows used the FAT (File Allocation Table) filesystems. The FAT
    system stores information on file size, type (e.g. archive, system, hidden, read-only),
    and modification time. As the FAT system was designed to be run on a single-user
    PC, there is no provision for access control. The m* suite of commands (copy,
    mdir...) are designed to access FAT filesystems directly from Linux. More recently,
    we''ve seen the introduction of NTFS, the NT filesystem which provides for access
    control'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# 490


    # DOS & Windows


    In the Windows environment, path delimiters are backwards: "\" instead of "/".
    Also, drives are specified by letters. By convention A: is the floppy disk C:
    is the primary hard disk (which may have further logical subdivisions—D-; E:...).
    For example, the file test in the subdirectory examples of the floppy disk drive
    would be specified as:


    ```

    A:\examples\

    ```


    # Windows Networking Concepts


    Windows networking using the Server Message Block (SMB) protocol for communication
    between networked machines. Broadly speaking, the SMB protocol provides the following
    functionality:


    +   - Opening & closing files

    - Reading and writing data blocks

    - Retrieving directory information

    - Maintaining the list of Universal Naming Convention (UNC) names for shared resources
    (e.g., printers, files)

    - Associated operating system overhead


    The SMB protocol is roughly analogous to a combination of the Unix NFS and lpd
    line printer daemon.

    Note: In comparison to Unix, SMB has a lot of commands. This means that SMB is
    more complicated and more likely to have bugs, but at the same time quicker in
    that a single SMB command can suffice for two or three NFS commands.


    The SMB protocol runs on top of the NetBIOS network interface. NetBIOS stands
    for Network Basic Input Output System. It is a session-level (of the OSI model)
    network interface typically used on Windows networks. NetBIOS provides the following
    basic services:


    | Name Service | Maintain name database for applications |

    | Session | Handle connection/disconnection and communication between two applications
    |

    | Datagram | Transmit datagrams (fundamental packets of data) to network, receive
    those addressed to you |


    NetBEUI is a non-routable networking protocol designed for LocalManager networks.
    It is a prominent implementation of NetBIOS.'
  merge: -1
  pgno: 519
- img_proc: true
  md: '# Introduction


    The Uniform Naming Convention (UNC) is the syntax used to specify shared network
    resources ("shares") on a Windows machine. UNC names are of the form:


    ```

    \\server\sharename\subdirectory\subdirectory\...filename

    The server and sharename are mandatory; subdirectory and filename specifications
    are optional. For example, in the sample network described in the start of this
    section, my printer share is called:

    ```


    ```

    \Loki\HPLJ6

    ```


    and this chapter is shared as

    \Loki\My Documents\Linux Book-26-dos

    Windows networks come in two flavors: workgroups and domains Workgroups, which
    may be run without an NT machine, are peer-to-peer networks, using of Windows
    95/98 machines. Workgroups allow shared access to resources (printers, directories)
    across a network. Workgroups have very limited security features, but it is possible
    to set a password for a printer or other share.


    Domains, which require an NT machine, implement centralized access control and
    are chock full of user level security mechanisms. The NT-server machine which
    stores account information for a domain is called the primary domain controller.


    > Note: NT domains and Internet domains are totally different concepts.


    The process of viewing the resources available on a Windows network is known as
    browsing. In order to facilitate browsing, Windows networks require that one of
    the machines on the network maintains a centralized list of browsable resources.
    The list is known as the browse list, the computer that maintains it is known
    as the master browser.


    The Windows Internet Name Service (WINS) is a client-server mechanism for resolving
    Internet domain names into IP addresses. The LMHOSTS file is a text file used
    by Windows systems to associate BIOS network names with IP addresses (not unlike
    the /etc/hosts file on Linux). It is found either in the WINNT32\drivers\etc directory
    (Windows NT) or the WINDOWS directory (Windows 95/98).


    Samba is a suite of programs which run on Linux(for other Unix machines but use
    the SMB networking protocol. Linux machines running Samba can act as file and
    print servers for Windows machines. Samba can be obtained from:


    http://samba.anu.edu.au/pub/samba


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_520_0.png)'
  merge: -1
  pgno: 520
- img_proc: true
