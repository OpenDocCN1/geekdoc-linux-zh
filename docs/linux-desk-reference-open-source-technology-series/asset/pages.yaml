  md: '# Commands


    Less is interactive; once invoked, there are a variety of ways to specify how
    far and in what direction you wish to scroll. The following may be preceded by
    an integer, hereafter N, which specifies some number of lines.


    | h or H Help | Display a summary of the interactive commands |


    | SPACE, ^V, f, ^F | Scroll forward N lines (one window by default). |


    | z | Like space, but with the option to specify a new window size. |


    | ESC-SPACE | Scroll forward a full screen, ignoring possible end of file. |


    | RETURN, ^N, ^E, ^j, ^J | Scroll forward N lines. |


    | d, ^D | Scroll forward N lines, default .5 screen. |


    | b, ^B or ESC-v | Scroll backward N lines, default 1 window. |


    | w | Like ESC-f, but if in N specified, it becomes the new window size. |


    | y, ^Y, ^P, k, ^K | Scroll backward N lines, default 1. |


    | u, ^U | Scroll backward N lines, default .5 screen. |


    | ESC-) or RIGHTARROW | Scroll horizontally right N characters, default 8. |


    | ESC-( or LEFTARROW | Scroll horizontally left N characters, default 8. |


    | r or ^R or ^L | Redraw the screen. |


    | R | Repaint the screen, discarding any buffered input. |


    | F | Scroll forward, and keep trying to read when the end of file is reached.
    |


    | g, <, ESC-< | Go to line N in the file, default 1. |


    | G or > ESC-> | Go to line N in the file, default the end of the file. |


    | p or % | Go to a position N percent into the file. |'
