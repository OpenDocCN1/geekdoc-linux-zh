    mailq [-v] Sendmail is responsible for delivering messages to the intended recipients.
    It transports messages across networks as necessary. It is not designed for contact
    with the end user; other programs (mail, elm) handle that phase of the mail process.


    Example: To invoke sendmail as a foreground daemon in verbose mode:


    ```

    sendmail -bD -v

    ```


    -BType Specify the body type of the message. Current legal values 7BIT or BITTIME.


    -ba Specify ARPANET mode.'
