  md: '# 500


    # DOS & Windows


    which associates the netbios-ssn service with port 139 and the netbios-ns service
    with port 137. Once the association has been made, inetd will monitor ports 137
    and 139 for requests. Upon receiving a request, inetd will look in the `inetd.conf`
