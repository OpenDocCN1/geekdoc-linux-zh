  md: '# CHAPTER 2


    # FILES


    # Introduction


    In the Linux environment, a file is defined by its inode. Though most users never
    have occasion to directly access the inode, it is one of the fundamental components
    of the operating system, and thus it is very useful to have at least a cursory
    understanding of it.


    The inode is a data structure which contains all the information the system needs
    to know about a particular file. This includes a unique identifying number (the
    inode number), the name of the file, its size, the file''s location on the device,
    the most recent access and update times, the file''s (numeric) owner and group
    ids, access permissions, and a pointer to the first block of data which the file
    contains.


    In Unix, everything that isn''t a running process is a file. Actually, there are
    also files corresponding to processes (see the /proc filesystem), though the classic
    definition of file is distinct from an executing process. The various file types
    are listed below. The first column of Table 2-1 corresponds to the letter displayed
    when an ls -l command is run:


    ```

    ls -l

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: Note that all of the following commands may potentially be used on your own
    files, but to use them on someone else's you will need to have superuser privileges.
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Introduction


    You will see the above properties appear in various ways throughout the commands
    listed below:


    +   - **chgrp** Change the group ownership of the file.

    - **chmod** Change the mode (access permissions) of the file.

    - **chown** Change the owner of the file.

    - **cksum** Calculate the checksum of a file.

    - **cp** Copy the file.

    - **dd** Copy file and possibly fiddle with the format.

    - **file** Determine file type.

    - **install** Copy file(s), preserving permissions.

    - **in** Create a link to a file.

    - **lockfile** Create a semaphore.

    - **ls** List the contents of a directory.

    - **lsattr** List the attributes of a file.

    - **mv** Rename a file.

    - **pathchk** Check filename for portability.

    - **rm** Remove (delete) a file.

    - **stat** Display the contents of the file''s inode.

    - **sum** Calculate checksum.

    - **symlinks** Scan a directory for symbolic links.

    - **touch** Update access times or, potentially, create a file.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Related Files


    /etc/passwd Contains the user names and ids referenced by the inode.


    /etc/group Contains the group names and ids referenced by the inode.


    # Commands


    # chgrp [OPTION]... GROUP FILE...


    Change the group membership of the file(s) to GROUP. Group must be a valid option
    as defined in /etc/groups. Depending on your current access permissions for the
    target file, this command may or may not work for you. In general, if you already
    have access to FILE, you can grant access permission to someone else. If you do
    not currently have permission to access the file, you cannot grant access to yourself.


    Example: To change the group ownership of the file testfile to group2:


    ```

    chgrp group2 testfile

    ```


    +   -c, --changes Print out confirmation for each file whose permission is successfully
    changed.


    +   -f, --silent,--quiet Suppress any error messages generated by the chgrp command.


    +   -h, --no-dereference In the case where the target file is a symbolic link,
    make any changes to the link itself rather than the file to which it points.


    +   -v, --verbose Verbose output.


    +   -R, --recursive In the case where the file is a directory, also change the
    contents of the directory (including any subdirectories).


    # chmod [OPTION]... NEW_PERMISSIONS FILE...


    Change the permissions (mode) of the target FILE(s) to NEW_PERMISSIONS. NEW_PERMISSIONS
    may be one of two forms:'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Commands


    # 15


    # [+|-][r|w|x]


    for [adding | subtracting] one of the three permission types [ read | write |
    execute].


    Unless otherwise specified, using the +- syntax in chmod will cause changes to
    apply to everyone. If you want to be more specific, you can specify whether to
    apply to the user (u), the group (g), everyone (e) or all of the above (a).


    This generates commands like the following:


    Example: Grant read access to the file to user, group and everyone:


    ```

    chmod a+r file1

    ```


    Example: Revoke execute access on the file from the group:


    ```

    chmod g-x file2

    ```


    Alternatively, you may specify the new permissions in octal notation. Each file
    has three sets of permissions associated with it: those for the file''s owner,
