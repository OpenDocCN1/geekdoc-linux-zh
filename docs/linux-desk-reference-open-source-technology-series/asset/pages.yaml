  md: '# CHAPTER

    22

    STARTUP &

    SHUTDOWN


    # Introduction


    Starting and stopping a Linux machine is a fairly intricate process.


    # Startup


    When the machine is turned on, it searches its own hardware for a bootable file.
    The exact search order is system dependent, but these days you typically see the
    machine looking at its floppy drive, then the CD-ROM, then the master hard disk.
    Check your BIOS configuration for information about your particular machine.


    Usually, Linux systems are started by LILO (the Linux LOader), LILO works well
    when placed in the Master Boot Record of your hard drive and can be configured
    to invoke Windows or other operating systems in addition to Linux. However, if
    you are using Windows NT or OS/2, you may be forced to install LILO somewhere
    other than the master boot record as these operating systems demand total control
    of the MBR. In addition, Linux may be started from a boot floppy or CD-ROM.


    Regardless of your boot method, the first thing that happens is your kernel is
    loaded. The kernel initializes its own internal data structures and loads its
    device drivers. If all goes well, the kernel then starts the init program which,
    in turn, forks clones to create the user processes.


    Linux uses the concept of runlevels to define which processes the system allows
    to run at a given time. A runlevel is a numeric'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 318


    # Startup & Shutdown


    system variable between 0 and 6 which has a set of allowable processes associated
    with it. When the system transitions between runlevels, it consults the /etc/inittab
    file to see what processes to start or stop.


    | Runlevel | Meaning |

    | --- | --- |

    | 0 | system halted |

    | 1 | administrative runlevel |

    | 2, 3, 4, 5 | user definable run levels |

    | 6 | reboot runlevel |


    A great deal of boot time system configuration is accomplished via script. The
    /etc/rc.d/[runlevel].d directories contain scripts associated with the various
    runlevels. These scripts are executed by init in order of their appearance in
    the output of the ls command upon entering run-level.


    # Shutdown


    When the shutdown command is invoked, the system sends messages notifying users
    of the impending shutdown. Usually you like to give them a bit of warning lest
    they come back from the cafeteria and find a day''s work destroyed.


    Next, the executing processes are sent a signal and they terminate with varying
    degrees of grace. The subsystems are shut down, any users who didn''t take the
    hint are kicked off by force, and any processes which didn''t respond to the signal
    are killed. Any filesystem updates are written out to disk via sync and, finally,
    init takes the system to its new runlevel.


    A shutdown can be aborted by getting the process id of the shutdown process and
    killing it manually. However, this may interrupt things which are best left alone,
    so it is almost safer just to let the shutdown finish and then start things back
    up again.'
  merge: -1
  pgno: 347
