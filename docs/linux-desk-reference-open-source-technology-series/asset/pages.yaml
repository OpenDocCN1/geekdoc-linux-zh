  md: '# CHAPTER 30

    NETWORKING APPLICATIONS


    # Introduction


    Purists among you will note that the commands covered in this section are usually
    associated with TCP/IP and thus might organization have been included in that
    chapter. My justification for organizing them into two chapters is that these
    commands are concerned with accomplishing actual work in a network environment,
    whereas the commands in the TCP/IP chapter are more concerned with the infrastructure
    used to facilitate that work. Also the TCP/IP chapter was getting awfully long.


    The commands covered in this chapter include:


    +   * ftp Transfer files between networked machines

    * hostname Display or set name of host

    * netstat Display network usage information

    * ping Request confirmation packed from remote host

    * rarp Reverse Address Resolution Protocol

    * rcp Remote copying service

    * rdate Get date information across network'
