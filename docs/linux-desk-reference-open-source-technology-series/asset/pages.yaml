    # cksum [OPTION]... [FILE]...


    Compute and print the Cyclic Redundancy Check for each file specified. The primary
    use for this command is to verify that a file you have just transferred via some
    potentially unreliable means has arrived in one piece. That is, if you calculate
    the checksum from the original file and compare it to the transferred copy, the
    sums will be identical if and only if it was transferred correctly.


    Example: To verify that rcp copied testfile from host1 to host2 correctly:


    ```

    host1> cksum testfile

    4294967295 329 testfile

    host1> login host2

    host2> rcp testfile:/tmp/testfile

    host2> cksum testfile

    4294967295 329 testfile

    ```


    # cp [OPTION]... SOURCE TARGET


    Create a copy of the file SOURCE at TARGET. TARGET may be a file or a directory.
    If TARGET is a directory, cp will create a copy of SOURCE in that directory with
    the same name as the source file. Note that this command is distinct from mv in
    that an entirely new file is created with a different inode number and a different
    location in the filesystem.


    By default, cp doesn''t copy directories. However, you can force it to do by specifying
    the -r option.


