  md: '# CHAPTER

    1


    # DOCUMENTATION


    # Introduction


    There are a wide variety of sources for documentation on Linux.

    The quality of the information provided ranges from nearly poetic in its eloquence
    and usefulness all the way down to misleading or even blatantly wrong. Caveat
    emptor.


    Most commercial packages provide a variety of FAQ''s and HOWTOs in addition to
    the standard online documentation (**man, info, ...**). These are generally centered
    around some non-trivial task (e.g., running X-Windows, communicating with the
    lesser operating systems).


    Usenet has dozens, if not hundreds, newsgroups devoted to the various facets of
    Linux. Be advised that they are usually segregated according to level of expertise
    and the locals can be grumpy about inappropriate newbie questions—you should (as
    always) read the FAQ (frequently asked questions) before posting.


    Similarly diverse information can be found on the Web. Probably the best site
    is http://metalab.unc.edu/LDP, the official Linux Documentation Web site.


    Because Linux is a variation of the Unix operating system, the published Unix
    references will, for the most part, apply to Linux as well. Also, as Linux gains
    popularity, more Linux-specific periodicals are available at bookstores.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 2 Documentation


    Of course, your first source of information should be your own machine. Most questions
    can be answered by a careful reading of the online documentation.


    The commands covered in this section tell you how to use the resources on your
    machine. They include:


    +   * apropos Search the whatis database.

    * info Provide hypertext documentation.

    * locate Search for a file in the locate database.

    * man Access on-line manual pages.

    * makewhatis Create the whatis database.

    * manpath Specify the search path for the man command.

    * updateddb Update the locate database.

    * whatis Search the whatis database for information.

    * whereis Locate source files and documentation.


    # Related Files


    +   * /etc/man.config Default man.conf file.

    * /usr/sbin/makewhatis Create the whatis database.


    # Commands


    > apropos keyword


    Search the whatis database for keyword. Provides terse but thorough documentation.
    Good place to start looking if you''re clueless. You must run makewhatis before
    using.


    Example: To retrieve information on the various files and executables dealing
    with passwords:


    ```

    apropos passwd

    ```


    info options keyword


    Info is a hypertext reader which searches and displays online documentation about
    the specified keyword.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Commands


    Example: To look up information on the cd command:


    ```

    info cd

    ```


    Example: To look up information on the grep command and store it in output file
    grep.doc:


    ```

    info -o grep.doc grep

    ```


    | directory | Look for info files in the specified directories. |

    | DIRECTORY-PATH, -d DIRECTORY-PATH | |

    | --file FILENAME, -f FILENAME | Search the specified filename for information
    about keyword. |

    | --node NODENAME, -n NODENAME | Force display of the specified info node. |

    | --output FILENAME, -o FILENAME | Direct all output to FILENAME rather than standard
    output. |

    | --subnodes | Recursively output the nodes appearing in the menu of each node
    being output. |

    | --help, -h | Output a description of the available options for info. |

    | --version | Display the version information. |


    locate [-d path] [--database=path][--version][--help] pattern


    The locate database for pattern. This command serves some of the purposes as find,
    but it is quicker and not as thorough.


    Note that in order for this command to work, the updateddb command must be run.
    If you get in the habit of using locate, you probably ought to put a line in your
    crontab to run updateddb every night; otherwise, your information will get out
    of date quickly.


    Example: To get locate to search its database for HOWTO files pertaining to XFree86:


    ```

    locate HOWTO | grep XFree86

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'If the file you''re after was created since the last time updatedb was run,
    locate won''t find it. Use the find command instead.


    +   -d path, -- database=path Search the specified path instead of the default
    path.


    +   --version Display the version number.


    +   --help Display help info.


    # makewhattis options


    Create the whatis database, an on-line database of commands used by the whatis
    command. Generally, makewhattis needs to be run only once. Example: To update
    the whatis database after you''ve installed a new batch of man pages:


    makewhattis -w


    +   -U Update database with new man pages.


    +   -V Operate verbely.


    +   -W Use manh obtained from man --path.


    ```

    man [-acdfhkKtwW] [-m system] [-p string] [-C config_file] [-n path] [-P pager]
    [-S section_list] [section] name ...

    ```


    Format and display on-line manual pages. Manual pages are prepared documents associated
    with a particular command. They describe the command syntax, the usage, the associated
    files, and occasionally usage examples. The following environment variables apply:


    +   MANPATH Specify the path to be searched for man pages.


    +   MANROFFSEQ Determine the set of preprocessors run before nroff or troff.


    +   MANSECTION Specify which sections of the manual to search (if set at all).


    +   MANWIDTH Specify the width at which man pages are displayed.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Commands


    MANPAGER Specify the paging program used to output man pages.


    LANG Specify the subdirectory where man first looks for entries.


    Example: To search for the manual page for the ls command:


    ```

    man ls

    ```


    Example: To search for all manual pages (not just the first one) on the mke2fs
    command and display using the less pager:


    ```

    man -a -P less mke2fs

    ```


    | -C config_file | Specify the configuration file used by man. Default is /etc/man.conf.
    |

    | -M path | Specify the list of directories to search for man pages. |

    | -P pager | Specify which program is used to present the output to the user.
    Default is /usr/bin/less-is. |

    | -S section_list | Specify a list of man sections to search (list delimited by
    columns). |

    | -a | Force man to display all man pages matching the name argument, not just
    the first. |

    | -c | Force man to reformat the source page, regardless of whether an up-to-date
    cat page exists. |

    | -d | Print debugging information instead of actual man pages. |

    | -D | Display and print debugging information. |

    | -f | Force man to behave as if it were whatis program. |

    | -h | Print a succinct help message. |

    | -k | Force man to behave as if it were the apropos program. |

    | -K | Force man to search for the specified string in all man pages. Painfully
    slow. |

    | -m system | Specify an alternate set of man pages to search based on the system
    name given. |'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Documentation


    +   -p string String is a sequence of preprocessors to be run before nroff or
    troff.


    +   -t Use /usr/bin/groff -Tps-mandoc to format the man page.


    +   -w or --path Instead of the man page, print the path of the man page that
    would be displayed.


    +   -W Like -w (above) but only prints file names one per line.


    # updateddb [options]


    Update the file database used by locate.


    Example: To update the database used by updateddb


    If you use locate, you should run this command nightly via cron.


    +   --localpaths=''path1 path2...'' Non-network directories to put in the-database.


    +   --netpaths=''path1 path2...'' Network (NFS, AFS, RFS, etc.) directories to
    put in the database. Default is none.


    +   --prunepaths=''path1 path2...'' Directories to not put in the database, which
    would otherwise be. Default is /tmp/usr/var/tmp/afs.


    +   --output=dbfile The database file to build. Default is system-dependent, but
    typically /usr/local/var/locateddb.


    +   --netuser=user The user to search network directories, using su(1). Default
    is daemon.


    +   --old-format Create the database in the old format instead of the new one.


    +   --version Print the version number of updateddb and exit.


    +   --help Print a summary of the options to updateddb and exit.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# whatis keyword ...


    Search the whatis database for keyword. The whatis database contains short descriptions
    of system commands. Note that in order to be usable, you must first run the /usr/sbin/makewhatis
    command.


    **Example:** To get a brief description of the cron command:


    ```

    whatis cron

    ```


    # whereis [-bamsu ] [ -BMS directory... -f ] filename ...


    Locate source files and applicable manual sections for the specified files.


    **Example:** To search for source files and manual selections for the /etc/hosts
    file:


    ```

    whereis /etc/hosts

    ```


    +   -b Search for binary files only.

    -m Search for the manual pages only.

    -s Search for source files only.

    -u Search for unusual entries. An unusual entry is a file in the current directory
    which has neither a binary, a man page, nor a source file associated with it.

    -B Specify where to look for binaries.

    -M Specify where to look for man pages.

    -S Specify where to look for source files.

    -f Used as a delimiter on the command line. Indicates that the directory list
    has has ended and the file list is about to begin.'
  merge: -1
