    This command is used to initialize terminals. It first decides what type of terminal
    you are using through one of three methods:


    +   1. Terminal type is specified on command line.

    2. If not, it checks the TERM environment variable.

    3. Uses the default type, "unknown".


    The command is somewhat interactive. For example, it prompts the user to confirm
    its guesswork regarding terminal type. Once it has settled on a terminal type,
    it uses that information to set a bewildering variety of display options (window
    size, erase character, interrupt...)


    Example: To display your terminal initialization shell commands to standard output:


    ```

    tset -s

    ```


