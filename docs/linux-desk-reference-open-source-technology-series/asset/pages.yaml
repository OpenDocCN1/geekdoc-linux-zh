  md: '# CHAPTER 12


    # PRINTERS & PRINT QUEUES


    # Introduction


    The print system in Linux is spread across several programs, devices, and configuration
    files.


    # The Print Process


    After it leaves your application, lpr takes the print job and precesses it according
    to any command-line options and/or printer specific configuration requirements.
    The resultant file and a paired file containing processing instructions are placed
    in a directory associated with the printer, called a spool directory or print
    queue (usually /var/spool/lpd/*). Print jobs stored in these directories are said
    to be spooled or queued. Multiple jobs may wait in these directories until the
    printer is ready to handle. Once the file is successfully spooled, lpr notifies
    the printer daemon, lpd, that there is a new job awaiting processing.


    The printer daemon filters the file according to the instructions left for by
    lpr and passes the output to an actual printer device, typically /dev/lp??. The
    printer daemon handles all information exchange with the printer hardware. It
    is possible to bypass the daemon and cat stuff directly to the printer device,
    but it''s not good form.


    In addition, you should be aware that lpd uses printer-specific parameters stored
    in /etc/printcap (a printer capabilities data-base, unlike termcap and terminfo
    in function) to translate the'
