  md: '# CHAPTER 5


    # DIRECTORIES


    # Introduction


    A **directory** is a special kind of file which is used to arrange other files
    into groups. For example, in writing this book I have created a directory **Linux**
    into which I''m placing the files associated with each chapter:


    ![](img/3ac9b27762bf6b1e48d880d6f0f96f8b_88_0.png)


    Figure 5-1 Sample Directory Tree'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'Directories are arranged under the root directory, "/", in a structure called
    the directory hierarchy or directory tree.


    The internal construction of directories is similar to that of files in many ways.
    Directories have owners and groups associated with them. They have permissions
    associated with their owner, group, and the rest of the world. (See the chmod
    command in the chapter on files for a bit more information about permissions).
    They have access times, modification times, and change times, all stored within
    the inode. The biggest difference between files and directories is that the inode
    of a file contains pointers to data blocks, the inode of a directory contains
    pointers to other files.


    Directories are pervasive, so there is a substantial collection of specialized
    jargon associated with them. Here are some of the highlights:


    | Abbreviation | Equivalent to | Example |

    | --- | --- | --- |

    | ~ | /home/shawkins | cd ~

    | ~linux | /home/shawkins/linux | cd ~/linux |


    current directory—Whenever you''re logged in, you have a current working directory,
    your current location in the directory tree. This is the output of the pwd command.
    When you enter the command ls -a, the current directory shows up with a filename
    of \.". The shell variable for your current directory is $PWD. To change your
    current directory, use the cd command.


    I get sick of typing pwd all the time, so I set up my bash prompt to display my
    current working directory. It works pretty well, except when I get more than 4
    or 5 levels deep in the directory tree. At that point the shell prompt starts
    cutting seriously into my typing space. If you''re interested in trying this out
    for yourself, add the following line to ~/.bashrc file:


    ```

    export PS1=''$PWD ''

    ```'
  merge: -1
  pgno: 89
