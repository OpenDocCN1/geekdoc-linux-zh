  md: "# ARCHIVING & \nCOMPRESSION\n21\n\n# Introduction\n\nThe commands in this section\
    \ deal with the compression, storage, and extraction of system files. Typically,\
    \ you'll want to compress and store at the same time—no need to take up 200M of\
    \ storage space when 100M will do.\n\nOne of the biggest differences between a\
    \ professional systems administrator and some schmmuck who knows a few commands\
    \ is that the systems administrator has a good backup strategy.\n\nA full backup\
    \ saves every file within some specified set. An incremental backup backs up only\
    \ those files which have been changed since previous backup. The idea behind making\
    \ incremental backups is that the bulk of the files on the system never change,\
    \ so it's unnecessarily expensive in terms of time and disk space to keep them\
    \ over and over. The downside is that you're mixing full & incremental backups-it's\
    \ more complicated to restore the system to its original state after a disaster.\n\
    \nOf the compression utilities listed here, the two most popular are probably\
    \ compress and gzip. Compress (Z file extension) used to go out with Unix distributions,\
    \ so you see it around a lot. Gzip (.gz file extension) is more efficient and\
    \ happens to have fewer license restrictions, so it's probably the best choice\
    \ for day-to-day work."
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Backup Levels


    The Unix world has adopted the concept of numeric backup levels to describe which
    files are being saved in a given backup.


    | Level | Meaning |

    |---|---|

    | 0 | Full backup of all files. |

    | 1 | Backup of all files modified since the last time a level 0 backup was performed.
    |

    | 2 | Backup of all files modified since the most recent level 1 backup. |


    **TIP** At some point in your life, your computer will crash and you will lose
    all the data on it. Whether this is a temporary inconvenience or the first step
    down the road to suicide is entirely dependent on your level of preparation. Right
    now, *this second*, you should think about what you have on your machine that
    you can''t afford to lose. Is it backed up? If not, go doing something about it.


    **TIP** Once you''ve settled on a backup strategy, you can automate most of it
    with **cron**. All you''ll have to do is switch out the tapes (or whatever) every
    so often.


    **TIP** Though it is technically possible to use the archiving commands in this
    section as a normal user, for the most part you''re going to be running them as
    root.


