  md: '# Commands


    93


    & Repeat the previous substitution.


    g Apply change over entire event line.


    # Shell Variables


    Technically, the variables including in this section include both shell variables
    and environments variables. Environment variables are a special subset of shell
    variables that are exported to all subprocesses of the shell (see the export command).


    By convention, shell variables are usually composed of ALL CAPITAL LETTERS, but
    you do see lowercase shell variables in bash from time to time.


    Shell variables are set with the equal sign (=). The syntax is variable=value.


    Example: To set the value of the HISTFILE variable (HISTFILE is the name of the
    file where your history commands are stored):


    ```

    HISTFILE=/home/shawkins/.bash_history

    ```


    You may also want to export the variable available to any subprocesses invoked
    by the shell.


    Example: To set and export the value of the HISTFILE variable:


    ```

    export HISTFILE=/home/shawkins/.bash_history

    ```


    The current values of shell variables can be displayed with env or echo:


    Example: To display the current values of all your environment variables, type:


    ```

    env

    ```


    To display the current value of a particular environment variable, type echo $<variable>.
    The $ tells the shell you''re referring to the value of the variable.


    Example: To display the current value of your CDPATH, type:


    ```

    echo $CDPATH

    ```


    Shell variables are built-in variables used by the shell for uh, various stuff.
    For example, the PATH variable is a list of directories, separated by a colon,
    which the shell searches for the executable program corresponding to the command
    you typed in the shell prompt.'
