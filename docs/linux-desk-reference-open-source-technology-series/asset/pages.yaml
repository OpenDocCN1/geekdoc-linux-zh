  md: 'In edit mode (reached command mode by typing one of the following a, i, A,
    I, o, O ...), whatever you type in will appear on the screen.


    In command mode, (reached from edit mode by pressing the <Esc> key), the various
    keys have a confusing variety of functions.


    Whatever mode you''re in is probably wrong. Try hitting the <Esc> key if that
    doesn''t work, try i for insert.


    Another very common mistake is leaving your caps lock on. Since upper-case and
    lowercase characters may have very different functions in command mode, you can
    mess up a file in a hurry by hitting that one key. After a while you get to where
    you recognize the symptoms, but when you''re just getting started it can be confusing—just
    something to keep in mind.


    # Line Ranges


    Many of the commands specified below can be applied to a range of lines rather
    than the whole file. To specify a line range:


    +   1. Get into command mode.


    +   2. Type a colon.


    +   3. Type a start line and an optional comma and stop line.


    The chapter is broken up into the following sections:


    Just Enough to Get By Quick start for beginners.


    Starting and Stopping vi What it sounds like.


    Position Within a File Scrolling and motion.


    Searching and Replacing Also includes pattern matching examples.


    Adding and Deleting Text Invoking edit mode, also deleting.


    Yanking and Putting Not unlike copy & paste.


    Shell Interaction Shell functions available in an edit session.'
