    The depmod and modprobe commands are used to manage a modular Linux kernel.


    The depmod.dep command is used to create a Makefile-esque dependency (modules.dep)
    file based on the symbols it finds in the set of modules mentioned in the command
    line. The resultant file can be used by modprobe to automatically load the relevant
    modules.


    Modprobe will load modules in one of two ways:'
