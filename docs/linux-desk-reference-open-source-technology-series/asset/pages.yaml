  md: '# nohup COMMAND [ARG]...


    Excente the specified command, ignoring the hangup signals (particularly those
    sent when you logged out). The idea is that the command will continue to run after
    you logout. Also, nohup increases the scheduling priority to 5, which means it
    will run a bit slower. Output is sent to nohup.out.


    Example: To start up a big program continuing to run even after you''re at home
    asleep:


    ```

    nohup big_program

    ```


