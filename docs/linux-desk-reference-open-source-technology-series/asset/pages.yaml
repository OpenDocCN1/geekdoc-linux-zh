    # Desk Reference The practical, handy desk reference for every Linux user!


    SCOTT HAWKINS


    Linux Desk Reference packs information about every Linux command, organized by
    task so you can find exactly what you''re looking for—even if you don''t know
    what it''s called! Unlike other Linux references, this one delivers practical
    examples for every command, plus hundreds of invaluable tips and warnings. And
    if you''re a Linux expert, you''ll love the "roadmap-style" alphabetical fast-find
    reference section!


