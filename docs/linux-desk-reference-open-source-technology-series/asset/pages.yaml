    # Commands


    ```

    ftp [-v] [-d] [-i] [-n] [-g] [host]

    ```


    The ftp command is used to transfer files between two network sites. It is an
    implementation of the Arpanet File Transfer Protocol. The command is interactive,
    the options listed below may be specified either on the command line or at the
    ftp prompt.


    Example: To transfer the file test.txt from the local host (odin) to the remote
    host (fenris):


    ```

    ftp fenris

    ftp> put test.txt

    ```


    To abort a file transfer, use the terminal interrupt key (Typically <Ctrl>-c)


    +   -v Verbose operation. Show all responses from the remote server.


    +   -n Do not attempt to log in automatically upon making initial connection.
    Without this option, ftp will check the user''s ~/.netrc file for information
    about the account on the remote machine and use that information to log in. If
    there is no entry in the ~/.netrc file for the current machine, ftp will prompt
    the user for login information as appropriate


    +   -i Disable interactive prompting when performing multiple file transfers.'
