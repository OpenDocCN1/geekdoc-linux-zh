  md: '# Objective 6


    # Read User Input


    One way to read user input is to use the command read. The read command takes
    a variable as an argument and stores the read input in the variable. The variable
    can then be used to process the user input.


    The following example reads user input into the variable with the name VARIABLE:


    ```

    read VARIABLE

    ```


    The script pauses at this point, waiting for user input, until the Enter key is
    pressed. To tell the user to enter something, you need to print (echo) a line
    with some information, such as the following:


    ```

    echo "Please enter a value for the variable:"

    read VARIABLE

    ```


    Now we are extending the Request Tracker and make it a bit more interactive. We
    are using read so that the user can enter a command after the open requests have
    been displayed.'
