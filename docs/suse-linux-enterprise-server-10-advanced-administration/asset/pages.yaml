  md: '# Objective 6


    # Describe Tomcat


    In the early days of the World Wide Web almost all web sites provided static content.
    This means that the content was stored in HTML files on a web server, and the
    pages were delivered “as they are” to a requesting browser.


    Today more and more web sites provide customized content, which is different for
    every viewer accessing the site. For example, content can be a webmail service
    or a customized portal page.


    These pages are generated on the fly when they are requested. The logic that generates
    the web pages is written in a programming language. Popular web programming languages
    are PHP, Perl, or Python.


    Programs that interact with the user by outputting HTML pages are called **web
    applications**. The servers they are running on are called **web application servers**.


    The Java programming language is also used for web applications. The advantages
    of Java, such as portability, performance, reusability, and crash protection make
    it the programming language of choice for larger and more complex web applications.


    The following terms are often used when speaking about applications written in
    Java:


    +   **Java servlets.** These are the actual web applications that are developed
    according to the Java servlet specifications.


    +   They are platform independent and can run on any platform providing a Java
    environment.


    +   **JSP** (Java Server Pages). This is an extension to the Java servlet specification,
    which allows developers to separate HTML and application code.


    By using special JSP tags in an HTML document, a developer can access functions
    in a Java servlet application.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'To run an application that is implemented as a Java servlet, you need a servlet
    container. The servlet container provides a framework that allows you to load
    and run Java servlets on your server.


    Tomcat is such a servlet container. It is developed by the Apache Foundation,
    which is also in charge of the Apache web server.


    The homepage of the Tomcat project can be found at


    http://jakarta.apache.org/tomcat/index.html


    SUSE Linux Enterprise Server 10 ships with Tomcat version 5.0.19, which implements
    servlets 2.4 und JSP 2.0 specifications. Like the hosted web applications, Tomcat
    itself is written in Java.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# # Objective 7 Install and Configure Tomcat


    To install and configure Tomcat on SUSE Linux Enterprise Server 10, you have to
    do the following:


    +   - Install the Tomcat Packages

    - Understand the File System Structure

    - Edit the server.xml File


    # ## Install the Tomcat Packages


    Tomcat is split into the following packages on SUSE Linux Enterprise Server 10:


    +   - tomcat5. This is the main package. It contains the core Tomcat components.

    - tomcat5-admin-webapps. This package contains Tomcats based based administration
    tools.

    - tomcat5-webapps. This package contains some web applications.


    To run Tomcat on your system, you should at least install the packages tomcat5
    and tomcat5-admin-webapps.


    After installation and configuration, you can start Tomcat by entering rctomcat5
    start


    To stop Tomcat, enter rctomcat5 stop


    Unlike other services, there is no reload option for Tomcat. Instead you can use
    the command rctomcat5 restart


    This is a combination of rctomcat5 stop and rctomcat5 start.'
  merge: -1
  pgno: 101
