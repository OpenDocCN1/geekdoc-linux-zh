- img_proc: true
  md: '# Enable the Extended Internet Daemon (xinetd)


    In this objective you learn how to enable the extended internet daemon (xinetd)
    by reviewing the following:


    +   - What xinetd Is

    - Configure xinetd with YaST

    - Manage xinetd Manually


    # What xinetd Is


    Services can either run standalone, meaning they listen on a port themselves,
    or they can be run via the “super daemon” xinetd. In this case, the super daemon
    acts as a mediator of connection requests for a series of services. It accepts
    the required service, and passes the request to the newly started process.


    If the connection between the client and the server is terminated, the server
    process started by xinetd is removed from memory.


    Starting services through xinetd has both advantages and disadvantages. The most
    significant advantage is saving resources (especially memory), since a server
    process is only started when it is needed. A disadvantage, however, is that a
    delay occurs while the required service is loaded, started, and connected.


    As a rule, you only want to use xinetd for services that are occasionally (not
    permanently) needed on the server. Some of the services traditionally by xinetd
    include Telnet and FTP.


    For detailed information about xinetd, enter man 8 xinetd.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_171_0.png)'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Configure xinetd with YaST


    To configure the services managed by xinetd, you can use the YaST Network Services
    (xinetd) module. Start the YaST Control Center and then select Network Services
    > Network Services (xinetd). Or open a terminal window, su - to root and then
    enter yast2 inetd.


    The YaST module to configure xinetd is called inetd. The reason for this is that
    in the past default server daemon on SUSE Linux was not, inetd.


    Enable the xinetd service daemon by selecting Enabling. This activates the Currently
    Available Services list. You can add, edit, or delete services in the list:


    Figure 4-1


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_172_0.png)


    Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'To manage the services available through xinetd (except for enabling

    services such as Telnet or FTP) requires a skill set beyond the objectives of

    this course. This is especially true of configuring services with **Edit**.


    Notice that some services are off (---), while others are not installed

    (NI).


    To configure a service select the service, then select **Toggle Status

    (On or Off)**.


    If a service is not installed it will be installed. The word “On"

    appears in the Status column. An “X” appears in the Changed (Ch)

    column to indicate that the service has been edited and will be

    changed in the system configuration.


    You can change the status of all installed services to on or off by

    selecting **Status for All Services > Activate All Services** or **Status

    for All Services > Deactivate All Services**.


    When you finish configuring the services, save the configuration

    setting and start the inited (or xinetd) daemon by selecting **Finish**.


    # Manage xinetd Manually


    To manage xinetd manually, you need to know how to do the

    following:


    +   - Start, Stop, and Restart xinetd

    - Configure xinetd

    - Configure Access Control

    - Configure Log Files'
