- img_proc: true
  md: '# Manage PureFTPd Logs


    PureFTPd sends its messages to the syslog daemon, so these messages appear in
    the usual log files.


    It is also possible for PureFTPd to write its own log files in various formats.
    The option for this is **-O formatlogfile**, where **format** can be **clf** (Common
    Log Format, a format similar to that used by the Apache web server), **stats**
    (special output format, designed for log analysis software), or **w3c** (special
    output format parsed by most commercial log analysers).


    Suitable entries already exist in the configuration file /etc/pure-ftpd/pure-ftpd.conf.
    However, you might need to remove the comment symbol (#) to activate the entry.


    The following is an example entry:


    | AltLog | clf:/var/log/pureftpd.log |'
