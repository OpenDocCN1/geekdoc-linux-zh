    However, a lot of data read from or written to the disk does not necessarily mean
    the disk is slow. Depending on the available disk types and the disk configuration,
    a disk load that totally blocks one system can be easily handled by another system.


    A performance problem that is caused by the disk subsystem usually occurs when
    a process has to wait for data being delivered from or written to the disk.


    You can use the command iostat to determine the average time a program has to
    wait for data from the disk.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_340_0.png)


    The iostat command is not part of the SUSE Linux Enterprise 10 default installation.
    You need to install the package sysstat to use.


    The following command displays information about the disk device /dev/hda:


    ```

    iostat -x 1 /dev/hda

    ```


    The option -x enables the output of some additional information. 1 sets the interval
    in the interval in which iostat repeats its output to 1 second. The device name
    specifies the disk that should be monitored. If no disk is specified on the command
    line, all disks that are used by the system are monitored.


