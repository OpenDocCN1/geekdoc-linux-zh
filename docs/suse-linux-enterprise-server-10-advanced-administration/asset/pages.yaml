  md: '# Use the test Command


    The test command exists both, as a built-in command and as an external command.
    It is used to compare values and to check for files and their properties (whether
    a file exists, whether it is an executable, and so on).


    If a test condition is true, test returns an exit status of 0; if the condition
    is not true, the exit status is 1. In shell scripts, ttest is mainly to declare
    conditions to influence the operation of loops, branches, and other statements.


    The following is the test syntax:


    test condition


    You can use the test command to do the following:


    +   - Test a file exists. Some of the available options are:


    Table 5-2

    | Option | Description |

    | - | - |

    | -e | File exists |

    | -f | File exists and is a regular file |

    | -d | File exists and is a directory |

    | -x | File exists and is an executable file |


    +   - Compare 2 files. Some of the available operators are:


    Table 5-3

    | Option | Description |

    | - | - |

    | -nt | Newer than |

    | -ot | Older than |

    | -ef | Refers to the same inode (such as a hard link) |'
  merge: -1
  pgno: 296
- img_proc: true
  md: '+   * Compare 2 integers. The available operators are:


    # Table 5-4


    | Option | Description |

    |---|---|

    | -eq | Equal |

    | -ne | Not equal |

    | -gt | Greater than |

    | -lt | Less than |

    | -ge | Greater than or equal |

    | -le | Less than or equal |


    +   * Test strings. The available operators are:


    # Table 5-5


    | Option | Description |

    |---|---|

    | test -z string | Exit status is 0 (true) if the string has zero length (is empty).
    |

    | test string | Exit status is 0 (true) if the string has nonzero length (consists
