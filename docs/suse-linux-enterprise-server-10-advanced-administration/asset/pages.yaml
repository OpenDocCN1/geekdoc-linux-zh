- img_proc: true
  md: 'The following interface naming schema is used in domain0:


    +   - peth. These are physical interfaces in domain0, peth devices connected to
    the network bridge.

    - vif. These are virtual interfaces which are part of the bridge. The name of
    a vif interface identifies to domain this interface is connected to. For example:
    vif6.0 is connected to the first virtual interface in domain 6.

    - veth. These virtual interfaces are connected to the vif interfaces of domain0
    (vif0.x). By default 7 vif <=> veth pairs are created. The veth interfaces can
    be used for more complex network setups.

    - eth0. The first veth interface is named eth0 and connected with vif0.0. This
    is the "default" network interface of domain0.

    - xenbr0. This is the default bridge that connects virtual and physical interfaces.


    The following illustration gives you an overview of the interfaces in domain0.


    Figure 1-11


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_55_0.png)'
  merge: -1
