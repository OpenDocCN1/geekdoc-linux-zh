  md: '# Objective 4 Automate System Tasks


    In order to make the administration of the SUSE Linux Enterprise Server 10 system
    as convenient as possible, certain task should be automated with shell scripts.


    Do the following:


    +   - On domain0, develop a shell script which can be used to start and stop the
    web server and the Samba server domains. The scripts should be easier to use as
    an xm command line and simply take the parameter start and stop.

    - Every call of the scripts should be documented by sending a mail to the root
    user. Note: This can be done with the command mail. See the manpage of mail for
    details.

    - First, develop a script for the web server domain. When this script works properly,
    make a copy and adjust it for the Samba domain.

    - Both scripts should be installed in the ~/bin directory of the root user.

    - On the Samba server, develop a script, that searches for Windows executables
    in the shared folder of the accounting department.

    - Use the command file to determine whether a file is windows executable or not.

    - When a file is detected as Windows executable, the file should be moved to a
    quarantine directory in roots home directory. Additionally, a mail should be sent
    to the root user for every executable found. The mail should include information
    about the filename and the location where the file was found.

    - On the web server domain, develop a backup script, that makes an incremental
    backup of the directory /srv/www/. Status information about the backup should
    be mailed to the root user when the backup has been completed.'
