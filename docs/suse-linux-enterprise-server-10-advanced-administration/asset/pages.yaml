- img_proc: true
  md: '# # The following is an example of ntptrace


    ```

    da10:~ # ntptrace

    localhost: stratum 3, offset 0.00723, synch distance 1.18225

    tick.east.ca: stratum 2, offset 1.601143, synch distance 0.06713

    tock.usask.ca: stratum 1, offset 1.712003, synch distance 0.00723, refid

    ''TRUE''

    ```


    The ntptrace output lists the client name, its stratum, its time offset from the
    local host, the synchronization distance, and the ID of the reference clock attached
    to a server, if one exists.


    The synchronization distance is a measure of clock accuracy, assuming that it
    has a correct time source.


    # Query the NTP Daemon Status


    To verify that the time server is working properly, you can enter ntpq -p. The
    command queries the status of the xtntpd daemon, and returns information similar
    to the following:


    | remote refid st t poll reach delay offset jitter |

    |---|---|---|---|---|---|---|---|---||

    | LOCAL(0) | LOCAL(0) | 10 | 1 | 15 | 64 | 1 | 0.000 | 0.000 | 0.008 |

    | *pt1.ptdb | .PTB. | 1 | u | 14 | 64 | 1 | 27.165 | 2.348 | 0.001 |

    | ntp2.ptdb | .PTB. | 1 | u | 13 | 64 | 1 | 26.159 | 0.726 | 0.001 |


    Displayed information includes the following:


    +   - **remote**. Hostname or IP address of the time server.

    - **refid**. Type of reference source (0.0.0.0 = unknown).

    - **st**. Stratum value for the server.

    - **when**. Number of seconds since the last poll.

    - **poll**. Number of seconds between two polls.

    - **reach**. Indicates if the time server was reached in the last poll attempt,
    reach begins with the value 0 when you start ntpd.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
