    In this section, you learn to analyze performance on a SUSE Linux Enterprise Server
    10 system and what you can do to prevent these bottlenecks.


    # Objectives


    +   1. Find Performance Bottlenecks

    2. Reduce System and Memory Load

    3. Optimize the Storage System

