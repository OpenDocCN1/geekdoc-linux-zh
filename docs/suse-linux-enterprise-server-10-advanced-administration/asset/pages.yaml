  md: '# Objective 4


    # Use Control Structures


    With the scripting techniques you have learned so far, you can only develop scripts
    that run sequentially from the beginning to the end.


    In this objective, you learn how to use control structures to make the execution
    of parts of your script dependent on certain conditions or to repeat script parts.


    In this objective we will cover the following:


    +   - Create Branches

    - Create Loops


    # Create Branches


    A branch in a script means that a part of your script is only executed under a
    certain condition. A very common control structure for this uses the **if** command:


    ```

    if condition

    then

    commands

    fi

    ```


    If a condition is true, then one or more commands are executed.


    The **if** statement can be extended with an optional **else** statement, as shown
    in the following example:


    ```

    if condition

    then

    command1

    else

    command2

    fi

    ```


    In this case command2 is executed when the if condition is not true.'
  merge: -1
  pgno: 254
