  md: '# Enable an FTP Server


    To enable an FTP server on SLES 10 you need to understand the following:


    +   - The Role of an FTP Server

    - How FTP Works

    - Advantages of PureFTPd Server

    - Install and Run PureFTPd Server

    - Configure PureFTPd Server


    # The Role of an FTP Server


    As the name indicates, the File Transfer Protocol (FTP) enables the transfer of
    files from one computer to another. Today, FTP is used mainly for file transfer
    over the Internet.


    The basic features supported by FTP and available to the user:


    +   - Sending, receiving, deleting, and renaming files

    - Creating, deleting, and changing directories

    - Transferring data in binary or ASCII mode


    An FTP server allows access after authentication against a password database.
    As a rule, these are the files /etc/password and /etc/shadow. Other authentication
    systems, such as NIS or LDAP, are possible.


    An FTP server as PureFTPd also supports authentication against its own password
    database, which is independent from the files /etc/password and /etc/shadow.


    In addition, guest access can be set up as anonymous FTP (aFTP). Generally, users
    logging in to aFTP use anonymous or ftp as their user name and their email address
    as the password.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'The address is normally not checked for correctness, although servers check
    the syntax and require an entry in the format user@hostname.domain. An anonymous
    user is normally given access to a restricted directory tree (a chroot environment).


    # How FTP Works


    The FTP protocol uses the TCP transport protocol. FTP uses two TCP connections
    between the client and the server, one for commands and the other for data.


    The first of these connections sends FTP commands from the client to the server.
    To begin an FTP session, the client addresses the FTP command channel on port
    21 of the server. The client sends its commands to the FTP server.


    For the actual file transfer, in response to certain commands like Is, FTP uses
    the second TCP connection, which is only created when a file is ready for transfer
    (for example, a GET or PUT command).


    There are 2 different types of data transfer:


    +   * Active data transfer. The FTP client offers the FTP server an unprivileged
    TCP port for the data channel connection. The server then initializes the data
    channel from its port 20 to the port offered by the client.


    Figure 4-2


    | client | server |

    | --- | --- |

    | high port | "use port 12345" | port 21 |

    | port 12345 | port 20 |


    +   * Passive data transfer. The FTP client informs the FTP server that it wants
    to use a passive data transfer using the PASV command.


