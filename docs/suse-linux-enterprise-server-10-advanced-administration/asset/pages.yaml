- img_proc: true
  md: '# Objective 4


    # Use Samba’s Client Tools


    Although the main purpose of Samba is to provide services for Windows clients,
    it also provides tools to access SMB shares from Linux. It doesn''t matter if
    these shares are provided by Samba or a native Windows server.


    You can perform 3 basic tasks with the Samba tools:


    +   - Use nmblookup


    +   - Use smbclient


    # Use nmblookup


    With the tool nmblookup, you can resolve NetBIOS names into IP addresses. In the
    following example, the IP address for the Samba server with the NetBIOS name Fileserver
    is looked up:


    # nmblookup Fileserver


    The output of the command looks like the following:


    ```

    querying Fileserver on 10.0.0.255

    10.0.0.1 Fileserver<00>

    ```


    In the first line, nmblookup states that it queries the IP address by a broadcast
    to the address 10.0.0.255. In the second line, it displays the result of the query,
    in this case, address 10.0.0.1 for the system with the NetBIOS name Fileserver.


    > If the system you are querying is not in the same subnet as yours, the name
    cannot be resolved with a broadcast query. Instead, nmblookup uses a WINS server
    to resolve the name.


    For more information, see the man page for nmblookup.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Use smclient


    With the smclient tool, you can access SMB shares on the network.

    It''s also a very useful tool to test a Samba server configuration.


    You can perform 3 basic tasks with smclient.


    +   - Browse Shares Provided by a Server

    - Access Files Provided by an SMB Server

    - Print on Printers Provided by an SMB Server

    - Mount SMB Shares into the Linux File System


    # Browse Shares Provided by a Server


    To display the shares offered by an SMB server, enter a command such as the following.


    ```

    smclient -L //Fileserver

    ```


    When smclient asks for a password, press Enter to proceed.


    The output of smclient looks like the following:


    | Domain=[DigitalAirlines] OS=[Unix] Server=[Samba 3.0.22-SUSE] |

    | Sharename Type Comment |

    | data Disk Data |

    | IPC$ IPC Service |

    | ADMIN$ IPC IPC Service |

    | Domain=[DigitalAirlines] OS=[Unix] Server=[Samba 3.0.22-SUSE] |

    | Server Comment |

    | ----- ----- |

    | Workgroup Master |

    | ----- ----- |

    | DigitalAirlines Fileserver |


    smclient first displays all available shares of the SMB server.

    Besides the shares you have configured in the smb.conf file, an

    SMB server always offers at least 2 other shares:


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 147
- img_proc: true
  md: '+   - IPC$. This share provides information about the other shares available
    on the SMB server.


    +   - ADMIN$. On a Windows computer this share points to the directory where Windows
    itself is installed. This can be useful for administrative tasks. When Samba tries
    to emulate a Windows server, it also offers this share. However, it is not needed
    to administer a Linux server.


    The lower part of the smbclient output gives you some information about the workgroup
    of the system.


    This command can also be very valuable for testing purposes. After you have set
    up a share, you can check the availability of the share with smbclient.


    Some shares are not browseable without authentication. In this case, you can pass
    a user name to smbclient, in the following:


    ```

    smbclient -L /Fileserver -U tux

    ```


    In the example, smbclient connects to the server with the user name tux and prompt
    for the corresponding password.


    # Access Files Provided by an SMB Server


    The command to access a share on a server is similar to the command used to browse
    for available shares, but instead of supplying the server name, the full path
    to the share needs to be supplied without the -L option.


    In the following example, smbclient connects to the share data on the server Fileserver:


    ```

    smbclient //Fileserver/data

    ```


    In this case, it is not necessary to supply a user name because the share data
    is configured with the guest ok = yes option. A user name can be supplied with
    the -U option.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'After smbclient has connected to a share, it displays the following prompt:


    ```

    Smb: \>

    ```


    smbclient can be used like a command-line FTP client. The most important commands
    are the following:


    +   - ls. Displays the content of the current directory.

    - cd. Changes to a directory.

    - get. Copies a file from the share to the current working directory.

    - put. Copies a file to the share. The share must be writable to use this command.


    # Print on Printers Provided by an SMB Server


    You can use smbclient to print on shared network printers. The basic syntax of
    a print command is the following:


    ```

    smbclient //Printserver/laser -c ''print letter.ps''

    ```


    In this example, the file.ps is printed on a network printer accessed through
    the share laser of the SMB server Printserver.


    You can also use the command print on the smbclient line after you have connected
    to the server. The -c option performs the given command automatically after the
    connection to the server has been established.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Exercise 3-3 Access the Share of the User Geeko with smclient


    In this exercise, you learn how to access a share with smclient.


    You can find this exercise in the workbook.


    (End of Exercise)'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Mount SMB Shares into the Linux File System


    Instead of accessing shared files with smbclient, you can mount a share into the
    file system like a hard disk partition or a CD-ROM drive.


    The basic mount command is shown in the following:


    ```

    mount -t cifs //Fileserver/data /mnt

    ```


    In this example, the share data of the SMB server Fileserver is mounted into the
    directory /mnt. The option -t cifs is necessary to specify that the resource to
    be mounted is an SMB share.


    If the share requires authentication, you can supply a username and password,
    as in the following:


    ```

    mount -t cifs -o username=tux,password=novell //Fileserver/data /mnt

    ```'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Exercise 3-4 Mount Geeko''s Share


    In this exercise, you mount a Samba share on a Linux system.


    You can find this exercise in the workbook.


    (End of Exercise)'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Objective 5 Use Samba as a Domain Controller


    Samba can be configured to act as Windows NT4 style domain controller.


    Before going through this section, note the following: To configure a domain controller
    with Samba, you need to have in-depth knowledge about the Windows domain concept
    and about Windows networking. This knowledge is out of the scope of this course.
    A very good collection of Samba Howtos and Examples can be found at: http://www.samba.org/docs/man/Samba-Guide/


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_153_0.png)


    To configure Samba as an NT4 style Primary Domain Controller, complete the following:


    +   * Understand a Domain Controller

    * Configure /etc/samba/smb.conf

    * Create Workstation Accounts


    # Understand a Domain Controller


    A domain controller is a system, that is used to manage the users for a group
    of networked computers. In the Windows terminology, a group is called a domain.


    The domain controller provides a user database, which is used to authenticate
    users when they login into one of the managed computers.


    Besides user authentication, the domain controller also provides information about
    network shares that a user is allowed to access and other user policies.


    Since Windows 2000, a domain controller is based on Microsoft''s Active Directory
    service. With the introduction of Active Directory, the communication protocols
    between domain controller and host changed.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'Samba can act as an NT4 Domain Controller. Windows 2000 and Windows Professional
    workstations are backward compatible with NT4 and can therefore be used with Samaba.
    However, in this case of the new Active Directory features are not available.


    # Configure /etc/samba/smb.conf


    The following is a basic Domain Controller configuration in smb.conf:


    ```

    [global]

    netbios name = da50

    workgroup = berlin

    security = user

    passdb backend = ldaps:///da2.digitalairirlines.com

    logon script = %.bat

    domain master = yes

    os level = 50

    local master = yes

    preferred master = yes

    domain logins = yes


    [netlogon]

    path = /netlogon

    ```


    The new options are described below:


    +   - passdb backend. Specifies in which kind of database the user and group information
    is stored.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'Enter one of the following:


    +   - smbpasswd

    - tdbsam (smbpasswd plus NT SAM)

    - idapsam


    If there is a backup domain controller (BDC) in your network, you have to select
    Idapsam here and to specify the LDAP server.


    The use of a non-LDAP backend SAM database is particularly problematic because
    domain members periodically change the machine trust account password. The new
    password is then stored only locally.


    +   - logon script. Specifies a windows batch script, that is executed on the
    client machine when a user logs in. The variable %U is replaced with the user
    name. In this configuration every user has an own login script. The scripts must
    be placed in the directory which is specified in the netlog share.


    +   - domain master. This option tells samba to be a domain controller.


    +   - local master. This option allows Samba to participate in the election of
    the local master browser.


    +   - os level. This integer value controls at what level Samba advertises itself
    for browse elections.


    You need a value of 32 (or higher) to become PDC.


    +   - preferred master. If this option is set, the nmbd will will force an election
    immediately.


    +   - domain logons. This option defines, whether other systems are allowed to
    join a domain. For a Domain Controller, this needs to be set to yes.


    Samba cannot act as Active Directory Server or Active Directory Primary Domain
    Controller.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Create Workstation Accounts


    For each Windows workstation which is going to be a member of a domain you need
    a workstation account on the Samba server. The workstation account is used to
    establish a trust relationship and a secure connection between Domain Controller
    and Client.


    To create local accounts for Windows NT workstations, use the command


    ```

    smbpasswd -a -m workstation

    ```


    Workstation accounts are created with a “$”” at the end of the name.


    There must be a user account on Linux with this name before you enter the command.


    See the example:


    ```

    da2:- # smbpasswd -a -m da50

    User da50 does not exist in system password file (usually /etc/passwd).

    Cannot add account without a valid local system user.

    Failed to modify password entry for user da2$

    da2:- # smbpasswd -a -m da51

    Added user da51$

    d22:2: # cat smbpasswd

    # Sample smbpasswd file.

    # To use this, set ''encrypt passwords = yes'' in the [global]-section

    # of /etc/samba/smb.conf

    kbailey:108DD098F35B3B2417306D272A9441BB:6478A025C56EBBC1CA6FDE37971:

    [U]:LCT-39CC96

    da50$:101:6AD9466E87D9AAD3B435B51404EE:F05822FA2A7B7166AF98CF16CFA5FFDF:

    [W]:LCT-39CB1383.

    ```'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Objective 6


    # Integrate Samba in a Windows Domain


    SUSE Linux Enterprise Server 10 comes with a new YaST module, which helps you
    to integrate a Linux system in a Workgroup, Windows NT Domain or Active Directory
    Domain.


    The support for Active Directory has been greatly improved in SUSE Linux Enterprise
    Server 10. The windbind daemon now supports up to date to authenticate against
    Active Directory.


    The module can be found in the YaST Control Center under Network Services > Windows
    Domain Membership.


    When you start the module, it looks like the following:


    # Figure 3-1


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_157_0.png)


    In the text field at the top of the dialog, you enter the name of the Domain or
    Workgroup you would like to add to the system. You can also browse for available
    workgroups or domains by selecting Browse.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'If you would like to use SMB information to authenticate Linux users, select
    the corresponding option. When activating this option, two check boxes become
    active.


    +   - Create Home Directory on Login. When you activate this option, a home directory
    is automatically created when a user logs in for the first time.


    +   - Offline Authentication. This options allows authentication even when a system
    is not connected to a domain controller anymore. This can be a very useful option
    for portable computers.


    After selecting Finish, you might be prompted for the Administration Credentials
    of the Domain Controller you are connecting to.


    The configuration is written to /etc/samba/smb.conf.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Objective 7 Configure Samba as Print Server


    Samba can be used as print server in a Windows network. This allows to share printers
    with other computers in the network.


    To print with Samba, your first have to install a working CUPS printing system
    on your Samba server and configure the connected native printers. This can be
    done with a YaST modul (see **Hardware > Printer** in the YaST Control Center).


    Before you start to configure the printer shares in Samba, you should test the
    CUPS installation by printing from a local native application (such as the Firefox
    browser).


    Once the CUPS system and the printers are configured, Samba can be used to share
    the CUPS printers with Windows workstations in the network.


    On Linux, the standard print format that applications produce PostScript. When
    a printer does not understand postscript directly, a printer driver in the CUPS
    system translates the data into the native format of the printer.


    Windows uses Metafile as its standard print format. When sharing printers with
    Samba, there are two ways how to convert this format into something a printer
    understands.


    +   - Preprocess on the Samba Server


    +   - Preprocess on the Windows Client'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Preprocess on the Samba Server


    The configuration depends on the number of printers you want to share.


    You have to determine whether to:


    +   - Share One Printer

    - Share Many Printers


    # Share One Printer


    If you want to provide only one printer for Windows, you can simply create a share.


    The commands to create a share looks like the following:


    ```

    [laserjet]

    printable = yes

    printer = lp_raw

    path = /var/tmp

    ```


    The option **printable = yes** tells Samba that this share is a printer share
    and not a shared directory.


    Use the option **printer** to specify which Linux printer queue be used via this
    share. If you want to preprocess on the client, enter the RAW queue here.


    The spool directory is specified by the option **path**. The directory must be
    writeable for all users that are allowed to print.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Figure 3-2


    Here, the print jobs are stored till they can be printed.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_161_0.png)


    If you have problems to configure the printer share, use the option print command
    = cp %s /tmp/out.ps

    The information that arrives at the Samba server will be written to the file /tmp/out.ps.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Share Many Printers


    If you want to install many printers on a Samba server being accessible from Windows,
    the method described above is not suitable.


    Several printers can be configured in the following way.


    Add the following lines in the [global] section if you use the CUPS printing system:


    ```

    printing = CUPS

    printcap name = CUPS

    ```


    Using the option **printing**, you can specify the printing system.


    The following values are valid:


    +   * AIX

    * BSD

    * CUPS

    * HPUX

    * LPRNG

    * PLP

