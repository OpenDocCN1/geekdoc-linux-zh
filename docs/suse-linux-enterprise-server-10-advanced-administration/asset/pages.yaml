  md: '# # Install and Run PureFTPd Server


    You can install the PureFTPd server with the YaST Software Management module by
    selecting the package pure-ftpd.


    After installation, you configure the FTP server by manually editing the configuration
    file /etc/pure-ftpd/pure-ftpd.conf.


    You can run PureFTPd server using one of the following methods:


    +   **From the command line.** To start PureFTPd from the command line, enter
    pure-ftpd options (such as pure-ftpd -B -e). If you start pure-ftpd this way,
    no configuration file is used.


    For details on the possible pure-ftpd options, enter man pure-ftpd.


    +   **From a start script.** To start PureFTPd, enter /etc/init.d/pure-ftpd start
    (or recure-pure-ftpd start). To stop the PureFTPd service, enter repure-pure-ftpd
    stop.


    The configuration file /etc/pure-ftpd/pure-ftpd.conf is parsed by the Perl script
    /usr/sbin/pure-config-args to translate the parameters in the configuration file
    to command-line options.


    These options are then passed to the daemon /usr/sbin/pure-ftpd.


    If you want pure-ftpd to be initialized upon startup, you need to set symbolic
    links by entering the following:


    ```

    inserv /etc/init.d/pure-ftpd

    ```


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_188_0.png)'
  merge: -1
