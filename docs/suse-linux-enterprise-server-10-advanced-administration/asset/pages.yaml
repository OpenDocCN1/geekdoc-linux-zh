  md: '# Configure PureFTPd Server


    To perform basic configuration tasks for PureFTPd server, you need

    to know the following:


    +   - Configure Anonymous FTP

    - Configure FTP with Virtual Hosts for Anonymous FTP

    - Configure FTP for Authorized Users

    - Configure FTP with Virtual Users not Included in /etc/passwd


    # Configure Anonymous FTP


    Configure anonymous FTP for PureFTPd, you need to have an

    user and home directory (such as /srv/ftp/) in the file

    /etc/passwd exists by default in SLES 10).


    However (unlike other FTP servers), you do not need to create any

    subdirectories (such as bin) in the home directory.


    The following is an example of a simple pure-ftpd.conf file:


    | Cage in every user his home directory |

    | ChrootEveryone | yes |

    | Don''t allow authenticated users - have a public anonymous FTP only. |

    | AnonymousOnly | yes |

    | Disallow anonymous users to upload new files (no = upload is allowed) |

    | AnonymousCantUpload | yes |


    In this configuration file, it is only possible to log in as an

    anonymous user, regardless of what user name is. It is not

    possible to change to a directory above /srv/ftp/, and no files are

    upload to the server—only downloads are possible.


    The equivalent command on the command line would be

    pure-ftfpd -A -e -i.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
