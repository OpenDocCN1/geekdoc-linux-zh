    /var/spool/mail/geeko | grep '#`\n```\n\nCheck the condition, the program **test**\
    \ is used. `test $inum -gt 10` checks if $inum is greater (-gt) 10. If this is\
    \ true, test returns the value 0 otherwise the value 1.\n\nAlmost all command\
    \ line tools have a return value.  means something like \"true\" or \"everything\
