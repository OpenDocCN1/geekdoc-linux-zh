  md: '# Objective 5


    # Install PHP


    PHP is a very popular programming language for web application. In this objective
    you learn how to install PHP on a SUSE Linux Enterprise Server 10. This includes:


    +   - Understand how PHP Works

    - Install PHP

    - Test the PHP Installation


    # Understand how PHP Works


    PHP is a scripting language. To install a PHP web application, the program files
    need to be copied into the document root of the web server. These files usually
    end in .php.


    The application can be started by accessing the PHP file with an ULR http://www.mydomain.com/application.php.
    The web server opens the PHP file, but instead of sending it directly to the browser,
    it is passed through the PHP interpreter first.


    The PHP interpreter runs the PHP code in the file and passes the output through
    the webserver to the browser. Therefore the user in front of the browser does
    not see the code of the PHP application but the output of it. The output is formatted
    in HTML so that it can be displayed by a browser.


    The PHP interpreter is realized as an Apache extension module. It is also possible
    to run PHP applications directly via CGI, but this is not covered in this course.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'The following is an overview of the PHP architecture:


    # Figure 2-6


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_95_0.png)


    # Install PHP


    On SUSE Linux Enterprise Server 10, the PHP components are split into multiple
    software packages. You need at least the following packages for a basic PHP web
    application server:


    +   - **PHP5.** The core PHP interpreter and libraries.

    - **apache2_mod_php** The PHP module for Apache.


    When you search for “php” in YaST’s software management module, you will notice
    that there are more php packages available (php-*). These modules extend the functionality
    of PHP. Which packages you need, depends on the requirements of the PHP application
    you would like to run.


    The PHP interpreter has some configuration options, which can be adjusted in the
    file `/etc/php5/apache2/php.ini`. The default configuration is fine for most purposes.
    The following are a few options:


    +   - **memory_limit.** This defines how much memory a script is allowed to use.
    For complex applications, this might need to be set to a higher value. Default
    is 8MB.

    - **max_execution_time.** This option sets the maximum execution time in seconds.
    Complex applications sometimes need a longer execution time. The default is 30
    seconds.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '+   **display_errors**, Determines whether errors or warning messages are displayed
    in the HTML output. For production systems, this option should be set to Off,
    while on a development system it is useful to switch it On. The default is Off.


    After installing PHP packages, you have to restart Apache with the command:


    ```

    rcapache2 restart

    ```


    # Test the PHP Installation


    A PHP installation can easily be tested by creating a file with the following
    content somewhere in the document root of the web server:


    ```

    <?php

    phpinfo();

    ?>

    ```


    The content is a simple php application. Calling the function **phpinfo()** outputs
