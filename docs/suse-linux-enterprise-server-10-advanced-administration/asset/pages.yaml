  md: '# Preprocess on the Windows Client


    If the print preprocessing is done by the clients, you must install the printer
    driver on each client manually.


    To do this you need the Windows Installation CD.


    It is better to store the available drivers on the Samba server so they will be
    accessible on the whole network.


    To do this, you first need a printer share in the file /etc/samba/smb.conf.


    The following is an example:


    ```

    [laserjet]

    printable = yes

    print command = lpr -Plp -I %s

    ```


    A special share labeled [print$] is also needed. Specify the path where the Windows
    drivers should be stored.


    This share should be writable only for the administrator and readable for all
    users.


    The [print$] share looks like the following:


    ```

    [print$]

    path=/var/lib/samba/drivers

    write list = root

    ```


    Now you can install the driver on your Windows client.


    If you select Add Printer in the printer configuration, the Add Printer Wizard
    will start.'
