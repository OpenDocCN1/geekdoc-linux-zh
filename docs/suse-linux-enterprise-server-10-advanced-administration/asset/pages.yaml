- img_proc: true
  md: '# Understand the File System Structure


    There are two configuration variables you always have to deal with when configuring
    Tomcat:


    +   - CATALINA_HOME. This variable points to the root directory of all directories
    and files that belong to a Tomcat installation.


    This is comparable to the ServerRoot directive of the Apache web server.


    All instances of Tomcat that run on the same system share one CATALINA_HOME directory.


    +   - CATALINA_BASE. This variable is used to run multiple instances of Tomcat
    on the same machine.


    In this case, every instance has its own CATALINA_BASE directory for configuration
    and log files.


    When you run only a single instance of Tomcat, CATALINA_HOME and CATALINA_BASE
    point to the same directory.


    This section covers only a single instance setup of Tomcat.


    CATALINA_HOME and CATALINA_BASE are passed to Tomcat by the startup scripts, which
    read the variables from the file /etc/sysconfig/j2ee.


    On SUSE Linux Enterprise Server 10, CATALINA_HOME points by default to /usr/share/tomcat5/
    and CATALINA_BASE points to /srv/www/tomcat5/base/.


    The following are the most important sub-directories in /usr/share/tomcat5/:


    +   - bin/. This directory contains scripts for administering the Tomcat server
    such as the start and stop scripts.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '+   **server/**. This directory contains the Tomcat server itself.

    It has subdirectories for the Java libraries that the Tomcat server needs to run
    and a subdirectory that includes web applications that can be used to administer
    Tomcat.


    +   **conf/**. This directory contains the configuration files of Tomcat.

    On SUSE Linux Enterprise Server 10, this is a link to `/etc/tomcat5/base/`.


    +   **logs/**. This directory contains Tomcat log files.

    On SUSE Linux Enterprise Server 10, this is a link to `/var/log/tomcat5/base/`.


    +   **webapps/**. This directory contains the web applications that are hosted
    by Tomcat.

    On SUSE Linux Enterprise Server 10, this is a link to `/sr/www/tomcat5/base/webapps/`.


    All paths including “base” belong to the default instance of Tomcat on SUSE Linux
    Enterprise Server 10.


    All directory paths not including “base” can be shared with other instances of
    Tomcat running on the same system when running multiple instances setup.


    # Edit the server.xml File


    The most important configuration file for every Tomcat instance is


    server.xml


    For the default instance, the file is located in


    /usr/share/tomcat5/conf/


    The configuration file is in XML format.'
  merge: -1
