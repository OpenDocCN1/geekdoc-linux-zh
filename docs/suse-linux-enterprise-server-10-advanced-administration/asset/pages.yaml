  md: '+   rmmod module. This command removes the indicated *module* from the kernel.
    However, it can only be removed if no processes are accessing hardware connected
    to it or corresponding services.


    We recommend that you use **modprobe -r** for removing modules.


    +   modprobe module. This command loads the *module* into the kernel or removes
    it (with option -r).


    Dependencies of other modules are taken into account when using modprobe. In addition,
    modprobe reads the file /etc/modprobe.conf for any configuration settings.


    This command can only be used if the file /lib/modules/version/modules.dep created
    by the command depmod exists. This file is used to add or remove dependencies.


    The kernel daemon (Kmod since kernel version 2.2.x) ensures that modules needed
    in the running operation are automatically loaded using modprobe (such as accessing
    the CD-ROM drive).


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_386_0.png)


    For more detailed information, enter **man modprobe.**


    +   depmod. This command creates the file /lib/modules/version/modules.dep. This
    file contains the dependencies of individual modules on each other.


    When a module is loaded (such as with modprobe), modules.dep ensures that all
    modules it depends on are also loaded.


    If the file modules.dep does not exist, it is created automatically when the system
    starts by the start script /etc/init.d/boot. For this reason, you do not need
    to create the file manually.


    On SUSE Linux Enterprise Server 10, depmod also creates the file modules.aliases,
    which is used by hwup and modprobe to determine which driver needs to be loaded
    for which device. Learn more about this in the hwup objective in this section.'
