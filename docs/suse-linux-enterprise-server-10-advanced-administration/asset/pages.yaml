  md: '# Objective 6


    # Describe how udev Works


    Before you can use a hardware device, you need to load the

    propriate driver module and set up the corresponding interface.

    For most devices in SUSE Linux Enterprise Server 10, this is done

    by udev.


    To get an overview about udev, do the following:


    +   - Understand the Purpose of udev


    +   - Understand how udev Works


    +   - Understand Persistent Interface Names


    # Understand the Purpose of udev


    udev has three main purposes:


    +   - Create device files. The most obvious task of udev is to create device files
    under /dev automatically when a device is connected to the system. Before, the
    /dev directory was populated with every device, that might appear in the system.
    This led to a very complex and confusing /dev directory, as most of the device
    files were actually not used.


    +   - Persistent device names. Another advantage of udev is that it provides a
    mechanism for persistent device names.


    +   - Hotplug replacement. In SUSE Linux Enterprise Server 10, udev also replaces
    the hotplug system, which was responsible for the initialization of hardware devices
    in previous versions. udev is now the central point for hardware initialization
    in SUSE Linux Enterprise Server 10.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# Understand how udev Works


    udev is implemented as a deamon (udevd), which is started at boot time through
    the script /etc/init.d/boot/S03boot.udev. udev communicates with the Linux kernel
    through the uevent interface. When the kernel sends out a uevent message that
    a device has been added or removed, udev does the following, based on the udev
    rules:


    +   - Initializes devices by calling hwup.

    - Creates device files in /dev.

    - Sets up network interfaces with ifup.

    - Renames network interfaces, if necessary.

    - Mounts storage devices which are identified as hotplug in /etc/fstab.

    - Informs other applications through HAL (Hardware Abstraction Layer) about the
    new device.


    To handle uevent messages, which have been issued before udev started, the udev
    start script triggers these events by parsing the sysfs filesystem. In previous
    SUSE Linux Enterprise Server versions, this part of the system initialisation
    was done by the coldplug script.


    Everything udev does, depends on rules, defined in configuration files under /etc/udev/rules.d/,
    which are used to process a uevent.


    A detailed description of udev rules is beyond the scope of this course. However,
    in the following you find the most important facts:


    +   - udev rules are spread over several files, which are processed in alphabetical
    order. Each line in these files is a rule. Comments can be added with the # character.

    - Each rule consists of multiple key value pairs. Example for a key value pair:
    kernel=="hda"'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'SUSE Linux Enterprise Server 10 Advanced Administration


    +   There are two different key types:

    - match keys. These keys are used to determine, if rule should be used to process
    an event.

    - assignment keys. These keys determine what to do if a rule is processed.


    There always has to be at least one match and one assignment key in rule.


    For every event, all rules are processed. Processing does not stop when a matching
    rule is found.

    nYou can monitor the activity of udev with the tool udevmonitor. When you start
    the tool and change the hardware configuration (e.g. plug or unplug an USB device)
    the udev activities are displayed on the screen. For more details, you can start
    the tool option --env.


    # Understand Persistent Interface Names


    The interface files in the directory /dev are created and assigned to the corresponding
    hardware device when the device is recognized and initialized by a driver. Therefore
    the assignment between interface file depends on:


    +   - The order in which device drivers are loaded.

    - The order in which devices are connected to a computer.


    This can lead to situations, where it''s not clear which device file is assigned
    to which device. Consider the following example:

    You have two USB devices, a digital camera and a flash card reader. Both devices
    are accessed as storage devices through the device /dev/sda, /dev/sdb ...nWhich
    device is assigned to which device file, usually depends on the order in which
    they are plugged in. The first devices gets sda and so on.


    8-18 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. Version 1 To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'udev can help to make this more predictable. With the help of sysfs, udev can
    find out, which device is connected to which interface file. The easiest solution
    for persistent device names would be to rename the interface files, for example
    from /dev/sda1 to /dev/camera.


    Unfortunately, interface files cannot be renamed under Linux. The only exception
    to this rule are network interfaces, which traditionally have no interface files
    under /dev.


    Therefore udev uses a different approach. Instead of renaming an interface file,
    a link with a unique and persistent name is created for the assigned interface
    file.


    By default udev is configured to create these links for all storage devices. For
    each device, a link is created in each of the following subdirectories under /dev/disk/


    +   - by-id. The name of the link is based on the vendor and on the name of a
    device.


    +   - by-path. The name of the link is based on the bus position of a device.


    +   - by-uuid. The name of the link is based on the serial number of a device.


    The udev rules which create these links are located in the file /etc/udev/rules.d/60-persistent-storage.rules.


    This means, that the association between devices and interface files still depends
    on the order in which the drivers are loaded or which order devices are connected
    with the system.


    With udev however, persistent links are created and adjusted everytime the device
    configuration changes.


    As mentioned before, network interfaces are treated differently. They don''t have
    interface files and they can be directly renamed by udev.


    Persistent network interfaces are configured as udev rule in the file /etc/udev/rules.d/30-net_persistent-names.rules'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Advanced Administration


    The following is an example rule:


    ```

    SUBSSTEM="net", ACTION="add", SYSFS{address}="00:30:05:4b:98:85",

    IMPORT="/sbin/rename_netiface %k eth0"

    ```


    The matching key SYSFS{address} is used to identify a network device by it’s MAC
    address. At the end of the rule, the name of the interface is given. In this example
    eth0.


    > In SUSE Linux Enterprise Server 9, it was possible to configure persistent network
    interface names in the interface configuration files under /etc/sysconfig/network.
    This is not supported anymore in SUSE Linux Enterprise Server 10. Interface names
    now have to be configured in the udev rule.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_397_0.png)'
