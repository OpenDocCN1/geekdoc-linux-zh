  md: '# Exercise Conventions


    When working through exercise, you will see conventions that indicate information
    you need to enter that is specific to your server.


    The following describes the most common conventions:


    +   *italicized/bolded text.* This is a reference to your unique situation, such
    as the host name of your server.


    For example, if the host name of your server is DA50, and you see the following


    ```

    hostname.digitalairlines.com

    ```


    you would enter


    ```

    DA50.digitalairlines.com

    ```


    +   *10.0.0.xx.* This is the IP address that is assigned to your SUSE Linux Enterprise
    Server 10.


    For example, if your IP address is 10.0.0.50, and you see the following


    ```

    10.0.0.xx

    ```


    you would enter


    ```

    10.0.0.50

    ```


    +   *Select.* The word *select* is used in exercise steps to indicate a variety
    of actions including clicking a button on the interface and selecting a menu item.


    +   *Enter and Type.* The words *enter* and *type* have distinct meanings.


    The word *enter* means to type text in a field or at a command line and press
    the Enter key when necessary. The word *type* means to type text without pressing
    the Enter key.


    If you are directed to type a value, make sure you do not press the Enter key
    or you might activate a process that you are not ready to start.'
