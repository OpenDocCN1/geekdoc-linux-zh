- img_proc: true
  md: '# Objective 4 Configure NFS (Network File System)


    Network File System (NFS) lets you configure an NFS file server that gives users
    transparent access to programs, files, or storage space on the server.


    To configure NFS for your network, you need to know the following:


    +   * Network File System Basics

    * How NFS Works

    * NFS Configuration Overview

    * Configure an NFS Server Manually

    * Configure an NFS Server with YaST

    * Export a Directory Temporarily

    * Configure NFS Client Access with YaST

    * Configure NFS Client Access from the Command Line

    * Monitor the NFS System


    # Network File System Basics


    NFS is designed for sharing files and directories over a network, and requires
    configuration of an NFS server (where the files and directories are located) and
    NFS clients (computers that access the files and directories remotely).


    File systems are exported by an NFS server, and appear and behave on an NFS client
    as if they were located on a local machine.


    For example, with NFS each user''s home directory can be exported by an NFS server
    and imported to a client, to the same home directories are accessible from every
    workstation on the network.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Directories like /home/, /opt/, /usr/ are good candidates for export via NFS.
    However, others, including /bin/, /boot/, /dev/, /etc/, /lib/, /root/, /sbin/,
    /tmp/, and /var/, should be available on the local disk only.


    Using NFS for home directories only makes sense with a central user management
    (for instance OpenLDAP).


    The following is an example of mounting the directory /home/ (exported by the
    NFS Server sun) on the computer earth:


    # Figure 4-7


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_220_0.png)


    A computer can be both an NFS server and an NFS client. It can supply file systems
    over the network (export) and mount file systems from other hosts (import).


    The NFS daemon is part of the kernel and only needs to be configured, activated.
    The start script is /init.d/nfsserver. The kernel NFS daemon includes file locking,
    which means that only 1 user at a time has access to files.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# How NFS Works


    NFS is a RPC (Remote Procedure Call) service. An essential component for RPC services
    is the portmapper that manages these services and needs to be started first. The
    portmap daemon is activated by default on SUSE Linux Enterprise Server 10.


    When an RPC service starts up, it binds to a port in the system (as any other
    network service), but also communicates with this port and the service offers
    (such as NFS) to the portmapper.


    Because every RPC program must be registered the time it is started, RPC programs
    must be restarted each time you restart the portmapper.


    The following lists the services required on an NFS server:


    | Service | Program (daemon) | Start Script |

    | --- | --- | --- |

    | Port mapper | /sbin/portmap | /etc/init.d/portmapper |

    | NFS server | /usr/sbin/rpc.nfs | /etc/init.d/nsserver |

    | | /usr/sbin/rpc.mountd | |


    /sbin/rpc.lockd program starts the NFS lock manager on kernels that don''t start
    automatically. In SUSE Linux Enterprise 10 the kernel does.


    You can use the command /etc/init.d/nsserver to start the NFS server. The script
    nsserver passes the list of exported directories to the kernel, and starts or
    stops the daemon rpc.mountd and, rpc.nfsd, the nfsd kernel threads.


    The mount daemon (/usr/sbin/rpc.mountd) accepts mount request and compares it
    with the entries in the configuration file /etc/exports. If access is allowed,
    the data is delivered to the client.


    Because rpc.nfsd can start several kernel threads, the start script interprets
    the variable USE_KERNEL_NFS_NUMBER in the file /etc/sysconfig/nfs. This variable
    determines the number of threads to start. By default, 4 server threads are started.'
  merge: -1
  pgno: 221
- img_proc: true
  md: "# NFS Configuration Overview\n\nAll configuration settings for the NFS server\
    \ are stored in the file /etc/exports Client-side configuration takes place using\
