  md: '# Objective 3 Configure Time on SUSE Linux Enterprise Server 10


    In order to implement a uniform time on all computers in a network, all computers
    must be able to access at least one time server so clocks will synchronize.


    There are two ways of synchronizing the time on a SUSE Linux Enterprise Server:
    netdate and NTP. To configure and synchronize the time, you need to understand
    the following:


    +   - Overview

    - Synchronize Time with netdate and hwclock

    - The Network Time Protocol (NTP)

    - Synchronize Time with NTP


    # Overview


    In order to configure and synchronize time on a SUSE Linux Enterprise Server,
    you need to understand the following fundamental concepts:


    +   - Hardware Clock and System Clock

    - GMT (UTC) and Local Time

    - Time Configuration Files'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Hardware Clock and System Clock


    There are two main clocks in a Linux system:


    +   - Hardware clock. This is a clock that runs independently of any control program
    running in the CPU. It even runs when you turn off the server.


    This clock is part of the ISA (Industry Standard Architecture) standard and is
    commonly called the hardware clock. It is also called the time clock, the RTC
    (Real Time Clock), the BIOS clock, or the CMOS (Complementary Metal-oxide Semiconductor)
    clock.


    The term hardware clock is used on Linux systems to indicate the time set by the
    hwclock utility.


    +   - System time. This is the time kept by a clock inside the Linux kernel and
    is driven by a timer interrupt (another ISA standard).


    System time is meaningful while Linux is running on the server. System time is
    the number of seconds 00:00:00 January 1, 1970 UTC (or the number of seconds since
    1969).


    On a Linux server, it''s the system time that is important. The hardware clock''s
    basic purpose is to keep time when Linux is not running.


    The system time is synchronized to the hardware clock when Linux first starts.
    After that, Linux only uses the system time.


    Once the system time is set on the Linux server, it''s important that you do not
    use commands as date to adjust the system time without considering the impact
    on applications and network connections.


    For a Linux server connected to the Internet (or equipped with a precision oscillator
    or radio clock), the best way to regulate the system clock is with ntpd.


    For a standalone or intermittently connected machine, you can use adjtim instead
    of at least correct system drift (man adjtim lists the options).'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'You can set the hardware clock (with a command such as hwclock) while the system
    is running. The next time you start Linux, it will synchronize with the adjusted
    time from the hardware clock.


    The Linux kernel maintains a concept of a local time zone for the system.


    Some programs and parts of the Linux kernel (such as file systems) use the kernel
    time zone value. An example is the vfat file system. If the kernel timezone value
    is wrong, the vfat file system reports and set the wrong time stamps on files.


    However, programs that care about the time zone (perhaps because they want to
    display a local time for you) almost always use a more traditional method of determining
    the timezone such as using the file /etc/localtime and the files in the directory
    /usr/share/zoneinfo/


    # GMT (UTC) and Local Time


    On startup, Linux reads the time from the computer''s local hardware (CMOS clock)
    and takes control of the time. The hardware clock can be set using one of the
    following:


    +   **UTC (Universal Time Coordinated).** This time is also referred to as GMT
    (Greenwich Mean Time). For this setting, the variable HWCLOCK in the file /etc/sysconfig/clock
    has the value **-u.**


    +   **Local time.** If the hardware clock is set to the local time, the variable
    HWCLOCK in the file /etc/sysconfig/clock has the value **--localtime.**


    Choosing GMT as the hardware time makes it easier to coordinate a large number
    of computers in different places (especially if the computers are located in different
    time zones.)'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Time Configuration Files


    The current time (system time) is calculated with the help of the variable TIMEZONE
    in the file /etc/sysconfig/clock, which also handles the required changes between
    daylight saving time and standard time.


    The following is an example of the settings in /etc/sysconfig/clock:


    ```

    HWCLOCK="--localtime"

    TIMEZONE="Europe/Berlin"

    DEFAULT_TIMEZONE="Europe/Berlin"

    ```


    By means of the variable TIMEZONE, the time configured on the local host (= system
    time) is set in the file /etc/localtime, a copy of the respective timezone file
    from /usr/share/zoneinfo/. The directory /usr/share/zoneinfo/ is a database of
    all time zones.


    > In SLES 9, there used to be a symbolic link /lib/zoneinfo/localtime pointing
    to /etc/localtime. This link does not exist anymore in SLES 10, even if it might
    still be mentioned in /etc/sysconfig/clock.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Synchronize Time with netdate and hwclock


    To synchronize time between network servers with netdate and hwclock, you need
    to know the following:


    +   * Use hwclock

    * Use netdate


    # Use hwclock


    hwclock is a tool for accessing the hardware clock. You can display the current
    time, set the hardware clock to a specified time, set the hardware clock to the
    system time, and set the system time from the hardware clock.


    You can also run hwclock periodically to insert or remove time from the hardware
    clock to compensate for systematic drift (where the clock consistently gains or
    loses time at a certain rate if to run).


    hwclock uses several methods to get and set hardware clock values. The normal
    way is to initialize an I/O process to the device special file /dev/rtc (RTC:
    Real Time Clock), which is maintained by the rtc driver.


    However, this method is not always available. The rtc driver is a relatively recent
    addition to Linux and is not available on older systems.


    On older systems, the method of accessing the hardware clock depends on the system
    hardware.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_201_0.png)


    For additional details on how the system accesses the hardware clock and other
    hwclock options, see man hwclock.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Some of the more commonly used options with hwclock include the following:


    # Table 4-3


    | Option | Description |

    | --- | --- |

    | -r or --show | This options displays the current time of the hardware clock.
    The time is always shown in local time, even if you keep your hardware clock set
    to UTC time. |

    | -w or --systohc | This option sets the hardware clock to the current system
    time. |

    | -s or --hctsys | This option sets the system time to the hardware clock time.
    the kernel''s timezone value to the local time zone as indicated by the TZ variable.
    |

    | -a or --adjust | This option adds or subtracts time from the hardware clock
    to account for system drift (enter hwclock for details). |

    | -v or --version | This option displays the version of hwclock. |

    | --set --date=newdate | This option sets the hardware clock to the date given
    by the --date option.


    For example:

    `hwclock --set --date="9/22/06 16:45:05"` |


    You can also view the hardware clock time by entering

    cat /proc/driver/rtc.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Use netdate


    To set up the system time once only, you can use the command netdate as follows:


    ```

    netdate timeserver1 timeserver2. . .

    ```


    where timeserver represents a time server on the network or on the Internet that
    offers the time service on UDP port 37.


    After querying the time servers, the netdate client compares their times with
    its own time.


    Time differences are then sorted into groups to determine which is the largest
    group of servers with an identical time (within certain limits). The first computer
    in the group is then used to update the time on the local server.


    To synchronize the time to a specific external time source, you enter netdate
    time_source, in the following:


    ```

    netdate ptbtime1.ptb

    ```


    In this case, the client queries the time server at the Physikalisch-Technische
    Bundesanstalt (PTB) in Braunschweig, Germany.


    You then need to set the hardware clock to the system clock time by entering hwclock
    --systohc or hwclock -w.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_203_0.png)


    The simplest way to implement time synchronization with netdate and hwclock is
    to use a script that is run regularly by cron.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# The Network Time Protocol (NTP)


    The disadvantage of using netdate is that it causes jumps of the system time into
    the past or the future compared to the current system time. NTP provides a means
    to avoid such jumps by slightly speeding or slowing system time, thus (within
    limits) keeping the time continuum of the system time while adjusting it.


    As the networking environment continues to expand to include mixed operating system
    environments, time synchronization is becoming more dependent on NTP.


    To configure NTP on SUSE Linux Enterprise Server, you need to understand the following:


    +   * The Network Time Protocol

    * Stratum

    * NTP Daemon (ntpd)

    * NTP Terms

    * How the NTP Daemon Works


    For more information on NTP, visit www.ntp.org.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# The Network Time Protocol


    NTP is an industry standard protocol that uses UDP on port 123 to communicate
    between time servers and time clients.


    An NTP server uses the NTP protocol to provide time information to other servers
    or workstations on the network.


    An NTP client is a computer that understands the Network Time Protocol and gets
    time information from an NTP server. A time client can also, in turn, act as a
    time server for other servers and client workstations on the network.


    Any computers on your network with Internet access can get time from NTP servers
    on the Internet, NTP synchronizes clocks to the UTC standard, the international
    time standard.


    NTP not only corrects the time, but it keeps track of consistent time variations
    and automatically adjusts for time drift on the client. It allows for less network
    traffic and it keeps the clocks more stable, even when the network is down.


    # Stratum


    NTP introduces the concept of a stratum. Stratum x is used as a designation of
    the location of the servers in NTP tree hierarchy.


    Stratum 1 is the first (highest) level in the hierarchy. It denotes servers that
    adjust their time by means of some external reference time source (such as a GPS
    (Global Positioning System), an atomic clock, or radio).


    Servers that synchronize their time to stratum 1 servers are denoted as stratum
    2, and those that use stratum 2 to synchronize their time are denoted as stratum
    3, and so on until you reach a stratum level of 16 (the maximum allowed).


    Differences between stratum 2 and stratum 1 servers are normally very small, and
    for the majority of users, unnoticeable.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Figure 4-4


    The following figure depicts the stratum hierarchy.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_206_0.png)


    Generally only one server in a network communicates with an external time provider.
    This reduces network traffic across geographical locations and minimizes traffic
    across routers and WANs.


    # NTP Daemon (ntpd)


    The NTP distribution in the package xntp includes ntpd, the NTP daemon. This daemon
    is used by both the time server and the time client to give and to obtain time,
    respectively.


    The ntpd process is designed to adjust time continuously, making the time adjustments
    very small.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'ntpd can also limit the drift of the system clock based on historicalndata,
    even when an external time server is unavailable.


    The ntpd process requires little resource overhead. This allows NTP to be easily
    deployed on servers hosting other services, even if the servers are heavily loaded.


    ntpd uses the following approaches to avoid sudden time changes:


    +   - ntpd regularly corrects the local computer clock on the basis of collected
    correction data.

    - ntpd continuously corrects the local time with the help of servers in the network.

    - ntpd enables the management of local reference clocks, such as radio-controlled
    clocks.


    # NTP Terms


    To configure and adjust NTP, you need to understand the following terms:


    +   - Drift. During operation, ntpd measures and corrects incidental frequency
    errors and writes the current value to a file under /var/lib/ntp/drift/

    - If you start and stop ntpd, the daemon initializes the frequency from this file.
    This helps prevent a potentially long interval to relearn the frequency error.

    - Jitter. This is the estimated time error of the peer clock (the delta between
    the client and server since the last poll.)


    # How the NTP Daemon Works


    After starting the NTP Daemon, it automatically synchronizes the system time with
    a time server on an ongoing basis. The correction takes place in small increments
    by expanding or compressing the system time (not abruptly) when ndate and hwclock
    are called.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'Transactions between the client and the server occur about once per minute,
    increasing gradually to once per 17 minutes under normal conditions. Poorly synchronized
    clients will poll more often than well-synchronized clients.


    The client uses the information it gets from the server or servers to calibrate
    its clock. This consists of the client determining how far its clock is off and
    adjusting its time to match that of the server.


    To allow clocks to quickly achieve high accuracy they avoid overshooting the time
    with large time adjustments, NTP uses a system where large adjustments occur quickly
    and small adjustments occur over time.


    For small time differences (less than 128 milliseconds), NTP uses a gradual adjustment.
    This is called *slewing*. For larger differences, the adjustment is immediate.
    This is called *stepping*.


    If the accuracy of a clock becomes too insufficient (off by more than 17 minutes),
    NTP aborts the NTP daemon, with the assumption that something has gone wrong with
    either the client or the server.


    Because NTP averages the results of several time exchanges in order to reduce
    the effects of variable latency, it might take several minutes for NTP to even
    reach consensus on what the average latency is.


    It often takes several adjustments (and several minutes) for NTP to reach synchronization.


    In the long run, NTP tries to decrease the amount of polling it does by making
    the clock on each system more accurate.


    Because of the algorithm that the NTP daemon runs, it is best to synchronize with
    multiple servers to help protect the client from an incorrect or downed server.
    In many environments, it is unlikely an NTP server failure will be noticed quickly.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# # Synchronize Time with NTP


    To synchronize network time with NTP, you need to know how to do the following:


    +   - Start ntpd From the Command Line

    - Adjust the Time With ntpdate

    - Configure the NTP Server (/etc/ntp.conf)

    - Trace the Time Source with ntptrace

    - Configure an NTP Client with YaST


    # ## Start ntpd From the Command Line


    In SUSE Linux Enterprise Server the time server daemon ntp is contained in the
    package xntp, which is installed by default. Its start script is /etc/init.d/ntp,
    and its central configuration file is /etc/ntp.conf.


    You can start the NTP daemon by entering `rcntp start`. You can check the status
    of ntp by entering `rcntp status`. To stop the NTP Daemon, use `rcntp stop`.


    The start script uses variables defined in `/etc/sysconfig/ntp`.


    To start NTP automatically when the system is booted, you need to set the symbolic
    links in the respective runlevel directories by entering `inserver ntp`.


    If any changes are made to the ntp.conf file, you need to restart ntpd in order
    to update the configuration using the command `rcntp restart`.


    After the /etc/ntp.conf file has been read by ntpd, the client sends a request
    to the server and the server sends back a time timestamped response, along with
    information about its accuracy and stratum.


    Once the NTP daemon is started, other computers can use it as time server.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Adjust the Time With nptdate


    If the difference between the system time and the time server is too big, the
    synchronization of the system time in small increments might take too long.


    To avoid this, the startscript /etc/init.d/ntp sets the system time using the
    program nptdate before nppd is started. In case you want to use nptdate manually,
    the syntax is:


    ```

    nptdate timeserver

    ```


    You need to stop the NTP daemon before updating the system time with nptdate.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Configure the NTP Server (/etc/ntp.conf)


    As soon as you start ntpd on a host, it serves as an NTP server and can be queried
    via NTP. You configure the NTP server by editing the configuration file /etc/ntp.conf.


    For example, you can configure one network host as a server that synchronizes
    the time with a time server on the Internet. The other network hosts can access
    this time server on the Intranet.


    First you need to make sure that the following entries exist in the file /etc/ntp.conf
    for the local clock, which is used if the time server is not available:


    ```

    server 127.127.1.0 # local clock (LCL)

    fudge 127.127.1.0 stratum 10 # LCL is unsynchronized

    ```


    The value after stratum indicates the distance of the atomic clock, showing how
    reliable the time server is.


    The value 1 means that the server is connected directly to the atomic clock and
    is very reliable. A server with value 2 gets the time from a server with the stratum
    value 1 and so on. A value of 16 indicates the server is very unreliable.


    The next entry in /etc/ntp.conf is for the time servers that are asked for the
    current time:


    ```

    ## Outside source of synchronized time

    server ptbtime1.ptb.de

    server ptbtime2.ptb.de

    ```


    There are 2 possible methods of synchronization between the time server and the
    client:


    +   * **Polling.** With polling, the client asks the server for the current time.


    Polling starts at 1 minute intervals. If the time interval is determined to be
    trustworthy, the interval is reset to one every 1024 seconds.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'You can set the minimum and maximum limits of the polling in /etc/ntp.conf,
    as in the following:


    ```

    server ptbtime1.ptb.de minpoll 4 maxpoll 12

    ```


    The minpoll and maxpoll values are interpreted as powers of 2 (in seconds). The
    default settings are 6 (2^6 = 64 seconds) and 10 (2^10 = 1024 seconds), respectively.
    Values between 4 and 17 are permitted.


    +   * **Broadcasting.** By means of broadcasting, the server sends the current
    time to all clients, and the clients receive the signal through the option broadcastclient
    in their ntpd.conf.


    In large networks, traffic caused by polling of the time can be significant. In
    this case, you might want to configure the time server to distribute time information
    by sending broadcast packets.


    To do this, you need to enter the following in /etc/ntp.conf on the server (where
    the IP address is the broadcast address used in the network):


    ```

    broadcast 10.0.0.255

    ```


    On the client:


    ```

    disable auth

    bbroadcastclient

    ```


    For reasons of security, broadcast-based synchronization should be used together
    with an authentication key so that the client only accepts information from trustworthy
    time servers. See the documentation under /usr/share/doc/packages/xntp-doc/(package
    xntp-doc).'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'You also need to include the name for the drift file and log file in /etc/ntp.conf,
    as in the following:


    ```

    driftfile /var/lib/ntp/drift/drift

    logfile /var/log/ntp

    ```


    The drift file contains information that describes how the hardware clock drifts.
    When the daemon ntp is started for the first time, the file does not exist. It
    takes about 15 minutes for the daemon to gather enough information to create the
    file.


    To have ntpd reread the configuration, enter rxntp restart.


    For time requests of other kinds (such as time servers for netdate) to be processed,
    the services must be made available by means of inetd or xinetd.


    For this reason, the prepared entries for daytime and time must be enabled for
    UDP and TCP in the configuration file of inetd or xinetd.'
  merge: -1
  pgno: 213
- img_proc: true
