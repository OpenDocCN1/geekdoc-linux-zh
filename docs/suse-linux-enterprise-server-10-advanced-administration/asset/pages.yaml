  md: 'The following is an example configuration in which no anonymous FTP access
    is allowed and where all users are limited to their home directory:


    ```

    # Cage in every user in his home directory

    ChrootEveryone yes

    ```


    ```

    # Disallow anonymous connections. Only allow authenticated users.

    NoAnonymous yes

    ```


    The equivalent command on the command line would be

    pure-ftpd -A -E.


    If you want to modify the above configuration so that certain users are not held
    in a chroot environment (for example, members of a group ftpdadmin with the GID
    500), you could enter the following:


    ```

    # Cage in every user in his home directory

    ChrootEveryone no

    ```


    ```

    # If the previous option is set to "no", members of the following group

    # won''t be caged. Others will be. If you don''t want chroot()ing anyone,

    # just comment ChrootEveryone and TrustedGID.

    TrustedGID 500

    ```


    ```

    # Disallow anonymous connections. Only allow authenticated users.

    NoAnonymous yes

    ```


    The equivalent command on the command line would be

    pure-ftpd -a 500 -E.


    # Configure FTP with Virtual Users not Included in /etc/passwd


    PureFTPD provides a way of administering FTP users in its own file, similar in
    structure to the file /etc/passwd.


    The advantages are that PureFTP users are separated from system users and can
    only access the system by FTP. A normal login is not possible if there are no
    matching entries in the file /etc/passwd.'
