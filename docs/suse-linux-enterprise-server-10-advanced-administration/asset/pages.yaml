- img_proc: true
  md: '# Start, Stop, and Restart xinetd


    To provide services through xinetd, you need to install and start the daemon on
    your SUSE Linux Enterprise Server. To have the daemon automatically activated
    at boot, enter inserv xinetd.


    xinetd is controlled by the script /etc/init.d/xinetd. /usr/bin/rcinetd is a link
    to this script. You can start and stop the daemon by entering rcinetd start or
    rcinetd stop. You can find out whether the daemon is activated or not by entering
    rcinetd status.


    Additionally, xinetd can be influenced by signals sent with kill killall. The
    following table lists some of the signals that can be used with xinetd.


    # Table 4-1


    | Signal | Number | Description |

    |---|---|---|

    | SIGUSR1 | 10 | Causes an internal state dump (the default dump file is /var/run/xinetd.dump).
    |

    | SIGQUIT | 3 | Causes xinetd termination. |

    | SIGTERM | 15 | Terminates all running services before terminating xinetd. |

    | SIGHUP | 1 | xinetd re-reads the configuration file and stops listening on ports
    of services that are no longer available and/or binds to ports now available according
    to the new configuration... |

    | SIGIO | 29 | Causes an internal consistency check to verify that the data structures
    used by the program have not been corrupted. |'
  merge: -1
  pgno: 174
- img_proc: true
  md: "# Configure xinetd\n\nThe configuration of xinetd is distributed across several\
    \ files.\n/etc/xinetd.conf lists general options, while files in /etc/xinetd.d/\n\
    contain the configuration of specific services provided via xinetd.\nThese files\
    \ are included into the xinetd configuration by an include\nstatement at the end\
    \ of /etc/xinetd.conf.\n\nTo configure /etc/xinetd, you need to know the following:\n\
    \n+   - The File /etc/xinetd.conf\n- The Directory /etc/xinetd.d/\n- chkconfig\n\
    - Internal Services\n\n# The File /etc/xinetd.conf\n\nIn SUSE Linux Enterprise\
    \ Server, the file /etc/xinetd.conf just\ncontains general options, no service\
    \ configurations. The following is\nthe syntax of /etc/xinetd.conf for the default\
    \ configuration\nparameters of xinetd:\n\n```\ndefaults\n{\n    key operator parameter\
    \ parameter. .\n}\n```\n\nOperators include =, -=, and +=. Most attributes (keys)\
    \ only support\nthe operator =, but you can include additional values to some\n\
    attributes by entering += or remove them by entering -=."
  merge: -1
  pgno: 175
- img_proc: true
  md: "The defaults entry in the configuration file is optional and allows to set\
    \ defaults such as the following:\n\n```\ndefaults {\n  log_type          = FILE\
    \ /var/log/xinetd.log\n  log_on_success    = HOST EXIT DURATION\n  log_on_failure\
    \    = HOST ATTTEMPT\n  only_from         = localhost\n  instances        = 30\n\
    \  cps               = 50 10\n}\nincludedir /etc/xinetd.d\n```\n\nThe configurations\
    \ for log_type and instances will be overwritten by something else has been defined\
    \ in the individual service entries. For all other, the default configurations\
    \ are combined with the values set in the services.\n\nThe log_type statement\
    \ can define whether (as in the example) the output is written directly to a log\
    \ file (/var/log/xinetd.log) or forwarded to the daemon syslog (such as **log_type\
    \ = SYSLOG authpriv**).\n\nIf there are high security demands, you might want\
    \ to consider leaving logging up to the syslog daemon in order to prevent potential\
    \ unwanted access to the xinetd log file.\n\nThe keys **log_on_success** and **log_on_failure**\
    \ configure what should be recorded in the log file, depending on whether the\
    \ connection to a network service succeeds or fails.\n\nThe key **instances**\
    \ can be used to limit the maximum number of daemons for each service, which protects\
    \ the machine from either intentional or accidental overload due to too many simultaneous\
    \ connections (denial-of-service attempts)."
  merge: -1
  pgno: 176
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10 Advanced Administration\n\ncps stands for\
    \ connections per second. The first value (50) is the maximum number of connections\
    \ per second that can be handled. the second value (10) is the wait period before\
    \ accepting new connections after the maximum has been exceeded (helpful in preventing\
    \ Denial of Service attacks).\n\nThe directive includedir /etc/xinetd.d prompts\
    \ xinetd to search all files in the directory /etc/xinetd.d/ for the configuration\
    \ of the services. The same attributes and the same syntax can be used as in /etc/xinetd.conf.\n\
    \n# The Directory /etc/xinetd.d/\n\nIn the directory /etc/xinetd.d/, there is\
    \ a separate configuration file for every service. The main advantage of splitting\
    \ the configuration in several files is improved transparency.\n\nThe syntax for\
    \ configuring network services in these files is similar to the one used for in\
    \ /etc/xinetd.conf above:\n\n```\nservice service_name\n{\n    key operator parameter\
    \ parameter. . .\n    key operator parameter parameter. . .\n}\n```\n\nThe following\
    \ is an example of the configuration of finger:\n\n```\n# default: off\n# description:\
    \ The finger server answers finger requests.\n# Finger is a protocol that allows\
    \ remote users to see\n# information such as login name and login time for\n#\
    \ currently logged in users.\nservice finger {\n    socket_type = stream\n   \
    \ protocol = tcp\n    wait = no\n    user = nobody\n    server = /usr/sbin/in.fingerd\n\
    \    server_args = -w\n    disable = yes\n}\n```\n\n# CNI USE ONLY-1 HARDCOPY\
    \ PERMITTED\n\nCopying all or part of this manual, or distributing such copies,\
    \ is strictly prohibited. To report suspected copying, please call 1-800-PIRATES.\n\
    \n4-8\n\nVersion 1"
  merge: -1
  pgno: 177
- img_proc: true
  md: '# The significance of the keywords in the example is as follows:


    | Keyword | Description |

    | --- | --- |

    | socket_type | Refers to the type of socket (stream, dgram, raw, or segpacket).
    |

    | protocol | Refers to the protocol (usually tcp or udp) used by the corresponding
    network service. The protocol must be listed in the file /etc/protocols. |

    | wait | Specifies whether inetd should wait for the daemon to release the port
    before it can process further connection requests for the same port (Yes: single-threaded)
    or not (No: multithreaded). |

    | user | Indicates under which user ID the daemon will start. The user name must
    be listed in the file /etc/passwd. |

    | server | Specifies the absolute path name of the daemon to start. |

    | server_args | Specifies which parameters to pass to the daemon when it starts.
    |

    | disable | If set to yes, the service is disabled. |


    > For a description of all possible parameters, enter man xinetd.conf.


    # Internal Services


    Certain services (such as echo, time, daytime, chargen, and discard) are provided
    by inetd itself without calling another program. These are called internal services
    and are labeled in the configuration as follows:


    ```

    type = INTERNAL

    ```'
  merge: -1
  pgno: 178
- img_proc: true
  md: "Without this line xinetd assumes that external services are involved.\nWith\
    \ services such as echo, which are both TCP and UDP-based\\services, you do not\
    \ specify the respective socket_type, but you also need to identify the service\
    \ in the id field in such a way that it is properly distinguished from other services.\n\
    \nThe following two examples show this for echo:\n\n```\n# /etc/xinetd.d/echo\n\
    # default: off\n# description: An echo server. This is the tcp version.\n\nservice\
    \ echo\n{\n    type = INTERNAL\n    id = echo-stream\n    socket_type = stream\n\
    \    protocol = tcp\n    user = root\n    wait = no\n    disabled = yes\n}\n```\n\
    \n```\n# /etc/xinetd.d/echo-udp\n# default: off\n# description: An echo server.\
    \ This is the udp version.\n\nservice echo\n{\n    type = INTERNAL UNLISTED\n\
    \    id = echo-dgram\n    socket_type = dgram\n    protocol = udp\n    user =\
    \ root\n    wait = yes\n    disabled = yes\n    port = 7\n}\n```"
  merge: -1
  pgno: 179
- img_proc: true
  md: "# chkconfig\n\nThe program chkconfig can be used to list services covered by\
    \ xinetd:\n\n```\ndalo0:- # chkconfig -l\n...\nxinetd based services:\n    chargen:\
    \         off\n    chargen-udp:    off\n    daytime:        on\n    daytime-udp:\
    \    on\n    echo:           off\n...\n```\n\nIt can also be used to turn services\
    \ on and off:\n\n```\ndalo0:- # chkconfig daytime\ndaytime xinetd\ndalo0:- # chkconfig\
    \ daytime off\ndalo0:- # chkconfig daytime\ndaytime off\n```\n\n# Configure Access\
    \ Control\n\nThe daemon xinetd recognizes four parameters used to control access\
    \ monitoring:\n\n+   - only_from. With this parameter, you define which hosts\
    \ can use this service. You can specify complete IP addresses from hosts or networks\
    \ or just the network or host names.\n\nYou can define this parameter in the defaults\
    \ section or in the service section.\n\n+   - no_access. With this parameter,\
    \ you define which hosts are excluded from access. You can specify complete IP\
    \ addresses from hosts or networks or just the network or host names.\n\nYou can\
    \ define this parameter in the defaults section or in the service section."
  merge: -1
  pgno: 180
- img_proc: true
  md: "# SUSE Linux Enterprise Server 10 Advanced Administration\n\n+   **access_time.**\
    \ You can use this parameter to define at which times the service is available\
    \ (in 24-hour format).\n\n+   **disabled.** You can use this parameter to completely\
    \ shut off a server. This also applies to logging access attempts.\n\nThe following\
    \ is an example for the attribute disabled:\n\n```\ndisabled = finger\n```\n\n\
    With this setting, the service finger is switched off completely. If a computer\
    \ tries to access the service, the attempt is not even logged.\n\nThe parameter\
    \ disabled can only be used in the defaults section. (Within a service section,\
    \ the corresponding parameter to use is **disabled.** Note the missing d at the\
    \ end!)\n\nThe following is an example for the Telnet service:\n\n```\n# default:\
    \ off\n# description: Telnet is the old login server which is\n# INSECURE and\
    \ should never be used. Use secure\n# shell (openssh If you need telnetd not to\n\
    # 'keep-alives' e.g. if it runs over an ISDN uplink,\n# add \"-n\". See 'man telnetd'\
    \ for more details.\ntelnet service {\n    socket_type = stream\n    protocol\
    \ = tcp\n    wait = no\n    user = root\n    server = /usr/sbin/in.telnetd\n \
    \   server_args = -n\n    only_from = 192.168.0.3 192.168.0.7\n    only_from =\
    \ + 192.168.0.10 192.168.0.12\n    only_from = 192.168.1.0/24\n    no_access =\
    \ 192.168.1.10\n    flags = IDONLY\n    access_times = 07:00-21:00\n    disabled\
    \ = yes\n}\n```\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED\n\nCopying all or part\
    \ of this manual, or distributing copies, is strictly prohibited. To report suspected\
    \ copying, please call 1-800-PIRATES.\n\n4-12\n\nVersion 1"
  merge: -1
  pgno: 181
- img_proc: true
  md: 'These settings result in the following:


    +   - Access is permitted for machines with the following IP addresses:


    192.168.0.3

    192.168.0.7

    192.168.0.10

    192.168.0.12

    192.168.1.0-255


    +   - Access is denied to the host with the IP address 192.168.1.10.

    - The service is available from 7:00 A.M. to 9:00 P.M.


    If you place high demands on access monitoring, you can tighten the security level
    even more by using the parameters INTERCEPT and IDONLY in the flags entry.


    If the parameter USERID was set in the log_on_access and log_on_failure entry,
    IDONLY then makes sure that a connection to the network service is permitted only
    when the user identification service (such as identd) of the host requesting the
    network service issues the user ID.


    If the parameter INTERCEPT has been entered as well, xinetd also attempts to make
    sure that an authorized host is on the other end of already existing connections—that
    the connection has not been intercepted.


    However, connection monitoring does not function with multithreaded or internal
    xinetd services. In addition, it puts a heavy burden on the network connection
    and the performance of the network service.


    # Configure Log Files


    Almost every hacker has to make several attempts and needs time before achieving
    success. To protect your server, you not only need hacker-resistant software,
    but you need log files that the system administrator can use to detect unauthorized
    login attempts.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Because of this, it does not make sense to only deter unauthorized access attempts.
    To maintain optimal system security, you need to record failed and unauthorized
    connection attempts.


    To shut off a service but still retain its logging functions, configure only_from
    without using any additional parameters (such as the following):


    ```

    only_from      =

    ```


    Logging through xinetd is controlled by the log_type statement along with the
    attributes log_on_success and log_on_failure.


    These let you record from which host and for how long an access attempt was made,
    and which user was using the service (if the remote host supports this feature).


    In addition, you can also log the circumstances of how and why the network service
    was used. However, even the best log does not mean much if you do not check it
    on a regular basis for failed connection attempts.'
  merge: -1
