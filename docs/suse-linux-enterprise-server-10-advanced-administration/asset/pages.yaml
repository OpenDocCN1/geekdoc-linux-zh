  md: '# Analyze Storage Performance


    The performance of the storage system can be an issue, especially on systems that
    face heavy hard disk utilization like ftp, web, or other kinds of file servers.


    Before you analyze the hard disk performance and utilization, you should make
    sure that you don''t have any problems with a too-high system load or a lack of
    physical memory.


    Systems with disk performance problems, usually show a low network and CPU utilization
    but a high activity of the installed disks, which is not caused by memory paging
    or swapping.


    In this case, you can use the command vmstat to display the activity of the disk
    subsystem. You start vmstat by entering the following:


    ```

    vmstat 1

    ```


    The program should be started on the system when the performance problem occurs.
    The following is the output of a system with almost no disk operations:


    | procs |--memory--|--swap--|io--|system--|

    | r b spwd free buff cache si so bi bo in cs us sy id wa |

    | 0 0 4 | 6728 34464 247444 | 0 0 447 42 1216 384 15 3 74 7 |

    | 0 0 4 | 6728 34464 247444 | 0 0 0 0 1186 222 1 98 0 |

    | 0 0 4 | 6760 34464 247444 | 0 0 0 0 1282 299 3 0 97 0 |

    | 0 0 4 | 6696 34532 247444 | 0 0 0 0 6819 147 1 1 97 1 |

    | 0 0 4 | 6696 34532 247444 | 0 0 0 0 1105 123 0 100 0 |

    | 0 0 4 | 6696 34532 247444 | 0 0 0 0 1117 131 0 100 0 |


    In this example, the columns of interest are **bi** and **bo**. They display the
    number of blocks that are read from (**bi**) or written to (**bo**) the disk subsystem.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
