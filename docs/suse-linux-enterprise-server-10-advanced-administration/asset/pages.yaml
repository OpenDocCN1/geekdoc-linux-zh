    +   5. Use Arithmetic Operators


    Shell scripts often use values assigned to variables for calculation. There are
    several ways to implement this.

    The Bash shell comes with built-in support for arithmetic operations, but there
    are some limitations to this.The arithmetic capabilities of Bash are limited in
    the following ways:

