  md: "# Objective 3 Limit Access to the Web Server\n\nNormally Apache delivers data\
    \ to all hosts in the network that can reach the web server. Sometimes it can\
    \ be useful to restrict access to the content delivered by Apache.\n\nThe following\
    \ are the most common methods used:\n\n+   - Limit Access on an IP Address Basis\n\
    - Limit Access with User Authentication\n\n# Limit Access on an IP Address Basis\n\
    \nApache offers the following directives to limit access to the web server on\
    \ an IP address basis:\n\n| Table 2-3 | Directive | Description |\n|---|---||\n\
    | allow | IP addresses or networks listed after this directive are allowed to\
    \ access the web server |\n| deny | IP addresses or networks listed after this\
    \ directive are not allowed to access the web server |\n| order | This directive\
    \ sets the order in which the allow and deny directives are evaluated |\n\nThese\
    \ directives must be used within a <Directory> block and control the access to\
    \ all data in that directory and subdirectories.\n\nThe following example allows\
    \ only hosts from the network 10.0.0/24 access to the data in the directory /srv/www/htdocs:\n\
    \n```\n<Directory \"/srv/www/htdocs\">\n  Order deny,allow\n  Deny from all\n\
    \  Allow from 10.0.0.0/24\n</Directory>\n```"
  merge: -1
  pgno: 80
- img_proc: true
  md: 'The following lists and describes the lines in the example:


    +   * **<Directory "srv/www/htdocs">**. This directive starts the directory block.
    The directives that follow apply to the directory /srv/www/htdocs only.


    +   * **Order deny,allow.** The Order directive determines in which order the
    allow and deny directives are evaluated.


    You have the following options:


    +   * **Deny,Allow.** The deny directives are evaluated before the allow directives.
    Access is allowed by default. Any client which does not match a deny directive
    or match an allow directive is allowed access to the server.


    +   * **Allow,Deny.** The allow directives are evaluated before the deny directives.
    Access is denied by default. Any client which does not match an allow directive
    or match a deny directive is denied access to the server.


    +   * **Mutual-failure.** Only those hosts that appear in the Allow list and not
    appear on the Deny list are granted access. This has the same effect as **Order
    Allow,Deny.


    +   * **Deny from all.** The deny directive is evaluated, and in this case access
    is denied for all clients. You can use the following options with the deny and
    the allow directives:


    +   * **all.** This option applies to all hosts.


    +   * **A (partial) domain-name.** This option applies to hosts which name match
    or end in the given expression (such as novell.com). Only complete domain components
    are matched. "novell.com" would match www.novell.com but not novell.com.


    +   * **A full IP address.** This option applies to a specific IP address (such
    as 10.0.0.23).


    +   * **A partial IP address.** This option applies to IP addresses starting with
    the given IP address fragment (such as 10.0.0).


    +   * **A network/netmask pair.** This option applies to IP addresses matching
    to the given network/netmask pair (such as 10.0.0.0/255.255.255.0).


    # CNI USE ONLY-1 HARDCOPY PERMITTED


    Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '+   - A network/nnn CIDR specification. This option applies to IP addresses
    matching to the given CIDR expression (such as 10.0.0/24).


    +   - Allow from 10.0.0/24. This allow directive is evaluated after the deny directive.
    In this case, the access is allowed for hosts in the network 10.0.0/24.


    +   - <Directory>. This directive ends the directory block.


    # Limit Access with User Authentication


    By limiting access to certain IP addresses, you can control the hosts that access
    the web server, but you have no control over the user that sits in front of the
    computer.


    Apache offers another option of access control basic authentication. If you protect
    your content on your web server with this method, users are required to log in
    before they can access the data.


    Before you can configure Apache to use basic authentication, you first have to
    create user accounts for the web server. You can do this by using the tool htpasswd2.


    The following command creates a password file and an account for the user tux.


    ```

    htpasswd2 -c /etc/apache2/htpasswd tux

    ```


    After entering this command, htpasswd2 prompts you for a password for the user
    you want to create. The passwords are stored in the file /etc/apache2/htpasswd.


    You can specify a different location for the password file, but you have to make
    sure that it is readable for the user wwwwww and that it is not located within
    the DocumentRoot of your server.


    When you use a password file for the first time, you have to call htpasswd2 with
    the -c option to create the file. If you want to add more users later, use the
    following command:'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# htpasswd2 /etc/apache2/htpasswd username


    To delete a user from the password file, use the following command:


    # htpasswd2 -D /etc/apache2/htpasswd username


    After you have created the user accounts, you need to configure Apache to prompt
    for a password when accessing restricted data. You need to add the following lines
    to the directory block of the directory that should be restricted:


    ```

    AuthType Basic

    AuthName "Restricted Files"

    AuthUserFile /etc/apache2/htpasswd

    Require user tux

    ```


    The following describes each line:


    +   **AuthType Basic.** This directive sets the authentication method. For the
    type described in this section, the value is Basic.

    - **AuthName “Restricted Files”.** With this, you have to choose a name for the
    restricted directory of your web server. This name is used for the authentication
    process between the browser and the web server.

    - **AuthUserFile /etc/apache2/htpasswd.** This directive sets the password file
    used for the restricted directory.

    - **Require user tux.** This directive lists the user from the password file who
    is allowed to access the directory. You can add more than one user by separating
    the user names with spaces, or you can use the following directive:

    - **Require valid-user** This defines that any valid username / password combination
    is granted access.


    The password is transferred in clear text over the network. For critical applications
    it''s recommended to configure SSL encryption. See next objective for details.'
  merge: -1
