    # Configure NFS Client Access from the Command Line


    To configure and mount NFS directories, you need to know how to do the following:


    +   - Import Directories Manually from an NFS Server


    +   - Mount NFS Directories Automatically


    # Import Directories Manually from an NFS Server


    You can import a directory manually from an NFS server using the command mount.
    The only prerequisite is an RPC port mapper, which you can start by entering (as
    root) the command reportmap start.


    The mount command automatically tries to recognize the file system (such as ext2,
    ext3, or ReiserFS). You can also use the mount option -t to indicate the file
    system type.


    In the following example, the file system type NFS is specified:


    ```

    mount -t nfs -o options host:/directory /mountpoint

    ```


    Instead of a device file, the name of the NFS server together with the directory
    to import is used within the mount command.'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'The following are the most important mount options (-o)used by NFS:


    +   - **soft (opposite: hard).** If the attempt to access the NFS server extends
    beyond the preset time frame (major timeout is 60 seconds), the mount attempt
    will be aborted.


    Otherwise, the client attempts to mount the exported directory until it receives
    feedback from the server that the attempt was successful.


    If a system tries to mount an NFS file system at boot time, this can cause the
    boot process to hang because the process will stop at this point when it attempts
    to mount the NFS directory.


    For directories that are not essential for the system to function, you can use
    the option soft. For directories that must be mounted (such as home directories),
    you can use the option hard.


    +   - **bg (default: fg).** If you use this option, and the first attempt is unsuccessful,
    all further attempts are run in the background.


    This prevents the boot process from hanging when NFS exports are automatically
    mounted, with attempts to mount the directories continuing in the background.


    +   - **rsize=n.** This option lets set the number of bytes (n) that NFS reads
    from the NFS server at one time.


    Because older NFS versions have a limitation of 1024 bytes, this is the default
    value. Current versions of NFS (Version 3 and 4) can process larger amounts of
    data.


    For quicker access, we recommend resetting the rsize to 8192.


    +   - **wsize=n.** This option lets set the number of bytes (n) that can be written
    to the NFS server.


    The default value is set to 1024. For faster write access, we recommend setting
    wsize to 8192.


    +   - **retry=n.** This option lets set the number of minutes (n) that an attempt
    can take to mount a directory through NFS. The value is 10000 minutes (approximately
    1 week).


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 230
- img_proc: true
  md: '+   - nosuid. This option lets you disable any interpretation of the SGID bits
    on the corresponding file system.


    For security reasons, always use this option for any file system that might be
    susceptible to tampering.


    If you do not use this option, there is a possibility that a user can obtain root
    access to the local file system by putting a SUID root executable on the imported
    file system.


    +   - nodev. This option lets you disable any interpretation of device files in
    the imported file system. We recommend that you use this option for security reasons.


    Without setting this option, someone could create a device such as /dev/hda on
    the NFS export, then use it to write permissions for the hard disk as soon as
    the file can be accessed from the client side.


    +   - exec (opposite: noexec). Permit or do not allow the execution of binaries
    on the mounted file system.


    You can use the command unmount to unmount a file system. However, you can only
    do this if the file system is currently being accessed.


    For additional information on nfs, mount options and on the file /etc/fstab, enter
    man 5 nfs, man 8 mount, or man 5 fstab.


    # Mount NFS Directories Automatically


    To mount directories automatically when booting (such as the home directories
    from a file server), you need to make corresponding entries in the file /etc/fstab.


    When the system is booted, the start script /etc/init.d/nfs loads the file /etc/fstab,
    which indicates which file systems are mounted and with which options.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'The following is an example of an entry for an NFS mountpoint

    the file /etc/fstab:


    ```

    da:/training/home /home nfs soft,rsize=8192,wsize=8192 0 0

    ```


    In this entry, the first value indicates the host name of the NFS

    server (da1) and the directory it exports (training/home).


    The second value indicates the mountpoint, which is the directory in

    the local file system where the exported directory should be\attached (/home/).


    The third value indicates the file system type (nfs). The

    comma-separated values following the file system type provide

    NFS-specific mounting options.


    At the end of the line, there are 2 numbers (0 0). The first indicates

    whether to back up the file system with the help of dump (first

    number) or not. The second number configures the file

    system is disabled (0), done on this file system only at a time

    (1), or parallelized when multiple disks are available on

    computer (2).


    In the example, the system does neither, as both options are set to 0.


    After modifying an entry of a currently mounted filesystem in

    the /etc/fstab, you can have the system read the changes by entering

    mount -a remount /mountpoint. To mount all file systems that are

    not currently mounted and do not contain the option noauto,

    mount -a. (noauto is used with devices that are not automatically

    mounted, like floppy disks.)


    You also need to activate the start script of the NFS client by

    entering inserv nfs (which sets the symbolic links in the respective

    level directories).


    # Monitor the NFS System


    Some tools are available to help you monitor the NFS system.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
