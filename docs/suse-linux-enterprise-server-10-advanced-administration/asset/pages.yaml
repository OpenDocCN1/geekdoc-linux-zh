- img_proc: true
  md: 'For this reason, you need to assign multiple IP addresses to your network card.
    In addition, you need to configure a service such as DNS that guarantees an IP
    address is matched correctly to a domain.


    Instead of using the command line or the file pure-fptd.conf, you configure a
    virtual host through the directory /etc/pure-fptd/hosts/. The configuration is
    a simple 2-step process:


    +   From the command line, use ip to create virtual network devices, in the following
    example:


    ip address add 10.0.0.80/24 brd + dev eth0

    ip address add 10.0.0.81/24 brd + dev eth0


    +   Create a symbolic link in /etc/pure-fptd/hosts/ with this IP address, which
    is linked to the directory with the files to offer anonymous FTP at this address.


    The following is an example:


    ```

    cd /etc/pure-fptd/hosts/

    ln -s /ftp/directory/of/ftp.slc.digitalairlines.com 10.0.0.80

    ln -s /ftp/directory/of/ftp.muc.digitalairlines.com 10.0.0.81

    ```


    To prevent these areas from being filled with undesired files, start PureFPTd
    with the option -i. This makes it impossible for anonymous users to upload files.


    Virtual FTP servers only handle anonymous FTP users and not authorized users.


    # Configure FTP for Authorized Users


    Configuring an FTP server for authorized users is important for those who are
    hosting web sites. Individual customers maintain their own pages in directories
    to which they alone have access.'
