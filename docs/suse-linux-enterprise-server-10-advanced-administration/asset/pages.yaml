  md: '# Objective 8


    # Install Web Applications


    Web applications that are developed in Java are usually distributed in WAR files.


    WAR stands for WebARchive, and the corresponding files end in .war


    WAR files are compressed archives similar to zip archives.


    The content must conform to the following structure:


    +   - The static HTML files and JSPs are stored in the top level directory.

    - The servlet and related Java technology class files must be stored in the WEB-INF/classes
    directory.

    - Any auxiliary library JAR files must be stored in the WEB-INF/lib directory.

    - The deployment descriptor is stored as a file named web.xml in the WEB-INF directory.


    The web.xml file in the WEB-INF directory is also called Deployment Descriptor.
    It contains information about how an application should be deployed into the Tomcat
    environment. The file can also contain settings and start parameters for the web
    application.


    If you are not sure how to configure a certain option of a web application, look
    at the web.xml file.


    The easiest way to install an application is to use the auto deploy feature of
    Tomcat. This means that you just copy the .war file of the application in the
    /webApps directory of the virtual host that you want to use.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'By restarting Tomcat, the WAR archive is automatically unpacked and the application
    is deployed. By default, you can access the application under the path name of
    the application directory.


    Auto deploy requires the auto deploy feature to be switched on for the specified
    virtual host. This can be done in the host element of the Tomcat server.xml file.
    If you don''t configure auto deploy at all, it''s switched on by default.'
