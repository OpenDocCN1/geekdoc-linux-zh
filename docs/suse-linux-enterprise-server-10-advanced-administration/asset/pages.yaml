  md: '# Objective 5


    # Describe the sysfs File System


    sysfs is a virtual file system that is mounted under /sys. In a virtual file system,
    there is no physical device that holds the information. Instead, the file system
    is generated virtually by the kernel.


    The directory and file structure under /sys, provides information about the hardware
    which is currently connected with a system. Under /sys, there are 4 main directories:


    +   * /sys/bus and /sys/devices. These directories contain different representations
    of system hardware. Devices are represented here.


    For example, the following represents a digital camera connected to the USB bus:


    ```

    /sys/bus/usb/devices/1-1/

    ```


    This directory contains several files that provide information about the device.
    The following is a listing of the files in this directory:


    | 1-1:1.0 | bMaxPower manufacturer |

    | bcdDevice | bNumConfigurations maxchild |

    | bConfigurationValue | bNumInterfaces power |

    | bDeviceClass | detach_state product |

    | bDeviceProtocol | devnum serial |

    | bDeviceSubClass | idProduct speed |

    | bmAttributes | idVendor version |


    For example, by reading the content from the manufacturer file, you can determine
    the manufacturer of the device:


    ```

    cat manufacturer

    OLYMPUS

    ```


    In this case, an Olympus digital camera is connected with the system.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '+   - sys/class and /sys/block. The interfaces of the devices are represented
    under these 2 directories.


    For example, the interface belonging to the Olympus digital camera is represented
    by the following directory:


    # /sys/block/sda/


    The directory named /sda is the digital camera accessed like a SCSI hard disk.


    The following is the content of the /sda directory:


    | dev queue removable size |

    | device range sda1 stat |


    The subdirectory /sda1 represents the interface to the first partition on the
    cameras memory card. For example, reading the content of /sda1/size, you can determine
    the size of the partition:


    ```

    cat sda1/size

    31959

    ```


    The partition has a size of 31959 512-byte blocks, which is about 16 MB.


    To connect an interface with a device, file system links are used. In the Olympus
    digital camera example, a link exists from the file /sys/block/sda/device to the
    corresponding device:


    ```

    11 device

    lrwxrwxr-x 1 root 0 Aug 17 14:03 device ->

    ../devices/pci0000:00/0000:1d.0/usb1-1/1-1:1.0/host

    t0/t0:0:0

    ```


    In this way, all interfaces of the system are linked with their corresponding
    devices.


    Besides the representation in sysfs, there are also the device files in the /dev
    directory.'
  merge: -1
