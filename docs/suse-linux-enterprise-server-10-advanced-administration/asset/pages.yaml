  md: '# Objective 5


    # Manage Xen Domains at the Command Line


    In the following you learn how to manage Xen domains at the command line. This
    includes:


    +   - Understand a Domain Configuration File

    - Use the xm Tool

    - Migrate a Guest Domain


    # Understand a Domain Configuration File


    Every Xen domain needs a configuration file. For domains which have been created
    with YaST, the configuration file is usually located in /etc/xen/vm/.


    Under /etc/xen/examples/, you find two example files, which can be used if you
    would like to create a configuration from scratch.


    +   - xmexample1. This is a template configuration file for a single domain.

    - xmexample2. This is an example for multiple domain configurations in one file.


    For the beginning, xmexample1 is a better choice.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'A configuration file contains several keywords which configure different aspects
    of a Xen domain. The following is an example configuration file using the most
    common options. The # character is used for comments. Please read the comments
    in the example for details about the configuration options.


    ```

    # Unique name of the domain

    name = "SLES10-WebServer"


    # The following lines point to the kernel and initrd file

    # on the filesystem of the domain. The filesystem itself is

    # defined later:

    kernel = "/boot/vmlin-Xen"

    ramdisk = "/boot/initrd-Xen"


    # The amount of memory that is initatly assigned to the

    # domain. This can be changed at runtime.

    memory = 256


    # The next line defines some details about the network

    # configuration. When left blank, defaults are used,

    # which work fine in most cases.

    vif = [ '' '' ]


    # This defines the disc of the domain. "phy" means that the

    # physical device /dev/hda is mapped to the virtual device

    # /dev/hda in the domain. "w" indicates, that the disc is

    # writable:

    disk = [ ''phy:hda1,hda1,w'' ]


    # The following is an example for a file based filesystem

    # In this case the "file: keyword is used.

    disk = [ ''file:/data/vm/SLES10-disc.img,hda1,w'' ]

    ```


    A good source for detailed documentation and howtos about Xen and the domain configuration
    files is the Xen wiki at:

    http://wiki.xensource.com/xenwiki/


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_44_0.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Use the xm Tool


    **xm** is the administration tool for Xen domains. xm communicates with the **xend**
    management process running on the domain0 Linux installation.


    The following is the general format of a xm command line:


    ```

    xm command [options] [arguments] [variables]

    ```


    You can get a complete list of the most common xm commands by entering **xm help**.
    A complete list can be viewed with **xm help --long**. It is also possible to
    display specific information about a certain command with **xm help [command_name]***


    To start a virtual machine, the **create** command is used:


    ```

    xm create -c -f /data/xen/SLES10-WebServer.conf

    ```


    **The -c** option lets xm connect to the terminal of the started domain, so that
    you can interact with the system. To disconnect from the terminal and return to
    the original command line, enter the key combination **Ctrl-].


    **The -f** option specifies the configuration file of the domain that should be
    started.


    The command **list** displays information about the currently running Xen domains:


    ```

    xm list

    ```


    The output of the list command contains the following fields:


    +   - **name**. The name of the domain as specified in the configuration file.


    +   - **domid**. A numeric, consecutive domain ID, which is automatically assigned
    when the domain starts.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '+   **memory.** The amount of memory assigned to the domain.


    +   **vcpus.** The number of virtual CPUs utilized by this domain.


    +   **state.** The current state of the domain. This could be:


    +   r. The domain is running.


    +   b. The domain has been created, but is currently blocked. This can happen,
    when a domain is waiting for I/O or when there is nothing to do for domain.


    +   p. The domain is paused. The state of the domain is saved and can be restored.


    +   s. The domain is in the process of being shutdown.


    +   c. The domain is crashed, due to an error or misconfiguration.


    An alternative to list is the command **top**, which displays domain information
    updated in realtime.


    The **console** command connects you with the terminal of a running domain:


    ```

    xm console <domain_id>

    ```


    The command takes the domain id as a parameter, which can be determined with the
    **list** command (field domid). Before, use the key combination **Ctrl-** to disconnect
    from a terminal.


    With the **pause** command you can interrupt the execution of a domain temporarily:


    ```

    xm pause <domain_id>

    ```


    A paused domain is not completely shut down. The current state is saved and the
    execution of the domain can be continued with the **unpause** command:


    ```

    xm pause <domain_id>

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'To shutdown a domain, use the shutdown command:


    ```

    xm shutdown <domain_id>

    ```


    In case the domain is not responding anymore, you can force the shutdown of the
    domain with the destroy command:


    ```

    xm destroy <domain_id>

    ```


    To save the state of a domain for a longer time (eg. over a reboot of domain(0)
    you can use the save command:


    ```

    xm save <domain_id> <filename>

    ```


    The domain can be restored from the resulting file with the restore command:


    ```

    xm restore <filename>

    ```


    Another commonly used command is mem-set, which allows you to change the memory
    allocation of a domain:


    ```

    xm mem_set <domain_id> <amount_of_memory>

    ```


    The amount of memory is specified in megabytes.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_47_0.png)


    Instead of the domain ID <domain_id>, you can also use the domain name in all
    xm commands.'
  merge: -1
