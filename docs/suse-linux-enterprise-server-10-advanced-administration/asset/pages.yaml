- img_proc: true
  md: 'To administer PureFTPd users in a separate user database, you need to create
    a system user with whose UID the FTP users appear in the system:


    useradd -m ftpusers


    Once this is done, you can then create the FTP users with pure-pw (in the file
    /etc/pureftpd/pureftpd.passwd) by entering the following (using user joe as an
    example):


    pure-pw user joe -u ftpusers -d /home/ftpusers/joe


    You are requested to enter a password (twice) for the:


    With the help of command line options, you can specify user options as quotas
    for the number of files (-n 100), size limits in MB (-N 10), or the times users
    can log in (-z 0900-1800).


    PureFTPd does not use the ASCII file /etc/pure-ftpd/pureftpd.passwd, but the binary
    file /etc/pure-ftpd/pureftpd.pdb. This file must be regenerated every time changes
    are made by entering pure-pw mkdb.


    To access the special user database, you need to start PureFTPd with -j to ensure
    that the home directory is created as soon as the user logs in and, and after
    the -l option, the password database file.


    The following is an example:


    pure-ftpd -j -l puredb:etc/purepd.pdb


    You can modify FTP users by entering pure-pw usermod and delete users by entering
    pure-pw userdel.


    For additional details on using the pure-pw syntax, enter man 8 pure-pw or pure-pw
    --help.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_194_0.png)'
