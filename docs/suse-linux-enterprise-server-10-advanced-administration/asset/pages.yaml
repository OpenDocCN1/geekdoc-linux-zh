  md: '# Objective 3


    # Understand the GNU Build Tool Chain


    In most cases programs use more than one source code file. In order to structure
    the source, developers tend to spread the code over multiple files.


    It would be difficult to compile a program with multiple source code files manually
    on the command line. Fortunately some tools are available to manage the compilation
    process.


    In this objective, you learn how to do the following to perform a standard build
    process:


    +   - Use configure to Prepare the Build Process

    - Use make to Compile the Source Code

    - Use make install to Install the Compiled Program

    - Install the Required Packages for a Build Environment


    # Use configure to Prepare the Build Process


    Before the actual compilation process can be started, you must prepare the source
    code with a configure script. This needs to be done for the following reasons:


    +   - Many applications can be compiled on different UNIX systems, Linux distributions,
    and hardware platforms. To make this possible, the build process needs to be prepared
    for the actual environment.

    - The build process itself is controlled by a program called make. The instructions
    for how to compile the different source files are read from Makefiles. The configure
    script generates Makefiles depending on the system environment.

    - You can use configure to enable or disable certain features of an application.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'To run the configure script, you need to use the following command

    at the top of the source directory:


    ```

    /configure

    ```


    To enable or disable certain features of an application, configure takes additional
    arguments. The available arguments depend on the application that will be compiled.


    You can use the following command to list all available configure options:


    ```

    /configure --help

    ```


    # Use make to Compile the Source Code


    You use the tool make to compile multiple source files in the correct order. Make
    is controlled by Makefiles. Normally, these Makefiles are generated by the configure
    script, but you can also create them manually.


    You can also use make to install the program files on the hard disk.


    The following is a simple Makefile that shows how make works:


    ```

    # Makefile for my_name

    all: my_name

    my_name: my_name.c

    gcc my_name.c -o my_name

    install: my_name

    install -m 755 my_name /usr/local/bin/my_name

    ununinstall:/usr/local/bin/my_name

    rm -f /usr/local/bin/my_name

    clean:

    rm -f my_name

    ```


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'This Makefile can perform the following tasks:


    +   * Compile the program from source

    * Install the program

    * Uninstall the program

    * Clean up the directory where the compilation is performed


    Every Makefile consists of targets, dependencies, and commands for the targets.
    Targets and dependencies are separated by a colon. The commands must be placed
    under the target, indented with one tab space. A # introduces comments.


    If you execute the command make while you are in the respective directory, the
    program will search this directory for the files GNUMakefile, Makefile, or makefile.


    If make is executed without any parameters, the first target of a Makefile is
    used. In the example above, this is all. This target is associated with the target
    my_name, which specifies the step to compile: the file my_name.c with gcc.


    The command make can also be used with individual targets. For example, the command
    make install (as root) installs the binary file at the specified location and
    make uninstall removes the binary file.


    Large software projects are created in the same way, but the Makefiles are more
    extensive and complex. If the software will be compiled to a functional program
    on multiple architectures, things are much more complicated.


    For this reason, the Makefile is usually generated by the configure script.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Use make install to Install the Compiled Program


