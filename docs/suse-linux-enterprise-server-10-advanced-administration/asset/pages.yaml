- img_proc: true
  md: '# Introduction


    Virtualization is one of the hottest topics in the industrie at the moment. However,
    the idea of virtualization is not new at all. Hardware platforms like IBMsSeries
    or zSeries support virtualization since a long time and software like VMware Workstation
    for x86 based systems has been available for many years.


    Now virtualization moves to mainstream, because affordable Intel or AMD based
    x86 systems, provide enough resources to run more than one virtual machine at
    the same time.


    SUSE Linux Enterprise Server 10 comes with build-in virtualization support through
    the Xen virtual machine monitor. In the following section you''ll learn how to
    use this powerful feature.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Objective 1


    # Understand the Concept of Virtualization


    Virtualization technology separates a running instance of an operating system
    from the physical hardware. Instead of a physical machine, the operating system
    runs in a so-called virtual machine. Multiple virtual machines share the resources
    of the underlying hardware.


    Virtualization allows you to run multiple virtual systems on one single physical
    machine.


    Figure 1-1


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_26_0.png)


    The following are the main advantages of virtualization, in comparison with non-virtualized
    physical hardware:


    +   1. **Efficient Hardware Utilization.** Often systems are not using the full
    potential of their hardware. By running multiple virtual machines on the same
    hardware, the resources are used more efficiently.

    2. **Reduced Downtime.** Virtual machines can be easily migrated to a new physical
    host system. This reduces the downtime in case of a hardware failure.

    3. **Flexible Resource Allocation.** Hardware resources can be allocated on demand.
    When the resource requirements of a virtual machine change, resource allocation
    can be adjusted or the machine can be migrated to a different physical host.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Objective 2 Understand How Xen Works


    The idea of virtualization is not new. Platforms like IBM zSeries and pSeries
    offer built-in virtualization and Intel x86 base systems can be virtualized using
    third-party software like VMware.


    SUSE Linux Enterprise Server 10 comes with a virtualization technology called
    Xen, which allows you to run multiple virtual machines on a single piece of Intel
    x86 base hardware.


    At the moment, the operating systems that run in a Xen virtual machine need to
    be modified. Therefore only open source operating systems like Linux or BSD can
    be installed. One exception is Netware, which has been adjusted by Novell to run
    in a Xen virtual machine.


    Intel and AMD are developing extensions (Intel Vanderpool and AMD Pacifica) to
    the x86 Standard to support virtualization. Once these extensions are available,
    Xen will be to run unmodified operating systems including Microsoft Windows.


    > You can find updated information about Xen, including how to run unmodified
    operating systems on the OpenSUSE page at: http://en.opensuse.org/Xen


    To understand how Xen works, you need to do the following:


    +   - Understand Virtualization Methods

    - Understand the Xen Architecture'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Understand Virtualization Methods


    Before we talk in detail about the Xen technology, you should understand the following
    two different virtualization methods.


    +   - Full Virtualization. In this case the virtualization software emulates a
    full virtual machine including all hardware resources. The operating system (guest
    OS) running in the virtual machine communicates with these resources as if they
    were physical hardware. VMware Workstation is a popular full virtualization software.


    Figure 1-2


    | Applications |

    | Operating System |

    | Virtual Machine |

    | Virtual Machine Monitor |

    | Platform |


    # Full-virtualization'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Para Virtualization. Instead of emulating a full virtual machine, para-virtualization
    software provides an Application Programming Interface (API) which is used by
    the guest OS to access hardware resources. This requires that the guest OS is
    aware that it runs in a virtual machine and needs to know how to access the API.
    Xen is a para-virtualization software.


    # Figure 1-3


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_29_0.png)


    Para-virtualization


    Para virtualization provides better performance because it does not emulate all
    hardware details. The drawback is, that the guest OS needs to be modified to run
    with para-virtualization. Full-virtualization works with an unmodified guest OS
    but generates more overhead resulting in a weaker performance.


    Another advantage of para-virtualization is the feasible resource allocation.
    As the guest OS is aware of the virtual environment, Xen can, for example, change
    the memory allocation of a virtual machine on the fly without reboot.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Understand the Xen Architecture


    Xen consists of the following two major components:


    +   **Virtual Machine Monitor.** The virtual machine monitor forms a layer between
    physical hardware and virtual machines. In general this kind of software is called
    a Hypervisor.


    +   **Xen tools.** The Xen tools are a set of command line applications that are
    used to administer virtual machines.


    The virtual machine monitor must be loaded before any of the virtual machines
    are started. When working with Xen, virtual machines are called domains.


    The Xen virtual machine monitor neither includes any drivers to access the physical
    hardware of the host machine nor an interface to communicate directly with an
    administrator. These tasks are performed by an operating system running in the
    privileged domain0.


    The following is an overview of a Xen system with three domains.


    Figure 1-4


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_30_0.png)


    A process called xend runs in the domain0 Linux installation. This process is
    used to manage all Xen domains running on a system and to provide access to their
    consoles.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'A unprivileged domain is also called domainU in the Xen terminology.


    SUSE Linux Enterprise Server 10 can be used for privileged (domain0) and unprivileged
    (domainU) Xen domains.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Objective 3


    # Install Xen


    To setup a Xen system, your start from a normal SUSE Linux Enterprise 10 installation,
    which is going to run in domain0.


    The other Xen domains can later be installed in physical partitions or file system
    images. When you plan to use physical partitions, you have to make sure that the
    initial SUSE Linux Enterprise Server 10 installation is not using all of the available
    disc space.


    For maximum flexibility it makes sense to use the logical volume manager LVM or
    EVMS for a Xen system.


    The following packages have to be installed in the initial SU Linux Enterprise
    Server 10 installation:


    +   * **xen.** This package contains the Xen virtual machine monitor (Hypervisor).


    +   * **xen-tools.** Contains xend and a collection of command line tools to administer
    a Xen system.


    +   * **kernel-xen.** This package contains a modified Linux kernel that runs
    in a Xen domain.


    +   * **xen-doc-* (optional), Xen documentation in various formats.


    The installation of the Xen package automatically adds an entry into the following
    into the bootloader configuration file **/boot/grub/menu.lst.**


    ```

    title Xen

    root (hd0,3)

    kernel /boot/xen.gz

    module /boot/mlinux-Xen root=/dev/hda3 selinux=0

    module /boot/initrd-Xen

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Advanced Administration


    On some Xen systems you might see the parameter dom0_mem in the kernel module
    line. This parameter assigns a certain amount of initial main memory to domain0
    at boot time. However in Xen version 3, this parameter is not required anymore.


    Initially all available memory is used by domain0. When you start additional domainUs,
    the required amount of memory is reduced in domain0 and for the new domainU.


    The entry in menu.list adds a new option to the boot menu of your system. When
    selecting this entry, the Xen virtual machine monitor is loaded (kernel /boot/xen.gz)
    which starts SUSE Linux Enterprise Server 10 in domain0 (see the lines starting
    with module).


    Before rebooting your system with the Xen option, you should check if the automatically
    generated entry is correct. Make sure that ...


    +   - the line root (hd0,3) points to the filesystem which contains the Xen Virtual
    Machine Monitor and the Kernel of the Linux installation for domain0. In example
    hd0,3 means the fourth partition on the first hard drive in the system. Also check
    if the parameter root in the first module line points to the root partition of
    the domain0 installation.


    +   - the Xen version of the Linux kernel and the initrd are loaded in the module.
    The names of the image files should end in -xen.


    After checking the bootloader configuration file, you can reboot your system and
    select the Xen option at the bootloader menu. In the early stages of the boot
    process, you will see some messages of the Xen virtual machine monitor on the
    screen. Then the domain0 Linux installation is started.


    If the system is not booting properly, you can switch back to a non-virtualized
    system by selecting the regular SUSE Linux Enterprise Server 10 boot option.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'When running Xen, the network setup is done by the xend management process.
