    \ more complex structures in your script:\n\n```\nif test $number -eq 10\nthen\n\
    \    echo \"The value is 10\"\nelif test $1 -eq 20\nthen\n    echo \"The value\
    \ is 20\"\nelse\n    echo \"I don't know\"\nfi\n```\n\n**With elif**, you add\
    \ more conditions in case the one in the initial if statement was not true.\n\n\
    Another way to create multiple branches **case**. In a case statement, the expression\
    \ contained in a variable is compared with a number of expressions. Commands are\
    \ executed for the first expression that matches.\n\nA case statement has the\
    \ following syntax:\n\n```\ncase $variable in\nexpression1) command1;\nexpression2)\
    \ command2;\\nesac\n```\n\n# CNI USE ONLY-1 HARDCOPY PERMITTED"
