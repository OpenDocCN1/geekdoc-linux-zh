- img_proc: true
  md: "On the left side of the window, you can browse the available monitoring sensors.\
    \ Browse to Network > Interfaces > Interface_you_want_to_monitor.\n\nTwo different\
    \ blocks of sensors are available:\n\n+   - **Receiver**. These sensors display\
    \ information about the received network data.\n- **Transmitter**. These sensors\
    \ display information about the sent network data.\n\nThe following describes\
    \ some of the available sensors you can use to analyze network problems:\n\n|\
    \ Sensor | Description |\n|---|---||\n| Data/Packets | The amount of data or packets\
    \ sent or received by the interface. If performance problems occur during a high\
    \ network load, the network connection or type might be too slow for the purpose.\
    \ |\n| Collisions | This sensor is only available for the transmitter. Collisions\
    \ usually occur more frequently when too many hosts share the same Ethernet domain\
    \ (such as hosts that are connected with a hub instead of a switch). \n> Too many\
    \ collisions can have a negative impact on the overall network performance. |"
