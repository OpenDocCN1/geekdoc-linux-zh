  md: '# Use the grep and egrep Commands


    The command **grep** and its variant **egrep** are used to search files for certain
    patterns, and use the following syntax:


    grep searchpattern filename ...


    The command prints lines that contain the given search pattern. You can specify
    several files, from which **grep** will print the matching line and the corresponding
    filenames.


    Several options are available to specify that only the line number should be printed,
    for instance, or that the matching line should be printed together with leading
    and trailing context lines.


    Search patterns can be supplied in the form of regular expressions, although the
    **bare grep** command is limited in this regard.


    To search for more complex patterns, use the **egrep** command, which accepts
    extended regular expressions. As a simple way to deal with the difference between
    the two variants, make sure you use **egrep** in all of your shell scripts.


    The regular expressions used with egrep need to be in accordance with the standard
    regex syntax.


    To avoid having special characters in search patterns interpreted by the shell,
    enclose the pattern in quotation marks, as in the following:


    ```

    ::$DA1:-> egrep (b|B)lurb file*

    bash: syntax error near unexpected token |


    tuxDA1:-> egrep "(b|B)lurb file"

    file1:lurb

    file2:Lurb

    ```


    # Use the sed Command


    The sed program is a stream editor, an editor used from the command line rather
    than interactively. sed performs text transformations on a line-by-line basis.


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
