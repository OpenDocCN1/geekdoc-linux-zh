    \ and the clients can be configured with YaST modules. You can also modify the\
    \ configuration files directly.\n\nFor the NFS server to start automatically when\
    \ the computer is booted, the corresponding symbolic links in the runlevel directories\
    \ must be generated. If you configure the NFS server with YaST, otherwise; you\
