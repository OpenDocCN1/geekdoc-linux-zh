  md: '# # Objective 4 Configure Apache with OpenSSL


    By default, the connection between the web browser and the web server are not
    encrypted. Anyone who can listen to the network packets exchanged between browser
    and server can access the transferred information.


    Apache can use the SSL (Secure Socket Layer) protocol to encrypt the connection.
    To configure an SSL encryption with an Apache web server, you need know the following:


    +   - The Basics of SSL Encryption

    - Create a Test Certificate

    - Configure Apache to Use SSL

    - The Limitations of the SSL Configuration


    # ## The Basics of SSL Encryption


    RSA keys are very often used for data encryption. RSA is for example used by the
    encryption software PGP (Pretty Good Privacy) to encrypt emails, by ssh (Secure
    Shell) for encrypted data transfers between two computers, and by Apache for secure
    data transmission between the web server and the web browser.


    This encryption is based on two different keys: a private key and a public key.
    While the private key is known only to the owner, the public key should be accessible
    to the public.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Figure 2-4


    The following shows the encryption process:


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_86_0.png)


    Public and private keys can also be used to sign data. In principle, when data
    is signed, an encrypted checksum is generated from the data. The sender signs
    the data with his private key.


    The signature can be checked by the recipient by using the public key of the sender
    to determine whether the data is really from her or whether the text has been
    modified by a third party.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# The following illustrates the signing process:


    Figure 2-5


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_87_0.png)


    A problem with the encryption procedure described above is that you cannot determine
    the owner of a public key is. The solution to this problem is a Certificate Authority
    (CA) which signs the public keys with its own private keys.


    A public key that is signed by a CA is also called a Certificate.


    CAs are well-known companies or organizations like VerSign or VISA. The public
    keys of these organizations are built into the web browsers. By verifying the
    signature with the public key of the CA, the browser can make sure that a public
    key of a web server is valid.


    The following explains the process of using a CA with SSL encryption for a web
    server:


    +   1. The browser recognizes a web address starting with https://


    +   This means that the connection to this server should be encrypted. The default
    port for SSL connections is 443 instead of port 80 (used for normal unencrypted
    HTTP connections).


    +   2. The browser asks for the server for its public RSA key (certificate).


    +   3. The web server sends the public key to the web browser.


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 87
- img_proc: true
  md: '+   4. The web browser verifies the key of the server with the public key of
    the CA that signed the key.


    +   5. If the key is valid, the web browser and web server establish a secure
    connection.


    You need an officially signed key to set up a secure web server. You can sign
    a key by yourself, but this should only be done for test purposes.


    # Create a Test Certificate


    To set up a secure web server for test purposes, you can create a certificate
    by yourself. You should never use such a certificate for a production system.


    To create a test certificate, you do the following:


    +   - Create an RSA Key Pair


    +   - Sign the Public Key to Create a Certificate


    # Create an RSA Key Pair


    To create a key pair, you need a file with as many random numbers as possible.
    You can generate this file by entering the following command:


    ```

    cat /dev/random > /tmp/random

    ```


    Stop this procedure after a few seconds by pressing Ctrl+C. The file generated
    should be at least a thousand bytes in size. You can now generate the key pair
    by entering the following command:


    ```

    openssl genrsa -des3 -out server.key -rand /tmp/random

    ```


    During the process, you are prompted to enter a password. This password is used
    to secure the private key of the key pair.


    The generated keys are saved together in the file server.key.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Sign the Public Key to Create a Certificate


    Next you need to sign your public key to create a certificate by entering the
    following command:


    ```

    openssl req -new -x509 -key server.key -out server.crt

    ```


    During the process, you are prompted for the following information:


    +   * **Enter pass phrase for /tmp/server.key:**

    nEnter the passphrase you chose for the server key.

    * **Country Name (2 letter code) [AU]**

    Enter the country code of your country (such as DE for Germany).

    * **State or Province Name (full name) [Some-State]:**

    Enter your state or province name. You can enter a period (.) to leave this field
    blank.

    * **Locality Name (eg, city) []:**

    Enter the name of your city.

    * **Organization Name (eg, company) [Internet Widgets Pty Ltd]:**

    Enter the name of your company.

    * **Organizational Unit Name (eg, section) []:**

    Enter the name of your unit, or you can enter a period (.) to leave it blank.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '+   Common Name (eg, YOUR name) []:


    Enter the fully qualified domain name of your system (such as www.example.com).
    The certificate will be valid for this hostname only.


    +   Email Address []:


    Enter the email address of the administrator who is responsible for the server.


    After you have answered all questions, the server certificate is saved into the
    file server.crt.


    Finally, you need to copy the files server.key and server.crt to the correct locations:


    +   Copy the file server.key to the directory /etc/apache2/ssl.key.


    +   Copy the file server.crt to the directory /etc/apache2/ssl.crt.


    # Configure Apache to Use SSL


    After you have generated the RSA key and the server certificate, you have to configure
    Apache to use SSL. First, you need to change two settings in the file /etc/sysconfig/apache2.


    The settings in this file apply to the Apache startup script and do not belong
    to the server configuration.


    Set the following variables to the appropriate values:


    +   APACHE_START_TIMEOUT="10"


    This setting extends the start timeout of Apache so that you have more time to
    enter the passphrase of the private key.


    +   APACHE_SERVER_FLAGS="SSL"


    The additional server flag defines the SSL variable when evaluating the Apache
    configuration files. This enables some directives that are necessary for SSL encryption.'
  merge: -1
  pgno: 90
- img_proc: true
  md: "For example, it lets Apache listen on port 443 instead of only to\nport 80.\n\
    \nYou also need to change the server configuration files to enable SSL\nby doing\
    \ one of the following:\n\n+   - Configure the Main Server to Use SSL Encryption\n\
    - Configure a Virtual Host to Use SSL Encryption\n\n# Configure the Main Server\
    \ to Use SSL Encryption\n\nTo configure the main server, you need to add the following\n\
    directives to the file /etc/apache2/default-server.conf:\n\n```\nSSLEngine\nSSLCipherSuite\n\
    ALL:!ADH!:EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL\nSSLCertificate\
    \ /etc/apache2/ssl.crt/server.crt\nSSLCertificateFile /etc/apache2/ssl.key/server.key\n\
    ```\n\nEach line is described below:\n\n+   - SSLEngine on\n  This directive enables\
    \ the Apache SSL engine.\n\n+   - SSLCipherSuite\nALL:!ADH!:EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL\n\
    \nThis directive sets the details of the encryption method. The line\ndisplayed\
    \ above is the default configuration that comes with\nApache.\n\nFor more information\
    \ about this directive, go to\nhttp://http.apache.org/docs-2.0/mod/mod_ssl.html#sslciphersuite."
  merge: -1
  pgno: 91
- img_proc: true
  md: '+   SSLCertificateFile /etc/apache2/ssl.crt/server.crt


    This directive points to the server certificate file.


    +   SSLCertificateKey /etc/apache2/ssl.key/server.key


    This directive points to the server key file.


    After you make the described changes, you have to restart Apache. Apache prompts
    you for the passphrase of the server key file.


    The server might not start up correctly at boot time, because it requires the
    passphrase for the server key. You should remove Apache from the init process
    and start it manually after the system starts up.


    You can access the SSL host by using the address **https://name_of_your_host.**


    # Configure a Virtual Host to Use SSL Encryption


    You can also configure a virtual host instead of the main server to use SSL. Place
    the directives described above in your virtual host configuration and define you
    virtual host with a directive such as the following:


    ```

    <VirtualHost your_hostname:443>

    ```


    # The Limitations of the SSL Configuration


    The SSL setup as described in this section is a very basic configuration. To run
    Apache with SSL, on a server that can be reached from the Internet, you need a
    more thorough understanding of SSL and the available configuration directives.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_92_0.png)


    For more information about SSL and Security, we recommend you to take our course
    3075 (SUSE Linux Enterprise Server 10: Security).'
  merge: -1
