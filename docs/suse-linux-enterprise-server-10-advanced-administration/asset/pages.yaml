- img_proc: true
  md: '# SUSE Linux Enterprise Server 10 Advanced Administration


    directory [host[(option1,option2,option3,...)]] ...


    Do not put any spaces between the host name, enclosing the parentheses, and the
    option strings themselves.


    A host can be one of the following:


    +   - A standalone computer with its name in short form (it must be possible to
    resolve this with name resolution), with its Fully Qualified Domain Name (FQDN),
    or with its IP address.


    +   - A network, specified by an address with a netmask or the domain name with
    a prefixed placeholder (such as **,digitalairlines.com).


    Authorized computers are usually specified with their full names (including domain
    name), but you can use wildcards * or ?.


    If you do not specify a host, or use \*, any computer can import the file system
    with the given permissions.


    +   - Set permissions for exported directories in /etc/exports. You need to set
    permission options for the file system to export in parenthesis after the computer
    name. The most commonly-used options include the following:


    | Table 4-5 |

    | Option | Meaning |

    |---|---|

    | ro | File system is exported with read-only permission (default). |

    | rw | File system is exported with read-write permission. The local file permissions
    are not overridden. |

    | root_squash | (Default) This ensures that the given machine does not have root
    permissions on this file system. This is achieved by assigning user ID 65534 to
    users with user ID 0 (root). This user ID should be set to nobody (which is the
    default). |


    CNI USE ONLY-1 HARDCOPY PERMITTED


    4-54 Copying all or part of this manual, or distributing copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  pgno: 223
- img_proc: true
  md: '| Table 4-5 (continued) | Option | Meaning |

    |---|---||

    | | no_root_squash | Does not assign user ID 65534 to user ID 0, keeping the root
    permissions valid. |


    The following is an example of an edited /etc/exports file that includes permissions:


    ```

    # /etc/exports

    # /home          da10(rw, sync) da20(rw, sync)

    # /usr/X11      da10(ro, sync) da20(ro, sync)

    # /usr/lib/texmf da10(ro, sync) da20(ro, sync)

    # /srv/ftp      * (ro, sync)

    ```


    Whenever you want to specify different permissions for a subdirectly (such as
    /home/geeko/) from an already exported directory (such as /home/geeko/), the additional
    directory needs its own separate entry in /etc/exports.


    +   - Restart mount and nfsd. The /etc/exports file is read by mount and nfsd.
    If you change anything in this file, you need to restart mount and nfsd for your
    changes to take effect. You can do this by entering rcnfserver restart.


