  md: '# Objective 2


    # Use Basic Script Elements


    The shell programming language is a powerful and complete programming language.
    Before you can start to create scripts, you need to become familiar with basic
    scripting techniques and elements.


    Before writing your first script, you should consider a few points about scripting
    in general.


    A script is basically an ASCII text file containing commands to be executed in
    sequence. To allow this, it is important that permissions for the script file
    are set to “r” (readable) and “x” (executable) for the user that runs it.


    However, the execute permission is not granted by default to newly created files.
    To assign this permission, you need to use a command such as the following:


    ```

    chmod +x script.sh

    ```


    You can also run the script from another shell with a command such as the following:


    ```

    script.sh

    ```


    In this example, it is not necessary to make the script executable. SUSE Linux
    Enterprise Server 10, /bin/sh is a link to /bin/bash. It doesn''t really matter
    whether you call the script with script.sh or bash script.sh.


    Another important point is that the directory where the script is located must
    actually be in the user''s search path for executables.


    A good way to deal with this is to create a /bin directory for scripts under each
    user''s home directory. You can then add this directory to the user''s search
    path by adding a line like as the following to your ~/.bashrc


    ```

    export PATH=$PATH:/bin

    ```


    Otherwise, scripts must be started with the full pathname.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
