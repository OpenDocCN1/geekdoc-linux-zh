- img_proc: true
  md: 'There is also protocol specific information under Network > Sockets.


    Besides problems that are caused by the network or network setup itself, some
    network services can interfere with the overall system performance. These network
    services might not even be running on the same host that actually experiences
    performance problems.


    The following are 3 examples of this:


    +   - **DNS.** Many applications or services rely on the name resolution of the
    DNS system. If a DNS server is not working properly, the application is waiting
    for the response, which slows down its operation.


    +   - **Proxy.** Applications that connect to a service using a proxy server suffer
    from bad performance of this system.


    +   - **NFS.** Applications or services that access data that is mounted using
    NFS can be blocked completely if the NFS service is not available.


    The following are tools that you can use to monitor the network:


    | Program | Description |

    | --- | --- |

    | KDE System Guard | Displays network utilization and different kinds of transmission
    errors. |

    | Traffic-vis | Analyzes network connections to specific hosts. You need to install
    the package traffic-vis in order to use this tool |

    | ip | Displays the status of an interface as well as transmission errors. |'
