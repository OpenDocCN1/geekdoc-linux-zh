  md: '# Introduction


    The Linux shell can control the system with commands and perform file operations
    or start applications. You can also create a file that includes several shell
    commands and start this file like an application.


    This type of file is called a *shell script*. The following are reasons why you
    need to understand and create shell scripts:


    +   - You can automate many daily tasks with shell scripts. In many cases this
    increases speed and convenience in everyday work.

    - The boot procedure and many other system functions are controlled by shell scripts.
    To understand and manipulate the system behavior, you need a basic understanding
    of shell programming.

    - Shell programming is relatively easy to learn compared to programming languages.

    - A shell script runs on almost every UNIX-like operating system and does not
    need to be adapted to other platforms.


    There are also some disadvantages:


    +   - Shell scripts are rather slow compared with other scripting languages.

    - Shell scripts can use a lot of CPU power.


    However, in most cases these disadvantages are not significant.


    As you might have noticed, a Linux system offers different shell types. Shell
    scripts that are developed for one shell can usually be executed with a different
    shell, but this cannot be guaranteed.


    This section focuses on the Bash shell, which is the default shell in SUSE Linux
    Enterprise Server 10.


    As with all programming languages, shell scripting is learned best by actually
    writing code.'
  merge: -1
  pgno: 239
