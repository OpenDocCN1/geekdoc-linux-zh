- img_proc: true
  md: 'You can specify sed commands either directly on the command line or in a special
    script loaded by the program on execution.


    The following is the syntax for the sed command:


    # sed editing-command filename


    The available editing commands are single-character arguments such as the following:


    +   - d: Delete

    - s: Substitute (replace)

    - p: Output line

    - a: Append After


    As with other commands, the output of sed normally goes to standard output, but
    it can also be redirected to a file.


    Each sed command must be preceded by an address or address range specifying the
    lines to which the editing command applies.


    Apart from the single-character commands for text transformations, you can also
    specify options to influence the overall behavior of the sed program.


    The following are some important command line options for sed:


    +   - -n, --quiet,--silent. By default, sed will print all lines on standard output
    after they have been processed. This option suppresses the output so sed only
    prints those lines for which the p editing command has been given to explicitly
    re-enable printing.

    - -e command1 -e command2 .... This option is necessary when specifying two or
    more editing commands. It must be inserted before each additional editing command.

    - -f filename. With this option, you can specify a script file from which sed
    should read its editing commands.'
