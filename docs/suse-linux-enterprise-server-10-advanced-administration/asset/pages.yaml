  md: '# Objective 2 Understand the Concept of Shared Libraries


    Many tasks on a system are performed by more than one application. For example,
    the opening and displaying of PNG files is performed by the web browser, the graphic
    program, and other applications.


    It would not make sense to implement the functionality of opening PNG files again
    and again in every application. Therefore, program functionality can be stored
    in shared libraries.


    In the case of opening and displaying PNG files, the functionality is provided
    by the shared library libpng.


    Physically, a shared library is a file on the hard disk that is loaded into the
    main memory when an application is started that requires the functionality of
    the library.


    The task of finding and loading the required libraries is performed by the program
    ld.


    The following illustrates how shared libraries work:


    Figure 6-1


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_313_0.png)'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'A shared library consists of 2 parts:


    +   - The shared library file itself, which is loaded when a program requires
    a function of the corresponding library. The filenames for these files start with
    lib and end in .so (shared object). For example: libpng.h


    +   - The header files of the library, which contain the functions declaration
    of the library. The filenames of these files end in .h (header file). For example:
    png.h


    As described at the beginning of this section, the C programming language requires
    that every function used in a program has to be declared.


    This means that the header files of a library need to be installed on a system
    to compile software that uses functions of that library. To run already compiled
    software, only the shared library files are necessary.


    Because the software that ships with SUSE Linux Enterprise Server 10 is already
    compiled, the header files of some libraries are not installed by default. These
    libraries are split into two packages: the software packages that contain the
    header files have the extension -devel attached to the package name.


    For example, the package libpng contains the shared library, and the package libpng-devel
    contains the corresponding header files.


    When you run the configure script, it sometimes prompts you about missing libraries
    that should be installed on the system. If you install the required packages with
    YaST, you have to make sure you select both the shared library and the corresponding
    devel package.


    The text file ARCHIVES.gz at the top level of the installation media contains
    a list of all files that are shipped with SUSE Linux Enterprise 10. This file
    can be used to find out, which library file is included in which RPM package.'
  merge: -1
