  md: '# Objective 3 Understand Variables and Command Substitution


    Variables are an important component of all programming languages. You can understand
    variables as containers that hold data. Instead of the data itself, the variable
    is used in the program code.


    Look at the following example:


    ```

    #!/bin/bash

    #variable_1.sh

    na="Geeko"

    echo "Hello, my name is $a"

    ```


    The string "Geeko" is assigned to the variable a. Then the variable is used in
    the echo command. Two things are important here:


    +   - When you assign a variable, you just use the name of the variable. When
    you access the data of a variable, you put a $ before the variable name.


    +   - When you assign data to a variable, there must be no spaces between the
    variable name, the e = character and the data.


    The following is the output of the example script:


    ```

    geeko@linux-rwke:~/Shell_Scripting> ./variables_1.sh

    Hello, my name is Geeko

    ```


    We use $a in the echo line and the variable is replaced with it''s content.


    Variables can not only contain strings, but also numbers. By default a variable
    in a shell script can hold any kind of data. However, it is possible to limit
    a variable to a specific type (for example a string) with the declare command.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'So far we have only assigned static values to variables, but it''s possible
    to assign the output of a command to a variable or use a command directly where
    the output is needed. This is called command substitution.


    The term command substitution basically means that the output of a command is
    used in a shell command line or a shell script.


    In the following example, the output of the command date is used to generate the
    output of the current date:


    ```

    #!/bin/bash

    #command_subs_1.sh

    echo "Today is `date +%m/%d/%Y`"

    ```


    Note the command date +%m/%d/%Y is included in backticks (`...`).


    Instead of printing the output of a command to the screen with echo, it can also
    be assigned to a variable, as in the following:


    ```

    #!/bin/bash

    #command_subs_2.sh

    TODAY=`date +%m/%d/%Y''

    echo "Today is $TODAY"

    ```


    In this case, the output is assigned to the variable TODAY, and then TODAY is
    printed to the screen with echo. Again there are no spaces before or after the
    equal sign.


    Let''s improve our Request Tracker with what we''ve learned. In the start message
    we are going to include the number of open requests:


    ```

    #!/bin/bash

    #command_subs_3.sh

    tinum=`cat /var/spool/mail/geeko | grep ''#'' | wc -l''

    echo -e "Welcome to the Request Tracker.\nThere are $tinum open requests:\\n"

    cat /var/spool/mail/geeko | grep ''#"''

    ```


