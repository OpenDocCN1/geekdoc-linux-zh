  md: "# Create Loops\n\nAnother common control structure is the loop. A loop is often\
    \ used when a certain task has to repeated more than once. Instead of repeating\
    \ the same code in the script, a loop structure can be implemented. \n\nThere\
    \ are a few options for implementing a loop in shell scripts. A very common one\
    \ is the **for** loop:\n\n```\nfor variable in element1 element2 element3\ndo\
    \ commands\ndone\n```\n\nThe line starting with **for** defines how many times\
    \ the code between **do** and **done** has to executed. For each pass of the loop,\
    \ the variable “variable” has one of the values defined in the list after **in**.\n\
    \nLets have look at an example:\n\n```\n#!/bin/bash\n#for_loop_1.sh\nfor i in\
    \ 1 2 3\ndo echo $i\ndone\n```\n\nThe list after **n** contains three elements,\
    \ the numbers 1, 2 and 3 separated with spaces. This means that the code **do**\
    \ and **done** is executed three times and each time the variable **i** has a\
    \ different value from 1 to 3. When you run this script, it simply outputs 1 2\
    \ 3.\n\n```\ngeeko@linux-rwke:~/Shell_Scripting> ./for_loop_1.sh\n1\n2\n3\n```\n\
    \n# CNI USE ONLY-1 HARDCOPY PERMITTED"
  merge: -1
  pgno: 259
- img_proc: true
  md: "The list defined after **in** is not necessarily static. The **for** loop is\
    \ very often used to go through a list of files. An easy way to do this is to\
    \ use * after in.\n\n```\n#!/bin/bash\n#/for_loop_2.sh\n\nfor i in *\ndo\n  lower=`echo\
    \ $i | tr [:upper:]] [:lower:]`\n  mv $i $lower\ndone\n```\n\nThis script loops\
    \ through all files in the current working directory and renames the files from\
    \ upper to lower case. * is expanded to a list of all these files by the shell.\n\
    \nFor every pass of the loop, the variable $i$ contains one file name. The file\
    \ name is converted to lower case and stored in the variable **lower**. Then the\
    \ original file is renamed with **mv** to lower case.\n\n![](img/f22b64de5a4a7a1d26a0e26cfde83adc_260_0.png)\n\
    \nThis is just a demo script. For a production script you would have to add some\
    \ code that makes sure that an existing lower case file is not accidentally overwritten.\n\
    \nAnother way of creating a list is a command substitution:\n\n```\n#!/bin/bash\n\
    #/for_loop_3.sh\nfor i in `find -name \"*mp3*`\ndo\n  rm $i\ndone\n```\n\nThis\
    \ script uses **find** (note the backticks) to create a list of all .mp3 files\
    \ in the current directory and all sub-directories. These files are deleted in\
    \ the **for** loop."
  merge: -1
  pgno: 260
- img_proc: true
  md: "# Another loop construct is the while loop:\n\n```\nwhile condition\ndo\ncommands\n\
    done\n```\n\n# Very similar to the while loop is the until loop:\n\n```\nuntil\
    \ condition\ndo\ncommands\ndone\n```\n\nBoth loop types depend on a condition.\
    \ In a while loop the commands are executed as long as the condition is true and\
    \ in an until loop the commands are executed until the condition becomes true.\n\
    \nWe will use a while loop to make the output of the Request Tracker more readable:\n\
    \n```\n#!/bin/bash\n#while_loop_1.sh\n\ntinum=$(cat /var/spool/mail/geeko | grep\
    \ '#' | wc -l)\n\nif test $stinum -gt 10\nthen\n  echo -e \"Welcome to the Request\
    \ Tracker.\\nThere are $stinum open requests. You have to do something!\\\"\n\
    else\n  echo -e \"Welcome to the Request Tracker.\\nThere are $stinum open requests:\\\
    n\"\nfi\n\nwhile read read line\ndo\n  if echo $line | grep '#' > /dev/null\n\
    then\n    echo $line | grep '#'|cut -d '|'|--output-delimiter=',' -f '2 3 4'\n\
    \  fi\ndone < /var/spool/mail/geeko\n```"
