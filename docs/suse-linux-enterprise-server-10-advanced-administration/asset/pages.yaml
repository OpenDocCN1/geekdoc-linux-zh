  md: '# Objective 10


    # Learn About Useful Commands in Shell Scripts


    The following objective gives you an overview of useful commands that can be used
    in shell scripts. It''s intended to be a reference and not something you have
    to read from the beginning to the end.


    We will talk about the following:


    +   - Use the cat Command

    - Use the cut Command

    - Use the date Command

    - Use the grep and egrep Commands

    - Use the sed Command

    - Use the test Command

    - Use the tr Command


    # Use the cat Command


    When combined with the here operator (<<), the cat command is a good choice to
    output several lines of text from a script. In interactive use, the command is
    mostly run with a filename as an argument, in which case cat prints the file contents
    on standard output.


    # Use the cut Command


    You can use the cut command to cut out sections of lines from a file, so only
    the specified section is printed on standard output.


    The command is applied to each line of text as available in a file or standard
    input. You can use cut -f to cut out text fields, cut -c works with the specified
    characters.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'You can specify single sections (characters or fields) or several sections.
    The default delimiter to separate fields from each other is a tab, but you can
    specify a different field separator with the -d option.


    The following are some examples of using cut:


    ```

    cut -d : -f1 /etc/passwd

    root

    bin

    daemon

    lp

    mail

    news

    ```


    The above command specifies that the field separator should be a colon. In every
    line of /etc/passwd, the field that comes before the first colon is taken and
    piped to stdout:


    ```

    ls -1 somdir/ | cut -c 35- | sort -n

    687 Sep 20 17:06 file2

    2199 Sep 20 17:05 file1

    6593 Sep 20 17:06 file3

    ```


    The above command takes the output of the ls command and cuts out everything from
    the thirty-fifth character. This is piped to sort, so the final output is sorted
    according to file size.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Use the date Command


    You can use the date command whenever there is a need to obtain a date or time
    string for further processing by a script. Without any options specified, the
    command’s output looks like the following:


    ```

    date

    Fre Sep 03 14:18:12 CEST 2004

    ```


    The date command lets you change the output format in almost every detail. With
    the -I option (as in the following), date prints the date and time in ISO format
    (which is the same as if the options had been +%Y-%m-%d):


    ```

    -I

    2004-09-03

    date %+m-%d %H:%M

    09-03 14:19

    date %+D, %r

    09/03/02, 02:19:58 PM

    date %+d.%m.%y

    03.09.02

    date %+d.%m.%Y

    03.09.2004

    date %+e-%m-%y, %1.%M %p

    3.9.02, 2:20 PM

    date %+A, %e. %B %Y

    Friday, 3. September 2004

    ```


    To view a list with all the possible format options for date, see man date. In
    any case, you should be able to customize the output to exactly match the requirements
    of your script.'
  merge: -1
  pgno: 290
