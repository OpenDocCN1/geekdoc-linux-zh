  md: '# Objective 5


    # Use Arithmetic Operators


    Shell scripts often use values assigned to variables for calculation.

    There are several ways to implement this.


    The Bash shell comes with built-in support for arithmetic operations, but there
    are some limitations to this. Specifically, the arithmetic capabilities of Bash
    are limited in the following ways:


    +   Only operations with whole numbers (integers) can be performed.


    +   All values are signed 64-bit values. Thus, possible values range from -²⁶³
    to +²⁶.


    So when using Bash, you might need to use external commands, such as bc for floating-point
    calculations.


    The following paragraphs list all possible methods and formats for arithmetic
    operations. All of them are based on this sample operation:


    ```

    A=B+10

    ```


    +   Use the external command expr (Bourne shell compatible)


    ```

    A=`expr $B + 10`

    ```


    Since an external command is used, this method will also work with the traditional
    Bourne shell. Scripts using external commands will always perform slower than
    relying on built-in commands.


    +   Use the Bash built-in command let


    ```

    let A="$B + 10"

    ```


    In Bash, you can use the let command to perform an arithmetic expression.


    # CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 264
- img_proc: true
  md: '+   Use arithmetic expressions inside parentheses or brackets (two different
    formats)


    ```

    A=$((B + 10))

    ```


    or


    ```

    A=$[B + 10]

    ```


    Arithmetic expressions can be enclosed in double parentheses or in brackets for
    expansion by Bash. Both $((..)) and $[...] are possible, but the latter is considered
    deprecated and should be avoided.


    +   Use the built-in command declare


    ```

    declare -i A

    declare -i B

    A=10

    ```


    This declares a variable as an integer.


    If all variables involved in a calculation have previously been declared as integers
    through declare -i, arithmetic evaluation of these variables happens automatically
    when a value is assigned to them.


    This means that the variable B, for example, does not have to be prefixed with
    the $ to evaluated.


    With the expr command, only the following five operators are available: +, -,
    *, /, and % (modulo, remainder of a division). Additional operators (which are
    identical to those of the C programming language) can be used with all of the
    above Bash formats.


    For a complete list, consult the man page for bash.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_265_0.png)'
