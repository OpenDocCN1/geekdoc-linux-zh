    # Export a Directory Temporarily


    You can export a directory temporarily (without editing the file /etc/exports)
    by using the command exports.


    For example, to export the directory /software to all hosts in the network 192.168.0.0/24,
    you would enter the following command:


    ```

    exports -o ro,root_squash,sync 192.168.0.0/24:/software

    ```


    To restore the original state, all you need to enter the command exports -r. The
    file /etc/exports is reloaded and the directory software is no longer exported.


    The directories that are currently exported are listed in the file /var/lib/nfs/etab.
    The content of this file is updated when you use the command exports.


    # Configure NFS Client Access with YaST


    NFS directories exported on a server can be mounted into the file system tree
    of a client. The easiest way to do this is to use the YaST NFS Client module.


    To use YaST to configure the NFS client, start the YaST Control Center and then
