  md: '# Objective 1


    # Understand Samba


    Samba is a suite of applications used to integrate a Linux system into a Windows
    network. Samba is most commonly used as a file server for Windows hosts.


    The Server Message Block (SMB) protocol is a network protocol that provides file
    and print services in a Windows network. Samba enables Linux to use SMB so that
    Linux can be integrated in a Windows environment.


    You can use Samba for the following purposes:


    +   - To provide file and print services for Windows clients.


    +   - To access SMB file and print services on a Linux system.


    +   - To act as a domain controller for Windows clients.


    SMB services are provided by the NetBIOS protocol. NetBIOS makes its own name
    space available, which is completely different from the domain name system.


    This name space can be accessed with the Unique Naming Convention (UNC) notation:
    all services provided by a server are addressed as \Server\Servename.


    File or print services offered by a server are also called shares.


    The server side of Samba consists of 2 parts:


    +   - nmbd. This daemon handles all NetBIOS-related tasks.


    +   - smbd. This daemon provides file and print services for clients in the network.


    To integrate Linux as client in a Windows environment, Samba provides 2 tools:


    +   - winbind. This daemon integrates a Linux system into a Windows authentication
    system (Active Directory).


    +   - nmblookup. This tool can be used for NetBIOS resolution and testing.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '+   - smbclient. This tool provides access to SMB file and print services.


    SUSE Linux Enterprise Server 10 (original version without updates or service packs)
    includes Samba version 3.0.22. An important new feature in this version is the
    Kerberos support in windbind. This allows a Kerberos based integration into Active
    Directory domains.


    Novell is an important contributor of the Samba project. You can find more information
    about the Novell/SUSE Samba packages and the Novell/SUSE Samba team under

    http://www.opensuse.org/samba.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Objective 2 Configure a Simple File Server


    To set up a simple file server with Samba, you need to:


    +   - Install Samba


    +   - Understand Samba’s Configuration File


    # Install Samba


    The following packages need to be installed for basic Samba setup:


    +   - samba. This is the main Samba package. It contains the Samba server software.


    +   - samba-client. This package contains the Samba client tools.


    +   - samba-doc (optional). This package provides additional documentation about
    Samba.


    After the packages have been installed, you can start the 2 Samba daemons with
    the following commands:


    ```

    rcnmb start

    rcsmb start

    ```


    To start the Samba services automatically when the system is booting, enter the
    following commands:


    ```

    insserv nmb

    insserv smb

    ```'
