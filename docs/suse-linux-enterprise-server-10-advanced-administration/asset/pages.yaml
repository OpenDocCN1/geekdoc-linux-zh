  md: 'The example shows two mail messages from the mailbox file. Each mail message
    starts with the line From@wwwun@linux-rwke.site... and ends with a line #Ticket.
    The #Ticket line is the actual content of the mail, all other lines are headers
    carrying meta data and transportation details of the mail.


    The #Ticket line includes the information of the request sent through the web
    interface. It contains multiple fields separated by the l character. The fields
    have meaning (right of #Ticket):


    Subject of Request | Email Address of Sender | Request Category | Description
    of Request


    We start with a script that simply outputs the mailbox file to the terminal:


    ```

    #!/bin/bash

    #basic_script1.sh

    cat /var/spool/mail/geeko

    ```


    This first line tells the Linux kernel that this file has to be passed to the
    bash shell in order to be executed. Every shell script should be directly executable
    needs such a line. The path to the bash binary is /bin/bash.


    The second line is a comment. Every line starting with a # is not recognized by
    the interpreting shell. In this case the comment is used for the filename under
    which you can find the script on the course CD. All following script examples
    have a comment.


    The fourth line uses the cat command to open the mailbox file /var/spool/mail/geeko
    and to print it’s content to the terminal. You can also use any commands you know
    from the command line in a shell script.


