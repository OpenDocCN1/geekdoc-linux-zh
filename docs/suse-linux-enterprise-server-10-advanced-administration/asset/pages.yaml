  md: '# Limit Access to the Administration Tools


    When you run Tomcat as an Internet service, you do not want everyone to be able
    to access the administration tools.


    You can limit the access using the <value> element in the context configuration.


    This needs to be done in the context files


    ```

    /usr/share/tomcat5/conf/Catalina/localhost/manager.xml

    ```


    for the Manager tool and


    ```

    /usr/share/tomcat5/conf/Catalina/localhost/admin.xml

    ```


    for the Admin tool.


    In the Context element, you need to insert a <value> element, in the following
    example:


    ```

    <Context path="/manager"

    docBase="/usr/share/tomcat5/server/webapps/manager"

    debug="0" privileged="true">


    <!-- Link to the user database we will get roles from ---->

    <ResourceLink name="users" global="UserDatabase"

    ntype="org.apache.catalina.UserDatabase"/>


    <Valve className="org.apache.catalina.valves.RemoteValve"

    allow="127.0.0.1"/>


    </Context>

    ```


    In this example, access to the Manager is only allowed from localhost (IP address
    127.0.0.1). For more entries we use a comma to separate them.'
  merge: -1
