    \nYou can configure the server from the command line by doing the following:\n\
    \n+   - Check for service (daemon) availability. Make sure the following are available\
    \ on your NFS server:\n    - RPC portmapper (portmap)\n    - RPC mount daemon\
    \ (rpc.mountd)\n    - RPC NFS daemon (rpc.nfsd)\n\n+   - Configure the services\
    \ to be available at boot. For these services to be started by the scripts /etc/init.d/portmap\
    \ and /etc/init.d/nfsserver when the system is booted, enter the following commands:\n\
    \n```\ninserv /etc/init.d/portmap (activated by default)\ninserv /etc/init.d/nfsserver\n\
    ```\n\n+   - Define exported directories in /etc/exports. For each directory to\
    \ export, one line is needed to set which computers can access that directory\
    \ with permissions. All subdirectories of that directory are automatically exported\
    \ as well.\n\nThe following is the general syntax of the file /etc/exports:"
