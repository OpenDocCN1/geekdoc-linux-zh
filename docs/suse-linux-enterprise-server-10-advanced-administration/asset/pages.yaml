  md: '# Objective 10 Use Port 80 to Access Tomcat


    Tomcat accepts requests on the port that is configured in the <connector> elements
    of the server.xml configuration file. A very commonly used port is 8080.


    If Tomcat is used standalone, it makes sense to configure port 80, because this
    is the default port for the HTTP Protocol.


    The problem here is that Linux-only processes running with root permissions are
    allowed to open ports below 1024. These ports are also called the privileged ports.


    By default Tomcat runs as the user tomcat on a SUSE Linux Enterprise Server 10
    system. This setup does not allow Tomcat to open a privileged port. It is possible
    to run Tomcat as root user, but this is not recommended due to security reasons.


    In a setup where Tomcat runs as root user, an exploit of Tomcat would automatically
    lead to root access on the underlying system.


    To let Tomcat process requests arriving on port 80 in a secure way, you can use
    one of the following options:


    +   - Use a port forwarder like rinetd to forward incoming requests on port 80
    to the port where Tomcat is listening.


    +   - Use iptables to forward incoming requests on port 80 to the port where Tomcat
    is listening.


    +   - Integrate Tomcat with the Apache web server.


    This might also make sense if your content contains a lot of static HTML pages
    and only some dynamically-generated pages.


    Letting Apache serve the static content can lead to a better overall performance.


    You can find more information about the port Apache integration at http://jakarta.apache.org/tomcat/connectors.html#integrate,'
  merge: -1
  pgno: 122
- img_proc: true
  md: '+   * Use the Squid cache to forward requests to Tomcat.


    To use rinetd for port forwarding, you can use a configuration like the following
    when rinetd is installed on the same system like Tomcat.


    The configuration file of rinetd is done using the file /etc/rinetd.conf:


    ```

    10.0.0.1 10.0.0.1 8080

    allow 10.0.0.*\*

    logfile /var/log/rinetd.log

    logcommon

    ```


    In this example, all incoming requests on IP address 10.0.0.1 and port 80 are
    forwarded to 10.0.0.1 port 8080.


    > > You have to stop the Apache daemon (httpd) before if you want to use rinetd,
    because it is not possible that both use port 80 further.


    > > More information about rinetd, see in the directory /usr/share/doc/packages/rinetd
    after you have installed the package rinetd.'
  merge: -1
  pgno: 123
