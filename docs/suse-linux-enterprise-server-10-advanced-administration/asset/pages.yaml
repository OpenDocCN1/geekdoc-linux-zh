- img_proc: true
  md: '# Understand Samba''s Configuration File


    The Samba services are configured in the file /etc/samba/smb.conf.


    The options in this file are grouped into different sections. Each section starts
    with a keyword in square brackets.


    To set up a simple file server with Samba, do the following:


    +   - Create a Section for the General Server Configuration

    - Create a Section for the Files to be Shared


    # Create a Section for the General Server Configuration


    The section for the general server configuration starts with the keyword [global].
    The following is an example of a basic global section:


    ```

    [global]

    workgroup = DigitalAirlines

    netbios name = Fileserver

    security = share

    ```


    The entries of the global section in this example are described below:


    +   - **workgroup = DigitalAirlines**

    This line sets the Windows subgroup of the Samba server (in this case, DigitalAirlines).

    - **netbios name = Fileserver**

    This line sets the name of the system in the NetBIOS space (in this case, Fileserver).

    - **security = share**

    This line determines how a client has to authenticate itself accessing a share.
    This option can have the following values:'
  merge: -1
  pgno: 135
- img_proc: true
  md: '+   share. The client does not need to provide a password when initially connecting
    to the server. However, a password might be necessary when the client tries to
    access a share.


    +   user. The client needs to provide a user name and password when connecting
    to the server. Samba validates the password against the users available on the
    Linux system and its own password file.


    +   server. The client needs to provide a user name and password when it connects
    to the server. Samba contacts another SMB server in the network to validate the
    password.


    +   domain. The client needs to provided a user name and password when connecting
    to the server. Samba connects to the domain controller and validates the password.
    This works only if Samba joins a Windows domain.


    +   ads. Samba acts as domain member of an ADS realm to validate the user name
    and password.


    You might need to configure additional settings for these options to work correctly.
    For more information, see the main page of smb.conf.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_136_0.png)


    # Create a Section for the Files to be Shared


    After the global section, you need to add a section for the share of your file
    server. The following example is the simplest way to set up a share:


    ```

    comment = Data

    path = /srv/data

    read only = Yes

    guest ok = Yes

    ```


    The entries of the section in this example are described below:


    +   [data]


    CNI USE ONLY-1 HARDCOPY PERMITTED'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'This is the identifier for the share. The share can later be accessed with
    the address \Fileserver\data.


    +   - **comment = Data**


    This option is a comment with additional information about the share. The comment
    is displayed when you browse the network with Windows Explorer.


    +   - **path = /srv/data**


    This option sets the path to the exported data on the local system. You have to
    make sure that the local user who needs to access the files of this share has
    sufficient file system rights.


    +   - **read only = Yes**


    If this option is set to yes, the client accessing the share is not allowed to
    modify, delete or create any files. This is also the default value: If you leave
    out this parameter, a share is read-only.


    +   - **guest ok = Yes**


    If this option is set to Yes, a password is not required to access the share.


    ![](img/f22b64de5a4a7a1d26a0e26cfde83adc_137_0.png)


    There many more configuration options available than those discussed in this section.
    For an overview of all options, see the man page of smb.conf.


    After you have created a smb.conf file, you should restart the Samba server daemons.


    Before you restart the daemons, you can test the syntax of the Samba configuration
    file by entering the following command:


    ```

    testpar

    ```'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'The output of the command looks like the following:


    ```

    Load smb config files from /etc/samba/smb.conf

    processing section "[data]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    Press enter to see a dump of your service definitions

    ```


    In this case, no errors are found. If there were any errors in the file, the command
    would display the errors grouped by configuration sections.


    An interesting option for testpar is --section-name <sectionname>, which outputs
    only the specified section. This can be very usefull when you have a very long
    smb.conf.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# Objective 3 Configure User Authentication


    In the previous example, the Samba share is accessible without supplying a user
    name and password. In most cases, this type of accessibility is not recommended.


    The following shows you how to configure Samba to require authentication with
    a user name and password:


    +   - Prepare the Server for User Authentication

    - Configure a Share that Is Accessible to Only One User

    - Configure Shared Access for a Group of Users

    - Configure the Export of Home Directories


    # Prepare the Server for User Authentication


    The first task is to change the security option in the smb.conf file to the following:


    ```

    security = user

    ```


    The value user for the option security forces user authentication when the client
    attempts to connect to the server.


    In the following examples, the configuration is based on User Level Security.
    In this security level, the Windows-compatible encrypted password file is stored
    in the file /etc/samba/smbpasswd (by default).


    Users who want to access SMB must first be created as Linux users. Then an SMB
    password needs to be set using the smbpasswd tool.


    The following example sets a SMB password for the user tux:


    ```

    smbpasswd -a tux

    ```'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'Smbpasswd prompts you to enter the password twice and confirms the setting
    of the password by displaying the following message:


    ```

    New SMB password: novel

    Reenter smb password: novel

    Added user tux

    ```


    To disable an account,


    # smbpasswd -d login:


    ```

    da2:- # smbpasswd -d kbailey

    Disabled user kbailey.

    ```


    To reactivate a disabled account,


    # smbpasswd -e login:


    ```

    da2:- # smbpasswd -e kbailey

    Enabled user kbailey.

    ```


    To remove a Samba user, you can use the command:


    # smbpasswd -x login


    ```

    da2:- # smbpasswd -x kbailey

    Deleted user kbailey.

    ```


    To change a Samba password, use the command


    # smbpasswd


    The user himself does not need to add any options:


    ```

    kbailey@da2:-~ smbpasswd

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Password changed for user kbailey

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'The system administrator has to use smbpasswd with the login of the user:


    ```

    da2:~ # smbpasswd kbailey

    New SMB password:

    Retype new SMB password:

    Password changed for user kbailey.

    Password changed for user kbailey.

    ```


    # Configure a Share that Is Accessible to Only One User


    The following example configures a share that is accessible only for the user
    tux:


    ```

    [tuk-dir]

    comment = Tux Directory

    path = /srv/share

    valid users = tux

    read only = no

    ```


    Each line of this share is described below:


    +   * comment = Tux Directory

    This option sets the comment for the share.


    +   * path = /srv/share

    This option sets the path to the share.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '+   valid users = tux


    This option lists all user who are allowed to connect to this share. User names
    have to be separated by commas. You can add an entire UNIX group with the syntax
    @group_name . However, all the users of the UNIX group need accounts in the smbpasswd
    file.


    +   read only = no


    This option makes the share writable by setting the read only option to no.


    # Configure Shared Access for a Group of Users


    The following example creates a share that is readable and writable for all users
    of the UNIX group accounting:


    ```

    [accounting]

    comment = Accounting department

    path = /srv/share

    valid users = @accounting

    force user = tux

    force group = accounting

    read only = no

    ```


    Compared to the previous example, the following lines are new or have changed:


    +   valid users = @accounting


    This line allows all users who are in the UNIX group accounting to access the
    shared folder.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   force user = tux


    This line forces the Samba server to perform all file operations in the shared
    folder as user tux. This ensures that all files in the shared folder are readable
    and writable for every user who is allowed to access the share.


    +   force group


    This line forces the Samba server to perform all file operations with the group
    accounting.


    # Configure the Export of Home Directories


    The following example exports the home directory of all UNIX users of the Samba
    server. You need to add the users to the smbpasswd wbd file before the setup works:


    ```

    [homes]

    comment = Home Directories

    valid users = %S

    read only = No

    browseable = No

    ```


    In this example, you must name the share homes. If Samba finds a share with this
    name in the configuration file, it is treated in a special way.


    When a share is requested, Samba first scans the existing sections of the configuration
    file. If no section is found, Samba uses the requested share name as a user name
    and looks up the user in the local password file.


    If the user is found and the correct password is supplied, Samba automatically
    creates a share for the home directory of the user.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'The following describes the lines in the example:


    +   - valid users = %S

    The %S macro sets the value of the valid users option to the name of the requested
    share.


    +   - read only = No

    The exported home directory should be readable and writable for the authenticated
    user.


    +   - browseable = No

    For security reasons, the share is not browseable.


    To access an exported home directory, use the address //server_name/user_name.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Configure a Share for the User Geeko


    Exercise 3-2


    In this exercise, you learn how to configure a basic samba share.


    You can find this exercise in the workbook.


