  md: '# Introduction


    In the SUSE Linux Enterprise Server 10 Advanced Administration (3073) course you
    learn the SUSE Linux Enterprise Server 10 administration skills necessary to complete
    your basic SUSE Linux Enterprise 10 skill set.


    These skills, along with those taught in the SUSE Linux Enterprise Server 10 Fundamentals
    (3071) and SUSE Linux Enterprise Server 10 Administration (3072) prepare you to
    take the Novell® Certified Linux® Professional (Novell CLP) certification practicum
    test.


    Your student kit includes the following:


    +   - SUSE Linux Enterprise Server 10 Advanced Administration Manual


    +   - SUSE Linux Enterprise Server 10 Advanced Administration Workbook


    +   - SUSE Linux Enterprise Server 10 Advanced Administration Course DVD


    +   - SUSE Linux Enterprise Server 10 Product DVD


    +   - SUSE Linux Enterprise Desktop 10 Product DVD


    The Course DVD contains a preinstalled VMware image of SUSE Linux Enterprise Server
    10 that you can use with the SUSE Linux Enterprise Server 10 Advanced Administration
    Workbook to practice the skills you need to take the Novell CLP practicum.


    > Instructions for setting up a self-study environment are in the setup directory
    on the Course DVD.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Course Objectives


    This course teaches you how to perform the following SUSE Linux administrative
    tasks for SUSE Linux Enterprise Server 10:


    +   1. Manage Virtualization with XEN


    +   2. Configure a Web Application Server


    +   3. Configure Samba


    +   4. Enable Fundamental Network Services


    +   5. Create Shell Scripts


    +   6. Compile Software from Source


    +   7. Perform a Health Check and Performance Tuning


    +   8. Manage Hardware


    These are tasks common to an experienced SUSE Linux administrator in an enterprise
    environment.


    The final day of class is reserved for a “LiveFire” exercise that provides a set
    of scenarios to test your SUSE Linux Enterprise Server 10 administration skills
    and prepare you to take the Novell CLP 10 Practicum.


    # Audience


    This course is designed for those who already have experience with Linux, including
    general system configuration and command line work. This course is also ideal
    for those seeking advanced administration skills on SUSE Linux Enterprise Server
    10, those who have completed the previous two courses in the Novell CLP10 curriculum
    and those preparing to take the Novell CLP10 Practicum exam.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Certification and Prerequisites


    This course helps you prepare for the Novell Certified Linux Professional 10 (Novell
    CLP 10) Practical Test, called a practicum. The Novell CLP 10 is an entry-level
    certification for people interested in becoming SUSE Linux administrators.


    As with all Novell certifications, course work is recommended. To achieve the
    certification, you are required to pass the Novell CLP 10 Practicum (050-697).


    The Novell CLP 10 Practicum is a hands-on, scenario-based exam where you apply
    the knowledge you have learned to solve real-life problems—demonstrating that
    you know what to do and how to do it.


    The practicum tests you on objectives in this course (SUSE Linux Enterprise Server
    10 Advanced Administration - Course 3073) and the skills outlined in the following
    Novell CLP 10 courses:


    +   - SUSE Linux Enterprise Server 10 Fundamentals - Course 3071

    - SUSE Linux Enterprise Server 10 Administration - Course 3072'
