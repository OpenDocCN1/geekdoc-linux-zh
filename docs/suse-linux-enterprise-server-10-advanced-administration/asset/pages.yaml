- img_proc: true
  md: '| Table 7-4 (continued) | Sensor | Description |

    |---|---|---|

    | | Dropped Packets | This sensor displays the number of packets that are either
    dropped when they are received by the host or other network components like routers
    on their way to the destination.<br><br>Too many dropped packets can have a bad
    influence on the network performance. The following are some reasons for dropped
    packets:

    - Network components running at a different speed. For example, the server runs
    at 100 Mbps, but the router at only 10 Mbps.

    - The network or system load of a server is too high to handle all received network
    packets properly.

    - A network component runs with a misconfigured packet filter that drops network
