  md: '# Objective 7 Use Arrays


    Arrays are basically variables that can hold more than one value. To identify
    a value in an array, a numerical index is used. The index is written in square
    brackets after the array name.


    ```

    lines[1]="Hello World"

    ```


    This line assigns the string “Hello World” to the index 1 of the array with the
    name lines.


    To access a value in an array, you have to specify an index and put curly brackets
    around the array name:


    ```

    echo ${lines[1]}

    ```


    Arrays are very usefull to store list data like a list of files or the requests
    in our Request Tracker.'
