  md: '# Objective 9 Use Tomcat''s Administration Tools


    Tomcat comes with two web based applications that can be used to administer the
    server. Both are realized in Java and run with privileged rights on the Tomcat
    server.


    The following tasks can be done with the administration tools:


    +   - Use the Manager to Control Web Applications

    - Use the Admin Interface to Adjust the Server Configuration

    - Limit Access to the Administration Tools


    # Use the Manager to Control Web Applications


    The Manager can be used to deploy and control web applications. The default virtual
    host localhost has the Manager configured in the context /manager.


    The Manager offers functions that should not be accessible by everyone. Therefore,
    you have to authenticate yourself before you can access the Manager.


    To get authenticated working, you have to create a user in the file /usr/share/tomcat5/conf/tomcat-users.xml.


    This file contains a user database that can be used to authenticate users for
    the Manager or other web applications.


    The following two configuration elements are used in the file:


    +   - <role/>. Permission rights are granted to authenticated users based on roles.
    The role element takes the attribute rolename which defines the name of the role.
    To access to the manager application, define the role manager as in the following
    example:


    ```

    <role rolename="manager"/>

    ```'
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   - `<user/>`. Every user in the file is defined by a user element. The element
    takes the attributes **username**, **password**, and **roles**. The **password**
    parameter contains the password in clear text. The **roles** parameter is used
    to assign roles to the user. You can specify multiple roles by separating them
    with a comma.


    The following example creates the user **kbailey**, which has the role **manager**:


    ```

    <user username="kbailey" password="kbailey" roles="manager"/>

    ```


    After you have made changes on the tomcat-user.xml file, you have to restart Tomcat.
    Tomcat won''t reread the file automatically.


    After you have defined the manager role and assigned the role to a user, you can
    start the Manager by pointing your browser to `http://hostname:port/manager/html`'
  merge: -1
