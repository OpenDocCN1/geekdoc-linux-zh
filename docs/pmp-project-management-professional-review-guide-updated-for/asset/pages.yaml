- pgno: 151
  md: '# ## Tools and Techniques of Develop Schedule


    The Develop Schedule process has several tools and techniques you can use:


    +   * Schedule network analysis

    +   * Critical path method

    +   * Critical chain method

    +   * Resource optimization techniques

    +   * Modeling techniques

    +   * Leads and lags

    +   * Schedule compression

    +   * Scheduling tool


    ### Schedule Network Analysis

    Schedule network analysis involves calculating early and late start dates and
    early and late finish dates for project activities to generate the project schedule.
    In short, it generates the schedule through the use of the following analytical
    techniques and methods:


    +   * Critical path method

    +   * Critical chain method

    +   * Modeling techniques

    +   * Resource optimization techniques


    ![](img/c077f27110b08d0d6c301ce24ad84100_151_0.png)


    > Calculations are performed without taking resource limitations into consideration,
    so the dates are theoretical. Resource limitations and other constraints are taken
    into consideration during the outputs of this process.


    ### Critical Path Method

    Critical path method (CPM), a schedule network analysis technique, determines
    the amount of float, or schedule flexibility, for each of the network paths by
    calculating the earliest start date, earliest finish date, latest start date,
    and latest finish date for each activity. This technique relies on sequential
    networks and a single duration estimate for each activity. PDM can be used to
    perform CPM. Here is some information related to CPM that you should know:


    #### Critical Path

    The critical path (CP) is generally the longest full path on the project. Any
    project activity with a float time that equals zero is considered a critical path
    task. The critical path can change under the following conditions:


    +   * When activities become tasks on the critical path as a result of having
    used up all their float time

    +   * When a milestone on the critical path is not met'
  merge: -1
  img_proc: true
- pgno: 152
  md: '**Float** There are two types of float time, also called slack time:


    +   - Total float (TF), or the amount of time you can delay the earliest start
    of a task without delaying the ending of the project

    +   - Free float (FF), or the amount of time you can delay the start of a task
    without delaying the earliest start of a successor task


    **Calculating the Forward and Backward Pass** A forward pass is used to calculate
    the early start and early finish date of each activity on a network diagram. To
    calculate a forward pass, follow these steps:


    +   1. Begin with the first activity.

    +   2. The calculation of the first activity begins with an early start date of
    zero. Add the duration of the activity to determine the early finish.

    +   3. The early start date of the next activity is the early finish date of the
    previous activity. Continue calculating the early start and early finish dates
    forward through all the network paths while following the existing dependencies.

    +   4. When an activity has two connecting predecessors, the early start date
    would be the early finish of the predecessor that finishes last. (For example,
    suppose activity A has an early finish of 4 and activity B has an early finish
    of 5. If activities A and B both converge at activity C, then activity C would
    have an early start date of 5.)


    A backward pass is used to calculate the late start and late finish date of each
    activity on a network diagram. To calculate a backward pass, follow these steps:


    +   1. Begin with the last activity. The late finish will be the same as the early
    finish date.

    +   2. Subtract the duration of the activity from the end date to calculate late
    start. This becomes the late finish of its predecessors.

    +   3. Continue calculating the latest start and latest finish dates moving backward
    through all of the network paths.

    +   4. When an activity has two connecting predecessors, the late finish date
    would be the late start of the activity that follows. (For example, if activity
    C has a late start of 7 and both activity A and activity B connect to activity
    C, the late finish of both activity A and B would be 7.)


    Figure 3.17 summarizes a forward and backward pass.


    ![](img/c077f27110b08d0d6c301ce24ad84100_152_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_152_1.png)'
  merge: -1
  img_proc: true
