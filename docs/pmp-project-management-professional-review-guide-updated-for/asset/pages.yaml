- pgno: 241
  md: '# # Project Risk Management Knowledge Area Review


    Risk management planning begins as early as the project begins. The first step,
    which creates the risk management plan, is carried through early on during the
    planning phase of the project. Project plans, such as the cost management plan,
    the schedule management plan, and the communications management plan, are used
    to develop the risk management plan. The project scope statement is also used.


    As depicted in Figure 3.57, the steps within risk management planning are very
    intuitive. First, you plan how to manage, assess, and deal with risks. Then, you
    identify and prioritize the identified risks. Analyzing the risks comes next.
    As you may recall, this can include qualitative risk analysis and quantitative
    risk analysis.


    ![](img/c077f27110b08d0d6c301ce24ad84100_241_0.png)


    With the existing information at hand, you can now plan how you will respond to
    risks that call for action. As you can see in Figure 3.57, the risk register is
    a living document, updated throughout the project as risks are identified. It
    documents all of the information about these risks and is therefore continuously
    updated as the processes are carried out.


    # # Project Procurement Management

    # Knowledge Area Review


    Figure 3.58 shows the single procurement-planning step. Here you plan how procurements
    will be carried out and managed within the project. This activity also determines
    which products or services will be procured. A total of nine inputs feed the process.'
  merge: -1
  img_proc: true
