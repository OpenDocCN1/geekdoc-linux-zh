    and Estimate Costs, must be completed prior to working on Determine Budget because
    some of their outputs become the inputs to this process.


    # Tools and Techniques of Determine Budget


    Know the following tools and techniques of the Determine Budget process for the
    exam:


    +   - Cost aggregation

    +   - Reserve analysis

    +   - Expert judgment

    +   - Historical relationships

    +   - Funding limit reconciliation


    **Cost Aggregation**  Cost aggregation is the process of tallying the schedule
    activity cost estimates at the work package level and then totaling the work package
    levels to higher-level WBS component levels. All costs can then be aggregated
    to obtain a total project cost.


    **Reserve Analysis**  In this process, reserve analysis outlines contingency reserves
    for unplanned project scope and unplanned project costs. Contingency reserves
    are included as part of the cost baseline, whereas management reserves are not.


    **Expert Judgment**  Expert judgment in calculating the project budget will include
    information from those with past experience in conducting similar projects.


    **Historical Relationships**  Analogous estimates and parametric estimates can
    be used to help determine total project costs. Actual costs from previous projects
    of similar size, scope, and complexity are used to estimate the costs for the
    current project. This is helpful when detailed information about the project is
    not available or it''s early in the project phases and not much information is
    known.


    **Funding Limit Reconciliation**  Funding limit reconciliation involves reconciling
    the amount of funds to be spent with the amount of funds budgeted for the project.
    The organization or the customer sets these limits. Reconciling the project expenses
    will require adjusting the schedule so that the expenses can be smoothed. This
    can be done by placing imposed date constraints on work packages or other WBS
    components in the project schedule.


    # Outputs of Determine Budget


    There are three outputs of the Determine Budget process:


    **Cost Baseline**  The cost baseline provides the basis for measurement, over
    time, of the expected cash flows (or funding disbursements) against the requirements.
    Adding the costs'
