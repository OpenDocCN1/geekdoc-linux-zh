- pgno: 20
  md: '# # Introduction


    Congratulations on your decision to pursue the Project Management Professional
    (PMP®) credential, one of the most widely recognized credentials within the project
    management industry. The PMP® credential is offered by the Project Management
    Institute (PMI®), a not-for-profit organization with thousands of members across
    the globe. PMI® has been a long-standing advocate and contributor to the project
    management industry and offers several credentials for those specializing in the
    field of project management.


    This book is meant for anyone preparing to take the PMP® certification exam as
    well as individuals who are looking to gain a better understanding of *A Guide
    to the Project Management Body of Knowledge, Fifth Edition* (PMBOK® Guide). If
    you are studying for the Certified Associate in Project Management (CAPM®) exam,
    you may also find this book useful because the CAPM® exam tests your knowledge
    of the PMBOK® Guide contents.


    This review guide has been formatted to work hand in hand with *PMP®: Project
    Management Professional Exam Study Guide, 8th Edition*, from Sybex. The Study
    Guide provides a more comprehensive review of the concepts included on the exam
    along with real-world examples. This review guide will reinforce these concepts
    and provide you with further explanation and a handy reference guide to the project
    management processes within the PMBOK® Guide. You’ll find references to the Study
    Guide throughout this book, guiding you to where you may find additional information
    as needed. With all of these great resources at your fingertips, learning and
    understanding the PMBOK® Guide, along with other project management concepts,
    has certainly become easier!


    # ## Book Structure


    This book has been structured in a way that carefully follows the concepts of
    the *PMBOK® Guide*, allowing you to understand how a project is managed from beginning
    to end. For this reason, we will review the processes in the order of the process
    groups:


    +   - Initiating

    +   - Planning

    +   - Executing

    +   - Monitoring and Controlling

    +   - Closing


    We start by covering the project management framework and the *PMI® Code of Ethics
    and Professional Conduct* and then move to a comprehensive review of the process
    groups. You’ll find that each chapter offers a concise overview of each project
    management process and concept as well as the process inputs, tools and techniques,
    and outputs. This structure allows you to go back and reference terms, definitions,
    and descriptions at a glance.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# ## Overview of PMI® Credentials


    PMI® offers several credentials within the field of project management, so whether
    you are an experienced professional or looking to enter the project management
    field for the first time, you''ll find something to meet your needs. You may hold
    one or multiple credentials concurrently.


    Over the years, PMI® has contributed to the project management body of knowledge
    by developing global standards used by thousands of project management professionals
    and organizations. In total, there are four Foundational standards, 7 Practice
    Standards, and four Practice Guides, all grouped within the following categories:


    +   - Projects

    +   - Programs

    +   - Profession

    +   - Organizations

    +   - People


    Several credentials offered by PMI® are based on the *PMBOK® Guide*, which is
    part of the Projects category. As of the publication date of this book, PMI® offers
    eight credentials. Let''s briefly go through them:


    Project Management Professional (PMP)® You are most likely familiar with the PMP®
    credential—after all, you purchased this book! But did you know that the PMP®
    certification is the most widely and globally recognized project management certification?
    The PMP®, along with several other credentials, validates your experience and
    knowledge of project management. This makes obtaining a PMP® in itself a great
    achievement. The following requirements are necessary to apply for the PMP® exam:


    Work Experience The following work experience must have been accrued over the
    past eight consecutive years:


    +   - If you have a bachelor''s degree or the global equivalent: three years (36
    months) of non-overlapping project management experience, totaling at least 4,500
    hours

    +   - If you have a high school diploma, associate''s degree, or global equivalent:
    five years (60 months) of non-overlapping project management experience, totaling
    at least 7,500 hours


    Contact Hours "Contact hours" refers to the number of qualified formal educational
    hours obtained that relate to project management. A total of 35 contact hours
    is required and must be completed before you submit your application.


    Certified Associate in Project Management (CAPM)® The CAPM® credential is ideal
    for someone looking to enter the project management industry. You may meet the
    requirements through work experience or through formal project management education.
    If you do not currently have project management experience, you may apply if you
    have accumulated the requisite number of formal contact hours:


    +   - **Work Experience** 1,500 hours of formal project management experience

    +   - **Contact Hours** 23 contact hours of formal project management education'
