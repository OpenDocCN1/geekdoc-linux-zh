    # Define Activities


    The purpose of the Define Activities process is to decompose the work packages
    into schedule activities where the basis for estimating, scheduling, executing,
    and monitoring and controlling the work of the project is easily supported and
    accomplished. This process documents the specific activities needed to fulfill
    the deliverables detailed in the WBS. By the end of this process, the project
    team will have defined a list of activities, their characteristics, and a milestones
    list.


    Figure 3.10 shows the inputs, tools and techniques, and outputs of the Define
    Activities process.


    # FIGURE 3.10  Define Activities process


    +   *   Schedule management plan

    +   *   Scope baseline

    +   *   Enterprise environmental factors

    +   *   Organizational process assets


    +   *   Decomposition

    +   *   Rolling wave planning

    +   *   Expert judgment


    +   *   Activity list

    +   *   Activity attributes

    +   *   Milestone list


    ![](img/c077f27110b08d0d6c301ce24ad84100_132_1.png)'
