- pgno: 115
  md: 'Stakeholder Management Plan We will cover the stakeholder management plan in
    the "Developing a Stakeholder Management Plan" section later in this chapter.
    For the collect requirements process, the stakeholder management plan is used
    to document the stakeholder communication requirements and their level of engagement.
    This will help the project team adjust the requirements activities to the level
    of stakeholder participation that is needed.


    Project Charter In this process, the high-level project requirements and product
    description are used from within the project charter.


    Stakeholder Register In this process, the stakeholder register is used as a way
    of determining who can provide the necessary information on the project and product
    requirements.


    # Tools and Techniques of Collect Requirements


    Know the following tools and techniques that can be used during the Collect Requirements
    process:


    +   - Interviews

    +   - Focus groups

    +   - Facilitated workshops

    +   - Group creativity techniques

    +   - Group decision-making techniques

    +   - Questionnaires and surveys

    +   - Observations

    +   - Prototypes

    +   - Benchmarking

    +   - Context diagrams

    +   - Document analysis


    Interviews Interviews allow subject matter experts and experienced project participants
    to impart a lot of information in a short amount of time. The following are characteristics
    of interviews:


    +   - Typically structured as a one-on-one conversation with stakeholders

    +   - Can be formal or informal

    +   - Consist of questions prepared ahead of time


    Focus Groups Focus groups are usually conducted by a trained moderator. The key
    to this tool lies in picking the subject matter experts and stakeholders to participate
    in the focus group; they then engage in discussion and conversation as a way of
    imparting their feedback about the project''s end result.


    Facilitated Workshops Cross-functional stakeholders come together in a facilitated
    workshop to discuss and define requirements that affect more than one department.
    The following are characteristics of facilitated workshops:


    +   - All the participants of the workshops understand the various project needs.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '+   - The workshops provide a facilitated forum to discuss and resolve their
    participants’ issues.

    +   - A consensus is reached more easily than through other methods.


    ![](img/c077f27110b08d0d6c301ce24ad84100_116_0.png)


    > The primary difference between focus groups and facilitated workshops is that
    focus groups are gatherings of prequalified subject matter experts and stakeholders
    where the intention is to gather feedback from these individuals, and facilitated
    workshops consist of cross-functional stakeholders who work together to define
    cross-functional requirements.


    # Group Creativity Techniques


    Group creativity involves the following techniques:


    **Brainstorming** Brainstorming involves getting together to generate ideas and
    gather the project requirements.


    **Nominal Group Technique** Nominal group technique works to engage all participants
    through an idea-gathering or structured brainstorming session and ranking process.


    **Idea/Mind Mapping** In idea/mind mapping, participants use a combination of
    brainstorming and diagramming techniques to record their ideas.


    **Affinity Diagrams** Affinity diagrams sort ideas into related groups for further
    analysis and review.


    **Multicriteria Decision Analysis** With multicriteria decision analysis, a decision
    matrix is used for establishing criteria for a systematic analytical approach.


    # Group Decision-Making Techniques


    According to the *PMBOK® Guide*, several group decision-making techniques are
    used. The four methods mentioned are as follows:


    +   - Unanimity, where everyone agrees on the resolution or course of action

    +   - Majority, where more than 50 percent of the members support the resolution

    +   - Plurality, where the largest subgroup within the group makes the decision
    if a majority is not reached

    +   - Dictatorship, where one person makes the decision on behalf of the group


    # Questionnaires and Surveys


    Questionnaires and surveys involve querying a large group of participants via
    questionnaires or surveys and applying statistical analysis, if needed, to the
    results. This is considered to be a quick way of obtaining feedback from a large
    number of stakeholders.


    # Observations


    Observations consist of a one-on-one experience where an observer sits side by
    side with the participant to observe how the participant interacts with the product
    or service. This technique is also known as job shadowing; it can also involve
    participant observers who perform the job themselves to ascertain requirements,
    or the observation of a group of participants performing a job function. Observations
    are particularly useful when stakeholders have a difficult time verbalizing requirements.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '**Prototypes** Prototyping is a technique involving constructing a working
    model or mock-up of the final product for participants to experiment with. The
    prototype does not usually contain all the functionality the end product does,
    but it gives participants enough information that they can provide feedback regarding
    the mock-up. This is an iterative process where participants experiment and provide
    feedback, the prototype is revised, and the cycle starts again. Prototypes are
    a great way of getting feedback during the early stages of a project’s life cycle.


    **Benchmarking** Ever like to see how you measure up against other organizations
    or internal projects? With benchmarking there is a comparison of actual or planned
    practices against comparable organizations to measure performance, to glean new
    ideas to be used to improve your organization, and to identify best practices.


    **Context Diagrams** Use of context diagrams helps to visually represent the product
    scope by mapping a business system with the people and other systems that interact
    with that business system. This is done by displaying the business system inputs
    and user roles, and then depicting the inputs, outputs, and user roles for those
    who receive the output.


    **Document Analysis** Another technique used in the identification of requirements
    is documents analysis, where existing documentation is reviewed to see if there
    is relevant information to complete the requirements. According to the *PMBOK®
    Guide*, a great variety of documents could be scrutinized, including but not limited
    to the following:


    +   - Business plans

    +   - Marketing materials

    +   - Contractual agreements

    +   - Requests for proposals

    +   - Business processes or interface documentation

    +   - Use cases

    +   - Problem/issues logs

    +   - Policies and procedures

    +   - Regulatory documents


    # Outputs of Collect Requirements


    For the exam, know the outputs of the Collect Requirements process, which are
    as follows:


    **Requirements Documentation** This output involves recording the requirements
    in a requirements document. According to the *PMBOK® Guide*, this document includes
    at least the following elements:


    +   - Business need for the project and why it was undertaken

    +   - Objectives of the project and the business objectives the project hopes
    to fulfill

    +   - Stakeholder requirements, including impacts to other organizational areas

    +   - Functional requirements

    +   - Nonfunctional requirements'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   *   Quality requirements

    +   *   Acceptance criteria

    +   *   Business rules

    +   *   Organizational areas and outside entities impacted

    +   *   Support and training requirements

    +   *   Assumptions and constraints

    +   *   Signatures of the key stakeholders


    **Requirements Traceability Matrix**  The traceability matrix links requirements
    to business needs and project objectives and also documents the following:


    +   *   Where the requirement originated

    +   *   What the requirement will be traced to

    +   *   Status updates all the way through delivery or completion


    ![](img/c077f27110b08d0d6c301ce24ad84100_118_0.png)


    *According to the PMBOK® Guide, the requirements traceability matrix helps assure
    that business value is realized when the project is complete because each requirement
    is linked to a business and project objective.*


    Table 3.1 shows a sample traceability matrix with several attributes that identify
    the requirement.


    # TABLE 3.1  Requirements traceability matrix


    | Unique ID | Description of requirement | Source | Priority | Test scenario |
    Test verification | Status |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 001 | Requirement one | Project objective and stakeholder | B | User acceptance
    | | Approved |


    Here are the characteristics of a traceability matrix:


    +   *   Each requirement should have its own unique identifier.

    +   *   A brief description includes enough information to easily identify the
    requirement.

    +   *   The source column refers to where the requirement originated.

    +   *   Priority refers to the priority of the requirement.

    +   *   The test scenario records how the requirement will be tested or during
    which project phase, and test verification indicates if it passes or fails the
    test.

    +   *   Status may capture information about the requirement that refers to whether
    the requirement has been approved to be included in the project. Examples include
    added, deferred, and canceled.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# **Exam Essentials**


    **Understand the purpose of collecting requirements.** Requirements are collected
    to define and document the project sponsors'', customers'', and stakeholders''
    expectations and needs for meeting the project objective.


    After requirements have been gathered, the next step is to begin breaking down
    and documenting the project and product''s scope. The end result will be a WBS,
    which is a deliverable-oriented, high-level decomposition of the project work.
    But before the WBS can be generated, a few additional steps must be addressed:


    +   *   The creation and sign-off of the project scope statement

    +   *   The creation of a scope baseline


    The project scope statement is an output of the Define Scope process and is where
    the project deliverables are documented along with the constraints and assumptions
    of the project. Once the project scope statement, WBS, and another output called
    the WBS dictionary are created, they become part of a scope baseline.


    # ## Define Scope


    The result and main objective of the Define Scope process is the creation of the
    project scope statement. The project scope statement is used to develop and document
    a detailed description of the deliverables of the project and the work needed
    to produce them. This process addresses the project objectives, requirements,
    constraints, assumptions, and other elements of writing the project scope statement
    and is progressively elaborated as more detail becomes known.


    Figure 3.3 shows the inputs, tools and techniques, and outputs of the Define Scope
    process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_120_0.png)


    > For more detailed information on the Define Scope process, see Chapter 3 of
    *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.


    # Inputs of Define Scope


    The Define Scope process has four inputs you should know:


    **Scope Management Plan** The scope management plan outlines how this process
    is to be carried out.


    **Project Charter** From within the project charter, this process primarily utilizes
    the project objectives. Objectives are quantifiable criteria used to measure project
    success. They describe what the project is trying to do, accomplish, or produce.
    Quantifiable criteria should at least include the following items:


    +   * Schedule

    +   * Cost

    +   * Quality measures

    +   * Business measures or quality targets (sometimes)


    **Requirements Documentation** The requirements documentation includes elements
    such as functional and nonfunctional characteristics, quality metrics, and acceptance
    criteria. For a more detailed description, see “Outputs of Collect Requirements”
    earlier in this chapter.


    **Organizational Process Assets** This process uses historical information from
    within the organizational process assets as well as policies, procedures, and
    project scope statement templates.


    # Tools and Techniques of Define Scope


    Know the following tools and techniques that you will use during the Define Scope
    process:


    **Expert Judgment** According to the *PMBOK® Guide*, the following items are examples
    of expert judgment used in this process:


    +   * Subject matter experts or consultants

    +   * Stakeholders

    +   * Industry groups and associations

    +   * Other departments or units internal to the organization


    **Product Analysis** Product analysis is a method for converting the product description
    and project objectives into deliverables and requirements. According to the *PMBOK®
    Guide*, product analysis might include performing the following to further define
    the product or service:


    +   * Value analysis

    +   * Functional analysis'
  merge: -1
  img_proc: true
