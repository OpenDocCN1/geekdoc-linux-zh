  md: '**Calculating the Critical Path** A critical path task is any task that cannot
    be changed without impacting the project end date. By definition, these are all
    tasks with zero float. To determine the CP duration of the project, add the duration
    of every activity with zero float.


    Another way to determine the critical path is by determining the longest path
    within the network diagram. This can be done by adding the duration of all the
    activities within each path of the network.


