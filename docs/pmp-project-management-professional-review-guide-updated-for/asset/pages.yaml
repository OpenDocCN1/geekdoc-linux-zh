    # # Executing the Project


    **THE PMP® EXAM CONTENT FROM THE EXECUTING THE PROJECT PERFORMANCE DOMAIN COVERED
    IN THIS CHAPTER INCLUDES THE FOLLOWING:**


    +   * Acquire and manage project resources by following the human resource and
    procurement management plans in order to meet project requirements.


    +   * Manage task execution based on the project management plan by leading and
    developing the project team in order to achieve project deliverables.


    +   * Implement the quality management plan using the appropriate tools and techniques
    in order to ensure that work is being performed in accordance with required quality
    standards.


    +   * Implement approved changes and corrective actions by following the change
    management plan in order to meet project requirements.


    +   * Implement approved actions by following the risk management plan in order
    to minimize the impact of risks and take advantage of opportunities on the project.


    +   * Manage the flow of information by following the communications plan in order
    to keep stakeholders engaged and informed.


    +   * Maintain stakeholder relationships by following the stakeholder management
    plan in order to receive continued support and manage expectations.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_249_0.png)


    Executing is the third process group of the five project management plan. The
    processes in this group are responsible for executing the work outlined in the
    project management plan, managing the project resources, and performing the work
    of the project. Within this process group, you will also see approved changes
    and actions implemented as well as re-planning and re-baselining as a result of
    implemented changes. Executing also involves keeping the project in line with
    the original plan. The majority of the project budget and time will be spent in
    this process group, and the majority of conflicts will relate to the schedule.
    In addition, the product description will be finalized and contain more detail
    than it did in the planning processes. The Executing process group accounts for
    31 percent of the questions on the Project Management Professional (PMP®) exam.


    The process names, inputs, tools and techniques, outputs, and descriptions of
    the project management process groups and related materials and figures in this
    chapter are based on content from *A Guide to the Project Management Body of Knowledge
    (PMBOK® Guide)*, *Fifth Edition* (PMI®, 2013).


    # # Obtaining and Managing Resources


    As mentioned previously, the Executing process group involves performing the project
    work. Naturally, this cannot be accomplished without first acquiring the resources
    needed to perform the project work. Obtaining resources occurs through the Acquire
    Project Team process (which is part of the Project Human Resource Management Knowledge
    Area) and the Conduct Procurements process (which is a part of the Project Procurement
    Management Knowledge Area). The human resource and procurement management plans
    play an important role in carrying out these processes because they outline how
    resources will be acquired, managed, and released throughout the project life
    cycle.


    # ## Acquire Project Team


    The Acquire Project Team process involves acquiring and assigning human resources,
    both internal and external, to the project. It is the project manager’s responsibility
    to ensure that'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'resources are available and skilled in the project activities to which they''re
    assigned. This process considers the following factors:


    +   - The process of negotiation with individuals who can provide the needed human
    resources

    +   - The consequences of not obtaining the human resources

    +   - Alternative resources should the planned resources not be available as a
    result of circumstances out of the project manager''s control


    Figure 4.1 shows the inputs, tools and techniques, and outputs of the Acquire
    Project Team process.


    # Figure 4.1 Acquire Project Team process


    ![](img/c077f27110b08d0d6c301ce24ad84100_250_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_250_1.png)


    > For more detailed information on the Acquire Project Team process, see Chapter
    8, "Developing the Project Team," of PMP$: Project Management Professional Exam
    Study Guide, Eighth Edition (Sybex, 2016).


    # Inputs of Acquire Project Team


    Know the following inputs of the Acquire Project Team process:


    **Human Resource Management Plan** The human resource management plan, a subsidiary
    of the project management plan, is essential to this process. The following are
    used from within this plan:


    +   - Roles and responsibilities

    +   - Project organization chart

    +   - Staffing management plan'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'The staffing management plan should detail how the team will be acquired.


    **Enterprise Environmental Factors** The enterprise environmental factors used
    in this process involve taking the following information into account before making
    assignments:


    +   - Personal interests

    +   - Cost rates

    +   - Prior experience

    +   - Availability and information of potential team members

    +   - Personnel administration policies

    +   - Organizational structure

    +   - Locations


    **Organizational Process Assets** The organizational process assets input refers
    to the standard processes, policies, procedures, and guidelines that the organization
    has in place. This includes policies related to acquiring external resources.
    In particular, recruitment practices should be taken into account.


    # ## Tools and Techniques of Acquire Project Team


    Be familiar with the following tools and techniques of the Acquire Project Team
    process:


    +   - Preassignment

    +   - Negotiation

    +   - Acquisition

    +   - Virtual teams

    +   - Multicriteria decision analysis


    **Preassignment** Preassignment may take place when the project is put out for
    bid and specific team members are promised as part of the proposal or when internal
    project team members are promised and assigned as a condition of the project.
    Preassignments are documented within the project charter.


    **Negotiation** Project managers may use negotiation techniques when dealing with
    functional managers and other organizational department managers—and sometimes
    with the vendor to get some of their best people—for project resources and for
    the timing of those resources.


    The following items are typically negotiated:


    +   - Availability

    +   - Competency level of the staff member assigned


    **Acquisition** Acquisition involves hiring individuals or teams of people for
    certain project activities, as either employees or contract help during the course
    of the project or project phase or for specific project activities.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '**Virtual Teams** According to the PMBOK® Guide, virtual teams are defined
    as groups of people with a shared goal who fulfill their roles with little or
    no time spent meeting face to face. The use of virtual teams makes it possible
    to draw in resources that wouldn''t otherwise be available. It also reduces travel
    expenses by allowing teams to work from home. Virtual teams typically connect
    using technology tools, such as the Internet, email, and videoconferencing.


    Communication becomes essential when functioning in a virtual structure. All team
    members should be made aware of the protocols for communicating in a virtual team
    environment, understand the expectations, and be clear on the decision-making
    processes.


    **Multicriteria Decision Analysis** Multicriteria decision analysis involves the
    use of selection criteria to make decisions on whether potential project team
    members are a fit. Criteria are typically assigned a weight based on their level
    of importance, and candidates are then rated against the criteria. Some examples
    of criteria used include availability, experience, ability, and cost.


    # Outputs of Acquire Project Team


    Know the following three outputs of the Acquire Project Team process:


    **Project Staff Assignments** Project staff assignments are based on the results
    of negotiating and determining elements such as the roles and responsibilities
    and reviewing recruitment practices. This output also results in a published project
    team directory, which lists the names of all project team members and stakeholders.


    **Resource Calendars** Resource calendars show the team members'' availability
    and the times they are scheduled to work on the project. A composite resource
    calendar includes availability information for potential resources as well as
    their capabilities and skills.


    **Project Management Plan Updates** As a result of performing the Acquire Project
    Team process, updates will be made to the human resource management plan and its
    corresponding staffing management plan.


    # Conduct Procurements


    In some cases, resources will need to be procured externally. The Conduct Procurements
    process is concerned with obtaining responses to bids and proposals from potential
    vendors, selecting a vendor, and awarding the contract. This process is used only
    when goods or services are obtained from outside of the project''s organization.
    After this process is conducted, sellers will have been selected, contracts awarded,
    and project documents updated to reflect the selected vendors.


    Figure 4.2 shows the inputs, tools and techniques, and outputs of the Conduct
    Procurements process.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Figure 4.2  Conduct Procurements process


    ![](img/c077f27110b08d0d6c301ce24ad84100_253_0.png)


    > For more detailed information on the Conduct Procurements process, see Chapter
    9, “Conducting Procurements and Sharing Information,” in PMP®: Project Manager
