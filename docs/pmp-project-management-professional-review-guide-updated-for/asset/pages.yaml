- pgno: 201
  md: '**Be able to identify the contract types and their usage.** Contract types
    are a tool and technique of the Plan Procurement Management process and include
    fixed-price and cost-reimbursable contracts. Use fixed-price contracts for well-defined
    projects with a high value to the company, and use cost-reimbursable contracts
    for projects with uncertainty and large investments early in the project life.
    The three types of fixed-price contracts are FPF, FPIC, and FP-EPA. The three
    types of cost-reimbursable contracts are CPF, CPIF, and CPAF. Time and material
    contracts are a cross between fixed-price and cost-reimbursable contracts.


    **Be able to name the outputs of the Plan Procurement Management process.** The
    outputs of Plan Procurement Management are a procurement management plan, procurement
    statement of work, procurement documents, source selection criteria, make-or-buy
    decisions, change requests, and project documents updates.


    # # Developing a Change Management Plan


    Managing changes is important to successfully managing a project overall. Scope
    creep is often the result of a poorly documented scope and poorly documented change
    control procedures. To ensure that changes are managed appropriately, a change
    management plan should be created. It should be noted that there isn’t a formal
    documented process that creates this plan.

    The change management plan should document the following:


    +   - How changes will be monitored and controlled

    +   - Detailed processes for managing change to a project

    +   - How change requests are to be documented and managed

    +   - Process for approving changes

    +   - How to document and manage the final recommendation for the change requests


    # # Developing a Risk Management Plan


    The first official step in performing risk management is creating a risk management
    plan. This is done by carrying out the Plan Risk Management process, which is
    the first official process of the Project Risk Management Knowledge Area. Five
    of the six processes that fall in this Knowledge Area belong to the Planning process
    group.

    The risk management plan is created to manage uncertainty throughout the project
