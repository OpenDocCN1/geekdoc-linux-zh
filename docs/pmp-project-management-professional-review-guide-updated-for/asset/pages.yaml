- pgno: 329
  md: 'it applies to quality states that a small number of causes (20 percent) create
    the majority of the problems (80 percent). Pareto theorized that you get the most
    benefit by spending the majority of time fixing the most important problems.


    The information shown in Table 5.4 is plotted on an example Pareto diagram shown
    in Figure 5.11.


    # **TABLE 5.4** Frequency of failures


    | Item | Defect frequency | Percent of defects | Cumulative percent |

    | :--- | :--- | :--- | :--- |

    | A | 800 | .33 | .33 |

    | B | 700 | .29 | .62 |

    | C | 400 | .17 | .79 |

    | D | 300 | .13 | .92 |

    | E | 200 | .08 | 1.0 |


    # **FIGURE 5.11** Pareto diagram


    ![](img/c077f27110b08d0d6c301ce24ad84100_329_0.png)


    The problems are rank-ordered according to their frequency and percentage of defects.
    The defect frequencies in this figure appear as black bars, and the cumulative
    percentages of defects are plotted as circles. The rank ordering of these problems
    demonstrate where corrective action should be taken first.'
