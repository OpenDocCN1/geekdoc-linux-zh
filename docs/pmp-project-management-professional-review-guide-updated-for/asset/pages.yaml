- pgno: 235
  md: '# Bringing the Processes Together


    This chapter covered a tremendous amount of information; the Planning process
    group is the largest project management process group. In addition to understanding
    each process individually, you’ll need to know how the processes work together.
    Understanding that bigger picture will help you with situational exam questions
    as well as using the project management processes in a real-world setting.


    Now that you have a strong grasp of how the outputs from various processes become
    the inputs for other processes, you understand why some processes must occur before
    others can move forward. For example, to create the project management plan, the
    results of the Initiating process group are required. Figure 3.49 shows this interaction
    between the Initiating process group and the Planning process group, the first
    two stages of the project’s life cycle. The relationship between the project management
    plan and the rest of the planning processes is just as interactive, if not more
    dynamic.


    ![](img/c077f27110b08d0d6c301ce24ad84100_235_0.png)


    The project management plan is used in Planning processes across nine of the ten
    Knowledge Areas. (The remaining Knowledge Area generates the project management
    plan.) The results of these planning processes are fed back into the project management
    plan as updates. The updates might, in turn, impact several of the other planning
    processes. For example, the project management plan contains the cost management
    plan. Any changes that are approved in the cost management plan become updates
    to the project management plan. As a result, these approved and updated changes
    could impact other planning processes that might *also* require that updates and
    changes be made.


    By now, it should be clear that the project management plan is the heart of the
    project and that much of the project’s success can be based on the processes of
    the Planning process group. A common motto in the project management industry
    is, “A well-planned project makes for a successful project.” Figure 3.50 illustrates
    how the project management plan remains at the center of the Planning process
    group.'
  merge: -1
  img_proc: true
