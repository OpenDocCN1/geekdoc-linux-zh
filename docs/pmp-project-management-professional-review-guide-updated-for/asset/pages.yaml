  md: '+   *   Summary budget

    +   *   List of stakeholders known

    +   *   Criteria for project approval

    +   *   Name of the project manager and their authority levels

    +   *   Name of the sponsor (or authorizer of the project) and their authority
    levels


    **Exam Essentials**


    **Be able to list the Develop Project Charter inputs.**  The inputs for Develop
    Project Charter are project statement of work, business case, agreements, enterprise
    environmental factors, and organizational process assets.


    **Be able to describe the purpose of the business case.**  The purpose of a business
    case is to understand the business need for the project and determine whether
    the investment in the project is worthwhile.


    # Obtaining Project Charter Approval


    The project charter isn''t complete until sign-off has been received from the
    project sponsor, senior management, and key stakeholders. Sign-off indicates that
    the document has been read by those signing it and that they agree with the contents
    and are on board with the project. The signature signifies the formal authorization
    of the project. Acceptance of the charter is also important to formalize the assignment
    of the project manager and their level of authority.


    The last step in this process is publishing the charter. Publishing, in this case,
    simply means distributing a copy of the project charter to the key stakeholders,
    the customer, the management team, and others who might be involved with the project.
    Publication can take several forms, including printed format or electronic format
    distributed via the company email system or the company intranet.


    **Exam Essentials**


    **Be able to describe the importance of the project charter.**  The project charter
    is the document that officially recognizes and acknowledges that a project exists.
    The charter authorizes the project to begin. It authorizes the project manager
    to assign resources to the project and documents the business need and justification.
    The project charter describes the customer''s requirements and ties the project
    to the ongoing work of the organization.'
