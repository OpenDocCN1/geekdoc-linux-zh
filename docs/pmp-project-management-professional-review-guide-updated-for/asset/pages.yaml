  img_proc: true
- pgno: 177
  md: 'the first place, costs are lower, conformance to requirements is easily met,
    and the cost measurement for quality becomes the cost of nonconformance rather
    than the cost of rework.


    **Joseph M. Juran** Joseph M. Juran is known for the fitness for use premise,
    which means the stakeholders’ and customers’ expectations are met or exceeded
    and reflects their views of quality. Juran proposed that there could be grades
    of quality.


    ![](img/c077f27110b08d0d6c301ce24ad84100_177_0.png)


    > *Grade* is a category for products or services that are of the same type but
    have differing technical characteristics. *Quality* describes how well the product
    or service (or characteristics of the product or service) fulfills the requirements.
    *Low quality* is usually not an acceptable condition, whereas *low grade* might
    be.


    **W. Edwards Deming** W. Edwards Deming suggested that as much as 85 percent of
    the cost of quality is management’s responsibility, which came to be known as
    the 85 percent rule or rule of 85. He believed that workers need to be shown what
    acceptable quality is and that they need to be provided with the right training
    so that quality and continuous improvement become natural elements of the working
    environment. Deming was also a major contributor to the modern quality movement
    and theories, which emphasize a more proactive approach to quality management
    (prevention over inspection). For example, he documented 14 points that summarize
    how management can transform their organization to one that is effective. This
    and his body of work have been credited for launching the Total Quality Management
    (TQM) movement. He also popularized the Plan-Do-Check-Act cycle, also referred
    to as the Deming Cycle, which focuses on continuous improvement.


    Six Sigma is a measurement-based strategy that focuses on process improvement
    and variation reduction by applying Six Sigma methodologies to the project. There
    are two Six Sigma methodologies:


    +   * DMADV (define, measure, analyze, design, and verify) is used to develop
    new processes or products at the Six Sigma level.

    +   * DMAIC (define, measure, analyze, improve, and control) is used to improve
    existing processes or products.


    **Walter Shewhart** According to some sources, Walter Shewhart is the grandfather
    of statistical quality control and the Plan-Do-Check-Act model, which was further
    popularized by Deming. Shewhart developed statistical tools to examine when a
    corrective action must be applied to a process. He is also known for the control
    chart techniques.


    **Kaizen Approach** The Kaizen approach—*kaizen* means improvement in Japanese—is
    a technique in which all project team members and managers should be constantly
    watching for quality improvement opportunities. The Kaizen approach states that
    the'
