    +   - Personnel skill updates


    **Organizational Process Assets Updates** The organizational process asset updates
    output has three components:


    +   - Historical information and lessons learned documentation

    +   - Templates

    +   - Organizational standard processes


    # ### Exam Essentials


    **Be able to describe the purpose of the Develop Project Team process.** The Develop
    Project Team process is concerned with creating a positive environment for team
    members; developing the team into an effective, functioning, coordinated group;
    and increasing the team’s competency levels.


    **Be able to name the five stages of group formation.** The five stages of group
    formation are forming, storming, norming, performing, and adjourning.


    **Be able to define Maslow’s highest level of motivation.** Self-actualization
    occurs when a person performs at their peak and all lower-level needs have been
    met.


    **Be able to name the five types of power.** The five levels of power are reward,
    punishment, expert, legitimate, and referent.


    **Be able to identify the five styles of conflict resolution.** The five styles
    of conflict resolution are forcing, smoothing, compromising, collaborating, and
    withdrawal.


    **Be able to name the tools and techniques of the Manage Project Team process.**
    The tools and techniques of Manage Project Team are observation and conversation,
    project performance appraisal, conflict management, issue log, and interpersonal
    skills.


    # # Executing the Project Management Plan


    Executing the project management plan is carried out through the Direct and Manage
    Project Work process, which is a process that belongs to the Project Integration
    Management Knowledge Area. This is where the project work is carried out, according
    to the plan, as a way of producing the deliverables on time and on budget. The
    Direct and Manage Project Work process is also responsible for implementing changes
    that have'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'been approved by the change control board. Typically, approved changes are
    implemented according to the change management plan as a way of meeting project
    requirements.


    When implementing the plan, the project manager will need to be proactive in managing
    project communications. This includes distributing relevant project information
    in an efficient and effective manner. Managing stakeholder expectations is also
    important at this stage. Both of these objectives can be accomplished by carrying
    out the Manage Communications and Management Stakeholder Engagement processes
    in accordance with the communications management plan and stakeholder management
    plan.


    # Direct and Manage Project Work


    The **Direct and Manage Project Work** process is responsible for carrying out
    the project management plan. The project manager oversees the actual work, staying
    on top of issues and problems and keeping the work lined up with the plan. Coordinating
    and integrating all the elements of the project are among the most challenging
    aspects of this process.


    According to the *PMBOK*® Guide, this process also requires implementing corrective
    actions to bring the work of the project back into alignment with the project
    management plan, preventive actions to reduce the probability of negative consequences,
    and repairs to correct product defects discovered during the quality management
    processes.


    Figure 4.9 shows the inputs, tools and techniques, and outputs of the Direct and
    Manage Project Work process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_272_0.png)


    > For more detailed information on the Direct and Manage Project Work process,
    see Chapter 8 in *PMP*®: Project Management Professional Exam Study Guide, Eighth
    Edition.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Inputs of Direct and Manage Project Work


    Know the following inputs of the Direct and Manage Project Work process:


    +   Project management plan


    +   Approved change requests


    +   Enterprise environmental factors


    +   Organizational process assets


    **Project Management Plan** The project management plan documents the collection
    of outputs from the planning processes and describes and defines the work to be
    carried out and how the project should be executed, monitored, controlled, and
    closed.


    **Approved Change Requests** Approved change requests come about as a result of
    the change request status updates output of the Perform Integrated Change Control
    process. Approved change requests are then submitted as inputs to the Direct and
    Manage Project Work process for implementation. Implementation of approved changes
    may also include the implementation of workarounds, which are unplanned responses
    to negative risks that have occurred.


    **Enterprise Environmental Factors** The following enterprise environmental factors
    are considered when performing the Direct and Manage Project Work process:


    +   Company culture and organizational structure


    +   Facilities available to the project team


    +   Personnel guidelines and hiring practices


    +   Risk tolerance levels


    +   Project management information systems


    **Organizational Process Assets** The following organizational process assets
    are used in the Direct and Manage Project Work process:


    +   Historical information from past projects


    +   Organizational guidelines and work processes


    +   Process measurement databases


    +   Issue and defect databases


    # Tools and Techniques of Direct and Manage Project Work


    You should be familiar with the following tools and techniques of the Direct and
    Manage Project Work process:


    **Expert Judgment** Expert judgment is provided by the project manager and project
    team members as well as by the following sources:


    +   Industry and professional associations


    +   Consultants'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - Stakeholders

    +   - Other units within the company


    **Project Management Information System** As used in the Direct and Manage Project
    Execution process, the project management information system (PMIS) provides the
    ability to connect to automated tools, such as scheduling software and configuration
    management systems, that can be used during project execution.


    **Meetings** Meetings are a key tool in managing the work of the project. According
    to the *PMBOK® Guide*, there are three types of meetings: information exchange,
    working sessions such as brainstorming and design, and decision making.


    # Outputs of Direct and Manage Project Work


    These five outputs result from carrying out the Direct and Manage Project Work
    process:


    +   - Deliverables

    +   - Work performance data

    +   - Change requests

    +   - Project management plan updates

    +   - Project documents updates


    **Deliverables** According to the *PMBOK® Guide*, a deliverable (see Figure 4.10)
    is defined as any unique and verifiable product, result, or capability to perform
    a service that is required to be produced to complete a process, phase, or project.


    ![](img/c077f27110b08d0d6c301ce24ad84100_274_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_274_1.png)


    During the Direct and Manage Project Work process, the following information regarding
    the outcomes of the work is gathered and recorded:


    +   - Activity completion dates

    +   - Milestone completions

    +   - Status of the deliverables'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - Quality of the deliverables

    +   - Costs

    +   - Schedule progress and updates


    ![](img/c077f27110b08d0d6c301ce24ad84100_275_0.png)


    > Although the PMBOK® Guide breaks up these processes for ease of explanation,
    several of the Executing and Monitoring and Controlling processes are performed
    together. Remember that the processes are iterative.


    **Work Performance Data** Work performance data involves gathering, documenting,
    and recording the status of project work. Here are types of information that may
    be gathered during this process:


    +   - Schedule status and progress

    +   - Status of deliverable completion

    +   - Progress and status of schedule activities

    +   - Adherence to quality standards

    +   - Status of costs (those authorized and costs incurred to date)

    +   - Schedule activity completion estimates for those activities started

    +   - Percentage of schedule activities completed

    +   - Lessons learned

    +   - Resource consumption and utilization


    **Change Requests** Changes can come about from several sources, including stakeholder
    requests, external sources, and technological advances. An approved change request
    will supplant the existing document, deliverable, or baseline, and are agreed
    on through negotiation of the requestor and the project team. Change requests
    may encompass changes to the following:


    +   - Schedule

    +   - Scope

    +   - Requirement

    +   - Resource changes


    Implementation of change requests may incorporate the following actions:


    **Corrective Actions** Corrective actions are taken to get the anticipated future
    project outcomes to align with the project plan.


    **Preventive Actions** Preventive actions involve anything that will reduce the
    potential impacts of negative risk events should they occur. Contingency plans
    and risk responses are examples of preventive action.


    **Defect Repairs** Defects are project components that do not meet the requirements
    or specifications. Defect repairs are discovered during quality audits or when
    inspections are performed. A validated defect repair is the result of a re-inspection
    of the original defect repair.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '**Project Management Plan Updates** The following project management plan updates
    may occur as a result of the Direct and Manage Project Execution process:


    +   - Subsidiary project plans

    +   - Project baselines


    **Project Documents Updates** The following project documents may undergo updates
    as a result of the Direct and Manage Project Execution process:


    +   - Requirements documentation and project logs

    +   - Risk register

    +   - Stakeholder register


    # ## Manage Communications


    The Manage Communications process is responsible for getting information about
    the project to stakeholders in a timely manner. It describes how reports, and
    other information, are collected, stored, retrieved, and distributed, and to whom.
    Executing the communications management plan also occurs during this process.


    Figure 4.11 shows the inputs, tools and techniques, and outputs of the Manage
    Communications process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_276_0.png)


    > > **NOTE**

    > > For more detailed information on the Manage Communications process, see Chapter
    9 of *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Inputs of Manage Communications


    Know the following inputs of the Manage Communications process:


    **Communications Management Plan**  The communications management plan, a subsidiary
    plan of the project management plan, is put into action during this process.


    **Work Performance Reports**  Work performance reports are used to distribute
    performance and status information to the appropriate individuals.


    **Enterprise Environmental Factors**  Enterprise environmental factors used through
    this process includes the organizational culture and structure; any standards,
    such as govern-ment or industry-related; and the project management information
    system.


    **Organizational Process Assets**  For this process, organizational process assets
    refer to any policies, procedures, and guidelines that the organization already
    has in place for distrib-uting information and any existing documents and information
    that are relevant to the process.


    # Tools and Techniques of Manage Communications


    The tools and techniques of the Manage Communications process include the following
    five items:


    **Communication Technology**  Technology is often used to disseminate informa-tion
    to stakeholders, as appropriate, and as described within the communications management
    plan.


    **Communication Models**  The communication model selected for managing communica-tions
    should be based on the communication needs of the project.


    **Communication Methods**  Communication methods include all means feasible to
    commu-nicate project information to the appropriate individuals:


    +   - Meetings

    +   - Email messages

    +   - Videoconferences

    +   - Conference calls

    +   - Other remote access tools or methods


    **Information Management Systems**  The following information distribution tools
    are used to get the project information to the project team or stakeholders:


    +   - Electronic tools, such as software, online-based tools, and portals

    +   - Electronic project management tools

    +   - Hard copy


    **Performance Reporting**  Performance reporting refers to the actual collection
    and distribu-tion of information, typically through the form of a project status
    report. This may include'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'a diverse set of reports, such as basic reporting to detailed and complex analysis
    of the project team''s performance. Performance reporting may also be communicated
    via progress metrics and forecasts.


    # Outputs of Manage Communications


    Manage Communications results in four outputs that you should know: project communications,
    updates to the project management plan, project documents, and the organizational
    process assets.


    **Project Communications** Project communications refers to the actual communication
    produced, often by the project manager. Examples of project communications presented
    by the PMBOK$^{\circledR}$ Guide include performance reports, deliverable status,
    schedule progress, and actual costs to date.


    **Project Management Plan Updates** Typical updates produced to the project management
    plan as a result of this process include updates to the communications management
    plan, stakeholder management plan, and project baselines.


    **Project Documents Updates** Project documents updated as a result of carrying
    out this process often include updates made to the issue log, schedule, and project
    funding requirements.


    **Organizational Process Assets Updates** There can be several updates to the
    organizational process assets as a result of carrying out this process. These
    updates are listed and described in Table 4.1.


    TABLE 4.1  Organizational process assets updates


    | Update item | Description |

    | :--- | :--- |

    | Stakeholder notifications | Notifications sent to stakeholders when solutions
    and approved changes have been implemented, the project status has been updated,
    issues have been resolved, and so on. |

    | Project reports | The project status reports and minutes from project meetings,
    lessons learned, closure reports, and other documents from all the process outputs
    throughout the project. |

    | Project presentations | Project information presented to the stakeholders and
    other appropriate parties when necessary. |

    | Project records | Memos, correspondence, and other documents concerning the
    project. |'
  merge: -1
  img_proc: true
