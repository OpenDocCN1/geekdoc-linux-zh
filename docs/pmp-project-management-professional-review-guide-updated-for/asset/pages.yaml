    # Leads and Lags


    Consider applying leads and lags when determining dependencies:


    +   - **Leads** Leads speed up the successor activities and require time to be
    subtracted from the start date or the finish date of the activity you''re scheduling.

    +   - **Lags** Lags delay successor activities (those that follow a predecessor
    activity) and require time added either to the start date or to the finish date
    of the activity being scheduled.


