    # Exam Essentials


    **Know the difference between the precedence diagramming method (PDM) and the
    arrow diagramming method (ADM).** PDM uses boxes or rectangles to represent the
    activities (called *nodes*) that are connected with arrows showing the dependencies
    between the activities. ADM places activities on the arrows (called *activity
    on arrow*), which are connected to dependent activities with nodes.'
