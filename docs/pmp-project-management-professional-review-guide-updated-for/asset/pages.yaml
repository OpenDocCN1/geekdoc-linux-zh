  md: '![](img/c077f27110b08d0d6c301ce24ad84100_71_0.png)


    Initiating is the first of the five project management process groups as defined
    by the Project Management Institute (PMI®). Initiating acknowledges that a new
    project (or the next phase within a project) should begin. This process group
    culminates in the publication of a project charter and a stakeholder register.


    Before diving into the Initiating process group, we’ll provide a high-level review
    of the ten Project Management Knowledge Areas, which is another way of classifying
    the project management processes. This review offers a high-level look at the
    Knowledge Areas and insight as to how they are tied into the five process groups.


    The Initiating process group accounts for 13 percent of the questions on the Project
    Management Professional (PMP®) exam.


    > The process names, inputs, tools and techniques, outputs, and descriptions of
    the project management process groups and related materials and figures in this
    chapter are based on content from *A Guide to the Project Management Body of Knowledge
    (PMBOK® Guide), Fifth Edition* (PMI®, 2013).


    # # Understanding the Project Management Knowledge Areas


    Throughout the project life cycle, a project utilizes a collection of processes
    that can be classified by the five process groups mentioned in Chapter 1, “Project
    Foundation.” They are Initiating, Planning, Executing, Monitoring and Controlling,
    and Closing. Processes can also be classified into 10 categories called the Project
    Management Knowledge Areas, which bring together processes that have characteristics
    in common. According to the *PMBOK® Guide*, the 10 Knowledge Areas are as follows:


    +   - Project Integration Management

    +   - Project Scope Management

    +   - Project Time Management

    +   - Project Cost Management

    +   - Project Quality Management

    +   - Project Human Resource Management

    +   - Project Communications Management'
  merge: -1
  img_proc: true
