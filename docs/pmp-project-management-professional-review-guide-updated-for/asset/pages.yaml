- pgno: 91
  md: 'Using the **PV** formula shown previously, calculate each project’s worth:


    $PV$ of Project A = **$79,719**

    $PV$ of Project B = **$85,414**


    Project B is the project that will return the highest investment to the company
    and should be chosen over Project A.


    # NET PRESENT VALUE


    *Net present value (NPV)* allows you to calculate an accurate value for the project
    in today’s dollars. NPV works like discounted cash flows in that you bring the
    value of future monies received into today’s dollars. With NPV, you evaluate the
    cash inflows using the discounted cash flow technique applied to each period the
    inflows are expected instead of in one sum. The total present value of the cash
    flows is then deducted from your initial investment to determine NPV. NPV assumes
    that cash inflows are reinvested at the cost of capital.


    Here are some important notes on NPV calculations:


    +   - If the NPV calculation is greater than zero, accept the project.

    +   - If the NPV calculation is less than zero, reject the project.

    +   - Projects with high returns early in the project are better projects than
    projects with lower returns early in the project.


    # INTERNAL RATE OF RETURN


    *Internal rate of return (IRR)* is the discount rate when the present value of
    the cash inflows equals the original investment. When choosing between projects
    or when choosing alternative methods of doing a project, projects with higher
    IRR values are generally considered better than projects with low IRR values.


    Keep the following in mind:


    +   - IRR is the discount rate when NPV equals zero.

    +   - IRR assumes that cash inflows are reinvested at the IRR value.

    +   - You should choose projects with the highest IRR value.


    **Exam Essentials**

    **Be able to distinguish between the seven needs or demands that bring about project
    creation.** The seven needs or demands that bring about project creation are market
    demand, organizational need, customer requests, technological advances, legal
    requirements, ecological impacts, and social needs.

    **Be able to define decision models.** Decision models are project selection methods
    that are used prior to the Develop Project Charter process to determine the viability
    of the project. Decision models include benefit measurement methods and mathematical
    models.'
  merge: -1
