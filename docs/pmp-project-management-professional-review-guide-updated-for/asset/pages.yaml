- pgno: 70
  md: '# Chapter

    ## 2


    # # Initiating the Project


    ![](img/c077f27110b08d0d6c301ce24ad84100_70_0.png)


    **THE PMP® EXAM CONTENT FROM THE INITIATING THE PROJECT PERFORMANCE DOMAIN COVERED
    IN THIS CHAPTER INCLUDES THE FOLLOWING:**


