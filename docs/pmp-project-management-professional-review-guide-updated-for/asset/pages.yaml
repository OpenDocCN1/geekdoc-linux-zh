- pgno: 211
  md: '**Expert Judgment** Experts for risk identification purposes can include individuals
    with the following experience:


    +   * Experience with similar projects

    +   * Experience in the business area for which the project was undertaken

    +   * Industry-specific experience


    The bias of experts regarding the project or potential risk events should be considered
    when using this technique.


    # Outputs of Identify Risks


    There is only one output of the Identify Risks process: the risk register.


    ![](img/c077f27110b08d0d6c301ce24ad84100_211_0.png)


    There will be other risk-related planning processes that will continue to add
    information to the risk register.


    The risk register contains the following elements:


    +   * List of identified risks

    +   * List of potential responses


    **List of Identified Risks** Risks are all the potential events and their subsequent
    consequences that could occur as identified during this process. A list provides
    a means of tracking risks and their occurrence and responses. The list should
    contain the following items:


    +   * All potential risks

    +   * Tracking number

    +   * Potential cause or event

    +   * Potential impact

    +   * Responses implemented


    **List of Potential Responses** While you’re identifying risks, you may identify
    a potential response at the same time. If this is the case, these potential responses
    are documented.


    Table 3.7 shows a sample template for a risk register.


    # Perform Qualitative Risk Analysis


    The Perform Qualitative Risk Analysis process involves determining what impact
    the identified risks will have on the project objectives and the probability that
    they will occur. It also ranks the risks in priority order according to their
    effect on the project objectives. The purpose of this process is to determine
    risk event probability and risk impact. By the end of this process, updates will
    have been made to the risk register.'
