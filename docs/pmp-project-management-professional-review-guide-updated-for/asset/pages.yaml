    Expert Judgement  Expert judgment used includes staff members who will perform
    the activities and is based on their experience with past similar activities.
    When estimating durations, experts should consider the following:


    +   - Resource levels

    +   - Resource productivity

    +   - Resource capability

    +   - Risks

    +   - Any other factors that can impact estimates


    Analogous Estimating  Analogous estimating is commonly used when little detail
    is available on the project. For a complete description of analogous estimating,
    see “Tools and Techniques of Estimate Costs” later in this chapter.


    Parametric Estimating  Parametric estimating is a quantitatively based estimating
    method that multiplies the quantity of work by the rate. It is considered to be
    a quick and low-cost estimating technique, with a good level of accuracy when
    used with actual historical data and current market conditions that take inflation
    or other factors into consideration. The best way to describe it is with an example:


    Activity: install fifteen 10×10 drapes.


    Average time to install one 10×10 drape, based on previous experience: 30 minutes.


    Estimate: Therefore, installing 15 drapes at an average 30-minute installation
    time per drape results in an estimated duration of 7.5 hours.


    > The PMBOK® Guide states that parametric estimating can also be used to determine
    time estimates for the entire project or portions of the project.


    Three-Point Estimating  Three-point estimating uses the average of the following
    three estimates to result in a final estimate:


    Most Likely (ML) The estimate assumes there are no disasters and the activity
    can be completed as planned.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '**Optimistic (O)** This represents the fastest time frame in which your resource
    can complete the activity.


    **Pessimistic (P)** The estimate assumes the worst happens and it takes much longer
    than planned to get the activity completed.


    The concept of the three-point estimate comes from the Program Evaluation and
    Review Technique (PERT), which uses the following formula to determine the weighted
    average using the three duration estimates:


    (Optimistic + 4×(Most Likely) + Pessimistic) ÷ 6


    In the following example, the Most Likely (ML) estimate = 15, the Optimistic (O)
    estimate = 11, and the Pessimistic (P) estimate = 2.5.


    (11 + 4(15) + 25) ÷ 6


    Thus, the activity duration = 16.


    # **Day of the Exam**


    This is another formula that would be helpful to add to scratch paper before you
    begin the exam: (Optimistic + 4 × (Most Likely) + Pessimistic) ÷ 6. The purpose
    in creating a key on your scratch paper is perhaps it frees your mind to focus
    entirely on the problem you are attempting to solve, and does not introduce further
    stress caused by trying to remember equations.


    **Group Decision-Making Techniques** It is helpful to have multiple alternatives
    for future actions when estimating activity durations, and the group decision-making
    technique is an assessment process that delivers those alternatives. By engaging
    team members, it helps to improve estimate accuracy and commitment to the emerging
    estimates, which has the byproduct of helping win the hearts and minds of those
    contributing to the project.


    **Reserve Analysis** Reserve time—also called buffer/time reserves or contingency
    reserve in the *PMBOK® Guide*—is the portion of time added to the activity to
    account for schedule risk or uncertainty. To make sure the project schedule is
    not impacted, a reserve time of the original estimate is built in to account for
    the problems that may be encountered.


    +   * Original activity duration to install fifteen 10×10 drapes: 7.5 hours.

    +   * 10 percent reserve time added: 45 minutes.'
