  img_proc: true
- pgno: 233
  md: '**TABLE 3.10** Project management plan summary *(continued)*


    | Subsidiary plan or document | Description |

    | :--- | :--- |

    | Schedule management plan | This plan identifies the scheduling format, tool,
    and methodology that will be used for creating and managing the project schedule.
    |

    | Cost management plan | This plan defines the criteria for planning, budgeting,
    estimating, and managing the costs of the project. It also identifies the cost-related
    formats and tools that will be used in the project. |

    | Quality management plan | This plan describes how the organization''s quality
    policies will be implemented and addresses the following items: quality assurance,
    quality control, and process improvement. |

    | Human resource management plan | This plan documents how human resources should
    be defined, staffed, managed and controlled, and released from the project. |

    | Communications management plan | This plan guides the communication for the
    project. It defines the communication requirements of the stakeholders as well
    as the format, type, frequency, and methods for project reports. It also lists
    report recipients and anything else pertinent to project communication. |

    | Risk management plan | This plan defines how risk management activities will
    be carried out. It also outlines the budget and time allotted for risk activities,
    risk roles and responsibilities, risk categories, and how risks will be defined
    and assessed. |

    | Procurement management plan | This plan describes how procurements will be managed,
    from make-or-buy decisions all the way through contract closure. |

    | Stakeholder management plan | This plan identifies the management strategies
    necessary to effectively engage stakeholders. |

    | Schedule baseline | This baseline is an approved version of the project schedule
    that will be used to compare and measure the planned schedule against the actual
    schedule. |

    | Cost baseline | This baseline contains an approved budget that is used to measure,
    monitor, and control the planned budget against the actual amount of funds used.
    |

    | Scope baseline | This baseline provides scope boundaries for the project and
    consists of the project scope statement, the work breakdown structure (WBS), and
    the WBS dictionary. |'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_234_0.png)


    Subsidiary and component plans may be detailed or simply a synopsis, depending
    on the project needs. As the project progresses and more and more processes are
    performed, the subsidiary plans and the project management plan itself may change.


    # Exam Essentials


    Be able to state the purpose of the Develop Project Management Plan process. The
    project management plan defines how the project is executed, monitored and controlled,
    and closed, and it documents the processes used during the project.


    # Conducting a Kickoff Meeting


    A kickoff meeting typically occurs at the end of the planning process, prior to
    beginning the project work. The purpose of the kickoff meeting is to ensure that
    everyone is aware of the project details and their role within the project and
    to announce that the project work is ready to begin. This is a great opportunity
    to review project milestones and other important information with key stakeholders.


    # Meeting Attendees


    Those who attend a kickoff meeting include, but are not limited to, the following
    individuals:


    +   - Project manager

    +   - Project team members

    +   - Customer

    +   - Project sponsor

    +   - Department managers

    +   - Other key stakeholders


    # Meeting Topics


    The topics discussed within a kickoff meeting include, but are not limited to,
    the following:


    +   - Introductions of attendees

    +   - Meeting agenda

    +   - Review of the project management plan'
