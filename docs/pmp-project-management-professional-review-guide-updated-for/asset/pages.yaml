- pgno: 136
  md: '**Activity Attributes** Activity attributes may reveal information on the sequencing
    of activities, such as through predecessor or successor relationships.


    **Milestone List** Milestone lists may contain milestones with scheduled dates.
    These dates might impact the sequencing of activities.


    **Project Scope Statement** The product scope description in the project scope
    statement includes product details that may be used for sequencing activities.


    **Enterprise Environmental Factors** Sequence activities may be influenced by
    enterprise environmental factors such as government or industry standards, the
    project management information system, schedule tool, and any company work authorization
    systems.


    **Organizational Process Assets** The project files found within the corporate
    knowledge base are used from within the organizational process assets for scheduling
    purposes.


    # ### Tools and Techniques of Sequence Activities


    You will need to be familiar with the following tools and techniques of the Sequence
    Activities process:


    +   - Precedence diagramming method (PDM)

    +   - Dependency determination

    +   - Leads and lags


    **Precedence Diagramming Method** The precedence diagramming method (PDM) uses
    boxes or rectangles to represent the activities (called nodes). The nodes are
    connected with arrows showing the dependencies between the activities. This method
    is also called activity on node (AON). PDM uses only one-time estimates to determine
    duration.


    The following information is displayed on a node:


    +   - Activity name (required)

    +   - Activity number (optional)

    +   - Start and stop dates (optional)

    +   - Due dates (optional)

    +   - Slack time (optional)

    +   - Any additional or relevant information (optional)


    The following illustration shows a general example of a PDM, or AON.


    ![](img/c077f27110b08d0d6c301ce24ad84100_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The PDM is further defined by the following four types of dependencies, also
    known as logical relationships:


    **Finish-to-Start** The finish-to-start (FS) relationship is the most frequently
    used relationship. In this relationship, the predecessor activity must finish
    before the successor activity can start.


    **Start-to-Finish** In the start-to-finish (SF) relationship, the predecessor
    activity must start before the successor activity can finish. This logical relationship
    is seldom used.


    **Finish-to-Finish** In the finish-to-finish (FF) relationship, the predecessor
    activity must finish before the successor activity finishes.


    **Start-to-Start** In the start-to-start (SS) relationship, the predecessor activity
    must start before the successive activity can start.


    **Day of the Exam**


    Memorize a diagram of the precedence diagramming methods like activity-on-node
    (AON) to add to your scratch paper at the start of the exam.


    **Dependency Determination** Dependencies are relationships between the activities
    in which one activity is dependent on another to complete an action, or perhaps
    an activity is dependent on another to start an action before it can proceed.
    Dependency determination is a matter of determining where those dependencies exist.


    The following are four types of dependencies, defined by characteristics:


    +   - **Mandatory Dependencies** Mandatory dependencies, also known as hard logic
    or hard dependencies, are defined by the type of work being performed. The nature
    of the work itself dictates the order in which the activities should be performed.

    +   - **Discretionary Dependencies** Discretionary dependencies are defined by
    the project team. Discretionary dependencies are also known as preferred logic,
    soft logic, or preferential logic. These are usually process- or procedure-driven
    or best-practice techniques based on past experience.

    +   - **External Dependencies** External dependencies are external to the project.
    The *PMBOK® Guide* points out that even though the dependency is external to the
    project (and therefore a non-project activity), it impacts project activities.

    +   - **Internal Dependencies** Internal dependencies are internal to the project.
    These dependencies involve a precedence relationship between project activities
    that are within the project team’s ability to control.


    **Arrow Diagramming Method** The arrow diagramming method (ADM) technique isn’t
    used nearly as often as PDM. ADM is visually the opposite of the PDM. The arrow
    diagramming method places activities on the arrows, which are connected to dependent'
