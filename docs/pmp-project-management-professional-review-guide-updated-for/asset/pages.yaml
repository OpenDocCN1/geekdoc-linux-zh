- pgno: 369
  md: "closure be obtained. This is important to communicating formal closure and\
    \ to ensuring that no further liability exists after the project has been completed.\n\
    \nIt’s important to note that a project can move into the Closing process group\
    \ for several reasons:\n\n+   It’s completed successfully.\n+   \n+   It’s canceled\
    \ or killed prior to completion.\n+   \n+   It evolves into ongoing operations\
    \ and no longer exists as a project.\n\n# ## Formal Project Endings\n\nAside from\
    \ these common reasons that result in a project moving into the Closing processes,\
    \ there are four formal types of project endings that you should be familiar with:\
    \ addition, starvation, integration, and extinction.\n\n**Addition** A project\
    \ that evolves into ongoing operations is considered a project that ends because\
    \ of addition, moving into its own ongoing business unit. Once it experiences\
    \ this transition, it no longer meets the definition of a project.\n\n**Starvation**\
    \ Starvation occurs when resources are cut off from a project prior to the completion\
    \ of all the requirements. This results in an unfinished project. Starvation often\
    \ occurs as a result of shifting priorities, a customer’s cancellation of an order\
    \ or request, the project budget being reduced, or key resources quitting.\n\n\
    **Integration** Integration occurs when the resources of a project (such as people,\
    \ equipment, property, and supplies) are distributed to other areas in the organization\
    \ or are assigned to other projects. In other words, resources have been reassigned\
    \ or redeployed, causing an end to the project.\n\n**Extinction** Extinction occurs\
    \ when a project has completed and stakeholders have accepted the end result.\
    \ This is the best type of ending because the project team has completed what\
    \ they set out to achieve.\n\nIn all cases, it’s important to retain good documentation\
    \ that describes why a project ended early. Performing a project review in these\
    \ cases is important to retaining key details and specifics regarding why a project\
    \ ended before all requirements were completed.\n\n# ## Trends\n\nAnother notable\
    \ piece of information involves stakeholder influence and cost trends that occur\
    \ during project closure. Stakeholders tend to have the least amount of influence\
    \ during the Closing processes, while project managers have the greatest amount\
    \ of influence. Costs are significantly lower during the Closing processes because\
    \ the majority of the project work and spending has already occurred."
  merge: -1
  img_proc: true
- pgno: 370
  md: '# ## Administrative Closure


    As part of administrative closure, resources will need to be released and the
    administrative closure procedures carried out.


    # ### Release Resources


    Although releasing project team members is not an official process, you will release
    your project team members at the conclusion of the project, and they will go back
    to their functional managers or be assigned to a new project if you''re working
    in a matrix-type organization. The release of project resources is addressed within
    the staff release plan.


    The staff release plan is one of the items within the staffing management plan,
    which in turn is included within the human resource management plan, a subsidiary
    project management plan. The following are the primary items covered in the staff
    release plan, which includes the release of resources not just at the end of the
    project, but in general at any point within the project:


    +   - Outlines the method for resource release

    +   - Defines when resources are to be released


    Once resources are released, the costs of the resources are no longer charged
    to the project. The staff release plan helps mitigate human resource risks that
    may occur during or at the conclusion of the project.


    # ### Perform Administrative Closure


    Administrative closure procedures involve the following:


    +   - Collecting all the records associated with the project

    +   - Analyzing the project success (or failure)

    +   - Documenting and gathering lessons learned

    +   - Properly archiving project records

    +   - Documenting the project team members'' and stakeholders'' roles and responsibilities:

    +       - Approval requirements of the stakeholders for project deliverables and
    changes to deliverables

    +       - Confirmation that the project meets the requirements of the stakeholders,
    customers, and sponsor

    +       - Documented actions to verify that the deliverables have been accepted
    and exit criteria have been met


    Figure 6.4 shows the elements of the administrative closure procedures.'
  merge: -1
  img_proc: true
