    +   • Quality audit reports

    +   • Process documentation

    +   • Training plans


    # Exam Essentials


    **Be able to describe the purpose of the Perform Quality Assurance process.**
    The Perform Quality Assurance process is concerned with making certain the project
    will meet and satisfy the quality standards of the project.


    # # Implementing the Risk Management Plan


    As the work of the project is executed, predefined risk triggers may occur and
    some risks will be realized, calling for the execution of risk response plans,
    contingency plans, and fallback plans. These responses are defined within the
    risk register and should be managed according to the risk management plan. The
    risk management plan is important in reducing the impact of negative risks on
    the project.


    Because the *PMBOK® Guide* addresses the executing activities of risk management
    within the Monitoring and Controlling process group, this will be further addressed
    in Chapter 5.


    # Exam Essentials


    **Be able to describe where risk response plans are documented and when they are
    executed.** Risk response plans, contingency plans, and fallback plans are documented
    in the risk register and are executed when predefined risk triggers occur.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Bringing the Processes Together


    Let’s briefly review the processes that were covered in this chapter and, more
    importantly, how these processes work together. You may recall that the primary
    objective of the Executing process group is to complete the work defined in the
    project management plan. In addition to this, we coordinate and manage resources,
    implement approved changes, and manage communications.


    As we went through the processes covered in this chapter, you may have noticed
    an ongoing theme: human resources. Whether these resources were internal to the
    organization or external, we covered a lot of information that deal with the project
    team, including obtaining the resources and managing them. We also covered the
    management of stakeholder expectations and their engagement.


    Figure 4.15 shows how people-centric the Executing process group really is. Within
    the realms of this figure, we see the following take place:


    +   - The project information is planned.

    +   - The planned information is handed off to the project team for execution
    of the project work.

    +   - The project team’s execution of the work generates results, which must be
    monitored and controlled.

    +   - The results are fed back into the previous processes as necessary to improve
    the work and make changes and updates as needed.


    ![](img/c077f27110b08d0d6c301ce24ad84100_287_0.png)


    Clearly, a lot of behind-the-scenes effort goes into the executing stage. For
    example, the project team must be assembled and managed.


    Altogether, we covered eight processes within this chapter, which make up the
    Executing process group. These processes spanned the following Knowledge Areas:


    +   - Project Integration Management

    +   - Project Quality Management'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   * Project Human Resource Management

    +   * Project Communications Management

    +   * Project Procurement Management

    +   * Project Stakeholder Management


    Next, we will review the process interactions that occur within each Knowledge
    Area during the Executing process group.


    # # Project Integration Management Knowledge Area Review


    During the Executing process group, the Project Integration Management Knowledge
    Area covers the implementation of the project management plan through a single
    process known as the Direct and Manage Project Work process. As Figure 4.16 shows,
    the project management plan and the approved changes (which occur after the work
    has already been executed) are carried out through this process. As a result,
    deliverables and information on the work performance during the project are generated.


    **FIGURE 4.16** Process interaction—integration


    ![](img/c077f27110b08d0d6c301ce24ad84100_288_0.png)


    # # Project Quality Management Knowledge Area Review


    The Perform Quality Assurance process is the only quality-related process that
    falls within the Executing process group. As you may recall, this is where auditing
    takes place, which ultimately leads to implemented changes and continuous process
    improvement. The following items are among those that are audited:


    +   * Quality requirements

    +   * Results from quality control measurements'
