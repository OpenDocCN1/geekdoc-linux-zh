- pgno: 268
  md: '**Issue Log** The issue log is a place to document the issues that prevent
    the project team from meeting project goals. In addition to the issue, the following
    should be noted:


    +   * Who is responsible for resolving the issue

    +   * Date the resolution is needed


    In terms of this process, the issue log provides key information on open issues
    and who is responsible for their resolution or follow-up. This information allows
    the project manager to maintain oversight in ensuring that the project team follows
    up as necessary.


    **Work Performance Reports** Work performance reports document the status of the
    project compared to the forecasts. For additional information on performance reports,
    see the outputs of the Monitor and Control Project Work process in Chapter 5,
    “Monitoring and Controlling the Project,” in this book.


    **Organizational Process Assets** Organizational process assets used in this process
    include any existing organizational perks and forms of recognition.


    # # Tools and Techniques of Manage Project Team


    Know the following tools and techniques of the Manage Project Team process:


    +   * Observation and conversation

    +   * Project performance appraisals

    +   * Conflict management

    +   * Interpersonal skills


    **Observation and Conversation** Observing team performance can be used as an
    assessment tool. Both observation and conversation help the project management
    team stay tuned in to the attitudes and feelings of the project team members,
    making both an important tool for communication.


    **Project Performance Appraisals** Project performance appraisals are typically
    annual or semiannual affairs where managers let their employees know what they
    think of their performance and rate them accordingly. These are usually manager-to-employee
    exchanges but can incorporate a 360-degree review, which takes in feedback from
    nearly everyone the team member interacts with, including key stakeholders, customers,
    project managers, peers, subordinates, and the delivery person if they have a
    significant amount of project interaction.


    Performance appraisal time is also a good time to do the following:


    +   * Assess training needs

    +   * Clarify roles and responsibilities

    +   * Set goals for the future'
