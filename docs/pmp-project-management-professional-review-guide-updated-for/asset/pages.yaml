    # ## Developing a Human Resource Management Plan


    The project manager creates a human resource management plan by carrying out a
    process called Plan Human Resource Management. Through this process, roles and
    responsibilities of the project team members are defined and the strategies for
    using and managing the project team are documented. The high-level purpose of
    the plan itself is to create an effective project organization structure.


    The Plan Human Resource Management process documents the roles and responsibilities
    of individuals or groups for various project elements and then documents the reporting
    relationships for each. Reporting relationships can be assigned to groups as well
    as to individuals, and the groups or individuals might be internal or external
    to the organization or a combination of both. This process will result in the
    creation of the human resource management plan, which considers factors such as
    the availability of resources, skill levels, training needs, and more.


    > NOTE For more detailed information on the Plan Human Resource Management process,
    see Chapter 7, "Planning Project Resources," of PMIP: Project Management Professional
    Exam Study Guide, Eighth Edition.


    Figure 3.27 shows the inputs, tools and techniques, and outputs of the Plan Human
    Resource Management process.'
