    # Exam Essentials


    **Know the process and output responsible for archiving project documents.** Final
    project documents are archived as part of the organizational process assets updates
    output through the Close Project or Phase process.


    # Measuring Customer Satisfaction


    According to the *PMBOK* Guide, project success is measured by the following criteria:


    +   Product and project quality


    +   Timeliness


    +   Budget compliance


    +   Degree of customer satisfaction


    Customer satisfaction is an important goal you’re striving for in any project.
    If your customer is satisfied, it means you’ve met their expectations and delivered
    the product or service as defined within the planning processes. Customer satisfaction
    can be measured through quality management, which in part is concerned with making
    sure that customer requirements are met. This is done through understanding, evaluating,
    defining, and managing customer and stakeholder expectations.


    As Figure 6.5 illustrates, modern quality management achieves customer satisfaction
    in part by ensuring that the project accomplishes what it set out to do (conformance
    to requirements) and that it satisfies real needs (fitness for use).


    ![](img/c077f27110b08d0d6c301ce24ad84100_373_0.png)'
  merge: -1
