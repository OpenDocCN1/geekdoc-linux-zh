    For more detailed information on the Monitor and Control Project Work process,
    see Chapter 10, “Measuring and Controlling Project Performance,” in *PMP®: Project
    Management Professional Exam Study Guide, Eighth Edition* (Sybex, 2016).


    # Inputs of Monitor and Control Project Work


    Know the following inputs of the Monitor and Control Project Work process:


    +   ■ Project management plan

    +   ■ Schedule forecasts

    +   ■ Cost forecasts

    +   ■ Validated changes'
