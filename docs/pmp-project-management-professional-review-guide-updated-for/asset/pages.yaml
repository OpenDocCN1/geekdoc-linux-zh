    # # Maximizing Team Performance


    Maximizing team performance involves leading, mentoring, training, and motivating
    team members. The project manager leads these efforts with the guidance of the
    documented human resource management plan. The processes used to achieve maximum
    team performance include Develop Project Team and Manage Project Team, which are
    both a part of the Project Human Resource Management Knowledge Area.


    To be successful, project managers will need to be familiar with several leadership
    theories, the stages of team development, motivational theories, and leadership
    styles. Being familiar with and understanding conflict resolution techniques and
    types of power are also important when managing teams.


    # ## Develop Project Team


    The Develop Project Team process is concerned with creating a positive environment
    for team members; developing the team into an effective, functioning, coordinated
    group; and increasing the team''s competency levels. The proper development of
    the team is critical to a successful project. Since teams are made up of individuals,
    individual development becomes a critical factor to project success.


    Figure 4.3 shows the inputs, tools and techniques, and outputs of the Develop
    Project Team process.


