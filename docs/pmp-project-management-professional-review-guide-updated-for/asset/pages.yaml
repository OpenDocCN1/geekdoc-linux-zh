- pgno: 339
  md: '**Organizational Process Assets**  The following organizational process assets
    are used by this process:


    +   Change control and authorization procedures

    +   - Process measurement database

    +   - Configuration management knowledge base

    +   - Project files


    # ## Tools and Techniques of Perform Integrated Change Control


    The Perform Integrated Change Control process has three tools and techniques that
    you will need to be familiar with:


    **Expert Judgment**  The following sources of expert judgment may be used in this
    project:


    +   - The project management team

    +   - Key stakeholders

    +   - Subject matter experts

    +   - Consultants

    +   - Industry or professional groups

    +   - The project management office, if applicable


    **Meetings**  Change control meetings are meetings in which the change control
    board reviews and makes decisions on submitted change requests. Roles and responsibilities
    for a change control board, when they are needed on the project, are clearly defined
    and agreed upon by appropriate stakeholders. The change control board is established
    to review all change requests and is given the authority to approve or deny them.
    This authority is defined by the organization. The decisions should be documented
    and reviewed by stakeholders.


    **Change Control Tools**  Change control tools come in the form of manual or automated
    systems that are used to help facilitate the change management process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_339_0.png)


    The *PMBOK*® *Guide* states that the change control board is made up of a group
    of stakeholders who review and then approve, delay, or reject change requests.


    You will also need to know about configuration management systems and change control
    systems, which are not listed as tools and techniques of the process but directly
    influence how the process is carried out.


    **Configuration Management System**  Configuration management is generally a subsystem
    of the PMIS. It involves managing approved changes and project baselines. According
    to'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'the PMBOK® Guide, the following activities are associated with configuration
    change management in this process:


    **Configuration Identification** Configuration identification describes the characteristics
    of the product, service, or result of the project. This description is the basis
    used to verify when changes are made and how they’re managed.


    **Configuration Status Accounting** This includes the approved configuration identification,
    the status of proposed changes, and the status of changes currently being implemented.


    **Configuration Verification and Auditing** Verification and audits are performed
    to determine whether the configuration item is accurate and correct and to make
    certain the performance requirements have been met.


    ![](img/c077f27110b08d0d6c301ce24ad84100_340_0.png)


    > It is the project manager’s responsibility to manage changes and see that organizational
    policies regarding changes are implemented.


    **Change Control System** Change control systems are documented procedures that
    describe how the deliverables of the project and associated project documentation
    are controlled, changed, and approved. Here are some things to note about change
    control systems:


    +   - Often describe how to submit change requests and how to manage change requests

    +   - Are usually subsystems of the configuration management system

    +   - Track the status of change requests

    +   - Ensure that changes that are not approved are tracked and filed in the change
    control log for future reference

    +   - Define procedures that detail how emergency changes are approved


    In addition, you should know about implementing these two types of systems. The
    PMBOK® Guide gives these three objectives for implementing and using configuration
    management systems and change control processes:


    +   - Establish a method to consistently identify changes, request changes to
    project baselines, and analyze and determine the value and effectiveness of the
    changes.

    +   - Continuously authenticate and improve project performance by evaluating
    the impact of each change.

    +   - Communicate all change requests, whether approved, rejected, or delayed,
    to all the stakeholders.


    Figure 5.17 provides a brief overview of the configuration management and change
    control systems.'
