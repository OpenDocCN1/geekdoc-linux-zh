- pgno: 127
  md: '**Lowest Level** The lowest level of any WBS is called the work package level.
    The goal is to construct the WBS to the work package level where cost estimates
    and schedule dates can be estimated reliably and easily.


    ![](img/c077f27110b08d0d6c301ce24ad84100_127_0.png)


    Work packages are the components that can be easily assigned to one person, or
    a team of people, with clear accountability and responsibility for completing
    the assignment. The work package level will later be decomposed further into lists
    of activities.


    Collectively, all the levels of the WBS roll up to the top so that all the work
    of the project is captured. According to the *PMBOK*® *Guide*, this is known as
    the 100 percent rule.


    ![](img/c077f27110b08d0d6c301ce24ad84100_127_1.png)


    For more information on WBS, and for industry-specific examples of WBS templates,
    refer to the *Practice Standard for Work Breakdown Structures, Second Edition*
    (PMI®, 2006).


    Here are the other elements of the WBS that you should know:


    **WBS Templates** Work breakdown structures can be constructed using WBS templates
    or the WBS from a similar completed project. Although every project is unique,
    many companies and industries perform the same kind of projects repeatedly.


    **Rolling Wave Planning** Rolling wave planning is a process of elaborating deliverables,
    project phases, or subprojects in the WBS to differing levels of decomposition
    depending on the expected date of the work.


    **Unique WBS Identifiers** Each element at each level of the WBS is generally
    assigned a unique identifier according to the *PMBOK*® *Guide*. Figure 3.8 shows
    what a WBS with unique identifiers displayed might look like.


    # **FIGURE 3.8** Unique WBS identifiers


    ![](img/c077f27110b08d0d6c301ce24ad84100_127_2.png)'
  merge: -1
  img_proc: true
