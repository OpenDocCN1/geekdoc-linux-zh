- pgno: 330
  md: '# Ensuring Adherence to Quality Standards


    # **Histograms**


    Histograms are bar charts that depict the distribution of variables over time.
    In the Control Quality process, the histogram usually depicts the attributes of
    the problem or situation.


    # **Control Charts**


    Control charts measure the results of processes over time and display the results
    in graph form. They provide a way of measuring variances to determine whether
    process variances are in or out of control.


    A control chart is based on sample variance measurements. From the samples chosen
    and measured, the mean and standard deviation are determined. Quality is usually
    maintained—or said to be in control—in plus or minus three standard deviations,
    also referred to as the upper and lower control limits.


    Figure 5.12 illustrates a sample control chart.


    # **FIGURE 5.12** Control chart


    ![](img/c077f27110b08d0d6c301ce24ad84100_330_0.png)


    Out-of-control variances should be investigated to determine whether corrective
    action is needed.


    For reference, know that standard deviation, or sigma, is equal to the following
    levels of quality:


    +   * ±1 sigma is equal to 68.27 percent

    +   * ±2 sigma is equal to 95.46 percent

    +   * ±3 sigma is equal to 99.73 percent

    +   * ±6 sigma is equal to 99.99 percent


    If the process measurements fall in the control limits, then 99.73 percent (3
    sigma) of the parts going through the process will fall in an acceptable range
    of the mean.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '**Scatter Diagrams** Scatter diagrams use two variables, one called an independent
    variable, which is an input, and one called a dependent variable, which is an
    output. Scatter diagrams display the relationship between these two elements as
    points on a graph. This relationship is typically analyzed to prove or disprove
    cause-and-effect relationships.


    Figure 5.13 shows a sample scatter diagram.


    # FIGURE 5.13 Scatter diagram


    ![](img/c077f27110b08d0d6c301ce24ad84100_331_0.png)


    **Statistical Sampling** Statistical sampling involves taking a sample number
    of parts from the whole population and examining them to determine whether they
    fall in acceptable variances. The quality management plan defines how to measure
    the results.


    **Inspection** Inspection involves physically looking at, measuring, or testing
    results to determine whether they conform to the requirements or quality standards.
    Inspection will tell you where problems exist and gives you the opportunity to
    correct them, thus leading to quality improvements. Here’s some additional information
    to know about inspections:


    +   * Inspections might occur after the final product is produced or at intervals
    during the development of the product to examine individual components.

    +   * Inspections are also known as *reviews* and *peer reviews*.

    +   * Measurements that fall in a specified range are called tolerable results.

    +   * One inspection technique uses measurements called attributes. Attribute
    sampling is used to verify conformance and nonconformance to predefined specifications.


    **Approved Change Requests Review** Change requests that have been approved and
    implemented are reviewed to ensure that they were implemented correctly.'
  merge: -1
  img_proc: true
