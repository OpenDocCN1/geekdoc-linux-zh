  md: '+   - Probability describes the potential for the risk event occurring.

    +       - Impact describes the effects or consequences the project will experience
    if the risk event occurs.


    **Probability and Impact Matrix**  A probability and impact matrix prioritizes
    the combination of probability and impact scores and helps determine which risks
    need detailed risk response plans.


    # Identify Risks


    The Identify Risks process describes all the risks that might impact the project
    and documents their characteristics in the risk register. Identify Risks is an
    iterative process that continually builds on itself as additional risks emerge.
    The risk register is created at the end of this process. The risk register documents
    all risk information, proposed responses, responses implemented, and status.


    Figure 3.35 shows the inputs, tools and techniques, and outputs of the Identify
    Risks process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_206_0.png)'
