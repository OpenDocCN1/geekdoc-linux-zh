- pgno: 381
  md: '# Chapter 1: Project Foundation


    +   1.  B. Ongoing operations are continuous without a specific end date, whereas
    projects have definite start and end dates.


    +   2.  C. Although all the options appear attractive, a project is not considered
    successful until it has met the expectations of the project stakeholders.


    +   3.  C. Programs include groups of related projects managed in a coordinated
    fashion. Each project under a program is managed by its own project manager, who
    reports to a project manager responsible either for that area of the program or
    for the entire program.


    +   4.  A. The functional organization type is considered to be the traditional
    approach to organizing businesses. Functional organizations can be centered on
    specialties, grouped by function, and displayed as a hierarchy.


    +   5.  B. Assuring efficient use of resources toward a specific business goal
    is the role of a portfolio manager. Although a PMO may help manage resources across
    projects, it doesn’t manage resources toward a specific goal, but rather manages
    the objectives of a collective set of projects.


    +   6.  B. Within a projectized organization, project managers have high to ultimate
    authority, giving them the capability of assigning resources.


    +   7.  A. Integration refers to a Knowledge Area within the *PMBO K® Guide*,
    which will be addressed in a future chapter. Because the word closely resembles
    Initiating, the first process group within the project life cycle, they can easily
    be confused.


    +   8.  B. Costs are highest during the Executing process group, since this is
    where the most time and resources are used within a project.


    +   9.  D. This describes the Plan-Do-Check-Act cycle, which was originally defined
    by Walter Shewhart and later modified by Edward Deming.


    +   10. B. While having a strong knowledge of finance and accounting principles
    would be beneficial to a project manager, only a basic level of knowledge is required.


    +   11. C. Within a functional organization, the functional manager has a higher
    level of authority over the project manager, who has minimal to none.


    +   12. D. Do not confuse the project life cycle that all projects go through
    with the process groups that are identified in the *PMBO K® Guide*. The project
    life cycle consists of (1) starting the project, or initiating, (2) planning the
    work, (3) performing the project work, and (4) closing out the project.


    +   13. A. Business skills listed in this chapter include communication, budgeting,
    organization, problem solving, negotiation and influencing, leading, and team
