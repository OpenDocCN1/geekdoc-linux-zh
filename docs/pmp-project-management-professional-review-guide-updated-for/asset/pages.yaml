- pgno: 9
  md: 'A special thanks to the individuals who are such a big part of my life and
    who have always influenced me in a magnificent way. This includes my family, Nicolas
    Mangano, Marysil Mangano, Nicolas Mangano Jr., Carina Moncrief and her husband,
    Jonathan Moncrief; and my beautiful nieces, Kaylee, Alyssa, Yasin, and Riana—you
    mean everything to me! Thank you to Al Smith Jr., who is supportive and an inspiration
    to me—I enjoy all of our adventures and accomplishments together! And finally,
    thank you to Roshoud Brown, who always encouraged me to write and inspired me
    with his own words.


    —Vanina Mangano


    I could not have asked for two better contributors to work with on a book than
    Vanina Mangano and Kim Heldman, and I want to thank them for the opportunity to
    join their team in collaborating on this book. Vanina’s talent, experience, and
    drive are extraordinary, and she willingly shared her passion and knowledge with
    me. Her sense of humor and attention to detail helped make the process fun and
    helped us deliver a superior product to the reader. Kim Heldman is a superior
    mentor who freely shares her enthusiasm, knowledge, humility, and leadership,
    and her contributions are what makes this book great. She has consistently pushed
    me to believe in myself, helping me to grow into the best professional I can be.
    It has been an honor to work with this team and help other prepare to the take
    the PMP<sup>®</sup> exam.


    Everyone needs their first opportunity, and I would like to thank Kenyon Brown
    for giving me my first shot at contributing to a book. And I would also like to
    thank Alexa Murphy and the editorial team for their push to make this product.


    A commitment of this size normally requires a compromise in another part of one’s
    life. Accordingly, I want to thank my three children, Kayla, Marcus, and Adric,
    for being willing to have Papa retreat to working on this book. They all kept
    their sense of humor, though, and they know that I will follow my wireless mouse
    anywhere. However, without my wonderful wife April I would not have the successes
    in my life like finishing this book. April is always there to hear my stories,
    talk me down after a bad day, laugh at my jokes, share a movie with me, and encourage
    me to be even better than I thought I could be. There is no greater cheerleader
    in all the world, and I am humbled that she cheers for me.


    —Brett Feddersen


    We would like to thank Liz Welch, copyeditor, who made sure grammar and spelling
    were picture perfect; Rebecca Rider, proofreader, for catching those last little
    “oops”; and Dassi Zeidel, production editor, who made sure everything flowed through
    the production process. Thanks also to our composer, and the indexer, Ted Laux.
    The book couldn’t happen without them.


    —The Authors'
