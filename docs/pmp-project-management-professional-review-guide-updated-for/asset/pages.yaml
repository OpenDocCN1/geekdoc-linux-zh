- pgno: 325
  md: '# Exam Essentials


    **Name the purpose of the Validate Scope process.** The purpose of Validate Scope
    is to determine whether the work is complete and whether it satisfies the project
    objectives.


    **Describe the purpose of the Control Costs process.** The Control Costs process
    is concerned with monitoring project costs to prevent unauthorized or incorrect
    costs from being included in the cost baseline.


    **Be able to describe earned value management techniques.** Earned value management
    (EVM) monitors the planned value (PV), earned value (EV), and actual cost (AC)
    expended to produce the work of the project. Cost variance (CV), schedule variance
    (SV), cost performance index (CPI), and schedule performance index (SPI) are the
    formulas used with the EVM technique.


    **Know the purpose of the Control Scope and Control Schedule processes.** The
    purpose of the Control Scope process is to monitor project and product scope and
    manage changes to the scope baseline. The purpose of the Control Schedule process
    is to monitor the status of the project’s progress and to manage changes to the
    schedule baseline.


    **Be able to name the tools and techniques of the Control Costs process.** The
    tools and techniques of Control Costs are earned value management, forecasting,
    to-complete performance index, performance reviews, project management software,
    and reserve analysis.


    # Ensuring Adherence to Quality Standards


    The Control Quality process is responsible for ensuring that project deliverables
    conform to the quality standards as laid out in the quality management plan. This
    inspection can be carried out by using several tools and techniques, such as control
    charts and testing, in order to satisfy customer requirements.


    # Control Quality


    The Control Quality process identifies the causes of poor product quality or processes
    and makes recommendations to bring them up to the required levels. Quality control
    is practiced throughout the project to identify and remove the causes of unacceptable
    results.


    According to the *PMBOK® Guide*, project management teams should have a working
    knowledge of statistical control processes in order to effectively analyze information
    as part'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'of quality control activities. In particular, project management teams should
    understand the following:


    +   *   *Prevention versus inspection.* Prevention entails preventing errors from
    occurring, whereas inspection refers to catching and resolving defects before
    the product is released to the customer.

    +   *   *Attribute sampling versus variable sampling.* Attribute sampling refers
    to the measurements taken to determine whether they meet one of two options: conforming
    or non-conforming, or variable sampling rates measurements on a continuous scale
    to measure the degree of conformance.

    +   *   *Tolerances versus control limits.* Tolerances refer to a range of acceptable
    results, whereas control limits identify boundaries of what is considered to be
    statistically stable within a process.


    As noted within Chapter 3, “Planning the Project,” of this book, quality management
    should be planned into the project, meaning that it is a proactive versus reactive
    activity. This helps to prevent errors from occurring in the first place, rather
    than just resolving them by inspecting the product.


    Figure 5.9 shows the inputs, tools and techniques, and outputs of the Control
    Quality process.


    # FIGURE 5.9 Control Quality process


    ![](img/c077f27110b08d0d6c301ce24ad84100_326_0.png)


    For more detailed information on the Control Quality process, see Chapter 11 in
    PMP$^\circ$: Project Management Professional Exam Study Guide, Eighth Edition.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# ## Inputs of Control Quality


    Know the following inputs of the Control Quality process:


    +   - Project management plan

    +   - Quality metrics

    +   - Quality checklists

    +   - Work performance data

    +   - Approved change requests

    +   - Deliverables

    +   - Project documents

    +   - Organizational process assets


    **Project Management Plan** The project management plan contains the quality management
    plan, which is used to carry out the Control Quality process.


    **Quality Metrics** Quality metrics provide the basis for measuring project or
    product quality attributes in this process.


    **Quality Checklists** Quality checklists in this process are used to ensure that
    the set of required steps determined in the Plan Quality process are completed.


    **Work Performance Data** Work performance data allow the project team to evaluate
    actual versus planned progress in the areas of technical performance, schedule
    performance, and cost performance.


    **Approved Change Requests** Approved change requests are requested changes that
    were approved through the Perform Integrated Change Control process and submitted
    as an input for implementation.


    **Deliverables** Part of achieving quality is ensuring that all deliverables are
    completed successfully. Deliverables will be verified as part of this process.


    **Project Documents** According to the *PMBOK® Guide*, project documents typically
    used as part of this process include process documentation, quality audit reports,
    training plans, and agreements.


    **Organizational Process Assets** The following organizational process assets
    are used by this process:


    +   - Standards, policies, and guidelines relating to quality standards

    +   - Procedures for reporting and communicating issues and defects


    # ## Tools and Techniques of Control Quality


    Be familiar with the following tools and techniques of the Control Quality process
    and how they are used in this process:


    +   - Seven Basic Quality Tools'
