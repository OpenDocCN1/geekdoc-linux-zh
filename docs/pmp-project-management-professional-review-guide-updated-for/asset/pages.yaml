- pgno: 333
  md: '# Updating the Risk Register


    Identifying new risk, assessing old risks, and implementing the appropriate response
    strategies should occur as an integral part of monitoring and controlling activities.
    This is important to managing the impact of risks on the project and is carried
    out through the Control Risks process.


    # Control Risks


    The Control Risks process should be carried out throughout the project life cycle.
    In addition to the activities just mentioned, this process is responsible for
    improving the risk management processes in a number of ways:


    +   - Evaluating risk response plans that are put into action as a result of risk
    events

    +   - Monitoring the project for risk triggers

    +   - Reexamining existing risks to determine if they have changed or should be
    closed out

    +   - Monitoring residual risks

    +   - Reassessing project assumptions and determining validity

    +   - Ensuring that policies and procedures are followed

    +   - Ensuring that risk response plans and contingency plans are put into action
    appropriately and are effective

    +   - Ensuring that contingency reserves (for schedule and cost) are updated according
    to the updated risk assessment

    +   - Evaluating the overall effectiveness of the risk processes


    Figure 5.14 shows the inputs, tools and techniques, and outputs of the Control
    Risks process.


    **FIGURE 5.14** Control Risks process


    ![](img/c077f27110b08d0d6c301ce24ad84100_333_0.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_334_0.png)


    > For more detailed information on the Control Risks process, see Chapter 11 in
    *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.


    # Inputs of Control Risks


    There are four inputs of the Control Risks process that you should know:


    +   - Project management plan

    +   - Risk register

    +   - Work performance data

    +   - Work performance reports


    **Project Management Plan** The project management plan includes the risk management
    plan, which provides the necessary information for carrying out this process.


    **Risk Register** The risk register contains all the documented information of
    the identified risks. It tracks and ranks individual risks, identifies the risk
    owner, describes risk triggers and residual risks, and lists the response plans
    and strategies you should implement in the event of an actual risk event. The
    risk register is fluid, meaning that additions, subtractions, and updates will
    be made throughout the project.


    **Work Performance Data** Work performance data is used in monitoring previously
    identified risks. It also includes information that may assist in the identification
    of risk triggers, indicating that a risk event is about to occur.


    **Work Performance Reports** Work performance reports are examined from the perspective
    of risk and include information such as status reports, performance measurements,
    and forecasts.


    # Tools and Techniques of Control Risks


    Know the following tools and techniques of the Control Risks process:


    +   - Risk reassessment

    +   - Risk audits

    +   - Variance and trend analysis

    +   - Technical performance measurement

    +   - Reserve analysis

    +   - Meetings


    **Risk Reassessment** Periodic, scheduled reviews of identified risks, risk responses,
    and risk priorities should occur during the project. The idea is to monitor risks
    and their status and determine whether their consequences still have the same
    impact on the project objectives as when they were originally planned.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '**Risk Audits** Risk audits are specifically used to examine the implementation
    of response plans and their effectiveness at dealing with risks and their root
    causes. They are also used to determine the effectiveness of the risk management
    processes.


    **Variance and Trend Analysis** Variance and trend analysis looks at the planned
    results in comparison with the actual results. Deviations found may indicate risk.


    **Technical Performance Measurement** This tool and technique compares the technical
    accomplishments of project milestones completed during the Executing processes
    to the technical milestones defined in the Planning processes. Existing variations
    may indicate risk.


    **Reserve Analysis** Reserve analysis compares the amount of contingency reserve
    remaining to the amount of risk remaining in the project. The idea is to determine
    whether the contingency reserve is sufficient.


    **Meetings** Meetings, typically held in the form of status meetings, are used
    as a means of discussing risks with the project team.


    # # Outputs of Control Risks


    The Control Risks process produces the following five outputs:


    +   * Work performance information

    +   * Change requests

    +   * Project management plan updates

    +   * Project documents updates

    +   * Organizational process assets updates


    **Work Performance Information** Work performance information reflects the risk-related
    information that has been gathered and analyzed as part of this process.


    **Change Requests** Recommended corrective actions or preventive actions may result
    from contingency plans or workarounds that were implemented as part of the Control
    Risks process. Change requests are submitted to the Perform Integrated Change
    Control process.


    **Project Management Plan Updates** The project management plan may include updates
    to the following documents, among others:


    +   * Schedule management plan

    +   * Cost management plan

    +   * Quality management plan

    +   * Procurement management plan

    +   * Human resource management plan

    +   * WBS within the scope baseline

    +   * Schedule baseline

    +   * Cost baseline'
  merge: -1
  img_proc: true
