- pgno: 284
  md: '**Quality Control Measurements** Quality control measurements contain results
    of quality control activities and can be used to evaluate the quality processes.


    **Project Documents** Project documents should be reviewed regularly to identify
    those documents that can influence quality assurance activities.


    # # Tools and Techniques of Perform Quality Assurance


    You should be familiar with the following tools and techniques of the Perform
    Quality Assurance process:


    **Quality Management and Control Tools** The Perform Quality Assurance process
    uses tools and techniques also used during the Plan Quality Management and Control
    Quality processes. The following tools and techniques are included within the
    quality management and control tools of this process:


    +   *   Affinity diagrams

    +   *   Process decision program charts (PDPC)

    +   *   Interrelationship diagraphs

    +   *   Tree diagrams

    +   *   Prioritization matrices

    +   *   Activity network diagrams

    +   *   Matrix diagrams


    > NOTE For a description of the tools and techniques also used in the Plan Quality
    Management process, see Chapter 3, “Planning the Project,” in this book.


    > NOTE For a description of the tools and techniques also used in the Control
    Quality process, see Chapter 5 in this book.


    **Quality Audits** Quality audits are independent reviews performed by trained
    auditors or third-party reviewers either on a regular schedule or at random. The
    purpose of a quality audit is to identify ineffective and inefficient activities
    or processes used on the project. Quality improvements come about as a result
    of the quality audits, as shown in Figure 4.14.


    **FIGURE 4.14** Quality audit results


    ![](img/c077f27110b08d0d6c301ce24ad84100_284_0.png)'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'Quality improvements are implemented by submitting change requests, which may
    entail taking corrective action.


    # **Benefits of Quality Audits**


    Performing quality audits results in the following benefits:


    +   - The product of the project is fit for use and meets safety standards.

    +   - Applicable laws and standards are adhered to.

    +   - Corrective action is recommended and implemented where necessary.

    +   - The quality plan for the project is adhered to.

    +   - Quality improvements are identified.

    +   - The implementation of approved change requests, corrective actions, preventive
    actions, and defect repairs is confirmed.


    **Process Analysis** Process analysis looks at process improvement from an organizational
    and technical perspective. An example of a process analysis technique is root
    cause analysis.


    According to the *PMBOK* Guide, process analysis follows the steps in the process
    improvement plan and examines the following:


    +   - Problems experienced while conducting the project

    +   - Constraints experienced while conducting the work of the project

    +   - Inefficient and ineffective processes identified during process operation


    # ## Outputs of Perform Quality Assurance


    The Perform Quality Assurance process results in the following four outputs:


    +   - Change requests

    +   - Organizational process assets updates

    +   - Project management plan updates

    +   - Project documents updates


    **Change Requests** During this process, any recommended corrective actions, whether
    they are a result of a quality audit or process analysis, should be acted upon
    immediately. Change requests may involve corrective action, preventive action,
    or defect repair.


    **Organizational Process Assets Updates** Within the organizational process assets,
    the quality standards may require updates as a result of carrying out this process.'
  merge: -1
  img_proc: true
