  md: '# Tools and Techniques of Estimate Costs


    The following list includes the tools and techniques of the Estimate Costs process:


    +   - Expert judgment

    +   - Analogous estimating

    +   - Parametric estimating

    +   - Bottom-up estimating

    +   - Three-point estimating

    +   - Reserve analysis

    +   - Cost of quality

    +   - Project management software

    +   - Vendor bid analysis

    +   - Group decision-making techniques


    **Expert Judgment** Cost estimates from individuals who have had previous experience
    in the past on similar projects can be used. Information from those who have experience
    in performing the activities becomes valuable for calculating accurate estimates.


    **Analogous Estimating** Analogous estimating, also called top-down estimating,
    is a form of expert judgment. This technique uses actual costs of a similar activity
    completed on a previous project to determine the cost estimate of the current
    activity. It can be used when the previous activities being compared are similar
    to the activities being estimated. Analogous estimating may also be useful when
    detailed information about the project is not yet available. Top-down estimating
    techniques are also used to estimate total project cost to look at the estimate
    as a whole. Although analogous estimating is considered to be a quick and low-cost
    estimating technique, it is low in accuracy.


    ![](img/c077f27110b08d0d6c301ce24ad84100_166_0.png)


    > The *PMBOK®* Guide states that analogous estimating can also be used to determine
    overall project duration and cost estimates for the entire project (or phases
    of the project).


    **Parametric Estimating** Parametric estimating uses historical information and
    statistical data to calculate cost estimates. For a complete description of parametric
    estimating, see “Tools and Techniques of Estimate Activity Durations” later in
    this chapter.


    **Bottom-Up Estimating** This technique estimates costs associated with every
    activity individually by decomposing that activity into smaller pieces of work
    until the cost of the work can be confidently estimated. The costs of the activity
    are then rolled up to the original activity level.


    **Three-Point Estimating** Three-point estimates are used in this process when
    the project team is attempting to improve estimates and account for risk by estimating
    uncertainty.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '**Reserve Analysis** During this process, cost reserves (or contingencies)
    and management reserves are added. Cost contingencies can be aggregated and assigned
    to a schedule activity or a WBS work package level. Contingency reserve is added
    to account for existing known risk, whereas management reserves are added to account
    for unknown risk.


    **Cost of Quality** The cost of quality (COQ) is the total cost to produce the
    product or service of the project according to the quality standards. You can
    find additional information on cost of quality in "Tools and Techniques of Plan
    Quality" later in this chapter.


    **Project Management Software** The project management software tool can help
    quickly determine estimates given different variables and alternatives.


    **Vendor Bid Analysis** Vendor bid analysis involves gathering information from
    vendors to help establish cost estimates. This can be accomplished by requesting
    bids or quotes or working with some of the trusted vendor sources for estimates.


    **Group Decision-Making Techniques** In this assessment process, an evaluation
    of multiple alternatives is performed to determine the results future actions
    might bring. Group decision-making techniques are valuable in improving estimate
    accuracy and commitment to the determined estimates.


