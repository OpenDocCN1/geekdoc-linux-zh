- pgno: 160
  md: 'Be able to describe the purpose of the Estimate Activity Resources process.
    The purpose of Estimate Activity Resources is to determine the types and quantities
    of resources (human, equipment, and materials) needed for each schedule activity
    within a work package.


    Be able to name the tools and techniques of Estimate Activity Durations. The tools
    and techniques of Estimate Activity Durations are expert judgment, analogous estimating,
    parametric estimating, three-point estimating, group decision-making techniques,
    and reserve analysis.


    Be able to define the difference between analogous estimating, parametric estimating,
    and bottom-up estimating. Analogous estimating is a top-down technique that uses
    expert judgment and historical information. Parametric estimating multiplies the
    quantity of work by the rate. Bottom-up estimating performs estimates for each
    work item and rolls them up to a total.


    Be able to calculate the critical path. The critical path includes the activities
    whose durations add up to the longest path of the project schedule network diagram.
    The critical path is calculated using the forward pass, backward pass, and float
    calculations.


    Be able to define a critical path task. A critical path task is a project activity
    with zero float.


    Be able to describe and calculate PERT duration estimates. This is a weighted
    average technique that uses three estimates: optimistic, pessimistic, and most
    likely. The formula is as follows:


    ```

    (Optimistic +(4 × Most Likely) + Pessimistic) ÷ 6

    ```


    Be able to name the schedule compression techniques. The schedule compression
    techniques are crashing and fast tracking.


    Be able to describe a critical chain. The critical chain is the new critical path
    in a modified schedule that accounts for limited resources.


    Be able to name the outputs of the Develop Schedule process. The outputs are project
    schedule, schedule baseline, schedule data, project calendars, project management
    plan updates, and project documents updates.


