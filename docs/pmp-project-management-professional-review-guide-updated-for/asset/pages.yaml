    +   □ Product breakdown

    +   □ Value-engineering techniques


    **Alternatives Generation** Alternatives generation is a technique used for discovering
    different methods or ways of accomplishing the work of the project. Examples of
    alternatives generation are brainstorming and lateral thinking.


    Lateral thinking is a process of separating problems, looking at them from angles
    other than their obvious presentation, and encouraging team members to come up
    with ways to solve problems that are not apparently obvious or look at scope in
    a different way. This can also be described as out-of-the-box thinking.


    **Facilitated Workshops** Facilitated workshops involve stakeholders coming together
    to discuss and define requirements that affect more than one department.


    # Outputs of Define Scope


    Know the following outputs of the Define Scope process:


    **Project Scope Statement** The purpose of the project scope statement is to document
    the project objectives, deliverables, and the work required to produce the deliverables
    so that it can be used to direct the project team’s work and as a basis for future
    project decisions. The project scope statement is an agreement between the project
    organization and the customer that states precisely what the work of the project
    will produce.


    > **NOTE**  The project scope statement guides the work of the project team during
    the Executing process, and all change requests will be evaluated against the scope
    statement. The criteria outlined will also be used to determine whether the project
    was completed successfully.


    According to the *PMBOK* Guide, the project scope statement should include all
    of the following:


    +   □ Product scope description

    +   □ Product acceptance criteria

    +   □ Project deliverables

    +   □ Project exclusions

    +   □ Project constraints

    +   □ Project assumptions


    **Product Scope Description** The product scope description describes the characteristics
    of the product, service, or result of the project.'
