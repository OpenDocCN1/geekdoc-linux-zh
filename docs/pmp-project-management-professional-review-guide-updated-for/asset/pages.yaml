- pgno: 133
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_133_0.png)


    > For more detailed information on the Define Activities process, see Chapter
    4, “Creating the Project Schedule,” of PMP<sup>®</sup>: Project Management Professional
    Exam Study Guide, Eighth Edition.


    # Inputs of Define Activities


    You should know the following inputs of the Define Activities process:


    **Schedule Management Plan** The critical input from this plan is the defined
    level of detail needed to manage the work.


    **Scope Baseline** The scope baseline takes into account the following:


    +   *   Work packages, from within the WBS

    +       *   Constraints and assumptions, from within the project scope statement


    **Enterprise Environmental Factors** Enterprise environmental factors include
    the project management information system; the organizational culture and structure;
    and published, commercially available information.


    **Organizational Process Assets** The organizational process assets provide existing
    guidelines and policies, historical project documents (such as partial activity
    lists from previous projects), and a lessons-learned knowledge base, all of which
    are used for defining the project activities.


    # Tools and Techniques of Define Activities


    You can use the following three tools and techniques in the Define Activities
    process:


    **Decomposition** Decomposition in this process involves breaking the work packages
    into smaller, more manageable units of work called activities. Activities are
    individual units of work that must be completed to fulfill the deliverables listed
    in the WBS.


    **Rolling Wave Planning** Rolling wave planning is a form of progressive elaboration
    that involves planning near-term work in more detail than future-term work. As
    the work progresses, the work that was once considered future-term is then broken
    out into more granular detail.


    **Expert Judgment** Expert judgment helps define activities and involves project
    team members with prior experience developing project scope statements and WBSs.


    # Outputs of Define Activities


    The following are outputs of the Define Activities process:


    **Activity List** Activity lists contain all the schedule activities that will
    be performed for the project, with a scope-of-work description of each activity
    and an identifier so that team members understand what the work is and how it
    is to be completed.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_134_0.png)


    The schedule activities are individual elements of the project schedule.


    # Activity Attributes


    Activity attributes describe the characteristics of the activities and are an
    extension of the activity list. Activity attributes will change over the life
    of the project, as more information is known.


    During the early stages of the project, activity attributes typically consist
    of the following:


    +   - Activity ID

    +   - WBS identification code it’s associated with

    +   - Activity name


    As the project progresses, the following activity attributes may be added:


    +   - Predecessor and successor activities

    +   - Logical relationships

    +   - Leads and lags

    +   - Resource requirements

    +   - Constraints and assumptions associated with the activity


    # Milestone List


    Milestones are major accomplishments of the project and mark the completion of
    major deliverables or some other key event in the project. The milestone list
    documents several things:


    +   - Records the accomplishments

    +   - Documents whether a milestone is mandatory or optional

    +   - Becomes part of the project management plan

    +   - Helps develop the project schedule


    ![](img/c077f27110b08d0d6c301ce24ad84100_134_1.png)


    In practice, the Define Activities process and Sequence Activities process may
    be combined into one process or step.


    # Sequence Activities


    The Sequence Activities process takes the identified schedule activities from
    the Define Activities process, sequences them in logical order, and identifies
    any dependencies that exist among the activities. The interactivity of logical
    relationships must be sequenced correctly in order to facilitate the development
    of a realistic, achievable project schedule. The end of this process results in
    the creation of project schedule network diagrams, which visually show the sequence
    of activities and their dependencies.'
  merge: -1
  img_proc: true
