    # Project Risk Management Knowledge Area Review


    The Project Risk Management Knowledge Area has only one process that falls in
    the Monitoring and Controlling process group. As you may recall, this single process
    accomplishes a lot of things. Within this risk-related process, we will carry
    out the following actions:


    +   - Implement the risk response plans, which were developed in the Planning
    process group

    +   - Evaluate the effectiveness of the plans

    +   - Monitor the identified risks

    +   - Identify new risks

    +   - Evaluate the effectiveness of the risk management processes


    As shown in Figure 5.27, carrying through these actions results in the following:


    +   - Actual outcomes of the identified risks

    +   - Newly identified risks

    +   - The documenting and recording of the risk outcomes for use by future projects

    +   - The documenting and recording of the risk audits that were conducted to
    evaluate the effectiveness of the risk response plans and the risk management
    processes

    +   - Any recommended changes to bring the project back in line with the project
    management plan as well as corrective actions and preventive actions (typically
    includes the implementation of contingency plans and workaround plans)


