- pgno: 366
  md: "# # Close Procurements\n\nThe Close Procurements process is primarily concerned\
    \ with completing and settling the terms of the procurement. It supports the Close\
    \ Project or Phase process by determining whether the work described in the procurement\
    \ documentation or contract was completed accurately and satisfactorily, which\
    \ is referred to as product verification. The Close Procurements process also\
    \ accomplishes the following:\n\n+   - Updating and archiving records for future\
    \ reference\n+   - Completing all terms or conditions for completion and closeout\
    \ specified within the procurement contracts including settlement of all financial\
    \ obligations\n+   - Documenting and verifying project outcomes\n\nFigure 6.2\
    \ shows the inputs, tools and techniques, and outputs of the Close Procurements\
    \ process.\n\n# **FIGURE 6.2**  Close Procurements process\n\n![](img/c077f27110b08d0d6c301ce24ad84100_366_0.png)\n\
    \n> **NOTE**\n> \n> For more detailed information on the Close Procurements process,\
    \ see Chapter 12 of the *PMP®: Project Management Professional Exam Study Guide,\
    \ Eighth Edition*.\n\n# ## Inputs of Close Procurements\n\nThe Close Procurements\
    \ process has a total of two inputs that you should be familiar with: project\
    \ management plan and procurement documents.\n\n**Project Management Plan** The\
    \ project management plan contains the procurement management plan, which will\
    \ be used to guide and carry out this process."
  merge: -1
  img_proc: true
- pgno: 367
  md: 'Procurement Documents According to the *PMBOK*® *Guide*, the following documents
    from within the procurement documentation input are collected, indexed, and filed:


    +   - Contract schedule

    +   - Scope

    +   - Quality

    +   - Cost performance

    +   - Contract change documentation

    +   - Payment records

    +   - Inspection results


    # ### Tools and Techniques of Close Procurements


    For the exam, be familiar with the three tools and techniques of the Close Procurements
    process:


    Procurement Audits Procurement audits are structured reviews that span all of
    the procurement processes. The primary purpose of these audits is to identify
    lessons learned by examining the procurement processes to determine areas of improvement
    and to identify flawed processes or procedures.


    Procurement Negotiations According to the *PMBOK*® *Guide*, the final equitable
    settlement of all outstanding issues, claims, and disputes by negotiation is the
    primary goal in all procurement relationships. Sometimes when settlement cannot
    be achieved through direct negotiation, some form of alternative dispute resolution
    (ADR), including mediation or arbitration, may be explored. Reaching a negotiated
    settlement through the aid of ADR techniques is the most favorable way to resolve
    a dispute.


    Records Management System The records management system contains processes, control
    functions, and automation tools to help manage contract and procurement documentation
    and records.


    # ### Outputs of Close Procurements


    You should know the two outputs of the Close Procurements process, which are closed
    procurements and organizational process assets updates.


    Closed Procurements Closed procurements are the formal acceptance and closure
    of the procurements. As Figure 6.3 illustrates, this output satisfies the terms
    and conditions specified within the contract; it is also included within the procurement
    management plan.


    ![](img/c077f27110b08d0d6c301ce24ad84100_367_0.png)'
