- pgno: 124
  md: '# Inputs of Create WBS


    For the exam, know the following inputs of the Create WBS process:


    **Scope Management Plan** The scope management plan is a planning tool that documents
    how the project team will define project scope, how changes to scope will be maintained
    and controlled, and how scope will be verified.


    **Project Scope Statement** The project scope statement contains information valuable
    to creating the WBS, most notably the list of project deliverables.


    **Requirements Documentation** The requirements documentation describes how the
    requirements meet the business needs of the project.


    **Enterprise Environmental Factors** In addition to enterprise environmental factors
    that have already been discussed, there may be industry-specific WBS standards
    that are relevant to the type of project that you are undertaking. If so, that
    information may serve as an additional reference to the creation of the WBS.


    **Organizational Process Assets** This process uses historical information from
    within the organizational process assets as well as policies, procedures, and
    WBS templates.


    ![](img/c077f27110b08d0d6c301ce24ad84100_124_0.png)


    > For more detailed information on the Create WBS process, see Chapter 3 of *PMP*®:
    *Project Management Professional Exam Study Guide, Eighth Edition*.


    # Tools and Techniques of Create WBS


    The Create WBS process has two tools and techniques: decomposition and expert
    judgment.


    **Decomposition** Decomposition involves breaking down the project deliverables
    into smaller, more manageable components of work that can be easily planned, executed,
    monitored and controlled, and closed out.


    The project manager typically decomposes the work with the help of the project
    team, whose members have expert knowledge of the work. Benefits of team involvement
    include a more realistic decomposition of the work and getting team buy-in.


    Decomposition provides a way of managing the scope of the project and also does
    the following:


    +   - Improves estimates

    +   - More easily assigns performance measures and controls

    +   - Provides a baseline to compare against throughout the project or phase

    +   - Ensures that assignments go to the proper parties


    According to the *PMBOK*® *Guide*, decomposition consists of the following five-step
    process:


    +   1. Identify the deliverables and work.

    +   2. Organize the WBS.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   3. Decompose the WBS components into lower-level components.


    +   4. Assign identification codes.


    +   5. Verify the WBS.


    Expert Judgment   For creating the WBS, expert judgment is routinely used to start
    breaking down project deliverables by analyzing the information available. Don''t
    forget that expert judgment can also come in the form of predefined templates,
    which provide instructions on how to effectively break down common deliverables.
    Templates can come from the industry you are working in, or created by your organization
    as a result of experience gained from performing similar projects.


    # Outputs of Create WBS


    The Create WBS process has two outputs:


    +   Scope baseline


    +   Project documents updates


    Scope Baseline   The scope baseline for the project is the approved project scope
    statement, the WBS, and the WBS dictionary. These documents together describe
    in detail all the work of the project. The documents allow managers to carry out
    the following activities:


    +   Document schedules


    +   Assign resources


    +   Monitor and control the project work


    Work Breakdown Structure (WBS)   The following are various ways of organizing
    the WBS:


    Major Deliverables   The major deliverables of the project are used as the first
    level of decomposition in this structure.


    Subprojects   Another way to organize the work is by subprojects. Each of the
    subproject managers will develop a WBS for their subproject that details the work
    required for that deliverable.


    Project Phases   Many projects are structured or organized by project phases.
    Each phase listed here would be the first level of decomposition, and its deliverables
    would be the next level.


    The following is a general description of the various levels within the WBS:


    Level 1   According to the PMBOK® Guide, Level 1 of the WBS is the project level.
    The first level of decomposition, however, may be the second level of the WBS,
    which could include deliverables, phases, and subprojects—see Figure 3.5 for an
    example.'
