- pgno: 100
  md: '**Stakeholder Analysis** During stakeholder analysis, you’ll want to identify
    the influences stakeholders have in regard to the project and understand their
    expectations, needs, and desires. From there, you’ll derive more specifics regarding
    the project goals and deliverables. Stakeholders are often concerned with their
    own interests and what they have to gain or lose from the project.


    According to the *PMBOK® Guide*, three steps are involved in stakeholder analysis:


    +   1. Identify all potential stakeholders and capture general information about
    them, such as the department they work in, contact information, knowledge levels,
    and influence levels.


    +   2. Identify the potential impact or support each may have to the project,
    and then classify them according to impact so that you can devise a strategy to
    deal with them. The *PMBOK® Guide* lists four classification models for classifying
    the power and influence of each stakeholder on a simple four-square grid:

    +       - Power/interest grid

    +       - Power/influence grid

    +       - Influence/impact grid

    +       - Salience model (which charts stakeholder power, urgency, and legitimacy)


    +   3. Assess the reaction or responses of the stakeholder to various situations.
    This will assist the project manager in managing the stakeholders.


    **Expert Judgment** Expert judgment is used in combination with stakeholder analysis
    to ensure that stakeholder identification is comprehensive. This may involve interviewing
    key stakeholders that are already identified and senior management, subject matter
    experts, or other project managers.


    **Meetings** Meetings are often used as a mechanism for performing stakeholder
    analysis. Project managers often gather and analyze information on roles, positions,
    and interests of stakeholders through meetings.


    # # Outputs of the Identify Stakeholders Process


    The Identify Stakeholders process has one output: stakeholder register.


    **Stakeholder Register** A stakeholder register captures all of the information
    about the stakeholders in one place. This general information includes things
    like the department they work in, contact information, knowledge levels, and influence
    levels. In addition, the stakeholder register contains at least the following:


    +   - **Identifying Information** This includes items like contact information,
    department, role in the project, and so on.


    +   - **Assessment Information** This includes elements regarding influence, expectations,
    key requirements, and when the stakeholder involvement is most critical.


    +   - **Stakeholder Classification** Stakeholders can be classified according
    to their relationship to the organization and, more importantly, whether they
    support the project, are resistant to the project, or have no opinion.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# **Exam Essentials**


    Understand the Identify Stakeholders process. The purpose of this process is to
    identify the project stakeholders, assess their influence and level of involvement,
    devise a plan to deal with potential negative impacts, and record stakeholder
    information in the stakeholder register.


    # Bringing the Processes Together


    As a recap, the Initiating process group kicks off the project and results in
    the creation of the project charter and the stakeholder register. This phase acknowledges
    that a new project or phase should begin.


    But before a project formally exists, several scenarios may unfold:


    +   - First, needs and demands surface within an organization, demonstrating the
    need for a project to be initiated.


    +   - The potential project may then go through a feasibility study to determine
    whether the project and end result of the project are viable and whether there
    is an opportunity for success.


    +   - A project may also go through a selection process. We looked at mathematical
    models and benefit measurement methods as two categories of project selection
    methods.


    After a project is selected, a project charter is created (using the Develop Project
    Charter process) and signed, formally authorizing the project. By the end of the
    Develop Project Charter process, the project charter contains several documented
    elements, including the justification for the project, high-level requirements
    and description, summary milestone schedule and budget, and the sponsor and project
    manager (if already selected).


    Once the project charter is generated, project stakeholders can be identified.
    This occurs in the Identify Stakeholders process. You learned that stakeholders,
    along with their interests and levels of influence, are important to identify
    and define early on within the project. As a result, a stakeholder register, which
    identifies, assesses, and classifies the individual stakeholders, is created.


    Figure 2.15 shows the potential path of a new project, from its inception and
    through the initiating phase.


    In this chapter, we also covered the 10 project management Knowledge Areas, which
    are summarized in Table 2.11.'
