  md: 'Here is an overview of these steps:


    +   1.  Using the project management plan as an information resource, bring the
    project team on board and issue staff assignments.


    +   2.  Throughout project execution, assess the performance of the project team
    for developmental purposes. This includes enhancing the team’s skills, monitoring
    the level of interaction among the group members, and improving the team’s overall
    performance.


    +   3.  Use the performance assessment that was generated in the second step to
    manage the team. Here, issues are resolved and changes are managed. The result?
    Changes are recommended to resolve any staffing issues that may have emerged.


    # # Project Communications Management  Knowledge Area Review


    As the project work is executed, communication becomes more important than ever.
    All of the planning behind how communication will take place within the project
    goes into effect. This is where knowing the communication needs and requirements
    of your stakeholders becomes particularly important. Be sure you place a great
    level of importance on knowing your stakeholders.


    There is one communications-related process within the Executing process group
    that makes project information available to stakeholders. As you can see in Figure
    4.19, the stakeholder communication requirements must be developed before you
    can manage communications. After all, you cannot meet your team’s communication
    needs if you do not know what they are. These communication needs and requirements
    are determined in the Initiating and Planning process groups.


    **FIGURE 4.19** Process interaction—communications


    ![](img/c077f27110b08d0d6c301ce24ad84100_290_0.png)


    Figure 4.19 also shows how the management of the project stakeholder communications
    fits in with the communication processes. This step involves addressing any existing
    issues'
