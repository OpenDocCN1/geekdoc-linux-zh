    +   - Technical/quality/performance risks

    +   - Project management risks

    +   - Organizational risks

    +   - External risks


    **Defining Probability and Impact** The definitions for probability and impact
    are documented in the risk management plan as they relate to potential positive
    or negative risk events and their impacts on project objectives.'
