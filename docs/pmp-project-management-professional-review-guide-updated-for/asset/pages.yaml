    # # Bringing the Processes Together


    In this chapter, you learned all about the processes that fall in the Monitoring
    and Controlling process group. If anything is amiss, the processes in this group
    work together to bring the project back in line with the project management plan.


    In addition to correcting any differences between the actual work and the project
    management plan, the Monitoring and Controlling process group is responsible for
    preventive actions. During these processes, changes are verified and managed,
    and the status of identified risks is monitored in order to manage hurdles as
    soon as they arise. This process group is the project’s gatekeeper.


    Figure 5.20 summarizes the objectives in the Monitoring and Controlling process
    group.


    ![](img/c077f27110b08d0d6c301ce24ad84100_348_0.png)'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'In total, the Monitoring and Controlling process group contains 11 processes,
    covering nearly all of the Knowledge Areas:


    +   * Project Integration Management

    +   * Project Scope Management

    +   * Project Time Management

    +   * Project Cost Management

    +   * Project Quality Management

    +   * Project Communications Management

    +   * Project Risk Management

    +   * Project Procurement Management

    +   * Project Stakeholder Management


    We will review the process interactions that occur in each Knowledge Area during
    the Monitoring and Controlling process group. This will help you understand how
    the processes work together.


    # Project Integration Management Knowledge Area Review


    Two key processes in the Monitoring and Controlling process group belong to the
    Project Integration Management Knowledge Area. Figure 5.21 shows how the project
    work is tracked and regulated as part of this Knowledge Area and how all project
    changes are approved or rejected. Changes are reviewed by the integrated change
    control system, which determines whether the changes are necessary and in the
    best interest of the project.


    ![](img/c077f27110b08d0d6c301ce24ad84100_349_0.png)'
