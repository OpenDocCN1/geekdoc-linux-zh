    Keep in mind that throughout the Project Cost Management Knowledge Area, the cost
    management plan serves as a guide for documenting and controlling the budget of
    the project.


    # ## Inputs of Plan Cost Management


    Know the following four inputs of the Plan Cost Management process:


    **Project Management Plan** The project management plan contains elements used
    to create the cost management plan focusing on, but not limited to, the following:


    +   • Scope baseline; elements like the project scope statement and WBS provide
    details for cost estimation and management

    +   • Schedule baseline, which helps clarify when project costs will be incurred

    +   • Other information, including cost-related scheduling, communication decisions,
    and risk


    **Project Charter** The project charter has the summary budget, a key input to
    creating the detailed project costs.


    **Enterprise Environmental Factors** Several enterprise environmental factors
    can influence the Plan Cost Management process, including but not limited to the
    organization''s culture and structure, marketplace conditions, currency exchange
    rates (if the project is multinational), published commercial information such
    as resource cost rate information, and the project management information system.


    **Organizational Process Assets** Financial controls procedures; historical information,
    including a lessons learned knowledge base; financial databases; and existing
    formal and informal cost estimating and budgeting-related policies, procedures,
    and guidelines are a few of the organizational process assets that help shape
    the Plan Cost Management process.


    # ## Tools and Techniques of Plan Cost Management


    The three tools and techniques that the Plan Cost Management process uses are
    expert judgment, analytical techniques, and meetings.


    **Expert Judgment** Expert judgment brings invaluable perspective about prior
    similar projects attempted, as well as the existing environment that will affect
    the project. This can also be key in considering whether to combine methods of
    cost planning and how to best resolve differences between those methods.


    **Analytical Techniques** You may have many strategic options to consider when
    developing the cost management plan. Those options include self-funding, funding
    with equity, or'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'funding with debt. Financial options will be influenced by the organization''s
    policies and procedures, including but limited to payback period, return on investment,
    internal rate of return, discounted cash flow, and net present value.


    **Meetings** In the course of developing the cost management plan, members of
    project teams may attend meetings to help with information exchange and decision
    making. Depending on the meeting, the following members might be a part of the
    discussion to include: the project manager, the project sponsor, selected project
    team members, and anyone having responsibility in this area.


    # Outputs of Plan Cost Management


    For the exam, know that the output of the Plan Cost Management process is the
    cost management plan.


    **Cost Management Plan** The cost management plan should establish the following:


    +   - Units of measure, such as quantity and time measures, and currency to be
    used

    +   - Level of precision, which is the degree to which activity cost estimates
    will be rounded up or down

    +   - Level of accuracy, which is the acceptable range used in determining contingencies
    and realistic activity cost estimates

    +   - Organizational procedures links, where the WBS provides the framework for
    the cost management plan to help foster consistency with estimates, budgets, and
    controls

    +   - Control thresholds, which document the identified variation that can occur
    before some action needs to be taken

    +   - Rules of performance measurement, like the rules for earned value management
    (EVM), and which techniques to use


    > **NOTE**

    > For more detailed information on *earned value management*, see *Practice Standard
    for Earned Value Management, Second Edition* (PMI®, 2011).


    +   - Reporting formats defining the form and frequency of various cost reports

    +   - Process descriptions for the other cost management processes

    +   - Additional details such as explanations of strategic funding choices, how
    to deal with currency exchange rate fluctuations, and the procedure for project
    cost recording


    # Estimate Costs


