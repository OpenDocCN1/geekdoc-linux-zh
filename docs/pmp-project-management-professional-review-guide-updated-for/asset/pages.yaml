  md: '# Exam Essentials


    **Understand how to measure customer satisfaction.** Customer satisfaction is
    measured through quality management, which ensures that the project meets conformance
    to requirements and fitness for use.


    # Bringing the Processes Together


    The Closing process group consists of only two processes that work toward closing
    out the project or project phase. Before closing out the project, the project
    manager must first make sure that the project has met its objectives and accomplished
    what it set out to achieve. The Closing process group is also concerned with the
    following objectives:


    +   - Obtaining formal acceptance of the project’s completion

    +   - Closing out procurement contracts

    +   - Releasing the project resources

    +   - Measuring customer satisfaction

    +   - Archiving the project information for later use


    Figure 6.6 reflects the objectives of the Closing process group through several
    key questions that the project manager should ask before considering the project
    fully closed.


