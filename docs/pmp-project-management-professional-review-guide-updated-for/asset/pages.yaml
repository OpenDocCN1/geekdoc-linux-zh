  md: '**Project Management Plan Updates** As a result of this process, the quality
    management plan may need to be updated. The following documents may also require
    changes within the project management plan:


    +   • Cost management plan

    +   • Schedule management plan


    **Project Documents Updates** Updates may include changes to the following project
