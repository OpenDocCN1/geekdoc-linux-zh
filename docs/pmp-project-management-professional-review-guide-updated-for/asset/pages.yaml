  md: 'The change management plan, which was not previously addressed, describes how
    you will document and manage change requests, the process for approving changes,
    and how to document and manage the final recommendation for the change requests.
    Configuration management changes deal with the components of the product of the
    project, such as functional ability or physical attributes, rather than the project
    process itself. Scope is also a critical element within planning because it defines
    the boundaries of the project and what it is that the project has set out to achieve.
    As shown in Figure 3.47, the project schedule and the project budget are part
    of the project’s foundation. These project elements play a big role in measuring
    and monitoring the progress of the project. The resources and purchased services
    and/or products complete the project’s foundation. Without the human resources,
    as well as the external project teams, the project could not move forward. Guiding
    the project from above are communications management, quality management, and
    risk management—all critical elements of the project that influence and guide
    the project toward success. As you can see, all of these project elements are
    intertwined and build on one another. With this big picture in mind, let’s go
    back and review what you’ve learned thus far about each of the project management
    Knowledge Areas. You’ll find that what goes on within each Knowledge Area is connected
    on a high level and is structured in a logical format.


    # # Project Scope Management Knowledge Area Review


    You may recall that the project scope defines the work to be completed during
    the project, providing the project with boundaries. Figure 3.51 illustrates the
    process and inputs used to create the work breakdown structure. (Remember that
    the WBS is a decomposition of the project deliverables, down to the work package
    level.) The WBS becomes part of the scope baseline, as is the project scope statement
    and the WBS dictionary. The scope baseline is necessary input for activities in
    the next Knowledge Area, Project Time Management.


    ![](img/c077f27110b08d0d6c301ce24ad84100_237_0.png)'
