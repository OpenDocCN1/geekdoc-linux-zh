- pgno: 94
  md: '# Inputs of the Develop Project Charter Process


    For the exam, you should know the following inputs of the Develop Project Charter
    process:


    +   *   Project statement of work (SOW)

    +   *   Business case

    +   *   Agreements

    +   *   Enterprise environmental factors

    +   *   Organizational process assets


    Let’s look at each of these inputs more closely.


    **Project Statement of Work** The project statement of work (SOW) describes the
    product, service, or result the project was undertaken to complete. When the project
    is internal, either the project sponsor or the initiator of the project typically
    writes this document. When the project is external to the organization, it is
    the buyer that typically writes the SOW. According to the *PMBOK*® *Guide*, a
    project SOW should contain or consider all of the following elements:


    +   *   Business need

    +   *   Product scope description

    +   *   Strategic plan


    **Business Case** The purpose of a business case is to understand the business
    need for the project and determine whether the investment in the project is worthwhile.
    Performing a


    ![](img/c077f27110b08d0d6c301ce24ad84100_94_0.png)'
