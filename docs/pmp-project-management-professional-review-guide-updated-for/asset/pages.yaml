    # ### The Power of Leaders


    Leaders, managers, and project managers use power to convince others to do tasks
    a specific way. The kind of power they use to accomplish this depends on their
    personality, their personal values, and the company culture. Here are *five* forms
    of power leaders may use:


    +   - Punishment power, also known as *coercive* or *penalty power*, is exerted
    when employees are threatened with consequences if expectations are not met.


    > Punishment power should be *used* as a last resort and only after all other
    forms have been exhausted.


    +   - Expert power is exerted when the person being influenced believes the manager,
    or the person doing the influencing, is knowledgeable about the subject or has
    special abilities that make them an expert.

    +   - Legitimate power, also known as *formal power*, is exerted when power comes
    about as a result of the influencer’s position.

    +   - Referent power is obtained by the influencer through a higher authority.

    +   - Reward power is the ability to grant bonuses and incentives for a job well
    done.


    # ### Motivational Theories


    There are many theories on motivation, and as a project manager, you should understand
    and tailor the recognition and rewards programs around the project team. The following
    are some important motivational theories to note:


    **Maslow’s Hierarchy of Needs** Abraham Maslow theorized that humans have five
    basic sets of needs arranged in hierarchical order. The idea is that each set
    of needs must be met before a person can move to the next level of needs in the
    hierarchy. Once that need is met, they progress to the next level, and so on.
    Maslow’s Hierarchy of Needs theory suggests that once a lower-level need has been
    met, it no longer serves as a motivator, and the next-higher level becomes the
    driving motivator in a person’s life. Maslow theorized that humans are always
    in one state of need or another and they can move up and down the pyramid throughout
    their lives. The following is a brief review of the needs, as shown in Figure
    4.5, starting with the highest level and ending with the lowest:


    +   - Self-actualization—Highest level; performing at your peak potential

    +   - Self-esteem needs—Accomplishment, respect for self, capability

    +   - Social needs—A sense of belonging, love, acceptance, friendship

    +   - Safety and security needs—Your physical welfare and the security of your
    belongings

    +   - Basic physical needs—Lowest level; food, clothing, shelter'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# FIGURE 4.5 Maslow's hierarchy of needs\n\n![](img/c077f27110b08d0d6c301ce24ad84100_263_0.png)\n\
    \nHygiene Theory Frederick Herzberg came up with the Hygiene theory, also known\
    \ as the Motivation-Hygiene theory. He postulated that two factors contribute\
    \ to motivation:\n\n+   - Hygiene factors, which prevent dissatisfaction, deal\
    \ with work environment issues, and include factors such as pay, benefits, conditions\
    \ of the work environment, and relationships with peers and managers.\n+   - Motivators,\
    \ which lead to satisfaction, deal with the substance of the work itself and the\
    \ satisfaction one derives from performing the functions of the job. According\
    \ to Herzberg, the ability to advance, the opportunity to learn new skills, and\
    \ the challenges involved in the work are all motivators.\n\nExpectancy Theory\
    \ The Expectancy theory, first proposed by Victor Vroom, says that the expectation\
    \ of a positive outcome drives motivation. People will behave in certain ways\
    \ if they think there will be good rewards for doing so and if they themselves\
    \ value the reward. Also note that this theory says the strength of the expectancy\
    \ drives the behavior. This means the expectation or likelihood of the reward\
    \ is linked to the behavior. This theory also says that people become what you\
    \ expect of them.\n\nAchievement Theory The Achievement theory, attributed to\
    \ David McClelland, says that people are motivated by the need for three things:\n\
    \n+   - Achievement, as a result of a need to achieve or succeed\n+   - Power,\
    \ which involves a desire to influence the behavior of others\n+   - Affiliation,\
    \ as a result of a need to develop relationships with others\n\n> Day of the Exam\n\
    > \n> For the exam, you will need to memorize names of motivational and quality\
    \ theories highlighted in this chapter, along with the individual(s) behind the\
    \ theories. Don't forget to leverage mnemonic technique or other memory tricks\
    \ to help you remember!"
  merge: -1
