    # # Create WBS


    The Create WBS process takes the well-defined deliverables and requirements and
    begins the process of breaking down the work via a WBS. WBS stands for work breakdown
    structure, which defines the scope of the project and breaks down the deliverables
    into smaller, more manageable components of work that can be scheduled and estimated
    as well as easily assigned, monitored, and controlled. The WBS should detail the
    full scope of work needed to complete the project. Figure 3.4 shows the inputs,
    tools and techniques, and outputs of the Create WBS process.


    # FIGURE 3.4 Create WBS process


    ![](img/c077f27110b08d0d6c301ce24ad84100_123_1.png)'
