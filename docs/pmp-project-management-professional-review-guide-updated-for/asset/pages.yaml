    | Nominal group techniques | Brainstorming sessions consisting of small groups.
    The ideas of these sessions are later reviewed by a larger group. |

    | Matrix diagrams | Used as a decision-making tool, particularly when several
    options or alternatives are available. |

    | Prioritization matrices | Used to prioritize complex issues that have numerous
    criteria for decision making. |



    Meetings  Meetings are used by the project team to assemble the quality management
