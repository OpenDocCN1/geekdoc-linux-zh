- pgno: 194
  md: '# Inputs of Plan Procurement Management


    You should be familiar with these inputs to the Plan Procurement Management process:


    +   * Project management plan

    +   * Requirements documentation

    +   * Risk register

    +   * Activity resource requirements

    +   * Project schedule

    +   * Activity cost estimates

    +   * Stakeholder register

    +   * Enterprise environmental factors

    +   * Organizational process assets


    **Project Management Plan** The Plan Procurement Management process uses the project
    scope statement, which is included within the scope baseline. The scope baseline
    is part of the project management plan.


    **Requirements Documentation** The requirements documentation established the
    details of the project requirements. For a more detailed description, see “Outputs
    of Collect Requirements” earlier in this chapter.


    **Risk Register** The risk register guides the project team in determining the
    types of services or goods needed for risk management. It also identifies which
    procurement decisions are driven as a result of a risk response, such as acquiring
    insurance or other services to transfer liability to a third party.


    **Activity Resource Requirements** The availability of the assigned resources
    will impact the procurement process and will aid in the make-or-buy decision.


    **Project Schedule** The project schedule is necessary for determining the start
    and finish dates of activities that will be completed through a third party.


    **Activity Cost Estimates** Activity cost estimates are necessary for determining
    the budget allotted for completing project activities, which will influence make-or-buy
    decisions and services or goods acquired.


    **Stakeholder Register** The stakeholder register shows details on the participants
    in the project and their interest in the outcomes.


    **Enterprise Environmental Factors** Marketplace conditions are the key element
    of enterprise environmental factors used within this process. Other factors include
    products, services, and results available in the marketplace; unique local requirements;
    and industry-specific typical terms and conditions.


    **Organizational Process Assets** The organization’s guidelines, policies, and
    procedures (including any procurement policies and guidelines) are the elements
    of the organizational'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'process assets used in this process. Legal contractual relationships are another
    component to organizational process assets for the Plan Procurement Management
    process. Contracts will generally fall into two general categories: fixed-price
    or cost reimburable.


    A contract is a compulsory agreement between two or more parties and is used to
    acquire products or services from outside the organization. Contracts are enforceable
    by law and require an offer and an acceptance, with money typically exchanged
    for goods or services. As reflected in Figure 3.32, there are different types
    of contracts for different purposes.


    # FIGURE 3.32 Contract types


    ![](img/c077f27110b08d0d6c301ce24ad84100_195_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_195_1.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_195_2.png)


    The PMBOK® Guide divides contracts into three categories:


    Fixed-Price, or Lump-Sum, Contracts Fixed-price contracts (also referred to as
    lump-sum contracts) can either set a specific, firm price for the goods or services
    rendered (known as a firm fixed-price contract) or can include incentives for
    meeting or exceeding certain contract deliverables. There are three types of fixed-price
    contracts:


    +   In a firm fixed-price (FFP) contract, the buyer and seller agree on a well-defined
    deliverable for a set price. In this kind of contract, the biggest risk is borne
    by the seller. The seller assumes the risks of increasing costs, nonperformance,
    or other problems.


    +   Fixed-price incentive fee (FPIF) contracts are another type of fixed-price
    contract. The difference is that the contract includes an incentive—or bonus—for
    early completion or for some other agreed-upon performance criterion that meets
    or exceeds contract specifications. Some of the risk is borne by the buyer as
    opposed to the firm fixed-price contract, where most of the risk is borne by the
    seller.


    +   A fixed-price with economic price adjustment (FP-EPA) contract allows for
    adjustments due to changes in economic conditions, like cost increases or decreases,
    inflation, and so on. These contracts are typically used when the project spans
    many years. This type of contract protects both the buyer and the seller from
    economic conditions that are outside of their control.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# **Cost-Reimbursable, or Cost Plus, Contracts**


    With cost-reimbursable contracts, the allowable costs associated with producing
    the goods or services are charged to the buyer. All the costs the seller takes
    on during the project are charged back to the buyer; thus, the seller is reimbursed.
    Cost-reimbursable contracts carry the highest risk for the buyer because the total
    costs are uncertain and are used most often when the project scope contains a
    lot of uncertainty or for projects that have large investments early in the project
    life. The following list includes three types of cost-reimbursable contracts:


    +   - Cost plus fixed fee (CPFF) contracts charge back all allowable project costs
    to the seller and include a fixed fee upon completion of the contract. The fee
    is always firm in this kind of contract, but the costs are variable. The seller
    doesn''t necessarily have a lot of motivation to control costs with this type
    of contract.


    +   - Cost plus incentive fee (CPIF) is the type of contract in which the buyer
    reimburses the seller for the seller''s allowable costs and includes an incentive
    for meeting or exceeding the performance criteria laid out in the contract. A
    possibility of shared savings between the seller and buyer exists if performance
    criteria are exceeded.


    +   - Cost plus award fee (CPAF) is the riskiest of the cost plus contracts for
    the seller. In a CPAF contract, the seller will recoup all the costs expended
    during the project, but the award fee portion is subject to the sole discretion
    of the buyer.


    # **Time and Material (T&M) Contracts**


    T&M contracts are a cross between fixed-price and cost-reimbursable contracts.
    The full amount of the material costs is not known at the time the contract is
    awarded. T&M contracts are most often used when human resources with specific
    skills are needed and when the scope of work needed for the project can be quickly
    defined. Time and material contracts include the following characteristics:


    +   - This type of contract resembles a cost-reimbursable contract because the
    costs will continue to grow during the contract''s life and are reimbursable to
    the contractor. The buyer bears the biggest risk in this type of contract.


    +   - This type of contract resembles fixed-price contracts when unit rates are
    used. Unit rates might be used to preset the rates of certain elements or portions
    of the project.


    ![](img/c077f27110b08d0d6c301ce24ad84100_196_0.png)


    The project manager and the project team will be responsible for coordinating
    all the organizational interfaces for the project, including technical, human
    resource, purchasing, and finance.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# ## Tools and Techniques of Plan Procurement Management


    Know these four tools and techniques of the Plan Procurement Management process:


    +   - Make-or-buy analysis

    +   - Expert judgment

    +   - Market research

    +   - Meetings


    **Make-or-Buy Analysis**  Make-or-buy analysis is concerned with whether it is
    more cost-effective to buy or lease the products and services or more cost-effective
    for the organization to produce the goods and services needed for the project.
    Costs should include both direct costs and indirect costs.


    Other considerations in make-or-buy analysis are as follows:


    +   - Capacity issues

    +   - Skills

    +   - Availability

    +   - Trade secrets


    ![](img/c077f27110b08d0d6c301ce24ad84100_197_0.png)


    > Make-or-buy analysis is considered a general management technique and concludes
    with the decision to do one or the other.


    **Expert Judgment**  Expert judgment can be used within the Plan Procurement Management
    process.


    **Market Research**  With market research, an examination is conducted of industry-
    and vendor-specific capabilities. This effort can be conducted with information
    obtained at industry conferences, by evaluating online reviews, and by using a
    variety of sources to identify market capabilities.


    **Meetings**  As a complement to the effort of market research, meetings with
    potential bidders may be conducted to help augment the interchange of information.
    This approach can be mutually beneficial to both the purchaser and the supplier.


    # ## Outputs of Plan Procurement Management


    Know the following outputs of the Plan Procurement Management process:


    +   - Procurement management plan

    +   - Procurement statement of work

    +   - Procurement documents

    +   - Source selection criteria'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - Make-or-buy decisions

    +   - Change requests

    +   - Project documents update


    **Procurement Management Plan**  The procurement management plan details how the
    procurement process will be managed. According to the *PMBOK*® *Guide*, it includes
    the following information:


    +   - Types of contracts to use

    +   - Authority of the project team

    +   - How the procurement process will be integrated with other project processes

    +   - Where to find standard procurement documents (provided your organization
    uses standard documents)

    +   - How many vendors or contractors are involved and how they’ll be managed

    +   - How the procurement process will be coordinated with other project processes,
    such as performance reporting and scheduling

    +   - How the constraints and assumptions might be impacted by purchasing

    +   - How multiple vendors or contractors will be managed

    +   - Coordination of purchasing lead times with the development of the project
    schedule

    +   - Schedule dates that are determined in each contract

    +   - Identification of prequalified sellers (if known)

    +   - Risk management issues

    +   - Procurement metrics for managing contracts and for evaluating sellers

    +   - Directions to sellers regarding the development and maintenance of the WBS

    +   - Setting of the form and format of statements of work

    +   - Selection of prequalified sellers to be used, if there are any

    +   - Identification of procurement metrics to be used to manage contracts and
    evaluate sellers


    As with other plans, the procurement management plan can be highly detailed or
    broadly stated, and can be formal or informal based on the needs of the project.


    **Procurement Statement of Work**  A procurement statement of work (SOW) contains
    the details of the procurement item in clear, concise terms. It includes the following
    elements:


    +   - Project objectives

    +   - Description of the work of the project and any post-project operational
    support needed

    +   - Concise specifications of the product or services required

    +   - Project schedule, time period of services, and work location'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The procurement SOW is prepared by the buyer and is developed from the project
    scope statement and the WBS and WBS dictionary. The seller uses the SOW to determine
    whether they are able to produce the goods or services as specified. It will undergo
    progressive elaboration as the procurement processes occur.


    **Procurement Documents** Procurement documents are used to solicit vendors and
    suppliers to bid on procurement needs. These documents are prepared by the buyer
    to assure as accurate and complete a response as possible from all potential bidders.
    Examples of procurement documents include the following:


    +   - Request for proposal (RFP)

    +   - Request for information (RFI)

    +   - Invitation for bid (IFB)

    +   - Request for quotation (RFQ)


    Procurement documents typically include the following information:


    +   - Clear description of the work requested

    +   - Contract SOW

    +   - Explanation of how sellers should format and submit their responses

    +   - Any special provisions or contractual needs


    The following words are used during the procurement process:


    +   - When the decision is going to be made primarily on price, the words *bid*
    and *quotation* are used, as in IFB or RFQ.

    +   - When considerations other than price (such as technology or specific approaches
    to the project) are the deciding factor, the word *proposal* is used, as in RFP.


    Procurement documents are posted or advertised according to the buyer’s organizational
    policies. This might include ads in newspapers and magazines or ads/posts on the
    Internet.


    **Source Selection Criteria** The term *source selection criteria* refers to the
    method the buyer’s organization will use to choose a vendor from among the proposals
    received. The criteria might be subjective or objective.

    Here are some examples of criteria used:


    +   - Purchase price

    +   - Scoring models

    +   - Rating models


    The following list includes some of the criteria for evaluating proposals and
    bids:


    +   - Comprehensive and understanding of the needs of the project as documented
    in the contract SOW

    +   - Cost

    +   - Technical ability of the vendor and their proposed team

    +   - Technical approach'
  merge: -1
  img_proc: true
