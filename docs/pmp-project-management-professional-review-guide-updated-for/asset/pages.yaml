    +   * Competency describes the skills and ability needed to perform the project
    activities.


    **Project Organizational Charts** The project organizational charts display project
    team members and their reporting relationships in the project.


    **Staffing Management Plan** The staffing management plan documents how and when
    human resources are introduced to the project and the criteria for releasing them.
    The staffing management plan should be updated throughout the project. The following
    elements should be considered and included in the staffing management plan:


    +   * Staff acquisition describes how team members are acquired, where they’re
    located, and the costs for specific skills and expertise.


    +   * Resource calendars describe the time frames in which the resources will
    be needed on the project and when the recruitment process should begin.


    +   * Staff release plan describes how project team members will be released at
    the end of their assignment, including reassignment procedures.


    +   * Training needs describe any training plans needed for team members who don’t
    have the required skills or abilities to perform project tasks.


    +   * Recognition and rewards describe the systems used to reward and reinforce
    desired behavior.


    +   * Compliance details regulations that must be met and any human resource policies
    the organization has in place that deal with compliance issues.


    +   * Safety includes safety policies and procedures that are applicable to the
    project or industry and should be included in the staffing management plan.


    ![](img/c077f27110b08d0d6c301ce24ad84100_186_0.png)


    # **Exam Essentials**


    **Be able to define the purpose of the Plan Human Resource Management process.**
    Plan Human Resource Management involves determining roles and responsibilities,
    reporting relationships for the project, and creating the staffing management
    plan, which describes how team members are acquired and the criteria for their
    release.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Developing a Communications Management Plan


    Communications plays an important role in effectively and efficiently carrying
    out a project—with successful results! Like other plans, it should be as detailed
    as needed for the project at hand and should be based on the project organization
    structure and stakeholder requirements. This plan is responsible for managing
    the flow of project information and is created out of the Plan Communications
    process.


    Keep in mind that, according to PMI^{18}, a good project manager spends up to
    90 percent of their time communicating. Therefore, the communications management
    plan should be well thought out and clearly documented.


    The Plan Communications Management process involves determining the communication
    needs of the stakeholders by defining the types of information needed, the format
    for communicating the information, how often it''s distributed, and who prepares
    it. All of this is documented in the communications management plan, which is
    an output of this process. The total number of existing communication channels
    is also calculated in this process.


    Figure 3.28 shows the inputs, tools and techniques, and outputs of the Plan Communications
    Management process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_187_0.png)


    > For more detailed information on the Plan Communications Management process,
    see Chapter 5 of PMP^{®}: Project Management Professional Exam Study Guide, Eighth
    Edition.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Inputs of Plan Communications Management


    Know the following inputs of the Plan Communications Management process:


    +   - Project management plan

    +   - Stakeholder register

    +   - Enterprise environmental factors

    +   - Organizational process assets


    **Project Management Plan** The project management plan will provide direction
    on how information on the project will be executed, monitored, controlled, and
    closed.


    **Stakeholder Register** The stakeholder register is a list of all the project
    stakeholders and contains additional information, including their potential influence
    on the project and their classifications.


    **Enterprise Environmental Factors** All enterprise environmental factors can
    be used within the Plan Communications Management process. Special attention should
    be given to the organizational structure and culture as well as external stakeholder
    requirements. This information will be key to managing the flow of the project’s
    information.


    **Organizational Process Assets** The *PMBOK*® *Guide* notes that all the elements
    described in the enterprise environmental factors can be used in this process.
    Particular consideration should be given to lessons learned and historical information.


    > The *PMBOK*® *Guide* notes that there is a difference between effective and
    efficient communication. Effective communication refers to providing the information
    in the right format for the intended audience at the right time. Efficient communication
    refers to providing the appropriate information at the right time—that is, only
    the information that’s needed at the time.


    # Tools and Techniques of Plan Communications Management


    The Plan Communications Management process includes the following tools and techniques:


    +   - Communication requirements analysis

    +   - Communication technology

    +   - Communication models

    +   - Communication methods

    +   - Meetings'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Communication Requirements Analysis


    Communication requirements analysis involves analyzing and determining the communication
    needs of the project stakeholders. According to the *PMBOK* Guide, there are several
    sources of information you can examine to help determine these needs:


    +   - Company and departmental organizational charts

    +   - Stakeholder responsibility relationships

    +   - Other departments and business units involved in the project

    +   - The number of resources involved in the project and where they''re located
    in relation to project activities

    +   - Internal needs that the organization may need to know about the project

    +   - External needs that organizations such as the media, government, or industry
    groups might have that require communication updates

    +   - Stakeholder information (documented in the stakeholder register and stakeholder
    management strategy outputs of Identify Stakeholders)


    The preceding list goes through analysis to make certain that information that
    is valuable to the stakeholders is being supplied. It is important to know the
    number of communication channels, also known as lines of communication, that exist.
    Figure 3.29 shows an example of a network model with six stakeholders included.


    # FIGURE 3.29 Network communication model


    ![](img/c077f27110b08d0d6c301ce24ad84100_189_0.png)


    The nodes are the participants, and the lines show the connection between them
    all. The formula for calculating the lines of communication is as follows (where
    *n* represents total participants):


    lines of communication = $n(n - 1) + 2$'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Figure 3.29 shows six participants. When you plug the total participants into
    the for- mula, the result is a total of 15 communication channels:


    $$ 6(6-1) \div 2=15 $$


    | Day of the Exam |

    |---|

    | This is another formula that would helpful to add to scratch paper before you
    begin the exam: lines of communication = n(n-1)÷2. |


    # ## Communication Technology


    Communication technology examines the methods (or technology) used to communicate
    the information to, from, and among the stakeholders. This tool and technique
    examines the technology elements that might affect project communications.


    The following are examples of methods used when communicating:


    +   - Written

    +   - Spoken

    +   - Email

    +   - Formal status reports

    +   - Meetings

    +   - Online databases

    +   - Online schedules


    # ## Communication Models


    Communication models depict how information is transmitted from the sender and
    how it’s received by the receiver. According to the PMBOK® Guide, the key components
    of a com- munication model are as follows:


    **Encode** Encoding the message means to put information or thoughts into a language
    that the receiver will understand.


    **Message and Feedback Message** The result or output of the encoding.


    **Medium** The method used to communicate, such as written, oral, or email.


    **Noise** Anything that keeps the message from being either transmitted or understood.


    **Decode** The receiver translates the information that was sent by the sender.


    The sender is responsible for encoding the message, selecting the medium, and
    decod- ing the feedback message. The receiver is responsible for decoding the
    original message from the sender and encoding and sending the feedback message.
    Figure 3.30 shows this dynamic through the basic communication model.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_191_0.png)


    # Communication Methods


    Communication methods refer to how the project information is shared among the
    stakeholders. According to the *PMBOK*® *Guide*, there are three classifications
    of communication methods:


    **Interactive Communication**  Interactive communication involves multidirectional
    communication where two or more parties must exchange thoughts or ideas. This
    method includes videoconferencing, phone or conference calls, and meetings.


    **Push Communications**  Push communications refers to sending information to
    intended receivers. It includes methods such as letters, memos, reports, emails,
    voicemails, and so on. This method assures that the communication was sent but
    is not concerned with whether it was actually received or understood by the intended
    receivers.


    **Pull Communications**  The likely recipients of the information access the information
    themselves using methods such as websites, e-learning sites, knowledge repositories,
    shared network drives, and so on.


    # Meetings


    Meetings are used by the project manager to facilitate conversations with the
    project team on how project communications should occur throughout the life of
    the project. According to the *PMBOK*® *Guide*, various types of meeting types
    can be used, many of which help resolve issues and facilitate decisions.'
  merge: -1
  img_proc: true
