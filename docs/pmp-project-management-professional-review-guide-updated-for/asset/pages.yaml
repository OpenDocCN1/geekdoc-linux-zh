- pgno: 95
  md: 'feasibility study is a great first step in building the business case. Most
    business case documents contain the following items:


    +   Description of the business need for the project

    +   Description of any special requirements that must be met

    +   Description of alternative solutions

    +   Description of the expected results of each alternative solution

    +   Cost-benefit analysis

    +   Recommended solution


    **Agreements** The agreements input is applicable only when the organization you
    are working for is performing a project for a customer external to the organization.
    The agreement is used as an input to this process because it typically documents
    the conditions under which the project will be executed, the time frame, and a
    description of the work.


    **Enterprise Environmental Factors** Enterprise environmental factors refer to
    the factors outside the project that may have significant influence on the success
    of the project. According to the *PMBOK® Guide*, the environmental factors, in
    relation to this process, include but are not limited to the following items:


    +   Governmental or industry standards, which include elements such as regulatory
    standards and regulations, quality standards, product standards, and workmanship
    standards

    +   Organizational culture and structure

    +   Marketplace conditions, referring to the supply-and-demand theory along with
    economic and financial factors


    **Organizational Process Assets** Organizational process assets are the organization''s
    policies, guidelines, procedures, plans, approaches, or standards for conducting
    work, including project work.


    These assets include a wide range of elements that might affect several aspects
    of the project. In relation to this process, organizational process assets refer
    to the following items:


    +   Processes, policies, templates, and procedures of the organization

    +   Corporate knowledge base, such as historical information and lessons learned


    # # Tools and Techniques of the Develop Project Charter Process


    The Develop Project Charter process has only two tools and techniques that you
    should be familiar with: expert judgment and facilitation techniques. The concept
    behind expert judgment is to rely on individuals, or groups of individuals, who
    have training, specialized knowledge, or skills in the areas you''re assessing.
    These individuals may be stakeholders, consultants, other experts in the organization,
    subject matter experts, the project management office (PMO),'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'industry experts, or technical or professional organizations. Facilitation
    techniques refer to the application of the project management processes through
    the use of brainstorming, meeting management, conflict resolution, and other techniques
    employed by the facilitators.


    In addition, you should be familiar with who is considered to be a key stakeholder.
    Key project stakeholders include the following individuals:


    Project Manager  The project manager is the person who assumes responsibility
    for the success of the project. The project manager should be identified as early
    as possible in the project and ideally should participate in writing the project
    charter. The following are examples of what the role of project manager entails:


    +   - Project planning and managing the overall work of the project

    +   - Setting the standards and policies for the projects on which they work

    +   - Establishing and communicating the project procedures to the project team
    and stakeholders

    +   - Identifying activities and tasks, resource requirements, project costs,
    project requirements, performance measures, and more

    +   - Keeping all stakeholders and other interested parties informed


    Project Sponsor  The project sponsor is usually an executive in the organization
    who has the power and authority to make decisions and settle disputes or conflicts
    regarding the project. The sponsor takes the project into the limelight, gets
    to call the shots regarding project outcomes, and funds the project. The project
    sponsor should be named in the project charter and identified as the final authority
    and decision maker for project issues.


    Project Champion  The project champion is usually someone with a great deal of
    technical expertise or industry knowledge regarding the project who helps focus
    attention on the project from a technical perspective. Unlike the sponsor, the
    project champion doesn''t necessarily have a lot of authority or executive powers.


    Functional Managers  Project managers must work with and gain the support of functional
    managers in order to complete the project. Functional managers fulfill the administrative
    duties of the organization, provide and assign staff members to projects, and
    conduct performance reviews for their staff.


    # Outputs of the Develop Project Charter Process


    The Develop Project Charter process results in a single, but critical, output:
    the project charter. According to the *PMBOK® Guide*, a useful and well-documented
    project charter should include at least these elements:


    +   - Purpose or justification for the project

    +   - Project objectives that are measurable

    +   - High-level list of requirements

    +   - High-level description of the project

    +   - High-level list of risks

    +   - Summary milestone schedule'
