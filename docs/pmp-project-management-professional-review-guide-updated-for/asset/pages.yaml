    # **Calculating Expected Value Using PERT**


    PERT and CPM are similar techniques: CPM uses the most likely duration to determine
    project duration, whereas PERT uses what''s called expected value (or the weighted
    average). Expected value is calculated using the three-point estimates for activity
    duration.


    ![](img/c077f27110b08d0d6c301ce24ad84100_154_0.png)


    # **Calculating Standard Deviation**


    The formula for standard deviation is as follows:


    (Pessimistic – Optimistic)/ 6


    For data that fits a bell curve, the following is true:


    +   * Work will finish within ± 3 standard deviations 99.73 percent of the time.

    +   * Work will finish within ± 2 standard deviations 95.44 percent of the time.

    +   * Work will finish within ± 1 standard deviation 68.27 percent of the time.


    # **Standard Deviation**


    The higher the standard deviation is for an activity, the higher the risk. Since
    standard deviation measures the difference between the pessimistic and the optimistic
    times, a'
