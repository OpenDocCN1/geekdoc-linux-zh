    # # Controlling Stakeholder Engagement


    As the project moves forward, the project manager will need to continuously and
    carefully monitor the level of stakeholder engagement to ensure that expectations
    are well gauged and met. Stakeholders who are passive and not actively engaged
    may negative impact the project at a later point, such as introducing new requirements
    that could have been addressed earlier in the project life cycle. The project
    manager may need to adjust the strategy for managing stakeholder expectations
    and engagement levels as the project progresses.


    # ## Control Stakeholder Engagement


    The Control Stakeholder Engagement process belongs to the Project Stakeholder
    Management Knowledge Area, and is responsible for monitoring stakeholder relationships
    and adjusting the stakeholder management plan as a result of their engagement.
    As a result of this process, stakeholder engagement becomes more efficient and
    effective.'
  merge: -1
  img_proc: true
