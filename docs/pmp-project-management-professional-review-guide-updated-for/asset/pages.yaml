- pgno: 207
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_207_0.png)


    For more detailed information on the Identify Risks process, see Chapter 6 of
    *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.


    # ## Inputs of Identify Risks


    You should be familiar with the following inputs of the Identify Risks process:


    +   * Risk management plan

    +   * Cost management plan

    +   * Schedule management plan

    +   * Quality management plan

    +   * Human resource management plan

    +   * Scope baseline

    +   * Activity cost estimates

    +   * Activity duration estimates

    +   * Stakeholder register

    +   * Project documents

    +   * Procurement documents

    +   * Enterprise environmental factors

    +   * Organizational process assets


    **Risk Management Plan** In this process, the roles and responsibilities section
    of the risk management plan will be used, as well as the budget and schedule set
    aside for risk activities.


    **Cost Management Plan, Schedule Management Plan, Quality Management Plan, Human
    Resource Management Plan, Project Documents** An understanding of the project
    management plans and project documents is necessary for identifying risks. A thorough
    review of these documents should be carried out to identify risks associated with
    them.


    **Scope Baseline** The project scope statement, part of the scope baseline, contains
    a list of project assumptions, which are issues believed to be true. The assumptions
    about delivery times are reexamined, and it is determined if they are still valid.


    **Activity Cost Estimates** Activity cost estimates may provide insight into the
    identification of risks if the estimates are found to be insufficient to complete
    the activity.


    **Activity Duration Estimates** Activity duration estimates may reveal existing
    risks in relation to the time that has been allotted for completing an activity
    or the project as a whole.


    **Stakeholder Register** Understanding stakeholder influence is essential to risk
    management. The stakeholder register provides a list of stakeholders and may list
    levels of influence.


    **Procurement Documents** When a project requires the use of external procurement
    of resources, procurement documents are an influential input to the Identify Risks
    process.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '**Enterprise Environmental Factors** The enterprise environmental factors include
    aspects from outside the project that might help determine or influence project
    outcomes. Industry information or academic research that might exist for your
    application areas regarding risk information is especially relevant.


    **Organizatonal Process Assets** Historical information, such as from previous
    project experiences and project team knowledge, is used from within the organizational
    process assets. Risk register templates can also be used from past similar projects.


    # ## Tools and Techniques of Identify Risks


    The Identify Risks process includes the following tools and techniques:


    +   - Documentation reviews

    +   - Information-gathering techniques

    +   - Checklist analysis

    +   - Assumptions analysis

    +   - Diagramming techniques

    +   - SWOT analysis

    +   - Expert judgment


    **Documentation Reviews** Documentation reviews involve reviewing project plans,
    assumptions, and historical information from previous projects from a total project
    perspective as well as from an individual deliverables and activities level. This
    review helps the project team identify risks associated with the project objectives.


    **Information-Gathering Techniques** The following information-gathering techniques
    are used to assist in compiling a comprehensive list of risks:


    +   - Brainstorming

    +   - Delphi technique

    +   - Interviewing

    +   - Root cause analysis


    **Checklist Analysis** Checklists used during the Identify Risks process are usually
    developed based on historical information and previous project team experience.
    The lowest level of the RBS or a list of risks from previous similar projects
    may be used. The WBS can also be used as a checklist.


    **Assumptions Analysis** Assumptions analysis is a matter of validating the assumptions
    identified and documented during the course of the project planning processes.
    Assumptions should be accurate, complete, and consistent. All assumptions are
    tested against two factors:


    +   - Strength of the assumption or the validity of the assumption

    +   - Consequences that might impact the project if the assumption turns out to
    be false'
  merge: -1
  img_proc: true
- pgno: 209
  md: '**Diagramming Techniques** Three types of diagramming techniques are used in
    the Identify Risks process:


    **Cause-and-Effect** Cause-and-effect diagrams show the relationship between the
    effects of problems and their causes. This diagram depicts every potential cause
    and subcause of a problem and the effect that each proposed solution will have
    on the problem. This diagram is also called a fishbone diagram or Ishikawa diagram
    after its developer, Kaoru Ishikawa. Figure 3.36 shows a sample cause-and-effect
    diagram.


    # **FIGURE 3.36** Cause-and-effect diagram


    ![](img/c077f27110b08d0d6c301ce24ad84100_209_0.png)


    **System of Process Flowcharts** The system of process flowcharts shows the logical
    steps needed to accomplish an objective, how the elements of a system relate to
    each other, and which actions cause which responses. Figure 3.37 shows a flowchart
    to help determine whether risk response plans should be developed for the risk.


    **Influence Diagramming** According to the *PMBOK*® *Guide*, influence diagramming
    typically shows the causal influences among project variables, the timing or time
    ordering of events, and the relationships among other project variables and their
    outcomes. Figure 3.38 shows an influence diagram for a product introduction decision.


    **SWOT Analysis** Strengths, weaknesses, opportunities, and threats (SWOT) analysis
    is a technique that examines the project from each of these viewpoints and from
    the viewpoint of the project itself. SWOT should also be used to examine project
    management processes, resources, the organization, and so on to identify risks
    to the project, including risks that are generated internally. SWOT analysis uncovers
    the following:


    +   □ Negative risks, which are typically associated with the organization’s weaknesses

    +   □ Positive risks, which are typically associated with the organization’s strengths


    SWOT analysis also determines whether any of the organization’s strengths can
    be used to overcome its weaknesses.'
  merge: -1
  img_proc: true
