    # Inputs of Control Stakeholder Engagement


    There are four inputs of the Control Stakeholder Engagement process:


    +   * Project management plan

    +   * Issue log

    +   * Work performance data

    +   * Project documents


    **Project Management Plan** The project management plan contains the stakeholder
    management plan, which guides the project manager in carrying out the process.


    **Issue Log** The issue log documents all issues identified, as well as updates
    and progress on their resolution. Issues may need to be updated as this process
    is performed.


    **Work Performance Data** Work performance data includes measurements captured
    throughout the *Monitoring and Controlling* processes. Examples of data that may
    be used as part of this process include what work has been completed, change requests
    submitted, and technical performance measurements.


    **Project Documents** Documents typically referred to as part of the Control Stakeholder
    Engagement process include the schedule, stakeholder register, issue and change
    logs, and project communications.'
