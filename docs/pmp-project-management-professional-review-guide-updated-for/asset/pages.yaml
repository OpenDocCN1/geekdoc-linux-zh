  md: "**Be able to define a WBS and its components.** The WBS is a deliverable-oriented\
    \ hierarchy. It uses the deliverables from the project scope statement or similar\
    \ documents and decomposes them into logical, manageable units of work. The lowest\
    \ level of any WBS is called a work package.\n\n![](img/c077f27110b08d0d6c301ce24ad84100_129_0.png)\n\
    \n> Don’t forget that the Project Scope Management Knowledge Area has two more\
    \ processes: Validate Scope and Control Scope. Look for a discussion of these\
    \ processes in Chapter 5, “Monitoring and Controlling the Project.”\n\n# ## Developing\
    \ a Project Schedule\n\nLike the Project Scope and Project Cost Management Knowledge\
    \ Areas, the Project Time Management Knowledge Area also has a plan that guides\
    \ the processes within it: the schedule management plan. A good tip to remember\
    \ is that there is a pattern to the logic regarding a standard and consistent\
    \ methodology in each of the Knowledge Areas described in this chapter, namely\
    \ that each Knowledge Area leads with a process to develop the plan for that area\
    \ of management. In this chapter, that process is called Plan Schedule Management.\n\
    \nDeveloping a schedule consists of six steps, each carried out through a formal\
    \ planning process:\n\n+   - Plan Schedule Management, which is similar to processes\
    \ in other Knowledge Areas, sets the policies, procedures, and documentation used\
    \ in the planning, creation, managing, executing, and controlling of the project\
    \ schedule.\n+   - Define Activities, which breaks down the work packages of the\
