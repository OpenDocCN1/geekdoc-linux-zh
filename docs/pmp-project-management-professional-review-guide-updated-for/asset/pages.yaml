  md: 'Personnel Assessment Tools Personnel assessment tools capture feedback obtained
    on the project team''s level of effectiveness. The intention is to increase the
    probability of the team''s success in achieving the project objectives through
    the increase of per- formance. According to the PMBO® Guide, team performance
    is measured against the following:


    +   -   Technical success

    +       -   Performance against the schedule

    +       -   Performance against the budget


    # Outputs of Develop Project Team


    The following two outputs result from the Develop Project Team process:


    Team Performance Assessments Team performance assessments involve determining
    the project team''s effectiveness. Assessing these characteristics helps to determine
    where (or whether) the project team needs improvements. The following indicators
    are among those assessed:


    +   -   Improvements in the team''s skills

    +       -   Improvements in the team''s competencies

    +       -   Lower staff attrition

    +       -   Greater level of team cohesiveness


    Enterprise Environmental Factors Updates Updates to the enterprise environmental
    factors typically include updates to team records regarding training and skill
    assess- ment and any personnel administration updates that resulted from carrying
    out this process.


    # Manage Project Team


    The Manage Project Team process is concerned with tracking and reporting on the
    perfor- mance of individual team members. During this process, performance appraisals
    are pre- pared and conducted, issues are identified and resolved, and feedback
    is given to the team members. This process involves management skills that promote
    teamwork and result in high-performance teams.


    Figure 4.7 shows the inputs, tools and techniques, and outputs of the Manage Project
    Team process.


    > NOTE

    > For more detailed information on the Manage Project Team process, see Chapter
    8 of PMP®: Project Management Professional Exam Study Guide, Eighth Edition.'
