    Figure 3.9 shows the inputs, tools and techniques, and outputs of the Plan Schedule
    Management process.


    # FIGURE 3.9 Plan Schedule Management process


    ![](img/c077f27110b08d0d6c301ce24ad84100_130_0.png)


    # Understand Plan Schedule Management


    The schedule management plan should be created early within the planning stages
    of a project. The plan is responsible for guiding the creation, management, and
    control of the project schedule.


    # Inputs of Plan Schedule Management


    Similar to the Plan Scope Management process, you will need to know the following
    four inputs of the Plan Schedule Management process:


    Project Management Plan  To help inform what the project is intended to accomplish,
    the project management plan with all of its approved subsidiary plans is used
    to help create the schedule management plan. Specifically, the scope baseline
    and other information about risk, cost, and communication decisions are used to
    help create the schedule.


    Project Charter  In regard to this process, the project charter is used to define
    the summary milestone schedule and the requirements to obtain project approval
    as it relates to managing the project schedule.


    Enterprise Environmental Factors  Several enterprise environmental factors can
    influence the Plan Schedule Management process, including but not limited to the
    organization’s culture, its infrastructure, project management software that provides
    the scheduling tool and schedule alternative generation, published commercial
    information, and organizational work systems.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# **Organizational Process Assets**

    Quite a few process assets influence the Plan Schedule Management process, including
    but not limited to these:


    +   * The use of monitoring and reporting tools

    +   * Schedule control tools

    +   * Historical information

    +   * Policies, procedures, and guidelines related to formal and informal schedule
    control

    +   * Templates

    +   * Project closure guidelines

    +   * Change control procedures

    +   * Risk control procedures


    # **Tools and Techniques of Plan Schedule Management**

    The three tools and techniques that the Plan Schedule Management process uses
    are expert judgment, analytical techniques, and meetings:


    **Expert Judgment**

    Expert judgment brings invaluable perspective about prior similar projects attempted,
    as well as the existing environment that will affect the project. This can also
    be useful in considering how to combine methods of schedule planning and how to
    best resolve differences between those methods.


    **Analytical Techniques**

    Most management involves picking between different options, and it is no different
    for this process. Plan schedule management may ask you to pick between strategic
    options to estimate and schedule the project like the scheduling methodology,
    which scheduling tools and techniques to use, estimating approaches, formats,
    and project management software. As the project develops, the schedule management
    plan may require analysis to determine options that fast track or crash the project
    schedule. Remember, that these options may introduce risk to the project, so don’t
    forget to update the risk register.


    **Meetings**

    In the course of developing the schedule management plan, members of project teams
    may attend schedule development meetings. Depending on the meeting, the following
    members might include the project manager, project sponsor, selected project team
    members, and anyone having responsibility in this area.


    # **Outputs of Plan Schedule Management**

    The primary output of the Plan Schedule Management process is the schedule management
    plan. The components of this plan establish the following:


    +   * Project schedule model development, which specifies the methodology and
    tools to be used

    +   * Level of accuracy, which sets the tolerances used to determine realistic
    activity duration estimates and the amount needed for contingencies

    +   * Units of measure, which could be vital depending on the industry the project
    is in and whether the project involves multiple countries'
  merge: -1
  img_proc: true
