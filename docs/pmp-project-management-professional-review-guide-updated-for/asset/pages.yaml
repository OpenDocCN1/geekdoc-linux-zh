  md: '# Outputs of Manage Stakeholder Engagement


    The Manage Stakeholder Engagement process results in the following outputs:


    +   • Issue log

    +   • Change requests

    +   • Project management plan updates

    +   • Project documents updates

    +   • Organizational process assets updates


    Issue Log The issue log captures and tracks issues identified by the project manager
    and project team. The issue log is continuously updated throughout the life of
    the project.


    Change Requests The following change requests may emerge as a result of this process:


    +   • Changes to the product or project

    +   • Corrective actions

    +   • Preventive actions


    Project Management Plan Updates Updates to the project management plan, as a result
    of carrying out this process, often involve updating the communications management
    plan.


    Project Documents Updates The stakeholder register may need an update as a result
    of carrying out this process.


    Organizational Process Assets Updates The organizational process assets may include
    the following updates:


    +   • Causes of issues

    +   • Explanations of certain corrective actions

    +   • Lessons learned


    ## Exam Essentials


    *   **Be able to identify the distinguishing characteristics of Direct and Manage
    Project Work.** Direct and Manage Project Work is where the work of the project
    is performed, and the majority of the project budget is spent during this process.

    *   **Be able to describe the purpose of the Manage Communications process.**
    The purpose of the Manage Communications process is to collect, retrieve, store,
    and get information to stakeholders about the project in a timely manner.

    *   **Be able to describe the purpose of the Manage Stakeholder Engagement process.**
    Manage Stakeholder Engagement concerns satisfying the needs of the stakeholders
    and successfully meeting the goals of the project by managing communications with
    stakeholders.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# # Implementing Approved Changes\n\nAs described in the previous section,\
    \ the need for changes will emerge as the project work is executed. All change\
    \ requests created to deal with this need must first be approved by the change\
    \ control board before they can be implemented. This occurs through the Perform\
    \ Integrated Change Control process, which is discussed in Chapter 5 and must\
    \ be managed according to the change management plan.\n\nIt's also important to\
    \ keep in mind that the moment the work enters into the executing stage of the\
    \ project, monitoring and controlling activities begin and continue concurrently\
    \ as the work is progressing. Monitoring and controlling activities also identify\
    \ the need for corrective and preventive actions as well as defect repairs. Once\
    \ change requests are approved, they are implemented through the Direct and Manage\
    \ Project Work process, discussed previously.\n\n> **Exam Essentials**\n> \n>\
    \ Be able to describe the various steps that a change request progresses through.\n\
    > \n> Change requests are reviewed by the change control board through the Perform\
    \ Integrated Change Control process. If approved, the changes are then implemented\
    \ through the Direct and Manage Project Work process.\n\n# # Implementing the\
    \ Quality Management Plan\n\nImplementing the quality management plan occurs throughout\
    \ the Executing and Monitoring and Controlling process groups. During Executing,\
    \ quality assurance activities take place. Quality assurance is responsible for\
    \ auditing quality control activities and the effectiveness of the project management\
    \ processes. These activities are carried out through the Perform Quality Assurance\
    \ process.\n\nThe Perform Quality Assurance process involves performing systematic\
    \ quality activities and uses quality audits to determine which processes should\
    \ be used to achieve the project requirements and to assure that they are performed\
    \ efficiently and effectively. This process also brings about continuous process\
    \ improvement through improved process performance and eliminating unnecessary\
    \ actions. This is done by assessing whether the processes are efficient and whether\
    \ they can be improved.\n\nFigure 4.13 shows the inputs, tools and techniques,\
    \ and outputs of the Perform Quality Assurance process."
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_283_0.png)


    > **NOTE**

    > For more detailed information on the Perform Quality Assurance process, see
    Chapter 9 of PMP®: *Project Management Professional Exam Study Guide, Eighth Edition*.


    # ## Inputs of Perform Quality Assurance


    Know the following inputs of the Perform Quality Assurance process:


    +   - Quality management plan

    +   - Process improvement plan

    +   - Quality metrics

    +   - Quality control measurements

    +   - Project documents


    > **NOTE**

    > The project team members, project manager, and other stakeholders are all responsible
    for the quality assurance of the project.


    **Quality Management Plan** The quality management plan provides guidance for
    carrying out quality assurance activities through this process.


    **Process Improvement Plan** The process improvement plan describes the steps
    for analyzing processes to bring about continuous improvement.


    **Quality Metrics** Quality metrics provide the necessary information to evaluate
    the performance and effectiveness of the quality processes.'
  merge: -1
