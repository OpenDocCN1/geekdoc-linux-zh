- pgno: 122
  md: "**Product Acceptance Criteria** Product acceptance criteria include the process\
    \ and criteria that will be used to determine whether the deliverables and the\
    \ final product, service, or result of the project is acceptable and satisfactory.\n\
    \n**Project Deliverables** Deliverables are measurable outcomes, measurable results,\
    \ or specific items that must be produced to consider the project or project phase\
    \ completed. Deliverables should be specific, unique, and verifiable and may include\
    \ supplementary outcomes.\n\n> ### **Deliverables vs. Requirements**\n> \n> Deliverables\
    \ describe the components of the goals and objectives in a quantifiable way. Requirements\
    \ are the specifications of the deliverables. Select deliverables and requirements\
    \ are sometimes referred to as *critical success factors*. Critical success factors\
    \ are those elements that must be completed for the project to be considered complete.\n\
    \n**Project Exclusions** Project exclusions are anything that isn't included as\
    \ a deliverable or work of the project. Project exclusions should be noted in\
    \ the project scope statement for stakeholder management purposes.\n\n**Project\
    \ Constraints** Anything that either restricts the actions of the project team\
    \ or dictates the actions of the project team or the way the project should be\
    \ performed is considered a constraint. The project manager must balance the project\
    \ constraints while meeting or exceeding the expectations of the stakeholders.\n\
    \nExamples of project constraints include, but are not limited to, the following\
    \ items:\n\n+   * Scope\n+   * Quality\n+   * Schedule\n+   * Budget\n+   * Resources\n\
    +   * Risk\n\n**Project Assumptions** Assumptions are things considered true,\
    \ real, or certain, for planning purposes. Each project will have its own set\
    \ of assumptions, and the assumptions should be identified, documented, validated,\
    \ and updated throughout the project. Defining new assumptions and refining old\
    \ ones are forms of progressive elaboration.\nThe following list includes examples\
    \ of assumptions:\n\n+   * Vendor delivery times\n+   * Product availability\n\
    +   * Contractor availability\n+   * Accuracy of the project plan\n+   * Belief\
    \ that key project members will perform adequately"
  merge: -1
