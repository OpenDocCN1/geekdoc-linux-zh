    will be measured

    +   - Make-or-buy decisions

    +   - Several key procurement-related documents, including procurement terms,
    the procurement statement of work, and source selection criteria


    # **Project Stakeholder Management Knowledge Area Review**


    The Project Stakeholder Management Knowledge Area is concerned with identifying
    all of the stakeholders associated with the project, both internal and external
    to the organization. These processes also assess stakeholder needs, expectations,
    and involvement on the project and seek to keep the lines of communication with
    stakeholders open and clear. The definition of a successful project is one where
    the stakeholders are satisfied. These processes assure that stakeholder expectations
    are met and that their satisfaction is a successful deliverable of the project.
    Figure 3.59 depicts the only planning step in the Project Stakeholder Management
    Knowledge Area.


    As you can see, the planning processes within each Knowledge Area are highly interactive.
    The processes interact not just within their own respective Knowledge Areas, but
    among the other planning processes.'
