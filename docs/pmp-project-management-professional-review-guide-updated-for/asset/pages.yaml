- pgno: 269
  md: "Conflict Management Conflict exists when the desires, needs, or goals of one\
    \ party are incompatible with the desires, needs, or goals of another party (or\
    \ parties). Conflict is the incompatibility of goals, which often leads to one\
    \ party resisting or blocking the other party from attaining their goals. Conflict\
    \ management is how an individual deals with these types of scenarios or issues.\n\
    \nThe following five methods of conflict management are also shown in Figure 4.8:\n\
    \n# FIGURE 4.8 Conflict resolution techniques\n\n| Confict Resolution Techniques\
    \ |\n| :---: | :---: | :---: | :---: | :---: |\n| | Forcing/Directing (win-lose)\
    \ | Smoothing / Accommodating (lose-lose) | Comprosmising / Reconciling (lose-lose)\
    \ | Collaborating / Problem Solving (win-win, BEST option) | Withdrawing / Avoiding\
    \ (lose-lose, WORST option) |\n| | | | | | |\n\nForcing/Directing One person forces\
    \ a solution on the other parties. This is an example of a win-lose conflict resolution\
    \ technique.\n\nSmoothing/Accomodating Smoothing/accommodating is a temporary\
    \ way to resolve conflict in which the areas of agreement are emphasized over\
    \ the areas of difference, so the real issue stays buried. This is an example\
    \ of a lose-lose conflict resolution technique because neither side wins.\n\n\
    Comprosmising/Reconciling Compreming is achieved when each of the parties involved\
    \ in the conflict gives up something to reach a solution. This is an example of\
    \ a lose-lose conflict resolution technique because neither side gets what they\
    \ wanted.\n\nCollaborating/Problem Solving Collaboration and problem solving are\
    \ the best ways to resolve conflict. One of the key actions performed with this\
    \ technique is a fact-finding mission. This is the conflict resolution approach\
    \ project managers use most often and is an example of a win-win conflict resolution\
    \ technique.\n\nWithdrawing/Avoiding An example of withdrawal/avoidance is when\
    \ one of the parties gets up, leaves, and refuses to discuss the conflict. This\
    \ is an example of a lose-lose conflict resolution technique because no solution\
    \ is ever reached. This is considered to be the worst conflict resolution technique.\n\
    \nThe following should also be noted about conflict and conflict resolution:\n\
    \n+   In any situation, conflict should be dealt with as soon as it arises.\n\
    +   \n+   According to the *PMBOK® Guide*, when you have successfully resolved\
    \ conflict, it will result in increased productivity and better, more positive\
    \ working relationships.\n+   \n+   Most conflicts are a result of schedule issues,\
    \ availability of resources (usually the lack of availability), or personal work\
    \ habits."
  merge: -1
  img_proc: true
