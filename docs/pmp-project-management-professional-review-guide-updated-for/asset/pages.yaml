  md: '**Be familiar with payback period.** Payback period is the amount of time it
    will take the company to recoup its initial investment in the product of the project.
    It''s calculated by adding up the expected cash inflows and comparing them to
    the initial investment to determine how many periods it takes for the cash inflows
    to equal the initial investment.


    **Understand the concept of NPV and IRR.** Projects with an NPV greater than zero
    should be accepted, and those with an NPV less than zero should be rejected. Projects
    with high IRR values should be accepted over projects with lower IRR values. IRR
    is the discount rate when NPV is equal to zero and IRR assumes reinvestment at
    the IRR rate.


    # # Defining the High-Level Project Scope


    During the Initiating process group, the high-level project scope is defined and
    documented. As the project moves into the Planning process group, the high-level
    scope is further elaborated and defined. This is typically based on the business
    and compliance requirements and is documented to meet the customer’s expectations.
    According to the *PMBOK® Guide*, the high-level project scope is contained within
    the project charter.


    ![](img/c077f27110b08d0d6c301ce24ad84100_92_0.png)


    For more information on the project charter, see the section “Developing the Project
    Charter” later in this chapter.


    # **Exam Essentials**


    **Be able to identify where the high-level scope is documented and what it is
    based on.** The high-level scope is defined and documented within the project
    charter and is based on the business and compliance requirements.


    # # Identifying High-Level Risks, Assumptions, and Constraints


    The Initiating process group focuses on documenting not only the high-level project
    scope, as mentioned previously, but also high-level risks, assumptions, and constraints.
    This information will be documented in the project charter and will be largely
    based on the existing environment, historical information, and expert judgment.'
