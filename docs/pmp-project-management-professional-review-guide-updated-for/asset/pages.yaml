- pgno: 260
  md: 'Managers display the following characteristics:


    +   - Are generally task-oriented and concerned with issues such as plans, controls,
    budgets, policies, and procedures

    +   - Are generalists with a broad base of planning and organizational skills

    +   - Have a primary goal of satisfying stakeholder needs

    +   - Possess motivational skills and the ability to recognize and reward behavior


    There are four particularly notable theories regarding leadership and management:


    **Theory X & Y** Douglas McGregor defined two models of worker behavior, Theory
    X and Theory Y, that attempt to explain how different managers deal with their
    team members. Theory X managers believe the following statements to be true:


    +   - Most people do not like work and will try to steer clear of it.

    +   - People have little to no ambition and need constant supervision.

    +   - People won''t actually perform the duties of their job unless threatened.


    As a result, Theory X managers are like dictators and impose very rigid controls
    over their employees. They believe people are motivated only by punishment, money,
    or position.


    Theory Y managers have the following characteristics:


    +   - Believe people are interested in performing their best given the right motivation
    and proper expectations

    +   - Provide support to their teams

    +   - Are concerned about their team members

    +   - Are good listeners


    Theory Y managers believe people are creative and committed to the project goals,
    that they like responsibility and seek it out, and that they are able to perform
    the functions of their positions with limited supervision.


    **Theory Z** Theory Z was developed by William Ouchi. This theory is concerned
    with increasing employee loyalty to their organization and results in increased
    productivity. Theory Z has the following characteristics:


    +   - Puts an emphasis on the well-being of the employees both at work and outside
    of work

    +   - Encourages steady employment

    +   - Leads to high employee satisfaction and morale


    Theory Z develops employee loyalty through group decision making, which also results
    in a sense of being valued and respected.


    Figure 4.4 highlights the differences between a Theory X manager, a Theory Y manager,
    and a Theory Z manager.'
