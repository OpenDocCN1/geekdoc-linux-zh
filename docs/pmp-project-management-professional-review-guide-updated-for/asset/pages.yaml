    # ### Tools and Techniques of Perform Qualitative Risk Analysis


    The following tools and techniques are used in the Perform Qualitative Risk Analysis
    process:


    +   - Risk probability and impact assessment

    +   - Probability and impact matrix

    +   - Risk data quality assessment

    +   - Risk categorization

    +   - Risk urgency assessment

    +   - Expert judgment


    **Risk Probability and Impact Assessment** This tool and technique assesses the
    probability that the risk events identified will occur and determines the effect
    (or impact) they have on the project objectives:


    **Probability** Probability is the likelihood that an event will occur.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '**Impact** Impact is the amount of pain or gain that the risk event poses to
    the project. The following are two types of scales used to assign a value to risk:


    +   - The risk impact scale, also known as an ordinal scale, can be a relative
    scale that assigns values such as high, medium, or low.

    +   - Cardinal scale values are actual numeric values assigned to the risk impact.

    +     Cardinal scales are expressed as values from 0.0 to 1.0 and can be stated
    in equal (linear) or unequal (nonlinear) increments.


    Table 3.8 shows a typical risk impact scale for cost, time, and quality objectives
    based on a high-high to low-low scale.


    # TABLE 3.8 Risk impact scale


    | Objectives | Low-Low | Low | Medium | High | High-High |

    | --- | --- | --- | --- | --- | --- |

    | | 0.05 | 0.20 | 0.40 | 0.60 | 0.80 |

    | Cost | No significant impact | Less than 6% increase | 7-12% increase | 13-18%
    increase | More than 18% increase |

    | Time | No significant impact | Less than 6% increase | 7-12% increase | 13-18%
    increase | More than 18% increase |

    | Quality | No significant impact | Few components impacted | Significant impact
    requiring customer approval to proceed | Unacceptable quality | Product not usable
    |


    **Assessing Probability and Impact** The idea behind both probability and impact
    values is to develop predefined measurements that describe which value to place
    on a risk event. Assumptions used to arrive at these determinations should also
    be documented in this process.


    **Probability and Impact Matrix** The outcome of a probability and impact matrix
    is an overall risk rating for each of the project''s identified risks. The following
    are characteristics of the probability and impact matrix:


    +   - The combination of probability and impact results in a classification usually
    expressed as high, medium, or low.

    +   - Values assigned to the risks determine how the Plan Risk Responses process
    is carried out for the risks later during the risk-planning processes.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   - Values for the probability and impact matrix (and the probability and
    impact scales) are determined prior to the start of this process.

    +   - The impact and probability matrix is documented in the risk management plan.


    ![](img/c077f27110b08d0d6c301ce24ad84100_215_0.png)


    > In several countries, it is common for high risks to be reflected as a red condition
    within the probability and impact matrix, medium risks as a yellow condition,
    and low risks as a green condition. This type of ranking is known as an **ordinal
    scale** because the values are ordered by rank from high to low.


    **Risk Data Quality Assessment** The risk data quality assessment involves determining
    the usefulness of the data gathered to evaluate risk. The data must be unbiased
    and accurate. Elements such as the following are used when performing this tool
    and technique:


    +   - Quality of the data used

    +   - Availability of data regarding the risks

    +   - How well the risk is understood

    +   - Reliability and integrity of the data

    +   - Accuracy of the data


    **Risk Categorization** Risk categorization is used to determine the effects risk
    has on the project.


    **Risk Urgency Assessment** Risk urgency assessment determines how soon the potential
    risks might occur and quickly determines responses for those risks that could
    occur in the near term. The following play a role in determining how quickly a
    risk response is needed:


    +   - Risk triggers

    +   - Time to develop and implement a response

    +   - Overall risk rating


    **Expert Judgment** Expert judgment is used to determine the probability, impact,
    and other information derived to date from this process. Interviews and facilitated
    workshops are two techniques used in conjunction with expert judgment to perform
    this process.


    # Outputs of Perform Qualitative Risk Analysis


    The output of the Perform Qualitative Risk Analysis process delivers project documents
    updates, including updates to the risk register and assumptions log.


    According to the *PMBOK*®* Guide*, the risk register will receive the following
    updates, which are added as new entries:


    +   - Risk ranking (or priority) for the identified risks

    +   - Risks grouped by categories

    +   - Causes of risk'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   * List of risks requiring near-term responses

    +   * List of risks that need additional analysis and response

    +   * Watch list of low-priority risks

    +   * Trends in qualitative risk analysis results


    The assumptions log will receive updates as new information is made available
    through the Perform Qualitative Risk Analysis process and quantifies risk exposure
    for project objectives. Assumptions could be incorporated in the project scope
    statement or in a separate log.


    # ## Perform Quantitative Risk Analysis


    The Perform Quantitative Risk Analysis process evaluates the impacts of risk prioritized
    during the Perform Qualitative Risk Analysis process and quantifies risk exposure
    for project objectives. The purpose of this process is to perform the following:


    +   * Quantify the project''s possible outcomes and probabilities.

    +   * Determine the probability of achieving the project objectives.

    +   * Identify risks that need the most attention by quantifying their contribution
    to overall project risk.

    +   * Identify realistic and achievable schedule, cost, or scope targets.

    +   * Determine the best project management decisions possible when outcomes are
    uncertain.


    Figure 3.40 shows the inputs, tools and techniques, and outputs of the Perform
    Quantitative Risk Analysis process.


    # ### FIGURE 3.40 Perform Quantitative Risk Analysis process


    ![](img/c077f27110b08d0d6c301ce24ad84100_216_0.png)'
