- pgno: 298
  md: '# Chapter 5


    # Monitoring and Controlling the Project


    THE PMP® EXAM CONTENT FROM THE MONITORING AND CONTROLLING PERFORMANCE DOMAIN COVERED
    IN THIS CHAPTER INCLUDES THE FOLLOWING:


    +   ✓  Measure project performance using appropriate tools and techniques in order
    to identify and quantify any variances and corrective actions.

    +   ✓  Manage changes to the project by following the change management plan in
    order to ensure that project goals remain aligned with business needs.

    +   ✓  Verify that project deliverables conform to the quality standards established
    in the quality management plan by using appropriate tools and techniques to meet
    project requirements and business needs.

    +   ✓  Monitor and assess risk by determining whether exposure has changed and
    evaluating the effectiveness of response strategies in order to manage the impact
    of risks and opportunities on the project.

    +   ✓  Review the issue log, update if necessary, and determine corrective actions
    by using appropriate tools and techniques in order to minimize the impact on the
    project.

    +   ✓  Capture, analyze, and manage lessons-learned, using lessons learned management
    techniques in order to enable continuous improvement.

    +   ✓  Monitor procurement activities according to the procurement plan in order
    to verify compliance with project objectives.


    ![](img/c077f27110b08d0d6c301ce24ad84100_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_299_0.png)


    Monitoring and Controlling is the fourth of the five project management process
    groups and accounts for 25 percent of the questions on the PMP® exam. The processes
    in the Monitoring and Controlling process group concentrate on monitoring and
    measuring project performance to identify variances from the project management
    plan and get them back on track. Regularly monitoring project performance provides
    insight into the current state of the project and allows you to correct areas
    that are falling off track before they impact your project significantly. The
    Monitoring and Controlling process group is concerned not only with monitoring
    the project work but also with the project as a whole. In multiphase projects,
    this process group coordinates the project phases.


    # # Measuring Project Performance


    As the project work is carried out, it is important to monitor the project performance
    closely. This can be done by using various tools and techniques that assist in
    identifying and quantifying variances as well as determining the necessary corrective
    action needed. Monitoring project performance occurs through the Monitor and Control
    Project Work process, part of the Project Integration Management Knowledge Area.


    Work performed by sellers (resources external to the organization) are monitored
    and controlled through the Control Procurements process. Control Procurements
    is a process that belongs to the Project Procurement Management Knowledge Area.


    # ## Monitor and Control Project Work


    The Monitor and Control Project Work process involves monitoring all the processes
    in the Initiating, Planning, Executing, and Closing process groups to meet the
    performance objectives outlined in the project management plan. Collecting data,
    measuring results, and reporting on performance information are some of the activities
    performed during this process.


    According to the *PMBOK® Guide*, the Monitor and Control Project Work process
    encompasses the following:


    +   - Reporting and comparing actual project results against the project management
    plan

    +   - Analyzing performance data and determining whether corrective or preventive
    action is needed'
  merge: -1
  img_proc: true
