- pgno: 301
  md: '+   - Work performance information

    +   - Enterprise environmental factors

    +   - Organizational process assets


    **Project Management Plan** The project management plan provides the information
    necessary to monitor the project work and determine whether the project is progressing
    as planned.


    **Schedule Forecasts** Schedule forecasts reflect whether the project is on track,
    ahead, or behind schedule, typically expressed in the form of schedule variance
    (SV) or schedule performance index (SPI). SV and SPI are calculated using earned
    value management (EVM) techniques.


    **Cost Forecasts** Cost forecasts reflect whether the project is on, over, or
    under budget. Like schedule forecasts, cost forecasts may be calculated using
    EVM, and expressed in the form of cost variance (CV) or cost performance index
    (CPI). In addition to CV and CPI, the estimate at completion (EAC) may be calculated
    to determine whether forecasts are within a tolerable range from the planned budget.


    ![](img/c077f27110b08d0d6c301ce24ad84100_301_0.png)


    > NOTE  Earned value management (EVM) is reviewed later within this chapter. EVM
    includes the calculation and explanation of schedule and cost forecasts.


    **Validated Changes** Validated changes are those changes that have been reviewed
    and approved by a change control board and have also been validated from a quality
    perspective. Through this process, changes are reviewed to ensure that they have
    been implemented correctly and the desired result has been achieved.


    **Work Performance Information** Work performance information provides information
    produced as a result of carrying out various processes within the Monitoring and
    Controlling process group. It reflects performance data that has been analyzed
    and can therefore be used to make project decisions.


    **Enterprise Environmental Factors** The enterprise environmental factors provide
    the following information used by this process:


    +   - Government or industry standards

    +   - Work authorization systems

    +   - Stakeholder risk tolerances


    **Organizational Process Assets** The following organizational process assets
    are used as inputs:


    +   - Communication requirements

    +   - Procedures for financial controls, risk control, and problem solving

    +   - Lessons learned database


    # Tools and Techniques of Monitor and Control Project Work


    The Monitor and Control Project Work process has four tools and techniques: expert
    judgment, analytical techniques, project management information system, and meetings.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '**Expert Judgment** Expert judgment involves interpreting the information that
    results from this process and making key project decisions as a result of the
    information.


    **Analytical Techniques** In the scope of this process, analytical techniques
    involve using various techniques to forecast possible scenarios based on existing
    variables. The *PMBOK® Guide* provides the following examples:


    +   * Regression analysis

    +   * Grouping methods

    +   * Causal analysis

    +   * Root cause analysis

    +   * Forecasting methods

    +   * Failure mode and effect analysis (FMEA)

    +   * Fault tree analysis (FTA)

    +   * Reserve analysis

    +   * Trend analysis

    +   * Earned value management

    +   * Variance analysis


    **Project Management Information System** There are various project management
    information systems (PMIS) that may be used through this process. Typically, these
    tools are used to help in forecasting calculations.


    **Meetings** This process involves a high degree of interaction and analysis by
    project experts. When used appropriately, meetings can be a powerful mechanism
    for project team members and other subject matter experts to discuss project performance
    and to make decisions.


    # # Outputs of Monitor and Control Project Work


    The Monitor and Control Project Work process has four outputs:


    **Change Requests** As a result of assessing project performance and making decisions
    on how to proceed based on this information, changes may be required. Change requests
    typically include the following items:


    +   * Corrective actions, intended to bring the project back on track with the
    plan

    +   * Preventive actions, intended to prevent the project from getting off track
    with the plan

    +   * Defect repairs, intended to address product or product components that do
    not conform to requirements


    **Work Performance Reports** As a result of assessing work performance information,
    work performance reports are compiled through this process; according to the *PMBOK®
    Guide*, work performance reports are physical or electronic representations of
    performance data. By documenting this information, it can be distributed to stakeholders
    and archived'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'for future reference. Work performance reports can also be used as a means
    of increasing awareness and making decisions in relation to the project.


    **Project Management Plan Updates** Project management plan updates may include
    updates to one or more of the following:


    +   * Schedule management plan

    +   * Cost management plan

    +   * Quality management plan

    +   * Scope baseline

    +   * Schedule baseline

    +   * Cost baseline


    **Project Documents Updates** Project documents updates may include updates to
    the following:


    +   * Forecasts

    +   * Performance reports

    +   * Issue log


    # Control Procurements


    The Control Procurements process is concerned with monitoring the vendor''s performance
    and ensuring that all requirements of the contract are met. This process also
    manages the procurement relationships overall and makes changes and corrections
    as needed.


    According to the *PMBOK*® *Guide*, you must integrate and coordinate the Direct
    and Manage Project Work, Control Quality, Perform Integrated Change Control, and
    Control Risks processes during the Control Procurements process.


    Figure 5.2 shows the inputs, tools and techniques, and outputs of the Control
    Procurements process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_303_0.png)'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_304_0.png)


    For more detailed information on the Control Procurements process, see Chapter
    10 in *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.


    # Inputs of Control Procurements


    Know the following inputs of the Control Procurements process:


    +   - Project management plan

    +   - Procurement documents

    +   - Agreements

    +   - Approved change requests

    +   - Work performance reports

    +   - Work performance data


    **Project Management Plan** The project management plan includes the procurement
    management plan, which guides the project management team in properly carrying
    out the process. It also documents how the contracts will be managed through to
    closure.


    **Procurement Documents** Procurement documents may include the following supporting
    documents:


    +   - Procurement contract awards

    +   - Procurement statement of work


    **Agreements** To administer the relevant contracts, you must first include each
    contract as an input to this process.


    **Approved Change Requests** Approved change requests include changes that have
    been approved to the contract, such as these:


    +   - Modifications to deliverables

    +   - Changes to the product or service of the project

    +   - Changes in contract terms

    +   - Termination for poor performance


    **Work Performance Reports** Work performance reports refer to seller-related
    documents, such as seller performance reports and technical documentation.


    **Work Performance Data** Work performance data involves monitoring work results
    and examining the vendor’s deliverables. This includes monitoring their work results
    against the project management plan and making sure that certain activities are
    performed correctly and in sequence.


    # Tools and Techniques of Control Procurements


    Be familiar with the following tools and techniques of the Control Procurements
    process:


    +   - Contract change control system

    +   - Procurement performance reviews'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   ■ Inspections and audits

    +   ■ Performance reporting

    +   ■ Payment systems

    +   ■ Claims administration

    +   ■ Records management system


    **Contract Change Control System**  The contract change control system describes
    the processes needed to make contract changes. Since the contract is a legal document,
    it cannot be changed without the agreement of all parties. It documents and includes
    the following items:


    +   ■ Instructions for submitting changes

    +   ■ Instructions for establishing the approval process

    +   ■ Instructions outlining authority levels

    +   ■ A tracking system for numbering the change requests and recording their
    status

    +   ■ Procedures for dispute resolution


    Figure 5.3 demonstrates where the contract change control system fits into the
    contract change process.


    # **FIGURE 5.3**  Contract change control system


    ![](img/c077f27110b08d0d6c301ce24ad84100_305_0.png)


    A formal process must be established to process and authorize (or deny) changes.


    > NOTE  Authorization levels of the contract change control system are defined
    in the organizational policies.


    **Procurement Performance Reviews**  Procurement reviews examine the contract
    terms and seller performance. If the seller is not in compliance, action must
    be taken to either get them back into compliance or terminate the contract. These
    reviews can be conducted at the end of the contract’s life cycle or at intervals
    during the contract period.


    **Inspections and Audits**  The purpose of inspections and audits is to determine
    whether there are any deficiencies in the seller’s product or service. These are
    conducted by the buyer or a designated third party.


    **Performance Reporting**  Performance reporting involves providing managers and
    stakeholders with information about the vendor’s progress in meeting the contract
    objectives.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '**Payment Systems** Vendors submit seller invoices as an input to this process,
    and the payment system is the tool and technique used to issue payments.


    **Claims Administration** Claims administration involves documenting, monitoring,
    and managing contested changes to the contract. Contested changes usually involve
    a disagreement about the compensation to the vendor for implementing the change.
    Here are some things to know about claims administration:


    +   - Contested changes are also known as *disputes*, *claims*, or *appeals*.

    +   - Claims can be settled directly between the parties themselves, through the
    court system, or by a process called arbitration.


    ![](img/c077f27110b08d0d6c301ce24ad84100_306_0.png)


    According to the *PMBOK® Guide*, when the parties cannot reach an agreement themselves,
    they should use a alternative dispute-resolution process (ADR), like arbitration.
    Also note that the preferred method of settling disputes is negotiation.


    **Records Management System** A records management system can be part of the project
    management information system (PMIS) and involves the following:


    +   - Documentation

    +   - Policies

    +   - Control functions

    +   - Automated tools


    Records management systems typically index documents for easy filing and retrieval.


    # ## Outputs of Control Procurements


    Know the following five outputs of the Control Procurements process:


    +   - Work performance information

    +   - Change requests

    +   - Project management plan updates

    +   - Project documents updates

    +   - Organizational process assets updates


    **Work Performance Information** Work performance information reflects performance
    data of the vendor that has been analyzed; this information will be used to make
    decisions in regard to any corrective action or changes needed regarding the vendor''s
    performance. According to the *PMBOK® Guide*, work performance information may
    also include contract compliance reports.


    **Change Requests** Change requests may result from performing the Control Procurements
    process and may include changes to plans and baselines. Changes may involve addressing
    any vendor-related performance issues or may even include requests for contract
    changes.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Change requests are submitted and processed through the project''s change control
    system.


    Project Management Plan Updates Project management plan updates that may result
    from the Control Procurements process typically include updates to the procurement
    management plan and baselines.


    Project Documents Updates Project documents typically updated as a result of carrying
    out this process include procurement documentation. Procurement documentation
    produced as part of this process includes, but is not limited to, the following:


    +   Contract

    +   Performance information

    +   Warranties

    +   Financial information

    +   Inspection and audit results

    +   Supporting schedules

    +   Technical documentation

    +   Approved and unapproved contract changes


    Organizational Process Assets Updates According to the PMBOK® Guide, organizational
    process assets updates typically include the following items:


    Correspondence Correspondence is information that needs to be communicated in
    writing to either the seller or the buyer, such as contract changes, audit results,
    notice of unsatisfactory performance, and notification of contract termination.


    Payment Schedules and Requests Payment schedules and requests include information
    about paying the vendor on time and verifying that payment terms are met to warrant
    payment.


    Seller Performance Evaluation Documentation Seller performance evaluation is a
    written record of the seller''s performance on the contract and is prepared by
    the buyer. It should include information about whether the seller successfully
    met contract dates and fulfilled the requirements of the contract and/or contract
    statement of work and whether the work was satisfactory.


    # Exam Essentials


    Name the outputs of the Monitor and Control Project Work process. The outputs
    are change requests, which include corrective actions, preventive actions, and
    defect repair; work performance reports; project management plan updates; and
    project documents updates.


    Name the processes that integrate with the Control Procurements process. Direct
    and Manage Project Work, Control Quality, Perform Integrated Change Control, and
    Control Risks.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # Managing Changes to the Project Scope, Schedule, and Costs


    Managing the triple constraints is an important part of monitoring and controlling
    a project. This includes managing changes to the project scope, schedule, and
    costs, which requires that the project management plan be updated as needed. The
    Validate Scope, Control Scope, Control Schedule, and Control Costs processes focus
    on managing these changes and uncovering existing variance to the plan. As the
    plan is updated with approved changes, these changes should be communicated to
    the team to ensure that revised project goals are met.


    # ## Validate Scope


    Managing and reporting on project progress is the primary focus of the Monitoring
    and Controlling processes. One of the Monitoring and Controlling processes is
    Validate Scope. The primary purpose of the Validate Scope process is to formally
    accept completed deliverables and obtain sign-off that the deliverables are satisfactory
    and meet stakeholders'' expectations. Validate Scope formalizes the acceptance
    of the project scope and is primarily concerned with the acceptance of work results.


    Figure 5.4 shows the inputs, tools and techniques, and outputs of the Validate
    Scope process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_308_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_308_1.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_308_2.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Inputs of Validate Scope


    Know the following inputs of the Validate Scope process:


    +   * Project management plan

    +   * Requirements documentation

    +   * Requirements traceability matrix

    +   * Verified deliverables

    +   * Work performance data


    **Project Management Plan** The scope management plan and scope baseline are used
    from the project management plan. The scope baseline includes the project scope
    statement, work breakdown structure (WBS), and WBS dictionary, all of which will
    be used by this process.


    **Requirements Documentation** To validate the scope of the project work, the
    project, product, and technical requirements (and any others) must be included
    as an input to this process.


    **Requirements Traceability Matrix** The requirements traceability matrix tracks
    the requirements throughout the project life cycle.


    **Verified Deliverables** Verified Deliverables include deliverables that have
    been verified through the Control Quality process. The quality team verifies that
    deliverables have been completed correctly.


    **Work Performance Data** Work performance data reflects raw data relating to
    the deliverables, which is used to determine the degree of compliance against
    the requirements. This can include the number and severity of nonconformities
    and/or total validation cycles performed.


    ![](img/c077f27110b08d0d6c301ce24ad84100_309_0.png)


    > You should perform Validate Scope even if the project is canceled, to document
    the degree to which the project was completed.


    # Tools and Techniques of Validate Scope


    The Validate Scope process has two tools and techniques: inspection and group
    decision-making techniques.


    **Inspection** According to the *PMBOK*® *Guide*, inspection is concerned with
    making sure the project work and deliverables meet the requirements and product
    acceptance criteria. This may include ensuring, examining, and validation activities.


    **Group Decision-Making Techniques** Group decision-making techniques, such as
    unanimity, majority, plurality, and dictators h ip, are used in this process by
    the project team to make a decision after performing validation activities.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Outputs of Validate Scope


    The Validate Scope process results in four outputs:


    **Accepted Deliverables** The accepted deliverables output signifies that the
    deliverables have been formally accepted and signed off by the customer or sponsor.
    This output, along with related documentation, is then fed into the Close Project
    or Phase process at the appropriate time.


    **Change Requests** Change requests address deliverables that were rejected by
    the customer or sponsor and that therefore require defect repair.


    **Work Performance Information** Work performance information includes performance-related
    information relating to deliverables, such as which deliverables have been completed
    or accepted.


    **Project Documents Updates** Project documents updates typically include updates
    to the following items:


    +   - Documents that define the product

    +   - Documents that report completion status


    # Control Scope


    The Control Scope process involves monitoring the status of both the project and
    the product scope, monitoring changes to the project and product scope, and monitoring
    work results to ensure that they match expected outcomes. Any modification to
    the agreed-upon WBS is considered a scope change. This means the addition or deletion
    of activities or modifications to the existing activities on the WBS constitutes
    a project scope change.


    Figure 5.5 shows the inputs, tools and techniques, and outputs of the Control
    Scope process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_310_0.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_311_0.png)


    For more detailed information on the Control Scope process, see Chapter 11 in
    PMP®: Project Management Professional Exam Study Guide, Eighth Edition.


    # Inputs of Control Scope


    Know the following inputs of the Control Scope process:


    +   - Project management plan

    +   - Requirements documentation

    +   - Requirements traceability matrix

    +   - Work performance data

    +   - Organizational process assets


    Project Management Plan The following components of the project management plan
    are used in controlling scope:


    +   - Scope management plan

    +   - Scope baseline

    +   - Change management plan

    +   - Configuration management plan

    +   - Requirements management plan


    Requirements Documentation Information from the requirements documentation input
    used in this process includes the project, product, technical, and any other requirements.


    Requirements Traceability Matrix The requirements traceability matrix is used
    to track the requirements throughout the project life cycle.


    Work Performance Data Work performance data provides the status and progress of
    deliverables.


    Organizational Process Assets Organizational process assets used in this process
    include any policies, procedures, guidelines, and reporting methods that relate
    to scope control.


    # Tools and Techniques of Control Scope


    The Control Scope process has one tool and technique: variance analysis. Variance
    analysis includes reviewing project performance measurements to determine whether
    there are variances in project scope and whether any corrective action is needed
    as a result of existing variances.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_312_0.png)


    Unapproved or undocumented changes that sometimes make their way into the project
    are referred to as scope creep.


    # ### Outputs of Control Scope


    The Control Scope process results in the following outputs:


    +   - Work performance information

    +   - Change requests

    +   - Project management plan updates

    +   - Project documents updates

    +   - Organizational process assets updates


    **Work Performance Information** Work performance information documents the results
    of comparing planned and actual scope performance. This information will be used
    when making scope-related decisions.


    **Change Requests** When scope changes are requested, all areas of the project
    should be investigated to determine what the changes would impact. Change requests
    typically involve the scope baseline or other components of the project management
    plan. Refer to the Integrated Change Control Process to make sure change requests
    are processed for review accordingly.


    **Project Management Plan Updates** Depending on the approved changes, updates
    to the project management plan may result in changes to the scope baseline or
    other project baselines.


    **Project Documents Updates** Updates to project documents that occur as a result
    of this process typically include the requirements documentation and requirements
    traceability matrix.


    **Organizational Process Assets Updates** The following updates are typically
    made to the organizational process assets:


    +   - Causes of variances

    +   - Corrective actions taken

    +   - Lessons learned


    # ## Control Schedule


    The Control Schedule process involves determining the status of the project schedule,
    determining whether changes have occurred or should occur, and influencing and
    managing schedule changes.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Figure 5.6 shows the inputs, tools and techniques, and outputs of the Control
    Schedule process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_313_0.png)


    > For more detailed information on the Control Schedule process, see Chapter 11
    in *PMP®: Project Management Professional Exam Study Guide, Eighth Edition*.


    # Inputs of Control Schedule


    Know the following inputs of the Control Schedule process:


    +   - Project management plan

    +   - Project schedule

    +   - Work performance data

    +   - Project calendars

    +   - Schedule data

    +   - Organizational process assets


    **Project Management Plan** The schedule management plan and the schedule baseline
    are used to carry out the Control Schedule process from within the project management
    plan.


    **Project Schedule** To control the schedule, the project schedule itself must
    be included as an input into the process.'
  merge: -1
  img_proc: true
- pgno: 314
  md: "**Work Performance Data** Work performance data provides status information\
    \ on the schedule activities. This can include raw data, such as which activities\
    \ have started, are in progress, or have finished.\n\n**Project Calendars** Project\
    \ calendars are used to calculate schedule forecasts, which may be based off multiple\
    \ project calendars used to account for different work periods.\n\n**Schedule\
    \ Data** Schedule data is reviewed through this process to monitor schedule progress.\n\
    \n**Organizational Process Assets** The following organizational process assets\
    \ are used in this process:\n\n+   Policies, procedures, guidelines, and reporting\
    \ methods relating to schedule control  \n+   Schedule control tools\n\n# ## Tools\
    \ and Techniques of Control Schedule\n\nThe Control Schedule process includes\
    \ the following tools and techniques:\n\n+   Performance reviews  \n+   Project\
    \ management software  \n+   Resource optimization techniques  \n+   Modeling\
    \ techniques  \n+   Leads and lags  \n+   Schedule compression  \n+   Scheduling\
    \ tool\n\n**Performance Reviews** Performance reviews in this process examine\
    \ elements such as actual start and end dates for schedule activities and the\
    \ remaining time to finish incomplete activities. Schedule variance (SV) and schedule\
    \ performance index (SPI) can be used to determine the impact of the schedule\
    \ variations and whether corrective action is necessary.\n\nIn addition to EVM,\
    \ performance reviews may also evaluate any trends identified, as well as use\
    \ the critical path method and/or critical chain method to determine schedule\
    \ adjustments needed.\n\n**Project Management Software** Project management scheduling\
    \ software can be used to track actual versus planned activity dates and the impact\
    \ of any existing changes.\n\n**Resource Optimization Techniques** Resource optimization\
    \ techniques can leverage techniques such as resource leveling to better distribute\
    \ the work among resources. It considers both resource availability and project\
    \ time."
  merge: -1
  img_proc: true
- pgno: 315
  md: '**Modeling Techniques** Modeling techniques use what-if scenarios to bring
    the actual schedule back in line with the planned schedule. To do this, scenarios
    are determined in concert with risk analysis.


    **Leads and Lags** Leads and lags are adjusted during this process as a means
    of bringing the actual schedule back in line with the schedule baseline.


    **Schedule Compression** Schedule compression techniques, such as fast-tracking
    and crashing, are used to bring the actual schedule back in line with the planned
    schedule.


    **Scheduling Tool** Scheduling tools are used to perform schedule network analysis,
    which results in an updated project schedule.


    # ## Outputs of Control Schedule


    The Control Schedule process includes the following outputs:


    +   *   Work performance information

    +   *   Schedule forecasts

    +   *   Change requests

    +   *   Project management plan updates

    +   *   Project documents updates

    +   *   Organizational process assets updates


    **Work Performance Information** Work performance information typically includes
    the calculated SV and SPI values. According to the *PMBOK® Guide*, SV and SPI
    are calculated for work packages and control accounts.


    **Schedule Forecasts** Schedule forecasts are derived using the various tools
    and techniques described. Forecasts reflect the anticipated future performance
    of the project.


    **Change Requests** Change requests generated as a result of this process typically
    include modifications to the schedule baseline. Aside from baseline changes, changes
    may come in the form of corrective or preventive actions as a means of getting
    the project back on track with the plan.


    **Project Management Plan Updates** Project management plan updates typically
    include updates to the schedule baseline, the cost baseline, and the schedule
    management plan.


    **Project Documents Updates** The project document updates output may require
    updates to the schedule data or the project schedule.


    **Organizational Process Assets Updates** Organizational process assets updates
    typically include the following items:


    +   *   Causes of variances

    +   *   Corrective actions

    +   *   Lessons learned'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Control Costs


    The Control Costs process monitors the project budget, manages changes to the
    cost baseline, and records actual costs. It''s concerned with monitoring project
    costs to prevent unauthorized or incorrect costs from being included in the cost
    baseline. The activities are among those included in this process:


    +   • Monitoring changes to costs or the cost baseline and understanding variances
    from the baseline

    +   • Monitoring change requests that affect cost and resolving them in a timely
    manner

    +   • Informing stakeholders of approved changes and their costs


    Figure 5.7 shows the inputs, tools and techniques, and outputs of the Control
    Costs process.


    # ## FIGURE 5.7 Control Costs process


    ![](img/c077f27110b08d0d6c301ce24ad84100_316_0.png)


    > For more detailed information on the Control Costs process, see Chapter 11 in
    PMP®: Project Management Professional Exam Study Guide, Eighth Edition.


    # # Inputs of Control Costs


    Know the following inputs of the Control Costs process:


    +   • Project management plan

    +   • Project funding requirements'
  merge: -1
  img_proc: true
- pgno: 317
  md: '+   * Work performance data

    +   * Organizational process assets


    **Project Management Plan** The project management plan includes the cost baseline
    and the cost management plan that will be used by this process. The cost baseline
    compares actual expenditures to date on the project to the baseline. The cost
    management plan details how costs should be monitored and controlled throughout
    the life of the project.


    **Project Funding Requirements** Project funding requirements include the periodic
    and total project funding provided.


    **Work Performance Data** The work performance data input provides information
    about the project’s progress, including authorized and incurred costs and project
    estimates.


    **Organizational Process Assets** The following organizational process assets
    are used by this process:


    +   * Policies, procedures, guidelines, and reporting methods relating to cost

    +   * Cost control tools


    # Tools and Techniques of Control Costs


    You should be familiar with the following tools and techniques of the Control
    Costs process:


    +   * Earned value management (EVM)

    +   * Forecasting

    +   * To-complete performance index (TCPI)

    +   * Performance reviews

    +   * Project management software

    +   * Reserve analysis


    **Earned Value Management** Performance measurement analysis can be accomplished
    by using a technique called earned value management (EVM). EVM compares what you’ve
    received or produced to what you’ve spent and establishes the cause and impact
    of variances to determine necessary corrective action. It is the most often used
    performance measurement method.


    EVM is performed on the work packages and the control accounts of the WBS. To
    perform the EVM calculations, the planned value (PV), earned value (EV), and actual
    cost (AC) are collected. They are defined in Table 5.1 along with other terms
    associated with the EVM technique.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Managing Changes to the Project Scope, Schedule, and Costs


    | TABLE 5.1 | Earned value management definitions | |  |


    | Term | Definition |

    | --- | --- |

    | Planned value (PV) | The PV is the budgeted cost of work that has been authorized
    for a schedule activity or WBS component during a given time period or phase.
    These budgets are established during the Planning processes. All PVs add up to
    the budget at completion (BAC). PV is also known as budgeted cost of work scheduled
    (BCWS). |

    | Earned value (EV) | EV is measured as budgeted dollars for the work performed.
    EV is typically expressed as a percentage of the work completed compared to the
    budget. It is also known as budgeted cost of work performed (BCWP). |

    | Actual cost (AC) | AC is the cost of completing the work component in a given
    time period. AC measures the costs (direct, indirect, or other) that were used
    to calculate the planned value. It is also known as actual cost of work performed
    (ACWP). |

    | Cost variance (CV) | CV determines whether costs are higher or lower than budgeted.
    A negative CV means the project is over budget; a positive CV means the project
    is under budget. |

    | Cost performance index (CPI) | CPI measures the value of the work completed
    against actual cost. A CPI of 1 means the project is on budget; a CPI of >1 means
    the project is under budget; a CPI of <1 means the project is over budget. |

    | Schedule variance (SV) | SV determines whether the work is ahead of or behind
    the planned schedule. A positive SV means the project is ahead of schedule; a
    negative SV means the project is behind schedule. |

    | Schedule performance index (SPI) | SPI measures the schedule progress to date
    against the planned progress. An SPI of 1 means the project is on schedule, an
    SPI of >1 means the project is ahead of schedule, and an SPI of <1 means the project
    is behind schedule. |

    | Estimate at completion (EAC) | EAC is the expected total cost of a work component,
    a schedule activity, or the project at its completion. |

    | Estimate to complete (ETC) | ETC is the amount of effort remaining based on
    completed and expected activities. |

    | Budget at completion (BAC) | BAC is the sum of all the budgets (or PVs) established.
    |

    | Variance at completion (VAC) | VAC is the difference between the budget at completion
    and the estimate at completion. |'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'PV, AC, and EV measurements can be plotted graphically to show the variances
    between them. If there are no variances in the measurements, all lines on the
    graph remain the same, meaning that the project is progressing as planned. All
    of these measurements include a cost component. Costs are displayed in an S curve
    because spending is minimal in the beginning of the project, picks up steam toward
    the middle, and then tapers off at the end. This means your earned value measurements
    will also take on the S curve shape. Figure 5.8 shows an example that plots these
    three measurements.


    > It is important to understand the definition of the earned value management
    terms, and how to interpret the results. As part of the exam, you may be asked
    to perform EVM calculations and answer questions based on the results.


    # **FIGURE 5.8** Earned value


    ![](img/c077f27110b08d0d6c301ce24ad84100_319_0.png)


    **Cost Variance** Cost variance is one of the most popular variances that project
    managers use, and it tells you whether your costs are higher than budgeted (with
    a resulting negative number) or lower than budgeted (with a resulting positive
    number). It measures the actual performance to date or during the period against
    what''s been spent. Use this formula:


    $CV = EV - AC$


    **Schedule Variance** Schedule variance, another popular variance, tells you whether
    the schedule is ahead or behind what was planned for this period. This formula
    is most helpful when you''ve used the critical path methodology to build the project
    schedule. Use this formula:


    $SV = EV - PV$'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'Together, the CV and SV are known as efficiency indicators for the project
    and can be used to compare performance of all the projects in a portfolio.


    Cost and schedule performance indexes are primarily used to calculate performance
    efficiencies, and they''re often used to help predict future project performance.


    Cost Performance Index The cost performance index (CPI) measures the value of
    the work completed against actual cost. It is the most critical of all the EVM
    measurements according to the PMBOK® Guide because it tells you the cost efficiency
    for the work completed to date or at the completion of the project. As mentioned
    previously, if CPI is greater than 1, your spending is less than anticipated.
    If CPI is less than 1, you are spending more than anticipated for the work completed.


    Use this formula:


    ```

    CPI = EV ÷ AC

    ```


    Schedule Performance Index The schedule performance index (SPI) measures the progress
    to date against the progress that was planned. This formula should be used in
    conjunction with an analysis of the critical path activities to determine if the
    project will finish ahead of or behind schedule. As mentioned previously, if SPI
    is greater than 1, you are ahead of schedule. If SPI is less than 1, you are behind
    schedule.


    Use this formula:


    ```

    SPI = EV ÷ PV

    ```


    # Day of the Exam


    Interpreting the results of EVM formulas is important. When interpreting CV and
    SV, remember that a positive number is good and a negative number is bad; when
    interpreting CPI and SPI, remember that >1 is good and <1 is bad.


    What is bad when it comes to costs and schedule? Being over budget and behind
    schedule!


    Forecasting Forecasting uses the information gathered to date and estimates the
    future conditions or performance of the project based on what is known when the
    calculation is performed.


    One of the forecasting formulas used is called estimate at completion (EAC). EAC
    estimates the expected total cost of a work component, a schedule activity, or
    the project at its completion. This is the probable final value for the work component
    (or project).


    Use this formula:


    ```

    EAC = AC + bottom-up ETC

    ```'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'The bottom-up estimate to complete (ETC) is the amount of effort remaining
    based on the activities completed to date and what is thought to occur in the
    future. Each estimate is summed to come up with a total ETC.


    According to the PMBOK® Guide, there are four EAC forecasting formulas (see Table
    5.2), which use budget at completion (BAC). BAC is the sum of all the budgets
    established for all the work in the work package, control account, schedule activity,
    or project. It’s the total planned value for the work component or project. In
    addition to the bottom-up ETC, there is one other formula for calculating ETC
    that you should be aware of for the exam. This is also listed in Table 5.2.


    # **TABLE 5.2 EAC and ETC forecasting**


    | Forecast | Formula | Description |

    | --- | --- | --- |

    | EAC | EAC = AC + bottom-up ETC | This is used if the initial plan is no longer
    valid. |

    | EAC | EAC = AC + BAC – EV | This formula calculates EAC based on the actual
    costs to date and the assumption that ETC work will be completed at the budgeted
    rate, thereby accepting previous performance (whether good or bad). |

    | EAC | EAC = BAC ÷ CPI | This forecast assumes that future performance will be
    just like the past performance for the project. |

    | EAC | EAC = AC + [(BAC – EV) ÷ (CPI × SPI)] | This formula assumes there is
    a negative cost performance to date and the project schedule dates must be met.
    |

    | ETC | ETC = EAC – AC | Use this formula when the work is expected to continue
    according to the plan. |

    | ETC | ETC = Reestimate | Use this formula for predicting future cost variances
    that will not be similar to the types of variances you’ve seen to date. It reestimates
    from the bottom up. |


    **To-Complete Performance Index** To-complete performance index (TCPI) is the
    projected performance level the remaining work of the project must achieve to
    meet the BAC or EAC. It’s calculated by dividing the work that’s remaining by
    the funds that are remaining.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "The formula for TCPI when using the BAC is as follows:\n\n$TCPI=(BAC-EV)\\\
    div(BAC-AC)$\n\n![](img/c077f27110b08d0d6c301ce24ad84100_322_0.png)\n\nIf the\
    \ result of calculating the TCPI is less than 1, future work does not have to\
    \ be performed as efficiently as past performance.\n\nWhen the BAC is no longer\
    \ attainable, the project manager should calculate a new EAC, and this new estimate\
    \ becomes the goal you’ll work toward once it’s approved by management. The formula\
    \ for TCPI when EAC is your goal is as follows:\n\n$TCPI=(BAC-EV)\\div(EAC-AC)$\n\
    \n![](img/c077f27110b08d0d6c301ce24ad84100_322_1.png)\n\nIf cumulative CPI falls\
    \ below 1, all future project work must be performed at the TCPI.\n\n**Performance\
    \ Reviews** Performance reviews compare cost performance over time and the estimates\
    \ of funds needed to complete the remaining work. The following three analysis\
    \ types are associated with performance reviews:\n\n+   * Variance analysis calculates\
    \ the difference between the budget at completion and the estimate at completion.\
    \ To calculate this, use the variance at completion (VAC) formula:\n+       $VAC=BAC-EAC$\n\
    +   \n+       Variance analysis works closely with the performance reviews technique.\
    \ Aside from calculating VAC, variance analysis also focuses on the cause that\
    \ led to a deviation from the baselines. By determining the cause of existing\
    \ or potential variance, the project management team can then formulate an effective\
    \ response through a change request.\n\n+   * Trend analysis analyzes existing\
    \ trends of project performance over time and whether performance is improving\
    \ or declining.\n\n+   * Earned value performance includes a comparison of the\
    \ baseline plans to actual performance.\n\n**Project Management Software** Project\
    \ management software is used to monitor PV, EV, and AC. Table 5.3 shows the formulas\
    \ used to calculate values.\n\n**Reserve Analysis** Reserve analysis is used to\
    \ monitor and manage the amount of funds within the contingency and management\
    \ reserves. Reserve analysis is covered further later in this chapter as part\
    \ of controlling risks."
  merge: -1
  img_proc: true
- pgno: 323
  md: '# **TABLE 5.3** Earned value formula summary


    | Item | Formula | Comments |

    | :--- | :--- | :--- |

    | Cost variance (CV) | $CV = EV - AC$ | |

    | Schedule variance (SV) | $SV = EV - PV$ | |

    | Cost performance index (CPI) | $CPI = EV \div AC$ | |

    | Schedule performance index (SPI) | $SPI = EV \div PV$ | |

    | Estimate at completion (EAC) | $EAC = AC + \frac{bottom-up}{ETC}$ | EAC using
    actual costs to date plus new budgeted rates based on expert feedback. |

    | Estimate at completion (EAC) | $EAC = AC + BAC - EV$ | EAC using actual costs
    to date and future performance will be based on budgeted rate. |

    | Estimate at completion (EAC) | $EAC = BAC \times CPI$ | EAC assuming future
    performance will behave like past performance. |

    | Estimate at completion (EAC) | $EAC = AC + \frac{(BAC - EV)}{(CPI \times SPI)}$
    | EAC when cost performance is negative and schedule dates must be met. |

    | Estimate to complete (ETC) | $ETC = EAC - AC$ | When the work is expected to
    continue according to the plan. |

    | Estimate to complete (ETC) | $ETC = Reestimate$ | When future cost variances
    will not be similar to the variances experienced to date, and work must be reestimated
    from the bottom up. |

    | To-complete performance index (TCPI) | $TCPI = \frac{(BAC - EV)}{(BAC - AC)}$
    | This TCPI formula is used when employing BAC. |

    | To-complete performance index (TCPI) | $TCPI = \frac{(BAC - EV)}{(EAC - AC)}$
    | This TCPI formula is used when EAC is your goal. |

    | Variance at completion (VAC) | $VAC = BAC - EAC$ | Used to calculate the variance
    against the budget. |'
  merge: -1
