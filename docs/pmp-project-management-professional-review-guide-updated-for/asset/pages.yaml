    # Inputs of Conduct Procurements


    You should be familiar with several inputs of the Conduct Procurements process:


    +   - Procurement management plan

    +   - Procurement documents

    +   - Source selection criteria

    +   - Seller proposals

    +   - Project documents

    +   - Make-or-buy decisions

    +   - Procurement statement of work

    +   - Organizational process assets


    **Procurement Management Plan** The procurement management plan is used to guide
    how the procurement life cycle, and its corresponding processes, will be managed.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '**Procurement Documents**  The following procurement documents are typically
    used:


    +   * Requests for proposals (RFPs)

    +   * Requests for information (RFIs)

    +   * Requests for quotations (RFQs)


    **Source Selection Criteria**  Source selection criteria include information on
    the vendor require-ments that the project organization will use to make a decision
    on which vendor to select.


    **Seller Proposals**  Seller proposals are the proposals submitted by sellers
    in response to a procurement document package.


    **Project Documents**  Project documents typically used as an input to this process
    include the risk register and risk-related contract decisions.


    **Make-or-Buy Decisions**  Make-or-buy decisions reflect which project deliverables
    will be purchased and which will be handled internally within the organization.
    Buy decisions will go through this process to select the vendor.


    **Procurement Statement of Work**  The procurement statement of work (SOW) describes
    the goals, requirements, and outcomes required by the project team, which in turn
    allows prospective sellers to determine whether they are qualified and capable
    of producing the product or work.


    **Organizational Process Assets**  Organizational process assets may contain information
    on sellers used in past projects. This information is used in this process.


    # ## Tools and Techniques of Conduct Procurements


    Know the following tools and techniques of the Conduct Procurements process:


    +   * Bidder conferences

    +   * Proposal evaluation techniques

    +   * Independent estimates

    +   * Expert judgment

    +   * Advertising

    +   * Analytical techniques

    +   * Procurement negotiations


    **Bidder Conferences**  Bidder conferences, also known as vendor conferences,
    prebid conferences, and contractor conferences, are meetings with prospective
    vendors or sellers that occur prior to the completion of their response proposal.
    Bidder conferences have the following characteristics:


    +   * They allow all prospective vendors to meet with the buyers to ask questions
    and clarify issues they have regarding the project and the RFP.

    +   * They are held once.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   - They are attended by all vendors at the same time.

    +   - They are held before vendors prepare their responses.


    **Proposal Evaluation Techniques** Several techniques can be used to evaluate
    proposals. The types of goods and services you’re trying to procure will dictate
    how detailed your evaluation criteria are. Depending on the complexity of the
    procurements, you may use one or more of the following techniques to evaluate
    and rate sellers:


    +   - Use the source selection criteria process to rate and score proposals.

    +   - When purchasing goods, request a sample from each vendor to compare quality
    (or some other criteria) against your need.

    +   - Ask vendors for references and/or financial records.

    +   - Evaluate the response itself to determine whether the vendor has a clear
    understanding of what you’re asking them to do or provide.


    After using the necessary techniques, compare each proposal against the criteria,
    and rate or score each proposal for its ability to meet or fulfill these criteria.
    This can serve as your first step in eliminating vendors that don’t match your
    criteria. The next step is to apply the tools and techniques of this process to
    further evaluate the remaining potential vendors.


    Using a weighting system, you can assign numerical weights to evaluation criteria
    and then multiply them by the weights of each criteria factor to come up with
    total scores for each vendor. Screening systems and seller rating systems are
    also sometimes used.


    **Independent Estimates** Independent estimates, also known as cost estimates,
    may be compiled by the buyer’s organization to compare to the vendor prices and
    serve as a benchmark. Estimates can also be prepared by an outside professional
    estimator like trade associations of similar businesses.


    **Expert Judgment** Expert judgment may include experts from all areas of the
    organization, including external partners when evaluating proposals and selecting
    vendors.


    **Advertising** Advertising lets potential vendors know that an RFP is available.
    It can be used as a way of expanding the pool of potential vendors, or it may
    be a requirement, such as in the case of government projects. Here are some examples
    of where advertising may appear:


    +   - The company’s Internet site

    +   - Professional journals

    +   - Newspapers


    **Analytical Techniques** Analytical techniques are used to help research potential
    vendors’ capabilities, get an idea of cost, analyze past performance, forecast
    future performance, and learn from others who have undergone similar projects.


    **Procurement Negotiations** In procurement negotiations, both parties come to
    an agreement regarding the contract terms. At a minimum, a contract should include
    the following items:


    +   - Price

    +   - Responsibilities'
  merge: -1
  img_proc: true
- pgno: 256
  md: '+   - Applicable regulations or laws that apply

    +   - Overall approach to the project


    Once agreement is reached and the negotiations are finished, the contract is signed
    by both buyer and seller and is executed.


    # Outputs of Conduct Procurements


    The Conduct Procurements process contains the following six outputs:


    +   - Selected sellers

    +   - Agreements

    +   - Resource calendars

    +   - Change requests

    +   - Project management plan updates

    +   - Project documents updates


    **Selected Sellers** Selected sellers are vendors that have been chosen to provide
    the goods or services requested by the buyer.


    **Agreements** A procurement agreement is a legally binding agreement between
    two or more parties, typically used to acquire goods or services. Agreements have
    several names:


    +   - Memorandums of understanding (MOUs)

    +   - Contracts

    +   - Purchase orders


    The type of contract awarded depends on the product or services being procured
    and on the organizational policies.


    A contract’s life cycle consists of four stages: requirement, requisition, solicitation,
    and award. In the requirement stage, the project and contract needs are established
    and requirements are defined within the statement of work (SOW). The requisition
    stage focuses on refining and confirming the project objectives and generating
    solicitation materials, such as the request for proposals (RFP), request for information
    (RFI), and request for quotations (RFQ). The solicitation stage is where vendors
    are asked to compete and respond to the solicitation materials. And last, the
    award stage is where the vendors are chosen and contracts awarded.


    The contract should clearly address the following:


    +   - Elements of the SOW

    +   - Time period of performance

    +   - Pricing and payment plan

    +   - Acceptance criteria

    +   - Warranty periods

    +   - Dispute resolution procedures and penalties

    +   - Roles and responsibilities'
