- pgno: 193
  md: "# # Developing a Procurement Management Plan\n\nIn many cases, some resources\
    \ will need to be obtained externally (meaning outside of the project's organization).\
    \ When this is the case, a procurement management plan will be needed. This plan\
    \ is created out of the Plan Procurement Management process, which is also responsible\
    \ for producing other key procurement documents.\n\nThe procurement management\
    \ plan should be based on the project's scope and schedule and is responsible\
    \ for guiding the procurement-related processes and ensuring that the required\
    \ project resources will be available when and as needed.\n\nPlan Procurement\
    \ Management is a process of identifying what goods or services will be purchased\
    \ from outside the organization. This process addresses the make-or-buy decision\
    \ and when acquired goods or services will be needed. By the end of this process,\
    \ a procurement management plan will have been created, make-or-buy decisions\
    \ will have been made, and a contract statement of work will have been drafted.\n\
    \nFigure 3.31 shows the inputs, tools and techniques, and outputs of the Plan\
    \ Procurement Management process.\n\n![](img/c077f27110b08d0d6c301ce24ad84100_193_0.png)\n\
    \n> NOTE\n> \n> For more detailed information on the Plan Procurement Management\
    \ process, see Chapter 7 of *PMP®: Project Management Professional Exam Study\
    \ Guide, Eighth Edition*."
  merge: -1
