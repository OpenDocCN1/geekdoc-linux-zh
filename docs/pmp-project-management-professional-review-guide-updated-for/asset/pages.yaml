- pgno: 10
  md: '# # About the Authors


    **Kim Heldman, MBA, PMP®**, is the CIO for the Regional Transportation District
    in Denver, CO. Kim directs IT resource planning, budgeting, project prioritization,
    and strategic and tactical planning. She directs and oversees IT design and development,
    enterprise resource planning systems, IT infrastructure, application development,
    cybersecurity, IT program office, intelligent transportation systems, and data
    center operations.


    Kim oversees the IT portfolio of projects ranging from small in scope and budget
    to multimillion dollar, multiyear projects. She has over 2.5 years of experience
    in information technology project management. Kim has served in a senior leadership
    role for over 18 years and is regarded as a strategic visionary with an innate
    ability to collaborate with diverse groups and organizations, instill hope, improve
    morale, and lead her teams in achieving goals they never thought possible.


    Kim is the author of the *PMP®: Project Management Professional Study Guide, Eighth
    Edition*. She is also the author of *Project Management JumpStart, Third Edition*
    and *Project Manager’s Spotlight on Risk Management* and coauthor of *CompTIA
    Project+, Second Edition*. Kim has also published several articles and is currently
    working on a leadership book.


    Kim continues to write on project management best practices and leadership topics,
    and she speaks frequently at conferences and events. You can contact Kim at `kim.Heldman@gmail.com`.
    She personally answers all her email.


    **Vanina Mangan**o is an executive member of Never Limited LLC, which owns a portfolio
    of companies, including The PM Instructors. The PM Instructors specializes in
    PMP® certification exam preparation material and training. Through The PM Instructors,
    Vanina has authored courseware material within the subject of project management,
    including the most recent release: *PMP® Risk Management Professional Exam Preparation*.


    Over the past decade, Vanina has specialized in working with and leading project,
    program, and portfolio management offices (PMOs) across various industries and
    companies, most recently at NBCUniversal and Microsoft. Currently, Vanina leads
    an enterprise project management office (EPMO) at AMN Healthcare.


    As part of her contribution to the community, Vanina devotes time to furthering
    the project management profession through her volunteer work at the Project Management
    Institute. Vanina is currently serving as the Chair For *The Standard For Program
    Management, Fourth Edition*, and participates in activities that seek to harmonize
    PMP®’s four foundational standards. She has also served as a core committee member
    for *A Guide to the Project Management Body of Knowledge (PMBOK®) Guide, Fifth
    Edition*, and has served as a subject matter expert on multiple PMP® Standards
    and Practice Guides.


    Vanina holds a dual bachelor’s degree from the University of California, Riverside,
    and holds the following credentials: Project Management Professional (PMP®), PMP®
    Risk Management Professional (PMP®-RMP), PMP® Scheduling Professional (PMP®-SP),
    CompTIA Project+, and ITIL Foundation v3.


    You may reach Vanina via email at `Vanina.Mangano@ThePM-Instructors.com`.'
  merge: -1
  img_proc: true
