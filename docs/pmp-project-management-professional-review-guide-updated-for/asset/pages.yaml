  md: 'and recommending changes to resolve conflicts. It also involves the management
    of stake-holder engagement with the idea of unifying the project goals.


    # # Project Procurement Management Knowledge Area Review


    During the Executing process group, vendors are selected for work that will be
    handled externally. Conducting procurements is part of obtaining and hiring the
    resources needed to complete the project work. As you can see, much of project
    execution involves hiring and managing people resources—internal and external
    to the organization.


    Figure 4.20 shows how the single procurement process that takes place during project
    execution results in the selection of the project’s sellers and the issuance of
    procurement contracts. To arrive at this outcome, you will use several planned
    procurement items:


    +   *   Results of the make-or-buy decisions made during the planning phase

    +   *   List of qualified vendors (sellers) and their proposals

    +   *   Criterria that will be used to select the vendors

    +   *   Any agreements or documents impacting vendor selection

    +   *   Procurement management plan


    ![](img/c077f27110b08d0d6c301ce24ad84100_291_0.png)


    # # Project Stakeholder Management Knowledge Area Review


    Stakeholder management is critical to the success of the project, particularly
    when the project team is actively executing the project work. During the Executing
    process group, the project manager actively engages with stakeholders to ensure
    that their needs and expectations are met.'
