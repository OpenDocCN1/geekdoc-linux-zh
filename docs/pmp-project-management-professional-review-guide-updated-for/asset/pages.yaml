  md: 'greater spread between the two, which results in a higher number, indicates
    a greater risk. Conversely, a low standard deviation means less risk.


    One standard deviation gives you a 68 percent (rounded) probability, and two standard
    deviations give you a 95 percent (rounded) probability. For an example of calculating
    date ranges for project durations, see Chapter 4 of PMP®: Project Management Professional
    Exam Study Guide, Eighth Edition.


    Critical Chain Method The critical chain method is a schedule network analysis
    technique that will modify the project schedule by accounting for limited or restricted
    resources. The modified schedule is calculated, and it often changes the critical
    path as a result of adding duration buffers, which are nonworking activities added
    to help manage the planned activity durations. The new critical path showing the
    resource restrictions is called the critical chain.


    Critical chain uses both deterministic (step-by-step) and probabilistic approaches.
    The following are steps in the critical chain process:


    1. Construct the schedule network diagram using activity duration estimates (you’ll
    use nonconservative estimates in this method).

    2. Define dependencies.

    3. Define constraints.

    4. Calculate the critical path.

    5. Enter resource availability into the schedule.

    6. Recalculate for the critical chain.


    A project buffer is placed at the end of the critical chain to help keep the finish
    date from slipping. After the buffers are added, the planned activities are then
    scheduled at their latest start and finish dates.


    Resource Optimization Techniques Resource optimization techniques are used when
    the supply and demand of resources necessitate an adjustment to the schedule model.
    They attempt to smooth out the peaks and valleys of total resource usage through
    strategic consumption of float while also addressing any overcommitment of individual
    resources through rescheduling or reassignment. Examples include but are not limited
    to the following:


    Resource Leveling Resource leveling attempts to smooth out the resource assignments
    to get tasks completed without overloading the resources and while trying to keep
    the project on schedule. This typically takes the form of allocating resources
    to critical path tasks first.


    Here are some examples of resource leveling:


    - Delaying the start of a task to match the availability of a key team member'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - Adjusting the resource assignments so that more tasks are given to team
    members who are underallocated

    +   - Requiring the resources to work mandatory overtime


    **Resource Smoothing** Resource smoothing is a technique that adjusts the schedule
    model by arranging the activities so that the requirements for resources do exceed
    the constraints of the project. The key difference between resource smoothing
    and resource leveling is that, with resource smoothing, the critical path of the
    project remains unchanged. The ability to delay an activity is limited by the
    amount of an activity''s free and total float.


    ![](img/c077f27110b08d0d6c301ce24ad84100_156_0.png)


    > Resource leveling can cause the original critical path to change.


    **Modeling Techniques** There are multiple types of modeling techniques that a
    project manager can use in developing the schedule. Two examples that you should
    be familiar with for the exam include what-if scenario analysis and simulation.


    **What-If Scenario Analysis** What-if scenario analysis evaluates different scenarios
    in order to predict their positive or negative effect on project objectives. According
    to the *PMBOK® Guide*, this is an analysis of the question “What if the situation
    represented by scenario ''X'' happens?” To support this effort, a schedule network
    analysis is performed using the schedule to calculate different scenarios, like
    the delay of a deliverable or a major weather event for a construction project.


    **Simulation** Taking different sets of activity assumptions, simulation calculates
    multiple project duration models using probability distributions constructed from
    three-point estimates to account for uncertainty. Simulation techniques such as
    Monte Carlo analysis use a range of probable activity durations for each activity,
    and those ranges are then used to calculate a range of probable duration results
    for the project itself. Monte Carlo runs the possible activity durations and schedule
    projections many, many times to come up with the schedule projections and their
    probability, critical path duration estimates, and float time.


    **Leads and Lags** A lead accelerates the start date of an activity by the number
    of days specified, whereas a lag delays the start date of an activity. Leads and
    lags were first used in the Sequence Activities process, discussed earlier in
    this chapter.


    **Schedule Compression** Schedule compression is a form of mathematical analysis
    that''s used to shorten the project schedule without changing the project scope.
    To be effective, work compressed must be based on those activities that fall on
    the critical path. There are two types of schedule compression techniques:


    **Crashing** Crashing is a compression technique that looks at cost and schedule
    trade-offs. This involves adding resources to critical path tasks in order to
    shorten the length'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'of the tasks and therefore the length of the project. Crashing the schedule
    can lead to increased risk, increased costs, and a change in the critical path.


    **Fast Tracking** Fast tracking is performing two tasks in parallel that were
    previously scheduled to start sequentially. Fast tracking can increase project
    risk and cause the project team to have to rework tasks, and it only works for
    activities that can be overlapped.


    **Scheduling Tool** The scheduling tools used are typically in the form of project
    management software programs. They will automate the mathematical calculations
    and perform resource-leveling functions.


