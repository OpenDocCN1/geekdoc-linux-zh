- pgno: 342
  md: '# Exam Essentials


    Describe the purpose of the Perform Integrated Change Control process. Perform
    Integrated Change Control is performed throughout the life of the project and
    involves reviewing all the project change requests, establishing a configuration
    management and change control process, and approving or denying changes.


    Be able to define the purpose of a configuration management system. Configuration
    management systems are documented procedures that describe the process for submitting
    change requests, the processes for tracking changes and their disposition, the
    processes for defining the approval levels for approving and denying changes,
    and the process for authorizing the changes. Change control systems are generally
    a subset of the configuration management system. Configuration management also
    describes the characteristics of the product of the project and ensures accuracy
    and completeness of the description.


    Be able to describe the purpose of a change control board. The change control
    board has the authority to approve or deny change requests. Its authority is defined
    and outlined by the organization. A change control board is made up of stakeholders.


    # Communicating Project Status


    Communicating project status occurs throughout activities related to the Executing
    and Monitoring and Controlling processes, as seen throughout this chapter, as
    well as in Chapter 4, “Executing the Project,” of this book. While project reports
    help to align the project with the business needs, it is through the Control Communications
    process that the project manager ensures that communication requirements of stakeholders
    are met.


    # Control Communications


    The Control Communications process is responsible for monitoring and controlling
    communications throughout the duration of the project. It is through this process
    that the project manager ensures that the communication requirements of stakeholders
    are met, along with their needs and expectations.


    Figure 5.18 shows the inputs, tools and techniques, and outputs of the Control
    Communications process.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# F I G U R E  5 . 1 8  Control Communications process


    ![](img/c077f27110b08d0d6c301ce24ad84100_343_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_343_1.png)


    > For more detailed information on the Control Communications process, see Chapter
    10 in *PMP*: *Project Management Professional Exam Study Guide, Eighth Edition*.


    # Inputs of Control Communications


    The Control Communications process includes the following inputs:


    +   - Project management plan

    +   - Project communications

    +   - Issue log

    +   - Work performance data

    +   - Organizational process assets


    **Project Management Plan**  The project management plan contains the project
    management baseline data used to monitor and compare results. Deviations from
    this data are reported to management.


    **Project Communications**  Project communications are produced as the project
    work is executed. Through this process, communications are monitored; the project
    manager may take action as needed based on this communication including releasing
    information to stakeholders.


    **Issue Log**  As the work proceeds forward, the project manager monitors issues
    documented within the issue log, to ensure that resolution is reached.


    **Work Performance Data**  Work performance data is collected throughout the Monitoring
    and Controlling processes. Information such as status of deliverables, schedule,
    and costs is used in the Control Communications process.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '**Organizational Process Assets** The following organizational process assets
    are used in the Control Communications process:


    +   - The organization''s policies and procedures for project communications

    +   - Report templates

    +   - Requirements relating to communication and/or security


    # # Tools and Techniques of Control Communications


    You should know the following three tools and techniques of the Control Communications
    process:


    +   - Information management systems

    +   - Expert judgment

    +   - Meetings


    **Information Management Systems** The information management system can be used
    by the project manager to capture, store, and disseminate information to project
    stakeholders. These systems may be complex or could be as simple as a spreadsheet.


    **Expert Judgement** Expert judgment is key to assessing project communication
    and information to understand its impact and then make decisions accordingly.


    **Meetings** Meetings are typically used in the Control Communications process
    to facilitate discussion among project team members and other relevant subject
    matter experts. Examples of discussions that occur as part of this process include
    the analysis and decision making of issue resolution and dissemination of information.


    # # Outputs of Control Communications


    The Control Communications process results in five outputs:


    +   - Work performance information

    +   - Change requests

    +   - Project management plan updates

    +   - Project documents updates

    +   - Organizational process assets updates


    **Work Performance Information** Work performance information consists of information
    that has been analyzed or summarized as a result of carrying out this process.
    As this information is captured and documented, it can then be distributed to
    the appropriate stakeholders.


    **Change Requests** The following changes may be requested as a result of carrying
    out this process:


    +   - Recommended corrective actions to bring performance in alignment with the
    project management plan'
  merge: -1
  img_proc: true
