    managed through the Perform Integrated Change Control process. Here are some examples
    of factors that might cause change:


    +   - Project constraints

    +   - Stakeholder requests

    +   - Team member recommendations

    +   - Vendor issues


    **Enterprise Environmental Factors** Enterprise environmental factors used to
