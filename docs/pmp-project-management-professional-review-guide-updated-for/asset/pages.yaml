  md: 'quality of the people should be improved first and then the quality of the
    products or service.


    # Seven Basic Quality Tools


    7QC tools, known in the industry as the seven basic quality tools, help to solve
    quality-related problems in the context of the Plan-Do-Check-Act model. The Seven
    Basic Quality tools include the following:


    +   - Cause-and-effect diagrams are also known as fishbone diagrams or Ishikawa
    diagrams. A more complete explanation of this tool occurs in the Identify Risks
    process description later in this chapter. These diagrams help to trace an issue
    to its root cause.


    +   - Flowcharts show the relationships between the process steps. In regard to
    quality planning, flowcharting helps the project team identify quality issues
    before they occur.


    +   - Checksheets help to get facts organized in a manner that will facilitate
    the effective collection of useful data about a potential quality problem. Also
    called tally sheets, they are useful as a checklist when gathering data.


    +   - Pareto diagrams can help reveal the key few sources that are responsible
    for causing most of a problem’s effects. These diagrams are normally in the special
    form of a vertical bar chart.


    +   - Histograms are also a special form of a bar chart that help with pattern
    recognition around the central tendency, dispersion, and shape of a statistical
    distribution. The key difference between histograms and other control charts is
    that a histogram is not influenced by time on the variations within a distribution.


    +   - Control charts help determine if a process is stable and whether process
    variances are in or out of control.


    +   - Scatter diagrams, also called correlation charts, are plot ordered pairs
    (X,Y) used to study the relationship between two variables.


    # Benchmarking


    Benchmarking is a process of comparing previous similar activities to the current
    project activities to provide a standard against which to measure performance.


    # Design of Experiments


    Design of experiments (DOE) is a statistical technique attributed to Genichi Taguchi
    that identifies the elements—or variables—that will have the greatest effect on
    overall project outcomes. DOE provides a statistical framework that allows the
    variables that have the greatest effect on overall project outcomes to be changed
    at once instead of one at a time.


    # Statistical Sampling


    Statistical sampling involves taking a sample number of parts from the whole population
    and inspecting them to determine whether they fall within acceptable variances.


    # Additional Quality Planning Tools


    The *PMBOK*® *Guide* lists additional tools, as described in Table 3.5.'
