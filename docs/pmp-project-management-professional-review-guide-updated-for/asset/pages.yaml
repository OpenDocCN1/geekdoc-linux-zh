  md: '# Acknowlegdments


    I’d like to thank Vanina and Brett for an outstanding job writing this book. They
    were both lifesavers and bore the brunt of the work. I enjoyed seeing how they
    gave the content a fresh face, and their illustrations are terrific. I appreciate
    the diligence and the new ideas that Vanina brings to these projects. Brett’s
    insights were a great contribution to this edition as well. He is a true friend
    and an outstanding leader. As always, it was a great pleasure to work with Vanina
    and Brett.


    I also echo Vanina’s thanks to Kenyon Brown, senior acquisitions editor, for the
    opportunity to update this book.


    I also want to thank Neil Edde, former vice president and publisher at Sybex,
    for taking that leap of faith on a crazy project management study guide idea way
    back when. Thanks, Neil.


    Alexa Murphy, development editor, is the best. She had some great sugestions that
    improved the content and kept us on track with deadlines just like a seasoned
    project manager.


    A very big thanks goes to all of the instructors who use my books in their classrooms.
    I appreciate you choosing Sybex and my books to help your students master PMP®
    concepts. Thank you also to all of the readers who choose this book to help them
    study for the PMP® exam.


    —Kim Heldman


    To start, thank you to the team at Sybex who devoted a great deal of effort toward
    making this review guide come together successfully. It is incredible to see the
    amount of teamwork and effort that goes into the making of a book. The process
    is certainly thorough, and there are many people not named here who were key to
    producing a solid product. Once again, thanks to all of you!


    I’d like to thank Kim Heldman for the opportunity of working together once again
    on this book. Kim’s warm, positive, and dynamic nature always make her a pleasure
    to engage with. I’d also like to give a special, heartfelt thanks to Brett Feddersen.
    Brett worked tirelessly to produce a great product and always had the reader in
    mind. Not only was Brett’s positive attitude and outlook contagious, but he made
    the process fun, collaborative, and memorable.


    Thank you to Kenyon Brown, our senior acquisitions editor, who saw the value of
    updating this book and whose great and supportive personality always comes through
    on the phone and in email. I appreciate you welcoming me back to the Sybex family!
    A tremendous thank-you to Alexa Murphy, development editor. With your guidance
    and feedback, we were able to take this book to the next level, and I am thrilled
    with the result! You ensured that everything stayed on course, and your recommendations
    were valuable and instrumental in creating this finished product. It was absolutely
    wonderful having an opportunity to work with you once again.'
