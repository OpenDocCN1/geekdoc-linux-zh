    \ for closing out the project or project phase\n+   - Historical information and\
    \ lessons learned\n+   - Project closure reports\n\n# Tools and Techniques of\
    \ Close Project or Phase\n\nThe Close Project or Phase process has three tools\
    \ and techniques: expert judgment, analytical techniques, and meetings.\n\n**Expert\
    \ Judgment** Subject matter experts can help assure that the process is performed\
    \ according to the organization's standard and to project management standards.\
    \ Experts typically include other project managers, the project management office,\
    \ and organizations such as PMI® or other technical organizations that publish\
    \ standards and resources.\n\n**Analytical Techniques** Analytical techniques\
    \ may be used to ensure that closure activities are ready to be performed and\
    \ are performed correctly. Regression analysis and trend analysis are two examples\
    \ of techniques provided by the *PMBOK® Guide*.\n\n**Meetings** Meetings are often\
    \ used as a means of bringing experts together. Meetings may occur in a variety\
    \ of formats, such as in-person or virtual.\n\n# Outputs of Close Project or Phase\n\
    \nThe two outputs that result from carrying out the Close Project or Phase process\
    \ are as follows:\n\n**Final Product, Service, or Result Transition** Final product,\
    \ service, or result transition refers to the acceptance of the product and the\
    \ turnover to the customer or into operations. This is where information is distributed\
    \ that formalizes project completion.\n\n**Organizational Process Assets Updates**\
    \ The following organizational process assets are typically updated as a result\
    \ of the Close Project or Phase process:\n\n+   - Project files, such as the project\
    \ planning documents, change records and logs, and issue logs\n+   \n+   - Project\
    \ or phase closure documents, which include documentation showing that the project\
    \ or phase is completed and that the transfer of the product of the project to\
    \ the organization has occurred\n+   \n+   - Project closure reports\n+   \n+\
    \   - Historical information, which is used to document the successes and failures\
    \ of the project"
