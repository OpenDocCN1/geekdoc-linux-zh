- pgno: 217
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_217_0.png)


    # # Inputs of Perform Quantitative Risk Analysis


    Know the following inputs of the Perform Quantitative Risk Analysis process:


    +   Risk management plan


    +   Cost management plan


    +   Schedule management plan


    +   Risk register


    +   Enterprise environmental factors


    +   Organizational process assets


    **Risk Management Plan** The risk management plan guides the project team in carrying
    out the risk processes. The following key elements are used from within the risk
    management plan:


    +   Roles and responsibilities


    +   Risk management activities


    +   Guidelines for setting aside contingency reserves


    +   RBS


    +   Stakeholder tolerances


    **Cost Management Plan** The cost management plan provides the necessary information
    to address cost-related risks so that the project can be kept within budget.


    **Schedule Management Plan** The schedule management plan provides the necessary
    information to address schedule-related risks so that the project can be kept
    on schedule.


    **Risk Register** The risk register contains a list of identified risks as well
    as any other documented information on risks to date.


    **Enterprise Environmental Factors** Enterprise environmental factors contribute
    insight and context to the risk analysis. Two factors to consider are industry
    studies of similar projects that are conducted by risk specialists, and a review
    of risk databases available from the industry or through proprietary sources.


    **Organizational Process Assets** The organizational process assets include historical
    information from previous projects.


    # # Tools and Techniques of Perform Quantitative Risk Analysis


    Three tools and techniques are used in the Perform Quantitative Risk Analysis
    process:


    +   Data-gathering and representation techniques'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   - Quantitative risk analysis and modeling techniques

    +   - Expert judgment


    **Data-Gathering and Representation Techniques** Data-gathering and representative
    techniques are as follows:


    **Interviewing** Project team members, stakeholders, and subject matter experts
    are typical interview subjects. Oftentimes, three-point estimates are gathered
    from the experts to quantify the probability and impact of risks on project objectives.
    The following interview topics are common:


    +   - Experiences on past projects

    +   - Experiences working with the types of technology or processes used during
    this project


    **Probability Distributions** Continuous probability distributions (particularly
    beta and triangular distributions) are commonly used in Perform Quantitative Risk
    Analysis. According to the *PMBOK\* Guide*, the following probability distributions
    are often used:


    +   - Normal and lognormal

    +   - Triangular

    +   - Beta

    +   - Uniform distributions

    +   - Discrete distributions


    Distributions are graphically displayed and represent both the probability and
    time or cost elements.


    **Quantitative Risk Analysis and Modeling Techniques** One or more of the following
    quantitative risk analysis and modeling techniques are used:


    **Sensitivity Analysis** Sensitivity analysis is a quantitative method of analyzing
    the potential impact of risk events on the project and determining which risk
    event (or events) has the greatest potential for impact by examining all the uncertain
    elements at their baseline values. Figure 3.41 shows a sample tornado diagram,
    which is one of the ways that sensitivity analysis data can be displayed.


    **Expected Monetary Value (EMV) Analysis** Expected monetary value (EMV) analysis
    is a statistical technique that calculates the average, anticipated future impact
    of the decision. EMV is calculated by multiplying the probability of the risk
    by its impact and then adding them together:


    +   - Positive results generally indicate an opportunity within the project.

    +   - Negative results generally indicate a threat to the project.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'EMV is used in conjunction with the decision tree analysis technique. Decision
    trees are diagrams that show the sequence of interrelated decisions and the expected
    results of choosing one alternative over the other. Typically, more than one choice
    or option is available in response to a decision. The available choices are depicted
    in tree form, starting at the left with the risk decision branching out to the
    right with possible outcomes. Decision trees are usually used for risk events
    associated with time or cost. Figure 3.42 shows a sample decision tree using EMV
    as one of its inputs.


    ![](img/c077f27110b08d0d6c301ce24ad84100_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Monte Carlo analysis is an example of a simulation technique. It is replicated
    many times, typically using cost or schedule variables. Every time the analysis
    is performed, the values for the variable are changed with the output plotted
    as a probability distribution. This type of information helps the risk management
    team determine the probability of completing the project on time and/or within
    budget.


    **Expert Judgment** Experts can come from inside or outside the organization and
    should have experience that''s applicable to the project. When performing quantitative
    risk analysis, experts can also assist in validating the data and tools used.


    # # Outputs of Perform Quantitative Risk Analysis


    Like the process before it, the Perform Quantitative Risk Analysis process contains
    one output, project documents updates, including the risk register.


    The following risk register updates occur as a result of this process:


    +   Probabilistic analysis of the project

    +   Probability of achieving the cost and time objectives

    +   Prioritized list of quantified risks

    +   Trends in Perform Quantitative Risk Analysis results


    **Probabilistic Analysis of the Project** Probabilistic analysis of the project
    is the forecasted results of the project schedule and costs as determined by the
    outcomes of risk analysis. The following are characteristics of probabilistic
    analysis:


    +   Results include projected completion dates and costs along with a confidence
    level associated with each.

    +   The output is often expressed as a cumulative distribution.

    +   Results are used along with stakeholder risk tolerances to quantify the time
    and cost contingency reserves.


    **Probability of Achieving the Cost and Time Objectives** The probability of achieving
    the cost and time objectives of the project are documented based on the results
    of performing the quantitative risk analysis tools and techniques.


    **Prioritized List of Quantified Risks** The prioritized list of risks includes
    the following items:


    +   Risks with the greatest risk or threat to the project

    +   Risk impacts

    +   Risks that present the greatest opportunities to the project

    +   Risks that are most likely to impact the critical path

    +   Risks with the largest cost contingency


    **Trends in Perform Quantitative Risk Analysis Results** Trends in Perform Quantitative
    Risk Analysis appear as the process is repeated. Trends are documented for further
    analysis and for use in developing risk response plans.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Plan Risk Responses


    Plan Risk Responses is a process of deciding what actions to take to reduce threats
    and take advantage of the opportunities discovered during the risk analysis processes.
    This includes assigning resources the responsibility of carrying out risk response
    plans outlined in this process. By the end of this process, the risk register
    will be updated to include a risk response plan for all risks that require some
    form of action.


    Figure 3.43 shows the inputs, tools and techniques, and outputs of the Plan Risk
    Responses process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_221_0.png)


    > > **NOTE** For more detailed information on the Plan Risk Responses process,
    see Chapter 6 of PMP®: Project Management Professional Exam Study Guide, Eighth
    Edition.


    # Inputs of Plan Risk Responses


    The Plan Risk Responses process contains two inputs that you should be familiar
    with. Be sure you know how they are used during the process.


    **Risk Management Plan** The following are used from within the risk management
    plan in carrying out this process:


    +   * Roles and responsibilities that pertain to risk

    +   * Definitions of risk analysis

    +   * Risk thresholds

    +   * Time and budget requirements allotted for risk activities


    **Risk Register** All of the information included within the risk register to
    date will be used in developing risk responses.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Tools and Techniques of Plan Risk Responses


    Tools and techniques of the Plan Risk Responses process that you should know are
    as follows:


    +   Strategies for negative risks or threats

    +   Strategies for positive risks or opportunities

    +   Contingent response strategies

    +   Expert judgment


    # Strategies for Negative Risks or Threats


    As Figure 3.44 shows, strategies for negative risks or threats include avoid,
    transfer, mitigate, and accept.


    ![](img/c077f27110b08d0d6c301ce24ad84100_222_0.png)


    # Avoid


    To avoid a risk means to evade it altogether, eliminate the cause of the risk
    event, or change the project plan to protect the project objectives from the risk
    event. Here are some examples of avoiding risk:


    +   Improving communications

    +   Refining requirements

    +   Assigning additional resources to project activities

    +   Refining the project scope to avoid risk events


    # Transfer


    The purpose of risk transfer is to transfer a risk and its consequences to a third
    party. This strategy will impact the project budget. Here are some examples of
    transferring risk:


    +   Insurance

    +   Contracting

    +   Warranties

    +   Guarantees

    +   Performance bonds


    # Mitigate


    To mitigate a risk means to reduce the probability of a risk event and its impacts
    to an acceptable level. According to the PMBOK® Guide, the purpose of mitigation
    is to reduce the probability that a risk will occur and reduce the impact of the
    risk to an acceptable level.


    # Accept


    The acceptance strategy is used when the project team isn’t able to eliminate
    all the threats to the project. Acceptance of a risk event is a strategy that
    can be used'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'for risks that pose either threats or opportunities to the project. There are
    two forms of acceptance:


    +   - Passive acceptance occurs when the project team has assessed the risk as
    low enough in probability and/or impact that they choose to do no additional planning
    for that potential event at this time.

    +   - Active acceptance includes developing contingency reserves to deal with
    risks should they occur.


    **Strategies for Positive Risks or Opportunities** Strategies for positive risks
    or opportunities, as shown in Figure 3.45, include exploit, share, enhance, and
    accept.


    # **FIGURE 3.45** Strategies for positive risks


    ![](img/c077f27110b08d0d6c301ce24ad84100_223_0.png)


    **Exploit** Exploiting a risk event is to look for opportunities for positive
    impacts. This is the strategy of choice when positive risks have been identified
    and the project team wants to make certain the risk will occur within the project.
    An example of exploiting a risk would be reducing the amount of time to complete
    the project by bringing on more qualified resources.


    **Share** The share strategy is similar to transferring because risk is assigned
    to a third-party owner who is best able to bring about the opportunity the risk
    event presents. An example of sharing a risk would be a joint venture.


    **Enhance** The enhance strategy involves closely watching the probability or
    impact of the risk event to ensure that the organization realizes the benefits.
    This entails watching for and emphasizing risk triggers and identifying the root
    causes of the risk to help enhance impacts or probability.


    **Accept** This is similar to the accept strategies used for negative risks or
    threats.


    **Contingent Response Strategies** Contingent response strategies, also known
    as contingency planning, involves planning alternatives to deal with the risks
    should they occur. Contingency planning recognizes that risks may occur and that
    plans should be in place to deal with them.


    The following contingency responses are common:


    +   - Contingency reserves, which include project funds that are held in reserve
    to offset any unavoidable threats that might occur to project scope, schedule,
    cost, or quality. Also includes reserving time and resources to account for risks.

    +   - Fallback plans, which are developed for risks with high impact or for risks
    with identified strategies that might not be the most effective at dealing with
    the risk.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '**Expert Judgment** Expert judgment is used in developing risk responses, including
    feedback and guidance from risk management experts and those internal to the project
    qualified to provide assistance in this process.


    # Outputs of Plan Risk Responses


    Here are the two outputs of the Plan Risk Responses process:


    +   - Project management plan updates

    +   - Project documents updates


    **Project Management Plan Updates** The following documents within the project
    management plan may require updates to reflect the changes in process and practice
    that are driven by the risk responses:


    +   - Any and all of the management plans, including the schedule management plan,
    cost management plan, quality management plan, procurement management plan, and
    human resource management plan

    +   - Any and all of the project baselines, including the scope baseline, schedule
    baseline, and cost baseline


    **Project Documents Updates** There are several project document updates, with
    the key update occurring to the risk register. Elements to the risk register can
    include but are not limited to


    +   - List of identified risks, including their descriptions, what WBS element
    they impact (or area of the project), categories (RBs), root causes, and how the
    risks impact the project objectives

    +   - Risk owners and their responsibility

    +   - Outputs from the Perform Qualitative Analysis process

    +   - Agreed-upon response strategies

    +   - Actions needed to implement response plans

    +   - Risk triggers

    +   - Cost and schedule activities needed to implement risk responses

    +   - Contingency plans

    +   - Fallback plans, which are risk response plans that are executed when the
    initial risk response plan proves to be ineffective

    +   - Contingency reserves

    +   - Residual risk, which is a leftover risk that remains after the risk response
    strategy has been implemented

    +   - Secondary risks, which are risks that come about as a result of implementing
    a risk response


    Other project documents, such as technical documentation and the assumptions documented
    in the project scope statement, may require an update after performing this process.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_225_0.png)


    **Don’t forget** that the Project Risk Management Knowledge Area has one more
    process: Control Risks. Look for a discussion of this process in Chapter 5 when
    we discuss the Monitor and Controlling process group.


    # **Exam Essentials**


    **Be able to define the purpose of the risk management plan.** The risk management
    plan describes how you will define, monitor, and control risks throughout the
    project. It details how risk management processes (including Identify Risks, Perform
    Qualitative Risk Analysis, Perform Quantitative Risk Analysis, Plan Risk Responses,
    and Control Risks) will be implemented, monitored, and controlled throughout the
    life of the project. It describes how you will manage risks but does not attempt
    to define responses to individual risks.


    **Be able to define the purpose of the Identify Risks process.** The purpose of
    the Identify Risks process is to identify all risks that might impact the project,
    document them, and identify their characteristics.


    **Be able to define the risk register and some of its primary elements.** The
    risk register is an output of the Identify Risks process, and updates to the risk
    register occur as an output of every risk process that follows this one. By the
    end of the Plan Risk Responses process, the risk register contains these primary
    elements: identified list of risks, risk owners, risk triggers, risk strategies,
    contingency plans, and contingency reserves.


    **Be able to define the purpose of the Perform Qualitative Risk Analysis process.**
    Perform Qualitative Risk Analysis determines the impact the identified risks will
    have on the project and the probability they’ll occur, and it puts the risks in
    priority order according to their effects on the project objectives.


    **Be able to define the purpose of the Perform Quantitative Risk Analysis process.**
    Perform Quantitative Risk Analysis evaluates the impacts of risks prioritized
    during the Perform Qualitative Risk Analysis process and quantifies risk exposure
    for the project by assigning numeric probabilities to each risk and determining
    their impact on project objectives.


    **Be able to define the purpose of the Plan Risk Responses process.** Plan Risk
    Responses is the process where risk response plans are developed using strategies
    such as avoid, transfer, mitigate, accept, exploit, share, enhance, develop contingent
    response strategies, and apply expert judgment. The risk response plan describes
    the actions to take should the identified risks occur. It should include all the
    identified risks, a description of the risks, how they’ll impact the project objectives,
    and the people assigned to manage the risk responses.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# ## Developing a Stakeholder Management Plan


    The primary reason that a project is undertaken is to satisfy the expectations
    of the project stakeholders. Clearly, it is important to ensure efforts are made
    to identify, work with, and communicate with the appropriate stakeholders. Within
    the Planning process group, the Plan Stakeholder Management process is the key
    work effort for the Project Stakeholder Management Knowledge Area.


    Figure 3.46 shows the inputs, tools and techniques, and outputs of the Plan Stakeholder
    Management process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_226_0.png)


    For more detailed information on the Plan Stakeholder Management process, see
    Chapter 5 of PMP™: Project Management Professional Exam Study Guide, Eighth Edition.


    # ### Inputs of Plan Stakeholder Management


    Know the following inputs of the Plan Stakeholder Management process:


    +   - Project management plan

    +   - Stakeholder register

    +   - Enterprise environmental factors

    +   - Organizational process assets'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Project Management Plan


    According to the *PMBOK® Guide*, to develop the stakeholder management plan you
    can use the following information from the project management plan:


    +   * Life cycle and processes that will be applied to each phase of the project

    +   * Explanatio n of how the work will be executed to accomplish project objectives

    +   * Description of the human resources needed, addressing roles and responsibilities,
    reporting relationships, and staffing

    +   * Change management plan illustrating how changes will be controlled

    +   * Need and techniques for communication among stakeholders


    # Stakeholder Register


    Information that is needed to plan engagement with project stakeholders is provided
    from the stakeholder register.


    # Enterprise Environmental Factors


    All enterprise environmental factors can be used within the Plan Stakeholder Management
    process. Special attention should be given to the organizational structure and
    culture as well as external stakeholder requirements. It will be important to
    adapt the management of stakeholders to the project environment.


    # Organizational Process Assets


    The *PMBOK® Guide* notes that all the elements described in the enterprise environmental
    factors can be used in this process. Particular consideration should be given
    to lessons learned and historical information.


    # Tools and Techniques of Plan Stakeholder Management


    The Plan Stakeholder Management process includes the following tools and techniques:


    +   * Expert judgment

    +   * Meetings

    +   * Analytical techniques


    # Expert Judgment


    Using the project objectives as a guide, a project manager should apply expert
    judgment when considering the level of engagement required for each stakeholder.
    It may be necessary to adjust the level of engagement considering the different
    phases of the project. In the creation of the stakeholder management plan, a project
    manager can look to the following groups depending on specialized training or
    subject matter expertise these individuals might possess. They include


    +   * Senior management and other identified key stakeholders

    +   * Project team members

    +   * Other functional units or individuals

    +   * Project managers who have completed similar projects

    +   * Subject matter experts in the business or project areas

    +   * Industry groups and consultants

    +   * Professional and technical associations'
  merge: -1
  img_proc: true
- pgno: 228
  md: '**Meetings** The stakeholder management strategy defines the level of participation
    needed for each stakeholder.


    **Analytical Techniques** The current engagement level of all stakeholders should
    be compared to the planned levels of engagement to ensure project success. This
    is a critical process that needs to be performed throughout the life cycle of
    the project to help ensure satisfied stakeholders. According to the PMBOK® Guide,
    the level of engagement with stakeholders can be classified as follows:


    +   - Unaware, where the stakeholder is unaware of the project and potential impacts

    +   - Resistant, where the stakeholder is aware of the project but is resistant
    to change

    +   - Neutral, where the stakeholder is aware but is neither supportive nor resistant

    +   - Supportive, where the stakeholder is aware of the project and is supportive
    of change

    +   - Leading, where the stakeholder is actively engaged in ensuring the project
    is a success.


    Table 3.9 shows how current engagement can be documented using the Stakeholders
    Engagement Assessment Matrix, where C indicates the current level of engagement
    and D indicates the desired level of engagement.


    TABLE 3.9 Sample Stakeholder Engagement Assessment Matrix


    | STAKEHOLDER | Unaware | Resistant | Neutral | Supportive | Leading |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | Stakeholder 1 | | | | D C | |

    | Stakeholder 2 | C | | D | | |

    | Stakeholder 3 | | C | | D | |


    # ## Outputs of Plan Stakeholder Management


    The following two outputs result from carrying out the Plan Stakeholder Management
    process:


    **Stakeholder Management Plan** This component of the project management plan
    identifies the management strategies necessary to effectively engage stakeholders.
    Adding to the information provided by the stakeholder register, the stakeholder
    management plan often provides


    +   - Desired and current engagement levels of key stakeholders

    +   - Scope and impact of change to stakeholders'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   * Interrelationships and potential overlap of stakeholders

    +   * Stakeholder communication requirements

    +   * Information and the desired format to be distributed to stakeholders

    +   * Explanation for distributing information

    +   * Time frame and frequency of distributing information

    +   * Method for updating and refining this plan as the project advances


    **Project Documents Updates** The following updates may be required as a result
    of performing this process:

    * Project schedule

    * Stakeholder register


    ![](img/c077f27110b08d0d6c301ce24ad84100_229_0.png)


    Remember that the Project Stakeholder Management Knowledge Area has three additional
    processes: Identify Stakeholders, a part of the Chapter 2 discussion of the Initiating
    process group; Manage Stakeholder Engagement, which will be covered in Chapter
    4 as part of the Executing process group; and Control Stakeholder Engagement.
    Look for a discussion of this last process in Chapter 5 when we discuss the Monitor
    and Controlling process group.


    # ### Exam Essentials


    **Be able to describe the purpose of the stakeholder management plan.** The stakeholder
    management plan identifies the management strategies necessary to effective engage
    stakeholders.


    # ## Obtaining Project Management Plan Approval


    With the subsidiary plans and baselines created, it’s time to bring them all together
    into a project management plan. The project management plan consists of a compilation
    of these plans and baselines and is an output of the Develop Project Management
    Plan process. This primary plan is presented to key stakeholders for sign-off
    (if required). Once it’s approved, the team can move forward to execute the plan.


    Develop Project Management Plan is the first process in the Planning process group,
    and it’s part of the Project Integration Management Knowledge Area. This process
    defines,'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'coordinates, and integrates all the various subsidiary project plans and baselines.
    The result is a project management plan document that describes how the project
    outcomes will be executed, monitored, and controlled as the project progresses
    and how the project will be closed out once it concludes.


    Throughout the project, the project management plan will be updated to reflect
    approved project changes. It will be used as an input to many of the project management
    processes, and as a result of approved changes, it will also become an output
    of several processes.


    Figure 3.47 shows the inputs, tools and techniques, and outputs of the Develop
    Project Management Plan process.


    # FIGURE 3.47 Develop Project Management Plan process


    ![](img/c077f27110b08d0d6c301ce24ad84100_230_0.png)


    > For more detailed information on the Develop Project Management Plan process,
    see Chapter 3 of *PMP®: Project Management Professional Exam Study Guide, Eighth
    Edition*.


    # Inputs of Develop Project Management Plan


    Know the following inputs of the Develop Project Management Plan process:


    +   - Project charter

    +   - Outputs from other processes

    +   - Enterprise environmental factors

    +   - Organizational process assets


    **Project Charter** Based on the high-level scope outlined in the project charter,
    the project team can start determining which project management processes will
    be most beneficial for this particular project.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '**Outputs from Other Processes** Outputs from other project management processes
    may be used to develop the project management plan. In particular, the following
    outputs from the planning processes may be helpful inputs to develop the project
    management plan:


    +   - Any processes used that produce a baseline

    +   - Any processes that produce a subsidiary management plan


    **Enterprise Environmental Factors** The following key elements of the environmental
    factors should be considered when choosing the processes to perform for this project:


    +   - Standards and regulations (both industry and governmental)

    +   - Company culture and organizational structure

    +   - Personnel administration

    +   - Project management information system (PMIS)


    The PMIS is an automated or manual system used to document the subsidiary plans
    and the project management plan, facilitate the feedback process, and revise the
    documents.


    **Organizational Process Assets** The following key elements of the organizational
    process assets should be considered within this process:


    +   - Project management plan template

    +   - Change control procedures

    +   - Historical information

    +   - Configuration management knowledge database that contains the official company
    policies, standards, procedures, and other project documents


    # # Tools and Techniques of Develop Project Management Plan


    Expert judgment and facilitation techniques are the only tools and techniques
    of the Develop Project Management Plan process.


    The following types of expert judgment are needed to complete this process:


    +   - Tailoring techniques

    +   - Understanding technical and management details that need to be included
    in the project management plan

    +   - Determining resources and assessing skill levels needed for project work

    +   - Determining and defining the amount of configuration management to apply
    on the project


    # # Output of Develop Project Management Plan


    The output of the Develop Project Management Plan process is the project management
    plan.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_232_0.png)


    The purpose of most processes is to produce an output. Outputs are usually a report
    or document of some type, a deliverable, or an update to a set of documents.


    The project management plan includes the following elements:


    +   - Processes used to perform each phase of the project

    +   - Life cycle used for the project and for each phase of the project when applicable

    +   - Tailoring of results the project team defines

    +   - Methods for executing the work of the project to fulfill the objectives

    +   - Change management plan describing methods for monitoring and controlling
    change

    +   - Configuration management

    +   - Methods for determining and maintaining the validity of performance baselines

    +   - Communication needs of the stakeholders and techniques to fulfill those
    needs

    +   - Management reviews of content, issues, and pending decisions


    The project management plan also contains multiple subsidiary plans and baselines,
    as described in Table 3.10. Figure 3.48 depicts a high-level view of the contents
    that make up the plan.


    # FIGURE 3.48 High-level view of project management plan contents


    ![](img/c077f27110b08d0d6c301ce24ad84100_232_1.png)


    # TABLE 3.10 Project management plan summary


    | Subsidiary plan or document | Description |

    | :--- | :--- |

    | Requirements management plan | This plan documents how the project requirements
    will be managed throughout the life of the project. It also addresses how the
    requirements will be analyzed and documented. |


    *continues*'
