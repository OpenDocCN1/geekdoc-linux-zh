    of the project or project phase. The result is the transition to the customer
    of the final product, service, or result that the project created.


    Before a project can be fully closed, all of the project documents must be archived
    within the organizational process assets. As you may recall, this includes all
    of the project files, any closing documents, and historical information. The historical
    information is archived within the lessons learned knowledge base, which will
    be a valuable asset to future projects.


    # ## Project Procurement Management Knowledge Area Review


    All procurement contracts must be completed and closed out before the project
    itself can close. This means that any loose ends or work on the vendor’s end must
    be finalized as part of closing activities. This occurs through the Close Procurements
    process, which is the only'
