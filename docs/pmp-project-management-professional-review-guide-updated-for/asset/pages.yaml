- pgno: 85
  md: '# Performing a Project Assessment


    Before an organization decides to embark on a project, several considerations
    must take place, such as an assessment of the various potential projects. As part
    of performing a project assessment, management will need to evaluate existing
    needs and demands, perform feasibility studies, and use project selection methods
    to help in making good decisions.


    Project assessment should entail a careful evaluation of information carried out
    through meetings with the sponsor, customer, and other subject matter experts.
    This group of key individuals will then determine whether the new products or
    services are feasible under the existing assumptions and constraints.


    # Initiating a Project


    Project initiation is the formal recognition that a new project, or the next phase
    in an existing project, should begin and that resources may be committed to the
    project. A project may come about as a result of a need, demand, opportunity,
    or problem. Once those needs and demands are identified, the next logical step
    may include performing a feasibility study to determine the viability of the project.


    ![](img/c077f27110b08d0d6c301ce24ad84100_85_0.png)


    > *For more detailed information on initiating a project, including a closer look
    at the project selection methods and a case study, see Chapter 2 of PMP®: Project
    Management Professional Exam Study Guide, Eighth Edition.*


    # Identifying Needs and Demands


    Needs and demands represent opportunities, business requirements, or problems
    that need to be solved. Management must decide how to respond to these needs and
    demands, which will, more often than not, initiate new projects. According to
    the *PMBOK® Guide*, projects come about as a result of one of the following seven
    needs or demands:


    Market Demand The demands of the marketplace can drive the need for a project.
    Some companies must initiate projects in order to take advantage of temporary
    and long-term market changes.


    Strategic Opportunity/Business Need An organization may respond to an internal
    need that could eventually affect the bottom line. For example, this may include
    addressing company growth or even the need to downsize.


    Customer Request A new project may emerge as a result of internal or external
    customer requests.


    Technological Advance New technology often requires companies to revamp their
    products as a way of taking advantage of the latest technology.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '**Legal Requirement** Both private industry and government agencies generate
    new projects as a result of laws passed during every legislative season.


    **Environmental Consideration** Many organizations today are undergoing a greening
    effort to reduce energy consumption, save fuel, reduce their carbon footprint,
    and so on.


    **Social Need** Projects arise out of social needs, such as a developing country
    that offers medical supplies and vaccination in response to a fast-spreading disease.


    # # Conducting a Feasibility Study


    Some organizations require that a feasibility study take place prior to making
    a final decision about starting a project. Feasibility studies may be conducted
    as separate projects, as subprojects, or as the first phase of a project.


    When evaluating the feasibility of new products or services, it''s generally a
    good idea to meet with the sponsor, customer, and other subject matter experts.
    Here are some of the reasons that a feasibility study may be undertaken:


    +   - To determine whether the project is viable

    +   - To determine the probability of success

    +   - To examine the viability of the product, service, or result of the project

    +   - To evaluate technical issues related to the project

    +   - To determine whether the technology proposed is feasible, reliable, and
    easily assimilated into the existing technology structure


    # # Selecting a Project


    As shown in Figure 2.11, an organization may choose to use a variety of selection
    methods. Selection methods help organizations decide among alternative projects
    and determine the tangible benefits to the company of choosing or not choosing
    a project. Project selection methods are also used to evaluate and choose between
    alternative ways to implement the project.


    # FIGURE 2.11 Project selection methods


    Project Selection Methods


    | Mathematical Models | Benefit Measurement Methods |

    | :--- | :--- |

    | • Linear | • Cost-benefit analysis |

    | • Dynamic | • Scoring models |

    | • Integer | • Cash flow analysis |

    | • Nonlinear | techniques |

    | • Multi-objective programming | |'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_87_0.png)


    Although project selection is considered to be out of the scope of a project manager''s
    role, the project selection methods we''ll talk about next are ones you should
    be familiar with for the exam.


    Depending on the organization, a steering committee may be responsible for project
    review, selection, and prioritization. A steering committee is a group comprising
    senior managers and, sometimes, mid-level managers who represent each of the functional
    areas in the organization.


    There are generally two categories of selection methods:


    +   - Mathematical models (also known as constrained optimization methods)

    +   - Benefit measurement methods (also known as decision models)


    # Mathematical Models


    For the exam, simply know that mathematical models, also known as constrained
    optimization methods, use the following in the form of algorithms:


    +   - Linear

    +   - Dynamic

    +   - Integer

    +   - Nonlinear

    +   - Multi-objective programming


    # Benefit Measurement Methods


    Benefit measurement methods, also known as decision models, employ various forms
    of analysis and comparative approaches to make project decisions. These methods
    include comparative approaches such as these:


    +   - Cost-benefit analysis

    +   - Scoring models

    +   - Cash flow analysis techniques


    ![](img/c077f27110b08d0d6c301ce24ad84100_87_1.png)


    When applying project selection methods, you can use a benefit measurement method
    alone or in combination with others to come up with a selection decision.


    Let''s take a closer look at the benefit measurement methods.


    # Cost-Benefit Analysis


    Cost-benefit analysis, also known as cost analysis or benefit analysis, compares
    the cost to produce the product, service, or result of the project with the benefit
    that the organization will receive as a result of executing the project.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# ### Scoring Models


    For weighted scoring models, the project selection committee decides on the criteria
    that will be used on the scoring model. Each of these criteria is then assigned
    a weight depending on its importance to the project committee. More important
    criteria should carry a higher weight than less important criteria. Each project
    is then rated on a numerical scale, with the higher number being the more desirable
    outcome to the company and the lower number having the opposite effect. This rating
    is then multiplied by the weight of the criteria factor and added to other weighted
    criteria scores for a total weighted score. The project with the highest overall
    weighted score is the best choice.


    For example, if Project A contains a weighted score of 31, Project B contains
    a weighted score of 42, and Project C contains a weighted score of 40, which project
    would you choose? The correct answer is Project B, since it has the highest weighted
    score.


    # ### Cash Flow Analysis Techniques


    The final benefit measurement methods involve a variety of cash flow analysis
    techniques:


    +   *   Payback period

    +   *   Discounted cash flows

