    **Contingency Theory** The Contingency theory builds on a combination of Theory
    Y behaviors and the Hygiene theory. (The Hygiene theory is discussed shortly,
    in the section “Motivational Theories.”) The Contingency theory says that people
    are motivated to achieve levels of competency and will continue to be motivated
    by this need even after competency is reached.


    **Situational Theory** Paul Hersey and Ken Blanchard developed the Situational
    Leadership theory during the mid-1970s. This theory’s main premise is that the
    leadership style you use depends on the situation. Both Hersey and Blanchard went
    on to develop their own situational leadership models. Blanchard’s model, Situational
    Leadership II, describes four styles of leadership that depend on the situation:
    directing, coaching, supporting, and delegating.


    # Leadership Styles


    A project manager can use various leadership styles, and in many cases, the appropriate
    leadership style is based on the situation. The following are examples of leadership
    styles:


    +   *   **Autocratic**  All decisions are made by the leader.

    +   *   **Laissez-fair** The leader uses a hands-off approach and allows the team
    to drive the decisions.

    +   *   **Democratic**  Leaders gather all facts and receive input from the team
    before reaching a decision.

    +   *   **Situational** Based on the Blanchard theory of situational leadership
    that uses four styles: directing, coaching, supporting, and delegating.

    +   *   **Transactional and Transformational** Developed by Bernard Bass. He described
    transactional leaders as activity-focused and autonomous; they use contingent
    reward systems and'
