- pgno: 347
  md: '# Tools and Techniques of Control Stakeholder Engagement


    The Control Stakeholder Engagement process has three tools and techniques that
    you will need to be familiar with:


    +   *   **Information Management Systems** Information management systems can
    be used to capture, store, and disseminate information to stakeholders as needed.
    Using these systems, the project manager can actively monitor the level of stakeholder
    engagement as part of this process.

    +   *   **Expert Judgment** As the project progresses forward, changes to the
    list of stakeholders may occur. Expert judgment may be needed to reassess stakeholders.
    Expertise sought may include individuals such as senior management, other project
    managers, or those with specialized knowledge in specific areas.

    +   *   **Meetings** Meetings are often used to bring experts together to analyze
    information obtained when carrying out a process and making decisions based on
    this information.


    # Day of the Exam


    > Notice that nearly all processes that fall within the Monitoring and Controlling
    process group have work performance data as an input and work performance information
    as an output. The only exception to this rule are the two Monitoring and Controlling
    processes that fall within the Project Integration Management Knowledge Area.


    Identifying trends across the project management processes, such as this one,
    will help you better understand and break down questions on the day of the exam.


    # Outputs of Control Stakeholder Engagement


    Know the five outputs of the Control Stakeholder Engagement process:


    +   *   **Work Performance Information** As with other processes that fall in
    the Monitoring and Controlling process group, performance data that has been captured
    and analyzed is documented as an output. This information is critical in making
    decisions at the project level.

    +   *   **Change Requests** As the process is carried out, corrective actions
    or preventive actions may be needed. These are submitted in the form of change
    requests, which are then funneled into the change control process.

    +   *   **Project Management Plan Updates** Various subsidiary plans, such as
    the stakeholder management plan and change management plan, may need to be updated
    as a result of carrying out this process.'
