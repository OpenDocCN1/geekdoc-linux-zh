- pgno: 362
  md: '# # Chapter 6

    ## Closing the Project


    **THE PMP® EXAM CONTENT FROM THE CLOSING THE PROJECT PERFORMANCE DOMAIN COVERED
    IN THIS CHAPTER INCLUDES THE FOLLOWING:**


    +   - Obtain final acceptance of the project deliverables from relevant stakeholders
    in order to confirm that project scope and deliverables were achieved.

    +   - Transfer the ownership of deliverables to the assigned stakeholders in accordance
    with the project plan in order to facilitate project closure.

    +   - Obtain financial, legal, and administrative closure using generally accepted
    practices and policies in order to communicate formal project closure and ensure
    transfer of liability.

    +   - Prepare and share the final project report according to the communications
    management plan in order to document and convey project performance and assist
    in project evaluation.

    +   - Collate lessons learned that were documented throughout the project and
    conduct a comprehensive project review in order to update the organization’s knowledge
    base.

    +   - Archive project documents and materials using generally accepted practices
    in order to comply with statutory requirements and for potential use in future
    projects and internal/external audits.

    +   - Obtain feedback from relevant stakeholders using appropriate tools and techniques
    and based on the stakeholder management plan in order to evaluate their satisfaction.


    ![](img/c077f27110b08d0d6c301ce24ad84100_362_0.png)'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_363_0.png)


    Closing is the final process group of the five project management process groups
    and accounts for 7 percent of the questions on the PMP${ }^{\circledR}$ exam.
    The primary purpose of Closing is to formally complete the project, phase, or
    contractual obligations. Finalizing all of the activities across the project management
    process groups accomplishes this.


    By the end of the processes that make up the Closing process group, the completion
    of the defined processes across all of the process groups will have been verified.
    Don’t forget that the closeout preparations begin early in the project with the
    clear and well-defined success criteria of the project.


    ![](img/c077f27110b08d0d6c301ce24ad84100_363_1.png)


    The process names, inputs, tools and techniques, outputs, and descriptions of
    the project management process groups and related materials and figures in this
    chapter are based on content from A Guide to the Project Management Body of Knowledge
    (PMBOK Guide), Fifth Edition (PMI, 2013).


    # Obtaining Final Acceptance


    All projects must be formally closed out regardless of the reasons for closure
    (such as successful completion or early termination). According to the PMBOK Guide,
    the following typically occurs during formal closing of the project or project
    phase:


    +   - Obtaining formal acceptance by the customer or sponsor

    +   - Closing out procurement contracts

    +   - Conducting phase-end or post-project reviews

    +   - Updating the organizational process assets, which includes documenting lessons
    learned and archiving project documents in the project management information
    system (PMIS)

    +   - Recording the impacts of tailoring to any process

    +   - Performing assessments of the project team members


    These activities are carried out through the Close Project or Phase process and
    the Close Procurements process.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Close Project or Phase


    The Close Project or Phase process is concerned with gathering project records
    and disseminating information to formalize the acceptance of the product, service,
    or result. The process belongs to the Project Integration Management Knowledge
    Area. Here are additional notes about the process you should know:


    +   • It involves analyzing the project management processes to determine their
    effectiveness.

    +   • It documents lessons learned concerning the project processes.

    +   • It archives all project documents for historical reference. You can probably
    guess that Close Project or Phase belongs to the Project Integration Management
    Knowledge Area since this process touches so many areas of the project.


    According to the *PMBOK®* *Guide*, every project requires closure, and the completion
    of each project phase requires project closure as well. The Close Project or Phase
    process is performed at the close of each project phase and at the close of the
    project.


    Figure 6.1 shows the inputs, tools and techniques, and outputs of the Close Project
    or Phase process.


    # FIGURE 6.1 Close Project or Phase process


    ![](img/c077f27110b08d0d6c301ce24ad84100_364_0.png)


    > **NOTE** For more detailed information on the Close Project or Phase process,
    see Chapter 12, “Closing the Project and Applying Professional Responsibility,”
    in *PMP®*: *Project Management Professional Exam Study Guide, Eighth Edition*
    (Sybex, 2016).


    # Inputs of Close Project or Phase


    For the exam, know the three inputs of the Close Project or Phase process:


    **Project Management Plan**  To consider the project closed, the project management
    plan will be reviewed by the project manager to ensure completion of the deliverables.'
  merge: -1
  img_proc: true
- pgno: 365
  md: "**Accepted Deliverables** Accepted deliverables are an output of the Validate\
    \ Scope process. This input is necessary to determine whether all deliverables\
    \ have been successfully completed.\n\n**Organizational Process Assets** The following\
