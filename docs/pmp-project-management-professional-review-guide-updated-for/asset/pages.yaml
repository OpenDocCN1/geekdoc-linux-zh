- pgno: 264
  md: '# ## Tools and Techniques


    You should know the following tools and techniques of the Develop Project Team
    process:


    +   * Interpersonal skills

    +   * Training

    +   * Team-building activities

    +   * Ground rules

    +   * Colocation

    +   * Recognition and rewards

    +   * Personnel assessment tools


    **Interpersonal Skills** Interpersonal skills, often referred to as soft skills,
    include items such as these:


    +   * Leadership

    +   * Influence

    +   * Negotiation

    +   * Communications

    +   * Empathy

    +   * Creativity


    By possessing these skills, the project management team can reduce issues within
    the project team and better manage the team overall.


    **Training** Training is a matter of assessing the team members'' skills and abilities,
    assessing the project needs, and providing the training necessary for the team
    members to carry out their assigned activities. Training can sometimes be a reward
    as well. Training needs may be incorporated into the staffing management plan
    or scheduled as training needs should be assessed.


    **Team-Building Activities** Part of the project manager''s job is to bring the
    team together; get its members headed in the right direction; and provide motivation,
    reward, and recognition. This is done using a variety of team-building techniques
    and exercises. Team building involves getting a diverse group of people to work
    together in the most efficient and effective manner possible.


    Important to team-building activities are the theories behind team development.
    Authors Bruce Tuckman and Mary Ann Jensen developed a model that describes how
    teams develop and mature. According to Tuckman and Jensen, all newly formed teams
    go through the following five stages of development:


    **Forming** Forming occurs at the beginning stage of team formation, when team
    members are brought together, introduced, and told the objectives of the project.
    Team members tend to behave in a formal and reserved manner.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '**Storming** Storming is the stage when action begins. Team members tend to
    be confrontational with one another as they’re vying for position and control.


    **Norming** Norming is the stage when team members are comfortable with one another
    and begin to confront project concerns and issues.


    **Performing** Performing is the stage when the team becomes productive and effective.
    Trust among team members is high, and this is considered to be the mature development
    stage.


    **Adjourning** The adjourning stage is when the team is released after the work
    is completed.


    Figure 4.6 shows the stages of a team’s development.


    # **FIGURE 4.6** Stages of team development


    ![](img/c077f27110b08d0d6c301ce24ad84100_265_0.png)


    **Ground Rules** Ground rules are expectations set by the project manager and
    project team that describe acceptable team behavior. Outlining ground rules helps
    the team understand expectations regarding acceptable behavior and increases productivity.


    **Colocation** Colocation refers to basing team members out of the same physical
    location. Colocation enables teams to function more effectively than if they’re
    spread out among different localities. One way to achieve colocation might be
    to set aside a common meeting room, sometimes called a war room, for team members
    who are located in different buildings or across town to meet and exchange information.


    **Recognition and Rewards** Recognition and rewards are an important part of team
    motivation. They are formal ways of recognizing and promoting desirable behavior
    and are most effective when carried out by the management team and the project
    manager. Criteria for rewards should be developed and documented, and rewards
    should be given to team members who go above and beyond the call of duty.


    Motivation can be extrinsic or intrinsic:


    +   •   Extrinsic motivators are material rewards and might include bonuses, the
    use of a company car, stock options, gift certificates, training opportunities,
    extra time off, and so on. Any reward should satisfy the need that is valued by
    an individual, and sometimes can be in the form of a handshake or other form of
    recognition.


    +   •   Intrinsic motivators are specific to the individual. Cultural and religious
    influences are forms of intrinsic motivators as well. When a person is driven
    by their own desire to do well, they are intrinsically motivated.


    The recognition and rewards tool of this process is an example of an extrinsic
    motivator.'
  merge: -1
  img_proc: true
