- pgno: 350
  md: '# # Project Scope Management Knowledge

    ## Area Review


    As you may recall, scope documents are necessary to keep the project focused by
    providing it with boundaries and defining exactly what it set out to accomplish
    (no more, no less). The two processes in the Project Scope Management Knowledge
    Area fall in the Monitoring and Controlling process group and ensure that the
    project is in line with the defined requirements.


    Figure 5.22 shows how verified deliverables are formally accepted during this
    phase and how the project and product scope are monitored and managed. Changes
    made to the project scope are carefully watched. If something does not align with
    the project’s defined requirements, then recommended changes are made. Performance
    measurements are also recorded and are used in project quality processes and project
    communications.


    ![](img/c077f27110b08d0d6c301ce24ad84100_350_0.png)


    ![](img/c077f27110b08d0d6c301ce24ad84100_350_1.png)


    # # Project Time Management Knowledge

    ## Area Review


    Only one process from the Project Time Management Knowledge Area occurs in the
    Monitoring and Controlling process group. This process is responsible for monitoring
    and controlling changes to the project schedule. Here, we are also concerned with
    monitoring the status of the project so that progress updates can be made. Performance
    measurements emerge from this step. The performance measurements will be important
    to monitoring and controlling quality and communications.


    As Figure 5.23 shows, changes are recommended based on the progress and status
    of the project schedule.'
  merge: -1
  img_proc: true
