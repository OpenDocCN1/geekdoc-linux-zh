- pgno: 202
  md: 'processes that fall within its respective Knowledge Area. Without the risk
    management plan, a project management team cannot effectively identify and manage
    risks because this plan ensures that everyone is on the same page when it comes
    to assessing, prioritizing, responding to, and managing risks.


    Aside from the Plan Risk Management process, the following risk-related processes
    fall within the Planning process group: Identify Risks, Perform Qualitative Risk
    Analysis, Perform Quantitative Risk Analysis, and Plan Risk Responses. Remember
    that there is one other process, Control Risks, which is a part of the Monitoring
    and Controlling process group that we will cover in Chapter 5.


    # # Plan Risk Management


    The Plan Risk Management process determines how the project team will conduct
    risk management activities. The risk management plan, which will be developed
    during this process, guides the project team in carrying out the risk management
    processes and also assures that the appropriate amount of resources and time is
    dedicated to risk management. By the end of this process, the project team will
    have developed a common understanding for evaluating risks throughout the remainder
    of the project.


    Figure 3.33 shows the inputs, tools and techniques, and outputs of the Plan Risk
    Management process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_202_0.png)


    > **NOTE** For more detailed information on the Plan Risk Management process,
    see Chapter 6, “Risk Planning,” of PMBOK: Project Management Professional Exam
    Study Guide, Eighth Edition.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Inputs of Plan Risk Management


    You should know the following inputs of the Plan Risk Management process:


    +   - Project management plan

    +   - Project charter

    +   - Stakeholder register

    +   - Enterprise environmental factors

    +   - Organizational process assets


    **Project Management Plan** For the purposes of risk management planning, it is
    necessary to consider all other approved subsidiary management plans and baselines.
    The project management plan sets the baseline for all risk-affected areas, especially
    scope, schedule, and cost.


    **Project Charter** From the project charter, various inputs can be gleaned, including
    risks, project descriptions, and requirements, all at a high level.


    **Stakeholder Register** Using the stakeholder register will provide the details
    related to the project stakeholder, including an overview of their roles.


    **Enterprise Environmental Factors** One of the key elements of the enterprise
    environmental factors to consider in this process is the risk tolerance levels
    of the organization and the stakeholders. This is important for evaluating and
    ranking risk.


    **Organizational Process Assets** Organizational process assets include policies
    and guidelines that might already exist in the organization. The following should
    be considered when developing the risk management plan:


    +   - Risk categories

    +   - Risk statement formats

    +   - Risk management templates tailored to the needs of the project

    +   - Defined roles and responsibilities

    +   - Authority levels of the stakeholders and project manager


    # Tools and Techniques of Plan Risk Management


    The Plan Risk Management process has three tools and techniques: analytical techniques,
    expert judgment, and meetings.


    **Analytical Techniques** To create and communicate the overall risk management
    context of the project, analytical techniques are used. The risk management context
    combines the strategic risk exposure of a given project with the stakeholders''
    attitude on risk. These assessments will inform the project team on the appropriate
    resource allocation and allow the team to focus on risk management activities.


    **Expert Judgment** In the creation of a comprehensive risk management plan, the
    judgment and expertise should be considered from those with specialized training
    or knowledge in the subject area including but not limited to


    +   - Senior management

    +   - Other project managers who have performed similar work efforts'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   * Subject matter experts in the field

    +   * Project stakeholders

    +   * Industry groups and consultants

    +   * Technical and professional associations


    **Meetings** The purpose of the meetings is to contribute to the risk management
    plan. During these meetings, the fundamental plan for performing risk management
    activities will be discussed and determined and then documented in the risk management
    plan.


    # # Outputs of Plan Risk Management


    The output of the Plan Risk Management process is the risk management plan.


    The risk management plan describes how you will define, monitor, and control risks
    throughout the project. It details how risk management processes will be implemented,
    managed, monitored, and controlled.


    According to the *PMBOK® Guide*, the risk management plan should include the following
    elements:


    **Methodology** Methodology is a description of how you''ll perform risk management,
    including elements such as methods, tools, and where you might find risk data
    that you can use in the later processes.


    **Roles and Responsibilites** The risk management plan should include descriptions
    of the people who are responsible for managing the identified risks and their
    responses and the people responsible for each type of activity identified in the
    plan.


    **Budgeting** The budget for risk management activities is included in the plan
    as well. In this section, you''ll assign resources and estimate the costs of risk
    management activities and its methods. These costs are then included in the cost
    performance baseline.


    **Timing** Timing refers to how often and at what point in the project life cycle
    risk management processes will occur. You may also include protocols to establish
    contingency schedule reserves.


    **Revised Stakeholder Tolerances** As the project proceeds through the risk manage-ment
    processes, risk tolerances will change. These are documented in the risk man-agement
    plan. Risk management should be carried out according to stakeholder risk tolerances.


    **Reporting Formats** In the reporting formats section, you''ll describe the content
    and for-mat of the risk register. You should also detail how risk management information
    will be maintained, updated, analyzed, and reported to project participants.


    **Tracking** This includes a description of how you''ll document the history of
    the risk activities for the current project and how the risk processes will be
    audited.


    **Risk Categories** Risk categories are a way of systematically identifying risks
    and provid-ing a foundation for understanding. Risk categories should be identified
    during this process and documented in the risk management plan.'
  merge: -1
  img_proc: true
