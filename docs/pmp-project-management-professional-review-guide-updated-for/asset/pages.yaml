    Life-cycle costing and value engineering are used to improve deliverables. The
    following is a brief overview of these two techniques:


    Life-Cycle Costing Life-cycle costing is an economic evaluation technique that
    determines the total cost of not only the project (temporary costs) but also owning,
    maintaining, and operating something from an operational standpoint after the
    project is completed and turned over.


    Value Engineering Value engineering is a technique that looks for alternative
    product ideas to make certain the team is applying the lowest cost for the same
    or better-quality results. So, for example, if the original engineer suggests
    a custom part for a step of the production process, a value engineering review
    might suggest an alternative that can use a readily available, lower-cost standard
    part that will produce the same output for a better value.


