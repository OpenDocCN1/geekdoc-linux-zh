- pgno: 89
  md: '# **PAYBACK PERIOD**


    The *payback period* is the length of time it takes the company to recoup the
    initial costs of producing the product, service, or result of the project. This
    method compares the initial investment to the cash inflows expected over the life
    of the product, service, or result.


    # **Payback Period Example**


    The initial investment on a project is $200,000, with expected cash inflows of
    $25,000 per quarter every quarter for the first two years and $50,000 per quarter
    from then on. The payback period is two years and can be calculated as follows:


    +   - Initial investment = $200,000

    +   - Cash inflows = $25,000

    +   - Time frame = 4 quarters

    +   - Total cash inflows per year = $100,000 (4 quarters x cash inflows of $25,000)

    +   - Initial investment ($200,000) – year 1 inflows ($100,000) = $100,000 remaining
    balance

    +   - Year 1 inflows remaining balance – year 2 inflows = $0

    +   - Total cash flow year 1 and year 2 = $200,000


    The payback is reached in two years.


    The fact that inflows are $50,000 per quarter starting in year 3 makes no difference
    because payback is reached in two years.


    The payback period is the least precise of all the cash flow calculations because
    it does not consider the time value of money.


    # **DISCOUNTED CASH FLOWS**


    Money received in the future is worth less than money received today. Therefore,
    you can calculate what the value of funds will be in the future by using the following
    formula:


    ```

    $$\textit{FV} = \textit{PV}\ (1+i)^n$$

    ```


    This formula says that the future value (FV) of the investment equals the present
    value (PV) times (1 plus the interest rate) raised to the value of the number
    of time periods ($n$) the interest is paid.'
  merge: -1
  img_proc: true
