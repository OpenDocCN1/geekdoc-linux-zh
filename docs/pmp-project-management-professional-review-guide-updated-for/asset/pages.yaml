    # ## Exam Essentials


    **Be able to define the purpose of the Plan Procurement Management process.**
    The purpose of the Plan Procurement Management process is to identify which project
    needs should be obtained from outside the organization. Make-or-buy analysis is
    used as a tool and technique to help determine this.'
