    +   ■ Monitoring project risks

    +   ■ Documenting all appropriate product information throughout the life of the
    project

    +   ■ Gathering, recording, and documenting project information

    +   ■ Monitoring approved change requests


    Figure 5.1 shows the inputs, tools and techniques, and outputs of the Monitor
