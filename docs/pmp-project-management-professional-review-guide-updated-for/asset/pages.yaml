    # Understand the Cost Management Plan


    The cost management plan plays an important role within all of the Project Cost
    Management Knowledge Area processes. The cost management plan is created during
    the Plan Cost Management process and is a subsidiary plan of the project management
    plan (as all subplans are). Using the preceding components, the cost management
    plan will guide the project management team in carrying out the three cost-related
    processes.


    # Plan Cost Management


    The cost management plan contains the following information:


    +   - Level of accuracy

    +   - Units of measure'
