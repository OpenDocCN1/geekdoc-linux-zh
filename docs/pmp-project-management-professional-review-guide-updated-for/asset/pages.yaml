- pgno: 24
  md: '# How to Use This Book


    We’ve included several learning tools in the book. These tools will help you retain
    vital exam content as well as prepare to sit for the actual exams.


    **Exam Essentials** Each chapter includes a number of exam essentials. These are
    the key topics that you should take from the chapter in terms of areas on which
    you should focus when preparing for the exam.


    **Chapter Review Questions** To test your knowledge as you progress through the
    book, there are review questions at the end of each chapter. As you finish each
    chapter, answer the review questions and then check your answers—the correct answers
    appear in the appendix, “Answers to Review Questions.” You can go back to reread
    the section that deals with each question you got wrong to ensure that you answer
    correctly the next time you’re tested on the material.


    # Interactive Online Learning Environment and Test Bank


    The interactive online learning environment that accompanies PMP® Project Management
    Professional Exam Review Guide, Third Edition, provides a test bank with study
    tools to help you prepare for the certification exam—and increase your chances
    of passing it the first time! The test bank includes the following:


    +   - **Sample Tests** All the questions in this book are provided, including
    the Chapter Tests that include the review questions at the end of each chapter.
    In addition, there are two Practice Exams. Use these questions to test your knowledge
    of the study guide material. The online test bank runs on multiple devices.


    +   - **Flashcards** One set of questions is provided in digital flashcard format
    (a question fol- lowed by a single correct answer). You can use the flashcards
    to reinforce your learning and provide last-minute test prep before the exam.


    +   - **Other Study Tools** A glossary of key terms from this book and their definitions
    are avail- able as a fully searchable PDF.


    > **NOTE** Go to http://sybtestbanks.wiley .com to register and gain access to
    this interactive online learning environment and test bank with study tools.


    # Day of the Exam


    After gaining the necessary prerequisites to sit for the exam, the PMP® exam itself
    serves as the final measure to earn your certification. You are already well ahead
    of the game in preparing for the exam when you purchase this book. The preparation
    you put forth will help you show up on the day of the exam in a calm and confident
    state. Throughout the course of this book, you will find sections that offer tips
    of what to do on the day of'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'the exam. While you are not allowed to take anything into the exam, you are
    given scratch paper to work with during your exam. Using the tips in this book,
    before you begin the exam, you can jot down notes that will free your mind to
    focus fully on the questions. In the days leading up to the exam, we recommend
    that you practice creating your reference sheet by memorizing the mnemonics, formulas,
    and other information that you will need. Clearly, standard test taking advice
    is relevant here, such as getting a good night''s sleep, eating a good breakfast,
    and going through relaxation exercises before you are called into the exam room.
    In addition, through the exam:


    +   Take the time to read through each question slowly and completely. Fully understanding
    what is being asked in the question can contribute greatly to getting the right
    answer.


    +   You will be given the ability to mark a question if you are unsure of the
    answer or are unable to come up with the answer. Take advantage of this feature,
    so you can move on to the next question. At the end of the exam, you can come
    back and review your answers and take more time to answer questions that escaped
    your answer earlier in the process.


    +   You have four hours to complete an examination of 200 questions. Tell yourself
    that it is more important to pass than it is to go home early. If it will help,
    write that statement at the top of your reference scratch paper so you can remind
    yourself of this ideal. In a 4-hour examination, it is possible to get fatigued
    and just want to be done with it. Make sure you keep your focus and energy on
    success.


    For more information from PMI[sup:10] on preparing for the exam, be sure you check
    out pmi.org and search for "PMP Exam Guidance" for more valuable resources.


    # # PMP® Exam Objectives


    The PMP[sup:®] exam tests your knowledge of the competencies highlighted in the
    exam objectives. The following are the official PMP[sup:®] exam objectives, as
    specified by PMI[sup:®].


    # ## Initiating the Project


    The following objectives make up the Initiating the Project performance domain
    and are covered in Chapter 2 of this book:


    +   Perform project assessment based upon available information, lessons learned
    from previous projects, and meetings with relevant stakeholders in order to support
    the evaluation of the feasibility of new products or services within the given
    assumptions and/or constraints.


    +   Identify key deliverables based on the business requirements in order to manage
    customer expectations and direct the achievement of project goals.


    +   Perform stakeholder analysis using appropriate tools and techniques in order
    to align expectations and gain support for the project.


    +   Identify high-level risks, assumptions, and constraints based on the current
    environment, organizational factors, historical data, and/or expert judgment,
    in order to propose an implementation strategy.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   * Participate in the development of the project charter by compiling and
    analyzing gathered information in order to ensure project stakeholders are in
    agreement on its elements.

    +   * Obtain project charter approval from the sponsor in order to formalize the
    authority assigned to the project manager and gain commitment and acceptance for
    the project.

    +   * Conduct benefit analysis with relevant stakeholders to validate project
    alignment with organizational strategy and expected business value.

    +   * Inform stakeholders of the approved project charter to ensure common understanding
    of the key deliverables, milestones, and their roles and responsibilities.


    # ## Planning the Project


    The following objectives make up the Planning the Project performance domain and
    are covered in Chapter 3 of this book:


    +   * Review and assess detailed project requirements, constraints, and assumptions
    with stakeholders based on the project charter, lessons learned, and by using
    gathering techniques in order to establish detailed project deliverables.

    +   * Develop a scope management plan based on the approved project scope and
    using scope management techniques, in order to define, maintain, and manage the
    scope of the project.

    +   * Develop the cost management plan based on the project scope, schedule, resources,
    approved charter, and other information, using estimating techniques, in order
    to manage project costs.

    +   * Develop the project schedule based on the approved project deliverables
    and milestones, scope, and resource management plans in order to manage timely
    completion of the project.

    +   * Develop the human resource management plan by defining the roles and responsibilities
    of the project team members in order to create a project organizational structure
    and provide guidance regarding how resources will be assigned and managed.

    +   * Develop the communication management plan based on the project organizational
    structure and stakeholder requirements in order to manage the flow of project
    information.

    +   * Develop the procurement management plan based on the project scope, budget,
    and schedule in order to ensure that the required project resources will be available.

    +   * Develop the quality management plan and define the quality standards for
    the project and its products based on the project scope, risks, and requirements
    in order to prevent the occurrence of defects and control the cost of quality.

    +   * Develop the change management plan by defining how changes will be addressed
    and controlled in order to track and manage change.

    +   * Plan for risk management by developing a risk management plan; identifying,
    analyzing, and prioritizing project risk; creating the risk register; and defining
    risk response strategies in order to manage uncertainty and opportunity throughout
    the project life cycle.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   Present the project management plan to the relevant stakeholders according
    to applicable policies and procedures in order to obtain approval to proceed with
    project execution.


    +   Conduct a kickoff meeting, communicating the start of the project, key milestones,
    and other relevant information in order to inform and engage stakeholders and
    gain commitment.


    +   Develop the stakeholder management plan by analyzing needs, interests, and
    potential impact in order to effectively manage stakeholders'' expectations and
    engage them in project decisions.


    # ## Executing the Project


    The following objectives make up the Executing the Project performance domain
    and are covered in Chapter 4 of this book:


    +   Acquire and manage project resources by following the human resource and procurement
    management plans in order to meet project requirements.


    +   Manage task execution based on the project management plan by leading and
    developing the project team in order to achieve project deliverables.


    +   Implement the quality management plan using the appropriate tools and techniques
    in order to ensure that work is being performed in accordance with required quality
    standards.


    +   Implement approved changes and corrective actions by following the change
    management plan in order to meet project requirements.


    +   Implement approved actions by following the risk management plan in order
    to minimize the impact of the risks and take advantage of opportunities on the
    project.


    +   Manage the flow of information by following the communications plan in order
    to keep stakeholders engaged and informed.


    +   Maintain stakeholder relationships by following the stakeholder management
    plan in order to receive continued support and manage expectations.


    # ## Monitoring and Controlling the Project


    The following objectives make up the Monitoring and Controlling the Project performance
    domain and are covered in Chapter 5 of this book:


    +   Measure project performance using appropriate tools and techniques in order
    to identify and quantify any variances and corrective actions.


    +   Manage changes to the project by following the changed management plan in
    order to ensure that project goals remain aligned with business needs.


    +   Verify that project deliverables conform to the quality standards established
    in the quality management plan by using appropriate tools and techniques to meet
    project requirements and business needs.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   * Monitor and assess risk by determining whether exposure has changed and
    evaluating the effectiveness of response strategies in order to manage the impact
    of risks and opportunities on the project.


    +   * Review the issue log, update if necessary, and determine corrective actions
    by using appropriate tools and techniques in order to minimize the impact on the
    project.


    +   * Capture, analyze, and manage lessons learned, using lessons learned management
    techniques in order to enable continuous improvement.


    +   * Monitor procurement activities according to the procurement plan in order
    to verify compliance with project objectives.


    # Closing the Project


    The following objectives make up the Closing the Project performance domain and
    are covered in Chapter 6 of this book:


    +   * Obtain final acceptance of the project deliverables from relevant stakeholders
    in order to confirm that project scope and deliverables were achieved.


    +   * Transfer the ownership of deliverables to the assigned stakeholders in accordance
    with the project plan in order to facilitate project closure.


    +   * Obtain financial, legal, and administrative closure using generally accepted
    practices and policies in order to communicate formal project closure and ensure
    transfer of liability.


    +   * Prepare and share the final project report according to the communications
    management plan in order to document and convey project performance and assist
    in project evaluation.


    +   * Collate lessons learned that were documented throughout the project and
    conduct a comprehensive project review in order to update the organization’s knowledge
    base.


    +   * Archive project documents and materials using generally accepted practices
    in order to comply with statutory requirements and for potential use in future
    projects and audits.


    +   * Obtain feedback from relevant stakeholders using appropriate tools and techniques
    and based on the stakeholder management plan in order to evaluate their satisfaction.'
  merge: -1
  img_proc: true
