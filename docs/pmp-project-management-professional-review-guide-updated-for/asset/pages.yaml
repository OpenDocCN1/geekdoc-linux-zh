    +   * New or revised estimates


    **Project Management Plan Updates** Updates to the project management plan typically
    include the communications management plan and potentially the human resource
    management and/or stakeholder management plans.


    **Project Documents Updates** Project documents typically updated as a result
    of carrying out this process include work performance reports, the issue log,
    and forecasts.


    **Organizational Process Assets Updates** The organizational process assets may
