- pgno: 98
  md: '# Performing Key Stakeholder Analysis


    Identifying stakeholders and performing analysis on key stakeholders is an important
    part of setting the stage for a successful project outcome. Stakeholder analysis
    is carried out through the Identify Stakeholders process and involves the use
    of brainstorming, interviewing, and several data-gathering techniques.


    By performing stakeholder identification and analysis, the project manager can
    better document stakeholder expectations and ensure that the expectations are
    aligned with the project objectives. It also serves as a way of gaining project
    support.


    > NOTE

    > Project stakeholders are those people or organizations who have a vested interest
    in the outcome of the project. They have something to either gain or lose as a
    result of the project, and they have the ability to influence project results.


    Identify Stakeholders is the first process of the Project Stakeholder Management
    Knowledge Area and part of the Initiating process group. This process involves
    identifying and documenting all the stakeholders on the project, including their
    interests, impact, and potential negative influences on the project. Stakeholder
    identification should occur as early as possible in the project and continue throughout
    its life cycle.


    Figure 2.14 shows the inputs, tools and techniques, and outputs of the Identify
    Stakeholders process.


    ![](img/c077f27110b08d0d6c301ce24ad84100_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_99_0.png)


    # Inputs of the Identify Stakeholders Process


    There are four inputs in the Identify Stakeholders process:


    **Project Charter**  In this process, the project charter provides the list of
    stakeholders along with other individuals or organizations affected by the project.


    **Procurement Documents**  When the project is procured, the list of key stakeholders
    and other relevant individuals or organizations may be obtained through the procurement
    documents.


    **Enterprise Environmental Factors**  The following enterprise environmental factors
    are used in this process:


    +   • Company culture

    +   • Organizational structure

    +   • Governmental or industry standards

    +   • Local, regional, or global trends and practices


    **Organizational Process Assets**  The following organizational process assets
    pertain to this process:


    +   • Stakeholder register templates

    +   • Lessons learned

    +   • Stakeholder register from previous projects


    ![](img/c077f27110b08d0d6c301ce24ad84100_99_1.png)


    # Tools and Techniques of the Identify Stakeholders Process


    The tools and techniques of Identify Stakeholders are stakeholder analysis, expert
    judgment, and meetings.'
