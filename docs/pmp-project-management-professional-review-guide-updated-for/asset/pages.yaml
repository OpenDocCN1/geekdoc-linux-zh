- pgno: 110
  md: '![](img/c077f27110b08d0d6c301ce24ad84100_110_0.png)


    Planning is the second of five project management process groups and includes
    the largest number of processes.


    Throughout the planning processes, the objectives are defined and refined, and
    a course of action is mapped out to successfully complete the project objectives
    as outlined by the project scope.


    Several key project documents are created within this process group, including
    the project management plan and its collection of subsidiary plans and baselines,
    which will guide the project management activities.


    The Planning process group accounts for 24 percent of the questions on the Project
    Management Professional (PMP®) exam.


    > The process names, inputs, tools and techniques, outputs, and descriptions of
    the project management process groups and related materials and figures in this
    chapter are based on content from A Guide to the Project Management Body of Knowledge
    (PMBOK® Guide), Fifth Edition (PMI®, 2013).


    # ## Developing a Scope Management Plan


    The Project Scope Management Knowledge Area is kicked off through a process that
    develops two key plans that will guide the identification of requirements, as
    well as the development, validation, and management of the project’s scope. These
    plans, referred to as the scope management plan and requirements management plan,
    are subsidiary documents of an overarching plan called the project management
    plan.


    # ### Understand Project Scope Management


    The scope management plan is the culmination of the processes needed to guarantee
    that the project includes all the work required to complete the project successfully.
    It also works to make sure that the project focuses only on the work required
    to complete the project and does not include unneeded tasks. As you learned in
    Chapter 2, “Initiating the Project,” the Project Scope Management Knowledge Area
    consists of six processes, but only four of them are a part of the Planning process
    group. The four processes used in the Planning process group are Plan Scope Management,
    Collect Requirements, Define Scope, and Create WBS.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Plans not created out of a formal process are considered to be generated out
    of the Develop Project Management Plan process, which is a high-level planning
    process that will be covered later in this chapter.


    Figure 3.1 shows the inputs, tools and techniques, and outputs of the Plan Scope
    Management process.


    # FIGURE 3.1 Plan Scope Management process


    ![](img/c077f27110b08d0d6c301ce24ad84100_111_0.png)


    # Plan Scope Management


    The scope management plan contains the following information or explanations:


    +   - The process used to prepare the project scope statement


    +   - A process for creating the work breakdown structure (WBS)


    +   - A definition of how the deliverables will be validated for accuracy and
    the process used for accepting deliverables


    +   - A description of the process for controlling scope change requests, including
    the procedure for requesting changes and how to obtain a change request form


    Keep in mind that throughout the Project Scope Management Knowledge Area, the
    scope management plan serves as a guide for documenting and controlling the scope
    of the project.


    # Inputs of Plan Scope Management


    Know the following four inputs of the Plan Scope Management process:


    **Project Management Plan** To help inform what the project is intended to accomplish,
    the project management plan with all of its approved subsidiary plans are used
    to help create the scope management plan.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '**Project Charter** As the project charter helps to communicate the high-level
    goals, business needs, assumptions, and constraints, it is used in this process
    to align the scope management plan with stakeholder expectations.


    **Enterprise Environmental Factors** Several enterprise environmental factors
    can influence the Plan Scope Management process, including but not limited to
    the organization''s culture, its infrastructure, marketplace conditions, and personnel
    administration.


    **Organizational Process Assets** Policies, procedures, and historical information,
    including a lessons learned knowledge base, are a few of the organizational process
    assets that help shape the scope management plan.


    # ## Tools and Techniques of Plan Scope Management


    The two tools and techniques that the Plan Scope Management process uses are expert
    judgement and meetings:


    **Expert Judgement** Input that is received from experienced team members and
    those who are knowledgeable about the project area provide what is considered
    to be expert judgment. Be sure that you look to all corners of your organization
    for any person or group with specialized education or training, or who might possess
    knowledge, skills, and/or experience in helping to develop the scope management
    plan.


    **Meetings** In the course of developing the scope management plan, members of
    project teams may attend meetings to help with information exchange and decision
    making. Depending on the meeting, the following members might be a part of the
    discussion to include: project manager, project sponsor, selected project team
    members, and anyone having responsibility in this area.


    # ## Outputs of Plan Scope Management


    For the exam, know the outputs of the Plan Scope Management process. This includes,
    naturally, the scope management plan, as well as the requirements management plan.


    The components of this plan include processes for


    +   - Preparing a detailed project scope statement

    +   - Creating a WBS from the detailed project scope statement

    +   - Establishing how the WBS will be maintained and approved

    +   - Specifying how formal acceptance will be obtained for completed project
    deliverables

    +   - Controlling and handling change requests to the detailed project scope statement


    ![](img/c077f27110b08d0d6c301ce24ad84100_112_0.png)


    > Remember that a scope management plan can be tailored to your needs, meaning
    that it can be formal or informal and may be highly detailed or broadly framed.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Requirements Management Plan


    The requirements management plan defines how the requirements will be analyzed,
    documented, and managed throughout all phases of the project. The type of phase
    relationship used to manage the project will determine how requirements are managed
    throughout the project. A requirements management plan includes the following
    components:


    +   - How planning, tracking, and reporting of requirements activities will occur

    +   - How changes to the requirements will be requested, tracked, and analyzed
    along with other configuration management activities

    +   - How requirements will be prioritized

    +   - Which metrics will be used to trace product requirements

    +   - Which requirements attributes will be documented in the traceability matrix

    +   - The structure that will be used to help create the traceability matrix


    # Collect Requirements


    During the early stages of planning, requirements will need to be collected, documented,
    and assessed. This is carried out through the Collect Requirements process (one
    of the 47 project management processes). This tends to be an iterative process
    because requirements often need to be refined as the project moves forward.


    ![](img/c077f27110b08d0d6c301ce24ad84100_113_0.png)


    > Requirements are typically conditions that must be met or criteria that the
    product or service of the project must possess to satisfy the objectives of the
    project. Requirements quantify and prioritize the wants, needs, and expectations
    of the project sponsor and stakeholders. According to the *PMBOK® Guide*, you
    must be able to measure, trace, and test requirements. It’s important that they
    be complete and accepted by your project sponsor and key stakeholders.


    As covered in Chapter 2, high-level requirements are documented within the project
    charter. Based on this document and lessons learned from past projects, detailed
    requirements will need to be gathered and assessed with the stakeholders. This
    is necessary to establishing the project deliverables. Detailed requirements can
    be gathered through the use of several requirement-gathering techniques that will
    produce a comprehensive list of requirements and that are needed to later establish
    the project deliverables. Collect Requirements is the third process within the
    Planning process group, following the creation of the scope management plan, and
    the second process in the Project Scope Management Knowledge Area. The primary
    purpose of the Collect Requirements process is to define and document the project
    sponsors’, customers’, and stakeholders’ expectations and needs for meeting the
    project objectives. This can'
  merge: -1
  img_proc: true
