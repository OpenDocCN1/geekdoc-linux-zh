    # Planned Value Example


    If $2,315.25 is the value of the cash flow three years from now, what is the value
    today given a 5 percent interest rate?


    $PV = \$2,315.25 \times (1 + 0.05)^{3}$


    $PV = \$2,315.25 \times 1.157625$ $PV = \$2,000$ $\$2,315.25$ three years from
    now is worth $\$2,000$ today.


    To calculate discounted cash flow for the projects you are comparing for selection
    purposes, apply the PV formula, and then compare the discounted cash flows of
    all the projects against each other to make a selection.


