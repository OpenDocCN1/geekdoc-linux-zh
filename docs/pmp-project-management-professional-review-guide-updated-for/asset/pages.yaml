  md: '144


    Chapter 3    Planning the Project


    # Standards and Regulations


    A standard is something that’s approved by a recognized body and that employs
    rules, guidelines, or characteristics that should be followed. According to the
    PMBOK® Guide, the Project Quality Management Knowledge Area is designed to be
    in alignment with the ISO standards.


    A regulation is mandatory. Governments or institutions almost always impose regulations,
    although organizations might also have their own, self-imposed regulations.


    # Tools and Techniques of Plan Quality Management


    Know the following tools and techniques of the Plan Quality Management process:


    +   - Cost-benefit analysis

    +   - Cost of quality

    +   - Seven basic quality tools

    +   - Benchmarking

    +   - Design of experiments

    +   - Statistical sampling

    +   - Additional quality planning tools

    +   - Meetings


    **Cost-Benefit Analysis** In the case of quality management, cost of quality trade-offs
    should be considered from within cost-benefit analysis. The benefits of meeting
    quality requirements are as follows:


    +   - Stakeholder satisfaction is increased.

    +   - Costs are lower.

    +   - Productivity is higher.

    +   - There is less rework.


    **Cost of Quality** The cost of quality (COQ) is the total cost to produce the
    product or service of the project according to the quality standards. Costs are
    broken into two categories: cost of conformance, which is money spent during the
    project to avoid failures, and cost of nonconformance, which is money spent during
    and after the project because of failures. Four costs are associated with the
    cost of quality: prevention costs and appraisal costs (conformance) and internal
    and external failure costs (nonconformance).


    **Prevention Costs** Prevention costs are the costs associated with satisfying
    customer requirements by producing a product without defects.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '**Appraisal Costs** Appraisal costs are the costs expended to examine the product
    or process and make certain the requirements are being met.


    **Failure Costs** Failure costs are what it costs when things don''t go according
    to plan. Failure costs are also known as cost of poor quality. Two types of failure
    costs exist:


    +   - Internal failure costs

    +   - External failure costs


    There are two categories of costs within COQ, as listed in Table 3.4.


    # **TABLE 3.4** Cost of conformance and nonconformance


    | Conformance costs | Nonconformance costs |

    | --- | --- |

    | Prevention costs | Internal failure costs |

    | Appraisal costs | External failure costs |


    ![](img/c077f27110b08d0d6c301ce24ad84100_176_0.png)


    Quality theorists and quality techniques are responsible for the rise of the quality
    management movement and the theories behind the cost of quality. Figure 3.26 highlights
    four quality theorists, along with their ideas, with whom you should be very familiar
    with for the exam.


    # **FIGURE 3.26** Quality theorists


    ![](img/c077f27110b08d0d6c301ce24ad84100_176_1.png)


    **Philip B. Crosby** Philip B. Crosby is known for devising the zero defects practice,
    which means to do it right the first time. If the defect is prevented from occurring
    in'
