  md: 'Another resource for keeping track of new applications announcements is through
    the comp.os.linux.announce newsgroup. This newsgroup contains postings of new
    applications, some kernel or application upgrades, web pages, etc. available for
    Linux. It is a moderated newsgroup and therefore has a high "signal to noise"
    ratio.


    Not all product upgrade announcements are made to comp.os.linux.announce, however.
    Therefore, visiting the web pages or FTP sites for the applications you are using
    probably a very good idea as well


    # 10.4. Linux Kernel Upgrades


    From time to time it may be wise to upgrade your Linux kernel. This will allow
    you to keep up with the new features and bug fixes as they become available. Or,
    perhaps, you are running Linux on new or specialty hardware, or wish to enable
    certain features for which a custom kernel is needed.


    This section will describe upgrading and customizing a new kernel. It isn''t as
    difficult as you might think!


    Announcements of new kernel versions can be obtained through various sources,
    including the comp.os.linux.announce newsgroup, as well as on the http://freshmeat.net/
    and http://slashdot.org/ web sites.


    Please note that there are currently two "streams" of kernel development – one
    stream is considered "stable" releases, while the other stream is considered "development"
    releases. For mission critical applications such as an Internet server, it is
    highly recommended that you use the stable releases and stay away from the development
    kernels.


    The difference between the two streams is that, with the development kernels,
    new-yet untested hardware drivers, filesystems, and other "cutting edge" developments
    are introduced on a regular basis. These kernels are for use by hackers only –
    people who don''t mind rebooting their system, should a kernel bug rear their
    ugly head.


    The stable kernels introduce new features and drivers only after they have been
    thoroughly tested. Minor releases in this stream also serve to clean up any remaining'
