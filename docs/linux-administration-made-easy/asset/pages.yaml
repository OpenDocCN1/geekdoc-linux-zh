  md: '# # Chapter 3. Linux Overview


    Welcome to Linux!


    # ## 3.1. What is Linux?


    Linux is a true 32-bit operating system that runs on a variety of different platforms,
    including Intel, Sparc, Alpha, and Power-PC (on some of these platforms, such
    as Alpha, is actually 64-bit). There are other ports available as well, but I
    do not have any experience with them.


    Linux was first developed back in the early 1990s, by a young Finnish then-university
    named Linus Torvalds. Linux had a “state-of-the-art” 386 minix, and decided to
    write an alternative to the 286-based Minix system (a small unix-like implementation
    primarily used in operating systems classes), to take advantage of the extra instruction
    set available on the then-new chip, and began to write a small barebones kernel.


    Eventually he announced his little project in the USENET group comp.os.minix,
    asking for interested parties to take a look and contribute to the project. The
    results have been phenomenal!


    The interesting thing about Linux is, it is completely free! Linux decided to
    adopt the GNU Copy license of the Free Software Foundation, which means that the
    code is protected by a copyright – but protected in that it must always be available
    to others.


    Free means – you can get it for free, use it for free, and you are even free to
    sell it for a profit (this isn’t as strange as it sounds; several organizations,
    including Red Hat, have packaged the standard Linux kernel, a collection of GNU
    utilities, and put their “fl” of included applications, and sell them as distributions.
    Some common and popular distributions are Slackware, Red Hat, SuSe, and Debian!
    The great thing is, you have access to source code which means you can customize
    the operating systems to your own needs, not those of the “target market” of most
    commercial vendors.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Linux can and should be considered a full-blown implementation of unix. However,
    it can not be called “Unix”; not because of incompatibilities or lack of functionality,
    because the word “Unix” is a registered trademark by AT&T, and the use of the
    word is only allowable by license agreement.


    Linux is ever as supported, as reliable, and as viable as any other operating
    system solution (well, in my opinion, quite a bit more so!). However, due to its
    origin, the philosophy behind it, and the lack of a multi-million dollar marketing
    campaign promoting it, there are lot of myths about it. People have a lot to learn
    about this wonderful OS!


    # 3.2. Breaking the Myths


    I''ve been using Linux for several years, and I like to think Know a bit about
    the operating system and what it can and cannot do. As I''m an avid USENET reader,
    I follow the latest developments and of course, the various flame-wars that invariably
    crop up (those darn cross-posting advocacy people! :-) I''ve seen my share of
    myths (often called FUD – “Fear, Uncertainty, Doubt” which seems to be a common
    tactic used by commercial technology vendors to frighten their market away from
    competing technologies) more than a few people believe. So, let me try to run
    down a few of the more common ones and attempt to shatter them :-)


    +   • Linux is freeware, hence, it is a toy.


    Some people seem to have the notion that, a piece of software was written by volunteers
    with no profit motive in mind, that the results must clearly be inferior to commercial-grade
    offerings.


    This may have been true in the past (I mean, there was a lot of freeware which
    was absolute garbage in the DOS and early Windows world), but it is most certainly
    not true in recent days.


    The power of the Internet has made it possible to bring together some of the brightest
    minds in the globe, allowing collaboration on projects they find interesting.
    The people'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Chapter 3. Linux Overview


    who have put a hand into developing Linux or the thousands of GNU utilities and
    applications packages are from a diverse background, and all of them have different
    personal reasons for wanting to contribute.


    Some are hard-core hackers who develop for the love of coding, others have a need
    for something(for example, a network traffic monitor for a LAN at work) and decide
    to write it themselves, others are academics and computer scientists who use Linux
    for their research qualities.


    Unlike a commercial offering where a package is developed and sold, source code
    excluded, the end-user, code used in Linux is scrutinized, debugged, and improved
    upon anyone who has the interest and ability. This act of peer-review is one of
    the reasons that Linux offers the high reliability and high performance that it
    does.


    Don''t forget: The Internet itself was built and runs almost exclusively on Open
    Source projects. The e-mail you exchange on a daily basis with people around the
    world has an 80% chance of being handled on one or both by Sendmail, the web pages
    you browse while “Surfin”/ the Web are served to you by Apache over 50% of the
    world’s sites. Reliable enough for you?


    +   - There is no support for Linux.


    Hearing this myth somewhat sickens me. And supposedly the “other” vendors do offer
    support? I’ve had personal experience with one very popular commercial operating
    system, where the vendor’s so-called “support” was completely useless.


    First of all, there is support for Linux. Yes, commercial support. There are some
    companies that can provide much support as you are willing to pay for; offering
    telephone and e-mail support, many offering to come right to your door to deal
    with the problem!


    However, in 99% of the situations you will run into Linux, you will be able to
    accomplish what you wish if you can simply get the answer to a question or two.
    This is easily accomplished by USENET or on any of the many mailing lists available!


    I’ve never had a problem I couldn’t find a solution to, by either searching on
    http://www.denews.com/, or by asking in one of the comp.os.linux.* newsgroups.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Normally I can receive an answer to any of the support issues I ask about within
    to twelve hours of my posting.


    Another interesting aspect of Linux is, because the source code for the entire
    kernel and most of the other operating system components is freely available,
    key-support issues such as security, denial of service, or CPU bugs (such as Intel''s
    F00F fatal exception) are tracked down very quickly – usually an order of magnitude
    faster than offered for similar or identical problems on the commercial offerings.
    So, where''s the commercial support?


    There are countless others that I would like to debunk, that is beyond the scope
    of this document. However, for further myth debunking check the “Linux Myth Dispeller”
    at http://www.KenAndTed.com/KensBookmark/linux/index.html as well as the “Linux
    FUDfactor FAQ” at http://www.geocities.com/SiliconValley/Hills/9267/fud2.html


    # 3.3. One User’s Perspective


    I use Linux both at work and at home.


    At my place of employment, we are using Linux to provide Internet services for
    hundreds of users. These services include TACACS (dial-in modem user) authentication,
    web page hosting and proxy caching, as well as SMTP and POP services. In addition,
    we are using Linux to provide NFS services, and also for providing and mounting
    SMB-protocol (WFW/Win95/WinNT) file & print and FAX services using the Samba package.


    At home, I use Linux for my personal needs, as Internet services, software development,
    and of course game playing (seeing Quake 2 running on a Linux box is a thing of
    beauty)! One of the things I love about Linux is, no matter how hard I pound on
    it, does not crash! Its also a great way to learn, develop, and maintain my Unix
    skills.


    I am using the Red Hat 6.1 distribution of Linux (see http http://www.redhat.com/
    for more information). This distribution includes all the necessary software for
    a full-blown unix'
  merge: -1
  pgno: 14
