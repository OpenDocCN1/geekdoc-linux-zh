  md: '# and Administration


    At place of employment, we are using Linux as a DNS server. It performs exceptionally
    well. This section will address configuration of DNS tables for these services
    using the BIND 8.x package which comes standard with the Red Hat distribution.


    Note: Red Hat versions 5.1 and earlier the BIND 4.x package, which used a slightly
    different format for its configuration file. BIND 8.x offers more functionality
    than that offered by BIND 4.x, and as 4.x is no longer being developed, you should
    consider upgrading your BIND package to the latest version. Simply install the
    BIND RPM package (see Section 10.1 for details using the RPM utility), then convert
    your configuration file to the new format.


    Fortunately, converting your existing BIND 4.x configuration file to be compliant
    with BIND 8.x is easy! In the documentation provided as part of BIND (for example,
    "/usr/doc/bind-8.1.2/" for BIND version 8.1.2), there exists a file called "named-bootconf.pl",
    which is an executable Perl program. Assuming you have Perl installed on your
    system, you can use this program to convert your configuration file. To do so,
    perform the following commands (as root):


    ```

    cd /usr/doc/bind-8.1.2/

    ./named-bootconf.pl < /etc/named.boot > /etc/named.conf

    mv /etc/named.boot /etc/named.boot-obsolete

    ```


    You should now have an "etc/named.conf" file which should look like BIND 8.x "out-of-the-box".
    Your existing DNS tables will work as-is with the new version of BIND, as the
    format of the tables remains the same.


