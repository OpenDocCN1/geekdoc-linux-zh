    # 8.2. Server Restore Procedures


    Unarguably, the one thing that is more important than performing regular backups
    having them available when it comes time to recover an important file!


    Obviously, as discussed in Section 8.1, the procedures for performing a restore
    will differ depending on your choice of a backup solution. In this section, I
    will discuss methods for restoring files which have been backed up with “tar”
    and ”KDat”.


    # 8.2.1. Restoring with “tar”:


    The following command will restore all files from the “full-backup-09-October-1999.tar.gz”
    archive, which is an example backup of the Linux system (as created in the example
    commands shown in Section 8.1.1):


    ```

    tar -zxvpf /archive/full-backup-09-October-1999.tar.gz

    ```'
