    mydomain.name:901


    (Of course, in order to use the SWAT utility you will need a web server running,
    such as Apache. See Section 7.1 for details.)


    The latest Samba versions also add considerable features in comparison with versions
    prior to 2.0. It is worth taking the time to upgrade this package.


    A client must have a TCP/IP network stack running in order to connect to shares.
    Further, for browsing to work, the TCP/IP protocol must be bound to NETBEUI. Under
    Windows 95 this can be configured from the "Network" icon from within the Control
    Panel.


    Assuming the client has been configured properly, you will see the servers appear
    in their "Network Neighborhood" (or equivalent browsing scheme if you are using
    Windows 95/NT). You can then map drives from the network neighborhood, or type
    in an absolute path to the share (eg. "\mail\cdrom"). If the shared service requires
    a password to be entered, you will be prompted for one.


