  md: '# 10.6. Building a Custom Kernel


    If you are running Linux on a system with hardware or wish to use features not
    supported in the stock kernels, or perhaps you wish to reduce the kernel memory
    footprint to make better use of your system memory, you may find it necessary
    to build your own custom kernel.


    Upgrading the kernel involves configuring desired modules, compiling the kernel
    and modules, and finally installing the kernel image. This is followed by a system
    reboot (with fingers crossed!) to load the new kernel. All of this is documented
    in the "README" file which comes each kernel package. Further information can
    be found in the "Documentation/" directory. A particularly helpful file there
    is "Configure.help" which contains detailed information on the available kernel
    compile options and modules.


    The following is a sample session demonstrating the build of a custom kernel,
    version 2.0.36 on the Intel platform. While building a custom kernel is usually
    a matter of configuring, compiling & installing (usually in the case of new hardware)
    it is necessary to download additional driver software your hardware may not be
    supported by the kernel version you are compiling.


    The first step in building a custom kernel is to download and install the kernel
    sources from either RPM (preferred) or from tarball. See Section 10.4 for details
    on obtaining the appropriate files.


    Next, use the "rpm" utility (or "tar", as appropriate) to install the kernel source
    tree and header files. For example, to install the 2.0.36-3 kernel RPM files:


    ```

    rpm -Uvh kernel-source-2.0.36-3.i386.rpm kernel-headers-2.0.36-3.i386.rpm

    rpm -Uvh kernel-ibcs-2.0.36-3.i386.rpm

    ```


    (If you are running Linux on a notebook, you would also likely install the "kernel-pcmcia-cs-2.0.36-3.i386.rpm"
    file, which provides power management features.)


    After installing the kernel files, you should be able to find the new source tree
    in the "/usr/src/linux/" directory.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'The next step is to download any additional driver files (if applicable) and
    install them in the new kernel source tree. For example, to add support for the
    Mylex DAC960 hardware RAID controller, I would download the driver software from
    the http://www.dandelion.com/ web site. Unfortunately, such driver software are
    usually offered only as tariffs and need to be installed using the “tar” utility.


    ```

    cd /usr/src/

    tar zvxf DAC960-2.0.0-Beta4.tar.gz

    ```


    You should read the documentation provided with your additional driver software,
    if applicable. For example, the DAC960 driver includes a “README” file which gives
    instructions on where the newly downloaded files should be located, and how to
    apply to the kernel patch:


    ```

    mv README.DAC960 DAC960.[ch] /usr/src/linux/drivers/block

    patch -p0 < DAC960.patch

    ```


    The next step is to ensure your symbolic file links are consistent with the new
    kernel tree. Actually, this step needs to be done once, so the following needs
    to be done only if you have compiled a custom kernel before:


    ```

    mail:/usr/src# cd /usr/include

    mail:/usr/src## rm -rf /usr/src/linux/include/asm-i386 asm

    mail:/usr/src## ln -s /usr/src/linux/include/linux linux

    mail:/usr/src## ln -s /usr/src/linux/include/scsi scsi

    ```


    > Note: The above step is no longer necessary for 2.2.x or higher kernel versions.


    The next step is to configure your kernel settings. This is the most important
    step in building the custom kernel. If you disable the wrong settings, you may
    leave out support for features or hardware you need. However, if you enable the
    wrong settings, you will be needlessly enlarging the kernel and wasting your valuable
    system memory


    ![](img/846ec8d157c5d667ec22f4e21c29db61_103_0.png)'
