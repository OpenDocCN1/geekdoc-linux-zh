    ```


    Now, type the command to actually install the new modules:


    ```

    mail:/usr/src/linux# make modules_install

    ```


    The next step is to copy the kernel into the “/boot/” directory and LILO to update
    the boot record so that the new kernel is recognized. The following commands will
    make a backup copy of your existing kernel, copy the new kernel, and then refresh
    the LILO boot:


    ```

    mail:/usr/src/linux# cd /boot

    mail:/boot# cp vmlinux vmlinux.OLD

    mail:/boot# cp /usr/src/linux/arch/i386/boot/bzImage vmlinux-2.0.36

    mail:/boot# /sbin/lilo

    ```


    Finally, you will need to edit your “/etc/lilo.conf” file, and make sure the “image”
    reference is pointing to the new kernel. You should also add a section which points
    to your backup kernel, called, perhaps, “OldLinux”. Here is an example file:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/vmlinux

    label=Linux

    root=/dev/hdb1

    read-only

    image=/boot/vmlinux.OLD

    label=OldLinux

    read-only

    ```


    By adding your backup kernel information in this way, should your new kernel fail
    to boot properly (perhaps a device is not recognized, or a daemon doesn’t start
    as it'
