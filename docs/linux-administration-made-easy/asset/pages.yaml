    would be-crackers deterred by threat of punishment, as well as ensuring that others’
    systems (which may themselves have been compromised) are kept secure.


    +   Assuming you install and upgrade system tools and applications using the “RPM”
    utility, you may wish to verify the integrity of your installed packages by auditing
    them with the following command:


    ```

    rpm -verify -a > /tmp/rpm-audit.txt

    ```


    The above command will check your system’s RPM database with all relevant files,
    and indicate any files which have been modified, by displaying a ‘5’. Here is
    some example output of such an:


    ```

    S.....T /bin/ls

    S.S....T /usr/bin/du

    ....G. /dev/tty5

    ....U. /dev/vcs5

    ....U. /dev/vcs5

    S.S....T c /etc/lynx.cfg

    S.S....T c /etc/sendmail.cf

    ```


    In the sample output, you can see there is going to be a list of seven files,
    of which have been modified. Now, obviously there are several, perhaps many, files
    which have been modified if you have customized your system at all. A brief check
    of the /etc/lynx.cfg and /etc/sendmail.cf files, perhaps visually or perhaps from
    backup, might reveal legitimate configuration changes that you have made to your
    system.


    However, notice in the sample above, two of the modified files are binary executable
    files? It is likely that these two binaries, the “ls” command as well as the “du”
    command, are actually trojan binaries which system checker has installed to perform
    nefarious purposes (a “diff” command performed on any modified binaries with those
    restored from backup or RPM might reveal significant size or other differences;
    further evidence of trojans.)


    (For more information on “RPM”, Section 10.1.)


    For more information on security-related issues, an excellent resource entitled,
    “Securing RedHat 5.x” document is available at http://redhat-security.ens.utulsa.edu/


