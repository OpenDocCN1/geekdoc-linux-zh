  md: '# 10.2. Installing or Upgrading Without RPM


    Sometimes, you may find necessary to install or upgrade an application for which
    an RPM package is not available. Of course, it is certainly possible to do such
    a thing (in fact, it is the "defacto-standard" way of doing things in the so-called
    "real" Unix world), but I would recommend against it unless absolutely necessary
    (for reasons, see Section 10.1).


    Finally, end-users who wish to install software from tarballs for their own private
    use will probably do so under their own home directory.


    After downloading the tarball from your trusted software archive, change to the
    appropriate directory and untar the archive by typing commands (as root, if necessary)
    as in the following example:


    ```

    tar zxvpf cardgame.tar.gz

    ```


    The above command will extract all files from the example "cardgame.tar.gz" compressed
    archive. The "z" option tell that the archive is compressed with gzip (so omit
    this option if your tarball is not compressed); the "x" option tell tar to extract
    all files from the archive. The "v" option is for verbose, listing filenames to
    the display as they are extracted. The "p" option maintains the original and permissions
    of the files had as the archive was created. Finally, the "f" option tells that
    the very next argument is the file name. Don''t forget that options to care are
    caSe-EnSiTiVe.


    > Caution: As mentioned in Section 8.2.1, I recommend first using the "r" option
    to display the archive contents to verify the contents of the files. Doing so
    may help avoid extracting files to unintended locations, or even'
