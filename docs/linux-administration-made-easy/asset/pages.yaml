  md: '# # Chapter 2. Introduction


    Linux 2.2.0, released 25-Jan-99: Onwards to World Domination...


    Perhaps you are fairly new to Linux and were hoping to find a summary of the kinds
    of configuration and administrative tasks that may be required of you from time
    to time. If this sounds like you, this document is just what you''ve been looking
    for!


    # ## 2.1. Scope


    This documentation will attempt to summarize the installation and configuration,
    as well as the day-to-day administrative and maintenance procedures that should
    be followed to keep a Linux-based server or desktop system up and running. It
    is not intended to be a full overview of Unix operations, as there are several
    good texts available as well as on-line documentation which may be referred to
    in cases where more detailed information is required.


    In general, your Linux system can operate with a minimum of user maintenance.
    Routine tasks, such as rotating and discarding of system logs, are automated.
    Therefore, for the most part, even with very little user intervention, Linux will
    hum along doing its job. However, in cases of custom needs or system failure this
    documentation may prove useful.


    I currently use Linux both at home and at my place of employment. It has served
    me well, and has worked as a reliable Internet and file/print service for my employer
    for four years now.


    # ## 2.2. Choosing a Linux Distribution


    There is quite a variety of Linux distributions from which to choose. Each distribution
    offers the same base Linux kernel and system tools, but differ on'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'installation method and bundled applications. Each distribution has its own
    advantages as well as disadvantages, so it is wise to spend a bit of time researching
    which features are available in a given distribution before deciding on one.


    The following is a list of a few web sites you can visit, which will describe
    a given Linux distribution as well as provide information on how you can download
    or purchase it:


    http://www.redhat.com/


    The Red Hat distribution, by commercial vendor Red Hat Software, is one of the
    most popular distributions. With a choice of GUI- and text-based installation
    procedures, Red Hat 6.1 is possibly the easiest Linux distribution to install.
    It offers easy upgrade and package management via the “RPM” utility, and includes
    both the GNU Network Object Model Environment (GNOME) and the “K Desktop Environment’DE),
    both popular GUI window managers for the X Window System. This distribution is
    available for the Intel, Alpha, and Sparc platforms.


    http://www.debian.org/


    The Debian distribution, by non-profit organization known as “The Debian Project”
    is the darling of the Open Source community. It also offers easy upgrade and package
    management via the “dpkg” utility. This distribution is available for the Intel,
    Alpha, Sparc, and Motorola (Macintosh, Amiga, Atari) platforms.


    http://www.suse.com/


    The S.u.S.E. distribution, by commercial vendor S.u.S.E., is another popular distribution,
    and is the leading distribution in Europe. It includes the “K Desktop Environment’”(KDE),
    and also offers easy upgrade and package management via the “YAST” utility. This
    distribution is available for both Intel and Alpha platforms.


    http://www.caldera.com/


    The OpenLinux distribution, by commercial vendor Caldera, is aimed towards'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'corporate users. With the new OpenLinux 2.2 release, Caldera has raised the
    bar with what appears to be the easiest to install of Linux available today. In
    addition, it comes standard with the “K Desktop Environment” (KDE). This distribution
    is available for the Intel platform only.


    http://www.linux-mandrake.com/


    The Mandrake distribution, by commercial vendor MandrakeSoft S.A., integrates
    the Red Hat or Debian distributions (your choice) with additional value-add software
    packages from those included with the original distributions.


    http://www.slackware.com/


    The Slackware distribution, by Patrick Volkding of Walnut Creek Software, is the
    grandfather of modern distributions of Linux. Offers a fairly simple installation
    procedure, but poor upgrade and package management. Still based on the libs but
    the next version will probably migrate to the newer glibc. Recommended for users
    who are more technical and familiar with Linux. This distribution is available
    for the Intel platform only.


    Listing all the available distributions is beyond the scope of this document,
    I’ve listed only the most popular. However, further information on the distributions
    can be found in the “Distribution-HOWTO” guide, available at http://metalab.unc.edu/LDP/HOWTO/Distribution-HOWTO.html


    > Tip: If you decide to buy your distribution on CD-ROM, you might be able to
    find better pricing at other resellers (for example, I''ve been quite satisfied
    on several dealings with Internet-based software vendor http://www.cheapbytes.com/).
    On the other hand, you may wish to pay the higher price to the distribution vendors
    to ensure that their offerings continue to improve.


    My distribution of choice is Red Hat Linux (it also happens to be, unarguably,
    the most popular distribution among Linux users). For almost three years, I was
    a die-hard Slackware fanatic (before that I had messed around a bit with a small
    distribution tsx-11 way back in the kernel 0.90a days), and although I’ve tried
    Red Hat in the past, I'
  merge: -1
