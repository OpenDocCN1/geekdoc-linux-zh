- img_proc: true
  md: '# Chapter 2. Introduction


    never could bring myself to say anything good about their distributions. Then,
    I tried Red Hat 5.1, and found myself quickly converted! In my opinion, 5.1, Red
    Hat finally “got it right”.


    Some of the reasons I have become a fan of the Red Hat distribution include the
