  md: '# Chapter 8. Backup and Restore Procedures


    The mnemonic representations are identified by prefixing them with a "-” character,
    while the full names are prefixed with two such characters. Again, the "man" pages
    for information only using tar.


    Another example, this time writing only the specified file systems (as opposed
    to writing them all with exceptions demonstrated in the example) onto a SCSI drive:


    ```

    tar -cvpf /dev/nst0 -label=Backup set created on ''date ''+%d-%B-%Y''" \ \

    -directory / \

    exclude=var/spool/ etc home usr/local var/spool

    ```


    In the above command, notice that the "z" (compress) option is not used. I strongly
    recommend against writing compressed data to tape, because if data on a portion
    of the tape becomes corrupted, you will lose your entire backup set! However,
    archive files stored without compression have a very high recoverability for non-affected
    files, if portions of the tape archive are corrupted.


    Because the tape drive is a character device, it is not possible to specify an
    actual file name. Therefore, the file name used as an argument to tar is simply
    the name of the device, "/dev/nst0", the first tape device on the SCSI bus.


    > Note: "/dev/nst0" device does not rewind after the backup set is written; therefore
    it is possible to write multiple sets on one tape. (You may also refer to the
    device as "/dev/st0", in which case the tape is automatically rewound after the
    backup set is written.)


    When we aren''t able to specify a filename for the backup set, the "-label" option
    can be used to write some information about the backup set into the archive file
    itself.


    Finally, only the files contained in the "/etc/", "/home/", "/usr/local/", and
    "/var/spool/" (with the exception of Squid''s cache data files) are written to
    the tape.


    When working with tapes, you can use the following commands to rewind, and then
    eject your tape:'
