    This would tell you that this particular process is a web server (the Apache web
    server appears multiple times in the process list; for information on which you
    can see Section 7.1).


    If you notice a service is not operating, you can use the "kill -HUP pid" (where
    "pid" is the process identification number as shown in the process list produced
    with "ps\). For example, Internet services (a process called inetd, process #123
    in our example) are not working as they should, a "kill -HUP 123" (or safer, use
    the "killall -HUP inetd") command and specify the process name: "killall -HUP
    inetd" should restart the process. The -HUP option to the kill command means "hang
    up"; the process knows that it is supposed to reload itself.


    Another thing to try if you are unable to resolve the problem would be to shut
    the system down and reboot it (see Section 6.7 for details).


    At times, you may find it necessary to temporarily suspend a process, and then
    resume its execution at a later time. For example you may be running a CPU-intensive
    job and wish to run an IDE-based CDRecordable. Since IDE-based devices rely on
    the CPU for much of the work behind input/output, they are prone to buffer starvation
    if your CPU is too busy, and you end up with a useless coaster instead of a properly
    prepared CD! The following two commands will suspend a process, and the resume
    it, respectively:


    ```

    kill -STOP 945

    kill -CONT 945

    ```


    Red Hat has a better way of starting and stopping some processes, which are covered
    in Section 9.3 below.'
