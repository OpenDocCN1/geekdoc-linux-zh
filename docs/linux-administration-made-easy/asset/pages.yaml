    # 7.3. Internet User Authentication with TACACS


    At my place of employment, TACACS authentication of dial-up Internet users (who
    are connecting to our modem pool which in turn connected to a couple of Cisco
    250x access servers), we are using the Vikas version of “tacacssd”.


    After compiling and installing the Vikas package latest are available from ftp/ftp.navya.com/pub/vikas;
    I don''t believe the package is available in RPM format, you should add the following
    entries to the “/etc/inetd.conf” file so that the daemon be loaded by the inetd
    daemon whenever a TACACS request is received.


    ```

    # TACACS is a user authentication protocol used for Cisco Router products.

    tacacs dagram udp root /etc/tacacssd tacacssd c /etc/tacacssd-conf

    ```


    Next, you should edit the “/etc/tacacssd-conf” file and customize it, as necessary,
    for your system (however you will probably be able to use the default settings
    as-is).


    > Note: If you are using shadow passwords (see Section 6.6 for details), you will
    have some problems with this package. Unfortunately, PAM (Pluggable Authentication
    Module), which Red Hat has for user authentication, is not supported by this package.
    One workaround that I use is to keep a separate “passwd” file in “/usr/local/tacacs/etc/”
    which matches the one in /etc/ but be non-shadowed. This is a bit of a hassle,
    and if you choose to do this sure you set permissions on the other password file
    to make sure it is only readable by root:


    ```

    chmod a-wr,u+r /usr/local/tacacs/etc/passwd

    ```'
