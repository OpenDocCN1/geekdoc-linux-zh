  md: '# # Chapter 12. Strategies for Keeping a Secure Server


    Linux can certainly be considered as secure – or more secure – than operating
    systems from other vendors. Admitted, with Linux becoming more and more popular,
    it is becoming a very attractive target for crackers to concentrate their break-in
    efforts on. There are exploits that are discovered from time to time, however
    the open nature of Linux usually means that such exploits are patched quickly,
    and security announcements are disseminated widely, containing either temporary
    workarounds or pointers to updated software.


    I won''t pretend to be an expert on security issues, however I am at least aware
    of these issues, I believe to be a large part of the battle towards one’s systems
    as secure as possible. Although being aware and diligent in keeping up with security
    updates will in no way guarantee that a system''s security measures won''t be
    circumvented, the likelihood of a break-in is greatly reduced.


    Although there have security exploits found in external services which could have
    been used by crackers to break into a system (for example, the IMAP daemon exploit),
    I believe that is far more likely that a determined cracker will penetrate the
    system from *within*. Compared to the handful of services communicating with the
    outside world, there are *thousands* of commands and utilities available from
    the shell, one or more of which said, I must admit to recently discovering one
    of the servers I maintain had been compromised through an external service.


    For this reason, I recommend avoiding giving shell accounts to users unless they
    are absolutely necessary. Even if you consider your users completely trustworthy
    and have no qualms in providing them with access to the shell, all it takes is
    just one of these users to have a weak password. An outside cracker, finding its
    way into your system by exploiting this weak password, will then be able to work
    at his or her leisure internally, looking for further weaknesses.


    There are, fortunately, things you can do to greatly increase the security of
    your Linux'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Chapter 12. Strategies for Keeping a Secure Server


    system. While a detailed discussion of security issues is beyond the scope of
    this document, the following checklist provides some of the most important things
    you should do to enhance security:


    +   * Upgrade system tools, applications, and kernel: By far the most common cause
    of system break-ins is by not exercising discipline in keeping an up-to-date server.
    Performing regular upgrades of the system kernel, tools and utilities will ensure
    that your system is not filled with older items for which known exploits are available.
    For details on keeping an up-to-date server, see Section 4.9, and well as Section
    10.3.

    * Shadow passwords: You should definitely be using Shadow passwords; switching
    to this password format is easy! For details, see Section 6.6.

    * Smart password management: Make sure passwords, especially for users you providing
    with shell access, are strong and changed often. Also, if you use multiple servers,
    the temptation to use the same password for all of them (otherwise, if a cracker
    breaks into one server using a discovered password, he or she can break into them).

    * Use secure shell (ssh): Switching to "ssh" instead of "telnet". Telnet is insecure
    for two reasons: One, sessions are unencrypted, which means everything, including
    username and passwords, are transmitted as clear text. Second, an open telnet
    port is one of the first places a cracker will try to connect.


    Ssh provides encrypted and compressed connections and provide substantially more
    security than telnet connections. You can run a ssh server (which allows incoming
    secure connections) as well as a client (for outgoing secure connections) under
    Linux. You can find binary RPM packages at ftp://ftp.reply.com/pub/replay/redhat/i386/.
    You will need the following files (newer versions may be available by the time
    you read this):


    +   * ssh-1.2.27-5.i386.rpm The base package.

    * ssh-clients-1.2.27-5.i386.rpm Clients for outgoing connections.

    * ssh-extras-1.2.27-5.i386.rpm Some handy perl-based scripts.

    * ssh-server-1.2.27-5.i386.rpm Server for incoming connections.


    123'
