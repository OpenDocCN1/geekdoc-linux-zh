  md: '# Chapter 4. Installation and Hardware Configuration


    This chapter will detail the procedures needed to install Red Hat 6.1 onto an
    Intel system; the procedures are similar whether you choose to install using either
    GUI or text-based installation. Since much of this information is already well
    documented in the Red Hat User’s Guide (provided as a paper manual in the “Official”
    boxed sets, included in the “/doc” directory on the CD, and as available online
    at ftp://ftp.redhat.com/pub/redhat/redhat-6.1/i386/doc/rhint/index.html), I have
    skimmed over of the details. However, there are a few things I think are lacking
    in the Red Hat guide, and I will attempt to cover these items in greater detail.


    # 4.1. Creating an Installation Diskette


    The first step in getting Red Hat’s distribution of Linux onto a system, you need
    to find a way of starting the installation program. The usual method of doing
    so is to create an installation disk, although if you are installing from CD-ROM,
    and your system’s BIOS supports it, you should be able to boot directly into the
    installation program from the CD.


    Otherwise, to create an installation diskette, you’ll need to copy the “boot.img”
    (which is simply an image of an ext2-formatted Linux boot disk with an additional
    installation program) onto a floppy diskette. The “boot.img” file can be obtained
    from the /images directory of the Red Hat CD-ROM, or downloaded via FTP from ftp://ftp.redhat.com
    in the /pub/redhat/redhat-6.1/i386/images directory (assuming you are installing
    Linux on an Intel box).


    You can create the boot diskette either from a DOS or Windows system, or from
    an existing Linux or Unix system. For your destination disk, you can use either
    an unformatted or a pre-formatted (for DOS) diskette – it makes no difference.


    Under DOS: Assuming your CD-ROM is accessible as drive D:, you can type:'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 4. Installation and Hardware Configuration


    ```

    d:

    cd \images

    ..\dosutils\rewrite

    ```


    For the source file, enter "boot.img". For the destination file, enter "a-:" (assuming
    the diskette you created is inserted into the A: drive). The "rewrite" program
    will then copy the "boot.img" file onto diskette.


