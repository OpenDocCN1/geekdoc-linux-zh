    # # 10.3. Strategies for Keeping an Up-to-date System


    From time to time you may hear of significant upgrades to the Linux kernel or
    user applications from various sources. These sources may be magazines, newsgroups,
    web pages, etc.


    Probably the best single online resource that a Linux administrator should – nay,
    must – keep an eye on is the http://freshmeat.net/ web site. This site contains
