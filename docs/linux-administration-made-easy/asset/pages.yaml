  md: '# Chapter 10. Upgrading Linux and Other Applications


    The way to install a package from source is to specify the “rebuild” switch to
    the RPM utility. For example:


    ```

    rpm -ivh -rebuild foo.src.rpm

    ```


    The above command will configure and compile the “foo” package, producing a binary
    RPM file in the “/usr/src/redhat/RPMS/i386/” directory (assuming you are using
    Linux on the Intel platform). You can then install the package as you normally
    would.


    Finally, if you are having problems getting a source package to compile (perhaps
    you need to modify a make, or a configuration option, etc.) you can use the following
    steps (again, illustrating your fictitious “foo” package example) to compile the
    source, build a new package, and then install it from the binary package:


    ```

    rpm -ivh foo.src.rpm

    cd /usr/src/redhat/SPECS

    pico -w foo.spec

    ```


    Make whatever changes you feel are needed to the “.spec” file, and then type:


    ```

    rpm -ba foo.spec

    ```


    This will rebuild the package using whatever changes you have made to the “.spec”
    file. As above, the resultant binary RPM file will be located in

    “/usr/src/redhat/RPMS/i386/”, and can be installed as you normally would.


    You should look at the Red Hat documentation for more information on RPM. It is
    an extremely powerful tool that is worth learning in detail. The best source of
    information on RPM is “Maximum RPM”, which is available in both book form, as
    well as in postscript format at http://www.rpm.org/maximum-rpm.ps.gz. (If you
    decide to print the postscript document, be advised that you’ll need a lot of
    paper to do so!) There is a smaller guide, the “RPM-HOWTO”, at http://www.rpm.org/support/RPM-HOWTO.html
    available as well.'
