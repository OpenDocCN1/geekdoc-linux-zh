  md: 'In the above example, all files contained in the archive are listed by file
    name. The resulting output is piped to the “grep" command (using grep’s “i" option
    to ignore mixed case), displaying any files containing “profile" in either the
    directory or path name. Once you determine the exact file name you wish to restore,
