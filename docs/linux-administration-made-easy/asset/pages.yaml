    # 6.6. Linux Password & Shadow File Formats


    Traditional Unix systems keep user account information, including one-way encrypted
    passwords, in a text file called `/etc/passwd`. This file is used by many tools
    (such as `ls`) to display file ownership, by matching user ID # with the user''s
    names, the file needs to be world-readable. Consequently, this can be somewhat
    of a security risk.


    Another method of storing account information, that I always use, and is the shadow
    password format. With the traditional method, this method stores account information
    in the /etc/passwd file in a compatible format. However, the password is stored
    as a single “x” character (ie. not stored in this file). A second file, called
    `/etc/shadow`, contains encrypted password as well as other information such as
    account or password expiration values, etc. The /etc/shadow file is readable only
    by the root account and is therefore less of a security risk.


    While some other Linux distributions forces you to install the Shadow Password
    Suite in order to use the shadow format, Red Hat makes it simple. To switch between
    the two formats, type (as root):


    ```

    /usr/sbin/pwconv To convert to the shadow format

    /usr/sbin/pwunconv To convert back to the traditional format

    ```


    With shadow passwords, the `/etc/passwd` file contains account information, and
    looks like this:


    ```

    smithj:x:561:561:Joe Smith:/home/smithj:/bin/bash

    ```


    Each field in a passwd entry is separated with ":" colon characters, and are as
    follows:'
