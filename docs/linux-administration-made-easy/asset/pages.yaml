  md: '# 9.3. Starting and Stopping Processes


    The Red Hat distribution of Linux provides a slightly more organized way of managing
    processes. Instead of hunting and killing them by finding their process id in
    the process table, Red Hat provides a collection of scripts in the `/etc/rc.d/init.d`
    directory which will allow you to start and stop processes as desired.


    For example, to shut down the `httpd` (Apache web server), simply run the httpd
    script, as follows:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    In the same manner, you can use the "start" option to start a service. Or, if
    you have made changes to a configuration file and wish to restart a service so
    those changes are recognized, you can use the "restart" option.


    > (Note: Oddly enough, the "restart" option does not seem to be supported for
    some services.)


    # 9.4. Automating Tasks with Cron and Crontab files


    Like most Linux users, you may find it necessary to schedule repetitive tasks
    to be run at a certain time. Such tasks can occur as frequently as once a minute,
    to as infrequently as once a year. This scheduling can be done by using the "cron"
    facilities.


    The cron facilities as implemented in Linux are fairly similar to those available
    in other Unix implementations. However, Red Hat has adopted a slightly different
    way of scheduling tasks than is usually done in other distributions of Linux.
    Just as in other distributions, scheduling information is placed in the system
    "crontab" file (locating in the "/etc/" directory), using the following format:'
  merge: -1
