  md: '# # Chapter 8. Backup and Restore Procedures


    Performing regular backups should be considered one of a responsible system administrator''s
    top priorities. Although Linux is an extremely reliable operating system, failures
    can do, and probably will occur. They may be caused by hardware failure, power
    outages, or other unforeseen problems.


    More likely will be those problems caused by human error, resulting in undesired
    changes to, even deletions of, crucial files. If you are hosting on your system,
    you will most certainly be requested to restore an inadvertently deleted file
    or two.


    If you perform regular backups, preferably on a daily basis (at least for user
    files which are updated often), you will hopefully reduce the possibility of it,
    and increase your recovery from, such file loss.


    The safest method of doing backups is to record them on separate media, such as
    tape, removable drive, writeable CD, etc., and then store your backup sets in
    a location separate from your Linux system. Sometimes this may not be practical—perhaps
    you do not have a fire-proof vault in which you can store your backup tapes! Or
    perhaps you do not have access to such an external backup system in the first
    place. Nonetheless, backups can still be performed, albeit on a limited basis.


    At my place of employment, I perform backups on several Linux servers. Depending
    on the situation, some of these backup sets are written to tapes, others are written
    to a separate server over the network, for example, in the "archive/ file system)
    by an automatic cron job (perhaps the server is in a remote location, for which
    a daily visit to perform a tape backup is impractical or impossible).


    At home, I do not have an external backup system, nor do I have massive of available
    disk space to write a backup image. Therefore, I instead back up only my user
    files on "/home/" as well as some customized configuration files in "/etc/", writing
    the backup set to a separate disk partition.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# 8.1. Server Backup Procedures


    There are a variety of methods of performing backups with Linux. These include
    command-line tools included with every Linux distribution, such as “dd”, “dump”,
    “cpio”, as well as “tar”. Also available are text-based utilities such as “Amanda”
    and “Taper”, which is designed to add a more user-friendly interface to the backup
    and restore procedures. There are GUI-based utilities as well, such as “BRU” and
    “PerfectBackup+”. Finally, commercial backup utilities are also available, such
    as. Any of these backup solutions can provide protection for your valuable data.


    A brief listing of some of the tools available, including where they can be obtained,
    can be on the “Linux Applications and Utilities Page”, at http://www.xnet.com/~blatura/linapp2.html#back
    When deciding on a backup solution, you will need to consider the following factors:


    +   - Portability - Is backup portability (ie. the ability to backup on one Linux
    distribution or implementation of Unix and restore to another; for example from
    Solaris to Red Hat Linux) important to you? If so, you’ll probably want to choose
    one of the command-line tools (e.g. “dd”, “dump”, “cpio”, or “tar”), because you
    can be reasonably sure that such tools will be available on any *nix system.


    +   - Unattended or automated backups - Is the ability to automate backups so
    that they can be performed at regular intervals without human intervention important
    to you? If so, you will need to choose both a tool and a backup medium which will
    support such a backup scheme.


    +   - User-friendliness - Is a user-friendly interface important to you? If so,
    you will likely want to choose a tool which provides a text- or GUI-based interface.
    The commercial utilities may provide the easiest interfaces as well as added technical
    support.


    +   - Remote backups - Is the ability to start backups and restores from a remote
    machine important to you? If so, you’ll probably want to choose one of the command-line
    tools or text-based utilities instead of the GUI-based utilities (unless you have
    a reasonably fast network connection and the ability to run X sessions).


    +   - Network backups - Is performing backups and restores to and from networked
    hosts important to you? If so, you’ll probably want to choose one of several'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'command-line utilities (such as “tar”) which support network access to backup
    devices, or a specialized utility such as “Amanda” or one of several commercial
    utilities.


    +   - Media types - Backups are stored on a variety of medium, such as a hard
    drive, ZIP drives, or rewritable CDs. Consider cost vs. reliability, storage capacity,
    and transfer speed.


    > >: When backing up your file systems, do not include the "/proc" pseudo-filesystem!
    The files in /proc are not actually files but are simply file-like links which
    describe and point to kernel data structures. Backing up a file like “proc/core”,
    which is actually a pseudo-file contains the contents of your entire memory, seems
    like a pretty waste of tape to me! :-) You will also likely want to avoid backing
    up the /mnt/ file system, unless you have the peculiar desire to back up the files
    from your CD-ROM device, floppy drive, network file shares, or other devices.


    Obviously, the procedures for performing a backup and restore will differ depending
    on your choice of backup solution. However, in this section, I will discuss methods
    for performing backups with the two tools I use most: “tar” (whose name stands
    for “Tape ARchiver”), which is a command-line tool largely portable across *nix
    systems; as well as *KDat, a GUI-based backup utility which comes included with
    the KDE packages (see Section 5.6 for more information on KDE).


    Finally, I should add that, depending on your choice of backup solution, even
    if the tool doesn’t have the ability built-in to schedule automated or unattended
    backups, you may be able to automate such backups by using the cron facilities.
    See Section 9.4 for details on using cron and on creating crontab schedule files.


    # ## 8.1.1. Backing up with “tar”


    If you decide to use “tar” as your backup solution, you should probably take the
    time to get to know the various command-line options that are available; type
    “man tar” for a comprehensive list. You will also need to know how to access the
    appropriate backup'
