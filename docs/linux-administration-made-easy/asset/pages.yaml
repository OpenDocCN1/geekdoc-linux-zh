    # with Netatalk


    Linux can also provide Appleshare services (eg. Macintosh-style network file &
    printer sharing), using the Netatalk package. This section will describe how to
    configure shares, and how to access them from client machines.


    In order to use Netatalk, you will need to have Appletalk networking support in
    your Linux kernel. Stock kernels from Red Hat usually already include this support
    as a module, or you can compile your own custom kernel with such support.


    ![](img/846ec8d157c5d667ec22f4e21c29db61_68_0.png)


    Note: Make sure Appletalk support is compiled as a module and not included as
    part of the kernel (see Section 10.4 for details on how to upgrade or customize
    the Linux kernel). Otherwise you will have difficulties when stopping and then
    restarting the Netatalk daemon.


    Once you have ensured your kernel is capable of supporting Appletalk, you will
    need to install the Netatalk package. Because Netatalk is not included with the
    Red Hat distribution, you will need to download and install a copy. The Netatalk
    package can be found on Red Hat’s “contrib” site, at ftp://ftp.redhat.com/contrib/libc6/i386.


    After Netatalk has been installed, you will need to modify one or more configuration
    files in "/etc/stalk/". Most of the files contain sample configuration examples
    and therefore are at least somewhat self-documenting. The files are:


    ```

    config

    ```


    This file contains configuration information for tuning your Netatalk daemon.
    This information is specified in environment variables, and this file is “sourced”
    (ie. read) by the Netatalk start up script before the service is started. You
    can specify the number of simultaneous connections, whether or not guest logins
    are allowed, etc. You will almost certainly want to modify this file according
    to your needs.


    ```

    atalk.conf

    ```


