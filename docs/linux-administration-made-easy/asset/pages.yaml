  md: '# Chapter 12. Strategies for Keeping a Secure Server


    +   Restrict access to external services: Next, you should edit the "/etc/hosts.allow"
    as well as the "/etc/hosts.deny" file to restrict access to services to external
    hosts. Here is an example of how to restrict telnet and ftp access. First, the
    "/etc/hosts.allow" file:


    ```

    # hosts.allow


    inelnetd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    in.ftpd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    ```


    The above allows all hosts in the IP class C''s 123.12.41* and 126.27.18* as well
    as any host within the mydomain.name and another.name domains to make telnet and
    ftp connections.


    Next, the "/etc/hosts.deny" file:


    ```

    # hosts.deny

    inelnetd: ALL

    in.ftpd: ALL

    ```


    +   Turn off and uninstall unused services: Edit your "/etc/inetd.conf" file,
    and disable (ie. comment out using a "#" character) any services that are not
    needed (if you are using ssh as recommended above, you might wish to disable the
    "telnet" service). After you have done so, as root type "/etc/rc.d/init.d/inet
    restart" to restart the inetd daemon with the changes.


    +   Install a security detection system: Consider installing security programs
    such as "Tripwire" (see http://www.tripwiresecurity.com/) which can detect intrusions,
    and "Abacus Sentry" (see http://www.psionic.com/abacus/) which can help prevent
    them.


    +   Due diligence: Keeping your os on your system, performing random security
    audits (which can be as simple as checking for suspicious entries in the password
    files, examining your process list, and checking your log files for suspicious
    entries) can go a long way towards keeping a secure system. In addition, report
    any break-in attempts to the appropriate authorities – it may be a hassle to do
    this, particularly if your system sees several of these attacks in a given week,
    but such reports ensures


