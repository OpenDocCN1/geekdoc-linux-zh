    ## 7.7. 使用 Linuxconf 进行 A 到 Z 配置


    有一个非常出色的工具“linuxconf”，它可以让许多配置问题的处理变得更简单。Linuxconf 运行在任何可用的显示环境环境中——你可以从控制台运行它，也可以通过
    telnet 会话运行，或者作为 X 环境下的 GUI 工具运行，它将以适当的方式自动启动。


    如果你需要调整系统时间、修改网络设置、设置文件系统、进行用户管理，以及执行任何其他管理和配置任务，你应该尝试一下这个工具。我唯一需要提醒的是，在编写本文时，基于
    GUI 的工具还有一些“漏洞”，有时可能对鼠标点击没有响应。然而，这个工具是一个很有前景的进展中工作，未来的版本应该变得非常之用。


    ## 第 8 章 备份与恢复流程


    定期执行备份被认为是负责任的系统管理员的首要任务之一。尽管 Linux 是一个极其可靠的操作系统，但故障仍然发生，而且可能将会发生。它们可能是由硬件故障、停电或其他不可见的问题引起的。


    更有可能是由人为错误引起的问题，导致对关键文件发生非预期的更改，甚至是删除。如果你在你的系统上托管服务，你肯定会被要求恢复一两个由于不小心删除的文件。


    如果你执行定期备份，最好是每天一次（至少对于经常更新的用户文件），你可能希望这样可以减少这种情况发生的可能性，并增加你从此类文件丢失中恢复的能力。


    进行备份最安全的方法是将它们记录在单独的介质上，例如磁带、移动式驱动器、可写 CD 等，然后将你的备份集存储在与 Linux 系统不同的位置。有时这可能并不切实际——也许你没有一个可以存放备份带的防火金库！或者你根本就无法访问此类外部备份系统。尽管如此，仍然可以进行备份，尽管规模是有限的。


    在我的工作单位，我对几台 Linux 服务器进行备份。根据情况，其中一些备份集被写入磁带，另一些则通过网络写入单独的服务器，例如在“archive/”文件系统中，通过自动的
    cron 任务执行（可能服务器位于远程位置，每天去一次进行磁带备份是不切实际或不可能的）。


    在家里，我没有外部备份系统，也没有大量的可用磁盘空间来写入备份镜像。因此，我仅备份 "/home/” 下的用户文件以及 "/etc/” 中的一些自定义配置文件，并将备份集写入单独的磁盘分区。


    ## 8.1. 服务器备份流程


    使用 Linux 执行备份有多种方法。这些方法包括每个 Linux 发行版都附带的命令行工具，如“dd”、“dump”、“cpio”以及“tar”。还有可用的基于文本的实用程序，如“Amanda”和“Taper”，后者旨在为备份和恢复流程添加更用户友好的界面。此外也有基于
    GUI 的工具，例如“BRU”和“PerfectBackup+”。最后，还有商业备份工具可用。任何这些备份解决方案都能为你的贵贵数据提供保护。


    一些可用工具的简要列表（包括在哪里获取）可以在“Linux 应用与工具页面”找到：http://www.xnet.com/~blatura/linapp2.html#back。在决定备份解决方案时，你需要考虑以下因素：


    - 可移植性 - 备份的可移植性（即在一个 Linux 发行版上备份并在另一个上恢复，例如从 Solaris 到 Red Hat Linux）对你重要吗？如果是，你可能需要选择命令行工具（例如“dd”、“dump”、“cpio”或“tar”），因为你可以确信这些工具在任何
    *nix 系统上都是用的。

    - 无值守或自动备份 - 自动化备份以便定期执行而无需人工干预对你重要吗？如果是，你需要选择支持这种备份方案的工具和备份介质。

    - 用户友好性 - 用户友好的界面对你重要吗？如果是，你可能希望选择一个提供文本或 GUI 界面的工具。商业工具可能还提供更简单的界面以及额外的的技术支持。

    - 远程备份 - 从远程机器启动备份和恢复对你重要吗？如果是，你可能希望选择命令行工具或基于文本的实用程序，而不是 GUI 工具（除非你有足够快的网络连接和运行
    X 会话的能力）。

    - 网络备份 - 在网络主机之间执行备份和恢复对你重要吗？如果是，你可能希望选择某些支持网络访问备份设备的命令行工具（如“tar”），或专门的工具（如“Amanda”）或某些商业工具。

    - 介质类型 - 备份存储在各种介质上，如硬盘、如硬盘、可写 CD 等。在决定备份解决方案时，你需要考虑以下因素：成本、可靠性、容量和速度。


    ## 8.1.1. 使用 tar 备份


    如果你决定使用“tar”作为你的备份解决方案，你可能应该花时间了解各种选项；输入“man tar”。


    以下命令将对你的整个系统进行备份，但除了 "/proc/" 文件系统、"/mnt/" 下挂载的文件以及大型缓存文件（这些没有必要备份）：


    ```

    tar -zcpvf /archive/full-backup `date ''+%d-%B-%Y''`.tar.gz -directory / -exclude=mnt
    -exclude=proc -exclude=var/spool

    ```


