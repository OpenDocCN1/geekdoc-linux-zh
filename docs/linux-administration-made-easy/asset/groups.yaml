    # 第一章 序言


    ## 1.1. 致谢


    我要感谢 Linux 社区；特别是那些在 USENET 和邮件列表中活跃的成员，他们提供了许多关于如何最佳使用 Linux 的有用提示、答案和建议。你们的贡献造福了我们所有人。


    本文档使用 DocBook SGML 格式编写，然后使用 SGMLTools 2.x 渲染为多种文档格式，包括 HTML、postscript、富文本和 PDF。有关
