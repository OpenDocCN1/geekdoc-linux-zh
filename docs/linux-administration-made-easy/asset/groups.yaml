    ## Chapter 5. Configuring the X Window System


    The X Window System, aka “X” (commonly and incorrectly known by many as “X-Windows”)
    is a GUI which sits on top of Linux. Unlike Microsoft Windows, the X Window System
    can look and operate in a large variety of ways. It can operate primitively or
    very advanced, look beautiful or ugly, be sleek and fast or slow (each of which
    are subjective qualities which cause as many arguments among users “Linux vs.
    Microsoft NT” debate seems to).


    Getting X working properly can range from simple to hair-pulling complicated!
    It is a common complaint among users who are new to Linux, and I''ve fought with
    configuration settings countless times myself, I''m completely empathic about
    this. Fortunately, such configuration is becoming easier and more automated in
    the newer distributions of Linux. In fact, if you are using Red Hat 6.1 you will
    probably not have to worry about this issue.


    Although in a majority of cases X can be configured automatically, there are exceptions;
    I would identify the exceptions here.


    ## 5.2. Using the X Desktop Manager


    If you wish, you may use the X Desktop Manager ("xdm") to start up the X Window
    System automatically at boot time. This allows your Linux system to always run
    under X (although you can switch to the regular consoles with <Ctrl><Alt>-<F1>,
    and then back to the GUI with <Alt><F7> as needed).


    To enable xdm, simply edit the /etc/initabb file and change the line that reads


    ```

    id:5:initdefault:

    ```


    The above change will switch Linux to run level 5 upon system boot up; this run,
    by default, will start xdm.

