    ## Chapter 6. General System Administration Issues


    ## 6.1. Root Account


    The “root” account is the most privileged account on a Unix system. This account
    gives you the ability to carry out all facets of system administration, including
    adding accounts, changing user passwords, examining log files, installing software,
    etc.


    When using this account it is crucial to be as careful as possible. The “root”
    account has no security restrictions imposed upon it. This means it is easy to
    perform administrative duties without hassle. However, the system assumes you
    know what you are doing, and will do exactly what you request – no questions asked.
    Therefore it is easy, with a mistyped command, to wipe out crucial files.


    When you are signed in as acting as “root”, the shell prompt displays ‘#’ as the
    last character (if you are using bash). This is to serve as a warning to you of
    the absolute power of this account.


    The rule of thumb is, never sign in as “root” unless absolutely necessary. While
    “root” type commands carefully and double-check them before pressing return. Sign
    off the “root” account as soon as you have accomplished the task you signed for.


    Finally, (as with any account but especially important with this one), keep the
    password secure!


    ## 6.2. Creating User Accounts


    > (WARNING: SLACKWARE-CENTRIC, NEEDS UPDATE FOR RED HAT)


    ## Chapter 6. General System Administration Issues


    This section assumes you are using the Shadow password suite on your Linux system.
    If you are not, you should consider doing so, as it helps to tighten security
    somewhat. The Shadow suite is fairly easy to install and will automatically convert
    your non-shadow password file over to the new shadow format.


    There are two steps to creating a new user account. The first is to actually create
    the account itself, second is to provide an alias to their e-mail (at my place
    of employment, we follow the convention of “Firstname.Lastname@our.domain.name”).


    To create the account, decide on the username you are going to assign to the user.
    The username is at most 8 characters long, and wherever possible you should choose
    their last name, or name first and initial if a user account already exists (the
    aduser script will detect and prevent you from adding duplicate accounts).


    You will be prompted to enter other information: full name of user, user group
    (usually the default), a user id # (automatically assigned), home directory (automatically
    assigned), a user, some password expiration values, and finally the desired password
    (which won’t echo to the screen; you should have the user password between 6 to
    8 characters in length for security reasons).


    Please note that everything should be entered in lowercase, except for the full
    name of the user which can be entered in a “pleasing format” (eg. Joe Smith) and
    the password. Case is sensitive, so inform your user(s) they must use identical
    case when entering their username and password.


    Here is a sample session where we will add a user named Joe Smith:


    ```

    mail:-# /sbin/adduser

    User to add (^C quit): smith

    That name is in use, choose another.

    User to add (^C quit): smithj

    Editing information for new user [smith]

    Full Name: Joe Smith

    GID [100]:nChecking for an available UID after 500

    First unused uid is 859

    UID [859]:nHome Directory [/home/smithj]:

    ```


    ```

    Shell [/bin/bash]:nMin. Password Change Days [0]:nMax. Password Change Days [30]:
    90

    Password Warning Days [15]:nDays after Password Expiry for Account Locking [10]:
    0

    Password [smith]: FL15339

    Retype:</ FL15339

    Sorry, they do not match.

    Password:</ FL15339

    Retype:</ FL15339

    ```


    Information for new user [smith]:

    Name: Joe Smith

    Home directory: /home/smithj

    Shell: /bin/bash

    Password: <hidden>

    Uid: 859 Gid: 100

    Min pass: 0 max pass: 99999

    Warn pass: 7 Lock account: 0

    public home Directory: no

    Type ''y'' if this is correct, ''q'' to cancel and quit the program,nor or the
    letter of the item you wish to change: Y


    The next step is to create the alias for the person''s e-mail account. This gives
    people the choice of using their account name for their e-mail address, or their
    full name (First.Last combination) to make it "easier" for the outside world to
    guess their e-mail address when trying to contact them for the first time.


    To add the e-mail alias, edit the "/etc/aliases" file as follows:


    ```

    mail pico -w /etc/aliases

    ```


    Add the new alias at the bottom of the file. The format for an alias is:


    ```

    First.Lastname:username

    ```


    You should ask the user what preference they have for this (eg.g. Joseph.Smith
    or Joe.Smith). For our new Joe Smith, the entry would be as follows:


    ## 6.3. Changing User Passwords


    To change a password on behalf of a user, first sign on “su” to the “root” account.
    Then type `passwd user` (where user is the username you are changing). The system
    will prompt you to enter a new password. Passwords do not echo to the screen.


    You can also change your own password, by typing “passwd” (without specifying
    a username).


    ## 6.4. Disabling User Accounts


    To disable user account, edit, as root, the “shadow” file (assuming you’re using
    shadow; if not, edit the “passwd” file instead), and replace the password field
    with a “*”. All Unix passwords, regardless of length (up to 8 characters), are
    stored as encrypted strings. One solution to this which seems to be popular among
    administrators is to simply prefix the "*" character in front of the encrypted
    password to disable the account, and simply removing the asterisk to enable it.


    ```

    Joe.Smith:smith

    ```


    When finished adding the alias, press <Ctrl>-X> and save the file. Then, type
    “newaliases” to update the aliases database.


    At this point the user account has been created and is ready for use. It is a
    good idea to remind the user that their username and password must be entered
    in lowercase, and what their e-mail address would be (eg. “Joe.Smith@mydomain.name”).


    ## 6.5. Removing User Accounts


    On occasion, you may wish to remove a user''s access from your server altogether.


    If you are a Red Hat user, the easiest way to remove an unneeded user account
    is with the "userdel" command, which must be typed as "root". An example follows:


    ```

    /usr/sbin/userdel baduser

    ```


    The above command will remove the entry matching username "baduser" from the "/etc/passwd"
    file, and if you are using the Shadow password format (which you should be; see
    6.6 for details), "/etc/shadow".


    > Note: The "/etc/group" is not modified, to avoid removing a group that other
    user(s) may also belong to. This isn''t much of a big deal, but if this bothers
    the user, you can edit the group file and remove the entry manually.


    Should you wish to remove the user''s home directory as well, add "-r" option
    to the "userdel" command. For example:


    ```

    /usr/sbin/userdel -r baduser

    ```


    I recommend not removing an account right away, but first simply disable it, especially
    if you are working with a corporate server with lots of users. After all, the
    former user may one day require the use of his or her account again, or may request
    a file or two which was stored in their home directory. Perhaps a new user (such
    as an employee

