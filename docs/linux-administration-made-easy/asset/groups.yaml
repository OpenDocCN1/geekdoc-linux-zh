    \ browse lists and can be accessed without a password by any client.\n[hp_laser]\n\
    \n# The comment that appears in the browse-list.\ncomment = Main office printer\
    \ (HPing)\n\n# The username that share is accessed as (guest means all users).\n\
    user = guest\n\n# All generated print files will first be created in the /tmp\n\
    path = /tmp\n\n# Do not allow file creation except through print spooling.\nwritable\
    \ = no\n\n# Set permissions accordingly -\n# root access to print jobs only.\n\
    create mode = 0700\n\n# If this is enabled a password is not required to access\
