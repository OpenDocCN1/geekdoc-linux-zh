    比 fdisk 好。事实上，如果你使用 fdisk 对驱动器进行分区，最后仍然会看到磁盘界面来指定你的挂载点。尽管如此，作为一名前 Slackware 用户，我个人一直习惯使用
    fdisk —— 我猜是习惯成自然吧！:-)


    下一节将详细介绍如何以及为什么你应该设置分区信息。


    ## 4.3. 分区硬盘（硬盘）


    那么，到底要不要分区呢？嗯，虽然你可以在单分区系统上运行一个功能完的 Linux 系统，而且这样配置起来其实要简单一些，但将你的一个或多个存储设备划分为多个分区会有许多益处。


    虽然 Linux 在只定义了一个大分区的磁盘上运行良好良好这是事实，但将你的磁盘至少划分为四个主要文件系统（root、usr、home 和 swap）的分区有几个优点。这些优点包括：


    首先，可以缩短执行文件系统检查所需的时间（无论启动时还是手动执行 fsck 时），因为这些检查可以并行进行。（顺便说一下，**永远不要**在挂载的文件系统上运行
    fsck！！！你几乎肯定会对发生的事情感到后悔。唯一的例外是该文件系统是以只读方式挂载的，在这种情况下是安全的）。此外，在具有多个分区的系统上进行文件系统检查要容易得多。例如，如果我知道我的
    /home 分区出了问题，我只需要卸载它，执行文件系统检查，然后重新挂载该配对的文件系统（而不是使用救援盘以单用户模式启动系统并进行修复）。


    其次，有了多个分区，你可以根据意愿将你的分区中的一个或多个分区挂载为只读。例如，如果你决定 /usr 中的所有内容都不会被 root 动，你就可以将 /usr
    分区挂载为只读。


    最后，分区提供的最重要的益处是保护你的文件系统。如果某个文件系统发生了什么故障（无论是由于用户错误还是系统故障），在分了区的系统中，你可能只会丢失单个文件系统上的文件。在未分区的系统中，你可能会丢失所有文件系统的文件。


    这个小事实可以是一个巨大的优势。例如，如果你的 root 分区损坏导致无法启动，你基本上可以从救援盘启动，设置你的 root 分区，并将你能复制的内容（或从备份恢复；详见第
    8 章关于如何备份和恢复文件的细节）到另一个分区（如 home），然后再次使用紧急启动盘重启，输入 `mount root=/dev/hda3`（假设包含你
    root 文件系统的分区在 hda 的第三个分区上）并启动功能正常的 Linux 系统。然后你就可以对未卸载的损坏的 root 分区运行 fsck 了。


    我曾有过文件系统灾难的个人经历，我非常感激由于使用了多个分区将损害限制在了局部范围内。


    最后，由于 Linux 允许你安装其他操作系统（如 Windows 95/98/NT、BeOS 等）并对你的系统进行双系统（或三系统、……）启动，你可能希望设置额外的分区来利用这一点。通常，你可能为每个操作系统操作系统设置一个分区。Linux
    包含一个不错的启动加载程序（在基于 Intel 的系统上称为 SILO，尽管 Alpha 上有类似的产物称为 MILO，在 Sparc 上也称为 SILO），它允许你在开机时指定想要启动的操作系统，并默认在超时后启动你最喜欢的操作系统（可能是
    Linux，对吧？）。


    你应该根据自己的需求对磁盘（或磁盘）进行分区。我在 Intel、Alpha 和 Sparc 平台上的经验是，对于一个功能相当丰富的系统，执行相当多的任务（作为家中的桌面系统或工作中的
    Internet 服务器），我发现以下空间近似值对于确定分区大小非常有效。


    给定：


    一个为 X Mb/Gb 的磁盘（例如 2 Gb）

    （或总计 X Mb/Gb 的多个磁盘）


    计算：


    | 分区 | 建议大小 |

    | :--- | :--- |

    | (swap) | 约内存 大小（例如 64 Mb） |

    | /root | 约可用空间的 10%（例如 200 Mb） |

    | /home | 约可用空间的 20%（例如 400 Mb） |

    | /usr | 剩余空间（例如 72 Mb） |

    | /var | （可选 - 下文） |

    | /boot | （可选 - 下文） |

    | /archive | （可选 - 下文） |


    当然，这些数值仅为指南。显然，你需要根据你使用的 Linux 系统来调整这些百分比。如果你打算运行大量的应用程序，如 WordPerfect 或 Netscape，或者可能添加日语支持，你可能需要多一点
    /usr 空间。


    如果你的 /home 看起来有足够的空间，如果你的用户没有设置严格配额，或者没有提供 shell 账户和网页等，你可能需要降低 /home 空间。


