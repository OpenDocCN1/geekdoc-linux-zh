    as they increase. This can include moving to an SMP (Symmetric Multi Processing)
    configuration for greater processing needs, RAID levels 0 through 5 (either in
    software or hardware driven modes), etc.


    On occasion, you may feel that your Linux server has outgrown the hardware it
    is running on, perform a major Linux version upgrade, or perhaps move to a different
    distribution of Linux. There are, of course, two ways of doing this. Either you
    will be leaving your server on existing or upgraded hardware (in which case you
    simply shut devices, back up your data, perform the required modifications, and
    then restore your data if needed), or in the more radical case, migrate your server
    to new hardware.


    This section will concentrate on the latter situation, where you will be actually
    migrating your various services from the old server to a new one. There are, of
    course, several migration strategies, however this section will attempt to provide
    some rough strategy

