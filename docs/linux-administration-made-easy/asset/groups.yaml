    \ the CD-ROM device.\n[cdrom]\n\ncomment = Shared CD-ROM drive on Linux\nuser\
    \ = guest\npath = /cdrom\nwritable = no\n\n```\nread only = true\nbrowseable =\
    \ yes\npublic = yes\nguest ok = yes\n```\n\n> Tip: Recent versions of Samba, from\
    \ 2.0 onwards, provide a very slick web-based configuration utility called 'swat',\
