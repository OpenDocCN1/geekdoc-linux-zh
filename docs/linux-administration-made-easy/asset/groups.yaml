    +   * boot/ (optional) - In some circumstances (as a system set up in a software
    RAID configuration) it may be necessary to have a separate partition from which
    to boot the Linux system. This partition would allow booting and then loading
    of whatever drivers are required to read the other file systems. The size of this
    partition can be as small as a couple Mb; I recommend approximately 10 Mb (which
    should give you plenty of room to store the kernel, initial RAMdisk image, and
    perhaps a backup kernel or two). The partition type should be left as the default
    of 83 (Linux native).


    +   * archive/ (optional) - If you have any extra space lying around, perhaps
    you would benefit from a partition for a directory, called, /archive. You can
    then use the /archive directory to store backup material, or infrequently accessed
    files, file services, or whatever else you find a use for. The partition type
    can be left as the default of 83 (Linux native), or if you want to access it from
    both Linux as well as from other operating system, you could change it to a different
    ID, such as 6 (DOS 16-bit >=32M).


    As drive-points are added, further partitions can be added to the new drives,
    mounted at various mount-points out of space. As means a Linux system never needs
    to worry about running out of space. As an example, if in the future it is clear
    that sda6 is starting to get filled up, we could add another drive, a nicely sized
    partition with a mount-point at /usr/local – and then transfer all the information
    from /usr/local over to the new drive. No system or application component would
    “break” because Linux would see /usr/local no matter where it was located.


