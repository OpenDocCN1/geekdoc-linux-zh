    \ of included applications, and sell them as distributions. Some common and popular\
    \ distributions are Slackware, Red Hat, SuSE, and Debian! The great thing is,\
    \ you have access to source code which means you can customize the operating systems\
    \ to your own needs, not those of the “target market” of most commercial vendors.\n\
    \nLinux can and should be considered a full-blown implementation of unix. However,\
    \ it can not be called “Unix”; not because of incompatibilities or lack of functionality,\
    \ because the word “Unix” is a registered trademark by AT&T, and the use of the\
    \ word is only allowable by license agreement.\n\nLinux is ever as supported,\
    \ as reliable, and as viable as any other operating system solution (well, in\
    \ my opinion, quite a bit more so!). However, due to its origin, the philosophy\
    \ behind it, and the lack of a multi-million dollar marketing campaign promoting\
