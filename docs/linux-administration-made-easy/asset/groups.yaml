    which will give you larger, more readable fonts.


    Finally, exit X (if you haven''t done so already), and restart your xfs server
    as follows:

    /etc/rc/init.d/xfs restart


    Finally, restart X and enjoy your glorious new fonts!


    For more detailed information on improving font support under X, there is a very
    excellent resource called the "XFree86 Font Deugification Mini HOW-TO" at http://www.frii.com/~meldroc/Font-Deugification.html.


    ## 5.4. Choosing a Window Manager for X


    Now, you should decide on a window manager. The X Window System is simply the
    environment which allows graphics to be displayed on your system''s hardware;
    the window manager is responsible for how X looks and how it interacts with you
    and your applications.


    The Red Hat distribution of Linux contains several window managers, including
    fwwm, olvm, twm, AfterStep, and others. The default one you will probably see
    when starting up X for the first time is fwm95, a Win95-like environment.


    Personally, I find the usual offerings differ from my own tasks, and I recommend
    either GNOME or KDE (or both!), whose installation are covered in the next two
    sections.


    ## 5.5. GNOME Network Installation and Configuration


    The GNU Network Object Environment (GNOME) is a windowing environment that enhances
    your X window environment. It is full-featured, including a large selection of
    applications you may find useful. However, at the time of writing, GNOME still
    has a few minor bugs, meaning you have to put up with errant behaviour at times.
    However, it is fairly stable and definitely usable!


    If you''re using Red Hat 6.1, the latest version of GNOME (at least, the latest
    at the time of this writing!) is included with the distribution. Otherwise, you
    will need to download the latest RPM distribution of the package. At the time
    of writing, the RPM files for Red Hat 6.0 i386 systems can be found at http://ftp.gnome.org/pub/GNOME/RHAD/redhat-6.0/i386/
    (or from a mirror site).


    > Note: If you do not have any TrueType fonts available to you, you can download
    them directly from Microsoft at http://www.microsoft.com/typography/fontpack/default.htm.


    To make use of them, from within your new "ttfonts" directory, type the following
    (as root):


    ```

    ttmkfdir -o fonts.scale

    mkfontdir

    ```


    Next, edit the "/etc/X11/fs/config" file, add your new font directory to the list
    of existing directories. Also, change the default-point-size from 120 to 140,
    which will give you larger, more readable fonts.


    Finally, exit X (if you haven''t done so already), and restart your xfs server
    as follows:

    /etc/rc/init.d/xfs restart


    Finally, restart X and enjoy your glorious new fonts!


    For more detailed information on improving font support under X, there is a very
    excellent resource called the "XFree86 Font Deugification Mini HOW-TO" at http://www.frii.com/~meldroc/Font-Deugification.html.


    ## 5.6. KDE Installation and Configuration


    The K Desktop Package (KDE) is another popular window manager that is somewhat
    mature than GNOME is at the time of writing. However, it seems to require a bit
    memory resources than GNOME, so take into consideration the amount of RAM you
    have (if you have less than 64 Mb and 128 Mb of swap, you might be better using
    GNOME).


    The first step for installing KDE is to download the latest RPM distribution of
    the package. To do so, locate an FTP mirror at http://www.kde.org/mirrors.html.
    Choose a mirror that is close to your geographic location, make sure whichever
    one you choose is updated often (which can be determined by looking at the list
    of mirrors).


    When you have found a suitable mirror, download all the RPM files applicable to
    your version of Red Hat and your platform. For example, if you are using Red Hat
    5.2 (or above) on an Intel platform, you will likely want to download the package
    from the `/pub/mirrors/kde/stable/latest/distribution/rpm/RedHat-5.2/i386/` directory
    over the FTP mirror


    After you have all the necessary files, the KDE package can be installed with
    the following simple commands, typed as “root” (make sure you are in the directory
    where your KDE rpm files are:


    ```

    rpm -Uvh *.rpm

    install-kde-1.1-base

    ```


    The above command will install the Qt libraries first, and then install the KDE
    base package. Once this is done, you should log off and log back in (or if you
    are “su as root, just exit and “su” again) so that your path environment is set
    appropriately, then type:


    ```

    install-kde-1.1-apps

    ```


    The above command will install the applications programs.

    This installation procedure is discussed in more detail in the file “readme-redhat-rpms.txt”
    that should have been included with the KDE files you downloaded.


    If all goes well, KDE has been installed without any error messages, you may,
    if you wish, configure KDE to be the default window manager for any of your users
    (the one they will see immediately after typing “startx”), by typing the following,
    again as root:


    ```

    /opt/kde/bin/usekde userid

    ```


    (Make sure you replace userid with an actual user id!)


