    \ the then-new chip, and began to write a small barebones kernel.\n\nEventually\
    \ he announced his little project in the USENET group comp.os.minix, asking for\
    \ interested parties to take a look and contribute to the project. The results\
    \ have been phenomenal! \n\nThe interesting thing about Linux is, it is completely\
    \ free! Linux decided to adopt the GNU GPL license of the Free Software Foundation,\
    \ which means that the code is protected by a copyright – but protected in that\
    \ it must always be available to others.\n\nFree means – you can get it for free,\
    \ use it for free, and you are even free to sell it for a profit (this isn’t as\
