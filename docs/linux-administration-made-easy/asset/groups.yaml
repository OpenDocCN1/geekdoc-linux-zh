    The next section will detail how and why you should set up your partition information.


    ## 4.3. Partitioning Hard Drive(s)


    Well partition, anyway? Well, although it is possible to get a perfectly functioning

    Linux system running on a single-partition system, and, in fact, is a bit easier
    to

    configure this way, there are a number of benefits from partitioning one or more
    of your

    storage devices into multiple partitions.


    While it is true that Linux will operate just fine on a disk with only one large
    partition

    defined, there are several advantages to partitioning your disk for at least the
    four main

    file systems (root, usr, home, and swap). These include:


    First, may reduce the time required to perform file system checks (both upon bootup

    and when doing a manual fsck), because these checks can be done in parallel. (By

    theway, NEVER run an fsck on a mounted file system!!! You will almost certainly
    regret

    what happens to it. The exception to this is if the file system is mounted read-only,
    in

    which case it is safe to do so). Also, file system checks are a lot easier to
    do on a

    system with multiple partitions. For example, if I knew my /home partition had

    problems, I could simply unmount it, perform a file system check, and then remount
    the

    paired file system (as opposed to booting my system with a rescue diskette into

    single-user mode and doing the repairs).


    Second, with multiple partitions, you can, if you wish, mount one or more of your

    partitions as read-only. For example, if you decide that everything in /usr will
    not

    touched by root, you can mount the /usr partition as read-only.


    Finally, the most important benefit that partitioning provides protection of your
    file

    systems. If something should happen to a file system (either through user error
    or

    system failure), on a partitioned system you would probably only lose files on
    a single

    file system. On a non-partitioned system, you would probably lose them on all
    file

    systems.


    This little fact can be a big plus. For example, if your root partition is corrupted
    you can''t boot, you can basically boot from the rescue diskette, set your root
    partition, and copy what you can (or restore from backup; see Chapter 8 for details
    on how files can be backed up and restored), to another partition such as home,
    and reboot again using the emergency boot disk, typing `mount root=/dev/hda3`
    (assuming the partition containing your root file system is on the third partition
    of hda) and boot your functional Linux boot. Then you can run an fsck on your
    unmounted corrupted root partition.


    I have had personal experience in file system catastrophes, and I was very grateful
    for having the damage limited to the use of multiple partitions.


    Finally, since Linux allows you to set up other operating system(s) (such as Windows
    95/98/NT, BeOS, or what-have-you), and dual-(or triple-, ...) boot your system,
    you might wish to set up additional partitions to take advantage of this. Typically,
    you would want to set up at least one partition for each operating system. Linux
    includes a decent boot loader (called SILO on Intel-based systems, although much
    the same thing is available as MILO on Alpha, and SILO on Sparc) which allows
    you to specify which operating system you want to boot at power, with a time-out
    default boot of your favorite operating system (probably Linux, right?)


    You should partition a disk (or disks) according to your needs. In my experience
    on Intel, Alpha, and Sparc platforms, for a fairly loaded system (feature-wise),
    doing a fair amount of tasks (as a desktop system at home, or as an Internet server
    at work), I have found the following approximation of space works pretty effectively
    for determining a partition size.


