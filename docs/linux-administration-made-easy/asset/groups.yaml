    ## 10.7 Moving to the 2.2.x Kernels


    The Linux kernel 2.2.0 was released on January 25, 1999, bringing it with many
    new features, performance enhancements, and hardware support. Any Linux system
    can be upgraded with one of these new kernels in much the same fashion as described
    in Section 10.4 (caveats).


    This section will describe how to upgrade your Red Hat system to the new kernels.
    As Red Hat Linux 6.0 (and above) already ships with the new kernel and supporting
    packages by default, this section will only be useful to those of you who are
    still using an earlier version, such as 5.2. I will likely remove this section
    from future versions of this document, once I believe a majority of users have
    migrated to 6.0 and beyond.


    > Warning! If you decide to upgrade your older system to support the new kernels,
    be advised that the process involves a number of package upgrades, it is possible
    that something will go horribly wrong. As always, have recent backups available
    to you in case something goes wrong. If you don''t have experience with upgrading
    files with RPM as well as compiling kernels, perhaps you might wish to


    ```bash

    mount root=/dev/h

    ```


    The above command assumes your “/” (root) partition is located on /dev/hda. Linux
    should then boot normally (although since you are using the kernel from the boot
    disk, not all services or devices may operate properly for this session), and
    then you can restore your old kernel and restart. You can then try recompiling
    the kernel with different options and try again.

