    # 9.3. Starting and Stopping Processes


    The Red Hat distribution of Linux provides a slightly more organized way of managing
    processes. Instead of hunting and killing them by finding their process id in
    the process table, Red Hat provides a collection of scripts in the `/etc/rc.d/init.d`
    directory which will allow you to start and stop processes as desired.


    For example, to shut down the `httpd` (Apache web server), simply run the httpd
    script, as follows:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    In the same manner, you can use the "start" option to start a service. Or, if
    you have made changes to a configuration file and wish to restart a service so
    those changes are recognized, you can use the "restart" option.


    > (Note: Oddly enough, the "restart" option does not seem to be supported for
    some services.)


    # 9.4. Automating Tasks with Cron and Crontab files


    Like most Linux users, you may find it necessary to schedule repetitive tasks
    to be run at a certain time. Such tasks can occur as frequently as once a minute,
    to as infrequently as once a year. This scheduling can be done by using the "cron"
    facilities.


    The cron facilities as implemented in Linux are fairly similar to those available
    in other Unix implementations. However, Red Hat has adopted a slightly different
    way of scheduling tasks than is usually done in other distributions of Linux.
    Just as in other distributions, scheduling information is placed in the system
    "crontab" file (locating in the "/etc/" directory), using the following format:'
- md: '

    ## Chapter 9. Various & Sundry Administrative Tasks


    minute hour day year


    You can specify each time component as an integer number (eg. 1 through 12 for
    the months January through December), or specify one or more components as “*”
    characters which will be treated as wildcards (eg. * in the month component means
    the command will run at the given day and in every month. Here are some examples:


    ```bash

    # Mail the system logs at 4:30pm June 15th.

    30 16 15 06 * for x in /var/log/*; do cat ${x} | mail postmaster;

    ```


    ```bash

    # Info the administrator, at midnight, of the changing seasons.

    00 00 20 04 * echo ''Woohoo, spring is here!''

    00 00 20 06 * echo ''Yeah, summer has arrived, time to hit the beach!''

    00 00 20 10 * echo ''Fall has arrived. Get those out out :-(''

    00 00 20 12 * echo ''Time for 5 months of misery.; ;-(''

    ```


    Note that commands which produce output to standard out (ie. a terminal) such
    as the examples above using “echo” will have their output mailed to the “root”
    account. If you want to avoid this, simply pipe the output to the null device
    as follows:


    ```bash

    00 06 * * echo ''Bug the system administrator daily at 6:00am!'' >/dev/null

    ```


    In addition to the standard "crontab" entries, Red Hat adds several directories:


    ```

    /etc/cron.hourly/

    /etc/cron.daily/

    /etc/cron.weekly/

    ```


    As their names suggest, executable files can be placed in any of these directories,
    and will be executed on an hourly, daily, or weekly basis. This saves a bit of
    time when setting up frequent tasks; just place the executable script or program
    (or a symbolic link to one stores elsewhere) in the appropriate directory and
    forget about it.


    ## Chapter 10. Upgrading Linux and Other Applications


    To get the most out of your Linux system, such as adding features, getting rid
    of potential bugs, and ensuring it is reasonably free of security holes, it is
    a good idea to keep your server – including the Linux kernel, modules, and user
    applications – upgraded. At times it may also be necessary to upgrade hardware
    components such as a larger hard drive. This chapter will address these issues.


    ### 10.1. Using the Red Hat Package Manager (RPM)


    The Red Hat distribution of Linux, including kernel, libraries, and applications
    are provided as RPM files. An RPM file, also known as a “package” is a way of
    distributing software so that it can be easily installed, upgraded, queried, and
    deleted. RPM files contain information on the package''s name, version, other
    file dependency information (if applicable), platform (such as Intel or Alpha,
    etc.), as well as default install locations.


    The RPM utility was first developed by Red Hat and provided as an Open Source
    product as is common in the Linux community. Other developers picked it up and
    added extra functionality. The RPM method of packaging files has become popular
    and is used not only on Red Hat''s but on some other distributions as well.


    Popular Linux applications are almost always released as RPM files, usually in
    fairly short order. However, in the Unix-called facto-standard for package distribution
    continues to be by so-called “tarballs”. Tarballs are simply files that are readable
    with the “tar” utility. Installing from tar is significantly more tedious than
    using RPM. So why would people choose to do so? Unfortunately, sometimes it takes
    a few weeks for developers to get the latest version of a package converted to
    RPM (many developers first release them as tarballs).


    If you start installing or upgrading your system with tar, your RPM database will
    become out-of-date and inconsistent. This isn''t really a big deal (when I used
    Slackware, I used tar exclusively – there was no other choice – without too much
    discomfort), but wherever possible I try to be patient and wait until an RPM becomes
    available, or perhaps send a point to the developer of the package. (You can also
    build your own RPM files and distribute them to others, which is sometimes helpful
    to developers who don''t have the ability or time to produce such files.)


    A good place to check if a piece of software is available in RPM format is the
    RPM repository at http://refus.w3.org/linux/RPM/. The repository provides indexed
    categories which can be helpful to locate a given RPM file, and contains pointers
    to thousands of files.


    To query a package, use “rpm -q pkg-name" (eg.g., “rpm -q pkg-name -q pine\”).
    RPM will either tell you what version of the package is already installed, or
    that the package is not installed.


    Assuming the package is installed already, and is an earlier version the package
    you downloaded (which it should), then you would be able to apply the update with
    “rpm -Uvh pkg-name". If all goes well, the package will be automatically installed
    and immediately ready for use. If not, RPM will give you a pretty good reason
    (for example, perhaps a supporting package needs to be upgraded first). This may
    require a bit of thinking, but problems such as these are very straightforward
    to figure.


    If, on the other hand, the package is not installed, and you decide to install
    it, type “rpm -ivh pkg-name". If there are any supporting packages that are required,
    RPM will tell you.


    Sometimes, you will want to install a package that is only available in source
    format. In fact, unless you are installing or upgrading your system with tar,
    your RPM database will become out-of-date and inconsistent. This isn''t really
