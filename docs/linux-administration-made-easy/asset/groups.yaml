    ## Chapter 9. Various & Sundry Administrative Tasks


    Linux has proven itself to be extremely reliable during the four years I have
    had it in service and requires very little administration to keep it running.
    Where possible, many repetitive or tedious tasks can be automated through cronontab.
    However, to ensure that Linux continues to operate in a trouble-free manner, various
    quick checks can be from time to time. These include:


    ### 9.1. Checking Storage Space


    It is important to check from time to time that adequate free space remains on
    the storage. Use the "df" command to get a report of available space. It will
    look as follows (information shown is from the Internet server at my place of
    employment):


    | Filesystem | 1024- Used | Available | % | Mounted on |

    |---|---|---|---|---|

