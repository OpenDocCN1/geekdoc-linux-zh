    # # Chapter 13. Help! Trouble in Paradise!


    Linux is earning a reputation world-wide for its performance and reliability.
    Nevertheless, no system is perfect, and from time to time you are bound to hit
    a snag. Fortunately, with uptimes we measuring in the months (compared to measuring
    in the days or weeks with NT), such snags will likely be few and far between.


    # ## 13.1. Getting Linux Installed on new,

    Unsupported Hardware


    ( Under construction :-p )


    # ## 13.2. File System Corruption after Power

    Outage or System Crash


    Although Linux is a stable operating system, should it happen to crash unexpectedly
    (perhaps due to a kernel bug, or perhaps due to a power outage), your file system(s)
    will not have been unmounted and therefore will be automatically checked for errors
    when Linux is restarted.


    Most of the time, any file system problems are minor ones caused by file buffers
    not being written to the disk, such as deleted inodes still marked in use. In
    the majority of cases, the file system check will be able to detect and repair
    such anomalies automatically, and upon completion the Linux boot process will
    continue normally.


    Should a file system problem be more severe (such problems tend to be caused by
    faulty hardware such as a bad hard drive or memory chip; something to keep in
    mind should file system corruption happen frequently), the file system check may
    not be able to repair the problem automatically. This is usually, but not always,
    the case when the root file system itself is corrupted. In this case, the Red
    Hat boot process will display'
