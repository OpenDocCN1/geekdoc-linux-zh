    ## 10.7 迁移到 2.2.x 内核


    Linux 内核 2.2.0 于 1999 年 1 月 25 日发布，它带来了许多新功能、性能增强和硬件支持。任何 Linux 系统都可以以与 10.4 节描述相似的方式升级到这些新内核。


    本节将描述如何将您的 RedHat 系统升级到新内核。由于 Red Hat Linux 6.0 及更高版本已默认配备新内核和支持包，因此本节仅对那些仍在使用旧版本（如
    5.2）的用户有用。一旦我认为大多数用户已迁移到 6.0 及以后，我可能会从未来的文档中删除本节。


    > 警告！如果您决定升级旧系统以支持新内核，请注意由于涉及大量的软件包升级，可能会发生严重的错误。一如既常，请准备好最新的备份以防万一。如果您没有使用 RPM
    升级文件以及编译内核的经验，也许您想尝试：


    ```bash

    mount root=/dev/h

    ```


    上述命令假设您的“/”（根）分区位于 /dev/hda。Linux 应该能够正常启动（尽管由于您使用的是启动磁盘上的内核，某些服务或设备在此期间内可能无法正常工作），然后您可以恢复旧内核并重启。随后您可以尝试用不同的选项重新编译内核并再次尝试。


