    \n### 第 12 章 保持服务器安全的\n\n虽然对安全问题的详细讨论超出了本文的范围，但以下清单提供了一些你应该做的最重要的事情：\n\n- 升级系统工具、应用程序和内核：入侵最常见的原因之一是没有保持系统更新。定期升级系统内核、工具和用程序可以确保你的系统不会充满存在已知漏洞的旧项目。关于保持系统更新的详情，请参阅第\
