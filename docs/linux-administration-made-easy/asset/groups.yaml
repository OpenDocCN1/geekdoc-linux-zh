    # 10.5. Upgrading a Red Hat Stock Kernel


    By the easiest way of upgrading your kernel is to do so using a stock kernel RPM
    provided by Red Hat. These RPM files contain pre-compiled binary kernel code,
    with support for a large variety of hardware and popular features.


    Installing a stock kernel is easy to do and involves little risk. Simply type,
    as root, the following sequence of commands:


    ```

    rpm -Uvh kernel-2.0.36.i1386.rpm

    cd /boot

    ```


    Make note of the new kernel name, as reported by the "ls" command above. We are
    interested in the "vmlinuz" file; for example the third RPM release of kernel
    2.0.36 would like "vmlinuz-2.0.36-3".


    Now, use an editor to edit the LILO configuration file (type: "pico -w /etc/lilo.conf")
    and change the "image=/boot/..." line to point to the new kernel file. After you
    have done so, type "/sbin/lilo". If LILO reports an error message, double-check
    the file name in your "lilo.conf" file with the file name in the "boot/" directory.


    > Caution: Do not forget this step!


    After you have upgraded your stock kernel and updated your boot loader information,
    you should be able to shutdown and reboot using the new kernel (see Section 6.7
    for details on shutting down your system).'
  - '[PAGE 102]


    # 10.6. Building a Custom Kernel


    If you are running Linux on a system with hardware or wish to use features not
    supported in the stock kernels, or perhaps you wish to reduce the kernel memory
    footprint to make better use of your system memory, you may find it necessary
    to build your own custom kernel.


    Upgrading the kernel involves configuring desired modules, compiling the kernel
    and modules, and finally installing the kernel image. This is followed by a system
    reboot (with fingers crossed!) to load the new kernel. All of this is documented
    in the "README" file which comes each kernel package. Further information can
    be found in the "Documentation/" directory. A particularly helpful file there
    is "Configure.help" which contains detailed information on the available kernel
    compile options and modules.


    The following is a sample session demonstrating the build of a custom kernel,
    version 2.0.36 on the Intel platform. While building a custom kernel is usually
    a matter of configuring, compiling & installing (usually in the case of new hardware)
    it is necessary to download additional driver software your hardware may not be
    supported by the kernel version you are compiling.


    The first step in building a custom kernel is to download and install the kernel
    sources from either RPM (preferred) or from tarball. See Section 10.4 for details
    on obtaining the appropriate files.


    Next, use the "rpm" utility (or "tar", as appropriate) to install the kernel source
    tree and header files. For example, to install the 2.0.36-3 kernel RPM files:


    ```

    rpm -Uvh kernel-source-2.0.36-3.i386.rpm kernel-headers-2.0.36-3.i386.rpm

    rpm -Uvh kernel-ibcs-2.0.36-3.i386.rpm

    ```


    (If you are running Linux on a notebook, you would also likely install the "kernel-pcmcia-cs-2.0.36-3.i386.rpm"
    file, which provides power management features.)


    After installing the kernel files, you should be able to find the new source tree
    in the "/usr/src/linux/" directory.'
- md: '

    The next step is to download any additional driver files (if applicable) and install
    them in the new kernel source tree. For example, to add support for the Mylex
    DAC960 hardware RAID controller, I would download the driver software from the
    http://www.dandelion.com/ web site. Unfortunately, such driver software are usually
    offered only as tariffs and need to be installed using the “tar” utility.


    ```bash

    cd /usr/src/

    tar zvxf DAC960-2.0.0-Beta4.tar.gz

    ```


    You should read the documentation provided with your additional driver software,
    if applicable. For example, the DAC960 driver includes a “README” file which gives
    instructions on where the newly downloaded files should be located, and how to
    apply to the kernel patch:


    ```bash

    mv README.DAC960 DAC960.[ch] /usr/src/linux/drivers/block

    patch -p0 < DAC960.patch

    ```


    The next step is to ensure your symbolic file links are consistent with the new
    kernel tree. Actually, this step needs to be done once, so the following needs
    to be done only if you have compiled a custom kernel before:


    ```bash

    cd /usr/src

    cd /usr/include

    rm -rf /usr/src/linux/include/asm-i386 asm

    ln -s /usr/src/linux/include/linux linux

    ln -s /usr/src/linux/include/scsi scsi

    ```


    > Note: The above step is no longer necessary for 2.2.x or higher kernel versions.


    The next step is to configure your kernel settings. This is the most important
    step in building the custom kernel. If you disable the wrong settings, you may
    leave out support for features or hardware you need. However, if you enable the
    wrong settings, you will be needlessly enlarging the kernel and wasting your valuable
    system memory


    ![](img/846ec8d157c5d667ec22f4e21c29db61_103_0.png)


    (that being said, it is probably better to err on the side of the latter rather
    than the (former).


    The best way of ensuring you compile the kernel properly is to know what features
    you will need to use, and what hardware is in your system that you will require
    support. After you have gained experience in customizing your kernel a few times,
    the process will become “old hat” and won’t seem so intimidating!


    Type the following to begin the configuration process:


    ```bash

    cd /usr/src/linux

    make mrproper

    make menuconfig

    ```


    (You could type “make xconfig” instead of “make menuconfig” if you have the X
    Window System running: see Chapter 5 for details on how to get working.)


    To configure your kernel, go through the various settings and select (enable)
    whichever ones [you] require, and de-select (disable) the ones you do not require.
    You can choose between having such support right into the kernel, or building
    it as a module which is loaded and unloaded by the kernel as needed. (If you compile
    a feature that is actually needed to boot your system, such as a SCSI driver,
    as a module, you will need to create a RAMDisk image or your system will not boot.
    This is done with the “mkinitrd” command; this procedure is described a little
    further down.)


    When going through the configuration settings, you can select <Help> for a description
    of what a given kernel option is for.


    After you have configured your kernel settings, type the following commands to
    compile your kernel:


    ```bash

    cd /usr/src/linux

    make dep ; make clean

    make bzImage

    make modules

    ```


    If you are recompiling the same kernel as you have previously (2.0.36-3 in this
    example), you will likely want to move the existing modules to a backup directory
    with the following command:


    ```bash

    cd /usr/src/linux

    mv /lib/modules/2.0.36-3 /lib/modules/2.0.36-3-backup

    ```


    Now, type the command to actually install the new modules:


    ```bash

    cd /usr/src/linux

    make modules_install

    ```


