    ## Chapter 12. Strategies for Keeping a Secure Server


    > Note: The SSH RPM files listed above are the international versions. If you
    reside in the U.S. or Canada, you can choose to download the U.S. packages (which
    may have stronger encryption algorithms); these packages have a "us" instead of
    an "i" suffix after their version numbers. Under U.S. law, it is illegal to export
    strong crypto products outside of the U.S. or Canada. Hopefully one day the morons
    in the U.S. Department of Justice will finally see the light, and remove this
    silly restriction (Red Hat doesn''t include SSH with their distribution because
    of this very reason, and we all suffer).


    Your Windows users be up-in-arms about no longer able to connect to your system,
    they will be happy to know that several free ssh clients for Windows are available:


    - “TeraTerm Pro” client software

    http://hp.vector.co.jp/authors/VA002416/teraterm.html


    - “TTSSH” client software

    http://www.zip.com.au/~roca/download.html


    - “Cryptlib” client software

    http://www.doc.ic.ac.uk/~ci2/ssh


    - “Putty” client software

    http://www.chiark.greenend.org.uk/~sgatham/putty.html


    > Note: If you decide to switch to using ssh, make sure you install and use it
    on all your servers. Having five secure servers and one insecure one is a waste
    of time, especially if you are foolish enough to use the same password for more
    than one server.


    - Restrict access to external services: Next, you should edit the "/etc/hosts.allow"
    as well as the "/etc/hosts.deny" file to restrict access to services to external
    hosts. Here is an example of how to restrict telnet and ftp access. First, the
    "/etc/hosts.allow" file:


    ```

    # hosts.allow


    telnetd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    in.ftpd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    ```


    The above allows all hosts in the IP class C''s 123.12.41* and 126.27.18* as well
    as any host within the mydomain.name and another.name domains to make telnet and
    ftp connections.


    Next, the "/etc/hosts.deny" file:


    ```

    # hosts.deny

    telnetd: ALL

    in.ftpd: ALL

    ```


    - Turn off and uninstall unused services: Edit your "/etc/inetd.conf" file, and
    disable (ie. comment out using a "#" character) any services that are not needed
    (if you are using ssh as recommended above, you might wish to disable the "telnet"
    service). After you have done so, as root type "/etc/rc.d/init.d/inet restart"
    to restart the inetd daemon with the changes.


    - Install a security detection system: Consider installing security programs such
    as "Tripwire" (see http://www.tripwiresecurity.com/) which can detect intrusions,
    and "Abacus Sentry" (see http://www.psionic.com/abacus/) which can help prevent
    them.


    - Due diligence: Keeping your os on your system, performing random security audits
    (which can be as simple as checking for suspicious entries in the password files,
    examining your process list, and checking your log files for suspicious entries)
    can go a long way towards keeping a secure system. In addition, report any break-in
    attempts to the appropriate authorities – it may be a hassle to do this, particularly
    if your system sees several of these attacks in a given week, but such reports
    ensures would-crackers deterred by threat of punishment, as well as ensuring that
    others’ systems (which may themselves have been compromised) are kept secure.


    - Assuming you install and upgrade system tools and applications using the “RPM”
    utility, you may wish to verify the integrity of your installed packages by auditing
    them with the following command:


    ```

    rpm -verify -a > /tmp/rpm-audit.txt

    ```


    The above command will check your system’s RPM database with all relevant files,
    and indicate any files which have been modified, by displaying a ‘5’. Here is
    some example output of such an:


    ```

    S.....T /bin/ls

    S.S....T /usr/bin/du

    ....G. /dev/tty5

    ....U. /dev/vcs5

    ....U. /dev/vcs5

    S.S....T c /etc/lynx.cfg

    S.S....T c /etc/sendmail.cf

    ```


    In the sample output, you can see there is going to be a list of seven files,
    of which have been modified. Now, obviously there are several, perhaps many, files
    which have been modified if you have customized your system at all. A brief check
    of the /etc/lynx.cfg and /etc/sendmail.cf files, perhaps visually or perhaps from
    backup, might reveal legitimate configuration changes that you have made to your
    system.


    However, notice in the sample above, two of the modified files are binary executable
    files? It is likely that these two binaries, the “ls” command as well as the “du”
