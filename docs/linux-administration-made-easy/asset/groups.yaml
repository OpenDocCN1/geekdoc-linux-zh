    - glibc-2.0.7-6 or better ("rpm -q glibc")

    - ld.1.9.9 or better ("ls -l /lib/ld.so.")

    - libgcc+-2.7.2.8 or better ("rpm -q libgcc++")

    - procsps-1.2.9 or better ("rpm -q procsps")

    - procinfo-15 or better ("rpm -q procinfo")

    - psmisc-17 or better ("rpm -q psmisc")

    - net-tools-1.50 or better (better "rpm -q net-tools")

    - loadlin-1.6 or better (Needed only if you are booting Linux from DOS using Loadlin.
    Not sure how to calculate the version number; download the latest version to be
