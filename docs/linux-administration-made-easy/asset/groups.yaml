    # 6.7. System Shutdown and Restart


    To shut down the system from a terminal session, sign in or "su" to the "root"
    account. Then type `/sbin/shutdown -r now`. It may take several moments for all
    processes to be terminated, and then Linux will shut down. The computer will reboot
    itself. If you are in front of the console, a faster alternative to this is to
    press `<Ctrl><Alt>-<Del>` to shut down. Please be patient as it may take a couple
    of minutes for Linux to terminate.


    You can also shut down the system to a halt (ie. it will shut down and not reboot
    the system). The system will be unavailable until power-cycled or rebooted with
    `<Ctrl><Alt>-<Del>`. This can be useful if you need to power down the system and
    move it to a different location, for example. To do this, type `/sbin/shutdown
    -h now` when signed into or "sued to the "root" account. Linux will shut itself
    down displaying a message, "System halted". At this point you can power down the
    computer.


    It is probably a good idea to only shut down the system when you are at the console.
    Although you can shut down remotely via a shell, if anything goes wrong and the
    system does not restart properly, the system will be unavailable until action
    is taken at the system unit. (I haven''t experienced any problems doing this myself,
    however).


    Upon system bootop Linux will start automatically, and load all necessary services
    including networking support, and Internet services.'
