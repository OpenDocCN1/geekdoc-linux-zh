    # Chapter 5. Configuring the X Window System


    may have better luck with the "xf86config" utility. Although certainly not as
    user-friendly or attractive as Xconfig is, it gives you finer control over the
    configuration process.


    Finally, if you are still out of luck you may have to resort to editing the "/etc/X11/XF86Config"
    file by tweaking various settings. If this is the case, you may need to get help
    from the Linux community (see Section 13.3 for details). Relax, however – in a
    majority of cases Xconfigurator does an adequate job!


    After getting X working properly, you may be disappointed in the lack of rich
    colours. This is because X uses a 8-bit per pixel ("bpp") colour depth. You can
    use higher colour depths, assuming your video hardware will support them.


    The various colour depths are listed in your "/etc/X11/XF86Config" file, and look
    like this:


    ```

    Subsection "Display"

    Depth\t24

    Modes\t"800x600" "1024x768"

    Viewport\t0

    Virtual\t1024 768

    EndSubsection

    ```


    The above section shows the possible resolutions which are available when using
    the 24-bit colour depth (800x600 and 1024x768), as listed in the "Modes" line);
    these resolutions can be switched between "on-the-fly" using the <Alt><+> and
    <Alt><-> keys.


    > Tip: As a default, when X starts up it does so using the lowest resolution.
    If you dislike this behaviour as much as I do, simply edit the "/etc/X11/XF86Config"
    file and reverse the resolutions (ie. "1024x768" "800x600").


    When you are getting set up, you can test each colour depth manually by typing,
    "startx -bpp 24" (for the 24-bit depth) and make sure X is working properly for
    the colour depth you wish to use.)'
