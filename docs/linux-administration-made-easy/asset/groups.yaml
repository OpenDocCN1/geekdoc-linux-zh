    ## # 10.3. Strategies for Keeping an Up-to-date System


    From time to time you may hear of significant upgrades to the Linux kernel or
    user applications from various sources. These sources may be magazines, newsgroups,
    web pages, etc.


    Probably the best single online resource that a Linux administrator should – nay,
    must – keep an eye on is the http://freshmeat.net/ web site. This site contains
    descriptions of new Open Source applications and projects, documentation, and
    other announcements of interest to the Linux community.


    Another resource for keeping track of new applications announcements is through
    the comp.os.linux.announce newsgroup. This newsgroup contains postings of new
    applications, some kernel or application upgrades, web pages, etc. available for
    Linux. It is a moderated newsgroup and therefore has a high "signal to noise"
    ratio.


    Not all product upgrade announcements are made to comp.os.linux.announce, however.
    Therefore, visiting the web pages or FTP sites for the applications you are using
    is probably a very good idea as well.


    ## 10.4. Linux Kernel Upgrades


    From time to time it may be wise to upgrade your Linux kernel. This will allow
    you to keep up with the new features and bug fixes as they become available. Or,
    perhaps, you are running Linux on new or specialty hardware, or wish to enable
    certain features for which a custom kernel is needed.


    This section will describe upgrading and customizing a new kernel. It isn''t as
    difficult as you might think!


    Announcements of new kernel versions can be obtained through various sources,
    including the comp.os.linux.announce newsgroup, as well as on the http://freshmeat.net/
    and http://slashdot.org/ web sites.


    Please note that there are currently two "streams" of kernel development – one
    stream is considered "stable" releases, while the other stream is considered "development"
    releases. For mission critical applications such as an Internet server, it is
    highly recommended that you use the stable releases and stay away from the development
    kernels.


    The difference between the two streams is that, with the development kernels,
    new-yet untested hardware drivers, filesystems, and other "cutting edge" developments
    are introduced on a regular basis. These kernels are for use by hackers only –
    people who don''t mind rebooting their system, should a kernel bug rear their
    ugly head.


    The stable kernels introduce new features and drivers only after they have been
    thoroughly tested. Minor releases in this stream also serve to clean up any remaining
    bugs that are found and corrected.


    # Chapter 10. Upgrading Linux and Other Applications


    The two streams use version numbers which are numbered differently to help distinguish
    between them. The kernels are numbered with the second number even (eg. 2.0.35,
    2.0.36, 2.2.4) while the development kernels are numbered with the second number
    odd (eg. 2.1.120, 2.1.121, 2.3.0).


    The latest stable kernel is always made available in source or as pre-compiled
    binary formats on the /ftp/redhat.com/redhat/updates/ FTP site. Download the desired
    kernel packages for your version and platform (for example, you would want to
    navigate to "/6.1/1386/" directory and download the "kernel-*.1386.rpm" files
    for the 6.1 version on the Intel platform).


    > Note: You do not need to download the kernel files if you are planning building
    a custom kernel yourself (see Section 10.6 for details on building a custom kernel).


    Sometimes, you may find it necessary to use a kernel that has not been made available
    as an RPM. In this case, you can find the latest kernels from the ftp.kernel.org
    FTP site, in the /pub/linux/kernel/ directory. Change to the appropriate version
    subdirectory (eg. "v2.0"), which contains all kernel releases up to the most current
    one. Download the desired kernel package (for example, the compressed tarball
    for version 2.0.36 will be called "linux-2.0.36.tar.gz" for the Intel platform)
    and untar it in the "/usr/src/" directory.


    > Note: Most user-installed applications not from RPM should be untared under
    the "/usr/local/src/" directory by convention, but this is a kernel tree so we''ll
    make an exception in this case. :-


    Be aware that if you decide to upgrade your kernel by downloading a tarball, you
    will most certainly need to configure, compile, and install it yourself. Unless
    you have special needs that require the very latest development kernel, I strongly
    recommend you upgrade your kernel through Red-provided RPM files – these are preconfigured
    and precompiled for you, although you can compile a custom kernel from RPM files
    as well should you wish.


    ## 10.5. Upgrading a Red Hat Stock Kernel


    The easiest way of upgrading your kernel is to do so using stock kernel provided
    by Red Hat. These RPM files contain pre-compiled binary code, with support for
    a large variety of hardware and popular features. Installing a stock kernel is
    easy to do and involves little risk. Simply type, as root, the following sequence
    of commands:


    ```

    rpm -Uvh kernel-2.0.36-3

    cd /boot

    ```


    Make note of the new kernel name, as reported by the "ls" command above. Now,
    use an editor to edit the LILO configuration file (type "vi /etc/lilo.conf") and
    change the "image=/boot/" line to point to the new kernel. After you have done
    so, type "/sbin/lilo". If LILO reports an error message, double-check the file
    in your "boot/" directory.


    > Caution: Do not forget this step!


    After you have upgraded your boot loader information, you should be able to shutdown
    and reboot using the new kernel (see Section 6.7 for shutting down your system).


    ## 10.6. Building a Custom Kernel


    If you are running Linux on a system with hardware or wish to use features not
    supported in the stock kernels, or perhaps you wish to reduce the kernel footprint
    to make better use of your system memory, you may find it necessary to build your
    own custom kernel.


    Upgrading the kernel involves configuring desired modules, compiling the kernel,
    and finally installing the kernel. This is followed by a system reboot (with fingers
    crossed!). All of this is documented in the "README" file which comes each kernel.
    Further information can be found in the "Documentation/" directory. A particularly
    helpful file there is "Configure.help" which contains detailed information on
    the available compile options and modules.


    The following is a sample session demonstrating the build of a custom kernel,
    version 2.0.36 on the Intel platform. While building a custom kernel is usually
    a matter of configuring, compiling & installing (usually in the case of new hardware)
    it is necessary to download additional driver software your hardware may not be
    supported by the kernel version you are compiling. The first step in building
    a custom kernel is to download and install the kernel sources from either RPM
    (preferred) or from tarball. See Section 10.4 for details on obtaining the appropriate
    files.


    Next, use the "rpm" utility (or "tar", as appropriate) to install the kernel source
    tree and header files. For example, to install the 2.0.36-3 kernel RPM files:


    ```

    rpm -Uvh kernel-source-2.0.36-3.i386.rpm kernel-headers-2.0.36-3.i386.rpm

    rpm -Uvh kernel-ibcs-2.0.36-3.i386.rpm

    ```


    (If you are running Linux on a notebook, you would also likely install the "kernel-pcmcia-cs-2.0.36-3.i386.rpm"
    file, which provides power management features.)


    After installing the kernel files, you should be able to find the new source tree
    in the "/usr/src/linux/" directory.

