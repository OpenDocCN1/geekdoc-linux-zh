    This document will attempt to remain hardware independent as possible but it may
    be helpful to you if you know where I am coming from as far as hardware is concerned.


    ## Chapter 4. Installation and Hardware Configuration


    This chapter will detail the procedures needed to install Red Hat 6.1 onto an
    Intel system; the procedures are similar whether you choose to install using either
    GUI or text-based installation. Since much of this information is already well
    documented in the Red Hat User’s Guide (provided as a paper manual in the “Official”
    boxed sets, included in the “/doc” directory on the CD, and as available online
    at ftp://ftp.redhat.com/pub/redhat/redhat-6.1/i386/doc/rhint/index.html), I have
    skimmed over of the details. However, there are a few things I think are lacking
    in the Red Hat guide, and I will attempt to cover these items in greater detail.


    ### 4.1. Creating an Installation Diskette


    The first step in getting Red Hat’s distribution of Linux onto a system, you need
    to find a way of starting the installation program. The usual method of doing
    so is to create an installation disk, although if you are installing from CD-ROM,
    and your system’s BIOS supports it, you should be able to boot directly into the
    installation program from the CD.


    Otherwise, to create an installation diskette, you’ll need to copy the “boot.img”
    (which is simply an image of an ext2-formatted Linux boot disk with an additional
    installation program) onto a floppy diskette. The “boot.img” file can be obtained
    from the /images directory of the Red Hat CD-ROM, or downloaded via FTP from ftp://ftp.redhat.com
    in the /pub/redhat/redhat-6.1/i386/images directory (assuming you are installing
    Linux on an Intel box).


    You can create the boot diskette either from a DOS or Windows system, or from
    an existing Linux or Unix system. For your destination disk, you can use either
    an unformatted or a pre-formatted (for DOS) diskette – it makes no difference.


    Under DOS: Assuming your CD-ROM is accessible as drive D:, you can type:


    ```

    d:

    cd \images

    ..\dosutils\rewrite

    ```


    For the source file, enter "boot.img". For the destination file, enter "a-:" (assuming
    the diskette you created is inserted into the A: drive). The "rewrite" program
    will then copy the "boot.img" file onto diskette.


    Under Linux/Unix: Assuming the "boot.img" file is located in the current directory
    (you may need to mount the CD-ROM under /mnt/cdrom and find the file in /mnt/cdrom/cdrom),
    you can type:


    ```

    dd if=boot.img of=/dev/fd0

    ```


    The "dd" utility will copy, as its input file ("if", the "boot.img" file, onto
    the output file ("of") of=/dev/fd0 (assuming your floppy is accessible from /dev/fd0).


    Unless Linux or Unix allows write permissions to the floppy device, you may need
    to do this command as the superuser. (If you know the root password, type "su"
    to become the superuser, execute the "dd" command, and then type "exit" to return
    to normal user status).


    With either of the above schemes, you should now have a bootable Red Hat 6.1 installation
    diskette that you can use to install your new Red Hat Linux system!


    ### 4.2. Booting Linux Installation Program


    To begin up your new Red Hat system, either boot from the installation CD, or
    insert the diskette in the system''s A: drive, and reboot or power-on the system.
    After a few minutes, the Red Hat installation program screen should appear.


    In most cases, you can just press <Enter> to begin the installation process, but
    if you are a more experienced user who knows exactly how your hardware devices
    should be set up, you can enter "expert" for the additional information and prompts
    this this feature provides. (If you do nothing, the default installation procedure
    will start in 10 to 15 seconds after the installation screen appears.)


    You will then be asked to choose your language (“English”) and your keyboard type
    (even in Canada I choose “US 101-key”), as well as where you are installing (from
    your CD-ROM or the network). Red Hat is very flexible in where it can be installed.


    Most you will choose “Local CDROM” to install your Red Hat CD-ROM (which should
    be inserted into your CD-ROM device). However, if your system is not equipped
    with a CD-ROM device, there are a number of other installation methods you can
    choose.


    If you have another Linux system (or any other operating system that supports
    NFS mounting), choose “NFS” to install from an NFS mount. To do this, you’ll need
    to have your CD-ROM mounted in the other system (or otherwise have the Red Hat
    distribution tree on the other system – it is possible to download everything
    via FTP and then install from).

