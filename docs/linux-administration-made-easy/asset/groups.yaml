    \n另一种存储账户信息的方法是我一直使用的，即影子密码格式（shadow password format）。与传统方法相比，这种方法以兼容格式将账户信息存储在\
    \ `/etc/passwd` 文件中。然而，密码是以单个“x”字符的形式存储的（即不存储在此文件中）。第二个名为 `/etc/shadow` 的文件包含了加密后的密码以及账户或密码过期值等其他信息。`/etc/shadow`\
    \ 文件仅允许 root 账户读取，因此安全风险较低。\n\n虽然某些其他 Linux 发行版强制你安装 Shadow Password Suite 才能使用影子格式，但\
    \ Red Hat 使其变得简单。要在两种格式之间切换，请输入（作为 root 用户）：\n\n```\n/usr/sbin/pwconv 转换为 shadow\
    \ 格式\n/usr/sbin/pwunconv 转换回传统格式\n```\n\n使用影子密码后，`/etc/passwd` 文件包含账户信息，如下所示：\n\
    \n```\nsmithj:x:561:561:Joe Smith:/home/smithj:/bin/bash\n```\n\npasswd 条目中的每个字段由冒号（`:`）分隔，内容如下：\n\
    \n- 用户名，最多 8 个字符。区分大小写，通常全小写。\n- 密码字段中的“x”。密码存储在 `/etc/shadow` 文件中。\n- 数字用户 ID\
