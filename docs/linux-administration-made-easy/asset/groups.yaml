    \n## 第 12 章 保持服务器安全的策略\n\nLinux 无疑可以被认为比其他供应商的操作系统更安全——或更安全。诚然，随着 Linux 越来越流行，它正成为黑客集中精力破入的一个非常有吸引力的目标。然而，尽管不时会发现漏洞，但\
