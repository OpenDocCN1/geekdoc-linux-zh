    ## Chapter 10. Upgrading Linux and Other Applications


    Next, if your mail server will have a different host name than the actual machine
    it is running on, you can add one or more aliases in the "/etc/sendmail.cw" file.
    For example, if you have a system called “kirk.mydomain.name” which is set up
    as the mail exchanger for mydomain.name, but wanting mail addressed in the format
    “user@mydomain.name” to be delivered to your users on “kirk”, simply add this
    alias as follows:


    mydomain.name


    Finally. If you need to restrict a domain (or subdomain) from connecting to your
    sendmail service, you can edit the "/etc/mail/access" and add the domain information
    as well as type of restriction. For:


    ```

    some.domain               REJECT

    hax0r.another.domain    550 Contact site administrator (555) 555-1234.

    ```


    The above examples would reject all e-mail connections from the “some.domain”
    site, as well as reject the specific machine name “hax0r.another.domain” with
    a descriptive message.


    After making changes to this file, you will need to update the "access.db" file,
    and then restart sendmail as follows:


    ```

    /usr/sbin/makemap hash /etc/mail/access.db < /etc/mail/access

    /etc/rc.d/init.d/sendmail restart

    ```


    > Tip: If you are concerned with e-mail abuse, you can get some very helpful information
    from the "Mail Abuse Prevention System" (MAPS) project on dealing with such abuse;
    see the web pages at http://www.mail-abuse.org/


    If you’re using Sendmail version 8.9 or above, RBL support is already built in,
    but not enabled by default. To enable this support, add the following to your
    sendmail.mc file:


    ```mc

    # FEATURE (rbl)

    ```


    Then, reconfigure and restart the Sendmail daemon.


