    media; although all devices are treated like files in the Unix world, if you are
    writing to a character device such as a Squid, the name of the "file" is the device
    name itself (eg. "/dev/nst0" for a SCSI-based tape drive).


    The following command will perform a backup of your entire Linux system, with
    the exception of the "/proc/" pseudo-filesystem, mounted files in "/mnt/", the
    "/archive/" filesystem (no backing up your backup sets!), as well as large cache
    files (which are, in my opinion, a waste of backup media and unnecessary to back
    up):


    ```

    tar -zcpvf /archive/full-backup `date ''+%d-%B-%Y''`.tar.gz -directory / exclude=mnt
    -exclude=proc -exclude=var/spool/spood

    ```


    Don''t be intimidated by the length of the command above! As you break it down
    into components, you will see the beauty of this powerful utility.


    The above command specifies the options "-z" (compress, the backup data will be
    compressed with "gzip"), "-c" (create; create an archive file is begin), "-v"
    (verbose; display a list of files as they get backed up), "-p" (preserve permissions;
    file protection information will be "remembered" so they can be restored). The
    "-f" (file) option states that the next argument will be the name of the archive
    file (or device) being written. Notice how a filename which contains the current
    date is derived, simply by enclosing the "date" command between two back-quote
    characters. A common naming convention is to add a "tar" suffix for non-compressed
    archives, and a "tar.gz" suffix for compressed ones.


    The "-directory" option tells tar to first switch to the following directory path
    (the "/" directory in this example) prior to starting the backup. The "-exclude"
    options tell tar not to backing up the specified directories or files. Finally,
    the \.\* character tells tar that it should back everything in the current directory.


    > Note: It is important to realize that the options to tar are cAsE-sEnTiVe! In
    addition, most of the options can be specified as either single mnemonic characters
    (eg. "f"), or by their easier-to-memorize full option names (eg. "file").'
- md: "\n## Chapter 8. Backup and Restore Procedures\n\nThe mnemonic representations\
    \ are identified by prefixing them with a \"-\" character, while the full names\
    \ are prefixed with two such characters. Again, the \"man\" pages for information\
    \ only using tar.\n\nAnother example, this time writing only the specified file\
    \ systems (as opposed to writing them all with exceptions demonstrated in the\
    \ example) onto a SCSI drive:\n\n```bash\ntar -cvpf /dev/nst0 -label=Backup set\
    \ created on '$(date '+%d-%B-%Y)' \\\n-directory / \\\nexclude=var/spool/\netc\
    \ home usr/local var/spool\n```\n\nIn the above command, notice that the \"z\"\
    \ (compress) option is not used. I strongly recommend against writing compressed\
    \ data to tape, because if data on a portion of the tape becomes corrupted, you\
    \ will lose your entire backup set! However, archive files stored without compression\
    \ have a very high recoverability for non-affected files, if portions of the tape\
    \ archive are corrupted.\n\nBecause the tape drive is a character device, it is\
    \ not possible to specify an actual file name. Therefore, the file name used as\
    \ an argument to tar is simply the name of the device, \"/dev/nst0\", the first\
    \ tape device on the SCSI bus.\n\n> Note: \"/dev/nst0\" device does not rewind\
    \ after the backup set is written; therefore it is possible to write multiple\
    \ sets on one tape. (You may also refer to the device as \"/dev/st0\", in which\
    \ case the tape is automatically rewound after the backup set is written.)\n\n\
    When we aren't able to specify a filename for the backup set, the \"-label\" option\
    \ can be used to write some information about the backup set into the archive\
    \ file itself.\n\nFinally, only the files contained in the \"/etc/\", \"/home/\"\
    , \"/usr/local/\", and \"/var/spool/\" (with the exception of Squid's cache data\
    \ files) are written to the tape.\n\nWhen working with tapes, you can use the\
    \ following commands to rewind, and then eject your tape:\n\n```bash\nmt -f /dev/nst0\
    \ rewind\nmt -f /dev/nst0 offline\n```\n\n> Tip: You will notice that leading\
    \ \"/\" (slash) characters are stripped by tar when an archive file is created.\
    \ This is tar’s default mode of operation, and it is intended to protect you from\
    \ overwriting critical files with older versions of these files, if you mistakenly\
    \ recover the wrong file(s) in a restoration effort. If you dislike this behavior\
    \ (remember, it is a feature!) you can specify the “absolute-paths” option to\
    \ tar, which will preserve the leading slashes. However, I don’t recommend doing\
    \ so, as it is dangerous!\n\n### 8.1.2. Backing up with “KDat”:\n\nIf you are\
    \ using the KDE desktop environment, I believe you will find the “KDat utility\
