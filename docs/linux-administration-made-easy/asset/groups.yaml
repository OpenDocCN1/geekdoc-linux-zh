    \ 活动日志消息将记录在 /var/log/messages 中供您查阅。\n\n## 7.4. 使用 Samba 提供 Windows 风格的文件和打印服务\n\
    \nLinux 可以使用 Samba 包提供 SMB 服务（例如 Wf、Win95 和 NT 风格的网络文件和打印共享）。本节将描述如何配置共享以及如何从客户端机器访问它们。\n\
