    ```


    In case of router failure (caused by a power surge), backup files can be helpful.
    Again, restoration involves 3-step: setting permissions on an existing file (or
    creating a new one) to allow writes, writing the backup file, and then resetting
    permissions to restrict access to the file. An example router backup session follows:


