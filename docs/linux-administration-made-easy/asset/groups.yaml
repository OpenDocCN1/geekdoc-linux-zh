    升级内核最简单的方法是使用 Red Hat 提供的标准 包。这种方法非常简单且几乎没有风险。只需以 root 身份执行以下命令序列：


    ```

    rpm -Uvh kernel-2.0.36

    cd /boot

    ```


    记下 `ls` 命令显示的内核名称。现在，使用编辑器编辑 `/etc/lilo.conf`，并将 `image=` 行指向新内核。完成后，执行 `/sbin/lilo`。如果
    LILO 报告错误，请检查 `boot/` 目录的文件。


    > 注意：不要忘记这一步！


    在更新引导加载器信息后，你应该可以使用新内核关闭系统（见 6.7 节）。


