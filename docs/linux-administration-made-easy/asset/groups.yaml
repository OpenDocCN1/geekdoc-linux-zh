    # # Chapter 9. Various & Sundry Administrative Tasks


    Linux has proven itself to be extremely reliable during the over four years I
    have had it in service as an Internet server and requires very little hands-on
    administration to keep it running. Where possible, many repetitive or tedious
    administrative tasks can and should be automated through cronontab and script
    files. However, to ensure that Linux continues to operate in a trouble-free manner,
    various quick checks can be from time to time. These include:


    # ## 9.1. Checking Storage Space


    It is important to check from time to time that adequate free space remains on
    the storage devices. Use the "df" command to get a report of available space.
    It will look as follows (information shown is from the Internet server at my place
    of employment):


    | Filesystem | 1024- Used Available Capacity | % | Mounted on |

    |---|---|---|---|---||

    | /dev/sda1 | 1888052 | 135908 | 1645551 | 8% | / |

    | /dev/sdb1 | 4298882 | 100084 | 3977246 | 2% | /archive |

    | /dev/hda2 | 3048330 | 897858 | 1992794 | 31% | /archive2 |

    | /dev/hda1 | 11677 | 1380 | 9694 | 12% | /boot |

    | /dev/sdc1 | 4298828 | 350310 | 3727020 | 9% | /home |

    | /dev/sda2 | 4298828 | 598504 | 3478826 | 15% | /usr |

    | /dev/sda2 | 1888083 | | 1090075 | 39% | /var |

    | /dev/sdc0 | 593958 | 593958 | 0 | 100% | /cdrom |


    These file-systems are pretty stable that they have a fairly slow growth pattern.

    The "/" (root) file-system, mounted on /dev/hda1, contains the Linux kernel, device
    drivers, and other directories. It is also where mail messages are stored (/var/spool/mail/)
    as well as log files (/var/adm/) but as mail messages are received and log files
    are recycled, the available capacity stays fairly stable (an estimated growth'
- md: '

    # Chapter 9. Various & Sundry Administrative Tasks


    about 1% per month. Log files are rotated and purged automatically on a weekly
    basis, so you''ll always have a month''s worth of log information available to
    you.


    > Tip: If this file-system is growing rapidly, concentrate your efforts in the
    /var/spool/mail directory - look for huge mailboxes (something like `find /var/spool/mail
    -size +1000k` would display a list of mailboxes larger than 1Mb in size). If you
    find a mail could larger than 1,000,000 bytes in size, the user probably isn''t
    retrieving their mail, is on a high-volume mailing list, or your e-mail package
    is not configured to remove the mail from the server. Contact the user and clear
    the mail file, using `~ mailbox` (eg. `~smith` to clear Joe Smith''s mail box).
    Also check the `~/tmp` directory, which may need to be cleaned up on an occasional
    basis (usually old tin files left over restarted sessions, old print files, etc.).


    The /usr/ (aka user) file-system, mounted on /dev/hda2, contains user-installable
    (meaning user-installed by system administrator) software, like your site pages.
    This is the largest and also slow-growing. The log files for the web pages may
    also be stored here, and grow in size; check and trim them periodically as needed.
    On my machines, at the beginning of each month the current log files are moved
    to month summary logs (eg. access_log.11 for November''s log entries). At the
    end of the year these logs are all deleted and the cycle starts again (which means
    each January 1st should see a fair improvement in available space).


    > Tip: If this file-system is growing rapidly, check the /usr/local/etc/httpd/logs
    and the /usr/local/squid/logs/ directories (if you have them). There may be log
    file(s) that are getting too large (if, perhaps, the web site received a high
    number of visits). If, however, the logs are purged automatically on a regular
    basis as I have them, you''d run into any problems with space here (indeed, the
    logs are used for statistical analysis of my site''s traffic I''d rather not have
    to delete them if possible). Another place to check for potentially deletable
    files is in /usr/tmp/.


    The /home/ (aka user personal home) file-system, mounted on /dev/hda3, contains
    all the user directories and personal files. Unless you are giving out shell accounts,
    most of these will be useless and inaccessible to the user (these directories
    are created when each users'' accounts are created, and can later be used to forward
    the user'' mail, etc.). However shell account users, as well as any non-shell
    accounts which have web pages (eg. personal web pages) will probably have them
    stored here. In addition, main web servers are stored in the /home/httpd under
    Red Hat, while other distributions usually place them in the /usr file system
    (see Section 7.1 for more information).


    This file-system is probably the slowest growth unless you are offering a lot
    of shell accounts.


    > Tip: If this file-system suddenly grows in size, it is probably because one
    of your users is adding web pages or binary files in his/her personal space. Check
    the `/var/adm/xferlog.` log files for recent activity, which should show you which
    user has added to their web pages.


    I also have an "archive/" (aka archive files) file-system, mounted on /dev/hdb1,
    which is a spare 1.02 Gb hard drive that can be used for any purpose (eg. data
    files, software kits, etc.). I am using a good portion (approximately 70%) of
    this drive for disk-to-disk full current backups of the system). Generally speaking
    you can add your own devices and mount them as you wish.


    I also have a CD-ROM drive, mounted as "mnt/cdrom/" on /dev/scd0, which is a 24X-speed
    SCSI CD-ROM device that can read ISO9660 formatted CD. It is used primarily for
    software installation, by DOS/Windows CD''s can be mounted and accessed from Windows
    3.x/95/NT network shares via a Samba service (see Section 7.4 for details).


    The "rm" command will delete a file. Usage is the "-i" option (eg. "rm -i *").
    You would then be asked to confirm each file before it is deleted.


    (Note: This is the default for normal shell users, but beware – the root account
    will not confirm before deleting files unless you specify the "i" option!)


    Be careful you don''t make a silly typo with this command – particularly when
    logged in as “root” – because you may end up regretting the wrong file.


    ## 9.2. Managing Processes


    From time to time you wish to view processes that are running on Linux. To obtain
    a list of these processes, type `ps -aux`, which will look similar to the following:


    | USER PID %CPU %MEM SIZE RSS TTY STAT TIME COMMAND |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | bin | 69 | 0.0 | 1.0 | 788 | 320 | ? | S | Nov 30 0:00 | /usr/sbin/rpc.portbindmapper
    |

    | frampton | 10273 | 0.0 | 2.1 | 1136 | 664 | p0 | S | 14:12 | -bash |

    | frampton | 10744 | 0.0 | 1.1 | 820 | 360 | p0 | R | 17:25 | ps |

    | frampton | 10745 | 0.0 | 0.8 | 788 | 264 | p0 | S | 17:25 | httpd |

    | nobody | 10132 | 0.0 | 1.8 | 1016 | 588 | ? | S | 13:36 | httpd |

    | nobody | 10133 | 0.0 | 1.8 | 988 | 568 | ? | S | 13:36 | httpd |

    | nobody | 10413 | 0.0 | 1.8 | 1012 | 580 | ? | S | 14:56 | httpd |

    | nobody | 10416 | 0.0 | 1.8 | 1012 | 588 | ? | S | 14:57 | httpd |

    | nobody | 10418 | 0.0 | 1.8 | 988 | 588 | ? | S | 14:56 | httpd |

    | nobody | 10488 | 0.0 | 1.7 | 976 | 556 | ? | S | 15:34 | httpd |

    | nobody | 10564 | 0.0 | 1.8 | 988 | 564 | ? | S | 16:06 | httpd |

    | nobody | 10600 | 0.0 | 1.8 | 988 | 568 | ? | S | 16:15 | httpd |

    | nobody | 10670 | 0.0 | 1.8 | 988 | 568 | ? | S | 16:45 | httpd |

    | nobody | 10704 | 0.0 | 1.7 | 976 | 552 | ? | S | 17:03 | httpd |

    | root | 1 | 0.0 | 1.0 | 776 | 312 | ? | S | Nov 30 1:13 | init [kflushd] |

    | root | 2 | 0.0 | 0.0 | | | SW | Nov 30 0:00 | kflushd) |

    | root | 3 | 0.0 | 0.0 | | | SW | Nov 30 0:00 | kswapd) |


    The list shows you the owner of the process (“nobody” for special services such
    as web servers), the process identification number, the % of CPU time it is currently
    using, the % of memory the process is consuming, and other related information,
    as well as a description of the task itself.


    To get more information on a given process, type "ps pid" (where "pid" is the
    process identification number). Looking at our example above, "ps 10704" would
    the display:


    ```

    10704 ? S 0:00 /usr/local/etc/httpd/httpd

    ```


    This would tell you that this particular process is a web server (the Apache web
    server appears multiple times in the process list; for information on which you
    can see Section 7.1).


    If you notice a service is not operating, you can use the "kill -HUP pid" (where
    "pid" is the process identification number as shown in the process list produced
    with "ps). For example, Internet services (a process called inetd, process #123
    in our example) are not working as they should, a "kill -HUP 123" (or safer, use
    the "killall -HUP inetd") command and specify the process name: "killall -HUP
    inetd" should restart the process. The -HUP option to the kill command means "hang
    up"; the process knows that it is supposed to reload itself.


    Another thing to try if you are unable to resolve the problem would be to shut
    the system down and reboot it (see Section 6.7 for details).


    At times, you may find it necessary to temporarily suspend a process, and then
    resume its execution at a later time. For example you may be running a CPU-intensive
    job and wish to run an IDE-based CDRecordable. Since IDE-based devices rely on
    the CPU for much of the work behind input/output, they are prone to buffer starvation
    if your CPU is too busy, and you end up with a useless coaster instead of a properly
    prepared CD! The following two commands will suspend a process, and the resume
    it, respectively:


    ```

    kill -STOP 945

    kill -CONT 945

    ```


    Red Hat has a better way of starting and stopping some processes, which are covered
    in Section 9.3 below.


    ## 9.3. Starting and Stopping Processes


    The Red Hat distribution of Linux provides a slightly more organized way of managing
    processes. Instead of hunting and killing them by finding their process id in
    the process table, Red Hat provides a collection of scripts in the `/etc/rc.d/init.d`
    directory which will allow you to start and stop processes as desired.


    For example, to shut down the `httpd` (Apache web server), simply run the httpd
    script, as follows:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    In the same manner, you can use the "start" option to start a service. Or, if
    you have made changes to a configuration file and wish to restart a service so
    those changes are recognized, you can use the "restart" option.


    > (Note: Oddly enough, the "restart" option does not seem to be supported for
    some services.)


    ## 9.4. Automating Tasks with Cron and Crontab files


    Like most Linux users, you may find it necessary to schedule repetitive tasks
    to be run at a certain time. Such tasks can occur as frequently as once a minute,
    to as infrequently as once a year. This scheduling can be done by using the "cron"
    facilities.


    The cron facilities as implemented in Linux are fairly similar to those available
    in other Unix implementations. However, Red Hat has adopted a slightly different
    way of scheduling tasks than is usually done in other distributions of Linux.
    Just as in other distributions, scheduling information is placed in the system
    "crontab" file (locating in the "/etc/" directory), using the following format:

    '
  mdcn: '


    # 第 9 章 各种及杂项管理任务


    每月增长约 1%。日志文件每周会自动进行轮转和清理，因此你总有一个月的日志信息可供使用。


    > 提示：如果此文件系统增长迅速，请将精力集中在 `/var/spool/mail` 目录上——寻找巨大的邮箱箱（使用类似 `find /var/spool/mail
    -size +1000k` 的命令将显示大小大于 1Mb 的邮箱箱列表）。如果你发现某个邮件大小超过 1,000,000 字节，可能该用户没有取回邮件，或者处于高频邮件列表列表中，又或是你的电子邮件软件包未配置为从服务器上删除邮件。请联系该用户并使用
    `~ mailbox` 清空邮件文件（例如，使用 `~smith` 清空 Joe Smith 的邮箱箱）。还要检查 `~/tmp` 目录，该目录可能需要定期清理（通常是重启会话后留下的旧的临时文件、旧的打印文件等）。


    `/usr/`（又 user）文件系统挂载在 `/dev/hda2` 上，包含用户可安装的软件（即由系统管理员安装的软件），例如你的站点页面。这是最大的且增长缓慢的文件系统。网页页面的日志文件也可能存储在这里并随之增长；请根据需要定期检查并修剪它们。在我的机器上，每个月初，当前的日志文件会被移动到每月摘要日志（例如
    `access_log.11` 代表 11 月的日志条目）。年底，这些日志将被全部删除，循环重新开始（这意味着每年 1 月 1 日可用空间都应该有明显的改善）。


    > 提示：如果此文件系统增长迅速，请检查 `/usr/local/etc/httpd/logs` 和 `/usr/local/squid/logs/` 目录（如果有的话）。可能存在某些变得过大的日志文件（也许是因为网站的访问量很高）。然而，如果日志像我设置的那样定期自动清理，你就不会在这些地方遇到任何空间问题（事实上，日志用于对我的站点流量进行统计分析，如果可能的话，我并不想删除它们）。另一个可以检查可能删除文件的地方是
    `/usr/tmp/`。


    `/home/`（即用户个人主目录）文件系统挂载在 `/dev/hda3` 上，包含所有用户目录和个人文件。除非你提供 shell 账户，否则大部分内容对用户来说都是无用且不可访问的（这些目录在创建用户账户时创建，稍后可用于转发用户邮件等）。然而，shell
    账户用户以及任何拥有网页（例如个人网页）的非 shell 账户可能会将它们存储在此处。此外，在 Red Hat发行版中，主 Web 服务器存储在 `/home/httpd`
    下，而其他发行版通常将它们放在 `/usr` 文件系统中（更多信息请见第 7.1 节）。


    此文件系统的增长可能是慢的，除非你提供了大量的 shell 账户。


    > 提示：如果此文件系统的大小突然增加，可能是因为其中一个用户在其个人空间添加了网页或二进制文件。检查 `/var/adm/xferlog` 日志文件以获取最近活动，它应该显示是哪个用户向其网页添加了内容。


    我还有一个 `archive/`（即归档文件）文件系统，挂载在 `/dev/hdb1` 上，这是一个备用的 1.02 Gb 硬盘，可用于任何目的（例如数据文件、软件套件等）。我将此驱动器的很大一部分（约
    70%）用于系统的磁盘到磁盘全量当前备份。通常你可以根据意愿添加自己的设备并挂载它们。


    我还有一个 CD-ROM 驱动器，挂载在 `/dev/scd0` 的 `mnt/cdrom/`，这是一个 24X 速的 SCSI CD-ROM 设备，可以读取
    ISO9660 格式的 CD。它主要用于软件安装，通过 Samba 服务，DOS/Windows CD 可以从 Windows 3.x/95/NT 网络共享中进行挂载和访问（详情请见第
    7.4 节）。


    `rm` 命令将删除文件。用法是使用 `-i` 选项（例如 `rm -i *`）。随后你将在删除每个文件之前被要求进行确认。


    （注意：这是普通 shell 用户的默认设置，但要小心——root 账户在未指定 `i` 选项的情况下不会在删除文件前进行确认！）


    在使用此命令时要小心出现低级拼写错误——特别是当你以“root”身份登录时——因为你可能会因删错文件而追后悔。


