    ## 第6章 通用系统管理问题


    ## 6.1 Root 账户


    “root”账户是 Unix 系统上权限最高的账户。该账户让你能够执行系统管理的所有方面工作，包括添加账户、更改用户密码、检查日志文件、安装软件等。


    在使用此账户时，尽可能保持谨慎至关重要。“root”账户没有施加任何安全限制。这意味着你可以毫不费力地执行管理职责。然而，系统假设你清楚自己在做什么，并且会完全按照你的要求执行操作——不带任何提问。因此，很容易因为输错命令而删掉关键文件。


    当你以“root”身份登录时，shell 提示符的最后一个字符会显示为‘#’（如果你正在使用 bash）。这是为了向你警告该账户的绝对权力。


    经验法则是，除非绝对必要，否则永远不要以“root”身份登录。在输入“root”类型的命令时要小心，并在按下回车键之前双重检查。一旦完成了你登录的任务，立即注销“root”账户。


    最后（对于任何账户都是如此，但对此账户尤其重要），请保持密码安全！


    ## 6.2 创建用户账户


    > （警告：针对 SLACKWARE 系统，需要为 RED HAT 进行更新）


    ## 第6章 通用系统管理问题


    本节假设你在 Linux 系统上使用了 Shadow 密码套件。如果不是，你应该考虑这样做，因为这有助于在某种程度上加强安全性。Shadow 套件非常易于安装，并且会自动将你的非
    shadow 密码文件转换为新的 shadow 格式。


    创建一个新用户账户有两个步骤。第一是实际创建账户本身，第二是为他们的邮箱提供别名（在我工作的单位，我们遵循“名字.姓@我们的域名.名称”的约定）。


    要创建账户，请决定你将分配给用户的用户名。用户名最多长 8 个字符，在尽可能的情况下，你应该选择他们的姓，或者如果已经存在该用户账户，则选择名字和首字母（`aduser`
    脚本将检测并防止你添加重复账户）。


    系统会提示你输入其他信息：用户的全名、用户组（通常是默认值）、用户 ID #（自动分配）、主目录（自动分配）、一个用户、一些密码过期值，最后是所需的密码（密码不会显示在屏幕上；出于安全考虑，用户密码长度应在
    6 到 8 个字符之间）。


    请注意，所有内容都应该以小写输入，但用户的全名（可以以“美观格式”输入，例如 Joe Smith）和密码除外。大小写敏感，因此请告知你的用户，在输入用户名和密码时必须使用相同的大小写。


    这里是一个示例会话，我们将添加一个名为 Joe Smith 的用户：


    ```

    mail:-# /sbin/adduser

    User to add (^C quit): smith

    该名称已被占用，请选择另一个。

    User to add (^C quit): smithj

    Editing information for new user [smith]

    Full Name: Joe Smith

    GID [100]:nChecking for an available UID after 500

    First unused uid is 859

    UID [859]:nHome Directory [/home/smithj]:

    ```


    ```

    Shell [/bin/bash]:nMin. Password Change Days [0]:nMax. Password Change Days [30]:
    90

    Password Warning Days [15]:nDays after Password Expiry for Account Locking [10]:
    0

    Password [smith]: FL15339

    Retype:</ FL15339

    抱歉，它们不匹配。

    Password [smith]: FL15339

    Retype:</ FL15339

    Information for new user [smith]:

    Name: Joe Smith

    Home directory: /home/smith

    Shell: /bin/bash

    Uid: 859 Gid: 100

    Min pass: 0 max pass: 99999

    Warn pass: 7 Lock account: 0

    Type ''y'' if this is correct, ''q'' to cancel the program,username you wish to
    change: Y

    ```

