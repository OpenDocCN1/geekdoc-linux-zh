    \ uses “tar” as its backup engine. Therefore, backup sets with KDat can be read\
    \ not only with KDat but with tar as well! This makes KDat a very nice choice\
    \ for both user-friendliness as well as backup portability.\n\n> Tip: Even if\
    \ you choose not to use nor install the full KDE package, you can still use KDat\
    \ as long as you have the Qt libraries installed.\n\nThe first time you run the\
    \ KDat program, you will need to create a backup profile. Such a profile tells\
    \ KDat which files on your system you would like to back up. If you wish, you\
    \ can create more than one backup profile, depending on your needs (for example,\
    \ you could create a profile called “Full Backup” for a full system backup, and\
    \ “Quick Backup” for a backup of user files only.\n\nTo create a backup profile,\
