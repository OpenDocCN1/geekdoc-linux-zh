    该控制器工作非常出色，我不犹豫地向其他寻求硬件 RAID 解决方案的人推荐它！（如果你对在 Linux 系统中配置 RAID 数组感兴趣，请参阅第 11.2
    节获取详情。）


    我们这里还有四台 Linux 系统：一台 Alpha、一台 Sparc 和两台 Intel 机器；其中两台正在生产环境中运行，还有我自家的个人系统，但我不会用这些细节来打扰你。


    本文档将尽可能保持硬件无关性，但如果你了解我在硬件方面的背景，这可能对你有所帮助。


    ## 第 4 章。安装与硬件配置


    本章将详细介绍在 Intel 系统上安装 Red Hat 6.1 所需步骤；无论你选择使用 GUI 还是文本界面进行安装，这些步骤都是相似的。由于其中很大一部分信息已经在《Red
    Hat 用户指南》中详尽记录（该指南以纸质手册的形式提供于“官方”盒装中，包含在 CD 的 `/doc` 目录下，并可通过 ftp://ftp.redhat.com/pub/redhat/redhat-6.1/i386/doc/rhint/index.html
    在线获取），因此我略过了大部分细节。然而，我认为 Red Hat 指南中缺少了一些内容，我将尝试更详细地涵盖这些项目。


    ### 4.1. 创建安装磁盘


    将 Red Hat Linux 分发版安装到系统中的第一步，是找到一种启动安装程序的方法。通常的方法是创建一个安装光盘，尽管如果你是从 CD-ROM 安装，且你的系统
    BIOS 支持，你应该能够直接从 CD 启动进入安装程序。


    否则，要创建一个安装软磁盘，你需要将 `boot.img`（这仅仅是一个 ext2 格式的 Linux 启动磁盘的镜像，其中包含一个额外的安装程序）拷贝到软磁盘上。`boot.img`
    文件可以从 Red Hat CD-ROM 的 `/images` 目录获取，或者通过 FTP 从 ftp://ftp.redhat.com 的 `/pub/redhat/redhat-6.1/i386/images`
    目录下载（假设你正在 Intel 机器上安装 Linux）。


    你可以从 DOS 或 Windows 系统创建启动软磁盘，也可以从现有的 Linux 或 Unix 系统创建。对于目标磁盘，你可以使用未格式化或预先格式化（针对
    DOS）的软磁盘——这没有区别。


    在 DOS 环境下：假设你的 CD-ROM 可识别为 D: 盘，你可以输入：


    ```

    d:

    cd \images

    ..\dosutils\rewrite

    ```


    对于源文件，输入 `boot.img`。对于目标文件，输入 `a-:`（假设你创建的软磁盘已插入 A: 盘）。随后 `rewrite` 程序将把 `boot.img`
    文件拷贝到软磁盘上。


    在 Linux/Unix 环境下：假设 `boot.img` 文件位于当前目录（你可能需要将 CD-ROM 挂载到 `/mnt/cdrom` 并在 `/mnt/cdrom/cdrom`
    中找到文件），你可以输入：


    ```

    dd if=boot.img of=/dev/fd0

    ```


    `dd` 实用程序将其输入文件（`if`，即 `boot.img` 文件）拷贝到输出文件（`of`）`=/dev/fd0`（假设你的软磁盘可以通过 `/dev/fd0`
    访问）。


    除非 Linux 或 Unix 允许对软磁盘设备写入权限，否则你可能需要以超级用户身份执行此命令。（如果你知道 root 密码，输入 `su` 成为超级用户，执行
    `dd` 命令，然后输入 `exit` 回到普通用户状态）。


    通过上述任一方案，你现在应该拥有了一个可引导的 Red Hat 6.1 安装软磁盘，你可以用它来安装新的 Red Hat Linux 系统了！


    ### 4.2. 启动 Linux 安装程序


    要启动新的 Red Hat 系统，要么从安装 CD 启动，要么将软磁盘插入系统的 A: 盘，然后重启或开机系统。几分钟后，Red Hat 安装程序界面将会出现。


    在大多数情况下，你只需按 `<Enter>` 即可开始安装过程，但如果你是明确知道应该如何设置硬件设备的资深用户，可以输入 `expert` 以获得该功能提供的额外信息和提示。（如果你什么都不做，默认安装程序将在安装界面出现后
    10 到 15 秒内开始。）


    随后，你将被要求选择语言（“English”）和键盘类型（即使在加拿大，我也选择“US 101-key”），以及安装位置（从 CD-ROM 或网络安装）。Red
    Hat 的安装位置非常灵活。


    '
