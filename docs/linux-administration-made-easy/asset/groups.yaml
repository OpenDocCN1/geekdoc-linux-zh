    # 7.4. Windows-style File and Print Services with Samba


    Linux can provide SMB services (eg. Wf, Win95, and NT-style network file & printer
    sharing), using the Samba package. This section will describe how to configure
    shares, and how to access them from client machines.


    The Samba package is included with the Red Hat distribution, you can check if
    it is installed and what version you have by typing:


    ```

    rpm -q samba

    ```


    If it isn''t installed, you will need to install it using the RPM utility. See
    Section 10.1 for details on how to do this.


    The most important Samba files you should concern yourself with are:


    /etc/smb.conf


    Samba configuration file where shares and other configuration parameters are set
    up (see below)


    /var/log/samba/


    Location of Samba log files


    /home/samba/


    Suggested location where file shares should be set up. However, you should choose
    a location where you have enough space on the file system to accommodate the files
    you will store. Personally, I usually set up a large partition mounted on /archive/
    and place my shares here.'
  - "[PAGE 62]\n\n# Chapter 7. Custom Configuration and Administration Issues\n\n\
    The file `/etc/smb.conf` contains configuration information on file & print shares.\
    \ The first few lines of the file contain global configuration directives, which\
    \ are common to all shares (unless they are over-ridden on a per-share basis),\
    \ followed by share sections.\n\nThe Samba installation includes a default smb.conf\
    \ file in many cases should be adequate for your needs and require only a few\
    \ changes.\n\nHere is an example of this file (which I have heavily customized\
    \ to show you some of the most important and interesting options):\n\n```\n# Items\
    \ common to all shares (unless over-ridden on a per-share basis)\n[global]\n \
    \ # Number of minutes of inactivity be-\nclient is disconnected\n  # to avoiding\
    \ consume-\nresources.  Most clients will automatically\n  # reconnect so this\
    \ is a good idea to enable.\ndead time = 10\n```\n\n```\n# Don't let users connect\
    \ as \"root\", just-in-case. :-\ninvalid users = root\n```\n\n```\n# Specify the\
    \ ac-\ncount for guest shares (shares that don't require\n  # password to connect\
    \ to. This user-\nname must be a valid user\n  # in the /etc/passwd file.\nguest\
    \ account = guest\n```\n\n```\n# Specify where log files should be writ-\nten\
    \ to. The \"%%m\" suffix.\n  # means that log files will be created in the format\n\
