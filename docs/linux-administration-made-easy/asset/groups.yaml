    \n## 6.6. Linux Password & Shadow File Formats\n\nTraditional Unix systems keep\
    \ user account information, including one-way encrypted passwords, in a text file\
    \ called `/etc/passwd`. This file is used by many tools (such as `ls`) to display\
    \ file ownership, by matching user ID # with the user's names, the file needs\
    \ to be world-readable. Consequently, this can be somewhat of a security risk.\n\
    \nAnother method of storing account information, that I always use, and is the\
    \ shadow password format. With the traditional method, this method stores account\
    \ information in the /etc/passwd file in a compatible format. In the /etc/passwd\
    \ file in a compatible format. However, the password is stored as a single “x”\
    \ character (ie. not stored in this file). A second file, called `/etc/shadow`,\
    \ contains encrypted password as well as other information such as account or\
    \ password expiration values, etc. The /etc/shadow file is readable only by the\
    \ root account and is therefore less of a security risk.\n\nWhile some other Linux\
    \ distributions forces you to install the Shadow Password Suite in order to use\
    \ the shadow format, Red Hat makes it simple. To switch between the two formats,\
    \ type (as root):\n\n```\n/usr/sbin/pwconv To convert to the shadow format\n/usr/sbin/pwunconv\
    \ To convert back to the traditional format\n```\n\nWith shadow passwords, the\
    \ `/etc/passwd` file contains account information, and looks like this:\n\n```\n\
    smithj:x:561:561:Joe Smith:/home/smithj:/bin/bash\n```\n\nEach field in a passwd\
    \ entry is separated with \":\" colon characters, and are as follows:\n\n- Username,\
    \ up to 8 characters. Case-sensitive, all lowercase\n- An \"x\" in the password\
    \ field. Passwords are stored in the \"/etc/shadow\" file.\n- Numeric user id.\
    \ This is assigned by the \"adduser\" script. Unix uses this file, plus the following\
    \ group id, to identify which files belong to the user.\n- Numeric group id. Red\
    \ Hats use group id in a fairly unique manner for enhanced file security. The\
    \ usual group id will match the user id.\n- Full name of user. I'm not sure what\
    \ the maximum length for this field is, but try to keep it reasonable (under 30\
    \ characters).\n- User's home directory. Usually /home/username (e.g. /home/smithj).\
    \ All user's personal files, web pages, mail forwarding, etc. will be stored here.\n\
    - User's \"shell account\". Often set to \"/bin/bash\" to provide access to the\
    \ bash shell (my personal favorite shell).\n\nPerhaps you do not wish to provide\
    \ shell accounts for your users. You could create a script file named /bin/sorry,\
    \ for example, that would display some kind of error message and log the user\
    \ off, and then set this script as their default shell.\n\n> Note: If the account\
    \ needs to provide \"FTP\" transfers to update web pages, etc. then the shell\
    \ account will need to be set to \"/bin/bash\" – and then special permissions\
    \ will need to be set up in the user's home directory to prevent shell logins.\
    \ See Section 7.1 for details on this.\n\nThe \"/etc/shadow\" file contains password\
    \ and account expiration information for users, and looks like this:\n\n```\n\
    smithj:Ep6mckrOLCH::10063:0:99999:7:::\n```\n\nWith the passwd file, each field\
    \ in the shadow file is also separated with \":\" colon characters, and are as\
    \ follows:\n\n- Username, up to 8 characters. Case-sensitive, usually all lowercase.\
    \ A direct match to the username in the /etc/passwd file.\n- Password, 13 character\
    \ encrypted. A blank entry (eg. ::) indicates a password is not required to log\
    \ in (usually a bad idea), and a \"*\" entry (eg. **) indicates the account has\
    \ been disabled.\n- The number of days (since January 1, 1970) since the password\
    \ was last changed.\n- The number of days before password may be changed (0 indicates\
    \ it may be changed at any time)\n- The number of days before password may be\
    \ changed (0 indicates it may be changed at any time)\n- The number of days after\
    \ password must be changed (99999 indicates it never expires)\n- The number of\
    \ days until password expires (7 indicates one week warning)\n- The number of\
    \ days of inactivity (since January 1, 1970) before the account is locked\n- The\
    \ number of days since password was last changed (since January 1, 1970)\n- Reserved\
    \ field.\n\n## 6.7. System Shutdown and Restart\n\nTo shut down the system, type\
    \ `shutdown -h now`. This will halt the system and power it off. If you wish to\
    \ reboot instead, use `shutdown -r now`. You can also schedule a shutdown for\
    \ the future, for example, `shutdown -h +10` which will shut down the system in\
    \ 10 minutes. To cancel a scheduled shutdown, use `shutdown -c`.\n\nMessages can\
    \ also be sent to online users during the shutdown command.\n\n> Tip: If you wish\
    \ to provide some kind of warning to online users, substitute a time value instead\
    \ of \"now\". For example, `shutdown -h +5 \"System maintenance\"` would inform\
    \ users why the system is down.\n\n## Chapter 7. Custom Configuration and Administration\
    \ Issues\n\nFor both personal use as well as work, I was able to start with a\
    \ standard installation of Red Hat Linux and provide services out-the-box with\
    \ little or no changes.\n\nHowever, there were a number of small changes and extra\
    \ services that were necessary to provide all of the services in use. The local\
    \ administrator should be aware of the following:\n\n- /etc/rc.d/rc.local file\
    \ is executed upon start-up and contains any extra services you have added to\
    \ your server that should be executed upon boot.\n- Look in /etc for any site-specific\
    \ changes that may be required. These may include:\n  - /etc/inetd.conf (you should\
    \ ensure unnecessary services are disabled such as fetch, echo; as well as add\
    \ or change any services you may need)\n  - /etc/exports (contains a list of hosts\
    \ allowed to mount NFS volumes; see Section 7.6 for details)\n  - /etc/nntpserver\n\
    \  - /etc/lilo.conf (contains information for the LILO boot loader – the process\
    \ which loads the Linux kernel upon bootup; see Section 4.8 for details)\n  -\
    \ /etc/sudoers (a list of users who should be given special privileges, along\
    \ with the commands they are allowed to execute)\n  - /etc/named.boot (for DNS\
    \ use; see Section 7.2 for details)\n\nAnything in /usr/local/ (and subdirectories)\
    \ are extra packages or modifications to existing ones you have installed, if\
