    ## 4.8. Booting with LILO


    Next, the installation program needs to write a boot loader to your hard drive.
    The boot loader (LILO on Intel systems) is responsible for booting Linux along
    with any other operating systems if you have set up your system for multi-boot
    (see Section 4.8.1 for details on this).


    The "Lilo Installation" dialog box will ask you to choose the boot loader image
    should be written to. You''ll likely want to install it on the master boot record
    of your first drive (usually /dev/sda for IDE, /dev/sda for SCSI).


    Once you have selected the location for writing the boot loader, a second dialog
    box will appear, allowing you to enter boot-time configuration parameters. Usually
    you don''t need to enter anything, but if you have more than 64 Mb of RAM you
    don''t need to enter a special parameter in order to make Linux use of the extra
    RAM (otherwise, it will only use the first 64 Mb). For example, if your system
    has 128 Mb of RAM, you should enter:


    If your system has SCSI drives, or wish to install LILO on a partition with more
    than 1023 cylinders, it may be necessary to enable the option to "Use linear mode".
    If it is not, enabling this option shouldn''t hurt anything, so it is probably
    a good idea to do so.


    ### 4.8.1. Multi-boot with Other Operating Systems


    Finally, if you''ve set up your system to multi-boot Linux with other operating
    system(s), you''ll be presented with a third dialog box which lists the available
    partitions. Here, you can assign names to your other operating systems (which
    you enter at the "LILO" prompt at boot to boot your desired operating system).
    The installation program does assign default names to each bootable partition,
    so it isn''t necessary to change them unless you don''t like the defaults.


    The default operating system that will boot upon system start will, of course,
    be Linux. However, if you wish, you can change the default to any of the other
    operating systems you have defined.


    After installing the boot loader on your hard drive, the installation program
    should hopefully present you with a “Congratulations!” dialog box, indicating
    that Linux has been successfully installed. Remove the installation floppy diskette
    (if any), and press <Enter> to reboot into Linux!


