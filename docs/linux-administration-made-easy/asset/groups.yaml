    \n- `/etc/rc.d/rc.local` 文件在启动时执行，包含了你添加到服务器的任何应在启动时执行的额外服务。\n- 检查 `/etc` 下可能需要的特定站点更改。这些可能包括：\n\
    \  - `/etc/inetd.conf`（你应该确保禁用不必要的服务如 fetch、echo；并添加或更改你需要的服务）。\n  - `/etc/exports`（允许挂载\
    \ NFS 卷的主机列表；详情参见第 7.6 节）。\n  - `/etc/nntpserver`\n  - `/etc/lilo.conf`（包含 LILO\
    \ 引导器的信息 —— 启动时加载 Linux 内核的过程；详情参见第 4.8 节）。\n  - `/etc/sudoers`（赋予特殊权限的用户列表以及他们被允许执行的命令）。\n\
    \  - `/etc/named.boot`（用于 DNS；详情参见第 7.2 节）。\n\n`/usr/local/` 及其子目录中的任何内容都是是从压缩包等安装而非使用\
    \ RPM 安装时产生的额外包或对现有包的修改。（或者至少，你应该将它们安装在这里。）这些文件，特别是 `/usr/local/src/` 下的文件，应该保持更新。详情参见第\
    \ 10 章。\n\n"
