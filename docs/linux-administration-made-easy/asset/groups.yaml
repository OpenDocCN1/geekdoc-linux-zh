    Linux 文档项目主页 http://metalab.unc.edu/LDP/，查看是否有更新版本。


    目前本文档应被视为中期测试版（moderate-beta）。我从 1997 年开始编写，并在时间允许的情况下继续更新。开源社区的发展仍在快速进行，有时要保持本文档更新是一项挑战。因此，本文档可能包含一个或多个过过信息的章节。


    简而言之，我不保证其中任何信息的准确性。如果它对你有帮助，那太好了！


    ## 1.3. 帮助的请求


    如果你发现本文档有用并想表达感谢之意，请考虑向当地的食物银行捐赠一两种食物。


    # 第二章 简介


    Linux 2.2.0 版本于 1999 年 1 月 25 日发布：迈向世界统治……


    也许你是 Linux 的新手，希望找到一份关于你可能需要定期配置和管理任务的总结。如果这听起来像你的情况，那么本文档正是你一直在寻找的内容！


    ## 2.1. 范围


    本文档将尝试总结安装和配置，以及为了保持 Linux 服务器或桌面系统运行而应遵循的日常管理和维护程序。它并不是旨在对 Unix 操作进行全面概述，因为已有许多优秀的书籍以及在线文档，在需要更详细信息时可以参考。


    通常，你的 Linux 系统只需最少的用户维护即可运行。常规任务（如系统日志轮转和删除）是自动化的。因此，在大多数情况下，即使用户干预极少，Linux 也能良好运行。但在有自定义需求或系统故障的情况下，本文档可能会有用。


    我目前在家和工作中都使用 Linux。它对我很好，已经为我的雇主提供了稳定的互联网和文件/打印服务。


    ## 2.2. 选择 Linux 发行版


    有多种 Linux 发行版可供选择。每个发行版提供相同的 Linux 内核和系统工具，但在安装方法和捆绑应用程序上有所不同。每个发行版都有自己的优缺点，因此在决定之前，花点时间研究特定发行版提供哪些功能是明智的。


    以下是一些你可以访问的网站列表，它们将描述特定的 Linux 发行版，并提供有关如何下载或购买它的信息：


    - http://www.redhat.com/


    Red Hat 发行版由商业供应商 Red Hat Software 开发，是最流行的发行版之一。由于可以选择图形界面（GUI）和文本界面安装程序，Red
    Hat 6.1 可能是最容易安装的 Linux 发行版。它通过“RPM”工具提供了方便的升级和包管理，并包含了 GNU 网络对象模型环境（GNOME）和“K
    桌面环境”（KDE），两者都是 X Window 系统流行的 GUI 窗口管理器。该发行版适用于 Intel、Alpha 和 Sparc 平台。


    - http://www.debian.org/


    Debian 发行版由名为“Debian 项目”的非营利组织开发，是开源社区的宠儿。它同样通过“dpkg”工具提供了方便的升级和包管理。该发行版适用于 Intel、Alpha、Sparc
    和 Motorola（Macintosh, Amiga, Atari）平台。


    - http://www.suse.com/


    S.u.S.E 发行版由商业供应商 S.u.S.E. 开发，是另一个流行的发行版，也是欧洲领先的发行版。它包含了“K 桌面环境”（KDE），并通过“YAST”工具提供了方便的升级和包管理。该发行版适用于
    Intel 和 Alpha 平台。


    - http://www.caldera.com/


    OpenLinux 发行版由商业供应商 Caldera 开发，面向企业用户。随着新的 2.2 版本发布，Caldera 以其似乎最易安装的特性提高了门槛。此外，它还配备了“K
    桌面环境”（KDE）。该发行版适用于 Intel 平台。


    - http://www.mandrake.com/


    Mandrake 发行版由商业供应商 MandrakeSoft 开发，将 Red Hat（你的选择）与额外的软件集成。


    - http://www.slackware.com/


    Slackware 发行版由 Walnut Creek Software 的 Patrick Volkerding 开发，是现代发行版的祖祖。提供相当简单的安装，但升级和包管理较差。该发行版适用于
    Intel 平台。


    '
