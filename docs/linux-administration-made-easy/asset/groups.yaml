    ## 第3章 Linux 概述


    欢迎来到 Linux！


    ### 3.1. 什么是 Linux？


    Linux 是一种真正的 32 位操作系统，运行在多种不同的平台上，包括 Intel、Sparc、Alpha 和 Power-PC（在其中某些平台上，如 Alpha，它实际上是
    64 位的）。虽然也有其他端口可用，但我没有那方面的经验。


    Linux 最早于 20 世纪 90 年代初由一位芬兰的小学生林纳斯·托瓦尔斯（Linus Torvalds）开发。当时 Linux 有一个“尖端”的 386
    minix，决定编写一个基于 286 的 Minix 系统（一种主要用于操作系统课程的小型类 Unix 实现）的替代品，以利用当时新芯片上提供的额外指令集，并开始编写一个简单的裸机内核。


    最终，他在 USENET 组 comp.os.minix 中宣布了他的小项目，邀请感兴趣的人士查看并为该项目做出贡献。结果是惊人的！


    Linux 有趣的一点在于，它是完全免费的！Linux 决定采用自由软件基金会（Free Software Foundation）的 GNU GPL 许可证，这意味着代码受版权保护——但这种保护意味着它必须始终对他人可用。


    免费意味着——你可以免费获取它，免费使用它，你甚至可以自由出售它以获利（这听起来并不奇怪；包括红帽（Red Hat）在内的几家机构将标准 Linux 内核、一组
    GNU 工具打包，并附上他们自己“口味”的包含应用程序，将其作为发行版出售。一些常见且流行的发行版有 Slackware、Red Hat、SuSE 和 Debian！很棒的一点是你可以访问源代码，这意味着你可以根据自己的需求对操作系统进行定制，而不是迎合大多数商业厂商“目标市场”的需求。


    Linux 可以且应该被视为 Unix 的完整实现。然而，它不能被称为“Unix”；这并不是因为不兼容或功能性匮乏，而是因为“Unix”一词是 AT&T 的注册商标，该词的使用仅在许可协议下才允许。


    Linux 与任何其他操作系统解决方案一样，拥有同样的支持、可靠性和可行性（嗯，在我看来，它甚至比它们要好得多！）。然而，由于其起源、背后的哲学以及缺乏数百万美元的营销活动，关于它流传着很多神话。人们对这个精彩的操作系统还有很多需要学习！


    ### 3.2. 打破神话


    我已经使用 Linux 几年了，我认为我对这个操作系统以及它能做和不能做什么有一定的了解。作为一名热衷的 USENET 读者，我关注最新的进展，当然还有各种必然出现的“口战”（那些该死的交叉发帖倡导者！:-)
    ））。我见过的神话比很多人认为的要多（这些神话通常被称为 FUD——“恐惧、不确定性、怀疑”，这似乎是商业技术供应商用来恐吓其市场远离竞争技术的一种常用策略）。所以，让我来试着列举几个最常见的神话，并尝试打破它们
    :-)


    -   Linux 是免费软件（freeware），因此它是一个玩具。


    某些人似乎有这样观念：由于某件软件是由没有营利动机的志愿者编写的，其结果显然必然逊于商业级产品。


    这在过去可能是事实（我的意思是，在 DOS 和早期 Windows 世界中，有很多免费软件完全是垃圾），但在最近这绝对不是事实。


    互联网的力量让全球最聪明的人聚集在一起成为可能，让他们对他们感兴趣的项目进行协作。参与开发 Linux 或成千上万 GNU 工具和应用程序包的人来自不同的背景，他们所有人对于想要贡献都有不同的个人理由。


    有些人是硬核黑客，出于对编码的热爱而开发；另一些人有某些需求（例如，工作局域网的网络流量监控器）并决定自己编写；还有一些人是学者和计算机科学家，他们使用 Linux
    进行研究。


    与开发并销售包但排除源代码的商业产品不同，Linux 中使用的用户代码会受到任何有兴趣和能力的人审查、调试和改进。这种同行评审的行为是 Linux 能够提供如此高可靠性和高性能的原因之一。


    不要忘记：互联网本身几乎完全构建并运行在开源项目之上。你每天与世界各地的人交换的电子邮件有 80% 的概率由 Sendmail 处理其中一个或两个；你在“冲浪”网网时浏览的网页，全球
    50% 以上的网站是由 Apache 为你提供的。这对你来说足够可靠吗？


    -   Linux 没有支持。


    听到这个神话让我感到有些反感。而且据称“其他”厂商确实提供支持？我个人用过一个非常流行的商业操作系统，该厂商所谓的“支持”完全没用处。


    首先，Linux 是有支持的。是的，商业支持。有些公司可以根据你愿意支付的费用提供大量支持，提供电话和电子邮件支持，许多公司甚至愿意直接上门为你解决问题！


    然而，在你遇到 Linux 的 99% 情况下，只要你能从社区获得帮助，就能完成你的愿望。Linux 社区庞大且活跃，并且乐于提供帮助。有无数的论坛、邮件列表和网站，你可以在那里找到你问题的答案。


    ### 3.3. 一个用户的视角


    '
