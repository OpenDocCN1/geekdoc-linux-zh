    | Partition | Suggested Size |

    | :--- | :--- |

    | (swap) | about double main RAM (eg. 64 Mb sys) |

    | /(root) | about 10% of available (eg. 200 Mb) |

    | /home | about 20% of available (eg. 400 Mb) |

    | /usr | any remaining space (eg. 1272 Mb) |

    | /var | (optional - see below) |

    | /boot | (optional - see below) |

    | /archive | (optional - see below) |


    Of course, the base amounts are approximate guidelines only. Obviously you are

    going to juggle these percentages around a bit depending on what you are

    going to use your Linux system. If you are going to doing stuff adding lots

    of bulky applications as WordPerfect or Netscape, or perhaps adding Japanese

    character support, you would probably benefit from a bit more /usr.


    I always seem to have a lot of space available on /home, if your users aren''t

