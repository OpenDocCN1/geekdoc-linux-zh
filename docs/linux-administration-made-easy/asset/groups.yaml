    “Securing RedHat 5.x” document is available at http://redhat-security.ens.utulsa.edu/


    An excellent resource for Linux crypto and related software is at http://replay.com/redhat.


    ## Chapter 13. Help! Trouble in Paradise!


    Linux is earning a reputation world-wide for its performance and reliability.
    Nevertheless, no system is perfect, and from time to time you are bound to hit
    a snag. Fortunately, with uptimes we measuring in the months (compared to measuring
    in the days or weeks with NT), such snags will likely be few and far between.


    ### 13.1. Getting Linux Installed on new, Unsupported Hardware


    ( Under construction )


    ### 13.2. File System Corruption after Power Outage or System Crash


    Although Linux is a stable system, should it happen to crash unexpectedly (perhaps
    due to a kernel bug, or perhaps due to a power outage), your file system(s) will
    not have been unmounted and therefore will be automatically checked when Linux
    is restarted.


    Most of the time, any file system problems are minor ones caused by file not being
    written to the disk, such as deleted inodes still in use. In the majority of cases,
    the file system check will be able to detect and repair such anomalies automatically,
    and upon completion the boot process will continue normally.


    Should a file system problem be more severe (such problems tend to be caused by
    faulty hardware such as a bad drive or memory chip; something to keep in mind
    should file system corruption happen frequently), the file system check may not
    be able to repair the problem. This is usually, but not always, the case when
    the root file system is corrupted. In this case, the Red Hat boot process will
    display an error message and drop you into a shell, allowing you to attempt file
    system repairs.


    The recovery shell unmounts all file systems, and then mounts the root file system
    ‘read-only’, you will be able to perform file system checks using the appropriate
    utilities. Likely you will be able to run e2fs on the corrupted file system(s)
    which should hopefully resolve all the problems found.


    After you have (hopefully) repaired any file system problems, simply exit the
    shell to have Linux reboot the system and attempt a subsequent restart.


    Naturally, to be prepared for situations such as a non-recoverable file system
    problem, you should have one or more of the following things available to you:


    - * The boot/root emergency disk set, AND/OR

