- md: "\n# Chapter 7. Custom Configuration and Administration Issues\n\nMore information\
    \ on configuring DNS services can be found in the “DNS-HOWTO” guide at http://metalab.unc.edu/Linux/HOWTO/DNS-HOWTO-5.html.\n\
    \n## 7.3. Internet User Authentication with TACACS\n\nAt my place of employment,\
    \ TACACS authentication of dial-up Internet users (who are connecting to our modem\
    \ pool which in turn connected to a couple of Cisco 250x access servers), we are\
    \ using the Vikas version of “tacacssd”.\n\nAfter compiling and installing the\
    \ Vikas package latest are available from ftp/ftp.navya.com/pub/vikas; I don't\
    \ believe the package is available in RPM format, you should add the following\
    \ entries to the “/etc/inetd.conf” file so that the daemon be loaded by the inetd\
    \ daemon whenever a TACACS request is received.\n\n```\n# TACACS is a user authentication\
    \ protocol used for Cisco Router products.\ntacacs dagram udp root /etc/tacacssd\
    \ tacacssd c /etc/tacacssd-conf\n```\n\nNext, you should edit the “/etc/tacacssd-conf”\
    \ file and customize it, as necessary, for your system (however you will probably\
    \ be able to use the default settings as-is).\n\n> Note: If you are using shadow\
    \ passwords (see Section 6.6 for details), you will have some problems with this\
    \ package. Unfortunately, PAM (Pluggable Authentication Module), which Red Hat\
    \ has for user authentication, is not supported by this package. One workaround\
    \ that I use is to keep a separate “passwd” file in “/usr/local/tacacs/etc/” which\
    \ matches the one in /etc/ but be non-shadowed. This is a bit of a hassle, and\
    \ if you choose to do this sure you set permissions on the other password file\
    \ to make sure it is only readable by root:\n\n```\nchmod a-wr,u+r /usr/local/tacacs/etc/passwd\n\
    ```\n\nIf you do indeed shadow, you will most certainly need to edit the \"/etc/xtacsd-conf\"\
    \ file and location of the non-shadowed password file (assuming you are using\
    \ the workaround I have suggested above).\n\nThe next step is to configure your\
    \ access server(s) to authenticate logins for the desired devices (such as dial-up\
    \ modems) with TACACS. Here is a sample session on how this is done:\n\n```\n\
    mail:/tftpboot# telnet xyzrouter\n\nEscape character is '^'.\nUser Access Verification\n\
    Password: ****\nxyzrouter# enable\nPassword: ****\nxyzrouter# config terminal\n\
    Enter configuration commands, one per line. End with CNTL/Z.\nxyzrouter(config)#\
    \ tacacs-server attempts 3\nxyzrouter(config)# tacacs-server authenticate connections\n\
    xyzrouter(config)# tacacs-server extended\nxyzrouter(config)# tacacs-server host\
    \ 123.12.41.41\nxyzrouter(config)# tacacs-server notify connections\nxyzrouter(config)#\
    \ tacacs-server notify enable\nxyzrouter(config)# tacacs-server notify logouts\n\
    xyzrouter(config)# tacacs-server notify slip\nxyzrouter(config-line)# line 2 10\n\
    xyzrouter(config)# login tacacs\nxyzrouter(config)# exit\nxyzrouter# write\nBuilding\
    \ configuration...\n[OK]\nxyzrouter# exit\n```\n\nConnection closed by foreign\
    \ host.\n\nAll TACACS activity log messages will be recorded \"/var/log/messages\"\
    \ for your perusal.\n\n## 7.4. Windows-style File and Print Services with Samba\n\
    \nLinux can provide SMB services (eg. Wf, Win95, and NT-style network file & printer\
    \ sharing), using the Samba package. This section will describe how to configure\
    \ shares, and how to access them from client machines.\n\nThe Samba package is\
    \ included with the Red Hat distribution, you can check if it is installed and\
    \ what version you have by typing:\n\n```\nrpm -q samba\n```\n\nIf it isn't installed,\
    \ you will need to install it using the RPM utility. See Section 10.1 for details\
    \ on how to do this.\n\nThe most important Samba files you should concern yourself\
    \ with are:\n\n- `/etc/smb.conf`: Samba configuration file where shares and other\
    \ configuration parameters are set up (see below)\n- `/var/log/samba/`: Location\
    \ of Samba log files\n- `/home/samba/`: Suggested location where file shares should\
    \ be set up. However, you should choose a location where you have enough space\
    \ on the file system to accommodate the files you will store. Personally, I usually\
    \ set up a large partition mounted on /archive/ and place my shares here.\n\n\
    The file `/etc/smb.conf` contains configuration information on file & print shares.\
    \ The first few lines of the file contain global configuration directives, which\
    \ are common to all shares (unless they are over-ridden on a per-share basis),\
    \ followed by share sections.\n\nThe Samba installation includes a default smb.conf\
    \ file in many cases should be adequate for your needs and require only a few\
    \ changes.\n\nHere is an example of this file (which I have heavily customized\
    \ to show you some of the most important and interesting options):\n\n```\n# Items\
    \ common to all shares (unless over-ridden on a per-share basis)\n[global]\n \
    \ # Number of minutes of inactivity be-\n  client is disconnected\n  # to avoiding\
    \ consume-\n  resources.  Most clients will automatically\n  # reconnect so this\
    \ is a good idea to enable.\n  dead time = 10\n```\n\n```\n# Don't let users connect\n\
    [global]\n  # Number of minutes of inactivity be-\n  client is disconnected\n\
    \  # to avoiding consume-\n  resources.  Most clients will automatically\n  #\
    \ reconnect so this is a good idea to enable.\n  dead time = 10\n```\n\n```\n\
    # Items common to all shares (unless over-ridden on a per-share basis)\n[global]\n\
    \  # Number of minutes of inactivity be-\n  client is disconnected\n  # to avoiding\
    \ consume-\n  resources.  Most clients will automatically\n  # reconnect so this\
    \ is a good idea to enable.\n  dead time = 10\n```\n\n```\n# Don't let users connect\n\
    [global]\n  # Number of minutes of inactivity be-\n  client is disconnected\n\
    \  # to avoiding consume-\n  resources.  Most clients will automatically\n  #\
    \ reconnect so this is a good idea to enable.\n  dead time = 10\n```\n\n```\n\
    # Items common to all shares (unless over-ridden on a per-share basis)\n[global]\n\
