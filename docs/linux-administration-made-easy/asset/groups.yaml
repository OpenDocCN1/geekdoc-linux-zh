    If you do indeed shadow, you will most certainly need to edit the

    "/etc/xtacsd-conf" file and location of the non-shadowed password file (assuming

    you are using the workaround I have suggested above).


    The next step is to configure your access server(s) to authenticate logins for
    the desired

    devices (such as dial-up modems) with TACACS. Here is a sample session on how
    this is done:


    ```

    mail:/tftpboot# telnet xyzrouter


    Escape character is ''^''.

    User Access Verification

    Password: ****

