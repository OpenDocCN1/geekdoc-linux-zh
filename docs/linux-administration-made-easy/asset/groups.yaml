    ## 5.3. 改进 X 下的字体外观


    坦率地说，X 从来不是以具有特别吸引力的字体而闻名的。事实上，许多人接受了这样观点：拥有丑陋、难看的字体是 X 系统中一种不幸的命运。


    幸运的是，在 X 下可以显著改善字体的外观并增加你可以使用的字体数量。事实上，如果你有一份 Windows 系统，你甚至可以从该平台复制 TrueType
    字体并在 X 下使用它们！这种字体支持是通过使用如 "xfsft" 或 "xfs" 这样的字体服务器来实现的。


    红帽 6.1 现在内置了对 "xfs" 的支持，并开箱即提供了吸引人的字体支持。因此，如果你正在使用这个版本的 Linux，你可以对现状感到满意。不过，你仍然可以采取一些措施来进一步改进，如果你有
    TrueType 字体，也可以使用它们。


    要启用 TrueType 字体支持，创建一个目录（例如 "/usr/local/share/ttfonts"），并从你的 Windows 系统（可以在 "c:\windows\fonts"
    目录中找到）复制任何或所有字体文件到新目录。


    > 提示：如果你没有可用的 TrueType 字体，可以直接从微软官网下载：http://www.microsoft.com/typography/fontpack/default.htm。


    要使用这些字体，在新的 "ttfonts" 目录中，输入以下命令（作为 root）：


    ```

    ttmkfdir -o fonts.scale

    mkfontdir

    ```


    接下来，编辑 "/etc/X11/fs/config" 文件，将你的新字体目录添加到现有目录列表中。此外，将默认点大小（point-size）从 120 改为
    140，这将为你提供更大、更易读的字体。


    最后，退出 X（如果你还没有退出），并按照如下方式重启你的 xfs 服务：

    /etc/rc/init.d/xfs restart


    最后，重启 X 并享受你光丽的新字体！


    关于改进 X 下字体支持的更多详细信息，有一个非常优秀的资源名为 "XFree86 Font Deugification Mini HOW-TO"，地址为：http://www.frii.com/~meldroc/Font-Deugification.html。


