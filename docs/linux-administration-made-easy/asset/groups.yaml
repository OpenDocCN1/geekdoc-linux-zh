    communications. Perhaps it is vital for you to communicate with certain users
    at the black-listed domain. In this case, Sendmail allows you to override these
    domains to allow their e-mail to be received. Simply edit the "/etc/mail/access"
    file in the manner described above with the appropriate domain information. For
    example:


    ```

    blacklisted.domain    OK

    ```


    Don''t forget to rebuild your access.db file (described above)!


    If you decide to subscribe to the RBL, it is probably a wise idea to inform your
