- md: "\n# Chapter 7. Custom Configuration and Administration Issues\n\n## 7.1. Web\
    \ Server and HTTP Caching Proxy Administration\n\n> (WARNING: DISREGARD THIS SECTION!)\n\
    \n6. If the user needs to have e-mail forwarding enabled you could create a .forward\
    \ file which simply has the proper e-mail as the first and only line in the file.\
    \ \nThat's it. The user can use FTP to update the pages.\n\n## 7.2. Domain Name\
    \ Server (DNS) Configuration and Administration\n\nAt place of employment, we\
    \ are using Linux as a DNS server. It performs exceptionally well. This section\
    \ will address configuration of DNS tables for these services using the BIND 8.x\
    \ package which comes standard with the Red Hat distribution.\n\nNote: Red Hat\
    \ versions 5.1 and earlier the BIND 4.x package, which used a slightly different\
    \ format for its configuration file. BIND 8.x offers more functionality than that\
    \ offered by BIND 4.x, and as 4.x is no longer being developed, you should consider\
    \ upgrading your BIND package to the latest version. Simply install the BIND RPM\
    \ package (see Section 10.1 for details using the RPM utility), then convert your\
    \ configuration file to the new format.\n\nFortunately, converting your existing\
    \ BIND 4.x configuration file to be compliant with BIND 8.x is easy! In the documentation\
    \ provided as part of BIND (for example, \"/usr/doc/bind-8.1.2/\" for BIND version\
    \ 8.1.2), there exists a file called \"named-bootconf.pl\", which is an executable\
    \ Perl program. Assuming you have Perl installed on your system, you can use this\
    \ program to convert your configuration file. To do so, perform the following\
    \ commands (as root):\n\n```bash\ncd /usr/doc/bind-8.1.2/\n./named-bootconf.pl\
    \ < /etc/named.boot > /etc/named.conf\nmv /etc/named.boot /etc/named.boot-obsolete\n\
    ```\n\nYou should now have an \"etc/named.conf\" file which should look like BIND\
    \ 8.x \"out-of-the-box\". Your existing DNS tables will work as-is with the new\
    \ version of BIND, as the format of the tables remains the same.\n\nConfiguration\
    \ of DNS services under Linux involve the following steps:\n\n- 1. To enable DNS\
    \ services, the \"etc/host.conf\" file should look like this:\n\n```conf\n# Lookup\
    \ names via /etc/hosts first, then by DNS query order\nhosts, bind\n# We don't\
    \ have machines with multiple addresses Check for IP address spoofing\nnospoof\
    \ on\n# Warn if someone attempts to spoof\nalert on\n```\n\nThe extra spoof detection\
    \ adds a bit of a performance hit DNS lookups (although negligible), so if you're\
    \ not too worried about this you may wish to disable the \"nospool\" and \"alert\"\
    \ entries.\n\n- 2. Configure the \"/etc/hosts\" file as needed. Typically there\
    \ doesn't need to be in here, but for improved performance you can add any hosts\
    \ you access (such as local servers) to avoid performing DNS lookups on them.\n\
    \n- 3. The \"/etc/named.conf\" file should be configured to point to your DNS\
    \ tables according to the example below.\n\n> (Note: IP addresses shown are examples\
    \ only and must be replaced with your own class addresses!)\n\n```conf\noptions\
    \ {\n// DNS tables are located in the /var/named directory \"/var/named\"\n\n\
    // Forward any unresolved requests to our ISP's name server\n// (this is an example\
    \ IP address only - do not use!)\nforwarders {\n123.12.40.17;\n}\n/*\n* If there\
    \ is a firewall between you and name-servers you want\n* to talk to, you might\
    \ need to uncomment the query-source\n* directive below. Previous versions of\
    \ BIND always asked\n* questions using port 53, but BIND 8.1 uses an unprivileged\n\
    * port by default.\n*/\n// query-source address * port 53;\n};\n\n// Enable caching\
    \ and load root server zone \"named.root\" {\ntype hint;\nfile \"\";\n};\n\n//\
    \ All DNS information stored in /var/named/mydomain_name.db\n// (eg. if mydomain.name\
    \ = foobar.com then use foobar.db)\nzone \"mydomain.name\" {\ntype master;\nfile\
    \ \"mydomain_name.db\";\nallow-transfer { 123.12.41.0 };\n};\n\n// Reverse lookups\
    \ for 123.12.41.*, .42.*, .43.*, .44.* class C's\n// (these are example C's -\
    \ do not use!)\nzone \"41.12.123.in-addr.arpa\" {\ntype master;\nfile \"123_12.rev\"\
    ;\nallow-transfer { 123.12.41.0 };\n};\n\n// Reverse lookups for 126.27.18.*,\
    \ .19.*, .20.* class C's\n// (these are example C's - do not use!)\nzone \"18.27.126.in-addr.arpa\"\
    \ {\ntype master;\nfile \"126_27.rev\";\nallow-transfer { 123.12.41.0 };\n};\n\
    ```\n\nTip: Make note of the allow-transfer options above, which restricts zone\
    \ transfers to a given IP address. In our example, we are allowing the host at\
    \ 123.12.41.0 (probably a slave DNS server in our domain) to request transfers.\
    \ If you omit this, anyone on the Internet will be able to request such transfers.\
    \ As the information is often used by spammers and spoofers, I strongly recommend\
    \ you restrict zone transfers to your slave DNS server(s), or use the loopback\
    \ address `127.0.0.1` instead.\n\n- 4. You can now set up your DNS tables the\
    \ `/var/named/` directory as in the `/etc/named.conf` file. Configuring database\
    \ files for the first time is a major undertaking, and is beyond the scope of\
    \ this document. There are several guides that should be referred to. However,\
    \ several examples are provided below.\n\n entries in \"/var/named/mydomain_name.db\"\
    \ forward lookup file:\n\n```\n; This is the Start of Authority (SOA) record.\
    \ Contains contact & other information about the name server. The serial number\
    \ must be changed whenever the file is updated.\n@ mydomain.name. postmaster.mydomain.name.\
    \ (\n1990811 ; Serial number\n3600 ; 1 hour refresh\n300 ; 5 minutes retry\n172800\
    \ ; 2 days expiry\n43200 ) 12 hours minimum\n\n; Name servers listed as in forward\
    \ lookup table\nIN NS mydomain.name.\nIN NS isp.domain.name.com.\n\n; This is\
    \ the mail-changer. You can list more than one (applicable), with the integer\
    \ field indicating priority (lowest).\nIN MX mydomain.name.\n\n; Provides optional\
    \ information on the machine type & operating system used for the server\nIN HINFO\
    \ Pentium/350 LINUX VMS Alpha NT\n\n; A list of machine names & addresses\nspock.mydomain.name\
    \      IN A 123.12.41.40 ; Open\nmail.mydomain.name      IN A 123.12.41.41 ; Linux\
    \ (main server)\nkirk.mydomain.name      IN A 123.12.41.42 ; Windows\n\n; Including\
    \ any in our other class's\ntwikel.mydomain.name    IN A 126.27.18.161 ; Linux\
    \ test machine\none.mydomain.name      IN A 126.27.18.162 ; Linux development\n\
    \n; Alias (canonical) names\ngopher IN CNAME mail.mydomain.name\nftp IN CNAME\
    \ mail.mydomain.name\nwww IN CNAME mail.mydomain.name\n```\n\n entries in \"/var/named/123_12.rev\"\
    \ reverse lookup file:\n\n```\n; This is the Start of Authority (SOA) record.\
    \ Same as in forward lookup table.\n@ mydomain.name. postmaster.mydomain.name.\
    \ (\n1990811 ; Serial number\n3600 ; 1 hour refresh\n300 ; 5 minutes retry\n172800\
    \ ; 2 days expiry\n43200 ) 12 hours minimum\n\n; List the name servers in use.\
    \ Unresolved entries in other zones will go to your ISP’s name server.\nIN NS\
    \ mydomain.name.\nIN NS isp.domain.name.com.\n\n; As you can see, we can map our\
    \ other class C's as long as they are under the 123.12.* class B addresses\n40.41\
    \ IN PTR spock.mydomain.name.\n41.41 IN PTR mail.mydomain.name.\n42.41 IN PTR\
    \ kirk.mydomain.name.\n24.42 IN PTR tsingtao.mydomain.name.\n250.42 IN PTR redstripe.mydomain.name.\n\
    24.43 IN PTR kirin.mydomain.name.\n66.64 IN PTR sapporo.mydomain.name.\n\n; No\
    \ alias (canonical) names should be listed in the reverse lookup file (for obvious\
    \ reasons).\n```\n\nAny other reverse lookup files needed to map addresses in\
    \ a different class B (such as 126.27*) can be created, and would look much the\
    \ same as the example reverse lookup file above.\n\n- 5. Make sure the named daemon\
    \ is running. This daemon is usually started from the \"etc/rc.d/init.d/named\"\
    \ file upon system boot. You can also start and stop the daemon manually; type\
    \ \"named start\" and \"named stop\", respectively.\n\n- 6. Whenever changes are\
    \ made to the DNS tables, the DNS server should be restarted by typing \"/etc/rc.d/init.d/named\
    \ restart\". You may then wish to test your changes by using a tool such as \"\
    nslookup\" to query the machine you added or changed.\n"
