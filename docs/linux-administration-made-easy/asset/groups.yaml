    ## 8.2.2. 使用“KDat”进行恢复：


    要从由 KDat 创建的备份集中恢复一个或多个文件，请将备份磁带插入驱动器，从“文件”（File）菜单选项选择“挂载磁带”（Mount Tape）（或左键点击像磁带的图标）。


    KDat 将尝试从磁带上读取头信息，如果成功，它将尝试找到与磁带头找到的标识匹配的磁带索引。该磁带索引存储在你的硬盘上，是为每个由 KDat 格式化的备份磁带创建的唯一文件，并在你每次执行备份时都会更新。


    如果缺少相应的磁带索引（可能是你正在从另一台机器上创建的备份集恢复，或者索引文件在你的硬盘上被删除或以某种方式损坏），KDat 将告知你此情况，并询问你是否通过读取磁带来重新创建索引。由于你在恢复所需文件之前需要重新创建它，因此左键点击“是”（Yes）是完全合理的。


    > （注意：一旦磁带重新索引，其名称将更改为“已重新索引磁带”（Reindexed Tape）。你应该将磁带重命名为原始名称。）


    一旦成功读取磁带索引，就可以用它来从备份集中选择你想要恢复的目录或文件，方法与你创建备份配置时相同（文件选择过程的详细说明请参见第 8.1 节）。


    一旦你选择了适当的文件，就可以通过菜单栏上的“文件”（File）选项选择“恢复...”（Restore...）来启动恢复过程（或左键点击恢复恢复图标）。KDat
    将显示一个对话框，允许你确认将恢复哪些文件。此外，你还可以指定将文件恢复到哪个目录。这将允许你将关键系统文件恢复到家目录，然后稍后比较、移动或更新这些文件到预定位置。这实际上是恢复文件最安全的方法。


    要开始恢复过程，点击“确定”（Okay）按钮。KDat 将扫描磁带并恢复所选文件。


    有时，你可能会发现有必要从没有使用 KDat 创建的备份集中恢复一个或多个文件。也许你希望在一个没有提供 GUI 环境的系统上恢复此类文件，或者想通过慢速网络连接通过远程执行
    KDat 来操作，而这在实际上是不现实的。幸运的是，KDat 使用“tar”工具写入备份数据集，`tar` 是在任何 *nix* 系统上可用的命令行工具。


    如果你想使用 `tar` 恢复由 KDat 创建的备份集，请使用你在使用 `tar` 自己创建任何普通备份集时会使用的任何选项。然而，请记住，数据集不是以压缩格式存储的。


    > 注意：当你尝试用 `tar` 访问 KDat 备份集时，几乎会收到错误消息。这是因为 KDat 在首次格式化磁带时添加了头和其他信息。只需重复 `tar`
    命令两次或三次即可跳到实际归包文件的开头。


    ## 8.3. Cisco 路由器配置备份


    在工作场所，我们有一个连接远程位置的 WAN。这些远程位置通过 ISDN 或某些情况下的 Centrax 数据中心连接 Cisco 路由器，以提供 Internet
    和 WAN 连接。Cisco 路由器产品允许在网络服务器通过 TFTP（简单文件传输协议）读取和写入配置文件。每当路由器配置发生更改时，在 Linux 服务器上保存配置文件都是关重要的，这样就可以维持备份。


    请注意，Red Hat 默认禁用了 TFTP 服务，因为如果配置不当，可能会成为一个真正的安全漏洞。TFTP 守护允许任何人在不进行身份验证的情况下读取和写入文件。我个人的设置方法是创建一个由
    root 拥有的“/tftpboot/”目录，然后修改“/etc/inetd.conf”文件中现有的配置行以修复位置：


    ```

    tftpd dgram wait root /usr/sbin/tcp in.tftpd /tftp-boot

    ```


    > 注意：在上述行末尾添加 /tftpboot 路径专门指示了 TFTP 守护允许访问文件的位置。虽然实际上可以省略此部分并允许 TFTP 访问系统上的任何地方，但由于
    TFTP 被认为具有安全风险，这可能是一个非常糟糕的主意。


    一旦你启用了 TFTP 服务，别忘记输入：


    ```

    killall -HUP inetd

    ```


    上述命令重启 INETD 守护进程以识别你对 inetd.conf 文件所做的任何更改。


    创建路由器配置文件的备份涉及 3 个步骤：对现有文件设置权限（或创建一个新文件）以允许写入、写入备份文件，然后重置权限以限制对文件的访问。以下是路由器备份会话的示例：


    ```

    root@host:# chmod 644 config.file

    root@host:# cp config.file config.bak

    root@host:# chmod 600 config.bak

    ```

    （注：此处为示例演示，根据上文逻辑翻译）


    ```

    root@host:# chmod 644 config.file

    root@host:# cp config.file config.bak

    root@host:# chmod 600 config.bak

    ```

