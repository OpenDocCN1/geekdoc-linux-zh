    # Chapter 1. Preface


    ## 1.1. Acknowledgements


    I would like to thank the Linux community; particularly those members who have
    participated in USENET and mailing lists with lots of helpful tips, answers, and
    suggestions on how to use Linux at its best. Your contributions have benefited
    us all.


    This document was written in the DocBook SGML format, and then rendered using
    SGMLTools 2.x to a variety of document formats, including HTML, postscript, Rich-Text,
    and PDF. For more information on SGMLTools, see the project web site at http://www.sgmltools.org/


    ## 1.2. Copyright Information and Legal Disclaimers


    Copyright © 1997-1999 by Steve Frampton. This material may be distributed only
    subject to the terms and conditions set forth in the Open Publication License,
    v0.4 or later (the latest version is presently available at http://www.openccontent.org/openpub/).


    I''ve written this documentation and am providing it free to the Linux community
    as a public-service. I have made every attempt to ensure that the information
    contained herein is timely, accurate, helpful, but in no way will I be liable
    for any damage(s) caused directly or indirectly by any misinformation contained
    herein.


    I will not appreciate being blamed for any errors or omissions. However, if you
    notice a glaring inaccuracy, or suggestions for further improvement, please let
    me know. However, please check the version number and date of this document (see
    the table of contents) to ensure you are looking at the most recent version. If
    this document is more than three months old, please check the Linux Documentation
    Project home page at http://metalab.unc.edu/LDP/ in case a newer version is available.


    This document, currently, should be considered moderate-beta. I began writing
    in 1997, and continue to update it as time permits. Development in the Open Source
    community continues at a rapid pace, and at at times it is a challenge to keep
    this document up to date. As such, this document may have one or more sections
    which contain obsolete information.


    In short, I make no guarantees for any of this information to be correct. If it
    helps you out, that''s great!


    ## 1.3. A Plea for Help


    If you find this document useful and would like to express your appreciation for
    it, please consider donating a food item or two to your local food bank.


    # Chapter 2. Introduction


    Linux 2.2.0, released 25-Jan-99: Onwards to World Domination...


    Perhaps you are fairly new to Linux and were hoping to find a summary of the kinds
    of configuration and administrative tasks that may be required of you from time
    to time. If this sounds like you, this document is just what you''ve been looking
    for!


    ## 2.1. Scope


    This documentation will attempt to summarize the installation and configuration,
    as well as the day-to-day administrative and maintenance procedures that should
    be followed to keep a Linux-based server or desktop system up and running. It
    is not intended to be a full overview of Unix operations, as there are several
    good texts available as well as on-line documentation which may be referred to
    in cases where more detailed information is required.


    In general, your Linux system can operate with a minimum of user maintenance.
    Routine tasks, such as rotating and discarding of system logs, are automated.
    Therefore, for the most part, even with very little user intervention, Linux will
    hum along doing its job. However, in cases of custom needs or system failure this
    documentation may prove useful.


    I currently use Linux both at home and at my place of employment. It has served
    me well, and has worked as a reliable Internet and file/print service for my employer
    for four years now.


    ## 2.2. Choosing a Linux Distribution


    There is quite a variety of Linux distributions from which to choose. Each distribution
    offers the same base Linux kernel and system tools, but differ on installation
    method and bundled applications. Each distribution has its own advantages as well
    as disadvantages, so it is wise to spend a bit of time researching which features
    are available in a given distribution before deciding on one.


    The following is a list of a few web sites you can visit, which will describe
    a given Linux distribution as well as provide information on how you can download
    or purchase it:


    - http://www.redhat.com/


    The Red Hat distribution, by commercial vendor Red Hat Software, is one of the
    most popular distributions. With a choice of GUI- and text-based installation
    procedures, Red Hat 6.1 is possibly the easiest Linux distribution to install.
    It offers easy upgrade and package management via the “RPM” utility, and includes
    both the GNU Network Object Model Environment (GNOME) and the “K Desktop Environment”
    (KDE), both popular GUI window managers for the X Window System. This distribution
    is available for the Intel, Alpha, and Sparc platforms.


    - http://www.debian.org/


    The Debian distribution, by non-profit organization known as “The Debian Project”
    is the darling of the Open Source community. It also offers easy upgrade and package
    management via the “dpkg” utility. This distribution is available for the Intel,
    Alpha, Sparc, and Motorola (Macintosh, Amiga, Atari) platforms.


    - http://www.suse.com/


    The S.u.S.E. distribution, by commercial vendor S.u.S.E., is another popular distribution,
    and is the leading distribution in Europe. It includes the “K Desktop Environment”
    (KDE), and also offers easy upgrade and package management via the “YAST” utility.
    This distribution is available for both Intel and Alpha platforms.


    - http://www.caldera.com/


    The OpenLinux distribution, by commercial vendor Caldera, is aimed towards corporate
    users. With the new 2.2 release, Caldera has raised the bar with what appears
    to be the easiest to install. In addition, it comes with the “K Desktop Environment”
    (KDE). This distribution is available for the Intel platform.


    - http://www.mandrake.com/


    The Mandrake distribution, by commercial vendor MandrakeSoft, integrates the Red
    Hat (your choice) with additional software.


    - http://www.slackware.com/


    The Slackware distribution, by Patrick Volkerding of Walnut Creek Software, is
    the grandfather of modern distributions. Offers a fairly simple installation,
    but poor upgrade and package management. This distribution is available for the
    Intel platform.

