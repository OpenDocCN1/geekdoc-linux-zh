    The next step is to configure your kernel settings. This is the most important
    step in building the custom kernel. If you disable the wrong settings, you may
    leave out support for features or hardware you need. However, if you enable the
    wrong settings, you will be needlessly enlarging the kernel and wasting your valuable
    system memory


    ![](img/846ec8d157c5d667ec22f4e21c29db61_103_0.png)


    (that being said, it is probably better to err on the side of the latter rather
    than the (former).


    The best way of ensuring you compile the kernel properly is to know what features
    you will need to use, and what hardware is in your system that you will require
    support. After you have gained experience in customizing your kernel a few times,
    the process will become “old hat” and won’t seem so intimidating!


    Type the following to begin the configuration process:


    ```bash

    cd /usr/src/linux

    make mrproper

    make menuconfig

    ```


    (You could type “make xconfig” instead of “make menuconfig” if you have the X
    Window System running: see Chapter 5 for details on how to get working.)


    To configure your kernel, go through the various settings and select (enable)
    whichever ones require, and de-select (disable) the ones you do not require. You
    can choose between having such support right into the kernel, or building it as
    a module which is loaded and unloaded by the kernel as needed. (If you compile
    a feature that is actually needed to boot your system, such as a SCSI driver,
    as a module, you will need to create a RAMDisk image or your system will not boot.
    This is done with the “mkinitrd” command; this procedure is described a little
    further down.)


    When going through the configuration settings, you can select <Help> for a description
    of what a given kernel option is for.


    After you have configured your kernel settings, type the following commands to
    compile your kernel:


    ```bash

    cd /usr/src/linux

    make dep ; make clean

    make bzImage

    make modules

    ```


    If you are recompiling the same kernel as you have previously (2.0.36-3 in this
    example), you will likely want to move the existing modules to a backup directory
    with the following command:


    ```bash

    cd /usr/src/linux

    mv /lib/modules/2.0.36-3 /lib/modules/2.0.36-3-backup

    ```

