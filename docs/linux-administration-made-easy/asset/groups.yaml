    ```


    Now, type the command to actually install the new modules:


    ```

    mail:/usr/src/linux# make modules_install

    ```


    The next step is to copy the kernel into the “/boot/” directory and LILO to update
    the boot record so that the new kernel is recognized. The following commands will
    make a backup copy of your existing kernel, copy the new kernel, and then refresh
    the LILO boot:


    ```

    mail:/usr/src/linux# cd /boot

    mail:/boot# cp vmlinux vmlinux.OLD

    mail:/boot# cp /usr/src/linux/arch/i386/boot/bzImage vmlinux-2.0.36

    mail:/boot# /sbin/lilo

