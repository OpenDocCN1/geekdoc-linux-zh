    > 注意：上述列出的 SSH RPM 文件是国际版本。如果您在美国在美国或加拿大，可以选择下载美国版本的软件包（其可能具有更强的加密算法）；这些软件包在版本号后面所使用的后缀是
    "us" 而不是 "i"。根据美国法律，向美国或加拿大以外地区出口强加密产品是非法的。希望有一天，美国司法部的那些蠢货们最终能开开眼来，取消这一愚蠢的限制（红帽发行版
    Red Hat 正因为这个原因没有在他们的发行版中包含 SSH，而我们都深陷其苦）。


    您的 Windows 用户可能会因为无法再次连接到您的系统而义愤填膺，他们会很高兴地发现有几个免费的 Windows 版 SSH 客户端可用：


    - “TeraTerm Pro”客户端软件

    http://hp.vector.co.jp/authors/VA002416/teraterm.html


    - “TTSSH”客户端软件

    http://www.zip.com.au/~roca/download.html


    - “Cryptlib”客户端软件

    http://www.doc.ic.ac.uk/~ci2/ssh


    - “Putty”客户端软件

    http://www.chiark.greenend.org.uk/~sgatham/putty.html


    > 注意：如果您决定切换到使用 ssh，请确保在所有的服务器上都安装并使用它。拥有五个安全的服务器和一个不安全的服务器是浪费时间，尤其是如果您愚蠢地对多个服务器使用同一个密码，情况更是如此。


    - 限制对外部服务的访问：接下来，您应该编辑 `/etc/hosts.allow` 以及 `/etc/hosts.deny` 文件，以限制外部主机对服务的访问。这里是限制
    telnet 和 ftp 访问的示例。首先是 `/etc/hosts.allow` 文件：


    ```

    # hosts.allow


    telnetd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    in.ftpd: 123.12.41, 126.27.18, .mydomain.name, .another.name

    ```


    上述配置允许 IP C 类中所有 123.12.41* 和 126.27.18* 的主机，以及任何 mydomain.name 和 another.name
    域内的主机建立 telnet 和 ftp 连接。


    接下来，是 `/etc/hosts.deny` 文件：


    ```

    # hosts.deny

    telnetd: ALL

    in.ftpd: ALL

    ```


    - 关闭并卸载未使用的服务：编辑您的 `/etc/inetd.conf` 文件，并禁用（即使用 "#" 字符注释掉）任何不需要的服务（如果您按照上述建议使用
    ssh，那么您可能希望禁用 "telnet" 服务）。完成后，以 root 身份输入 `/etc/rc.d/init.d/inet restart` 以带上更改重启
    inetd 守护进程。


    - 安装安全检测系统：考虑安装此类安全程序，例如 "Tripwire”（参见 http://www.tripwiresecurity.com/），它可以检测入侵行为；以及
    "Abacus Sentry”（参见 http://www.psionic.com/abacus/），它可以帮助防止入侵。


    - 尽职调查：保持您系统中的操作系统处于最新状态，进行随机的安全审计（这可以简单地检查密码文件中的可疑条目、检查进程列表，并检查日志文件中的可疑条目），对于保持系统安全大有裨益。此外，向相应部门报告任何入侵尝试——这可能是一件麻烦，特别是当您的系统在某周内遭受了多次此类攻击时，但此类报告可以确保通过惩罚威慑震慑黑客，同时也确保其他人的系统安全。


    '
