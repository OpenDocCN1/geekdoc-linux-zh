    or path name. Once you determine the exact file name you wish to restore, you
    can then specify it for extraction in a regular tar command expression.


    As mentioned in Section 8.1, when creating an archive file, tar will strip leading
    “/" (slash) characters from file names. This means files may not exist in the
    same locations they were backed up. Therefore, change to the "/" root directory,
    or use the "-directory" option.


    > Note: A safer solution is to restore the desired files under a different directory
    (for example, your home directory), and then compare, move, or update the files
    to their original locations afterward.


    ## 8.2.2. Restoring with “KDat”:


    To restore one or more files from a KDat-created backup set, insert the backup
    tape into the drive, choose "Mount Tape" from the "File" menu option (or left-click
    on the icon that looks like a tape).


    KDat will try to read header information from the tape, and if successful, will
    then try to find the tape index which matches the identification found in the
    tape header. This tape index is stored on your hard drive, and is a unique file
    created for each backup tape formatted by KDat, and is updated each time you perform
    a backup.


    If this corresponding tape index is missing (perhaps you are restoring from a
    backup set created on another machine, or the index file was deleted or somehow
    corrupted on your hard drive), KDat will inform you of this fact, and ask you
    if it is to recreate your index by reading the tape. Because you will need to
    recreate it before you will be able to restore your desired files, it makes perfect
    sense to left-click “Yes".


    > (Note: Once a tape is reindexed, its name is changed to “Reindexed Tape”. You
    should rename the tape to its original name.)


    Once the tape index has been successfully read, it can then be used to select
    the directories or files you wish to restore from the backup set, in the same
    manner you used when creating your backup profiles (see Section 8.1 for detailed
    instructions on the file selection process).


    Once you have selected the appropriate files, you can start the restoration process
    by choosing “Restore...” from the “File” option on the menu bar (or left-click
    the tape restore icon). KDat will display a dialog box, allowing you to confirm
    which files will be restored. In addition, you will have the option of specifying
    a directory into which files will be restored. Then this will allow you to restore
    critical system files into your home directory, and then compare, move, or update
    those files to their intended location later on. This is actually the safest way
    of restoring files.


    To begin the recovery process, click the “Okay” button. KDat will scan the tape
    and restore the selected files.


    On occasion, you may find it necessary to restore one or more files from a backup
    set created without using KDat to do so. Perhaps you would like to restore such
    files on a system that does not offer a GUI-based environment, or would like to
    do so over a slow network connection through remote execution of KDat would be
    impractical. Fortunately, KDat writes its backup data sets using the “tar” tool,
    a command-line based tool that is available on any *nix system.


    Should you wish to restore your KDat-created backup set using tar, please do so
    using whatever options you would with any normal backup set created with tar itself.
    Bear in mind, however, that data sets are not stored in compressed format.


    > Note: You will almost certainly get an error message when trying to access the
    KDat backup set with tar. This is because of the header and other information
    that KDat added to the tape when it was first formatted. Simply repeat the tar
    command two or three times to skip to the beginning of the actual archive file.


    ## 8.3. Cisco Router Configuration Backups


    At place of employment, we have a WAN connecting remote locations. These remote
    locations have Cisco routers connected via ISDN, or in some instances, Centrax
    data centers, to provide Internet and WAN connectivity. Cisco router products
    allow TFTP (“Trivial File Transfer Protocol”) on a network server to read and
    write configuration files. Whenever a router configuration is changed, it is important
    to save the configuration file on the Linux server so that a backup is maintained.


    Please note that Red Hat disables the TFTP service by default, because it can
    be a real security hole if not configured properly. The TFTP daemon allows anyone
    to read and write files without performing authentication. The way I personally
    set things up is to create “/tftpboot/ directory, owned by root, and then modify
    the existing configuration line in the “/etc/inetd.conf” file to fix the location:


    ```

    tftpd dgram wait root /usr/sbin/tcp in.tftpd /tftp-boot

    ```


    > Note: Adding the /tftpboot path at the end of the above line specifically indicates
    where the TFTP daemon is allowed to access files. Although you can actually leave
    this part out and allow TFTP to access files anywhere on your system, as TFTP
    is considered somewhat of a security risk, this would probably be a very bad idea.


    Once you have enabled the TFTP service, don’t forget to type:


    ```

    killall -HUP inetd

    ```


    The above command restarts the INETD daemon to recognize whatever changes you
    have made to the inetd.conf file.


    Creating a backup of a router configuration file involves a 3-step process: setting
    permissions on an existing file (or creating a new one) to allow writes, writing
    the backup file, and then resetting permissions to restrict access to the file.
    An example router backup session follows:


    ```

    mail:~# cd /tftboot

    mail:/tftboot# chmod a+w xyzrouter-config

    chmod: xyzrouter-config: No such file or directory

    mail:/tftboot# touch xyzrouter-config

    mail:/tftboot# chmod a+w loyola xyzrouter-config

    mail:/tftboot# telnet xyzrouter

    ```


    Escape character is ''^''.

