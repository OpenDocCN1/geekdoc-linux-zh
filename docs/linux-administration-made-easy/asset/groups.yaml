    - sh-utils-1.6 or better ("rpm -q sh-utils")

    - autofs-3.1.1 or better ("rpm -q autofs")

    - nfs-server-2.beta37 or better ("rpm -q nfs-server"); needed only if you are
    serving NFS file files.

    - bash-14.7 or better ("rpm -q bash")

    - ncpfs-2.2.0 or better ("rpm -q ncpfs"); needed only if you are mounting Novell
    file systems.

    - kernel-pccmia-cs-3.6 or better ("rpm -q kernel-pccmia-cs"); needed only for
    laptops which need PCMC card support.

    - ppp-2.3.5 or better ("rpm -q ppp"); needed only if you are connecting to the
    Internet with a modem and PPP).

    - dhcpcd-1.3.16 or better ("rpm -q dhcpcd"); needed only if you need DHCP client
    to connect to the Internet, such as with a cable modem).

    - util-linux-2.9.0 ("rpm -q util-linux")

    - setserial-2.1 or better ("rpm -q setserial")

    - ipfwadmin/ipchains (Only needed if you are doing IP firewalling; see the "IPCHAINS-HOWTO"
    guide at http://unix.it.illu.edu/resources/ldap/HOWTO/IPCHAINS-HOWTO.html.)


    You should download and upgrade any packages using RPM as required (see Section
    10.1 for details on how to use RPM).


    > Caution: Upgrading to the new modutils package will result in modules no functioning
    for the older 2.0 kernels! Therefore, do not upgrade this package until you have
    installed the new kernel in "/usr/src/linux".


    After bringing your system''s tools up to date, you can install the kernel sources.
    You can find them on Red Hat''s FTP site as well; I recommend downloading the
    ones provided as updates for Red Hat 6.1, at ftp://ftp.redhat.com/redhat/updates/6.1/i386/

    To do so, type the following:


    ```

    rpm -Uvh kernel-source*.rpm kernel-headers*.rpm

    ```


