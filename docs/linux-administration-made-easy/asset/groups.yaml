    ```

    /sbin/chkconfig kernel off

    /etc/rc.d/modulus stop

    rpm -Uvh modulus*.rpm

    ```


    You should now be able to configure, and install your (see Section 10.6 for details).
    After rebooting, you can enable the kernel module again:


    ```

    /sbin/chkconfig kernel on

    /etc/rc.d/modulus start

    ```


    With any luck, you will find more information you need on the web site at http://www.redhat.com/kernel.


