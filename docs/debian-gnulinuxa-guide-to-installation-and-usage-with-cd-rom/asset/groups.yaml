    100mg 的可用硬盘空间；安装 X 则需要 500mg。


    # 德比ian GNU/Linux


    安装与使用指南


    GNU/Linux 已经席卷了计算世界。亲身体验吧，人们正涌向 GNU/Linux。


    这款强大的操作系统允许你释放计算机的性能、多功能性和稳定性。通过这本书以及随附的包含数千个应用程序的 CD-ROM，你将能够安装由全球 500 多名开发人员维护的唯一
    GNU/Linux 发行版。背景信息、概念讨论和逐步教程示例将帮助你对 GNU/Linux 环境建立熟悉。有这本书在身边，你已经准备好进入 GNU/Linux
    的精彩世界了。


    包含在本书附带 CD-ROM 中的 Debian GNU/Linux 拥有数千个应用程序可立即使用。这些程序涵盖了从高性能 Internet 和邮件服务器到编程开发，再到图形设计和游戏的各个领域。最重要的是，CD-ROM
    中包含的每个程序都是完全免费的！


    John Goerzen 在过去三年一直是 Debian GNU/Linux 的开发人员。由于自由软件一直是他的兴趣之一，他参与了多个自由软件项目，包括圈外的项目。他目前在一家区域
    ISP 担任 UNIX 系统管理员和开发人员。


    Ossama Othman 是密苏里州圣路易斯华盛顿大学分布式计算中心的成员，在该中心他利用该中心的 CORBA 请求代理程序 TAO 研究实时 CORBA。他还是
    Debian GNU/Linux 组织的活跃成员，并定期为开源社区做出贡献。


    如果你正开始接触 Debian GNU/Linux，这本书将：


    - 帮助你为安装 Debian GNU/Linux 准备好系统

    - 逐步引导你完成安装过程

    - Explain如何使用包管理器从免费 CD-ROM 包含的数千种软件中安装软件

    - 引导你完成软件配置

    - 向你介绍图形 X 窗口系统

    - 帮助你发现开源运动的力量


    > 根据 GNU 通用许可证 (GPL) 出版。


    出售本书的部分收益将捐赠给自由软件基金会 (FSF)。


    GNU/Linux $24.99 美国 / $37.99 加拿大 英国

    '
