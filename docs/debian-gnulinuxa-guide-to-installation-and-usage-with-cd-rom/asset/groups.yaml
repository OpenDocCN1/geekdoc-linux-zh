    我们都知道 Linux 是现世界上最强大、最稳固的操作系统之一。随着 Linux 的日益成功，人们对能够真正发挥 Linux 威力的图形化用户界面应用程序的兴趣日益增加。在书中，软件开发人员
    Eric Harlow 为我们提供了一本专注于 GTK 工具包的不可或缺的手册。这不仅仅本关于应用程序或 GUI 设计元素的概述，更是一本深入探讨技术的实战书籍。凭借书中关于各种
    GUI 编程工具的深度材料和大量示例，本书独特的关注点将为您提供设计和发布专业级应用程序所需的信息。


    《GTK+/Gnome 开发》提供了使用强大的 GTK 工具包开发 Windows 应用程序的知识。作者为读者提供了一个每个应用程序都应该具备的功能清单，以及高级
    GUI 自定义小部件。标题还包含对已经熟悉用法但需要原型函数知识和详细描述的高级用户的参考信息。这些工具让读者能够以创性的速度编写强大的应用程序。


    New Riders 荣幸推出第一本专门针对一系列通用 UNIX 安全问题的书籍。虽然我们认为现在是时候解决 Linux 网络的实际需求了，但 Robert
