    # About the Authors


    John Goerzen has been a developer for Debian GNU/Linux for the past three years.
    Because Free Software has always been one of his interests, he is involved with
    several Free Software projects, including those outside the Debian circles. He
    currently works as a UNIX system administrator and developer for a regional ISP.


    Ossama Ithman is a member of the Center for Distributed Object Computing at Washington
    University in St. Louis, Missouri, where he researches Real-Time CORBA with the
    Center''s CORBA object request TAO. He is also an active member of the Debian
