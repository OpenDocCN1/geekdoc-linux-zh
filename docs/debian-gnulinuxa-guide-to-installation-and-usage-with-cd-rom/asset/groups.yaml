    on disk. The process is the working instantiation of the program kept in memory
    by Linux. But it''s not that important to keep the terms straight.


    Much of your interaction with a computer involves controlling processes. You''ll
    want to start them, stop them, and see what they''re up to. Your primary tool
    for this is the shell.


    ## 5.4 The Shell


    The shell is a program that allows you to interact with your computer. It''s called
    a shell because it provides an environment for you to work in – sort of a little
    electronic home for you as you compute. (Think hermit crab).


    The simplest function of the shell is to launch other programs. You type the name
    of the program you want to run, followed by the arguments you want, and the shell
    asks the system to run the program for you.


    Of course, graphical windowing systems also fill this need. Technically, Windows
    95 provides a graphical shell, and the X Window system is some kind of graphical
    shell. But ‘shell’ is commonly used to mean “command-line shell”.


    Needless to say, the hackers who work on shells aren''t satisfied with simple
    launching commands. Your shell has a bewildering number of convenient and powerful
    features if you would like to take advantage of them.


    There are countless different shells available; most are based on either the Bourne
    shell or the C shell, two of the oldest shells. The original Bourne shell''s program
    name is sh, while csh is the C shell. Bourne shell variants include the Bourne
    Again Shell from the GNU project (bash, Debian default), the Korn shell (ksh),
    and the Z shell (zsh). There is also ash, a traditional implementation of the
    Bourne shell. The most common C shell variant is tcsh (the t pars pays tribute
    to the TENEX and TOPS-20 operating systems, which inspired some of tcsh''s improvements
    over csh).


    bash is probably the best choice for new users. It is the default and has all
    the features you''re likely to need. But all the shells have lovely followings;
    if you want to experiment, install some different shell packages and change your
    shell with the chsh command. Just type chsh, supply a password when asked, and
    choose a shell. When you next log in, you''ll be using the new shell.


    ## 5.5 Managing Processes with bash


    Debian is a multitasking system, so you need a way to do more than one thing at
    once. Graphical environments like X provide a natural way to do this; they allow
    multiple windows on the screen at any time. Naturally, bash (or any other shell)
    provides similar facilities.


    Earlier you used top to look at the different processes on the system. Your shell
    provides some convenient ways to keep track of only those processes you''ve started
    from the command line. Each command line starts a job (also called a process group)
    to be carried out by the shell. A job can consist of a single process or a set
    of processes in a pipeline (more on pipelines later).


    Entering a command line will start a job. Try typing man cp, and the cp manual
    page will appear on the screen. The shell will go into the background and return
    when you finish reading the manual page (or you can press q to quit rather than
    scrolling through the whole thing).


    But say you''re reading the manual page, and you want to do something else for
    a minute. No problem. Press Ctrl-z while you''re reading to suspend the current
    foreground job and put the shell in the foreground. When you suspend a job, bash
    will first give you some information on it, followed by a shell prompt. You will
    see something like this on the screen:


    ```

    NAME cp SYNOPSIS cp [options] source

    --More--

    [1 Stopped man cp

    $

    ```


    Note the last two lines. Next to last is the job information, and then you have
    a shell prompt. bash assigns a job number to each command line you run from the
    shell. This allows you to refer to the process easily. In this case, man cp is
    job number 1, displayed as [1]. The + means that this is the last job you had
    in the foreground. bash also tells you the current state of the job – Stopped
    – and the job''s command line.


    There are many commands you can do with. With man cp suspended, try the following
    commands:


    ```

    man 1ls

    ```

    Starts a new job.


    ```

    Ctrl-z

    ```

    Suspends the man 1ls job; you should see its job information.


    ```

    man mv

    ```

    Starts another job.


    ```

    Ctrl-z

    ```

    Suspends it.


    ```

    jobs

    Asks bash for a display of current jobs. The result looks like this:


    ```

    $ jobs

    [1] Stopped man cp

    [2]- Stopped man ls

    [3]+ Stopped man mv

    ${}

    ```

    Notice the - and +, denoting respectively the to last and last foreground jobs.


    ```

    fg

    ```

    Places the last foreground job (man mv, the one with the +) in the foreground
    again. If you press the space bar, the man page will continue scrolling.


    ```

    Ctrl-z

    ```

    Re-suspends man mv.


    ```

    fg %1

    ```

    You can refer to any job by placing a % in front of its number. If you use fg
    without specifying a job, the last active one is assumed.


    ```

    Ctrl-z

    ```

    Re-suspends man cp.


    ```

    kill %1

    ```

    ills off job 1. bash will report the job information, which will look like this:


    ```

    $ kill %1

    [1]- Terminated man cp

    $

    ```


    bash is only asking the job to quit, and sometimes a job will not want to do so.
    If the job doesn''t terminate, you can add the -KILL option to kill to stop asking
    and start demanding.


    - 1. Many people use the signal number -9 instead of the signal name -KILL. However,
    it''s technically more portable to use the signal name.


    ## 5.6 A bash Features


    ```

    $ kill -KILL %1

    [1]- Killed man mv

    $

    ```


    The -KILL option forcibly and unconditionally kills off the job. In technical
    terms, kill simply sends a signal. By default, it sends a signal that requests
    termination (TERM, or signal 15) but you can also specify a signal, and 9 (KILL)
    is the signal that forces termination. The command name kill is not necessarily
    appropriate to the signal sent; for example, sending the TSTP (terminal stop)
    signal suspends the process but allows it to be continued later.


    top brings the top display back up. Give the u command in top to see only your
    processes. Look in the right-hand column for the man 1s and mv commands. man cp
    won''t be there because you killed it. top is showing you system processes corresponding
    to your jobs; notice that the PID on the left of the screen does not correspond
    to the job number.


    You may not be able to find your processes because they are off the bottom of
    the screen; if you''re using X (see Chapter 9 on page 85), you can resize the
    xterm to solve this problem.


    Even these simple jobs actually consist of multiple processes, including the man
    process and the pager more, which handles scrolling one page at a time. You may
    notice the more processes are also visible in top.


    You can probably figure out how to clean up the remaining two jobs. You can either
    kill them (with the kill command) or foreground each one (with fg) and exit it.
    Remember that the jobs give you a list of listing jobs and their status.


    One final note: the documentation for bash is quite good, but it is found in the
    Info help system rather than the man pages. To read it, type info bash. See section
    A.1.1 for instructions on using the info program. bash also contains a very good
    summary of its commands accessible by the help command. help displays a list of
    available topics; more information about each of them is accessible with the command
    help topic name. Trying help cd, for example, this will give you details on the
    -P and -L arguments recognized by cd.


    ### 5.6.1 Tab Completion


    The bash can guess filename or command you are trying to type and automatically
    finish it for you. Just type the beginning of a command or filename and press
    Tab. If bash finds a single completion, it will finish the word and put a space
    after it. If it finds multiple possible completions, it will fill out the part
    all completions have in common and beep. You can then enter enough of the word
    to make it unique and press Tab again. If it finds no completions, it will simply
    beep.


    ## 5.7 Managing Your Identity


    Unix-like systems are multiuser, and so you have your own electronic identity
    as a user on the system. Type finger username to look at some of the information
    about you''s publicly available. To change the name and shell listed there, you
    can use the commands chfn and chsh. Only the superuser can change your login (username)
    and directory. You''ll notice that it says “No plan.” A “plan” is just some information
    you can make available to others. To create a plan, you put whatever you want
    people to see in a file called .plan. To do this you''ll use a text editor; see
    section 8.2 on page 82. Then finger yourself to see your plan. Others can finger
    you to see your plan and check whether you''ve received new mail or read your
    mail.


    Note that this finger information is available to the entire Internet by default.
    If you don''t want this, read about configuring inetd and the file /etc/services.
    Eventually the installation manual will describe this configuration, but for now
    you might try the man pages or just put nonsense in for your finger information.

