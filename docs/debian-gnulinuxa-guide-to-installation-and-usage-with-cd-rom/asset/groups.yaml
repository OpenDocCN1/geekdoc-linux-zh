    doesn''t make any difference what the actual physical location of the files is.
    You could have created a directory on your hard disk called /cdrom and put some
    files in it, and everything would behave in exactly the same way. Once you mount
    a filesystem, there''s no need to pay any attention to physical devices.


    However, before you can mount a filesystem or actually create a filesystem on
    a disk that doesn''t have one yet, it''s necessary to refer to the devices themselves.
    All devices have names, which are located in the /dev directory. If you type ls
    /dev now, you will see a pretty lengthy list of every possible device you could
    have on your Debian system. For a summary of some devices, see Table 2.1 on page
    15. A more thorough list can be found on your system in the file /usr/src/linux/Documentation/devices.txt.


    To mount a filesystem, we want to tell Linux to associate whatever filesystem
    it finds on a particular device with a particular mount point. In the process,
    we might have to tell Linux what kind of filesystem to look for.


    ## 10.2.2 Example: Mounting a CD-ROM


    As a simple demonstration, we''ll go through mounting a CD-ROM, such as the one
    you may have to use to install Debian. You''ll need to be root to do this, be
    careful; whenever you reboot, you have the power to manipulate the whole system,
    not just your own files. Also, these commands assume there''s a CD in your drive;
    you should put one in the drive now. Then start with the following command:


    ```

    su

    ```


    If you haven''t already, you need to log in as root or gain root privileges with
    the su (super user) command. If you use su, enter the root password when prompted.


    ```

    ls /cdrom

    ```


    Use this command to see what''s in the /cdrom directory before you start. If you
    don''t have a /cdrom directory, you may have to make one using


    ```

    mkdir /cdrom

    ```


    Simply typing mount with no arguments lists the currently mounted filesystems.


    ```

    mount -t iso9660 CD-device /cdrom

    ```


    For this command, you should substitute the name of your CD-ROM device for CD-device
    in the above command line. If you aren''t sure, /dev/cdrom is a good guess because
    the install process should have created this symbolic link on the system. If that
    fails, try the different IDE devices: /dev/hdc, etc. You should see a message
    like this: `mount: block device /dev/hdc is write-protected, mounting read-only.


    The -t option specifies the type of the filesystems, in this case iso9660. Most
    CDs are iso9660. The next argument is the name of the device to mount, and the
    first argument is the mount point. There are many other arguments for mount; see
    the manual page for details.


    Once a CD is mounted, you may find that your drive tray will not open. You must
    unmount the CD before removing it.


    ```

    ls /cdrom

    ```


    Confirms that /cdrom now contains whatever is on the CD in your drive.


    Displays the list of filesystems again; notice that your CD drive is now mounted.


    ```

    umount /cdrom

    ```


    This unmounts the CD. It''s now safe to remove the CD from the drive. Notice that
    the command is ummount with no "n", even though it''s used to unmount the filesystem.


    ```

    exit

    ```


    Don''t leave yourself logged on as root. Log out immediately, just to be safe.


    ## 10.2.3 /etc/fstab: Automating the Mount Process


    The file /etc/fstab (it stands for "filesystem table") contains descriptions of
    filesystems that you mount often. These filesystems can then be mounted with a
    shorter command, such as mount /cdrom. You can also configure filesystems to mount
    automatically when the system boots. You''ll probably want to mount all of your
    hard disk filesystems when you boot, so Debian automatically adds entries to fstab
    to do this for you.


    Look at this file now by typing /etc/fstab. It will have two or more entries that
    were configured automatically when you installed the system. It properly looks
    like this:


    ```

    # /etc/fstab: static file system information.

    #

    # <file system> <mount point> <type> <options>

    #dump <pass>

    /dev/hd1 / ext2 defaults 0 1

    /dev/hda3 none swap sw 0 0

    proc /proc proc defaults 0 0

    /dev/hda5 /tmp ext2 defaults 0 2

    /dev/hda6 /home ext2 defaults 0 2

    /dev/hda7 /usr ext2 defaults 0 2

    /dev/hdc /cdrom iso9660,ro,noauto 0 0

    /dev/fdb0 /floppy autoauto,sync 0 0

    ```


    The first column lists the device the filesystem resides on. The second lists
    the mount point, the third indicates the filesystem type. The line beginning with
    /proc is a special filesystem. Notice that the swap partition (/dev/hda3 in the
    example) has no mount point, so the mount point columns none.


    The last three columns may require some explanation. The fifth column is used
    by the dump utility to decide when to back up the filesystem. In most cases, you
    can put 0. The sixth column is used by fsck to decide in what order to check filesystems
    when you boot the system. The root filesystem should have a 1 in this field, filesystems
    that don''t need to be checked (such as the swap partition) should have a 0, and
    all other filesystems should have a 2. It''s worth noting that the swap partition
    is not exactly a filesystem in the sense it does not contain files and directories
    but is used by the kernel four contains one or more options to use. see5.1 on
    page 49.


    ## 10.2.4 Removable Disks (Floppies, etc.)


    Add the following lines to /etc/fstab:


    ```

    /dev/sda1 / ext2 defaults 0 0

    /dev/sda4 /floppy autoauto,sync 0 0

    ```


    ## 10.3 Backup Tools


    Backups are important under any operating system. Debian/Linux provides several
    utilities that you might want to use. Some of the utilities you''ll find include:


    - taper is a menu-driven, easy-to-learn backup program that can back up a variety
    of media. Its limitation is that it doesn''t handle large (4GB or larger) backups.

    - dump is designed specifically for tapes; its main strengths are its interface
    for file restores, low-level filesystem backups, and incremental backup scheduling.
    Its limitations include the inability to back up NFS or other non-ext2 filesystems.

    - GNU tar (short for Tape ARchiver) is an implementation of what is probably the
    most widely used backup or archiving utility in Linux. It makes a good general
    purpose tool and can deal with the widest variety of target media. Additionally,
    many different systems can read tar files, making them highly portable. tar''s
    weaknesses include a weaker incremental backup and an interactive restore screen.


    ### 10.3.1 tar


    Because tar is used so much, and for quite a bit in addition to backups, it is
    being described here. For more details, see the tar manual page; instructions
    for viewing manual pages can be found in section 5.1


    tar is an archiver. This means that tar can take many files and combine them all
    into one large file or write them out to a backup device such as a tape drive.
    Once you have this one large file, you will often want to compress it; the -z
    option is great for this. Hence, tar offers a great way to distribute programs
    and data on the Internet, and you''ll find that is used extensively for this purpose.


    Here''s a look at how this command can be broken down:


    ```

    tar -zcvf myfiles.tar.gz /usr/local/bin

    ```


    - -z tells tar to use gzip compression automatically; if you use this, it''s good
    to add a .gz extension as well.

    - -c tells to create a new archive.

    - -v this says to be verbose; that is, it tells tar to let you know what it''s
    doing while it creates the archive.

