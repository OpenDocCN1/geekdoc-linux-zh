    区分商业软件与专有软件是非常重要的。专有软件是非免费软件；商业软件是为了换钱而出售的。Debian 允许商业软件成为主发行版，但不允许专有软件。请记住，“自由软件”这一术语并不是指价格；自由软件是完全可以出售的。有关该术语的更多详细说明，请参阅
    http://www.opensource.org/ 或 http://www.fsf.org/philosophy/categories.html。


    ## 1.4 关于本书


    本书面向初接触 Debian GNU/Linux 的读者。它假设读者没有关于 GNU/Linux 或其他类 Unix 系统的先验知识，但假设读者对计算机和硬件有非常通用的常识；你应该知道计算机的基本部分是什么，以及人们可以用计算机做什么。


    总的来说，本教程试图帮助你理解 Debian 系统内部发生了什么。其核心理念是赋予你解决新问题的能力，并最大限地发挥计算机的价值。在手册的“操作指南”部分，还融入了大量的理论和趣味知识。


    我们非常想听听你对这本书的反馈意见！你可以通过 debian-guide@complete.org 联系作者。我们特别感兴趣这本书对你是否有帮助，以及我们如何才能改进它。无论你是有意见，还是认为这本书是前所未有的杰作，请向我们发送电子邮件。


    请不要向作者发送关于 Debian 的技术问题，因为这些问题有专门的论坛；请查看第 119 页的附录 A 获取有关文档和寻求的更多信息。仅向以下地址发送关于书籍本身的邮件。


    ### 1.4.1 如何阅读本书


    学习任何计算机程序最好的方法就是使用它。大多数人发现，在不使用程序的情况下看书是有益的。学习 Unix 和 GNU/Linux 的最好方法就是使用它们。尽可能在任何事情上使用
    GNU/Linux。尽管尝试吧！


    Debian 不像某些其他操作系统那样直观。你可能最终会读这本书的前几章。GNU/Linux 的强大和复杂性使其起初很难上手，但从长远来看回报丰得多。


    建议的学习方法是：读一点，然后玩一会儿。一直玩，直到你对这些概念感到熟悉，然后在书中跳跃着读。你会发现涵盖了各种主题，其中一些你可能会觉得感兴趣。一段时间后，你应该会有足够的信心在不知道命令具体作用的情况下开始使用它们。这是一件好事。


    提示：如果你误输入了命令或不知道如何退出程序，请按下 CTRL-c（同时按下 Ctrl 键和小写字母 c）。这通常会停止程序。


    ### 1.4.2 惯例


    在继续之前，熟悉书中使用的排版惯例是非常重要的。


    当你需要同时按下多个键时，会使用类似 CTRL-a 的表示法。这意味着“按下 Ctrl 键并按下小写字母 a”。有些键盘同时拥有 Alt 和 Meta；大多数家用电脑只有
    Alt，但 Alt 键的行为就像 Meta 键。如果你没有 Meta 键，请尝试 Alt 键。


    Alt 和 Meta 键被称为修饰键，因为它们会改变像字母 A 等标准键的含义。有时你需要按住多个修饰键；例如，Meta-Ctrl-a 表示同时按下 Meta、Ctrl
    和小写字母 a。


    某些键有特殊符号——例如，Ret（回车/Enter键）、Del（删除或有时是退格键）、Esc（退出键）。这些内容应该是一而易懂的。


    用空格代替连字符意味着按顺序按下按键。例如，CTRL-x RET 表示同时输入 Ctrl 和小写字母 a，然后是字母 x，最后按下回车键。（在示例会话中，此键标记为
    Enter。同一个键，不同的名称。）


    在示例会话中，**粗体**表示用户输入的字符，*斜体*表示对示例会话某部分的注释，所有其他文本都是输入命令后的输出。对于较短的命令，你有时会发现命令可以在其他文本中找到并用等宽字体高亮。


    ## 2. 入手


    > “千里之行，始于足下。” – 老子


    现在你已经了解了 Linux 和 Debian 背后的思想和哲学，是是时候开始把它们安装在你的计算机上了！我们首先从如何准备 Debian 安装开始谈起，然后讨论磁盘分区，最后是如何启动安装系统。


    ## 2.1 支持的硬件


    Debian 没有在 Linux 内核和 GNU 工具的要求之外施加额外的硬件要求。


    本节并没有尝试描述支持 PC 平台的所有不同硬件配置，而是包含了通用信息以及在哪里可以找到额外信息的指引。


    ## 第 2 章 入手


    有两个查看详细信息的绝佳场所：Debian 系统要求¹ 列表和 Linux 文档项目硬件兼容性 HOWTO²。关于显卡支持的信息，你可能还想查看 XFree86³
    网站。


    ### 2.1.1 内存和磁盘空间要求


    你必须至少有 4MB 的内存和 35MB 的可用硬盘空间。如果你想安装合理数量的软件（包括 X Window 系统以及一些开发程序和库），你至少需要 300MB。对于一个本质完整的安装，你需要大约
    800MB。要安装 Debian 中所有的内容，你可能需要大约 2GB。实际上，安装所有内容并没有意义，因为某些包提供了相同的服务。


    ## 2.2 在开始之前


    在开始之前，务必备份你现在硬盘上的文件。安装程序可能会抹掉硬盘上的所有数据！即使备份后也要小心。几分钟的思考可以节省几个小时的工作。


    Debian 支持在同一系统上安装 Debian GNU/Linux 和另一个操作系统。如果你计划分区驱动器，请确保你有备份。


    如果你的计算机连接到网络，你应该向网络管理员询问以下信息：


    - 你的主机名（你可以自己决定）

    - 你的网络 IP 地址

    - 网络子网掩码

    - 网络的广播地址

    - 如果网络有网关，你应该路由到的默认网关 IP 地址

    - 你作为 DNS 服务器使用的系统

    - 是否通过以太网连接网络

    - 你的以太网接口是否为 PCIA 卡，如果是，是什么类型的 PCIA 控制器


    如果你唯一的网络连接是使用 PPP 或类似的电话拨号连接，那么在系统安装好之前不需要担心设置网络。设置 PPP 请参阅第 99 页的第 11.1 节。


