    resides in the X11 subdirectory of the /etc directory, and /etc is in turn a subdirectory
    of a root directory, /.


    Things to note:


    +   - Filenames are case-sensitive. That is, MYFILE and MyFile are different files.


    +   - The root directory is referred to as simply /. Don’t confuse this “root”
    with the root user, the user on your system with“super powers.”


    +   - Every directory has a name, which can contain any letters or symbols except
    /. The root directory is an exception; its name is / (pronounced “slash” or “the
    root directory”), and it cannot be renamed.


    +   - While you can use any letters or symbols in a filename, in practice it’s
    a bad idea. It is better to avoid characters that often have special meanings
    on the command line, including: { ( ) [ ] ‘ " / < > | ! # & * If you want to separate
    words in a name, good choices are the prefix, hyphen, and underscore. You could
    also capitalize each word, LikeThis.


