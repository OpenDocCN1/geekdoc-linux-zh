    # 5 基础知识


    现在是时候详细探索该系统了。你已经了解了如何登录和关闭系统。在本章中，我们将探索 Linux 命令行、Linux 如何处理文件和目录，以及关于向他人标识身份的一些基础知识。


    ## 5.1 命令行与手册页 (Man Pages)


    我们已经讨论过命令行，即你在 shell 提示符后输入的命令。本节描述了更复杂的命令行的结构。


    一个简单的命令行仅包含一个命令名称，例如 `whoami`。但也可以其他内容。例如，你可能会输入：`man whoami`。此命令会请求 `whoami`
    程序的在线手册（你可能需要按空格键滚动文档，或按 `q` 退出）。一个更复杂的例子是 `man -k PostScript`。这个命令行包含三个部分：它以命令名
    `man` 开始；接着是一个选项或开关 `-k`，随后跟一个参数 `PostScript`。有些人将除命令名以外的所有内容统称为命令的参数。因此，选项和参数都是参数。


    选项会改变命令的行为，开启特定的特性或功能。它们通常在前面有一个 `-`。GNU 工具具有选项的“长形式”；`-k` 的长形式是 `--apropos`。你可以输入
    `man -h` 或 `man --help` 来获取 `man` 命令的完整选项列表。每个命令都有自己的一组选项，大多数命令都有 `--help` 和 `--version`
    选项。由于历史原因，像 `tar` 这样的命令不需要在其选项前加 `-`。


    任何不是选项又不是命令名的内容都是参数（在此例中为 `PostScript`）。参数可以有许多用途；最常见的是命令应该操作的文件名。在这种情况下，`PostScript`
    是你想要通过 `man` 查找的单词，而对于 `man whoami`，参数则是你想要获取信息的命令。


    以下是 `man -k PostScript` 命令行的拆解：


    - **man**: 命令名，告诉计算机查看手册页。这些页为命令提供了文档。例如，`man whoami` 将为你提供关于 `whoami` 命令的文档。

    - **-k**: 选项，改变 `man` 的行为。通常 `man` 期望一个命令名（如 `whoami`）作为参数并显示该命令的文档。但使用 `-k` 或
    `--apropos` 选项，它期望参数是一个关键词。它会列出所有描述中包含该关键词的手册页列表。

    - **PostScript**: 这是参数；因为我们使用了 `-k` 选项，它是要搜索的关键词。


    `-k` 和 `PostScript` 都是参数。


    继续输入 `man -k PostScript`，你将看到系统中所有与 PostScript 有关的手册页列表。如果你没有安装多少软件，可能会看到消息“PostScript:
    nothing” own。


    ### 5.1.1 描述命令行


    注意：如果你想继续后进行，可以跳过本节。


    有一种传统的、简洁的方法来描述命令语法。语法是指组合各种选项和参数的正确方法。例如，如果你输入 `man man` 来获取关于 `man` 的手册页，你将看到几个以命令名
    `man` 开头的语法描述。其中一个看起来像这样：`man -k [-M path] keyword ...`


    括号 `([])` 中的任何内容都是可选的单元。在这种情况下，你不需要使用 `-M` 选项，但如果你使用它，就必须使用路径参数。你必须使用 `-k` 选项和关键词参数。`...`
    意味着你可以拥有比它之前的任何内容的多个项，所以你可以查找几个关键词。


    让我们看看手册页中较复杂的描述之一：


    ```

    man [-c|-w| -tZT device] [-adhu7V]

    [-m system,...] [-L locale] [-p string]

    [-M path] [-P pager] [-r prompt] [-S list]

    [-e extension] [[section] page ...]

    ```


    不需要遍历这些内容（也不用担心它的意思），但请注意描述的组织结构。


    首先，选项簇通常意味着你可以以不同的组合使用其中一个或多个选项，因此 `-adhuV` 意味着你也可以使用 `-h`。然而，你不能使用所有组合；这个描述并没有说明这一点。例如，`-h`与其他选项不兼容，但你可以运行
    `man -du`。


    遗憾的是，描述的格式并没有说明这一点。


    其次，`|` 符号意味着“或”。因此你可以使用 `-c`、`-w` 或 `-tZT` 选项，后跟一个设备参数。


    第三，注意你可以嵌套括号，因为它们表示可选单元。所以，如果你有一个章节（section），你也必须有一个页（page），因为在 `[[section] page]`
    单元中，页不是可选的。


    不需要记忆这些任何内容，只需在阅读文档时参考本节即可。


    ## 5.2 文件和目录


    文件是存储和组织信息的设施，类似于纸质文档。它们被组织在目录中，在其他其他系统中目录被称为文件夹（folders）。让我们看看 Debian 系统上的文件结构：


    `/` 代表根目录。所有其他文件和目录都包含在根目录下。如果你来自 DOS/Windows 世界，`/` 与 DOS 的 `C:` 非常相似，即它是根目录。


    '
