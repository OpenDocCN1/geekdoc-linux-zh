    64MB 的交换空间可能并没有意义。在大多数情况下，它不应小于 16MB。当然，这些规则是有例外的。如果你试图在具有 256MB 内存的机器上求解 10,000
    个方程方程，你可能需要1GB（或更多）的交换空间。


