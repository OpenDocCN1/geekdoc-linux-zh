    ## 3.8 安装操作系统内核和模块


    在你挂载根分区后，这应该是下一个菜单步骤，除非你在之前的 dbootstrap 运行中执行过此步骤。首先，将被要求确认挂载在 root 上的设备是正确的。接下来，你将获得一个设备列表，你可以从中安装内核。选择一个合适的设备来安装内核和模块；这将是一个
    CD-ROM 设备或第一个软盘设备。


