    | 代码 | 名称 | 允许文件 | 允许目录 |

    | --- | --- | --- | --- |

    | r | 读取 | 检查文件内容 | 列出目录内容或删除 |

    | w | 写入 | 修改文件 | 在目录中添加文件 |

    | x | 执行 | 作为命令运行 | 访问目录中的文件 |


    拥有这些权限的用户、组或其他人可以列出目录的内容，但不能做其他事情。目录中的文件无法以任何方式被读取、更改、删除或操作。唯一被允许的操作是读取目录本身，即查看它包含哪些文件。


    ```

    rw-

    ```


    在缺少执行权限的情况下，写入权限没有作用，此模式的行为与上述模式完全相同。


    ```

    r-x

    ```


    此模式允许列出目录中的文件，并允许访问这些文件。然而，不能创建或删除文件。访问意味着你可以根据文件所有权权限允许查看、更改或执行文件。


    ```

    -x

    ```


    可以访问此目录中的文件，但不能列出目录的内容，所以你必须预先知道你要找的文件名（除非你非常擅长猜测）。不能创建或删除文件。


    ```

    rwx

    ```


    你可以对此目录中的文件进行任何你想做的操作，只要文件本身的权限允许即可。

    目录写入权限决定了你是否可以删除目录中的文件。如果你有权限写入包含该文件的目录，就可以删除一个只读文件。即使你允许更改该文件，你也无法从只读目录中删除文件。

    这意味着如果你拥有一个目录，你可以随时删除其中的文件，即使这些文件属于 root。

    目录执行权限决定了你是否有权文件，从而决定文件权限是否生效。如果你对目录有执行权限，该目录的文件权限就会变得相关。否则，文件权限根本无关；因为你根本无法访问文件。


    ## 7.1.3 实践中的权限


    本节通过一个简短的示例会话演示权限如何使用。要更改权限，我们将使用 `chmod` 命令。


    ```

    cd; touch myfile

    ```


    这里有几个新技巧。首先，你可以使用 `;` 将两个命令放在同一行。你可以这样输入上述内容：


    ```

    $ cd

    $ touch myfile

    ```


    或者输入：


    ```

    $ cd; touch myfile

    ```


    无论哪种方式，最终发生都是一样的。

    回想 `cd` 会返回你的主目录。`touch` 通常用于将文件的修改时间改为当前时间。但它还有另一个有趣的特性：如果文件不存在，`touch` 会创建该文件。所以你正在用它来创建一个文件进行练习。使用
    `ls -l` 确认文件已创建，并注意权限模式：


    ```

    $ ls -l

    -rw-r--r-- 1 user 0 Nov 18 22:04 myfile

    ```


    显然，当你尝试时，时间和以及用户/组名会有所不同。文件的大小为 0，因为 `touch` 创建的是一个空文件。

    `-rw-r--r--` 是 Debian 上的默认权限模式。


    ```

    chmod +x myfile

    ```


    此命令意味着为拥有该文件的用户 (u) 添加 (+) 执行 (x) 权限。使用 `ls -l` 查看效果。


    ```

    chmod g-r myfile

    ```


    在这里，你从所有该文件的组 (g) 以及所有其他人 (others, o) 中减去了 (-) 读取权限 (r)。再次，使用 `ls -l` 验证效果。


    ```

    chmod ugo-rx myfile

    ```


    你将 (=) 用户、组和其他人的权限设置为读取和执行。这会将权限设置为*恰好*你指定的权限，并取消任何其他权限。所以所有的 rx 都应该被设置，而所有的 w
    都应该被取消。现在，没有人可以写入该文件了。


    ```

    chmod a-x myfile

    ```


    `a` 是 ugo 的缩写，或“所有”。所以现在所有的 x 权限都应该被取消。


    ```

    rm myfile

    ```


    使用此命令，你正在删除该文件，但由于没有写入权限。rm 会询问你是否确定，显示如下消息：


    ```

    rm: remove ‘myfile’, overriding mode 0444?

    ```


    你应该输入 y 并回车来响应。这是 rm 的一个功能，而不是权限事实。删除文件的权限来自于目录权限，而你有目录的权限。然而，rm 试图提供帮助，问题中的 044
    代表什么？模式是一个十二位的二进制数字，例如：00100110100。044 是这个二进制数字以八进制（基数 8）表示的形式，这是编写模式的惯用方法。所以你可以用
    `chmod 444 myfile` 代替 `chmod ugo=r myfile`。


