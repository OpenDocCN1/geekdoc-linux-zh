    ## 3.6 Initialize and Activate a Swap Partition


    This will be the "Next" menu item once you have created one disk partition. You
    have the choice of initializing and activating a new swap partition, activating
    a previously-initialized one, or doing without a swap partition.


    A swap partition is strongly recommended, but you can do without one if you insist
    and if your system has more than 4MB RAM. If you wish to do this, select the "Do
    Without a Swap Partition" item from the menu and move to the next section.


    It''s always permissible to reinitialize a swap partition, so select "Initialize
    and Activate a Swap" unless you are sure you know what you are doing. This menu
    choice will first present you with a dialog box "Please select the partition to
    activate as a swap device." The default device presented should be the swap partition
    you''ve already set up; if, just press Enter.


    Next you have the option to scan the entire partition for unreadable disk blocks
    caused by defects on the surface of the hard disk platters. This is useful if
    you have MFM, RLL, or other SCSI disks, and it never hurts (although it can be
    time-consuming). Properly working disks in most modern systems do not require
    this step, because they have their own internal mechanisms for mapping out bad
    disk blocks. Finally, there is a confirmation message because initialization will
    destroy any data previously on the partition. If all is well, select "Yes." The
    screen will flash as the initialization program runs.


    ## 3.7 Initialize a Linux Partition


    At this point, the next menu item presented should be "Initialize a Linux Partition."
    If it isn''t, either you haven''t completed the disk partitioning process, or
    you haven''t made one of the menu choices dealing with swap partition.


    You can initialize a Linux partition, or alternately you can mount a previously
    initialized one. Note that dbootstrap will not upgrade old system without destroying
    it. If you''re upgrading, Debian can usually upgrade itself, and you won''t need
    to use dbootstrap. The Debian 2.1 release notes contain upgrade instructions²


    If you are using old disk partitions that are not empty, i.e., if you want to
    just throw away what is on them, you should initialize them (which erases all
    files). Moreover, you must initialize any partitions that you created in the disk
    partitioning step. About the only reason to


    2. http://www.debian.org/releases/slink/i386/release-notes/ch-upgrading.en.html


    mount a partition without initializing it at this point would be to mount a partition
    upon which you have already performed some part of the installation process using
    this same set of installation floppies.


    Select the “Next” menu item to initialize and mount the / disk partition. The
    first partition that you mount or initialize will be the one mounted as /(pronounced
    “root”). You will be offered the choice to scan the disk partition for bad blocks,
    as you were when you initialized the swap partition. It never hurts to scan for
    bad blocks, but it could take 10 minutes or more to do so if you have a large
    disk.


    Once you’ve mounted the / partition, the “Next” menu item will be “Install Operating
    System Kernel and Modules” unless you’ve already performed some of the installation
    steps. You can use the arrow keys to select the menu items to initialize or mount
    disk partitions if you have any more partitions to set up. If you have created
    separate partitions for /var,/usr, or other filesystems, you should initialize
    or mount them now.


    ### 3.7.1 Mount a Previously-Initialized Partition


    An alternative to the “Initialize a Partition” step is the “Mount a Previously-Initialized
    Partition” step. Use this if you are resuming an installation that was interrupted
    or if you want to mount partitions that have already been initialized.


    ## 3.8 Install Operating System Kernel and Modules


    This should be the next menu step after you’ve mounted your root partition, unless
    you’ve already performed this step in a previous run of dbootstrap. First, you
    will be asked to confirm that the device you have mounted on root is the proper
    one. Next, you will be offered a menu of devices from which you can install the
    kernel. Choose the appropriate device from which to install the kernel and modules;
    this will be either a CD-ROM device or the first floppy device.


    If you’re installing from floppies, you’ll need to feed in the Rescue Floppy (which
    is probably already in the drive), followed by the Drivers Floppy.


    ## 3.9 Configure PCMCIA Support


    There is an alternate step, before the "Configure Device Driver Modules" menu
    selection, called "Configure PCMCIA Support." This menu is used to enable PCMCIA
    support.


    If you have PCMCIA but are not installing your Debian system using it (i.e., installation
    with a PCMCIA Ethernet card), you need not configure PCMCIA at this point. You
    can easily configure and enable PCMCIA at a later point, after installation is
    complete. However, if you are installing by way of a PCMCIA network device, this
    alternate must be selected, and PCMCIA support must be configured prior to configuring
    the network.


    If you need to install PCMCIA, select the alternate below "Configure Driver Modules."
    You will be asked which PCMCIA controller your system contains. In most cases,
    this will be i82365. In some cases, it will be tcic; your laptop-vendor-supplied
    specifications should provide the information. You can generally leave the next
    few sets of options blank. Again, certain hardware has special needs; the Linux
    PCMCIA HOWTO contains plenty of information in case the default doesn''t work.


    In some unusual cases, you may also need to modify the file /etc/pcmia/config.opts.
    You can open your second virtual terminal (Left Alt-F2) and edit the file and
    then reconfigure your PCMCIA, or you can manually force a reload of the modules
    using insmod and rmod.


    Once PCMCIA is properly configured and installed, you should configure your device
    drivers as described in the next section.


    ## 3.10 Configure Device Driver Modules


    Select the "Configure Device Driver Modules" item and look for devices that are
    on your system. Configure those device drivers, and they will be loaded whenever
    your system boots.


    You don''t have to configure all your devices at this point; what is crucial is
    that any device configuration required for the installation of the base system
    is done here.


    At any point after the system is installed, you can reconfigure your modules with
    the modconf program.


    > 3. http://metalab.unc.edu/LDP/HOWTO/PCMCIA-HOWTO.html


    ## 3.11 Configure the Network


    You''ll have to configure the network even if you don''t have a network, but you''ll
    only have to answer the first two questions – “Choose the Host name,” and “Is
    your system connected to a network?”


    Here are some technical details you may find handy: The program assumes the IP
    address is the bitwise AND of your system''s IP address and your mask. It will
    guess the broadcast address by the bitwise OR of your system''s IP address with
    the bitwise negation of the netmask. It will guess that your gateway is also your
    DNS server. If you can''t find any of these answers, the system guesses. You can
    change them once the system has been installed, if necessary, by editing /etc/init.d/network


    ## 3.12 Install the Base System


    During the “Install the Base System” step, you''ll be offered a menu of devices
    from which you may install the base system. Here, you need to select your CD-ROM
    device.


    You will be prompted to specify the path to the base2_1.tgz file. If you have
    official Debian media, the default value should be correct. Otherwise, enter the
    path where the base system can be found, relative to the media''s mount point.
    As with the “Install Operating System Kernel and Modules” step, you can either
    let dbootstrap find the file itself or type the path at the prompt.


    ### 3.12.1 Configure the Base System


    At this point you''ve read in all of the files that make up a minimal Debian system,
    but you must perform some configuration before the system will run.


    You''ll be asked to select your time zone. There are many ways to specify your
    time zone; we suggest you go to the “Directories:” pane

