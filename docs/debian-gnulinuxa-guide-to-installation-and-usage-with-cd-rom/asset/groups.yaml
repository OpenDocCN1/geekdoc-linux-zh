    # Figure 3.2 dselect Access screen


    ![](img/aa5a57a80d657e37512ee7f063d22238_52_0.png)


    The list is generated by setting the installation methods under methods of the
    new Package Acquisition section. This method allows installation from local locations,
    web resources, FTP and supports full installation and dependency checking as well
    as multiple sources. You can see the list by running apt-get and list.


    Here and in this document we talk of starting another shell. Linux has six console
    sessions or shells available at any one time. You switch between them by pressing
    Left Alt-F1 through Left Alt-F6, after which you log in on your new shell and
    go ahead. The console used by the install process is the first one, a.k.a. tty1,
    so press Left Alt-F1 when you want to return to that process.


    # 3.20.2 Once dselect Is Launched


    In dselect, you will get this screen:

    Debian Linux ''dselect'' package handling frontend.

    0. [A]ccess Choose the access method to use.

    1. [U]date Update list of available packages, if possible.

    2. [S]elect Request which packages you want on your system.

    3. [I]Install Install and upgrade wanted packages.

    4. [C]onfig Configure any packages that are unconfigured.

    5. [R]emove unwanted software.

    6. [Q]uit Quit dselect.


    Let’s look at these one by one.


    # Access


    The Access screen is shown in Figure 3.2 on page 35. Here we tell dselect where
    our packages are. Ignore the order that these appear in. It is very important
    that you select the proper method installation. You may have a few more methods
    listed, or a few less, or may see them listed in a different order; just don''t
    worry about it. In the following list, we describe the different methods.


    **multi_cd**. Quite large and powerful, this complex method is the recommended
    way of installing a recent version of Debian from a set of multiple binary CDs.
    Each of these CDs should contain information about the packages in itself and
    all prior CDs (in the file Packages.cd). When you first select this method, be
    sure the CDROM you will be using is not mounted. Place the last binary disk of
    the set (we don''t need the source CDs) in the drive and answer the questions
    you are asked:


    ```

    CD-ROM drive location

    Confirmation that you are using a multi-cd set

    The location of the Debian distribution on the disk(s)

    [ Possibly ] the location(s) of the Packages list

    ```


    Once you have updated the available list and selected the packages to be installed,
    the multi_cd method diverges from normal procedure. You will need to run an “install”
    step for each of the CDs you have, in turn. Unfortunately, due to the limitations
    of dselect, it will not be able to prompt you for a new disk at each stage; the
    way to work for each disk is outlined here:


    - 1. Insert the CD in the CD-ROM drive.

    - 2. From the main dselect menu, select “Install.”

    - 3. Wait until dpkg finishes installing this CD. (It may report installation
    successful, or possibly installation errors. Don’t worry about these until later.)

    - 4. Press Return to go back to the main dselect menu.

    - 5. Repeat with the next CD in the set.


    It may be necessary to run the installation step more than once to cover the order
    of package installation; some packages installed early may need to have later
    packages installed before they configure properly. Running a “Configure” step
    is recommended to help fix any packages that may end up in this stage.


    **multi_nfs, multi_mount**. These are similar to the multi_cd method and are refinements
    on the theme of coping with changing media – for example, installing from a multi_cd
    set exported via NFS from another machine’s CD-ROM drive. indexdselect!multi-NFS,
    multi-mount installation


    **apt**. One of the best options for installation from a local mirror of the Debian
    archive or from the network. This method uses the “apt system” to complete dependency
    analysis and ordering, so it''s most likely to install packages in the optimal
    order.


    Configuration of this method is straightforward. You may select any number of
    different locations, mixing and matching file: URLs (local disks or NFS mounted
    disks), http: URLs, or ftp: URLs. Note, however, that the HTTP and FTP options
    do not support local authenticating proxies.


    If you have proxy server for either HTTP or FTP (or both), make sure you set the
    http_proxy and ftp_proxy environment variables, respectively. Set them from your
    shell before starting dselect by using the following command:


    ```

    # export http_proxy=http://gateway:3128/

    # dselect

    ```


    # Update


    dselect will read the Packages or Packages.gz files from the mirror and create
    a database on your system of all available packages. This may take a while as
    it downloads and processes the files.


    # Select


    Hang on your hat. This is where it all happens. The object of the exercise is
    to select just which packages you wish to have installed.


    Press Enter. If you have a slow machine, be aware that the screen will clear and
    can remain blank for 15 seconds. Don''t start basting keys at this point.


    The first thing that comes up on the screen is page 1 of the Help file. You can
    get to this help by pressing ? at any point in the “Select” screens, and you can
    page through the help screens by hitting the . (full key).


    Before you dive in, note these points:


    - To exit the “Select” screen after all selections are complete, press Enter.
    This will return you to the main screen if there is no problem with your selection.
    Otherwise, you will be asked to deal with that problem. When you are happy with
    any given selection, press Enter to get out.

    - Problems are quite normal and are to be expected. If you select package A and
    that package requires package B to run, dselect will warn you of the problem and
    will most likely suggest a solution. If package A conflicts with package B (i.e.,
    if they are mutually exclusive), you will be asked to decide between them.


    # 38 Chapter 3 Step-by-Step Installation


    Table 3.1 Special dselect keys

    | Key | Description |

    |---|---|

    | + | Select a package for installation. Place a package on hold |

    | = | Remove a package. |

    | - | Remove a package and its configuration files. |

    | i, I | Toggle/cycle information displays. |

    | o, 0 | Cycle through the sort options. |

    | v, V | A terse/verbose toggle. |


    Table 3.2 dselect Package States

    | Flag | Meaning | Possible values |

    |---|---|---|

    | E | Error | Space, R |

    | I | Installed | Space, U |

    | O | Old | Space, n |

    | M | Mark | Space, n |


    Once you have updated the available list and selected the packages to be installed,
