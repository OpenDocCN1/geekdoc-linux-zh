    ## 7.1.2 Mode


    In addition to being owned by one user and one group, every file and directory
    also has a mode, which determines who''s allowed to read, write, and execute the
    file (and run it, if it''s a program). There are a few other things determined
    by the mode, but they''re advanced topics we''ll skip them for now.


    The mode looks like this in the ls output: -rw-r--r--. For now, we''ll consider
    nine of these parts: those that control read, write, and execute permissions for
    the user owning the file, the group owning the file, and others (everyone on the
    system, sometimes called world).


    In the mode line, the first "element" gives the file type. The - in this case
    means it''s a regular file. If it was d, we''d be looking at a directory. There
    are also other possibilities too complex to go into here; for details, please
    see section 13.2.2 on page 111.


    The remaining nine elements are used to display the file''s mode. The basic 9
    bits (read, write, and execute for user, group, and other) are displayed as three
    blocks of rwx.


    So if all permissions are turned on and this is a regular file, the mode will
    look like this: -rwxrwxrwx. If it was a directory with all permissions turned
    off for others and full permissions for user and group, it would be drwxr-xr---.


    Table 7.1 describes the meaning of the read, write, and execute permissions for
    both files and directories.


    Directory modes can be a little confusing, so here are some examples of the effects
    of various combinations:


    ```

    r--

    ```


    ### Table 7.1 Permissions in Linux


    | Code | Name | Allows for Files | Allows for Directories |

    | --- | --- | --- | --- |

    | r | read | Examine contents of file | List contents of directory or remove |

    | w | write | Modify file | Add files in directory |

    | x | execute | Run as a command | Access files in directory |


    The user, group, or other with these permissions may list the contents of the
    directory, but can do nothing else. The files in the directory can''t be read,
    changed, deleted, or manipulated in any way. The only permitted action is reading
    the directory itself, that is, seeing what file it contains.


    ```

    rw-

    ```


    Write permission has no effect in the absence of execute permission, this mode
    behaves just like the above mode.


    ```

    r-x

    ```


    This mode permits the files in a directory to be listed and permits access to
    those files. However, files can''t be created or deleted. Access means that you
    can view, change, or execute the files as permitted by the files'' ownership permissions.


    ```

    -x

    ```


    Files in this directory can be accessed, but the contents of the directory can''t
    be listed, so you have to know what filename you''re looking for in advance (unless
    you''re exceptionally good at guessing). Files can''t be created or deleted.


    ```

    rwx

    ```


    You can do anything you want with the files in this directory, as long as it''s
    permitted by the permissions on the files themselves.

    Directory write permission determines whether you can delete files in a directory.
    A read-only file can be deleted if you have permission to write to the directory
    containing it. You can''t delete a file from a read-only directory even if you''re
    allowed to make changes to the file.

    This also means that you own a directory you can always delete files from it,
    even if those files belong to root.

    Directory execute permission determines whether you have access to files and thus
    whether file permissions come into play. If you have execute permissions to a
    directory, file permissions for that directory become relevant. Otherwise, file
    permissions just don''t matter; you can''t access the files anyway.


    ## 7.1.3 Permissions in Practice


    This section goes through a short example session to demonstrate how permissions
    are used. To change permissions, we''ll use the chmod command.


    ```

    cd; touch myfile

    ```


    There are a couple of new tricks here. First, you can use ; to put two commands
    on one line. You can type the above as:


    ```

    $ cd

    $ touch myfile

    ```


    or as:


    ```

    $ cd; touch myfile

    ```


    Either way the same thing will end up happening.

    Recall that cd by returns to your home directory. touch is normally used to change
    the modification time of the file to the current time. But it has another interesting
    feature: if the file doesn''t exist, touch creates the file. So you''re using
    it to create a file to practice with. Use `ls -l` to confirm that the file has
    been created and notice the permissions mode:


    ```

    $ ls -l

    -rw-r--r-- 1 user 0 Nov 18 22:04 myfile

    ```


    Obviously the time and user/group names will be different when you try it. The
    size of the file is 0, because touch creates an empty file.

    -rw-r--r-- is the default permissions mode on Debian.


    ```

    chmod +x myfile

    ```


    This command means to add (+) execute (x) permissions for the user (u) who owns
    the file. Use `ls -l` to see the effects.


    ```

    chmod g-r myfile

    ```


    Here you''ve subtracted (-) read permission (r) from the group (g) owning the
    file and from everyone else (others, o). Again, use `ls -l` to verify the effects.


    ```

    chmod ugo-rx myfile

    ```


    You''ve set (=) user, group, and other permissions to read and execute. This sets
    permissions to *exactly* what you''ve specified and unsets any other permissions.
    So all rx should be set, and all w should be unset. Now, no one can write to the
    file.


    ```

    chmod a-x myfile

    ```


    a is a shortcut for ugo, or “all.” So all the x permissions should now be unset.


    ```

    rm myfile

    ```


    With this command, you''re removing the file, but without write permissions. rm
    will ask if you''re sure by displaying the following message:


    ```

    rm: remove ‘myfile’, overriding mode 0444?

    ```


    You should respond by typing y and pressing Enter. This is a feature of rm, not
    a fact of permissions. Permission to delete a file comes from the directory permissions,
    and you have permission in the directory. However, rm tries to be helpful, figuring
    that if you didn''t want to change the file (and thus remove permission), you
    don''t want to delete it either, so it asks you.


    What was 0444 business in the question from rm? The permissions mode is a twelve-digit
    binary number, like this: 00100110100. 0444 is this binary number represented
    as an octal (base 8) number, which is the conventional way to write a mode. So
    you can type chmod 444 myfile instead of chmod ugo=r myfile.


