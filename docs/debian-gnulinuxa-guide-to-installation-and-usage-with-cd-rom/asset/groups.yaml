    Did you not back up your disks? Here''s your first chance to wipe out all of the
    data on your disks and your last chance to save your old system. If you haven''t
    backed up all of your disks, remove the floppy drive, reset the system, and run
    backups.


    ## 3.5 Partition a Hard Disk


    Whatever the “Next” menu selection is, you can use the down-arrow key to select
    “Partition a Hard Disk.” Go ahead and do this now, then press Enter.


    The “Partition a Hard Disk” menu item presents you with a list of disk drives
    you can partition and runs a partitioning application called cfdisk. You must
    create at least one “Linux native” (type 83) disk partition, and you probably
    want at least one “Linux swap” (type 82) partition, as explained in later in this
    section.


    You will now create the partitions that you need to install Debian. For this example,
    the assumption is that you are partitioning an empty hard disk.


    The boot partition must reside within the first 1,024 cylinders of your hard disk
    (see section 2.3.3 on page 14). Keeping in mind, use the right-arrow key to highlight
    the “New” menu selection, and then press Enter. You will be presented with the
    choice of creating a primary or a logical partition. To help ensure that the partition
    containing the boot information is within the first 1,024 cylinders, create a
    primary partition first. This primary partition will be your “Linux native” partition.


    Highlight the “Primary” menu selection and press Enter. Next you will need to
    enter how large you want that partition to be. Review section 2.3.2 on page 13
    if you''re not sure how large it should be. Remember to leave enough space for
    your swap partition (see section 2.3.5 on page 16). Enter the partition size you
    want and then press Enter. Next you will be asked if you want to place the partition
    at the beginning of free space or at the end. Place it at the beginning to ensure
    that it lies within the first 1,024 cylinders. Highlight “Beginning” and press
    Enter. At this point the partition you created is listed. Notice that the partition
    by default, a Linux native partition was created. This partition must now be made
    bootable. Make sure that the “Bootable” menu selection is highlighted and press
    Enter. The partition should now have the word “Boot” listed under the “Flags”
    column.


