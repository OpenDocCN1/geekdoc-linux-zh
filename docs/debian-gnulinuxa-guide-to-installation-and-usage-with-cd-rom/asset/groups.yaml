    terminate until the information being written is read from the pipe. If you read
    from a named pipe, the reading process waits until there''s something to read
    before terminating. The size of the pipe is always zero: It doesn''t store data,
    it just links two processes like the shell. However, because this pipe has a name,
    the two processes don''t have to be on the same command line or even be run by
    the same user.


    You can try it by doing the following:


    ```

    cd; mkfifo mypype

    ```


    Makes the pipe.


    ```

    echo "hello" > mypype &

    ```


    Puts a process in the background that tries to write “hello” to the pipe. Notice
    that the process doesn''t return from the background; it is waiting for someone
    to read from the pipe.


    ```

    cat mypype

    ```


    At this point, the echo process should return, because cat read from the pipe,
    and the cat process will print hello.


    ```

    rm mypype

    ```


    You can delete pipes just like any other file.


    # Sockets


    Sockets are similar to pipes, only they work over the network. This is how your
    computer does networking. You may have heard of “WinSock,” which is sockets for
    Windows.


    We won''t go into these further because you probably won''t have occasion to use
    them unless you''re programming. However, if you see a file marked with type son
    your computer, you know what it is.'
