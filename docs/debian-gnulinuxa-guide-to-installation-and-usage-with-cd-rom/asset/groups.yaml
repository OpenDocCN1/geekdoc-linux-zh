    ## 1.4 About This Book


    This book is aimed at readers who are new to Debian GNU/Linux. It assumes no prior
    knowledge of GNU/Linux or other Unix-like systems, but it does assume very general
    knowledge about computers and hardware; you should know what the basic parts of
    a computer are, and what one might use a computer to.


    In general, this tutorial tries to help understand what happens inside a Debian
    system. The idea is to empower you to solve new problems and get the most out
    of your computer. There''s plenty of theory and fun facts thrown in with the “How
    To” aspects of the manual.


    We''d love to hear your comments about this book! You can reach the authors at
    debian-guide@complete.org. We''re especially interested in whether it was helpful
    to you and how we could make it better. Whether you have a comment or think this
    book is the greatest thing since sliced bread, please send us e-mail.


    Please do not send the authors technical questions about Debian, because there
    are other forums for that; see Appendix A on page 119 for more information on
    the documentation and getting help. Only send mail regarding the book itself to
    the address below.


    ### 1.4.1 How to Read This Book


    The best way to learn about any computer program is by using it. Most people find
    reading a book without using the program is beneficial. The best way to learn
    about Unix and GNU/Linux is by using them. Use GNU/Linux for everything you can.
    Feel free to experiment!


    Debian isn''t as obvious as some other operating systems. You will probably end
    up reading at least the first few chapters of this book. GNU/Linux''s power and
    complexity make it difficult to approach at first, but far more rewarding in the
    long run.


    The suggested way to learn is to read a little, and then play a little. Keep playing
    until you''re comfortable with the concepts, and then skipping around in the book.
    You''ll find a variety of topics are covered, some of which you might find interesting.
    After a while, you should feel confident enough to start using commands without
    knowing exactly what they do. This is a good thing.


    Tip: If you mistakenly type a command or don''t know how to exit a program, press
    CTRL-c (the Ctrl key and the lowercase letter c pressed simultaneously). This
    will often stop the program.


    ### 1.4.2 Conventions


    Before going on, it''s important to be familiar with the typographical conventions
    used in this book.


    When you should simultaneously hold down multiple keys, a notation like CTRL-a
    will be used. This means “press the Ctrl key and press lowercase letter a.” Some
    keyboards have both Alt and Meta; most home computers have only Alt, but the Alt
    key behaves like a Meta key. If you have no Meta key, try the Alt key instead.


    Keys Alt and Meta are called modifier keys because they change the meaning of
    standard keys like the letter A. Sometimes you need to hold down more than one
    modifier; for example, Meta-Ctrl-a means to simultaneously press Meta, Ctrl, and
    lowercase a.


    Some keys have a special notation – for example, Ret (Return/Enter), Del (Delete
    or sometimes Backspace), Esc (Escape). These should be fairly self-explanatory.


    Spaces used instead of hyphens mean to press the keys in sequential order. For
    example, CTRL-x RET means to simultaneously type Ctrl and lowercase a, followed
    by the letter x, followed by pressing Return. (On sample sessions, this key is
    labeled Enter. Same key, different name.)


    In sample sessions, bold face text denotes characters typed by the user, italicized
    text denotes comments about a given part of the sample session, and all other
    text is output from entering a command. For shorter commands, you sometimes find
    that the command can be found within other text, highlighted with a monospaced
    font.


    ## 2 Getting Started


    > “A journey of a thousand miles must begin with a single step.” – Lao-Tsu


    Now that you’ve read about the ideas and philosophy behind Linux and Debian, it’s
    time to start putting it on your computer! We start by talking about how to prepare
    for a Debian install, then about partitioning your disk, and finally, how to start
    up the installation system.


    ## 2.1 Supported Hardware


    Debian does not impose hardware requirements beyond the requirements of the Linux
    kernel and the GNU tools.


    Rather than attempting to describe all the different hardware configurations that
    are supported for the PC platform, this section contains general information and
    pointers to where additional information can be found.


    ## Chapter 2 Getting Started


    There are two excellent places to check for detailed information: the Debian System
    Requirements¹ list and the Linux Documentation Project Hardware Compatibility
    HOWTO². For information on video card support, you may also want to look at the
    XFree86³ web site.


    ### 2.1.1 Memory and Disk Space Requirements


    You must have at least 4MB of memory and 35MB of available hard disk space. If
    you want to install a reasonable amount of software, including the X Window system,
    and some development programs and libraries, you''ll need at least 300MB. For
    an essentially full installation, you''ll need around 800MB. To install everything
    available in Debian, you''ll probably need around 2GB. Actually, installing everything
    doesn''t make sense because some packages provide the same services.


    ## 2.2 Before You Start


    Before you start, make sure to back up every file that is now on your system.
    The installation procedure can wipe out all of the data on a hard disk! The programs
    used in installation are quite reliable and have seen years of use; still, a false
    move can cost you. Even after backing up, be careful and think about your answers
    and actions. Two minutes of thinking can save hours of unnecessary work.


    Debian makes it possible to have both Debian GNU/Linux and another operating system
    installed on the same system. If you plan to use this option, make sure that you
    have on hand the original CD-ROM or floppies of the other installed operating
    systems. If you partition your boot drive, you may find that you have to reinstall
    your existing operating system''s boot loader⁴ or the entire operating system.


    ### 2.2.1 Information You Will Need


    If your computer is connected to a network 24/7, you should ask your network''s
    administrator for the following:


    - Your host name (you may be able to decide this on your own)

    - The IP address of your network

    - The netmask to use with your network

    - The broadcast address to use on your network

    - The IP address of the default gateway you should route to, if your network has
    a gateway

    - The system on your network you should use as a DNS server

    - Whether you connect to the network using Ethernet

    - Whether your Ethernet interface is a PCIA card, and if so, the type of PCIA
    controller you have


    If your only network connection is a telephone line using PPP or an equivalent
    dialup connection, you don''t need to worry about getting your network up until
    your system is already installed. See section 11.1 on page 99 for setting up PPP.


    ## 2.3 Partitioning Your Hard Drive


    Before you install Debian on your computer, it is generally a good idea to plan
    how the contents of your hard drive will be arranged. One part of this process
    involves partitioning your hard drive.


    ### 2.3.1 Background


    Partitioning your disk simply refers to the act of breaking up your disk into
    sections. Each section is then independent of the others. It''s roughly equivalent
    to putting walls in a house; after that, adding furniture to one room doesn''t
    affect any other room.


    If you already have an operating system on your system (Windows 95, Windows NT,
    DOS, etc.) and you want to install Debian GNU/Linux on the same disk, you will
    probably need to repartition the disk. In general, changing a partition that already
    has a filesystem on it will destroy any information in that filesystem. Therefore,
    you should always make backups before doing any repartitioning. Using the analogy
    of the house, you would probably want to move all the furniture out of the way
    before moving a wall or risk destroying your furniture. Luckily, there is an alternative
    for some users; see section 2.3.6 on page 16 for more information.


    At a bare minimum, GNU/Linux needs one partition for itself. You can have a single
    partition containing the entire operating system, applications, and your personal
    files. Most people choose to give GNU/Linux more than the minimum number of partitions,
    however.

