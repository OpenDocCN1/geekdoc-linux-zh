    ## 9.1 X 简介


    GUI（图形化用户界面）是 Windows 和 Mac 操作系统的不可或的一部分。对于不使用 GUI 的系统，编写应用程序几乎是不可能的。Linux 更加模块化，也就是说，它由许多小的、独立的组件组成，可以根据人的需要进行使用。其中一个组件就是
    X Window 系统，或简称为 X。该组件也被称为 X11。请注意，“X Windows”这种说法是不正确的。


    ## 9.2 启动 X 环境


    有两种启动 X 的方法。第一种是在你想启动手动启动 X。要这样做，请登录文本控制台之一并输入 `startx`。这将启动 X 并切换到你的虚拟控制台。


    第二种（推荐的）使用 X 方法是使用 `xdm` 或 X 显示管理器（Display Manager）。基本上，`xdm` 在虚拟控制台上为你提供了一个漂亮的图形登录提示，你在那里登录即可。


    默认情况下，任种方法都会启动 `xterm`，这是一个包含 shell 提示符的小窗口。在 shell 提示符处，你可以像在文本控制台上一样输入任何命令。因此你可以使用
