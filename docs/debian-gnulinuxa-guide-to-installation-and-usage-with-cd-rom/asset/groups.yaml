    | Second, third, etc. serial ports SCSI tape units (automatic rewind) | /dev/ttyS1,
    /dev/ttyS2, etc. |

    | SCSI tape units (no automatic rewind) | /dev/st0, /dev/st1, etc. /dev/nst0,
    /dev/nst1, etc. |

    | SCSI ROMs | /dev/scd0, /dev/scd1, etc.


    and second partitions of the first IDE disk drive in your system. Linux represents
    the primary partitions with the drive name plus the numbers 1 through 4. For example,
    the first primary partition on the first IDE drive is /dev/hda1. The logical partitions
    are numbered starting at 5, so the logical partition on that same drive is /dev/hda5.
    Remember that the extended partition - that is, the primary partition holding
    the logical partitions - is not usable by itself. This applies to SCSI drives
    as well as IDE drives.


    Let''s assume you have a system with two SCSI disks, one at SCSI address 2 and
    the other at SCSI address 4. The first disk (at address 2) is named sda and the
    second sdb. If the sdb drive has three partitions on it, it will be named sda1,
    sda2, and sda3. The same applies to the sdb disk and its partitions. Note that
    if you have two SCSI host bus adapters (i.e., controllers), the order of the drives
    can get confusing. The best solution in this case is to watch the boot messages,
    assuming you know the drive models.'
