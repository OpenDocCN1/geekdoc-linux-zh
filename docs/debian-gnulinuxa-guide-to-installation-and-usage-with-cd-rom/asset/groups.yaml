    82 Chapter 8 Working with Text Files


    Tip: zless is great for viewing documentation, which is often shipped in .gz format.


    The difference between the two kinds of files is purely a matter of what they
    contain, unlike in some other systems (such as DOS and MacOS), which actually
    treat the files differently.


    Text files can contain shell scripts, documentation, copyright notices, or any
    other human-readable text.


    Incidentally, this illustrates the difference between source code and binary executables.
    /bin/ls is a binary executable you can download from Debian, you can also download
    a text file that tells the computer how to create /bin/ls. This text file is the
    source code. Comparing /bin/ls to /etc/profile illustrates how important source
    code is if someone wants to understand and modify a piece of software. Free software
    provides you or your consultants with this all-important source code.


    ## 8.2 Text Editors


    A text editor is a program used to create and change the contents of files. Most
    operating systems have a text editor: DOS has edit, Windows has Notepad, MacOS
    has SimpleText.


    Debian provides a large variety of text editors. vi and Emacs are the classic
    two, which are probably both the most powerful and the most widely used. Both
    vi and Emacs are quite complex and require some practice, but they can make editing
    text extremely efficient. Emacs runs in a terminal and under the X Window system;
    we normally run in a terminal but the vim variant has a -g option that allows
    it to work with X editors.


    Simpler editors include nedit, ae, jed, and xcoral. nedit and xcoral provide easy-to-use
    X Window system graphical interfaces. Additionally, there are several variants
    of vi, and you can find a GNU Emacs variant called Emacs.


    This book does not cover the use of any particular editor in detail, though we
    will briefly introduce ae as it is small, fast, and can be found even on the Debian
    rescue, so it pays to know a bit about it for usage in a pinch. When you need
    to do more serious editing, check out vim or GNU Emacs. Emacs provides an excellent
    interactive tutorial of its own; to read it, load Emacs with the emacs command
    and type F1. Emacs is an excellent choice for new users interested in a general-purpose
    editor.


    ## 8.3 Using ae


    You can start ae by giving it the name of a file to edit, like so:


    ```

    $ ae filename.txt

    ```


    This will bring up an editor screen. The top part of this screen provides some
    quick help; the bottom shows the file you''re editing. Moving around in this editor
    is simple; just use the arrow keys. You can save the file by pressing C-x C-s
    and then exit the editor by pressing C-x C-c. Once you feel comfortable with the
    editor, you can press C-x C-h to turn off the help. That''s it! Knowing this will
    let you do basic editing. For programming or more detailed editing work, you''ll
    want to investigate other editors as discussed earlier.


    ## 9.1 Introduction to X


    A GUI (Graphical User Interface) is part and parcel of the Windows and Mac operating
    systems. It is basically impossible to write applications for systems that do
    not use the GUI. Linux is more modular, that is, it''s made up of many small,
    independent components that can be used according to one''s needs. One of these
    components is the X Window system, or simply X. This component is also called
    X11. Please note that “X Windows” is not correct.


    ## 9.2 Starting the X Environment


    There are two ways to start X. The first is to start X manually when you feel
    like it. To do so, log in to one of the text consoles and type startx. This will
    start X and switch you to your virtual console.


    The second (and recommended) way to use X is with xdm or X Display Manager. Basically,
    xdm gives you a nice graphical login prompt on the virtual console, and you log
    in there.


    By default, either method will also start xterm, which is a small window containing
    a shell prompt. At the shell prompt, you can type any commands just as you would
    on a text console. So you can follow all the examples in this book using xterm;
    the only difference from a text console is that you don''t have to log on to xterm
    because you already logged in to X.


    There are also a lot of things you can do only in X, which are covered in this
    chapter.


    One note: the default xterm window has a smallish font. If you have a small monitor
    or very high resolution or bad eyesight, you may want to fix this. Follow these
    steps:


    1. Move the mouse pointer to the center of the xterm window.

    2. Hold down the Control key and the right mouse button simultaneously. This will
    give you a font menu.

    3. Point to the font you want and release the mouse button.


    ## The X Window System


    This chapter describes the X Window system graphical user interface. It assumes
    that you have already successfully configured X as described in the X Installation
    Manual (again, the install manual is not yet written; for now you will need to
    use the contents of /usr/doc/X11). Once you install X, you can enter the environment
    by typing startx or via xdm, depending on your choice.


    86 Chapter 9 The X Window System


    X itself is a means for programs to talk to your hardware without knowing what
    kind of mouse and video card you have. That is an abstraction of hardware meaning
    that programs only have to be written once and work on every computer. In X jargon,
    the program that speaks to the hardware is known as an *X server*. User applications
    that ask the X server to show graphics on the screen are called *X clients*. The
    X server doesn''t provide any of the features of a GUI, such as resizing and rearranging
    windows. A special X client, called a *window manager*, draws borders and title
    bars for windows, resizes and arranges windows, and provides facilities for starting
    other clients from a menu. Window managers available on Debian include fwm, icewm,
    afterstep, flux, twm, and enlightenment. You''ll probably want to try all them
    and pick your favorite. Neither the X server nor the window manager provide a
    *file manager*; that is, windows containing icons for files and directories. You
    can launch a file manager as a separate application, and there are many of them
    available. The GNOME desktop project is developing icon-based file manager.


    A final feature of X is its network transparency, meaning that X clients don''t
    care if they are talking to an X server on the same machine or an X server somewhere
    on the network. In practical terms, this means you can run a program on a more
    powerful remote machine but display it on your desktop.


    Basic Operations


    There are certain commonly used operations in X that you should familiarize yourself
    with. This section describes some of the basic operations that you may find useful.


    ### 9.3.1 The Mouse


    The mouse in X works pretty much the same as the mouse on other systems, except
    that it has three buttons. If your mouse has only two, you can simulate the middle
    button by clicking both buttons simultaneously. This is kind of tricky and annoying,
    so investing in a $15-button mouse probably isn''t a bad idea. These are available
    from most computer retailers.


    The buttons are numbered from left to right assuming you have a right-handed mouse.
    So button one is on the left, two is in the middle, and three is on the right.
    You may see either the numbers or the locations in documentation.


    X has a simple built-in copy-and-paste facility. To select text to copy, you click
    and drag with the left mouse button. This should select the text to copy, assuming
    the application you''re using has copy-and-paste support. To paste the text, you
    click the middle button in a different X application. For example, if you receive
    an e-mail containing a URL, you can select the URL with the left button and then
    click in your web browser’s “Location” field with the middle button to paste it
    in.


