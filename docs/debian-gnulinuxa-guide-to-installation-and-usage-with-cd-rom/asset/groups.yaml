    ## 54 Chapter 5 The Basics


    cd /


    cd means "change directory." In this case, you’ve asked to change to the root
    directory.


    pwd


    This verifies that you’re working in the root directory.


    ls


    Lets you see what’s in /.


    cd


    Typing cd with no arguments selects your home directory – /home/yourname as the
    current working directory. Try pwd to verify this.


    Before continuing, you should know that there are actually two different kinds
    of filenames. Some of them begin with /, the root directory, such as /etc/profile.
    These are called absolute filenames because they refer to the same file no matter
    what current directory is. The other kind of filename is relative.


    Two directory names are used only in relative filenames: . and .. The . refers
    to the current directory, and .. is the parent directory. These are “shortcut”
    directories. They exist in every directory. Even the root directory has a parent
    directory – it’s its own parent!


    So filenames that include . or .. are relative. If I’m in /usr/bin and type ../etc,
    I’m referring to /usr/etc. If I’m in /var and type ../etc, I’m referring to /etc.
    Note that a filename without the root directory at the front implicitly has .
    at the front. So you can type local/bin, or /local/bin and it means the same thing.


    A final tip: the tilde ~ is equivalent to typing cd with no arguments. Also, you
    can type things like cd ~/practice/mysubdirectory to change to the directory /home/yourname/practice/mysubdirectory.
    In a similar way, ~user is equivalent to the home directory of the user “user,”
    which is probably something like /home/user; so ~user/docs/debian.ps is equivalent
    to /home/user/doc/debian.ps.


    Here are some more commands to try out, that you know about relative filenames.
    cd to your home directory before you begin.


    mkdir practice


    In your home directory, make a directory called practice. You’ll use this directory
    to try out some other commands. You might type ls to verify that your new directory
    exists.


