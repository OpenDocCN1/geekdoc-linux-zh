    # 3


    # # Step-by-Step Installation


    dbootstrap is the name of the program that is run after you have booted into the
    installation system. It is responsible for initial system configuration and the
    installation of the “base system.”


    The main job is dbootstrap and the main purpose of your initial system configuration
    is to configure certain core elements of your system. For instance, this includes
    your IP address, host name, and other aspects of your networking setup, if any.
    This also includes the configuration of “kernel modules,” which are drivers that
    are loaded into the kernel. These modules include storage hardware drivers, network
    drivers, special language support, and support for other peripherals. Configuring
    these fundamental things is done first, because it is often necessary for the
    system to function properly for the next steps of installation.


    dbbootstrap is a simple, character-based application. It is very easy to use;
    generally, it will guide you through each step of the installation process in
    a linear fashion. You can also go back and repeat steps if you made a mistake.
    Navigation within dbootstrap is accomplished with the arrow keys, Enter, and Tab.'
