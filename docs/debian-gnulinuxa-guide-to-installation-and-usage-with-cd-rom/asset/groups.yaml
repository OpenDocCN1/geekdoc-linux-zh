    Debian GNU/Linux CD-ROM 插入 CD-ROM 驱动器。首先切换切换 CD-ROM 驱动器。大多数情况下，它是 D：


    ```

    C:\WINDOWS>D:

    ```


    现在，切换到包含磁盘镜像的目录。


