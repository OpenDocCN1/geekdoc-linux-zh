    partition）”。”。它包含了系统的内核组件。如果任何其他分区发生损坏，你仍然可以启动进入 GNU/Linux 来修复系统。这可以节省你无需从头重新安装系统的麻烦。


    第二个原因在业务环境中通常更为重要，但取决于你对机器的使用方式。假设某些程序运行失控并开始大量占用空间。如果导致问题的进程需要 root 权限（系统会为用户预留一定百分比的磁盘空间），你可能会突然发现磁盘空间耗尽了。这并不是好事，因为操作系统在许多方面需要使用真实文件（交换空间之外）。此外，这甚至可能不是源于本地的问题。例如，未经请求的电子邮件（“垃圾邮件”）可以很容易填满一个分区。通过使用更多的分区，你可以保护系统免受此类问题的影响。再次以电子邮件为例，通过将
    `/var/spool/mail` 目录放在单独的分区上，即使垃圾邮件填满了该分区，系统的大部分功能仍可以运行。


    另一个原因仅适用于你有一个大型 IDE 硬盘且既未使用 LBA 寻址未使用覆盖驱动程序²。在这种情况下，你必须将根分区放在硬盘的前 1,024 个磁道内，通常大约为
    524 兆。关于此问题的更多信息，请参见第 14 页的第 2.3.3 节。


    大多数人认为交换分区（swap partition）也是必要的，尽管这并不完全准确。“交换”是操作系统的缓存空间，它允许系统除物理内存外还使用磁盘存储作为“虚拟内存”。将交换空间放在单独的分区上允许
    Linux 更高效地利用它。虽然可以强制 Linux 使用普通文件作为交换空间，但并不建议这样做。


    使用更多分区的唯一缺点是，通常很难预知你的需求。如果你把分区分得太小，要么必须重新安装系统，要么必须不断移动内容以为空间不足的分区腾出空间。另一方面，如果你把分区分得太大，可能会浪费本可以用于其他地方的空间。


