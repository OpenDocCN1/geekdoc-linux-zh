    The "Debian base system" is a core set of packages that are required to run Debian
    in a minimal, stand-alone fashion. dbootstrap will install from your CD-ROM, as
    described in section 3.12 on page 30. Once you have configured and installed the
    base system, your machine can "stand on its own."


    The final step is the installation of the remainder of the Debian system. This
    would include the applications and documents that you actually use on your computer,
    such as the X Window system, editors, shells, and development environments. The
    rest of the Debian system can be installed from CD-ROM. At this point, you will
    be using the standard Debian package management tools, such as dselect. This step
    is described in section 3.20 on page 34.'
