    ## 10. Filesystems


    ### 10.1 Concepts


    A filesystem in general means a hierarchy of files. On GNU/Linux system there''s
    no necessary correspondence between directories and physical devices as there
    is in Windows, in which each drive has its own directory tree beginning with a
    letter.


    Instead, each physical device such as a hard disk or floppy disk has one or more
    filesystems on it. In order to make a filesystem accessible, it''s assigned to
    a particular directory in another filesystem. To avoid circularity, the root filesystem
    (which contains the root directory /) is not stored within any other filesystem.
    You have access to it automatically when you boot Debian.


    A directory in one filesystem that contains another filesystem is known as a mount
    point. A mount point is a directory in the first filesystem on one device (such
    as your hard disk) "contains" a second filesystem, perhaps on another device (such
    as a floppy disk). To access a filesystem, you must mount it at some mount point.


    Filesystem is also used to mean a type. For example, MS-DOS and Windows... only
    characters.


    If you want to run commands at the end of your X session, you can have `.xsession`
    run a window manager of the like and wait for it to finish. That is, leave off
