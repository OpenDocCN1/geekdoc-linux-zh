    ## 2.5 Booting the Installation System


    You should now have the boot prompt. Simply press Enter at this point.

    Once you press Enter, you should see the message Loading..., and then Uncompressing
    Linux..., and then a screenful or so of information about the hardware in your
    system. In general, you can ignore these messages. Linux will look for various
    hardware devices and will tell you what it finds and doesn''t find. Don’t worry
    about messages at this point.

    Just wait until you see the Color Selection screen. If you have trouble, see section
    B.2 on page 127.


    # 3 Step-by-Step Installation


    dbootstrap is the name of the program that is run after you have booted into the
    installation system. It is responsible for initial system configuration and the
    installation of the “base system.”


    The main job is dbootstrap and the main purpose of your initial system configuration
    is to configure certain core elements of your system. For instance, this includes
    your IP address, host name, and other aspects of your networking setup, if any.
    This also includes the configuration of “kernel modules,” which are drivers that
    are loaded into the kernel. These modules include storage hardware drivers, network
    drivers, special language support, and support for other peripherals. Configuring
    these fundamental things is done first, because it is often necessary for the
    system to function properly for the next steps of installation.


    dbootstrap is a simple, character-based application. It is very easy to use; generally,
    it will guide you through each step of the installation process in a linear fashion.
    You can also go back and repeat steps if you made a mistake. Navigation within
    dbootstrap is accomplished with the arrow keys, Enter, and Tab.


    ## 3.1 Select Color or Monochrome Display


    Once the system has finished booting, dbootstrap is invoked. The first thing that
    dbootstrap asks about is your display. You should see the “Select Color or Monochrome
    display” dialog box. If your monitor is capable of displaying color, press Enter.
    The display should change from black-and-white to color. Then press Enter again,
    on the “Next” item, to continue with the installation.


    If your monitor can display only black and white, use the arrow keys to move the
    cursor to the “Next” menu item, and then press Enter to continue with the installation.


    ## 3.2 Debian GNU/Linux Installation Main Menu


    You may see a dialog box that says “The installation program is determining the
    current state of your system and the next installation step that should be performed.”
    This is a phase in the installation program automatically figures out what you
    probably need to do next. In some cases, you may not even see this box.


    During the entire installation process, you will be presented with the main menu,
    titled “Debian GNU/Linux Installation Main Menu.” The choices at the top of the
    menu will change to indicate your progress in installing the system. Phil Hughes
    wrote in the Linux Journal¹ that you could teach a chicken to install Debian!
    He meant that the installation process was mostly just pecking at the Enter key.
    The first choice on the installation menu is the next action that you should perform
    according to what the system detects you have already done. It should say “Next,”
    and at this point the next step in installing the system will be taken.


    ## 3.3 Configure the Keyboard


    Make sure the highlight is on the “Next” item and press Enter to go to the keyboard
    configuration menu.


    Move the highlight to the keyboard selection you desire and press Enter. Use the
    arrow keys to move the highlight. In most cases, you can just use the default
    U. layout.


