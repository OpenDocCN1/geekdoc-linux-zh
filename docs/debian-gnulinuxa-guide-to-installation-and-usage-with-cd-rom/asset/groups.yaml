    ## 6.5 Controlling Input and Output


    Throughout your Linux life, you will most likely find that manipulating application
    input and output can be a very powerful thing to do. This section describes some
    of the things that controlling input and output can do for you.


    ### 6.5.1 stdin, stdout, Pipelines, and Redirection


    Every process has at least three connections to the outside world. The standard
    input is one source of the process''s data; the standard output is one place the
    process sends data; and the standard error is a place the process can send error
    messages. (These are often abbreviated stdin, stdout, and stderr.).


    The words "source" and "place" are intentionally vague. These standard input and
    output locations can be changed by the user; they could be the screen, the keyboard,
    a file, even a network connection. You can specify which locations to use.


    When you run a program from the shell, usually standard input comes from your
    keyboard, and standard output and error both go to your screen. However, you can
    ask the shell to change these defaults.


    For example, the echo command sends it to standard output, normally the screen.
    But you can send it to a file using the output redirection operator, >. For example,
    to put the word "Hello" in the file myfile, use this command:


    ```

    echo Hello > myfile

    ```


    Use cat or your text file pager (more or less) to view myfile''s contents; see
    Figure 6.3 on page 68.


    You can change the standard input of a command with the input redirection operator,
    <. For example, cat < myfile will display the contents of myfile. This is not
    useful in practice; for convenience, the cat command accepts a filename argument.
    So you can simply say myfile, and the effect will be the same. redirection operators


    Under the hood, cat < myfile means that the shell opens myfile and feeds its contents
    to the standard input of cat. cat myfile, without the redirection operator, means
    that the cat command receives one argument (myfile), opens the file itself, and
    then displays the file.


    There''s a reason for the double functionality, however. For example, you can
    connect the standard output of one command to the standard input of another. This
    is called a pipeline, and it uses the pipe operator¹,, |.


    Perhaps you want to see the GNU General Public License in reverse. To do this,
    use the tac command (it''s cat, only backward). Try it out:


    ```

    tac /usr/doc/copyright/GPL

    ```


    Unfortunately, it goes by too quickly to read. So you only get to see a couple
    of paragraphs. The solution is a pipeline:


    ```

    tac /usr/doc/copyright/GPL | less

    ```


    ```

    tac /usr/doc/copyright/GPL | tr GQ | less

    ```


    You could get the same effect using temporary files and redirection, for example:


    ```

    tac /usr/doc/copyright/GPL > tmpfile

    tr GQ < tmpfile > tmpfile2

    less < tmpfile2

    rm tmpfile tmpfile2

    ```


    Clearly a pipeline is more convenient.


    ## 6.6 Filename Expansion


    Often you want a command to work with a group of files. Wildcards are used to
    create a filename expansion pattern: a series of characters and wildcards that
    expands to a list of filenames. For example, the pattern /etc/* expands to a list
    of all the files in /etc.


    - * is a wildcard that can stand for any series of characters, so the pattern
    /etc/* will expand to a list of all the filenames beginning with /etc/.


    - 1. Depending on your keyboard, this may either appear as a vertical bar or a
    broken vertical bar, but it can almost always be found above the backslash (\).


    - 2. Actually, files beginning with . are not included in the expansion of *.


    This filename list is most useful as a set of arguments for a command. For example,
    the /etc directory contains a series of subdirectories called rc0.d, rc1.d, etc.
    Normally to view the contents of these, you would type the following:


    ```

    ls /etc/rc0.d /etc/rc1.d /etc/rc2.d /etc/rc3.d

    ls /etc/rc4.d /etc/rc5.d /etc/rc6.d /etc/rcS.d

    ```


    This is tedious. Instead, you can use the wildcard as shown here:


    ```

    ls /etc/rc?

    ```


    /etc/rc?.d expands to a list of filenames that begin with rc, followed by any
    single character, followed by .d.

    Available wildcards include the following:


    - *Matches any group of 0 or more characters.

    - ?Matches exactly one character.

    - [...]If you enclose some characters in brackets, [abc] matches either a, or
    b, or c. If you add a ^ after the first bracket, the sense is reversed; so [^abc]
    matches any character that is not a, b, or c. You can include a range, such as
    [a-j], which matches anything between a and j. The match is case sensitive, so
    to allow any letter, you must use [a-zA-Z].


    Expansion patterns are simple once you see some concrete examples:


    - *.txtThis will give you a list of filenames that end in .txt, since the * matches
    anything at all.

    - *.[hc]This gives a list of filenames that end in either .h or .c.

    - a??This gives you all three-letter filenames that do not begin with a.

    - [^a]??This gives you all three-letter filenames that do not begin with a.

    - a*This gives you every filename that starts with a, regardless of how many letters
    it has.


