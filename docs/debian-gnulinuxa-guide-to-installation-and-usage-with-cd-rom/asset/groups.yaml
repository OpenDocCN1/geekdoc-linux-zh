    ## 9.3.2 X Clients


    Programs that communicate with the X server are called X clients. Most of these
    programs will ask the X server to display windows on the screen.


    You start an X client the same way you start any other Debian program. Simply
    type the name of the client on the command line. Try typing xterm into an existing
    xterm window, and a new xterm client will appear on the screen.


    You may notice that the original xterm is now useless, because your shell is waiting
    for the second xterm to finish. To avoid this problem, you can run the X client
    in the background adding a & after the command name like this: `xterm &`. If you
    forget, you can place a running process in the background. First suspend the process
    with CTRL-z, and then place it in the background with the bg command.


    If you use a program often, your window manager will generally provide a way to
    put that program in a convenient graphical menu.


    ## 9.3.3 Troubleshooting


    Sometimes when you launch an X client from a graphical menu, you won''t be able
    to see any error messages if it fails. You can find any error messages in the
    file `~/.xsession-errors`.


    ## 9.3.4 Leaving the X Environment


    To leave X, you need to use a menu. Unfortunately for you, this is different for
    every window manager, and for most window managers, it can be configured in many
    ways. If there''s an obvious menu, look for an entry like "Exit" or "Close Window
    Manager." If you don''t see a menu, clicking each of the mouse buttons on the
    background of the screen. If all fails, you can forcibly kill the X server by
    pressing CTRL-ALT-Backspace. Forcibly killing the server destroys any unsaved
    data in open applications.


    ## 9.4 Customizing Your X Startup


    When you start X, Debian runs some shell scripts that start your window manager
    and other X clients. By default, a window manager, an xconsole, and an xterm are
    started for you.


    To customize your X startup, the file `/etc/X11/config` must contain the line
    `allow-user-xsession`. If it does not, log in as root and add the line now. Then
    log back in as yourself and continue the tutorial.


    You can see how Debian''s X startup works in the file `/etc/X11/Xsession`. Note
    that you can change the behavior of `/etc/X11/Xsession` by modifying the file
    `/etc/X11/config`, which specifies a few system-wide preferences.


    To run the clients of your choice when X starts, you create an executable shell
    script called `.xsession` in your home directory.


    ```

    $ touch ~/.xsession

    ```


    This creates the file.


    ```

    $ chmod +x ~/.xsession

    ```


    Once `.xsession` is created, you need to edit it to do anything useful with your
    favorite text editor. You can add anything you want to do in this script. However,
    when the script''s process terminates, X also terminates.


    In practical terms, this means that you often end the script with a call to `exec`.
    Whatever program you exec will replace the script process with itself, so commands
    found after the exec line will be ignored. The program you exec will become the
    new owner of the script process, which means X will terminate when this new program''s
    process terminates.


    Say you end `.xsession` with the line `exec fwwm`. This means the fwwm window
    manager will run when X starts. When you quit the fwwm window manager, your X
    session will end, and all other clients will be shut down. You do not have to
    use a window manager here; you could `exec xterm`, in which case typing exit in
    that particular xterm would cause the entire X session to end.


    If you want to run other clients before you use exec, you will need to run them
    in the background. Otherwise `.xsession` will pause until each client exits and
    then continue to the next line. See the previous section on running jobs in the
    background (basically you want to put an ampersand at the end, as in `xterm &`).


    You can take advantage of this behavior. If you want to run commands at the end
    of your X session, you can have `.xsession` run a window manager of the like and
    wait for it to finish. That is, leave off the exec and just `exec fwwm` by itself.
    Then put the commands of your choice after fwwm.


    It would probably help to look at a few sample `.xsession` files. In all the examples,
    replace `fwwm` with the window manager of your choice. The simplest `.xsession`
    just runs a window manager:


    ```

    exec fwwm

    ```


    This will run fwwm, and the X session will end when fwwm exits. If you do it without
