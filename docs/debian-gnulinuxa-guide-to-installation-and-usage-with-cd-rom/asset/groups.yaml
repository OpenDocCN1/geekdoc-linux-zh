    # 116 第13章 高级主题


    如果你正在运行网络服务器，还有其他事情需要注意。首先，你应该卸载或关闭任何你没有使用的网络服务。一个很好的起点是 `/etc/inetd.conf` 文件；你可能可以禁用其中一些服务。对于大多数网络服务，也可能控制谁可以访问它们；`/etc/hosts.allow`
    和 `/etc/hosts.deny`（在 `man 5 hosts_access` 中有说明）可以控制谁可以访问哪些服务。你还应该关注 Debian 的补丁或更新；这些更新可以在你最近的常用
    Debian FTP 镜像站中找到。


    其他还适用于以下规则：


    - 永远不要告诉任何人你的密码。

    - 永远不要使用 telnet 或 FTP 等工具在互联网上以明文发送你的密码。相反，请使用加密协议或避免远程登录。

    - 尽可能避免使用 root 用户。

    - 不要安装不可信的软件，并且不要以 root 身份安装。

    - 尽可能避免将文件设置为全局可写。`/tmp` 是该规则的一个例外。


    虽然这对于运行服务器的人来说可能用处不大，但了解一些安全知识仍然是有价值的。Debian 安全机制保护你的系统免受许多病毒的影响。


    ## 13.4 使用 Debian 进行软件开发


    Debian 为软件开发和编程提供了一个极佳平台。它支持的语言和类语言包括：C, C++, Objective-C, Perl, Python, m4, Ada,
    Pascal, Java, awk, Tcl/Tk, SQL, 汇编语言, Bourne shell, csh 等。编写程序超出了本书的范围，但这里是 Debian
    中一些流行的开发程序：


    - gcc: GNU C 编译器，一个现代优化的 C 编译器。

    - g++: 来自 gcc 系列的 C++ 编译器。

    - cpp: gcc 的 C 预处理器。

    - perl: Perl 解释器。Perl 是一种非常强大的“胶水”语言。

    - gdb: GNU 调试器，用于调试许多语言的程序。

    - gprof: 用于性能分析，该程序帮助你找到提高程序性能的方法。

    - emacs: GNU Emacs 是程序员的编辑器和 IDE。

    - as: GNU 汇编器。


    ## II 参考文献


    ## 阅读文档和获取帮助


    ### A.1 文档种类


    在 Debian 系统上，你可以在至少以下地方找到文档：


    - man pages（帮助手册），通过 `man` 命令读取。

    - info pages，通过 `info` 命令读取。

    - `/usr/doc/package` 目录，其中 `package` 是 Debian 包的名字。

    - `/usr/doc/HOWTO/` 包含 Linux 文档项目的 HOWTO 文，如果你安装了包含这些内容的 Debian 包）。

    - 许多命令都有 `-h` 或 `--help` 选项。输入命令名后加上这些选项之一即可尝试。


    > 提示：

    zless 适用于阅读 /usr/doc 中的文件；详情请参阅第 81 页的第 8.1 节。


    ## 附录 A 阅读文档和获取帮助


    - Debian 文档项目¹ 编写了一些手册。

    - Debian 支持页² 有常见问题解答（FAQ）和其他资源。你也可以尝试 Linux 网站³。


    文档来源的复杂多样性存在有很多原因。例如，info 本应该取代 man，但 man 尚未消失。然而，知道有这么多文档存在是一件好事！去哪里寻找帮助呢？这里是一些建议：


    - 使用 man pages 和 --help 或 -h 选项来获取命令语法和选项的快速摘要。如果程序还没有 info 页面，也使用 man。

    - 如果程序有 info 文档，请使用 info。

    - 如果这两者不起作用，查看 /usr/doc/pathname，如果有 man 页面或 info 页面，那里就有 Debian 特有的信息。

    - 使用 HOWTOs 获取如何设置特定内容的说明或关于你特定硬件的信息。例如，Ethernet HOWTO 提供了大量关于以太网的信息，PPP HOWTO
    详细解释了如何设置 PPP。

    - 使用 Debian 文档项目手册获取概念解释和 Debian 特有的信息。

    - 如果其他方法都失败了，请问别人。参阅第 122 页的第 A.1.3 节。


    上述在第 49 页的第 5.1 节讨论了如何使用 man pages。非常简单：按空格键进入下一页，按 q 退出阅读。使用 info、查看 /usr/doc
    中的文件以及向他人寻求帮助将在本章的剩余部分进行讨论。


    ### A.1.1 使用 info


    info 是 GNU 文档查看器。某些程序提供 info 格式的文档，你可以使用 info 查看这些文档。你只需输入 info，或者提供一个主题即可启动查看器：


    ```

    info emacs

    ```


    你也可以查看关于 info 自身的信息，包括教程，如下：


    - http://www.debian.org/~elphick/ddp/

    - http://www.debian.org/support/

    - http://www.linux.org/


    ### 文档种类 121


    现在，你可以使用这些键进行导航：


    - 箭头键：在文档中移动光标

    - m RET（回车）：选择光标所在的菜单项

    - u：在文档中“向上”移动

    - n：移动到下一页

    - p：移动到上一页

    - s：搜索内容

    - g：跳转到特定页面

    - q：退出 info


    你可能会注意到屏幕顶部显示下一页、上一页和“向上”页面。


    ### A.1.2 HOWTOs


    除了书籍，Linux 文档项目制作了一系列短文，描述如何设置 GNU/Linux 的某些方面。通常，Debian 有关于 HOWTOs 的包。doc-text
    包含了文本格式的 HOWTOs；doc-html 包含了可浏览 HTML 格式的 HOWTOs（惊喜吧！）。注意，Debian 提供了德语、法语、意大利语、日语、韩语、波兰语、瑞典语和中文版本。这些可以在
    /usr/doc 中找到。然而，你可能可以在网上的 LDP 主页找到更新的版本⁴。


    > 4. http://metalab.unc.edu/LDP/


    ### A.1.3 帮助


    寻求帮助的正确地方是邮件列表 debian-user@lists.debian.org。如果你知道 IRC（网络聊天），可以使用 irc.debian.org
    上的 #debian 频道。也可以聘请付费顾问提供保证服务。Debian 网站⁵有关于这些资源的更多信息。


    再次，请不要向本书的作者寻求帮助。你可能不知道自己特定问题的答案；如果邮件 debian-user，你将获得更高质量的回复，速度更快。


    始终保持礼貌，并通过阅读文档来尝试帮助自己。记住，Debian 是一项志愿者工作，人们花时间帮助你是在提供帮助。


    ## 提问技巧


    - 首先阅读显而易见的文档。命令选项和命令的功能将在那里涵盖。这包括 man pages 和 info 文档。

    - 如果你的问题是关于设置内容（如 PPP 或以太网），检查 HOWTO 文档。

    - 确保答案不在本书中。

    - 在做了基础查找后，不要害怕提问。

    - 不要害怕寻求概念解释、建议以及文档中不常见的其他。

    - 包含任何相关信息。你几乎总是需要提到你使用的 Debian 版本。你可能还需要提到任何相关包的版本：命令 `dpkg -l packagename` 可以告诉你这些。说明你已经尝试了什么以及结果如何很有帮助。如果有任何错误消息，请包含包含。


    5. http://www.debian.org/


