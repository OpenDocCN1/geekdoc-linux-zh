    我们之前提到过 GNU/Linux 是一个多任务系统。它可以同时执行许多任务。这些任务中的每一个被称为进程（process）。获取这种感觉最好的方法是在 shell
    提示符处输入 `top`。你将得到一个进程列表，根据它们在你眼前不断变化的计算机处理时间进行排序。在显示顶部，有一些关于系统的信息：有多少用户登录，总共有多少进程，你有多少内存以及使用了多少。


    在最右侧列，注意在所有以“d”结尾的命令中——如 `kflushd` 和 `inet`——“d”代表 daemon（守护进程）。Daemon 原意是“磁盘和扩展监控”。daemon
