    else, you''ll have to ask him for an account on the system and a corresponding
    username.


    You also have a password, so no one else can pretend to be you. If you don''t
    have a password, anyone can log on to your computer from the Internet and do bad
    things. If you''re worried about security, you should have a password.


    Many people prefer to trust others not to do anything malicious with their account;
    hopefully your work environment doesn''t encourage paranoia. This is a perfectly
    reasonable attitude; it depends on your personal priorities and your environment.
    Obviously a home system does not need to be as secure as a military installation.
    Debian allows you to be as secure or as insecure as you like.


    When you start, you''ll see a **prompt**: a request from the computer for some
    information. In this case, the prompt is login::


    You should type your username and, when requested, your password. The password
    does not appear on the screen as you type it. Press **Enter** after the username
    and the password. If you type your username or password incorrectly, you''ll have
    to start over.


    If you do it correctly, you''ll see a brief message and then a $ **prompt**. The
    $ is printed by a special program called the **shell** and is thus called a *shell
    prompt*. This is where you give commands to the system.


    Try entering the command `whoami` now. There is a *cursor* to the right of the
    shell prompt. Your cursor is a small underscore or rectangle that indicates where
    you''re typing; it moves as you move type. Always press **Enter** when you''re
    done typing a shell command.


    `whoami` tells you your username. You''ll then get a new shell prompt.


    For the rest of the book, when you want to enter a command, you should type it
    at the shell prompt and press the **Enter** key.


    When you''re working, you may want to log out of the system. To exit the shell,
    enter the exit command. Keep in mind that if you remain logged in, someone could
    come along and use your account. Hopefully you can trust those in your office
    or home not to do this; but if you do not trust your environment, you should be
    certain to log out when you leave.


    # 4.2 Command History and Editing the Command Line


    Whatever you type after the shell prompt and before pressing **Enter** is called
    a *command line*. It''s a line of text that commands the computer to do something.
    The Debian default shell offers several features to make entering command lines
    easy.'
