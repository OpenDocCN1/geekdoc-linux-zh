    你可以向上滚动查看之前的命令并重新运行它们，或者对它们进行微调后重新运行。尝试一下：输入任何命令，例如 `whoami`；然后按**向上箭头**。`whoami`
    命令将重新出现在提示符处。然后你可以按回车键再次运行 `whoami`。


    如果你输入了多条命令，可以一直按向上箭头键来回溯查看。如果你在多次执行相同的操作，或者输入错了命令并想返回进行修改，这个功能就非常方便。你可以按向下箭头键向反方向移动，查看最近的命令。你还可以使用左、右箭头键在命令中移动以进行修改。最简单的方法是尝试输入
    `whoami` 而不是其他命令，然后使用左箭头键回退。你可以使用退格（Backspace）或删除（Delete）键删除字符。


    还有一些高级功能（虽然不需要全部背下来）：


    - Ctrl-a 将光标移动到行首。

    - Ctrl-k 删除到行尾的所有字符（k 代表“kill”，即杀死）。

    - Ctrl-y 粘贴上次删除的内容，将其重新插入当前光标位置（y 代表“yank”，即拉取）。

    - Ctrl-e 将光标移动到行尾。


    尽管去尝试一下命令行编辑来找找感觉。


    ## 4.3 以 Root 工作


    由于 Debian 是一个多用户系统，其设计目标是防止任何用户破坏整个系统，因此内核不允许普通用户更改系统文件。这意味着系统将保持其应有的状态，免受意外事故甚至是恶意作剧的伤害。然而，有时你需要更改系统文件；例如，你可能想要安装新软件或配置网络。要做到这一点，你必须拥有比普通用户更高的权限；你必须成为
    root 用户（也称为超级用户）。要成为 root，只需使用用户名 `root` 和安装期间设置的密码进行登录，具体详见第 32 页的第 3.1 节。


    在很多地方，只有系统管理员拥有 root 密码，且只有系统管理员才能执行必须执行的操作。如果你在使用自己的电脑，你就是系统管理员。如果你没有 root 权限，将依靠系统管理员来执行任何需要
    root 权限的任务。


    即使在共享或教育服务器上，如果你有 root 密码，你也可以正确使用它。现在尝试以 root 身份登录。输入 `whoami` 命令来验证你的身份。然后立即注销。当你是
    root 时，内核不会保护你免受伤害，因为 root 有权对系统进行任何操作。除非绝对必要，否则不要进行任何操作。这并不是安全问题，而是稳定性问题。如果系统能防止你犯错，它的运行将会好得多。


    你可能发现 `sudo` 比以 root 登录更方便。`sudo` 允许你假设另一个用户的身份，除非你指定了另一个人（你可以记住 sudo 代表 Super
    User，尽管有些人说它是 Set User）。这里有一个可以尝试的操作：以用户身份而非 root 身份登录。当你执行系统管理任务时，你应该尽可能以自己的身份进行操作。然后使用需要
    root 权限的 `su`，并使用 `exit` 命令关闭权限，这样你就无法再破坏任何东西。


    你可以使用 `su` 来假设系统上任何用户的身份，而不仅仅是 root。要这样做，输入 `su [user]`，其中 `user` 是你想变成的用户。当然，你必须知道该用户的密码，除非
    root 没有密码。


    ## 4.4 虚拟终端


    Linux 内核支持虚拟终端。这些终端提供了一种方法，让你的单个屏幕和键盘看起来像连接到同一系统的多个终端。坦率地说，使用虚拟终端是 Debian 最简单的操作之一：有“热键”可以快速在终端之间切换。要尝试一下，登录你的系统并按
    Alt-F2（同时按下左侧 Alt 键和 F2，即功能键 2）。


    ### 图 4.1 使用 su 的示例话


    ```

    $ whoami 检查你的当前用户名

    username 这将显示你的用户名

    $ su 向系统请求超级用户访问权限

    Password: machine:~ 在此处输入你的 root 密码

    root 你现在以 root 身份登录了

    machine:~ exit 退出你的 root shell

    $ exit 退出你的“普通” shell

    ```


    你应该会发现自己处于另一个登录提示符下。不要惊慌：你现在位于第 2 号虚拟终端（VC）！在这里登录并做一些事情——多运行几次 `whoami` 命令或其他命令——以确认这是一个真实的
    shell。你现在可以通过 Alt-F1 返回第 1 号虚拟终端。或者你也可以直观地移动到第三个虚拟终端（Alt-F3）。


    Debian 默认开启六个虚拟终端，你通过 Alt 键和功能键 F1 到 F6 访问它们。（从技术上讲，开启的虚拟终端更多，但只有六个允许你登录。其他的用于
    X 窗口系统或其他特殊目的。）


    如果你在使用 X 窗口系统，它通常会在第一个未使用的终端上启动——可能是 VC 7。此外，要从 X 虚拟终端切换到前六个之一，你需要在按键序列中加上 Ctrl。但你只用
    Alt 即可从文本 VC 切换到 X 虚拟终端。如果你从未离开 X，就不需要担心这个；X 在启动时会自动把你切换到它的虚拟终端。


    一旦你习惯了它们，虚拟终端可能会成为同时完成许多任务的不可或缺的工具。（X 窗口具有相同相同，提供了多个窗口而不是多个终端。）你可以在每个 VC 上运行不同的程序，或者在一个
    VC 上以 root 身份登录，在另一个 VC 上以自己的身份登录。每个人都可以使用自己的 VC；这在使用 X 时特别方便。


    ## 4.5关机


    > 不要直接关闭电脑！你可能会丢失宝贵的数据！


    如果你是这台电脑的唯一用户，你可能想在使用完后关闭电脑。


    为了避免可能损坏硬件组件，只在一天结束时才关闭电脑。开机和关机是导致组件磨损的两个最大因素。每天开关机一次可能是在电费和电脑寿命之间的最佳折中。


    在使用电脑时，直接按电源开关是不妥的。在没有采取适当措施的情况下重启电脑（使用复位键）也是不好的。Linux 内核为了提高性能有一个磁盘缓存。这意味着它将信息临时存储在
    RAM 中。因为内存比磁盘快数倍，这使得许多文件操作运行更快。Linux 定期将内存中的信息写入磁盘。这被称为同步。为了安全地关闭或重启电脑，你必须告诉电脑清理内存中的所有内容并将其永久存储。


    要重启，只需输入 `reboot` 或按 Ctrl-Alt-Del。


    要关机，你需要以 root 身份登录。作为 root，只需执行关机程序，包括 `sync` 命令，如上所述清理磁盘缓存。当你看到“System halted”时，就可以安全关闭电脑了。如果你的内核和
    BIOS 支持高级电源管理（APM），电脑可能会自动关闭并省去你的麻烦。


