    # 为你的硬盘分区 17


    以下章节包含了关于在安装 Debian 之前在原生操作系统中进行分区的操作。请注意，你需要在其他操作系统命名分区的方式与 Linux 命名分区的方式之间进行映射；参见第
    15 页的表 2.1。


    ## 从 DOS 或 Windows 进行分区


    如果你正在操作现有的 FAT 或 NTFS 分区，建议使用下面的方案或原生的 Windows 或 DOS 工具。否则，其实没有必要从 DOS 或 Windows
    进行分区；Linux 分区工具通常会做得更好。


    ## 无损重分区


    最常见的安装之一是安装到已经包含 DOS（包括 Windows 3.1）、Win32（如 Windows 95, 98, NT）或 OS/2 的系统中，并决定在不破坏原有系统的情况下将
    Debian 放在同一块磁盘上。如第 11 页第 2.3.1 节所示，除非采取某些预防措施，否则减小现有分区的大小几乎会损坏该分区上的数据。这里描述的方法虽然不能保证保护数据，但在实践中效果非常好。作为预防，你应该进行备份。


    在进行任何操作之前，你应该已经决定好如何划分磁盘。本节的方法只会将一个分区分成两部分。其中一个将包含原始操作系统，另一个将用于 Debian。在安装 Debian
    期间，你将有机会根据自己的需要使用磁盘的 Debian 部分，例如，作为交换空间或文件系统。


    其思想是在更改分区信息之前，将分区上的所有数据移动到开头，这样就不会丢失任何内容。重要的是，在数据移动和重分区之间尽可能少操作，以减少文件被写入分区末尾的几率，因为这将减少你可以从分区中获取的空间量。


    你首先需要一个 FIPS 副本，它可以在你的 Debian CD-ROM 的工具目录中找到。此磁盘必须是可启动的。在 DOS 下，可以使用命令 `sys a:`
    为以前格式化过的软盘创建，或使用 `format a:/s` 为未格式化的软盘创建。解压缩归包，并将 `RESTRB.EXE`、`FIPS.EXE` 和 `ERRORS.TXT`
    文件复制到可启动的软盘中。FIPS 附带非常好的文档，你可能想阅读它们。如果你使用磁盘压缩驱动程序或磁盘管理器，务必阅读文档。在继续之前，创建磁盘并阅读文档。


    下一步要完成的是将所有数据到分区的开头。DOS 6.0 及更高版本标准自带的 `DEFRAG` 可以轻松完成这项工作。请参考 FIPS 文档查看其他可能有效的软件列表。注意，如果你有
    Windows 95 或更高版本，你必须从支持那里运行 `DEFRAG`，因为 DOS 不理解用于支持 Windows 95 及更高版本长文件名的 VFAT。


    运行碎片整理程序后（在大容量磁盘上可能需要一段时间），使用你创建的 FIPS 软盘重启。只需输入 `a:\fips` 并按照指示操作即可。


    注意，市场上还有许多其他分区管理器，以防 FIPS 对你不起作用。


    ## 2.3.7 Debian 安装步骤


    在你最初安装 Debian 时，将通过几个不同的步骤：


    1. 启动安装系统

    2. 初始系统配置

    3. 安装基础系统

    4. 启动新安装的基础系统

    5. 安装系统的其余部分


    启动 Debian 安装系统（第一步）通常是使用救援软盘（Rescue Floppy）或从 CD-ROM 完成。


    一旦你进入 Linux，`dbbootstrap` 程序将启动并引导你完成第二步，初始系统配置。该步骤在第 23 页第 3 节中详细描述。


    “Debian 基础系统”是一组为了以最小、独立的方式运行 Debian 所需的核心包。`dbbootstrap` 将从你的 CD-ROM 安装，如第 30
    页第 3.12 节所述。一旦你配置并安装了基础系统，你的机器就可以“自立”运行了。


    最后一步是安装 Debian 系统的其余部分。这包括你在计算机上实际使用的应用程序和文档，例如 X 窗口系统、编辑器、shell 和开发环境。Debian
    系统的其余部分可以从 CD-ROM 安装。此时，你将使用标准的 Debian 软件包管理工具，例如 `dselect`。此步骤在第 34 页第 3.20 节中描述。


    ## 2.4 选择你的安装媒介


    首先，为安装系统选择启动媒介。接下来，选择你将用于安装基础系统的方法。


    要启动安装系统，你有以下选择：可启动的 CD-ROM、软盘或非 Linux 引导程序。


    CD-ROM 启动是最简单的方法之一。并不是所有机器都能直接从 CD-ROM 启动，因此你可能仍需要软盘。大多数平台都支持软盘启动。软盘启动参见第 19 页的
    2.4.2 节。


    ## 2.4.1 从 CD-ROM 安装


    如果你的系统支持从 CD-ROM 启动，你不需要任何软盘。将 CD-ROM 放入驱动器，关闭电脑然后重启。你应该看到一个带有启动提示符的欢迎界面。现在你可以跳到
    2.5 节。


    如果你的计算机没有“看到” CD-ROM，最简单的选择是制作两个启动软盘（见 2.4.2），然后使用它们启动 Debian。不要担心；Debian 使用这两个软盘后，它将顺利地找到你的
    CD-ROM。


    ## 2.4.2 从软盘启动


    从软盘启动并不困难。事实上，你的 CD-ROM 包含了为你创建启动磁盘所需的信息。对于这些指令，你需要准备两个磁盘。将第一个标记为“Debian 2.1 安装/救援磁盘”，第二个标记为“Debian
    2.1 模块/驱动程序磁盘”。


    ## 从磁盘镜像创建软盘


    磁盘镜像是包含软盘完整原始内容的文件。磁盘镜像（如 `resc1440.bin`）不能简单地复制到软盘设备。需要使用特殊程序以原始模式将镜像文件写入软盘。


