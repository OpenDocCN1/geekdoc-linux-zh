    - Whether your Ethernet interface is a PCMIA card, and if so, the type of PCMCIA
    controller you have


    If your only network connection is a telephone line using PPP or an equivalent
    dialup connection, you don''t need to worry about getting your network set up
    until your system is already installed. See section 11.1 on page 99 for information
    on setting up PPP over Debian.


    # 2.3 Partitioning Your Hard Drive


    Before you install Debian on your computer, it is generally a good idea to plan
    how the contents of your hard drive will be arranged. One part of this process
    involves partitioning your hard drive.


    # 2.3.1 Background


    Partitioning your disk simply refers to the act of breaking up your disk into
    sections. Each section is then independent of the others. It''s roughly equivalent
    to putting walls in a house; after that, adding furniture to one room doesn''t
    affect any other room.


    If you already have an operating system on your system (Windows 95, Windows NT,
    DOS, etc.) and you want to install Debian GNU/Linux on the same disk, you will
    probably need to repartition the disk. In general, changing a partition that already
    has a filesystem on it will destroy any information in that filesystem. Therefore,
    you should always make backups before doing any repartitioning. Using the analogy
    of the house, you would probably want to move all the furniture out of the way
    before moving a wall or risk destroying your furniture. Luckily, there is an alternative
    for some users; see section 2.3.6 on page 16 for more information.


    At a bare minimum, GNU/Linux needs one partition for itself. You can have a single
    partition containing the entire operating system, applications, and your personal
    files. Most people choose to give GNU/Linux more than the minimum number of partitions,
    however.'
- md: '

    There are two reasons you might want to break up the filesystem into a number
    of smaller partitions. The first is for safety. If something happens to corrupt
    the filesystem, generally only one partition is affected. Thus, you only have
    to replace (from the backups you''ve been carefully keeping) a portion of your
    system. At the very least, you should consider creating what is commonly called
    a “root partition.” This contains the essential components of the system. If any
    other partitions get corrupted, you can still boot into GNU/Linux to fix the system.
    This can save you the trouble of having to reinstall the system from scratch.


    The second reason is generally more important in a business setting, but it depends
    on your use of the machine. Suppose something runs out of control and starts eating
    disk space. If the process causing the problem has to have root privileges (the
    system keeps a percentage of the disk space from users), you could suddenly find
    yourself out of disk space. This is not good since the operating system needs
    to use real files (besides swap space) for many things. It may not even be a problem
    of local origin. For example, unsolicited e-mail (“spam”) can easily fill a partition.
    By using more partitions, you protect the system from many of these problems.
    Using e-mail as an example again, by putting the directory /var/spool/mail on
    its own partition, the bulk of the system will work even if unsolicited e-mail
    fills that partition.


    Another reason applies only if you have a large IDE disk drive and are using neither
    LBA addressing nor overlay drivers². In this case, you will have to put the root
    partition into the first 1,024 cylinders of your hard drive, usually around 524
    megabytes. See section 2.3.3 on page 14 for more information on this issue.


    Most people feel that a swap partition is also a necessity, although this isn''t
    strictly true. “Swap” is scratch space for an operating system, which allows the
    system to use disk storage as “virtual memory”, in addition to physical memory.
    Putting swap on a separate partition allows Linux to make much more efficient
    use of it. It is possible to force Linux to use a regular file as swap, but this
    is not recommended.


    The only drawback to using more partitions is that it is often difficult to know
    in advance what your needs will be. If you make a partition too small, either
    you will have to reinstall the system, or you will be constantly moving things
    around to make room in the undersized partition. On the other hand, if you make
    the partition too big, you may be wasting space that could be used elsewhere.


    - 5. See your hard drive manual for a description of these features.


    ## 2.3.2 Planning Use of the System


    Disk space requirements and your partitioning scheme are influenced by the type
    of installation you decide to create.


    For your convenience, Debian offers a number of default “profiles” some of which
    are listed later in this section. Profiles are preselected sets of packages designed
    to provide certain desired capabilities on your system. Installation is easier
    since packages that fit your desired profile are automatically marked for installation.
    Each given profile lists the size of the resulting system after installation is
    complete. Even if you don''t use these profiles, this discussion is important
    for planning, since it will give you a sense of how large your partition or partitions
    needs to be. The following are some of the available profiles and their sizes:


    - Server_std. This is a small server profile, useful for a stripped-down server,
    that does not have a lot of niceties for shell users. It basically has an FTP
    server, a web server, DNS, NIS, and POP. It will take around 50MB. Of course,
    this is just the size of the software; any data you serve would be additional.


    - Dialup. This profile would be good for a standard desktop box, including the
    X Window system, graphics applications, sound, editors, etc. The size of the packages
    will be around 500MB.


    - Work_std. This profile is suitable for a stripped-down user machine without
    the X Window system or X applications. It is also suitable for a laptop or mobile
    computer. The size is around 140MB. It is possible to have a simple laptop setup
    including X with less than 100MB.


    - Devel_comp. This is a desktop setup profile with all the popular development
    packages, such as Perl, C, and C++. It requires around 475MB. Assuming you are
    adding X and some additional packages for other uses, you should plan for approximately
    800MB of disk space for this type of installation.


    Remember that these sizes don''t include all the other materials that are normally
    found, such as user files, mail, and data. It is always best to be generous when
    considering the space for your own files and data. Notably, the Debian /var directory
    contains a lot of state information. The installed package management files can
    easily consume 20MB of disk space. In general, you should allocate at least 50MB
    for the /var directory because system log files are also stored there.


    ## 2.3.3 PC Disk Limitations


    A PC BIOS generally adds additional constraints for disk partitioning. There is
    a limit to how many "primary" and "logical" partitions a drive can contain. Additionally,
    there are limits to where on the drive the BIOS looks for boot information. More
    information can be found in the Linux Partition mini-HOWTO. This section will
    include a brief overview to help you plan your scenarios.


    "Primary" partitions are the original partitioning scheme for PC hard disks. However,
    there can be only four of them. To get past this limitation, "extended" or "logical"
    partitions were invented. By setting one of your primary partitions as an extended
    partition, you can subdivide the space allocated to logical partitions. The number
    of logical partitions you can create is much less limited than the number of primary
    partitions you can create; however, you can have only one extended partition per
    drive.


    Linux limits the number of partitions per drive to 15 partitions for SCSI drives
    (3 usable primary, 12 logical partitions), and 63 partitions for IDE drives (3
    usable primary, 60 logical partitions).


    The last thing you need to know about PC BIOS is that the extended partition -
    that is, the primary partition holding the logical partitions - is not usable
    by itself. This applies to SCSI drives as well as IDE drives.


    ## 2.3.4 Device Names in Linux


    Linux represents the primary partitions with the drive name plus the numbers 1
    through 4. For example, the first primary partition on the first IDE drive is
    /dev/hda1. The logical partitions are numbered starting at 5, so the logical partition
    on that same drive is /dev/hda5.


    Let''s assume you have a system with two SCSI disks, one at SCSI address 2 and
    the other at SCSI address 4. The first disk (at address 2) is named sda and the
    second sdb. If the sdb drive has three partitions on it, it will be named sda1,
    sda2, and sda3. The same applies to the sdb disk and its partitions. Note that
    if you have two SCSI host bus adapters (i.e., controllers), the order of the drives
    can get confusing. The best solution in this case is to watch the boot messages,
    assuming you know the drive models.


    ### Table 2.1 Linux Names


    | Device | Linux Name |

    |---|---|

    | First floppy drive | /dev/fd0 |

    | Second floppy drive | /dev/fd1 |

    | First partition on hda (typically OS) | /dev/hda1 |

    | Fifth partition on hdc | /dev/hdc5 |

    | Second partition on sdb | /dev/sdb2 |

    | Entire Primary-Master IDE disk or CD-ROM | /dev/hda |

    | Entire Primary-Slave IDE disk or CD-ROM | /dev/hdb |

    | Entire Secondary-Master IDE disk or CD-ROM | /dev/hdc |

    | Entire Secondary-Slave IDE disk or CD-ROM | /dev/hdd |

    | First SCSI disk | /dev/sda |

    | Second and remaining SCSI disks | /dev/sdb and so forth |

    | First serial port (COM1 in other OSs) | /dev/ttyS0 |

    | Second, third, etc. serial ports SCSI units (automatic rewind) | /dev/ttyS1,
    /dev/ttyS2, etc. |

    | SCSI tape units (no automatic rewind) | /dev/st0, /dev/st1, etc. /dev/nst0,
    /dev/nst1, etc. |

    | SCSI ROMs | /dev/scd0, /dev/scd1, etc. |

