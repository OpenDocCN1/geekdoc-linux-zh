    You can scroll up to previous commands to run them again, or you can modify them
    slightly and then run them again. Try this: Enter any command, such as whoami;
    then press the Up Arrow key. The whoami command will reappear at the prompt. You
    can then press Enter to run whoami a second time.


    If you''ve entered several commands, you can keep pressing the Up Arrow key to
    go back through them. This feature is handy if you''re doing the same thing several
    times, or if you type a command incorrectly and want to go back to fix it. You
    can press the Down Arrow key to move in the other direction toward more recent
    commands. You can also move around the command with the Left and Right Arrow keys
    to make changes. The easiest way is trying whoami instead of, and then use the
    Left Arrow key to move back. You can erase characters with the Backspace or Delete
    keys.


    There are more advanced features as well (no need to memorize them all, though):


    - Ctrl-a moves you to the beginning of the line.

    - Ctrl-k deletes all characters until the end of the line (k stands for “kill”).

    - Ctrl-y pastes the last thing you killed, reinserting it at the current cursor
    position (y stands for “yank,” as in “yank”).

    - Ctrl-e moves the cursor to the end of the line.


    Go ahead and play around with command line editing to get a feel for it.


    ## 4.3 Working as Root


    Because Debian is a multiuser system, designed to keep any user from breaking
    the entire system, the kernel will not allow normal users to change system files.
    This means that things stay the way they are supposed to be, safe from accidents
    and even malicious pranks. However, sometimes you need to change system files;
    for example, you might want to install new software or configure your network.
    To do so, you have to have greater powers than a normal user; you must become
    the root user (also called superuser). To become root, just log on with the username
    root and the password set during installation, as described in section 3.1 on
    page 32.


    At many sites, only the system administrator has the root password, and only the
    system administrator can do the things that one must do. If you''re using your
    own computer, you are the system administrator, of course. If you don''t have
    root privileges, you will have to rely on the system administrator to perform
    any tasks that require root.


    If you have the root password even on a shared or educational server, you''ll
    be able to use it properly. Try logging in as root now. Enter the whoami command
    to verify your identity. Then log out immediately. When you''re root, the kernel
    will not protect you from yourself because root has permission to do anything
    to the system. Don''t do anything unless absolutely necessary. This isn''t a matter
    of security, but rather stability. Your system will run much better if it keeps
    you from making mistakes.


    You may find sudo more convenient than logging in as root. sudo allows you to
    assume the identity of another user unless you specify someone else (you can remember
    that sudo stands for Super User, though some say Set User.). Here''s something
    to try: Log on as a user, not as root. When you''re doing system administration
    tasks, you should do as much as possible as yourself. Then use su which requires
    root privileges, and use the exit command to turn off privileges so you can no
    longer harm anything.


    You can use su to assume the identity of any user on the system, not just root.
    To do this, type su where user is the user you want to become. You''ll have to
    know the user''s password, of course, unless root has no password.


    ## 4.4 Virtual Consoles


    The Linux kernel supports virtual consoles. These provide a way of making your
    single screen and keyboard seem like multiple terminals that are connected to
    the same system. Frankly, using virtual consoles is one of the simplest things
    about Debian: there are "hot keys" for switching among the consoles quickly. To
    try it, log in to your system and press Alt-F2 (simultaneously press the left
    Alt key, and F2, that is function key number 2).


    ### Figure 4.1 Sample session with su


    ```

    $ whoami Check your current username

    username This will show your username

    $ su Ask system for superuser access

    Password: machine:~ Type your root password here

    root You''re now on as root

    machine:~ exit Exit your root shell

    $ exit Exit your “normal” shell

    ```


    You should find yourself at another log prompt. Don’t panic: You are now on virtual
    console (VC) number 2! Log in here and do some things – more whoami commands or
    whatever – to confirm that this is a real shell. You now return to virtual console
    number 1 by pressing Alt-F1. Or you can move to a third virtual console in the
    obvious way (Alt-F3).


    Debian comes with six virtual consoles enabled by default, which you access with
    the Alt key and function keys F1 through F6. (Technically, there are more virtual
    consoles enabled, but only six of them allow you to log in. The others are used
    for the X Window system or other special purposes.)


    If you’re using the X Window system, it will generally start up on the first unused
    console – probably VC 7. Also, to switch from the X virtual console to one of
    the first six, you’ll have to add Ctrl to the key sequence. But you can go from
    a text VC to the X virtual console using only Alt. If you never leave X, you won’t
    have to worry about this; X automatically switches you to its virtual console
    when it starts.


    Once you get used to them, virtual consoles will probably become an indispensable
    tool for getting many things done at once. (The X Window system serves the same
    purpose, providing multiple windows rather than multiple consoles.) You can run
    a different program on each VC or log on as root on one VC and as yourself on
    another. Or everyone in the family can use his or own VC; this is especially handy
    if you use X, in which case you can run several X sessions at once on different
    virtual consoles.


    ## 4.5 Shutting Down


    > Do not just turn off the computer! You risk losing valuable data!


    If you are the only user of your computer, you might want to turn the computer
    off when you''re done with it.


    To avoid possibly weakening hardware components, only turn off the computer when
    you''re done for the day. Power up and power down are the two greatest contributors
    to wear and tear on computer components. Turning the computer on and off once
    a day is probably the best compromise between your electric bill and your computer''s
    lifespan.


    It''s a bit had to just press the power switch when you''re using the computer.
    It is also bad to reboot the computer (with the Reset button) without first taking
    proper precautions. The Linux kernel, in order to improve performance, has a disk
    cache. This means it temporarily stores information in RAM. Because memory is
    thousands of times faster than a disk, this makes many file operations move more
    quickly. Periodically, the information Linux has in memory actually written to
    the disk. This is called syncing. In order to turn off or reboot the computer
    safely, you''ll have to tell the computer to clear everything out of memory and
    put it in permanent storage.


    To reboot, just type reboot or press Ctrl-Alt-Del.


    To shut down, you''ll have to log in as root. As root, just type the shutdown
    procedure, including the sync command, which clears the disk cache as described
    above. When you see System halted, it''s safe to turn off the computer. If you
    have Advanced Power Management (APM) support in your kernel and BIOS, the computer
    might shut itself off and save you the trouble.

    '
