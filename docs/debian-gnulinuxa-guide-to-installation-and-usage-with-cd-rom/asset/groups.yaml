    Now you know how to create, copy, move, rename, and delete files and directories.
    You also learned some shortcuts, like typing cd to jump to your home directory,
    and ~ and .. refer to the current directory and its parent, respectively. You
    should also remember the concept of the root directory, or /, and the alias ~
    for your home directory.


    # 5.2.2 Dot Files and ls -a


    When you type ls, files beginning with a dot are not listed. Traditionally, files
    that contain configuration information, user preferences, and so on begin with
    a dot; these are hidden and out of your way while you do your day-to-day work.
    Sample dot files are ".emacs", ".newsrc", ".bashrc", ".xsession", and ".fwmrc.
    These are used by Emacs, news readers, the Bash shell, the X Window system, and
    the fwm window manager, respectively. It is conventional to end the dot filename
    with rc, but some programs don''t. There are also directories beginning with a
    dot, such as ".gimp" and ".netscape", which store preferences for the Gimp and
    Netscape.


    Sometimes a program will create a dot file automatically; for example, Netscape
    allows you to edit your preferences with a graphical dialog box and then it saves
    your choices. Other times you will create them yourself'
