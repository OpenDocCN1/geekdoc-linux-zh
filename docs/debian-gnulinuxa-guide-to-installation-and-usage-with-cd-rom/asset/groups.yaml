    (install it if you haven''t, it''s quite useful). less /etc/profile to view a
    sample text file. Notice that you can read the characters even if their meaning
    is obscure. less /bin/ls to view a binary file. As ls program is not meant to
    be read by humans.


    Sometimes, you''ll find files that end with .gz. These files may be viewed with
    zless; you can run it like so:


    ```

    zless /usr/doc/ae/changelog.Debian.gz

    ```

