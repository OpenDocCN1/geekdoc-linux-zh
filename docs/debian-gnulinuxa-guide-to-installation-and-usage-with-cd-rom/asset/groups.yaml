    ## 指南指南


    # 1 引言


    我们很高兴有机会向您介绍 Debian！当我们开启 GNU/Linux 之旅程时，我们想先简单谈谈 Debian 到底是什么——它是做什么的，它是如何融入广大的自由软件世界的。然后，我们将谈谈自由软件这一现象，以及它对
    Debian 和您意味着什么。最后，我们用关于这本书本身的信息结束本章。


    ## 1.1 什么是 Debian？


    Debian 是一个用于计算机的自由操作系统（OS）。操作系统是使您的计算机运行的基础程序和工具集。操作系统的核心是内核。内核是计算机上最基础的程序：它处理所有的基础管理工作并允许您启动其他程序。Debian
    使用 Linux 内核，这是一项由 Linus Torvalds 发起并受到全球数千名程序员支持的完全自由软件。构成操作大部分基础工具来自 GNU 项目^1，这些工具也是免费的。


    操作系统的另一个方面是应用软件：帮助完成工作的程序，从编辑文档、运行业务、玩游戏到编写更多软件。Debian 带有超过 1,500 个软件包（将预编译软件打包成一种格式，以便在您的机器上轻松安装）——全部都是免费的。


    Debian 系统有点像金字塔。底部是 Linux。在其之上是所有基础工具，大部分来自 GNU。接着是您在计算机上运行的所有应用软件；其中许多来自 GNU。Debian
    开发人员充当架构师和协调员的角色——仔细地组织系统，并将所有内容整合成一个集成、稳定的操作系统：Debian GNU/Linux。


    GNU/Linux 的设计哲学是将其功能分组成较小的、多用途的部分。这样，您就可以通过新的方式组合这些小部分（程序）来轻松实现新的功能和特性。Debian
    就像一套益智玩具：你可以用它构建出各种东西。


    在使用在使用操作系统时，您希望尽量减少为完成任务而付出的工作。Debian 提供了许多可以提供帮助的工具，但前提是您知道这些工具的作用。花费一小时尝试工作最后却放弃并不是很有效率的做法。本指南将教您了解构成
    Debian 的核心工具：在特定情况下使用什么工具，以及如何将这些不同的工具结合起来。


    ### 1.1.1 谁创建了 Debian？


    Debian 是一个全志愿者、基于互联网的开发项目。有数百志愿者在其中工作。大多数人负责少数软件包，并对他们封装的软件非常熟悉。


    这些志愿者通过遵循一套关于软件包如何组装的严格指南来共同工作。这些指南是在互联网邮件列表的讨论中协作开发的。


    - 1. http://www.gnu.org/

    - 6. http://www.fsf.org/philosophy/shouldbefree.html


    人们开始将自由软件称为“开源软件”，这两个术语是可以互换的。


    您可能会疑惑为什么人们要花费大量时间编写并仔细封装软件，却将其全部免费送出。答案因贡献者人而异。


    许多人相信信息共享和相互合作的自由，他们认为自由软件鼓励了这种行为。维护这些价值观的长期传统被称为“黑客伦理”，始于 20 世纪 50 年代。Debian
    GNU/Linux 项目建立在这些自由、共享和合作的自由软件之上。


    其他人想更多地了解计算机。越来越多的人正在寻找避免昂贵的专有软件的方法。不断增长的社区为了他们收到的所有自由软件做出贡献。


    学术界的许多人创建自由软件，以便将其研究成果投入广泛应用。企业维护自由软件是为了能够更快地实现新功能或聘请顾问！企业也对更高的可靠性和在支持供应商之间进行选择感兴趣。


    其他人将自由软件视为社会福祉，使信息获取民主化并防止世界信息基础设施的过度集中。当然，我们中的许多只是觉得它很棒。


    Debian 致力于自由软件，我们认为如果将其形式化为某种文档将会用。我们的社会契约承诺 Debian 将始终是 100% 的自由软件。当您从 Debian
    主发行安装软件包时，可以确定它符合我们的自由软件指南。


    尽管 Debian 相信自由软件，但在某些情况下人们想在机器上放置专有软件。只要可能Debian 将支持这样做；尽管专有软件未包含在主发行中，但有时可以在
    FTP 站的非自由（non-free）目录下找到，而且越来越多的软件包唯一工作就是安装我们无权分发的专有软件。


    请注意，“黑客”（hacker）一词不应与“破解者”（cracker）一词混淆。简单来说，黑客是友善的，而破解者通常被认为是恶意的。电影和其他媒体形式许多多次错误地使用“黑客”一词而非“破解者”。


    - http://www.debian.org/social_contract


