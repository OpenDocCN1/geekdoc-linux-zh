    # 5.2 Files and Directories


    Files are a facility for storing and organizing information, analogous to paper
    documents. They''re organized into directories, which are called folders on some
    other systems. Let''s look at the organization of files on a Debian system:


    /A simple / represents the root directory. All other files and directories are
    contained in the root directory. If you are coming from the DOS/Windows world,
    / is very similar to C: for DOS, that is the root of the filesystem. A notable
    difference between DOS and Linux however, is that DOS keeps several filesystems:
    C: (first hard disk), A: (first floppy disk), and D: (either CD-ROM or second
