    # 启动 Debian


    你现在已准备好进入 Debian 系统！关闭现有的操作系统，关闭电脑，并将安装/救援磁盘（Install/Rescue Disk）放入软盘驱动器中。现在重新开启电脑。你应该会看到一个带有底部提示符的欢迎屏幕。


    ## 2.5 启动安装系统


    你现在应该看到了启动提示符。此时只需按回车键。

    一旦按下回车键，你应该会看到 Loading...（加载中...），然后是 Uncompressing Linux...（正在解压 Linux...），接着是一屏幕关于你系统硬件的信息。通常情况下，你可以忽略这些信息。Linux
    将寻找各种硬件设备，并告诉你它找到了和没找到什么。此时不必担心这些信息。

    一直等待直到看到颜色选择（Color Selection）屏幕。如果你遇到困难，请参阅第 127 页的 B.2 节。


    # 3 逐步安装


    dbootstrap 是在你启动进入安装系统后运行的程序名称。它负责初始系统配置和“基础系统”的安装。


    dbootstrap 的主要工作是，你初始系统配置的主要目的是配置你系统的某些核心元素。例如，这包括你的 IP 地址、主机名以及网络设置的其他方面（如果有）。这还包括“内核模块”的配置，这些是加载到内核中的驱动程序。这些模块包括存储硬件驱动程序、网络驱动程序、特殊语言支持以及对其他外围设备的支持。首先配置这些基础内容是因为，为了让后续安装步骤正常运行，这通常是必要的。


    dbootstrap 是一个简单的基于字符的应用程序。它非常容易使用；通常它会以线性方式引导你完成安装过程的每一步。如果你犯了错误，也可以返回并重复步骤。在
    dbootstrap 中的导航可以通过方向键、回车和 Tab 键完成。


    ## 3.1 选择彩色或单色显示


    系统完成启动后，将调用 dbootstrap。dbootstrap 第一个询问的问题是你的显示器。你应该看到“选择彩色或单色显示”（Select Color
    or Monochrome display）对话框。如果你的显示器能够显示颜色，按回车键。显示将从黑白变为彩色。然后再次按回车键选择“下一步”（Next）项继续安装。


    如果你的显示器只能显示黑白，使用方向键将光标移动到“下一步”（Next）菜单项，然后按回车继续安装。


    ## 3.2 Debian GNU/Linux 安装主菜单


    你可能会看到对话框显示“安装程序正在确定系统的当前状态和应该执行的下一步安装步骤。”这是安装程序自动判断你可能可能需要执行什么操作的阶段。在某些情况下，你甚至看不到这个框。


    在整个安装过程中，你将看到标题为“Debian GNU/Linux 安装主菜单”（Debian GNU/Linux Installation Main Menu）的菜单。菜单顶部的选项将会变化，指示你的安装进度。


    ## 3.3 配置键盘


