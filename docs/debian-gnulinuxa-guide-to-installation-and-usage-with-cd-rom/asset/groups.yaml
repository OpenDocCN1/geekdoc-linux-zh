    and Domino when it arrives. As a Premium Business Partner, Lotus has offered a
    substantial price break to keep your company away from Microsoft''s Exchange Server.
    How are you supposed to get this new system installed, configured, and rolled
    out to all of your end users? You understand how Lotus Notes works—you''ve been
    administering it for years. What you need is a concise, practical explanation
    about the new features, and how to make some of the advanced stuff really work.
    You need answers and solutions from someone like you, who has worked with the
    product for years, and understands what it is you need to know. Domino System
    Administration is the answer—the first book on Domino that attacks the technology
    at the professional level, with practical, hands-on assistance to get Domino running
    in your organization.


    You''re in a bind because you''ve been asked to design and program a new data-base
    in Notes for an important client that will keep track and itemize a myriad of
    inventory and shipping data. The client wants a user-friendly interface, without
    sacrificing speed or functionality. You are experienced (and could develop this
    app in your sleep), but feel you need something to take your talents to the next
    level. You need something to facilitate your creative and technical abilities,
    something to perfect your programming skills. Your answer is waiting for you:
    Lotus Notes and Domino Essential Reference. It''s compact and simply designed.
    It''s loaded with information. All of the objects, classes, functions, and methods
    are listed. It shows you the object hierarchy and theing relationship between
    each one. It''s perfect for you. Problem solved.'
