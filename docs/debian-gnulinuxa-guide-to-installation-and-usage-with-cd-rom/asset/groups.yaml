    # 116 Chapter 13 Advanced Topics


    If you are running a network server, there are some other things to be aware of
    as well. First, you ought to uninstall or turn off any network services you''re
    not using. A good place to start is the file /etc/inetd.conf; you can probably
    disable some of these. For most network services, it''s also possible to control
    who has access to them; the /etc/hosts.allow and /etc/hosts.deny (documented in
    man 5 hosts_access) can control who has access to which services. You also ought
    to keep up-to-date with patches or updates to Debian; these can be found on your
    nearest commonsense Debian FTP mirror.


    Some other rules apply:


    - Never tell anyone your password.

    - Never send your password in cleartext across the Internet by using something
    like telnet or FTP. Instead, use encrypted protocols or avoiding logging in remotely.

    - Avoid using root as much as possible.

    - Don''t install untrusted software, and don''t install it as root.

    - Avoid making things world-writable whenever possible. /tmp is one exception
    to this rule.


    While this is probably not as much of use to somebody running a server, it is
    still pays to know a bit about security. Debian''s security mechanism protects
    your system from many viruses.


    ## 13.4 Software Development with Debian


    Debian makes a great platform for software development and programming. Among
    the languages and near-languages it supports are: C, C++, Objective-C, Perl, Python,
    m4, Ada, Pascal, Java, awk, Tcl/Tk, SQL, assembler, Bourne shell, csh, and more.
    Writing programs is beyond the scope of this book, but here are some of the most
    popular development programs in Debian:


    - gcc: The GNU C Compiler, a modern optimizing C compiler.

    - g++: The C++ compiler from the gcc line.

    - cpp: The C preprocessor for gcc.

    - perl: The Perl interpreter. Perl is a great “glue” language.

    - gdb: The GNU Debugger, used to debug programs in many different languages.

    - gprof: Used for profiling, this program helps you to find ways to improve the
    performance of your programs.

    - emacs: GNU Emacs is a programmers’ editor and IDE.

    - as: The GNU Assembler.


    ## II Reference


    ## Reading Documentation and Getting Help


    ### A.1 Kinds of Documentation


    On Debian systems, you can find documentation in at least the following places:


    - man pages, read with the `man` command.

    - info pages, read with the `info` command.

    - The `/usr/doc/package` directories, where `package` is the name of the Debian
    package.

    - `/usr/doc/HOWTO/` contains the Linux Documentation Project’s HOWTO documents,
    if you''ve installed the Debian packages containing them.

    - Many commands have an `-h` or `--help` option. Type the command name followed
    by one of these options to try it.


    > Tip:

    zless is useful for reading the files in /usr/doc; see section 8.1 on page 81
    for details.


    ## Appendix A Reading Documentation and Getting Help


    - The Debian Documentation Project¹ has written some manuals.

    - The Debian support page² has a FAQ and other resources. You can also try the
    Linux web site³.


    The confusing variety of documentation sources exists for many reasons. For example,
    info is supposed to replace man, but man hasn''t disappeared yet. However, it''s
    nice to know that so much documentation exists! Where to look for help? Here are
    some suggestions:


    - Use the man pages and the --help or -h option to get a quick summary of a command''s
    syntax and options. Also use man if a program doesn''t yet have an info page.

    - Use info if a program has info documentation.

    - If neither of those work, look in /usr/doc/pathname has Debian-specific information,
    if there''s a man page or info page.

    - Use the HOWTOs for instructions on how to set up a particular thing or information
    on your particular hardware. For example, the Ethernet HOWTO has a wealth of information
    on Ethernet cards, and the PPP HOWTO explains in detail how to set up PPP.

    - Use the Debian Documentation Project manuals for conceptual explanations and
    Debian-specific information.

    - If all else fails, ask someone. See section A.1.3 on page 122.


    Using man pages is discussed above in section 5.1 on page 49. It''s very simple:
    press the space bar to go to the next page, and press q to quit reading. Using
    info, viewing files in /usr/doc, and asking for help from a person are all discussed
    in the remainder of this chapter.


    ### A.1.1 Using info


    info is the GNU documentation viewer. Some programs provide documentation in info
    format, and you can use info to view that documentation. You can start up the
    viewer by simply typing info, or by supplying a topic as well:


    ```

    info emacs

    ```


    You can also bring up the information on info itself, which includes a tutorial,
    like so:


    - http://www.debian.org/~elphick/ddp/

    - http://www.debian.org/support/

    - http://www.linux.org/


    ### Kinds of Documentation 121


    Now, you may navigate with these keys:


    - arrows: Move the cursor around the document

    - m RET: Select the menu item that''s at the cursor

    - u: Move “up” in the document

    - n: Move to the next page

    - p: Move to the previous page

    - s: Search for something

    - g: Go to a specific page

    - q: Quit info


    You might notice that the top line of the screen indicates the next, previous,
    and “up” pages, corresponding nicely to the actions for the n, p, and u keys.


    ### A.1.2 HOWTOs


    In addition to their books, the Linux Documentation Project has made a series
    of short documents describing how to set up particular aspects of GNU/Linux. For
    instance, the SCSI-HOWTO describes some of the complications of using a standard
    way of talking to devices with GNU/Linux. In general, the HOWTO have more specific
    information about particular hardware configurations and will be more up to date
    than this manual.


    There are Debian packages for the HOWTOs. doc-linux-text contains the various
    HOWTOs in text form; the doc-linux-html package contains the HOWTOs (surprise!)
    browsable HTML format. Note also that Debian has packaged translations of the
    HOWTOs in various languages that you may prefer if English is not your native
    language. Debian has packages for the German, French, Italian, Japanese, Korean,
    Polish, Swedish and Chinese versions of the HOWTOs. These are usually available
    in /usr/doc/HOWTO. However, you may be able to find more recent versions on the
    Net at the LDP homepage⁴.


    > 4. http://metalab.unc.edu/LDP/


    ### A.1.3 Personal Help


    The correct place to ask for help with Debian is the debian-user mailing list
    at debian-user@lists.debian.org. If you know how to use IRC (Internet Relay Chat),
    you can use the #debian channel on irc.debian.org. It is also possible to hire
    paid consultants to provide guaranteed services. The Debian website⁵ has more
    information on many of these resources.


    Again, please do not ask the authors of this book for help. You probably don''t
    know the answer to your specific problem anyway; if you mail debian-user, you
    will get higher-quality responses, and more quickly.


    Always be polite and an effort to help yourself by reading the documentation.
    Remember, Debian is a volunteer effort and people are doing you a favor by giving
    their time to help you.


    ## Tips for asking questions


    - Read the obvious documentation first. Things like command options and what a
    command does will be covered there. This includes manpages and info documentation.

    - Check the HOWTO documents if your question is about setting up something such
    as PPP or Ethernet.

    - Try to be sure the answer isn''t in this book.

    - Don''t be afraid to ask, after you''ve made a basic effort to look it up.

    - Don''t be afraid to ask for conceptual explanations, advice, and other things
    not often found in the documentation.

    - Include any information that seems relevant. You''ll almost always want to mention
    the version of Debian you''re using. You may also want to mention the version
    of any pertinent packages: The command dpkg -l packagename will tell you this.
    It''s also useful to say what you''ve tried so far and what happened. Please include
    the exact error messages, if any.

    - Don''t apologize for being new to Linux. There''s no reason everyone should
    be a GNU/Linux expert to use it, any more than everyone should be a mechanic to
    use a car.


    5. http://www.debian.org/

