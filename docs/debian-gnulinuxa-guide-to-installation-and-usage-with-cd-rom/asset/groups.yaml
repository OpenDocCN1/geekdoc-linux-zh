    /sbin This directory contains "system binaries," utilities that the root user

    or system administrator might want to use, but that you probably

    won''t want to use in your day-to-day activities.


    /usr This contains most of the files you''ll be interested in. It has many

    subdirectories. /usr/bin and /usr/sbin are pretty like /bin

    and /sbin


    While not essential to getting the computer working, /usr does

    contain the applications you use to get real work done. Also in

    /usr, you''ll find the /usr/man, /usr/info, and /usr/doc directories. These contain
    manual pages, info pages, and other documentation, respectively. And don''t forget
    /usr/games!


    /usr/local The Debian system doesn''t install anything in this directory.

    You should use it if you want to install software that you compile

    yourself or any software not contained in a Debian package. You can

    also install software in your home directory if you''ll be the only

    using it.


    /etc This contains all the system-wide configuration files. Whenever you

    want to change something that affects all users of your computer -

    how you connect to the Internet or what kind of video card

    have - you''ll probably have to log on as root and change a file

    in /etc.


    /tmp Here you''ll find temporary files, most of them created by the system. This
    directory is generally erased on a regular basis or every time

    you reboot the system. You can create files here if you want, just be aware that
    they might get deleted automatically.


    /var This contains "variable" files that the system changes automatically.

    For example, incoming mail is stored here. The system keeps a log

    of its actions here. There are a number of other automatically generated files
    as well. You''ll mostly be interested in the contents

    of /var/log, where you can find error messages that can help you figure out what
    your system''s up to if something goes wrong.


    Clearly there are many more directories on the system - far too many to describe
    every one.


    For changing things, you''ll usually want to confine yourself to your home directory
    and /etc. On a Debian system, there''s rarely an occasion to change anything else,
    because everything is automatically installed for you.


    /etc is used to configure the system as a whole. You''ll use your own home directory,
    a subdirectory of /home, for configuring your own preferences and storing your
    personal data. The idea is that on day-to-day basis, you confine yourself to /home/username,
    there''s no way you can break anything. Occasionally you log in as root to change
    something in a system-wide directory, but only when it''s absolutely necessary.
    Of course, if you''re using Debian at a school or business or someone else is
    the system administrator, you won''t have root access and will be able to change
    only your home directory and any other directory that you own. This limits what
    you can do with the system.


    # 7.3 File Compression with gzip


    Often it would be nice to make a file smaller say, to download it faster, or so
    it takes up less space on your disk. The program to do this is called gzip (GNU
    zip). Here''s how it works:


    ```

    $ cd; cp /etc/profile ./mysamplefile

    ```


    This switches to your home directory and copies an arbitrarily chosen file (/etc/profile)
    to your current directory, in the process renaming mysamplefile. This gives you
    a file to play with when using gzip.


    ```

    $ ls -1

    ```


    Lists the contents of the current directory. Note the size of mysamplefile.


    ```

    $ gzip mysamplefile

    ```


    Compresses mysamplefile.


    ```

    $ ls -1

    ```


    Observe the results of this command: mysamplefile is now called mysamplefile.gz.
    It''s also a bit smaller.


    ```

    $ gunzip mysamplefile.gz; ls -1

    ```


    This uncompresses the file. Observe that mysamplefile has returned to its original
    state. Notice that to uncompress, one uses gunzip, not gzip.


    ```

    $ rm mysamplefile

    ```


    Use this command to remove the file, since it was just to practice with.


    # 7.4 Finding Files


    There are two different facilities for finding files: find and locate. find searches
    the actual files in their present state. locate searches an index generated by
    the system every morning at 6:42 a.m. (this is a cron job, explained elsewhere
    in this book). locate won''t find any files that were created after the index.
    However, locate searches an index, it''s much faster - like using the index of
    a book rather than looking through the whole thing.


    To compare the two configuration file for finding, pretend you can''t remember
    where the X configuration file X86Config resides.


    ```

    $ locate X86Config

    ```


    This should be pretty fast. You''ll get a list of filenames that contain X86Config,
    something like this:


    - /etc/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config.eg

    - /usr/X11R6/man/man5/X86Config.5x.gz


    Now try to find the command:


    ```

    $ find / -name X86Config

    ```


    You will hear a lot of disk activity, and this will take a lot longer. Results
    will look something like this:


    - /etc/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config

    - find: /var/sp/cron/atjobs: Permission denied

    - find: /var/sp/cron/atjobs: Permission denied

    - find: /var/lib/xdm/authdir: Permission denied


    Notice that find only found files that were named exactly X86Config, rather than
    any files containing that string of letters. Also, find actually tried to look
    in every directory on the system - including some where you didn''t have read
    permissions. That''s why you got the Permission denied messages.


    The syntax is different as well. With find, you had to specify what directory
    to search in, whereas locate searches the index. To search for files whose name
    match X86Config, you''d use a wildcard:


    ```

    $ find / -name *X86Config

    ```


    The syntax is different as well. With find, you had to specify what directory
    to search in, whereas locate searches the index. locate is faster.


    # 7.5 Determining a File''s Contents


    Debian uses a utility that can guess the contents of a file. Although it is not
    100% accurate, you can use the following command to explore your system:


    ```

    $ file /bin/cp

    ```


    You should see something like this:


    ```

    /bin/cp: ELF 32-bit LSB executable, Intel 386, version 1

    ```


    Skipping the technical parts, this is an executable file for Intel machines.


    ```

    $ file /etc/init.d/boot

    ```


    The preceding command gives this:


    ```

    /etc/init.d/boot: Bourne script text

    ```


    meaning that this is a text file.


    # 7.6 Using a File Manager


    Instead of moving files around by hand, you can use a file manager. If you move
    a lot of files around, a file manager can make your work more efficient. There
    are text-based file managers, such as GNU Midnight Commander (mc), and a number
    of file managers for the X Window system (for example gmc for the X Window version
    of GNU Midnight Commander).


    Describing each of these is outside the scope of this book, but you may want to
    try them out if the command line doesn''t meet your needs.


    # 8 Working with Text Files


    Text files are prevalent on a GNU/Linux system. They hold everything from documentation
    to configuration files. Fortunately, it''s easy to work with them.


