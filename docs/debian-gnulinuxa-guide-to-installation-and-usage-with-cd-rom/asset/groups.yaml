    system is now ready to use. Let''s examine what it means to log in and how this
    process works.


    To use Debian, you must identify yourself to the system. This is so it knows who
    you are, what you have permission to do, and what your preferences are.


    To this end, you have a *username* or *login*. If you installed Debian yourself,
    you should have been asked to give such a name during installation. If you are
    logging on to a system administered by someone'
