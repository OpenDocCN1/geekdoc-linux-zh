    # 使用 Shell


    在你阅读这本书的过程中，你已经在与 Shell 交互了。Shell 是一个读取你的命令并执行你要求它执行的操作的程序。在本章中，你将更详细地探索 Shell，并特别关注如何自定义
    Shell 以按照你想要的方式工作。


    ## 6.1 环境变量


    每个进程都关联着一个环境。环境是环境变量的集合。变量是一个具有固定名称的可变值。例如，名为 EMAIL 的变量可以指向值 `joe@nowhere.com`。该值可以变化；EMAIL
    也可以指向 `jane@somewhere.com`。


    由于你的 shell 像其他程序一样是一个进程，它也有一个环境。你可以通过输入 `printenv` 命令查看 shell 的环境。第 64 页的图 6.1
    显示了 `printenv` 的示例输出。在你的系统上，输出会有所不同，但相似。


    # 第 6 章 使用 Shell


    图 6.1 printenv 示例输出


    ```

    PAGER=less

    HOSTNAME=icon

    MAILCHECK=60

    PS1=$

    USER=username

    MACHYPE=i486-pc-linux-gnu

    EDITOR=emacs

    DISPLAY=:0.0

    LOGNAME=username

    SHELL=/bin/bash

    HOSTTYPE=i486

    OSTYPE=linux-gnu

    HISTSIZE=150

    HOME=/home/username

    TERM=xterm-debian

    TEXTEDIT=jed

    PATH=/usr/sbin:/usr/local/bin:

    /usr/bin:/bin:/usr/bin/X11:/usr/games

    =/usr/bin/printenv

    ```


    环境变量是配置系统的一种方式。例如，`EDITOR` 变量允许你选择偏好的编辑器，用于发布新闻、编写电子邮件、设置提示符和文本文件查看器等。


    设置环境变量非常简单。为了练习，尝试使用环境变量自定义你的 shell 提示符和文本文件查看器。首先，让我们获取一些背景信息。


    ```

    man less

    ```


    此命令允许你查看 `less` 命令的在线手册。为了一次在屏幕上显示文本，`man` 会调用分页器，每次当你按下空格键时它都会显示新页文本。默认情况下，它使用名为
    `more` 的分页器。


    继续浏览一下 `less` 的页面，它是一个增强型的分页器。按空格键滚动到新页；按 q 退出。`more` 在到达手册页末尾时也会自动退出。


    ```

    export PAGER=less

    ```


    在读完 `less` 的优点后，你可能想用它来阅读 man 页。要做到这一点，设置环境变量 `PAGER`。


    在 bash 中设置环境变量的命令始终具有这种格式：


    图 6.2 更改提示符


    ```

    $ echo $PS1

    $

    $ PS1=hello

    hello:echo My prompt is $PS1

    My prompt is hello:

    hello:

    ```


    export NAME=value

    `export` 意味着将变量从 shell 移动到环境中。这意味着 shell 以外的程序（例如文件查看器）能够访问它。


    echo $PAGER

    这是查看变量值最简单的方法。`$PAGER` 告诉 shell 在调用命令*之前*插入 `PAGER` 变量的值。`echo` 回显它的参数：在这种情况下，它回显了当前的
    `PAGER` 值，即 `less`。


    man more

    显示 `more` 的手册。这次，`man` 应该调用了 `less` 分页器。

    `less` 有许多 `more` 缺乏的功能。例如，你可以用 `b` 键向后滚动。你可以用方向键向上、向下（甚至是左右）移动。`less` 在到达手册页末尾时不会退出；它会等待你按
    q。


    你可以尝试 `less` 特有的命令（如 `b`），以验证它们在 `more` 中不起作用，且你正在使用 `more`。


    unset PAGER

    如果你不再想指定分页器，可以取消该变量。此时 `man` 将默认使用 `more`，就像在你设置该变量之前的那样。


    echo $PAGER

    由于 `PAGER` 已取消，`echo` 不会打印任何内容。


    PS1=hello:

    为了好玩，更改你的 shell 提示符。`$` 现在会发生变化；详情请见图 6.2。


    `export` 不是必须的，因为你正在更改 shell 自身的行为。没有理由将变量导出到环境中供其他程序使用。从技术上说，`PS1` 是一个 shell
    变量而不是环境变量。

    如果你愿意，可以导出该 shell 变量，将其转换为环境变量。如果你这样做，你从 shell 运行的程序就可以看到它。


    ## 6.2 命令所在的位置：PATH 变量


    当你向 shell 输入一个命令时，它必须在执行之前在你的硬盘上找到该程序。如果 shell 必须查找整个磁盘，速度会非常慢；相反，它会在 `PATH` 环境变量中包含的目录列表中查找。这个目录列表构成了
    shell 的搜索路径；当你输入一个命令时，它会逐个通过这些目录寻找你请求运行的程序。

    如果你在非标准位置自行安装了程序，你可能需要更改 `PATH` 变量。`PATH` 的值是一个用冒号分隔的目录列表。Debian 系统上的默认值如下：


    ```

    /usr/local/bin:/usr/bin:/bin:/usr/bin/X11:/usr/games

    ```


    该值定义在 `/etc/profile` 中并适用于所有用户。你可以随所意地更改 `/etc`。要查看 `type` 位于何处，运行命令：


    ```

    $ type

    type is a builtin

    ```


    `type` 不是真正的程序。然而，你可以像使用外部程序一样使用它。有很多像 `type` 这样的命令可以显示一个命令是否为真实程序。


    ## 6.3 配置文件


    Linux 系统上的许多应用程序允许通过修改配置文件来更改其行为。这些配置文件可能包含应用程序启动信息、运行时设置和退出设置。通常，配置文件名基于其所属的应用程序名称。这种命名约定让你更容易确定哪个文件包含特定应用程序的设置。


    ### 6.3.1 系统级与用户特定配置


    记住 Debian 系统上有两种不同的配置。*系统级配置*影响所有用户。系统级设置在 `/etc` 目录中进行，因此你通常需要 root 权限才能更改系统级设置。例如，你可能会配置系统连接互联网的方式，或者网页浏览器启动时打开的公司主页。由于你希望这些设置适用于所有用户，因此你在
    `/etc` 中进行更改。`/etc` 中的示例配置文件包括 `/etc/X11/X86Config`、`/etc/lynx.cfg` 和 `/etc/ppp/options`。事实上，`/etc`
    中的几乎所有文件都是配置文件。


    *用户配置*影响单个用户。点文件（dotfiles）用于用户配置。例如，`.newsrc` 文件存储你阅读的 USenet（讨论组）文章以及你订阅的小组。这使得新闻阅读器（如
    `tr` 或 `gnus`）能够显示你感兴趣组的文章。这些信息对于系统上的每个用户都是不同的，因此每个用户在自己的家目录下都有自己的 `.newsrc` 文件。


    ## 6.4 别名


    如果你经常使用同一个命令，可能会厌倦输入它。bash 允许你为命令编写更短的*别名*（aliases）。


    假设你总是对 `ls` 使用 `--almost-all` 和 `--color=auto` 选项。你很快厌了输入它们：`ls --almost-all --color=auto`。所以你定义了一个别名：


    ```

    alias myls=''ls --almost-all --color=auto''

    ```


    现在你可以输入 `mys` 代替完整命令。要查看 `mys` 到底是什么，运行命令 `type mys`。要查看你定义的别名列表，只需单独在一一行输入 `alias`
    即可。


