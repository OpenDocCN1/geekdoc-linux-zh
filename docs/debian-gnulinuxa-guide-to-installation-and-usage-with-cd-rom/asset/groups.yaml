    +   - ppp

    - ppp-pam

    - wvdial


    When you install the wvdial package, you may be given the opportunity to configure
    it. Otherwise, to set up wvdial, follow these simple steps:

    Log in as root, using su (as described in an earlier chapter).


    ```

    touch /etc/wvdial.conf

    ```


    touch will create the following file if the file doesn''t exist; the configuration
    program requires an existing file.

    wvdialconf /etc/wvdial.conf


    This means you''re creating a configuration file, /etc/wvdial.conf.

    Answer any questions that appear on the screen. wvdialconf will also scan for
    your modem and tell you which serial port it''s on; you may want to make a note
    of this for future reference.


    # 11.2 Ethernet


    Another popular way to connect to the Internet is via a LAN that uses Ethernet.
    This gives you a high-speed local network in addition to Internet access. Fortunately,
    though, you should have already configured Ethernet networking during installation
    so there isn''t much you need to do now. If you ever need to modify your configuration,
    here are the files that you will be interested in:


    +   - /etc/init.d/network has things such as your IP address, netmask, and default
    route.

    - /etc/hostname records your hostname.

    - /etc/hosts also records your hostname and IP address.'
