    即使你没有网络也必须配置网络，但你只需要回答前两个问题：“选择主机名”和“你的系统是否连接到网络？”


    这里有一些你可能会觉得方便的调试细节：程序假设 IP 地址是系统 IP 地址和掩码的按位与结果。它通过系统 IP 地址与掩码反数的按位或结果来猜测广播地址。它将假设你的网关也是你的
    DNS 服务器。如果你找不到这些答案，系统会猜测。如果有必要，可以在系统安装后通过 /etc/init.d/network 修改。


