    Incidently, this illustrates the difference between source code and binary executables.
    /bin/ls is a binary executable you can download from Debian, you can also download
    a text file that tells the computer how to create /bin/ls. This text file is the
    source code. Comparing /bin/ls to /etc/profile illustrates how important source
    code is if someone wants to understand and modify a piece of software. Free software
    provides you or your consultants with this all-important source code.


    # 8.2 Text Editors


    A text editor is a program used to create and change the contents of files. Most
    operating systems have a text editor: DOS has edit, Windows has Notepad, MacOS
    has SimpleText.


    Debian provides a large variety of text editors. vi and Emacs are the classic
    two, which are probably both the most powerful and the most widely used. Both
    vi and Emacs are quite complex and require some practice, but they can make editing
    text extremely efficient. Emacs runs in a terminal and under the X Window system;
    we normally run in a terminal but the vim variant has a -g option that allows
    it to work with X editors


    Simpler editors include nedit, ae, jed, and xcoral. nedit and xcoral provide easy-to-use
    X Window system graphical interfaces. Additionally, there are several variants
    vi, and you can find a GNU Emacs variant called Emacs.


    This book does not cover the use of any particular editor in detail, though we
    will briefly introduce ae as it is small, fast, and can be found even on the Debian
    rescue, so it pays to know a bit about it for usage in a pinch. When you need
    to do more serious editing, check out vim or GNU Emacs. Emacs provides an excellent
    interactive tutorial of its own; to read it, load Emacs with the emacs command
    and type F1. Emacs is an excellent choice for new users interested in a general-purpose
