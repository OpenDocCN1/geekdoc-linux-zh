  - '[PAGE 47]


    # 3.11 Configure the Network


    You''ll have to configure the network even if you don''t have a network, but you''ll
    only have to answer the first two questions – “Choose the Host name,” and “Is
    your system connected to a network?”


    Here are some technical details you may find handy: The program assumes the IP
    address is the bitwise AND of your system''s IP address and your mask. It will
    guess the broadcast address by the bitwise OR of your system''s IP address with
    the bitwise negation of the netmask. It will guess that your gateway is also your
    DNS server. If you can''t find any of these answers, the system guesses. You can
    change them once the system has been installed, if necessary, by editing /etc/init.d/network.
    (On a Debian system, daemons are started by scripts in the directory /etc/init.d/).


    # 3.12 Install the Base System


    During the “Install the Base System” step, you''ll be offered a menu of devices
    from which you may install the base system. Here, you need to select your CD-ROM
    device.


    You will be prompted to specify the path to the base2_1.tgz file. If you have
    official Debian media, the default value should be correct. Otherwise, enter the
    path where the base system can be found, relative to the media''s mount point.
    As with the “Install Operating System Kernel and Modules” step, you can either
    let dbootstrap find the file itself or type the path at the prompt.


    # 3.12.1 Configure the Base System


    At this point you''ve read in all of the files that make up a minimal Debian system,
    but you must perform some configuration before the system will run.


    You''ll be asked to select your time zone. There are many ways to specify your
    time zone; we suggest you go to the “Directories:” pane'
- md: '

    select your country (continent). That will change the available time zones, so
    go ahead and select your geographic locality (i.e., country, province, state,
    or city) in the “Timezones:” pane.


    Next, you will be asked if your system clock is set to GMT or local time. Select
    GMT (i.e., “Yes”) if you will only be running Linux on your computer; select local
    time (i.e., “No”) if you will be running another operating system as well as Debian.
    Unix (and Linux is no exception) generally keeps GMT time on the system clock
    and converts visible time to the local time zone. This allows the system to keep
    track of daylight savings time and leap years, and even allows a user who is logged
    in from another time zone to individually set the time zone used on his or her
    terminal.


    ## 3.12.2 Make Linux Bootable Directly from the Hard Disk


    If you elect to make the hard disk boot directly to Linux, you will be asked to
    install a master boot record. If you''re not using a boot manager (and this is
    probably the case if you know what a boot manager is) and you don''t have another
    operating system on the same machine, answer “Yes,” the next question is “you
    won''t be able to boot into DOS normally on your machine, for instance. Be careful.
    If you answer “Yes,” the next question will be whether you want to boot Linux
    automatically from the hard disk when you turn on your system. This sets Linux
    to be the bootable partition – the one that will be loaded from the hard disk.


    Note that multiple operating system booting on a single machine is still something
    of a black art. This book does not document the various boot managers, which vary
    by architecture and even by sub-architecture. You should see your boot manager’s
    documentation for more information. Remember: When working with the boot manager,
    you can never be too careful.


    The standard i386 boot loader is “LILO.” It is a complex program that offers lots
    of functionality, including DOS, NT, and OS/2 boot management. To find out more
    about this functionality, you can read the documentation in /usr/doc/lilo after
    your system is set up.


    ## 3.13 Make a Boot Floppy


    You should make a boot floppy even if you intend to boot the system from the hard
    disk. The reason is that it''s possible for the hard disk bootstrap to be mis-installed,
    but a boot floppy will almost always work. Select “Make a Boot Floppy” from the
    menu and feed the system blank floppy as directed. Make sure the floppy isn''t
    write-protected, because the software will format and write it. Mark this the
    "Custom Boot" floppy and write-protect it once it has been written.


    ## 3.14 The Moment of Truth


    Your system''s first boot on its own power is what electrical engineers call the
    "smoke test." If you have any floppies in your floppy drive, remove them. Select
    the "Reboot the System" menu item.


    If you are booting directly into Debian and the system doesn''t start up, either
    use your original installation boot media (for instance, the Rescue Floppy) or
    insert the Custom Boot floppy if you created one, you will reset your system.
    If you are not using the Custom Boot floppy, you will probably need to add some
    boot arguments. With booting with the Rescue Floppy or similar technique, where
    rootfs is your root partition, you need to specify root=/dev/sda1, and you should
    see the same messages as you first booted the installation system, followed by
    some new messages.


    ## 3.15 Set the Root Password


    The root account is also called the superuser; it is a login that bypasses all
    security protection on your system. The root account should be used only to perform
    system administration and for as short a time as possible.


    Any password you create should contain from six to eight characters, as well as
    punctuation characters. Take extra care when setting your root password, since
    it is such a powerful account. Avoid dictionary words or use of any personal information
    that could be guessed.


    If anyone ever tells you he needs your root password, be extremely wary. You should
    normally never give out your root account, unless you are administering a machine
    with more than one system administrator.


    ## 3.16 Create an Ordinary User


    The system will ask you to create an ordinary user account. This account should
    be your main personal login. You should not use the root account for daily use
    or as your personal login.


    Why not? It''s a lot harder to damage the system as an ordinary user than as root;
    system files are protected. Another reason is that you might be tricked into running
    a Trojan horse program – that is, a program that takes advantage of your superuser
    powers to compromise the security of your system behind your back. Any good book
    on Unix system administration will cover this topic in more detail. Consider reading
    one if this topic is new to you.


    Name the user account anything you like. Your name is John Smith, you might use
    "smith," "john," "jsmith," or "js."


    ## 3.17 Shadow Password Support


    Next, the system will ask whether you want to enable shadow passwords. This is
    an authentication system that makes your Linux system a bit secure.


    ## 3.18 Remove Boot Floppy


    If you are not using the Custom Boot floppy, you will probably need to add some
    boot arguments. With booting with the Rescue Floppy or similar technique, where
    rootfs is your root partition, you need to specify root=/dev/sda1, and you should
    see the same messages as you first booted the installation system, followed by
    some new messages.


    ## 3.19 Select and Install Packages


    The system will ask you whether you want to enable shadow passwords. This is an
    authentication system that makes your Linux system a bit secure.


    ## 3.20 Package Installation with dselect


    It is now time to install the software packages of your choice on your Debian
    system. This is done using Debian''s package management tool, dselect.


    ### 3.20.1 Introduction


    This section documents dselect for first-time users. It makes no attempt to explain
    everything, so when you first meet dselect, work through the help screens.

