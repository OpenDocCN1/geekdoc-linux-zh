    ## 2.3.2 系统使用规划


    磁盘空间需求和你的分区方案取决于你决定创建的安装类型。


    为了方便起见，Debian 提供了若干默认“配置（profiles）”，其中一些在本节的稍后部分列出。配置是预选的软件包集合，旨在为你的系统提供某些所需的功能。安装变得更加简单，因为符合你所需配置的软件包会自动标记为安装。每个给定的配置都列出了安装完成后生成的系统大小。即使你不使用这些配置，这些讨论对于规划也是重要的，因为它能让你对分区或多个分区需要多大有一个直观的感受。以下是一些可用的配置及其大小：


    - Server_std. 这是一个小型服务器配置，适用于精简的服务器，该服务器没有为 shell 用户提供很多便利功能。它基本上包含一个 FTP 服务器、一个
    Web 服务器、DNS、NIS 和 POP。它将占用大约 50MB 空间。当然，这只是软件的大小；你提供的任何数据将是额外增加的。


    - Dialup. 这个配置非常适合标准桌面机，包括 X Window 系统、图形应用程序、声音、编辑器等。软件包的大小约为 500MB。


    - Work_std. 此配置适用于没有 X Window 系统或 X 应用程序的精简用户机器。它也适用于笔记本电脑或移动计算机。大小约为 140MB。可能存在包含
    X 的简单笔记本设置，其空间小于 100MB。


    - Devel_comp. 这是一个桌面设置配置，带有所有流行的开发包，如 Perl、C 和 C++。它需要大约 475MB。假设你还要添加 X 和一些用于其他用途的额外软件包，你应该为此类安装规划大约
    800MB 的磁盘空间。


    记住，这些大小并不包含通常常见的其他材料，如用户文件、邮件和数据。在考虑为你自己的文件和数据留空间时，慷慨总是最好的。值得注意的是，Debian 的 `/var`
    目录包含大量的状态信息。安装的软件包管理文件可以很容易消耗 20MB 的磁盘空间。通常情况下，你应该为 `/var` 目录至少分配 50MB，因为系统日志文件也存储在那里。


    ## 2.3.3 PC 磁盘限制


    PC BIOS 通常为磁盘分区增加额外的限制。硬盘可以包含的“主分区”和“逻辑分区”数量是有限制的。此外，BIOS 在硬盘的哪个位置查找引导信息也有限制。更多信息可以在
    Linux Partition mini-HOWTO 中找到。本节将包含一个简要概述，以帮助你规划你的场景。


    “主”分区是 PC 硬盘的原始分区方案。然而，最多只有四个。为了突破这一限制，发明了“扩展（extended）”或“逻辑（logical）”分区。通过将一个主分区设置为扩展分区，你可以细分分配给逻辑分区的空间。你可以创建的逻辑分区数量限制比你可以创建的主分区数量少得多；然而，每个硬盘只能有一个扩展分区。


    Linux 对分区数量的限制是：SCSI 硬盘为 15 个（逻辑分区），IDE 硬盘为 63 个（逻辑分区）。


    关于 PC BIOS 需要知道的最后一点是，扩展分区——即持有逻辑分区的分区——本身是不可用的。这适用于 SCSI 硬盘和 IDE 硬盘。


    ## 2.3.4 Linux 中的设备名称


    Linux 使用驱动器名称加上 1 到 4 表示主分区。例如，第一个 IDE 硬盘的主分区是 `/dev/hda1`。逻辑分区从 5 开始编号，因此该硬盘上的逻辑分区是
    `/dev/hda5`。


    假设你的系统有两个 SCSI 磁盘，一个在 SCSI 地址 2，另一个在 SCSI 地址 4。第一个磁盘（地址 2）被命名为 `sda`，第二个是 `sdb`。如果
    sdb 硬盘上有三个分区，它们将被命名为 `sda1`、`sda2` 和 `sda3`。同样适用于 sdb 磁盘及其分区。注意，如果你有两个 SCSI 主机适配器（即控制器），硬盘的顺序可能会变得混乱。在这种情况下，最好的解决方案是观察启动信息，假设你硬盘型号。


    ### 表 2.1 Linux 名称


    | 设备 | Linux 名称 |

    |---|---|

    | 第一个软盘 | /dev/fd0 |

    | 第二个软盘 | /dev/fd1 |

    | hda 的第一个分区（通常是操作系统） | /dev/hda1 |

    | hdc 的第五个分区 | /dev/hdc5 |

    | sdb 的第二个分区 | /dev/sdb2 |

    | 整个主设备 IDE 硬盘或光驱 | /dev/hda |

    | 整个从设备 IDE 硬盘或光驱 | /dev/hdb |

    | 整个主设备 IDE 硬盘或光驱 | /dev/hdc |

    | 整个从设备 IDE 硬盘或光驱 | /dev/hdd |

    | 第一个 SCSI 硬盘 | /dev/sda |

    | 第二个及后续 SCSI 硬盘 | /dev/sdb 等 |

    | 第一个串口端口（其他操作系统中的 COM1） | /dev/ttyS0 |

    | 第二个、第三个等串口端口 SCSI 单元（自动回带） | /dev/ttyS1, /dev/ttyS2, 等 |

    | SCSI 磁带单元（不自动回带） | /dev/st0, /dev/st1, 等 / /dev/nst0, /dev/nst1, 等 |

    | SCSI 刻驱 | /dev/scd0, /dev/scd1, 等 |


