    is for now. We''ve copied it to . (recall that just means "the directory I''m
    in now," or the current working directory). So this creates a copy of /etc/profile
    and puts it in your practice directory. Try typing ls to verify that there''s
    indeed a file called profile in your working directory, alongside the new mysubdirectory.


    ```bash

    more profile

    ```


    This lets you view the contents of the file profile. more is used to view the
    contents of text files. It''s called more because it shows one screenful of the
    file at a time, and you press the space bar to see more. more will exit when you
    get to the end of the file, or when you press q (quit).


    ```bash

    more /etc/profile

    ```


    Verifies that the original looks just like the copy made.


    ```bash

    mv profile mysubdirectory

    ```


    mv stands for "move." You''ve moved the file profile from the current directory
    into the subdirectory you created earlier.


    ```bash

    ls

    ```


    Verifies that profile is no longer in the current directory.


    ```bash

    ls mysubdirectory

    ```


    Verifies that profile has moved to mysubdirectory.


    ```bash

    cd mysubdirectory

    ```


    Changes to the subdirectory.


    ```bash

    mv myprofile

    ```


    Note that unlike some operating systems, there is no difference between moving
    a file and renaming it. Note that the second argument to mv can be a directory
    to move the file or directory into, or it can be a new filename. cp works the
    same way. As usual, you can type ls to see the result of mv.


    ```bash

    mv myprofile ..

    ```


    Just as .. means "the directory I''m in now," .. means "parent of the current
    directory," in this case the practice directory you created earlier. Use ls to
    verify that that''s where myprofile is now.


