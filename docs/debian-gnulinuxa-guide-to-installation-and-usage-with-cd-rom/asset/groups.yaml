    # Using the Shell


    As you have been reading this book, you''ve been interacting with the shell already.
    The shell is the program that reads your commands and then does what you ask it.
    In this chapter, you explore the shell in greater detail, with a special eye towards
    customizing the shell to work as you want it to.


    ## 6.1 Environment Variables


    Every process has an environment associated with it. An environment is a collection
    of environment variables. A variable is a changeable value with a fixed name.
    For example, the name EMAIL could refer to the value joe@nowhere.com. The value
    can vary; EMAIL could also refer to jane@somewhere.com.


    Because your shell is a process like any other, it has an environment. You can
    view your shell''s environment by entering the printenv command. Figure 6.1 on
    page 64 has some sample output from printenv. On your system, the output will
    be different but similar.


    # Chapter 6 Using the Shell


    Figure 6.1 Sample printenv output


    ```

    PAGER=less

    HOSTNAME=icon

    MAILCHECK=60

    PS1=$

    USER=username

    MACHYPE=i486-pc-linux-gnu

    EDITOR=emacs

    DISPLAY=:0.0

    LOGNAME=username

    SHELL=/bin/bash

    HOSTTYPE=i486

    OSTYPE=linux-gnu

    HISTSIZE=150

    HOME=/home/username

    TERM=xterm-debian

    TEXTEDIT=jed

    PATH=/usr/sbin:/usr/local/bin:

    /usr/bin:/bin:/usr/bin/X11:/usr/games

    =/usr/bin/printenv

    ```


    Environment variables are one way to configure the system. For example, the EDITOR
    variable lets you select your preferred editor for posting news, writing e-mail,
    setting your prompt and your text file viewer, and so on.


    Setting environment variables is simple. For practice, try customizing your shell''s
    prompt and your text file viewer with environment variables. First, let''s get
    a bit of background information.


    ```

    man less

    ```


    This command lets you view the online manual for the less command. In order to
    show you the text onscreen at a time, man invokes a pager that shows you a new
    page of text each time you press the space bar. By default, it uses the pager
    called more.


    Go ahead and glance over the page for less, which is an enhanced pager. Scroll
    to a new page by pressing space; press q to quit. more will also quit automatically
    when you reach the end of the man page.


    ```

    export PAGER=less

    ```


    After reading about the advantages of less, you might want to use it to read man
    pages. To do this, set the environment variable PAGER.


    The command to set an environment variable within bash always has this format:


    Figure 6.2 Changing the prompt


    ```

    $ echo $PS1

    $

    $ PS1=hello

    hello:echo My prompt is $PS1

    My prompt is hello:

    hello:

    ```


    export NAME=value

    export means to move the variable from the shell into the environment. This means
    that programs other than the shell (for instance, a file viewer) will be able
    to access it.


    echo $PAGER

    This is the easiest way to see the value of a variable. $PAGER tells the shell
    to insert the value of the PAGER variable *before* invoking the command. echo
    echoes back its argument: in this case, it echoes the current PAGER value, less.


    man more

    Displays the more manual. This time, man should have invoked the less pager.

    less has lots of features that more lacks. For example, you can scroll backward
    with the b key. You can move up and down (even sideways) with the arrow keys.
    less won''t exit when it reaches the end of the man page; it will wait for you
    to press q.


    You can try out less-specific commands, like b, to verify that they don''t work
    with more and that you are using more.


    unset PAGER

    If you don''t want to specify a pager anymore, you can unset the variable. man
    will then use more by default, just as it did before you set the variable.


    echo $PAGER

    Because PAGER has been unset, echo won''t print anything.


    PS1=hello:

    Just for fun, change your shell prompt. $ should now change; see Figure 6.2 for
    details.


    export is not necessary, because you''re changing the shell''s own behavior. There''s
    no reason to export the variable into the environment for other programs to use.
    Technically, PS1 is a shell variable rather than an environment variable.

    If you wanted to, you could export the shell variable, transforming it into an
    environment variable. If you do this, programs you run from the shell can see
    it.


    ## 6.2 Where Commands Reside: The PATH Variable


    When you type a command into the shell, it has to find the program on your hard
    disk before executing. If the shell had to look up all the disk, it would be very
    slow; instead, it looks in a list of directories contained in the PATH environment
    variable. This list of directories makes up shell''s search path; when you enter
    a command, it goes through each one in turn looking for the program you asked
    to run.

    You may need to change the PATH variable if you install programs yourself in a
    non-standard location. The value of PATH is a colon-separated list of directories.
    The default value on Debian systems is as follows:


    ```

    /usr/local/bin:/usr/bin:/bin:/usr/bin/X11:/usr/games

    ```


    This value is defined in /etc/profile and applies to all users. You can easily
    change the /etc as you want. To see where type resides, run the command:


    ```

    $ type type

    type is a builtin

    ```


    type is not actually a program. However, you use it like an external program.
    There are a number of commands like this to show whether a command is a real program.


    ## 6.3 Configuration Files


    Many applications on Linux systems allow you to alter how they behave at certain
    times by altering files containing configuration. These configuration files may
    contain application start-up information, run-time settings and shutdown settings.
    In general, a configuration filename is based on the name of the application for
    which it contains. Such a naming convention allows you to more readily determine
    which file contains settings for a given application.


    ### 6.3.1 System-Wide Versus User-Specific Configuration


    It''s important to remember that there are two different kinds of configurations
    on a Debian system. *System-wide configuration* affects all users. System-wide
    settings are made in the /etc directory, so you generally must be root in order
    to change system-wide settings. You might configure the way the system connects
    to the Internet, for example, or how web browsers on the system start on the company
    home page. Since you want these settings to apply to all users, you make the changes
    in /etc. Sample configuration files in /etc include /etc/X11/X86Config, /etc/lynx.cfg,
    and /etc/ppp/options. In fact, nearly all the files in /etc are configuration
    files.


    *User configuration* affects only a single user. Dotfiles are used for user configuration.
    For example, the file .newsrc stores a list of which USENET (discussion group)
    articles you read and which groups you subscribe to. This allows news readers
    such as tr or GNUS to display un articles in the groups you''re interested in.
    This information will be different for every user on the system, so each user
    has his own .newsrc file in his home directory.


    ## 6.4 Aliases


    If you use the same command often, you might get tired of typing it. bash lets
    you write shorter *aliases* for your commands.


    Say you always use the --almost-all and --color=auto options to ls. You quickly
    tired of typing them: ls --almost-all --color=auto. So you make an alias:


    ```

    alias myls=''ls --almost-all --color=auto''

    ```


    Now you can type mys instead of the full command. To see what myls really is,
    run the command type mys. To see a list of aliases you''ve defined, simply type
    alias on a line by itself.

