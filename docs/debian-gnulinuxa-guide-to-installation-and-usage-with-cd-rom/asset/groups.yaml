    This filename list is most useful as a set of arguments for a command. For example,
    the /etc directory contains a series of subdirectories called rc0.d, rc1.d, etc.
    Normally to view the contents of these, you would type the following:


    ```

    ls /etc/rc0.d /etc/rc1.d /etc/rc2.d /etc/rc3.d

    ls /etc/rc4.d /etc/rc5.d /etc/rc6.d /etc/rcS.d

    ```


    This is tedious. Instead, you can use the wildcard as shown here:


    ```

    ls /etc/rc?

    ```


    /etc/rc?.d expands to a list of filenames that begin with rc, followed by any
    single character, followed by .d.

    Available wildcards include the following:


    +   *Matches any group of 0 or more characters.

    ?Matches exactly one character.

    [...]If you enclose some characters in brackets, [abc] matches either a, or b,
