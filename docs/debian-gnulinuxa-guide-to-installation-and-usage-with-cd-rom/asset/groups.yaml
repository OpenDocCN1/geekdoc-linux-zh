- md: "\n- Don't post or mail in HTML. Some versions of Netscape and Internet Explorer\
    \ will post in HTML rather than plain text. Most people will not even read these\
    \ posts because the posts are difficult to read in most mail programs. There should\
    \ be a setting somewhere in the preferences to disable HTML.\n\n- Be polite. Remember\
    \ that Debian is an all-volunteer effort, and anyone who helps you is doing so\
    \ on his or her time out of kindness.\n\n- Re-mail your question to the list if\
    \ you've gotten no responses after several days. Perhaps there were lots of messages\
    \ and it was overlooked. Or perhaps no one knows the answer if no one answers\
    \ the second time, this is a good bet. You might want to try including more information\
    \ the second time.\n\n- Answer questions yourself when you know the answer. Debian\
    \ depends on everyone doing his or her part. If you ask a question, and later\
    \ on someone else asks the same question, you'll know how to answer it. Do so!\n\
    \n## A.1.4 Getting Information from the System\n\nWhen diagnosing problems or\
    \ asking for help, you'll need to get information about your system. Here are\
    \ some ways to do so:\n\n- Examine the files in /var/log.\n\n- Examine the output\
    \ of the dmesg command.\n\n- Run uname -a.\n\n## Troubleshooting\n\nIn Debian,\
    \ as in life, things don't always work as you might expect or want them to. While\
    \ Debian has a well-deserved reputation for being rock-solid and stable, sometimes\
    \ its reaction to your commands may be unexpected. Here, we try to shed some light\
    \ on the most common problems that people encounter.\n\n## B.1 Common Difficulties\n\
    \nThis section provides some tips for handling some of the most frequently experienced\
    \ difficulties users have encountered.\n\n### B.1.1 Working with Strangely-Named\
    \ Files\n\nOccasionally, you may find that you have accidentally created a file\
    \ that contains a character not normally found in a filename. Examples of this\
    \ could include a space, a leading hyphen, or maybe a quotation mark. You may\
    \ find that accessing, removing, or renaming these files can be difficult.\n\n\
    Here are some tips to help you:\n\n- Try enclosing the filename in single quotation\
    \ marks, like this:\n  `less ‘File With Spaces.txt'`\n- Insert a ./ before the\
    \ filename:\n  `less './-a strange file.txt'`\n- Use wildcards:\n  `less File?With?Spaces.txt`\n\
    - Use a backslash before each unusual character:\n  `less File\\ With Spaces.txt`\n\
    \n### B.1.2 Printing\n\nCommon source of trouble is the printing system in Debian.\
    \ Traditionally, Debian has been a powerful but complex aspect of Unix. However,\
    \ Debian makes it easier. An easy way to print is with the package called magicfilter.\
    \ magicfilter will ask you a few questions about your printer and then configure\
    \ it for you. If you are having troubles printing, give magicfilter a try.\n\n\
    ### B.1.3 X Problems\n\nMany questions revolve around X. Here are some general\
    \ tips for things to try if you are having difficulties setting up the X window\
    \ system:\n\n- For mouse problems, run XF86Setup and try the PS/2, Microsoft,\
    \ MouseSystems, and Logitech options. Most mice will fit under one of these. Also,\
    \ the device for your mouse is /dev/psaux for PS/2 mice and a serial port such\
    \ as /dev/ttyS0 for serial mice.\n- If you don't know which video chipset have,\
    \ try running SuperProbe; it can often figure this out for you.\n- If your screen\
    \ doesn't have a lot of color, try selecting a different video card or tell X\
    \ how video RAM you have.\n- If your screen goes blank or has unreadable text\
    \ when you start X, you probably selected an incorrect refresh rate. Go back to\
    \ XF86Setup or xf86config and double-check those settings.\n- xvidtune can help\
    \ if the image on the screen is shifted too far to the left or right, is too high\
    \ or low, or is too narrow or wide.\n- xdpyinfo can give information about a running\
    \ X session.\n- XF86Setup can set your default color depth.\n- You can select\
    \ your default window manager by editing /etc/X11/window-managers.\n\n- /var/log/xdm-errors\
    \ can contain useful information if you are having trouble getting xdm to start\
    \ properly.\n\nAs a reminder, try the XF86Setup or xf86config tools for configuring\
    \ or reconfiguring X for your hardware.\n\n## B.2 Troubleshooting the Boot Process\n\
    \nIf you have problems during the boot process, such as the kernel hangs during\
    \ the boot process, the kernel does not recognize peripherals you actually have,\
    \ or drives are not recognized properly, the first things to check are the boot\
    \ parameters. They can be found by pressing F1 when booting from the rescue disk.\n\
    \nOften, problems can be solved by removing add-ons and peripherals and then booting\
    \ again. Internal modems, sound cards, and Plug-n-Play devices are especially\
    \ problematic.\n\nTecras and other notebooks, and some non-portables fail to flush\
    \ the cache when switching on the A20 gate, is provoked by zlImage kernels but\
    \ by zlmage kernels. If your computer suffers from this problem, you will see\
    \ a message during boot saying A20 gating failed. In this case, you'll have to\
    \ use the 'tecra' boot images.\n\nIf you still have problems, please submit a\
    \ bug report. Send an email to submit@bugs.debian.org. You must include the following\
    \ as the first lines of the email:\n\n- Package: boot-linux\n- Version:\n- Architecture:\n\
    - Vendor:\n- Memory:\n- SCSI:\n- Interface:\n- Network:\n- PCI:\n- CD-ROM:\n-\
    \ USB-USB\n\n## Booting the System\n\nThis appendix describes what happens during.\
    \ How you boot system depends on how you installed Debian. The first thing that\
    \ happens when you turn on is BIOS. BIOS stands for Basic Output System. It performs\
    \ some tests and then looks for disk. If it finds one, it starts. If there isn't\
    \ a disk, the BIOS will print a message like:\n\nLILO loads the system.\n\nIf\
    \ you opted to install LILO on your hard drive, you should see the word LILO as\
    \ your computer starts up. At that point, you can press the Shift key to select\
    \ which system to load or press Tab to see a list of options. Type in one of those\
    \ options and press Enter. LILO will boot the. If you don't press the Shift key,\
    \ LILO will automatically load after 5 seconds. If you like, you can change what\
    \ system LILO loads.\n\nLILO loads the Linux kernel and then lets the kernel take\
    \ over. (The kernel is the central program of the operating system, which is in\
    \ control of all other programs.) The kernel discards the BIOS and.\n\nOn Non-Intel\
    \ platforms, things work a little differently. But once you boot, everything is\
    \ more or less the same. Linux looks at the type of hardware it's running on.\
    \ It wants to know what type of hard disks you have, whether or not you have a\
    \ bus mouse, whether or not you're on a network, and other bits of trivia like\
    \ that. Linux can't remember between boots, so it has to ask these questions when\
    \ it starts up. Frankly, it isn't asking you these questions it's asking the hardware!\n\
    \nThe query process can cause problems with your system, but if it was going,\
    \ it would have when you first installed GNU/Linux. If you're having problems,\
    \ consult the installation instructions or ask questions on a mailing list.\n\n\
    The kernel merely manages other programs, so once it is satisfied everything is\
    \ okay, it must start another program to do anything useful. The program the kernel\
    \ starts is called init. After the kernel starts init, it never starts another\
    \ program. The kernel becomes a manager and provider of services.\n\nOnce it is\
    \ started, it runs a number of scripts (files containing commands), which prepare\
    \ the system to be used. They do some routine maintenance and start up a lot of\
    \ programs that do things like display"
  mdcn: "\n\n- 不要以 HTML 格式发布或发送邮件。某些版本的 Netscape 和 Internet Explorer 会以 HTML 而非纯文本格式发布。大多数人甚至不会阅读这些帖子，因为在大多数邮件程序中这些帖子很难阅读。在偏好设置某处应该有一个禁用\
    \ HTML 的设置。\n\n- 请保持礼貌。记住 Debian 是一项全全志愿者的工作，任何帮助你的人都是出于善意在自己的时间里帮助你。\n\n- 如果你的问题几天后没有收到回复，请将问题重新发送到列表。也许是因为消息太多被忽略了。或者如果第二次没有人回答，可能根本没人知道答案，这是一个很有把握的尝试。你可能想在第二次发送时尝试包含更多信息。\n\
    \n- 当你知道答案时，请亲自回答问题。Debian 依赖于每个人的努力。如果你问了一个问题，后来其他人问了相同的问题，你就知道如何回答了。这样做吧！\n\n\
    ## A.1.4 从系统获取信息\n\n在诊断问题或寻求帮助时，你需要获取有关系统的信息。以下是一些实现方法：\n\n- 检查 /var/log 中的文件。\n\
    \n- 检查 `dmesg` 命令的输出。\n\n- 运行 `uname -a`。\n\n## 故障排除\n\n在 Debian 中，就像生活中一样，事情并不总是如你预期或希望的那样运行。虽然\
    \ Debian 以稳定如磐石闻名，但有时它对命令的反应可能出乎意料。在这里，我们将解释人们遇到的常见问题。\n\n## 常见困难\n\n本节提供了一些处理用户经常遇到的困难的提示。\n\
    \n### B.1.1 处理命名异常的文件\n\n偶尔，你可能会发现自己创建了一个包含文件名中通常找不到字符的文件。示例可能包括空格、连字符或引号。你可能会发现访问、删除或重命名这些文件很困难。\n\
    \n这里是一些可以帮助你的提示：\n\n- 尝试用引号包裹文件名，例如：\n  `less 'File With Spaces'`\n- 在文件名前插入 `./`：\n\
    \  `less './-a.txt'`\n- 使用通配符：\n  `less File?With.txt`\n- 在空格前使用反斜杠：\n  `less\
    \ File\\ Spaces.txt`\n\n### B.1.2 打印\n\n常见的困难是 Debian 中的打印系统。传统上，打印是 Unix 一个强大但复杂的方面。然而，Debian\
    \ 使它变得更容易。使用名为 `magicfilter` 的包，它会询问你关于打印机的几个问题并为你配置。如果你在打印遇到问题，尝试 `magicfilter`。\n\
    \n### B.1.3 X 问题\n\n许多问题围绕着 X。如果你在设置 X 时遇到困难，这里是一些通用提示：\n\n- 对于鼠标问题，运行 `XF86Setup`\
    \ 并尝试 PS/2、MouseSystems 等选项。大多数鼠标设备位于 `/dev/psaux`（PS/2 鼠标）或如 `/dev/ttyS0`（串口端口）。\n\
    - 如果不知道芯片组，尝试运行 `Probe`；它通常可以为你解决这个问题。\n- 如果你的屏幕没有显示很多内容，在启动 X 时你可能选择了错误的刷新率。回到\
    \ `XF86Setup` 或 `xf86config` 并检查这些设置。\n- 如果你的屏幕空白或在启动 X 时显示不可读文本，`xvidtune` 可以帮助你，如果图像向左或右偏移、太高或太宽。\n\
    - `xdpy` 可以提供有关正在运行的 X 会话的信息。\n- `XF86Setup` 可以设置你的默认深度。\n- 你可以通过编辑 `/etc/X11/window-managers`\
    \ 来选择你的默认窗口管理器。\n- 如果你在启动 xdm 时遇到问题，`/var/log/xdm-errors` 可以包含有用信息。\n\n作为提醒，尝试\
    \ `XF86Setup` 或 `xf86config` 工具为硬件配置或重新配置。\n\n## B.2 启动过程故障排除\n\n如果你在启动过程中遇到问题，例如内核在启动过程中挂起、内核无法识别外设、或驱动器未被正确识别，首先要检查启动参数。可以在从救援磁盘启动时按\
    \ F1 找到。\n\n通常，可以通过移除插件和外设并重新启动来解决问题。内部调制调器、声卡和即插用设备特别有问题。笔记本 等笔记本电脑以及某些非便携式设备在开启时无法刷新缓存，A20\
    \ 门是由 zlImage 或 zlmage 内核引起的。如果你的电脑出现这个问题，你将在启动期间看到“A20 gating failed”的消息。在这种情况下，你必须使用\
    \ 'tecra' 启动镜像。\n\n如果你仍然有问题，请提交错误报告。发送邮件到 `submit@bugs.debian.org`。你必须在邮件的第一行包含以下内容：\n\
    \n- Package: boot-linux\n- Version:\n- Architecture:\n- Vendor:\n- Memory:\n-\
    \ SCSI:\n- Interface:\n- Network:\n- PCI:\n- CD-ROM:\n- USB-USB\n\n## 启动系统\n\n\
    本附录描述了启动期间发生了什么。你如何启动系统取决于你如何安装 Debian。开机时发生的第一件事是 BIOS。BIOS 代表基本输出系统。它执行一些测试，然后寻找磁盘。如果找到了，它就会启动。如果没有磁盘，BIOS\
    \ 将打印如下消息：\n\nLILO loads the system.\n\n如果你选择在硬盘上安装 LILO，那么在电脑启动时，你应该看到 LILO 这个词。此时，你可以按\
    \ Shift 键来选择加载哪种系统，或按 Tab 键查看选项列表。输入其中一个选项并按回车。LILO 将启动。如果你不按 Shift 键，LILO 将在5\
    \ 秒后自动加载。如果你愿意，可以更改 LILO 加载的系统。\n\nLILO 加载 Linux 内核然后让内核接管。（内核是操作系统的核心程序，控制着所有其他程序。）内核丢弃\
    \ BIOS 并。\n\n在非 Intel 平台上，工作方式稍有不同。但一旦启动，一切都大同小异。Linux 查看它运行的硬件类型。它想知道你有什么类型的硬盘、你是否有总线鼠标、你是否连接了网络以及其他类似的琐碎信息。Linux\
    \ 无法在启动之间记住这些，所以它在启动时必须询问这些问题。坦率地说，它不是在问你，而是在问硬件！\n\n查询过程可能会导致系统出现问题，但如果在第一次安装\
    \ GNU/Linux 时就会出现。如果你遇到问题，请查阅安装说明或在邮件列表中提问。\n\n内核仅仅管理其他程序，一旦它确认一切正常，它必须启动另一个程序来执行任何有用工作。内核启动的程序被称为\
    \ init。内核启动 init 后，再不再启动其他程序。内核变成了一个管理器和服务提供者。\n\n一旦 init 启动，它运行一系列脚本（包含命令的文件），这些脚本准备好系统。它们执行一些例行维护并启动许多显示内容的程序。\n"
