    # 图 3.2 dselect 访问界面


    ![](img/aa5a57a80d657e37512ee7f063d22238_52_0.png)


    此列表通过在“新软件包获取”（Package Acquisition）部分下设置安装方法来生成。此方法允许从本地位置、网络资源、FTP 进行安装，并支持完整安装、依赖检查以及多源支持。你可以通过运行
    `apt-get` 和 `list` 查看此列表。


    在这里以及本文中，我们将讨论如何启动另一个 shell。Linux 在任何时候都提供六个控制台会话或 shell。你可以通过 `左 Alt-F1` 到 `左
    Alt-F6` 在它们之间切换，之后在你的新 shell 中登录并继续操作。安装过程使用的控制台是第一个，也称为 tty1，所以当你想返回该进程时，请按 `左
    Alt-F1`。


    # 3.20.2 启动 dselect 后


    在 dselect 中，你将看到这个界面：

    Debian Linux ''dselect'' 软件包处理前端。

    0. [A]ccess 选择要使用的访问方法。

    1. [U]date 如果可能，更新可用软件包列表。

    2. [S]elect 请求在你的系统上需要的哪些软件包。

    3. [I]Install 安装并升级所需的软件包。

    4. [C]onfig 配置任何未配置的软件包。

    5. [R]emove 删除不需要的软件。

    6. [Q]uit 退出 dselect。


    让我们逐一查看这些选项。


    # 访问 (Access)


    访问界面如第35页的图 3.2 所示。在这里，我们告诉 dselect 我们的软件包在哪里。忽略它们出现的顺序。选择正确的安装方法非常重要。你可能会看到列出的多几个方法，或者少几个，或者看到它们以不同的顺序列出；不用担心这些。在下面的列表中，我们描述了不同的方法。


    **multi_cd**。这是一个非常庞大且功能强大的复杂方法，它是从一组多个二进制光盘（CDs）安装最新版本 Debian 的推荐方法。这些 CD 中的每张
    CD 都应该包含自身以及所有之前 CD 的软件包信息（存储在 `Packages.cd` 文件中）。当你第一次选择此方法时，请确保你将使用的 CDROM 未被挂载。将该组的最后一张二进制磁盘（我们不需要源码
    CD）放入驱动器并回答向你提出的问题：


    ```

    CD-ROM 驱动器位置

    确认你正在使用多张 CD 集合

    Debian 发行版在磁盘（磁盘）上的位置

    [ 可能 ] Packages 列表的位置或位置

    ```


    一旦你更新了可用列表并选择了要安装的软件包，`multi_cd` 方法将偏离常规程序。你需要对你拥有的每张 CD 运行“安装”（install）步骤。遗憾的是，由于
    dselect 的局限性，它无法在每个阶段提示你插入新磁盘；处理每张磁盘的方法列在此处：


    - 1. 将 CD 插入 CD-ROM 驱动器。

    - 2. 从 dselect 主菜单选择“Install”（安装）。

    - 3. 等待 `dpkg` 完成此 CD 的安装。（它可能会报告安装成功，也可能报告安装错误。先不要担心这些问题。）

    - 4. 按 `Return` 键返回 dselect 主菜单。

    - 5. 对集合中的下一张 CD 重复此操作。


    可能需要多次运行安装步骤以涵盖软件包安装的顺序；某些早期安装的软件包可能需要在稍后安装的软件包之前才能正确配置。建议运行“Configure”（配置）步骤以帮助修复可能处于此阶段的软件包。


    **multi_nfs, multi_mount**。这些方法与 `multi_cd` 方法类似，是处理变化介质主题的改进版——例如，从另一台机器的 CD-ROM
    驱动器通过 NFS 出的多 CD 集合进行安装。indexdselect!multi-NFS, multi-mount installation


    **apt**。这是从 Debian 存档本地镜像或网络进行安装的最佳选项之一。该方法使用“apt 系统”来完成依赖分析和排序，因此最有可能以优化顺序安装软件包。


    该方法的配置非常直观。你可以选择任意数量的不同位置，混合使用文件：URL（本地磁盘或 NFS 挂载磁盘）、`http:` URL 或 `ftp:` URL。但注意，HTTP
    和 FTP 选项不支持本地认证代理。


    如果你为 HTTP 或 FTP（或两者）准备了代理服务器，请确保你已分别设置了 `http_proxy` 和 `ftp_proxy` 环境变量。在启动 dselect
    之前，通过你的 shell 使用以下命令设置它们：


    ```

    # export http_proxy=http://gateway:3128/

    # dselect

    ```


    # 更新 (Update)


    dselect 将从镜像读取 `Packages` 或 `Packages.gz` 文件，并在你的系统中创建一个所有可用软件包的数据库。由于需要下载和处理文件，这可能需要一段时间。


    # 选择 (Select)


    准备好。这是这一切发生的地方。练习的目标是仅选择你想要安装的软件包。


    按 `Enter`。如果你的机器很慢，请注意屏幕可能会清空并保持空白 15 秒。此时不要急着乱敲按键。


    屏幕上出现的第一个内容是帮助文件的第 1 页。你可以在“Select”（选择）界面的任何时候按 `?` 键获取此帮助，并可以通过按 `.`（全角键）翻阅帮助页面。


    在开始之前，请注意以下几点：


    - 在完成所有选择后，按 `Enter` 退出“Select”界面。这将返回主界面，如果你的选择没有问题。

    - 如果你选择 A 且 A 需要 B 才能运行，dselect 会提示你问题。如果选择 A 且 A 与 B 冲突，dselect 将提供解决方案。

    - 如果你对选择感到满意，按 `Enter` 退出。

    - 出现问题是正常的，也是预期的。


    表 3.1 dselect 特殊键

    | 键 | 说明 |

    |---|---|

    | + | 选择软件包。 |

    | = | 选择软件包。 |

    | - | 删除软件包。 |

    | i, I | 切换信息。 |

    | o, O | 切换选项。 |

    | v, V | 详细显示。 |


    表 3.2 dselect 软件包状态

    | 标记 | 含义 | 可能的值 |

    |---|---|---|

    | E | 错误 | R |

    | I | 已安装 | U |

    | O | 旧的 | n |

    | M | 标记 | n


    # 56 使用 dselect 安装软件包 39


    Select 界面 (dselect) 帮助你防止迷路的键是 R、 U 和 D。


    - RC 取消此级的所有选择。不影响上一级的选择。

    - U 如果 dselect 提出了更改而你又进一步更改，U 将恢复 dselect 的选择。

    - DR 移除 dselect 做的更改，仅留下你的选择。


    示例如下。boot-floppies 软件包（我知道这不是初学者的示例，但选择它是因为有很多依赖）依赖以下软件包：


    - libc6-pic

    - slang1-pic

    - sysutils

    - makedev

    - newt0.25

    - newt0.25-dev

    - popt

    - zlib1g

    - zlib1g-dev

    - recode (等待)


    维护 boot-floppies 的人员还认为应该安装以下软件包。但这些并不是必需的：


    - lynx

    - debiandoc-sgml

    - unzip


    当你选择 boot-floppies 时，dselect 会弹出冲突解决界面。你会发现所有所需的软件包都已选中。


    按 R 键回到起点。


    | EIOM Pri Section Description |

    | * Opt admin boot-floppy Scripts to create the Debian |

    | -- Opt dev newt0.25-dev newt 开发工具包 |

    | -- Opt dev slang1-dev S-Lang 编程库 |

    | -- Opt dev slang1-pic S-Lang 编程库 |


    如果你决定不要 boot-floppies，只需按 `Enter`。


    按 D 键将情况恢复到最初选择的状态：


    | EIOM Pri Section Description |

    | * Opt admin boot-floppy Scripts to create the Debian |


    '
