    Operating System Kernel and Modules”步骤一样，你可以让 dbootstrap 自己查找文件，也可以在提示处输入路径。


    ### 3.12.1 配置基础系统


    此时你已经读入了组成最小 Debian 系统的所有文件，但在系统运行之前必须进行一些配置。


    你将被要求选择时区。有许多方法可以指定时区；我们建议你进入“Directories:”（目录）面板。'
