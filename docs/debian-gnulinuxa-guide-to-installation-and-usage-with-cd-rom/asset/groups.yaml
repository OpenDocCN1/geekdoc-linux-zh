    1. 将鼠标指针移动到 `xterm` 窗口的中心。

    2. 同时按住 Control 键和鼠标右键。这将为你提供字体菜单。

    3. 指向你想要的字体并松开鼠标键。


    ## X Window 系统


    本章描述了 X Window 系统图形用户界面。它假设你已经按照《X 安装手册》中的描述成功配置了 X（再次，安装手册尚未编写；目前你需要使用 `/usr/doc/X11`
    中的内容）。一旦你安装了 X，你就可以根据你的选择输入 `startx` 或通过 `xdm` 进入环境。


    86 第 9 章 X Window 系统


    X 本身是程序与你的硬件通信的手段，而无需知道你拥有什么种鼠标和显卡。这是对硬件的抽象，意味着程序只需要编写一次即可在每台电脑上运行。在 X 的术语中，与硬件通信的程序被称为
    *X 服务器*（X server）。请求 X 服务器在屏幕上显示图形的用户应用程序被称为 *X *（X clients）。X 服务器不提供 GUI 的任何功能，例如调整窗口大小。一种特殊的
    X 客户端被称为窗口管理器（window manager），它为窗口绘制边框和标题栏，调整窗口大小，并从菜单启动其他客户端。在 Debian 上提供的窗口管理器包括
    fwm、icewm、afterstep、flux 和 enlightenment。你可能想尝试所有的它们并选出一个你喜欢的。X 服务器和窗口管理器都不提供文件管理器（file
    manager）；即包含文件和目录图标的窗口。你可以作为一个独立的程序启动文件管理器，有很多可选。GNOME 桌面项目正在开发一种基于图标的文件管理器。


    X 的最后一个特性是它的网络透明性，这意味着 X 客户端并不关心它们连接的是同一机器上的 X 服务器还是网络上某处的 X 服务器。在实践中，这意味着你可以在强大的远程机器上运行程序，但在你的桌面上显示它。


    基础操作


    X 中某些常用的操作是你应该熟悉的。本节描述了一些你可能会发现有用的基础操作。


    ### 9.3.1 鼠标


    X 中的鼠标工作方式与其他系统非常相似，区别在于它有三个按钮。如果你的鼠标只有两个，你可以通过同时点击两个按钮来模拟中键。这有点棘手且恼人，所以买一个 15
    美元的按钮鼠标可能不是坏主意。在大多数电脑零售店都能买到。


    假设你使用的是右手鼠标，按钮从左到右编号。因此 1 号按钮在左侧，2 号在中间，3 号在右侧。你在文档中可能会看到数字或位置描述。


    X 有一个简单的内置复制-粘贴功能。要选择复制的文本，你用左鼠标键点击并拖动。这应该选中要复制的文本，假设你正在使用的应用程序支持复制-粘贴。要粘贴文本，你在另一个
    X 应用程序中点击中键。例如，如果你收到一封包含 URL 的电子邮件，你可以用左键选择该 URL，然后在网络浏览器的“位置”字段中点击中键即可粘贴它。


    '
