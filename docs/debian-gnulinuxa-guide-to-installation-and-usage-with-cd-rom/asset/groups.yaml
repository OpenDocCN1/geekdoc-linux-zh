    reach it. All absolute filenames begin with the / directory, and there’s a / before
    each directory or file in the filename. The first / is the name of a directory,
    the others are simply separators to distinguish the parts of the filename.


    +   - The words used can be confusing. Take the following example: /usr/share/keytables/us.map.gz.
    This is a fully-qualified filename; some people call it a path. However, people
    will also refer to us.map.gz as a filename.


    +   - There is also another use for the word “path.” The intended meaning is usually
    clear from the context.


    +   - Directories are arranged in a tree structure. All absolute filenames start
    with the root directory. The root directory has a number of branches, such as
    /etc and /usr. These subdirectories branch into more subdirectories, such as /etc/init.d
    and /usr/local. The whole thing together is called the “directory tree.”'
