    # The X Window System


    This chapter describes the X Window system graphical user interface. It assumes
    that you have already successfully configured X as described in the Installation
    Manual (again, the install manual is not as yet written; for now you will need
    to use the XFree86 HOWTO, the contents of /usr/doc/X11, and this chapter). Once
    you install X, you can enter the X environment by typing startx or via xdm, depending
    on your choice during configuration.


    #  9.1 Introduction to X


    A GUI (Graphical User Interface) is part and parcel of the Windows and Mac operating
    systems. It''s basically impossible to write an application for those systems
    that does not use the GUI, and the systems can''t be used effectively from the
    command line. GNU/Linux is more modular, that is, it''s made up of many small,
    independent components that can be used or not according to one''s needs and preferences.
    One of these components is the X Window system, or simply X.


    This component is also sometimes called X11. Please note that “X Windows” is not
    correct.'
