    ## 3.12.2 直接从硬盘使 Linux 可可启动


    如果您选择让硬盘直接启动到 Linux，系统将要求您安装一个主引导记录（master boot record）。如果您没有使用引导程序（如果您知道什么是引导程序，通常可能就是如此）并且在同一台机器上没有安装其他操作系统，请回答“Yes”，下一个问题是“例如，您将无法在机器上正常启动到
    DOS”。请小心。如果您回答了“Yes”，下一个问题将是您是否想在开启系统时自动从硬盘启动 Linux。这会将 Linux 设置为可启动分区——即从硬盘中加载的分区。


    请注意，在单台机器上运行多个操作系统仍然是某种“黑术”。本书没有记录各种引导程序，因为这些引导程序随架构甚至子架构的不同而异。您应该查看您所引导程序的文档以获取更多信息。请记住：在操作引导程序时，越小心越好。


    标准的 i386 引导加载程序是“LILO”。它是一个复杂的程序，提供了许多功能，包括 DOS、NT 和 OS/2 的引导管理。要了解更多关于此功能的信息，您可以在系统设置后阅读
    `/usr/doc/lilo` 中的文档。


    ## 3.13 制作启动软盘


    即使您打算从硬盘启动系统，也应该制作一个启动软盘。原因是硬盘自举程序（bootstrap）可能安装错误，但启动软盘几乎总是有效的。从菜单中选择“Make a
    Boot Floppy”（制作启动软盘），并按照指示向系统提供空白软盘。确保软盘没有被写保护，因为软件将对其进行格式化并写入内容。完成后，将其标记为“Custom
    Boot”（自定义启动）软盘并进行写保护。


    ## 3.14 关键时刻


    您的系统在独立电源下的首次启动是电气工程师所谓的“冒烟测试”（smoke test）。如果软盘驱动器中有任何软盘，请将其取出。选择“Reboot the System”（重启系统）菜单项。


    如果您是直接启动到 Debian 但系统没有启动，请使用您的原始安装启动媒体（例如救援软盘 Rescue Floppy）或插入您创建的自定义启动软盘，这将重置您的系统。如果您没有使用自定义启动软盘，您可能需要添加一些引导参数。使用救援软盘或类似技术启动时（其中
    `rootfs` 是您的根分区），您需要指定 `root=/dev/sda1`，您应该看到与首次启动安装系统时相同的消息，随后是一些新消息。


    ## 3.15 设置 root 密码


    root 账户称为超级用户（superuser）；它是一个绕过系统所有安全保护的登录账户。root 账户应仅用于系统管理，且使用时间越短。


    您创建的任何密码都应包含六到八个字符以及标点符号。设置 root 密码时要格外小心，因为它是一个如此强大的账户。避免使用字典单词或任何可能被猜到的个人信息。


    如果有人告诉您他们需要您的 root 密码，请务必保持警惕。通常情况下，您不应提供您的 root 账户，除非您正在管理一台拥有多一个系统管理员的机器。


    ## 3.16 创建普通用户


    系统将要求您创建一个普通用户账户。该账户应该是您的主要个人登录账户。您不应将 root 账户用于日常使用或作为个人登录。


    为什么不呢？作为普通用户，破坏系统比作为 root 要困难得多；系统文件受到了保护。另一个原因是，您可能会被欺骗运行木马程序——即利用您的超级用户权限，在您不留情的情况下破坏您系统安全的程序的程序。任何关于
    Unix 系统管理的优秀书籍都会更详细地介绍这个主题。如果这个主题对您来说是全新的，请考虑阅读此类书籍。


    可以为用户账户命名任何名称。如果您的名字是 John Smith，可以使用“smith”、“john”、“jsmith”或“js”。


    ## 3.17 影子密码支持


    接下来，系统将询问您是否想启用影子密码（shadow passwords）。这是一个让您的 Linux 系统稍微安全一点认证系统。


    ## 3.18 移除启动软盘


    如果您没有使用自定义启动软盘，您可能需要添加一些引导参数。使用救援软盘或类似技术启动时（其中 `rootfs` 是您的根分区），您需要指定 `root=/dev/sda1`，您应该看到与首次启动安装系统时相同的消息，随后是一些新消息。


    ## 3.19 选择并安装软件包


    系统将询问您是否想启用影子密码。这是一个让您的 Linux 系统稍微安全一点认证系统。


    ## 3.20 使用 dselect 安装软件包


    现在是时候在您的 Debian 系统上安装您选择的软件软件包了。这是通过使用 Debian 的包管理工具 dselect 完成的。


