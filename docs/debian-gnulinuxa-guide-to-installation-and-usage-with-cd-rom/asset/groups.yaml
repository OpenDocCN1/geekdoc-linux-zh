    and very precise control on what is or is not installed, skip this step and use
    the full power of dselect.


    Soon, you will enter into dselect. If you selected tasks or profiles, remember
    to skip the "Select" step of dselect, because the selections have already been
    made.'
  - '[PAGE 51]


    A word of warning about the size of the tasks as they are displayed: The size
    shown for each task is the sum of the sizes of its packages. If you choose two
    tasks that share some packages, the actual disk requirement will be less than
    the sum of the sizes for the two tasks.


    Once you''ve added both logins (root and personal), you will be dropped into the
    dselect program. dselect allows you to select packages to be installed on your
    system. If you have a CD-ROM or hard disk containing the additional Debian packages
    you want to install on your system, or if you are connected to the Internet, this
    will be useful to you right away. Otherwise, you may want to quit dselect and
    start it later after you have transported the Debian package files to your system.
    You must be the superuser (root) when you run dselect. Information on how to use
    dselect is given in section 3.20.


    # 3.20 Package Installation with dselect


    It is now time to install the software packages of your choice on your Debian
    system. This is done using Debian''s package management tool, dselect.


    # 3.20.1 Introduction


    This section documents dselect for first-time users. It makes no attempt to explain
    everything, so when you first meet dselect, work through the help screens.


    dselect is used to select which packages you wish to install (there are currently
    about 2,250 packages in Debian 2.1). It will be run for you during the installation.
    It is a very powerful and somewhat complex tool. As such, having some knowledge
    of it beforehand is highly recommended. Careless use of dselect can wreak havoc
    on your system.


    dselect will step you through the package installation process outlined here:


    +   1.Choose the method to use.

    2.Update list of available packages, if possible.

    3.Select the packages you want on your system.

    4.Install and upgrade wanted packages.

    5.Configure any packages that are unconfigured.

    6.Remove unwanted software.


    As each step is completed successfully, dselect will lead you on to the next.
    Go through them in order without skipping any steps.'
