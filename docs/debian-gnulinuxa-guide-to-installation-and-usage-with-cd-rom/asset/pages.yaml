  md: '# Customizing Your X Startup


    by modifying the file /etc/X11/config, which specifies a few system-wide preferences.


    To run the clients of your choice when X starts, you create an executable shell
    script called .xsession in your home directory.


    ```

    $ touch ~/.xsession

    ```


    This creates the file.


    ```

    $ chmod +x ~/.xsession

    ```


    Once .xsession is created, you need to edit it to do anything useful with your
    favorite text editor. You can add anything you want to do in this script. However,
    when the script''s process terminates, X also terminates.


    In practical terms, this means that you often end the script with a call to exec.
    Whatever program you exec will replace the script process with itself, so commands
    found after the exec line will be ignored. The program you exec will become the
    new owner of the script process, which means X will terminate when this new program''s
    process terminates.


    Say you end .xsession with the line exec fwwm. This means the fwwm window manager
    will run when X starts. When you quit the fwwm window manager, your X session
    will end, and all other clients will be shut down. You do not have to use a window
    manager here; you could exec xterm, in which case typing exit in that particular
    xterm would cause the entire X session to end.


    If you want to run other clients before you use exec, you will need to run them
    in the background. Otherwise .xsession will pause until each client exits and
    then continue to the next line. See the previous section on running jobs in the
    background (basically you you want to put an ampersand at the end, as in xterm
    &).


    You can take advantage of this behavior. If you want to run commands at the end
    of your X session, you can have .xsession run a window manager of the like and
    wait for it to finish. That is, leave off the exec and ; just exec fwwm by itself.
    Then put the commands of your choice after fwwm.


    It would probably help to look at a few sample .xsession files. In all the examples,
    replace fwwm with the window manager of your choice. The simplest .xsession just
    runs a window manager:


    ```

    exec fwwm

    ```


    This will run fwwm, and the X session will end when fwwm exits. If you do without
    it without the exec, everything will appear to behave the same way, but behind
    the scenes .xsession will hang around waiting for fwwm, and .xsession will exit
    after fwwm does. Using exec is slightly better because'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'fwwm replaces .xsession instead of leaving it waiting. You can use the ps or
    top command to verify this.


    A more useful .xsession runs a few clients before starting the window manager.
    For example, you might want some xtermms and an xclock whenever you start X. No
    problem; just enter xterm & xterm & xclock & exec fwwm. Two xtermms and an xclock
    start up in the background, and then the window manager is launched. When you
    quit the window-manager, you''ll also quit X.


    You might try it without the background just to see what happens. Enter this command:
    xterm xclock exec fwwm. xterm will start, and wait for you to exit it. Then xclock
    will start; you''ll have to exit xclock before fwwm will start. The commands are
    in sequence, since the script waits for each one to exit.


    You can use sequential execution to your advantage. Perhaps you want to keep track
    of where you stop working every day:


    ```

    xterm &

    xclock &

    fwwm

    date >> ~/logout-time

    ```


    This will fork off an xterm and an xclock and then run fwwm and wait for it to
    finish. When you exit fwwm, it will move on to the last line, which appends the
    current date and time to the file ~/logout-time.


    Finally, you can have a program other than the window manager determine when X
    exits:


    ```

    xclock &

    fwwm &

    exec xterm

    ```


    This script will run xclock & fwwm in the background and then replace itself with
    xterm. When you exit the xterm, your X session will end.


    The best way to learn how to use .xsession is to try some of these things out.
    Again, be sure you use chmod to make it executable; failure to do so is a common
    error.'
