  md: 'select your country (continent). That will change the available time zones,
    so go ahead and select your geographic locality (i.e., country, province, state,
    or city) in the “Timezones:” pane.


    Next, you will be asked if your system clock is set to GMT or local time. Select
    GMT (i.e., “Yes”) if you will only be running Linux on your computer; select local
    time (i.e., “No”) if you will be running another operating system as well as Debian.
    Unix (and Linux is no exception) generally keeps GMT time on the system clock
    and converts visible time to the local time zone. This allows the system to keep
    track of daylight savings time and leap years, and even allows a user who is logged
    in from another time zone to individually set the time zone used on his or her
    terminal.


    # 3.12.2 Make Linux Bootable Directly from the Hard Disk


    If you elect to make the hard disk boot directly to Linux, you will be asked to
    install a master boot record. If you''re not using a boot manager (and this is
    probably the case if you know what a boot manager is) and you don''t have another
