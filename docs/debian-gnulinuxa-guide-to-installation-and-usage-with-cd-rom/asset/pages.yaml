  md: '^metacharacter; for example, [^a-zBZ] means "anything except a lowercase letter,
    capital B, or capital Z."


    ()You can use parentheses to group parts of the regular expression, just as you
    do in a mathematical expression.


    | "or". You can use it to provide a series of alternative expressions.

    Usually you want to put the alternates in parentheses, like this:

    c(ad|ab|at)matches cad or cob or cat. Without the parentheses, it would match
    cad or ab or instead

    \Escapes any special characters; if you want to find a literal *, you type \*.
    The slash means to ignore *s usual meaning.


    Here are some more examples to help you get a feel for things:

    c.pematches cope, cape, caper.

    c\ .pematches c.pe, c.per.

    sto*pmatches stp, stop, stoop.

    car.*matches carton, cartoon, carmen.

    xyz.*matches xyz and anything after it; some tools, like egrep, only match until
    the end of the line.


    ^Thematics at the beginning of a line.

    atime$matches atime at the end of a line.

    ^Only$matches a line that consists solely of the word Only – no spaces, no other
    characters, nothing. Only Only is allowed.


    b[aou]rnmatches barn, born, burn.

    Ver-[D-F]matches VerD, VerE, VerF.

    Ver[^0-9]matches Ver followed by any non-digit.

    the[ir][re]matches their, there, thee.


    [A-Za-z] [A-Za-z]*matches any word which consists of only letters, and at least
    one letter. It will not match numbers or spaces.


    # 13.2 Advanced Files


    Now that you have a basic understanding of files, it is time to learn more advanced
    things about them.


    # 13.2.1 The Real Nature of Files: Hard Links and Inodes


    Each file on your system is represented by an inode (for Information Node; pronounced
    "eye-node\). An inode contains all the information'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 13 Advanced Topics


    the file. However, the inode is not directly visible. Instead, each inode is linked
    into the filesystem by one or more hard links. Hard links contain the name of
    the file and the inode number. The inode contains the file itself, i.e., the location
    of the information stored on disk, its access permissions, the file type, and
    so on. The system can find any inode if it has the inode number.


    A single file can have more than one hard link. What this means is that multiple
    filenames refer to the same file (that is, they are associated with the same inode
    number). However, you can''t make hard links across filesystems: All hard references
    to a particular file (inode) must be on the same filesystem. This is because each
    filesystem has its own set of inodes, and there can be duplicate inode numbers
    on different filesystems.


    Because all hard links to a given inode refer to the same file, you can make changes
    to the file, referring to it by one name, and then those changes when referring
    to it by a different name. Try this:


    ```

    echo "hello" > firstlink

    ```


    cd to your home directory and create a file called firstlink containing the word
    "hello". What you''ve actually done is redirect the output of echo (echo just
    echoes back what you give to it), placing the output in firstlink. See the chapter
    on shells for a full explanation.


    ```

    cat firstlink

    ```


    Confirms the contents of firstlink.


    ```

    ln firstlink secondlink

    ```


    Creates a hard link: secondlink now points to the same inode as firstlink.


    ```

    cat secondlink

    ```


    Confirms that secondlink is the same as firstlink.


    ```

    ls -1

    ```


    Notice that the number of hard links listed for firstlink and secondlinkfiles!inodes
    is 2.


    ```

    echo "change" >> secondlink

    ```


    This is another shell redirection trick (don''t worry about the details). You''ve
    appended the word "change" to secondlink. Confirm this with cat secondlink.


    ```

    cat firstlink

    ```


    firstlink also has the word "change" appended! That''s because firstlink and secondlink
    refer to the same file. It doesn''t matter what you call it when you change it.'
  merge: -1
