  md: '# 94 Chapter 10 Filesystems


    /dev/cdrom is a good guess because the install process should have created this
    symbolic link on the system. If that fails, try the different IDE devices: /dev/hdc,
    etc. You should see a message like this: \`mount: block device /dev/hdc is write-protected,
    mounting read-only.


    The -t option specifies the type of the filesystems, in this case iso9660. Most
    CDs are iso9660. The next argument is the name of the device to mount, and the
    first argument is the mount point. There are many other arguments for mount; see
    the manual page for details.


    Once a CD is mounted, you may find that your drive tray will not open. You must
    unmount the CD before removing it.


    ```

    ls /cdrom

    ```


    Confirms that /cdrom now contains whatever is on the CD in your drive.


    Displays the list of filesystems again; notice that your CD drive is now mounted.


    ```

    umount /cdrom

    ```


    This unmounts the CD. It''s now safe to remove the CD from the drive. Notice that
    the command is ummount with no "n", even though it''s used to unmount the filesystem.


    ```

    exit

    ```


    Don''t leave yourself logged on as root. Log out immediately, just to be safe.


    # 10.2.3 /etc/fstab: Automating the Mount Process


    The file /etc/fstab (it stands for "filesystem table") contains descriptions of
    filesystems that you mount often. These filesystems can then be mounted with a
    shorter command, such as mount /cdrom. You can also configure filesystems to mount
    automatically when the system boots. You''ll probably want to mount all of your
    hard disk filesystems when you boot, so Debian automatically adds entries to fstab
    to do this for you.


    Look at this file now by typing /etc/fstab. It will have two or more entries that
    were configured automatically when you installed the system. It properly looks
    like this:


    ```

    # /etc/fstab: static file system information.

    #

    # <file system> <mount point> <type> <options>

    #dump <pass>

    /dev/hd1 / ext2 defaults 0 1

    /dev/hda3 none swap sw 0 0

    ```'
