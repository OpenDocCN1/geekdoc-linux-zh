  md: '# Figure 4.1 Sample session with su


    ```

    $ whoami Check your current username

    username This will show your username

    $ su Ask system for superuser access

    Password:# machine:~ whoami Type your root password here

    root You''re now on as root

    machine:~ exit Exit your root shell

    $ exit Exit your “normal” shell

    ```


    You should find yourself at another log prompt. Don’t panic: You are now on virtual
    console (VC) number 2! Log in here and do some things – more whoami commands or
    whatever – to confirm that this is a real log shell. You now return to virtual
    console number 1 by pressing Alt-F1. Or you can move to a third virtual console,
    in the obvious way (Alt-F3).


    Debian comes with six virtual consoles enabled by default, which you access with
    the Alt key and function keys F1 through F6. (Technically, there are more virtual
    consoles enabled, but only six of them allow you to log in. The others are used
    for the X Window system or other special purposes.)


    If you’re using the X Window system, it will generally start up on the first unused
    console – probably VC 7. Also, to switch from the X virtual console to one of
    the first six, you’ll have to add Ctrl to the key sequence. But you can go from
    a text VC to the X virtual console using only Alt. If you never leave X, you won’t
    have to worry about this; X automatically switches you to its virtual console
    when it starts.


    Once you get used to them, virtual consoles will probably become an indispensable
    tool for getting many things done at once. (The X Window system serves the same
    purpose, providing multiple windows rather than multiple consoles.) You can run
    a different program on each VC or log on as root on one VC and as yourself on
    another. Or everyone in the family can use his or own VC; this is especially handy
    if you use X, in which case you can run several X sessions at once on different
    virtual consoles.


    # 4.5 Shutting Down


    > Do not just turn off the computer! You risk losing valuable data!'
