    #  7.4 Finding Files


    There are two different facilities for finding files: find and locate. find searches
    the actual files in their present state. locate searches an index generated by
    the system every morning at 6:42 a.m. (this is a cron job, explained elsewhere
    in this book). locate won''t find any files that were created after the index.
    However, locate searches an index, it''s much faster - like using the index of
    a book rather than looking through the whole thing.


    To compare the two configuration file for finding, pretend you can''t remember
    where the X configuration file X86Config resides.


    ```

    $ locate X86Config

    ```


    This should be pretty fast. You''ll get a list of filenames that contain X86Config,
    something like this:


    +   - /etc/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config.eg

    - /usr/X11R6/man/man5/X86Config.5x.gz


    Now try to find the command:


    ```

    $ find / -name X86Config

    ```


    You will hear a lot of disk activity, and this will take a lot longer. Results
    will look something like this:


    +   - /etc/X11/X86Config

    - /usr/X11R6/lib/X11/X86Config

    - find: /var/sp/cron/atjobs: Permission denied

    - find: /var/sp/cron/atjobs: Permission denied

    - find: /var/lib/xdm/authdir: Permission denied


    Notice that find only found files that were named exactly X86Config, rather than
    any files containing that string of letters. Also, find actually tried to look
    in every directory on the system - including some where you didn''t have read
    permissions. That''s why you got the Permission denied messages.


    The syntax is different as well. With find, you had to specify what directory
    to search in, whereas locate automatically chose the root directory. And you had
    to specify a search by name using the -name option. You could also have searched
    for files using many other criteria,'
