    the “New” menu selection, and then press Enter. You will be presented with the
    choice of creating a primary or a logical partition. To help ensure that the partition
    containing the boot information is within the first 1,024 cylinders, create a
    primary partition first. This primary partition will be your “Linux native” partition.


    Highlight the “Primary” menu selection and press Enter. Next you will need to
    enter how large you want that partition to be. Review section 2.3.2 on page 13
    if you''re not sure how large it should be. Remember to leave enough space for
    your swap partition (see section 2.3.5 on page 16). Enter the partition size you
    want and then press Enter. Next you will be asked if you want to place the partition
    at the beginning of free space or at the end. Place it at the beginning to ensure
