  md: '# 116 Chapter 13 Advanced Topics


    If you are running a network server, there are some other things to be aware of
    as well. First, you ought to uninstall or turn off any network services you''re
    not using. A good place to start is the file /etc/inetd.conf; you can probably
    disable some of these. For most network services, it''s also possible to control
    who has access to them; the /etc/hosts.allow and /etc/hosts.deny (documented in
    man 5 hosts_access) can control who has access to which services. You also ought
    to keep up-to-date with patches or updates to Debian; these can be found on your
    nearest commonsense Debian FTP mirror.


    Some other rules apply:


    +   - Never tell anyone your password.

    - Never send your password in cleartext across the Internet by using something
    like telnet or FTP. Instead, use encrypted protocols or avoiding logging in remotely.

    - Avoid using root as much as possible.

    - Don''t install untrusted software, and don''t install it as root.

    - Avoid making things world-writable whenever possible. /tmp is one exception
    to this rule.


    While this is probably not as much of use to somebody running a server, it is
    still pays to know a bit about security. Debian''s security mechanism protects
    your system from many viruses.


    # 13.4 Software Development with Debian


    Debian makes a great platform for software development and programming. Among
    the languages and near-languages it supports are: C, C++, Objective-C, Perl, Python,
    m4, Ada, Pascal, Java, awk, Tcl/Tk, SQL, assembler, Bourne shell, csh, and more.
    Writing programs is beyond the scope of this book, but here are some of the most
    popular development programs in Debian:


    gccThe GNU C Compiler, a modern optimizing C compiler.


    g++The C++ compiler from the gcc line.


    cppThe C preprocessor for gcc.


    perlThe Perl interpreter. Perl is a great “glue” language.


    gdbTheGNU Debugger, used to debug programs in many different languages.


    gprofUsed for profiling, this program helps you to find ways to improve the performance
    of your programs.


    emacsGNU Emacs is a programmers’ editor and IDE.


    asThe GNU Assembler.'
