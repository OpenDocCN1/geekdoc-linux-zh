  md: '# 86 Chapter 9 The X Window System


    X itself is a means for programs to talk to your mouse and video card knowing
    what kind of mouse and video card you have. That is, it''s an *abstraction* of
    the graphics hardware. User applications talk to X in X''s language; X then translates
    into the language of your particular hardware. This means that programs only have
    to be written once, and they work on everyone''s computer.


    In X jargon, the program that speaks to the hardware is known as an *X server*.
    User applications that ask the X server to show windows or graphics on the screen
    are called *X clients*. The X server includes a *video driver*, so you must have
    an X server that matches your video card.


    The X server doesn''t provide any of the features from a GUI, such as resizing
    and rearranging windows. A special X client, called a *window manager*, draws
    borders and title bars for windows, resizes and arranges windows, and provides
    facilities for starting other X clients from a menu. Specific window managers
    may have additional features.


    Window managers available on a Debian system include fwm, fwm2, icewm, afterstep,
    olvm, wm, twm, and *enlightenment*. You''ll probably want to try all them and
    pick your favorite.


    Neither the X server nor the window manager provide a *file manager*; that is,
    there aren''t any windows containing icons for your files and directories. You
    can launch a file manager as a separate application, and there are many of them
    available. The GNOME desktop project is developing an icon-based file manager
    and other GUI facilities. See the GNOME homepage for the latest news on this.


    A final feature of X is its *network transparency*, meaning that X clients don''t
    care if they''re talking to an X server on the same machine or an X server somewhere
    on the network. In practical terms, this means you can run a program on a more
    powerful remote machine but display it on your desktop computer.


    # 9.2 Starting the X Environment


    There are two ways to start X. The first is to start X manually when you feel
    like using it. To do so, log in to one of the text consoles and type startx. This
    will start X and switch you to your virtual console.


    The second (and recommended) way to use X is with *xdm* or X Display Manager.
    Basically, xdm gives you a nice graphical login prompt on the X virtual console
    (probably VC 7), and you log in there.


    +   1. http://www.gnome.org/'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'By default, either method will also start xterm, which is a small window containing
    a shell prompt. At the shell prompt, you can type any commands just as you would
    on a text VC. So you can follow all the examples in this book using xterm; the
    text console is the only difference between an xterm and that you don''t have
    to log on to the xterm because you already logged in to X.


    There are also a lot of things you can do only in X, which are covered in this
    chapter.


    One note: the default xterm window has a smallish font. If you have a small monitor
    or very high resolution or bad eyesight, you may want to fix this. Follow these
    steps:


    +   1.Move the mouse pointer to the center of the xterm window.

    2.Hold down the Control key and the right mouse button simultaneously. This will
    give you a font menu.

    3.Point to the font you want and release the mouse button.


    # Basic X Operations


    There are certain commonly used operations in X that you should familiarize yourself
    with. This section describes some of the basic operations that you may find useful.


    # 9.3.1 The Mouse


    The mouse in X works pretty much the same as the mouse on other systems, except
    that it has three buttons. If your mouse has only two, you can simulate the middle
    button by clicking both buttons simultaneously. This is kind of tricky and annoying,
    so investing in a $15-button mouse probably isn''t a bad idea. These are available
    from most computer retailers.


    The buttons are numbered from left to right assuming you have a right-handed mouse.
    So button one is on the left, two is in the middle, and three is on the right.
    You may see either the numbers or the locations in documentation.


    X has a simple built-in copy-and-paste facility. To select text to copy, you click
    and drag with the left mouse button. This should select the text to copy, assuming
    the application you''re using has copy-and-paste support. To paste the text, you
    click the middle button in a different X application. For example, if you receive
    an e-mail containing a URL, you can select the URL with the left button and then
    click in your web browser’s “Location” field with the middle button to paste it
    in.'
