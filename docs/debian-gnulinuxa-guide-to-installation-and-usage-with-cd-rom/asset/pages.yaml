    # 1


    # Introduction


    We''re glad to have this opportunity to introduce you to Debian! As we begin our
    journey down the road of GNU/Linux, we''d like to first talk a bit about what
    exactly Debian is – what it does, and how it fits in with the vast world of Free
    Software. Then, we talk a bit about the phenomenon that is Free Software and what
    it means for Debian and you. Finally, we close the chapter with a bit of information
    about this book itself.


    # 1.1 What Is Debian?


    Debian is a free operating system (OS) for your computer. An operating system
    is the set of basic programs and utilities that make your computer run. At the
    core of an operating system is the kernel. The kernel is the most fundamental
    program on the computer: it does all the basic housekeeping and lets you start
    other programs. Debian uses the Linux kernel, a completely free piece of software
    started by Linus Torvalds and supported by thousands of programmers worldwide.
    A large part of'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'the basic tools fill out the operating system come from the GNU Project^1,
    and these tools are also free.


    Another facet of an operating system is application software: programs that help
    get work done, from editing documents to running a business to playing games to
    writing more software. Debian comes with more than 1,500 packages (precompiled
    software bundled up in a format for easy installation on your machine) — all for
    free.


    The Debian system is a bit like a pyramid. At the base is Linux. Next on top of
    that are all the basic tools, mostly from GNU. Next is all the application software
    that you run on the computer; many of these are from GNU. The Debian developers
    act as architects and coordinators — carefully organizing the system and fitting
    everything together into an integrated, stable operating system: Debian GNU/Linux.


    The design philosophy of GNU/Linux is to distribute its functionality into small,
    multipurpose parts. That way, you can easily achieve new functionality and features
    by combining the small parts (programs) in new ways. Debian is like an erector
    set: You can build all sorts of things with it.


    When you''re using an operating system, you want to minimize the amount of work
    you put into getting your job done. Debian supplies many tools that can help,
    but only if you know what these tools do. Spending an hour trying to work and
    then finally giving up isn''t very productive. This guide will teach you about
    the core tools that make up Debian: what tools to use in certain situations and
    how to tie these various tools together.


    # 1.1.1 Who Creates Debian?


    Debian is an all-volunteer Internet-based development project. There are hundreds
    of volunteers working on it. Most are in charge of a small number of software
    packages and are very familiar with the software they package.


    These volunteers work together by following a strict set of guidelines governing
    how packages are assembled. These guidelines are developed cooperatively in discussions
    on Internet mailing lists.


    +   1. http://www.gnu.org/'
  merge: -1
  pgno: 21
- img_proc: true
  md: +   ⁶ http://www.fsf.org/philosophy/shouldbefree.html
  merge: -1
  pgno: 22
- img_proc: true
  md: 'people have started calling Free Software “Open Source Software”; the two terms
    are interchangeable.


    You may wonder why people spend hours of their time writing software and carefully
    packaging it, only to give it all away. The answers are as varied as the people
    who contribute.


    Many believe in sharing information and having the freedom to cooperate with one
    another, and they feel that free software encourages this. A long tradition that
    upholds these values, sometimes called the Hacker Ethic, started in the 1950s.
    The Debian GNU/Linux Project was founded on these Free Software ethics of freedom,
    sharing, and cooperation.


    Others want to learn more about computers. More and more people are looking for
    ways to avoid the inflated price of proprietary software. A growing community
    contributes in appreciation for all the great free software they’ve received from
    others.


    Many in academia create free software to help get the results of their research
    into wider use. Businesses maintain free software so they can have no quicker
    way to get a new feature to implement yourself or hire a consultant to do! Business
    is also interested in greater reliability and the ability to choose between support
    vendors.


    Others still sees free software as a social good, democratizing access to information
    and preventing excessive centralization of the world’s information infrastructure.
    Of course, a lot of us just think we find it great.


    Debian is committed to free software that we thought it would be useful if it
    was formalized in a document of some sort. Our Social Contract promises that Debian
    will always be 100% free software. When you install a package from the Debian
    main distribution, you can be sure it meets our Free Software Guidelines.


    Although Debian believes in free software, there are cases where people want to
    put proprietary software on their machine. Whenever possible Debian will support
    this; though proprietary software is not included in the main distribution, it
    is sometimes available on the FTP site in the non-free directory, and there is
    a growing number of packages whose sole job is to install proprietary software
    we are not allowed to distribute ourselves.


    +   Note that the term “hacker” should not be confused with the term “cracker.”
    In short, a hacker is benevolent, whereas a cracker is generally considered malevolent.
    Movies and other forms of media many times incorrectly use the term “hacker” instead
    of “cracker.”


    +   http://www.debian.org/social_contract'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'It is important to distinguish commercial software from proprietary software.
    Proprietary software is non-free software; commercial software is sold for money.
    Debian permits commercial software, but not proprietary software, to be a part
    of the main distribution. Remember that the phrase “free software” does not refer
    to price; it is quite possible to sell free software. For more clarification of
    the terminology, see http://www.opensource.org/ or http://www.fsf.org/philosophy/categories.html.


    # # 1.4 About This Book


    This book is aimed at readers who are new to Debian GNU/Linux. It assumes no prior
    knowledge of GNU/Linux or other Unix-like systems, but it does assume very general
    knowledge about computers and hardware; you should know what the basic parts of
    a computer are, and what one might use a computer to.


    In general, this tutorial tries to help understand what happens inside a Debian
    system. The idea is to empower you to solve new problems and get the most out
    of your computer. There''s plenty of theory and fun facts thrown in with the “How
    To” aspects of the manual.


    We''d love to hear your comments about this book! You can reach the authors at
    debian-guide@complete.org. We''re especially interested in whether it was helpful
    to you and how we could make it better. Whether you have a comment or think this
    book is the greatest thing since sliced bread, please send us e-mail.


    Please do not send the authors technical questions about Debian, because there
    are other forums for that; see Appendix A on page 119 for more information on
    the documentation and getting help. Only send mail regarding the book itself to
    the address below.


    # # 1.4.1 How to Read This Book


    The best way to learn about any computer program is by using it. Most people find
    reading a book without using the program isn beneficial. The best way to learn
    about Unix and GNU/Linux is by using them. Use GNU/Linux for everything you can.
    Feel free to experiment!


    Debian isn''t as obvious as some other operating systems. You will probably end
    up reading at least the first few chapters of this book. GNU/Linux''s power and
    complexity make it difficult to approach at first, but far more rewarding in the
    long run.


    The suggested way to learn is to read a little, and then play a little. Keep playing
    until you''re comfortable with the concepts, and then skipping around in the book.
    You''ll find a variety of topics are covered,'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'some of which you might find interesting. After a while, you should feel confident
    enough to start using commands without knowing exactly what they do. This is a
    good thing.


    Tip: If you mistakenly type a command or don''t know how to exit a program, press
    CTRL-c (the Ctrl key and the lowercase letter c pressed simultaneously). This
    will often stop the program.


    # 1.4.2 Conventions


    Before going on, it''s important to be familiar with the typographical conventions
    used in this book.


    When you should simultaneously hold down multiple keys, a notation like CTRL-a
    will be used. This means “press the Ctrl key and press lowercase letter a.” Some
    keyboards have both Alt and Meta; most home computers have only Alt, but the Alt
    key behaves like a Meta key. If you have no Meta key, try the Alt key instead.


    Keys Alt and Meta are called modifier keys because they change the meaning of
    standard keys like the letter A. Sometimes you need to hold down more than one
    modifier; for example, Meta-Ctrl-a means to simultaneously press Meta, Ctrl, and
    lowercase a.


    Some keys have a special notation – for example, Ret (Return/Enter), Del (Delete
    or sometimes Backspace), Esc (Escape). These should be fairly self-explanatory.


    Spaces used instead of hyphens mean to press the keys in sequential order. For
    example, CTRL-x RET means to simultaneously type Ctrl and lowercase a, followed
    by the letter x, followed by pressing Return. (On sample sessions, this key is
    labeled Enter. Same key, different name.)


    In sample sessions, bold face text denotes characters typed by the user, italicized
    text denotes comments about a given part of the sample session, and all other
    text is output from entering a command. For shorter commands, you sometimes find
    that the command can be found within other text, highlighted with a monospaced
    font.'
