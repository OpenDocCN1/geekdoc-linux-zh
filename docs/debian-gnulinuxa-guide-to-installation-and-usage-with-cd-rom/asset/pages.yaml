    initialized one. Note that dbootstrap will not upgrade old system without destroying
    it. If you''re upgrading, Debian can usually upgrade itself, and you won''t need
    to use dbootstrap. The Debian 2.1 release notes contain upgrade instructions²


    If you are using old disk partitions that are not empty, i.e., if you want to
    just throw away what is on them, you should initialize them (which erases all
    files). Moreover, you must initialize any partitions that you created in the disk
    partitioning step. About the only reason to


