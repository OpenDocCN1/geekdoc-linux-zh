  md: '# Working with Text Files


    Text files are prevalent on a GNU/Linux system. They hold everything from documentation
    to configuration files. Fortunately, it''s easy to work with them.


    # 8.1 Viewing Text Files


    A text file is simply a file that happens to contain human-readable text. There''s
    nothing special about it otherwise. The other kind of file, a binary file, is
    meant to be interpreted by the computer.


    You can view either kind of file with the less pager if you have it installed
    (install it if you haven''t, it''s quite useful). less /etc/profile to view a
    sample text file. Notice that you can read the characters even if their meaning
    is obscure. less /bin/ls to view a binary file. As ls program is not meant to
    be read by humans.


    Sometimes, you''ll find files that end with .gz. These files may be viewed with
    zless; you can run it like so:


    ```

    zless /usr/doc/ae/changelog.Debian.gz

    ```'
