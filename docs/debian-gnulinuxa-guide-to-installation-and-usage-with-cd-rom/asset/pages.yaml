    Before continuing, you should know that there are actually two different kinds
    of filenames. Some of them begin with /, the root directory, such as /etc/profile.
    These are called absolute filenames because they refer to the same file no matter
    what current directory is. The other kind of filename is relative.


    Two directory names are used only in relative filenames: . and .. The . refers
    to the current directory, and .. is the parent directory. These are “shortcut”
    directories. They exist in every. Even the root directory has a parent directory
    – it’s its own parent!


    So filenames that include . or .. are relative. If I’m in /usr/bin and type ../etc,
    I’m referring to /usr/etc. If I’m in /var and type ../etc, I’m referring to /etc.
    Note that a filename without the root directory at the front implicitly has .
    at the front. So you can type local/bin, or /local/bin and it means the same thing.


