  md: '# Appendix A Reading Documentation and Getting Help


    +   - The Debian Documentation Project¹ has written some manuals.

    - The Debain support page² has a FAQ and other resources. You can also try the
    Linux web site³.


    The confusing variety of documentation sources exists for many reasons. For example,
    info is supposed to replace man, but man hasn''t disappeared yet. However, it''s
    nice to know that so much documentation exists! Where to look for help? Here are
    some suggestions:


    +   - Use the man pages and the --help or -h option to get a quick summary of
    a command''s syntax and options. Also use man if a program doesn''t yet have an
    info page.

    - Use info if a program has info documentation.

    - If neither of those work, look in /usr/doc/pathname has Debian-specific information,
    if there''s a man page or info page.

    - Use the HOWTOs for instructions on how to set up a particular thing or information
    on your particular hardware. For example, the Ethernet HOWTO has a wealth of information
    on Ethernet cards, and the PPP HOWTO explains in detail how to set up PPP.

    - Use the Debian Documentation Project manuals for conceptual explanations and
    Debian-specific information.

    - If all else fails, ask someone. See section A.1.3 on page 122.


    Using man pages is discussed above in section 5.1 on page 49. It''s very simple:
    press the space bar to go to the next page, and press q to quit reading. Using
    info, viewing files in /usr/doc, and asking for help from a person are all discussed
    in the remainder of this chapter.


    # A.1.1 Using info


    info is the GNU documentation viewer. Some programs provide documentationin info
    format, and you can use info to view that documentation. You can start up the
    viewer by simply typing info, or by supplying a topic as well:


    ```

    info emacs

    ```


    You can also bring up the information on info itself, which includes a tutorial,
    like so:


    +   - http://www.debian.org/~elphick/ddp/

    - http://www.debian.org/support/

    - http://www.linux.org/'
  merge: -1
