    # ## 3.17 Shadow Password Support


    Next, the system will ask whether you want to enable shadow passwords. This is
    an authentication system that makes your Linux system a bit secure. Therefore,
    we recommend that you enable shadow passwords. Reconfiguration of the shadow password
    system can also be done later with the shadowconfig program.


    # ## 3.18 Remove PCMCIA


    If you have no use for PCMCIA, you can choose to remove it at this point. This
    will make your startup cleaner; also, it will make it easier to replace your kernel
    (PCMCIA requires a lot of correlation between the version of the PCMCIA drivers,
    the kernel modules, and the kernel itself). In general, you will not need PCMCIA
    unless you''re using a laptop.


    # ## 3.19 Select and Install Profiles


    The system will now ask you if you want to use the pre-rolled software configurations
    offered by Debian. You can always choose package-by-package what you want to install
    on your new machine. This is the purpose of the dselect program, described below.
    But this can be a long task with the thousands of packages available in Debian!
    A task


    So, you have the ability to choose tasks or profiles instead. is work you do with
    the machine, as "Perl programming" or "HTML authorizing" or "Chinese word processing."
    You can choose several tasks. A profile is a category your machine will be a member
    of, such as "Network server" or "Personal workstation." Unlike with tasks, you
    can choose only one profile.


    To summarize, if you are in a hurry, choose one profile. If you have more time,
    choose the Custom profile and select a set of tasks. If you have plenty of time
    and very precise control on what is or is not installed, skip this step and use
    the full power of dselect.


    Soon, you will enter into dselect. If you selected tasks or profiles, remember
