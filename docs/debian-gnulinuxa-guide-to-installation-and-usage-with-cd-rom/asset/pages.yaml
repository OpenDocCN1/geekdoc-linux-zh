  md: '# # Logging In


    Your system is now installed! Pat yourself on the back for a job well done!

    Now it''s time to start using the system. In this chapter, we introduce you to
    the Debian command line, some security principles, and how to exit the system.
    In later chapters, we''ll go into more detail on these topics and introduce you
    to the Debian graphical interface, X11.


    # ## 4.1 First Steps


    After you quit dselect, you''ll be presented with the login: prompt.

    You can now log in using using the personal login and password you selected; your
    system is now ready to use. Let''s examine what it means to log in and how this
    process works.


    To use Debian, you must identify yourself to the system. This is so it knows who
    you are, what you have permission to do, and what your preferences are.


    To this end, you have a *username* or *login*. If you installed Debian yourself,
    you should have been asked to give such a name during installation. If you are
    logging on to a system administered by someone'
