    # # 12

    Removing and Installing Software


    This chapter describes ways of installing and removing software packages. There
    are several ways of doing both. Here we discuss installation and removal of pre-built
    software, such as Debian packages, and installation of source that must be built
    by you.


    # ## 12.1 What a Package Maintenance Utility Does


    An application or utility program usually involves quite a few files. It might
    include libraries, data files like game scenarios or icons, configuration files,
    manual pages, and documentation. When you install the program, you want to make
    sure you have all the files you need in the right places.


    You''d also like to be able to uninstall the program. When you uninstall, you
    want to be sure all the associated files are deleted. However, if a program still
    have on the system needs those files, you want to be sure you keep them.'
  merge: -1
  pgno: 120
- img_proc: true
  md: "# 104 Chapter 12 Removing and Installing Software\n\nFinally, you'd like able\
    \ to upgrade a program. When you upgrade, you want to delete obsolete files and\
    \ add new ones, without breaking any part of the system.\n\nThe Debian package\
    \ system solves these problems. It allows you to install, remove, and upgrade\
    \ software packages, which are neat little bundles containing the program files\
    \ and information that helps the computer manage them properly. Debian packages\
    \ have filenames in the extension .deb, and they're available on the FTP site\
    \ or on your Debian CD-ROM.\n\n# 12.2 dpkg\n\nThe simplest way to install a package\
    \ you've downloaded is with the command dpkg -i (short for dpkg --install). Say\
    \ you've downloaded the package icewm_0.8.12-1.deb and you'd like to install it.\
    \ First log on as root, and then type dpkg -i icewm_0.8.12-1.deb, and icewm version\
    \ 0.8.12 will be installed. If you already have an older version, dpkg will upgrade\
    \ rather than installing both versions at once.\n\nIf you want to remove a package,\
    \ you have two options. The first is most intuitive: dpkg -r (short for --remove).\
    \ This will remove the icewm package. Note that you give only the icewm for --remove,\
    \ whereas --install requires the entire .deb filename. \n\nA configuration file\
    \ is defined as any file you might have edited in order to customize the program\
    \ for your system or your preferences. This way, if you later reinstall the package,\
    \ you won't have to set everything up a second time.\n\nHowever, you might want\
    \ to erase the configuration files too, so dpkg provides a --purge option. dpkg\
    \ --purge icewm will permanently delete every file associated with the icewm package.\n\
    \n# 12.3 dselect\n\ndselect is a great front-end for dpkg. dselect provides a\
    \ menu interface for dpkg, and can automatically fetch the appropriate files from\
    \ a CD-ROM or Internet FTP site. For details on using dselect, see section 3.20\
    \ on page 34.\n\n# 12.4 Compiling Software\n\nMany programs come in source format,\
    \ often in tar.gz form. First, you must unpack the tar.gz file; for details on\
    \ doing this, see section 10.3.1"
