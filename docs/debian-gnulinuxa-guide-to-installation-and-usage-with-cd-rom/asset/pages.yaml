    the same system. Frankly, using virtual consoles is one of the simplest things
    about Debian: There are "hot keys" for switching among the consoles quickly. To
    try it, log in to your system and press Alt1-F2 (simultaneously press the left
    Alt key, and F2, that is, function key number 2).'
