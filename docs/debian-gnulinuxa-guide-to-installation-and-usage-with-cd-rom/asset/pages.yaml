    Lets you clean up after yourself. symlinks!removing


    # Device Files


    Device files refer to physical or virtual devices on your system, such as your
    hard disk, video card, screen, and keyboard. An example of a virtual device is
    the console, represented by /dev/console.


    There are kinds of devices:character and block. Character devices can be accessed
    one character at a time. Remember the smallest unit of data that can be written
    to or read from the device is a character (byte). Block devices must be accessed
    in larger units called blocks, which contain a number of characters. Your hard
    disk is a block device.


    You can read and write device files just as you can from other kinds of files,
    though the file may contain some strange incomprehensible-to-humans gibberish.
    Writing random data to these files is probably a bad idea. Sometimes it''s useful,
    though. For example, you can dump a postscript file into the printer device /dev/lpp0
    or send modem commands to the device file for the appropriate serial port.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '/dev/null /dev/null is a special device file that discards anything you write
    to it. If you don''t want something, throw it in /dev/null. It''s essentially
    a bottomless pit. If you read /dev/null, you''ll get an end-of-file (EOF) character
    immediately. /dev/zero is similar, except that you read from it you get the \0
    character (not the same as the number zero).


    # Named Pipes (FIFOs)


    A named pipe is a file that acts like a pipe. You put something into the file,
    and it comes out the other end. Thus it''s called a FIFO, or First-In-Out, because
    the first thing you put in the pipe is the first thing to come out the other end.


    If you write to a named pipe, the process that is writing to the pipe doesn''t
    terminate until the information being written is read from the pipe. If you read
    from a named pipe, the reading process waits until there''s something to read
    before terminating. The size of the pipe is always zero: It doesn''t store data,
    it just links two processes like the shell. However, because this pipe has a name,
    the two processes don''t have to be on the same command line or even be run by
    the same user.


    You can try it by doing the following:


    ```

    cd; mkfifo mypype

    ```


    Makes the pipe.


    ```

    echo "hello" > mypype &

    ```


    Puts a process in the background that tries to write “hello” to the pipe. Notice
    that the process doesn''t return from the background; it is waiting for someone
    to read from the pipe.


    ```

    cat mypype

    ```


    At this point, the echo process should return, because cat read from the pipe,
    and the cat process will print hello.


    ```

    rm mypype

    ```


    You can delete pipes just like any other file.


    # Sockets


    Sockets are similar to pipes, only they work over the network. This is how your
    computer does networking. You may have heard of “WinSock,” which is sockets for
    Windows.


    We won''t go into these further because you probably won''t have occasion to use
    them unless you''re programming. However, if you see a file marked with type son
    your computer, you know what it is.'
  merge: -1
