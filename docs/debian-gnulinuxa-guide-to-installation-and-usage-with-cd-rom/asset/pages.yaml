  md: '# Troubleshooting


    In Debian, as in life, things don''t always work as you might expect or want them
    to. While Debian has a well-deserved reputation for being rock-solid and stable,
    sometimes its reaction to your commands may be unexpected. Here, we try to shed
    some light on the most common problems that people encounter.


    # B.1 Common Difficulties


    This section provides some tips for handling some of the most frequently experienced
    difficulties users have encountered.


    # B.1.1 Working with Strangely-Named Files


    Occasionally, you may find that you have accidentally created a file that contains
    a character not normally found in a filename. Examples of this could include a
    space, a leading hyphen, or maybe a quotation mark. You may find that accessing,
    removing, or renaming these files can be difficult.


    Here are some tips to help you:'
  merge: -1
  pgno: 142
- img_proc: true
  md: "# 126 Appendix B Troubleshooting\n\n+   - Try enclosing the filename in single\
    \ quotation marks, like this:\n less ‘File With Spaces.txt’\n- Insert a ./ before\
    \ the filename:\n less './-a strange file.txt’\n- Use wildcards:\n less File?With?Spaces.txt\n\
    - Use a backslash before each unusual character:\n less File\\ With Spaces.txt\n\
    \n# B.1.2 Printing\n\nCommon source of trouble is the printing system in Debian.\
    \ Traditionally, Debian has been a powerful but complex aspect of Unix. However,\
    \ Debian makes it easier. An easy way to print is with the package called magicfilter.\
    \ magicfilter will ask you a few questions about your printer and then configure\
    \ it for you. If you are having troubles printing, give magicfilter a try.\n\n\
    # B.1.3 X Problems\n\nMany questions revolve around X. Here are some general tips\
    \ for things to try if you are having difficulties setting up the X window system:\n\
    \n+   - For mouse problems, run XF86Setup and try the PS/2, Microsoft, MouseSystems,\
    \ and Logitech options. Most mice will fit under one of these. Also, the device\
    \ for your mouse is /dev/psaux for PS/2 mice and a serial port such as /dev/ttyS0\
    \ for serial mice.\n- If you don't know which video chipset have, try running\
    \ SuperProbe; it can often figure this out for you.\n- If your screen doesn't\
    \ have a lot of color, try selecting a different video card or tell X how video\
    \ RAM you have.\n- If your screen goes blank or has unreadable text when you start\
    \ X, you probably selected an incorrect refresh rate. Go back to XF86Setup or\
    \ xf86config and double-check those settings.\n- xvidtune can help if the image\
    \ on the screen is shifted too far to the left or right, is too high or low, or\
    \ is too narrow or wide.\n- xdpyinfo can give information about a running X session.\n\
    - XF86Setup can set your default color depth.\n- You can select your default window\
    \ manager by editing /etc/X11/window-managers."
  merge: -1
