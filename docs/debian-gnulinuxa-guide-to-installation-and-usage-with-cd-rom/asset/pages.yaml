  md: 'Anything in brackets ([]) is an optional unit. In this case you don''t have
    to use the -M option, but if you do, you must use a path argument. You must use
    the -k option and the keyword argument. The ... means that you could have more
    of whatever came before it, so you could look up several keywords.


    Let''s look at one of the more complex descriptions from the manual page:


    ```

    man [-c|-w| -tZT device] [-adhu7V]

    [-m system,...] [-L locale] [-p string]

    [-M path] [-P pager] [-r prompt] [-S list]

    [-e extension] [[section] page ...]

    ```


    There''s no need to go through all of this (and don''t worry about what it means),
    but do pay attention to the organization of the description.


    First, clusters of options usually mean you can use one or more of them in different
    combinations, so -adhuV means you can also use -h. However, you can''t use all
    combinations; this description doesn''t make that. For example, -h is incompatible
    with other options, but you could man -du. Unfortunately, the description''s format
    does not make this clear.


    Second, the | symbol means "or." So you can use the -c, the -w, or the -tZT option,
    followed by a device argument.


    Third, notice that you can nest the brackets, because they indicate optional units.
    So if you have a section, you must also have a page, because e page is not optional
    within the [[section] page] unit.


    There''s no need to memorize any of this, just refer to this section as you read
    documentation.


    # 5.2 Files and Directories


    Files are a facility for storing and organizing information, analogous to paper
    documents. They''re organized into directories, which are called folders on some
    other systems. Let''s look at the organization of files on a Debian system:


    /A simple / represents the root directory. All other files and directories are
    contained in the root directory. If you are coming from the DOS/Windows world,
    / is very similar to C: for DOS, that is the root of the filesystem. A notable
    difference between DOS and Linux however, is that DOS keeps several filesystems:
    C: (first hard disk), A: (first floppy disk), and D: (either CD-ROM or second
    hard disk), whereas Linux has all its files organized above the same / root.'
