  md: 'You can scroll up to previous commands to run them again, or you can modify
    them slightly and then run them again. Try this: Enter any command, such as whoami;
    then press the Up Arrow key. The whoami command will reappear at the prompt. You
    can then press Enter to run whoami a second time.


    If you''ve entered several commands, you can keep pressing the Up Arrow key to
    go back through them. This feature is handy if you''re doing the same thing several
    times, or if you type a command incorrectly and want to go back to fix it. You
    can press the Down Arrow key to move in the other direction, toward your more
    recent commands. If there are no more commands to move, the computer will beep.


    You can also move around the command line with the Left and Right Arrow keys to
    make changes. The easiest way is trying whoami instead of whoami, and then use
    the Left Arrow key to move back to the s. You can erase the s with the Backspace
    or Delete keys.


    There are more advanced features as well (no need to memorize them all, though).
    Try pressing Ctrl-a moves you to the beginning of the line. Ctrl-k (the k stands
    for “kill”) deletes all characters until the end of the line; try it from the
    middle of the command line. Using Ctrl-a followed by Ctrl-k, you can delete the
    entire command line. Ctrl-y pastes the last thing you killed, reinserting it at
    the current cursor position (y stands for “yank,” as in “yank it back”). Ctrl-e
    moves the cursor to the end of the command line.


    Go ahead and play around with command-line editing to get a feel for it. Experiment.


    # 4.3 Working as Root


    Because Debian is a multiuser system, it''s designed to keep any one user or program
    from breaking the entire system. The kernel will not allow normal users to change
    important system files. This means that things stay the way they''re supposed
    to be, safe from accidents, viruses, and even malicious pranks. Unlike other operating
    systems, Debian is safe from these threats. You won''t need an anti-virus program.


    However, sometimes you need to change important system files; for example, you
    might want to install new software or configure your network connection. To do
    so, you have to have greater powers than a normal user; you must become the root
    user (also called the superuser).


    To become root, just log on with the username root and the root password; this
    was set during installation, as described in section 3.15 on page 32.'
