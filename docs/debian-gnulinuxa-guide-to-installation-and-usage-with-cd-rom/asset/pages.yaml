    the online manual for the whoami program (you may have to press the space bar
    to scroll through the documentation or press q to quit). A more complicated example
    is man -k PostScript. This command line has three parts. It begins with the command
    name, man. Then it has an option or switch, -k, followed by an argument, PostScript.
    Some people refer to everything except


