  md: '```

    chmod a+rwx firstlink

    ```


    Changes permissions on firstlink. Enter the command ls -l to confirm permissions
    on secondlink were also changed. This means that permissions information is stored
    in the inode, not in links.


    ```

    rm firstlink

    ```


    Deletes this link. This is a subtlety of rm. It really removes links, not files.
    Now type ls -l and notice that secondlink is still there. Also notice that the
    number of hard links for secondlink has been reduced to one.


    ```

    rm secondlink

    ```


    Deletes the other link. When there are no more links to a file, Linux deletes
    the file itself, that is, its inode.

    All files work like this - even special types of files such as devices (e.g. /dev/hda).

    A directory is simply a list of filenames and inode numbers, that is, when you
    create a hard link, you''re just adding a name-number pair to a directory. When
    you delete a file, you''re just removing a hard link from a directory.


    # 13.2.2 Types of Files


    One detail we''ve been concealing up to now is that the Linux kernel considers
    nearly everything to be a file. That includes directories and devices: They''re
    just special kinds of files.


    As you may remember, the first character of an ls -l display represents the type
    of the file. For an ordinary file, this will be simply -.

    Other possibilities include the following:


    +   directory

    lsymbolic link

    block device

    character device

    pnamed pipe

    socket


    # Symbolic Links


    Symbolic links (also called “symlinks” or “soft links”) are the other kind of
    link besides hard links. A symlink is a special file that “points to” a hard link
    on any mounted filesystem. When you try to read the contents of a symlink, it
    gives the contents of the file it''s pointing to rather'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# 112 Chapter 13 Advanced Topics


    the contents of the symlink itself. Because directories, devices, and other symlinks
    are types of files, you can point a symlink at any of those things.


    So a hard link is a filename and an inode number. A file is really an inode: a
    location on disk, file type, permissions mode, etc. A symlink is an inode that
    contains the name of a hard link. A symlink pairs one filename with a second filename,
    whereas a hard link pairs a filename with an inode number.


    All hard links to the same file have equal status. That is, as is good as another;
    if you perform any operation on one, it''s just the same as performing operation
    on any of the others. This is because hard links all refer to the same inode.
    Operations on symlinks, on the other hand, sometimes affect the symlink''s own
    inode (the one containing the name of a hard link) and sometimes affect the hard
    link being pointed to.


    There are a number of important differences between symlinks and hard links.


    Symlinks can cross filesystems. This is because they contain filenames, starting
    with the root directory, and all complete filenames are unique. Because hard links
    point to inode numbers, and inode numbers are unique only within a single filesystem,
    they would be ambiguous if the filesystem wasn''t known.


    You can make symlinks to directories, but you can''t make hard links to them.
    Each directory has hard links its listing in its parent directory, its entry,
    and the . entry in its subdirectories but to impose order on the filesystem, no
    hard links to directories are allowed. Consequently, the number of files in a
    directory is equal to the number of hard links to that directory minus (you subtract
    the directory''s name and the . link). comparinghard and symlinks You can only
    make a hard link to a file that exists, because there must be an inode number
    to refer to. However, you can make a symlink to any filename, whether or not there
    is actually such a filename.


    Removing a symlink removes only the link. It has no effect on the linked-file.
    Removing the only hard link to a file removes the file.


    Try this:


    ```

    ln -s /tmp/me MyTmp

    cd to your home directory. ln with the -s option makes a symbolic link

    - in this case, called MyTmp that points to the filename /tmp/me.

    ```


    ```

    ls -1 MyTmp

    ```


    Output should look like:


    ```

    lrwxrwxr-x 1 havoc havoc 7 Dec 6 12 MyTmp -> /tmp/me

    ```


    The date and user/group names will be different for you, of course. Notice that
    the file type is 1, indicating that this is a symbolic link. Also notice'
