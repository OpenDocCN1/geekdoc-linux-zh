- img_proc: true
  md: 'You can think of an absolute filename as a route from the base of the tree
    (/) to the end of some branch (a file). You’ll also hear people talk about the
    directory tree as if it were a family tree: Thus subdirectories are “parent,”
    and a path shows the complete ancestry of a file.


    There are also relative paths that begin somewhere other than the root directory.
    More on this later.


    No directory corresponds to a physical device, such as your hard disk. This differs
    from DOS and Windows, in which all paths begin with a device name as C:\ The directory
    tree is meant to be an abstraction of the physical hardware, so you can use the
    system without knowing what the hardware is. All your files could be on one disk
    – or you have 20 disks, some of them connected to a different computer elsewhere
    on the network. You can’t tell just by looking at the directory tree, and nearly
    all commands work just the same way no matter what physical device(s) your files
    are on.


    Don’t worry if all this isn’t completely clear yet. There are many examples to
    come.


    # 5.2.1 Using Files: A Tutorial


    To use your system, you’ll have to know how to create, move, rename, and delete
    files and directories. This section describes how to do so with the standard Debian
    commands.


    The best way to learn is to try things. As long as you aren’t root (and haven’t
    yet created any important personal files), you cannot mess up too seriously. Jump
    in – type each of these commands at the prompt and press Enter.


    ```

    pwd

    ```


    One directory is always considered the current working directory for the shell
    you’re using. You can view this directory with the pwd command, which stands for
    Print Working Directory. pwd prints the name of the directory you’re working in
    – probably /home/username.


    ```

    ls

    ```


    ls stands for “list,” as in “list files.” When you type ls, the system displays
    a list of all the files in your current working directory. If you’ve just installed
    Debian, your home directory may be empty. If your working directory is empty,
    ls produces no output, because there are no files to list.'
