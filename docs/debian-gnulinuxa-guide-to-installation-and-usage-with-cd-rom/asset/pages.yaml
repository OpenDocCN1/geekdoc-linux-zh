- img_proc: true
  md: '* /var/log/xdm-errors can contain useful information if you are having trouble
    getting xdm to start properly.


    As a reminder, try the XF86Setup or xf86config tools for configuring or reconfiguring
    X for your hardware.


    # B.2 Troubleshooting the Boot Process


    If you have problems during the boot process, such as the kernel hangs during
    the boot process, the kernel does not recognize peripherals you actually have,
    or drives are not recognized properly, the first things to check are the boot
    parameters. They can be found by pressing F1 when booting from the rescue disk.


    Often, problems can be solved by removing add-ons and peripherals and then booting
    again. Internal modems, sound cards, and Plug-n-Play devices are especially problematic.


    Tecras and other notebooks, and some non-portables fail to flush the cache when
    switching on the A20 gate, is provoked by zlImage kernels but by zlmage kernels.
    If your computer suffers from this problem, you will see a message during boot
    saying A20 gating failed. In this case, you''ll have to use the ''tecra'' boot
    images.


    If you still have problems, please submit a bug report. Send an email to submit@bugs.debian.org.
    You must include the following as the first lines of the email:


    +   * Package: boot-floppies

    * Version: version


    Make sure you fill in version with the version of the boot-floppies set that you
    used. If you don''t know the version, use the date you downloaded the floppies,
    and include the distribution you got them from (e.g., “stable” or “frozen”).


    You should also include the following information in your bug report:

    architecturei386

    modelyour general hardware vendor and model

    memoryamount of RAM

    scsiSSI host adapter, if any

    cd-romCD-ROM model and interface type, i.e., ATAPI

    network interface card, if any

    pcmciadetails of any PCMIA devices


    Depending on the nature of the bug, it might also be useful to report the disk
    model, the disk capacity, and the model of video card.'
  merge: -1
