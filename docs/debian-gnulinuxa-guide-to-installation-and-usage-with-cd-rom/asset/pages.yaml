    and “up” pages, corresponding nicely to the actions for the n, p, and u keys.


    # A.1.2 HOWTOs


    In addition to their books, the Linux Documentation Project has made a series
    of short documents describing how to set up particular aspects of GNU/Linux. For
    instance, the SCSI-HOWTO describes some of the complications of using a standard
    way of talking to devices with GNU/Linux. In general, the HOWTO have more specific
    information about particular hardware configurations and will be more up to date
    than this manual.


    There are Debian packages for the HOWTOs. doc-linux-text contains the various
    HOWTOs in text form; the doc-linux-html package contains the HOWTOs (surprise!)
    browsable HTML format. Note also that Debian has packaged translations of the
    HOWTOs in various languages that you may prefer if English is not your native
    language. Debian has packages for the German, French, Spanish, Italian, Japanese,
    Korean, Polish, Swedish and Chinese versions of the HOWTOs. These are usually
    available in the package doc-linux-languagecode, where languagecode is fr for
    French, for Spanish, if you''ve installed one of these, you should have them in
    /usr/doc/HOWTO. However, you may be able to find more recent versions on the Net
    at the LDP homepage⁴.


    > 4. http://metalab.unc.edu/LDP/'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# A.1.3 Personal Help


    The correct place to ask for help with Debian is the debian-user mailing list
    at debian-user@lists.debian.org. If you know how to use IRC (Internet Relay Chat),
    you can use the #debian channel on irc.debian.org. You can find general GNU/Linux
    help on comp.os.linux.* USENET hierarchy. It is also possible to hire paid consultants
    to provide guaranteed support services. The Debian website⁵ has more information
    on many of these resources.


    Again, please do not ask the authors of this book for help. You probably don''t
    know the answer to your specific problem anyway; if you mail debian-user, you
    will get higher-quality responses, and more quickly.


    Always be polite and an effort to help yourself by reading the documentation.
    Remember, Debian is a volunteer effort and people are doing you a favor by giving
    their time to help you. Many of them charge hundreds of dollars for the same services
    during the day.


    # Tips for asking questions


    +   * Read the obvious documentation first. Things like command options and what
    a command does will be covered there. This includes manpages and info documentation.

    * Check the HOWTO documents if your question is about setting up something such
    as PPP or Ethernet.

    * Try to be sure the answer isn''t in this book.

    * Don''t be afraid to ask, after you''ve made a basic effort to look it up.

    * Don''t be afraid to ask for conceptual explanations, advice, and other things
    not often found in the documentation.

    * Include any information that seems relevant. You''ll almost always want to mention
    the version of Debian you''re using. You may also want to mention the version
    of any pertinent packages: The command dpkg -1 packagename will tell you this.
    It''s also useful to say what you''ve tried so far and what happened. Please include
    the exact error messages, if any.

    * Don''t apologize for being new to Linux. There''s no reason everyone should
    be a GNU/Linux expert to use it, any more than everyone should be a mechanic to
    use a car.


    5. http://www.debian.org/'
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   Don''t post or mail in HTML. Some versions of Netscape and Internet Explorer
    will post in HTML rather than plain text. Most people will not even read these
    posts because the posts are difficult to read in most mail programs. There should
    be a setting somewhere in the preferences to disable HTML.


    +   Be polite. Remember that Debian is an all-volunteer effort, and anyone who
    helps you is doing so on his or her time out of kindness.


    +   Re-mail your question to the list if you''ve gotten no responses after several
    days. Perhaps there were lots of messages and it was overlooked. Or perhaps no
    one knows the answer if no one answers the second time, this is a good bet. You
    might want to try including more information the second time.


    +   Answer questions yourself when you know the answer. Debian depends on everyone
    doing his or her part. If you ask a question, and later on someone else asks the
    same question, you''ll know how to answer it. Do so!


    # A.1.4  Getting Information from the System


    When diagnosing problems or asking for help, you''ll need to get information about
    your system. Here are some ways to do so:


    +   Examine the files in /var/log.


    +   Examine the output of the dmesg command.


    +   Run uname -a.'
