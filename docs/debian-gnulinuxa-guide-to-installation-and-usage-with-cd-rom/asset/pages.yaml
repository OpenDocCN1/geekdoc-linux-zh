  md: '# Debian GNU/Linux


    Guide to Installation and Usage


    GNU/Linux has taken the computing world by storm. Discover for yourself people
    are flocking to GNU/Linux.


    This powerful operating system allows you to unlock the speed, versatility, and
    stability of your computers. With this book and the enclosed CD-ROM loaded with
    thousands of applications, you''ll be able to install the only GNU/Linux distribution
    maintained by more than 500 developers worldwide. The background information,
    discussions of concepts, and step-by-step tutorial examples will build familiarity
    with the GNU/Linux environment. With this book at your side, you are ready to
    step into the wonderful world of GNU/Linux.


    Debian GNU/Linux, contained on the CD-ROM bundled with this book, has thousands
    of applications ready to be use immediately. These programs cover everything from
    high-powered Internet and mail servers to programming and development to graphic
    design and gaming. And best of all, every program included in this CD-ROM is totally
    free!


    John Goerzen has a developer for Debian GNU/Linux for the past three years. Because
    free software has always been one of his interests, he is involved with several
    free software projects, including those outside circles. He currently works as
    a UNIX system administrator and developer for a regional ISP.


    Ossama Othman is a member of the Center for Distributed Computing at Washington
    University in St. Louis, Missouri, where he researches Real-Time CORBA with the
    Center''s CORBA request broker TAO. He is also an active member of the Debian
    GNU/Linux organization and contributes regularly to the Open Source community.


    If you''re getting started with Debian GNU/Linux, this book will


    Help you prepare your system for installing Debian GNU/Linux


    Walk you through the installation process step-by-step


    Explain how to use the package manager to install software from the thousands
    of titles included on the free CD-ROM


    Lead you through the software configuration


    Introduce you to the graphical X Windowing System


    Help you discover the power of the Open Source movement


    > Published under the GNU General Public License (GPL).


    A portion of the proceeds from the sale of this book will be donated to the Free
    Software Foundation (FSF).


    GNU/Linux $24.99 USA / $37.99 CAN Net UK


