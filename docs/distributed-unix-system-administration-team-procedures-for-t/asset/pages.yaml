- pgno: 112
  md: '# Printer Troubleshooting


    When your printer is not working, follow the systematic troubleshooting procedure
    that follows.


    +   1. Check the printer and make sure it is on. If so, then check to make sure
    it is online.

    2. Check the cable connections and make sure they are good.

    3. Reinitialize the spooler by turning it off and then back again.

    4. Check for any hardware errors, as out of paper, no toner, printer jam, unable

    to talk to server, etc. Follow the vendor guidelines for correcting the problem.

    5. Run lstat to check the status of the printer. If disabled, try to enable the
    printer.

    If print jobs are rejected, use accept on the printer to get it to accept print
    requests.

    6. Check your network connections to the printer if it is a network printer. If

    print jobs are going to work not printing or if printer status seems unpredictable
    after enabling the printer, a faulty network connection may be the culprit,

    even though cable connections to the printer look good.


    +   7. Check the printer configuration and make sure that the system recognizes
    the

    printer port. By sending some output to the printer device file. Send output

    directly to the device file using something cat testfile>/dev/

    printer_device, or stty to direct output for serial printers. Also try redirecting
    to a different port.

    8. Run ps command to look for print processes that may be in memory (use ps

    -ef | grep lp). Before killing these processes, first turn the problem printer(s)

    off and execute lpshut. After running lpshut, check the memory processes

    again. If lp processes are still trying to run in memory, then kill those processes.

    In a worst-case scenario, you may not be able to kill the processes even try

    ting to turn the printer off and on. You may need to reset your system so that
    all the

    processes in memory are reset. This would involve a shutdown to single-user

    mode and then a system restart to multi-user mode.


    +   9. If you were successful in removing errant processes, but the printer still
    does

    ot work, check the spooler directory for the SCHEDLOCK file. If it exists

    (because lpsched did not remove it), remove it. Then restart lpsched.

    10. Check that lpsched is included in your startup script with its full pathname,

    /usr/lib/lpsched. If it is missing or incorrect, add or correct it. If it is there

    the scheduler is not starting, check for the SCHEDLOCK file. On the line

    above /usr/lib/lpsched, enter


    ```

    rm -f /usr/spool/lp/SCHEDLOCK

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: '96 — Distributed UNIX System Administration


    Your shutdown script should also contain an absolute pathname call to lpshut.
    You do not have to add a SCHEDLOCK remove line here because lpshut is designed
    to remove the lock file when it executes properly.


    Other options available include checking ave native printer troubleshooting techniques
    as recommended for your specific flavor of UNIX or contacting the appropriate
    customer support group. For instance, you may be experiencing problems such as
    bad characters, extra line feeds, and so forth. If the troubleshooting procedures
    do not help, dig deeper for causes, which could include an incorrect interface
    script, a faulty device file for the printer, or a defective printer.


    # Preventive Maintenance of Hardware


    A large variety of hardware must be administered, monitored, and maintained in
    an enterprise-wide system that goes well beyond terminals and printers. Other
    common devices include hardware disks, tape backup units, CD-ROMs, Jukeboxes,
    RAID (redundant array of expensive disks) arrays, cabling boxes, transceivers,
    routers. The administrator must follow vendor instructions and obtain vendor support,
    if necessary, to properly integrate devices with a UNIX server or desktop.


    The hardware administration layer covers all aspects of a UNIX system. Physical
    security is required to keep hardware intact. Software configuration is needed
    to allow the hardware to run properly. Device errors can cause problems ranging
    from small ones that may irritate a user to catastrophic failures that can bring
    an entire system down.


    Incorporating preventive maintenance (PM) procedures on system hardware can save
    many headaches in the long run. Some PM procedures that should be seriously considered:


    +   - On a tape device, use a vendor-recommended cleaning/maintenance tape regularly
    to clean the drive. Dust and heavy use of a tape drive degrades the read/write
    capacity of the tape. If you are doing daily backups, cleaning the drives at least
    once a week is recommended.


    +   - Keep the physical environment of the servers ideal, well ventilated, and
    as dust free as possible. This area should also be secured, so that unauthorized
    users are not missing with the machines. How secure depends on how critical the
    equipment is to the organization.


    +   - Check cables on a regular basis. Moving hardware or moving around in a computer
    room can lead to accidental pulls on cables or other incidents that loosen cabling.
    Periodic checks will minimize the incidence of loose connections.


    +   - Check out all devices on a regular basis. Clean and do PM procedures on
    printers as recommended, reset modems, and check network connections. Note: The
    more often you check a device or connection, the less you need to check it. For
    instance, a'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'tape device may need weekly maintenance, but user network connections may only
    need annual checks.


    +   - Set up regular maintenance periods to take down servers to single-user mode
    and perform disk maintenance. Planned maintenance also allows you to restart the
    system and reinitialize devices, computer memory, and software.


    +   - Some administrators recommend completely powering off the server to clear
    out any unwanted variables when the system is brought down to level 0. At times
    on some systems, this may be necessary, depending on what the system is reporting,
    how long it would take to bring everything up from a cold start, and whether you
    need to transfer operations to a backup system before powering down.


    +   - Some devices, such as large optical jukeboxes, may be beyond the realm of
    the local system administrator or PM technician to maintain. If this is the case,
    it is a good idea to budget vendor support contracts to keep some of the unwieldy
    devices in good shape.


    +   - Have on the proper tools and some parts to support the environment. Tools
    may range from a simple set of screwdrivers to a good set of computer tools, cabling
    apparatus, and system diagnostic equipment. A good starter set of spare parts
    includes cables, connectors, cable converters, and network cards.


    +   - If you have a lot of cabling for the network system, it is imperative that
    you properly label the cable connections from the computer room out to the communication
    devices and wherever you have control of the cable. This will save countless hours
    of time in troubleshooting network problems, in case you need to actually trace
    the physical link between your server and a user connection. A good-quality cable
    tester is also essential to cable troubleshooting. In addition, if you have many
    peripherals, such as printers and modems, it is a good idea to label them as well.


    +   - Keep your systems clean, but be careful in the use of cleaning agents. Many
    manufacturers have cleaning supplies that will not harm the computer and have
    antistatic capabilities. Large regular detergents and cleaning solvents can damage
    or destroy some system, especially tape drives. As a minimum, lint-free wipes
    and isopropyl alcohol will serve you well. It may also be a good idea to have
    some canned air around to blow dust out of the computers.


    Overall, hardware maintenance takes extra time, but it is an extremely important
    function. Putting time into supporting the hardware reduces user frustration;
    the time you must spend on troubleshooting problems (i.e., the frustration of
    the system administrator); and hardware repair or replacement costs. It also increases
    system reliability.'
  merge: -1
  img_proc: true
