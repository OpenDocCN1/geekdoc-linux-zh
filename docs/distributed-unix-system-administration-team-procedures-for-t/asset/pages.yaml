- pgno: 64
  md: '# Chapter 3


    # Maintaining Access to Applications


    Applications are programs that make your system usable. They can range from UNIX
    daemons, which provide system services, to shell scripts. In many instances, the
    primary application may be a database system, such as Oracle, Informix, or Sybase,
    used to provide enterprise-wide solutions. These applications need maintenance.
    Depending on your organization and the role of the system administrator, you may
    have a separate database administrator, or the system administrator may also be
    expected to perform the database administration function. In all circumstances,
    the roles of system administrator and database administrator require a close level
    of cooperation.


    The system administrator is the human component of the man-machine interface (MMI).
    As such, the system administrator''s ability to maintain any application on a
    system by providing a working system to the end-user is crucial to fulfilling
    the role of the MMI. To contribute to the success of the MMI, the system administrator
    must make sure that the system is functional, reliable, and complete. That is,
    the system administrator makes sure that the system provides the tools to help
    users do their jobs, that the system does not routinely crash, and that the users
    have access to their tools and programs in a consistent manner.


    This chapter focuses on UNIX system administration from the perspective of software
    administration. It discusses the concept of process introduced in Chapter 1 in
    more detail, how to set up a UNIX environment, and how to optimize your UNIX system
    through the kernel. Finally, it touches on database administration, which can
    be a key focus of a UNIX system.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Processes\n\nApplications begin as a single process — a program, such as\
    \ a shell, that runs in memory on your system. When a command is invoked or a\
    \ request is made of the initial process, it creates a new process. For example,\
    \ the shell process creates the shell interface between UNIX and the user.\n\n\
    A new process is created by the original or parent process using the fork command\
    \ and so is considered \"forked\". The forked process is also known as a child\
    \ process. Forked processes, concurrent child processes, or processes in general\
    \ may also be referred to as threads. However technically, a thread is a running\
