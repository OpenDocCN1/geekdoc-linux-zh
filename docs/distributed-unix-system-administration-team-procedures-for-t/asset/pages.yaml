- pgno: 167
  md: '# 150 — Distributed UNIX System Administration


    A few notes on Table 8.2 concern implementation of these commands. First, executing
    find commands in a script through cron can automate much of the file checking.
    When writing the files to a directory, put them in a secure place and give privileges
    to root only, so that others may not view or modify the files. Second, to save
    the information and the results of these commands sent through mail i. Substitute
    mail root for > /file_path/filename.


    To categorize files written out, specify a date by setting up the script variable:


    ```

    LRGFILE = "/usr/admin/security/lrgf date +%am%md%d"

    ```


    | Table 8.2 Some incarnations of the find command. |

    | find command | Description |

    | find / -type f -size +1000 -print | xargs ls -1 lrgfiles | Finds files that
    are greater than 1,000 blocks and writes them to a filename starting from the
    root directory (/). Modify the block size accordingly. |

    | find / -name file -print -depth -exec rm {} \; | Finds a file with a specified
    name, with use of wildcard characters, and deletes starting from root. Other commands
    with the -exec increase the functionality of this statement. For some UNIX systems,
    -depth may be omitted. It is just a means to ensure subdirectories be searched.
    You may want to run this without -exec rm {} \; the first time to make sure you
    are not deleting files. |

    | find / -type d -size 10 -print -exec ls -1d b \; lrgdirs | Finds directories
    of more than 10 blocks and writes them to a filename (lrgdirs) starting from the
    root directory (/). Modify the block size accordingly; however, directory sizes
    in the double digit range can decrease performance. |

    | find / -name core -exec rm {} \; | Removes those pesky core files left after
    abnormal terminations. |'
  merge: -1
