    # Administer the Survey


    Theoretically, before beginning the hard work of creating the survey instrument,
    you must answer the question, "How will the survey be administered?” and "How
    will the data be analyzed? The answers guide your choices for formatting the physical
    product. If you have done the legwork suggested before designing and composing
    the survey and the survey is a physical product, it can be distributed to the
    target audience, the system administrators.


    System administrators are human beings. Therefore, you will need to solve the
    problem common to all surveys, achieving the highest possible response rate. This
    may not be a problem if the number of system administrators surveyed is small
    enough to allow personal contact. However, if the target group is too large for
    personal contact, you can increase response rate by providing advance publicity
    for the survey, making the experience as rewarding as possible, and following
    up after a period of time with a reminder to respond.


    Advanced publicity of taking the survey


    +   * The benefits of the survey

    * The purpose of the survey

    * Methods to be used for data collection and sampling

    * An overview of the contents

    * Reassurance that the survey will not be difficult to take

    * When it will be distributed

    * When results will be reported


    To make the survey experience as rewarding as possible, include a cover letter
    that repeats the messages in the advance publicity, emphasizing the importance
    of their participation, and thank the respondents in advance for their cooperation.
    In addition follow the guidelines for composing the questions by making the instrument
    interesting, convenient to take, nonthreatening, and physically attractive.'
