  md: 'The majority of the respondents were responsible for budgeting for equipment,
    procuring equipment, facility design, establishing procedures, and determining
    how automation resources were to be used. Within operations administration, 51
    percent of the sites scored 80 percent or higher on their operations matrix module.
    Overall, 41 percent of the assessed locations received a composite matrix value
    of 80 percent or greater. On, 14 percent received a value of 90 percent or above.
    On the other of the organization''s system administration spectrum, 16 percent
    of the sites received a composite matrix value under 70 percent. The under 70
    percent value for software administration was for 8 percent of the sites: 30 percent
    for hardware administration, 22 percent for security administration, 49 percent
    in network administration, and 11 percent in operations administration.


    # Implications


    The results of this ESA assessment indicate that from a systems-level perspective,
    the organization''s resources are at risk because the proper system administration
    practices are not followed in all locations of the enterprise. Managing the organization''s
    information systems has become the responsibility of the local system administrator
    with support provided by the company support centers. The model employed in this
    study was designed to show that personnel provide support to computer hardware,
    software, networks, security, and operations. The support of these systems provides
    to the organization''s users (i.e., clerks, management, support staff, etc.) and
    protects a significant corporate resource. The significance of that is that millions
    of dollars of information technology is used to control millions of dollars worth
    of information through the customer information base.


    The null hypothesis (H0) of this study stated that the organization''s systems
    are not at risk by providing adequate system administration practices to key administration
    procedures. In contrast, it was asserted that the assessed systems are at risk
    if administration procedures are neglected. To accept or reject the null hypothesis,
    the correlation of the major variables to the model matrix were examined.


    From the t-test, you can conclude that there is a difference between the matrix
    COMP value and the number of incorrect responses. The result indicates that the
    number of incorrect responses followed increases as COMP values decrease; thus,
    the null hypothesis is rejected and our assessment accepts the organization''s
    systems are at risk.


    You can also conclude through the assessment that known data processing standards
    are not followed by the organization. In particular, procedures recommended by
    the company during system administration training are primarily software practices
    to maintain the operating system and database. Low matrix scores are due to sites
    that are neglecting procedures to maintain their operating system, database, and
    other software applications. The significance of incorrect'
