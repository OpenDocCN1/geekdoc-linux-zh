  md: '24 — Distributed UNIX System Administration


    # Using an Editor


    An editor is a much-needed tool that gives the system administrator the ability
    to write and modify tools and utilities as needed. This section focuses solely
    on vi.

    To open an existing file or create a new file, the vi command is invoked:


    ```

    # vi filename

    ```


    In UNIX, everything is file based and files can be open in different modes. In
    the line


    ```

    # vi +n filename

    ```


    the letter n specifies the line number to go to the file you are opening. The
    line


    ```

    # vi +/(x) filename

    ```


    opens a file at the last line of the file. The line


    ```

    # vi -r filename

    ```


    opens to a specified string {x} in the file. The line


    ```

    # vi -R filename

    ```


    opens the last changes made to a file. Finally, the -R option, as in


    ```

    # view filename

    ```


    opens the file for read-only mode. Read-only mode is also accomplished by

    To learn more about the vi editor, see Appendix D, Using the vi Editor.


    # Summary


    This chapter presented many of the fundamentals of beginning UNIX administration.

    A system overview discussed how the shell controls all user access to the system,

    introduced the concept of a process and how it differs from a program, and discussed

    methods of controlling access through the use of passwords and IDs.'
