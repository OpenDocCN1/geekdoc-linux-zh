- pgno: 89
  md: '# 72 — Distributed UNIX System Administration


    allowing the kernel to communicate with that type of device. The minor number
    specifies this particular piece of hardware special file accesses, such as a disk-controller.
    In the case of serial devices, the minor number specifies the port of the device.

    The major number allows you to group devices. With a major number of 1 refer to
    hard disks (hd), and major numbers of 2 are floppy disks (fd). TTYs have a major
    number of 19, and their number refers to the actual port of the device,


    ```

    crw-rw-rw- 1 root other 19, 124 Apr 15 1994 tty004

    ```


    means that this TTY''s special file is a character file, unlike other TTYs with
    a major number of 19; has read and write permissions for all; and connects to
    serial port 124. Be aware that major/minor numbers are highly system specific.

    The variants of UNIX derived from System V using naming conventions to specify
    hard disks and their associated special files; for example, ccontroller numberdrivesnumbersegment(or
    partition) number. The naming convention depends on the UNIX implementation. A
    device with /dev/disk/c0d1 is a special block file for the second partition on
    the second disk of the first controller. (Note: numbering starts at 0 and 1.)

    Partition numbers (s) have a defined convention, as shown in the table below.
    In some UNIX flavors the partition is replaced with a lowercase letter, such as,
    a, b, c, d. Some partitions may not be used.


    | Partition description | s |

    |---|---|

    | swap partition | 1 |

    | user file systems | 2 |

    | kernel file system mount | 3 |

    | the entire disk | 6 |

    | boot partition | 7 |

    | for the /var file system | 8 |

    | for the /var file system | 9 |


    The swap partition listed above is used for virtual memory; that is, holding information
    from memory on a disk when the memory available is insufficient. The user file
    systems partition is used to make space available for users and directories.


    # Special-Purpose Device Files


    Certain special files in the /dev directory have a specific purpose and meaning.
    Some of the files you may encounter are /dev/console, /dev/mem, /dev/kmem, and
    /dev/null. /dev/console, usually a monitor, is a character device'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'with write permissions for the main system console. The files /dev/syscon and
    /dev/systty are associated with /dev/console. All three files have the same major
    and minor numbers and consequently refer to the same device driver. Permissions
    to syscon and systty are both read and write for root and superuser group such
    as adm, but read-only for other users. The special file /dev/systty points to
    the actual hardware port of the console, whereas syscon refers to a virtual console.
    (Note: syscon and systty are not present in all systems.)


    The /dev/mem and /dev/kmem files are special files that contain memory maps. /dev/mem
    maps the physical memory and /dev/kmem maps the kernel virtual memory. Driver
    programs can be written to access and use these memory areas, but they are few,
    limited, and beyond the scope of this book.


    The special file /dev/null, a very useful character, serves as a bucket to dump
    unwanted bits. By directing output to this file, you can get rid of unwanted bits
    and still be able to use the file. For instance, if you verify a tape but do not
    write the contents of the tape you direct the output to /dev/null.


    Other-purpose file types in /dev are listed in Table 4.1. /dev/ may also contain
    symbolic links to devices that aid the system administrator and user connecting
    to the proper device. A symbolic link is created using the link command, allowing
    the administrator to give a device any name desired in order to make the use of
    a device more manageable. For instance, if /dev/rt0p0 refers to a tape device
    and you create a link and call the file tape, link points to the special file
    of the real tape device.


    # ### Table 4.1 Other device filenames and descriptions.


    | Special filename (/dev) | Description |

    |---|---|

    | mtn | Tape device |

    | pts/[number] | Also used for virtual terminals |

    | win[number] | Window device (SunOS) |

    | mouse | Mouse device |

    | ram[number] | RAM disk |

    | swap | Swap device |

    | [*]stn | SCSI tape device (SunOS) |'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Special-Purpose /dev Subdirectories


    In addition to special device files, /dev usually contains some special subdirectories.
    The hard disks on a system require both block device files, which allow the kernel
    to buffer the data passed by their device drivers, and character device files,
    which allow the device file to pass data a byte at a time. Therefore, two important
    special-purpose subdirectories are /dev/disk, which contains the block device
    files for the hard disks on the system, and /dev/rdsk, which contains the character
    device files for those hard disks.


    A listing of /dev/rdsk may look like


    ```

    brw------ 2 root sys 0,0 Feb 28 1994 0s0

    ```


    or


    ```

    brw-r-- 1 root sys 0,18 Jul 4 1994 1s0

    ```


    In the first line above, note that the device filename is 0so, naming the first
    disk on the first controller. Other file systems on this disk would be labeled
    0s1 (second partition on the first controller), 0s2 (third partition on the first
    controller), and so on. In the second line, the filename is 1s0, the first partition
    on the second controller. Because the special block files here are going to access
    a hardware device, they are not pointing directly to the disk hard, but rather
    to the controller.

    /dev/rdsk (r stands for raw) houses the character device files that allow the
    hard disks on the system to communicate with devices and programs that require
    character-based, or raw, I/O for better performance. UNIX maintains a file system,
    inodes for each file, and handles I/O in blocks. Removing this by creating a gateway
    that allows UNIX to pass data directly to the executing program without processing
    performance.


    For example, the many major database engines require UNIX and recommend that raw
    devices be set up to I/O to the database. The database resides on a raw disk partition,
    and the most efficient way to access the data is through the database utilities
    where the reads and writes to the file are controlled directly by the database
    environment, rather than UNIX. The database may run perfectly well using a standard
    disk device, but as the database grows, performance degrades because UNIX must
    track the disk space consumed by the data file. Setting up a raw disk device for
    a database on a raw disk partition removes the redundancy of having UNIX track
    its data file space, improving performance.


    For another example, if the application is to disk striping (an implementation
    where data is spread across multiple disks), the raw disk device will support
    the'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Communicating With Peripheral Devices — 75


    hardware that accomplishes this task and once again avoid some of the overhead
    of the typical UNIX I/O process.


    As an alternative to view a raw disk device, the dd command could be used. The
    dd command, with I/O directed toward the raw device, can look at the raw disk
    space. However, caution should be used here, the dd command cannot replace the
    integrity checks used by a database application. Using it while the database is
    up could potentially corrupt raw disk space being read by the database.


    # Creating Special Files


    For the most part, special files do not need to be created on a regular basis.
    Creating special files and installing new devices require the mknod command, which
    can only be executed by the superuser. You can execute mknod anywhere in a system,
    but to keep the system manageable, keep devices in the /dev directory. From the
    /dev directory, the proper syntax is


    ```

    # mknod filename devicetype (c|b) major number, minor number

    ```


    When this command is complete, the new device is created in the /dev directory.
    Give the new device a filename that is not already in use. Assign the devicetype
    c to a character device or b to a block device. Specify the major number depending
    on the type of device, and enter the minor number of the particular peripheral
    new special file accesses, or in the case of a TTY device, the port of the device.


    Some of this information can be gathered by a look at the last device of similar
    type. For example, back in the abbreviated /dev listing, the last TTY line printed
    was


    ```

    crw-rw-rw- 1 root  other  19, 130 Apr 15 1994 tty010

    ```


    To create another device file similar to this, enter


    ```

    # mknod tty010 c 19 131

    ```


    In this example, the previous filename was tty010 so the new filename tty011 is
    the next in the series. To assign the same device add a c. The major number for
    a TTY remains 19, and the minor number is the next in the series, 131. When complete,
    use a list command (i.e., ls -1) to confirm that the file is created and that
    the proper permissions are set. (TTYs are discussed more fully in the next chapter.)


    ![](img/8f8a5b924793524d71746c72ac703b14_92_0.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 76 — Distributed UNIX System Administration


    Some systems make creating a device file simpler by providing a makedev or mkdev
    utility. This utility looks for the appropriate numbers and type to assign to
    the named device. The execution of mkdev tape would create a special file for
    a tape drive called tape.


    # Hazards to Avoid


    The /dev directory is very critical to the operation of a UNIX system. Any time
    a device is accessed, a file in this directory is used. Avoid the mistake of incorrectly
    outputing to a regular file in the /dev directory. For instance, to copy a file
    from your home directory to tape, the proper syntax using cpio is


    ```

    # ls filename | cpio -ocvB > /dev/tape

    ```


    But if, instead, you enter:


    ```

    # ls filename | cpio -ocvB > /dev/tapw

    ```


    you would be writing to the regular file tapw in the device directory rather than
    to the tape device tape. If this occurs for a large file, large number of files,
    or during a system backup, the regular file would grow, the root file system would
    fill up, and the system would degrade. In some cases, a system crash can occur
    where the errant file has filled the root file system, leaving no room for paging,
    temporary storage, or other I/O functions. As a result, system resources are consumed,
    new processes are unable to start, and the system become unresponsive. Consequently,
    this process must be killed, the errant file removed, and the process that wrote
    to /dev corrected.


    Such errant files in /dev are not always large. To avoid problems, check this
    directory on a regular basis and keep a backup of it in case of emergencies. To
    perform a check, for instance, you could create a file containing the contents
    of /dev every time you make a change and keep this file in a secure location.
    Running


    ```

    # ls -1 > /usr/admin/devchk/082796dev

    ```


    from the /dev directory creates a dated 082796dev in a directory called devchk,
    which was created to store these files. Routinely, you could execute the same
    process, manually or automatically, creating a file with a different name, then
    run the diff utility with the dated file stored in devchk. Abnormalities could
    then be observed and compared against a master list, allowing you to remove unwanted
    files. To find regular files in /dev enter'
  merge: -1
  img_proc: true
- pgno: 94
  md: '```

    # cd /dev

    # find -print | grep "^\_"

    ```


    This finds all files in /dev and sends them to grep, which prints all lines that
    start with an underscore (_), indicating a regular file. You can then go back
    and remove undesirables.


    Also, if you experience an unresponsive system crash and don''t have the latest
    backup to recreate your /dev directory, it doesn''t hurt to keep a hardcopy around
    in case you have to rebuild by. Because of the large size of some /dev directories,
    this may seem impractical, so be sure to keep a tape backup around, too. If you
    reset your tape isn''t the latest, the hardcopy can be used to make corrections
    in order to reset your system to the last good /dev configuration.


    When looking through the /dev directory, be aware of the native syntax used by
    the operating system or the setup created by a previous system administrator.
    Not everything will follow convention, either by design or intervention. For example,
    it is possible to call all TTYs for console rather than TTS. Likewise, file system
    naming conventions may not follow those established for the operating system.
    To avoid a lot of sleepless nights, your best to keep your system within the naming
    conventions for files and devices used natively by the operating system (i.e.,
    your defaults from the initial install) and by your organization. This will improve
    system maintenance and device troubleshooting.


    # Summary


    Device special files are a core feature of the UNIX operating system. These files
    manage I/O in all of its forms. Even the pipe operation (|) is a special file
    controlled by the operating system. The administration and management of these
    files is crucial for maintaining the network, monitors, printers, floppy drives,
    hard drives, and any device attached to a system. This undoubtedly adds to the
    complexity of managing a UNIX system, but it also gives you the flexibility to
    assume control. Simply using the proper permissions on a device file can restrict
    usage for a specific device by owner, group, or the world. Improperly configured
    device files lead to low system reliability and increased risk to system security.'
  merge: -1
