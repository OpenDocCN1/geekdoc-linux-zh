    Test modem connections on a periodic basis, or for more security, implement a
    callback feature to unsuccessful logins, have the phone company prevent third-party
    billing to the line, or get a leased line if dial-out is restricted to a single
    source. |

    | Shell escapes | Many programs allow the user to escape to a shell by using !
    or ~. If shell access is to be denied, then access to a shell-escapable utility
    must be prevented or access to the service denied. For instance, a user denied
    access may be given the vi utility to create, write, or modify files. It would
    be entirely possible for the vi user to drop to the shell using !.'
