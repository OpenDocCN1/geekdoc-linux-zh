- pgno: 211
  md: '# 194 — Distributed UNIX System Administration


    The prominent feature of the matrix is that all aspects of required system administrative
    practices are included in modules 4 and 5, security administration and operations
    administration. Security relates to the reliability, integrity, and availability
    of the system and therefore pertains to the physical environment of the system,
    the type of system used, and access and controls to the hardware and software.
    The integration of these properties qualifies in a computer security plan and
    a disaster recovery plan.


    Software administration (Module 1) pertains to the maintenance of all software
    on the system. This includes the UNIX operating system and the BrandX database
    applications. System files and database backups are necessary to ensure the integrity
    and availability of data. Restore procedures ensure that this data can be put
    back into a system if the system is corrupted or deleted and must be tested. In
    the UNIX world, utilities such as cpio and tar are used to backup and restore
    files and directories. BrandX database administrators use the BrandX dbback utility
    for database backups and restdb for database restores. In addition, the operating
    system provides the necessary services to connect peripheral devices, run processes,
    create and delete files, and tune system parameters that allow the software to
    interact with the hardware and the user. BrandX database provide a means to check
    the status of the database, manipulate database environment variables, enable
    database security, and use features to rebuild damaged database entities such
    as b-tree indices and hash tables.


    Hardware administration (Module 2) requires that the system administrator understand
    the components of the system, how those components are interconnected, and how
    to diagnose hardware problems. The ability to troubleshoot a system enables the
    system administrator to quickly respond to crashes or the unavailability of a
    system component. In addition, the system administrator must also know who to
    contact for service and support when the resources at hand are inadequate to solve
    the hardware problem.


    Network administration (Module 3) is closely connected to all other modules of
    the system. Networks can be viewed as peripheral to a system or as a system unto
    themselves. Nonetheless, networks are an area of major concern requiring their
    own particular band systems support. Networks deliver communications services
    that can range from a simple two-node LAN to a large-scale network environment.
    In the assessed environment, networking issues may range from the simple 9,600bps
    shorthaul connections to LAN and WAN technologies.


    # Design a Survey


    The actual implementation of procedures outlined in the model can vary with the
    physical locations of the organization. Therefore, the model must include specific
    tasks and practices dictated by the organization''s particular information systems
    environment. You identify these variations with the survey instrument used to
    make the'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Implementing a System Administration Matrix — 195


    ESA. The survey tests the availability of a service (a service being any service
    task provided by a systems administrator) and determines the status of the enterprise-wide
    information system as it relates to the established model.


    # Planning


    Entire books are written about survey design and questionnaire construction, but
    some guidelines are common to all. An effective survey must have an objective
    and a goal; that is, you must know why you need it and what you need to learn
    from it. In the case of the initial survey, you need the survey of system administration
    practices to establish a baseline of activities that can act as a benchmark against
    which improvements can be measured. In addition, you need to identify the variations
    between the current system administration practices and the ideal model. Later
    surveys will be to learn whether a course of action resulted in improvement over
    the previous assessment and to identify variation from the ideal model.


    In addition to the objective and goal, before designing the survey you must know:


    +   * What will be done with the information after it is collected and analyzed?


    +   * What is the target group?




    Only the intended audience for the survey, experienced system administrators,
    can give valid responses to the questions. Experienced system administrators have
    the knowledge necessary to conduct a valid assessment with sufficient scope and
    representation of the content area.


    +   * Will the entire group be surveyed or a sample of the group?


    Sample only when circumstances prevent a complete census. Circumstances preventing
    a complete census can include complexity of the assessment instrument, data collection
    method, geographical location of the system administrators, limited time frame,
    or limited budget. When sampling, use a methodology that produces a representative
    sample of the target group.


    +   * How will the data be collected?


    A survey delivered and returned by e-mail, for example, has different design requirements
    than one administered over a browser-based form delivered on an intranet Web site.
    The answer to this question will affect the design of the physical product.


    +   * How will the data be analyzed?


    Again, the answer will affect the design of the physical product.


    ![](img/8f8a5b924793524d71746c72ac703b14_212_0.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Answering these questions before designing the survey can save time and effort
    and result in an assessment tool that provides a more accurate picture of the
    system administration needs of the enterprise.


    # Composing the Questionnaire


    The questions needed to assess enterprise system administration support, although
    numerous, are not complicated. They require no opinions, only the special knowledge
    of the system administrators. They ask what technology is in use, what services
    are offered, and how often these services are rendered. The checklist-type questionnaire
    can be effective for gathering the information needed for the assessment. The
    challenge when composing the questions is ensuring their usefulness and completeness.


    Each question must support the objective and goal of the survey; that is, it must
    provide information useful in establishing the baseline of system administration
    practices or help identify variations from the model. Each question must be worded
    to gather a specific piece of information or related pieces. For example, the
    question "How do you feel about the quality of the servers at company XYZ?" would
    elicit quantifiable data useful for assessing the risk of network hardware failure,
    even if a checklist of possible answers were provided. Although the above answer
    might contribute to a measure of system administrator satisfaction, it does not
    support the objective of establishing a baseline of practices or the goal of identifying
    variations from the ideal. Questions such as "How many hours of unscheduled downtime
    do you experience each month?" along with a checklist of ranges provides quantities
    that can reveal whether or not a vulnerability exists in that area. It supports
    the objective of establishing a baseline (company XYZ routinely experiences x
    hours of unscheduled downtime), and it identifies a variation from the model (the
    model experiences y hours of unscheduled downtime).


    The questions on the survey must be complete; that is, they must solicit all the
    information needed to make an accurate assessment of the enterprise. Without a
    complete picture of the system administration function within the enterprise,
    the final assessment of risk can be dangerously wrong or, at best, misleading.


    You may want to compose a document that gives background information on the assessment
    questions, such as the objective of the question, examples of compliance, or a
    sample response. The background document provides a system administrator or system
    manager with a common reference. It helps them to understand the meaning of a
    question and whether or not the system complies. It also helps to identify associated
    areas in which the system does or not comply. This can vary between environments,
    so it is up to the organization to implement a standardized assessment. If assessment
    and risk analysis is already in place, you can break your assessment into the
    appropriate data format for SAmatrix.


    You can adapt the survey to a particular environment, such as non-UNIX, but it
    must be made relevant to the organization''s needs and the technology it uses.
    It must be at'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Implementing a System Administration Matrix — 197


    least detailed and in-depth as the one presented in this chapter to adequately
    provide meaningful results, useful for establishing a level of system administration
    performance and expected practice. The survey provided assumes that an organization
    may have rather homogeneous applications running in a distributed enterprise-wide
    environment.


    System administrators are human beings. When formulating questions, consider the
    needs of the people you are asking to answer the questions. To motivate these
    human beings to willingly complete the survey, the questions must be interesting,
    convenient to answer, nonthreatening, and attractively formatted. Support by upper
