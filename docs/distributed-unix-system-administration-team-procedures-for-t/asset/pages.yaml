- pgno: 308
  md: '# Appendix E


    # UNIX Shell Script

    Construction


    # Introduction


    The UNIX shell interprets commands that are entered on a command line or through
    a program called a script. Shell scripts are text files created with an editor.
    Because the text in a shell script is filled with commands and program controls,
    it becomes an executable that is interpreted by the shell. Shell scripts that
    work in one shell, such as Bourne, may not be executable in another, such as Korn
    unless you make modifications. This tutorial focuses on Bourne shell scripts.


    This appendix is intended to give the user an overview of shell scripting, which
    provides robust system utilities that can automate tasks, improve system utilization,
    and support applications. It is very similar to C programming. Note that shell
    scripts are not compiled but are interpreted by the operating system at run time.
    Critical shell scripts should be assigned the proper permissions to prevent unauthorized
    users from changing script contents.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Creating a Simple Script


    This section describes how to create a simple shell script that finds files that
    begin with the letters a-i (note the lowercase); it will not find files beginning
    with A-I), with the otherwise similar name plane. The script begins its search
    at the root (/) directory.

    Create the simple script below by entering vi filename at the prompt and typing:


    ```

    #This shell script is a sample to

    #illustrate the creation of an executable

    #!/bin/sh

    find /name [a-i]plane -print

    ```


    Commands in a shell do not execute if they are not in the search path. The explicit
    path for a command can also be specified. Put a PATH statement in the script as
    follows:


    ```

    #This shell script is a sample to

    #illustrate the creation of an executable

    #!/bin/sh

    PATH=/usr/bin:/bin; export PATH #The search path

    find / -name [a-i]plane -print

    ```


    To exit vi and save the file, enter :wq


    By convention, !/bin/sh indicates that this is a Bourne shell program by specifying
    the interpreter being used. Specifying the interpreter is not required but improves
    readability and understanding of the content of the script in terms of how it
    will be executed. The PATH statement sets a path variable and is exported to the
    shell interpreter; the semicolon;) is used to delimit commands on the same line,
    so PATH=/usr/bin:/bin; export PATH is actually two command statements. The first
    statement PATH=/usr/bin:/bin assigns the path, and the second statement, export
    PATH, obviously does export the function.


    # Checking Inputs and Exit Status


    A shell script should always validate arguments being passed, if any. Arguments
    passed can include parameters such as options and filenames. For instance, the
    command ls -l fun* actually contains three arguments. The first is ls, the filename
    of the command to execute. The second is -l. The third is fun*, checking for words
    beginning with fun followed by any characters.'
  merge: -1
  img_proc: true
