    a value to the record to indicate that a procedure for the additional module(s)
    is in place and enforced. In the above example, the question is also an operations
    issue. To show compliance in both the hardware and operations modules, the record
    will look like:


    +   ---Data Record Showing Hardware and Operations Compliance---

    Are server resources monitored periodically and often?

    H0

    0

    1

    0

    1


    # 4.2. Adding a Record


    On the menu bar, select Edit/Add Entry. Smatrix displays the Module Edit screen.

    In the field labeled Assessment, enter the assessment question. The length is
    limited to the field provided. Longer questions must be reworded or possibly broken
    up into two or more assessment questions. Assessment questions should be written
    to indicate that a 1 shows compliance and a 0 shows noncompliance. Negatives should
    be avoided. For more information on formulating an assessment question, see Chapter
    11.


    Press the Tab key to advance to the next field or click on the field labeled Module
    Data. Enter the module to which the assessment question is assigned, usually the
    module on which it has the greatest impact. In general, questions relating to
    applications, databases, operating systems are assigned to the Software Module
    (S); installing hardware, hardware maintenance, etc., are assigned to the Hardware
    Module (H); network operating systems, protocols, and network administration are
    assigned to the Network Module (N); access, passwords, physical security, and
    other security issues are assigned to the Security Module (C); and general procedures,
    enforcement of procedures, system administration issues, and user satisfaction
    are assigned to the Operations Module (O). The Module Data field will only accept
    the letters in the legend.


    Press the Tab key or click on the first Admin Data field. Enter a 1 for Compliance
    or a 0 for Noncompliance. Press Tab to advance or click on the next box and enter
    the appropriate number until all Admin Data fields are complete. Admin Data fields,
    also called compliance data or assessment data, will only accept 1 or 0.'
