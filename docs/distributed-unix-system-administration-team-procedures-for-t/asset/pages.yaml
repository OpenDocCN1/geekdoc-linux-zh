- pgno: 40
  md: 'used to section off the file in order to display administrative functions,
    system func-tions, security functions, etc., for better maintenance of the file.


    To activate a cron file, use the crontab command. For example, you could start
    a cron file with the name admcron


    ```

    #crontab admcron

    ```


    This will load the file and activate admcron. If it does not load and you receive
    an error message, you probably already have a cron file running. This active cron
    file can be unloaded using the -r option with crontab as noted above (crontab
    -r). Then the crontab must be reloaded. It is best to check if you have a cron
    file active using crontab -l before trying to load a new file.


    The system administrator can control cron access and record cron activity. In
    /usr/lib/cron directory, you can create the files cron.allow and cron.deny. In
    these files, you can log-in names of users who are allowed cron access in the
    file and those restricted in the deny file. To cut down on maintaining these files,
    the administrator can simplify matters by entering only users allowed in cron.allow
    and not use the cron.deny file. It should be noted that cron.allow and cron.deny
    are not necessary, nor are they dependent on each other. The absence of both of
    these files will allow only access to cron, or if cron.allow is absent and an
    empty cron.deny is present, all users may have access to cron.


    For cron to log cron activity to a file, change directory to /etc/default and
    create a log file called cron by entering the variable CRLOG=yes in the file and
    then saving it. If the cron log file already exists, edit the existing file using
    the vi editor. You will have to reboot your system, but your /usr/lib/cron/log
    will now be active. With a lot of cron activity, this file can get quite large,
    so it is imperative that it is monitored. When it gets too large, you can zero
    out the file by entering


    ```

    # > /usr/lib/cron/log

    ```


    Note that the > (greater than) symbol is a redirection operator. In this case,
    you are redirecting nothing to the file, and it will be overwritten by a file
    with the same name (i.e., log). If you use the >> symbol, you append to the file.
    For example, the command line


    ```

    # cat log.old >>

    ```


    would append the log file.old to the file log. Of course, the first time this
    is done log is empty, and when the operation is complete, the files are equivalent
    in content. Note: Redirection is a very powerful means to move and save data and
    manipulate files. For additional information, see Appendix E, UNIX Shell Script
    Construction.'
