- pgno: 201
  md: '# 184 — Distributed UNIX System Administration


    Here is an example of a crash report form.


    # CRASH REPORT


    This report is to be completed whenever system-wide downtime is noted. A complete
    system crash refers to a complete failure such as a CPU crash. A partial crash
    is the unavailability of a support system such as communications.


    Machine Name:________________________________________________________________


    Crash Date:

    [ ] Complete crash

    [ ] Partial crash

    System Affected:

    [ ] Emergency system shutdown

    Time of Downtime:__________________________________

    Time of Restore:__________________________________

    System Down For:__________________________________hours/minutes


    Cause of Crash/Corrective Action Taken:


    Signed__________________________________________Date


    A crash report serves as a way to provide evidence of recurring crashes, detail
    what procedure was followed to remedy the system, and provide some guidance for
    the system administrator who may have forgotten what happened the last time the
    system crashed or who is new to the job and not familiar with the system.

    Pro and policy statements should be as explicit as possible, and every activity
    should have an assigned procedure. In a well-documented system, files won''t get
    lost and the administrator can get a few nights sleeping knowing that the system
    is running smoothly. In a disaster, documentation gives guidance and directions
    for recovery. A well-documented system also allows managers to know what the system
    administrators are doing and consequently allocate resources but not burden the
    systems personnel.

    Overall, policy and procedure tasks include routine system maintenance, system
    functionality, automated tasks, systems performance, reporting, and systems security.
    As a task requirements document, this manual provides proficient systems personnel
    with the necessary knowledge to complete key systems tasks.'
