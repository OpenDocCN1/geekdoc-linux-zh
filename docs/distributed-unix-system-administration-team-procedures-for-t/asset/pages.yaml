  md: Current research does not provide an accepted degree of compliance to any administrative
    model; therefore, the assessments made during development of SAmatrix attempt
    to quantify practice to modeled operations. It was expected that the organization's
    information systems would not be compliant with the system administrative model.
    It was also expected that the reliability of the organization's systems were directly
    dependent on the degree of compliance to the administrative model. To have a reliable
    system, each location needs to show that it provides system administration services
    for each module. Because the model supports all aspects of system administration,
    it is reasonable to expect that overall, the organization should rate 90 percent
    or better with all of the major variables. This would indicate that attention
    to all areas of system administration have been addressed to a significant degree.
