- pgno: 26
  md: '# The Basics — 9


    This list contains, starting at the rightmost column, the name of the file, the
    date and time the file was created or last modified, and the file size in bytes.
    The remaining four columns contain information regarding permissions related to
    the file.


    UNIX files have basically three types of owner permission groups. Permissions
    are the user, a specified group, or root. The fourth column from the right in
    the long format lists groups with access to each file. A group is defined as a
    group of users (such as other or *sys in the example), all of whom are given the
    same permissions, as opposed to the permissions granted to individual users or
    the permissions given to the world. Groups can be defined by the system administrator
    to accommodate groups of users at all levels, from managers to developers.


    To the left of the group name is the owner of the file. The number to the left
    of the owner is the number of links to the file. A link is a symbolic reference
    to a file allowing more than one name used to reference the same file. In the
    leftmost column is a 10-bit descriptor of the file type as well as the permissions
    available to root, group, or owner. The leftmost bit begins with:


    +   - (dash) ordinary file

    - directory

    - a device file, block type

    - a device file, character type

    - a domain socket file

    - a symbolic link to a file

    - a named pipe


    The next bits refer to the permissions allowed for the file. These bits are broken
    up into three groups of three as shown in Figure 1.2.

    From left to right, the first three groups set permissions for the file owner,
    the next three bits set permissions for the group, and the last three bits set
    permissions for all other users. The superuser of the system has the ability to
    set and maintain all nine permission bits so that the integrity and availability
    of the system can be maintained.


    Three types of permissions are available: read (r), write (w), and execute (x).
    Read permission allows the user to look at the file while preventing the user
    from making changes. The write permission allows the privileged user to read and
    make changes to


    ![](img/8f8a5b924793524d71746c72ac703b14_26_0.png)'
