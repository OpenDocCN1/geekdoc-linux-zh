- pgno: 81
  md: '# 64 — Distributed UNIX System Administration


    The acctcom utility will be the last word on accounting in this chapter. This
    reports on specific usage for a specific user (-u), specific time (-s), specific
    group (-g), or a combination of these and other options available. The report
    comes from information stored in pactct and in the format shown in Table 3.5.
    Table 3.6 shows optional displays that can be obtained with the acctcom utility.


    These outputs give you an excellent understanding of how your system is forming,
    which it is, and when. For instance, to look my own usage for any processes run
    after 6:00 PM with a hog factor, Enter


    ```

    $ acctcom -s 18:00 -u wetsch -h

    END AFTER: Mon July 7 11:00:00 1997

    COMMAND START END HOG

    NAME USER TTYNAME TIME (SECS) (SECS) FACTOR

    v wetsch tty10 11:33:42 10:47:22 1415.15 1247.92 0.88

    lp wetsch tty10 11:49:13 10:49:33 20.43 3.21 0.22

    ```


    The s option specifies the request time in 24-hour time format (00:00–23:59).
    This means that any process running from 18:00 to the current system time is displayed
    in the output. The -u selects the specific user, and the -h option requests the
    hog factor. In the output, the HOG FACTOR heading replaces the MEAN SIZE heading
    displayed. The hog factor tells you how much CPU time was used for a specific
    process. A hog factor of 1.0 means the process consumed 100 percent of the CPU
    resources when it was run. A 0.90 hog factor indicates 90 percent utilization.
    The balance between high CPU utilization and the amount of time it takes to completely
    run the process must be considered. For instance, a process with a hog factor
    of 1.0 that only takes a fraction of a second to run probably will not affect
    your system and users will remain happy.


    | Table 3.5 acctcom output description |

    | Command name | Name of measured process |

    |--- | --- |

    | USER | Log-in ID |

    | TTYNAME | Name of the TTY in use for the process (i.e., ttyla) |

    | STARTTIME | System clock time the process started |

    | ENDTIME | System clock time the process ended |

    | REAL(SECS) | Actual processing time in seconds |

    | CPU(SECS) | CPU usage in seconds |

    | MEAN SIZE (K) | Mean memory size |'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Maintaining Access to Applications — 65


    If you have a process that is really "hogging" your system, you may want to make
    sure the process is running at a time that does not adversely affect your system
    process or users. You can minimize the impact of high hog factor processes with
    the nice command to change the priority of a command when it is executed. This
    allows processes that are not as hogish to execute prior to commands that are
    high on the hog factor. Overall, it is a judgement call that must be made to keep
    system performance optimal without adversely affecting the integrity or reliability
    of your system.


