- pgno: 188
  md: '# The Multilayer Security Model — 171


    # ACCESS SECURITY:


    The XYZ Company has established controls based on a multilayer security model
    with references to [list any available industry, organization, or government security
    references used to support controls].


    [Provide a description of each layer and reference how users gain access to the
    layer. Do the layers from the top down as follows: network, system, application,
    data, and physical.


    # Network Layer:


    Access to the XYZ Company WAN is through the AJAXNET X.25 service. Service password
    and mnemonics are released by the XYZ Company to authorized users. LAN connections
    are limited to XYZ staff and users who can gain access to a trusted host. Public
    access is limited to the XYZ web server. Direct modem access is limited to ten
    14,400-baud asynchronous Z-Brand modems in the computer facility. Two of the modem
    lines are limited to dial-in only with 3270 emulation.


    # System Layer:


    All users who gain access to the XYZ Company system must provide a valid log-in
    ID and password. Once the log-in ID and password are authenticated, users are
    given access based on the following class structure:


    +   - Class 0 — superuser possesses. Assigned only to select XYZ Company staff
    and managers responsible for system maintenance and management.


    +   - Class 1 — access to the shell. Assigned only to XYZ Company personnel requiring
    shell access but not superuser access.


    +   - Class 2 — application access. For XYZ Company staff and users who require
    access to application shells with file transfer capability in support of core
    business activities.


    +   - Class 3 — specialized application access. Limited application access for
    XYZ staff requiring only specialized system resources to do their job.


    +   - Class 4 — inquiry-only users. Users who are only allowed to view data and
    perform inquiries on specified databases. For outside business partners.


    +   - Class 5 — temporary users. Allows temporary accounts to be established for
    users. No shell access. Account valid only for 30 days.


    Maintenance of these accounts is described in the XYZ Company Systems Policy and
    Procedures Manual. User classes are implemented by the XYZ Company to control
    shell access and provide greater accountability of user privileges.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 172 — Distributed UNIX System Administration


    Application Layer:


    With a proper user class, applications for the XYZ Company can be accessed. Class
    privileges are determined by a user''s logon and password. For some class types,
    passwords may be grouped. Class 0 and 1 users may be-assigned application superuser
    privileges. Class 2 and 3 users may have read, write, modify, update, or execute
    privileges based on their assigned application and job function. Class 4 and 5
    users are given inquiry privileges only.


    Data Layer:


    The Data Layer is the actual files that reside on the hard disk. Class 0–2 users
    can have access to these files through the operating system or application shells.
    Class 3 users may modify this layer only through application shells. Because of
    the ability to manipulate files, users of Classes 0-3 are considered the most
    trusted users to the system.


    Protection to this layer is provided by auditing and backup and restore procedures.
    These procedures are referenced in the XYZ Company Systems Policy and Procedures
    Manual. In the course of discovering fraudulent intent or a security leak at this
    layer (i.e., disruption or manipulation of files) procedures in the XYZ Company
    Systems Policy and Procedures Manual are to be followed.


    Physical Layer:


    System users, visitors, and technicians usually have access to the physical layer.
    Authorized technicians and Class 0 and 1 users may have unescorted entry to the
    computer facility. All other users must be escorted when in the computer facility
    by a Class 0 or 1 user. In case of a security breach, building security should
    be contacted immediately. In case of a system crash, natural disaster, or other
    unforeseen event, follow the procedures in the XYZ Company Disaster Recovery Plan.


    PRIVACY:


    [State whatever information the company has that is considered private and proprietary.
    Also cite any laws or company policies that address these issues.]


    SUMMARY:


    No computer, especially one on a network, is safe from intrusion. Intrusion into
    the system can be intentional or unintentional. This plan is designed to track
    intrusion through user access classifications and system accounting. In addition,
    it is designed to limit the number of users who must access critical system areas.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# The Multilayered Security Model — 173


    Maintaining and enforcing the system controls and office policies discussed in
    this plan and referenced in the XYZ Company Systems Policy and Procedures Manual
    will reduce the chance of unauthorized intrusion. By addressing each layer of
    the system, the chances of overlooking components that exist in each layer are
    reduced. This plan should be reviewed on an annual basis and updated accordingly.


    # REFERENCES:


    [Cite whatever references used for the plan.]


    # APPENDICES:


    [Attach your referenced appendices here.]


    This sample plan provides an overview of a multilayered security plan. It references
    other documents as appropriate and incorporates detailed information as required.
    A general rule of thumb is that the more static the security information is, the
    better it is to include it in the security plan. Data that changes quickly, such
    as office policies or other procedures, should be included in supporting documents
    designed for change.


    Before writing a security plan, the security requirements of the system should
    be addressed by management. The system administrator usually does not have the
    authority to implement security policy, and all policy must be supported by management.
    Without management consensus and support, users will run rampant on the system,
    including other managers who probably do not need the access level they insist
    on having.


    # User Security Training


    The implementation of user security training and awareness is a key aspect to
    maintaining a secure computing environment. Security training does not have to
    be elaborate and should start with an authorized access form giving the user right
    to access the computer system. These forms should be signed by an appropriate
    manager. To save paper, it is also good to put the company''s security policy
    on the form that the manager signed and the employee sign in to acknowledge having
    read the form. A copy of the form should be given to the authorized user. The
    content of the policy should be in a form that is easily readable and should include,
    at a minimum, such topics as:


    +   * E-mail or messaging policy

    * Equipment use policy

    * Authorized access policy

    * Disclosure of log-on IDs/passwords

    * Who to contact


    ![](img/8f8a5b924793524d71746c72ac703b14_190_0.png)'
