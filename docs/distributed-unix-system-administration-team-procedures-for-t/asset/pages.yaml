- pgno: 39
  md: '# 22 — Distributed UNIX System Administration


    Cron continues to operate after a user has logged off the system and can be used
    for any automated function a user deems necessary. Because of the sensitivity
    of cron to time, it is recommended that date changes to the system be done when
    the system is in single-user mode, which cron is inactive and cron processes cannot
    be inadvertently started or ignored. A cron file can be given any name and may
    appear as:


    ```

    0 5 * * echo "Time for System Maintenance" > /dev/ttyA

    0 4 1 * * /usr/lib/monitor

    0 4 1 * * /usr/lib/syschk /bin/dev/console

    #15 14 3 2 1

    ```


    The example is short but illustrates the point. First, an * (asterisk) is used
    as a wildcard, and # (pound) is used to provide a comment or to comment a line
    it is not executed. The numbers from left to right in the line


    ```

    0 5 * * echo "Time for System Maintenance" > /dev/ttyA

    ```


    0 refers to minutes, 5 refers to hours, and the next place holders are the day
    of the month, the month, and the day of the week. The asterisks in the day of
    the month, month, and day of the week locations refer to any day of any month.
    Sunday is considered the first day of the week, and it is numerically labeled
    0. Therefore, to kick a backup routine at 10:00 PM every Sunday, enter into a
    cron file


    ```

    0 22 * * 0 /bin/cpio -ocvB > /dev/tape

    ```


    To run a different backup procedure every day of the week except Sunday at 10:00
    PM, enter


    ```

    0 22 * * 1-6 /usr/adm/backup1

    ```


    As in the line above, you can enter a range using a - (dash) to match all values
    for a particular field using an * (asterisk). You can also select multiple parameters
    for a specific field using a , (comma). For instance, to list all processes running
    on a system every 15 minutes and save them to a log file,


    ```

    0,15,30,45 * * * -ef >>/usr/adm/process.log

    ```


    In the example above, the file process.log would grow unbear large if not maintained.
    To gather a sample of processes unattended for a brief period of time, such a
    statement would be useful. When finished, the line could be removed from crontab
    or commented out with the comment symbol # for a later time. In practice, the
    cron file may be long and should be well written. Comments should be'
  merge: -1
