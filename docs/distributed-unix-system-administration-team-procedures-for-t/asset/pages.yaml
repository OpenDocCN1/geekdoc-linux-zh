    | Table 5.8 Options to the l1p command. |

    | l1stat option | Description |

    | -d | Sends the file to be printed to the supplied destination.

    Note: The LPDEST environment variable determines a user''s default destination.
    |

    | -m | Sends a mail message to the initiator of the print job when printing is
    complete. |

    | -n | Prints more than one copy of the file. Example: l1p -n2 filename prints
    two copies. |

    | -s | Turns off message output from the spooler. If used, the user does not receive
    a request ID. |

    | -t | Puts a title on the banner page. |

    | -w | Notifies the user when a request is completed. |'
