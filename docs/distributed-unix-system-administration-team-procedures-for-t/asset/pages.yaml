    Having established closely sar needs to monitor system activity, the real work
    begins in understanding what the sar data means.


    By collecting sar data relevant to typical workloads of your system, such as minimum,
    average, and peak loads. If you are unsure when these loads occur, sar can provide
    the data by observing system performance over time. Your observations of typical
    activity become your system performance baseline. Your initial views should look
    into CPU utilization, caching, swapping, and paging, although to be thorough,
    you may want to collect data on all system components. Be prepared to spend considerable
    time analyzing this data in order to spot trends. You may want to monitor areas
    dealing with semaphore activity, inode status, and queue status, especially if
    you are experiencing problems with them or if any other activity does not provide
    any clues.


    Only when system behavior is fully understood should any attempt be made to adjust
    system parameters. For instance, if you notice that caching and paging is heavily
    used and slowing system performance, look at the processes causing this activity.
    If it is an application, check your application parameters first to determine
    if they are set properly. When new application parameters are set, use sar to
    see if there is an improvement, make sure to correlate revised parameters with
    your baseline; establish a new baseline if you keep the new parameters. If your
    tuning is not effective and there appears to be no other cause, look at your tunable
    parameters, make adjustments, and recheck the system performance against your
    baseline.


    Remember that no two UNIX systems are going to be alike and if you are dealing
    with a production-level system, you should not take adjusting parameters lightly.
    The best case is to have a test system that can be created to mirror a production
    machine and the load on the production machine. You should try to replicate problems
    encountered in production. This allows you to play with the system parameters
    without affecting a production-level system.'
