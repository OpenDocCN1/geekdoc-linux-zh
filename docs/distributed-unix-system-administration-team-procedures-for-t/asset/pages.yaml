- pgno: 60
  md: 'option running sync now does the same. So, as noted in Chapter 1, the shutdown
    command also performs a sync, and your system is also capable of doing auto-matic
    sync if you leave it sitting there. The solution is to do a hard boot (reset)
    to your system. Because you should be in single-user mode and your file systems
    would generally be unmounted, you probably do not have to worry about creating
    additional problems. Reboot the system to single-user mode and run fsck again
    until you can cleanly proceed through the steps of this important file system
    utility.


    Run fsck to keep your file systems from degenerating into an irreable mess. Remember
    to mount your file systems after running fsck. On System V, usually the best thing
    to do when you have finished your maintenance work in singleuser mode shutdown
    the system to init level 0. When it is ready to poweroff, shut it off and let
    it reboot into its normal multi-user mode.


    # Other Useful File System Commands


    Some additional UNIX commands are useful for checking on a file system and doing
    other file system work. For instance, you may want to see how much space is used
    and how much space is free for a file system, how many inodes are there, or how
    many blocks are available.


    The df command is a good monitoring tool. It displays the amount of free space
    on your disk. Use the -t option to see the total allocated size of the system
    and the -v option to see the percentage of free blocks. The output of a df command
    entered at the prompt may look like


    ```

    # df

    /dev/s0 3401 blocks 761 i-nodes

    /usr/dev/s1 156722 blocks 10455 i-nodes

    /tmp/dev/s3 65433 blocks 1523 i-nodes

    ```


    As a general rule of thumb, you should work to maintain your file systems below
    90 percent full. You should take action to keep your file systems from getting
    full when they approach 80 percent of capacity. This is particularly true for
    your root file system. If you do not maintain your file systems, the system degrades.
    When your root file system is full, your system either crashes or reports a multitude
    of errors that require immediate action to maintain the system.


    The du command displays information being used by a specific directory. You can
    also display individual files with their sizes using the -a option. Using du as
    follows:


    ```

    # du /appusr

    ```


    gives the block size of the directories in the file system as well as the total
    blocks used by the file system:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 44 — Distributed UNIX System Administration


    ```

    855 /appusr/prgs

    430 /appusr/prgs/src

    8677 /appusr/data

    5746 /appusr/data/old

    6 /appusr/spool/app

    764 /appusr/test

    16478 /appusr

    ```


    Here, note the block size at the bottom of the list is the total number of blocks
    used by the file system /appuser.


    Note size-reporting commands such as du and df report in 512-byte block sizes
    and your native UNIX might use a different default block size, such as 1,024 bytes/block.
    Here, two blocks of 512 bytes may equate to one 1,024-byte block (native).


    The creation and maintenance of file systems is an extremely important task for
    the UNIX system administrator. Files and directories are removed using the rm
    command, but when the system administrator is logged into the system as the superuser,
    the rm command must be used with caution. For instance, an inadvertent rm -rf
    * run from the root directory will completely wipe out your UNIX system. More
    on this in the Security Administration module (Chapters 8 and 9).


    Cleaning up file systems is also part of the maintenance function. This can be
    accomplished by manually executing commands or setting commands to run automatically
    through cron. Cleanup removes unused old files — called core, created when a process
    inadvertently terminates, and zero-byte files. In some cases, you may want to
    retain these files, but generally old files not used should be backed up and deleted,
    and core and zero-byte files should be removed. Other files important to the administrator
    are log files. These files should be monitored so they do not grow too large;
    when necessary they should be zeroed out and allowed to grow again.


    This shell script checks file and directory sizes and takes the appropriate actions.


    ```

    # cleanup — a script to check on file sizes

    PATH=/bin:/usr/bin


    CLEANLOG=/tmp/cleanup.tmp

    rm -rf $CLEANLOG


    # Report on file sizes of key files. Customize block sizes to

    # reflect what is considered too large for your system. This

    # will be primarily dependent on available disk space.

    echo "Today''s cleanup date is `date`"

    echo "--------------------------------------------------"

    /usr/adm/messages   25000

    /usr/adm/pacct      25000

    /usr/adm/sulog      25000

    ```'
