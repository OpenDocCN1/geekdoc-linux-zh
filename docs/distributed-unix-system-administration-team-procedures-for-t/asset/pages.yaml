    You can also use octal numeric representation with chmod to set additional bits;
    hence, four octal numbers instead of three are used to set file permissions. Octal
    1000 to turn on a sticky bit. Additional control is achieved with the user ID
    (setuid) and the group ID (setgid) commands. By setting these bits, you can pass
