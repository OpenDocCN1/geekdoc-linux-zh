- pgno: 42
  md: '# The Basics — 25


    The system overview introduced the concepts of paths and directories and discussed
    how an understanding of file organization and file permissions can help you keep
    your system organized and user access maintained with processes such as chmod
    and umask. System organization is defined first and foremost by the directory
    hierarchy, with root at the top followed by the subsequent system directories.


    Finally, the system overview discussed how permissions and environment variables
    define how an administrator or user uses the system. The ability to grant permissions
    and configure environment variables considerable authority in the system, which
    directly affects the man-machine interface for all users.


    This chapter also discussed how to gracefully bring the system down to perform
    maintenance and how to set up scheduling. Maintenance allows the administrator
    to keep the system in top shape. While in maintenance mode, the administrator
    also can accomplish tasks, such as setting permissions, scheduling, loading drivers,
    etc., without affecting a user — except that users other than the administrator
    cannot access the system when it is in maintenance mode.


    This chapter shows how to get a better view of your system — by determining what
    is in it, what runs on it, and what is required to run on the system — with the
    use of the `ls`, `pwd`, `ps`, and `env` commands.


