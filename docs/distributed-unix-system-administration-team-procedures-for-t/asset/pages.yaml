  md: '# 14 — Distributed UNIX System Administration


    # umask 000 results in

    -rwxrxr-wx 1 user other 15659 Feb 19 11:32 filename


    You must be cautious when applying umask to directories. When the permissions
    of a directory are set, they apply to all files in the directory. That is, if
    you set a directory through umask to read-only, any file in that directory, regardless
    of its assigned permissions, will be read-only. Thus, by setting the system umask,
    you are effectively setting the parameters on how others can access their files.
    To find out what the umask value is for your system, just enter umask at the prompt.


    In addition to the topics covered in this overview of the UNIX system, five other
    areas are basic to UNIX: logins, system startup/shutdown, where to find files,
    scheduling, and using an editor.


    # Logins


    Logging in, one of the most important features of a system, allows a user access
    to the system and validates that user as someone authorized to use the system.
    The system administrator must not only assign user-in IDs and passwords but must
    also manage users and help them to successfully log on to the system, a challenging
    task when dealing with new user systems.


    At login, the screen displays a banner of some sort that welcomes you to the system.
    Some systems use disclaimers or warnings as a banner to inform you of the system''s
    intended use. Along with a banner, the system displays a log-in prompt, such as


    Welcome to the Enterprise UNIX system


    login: wetschj


    After entering a user ID, such as wetschj, the system prompts you for a password:


    password:


    The system does not display the password you enter in order to prevent others
    from seeing it on the screen. If you type your password incorrectly, you receive
    an error message. The system administrator may also limit the number of incorrect
    login tries you can make on the system before you are logged off.


    Once logged in, you may be asked to enter your terminal type with


    TERM=(vt100)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# The Basics — 15


    Your default terminal type is displayed in parentheses. Pressing the Return key
    accepts the default. To change the terminal type, type a new one in before pressing
    Enter. For example:


    TERM=(vt100) vt320


    The system then looks in the terminal configuration files for a valid terminal
    type that can be assigned to the TERM variable. If the system finds a valid type
    it returns the response


    Terminal is vt320


    If an invalid terminal type is entered, the response is


    Terminal unknown


    Having the wrong type assigned to TERM causes predictable but peculiar results.
    Characters to the screen may be doubly echoed, line wraps may not work properly,
    backspaces and control codes may not be interpreted properly, uppercase and lowercase
    output to the screen may be reversed, or keyboard keys may not be properly enabled.
    The problems should first be addressed by checking the TERM variable using the
    **env** command. In addition, you may want to check if the terminal default matches
    the terminal actually being used. If you get meaningless characters on your screen
    after a successful login, it is also possible that you are communicating at the
    wrong speed. Pressing the Break or Return key can sometimes rectify this problem.
    If not, try logging in and check for the correct terminal type.

    The only time a user does not need log log to a system is when the system login
    is already established and a session is open. Also, log-in procedures may be transparent
    between systems after an initial login. This allows users to move between systems
    that belong to the same network while logging in to only one system on the network.
    Getting out of a working session can vary, usually entering **exit** or Ctrl-d
    (^d) works.


    # Shutdown


    Important to operating any UNIX system is properly shutting down and starting
    it. Unlike a PC running DOS, a UNIX system cannot just be powered off. An arbitrary
    poweroff carries a risk of damaging system files and directories and possibly
    even the drive. In emergencies, such as an evacuation where a quick shutdown is
    needed or power is to be shut down for your facility and you have no time to perform
    the shutdown procedure, should a poweroff be attempted. When you return to the
    system, be prepared to do some work to get everything back in shape.


    ![](img/8f8a5b924793524d71746c72ac703b14_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'If you want to see what run level your system is at, execute the who -r command:

    run-level 3 Feb 8 22:12 3 0 S


    In this case, the current run level of the system is 3 and the information to
    the right states that on February 8th 10:12 PM, the system was moved from run
    level S to run level 0. Some UNIX systems, such as BSD and XENIX, only recognize
    multi-user and single-user modes, in which the results of who -r will vary from
    this example. The shutdown command is located in a system directory, usually the
    /etc directory for V UNIX systems or the /sbin or other file system storehouse
    directory. shutdown is used to put the system in an assigned state and can only
    run by root. The general states, modes of operation, or init levels (i.e., the
    same as run levels) are shown in Table 1.2.


    Init levels above 3 exist, including an init level 4, which may be defined by
    the user; init level 5, which is another shutdown mode; and init level 6, for
    an immediate shutdown.

    asAs in Table 1.2, init levels S and 1 appear to be duplicates. However, there
    are discrete differences between these seemingly identical modes. With init level
    S, the system administrator brings the system into a maintenance mode and removes
    any background processes. Init level 1 keeps the background processes running.
    Thus, at init level 1, all daemon processes are running, whereas init level S
    only maintains the required daemons. Init levels 2 and 3 are both multi-user run
    levels and can be used on network systems. However, init level 3 allows for remote
    file sharing and networked systems, whereas init level 2 is expected for non-networked
    systems.

    an init level can be called in it two ways, and permission to set an init level
    should be restricted to the superuser. First, the init command can be used to
    shut down the system.


    ```

    # init 0

    ```


    | Table 1.2 Primary shutdown levels |

    | Init level | Description |

    | S | Single-user mode |

    | 0 | Prepare system for a power down |

    | 1 | Single-user mode |

    | 2 | Multi-user mode |

    | 3 | Network multi-user mode |'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'However, the shutdown command is considered better because it gives the system
    administrator more options. In the command line


    ```

    # shutdown -i0 -g60 -y

    ```


    the -i option sets the init level to 0; -g sets a grace period before shutdown
    of 60 seconds, although systems may define this 60 minutes; and -y sets a response
    to any system prompts. Without -y, the system administrator is prompted to confirm
    shutdown. Shutdown takes a system down gracefully. It sends messages that users
    use to get off the system (this is why grace period is important), and it may
    even perform a file system check (fsck) when the system is rebooted. fsck during
    maintenance is prudent but not always needed during shutdown. It prolongs the
    process; that is, a shutdown command requires changing the system to a different
    run level when returning to the system to user mode. When rebooting the system
    after the reboot starts the process. For a faster boot on BSD systems with shutdown,
    bypass fsck with the -f option. However, in most cases the reader reboot using
    fsck should be used to provide necessary file system checks at startup.


    On BSD systems, the syntax for the shutdown command varies. Basically, execute
    the command with the time of shutdown specified as now, in minutes, or by clock
    time with a supplied message to broadcast to all users. For example, enter


    or


    or


    Shutting the system down to maintenance mode will be discussed in the next chapter.
    A recommended procedure to prepare for a normal V UNIX powerdown is:


    +   1. Whenever possible, warn users with the system message note file when the
    system will be down and for how long. (motd is used to store messages that are
    read by users at login.)


    +   2. Log in to the system as the superuser.


    +   3. Use the wall command to send a message to all users that the system will
    be going down. Usually 10–15 minutes prior to shutdown is enough warning. I usually
    give enough time to allow a call just in case a user is in the middle of an important
    process that may extend beyond the scheduled shutdown time by a few minutes.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '4. Check to see how many users are on the system with who -u or ps -ef (alone
    or with an appropriate pipe to grep processtype).


    5. Execute the sync command. In UNIX this a traditional shutdown step, although
    on some machines it may not be needed. When invoking sync, the buffers are flushed
    and a correct system image is written to disk. In some shutdown-commands, sync
    is embedded and executes automatically. Nonetheless, running sync is good practice.


    6. Finally, execute the shutdown command to init level 0. A grace period should
    be called, and the -y option should be used (i.e., shutdown -i0 -g60 -y). Caution:
    Once a shutdown is in progress, do not attempt to interrupt it. It is better to
    let the system down gracefully, then you can restart it.


    When the shutdown process is complete, the system sends a message saying it is
    safe to power down or restart the system. You may be prompted to Press any key
    to reboot when a shutdown is complete. Watch your screen and note any system prompts
    that appear. Also note that outputs to the screen tell you which daemons are being
    turned off. During shutdown, observing output messages can give you an excellent
    sense of what is happening during the shutdown process.


    During the shutdown process, the system runs an init level script, which in turn
    invokes scripts to bring the system down gracefully. On a System V UNIX box, the
    /etc/rc0 script invokes UNIX utilities and commands to bring the system down.
    (Note: the /etc/rc[0-6] scripts are set up to trigger the proper init level during
    level changes, shutdowns, and system startups.) The /etc/rc0 script invokes the
    killall utility, which cleans up daemons and other processes that are running
    by issuing sync commands as needed, unmounting file systems using umount, and
    issuing the umount command to halt the processor.


    In a BSD system, you have a different array of shutdown options available. For
    instance, if you are going to shut the system down for a poweroff, using the -h
    option completely halt UNIX.


    # # shutdown -h +10 "Down for Maintenance in 10 Minutes


    Here, the time of 10 minutes is set and the shutdown message Down for Maintenance
    in 10 Minutes is broadcast to the users. Another BSD shutdown parameter is r with
    the same syntax -h. The -r option causes an immediate reboot when the system reaches
    maintenance mode. This option should be used to warm your system.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Startup


    System startup is as important as shutdown. You can begin a startup when shutdown
    is complete. As with shutdown, observing what happens can give you insight into
    the startup process: watch your screen and note any system prompts and outputs
    that appear.


    Unless you are booting up to a maintenance level after a shutdown, some UNIX systems
    give you this option by wave of ''d (Ctrl-d). That is, after shutdown you will
    receive a prompt for the root user ID, which when entered, places the system at
    level 1.


    When booting the system, the BIOS boots from your hardware followed by a boot
    of the UNIX operating system; if your system has multiple operating systems, you
    may be prompted for a particular one; if you do not, the system may boot to a
    default. When booting is, the log-in prompt should appear.


    Note that some UNIX systems may have customized boot scripts that run after the
    normal boot to bring a special peripheral online, do some automatic function,
    or perform some other task. In this case, the boot script should be allowed to
    run after the initial login appears. When it is finished, login should reappear
    or be accessible.


    Starting from scratch, the first order of business to get UNIX operational is
    for the read-only memory (ROM) in the hardware to start. The instructions in ROM
    do initial checking and internal configuration to your system and send instructions
    to the CPU to load the kernel through a process called the loader, accessible
    from the first block on the hard disk. The loader loads into random memory (RAM)
    and prepares to load the kernel. The kernel may load automatically, or you may
    be presented with a colon (:) prompt, whereby you need to press Enter to begin
    the load.


    The kernel is located in the root file system and may be called unix. When loaded,
    the kernel performs a self-initialization and loads a swapper program Once the
    swapper is in place, the system must recognize the devices attached to it. This
    is done through the init process, which reads the /etc/initab file and brings
    up the system configuration. When this is complete, you are prompted to enter
    the date.


    Next, the system checks the files; then you are prompted to run fsck. After fsck
    is run or omitted (it is best to let fsck run at this time), the commands in /etc/rc
    file, the rc files run, The rc file contains the necessary information to run
    the system at the specified init level, which includes cleaning the /tmp directory,
    mounting file systems, making sure system daemons and other required services
    are started, and doing other necessary startup and cleanup tasks.


    Now the kernel needs to connect to a terminal to let the administrator log in.
    This is done with the getty process, which reads the getdefs file and configures
    the TTYs for user access (on gettydefs to follow). The system should now be up
    at the proper root level, with an active terminal and a log-in prompt displayed.
    From this point on users can access the shell and execute commands.


    ![](img/8f8a5b924793524d71746c72ac703b14_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '20 — Distributed UNIX System Administration


    # Finding Files


    The traditional method for displaying the basic UNIX file layout is the tree structure.
    This hierarchical structure is illustrated in Figure 1.3, which shows the top
    level (root) of the tree structure and subsequent directories under root, with
    the blocks under each directory representing files.


    UNIX systems have special directories that specify the locations of important
    files. Files exist at the root directory, but four of the main directories underneath
    root are bin, tmp, etc, and usr. Depending on the flavor of UNIX you are using,
    you may have other subdirectories such as var, lib, and others.


    The binary directory contains the UNIX files for the fundamental operation of
    the system. This allows the administrator to use UNIX utilities only when the
    root file system is mounted. Other utilities are stored in /usr/bin. The /tmp
    directory is where temporary files are stored. The /etc directory has utilities
    for the system administrator as well as a significant number of subdirectories
    for program defaults (/etc/default), and kernel and device driver configuration
    files (/etc/conf). Additional locations for compilers, mail, printing, user directories,
    temporary storage, and more is located in /usr sub The /dev directory is an important
    file directory for device files for UNIX system peripherals.


    A listing of the /root directory may look like this:


    ```

    # ls -l

    total 8534

    -r-------- 1 root auth      0 Aug 20 20:11 .lastlogin

    -rw------ 1 root root       15 Dec 14 1995 .mailrc

    -rw------ 1 root root       885 Sep 15 1996 .profile

    -rw------ 1 root other   4868 Feb 02 1995 .sh_history

    ```


    Figure 1.3 Fundamental file structure.


    ![](img/8f8a5b924793524d71746c72ac703b14_37_0.png)'
