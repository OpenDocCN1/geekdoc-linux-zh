    # Tuning the Operating System


    An important part of maintaining access to applications is maintaining optimal
    performance of the system. Tuning an operating system isn''t something to be taken
    lightly, and unless you know or have the time to determine the optimal settings
    for your system, it is best to stay with the system defaults. However, you may
    be required to fix a UNIX system that is operating poorly. If you find an obvious
    problem, look into the kernel parameters. They may have been changed and it would
    probably be to your advantage to rebuild the kernel and return it to the system
    defaults. Overall, you serve your system by making sure there is plenty of disk
    space, properly maintaining your file systems, and using the proper hardware before
    messing with the kernel variables.


    # Reconfiguring the Kernel


    Not like the user environment that can be configured with variables, the UNIX
    system also has a number of parameters that can be set. You may start receiving
    error messages like too many processes -- cannot fork, inode table overflow or
    system error messages tell you the operating system is not working properly. When
    these messages become frequent, consider reconfiguring your kernel. You may have
    to look at the parameters of your existing kernel and analyze where changes should
    be made. The user interface to rebuild a kernel has been made friendlier by vendors,
    but it is system specific and may differ from what others appear.


    The range of parameters for your system are in the file mtune located in /etc/conf.d/mtune.
    The actual parameters you need to tune are in the stune directory found in /etc/conf.d/stune.
    You can analyze the files in stune and determine the values available to you in
    mtune. When you are ready to proceed with a rebuild, make sure here


    +   - do not exceed the range of values specified,

    - keep a copy of stune so that you can reverse your changes, and

    - make legitimate changes that do not throw your system out of balance, making
    it unstable.'
