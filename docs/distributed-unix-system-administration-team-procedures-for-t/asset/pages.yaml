  md: '# 12 — Distributed UNIX System Administration


    sticky bit, and 1 sets mandatory locking. A file mode can be described as the
    state a file is by its settings. For instance, changing the permission bits changes
    the security or protection mode of the file. All files can have their mode set,
    but it is most important for the operation of executable files.


    Setting a sticky bit on an executable file allows an image of text fast from the
    program to be placed in the swap area faster at execution. It is now used as often
    today as it was in the early history of UNIX, but it is sometimes reserved for
    use on large executable files that include system deliverables, such as editors,
    compilers, and shells. Therefore,


    ```

    # chmod +t ls -1 before and after shows

    ```


    sets the sticky bit, and before and after shows


    # Before


    ```

    -rwxr-xr-x 2 root bin 156059 Feb 12 11:32 filename

    ```


    # After


    ```

    -rwxr-xr-t 2 root bin 156059 Feb 12 11:32 filename

    ```


    Caution: If you like making sticky programs, remember not to overdo it. Each sticky
    program uses swap space. Therefore, with many sticky programs and many users executing
    those programs on the system, your swap space will overrun and a noticeable degradation
    of your system will occur. Sticky programs should be limited to less than one-third
    of your available swap space.


    When setting the sticky bit on a directory, it is possible to set up the directory
    to give only root and the owner of a file in a directory the ability to delete
    the file. Setting the sticky bit on files located in public prevents nonowners
    of a file and nonsuperusers from cleaning out the files of others. For example,
    the public directory /tmp may appear as


    ```

    drwxrwxrwx 1 bin bin 512 Feb 12 11:32 tmp

    ```


    By setting the sticky bit with chmod +t /tmp, the listing appears as


    ```

    drwxrxrwt 1 bin bin 512 Feb 12 11:32 tmp

    ```


    With this setting, the file owner now has some protection for files located in
    public places. Note that this setting can be applied to any directory, but it
    makes sense primarily'
