- pgno: 132
  md: '# Network Services


    # Managing Services


    An important daemon found on all UNIX systems, inetd manages the other daemons
    that provide TCP/IP network services. Known as the network superserver, inetd
    starts the appropriate daemon when it detects a service request. inetd can spawn
    more than one TCP/IP service, allowing more than one telnet, ftp, or other network
    process. To find inetd:


    ```

    # ps -ef | grep inetd

    ```


    This command provides the process ID (PID) for inetd in case the configuration
    file must be changed. Once you have the PID for the file (25 in this example),
    you can send the SIGHUP signal to inetd using the kill command


    ```

    # kill -HUP 25

    ```


    causing inetd to read the inetd.conf file and continue. Stopping inetd abruptly
    stops network services.


    The inetd.conf file (Listing 6.1) provides the networking information for the
    inetd daemon. The # sign is used for comments and the fields are separated by
    white space. The first field names the service, the second field the socket type,
    followed by the protocol, wait status, server program, and server arguments. For
    example, in the line


    ```

    telnet stream tcp nowait root /usr/sbin/in.telnetd in.telnetd

    ```


    the service type is telnet, which is mapped to a port number. The socket type
    is stream. Other socket types available are: dgram, datagram sockets; raw, raw
    sockets; sepacket, sequential packet socket; or tli, transport layer interface
    (TLI)


    | Table 6.4 Common routing protocols.

    | Abbreviation | Full name |

    | RIP | Routing Information Protocol |

    | OSPF | Open Shortest Path First |

    | IGRP | Interior Gateway Routing Protocol |

    | EGP | Exterior Gateway Protocol |

    | BGP | Border Gateway Protocol |

    | DVMRP | Distance Vector Multicast Routing Protocol |'
  merge: -1
  img_proc: true
