- pgno: 163
  md: '# 146 — Distributed UNIX System Administration


    These modes are Cipher Block Chaining (CBC), Cipher Feedback (CFB), Output Feedback
    (OFB), and Electronic Code Block (ECB). NIST provides publications on DES in the
    form of Federal Information Processing Standards Publications, more commonly referred
    to as FIPS Pubs. The DES is found in FIPS PUB 8. Due to restrictions on exports
    of encryption software, users outside of the United State may not have legal access
    to the DES utility.


    Encryption utilities require a key to decrypt them and DES can be enhanced with
    multiple encryption iterations and multiple keys. A DES encryption tool is called
    des and sometimes uses a piece of hardware known as a DES chip. The syntax for
    the use of des can vary. One way to encrypt a file with a key is:


    ```

    # des -k thekey -f inputFile outputfile

    ```


    This line uses the -e option to encrypt using DES. The -k option specifies the
    user-defined key in the line as thekey. The -f option specifies the file to be
    encrypted (inputFile) and the name of the resulting encrypted file (outputfile).
    DES employs a technique called symmetric encryption, requiring the key to be the
    same for both encryption and decryption.


    To decrypt the file you must know the key. Enter


    ```

    # des -s encryptedfile > decryptedfile

    ```


    The the input parameter is now the file that has been encrypted and the output
    file is the name of the file it is decrypted. This line returns a prompt to enter
    the key. Just when entering a password at login, the information entered for the
    key will not be displayed on the terminal.


    A UNIX utility crypt is part of the UNIX system and variations can also be found
    on anonymous ftp servers and downloaded for use. Although there are various versions
    of crypt available, it is not considered the most secure encryption method. Using
    the UNIX compress utility and then crypt can improve security.


    # User Accounts and Passwords


    Passwords protect data integrity and authenticity and enhance user privacy. Unfortunately,
    in the absence of an enforceable standard, many users may take the easy way out,
    using easy-to-remember passwords as first names, last names, names of relatives,
    or something trivial. In addition, when a given default password, users often
    retain rather than change it. Passwords containing common names and system defaults
    are commonly referred to as “joe accounts.” The ftp downloadable COPS program
    can be used to detect joe accounts on a system. To truly have a secure system,
    joe accounts must be eliminated. A system can enforce restrictions to a password'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# UNIX Security — 147


    in order to enforce a company standard. The ftp downloadable program called passwd+
    allows a system to set and enforce security features on passwords.


    A technique for creating a memorable password is to select two names that have
    no connected meaning, and either connect them or replace a letter with a special
    character or a number. For instance, the password birdcage may not be very secure,
    especially if the user is a bird enthusiast. A more secure password would be to
    use disparate words like birddirth, as as bird;dirt;b1rdirth;bird7dir;3irD11.
    the user comes up with an easy to remember mnemonic and then creates a variation
    of the mnemonic to make it secure. Consequently, a good mnemonic allows the user
    to create many passwords with the same mnemonic, which comes in handy on systems
    that enforce password aging. When changing a password, keep the same mnemonic
    and just change the form or come up with a new mnemonic and start over.


    Unlike passwords, naming accounts can include the person''s last name with first
    initial or variations on, in the case of multiple accounts with the same name.
    Account names are in the /etc/passwd file. Default permissions for this file allow
    read privileges by anyone.


    When an account is established, the initial password is set by the system administrator.
    New accounts should be monitored and deactivated after a period of time if they
    never get used. New users, when accessing a system for the first time should be
    required to change their passwords. It is good policy to enforce password aging
    and make users change their passwords on a periodic basis. Once a month is considered
    a minimum time. If a user believes for any reason that his her password has been
    compromised, password should be immediately changed. The user should also contact
    the system administrator as well as security groups within the organization. It
    is best to have a clear policy on what to do when a password is compromised. Change
    passwords with the passwd command.


    The passwd command provides options to configure passwords according to accepted
    organizational policy. Some options are -f, which forces users to change passwords
    at the next log; -n, which sets the minimum length of the password; -x, which
    sets the maximum length; and -w, which warns a user of the number of days left
    before a password must be changed. The options -n and -x should be used to check
    on password parameters available for your UNIX release. In addition, aduser, the
    utility used to add new users to a system, can be configured to require a new
    user to enter a password after login.


    Passwords are kept in the /etc/passwd file. The delimiter in the passwd file is
    the colon (:) just as it is in the /etc/group file. The layout of a couple of
    lines in the passwd file would like


    ```

    root:g74D34bf:0:1:Administrative User:/bin/ksh

    wetsch:d8fej8sGJ:100:10:John Wetsch:/usr/home/wetsch:/bin/ksh

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: '148 — Distributed UNIX System Administration


    The first field is the account name, followed by the encrypted password. The third
    field is the UID and the fourth field is the GID. The fifth field is populated
    by descriptive information about the user, usually the full name. The following
    fields are home directory and default shell, respectively. Once again, it is important
    to note that the UID for the superuser is 0. Any unauthorized users with a UID
    of 0 are suspect. Such a situation indicates that someone has penetrated the system
    and assigned superuser privileges to an account that should not have.


    The encryption of the password in the passwd file is kept more secure in all the
    older releases of UNIX through the /etc/shadow file. A release rated C2 level
    of security is unlikely to include a shadow file. The shadow file provides a mechanism
    to store encrypted passwords in a location separate from the passwd file.


    The passwd and shadow files should always be backed up in the regular backup.
    To disable a user without deleting his her file, add an to the password field
    in the passwd file. Also, replacing the startup shell with /bin/false exits the
    system when a log-on attempt is made. An empty password field allows a user to
    log without a password. If this appears in a file that looks unusual, check it
    out, and, if necessary, deactivate the account. The user may be getting in the
    account without authentication. Another area to watch in the passwd file is the
    startup directory or shell. An intruder may plant a program that runs at startup
    that gives unauthorized privileges.


    # Firewalls


    A computer firewall prevents outside users from accessing a network. Systems can
    be open or closed. A closed system is an internal network or networks that must
    be kept secure. An open system allows anyone to have access, such as a world-accessible
    Internet Web site. Internal network users may have access to services or only
    to other trusted hosts. Access to the open or closed system is determined by the
    originating IP address or other authorization. An effective firewall keeps intruders
    out of a system. If penetrated, a firewall can make it harder for an intruder
    to move beyond the firewall and attack other machines on the network. If the firewall
    is breached completely, an intruder will have access to the entire internal network.


    A firewall is a node on the network set up explicitly to handle incoming connections.
    It can route authenticated users from the nodes they have authorized access to
    and keep outside users localized to a specific node. A firewall consists of two
    primary segments. The first segment contains control mechanisms that take actions
    allowing access to services based on the level of authorization of a user. Here,
    a user may be a customer who has access to a Web site and associated files and
    inquiry services available to that site. This could be expanded to allow customers
    who have'
