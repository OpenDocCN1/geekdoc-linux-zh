  img_proc: true
- pgno: 50
  md: '+   Number of inodes needed for the file system. Each file requires an inode
    regardless of the size of the file. If many files are to be stored in the new
    file system, as is in a software development environment, a large number of inodes
    would need to be allocated.


    +   Whether the file system needs to be a block device or a character device.
    For information on device files, see the Hardware Administration module (Chapters
    4 and 5).


    +   Block size required. Necessary if your block size differs from the default
    of 1,024 bytes.


    +   Bytes per inode. Necessary if you need a specific number of bytes per inode.


    +   Amount of free space to be reserved.


    +   Whether you need a particular type of file system, such as BSD fast file or
    old System V.


    As noted, some of these parameters have defaults. To determine the defaults and
    minimum requirements needed, check the file system installation/configuration
    documentation provided with your operating system.


    # Creating the File System


    To create an file system called /dev/c1d2 in which to store several data files,
    enter


    ```

    # mkfs /dev/c1d2 10000

    ```


    This creates the file system as a block device, a special file type necessary
    if the disk drive where the file device is stored is also a block device (type
    b). The creation of the special block device file is also done using the mknod
    command, which is discussed in detail in the Hardware Administration module.


    In the above usage of the mkfs command, the number 10000 specifies the number
    of blocks; specifying the number of inodes is optional. When just the blocks are
    specified, mkfs creates one inode about every 2Kb of a 1,024-byte block. So, for
    a 10,000-block file system, mkfs creates 5,000 inodes, which should be plenty.
    To specify the exact amount of desired inodes, 2,500 for example, enter


    ```

    # mkfs /dev/data01 10000:2500

    ```


    To change the block size to a different multiple of 512 bytes for the file system,
    such as 2,048 bytes, add the -b option


    ```

    # mkfs -b 2048 /dev/c1d2

    ```


    ![](img/8f8a5b924793524d71746c72ac703b14_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 34 — Distributed UNIX System Administration


    The default to the -b option is 8,192 bytes, which is the logical block size of
    the file system.


    Other options are available to the mkfs user to increase compatibility with applications
    and other versions of UNIX. In addition to the -b option that specifies block
    size, the -I option specifies the bytes per inode, and the -m option specifies
    the amount of free space to be reserved. Some mkfs utilities, such as in System
    V UNIX, also have the -F option, which allows you to specify a particular file
    system such as the BSD fast file (ufs) or System V (s5) system. An example usage
    of mkfs with several parameters is


    ```

    # mkfs -F s5 -b 2048 /dev/rdsk/c1t0d0s1 102400

    ```


    When a new file system is created, any existing file in the file system is destroyed.
    Therefore, always make a backup before creating a new file system.


    Here, mkfs creates an older System V file system on the second partition of the
    first disk (or from /dev/rdsk/c1t0d0s1). This is discussed in the Hardware Administration
    module.


    The key attributes of your file system are stored in the files /etc/fstab or /etc/vfstab,
    your system configuration files. A system configuration file, read by the system
    at startup, determines what files are to be mounted at startup as well as a directory
    of information for your UNIX system on the available file systems. A new file
    system must be added to your system configuration file (fstab or vfstab). An fstab
    file may resemble the following:


    +   - /dev/0s1 /usr

    - /dev/0s3 /usr2

    - /dev/1s1 /usr3


    /dev/0s1 refers to the physical device. /usr refers to the file system name. The
    fstab file is used by the various mount commands, such as mountall, remountall,
    and mount. During booting, this file is read to automatically mount your file
    systems.


    # Mounting and Unmounting a File System


    When a file system is created, check it out right away. Before you can check a
    file system, you must know how to mount and unmount it. The command for the file
    system is mount, and the command to dismount the file system is unmount.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# File Systems — 35


    Follow these steps to modify an existing file system. Assume /data01 is a user-defined
    file system for data storage and you need to increase its size.


    +   1. Notify your users that you are taking the system down for maintenance.

    2. Shutdown your system to single-user mode.

    3. Enter single-user or maintenance mode, logging in as the superuser.

    4. Check to see that the file system is mounted. Run either df /data01 or mount
    (with no arguments) to see mounted file systems.

    5. Backup your file system to tape and verify that it is OK.

    6. Enter # umount /data01

    7. Enter # mkfs /dev/c0t0sdata01 819200 (to remake the file system)

    8. Enter # fsck /dev/c0t0s (to check out the new file system)

    9. Enter # mount /data01 (to mount the new file system)

    10. Go to the new file (# cd /data01) and restore your files from tape.

    11. Once everything is OK and you have no further maintenance to do, bring the
    system back up into multi-user mode. In this instance, you may want to check your
    file system configuration to make sure it has been updated properly; if not, make
    the appropriate changes to the file.


    Before beginning with the above procedure, make sure you are familiar with how
    to do each step, such as shutdown, backup, and restore.


    # Using fsck


    fsck is the foundation for maintaining a healthy file system in a UNIX environment.
    This file system checking utility must be run on a UNIX system on a routine basis.
    Running fsck regularly helps you recover your system in case of a hard shutdown
    and keeps your file systems from degenerating into unrecoverable messes. Most
    UNIX systems today run it automatically at startup.


    # Running fsck


    To run fsck you should always be in single-user mode. Enter the command by itself
    with no arguments, as in


    ```

    # fsck

    ```


    or with arguments and a specific file system, as in


    ```

    # fsck -D -y /dev/dsk/c0t0s0

    ```'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Distributed UNIX System Administration


    This line tells fsck to specifically check the /dev/disk/c0t0s0 file system, do
    some extra checking with the -D option, and answer yes automatically to all prompts
    with the -y option. A list of fsck options is shown in Table 2.1. These options
    provide considerable flexibility to the fsck command.


    When fsck runs, it goes through several steps up to six phases (some versions
    have five phases). Table 2.2 describes all six phases including the operation
    of the utility.


    # Responding to fsck Messages


    Step 1 may return an error such as:


    CAN NOT READ: BLK 1044

    CONTINUE?


    Because this could be a hardware error, your first response should be to record
    the reported block and answer with y for yes. If block reads continue with these
    errors, answer n for no. Too many failed block reads probably mean disk problems,
    such as a bad controller. Do not proceed further with fsck and get your hardware
    checked.


    > When an error message occurs in fsck, it usually causes termination. It is usually
    better to let fsck run to completion, then rerun it until the errors have been
    cleared.


    | Table 2.1 Key fsck options. | Option | Description |

    | y | Answers yes to all fsck queries |

    | n | Answers no to all fsck queries |

    | s | Rebuilds the free list (unconditional) |

    | S | Rebuilds the free list only if fsck phases 1-4 show no errors |

    | f | Does a fast check, ignoring fsck phases 2-4. Checks only block and sizes
    during phases 1 and 5 and may rebuild the free list during Phase 6 |

    | b | Forces an automatic boot if the root file system is changed and a boot is
    considered necessary |

    | q | fsck works quietly and may not report all problems |

    | D | Additional checks on directories including the . (dot) and . (dot dot) directory
    inodes |'
  merge: -1
  img_proc: true
- pgno: 54
  md: '| Step | Name | Description |

    | --- | --- | --- |

    | 1 | Read, write, and seek errors | Indicates a hardware error has occurred while
    checking the file system. When trying to access a block and the utility is prevented
    from reaching it, a seek error occurs. If the utility is unable to read from or
    to a block, a read/write error occurs |

    | 2 | Initialization | The superblock of the file system is checked to see if
    it is valid. The inode list is checked to compare with the size allocated to the
    file system. An error occurs if the inode list is reported as larger than the
    file system, indicating that the super-block no longer is reliable, hence corrupted
    |

    | 3 | Phase 1 | Checks blocks and sizes. The inode information on links, size,
    type, and addresses are checked |

    | 4 | Phase 1b | An additional pass through the inodes to check for duplicate
    blocks. Done if more than 10 duplicate or bad blocks are found |

    | 5 | Phase 2 | Checks directories and pathnames and compares data with information
    obtained from Phase 1 |

    | 6 | Phase 3 | Checks connections to directories and creates inodes for directories
    that could not be located during Phase 2. The utility will try to connect these
    directories to the lost+found directory, and if successful, this phase calls Phase
    2 again to check the connected directory |'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# 38 — Distributed UNIX System Administration\n\nfsck reports Step 2 errors\
    \ during the initialization. If you get a Size check showing a file size less\
    \ than the inode size, your file system is corrupted — specifically, the superblock\
    \ is corrupt. You will want to run fsck again check this error. The System V file\
    \ debugger fsdb is also used to check on the superblock with a syntax similar\
    \ to fsck, as such:\n\n```\n# fsdb /dev/os1\n```\n\nwhere the command is used\
    \ with the file system. If you are unsure of the physical name of the file system,\
    \ check the fstab file. The output from fsdb can be cryptic, and manipulating\
    \ the inodes reported by fsdb is risky. It is best to thoroughly check your user\
    \ manual on the use of options available with the fsdb command. When a size error\
    \ is consistent and the superblock cannot be repaired, it is best to re-create\
    \ the file system and restore it from your backups.\n\nStep 2 also checks other\
    \ initialization areas that are required for fsck to run successfully. This includes\
    \ a memory check, finding the root inode, ascertaining the file system is a block\
    \ or character device, and more. A common error reported during this step is that\
    \ the file system is mounted. In order for fsck to run on a file system, it must\
    \ be unmounted — the only exception is the root directory.\n\nStep 3 gives an\
    \ error that needs a response if data was inadvertently written to an unallocated\
    \ inode or if the inode was damaged. Errors such as UNKNOWN FILE TYPE or PARTIALLY\
    \ ALLOCATED INODE appear along with the inode number. You will be asked for a\
    \ {y|n} response to CLEAR these inodes. In doubt, answer y.\n\n| Table 2.2 (continued)\
    \ |\n| Step | Name | Description |\n| 7 | Phase 4 | Checks references to the link\
    \ count with the inodes found during phases 2 and 3. This phase allows duplicate\
    \ blocks and bad inodes to be cleared and updates inode link counts if incorrect.\
    \ |\n 8 | Phase 5 | This phase checks the free list, which includes checking block\
    \ addresses and making sure the allocated blocks to the file system are there\
    \ and the integrity of the blocks are intact. |\n 9 | Phase 6 | During Phase 6,\
    \ the free list is rebuilt. |"
