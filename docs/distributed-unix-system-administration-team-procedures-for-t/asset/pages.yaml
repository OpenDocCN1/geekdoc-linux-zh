    # # Downloading Tools for UNIX


    The Internet is an unchanging source of tools and learning material for the UNIX
    user and administrator. In news groups, you can share ideas, problems, questions,
    and playgrounds or just ''lurk'' about seeing what others are saying. In addition,
    through the various tip sites, you can download a mountain of software that can
    be incorporated into new-home—from editors and utilities to security programs
    and network daemons.


    This book recommends software freely available at official and unofficial websites
    through The Free Software Foundation GNU project. GNU''s Bulletin, vol. 1 no.
    5, the FSF describes its purpose (see http://www.cs.pdx.edu/~trent/gnu/bull/05/015.html#SEC5).


    The Free Software Foundation is dedicated to eliminating restrictions on people''s
    right to use, copy, modify, and redistribute computer programs. We do this by
    promoting the development and use of free software. Specifically, we are putting
    together a complete, integrated software system named "GNU" (pronounced "guh-new",
    "GNU''s Not Unix") that will be upwardly compatible with UNIX. Some-large parts
    of this system are already used and distributed.


    The word "free" in our name refers to freedom, not price. You may or not pay money
    to get GNU software, but either way you have two freedoms you get: first, the
    freedom to copy a program, and distribute it to your friends and coworkers; second,
    the freedom to change a program as you wish, having full access to source code.
    You can study the source and learn how such programs are written. You may then
    be able to import it, and share its changes with others. If you redistribute GNU
    software you may charge a fee or give it away, so long as you include the source
    code and the GPL (i.e. General Public License).


    Other organizations distribute free software happens to be available. By contrast,
    the Free Software Foundation concentrates on the development of new free software,
    working towards a GNU system complete enough to eliminate the need for a proprietary
    system GNU, the FSF distributes GNU software and manuals for a distribution fee,
    and accepts gifts (tax deductible in the U.S.) to support GNU development. Most
    of the FSF''s funds come from its distribution service.


    The reader will want to explore the site at http://www.gnu.org for the latest
