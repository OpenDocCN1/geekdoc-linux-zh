- pgno: 24
  md: 'Users each have their own profile in their home directories. The user profile
    can be customized for a particular user or class of users. Therefore, it is possible
    to set up a profile type for each user across enterprise systems. This allows
    users to have access privileges and the appropriate environment for their needs.
    Also, a system profile is generally kept at /etc/profile that provides system-level
    configurations persistent for all users.


    In the example .profile, the # sign indicates a standard comment statement for
    shell programming and C programs. The capitalized words are environment variables.
    The line PATH=$HOME/bin:$PATH assigns the current directory (.) to the PATH variable.
    A $HOME directory, for example /usr, is assigned to $HOME as well as to the PATH
    variable, which may have an assignment. This line assigns the user''s personal
    path to the PATH variable in the profile. Each path assigned to PATH is separated
    by a colon (:).


    After assigning, complete the configuration by placing the variable in the environment
    so it is recognized as the correct variable assignment. After assigning, export
    the PATH variable using the export command. The same is done for a proper terminal
    assignment; that is, the terminal type (vt100) is assigned to the variable TERM,
    TERM is exported. Finally, .profile kicks off a specified user menu with the line
    exec /usr/local/bin/usermenu2. This menu may contain whatever applications and
    system access the system administrator wants to grant that particular user. For
    instance, a general user will have different needs than a software developer,
    so the system administrator might configure standardized environments for user
    types.


    Classifying the types of users on your system and properly setting up environments
    is of utmost importance. What really controls the user interaction and access
    to the system is the shell environment. A user who can access the shell directly
    can change environment variables. In some cases you may want this, but in others
    the ability to change shell variables would be undesirable, and the user''s shell
    usage might be restricted. For instance, accessing a Web page through the Internet
    does not give access to the system $HOME but you may get and write privileges
    through a Common Gateway Interface (CGI), in which case, going to a Web page and
    being able to drop a shell environment would cause security problems.


    By setting exporting variables, it is possible for a user or administrator to
    see what variables are set for a shell, use the env command.


    ```

    $ env


    MENU_DIR=/usr/local/menu

    LOGNAME=wetsch

    MAIL=/var/mail/wetsch

    TERM=vt100

    ```'
