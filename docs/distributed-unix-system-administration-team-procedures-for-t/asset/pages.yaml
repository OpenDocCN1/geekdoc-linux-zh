- pgno: 67
  md: '50—Distributed UNIX System Administration


    # # Interrupting a Process


    At times, processes do not behave as expected. They may run forever and appear
    stuck. They may appear to be running but may not be doing anything, as with a
    defunct process. They may be doing something the administrator does not, like
    as filling up the root file system with a continuous write to the /temp directory.
    The ps command allows you to find the process ID of an err process so you can
    get rid of it. For instance, ps -ef produces a page-by-page listing of all processes.
    You can exit this listing at any time by pressing the q (for quit) key. If you
    see a defunct process


    ```

    mollyb 7950 5006 08 00:10:49 pts/15 0:01 <defunct>

    ```


    wait a few seconds and run ps again to see if the process is still defunct. (Defunct
    processes are also known as zombie processes.) If the process persists, run the
    kill command to terminate it.


    The kill command sends an interrupt signal to the currently running process. Table
    3.1 lists the various signals available to the kill function. These signal interrupts
    are used in shell programming to provide specific actions to your program for
    a specified event.


    To kill for UID mollyb without regard to consequences, use:


    ```

    # kill -9 7950

    ```


    To get rid of UID mollyb and all related child processes


    ```

    # kill -9 5006

    ```


    When signal 9, the SIGKILL parameter, is passed to a process, it causes an abrupt
    halt to the process. This option does no cleanup to the zombie process and may
    even cause other processes connected to it to become zombies. You will have to
    manually clean them up. If the zombie process is related to a database application,
    the -9 option coming from the superuser may cause damage to other related database
    processes, such as stored procedures that were executed, possibly leading to database
    corruption. Therefore, although the -9 can be useful, it is best to reserve it
    for removing processes that cannot be removed with other options. Also, if your
    kill command does not remove the zombie process, you have to search for the parent
    process and remove it. If the parent process is a zombie and cannot be terminated,
    you then need to reboot the system to remove the zombie.

    Zombies usually do not adversely affect your system but can be a nuisance. Therefore,
    do not immediately intend to reboot your system if you cannot remove the zombie.
    Assess the situation first, it may not be as severe as you think. If possible,
    wait to reboot during a regular maintenance cycle. If your zombies are frequent
    and filling up'
