    The responses to undergraduate and graduate degree major were broken down into
    three categories. The first category was CS/MIS to indicate personnel who had
    a major in computer science, management information systems, or a related discipline.
    The second category was Technical to refer to technical degree majors that were
    not specifically CS/MIS, such as electrical engineering. The third category was
    Other and it included all degree majors that were not Technical or CS/MIS.


