- pgno: 86
  md: '# Chapter 4


    # Communicating With

    Peripheral Devices


    The physical layer of a computer system is the actual hardware your system uses.
    Peripherals that a UNIX system must communicate with and control devices such
    as hard drives, floppy drives, tape drives, printers, network connections, and
    RAM.


    # Device Files and Drivers


    # Device Files


    The UNIX kernel communicates with peripheral devices using a type of file known
    as a special file or device file. The system uses the device file as the interface
    to the device. All devices with which the system communicates require a device
    file. Located in the /dev directory, device files consume no disk space and have
    no blocks allocated to them.


    The /dev directory can contain literally hundreds of files required by a system.
    These files are of three basic types: regular files (a normal UNIX file), directory
    files (directories and subdirectories), and special files (device files). UNIX
    interacts with special files the same as it does with ordinary files. File permissions
    on special files are read the same as with any other file, and user and owner
    privileges can be set as'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 70 — Distributed UNIX System Administration


    needed. I/O to these files is handled in the same way I/O is handled by other
    files in a UNIX system. In addition, the inodes for the special device file provide
    the usual file type information, which includes a means to identify whether the
    inode is a block or character type. Consequently, the operating system always
    believes it is communicating to a file, even though these files are of a special
    type.


    Other advantages of UNIX I/O with device files, which is basically how UNIX handles
    all I/O, include:


    +   * I/O can be redirected to another file.

    * I/O can be redirected to other peripherals.

    * Device driver I/O is handled the same way as I/O to other files.


    Device files are of two types: character and block. Character files allow I/O
    to be transferred a single character or byte at a time, whereas block files allow
    I/O to be buffered, usually in increments of 512 bytes/block, before transferring
    the block.


    # Device Drivers


    To complete the interface between the device file and the kernel is the device
    driver — the code in the kernel that implements the interface with the peripheral
    device. For device drivers to be recognized by the system, they must be loaded
    into your kernel. Early UNIX systems required that a user manually enter the device,
    shutdown the machine, and restart the system to make the device active and to
    bring the device online for the first time. Now, loading a new device driver manually
    is less frequent. Many vendor-supplied devices can be recognized by the operating
    system. Also, SCSI (Small Computer System Interface) drivers in a system can be
    configured for SCSI devices. In addition, many devices can come with setup scripts
    to get the device up and running on a system.


    Understanding the interaction between the operating system, drivers, special files,
    and hardware can prepare you to fix and isolate problems and manually load a device
    driver. The operating system communicates with a device driver using a device
    file in /dev or an associated subdirectory. The device file identifies the type
    of device and the specific hardware component the system will be communicating
    with, using a numbering convention referred to as major and minor numbers.


    # Naming and Numbering Conventions


    Understanding what the name of a special file means and to what the major and
    minor numbers refer can get confusing. A listing of /dev might look something
    like:'
