  md: '# What’s on the Disk?


    The Distributed UNIX System Administration Companion Disk includes the author’s
    SAmatrix, a C++ program with an MSWindows user interface for managing operating
    systems.


    SAmatrix requires Windows 3.1 or higher.


    SAmatrix is a tool for assessing system administration and system management practices.
    Using the information provided in the book and from other system management sources,
    a user can develop a comprehensive set of assessment questions for a specific
    computing environment.


    The program applies a robust statistical analysis to the data gathered in a manual
    survey. The analysis provides feedback on whether or not the system is at risk.
    A database of more than 100 assessment questions is provided for each of the five
    modules: Software, Hardware, Network, Security, and Operations. The user can customize
    an assessment tool for a specific system based on this framework.


    Both a complete description of the disk’s contents and a user’s guide are provided
    in Appendix F on page 299 of the book.'
