  md: '# The SAmatrix Case Study — 215


    +   17. How often do you provide security training to your users? The acceptable
    responses to this question included Monthly, Biannually, and Annually.


    +   18. How often do you provide database application training to your users?
    The acceptable responses were Daily, Weekly, Monthly, Annually, or As needed.


    +   22. How often do you implement your backup procedures? The acceptable responses
    were Daily or Weekly.


    +   23. How often do you run fs on your systems? The acceptable responses were
    Daily or Weekly.


    +   24. How often do you check your database statistics? Acceptable responses
    were Daily, Weekly, or Monthly.


    For the organization to qualify for analysis of its matrix modules, except for
    network administration, it had to answer yes to question 1 (Are your systems primarily
    UNIX?). To qualify for analysis of the network administration module, a site had
    to answer yes to question 3 (Are UNIX servers networked?), 10a–10f (What network
    services do you provide to users?), or 11e (Do you interconnect your office environments
    to your UNIX services?). These questions help determine the environment at the
    specified location because not all sites were mature in their implementation of
    the organization''s technological infrastructure.


    The matrix results are derived from Tables 11.1 and 11.2. This derivation starts
    with the module categories each question was assigned to one or more modules and
    reported in Table 11.2. Variable names were assigned to each question. Definitions
    of each variable name were provided in Appendix B. The matrix of Table 11.2 provided
    an efficient means to cross question assignments with their applicability to the
    modules of Table 11.1.


    The number of variables assigned to Software Administration (SA), Hardware Administration
    (HA), Security Administration (CA), Network Administration (NA), and Operations
    Administration (OA) were 35, 14, 60, 16, and 70, respectively. The variables assigned
    for the maximum number of answers for each assessed site module (MAX). Negative
    responses from each site (NEG) were subtracted from MAX and this result was divided
    by MAX. In cases where responses to the instrument questions were deemed invalid,
    the variable MAX had to be adjusted accordingly. The result of equation 1 provided
    the matrix result value (MATX) for each site module.


    ```

    (MAX - NEG)/MAX = MATX_Module

