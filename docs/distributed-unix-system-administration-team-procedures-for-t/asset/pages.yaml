  img_proc: true
- pgno: 191
  md: '# 174 — Distributed UNIX System Administration


    +   - Information classification and disclosure standards

    - Corporate ethics


    These are all important considerations. Even for small organizations, they are
    important and they do not need to be elaborate. For instance, any business, large
    or small, considers its financial information confidential. Personnel working
    on the system must understand the need for security and the use of proper business
    ethics when dealing with any information system. A large part of policy is to
    prevent users from using company resources for personal business or even for a
    business on the side. Occasional personal e-mails are usually permissible, but
    much more is an improper use of computer resources. A company that monitors employee
    e-mail must make it known to them.


    In case policy, and hence security, is breached, the consequences must also be
    spelled out. In addition, employees should know who to contact with questions
    on policy or to report a security breach. Security policy and consequences cannot
    violate employment law. Use common sense, be fair, but do not compromise the security
    of a system by being lax.


    Annual training also should be done. This does not entail getting all of the employees
    together and spending a day going through security policies, issues, and concerns.
    Employees should already be aware of the requirements, but an annual reminder
    in the form of a memo on the established policy helps to reinforce system security.
    Similarly, if a policy changes, be sure employees are made aware as soon as possible;
    otherwise, unintentional security breaches may occur that will lead to aggravation
    and frustration.


    # Sample Security Policies


    Based on the security policy and user class access, here is a sampling of some
    policies. The policy takes a standard form and is designed to meet rapid change.
    If a policy is added or modified, it easily can be inserted or replaced into the
    policy and procedures manual. In addition, the manual should contain preliminary
    information on the purpose and intent of the document in the form of an abstract,
    appropriate system definitions, and an outline of the various policies correlated
    to the multilayer model. A suggested layout for these policies follows.


    | Number: | Approved By: |

    | Title: | Dept: |

    | Effective Date: |

    | User Level: |

    | Init State: |'
