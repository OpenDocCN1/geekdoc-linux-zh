- pgno: 158
  md: '# Chapter 8


    # # UNIX Security


    Security administration is a primary concern of any computer system that holds
    business, industrial, government, or personal information. Information is an asset
    not necessarily meant to be freely distributed.


    Security measures protect stand-alone and networked computers from deliberate
    and accidental harm. A deliberate attack on a computer system includes such events
    as someone breaking into a system and looking around and attacks that deny a service,
    destroy files, or cause a system to crash. Accidental harm occurs when files are
    unintentionally erased or during an unforeseen event, such as a major storm disrupting
    the system.


    This chapter focuses on basic UNIX security provided by the kernel. The component
    of the kernel that provides this security is called the trusted computer base.
    Some security features available in the UNIX environment have already been discussed,
    such as permissions, the root user, and the directory structure.


    # # Security Concerns


    A system can be compromised at different levels, and an administrator must be
    aware of them all. Security measures must enhance rather than jeopardize these
    areas of concern, or they reduce the value and usefulness of a system.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 142 — Distributed UNIX System Administration


    First, data integrity must be kept intact by protecting data from alteration or
    removal by unauthorized persons or acts. Second, access to a system must be controlled,
    also referred to as isolation, so that existing files are not changed or unauthorized
    files added. Third, the level of service, or system availability, must be satisfactory
    for authorized users.


    Related access and availability are the additional security concerns of privacy
    and system behavior. Privacy controls access to information. For example in a
    business, access to personnel data should be limited to authorized management.
    Account numbers, social security numbers, and other identifying characteristics
    of customers and employees must be kept private, and a security scheme must be
    developed to protect this information.


    System behavior is a variation of availability. Users expect a system to behave
    the way each time it acts. Changing behavior can create a problem. For instance,
    a database upgrade that loads new files without the correct permissions could
    exclude a qualified user from accessing necessary functions. A worse case would
    be a utility started behaving with unpredictable results. For example, it is entirely
    possible for someone to replace a utility file such as a script file of the same
    name that contains a command to delete files owned by root.


    An administrator must remember that no system is 100 percent secure. Protection
    from an outside attacker or a disaster does not protect against the actions of
    authorized users of a system. Authorized users may cause security problems intentionally
    or accidentally. The method used to track users on a system is referred to as
    auditing. Applications on a system may have their own audit trails built into
    them. At the system level, tracking who is using the system, and when, can be
    implemented. Auditing may not prevent a security breach, it provides a way to
    trace the breach. Also, auditing may deter potential malicious users from attempting
    an attack.


    When implementing security measures, a considerable number of system components
    must be monitored, as listed in Table 8.1.


    # User and Group IDs


    Whenever a process is executed, it is given a process ID (PID). Additional IDs
    are also assigned to processes. These IDs are a user identification number (UID)
    and a group identification number (GID). It is through the UID and the GID that
    permissions can be assigned on a file at the user and group level. The identity
    of a user can be changed using the su command. To use su, a user, with the exception
    of root, must know the user''s password.


    The newgrp command changes a user to a different group. You can only change to
    group to which you have assigned. Assignments are kept in the /etc/group file.
    The line


    ```

    dbdam: :root, admin, wetsch

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Table 8.1 System components to monitor.


    | Security concern | Description |

    | --- | --- |

    | System files | The owner of key system files, usually root, is an authorized
    de superuser with rwx privileges. World w privileges should never be granted.
    Group w privileges are not recommended unless the group is comprised of authorized
    users. Modification dates and times should also be consistent with these files.
    |

    | Devices | Device files should be stored centrally in /dev. Permissions to these
    files should be monitored carefully. Setting a link to a storage device with rw
    privileges should be provided to prevent direct rw access to the device. For TTY
    devices, world m permission should not be allowed. Modification dates and times
    should also be consistent with these files. |

    | User files | A user''s home directory should not have world or group privileges.
    Check that hidden files (.files) cannot be written or owned by someone other than
    the user. Also, if the administrator does not want the owner to modify startup
    dot files, the owner privileges should be set to rx. |

    | Suspect files | Files on a system that resemble system executables, such as
    cp, rm, ls are not in the proper directory. These are suspect files that could
    cause damage or breach security when executed. Liken these files to suspicious
    packages. |

    | Special files, and daemons | There may be proprietary devices files, and daemons
    available and loaded on a system for special purposes. Check to make sure permissions
    are set correctly when installed and include checking permissions as part of a
    regular system level check. Generally, the owner has rwx privileges and the group
    and world may have rx authorization. |

    | Network files | Network files can be invaded. Check /etc/hosts and /etc/hosts.equiv
    files for unauthorized IP addresses. An unauthorized address in /etc/hosts.equiv
    means an untrusted machine makes it as a trusted host to the local host. |'
  merge: -1
  img_proc: true
- pgno: 161
  md: '144 — Distributed UNIX System Administration


    # Table 8.1 (continued)


    | Security concern | Description |

    |---|---|

    | Log files | System log files should be checked on a regular basis (such as lastlog,
    utmp, and wtmp). If the system uses su command, check the sulog file to monitor
    who uses it. Keep track of the contents in log files maintained for services used
    (i.e., ftp). Check services files. For greater protection, substitute sudo for
    su. Only authorized users are specified command privileges when using sudo. |

    | Networking | 1) When using login to access a trusted host (i.e., hosts in the
    /etc/hosts.equiv file), a password is not required.

    2) If using NFS, check and set the access privileges and authentication of file
    systems exported, as required. Check /etc/exports. Security options can also be
    set for a mounted shared file system in the /etc/fstab. The exports command lists
    what file systems are being exported.

    3) If using sendmail, be sure the version does not predate 1989. Be sure that
    debug in sendmail is not active. Also, the wizard password should be disabled;
    otherwise, a user could execute a shell owned by root, which would exceed the
    privileges granted by a user.

    4) Use a current version of finger. Older versions, up to November 1988, have
    the hole that was exploited by the Morris worm.

    5) Be careful using tftp, also called trivial ftp. Usually user authentication
    is not part of tftp. If using it, try to access a file on the host without authentication.
    If access attempts fail, then the tftp version is probably OK, otherwise update
    it. |

    | RPC | A remote procedure call that is used extensively in internetwork traffic.
    Secure RPC (from Sun) is a possible solution, or Kerberos authentication can be
    added to the system. Be sure you understand the features and limitations of implementing
    these methods before you choose one. |'
  merge: -1
  img_proc: true
