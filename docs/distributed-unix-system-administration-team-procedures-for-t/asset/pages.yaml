  md: '# 112 — Distributed UNIX System Administration


    net.net.host.host to net.net.net.host, reducing the potential hosts from more
    than 64,000 to a maximum of 254. Hosts outside the Class B network still see only
    one Class B address. Hosts within the Class B network see 254 Class C-like subnets,
    instead of the true number of hosts actually on the Class B network.


    To implement subnetting, a subnet mask applied at startup overrides the kernel
    instructions to determine the network portion of the address. The mask assigns
    the value of 255 (binary 1s) to the network bytes and 0 (binary 0) to the host
    bytes. The file used in UNIX systems to implement a subnet mask is /etc/netmasks,
    shown in the following example.


    ```

    # The Netmasks File

    # Use IP Address Type for Mask

    #

    # Format: Network-Address Mask-Address

    # i.e. 128.35.0.0 255.255.255.0

    #

    132.55.0.0 255.255.255.0

    ```


    As shown, the network 132.55.0.0 is masked by hex ffffff00 to produce the subnet
    address 255.255.255.0 used by this host.


    # Port Addresses


    IP addresses identify processes. To specify certain processes, such as e-mail
    and ftp, a two-byte number called a port address supplements the IP address. Port
    addresses can have a value of 0 to 65535. When a machine connects to a system,
    it must be able to start up process on the machine at the destination address.
    To do this, a port address is used that will be able to recognize the appropriate
    access method.


    Certain port addresses are reserved for special uses. First, port 0 to 1023 is
    reserved for certain services and for assignment by the superuser. For instance,
    telnet services are assigned to port 23, ftp to port 21, SMTP (Simple Mail Transport
    Protocol) to port 25, and on. Ports greater than 1023 can be used and assigned
    to any process. (For more information on network services see Network Services
    later in this chapter.)


    # Address Mapping


    For convenience, the long number of an IP address is usually mapped to a text
    name. Complex networks and nodes connected to the Internet use the Domain Name
    System (DNS), a distributed database that stores host name, IP address, and mail
    routing information. Simple networks use a UNIX file /etc/hosts. In /etc/hosts,
    the IP addresses of the localhost and other hosts are mapped to their symbolic
    names. Whenever you add a server to your network, the /etc/hosts file must be
    updated to reflect the new server. A typical /etc/hosts file is shown below.'
