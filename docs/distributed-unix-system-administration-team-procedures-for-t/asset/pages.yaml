  md: '# 60 — Distributed UNIX System Administration


    /bin/su -adm -c /usr/lib/acct/acct is entered in this file. Also, shutacct is
    used to stop accounting when shutdown is invoked.


    With this background information on the accounting process, look at an overview
    of the accounting system. User adm has an account subdirectory, in which the additional
    directories fiscal, nite, and sum are found. Just remember that the accounting
    utilities are at /usr/lib/acct (Figure 3.1).


    The fiscal directory is used to set up your reporting periods, which can be specified,
    but the default is monthly. The fee file is used to enter any specific charges
    assigned to a user in add what you incorporate into your accounting system. Using
    the chargefee command, enter


    # # chargefee wetsch 15


    The nite subdirectory keeps accounting records that are processed daily, records
    on system status, and disk accounting records. Within the nite subdirectory contains
    the diskacct file, which contains disk usage data. Collective reports and records
    from system accounting are kept in the sum directory.


    The complexity of the System V accounting process is in the placement of the files
    in the user adm directory, the accounting utility files, and the wtmp and pacct
    files. But the use of of this system is in reporting the accounting data. As noted
    above, reports are stored in the sum subdirectory and contain the month and day
    of the report generated. Three basic account commands are used to generate reports,
    and you can activate these automatically using cron or manually as needed. These
    utilities are:


    +   * /usr/lib/acct/ckpacct


    +   * /usr/lib/acct/runacct


