- pgno: 109
  md: '# 92 — Distributed UNIX System Administration


    Other print options to explore remote print features as well as variations to
    lp that differ between UNIX versions.


    # BSD Printing


    # Starting the Printing Process


    BSD systems use a different print method than System V. The lpr command queues
    data for printing and places the data in the spooling directory. Then the BSD
    print daemon, lpd, checks the queue to find a print job and sends the job to the
    printer. lpr is usually located in /usr/lib. Other programs may be used for printing,
    such as pr, but these programs call on lp for queuing and lpd for printing. Before
    lpr queues a print request, it must know how to handle the data; that is, it must
    know the destination, communications requirements, and details of the printing
    environment. lpr obtains this information from command line arguments for the
    lpr command, environment variables, and the global system configuration.\ For
    example, to specify a printer with lpr use the -P option as follows:


    ```

    # lpr -Plaser2 filename

    ```


    Other command line flags are described in the UNIX documentation.


    # Configuring the Printing Environment


    In the above example, the printer destination is specified. If a destination is
    not specified, lpr uses the default printer defined in the /etc/printcap file.
    The printcap file specifies printing environment variables in the same way that
    the termcap file specifies terminal information in System V. Some of the key variables
    in the printcap file are located in Table 5.9. Other variables are described in
    the UNIX documentation.


    Print filters are also referenced in printcap. The filters are if, lpf, or of.
    If and of filters are for input (i) and output (o) to the printer. lpf records
    the accounting data.

    /printcap also lets the print driver know where to spool the print jobs. As with
    the previous laser2 example, the typical location for spooling information is
    at /var/spool/laser2.


    When job information is submitted, lpr creates two files. One file is the job
    number of the print request and the second file is the data referenced by the
    job number. The job number allows you and the system to track and complete the
    print job and kill it if necessary. The name of the file that controls the print
    job, known as the control file, begins with the letters cf. Similarly, the name
    of the data file begins with the letters df. For information necessary for printing
    control on BSD systems, view print jobs by entering lp at the system prompt. lpq
    provides status information for all requests on the queue, including rank on the
    queue, making the request, job ID, where it came from (such as a file or a named
    pipe), and size of the job in bytes.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Spooling and Printing Control


    The lpc command controls spooling and printing. The interactive commands available
    to lpc are shown in Table 5.10. If you experience printer problems, lpc will not
    be the most reliable means of fixing your system. For the following lpc examples,
    use the actual name of the printer (e.g., laser2).


    The root user, you may want to remove all print jobs. To do this,


    +   # lpm -


    To remove all of the jobs from a specific printer enters


    +   # lpc

    # lpc>clean laser2


    or just simply


    +   # lpc clean laser2


    where laser2 is the name of the printer.


    | Table 5.9 BSD /etc/printcap variables. |

    | Variable name | Description |

    | af | Accounting file variable for the printer. Provides information on printer
    usage. |

    | br | Baud rate Looks a lot like the termcap entry, such as br#14400 |

    | fc or fs | Variable to set flags. fs is also used to control parity, delays,
    data flow, echo, etc: for serial printers. Note: These are actually settings:
    fc clears the flag; fs sets a flag. |

    | lf | Printer error log variable. Usually found at /var/adm/lpd-errs |

    | lo | Variable providing the lock filename. |

    | lp | Points to the actual device name of the printer. When this variable points
    to a nondescript printer file, it typically means that it should be pointing to
    a network printer. |

    | rm or rp | Accesses remote printers. |

    | sd | Spool directory for each printer. |'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 94 — Distributed UNIX System Administration


    To specify a particular job, enter


    # lprm 235

    where 235 references the ID of the job, which can be obtained with lpq. You can
    also

    remove print jobs for a particular user by entering


    # lprm wetsch

    where wetsch is the user ID of the user whose print jobs you want to remove.


    Table 5.10 BSD lpc commands with syntax.


    | Command | Syntax | Description |

    | --- | --- | --- |

    | abort | abort printer | Terminates current printing activity on printer. Restart
    print job using start. Considered more abrupt than stop. Print jobs remain in
    the queue. |

    | clean | clean printer | Clears the print queue for the specified printer. |

    | disable | disable printer | Prevents the printer from accepting new print jobs.
    To prevent an abrupt printer shutdown, use stop after a disable command. |

    | down | down printer [message] | Disables the queue and stops printing. Add a
    message so that users are notified when they run lpq. The same as disable + stop
    commands. |

    | enable | enable printer | To be run after disable to restore the print queue
    and printer for use. |

    | help | help [lpc command] | Provides help for lpc commands. |

    | start | start printer | Resumes printing jobs in the printer queue after an
    abort or stop command. |

    | status | status printer | Provides status on the specified printer. |

    | stop | stop printer | Stops the printer but still allows users to enter jobs
    into the print queue. Resume with a start . A good command to use during routine
    printer maintenance. |

    | up | up printer | Combines enable + start to enable the queue and resume printing.
    |'
