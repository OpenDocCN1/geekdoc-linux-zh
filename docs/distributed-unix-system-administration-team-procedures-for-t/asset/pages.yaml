- pgno: 18
  md: '# Chapter 1


    # The Basics


    The fundamentals of learning UNIX system administration are understanding the
    operating system, knowing the key components, and developing an understanding
    of file organization. The UNIX operating system is a combination of processes,
    files, and tools, all controlled by the kernel, the UNIX component responsible
    for managing system tasks. These components give UNIX its strength as an enterprise-wide
    operating system capable of functioning in nearly every computer environment and
    platform.


    # Operating System Overview


    UNIX is a set of software programs that allows the computer and the user to interact.
    This man-machine interface is key to the successful operation of any UNIX system
    and allows control of the computer, provides packages of tools to facilitate customization
    of the environment, and is the actual interpreter between you and the machine.


    A UNIX system has three basic layers, as depicted in Figure 1.1: the kernel, the
    shell, and programs.


    The top layer contains the environment that the user interacts with directly.
    The programs and tools used by the system include utility programs that come with
    the system or were developed by an administrator; programs, tools, and data files
    for networking and communications; and database, word processing, programming,
    and other user applications.


    To use the top layer, an intermediary is required to interpret and execute instructions
    and responses between the user and the bottom layer. This intermediary is the'
  merge: -1
  img_proc: true
- pgno: 19
  md: '2 — Distributed UNIX System Administration


    shell. A system program, the shell acts as a language interpreter, a customizer
    of the operating environment, and a translator of all requests submitted to the
    computer. Multiple shells are able to run on top of the kernel, giving each user
    a working environment with the ability to run multiple tasks with multiple users.
    Variants include the C and Korn shells (to be discussed in more detail later)
    among others.


    # Figure 1.1 Basic UNIX system.


    ![](img/8f8a5b924793524d71746c72ac703b14_19_0.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# The Basics — 3


    The heart of the UNIX operating system is the kernel or bottom layer as shown
    in Figure 1.1. The kernel is loaded into memory and stays operational for as long
    as the computer is on. It is through the kernel that you have access to your machine.
    It is responsible for computer access control system resource allocation, system
    maintenance, and memory management. Without the kernel you would not be able to
    access or use files, interface with the computer, or have an operational UNIX
    environment.


    # Shells


    A shell is an interactive program executed either when the user logs in, or by
    use from another shell. A shell determines the operating environment and can sometimes
    be distinguished by its prompt. The executable shell, descriptive name, and prompt
    for some shells are:


    | Shell | Name | Prompt |

    | sh | Bourne shell | $ |

    | bash | Bourne again shell | $ |

    | ksh | Korn shell | $ |

    | csh | C shell | % |

    | jsh | Job Control shell | $ |

    | zsh | Z shell | % |


    The most common shells are the Bourne shell (sh), the C shell (csh), and the Korn
    shell (ksh). These common shells with commercial UNIX OS products, others shells
    like the Bourne Again shell (bash) and the Z shell (zsh) are in the public domain
    and can be obtained from public sites like GNU. Shells are case sensitive and
    are much like any other program. Your working shell becomes active when you log
    onto the system and does not terminate until you have logged off. It is the heart
    of the man-machine interface as it translates your requests and puts needed programs
    in memory and executes


    The power of UNIX is in, it is through the shell that the system administrator
    controls the system. Not just as an interpreter, the shell also provides scripting
    capabilities that allow you to build your own tools. Skilled shell programming
    can also become a cornerstone for the success of the system administrator. Being
    able to write shell programs will allow the administrator to interact with all
    layers of the UNIX environment from applications and security to networking and
    system management.


    The shell programs are found in the /bin directory. The Bourne shell is the original
    shell and it can be executed as /bin/sh. The C shell, with a syntax that resembles
    /bin/csh. The Korn shell, written to merge the best features of the Bourne shell
    and C shell, can be found at /bin/ksh.'
