- pgno: 193
  md: '# 176 — Distributed UNIX System Administration


    Miscellaneous Tasks:


    +   1. Update time zone changes as needed. Report change on the appropriate task
    checklist.

    2. Perform biannual performance checks and diagnostics on the system. These are
    to be done during monthly downtime. Suggested times are January and July of each
    calendar year.


    Number: SPP-02

    Title: Automated Security Procedures

    Effective Date: 10/01/1996

    User Level: 0

    Init State: 2, 3


    Security Notes: Most XYZ Company automated security procedures are invoked from
    the crontab file. The file used by crontab is /etc/admincron. This file provides
    the automated security checks for XYZ computers. Modifications to this file can
    only be made by system superusers. The security files are contained in the admdirectory
    with backups in the SA repository.


    System Configuration: For use on all XYZ systems except for the training center
    computer. The machines involved are xerxes, yarns, and zeus.


    Implementation Procedures: The security files used by admincron are:


    +   * joacctchk

    * chklsfile

    * autologout

    * login


    > joacctchk is a program run from crontab that tests the system for "joe" accounts.
    These accounts are whereby the user was able to establish a weak password that
    is the same as the log-in ID or any password account. The operating system protects
    against account passwords that are the same as account logins. The operating system
    requires users to use at least one nonalphabetic character in their passwords.
    Violations of system password integrity are therefore checked by joacctchk.


    The chklsfile program, run from crontab, provides a list of files considered key
    system files. When this program runs, a copy of the files is checked against the
    master list. Because of the dynamic nature of some system files (i.e., password
    and shadow files) a new master list must be made on a periodic basis. When discrepancies
    are reported, they are checked to determine if the system has been checked or
    if an adverse condition exists.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# The Multilayered Security Model — 177


    The autologout program, run from crontab, is designed to check the system every
    20 minutes for user inactivity. Users who have been inactive at their terminal
    for more than 20 minutes will receive a warning message and then have 60 seconds
    to become active before being logged out. Warnings and logoffs are reported in
    the file logoutlog.

    The-in feature is inherent to the UNIX operating system and records unsuccessful
    log-in attempts. A user trying to access the system has five attempts. After the
    fifth unsuccessful log-in attempt, the system will record the login and TTY used
    in the file login.


    +   Misc. Notes:

    1. Results of the joacctchk and chkfile program are recorded daily on the daily
    checklist sheet and the printed console display.

    2. The login and logout files are printed and reset every month.

    3. On a weekly basis, the checkfile must be reset. The SA will move the checkfile
    into an archival storage location and then mv checkfile.new to checkfile.


    Number: SPP-03

    Title: Automated System File Storage for Transfer

    Effective Date: 10/1/1996

    User Level: 0

    Init State: 3


    Security Notes: These automated procedures provide a monthly system backup of
    important system-related files. The files are moved to a central system storage
    area on a monthly basis and then are backed up to tape, after which they are removed
    from the system. The system requires the use of crontab on a monthly basis to
    do the required tasks.


    System Configuration: crontab executes the file /adm/store.month. The files specified
    in store.month are transferred to /translog/MONTHLY.


    Implementation Procedures: After execution of store.maint the files can be backed
    up to tape, verified, and removed from the system.


    Misc. Notes: The command used in store.month is mv.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 178 — Distributed UNIX System Administration


    Number: SPP-04

    Title: Daily Incremental Backups

    Effective Date: 10/1/1996

    User Level: 0

    Init State: 3


    Security Notes: The file /adm/incback has only superuser -rwx privileges. This
    file is initiated by the cron daemon for off-hour automated incremental backups.
    A dated log file is placed in the directory /translog/back on machines xerxes
    and zeus. On yarn these files are placed in /usr/storage. These log files are
    archived to tape on a monthly basis to the monthly tape. The validation file is
    also stored in hardcopy format.


    To prevent writing tapes by all users other than superuser, the write privileges
    have been removed for normal user access on /dev/tape.


    System Configuration: The daily incremental backup provides a backup of all modified
    and new files created during the date of the backup. This method serves to supplement
    the monthly backup tapes. For verification, the incback file runs a cpio scan
    of the contents of the tape as well as a dd to verify the number of blocks written
    to the tapes against those scanned. Tape requirements for the backup are as follows:


    +   1. yarna requires DC 6150 (150Mb) cartridge tapes for placement in the internal
    tape drive. Tape Device: /dev/tape.


    +   2. zeus and xerxes require a DC 6250 (250Mb) or DC 6150 (150Mb) cartridge
    tape for placement in the internal drive. Tape Device: /dev/tapeold(250Mb tapes
    recommended).


    +   3. zeus and xerxes require an 8mm tape (i.e., D-112, 2.3Gb) for internal drive
    /dev/tape.


    +   4. The default backup method for XYZ Company incremental backups is cpio using
    parameters -ocvB for file output to tape.


    Implementation Procedures: To implement the daily incremental backup procedure
    it is first to have the file incback placed in the /adm directory and to have
    the cron daemon running, allowing for the execution of incback. Once incback and
    cron are enabled, the daily procedures are as follows:


    +   1. Enter the name of the tape placed in the drive in the backup log.


    +   2. Correctly label the tape using XYZ Company tape labels.


    +   3. Correctly place the tape in the drive bay using the appropriate tape for
    the appropriate machine. Make sure the tape is write enabled.


    +   4. The tape must be placed in the drive bay prior to the established cron
    execution time.'
