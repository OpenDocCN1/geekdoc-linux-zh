- pgno: 69
  md: '52 — Distributed UNIX System Administration


    # Changing Process Priority


    When your system is working with a high load against the CPU, you can lower the
    scheduling priority of tasks to give other processes a better chance of getting
    a slice of CPU time. To increase the priority of a task, lower its *nice number*
    — variable NI in the *ps* output. To display the nice number of a process, run
    *ps* with the -1 option. In the output of *ps -1*, NI heads the nice number column
    and PRI heads the priority column. Nice numbers usually range from -19 to +19
    on BSD-type systems. Check your system documentation to determine what the actual
    range is for your system.


    To increase the priority of a process, decrease the nice number. Process owners
    decrease the priority of their own processes, but only the root user can increase
    the priority of a process. This prevents the regular users of a system from increasing
    the priority of their commands without the assistance of the superuser. The syntax
    of the *nice* command is *nice -/+n command*. To set a process to run at the highest
    priority, enter


    ```

    # *nice -19 myprocess*

    ```


    where *process* is whatever program you want to execute.

    To increase the scheduling priority of a process, you need to know its PID and
    NI variables. If a process has a PID of 5500 and its NI number is 0, you can move
    it up in priority by entering *renice 5 5500*. This increases the priority of
    the process by five steps. Execute *ps -l* 5500 to see if the action to increase
    the priority had any effect. If your UNIX implementation does not have renice,
    then adjusting niceness for a process in progress may not be possible.


    # Configuring the User Interface


    Control of the man-machine interface (MMI) begins with the system environment,
    which is established by variables that can be set and maintained by the superuser
    and the user, if permitted. Variables such as HOME, PROMPT, PATH, TERM, and SHELL
    are frequently used to define control user access to the shell, set the variables
    and provide a user interface, which could be a character-based menu process or
    a graphical user interface (GUI).


    The following example demonstrates setting up a user process following user logon.
    First, a user logs on and hits his *.profile. A simple user profile may be:


    ```

    $cat .profile

    #

    # This is your personal profile file — do not delete!

    #

    ```'
  merge: -1
