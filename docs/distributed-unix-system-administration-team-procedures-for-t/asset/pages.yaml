- pgno: 10
  md: '# Introduction


    UNIX is an operating system multics which has evolved from the time of the mainframe
    and emerged as a useful and reliable multitasking operating system. It began as
    a joint effort between Bell Labs, Massachusetts Institute of Technology, and General
    Electric. Two Bell Lab computer scientists, Dennis Ritchie and Ken Thompson, combined
    their knowledge of Multics and the C language including C''s predecessor B and
    derived the beginnings of the first UNIX system in the early 1970s.


    The emerging technology of the mid-1980s was distributed computing. Networks consisting
    of personal computers running network and distributed operating systems have become
    a dominant method of business processing replacing many functions formerly reserved
    for the mainframe. Distributed UNIX System Administration: Team Procedures for
    the Enterprise focuses on the use of UNIX systems in the enterprise. It divides
    the system administration process of an enterprise into modules of software, hardware,
    security, and operations administration and provides SAMatrix, an automated program
    written in C++ for managing the tasks of all administration modules. The customizable
    framework provided by SAMatrix can help an administrator assess a distributed
    environment to identify weaknesses and organize improvements.


    UNIX has proven itself as an operating system capable of running on a wide range
    of systems that span microcomputers, midrange systems, mainframes, and even supercomputers.
    UNIX has also become a very open system. Today, there are many variants or flavors
    of UNIX that include BSD (Berkeley Software Distribution) and its variants (such
    as Solaris, SunOS, freeBSD, Linux) and System V and its various implementations
    (such as Xenix, AIX, and HP-UX).


    All the UNIX flavors have a lot in common. Nearly all of UNIX is written in C,
    with only a small part of the kernel coded in assembly language. The part of the
    kernel written in assembly and the parts specific to a computer architecture are
    unique to'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# x — Distributed UNIX System Administration


    each UNIX environment. The main environment explored in this book is System V
    UNIX. Variations are noted, but obviously not all variations can be included.
    However, if your UNIX environment differs from those discussed in the text, the
    methodology presented here can still form a dynamic foundation that allows you
    to adapt tasks by categorizing them into administration modules and synthesizing
    them into operations administration. It can also serve as a stepping stone to
    learning more about the ever-wilder world of UNIX and other computer systems environments.


    # Features of this Book


    # Audience


    Distributed UNIX System Administration addresses both technical and managerial
    needs. It assumes at least a user-level knowledge of UNIX.


    # Conventions


    To illustrate commands, output, etc., certain symbols and commands are given special
    treatment using a system of font types, styles, and symbols as follows:


    | Symbol description | Example/illustration |

    |---|---|

    | Commands are Courier bold | clown |

    | Nonliteral arguments are Courier italic | mkdir directory |

    | Input, output, code, parameters, and filenames | /usr/adm/messages |

    | [] (Brackets) present optional input parameters | ls [-1] |

    | ~ (Tilde) is the home directory of a user | ~username |

    | * (Star) is a wildcard for 0 or more characters | * |

    | ? (Question mark) matches one character | ? |

    | {} (Curly braces) contain parameters, with | for OR selections | {yes|no} |

    | ^ or Ctrl indicate control key combinations, such as Ctrl-d | ^ or Ctrl-d |


    # Objectives


    As the provider of computing services today, the system administrator must be
    able to take the broad view of enterprise-wide systems and maintain a local environment.
    In'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'essence, not unlike the Internet, technical support personnel work in a specified
    domain of expertise that must go out and connect to other domains. Distributed
    System Administration seeks to give you an understanding of the domain of the
    UNIX system administrator and introduces the key areas of UNIX system administration.


    Often, system administration and system management tasks can be the same thing.
    However, as organizations grow, a system manager usually oversees a group of system
    administrators and other technical personnel and is responsible for setting and
    enforcing the IS policies and procedures. Because this book classifies the management
    of systems into the administrator''s domain, it can serve as a means for a system
    manager to understand what is required to incorporate a UNIX system into the environment
    by understanding the general tasks of the manager and other administrators.


    # Content


    The software, hardware, network, and security modules provide the foundation for
    understanding the tasks required for successful operations administration. You
    must understand the system before you can properly assess the system. After understanding
    and assessing the system, only then can you develop operations management design.


    The software module organizes basic kernel and shell programming, file systems,
    and application management. The hardware module provides the knowledge to manage
    device drivers and peripheral hardware installation continuing hardware maintenance.
    The network module explains how networks are set up upon UNIX machines, provides
    a performance test kit, and presents the options for Internet access.


    The security module provides shell scripts and explains procedures for security,
    system accounting, and monitoring. A layered security environment manages network,
    system, application, data, and physical security. Utilities to support security
    procedures are provided for each of these layers.


    The operations module brings together each of the previous modules for providing
    services to users and management information throughout the enterprise. The system
    administrator must manage a wide range of tasks: kernel rebuilds, troubleshooting,
    performance monitoring, system configuration, programming, etc. The operations
    module offers a methodology for quantifying these tasks. This module establishes
    a process of measuring operations administration to improve the quality and reliability
    of a UNIX environment. This methodology can be applied to one or many systems
    and can provide users with statistical analysis necessary for an overview of distributed
    systems that make up an enterprise. The more distributed the system, the more
    complex the system becomes and the more statistical analysis is needed to understand
    how the system behaves as a whole. The information obtained from such an analysis
    gives the UNIX staff means to establish sound policies and procedures for managing
    the enterprise and dealing with specific strengths and weaknesses of the system.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# xii — Distributed UNIX System Administration


    Using this methodology, you can adapt any environment into the operations administration
    module providing a means to address heterogeneous environments in terms of hardware,
    software, networks, and security. The more thoroughly you can address these environments,
    the better your assessment results will be.


    # What this Book Can Do


    This book can become a dynamic reference that provides pointers to system level
    solutions. Inside you will find references that may give you exactly what you
    are looking for or that may serve as a pointer to additional reference material
    for more information pertinent to your environment.


    # What this Book Cannot Do


    This book cannot answer all your questions about distributed systems. No single
    book can do because the problems that arise are too numerous and varied.

    as a system administrator, you are exposed directly to information glut, endless
    tasks, and thank long hours. Working in a technology field, you are constantly
    bombarded with system modifications, updates, configuration changes, and integration
    of old and new technology. Your normal routine must be fast moving and provide
    reliable service to your users, addressing their needs and concerns from just
    running an application to setting up and development environments. As your operation
    progresses from a department or workgroup to an enterprise-wide system, your field
    of expertise extends beyond the operating system and user support to networks,
    database administration, security concerns, and overall system management. In
    an enterprise system, you are no longer the system administrator of a UNIX system,
    but part of a team of technologists that addresses hardware, software, networking,
    security, and operations issues.

    in addition, any distributed system consists of heterogeneous components such
    as LANs, server platforms, and user interfaces. That translates to Novell networks,
    TCP/IP, multiple flavors of UNIX, Microsoft NT, mainframe legacy systems, midrange,
    DOS, Windows, OS/2, etc.— basically a very complicated mix that cannot be managed
    by one person or understood by reading one book.


    # A Dynamic Reference for a Dynamic Job


    Components of the system administrator''s job include supplying information systems
    (IS) support, providing technical infrastructure, and making sense of the systems
    so they work. Although the headaches of system management and security for information'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'systems have vastly increased for distributed systems, there are a considerable
    number of benefits too. Those benefits have given the user a wider variety of
    applications ranging from development tools to word processing. Overall, a remarkable
    level of system integration has occurred, such that it is rare to see an office
    worker without a computer sitting on his or her desktop.


    I hope that this book will help support your system administration duties and
    enable you to manage systems, from large to small, broadening your knowledge of
    the UNIX environment and guiding you through the process of developing an enterprise-wide
    system administration plan. As an administrator or systems manager, understanding
    your system makes it possible for you to make decisions that affect your system
    hardware, software, network, security, or operational tasks. Thus, knowledge of
    your system and the capability to build an effective operations plan are key to
    enterprise-wide system administration for any environment.


    Though complex, UNIX offers advantages to the enterprise that can be enjoyed to
    their maximum through sound system administration policies and procedures. To
    that end, Distributed UNIX System Administration: Team Procedures for the Enterprise
    can provide value in supporting and understanding the important UNIX system modules.'
  merge: -1
  img_proc: true
