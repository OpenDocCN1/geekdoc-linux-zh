- pgno: 118
  md: '# Chapter 6


    # Introduction to Networking


    In an enterprise, the network is the most complex part of the system. It must
    reliably transport data and and operate continuously. Maintaining the network
    is a complex administrative task. The administrators on a network specialize in
    providing network services for a specific group of networks. For instance, providing
    network support to a Novell network is considerably different than providing a
    UNIX-based network with TCP/IP. Although the networking principles are the same,
    the actual technical details of maintaining and configuring the networks are different.


    This chapter offers a foundation for understanding networks, but be prepared to
    dig much further into your own specific environment. Network implementations differ
    among UNIX variants. In complex enterprise-wide environments, good system administration
    requires technical specialties to cover the breadth and depth of the environment.
    To get a more practical understanding of a particular system, look for support
    from the vendor or a colleague who has worked on the system extensively.


    # Types of Networks


    Small networks, usually contained within a geographically close environment, such
    as a single building, campus, or office park, are called Local Area Networks,
    or LANs. Larger networks that cover a wider geographic area, such as the network
    of an enterprise with various cities or states, are called Wide Area Networks,
    or WANs. LANs are often the building blocks of WANs.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 102 — Distributed UNIX System Administration


    LANs can be grouped into two broad categories: peer-to-peer networks and server-based
    networks. In a peer-to-peer network, there is no subdivision of work. All computers
    on the network act as both client and server with the resources of any one computer
    using the local user; that is, the individual using remote on the network accessing
    the local computer. Security, maintenance, and resource sharing are at the discretion
    of the individual users on the network. Peer-to-peer networks operate best in
    small environments, such as an office with a limited number of computers and devices
    on the network, or in environments where security and maintenance needs are simple.


    As a network grows, the performance of a peer-to-peer network may not be tolerable.
    In addition, the security and maintenance necessary on a larger network may make
    peer-to-peer services inadequate. In this case, a server-based or distributed
    system, the other major category of networks, is the alternative. In a distributed
    system, individual computers on the system perform work that contributes to a
    larger task; for example, providing network communications. Special computers
    servers are dedicated to providing these services to the network, such as communication,
    print, database, mail, or fax services. Unlike a peer-to-peer network that can
    support few computers and must be geographically close, server-based or distributed
    networks can support thousands of nodes spaced as far away as another country.


    # Network Architectures


    The architecture of a network describes not only the physical construction of
    the network (topology and transmission media) but also the software and hardware
    interact with each other (networking models and communications protocols). This
    book concentrates on the most popular implementation of networks for UNIX systems
    — an Ethernet network in a bus configuration — that follows the IEEE 802.3 standard
    for media access called called Carrier-Sense Multiple Access with Collision Detection
    (CSMA/CD).


    # Physical Connections


    Networking computers requires both physical connections and logical connections.
    The physical connections include the hardware, such as computers, cables, transceivers,
    and interface cards.


    # Cables and Connectors


    Any computer or device, such as a printer, connected to a network is considered
    a node of the network. Nodes can be connected with wire or cable or can be connected
    using wireless technology, exchanging data using radio, microwave, or infrared
    transmissions.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Introduction to Networking — 103


    The medium depends on your network needs. Bandwidth, the difference between the
    lowest and highest signal frequency a cable can carry, describes how much data
    a medium can transmit. For example, the theoretical Ethernet transport rate is
    10 Mbps, whereas 100BaseX, or Ethernet, allows up to 100 Mbps. However, the actual
    throughput of a network is not 100 percent due to noise and other network overhead.


    A network built using Ethernet cabling and connectors allows a selection of physical
    wire with differing characteristics. 10BaseT wiring, or twisted pair, has an effective
    range of 100 meters and a minimum of 0.5 meters between nodes. 10BaseT has the
    lowest effective range, but it is one of the most common network connections because
    of its low maintenance and high flexibility.


    10Base2, also known as thinnet, is a coaxial cable with a better range than 10BaseT.
    It has an effective length of less than 200 meters. About 185 meters is considered
    the maximum segment length. It is less durable, 10Base2 cable is used in implementations
    where the wiring is accessible to users, to protect it from being stepped on,
    pulled, bent, or otherwise mishandled. This reduces the task of replacing cable.


    10Base5, also known as thicknet, has an effective length of 500 meters and a minimum
    cable distance between the transceivers of 2.5 meters. It supports a maximum of
    100 nodes. 10Base5 cable does not bend. Its durability, in addition to its higher
    effective length, makes 10Base5 cable good for larger installations.


    10BaseF, or fiber-optic, cable carries digital signals in the form of pulses of
    light. Fiber can carry the modulated light for miles without degradation. Fiber
    may be chosen over 10Base5 because it is more flexible, is not subject to electrical
    interference, and can be used for faster 100 Mbps networks like FDDI (Fiber Distribution
    Data Interface).


    Different cable types use different methods of connection. 10BaseT requires an
    RJ-11 phone connector, whereas 10Base2 uses a BNC connector. Ethernet network
    interface cards (NICs) can range in their connection makeup from 10BaseT, 10Base2,
    and 10Base5 connections to only a single type of connection. NICs must support
    the same connection type as the medium used in.


    # Other Network Devices


    In wired networks, such as an Ethernet network, a cable from a node is attached
    to an interface device cable. Transceivers ensure there is a signal on the wire
    and manage the transmissions between the nodes. The NIC is the peripheral between
    the transceiver and the node. Usually, the transceiver is built into the NIC.


    Another hardware device, a concentrator, allows several nodes to be plugged into
    one device connected to the network. In addition, a concentrator can also allow
    one network to feed into another, and through multiple connections, hundreds of
    network nodes can be accommodated. Concentrators are used in twisted pair networks.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 104 — Distributed UNIX System Administration


    As a network grows, the distance a signal must travel between nodes increases,
    sometimes exceeding the maximum of the medium used to transmit the signal. If
    the distance is too great, a repeater, which is a device used to boost a signal,
    can be connected between nodes. In addition to boosting a signal, repeaters connect
    wires. When using repeaters, only two can be placed between any two nodes. Repeaters
    are generally less expensive compared to other connection hardware. However, they
    require power and electronic components that can fail. In addition, repeaters
    boost good or bad, so they can amplify noise as well as good signals, across the
    network.


    Additional devices also connect networks to networks. For a complete enterprise-system,
    a router routes signals from one LAN to another and limits the connections of
    LAN. For example, a network of LANs can be broken into segments of three LANs
    per segment. A router can be inserted between segments to prevent unwanted access
    between segments. A special type of router, a bridge, connects similar networks.
    Another special router, a gateway, connects dissimilar networks.


    # Topologies and Access Methods


    The topology of a network describes the physical arrangement of the nodes in the
    network. Commonly used topologies include bus, star, and ring configurations,
    as depicted in Figure 6.1. There are variation and hybrid schemes for network
    topologies, too. Each configuration has its advantages and disadvantages. The
    topology is an important component of the network infrastructure, so it must be
    selected to best fit the needs of the organization.


    A bus topology connects many nodes with a single transmission line, called a backbone
    or trunk. Data is addressed to a particular computer on the network and sent to
    all devices on the trunk. Only the computer with the correct address can accept
    the data. Because it is sent to all nodes on the trunk, a signal will bounce from
    one unconnected end of the bus to another, preventing other nodes from transmitting
    until something stops. A device called a terminator absorbs these free signals.
    All unconnected cables on an Ethernet bus require a 50-ohm terminator. An unconnected
    end can be a broken cable, a disconnected cable, or the ends of the backbone.
    When a node on the bus breaks or becomes disconnected, creating an unconnected
    end, the entire network goes down.


    Traffic on the bus is controlled by CSMA/CD, defined in the IEEE standard 802.3.
    When a node wants to transmit, it tests the bus for a carrier, or signal. If it
    senses a carrier, it waits for a random amount of time before trying to retransmit.
    When two computers on the network send at the same time, a collision occurs, causing
    both computers involved to stop for a random amount of time before trying to retransmit.


    In a ring configuration, the nodes are linked to each other forming a circle of
    nodes. When the node network fails, the whole network goes down. Access on a ring
    network is often controlled by a method called token passing, in which an electronic
    signal called a token is passed continuously around the ring. When a computer
    on the ring wants to send a signal, it waits for the token. When it receives the
    token, it'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Introduction to Networking — 105


    adds the destination address to the token, sends the token and the data. The token
    and data move along the ring until they reach the computer matching the destination
    address. The destination computer copies the data then adds an acknowledgment
    to the token, which is passed through the ring until it reaches the computer that
    sent the data. After receiving the acknowledgment, the sending computer puts a
    new token on the ring.


    A star configuration connects nodes to a central node, or hub. The hub can be
    passive, simply retransmitting any received signal, or active, selectively switching
    received data to specified destinations and providing most of the processing for
    the network. When a node on a star topology fails or is disconnected, only the
    failed node is unable to send or receive on the network. The rest of the network
    is unaffected. If the central node fails, the whole network goes down.


    In large systems, networks can be connected to networks in addition to computers
    and devices such as concentrators and repeaters. A possible setup is a bus topology
    with the nodes on the bus network occupied by star, ring, and other networks,
    as depicted in Figure 6.2.


    ![](img/8f8a5b924793524d71746c72ac703b14_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '![](img/8f8a5b924793524d71746c72ac703b14_123_0.png)'
