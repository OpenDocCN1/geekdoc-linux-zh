  md: '# Maintaining Access to Applications — 57


    After it starts, do notattempt to stop the kernel build process from running.
    Even if you find an error, it is better to let the kernel run to completion and
    reset your system to run from the old kernel. When the build is complete, you
    will have a new file unix in your root directory. You should reboot the system
    and make sure all devices, file systems, and new parameters come up and online.
    If so, your kernel was a success. You avoid the risk of creating an unstable system
    when modifying kernel variables, run a process or perform a regular maintenance
    check to make sure that all is in good order. It is also important to monitor
    the system, especially in a production environment, to make everything running
    smoothly.


    If you encounter any system problems, return to the old kernel and attempt another
    building. Depending on the severity of the problem you may want to do this until
    you have set aside some maintenance time that will not adversely affect users.


    # Establishing a Performance Baseline


    Monitoring the performance of your UNIX system can be a big task, yet necessary
    to provide the best system available. By monitoring your system, you can determine
    its norm and create a baseline. When something unknown occurs, you can better
    estimate its effect on your system. As stated previously, no two UNIX systems
    are alike. Each UNIX system is configured by the system administrator to provide
    specific services. In UNIX there is no such thing as a homogeneous environment,
    and it would be rare to even find backup or "hot" sites set up to perfectly emulate
    their production counterparts.


    To monitor UNIX performance, you can obviously go out and buy performance monitoring
    tools. However, you have the ability to monitor command usage, page usage, CPU
    usage, and more. System V UNIX uses the sar command. Other UNIX platforms use
    vmstat. On some systems, as AIX or Solaris, both sar and vmstat are available.
    I will focus on sar and System V monitoring.


    The Activity Reporter, sar, allows the administrator to get a sampling of the
    system for a specified period of time. sar measures buffer activity, CPU utilization,
    caching, memory swapping, paging, queuing, and process status. Documentation on
    the sar command provides the necessary options and descriptions of sample output
    that you can expect from your system. Some sar options are -u for CPU utilization,
    -b for buffer activity, -p for paging activity, and -n for cache statistics. Many
    sar options are available. To see output for CPU utilization, enter


    ```

    # sar -u 5 10

    ```'
