    # Process Accounting


    Setting up and a native accounting system can provide a wealth of information
    for analyzing your system. Different from a sar report, system accounting gives
    you information on who is using your system and how they are using. This type
    of usage can have an important effect on system performance. For instance, if
    you have software developers working on a system, they may be compiling programs
    at a time when other users are using an application. For small organizations usually
    have a separate development system. If such usage is causing your problem, you
    may want to consider breaking up the workload to run on separate UNIX machines.
    Your organization is on its way to providing UNIX services.


    For software administration, you can provide accounting reports ranging from which
    commands were used to how many bytes were actually transferred and accessed during
    a specified period. The wtmp, utmp, and pacct files hold system accounting information.
    pacct is located in /usr/adm (this directory may also contain wtmp on some UNIX
    releases as BSD).


    The wtmp (for "who") stores log-in processes. Remove this file if you do not want
    this information stored, check your init scripts (i.e., /etc/rc) and any other
    procedures you may have reference this file. Process information is captured in
    the pacct (for process accounting) file. This file records information that includes
    the name of the command used, the start and stop times, processing times, and
    memory used. This is, of course, a lot of information, and it quickly builds up
    in the pacct file.


    The procedure to record processing information is not automatic. You must start
    the acct program to turn on the ability to write process information to your accounting
    files. You can invoke the accounting process from your startup script (/etc/rc)
    by issuing the startup command from the accounting library, usually /usr/lib/acct.
    This command writes to wtmp and runs acct. If you do not want to run startup,
    you must comment out the command in the /etc/rc file. The common setup for startup
    is from your init level 2 startup script, and the'
