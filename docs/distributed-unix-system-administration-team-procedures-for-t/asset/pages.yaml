  md: '# 6 — Distributed UNIX System Administration


    Next, execute a list command to see a directory listing.


    ```

    # ls

    bin

    c_files

    john

    list.c

    ```


    So far, these are general user commands, but for the system administrator, the
    ls command can be quite beneficial. When executed with the -a option (for “all”),
    ls provides a complete listing:


    ```

    # ls -a

    .

    .profile

    bin

    c_files

    john

    list.c

    mbox

    ```


    First, note that . and .. stand for the relative path of the directory. The .
    (dot) represents the current directory, and the .. (dot dot) represents the parent
    directory. Files that begin with a . (e.g., .profile) are not displayed using
    ls, whereas ls -a does these hidden files.


    # User Environments


    Note the .profile file, which is used to configure the user environment. A simple
    .profile file for a user may look like this:


    ```

    $ cat .profile

    #

    # User profile

    #

    umask 077

    PATH=$HOME:bin:$PATH

    export PATH

    TERM=vt100

    export TERM

    exec /usr/local/bin/usermenu

    ```'
