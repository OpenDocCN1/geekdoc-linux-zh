- pgno: 313
  md: '# Variables


    Variables include letters, digits, or other valid characters and begin with a
    letter or underscore. To get the contents of a variable, you must.prefix the name
    with $.


    +   - Variable assignment:

    Assign a value to a variable by variable=value. For example:


    ```

    PATH=/usr/ucb:/usr/bin:/bin; export PATH

    ```


    or


    ```

    SOMEDAY=`set \date\` echo $1`

    ```


    To use variables in a script, they must be exported. Use the export command (i.e.,
    export SOMEDAY)


    +   - Referencing variables

    Use $variable(or, if necessary, ${variable}) to reference the value.


    ```

    # Using an assigned PATH

    if [ "$USER" != "root" ]; then

    PATH=$HOME/bin:$PATH

    else

    PATH=/etc:/usr/etc:$PATH

    ```


    This gives you variable path assigned to HOME (i.e., /usr/wetsch/bin) and a system-specified
    path determined by and reassigned to PATH.


    +   - Double quotes

    Double quotes allow variable substitution (i.e., the dollar sign is interpreted),
    the filename is not created (i.e., * and ? are quoted). The result is one word.


    ```

    if [ ! "$(parent)" ]; then

    parent=$$(people)/$(group)/$(user)

    fi

    ```


    +   - Back quotes

    Back quotes allow you to run a command and provide a substitution for the output.'
  merge: -1
  img_proc: true
