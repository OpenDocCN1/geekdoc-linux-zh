- pgno: 243
  md: '# 226 — Distributed UNIX System Administration


    responses for each major variable, with the exception of HA, for each matrix module
    indicates increasing matrix module scores with a decreasing number of incorrect
    responses. The t-test values that support the results are located in Appendix
    C and are centered around the mean value for each major variable.


    This assessment indicates that there are some severe gaps in system administration
    practices within the assessed organization. In the area of software administration,
    the organization did very well overall. Of concern is that nearly one-fourth of
    the respondents had never done a kernel refiguration or set up new file systems
    on their systems. UNIX kernel rebuild is a necessity when it comes to performance
    tuning or installing new device drivers. It is possible that those who have not
    done these tasks rely on the company support centers for these services. The majority
    of sites also follow company recommendations to support their BrandX database
    applications that are considered the primary UNIX database on the organization''s
    systems. As previously noted, the results indicated that most of the sites have
    not used the company-supplied backup storage for system backups, relying mostly
    on standard UNIX archiving utilities. More than80 percent of the respondents used
    the vendor-supplied BrandX dbback/rest database functions


    Hardware administration practices indicated some inconsistencies. Although all
    sites reported that they troubleshoot hardware problems and set up terminal devices,
    maintenance practices were reported. For instance, a large majority reported that
    they clean tape drives, but only a small percentage reported cleaning disks. Disk
    drives are irrelevant for the hardware platforms, but because a significant number
    of sites use Intel 486 platforms, the reliability of system recovery using boot
    disks comes into question. Additional hardware reliability questions are raised
    because there is a significant number of sites that do not regularly check loose
    connections, or to a greater degree, hardware performance. This may imply that
    greater troubleshooting efforts are required to maintain hardware.


    Significant gaps in security administration are noted. On average, one-fourth
    of the sites do not regularly monitor passwords, file permissions, and superuser
    access. This significant minority can allow for unauthorized intrusion into systems
    without detection, with possible disastrous effects on the rest of the system.
    This is particularly significant when 56.2 percent of the sites reported as having
    more than 60 users (24.4 percent) had over 100 users.


    There are good indicators that disaster recovery practices are implemented by
    a majority of sites. A significant minority do not properly implement disaster
    recovery. A weighty indicator is evidenced by those sites that have not adopted
    a disaster recovery plan. To a lesser degree, sites that store their onsite backup
    media in the same room as the computer facility may lose valuable backup media
    in the event of a disaster to their physical environment.


    Of primary concern is the security administration of the organization''s systems.
    The majority of respondents do not have a written security plan and have not completed
    a risk analysis. Without a security plan, the organization may not be able'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'recognize all of the risks they are exposed to and how to minimize their impact.
    Without a risk analysis sites cannot assess the impact of a break-in or disaster
    to automated systems.


    Sites with a security plan but no risk analysis may also have questionable security
    plans in place. For instance, a working security plan prescribes regular computer
    security training. Irregular training or no training decreases security awareness
    and can cause security breaches. In addition, the lack of a security plan and
    not providing security training indicates noncompliance with company policy.


    The varied network environment will become one of increasing complexity as network
    technology expands and becomes more pervasive in the game. Like hardware administration,
    networks must be monitored for performance, cable connections checked, and network
    services provided. This study only the surface of network administration, which
    by itself encompasses most aspects of system administration because it is a major
    subsystem that provides information to users. Nonetheless, most sites employ some
    type of network system (i.e., LAN, modems, etc.) and are responsible for maintaining
    this interface. Overall, increased network administration will be required based
    on assessment results.


    Overall, the assessed locations scored well in operations administration because
    systems personnel have input or control of system procedures, budgeting, procurement,
    facility design, and allocation of resources. However, site operations administration
    negatively affected this area was a primary indicator in the establishment of
    appropriate system policies and procedures. Significant procedures, such as a
    security plan, disaster recovery plan, and a risk analysis, have not been completed
    for the majority of the sites.


    The overall composite matrix values indicate the level of system administration
    procedures that are followed by the organization as a whole. It was expected that
    a composite mean of less than 80 percent (0.80) would indicate significant gaps
    in system administration practices. The composite mean of 0.781 received by the
    organization would indicate that a major gap or lapse in administration practices
    exist. The previous notes on the analysis of each module support this connection.


    Individual sites that received low scores may already be experiencing significant
    system troubles ranging from frustration in maintaining systems to reliability
    problems that did not appear on the assessment instrument. It is possible that
    other sites are proceeding smoothly but are unprepared for any significant disruption
    to a regular routine.


    Reasons for the system administration deficiencies noted are beyond the scope
    of this assessment. It is necessary to determine what the problems are before
    trying to eliminate them. From this assessment, it may be conjectured that lack
    of support, over-tasked personnel, apathy, lack of knowledge, frustration, or
    other factors may contribute to these findings. It is up to management to get
    down to core issues and solve existing problems.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 228 — Distributed UNIX System Administration


    Insight into this speculation comes from comments given by the respondents. One
    respondent, when referring to the types of information resource tasks they are
    involved with stated, "many other areas." In automation support, another response
    was, "we mostly rely on ourselves." A security-related comment received stated,
    "they are tired of hearing me talk about passwords, logging out, etc.",


    The above comments come from an educated and experienced systems staff. Of the
    respondents, 78.1 percent had a bachelor degree or better with 51.2 percent having
    a degree in computer science, management information systems, or a technical discipline.
    The experience of the respondents indicate that 80.5 percent had five or more
    years of system administration experience and 56.1 percent had five or more years
    of experience with the organization. From the comments and respondent data, it
    appears that additional questions need to be raised and postulates to answer the
    "why" question.


    A further analysis of the data acquired in this assessment did not show a direct
    relation between system reliability and the staff following procedures. The literature
    cannot be rejected in indicating that improper procedures lead to decreased system
    reliability. The inability of results to affirm this hypothesis may be the result
    of factors not addressed by the assessment. These factors include but are not
    limited to (a) how often sites receive support from their support centers, (b)
    how much time is spent on support call, (c) what the cause of a reliability problem
    is, (d) problem repetition, and (e) actual documentation and reporting of system
    problems. Consequently, more questions can be added to the survey, and the scope
    of the assessment can be increased. This can be done incrementally. After an initial
    assessment is made, the door is open for additional comments and suggestions.
    Input can then refine the model so that the assessment instrument is kept current
    and up to date with technology.


    # Recommendations


    The analysis of this general assessment of the system administration practices
    of an organization yields an need for the organization to complete a risk analysis
    of their automated facilities. This analysis should be used to develop and implement
    a security plan for each site and establish proper system policies and procedures.
    A complete risk analysis will give the organization a more accurate estimate of
    the effect that system downtime and equipment loss will have on operations. A
    risk analysis will also validate security plans. Security plans need to address
    the physical security as well as the operational procedures that are in place
    to protect the organization''s systems. Such as information privacy and regular
    security training also need to be included in a site security plan.


    Other areas of system administration could be easily addressed by the sites by
    adopting a control systems matrix. This matrix could be adaptable to the environment
    of each system of the enterprise and assessed by each site on an annual basis
    to'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'pinpoint deficiencies in administration practices. In essence, the sites should
    adopt a comprehensive methodology that will develop a system administrative model
    that is adaptable to the needs of each site. Such a model should allow each site
    to implement system administrative practices that pertain to the present environment
    and are adaptable to expanding information technology needs. Within the context
    of this assessment the sites should strive for a comprehensive matrix score of
    0.90 or better.


    As reliance on automation continues and increases, the need to assess the value
    of these systems in terms of the information they become increasingly important.
    organization needs to take an approach to address its deficiencies in order to
    minimize the effect of factors that do not support system integrity and reliability.
    Based on the results of this assessment, it is also possible that the same deficiencies
    carry over into other systems that the organization may support, or maintain that
    were not addressed by the assessment. These systems should also be assessed and
    analyzed to determine the type of control systems that need to be put in place.
    The job of the system administrator is far-reaching and varied, and good system
    administration practices smooth the relationship between the system user and the
    systems they come to rely on to perform their job.


    # Summary


    From the beginning of this book we have taken a look at system administration
    practices. It was noted that actual practice can vary because of the wide variety
    of UNIX environments. Studying UNIX system administration gives the administrator
    means to discover what others are doing in the administrator role as well to incorporate
    acceptable administration practices. The difficulty in system administration comes
    down to actually quantifying what is expected in a systems environment. When policies
    and procedures are established it is not possible to know if they are being followed,
    if they have been bypassed, or if they are comprehensive enough to address the
    enterprise system as a whole. Taking a look at the detailed aspects of system
    administration and stepping back to view the job as an integral part of the “big
    picture” of systems support reveal a more scientific approach to quantifying these
    tasks.


    A statistical analysis of detailed and broad functions as they relate to the administration
    modules shows an overlapping of tasks between modules. For instance, all modules
    have tasks related to security. The assessment incorporates relevant tasks as
    they relate to one module such as networks and then reassesses the task as part
    of the overall security module. Therefore, security within the network may be
    sufficient if neglected everywhere else would probably give a security module
    score of 0.20 (20 percent), indicating major security weaknesses. The analysis
    of the system would show that the security tasks are there for the network module
    but are lacking elsewhere.'
  merge: -1
  img_proc: true
- pgno: 247
  md: From a management perspective, the assessment instrument gives a manager an
    overall view of the computing environment. Assessments can be made locally or
    globally for the enterprise. In either case, a detailed assessment of system administration
    functions will help support the information infrastructure of the organization.
    It can also provide a means to report on the reliability of a system in an objective
    quantitative manner instead of subjectively, using casual and anecdotal communications
    as evidence for a position. It can also help eliminate subjective and reactive
    system administration practices that are primarily “find it and fix it.” Systems
    staff can be proactive and, through their assessment, more effective to ensure
    that the proper system administration tasks are in place and adaptable to changing
    environments.
  merge: -1
  img_proc: true
