- pgno: 184
  md: '# The Multilayered Security Model — 167


    In Table 9.2 Risk (R) equals Criticality (C) times frequency (F) of an occurrence.
    The layers (L) in the table are Physical (P), Network (N), Application (A), System
    (S), and Data (D).


    Table 9.2 covers just basics of a risk analysis, but it demonstrates how detailed
    a risk analysis can be. However, the more detailed the analysis the better.


    A risk analysis helps determined if the system is at high risk, moderate, or low
    risk. In an analysis as portrayed in Table 9.2, Criticality (C) times Frequency
    (F) equals Risk (R). Although no system is completely safe, if a 100-percent secure
    system could exist, the value for R be 0, meaning no risk to the system. In a
    completely vulnerable system, everything would have a criticality of 9 and a frequency
    of 3, yielding an R per-line item of it. In Table 9.2, 39 line items were assessed
    for a maximum risk factor of 1,053. The sum of the R column returns a value of
    208.


    To calculate the optimal risk (R_{Optys}) for a system, an organization must decide
    the criticality for allows security, backup, and procedures to get work done but
    minimize the impact on the system overall. In addition, the enterprise must decide
    on a tolerable frequency of failure. For a criticality of 2 with an optimal frequency
    of F = 1, 2 × 1 = R_{Optys} as the optimal risk for the system.


    The actual R_{sys} for the risk is the average of C times the average of F or
    R_{sys} = C_{avg} × F_{avg}; In Table 9.2, this results in 170/39 = 4.4 = C_{avg};
    45/39 = 1.2 = F_{avg}; so R_{sys} = 5.25.


    In plain English, these calculations show that one or more layers are at risk
    of being inaccessible. To predict which layer is most vulnerable, review the line
    items for questions with an N for No. The questions with No in the Y/N column
    are:


    +   - Is the media storage facility separate the computer room?


    +   - Is a raised floor available in the computer facility?


    +   - Are procedures in place to deal with unauthorized users?


    +   - Are redundant systems available for: Network equipment?


    Not redundant systems for network equipment results in a risk factor of 21, suggesting
    that at the greatest risk is the Network layer. No redundant work equipment for
    backup can greatly impede the network layer if a component should break down.
    Not having a raised floor provides for cabling nightmares around the walls and
    behind equipment, giving way to increased troubleshooting problems and pulled
    cables. In addition, when a required feature is needed and not available, the
    risk occurrence (i.e., frequency) increases.


    In some organizations it is not practical to reduce risk factors. For instance,
    to reduce physical risk factors to below 9, an organization could implement a
    hot site where remote procedures are constantly updating another system. If the
    key system crashes, the hot site would take over operations in hours or even minutes.
    By having parallel layers, the nonavailability of one layer is replaced by a redundant
    layer. However, a fully redundant site may be impractical for some organizations.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Some organizations have implemented their own risk assessment standards. These
    assessments are more detailed than the one presented here. Some will even compute
    the dollars lost when a system or component is unavailable. When risk is computed
    in dollars, the amount of risk is determined by the dollar value at stake. For
    example, if an organization relies on database data to conduct business and this
    data generates $10 million worth of revenue per year until it is obsolete, the
    unrecoverable of such data represents unconscionable risk.


    # Writing the Security Plan


    Once the risk analysis is complete, the organization must implement a security
    plan. Recall that an effective security system requires a security plan that documents
    the security methodology and the physical environment. A security plan for a layered
    system should cover, at a minimum:


    +   - software auditing policies and installation guidelines to track the authorized
    use of software;

    - access policies to include passwords, levels of access, workgroup assignments,
    and definitions of these levels;

    - control of physical access to equipment;

    - privacy of information, if applicable; and

    - user accountability, to include usage and security training.


    An outline of a security plan in the multilayered model can take on the following
    form.

    XIV. Introduction: Describe what the system is used for, what its purpose is,
    and why a security plan is needed.


    XV. Physical Security: Describe the following components:


    +   - System environment

    - Purpose

    - Location

    - Hardware

    - Software

    - Personnel controls

    - Internal controls


    XVI. Access Security: Identify the security model. If it is a multilayered model,
    describe the layers as:


    +   - Network

    - System

    - Application

    - Data

    - Physical'
  merge: -1
  img_proc: true
- pgno: 186
