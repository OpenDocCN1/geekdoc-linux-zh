- pgno: 56
  md: '# File Systems — 39


    Step 3 may also provide misleading information. Sometimes, when checking a large
    database file, fsck returns an erroneous report on block number and size. The
    way a large database file is written to disk may occasionally cause fsck to skip
    blocks during its test. In addition, newly installed files report no problems
    with fsck, as they grow, fsck returns the message POSSIBLE FILE SIZE ERROR I=1422.
    As in this situation, an attempt to correct the proposed problem could damage
    the data. Find if the file is truly bad, use the ncheck command with the inode
    number to locate the file. Once the file is located, you can replace it with a
    good copy, if necessary.


    Step 3 may also report other problems such as:


    +   - 6500 BAD I=564 showing a bad block with an out of range address

    - DIRECTORY MISALIGNED I=67, directory error similar to POSSIBLE FILE SIZE ERROR.
    The ncheck command can be used to find a genuinely bad directory

    - EXCESSIVE BAD BLOCKS

    - EXCESSIVE DUP BLOCKS


    EXCESSIVE BAD BLOCKS and EXCESSIVE DUP BLOCKS indicate a damaged inode. In either
    case, you should respond with y to let fsck assess the condition of the inode
    and continue. However, if the error is persistent, you may be faced with another
    hardware-problem. However, it is best to let fsck fix the problem for you if it
    can.


    If Phase 1 reports any table overflow errors enter y to continue. When a Phase
    1 error occurs, fsck may be able to run until zero errors are reported. However,
    it is important to rerun fsck as many times as needed until zero errors are reported,
    unless of course you receive an expected POSSIBLE FILE SIZE ERROR report. If errors
    such as 4565 D I=96 are reported in Step 4, fsck should be run again, too.


    Phase 2 can generate an error that is near catastrophic for your file system.
    The error ROOT INODE UNALLOCATED, TERMINATING fsck and means the root inode of
    the file system in question cannot be allocated. You will have to restore the
    contents of the file system from backup media. Another error Phase 2 can give
    is


    ROOT INODE NOT DIRECTORY,

    FIX?


    A response is your best answer here, but be prepared for more errors down the
    road. A response of n terminates the utility. The next error Phase 2 can generate
    is


    DUPS/BAD IN ROOT MODE,

    CONTINUE?'
  merge: -1
