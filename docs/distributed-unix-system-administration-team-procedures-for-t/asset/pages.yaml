    corrupted or a device was configured incorrectly. It is imperative to get the
    system back up and running. By booting from an old kernel, as unix.sav or even
    an older one, unix.old, the system can be brought up, and a new kernel can be
    configured. Other directories, subdirectories, and files are discussed later in
    this book.


    # Scheduling


    In every computing environment it is necessary to accurately schedule tasks. In
    UNIX, this is accomplished using cron, the UNIX timer. The cron daemon runs in
    multi-user mode, is time responsive, and reads the /etc/spool/cron/crontabs directory.
    Files to create a cron job can be generated easily with an text editor. To list
    the contents of the cron file, enter crontab -l. To load, update, or remove the
    cron file, enter crontab -r.'
