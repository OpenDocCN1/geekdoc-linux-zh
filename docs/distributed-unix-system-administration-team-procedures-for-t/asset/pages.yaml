- pgno: 124
  md: '# Logical Connections


    The logical connections in a network follow rules and procedures called protocols
    for communications. Each protocol accomplishes a different communication task.
    A technique called layering allows the different protocols to work together by
    defining the sequence in which the protocols perform their tasks. The suite of
    protocols is called a protocol stack. Data transmitted on a network travels down
    the stack on the originating computer, through the transmission medium, then up
    the stack on the receiving computer.


    # Networking Models


    Network protocol stacks follow models or standards created by computing communities.
    Two common reference models are the International Standards Organization and Open
    Systems Interconnect models (ISO/OSI). Table 6.1 shows the seven layers of the
    OSI model and gives an example of the function of each layer.


    | Table 6.1 The OSI reference model (RM). |

    | OSI layer | Layer name | Description | Example |

    | --- | --- | --- | --- |

    | 7 | Application | Services provided by an application. | Application program
    interface (API). |

    | 6 | Presentation | Determines how the data is formatted. | Encryption and decryption
    routines. Data compression. |

    | 5 | Session | Provides for data flow. Assists the transport layer in maintaining
    data integrity. | Initial handshaking when a session is started. |

    | 4 | Transport | Maintains integrity of network services between nodes. | Actual
    transport of the bit stream through the network medium. |

    | 3 | Network | Allows bits to be routed and switched to network nodes. | Using
    a router. |

    | 2 | Data link | Transfers bits to another physical link. | Data packets, or
    frames, sent across a network. |

    | 1 | Physical | Physical hardware for data transmission. | NIC card. Cable. |'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The IEEE 802 standards enhance the OSI model by subdividing Layer 2 to further
    define data link communications, media access control, and the hardware used to
    build the network. Standards developed to enhance Layer 1 add more detailed specifications
    regarding the use of network interface cards and components used to build twisted
    pair and coax networks. Section 802.3 defines the access control method CSMA/CD.
    The network implementation that this book concentrates on, an Ethernet network
    in a bus configuration, follows the standards and specifications for cabling and
    media access as defined in the IEEE 802 enhancements.


    More common than the OSI model is Transmission Control Protocol and Internet Protocol
    (TCP/IP), used by the Internet and numerous commercial enterprises. Simpler than
    OSI, TCP/IP uses a four-layer protocol as shown in Table 6.2


    The TCP/IP is missing some of the services provided by the OSI model and combines
    services from several layers. Though TCP/IP cannot be mapped to the OSI model
    exactly, the TCP/IP protocol in the transport layer of the TCP/IP model provides
    services equivalent to the transport layer in the OSI model. Building the network
    using Ethernet bus topology and twisted pair cabling provides the connectivity
    specified in the data link and physical layers.


    # Network Protocols


    A protocol stack is a suite of communications protocols, each providing a certain
    network communication service. A complete protocol stack can be added or removed
    like drivers, although with a complete protocol stack, as the OSI suite, that
    is not necessary. The number of available protocols adds to the complexity of
    successful network communications. Table 6.3 provides a selected list of protocols.


    # Addresses and Address Resolution Protocols


    Networking models and communications protocols provide the vehicle for transmitting
    data but not its destination. Packet addressing schemes supply a logical destination
    for the data in the form of an IP address.


    # Table 6.2 TCP/IP network model.


    | TCP/IP layer | Layer name | Description |

    | --- | --- | --- |

    | 4 | Application | End-user applications |

    | 3 | Transport | Communication among programs on a network |

    | 2 | Network | Basic communication, addressing, and routing |

    | 1 | Link | Network hardware and device drivers |'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Introduction to Networking — 109


    IP Addresses

    TCP/IP application layer protocols communicate with other nodes using an Internet
    address that specifies the network and the host (a node on the network) being
