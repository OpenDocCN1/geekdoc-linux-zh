    building security document |

    | Is the building adequately maintained? | P | Y | 8 | 1 | 8 | Potential power
    losses due to old wiring |

    | Is air conditioning provided? | P | Y | 3 | 1 | 3 | | |

    | Is a fire/smoke detection system available? | P | Y | 9 | 1 | 9 | | |

    | Is a raised floor available in the computer facility? | P | N | 1 | 2 | 2 |
    Potential for stepping on and pulling cables |'
