- pgno: 96
  md: '# Chapter 5


    # Maintaining Hardware


    Chapter 4 discussed configuring devices for I/O with the operating system. This
    chapter looks at how terminals and printers are maintained, to provide insight
    into the interaction of peripherals with UNIX, and offers tips for preventive
    maintenance on all hardware.


    # Terminals


    Connecting a Terminal to a Port\When devices such as terminals are connected to
    a system, that connection must correspond with an actual port available on the
    system. The process of connecting to a port begins at boot the init daemon is
    started. init starts or "spawnns" a process, primarily through the getty process.
    getty gets its information on a particular port through the /etc/inittab file
    (in some inittab is replaced by /etc/ttys), which allows the system to turn on
    the ports. The information provided determines the specific port to access, the
    speed of the connection, parity, and status of the process. Consequently, when
    booting to multi-user mode, all desired ports should be initialized. When coming
    up into maintenance mode, the configuration is limited because /etc/inittab determines
    what ports to turn on. In essence,/etc/inittab is a structured file containing
    data parameters for ports and device files specified in it. The system administrator
    can determine what ports to bring up at any particular run level.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 80 — Distributed UNIX System Administration


    The init daemon determines the run level of the system. When booting the init
    daemon becomes the first process to start and has a process ID of 1. Based on
    the run level specified, the /etc/initabb file gives init action information on
    which ports to open. The communications protocols to interface with the terminals
    are obtained from the file /etc/getdefs. While the system is up, it must be running.
    During up time, init periodically wakes up and checks the /etc/initabb file. To
    force init /etc/initabb, enter init q (telinit -q on some systems) at the prompt.
    Sample output of an initabb file is shown below:


    ```

    fs:sysinit/sbin/rc ap S

    is3:initdefault:

    p3:sl1234:power=/usr/sbin/shutdown -y -15 -g0 >dev/console 2>&1

    s0:wait/sbin/rc0 >dev/console 2>&1 </console

    s1:wait/sbin -y -is >dev/console 2>&1 </console

    fw0:wait/sbin/umask 2 >dev/console 2>&1 </console

    a24:respawn:/etc/get tty00 9600 #Punch Block A24

    ```


    The /etc/initabb file contains four fields separated by a colon (:). The first
    field provides an ID of which the process will run, so more than one run state
    can be entered. The next field specifies an operation to take (described in Table
    5.1). The last field contains the program to be executed and any other argument
    that needs to be passed to the program. Many initabb files are also commented
    with the # character by the system administrator to make them easier to read.


    In the last line of the previous example, #Punch Block A24 tells the administrator
    to what this device is attached — an aid in troubleshooting in case of a failure.
    The 9600 before the command refers to the baud rate being passed and points to
    the communications protocol in the /etc/getdefs. Note in first line that the sysinit
    operation does not specify a run level. This is because this process runs before
    your console is online and the specified init processes run.


    Not all initabb files follow the layouts described above, all UNIX systems follow
    the same type of process to communicate with various devices. Variations on the
    same theme include making the init.d a subdirectory under /etc and including various
    system configuration files within this directory. Other systems keep the terminal
    information in /etc/ttytab and merge port and terminal type information into /etc/ttytab.


    To pull all of this information together into a general cross-platform description,
    the most popular UNIX configurations have the ability to control port and device
    processes with the /etc/initabb, /etc/ttytab, or /etc/ttys, depending on the flavor
    of UNIX. The setup arguments for getty in /etc/initabb are located in /etc/getdefs.
    For /etc/ttytab or /etc/ttys, these parameters are found in /etc/gettab. The terminal
    type for referenced terminals are either in'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Maintaining Hardware — 81


    the /etc/ttytype (and /etc/initab files for systems that use /etc/initab or the
    /etc/ttytab and /etc/ttys files with their terminal types defined within themselves.
    Others such as Solaris have their own convention for these files administered
    through the sacadm process, which acts as a system configuration manager.


    # Table 5.1 /etc/initab action operations.


    | /etc/initab operation field | Description |

    | boot | Starts the process at boot time. When the process terminates, it does
    not restart, but the system continues to boot and does not wait for this process
    to terminate. |

    | bootwait | Starts the process at boot time. When this process terminates, it
    is not restarted, but the system waits until the process terminates. |

    | initdefault | The default level. If no run level is specified, the administrator
    must supply the default level. |

    | off | Checks to see if a process is running. If so, a warning is sent and the
    process terminates. A built-in delay is provided by the operating system prior
    to termination. |

    | once | Starts a process once. Specifies that this process does not restart when
    it terminates, and the system continues to load processes, waiting for this process
    to terminate. |

    | powerfail | Starts the process only when a power fail signal is sent to init.
    This operation waits for the process to terminate before continuing. |

    | respawn | Starts a process. Specifies that the system continue to load processes
    not waiting for this process to terminate. When this process terminates, the respawn
    operation restarts it. |

    | sysinit | Loads a process before the init daemon initializes the console. This
    process must terminate before additional processing can continue. |

    | wait | Starts a process and waits for it to terminate before going on to the
    next process. |'
