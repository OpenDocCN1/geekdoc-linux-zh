- pgno: 302
  md: "# Appendix D\n\n# Using the vi Editor\n\n# Introduction\n\nvi is an editor\
    \ commonly used in UNIX environments. Its commands are easy to use once learned.\
    \ Unfortunately, by word processor standards, vi can be archaic and difficult\
    \ because it is not intuitive. Nonetheless, it is an extremely valuable tool for\
    \ the UNIX system administrator.\n\n# Modes of Operation\n\nvi operates in two\
    \ different modes: command mode and insert mode. Command mode is used for cursor\
    \ control and file operations. Insert mode is used for entering and manipulating\
    \ text. Executing commands in the wrong mode will result in no action taken by\
    \ vi followed by beeps to indicate an invalid command.\n is in command mode at\
    \ startup. To enter insert mode, press the a, i, or o key (explained in Insert\
    \ Mode later in this chapter). To return to command mode, press the Esc key. You\
    \ will toggle between insert and command modes often while entering text and moving\
    \ about the screen."
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Command Mode


    vi is in command mode at startup. When in insert mode, enter command mode by pressing
    Esc. The following commands are case sensitive. Commands with the same letter
    but a different case perform different tasks.


    # Exit Commands


    Esc followed by a : (colon) allows you to exit vi and perform certain file operations.
    The exit commands are:


    +   :wq write file and quit

    :w write file (do not quit)

    :q quit

    :q! quit and not save changes

    :w &lt;filename&gt; write to the file named &lt;filename&gt;

    :w! &lt;filename&gt; overwrite the file named &lt;filename&gt;

    :r &lt;filename&gt; read in &lt;filename&gt; (and append at the point of the cursor)


    # Cursor Control


    These commands move the cursor.


    +   j move down one line

    k move up one line

    h move left one character

    l move right one character

    w move forward one word

    W move forward one word, punctuation ignored

    b move back one word

    B move back one word, punctuation ignored

    $ move to the end of line

    ^ move to the beginning of the line

    { go to previous paragraph

    } go to next paragraph

    g go to last line in the file'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'nnG go to the nth line in the file, where nn is the line number


    H move to top of screen (home)


    M move to middle of screen


    L move to bottom of screen


    Cntl-F move forward one screen


    Cntl-B move backward one screen


    Cntl-D move forward a half screen


    Cntl-U move backward a half screen


    Return key move cursor to start of next line


    + (plus) move cursor to start of next line


    (dash) move cursor to start of previous line


    ^ (carat) move cursor to start of the current line


    e move to the end of a word


    E move to the end of a word, ignore punctuation


    { move to start of previous paragraph


    ) move to start of next paragraph


    ( move to start of previous sentence


    ) move to start of next sentence


    # Search Commands


    Search commands are used to locate specific text (indicated below by the term
    textcriteria) while in command mode. These commands allow you to find text based
    on the search criteria provided. vi stores the search pattern until a new search
    pattern is specified. Note that a space is not entered after the command.


    ```

