    the owner making the copy.

    Two methods can be used to assign permissions: the = symbol and the umask command.
    To assign read and write permissions to all, use


    ```

    # chmod a=rw filename

    ```


    in addition to the previous methods of


    ```

    # chmod ugo+r+w-x filename

    ```


    or


    ```

    # chmod 555 filename

    ```


    or


    ```

    # chmod +rw-z filename

    ```


    Finally, the umask command allows the permission mode to be set automatically.
    In the output of the .profile file shown previously, umask 077 is the first command
    in the file. The 077 does not set the permissions bit to 077 as chmod 077 does
    by setting permissions to read, write, and execute for everyone and the group
    and turning them off for the user, the owner of the file. Rather, umask 077 masks
    out the read, write, and execute bits for the group and other but not for the
    user. umask 077 effectively turns the read, write, and execute permissions on
    the user and turns off all other permission bits. The resultant file, when created
    by the user, is


    ```

    -rwx------ 1 user other 15659 Feb 19 11:32 filename

    ```'
