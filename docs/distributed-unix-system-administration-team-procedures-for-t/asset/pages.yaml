  md: '# 110 — Distributed UNIX System Administration


    IP addresses are four bytes long. The first two bytes identify a logical network.

    The third and fourth bytes identify a host, for example, in the address 250.100.99.35,
    the fields 250.100 specify the network and the fields 99.35 identify the host.
    Routers use the IP address to route the data to the correct destination (Figure
    6.3).

    A breakdown of the example address above into binary format is:


    | Network | First field | | |

    |---|---|---|---||

    | | 250 | = | 1111 1010 |

    | | Second field | 100 | = | 0110 0100 |

    | Host | Third field | 99 | = | 0110 0011 |

    | | Fourth field | 35 | = | 0010 0011 |


    IP addresses also follow a class structure that depends on the type of network.
    This following table shows the classes and their values in the first field of
    the IP address.


    | IP class | First field range |

    |---|---||

    | A | 1–126 |

    | B | 128–191 |

    | C | 192–223 |

    | D | 224–239 |

    | E | 240–254 |


    The classes allocate bytes to the network and host parts of an IP address differently.
    The format for a Class A address is net.host.host. Only very large networks receive
    this class of address. Class A addresses are virtually impossible to get. Class
    B addresses, format .net.host.host, are assigned to large subnetted networks and
    are also rare. The more commonly assigned Class C addresses, format .net.net.host,
    are given to growing or sizes and can be obtained in blocks. Class D and E addresses
    are still in development or are experimental. These classes are needed to help
    fill the expanding world of TCP/IP and the Internet.


    Note that the first field does not use the values 0, 127, or 255. These numbers
    are reserved for special purposes. The value 0 (in any of the four fields) stands
    for the local host or network. For example, an address of 0.0.45.50 refers to
    the 45.50 on the local network. The value 127 identifies a loopback network, a
    virtual network that has no hardware interface and includes only the local host.
    The address 127.0.0.1 refers to the current host.


    The value 255 identifies the network portion of an IP address that has been masked
    in a technique called subnetting. Extending the utility of the IP addressing scheme.
    Using subnetting, large networks limit the number of hosts recognizable by dividing
    the network into logical subnets. Assigning part of the host portion of the IP
    address to the network portion creates the logical subnets. For example, a Class
    B address can be changed from'
