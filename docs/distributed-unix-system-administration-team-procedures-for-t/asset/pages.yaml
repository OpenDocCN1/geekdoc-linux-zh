- pgno: 99
  md: '82 — Distributed UNIX System Administration


    # Specifying Terminal Type


    The terminal type allows users to access the system with terminal settings that
    match their workstation. If terminal types are incompatible, such as when the
    user uses an incorrect terminal type, the system administrator will get many calls.
    The main symptoms of an incompatible terminal type are keyboards or displays not
    working as expected. For instance, keys pressed may do unexpected things or nothing
    at all because the terminal type has incorrectly mapped the keyboard.


    You can use the SET procedure described in Chapter 1 or the tset utility to change
    the terminal type. For instance, use tset in a .profile to query for a specific
    terminal type. Or if your dials expects a VT100 terminal, enter


    ```

    tset -m dialup:vt100

    ```


    receiving a decision response from the system of


    ```

    TERM = (vt100)?

    ```


    To accept this terminal press Enter. For a different terminal type, enter a new
    one, such as wise or whatever is supplied by your local workstation. The information
    that defines the terminal types is found in the termcap or terminfo files. A common
    means for establishing the correct terminal type is to provide a command setup
    like the following when logging in:


    ```

    set noglob

    eval ''tset -s -Q -m dialup:vt100 -m local:vt52''

    unset noglob

    ```


    The noglob option is used to ignore unwanted characters that some terminals want
    to kick out the terminal. The output of the tset command is suppressed with the
    -Q option and by requests through the -s option to use shell command input to
    set the environment. Next, eval checks for a connection through a dial port. If
    true, the program prompts the user for the default terminal type vt100. If the
    login is not through a dialup, but rather through the local LAN or other defined
    access method, it assigns the local terminal type of vt52.


    # Diagnosing and Fixing Problems


    To investigate terminals, the stty command is used. This command provides information
    on the terminal driver and changes terminal driver settings. stty displays a complete
    reading on a terminal by entering


    ```

    tty -a

    ```'
  merge: -1
  img_proc: true
