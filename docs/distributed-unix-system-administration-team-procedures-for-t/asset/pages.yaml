    ----------------End Data File Records----------------

    ```


    Each assessment question must include a module. This makes the assessment question
    a "prime" question for the module. In the last example above, the module assessment
    is for hardware. The hardware compliance value is 0, indicating that the administration
    of this resource is not in compliance. If this assessment were in compliance,
    the database record would read:


    ```

