    # Internet and Enterprise


    # Challenges Facing Internet Development


    A major challenge to development of the Internet is security. Misunderstood or
    poorly designed and implemented security measures create deficiencies, insufficient
    access restrictions and out-of-date virus checking. The Morris Worm is an extreme
    example of the damage a hole in security can cause. Back in 1988, the Morris exploited
    software security deficiencies and policy inadequacies. The worm relied on the
    fact that some administrators did not change administrator-password from the vendor
    defaults. The finger daemon and sendmail also provided leaks into unauthorized
    areas. Overflowing the finger daemon''s input buffer gave the worm access to the
    privileged shell under which the finger daemon ran. With sendmail, the worm gained
    access through the DEBUG feature, which was left on by an administrator.


    In spite of the security risks, networks continue to be added, making uncontrolled
    growth arguably a bigger challenge than security. New addressing schemes are being'
