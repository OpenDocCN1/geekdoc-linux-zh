- pgno: 305
  md: '# Text Commands


    One or more characters can be deleted while in command mode where [n] is the number
    of characters or lines for command interpretation. The commands can be used without
    an n value, giving an n default of 1. For example, 7x (i.e., [n]x) deletes seven
    characters, but using just x deletes only one character.


    +   - x delete character(s)

    - dd delete line(s)

    - D delete the remainder of a line from the cursor


    # Cut and Paste Commands


    Command mode also allows text to be copied into and from buffers, commonly known
    as cut and paste. Also, the [n] option is available to specify the number of lines
    to be used by the command.


    +   - YY yank a line

    - "ay yank line into a specified buffer (the buffer is labeled a)

    - y p place a yanked line after the current line

    - "ap place the contents of buffer after the current line

    - P place a yanked line before the current line

    - "aP place the contents of buffer before the current line


    # Insert Mode


    The following commands allows you to enter insert mode and enter and manipulate
    text. Notice that these commands are case sensitive. Commands with the same letter
    but a different case perform different tasks.


    +   - i insert text at the cursor location

    - I insert text at the beginning of the line

    - a append text after the cursor

    - A append text at the end of the current line

    - o open a new line below the cursor

    - O open a new line above the cursor

    - J join two lines

    - u undo the last change or command (U can be used too)'
