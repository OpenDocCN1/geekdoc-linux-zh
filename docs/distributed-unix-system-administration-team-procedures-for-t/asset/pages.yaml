  md: '# Maintaining Hardware — 89


    As Table 5.5 shows, you can also request information on specific printers using
    the -a, -p, and -v options. For example:


    ```

    # lpsat -plaser2

    ```


    shows the status of printer laser2.


    # Starting and Stopping the Printing Process


    The 1p command starts a print job, and the System V print daemon, lpsched (short
    for print scheduler), spools the print request and tracks it from the time you
    enter the 1p command. First, 1p talks to the scheduler and creates a temporary
    file containing the request ID, which it places in the spooler directory /usr/spool/1p/Request
    Out. If the printer is currently busy, lpsched adds the print request to a First
    In First Out (FIFO) queue and waits until the printer is free before submitting
    the next request ID for printing. When the requested destination is available,
    lpsched transports the file to the requested device. The acronym spool stands
    for simultaneous peripheral operation off line. Basically, a spooler takes data
    from computer memory and transports it to a peripheral device. The peripheral
    device runs slower than computer memory, so the data is placed in a file and to
    a queue. When the requested destination is available, the spooler transports the
    file to the requested device.


    The cancel command removes a print request from the queue or cancels the printing
    job. When lpsched accepts the job, it sends the user a response, like request-id
    is laser2-5677 (1 file), telling the user the destination of the print job and
    that the number 5677 is the request ID. To cancel the print job, the user simply
    enters cancel laser2-5677. If successful, lpsched responds with a message confirming
    the print job has been cancelled. lpstat, described previously, can also provide
    the request ID and destination.


    lpsched when the system is booted. To prevent having more than one copy of itself
    running at the same time, lpsched creates a lock file called SCHLOCK. If startup
    lpsched finds a SCHLOCK file, the daemon terminates. Similarly, if the lock file
    does not exist, lpsched creates this file to prevent other schedulers from running.


    lpshut stops lpsched and removes the SCHLOCK file. After lpsched stops, 1p can
    still send requests to the spooler directory, but no jobs will be printed. lpsched
    can be restarted using the command /usr/lib/lpsched. If it was stopped by any
    process other than lpshut, SCHLOCK must be removed manually before lpsched can
    be restarted.


    ![](img/8f8a5b924793524d71746c72ac703b14_106_0.png)'
  merge: -1
  img_proc: true
