  md: '# Chapter 12


    # The SAmatrix Case Study


    This chapter presents a description and interpretation of the results of the case
    study done during development of SAmatrix.


    In the actual case study, 50 assessment instruments were sent to 50 locations
    out of a total population of 94 sites within the organization. Forty-one responses
    to the instrument were received a return of 82 percent of the sample population.
    Four responses were rejected in whole or in part for invalid data or refusal by
    the respondent to participate in the study. The valid returns evaluated for the
    study consisted of 37 cases or 74 percent of the sample population. This compares
    to a return rate of 70 percent, which was conducted in a pilot study.


    The results to each survey question appear in Appendix A. Question numbers and
    variables reported in Appendix A are matched to the instrument questions in Chapter
    11. An SPSS data file and the associated variables applied to each question were
    constructed and the appropriate t-tests and Pearson r statistics were run against
    this to determine linear relationships of the variables and reliability of the
    instrument. The data file appears in Appendix B and illustrates the SPSS script
    used. The t-test results are in Appendix C.


    # Matrix Results


    The matrix of Table 11.1 was applied to the assessment results. The questions
    were inserted into the relationship model of Table 11.2. Questions were considered
    affirmative (Yes) when a task or response on the survey was checked. When tasks
