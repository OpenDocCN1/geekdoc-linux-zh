- pgno: 57
  md: '# 40 — Distributed UNIX System Administration


    This is a response to data collected in Phase 1 indicating that duplicate inodes
    exist. A y response allows the utility to continue with no action taken, and a
    n terminates fsck. If Phase 2 finds an inode out of range — that is, it is an
    inode number greater than the inodes allocated — you receive:


    ```

    OUT OF RANGE I=6789

    NAME=/dump

    REMOVE?

    ```


    Because this is an inode that does not exist, answer y and get rid of it. Other
    errors such as


    UNALLOCATED I=5454 OWNER=root MODE=0 ...... (additional info follows)


    or


    ```

    DUP/BAD I=4367 OWNER=wetsch MODE=666 .......

    ```


    ask you to remove the file. Because in nearly all cases these are unallocated
    inodes or bad or duplicate blocks, it is best to answer y and have removed it
    with the REMOVE presents itself. On files with duplicate blocks, it is best to
    run fsck and remove them. Phase 3, depicted in Step 6, checks connectivity. This
    makes sure that your inodes are connected to a directory. If a disconnected inode
    is found, it will be connected to the lost+found directory. You will receive errors
    indicating unreferenced directories with the output


    ```

    UNREF DIR OWNER=root MODE=666...

    CONNECT?

    ```


    If you are successful with a y response, then the unreferenced directory is attached
    to lost+found. If unsuccessful, you receive a SORRY with


    NO SPACE IN lost+found DIRECT


    or


    lost+found directory


    It is good practice to see if a file system has a lost+found directory. If not,
    you want to create one using the mkdir command. Then you must slot or notch the
    directory so there is room for inode storage. The procedure is:'
  merge: -1
  img_proc: true
- pgno: 58
  md: '```

    # mkdir lost+found

    # cd lost+found

    # touch fa fb fc fd fe ff [.........nn]

    # rm f*

    ```


    You can create as many files in lost+found as you like, but you must also delete
    them to create notches — usually 20–30 notches are enough. When fsck returns lost+found
    errors, your lost+found directory is either full or missing, so when you want
    to be sure to create a directory that is large enough. Note that when files are
    placed in lost+found, they are referenced by their inodes and lose their filename.
    It is up to the system administrator to investigate these files and find their
    rightful owner. If not traced to an owner, they can be moved for further research
    or deleted. However, it is recommended that they not be allowed to remain in lost+found
    because they take away the number of notches supplied in the directory. Also,
    n response to a Phase 3 reconnect ignores the error and continue.


    Phase 4 checks reference counts. During this step (7) you could receive UNREF
    FILE errors. This message is the unreferenced directory errors in Phase 3. Respond
    y to connect the file node to the lost+found directory. If you should receive
    the same lost+found directory errors mentioned in Phase 3, you are given an option
    to respond {y|n} to CLEAR? If inde link counts do not match, you will receive
    a LINK COUNT report on a file or directory. If {y|n} query you receive from this
    message is ADJUST? A y adjusts the link count to its proper setting and an n ignores
    the problem. If unreferenced files are not cleared out you are not allowed to
    move the file system.


    Phase 4 is the time during the run of fsck that the bad blocks and duplicates
    reported in Phase 1 can be cleared. BAD/DUP file and directory errors are reported,
    and a y is required to clear them at the query prompt. The superblock free inode
    count and compares. Phase 4 also compares it to the fsck count of the free inodes.
    If a discrepancy is found, you get the error


    # FREE INODE COUNT IN SUPERBLCK


    FIX?


    A corrects the count and an n leaves it in the error state. The inode count checks
    the count of the links to files and directories in the file system.


    Phase 5 takes us to Step 8 of the fsck run. This phase checks the free list. The
    free list is list of empty blocks maintained by the file system so that it has
    the correct number of free blocks available. This step keeps the size of the file
    system intact. It reports on the number of bad blocks in the free list, number
    of duplicate blocks in the free list, a bad free block count, or the number of
    blocks that were discovered but are missing from either the allocated or free
    block list.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 42 — Distributed UNIX System Administration


    Queries you respond (y|n) to


    +   - FREE BLK COUNT WRONG IN SUPERBLK

    FIX?


    This fixes the block count in the superblock with an obvious y response to FIX?


    +   - EXCESSIVE BAD BLOCKS IN FREE LIST

    CONTINUE?


    This reports that you still have too many unacceptable blocks in the free list.
    The y can terminate fsck with an n, but to finish fsck you need to answer y. The
    y response causes no action to be taken against the blocks, but you undoubtedly
    need to run fsck again.


    +   - EXCESSIVE DUP BLOCKS IN FREE LIST

    CONTINUE?


    A (y|n) response here generates the same action as the previous error message
    but may also cause the next error.


    +   - BAD FREE LIST

    SALVAGE?


    Although more one type of free list error could be referenced by this message,
    you still want to have a good free list. Responding with an n will not fix it.
    A refresh of the free list block is accomplished with a y response as a new correct
    list replaces the old one.


    Because the importance of your free list, Step 9 of the fsck process calls Phase
    6 to SALVAGE FREE LIST. During Phase 5, fsck attempts to fix this list, but just
    in case, the free list is rebuilt in Phase 6. This is particularly beneficial
    if the salvage operation during Phase 5 had a problem.


    Now that fsck has completed all of its steps, it terminates, but not without leaving
    a possible parting messages. If changes were made to a file system by fsck, you
    will see


    ***** FILE SYSTEM WAS MODIFIED *****


    The more cryptic response


    ***** BOOT UNIX (NO SYNC) ***** *****


    is also possible if the root file system or the root superblock was modified.
    It is important to note that fsck has modified the root file system on disk but
    the "bad" root file system information is still in memory. Therefore, do not run
    the sync command because you will copy the bad memory copy over the good copy.
    Any other'
