    | Survey question | L | Y/N | C | F | R | Comments |

    |---|---|---|---|---|---||

    | Is building access controlled? | P | Y | 1 | 1 | | |

    | Is access to the computer facility controlled? | P | Y | 3 | 1 | | Badge reader
    |

    | Are ID badges required? | P | Y | 0 | 0 | | |

    | Are ID badges worn in the computing facility? | P | Y | 0 | 0 | | |

    | Are ID badges worn in the building? | P | Y | 0 | 0 | | |

    | Is the media storage facility separate from the computer room? | P | N | 7 |
    2 | 14 | Separate facility required |

