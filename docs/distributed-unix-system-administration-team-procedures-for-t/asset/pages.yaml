    # Statistical Tests


    It may help you understand how SAmatrix results were analyzed during the development
    stage. To gain meaningful results from the survey, correlation methods were employed
    to relate the results of the survey to the administrative model using Pearson
    r correlation statistics. The correlation results were used to test the research
    hypotheses using t-test statistics. The hypothesis was tested by correlating and
    checking the results of the instrument to the major variables. Computer-based
    research methodologies were employed using the SPSS (Statistical Package for the
    Social Sciences) statistical software package. (However, any decent statistical
    package can be used to provide the needed results.) The results of the tests provide
    a quantitative picture of how the information systems of the organization as a
    whole perform in relation to the administrative model.


    The significance of the correlation coefficient r was tested using t-test statistics.
    Two-tailed significance was used for the assessment assuming the null hypothesis
    is rejected with a 95 percent level of confidence (α = 0.05). The null hypothesis
    in this case is that the organization''s information systems are not at risk.


    # What to Expect


    An ideal operation would be 100 percent compliant in all model models. Greater
    than 90 percent compliance indicates that some minor services are missing but
    puts a system at low risk. Less than 90 percent but more than 80 percent indicates
    that attention to the overall aspects of the model are provided but gaps in major
    areas undoubtedly exist and can place a system at risk. Any evaluative score less
    than 80 percent indicates that the lack of proper administration for a module
    exists throughout the organization or area assessed.'
  merge: -1
  img_proc: true
