    Another file, /etc/hosts.equiv, lists all hosts allowed to log in without a password,
    also known as trusted hosts. The /etc/hosts.equiv file is only updated when machines
    are added as trusted hosts. The machine names of the hosts added to this file
    include the name of the machine whose /etc/hosts.equiv file you are editing. When
    machines are made equivalent, the machine accessing by the host checks to see
    if the user account exists. If so, the user is allowed to access the destination
    without reentering a password. Use caution when adding hosts to /etc/hosts.equiv.
    Disk workstations should never be trusted and should always require a login to
    gain access.


    In addition mapping IP addresses to text names, hardware on a diskless workstation
    must be mapped to an IP address. The protocol called Reverse Address Resolution
    Protocol (RARP) provides this service. A newer, more frequently used protocol
    BOOTP also provides this translation function. System hardware defines which protocol
    must be used.


    On systems using BOOTP protocol at startup, a diskless workstation requests a
    request for boot information. When the bootpd daemon receives a request, it reads
    the boottab file looking for the Ethernet address of the requestor. If bootpd
    finds the appropriate information, it returns the requester''s IP address and
    the name of the file from which the requester must boot. An entry in the boottab
    file could be:


    ```

    client:

    :hd=/clientboot:\

    :ha=0600F56458FF:

    :ip=185.124.110.220:

    :bf=boot1:

    ```


    In this example, the boottab file gives a home directory (hd) of /clientboot,
    an Ethernet address (ha), an IP address (ip), and a boot file (bf) of boot1.


    The boottab file can include a group boot file from which individual clients can
    inherit boot parameters. This would be accomplished by setting up a boottab directory
    that identifies boot parameters for a group of clients, such as, 486group. Then,
    any client could inherit the general bootup parameters by specifying the template
    host'
