- pgno: 317
  md: '300 — Distributed UNIX System Administration


    # # 1. Introduction


    # ## 1.1. Technical Support


    Questions, feedback, and helpful input can be directed to the author via e-mail
    at DR_WETSCH@prodigy.net.


    # ## 1.2. Disclaimer


    Use of this software or any results from an analysis performed by this program
    is at the sole discretion of the user. The author or publisher assumes no liability
    for its use or interpretation of the results by a user.


    # ## 1.3. System Requirements


    SMatrix requires Windows 3.1 or higher.


    # ## 1.4. SMatrix Overview


    SMatrix is a tool for assessing system administration and system management practices.
    SMatrix provides a framework on which a user can build an assessment tool customized
    for a specific system. Using the information provided in the book and from other
    system management sources, a user can develop a comprehensive set of assessment
    questions that pertain to a particular computing environment.


    The program is based on a robust statistical application of system administration
    practices using a statistical analysis package to analyze data gathered from a
    manual survey. The simplification of the analysis in SMatrix reduces the statistical
    analysis to a set of rules that can be applied to data. The analysis of the data
    can provide feedback to the user on whether or not the system is at risk. That
    is, as the risk to a system increases, the integrity and reliability of a system
    decreases. The methodology used in SMatrix was successfully applied to a distributed
    system of national scope.


    SMatrix contains five modules that assess major areas of system administration:
    Software, Hardware, Network, Security, and Operations. A database of more than
    100 assessment questions that relate to each module is supplied with this program.
    In addition, refinements and enhancements are being planned for future releases
    of SMatrix to improve the system interface and the expert analysis of the data.
    User input is important to improving this software and comments are appreciated.


    No system is free of risk. The best risk assessment this program can provide is
    LOW risk. A result showing moderate risk, substantial risk, or high risk may justify
    a review of the system administration policies and procedures of the organization.
    If a'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'result shows low data reliability or questions the reliability of the data,
    individual assessment modules should be checked to make sure they are comprehensive.


    # 2. Installation


    The disk contains the files:


    +   - samatrix.exe// The SAMatrix program

    - samatrix.adm// The SAMatrix database

    - sauser.txt// The SAMatrix User Guide (this document)


    To install SAMatrix, create a directory on the drive of choice; for example, C:\samatrix
    Copy the contents of the disk to the new directory.


    # 3. Basic Operation


    # 3.1. Starting the Program


    Start SAMatrix from the File or Start menu. Select Run and enter the drive, directory,
    and executable file samatrix.exe, for example, C:\samatrix\samatrix, to start
    the program. The main screen displays the main screen, which contains a menu bar,
    a scrollable list of the assessment questions, the name of the currently loaded
    database file, and Edit and Cancel keys.


    # 3.2. Loading a Database


    To load a database into SAMatrix for analysis, select File/Open, then the name
    of the database file. SAMatrix recognizes files with the extension adm. A template
    database file called samatrix.adm is provided with this program.


    To learn how to create or customize a database, see Section 4 of this document,
    Creating/Customizing a Database.


    # 3.3. Analyzing Data


    When the program is loaded, you can immediately conduct an analysis of the data
    by clicking on the Analysis menu and selecting either the module to analyze or
    by selecting System to analyze the entire system. If you are using the samatrix.adm
    file, note that all numerical fields in the database contain zeros (0), so all
    data analysis comes back as 0 percent compliant.


    ![](img/8f8a5b924793524d71746c72ac703b14_318_0.png)'
  merge: -1
  img_proc: true
- pgno: 319
  md: '302 — Distributed UNIX System Administration


    Module assessment will only show compliance of the prime module assessments. A
    system assessment will show compliance of the entire system, including prime assessment
    areas and related compliance modules.


    The analysis is completely dependent on the quality of the input provided. Fair
    assessment and common sense should be provided. A document should be developed
    giving background information on the assessment questions, as the objective of
    the question, examples of compliance, or a sample response. The background document
    provides a system administrator or system manager with a common reference. It
    helps them to understand the meaning of a question and whether or not the system
    complies. It also helps to identify associated areas in which the system does
    not comply. It can vary between environments, so it is up to the organization
    to implement a standardized assessment. If assessment and risk analysis is already
    in place, you can break your assessment down into the appropriate data format
    for Smatrix.


    # 3.4. Printing a Matrix Listing


    Smatrix can print a listing of the current database. Select File/Print on the
    menu bar. Here is an example of the output:


    ```

    Matrix Listing


    Module: S

    Assessment: Do you have a software configuration management

    plan?

    SW: 0

    HW: 0

    NET: 0

    SEC: 0

    OPS: 0

    ```


    Only the complete database can be printed.


    # 3.5. Exiting Smatrix


    To exit Smatrix, select Cancel on the main screen. If changes have been made since
    the last cancel, Smatrix will ask if you want to save the changes. Choose Yes
    or No. The program then closes. Alternatively, you can choose File/Exit or the
    exit icon in the corner of the screen. All methods prompt you to save changes.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 4. Creating/Customizing a Database


    The information gathered by your survey may be added to a database file in order
    for SMatrix to analyze it. (See Chapter 11, Implementing a Systems Administration
    Matrix, for more information on designing a survey.) You can use the samatrix
    database file .adm provided as a template or create your own.


    An SMatrix database file must be ASCII text. Use any editor to create the file,
    but the data must be in the record format described in the section that follows.
    Keep each database file to a maximum of 200 assessment questions. Consider making
    additional assessment files if you exceed this amount.


    It is possible to maintain more than one database file. For instance, in an enterprise
    system you can maintain assessments for specific systems at specific locations
    as well as an enterprise system to measure the overall enterprise. However, only
    one file at a time is loaded into the system.


    # 4.1. Record Format


    A record contains seven data elements separated by a line break. The fields in
    each record must be in the following order:


    +   - Assessment

    - Module

    - Software Compliance

    - Hardware Compliance

    - Network Compliance

    - Security Compliance

    - Operations Compliance


    The values that can be assigned to these data elements are:


    +   - Assessment | A text string of an assessment question.

    - Module | The character values S (software), H (hardware), N (network), C (security),
    and O (operations).

    - Compliance Data | Either a 0 or a 1, where 1 = TRUE and 0 = FALSE


    For example, the last record in the sample is:


    +   Do you provide security training to new users? (Assessment)

    - C (Module)

    - 0 (Software compliance)

    - 0 (Hardware Compliance)

    - 0 (Network Compliance)

    - 0 (Security Compliance)

    - 0 (Operations Compliance)'
  merge: -1
  img_proc: true
- pgno: 321
