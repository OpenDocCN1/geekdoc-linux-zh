  md: '# Evaluate the Results


    Before designing and writing a survey, you must answer the question, "How will
    the data be analyzed?” SAmatrix can save you some time and effort by analyzing
    the data gathered from the survey. The program is based on a more robust statistical
    application of system administration practices using a statistical analysis package
    to analyze data gathered from a manual survey. The simplification in SAmatrix
    reduces the statistical analysis to a set of rules that can be applied to the
    data provided. The analysis of data can then provide feedback to the user on whether
    or not the system is at risk. That is, as the risk to a system increases, the
    integrity and reliability of a system decreases. The methodology used in SAmatrix
    was successfully applied to a distributed system of national scope.


    When the program is loaded with a properly formatted database file, you can immediately
    conduct an analysis of the data by clicking on the Analysis menu and selecting
    either a module to analyze or selecting System to analyze the entire system. The
    analysis depends totally on the quality of the input provided.


    Module assessment will ONLY show compliance of the prime module assessments. Figure
    11.1 shows an example of a module assessment from SAmatrix. A system assessment
    will show compliance of the entire system, including prime assessment areas and
    related compliance modules. Figure Figure 11.2 shows an example of a system assessment
    from SAmatrix. Note, all fields contain 0 because the sample database contained
    no data.


