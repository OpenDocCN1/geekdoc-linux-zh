- pgno: 78
  md: '# Maintaining Access to Applications — 61


    The pacct command checks the size of the pacct files and lets you know if there
    is enough space available in the /usr/adm directory. If the file system is nearly
    full, the utility stops writing process records, as the pacct file gets large,
    starts a new pacct file and labels the old files sequentially (i.e., pacct1, pacct2,
    pacct3, pacct4, ...). Process accounting stops when fewer than 500 blocks are
    available. You can start the accounting process again by freeing up the space
    and running knapsack pacct.


    The runacct utility is designed to create reports from the accounting information
    by integrating the account records. You can specify the output of the utility
    in a filename of your choosing. It is recommended that to kicking off the utility
    in runacct you run the disk /usr/lib/acct/. The importance of this is to compile
    metrics before runacct is executed. It should also be noted at this point that
    the report files are in ASCII format.


    To condense your reports further into a monthly summary, use the monacct command
    on a monthly basis. This utility creates summary files in the fiscal directory
    and restarts them in the sum subdirectory. monacct is extremely useful for summarizing
    your system usage, and if you are billing for services, it is a means of generating
    your billing. This summary gives you a good measure of how your system is being
    used and provides important information on processes that consume the most resources
    and that execute with little effect. For example, you can document specific loads
    on your system, identify processes that are substantial burden, and modify the
    times these processes run. This obviously allows you to distribute your available
    resources better and make more resources available to users when they need them.
    It is preferable to run the accounting utilities on a regular basis at a time
    when system usage is at a minimum.


    Managing the accounting files is your next priority, once you get the feel for
    using the accounting procedures for your system. You must keep strong accounting
    information management and eventually move them to tape. There is not really a
    rule of thumb as to how often you archive the files, what you should keep on your
    hard disk, when to move the files to tape, when they are no longer needed, and
    so forth. Your guide should be what your organization requires, factoring in the
    rate of growth of the files, which depends on system usage and the amount of disk
    space you have available. A general method used to maintain these files is to
    copy them to an archive directory that you create and use the nulladm command
    to create a filename with the proper permissions of 664, assigning both user and
    group to adm, such as /usr/lib/acct/nulladm.


    There are many variations on the accounting process. One primary difference is
    in which directories the files are kept. Some System V flavors use the /var/adm
    instead of the /usr/adm directory to store accounting files and associated subdirectories.
    In addition, you may have a set of options available to you in UNIX version that
    are not available in another. Therefore, it is always good to check the native
    documentation to see what is available and where your accounting files and utilities
    are stored.'
  merge: -1
  img_proc: true
