    # Administration


    As computer technology rapidly changes, so does the Internet. Faster networks
    are being researched and developed worldwide. Commerce on the Internet has increased
    to the point that that users probably get unsolicited e-mail advertisements more
    often than they get unsolicited phone calls from telemarketers. System protocols
    on the Internet used to deal only in character-based information have expanded
    to graphics-based Web sites using http. Languages have also been developed to
    support Web servers, such as the HTML and Java.


    Such rapid growth requires monitoring and coordination. Originally handled by
    government agencies such as DARPA, administration of the Internet is now moving
    away from government control and toward the private sector. Now, administration
    of the Internet falls to organizations of commercial groups. Routine administration
    such as assigning IP addresses, managing the Domain Name System, and managing
    routing information for major backbones have been taken over by a group called
    the Network Information Center, or InterNIC. The members of InterNIC, Network
    Solutions, Inc., AT&T, and General Atomics, provide registration services, directory
    and database services, and information services. An agency called the Internet
    Architecture Board (IAB) provides long-term planning.


    # ## Internet Daemons and Commands


    Table 7.2 provides a list and description of Internet-related daemons. Many of
    the daemons are also used on non-Internet sites for communications and file transfer.


    httpd Web requests on a UNIX machine, but another commercial or privately developed
    Web daemon could be also used. To see the number of httpd daemons running in memory,
    enter


    ```

    # ps -ef | grep httpd

    ```


    To see how many http ports httpd is using, execute


    ```

    # ps -ef | grep httpd | wc

    ```'
