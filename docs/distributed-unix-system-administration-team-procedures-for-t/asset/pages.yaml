- pgno: 197
  md: 'Security Notes: System accounting is the monitoring of system resources. The
    scope of system monitoring also includes system maintenance chores not covered
    by other procedures. The system accounting reports can be used in conjunction
    with security checking to look for anomalous events.


    System Configuration: These practices will be employed on all XYZ Company systems
    except the XYZ training computer. The dodick, runacct, chkpacet, and monacet accounting
    files will be run from crontab.


    Implementation Procedures: On a daily basis, the number of users that have used
    the system will be recorded on the daily checklist. de-also will be run and printed
    with the data recorded on the daily checklist. The following classification for
    file systems is as follows:


    +   - 80 percent full — OK

    - 80-90 percent full — Warning

    - 90 percent full — Critical


    When a file system has reached 90 percent capacity or more, immediate action must
    be taken to reduce the file system to under 80 percent.


    Weekly, du will be run against user directories. User directories that have exceeded
    their assigned limit will be sent a warning statement from the SA as follows:


    > Your assigned directory has exceeded your usage limit by xxx bytes. Please reduce
    your file system size. Failure to reduce your file system size with will result
    in one additional warning. After two warnings your account privileges will be
    suspended.


    Users with no mail privileges will have reductions to their file system made at
    the discretion of the systems staff.


    +   - Assigned quotas for home directories:

    - Class 0–1: 5Mb (9,800 blocks)

    - Class 2: 2Mb (3,900 blocks)

    - Class 3–5: 5Kb (10 blocks)


    The monthly system accounting record will be printed. Data from this report will
    be placed on the monthly checklist for use on the monthly SA report. The monthly
    reports are stored in the directory /usr/adm/acct/fiscal. These reports will be
    accumulated for each fiscal year archived and removed from the system.


    Each month, production areas will be monitored and checked. For production databases,
    this includes database statistics on the monthly SA report.'
