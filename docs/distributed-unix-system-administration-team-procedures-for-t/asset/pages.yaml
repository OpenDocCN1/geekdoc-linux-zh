- pgno: 204
  md: '# Chapter 10


    # Operations Administration


    This chapter introduces the concept of operations administration, the module that
    assesses the system administration practices of the entire organization, not individual
    divisions and departments. An evaluation of system administration practices within
    an organization can determine the amount and location of risk caused by employing
    traditional data processing standards and methods of managing computing resources.


    # Overview


    The task of operations administration begins with an assessment of system administration
    practices. Such an assessment starts by establishing a baseline that identifies
    the operational needs of the organization. This baseline, in turn, provides a
    benchmark for measuring the productivity of information resources.


    Several important questions must be answered to understand the operational needs
    of an organization. These questions are:


    +   * Does a standard administrative model for the organization already exist
    or does one need to be developed?

    * Do the organization''s system administration practices conform to acceptable
    data center operation practices?

    * Can the organization''s information resources be considered at risk?

    * Are basic system administration functions accomplished?

    * What is the effectiveness of automated systems in handling system workload?'
  merge: -1
  img_proc: true
- pgno: 205
  md: '188 — Distributed UNIX System Administration


    When these questions are answered, a baseline can be established and standard
    practices and a model for system administration can be developed, unique to the
    particular enterprise. Using the model and standard practices, the job of operations
    administration can be completed; that is, the on-going and persistent effort of
    cataloging system tasks, ensuring that they are done, and coordinating system
    administration workload for a local system or an enterprise-wide system.


    # Developing Standards


    System administration standards and practices are determined by an organization''s
    system administrators. System administrators incorporate practices that work and
    discard those do not, based on the technology in use. Over time, standard system
    administration practices have evolved from what government and industry expect
    of its information systems. From these practices, an administrative model can
    be developed that can be applied to a large range of organizations. Without a
    systems model, an organization''s operational practices amount to letting the
    skilled administrators do their jobs and hoping nothing catastrophic happens.
    In essence, a unique set of individuals, the sys admin guru, controls the operations
    of a system. System management becomes reactive and chaotic.


    Establishing a system administration model for an organization involves classifying
    the general aspects of distributed systems and working down to the level of the
    individual characteristics of the information system. This general overview must
    ignore specific environments in terms of location, the state of equipment, size,
    and individual organizational attitudes towards a systems environment. While gathering
    general characteristics, specific anomalies that are noted should be recorded
    so they can be addressed in the later edition of the systems administration model.


    The standards are not applicable to every situation; however, similar methodologies
    are needed to avoid undisciplined decentralization, especially when similar applications
    may be used in an organization whose users may not be physically near one another.
    Without clear internal policies, procedures, and controls, vulnerabilities creep
    into an organization''s system as an enterprise responds to the increasing complexity
    of modern business.


    # The Role of the System Administrator


    The standard model used in client/server and other distributed technologies is
    derived from methods of managing computing resources that have been available
    for decades; that is, the old administrative paradigm of efficiencies of operations,
    processing of basic business transactions, collecting and providing information
    relevant to managerial decisions, monitoring and recording employee performance,
    and maintaining records of status and change in business functions.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'In the old paradigm, the system administrator acted as the information middleman
    between user and system. The decentralized nature of data processing today, however,
    has removed the middleman. Users are directly responsible for the transaction
    processing that allows an organization to maintain current business records and
    retrieve data. Users can build applications on a workstation or client system,
    connect to a data repository, and present nearly infinite views of data. In the
    old paradigm, users prepared data for processing (such as typing of punched cards)
    then submitted the data to the operator for input into the computer. Now, users
    submit data to a database directly or over a network. However, direct interaction
    between the system and the user has not eliminated the need for the system administrator;
    it has redefined the role. In the current model of system administration, the
    role of the administrator, crucial to to maintain the complex technical environment.
    The responsibility of ensuring system availability and reliability falls to the
    system administrator. In addition, the systems administrators, or systems management,
    is responsible for deciding what rules are needed to govern the computer system.
    The system administrators implements these rules to provide the maximum amount
    of computing services within the limitations of the computing environment. These
    rules correspond to regular policies, practices, and procedures that fit the data
    processing environment. In providing service functions for applications, the systems
    staff is supporting the man—machine interface.


    In established, mature information processing environments, the roles of the systems
    staff are clearly defined in terms of policies and procedures because these are
    considered fundamental data center operations management methodologies. Job descriptions
    are poor measures of defining the needed system administration requirements of
    a technological infrastructure because in reality, there may be significant crossover
    in tasks. A system administrator may be doing database administration work, a
    network administrator may be doing system administration work, and so on.


    # ## Training for the System Administrator


    The multidimensional aspects of operations management require training for systems
    staff to perform the functions of security administration, operations administration,
    and network administration. System administrator training begins with an introduction
    to UNIX and leads to an understanding of hardware, UNIX software and applications
    software and means to keep basic administrative computer services available. However,
    formal training teaches basic tasks, such as setting up and maintaining user accounts.
    Yet more advanced tasks, such as developing a security plan, are not taught in
    as much detail in system administration training, over time, a system administrator
    must combine formal training, on the job experience, and personal studies and
    develop hybrid methodologies to administer his or her particular system. Within
    a distributed environment, it is rare to find homogeneous localized systems.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '190—Distributed UNIX System Administration


    Experience allows the administrator to move between UNIX variations and other
    computer platforms to keep systems under control.


    # # Conclusions


    Although the modules provided in Smatrix the companion disk are not wholly automated,
    automated system tracking and risk analysis could be an end goal of a systems
    administration staff. An on-going and persistent effort would catalog system tasks,
    ensure that they are done, and cover all the management tasks for a local system
    or an enterprise-wide system. When new technologies are added to a system, the
    systems staff can incorporate the tasks required to implement and support a new
    piece of technology.


    Seeing new technology fits into the information system and the enterprise as a
    whole provides a means to assess the effect on security, networks, operations,
    hardware, and software. For instance, suppose a new piece of software is installed
    on the system. New security procedures as well as software maintenance procedures
    may have to be implemented. By defining these tasks, they are adequately addressed
    and added to the system administrators’ standard operating procedures. These tasks
    can then be carried over to the next organizational group at another location
    that is responsible for the same tasks. Consequently, after the new software is
    installed, the software and security administration rating of a remote group may
    be lower than a group that merely installed the software without implementing
    the security and maintenance procedures.


    There are many variations on this theme. An organization must develop an assessment
    for its particular environment, maintain the assessment matrix, and establish
    its level of standards. These standards in turn become the benchmark by which
    systems staff measures its productivity, effectiveness, and value to the enterprise.
    It also alleviates the concerns by other administrators and managers that certain
    tasks are not being done, since tasks can be tracked and compared across the matrix.
    If the task completion level is low, the performance level for a specific administration
    module and the system model will decrease and provide a quantifiable measure of
    completed system administration functions.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Chapter 11


    # Implementing a System

    Administration Matrix


    An organization can develop a matrix to help automate periodic assessments of
    its system administration practices. The previous ten chapters introduced the
    primary administration variables — software, hardware, network, security, and
    operations administration — acquaint you with the components of the ideal system
    administration model and guide you in developing a model. This chapter describes
    how to create a survey or customize the one provided by SAMatrix and how to format
    the results into a matrix for use by SAMatrix. The results from analysis of the
    data gathered and processed with SAMatrix can help establish the baseline, or
    current state of system administration, against which further improvements can
    be measured.


    The matrix provided on the companion disk is named SAMatrix. It can serve as a
    template for a matrix customized for a particular organization. SAMatrix comes
    from an assessment of an actual distributed UNIX environment. Forty-one specific
    sites were assessed. Many of the specific environmental task items have been rewritten
    to give the reader a better view of the tasks without involving technology in
    a particular environment unfamiliar to the reader.


    A matrix such as SAMatrix results in an Enterprise System Assessment (ESA). The
    ESA assesses the enterprise environment of an organization, determines if the
    resources of the organization are at risk, and provides information to steer a
    course of action to maintain or improve administration practices. The ESA supports
    the assertion that systems in an organization are at risk if any one of the key
    administration'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'areas (primary variables) is neglected. The ESA identifies the areas in an
    enterprise system that require more system administration support and measures
    the risk of problems due to neglect in the identified areas. Problems caused by
    inadequate system administration services can range from the improper manipulation
    of data to unpredictable system crashes.


    The initial ESA establishes the baseline that identifies the operational needs
    of the organization. This baseline, in turn, provides a benchmark for measuring
    the effectiveness of the chosen course of action.


    # Develop a Model


    Over time, standard system administration practices have evolved from what government
    and industry expects of its information systems. From these acceptable practices,
    an administrative model can be developed that can be applied to a large range
    of organizations. System administration standards and practices are determined
    by an organization''s administrators. You may already have identified those used
    in your organization and created a model. If not, don''t wait any longer. Before
    going on develop a matrix for your organization, finalize your system administration
    model.


    Here is the model used to develop SAmatrix:


    +   Module 1: Software Administration

    1A: Procedures to maintain and tune the operating system.

    1B: Procedures to maintain and tune software applications

    1C: Procedures to measure software application performance.

    1D: Procedures to maintain operating system processes.


    +   Module 2: Hardware Administration

    2A: Procedures to troubleshoot hardware faults.

    2B: Procedures to provide service and support.

    2C: Procedures to measure hardware performance.

    2D: Procedures to add and delete system peripherals.

    2E: Procedures to powerup and powerdown the system


    +   Module 3: Network Administration

    3A: Procedures to provide network services to users.

    3B: Procedures to evaluate network performance.


    +   Module 4: Security Administration

    4A: Procedures to ensure accuracy and integrity of the operating system and soft-applications.

    4B: Procedures to ensure data and system reliability.

    4C: Procedures to ensure access control.

    4D: Procedures to ensure information privacy.

    4E: Procedures to control the physical environment.

    4F: Procedures to implement and control automated tasks.'
  merge: -1
  img_proc: true
