- pgno: 44
  md: '# Chapter 2


    # File Systems


    The backbone of a UNIX system is its file system. As such, this system must be
    maintained to ensure optimal performance, security, and functionality of the system.


    # Logical and Physical Structure


    # The Directory Tree


    The system itself can be interpreted as both a logical and physical structure.
    To better understand the UNIX file system, the previous chapter introduced the
    hierarchical tree structure, a logical representation of the system that looks
    at the file structure from the top down with the root file system at the top.
    A file system is a directory and all its associated subdirectories and files.
    Figure 2.1 shows the hierarchy of the UNIX file system with all directories stemming
    from root.


    In addition to the key directories stemming from root, Figure 2.1 shows two additional
    systems, /usr1 and /usr2. You can assume that the system administrator has added
    these two directories to root.


    Directory /usr1 contains three additional subdirectories: /bin, /data, and /utils.
    Theoretically, you can add logical subdirectories and files up to infinity to
    both /usr1 and /usr2. Figure 2.2 shows file systems (dashed lines) stemming from
    root or another subdirectory. A directory that resides above another in the hierarchical
    scheme is known as the parent directory.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 28 — Distributed UNIX System Administration


    The physical view of the UNIX file system shows its uniqueness. A physical structure
    representation is depicted in Figure 2.2. Note the dashed lines connecting /usr1
    and /usr2 to root. The dashed lines indicate that these file systems can be attached
    to or detached from root, a mechanism known as mounting and unmounting the file
    system.


    Figure 2.2 also mentions the key directories (i.e., /bin, /dev, /usr, etc., mentioned
    in Chapter 1) as attached to root by a solid line, meaning these are subdirectories
    of the root file system and cannot be unmounted. Mountable directories, such as
    /usr1 and /usr2, can be detached.


    A physical file system is a directory structure of additional subdirectories and
    files that can be physically separated from the root. The root directory is also
    a physical file system, but as long as UNIX is running, it cannot be unmounted.
    Important directories are actually subdirectories of root that can be accessed
    as long as UNIX is running. If these directories were in a mounted file system
    other than root, the utilities and tools located in them would not be accessible
    until their parent directory was mounted.


    For mounted file systems, root is the top level of the file hierarchy followed
    by the mounted file system. If the file system is not mounted, it should not appear
    as a directory listing with the ls -li command. In addition, the ls -li command
    verifies that the mounted file system appears as a directory under root.


    ![](img/8f8a5b924793524d71746c72ac703b14_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Navigating the File System


    The directory structure provides the road map to a UNIX system. If you were inside
    the UNIX kernel trying to find the file /usr1/data/appdb, you would begin by stepping
    out of the kernel into the electronic stream on stepping stones called nodes.
    The first node would be the root (/) node. Root would point to /usr1, /usr1 would
    point to /data, which in turn would point to the destination file appdb. These
    nodes are information nodes and are referred to as inodes.


    # Block Structure


    A file system is partitioned into 1,024 bytes/block. Some UNIX systems may have
    a variant of the block size, but it will always be multiple of 512; thus, the
    minimum block size could be 512 bytes/block.


    A file system block structure is depicted in Figure 2.3.


    The very first block is block 0, also known as the boot block. The boot block
    is followed by the superblock. Following the boot block and superblock are a variable
    number of blocks known as the i-list. The i-list stores a list of numbers known
    as the inodes. Once a boot block, superblock, and i-list have been defined, the
    remaining blocks, up to the amount of free disk space, are allocated as data blocks
    to store data, programs, additional directories, etc.


    ![](img/8f8a5b924793524d71746c72ac703b14_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Superblocks


    Mounting a file system creates two superblocks per file system: one stored in
    memory, the other kept on the disk. When a file system is changed, such as when
    a file or directory is added or deleted, the memory copy is updated. When shutting
    down a system, it is important to maintain the superblock so that changes to a
    file system are maintained. When the file system is unmounted or the sync command
    is run, the superblock on the disk is changed to reflect the superblock in memory.
    If this is not done, your system may think it has files available that were deleted,
    or worse, files that were loaded onto the system may appear missing.


    The information in the superblock is critical to a file system. The superblock
    contains:


    +   * size of the file system

    * total number of inodes and blocks available

    * location of blocks and inodes

    * blocks allocated to inodes

    * free blocks available

    * how the file system has been mounted

    * other information, including the type of UNIX system you are using


    ![](img/8f8a5b924793524d71746c72ac703b14_47_0.png)


    | BOOT |

    | SUPERBLOCK |

    | INODE LIST (i-list) a variable number of blocks containing system inodes |

    | DATA the number of free blocks available for files.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Inodes


    The inodes stored in the file system not only contain road map information on
    a file, but discrete descriptive information, too. This information is interpreted
    when you run the ls command. Inode information includes:


    +   - number of file links

    - dates of file creation, modification, and access

    - an inode change date

    - user and group ownership

    - permissions of the file, including an execution flag

    - file type (i.e., directory, ordinary file, special file, named pipes)

    - file size

    - starting block address


    Whenever you change permissions, create a file, etc., you are changing and generating
    information node. An ls -l printout from an assortment of directories shows the
    inode information stores:


    ```

    drwxr-xr-x 9 bin bin 6870 Feb 5 11:18 dev

    --------- 1 bin root 78725 Mar 22 1995 boot

    -crw--w--w- 1 root root 19,135 Mar 22 1995 /dev/ttyA

    -brw-rw-rw- 5 bin bin 2, 4 Mar 22 1992 fd10

    ```


    To actually see the inode number of the file, execute ls -li:


    ```

    12543 drwxr-xr-x 9 bin bin 6870 Feb 5 11:18 dev

    23451 --------- 1 bin root 78725 Mar 22 1995 boot

    345211 crw--w--w- 1 root root 19,135 Mar 22 1995 /dev/ttyA

    45633 brw-rw-rw- 5 bin bin 2, 4 Mar 22 1992 fd10

    ```


    The new number to the far left in each line is the inode number for the file.


    # Linking Files to the Same Inode


    It is possible to associate files to the same inode; that is, associate one or
    more to the same file. This is done using the link, or ln, command. The ls -l
    command displays the link count for a file in the listing. The link count tells
    how many links are there to that; that is, how many references or symbolic names
    are available for a file.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 32 — Distributed UNIX System Administration


    The link command is sometimes likened to the copy command. That is, with one copy
    of a file on the disk, you are able to use multiple names to access it. However,
    link and copy have the obvious difference that a copy is a complete copy of a
    file, but the link is only a reference to a file. The syntax for the link command
    is


    ```

    # ln /path/path/source-filename /path/path/dest-filename

    ```


    which allows the source file (source-filename) to be accessed by the destination
    file (dest-filename).

    The link created using ln is sometimes referred to as a hard link to distinguish
    it from links created using ln -s, which are soft or symbolic links. Both types
    of links are removed with the rm command. A hard link created by ln differs from
    a soft link in contrast to a soft link, which can be moved to a different directory
    and still remain valid. It should be noted that hard links are confined to links
    within the file system because inodes are shared. A soft link can cross file system
    boundaries because it is a pointer reference and specifies the pathname of the
    file linked to.


    # Building a File System


    The mkdir command creates a directory and the rmd command removes it. However,
    to create a mountable file system requires the mkfs command, or the more user-friendly
    interface to mkfs, the newfs command. These commands physically put a file system
    on the disk. In the process of creating a file system, you can specify the number
    of inodes available and the number of blocks allocated. Be aware that creating
    a new file system eliminates any existing files that may reside within the block
    space available to the new file system.


    # Planning for the New File System


    Creating a file system begins with planning. Before creating a new file system,
    gather the following information:


    +   Number of blocks needed for the file system. These are the physical disk blocks
    that are used by the file system. To determine the number of blocks to allocate
    to the file system, you need to know what will be kept in the file system, such
    as a database application, a storage location, or possibly workspace for a development
    team. Planning enough space and proper administration of that space reduces the
    frequency of redoing file systems. Your only limitation is the amount of available
    free space you have on your disk.'
