- pgno: 168
  md: '# UNIX Security — 151


    A simple script using the find command for large files would look like:


    ```

    # An Example of writing out a file with a date stamp

    #Administration File. Writing Out larger system files

    #

    #Set up your variable.

    LRGFFILE = "/usr/adm/security/lrgf ''date +%m%d%y''"; export LRGFILE

    #

    #Executing your command

    find / -type f -size +1000 -print | xargs -1 $LRGFILE

    ```


    | Table 8.2 (continued) |  |

    | --- | --- |

    | find command | Description |

    | find / -type f -perm -777 -print > permfile | Checks the permissions of a file.
    The octal permission bit can be modified to check for whatever permissions you
    want and the results are written out to a file (permfile). The example checks
    for rwx permissions for the user, group, and others. If you want to check only
    for permissions to the world (other), substitute -007. Use -perm -4000 to check
    for unauthorized SUID, and -perm -2000 for unauthorized SGID files. -perm -1000
    checks for the setting of the sticky bit on files. |

    | find /files_to_check -mtime -7 -print > modify | Finds files that have been
    modified over a specified period of time (in this case ≤7 days) and writes the
    output to a file. For system files, you may want to make this a daily check (i.e.,
    -mtime -1). |

    | find . -exec chmod 744 {} \ | Changes the permissions for all files found in
    the current directory. (The dot specifies the current directory.) |'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 152 — Distributed UNIX System Administration


    This technique allows you to write files that do not overwrite files already existing.
    You can then set up your own checking and archiving methods to track and retain
    these files.


    You could also set up variables for other file types in the same script as follows:


    ```

    # An Example of writing out files with a date stamp

    # Administration File. Permission and large file check.

    #

    # Setting up your variables

    LRGFILE="/usr/adm/security/lrgf `date +%Y%m%d`"; export LRGFILE

    SGIDFILE="/usr/adm/security/sgid `date +%Y%m%d`"; export SGIDFILE

    ```


    ```

    # Executing the find commands

    find /type f -size +1000 -print xargs ls -1 $LRGFILE

    find /type f -perm -2000 -print > $SGIDFILE

    ```


    If the file does not execute properly, check the pathnames. If pathnames are not
    properly set, change them or explicitly set them in the script file.

    Compare the following two:


    ```

    find /type f -size +1000 -print xargs ls -1 > lrgfiles

    ```


    and


    ```

    find /type d -size 10 -print -exec ls -1d {} ; > lrgdirs

    ```


    These statements accomplish the same task. The difference between the two is that
    one uses a pipe to xargs and the other uses the -exec command. xargs is considered
    more efficient than -exec because it is designed for looping and reduces the number
    of times a command is executed. When working with a list of files, xargs is usually
    recommended, especially when writing a script file with a considerable amount
    of looping, because exec runs the associated files for each file matching the
    criteria.


    When setting up script files for cron, set up a strategy that staggers the execution
    time of security checks. If you set all of your security checks to look at 1:00
    AM do you know there unauthorized file access taking place between 8:00 AM and
    5:00 PM. An intruder may change permissions to a file and reset the permissions
    so that files look as if they have not been touched. Depending on the sensitivity
    of the system and the level of security, more frequent snapshots may be desirable.
    The information you generate here will be quite large so the more you do, the
    more work you are creating for yourself. The best rule of thumb is to use common
    sense and make this a workable routine and not a routine that will bog you down.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Backup Procedures


    Backing up files to tape is an important system management practice. It prevents
    loss to a system when files and directories are unexpectedly destroyed. The system
    administrator must restore them as soon as possible. A document that describes
    backup and restore procedures can communicate archive and storage methods to the
    organization. As systems are added or changed, backup and restore procedures will
    change, so any documentation of the backup process must be kept to date as well.


    In backup documentation, always specify the systems being archived and the equipment
    being used, and implement any additional specialty procedures, such as those required
    for a smooth database and restore. Keep a hardcopy of tape labels. Label the tapes
    with the type of backup as the backup date, and indicate if the backup is an incremental
    backup (only files that have been changed or added since the last backup) or a
    full backup (a complete system). To keep file systems straight, run backups on
    a file system basis. Backups could start with root and associated file systems,
    followed by a tape for each subsequent file system. File systems that are fairly
    static can be less frequently than those that are used more frequently. A procedural
    outline may look something like:


    +   1. In /etc/motd (the message of the day) display the times when the system
    will be down for maintenance, including scheduled backup times.


    +   2. A few minutes prior to bringing the system down, broadcast a message to
    all users that the system will be coming down for maintenance in a few minutes.
    Use the /etc/wall command and give users time to finish up what they are doing
    before they are logged off during shutdown.


    +   3. When bringing the system down, use the shutdown command as follows:

    shutdown -i00 -g120 -y This gives users a two-minute period to log off. Backups
    should always be run in single-user mode to prevent users from accessing and using
    system files during the backup procedure.


    +   4. If the system is down, enter system maintenance mode and run the sync command
    followed by the fsck command. If errors other than Possible File Size Error occur,
    rerun fsck until the system is error free.


    +   5. Before starting the backup, mount the specified file systems.


    +   6. For cpio transfer, the standard output parameters are -ocvB > /dev/ct (where
    /dev/ct specifies the cartridge tape device). A cpio backup for root is find /
    -depth -print | cpio -ocvB > /dev/ct. (Note: cpio can also archive groups of files
    into another file for soft storage in an archive directory that can later be backed
    up and erased.)'
  merge: -1
  img_proc: true
- pgno: 171
  md: '154 — Distributed UNIX System Administration


    7. During the backup procedure, the console printer, if you have one, should be
    turned on to record fsck activity, disk usage data, and commands executed during
    the backup. This allows a hardcopy to be maintained.


    8. During the monthly full backup, tape scan file created in the tmp directory
    using the scan command from the tape utility is printed and saved.


    9. When executing all backup procedures, scripts, etc., be sure the console printer
    is turned on to record all input and output to the terminal.


    10. An adequate supply of tapes to a tape pool should be made. At the beginning
    of each week the tape pool should be checked and additional tapes added if needed.
    Rotate tapes on a regular basis and not use tapes beyond their normal life and
    expectancy.


    11. The cpio utility should be used to restore tapes and files. Enter cpio -icvB
    /dev/ct for the mounted tape.


    12. Return to multi-user mode when backup is completed.


    13. When dealing with tapes, consider storing them at an offseason location, a
    precaution protects backups in case of catastrophic events like fires, hurricanes,
    tornadoes, and floods. If your organization does not have a secure onsite facility,
    commercial storage facilities in your area may take your backup tapes and pick
    them for you periodically.


    Many administrators prefer the tar command or an off-the-shelf backup and restore
    product. Use whatever is preferable. When using off-the-shelf software, backup
    software on the system may have crashed too and must be reloaded. If the crash
    is destructive, the system on the system may have crashed too and the online system
    catalogs may be destroyed. Therefore, backup software should be able to do a no-catalog
    restore and be easily accessible after a crash; otherwise, the standby UNIX tape
    utilities cpio or tar may be a better backup option.


    # Security Standards


    Certain government agencies and private organizations study computer security
    issues and attempt to standardize security policies and procedures. Within the
    federal government, agencies must follow the Computer Security Act of 1987. The
    Department of Defense has its Orange Book, which has become somewhat of a de facto
    standard. Agencies can also work with the National Institute of Standards and
    Technology (NIST), which has been given the task of developing security standards
    and evaluation methodologies. Private organizations such as the Association for
    Computing Machinery (ACM), the Computer Society of the Institute of Electrical
    and Electronics Engineers (IEEE), and the National Computer Security Association
    (NCSA) also deal'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# UNIX Security — 155


    with computer security issues, education, and research. The Computer Emergency
    Response Team (CERT) actively monitors computer security and sends out notices
    to help users prevent security problems. In addition, any group that deals either
    with computers or with security must also deal with security. There is no real
    way of avoiding the issue of computer security regardless of whether you are the
    sole user of a PC or a manager of the world''s largest enterprise system.


    One of the de facto standards mentioned earlier is known as The Orange Book (DOD
    5200.2-STD). The Orange Book breaks the security of a system down into levels
    that have a specific security intent. Table 8.3 provides a brief description of
    security levels, listed from the lowest to the highest security level. Each successive
    level must incorporate the security standards of the previous level. The reader
    must be aware that the actual written standard breaks these levels down into specific
    criteria to define what constitutes a security level. The descriptions in Table
    8.3 are generics to give you an understanding of these levels. Note that there
    are sublevels to the main levels.


    # ### Table 8.3 Description of Orange Book security levels.


    | Security level | Description |

    |---|---|

    | D | The lowest security level. Cannot be referenced by a higher class. |

    | C1 | Allows access to the system by allowing group or user passwords to be defined.
    Access mechanisms are at the discretion of the administrator. |

    | C2 | Allows controlled access to the system, incorporates auditing, and increases
    the ability of the system to isolate users and resources by authenticating a single
    user and assigning permissions. |

    | B1 | Forces controls to access the system and provides auditing to data and
    devices. |

    | B2 | Modularizes the security functions further, such as separating the functions
    available to the administrator and to an operator. Provides security levels to
    devices and incorporates a formal security model. |

    | B3 | Consistently checks security mechanisms for flaws and provides increased
    auditing capabilities. Specific sections of the system can be broken down into
    specific security subsystems. |

    | A1 | The most stringent security level. Requires authentication for all levels
    of software deployment and access to software. |'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 156 — Distributed UNIX System Administration


    The Orange Book provides a definition for secure environments. For instance, a
    home computer with no security but a virus checker is considered Class D. Off-the-shelf
    UNIX systems with security software purchased from vendors are usually C2 and
    sometimes B1 level.


    The security level chosen must fit the system. Users do not want to be constantly
    frustrated by computer security, so a good balance must be struck between what
    is practical and what works for the users while providing security to the system.
    Therefore, standards for computer security do not really exist. Industry may follow
    guidelines, but it implements security at whatever deemed appropriate.


    # More Information


    The Computer Emergency Response Team (CERT) is a major contributor to ongoing
    security issues and information on all aspects of computer security, including
    viruses, Trojan horses, firewalls, encryption, etc. CERT was started in 1988 and
    is a service mark of Mellon University. CERT advisories and technical information
    can be found at the web at http://www.cert.org. Files can be downloaded by ftp
    or you can go directly to http://info.cert.org/pub. E-mail can be sent to CERT
    at cert@cert.org. CERT is also known for its ability to assist during and after
    a break-in.


    CERT is well known for its advisories. A CERT advisory provides information that
    will let the reader know to obtain a solution to a security problem, and information
    on attacks is an ongoing effort. Advisories are found on the USENET newsgroup
    and advisories that have been archived can be found at ftp://info.cert.org/pub/cert_advisories.


    Another excellent source of information is the National Institute of Standards
    and Technology (NIST). NIST houses a Computer Security Clearinghouse on the Web,
    which offers NIST FIPS publications, including the Rainbow series. The Rainbow
    series of publications contains methods for handling security issues and includes
    the Orange Book. The home page for the NIST Computer Security Resource Clearinghouse
    is http://csrc.ncal.nist.gov. Information on establishing security criteria, incident,
    security assessment, and security forums are accessible through this site.


    The National Computer Security Association (NCSA), a membership-based organization,
    another significant source of security information and training, NCSA holds regular
    conferences and has established guidelines for certifying firewalls and securing
    a Web site. NCSA can be reached on the Web at http://www.ncsa.com/ncsa.html.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# The Multilayered Security Model


    To effectively implement and maintain a security system, all levels of the organization,
    from management to user, must support the effort. A security model including policies
    and procedures can help generate needed support.


    Three documents describe a security system. First is a security plan that provides
    an overview of the security model, a description of the security methodology and
    physical environment, and an outline of policies and procedures found in the disaster
    recovery plan and the policies and procedures manual must include where to find
    the disaster recovery document and the policies and procedures manual. The second
    document is the disaster recovery manual to take care of contingencies. The third
    document is the policies and procedures manual that describes in detail any procedures
    developed and used by the administrator. Because procedures change over time,
    the policies and procedures manual must be written and designed for easy revision
    as the system environment changes. Before a security plan can be implemented,
    a risk analysis must be completed.


    The model presented here is called multilayer security. The multilayer security
    model offers a means to categorize security requirements. However, multilayer
    security does not provide a clear distinction between layers. This distinction
    can be made based on the level of granularity defined for a system. The better
    system definitions, the easier it is to specify where to apply an administration
    policy or procedure.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '158 — Distributed UNIX System Administration


    Multilayered security ensures that the administrator has completely addressed
    system issues. However, the extent of any assessment depends on the complexity
    of the system. No system is 100 percent secure.


    # Layer Overview


    Multilayered security is an approach designed to ensure that the system administrator
    develops a security plan suitable for the environment. With or without knowledge
    of the DOD Orange Book security standard, the multilayered approach provides a
    means to address all levels of system security. The focus of any security implementation
    is to control access, protect data, and secure system resources. A security plan
    must be scalable from stand-alone systems to distributed client/server systems.
    In any environment, administrators must understand their environment and adopt
    appropriate methodologies. To develop a comprehensive security plan, the administrator
    must consider security at network, system, application, data, and physical levels,
    also known as layers. Layers in this security model overlap the administrator
    by connecting each layer and providing a comprehensive view of the system security.


    Each layer provides a method of access to a system. Users access the system through
    the network layer, enter the system through the system layer, go through applications,
    find data, and may have access physically to system hardware. It is the responsibility
    of the administrator to configure the layers of a system in order to protect.


    # Network Layer


    The network layer is a complex system. It can range from a simple modem connection
    to a particular flavor of network implementation. With only modern connections,
    security may start with a fundamental log-in and password authentication at the
    server. A more advanced implementation might incorporate the security features
    found in some network operating systems (NOS).


    Generally, the network layer is the weakest security layer. All types of users
    can be moving through a network layer to gain access to the system. If appropriate,
    a firewall can strengthen the entry into the network by using encryption during
    the transport of information such as credit card transactions. A firewall is intended
    to stop and slow the progress of an intruder in a system similar to a physical
    threat that is designed to slow the progress of a fire through a building.


    A firewall segments access to the servers, admitting users only to needed servers
    or LAN systems. A simple firewall can be implemented on a networked system that
    will allow the administrator to control access to key areas. For instance, an
    Ethernet TCP/IP environment could consist of one LAN (machine name alpha) for
    development and another for production (machine name beta). In this type of environment,
    a'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The Multilayered Security Model — 159


    firewall could keep the nonsystem users out of the development system but allow
    the developpement users access to both systems.

    A front-end server (machine name firewall) where all users log in could be added
    to the network. In each user''s .profile, adding the statement $login alpha for
    developers and $login beta for the production system users routes each to the
    appropriate LAN system. Additionally, users would be required to reenter another
    password to gain access. The user-defined authentication method for this firewall
    does not use IP filtering and is only recommended for small networks.


    To ensure that users are logged off the system when they exit, add the statement
    kill -9 0 after the login statement at the bottom of .profile, as in


    ```

    login machine-name #where machine-name is alpha or beta

    kill -9 0 #Exits the user from the shell and

    #removes user processes

    ```


    giving the user only needed resources, but nothing more. Additional segmentation
    of resources could also be implemented by using the Network File System (NFS),
    if installed.


    # System Layer


    Interaction with the system layer begins with log-in and password authentication.
    As the system layer, the system administrator can fully employ the tools available
    in the operating system to monitor and control user access.


    Security at the system layer begins by knowing the key areas of the system and
    addressing each area as it pertains to the particular environment. Tasks to accomplish
    include:


    +   - Know how the permission bits are set.

    - Identify and monitor key areas.

    - Establish a password strategy.

    - Set up the user environment.

    - Establish system accounting.

    - Establish system checking procedures.

    - Monitor overhead.


    Knowing how permission bits are set involves the proper settings of user and group
    IDs, sticky bits, and umask. umask is used to set the default permissions on files.
    It can also be used by users to set default permissions. A sticky bit is also
    employed by administrators to let only the superuser and the file owner modify
    the file.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '160 — Distributed UNIX System Administration


    Important file areas include the device directory, /dev; /bin for providing public
    access to UNIX commands and utilities; /etc for configuration files and other
    executables/; the root directory; and others. When additional programs are installed,
    /usr/local/bin as a public directory for these programs to avoid mixing them with
    the /bin utilities.


    After learning the setup and location of key files, monitor both with a check
    utility activated by crontab. The following sample utility, checksys, assumes
    the existence of a directory called /etc/checkfils, accessible only to the superuser.
    The script simply creates key directories and then ls -1 listing to a file. The
    script runs a diff against a master file created prior to running the command
    and saves the contents of the diff command to a separate file. Processing the
    diff output through cut lists any changes to files since the master was created.
    If the diff output looks good, update the master by rm master and then mv master.
    A regular run of checksys keeps the system aware of what files change regularly
    and whether permissions and bit settings to keys files have changed.


    # # CHECKSYS SAMPLE SCRIPT


    +   # This program will create a list to check your files and

    # permissions against a master file. When running for the first

    # time be sure to create a master. This can be done by

    # commenting out the diff statement and then mv the checkfil

    # file to master.


    ```

    ls -l /etc/* >> checkfil

    ls -l /dev/* >> checkfil # other key files as required

    ls -l /bin/* >> checkfil

    ls -l /usr/adm/* >> checkfil

    diff master checkfil >> output

    ```


    A password strategy includes addressing such areas as password restrictions, including
    length, password age, the minimum time between changes, whether or not to allow
    users to choose their own passwords, and whether or not the system should generate
    a password. A password strategy also includes policies for setting user accounts,
    removing inactive users, and removing user accounts.


    Setting up the user environment involves defining paths users can access directly,
    the limits on failed log-in attempts, the maximum idle time before automatic logoff,
    and whether or not to set a limit to prevent users from using too much disk space
    or an erratic process from writing a file that will fill up the disk.


    Setting quotas can also restrict the amount of disk space available to users.
    To set quotas, create a quota file and configure it for quotas, then the file
    system to accept quotas.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# The Multilayered Security Model — 161


    To create a quotas file in a file system named /usrec, begin by entering


    ```

    # touch /usrec/quotas

    ```


    then make sure that root is the only owner of the file and has the appropriate
    access by entering


    ```

    # chown root /usrec/quotas

    ```


    then enter


    ```

    # chmod 600 /usrec/quotas

    ```


    to set the proper permissions. The file system now has a quota file in it. Also,
    when the system reads the file system information at startup, it will enable the
    file system to accept quotas. A reboot is required for quota to work.


    After setting it up, configure the quota and add users. Enter the edquota command
    as


    ```

    # edquota wetsch johnson edwards

    ```


    where wetsch johnson edwards are three user names separated by spaces. The system
    then displays a vi interface to set quota limits. A soft quota establishes a level
    on disk space that generates a message warning users they are approaching their
    disk space limit. The hard limit is the real limit and cannot be exceeded. Specify
    both the hard and soft quota in bytes. To check on quota usage, enter the quotacheck
    and repquota commands. Other quota options are available also.


    To tell a system that quotas are active, edit the file system, such as /etc/fstab.
    In essence the file system /usrec would be


    ```

    /dev//ls1 /usrec 1 q 2

    ```


    where rq signifies to read and write with quotas. An equivalent line is


    ```

    /dev//ls1 /usrec rw,noquota 1 2

    ```


    To turn quota off, replace quota with noquota in the second line.


    Finally, set up system accounting to track usage of the system. Establish procedures
    to maintain and track all security implementations. Without these procedures,
    files can become unmanageable. In essence, keep track of overhead. Any security
    implementation means additional work and system tracking. Security must be done
    on a regular basis — daily!'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Application Layer


    Security in the application layer allows users access to the applications they
    need while protecting the shell. Not all users need access to the shell. In the
    previous network layer example, the development users probably need shell access
    but production system users only need access to their applications.


    In a single application a startup to the application could be placed in the .profile
    file with the login statement and the kill statement. In this case, a user logging
    will come directly up in the application. The kill statement forces a user off
    the system after exiting an application.


    More likely, users need access to several applications. A user interface provides
    access to applications without letting users drop to a shell. If not using a graphical
    user interface (GUI), implement a simple menus script. Look back to the menus
    script provided in the Software Administration module in Listing 3.1.


    A menu can improve the ease of using a system; however, access to some applications
    inadvertently allows access to the shell, leaving it unprotected. Allowing access
    to the vi editor through a menu is an example. Once the vi editor is invoked the
    user can enter commands using the !operator. Effective application layer security
    depends on knowing the extent and limitations of system applications.


    Finally, from the application layer, the system administrator can invoke particular
    security features of an application. For instance, when administering a database,
    consider database security features that include transaction logging; privileges
    on tables and fields such as also, modify, or delete, and access to specific data
    views.


    # Data Layer


    Security at the data layer involves backup and restore strategies to protect data
    on a system as well as the system resources. The system administrator must establish
    policies and procedures for complete system backups and for daily, weekly, and
    monthly backups. Select the appropriate backup utilities such as tar, cpio, or
    an off-the-shelf package to standardize the backup environment. The backup methods
    must enable the administrator to restore any files lost, destroyed, or damaged
    on a system. Overall, the administrator must evaluate the environment to determine
    the best method to ensure data reliability.


    # Physical Layer


    Physical layer security protects the hardware and licensed software. The administrator
    must address the security of the facilities that house the system. Can anyone
    approach the equipment, see a blinking light, and press a button? Does the organization
    have a contingency plan in case of fire, theft, or system failure? Is the backup
    media from the data layer stored in a secure location?'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# The Multilayered Security Model — 163


    Implementing the various components of the network, system, and data layers is
    is not enough if the physical layer is not addressed. In this layer, the administrator
    needs to set up a disaster recovery plan and address what needs to be done if
    any of the other layers should fail. If a plan is already in place, the administrator
    must make sure the plan is current and reflects the environment.


    In conclusion, the layered approach system is designed to give the administrator
    a means to address user entry into the system. By addressing the system environment
    through each layer, the administrator has a means to collect all of the information
    required to write a security plan. It should also be emphasized that good system
    procedures are nothing if they are not enforced with good policy. Any security
    feature implemented must be maintained.


    # Implementing a Security System

    Risk Analysis


    Before an organization can implement a security system, or even one of the basic
    documents, it must conduct a risk analysis. The complexity of a risk analysis
    depends on company size and its equipment and facilities.


    A risk analysis inventories resources and identifies their importance to the enterprise.
    Each major resource represents one layer in the security model. Table 9.1 describes
    the levels of importance, or the criticality factors, that can be applied to a
    resource.


    | Table 9.1 Criticality factors |

    | Criticality factor | Description (based on availability) |

    | 0 | Loss of resource has no effect on the system or a specific layer. |

    | 1 | Loss of resource has minimum effect on the system or a specific layer. |

    | 2 | Loss of resource has some effect on at least one layer. |

    | 3 | Loss of resource affects the integrity of a layer. |

    | 4 | Loss of resource affects the integrity of the system. |

    | 5 | Loss of resource decreases the availability of at least one layer. |

    | 6 | Loss of resource makes at least one layer inaccessible. |

    | 7 | Loss of resource decreases the availability of the system. |

    | 8 | Loss of resource prevents access to the system for a short period of time.
    |

    | 9 | Loss of resource prevents access to the system for a long period of time.
    |'
  merge: -1
  img_proc: true
- pgno: 181
  md: '164 — Distributed UNIX System Administration


    The criticality factors are somewhat subjective because the local environment
    determines the impact of a loss resource to the rest of the system. Additional
    refinement can be added to the risk analysis by factoring the frequency of an
    occurrence, such as losing a resource. For instance, loss of a network router
    may be more frequent and be assigned a criticality factor of 6 or 7. However,
    a fire that destroys a computer building is undoubtedly less frequent than a router
    going down but much more catastrophic with a criticality of 9. The first draft
    of a risk analysis survey in Table 9.2 adds weighted factors of 1 = low frequency,
    2 = moderate frequency, and 3 = high frequency or likelihood of occurrence in
    column F.


