- pgno: 153
  md: 'studied to accommodate the growing number of networks being added. As users
    look for faster and more reliable access to improve the use of graphics, audio,
    and video on the Internet, the lack of bandwidth causes performance degradation.
    Users have responded by getting faster modems, and networks are requiring the
    same at their end. Nevertheless, user congestion is a problem, and the Internet
    infrastructure will undoubtedly grow as is its user community growth.


    # Planning for Access


    An enterprise system incorporates all the business needs of an organization on
    a scale that spans the entire organization. The need to communicate information
    and data, important assets to any organization, has made the Internet an essential
    tool in modern enterprise systems, standardizing the exchange of knowledge on
    a scale that also spans the entire organization.


    Planning for secure and effective use of the Internet in an enterprise system
    requires evaluation of the processes and interactions in an enterprise, in all
    their complexity. The components of the system must be broken down and mapped
    out end-to-end. Many questions must be answered to the minutest detail, such as:


    +   * At what point does a user gain entry to the system?

    * What applications are available to the user?

    * When the user executes a transaction what happens with the transaction?

    * How is data moved among applications?

    * What client/server methodologies are required to accomplish communication goals?

    * Software development engineers needed to write applications from scratch or
    is off-the-shelf software available?

    * What messaging strategy will be employed?


    A study of the design of the enterprise can provide the answers to these questions.
    The design of an enterprise system has four steps. Failure to properly complete
    each step results in gaps in design and on-the-fly development. Enterprises based
    on an incomplete design can incur higher costs and longer development time caused
    by unanticipated requirements, features, and failures of various system components.
    Many informative books provide information on design, analysis, design notations,
    and data management of an enterprise, this section offers a simple overview of
    the design process.


    Step toward designing an enterprise is to develop the Business Process Model (BPM).
    A BPM defines a system and the processes required for that system. Figure 7.1
    shows a sample BPM for a fictional accounts receivable system called the ARS system,
    using a dynamic interaction graph (DIG). A complete BPM would be more comprehensive
    because ARS is a subsystem of a larger accounting business model.'
  merge: -1
