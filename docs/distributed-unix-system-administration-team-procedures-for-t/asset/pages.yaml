    # Processes


    When interacting with the kernel, a user sends a request through a program, command,
    or expects a response from the kernel. The kernel responds by executing a special
    program called a process. A process is an executed program that will be managed
    by the kernel to allow the program to properly execute. During this execution,
    the kernel also manages file creation and deletion; manages data movement out
    of memory; and separates the initiators, or owners, of the process management.
    Processes are started by the kernel by system calls, although the kernel calls
    the init process directly. In turn, processes are removed from memory by the kernel
    when completed or killed by an owner or administrator.


    The parent process of a user is the shell process, including its environment in
    which the user works. When the user enters a command, the kernel makes a system
    call, called fork, for the kernel to create a new process. With fork, the kernel
    creates an exact duplicate of the parent process, a child process, which includes
    the process text and data loaded into a different area of memory. (Any process
    that generates a new process is the parent and the new process generated is known
    as the child process.) The exec system call is also made to the kernel to allow
    the process to run. Each process is assigned a process ID (PID). When a process
    completes, or exits, it lets the parent know to free up the resources used by
    the child. If the parent does not acknowledge the demise of its child, the PID
    of the child remains, resources freed, but the result is a process that will not
    delete, known as a “zombie” process. (The administrator sees a zombie as a <defunct>
    process.) Zombie processes are a nuisance but cleared when the system reboots.


    Special types of processes are known as daemons processes, or such daemons. One
    initiated, usually at startup, daemons provide user services and run without user
    supervision. They can also be requested by users, a timer, or system occurrences
    such as errors, which activate errdaemon. For another example, the printer daemon
    is invoked with the lp command. The printer daemon, lpsched, stays in memory in
    an inactive state until awakened by lp to send something to the printer. Other
    daemons are vigilant as cron, the UNIX timer program. The cron daemon, used for'
