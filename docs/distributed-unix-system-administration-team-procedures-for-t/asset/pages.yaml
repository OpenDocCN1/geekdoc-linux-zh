    can also affect performance. Enterprise-wide database system will be configured
    differently than a system dedicated to network traffic. Parameter changes should
    not be taken lightly, and the system defaults should be maintained unless system
    usage dictates otherwise.


    Remember this simple rule when changing kernel parameters — when you increase
    the performance in one area of the system you will affect and probably decrease
