    # Routing


    A primary service UNIX systems provide routing. Systems that need to contact a
    host on another network or implement a subnet must provide routing services.


    # Configuring the Network Interface


    Connecting to another network with an interface card requires knowing that network''s
    address. The command


    ```

    ifconfig 1e0 128.110.52.32 up netmask 255.255.255.0

    ```


    configures the network interface. Syntax for the command, which may vary across
    systems, to assign the address 128.110.52.32 to interface 1e0 and set the net-mask.
    The interface startup command is up. The command ifconfig 1e0 down shuts the interface
    down.


    The interface configurations are normally entered in the boot scripts. Although
    not advisable, interfaces can be added and shut down when the system is running.
    If not added to the startup script, the interface must be brought up manually
    when the system is restarted. (See Chapter 1 for more information on startup scripts.)
    Failing to keep track of an interface configuration can cause a lot of extra work
    restarting the interface each time the system comes up.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Introduction to Networking — 119


    Interfaces are defined as a device, such as ie0 for an INTEL interface. To find
    out what interfaces you have available, run netstat -I. The netstat command is
    extremely useful utility. It provides information on networking resources, open
    ports, and the overall status of the network. netstat -a | more supplies an overall
    look at the network configuration.


    # Configuring Static Routes


    The route command at /etc/route defines static routes — routes that never change
    when running a routing daemon. Usually executed at system startup, route syntax
    is


    ```

    /etc/route command destination gateway [metric]

    ```


    The commands available are add or delete. destination is the address of the next
    host associated with the route. gateway specifies where the data packets are to
    be addressed. metric is the number of hops to the destination; the default is
    0, so unless the route is set to loop back, metric should be 1 or more.


    # Managing Dynamic Routing


    Dynamic routing is used on larger systems and managed using internal route tables
    accessed by the standard routing daemon routed. In UNIX, routed controls using
    the RIP protocol. When routed receives an information packet, it checks its tables
    and determines the appropriate response. The daemon reads the etc/ gateways file
    to determine whether it is attaching to a network (net) or a host (host) and whether
    the connection is passive, active, or external. A passive gateway is always maintained
    in the routing tables, active gateways can be deleted when no activity occurs
    over the specified address. An external gateway is stored the same way as a passive
    gateway, but it will not be included in any routing updates. This tells routed
    that this route need to be installed by another process.


    # Basic Connection and File Transfer


    Two of the most common network services are telnet and ftp. The terminal–remote
    host protocol, or telnet, is the TCP/IP standard connection package. A site by
    telnet using either the IP address or the symbolic name, as in


    ```

    # telnet 124.53.32.23

    ```


    or


    ```

    # telnet access.asite.net

    ```


    where access.asite.net is the symbolic name for a domain.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The ftp command is a file transfer protocol. The syntax to reach a site is
    the same as telnet. A remote log-command is very similar to telnet; it is called
    login. In addition, there are remote commands such as rcp for remote file copy
    and rcmd for remote shell command execution.


    # File Sharing


    Another UNIX service, networked file systems or NFS, allows files to be shared
    among computers. NFS provides access to tools, services, and other information
    located on remote files. Also, NFS can allow client stations to access only selected
    files on a host. To the user, it sees that the file systems are available to the
    user''s system just like any other file system. From an administrator perspective,
    these files are mounted and mounted in a fashion similar to regular file systems.


    NFS requires networking services and the nfsd, bind, exports, portmap, and rpc.mount
    daemons. The nfsd daemon runs on the NFS server, accepting client requests and
    passing them to the kernel. The bload daemon provides read-ahead and write-behind
    block caching for a file system. exportfs handles the shared directories, portmap
    provides procedure call (RPC) mapping to port addresses, and rpc.mount handles
    the shared file system.


    The rc startup scripts should start the nfsd daemon, which forks copies of itself
    to manage the traffic on the system. The number of copies of nfsd to specify depends
    on the number of connections nfsd needs to make at a given time. Too few copies
    cause netstat overflow errors. Too many and performance suffers errors reported
    by netstat -s drop to zero. This indicates the maximum number of copies is to
    add copies until socket overflow the system can support. To test system performance,
    add nfsd processes until performance suffers noticeably. This also gives an estimate
    of the largest number of nfsd processes allowed by the processing load of the
    system.


    The largest number of nfsd daemons to specify may not be the optimal number. Just
    with nfsd, bind takes as its argument the number of copies to fork. After determining
    the maximum number of nfsd copies, specify the same number of bind daemons, then
    check to see if system performance degrades. If performance is still unacceptable,
    continue reducing the number of copies of both daemons until performance meets
    requirements.


    In the following example from a startup script, bind 12 and nfsd 12 tell the system
    to fork 12 copies of each process.


    ```

    if [-f /usr/etc/bind];

    then bind 12

    if [-f /usr/etc/nfsd];

    then nfsd 12

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Introduction to Networking — 121


    When establishing NFS on a server, the server must be told what file systems to
    share, and the workstations that access the server must know what file systems
    are available for sharing. To do this, the workstation reads a local /etc/fstab
    file mounts the file system locally first. File systems found in fstab are considered
    permanent mounts. The mount command can be used for NFS, but these are only temporary.
    When setting up an NFS system, using mount can be a good diagnostic tool to make
    sure desired services are available, especially when changes are made. Enter


    # mount -at nfs


    to list the NFS file systems mounted on the system.

    Once the local mount is done, the remote mount requests are managed by the rpc.mountd
    daemon. The actual file systems to be shared are stored on the server in /etc/exports
    exports daemon. The exports file can be edited freely to include the file systems
    needed for export by the server.


    When you mount an NFS file system, you have the option of mounting the system
    with specified parameters to control its use. In System V, -f or -t is used to
    mount a system as an NFS file system, as follows:


    # mount -f nfs buddy:/usrec


    This command mounts the file system /usrec from the node buddy. In the /etc/fstab,
    the following attributes may be entered to describe the file system as NFS mountable.


    ```

    buddy:/usrdoc /usrec nfs rw,hard,bg,intr,retrans=3 0 0

    friend:/users /personnel nfs ro,soft,bg 0 0

    ```


    In the top line, buddy refers to the node name and mounts the file system /usrdoc
    on buddy as /usrec. On the first line, the fields after /usrec indicate an NFS
    (nfs) file system mounted as read-write (rw) with a hard mount (hard) and a background
    start (bg) if the mount should fail on the first try. intr allows users to interrupt
    hung processes, and retrans specifies the number of times a request to the file
    system is allowed — in this case 3. Finally, the numbers 0 0 set the size, in
    bytes, of read and another node buddy, respectively.


    In the second line, another node called friend has a file system /usres that is
    mounted as /personnel, using a different configuration. /personnel is a soft mount,
    mounted as read-only (ro) with no interrupts allowed (i.e., intr is missing).
    If an NFS file system is hard mounted, NFS continues to process all requests even
    when the remote system is unavailable and all the retrans have been attempted.
    If the file system is soft mounted and is unavailable, NFS generates an'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 122 — Distributed UNIX System Administration


    error and cancels any additional requests. There are other NFS options available;
    check the local documentation to configure NFS properly.


    # Network Debugging


    A simple utility (ping) is provided by every vendor of UNIX. It can be used to
    force a response from a particular machine. ping sends out a packet, verifies
    that it has been received, and in so, produces a report on how long it took to
    send the packet. If the packet was unable to get its destination, ping reports
    a timeout; ping uses routing protocols, address resolution schemes, and gateways.
    When sent to a host known to, a successful ping indicates a functional network
    configuration. Local network services must be running to use ping.

    The format for a ping is


    ```

    # ping --[option] host [packetsize] [count]

    ```


    An option field with -v an address a more detailed, or verbose, report. The host
    is a recognized symbolic name or a numeric IP. packetsize is the desired size
    in bytes of the packet. (Defaults can vary and sizes are limited to a range of
    packet sizes.) count specifies the number of times the packet is sent. The following
    example pings a remote host at 128.32.10.2 and sends a packet size of 128 bytes
    30 times to get the average transmission time to the remote server:


    ```

    # ping 128.32.10.2 128 30

    ```


    ping can connect and echo back to another server, verifying that servers are up
    on the network.


    ```

    # ping 128.32.10.2

    ```


    uses defaults to verify a remote server.


    When setting up a network, ping can stress the threshold of the network to see
    if network services are adequate. A script and test procedure could be written
    and kicked off by cron to determine the feedback from a node across a network.
    An example called forkit, described below, also tests the number of processes
    the system can handle to provide information for performance tuning.


    Although time consuming, running such tests allows you to directly observe the
    degradation of the network. Increasing traffic reveals the impact of multiple
    packets from multiple processes being sent the network to a specified host. A
    script such as forkit tests the number of processes a system can handle until
    ping breaks down, leaving some ping statements unexecuted. forkit can be written
    to exceed the number of child processes a system can handle, resulting in fork
    errors that'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Introduction to Networking — 123


    cannot build the requested process. Data from such tests can help build an assessment
    of network capabilities and processing. A look into system accounting to determine
    CPU usage and other factors of processing can add to the assessment established
    with the forkit procedure.


    To establish forkit, determine at what level to test the system. Start the process
    by executing a single ping for several counts and recording the results to a file
    called level_1.Enter


    ```

    # ping host 128 100 > /usr/data/level_1

    ```


    If necessary, do this several times for increments of byte counts such as 64-byte
    packets, 128-byte packets, and so on up to the limit available. Label the files
    level_1_64b, level_1_128b, and so on.


    Next, create a file with an editor that executes consecutive pings through cron,
    as in the example called npt (network performance test).


    ```

    /etc/ping host 10 64 > /usr/data/level_2_64b

    /etc/ping host 10 64 >> /usr/data/level_2_64b

    /etc/ping host 10 64 >> /usr/data/level_2_64b

    /etc/ping host 10 64 >> /usr/data/level_2_64b

    ```


    If necessary, create several npt files to record a range of packet sizes.

    For the second level, it is not imperative to execute cron, but for the third
    level and beyond it is important to do so. For level three, kick off multiple
    npt files spaced in cron for execution at the smallest possible intervals of time
    (The smallest interval used by cron is the minute). The scripts should be such
    that all cron files are running at the same time. To do this, the first file to
    execute at Level 3 will have a large count, with counts scaling down from there,
    since the last file to execute won''t necessarily need to run as long as the first.
    To increase count, packet size can be larger, for each Level 3 test, the packet
    size should remain the same as that used for Level 1 and Level 2 tests.


    # Modem Communications


    Early in its history, UNIX provided an implementation known as UUCP (Unix to Unix
    Communications Protocol) for file transfer and mail connectivity via modem communications.
    Because of the Internet and a demand for greater functionality, UUCP is being
    replaced by Serial Line Internet Protocol (SLIP) and Point-to-Point Protocol (PPP).
    Although outdated, UUCP is still a common protocol for communication between similar
    UNIX systems.


    ![](img/8f8a5b924793524d71746c72ac703b14_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'There are two commonly used flavors of UUCP, V7 and HoneyDanBer. The V7 flavor
    is similar to the original UUCP implementations. HoneyDanBer was written for AT&T
    flavors of UNIX by Peter Honeyman (Honey), David A. Nowitz (Dan), and Brian E.
    Redman (Ber). This discussion focuses on HoneyDanBer UUCP.


    Essentially, UUCP is a collection of programs that provide networking over basic
    serial and telephone lines. Programs that provide UUCP services include cu, uuico,
    ucp, uuto, and uux. The cu command, a serial version of telnet, dials into another
    unix. The uucpc commands handle both binary and text files to be copied between
    machines. The uxm command executes commands at remote sites. In addition, unname
    displays a list of systems that the local system can communicate with, providing
    these systems are precisely defined in the local system.


    For UUCP to be successful, a machine must be able to call a remote site and write
    to a directory on the remote site. /usr/lib/uucp contains a permissions file found
    on a remote site that specifies the directories to which a system can write. The
    general default directory is /usr/spool/uucp. To send a file to a remote machine
    that is configured for UUCP communication,


    ```

    # uucp /usr/home/wetsch/sendfile blue1!~/sendfile

    ```


    The sample is sending a file called to a machine called blue1. ~/sendfile is the
    pathname of the directory in which the file is placed, probably /usr/spool/uucppublic/sendfile.
    Omit the tilde (-) when specifying the full pathname of to send the file. The
    exclamation mark separates the sites where the file is being sent. To transfer
    the file to machines blue1, blue2, and blue3, enter


    ```

    # uucp /usr/home/wetsch/sendfile blue1!blue2!blue3!~/sendfile

    ```


    UUCP first transfers the files to the uucp directory and then attempts a transfer.
    The path also indicates the final destination as blue3 using blue2 and an intermediary
    hop. If the transfer is unsuccessful, the utility will notify the user and may
    also try to resend the file. To check the status of UUCP jobs, use the uustat
    command.

    to set up UUCP communications, the system must recognize the installed modem and
    be able to dial. Once connected, the system must have a name that each machine
    recognizes and, as noted, can be found from the unname command. The name of your
    system is unname-n, where a complete list is gained using unname-a. The list is
    provided by the Systems file. Other files that be set up include the Dialcodes
    file, which contains a dial-out sequence as well as a mnemonic to use code. The
    devices used by UUCP are set up in the Devices file and must reference actual
    devices found in the /dev directory. These files are set up and a user account
    for uucp is ready, the system with c to dial out to a remote'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Introduction to Networking — 125


    site. You may have to do some debugging; use unico with the -x option to specify
    the level of debugging appropriate for your system.


    When deciding whether to implement a UUCP system, determine that you need it.
    If you already use SLIP or PPP, you may not have much need for UUCP unless you
    need to connect to a remote site that is not using SLIP or PPP. Also, as capabilities
    advance and UNIX implementations vary, the implementation of UUCP may vary. Generally
    speaking, you must have a UUCP account, the ability to dial out, and permission
    to access a remote site in order to use UUCP effectively.


    Earlier, I noticed that UUCP can send electronic mail. This service is provided
    through sendmail, which must also be configured for your system. Sendmail is configured
    through the sendmail.cf file and is a networking daemon that allows mail to be
    sent over the Internet or locally. It has consequently evolved past its early
    UUCP implementations, which used SMTP (Simple Mail Transfer Protocol) to send
    mail to users on a TCP/IP network.


    The sendmail utility is another one of those UNIX pieces that really requires
    a thorough understanding. Due to the complexity and intricacies of the utility,
    the reader is referred to manufacturer and third-party documentation to research,
    study, and learn to successfully implement, maintain, and use sendmail.


    # Optimizing Networks


    Networks must be able to provide solid performance. Problems such as traffic congestion
    or improper configuration can slow down a network, frustrating users. For example,
    a bottleneck significantly affects performance. Although easy to describe, finding
    a bottleneck can be more difficult. An overloaded transmission medium caused by
    too many connections is commonly blamed for the bottleneck. Although this can
    be a problem, other factors that affect network load must be investigated, also
    such as CPU utilization, available memory, and condition of the server.


    Table 6.5 lists some of the factors that a system administrator. Dealing with
    these issues allows you to optimize your system, which in turn returns the best
    performance available based hardware limitations and software constraints.


    For an up and running UNIX, optimization can be performed using a performance
    monitoring tool or even by making use of the system accounting utilities that
    are already available on your system. A thorough optimization evaluation involves
    the use of statistical evaluation techniques like Little''s Law, the Utilization
    Law, the Forced Flow Law, and the General Response Time Law. In general, there
    is a considerable body of literature on performance analysis. The level of analysis
    required should correspond to the complexity of the system and the difficulty
    in determining the problem. Also, if you are prototyping a new system, a good
    knowledge of performance analysis is required so that you can provide benchmarks
    against which to measure your system development.


    ![](img/8f8a5b924793524d71746c72ac703b14_142_0.png)'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Table 6.5 Definition of some network optimization terms.


    | Optimization element | Description |

    | --- | --- |

    | Availability | Sometimes confused with reliability. However, it is really reliability
    over time. That is, you may have the system up and running and everything works
    the access time is too long; therefore, availability is low. |

    | Reliability | This is the actual dependability of the system. Can the system
    recover from errors without crashing? |

    | Integrity | High integrity translates into a low number of errors. For instance,
    my system may be highly reliable in delivering an e-mail message but the integrity
    of the transfer may be low if the message arrives in a garbled state. |

    | Overhead | The amount of processing that is taking place at a given time. Overhead
    is usually high when large numbers of users are on a system. |

    | Reliability of delivery | An optimization measure that determines the percentage
    of network transmissions sent and received with error. |

    | Throughput | The number of transmissions sent over time on a network. |

    | Incidence speed | Also referred to as latency. Determines the minimum and maximum
    time of delivery. For instance, the fastest and slowest time to bring up an application
    would reference the incidence speed of the application. |

    | Average speed | Refers to the average time of delivery of a specific application
    or a standardized data transfer. |

    | Channel capacity | The limit of the ability to transfer data. For instance,
    the channel capacity or bandwidth of a 10Base2 Ethernet network is 10Mbps. |

    | Reach | The capacity of the network in terms of the number of devices it can
    support. Reach can also refer to the limit of the length of the network medium.
    |

    | Propagation delay | The delay caused as data is propagated through the medium,
    repeaters, gateways, routers, bridges, etc., of a network. |'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# The Internet and Enterprise

    Systems


    The Internet has become a global information tool, leading computing technology
    into 21st century. The Internet provides information on many subjects and has
    the capability to download tools and utilities to simplify work. Business can
    also construct internal Internet connectivity and services, called intranets,
    not accessible to the outside world.


    Almost a household word, Internet access is becoming more readily available through
    its use in businesses, libraries, and universities. Access providers offer free
    e-mail service. Network computers are being developed to connect directly to servers
    and the Internet. Also, a greater integration between telephone, television, and
    computer technology provides an increasing array of multimedia services that will
    eventually be incorporated into Internet sites.


    # Evolution of the Internet


    # Infrastructure


    The Internet is not new. It started from a research program of the United States
    Defense Advanced Research Projects Agency (DARPA), which was an effort to determine
    methods for linking networks. By 1969, the Advanced Research Projects'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 128 — Distributed UNIX System Administration


    Agency Network (ARPANET) began, and continuous growth through connected hosts
    continued through the 1970s. TCP/IP became the ARPANET standard protocol, and
    as growth increased, ARPANET was replaced by the Internet.


    In the mid-1980s, the National Science Foundation installed a group of backbone
    sites, collectively known as NSFNET. NSFNET became the top layer of the hierarchical
    infrastructure of the Internet in the United States (Class A accommodating 128
    networks with 16,777,216 hosts/network maximum). Since then, regional leased line
    networks have been attached to NSFNET by government agencies, research institutions,
    and businesses, including the National Center for Atmospheric Research (NCAR),
    WESTNET, the University of Colorado at Boulder (UCB), and the University of Utah.
    These backbones became the second layer of the Internet in the U.S. Class B addresses
    supporting 16,284 networks with 65,536 hosts/network maximum. The third layer
    of networks (Class C addresses allowing for 2,000,000 networks with 256 hosts/network
    maximum) evolved from connections among government agencies, universities, and
    businesses on down to smaller networks and individual desktops, which must dial-in
    to a computer at a layer above it to access the Internet.


    # The Role of UNIX


    UNIX led the way to the Internet and several character-based protocols were developed
    to allow improved computer interaction on the Internet. Services and methods were
    developed to provide increased usefulness of available tools. Sites were set up
    for anonymous ftp, which allows users on one host to connect to other hosts with
    a generic login called “anonymous” and without a password to download and upload
    files. Once anonymous ftp servers became abundant, servers were set up to archive


