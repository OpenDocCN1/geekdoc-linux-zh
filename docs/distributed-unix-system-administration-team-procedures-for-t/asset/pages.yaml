    # Printers


    # Connecting a Printer


    A printer in UNIX can be connected as either a serial or parallel device and as
    worked or remote. A serial printer interface transmits one character at a time,
    whereas a parallel printer interface transmits seven or eight bytes at a time
    and consequently usually faster than a serial printer. The actual speed of the
    printer is measured by its output in characters per second (cps) or pages per
    minute (ppm).


    The standard serial printer connection is an RS-232C cable. The initial communication
    between the printer and the computer through the interface is known as handshaking.
    Handshaking is used to establish communications and to control data flow.


    Printer handshaking based on RS-232 was originally designed for modems. The printer
    documentation identifies the physical wire on which the UNIX serial port receives
    signals from the printer. However, the printer handshake requires all four wires
    used for the serial interface. The physical connection of the wires is made through
    the PINs in the cable. Table 5.2 explains the PINs used by the printer serial
    interface.


    Because RS-232 was originally designed for modems, PINs 2, 3, and 7 are common
    between serial printers and modems. Nonetheless, PIN designations can vary between
    manufacturers. Some manufacturers recognize PINs 2 and 3 for transmit


    | Table 5.2 RS-232 printer PIN connections |

    | PIN number | Description |

    | 2 | Transmit Data (TD) |

    | 3 | Receive Data (RD) |

    | 7 | Common Return |

    | Manufacturer defined, PIN 20 | DTR (Data Terminal Ready) |'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Maintaining Hardware — 85


    Table 5.3 defines the acronyms used to discuss printer handshaking and serial
    communication. Handshaking determines the DTE and DCE devices that will be communicating
    with each other. The computer or terminal connected to the printer (this could
    also be a modem) is the DTE. DCE devices can communicate with other DTE devices
    or DCE devices. The printer or modem is the DCE device. Because PINs 2 and 3 are
    the connections used to transmit and receive data, the other PINs are used to
    provide control of the data, such as, when to stop sending data, when to receive,
    when to stop receiving, etc. The handshaking takes place when the connected devices
    acknowledge the connection. First, the DTR on the DCE device sends a signal showing
    it is ready. The DCE returns an acknowledgment that it is also ready. A DCE does
    this through the DSR PIN. There are other scenarios as well. In some cases the
    computer uses a DTR and RTS waits for a CTS and DSR signal from the printer. In
    any case, once the correct signals have been exchanged, handshaking is complete
    and the systems start to exchange data.


    Data is sent to a printer at a rate faster than the printer can process it, so
    the printer must signal the computer to stop and wait before sending additional
    data. Most printers have a buffer so that they can receive data at a faster rate
    than they can process it. The printer signals the computer to stop when the buffer
    is full, then lets it know when to begin resending. The mechanism for doing this
    is software flow control called XON/OFF. Faster hardware flow control is also
    usually available.


    | Table 5.3 Printer handshaking terminology. |

    | PIN acronym | Description |

    |---|---|

    | TD | Transmit Data |

    | RD | Receive Data |

    | DTR | Data Terminal Ready |

    | RTS | Request To Send |

    | CTS | Clear To Send |

    | DSR | Data Set Ready |

    | DCD | Data Carrier Detect |

    | GND | Signal Ground |

    | RI | Ring Indicator |

    | DCE | Data Communication Equipment |

    | DTE | Data Terminal Equipment |'
  merge: -1
  img_proc: true
