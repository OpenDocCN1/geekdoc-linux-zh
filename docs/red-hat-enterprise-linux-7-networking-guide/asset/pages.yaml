  md: "# 8.13. CONFIGURE TEAMD RUNNERS\n\nRunners are units of code which are compiled\
    \ into the Team daemon when an instance of the daemon is created. For an introduction\
    \ to the team runners, see Section 8.4, \"Understanding the Network Teaming Daemon\
    \ and the Runners\".\n\n# 8.13.1. Configure the broadcast Runner\n\nTo configure\
    \ the broadcast runner, using an editor as root, add the following to the team\
    \ JSON configuration file:\n\n```\n{\n  \"device\": \"team0\",\n  \"runner\":\
    \ {\"name\": \"broadcast\"},\nn  \"ports\": {\"em1\": {}, \"em2\": {}}\n}\n```\n\
    \nPlease see the teamd.conf(5) man page for more information.\n\n# 8.13.2. Configure\
    \ the random Runner\n\nThe random runner behaves similarly to the round-robin-runner.\n\
    \nTo configure the random runner, using an editor as root, add the following to\
    \ the team JSON configuration file:\n\n```\n{\n  \"device\": \"team0\",\n  \"\
    runner\": {\"name\": \"random\"},\n  \"ports\": {\"em1\": {}, \"em2\": {}}\n}\n\
    ```\n\nPlease see the teamd.conf(5) man page for more information.\n\n# 8.13.3.\
    \ Configure the Round-robin Runner\n\nTo configure the round-robin runner, using\
    \ an editor as root, add the following to the team JSON configuration file:\n\n\
    ```\n{\n  \"device\": \"team0\",\n  \"runner\": {\"name\": \"roundrobin\"},\n\
    \  \"ports\": {\"em1\": {}, \"em2\": {}}\n}\n```\n\nA very basic configuration\
    \ for round-robin.\n\nPlease see the teamd.conf(5) man page for more information.\n\
    \n# 8.13.4. Configure the activebackup Runner"
  merge: -1
  pgno: 138
- img_proc: true
  md: "The active backup runner can use all of the link-watchers to determine the\
    \ status of links in a team. Any one of the following examples can be added to\
    \ the team JSON configuration file:\n\n```\n{\n  \"device\": \"team0\",\n  \"\
    runner\": {\n    \"name\": \"activebackup\"\n  },\n  \"link_watch\": {\n    \"\
    name\": \"ethtool\"\n  },\n  \"ports\": {\n    \"em1\": {\n      \"prio\": -10,\n\
    \      \"sticky\": true\n    },\n    \"em2\": {\n      \"prio\": 100\n    }\n\
    \  }\n}\n```\n\nThis example configuration uses the active-backup runner with\
    \ ethtool as the link watcher. Port em2 has higher priority. The sticky flag ensures\
    \ that if em1 becomes active, it stays active as long as the link remains up.\n\
    \n```\n{\n  \"device\": \"team0\",\n  \"runner\": {\n    \"name\": \"activebackup\"\
    \n  },\n  \"link_watch\": {\n    \"name\": \"ethtool\"\n  },\n  \"ports\": {\n\
    \    \"em1\": {\n      \"prio\": -10,\n      \"sticky\": true,\n      \"queue_id\"\
    : 4\n    },\n    \"em2\": {\n      \"prio\": 100\n    }\n  }\n}\n```\n\nThis example\
    \ configuration adds a queue ID of 4. It uses active-backup runner with ethtool\
    \ as the link watcher. Port em2 has higher priority. The sticky flag ensures that\
    \ if em1 becomes active, it will stay active as long as the link remains up.\n\
    \nTo configure the activebackup runner using ethtool as the link watcher and applying\
    \ a delay, using an editor as root, add the following to the team JSON format\
    \ configuration file:\n\n```\n{\n  \"device\": \"team0\",\n```"
  merge: -1
  pgno: 139
- img_proc: true
  md: "```\n\"runner\": {\n  \"name\": \"activebackup\",\n  \"link-watch\": {\n  \
    \  \"name\": \"ethtool\",\n    \"delay_up\": 2500,\n    \"delay_down\": 1000\n\
    \  },\n  \"ports\": {\n    \"em1\": {\n      \"prio\": -10,\n      \"sticky\"\
    : true\n    },\n    \"em2\": {\n      \"prio\": 100\n    }\n  }\n}\n```\n\nThis\
    \ example configuration uses the active-backup runner with ethtool as the link\
    \ watcher. Port em2 has higher priority. But the sticky flag ensures that em1\
    \ becomes active, it stays active while the link remains up. Link changes are\
    \ not propagated to the runner immediately, but delays are applied.\n\nPlease\
    \ see the teamamd.conf(5) for more information.\n\n# 8.13.5. Configure the loadbalance\
    \ Runner\n\nThis runner can be used for two types of load balancing, active and\
    \ passive. In active mode, constant balancing of traffic is done by using statistics\
    \ of traffic to share out traffic as evenly as possible. In passive mode, streams\
    \ are distributed randomly across the available links. This has a speed advantage\
    \ due to lower processing overhead. In high volume traffic applications this is\
    \ often preferred as traffic usually consists of multiple stream which will be\
    \ distributed randomly between the available links, in this load sharing is accomplished\
    \ without intervention by teamd.\n\nTo configure the loadbalance runner for passive\
    \ transmit (Tx) load balancing, using an editor as root, add the following to\
    \ the team JSON format configuration file:\n\n```\n{\n  \"device\": \"team0\"\
    ,\n  \"runner\": {\n    \"name\": \"loadbalance\",\n    \"tx_hash\": [\"eth\"\
    , \"ipv4\", \"ipv6\"]\n  },\n  \"ports\": {\n    \"em1\": {}, \"em2\": {}\n  }\n\
    }\n```\n\nConfiguration for hash-based passive transmit (Tx) load balancing.\n\
    \nTo configure the loadbalance runner for active transmit (Tx) load balancing,\
    \ using an editor as root, add the following to the team JSON format configuration\
    \ file:\n\n```\n{\n  \"device\": \"team0\",\n  \"runner\": {\n    \"name\": \"\
    loadbalance\",\n}\n```"
