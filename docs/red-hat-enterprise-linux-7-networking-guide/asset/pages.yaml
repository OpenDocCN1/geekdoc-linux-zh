  md: 'As a system administrator, you can configure a network interface manually,
    editing the ifcfg files.


    Interface configuration (ifcfg) controls the software interfaces for individual
    network devices. As the system boots, it uses these files to determine what interfaces
    to bring up and how to configure them. These files are usually named ifcfg-name,
    where name refers to the name of the device and. By convention, the ifcfg file''s
    suffix is the same as the string given by the DEVICE in the configuration file
    itself.


    # Configuring an Interface with Static Network Settings using ifcfg Files


    For example, to configure an interface with static network settings using ifcfg
    files, for an interface with the name create a file with the name ifcfg-enp10
    in the /etc/sysconfig/network-scripts/ directory, that contains:


    +   - IPv4 configuration


    ```

    DEVICE=enp10

    BOOTPROTO=none

    ONBOOT=yes

    PREFIX=24

    IPADDR=10.0.1.27

    ```


    +   - IPv6 configuration


    ```

    DEVICE=enp10

    BOOTPROTO=none

    ONBOOT=yes

    IPV6INIT=yes

    IPV6ADDR=2001:db8::2/48

    ```


    You do not need to specify the network or broadcast address as this is calculated
    automatically by ipcalc.


    For more IPv6 configuration options, see nm-settings-ifcfg-rh(5) man page.


