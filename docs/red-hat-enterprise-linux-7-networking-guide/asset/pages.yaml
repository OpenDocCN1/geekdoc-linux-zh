  md: '192.168.122.0/24 enp1s0 proto kernel scope src 192.168.122.16


    The ip route commands take the following form:


    +   - ip route [ add | del | change | append | replace ] destination-address


    See the ip-route(8) man page for details on the options and formats.


    To add a static route to a host, in other words to say single IP address:


    ```

    ~# ip route add 192.0.2.1 10.0.0.1 [dev interface]

    ```


    where 192.0.2.1 is the IP address in dotted decimal notation, 10.0.0.1 is the
    next hop address and interface is the exit leaving to the next hop.


    To add a static route to a network, in other words to say an IP address representing
    a range of IP addresses:


    ```

    ~# ip route add 192.0.2.0/24 10.0.0.1 [dev interface]

    ```


    where 192.0.2.0 is the IP address of the destination network in dotted decimal
    notation and /24 is the network prefix. The prefix number is the number of enabled
    bits in the subnet mask. This format of network address slash network prefix length
    is sometimes referred to as classless inter-domain routing (CIDR) notation.


    To remove the static route:


    ```

    ~# ip route del 192.0.2.1

    ```


    Any changes you make to the routing table using ip route do not persist across
    system reboots. To permanently configure static routes, you can define them by
    creating a route-interface file in the /etc/sysconfig/network-scripts/ directory
    for the interface. For example, static routes like the enp1s0 interface would
    be stored in the /etc/sysconfig/network-scripts/route-interface file. Any changes
    you make to the route-interface file do not take effect until you restart the
    network service or the interface. The route-interface file has two formats:


    +   - ip command arguments, the section called "Static Routes Using the IP Command
    Arguments".


    and


    +   - network/netmask directives, the section called "Static Routes Using the
    Network/Netmask Directives Format".


    See the ip-route(8) man page for more information on the ip route command.


    # 4.5. CONFIGURING STATIC ROUTES IN ICFG FILES


    Static routes set using ip command at the command prompt will be lost if the system
    is shutdown or restarted. To configure static routes to be persistent after a
    system restart, they must be placed in per-interface configuration files in the
    /etc/sysconfig/network-scripts/ directory. The file name should be of the format
    route-interface. There are two types of commands to use in the configuration files:


    # Static Routes Using the IP Command Arguments Format'
