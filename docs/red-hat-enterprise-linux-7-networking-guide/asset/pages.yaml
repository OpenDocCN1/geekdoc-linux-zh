- img_proc: true
  md: 'This policy intends to mimic the behavior of certain switches; particularly,
    Cisco switches with PFC2 as well as some Foundry and IBM products.


    The algorithm used by this policy is not 802.3ad compliant.


    +   **layer2+3** – Uses a combination of layer2 and layer3 protocol information
    to generate the hash.


    Uses XOR of hardware MAC addresses and IP addresses to generate the hash. The
    formula is:


    ```

    ((source_IP XOR dest_IP AND 0xffff) XOR

    ( source_MAC XOR destination_MAC ))

    MODULO slave_count

    ```


    This algorithm will place all traffic to a particular network peer on the same
    slave. For non-IP traffic, the formula is the same as for the layer2 transmit
    hash policy.


    This policy is intended to provide a more balanced distribution of traffic than
    layer2 alone, especially in environments where layer3 gateway device is required
    to reach most destinations.


    This algorithm is 802.3ad compliant.


    # 7.8. CREATING A BOND CONNECTION USING A GUI


    You can use the GNOME control-center utility to direct NetworkManager to create
    a Bond from two or more Wired or InfiniBand connections. It is not necessary to
    create the connections to be bonded first. They can be configured as part of the
    process to configure the bond. You must have the MAC addresses of the interfaces
    available in order to complete the configuration process.


    # 7.8.1. Establishing a Bond Connection


    Procedure 7.1. Adding a New Bond Connection_Using nm-connection-editor


    Follow the below steps to create a new bond connection.


    +   Enter **nm-connection-editor** in a terminal:


    ```

    ~$ nm-connection-editor

    ```


    +   Click the **Add** button. The **Choose a Connection Type** window appears.
    Select **Bond** and click **Create**. The **Editing Bond connection 1** window
    appears.'
