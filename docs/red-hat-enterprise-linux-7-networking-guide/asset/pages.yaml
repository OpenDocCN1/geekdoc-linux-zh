  md: "# Networking Guide\n\n# NOTE\n\nThere is no strict rule defining when to use\
    \ static or dynamic IP address. It depends on user's needs, preferences and the\
    \ network environment.\n\nBy default, NetworkManager calls the DHCP client, dhclient.\n\
    \n# 1.3. CONFIGURING THE DHCP CLIENT BEHAVIOR\n\nA Dynamic Host Configuration\
    \ Protocol (DHCP) client requests the dynamic IP address and corresponding configuration\
    \ information from a DHCP server each time client connects to the network.\n\n\
    Note that NetworkManager calls the DHCP client, dhclient by default.\n\n# Requesting\
    \ an IP Address\n\nWhen a DHCP connection starts, a DHCP client requests an IP\
    \ address from a DHCP server. The time that a DHCP client waits for this to be\
    \ completed is 60 seconds by default. You can configure the ipv4.dhcp-timeout\
    \ using the nmcli tool or the IPv4_DHCP_TIMEOUT option in the /etc/sysconfig/network-scripts/ifcfg-name\
    \ file. For example, using nmcli\n\n```\n# nmcli connection modify eth0 ipv4.dhcp-timeout:\
    \ 10\n```\n\nIf an address cannot be obtained during this interval, the IPv4 configuration\
    \ fails. The whole connection may fail, and this depends on the ipv4.may-fail\
    \ property:\n\n+   - ipv4.may-fail is set to yes (default), the state of the connection\
    \ depends on IPv6 configuration:\n  1. The IPv6 configuration is enabled and successful,\
    \ the connection is activated, but the IPv4 configuration can be retried again.\n\
    \  2. The IPv6 configuration is disabled or does not configured, the connection\
    \ fails.\n- ipv4.may-fail is set to no the connection is deactivated.\n  1. The\
    \ autoconnect property of the connection is enabled, NetworkManager retries to\
    \ activate the connection as many times as set in the autoconnect-retries property.\
    \ The default is 4.\n  2. If the connection cannot acquire the dhcp address, auto-activation\
    \ fails.\n            Note that after 5 minutes, the auto-connection process starts\
    \ again and the dhcp client retries to acquire an address from the dhcp server.\n\
    \n# Requesting a Lease Renewal\n\nWhen a address is acquired and the IP address\
    \ lease cannot be renewed, the dhcp client is restarted for three minutes to try\
    \ get a lease from the dhcp server. Each time, it is configured by setting the\
    \ ipv4.dhcp-timeout property in seconds (default is 60) to get the lease. If you\
    \ get a reply during your attempts, the process stops and you get your lease renewed.\n\
    \nAfter three attempts failed:\n\n![](img/6432d27ad634c9a7f868191ca63abe75_11_0.png)"
