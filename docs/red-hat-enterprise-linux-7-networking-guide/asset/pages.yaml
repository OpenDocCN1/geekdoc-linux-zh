    # 13.6. CONFIGURING THE SUBNET MANAGER


    # 13.6.1 Determining Necessity


    Most InfiniBand switches with an embedded subnet manager. However, if a more up
    to date subnet manager is required than the one in the switch firmware, or if
    more complete control than the switch manager allows is required, Red Enterprise
    Linux 7 uses the opensm manager. All InfiniBand networks must have a subnet manager
    running for the network to function. This is true when doing a simple network
    of two machines without a switch and the cards are plugged in back to back, a
    subnet manager is required for the link to come up. It is possible to have more
    than one, in which case one will as master, and any other subnet managers are
    slaves that will control the subnet manager fail.


    # 13.6.2. Configuring opensm master configuration file


    The opensm program keeps its master configuration file in /etc/rdma/opensm.conf.
    Users may edit this file at any time and it will be kept to date. There is extensive
    documentation of the options in the file itself. For the two most common edits,
    setting the GUID to bind and the PRIORITY to run, it is highly recommended that
    the opensm.conf file is not edited but instead /etc/sysconfig/opensm. If there
    are no edits to the base /etc/rdma/opensm.conf, it will get upgraded whenever
    the opensm package is upgraded. As options are added to this file regularly, this
    makes it easier to keep the current configuration up to date. If the opensm.conf
    file has been changed, then out may be necessary to merge new options into the
    file.


    # 13.6.3. Configuring the opensm startup options


    The options in the /etc/sysconfig/opensm file control how the subnet manager is
    started, as well as how many copies of the subnet manager are started. For a dual
    port InfiniBand card, with each port plugged into physically separate networks,
    will need a copy of the subnet manager running on each port. The subnet manager
    will manage only one subnet instance of the application and must be started once
    for each subnet that needs to be managed. In addition, if there is more than one
    opensm server, set the priorities on each server to control which are slaves and
    which are to be master.


    The file /etc/sysconfig/opensm is used to provide a simple method to set the priorities
    of the subnet manager and control which GUID the subnet manager binds to. This
    is an extensive explanation of the options in the /etc/sysconfig/opensm file itself.
    Users only read and follow the directions in the file to enable failover and multifab
    operation of opensm.


    # 13.6.4. Creating a P_Key partition


    By default, opensm looks for the file /07ff/partitions to get a list of partitions
    to create on the fabric. All fabrics must contain the subnet, and all hosts belong
    to that fabric. Any other partition can be created in addition to that, and hosts
    and switches do not have to be members of these additional partitions. An administrator
    can create subsets to Ethernet''s VLANs on InfiniBand fabrics. if a partition
    is defined with a given speed, such as 40 Gbps, and there is a host on the network
    unable to do 40 Gbps, that host will be unable to join the partition even if it
    has permission to do so as it will be unable to match the speed requirements,
    therefore it is


