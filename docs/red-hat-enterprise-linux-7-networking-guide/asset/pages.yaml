    #


    Any text after the # character to the end of the line is considered a comment.
    For example:


    notify yes; # notify secondary nameservers


    /* */

    Any block of text enclosed in /* and */ is considered a comment. For example:


    notify yes; /* notify secondary nameservers * /


    # 15.2.3. Editing Zone Files


    As outlined in Section 15.1.1, "Name server Zones", zone files contain information
    about a namespace. They are stored in the named working directory located in /var/named/
    by default. Each zone file is named according to the file in the zone statement,
    usually in a way that relates to the domain and identifies the file as containing
    zone data, such as example.com.zone.


    Table 15.5. The named Service Zone Files


    | Path | Description |

    | /var/named/ | The working directory for the named service. The nameserver is
    not allowed to write to this directory. |

    | /var/named/slaves/ | The directory for secondary zones. This directory is writable
    by the named service. |

    | /var/named/dynamic/ | The directory for other files, such as dynamic DNS (DDNS)
    keys. This directory is writable by the named service. |

    | /var/named/data/ | The directory for various statistics and debugging files.
    This directory is writable by the named service. |


    A zone file consists of directives and resource records. Directives tell the nameserver
    to perform or apply special settings to the zone, resource records define the
    parameters of the zone and assign identities to individual hosts. While the directives
    are optional, the resource records are required in order to provide proper service
    name to a zone.


    All directives and resource records should be entered on individual lines


    # 15.2.3.1. Common Directives


    Directives begin with the dollar character ($) followed by the name of the directive,
    and usually appear at the top of the file. The following directives are commonly
    used in zone files:


    ```

    $INCLUDE

    ```'
