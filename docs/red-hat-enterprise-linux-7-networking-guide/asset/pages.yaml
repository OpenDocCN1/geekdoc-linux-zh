  md: "# 8.13.7.3. Configure IPv6 NA/NS for Link-state Monitoring\n\n```\n{\n  \"\
    device\": \"team0\",\n  \"runner\": {\"name\": \"activebackup\"},\n  \"link_watch\"\
    : {\n    \"name\": \"nsna_ping\",\n    \"interval\": 200,\n    \"missed_max\"\
