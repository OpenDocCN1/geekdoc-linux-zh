    # 14.3.2. Configuring dhcp6 as a DHCP6 relay agent


    To run dhcp6 in DHCP6 add the -6 argument and specify the "lower interface" (on
    which queries will be received from clients or other relay agents) and the "upper
    interface" (to which queries from clients and other relay agents should be forwarded).
    Copy dhcp6relay.service to dhcp6relay.service and add it the root user:


    ```

    ~# cp /lib/systemd/system/dhcp6relay.service /etc/systemd/system/dhcp6relay.service

    ~# vi /etc/systemd/system/dhcp6relay.service

    ```


    Edit the EditStart option under [Section] add -6 argument and add the "lower interface"
    and "upper interface" interface, for example:


    ```

    ExecStart=/usr/sbin/dhcp -d --no-pid -6 -i em1 em2

    ```


    For other options see the dhcprelay(8) man page.


    To activate the changes made, as the root user, restart the service:


    ```

    ~# systemctl --system daemon-reload

    ~# systemctl restart dhcp6

    ```


    # 14.4. CONFIGURING MULTIHOMED DHCP SERVER


    A multihomed DHCP server serves multiple networks, that is, multiple subnets.
    The examples sections detail how to configure a DHCP server to serve multiple
    networks, select which network to listen on, and how define network settings for
    services that moves networks.


    Before making any changes, back up the existing /etc/dhcp/dhcpcd.conf file.


    The DHCP daemon will only listen on interfaces for which it finds a subnet declaration
    in the /etc/dhcp/dhcpcd.conf file.'
