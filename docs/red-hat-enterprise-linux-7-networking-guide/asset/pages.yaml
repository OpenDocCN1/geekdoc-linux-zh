- img_proc: true
  md: 'features use automatic and show up as the proper drivers for the hardware are
    installed. The kernel drivers are all included with each kernel Red Hat, however
    the user-space drivers must be manually installed if the InfininiBand package
    group was not selected at some install time.


    Since Red Hat Enterprise Linux 7.4, all RDMA user-space drivers are merged into
    the rdma-core package. To install supported iWARP, RoCE or InfininiBand user-space
    drivers, enter as root:


    ```

    ~# yum install libibverbs

    ```


    If you are using Priority Flow Control (PFC) and mlx4-based cards, then edit /etc/modprobe/mlx4.conf
    to instruct which packet priority is configured for the "no-drop" service on the
    Ethernet switches which the cards are plugged in and rebuild the initramfs to
    include the modified driver. Newer mlx5-based cards auto-generate PFC settings
    with the switch and do not need any module option to inform them of the "no-drop"
    priority priorities.


    To set the Mellanox cards use one or both ports in Ethernet, see Section 13.15.4,
    "Configuring Mellanox cards for Ethernet operation".


    With these driver packages (added to the normal RDMA protocols typically installed
    for any InfininiBand installation), a user should be able to use most of the normal
    RDMA protocols to test and see RDMA communication taking place on their adapters.
    However, not all of the included in Red Hat Enterprise Linux properly support
    iWARP or RoCE/IBCE devices. This connection establishment protocol in iWARP in
    particular is different than it is on any InfininiBand link-layer connections.
    If the program uses the libdma connection management library, it handles the differences
    between iWARP and InfininiBand silently and the program should work. If the application
    tries to do its own connection management, then it must support iWARP or else
    it does not work.


    # 13.2. TRANSFERRING DATA USING ROCE


    RDMA over Converged RoCE is a network protocol that enables remote memory access
    (RDMA) over an Ethernet network. There are two RoCE versions, RoCE v1 and RoCE
    v2, depending on the network adapter.


    # RoCE v1


    The RoCE v1 is an Ethernet link layer protocol with encapsulate 08915 which enables
    communication between any two hosts in the same Ethernet broadcast domain. RoCE
    v1 is the default version for RDMA Connection Manager (RDMA_CM) when using the
    ConnectX-3 network adapter.


    # RoCE v2


    The RoCE v2 exists on top of UDP over IPv4 or the UDP over IPv6 protocol. The
    UDP destination port number 4791 has been reserved for RoCE v2. Since Red Hat
    Enterprise Linux 7.5, RoCE v2 is the default version for RDMA_CM when using the
    ConnectX-3 Pro, ConnectX-4, ConnectX-4 Lx and ConnectX-5 network adapters. Hardware
    supports RoCE v1 and RoCE v2.


    RDMA Connection Manager (RDMA_CM) is used to set up a reliable connection between
    a client and a server for transferring data. RDMA_CM provides an RDMA transport-interface
    for establishing connections. The communication is over a specific RDMA device,
    and data transfers are message-based.


    # Prerequisites


    An RDMA_CM session requires one of the following:'
