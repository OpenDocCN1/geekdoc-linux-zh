  md: '# CHAPTER 15. DNS SERVERS


    DNS (Domain Name System), is a distributed database system that is used to associate
    host names with their respective IP addresses. For users, this has the advantage
    that they can refer to machines on the network by names that are usually easier
    to remember than the numerical network addresses. For system administrators, using
    a DNS server, also known as a name server, enables the IP address for a host without
    ever affecting the name-based queries. The use of the DNS databases is not only
    for resolving IP to domain names and their use is broader and broader than DNSSEC


    # 15.1. INTRODUCTION TO DNS


    DNS is usually implemented using one or more centralized servers that are authoritative
    for certain domains. When a client requests information from a name server, it
    usually connects to port 53. The name server is configured to be a recursive name
    server and does not have an authoritative answer, or does not already have the
    answer cached from an earlier query, it queries other name servers, called root
    servers, to determine which name servers are authoritative for the name, and then
    them to get the requested name. Name servers configured as purely authoritative,
    with recursion, will not depend on lookups of client.


    # 15.1.1. Name Zones


    In a DNS server, all information is stored in basic data elements resource records
    (RR). Resource records are defined in RFC 1034. The domain names are organized
    into a tree structure. Each level of the hierarchy is defined by a period (.).
    For example: The root name, denoted by ., is the root of the DNS tree; the domain
    name com, referred to as the top-level domain (TLD) is a child of the root domain
    (.), so it is the first level of the hierarchy. The domain name example.com is
    at the second level of the hierarchy.


    > Example 15.1. A Simple Resource Record


    An example of a resource record (RR):


    | example.com. | 86400 | A | 192.0.2.1 |


    The domain name, example.com, is the owner for the RR. The value 86400 is the
    time to live (TTL). The letters IN, indicate the "Internet", the class of the
    RR. The letter A indicates the type of RR (in this example, a host address). The
    host address 192.0.2.1 is the data contained in the final section of this RR.
    This one line is a RR with the same type, order, and class called a resource record
    set (RRSet).


    Zones are defined on authoritative name servers through the use of zone files,
    which contain definitions of the resource records in each zone. Zone files are
    stored on primary name servers (also called master servers), which are made to
    the files, and secondary name servers (also called slave name servers), which
    receive zone definitions from the primary name servers. Both primary and secondary
    name servers are authoritative for the zone and look to the clients. Depending
    on the configuration, any name server can serve as a primary or secondary server
    for multiple zones at the same


    Note that administrators of DNS and DHCP servers, as well as any provisioning
    agencies, should agree on the host format used in an organization. See Section
    6.1.1, "Recommended Naming Practices" for more information on the format of host
    names.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 15.1.2. Name server Types


    There are two name server configuration types:


    authoritative


    Authoritative name servers answer to resource records that are part of their zones
    only. This category includes both primary (master) and secondary (slave) name
    servers.


    recursive


    Recursive name servers offer resolution services, but they are not authoritative
    for any zone. Answers for all resolutions are cached in a memory for a fixed period
    of time, which is specified by the retrieved resource record.


    Although a name server can be both authoritative and recursive at the same time,
    it is recommended not to combine the configuration types. To be able to perform
    their work, authoritative servers should be available to all clients the time.
    On the other hand, since the recursive lookup takes far more time than authoritative
    responses, recursive servers should be available to a restricted number of clients
    only, otherwise they are prone to distributed denial (DDoS) attacks.


    # 15.1.3. BIND as a Name server


    BIND consists of a set of DNS-related programs. A name server calls **named**,
    an administration utility called **rndc**, and a debugging tool called **dig**.
    Red Hat Enterprise Linux Administrator''s Guide for more information on how to
    run a service in Red Hat Enterprise Linux.


    # 15.2. BIND


    This section covers BIND (Berkeley Internet Name Domain), the **DNS** server included
    in Red Hat Enterprise Linux. It focuses on the structure of its configuration
    files, and describes how to administer it locally and remotely.


    # 15.2.1. Empty Zones


    BIND configures a number of "empty zones" to prevent recursive servers from sending
    unnecessary queries to servers that cannot handle them (thus creating delays and
    SERVFAIL NXDOMAIN responses are returned instead). The configuration option **empty-zones-enable**
    controls whether or not empty zones are created, the option **disable-empty-zone**
    can be used to disable one or more empty zones from the list of default prefixes
    that would be used.


    The number of empty zones created for RFC 1918 prefixes has increased, and users
    of BIND 9.9 will see the RFC 1918 empty zones when **empty-zones-enable** is unspecified
    (defaults to yes), and when it is explicitly set to **yes**.


    # 15.2.2. Configuring the named Service


    When the **named** service is started, it reads the configuration from the files
    as described in Table 15.1, "The named Service Configuration Files".


    Table 15.1. The named Service Configuration Files'
