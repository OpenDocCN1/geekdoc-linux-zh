  md: '# CHAPTER 1. OVERVIEW OF NETWORKING TOPICS


    +   - ipv4.may-fail is set to yes (default) and IPv6 is successfully configured,
    the connection is activated and the dhcp client is restarted every 2 minutes.


    +   - ipv4.may-fail is set to no, the connection is deactivated. In this case,
    if the connection has the autoconfig property enabled, the connection is activated
    from scratch.


    # 1.3. Making DHCPv4 Persistent


    To make DHCPv4 persistent at startup and during the lease renewal processes, set
    the ipv4.dhcp-timeout property to a 32-bit integer (MAXINT32), which is 2147483647,
    or set it to infinity value:


    ```

    ~ nmcli modify en1s0 ipv4.dhcp-timeout infinity

    ```


    As a result, NetworkManager never stops to get or renew a lease from a DHCP server
    until it is successful.


    To ensure a DHCP persistent behavior only during the renewal process, you can
    manually add a static IP to the IPADDR property in the /etc/sysconfig/network-scripts/ifcfg-en1s0
    configuration file or using nmcli


    ```

    ~ nmcli modify en1s0 ipv4.address 192.168.122.88/24

    ```


    When an IP address expires, the iptables preserves the IP state as configured
    or partially configured (you can have an IP address, but you are not connected
    to the Internet), making sure that the dhcp client is restarted every 2 minutes.


    # 1.4. SETTING THE WIRELESS REGULATORY DOMAIN


    Red Hat Enterprise Linux, the crda package contains the Central Regulatory Domain
    Agent that provides the kernel with the wireless regulatory rules for a given
    jurisdiction. It is used by certain scripts and should not be run manually unless
    debugging scripts. The kernel runs crda by sending a udev event upon a new regulatory
    domain change. Regulatory domain changes are triggered by the Linux wireless subsystem
    (IEEE-802.11). This subsystem uses the regulatory.bin file to keep its regulatory
    database information.


    The setregdomain utility sets the regulatory domain for your system. Setregdomain
    takes no arguments and is called through system script as usd rather than manually
    by the administrator. If a country look-up fails, the system administrator can
    define the COUNTRY environment variable in the /etc/sysconfig/regdomain file.


    See the following pages for information about the regulatory domain:


    +   - setregdomain(1) man page – Sets regulatory domain based on country code.

    - crda(8) man page – Sends to the kernel a wireless regulatory domain for a given
    ISO or IEC 3166 alpha2.

    - regulatory.bin(5) man page – Shows the Linux wireless regulatory database.

    - iw(8) man page – Shows or manages wireless devices and their configuration.


