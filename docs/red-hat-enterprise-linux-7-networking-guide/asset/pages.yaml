  md: '# Installing ncat


    To install the ncat package, enter as **root:**


    ```

    ~# yum ncat

    ```


    # Brief Selection of ncat Use Cases


    Example 1.1. Enabling Communication between a Client and a Server


    +   1. Set a client machine to listen for connections on TCP port `8080:`


    ```

    ~$ ncat -l 8080

    ```


    +   2. On a server machine, specify the IP address of the client and use the same
    port number:


    ```

    ~$ ncat 10.0.11.60 8080

    ```


    You can send messages on either side of the connection and they appear on both
    local and remote machines.


    +   3. Press `Ctrl+D` to close the TCP connection.


    ![](img/6432d27ad634c9a7f868191ca63abe75_15_0.png)


    > NOTE To check a UDP port, use the same `nc` commands with the `-u` option. For
    example:


    ```

    ~$ ncat -u -l 8080

    ```


    # Example 1.2. Sending Files


    Instead of printing information on the screen, as mentioned in the previous example,
    you can send all information to a file. For example, to send a file over TCP `port.8080`
    from a client to a server:


    +   1. On a client machine, to listen a specific port transferring a file to the
    server machine:


    ```

    ~$ ncat -l 8080 > outputfile

    ```


    +   2. On a server machine, specify the IP address of the client, the port and
    the file which is to be transferred:


    ```

    ~$ ncat -l 10.0.11.60 8080 < inputfile

    ```


    After the file is transferred, the connection closes automatically.'
