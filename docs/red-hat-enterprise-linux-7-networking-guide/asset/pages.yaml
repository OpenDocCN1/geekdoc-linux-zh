  md: 'Both client and server support the same RoCE.


    +   - A client supports RoCE v1 and a server RoCE v2.


    Since a client determines the mode of the connection, the following cases are
    possible:


    # A successful connection:


    If a client is in RoCE v1 or RoCE v2 mode depending on the network card and the
    driver used, the corresponding server must have the same version to create a connection.
    Also, the connection is successful if a client is in RoCE v1 and in a server RoCE
    v2 mode.


    # A failed connection:


    If a client is in RoCE v2 and the corresponding server is in RoCE v1, no connection
    can be established. In this case, update the driver or the network adapter of
    the corresponding server, see Section 13.2, “Transferring Data Using RoCE”


    # Table 13.1. RoCE Version Defaults Using RDMA-CM


    | Client | Server | Default setting |

    | --- | --- | --- |

    | RoCE v1 | RoCE v1 | Connection |

    | RoCE v1 | RoCE v2 | Connection |

    | RoCE v2 | RoCE v2 | Connection |

    | RoCE v2 | RoCE v1 | No connection |


    That RoCE v2 on the client and RoCE v1 on the server are not compatible. To resolve
    this issue, force both the server and client-side environment to communicate over
    RoCE v1. This means to force hardware that supports RoCE v2 to use RoCE v1:


