    \ have defined the best set of parameters for your bond, add those parameters\
    \ as a space-separated list for the BONDING_OPTIONS directive in /etc/sysconfig/network-scripts/ifcfg-bond\
    \ for the file you are configuring. When that bond is brought up (for example,\
    \ by the system during the boot sequence if the ONBOUT=yes directive is set),\
    \ the bonding options specified in the BONDING_OPTIONS will take effect for that\
    \ bond.\n\nThe following list provides the names of the more common channel bonding\
    \ parameters, with a description of what they do. For more information, see the\
    \ brief descriptions for each parm in modinfo bonding or for more detailed information,\
    \ see https://www.kernel.org/doc/Documentation/networking/bonding.txt.\n\n# Bonding\
    \ Interface Parameters\n\nad_select=value\n\nSpecifies the 802.3ad aggregation\
    \ selection logic to use. Possible values are:\n\n+   * **stable or 0** – Default\
    \ setting. The active aggregator is chosen by largest aggregate bandwidth. Resection\
    \ of the active aggregator occurs only when the slaves of the active aggregator\
    \ are down or if the active aggregator has no slaves.\n* **bandwidth or 1** –\
    \ The active aggregator is chosen by largest bandwidth. Resection occurs if:\n\
    \    * A slave is added to or removed from the bond;\n    * Any slave's link state\
    \ changes;\n    * Any slave's 802.3ad association state changes;\n    * The bond's\
    \ administrative state changes to up.\n* **count or 2** – The active aggregator\
    \ is chosen by the largest number of slaves. Resection occurs as described for\
    \ the bandwidth setting above.\n\nThe bandwidth and count selection policies permit\
    \ failover of 802.3ad aggregations when partial failure of the active aggregator\
    \ occurs. This keeps the aggregator with the highest availability, either in bandwidth\
    \ or number of slaves, at times.\n\narp_interval=time_in_milliseconds\n\nSpecifies,\
    \ in milliseconds, how often ARP monitoring occurs.\n\n> IMPORTANT\n\nIt is essential\
    \ that both arp_interval and arp_target parameters are specified, or alternatively,\
    \ the milimon parameter is specified. Failure to do so can cause degradation of\
    \ network in the event that a link fails.\n\nIf using this setting in mode=0 or\
    \ mode=2 (the two load-balancing modes), the network switch must be configured\
    \ to distribute packets evenly across the NICs. For more information on how to\
    \ accomplish this, see https://www.kernel.org/doc/Documentation/networking/bonding.txt.\n\
    \n![](img/6432d27ad634c9a7f868191ca63abe75_106_0.png)"
