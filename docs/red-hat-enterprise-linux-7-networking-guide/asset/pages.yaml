- img_proc: true
  md: 'The following is a basic /etc/dhcpd.conf file, for a server that has two network
    interfaces, enp0s in a 10.0.0.0/24 network, and enp2s0 at 172.16.0.0/24 network.
    Multiple subnet declarations allow you to define different settings for multiple
    networks:


    ```

    default-lease-time 600;

    max-lease-time 7200;

    ubnet 10.0.0.0 netmask 255.255.255.0 {

    option subnet-mask 255.255.255.0;

    option routers 10.0.0.1;

    range 10.0.0.5 10.0.0.15;

    }

    subnet 172.16.0.0 netmask 255.255.255.0 {

    option subnet-mask 255.255.255.0;

    option routers 172.16.0.1;

    range 172.16.0.5 172.16.0.15;

    }

    ```


    subnet 10.0.0.0 netmask 255.255.255.0;

    A subnet declaration is required for every network that your DHCP server is serving.
    Multiple subnets require multiple subnet declarations. If the DHCP server does
    not have a network interface in the range of a subnet declaration, the DHCP server
    does not serve that network.


    If there is only one subnet declaration, and no network interfaces are in the
    DHCP daemon fails to start, and an error as the following is logged to /var/log/messages:


    > dhcp: No subnet declaration for enp1s0 (0.0.0.0),

    dhcp: ** Ignoring declaration on enp1s0. If this is not what

    y want, please write a subnet declaration

    dhcp: in your dhcp.conf file for the network segment

    dhcp: to which interface enp2s0 is attached. **

    dhcp:

    dhcp:

    dhcp: Not configured to listen on any interfaces!


    option subnet-mask 255.255.255.0;

    The option subnet-mask option defines a subnet mask, and overrides the netmask
    value in the subnet declaration. In simple cases, the subnet and netmask values
    are the same.


    option routers 10.0.0.1;

    The option routers option defines the default gateway for the subnet. This is
    required for systems to reach internal networks on a different subnet, as well
    as external networks.


    range 10.0.0.5 10.0.0.15;

    The range option specifies the pool of available IP addresses. Systems are assigned
    an address from the range of specified IP addresses.


    For further information, see the dhcpd.conf(5) man page.'
