  md: 'delete, activate, and deactivate network connections, as well as control and
    display device status.


    The nmcli utility can be used by both users and scripts for controlling NetworkManager:


    +   - For servers, headless machines, and terminals, nmcli can be used to control
    NetworkManager directly, including creating, editing, starting and stopping network
    connections and viewing network status.


    +   - For scripts, nmcli supports a terse output format which is better suited
    for script processing. It is a way to integrate network connection configuration
    instead of managing network connections manually.


    The basic format of a nmcli command is as follows:


    ```

    nmcli [OPTIONS] OBJECT { COMMAND | help }

    ```


    where OBJECT can be one of the following: general, networking, radio, connection,
    device, agent, and monitor. You may use any prefix of these options in your commands.
    For example, nmcli help, nmcli c help nmcli c help generate the same output.


    Some of useful OPTIONS to get started are:


    # -t, terse


    This mode can be used for computer script processing as you can see a terse output
    displaying the values.


    > Example 3.1. Viewing a terse output


    ```

    nmcli -t device

    ens3:ethernet:connected:Profile 1

    lo:loopback:unmanaged:

    ```


    # -f, field


    This option specifies what fields can be displayed in output. For example, NAME_UUID,TYPE,AUTOCNECT,ACTIVE,DEVICE,STATE.
    You may use one or more fields. If you want to use more, do not use space after
    comma to separate the fields.


    > Example 3.2. Specifying Fields in the output


    ```

    ~$ nmcli -f DEVICE,TYPE device

    DEVICE TYPE

    ens3 ethernet

    lo loopback

    ```


    or even better for scripting:


    ```

    ~$ nmcli -t -f DEVICE,TYPE device

    ens3:ethernet

    lo:loopback

    ```


    # -p, pretty'
