    : \"arp_ping\",\n    \"interval\": 100,\n    \"missed_max\": 30,\n    \"source_host\"\
    : \"192.168.23.2\",\n    \"target_host\": \"192.168.23.1\"\n  },\n  \"ports\"\
    : {\n    \"em1\": {\n      \"prio\": -10,\n      \"sticky\": true\n    },\n  \
    \  \"em2\": {\n      \"prio\": 100\n    }\n  }\n}\n```\n\nThis configuration uses\
    \ arp_ping as the link watcher. The missed_max option is a limit value of the\
