    You can connect to a network automatically using control-center:


    Procedure


    +   1. Press the Super key to enter the Activities Overview, type Settings and
    press Enter. Then, select the Network tab on the left-hand side. The Network tools
    appear on the right-hand side menu, see the section called "Configuring New Connections
