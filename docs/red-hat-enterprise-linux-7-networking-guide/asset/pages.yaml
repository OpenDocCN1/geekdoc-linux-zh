    10.10.0/24 via 192.168.0.10 dev enp1s0

    172.16.1.10/32 via 192.168.0.10 dev enp1s0

    ```


    In the above example, packets going to the local 192.168.0/24 network will be
    directed out the interface attached to that network. Packets going to the 10.10.0/24
    network and 172.16.1.10/32 host will be directed to 192.168.0.10. Packets to unknown,
    remote networks, will use the default gateway unless static routes are configured
    for remote networks or hosts if the default route is not suitable. Remote in this
    context means networks or hosts that are not directly attached to the system.


    For IPv6 configuration, an example of a route-interface file in ip route format:


    +   - 2001:db8::1/48 via 2001:db8::1 metric 204

    - 2001:db8::::


    Specifying an exit interface is optional. It can be useful if you want to force
    traffic out of a specific interface. For example, in the case of a VPN, you can
    force traffic to a remote network to pass through a tun0 interface even when the
    interface is in a different subnet to the destination network.


    The ip route format can be used to specify a specific address. For example:


    +   - 10.10.0/24 via 192.168.0.10 src 192.168.0.2


    To define an policy-based routing configuration, which specifies multiple routing
    tables, see Section 4.5.1, "Understanding Policy-routing".'
