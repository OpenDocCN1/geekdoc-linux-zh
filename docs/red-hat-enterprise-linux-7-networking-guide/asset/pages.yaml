  md: "# CHAPTER 10. CONFIGURE 802.1Q VLAN TAGGING\n\nTo create a VLAN, an interface\
    \ is created on top of another interface referred to as the parent interface.\
    \ The VLAN interface will tag packets with the VLAN ID as they pass through the\
    \ interface, returning packets will be untagged. VLAN interface can be configured\
    \ similarly to any other interface. The parent interface does not be an Ethernet\
    \ interface. An 802.1Q tagging interface can be created on top of bridge, and\
    \ team interfaces, however there are some things to note:\n\n+   - In the case\
    \ of VLANs over bonds, it is important that the bond has slaves and that they\
    \ are “up” before opening the VLAN interface. Adding a VLAN to a bond without\
    \ slaves does not work.\n\n+   - A VLAN slave cannot be configured on a bond with\
    \ the fail_over_mac:follow option, because the VLAN virtual device cannot change\
    \ its MAC address to match the new MAC address. In such case, traffic will be\
    \ sent with the incorrect source MAC address.\n\n+   - Sending VLAN packets through\
    \ a network switch requires the switch to be properly configured. For example,\
    \ ports on Cisco switches must be assigned to one VLAN or be configured as trunk\
    \ ports to accept tagged packets from multiple VLANs. Some vendor switches allow\
    \ untagged packets of the native VLAN to be processed by a trunk port. Some devices\
    \ allow you to enable or disable the native VLAN, other devices have disabled\
    \ it by default. Consequence of this disparity may result in native VLAN misconfiguration\
    \ between different switches, posing a security risk.\n\nOne uses native VLAN\
    \ while the other uses native VLAN 10. If the frames are allowed to pass without\
    \ the tag being inserted, an attacker is able to jump VLANs – this common network\
    \ penetration technique is known as VLAN hopping.\n\nTo minimize security risks,\
    \ configure your interface as follows:\n\n# Switches\n\n+   - Unless you need\
    \ them, disable trunk ports.\n- If you need trunk ports, disable native VLAN,\
    \ so that untagged frames are not allowed.\n\n# Red Hat Enterprise Linux server\n\
    \n+   - Use the nftables or ebtables utilities to drop untagged frames in ingress\
    \ filtering.\n\n+   - Some older network interface cards, loopback interfaces,\
    \ Wimac cards, and some InfinBand devices, are said to be VLANED, meaning they\
    \ cannot support VLANs. This is usually because the devices cannot cope with VLAN\
    \ headers and the larger MTU size associated with tagged packets.\n\n![](img/6432d27ad634c9a7f868191ca63abe75_166_0.png)\n\
    \n> NOTE\n Bonding on top of VLAN is not supported by Red Hat. See the Red Hat\
    \ Knowledgebase article Whether configuring bond on top of VLAN as slave interfaces\
    \ is a valid configuration? for more information.\n\n# 10.1. SELECTING VLAN INTERFACE\
    \ CONFIGURATION METHODS\n\n163"
  merge: -1
