- img_proc: true
  md: '# NOTE


    The nmcli utility does not support using 0.0.0.0/0 for the default gateway ipv4.gateway.
    To work around this problem, the command creates separate routes for the 0.0.0.0/1
    and 128.0.0.0/1 subnets, which covers all the full IPv4 address space.


    +   3. Configure the network interface to the internal workstations subnet:


    ```

    # nmcli connection add type ethernet con-name Internal-Workstations ifname en8s0
    ipv4.method manual ipv4.addresses 10.0.0.1/24 ipv4.routes "10.0.0.0/24 src=192.0.2.1
    table=5000" ipv4.routing-priority 5 from 10.0.0.0/24 connection.zone trusted

    ```


    This command uses the ipv4.routes parameter to add a static route to the subnet
    with ID 5000. This static to the 10.0.0.0/24 subnet uses the IP of the local network
    interface to provider B (192.0.2.1) as next hop.


    Additionally, we use the ipv4.routing-rules parameter to add a route ruling with
    priority 5 that routes traffic from the 10.0.0.0/24 subnet to 5000. Low values
    have a high priority.


    Note that the syntax in the ipv4.routing-rules parameter is same as in an ip route
    add command, except that ipv4.routing-rules always requires specifying a priority.


    +   4. Configure the network interface to the server subnet:


    ```

    # nmcli connection add type ethernet con-name Servers ifname en9s0 ipv4.method
    manual ipv4.addresses 203.0.113.1/24 connection.zone trusted

    ```


    # Verification Steps


    +   1. On a RHEL host in the internal workstation subnet:


    +   1. Install the traceroute package:


    ```

    # yum install traceroute

    ```


    +   2. Use the traceroute utility to display the route to a host on the internet:


    ```

    # traceroute redhat.com

