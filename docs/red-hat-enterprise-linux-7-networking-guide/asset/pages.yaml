  md: "# CHAPTER 12. CONFIGURING POLICY-BASED ROUTING TO DEFINE ALTERNATIVE ROUTES\n\
    \nBy default, the kernel in RHEL decides where to forward network packets based\
    \ on the destination address using a routing table. Policy-based routing enables\
    \ you to configure complex routing scenarios. For example, you can route packets\
    \ based on various criteria, such as the source address, packet metadata, or protocol.\n\
    \nThis section describes how to configure policy-based routing using NetworkManager.\n\
    \n> NOTE\nOn systems that use NetworkManager, only the nmcli utility supports\
    \ setting routing rules and assigning them to specific tables.\n\n# 12.1. ROUTING\
    \ TRAFFIC FROM A SPECIFIC SUBNET TO A DIFFERENT DEFAULT GATEWAY\n\nThis section\
    \ describes how to configure A as a router that, by default, routes all traffic\
    \ to internet provider A using the default route. Using policy-based routing,\
    \ RHEL routes traffic received from the internal workstations subnet to provider\
    \ B.\n\nThe procedure assumes the following network topology:\n\n![](img/6432d27ad634c9a7f868191ca63abe75_187_0.png)\n\
    \nFigure 12.1. Activate a Connection\n\n# Prerequisites\n\n+   - The RHEL router\
    \ you want to set up in the procedure has four network interfaces:\n  - The en7s0\
    \ interface is connected to the network of provider A. The gateway IP in the provider's\
    \ network is 198.51.100.2, and the network uses a /30 network mask.\n  - The en1s0\
    \ interface is connected to the network of provider B. The gateway IP in the provider's\
    \ network is 192.0.2.2, and the network uses a /30 network mask."
  merge: -1
  pgno: 187
- img_proc: true
  md: '# CHAPTER 12. CONFIGURING POLICY-BASED ROUTING TO DEFINE ALTERNATIVE ROUTES


    +   - The en9s0 interface is connected to the 10.0.0.0/24 subnet with internal
    workstations.

    - The en9s0 interface is connected to the 203.0.113.0/24 subnet with the company''s
    servers.

    - Hosts in the internal workstations use 10.0.0.1 as default gateway. In the procedure,
    you assign this IP address to the en8s0 network interface of the router.

    - Hosts in the server subnet use 203.0.113.1 as default gateway. In the procedure,
    you assign this IP address to the en9s0 network interface of the router.

    - The firewal service is enabled and active, which is the default.


    # Procedure


    +   1. Configure the network interface to provider A:


    ```

    # nmcli connection add type ethernet con-name Provider-A ifname en7s0 ipv4.method
    manual ipv4.addresses 198.51.100.1/30 ipv4.gateway 198.51.100.2 ipv4.dns 198.51.100.200
    connection.zone

    ```


    The nmcli connection add command creates a NetworkManager connection profile.
    The following list describes the options of the command:


    +   - type ethernet: Defines that the connection type is Ethernet.

    - con-connection_name: Sets the name of the profile. Use a meaningful name to
    avoid confusion.

    - ifname network_device: Sets the network interface.

    - ipv4.method manual: Enables to configure a static IP address.

    - ipv4.addresses IP_address/subnet_mask: Sets the IPv4 addresses and subnet mask.

    - ipv4.gateway IP_address: Sets the default gateway.

    - ipv4.dns IP_of_DNS_server: Sets the IPv4 address of the DNS server.

    - connection.firewall_zone: Assigns the network interface to the defined firewall
    zone. Note that firewalld automatically enables masquerading interfaces assigned
    to the external zone.


    +   2. Configure the network interface to provider B:


    ```

    # nmcli connection add type ethernet con-name Provider-B ifname en1s0 ipv4.method
    manual ipv4.addresses 192.0.2.1/30 ipv4.routes "0.0.0.0/0 192.0.2.2 table=5000,128.0.0.1/192.0.2.2
    table=5000" connection.zone external

    ```


    This command uses the ipv4.routes parameter instead of ipv4.gateway to set the
    default gateway. This is required to assign the default gateway for connection
    to a different routing table (5000) than the default. NetworkManager automatically
    creates this new routing table when the connection is activated.


    185'
  merge: -1
