    # 13.5.5. Connecting to a Remote Linux SRP Target\n\nThe SCSI RDMA Protocol (SRP)\
    \ is a network protocol that enables a system to use RDMA to access SCSI devices\
    \ that are attached to another system. To use an SRP initiator to connect an SRP\
    \ target on the SRP target side, you must add an access control list (ACL) entry\
    \ for the host channel adapter (HCA) port used in the initiator.\n\nACL IDs for\
    \ HCA ports are not unique. The ACL depend on the GID format of the HCAs, HCAs\
