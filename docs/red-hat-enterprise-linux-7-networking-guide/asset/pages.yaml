  md: "# 13.5.1. Configuration of the rdma.conf file\n\nThe rdma service reads /etc/rdma/rdma.conf\
    \ to find out kernel-level and user-level RDMA protocols the administrator wants\
    \ to be loaded by default. Users should edit this file to turn various drivers\
    \ on or off.\n\nThe various drivers that can be enabled and disabled are:\n\n\
    +   - iPoIB – This is an IP network emulation layer that allows IP applications\
    \ to run over InfiniBand networks.\n\n+   - SRP – This is the SCSI Request Protocol.\
    \ It allows a machine to mount a remote drive or drive array that is exported\
    \ through the SRP protocol on as though it were a hard disk array.\n\n+   - SRPT\
    \ – This is the target mode, or server node, of the SRP protocol. This loads the\
    \ kernel support necessary for exporting a drive or array for other machines as\
    \ though they were on their machine. Further configuration of the target mode\
    \ support is required before any devices will actually be exported. See documentation\
    \ in the targetd and targetcli packages for further information.\n\n+   - ISER\
    \ – This is a low-level driver for the general ISCTL layer of the Linux kernel\
    \ that provides transport over InfiniBand networks for iSCSI transports.\n\n+\
    \   - RDS – This is the Reliable Datagram Service in the Linux kernel. It is not\
    \ enabled in Red Hat Enterprise 7 kernels and cannot be loaded.\n\n# 13.5.2. Usage\
    \ of 70-persistent-ipoib.rules\n\nThe rdma package provides the file /etc/udev/rules/70-persistent-ipoib.rules.\
    \ This udev file is used to rename iPoIB devices from their default names (such\
    \ as ib0 and ib1). Users must edit this file to change how their devices are named.\
    \ First, find the GUID for the device to be renamed:\n\n```\n$ ip link show ib0\n\
    8: ib0:BROADCAST,MULTICAST,UP,LOWER_UP mtu 65520 qdisc pfifo_fast state UP\n \
    \   default len 256\n    link/finiband 00:00:02:00:fe:80:00:00:00:00:00:04:15:14:03:00:7b:c3:a1\
    \ rdma\n    00:ff:ff:ff:ff:ff:12:40:bf:ff:ff:00:00:00:00:00:ff:ff:ff:ff\n```\n\
    \nImmediately after link/finiband is the byte hardware address for the iPoIB interface.\
    \ The first 8 bytes of the address, marked in bold, is required to make a name.\
    \ Users can make whatever scheme suits them. For example, using a device_fabric\
    \ naming convention such as mix4_ib if mix4 is connected to an ib subnet. The\
    \ only thing that is not recommended to use the standard names, like ib0 or ib1,\
    \ as these can conflict with the kernel assigned names. Next, add an entry to\
    \ the rules files. Copy the existing example in the rules file, replace the 8\
    \ bytes in the ATTR(address) entry with the 8 bytes from the device to be renamed,\
    \ and the new name to be used is the NAME field.\n\n# 13.5.3. Relaxing memlock\
    \ restrictions for users\n\nRDMA communications require that physical memory in\
    \ the computer be pinned (meaning that the kernel is not allowed to swap memory\
    \ out to a paging file in the event that the overall computer starts short on\
    \ available memory). Pinning memory is normally a very privileged operation. In"
