- img_proc: true
  md: 'The value is set to 0 by default, which disables it.


    # arp_ip_target=ip_address,ip_address_2...,ip_address_16


    Specifies the target IP address of ARP requests when the arp_interval parameter
    is enabled. Up to 16 IP addresses can be specified in a comma separated list.


    # arp_validate=value


    Validate source/distribution of ARP probes; default is none. Other valid values
    are active, backup, and all.


    # downdelay=time_in_milliseconds


    Specifies (in milliseconds) how long to wait link failure before disabling the
    link. The value must be a multiple of the value specified in the miimon parameter.
    The value is set to 0 by default, which disables it.


    # fail_over_mac=value


    Specifies whether active-backup mode should set all slaves to the same MAC address
    at enslavement (the traditional behavior), or, when enabled, perform special handling
    of the bond''s MAC address in accordance with the selected policy. Possible values
    are:


    +   * none or 0 – Default setting. This setting disables fail_over_mac, and causes
    bonding to set all slaves of an active-backup bond to the same MAC address at
    enslavement.

    * active or 1 – The “active”fail_over_mac policy indicates that the MAC address
    of the bond should always be the MAC address of the currently active slave. The
    MAC address of the slaves is not changed; instead, the MAC address of the bond
    changes during a failure.


    This policy is useful for devices that cannot ever alter their MAC, or for devices
    refusing broadcasts with their own MAC (which interferes with the ARP monitor).
    The disadvantage of this policy is that every device on the network may be updated
    by gratuitous ARP, as opposed to the normal method of switches incoming traffic
    to update their ARP tables. If the gratuitous ARP is lost, communication may be
    disrupted.


    When this is used in conjunction with the Mii monitor, devices which assert link
    up prior to being able to actually transmit and receive are particularly susceptible
    to loss of the gratuitous ARP, and an appropriatedelay setting may be required.


    +   * follow or 2 – The “follow fail_over_mac policy causes the MAC address of
    the bond to be selected normally (normally the MAC address of the first slave
    added to the bond). However, the second and subsequent slaves are not set to this
    MAC address while they are in a backup role; a slave is programmed with the bond’s
    MAC address at failover time (the formerly active slave receives the newly active
    slave’s MAC address).


    This policy is useful for multiple devices that either become confused or incur
    a performance penalty when multiple ports are programmed with the same MAC address.


    # lacp_rate=value


    Specifies the rate at which link partners should transmit LACDP packets in 802.3ad
    mode. Possible values are:


    +   * slow or 0 – Default setting. This specifies that partners should transmit
    LACPDUs every 30 seconds.'
