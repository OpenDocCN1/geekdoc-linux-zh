    ```


    where 192.168.1.1 is the IP address of the default gateway. The interface is the
    interface that is connected to, or reach, the default gateway. The dev option
    can be omitted, it is optional. Note that this setting takes precedence over a
    setting in the /etc/sysconfig/network file.


    If a route to a remote network is required, a static route can be specified as
    follows. Each line is parsed as an individual route:


    +   - 10.10.0/24 via 192.168.1.1 [dev interface]


    where 10.10.0/24 is the network address and prefix length of the remote or destination
    network. The address 192.168.1.1 is the IP address leading to the remote network.
    It is preferably the next hop address but the exit interface it will work. The
    "next hop" means the remote end of a link, a gateway or router. The dev option
    can be used to specify the exit interface, but it is not required. Add as many
    static routes as needed.


    The following is an example of a route-interface file using the ip command format.
    The default gateway is 192.168.0.1, interface enp1s0 and a leased or WAN connection
    is available for 192.168.0.10. The two static routes are for reaching the 10.10.0/24
    and 172.16.1.10/32 host:


    ```

