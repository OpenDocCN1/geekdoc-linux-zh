    # 9.2. USING THE NETWORKMANAGER COMMAND LINE TOOL, NMCLCI


    To create a bridge, named bridge-br0, issue a command as **root**.


    ```

    # nmcli connect add type bridge ifname br0

    Connection ''bridge-br0'' (6da5b6ac-98a0-4f20-c997ba7688ad) successfully added.

    ```


    If no interface name is specified, the name will default to bridge-1, bridge-2,
    and so on.


    To view the connections, issue the following command:


    ```

    $ nmcli con show

    NAME UUID TYPE DEVICE

    bridge-br0 79cfc6a3e-0310-a478-b759-bd1ac33eef8d bridge br0

    enp1s0 4dc5044a...

    ```


    Spanning tree (STP) is enabled by default. The values used are from the IEEE 802.1D-998
    standard. To use **STP** for this bridge, issue a command as **root**.'
