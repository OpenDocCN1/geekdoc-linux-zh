  md: '# 8.4. UNDERSTANDING THE NETWORK TEAM DAEMON AND THE "RUNNERS"


    The team daemon, teamd, uses libteam to control one instance of the team driver.
    This instance of the team driver creates instances of hardware device to form
    a "team" of network links. The team driver presents a network interface, team0
    for example, to other parts of the kernel. The interfaces created by instances
    of team are given names such as team0, and so forth in the documentation. This
    is for ease of understanding and other names can be used. The logic common to
    all methods of teaming is implemented by teamd; these functions are unique to
    the team load sharing and backup methods, such as round-robin and Neighbor Backup
    which are implemented by separate units of code referred to as "runners". Because
    words like "module" and "mode" already have specific meanings in relation to the
    kernel, the word "runner" was chosen to refer to units of code. The user specifies
    the runner in the JSON format configuration file and the code is compiled into
    an instance of team when the instance is created. A runner is not a plug-in because
    the code for a runner is compiled into an instance of teamd as it is being created.
    Code could be created as a plug-in for teamd should the need arise.


    The following runners are available at time of writing.


    +   - broadcast (data is transmitted over all ports)

    - round-robin (data is transmitted over all ports in turn)

    - active-backup (one port is used while others are kept as a backup)

    - loadbalance (with active Tx load balancing and BPF-based Tx selectors)

    - lacp (implements the 802.3ad Link Aggregation Control Protocol)


    In addition, the following link-writers are available:


    +   - ethtool (Libteam uses ethtool to watch for link state changes). This is
    the default if no other link-writer is specified in the configuration file.

    - arp_ping (The arp_ping utility is used to monitor the presence of a far-end
    hardware address using ARP packets.).

    - ns_ping (Neighbor Advertisements and Neighbor Solicitation from the IPv6 Neighbor
    Discovery protocol are used to monitor the presence of a neighbor''s interface)


    There are no restrictions to prevent a particular link-writer from being used
    with a particular runner, however when using the lac runner, ethtool is the only
    recommended link-writer.


    # 8.5. INSTALL THE NETWORK TEAM DAEMON


    The networking teaming daemon, teamd, is not installed by default. To install
    teamd, issue the command as root:


    ```

    #] yum install teamd

    ```


    # 8.6. CONVERTING A BOND TO A TEAM


    It is possible to convert bonding configuration files to team configuration files
    using the bond2tool. You can convert bond configuration files in ifcfg format
    to team configuration files in either ifcfg or JSON format. Note that firewall
    rules, alias interfaces, and anything that might be tied to'
