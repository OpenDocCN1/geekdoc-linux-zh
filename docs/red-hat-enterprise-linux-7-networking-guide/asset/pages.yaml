    The Service Set Identifier (SSID) of the access point (AP).


    # BSSID


    The *Basic Service Set Identifier* (BSSID) is the MAC address, also known as a
    *hardware address*, of the specific wireless access point you are connecting to
    in **Infrastructure** mode. This field is blank by default, and you are also able
    to connect to a wireless access point by **SSID** without having to specify it.
    If the BSSID is specified, it will force the system to associate to a specific
    access point only.


    For ad-hoc networks, the **BSSID** is generated randomly by the **mac80211** subsystem
    when the ad-hoc network is created. It is not displayed by **NetworkManager**


    # MAC address


    Select the MAC address, also known as a *hardware address*, of the Wi-Fi interface
    to use.


