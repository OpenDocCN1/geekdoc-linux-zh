  md: '# APPENDIX A. RED HAT CUSTOMER PORTAL LABS RELEVANT TO NETWORKING


    Red Hat Customer Portal Labs are designed to help you improve performance, troubleshoot
    issues, identify security problems, and optimize configuration. This appendix
    provides an overview of Red Hat Customer Portal Labs relevant to networking. All
    Red Hat Customer Portal Labs are available at https://access.redhat.com/labs/.


    # BRIDGE CONFIGURATION


    The Bridge Configuration is designed to configure a bridged network interface
    for applications such as KVM using Red Hat Linux 5.4 or later.


    # NETWORK BONDING HELPER


    The Network Bonding Helper allows administrators to bind multiple Network Interface
    Controllers together into a single channel using the bonding kernel module and
    the bonding network interface.


    Use the Network Bonding Helper to enable two or more network interfaces to act
    as one bonding interface.


    # PACKET CAPTURE SYNTAX GENERATOR


    The Packet capture syntax generator helps you to capture network packets.


    Use the Packet capture syntax generator to generate the tcpdump command that selects
    an interface and then prints information to the console. You need root access
    to enter the command.'
  merge: -1
