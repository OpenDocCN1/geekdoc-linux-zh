  md: '# 3.4.2. Connecting to a Network Automatically with nm-connection-editor


    You can use the GNOME nm-connection-editor application for connecting to a network
    automatically. By doing that, follow the procedure described in Section 3.4.3,
    "Common Configuration Options Using nm-connection-editor", and check the Automatically
    connect to this network when it is available check the General tab.


    # 3.4.5. Managing System-wide and Private Connection Profiles with a GUI


    NetworkManager stores all connection profiles. A profile is a named collection
    of settings that can be applied to an interface. NetworkManager stores these connection
    profiles for system-wide (system connections), as well as user connection profiles.
    Access to the connection profiles is controlled by permissions which are allowed
    by NetworkManager. See the nm-settings(5) man page for more information on the
    connection permissions property. To access a connection profile using the following
    graphical user interface tools:


    +   - the nm-connection-editor application

    - the control-center application


    # 3.4.5.1. Managing Permissions for a Connection Profile with nm-connection-editor


    To create a connection available to all users on the system, follow the procedure
    described in Section 3.4.3, "Common Configuration Options Using nm-connection-editor",
    and check the All users may connect to this network check box in the General tab.


    # 3.4.5.2. Managing Permissions for a Connection Profile with control-center


    To make a connection available to other users, follow the procedure described
    in the section called Editing an Existing Connection with control-center, and
    select the Make available to other users check box in the GNOME control-center
    Network Settings Details.


    Conversely, clear the Make available to other users check box to make the connection
    user-specific instead of system-wide.


    ![](img/6432d27ad634c9a7f868191ca63abe75_49_0.png)


    > NOTE

    Depending on the system''s policy, you may need root privileges on the system
    in order to change whether a connection is user-specific or system-wide.


    NetworkManager''s default policy is to allow all users to create and modify system-wide
    connections. Profiles that are not available at boot time will not be available
    until the user logs in. For example, if a user creates a connection profile user-em2
    with the Connect Automatically check box selected but the Make available to other
    users not selected, the connection will not be available at boot time.


    To restrict connections and networking, there are two options which can be used
    alone or in combination:


    +   - Clear the Make available to other users check box, which changes the connection
    to be modifiable and usable only by the user doing the changing.

    - Use the polkit framework to restrict permissions of general network operations
    on a per-user basis.'
