- img_proc: true
  md: '# milimon_time_in_milliseconds


    Specifies (in milliseconds) how often MII monitoring occurs. This is useful if
    high availability is required because MII is used to verify that the NIC is active.
    To verify that the driver for a particular NIC supports the MII tool, use the
    following command:


    ```

    ~# ethtool interface_name | grep "Link detected:"

    ```


    In this command, replace interface_name with the name of the device interface,
    such as enps0, not the bond interface. If Mii is supported, the command returns:


    Link detected: yes


    If using a bonded interface for high availability, the module for each NIC must
    support MII. Setting the value to 0 (the default), turns this feature off. When
    configuring this setting, a good starting point for this parameter is 100.


    ![](img/6432d27ad634c9a7f868191ca63abe75_108_0.png)


    # IMPORTANT


    It is essential that both arp_interval and arp_ip_target parameters are specified,
    alternatively, the milimon parameter is specified. Failure to do so can cause
    degradation of network performance in the event that a link fails.


    # mode=value


    Allows you to specify the bonding policy. Which can be one of:


    +   - balance-rr or 0 – Sets a round-robin policy for fault tolerance and load
    balancing. Transmissions are received and sent out sequentially on each bonded
    slave interface beginning with the first available.


    +   - active-backup or 1 – Sets an active-backup policy for fault tolerance. Transmissions
    are received and sent out through the first available bonded slave interface.
    Another bonded slave interface is used only if the active bonded slave interface
    fails.


    +   - balance-xor or 2 – Transmissions are based on the selected hash policy.
    The default is to derive a hash of the source and destination MAC addresses multiplied
    by the modulo of the number of slave interfaces. In this mode traffic for specific
    peers will always be sent over the same interface. As the destination is determined
    by the MAC addresses this method works for traffic to peers on the same local
    or network. If traffic passes through a single router then this type of traffic
    balancing will be suboptimal.


    +   - broadcast or 3 – Sets a broadcast policy for fault tolerance. All transmissions
    are sent on all slave interfaces.


    +   - 8023ad or 4 – Sets an IEEE 802.3ad dynamic link aggregation policy. Creates
    aggregation groups that share the same speed and duplex settings. Transmits and
    receives on all slaves in the active aggregator. Requires a switch that 802.3ad
    compliant.


    +   - balance-tlb or 5 – Sets a Transmit Load Balancing (TLB) policy for fault
    tolerance and load. Outgoing traffic is distributed according to the current load
    on each slave interface. Incoming traffic is received by the current slave. If
    the receiving slave fails,'
