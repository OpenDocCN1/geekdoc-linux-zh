    # 3.6. CONFIGURING IPWORKING WITH IP COMMANDS


    As a system administrator, you can configure a network interface using the ip
    command, but but changes are not persistent across reboots; when you reboot, it
    will lose any changes.


    The commands for the ip utility, sometimes referred to as iproute2 after the upstream
    package name, are documented in the ip(8) page. The package in Red Hat Enterprise
    Linux 7 is iproute. If necessary, you can check that the ip utility is installed
    by checking its version number as follows:


    ```

    $ ip -V

    ip utility, iproute2-ss130716

    ```


    The ip commands can be used to add and remove addresses and routes to interfaces
    in parallel with NetworkManager, which will preserve and recognize them in nmcli,
    nmtui, control-center, and the D-Bus API.


    To bring an interface down:


    ```

    ip link set ifname

    ```


    ![](img/6432d27ad634c9a7f868191ca63abe75_66_0.png)


    > NOTE

    The link set ifname sets a network interface in IF_UP state and enables it from
    the kernel''s scope. This is different from the ifup ifname command for inscripts
    or NetworkManager''s activation state of a device. In fact, NetworkManager always
    sets an interface up even if it is currently disconnected. Disconnecting the device
    through the nmcli tool, does not remove the IF_UP flag. In this way, NetworkManager
    gets notifications about the carrier state.


    Note that the ip utility replaces the ifconfig utility because the net-tools package
    (which provides ifconfig) does not support Infiniband addresses.


    For information about available OBJECTS, use the ip help command. For example:
    ip help and ip addr help.


    ![](img/6432d27ad634c9a7f868191ca63abe75_66_1.png)


    > NOTE

    ip commands given on the command line will not persist after a system restart.
    Where persistence is required, make use of configuration files (ifcfg file) or
    add the commands to a script.


    Examples of using the command line and configuration files for each task are included
    after nmtui and nmcli examples before explaining the use of one of the graphical
    interfaces to NetworkManager, namely, control-center and nm-connection-editor.


    The ip utility can be used to assign IP addresses to an interface with the following
    form:


    ```

    ip addr [ add | del ] address dev ifname

    ```


