  md: '# CHAPTER 9. CONFIGURE NETWORK BRIDGING


    A network bridge is a link-layer device which forwards traffic between networks
    based on MAC addresses. It makes forwarding based on a table of MAC addresses
    which it builds by listening to network traffic and learning what hosts are connected
    to each network. A software bridge can be used within a Linux host in order to
    emulate a hardware bridge, for example in virtualization applications for sharing
    a NIC with one or more virtual NICs.


    Note that a bridge cannot be established over Wi-Fi networks operating in Ad-Hoc
    or Infrastructure modes. This is due to the IEEE 802.11 standard that specifies
    the use of 3-address frames in Wi-Fi for the efficient use of airtime.


    # 9.1. CONFIGURE BRIDGING USING THE TEXT USER INTERFACE, NMTUI


    The text interface tool nmtui can be used to configure bridging in a terminal
    window. Issue the following command to start the nmtui:


    ```

    $ nmtui

    ```


    The text user interface appears. Any invalid command prints a usage message.


    To navigate, use the arrow keys or Tab to step forwards and press Shift-Tab to
    step back through the options. Press Enter to select an option. The Space bar
    toggles the status of a check box.


    +   1. From the starting menu, select Edit a connection. Select Add, the New Connection
    opens.


    ![](img/6432d27ad634c9a7f868191ca63abe75_150_0.png)


    +   2. Select Bridge, the Edit connection screen opens.'
  merge: -1
