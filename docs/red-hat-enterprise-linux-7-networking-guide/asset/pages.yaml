    # 13.4. INFINIBAND AND RDMA RELATED SOFTWARE PACKAGES


    RDMA applications are so different from Berkeley Sockets based applications, and
    from normal IP networking, most applications that are used on an IP network cannot
    be used directly on an RDMA network. Red Hat Enterprise Linux 7 comes with a number
    of different software packages for RDMA network administration, testing and debugging,
    high level software development APIs, and performance analysis.


    In order to utilize these networks, some or all of these packages need to be installed
    (this list is not exhaustive, but covers the most important packages related to
    RDMA).


    Required packages:


    +   - rdma – responsible for kernel initialization of the RDMA stack.'
