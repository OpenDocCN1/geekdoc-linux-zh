  md: '```

    acl Safe_ports 21

    acl Safe_ports 80

    acl Safe_ports 443

    ```


    By default, the configuration contains the http_access_Safe_ports which defines
    access denial to ports that are not defined in Safe_ports ACLs.


    f. Configure the cache type, the path to the cache directory, the cache size,
    and further cache-specific settings in the cache_dir parameter:


    ```

    cache_dir ufs /var/spool/squid 10000 256

    ```


    With these settings:


    +   - Squid uses the ufs cache type.

    - Squid stores its cache in the /var/spool/squid/directory.

    - The cache grows up to 10000 MB.

    - Squid creates 16 level-1 sub-directories in each /var/spool/squid/directory.

    - Squid creates 256 sub-directories in each level-1 directory.


    If you do not set a cache_dir directive, Squid stores the cache in memory.


