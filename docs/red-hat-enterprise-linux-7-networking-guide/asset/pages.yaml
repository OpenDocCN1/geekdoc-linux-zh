  md: '```

    ~} nmcli modify bridge-br0 step no

    ```


    To re-enable 802.1D STP for this bridge, issue a command as follows root:


    ```

    ~} nmcli modify bridge priority 32768

    ```


    The default bridge priority for 802.1D STP is 32768. The lower number is preferred
    in root bridge selection. For example, a bridge with priority of 28672 would be
    selected as the root bridge in preference to a bridge with priority value of 32768
    (the default). To create a bridge with a non-default value, issue a command as:


    ```

    ~$ nmcli add type bridge br5 step priority 28672

    Connection ''bridge-br5'' (86b8d3-b466-4795-aeb6-a466eb1856c7) successfully added.

    ```


    The allowed values are in the range 0 to 65535.


    To change the bridge priority of an existing bridge to a non-default value, issue
    a command in the following format:


    ```

    ~$ nmcli connect modify bridge-br5 priority 36864

    ```


    The allowed values are in the range 0 to 65535.


    To configure a bridge to forward group addresses in the range 01:80:C2:00:00:00
    to 01:80:C2:00:00:0F, change the bridge-forward-mask property. This property is
    a mask of 16 bits. Each bit corresponds to a group address in the above-mentioned
    range that must be forwarded. For example:


    ```

    ~$ nmcli connect modify bridge-br5 bridge.group-forward-mask 8

    ```


    # IMPORTANT


    ![](img/6432d27ad634c9a7f868191ca63abe75_154_0.png)


