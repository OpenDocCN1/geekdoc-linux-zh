    # 16.3 SETTING UP SQUID AS A CACHING PROXY WITH KERBEROS AUTHENTICATION


    This section describes a basic configuration of Squid as a caching proxy that
    authenticates users to an Active Directory (AD) using Kerberos. The procedure
    configures that only authenticated users can use the proxy.


    # Prerequisites


    +   The procedure assumes that the /etc/squid/squid.conf file is provided by the
    squid package. If you edited this file before, remove the file and reinstall the
    package.


    +   The server on which you want to install Squid is a member of the AD domain.
    For details, Setting up Samba as a Domain Member in the Red Hat Enterprise Linux
    7 System Administrator''s Guide.


    # Procedure'
