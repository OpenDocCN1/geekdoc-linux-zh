  md: 'To use VLANs over bonds and bridges, proceed as follows:


    +   1. Add a bond device as **root:**


    ```

    # ip link add bond0 type bond

    # ip link set bond0 type bond miimon 100 mode active-backup

    # ip link set em1 down

    # ip link set em1 master bond0

    # ip link set em2 down

    # ip link set em2 master bond0

    # ip link set bond0 up

    ```


    +   2. Set VLAN on the bond device:


    ```

    # ip link add bond0 name bond0.2 type vlan id 2

    # ip link set bond0.2 up

    ```


    +   3. Add the bridge device and attach VLAN to it:


    ```

    # ip link add br0 type bridge

    # ip link set bond0.2 master br0

    # ip link set br0 up

    ```


    # 10.7. VLAN ON BOND AND BRIDGE USING THE NETWORKMANAGER COMMAND LINE TOOL, NMCLI


    To use VLANs over bonds and bridges, proceed as follows:


    +   1. Add a bond device:


    ```

    ~$ nmcli connection add type bond con-name bond0 ifname bond0 bond.options "mode=active-backup,miimon=100"
    ipv4.method disabled ipv6.method ignore

    ```


    Note that this bond connection serves only as a "lower interface" for VLAN, and
    does not get any IP address. Therefore, the ipv4.method disabled and ipv6.method
    ignore parameters have not been added to the command line.


    +   2. Add slaves to the bond device:


    ```

    ~$ nmcli connection add type ethernet con-name Slave1 ifname em1 master bond0
    slave-type bond

    ~$ nmcli connection add type ethernet con-name Slave2 ifname em2 master bond0
    slave-type bond

    ```


    +   3. Add a bridge device:


    ```

    ~$ nmcli connection add type bridge con-name Bridge0 br0 ip4 192.0.2.1/24

    ```


    +   4. Add a VLAN interface on top of bond, enslaved to the bridge device:


    ```

    ~$ nmcli connection add type vlan con-name VLAN2 ifname bond0.2 dev bond0 id 2
    master br0 slave-type bridge

    ```'
