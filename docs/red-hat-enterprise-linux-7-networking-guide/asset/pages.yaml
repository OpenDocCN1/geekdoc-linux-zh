    # NOTE


    By default, rsyslog and netconsole.service use port 514. To use a different port,
    change the line in /etc/rsyslog.conf to the required port number:


    ```

    $UDPServerRun <PORT>

    ```


    On the sending machine, uncomment and edit the following line in the /etc/sysconfig/netconsole
    file:


    ```

    SYSLOGPORT=514

    ```


    For more information about netconsole configuration and troubleshooting tips,
    see Netconsole Kernel Documentation.


    # 1.6. USING NETWORK KERNEL TUNABLES WITH SYSCTL


    Using certain kernel tunables through the sysctl utility, you can adjust network
    configuration on a running system and affect the networking performance.


    To change network settings, use the sysctl commands. For permanent changes that
    persist across system restarts, add the to the /etc/sysctl.conf file.


    To display a list of all available sysctl parameters, enter as root:


    ```

    ~# sysctl -a

    ```


    For details on network kernel tunables using sysctl, see the Using PTP with Multiple
    Interfaces in the System Administrator''s Guide.


    For more information on network kernel tunables, see the Network Interface Tunables
    section in the Kernel Administration Guide.


    # 1.7. MANAGING DATA USING THE NCAT UTILITY


    The ncat utility replaces netcat in Red Hat Enterprise Linux 7. ncat is a back-end
    tool that provides connectivity to other applications and users. It reads and
    writes data from the network from the command line, and uses Transmission Control
    Protocol (TCP), User Data Protocol (UDP), Stream Transmission Control Protocol
    (SCTP) or sockets for communication. ncat can deal with both IPv4 and IPv6, connections,
    sends packets, port scanning, and supports higher-level features as SSL, and connection
    broker.


    The nc command can also be entered as ncat, using the identical options. For more
    information about the ncat options, see the New networking utility (ncat) section
    in the Migration Planning Guide and the ncat(1) man page.


    ![](img/6432d27ad634c9a7f868191ca63abe75_14_0.png)'
