    # 3.8. ENABLING MULTICAST WITH IGMP


    The Internet Group Management Protocol (IGMP) enables the administrator to manage
    routing and subscription to multicast traffic between networks, hosts, and routers.
    The kernel in Red Hat Linux supports IGMPv3.


    To display multicast information, use the ip maddr show subcommand, for example:


    ```

    ~$ ip maddr show dev br0

    8: 224.0.0.1

    inet6 ff02::

    inet6 ff01::

    [output truncated]

    ```


    Alternatively, look for the MULTICAST string in the ip link show command output,
    for example:


    ```

    ~$ ip link show br0

    8: <BROAD,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state UP DEFAULT qlen
    1000

    link/ether 6c:0b:84:67:fe:63 brd ff:ff:ff:ff:ff:ff

    ```


    To disable multicast and check that it is disabled on the br0 device:


    ```

    ~# ip link set multicast dev br0

    ~$ ip link show br0

    8: <BROAD,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state UP DEFAULT qlen
    1000

    link/ether 6c:0b:84:67:fe:63 brd ff:ff:ff:ff:ff:ff

    ```


    The missing MULTICAST string indicates that multicast is disabled.


    To enable multicast on the br0 device and check if it is enabled:


    ```

    ~# ip link set multicast dev br0

    ~$ ip link show br0

    ```'
