    # Configuring the Mobile Broadband Tab


    If you have already added a new mobile connection using the assistant (see the
    section called “Adding a New Mobile Broadband Connection” for instructions), you
    can edit the Mobile tab to disable roaming if home network is not available, assign
    a network ID, or instruct NetworkManager to prefer a certain technology (such
    as 3G or 2G) when using the connection.


    # Number


    The number that is dialed to establish a PPP connection with the GSM-mobile broadband
    network. This field may be automatically populated during the initial installation
    of the broadband device. You can easily leave this field blank and enter the APN.


    # Username


    Enter the user name to authenticate with the network. Some providers do not provide
    a user name, or accept any user name when connecting to the network.


    # Password


    Enter the password used to authenticate with the network. Some providers do not
    provide a password, or accept any password.


    # APN


    Enter the Access Point Name (APN) used to establish a connection with the GSM-based
    network. Entering the correct APN for a connection is important because it often
    determines:


    +   - how the user is billed for your network usage;

    - whether the user has access to the Internet, an intranet, or a subnet.


    # Network ID


    Entering a Network ID causes NetworkManager to force the device to register only
    to a specific network. This can be used to ensure the connection does not roam
    when it is not possible to control roaming directly.


    # Type


    Any – The default value of Any leaves the modem to select the fastest network.'
