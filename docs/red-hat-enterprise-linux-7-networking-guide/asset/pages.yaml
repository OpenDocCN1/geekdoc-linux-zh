    # Aliases names


    the human-readable names which are translated to properties internally. The most
    common are:


    +   type (the connection.type property)


    ```

    nmcli c add type bond

    ```


    +   ifname (the connection.interface-name property)


    ```

    nmcli c add ifname enp1s0

    ```


    +   con-name (the connection.id property)


    ```

    nmcli c add con-name "My Connection"

    ```


    In previous versions of nmcli, to create a connection required the **aliases**,
    **ifname** enp1s0 and **con-name** My Connection. A command in the following format
    could be used:


    ```

    nmcli c add type ethernet ifname enp1s0 con-name "My Connection"

    ```


    In more recent versions, both the **property names** and the **aliases** can be
    used interchangeably. The following examples are all valid and equivalent:


    ```

    nmcli c type ethernet ifname enp1s0 con-name "My Connection" ethernet.mtu 1600

    ```


    ```

    nmcli c add connection.type ethernet ifname enp1s0 con-name "My Connection" ethernet.mtu
    1600

    ```


    ```

    nmcli c add connection.type ethernet connection.interface-name enp1s0 connection.id
    "My Connection" ethernet.mtu 1600

    ```


    The arguments differ according to connection types. Only the **type** argument
    is mandatory for all connection types except **bond**, **team**, **bridge** and
    **vlan**.


    # type type_name


    connection type. For example:


    ```

    nmcli c add type bond

    ```'
