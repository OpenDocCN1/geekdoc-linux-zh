  md: '# Table 15.3. Commonly Used Configuration Options


    | Option | Description |

    | --- | --- |

    | allow-query | Specifies which hosts are allowed to query the nameserver for
    authoritative resource records. It accepts an access control list, a collection
    of IP addresses, or networks in the CIDR notation. All hosts are allowed by default.
    |

    | allow-query-cache | Specifies which hosts are allowed to query the nameserver
    for non-authoritative data as recursive queries. Only localhost and localnets
    are allowed by default. |

    | blackhole | Specifies which hosts are not allowed to query the nameserver. This
    option should be used when a particular host or network floods the server with
    requests. The default option is none. |

    | directory | Specifies a working directory for the named service. The default
    option is /var/named/. |

    | disable-empty-zone | Used to disable one or more zones from the list of default
    prefixes that would be used. Can be specified in the options statement and also
    in view statements. |

    | dnssec-enable | Specifies whether to return DNSSEC related resource records.
    The default option is yes. |

    | dnssec-validation | Specifies whether to prove that resource records are authentic
    through DNSSEC. The default option is yes. |

    | empty-zones-enable | Controls whether or not empty zones are created. Can be
    specified only in the options statement. |

    | forwarders | Specifies a list of valid IP addresses for nameservers to which
    the requests should be forwarded for resolution. |

    | forward | Specifies the behavior of the forwarders directive. It accepts the
    following options |

    | listen-on | Specifies the IPv4 network interface on which to listen for queries.
    On dns server that also acts as a gateway, you can use this option to answer queries
    originating from a single network only. All IPv4 interfaces are used by default.
    |'
