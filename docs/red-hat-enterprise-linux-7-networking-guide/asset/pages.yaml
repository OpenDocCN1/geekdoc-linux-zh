- img_proc: true
  md: 'The lease database is recreated from time to time so that it is not too large.
    First, all leases are saved in a temporary database. The dhcp.leases file is named
    dhcp.leases~ and the temporary lease database is written to dhcp.leases.


    The DHCP daemon could be killed or the system could crash after the lease database
    has been renamed to the backup file before it has been written. If the dhcp.leases
    file does not exist, it is required to start the service. Do not create a new
    lease file. If you do, all old leases are lost which causes many problems. The
    correct solution is to rename the dhcp.leases~ backup file to dhcp.leases and
    then start the daemon.


    # 14.2.3. Starting and Stopping the Server


    # IMPORTANT


    ![](img/6432d27ad634c9a7f868191ca63abe75_226_0.png)


    When the DHCP server is started for the first time, it fails unless the dhcp.leases
    file exists. You can use the command `touch /var/lib/dhcp/dhcp.leases` to create
    the file if it does not exist. If the same server is also running BIND as a DNS
    server, this step is not necessary, as the named server automatically checks for
    a dhcp.leases file.


    Do not create a new lease file on a system that was previously running. If you
    do, all old leases are lost which causes many problems. The correct solution is
    to rename the dhcp.leases~ backup file to dhcp.leases and then start the daemon.


    To start the DHCP service, use the following command:


    ```

    systemctl start dhcpd.service

    ```


    To stop the DHCP server, type:


    ```

    systemctl stop dhcpd.service

    ```


    By default, the DHCP service does not start at boot time, for information on how
    to configure the daemon to start automatically at boot time, see Red Hat Enterprise
    Linux System Administrator''s Guide.


    If more than one network interface is attached to the system, the DHCP server
    should only listen for DHCP requests on one of the interfaces, configure the dhcpd
    server to listen only on that interface for which it has a subnet declaration
    in the /etc/dhcp/dhcpd.conf file.


    This is useful for a firewall with two network cards. One network card can be
    configured as a DHCP client to retrieve an IP address from the Internet. The other
    network card can be used as a DHCP server for the internal network behind the
    firewall. Specifying which network card connected to the the system more secure
    because users cannot connect to the daemon through the Internet.


    To specify command-line options, and then edit the dhcpd.service file as the root
    user. For example, as:


    ```

    ~# cp /usr/lib/systemd/system/dhcpd.service /etc/systemd/system/

    ~# vi /etc/systemd/system/dhcpd.service

    ```


    Edit the line under section [Service]:'
