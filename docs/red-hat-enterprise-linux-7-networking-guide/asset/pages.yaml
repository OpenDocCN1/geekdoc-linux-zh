  md: "# Networking Guide\n\nEstablishing a Virtual Private Network (VPN) enables\
    \ communication between your Local Area Network (LAN), and another, remote LAN.\
    \ This is done by setting up a tunnel across an intermediate network such as the\
    \ Internet. The VPN tunnel that is set up typically authentication and encryption.\
    \ After successfully establishing a VPN connection using a secure tunnel, a VPN\
    \ router or gateway performs the following actions upon the packets you transmit:\n\
    \n+   1. it adds an Authentication Header for routing and authentication purposes;\n\
    2. it encrypts the packet data; and;\n3. it encloses the data in packets around\
    \ the Encapsulating Security Payload (ESP) protocol, which constitutes the decryption\
    \ and handling instructions.\n\nThe receiving VPN router strips the header information,\
    \ decrypts the data, and routes it to its intended destination (either a workstation\
    \ or other node on a network). Using a network-to-network connection, the receiving\
    \ node on the local network receives the packets already decrypted and ready for\
    \ processing. The encryption and decryption process in a network-to-network VPN\
    \ connection is therefore transparent to clients.\n\nBecause it employs several\
    \ layers of authentication and encryption, VPNs are a secure and effective means\
    \ of connecting multiple remote nodes as a unified intranet.\n\n# Adding a New\
    \ IPsec VPN Connection\nProcedure\n\n+   1. Press the Super key to enter the Activities\
    \ Overview, type Settings and press Enter. Then, select the Network menu entry\
    \ and the Network settings tools appears, see the section called \"Configuring\
    \ New Connections with control-center\".\n2. Click the plus button in the VPN\
    \ entry.\n3. The Add VPN window appears. For manually configuration, select IPsec\
    \ based VPN.\n\n| Add VPN |\n| --- |\n| IPsec based VPN \n| IPsec based VPN using\
    \ IKEv1 |\n| Import from file... |\n\nFigure 3.14. Configuring VPN on IPsec mode\n\
    \n+   4. In the Identity configuration form, you can specify the fields in the\
    \ General and Advanced sections:"
