  md: 'A bond is created using the bonding kernel module and a special network interface
    called a channel bonding interface.


    # 7.4.1. Check if Bonding Kernel Module is Installed


    In Red Hat Enterprise Linux 7, the bonding module is not loaded by default. You
    can load the module by issuing the following command as root:


    ```

    ~# modprobe --first-time bonding

    ```


    This activation will not persist across system restarts. See the Red Hat Enterprise
    Linux Kernel Administration Guide for an explanation of persistent bonding module.
    Note that a correct configuration file using the BONDING_OPTS directive, the bonding
    module will be loaded as required and therefore does not need to be loaded separately.


    To display information about the module, issue the following command:


    ```

    ~$ modinfo bonding

    ```


    See the modprobe(8) man page for more command options.


    # 7.4.2. Create a Channel Bonding Interface


    To create a channel interface, create a file in the /etc/sysconfig/network-scripts/
    directory called ifcfg-bondN, replacing N with the number for the interface, such
    as 0.


    The contents of the file can be based on a configuration file for whatever type
    of interface is getting bonded, such as an Ethernet interface. The essential differences
    are that the DEVICE directive is bondN, replacing N with the number for the interface,
    and TYPE=Bond. In addition, set BONDING_MASTER=yes.


    > Example 7.1. Example ifcfg-bond0 Interface Configuration File


    An example of a channel bonding interface.


    ```

    DEVICE=bond0

    NAME=bond0

    TYPE=Bond

    BONDING_MASTER=yes

    IPADDR=192.168.1.1

    PREFIX=24

    ONBOOT=yes

    BOOTPROTO=none

    BONDING_OPTS="bonding parameters separated by spaces"

    NM_CONTROLLED="no"

    ```


    The NATIVE directive is useful for naming the connection profile in NetworkManager.
    ONBOOT whether the profile should be started when booting (or more generally,
    when auto-connecting a device).'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# IMPORTANT


    The `max_bonds` parameter is not interface specific and should not be set when
    using ifcfg-bondN files with the `BONDING_OPTS` directive as this will cause the
    network scripts to create the bond interfaces as required.


    For further instructions and advice on configuring the bonding module and to view
    the list of bonding parameters, see [Section 7.7, "Using Channel Bonding"]


    # 7.4.3. Creating SLAVE Interfaces


    The channel bonding is the "master" and the interfaces that are bonded are referred
    to as the "slaves". After the channel bonding interface is created, the network
    interfaces to be bonded together must be configured by adding the MASTER and SLAVE
    directives to the configuration files of the slaves. The configuration files for
    each of the slaves can be nearly identical.


    # Example 7.2. Example Slave Interface Configuration File


    For example, if two Ethernet interfaces are channel bonded, `enp1s0` and `enp2s0`,
    they can both look like the following example:


    ```

    DEVICE=device_name

    NAME=bond0-slave

    TYPE=Ethernet

    BOOTPROTO=none

    ONBOOT=yes

    MASTER=bond0

    SLAVE=yes

    NM_CONTROLLED="no"

    ```


    In this example, replace device_name with the name of the interface. Note that
    if more than one one profile or configuration file exists with `ONBOOT=yes` for
    an interface, they may race with each other and a plain `TYPE=Ethernet` profile
    may be activated instead of a bond slave.


    > NOTE


    # 7.4.4. Activating a Channel Bond


    To activate a bond, open all the slaves. As root, issue the following commands:'
