- img_proc: true
  md: '# CHAPTER 11. CONSISTENT NETWORK DEVICE NAMING


    Red Hat Enterprise Linux provides methods for consistent and predictable network
    device naming for network interfaces. These features change the name of network
    interfaces on a system in order to make locating and differentiating the interfaces
    easier.


    Traditionally, network interfaces in Linux are enumerated as eth[0123...s0], but
    these names do not necessarily correspond to actual labels on the chassis. Modern
    server platforms with multiple adapters can encounter non-deterministic and counter-intuitive
    naming of these interfaces. This affects both network adapters deboard on the
    motherboard (Lan-on-Motherboard, or LOM) and add-in (single and multiport) adapters.


    In Red Hat Enterprise Linux, udev supports a number of different naming schemes.
    The default is to assign names based on firmware, topology and location information.
    This has the advantage that names are fully automatic, fully predictable, that
    they stay even if hardware is added or removed (no re-enumeration takes place),
    and that broken hardware can be replaced seamlessly. The disadvantage is that
    they are harder to find than the eth or was traditionally used. For example: enp5s0.


    > WARNING

    Do not disable consistent network device naming because it allows the system using
    ethX style names, where X is a unique number corresponding to a specific interface
    and may have different names of network interfaces during the boot process. For
    more details, seee Section 11.10, "Troubleshooting Network Device Naming".


    # 11.1. NAMING SCHEMES HIERARCHY


    By default, systemd will name interfaces using the following policy to apply the
    supported naming schemes:


    +   - Scheme 1: Names incorporating Firmware or BIOS provided index numbers for
    on-board devices (example: en01), are applied if that information from the firmware
    or BIOS is applicable and available, falling back to scheme 2.

    - Scheme 2: Names incorporating Firmware or BIOS provided PCI hotplug slot index
    numbers (example: ens1) are applied if that information from the firmware or BIOS
    is applicable and available, falling back to scheme 3.

    - Scheme 3: Names incorporating physical location of the connector of the hardware
    (example: enp2s0), are applied if applicable, falling directly back to scheme
    5 in all other cases.

    - Scheme 4: Names incorporating interface''s MAC address (example: enx7e8d1ea46da),
    is not used by default, but is available if the user chooses.

    - Scheme 5: The traditional unpredictable kernel naming scheme, is used if all
    other methods fail (example: enp1s0).


    This policy, the procedure outlined above, is the default. If the system biosdevname
    is enabled, it will be used. Note that enabling biosdevname requires passing biosdevname=1
    as a kernel-line parameter, except in the case of a Dell system, biosdevname is
    used by default as long as it'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Networking Guide


    is installed. If the user has used udev rules which change the name of the kernel
    devices, those rules will take precedence.


    # 11.2. UNDERSTANDING THE DEVICE RENAMING PROCEDURE


    The device procedure in detail is as follows:


    +   A rule in /usr/lib/udev/rules/60-net.rules instructs the udev helper utility,
    /lib/udev/rename_device, to look into /etc/sysconfig/network-scripts/ifcfg-suffix
    files. If there is an ifcfg entry matching the HWADDR MAC address of interface
    it renames the interface to the name given by the UDEV device.


    +   A rule in /usr/lib/udev/rules/71-biosdevname.rules instructs biosdevname to
    rename the interface according to its naming policy, provided that it was not
    renamed in a previous step, biosdevname is installed, and biosdevname=0 was not
    a kernel command on the boot command line.


    +   A rule in /usr/lib/udev/rules/75-net-description.rules instructs udev to fill
    in the terminal udev device property values ID_NAME_ONBOARD, ID_NET_NAME_SLOT,
    ID_NAME_PATH, ID_NAME_MAC by examining the network interface device. Note, some
    properties might be undefined.


    +   A rule in /usr/lib/udev/rules/80-net-name-slot.rules instructs udev to rename
    the interface, provided that it was not renamed in step 1 or 2, and the kernel
    parameter net.ifnames=0 with the following priority: ID_NET_NAME_ONBOARD, ID_NET_NAME_SLOT,
    ID_NET_NAME_PATH. It falls through to the list in last, if one is unset. If any
    of these are set, the interface will not be renamed.


    Steps 3 and 4 are implementing the naming schemes 1, 2, 3, and optionally 4, described
    in Section 11.1, "Naming Schemes Hierarchy". Step 2 is explained in detail in
    Section 11.6, "Consistent Network Naming using biosdevname".


    # 11.3. UNDERSTANDING THE PREDICTABLE NETWORK INTERFACE DEVICE NAMES


    The names have two-character prefixes based on the type of interface:


    +   * en for Ethernet,


    +   * wl for wireless LAN (WLAN),


    +   * ww for wireless wide area network (WWAN).


    The names have the following types:


    o<index>


    on-slot[f<function>][d<dev_id>]


    hotplug slot index number. All multi-function PCI devices will carry the [f<function>]
    number in the device name, including the function 0 device.


    x<MAC>


    MAC address


    176'
