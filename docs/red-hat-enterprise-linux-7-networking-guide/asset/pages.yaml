    # 13.8. CONFIGURING IPOIB


    # 13.8.1. Understanding the role of IPoIB


    As mentioned in Section 1.1, "Comparing IP to non-IP Networks", most networks
    are IP networks. Infiniband is not. The role of IPoIB is to provide an IP network
    emulation layer on top of InfininiBand RDMA networks. This allows communications
    to run over InfininiBand networks unmodified. The performance of these applications
    is considerably lower than if the applications were written to RDMA communication
    natively. Since InfininiBand has some set of applications that must get all of
    the performance they can out of the network, and then other applications for which
    a degraded rate of performance is acceptable if it is then that the application
    does not need to be modified using RDMA communications, IPoIB is there to allow
    less critical applications to run on the network as they need.


    Because iWARP and RoCE/IB networks are all IP networks with RDMA layered on top
    of their IP layer, they have no need of IPoIB. As a result, the kernel will create
    any IPoIB devices on top of iWARP or RoCE/IBE devices.


    # 13.8.2. Understanding IPoIB communication modes


    IPoIB devices can be configured to run in either datagram or connected mode. The
    difference is in what type of queue pair the IPOver layer attempts to open with
    the machine at the other end of the communication. For datagram mode, an unreliable,
    disconnected queue pair is opened. For connected mode, a reliable, connected queue
    pair is paired.


    When using datagram mode, the unreliable, disconnected queue pair does not allow
    any packets larger than the InfininiBand link-layer MTU. The IPOver layer adds
    a 4 byte IPOver header on top of the packet being sent. As a result, the IPoIB
    MTU must be 4 bytes than the InfininiBand link-layer MTU. Since 2048 is a common
    InfininiBand link-layer MTU, the common IPoIB device MTU in datagram mode is 2044.


    When using connected mode, the reliable, connected queue pair type allows messages
    that are larger than the InfininiBand link-layer MTU and the host handles packet
    segmentation and reassembly at each end. As a result, there is no size limit on
    the size of IPoIB messages that can be sent by the Infiniband adapters in connected
    mode. However an IP packet only has a 16 bit size, and is therefore limited to
    65535 as the maximum byte count. The allowed MTU is actually smaller than that
    because we account for all TCP/IP headers that must also fit in that size. As
    a result, the IPoIB MTU in connected mode is capped at 65520 in order to make
    sure there is sufficient room for all needed headers


    The connected mode option generally has higher performance, but it also consumes
    more kernel memory. Because most systems care more about performance than consumption,
    connected mode is the most commonly used mode.


    However, if a system is configured for connected mode, it must still send multicast
    traffic in datagram'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'mode (the InfinBand switches and fabric cannot pass multicast in connected
    mode) and it will also fall back to datagram mode when communicating with hosts
    not configured for connection. Administrators should be aware that if they intend
    to run programs that send multicast, and those try to send multicast up to the
    maximum MTU on the interface, then it is necessary to configure the interface
    for datagram operation or find some way to configure the application to carry
    their packet size a size that will fit in datagram packets.


    # 13.3. Understanding IPoBand hardware addresses


    IPoB devices have a 20 byte address. The deprecated utility ifconfig is unable
    to read all 20 bytes and should not be used to try and find the correct address
    for an IPoB device. Its ip from the package work property.


    The first 4 bytes of the IPoIB address are flags and the queue pair number. The
    next 8 bytes are the prefix. When the IPoIB device is configured, it will have
    the default prefix of 0xfe80:0000:00:00:00:00. The device will use the default
    prefix until it connects to the subnet, at point it will reset the subnet prefix
    to match the subnet it has connected. The final 8 bytes are the GUID address of
    the InfinBand part that the IPoIB device is attached to. Because the first 4 bytes
    and the next 8 bytes can change from time to time, they are not matched or against
    when specifying the hardware address for an IPoIB interface. See Section 13.5.2,"Usage
    of 70-prefix-infinib-ipoib" explains how to derive the address by leaving the
    first 12 bytes out of the ATTR) field in the udev files so that device matching
    will work. When configuring the HWADDR field of the configuration file can contain
    all 20 bytes, but only the last 8 are actually used to match and find the hardware
    specified by a configuration file. However, if the TYPE=InfinBand entry is not
    correctly specified in the configuration and if ibutils is not the actual script
    used to open the IPoB interface, an error about the system being unable to find
    the hardware specified by the configuration will be issued. For IB interfaces,
    the TYPE= field of the configuration must be either InfinBand or infiniband (the
    entry is case sensitive, but will accept these two spellings);


    # 13.4. Understanding InfinBand P_Key subnets


    An InfinBand fabric can be segmented into virtual subnets by the use of different
    P_Key subnets. This is highly unusual to VLANs on Ethernet interfaces. All switches
    and hosts must be a member of the P_Key subnet, but administrators can create
    additional limits and members of these subnets to the subsets of hosts in the
    fabric. See Section 13.6.4,"Creating a P_Key definition" for information on how
    to define a P_Key using the subnet manager. Once a P_Key has been created, we
    can create additional IPoIB configuration files specifically for each P_Key subnet.
    Unlike VLAN interfaces on Ethernet devices, each interface will behave as though
    they share the same link but have different P_Key values.


    There are special requirements for the names of IPoB P_Key interfaces. All IPoIB
    Keys range from 0x0000 to 7ffff, and the high bit 8000 denotes that a P_Key is
    full membership instead of partial membership. The Linux kernel''s driver only
    supports full membership in P_Key subnets, so for any subnet that Linux can connect
    to, the high bit of the P_Key will always be set. That means that if a Linux client
    creates P_Key 0002, the actual P_Key once joined will be 0x8002, that we are full
    members of P_Key 0x002. For this reason, when creating a P_Key definition in an
    opensm.conf file as depicted in section 13.6.4,"Creating a P_Key definition,"
    it is required to specify a P_Key value without 8000, but when defining the P_Key
    IPoB interfaces on the Linux clients, add the 0x8000 value to the base P_Key.


