  md: '# CHAPTER 8. CONFIGURE NETWORK TEAMING


    Please see the teamd.conf(5) man page for more information.


    # 8.13.8. Configure Port Selection Override


    The physical port which transmits a frame is normally selected by the kernel part
    of the team driver, and is not relevant to the user or system administrator. The
    outlet port is selected by the policies of the selected team mode (teamd runner).
    On occasion, it is helpful to direct certain classes of outgoing traffic to certain
    particular interfaces to implement slightly more complex policies. By default
    the team driver initializes 16 queues are created when the driver initializes.
    If less or more queues are required, the Netlink interface tx_queues can be used
    to change this value during the team instance creation.


    The queue ID for a port can be set by the port configuration option queue_id as
    follows:


    ```

    { queue_id": 3 }

    ```


    These queue ID''s can be used in conjunction with the tc utility to configure
    a multiplex queue discipline and bias traffic transmitted to certain port devices.
    For example, if using the above configuration and wanting to force all traffic
    bound to 192.168.1.100 to enp0 of the team as its output device, use commands
    as in the following format:


    ```

    # tc qdisc add dev team0 handle 1 root

    # tc filter add dev dev team0 protocol ip prio 1 u32 match ip dst \

    192.168.1.100 action skbedev mapping_3

    ```


    This mechanism of overriding runner selection logic in order to bind traffic to
    a specific port can be used with all runners.


    # 8.13.9. Configure BPF-based Port Selectors


    The loadbalance and LACP runners uses hashes of packets to sort network traffic.
    The hash computation method is based on the Berkeley Packet Filter (BPF) code.
    The BPF code is used to generate a hash rather than make a policy decision for
    outgoing packets. The hash length is 8 bits giving 256 variants. This means many
    different sockets (SKB) can have the same hash and therefore pass over the same
    link. The use of a short hash is a quick way to sort traffic into different streams
    for the purposes of load balancing multiple clients. In static mode, the hash
    is only used to decide out of port the traffic should be sent. In active mode,
    the runner will continually rehash to different ports in an attempt to reach a
    perfect balance.


    The following types or strings can be used for packet tc hash computation:


    +   - eth - Uses source and destination MAC addresses.

    - vlan - Uses VLAN ID.

    - ipv4 - Uses source and destination IPv4 addresses.

    - ipv6 - Uses source and destination IPv6 addresses.

    - ip - Uses source and destination IPv4 and IPv6 addresses.

    - l3 - Uses source and destination IPv4 and IPv6 addresses.

    - tcp - Uses source and destination TCP ports.


    141'
