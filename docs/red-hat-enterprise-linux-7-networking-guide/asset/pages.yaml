    IGMP traffic over the newly selected slave.


    # updelay=time_in_milliseconds


    Specifies (in milliseconds) how long to wait before enabling a link. The value
    must be a multiple of the

    value specified in miimon parameter. The value is set to 0 by default, which disables
    it.


    # use_carriers=number


    Specifies whether or not miimon uses MII/ETHOOL ioctls or netif_carrier_ok() to

    determine the link state. The netif_carrier_ok() relies on the device driver to
    maintain its

    state with netif_carrier_on/off; most device drivers support this function.


    The MII/ETHTOOL ioctls utilizes a duplicate calling sequence within the kernel.
    This is

    still configurable in case your device driver does not support netif_carrier_on/off.


    Valid values:


    +   - 1 – Default setting. Enables the use of netif_carrier_ok().

    - 0 – Enables the use of MII/ETHTOOL ioctls.


    ![](img/6432d27ad634c9a7f868191ca63abe75_110_0.png)


    > NOTE

    If the bonding interface sets the link is up when it should not be, it is possible

    at your network device driver does not support netif_carrier_on/off.


    # xmit_hash_policy=value


    Selects the transmit hash policy for slave selection in balance-xor and 802.3ad
    modes. Possible

    values are:


    +   - 0 or layer2 – Default setting. This parameter uses the XOR of hardware MAC
    addresses to

    generate the hash. The formula is:

    - 1 or layer3+4 – Uses layer protocol information (when available) to generate
    the hash.

    This allows for traffic to a particular network peer to span multiple slaves,
    although a single

    connection will not span multiple slaves.


    ```

    (source_MAC_address XOR destination_MAC) MODULO slave_count

    ```


    This algorithm will place all traffic to a particular network peer on the same
    slave, and is

    802.3ad compliant.


    The formula for unfragmented TCP and UDP packets is used:


    ```

    source_port XOR dest_port) XOR

    (source_IP XOR dest_ip) AND 0xffff)

    MODULO slave_count

    ```


    For fragmented TCP or UDP packets and all non-IP protocol traffic, the source
    and

    destination information is omitted. For non-IP traffic, the formula is the same
    as the

    layer2 transmit hash policy.'
