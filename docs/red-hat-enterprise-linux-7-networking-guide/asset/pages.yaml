  md: '# # CHAPTER 1. OVERVIEW OF NETWORKING TOPICS


    # ## 1.1. COMPARING IP TO NON-IP NETWORKS


    Network is a system of interconnected devices that can communicate sharing information
    and resources, such as files, printers, applications, and Internet connection.
    Each of these devices has a unique Internet Protocol (IP) address to send and
    receive messages between two or more devices using a set of rules called protocol.


    # Categories of Network Communication


    # IP Networks


    Networks that communicate through Internet Protocol addresses. An IP network is
    implemented in the Internet and most internal networks. Ethernet, Cable Modems,
    DSL Modems, dial up modems, wireless networks, and VPN connections are typical
    examples.


    # non-IP Networks


    Networks that are used to communicate through a lower layer rather than the transport
    layer. Note that these networks are rarely used. Infiniband is a non-IP network,
    described in Chapter 13, Configure InfininiBand and RDMA Networks.


    # ## 1.2. COMPARING STATIC TO DYNAMIC ADDRESSING


    # Static IP addressing


    When a device is assigned a static IP address, the address does not change over
    time unless manually. It is recommended to use static IP addressing if you want:


    +   - To ensure network address consistency for servers like DNS, and authentication
    servers.

    - To use out-of-band management devices that work independently of other network
    infrastructure.


    All the configuration tools listed in Section 3.1, "Selecting Network Configuration
    Methods" allow assigning IP addresses. The nmcli tool is also available, described
    in Section 3.3.8, "Adding and Configuring a Static Ethernet Connection with nmcli".


    For more information on automated configuration and management, see the OpenCLI
    chapter in the Red Hat Enterprise Linux 7 Administrators Guide. The Red Hat Enterprise
    Linux 7 Installation Guide documents the use of a Kickstart file which can also
    be used for automating the assignment of networks.


    # Dynamic IP addressing


    When a device is assigned a dynamic IP address, the address changes over time.
    For this reason, it is recommended for devices that connect to the network occasionally
    because IP address might be changed after rebooting the machine.


    IP addresses are more flexible, easier to set up and administer. The dynamic host
    control protocol (DHCP) is a traditional method of dynamically assigning configuration
    to hosts. See Section 14.1, "Why Use DHCP?" for more information. You can also
    use the nmcli tool, described in Section 3.3.7, "Adding and Configuring a Dynamic
    Ethernet Connection with nmcli".'
  merge: -1
