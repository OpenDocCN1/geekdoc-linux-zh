    \ a logically-secure network through port-based authentication.\n\n802.1X provides\
    \ a framework for WLAN and LAN access control and serves as an envelope for carrying\
    \ one of the Extensible Authentication Protocol (EAP) types. An EAP type is a\
    \ protocol that defines how security is achieved on the network.\n\n# 5.2.1. Configuring\
    \ 802.1X Security for Wi-Fi with nmcli\n\nProcedure"
