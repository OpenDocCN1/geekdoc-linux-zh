    # 15.2.3.4.2. A reverse resolution zone file


    A reverse resolution zone file is used to translate an IP address in a particular
    namespace into a fully qualified domain name (FQDN). It looks very similar to
    a standard zone file, except that the PTR resource records are used to link the
    IP addresses to a fully qualified domain name as shown in Example 15.16, "A reverse
    resolution zone file".


    Example 15.16. A reverse name resolution zone file


    ```

    $ORIGIN 10.0.1.10-addr.pa.

    @ TTL 86400

    @ IN SOA dns1.example.com. hostmaster.example.com. (

    200162501 ; serial

    21600 ; refresh after 6 hours

    3600 ; retry after 1 hour

    604800 ; expire after 1 week

    86400 ; minimum TTL of 1 day)

    ;

    @ IN NS dns1.example.com.

    1 IN PTR dns1.example.com.

    2 IN PTR dns2.example.com.


    5 IN PTR server1.example.com.

    6 IN PTR server2.example.com.

    ```'
