  md: '# NOTE


    If you have installed the bind-chroot package, the BIND service will run in the
    chroot environment. In that case, the initialization script will mount the above
    configuration files using the mount --bind command, so that you can manage the
    configuration outside this environment. There is no need to copy anything into
    the /var/named/chroot/ directory because it is mounted automatically. This simplifies
    maintenance since you do not need to take any special care of BIND configuration
    files if it is in a chroot environment. You can organize your environment as you
    would with BIND not running in a chroot environment.


    The following directories are automatically mounted into the /var/named/chroot/
    directory if the corresponding mount point directories underneath /var/named/chroot/
    are empty:


    +   * /etc/named

    * /etc/pkl/dnsssec-keys

    * /run/named

    * /var/named

    * /usr/lib64/bind or /usr/lib/bind (architecture dependent).


    The following files are also mounted if the target file does not exist in /var/named/chroot:


    +   * /etc/named.conf

    * /etc/rndc.conf

    * /etc/rndc.key

    * /etc/named.rfc1912.zones

    * /etc/named.dnsssec.keys

    * /etc/named.lscldv.key

    * /etc/named.root.key


    # IMPORTANT


    Editing files which have been mounted in a chroot environment requires creating
    a backup copy and then editing the original file. Alternatively, use an editor
    with "edit-a-copy" mode disabled. For example, to edit the BIND''s configuration
    file, /etc/named.conf, with Vim while it is running in a chroot environment, issue
    the command as root:


    ```

    ~# vim -c "set backupcopy=yes" /etc/named.conf

    ```


    # 15.2.2.1. Installing BIND in a chroot environment


    To install BIND to run in a chroot environment, issue the command as root:


    ```

    ~# yum install bind-chroot

    ```'
