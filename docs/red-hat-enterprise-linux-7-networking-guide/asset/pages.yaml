  md: '# # CHAPTER 4. CONFIGURING STATIC ROUTES AND THE DEFAULT GATEWAY


    This chapter covers the configuration of static routes and the default gateway.


    # ## 4.1. INTRODUCTION TO UNDERSTANDING ROUTING AND GATEWAY


    Routing is a mechanism that allows you to find the network path to another system.
    Routing is often handled by the device dedicated to routing (although any device
    can be configured to perform routing). Therefore it is often not necessary to
    configure static routes on Red Hat Linux servers or clients. Exceptions include
    traffic that must pass through an encrypted VPN tunnel or traffic that should
    take a specific route for reasons of cost or security. A host’s routing table
    will be automatically populated with routes to directly connected networks. The
    routes examine when the network interfaces are “up”. In order to reach a remote
    network or host, the system is given the address of a gateway to which traffic
    should be


    When a host is configured with DHCP, an address of a gateway that leads to an
    upstream network or the internet is assigned. This gateway is usually referred
    as the default gateway if no better route is known to the system (and in the routing
    table). Network administrators use either the first or last IP address in the
    network itself as the gateway address; for example, 192.168.10.1 or 192.168.10.254.
    Not to be confused by the address which represents the network itself; in this
    example, 192.168.10.0, or the subnet’s broadcast address; in this example 192.168.10.255.
    The default gateway is traditionally a network router. The default gateway is
    for any and all traffic which is not destined for the local network and where
    no preferred route is specified in the routing table.


    ![](img/6432d27ad634c9a7f868191ca63abe75_70_0.png)


    To expand your experience, you might also be interested in the Red Hat System
    Administration I (RH124) training course.


    # ## 4.2. CONFIGURING STATIC ROUTES USING NMCLI


    To configure static routes using the nmcli tool, use one of the following:


    +   - the nmcli command line

    - the nmcli interactive editor


    Example 4.1. Configuring Static Routes Using nmcli


    To configure a static route for an Ethernet connection using the command line:


    ```

    ~]# nmcli connection modify ens33 +ipv4.routes "192.168.122.0/24 via 10.10.10.1"

    ```


    This will direct traffic for the 192.168.122.0/24 subnet to the gateway at 10.10.10.1


    Example 4.2. Configuring Static Routes with nmcli Editor


    To configure a static route for an Ethernet connection using the interactive editor:


    ```

    ~$ nmcli con edit ens3

    ```'
