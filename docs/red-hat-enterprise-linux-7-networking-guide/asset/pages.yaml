  md: "# CHAPTER 4. CONFIGURING STATIC ROUTES AND THE DEFAULT GATEWAY\n\nIf the default\
    \ gateway is already assigned by DHCP and if the same gateway with the same metric\
    \ is specified in a configuration file, an error during starting-up, or when bringing\
    \ up an interface, occurs. The follow error message may be shown: \"RTNETLINK\
    \ answers: File exists\". This error may be ignored.\n\n# Static Routes using\
    \ the Network/netmask Directives Format\n\nYou can also use the network/netmask\
    \ directives format for route-interface files. The following is a template for\
    \ the network/netmask format, with instructions following afterwards:\n\n```\n\
    ADDRESS0=10.10.10.0\nNETMASK0=255.255.255.0\nGATEWAY0=192.168.1.1\n```\n\n+  \
    \ - NETMASK0=255.255.255.0 is the netmask for the network address defined with\n\
    \  ADDRESS0=10.10.10.0\n- GATEWAY0=192.168.1.1 is the default gateway, or an IP\
    \ address that can be used to reach\n  ADDRESS0=10.10.10.0\n\nThe following is\
    \ an example of a route-interface file using the network/netmask directives format.\
    \ The default gateway is 192.168.0.1 but line or WAN connection is available at\
    \ 192.168.0.10. The two static routes are for reaching the 10.10.10.0/24 and 172.16.1.0/24\
    \ networks:\n\n```\nADDRESS0=10.10.10.0\nNETMASK0=255.255.255.0\nGATEWAY0=192.168.0.10\n\
    ADDRESS1=172.16.1.10\nNETMASK1=255.255.255.0\nGATEWAY1=192.168.0.10\n```\n\nSubsequent\
    \ routes must be numbered sequentially, and must not skip any values. For example,\n\
    ADDRESS, ADDRESS1, ADDRESS2, and so on.\nBy default, forwarding packets from one\
    \ interface to another, or of the same interface, is disabled for security reasons.\
    \ If you need the system to route external traffic, such as sharing a connection\
    \ or configuring a VPN server, you will need to enable IP forwarding. See the\
    \ Red Hat Linux Security Guide for more details.\n\n# 4.5.1 Understanding Policy-routing\n\
    \nPolicy-routing also known as source-routing, is a mechanism for more flexible\
    \ routing configurations. Routing decisions are commonly made based on the destination\
    \ IP address of a package. Policy-routing allows flexibility to select routes\
    \ based on other routing properties, such as IP address, source port, protocol\
    \ type. Routing tables store information about networks. They are identified by\
    \ numeric values or names, which can be configured in the /etc/route2/routes table.\
    \ The default table is identified by 254. Using policy-routing, you also need\
    \ rules. Rules are used to select a routing table, based on certain properties\
    \ of packets.\n\nFor inscripts, the routing table is a property of the route that\
    \ can be configured through the table argument. The ip route format can be used\
    \ to define an existing policy-based routing configuration, which specifies multiple\
    \ routing tables:"
  merge: -1
  pgno: 74
- img_proc: true
  md: '10.10.10.0/24 via 192.168.0.10 table 1

    10.10.10.0/24 via 192.168.0.10 table 2


    To specify routing rules in interfaces, edit them to edit the /etc/sysconfig/network-scripts/rule-enp1s0
    for IPv4 or to the /etc/sysconfig/network-scripts/rule6-enp1s0 for IPv6.


    NetworkManager supports policy-routing, but rules are not supported yet. The rules
    must be configured by the user running a custom script. For each manual static
    route, a routing table can be selected:


    +   - ipv4.route-table for IPv4

    and

    - ipv6.route-table for IPv6.


    By setting routes to a particular table, all routes from DHCP, autoconf, DHCP6
    are placed in that specific table. In addition, all routes for subnets that have
    already configured addresses, are placed in the corresponding routing table. For
    example, if you configure 192.168.1.10/24 address, the 192.168.1.0/24 subnet is
    contained in ipv4.route-table.


    For more details about policy-routing rules, see the ip-rule(8) man page. For
    routing tables, see the ip-route(8) man page.


    # 4.6. CONFIGURING THE DEFAULT GATEWAY


    The default gateway is determined by the network scripts which parse the /etc/sysconfig/network
    file first and then the network interface ifcfg files for interfaces that are
    “up”. The ifcfg files are parsed in numerically ascending order, and the last
    GATEWAY directive to be read is used to compose a default route in the routing
    table.


    You can specify the default route using the GATEWAY directive, either globally
    or in interface-specific configuration files. However, in Red Enterprise Linux
    the use of the global /etc/sysconfig/network is deprecated, and specifying the
    gateway should only be done in per-interface configuration files.


    In dynamic network environments, where mobile hosts are managed by NetworkManager,
    gateway information is likely to be interface specific and is best left be assigned
    by DHCP. In special cases where it is necessary to influence NetworkManager’s
    selection of the exit interface to be reach a gateway, make use of DEFROUTE=no
    command in the ifcfg files for interfaces which do not lead to the default gateway.'
