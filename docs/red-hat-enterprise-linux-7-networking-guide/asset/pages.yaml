  md: 'The word vlan plus the VLAN ID. For example: vlan0005


    # VLAN plus the VLAN ID without padding


    The word vlan plus the VLAN ID without padding by means of additional leading
    zeros. For example: vlan5


    # Device name plus VLAN ID


    The name of the parent interface plus the VLAN ID. For example: enp1s005


    # Device name plus VLAN ID without padding


    The name of the parent interface plus the VLAN ID without padding by means of
    additional leading zeros. For example: enp1s0


    # 11.6. CONSTRAINT NETWORK DEVICE NAMING USING BIOSDEVN


    This feature, implemented through the biosdevname udev utility, will change the
    name of all embedded network interfaces, PCI card network interfaces, and virtual
    function network interfaces from the existing eth[0123...] to the new naming convention
    as shown in Table 11.2, "The biosdevname N Convention". Note that if the system
    is a Dell, or biosdevname is explicitly enabled as described in Section 11.6.2,
    "Enabling and Disabling the Feature", the system naming scheme will take precedence.


    Table 11.2. The biosdevname Naming Convention


    | Device | Old Name | New Name |

    |---|---|--|

    | Embedded network interface (LOM) | eth[0123...] | em[1234...][a] |

    | PCI card network interface | eth[0123...] | p<slot>-p<ethernet port>[b] |

    | Virtual function | eth[0123...] | p<slot>-p<ethernet port>_<virtual interface>[c]
    |


    +   [a] New enumeration starts at 1.

    [b] For example: p3p4

    [c] For example: p3p4_1


    # 11.6.1. System Requirements


    The biosdevname program uses information from the system''s BIOS, specifically
    the type 9 (System Slot) and type 41 (Embedded Extended Information) fields contained
    within the SMBIOS. If the system''s BIOS does not have SMBIOS version 2.6 or higher
    this data, the new naming convention will not be used. Most older hardware does
    not support this feature because of a lack of BIOSes with the correct SMBIOS version
    and field information. For BIOS or SMBIOS information, contact your hardware vendor.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'For this feature to take effect, the biosdevname package must also be installed.
    To install it, issue the following command as **root**:


    ```

    ~# yum install biosdevname

    ```


    # 11.6.2. Enabling and Disabling the Feature


    To disable this feature, pass the following option on the boot command line, both
    during and after installation:


    ```

    biosdevname=0

    ```


    To enable this feature, pass the following option on the boot command line, both
    during and after installation:


    ```

    biosdevname=1

    ```


    Unless the system meets the minimum requirements, this option will be ignored
    and the system will use the **systemd** naming scheme as described in the beginning
    of the chapter.


    If the **biosdevname** option is installed, it must remain as a boot option for
    the lifetime of the system.


    # 11.7. NOTES FOR ADMINISTRATORS


    Many system customization files include network interface names, and thus will
    require updates if moving a system from the old convention to the new convention.
    If you use the new naming convention, you will also need to update network interface
    names in areas such as custom **iptables** rules, scripts altering **irqbalance**,
    and other similar configuration files. Also, enabling this for installation will
    require modification to **kickstart** files that use device names through the
    **ksdevice** parameter; these **kickstart** files will need to be updated to use
    the device''s MAC address or the network''s new name.


    > NOTE

    The maximum interface name length is defined by the kernel headers and a global
    limit, affecting all applications.


    ![](img/6432d27ad634c9a7f868191ca63abe75_182_0.png)


    # 11.8. CONTROLLING THE SELECTION OF NETWORK DEVICE NAMES


    Device naming can be controlled in the following manner:


    **By identifying the network interface device**


    Setting the MAC address in an **ifcfg** file using the **HWADDR** directive enables
    it to be identified by **udev**. The name will be taken from the string given
    by the **DEVICE** directive, which by convention is the same as the **ifcfg**
    suffix. For example, **ifcfg-enp0**.


    **By turning on or offbiosdevname**


    The name provided by **biosdevname** will be used (if **biosdevname** can determine
    one).


    **By turning on or off the systemd-udev naming scheme**'
