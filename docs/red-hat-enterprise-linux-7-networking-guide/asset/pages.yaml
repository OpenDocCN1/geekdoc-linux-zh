    | control-center | A graphical user interface provided by the GNOME Shell for
    desktop users. It incorporates a Network settings tool. To start it, press the
    **Super** key to enter the Activities Overview, typeNetwork and press **Enter**.
    The Network settings opens. |

    | network connection icon | A graphical user interface provided by the GNOME Shell
    representing network connection states as reported by NetworkManager. The icon
    has multiple states that serve as visual indicators for the type of connection
    you are currently using. |


    # 2.6. USING NETWORKMANAGER WITH NETWORK SCRIPTS'
