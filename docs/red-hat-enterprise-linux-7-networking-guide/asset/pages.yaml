    \ # 16 bytes hexadecimal\n  mka_ckn=2233... # 32 bytes hexadecimal\n}\n```\n\n\
    Use the values from the previous step to complete the mka_cak and mka_ckn lines\
    \ in the wpa_supplicant.conf configuration file.\n\nSee the wpa_supplicant.conf(5)\
