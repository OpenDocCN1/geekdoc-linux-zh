    # 15.2. Using the dig Utility


    The dig utility is a command-line tool that allows you to perform DNS lookups
    and debug nameserver configuration. Its typical usage is as follows:


    ```

    dig [@server] [option...] name type

    ```


    See Section 15.2.3.2, "Common Resource Records" for a list of common values to
    use for type.


    # 15.2.1. Looking Up a Nameserver


    To look up a nameserver for a particular domain, use the command in the following
    form:


    ```

    dig name NS

    ```


