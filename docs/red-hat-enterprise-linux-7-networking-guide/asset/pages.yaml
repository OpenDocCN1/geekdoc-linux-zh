  md: '# id


    An identification string assigned by the user to a connection profile. Id can
    be used in nmcli commands to identify a connection. The NAME field in the command
    output always denotes the connection id. It refers to the same connection profile
    name that the con-name does.


    # uuid


    A unique identification string assigned by the system to a connection profile.
    The uuid can be used in nmcli connection to identify a connection.


    # 3.3.4. Using the nmcli Interactive Connection Editor


    The nmcli tool has an interactive connection editor. To use it:


    ```

    ~ nmcli con edit

    ```


    You will be prompted to enter a connection type from the list displayed. After
    entering a connection type you will be placed at the nmcli prompt. If you are
    familiar with the connection types you can add a valid connection type using the
    nmcli con edit command and be taken straight to the nmcli prompt. The format is
    as follows for editing an existing connection profile:


    ```

    nmcli con edit [id | uuid | path] ID

    ```


    For editing a new connection profile:


    ```

    nmcli con edit [type new-connection-type] [con-name new-connection-name]

    ```


    Type help atcli prompt to see a list of valid commands. Use the describe command
    to get a description of settings and their properties:


    ```

    describe setting.property

    ```


    For example:


    ```

    nmcli> describe team.config

    ```


    # 3.3.5. Creating and Modifying a Connection Profile with nmcli


    A connection profile contains the connection property information needed to connect
    to a data source.


    To create a new profile for NetworkManager using nmcli:


    ```

