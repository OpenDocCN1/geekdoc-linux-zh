    # 14.4.1. Host Configuration


    Before making any changes, back up the existing /etc/sysconfig/dhcpd and /etc/dhcp/dhcpd.conf
    files.


    # Configuring a Single System for Multiple Networks


    The following /etc/dhcp/dhcpd.conf example creates two subnets, and configures
    an IP address for the same system, depending on which network it connects to:


    ```

    default-lease-time 600;

    max-lease-time 7200;

    subnet 10.0.0.0 mask 255.255.255.0 {

    option option-subnet-mask 255.255.255.0;

    option routers 10.0.0.1;

    range 10.0.0.5 10.0.0.15;

    }

    subnet 172.16.0.0 mask 255.255.255.0 {

    option option-subnet-mask 255.255.255.0;

    option routers 172.16.0.1;

    range 172.16.0.5 172.16.0.15;

    }

    host example0 {

    hardware ethernet 00:1A:6B:6A:2E:0B;

    fixed-address 10.0.0.20;

    }

    host example1 {

    hardware ethernet 00:1A:6B:6A:2E:0B;

    fixed-address 172.16.0.20;

    }

    ```


    host example0


    The host declaration defines specific parameters for a single system, such as
    an IP address. To configure specific parameters for multiple hosts, use multiple
    host declarations.

    Most DHCP clients ignore the name in host declarations, and as this name can be
    anything, as long as it is unique to other host declarations. To configure the
    same system for multiple networks, use a different name for each host declaration,
    otherwise the DHCP daemon fails to start. Systems are identified by the hardware
    ethernet option, not the name in the host declaration.


    hardware ethernet 00:1A:6B:6A:2E:0B;

    The hardware ethernet option identifies the system. To find this address, run
    the ip link command.


    fixed-address 10.0.0.20;'
