  md: 'If disk logging fails or using the serial console is not possible, you might
    need to use kernel debugging. The netconsole kernel module enables you to log
    messages to another computer over the network.


    To be able to use netconsole, you need to have an rsyslog server that is properly
    configured on your network.


    # Procedure 1.1. Configuring rsyslog server for netconsole


    +   1. Configure the rsyslog daemon to listen on the 514/udp port and receive
    messages from the network by uncommenting the following lines in the MODULES section
    of the /etc/rsyslog.conf file:


    ```

    $ModLoad impud

    $UDPServerRun 514

    ```


    +   2. Restart the rsyslog service for the changes to take effect:


    ```

    # systemctl restart rsyslog

    ```


    +   3. Verify that rsyslog is listening on the 514/udp port:


    ```

    # netstat -l | grep syslog

    udp 0 0.0.0.0:syslog 0.0.0.0:*

    udp6 0 [::]:syslog [::]*

    ```


    The 0.0.0.0:syslog and [::]:syslog values in the netstat -l output mean that rsyslog
    is listening on default netconsole port defined in the /etc/services file:


    ```

    $ cat /etc/services | grep syslog

    syslog 514/udp      # Reliable Syslog Service

    syslog-conn 601/tcp      # Reliable Syslog Service

    syslog-conn 601/udp      # Syslog over TLS

    syslog-tls 6514/tcp      # Syslog over TLS

    syslog-tls 6514/dccp     # Syslog over TLS

    ```


    Netconsole is configured using the /etc/sysconfig/netconsole file, which is a
    part of the inisits package. This package is installed by default and it also
    provides the netconsole service.


    If you want to configure a sending machine, follow this procedure:


    # Procedure 1.2. Configuring a SYSLOGADDR


    +   1. Set the value of the SYSLOGADDR variable in the /etc/sysconfig/netconsole
    file to match the IP address of the rsyslog server. For example:


    ```

    SYSLOGADDR=192.168.0.1

    ```


    +   2. Restart the netconsole service for the changes to take effect:


    ```

    # systemctl restart netconsole.service

    ```


    +   3. Enable netconsole.service to run after rebooting the system:'
