    to **nmcli**.


    # 10.4. CONFIGURE 802.1Q VLAN TAGGING USING THE COMMAND LINE


    In Red Hat Enterprise Linux, the **8021q** module is loaded by default. If necessary,
    you can make sure the module is loaded by issuing the following command as *root*:


    ```

    ~ modprobe --first-time 8021q

    modprobe: ERROR: could not insert ''8021q'': Module already in kernel

    ```


    To display information about the module, issue the following command:


    ```

    ~ modinfo 8021q

    ```


    See the **modprobe(8)** man page for more command options.


    # 10.4.1. Setting Up 802.1Q VLAN Tagging using ifcfg files


    +   1. Configure the parent interface in `/etc/sysconfig/network-scripts/ifcfg-device_name`,
    where `device_name` is the name of the interface:


    ```

    DEVICE=interface_name

    TYPE=Ethernet

    BOOTPROTO=none

    ONBOOT=yes

    ```


    +   2. Configure the VLAN interface configuration in the `/etc/sysconfig/network-scripts/`
    directory. The configuration file name should be the parent interface plus a .character
    the VLAN ID. For example, if the VLAN ID is 192, and the parent interface is ens1s0,
    then the configuration file name should be `ifcfg-ens1s0.192:`:


    ```

    DEVICE=ens1s0.192

    BOOTPROTO=none

    ONBOOT=yes

    IPADDR=192.168.1.1

    PREFIX=24

    NETWORK=192.168.1.0

    VLAN=yes

    ```'
