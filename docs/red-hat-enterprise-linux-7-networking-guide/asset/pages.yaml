    # 9.3. USING THE COMMAND LINE INTERFACE (CLI)


    # 9.3.1. Check if Bridging Kernel Module is Installed


    In Red Hat Linux 7, the bridging module is loaded by default. If necessary, you
    can make sure the module is loaded by issuing the following command as root:


    ```

    # modprobe --first-time bridge

    modprobe: ERROR: could not insert ''bridge'': Module already in kernel

    ```


    To display information about the module, issue the following command:


    ```

    $ modinfo bridge

    ```


    See the modprobe(8) man page for more command options.


    # 9.3.2. Create a Network Bridge


    To create a network bridge, create a file in the /etc/sysconfig/network-scripts/
    directory called ifcfg-brN, replacing N with the number for the interface, such
    as 0.


    The contents of the file is similar to whatever type of interface is getting bridged
    to, such as an Ethernet interface. The differences in this example are as follows:


    +   - The DEVICE directive gives an interface name as its argument in the format
    brN, where N is replaced with the number of the interface.


    +   - The TYPE directive gives an argument Bridge. This directive determines the
    device type and the argument is case sensitive.


    +   - The bridge interface configuration file is given an IP address where the
    physical interface configuration file must only have a MAC address (see below).'
  merge: -1
  pgno: 155
- img_proc: true
  md: '+   • An extra directive, DELAY=0, is added to the bridge while it monitors
    traffic, where hosts are located, and builds a table of MAC addresses on which
    to base its filtering decisions. The default delay of 15 is not needed if no routing
    loops are possible.


    # Example 9.1. Example ifcfg-br0 Interface Configuration File


    The following is an example of a bridge interface configuration file using a static
    IP address:


    ```

    DEVICE=br0

    TYPE=Bridge

    IPADDR=192.168.1.1

    PREFIX=24

    BOOTPROTO=none

    ONBOOT=yes

    DELAY=0

    ```


    The bridge anchor another interface is created, or an existing interface is modified,
    and pointed to the bridge interface.


    # Example 9.2. Example ifcfg-enp1s0 Interface Configuration File


    The following is an example of an Ethernet interface configuration file pointing
    to a bridge interface. Configure your physical interface in /etc/sysconfig/network-scripts/ifcfg-device_name,
    where device_name is the name of the interface


    ```

    DEVICE=device_br0

    TYPE=Ethernet

    HWADDR=AA:BB:CC:DD:EE:FF

    BOOTPROTO=none

    ONBOOT=yes

    BRIDGE=br0

    ```


    Optionally specify a name using the NAME directive. If no name is specified, the
    NetworkManager plug-in, ifcfg-br0, will create a name for the connection profile
    in the form “Type Interface”. In this example, NAME=bridge-br0 added to the ifcfg-br0
    file connection profile will be named bridge-br0.


    # NOTE


    For the DEVICE device, almost any interface could be used as it does not determine
    the device type. TYPE=Ethernet is not strictly required. If the TYPE directive
    is not set, the device is treated as an Ethernet device (unless its name explicitly
    matches a different interface configuration file).


    The directives are case sensitive.


    Specifying the hardware or MAC address using the HWADDR directive will influence
    the device naming procedure as explained in Chapter 11, Consistent Network Device
    Naming.'
