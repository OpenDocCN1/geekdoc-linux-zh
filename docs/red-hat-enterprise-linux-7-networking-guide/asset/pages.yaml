    \    \"em1\": {\n      \"prio\": -10,\n      \"sticky\": true\n    },\n    \"\
    em2\": {\n      \"prio\": 100\n    }\n  }\n}\n```\n\nTo configure the interval\
    \ between sending NS/NA packets, add or edit a section as follows:\n\n```\n\"\
    link_watch\": {\n  \"name\": \"nsna_ping\",\n  \"interval\": 200\n}\n```\n\nValue\
    \ is positive number in milliseconds. It should be chosen in conjunction with\
    \ the **missed_max** option in order to determine the total time before a link\
    \ is reported as down.\n\nTo configure the maximum number of missed NS/NA reply\
    \ packets to allow before reporting the link as down, add or edit a section as\
    \ follows:\n\n```\n\"link_watch\": {\n  \"name\": \"nsna_ping\",\n  \"missed_max\"\
    : 15\n}\n```\n\nMaximum number of missed NS/NA reply packets. If this number is\
    \ exceeded, the **missed_max** option is a limit value of the maximum allowed\
    \ number of missed replies (ARP replies for example). It should be chosen in conjunction\
    \ with the **interval** option in order to determine the total time before a link\
    \ is reported as down.\n\nTo configure the host name that is resolved to the **IPv6**\
    \ address target address for the NS/NA packets, add or edit a section as follows:\n\
    \n```\n\"link_watch\": {\n  \"name\": \"nsna_ping\",\n  \"target_host\": \"MyStorage\"\
    \n}\n```\n\nThe **target_host** option contains the host name to be converted\
