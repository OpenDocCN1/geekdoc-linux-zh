  md: '# 3.4.9. Configuring a Mobile Broadband Connection with a GUI


    You can use NetworkManager''s mobile broadband connection abilities to connect
    to the following 2G and 3G services:


    +   - 2G – GPRS (General Packet Service), EDGE (Enhanced Data Rates for GSM Evolution),
    or CDMA (Code Division Multiple Access)

    - 3G – UMTS (Universal Mobile Telecommunications System), HSPA (High Speed Packet
    Connection), or EVDO (EVDOData-Only).


    Your computer must have a mobile broadband (modem), which the system has discovered
    and recognized, in order to create the connection. Such a device may be built
    into your computer (as is the case on many notebooks and netbooks), or may be
    provided as internal or external hardware. Examples include pc card, USB Modem
    or dongle, or cellular phone device acting as a modem.


    # 3.4.9.1. Configuring a Mobile Broadband Connection with nm-connection-editor


    You can configure a mobile broadband connection using the GNOME nm-connection-editor.


    Adding a New Mobile Broadband Connection


    +   1. Enter nm-connection-editor in a terminal. The Network Connections window
    appears, see Section 3.4.3, "Common Configuration Options Using nm-connection-editor".

    2. Click the plus button. The Choose a Connection Type menu opens.

    3. Select the Mobile Broadband menu entry.

    4. Click Create to set up a Mobile Broadband Connection for this mobile broadband
    device, choose the 2G- or 3G-capable device you want to use with the connection.
    If the drop-down menu is inactive, this indicates that the system was unable to
    detect a device capable of mobile broadband. In this case, click Cancel, ensure
    that you do have a mobile broadband-capable device attached and recognized by
    the computer and then retry this procedure. Click the button.

    5. Select the country where your provider is located from the list and click the
    Continue button.

    6. Select your provider from the list or enter it manually. Click the Continue
    button.

    7. Select your payment plan from the drop-down menu and confirm the Access Point
    Name (APN) is correct. Click the Continue button.


    Procedure'
