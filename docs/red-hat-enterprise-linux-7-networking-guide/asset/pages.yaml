    # 7.8.1. Configuring the Bond Tab


    If you have already added a new bond connection (see [Procedure 7.1](#71), "Adding
    a New Bond Connection_Using nm-connection-editor"] for instructions), you can
    edit the Bond tab to set the load sharing mode and the type of link monitoring
    to detect failures of a slave connection.


    # Mode


    The mode that is used to share traffic over the slave connections that make up
    the bond. The default is Round-robin. Other load sharing modes, such as 802.3ad,
    can be selected by the drop-down list.


    # Link Monitoring


    The method of monitoring the slaves ability to carry network traffic.


    The following modes of load sharing are selectable from the Mode drop-down list:


    # Round-robin


    Sets a round-robin policy for fault tolerance and load balancing. Transmissions
    are sent out sequentially on each bonded slave interface beginning with the first
    available. This mode might not work behind a bridge with virtual machines without
    additional switch configuration.


    # Active backup'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Sets an active-backup policy for fault tolerance. Transmissions are received
    and sent out through the first available bonded slave interface. Another bonded
    slave interface is used only if the active bonded slave interface fails. Note
    that this is the only mode available for InfiniBand devices.


    # XOR


    Sets an XOR (exclusive-or) policy. Transmissions are based on the selected hash
    policy. The default is to derive a hash by XOR of the source and destination MAC
    addresses multiplied by the number of slave interfaces. If mode traffic for specific
    peers will always be sent over the same interface. As the destination is determined
    by the MAC addresses this method works best for traffic to peers on the same link
    or local network. If traffic passes through a single router then this mode of
    traffic balancing will be suboptimal.


    # Broadcast


    Sets a broadcast policy for fault tolerance. All transmissions are sent on all
    slave interfaces. This method might not work a bridge with virtual machines without
    additional switch configuration.


    # 802.3ad


    Sets an IEEE **802.3ad** dynamic link aggregation policy. Creates aggregation
    groups that share the same speed and duplex settings. Transmits and receives on
    all slaves in the active aggregator. Requires a network switch that is **802.3ad**
    compliant.


    # Adaptive transmit load balancing


    Sets an adaptive Load Balancing (TLB) policy for fault tolerance and load balancing.
    The outgoing traffic is distributed according the current load on each slave interface.
    Incoming traffic is received by the current slave. If the receiving slave fails,
    another slave takes over the MAC address of the failed slave interface. This mode
    is only suitable for local addresses known to the kernel bonding module and cannot
    be used a bridge with virtual machines.


    # Adaptive load balancing


    Sets an Adaptive Load Balancing (AL) policy for fault tolerance and load balancing.
    Includes transmit and receive load balancing for IPv4 traffic. Receive load balancing
    is achieved through ARP negotiation. This mode is only suitable for local addresses
    known to the kernel bonding module and cannot be used a bridge with virtual machines.


    The following types of link monitoring can be selected from the **Link Monitoring**
    drop-down list. It is a good idea to test which bonding module parameters work
    best for your bonded interfaces.


    # MII (Media Independent Interface)


    The state of the carrier wave of the interface is monitored. This can be done
    by querying the driver, by querying MII registers, or using **ethtool** to query
    the device. Three options are available:


    # Monitoring Frequency


    The time interval, in milliseconds, between querying the driver or MII registers.


    # Link up delay


    The time in milliseconds before attempting to use a link that has been reported
    as up. This delay can be used if some gratuitous ARP requests are lost in the
    period immediately following the link being reported as “up”. This can happen
    during switch initialization for-example.


    # Link down delay'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'The time in milliseconds to wait before changing to another link when a previously
    active link has reported as "down". This delay can be used if an attached switch
    takes a relatively long time to change to backup mode.


    # ARP


    The address resolution protocol (ARP) is used to probe one or more peers to determine
    how well the link-layer connections are working. It is dependent on the device
    driver providing the transmit start time and the last receive time.


    Two options are available:


    # Monitoring Frequency


    The time interval, in milliseconds, between sending ARP requests.


    # ARP targets


    Comma separated list of IP addresses to send ARP requests to.


