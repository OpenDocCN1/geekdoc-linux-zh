  md: '# CHAPTER 5. CONFIGURING NETWORK CONNECTION SETTINGS


    This chapter describes various configurations of the network connection settings
    and shows how to configure them by using NetworkManager.


    # 5.1. CONFIGURING 802.3 LINK SETTINGS


    You can configure the 802.3 link settings of an Ethernet connection by modifying
    the following configuration parameters:


    +   - 802-3-ethernet.auto-negotiate

    - 802-3-ethernet.speed

    - 802-3-ethernet.duplex


    You can configure the 802.3 link settings to three main modes:


    +   - Ignore link negotiation

    - Enforce auto-negotiation activation

    - Manually set the speed and duplex link settings


    # Ignoring link negotiation


    In this case, NetworkManager ignores link configuration for an ethernet connection,
    keeping the already configuration on the device.


    To ignore link negotiation, set the following parameters:


    ```

    802-3-ethernet.auto-negotiate = no

    802-3-ethernet.speed = 0

    802-3-ethernet.duplex = NULL

    ```


    ![](img/6432d27ad634c9a7f868191ca63abe75_76_0.png)


    # IMPORTANT


    If the auto-negotiate parameter is set to no, but the speed and duplex values
    are set, that does not mean that auto-negotiation is disabled.


    # Enforcing auto-negotiation activation


    In this case, NetworkManager enforces auto-negotiation on a device.


    To enforce auto-negotiation activation, set the following options:


    ```

    802-3-ethernet.auto-negotiate = yes

    802-3-ethernet.speed = 0

    802-3-ethernet.duplex = NULL

    ```


    # Manually setting the link speed and duplex


    In this case, you can manually configure the speed and duplex settings on the
    link.


    To manually set the speed and duplex link settings, set the aforementioned parameters
    as follows:'
  merge: -1
  pgno: 76
- img_proc: true
  md: '```

    802-3-ethernet.auto-negotiate = no

    802-3-ethernet.speed = [speed in Mbit/s]

    802-3-ethernet.duplex = [half|full]]

    ```


    # IMPORTANT


    Make sure to set both the speed and the duplex values, otherwise NetworkManager
    does not update the link configuration.


    As a system administrator, you can configure 802.3 link settings using one of
    the following options:


    +   - the nmcli tool

    - the nm-connection-editor utility


    # Configuring 802.3 Link Settings with the nmcli Tool

    Procedure


    +   1. Create a new ethernet connection for the enp10 device.

    2. Set the 802.3 link setting to a configuration of your choice. For details,
    see Section 5.1, "Configuring 802.3 Link Settings"


    For example, to manually set the speed option 100 Mbit/s and duplex to full:


    # Configuring 802.3 Link Settings with the nm-connection-editor

    Procedure


    +   1. Enter nm-connection-editor in a terminal.

    2. Select the connection you want to edit and click the gear wheel icon to move
    to the editing dialog. See Section 3.4.3, "Common Configuration Options Using
    nm-connection-editor" for more information.

    3. Select the link negotiation of your choice.


    +   - Ignore: link configuration is skipped (default).

    - Automatic: link auto-negotiation is enforced on the device.

    - Manual: the Speed and Duplex options can be specified to enforce the link negotiation.'
  merge: -1
  pgno: 77
