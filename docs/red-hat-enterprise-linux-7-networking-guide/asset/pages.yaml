  md: '# Networking Guide


    > WARNING

    If you are configuring bridging on a remote host, and you are connected to that
    host over the physical NIC you are configuring, consider the implications of losing
    connectivity before proceeding. You will lose connectivity when restarting the
    service and may not be able to regain connectivity if any errors have been made.
    Console, or out-of-band access is advised.


    To open the new or recently configured interfaces, issue a command as **root**
    in the following format:


    +   - ifup device


    This command will detect if **NetworkManager** is running and call **nmcli con
    load UUID** and then call **nmcli con up UUID**.


    Alternatively, to reload all interfaces, issue the following command as **root**:


    ```

    ~# systemctl restart network

    ```


    This command will stop the network service, start the network service, and then
    call **ifup** for all ifcfg files with **ONBOOT=yes**.


    > NOTE

    The default behavior is for NetworkManager not to be aware of changes to ifcfg
    files and to continue using the old configuration data until the interface is
    next brought up. This is set by the **monitor-connection-files** option in the
    **NetworkManager.conf** file. See the **NetworkManager.conf(5)** manual page for
    more information.


    # 9.3.3. Network Bridge with Bond


    An example of a network bridge formed from two or more Ethernet interfaces will
    now be given as this is another common application in a virtualization environment.
    If you are not familiar with the configuration files for bonded interfaces, [Section
    7.4.2, "Create a Channel Bonding Interface"]


    Create or edit two or more Ethernet interface configuration files, which are to
    be bonded, as follows:


    ```

    DEVICE=interface_name

    TYPE=Ethernet

    SLAVE=yes

    MASTER=bond0

    BOOTPROTO=none

    HWADDR=AA:BB:CC:DD:EE:FF

    ```


    > NOTE

    Using **interface_name** as the interface name is common practice but almost any
    name could be used.'
