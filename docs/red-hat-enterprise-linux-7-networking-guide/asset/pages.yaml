    ```


    # 15.2.4.3. Reloading the Configuration and Zones


    To reload both the configuration file and zones, type the following at a shell
    prompt:


    ```

    ~# rndc reload

    server reload successful

    ```


    This will reload the while while keeping all previously cached responses, so that
    you can make changes

    to the zone files without losing all stored name resolutions.


    To reload a single zone, specify its name after the reload command, for example:


    ```

    ~# rndc reload localhost

    zone reload up-to-date

    ```


    Finally, to reload the configuration file and newly added zones only, type:


    ```

    ~# rndc reconfig

    ```'
