    # Configuring TLS Settings


    With Transport Layer Security (TLS), the client and server mutually authenticate
    using the TLS protocol. The server demonstrates that it holds a digital certificate,
    the client proves its own identity using the client-side certificate, and key
    information is exchanged. Once authentication is complete, the TLS tunnel is no
    longer used. Instead, the client and server use the exchanged keys to encrypt
    data using AES, TKIP or WEP.


    The fact that certificates must be distributed to all clients who need to authenticate
    means that the EAP-TLS authentication method is very strong, but also more complicated
    to set up. Using TLS security rules avoids the overhead of a public key infrastructure
    (PKI) to manage certificates. The benefit of TLS security is that a compromised
    password does not allow access to the (W)LAN; an intruder must also have access
    to the client''s private key.


    NetworkManager does not determine the version of TLS supported by the daemon.
    NetworkManager gathers the parameters entered by the user and passes them to wpa_supplicant,
    which handles the configuration. In turn it uses OpenSSL to establish the TLS
    tunnel. wpa_supplicant itself negotiates the SSL/TLS protocol. It uses the highest
    version both supports.


    To configure TLS settings, follow the procedure described in Section 5.2.4, "Configuring
    802.1IX Security for Wired with nm-connection-editor". The following configuration
    settings are available:


    # Identity


    Provide the identity of this server.


    # User certificate


    Click to browse for, and select, a personal X.509 certificate file encoded with
    Distinguished Encoding Rules (DER) or Privacy Enhanced Mail (PEM).


    # CA certificate


    Click to browse for, and select, an X.509 certificate authority certificate file
    encoded with Distinguished Encoding Rules (DER) or Privacy Enhanced Mail (PEM).


    # Private key


    Click to browse for, and select, a private key file encoded with Distinguished
    Encoding Rules (DER), Privacy Enhanced Mail (PEM), or the Personal Information
    Exchange Syntax Standard (PKCS #12).


    # Private key password


    Enter the password for the private key in the Private key field. Select Show password
    to make the password visible as you type it.


    # Configuring FAST Settings


    To configure FAST, follow the procedure described in Section 5.2.4, "Configuring
    802.1IX Security for Wired with nm-connection-editor". The following configuration
    settings are available:'
