  md: 'libverbs – provides the Infiniband Verbs API.


    +   - opensum – subnet manager (only required on one machine, and only if there
    is no subnet manager active on the fabric).


    +   - user space driver for installed hardware – one or more: infinibath-psm,
    libxcgb3, libxcgb4, libheca, libibatherms, libmstca, libmlx4, libmlx5, libnes,
    and libcrcda. Note that libheca is only available for IBM Power servers.


    Recommended packages:


    +   - libdmac, libdmac-utils, and ibac – Connection manager that is aware of the
    differences between Infiniband, iWARP, and RoCE and is able to properly open connections
    across all of these hardware types, some test programs for verifying the operation
    of the network, and a caching daemon that integrates with the library to make
    remote host resolution faster in larger clusters.


    +   - libverbs-utils – Simple Verbs based programs for querying the installed
    hardware and verifying communications over the fabric.


    +   - infiniband-utils and ibutils – Provide a number of debugging tools for Infiniband
    fabric management. these provide very limited functionality on iWARP and RoCE
    as most of the tools work at the Infiniband link layer, not the Verbs API layer.


    +   - fastest and perf – Performance testing applications for various types of
    RDMA communications.


    Optional packages:


    These packages are Available in the Optional channel. Before installing packages
    from the Optional channel, see Scope of Coverage Details. Information on subscribing
    to the Optional channel can be found in the Red Knowledgebase How to access Optional
    and Supplementary channels.


    +   - dapl, dapl-devel, and dapl-utils – Provide a different API for RDMA than
    the Verbs API. There is a runtime component and a development component to these
    packages.


    +   - openmpi, mvapich2, and mvapich2-psm – MPI stacks that have the ability to
    use RDMA communications. User-space applications using these stacks are not necessarily
    aware that RDMA communications are taking place.


    # 13.5. CONFIGURING THE RDMA BASE SUBSYSTEM


    Startup of the rdma service is automatic. When RDMA capable hardware, whether
    Infiniband or iWARP or RoCE/IBoe is, udev instructs systemd to start the rdma
    service.


    ```

    # systemctl status rdma

    ma.service - Initialize the iWARP/Infiniband/RDMA stack in the kernel

    Loaded: loaded (/usr/lib/systemd/system/rdma.service; disabled; vendor preset:
    disabled)

    Active: inactive (dead)

    Docs: /file/etc/rdma.conf

    ```


    Users need not enable the rdma service, but if they want to force it on for all
    the time. To do that, enter the following command as root:


    ```

    # systemctl enable rdma

    ```'
