  md: "You can specify the team configuration either as a JSON string or provide a\
    \ file name containing the configuration. The file name can include the path.\
    \ In both cases, what is stored in the team.config property is the JSON string.\
    \ In the case of a JSON string, use single quotes around the string and paste\
    \ the entire string to the command line.\n\nTo review the team.config property:\n\
    \n```\nnmcli connection show team-name | grep team.config\n```\n\nWhen the team.config\
    \ property is set, all the other team properties are updated accordingly.\n\n\
    It is also possible a more flexible way of exposing and setting particular options\
    \ without modifying directly the corresponding JSON string. You can do this using\
    \ the other available team properties to set the related team options one by one\
    \ to the required values. As a result, the team.config property is updated to\
    \ match the new values.\n\nFor example, use the team.link-watcher property which\
    \ allows to specify one or multiple link-watchers, enter a command in the following\
    \ format:\n\n```\nnmcli connection modify team-name team.link-watchers \"name=ethtool\
    \ delay-up=5,name=nsna_ping target-host=target_host\"\n```\n\nThe required link-watchers\
    \ are separated by space and the attributes which belong to the link-watcher are\
    \ separated by space.\n\nTo set the team.runner and the team.link-watchers properties,\
    \ enter a command in the following format:\n\n```\nnmcli connection modify team-name\
    \ team.runner activebackup team.link-watchers \"name=ethtool delay-up=5,name=nsna_ping\
    \ target-host=target_host\"\n```\n\nThis is equivalent to set the team.config\
    \ property to the corresponding JSON string:\n\n```\nnmcli connection modify team-name\
    \ team.config '\"runner\": {\"name\": \"activebackup\"}, \"link_watch\": {\"name\"\
    : \"ethtool\", \"delay_up\": 5},{\"name\": \"nsna_ping\", \"target_host\": \"\
