  md: '# Networking Guide


    +   * 0x02 - use GVRP protocol

    * 0x04 - loose binding of the interface and its master


    The state of the VLAN is synchronized to the state of the parent or master interface
    (the interface or device on which the VLAN is created). If the parent interface
    is set to the "down" administrative state then all VLANs are set and all routes
    are flushed from the routing table. **0x04** enables a *loose binding* mode, in
    which only the operational state is passed from the parent to the associated VLANs,
    or the VLAN device state is not changed.


    To set a VLAN flag, issue a command as follows:


    ```

    ~ nmcli connection modify vlan-VLAN10 vlan.flags 1

    ```


