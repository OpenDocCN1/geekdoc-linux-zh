    # 3.3.7. Adding and Configuring a Dynamic Ethernet Connection with nmcli


    # Adding a Dynamic Ethernet Connection


    To add an Ethernet connection profile with dynamic IP configuration, allowing
    DHCP to assign the network configuration:


    ```

    $ nmcli connection add type ethernet con-name connection-name if name

    ```


    For example, to create a dynamic connection named my-office:


    ```

    $ nmcli connection add type ethernet con-name my-office ens3

    Connection ''my-office'' (fb157a65-ad32-47ed-858c-102a48e064a2) successfully added.

    ```


    To open the Ethernet connection:


    ```

    $ nmcli connection up my-office

    Connection successfully activated (D-Bus active path:

    /org/freedesktop/NetworkManager/ActiveConnection/5)

    ```


    Review the status of the devices and connections:


    ```

    $ nmcli device status

    DEVICE TYPE STATE CONNECTION

    ens3 ethernet connected my-office

    ens9 ethernet disconnected --

    lo loopback unmanaged

    ```


    # Configuring a Dynamic Ethernet Connection


    To change the host name by a host to a DHCP server, modify the dhcp-hostname property:


    ```

    $ nmcli connection modify my-office ipv4.dhcp-hostname host-name ipv6.dhcp-hostname
    host-name

    ```


    To change the IPv4 client ID by a host to a DHCP server, modify the dhcp-client-id
    property:


    ```

    $ nmcli connection modify my-office ipv4.dhcp-client-id client-id-string

    ```


    There is no dhcp-client-id property for IPv6, dhclient creates an identifier for
    IPv6. See the dhclient(8) page for details.


    To ignore the DNS servers sent to a host by a DHCP server, modify the ignore-auto-dns
    property:


    ```

    $ nmcli connection modify my-office ipv4.ignore-auto-dns yes ipv6.ignore-auto-dns
    yes

    ```'
