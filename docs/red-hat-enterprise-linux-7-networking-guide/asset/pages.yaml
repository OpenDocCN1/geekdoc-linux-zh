    # 8.10.3. Creating a Network Team Using ifcfg Files


    To create a networking team using **ifcfg** files, create a file in the **/etc/sysconfig/network-scripts/**-directory
    as follows:


    ```

    DEVICE=team0

    DEVICYPE=Team

    ONBOOT=yes

    BOOTPROTO=none

    IPADDR=192.168.111.1

    PREFIX=24

    TEAM_CONFIG="{"name": "activebackup", "link_name": "eth0"''}

    ```


    This creates the interface to the team, in other words, this is the master.


    To create a port to be member of team, create one or more files in the **/etc/sysconfig/network-scripts/**-directory
    as follows:


    ```

    DEVICE=ens10

    HWADDR=D4:85:64:01:46:9E

    DEVICYPE=TeamPort

    ONBOOT=yes

    TEAM_MASTER=team0

    TEAM_PORT_CONFIG="{"prio": "100"}''

    ```


    Add additional ports as required, changing the DEVICE and **HWADDR** field to
    match the ports (the network devices) being added. If port priority is not specified
    by **prio** it defaults to **0**; it accepts negative and positive values in the
    range **-32,767** to **+32,767**.


    Specifying the hardware or MAC address using the **HWADDR** directive will influence
    the device naming procedure. This is explained in Chapter 11, Consistent Network
    Device Naming.


    To open the network team, issue the following command as **root**:


    ```

    ~# ifup team0

    ```'
