  pgno: 249
- img_proc: true
  md: '```

    server1 IN A 10.0.1.3

    IN A 10.0.1.5

    ```


    # CNAME


    The Canonical Name record maps one name to another. Because of this, this type
    of record sometimes referred to as an alias record. It takes the following form:


    ```

    alias-name IN CNAME real-name

    ```


    CNAME records are most commonly used to point to services that use a common naming
    scheme, such as www for Web servers. However, there are multiple restrictions
    for their usage:


    +   - CNAME records should not point to other CNAME records. This is mainly to
    avoid infinite loops.

    - CNAME records should not contain other resource record types (such as A, NS,
    MX, and so on). The only exception is DNSSEC related records (RSIG, NSEC, and
    so on) when the zone is signed.

    - Other resource records that point to the fully qualified domain name (FQDN)
    of a host (NS, MX, PTR) should not point to a CNAME record.


    In Example 15.11, "Using the CNAME Resource Record", the A record binds a host
    to an IP address, where the CNAME record points commonly used www host name to.


    > Example 15.11. Using the CNAME Resource Record

    server1 IN A 10.0.1.5

    www IN CNAME server1


    # MX


    The Mail Exchange record specifies where the mail sent to a particular namespace
    controlled by the zone should go. It takes the following form:


    ```

    IN MX preference-value email-server-name

    ```


    The email-server-name is a fully qualified domain name (FQDN). The preference-value
    allows numerical ranking of the email servers for a namespace, giving preference
    to some email systems over others. The MX resource record with the lowest preference-value
    is preferred over the others. However, multiple email servers can possess the
    same value to distribute traffic among them.


    In Example 15.12, "Using the MX Resource Record", the first mail.example.com email
    server is preferred to the mail2.example.com email server when receiving email
    destined for the example.com domain.


    > Example 15.12. Using the MX Resource Record

    example.com. IN MX 10 mail.example.com.

    IN MX 20 mail2.example.com.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# NS


    The Nameserver record announces authoritative nameservers for a particular zone.
    It takes the following form:


    ```

    IN NS nameserver-name

    ```


    The nameserver-name should be a fully qualified domain name (FQDN). Note that
    when two nameservers are listed as authoritative for the domain, it is not important
    whether these nameservers are secondary nameservers, or if one of them is a primary
    server. They are both still considered authoritative.


    Example 15.13. Using the NS Resource Record


    ```

    IN NS dns1.example.com.

    IN NS dns2.example.com.

    ```


    # PTR


    The Pointer record points to another part of the namespace. It takes the following
    form:


    ```

    last-IP-digit PTR FQDN-of-system

    ```


    The last-IP-digit directs the last number in an IP address, and the FQDN-of-system
    is a fully qualified domain name (FQDN).


    PTR records are used for reverse name resolution, as they point IP addresses back
    to a particular name. See Section 15.2.3.4.2, "A Reverse Name Resolution Zone
    File" for examples of PTR records used in.


    # SOA


    The Start of Authority record announces important authoritative information about
    a namespace to the nameserver. Located after the directives, it is the first record
    in a zone. It takes the following form:


    ```

    @ IN SOA primary-name-server hostmaster-email (

    serial-number

    time-to-refresh

    time-to-expire

    minimum-TTL )

    ```


    The directives are as follows:


    +   * The @ symbol places the $ORIGIN directive (or the zone name if the $ORIGIN
    directive is not set) as the namespace defined by this SOA resource record.


    +   * The primary-server directive is the host name of the primary nameserver
    that is authoritative for this domain.


    +   * The hostmaster-email directive is the email of the person to contact about
    the namespace.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '+   The serial-number directive is a numerical value incremented every time
    the zone file is altered to indicate it is time for the named service to reload
    the zone.


    +   The time-to-refresh directive is the numerical value secondary nameservers
    use to determine how long to wait before asking the primary nameserver if any
    changes have been made to the zone.


    +   The time-to-retry directive is a numerical value used by secondary nameservers
    to determine the length of time to wait before issuing a refresh request in the
    event that the primary nameserver is not answering. If the primary server has
    not replied to the refresh request before the amount of time specified in the
    time-to-expire directive, the secondary servers stop responding as an authority
    for requests concerning that namespace.


    +   In BIND 4 and 8, the minimum-TTL directive is the amount of time other nameservers
    cache the zone''s information. In BIND 9, it defines how long negative answers
    are cached for. Caching of negative answers can be set to a maximum of 3 hours
    (3H).


    When configuring BIND, all times are specified in seconds. However, it is possible
