    # 15.2.6. Advanced Features of BIND


    Most BIND implementations use only the named service to provide name resolution
    services or to act as an authority for a particular domain. However, BIND version
    9 has a number of advanced features that allow for more secure and efficient DNS
    service.


    # IMPORTANT


    ![](img/6432d27ad634c9a7f868191ca63abe75_260_0.png)


    Before to use advanced features like DNSSEC, TSIG, or IXFR (Incremental Zone Transfer),
    make sure that the particular feature is supported by all nameservers in the network
    environment, especially when you use older versions of BIND or non-BIND servers.


    All of the features mentioned are discussed in greater detail in the BIND 9 Administrator
    Reference Manual referenced in Section 15.2.8.1, "Installed Documentation".


    # 15.2.6.1. Multiple Views


    Optionally, different information can be presented to a client depending on the
    network request originates from. This is primarily used to deny dense DNS entries
    from clients outside of the local network, while allowing queries from inside
    the local network.


    To configure multiple views, add the view statement to the /etc/named.conf configuration
    file. Use the match-clients option to map IP addresses or entire networks and
    give them special options and data.


    # 15.2.6.2. Incremental Zone Transfers (IXFR)


    Incremental Zone Transfers (IXFR) allow a secondary nameserver to only download
    the updated portions of a zone modified by a primary nameserver. Compared to the
    standard transfer process, this makes the notification and update process more
    efficient.


    Note that IXFR is only available when using dynamic updating to make changes to
    master zone records. If manually editing zone files to make changes, Automatic
    Zone Transfer (AXFR) is used.


    257'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 15.2.6.3. Transaction SIGnatures (TSIG)


    Transaction SIGnatures (TSIG) ensure that a shared secret key exists on both primary
    and secondary nameservers before allowing a transfer. This strengthens the standard
    IP address-based method of transfer authorization, attackers would only need to
    have access to the IP address to transfer the zone, but they would also need to
    know the secret key.


    Since version 9, BIND also supports TKEY, which is another shared secret key method
    of authorizing zone transfers.


    # IMPORTANT


    When communicating over an insecure network, do not rely on IP address-based authentication
    only.


    # 15.2.6.4. DNS Security Extensions (DNSSEC)


    Domain Name System Security Extensions (DNSSEC) provide origin authentication
    of DNS data, authenticated denial of existence, and integrity. When a particular
    domain is marked as secure, the SERVAIL record is returned for each resource that
    fails the validation.


    Note to debug a DNSSEC-signed domain or a DNSSEC-resolver, you use the dig utility
    as described in Section 15.2.5, "Using the Utility". Useful options are +dnssec
    (requests DNSSEC-related resource by setting the DNSSEC OK), +cd (recursively
    nameserver not to validate the response), +bufsize=512 (changes the packet size
    to 512 to get through firewalls).


    # 15.2.6.5. Internet Protocol version 6 (IPv6)


    Internet Protocol version 6 (IPv6) is supported through the AAAA resource records,
    and the listen-on-v6 directive as described in Table 15.3, "Commonly Used Configuration
    Options".


    # 15.2.7. Common Mistakes to Avoid


    The following is a list of recommendations on how to avoid common mistakes that
    users make when configuring a nameserver:


    +   Use semicolons and curly brackets correctly


    An omitted semicolon or unmatched curly bracket in the /etc/named.conf file can
    prevent the named service from starting.


    +   Use period (the . character) correctly


    In zone files, a period at the end of a domain name denotes a fully qualified
    domain name. If omitted, the named service will append the name of the zone or
    the value of $ORIGIN to complete it.


    +   Increment the serial number when editing a zone file


    If the serial is not incremented, the primary nameservers will have the correct,
    new information, but the secondary nameservers will never be notified of the change,
    and will not refresh their data of that zone.


    +   Configure the firewall


    If a firewall is blocking connections from the named service to other nameservers,
    the recommended practice is to change the firewall settings.'
  merge: -1
  pgno: 261
