- img_proc: true
  md: 'The INCLUDE directive allows you to include another file at the place where
    it appears, so that other zone settings can be stored in a separate file.


    > Example 15.7. Using the $INCLUDE Directive

    $INCLUDE /var/named/penguin.example.com


    # $ORIGIN


    The $ORIGIN directive allows you to append the domain name to unqualified records,
    such as those with the host name only. Note that the use of this directive is
    not necessary if the zone is specified in /etc/named.conf, since the zone name
    is used by default.


    In Example 15.8, "Using the $ORIGIN Directive", any names used in resource records
    that do not end in a trailing period (the . character) are appended with example.com.


    > Example 15.8. Using the $ORIGIN Directive

    $ORIGIN example.com.


    # $TTL


    The $TTL directive allows you to set the default Time to Live (TTL) value for
    the zone, that is, how long is a zone record valid. Each resource record can contain
    its own TTL value, which overrides this directive.


    Increasing this value allows nameservers to cache the information for a longer
    period of time, reducing the number of queries for the zone and lengthening the
    amount of time required to propagate resource changes.


    > Example 15.9. Using the $TTL Directive

    $TTL 1D


    # 15.2.3.2. Common Resource Records


    The following resource records are commonly used in zone files:


    # A


    The Address record specifies an IP address to be assigned to a name. It takes
    the following form:


    > hostname IN A IP-address


    If the hostname value is committed, the record will point to the last specified
    hostname.


    In Example 15.10, "Using the A Resource Record", the requests for server1.example.com
    are pointed to 10.0.1.3 or 10.0.1.5.


    > Example 15.10. Using the A Resource Record'
