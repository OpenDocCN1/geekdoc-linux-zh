    # 3.3.11. Configuring NetworkManager to Ignore Certain Devices


    By default, NetworkManager manages all devices except the **lo** (loopback) device.
    However, you can set certain devices as **unmanaged** to configure that NetworkManager
    ignores these devices. With this setting, you can manually manage these devices,
    for example, using a script.


    # 3.3.11.1. Permanently Configuring a Device as Unmanaged in NetworkManager


    You can configure devices as **unmanaged** based on several criteria, such as
    the interface, MAC address, or device type. This procedure describes how to set
    the **en1s0** interface as unmanaged in NetworkManager.


    To temporarily configure network devices as **unmanaged**, see [Section 3.3.11.2,
    "Temporarily Configuring a Device as Unmanaged in NetworkManager"]


    # Procedure


    +   1. Optional: Display the list of devices to identify the device you want to
    set as **unmanaged**:


    ```

    # nmcli device status

    DEVICE TYPE STATE CONNECTION

    enp1s0 ethernet disconnected --

    ```


    +   2. Create the **/etc/NetworkManager/conf.d/99-unmanaged-devices.conf** file
    with the following content:


    ```

    [keyfile]

    unmanaged-devices=interface-name:enp1s0

    ```


    To set multiple devices as unmanaged, separate the entries in the **unmanaged-devices**
    parameter with semicolon:


    ```

    [keyfile]

    unmanaged-devices=interface-name:interface_1;interface-name:interface_2-...

    ```


    +   3. Reload the **NetworkManager** service:


    ```

    # systemctl reload NetworkManager

    ```


    # Verification Steps


    +   - Display the list of devices:'
