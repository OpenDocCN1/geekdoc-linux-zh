    # 13.8.8. Testing an RDMA network after IPoIB configured


    Once IPoIB is configured, it is possible to use IP addresses to specify RDMA devices.
    Due to the ubiquitous nature of using IP addresses to handle names, most RDMA
    applications use these as their prefix, or in some cases, of specifying remote
    machines or local devices to connect to.


    To test the functionality of the IPoIB layer, it is possible to use any standard
    IP network tool and provide the IP address of the IPoIB devices to be tested.
    For example, the ping command between the IP addresses of the IPoIB devices should
    work now.


    There are different RDMA performance testing packages included with Red Hat Linux,
    qperf and pertest. Either of these may be used to test the performance of an RDMA
    network.


    However, when using any of the applications that are part of the pertest package,
    or the qperf application, there is a special note on address resolution. Even
    though the remote host is specified using an IP address or host name of the IB
    device, it is allowed for the test application to actually connect through a different
    RDMA interface. The reason for this is because the process of converting from
    the host name or address to RDMA value RDMA address between the two machines may
    be used. There are many ways for the client to connect to the server; for example,
    if there are two ports on each machine connected to the same InfinBand subnet,
    and an IP address for the second port on each machine it is likely that the pertest
    will find the first port on each machine a valid connection point. In this case,
    command-line options of the pertest packages can be used to test with card and
    to port, as is also done with ibing in Section 13.7, "Testing Early Infiniband
    RDMA operation", in order to ensure that testing covers the specific ports required
    for test. qperf operates as a server on one machine, listening on all devices
    (including non-RDMA devices). The client may connect to qperf using any IP address
    or host name for the server. Qperf will first attempt to open a connection and
    request the test(s) over the IP address or host name given on the client line,
    but if there is any problem with that address, qperf will fall back to attempting
    to test over a specific link. For this reason, use the -loc_id and -rem_id options
    to the qperf client in order to force the test to run on a specific link.


