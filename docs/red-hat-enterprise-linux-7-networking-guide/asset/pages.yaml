  md: 'The name provided by systemd-udev will be used (if systemd-udev can determine
    one).


    # 11.9. DISABLING CONSISTENT NETWORK DEVICE NAMING


    To disable consistent network device naming, is only recommended for special scenarios.
    See Chapter 11, Consistent Network Device Naming and Section 11.10, "Troubleshooting
    Network Device Naming" for more information.


    To disable consistent network device naming, choose from one of the following:


    +   Disable the assignment of fixed names by "masking" udev''s rule for the default
    policy. This can be done by creating a symbolic link to /dev/null. As a result,
    unpredictable kernel names will be used. As root, enter the following command:


    ```

    # ln -s /dev/null /etc/udev.rules/80-net-name-slot.rules

    ```


    +   Create your own manual naming scheme, for example by naming your interfaces
    internet0, dmz0 and lan0. To do that, create your udev rules file and set the
    NAME property for the devices. Make sure to use the new name above the default
    policy file, for example by naming it /etc/udev.rules/70-my-net-names.rules.


    +   Alter the default policy to pick a different naming scheme, for example to
    name all interfaces after their MAC address by. As root, copy the default policy
    file as follows:


    ```

    # cp /usr/lib/udev/rules/80-net-name-slot.rules /etc/udev.rules/80-net-name-slot.rules

    ```


    Edit the file in /etc/udev.rules/ directory and change the lines as necessary.


    +   Open the /etc/default/grub and find the GRUB_CMDMLINE_LINUX variable.


    ![](img/6432d27ad634c9a7f868191ca63abe75_183_0.png)


    > NOTE

    GRUB_CMDMLINE_LINUX is a variable that includes entries which are added to the
    kernel command line. It might already contain additional configuration depending
    on your system.


    Add both net.interfaces=0 and biosdevname=0 as kernel parameter values to the
    GRUB_CMDMLINE_LINUX variable:


    ```

    # cat /etc/default/grub

    GRUB_TIMEOUT=5

    GRUB_DISTRIBUTOR="$(sed ''s/.*$/g'' /etc/system-release)"

    GRUB_DEFAULT=saved

    GRUB_DISABLE_SUBMENU=true

    GRUB_TERMINAL_OUTPUT=""

    GRUB_CMDMLINE_LINUX="dev.lv=/root_rhel_7/swap.rd.lvms.uuid=cc387312-d64-469a-8e49-b04cd5d8067a
    crashroot=console keymap=us console-latarcyh-sun16.rd.lv=/root root quiet net.interfaces=0
    biosdevname=0"

    GRUB_DISABLE_RECOVERY=""

    ```


    Rebuild the /boot/grub2/grubcfg by running the grub2-mkconfig command:


    ```

    # grub2-mkconfig -o /boot/grub2/grub.cfg

    ```'
