  md: '# # CHAPTER 6. CONFIGURE HOST NAMES


    # ## 6.1 UNDERSTANDING HOST NAMES


    There are three classes of **hostname**: static, pretty, and transient.


    The "static" host is the traditional **hostname**, which can be chosen by the
    user, and is stored in the `/etc/hostname` file. The "transient" **hostname**
    is a dynamic host maintained by the kernel. It is initialized to the static host
    by default, whose value defaults to "localhost". It can be changed by **DHCP**
    or **mDNS** at runtime. The "pretty" **hostname** is a free-form UTF8 host for
    presentation to the user.


    ![](img/6432d27ad634c9a7f868191ca63abe75_89_0.png)


    # NOTE


    A host name can be a free-form string up to 64 characters in length. However,
    Red Hat recommends that both static and transient names match the *fully-qualified
    domain name* (FQDN) used for the machine in **DNS**, as **host.example.com**.
    It is also recommended that the static and transient names consist of only ASCII
    lower-case characters, no spaces or dots, and limits itself to the format allowed
    for **DNS** domain names, even though this is not a strict requirement. Older
    specifications do not permit the underscore, so their use is not recommended.


    # ## 6.1.1 Recommended Naming Practices


    The Internet Corporation for Assigned Names and Numbers (ICANN) sometimes adds
    previously unregistered Top-Level Domains (such as **yourcompany**) to the public
    register. Therefore, Red Hat strongly recommends that you do not use a domain
    name that is not delegated to you, even on a private network, as this can result
    in a domain name that resolves differently depending on network configuration.
    As a result, network resources can become unavailable. Using domain names that
    are not delegated to you also makes DNSSEC difficult to deploy and maintain, as
    name collisions require manual configuration to enable DNSSEC validation. See
    the [ICANN FAQ on domain name collision](#) for more information on this.


    # ## 6.2 CONFIGURING HOST NAMES USING TEXT USER INTERFACE, NMTUI


    The text user interface tool **nmtui** can be used to configure a host name in
    a terminal window. Issue the following command to start the tool:


    ```

    ~$ nmtui

    ```


    The text user interface appears. Any invalid command prints a usage message.'
