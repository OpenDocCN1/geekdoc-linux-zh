- img_proc: true
  md: 'Mixed schemes most likely means that either for hardware there is no usable
    information provided by the kernel to udev, then it could not figure out any names,
    or the information provided to udev is useless, for non-unique device IDs. The
    latter is more common and the solution is to use a custom naming scheme in ifcfg
    files or alter which udev scheme is in by editing 80-net-name-slot.rules.


    # Example 11.2. In /var/log/messages or the system Journal, Renaming Is Seen to
    Be Done Twice for Each Interface


    Systems with the naming scheme encoded in ifcfg files which do not have a generator
    image are likely to encounter this issue. The interface name is initially assigned
    (through biosdevname or udev parameters on the kernel command line) during early-boot
    while still in initrd. After switching to rootfs, /usr/lib/udev/rename_device
    binary spawned by udev performs a second and a new interface name is determined
    by it because of processing 60-net.rules. You can safely ignore such messages.


    # Example 11.3. Using Naming in ifcfg Files with ethX Names Does Not Work


    Red Hat Enterprise Linux does not provide a way to consistently apply the ethX
    naming convention except under very specific circumstances.


    The udev rules, which set an interface to a specific name, if the requested name
    is already in use by some other interface. Includes the functionality provided
    by the /usr/lib/udev/rules.d/60-net.rules file.


    Kernel uses the ethX naming at boot time when it enumerates network devices. The
    names are inconsistent across various boots, and thus they are unpredictable.
    Consequently, attempting to use udev to rename an interface to a predictable name
    or to reorder the unpredictable ethX names given by the kernel fails.


    Using the ethX names works correctly for the following scenarios:


    +   - The system has only one network interface.

    - When used for virtual NICs in Red Hat Enterprise Linux 7 virtual machine guests.
    See the KVM Paravirtualized (virtio) Drivers and Network Configuration chapters
    in the Virtualization Deployment and Administration Guide


    # Example 11.4. Setting net.filenames=0 Results in Inconsistent enpXX Names


    If both system predictable interface naming (net.filenames) and biosdevname naming
    schemes are disabled, network interfaces continue to use the unpredictable and
    potentially inconsistent ethX name given by the kernel.


    Kernel always uses the ethpXX naming at boot when it enumerates network devices.
    Due to parallelization, the order of the kernel interface enumeration is expected
    to vary across reboots. Red Hat Enterprise Linux relies on either system predictable
    interface naming or the biosdevname naming to rename the unpredictable ethX interfaces
    in a predictable way to which is always consistent across reboots.


    For more information about network adapter naming conventions, see the Is it safe
    to set net.filenames=0 in RHEL? Knowledge Centered Support article on the Red
    Hat Customer Portal.'
