  md: '# WARNING


    Using a fixed UDP source port for DNS queries is a potential security vulnerability
    that could allow an attacker to conduct cache-poisoning attacks more easily. To
    prevent this, by default DNS sends from a random ephemeral port. Configure your
    firewall to allow outgoing queries from a random UDP source port. The range 1024
    to 65535 is used by default.


