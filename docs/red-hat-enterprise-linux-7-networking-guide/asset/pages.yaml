    # 11.10. TROUBLESHOOTING NETWORK DEVICE NAMING


    Predictable names will be assigned to each interface, if applicable, by the procedure
    described in Section 11.2, "Understanding the Device Renaming Procedure". To view
    the list of possible names udev, use this command in the following format as root:


    ```

    # udevadm /sys/class/net/ifname | grep ID_NET_NAME

    ```


    where ifname is one of the interfaces listed by the following command:


    ```

    $ ls /sys/class/net/

    ```


    One of the possible rules is applied by udev according to the rules described
    in Section 11.2, "Understanding the Device Renaming Procedure", and summarized
    here:


    +   - /usr/lib/udev/rules.d/60-net.rules - from itnscripts,

    - /usr/lib/udev/rules.d/71-biosdev.rules - from biosdevname,

    - /usr/lib/udev/rules.d/80-net-slot.rules - from systemd


    From the above list of rules it can see that if interface name goes through itnscripts
    or biosdev takes precedence over udev native naming. If itnscripts renaming is
    not taking place and biosdev is disabled, then alter the interface names copy
    the 80-name-slot.rules from /usr to /etc and edit the file appropriately. Otherwise,
    comment out or arrange schemes to be used in a certain order.


