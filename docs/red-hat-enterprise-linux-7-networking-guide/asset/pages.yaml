    Connection ''bond-mybond'' (5f739690-47e8-444b-9620-1895316a28ba) successfully
    added.


    To add a **slave** interface:


    +   1. Create a new connection, [Section 3.3.5, "Creating and Modifying a Connection
    Profile with nmcli"] for details.

    2. Set the master property to the **bond** interface name, or to the name of the
    master connection:


    ```

    ~$ nmcli conn add ethername ens3 master mybond

    Connection ''bond-slave-ens3'' (220f99c6-ee0a-42a1-b2e0-454cbabc2618) successfully
    added.

    ```


    To add a new **slave** interface, repeat the previous command with the new interface.
    For example:


    ```

    ~$ nmcli conn add bond-slave-ens7

    Connection ''bond-slave-ens7'' (e2cc2475-1c89-401f-90c8-9706531e0231) successfully
    added.

    ```


    To activate the slave, issue a command as follows:


    ```

    ~$ nmcli up bond-slave-ens7

    Connection successfully activated (D-Bus activated)

    /org/freedesktop/NetworkManager/ActiveConnection/14

    ```


    ```

    ~$ nmcli up bond-slave-ens3

    Connection successfully activated (D-Bus activated)

    /org/freedesktop/NetworkManager/ActiveConnection/15

    ```


    When you activate a slave, the master connection also activates. You can see [Section
    7.1, "Understanding the Default Behavior of Master and Slave Interfaces"] for
    more information. In this case, it is not necessary to manually activate the master
    connection.


    It is possible to change the **active_slave** option and the **primary** option
    of the bond at runtime, deactivating the bond. For example to change the **active_slave**
    option, issue the following command:


    ```

    ~$ nmcli dev mod bond +bond.options "active_slave=ens7"

    Connection successfully reployed to device ''bond0''.

    ```


    or to change the **primary** option:


    ```

    ~$ nmcli dev mod bond +bond.options "primary=ens3"

    Connection successfully reployed to device ''bond0''.

    ```


    > NOTE

    The **active_slave** option sets the currently active slave whereas the **primary**
    option of the bond specifies the active slave to be automatically selected by
    kernel when a new slave is added or a failure of the active slave occurs.


