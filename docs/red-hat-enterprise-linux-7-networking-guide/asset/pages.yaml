- img_proc: true
  md: '# CHAPTER 13. CONFIGURE INFINIBAND AND RDMA NETWORKS


    # 13.1. UNDERSTANDING INFINIBAND AND RDMA TECHNOLOGIES


    InfiniBand refers to two distinct things. The first is a physical link-layer protocol
    for InfiniBand networks. The second is a higher level programming API calling
    the InfiniBand Verbs API. The InfiniBand Verbs API is an implementation of a remote
    memory access (RDMA) technology.


    RDMA provides direct access from memory of one computer to the memory of another
    without involving either other''s operating system. This technology enables high-throughput,
    low-latency networking with low CPU utilization, which is especially useful in
    parallel cluster clusters.


    In a typical IP transfer, application X sends some data to application Y on machine
    B. As part of the transfer, the kernel on machine B must first receive the data,
    decode the packet headers, determine that the data belongs to application Y, wake
    up application Y, wait for application Y to perform a recall switch and then must
    manually copy the data from the kernel''s internal memory into the buffer provided
    by application Y. This process means that most network traffic must be copied
    across the system''s memory bus twice (once when the host adapter uses DMA to
    put the data into the kernel-provided buffer, and also means the computer must
    execute a number of context switches to switch between the kernel context and
    application Y context). Both of these things impose extremely high CPU loads on
    the system when network traffic is flowing at very high rates and can make other
    tasks to draw slow.


    RDMA communications differ from normal IP communications because they bypass kernel
    in the communication process, and in the process greatly reduce the CPU overhead
    normally needed to process network communications. The RDMA protocol allows the
    host adapter in the machine to know when a packet comes in from the network, which
    adapter should receive that, and where in the application''s memory space it should
    reside. Instead of sending the packet to the kernel and then copying it into the
    user application''s buffer without any further intervention necessary. However,
    this cannot be accomplished using the standard Berkeley Sockets API that most
    networking applications are built upon, so it must provide its own API, the InfiniBand
    Verbs API, and all communications must be posted to this API before they can use
    RDMA technology.


    Red Hat Enterprise Linux 7 supports both the Infiniband hardware and the InfinBand
    Verbs API. there are two additional supported technologies that allow the InfiniBand
    Verbs API to be utilized on non-InfiniBand hardware:


    +   - The Internet Wide Area RDMA Protocol (iWARP)


    iWARP is a networking protocol that implements remote memory access (RDMA) for
    efficient data transfer over Internet Protocol (IP) networks.


    +   - The RDMA over Converged Ethernet (RoCE) protocol, which later renamed to
    Infiniband over Ethernet (IBE).


    RoCE is a network protocol that allows remote direct memory access (RDMA) over
    an Ethernet network.


    # Prerequisites


    Both iWARP and RoCE technologies have normal IP network link layer as their underlying
    technology, and the majority of their configuration is actually covered in Chapter
    3, Configuring IP Networking. For the most part, once their IP networking features
    are properly configured, their RDMA'
  merge: -1
