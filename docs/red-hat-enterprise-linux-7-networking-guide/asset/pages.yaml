    your_interface_name(s)


    Then, as the root, restart the service:


    ```

    # systemctl daemon-reload

    # systemctl restart dhcpd

    ```


    Command line options can be appended to ExecStart=/usr/bin/dhcpd in the /etc/systemd/dhcpd.service
    unit file [Section]. They include:


    +   - pport specifies the UDP port on which dhcpd should listen. The default is
    port 67. The DHCP server transmits responses to the DHCP clients at a port one
    greater than the UDP port used. For example, if the default port 67 is used, the
    server listens on port 67 for requests and responds to the client on port 68.
    If a port is specified and the DHCP relay agent is used, the same port on which
    the DHCP relay listen must be specified. See Section 14.3,"DHCP Relay Agent" for
    details.

    - - Runs the daemon as a foreground process. This is mostly used for debugging.

    - -d Logs the DHCP server daemon to the standard error descriptor. This is mostly
    used for debugging. If this is not specified, it is written to /var/log/messages.

    - -cf filename Specifies the location of the configuration file. The default location
    is /etc/dhcpd/dhcpd.conf.

    - - filename Specifies the location of the lease database file. If a lease database
    already exists, it is very important that the same file be used every time the
    DHCP server is started. it is strongly recommended this option only be used for
    debugging purposes on non-production machines. The default location is /var/lib/dhcpd/dhcpd.leases.

    - -q Do not print the copyright message when starting the daemon.


    # 14.3. DHCP RELAY AGENT


    The DHCP (dhcrelay) enables relay of DHCP and BOOTP requests from a subnet with
    no DHCP server on it or one more DHCP servers on other subnets.


    When a DHCP client requests information, the DHCP Relay Agent forwards the request
    to the list of DHCP servers specified when the DHCP Relay is started. When a DHCP
    server returns a reply, it is relayed by broadcast or on the network that sent
    the original request.


    The DHCP Relay Agent for IPv4, dhcrelay, listens for DHCP4 and BOOTP requests
    on all interfaces unless the interfaces specified in /etc/sysconfig/dhcrelay the
    INTERFACES directive. Section 14.3.1,"Configure dhcrelay as a DHCP4 and BOOTP
    relay agent" . The DHCP Relay Agent for IPv6, dhcrelay, does not have this behavior
    and listens to for for DHCP6 requests must be specified. See Section 14.3.2,"Configure
    dhcrelay as a DHCP6 relay agent"


    dhcrelay can be run as a DHCP4 and BOOTP relay agent (by default) or as a DHCP6
    relay agent (with -g argument). To see the usage message, use the command dhcrelay
    -h.


    # 14.3.1. Configure dhcrelay as DHCP4 and BOOTP relay agent


    To run dhcrelay in DHCP4 and BOOTP mode specifies the servers to which the requests
    should be forwarded to. Copy and edit the dhcrelay.service file as the root user:'
