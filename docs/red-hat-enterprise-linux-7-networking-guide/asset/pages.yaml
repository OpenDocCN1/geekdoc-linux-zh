    # 7.5. VERIFYING NETWORK CONFIGURATION BONDING FOR REDUNDANCY


    Network redundancy is a process when devices are used for backup purposes to prevent
    or recover from a failure of a specific system. The following procedure describes
    how to verify the network configuration for bonding in redundancy:


    # Procedure


    +   Ping the destination IP from the bond interface. For example:


    ```

    ~# ping -l bond0 DASTADDR

    ```


    +   View which interface is in active mode:


    ```

    ~# cat /sys/class/net/bond0/bonding/active_slave

    enp1s0

    ```


    enp1s0 is the active slave interface.


    +   Set the active slave interface down:


    ```

    ~# ip link set enp1s0 down

    ```


    +   Check if the backup interface is up:'
  merge: -1
