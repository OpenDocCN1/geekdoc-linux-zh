  md: '# 8.2. UNDERSTANDING THE DEFAULT BEHAVIOR OF MASTER AND SLAVE INTERFACES


    When controlling port interfaces using the NetworkManager daemon, and especially
    when fault, keep the following in mind:


    +   - Starting the master interface does not automatically start the port interfaces.

    - Starting a port interface always starts the master interface.

    - Stopping the master interface also stops the port interfaces.

    - A master without ports can start static IP connections.

    - A master without ports waits for ports when starting DHCP connections.

    - A master with a DHCP connection waiting for ports completes when a port with
    a carrier is added.

    - A master with a DHCP connection waiting for ports continues waiting when a port
    without a carrier is added.


    > WARNING

    The use of direct cable connections without network switches is not supported
    for teaming. The failover mechanisms described here will not work as expected
    without the presence of network switches. See the Red Hat Knowledge article Why
    bonding not supported with direct connection using crossover cables? for more
    information.


    # 8.3. COMPARISON OF NETWORK TEAMING TO BONDING


    Table 8.1. A Comparison of Features in Bonding and Team


    | Feature | Bonding | Team |

    |---|---|--|

    | broadcast Tx policy | Yes | Yes |

    | round-robin Tx policy | Yes | Yes |

    | active-backup Tx policy | Yes | Yes |

    | LACP (802.3ad) support | Yes (active only) | Yes |

    | Hash-based Tx policy | Yes | Yes |

    | User can set hash function | No | Yes |'
  merge: -1
