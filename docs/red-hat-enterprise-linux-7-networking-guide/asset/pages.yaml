    # Connecting to an Available Access Point


    Procedure


    +   Click on the network icon to activate the network icon menu, see Section 3.4.1,
    "Connecting to a Network Using the control-center GUI".


    +   Locate the Service Set Identifier (SSID) of the access point in the list to
    Wi-Fi networks.


    +   Click on the SSID of the network. A padlock symbol indicates the access point
    requires authentication. If the access point is secured, a dialog prompts you
    for an authentication key or password.


    NetworkManager tries to auto-detect the type of security used by the access point.
    If there are multiple possibilities, NetworkManager guesses the security type
    and presents it in the Wi-Fi security drop-down menu.


    +   For WPA-PSK Enterprise (WPA with a password) no choice is necessary.


    +   For Wpa Enterprise (802.1X) you have to specifically select the security,
    because that cannot be auto-detected.


    Note that if you are unsure, connecting to each type in turn.


    +   Enter the key or passphrase in the Password. Certain password types, such
    as a 40-bit WEP or 128-bit WPA key, are invalid the Connect button will remain
    inactive until you enter a key of the length required for the selected security
    type. Learn more about wireless security, see Section 5.2, "Configuring 802.1IX
    Security".


    If NetworkManager connects to the access point, the network icon will change into
    a graphical indicator of the wireless connection''s signal strength.


    You can also edit the settings for one of these auto-created access points just
    if you had added them. The Wi-Fi page of the Network has a History button. Clicking
    it reveals a list of all the connections you have ever tried to connect. See the
