- img_proc: true
  md: '# # CHAPTER 14. DHCP SERVERS


    Dynamic Host Configuration Protocol (DHCP) is a network protocol that automatically
    assigns TCP/IP information to client machines. Each DHCP client connects to the
    centrally located DHCP server, which returns the network configuration (including
    the IP address, gateway, and DNS servers) of client.


    # ## 14.1. WHY DHCP?


    DHCP is useful for automatic configuration of network interfaces. When configuring
    the client system, you can choose DHCP instead of specifying an IP address, netmask,
    gateway, or DNS servers. The client retrieves this information from the DHCP server.
    DHCP is also useful if you want to change the IP addresses of a number of systems.
    By reconfiguring all the systems, you can just change one configuration on the
    server for the new set of IP addresses. If the DNS servers for an organization
    change, the changes happen on the DHCP server, not on the DHCP clients. When you
    restart the network or client, the changes take effect.


    If an organization has a functional DHCP server correctly connected to a network,
    laptops and other mobile users can move these devices from office to office. Note
    that administrators of DNS and DHCP servers, as well as any provisioning providers,
    should agree on the host name used in an organization. See Section 6.1.1, "Recommended
    Naming Practices" for more information on the host of names.


    # ## 14.2. CONFIGURING A DHCP SERVER


    The dhcp package contains an Internet Systems Consortium (ISC) DHCP server. Installing
    the package as root:


    ```

    ~# yum install dhcp

    ```


    Installing the dhcp package creates a file, /etc/dhcp/dhcp.conf, which is merely
    an empty configuration. As root, issue the following command:


    ```

    ~# cat /etc/dhcp/dhcp.conf

    # DHCP Server Configuration file.

    # see /usr/share/doc/dhcp/dhcp.conf.example

    # see dhcp.conf(5) man page

    ```


    The example configuration file can be found at /usr/share/doc/dhcp-version/dhcp.conf.example.
    You should use this file to help you configure /etc/dhcp/dhcp.conf, which is explained
    in detail below.


    DHCP also uses the file /var/lib/dhcp/dhcp.leases to store the client lease database.
    See Section 14.2.2, "Lease Database" for more information.


    # ### 14.2.1. Configuration File


    The first step in configuring a DHCP server is to create the configuration file
    that stores the network information for the clients. Use this file to declare
    options for client systems.


    The configuration file can contain extra tabs or blank lines for easier formatting.
    Keywords are case-insensitive and lines beginning with a hash sign (#) are considered
    comments.'
  merge: -1
  pgno: 221
- img_proc: true
  md: "There are two types of statements in the configuration file:\n\n+   - Parameters\
    \ – State how to perform a task, whether to perform a task, or what network configuration\
    \ options to send to the client.\n- Declarations – Describe the topology of the\
    \ network, describe the clients, provide addresses for the clients, or apply a\
    \ group of parameters to a group of declarations.\n\nThe parameters that start\
    \ with the keyword are referred to as options. These options control DHCP options;\
    \ whereas, parameters configure values that are not optional or control how the\
    \ DHCP server behaves.\n\nParameters (including options) before a section enclosed\
    \ in curly brackets { } are considered global parameters. Global parameters apply\
    \ to all sections below it.\n\n# IMPORTANT\n\n![](img/6432d27ad634c9a7f868191ca63abe75_222_0.png)\n\
    \nIf the configuration file is changed, the changes do not take effect until the\
    \ DHCP daemon is restarted with the command systemctl restart dhcp.\n\n# NOTE\n\
    \n![](img/6432d27ad634c9a7f868191ca63abe75_222_1.png)\n\nInstead of changing a\
    \ DHCP configuration file and restarting the service each time, using the omshell\
    \ command provides an interactive way to connect to, query, and change the configuration\
    \ of a DHCP server. By using omshell, all changes can be made while the service\
    \ is running. For more information on omshell, see the omshell page.\n\nIn Example\
    \ 14.1, \"Subnet Declaration\", the routers, subnet-mask, domain-search, domain-name-servers,\
    \ and time-offset options are used for any hosts declared below.\n\nFor every\
    \ subnet that will be served, and for every subnet to the DHCP server is connected,\
    \ there must be one subnet declaration, which tells the DHCP daemon to recognize\
    \ an address on that subnet. A subnet declaration is required for each subnet\
    \ even if no addresses are dynamically allocated to that subnet.\n\nIn this example,\
    \ there are global options for every DHCP client in the subnet and a range declared.\
    \ Clients are assigned an IP address within the range.\n\n# Example 14.1. Subnet\
    \ Declaration\n\n```\nsubnet 192.168.1.0 netmask 255.255.255.0 {\n  option routers\
    \            192.168.1.254;\n  option subnet-mask         255.255.255.0;\n  option\
    \ domain-search      \"example.com\";\n  option domain-name-servers 192.168.1.1;\n\
    \  option time-offset        -18000; # Eastern Standard Time\n  range 192.168.1.10\
    \ to 192.168.1.100;\n}\n```\n\nTo configure a DHCP server that leases an IP address\
    \ to a system within a subnet, modify the example values from Example 14.2, \"\
    Range Parameter\". It declares a default lease time, maximum lease time, and network\
    \ configuration values for the clients. This assigns IP addresses in the range\
    \ 192.168.1.10 and 192.168.1.100 to client systems."
  merge: -1
  pgno: 222
- img_proc: true
  md: "# Example 14.2. Range Parameter\n\n```\ndefault-lease-time 600;\nmax-lease-time\
    \ 7200;\noption subnet-mask 255.255.255.0;\noption broadcast-address 192.168.1.255;\n\
    option routers 192.168.1.254;\noption domain-servers 192.168.1.1, 192.168.1.2;\n\
    option domain-search \"example.com\";\nsubnet 192.168.1.0 netmask 255.255.255.0\
    \ {\n  range 192.168.1.10 192.168.1.100;\n}\n```\n\nTo assign an IP address to\
    \ a client based on the MAC address of the network interface card, use the hardware\
    \ ethernet parameter within a host declaration. As demonstrated in Example 14.3,\
    \ \"Static IP Address Using DHCP\", the host apex specifies that the network interface\
    \ card with the MAC address 00:A0:78:8E:9E:AA always receives the IP address 192.168.1.4.\n\
    \nNote that you can also use the parameter host-name to assign a host name to\
