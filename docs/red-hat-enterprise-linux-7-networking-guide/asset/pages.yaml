  md: '# CHAPTER 7. CONFIGURE NETWORK BONDING


    This option is useful for bonding modes balance-rr (mode 0), active-backup (mode
    1), balance-lb

    (mode 5) and balance-alb (mode 6), in which failover can switch the IGMP traffic
    from one slave to

    another. Therefore a fresh IGMP report must be issued to cause the switch to forward
