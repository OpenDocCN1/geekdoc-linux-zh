    # cat /sys/class/net/bond0/bonding/active_slave

    enp2s0

    ```


    enp2s0 is now the active slave interface.


    +   5. Check if you can ping the destination IP from the bond interface:


    ```

    # ping -l bond0 DSTADDR

    ```


    # 7.6. OVERVIEW OF BONDING MODES AND THE REQUIRED SETTINGS ON THE SWITCH


    The following table describes the required configuration that you must apply to
    the upstream switch depending on the bonding mode:


    Table 7.1. Switch Configuration Settings Depending on the Bonding Modes


    | Bonding Mode | Configuration on the Switch |

    |---|---|

    | 0 - balance-rr | Requires static Etherchannel enabled (not LACP-negotiated)
    |

    | 1 - active-backup | Requires autonomous ports |

    | 2 - balance-xor | Requires static Etherchannel enabled (not LACP-negotiated)
    |

    | 3 - broadcast | Requires static Etherchannel enabled (not LACP-negotiated) |

    | 4 - 802.3ad | Requires LACP-negotiated Etherchannel enabled |

    | 5 - balance-tlb | Requires autonomous ports |

    | 6 - balance-alb | Requires autonomous ports |


    For configuring settings on your switch, see the switch documentation.


    # 7.7. USING CHANNEL BONDING


    To enhance performance, adjust available module options to ascertain what combination
    works best. Pay attention to the **mimon** and **arp_interval** and **arp_ip_target**
    parameters. See [Section 7.7.1, Bonding Mode Directives] for a list of available
    options and how to quickly determine the best ones for your bonded interface.


    # 7.7.1. Bonding Mode Directives


    It is a good idea to test which bonding module work best for your bonded interfaces
    before adding them to the **BONDING_OPTS=bonding parameters** directive in your
    bonding interface configuration file (ifcfg-bond0 for example). Parameters to
    bonded interfaces can be configured without unloading (reloading) the bonding
    module by manipulating files in the **sysfs** system.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Networking Guide


    sysfs is a virtual file system that represents kernel objects as directories,
    and symbolic links. which can be used to query information about kernel objects,
    and can also manipulate those objects through the use of normal file system commands.
    The sysfs virtual file system is mounted under the /sys/. All bonding interfaces
    can be configured dynamically by interacting with and manipulating files under
    the /sys/class/net/.


    In order to determine the best parameters for your bonding interface, create a
    channel bonding interface such as ifcfg-bond0 by following the instructions in
    Section 7.4.2, "Create a Channel Bonding Interface". Insert the SLAVEyes and MASTER-bond0
    directives in the configuration files for each interface bonded to bond0. Once
    this is completed, you can proceed to test the parameters.


    First, open the bond you created by running ifup bond0 as root:


    ```

    ~# ifup bond0

    ```


    If you have correctly created the ifcfg-bond0 bonding interface file, you will
    be able to see bond0 listed in the output of running ip link show as root:


    ```

    ~# ip link show

    1: lo: LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN mode DEFAULT

    link/loopback 00:00:00:00:00:00 00:00:00:00:00:00

    2: enp1s0:BROADCAST,MULTICAST,SLAVE,UP mtu 1500 qdisc qifo_pfifo, master bond
    state UP mode DEFAULT 1000

    link/ether 52:54:00:e9:ce:2d br ff:ff:ff:ff:ff:ff

    3: enp2s0:BROADCAST,MULTICAST,SLAVE,UP,LOWER_UP mtu 1500 qdisc qifo_pfifo, master
    bond0 state UP mode DEFAULT 1000

    link/ether 52:54:00:38:a6:4c br ff:ff:ff:ff:ff:ff

    4: bond0:<BROADCAST,MULTICAST,UP,LOWER_UP> state DOWN UP mode DEFAULT

    link/ether 52:54:00:38:a6:4c br ff:ff:ff:ff:ff:ff

    ```


    To view all exists, even if they are not up, run:


    ```

    ~$ cat /sys/class/net/bonding/masters

    bond0

    ```


    You can configure each bond individually by manipulating the files located in
    the /sys/class/net/bond/bonding/ directory. First, the bond you are configuring
    must be taken down:


    ```

    ~# ifdown bond0

    ```


    As an example, to enable MII monitoring on bond0 with a 1 second interval, run
    as root:


    ```

    ~# echo 1000 > /sys/class/net/bond0/bonding/miimon

    ```


    To configure bond0 for balance-alb mode, run either:


    ```

    ~# echo 6 > /sys/class/net/bond0/bonding/mode

    ```


    ...or, using the name of the mode:


    ```

    ~# echo balance-alb > /sys/class/net/bond0/bonding/mode

    ```'
  merge: -1
