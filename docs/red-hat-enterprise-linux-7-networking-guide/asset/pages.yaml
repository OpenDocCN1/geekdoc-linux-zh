    # 15.2.4.2. Checking the Service Status


    To check the current status of the named service, use the following command:


    ```

    ~# rndc status

    version: 9.7.0-P2-RedHat-9.7.0-P5.P2.el6

    CPUs found: 1

    worker threads: 1

    number of zones: 16

    debug level: 0

