    # 3.3.3. Understanding the nmcli Options


    Following are some of the important nmcli property options. See the comprehensive
    list in the nmcli(1) man page :


    # connection.type


    A connection type Allowed values are: adsl, bond, bond-slave, bridge, bridge-slave,
    bluetooth, cdma, ethernet, gsm, infiniband, olpc-mesh, team, team-slave, wlan,
    wifi, wimax. Each connection has type-specific command options. You can see the
    TYPE_SPECIFIC_OPTIONS list in the nmcli(1) man page. For example:


    +   - A gsm connection requires the access point name specified in a apn.


    ```

    nmcli add connection.type gsm access_point_name

    ```


    +   - A wifi device requires the service identifier specified in a ssid.


    ```

    nmcli add connection.type wifi ssid My identifier

    ```


    # connection.interface-name


    A device name relevant for the connection.


    ```

    nmcli add connection.interface-name enp1s0 type ethernet

    ```


    # connection.id


    A name for the connection profile. If you do not specify a connection name, one
    will be generated as follows:


    ```

    connection.type -connection.interface-name

    ```


    The connection.id is the name of a connection profile and should not be confused
    with the interface name which denotes a device (wpl61s0, ens3, em1). However,
    users can name the connections after interfaces, they are not the same. There
    be multiple connection profiles available for a device. This is particularly useful
    for mobile devices or when switching a network cable back and forth between different
    devices. Rather edit the configuration, create different profiles and apply them
    to the interface as needed. The id option also refers to the connection profile
    name.


    The most important options for nmcli commands as show, up, down are:'
