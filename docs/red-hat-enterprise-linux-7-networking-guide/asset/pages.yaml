  md: "```\n\"link_watch\": {\n  \"name\": \"etthool\",\n  \"delay_up\": 2500\n}\n\
    ```\n\nTo add or edit an existing delay, in milliseconds, between the link going\
    \ down and the runner being notified about it, add or edit a section as follows:\n\
    \n```\n\"link_watch\": {\n  \"name\": \"etthool\",\n  \"delay_down\": 1000\n}\n\
    ```\n\n# 8.13.7.2. Configure ARP Ping for Link-state Monitoring\n\nThe team daemon\
    \ teamd sends an ARP REQUEST to an address at the remote end of the link in order\
