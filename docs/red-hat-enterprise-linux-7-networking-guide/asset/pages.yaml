    # ## 16.2. SETTING UP SQUID AS A CACHING PROXY WITH LDAP AUTHENTICATION


    This section describes a basic configuration of Squid as a caching proxy that
    uses LDAP to authenticate users. The procedure configures that only authenticated
    users can use the proxy.


    # ### Prerequisites


    +   - The procedure assumes that the /etc/squid/squid.conf file is provided by
    the squid package.

    If you edited this file, remove the file and reinstall the package.

    - An service user, such as uid=proxy_user,cn=users,cn=accounts,dc=example,dc=com
    exists in the LDAP directory. Squid uses this account only to search for the authenticating
    user. If the authenticating user binds this to the directory to verify the authentication.


    # ### Procedure


    +   1. Install the squid package:


    ```

    # yum install squid

    ```


    +   2. Edit the /etc/squid/squid.conf file:


    +   - To configure the basic_ldap_auth utility, add the following configuration
    entry to the top of /etc/squid/squid.conf:


    ```

    auth_param basic_program /usr/lib64/squid/basic_ldap_auth -b

    "cn=proxy,cn=users,cn=accounts,dc=example,dc=com" -D

    "uid=proxy_user,cn=users,cn=accounts,dc=example,dc=com" -W

    /etc/squid/ldap_password -f "(&(objectClass=person)(uid=%s))" -ZZ -H

    ldap://server.example.com:389

    ```


    The following describes the parameters passed to the basic_ldap_auth helper utility
    in the example above:


    +   - B base_DN sets the LDAP search base.

    - D proxy_service_user_DN sets the distinguished name (DN) of the account Squid
    users to search for the authenticating user in the directory.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '+   - -W path_to_password_file sets the path to the file that contains the
    password of the proxy service user. Using a password file prevents the password
    is visible in the operating system''s process list.


    +   - - LDAP_filter specifies the LDAP search filter. Squid replaces the %s variable
    with the user name provided by the authenticating user.


    The (&(object=person)(uid=%s)) filter in the example defines that the user name
    must match the value used in the uid attribute and that the directory entry contains
    the person object.


    +   - -ZZ enforces a TLS-encrypted connection over the LDAP protocol using the
    STARTTLS command. Opt the -ZZ in the following situations:


    +   - The LDAP server does not support encrypted connections.


    +   - The port specified in the URL uses the LDAPS protocol.


    +   - The -H LDAP_URL parameter specifies the protocol, the host name or IP address,
    and the port of the LDAP server in URL format.


    b. Add the following ACL and rule to configure that Squid allows only authenticated
    users use the proxy:


    ```

    acl ldap-auth proxy_auth REQUIRED

    http_access allow ldap-auth

    ```


    ![](img/6432d27ad634c9a7f868191ca63abe75_267_0.png)


    # IMPORTANT


    > Specify these settings before the http_access deny all rule.


    c. Remove the following rule to disable bypassing the proxy authentication from
    IP ranges specified in localnet ACLs:


    ```

    http_access allow localnet

    ```


    d. The following ACL exists in the default configuration and defines 443 as a
    port that uses the HTTPS protocol:


    ```

    acl SSL_ports port 443

    ```


    If users should be able to use the HTTPS proxy also on other ports, add an ACL
    for each of these ports:


    ```

    acl SSL_ports port port_number

    ```


    e. Update the list of acl Safe_ports rules to configure to which ports Squid can
    establish a connection. For example, to configure clients using the proxy can
    only access resources on port 21 (FTP), 80 (HTTP), and 443 (HTTPS), keep only
    the following acl Safe_ports statements in the configuration:'
