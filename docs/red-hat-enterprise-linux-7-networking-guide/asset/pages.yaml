- img_proc: true
  md: '# CHAPTER 2. GETTING STARTED WITH NETWORKMANAGER


    # 2.1. OVERVIEW OF NETWORKMANAGER


    In Red Hat Enterprise Linux 7, the default networking service is provided by NetworkManager,
    which is a dynamic network control and configuration daemon to keep network devices
    and connections up when they are active. The traditional ifcfg type configuration
    files are still supported. See Section 2.6, "Using NetworkManager with Network
    Scripts" for more information.


    # 2.1.1. Benefits of Using NetworkManager


    The main benefits of using NetworkManager:


    +   - Making network management easier: NetworkManager ensures that network connectivity
    works. When it detects there is no network configuration in a system but there
    are network devices, NetworkManager creates temporary connections to provide connectivity.


    +   - Providing easy setup of connection to the user: NetworkManager offers management
    through different tools: GUI, nmcli, - See Section 2.5, "NetworkManager Tools."


    +   - Supporting flexibility. For example, using a WiFi interface, NetworkManager
    shows the available wifi networks. You can select an interface, and NetworkManager
    displays the required credentials providing automatic connection after the reboot
    process. NetworkManager can configure network aliases, IP addresses, static routes,
    DNS information, and VPN connections, as well as any connection-specific parameters.
    You can modify the configuration to reflect your needs.


    +   - Offering an API over D-Bus which allows applications to query and control
    network configuration and state. In this way, applications can check or configure
    networking through D-BUS. For example, the Cockpit web-based interface, which
    monitors and configures servers through a web browser, uses the NetworkManager
    D-BUS interface to configure networking.


    +   - Maintaining the state of devices after the reboot process and taking over
    interfaces which are set into managed mode during restart.


    +   - Handling devices that are not explicitly set unmanaged but controlled manually
    by the user or another network service.


    # 2.2. INSTALLING NETWORKMANAGER


    NetworkManager is installed by default on Red Hat Enterprise Linux. If it is not,
    enter as root:


    ```

    ~# yum install NetworkManager

    ```


    For information on user privileges and gaining privileges, see the Red Hat Enterprise
    Linux System Administrator''s Guide.


    # 2.3. CHECKING THE STATUS OF NETWORKMANAGER


    To check whether NetworkManager is running:


    ```

    ~$ systemctl status NetworkManager

    NetworkManager.service - Network Manager

    ```'
  merge: -1
