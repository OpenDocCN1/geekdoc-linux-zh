    Active load balancing is possible with this runner in the same way as it is done\
    \ for the loadbalance\nner. To enable active transmit (Tx) load balancing, add\
    \ the following section:\n\n```\n\"tx_balancer\": {\n  \"name\": \"basic\"\n}\n\
    ```\n\nPlease see the teamd.conf(5) man page for more information.\n\n# 8.13.7.\
    \ Configure Monitoring of the Link State\n\nThe following methods of link state\
    \ monitoring are available. To implement one of the methods, add the\nJSON format\
    \ string to the JSON format configuration file using an editor running with root\n\
    privileges.\n\n# 8.13.7.1 Configure Ethtool for link-state Monitoring\n\nTo add\
    \ or edit an existing delay, in milliseconds, between the link coming up and the\
    \ runner being\nnotified about it, add or edit a section as follows:\n\n+   -"
