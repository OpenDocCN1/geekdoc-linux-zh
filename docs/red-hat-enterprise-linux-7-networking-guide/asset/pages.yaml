    # 10.4.2. Configure 802.1Q VLAN Tagging using ip Commands


    To create an 802.1Q VLAN interface on Ethernet interface enps0, with name VLAN8
    and ID **8**, issue a command as **root**:


    ```

    ~# ip link add enps0 name enps0.8 type vlan id 8

    ```


    To view the VLAN, issue the command:


    ```

    $ ip -d show enps0.8

    4: enps0.8@enps0:BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state
    UP DEFL

    link/ether 52:54:00:ce:5f:66 brd ff:ff:ff:ff:ff promiscuity 0

    vlan protocol 802.1Q id 8 <REORDER_HDR>

    ```


    Note that the ip utility interprets the VLAN as a hexadecimal value if it is preceded
    by **0x** and as octal value if it has a leading **0**. This means in order to
    assign a VLAN ID with a decimal value of **22**, you must not add any zeros.


    To remove the VLAN, issue a command as **root** as:


    ```

    ~# ip link delete enps0.8

    ```


    To use multiple interfaces belonging to multiple VLANs, create locally enps0.1
    and enps0.2 with the appropriate VLAN ID on top of a physical interface enps0:


    ```

    ~# ip link add enps0 name enps0.1 type vlan id 1

    ip link set dev enps0.1 up

    ~# ip link add enps0 name enps0.2 type vlan id 2

    ip link set dev enps0.2 up

    ```


    Note that running a network sniffer on a physical device, you can capture the
    tagged frames reaching the physical device, if no VLAN is configured on top of
    enps0. For example:


    ```

    tcpdump -nei enps0 -vvv

    ```


    ![](img/6432d27ad634c9a7f868191ca63abe75_172_0.png)


    > **NOTE**

    VLAN interfaces created using ip commands at the command prompt will be lost if
    the system is shut down or restarted. To configure VLAN interfaces to be persistent
    after a system restart, use **ifcfg** files. See Section 10.4.1, "Setting Up 802.1Q
    VLAN Tagging Using ifcfg Files"


