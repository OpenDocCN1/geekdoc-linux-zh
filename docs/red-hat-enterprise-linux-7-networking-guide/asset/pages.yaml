  md: "```\n\"tx_hash\": [\"eth\", \"ipv4\", \"ipv6\"],\n\"tx_balancer\": {\n  \"\
    name\": \"basic\"\n},\n\"ports\": {\"em1\": {\\}, \"em2\": {}}\n}\n```\n\nConfiguration\
    \ for active transmit (Tx) load balancing using basic load balancer.\n\nPlease\
    \ see the teamd.conf(5) man page for more information.\n\n# 8.13.6. Configure\
