    The MTU setting determines the maximum size of the network packet. The maximum
    size of the payload the link-layer frame can carry in units limits the network
    MTU. For standard Ethernet frames this is MTU of 1500 bytes. It would not be necessary
    to change the MTU when setting up a VLAN as the link-layer frame is increased
    by 4 bytes to accommodate 802.1Q.


