    Use this connection only for resources on your network

    Select this to prevent the connection from becoming the default route. Typical
    examples are where a connection is a VPN tunnel or a leased line to a head office
    and you do not want any Internet-bound traffic to pass over the connection. Selecting
    this option means that traffic specifically destined for routes learned automatically
    over the connection or entered manually will be routed over the connection.


    # 4.4. CONFIGURING STATIC ROUTES WITH IP COMMANDS


    As a system administrator, you can configure static routes using the ip route
    command.

    To display the IP routing table, use the ip route command. For example:


    ```

    ~$ ip route

    default 192.168.122.1 dev ens9 proto static metric 1024

    192.168.122.0/24 dev ens9 proto kernel scope link src 192.168.122.107

    ```'
