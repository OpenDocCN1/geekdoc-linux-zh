- img_proc: true
  md: 'This section describes how to run a script and how to use custom commands in
    network scripts.


    The term network scripts refers to the /etc/init.d/network and any other installed
    scripts it calls. Although NetworkManager provides the default networking service,
    scripts and NetworkManager can run in parallel and work together. Red Hat recommends
    to test them first.


    # Running Network Script


    Run a network script only with the systemctl command:


    ```

    systemctl start|stop|restart|status

    ```


    The systemctl utility clears any environment variables and ensures correct execution.


    In Red Enterprise Linux 7, NetworkManager is started first, and /etc/init.d/network
    checks with NetworkManager to avoid tampering with NetworkManager''s connections.
    NetworkManager is intended to be the primary application using sysconfig configuration
    files, and /etc/init.d/network is intended to be secondary.


    The /etc/init.d/network script runs:


    +   1. using one of the systemctl commands start|stop|restart,


    2. on boot and shutdown if the network service is enabled - as a result of the
    systemctl command.


    It is a manual process and does not react to events that happen after boot. Users
    can also call the ifup and ifdown scripts manually.


    # NOTE


    > The systemctl reload network.service command does not work due to technical
    limitations of initscripts. To apply a new configuration for the network service,
    use the restart command:


    ~# systemctl restart


    This downs and brings up all the Network Interface Cards (NICs) to load the new
    configuration. For more information, see the Red Hat Knowledgebase solution Reload
    and force-reload options for network service.


    # Using Custom Commands in Network Scripts


    Custom commands in the /sbin/ifup-local, ifdown-local, scripts are not executed
    if these devices are created by the /etc/init.d/network service. The ifup-local
    file does not exist by default. If required, create it under the /sbin/ binary.


    The ifup-local script is readable only by the initscripts and not by NetworkManager.
    create it under the dispatcher.d/ directory. See the section called "Running Dispatcher
    scripts".'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Networking Guide


    # IMPORTANT


    Modifying any files included with the initscripts package or related rpms is not
    recommended. If a user modifies files, Red Hat does not provide support.


    Custom tasks can run when network connections go up and down, both with the old
    network scripts and with NetworkManager. If NetworkManager is enabled, the ifup
    and ifdown script will ask NetworkManager whether NetworkManager manages the interface
    in question, which is found in the "DEVICE" line in the ifcfg file.


    Devices managed by NetworkManager:


    # calling ifup


    When you call ifup and the device is managed by NetworkManager, there are two
    options:


    +   - If the device is not already connected, then ifup asks NetworkManager to
    start the connection.

    - If the device is already connected, then nothing to do.


    # calling ifdown


    When you call ifdown and the device is managed by NetworkManager:


    +   - ifdown asks NetworkManager to terminate the connection.


    Devices unmanaged by NetworkManager:


    If you call either ifup or ifdown, the script starts using the old, non-NetworkManager
    mechanism that it used since the time before NetworkManager existed.


    # Running Dispatcher scripts


    NetworkManager provides a way to run additional custom scripts to start or stop
    services based on the connection status. By de facto, the /etc/NetworkManager/dispatcher/
    directory exists and NetworkManager runs scripts, each script must be an executable
    file owned by root and must have write permission only for the file. For more
    information running NetworkManager dispatcher scripts, see the Red Hat Knowledgebase
    How to write a NetworkManager dispatcher script to apply ethctl commands.


    # 2.7. USING NETWORKMANAGER WITH SYSCONFIG FILES


    The /etc/sysconfig/ directory is a location for configuration files and scripts.
    Most network configuration information is stored there, with the exception of
    VPN, mobile broadband and PPPo configuration, which are stored in the /etc/NetworkManager/
    subdirectories. For interface-specific information is stored in the /ifcfg files
    in the /etc/sysconfig/network-scripts/ directory.


    For global settings, use the /etc/sysconfig/network file. For VPNs, mobile broadband
    and PPPoE connections are stored in /etc/NetworkManager/system-connections/.


    In Hat Enterprise Linux 7 if you use an ifcfg file, NetworkManager is not automatically
    aware of the change and has to be prompted to notice the change. If you use one
    of the tools NetworkManager profile settings, NetworkManager does not implement
    these changes until you reconnect that. For example, if ifcfg files have been
    changed using an editor, NetworkManager must read the configuration files again.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'To ensure this, enter as root to reload all connections profiles:


    ```

    ~# nmcli connection reload

    ```


    Alternatively, to reload one changed file, ifcfg-ifname.


    ```

    ~# nmcli load /etc/sysconfig/network-scripts/ifcfg-ifname

    ```


    Note that you can specify multiple file names using the above command.


    Changes made using tools such as nmcli do not require a reload but do require
    the associated interface

    be put down and then again:


    ```

    ~# nmcli disconnect interface-name

    ```


    ```

    ~# nmcli con up-interface

    ```


    For more details about nmcli, see Section 3.3, "Configuring IP Networking with
    nmcli".


    NetworkManager does not trigger any of the network scripts, though the network
    scripts attempt to

    tigger NetworkManager if it is running when the ifup commands are used. Section
    2.6, "Using

    NetworkManager with Scripts" for the explanation of the network scripts.


    The ifup script is a generic script that does a few things and calls interface-specific
    scripts such as

    ifup-device_name, ifup-wireless, ifup-ppp, and so on. When a user runs ifup ens30
    manually:


    +   1. ifup looks for a file /etc/sysconfig/network-scripts/ifcfg-enp30


    +   2. if the ifcfg exists, ifup looks for the TYPE key in that to determine which
    type-specific

    script to call;


    +   3. ifup calls if-wireless or ifup-device_name based on TYPE;


    +   4. the type-specific scripts do type-specific;


    +   5. the type-specific scripts let common functions IP-related tasks like DHCP
    or static

    setup.


    On bootup, /etc/init.d/network reads through all the ifcfg files and for each
    one that has

    ONBOOT=yes, checks whether NetworkManager is already starting the DEVICE from
    that ifcfg file. If

    NetworkManager is starting or has already started, nothing is done for that file,
    and

    the next ONBOOT=yes continue with their traditional behavior and call ifup for
    that ifcfg.


    The result is that ifcfg that has ONBOOT=yes is expected to be started on system
    boot,

    either by NetworkManager or by the inscripts. This ensures that some legacy network
    types

    NetworkManager does not handle (such as ISDN or dial-up modems) as well as any
    new

    application not supported by NetworkManager are still correctly started by the
    inscripts even

    tough NetworkManager is unable to handle them.


    # IMPORTANT


    It is recommended not to store the backup files anywhere within the /etc directory,
    or

    the same location as the live files, because the script literally does ifcfg*:
    Only these

    extensions are excluded: .old, .orig,.rpmnew, .rmporig, and .rpsave.


    ![](img/6432d27ad634c9a7f868191ca63abe75_22_0.png)'
