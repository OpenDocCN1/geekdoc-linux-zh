    \  \"link_watch\": {\"name\": \"ethtool\"},\n  \"ports\": {\"em1\": {\\}, \"em2\"\
    : {}}\n}\n```\n\nConnection for a link aggregation control protocol (LACP) capable\
    \ counterpart. The can be used for\nLACP runner should use ethtool to monitor\
