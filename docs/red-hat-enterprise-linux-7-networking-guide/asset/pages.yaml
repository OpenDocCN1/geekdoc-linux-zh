    # 5.3. USING MACSEC WITH WPA_SUPPLICANT AND NETWORKMANAGER


    Media Access Control Security (MACsec); IEEE 802.1AE encrypts and authenticates
    all traffic in LANs with the GCM-AES-128 algorithm. MACsec can protect not only
    IP but also Address Resolution Protocol (ARP), Neighbor Discovery (ND), or DHCP.
    While IPsec operates on the network layer (layer 3) and SSL and TLS on the authentication
    layer (layer 7), MACsec operates in the data link layer (layer 2). Combine MACsec
    with security protocols for networking layers to take advantage of different security
    features that these standards provide.


    To enable MACsec with a switch that performs authentication using a pre-shared
    Connectivity Key/CA Key (CAK/CKN) pair:


    # Procedure


    +   1. Create a CAK/CKN pair. For example, the following command generates a 16-byte
    key in hexadecimal notation:


    ```

    ~$ dd if=/dev/urandom count=16 bs=1 >/dev/null | hexdump -e ''1/2 "%02x''

    ```


    +   2. Create the wpa_supplicant.conf configuration file and add the following
    lines to it:


    ```

    ctrl_interface=/var/run/wpa_supplicant

    eapol_version=3

    ap_scan=0

    fast_reauth=1

    ```'
