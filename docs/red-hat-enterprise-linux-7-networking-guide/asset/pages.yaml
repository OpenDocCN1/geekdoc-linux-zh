    To create a new team interface, with name ServerA:


    ```

    $ nmcli connection add type team ifname ServerA

    Connection ''team-ServerA'' (b954c62f-5fddd-4339-97b0-40efac734c50) successfully
    added.

    ```


    NetworkManager will set its internal parameter connection.autoconnect to yes and
    as no IP address given ipv4.method will be set to auto. NetworkManager will also
    write a configuration file to /etc/sysconfig/network-scripts/ifcfg-teamServerA
    where the connection ONBOOT will be set to yes and BOPROTO will be set to dhcp.


    Note that changes to the file will not be noticed by NetworkManager until the
    interface is next brought up. See Section 2.7, "Using NetworkManager with sysconfig
    files" for more information on using configuration files.


    To view the other values assigned:


    ```

    $ nmcli show team-ServerA

    connection.id: team-ServerA

    connection.uid: b954c62f-5fddd-4339-97b0-40efac734c50

    connection.interface-name: ServerA

    connection.type: team

    connection.autoconnect: yes

    ipv4.method: auto [output truncated]

    ```


    As no JSON configuration file was specified the default values apply. See the
    teamd.conf(5) man page for more information on the team JSON parameters and their
    default values. Notice that the name was derived from the interface name by preceding
    the type. Alternatively, specify a name with the con-name option as follows:


    ```

    $ nmcli connection add team con-name Team0 ServerB

    Connection ''Team0'' (57f160a1-09f6-4204-b8f0-6d9ea91218a7) successfully added.

