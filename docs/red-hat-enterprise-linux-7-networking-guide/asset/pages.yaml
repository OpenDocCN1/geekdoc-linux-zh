  md: '# [P<domain>]p<b><s><slot>[f<function>][d<dev_id>]


    PCI geographical location. In PCI geographical location, the [P<domain>] number
    is only mentioned if the value is not 0. Example.


    ID_NAME_PATH=/p1enp5s0


    # [P<domain>]p<b><s><slot>[f<function>][u<port>][.][c<config>][i<interface>]


    USB port number. For USB devices, the full chain of number of hubs is composed.
    If the name gets longer than the maximum number of 15 characters, the name is
    not exported. If there are multiple USB devices in the chain, the default values
    for USB configuration descriptors (c1) and USB interface descriptors (io) are
    suppressed.


    # 11.4. NAMING SCHEME FOR NETWORK DEVICES AVAILABLE FOR LINUX ON SYSTEM Z


    Use the bus-id to createable device names for network interfaces in Linux System
    z instances. The bus-id identifies a device in the scope of a Linux instance.
    For a CCW device, the bus ID is the device''s device number with a leading n,
    which is the subnet channel. For example, 0.1-0ab1.


    Network interfaces of device Ethernet are named as follows:


    +   - enccw0.0.1234


    CTC network devices of device type SLIP are named as follows:


    +   - slccw0.0.1234


    Use the znet -c command or the lscsc -a command to display available network devices
    and their-IDs.


    Table 11.1. Device Name Types for Linux on System z


    | Format | Description |

    |---|---|

    | enccw-ID | device type Ethernet |

    | slccw-ID | CTC network devices of device type SLIP |


    # 11.5. NAMING SCHEME FOR VLAN INTERFACES


    Traditionally, VLAN interface names in the format: interface-name.VLAN-ID are
    used. The VLAN-ID ranges from 0 to 4096, which is a maximum of four characters
    and the total interface name has a limit of 15 characters. The maximum interface
    name length is defined by the kernel headers and is a global limit, affecting
    all applications.


    In Red Hat Enterprise Linux 7, for naming conventions for VLAN interface names
    are supported:


    VLAN plan VLAN ID'
