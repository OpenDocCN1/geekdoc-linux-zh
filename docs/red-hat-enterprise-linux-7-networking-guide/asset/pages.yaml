  md: '# Logging Network Guide


    The **logging** statement allows you to use multiple types of logs, called **channels**.
    By using the **channel** option within the statement, you can construct a customized
    type of log with its own file name (**file**), size limit (**size**), version
    (**version**), and level of importance (**severity**). Once a channel is defined,
    a **category** option is used to categorize the channel and begin logging when
    the **named** service is restarted.


    By default, named service sends messages to the **rsyslog** daemon, which places
    them in **/var/log/messages**. Several standard channels are built into BIND with
    various severity levels, such as **default_sys** (which handles logging messages)
    and **default_debug** (which specifically handles debugging messages). A default
    channel, **default**, uses the built-in channels to dump normal logging without
    any special configuration.


    Customizing the logging process can be a very detailed process and is beyond the
    scope of this chapter. For information on creating custom BIND logs, see the BIND
    9 Administrator Reference Manual in [Section 15.2.8.1, "Installed Documentation"].


    # server


    The **server** statement allows you to specify options that affect how the **named**
    service should respond to remotes, especially with regard to notifications and
    zone transfers.


    The **transfer-format** option controls the number of resource records that are
    sent with each message. It can be either **one-answer** (one resource record),
    or **many-answers** (multiple resource records). Note that while the **many-answers**
    option is more efficient, it is not supported by older versions of BIND.


    # trusted-keys


    The **trusted-keys** statement allows you to specify associated public keys used
    for secure **DNS** (DNSSEC). See [Section 15.2.6.4, "DNS Security Extensions (DNSSEC)"]
    for more information on this topic.


    # view


    The **view** statement allows you to create special views depending upon which
    the host querying the nameserver is. This allows some hosts to receive one answer
    regarding a zone while other hosts receive totally different information. Alternatively,
    certain zones may only be available to particular trusted views while non-trusted
    hosts can only make queries for other zones.


    Multiple views can be used as long as their names are unique. The **match-clients**
    option allows you to specify the IP addresses that apply to a particular view.
    It overrides the already configured global options. Finally, **view** statements
    contain multiple **zone** statements that apply to the **match-clients** list.


    Note that the order in which the **view** statements are listed is important,
    as the first statement that matches a client''s IP address is used. For more information
    on this topic, see [Section 15.2.6.1, "Multiple Views"].


    # 15.2.2.4. Comment Tags


    Additionally to statements, the **/etc/named.conf** file can also contain comments.
    Comments are ignored by the **named** service, but can prove useful when providing
    additional information to a user. The following are valid comment tags:


    ```

    //

    ```


    Any text after the // characters to the end of the line is a comment. For example:'
  merge: -1
