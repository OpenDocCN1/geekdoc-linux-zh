  md: '# ## Chapter 8


    # # Amazon SimpleDB: A Cloud Database


    In this chapter you’ll discover how to use Amazon SimpleDB to store data for your
    application. Amazon SimpleDB is a refreshingly simple alternative to the traditional
    (and very complex) relational database. We’ll review the conceptual basis behind
    Amazon SimpleDB, then learn how to use it with a number of self-contained code
    samples and a more complex real-world example. We’ll finish with a quick look
    at a browser-based tool for SimpleDB.


    # ## Introduction


    Many web applications would use a general purpose relational database such as
    Oracle or MySQL to store user data: account names, passwords, file lists, preferences,
    links, and so forth. Because they’re general purpose, these products have become
    very complex over time, with thousands of pages of documentation, layers of libraries
    and tools, and an entire industry devoted to training and support.


    Amazon SimpleDB is a cloud-based database. There’s no need to buy, install, or
    maintain any hardware or configure any software. You only spend half the time
    designing the database schema ahead of schedule because changes are easy to make
    and there’s no requirement to take the database offline to do so.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Building a highly scalable system and then actually scaling it becomes much
    simpler. SimpleDB itself makes sure that sufficient disk space and CPU power are
    available, automatically taking advantage of parallelism by spreading the load
    across multiple disks and servers as needed. This intrinsic, under-the-covers
    scaling and redundancy provides for fault tolerance and high availability without
    the need for monitoring or manual intervention.


    The data storage model is clean, simple, and easy to learn, as is the programming
    model. SimpleDB excels at storing semi-structured data where the items (rows)
    are similar but not necessarily identical to each other.


    All data stored in Amazon SimpleDB is automatically indexed, so you’re free from
    having to make any indexing decisions. Your existing knowledge of SQL (Structured
    Query Language) will still be relevant; you can retrieve data using SQL select
    queries. There are no software upgrade issues, because you’re always running the
    current version of the code.


    The Amazon SimpleDB model lacks support for joins across domains (roughly equivalent
    to relational tables); instead, you can store data in non-normalized form for
    more efficient access.


    As you’ll soon see, Amazon SimpleDB’s model supports the data storage needs of
    many types of applications. You can spend your time focusing on your application
    and on meeting the needs of your users, instead of worrying about low-level database
    issues.


    # ## Amazon SimpleDB


    The Amazon SimpleDB model encompasses a small number of concepts and a compact
    programming interface. You can learn the basics of SimpleDB and have some code
    up and running in an hour or two. In this section, we’ll review the concepts that
    comprise SimpleDB, take a peek at the programming model, and then examine the
    SimpleDB pricing model.


    # ## Amazon SimpleDB Concepts


    An Amazon SimpleDB **domain** is roughly analogous to a table in a relational
    database. Each domain exists within the scope of a particular AWS account and
    has a readable name, such as *employees* or *feeds*. Each domain can store up
    to 10GB of'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'data. Applications with a need to store more than ten gigabytes can easily
    spread the data across multiple domains. Each AWS account is allotted 100 domains.
    ${ }^{1}$


    Each item in a SimpleDB domain has a name (unique to the domain) and up to 256
    attributes (name-value pairs). Item names, attribute names, and attribute values
    can each be up to 1,024 bytes long. Each domain can store up to one billion attributes.


    Item attributes can be multivalued. In fact, each attribute can have up to 256
    values. For example, the attribute Size could be three distinct values "8", "10",
    and "12". Each value in an attribute counts toward the limit of 256 attributes
    per item. All attribute values are treated as strings. This has some important
    and less obvious implications when storing and querying numerical values. All
    values are automatically indexed.


    Inserts, deletes, and updates to SimpleDB items are done using the API. Queries
    are done using SQL select queries through the API.


    Let’s take a look at some of the ways that SimpleDB’s data model can be used to
    store complex data sets in a single domain.


    Imagine that we need to store data about some people (I’ll refer to this as the
    People domain in the SQL examples below). We start off with a simple model like
    this:


    | Item Name | FirstName | LastName | Age | Sex |

    | --- | --- | --- | --- | --- |

    | Rec1 | Tom | Basic | 12 | M |

    | Rec2 | Nancy | Hacker | 15 | F |


    Later, we decide to store middle names if known. We start storing this attribute
    for newly added records:


    | Item Name | FirstName | LastName | Age | Sex | Middle |

    | --- | --- | --- | --- | --- | --- |

    | Rec1 | Tom | Basic | 12 | M |  |

    | Rec2 | Nancy | Hacker | 15 | F |  |

    | Rec3 | Joan | Hughes | 44 | F | K |


    > ${ }^{1}$ You can request additional domains if you require more than 100 for
    your application.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'There’s no need to update records **Rec1** and **Rec2** (but this can be done,
    of course). The attribute **Middle** simply doesn’t exist for those records. Next,
    we decide to store the states where each person has lived. Again, we just start
    storing this new attribute:


    | Item Name | FirstName | LastName | Age | Sex | Middle | State |

    |---|---|---|---|---|---|---|

    | Rec1 | Tom | Basic | 12 | M | | |

    | Rec2 | Nancy | Hacker | 15 | F | | MD |

    | Rec3 | Joan | Hughes | 44 | F | Kraft | NY, NJ, DC, IL, MD, PA |


    As you can see, this could easily be extended to store other one-to-many relationships
    such as children, parents, job titles, and so forth.


    # # Amazon SimpleDB Programming Model


    We’ll dive into some real code shortly. The Amazon SimpleDB programming model
    consists of just nine calls:


    +   - At the domain level, **CreateDomain** creates a new domain, **ListDomains**
    returns a list of existing domains, and **DeleteDomain** deletes a domain. **DomainMetadata**
    returns usage information about the domain.


    +   - At the item level, **PutAttributes** creates new items and adds or replaces
    (your choice) additional attributes to existing items. **BatchPutAttributes**
    is an extended version of this call that handles multiple items at once. **DeleteAttributes**
    removes attributes from an item and **GetAttributes** retrieve specified attributes.
    **Select** issues a SQL query.


    And that’s it! A complete data storage system.


    Amazon SimpleDB’s SQL language takes the form of a standard select statement with
    extensions to handle multi-valued attributes. Here are some samples:


    ```

    ```

    select * from People where FirstName="Tom"

    ```

    ```


    The above query would retrieve **Rec1** in the previous table.'
