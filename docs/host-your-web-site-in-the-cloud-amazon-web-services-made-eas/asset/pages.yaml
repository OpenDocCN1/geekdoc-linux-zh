- pgno: 69
  md: 'decision-making can be automated. The output from two or more command line
    tools can be blended together. All things considered, these tools still serve
    a purpose.


    Amazon supplies a number of command line tools. The first set is called API tools
    because there''s one tool for each function in the EC2 API. For example, the `ec2-run-instances`
    command is a wrapper around the EC2 RunInstances function. The tools are written
    in Java; the source, however, is unavailable. The EC2 API tools are divided into
    four packages:


    +   1. The Amazon EC2 API Tools ${}^{15}$ provide access to the core EC2 API functions.

    +   2. The Amazon CloudWatch API Tools ${}^{16}$ provide access to the CloudWatch
    API functions.

    +   3. The Auto Scaling API Tools ${}^{17}$ provide access to the Auto Scaling
    API functions.

    +   4. The Elastic Load Balancing API Tools ${}^{18}$ provide access to the Elastic
    Load Balancing API functions.


    Amazon also supplies a set of AMI tools. ${}^{19}$ More special-purpose in nature,
    you use these tools to create, upload, and register customized Amazon Machine
    Images (AMIs).


    Members of the AWS developer community have created a number of command line tools.
    Some of these focus on providing access to a single service; others aim to be
    all-encompassing. A good example of the latter is Tim Kay''s top-rated `aws` command.
    ${}^{20}$ This aspiring Swiss Army Knife now provides functions for EC2 services,
    S3, and SQS. Written in Perl, this script runs on Linux and Windows.


    # Visual Tools


    At the top of the stack we find the visual tools. Developers have really exercised
    their creativity in this area and there are many tools to choose from; I''ll cover
    a few of my favorites here. There are at least four types of tools:


    +   ${}^{15}$ http://developer.amazonaws.com/connect/entry.jsp?externalID=351&categoryID=251

    +   ${}^{16}$ http://developer.amazonaws.com/connect/entry.jsp?externalID=253&categoryID=251

    +   ${}^{17}$ http://developer.amazonaws.com/connect/entry.jsp?externalID=253&categoryID=251

    +   ${}^{18}$ http://developer.amazonaws.com/connect/entry.jsp?externalID=368

