- pgno: 364
  md: "```\ncloudlist/include/cloudfunctions.inc.php (excerp)\n\nfunction runQuery($sdb,\
    \ $query)\n{\n    $next = '';\n    $results = array();\n\n    do\n    {\n    \
    \    $res = $sdb->select($query, array('NextToken' => $next));\n        if (!$res->isOK())\n\
    \        {\n            return null;\n        }\n\n        $next = isset($res->body->SelectResult->NextToken)\
    \ ?\n               (string) $res->body->SelectResult->NextToken\n           \
    \    : '';\n\n        foreach ($res->body->SelectResult->Item as $item)\n    \
    \    {\n            $attributes = array();\n            foreach ($item->Attribute\
    \ as $attribute)\n            {\n                $attributes[(string) $attribute->Name]\
    \ =\n                       (string) $attribute->Value;\n            }\n\n   \
    \         $Key = (string) $item->Name;\n            $results[$Key] = $attributes;\n\
    \        }\n    } while ($next != '');\n\n    return $results;\n}\n```\n\nThis\
    \ function accepts a SimpleDB query as a string, makes a series of calls to the\
    \ **select** method to retrieve all the results, and then returns a PHP associative\
    \ array that contains all the results. We can then write some very simple wrappers\
    \ around this function to return arrays of all cities and categories:"
  merge: -1
  img_proc: true
