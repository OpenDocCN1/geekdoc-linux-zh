    | High Memory Extra Large | 64-bit | 2 | 3.25 | 17.1GB | 420GB | $0.50 |

    | High Memory Double Extra Large | 64-bit | 2 | 3.25 | 34.2GB | 850GB | $1.20
    |

    | High Memory Quadruple Extra Large | 64-bit | 8 | 3.25 | 68.4GB | 1,690GB | $2.40
    |

    | Cluster Compute | 64-bit | 8 (two processors, each with 4 cores) | 2.5 | 23GB
    | 1,690GB | $1.60 |


    As you can see from the table, the larger instance types have faster cores and
    more of them.


    You need to consider a number of factors when you choose the EC2 instance types
    for your application. First, you''ll need to make sure that your application is
    compat-'
