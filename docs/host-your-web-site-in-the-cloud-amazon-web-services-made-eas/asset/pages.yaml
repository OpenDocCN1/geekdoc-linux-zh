- pgno: 148
  md: 'If you launched an EBS-backed AMI, you have an additional option. You can choose
    **Stop** from the **Instance Actions** menu. The operating system will be cleanly
    shut down, and the status of the instance will change to *stopped*. Later, you
    can choose to start the instance again and it will boot up with all the files
    on the root file system remaining intact. This additional flexibility is among
    one of the many reasons to prefer EBS-backed AMIs over their older S3-backed cousins.


    # # Assigning an IP Address


    Let’s give this instance a permanent IP address of its own. Close your SSH session
    with the `exit` command, and then return to the AWS Management Console. Click
    on **Elastic IPs** in the *Navigation* pane and press the **Allocate New Address**
    button. Press the **Yes, Allocate** button in the dialog to confirm your wish
    to allocate a new IP address. After a very brief pause, your newly allocated address
    will be listed in the **Addresses** list.


    At this point the address is yours, but is still unassociated with any particular
    EC2 instance. Let’s remedy that. Click on the address in the list to select it,
    and then press the **Associate** button, which will bring up the dialog shown
    in Figure 5.14.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_148_0.png)


    Select the appropriate instance ID in the menu, and press the **Associate** button
    in the dialog. Now create a new SSH session using the Elastic IP address instead
    of the host name. If you happen to have a spare domain name and a DNS provider,
    you can map the domain name to the public IP address.


    Recall that you’re charged for allocated but unmapped IP addresses. If you decide
    to terminate your instance and have no need for the IP address anymore, be sure
    to release it using the AWS Management Console.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# # Creating an EBS Volume


    Now that you have an instance and an IP address, let''s create, attach, and format
    a storage volume.


    Once created, you can attach an EBS volume to any of the instances that are in
    the same Availability Zone as the volume. Since our instance is already running,
    let''s figure out which zone it''s running in. Return to the AWS Management Console,
    and select the **Instances** view. Click on the row of your instance and inspect
    the detailed instance properties displayed at the bottom, as shown in Figure 5.15.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_149_0.png)


    My instance is in zone `us-east-1a`. Click on **Volumes** in the **Navigation**
    pane, press the **Create Volume** button, and you will be presented with the dialog
    box shown in Figure 5.16.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_149_1.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'The dialog form accepts values in units of **gibibytes** (GiB) and **Tebibytes**
    (TiB). These are the power-of-two analogs of the more familiar gigabytes (GB)
    and terabytes (TB), both of which represent powers of ten. One gibibyte is 1,073,741,824
    bytes, whereas one gigabyte is 1,000,000,000 bytes.


    Enter the desired volume size (10GiB is a good value) and select the Availability
    Zone of your instance. Leave the other fields as they are and press the **Create**
    button. The new volume will appear in the EBS Volumes list, with a **creating**
    status. Wait a few seconds, press the **Refresh** button, and the status should
    change to **available**.


    Now select the volume and press the **Attach** button (or right-click on it and
    choose **Attach Volume**) to reveal the Attach Volume dialog shown in Figure 5.17.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_150_0.png)


    Figure 5.17. Attaching an EBS Volume to an Amazon EC2 instance


    Select your instance, keep a record of the value in the **Device** field, and
    press the **Attach** button. Refresh the EBS Volumes list until the **Attachment
    Information** column contains the word “attached.”


    At this point the new EBS volume is attached to your instance, but not yet ready
    to store files. Head over to your SSH session and put a file system on the newly
    attached volume:


    ```

    <dev>: mkfs -F /dev/sdf

    ```


    After this command completes, `/dev/sdf` is ready to store files. Create a mount
    point and mount the file system on it like this:'
  merge: -1
  img_proc: true
- pgno: 151
  md: '```

    <cde/>: mkdir /data\

    <cde/>: mount /dev/sdf /data

    ```


    You now have a persistent, high-performance disk volume running on EBS. Keep in
    mind that you''ll be charged for the storage allocated to the EBS volume whether
    you put files on it or not.


    # Testing Apache


    The Apache web server The Apache web server is already installed, configured,
    and running on the LAMP Web Starter AMI. Take your IP address, put an http://
    prefix on it, and visit the resulting URL in your browser. Figure 5.18 shows what
    you''ll see.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_151_0.png)


    You''ll probably recognize this as the output of the PHP phpinfo function.'
  merge: -1
  img_proc: true
