  md: 'I stacked the instances vertically, the volumes in a horizontal row, and the
    snapshots in a vertical column. Figure 10.5 shows a cleaned-up version of my sketch.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_346_0.png)


    Each instance and its attached parts occupies a rectangular space on the final
    image, with a surrounding margin represented by LEFT\_MARGIN, RIGHT\_MARGIN, TOP\_MARGIN,
    and BOTTOM\_MARGIN. The instances, volumes, and snapshots are drawn as rectangles
    of size INSTANCE\_WIDTH by INSTANCE\_HEIGHT, VOLUME\_WIDTH by VOLUME\_HEIGHT,
    and SNAP\_WIDTH by SNAP\_HEIGHT, respectively. TEXT\_MARGIN allows for some space
    between the edge of each rectangle and the text inside, and TEXT\_LINE\_HEIGHT
    is the space between lines of text. VOLUME\_GAP is the horizontal space between
    volume rectangles and SNAP\_GAP is the vertical space between snapshot rectangles.


