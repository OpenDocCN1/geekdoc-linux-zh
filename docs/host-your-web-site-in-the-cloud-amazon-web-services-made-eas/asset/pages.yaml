    # Amazon SimpleDB Pricing


    Your Amazon SimpleDB usage is charged based on three usage dimensions: data transfer,
    data storage, and machine utilization.


    Your data transfer charges are based on the amount of data transferred in and
    out of SimpleDB. Data transferred into SimpleDB is charged at a rate of $0.10
    per gigabyte. Once again, this amount is prorated. Data transferred out of SimpleDB
    is charged on a sliding scale starting at $0.17 per gigabyte and reduces based
    on volume, reaching $0.10 per gigabyte for all outgoing data transfer in excess
    of 150 terabytes per month. There''s no charge for data transferred within a Region;
    you pay nothing to transfer data between an EC2 instance and a SimpleDB domain
    in the same Region.


    You pay $0.25 (a quarter) per gigabyte per month to store data in SimpleDB, prorated
    on time and on the actual amount stored. There''s an overhead of 45 bytes per
    item, 45 bytes per attribute name, and 45 bytes per name-value pair.


    Finally, you pay $0.14 per hour for the machine time used to process each SimpleDB
    request. Complex requests (for instance, more items, more attributes, or sophisticated
    select queries) will take more time than simple ones. SimpleDB returns the time
    used by each request in the **BoxUsage** field.


    As of this writing (but subject to change), there''s a free tier of usage for
    SimpleDB. The first 25 hours of machine time, the first gigabyte of data storage,
    and the first gigabyte of data transfer are all free.'
