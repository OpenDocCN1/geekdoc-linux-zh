    \ Values\n\nLet’s improve on the cheesy attribute access code above. Here’s a\
    \ function to turn the array of SimpleXML nodes in the returned response into\
    \ a PHP associative array:\n\n```\nchapter_08/include/book.inc.php (excerpt)\n\
    \nfunction getItemAttributes($item)\n{\n  $attrs = array();\n\n  foreach ($item->Attribute\
    \ as $attribute)\n  {\n    $name = (string) $attribute->Name;\n    $value = (string)\
    \ $attribute->Value;\n\n    if (isset($attrs[$name]))\n    {\n      if (is_array($attrs[$name]))\n\
    \      {\n        $attrs[$name][] = $value;\n      }\n      else\n      {\n  \
    \      $attrs[$name] = array($attrs[$name], $value);\n      }\n    }\n    else\n\
    \    {\n      $attrs[$name] = $value;\n    }\n  }\n  return $attrs;\n}\n```"
