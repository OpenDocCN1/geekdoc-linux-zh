    # # Learning and Using Apache JMeter


    Let''s take a short detour to learn more about a very useful program, the Apache
    JMeter.


    # ## Why JMeter?


    If you''re running the charting program from the previous section and monitoring
    a nearly idle EC2 instance, you''ll see little in the way of highs and lows. You
    can generate a system load manually by doing tasks such as:


    +   * copying large files from place to place (generates disk read and write operations)

    +   * downloading large files from the Internet (generates a load that''s reflected
    in the Network In metric)

    +   * placing large files on the server and downloading them externally (generates
    a load that''s reflected in the Network Out metric)

    +   * sorting very large files (increases CPU utilization, and disk read and disk
    write operations)


    Unless you write some sophisticated test scripts, you''ll quickly tire of doing
    this. Also, since generating a load is often the first step in a system optimization
    effort, you''ll need to be able to reproduce the load with some degree of precision.


    The Apache JMeter application simplifies the process of stress-testing a web-based
    application. Once a test plan has been created, it can be run at any time with
    a single click. The results are measured and stored for analysis.


