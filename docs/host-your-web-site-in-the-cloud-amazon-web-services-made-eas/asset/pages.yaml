  md: "+   □ Domain is the name of the domain, of course.  \n+   □ Items is the number\
    \ of items in the domain.  \n+   □ Attrs is the number of unique attribute names\
    \ in the domain.  \n+   □ Values is the number of attribute name-value pairs in\
    \ the domain.  \n+   □ Name Size is the total size of all the item names in the\
    \ domain, in bytes.  \n+   □ Attr Name Size is the total size of all the unique\
    \ attribute names in the domain, in bytes.  \n+   □ Attr Value Size is the total\
    \ size of all the attribute values in the domain, in bytes.\n\nThe sum of the\
    \ last three values is the amount of storage used by the domain. Here’s an example\
    \ of the output:\n\n```\n```\n$ php metadata.php\nfiles:\n  Item Count:      12\n\
    \  Attrs:           3\n  Values:          36\n  Name Size:       201\n  Attr Name\
    \ Size:  12\n  Attr Value Size: 681\n```\n```\n\n# # Processing and Storing RSS\
    \ Feeds with Amazon SimpleDB\n\nLet’s wrap up this chapter with a real-world example.\
    \ SimpleDB is great for storing semi-structured data, where the items are similar\
    \ to each other, but some variation exists at the detailed level.\n\nIn this section,\
    \ the program will process a list of RSS feeds, typically representing blogs or\
    \ another type of news or information source. Each feed is represented by a URL,\
    \ such as http://www.jeff-barr.com/?feed=rss2. A feed starts out with some header\
    \ data fields such as a title, a link, a publication date, and a description.\
    \ Most of these fields are optional. The remainder of the feed is occupied by\
    \ the individual news or blog items. Each one can have (among other things) a\
    \ title, a link, a description, and a GUID (a globally unique identifier).\n\n\
    The program uses the Magpie RSS parser<sup>3</sup> open source library.\n\n> <sup>3</sup>\
    \ http://magpierss.sourceforge.net/"
