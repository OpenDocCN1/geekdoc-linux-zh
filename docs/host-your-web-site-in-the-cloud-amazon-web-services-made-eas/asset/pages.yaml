- pgno: 168
  md: '# ## Closing Thoughts


    We''ve learned a lot in this chapter. We''ve learned about persistent and ephemeral
    EC2 resources, security groups, and the EC2 pricing model. We then prepared our
    keys and launched our very first EC2 instance. We gave it a public IP address
    and created an EBS volume, then verified that the Apache web server was running
    as expected. From there we downloaded and installed CloudFusion and ran a test
    script. We learned all about AMIs—where to find them, how to choose them, and
    how to create them from scratch. Along the way we became familiar with many aspects
    of the AWS Management Console, and we learned how to allocate and manipulate EC2
    resources using the actual EC2 APIs.


    Before wrapping up this chapter I would like to leave you with a few closing thoughts.


    The ease with which you can start, configure, and terminate instances should make
    you start to think about them in a different way. Instead of looking at your server
    as a one-off, very precious piece of hardware, you can see it as an expandable,
    temporary resource. If you need a second server to test a new version of your
    code, just go ahead and launch it. If you want to see how your code performs with
    a different Linux distribution or with a newer version of MySQL, again, just go
    ahead and launch an instance.


    I''m fairly sure that you''ll have gained an appreciation for the richness and
    power embodied in the AWS Management Console. As you saw in the code sample presented
    at the end of this chapter, all this power is available through the EC2 APIs as
    well.'
