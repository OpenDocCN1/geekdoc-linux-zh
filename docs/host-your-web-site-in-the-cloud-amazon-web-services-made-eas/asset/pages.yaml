- pgno: 306
  md: '![](img/4a5ba0dd041e08e6a67fa31d52309995_306_0.png)


    Figure 9.11. Taking a snapshot backup


    Enter a name for the DB Snapshot and press the **Yes, Take Snapshot** button.


    The console will automatically switch to the **DB Snapshots** page and your new
    snapshot should be present, with a status of *creating*. The status will change
    to *available* after a few minutes.


    The snapshots always reflect the state of the database at the time the snapshot
    was started. There’s no need to flush data to disk or to suspend the application.
    You can click on the **Recent Events** tab in the lower half of the console to
    see the events generated when the snapshot was taken, as shown in Figure 9.12.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_306_1.png)


    Figure 9.12. Recent events pertaining to our snapshot


    # # Scale-up Processing


    Let’s pretend that you’ve used this DB Instance for testing, and you’re now ready
    to move it into production. You’re really happy with the system and expect to
    see a veritable flood of users on the first day. Because you’ll be drinking champagne
    and eating cake while this is happening, you decide to scale up the processing'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'power in advance of the flood. Right-click the DB Instance and select the **Modify**
    option; you''ll be led to the screen shown in Figure 9.13.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_307_0.png)


    Figure 9.13. Scaling up a DB Instance


    Select the new DB Instance Class and check **Apply Immediately**, then press the
    **OK** button. The state of the DB Instance will change to **modifying**, and
    a new entry will appear in the **Recent Events** tab to indicate that the Instance
    Class is being modified. Once the modification is complete, the state will be
    **available** and a corresponding event will appear. As you can see from my event
    log—shown in Figure 9.14—the entire scaling operation took just six minutes.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/4a5ba0dd041e08e6a67fa31d52309995_308_0.png)


    If you receive less traffic than you expected, you can scale down to a smaller
    and less expensive DB Instance type in the same way.


    You can increase the amount of storage allocated to the instance using the same
    **Modify** operation, but you can never decrease it.


    # Scale-up Storage


    After you return from your chamapagne and cake, you check your RDS monitoring
    and see that your free storage is now down to less than 1GB. Time to add more!
    Right-click the DB Instance and choose **Modify**. This time, change the **Allocated
    Storage** to a larger value, as shown in Figure 9.15. Remember to check **Apply
    Immediately**.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_308_1.png)


    Your instance will remain operational and accessible while Amazon RDS adds more
    storage, so you can do this at any time. Again, use the **Recent Events** tab
    to check on the progress of the modification. My event log showed that increasing
    allocated'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'storage from 5GB to 8GB took less than five minutes. The increased storage
    allocation is visible in the Monitoring tab, as you can see in Figure 9.16.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_309_0.png)


    # Create a DB Instance from a DB Snapshot or to a Point in Time


    The AWS Management Console also allows you to create a DB Instance from any of
    your DB Snapshots or to the exact state in which it was at any point in time within
    the backup retention period. You can initiate these operations from the **DB Snapshots**
    and **DB Instances** pages, respectively.


    # Convert to Multi-AZ


    You can convert your Single-AZ DB Instance to a Multi-AZ DB Instance (and vice
    versa) at any time. You can initiate this process from the console by invoking
    the **Modify** operation and changing the value of the **Multi-AZ Deployment**
    setting, as shown in Figure 9.17.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_309_1.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'The conversion from Single-AZ to Multi-AZ took just seven minutes for my sample
    instance with 8GB of allocated storage. The state of the DB Instance will transition
    from **available** to **modifying** (and back) during the modification process,
    but the DB Instance remains online.


    # ## Delete DB Instances


    The final step in the life cycle of a DB Instance is deletion. Amazon RDS allows
    you to take a final snapshot of your instance so that you can capture its state
    just before you terminate it, as Figure 9.18 shows.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_310_0.png)


    The state of the DB Instance will transition from **available** to **deleting**
    before the instance disappears entirely.


    # ## And That’s a Wrap


    At this point you should know enough about Amazon RDS to start migrating your
    existing MySQL-powered application. You can export the data from your existing
    database and then import it into a new DB Instance using the information in the
    section called “Access the DB Instance” and the section called “Import Some Data”.


    You’ll need to alter your existing code to use the new connection string, and
    you’ll have to set up your DB Security Group to allow network access from your
    application layer.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'You can remove your existing backup regimen, and set up automated backups using
    the console.


    Once everything is working as desired, you can start to take advantage of additional
    Amazon RDS features such as the ability to change DB Instance types on demand
    or Multi-AZ deployment. From there you can think about how to incorporate Amazon
    RDS into your development and testing process in new and unique ways.'
