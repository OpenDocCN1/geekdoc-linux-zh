    # ## You Did It!


    Well, now you know how to launch an EC2 instance, set it up with an Elastic IP
    address, and create, attach, and format an Elastic Block Store volume. As you
    can probably see for yourself, it is actually quite easy to start and configure
    a basic EC2 instance.


    # ## All about AMIs


    Now we''re going to learn more about Amazon Machine Images (AMIs). We''ll take
    a look at the AMI catalog and discuss the origins of the AMIs found there. We''ll
    talk about the factors to consider when choosing an AMI, and then spend some time
    learning how to create a new AMI.


    # ## The AMI Catalog


    The EC2 AMI catalog<sup>8</sup> is shown in Figure 5.19.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_155_0.png)


    8 http://aws.amazon.com/amis'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'The AMI catalog lists and categorizes all the public EC2 AMIs. The center column,
    **Browse by Category**, allows you to view AMIs based on provider, operating system,
    or region. The last category is present because AMIs are local to a particular
    EC2 region. The first category, **Amazon Web Services**, contains the AMIs provided
    by Amazon. The second category, **Community**, contains AMIs built by members
    of the AWS developer community. The remaining categories list AMIs provided by
    companies such as Oracle, Sun, and IBM.


    Click on a category to see a list of AMIs, and then click on an item in the list
    to learn more about a particular AMI. Figure 5.20 illustrates the amount of information
    available for the **Ubuntu 9.04 Jaunty Server AMI Listing**.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_156_0.png)


    The AMI listing contains essential information about the AMI, including the AMI
    ID for each region where it’s available, the AMI’s provenance—who created it and
    what is inside—along with reviews, ratings, and discussion. Some of this information
    can also be obtained programmatically through the DescribeImages function or from
    the command line with the ec2-describe-images command.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Choosing an AMI


    You should consider a number of factors before choosing an AMI for a project.
    The AMI model provides you with lots of choices and plenty of flexibility. It’s
    up to you to make responsible and productive use of this important aspect of Amazon
    EC2. You must choose a CPU word size, an operating system, and (in some instances)
    an operating system distribution.


    In most cases you need to work backwards, starting with your application layer
    and making choices that ensure compatibility. In a complex architecture you may
    find that the best solution is heterogeneous, incorporating instances with more
    than one CPU word size, operating system, or operating system distribution.


    EC2 AMIs are available with a very wide variety of Linux distributions, including
    Fedora, Debian, Ubuntu, openSUSE, Red Hat Enterprise Linux, Oracle Enterprise
    Linux, and Gentoo. Choosing the *right* distribution is a complex topic and beyond
    the scope of this section. Factors to consider include:


    +   - compatibility with existing systems

    +   - reputation of the distribution

    +   - features specific to each distribution, such as package management

    +   - availability of commercial support

    +   - support for specific applications


    Because it is so simple to start up EC2 instances, you can do compatibility and
    performance testing quite easily. You can explore the features of each distribution
    and make sure that it will meet your needs without spending much money.


    # Creating a Custom AMI


    Why would you want to create an AMI of your own? You might want to freeze your
    system configuration so that you can launch additional instances that are identical
    to the first. You may like to share the configuration with your partners or customers,
    or share it with the entire EC2 community.


    Before we describe the AMI creation process, let’s take a quick look at some of
    the alternatives. Far from dissuading you from creating an AMI, I do want you
    to be aware that there are other ways to customize your EC2 instances. Here are
    some of the alternatives:'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   No Configuration—Perhaps you can do your work with a totally stock AMI.
    If you’re doing short-term experimental development, a predefined AMI may include
    everything you need. You can store your source code in an external source code
    control system or on an EBS volume. You can launch an instance when you arrive
    at the office, mount the volume, spend your day coding, and then unmount the volume
    and terminate the instance at the end of the day.


    +   Manual Configuration—If there’s no need for you to launch multiple copies
    of the same AMI and if the configuration procedure is short and simple, perhaps
    you can take a basic approach and manually configure your AMI after you start
    it. On Linux systems you can install all required packages with a single command.
    You can even create a shell script, store it in Amazon S3, and simply download
    and run it each time. Because you can stop and later restart an EBS-backed instance,
    manual configuration is sufficient in many situations.


    +   Automated Configuration—You have the ability to pass a string (up to about
    10,000 characters) of user data to each EC2 instance when you launch it. This
    data could be a reference to a script stored in Amazon S3, or it could be the
    script itself. 9 The script can perform the final customization of the instance,
    including retrieval of other scripts and configuration data from a source code
    repository.


    +   Automated Role-based Configuration—If your system incorporates multiple tiers
    with distinct system configurations for each tier, you can extend the Automated
    Configuration model to customize each tier—installing different packages and making
    other changes based on a parameter that describes the role of the instance. The
    roles are arbitrary and will depend on the application. For example, a three-tier
    application could have “web server,” “database master,” “database slave,” and
    “application server” roles.


    If none of the above options meet your needs, go ahead and make your own AMI.
    The process is quick and simple, and you’ll walk away with an even better appreciation
    of the power of cloud computing and AWS.


    The AMI creation process has become significantly simpler with the introduction
    of EBS-backed AMIs, and that’s what we’ll describe in this section. If you need
    to create an S3-backed AMI, you’ll need to study the EC2 documentation to learn
    more about the bundling, uploading, and registration steps.


    > 9 You can pass up to 16,384 bytes of data to an EC2 instance in this way.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Here are the steps involved in creating an AMI:


    +   1. Planning—deciding what you want to do.

    +   2. Image preparation—creating a reusable image.

    +   3. Image creation—creating an EBS snapshot of the image.

    +   4. Reusing—launching multiple copies of the AMI.

    +   5. Sharing—making the AMI accessible to others.


    # # Planning


    In this step you need to identify the purpose and content of your AMI, starting
    with the base operating system. From there you can load additional packages. You
    can also pre-populate the AMI with any special code or data that you’d like to
    make available to the users of your AMI.


    For the purposes of this example I’ll use the **Basic Fedora Core 8** AMI augmented
    with Apache, MySQL, CVS, Subversion, and emacs. The result will be a web development
    AMI that’s ready to use.


    If you’ll be making your AMI available to other users of EC2 , you should take
    care to document the contents so that potential users know exactly what’s inside.


    If you aspire to be a prolific builder of public AMIs, you should think about
    ways to automate the production process to reduce manual labor and give you the
    ability to regenerate an AMI on demand. As a builder, you also need to stay abreast
    of system updates and patches, so that you can provide your user base with fresh
    AMIs on a timely basis. A script and an accompanying checklist can make this process
    simple, efficient, and reliable.


    # ## Make Lists!


    > I’ve been a list maker for a very long time. I find that writing things down
    keeps my mind free of clutter and ensures that I remember any obvious steps. The
    system rebuild process for one of my older web projects is 29 steps long. Even
    though I last rebuilt the system four or five years ago, I’m confident that I
    have enough information in my checklist to do it with ease.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The image is simply the set of files that you want to package up in the AMI.
    You can prepare this set of files on a local (non-EC2) machine, or you can prepare
    them on an EC2 instance. If you''re using an EC2 instance, you can use the root
    file system of the running machine as the basis for your image, or you can create
    a large but empty file and do a system installation inside it. I will use the
    root file system of the running machine.


    The image creation process scoops up all the files on the root file system. It
    excludes files on other file systems (local or EBS) and it does not capture any
    state information external to the running instance—in particular, information
    about elastic IP addresses or EBS volumes. If your AMI requires this information
    in order to be fully functional, you''ll need to arrange for addresses to be assigned
    and/or volumes to be attached and mounted as part of the startup process.


    Let''s prepare an image! Start by booting up a fresh copy of the Basic Fedora
    Core 8 AMI and make sure to reference your Key Pair. Log in to the instance in
    the usual way and install all required packages:


    ```

    <dev>: yum -y install httpd mysql cvs svn emacs

    ```


    There''ll be a delay while all these are downloaded. Make any other desired changes.
    For example, make arrangements to start Apache when the system boots up. Go to
    the /etc/rc4.d directory and create a symbolic link to the proper init script:


    ```

    <dev>: cd /etc/rc4.d

    <dev>: ln -s ../init.d/httpd $15httpd

    ```


    Once you have the system set up the way you''d like it, reboot it to make sure
    that it comes up in the desired state. Simply right-click on the instance in the
    AWS Management Console and choose the Reboot option, as shown in Figure 5.21.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/4a5ba0dd041e08e6a67fa31d52309995_161_0.png)


    Figure 5.21. Rebooting the EC2 instance


    You can also run the **reboot** command from the command prompt if you’re logged
    in as **root**.


    Verify that all desired services are running, and make further changes or customiza-
    tions until you have the image working the way you want it. If you change low-level
    aspects of the boot process you may find that you’ve created an unbootable image.
    Just as is the case with a system running on real hardware, there’s no way to
    recover from this. You may want to start up a pair of instances and make each
    preferred change on the test instance, rebooting after each change. After a successful
    reboot you can apply the same change to the instance that you’ll use to create
    the reusable image. You can also bundle and upload snapshot versions of the image
    during the process. If you create an unbootable AMI you can back up a step or
    two, figure out what went wrong, and proceed from there. As I noted earlier, a
    good checklist will be of tremendous value here.


    Resist the urge to go hog-wild and install every package that you might need some
    day. Larger AMIs take longer to create and to boot. Adding extraneous packages
    to your system also increases its **attack surface**—anything that can be accessed
    by an unauthenticated user in an attempt to locate a security flaw. Install what
    you need and no more.


    # ## Image Scrubbing


    The image creation process copies all the files from the root file system, so
    you need to think about the files that you don’t want to include. You’d probably
    want to ex- clude log files, shell history files, and your AWS keys. Once again,
    a good checklist can avoid embarrassment and potential security issues.


    Shut down any unneeded services, remove shell history files such as **.bash_history**,
    empty out log files, and make sure that your AWS keys are stored elsewhere than
    the root file system. Here’s an example:'
  merge: -1
  img_proc: true
- pgno: 162
  md: '```

