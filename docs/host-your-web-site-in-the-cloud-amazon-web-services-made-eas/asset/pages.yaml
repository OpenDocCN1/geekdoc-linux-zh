    # ## Elastic Load Balancing Pricing


    Pricing for this feature is fairly simple. You pay for your load balancers by
    the hour. You also pay for all data transfer through your load balancers. You’ll
    be charged $0.025 (2.5 cents) per hour per load balancer and $0.008 (slightly
    less than a cent) for each gigabyte of data transferred through any of your load
    balancers. This is in addition to the normal EC2 bandwidth charges.


    This is definitely more economical than purchasing a hardware load balancer or
    running a software load balancer on an EC2 instance. You could run an elastic
    load balancer for several years before the hourly costs approached the purchase
    price of a similarly featured hardware load balancer.


    # ## Elastic Load Balancing in Operation


    Setting up a traditional hardware load balancer is an expensive, complicated,
    and time-consuming task. You need to acquire and install the hardware, attach
    it to your network, and then learn how to set it up. Once you have it up and running,
    the last thing you want to do is experiment with the settings in a way that could
    destabilize your production system.


    EC2’s elastic load balancing is inexpensive to use and can be set up in a matter
    of minutes. It’s easy to create test configurations, so that experimentation becomes
    risk-free and affordable.


    In this section we’ll set up an elastic load balancer and then use it to direct
    traffic to a pair of EC2 instances. We’ll alter some of the health check parameters
    along the way and retrieve some statistics using CloudWatch.


    You’ll need to have the API Tools installed in order to do this yourself.


    In the rest of this section, commands with the $ prompt were run from my local
    desktop. Commands with the <1b1>: prompt were run on an EC2 instance.'
