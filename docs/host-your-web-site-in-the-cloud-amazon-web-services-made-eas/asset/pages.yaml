- pgno: 63
  md: '# Chapter 3


    # # Tooling Up


    Now that you’re familiar with the range of Amazon Web Services and what they’re
    capable of, you may be wondering how we start using them. Before we start coding,
    however, we’ll need to tool up. I’ll spend some time on the visual tools (user
    interfaces and consoles) and command line tools. I’ll also discuss the level below
    the tools: the libraries available for a particular programming language. This
    book will focus on PHP, but I’ll provide some general rules for library selection.
    This chapter will also lead you through creating of your AWS account, installing
    CloudFusion, and the necessary command line tools.


    # ## Technical Prerequisites


    Before we go too much further, I want to ensure that my expectations regarding
    your programming and system management skills are correct. It’s also important
    that you have the right hardware and software at your disposal.


    # ### Skills Expectations


    Because this book is targeted at mid-level PHP programmers, I assume that you
    can already read and write PHP with some skill. I’ll avoid using any esoteric
    features'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'of PHP, but I''ll also avoid explaining the error_reporting function or the
    detailed behavior of foreach loops. I also expect you to know the mechanics of
    writing, debugging, and running PHP code.


    On the web technology side, I expect you to know HTML and some CSS, and a tiny
    bit of JavaScript.


    On the systems side, I assume that you''re comfortable with the Linux/Unix command
    line, as there''s no time to explain ls, scp, or grep. I assume that you''ve mastered
    the ins and outs of your text editor, be it vi, emacs, Notepad, or otherwise.


    These days, developers in small organizations are expected to know a thing or
    two about system administration. I assume that you, too, are quite the “devm inistrator”
    and that common system administration tasks, such as installing packages and examining
    log files, are part of your skill repertoire.


    # ## Hardware and Software Expectations


    In the sections that follow, I expect you to have a Mac or a PC that is connected
    to the Internet. Your PC can be running Windows, or it can be running the Linux
    distribution of your choice.


    It’s often useful to run some PHP code locally. Packages like WAMP for Windows¹
    or MAMP for the Mac² make it easy to install and configure PHP, MySQL, and an
    Apache web server for local development. I’ll be talking about this again in the
    section called “Running the PHP Code in This Book”.


    You need a web browser. If all you have is Internet Explorer, that’s fine—but
    some of the visual tools take the form of Firefox extensions.


    You’ll need a good SSH (Secure Shell) client. For Windows use, my personal favorite
    is PuTTY,³ which is fast and reliable, and its terminal emulation is flawless.
    For Mac OS X and Linux, you can use the command line SSH clients that come with
    your operating system.


    +   1. http://www.wampserver.com/en/

    +   2. http://www.mamp.info/en/index.html

    +   3. http://www.chiark.greenend.org.uk/~sgtatham/putty/'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'If you work in a corporate setting and your desktop has been locked down, the
    cloud actually gives you a really interesting new option. You can launch an EC2
    instance running Windows, access it using the Windows Remote Desktop, and use
    that for development while leaving your desktop machine untouched.


    # ## Optional but Recommended


    My final three recommendations are that you have some spare domain names, a good
    DNS service, and a source code control system.


    Back when I was young, domain names were expensive ($75 per year) and complex
    to register. These days they''re cheap to acquire and registration is very simple.
    I recommend that you have at least one or two freely available as you work through
    the examples in this book.


    You should also have access to a DNS provider, so that you can map your domain
    names to IP addresses. When I was merely middle-aged I used to run my own DNS
    server. Since 2004 I''ve been a very happy customer of ZoneEdit. ⁴ You can have
    DNS service for up to five domains at no charge.


    You may want to think about a source code control system for your application
    as well. A source code control system hosted in the cloud will let you keep track
    of all the bits and pieces of your application, and will allow you to retrieve
    the newest code at any time. I have been using CVS Dude⁵ as my CVS host since
    2004. Since CVS is even more archaic than I am, ⁶ they also host the more modern
    Subversion system. Depending on the needs of your project, you may also want to
    consider GitHub,⁷ Google Code,⁸ or SourceForge.⁹ Some of the free systems require
    you to use a specific open source license, so read the fine print first.


    ⁴ http://www.zoneedit.com/


    ⁵ http://www.cvsdude.org/


    ⁶ In case you haven''t noticed, I enjoy poking fun at myself and making a big
    deal of the fact that I''m not exactly a spring chicken. I hope you enjoy my peculiar
    brand of humor.


    ⁷ http://github.com/


    ⁸ http://code.google.com/hosting/


    ⁹ http://sourceforge.net/'
  merge: -1
