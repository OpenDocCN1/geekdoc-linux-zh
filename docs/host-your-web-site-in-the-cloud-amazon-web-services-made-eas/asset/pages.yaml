- pgno: 49
  md: '# Chapter

    2


    # Amazon Web Services Overview


    In the previous chapter we discussed the concept of cloud computing in general
    terms. We listed and discussed the most interesting and relevant characteristics
    of the cloud. With that information as background, it''s now time to move from
    concept to reality.


    In this chapter I''ll introduce Amazon Web Services, or **AWS** for short. After
    a review of some key concepts I''ll talk about each AWS service.


    # Amazon and AWS Overview


    You''ve probably made a purchase at the Amazon.com¹ site. Perhaps you even bought
    this book from Amazon.com. One of my first purchases, way back in November 1996,
    was a book on Perl programming.


    Amazon.com Inc. was founded in 1994 and launched in 1995. In order to attain the
    scale needed to create a profitable online business, the company made strategic
    investments in world-scale internet infrastructure, including data centers in
    multiple locations around the world, high-speed connectivity, a plethora of servers,
    and the


    ¹ http://www.amazon.com/'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'creation of a world-class system architecture. With an active customer base
    in the tens of millions, each and every system component must be reliable, efficient,
    cost-effective, and highly scalable.


    Realizing that developers everywhere could benefit from access to the services
    that support Amazon’s web site, Amazon decided to create a new line of business.
    In early 2006, the company launched the Amazon Simple Storage Service (S3). Since
    then Amazon has brought a broad line of infrastructure, payment, workforce, merchant,
    and web analytic services to market under Amazon Web Services [AWS]. In this book
    I’ll focus on the infrastructure services. If you’d like to learn about the other
    services, please visit the AWS home page.²


    # ## Building Blocks


    AWS consists of a set of building-block services. The services are designed to
    work independently, so that you can use one without having to sign up for or know
    anything at all about the others. They are, however, also designed to work well
    together. For example, they share a common naming convention and authentication
    system. So, much of what you learn as you use one service is applicable to some
    or all the other services! This building-block approach also minimizes internal
    connections and dependencies between the services, which gives Amazon the ability
    to improve each service independently so that each works as efficiently as possible.


    Every function in AWS can be accessed by making a web service call. Starting a
    server, creating a load balancer, allocating an IP address, or attaching a persistent
    storage volume (to name just a few actions) are all accomplished by making web
    service calls to AWS. These calls are the down-to-the-metal, low-level interface
    to AWS. While it’s possible (and simple enough) to make the calls yourself, it’s
    far easier to use a client library written specifically for the programming language
    of your choice.


    # ## Protocols


    The web service calls use one of two popular protocols **SOAP** (once short for
    Simple Object Access Protocol, but now just a pseudo-acronym) or **REST** (an
    assimilation of Representational State Transfer). Because this book will focus
    on building useful applications and utilities, I will access AWS using a client
    library rather than'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'spending much time at the web service protocol layer. Suffice it to say that
    SOAP and REST are two different ways to initiate a call (or request) to a web
    service. Libraries and tools are layered on top of the **AWS APIs** (Application
    Programming Interfaces) to simplify the process of accessing the services.


    I guess I have to mention XML here too! XML is a fundamental part of the SOAP
    protocol. If you access AWS using a SOAP-based library you''ll have no dealings
