    | | [ ] | | |


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_301_0.png)


    Otherwise, select **CIDR/IP** and enter an IP address or IP address range in CIDR
    notation. If you’re connecting from a single address, simply enter that address
    followed by `/32` (this will ensure that only your machine will have access).
    If you’re going to be connecting from a range of addresses, you’ll need to ask
    for the CIDR address from your network administrator. Once you’ve entered the
    address, press the **Add** button, as shown in Figure 9.8.


    6 Log in to the AWS Management Console at http://aws.amazon.com. Your AWS Account
