  md: "+   ② When the `$items` array reaches 25 elements, we call a custom function\
    \ called WriteBatch.\n+   ③ Finally, we call the WriteBatch function if there\
    \ are any remaining items.\n\nHere’s the custom WriteBatch function:\n\n```\n\
    ```php\nchater_08/batch_insert_items.php (excerpts)\nfunction WriteBatch($ssdb,\
    \ &$items)\n{\n    $res = $ssdb->batch_put_attributes(BOOK_FILE_DOMAIN, $items,\
    \ true);\n    if ($res->isOK())\n    {\n        print(\"Inserted \" . count($items)\
    \ . \" items\\n\");\n        return true;\n    }\n    else\n    {\n        $error\
    \ = $res->body->Errors->Error->Message;\n        print(\"Could not insert items:\
    \ {$error}\\n\");\n        return false;\n    }\n}\n?>\n```\n```\n\nThe WriteBatch\
    \ function uses the `batch_put_attributes` method to insert all the items in the\
    \ `$items` array in one operation.\n\nWhen doing performance testing, I found\
    \ that the first insert script inserts 99 files in 8.6 seconds, while the batch\
    \ script inserts the same files in just 0.88 seconds, or ten times faster. Structuring\
    \ your program to take advantage of SimpleDB is clearly worthwhile."
