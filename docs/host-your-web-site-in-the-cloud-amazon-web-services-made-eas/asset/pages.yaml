- pgno: 287
  md: '# Chapter 9


    # Amaz on Relational Database Service


    In Chapter 8, I told you why your application might have no need for the full
    power of a relational database. That''s all well and good, but what if you want
    to move an existing MySQL-powered application to the cloud? Or, what if you need
    to perform complex queries or join data stored in two or more tables?


    In this chapter, we''ll take a look at the Amazon Relational Database Service
    (RDS). We''ll see how it lets you take advantage of MySQL''s power, while keeping
    you shielded from many of the more complex and time-consuming operational issues.


    # Introduction


    The Relational Database Service makes it easy for you to set up, operate, and
    scale a relational database in the cloud. You can use MySQL without spending time
    provisioning a server, installing an operating system, installing MySQL, watching
    for and installing operating system or database patches, upgrading the server
    and storage as your needs change, configuring failover, or scheduling backups
    and managing backup files. Amazon RDS handles many of these chores automatically,
    and packages the rest of them as simple web service calls. For example, you can'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'create an RDS DB Instance with a single web service call. The instance will
    be up and running and ready for use within a few minutes.


    After you finish reading this chapter, I think you’ll agree that Amazon RDS can
    actually change the way you think about a relational database. You can create,
    use, terminate, and restore your DB Instances on an as-needed basis.


    Perhaps you’re moving an application to the cloud and each installation of the
    application requires a private MySQL database. You can automate the entire installation
    and provisioning process. Each time a new customer signs up for your service,
    your code can call the RDS CreateDBInstance API operation to create a new DB Instance.


    Maybe you have a multi-tier application and you want to set up a fully automated
    test environment. Again, using the Amazon RDS APIs (or the command line tools),
    you can create, use, and terminate DB Instances as part of your testing process.


    Or, consider this: say your application accumulates data slowly but consistently
    throughout the month, and provides access to the data through some simple, low-overhead
    queries. At the end of each month, however, your application initiates a day-long
    billing run, during which the queries become complex and time-consuming. Using
    Amazon RDS, you can host the database on a system of moderate power for 95% of
    the month, scale up once per month to support the billing run, and then scale
    back down afterwards. You could do this on a daily, weekly, or even seasonal basis
    as your needs change. You can also add extra storage space to your database as
    your needs grow.


    Sound interesting? Let’s learn more!


    # MySQL Code Ahead


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_288_0.png)


    This chapter assumes that you have some basic familiarity with MySQL. If you know
    how to use the mysql command from the command line, you’re in good shape. Of course,
    you’ll need to have MySQL installed on your system; chances are you’re already
    good to go, as you’ve likely installed it along with PHP. If that’s not the case,
    Chapter 1 of Kevin Yank’s Build Your Own Database Driven Web Site Using PHP and
    MySQL is freely available on sitepoint.com, ${}^{1}$ and contains detailed installation
    instructions for every platform.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# ## Amazon Relational Database Service


    As we’ve seen time and time again throughout this book, AWS takes care of many
    of the underlying details so that you can focus on your application. Amazon RDS
    handles much of the operational complexity associated with the creation and maintenance
    of a relational database. Despite this, everything that you already know about
    MySQL still applies. You can use your existing tools, code, data, and queries.
    In this section we’ll examine some key Amazon RDS and MySQL concepts, take a peek
    at the Amazon RDS programming model, and wrap up with a look at the Amazon RDS
    pricing model.


    # ### Amazon RDS Concepts


    Most of the operations involving Amazon RDS are centered around a **DB Instance**.
    You can create the DB Instance as a **Single-AZ** or as a **Multi-AZ Deployment**
    (recall that, as we saw in the section called “Availability Zone” in Chapter 2,
    AZ is short for Availability Zone, and that AWS is designed so that failures affecting
    one AZ will not affect the others). The Multi-AZ Deployment offers increased availability
    and durability by synchronously replicating database updates between multiple
    Availability Zones, with automatic failover to a standby in the event of a failure.$^{2}$


    You must specify the DB Instance Class when you create a DB Instance. There are
    currently five DB Instance Classes, as shown in Table 9.1.$^{3}$Unlike EC2, which
    offers a choice of 32-bit and 64-bit instance classes, all of the RDS DB Instance
    Classes are 64-bit.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Table 9.1. Amazon RDS DB Instance Classesᵃ


    | Name | CPU Virtual Cores | CPU Core Speed (EC2 Compute Units) | RAM | Cost/Hour
    |

    | :--- | :--- | :--- | :--- | :--- |

    | Small | 1 | 1 | 1.7GB | $0.11 |

    | Large | 2 | 2 | 7.5GB | $0.44 |

    | Extra Large | 4 | 2 | 15GB | $0.88 |

    | Double Extra Large | 4 | 3.25 | 34GB | $1.55 |

    | Quadruple Extra Large | 8 | 3.25 | 68GB | $3.10 |


    ᵃ As is the case with all prices mentioned in this book, these are subject to
    change over time.


    You can change the class of a DB Instance in a matter of minutes, so avoid spending
    too much time trying to decide which one you’ll need up-front. The costs in Table
    9.1 reflect the cost of the Single-AZ deployment for a DB Instance. For Multi-AZ
    deployments, the cost for the DB Instance is double that for a Single-AZ deployment.


    The DB Instances have no fixed amount of storage. Instead, you specify an initial
    storage allocation of 5GB to 1,024GB when you create the DB Instance. You can
    add more space (up to the limit of 1,024GB) as your needs (and data) expand. The
    amount of space that you specify is known as the **allocated storage** for the
    DB Instance. Additional storage allocation can be added to your DB Instance on
    the fly without incurring downtime.


    You must specify a **DB Instance identifier** when you create a DB Instance. This
    is a string that must start with a lower-case letter and can contain up to 63
    lower-case letters, digits, and hyphens. The identifier cannot end with a hyphen,
    nor contain consecutive hyphens. The identifier must be unique within your account.


    Each DB Instance hosts a single copy of a particular **database engine**. The
    only supported engine at press time is version 5.1 of MySQL; the corresponding
    database engine identifier is `MySQL5.1`.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/4a5ba0dd041e08e6a67fa31d52309995_291_0.png)


    # **Storage Engines**


    MySQL uses the word "engine" to refer to storage engines such as InnoDB and MyISAM.
    Each table in a MySQL instance uses a particular storage engine. The automated
    backup feature of Amazon RDS (which we''ll get to in a minute) is currently supported
    only for InnoDB tables, since InnoDB supports reliable crash recovery. If you
    must use MyISAM tables with RDS, it''s vital that you stop all activity on each
    table, lock it, and then flush it before backing it up. ${ }^{4}$


    A DB Instance is always in a particular state. The principal states are **creating**,
    **backing-up**, **available**, **modifying**, and **deleting**. The DB Instance
    will spend most of its life in the available state; the other states are transient.


    Your application program and database tools must be able to establish a network
    connection with your DB Instances. In order to make this possible, you must associate
    a DB Security Group with the DB Instance, and you must authorize ingress (inbound
    access) to the DB Instance from a network address range or EC2 Security Group.
    Once you’ve done this, you can configure your program and tools to use the DB
    Instance’s Endpoint to establish a connection.


    Amazon RDS gives you the ability to control the parameters that affect low-level
    aspects of the database engine’s performance and behavior using DB Parameter Groups.
    Each group contains a list of configuration variables specific to the database
    engine. For the MySQL database, the DB Parameter Group will include values such
    as `innodb_additional_mem_pool_size` and `innodb_buffer_pool_size`. Some of the
    values are absolute, and others are specified using a formula; for example, `innodb_buffer_pool_size`
    is specified by the formula (DBInstanceClassMemory*3/4). This allows the Parameter
    Group to apply to all of the DB Instance Classes—as the value will be adjusted
    based on the features of the Instance Class. If a particular Parameter Group has
    no value for a parameter, then a default value that’s specific to RDS or the database
    engine is used. Your AWS account contains a default DB Parameter Group that you
    can use until you need to change a parameter. When you modify a parameter group
    you can choose to apply the update immediately, or on the next reboot of the DB
    Instance or Instances associated with the group. Some


    > ${ }^{4}$ The Amazon Relational Database Service Developer Guide contains more
    information about this topic; you can find it at http://docs.amazonwebservices.com/AmazonRDS/latest/DeveloperGuide/.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'parameters are dynamic and can be applied straight away. Others are static
    and require a reboot of the DB Instance.


    When you create a new DB Instance you must supply a master user name and a master
    user password. Amazon RDS will create an account on the database engine using
    the supplied values, which must then be used to create a connection to the database.
    This user is given the following MySQL permissions: SELECT, INSERT, UPDATE, DELETE,
    CREATE, DROP, RELOAD, PROCESS, REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE
    TEMPORARY TABLES, LOCK TABLES, EXECUTE, CREATE VIEW, SHOW VIEW, CREATE ROUTINE,
    ALTER ROUTINE, CREATE USER, EVENT, and TRIGGER.


    The Master User also has the GRANT option, so that they can grant permissions
    to user accounts that are created after the DB Instance is up and running.


    You can optionally supply a database name when you create a new DB Instance. If
    you supply a name, Amazon RDS will create an empty database with that name on
    the DB Instance.


    Each DB Instance has an associated maintenance window. The maintenance window
    gives you the flexibility to control when DB Instance modifications (such as scaling
    to a different DB Instance Class) and software patching occur. If a maintenance
    event is scheduled for a given week, it will be initiated and completed at some
    point during the four-hour maintenance window that you specify. Amazon RDS will
    apply any pending patches and parameter updates during the weekly four-hour period.
    By default, the window is set to a "quiet" time specific to each AWS Region. You
    can set the window to any desired part of the week if you have more insight into
    the best time (when the least number of users will be affected) for your particular
    application. The only maintenance events that require Amazon RDS to take your
    DB Instance offline are scale compute operations (which generally take a few minutes
    from start to finish) and required software patching. Required patching is automatically
    scheduled only for patches that affect security or durability. Such patching occurs
    infrequently (typically every few months) and should seldom require more than
    a fraction of the time in the maintenance window.


    The Amazon RDS APIs make the process of backing up a DB Instance simple and painless.
    RDS will initiate an automatic backup each day during the DB Instance''s backup
    window. The backup files will be retained for the number of days specified by
    the instance''s backup retention period. You can also create a DB Snapshot at'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'any time, which will be retained until you decide to delete it. You must assign
    a unique name to each DB Snapshot. Amazon RDS also stores the change logs for
    each database. The logs give you the ability to restore the database to the way
    it was at any point in time that''s within the backup retention period, yet older
    than the DB Instance''s latest restorable time. This time is typically within
    five minutes of the current time.


    In any of the cases described above, restoring the database actually means creating
    a new DB Instance from the associated backup files. If you think creatively, you
    should be able to come up with some really interesting ways to use this feature.
    What if your production application starts to misbehave and you want to dig into
    the database to see what''s going on? Take a snapshot, restore it to a new DB
    Instance, and analyze it in depth without impacting the production system. Deploying
    a new version of your code? Take a snapshot of the database first, and you can
    easily roll it back if you make a big mistake.


    Amazon RDS keeps track of events related to the following sources: DB Instances,
    DB Snapshots, DB Security Groups, and DB Parameter Groups. Each event includes
    a date and time, a source type, a source name, and a message. You can retrieve
    events by source type, source name, and date range.


    Each DB Instance reports the following metrics to CloudWatch:


    +   - CPU utilization

    +   - free storage

    +   - number of DB connections

    +   - number of read operations per second

    +   - number of write operations per second

    +   - read latency

    +   - write latency

    +   - read throughput

    +   - write throughput


    You can use these metrics to track the overall status and performance of each
    of your DB Instances. You can monitor the CPU utilization to drive your decision
    to scale to a larger or smaller DB Instance type, and you can watch the Free Storage
    to let you know when it''s time to allocate more storage to one of your DB Instances.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# # Amazon RDS Programming Model


    As is always the case with AWS, each aspect of the Amazon Relational Database
    Service is available through web service APIs. You can also use command line tools
    and the AWS Management Console to access and manipulate your RDS resources. The
    current version (2.5) of CloudFusion does not support RDS, so the examples in
    this chapter will make use of the command line tools and the console. It’s worth
    examining RDS at the API level, so let’s do that now.


    The `CreateDBInstance` function is used to create a new DB Instance. Other functions
    that operate on DB Instances include `DescribeDBInstances`, `ModifyDBInstance`,
    `RebootDBInstance`, and `DeleteDBInstance`.


    Another set of functions are used to create and manipulate DB Snapshots. These
    include `CreateDBSnapshot`, `DescribeDBSnapshots`, `DeleteDBSnapshot`, `RestoreDBInstanceFromDBSnapshot`,
    and `RestoreDBInstanceToPointInTime`.


    Functions for manipulating DB Parameter Groups include `CreateDBParameterGroup`,
    `DeleteDBParameterGroup`, `DescribeEngineDefaultParameters`, and `ModifyDBParameterGroup`.


    Similarly, the functions for manipulating DB Security Groups include `CreateDBSecurityGroup`,
    `DescribeDBSecurityGroups`, `DeleteDBSecurityGroup`, `AuthorizeDBSecurityGroupIngress`,
    and `RevokeDBSecurityGroupIngress`.


    The `DescribeDBEvents` function is used to gain access to the events produced
    by each of your RDS resources.


    # ## Amazon RDS Pricing


    Your use of the Amazon Relational Database Service is charged based on five usage
    dimensions: DB Instance hours, provisioned storage, storage I/O, backup storage,
    and data transfer.


    # ### DB Instance Hours


    Hourly pricing for the use of Single-AZ RDS DB Instances ranges from $0.11 to
    $3.10 per hour, as we saw in Table 9.1. Pricing for Multi-AZ DB Instances is double
    what’s shown in the table, but this price covers both your primary DB Instance
    and the associated standby.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "Billing begins when you create the DB Instance and continues, hour by hour,\
    \ until you terminate the DB Instance. Note that this is a different model than\
    \ that used by SimpleDB, so avoid confusing the two. As mentioned previously,\
    \ you can change the class of a DB Instance in a matter of minutes, so don't be\
    \ afraid to scale up and down as your needs dictate.\n\n# Provisioned Storage\n\
    \nThe provisioned storage associated with a DB Instance is billed at $0.10 per\
    \ GB per month for a Single-AZ instance, and twice that for a Multi-AZ instance.\
    \ You'll pay for the amount that you provision, even if you fail to use it. It's\
    \ easy (and quick) to provision additional storage, so there's no need to over-provision\
    \ in advance. You can watch the free storage metric for each of your DB Instances\
    \ to know when it's time to add additional storage.\n\n# Storage I/O\n\nYou're\
    \ charged $0.10 for each million I/O requests you make to the storage provisioned\
    \ for a DB Instance. Like all other AWS charges, this amount will be prorated\
    \ based on actual usage. A Multi-AZ instance will accumulate write requests twice\
    \ as fast as a Single-AZ instance, since the data is synchronously replicated\
    \ as it's written.\n\n# Backup Storage\n\nBackup storage is used for automated\
    \ daily backups and for any snapshot backups that you initiate.\n\nThere's no\
    \ charge for backup storage up to **100%** of the amount of storage that you've\
    \ provisioned for an active DB Instance. If you exceed this level, or if you terminate\
    \ the instance, additional backup storage is priced at $0.15 per GB per month.\n\
    \n# Data Transfer\n\nThis one is a little bit more complicated. Here are the rules:\n\
    \n+   The first gigabyte of data transfer in and out of Amazon RDS is free.\n\
    +   \n+   If you transfer data back and forth between an EC2 Instance and a DB\
    \ Instance in different Availability Zones of the same Region, you pay only for\
    \ the EC2 side of the data transfer ($0.01 per GB)."
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   There’s no charge for the zone-to-zone data transfer that occurs as part
    of a Multi-AZ deployment.


    +   There’s no charge for data transfer between an EC2 Instance and a DB Instance
    in the same Availability Zone.


    +   Data transferred into Amazon RDS that *isn’t* coming from an EC2 Instance
    is charged at $0.10 per GB.


    +   Data transferred *out* of Amazon RDS that isn’t going to an EC2 Instance is
    charged on a sliding scale that starts at $0.15 per GB.


    # ## Using Amazon RDS


    With the preliminaries out of the way, let’s now start playing with Amazon RDS.
    In this section you’ll sign up to use the Amazon Relational Database Service,
    take a tour of the AWS Management Console’s RDS support, and launch a Single-AZ
    DB Instance. We’ll configure the DB Instance’s DB Security Group, connect to the
    DB Instance from a remote client, and import some data. Once the DB Instance is
    up and running, we’ll monitor its performance, initiate a backup, and then learn
    how to scale up both processing and storage. We’ll create a DB Instance from a
    snapshot, and then terminate both of the DB Instances. You’ll be all set to use
    RDS in your own application.


    I’ll be using some test data for the exercises in this section, and I will size
    my DB Instance accordingly. If you already know how you’ll put Amazon RDS to use,
    feel free to adjust the parameters to suit.


    # ### Signing Up


    If you’ve yet to do so, you’ll need to go to the Amazon RDS page$^{6}$ and click
    on the button labeled **Sign Up For Amazon RDS**.


    # ### Tour the Console


    Once you’re signed up for Amazon RDS, open up the AWS Management Console at http://aws.amazon.com/,
    logging in to your AWS account again if necessary. To'
  merge: -1
