    # ## Processing Complex CloudFusion Data Structures


    It’s time to take a little detour.


    The CloudFusion functions that I have told you about thus far all return simple
    data structures—arrays of strings. However, the functions that I will use later
    in this chapter return a more complex data structure called a ResponseCore. S3
    returns its results in the form of an XML document; CloudFusion parses the XML
    using PHP’s SimpleXML package and includes the parsed objects in the response
    where they can be referenced by name.⁴


    The following code calls S3 to list the first 1,000 objects in the bucket BOOK_BUCKET,
    and then calls PHP’s handy print_r function to display the resulting object tree:


    ```

    ```php

    # chapter_04/list_bucket_objects_raw.php (excerpt)

    #!/usr/bin/php

    <?php


    error_reporting(E_ALL);


    require_once(''cloudfusion.class.php'');

    require_once('' include/book.inc.php'' );


    $S3 = new AmazonS3();

    $res = $S3->list_objects(BOOK_BUCKET);

    ```

    ```


    > ⁴ Complete documentation for SimpleXML can be found at http://www.php.net/simplexml.'
