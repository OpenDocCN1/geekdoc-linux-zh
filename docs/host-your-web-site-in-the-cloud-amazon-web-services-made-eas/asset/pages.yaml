    how you configure and customize your AMIs. You can build a set of distinct AMIs
    for each tier of your application, or you can create a generic AMI that self-customizes
    at startup time according to its role. AMIs can be stored in Amazon S3 or as Elastic
    Block Storage snapshots. The newer, snapshot-based model is faster and more flexible.
