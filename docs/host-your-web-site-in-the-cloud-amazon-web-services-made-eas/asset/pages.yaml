    # # Going Further with JMeter


    JMeter can place a heavy load on your desktop system and internet connection.
    The number of request threads and the number of HTTP request objects in your test
    plan directly affect the amount of memory and bandwidth needed to run the plan.
    If you find yourself limited by your desktop system’s capacity, you can turn to
    the EC2 web service for help. In fact, you can do this in two different ways:


    +   - Launch an EC2 instance running Windows, access it using Remote Desktop,
    install JMeter on this instance, and run your tests from there. If you launch
    the test driver instance in the same Availability Zones as your test subject (the
    EC2-powered server that you’re stress-testing), there’ll be no bandwidth charges.

    +   - Install the JMeter engine on an EC2 server (a Linux server will do just
    fine and will cost you less) and then control it from the JMeter instance running
    on your desktop. There’s more information about this in the Remote Testing section
    of the JMeter manual.<sup>12</sup>


