- pgno: 52
  md: 'In the section called “Key Concepts” below, I’ll discuss the basic functions
    (for example, *RunInstances*) and the associated command line tools (ec2-run-instances).
    Keep in mind that the same functionality can be accessed using visual tools supplied
    by Amazon or by third parties, and that you can always build your own tools using
    the same APIs.


    # Dollars and Cents


    Because AWS is a pay-as-you-go web service, there’s a separate cost for the use
    of each service. You can model your AWS costs during development time to gain
    a better understanding of what it will cost to operate your site at scale. With
    sufficient attention to detail you should be able to compute the actual cost of
    serving a single web page, or performing some other action initiated by one of
    your users. You can also use the AWS Simple Monthly Calculator⁴ to estimate your
    costs.


    With that in mind, let’s talk about pricing, metering, accounting, presentment,
    and billing before we look at the services themselves.


    Pricing involves deciding what to charge for, how often to charge, and how much
    to charge. AWS charges for resource usage at a very granular level. Here are some
    of the pricing dimensions that AWS uses:


    +   - Time—an hour of CPU time.

    +   - Volume—a gigabyte of transferred data.

    +   - Count—number of messages queued.

    +   - Time and space—a gigabyte-month of data storage.


    Most services have more than one pricing dimension. If you use an Amazon EC2 (Elastic
    Compute Cloud) server to do a web crawl, for example, you’ll be charged for the
    amount of time that the server is running and for the data that you fetch.


    The web site detail page for each AWS service shows the cost of using the service.
    Each AWS service is published and visible to everyone. The pricing for many of
    the services reflects volume discounts based on usage; that is, the more you use
    the service, the less it costs per event. Pricing for the services tends to decline
    over time.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'due to the effects of Moore''s Law and economies of scale. ${ }^{5}$ Pricing
    also reflects the fact that operating costs can vary from country to country.


    **Metering** refers to AWS measuring and recording information about your use
    of each service. This includes information about when you called the service,
    which service you called, and how many resources you consumed in each of the service’s
    pricing dimensions.


    **Accounting** means that AWS tabulates the metered information over time, adding
    up your usage and tracking your overall resource consumption. You can use the
    AWS Portal to access detailed information about your resource consumption.


    **Presentation** involves making your AWS usage available so that you can see
    what you’ve used and the cost you’ve incurred. This information is also available
    from the AWS portal.


    **Billing** indicates that AWS will charge your credit card at the beginning of
    each month for the resources you consumed in the previous month.


    Does any of this seem a little familiar? Indeed, your utility supplier (phone,
    water, or natural gas) takes on a very similar set of duties. This similarity
    causes many people to correctly observe that an important aspect of cloud computing
    is utility pricing.


    # # Key Concepts


    Let’s review some key concepts and AWS terms to prepare to talk about the services
    themselves. In the following sections, I include lists of some of the functions
    and commands that you can use to access the relevant parts of AWS mentioned below.
    These lists are by no means complete; my intention is to give you a better sense
    of the level of abstraction made possible by AWS, and also to hint at the types
    of functions that are available within the AWS API.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Availability Zone


    An AWS **Availability Zone** represents a set of distinct locations within an
    AWS Region. Each Availability Zone has independent power grid and network connections
    so that it’s protected from failures in other Availability Zones. The zones within
    a Region are connected to each other with inexpensive, low-latency connections.
    The Region name is part of the zone name. For example, `us-east-1a` is one of
    four zones in the `us-east-1` Region.


    The mapping of a zone name to a particular physical location is different yet
    consistent for each AWS account. For example, my `us-east-1a` is possibly different
    to your `us-east-1a`, but my `us-east-1a` is always in the same physical location.
    This per-user mapping is intentional and was designed to simplify expansion and
    load management.


    The `DescribeAvailabilityZones` function and the `ec2-describe-availability-zones`
    command return the list of Availability Zones for a Region.


    # Region


    An AWS **Region** represents a set of AWS Availability Zones that are located
    in one geographic area. Each AWS Region has a name that roughly indicates the
    area it covers, but the exact location is kept secret for security purposes. The
    current Regions are `us-east-1` (Northern Virginia), `us-west-1` (Northern California),
    `eu-west-1` (Ireland), and `ap-southeast-1` (Singapore). Over time, additional
    Regions will become available. The `DescribeRegions` function and the `ec2-describe-regions`
    command return the current list of Regions. You may choose to make use of multiple
    Regions for business, legal, or performance reasons.


    # Access Identifiers


    AWS uses a number of different **access identifiers** to identify accounts. The
    identifiers use different forms of public key encryption and always exist in pairs.
    The first element of the pair is public, can be disclosed as needed, and serves
    to identify a single AWS account. The second element is private, should never
    be shared, and is used to create a signature for each request made to AWS. The
    signature, when transmitted as part of a request, ensures the integrity of the
    request and also allows AWS to verify that the request was made by the proper
    user. AWS can use two different sets of access identifiers. The first comprises
    an Access Key ID and a Secret'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Access Key. The second is an X.509 certificate with public and private keys
    inside. You can view your access identifiers from the AWS portal.$^6$


    # Amazon Machine Image


    An **Amazon Machine Image (AMI)** is very similar to the root drive of your computer.
    It contains the operating system and can also include additional software and
    layers of your application such as database servers, middleware, web servers,
    and so forth. You start by booting up a prebuilt AMI, and before too long you
    learn how to create custom AMIs for yourself or to share, or even sell. Each AMI
    has a unique ID; for example, the AMI identified by `ami-bf5eb9d6` contains the
    Ubuntu 9.04 Janitny server. The DescribeImages function and the `ec2-describe-images`
    command return the list of registered instances. The AWS AMI catalog$^7$ contains
    a complete list of public, registered AMIs.


    # Instance


    An **instance** represents one running copy of an AMI. You can launch any number
    of copies of the same AMI. Instances are launched using `RunInstances` and the
    `ec2-run-instances` command. Running instances are listed using `DescribeInstances`
    and `ec2-describe-instances`, and terminated using the `TerminateInstances` function
    or the `ec2-terminate-instances` command. Before long you will also learn about
    the AWS Management Console, which is a visual tool for managing EC2 instances.


    # Elastic IP Address


    AWS allows you to allocate fixed (static) IP addresses and then attach (or route)
    them to your instances; these are called **Elastic IP Addresses**. Each instance
    can have at most one such address attached. The “Elastic” part of the name indicates
    that you can easily allocate, attach, detach, and free the addresses as your needs
    change. Addresses are allocated using the `AllocateAddress` function or the `ec2-allocate-address`
    command, and attached to an instance using the `AssociateAddress` function or
    the `ec2-associate-address` command.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Elastic Block Store Volume


    An **Elastic Block Store** (EBS) volume is an addressable disk volume. You (or
    your application, working on your behalf) can create a volume and attach it to
    any running instance in the same Availability Zone. The volume can then be formatted,
    mounted, and used as if it were a local disk drive. Volumes have a lifetime independent
    of any particular instance; you can have disk storage that persists even when
    none of your instances are running. Volumes are created using the CreateVolume
    function or the ec2-create-volume command, and then attached to a running instance
    using the AttachVolume function or the ec2-attach-volume command.


    # Security Group


    A **Security Group** defines the allowable set of inbound network connections
    for an instance. Each group is named and consists of a list of protocols, ports,
    and IP address ranges. A group can be applied to multiple instances, and a single
    instance can be regulated by multiple groups. Groups are created using the CreateSecurityGroup
    function and the ec2-add-group command. The AuthorizeSecurityGroupIngress function
    and the ec2-authorize command add new permissions to an existing security group.


    # Access Control List


    An **Access Control List** (ACL) specifies permissions for an object. An ACL is
    a list of identity/permission pairs. The GetObjectAccessControlPolicy function
    retrieves an object’s existing ACL and the SetObjectAccessControlPolicy function
    sets a new ACL on an object.


    # AWS Infrastructure Web Services


    Now that you know the key concepts, let’s look at each of the AWS infrastructure
    web services.


    # Amazon Simple Storage Service


    The **Amazon Simple Storage Service** (S3) is used to store binary data objects
    for private or public use. The S3 implementation is fault-tolerant and assumes
    that hardware failures are a common occurrence.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'There are multiple independent S3 locations: the United States Standard Region,
    Northern California Region, ${ }^{8}$ Europe, and Asia.


    S3 automatically makes multiple copies of each object to achieve high availability,
    as well as for durability. These objects can range in size from one byte to five
    gigabytes. All objects reside in buckets, in which you can have as many objects
    as you like. Your S3 account can accommodate up to 100 buckets or named object
    containers. Bucket names are drawn from a global namespace, so you''ll have to
    exercise some care and have a sound strategy for generating bucket names. When
    you store an object you provide a key that must be unique to the bucket. The combination
    of the S3 domain name, the globally unique bucket name, and the object key form
    a globally unique identifier. S3 objects can be accessed using an HTTP request,
    making S3 a perfect place to store static web pages, style sheets, JavaScript
    files, images, and media files. For example, here''s an S3 URL to a picture of
    Maggie, my Golden Retriever: http://sitepoint-aws-cloud-book.s3.amazonaws.com/maggie.jpg.


    The bucket name is **sitepoint-aws-cloud-book** and the unique key is **maggie.jpg**.
    The S3 domain name is s3.amazonaws.com.


    Each S3 object has its own ACL. By default, each newly created S3 object is private.
    You can use the S3 API to make it accessible to everyone or specified users, and
    you can grant them read and/or write permission. I set Maggie''s picture to be
    publicly readable so that you can see her.


    Other AWS services use S3 as a storage system for AMIs, access logs, and temporary
    files.


    Amazon S3 charges accrue based on the amount of data stored, the amount of data
    transferred in and out of S3, and the number of requests made to S3.


    # Amazon CloudFront


    Amazon **CloudFront** is a content distribution service designed to work in conjunction
    with Amazon S3. Because all Amazon S3 data is served from central locations in
    the US, Europe, and Asia, access from certain parts of the world can take several
    hundred milliseconds. CloudFront addresses this “speed of light” limitation with'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'a global network of edge locations (16 at press time) located near your end
    users in the United States, Europe, and Asia.


    After you have stored your data in an S3 bucket, you can create a CloudFront Distribution.
    Each distribution contains a unique URL, which you use in place of the bucket
    name and S3 domain to achieve content distribution. Maggie’s picture is available
    at the following location from CloudFront:


    http://d1io1cn8r1n0x7w.cloudfront.net/maggie.jpg


    As you can see, the object’s name is preserved, prefixed with a URL taken from
    the bucket’s distribution. The HTTP, HTTPS, and RTMP protocols can be used to
    access content that has been made available through CloudFront.


    CloudFront charges accrue based on the amount of data transferred out of CloudFront
    and the number of requests made to CloudFront.


    # # Amazon Simple Queue Service


    You use the **Simple Queue Service (SQS)** to build highly scalable processing
    pipelines using loosely coupled parts. Queues allow for flexibility, asynchrony,
    and fault tolerance. Each step in the pipeline retrieves work units from an instance
    of the queue service, processes the work unit as appropriate, and then writes
    completed work into another process for further processing. Queues work well when
    the requirements—be it time, CPU, or I/O speed—for each processing step for a
    particular work unit vary widely.


    Like S3, there are separate instances of SQS running in the US and in Europe.


    SQS usage is charged based on the amount of data transferred and the number of
    requests made to SQS.


    # # Amazon SimpleDB


    Amazon **SimpleDB** supports storage and retrieval of semi-structured data. Unlike
    a traditional relational database, SimpleDB does not use a fixed database schema.
    Instead, SimpleDB adapts to changes in the “shape” of the stored data on the fly,
    so there’s no need to update existing records when you add a new field. SimpleDB
    also automatically indexes all stored data so it’s unnecessary to do your own
    profiling or query optimization.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The SimpleDB data model is flexible and straightforward. You group similar
    data into domains. Each domain can hold millions of items, each with a unique
    key. Each item, in turn, can have a number of attribute/value pairs. The attribute
    names can vary from item to item as needed.


    Like the other services, SimpleDB was built to handle large amounts of data and
    high request rates. So there’s no need to worry about adding additional disk drives
    and implementing complex data replication schemes as your database grows. You
    can grow your application to world-scale while keeping your code clean and your
    architecture straightforward.


    SimpleDB charges accrue based on the amount of data stored, the amount of data
    transferred, and the amount of CPU time consumed by query processing.


    # # Amazon Relational Database Service


    The Amazon **Relational Database Service** (RDS) makes it easy for you to create,
    manage, back up, and scale MySQL database instances. RDS calls these **DB Instances**,
    and that’s the terminology I’ll be using in this book.


    RDS handles the tedious and bothersome operational details associated with running
    MySQL so that you can focus on your application. You don’t have to worry about
    procuring hardware, installing and configuring an operating system or database
    engine, or finding storage for backups. You can scale the amount of processing
    power up or down, and increase the storage allocation in a matter of minutes,
    so you can respond to changing circumstances with ease. You can back up your DB
    Instance to Amazon S3 with a single call or click, and create a fresh DB Instance
    from any of your snapshots.


    RDS also has a Multi-AZ (or Multi-Availability Zone) option that allows you to
    run a redundant backup copy of your DB Instance for extra availability and reliability.
    Amazon RDS charges accrue based on the amount of time that each DB Instance is
    running, and the amount of storage allocated to the instance.


    # # Amazon Elastic Compute Cloud


    The Elastic Compute Cloud (**Amazon EC2**) infrastructure gives you the ability
    to launch server instances running the AMI (Amazon Machine Instance) of your choice.
    Instance types are available with a wide range of memory, processing power, and'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'local disk storage. You can launch instances in any EC2 Region and you can
    choose to specify an Availability Zone if needed. Once launched, the instances
    are attached to your account and should remain running until you shut them down.


    Each instance is protected by a firewall which, by default, blocks all internal
    and external connectivity. When you launch instances you can associate any number
    of security groups with them. The security groups allow you to control access
    to your instances on a very granular basis.


    The EC2 infrastructure provides instances with an IP address and a DNS entry when
    they''re launched. The address and the entry are transient: when the instance
    shuts down or crashes they are disassociated from the instance. If you need an
    IP address that will survive a shutdown or that can be mapped to any one of a
    number of machines, you can use an Elastic IP Address. These addresses are effectively
    owned by your AWS account rather than by a particular EC2 instance. Once allocated,
    the addresses are yours until you decide to relinquish them.


    The instances have an ample amount of local disk storage for temporary processing.
    Like the standard IP address and DNS name, this storage is transient and is erased
    and reused when you''re finished with the instance.


    Elastic Block Store (EBS) volumes can be used for long-term and more durable storage.
    You can create a number of EBS volumes, attach them to your instances, and then
    format the volumes with the file system of your choice. You can make snapshot
    backups to S3, and you can restore the snapshots to the same volume or use them
    to create new volumes.


    EC2 charges accrue based on the number of hours the instance runs and the amount
    of data transferred in and out. There is no charge to transfer data to and from
    other AWS services in the same Region. The charges for EBS volumes are based on
    the size of the volume (regardless of how much data is actually stored) and there
    are also charges for I/O requests. To prevent hoarding, you are charged for Elastic
    IP addresses that you allocate but don''t use.


    The EC2 **CloudWatch** feature provides monitoring within EC2. It collects and
    stores information about the performance (CPU load average, disk I/O rate, and
    network I/O rate) of each of your EC2 instances. The data is stored for two weeks
    and can be retrieved for analysis or visualization.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The EC2 Elastic Load Balancer allows you to distribute web traffic across any
    number of EC2 instances. The instances can be in the same Availability Zone or
    they can be scattered across several zones in a Region. The elastic load balancer
    performs periodic health checks on the instances that it manages, and will stop
    sending traffic to any instances it determines to be unhealthy. The health check
    consists of a configurable ping to each EC2 instance.


    Finally, the EC2 Auto Scaling feature uses the data collected by CloudWatch to
    help you build a system that can scale out (adding more EC2 instances) and scale
    in (shutting down EC2 instances) within a defined auto scaling group. Auto scaling
    lets you define triggers for each operation. For example, you can use Auto Scaling
    to scale out by 10% when the average CPU utilization across the auto scaling group
    exceeds 80%, and then scale in by 10% when the CPU utilization drops below 40%.


    # # Amazon Elastic MapReduce


    The Elastic MapReduce service gives you the ability to use a number of EC2 instances
    running in parallel for large-scale data processing jobs. This service uses the
    open source Hadoop framework, an implementation of the MapReduce paradigm. Invented
    by Google, MapReduce isolates you from many of the issues that arise when you
    need to launch, monitor, load (with data), and terminate dozens or even hundreds
    of instances. Elastic MapReduce works just as well for pedestrian tasks, such
    as log file processing, as it does for esoteric scientific applications, such
    as gene sequencing.


    # ## Other Services


    AWS gains new features and services with great regularity. To stay up to date
    with the latest and greatest happenings, you should check the AWS home page and
    the AWS Blog (written by yours truly) from time to time.'
  merge: -1
  img_proc: true
