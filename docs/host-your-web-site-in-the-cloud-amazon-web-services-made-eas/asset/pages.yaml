- pgno: 338
  md: '+   RAID level 0 supports increased I/O capacity and increased storage capacity
    by *striping* data across multiple volumes. There is no additional redundancy.


    +   RAID level 1 supports increased storage capacity and also increases redundancy
    by *mirroring* data across multiple volumes.


    +   RAID levels 2 through 6 support increased storage and I/O capacity and also
    provide increased redundancy. The higher levels can even tolerate failure of multiple
    volumes or physical devices, generally at the cost of increased storage and retrieval
    time.


    In this section we’ll set up a RAID 0 volume. This is one of the simplest RAID
    levels, but the basic steps are the same regardless of the level. Here’s what
    we need to do:


    +   create the necessary EBS volumes

    +   attach the EBS volumes to the EC2 instance

    +   create the RAID volume on top of the EBS volumes

    +   create a file system on top of the RAID volume


    The first step is to create the volumes. As we’ve already seen, this is really
    easy once we know the desired Availability Zone and volume size. This example
    will use tiny (ten gigabyte) volumes, but you can use any size you would like
    up to the EBS limit of one terabyte. Let’s create four lots of ten gigabyte EBS
    volumes in Availability Zone us-east-1b:


    ```

    $ ec2-create-volume -z us-east-1b -s 10

    VOLUME    vol-891de8e0    10        us-east-1b        creating

    ►      2009-08-23T17:19:39+0000

    $ ec2-create-volume -z us-east-1b -s 10

    VOLUME    vol-8b1de8e2    10        us-east-1b        creating

    ►      2009-08-23T17:19:57+0000

    $ ec2-create-volume -z us-east-1b -s 10

    VOLUME    vol-8a1de8e3    10        us-east-1b        creating

    ►      2009-08-23T17:20:07+0000

    $ ec2-create-volume -z us-east-1b -s 10

    VOLUME    vol-811de8e8    10        us-east-1b        creating

    ►      2009-08-23T17:20:18+0000

    ```


    Now attach the EBS volumes to the instance:'
  merge: -1
  img_proc: true
