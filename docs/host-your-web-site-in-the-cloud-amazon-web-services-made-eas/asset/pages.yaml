- pgno: 261
  md: "```\n#!/usr/bin/php\n<?php\nerror_reporting(E_ALL);\nrequire_once('cloudfusion.class.php');\n\
    require_once('include/book.inc.php');\n\n$sd b = new AmazonSDB();\n\n$items =\
    \ array();\n\n$dir = opendir(\".\");\nwhile (($file = readdir($dir)) !== false)\n\
    {\n   if (preg_match(\"/[a-zA-Z0-9_]\\.php$\" , $file))\n   {\n       $data =\
    \ file_get_contents($file);\n       $hash = md5($data);\n       $size = filesize($file);\n\
    \n       $items[$file] = array('Name' => $file,\n                            \
    \ 'Hash' => $hash,\n                             'Size' => $size);\n   }\n   \n\
    \   if (count($items) == 25)\n   {\n       WriteBatch($sd b, $items);\n      \
    \ $items = array();\n   }\n}\nclosedir($dir);\n\nif (count($items) > 0)\n{\n \
    \  WriteBatch($sd b, $items);\n}\n\n```\n\n> The main difference between this\
    \ and the previous version of the insert script is that each array of attribute\
    \ name-value pairs is added to an $items array, instead of immediately being inserted\
    \ into SimpleDB."
