- pgno: 214
  md: '# Monitoring EC2 Data with Amazon CloudWatch


    It’s time to learn about Amazon CloudWatch concepts and its pricing model, add
    support for CloudWatch to the CloudFusion library, and then write some code to
    retrieve and display the collected data.


    # Amazon CloudWatch Concepts


    Amazon CloudWatch collects, aggregates, stores, and dispenses data from a number
    of AWS resources. The current release of Amazon CloudWatch collects data from
    EC2 instances and elastic load balancers; support for additional services may
    be added in the future.


    There are a number of terms and concepts associated with Amazon CloudWatch. These
    terms build on each other and are essential to understanding the CloudWatch model.


    A **namespace** represents a source of data. The “AWS/EC2” namespace is associated
    with data collected from the Amazon EC2 infrastructure and the “AWS/ELB” namespace
    is associated with data collected from the Elastic Load Balancer.


    A **measure** is a raw, observed data value. Measures are accumulated and rolled
    up to represent one minute’s worth of observation. A measure is always part of
    a namespace and has a unit such as bit, byte, or percent. Each measure has a name
    and a timestamp. Measures can be aggregated across one or more dimensions. The
    combination of the namespace, measure name, and zero or more dimensions is the
    complete measure name. Measures, once observed, are retained for two weeks (14
    days).


    A **unit** is an attribute of a measure. CloudWatch supports the following units:
    none, seconds, percent, bytes, bits, count, bytes/second, bits/second, and count/second.
    The unit is optional and the default is none. Some numbers, like ratios, have
    no units.


    A **dimension** is a refined view of a certain type of data. CloudWatch supports
    the following dimensions: `AvailabilityZone`, `ImageType` (an AMI id), `InstanceId`,
    `InstanceType`, and `AutoScaleGroup`.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'A **metric** is a stored, processed measure. The CloudWatch API provides a
    function to retrieve metrics based on namespace, measure, unit, period, statistic,
    and dimension parameters.


    Metrics without dimensions represent highly aggregated data; for instance, this
    could be disk activity or average CPU utilization across all EC2 instances of
    a particular instance type (or even for all instances in the account).


    A **period** is used to specify a time granularity, in seconds, when requesting
    metrics from CloudWatch.


    A **statistic** is a computed attribute of a metric and reflects the attributes
    of the measures that compose the metric. CloudWatch supports the following metrics:
    minimum, maximum, average, and sum. A fifth statistic, samples, denotes the number
    of measurements used to compute the value for the statistics.


    # ## Amazon CloudWatch Operation


    You must enable CloudWatch for each of your EC2 instances in order to start the
    data collection process. Once enabled, the process starts within a minute and
    metrics become available within a few minutes. You can enable CloudWatch when
    you launch the instances. You can also enable or disable CloudWatch for any EC2
    instances that are already running. The enable and disable operations are part
    of the EC2 API. There is a per-instance hourly charge for the use of CloudWatch;
    this covers the overhead of collecting and storing the data.


    Each elastic load balancer automatically forwards certain measurements to CloudWatch.
    There’s no need to enable monitoring for these load balancers and there’s no charge
    for storing or using the collected metrics.


    CloudWatch stores accumulated data for two weeks; older data is automatically
    discarded.


    After CloudWatch has been enabled, you can retrieve the list of measures and the
    actual metrics using the command line tools or the CloudWatch API. Viewed in this
    way, CloudWatch appears a lot simpler than it actually is. In fact, the real power
    of CloudWatch manifests itself in the parameters used to access the data.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Amazon CloudWatch Pricing


    There''s a charge of $0.015 (1.5 cents) per hour per monitored EC2 instance for
    the use of CloudWatch. This charge covers monitoring, data storage, and access
    to the stored data using the command line tools and the CloudWatch API.


    There''s no charge for the storage or use of elastic load balancer data in CloudWatch.


    # Amazon CloudWatch from the Command Line


    The easiest way to put CloudWatch through its paces is to use the command line.
    There''s one interesting twist that you need to be aware of, though. The EC2 tools
    are used to enable or disable CloudWatch for an EC2 instance. The CloudWatch tools
    are used to access the collected data.


    Here is how to enable CloudWatch for a single EC2 instance. The first step is
    to determine the instance''s ID using the `ec2-describe-instances` command:


    ```

    $ ec2-describe-instances

    INSTANCE i-aaba69c3 ami-2b5fb42 ec2-75-101-154-199.compute-1.amazonaws.com domU-12-31-38-00-A0-01.compute-1.internal
    running gsg-key-air 0 m1.small 2008-07-13T03:44:43+0000 us-east-1a aki-a71cf9ce
    i-ari-a51cf9cc monitoring-disabled

    ```


    In this case the instance ID is `i-aaba69c3`. With this value in hand, the `ec2-monitor-instances`
    command is used to enable CloudWatch (substituting the ID of your own instance,
    of course):


    ```

    $ ec2-monitor-instances i-aaba69c3

    i-aaba69c3 monitoring-pending

    ```


    This command can be run again (after a short delay) to confirm that CloudWatch
    has been enabled for the specified instance:


    ```

    $ ec2-monitor-instances i-aaba69c3

    i-aaba69c3 monitoring-enabled

    ```


    The `mon-list-metrics` command (from the CloudWatch tools) displays the list of
    available metrics:'
  merge: -1
  img_proc: true
