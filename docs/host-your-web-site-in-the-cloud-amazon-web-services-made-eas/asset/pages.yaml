    |                 |                 |                |

    |                 |                 |                |


    Figure 2.1. Putting the pieces together


    The command line tools and visual tools communicate with AWS using the open, published
    APIs. So, you''re able to duplicate what you see any tool do in your own applications.
    As a consequence of this strict layering of behavior, all developers are on an
    equal footing.


