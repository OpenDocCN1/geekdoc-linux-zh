- pgno: 129
  md: '# # Persistent and Ephemeral Resources


    Amazon EC2 resources can be grouped into two classes—persistent and ephemeral—and
    it’s important that you understand the differences between the two.


    **Persistent resources**, once allocated to your account, can be expected to remain
    operational in the face of transient or permanent hardware or software failures.
    The Amazon implementation of a persistent resource makes uses of redundancy, automated
    failover, and automatic recovery to provide you with stable resources. The following
    EC2 resources are persistent:


    +   - Elastic IP Addresses

    +   - Elastic Block Storage (EBS) Volumes

    +   - Elastic Load Balancers

    +   - Security Groups

    +   - Amazon Machine Images (AMIs) stored in Amazon S3 or as Amazon EBS snapshots


    **Ephemeral resources**, on the other hand, are without built-in redundancy and
    will eventually fail. When they fail, stored data and state information is generally
    lost. Therefore, you’re expected to use other EC2 facilities to implement your
    own redundancy, failover, and recovery. The following EC2 resources are ephemeral:


    +   - Amazon EC2 Instances


    At this point you may be thinking, “What? The instances can crash at any point
    and take my local data with them?” This is true, but, as developers often say,
    this is a feature, rather than a bug. One of the most important architectural
    aspects of a large-scale internet site (Amazon.com is a great example, of course)
    is that you can think of the individual servers as if they were all transient
    and extremely unreliable, and that you can use software to build a reliable system
    from unreliable parts.


    Practically speaking, Amazon EC2 servers are actually fairly durable. One of my
    personal EC2 instances has been running without a hitch for 742 days. When it
    ultimately fails, I’ll simply boot up another copy of my custom AMI, restore my
    data from S3, and keep going.


    Once you start to think of all your servers as fundamentally unreliable (Amazon
    EC2 or otherwise), which sounds a lot worse than it actually is, you start to
    realize'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'that you can build a system in such a way that loss of a particular server
    is really no big deal. The cloud also makes it easy for you to simulate a number
    of failure scenarios so that you can ensure that your recovery logic works as
    expected. Once you’ve been through a few of these exercises you can sleep better
    at night, confident that recovery from a system failure is easy, and in some cases
    even automatic.


    Speaking from experience, I can tell you that making the mental shift from “I’m
    scared, it could go away at any time” to “I’m confident that it could go away
    at any time and nothing bad will happen” is when you know that your thinking has
    become truly cloud-friendly.


    # Amazon EC2 Terminology


    The most important EC2 concept is the instance. Using a **virtualization** technique,
    the EC2 infrastructure runs machine instances on behalf of several EC2 users on
    the same physical hardware. The virtualization software ensures that each logical
    instance receives a guaranteed share of memory space and CPU time, and makes sure
    that instances running on the same hardware avoid interfering with each other
    in any way.


    An instance can be running any one of a number of operating systems, including
    Linux (multiple distributions are available), Windows Server, or OpenSolaris.


    When you start up an Amazon EC2 instance you must specify the **instance type**.
    There are currently nine EC2 instance types, as shown in Table 5.1.¹


    The costs listed in Table 5.1 are current as of publication time and reflect the
    charges for Linux or OpenSolaris instances running in the United States. Prices
    for instances running in Europe or Asia, for Windows instances, and for Windows
    instances running in Europe or Asia, are higher.


    The speed of each core is measured in terms of EC2 Compute Units; each unit is
    roughly the equivalent of a 1.0 to 1.2 GHz 2007-era AMD Opteron or Intel Xeon
    processor.


    All instance types besides the Small have more than one **virtual core**. The
    virtual cores are independent processing units that run concurrently. You can
    take advantage'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'of this power by running more than one CPU-bound program at once, or by writing
    your programs with its multi-core capabilities in mind. The latter method, though,
    is an advanced topic, and beyond the scope of this book.


    # Table 5.1. Amazon EC2 Instance Types


    | Name | CPU Word Size | CPU Virtual Cores | CPU Core Speed (EC2 Compute Units)
    | RAM | Local Disk | Cost/Hour |

    |---|---|---|---|---|---|---|

    | Small | 32-bit | 1 | 1 | 1.7GB | 160GB | $0.085 |

    | Large | 64-bit | 2 | 2 | 7.5GB | 850GB | $0.34 |

    | Extra Large | 64-bit | 4 | 2 | 15GB | 1,690GB | $0.68 |

