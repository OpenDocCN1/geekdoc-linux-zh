- pgno: 29
  md: '# Chapter 1


    # Welcome to Cloud Computing


    One or two office moves ago, I was able to see Seattle''s football and baseball
    stadiums from the window of my seventh-floor office. Built side-by-side during
    an economic boom, these expensive and high-capacity facilities sit empty for the
    most part. By my calculations, these buildings see peak usage one percent of the
    time at most. On average, they''re empty. Hundreds of millions of dollars of capital
    sit idle. I use this stadium analogy—and have done so many times over the last
    few years—to help my audiences understand the business value of cloud computing.


    Now, instead of a stadium, think of a large-scale corporate data center. It''s
    packed with expensive, rapidly depreciating servers that wait, unutilized, for
    batch processing jobs, large amounts of data, and a flood of visitors to the company
    web site. That''s because matching predictions and resources for web traffic has
    historically been problematic. Conservative forecasts lead to under-provisioning
    and create the risk of a “success disaster,” where a surge of new users receive
    substandard service as a result. Overly optimistic forecasts lead to over-provisioning,
    increased costs, and wasted precious company resources.


    As you''ll see in this book, cloud computing provides a cost-effective and technically
    sophisticated solution to this problem. Returning to my opening analogy for a'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 2   Host Your Web Site in the Cloud


    minute, it''s as if a stadium of precisely the right size was built, used, and
    then destroyed each week. The stadium would have just enough seats, parking spaces,
    restrooms, and additional facilities needed to accommodate the actual number of
    attendees. With this scenarío, a stadium fit for 50 people would be just as cost-effective
    as one built for 50,000.


    Of course, such a situation is impractical with stadiums; custom, just-in-time
    re-source instantiation is, on the other hand, perfectly reasonable and practical
    with cloud computing. Data processing infrastructure—servers, storage, and bandwidth—can
    be procured from the cloud, consumed as needed, and then relinquished back to
    the cloud, all in a matter of minutes. This is a welcome and much-needed change
    from yesterday''s static, non-scalable infrastructure model. Paying for what you
    *actually need* instead of what you *think* you might need can change your application''s
    cost profile for the better, enabling *you* to do more with less.


    # ## Avoiding a Success Disaster


    Imagine you''re a budding entrepreneur with limited resources. You have an idea
    for a new web site, one you''re sure will be more popular than Facebook¹ or Twitter²
    before too long. You start to put together your business plan and draw a chart
    to predict your anticipated growth for the first six months. Having already run
    proto-types of your application and benchmarked its performance, you realize that
    you''ll have to purchase and install one new server every month if all goes according
    to plan. You never want to run out of capacity, so you allow for plenty of time
    to order, receive, install, and configure each new server. Sufficient capacity
    in reserve is vital to handle the users that just might show up before your next
    server arrives; hence, you find you''re always spending money you lack in order
    to support users who may or may not actually decide to visit your site.


    You build your site and put it online, and patiently await your users. What happens
    next? There are three possible outcomes: your traffic estimates turn out to be
    way too low, just right, or way too high.


    Perhaps you were thinking smallish, and your estimate was way too low. Instead
    of the trickle of users that you anticipated, your growth rate is far higher.
    Your initial


    +   1 http://facebook.com/

    +   2 http://twitter.com/'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'users quickly consume available resources. The site becomes overloaded and
    too slow, and potential users go away unsatisfied.


    Then again, maybe you were thinking big and you procured more resources than you
    actually needed. You geared up for a big party, and it failed to materialize.
    Your cost structure is out of control, because there are only enough users to
    keep your servers partially occupied. Your business may fail because your fixed
    costs are too high.


    Of course, you might have guessed correctly and your user base is growing at the
    rate you expected. Even then you’re still in a vulnerable position. Early one
    morning you wake up to find that a link to your web site is now on the front page
    of Digg,${}^{3}$ Reddit,${}^{4}$ or Slashdot.${}^{5}$ Or, a CNN commentator has
    mentioned your site in an offhand way and your URL is scolling across the headline
    crawl at the bottom of the screen. This was the moment you’ve been waiting for,
    your chance at fame and fortune! Unfortunately, your fixed-scale infrastructure
    fails to be up to the task, so all those potential new users go away unhappy.
    The day, once so promising, ends up as yet another success disaster.


    As you can see, making predictions about web traffic is a very difficult endeavor.
    The odds of guessing wrong are very high, as are the costs.


    Cloud computing gives you the tools needed to prepare and cope with a traffic
    onslaught, such as the ones I have just described. Providing you’ve put the time
    in up-front to architect your system properly and test it for scalability, a solution
    based on cloud computing will give you the confidence to withstand a traffic surge
    without melting your servers or sending you into bankruptcy.


    # ## Tell Me about Cloud Computing!


    Let’s dig a bit deeper into the concept of cloud computing now. I should warn
    you up-front that we’ll be talking about *business* in this ostensibly technical
    book. There’s simply no way to avoid the fact that cloud computing is more than
    just a new technology; it’s a new business model as well. The technology is certainly
    interesting and I’ll have plenty to say about it, but a complete discussion of
    cloud computing


