  md: "# # Augmenting Items with Additional Data\n\nOnce an item has been created,\
    \ additional calls to the put_attributes method can be used to create additional\
    \ attributes or additional values for an existing attribute. Let's augment each\
    \ item in the BOOK_FILE_DOMAIN with the file's modification time using this script:\n\
    \n```\nchapter_08/augment_items.php (excerpt)\n```php\n#!/usr/bin/php\n<?php\n\
    \nerror_reporting(E_ALL);\n\nrequire_once('cloudfusion.class.php');\nrequire_once('include/book.inc.php');\n\
    \n$sdb = new AmazonSDB();\n$res1 = $sdb->select(\"select Name from \" . BOOK_FILE_DOMAIN);\n\
    \nif ($res1->isOK())\n{\n    foreach ($res1->body->SelectResult->Item as $item)\n\
    \    {\n        $itemName = $item->Name;\n        $file     = $item->Attribute[0]->Value;\n\
    \n        $modTime = filemtime($file);\n        if ($modTime != false)\n     \
    \   {\n            $attrs = array('ModTime' => sprintf(\"%O10s\", $modTime));\n\
