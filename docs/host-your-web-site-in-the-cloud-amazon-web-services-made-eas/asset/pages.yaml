  md: '# About the Author


    Jeff Barr is currently the Senior Evangelist at Amazon Web Services. In this role,
    Jeff speaks to developers at conferences and user groups all over the world. Jeff
    joined Amazon.com in 2002 when he realized it was destined to become the next
    great developer platform, and that he could help make it so. Before coming to
    Amazon, Jeff ran his own consulting practice, and has also held management and
    development positions at Microsoft, eBay, KnowNow, and Visix Software.


    Jeff earned a Bachelor''s degree in Computer Science from the American University
    in Washington DC and also took some graduate classes at George Washington University
    in the same city. Jeff resides in Sammamish, Washington with his wife and their
    five children. In his spare time he enjoys the great outdoors, electronics, and
    welding.


    # About the Technical Editors


    Andrew Tetlaw has been tinkering with web sites as a web developer since 1997.
    He''s dedicated to making the world a better place through the technical editing
    of SitePoint books, kits, articles, and newsletters. Andrew''s also a busy father
    of five, enjoys receiving beer showbags, and often neglects his blog at http://tetlaw.id.au/.


    Louis Simoneau joined SitePoint in 2009, after traveling from his native Montréal
    to Calgary and finally Melbourne. He now gets to spend his days learning about
    cool web technologies, an activity that had previously been relegated to nights
    and weekends. He enjoys hip-hop, spicy food, and all things geeky. His personal
    web site is http://louissimoneau.com/ and his latest blog project is http://growbuycookeat.com/.


    # About the Chief Technical Officer


    As Chief Technical Officer for SitePoint, Kevin Yank keeps abreast of all that
    is new and exciting in web technology. Best known for his book, Build Your Own
    Database Driven Web Site Using PHP & MySQL, he also co-authored Simply JavaScript
    with Cameron Adams and Everything You Know About CSS Is Wrong! with Rachel Andrew.
    In addition, Kevin hosts the SitePoint Podcast and co-writes the SitePoint Tech
    Times, a free email newsletter that goes out to over 240,000 subscribers worldwide.


    Kevin lives in Melbourne, Australia and enjoys speaking at conferences, as well
    as visiting friends and family in Canada. He''s also passionate about performing
    improvised comedy theater with Impro Melbourne (http://www.impromelbourne.com.au/)
    and flying light aircraft. Kevin''s personal blog is Yes, I''m Canadian (http://yesimcanadian.com/).'
  merge: -1
  img_proc: true
