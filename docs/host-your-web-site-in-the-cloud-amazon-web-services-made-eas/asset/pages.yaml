    As we discussed earlier in this chapter, it’s possible for a single `receive_message`
    call to SQS to indicate by return value that no messages are present, even when
    they are. This is only occasional in practice but it’s worth looking out for.


    Let’s test our suite of queue manipulation scripts. For best results, open up
    a second terminal or PuTTY window so that you can have your choice of two separate
    shell prompts. In the first window, create a queue with this command:


    ```

    ```

    $ php create_queues.php my_queue

    ```

    ```


    In the second window, start polling for messages from the new queue:


    ```

    ```

    $ php pull_queue.php my_queue

    ```

    ```


    The queue is empty, so the program will just loop quietly. Now go back to your
    first window and put some messages in the queue:


    ```

    ```

    $ php post_queue.php my_queue 1 2 3 4 5

    ```

    ```


    Return to the second window and you’ll see your messages arrive:


    ```

    ```text

    Message: ''3''

    Message: ''4''

    Message: ''1''

    Message: ''5''

    Message: ''2''

    ```

    ```


    Odds are that the messages will show up in a different order to what you posted.
    This is to be expected, and is a consequence of the distributed implementation
    of SQS (as we discussed earlier).


    Experiment until you gain a sense of how the sender and receiver work together.
    For example, you could pass `*` to `post_queue.php` to post the names of all the
    files in the current directory to the queue. Once you’ve finished playing with
    your new toy, be sure to kill the first process by typing **Ctrl+c** in the terminal
    window.'
