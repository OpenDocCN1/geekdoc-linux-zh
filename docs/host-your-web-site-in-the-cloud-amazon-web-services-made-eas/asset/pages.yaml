  md: 'This may look complex and even a bit scary, but there''s no need to worry.
    As you''ll soon see, it''s easy to build complex systems like this in modular
    fashion. We learned how to access Amazon S3 in Chapter 3 and we''ll make use of
    that knowledge as we put this application together. We know how to create and
    work with queues, so all we need to do is write four scripts. Let''s take it step
    by step.


    # ### Hosting the Image Crawler


    You''ll probably want to run the image crawler pipeline on an AMI instance. After
    Chapter 5, you should have no trouble getting one up and running. If you''ve kept
    the EBS volume from that chapter, you should be able to mount it again and have
    the CloudFusion library files available in `/data/src/cloudfusion`. Be careful
    to avoid running the `mkfs` command, because you''ll erase the existing file system.


    Create a new directory named `/data/src/crawler` for our image crawler files to
    reside in. Also create a `/data/src/include` directory in which to put our **book.inc.php**.


    By the way, if you''re using the LAMP Web Starter AMI you may notice an error
    when running the image processing scripts, due to the fact that the PHP GD library
    is absent. A quick command will fix that problem for you:


    ```

    `<dev>: yum -y install php-gd`

    ```


    We''ll be writing some utility commands and some pipeline function scripts shortly.
    The utility commands can be run locally, because they shun the hard labor—they
    only query the queues. The commands can also be executed at any time because they
    only function for a limited period before they terminate. The pipeline function
    scripts should be run on the AMI, because they will be doing a lot of crawling,
    downloading, and uploading, as well as storing files in and retrieving files from
    S3, and some image processing.


    # ### Definitions and Utility Functions


    Because each queue will be referenced by several processes, let''s define some
    symbolic names for them in our **book.inc.php** file:'
