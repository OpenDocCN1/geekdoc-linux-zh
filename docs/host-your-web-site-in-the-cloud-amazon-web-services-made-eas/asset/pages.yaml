- pgno: 66
  md: '# # Tools and Libraries


    Now that we''ve reviewed the AWS infrastructure services and made sure that you
    have the right skills and some technical prerequisites mastered, it''s time to
    gear up and do some work.


    In this section I will tell you about the programming libraries, command line
    tools, and visual tools that are available to you as an AWS developer. In each
    case I will provide several alternatives in order to make clear that you have
    a number of reasonable options. Some of the items I''ll describe were created
    and are maintained by Amazon; others are the work of independent developers.


    # ## Tool Considerations


    Here are some points to consider when choosing your tools:


    **Documentation**


    Are the tools backed by some good documentation? Does the documentation match
    the current release? Does the maintainer strive to create a complete product or
    is documentation always lagging behind the code?


    **Popularity and Reputation**


    What comes up when you do a web search for the name of the tool? Can you locate
    the tool''s community without too much trouble?


    **Community Support**


    Check to see if the tools have a strong community behind them. Is there a discussion
    forum? See what other developers have to say and whether they''re contributing
    or complaining. Also, see if the original creators or current maintainers are
    participating in the community, or if they''re in hands-off mode. Do they enjoy
    interacting with their users, or has it become a chore?


    **Update Frequency**


    Take a look at the release and patch history for the tool. Are updates released
    in sync with new releases of AWS? Does the creator release patches on a timely
    basis in response to problems? Is there a fixed release schedule?'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Style


    Is the tool a good fit for your working style? Are the command, function, or data
    structure names consistent and logical? Are your educated guesses correct more
    often than not? 10


    # Security


    You''ll be trusting these tools with your AWS public and secret keys, so caution
    is advised. At the very least, you should understand how and where the tool stores
    your keys and how it protects them from accidental disclosure or casual discovery.


    # Language Libraries


    Language libraries occupy the space between your application and the web service
    calls. The libraries provide an adapter that matches the structure and style of
    the language, so that your application code will look and feel *native*. Some
    libraries provide an object oriented interface to AWS. All the libraries take
    care of the details involved in making a call, including handling of default parameter
    values, managing private and public keys, signing the requests, making the web
    service calls, checking for error conditions, and parsing returned values into
    native objects. Some libraries also provide functions to retry calls that have
    failed due to a transient error; others will accumulate data returned by multiple
    calls into a single return value.


    The official Amazon libraries for PHP are very nice, but as of this writing they
    lack support for some of the services—S3, for example. If you have no requirement
    for S3 support, these libraries may fit the bill for you. You can find the EC2
    libraries 11 (base EC2, CloudWatch, Auto Scaling, and Elastic Load Balancing),
    as well as a number of additional libraries for PHP and other languages, at the
    same link.


    In this book we''ll be using the CloudFusion library written by Ryan Parman. This
    library supports all the AWS services. CloudFusion supports multi-threaded access
    and bulk operations, and is supplied in open source form under the BSD license.
    12 CloudFusion also includes a number of high-level utility functions to make
    AWS even easier to use.


    10 I could write an entire book on why I''ll never use the word “intuitive” to
    describe this property, but I have to finish this one first.


    11 http://developer.amazonwebservices.com/connect/kbCategory.jspa?categoryId=85


    12 http://www.opensource.org/licenses/bsd-license.php'
  merge: -1
  img_proc: true
