- pgno: 276
  md: "To make the program more flexible, it will be able to obtain its list of feeds\
    \ from one of two sources. The first source will be a file named `feeds.txt`.\
    \ The file should have one feed URL per line. The second source will be an SQS\
    \ queue identified by `FEED_QUEUE`. The code is going to store status information\
    \ about each fetched feed, so we’ll set up a couple of handy constants for status\
    \ values. Let’s add all these constants to our `book.inc.php` file:\n\n```\n**chapter_08/include/book.inc.php**\
    \ (*excerpt*)\n\n```\ndefine('FEEDS', 'feeds.txt');\ndefine('FEED_QUEUE', 'c_feed');\n\
    \ndefine('FEED_NO_FETCH', 'NoFetch');\ndefine('FEED_YES_FETCH', 'Fetched');\n\
    ```\n```\n\nHere’s how the program starts out:\n\n```\n**chapter_08/rss_process.php**\
    \ (*excerpt*)\n\n```php\n#!/usr/bin/php\n<?php\n\nerror_reporting(E_ALL);\n\n\
    require_once('cloudfusion.class.php');\nrequire_once('include/book.inc.php');\n\
    require_once('include/rss_fetch.inc');\n\ndefine('MAGPIE_CACHE_ON', 0);\n```\n\
    ```\n\nThe `define` statement turns off Magpie’s cache of recently fetched feeds.\n\
    \nThe first task is to determine whether the program will process the feed file\
    \ (signified by the `-f` command line argument) or the queue (signified by the\
