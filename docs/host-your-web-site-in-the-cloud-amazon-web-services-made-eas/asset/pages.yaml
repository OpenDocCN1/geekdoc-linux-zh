  md: "Firstly, in our **book.inc.php** file, we need to create two constants: one\
    \ to store the desired thumbnail size, and one to store the default name for the\
    \ bucket that will store our thumbnails. I want the thumbnail images to be 200\
    \ pixels on the longest side, and I want to define a suffix to add to my default\
    \ bucket name in order to create the thumbnail bucket name, so I'll add the following:\n\
    \n```\nchapter_04/include/book.inc.php (excerpt)\n\ndefine('THUMB_SIZE', 200);\n\
    define('THUMB_BUCKET_SUFFIX', '-thumbs');\n```\n\nOf course, before we can use\
    \ the thumbnail bucket we have to make sure it exists! You can use the **create_bucket.php**\
    \ script we developed earlier to do that.\n\nHere's the code for the **thumbnailImage**\
    \ function; once again, this goes into our **book.inc.php** file:\n\n```\nchapter_04/include/book.inc.php\
    \ (excerpt)\n\nfunction thumbnailImage($imageBitsIn, $contentType)\n{\n\n    $imageIn\
    \ = ImageCreateFromString($imageBitsIn);\n    $inX = ImageSX($imageIn);\n    $inY\
    \ = ImageSY($imageIn);\n\n    if ($inX > $inY)\n    {\n        $outX = THUMB_SIZE;\n\
    \        $outY = (int) (THUMB_SIZE * ((float) $inY / $inX));\n    }\n    else\n\
    \    {\n        $outX = (int) (THUMB_SIZE * ((float) $inX / $inY));\n        $outY\
    \ = THUMB_SIZE;\n    }\n\n    $imageOut = ImageCreateTrueColor($outX, $outY);\n\
    \    ImageFill($imageOut, 0, 0,\n              ImageColorAllocate($imageOut, 255,\
    \ 255, 255));\n    ImageCopyResized($imageOut, $imageIn,\n                   \
    \  0, 0, 0, 0,\n                     $outX, $outY, $inX, $inY);\n```"
  merge: -1
  img_proc: true
