- pgno: 267
  md: 'Let''s take a look at these. The `output_list` can be `*` for all attributes,
    `itemName()` for the name of the item, or a list of attribute names, or `count(*)`
    to retrieve an item count instead of items. The `domain_name` refers to the SimpleDB
    domain, of course.


    The optional `where` expressions are a combination of attribute names, constant
    values, `itemName()`, and operators. The following table shows the operators that
    can be used in the `where` expression.


    # Table 8.1. Available Operators


    | Operator | Description |

    | :--- | :--- |

    | = | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | >= | Greater than or equal to |

    | < | Less than |

    | <= | Less than or equal to |

    | and | Both conditions must be true |

    | or | Either condition can be true |

    | intersection | Returns results that appear in a pair of independent queries
    |

    | like | Contains the specified constant, with "%" as a wildcard |

    | not like | Does not contain the specified constant |

    | between/and | In a specified range |

    | in | Matches an item from a list |

    | is null | Attribute does not exist |

    | is not null | Attribute exists |

    | every() | Every value of a multi-valued attribute satisfies the expression |


    The optional `order` by clause can be used to order the results by a single attribute
    or item name. All sorts are performed in lexicographical order and the sort attribute
    must be mentioned by name in the associated expression. It''s impossible to sort
    against null values.


    The optional `limit` clause can be used to limit the number of results to a given
    value.'
