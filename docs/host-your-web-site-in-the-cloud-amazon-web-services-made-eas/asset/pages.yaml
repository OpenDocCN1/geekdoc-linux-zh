- pgno: 104
  md: "```\nchapter_04/include/book.inc.php (excerp t)\n\nfunction getBucketObjects(S3,\
    \ $bucket, $prefix = '')\n{\n    $objects = array();\n    $next = '';\n\n    do\
    \ {\n        $res = $s3->list_objects($bucket,\n            array('marker' =>\
    \ urlencode($next),\n                'prefix' => $prefix)\n        );\n\n    \
    \    if (!$res->isOk())\n        {\n            return null;\n        }\n\n  \
    \      $contents = $res->body->Contents;\n        foreach ($contents as $object)\n\
    \        {\n            $objects[] = $object;\n        }\n\n        $isTruncated\
    \ = $res->body->IsTruncated == 'true';\n\n        if ($isTruncated)\n        {\n\
    \            $next = $objects[count($objects) - 1]->Key;\n        }\n    } while\
    \ ($isTruncated);\n\n    return $objects;\n}\n```\n\nThis function is more complex\
    \ than anything you've seen so far, but there's no need to worry. Earlier in this\
    \ chapter I told you that one “list bucket” request to S3 will return at most\
    \ 1,000 keys, regardless of how many keys are in the bucket. Our `getBucketObjects`\
    \ function simply calls `list_objects` again and again until S3 says that there\
    \ are no more objects to return:"
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Our function accepts three arguments: an **AmazonS3** object, an S3 bucket,
    and a prefix value that defaults to an empty string.


    We use a **do ... while** loop, so that the body of the loop always runs at least
    once.


    Each time I call `list_objects`, I pass in a value called `$next`. The first time
    through the loop, `$next` is an empty string, and `list_objects` starts at the
    beginning (alphabetically speaking) of the bucket. On subsequent loop iterations,
    `$next` is set to the final key returned on the previous iteration. This tells
    S3 to start retrieving keys alphabetically following the previous iteration’s
    final key.


    If the `list_objects` call fails, the function returns `null`.


    We retrieve the **Contents** array from the body of the response returned to our
    `list_objects` call, then loop through the values storing each one in the `$objects`
    array. This array will eventually be our return value.


    The data returned by a call to `list_objects` includes an element named `IsTruncated`.
    If this value is the string "true", the listing is incomplete and there are more
    objects to be found. This condition is also used to control the loop.


    If the list is incomplete, we set the `$next` value ready to begin the next iteration.


    When the loop terminates, the `$objects` array is returned.


    Put it together and this function fetches all the objects in the bucket, puts
    them all into one array, and returns the array.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_105_0.png)


    # Avoid Going Loopy


    I will freely admit that I failed to correctly state the termination condition
    when I first wrote this code. I knew that this would be tricky, so I used a print
    statement at the top to ensure that I avoided creating a non-terminating loop
    that would spin out of control and run up my S3 bill. I advise you to do the same
    when you’re building and testing any code that costs you money to execute.


    With this function in hand, creating a list of the objects in the bucket becomes
    easy. Here’s all we have to do:'
