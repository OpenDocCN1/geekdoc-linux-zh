    # EBS Snapshots


    Let’s say that I want to create a backup of my EBS volume as it exists at this
    point. The first step is to make sure that any in-memory data has been written
    to disk:


    ```

    <dev>: sync

    ```


    If you’re using the EBS volume to store database files, you should probably shut
    the database server down before you create the backup. This will ensure that the
    backup is complete and logically consistent.


    Creating the backup—a snapshot in EBS terms—is very easy:


    ```

    $ ec2-create-snapshot vol-73d4211a

    SNAPSHOT snap-c7e849ae vol-73d4211a pending

    ➔ 2009-08-20T19:52:35+0000

    ```


    Once the snapshot has been initiated, it’s safe to resume writing data to the
    volume. The snapshot may take some time to complete, but it will always represent
    the state of the volume at the time the snapshot was initiated.


    You can check on the status of your snapshot like this:


    ```

    $ ec2-describe-snapshots

    SNAPSHOT snap-c7e849ae vol-73d4211a pending

    ➔ 2009-08-20T19:52:35+0000

    ```


    The first snapshot for an EBS volume is similar to a traditional, full backup.
    It contains all the information written to the volume. Second and subsequent snapshots
    are similar to traditional incremental backups. They contain only the information
    that’s been changed since the previous backup. EBS takes care of all the details
    of this behind the scenes. Even if you delete the first snapshot, sufficient data
    will be retained to allow you to create new volumes from any of the other snapshots.'
  merge: -1
  img_proc: true
- pgno: 333
