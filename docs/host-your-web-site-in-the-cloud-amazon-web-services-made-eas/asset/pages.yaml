- pgno: 87
  md: '# Chapter 4


    # # Storing Data with Amazon S3


    In this chapter, we''ll dive headfirst into Amazon S3, the Simple Storage Service.
    After a quick overview of the most important S3 concepts, we''ll spend the greater
    part of this chapter reviewing the code needed to manipulate buckets and objects
    in S3 and its content-distribution sibling, CloudFront.


    # ## S3 Overview


    S3 is an Internet-scale data storage service. All data is stored redundantly to
    guard against problems brought on by temporary connectivity issues or permanent
    hard-ware failures. S3 can scale to handle vast amounts of data and deal with
    a very large number of concurrent accesses. At the time of writing, S3 held over
    124 billion objects and was handling over one trillion requests per year.¹


    S3 lets you store your data in containers called **buckets**. A bucket is a named
    storage entity attached to a particular AWS account. You can create up to 100
    buckets in your AWS account. The bucket names must be globally unique, so you''ll
    have to choose with care and keep on trying until you find available names.


    > ¹ http://aws.amazon.com/about-aws/whats-new/2009/03/30/celebrating-3-years-of-amazon-s3-with-3-months-of-transfer-in-for-3-centsb/'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Buckets are used to group any number of S3 objects. When I say any number,
    I really mean it—it is perfectly reasonable to store millions or tens of millions
    of objects in a single S3 bucket. Depending on your needs, you may choose to use
    a number of buckets for a single application, or you may choose to use a single
    bucket for each application.


    You can store any type of data you like in S3. It could be text files such as
    HTML pages, CSS style sheets, or C source code, or binary files such as JPEG images,
    tar backup files, or even encrypted data (you can encrypt sensitive data before
    storing it in S3, if you’d like). S3 is ideal for storing web data. Each S3 object
    has its own URL and S3 can handle a very high request rate.


    S3 can store objects of up to 5GB in size. This is a limit that you’ll probably
    never approach in practice, due to various factors. Depending on the speed of
    your internet connection, it could take hours or even days to upload an object
    of this size. If the connection was interrupted, you’d have to restart the upload
    from the beginning. Also, some of the S3 tool kits attempt to read the entire
    object into memory before uploading it.


    Every S3 object has a unique URL formed by concatenating these components:


    +   - protocol (`http://` or `https://`)

    +   - bucket name ending with `.`

    +   - S3 endpoint (`s3.amazonaws.com`)

    +   - object key starting with `/`


    The object key can itself contain `/` characters. These characters are simply
    part of the object’s name and have no special meaning to S3. S3 is not a hierarchical
    file system and has no concept of a subfolder. The S3 tools listed in Chapter
    3 maintain the polite fiction that the `/` is special and allows the user to traverse
    the contents of an S3 bucket as if it contained actual subfolders.


    S3 can be accessed using either one of two APIs. The SOAP API contains functions
    such as ListAllMyBuckets, CreateBucket, and DeleteBucket. The HTTP API uses the
    standard HTTP verbs (GET, PUT, HEAD, and DELETE) as the basis for all operations.
    The GET operation retrieves the contents of a bucket or an object, the PUT operation
    creates a new bucket or object, the DELETE operation removes a bucket or an object,
    and the HEAD operation retrieves information about an object.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'You can attach metadata in the form of key-value pairs when you create a new
    S3 object. The metadata is returned in the form of HTTP headers when the object
    is retrieved using an HTTP GET request.


    Access to each S3 bucket and object is regulated by an **ACL** or **Access Control
    List**. An ACL contains a series of up to 100 **grants**, with each grant consisting
    of a **grantee** and a **permission**. Using the ACL, you can grant access to
    specific users or to groups of users.


    Specific users represent an individual AWS account. The account can be specified
    using an email address or a canonic user ID, but it is always returned as a `CanonicalUser`
    object—the email address is simply a convenience.


    Groups represent predefined classes of users, any AWS user, or anonyymous users
    (anyone at all).


    The permission component of a grant in an ACL specifies the access given to the
    related grantee. You can grant permissions to buckets or to objects—but be aware
    that the semantics are slightly different for each, as described in Table 4.1.


    # **Table 4.1. S3 Permission Grants When Applied to Buckets and Objects**


    | Permission | When applied to a bucket | When applied to an object |

    |:-----------|:-------------------------|:-------------------------|

    | `READ` | Permission to list the contents of the bucket | Permission to read
    the object or its metadata |

    | `WRITE` | Permission to create, replace, or delete any object in the bucket
    | Unsupported for objects |

    | `READ_ACP` | Permission to read the bucket''s ACL | Permission to read the object''s
    ACL |

    | `WRITE_ACP` | Permission to overwrite the bucket''s ACL | Permission to overwrite
    the object''s ACL |

    | `FULL_CONTROL` | All of the above | All of the above |


    The owner of a bucket or an object always has implicit `READ_ACP` permission;
    you can always access the ACL of your own objects. Similarly, the owner also has
    implicit `WRITE_ACP` permission, so you can always change the ACL of your own
    object too. The `FULL_CONTROL` permission is provided for convenience and has
    the same effect as applying the READ, WRITE, `READ_ACP`, and `WRITE_ACP` permissions.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Permissions on buckets and objects are distinct. The bucket''s permissions
    have no influence on the permissions of newly uploaded objects; ACLs must be set
    separately for each new object.


    # The S3 Pricing Model


    Your S3 usage is charged in three dimensions:


    +   - amount of data stored

    +   - amount of data transferred in and out of S3

    +   - the number of requests made to S3


    Let’s examine each of these dimensions in detail.


    Your S3 storage charges are based on a unit known as a **gigabyte-month**. If
    you store exactly one gigabyte for exactly one month, you’ll be charged for one
    gigabyte-month, which is $0.15 (fifteen cents).$^{2}$ Time and space can be traded
    for one another, so you could also store two gigabytes for half of a month for
    $0.15, or even 30 gigabytes for one day if you’d like. Internally, S3 uses a more
    fine-grained billing unit, a **byte-hour**. This allows AWS to measure your usage
    with a very high degree of accuracy and to bill you accordingly.


    Your data transfer charges are based on the amount of data transferred in (uploaded)
    and out (downloaded) from S3. Data transferred in to S3 is charged at a rate of
    $0.10 per gigabyte. Once again, this amount is prorated. Data transferred out
    of S3 is charged on a sliding scale starting at $0.17 per gigabyte and decreasing
    based on volume, reaching $0.10 per gigabyte for all outgoing data transfer in
    excess of 150 terabytes per month. As an important special case, there is no charge
    to transfer data between S3 and an Amazon EC2 instance in the same Region.


    There are also nominal (yet important) charges for each request made to S3. HTTP
    **GET** requests are charged at the rate of $0.01 for every 10,000 requests. **PUT**,
    **COPY**, **LIST**, and **POST** requests are charged at the rate of $0.01 for
    every 1,000 requests.


    Putting it all together, this pricing model means that you can probably prototype
    and then run your S3-powered application for next to nothing, paying for more
    storage and more data transfer only as your application becomes popular.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '**Watch That Meter!** You need to keep in mind that the meter is always running!
    If you write a program to poll one of your S3 buckets every second (a LIST request)
    you''ll be spending 86 cents every day, whether there''s anything new in this
    bucket or otherwise. You should also check your loop terminating conditions with
    extreme care. It''s better to avoid writing an infinite loop which costs you money
    with every iteration.


    You can (and should) check your S3 usage at any point during the month to verify
    that it’s in accord with your expectations. You can do this by logging into the
    AWS portal and selecting the **Account Activity** option from the *Your Account*
    menu.


    # # CloudFront Overview


    CloudFront is a web service for content delivery, allowing you to distribute web
    content at high speed with low latency. CloudFront integrates with S3, making
    it very easy to distribute any public S3 object to CloudFront’s network of 14
    global edge locations.3 As of this writing, the edge locations are spread through
    the United States, Europe, and Asia, as shown in Table 4.2.


    **Table 4.2. Edge Locations in the CloudFront Network**


    | United States | Europe | Asia |

    | :--- | :--- | :--- |

    | Ashburn, Virginia | Amsterdam | Hong Kong |

    | Dallas/Fort Worth, Texas | Dublin | Singapore |

    | Los Angeles, California | Frankfurt | Tokyo |

    | Miami, Florida | London | |

    | Newark, New Jersey | | |

    | New York, New York | | |

    | Palo Alto, California | | |

    | Seattle, Washington | | |

    | St. Louis, Missouri | | |


    CloudFront is very easy to use. You simply create a distribution for any of your
    S3 buckets and CloudFront does the rest.


    3 The number of edge locations, and the locations themselves, may change over
    time.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# ## The CloudFront Pricing Model


    Your CloudFront usage is charged in two dimensions:


    +   - data transfer

    +   - the number of requests made to CloudFront


    Data transferred in and out of CloudFront is charged on a sliding scale. Starting
    at a rate of $0.17 per gigabyte, it decreases according to volume, reaching $0.05
    per gigabyte for all outgoing data transfer in excess of 1,000 terabytes per month.
    You’re also charged for the data transfer from S3 to CloudFront. The latest prices
    for CloudFront can be found at http://aws.amazon.com/cloudfront.


    There’s a charge of $0.013 for every 10,000 HTTP GET requests processed by CloudFront.


    # ## Programming S3 and CloudFront


    With the preliminaries out of the way, it’s time to start on the fun part—the
    code! In this section, you’ll learn how to list your buckets, create new buckets,
    and list the objects in a bucket in several different ways. We’ll also cover how
    to process the contents of a bucket (performing some simple image processing along
    the way), and how to distribute your content using CloudFront.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_92_0.png)


    # **Running the Code**


    > As we mentioned in the section called “Running the PHP Code in This Book” in
    Chapter 3, the programs in this section that start with a shebang(#!/usr/bin/php)
    are meant to be run from the command line. The others are meant to be run via
    a web server.


