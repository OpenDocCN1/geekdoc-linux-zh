- pgno: 315
  md: 'If your AWS usage varies from day to day you should make a point of checking
    your account activity. This is doubly true if you’re serving up large amounts
    of content or using the auto scale feature to launch additional EC2 instances
    in response to increased system load or traffic.


    # ## Access to Usage Data


    The raw data used to generate account activity can be downloaded from the AWS
    portal by selecting the **Usage Reports** option from the menu. You can download
    reports for any service—with control of the time period, usage types, and data
    format (XML or CSV)—as depicted in Figure 10.2.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_315_0.png)


    Since we’ve already learned how to process XML, let’s work with a CSV (Comma-Separated
    Value) file this time so that we have the opportunity to learn a new skill. We’ll
    access the data, store it in SimpleDB, and then retrieve and visualize it.


    Start by downloading data for any (or all) of the services that you’ve used. Set
    the **Report Granularity** to **Days**, choose a **Time Period** that will represent
    your recent AWS usage (I started from January 1, 2009 and downloaded almost eight
    full months of data), and then click **Download report (CSV)**.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "Depending on how your browser is configured, you may end up with a screen full\
    \ of data or a new file in your download history. Either way, do what you need\
    \ to do to transfer the data to your running EC2 instance. I opened the file in\
    \ a local copy of Notepad, selected and copied the text, and then pasted it into\
    \ an emacs buffer running on my EC2 instance. I named my EC2 usage file ec2_usage.csv,\
    \ but you can use any name that you want.\n\n# Importing Usage Data\n\nHere are\
    \ the first few lines of my ec2_usage.csv file:\n\n```\nService, Operation, UsageType,\
    \ StartTime, EndTime, UsageValue\nAmazonEC2,PublicIP-In,DataTransfer-Regional-Bytes,01/01/09\
    \ 00:00:00,01/02/09 00:00:00,97625\nAmazonEC2,RunInstances,BoxUsage,01/01/09 00:00:00,01/02/09\
    \ 00:00:00,24\nAmazonEC2,ElasticIP-Out,DataTransfer-Regional-Bytes,01/01/09 00:00:00,01/02/09\
    \ 00:00:00,558960\nAmazonEC2,ElasticIP-In,DataTransfer-Regional-Bytes,01/01/09\
    \ 00:00:00,01/02/09 00:00:00,24449\n...\n```\n\nThe first line of the file provides\
    \ the field names, while the other lines contain data: one record per line, with\
    \ values separated by commas. PHP's fgetcsv function makes it easy to deal with\
    \ CSV files. The function reads a line from a file, separates the fields at comma\
    \ boundaries (respecting quoted strings), and returns an array of values. Here's\
    \ what it returns for the first line of my file:\n\n```\nArray (\n   [0] => Service\n\
    \   [1] => Operation\n   [2] => UsageType\n   [3] => StartTime\n   [4] => EndTime\n\
    \   [5] => UsageValue\n)\n```\n\nThe usage data files for each AWS service contain\
    \ some common fields and some that are specific to a particular service. For example,\
    \ the usage data files for S3 also contain a Resource field. This field associates\
    \ the usage data with an S3 bucket."
  merge: -1
  img_proc: true
- pgno: 317
  md: "Similarly, the usage data files for Amazon CloudFront use the `Resource` field\
    \ to identify the account data associated with a particular CloudFront distribution.\
    \ Because the data format contains common elements and some service-specific variants,\
    \ Amazon SimpleDB makes an ideal storage system for it. We will need a domain:\n\
    \n```\n```text\nchapter_10/include/book.inc.php (excerpt)\n\ndefine('BOOK_AWS_USAGE_DOMAIN',\
    \ 'aws_usage');\n```\n```\n\nWe can use a modified version of the domain creation\
    \ program from Chapter 8 to create this domain:\n\n```\n```text\nchapter_10/create_domain.php\
    \ (excerpt)\n\n:::\n$res = $sdb->create_domain(BOOK_AWS_USAGE_DOMAIN);\n:::\n\
    ```\n```\n\nLet's put together a program to import data from one or more CSV files\
    \ specified on the command line. Here's what we need to start off:\n\n```\n```text\n\
    chapter_10/import_usage.php (excerpt)\n\n#!/usr/bin/php\n<?php\n\nerror_reporting(E_ALL);\n\
    \nrequire_once('cloudfusion.class.php');\nrequire_once('include/book.inc.php');\n\
    \nif ($argc == 1)\n{\n    exit(\"Usage: \" . $argv[0] . \" CSV_FILE ...\\n\");\n\
    }\n```\n```\n\nThe script expects to find one or more CSV files on the command\
    \ line and the code above performs this check. It then outputs a helpful message\
    \ if there are too few command line arguments."
