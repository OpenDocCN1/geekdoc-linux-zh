  md: "In this example, `“Role=Server,Size=Small,Name=MainServer,Input=Queue1”` is\
    \ the string contained in my user data. I can retrieve this information immediately\
    \ after my instance has launched, and use it to control the behavior of my instance.\n\
    \nOnce launched, the user data can be retrieved like this:\n\n```\n```\n<dev>\
    \ wget -q http://169.254.169.254/latest/user-data\n<dev> cat user-data\nRole=Server,Size=Small,Name=MainServer,Input=Queue1\n\
    ```\n```\n\nOf course, we can also retrieve and process the user metadata using\
    \ a simple PHP program:\n\n```\n```\n chapter_10/ec2_user_data.php (excerpt)\n\
    \n#!/usr/bin/php\n<?php\n\n$userData = file_get_contents(\n        'http://169.254.169.254/latest/user-data');\n\
    $options = array();\n\nforeach (explode(\",\", $userData) as $userDataItem)\n\
    {\n    if (preg_match(\"!^([a-zA-Z]{1,})=([a-zA-Z0-9]{1,})$!\",\n            $userDataItem,\
    \ $parts))\n    {\n        $name  = $parts[1];\n        $value = $parts[2];\n\n\
    \        $options[$name] = $value;\n    }\n}\n\nprint_r($options);\n?>\n```\n\
    ```\n\nThe file_get_contents function fetches the user metadata. The string is\
    \ broken up at comma boundaries using PHP’s explode function, producing name-value\
    \ pairs in the form Role=Server.\n\nYou can use the user metadata facility any\
    \ way you’d like. You can pass server names, server roles, SQS queue names, sizes,\
    \ limits, and so forth. You’ll need to"
