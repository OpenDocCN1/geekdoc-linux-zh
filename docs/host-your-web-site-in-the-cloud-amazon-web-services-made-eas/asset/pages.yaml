- pgno: 237
  md: '| Parameter | Value | Units |

    |---|---|---|

    | `HealthyThreshold` | 3 | probes |

    | `UnhealthyThreshold` | 3 | probes |

    | `Interval` | 30 | seconds |

    | `Timeout` | 5 | seconds |


    Here''s what happens:


    +   1. A probe is started every 30 seconds. If the instance responds as expected
    within five seconds then the probe succeeded, otherwise it failed.

    +   2. If the instance''s state is `InService` and three successive probes fail,
    the state is changed to `OutOfService` and no further traffic is routed to the
    instance.

    +   3. If the state of the instance is `OutOfService` and is found to be healthy
    for three successive probes, the state is changed to `InService` and traffic is
    once again routed to the instance.


    Health probes can be set to be TCP-style or HTTP-style:


    +   *   A **TCP-style probe** attempts to open a connection to a specified port
    on the target instance. If the connection is made, it''s immediately closed and
    the instance is considered healthy.

    +   *   **HTTP-style probes** are more involved. The connection is opened and
    then a `GET` request is made for the URL fragment. If the target is `HTTP:80/check.html`,
    the HTTP `GET` request will be made on port 80 for page /check.html. If the server
    replies with a 200 OK response, it''s deemed healthy. Any other response (or no
    response altogether) is considered unhealthy. These responses will show up in
    your web server''s log files; you may want to arrange to filter them out if you''re
    collecting statistics on visits to your site.


    You can use the HTTP-style probe in some creative ways. The simplest and most
    obvious task to perform is to refer to a static page. If the server is up and
    the web server is running, the page will be available and the instance will receive
    traffic.


    However, what if it''s a dynamic page? Then your application could, for example,
    take itself offline for periodic database backups by returning a response like
    503'
