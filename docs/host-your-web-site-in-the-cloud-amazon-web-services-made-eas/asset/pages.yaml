    and selecting **Account Activity** from the **Your Account** menu. After logging
    in you''ll be able to see detailed usage and cost information for each of the
    services that you use. You can expand each section using the + icon next to the
    name of the service. Figure 10.1 shows my account activity for August of 2009:'
