    # ## Auto Scaling Concepts


    You can create auto scaling groups in any EC2 region using EC2''s auto scaling
    feature. Each auto scaling group has a reference name and can span one or more
    Availability Zones. An auto scaling group relies on a launch configuration to
    provide the information needed to launch EC2 instances. A trigger attached to
    the group supplies the information needed to initiate a scaling activity. A **scaling
    activity** is generated each time an auto scaling group launches or terminates
    EC2 instances. Instances are added as part of a **scale-out event** and terminated
    as part of a **scale-in event**. Each group also has a minimum size and a maximum
    size.


    An **Auto Scaling launch configuration** includes an AMI ID, the name of an EC2
    key pair, a list of EC2 security groups, an EC2 instance type, and other information
    needed to launch EC2 instances as needed.


    An auto scaling trigger references a CloudWatch metric such as EC2 CPUPutilization
    or elastic load balancing HealthyHostCount. The trigger also includes upper and
    lower threshold values and scaling increments. The scaling increments can be absolute
    ("add 1 more instance") or relative ("add 50% more instances"). The trigger''s
    breach duration specifies the time period over which the trigger''s thresholds
    are evaluated against the metrics.


    # ## Auto Scaling Processing Model


    Although auto scaling is independent of elastic load balancing, the two features
    were designed to work hand-in-glove to allow you to easily load balance large
    numbers of requests across an automatically scaled cluster of EC2 instances. Once
    everything is set up, you can simply route all your traffic to the load balancer
    and AWS will take care of the rest.


    The auto scaling processing model is clean and easy to understand. To make a start,
    create the following:


    +   1. an elastic load balancer for one or more Availability Zones

    +   2. a launch configuration, specifying the ID of the AMI to be launched, the
    instance type, and other sought parameters'
  merge: -1
  img_proc: true
- pgno: 245
  md: '+   3. an auto scaling group for the desired set of Availability Zones, supplying
    the names of the load balancer and the launch configuration, the desired minimum
    and maximum size of each group, and a reference name for the group

    +   4. a trigger for the group


    Then sit back and relax as the auto scaling process ensures that you have sufficient
    EC2 instances in place to meet your application’s requirements, as expressed in
    the group size and in the trigger.


    Once an auto scaling group is up and running, it operates as follows:


    +   1. The CloudWatch metrics specified in the group’s trigger are retrieved using
    the parameters (Namespace, Dimension, Measure, Statistic, and Unit) for a time
    range that extends back in time by the trigger’s BreachDuration value.

    +   2. The metrics are checked against the trigger’s thresholds. If the metrics
    are larger than the UpperThreshold, and the number of EC2 instances in the group
    is less than the MaxSize, a scale-out event is initiated. One or more EC2 instances
    are launched using the group’s launch configuration parameters. The number of
    instances launched depends on the trigger’s UpperBreachScaleIncrement. If the
    value of this parameter ends with a percent sign (“%”) then sufficient instances
    are launched to raise the total number in the group by that percentage. Otherwise,
    the value is used as the actual number of instances to launch. New instances are
    automatically added to the load balancer (if any) associated with the group.


    In similar fashion, if the metric is smaller than the LowerThreshold, and the
    number of instances in the group is more than MinSize, a scale-in event is initiated.
    One or more EC2 instances are terminated, again using the parameters from the
    group’s launch configuration. The number of instances terminated depends on the
    trigger’s LowerBreachScaleIncrement, which can be a percentage value or a number.
    In either case the numeric value should be negative. The excess instances are
    removed from the load balancer (if any) before they’re terminated.


    After a scale-in or scale-out event, no further automatic scaling actions will
    be triggered until after the group’s cool-down period has passed. All the scale-in
    and scale-out events are logged and can be retrieved for later analysis.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'In most cases you''ll configure the trigger to use minimum or maximum values
    as the basis for scaling decisions. Here are some examples:


    | Namespace | Metric | Statistic |

    | :--- | :--- | :--- |

    | AWS/EC2 | CPUUtilization | Average |


    Scale up or scale down when the average CPU utilization [across all the instances
    in the group] exceeds `UpperThreshold`. Scale down when it is less than `LowerThreshold`.


    | Namespace | Metric | Statistic |

    | :--- | :--- | :--- |

    | AWS/EC2 | NetworkIn | Maximum |


    Scale up when the incoming network traffic exceeds `UpperThreshold`. Scale down
    when it is less than `LowerThreshold`.


    | Namespace | Metric | Statistic |

    | :--- | :--- | :--- |

    | AWS/ELB | HealthyHostCount | Minimum |


    Scale down when the number of healthy hosts exceeds `UpperThreshold`. Scale up
    when the number of healthy hosts is less than `LowerThreshold`.17


    You can also create an auto scale group without a trigger. In this case the group
    will start out by creating enough EC2 instances to reach the minimum number specified
    for the group. You can increase the instance count programmatically at any time
    using the `SetDesiredCapacity` function or the `as-set-desired-capacity` command.


    There are a couple of important aspects to this model that you need to take into
    account as you consider ways to put elastic load balancing to use in your application:


    +   - The EC2 instances are run as needed and are immediately put into service.
    Therefore, the specified AMI is responsible for all startup chores, including
    the ones that you sometimes do manually in more traditional environments. Put
    a different way, there''s no opportunity for you to log in to the newly launched
    instances and tweak them between the time they''re launched and put into service.


    17 In order to implement this behavior, the `UpperBreachScaleIncrement` must be
    a negative value and the `LowerBreachScaleIncrement` must be a negative value.'
