  md: '+   The **CreateAutoScalingGroup**, **DeleteAutoScalingGroup**, **DescribeAutoScalingGroups**,
    **SetDesiredCapacity**, and **UpdateAutoScalingGroup** functions operate on auto
    scaling groups; the operations should be self-evident from the names. The update
    function allows you to change the group''s parameters while it''s operational.


    +   The **CreateLaunchConfiguration**, **DeleteLaunchConfiguration**, and **DescribeLaunchConfigurations**
