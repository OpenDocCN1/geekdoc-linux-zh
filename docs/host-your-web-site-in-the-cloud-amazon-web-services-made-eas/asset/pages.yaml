  md: "# # The New Item Submission Form\n\nThe **Add new item** ... link links to\
    \ the **add_form.php** script. The script is invoked via HTTP GET or HTTP POST,\
    \ and behaves differently for each method. When invoked via **GET**, it generates\
    \ an empty form. When invoked via **POST**, it stores the new item form values\
    \ in SimpleDB and S3.\n\nHere's how it looks:\n\n```\ncloudlist/add_form.php (excerpt)\n\
    \n```php\n<?php\n\nerror_reporting(E_ALL);\n\nrequire_once('cloudfusion.class.php');\n\
    require_once('include/cloudfunctions.inc.php');\n\n$S3  = new AmazonS3();\n$Sdb\
    \ = new AmazonSDB();\n\nif (isset($_POST['formsubmit']))\n{\n    : process POST\
    \ data...\n}\nelse\n{\n    $cities     = getCities($Sdb);\n    $categories = getCategories($Sdb);\n\
    \    include 'include/addform.html.php';\n    exit(0);\n}\n\n?>\n```\n```\n\n\
    The script looks for a submitted value called **formsubmit**. If present, the\
    \ form must have been submitted and we can proceed to process the form data; otherwise,\
    \ we display the empty form. We'll examine the form processing code in a moment.\n\
    \nTo respond to a **GET** request, the code above retrieves all the cities and\
    \ categories from the database and then outputs the HTML template. Let's have\
    \ a look at the template:"
