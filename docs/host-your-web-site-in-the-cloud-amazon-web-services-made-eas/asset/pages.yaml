- pgno: 36
  md: 'The important point is that you can now write a program to initiate, control,
    monitor, and choreograph large-scale resource usage in the cloud. Scaling and
    partitioning decisions (such as how to add more server capacity or allocate existing
    capacity) that were once made manually and infrequently by system administrators
    with great deliberation can now be automated and done with regularity.


    # Characterizing the Cloud


    Now that you have a basic understanding of what a cloud is and how it works, let’s
    enumerate and dive in to some of its most useful attributes and characteristics.
    After spending years talking about Amazon Web Services in public forums, I’ve
    found that characterization is often more effective than definition when it comes
    to conveying the essence of the Amazon Web Services, and what it can do.


    # General Characteristics


    Here are some general characteristics of the Amazon Web Services.


    # Elastic


    The cloud allows scaling up and scaling down of resource usage on an as-needed
    basis. Elapsed time to increase or decrease usage is measured in seconds or minutes,
    rather than weeks or months.


    # Economies of scale


    The cloud provider is able to exploit economies of scale and can procure real
    estate, power, cooling, bandwidth, and hardware at the best possible prices. Because
    the provider is supplying infrastructure as a commodity, it’s in its best interest
    to drive costs down over time. The provider is also able to employ dedicated staffers
    with the sometimes elusive skills needed to operate at world-scale.


    # Pay-as-you-go


    This is a general characteristic rather than a business characteristic for one
    very good reason: with cloud-based services, technical people will now be making
    resource allocation decisions that have an immediate effect on resource consumption
    and the level of overall costs. Running the business efficiently becomes *everyone’s*
    job.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Business Characteristics


    Here are some of the defining characteristics of the Amazon Web Services from
    a business-oriented point of view:


    # No up-front investment


    Because cloud computing is built to satisty usage on-demand for resources, there''s
    no need to make a large one-time investment before actual demand occurs.


    # Fixed costs become variable


    Instead of making a commitment to use a particular number of resources for the
    length of a contract (often one or three years), cloud computing allows for re-
    source consumption to change in real time.


    # CAPEX becomes OPEX


    Capital expenditures are made on a long-term basis and reflect a multi-year commitment
    to using a particular amount of resources. Operation expenditures are made based
    on actual use of the cloud-powered system and will change in real time.


    # Allocation is fine-grained


    Cloud computing enables minimal usage amounts for both time and resources (for
    example: hours of server usage, bytes of storage).


    # The business gains flexibility


    Because there''s no long-term commitment to resources, the business is able to
    respond rapidly to changes in volune or the type of business.


    # Business focus of provider


    The cloud provider is in the business of providing the cloud for public use. As
    such, it has a strong incentive to supply services that are reliable, applicable,
    and cost-effective. The cloud reflects a provider''s core competencies.


    # Costs are associative


    Due to the flexible resource allocation model of the cloud, it''s just as easy
    to acquire and operate 100 servers for one hour as it is to acquire and operate
    one server for 100 hours. This opens the door to innovative thinking with respect
    to ways of partitioning large-scale problems.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Technical Characteristics


    Here are some of the defining characteristics of the Amazon Web Services from
    the technical standpoint:


    # Scaling is quick


    New hardware can be brought online in minutes to deal with unanticipated changes
    in demand, either internally (large compute jobs) or externally (traffic to a
    web site). Alternatively, resources can be returned to the cloud when no longer
    needed.


    # Infinite scalability is an illusion


    While not literally true, each consumer can treat the cloud as if it offers near-infinite
    scalability. There’s no need to provision ahead of time; dealing with surges and
    growth in demand is a problem for the cloud provider, instead of the consumer.


    # Resources are abstract and undifferentiated


    Cloud computing encourages a focus on the relevant details—results and the observable
    performance—as opposed to the technical specifications of the hardware used. Underlying
    hardware will change and improve over time, but it’s the job of the provider to
    stay on top of these issues. There’s no longer a need to become personally acquainted
    with the intimate details of a particular dynamic resource.


    # Clouds are building blocks


    The cloud provides IT resources as individual, separately priced, atomic-level
    building blocks. The consumer can choose to use none, all, or some of the services
    offered by the cloud.


    # Experimentation is cheap


    The cloud removes the economic barrier to experimentation. You can access temporary
    resources to try out a new idea without making long-term commitments to hardware.


    # Some Common Misconceptions


    After talking to thousands of people over the last few years, I’ve learned that
    there are a lot of misconceptions floating around the cloud. Some of this is due
    to the'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'inherent unease that many feel with anything new. Other misconceptions reflect
    the fact that all the technologies are evolving rapidly, with new services and
    features appearing all the time. What''s true one month is overtaken the next
    by a new and improved offering. With that said, here are some of the most common
    misconceptions. Parts of this list were adapted from work done at the University
    of California, Berkeley. $ ^{7} $


    # **"The cloud is a fad"**


    Given the number of once-promising technologies that have ended up on history''s
    scrap heap, there''s reason to be skeptical. It''s important to be able to respond
    quickly and cost-effectively to changes in one''s operating environment; this
    is a trend that''s unlikely to reverse itself anytime soon, and the cloud is a
    perfect fit for this new world.


    # **"Applications must be re-architected for the cloud"**


    I hear this one a lot. While it''s true that some legacy applications will need
    to be re-architected to take advantage of the benefits of the cloud, there are
    also many existing applications using commercial or open source stacks that can
    be moved to the cloud more or less unchanged. They won''t automatically take advantage
    of all the characteristics enumerated above, but the benefits can still be substantial.


    # **"The cloud is inherently insecure"**


    Putting valuable corporate data "somewhere else" can be a scary proposition for
    an IT manager accustomed to full control. Cloud providers are aware of this potential
    sticking point, taking this aspect of the cloud very seriously. They''re generally
    more than happy to share details of their security practices and policies with
    you. Advanced security systems, full control of network addressing and support
    for encryption, coupled with certifications such as SAS 70,$^{5}$ can all instill
    additional confidence in skeptical managers. I''ll address the ways that AWS has
    helped developers, CIOs, and CTOs to get comfortable with the cloud in the next
    chapter.


    $^{7}$ Michael Armbrust, Armando Fox, Rean Griffith, Anthony D. Joseph, R. H.
    Katz, Andrew Konwinski, Gunho Lee, David A. Patterson, Ariel Rabkin, Ion Stoica,
    and Matei Zaharia, *Above the Clouds: A Berkeley View of Cloud Computing* (Berkeley:
    University of California, 2009), at http://d1snmf0g31qze k.cloudf ront.net/abovetheclouds.pdf.


    $^{8}$ http://www.sas70.com/'
  merge: -1
  img_proc: true
- pgno: 40
  md: '12  **Host Your Web Site in the Cloud**


    # “The cloud is a single point of failure”


    Some developers wonder what happens if the cloud goes down? Unlike traditional
    data centers, the AWS cloud offers a wide variety of options for functional and
    geographic redundancy to ensure high availability.


    # “The cloud promotes lock-in”


    Because you can run existing applications on the cloud, they can be moved off
    as easily as they can be moved on. Operating systems, middleware, and applications
    can often be run in a cloud environment with little or no change. Of course, applications
    can be updated to take advantage of services offered by the cloud and that’s what
    we’ll be exploring in this book.


    # “The cloud is only good for running open source code”


    This argument no longer holds water. Commercial operating system and application
    software vendors now recognize the cloud as a legitimate software environment
    and have worked to ensure that their applications have the proper cloud-friendly
    licenses. Forward-thinking vendors are now making their licensed software available
    on an hourly, pay-as-you-go basis. Instead of buying, for example, a database
    license for tens or even hundreds of thousands of dollars, you can gain access
    to the same database for a few dollars per hour.


    # “Cloud resources are too expensive”


    Making a genuine comparison between internal IT resources and equivalent cloud
    computing resources has proven to be a difficult task. ${}^{9}$ Establishing the
    complete, all-inclusive cost of internal resources requires a level of tracking
    and accounting that’s absent in most large- or mid-sized organizations. It’s far
    too easy to neglect obvious costs, or to compare internal resources at a permanent
    hourly cost to scalable cloud resources that cost nothing when idle.


    You’ll find more detailed explanations in the remaining chapters of this book
    as to why these are indeed misconceptions.


    > ${}^{9}$ See, for example, James Hamilton’s blog post: *McKinsey Speculates
    that Cloud Computing May Be More Expensive than Internal IT* at http://perspectives.mvdirona.com/2009/04/21/McKinseySpeculatesThatCloudComputingMayBeMoreExpensiveThanInternalIT.aspx.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# ## Cloud Usage Patterns\n\nLet’s now examine some common cloud usage patterns.\
    \ Armed with this information, you should be in a good position to decide whether\
    \ your application or workload is a good fit for AWS. Although all these patterns\
    \ essentially represent usage over time, there are a number of important nuances.\
    \ In the cases below, “usage” generally represents a combination of common cloud\
    \ resources—servers, storage, and bandwidth.\n\n+   * **Constant usage over time**\n\
    +       common for internal applications where there’s little variation in usage\
    \ or load from day to day or hour to hour\n+   \n+   * **Cyclic internal load**\n\
    +       characteristic for batch or data processing applications run on a predictable\
    \ cycle, such as close of business for the day or month; the load, both in time\
    \ and expected resource consumption, is highly predictable.\n+   \n+   * **Cyclic\
    \ external load**\n+       often applies to web sites that serve a particular\
    \ market demand; sites related to entertainment and sporting events often fit\
    \ this pattern.\n+   \n+   * **Spiked internal load**\n+       typical in environments\
    \ where researchers or analysts can submit large-scale, one-time jobs for processing;\
    \ the demand is usually unpredictable.\n+   \n+   * **Spiked external load**\n\
    +       seen on the Web when an unknown site suddenly becomes popular, often for\
    \ a very short time\n+   \n+   * **Steady growth over time**\n+       usually\
    \ for a mature application or web site; as additional users are added, growth\
    \ and resources track accordingly.\n\n# ## Cloud Use Cases\n\nGiven that you’ve\
    \ read this far, you might be wondering how other people are putting clouds to\
    \ use. In this section I’ve collected some (but definitely not all) of the most\
    \ common use cases, starting simple and building to the more complex."
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Hosting Static Web Sites and Complex Web Applications


    The cloud can easily host a static web site built from static HTML pages, CSS
    style sheets, and images. In fact, the simplest of such sites can be hosted using
    only cloud storage, perhaps aided by a content distribution system.


    More complex web sites, often with substantial server-side processing and access
    to a relational database, can also be hosted in the cloud. These sites make use
    of cloud storage and processing, and often require substantial processing and
    storage resources to attain the required scale.


    # Software Development Life Cycle Support


    The cloud is a good match for the resource requirements of each phase of the software
    development life cycle.


    During development, using the cloud can ensure that developers have adequate resources
    for their work. Suppose that a team of developers are building a classic three-tier
    web application with web, application, and database tiers, each destined to reside
    on a separate physical server at deployment time. Without AWS, each developer
    would be supplied with three complete servers, each of which would sit idle for
    much of the day. Costs grow quickly when new developers are added to the project.
    Moving to the cloud means that each developer can spin up servers in the morning,
    develop and test all day, and then return the servers to the cloud at the end
    of the working day.


    The cloud is also valuable during software testing. Developers can spin up testing
    servers and run unit tests on them without burdening their development servers.
    If there are numerous unit tests, multiple parallel servers can be used to spread
    the load around.


    The cloud can be used to support a continuous integration environment. In such
    an environment, each source code commit operation initiates a multistep process
    of rebuilding, unit testing, and functional testing. If the code is being written
    for multiple target environments (several different versions or variants of Linux)
    or platforms (Windows and Linux), the cloud can be a very cost-effective alternative
    to owning your own infrastructure.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Load and performance testing can be done throughout each development cycle
    using cloud computing resources. If the application itself will run on the cloud,
    the testing will ensure that it performs well under a heavy load, adding additional
    resources as the load grows and removing them as it dissipates.


    Testing the performance of a web application intended for public or enterprise
    deployment becomes easier when the cloud can supply the resources needed to conduct
    a test at a scale representative of the expected load. Several companies use cloud
    resources to generate loads that are the equivalent to hundreds of thousands of
    simultaneous users.


    Once the application has been deployed (perhaps also to the cloud), the cloud
    can supply the resources needed to perform compatibility tests when application
    middleware layers or common components are updated. Thorough testing can help
    establish the confidence needed to make substantial upgrades to a production system
    without the risk of downtime.


    # ## Training


    The cloud can supply the short-term resources needed to support various types
    of training programs.


    If students are learning how to install, run, and monitor the three-tier application
    described in the previous section, they can use their own laptops to access cloud
    resources allocated for the duration of the class. When the class is over for
    the day the resources are returned to the cloud. The students can start from a
    single “master” machine image and avoid wasting time (theirs or the instructor’s)
    installing and configuring required packages and applications.


    Traditional training classes must impose limits on class size corresponding to
    the restricted amount of physical hardware that they have available. Leading companies
    are now conducting online training seminars, backed by per-student cloud-based
    resources where an additional server is launched as each new student joins the
    class. This technique has been used by application and database software vendors
    with impressive results.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# ## Demos


    Resources drawn from the cloud can be used to host and deliver demos and trial
    versions of packaged software applications. Vendors can place demos into the hands
    of potential customers while the lead is “hot,” rather than after the usual protracted
    delay while a suitable test environment is prepared. Application vendors can create
    and provide access to a server hosted in the cloud at low cost and on short notice.
    The sales cycle is shortened and customers have a good experience with the use
    of cloud-based resources. In some cases, cloud-based demos actually lead to cloud-based
    deployment.


    # ## Data Storage


    The cloud is a good place to store private or public data. Scalability, long-term
    durability, and economy of scale are of paramount importance for this use case.
    The stored data could be as simple and compact as a few personal files for backup,
    or it could be as large and complex as a backup of a company’s entire digital
    assets, or anything in between.


    Often, use of storage in the cloud turns out to be an excellent first step, a
    step that inspires confidence and soon leads to considering the cloud for other,
    more complex, use cases.


    # ## Disaster Recovery and Business Continuity


    Enterprises with a mission-critical dependence on IT resources must have a plan
    in place to deal with any setback, be it a temporary or permanent loss of the
    resources or access to them. The plan must take into account the potential for
    fires, floods, earthquakes, and terrorist acts to disrupt a company’s operations.
    Many businesses maintain an entire data center in reserve; data is replicated
    to the backup center on occasion and the entire complex stands ready to be activated
    at a moment’s notice. Needless to say, the cost of building and running a duplicate
    facility is considerable.


    Cloud computing, once again, offers a different way to ensure business continuity.
    Instead of wasting capital on hardware that will never be put to use under normal
    circumstances, the entire corporate network can be modeled as a set of cloud resources,
    captured in template form, and then instantiated when trouble strikes. In this
    particular use case, you’ll need to work with your cloud provider to ensure that
    the necessary resources will be available when you need them.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Once the corporate network has been modeled for business continuity purposes,
    other interesting uses come to mind. Traditionally, widespread deployment of updated
    versions of middleware and shared applications components require substantial
    compatibility and performance testing. This task is fraught with peril! Many companies
    find themselves slowly slipping behind: they''re unable to deploy the newest code
    due to limitations in their ability to fully test before deployment, and unwilling
    to risk facing the consequences of a failed deployment.


    Imagine spinning up a full copy (or a representative, scaled-down subset) of the
    corporate network, along with specified versions of the application components
    to be tested, and then running compatibility and load tests on it, all in the
    cloud, and at a very reasonable cost.


    # Media Processing and Rendering


    A number of popular web sites support uploading of media files: music, still images,
    or videos. Once uploaded the files undergo a number of processing steps, which
    can be compute-intensive, I/O intensive, or both. Files of all types are scanned
    for viruses and other forms of malware. Music is fingerprinted (to check for copyright
    violations) and then transcoded to allow for playback at different bit rates.
    Images are scaled, watermarked, checked for duplication, and rendered in different
    formats. Videos are also transcoded and scaled, and sometimes broken into shorter
    chunks. Finally, the finished objects are stored and made available for online
    viewing or downloading.


    Rendering uses a scene description to generate frames for an animated movie. Each
    frame can be rendered independently of the others. There’s comparatively little
    input data, but plenty of output data. The process is compute-intensive, since
    each pixel of each frame must be computed, taking into account light, shadow,
    color, and motion.


    Cloud computing is ideal for processing and rendering use cases due to the amount
    of storage, processing, and internet bandwidth they can consume.


    # Business and Scientific Data Processing


    Scientific and business data processing often involves extremely large-scale data
    sets and can consume vast amounts of CPU power. Analysis is often done on an on-demand
    basis, leading to over-commitments of limited internal resources. In fact,'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'I''m told that many internal scientific compute grids routinely flip between
    0% usage (absolutely no work to be done) and 100% usage (every possible processor
    is in use). This is a particularly acute problem on university campuses, where
    usage heats up before the end of the semester and before major conferences.


    Business data processing can be ad hoc (unscheduled) or more routine; monthly
    payroll processing and daily web log processing come to mind as very obvious use
    cases for cloud computing. A large, busy web site is capable of generating tens
    of gigabytes of log file data in each 24-hour period. Due to the amount of business
    intelligence that can be mined from the log files, analysis is a mission-critical
    function. Gaining access to the usage data on a more timely basis enables better
    site optimization and a quicker response to changes and trends. The daily analysis
    process starts to take long and longer, and at some point begins to take almost
    24 hours. Once this happens, heavily parallel solutions are brought to bear on
    the problem, consuming more resources for a shorter amount of time—a perfect case
    for cloud computing.


    # Overflow Processing


    As companies begin to understand the benefits that cloud computing brings, they
    look for solutions that allow them to use their existing IT resources for routine
    work, while pushing the extra work to the cloud. It''s like bringing in temporary
    workers to handle a holiday rush.


    Overflow processing allows companies to become comfortable with the cloud. They
    find more and more ways to use the cloud as their confidence level increases,
    and as the amount of vital corporate data already present in the cloud grows.


    # Just Recapping


    As you can see, there are a number of different ways to use the cloud to host
    existing applications, build creative new ones, and improve the cost-effectiveness
    and efficiency of organizations large and small.


    In this chapter we''ve learned the fundamentals of cloud computing. Using a sporting-venue
    analogy, we''ve seen how cloud computing allows individuals and organizations
    to do a better job of matching available resources to actual demand. We''ve learned
    about the notion of a “success disaster” and aim to avoid having one of our own—with
    the assistance of AWS, of course. From there we covered the character-'
  merge: -1
  img_proc: true
