    # # Listing Objects in a Bucket as a Web Page


    Before we can write a script that outputs a list of all the objects in a bucket
    within a web page, we first have to write a rather complex function. We''ll add
    this function to our `book.inc.php` file and call it `getBucketObjects`:'
