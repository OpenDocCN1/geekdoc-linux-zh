  md: 'The final image represents the cooperative work of four processing stages and
    the loader program. Each stage can run at its own speed, with work accumulating
    in the queues as necessary. The application can easily scale up to handle dozens
    or even hundreds of requests per minute without too much trouble.


    # # Running the Code


    You’ll need to be good at window manipulation if you’d like to run the code in
    this chapter. First, create five terminal windows—each will represent a stage,
    with the final window for loading the URLs. Connect to your AMI and run one command
    in each. If possible, arrange the windows in order so that you can see the processing
    pipeline in action. Here’s what you need to do:


    +   1. Window 1—fetch and store a page:


    ```

    ```

    <dev> php fetch_page.php

    ```

    ```


    +   2. Window 2—parse a page:


    ```

    ```

    <dev> php parse_page.php

    ```

    ```


    +   3. Window 3—fetch thumbnail images:


    ```

    ```

    <dev> php fetch_images.php

    ```

    ```


    +   4. Window 4—render the final image:


    ```

    ```

    <dev> php render_images.php

    ```

    ```


    +   5. Window 5—load URLs into the pipeline. You can do this connected to your
    AMI or locally:


    ```

    ```

    $ php load_crawl_urls.php http://www.sitepoint.com

    ```

    ```'
