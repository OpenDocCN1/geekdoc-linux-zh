  md: '# # Elastic Block Storage


    We covered the basics of Amazon EC2’s Elastic Block Storage feature in Chapter
    5, where we learned how to create, attach, format, and mount EBS volumes on an
    EC2 instance. In this section you’ll learn more about EBS. We’ll cover command
    line usage, see how to do backups, learn about public data sets, and see how to
    increase performance or capacity by creating a RAID device on top of multiple
    EBS volumes.


    # ## EBS from the Command Line


    You can perform all the EBS functions from the command line. You can create, attach,
    snapshot (back up), detach, and delete EBS volumes.


    An EBS volume can be attached to any EC2 instance in the same Availability Zone.
    If you have a running instance, you can determine its Availability Zone from the
    AWS Management Console or from the command line. You can also retrieve this information
    (and a lot more) from the EC2 instance metadata, which we’ll talk about later
    in this chapter.


    With the Availability Zone in hand, here’s how you create a new EBS volume from
    the command line:


    ```

    $ ec2-create-volume -z us-east-1b -s 50

    VOLUME vol-73d4211a 50 us-east-1b creating

    ← 2009-08-20T19:12:09+0000

    ```


    The volume status is reported as “creating” immediately after execution of this
    command. The command also displays the volume ID (vol-73d4211a in my case). You’ll
    need this ID later.


    You need to wait (ordinarily just a matter of seconds) until the volume becomes
    available before proceeding. Here’s how to check it:


    ```

    $ ec2-describe-volumes vol-73d4211a

    VOLUME vol-73d4211a 50 us-east-1b available

    ← 2009-08-20T19:12:09+0000

    ```


    Now you need to attach the volume to your instance. You’ll need the instance’s
    ID, the volume ID, and a device name. Although Linux disk device names are essentially'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'arbitrary, by convention they reside in the /dev directory and have names that
    start with sd, followed by another letter. The EC2 system disk is /dev/sda and
    the other local disks (on the larger-sized instances) are sdb, sdc, and so forth.
    /dev/sdf is a good device name for the first EBS volume attached to the instance
    (as “f” is far enough down the alphabet to avoid colliding with another device).
    Here’s how to attach it:


    ```

    $ ec2-attach-volume vol-73d4211a -i i-da8f6db2 -d /dev/sdf

    ATTACHMENT vol-73d4211a i-da8f6db2 /dev/sdf

    attaching 2009-08-20T19:26:08+0000

    ```


    The command accepts the volume ID, followed by -i and the instance ID, and -d
    and the device name. The volume status changes to “attaching.” It will stay in
    this state for a few seconds before transitioning to “attached”:


    ```

    $ ec2-describe-volumes vol-73d4211a

    ATTACHMENT vol-73d4211a i-da8f6db2 /dev/sdf

    attached 2009-08-20T19:26:12+0000

    ```


    At this point, we have done the cloud computing equivalent of procuring a disk
    drive, plugging it into a server, and attaching the data cable. The disk is physically
    connected and running; the operating system is aware of it, but the disk is raw
    (unformatted) and yet to be part of the file system.


    The next step is to create a file system on the new volume and an attachment (mount
    point), and we can logically mount the volume on the instance’s root file system.
    We’ll follow the same procedure from the section called “Creating an EBS Volume”
    in Chapter 5 (you’ll need to log in to your EC2 instance to run these commands):


    ```

    <dev>: mkfs -F /dev/sdf

    <dev>: mkdir /data

    <dev>: mount /dev/sdf /data

    ```


    You can mount an EBS volume on any location in your instance’s file system. If
    you’re planning to create and use a large number of volumes, you should take the
    time to plan out a logical name structure beforehand.


    The volume is now ready for use. You can create directories, store files, and
    do whatever you need to inside of the /data directory hierarchy. I’m going to
    need some'
