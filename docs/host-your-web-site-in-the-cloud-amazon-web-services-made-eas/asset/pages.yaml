    # EBS RAID


    In this section, you will learn how to assemble a set of EBS volumes into a single
    virtual volume known as a RAID array.⁶ By doing so, you can create a virtual volume
    with some or all of the following attributes:


    +   Increased Storage Capacity

    +   A single EBS volume can be no larger than one terabyte. You can create a RAID
    array which spans any number of EBS volumes.⁷

    +   Increased I/O Capacity

    +   A RAID array can increase the overall I/O (input/output) throughput beyond
    what’s possible with a single EBS volume by distributing accesses across multiple
    volumes.

    +   Increased Redundancy

    +   A RAID array can store multiple copies of the same data to ensure that a copy
    is still available if a hardware device fails. This RAID feature is inapplicable
    to EBS because EBS stores data redundantly “under the covers.”


    RAID arrays can be created in a number of different configurations, also known
    as levels. Here are some of the simpler and more popular configurations:


    > ⁵ Or even terabytes, since each EC2 account can create up to 20 times one-terabyte
    volumes by default.

    > ⁶ The example used draws information from Eric Hammond’s post at http://alestic.com/2009/06/ec2-ebs-raid.

    > ⁷ A modern file system on a 64-bit system can theoretically handle a RAID array
    of any conceivable size. Practical considerations (such as the time to perform
    a disk repair using the fsck command) will come into play long before reaching
    any intrinsic limits of the file system.'
