    # Connecting with the Mac OS X or Linux Terminal


    Open a new terminal window and enter the following command:


    ```

    $ ssh -i jeffskeys.pem root@ec2-nnn-nnn-nn-nnn.compute-1.amazonaws.\_com

    ```


    Replace **jeffskeys.pem** with your own key pair file and *ec2-nnn-nnn-nn-nnn*
    with the public DNS name of your instance. You’ll receive the following response:


    ```

    The authenticity of host ''ec2-nnn-nnn-nnn-nnn.compute-1.amazonaws.\_com (nnn.nnn.nnn.nnn)''
    can’t be established.

    RSA key fingerprint is cd:79:eb:e3:e9:2e:d6:d2:9c:79:65:2a:27:c5:\_\_1b:ba.

    Are you sure you want to continue connecting (yes/no)?

    ```


    Of course, the host information and RSA key fingerprint details will be different
    to those above. If you enter **yes** to the question above, you will be logged
    in and will receive the following output:


    ```

    Warning: Permanently added ''ec2-nnn-nnn-nnn-nnn.compute-1.amazonaws.\_com,nnn.nnn.nnn.nnn''
    (RSA) to the list of known hosts.

    \_\_\|\_\_\|\_\_

    \_\| ( \_\_ ) Fedora 8

    / 32-bit

    ```'
