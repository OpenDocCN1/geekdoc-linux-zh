    # And That’s It


    I set out to create a simplified classified ad system, rather than a fully featured
    one, and I’m sure you’ll agree that I did so! I believe that you can do a lot
    with approx-

    imately 500 lines of PHP, backed up by the power of AWS. Because the storage is
    handled by a combination of Amazon SimpleDB and S3, this application should be
    able to deal with hundreds of thousands of users and millions of items without
    too much effort. If the request rate were to grow too high for a single SimpleDB
    do-

    main,4 it would be very easy to spread the items across multiple domains, perhaps
    one per state or (when it’s really busy) one per city. S3 has ample capacity and
    performance to serve up images directly, but I’d advise the use of CloudFront
    for production applications, since users will see the images more quickly.


    The operational complexity of a large version of this application would be fairly
    minimal and you’d be able to spend your time adding features, doing marketing,
    or keeping the userbase happy. I think this is a wonderful example of cloud computing
    in action!


    > 4 A single SimpleDB domain can generally handle several thousand read or write
    requests per second. This is, of course, dependent on the complexity of the items.'
