    # Dynamic Diagramming


    In this section we''ll use the EC2 APIs to retrieve the list of running instances,
    the EBS volumes attached to each of the instances, and the snapshots of those
    instances, and draw a simple system diagram. You should be able to take this program
    and extend it in many different ways without too much trouble.


