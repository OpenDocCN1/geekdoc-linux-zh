  md: "# Handling Numeric Data\n\nSimpleDB stores all data as strings. When the data\
    \ is the subject of a select query, a lexicographic comparison is used. This can\
    \ lead to some surprising results when numerical values are stored. For example,\
    \ the string \"10\" is less than the string \"2\". Leading minus signs are also\
    \ problematic.\n\nNumeric values should be left-padded with zeros to create fixed-length\
    \ strings. This can be done using PHP's `sprintf` function and an appropriate\
    \ format string. In our previous scripts, we should update the item value for\
    \ the `Size` attribute to use left-padding:\n\n```\narray('Name' => $file,\n \
    \      'Hash' => $hash,\n       'Size' => sprintf(\"%08s\", $size));\n```\n\n\
    If your numeric values can be negative, you should offset them by a large positive\
    \ number when you store them, and then compensate for this offset when you retrieve\
    \ them. Choose an offset value that ensures the smallest expected negative value\
    \ will end up as a positive value. For example, if your values will range from\
    \ -32,768 to 32,767, add 50,000 to adjust the range to 17,232 to 82,767 (stored\
    \ as \"17232\" through \"82767\").\n\n# Running a Query\n\nWith the data stored,\
    \ running queries is simple:\n\n```\nchapter_08/query_domain.php (excerpt)\n\n\
    #!/usr/bin/php\n<?php\n\nerror_reporting(E_ALL);\n\nrequire_once('cloudfusion.class.php');\n\
    require_once('include/book.inc.php');\n\n$query = \"select * from \" .\n    BOOK_FILE_DOMAIN\
    \ .\n    \" where Name like '%items'\";\n\n$sdb = new AmazonSDB();\n```"
  merge: -1
  img_proc: true
