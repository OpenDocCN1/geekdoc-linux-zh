  md: '# Chapter 10


    # Advanced AWS


    In this chapter we''ll build on what we''ve already learned. We''ll take a look
    at some advanced topics including accounting and tracking of your AWS usage, use
    of elastic block storage volumes, access to EC2''s instance metadata, and dynamic
    diagramming of your AWS-powered system.


    # Accounting and Tracking


    The dynamic nature of AWS—the ease with which you can store more data in Amazon
    S3, create and populate domains in SimpleDB, and launch EC2 instances—means that
    you should stay aware of your usage (and the associated costs).


