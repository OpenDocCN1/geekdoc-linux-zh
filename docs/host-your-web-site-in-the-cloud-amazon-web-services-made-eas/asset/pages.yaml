- pgno: 169
  md: '# Building a Scalable Architecture with Amazon SQS


    In this chapter you’ll learn all about Amazon SQS. We’ll start by addressing the
    concept of asynchronous messaging in the context of large-scale system architecture,
    and then we’ll take a look at Amazon SQS and the associated programming model.
    Next we’ll examine some of the instances where Amazon SQS can be used as a central
    component of a highly scalable system architecture, considering some important
    design patterns along the way. Then we’ll put our knowledge to good use by using
    Amazon SQS to construct a simple image crawler and processor.


    # Why Asynchronous Messaging?


    Asynchronous messaging refers to an architectural style dictating that applications
    should be built in a modular fashion. The application is composed of two or more
    processing steps, often arranged in a processing pipeline. The steps are loosely
    coupled to each other, passing work through the pipeline by sending messages from
    step to step. Adjacent processing steps might run on the same server, on different'
  merge: -1
  img_proc: true
- pgno: 170
  md: "servers in the same local area network, or on servers owned and operated by\
    \ separate organizations.\n\nThere are many advantages to this style of architecture:\n\
    \n+   - Each step runs at its own speed. Temporary slowdowns at one stage of the\
    \ pipeline simply result in work piling up, instead of stalling the entire pipeline.\n\
    +   - No work is lost if a particular step locks up, crashes, or is temporarily\
    \ overloaded. Once again, work simply piles up until processing resources are\
    \ available.\n+   - The independent nature of the steps allow them to be allocated\
    \ to more than one server if necessary.\n+   - Running steps on separate servers\
    \ means that it’s possible to scale the system to accommodate an increased load\
    \ by simply adding more servers.\n+   - Decomposition of complex applications\
    \ into independent steps results in opportunities for reuse, and can also simplify\
    \ testing, maintenance, and enhancement.\n+   - Steps can be allocated to servers\
    \ in such a way so that demands on resources such as CPU cycles, I/O bandwidth,\
    \ and memory are balanced.\n\nEach step in a processing pipeline resembles a worker\
    \ on a factory assembly line. The steps simply await the arrival of a work item,\
    \ process it, and then pass the work along to the next step. Here’s some pseudocode\
    \ for the central loop of a step in a processing pipeline:\n\n```\nwhile (true)\n\
    {\n    M = ReceiveMessage(INPUT_QUEUE);\n    P = ProcessMessage(M);\n    SendMessage(P);\n\
    }\n```\n\nThis particular example shows a 1:1 relationship between input and output\
    \ messages, but there can be variations on this. Processing one message could\
    \ result in zero, one, or many messages being sent. However, the other case, receiving\
    \ multiple messages and then sending just one, is relatively rare. This is because\
    \ the messages in the input queue are independent of each other and can generally\
    \ be processed in any order. We’ll consider other models in the next section."
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Asynchronous Messaging Patterns


    In this section, we''ll take a look at some effective ways to decompose a complex
    processing system by using a series of processes connected to each other with
    message queues.


    The first pattern is the linear processing pipeline. The first process passes
    work onto the second using a single queue, as depicted in Figure 6.1.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_171_0.png)


    Figure 6.1. A linear processing pipeline


    This pattern decouples Process 1 and Process 2, so that they can make progress
    independently. If Process 1 produces more results than Process 2 can absorb, they
    simple accumulate in Queue 1. If Process 2 has no work to do it simply idles,
    checking the queue for new work from time to time. This is a good starting point,
    but what if there is so much work to do that Process 2 is unable to keep up, and
    the size of the queue keeps on growing? The easiest solution is to simply start
    an additional copy of Process 2, as shown in Figure 6.2.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_171_1.png)


    Figure 6.2. A scalable linear processing pipeline'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'This is a very scalable model. You can start additional instances of Process
    2 to cope with the load, adjusting the number of processes to balance overall
    throughput, cost per hour (assuming that the processes are running on an EC2 instance),
    and customer satisfaction.


    The scalable linear pipeline is the most common pattern and can be used in many
    different types of applications. Each stage of the pipeline typically performs
    work of a particular type, such as transforming an image, checking a data record
    for consistency, or changing the format of a data file.


    The next pattern lets us route different types of messages to different queues.
    Routing could be based on the type of the message. A web crawler could have separate
    queues for HTML pages and for PDF documents. Alternatively, multiple queues could
    be used to provide better service for premium customers. This can be done in two
    distinct ways. A separate (and presumably lightly loaded) instance can handle
    the premium work, or a single instance can check and process the premium queue
    before handling any work in the regular one.


    In any case, the first process makes some type of decision and routes the message
    accordingly, leading to the pattern shown in Figure 6.3.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_172_0.png)


    Figure 6.3. Routing work to multiple queues


    Of course, you can run more than one instance of Process 2 or Process 3 to handle
    the workload. Because the processes are connected only by queues, you can easily
    add resources to cope with demand.


    Several processes can write to the same queue. Perhaps they''re taking data derived
    from different sources and extracting common elements. Figure 6.4 depicts the
    flow.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/4a5ba0dd041e08e6a67fa31d52309995_173_0.png)


    Figure 6.4. Two processes feeding a single queue


    The patterns we’ve examined thus far have been linear, proceeding from beginning
    to end. However, some kinds of applications may actually need to route original
    data (or, more likely, other information derived from the original data) back
    to the beginning. This pattern is often found in web crawlers, which examine web
    pages for links that are then themselves crawled. Used in this way, the queues
    are effectively implementing a recursive processing pattern, as can be seen in
    Figure 6.5.


    ![](img/4a5ba0dd041e08e6a67fa31d52309995_173_1.png)


    Figure 6.5. Feeding work back to earlier stages


    You can combine these patterns as needed in order to implement arbitrarily complex
    workflows. Once you become accustomed to thinking of your application in terms
    of loosely coupled, autonomous work units, you’ll see many different ways to put
    queues to work. Your applications will be modular and more flexible, and you’ll
    be able to adapt to changing conditions more quickly.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# # Amazon SQS Overview


    Reflecting the fundamental role of asynchronous messaging in the construction
    of highly scalable systems, Amazon SQS was one of the first Amazon infrastructure
    services to be released. Let''s take a look at the terminology, operations, and
    pricing model in this section. As you''ll soon see, Amazon SQS is fairly simple
    when compared to the other Amazon Web Services; however, refrain from thinking
    that such simplicity means there''s less value in SQS. On the contrary, many of
    the most successful AWS applications make very heavy use of SQS.


    # ## Terminology and Concepts


    You can create any number of SQS queues within the scope of your AWS account;
    however, Amazon does reserve the right to delete queues if no messages have been
    posted or retrieved for 30 consecutive days.


    Each queue has a name, which must be unique within a particular instance of SQS
    (there are currently instances of SQS in the US and in Europe). Queue names can
    be up to 80 characters long and can contain alphanumeric characters, dashes, and
    underscores.


    Every queue is identified by a unique queue URL. The URL is assigned when the
    queue is created. All the operations on a queue require the specification of a
    queue URL.


    Queues are used to store messages. Messages can be up to 8,192 bytes long. Due
    to this low limit, messages should generally be used to pass pointers (for example,
    URLs) to data stored elsewhere. Amazon S3 is often a good place to store data
    while it''s being passed through a complex processing pipeline.


    Instead of being automatically deleted, a message retrieved from SQS becomes temporarily
    invisible so that it''s unable to be retrieved a second time. Once your code retrieves
    a message, you have a certain amount of time—the visibility timeout—to process
    and then delete the message. If the message is retained (or if your application
    crashes while processing it), the message becomes visible once again. This model
    allows you to build applications that avoid data loss as a result of an application
    failure. The default value for the visibility timeout is 30 seconds and the maximum
    value is 12 hours.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'When you retrieve a message from SQS, you also gain a receipt handle. You need
    to hold on to this handle in order to delete the message after you''ve processed
    it. You can also use the handle to change message attributes such as its visibility
    timeout.


    Queues have a time limit: unprocessed messages will be silently deleted from the
    queue after four days.


    You can choose to allow other applications and developers to access your queues
    by using an access policy. The access policy gives you very granular control over
    access to each aspect of SQS.


    # # Watch Out For ...


    SQS is implemented as a distributed queue and runs on multiple servers. There
    are a few very interesting consequences when using this design with respect to
    message order, message delivery, and message sampling. Let''s review these consequences
    now so that you''re fully aware of them when you''ve built your application.


    **Message Order**

    Because the queue is distributed, there''s no guarantee that SQS will return the
    messages in the same order that they were sent. Your application logic must be
    written so that it avoids relying on receiving messages in any particular order.


    **Message Delivery**

    Under very rare circumstances, SQS can return the same message more than once.
    Your application can either treat messages as idempotent (so that processing the
    same one more than once has no ill affect), or it can store a state indicator
    in another location, such as Amazon SimpleDB.


    **Message Sampling**

    When your application asks SQS to return a message from a queue, SQS checks a
    subset of the actual set of servers used to store the queue. If a queue contains
    less than 1,000 items, the first retrieval may return no items but a second one
    will.


    Be sure to keep all these in mind as you develop and debug your application.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Operations


    As you''ll soon see, the SQS programming model is very simple. You can:


    +   - create and delete queues from your account, and list your queues

    +   - send, receive, and delete messages, and change message attributes such as
    the visibility timeout

    +   - control a queue''s access permissions on a very fine-grained basis


    Stay tuned, we''ll write some code in a little while.


    # Pricing Model


    Your SQS usage is charged in two dimensions: requests and bandwidth.


    You pay $0.01 (one cent) for every 10,000 SQS requests that you make. This is
    equivalent to a price of $0.000001 per request. Although the per-request price
    is very low, you still need to be careful. In particular, your application should
    avoid polling an SQS queue for new messages in a tight loop. Instead, you should
    use a time delay and consider a back-off scheme.


    Your data transfer charges are based on the amount of data transferred in and
    out of SQS. Data transferred into SQS is charged at a rate of $0.10 per gigabyte.
    Once again, this amount is prorated. Data transferred out of SQS is charged on
    a sliding scale starting at $0.17 per gigabyte and decreasing with volume, reaching
    $0.10 per gigabyte for all outgoing data transfer in excess of 150 terabytes per
    month.


    There''s no charge for data transferred within a Region. For example, you can
    transfer data from an EC2 instance in the us-east Region to an SQS queue in the
    same Region at no charge.


    # Programming Amazon SQS


    Okay, time for some code. Before we can begin, though, you''ll need to make sure
    you''ve enabled the service on your AWS account. Visit the SQS home page at http://aws.amazon.com/sqs/
    and click the Sign Up For Amazon SQS button. After signing in you can view the
    pricing and credit card information on the next screen, and then click the Complete
    Sign Up button to enable the service.'
  merge: -1
  img_proc: true
