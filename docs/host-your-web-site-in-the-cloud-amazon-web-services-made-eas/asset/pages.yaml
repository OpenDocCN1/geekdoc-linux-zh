    # # Scaling EC2 Instances

    with Elastic Load Balancing


    In this section, you’ll learn about the elastic load balancing feature. We’ll
    review the process model and the pricing, and then we’ll put the service to use,
    creating a load balancer for a couple of EC2 instances. We’ll do a quick review
    of the programming model (without writing any code) and then you’ll be ready to
    use this feature in your own applications.


    # ## Elastic Load Balancing Concepts


    By using EC2’s elastic load balancing feature, you can create software load balancers
    in any AWS region. Each **load balancer** listens on one or more network ports
    and routes traffic to one or more EC2 instances, possibly spread across more than
    one Availability Zone. The load balancers check the health of each instance and
    route traffic only to healthy instances, while also seeking to equalize the amount
    of traffic sent to each instance.


    A load balancer is an entity specific to a particular AWS region. When you create
    the load balancer you will supply a reference name, such as `LoadBal1`. Each load
    balancer is represented externally by a fully qualified host name; for example,
    LoadBal-79377590.us-east-1.elb.amazonaws.com. This name is assigned when the load
    balancer is created. A list of EC2 instances is attached to each load balancer.
    Each instance has an associated health (healthy or unhealthy). Each load balancer
    also has a list of Availability Zones and will route traffic only to healthy EC2
    instances in those zones.


    Each load balancer must have one or more listeners. Each listener accepts requests
    on a specific network port and forwards them to a specific port on an EC2 instance.
    Listeners can listen on ports 80, 443, and 1024 through 65,535, and can forward
    requests to any port.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'A health check is attached to each load balancer. The health check provides
    the load balancer with a target (a port, a protocol, and (for HTTP checks) a URL
    fragment) to be checked, along with thresholds representing the number of checks
    to be made before changing the state of the instance.


    # Elastic Load Balancing Processing Model


    The processing model is very straightforward. Here’s what you need to do:


    +   1. Create an elastic load balancer by providing a reference name, an initial
    list of Availability Zones, the parameters for the health check, and the list
    of listeners. You will receive an externally visible host name in return; for
    example: LoadBal-79377590.us-east-1.elb.amazonaws.com. With this name in hand
    you can use a CNAME entry in your application’s DNS record to make the load-balanced
    cluster a part of your application’s web namespace.14


    +   2. Add one or more EC2 instances to the load balancer using their instance
    IDs after ensuring that they’re prepared to respond to health checks and actual
    requests. The load balancer will begin to track the state (InService or OutOfService)
    of each instance.


    +   3. Start to route traffic to the load balancer using the externally visible
    host name.


    +   4. Add additional EC2 instances (and possibly Availability Zones) to the load
    balancer as traffic increases.


    +   5. Delete the load balancer when you no longer need it.


    As usual, all these operations can be performed using the command line tools or
    through the elastic load balancing API. You can also use CloudWatch to monitor
    the overall state of the load balancer.


    The load balancer will perform health checks (or probes) on each instance under
    its care using the parameters that you supplied when you created it. Let’s say
    that a load balancer is configured with the following health check parameters
    (which happen to be the default values):


    14 For reasons that are far too complex to explain in this footnote, you can’t
    use a CNAME record to define the root of your domain. You can map www.example.com
    to your load balancer using a CNAME, but you can’t map example.com.'
