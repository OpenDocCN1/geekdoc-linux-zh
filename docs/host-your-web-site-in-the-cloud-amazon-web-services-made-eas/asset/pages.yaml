  md: "After you’ve downloaded all usage files to your EC2 instance, run the import\
    \ program like this:\n\n```\n<dev>: php import_usage.php *.csv\n```\n\nIt will\
    \ process each file in turn, reporting on the record count for each one:\n\n```\n\
    Imported cf_usage_year.csv: 242 records\nImported ec2_usage.csv: 138 records\n\
    ```\n\nImporting large files may take some time. You can run several instances\
    \ of this program in parallel, one per data file, if you like.\n\n# ## Querying\
    \ Account Data\n\nWith the data stored, the next step is to look at interesting\
    \ ways of querying the account data. I took the simple query command (**query_usage_cmd.php**)\
    \ from Chapter 8 and enhanced it so that it could retrieve all the results, rather\
    \ than stopping after the first batch. I did this by tracking and using the `NextToken`\
    \ value returned from each `select` call. Here’s the main loop structure:\n\n\
    ```\nchapter_10/query_usage_cmd.php (excerpt)\n\n$next = null;\ndo\n{\n    $attrs\
    \ = ($next == null) ? null : array('NextToken' => $next);\n    $res = $ssdb->select($query,\
    \ $attrs);\n    $next = (string) $res->body->SelectResult->NextToken;\n\n    if\
    \ (!$res->isOk())\n    {\n        exit(\"Select operation failed\\n\");\n    }\n\
    \n    foreach ($res->body->SelectResult->Item as $item)\n    {\n        $recordCount++;\n\
    \        foreach ($item->Attribute as $attribute)\n        {\n            print($attribute->Name\
    \ . \": \" . $attribute->Value . \", \");\n```"
