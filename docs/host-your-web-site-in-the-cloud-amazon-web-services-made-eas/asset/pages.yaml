  md: 'around the `AuthorizeSecurityGroupIngress` and `RevokeSecurityGroupIngress`
    AWS functions could make periodic changes to the `app_access` group to implement
    rotating, remote access by backup system administrators for emergency access.
    Or, the rules in the `db_access` group could be made more selective by dynamically
    adding permissions based on the IP addresses of the servers in the web tier.


    Instances within a single security group can communicate freely with each other.
    Therefore, it would be imprudent to use, for example, a single `ssh_access` group
    to allow SSH access to instances in more than one tier of the previous example.


    A public IP address is assigned to each instance as part of the launch process.
    However, because the instances are ephemeral, the IP address will have the same
    lifetime as the instance. The EC2 Elastic IP address feature supports allocation
    of public IP addresses that are stable and that have a lifetime independent of
    any particular EC2 instance. The addresses are allocated to your AWS account.
    Once allocated they remain under your control until relinquished, regardless of
    whether you use them or not. You can attach (route) any of your IP addresses to
    any of your EC2 instances.


    As noted earlier in this section, the local disk storage included with each EC2
    instance is ephemeral. The storage will remain intact if a running instance is
    rebooted, but it’s scrubbed and then reused after the instance has been terminated.
    The EC2 Elastic Block Store (EBS) provides persistent storage with high reliability
    and availability. You can create an EBS volume and then attach it to any of your
    instances in the same Availability Zone. You can create point-in-time snapshot
    backups to Amazon S3 and then restore the backups to the same volume, or you can
    use them to create a fresh volume. EBS volumes can be formatted and used to store
    files, or they can be used as unformatted “raw” storage.


    The Amazon DevPay system lets you use Amazon’s subscription and billing infrastructure
    for your own EC2-based applications. DevPay gives you the ability to create your
    own payment plan with any combination of up-front, recurring, and usage-based
    fees. Once you’ve attached the payment plan to an AMI of your creation, your customers
    can sign up for it and launch one or more copies of the AMI. They’ll pay for usage
    via their Amazon account.'
