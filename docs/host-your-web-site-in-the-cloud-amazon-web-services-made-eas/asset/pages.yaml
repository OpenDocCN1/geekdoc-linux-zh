- pgno: 135
  md: '# ## All Together Now


    Amazon EC2 functionality becomes even more powerful when it’s used in conjunc-tion
    with the other AWS infrastructure services. We’ve already talked about the use
    of Amazon S3 for storage of AMIs and EBS snapshots. And, as we saw in the last
    chapter, you can call the S3 APIs using PHP code running on an EC2 instance. S3
    is ideal for storage of any amount of unstructured application data—binary or
    string.


    In a similar fashion, code running on an EC2 instance can use Amazon SimpleDB
    for structured data store, the Relational Database Service for storage of relational
    data, and the Amazon Simple Queue Service as a scalable inter-instance or inter-process
    buffer. Elastic MapReduce runs on EC2 services and can be used to process large
    amounts of data.


    Adding to the appeal of this architectural model is the fact that latency between
    EC2 services and these services is very low, since they’re running in the same
    Region.


    # # The Amazon EC2 Pricing Model


    Your Amazon EC2 usage is charged in a number of dimensions that include instance
    use, data transfer, AMI storage, IP address reservations, EBS data storage, and
    EBS I/O. These prices will change over time, so you should consult the Amazon
    EC2 home page<sup>2</sup> for the latest information.


    # ## Instance Use


    Hourly (on-demand) pricing for each of the EC2 instance types is shown earlier
    in Table 5.1. Instance usage begins when the instance starts running, and is billed
    in whole-hour increments. These are base prices, and several factors can affect
    the final price:


    +   - It’s more expensive to run EC2 instances in the Europe and Asia Pacific
    Regions.

    +   - It costs more to run Windows than it does to run Linux or OpenSolaris.

    +   - AMIs accessed via DevPay are charged at the rates set by the AMI’s creator.

    +   - You can arrange for a lower hourly rate by purchasing reserved instances.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Taking all these factors into consideration, you should plan on watching your
    AWS account with care during the first hours and weeks of operation.


    If you plan to keep a number of EC2 instances running over time, you should also
    investigate the reserved instance option. With this option you pay an up-front
    fee to reserve an instance for a period of one or three years, and then pay a
    smaller per-hour charge when you’re actually using the instance. The final per-hour
    cost is lower than it would be for on-demand usage. At current rates, a three-year
    reserved instance is less expensive than an on-demand instance if the instance
    is used at least 19% of the time. Purchase of a reserved instance will also ensure
    that you can allocate an EC2 instance when you need it.


    # Data Transfer


    Your data transfer charges are based on the amount of data transferred in and
    out of your EC2 instances. Data transferred into your instances is charged at
    a rate of $0.10 per gigabyte. Once again, this amount is prorated. Data transferred
    out of your instances is charged on a sliding scale that starts at $0.17 per gigabyte
    and decreases according to volume, reaching $0.10 per gigabyte for all outgoing
    data transfer in excess of 150 terabytes per month.


    There are some important special cases for data transfer:


    +   * There’s no charge for data transfers within an AWS Availability Zone.

    +   * Data transferred between regions is charged at internet rates as described
    at the beginning of this section. You’ll be charged for both sides of the transfer
    (out of one region and into the other).

    +   * Data transferred between Availability Zones in the same region is charged
    at the rate of $0.01 per gigabyte.

    +   * No charges apply to transfer data back and forth between EC2 and other AWS
    services in the same region.


    # AMI Storage


    The AMIs that you create are stored directly in Amazon S3 or as EBS snapshots
    (which are also stored in S3), and you pay the usual S3 rates for doing so. My
    own customized Linux AMIs typically consume 500 to 700 megabytes of space. Windows
    AMIs are generally larger, often weighing in at more than five gigabytes. If you
    create'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'and retain multiple versions of your AMIs, or if you create separate AMIs for
    each tier of your application, it’d be wise to pay attention to your storage costs.


    # # IP Address Reservations


    You can allocate Elastic IP addresses and attach them to an EC2 instance at no
    charge. However, if you allocate an address but fail to attach it to an instance,
    you’ll be charged $0.01 per hour for it. You can do up to 100 remap (attach or
    detach) operations per month at no charge. After that you will pay $0.10 for each
    remap.


    # # Elastic Block Store


    The storage consumed by your Elastic Block Store volumes is charged at the rate
    of $0.10 per gigabyte per month. Because this is raw storage that you can use
    in any desired way, you’re charged based on how much you allocate, rather than
    on how much you use.


    You’re also charged $0.10 for each million I/O requests you make to EBS. Like
    all other AWS charges, this amount will be prorated based on actual usage, so
    you’d pay $0.05 for 500,000 I/O requests.


    # # Launching Your First Amazon EC2 Instance


    Now that we’ve taken care of the concepts and the pricing, it’s time to actually
    use EC2 functionality. We’ll prepare our SSH keys, become familiar with the AWS
    Management Console, then launch an instance. Once the instance is running we’ll
    allocate and attach an IP address to it, and then we’ll create, attach, and format
    an EBS volume. We’ll rev up Apache and put some code into place, then we’ll shut
    it all down.


    # # Creating and Preparing an SSH Key


    We’ll need to be able to connect to our instances using SSH, but before we can
    do that we need to create one or more Amazon EC2 key pairs. This is a way to prove
    our identity to the Amazon EC2 instance when we connect.


    Point your browser at http://console.aws.amazon.com and log in if necessary. Click
    on the Amazon EC2 tab. If you’ve yet to sign up for EC2 services you’ll need to
    do that, supplying a credit card to take care of your charges.'
  merge: -1
  img_proc: true
