    # What Is An Exploits


    An exploit is a program that exploits a bug or security flaw in the application.
    It is written either by security researchers as a signal of idea challenge or
    by malicious actors to be used in their operations. When used, exploits allow
    the attacker to remotely access the network, obtain elevated privileges, or push
    further into the network.


    In some instances, an exploit may be used as part of a multi-component attack.
    Instead of employing a malicious file, the exploit will drop another malware that
    may embody backdoor Trojans or spyware that may steal user info from infected
    people machines.'
