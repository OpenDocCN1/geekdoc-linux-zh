  md: '# AUTOMATED EXPLOITS


    Vulnerability scanners are used to provide a data set. They''re not making an
    assurance that the risk remains. We don''t even promise that what we''re searching
    for is a complete list of vulnerabilities that may occur within an organization''s
    network. For a number of reasons, the scanner may return incomplete results. The
    first is that network segments or modules may be excluded from scanning and processing
    information. This is popular with some kind of security testing. Another explanation
    is that the scanner has been diverted from specific service ports. The scanner
    can not reach certain ports and, as a result, it can not detect any possible vulnerabilities
    that may occur within that network.


    The tests of the vulnerability scanners that we used are just starting points.
