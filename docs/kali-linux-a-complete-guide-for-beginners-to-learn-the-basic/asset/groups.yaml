    # 引言


    Kali Linux 是世界上最强大且最具影响力的渗透工具。安全专业人员在极其广泛的领域中使用它，包括渗透测试、数字取证、逆向工程和漏洞评估。它是多年开发的结晶，也是项目不断进步的结果——从
    Hippix 到 WHAX，再到 BackTrack，现在变成了一个利用许多 Debian GNU / Linux 功能以及全球动态开源生态系统的完整渗透测试系统。


    Kali Linux 的开发并不是为了成为一个静态工具集，而是作为一个多功能平台，专业渗透测试人员、技术专家、学生和业爱好者可以根据其特定需求进行定制。


    Kali UNIX 不仅仅是一组构建在通用 Debian 服务器上的各种安全资源，它还经过了预配置，以供你立即运行。要充分利用 Kali 的优势，对其稳健的
    Debian / UNIX 系统底层（它支持所有这些友好工具）有彻底的理解，并理解如何在环境中使用它们至关重要。


    本书的目的不仅是为了帮助你在使用 Kali UNIX 系统后获得好感，更是为了帮助你提高理解并规划进度。因此，当你从事渗透测试且时间至关重要时，你不必担心因安装新技术或激活网络独特功能而浪费宝贵的时间。在本书中，我们将首先向你介绍
    Linux，然后随着你对 Kali Linux 特定细节的增加，我们将提供更深层的知识，这样你就能确切知道底层发生了什么。


    这是无价的知识，特别是当你试图在紧迫的时间限制内工作时。在设置、排排除故障、力让工具听你差遣、操纵设备数据或在更广泛的环境中使用 Kali 时，涉及这种深度的知识并不稀奇。


    ## 什么是 KALI LINUX？


    Kali Linux 是一个基于 Debian 的 Linux 发行版，它提供了数百种工具用于不同的数据安全任务，包括入侵测试、软件取证、安全研究和逆向工程。这一复杂的渗透测试和合规审计平台于
    2013 年推出，是 BackTrack Linux 的恢复版本，由信息安全教育的先驱机构—— Offensive Security 运营。


    如果你对渗透测试和道德黑客感兴趣，Kali Linux 可能是你开始应用的绝佳之处。Cybrary 的免费在线课程涵盖了以下主题：

    - Kali Linux 术语和背景信息

    - 终端导航、文件系统和命令

    - 下载并安装 Kali

    - 网络管理服务、设置和用户

    - 故障排除资源

    - 安全测试资源和技术介绍


    这是一个旨在提供基础知识的简单课程。在完成 1.25 小时的培训课程后，你可以获得 1.25 小时课程证书。


    ### Kali Linux 有哪些特性？


    Kali Linux 培训课程并非必须的，但学生应该具备硬件、网络和技术术语的底层知识。


    学生可能会在渗透测试和合法黑客领域的任何技术水平上都发现本课程很有用。已经担任安全专业人员、网络管理员或行业毕业的学生也是本课程的理想学生。


    ### 使用 Kali Linux 对你有什么好处？


    Kali Linux 可能是知识安全领域的领先平台。了解系统的基础对于那些好奇追求网络安全职业的人至关重要。Kali Linux 的一些优势包括：

    - 渗透测试工具：拥有超过 600 种渗透测试工具，Kali Linux 提供了广泛的分析选项。

    - 开源 Git：Kali Linux 是一个易访问的开源平台。开放开发树允许用户看到每个阶段的代码开发。

    - FHS 支持：由于 Kali Linux 遵循 FHS（文件系统层次结构标准），用户可以轻松找到文件、库和二进制执行文件。这是一个让 Kali Linux
    程序脱颖出的特性。

    - 无线设备连接：Kali Linux 可以需要连接到许多 USB 端口或 Wi-Fi 热点。这是另一个让程序与其他程序不同的功能。

    - ARMEL 和 ARMHF 支持：Kali Linux 支持 ARMM 是一个强大的管理工具，具有完整的 ARMEL 和 ARMHF 工作框架。

    - 终身免费：Kali Linux 是一个完全免费的程序，这确保了它被广泛使用。


