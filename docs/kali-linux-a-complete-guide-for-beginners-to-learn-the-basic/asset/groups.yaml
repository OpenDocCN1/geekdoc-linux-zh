  mdcn: "\n\n谈到将你的旧文档与现有文档分开。在你的日记里写下个提醒吧！\n\n在创建文件名时，我需要记住什么？\n\n在开始阶段就决定命名规范。有效的文件名应该是简洁的，并且对你和你的同事而言，这样你们就可以轻松找到它们。如果你的部门决定了以下元素，将非常有帮助：\n\
    \n- 词汇：为文件名选择通用的词汇，以便所有人都使用相同的语言。\n- 标点符号：决定是否使用标点符号、连字符和空格——就按顺序出现的日期正确用法达成共识，例如\
    \ YYYY-MM-DD。\n- 顺序：确认哪个元素应该排在第一，以便将相同主题的文件分组。\n- 数字：指定命名时将使用的数字，以便对文件进行编号，例如\
    \ 01、002 等。\n\n我应该如何命名我的文件，以便知道哪一个是最新的？\n\n很少有论文是由人一次性完成的。此外，并没有多少人会在很长的时间内关注某项工作，而缺乏适当的控制可能会导致对哪个版本是最新版本的产生困惑。这里是避免这种情况的一种方法：使用编号系统。文件的某些重大变化可以通过完整的数字显示，例如\
    \ v01 将是主版本，v02 是后续变体。细微的变化可以通过增加数字来表示，例如 v01 表示对第一个版本进行了更改，而 v03 表示对第三版本创建了修改。\n\
    \n当草稿区域设定了修订时，额外数据应当取决于创建这些修订的人。例如：文件名 v01_20130816 的文件表示某同事在 2013 年 8 月 16 日对第一个版本进行了更改。然后，主作者将对\
    \ v01 进行这些修改并更新文档编号系统。\n\n为每个重要文档包含版本控制，列出修改内容及其日期，以及文档正确的版本号。如果有帮助，你可以将文档名称本身与版本号并列。请商定由谁来完成并标记它们。还有许多外部资源可以为你提供关于正确文件命名规范的建议，你可以在这里看到关于它们的大数据。\n\
    \n## 文档与元数据\n\n为了确保你理解自己的信息，并让他人能够识别、使用和正确解释你的数据，在你要创建的数据库中添加文档和元数据（数据）是有帮助的。\n\
    \n### 什么是文档或元数据？\n\n文档一术语包含了阅读、理解和使用数据库或文档集所需的所有信息。在本页面上，我们交替使用文档和元数据（通常存储在文件/文档本身中的数据）。\n\
    \n### 我何时以及如何采用文档/元数据？\n\n在研究的最开始就开始记录你的知识，并随着项目的进展不断添加细节，是明智的。在你的信息规划过程中包含报告程序。\n\
    \n有多种方法可以向软件中添加元数据：\n\n- 嵌入式元数据：包含在文档本身（例如文本文件）中的信息，或者作为头文件指定位置集成到数据文件中。嵌入式文档的定义包括：代码、字段或标签说明、解释性页眉，或数据库“记录属性”功能中的记录详情摘要。\n\
    - 支持性文档：这是随数据一起的独立文件信息，旨在提供含义、澄清，或对隐私、使用或重用数据的指导。支持性文档的来源包括：\n    - 工作论文或实验笔记本\n\
    \    - 问卷或访谈指南\n    - 最终项目文档和出版物\n- 集合元数据：支持性文档应该经过组织，以便通过网络浏览器或基于数据库的存档进行识别和定位。\n\
    \n数据库元数据通常根据国际标准组织，并与存储材料的仓库或数据中心相连。目录信息的定义为：\n\n- 名称\n- 定义\n- 创建者\n- 资助者\n- 关键词\n\
    - 所属机构\n- 持续时间\n\n中心提供了特定学科元数据的定义。\n\n## 元数据跟踪工具\n\nISA 工具：这些工具管理一套不断变化的生物科学、环境和医学专业状态，或技术的混合体。ISA\
    \ 工具围绕“调查”（项目背景）、“研究”（研究单元）和“分析”（分析测量）的通用表格格式构建，使你能够对实验信息提供简洁的摘要（即样本特征、仪器和测量形式、样本与数据的关系），以便随后的信息和观察结果是可以复制和重复使用的。\n\
    \nFAIRsharing——一个用于生命科学相互关联的数据标准、数据库和策略的可搜索库。FAIRsharing 是一个生命科学、环境和生物医学科学相互关联软件需求、存储库和法规的策划的可搜索门户。\n\
    \n## 管理参考文献\n\n项目可能会持续数月或几年，很容易丢失某条信息来自哪个来源。在项目结束时的忙乱中，重建一半的引用可能是一件苦差！未来的自我可能不会记得你现在看来显而易见的一切，因此对你的来源采取具体的笔记是非常重要的。\n\
    \n### 什么是参考文献管理软件？\n\n参考文献管理软件帮助你在写作时跟踪参考文献，并在出版时部分自动完成参考文献列表的构建。剑桥大学还对各种参考文献框架提供支持和培训。谁能为我提供参考文献展示和安排？\n\
    \n你的部门图书馆员会有选项让你选择正确的参考文献格式，并可能知道一些你以前没用过的有用工具。请随时向他或她咨询。事实上，学院图书馆员也是一个非常好的资源，他那里可以提供帮助。删除你认为没用的地址。如果没有，请问问自己：它是“活跃”的吗——是否有你或其他人需要采取的特定行动，或者你模糊地认为它值得保留？\n\
    \n## 整理电子邮件\n\n许多人现在每天都会发送和接收大量信息，导致他们的收件箱很容易被数百封个人和工作电子邮件淹没。留出时间整理电子邮件将确保能够快速方便地找到信息。\n\
    \n这里是一些确保你的电子邮件长期保持良好的通用技巧：\n\n- 删除不使用的电子邮件。从收件箱中删除任何无关或旧的消息，并定期（理想是每天）这样做。\n\
    \ 使用 使用目录来存储你的电子邮件。按主题、场合或任务建立一个组织良好的组织器。\n\n"
