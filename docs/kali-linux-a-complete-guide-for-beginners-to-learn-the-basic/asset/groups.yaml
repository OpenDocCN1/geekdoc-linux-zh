    当新技术创造出新的安全挑战时（例如，从边界之外进入云端），IT 和安全部门需要获得新的技能和资源，还需要寻求外部研究人员进行测试。


    此外，威胁复杂性的增加和业务风险的上升决定了安全态势的加强。执行要求的适应以及竞争对手复杂性的增加意味着你的测试计划也应该进行改进。作为此，IT 部门正在尝试减少范围限制，并与高水平的供应商进行合作。


    ## 自动化利用


    漏洞扫描器用于提供数据集。它们并不能保证风险仍然存在。我们甚至无法保证所搜索的内容是组织网络中可能出现的漏洞的完整列表。由于多种原因，扫描器可能会返回不完整的结果。首先，网络分段或模块可能被排除在扫描和信息处理之外，这在某些安全测试中很常见。另一种解释是扫描器被偏离了特定的服务端口。扫描器无法到达某些端口，因此它无法检测到该网络中可能发生的任何漏洞。


    我们使用的漏洞扫描器只是起点。检查它们是否可以被利用会增加发现的可信度，但在此基础上，我们能够展示利用后可以实现什么。这在谈论安全时尤为如此。利用漏洞是证明漏洞存在的一种方法。利用程序可以涵盖广泛的行为，尽管当我们谈论利用时，我们指的是……


