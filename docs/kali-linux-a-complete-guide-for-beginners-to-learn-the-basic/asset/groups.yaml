    ## Web Application

    Web Application Testing is an easy way to check the web application for bugs before
    it is moved to production.


    ### 1. Functionality Testing

    This is used to check that the product meets the requirements you have outlined.

    - Ensure all connections on your website are working correctly.

    - Check for broken links.

    - Ensure forms work as intended.

    - For example, if the user does not fill out a necessary field, an error message
    will be shown.

    - Cookies are small files used by websites to remember active user sessions so
    you do not need to log in every time. Cookie monitoring involves checking that
    cookies (sessions) are removed either when the cache is cleared or it expires.
    Delete cookies (sessions) and check that your login details are requested when
    you visit the site.


    ### 2. Ease of use Testing

    Usability testing is done by users or a focus group close to the target audience
    of the web application.

    - Test website navigation: Menu, buttons and links to different pages ought to
    be simply visible and consistent across all pages.

    - Review content: Content should be readable without spelling or grammatical errors.

    - Photos, if present, must include "alt" text.


    ### 3. Interface Testing

    There are three areas to be evaluated here-Application, Internet and Database
    Server.

    - Application: Test requests are sent correctly to the database. What''s more,
    the exhibition on the customer side is demonstrated effectively. Errors, if any,
    must be observed by the program and must be displayed only to the administrator
    and not to the end user.

    - Internet Server: Check web server manages all client requests without denial
    of service.

    - Database Server: Ensure that the inquiries sent to the database give the normal
    outcomes.

    Check device answer when links between the three layers (Application, Web and
    Database) can not be created and the correct message is shown to the end user.


