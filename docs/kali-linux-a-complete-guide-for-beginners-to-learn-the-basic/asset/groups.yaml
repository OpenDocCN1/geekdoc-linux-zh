    提到会话劫持（session hijacking），正如我们之前看到的，攻击者利用活动会话来执行攻击。大多数互联网通信都需要身份验证。认证通常采用多种策略。最常用的方法是要求用户在网站上输入预定义的用户名和密码。当客户端输入这些凭据时，程序会将其与存储的数据进行比对。如果输入的信息与存储的详情匹配，系统将允许用户访问特定的数据库或网站部分。


    这种身份验证方法在通信开始时执行，一旦认证成功完成，会话就会开始并保持活跃，直到通信结束。会话劫持攻击发生在会话运行时，攻击者同时进行干扰并接管动态会话。这种干扰可能可以检测，也可能无法检测。每个会话都会有一个会话
    ID，通常存储在 cookie 或 URL 中。这种攻击也被称为“Cookie 劫持（Cookie Hijacking）”。我们可以通过使用当前会话的网站行为来识别被劫持的会话攻击。如果网站对客户端的正常方式提交没有反应，或者由于某些不明原因完全停止工作，这可能是会话接管攻击的结果。


    ## 会话劫持是如何工作的？


    如我们所知，http 通信使用了大量的 TCP 连接，因此服务器需要一种方法来识别每个用户的连接。最常用的技术是身份验证方法，因此服务器向用户请求者发送一个令牌（token）。该令牌由固定宽度的数组组成，可以有多种方式，例如在
    URL 中、http 请求头的其他部分或 http 请求体中。该攻击通过窃取或预测合法的会话令牌来利用会话令牌，以获得对 Web 服务器的未经授权访问。会话令牌的泄露可以通过不同的方式发生。现在，我们将看到会话嗅探（session
    sniffing）和跨站脚本攻击（cross-site script attack）两种方式。


