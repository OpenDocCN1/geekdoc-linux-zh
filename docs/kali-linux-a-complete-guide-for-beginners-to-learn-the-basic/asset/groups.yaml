    # CONCLUSION


    Kali Linux is a Linux version targeted at digital forensics practitioners and
    penetration (pen) clients. It provides over 400 pen-testing software and is the
    primary tool used by responsible hackers. Using Kali Linux, trained ethical hackers
    can check their organizations'' networks to see if they are vulnerable to foreign
    attacks.


    Testing mobile absorption. This is a very promising area of penetration testing
    that is rapidly evolving and will undoubtedly become increasingly important in
    the future, due to the ubiquity of remote systems and the huge development of
    cell phones.


    Training and understanding Kali Linux for wireless penetration testing not only
    provides us with a wide range of tools to use, but also, as they are all open
    source, gives us an opportunity to grasp the nature of their deployment and of
    the attacks carried out in detail.


    We studied the planning, exploration, and attack stages of wireless penetration
    testing. All of these stages are similarly important in order to obtain accurate
    and reliable performance, but must be achieved in the final phase of the monitoring
    process.


    This book will offer aspiring moral hackers a brief overview of the Kali Linux
    software. Cybersecurity specialist Malcolm Shore explains how to set up a virtual
    testing environment, customize Kali Linux, and download information gathering
    software, vulnerability analysis, key and hash cracking, and aim manipulation.


    Since companies are connected, they are also exposed. Vulnerability screening
    helps companies reduce exposure. This book will help you discover the skills,
    tactics and methods behind ethical hacking one of the most important and sought-after
    IT security capabilities.


    # Do Not Go Yet; One Last Thing To Do


    If you enjoyed this book or found it useful, I''d be very grateful if you''d post
    a short review on Amazon. Your support does make a difference, and I read all
    the reviews personally so I can get you your feedback and make this book even
    better.


    Thanks again for your support!

    '
  mdcn: '


    # 结论


    Kali Linux 是一个针对数字取证从业人员和渗透测试（pen）客户的 Linux 版本。它提供了 400 多种渗透测试软件，是负责任黑客使用的主要工具。通过
    Kali Linux，经过训练的道德黑客可以检查其组织的网络，以查看是否容易受到外部攻击。


    移动吸收测试。这是渗透测试中一个非常有前景的领域，正在快速演进，由于远程系统的普及和手机业务的巨大发展，它在未来无疑将变得越来越重要。


    针对无线渗透测试进行 Kali Linux 的培训和理解，不仅为我们提供了广泛的工具，而且由于它们都是开源的，还让我们有机会详细地掌握其部署的本质以及所实施的攻击的原理。


    我们研究了无线渗透测试的规划、探索和攻击阶段。所有这些阶段对于获得准确可靠的性能都同样重要，但必须在监控过程的最终阶段实现。


    本书将为有志道德黑客提供 Kali Linux 软件的简要概述。网络安全专家 Malcolm Shore 将解释如何搭建虚拟测试环境、自定义 Kali Linux，以及下载信息收集、漏洞分析、密钥和哈希破解以及目标操纵软件。


    由于公司之间相互连接，它们也面临暴露风险。漏洞扫描有助于公司减少暴露。本书将帮助你发现道德黑客背后的技能、策略和方法，这是最重要且最受青的 IT 安全能力之一。


    # 请先不要离开；最后一件事要做


    如果你喜欢这本书或觉得它很有用，如果你能在 Amazon 上发表简短的评论，我将不胜感激。您的支持确实意义重大，我会亲自阅读所有的评论，以便获取您的反馈并让这本书变得更好。


    再次感谢您的支持！


    '
