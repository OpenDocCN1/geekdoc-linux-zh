    # SECURITY TESTING?


    Security Testing is delineated as a kind of code testing that ensures that code
    systems or applications area unit free from any vulnerabilities, threats, or risks
    that would lead to important losses.


    Security testing of any program involves finding all potential gaps or vulnerabilities
    in the process that could result in a loss of data, income, credibility in the
    hands of workers and members of the organization.


    The purpose of security testing is to identify the risks to the system and calculate
    its possible vulnerabilities, so that the system does not stop working or It''s
    manipulated. It also helps to identify all possible vulnerabilities in the system
    and encourages developers to solve these problems by coding.


    Security testing is a form of software testing that aims to identify device vulnerabilities
    and to assess that its information and assets are secured from possible intruders.


    Focus areas: There are four main focus areas to be addressed in security testing
    (especially for websites / applications):


    - network protection: this involves finding vulnerabilities in the network infrastructure
