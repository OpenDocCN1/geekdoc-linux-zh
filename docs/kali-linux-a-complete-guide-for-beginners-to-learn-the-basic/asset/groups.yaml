    Catching Reverse Shells


    Good news is that this method doesn''t change a lot in OSCP. The main difference
    is that you can''t make use of Meterpreter. How are we going to get around this?
    Just use the flat reverse shell payload instead.


    The last time I checked, you were allowed to use exploit/multi/handler in Metasploit
    to capture shells. But this doesn''t have much benefit over using a plain old
    netcat listener, seeing that you can''t use Meterpreter or Metasploit''s other
    features anyway. The only exception is if you are using an exploit with restrictive
    payload storage, in which case you may need to use a staged payload.


    ## WIRELESS PENETRATION TESTING


    It''s easier to install wireless systems than to do it on a wired network. You
    can''t really enforce good physical security measures against a wireless medium,
    if you''re close enough, if you''re able to "hear" (or at least your wireless
    adapter can hear) anything that''s passing through the air. As you''ve seen so
    far, there are a range of devices ready and waiting to be used.


    The extra code and equipment you might want to perform Wireless Network Pentesting
    would be as referenced beneath. This is the package that I actually use, and it
    fits very well.


    You can either download Kali the only OS on your PC or run the .iso file. The
    second option is the one I''m using, which is the Oracle VM VirtualBox (freeware)
    which opens the .iso of Kali Linux.


    Wireless Card: If you are running Kali UNIX operating system as a Virtual Machine
    in VM you will be able to use your PC''s wireless card directly in VM. You would
    need an external wireless adapter for this purpose (description of the good wireless
    cards made in the initial chapters of this tutorial). By the way, I use ALFA AWUS036NH,
    and I can feel its "quality." It has a high yield control (1W) and an inherent
    5dBi radio wire. You can consider using it for your Wi-Fi access, as it''s much
    better than some "intel" models that most laptops are shipped with.


    You''re great to go with all that.


    Wireless Penetration Testing Process: The testing of wireless networks is always
    split into two stages—the passive stage and the active phase. Any possible attack
    (either wireless or any other) you can imagine, always starts some kind of passive
    stage.


    The entrance analyzer (or aggressor) gathers data about the objective during the
    detached stage. There may be different types of passive sections of the attack—the
    awareness of the environment.


    Reading the goal security measures on the Internet, in the media. Speak to legitimate
    users about security controls.


    ### Sniffing The Flow


    Some of the experiments may already be at that point. There is a possibility that
    the hacker has received all the data he wants directly from unconscious legitimate
    users, or that the traffic he has sniffed has been enough to direct some disconnected
    assaults (disconnected beast power, disconnected lexicon, or exceptional secret
    key data) has been moved to the sniffed in plain content packages.


    On the opposite side, on the chance that it wasn''t sufficient, there would be
    a subsequent stage, a functioning one. This is the place the aggressors speak
    with the injured individual legitimately. These may be sending phishing e-mails
    which explicitly demand the user''s credential.


    - Injecting wireless frames to induce specific actions (e.g. Blocks for de-authentication).

    - Build fake APs that legitimate users use to connect to a wireless network.


    All the attacks mentioned in this chapter are passive or a combination of passive
    and active. As the reader moves between them, it will be very easy to see when
    the passive phase ends and the active phase begins.


    We''ve all heard stories about a company''s Wi-Fi that have been used to hack
    their security. The most famous case is that of TJ Maxx. TJ Maxx''s parent company
    secured the wireless LAN (Local Area Network) using Wireless Equivalent Privacy
    (WEP). WEP is the weakest sort of security out there for shielding wireless LANs.
    Hackers hacked and scarf records, together with many mastercard numbers.


    The TJ Maxx security breach happened years ago when the Wi-Fi protection options
    were lower and weaker. In short, there is a well-known flaw in the WEP protocol
    and, since TJ Maxx was unaware of, or ignored, the fact, they negatively affected
    their financial situation and credibility. The company does not want to make similar
    mistakes, so make sure of your diligence to prevent a similar scenario.


    A wireless penetration test can test the network using a technique close to the
    typical wired penetration test. We should, however, rely on wireless as a backdoor
    to hack the vulnerabilities. Choosing the right partner to perform a wireless
    penetration test is therefore an important decision. Seek certifications such
    as OSCP, OSCE, GPEN, CEH, CPT and CWNP.


    Choose an organization with technical expertise. When their experience is deep
    and wide, they''ll be able to dig deeper and give you with additional valuable
    info. Ask for an example of a distribution report from a similar wireless penetration
    test. The report should be informative and self-explanatory. With proper business
    acumen, testers will adapt their work to your vertical and regulatory mandates.
    Penetration analysis is intended to replicate a real-life attack in as many ways
    as possible.


    There are many advantages to the wireless penetration test. Identifying vulnerabilities
    that risk actors are capable of leveraging is of paramount importance. Checking
    the effectiveness of your safety strategy and identifying potential flaws makes
    it possible for an organization to remediate these before they do actually happen.
    This penetration check will also act as a third party verification of the threat
    / vulnerability management of your business.


    Last not least, you must remember that Wi-Fi is not the only wireless technology
    that hackers can use. There are numerous Bluetooth and Bluetooth Low Energy (BLE)
    technologies. Other wireless technologies such as ZigBee, Z-wave and DECT (cordless
    phones) are also available.


    ### Understand Data Collection and Evaluation


    There are phases of a wireless penetration test. The first stage is the knowledge
    gathering, followed by analysis. For a good tester to know how to collect data
    from the wireless network, the tester needs to understand the signal leakage.
    Essentially, signal leakage (or bleed) is any wireless signal that extends the
    expected coverage area. It is impossible to completely eliminate this leakage.
    Nevertheless, mitigating signal leakage and ensuring awareness of where the bleed
    is present is best practice. The wireless specialist needs to have an understanding
    of security protocols employed in wireless operations.


    Moreover, the analyzer needs to understand denial of service (DoS) attacks, the
    Man-in-the-Middle (MITM) attacks, and the Access Point (AP) attacks to check and
    defend against them. Ultimately, experience of users and their vulnerabilities
    is another key aspect of checking for.


    ### Understand Organizations and Their Standards


    Any security professional performing a wireless safety evaluation should be familiar
    with all industry organizations with the protocols they propose and the standards
    they establish. Comprehensive understanding of the related organizations and their
    protocols is one of the most valuable skills, since testers do not to reinvent
    the wheel. They may follow existing guidelines while addressing the specific needs
    of a specific customer.


    Wi-Fi Alliance guarantees that all Wi-Fi hardware is interoper. The FCC controls
    the RF spectrum from which Wi-Fi, Bluetooth and other wireless technologies are
    used. The IETF helped to describe RADIUS and EAP. The wireless specialist should
    also be well versed in all EAP varieties, including LEAP, PEAP, EAP, EAP-GTC,
    TLS, TTLS and the rest.


    There are also a number of regulatory bodies. Personal Credit Information (PCI)
    protects consumer credit information from disclosure by a corporation that does
    not practice due diligence to secure the data.

