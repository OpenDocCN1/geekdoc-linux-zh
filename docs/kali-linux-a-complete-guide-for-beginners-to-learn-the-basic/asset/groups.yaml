    BSD）上，你可以找到大量用 C 语言编写的代码。Linux 的部分和 BSD 的大部分都是用 C 语言编写的。大多数操作系统函数（如 `cp`、`ls`
    等）可能都是用 C 编写的，除非你处于非常特殊的系统上。C 被认为是 UNIX 系统的标准编程语言，建议任何编写软件的人都应该意识到并熟悉 C，即使他们并不是每天经常编写它。大多数关于设备调用的手册页都是用
    C 语言编写的。


    1979 年，Bjarne Stroustrup 开始着手另一种编程语言，长期来看被称为 C++。C++ 包含了 C 语言的各种结构和语义组件，现在它被视为一种完全独立的语言，恰好与
