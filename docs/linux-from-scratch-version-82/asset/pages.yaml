  md: '# 6.28. Shadow-4.5


    The Shadow package contains programs for handling passwords in a secure way.


    **Approximate build time:** 0.2 SBU

    Required disk space: 43 MB


    # 6.28.1. Installation of Shadow


    +   Note

    If you like to enforce the use of strong passwords, refer to http://www.linuxscratch.org/blfs/view/8.2/posts/cracklib.html
    for installing CrackLib prior to building Shadow. Then add --with-libcrack to
    the configure command below.


    Disable the installation of the **groups** program and its man pages, Coreutils
    provides a better version. Also Prevent the installation of manual pages that
    were already installed by the **man** pages:


    ```

    sed -i ''s/groups$(EXEET)'' '''' /src/Makefile.in

    find -name Makefile.in -exec sed -i ''s/groups/'' .1 / {} \ \

    find -name Makefile.in -exec sed -i ''s/getpnam/'' .3 / {} \ \

    find -name Makefile.in -exec sed -i ''s/passwd/'' .5 / {} \\

    ```


    Instead of using the default crypt method, use the more secure SHA-512 method
    of password encryption, which also allows passwords longer than 8 characters.
    It is also necessary to clear the obsolete /var/spool/mail location used currently:
    for user mailboxes that Shadow uses by default to used currently:


    ```

    sed -i -e ''s@ENCRYPT_METHOD DES@ENCRYPT_METHOD SHA512@'' \

    -e ''s@/var/spool/mail@/var/mail@'' etc/login.defs

    ```


    +   Note

    If you choose to build Shadow with Cracklib support, run the following:


    ```

    sed -i ''s/$DICTPATH.*$DICTPATH/t/lib/cracklib/pw_dict@'' etc/login.defs

    ```


    Make a change to make the first group number generated by useradd 1000:


    ```

    sed -i ''s/1000/999/'' etc/useradd

    ```


    Prepare Shadow for compilation:


    ```

    ./configure --sysconfdir=/etc --with-group-name-max-length=32

    ```


