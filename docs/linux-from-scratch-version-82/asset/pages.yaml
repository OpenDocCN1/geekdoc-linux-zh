    \ is set when called\n  MSG=\"$FAILURE\\nnYou should not be reading this error\
    \ message.\\n\\n\"\n  MSG=\"$MSGJit means that an unforeseen error took place\
    \ in\\n\"\n  MSG=\"$MSG(${i}),\\n\"\n  MSG=\"$MSGwhich exited with a return value\
    \ of $(error_value).\\\\n\"\n\n  MSG=\"$MSGIf you are able to track this error\
    \ down to a block in one of\\n\"\n  MSG=\"$MSGthe files provided by ${DISTRO_MINI}\
