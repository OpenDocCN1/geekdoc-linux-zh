  md: '# Chapter 8. Making the LFS System Bootable


    # 8.1. Introduction


    It is time to make the LFS system bootable. This chapter discusses creating an
    fstab file, building a kernel for the new LFS system, and installing the GRUB
    boot loader so that the LFS system can be selected for booting at startup.


    # 8.2. Creating the /etc/fstab File


    The /etc/fstab file is used by some programs to determine where file systems are
    to be mounted by default, and which must be checked (for integrity errors) prior
    to mounting. Creating a new file systems table like this:


    ```

    cat > /etc/fstab << "EOF"

    # Begin /etc/fstab

    # file system mount-point type options dump fsck order

    /dev/<xxx> <fff> defaults 1 0

    /dev/<yyy> swap swap pri=1 0 0

    proc /proc proc nousid,noexec,nodev 0 0

    sysfs /sys sysfs nousid,noexec,nodev 0 0

    devpts /run/pts devpts gid=5,mode=620 0 0

    tmpfs /tmpfs tmpfs defaults 0 0

    devtmpfs /dev devtmpfs mode=0755,nousid 0 0

    # End /etc/fstab

    EOF

    ```


    Replace <xxx>, <yyy>, and <fff> with the values appropriate for the system, sda2,
    sda5, and ext 4.

    Details on the six file systems in this file, make man fstab.


    Filesystems with MS-DOS or Windows origin (i.e: vfat, ntfs, smbfs, cifs, iso9660,
    udf) need the “iocharset” mount option for non-ASCII characters in file names
    to be interpreted properly. The value of this option should be the same as character
    set of your locale, adjusted such that a kernel understands it. If this works
    the character set definition (found under File Systems - Native Language Support)
    has been included into the kernel or built as a module. The “codepage” option
    is also needed for vfat and smbfs filesystems. It should be set to the codepage
    number used under MS-DOS in your country. E.g., in order to mount USB flash drives,
    a_RU_KOI8-R user would need the following in the options portion of mount line
    in /etc/fstab:


    ```

    noauto, user, quiet, showexec, iocharset=koi8r, codepage=866

    ```


    The corresponding options fragment for RU_UTF-8 users is:


    ```

    noauto, user, quiet, showexec, iocharset=utf8, codepage=866

    ```'
