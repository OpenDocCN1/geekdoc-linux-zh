  md: 'The new instance of the shell is a non-login shell, which does not read the
    /etc/profile or .bash_profile files, but rather reads the .bashrc file instead.
    Create the .bashrc file now:


    ```

    cat ~/.bashrc << "EOF"

    set +h

    umask 022

    LFS=/mnt/lfs

    LC_ALL=POSIX

    LFS_TGT=$(uname -m)-lfs-linux-gnu

    PATH=$tools/bin:/usr/bin

    export LFS LC_ALL LFS_TGT PATH

    EOF

    ```


    The set +h command turns off bash hash function. Hashing is ordinarily a useful
    feature—bash uses a hash table to remember the full path of executable files to
    avoid searching the PATH time and again to find the same executable. However,
    the new tools should be used as soon as they are installed. By switching off the
    hash, the shell will always search the PATH when a program is to run. As such,
    the shell will find the newly compiled tools in LFS/tools as soon as they are
    available without remembering a previous version of the program in a different
    location.


    Setting the user mask (umask) 022 ensures that newly created files and directories
    are writable by their owner, but are readable and executable by anyone (assuming
    default modes are used by the open (2) system call, new files end up with permission
    644 and directories with 755).


    The LFS variable should be set to the chosen mount point.


    The LC_ALL variable controls the localization of certain programs, making their
    messages follow the conventions of a specified country. Setting LC_ALL to "POSIX"
    or "C" (the two are equivalent) ensures that everything will work as expected
    in the cho environment.


    The LFS_TGT variable sets a non-default, compatible machine description for building
    our own cross compiler and linker when compiling our temporary toolchain. More
    information is contained in Section 5.2, "Toolchain Technical Notes".


    By putting /tools/bin ahead of the standard PATH, all the programs installed in
    Chapter 5 are picked up by the shell immediately after their installation, combined
    with turning off hash, limits the risk that old programs are used from the home
    system when building in the chapter 5 environment.


    Finally, to have the environment prepared for building the temporary tools, source
    the just-created user profile:


    ```

    source ~/.bash_profile

    ```


    # 4.5. About SBUs


    Many people would like to know beforehand approximately how long it takes to compile
    and install each package. Because Linux Scratch can be built on many different
    systems, it is impossible to provide accurate time estimates. The biggest package
    (glibc) will take approximately 20 minutes on the fastest systems, but can take
    up to three days on slower systems! Instead of providing actual times, the Standard
    Build Unit (SBU) measure will be used instead.


    The SBU works as follows. The first package to be compiled from this book is Binutils
    in Chapter 5. The time it takes to compile this package is what will be referred
    as the Standard Build Unit or SBU. All other times will be relative to this time.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Linux From Scratch - Version 8


    For example, consider a package whose compilation time is 4.5 SBUs. This means
    that if a system has 10 package to compile and install the first pass of Binutils,
    it will take approximately 45 minutes to build this package. Fortunately most
    builds are shorter than the one for Binutils.


    In general SBUs are not entirely accurate because they depend on many factors,
    including the host system''s version of GCC. They are provided here to give an
    estimate of how long it might take to install a package, but the numbers can vary
    by as much as dozens of minutes in some cases.


    # Note


    For many modern systems with multiple processors (or cores) the compilation time
    for a package can be reduced by performing a "parallel make" by either setting
    an environment variable or telling the make how many processors are available.
    For instance, a Core2Duo can support two simultaneous processes:


    ```

    export MAKEFLAGS=''-j 2''

    ```


    or just building:


    ```

    make -j2

    ```


    When multiple processors are used in this way, the SBU units in the book will
    vary even more than they normally would. In some cases, the make step will simplify
    fast. Analyzing the output of the build process will also be more difficult because
    the lines of different processes be interleaved. If you run into a problem with
    a build step, revert back to a single processor builder to properly analyze the
    error messages.


    # 4.6. About the Test Suites


    Most packages provide a test suite. Running the test suite for a newly built package
    is a good idea because it can provide a "sanity check" indicating that everything
    compiled correctly. A test suite that passes its sets of checks usually proves
    that the package is functioning as the developer intends. It does not, guarantee
    that the package is totally bug free.


    Some tests are more important than others. For example, the test suites for the
    core toolchain packages—GCC, Binutils, and Glibc—are of the most important due
    to their central role in a properly functioning system. The test suites for GCC
    and Glibc can take a long time to complete, especially on slower hardware, but
    are strongly recommended.


    # Note


    Experience has shown that there is little to be gained from the test suites in
    Chapter 5. There can be no escaping the fact that the host system exerts some
    influence on the tests in that, often causing inexplicable failures. Because the
    tools built in Chapter 5 are temporary and eventually discarded, we do not recommend
    running the test suites in Chapter 5 for the average reader. The instructions
    for running those test suites are provided for the benefit of testers and developers,
    but they are strictly optional:


    A common issue with running the test suites for Binutils and GCC is out of pseudo
    terminals (PTYs). This can result in a high number of failing tests. This may
    happen for several reasons, but the most likely is that the host system does not
    have the devpts file system set up correctly. This issue is discussed in greater
    detail at http://www.linuxscratch.org/lsfsag.html#no-ptys.


    33'
