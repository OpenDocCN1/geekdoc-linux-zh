  md: '# 8.3. Linux-4.15.3


    The Linux package contains the Linux kernel.


    Approximate build time: 4.4 - 66.0 SBU (typically about 6 SBU)\ Required disk
    space: 960 - 4250 MB (typically about 1100 MB)


    # 8.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README file in the kernel source for alternative methods to the way this
    book configures the kernel.


    Prepare for compilation by running the following command:


    ```

    make mrproper

    ```


    This ensures that the kernel tree is absolutely clean. The kernel team recommends
    that this command be used prior to each kernel compilation. Do not rely on the
    source tree being clean after untaring.


    Configure the kernel via a menu-driven interface. For general information on kernel
    configuration see http://www.linuxfromscratch.org/hints/downloads/files/kernel-config.txt.
    BLFS has information regarding kernel configuration requirements of packages outside
    of LFS at http://www.linuxfromscratch.org/blfs/8.2/longindex.html#kernel-config-index.
    Additional information about configuring and building the kernel can be found
    at http://www.droah.com/lkn/


    > Note

    A good place for setting up the kernel configuration is to run make defconfig.
    This will set the base configuration to a good state that takes your system architecture
    into account.


    Be sure to enable/disable/set the following features or the system might not work
    correctly or boot at:


    | Drivers ---> |

    | Generic Driver Options ---> |

    | ] Support for event helper [CONFIG_UEVENT_HELPER] |

    | [* Maintain a devtmpfs filesystem to mount at /dev [CONFIG_DEVTMPFS] |

    | Kernel hacking ---> |

    | Choose kernel unwinder (Frame pointer unwinder) ---> [CONFIG_UNWIND] |


    There are several other options that may be desired depending on the requirements
    for the system. For a list of options needed for BLFS packages, see the BLFS Index
    of Kernel Settings (http://www.linuxfromscratch.org/blfs/8.2/longindex.html#kernel-config-index).'
