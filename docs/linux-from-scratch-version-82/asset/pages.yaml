  md: '# Chapter 1. Introduction


    # 1.1. How to Build a L System


    The TFS system will be built by using an already installed Linux distribution
    (such as Debian, OpenMandriva, Fedora, or openSUSE). This existing Linux system
    (the host) will be used as a starting point to provide necessary programs, including
    a compiler, linker, and to build the new system. Select the “development” option
    during installation to be able to access these tools.


    As an alternative to installing a separate distribution onto your machine, you
    may wish to use a LiveCD from a commercial distribution.


    Chapter 2 of this book describes how to create a new Linux partition and system.
    This is the place where the TFS system will be compiled and installed. Chapter
    3 explains how packages and patches need to be downloaded to build an L system
    and how to store them on the new file system. Chapter 4 discusses the set of an
    appropriate working environment. Please read Chapter 4 carefully as it explains
    important issues you must be aware of before beginning your way through Chapter
    5 and beyond.


    Chapter 5 explains the installation of a number of packages that will form the
    basic development suite (or toolchain) which is used to build the actual system
    in Chapter 6. Some of these packages are needed to resolve circular dependencies—example,
    to compile a compiler, you need a compiler.


    Chapter 5 also shows you to build a first pass of the toolchain, including Binutils
    and GCC (which first basically means these two packages will be reinstalled).
    The next step is to build Glibc, the C library. Glibc will be compiled by the
    toolchain built in first pass, then a second pass of the toolchain will be built.
    This time, the toolchain will be dynamically linked in first pass. The remaining
    Chapter 5 packages are built using this second pass toolchain. When this is done,
    the TFS process will no longer depend on the host distribution, with the exception
    of the running kernel.


    This effort to isolate the new system from the host distribution may seem excessive.
    A full technical explanation as to why this is provided in Section 5.2, “Toolchain
    Technical Notes”.


    In Chapter 6, the L system is built. The chroot (root program) is used to create
    a virtual environment and start a new shell root directory will be the L partition
    as the root partition. This is very similar to rebooting and restarting the kernel
    to mount the L partition. The system does not actually reboot, but uses chroot
    because creating a bootable system requires additional work which is not necessary
    just. The major advantage is that “chrooting” allows you to continue using the
    host system while L is being built. While waiting for package compilations to
    complete, you can continue using your computer as normal.


    To finish the installation, the basic system configuration is set up in Chapter
    7, and the kernel and boot loader are set up in Chapter 8. Chapter 9 contains
    information on continuing the L experience beyond this book. After the steps in
    this book have been implemented, the computer will be ready to reboot into the
    new L system.


    This is the process in a nutshell. Detailed information on each step is discussed
    in the following chapters and package descriptions. Items that may seem complicated
    will be clarified, which will fall into place as you embark on the L adventure.


