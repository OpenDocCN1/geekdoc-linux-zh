  md: '# # Part III. Building the LFS System'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# # Chapter 6. Installing Basic System Software


    # ## 6.1. Introduction


    In this chapter, we enter the building site and start constructing the LFS system
    in earnest. That is, we into the temporary Linux system, make a few preparations,
    and then begin installing the packages.


    The installation of this software is straightforward. Although in many cases the
    installation instructions could be made shorter and more generic, we have opted
    to provide the full instructions for every package to minimize the possibilities
    for mistakes. The key to learning what a Linux system work is to know what each
    package is used for and why you (or the system) may need it.


    We do not recommend using optimizations. They can make a program run faster, but
    they may also cause compilation difficulties and problems when running the program.
    If a package refuses to compile using optimization, to compile it without optimization
    and see if the package does when using optimization, there is the risk it may
    have been compiled incorrectly because of the complex interactions between the
    code and build tools. Also note that the --march and --mtune options using values
    are often outweighed by the risks. First-time builders of LFS not specified in
    the book have not been tested. This may cause problems with the toolchain packages
    (Binutils, GCC and Glibc). The small gains achieved in using compiler optimizations
    are often outweighed by the risks. First-time builders of LFS are encouraged to
    build without custom optimizations. The subsequent system will still run well
    and remain stable at the same time.


    The order that packages are installed in this chapter needs to be strictly enforced
    to ensure that no program acquires a path referring to /tools hard-wired into
    it. For the same reason, do not compile separate packages in parallel. Compiling
    in parallel may seem fast (especially on dual-CPU machines), but it could result
    in a program containing a hard-wired path to /tools, which will cause the program
    to stop working when directory is removed.


    Before the installation, each installation page provides information about the
    package, including a concise description of what it contains, approximately how
    long it will take to build, and how much disk space is required during this building
    process. Following the installation instructions, there is a list of programs
    and libraries (along with brief descriptions of these) that the package installs.


    > Note The SBU values and required disk space includes test data for all applicable
    packages in Chapter 6.


    # ## 6.1.1. About libraries


    In general, the LFS editors discourage building and installing static libraries.
    The original purpose for most static libraries has been obsolete in a modern Linux
    system. In addition linking a static library into a program can be detrimental.
    If an update to the library is needed all programs will need to be relinked to
    the new library. Since the use of static libraries is not always obvious, the
    relevant programs (and the procedures to do linking) may not even be known.


    In the procedures in Chapter 6, remove or disable installation of most static
    libraries. This usually is by passing a --disable-static option to configure.
    In other cases, alternate means are needed. In a few cases, especially glibc and
    gcc, the use of static libraries remains essential to the general package building
    process.


    For a more complete discussion of libraries, see the discussion Libraries: Static
    or shared? in the BLFS book.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 6.2. Preparing Virtual Kernel File Systems


    Various file systems exported by the kernel are used to communicate to and from
    the kernel itself. These file systems are virtual in that no disk space is used
    for them. The content of the file systems resides in memory.


    Begin by creating directories onto which the file systems will be mounted:


    ```

    mkdir -pv $LFS/{dev,proc,sys,run}

    ```


    When the kernel boots, it requires the presence of a few device nodes, in particular
    the console and null devices. The device nodes must be created on the hard disk
    so that they are available before udev has been started, and when Linux is started
    with init=/bin/bash. Create these devices by running the following commands:


    ```

    mknod -m 600 $LFS/dev/console c 5 1

    mknod -m 666 $LFS/dev/null c 1 3

    ```


    # 6.2.2. Mounting and Populating /dev


    The recommended method of populating the /dev directory with devices is to mount
    a filesystem (such as tmpfs) on the /dev directory, and allow the devices to be
    created dynamically on that virtual filesystem as they are detected or accessed.
    Device creation is generally during the boot process by Udev. Since this new system
    does not have udev and has not yet been booted, it is necessary to mount and populate
    /dev manually by binding the host system''s /dev directory. A bind mount is a
    type of mount that allows you to create a mirror of a device or mount point to
    some other location. Use the following command to achieve this:


    ```

    mount -v --bind $LFS/dev

    ```


    # 6.2.3. Mounting Virtual Kernel File Systems


    Now mount the remaining kernel file systems:


    ```

    mount -vt devpts devpts $LFS/dev/pts -o gid=5,mode=620

    mount -vt proc proc $LFS/proc

    mount -vt sysfs sysfs $LFS/proc

    mount -vt tmpfs tmpfs $LFS/run

    ```


    The meaning of the mount options for devpts:


    ```

    gid=5

    ```


    This ensures that all devpts-created device nodes are owned by group ID 5. This
    is the ID we use later on the tty group. We use the group ID instead of a name,
    since the host system might use a different ID for its tty group.


    ```

    mode=0620

    ```


    This ensures that all devpts-created device nodes have mode 0620 (user readable
    and writable, group writable). Together with the option, this ensures that devpts
