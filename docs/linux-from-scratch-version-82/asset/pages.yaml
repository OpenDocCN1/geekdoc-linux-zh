    # Structure


    This book is divided into the following parts.


    # Part I - Introduction


    Part I explains a few important notes on how to proceed with the LFS installation.
    This section also provides meta-information about the book.


    # Part II - Preparing for the Build


    Part II describes how to prepare for the building process—making a partition,
    downloading the packages, and compiling temporary tools.


    # Part III - Building the LFS System


    Part III guides the reader through the building of the LFS system—compiling and
    installing all the packages by one, setting up the boot scripts, and installing
    the kernel. The resulting Linux system is the foundation on which other software
    can be built to expand the system as desired. At the end of this book, there is
    an easy to use reference listing all of the programs, libraries, and important
    files that have been installed.


    # Errata


    The software used to create an LFS system is constantly updated and enhanced.
    Security warnings and bug fixes may become available after the LFS book has been
    released. To check whether the package versions or instructions in this release
    of LFS need any modifications to accommodate security vulnerabilities or other
    bug fixes, please visit http://www.linuxfromscratch.org/lfs/errata/8.2/ before
    proceeding with your build. You should note any changes shown and apply them to
    the relevant section of the book as you progress with building the LFS system.'
