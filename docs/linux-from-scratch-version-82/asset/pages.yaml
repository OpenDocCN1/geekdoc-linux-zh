    LC_ALL=<locale name> locale language

    LC_ALL=<locale name> locale charset

    LC_ALL=<locale name> locale int_curr_symbol

    LC_ALL=<locale name> locale int_prefix

    ```


    The above commands should print the language name, the encoding used by the locale,
    the local currency, and the prefix to detail the phone number in order to get
    into the country. If any of the commands fail with a message similar to the one
    below, this means that your locale was not installed in Chapter 6 or is not supported
    by the default installation of glibc.


    ```

    locale: cannot set LC_* to default locale: No such file or directory

    ```


    If this happens, you should either install the desired locale using the localectl
    command, or choosing a different locale. Further instructions assume that there
    are no error messages from Glibc.


    Some packages LFS may also lack support for your chosen locale. One example is
    the X library (part of the X Window System), which outputs the following error
    message if the locale does not match exactly one of the character maps in its
    internal files:


    ```

    Warning: locale not supported by Xlib, locale set to C

    ```


    In several cases Xlib objects that the character map will be listed in uppercase
    notation with canonical dashes. For instance, "ISO-8859-1" rather than "iso88591".
    It is also possible to find an appropriate specification by renewing the charset
    map of the locale specification. This can be checked by running the locale charset
    in both locales. For example, one would have to change "de_DE.ISO-8859-15@euro"
    to "de_DE@euro" to get this locale recognized by Xlib.


    Other packages also function incorrectly (but may not display any error messages)
    if the locale name does not meet the expectations. In those cases, investigating
    how other distributions support your locale might provide some useful information.


    Once the proper locale settings have been determined, create the /etc/profile
    file:


    ```

    cat > /etc/profile << "EOF"

    # /etc/profile


    export LANG=<LANG>.<charset>@<modifiers>


    # End /etc/profile

    EOF

    ```


    The "C" default and "en_US" (the recommended for United States English users)
    locales are different. "C" uses the US-ASCII 7-bit character set, and treats bytes
    with the high bit set as invalid characters. That''s why, e.g., the ls command
    shows them with question marks in the locale. Also, an attempt to send mail with
    such characters from Mutt or Pine results in non-RFC-conforming messages sent
    (the charset in the outgoing mail) is indicated as "unknown 8-bit”). So you can
    use the "C" locale only if you are sure that you will never need 8-bit characters.'
