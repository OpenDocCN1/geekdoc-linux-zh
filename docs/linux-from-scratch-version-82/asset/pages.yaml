    # ## Prerequisites


    Building an LFS system is not a simple task. It requires a certain level of knowledge
    of existing Unix system administration in order to resolve problems and correctly
    execute the commands listed. In particular, as an absolute minimum, you should
    already have the ability to use the command line (shell) to copy files and directories,
    list directory file contents, and change the current directory. It is also expected
    that you have a reasonable knowledge of using and installing Linux software.


    Because the LFS book assumes at this basic level of skill, the fairly LFS forums
    are unlikely to be able to provide you with much assistance in these areas. You
    will find that your questions regarding such basic knowledge likely go unanswered
    or you will be referred to the LFS essential pre-reading list.


    Before building an LFS system, we recommend reading the following:


    +   - Software-Building-HOWTO http://www.ldp.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" Unix software
    packages. Although it was written some time ago, it provides a good summary of
    the techniques needed to build and install software.


    +   - Beginner''s Guide to Installing from Source http://moi.vos.net/linux/beginners-installing-from-source/


    This guide provides a good summary of basic skills and techniques needed to build
    software from source code.'
