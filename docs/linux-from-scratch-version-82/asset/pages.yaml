  md: "If an X Window System is to be installed on the LFS system, it may be necessary\
    \ to reconcile Vim after installing X. Vim comes with a GUI version of the editor\
    \ that requires X and some additional libraries to be installed. For more information\
    \ on this, refer to the Vim documentation and the Vim installation page in the\
    \ BLFS book at http://www.linuxfromscratch.com/blfs/view/8.2/postifs/vim.html.\n\
    \n#  6.7.2. Configuring Vim\n\nBy default, vim runs in vi-compatible mode. This\
    \ may be new to users who have used other editors in the past. The \"incompatible\"\
    \ setting is included below to highlight the fact that a behavior is being used.\
    \ It also reminds them where change to \"compatible\" mode it should be the first\
    \ setting in the configuration file. This is necessary because it changes other\
    \ settings, and overrides must come after this setting. Create a default vim configuration\
    \ file by running the following:\n\n```\ncat /etc/vimrc << \"EOF\"\n  Begin /etc/vimrc\n\
    \n  Ensure defaults are set before customizing settings, not after\n  source $VIMRUNTIME/defaults.vim\n\
    \  let skip_defaults_vim=1\n\nset incompatible\nset backspace=2\nset mouse=\n\
    syntax on\nif ($term == \"xterm\") || (&term == \"putty\")\n  set background=dark\n\
    endif\n\n  End /etc/vimrc\nEOF\n```\n\nThe set incompatible setting makes vim\
    \ behave in a more useful way (the default) than the vi-compatible manager. Remove\
    \ the \"no\" to keep the old behavior. The set backspace=2 setting allows backspacing\
    \ over line breaks, autointents, and start of insert. The syntax on parameter\
    \ enables vim's syntax highlighting. The set mouse=setting enables proper pasting\
    \ of text with the mouse when working in chroot or over a remote connection. Finally,\
    \ the if statement with the set background=dark setting corrects vim's guess about\
    \ the background color of some terminal emulators. This gives the highlighting\
    \ a better color scheme for the black background of these programs.\n\nDocumentation\
    \ for other available options can be obtained by running the following command:\n\
    \n```\nvim -c ':options'\n```"
