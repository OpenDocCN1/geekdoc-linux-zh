  md: '# 7.3. Overview of Device and Module Handling


    In Chapter 6, we installed the Udev package when eudev was built. Before we go
    into the details regarding how this works, a brief history of previous methods
    of handling devices is in order.


    Linux systems in general traditionally used a static device creation method, whereby
    a great many nodes were created under /dev (sometimes thousands of nodes), regardless
    of the corresponding hardware devices actually existed. This was typically done
    via a MAKEDEV script, which contains a number of calls to the mknod program with
    the relevant major and minor device numbers for every possible device that might
    exist in the world.


    Using the Udev method, only those devices that are detected by the kernel device
    nodes were created. Because these device nodes will be created each time the system
    boots, they will be stored on a dev.mem file system (a virtual file system that
    resides entirely in memory). Device nodes do not require much space, so the method
    we used is negligible.


    # 7.3.1. History


    In February 2000, a new filesystem called devfs was merged into the 2.3.4 kernel
    and was made available during the 2.4 series of stable kernels. Although it was
    present in the kernel source itself, this method of creating devices dynamically
    never received overwhelming support from the core kernel developers.


    The main problem with the approach adopted by devfs was the way it handled device
    detection, creation, and naming. The latter issue, of device node naming, was
    perhaps the most critical. It is generally accepted that if device names are allowed
    to be configurable, then the device naming policy should be up to a system administrator,
    not imposed by any particular developer(s). The devfs filesystem also suffered
    from race conditions that were inherent in its design and could not be fixed without
    a substantial revision to the kernel. It was marked as deprecated for a long period
    – due to a lack of maintenance – and was finally removed from the kernel in June,
    2006.


    With the development of the unstable 2.5 kernel tree, later released as the 2.6
    series of stable kernels, a new filesystem called sysfs came to be. The job of
    sysfs is to export the system''s hardware configuration to userspace processes.
    With this userspace-visible representation, the possibility of developing a userspace
    replacement for devfs became much more realistic.


    # 7.3.2. Udev Implementation


    # 7.3.2.1. Sysfs


    The sysfs filesystem was mentioned briefly above. One may wonder how sysfs knows
    about the devices present on a system and what device numbers should be used for.
    Drivers that have been compiled into the kernel device register their objects
    with sysfs (devtmpfs internally) as they are detected by the Kernel. For drivers
    compiled modules, this registration will happen when the module is loaded. If
    the sysfs filesystem is mounted on (/sys), data which the drivers register with
    sysfs are available to userspace processes and to udev for processing (modifications
    to device nodes).


    # 7.3.2.2. Device Node Creation


    Device files are created by the kernel by the devtmpfs filesystem. Any driver
    that wishes to register a device node will go through devtmpfs (via the device
    core) to do it. Any devtmpfs instance is mounted on /dev, the device node will
    initially be created with a fixed name, permissions, and other.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'A short time later, the kernel will send an event to udev. Based on the rules
    specified in the files within the /etc/udev/rules.d, /lib/udev/rules.d, and /run/udev/rules.d
    directories, udev will create symlinks to the device node, or change its permissions,
    owner, or group, or modify the udev database entry (name) for that object.


    The rules in these directories are numbered and all directories are merged together.
    If udev can''t find a rule for the device it is creating, it will leave the permissions
    and ownership at whatever devtmpfs used initially.


    # 7.3.2. Module Loading


    Device drivers as modules may have aliases built into them. Aliases are usually
    related to the output of the modinfo program and are specific to devices supported
    by a module. For example, the snd-fm801 driver supports PCI devices with device
    ID 0xc819 and device ID 0x0801, and has an alias of :pci:v0001319d00008018s*bdca0101*.
    Most udev explores the aliases of the driver that would handle the device via
    sysfs. E.g., /sys/bus/pci/devices/0000:00:0d.0/modalias file might contain the
    string "pci:v0001319d00008018s*bdca01c100". The default rules with Udev will cause
    udev to call out to /sbin/modinfo with the contents of the MODALIAS environment
    variable via sysfs, loading all modules whose aliases match this string after
    wildcard expansion.


    In this example, that in addition to snd-fm801, the obsolete (and unwanted) forte
    driver will be loaded if it is available. See below for ways in which the loading
    of unwanted drivers can be prevented.


    The kernel itself is able to load modules for network protocols, filesystems and
    NLS support on demand.


    # 7.3.4. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Bus (USB) MP3 player, the kernel
    notices the device is now connected and generates a uevent. This event is handled
    by udev as described above.


    # 7.3.3. Problems with Loading Modules and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    # 7.3.3.1. A kernel module is not automatically loaded


    Udev will only load a module if it has a bus-specific alias and the bus driver
    exports the necessary aliases to sysfs. In other cases, one might alias module
    loading by order. With Linux-4.15.3, Udev is known to load properly-written drivers
    for INPUT, PCI, USB, SCSI, Serial, and FireWire devices.


    To determine if the device you requires has the necessary support for Udev, run
    modinfo with the module name. Now check the device directory /sys/bus and check
    whether there is a modalias file.


    If the modalias exists in sysfs, the driver supports the device and can talk to
    it directly, but doesn''t have the alias, it is a bug in the driver without the
    help from udev and expect the issue to be fixed.


    If there is no modalias file in the relevant directory under /sys/bus, this means
    that the kernel developers have not yet added support to this bus type. With Linux-4.15.3,
    this is an issue with ISA buses. Expect this issue to be fixed in later kernel
    versions.


    Udev is not intended to load “wrapper” drivers such as sdm-pcm-oss and non-hardware
    drivers as loop at all.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# 7.3.3.2. A kernel module is not loaded automatically, and Udev is not intended
    to load


    If the "wrapper" only enhances the functionality provided by some other module
    (e.g., snd-pcm enhances the functionality of snd-pcm by making sound cards available
    to OS applications), configure modprobe to load the wrapper after Udev loads the
    wrapped module. To do this, add a "softdev" to the corresponding /etc/modprobe.d/<filename>.conf
    file. For example:


    ```

    softdev snd-pcm post: snd-pcm-oss

    ```


    Note that the "softdev" command also allows pre: dependencies, or a mixture of
    both pre and post:. see modprobe.d (5) manual page for more information on "softdev"
    syntax and capabilities.


    If the module in question is not a wrapper and is useful by itself, configure
    the modules bootscript file on system boot. To do this, add the module to the
    /etc/sysconfig/modules file on a single line. It works for wrappers too, but is
    suboptimal in case.


    # 7.3.3.3. Udev loads some unwanted module


    Either do not build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the example below:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    # 7.3.3.4. Udev creates a device incorrectly, or makes a wrong symlink


    This usually happens if a rule unexpectedly matches a device. A poorly-written
    rule can match both a SCSI device (as desired) and the corresponding SCSI generic
    device (incorrectly) by vendor. Finding the offending rule and make it more specific,
    with the help of the udevadm info command.


    # 7.3.3.5. Udev creates rules unreli


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be the kernel timing issue, for now you can work
    around it by creating a rule that waits for the used sysfs attribute and appending
    it to the /etc/udev/rules.d/10-wait_for_sysfs.rules file (create this file if
    it does not exist). Notify the DFS list if you do and it helps.


    # 7.3.3.6. Udev does not create a device


    Further text assumes that the device is built statically into the kernel or loaded
    as a module, and you have already checked that Udev doesn''t create a misnamed
    device.


    Udev has no information needed to create a device if a kernel does not export
    its data to sysfs. This is most common with third party drivers from outside the
    kernel tree. Create a static device node in /lib/udev/devices with the appropriate
    major/minor numbers (see file devices.txt includes the kernel documentation or
    the documentation provided by the third party driver). The static device node
    will be copied to /dev by udev.


    # 7.3.3.7. Device naming order changes randomly after rebooting


    This is due to fact that Udev, by design, handles uevents and modules in parallel,
    and thus in an unpredictable way. This will never be "fixed". You should not reload
    the kernel device names being. Instead, create your own rules that make symlinks
    with name based on some attributes of the device, such as a serial number or the
    output of various *_ utilities installed by Udev. See Section 7.4, "Managing Devices"
    and Section 7.5, "General Network Configuration" for examples.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 7.3.4. Useful Reading


    Additional helpful documentation is available at the following sites:


    +   - A Userspace implementation of devfs http://www.chroah.com/linux/talks/ols_2003_udev_paper/Reprint-Koah-Hartman-OLS2003.pdf

    - The sysfs Filesystem http://kernel.org/pub/linux/kernel/people/doc/papers/ols-2005/mochedel.pdf


    # 7.4. Managing Devices


    # 7.4.1. Network Devices


    Udev, by default, names devices according to Firmware/BIOS data or physical characteristics
    like the bus, slot, or MAC address. The purpose of this naming convention is to
    ensure that network devices are named consistently and not based on the network
    card was discovered. For example, on a computer having two network cards made
    by Intel and Realtek, the network card manufactured by Intel may be eth0 and the
    Realtek card made by eth1. In some cases, after a reboot the cards get renamed
    the other way.


    In the new naming scheme, typical network device names would be something like
    enps0 or wlp3s0. If this naming convention is not desired, the traditional naming
    scheme or a custom scheme can be implemented.


    # 7.4.1.1. Disabling Persistence on the Kernel Command Line


    The traditional naming scheme using eth0, eth1, can be restored by using net.ifnames=0
    on the kernel command line. This is most appropriate for those systems that have
    one ethernet device of the type. Laptops often have multiple ethernet that are
    named eth0 and wlan0 and are also candidates for this method. The command line
    is passed in the GRUB configuration file. See Section 8.4.4, "Creating the GRUB
    Configuration".


    # 7.4.1.2. Creating Udev Rules


    The naming scheme can be customized by creating custom Udev rules. A script has
    been included that generates initial rules. Generate these by running:


    ```

    bash /lib/udev/init-persistent-rules.sh

    ```


    Now, inspect /etc/udev/rules.d/70-persistent-net.rules, to find out which name
    was assigned to which network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > Note

    In cases when MAC addresses have been assigned to a network card manually or in
    a virtual environment like Qemu or Xen, the network rules may not have been generated
    because addresses are not consistently assigned. In these cases, this method cannot
    be used.


    The file begins with a comment block followed by lines for each NIC. The line
    for each NIC is a commented description showing its hardware IDs (e.g. its PCI
    vendor and device IDs, if it''s a PCI card), along with its driver in parentheses,
    if the driver can. Neither the hardware ID nor the driver is used to determine
    name to give an interface; this information is only for reference. The second
    line is the Udev rule that matches this NIC and assigns it a name.


    All Udev rules are made up of several keys, separated by commas and optional whitespace.
    This rule''s keys and explanation of each them are as follows:'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'SUBSSTEM="net" - This tells Udev to ignore devices that are not network cards.


    - ACTION="add" - This tells Udev to ignore this for a event that isn''t an add
    ("remove" and "change") events also, but don''t need to rename interfaces.


    - DRIVERS="*" - This exists so Udev will ignore VLAN or bridge sub-interfaces
    (because sub-interfaces do not have drivers). These sub-interfaces are skipped
    because the name that would be assigned collide with the parent devices.


    - ATTR{address} - The value of this key is the NIC''s MAC address.


    - ATTR{type=""} - This ensures the rule only matches the primary interface in
    the case of wireless drivers, which create multiple interfaces. The secondary
    interfaces are skipped for the same reason that VLAN and bridge sub-interfaces
    are skipped: there would be a name collision otherwise.


    - NAME - The value of this key is the name that Udev will assign to this interface.


    The value of NAME is the important part. Make sure you know which name has been
    assigned to which of your network cards before proceeding, and be sure to use
    NAME when creating your configuration files.


    # 74.2. CD-ROM symlinks


    Some software that you may want to install (e.g., various media players) expect
    the /dev/cdrom and /dev/dvd links to exist, and point to a CD-ROM or DVD-ROM device.
    Also, it may be convenient to refer to these symlinks into /etc/stab. With a script
    that will generate rules for these symlinks for you, depending on the capabilities
    of each device, but you need to decide which two modes of operation you wish to
    have the script use.


    The first script can operate in "by-path" mode used for USB and FireWire devices),
    which the rules creates on the physical path of the CD or DVD device. Second,
    it can operate in "by-id" mode (for IDE and SCSI devices), which the rules creates
    on identification strings stored in the CD or DVD device path. The path is determined
    by Udev''s path_id script, and the identification strings are read from the hardware
    by its ata_id


    There are advantages to use this approach; the correct approach to use will depend
    on what kind of devices changes happen. If you expect the physical path to the
    drive (that is, the ports and/slots that it plugs into) to change, for example
    you use the "by-id" mode. On the other, if you expect the device''s identification
    to change, for example because it may die, and you would replace it with a different
    device with the same capabilities and which plugged into the same connectors,
    then you use the "by-path" mode.


    If either type of change is possible with your drive, choose a mode based on the
    type of device you expect to have more often.


    > Important

    External devices (for example, a USB-connected CD drive) should not use by-path
    persistence, because each time the device is plugged into a new external port,
    its physical path will change. All-externally devices will have this problem if
    you write Udev rules to recognize by their physical path; the problem is not limited
    to CD and DVD drives.


    If you wish to see the values that Udev scripts will use, for the appropriate
    CD-ROM device, find the corresponding directory under /sys (e.g., this can be
    /sys/block/hdd) and run a command similar to the following:


    ```

    udevadm test /sys/block/hdd

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'Look at the lines containing the output of various *_id programs. The "by-id"
    mode will use the ID_SERIAL if it exists and not empty, otherwise we will use
    a combination of ID_MODEL and ID_REVISION. The "by-path" mode will use the ID_PATH.


    If the default mode is not suitable for your situation, then the following modification
    can be made to the /etc/udev/rules.d/83-cdrom-symlinks.rules file, as follows
    (where mode is one of "by-id" or "by-path"):


    ```

    sed -i ''s/"write_cd_rules"/"write_cd_rules mode"/'' \ /etc/udev/rules.83-cdrom-symlinks.rules

    ```


    Note that it is not necessary to create the rules files or symlinks at this time,
    because you have bound-mount the host''s /dev directory into the LFS system, and
    we use the symlinks on the host. The rules and symlinks will be created the first
    time you use your LFS system.


    However, if you have multiple CD-ROM devices, the symlinks generated at that time
    may point to different devices than they point to your host, because devices are
    not discovered in a predictable order. The assignments created when you boot the
    LFS system will be stable, so this is only an issue if the symlinks on both systems
    point to the same device. If you need to, inspect (and possibly edit) the generated
    /etc/udev/rules.d/70-persistent-cd.rules file after booting, make sure the symlinks
    match what you need.


    # ## 7.4. Dealing with duplicate devices


    As explained in Section 7.3, "Overview of Device and Module Handling", the order
    in which devices with the same name appear in /dev is essentially random. E.g.,
    if you have a USB camera and a TV tuner, sometimes /dev/video0 refers to the camera,
    and /dev/video1 refers to the tuner, and after a reboot the order changes to the
    opposite one. For all classes of hardware except sound cards and network cards,
    this is fairly by creating udev rules for custom persistent names. The case of
    network cards is covered separately in Section 7.5, "General Network Configuration",
    and sound card configuration can be found in BLFS.


    For each of your devices that is likely to have this problem (even if the problem
    doesn''t exist in your current Linux distribution), find the corresponding directory
    under /sys/class or /sys/block. For video devices, this may be /sys/class/video4linux/videoX.
    Figure out the attributes that identify the device (usually, vendor and product
    IDs/or serial numbers):


    ```

    udevinfo -a -p /sys/class/video4linux/video0

    ```


    Then write rules to create the symlinks,


    ```

    cat > /etc/udev/rules.83-duplicate_devs.rules << "EOF"


    KERNEL==="video*", ATTRS{idProduct}="1910", ATTRS{idVendor}="0d81", \\

    SYMLINK+="webcam"

    KERNEL==="video*", ATTRS{device}="0x036f", ATTRS{vendor}="0x109e", \\

    SYMLINK+="twtuner"


    EOF

    ```


    The result is that /dev/video0 and /dev/video1 devices still refer to the tuner
    and the camera (and should never be used directly), but there are symlinks /dev/twtuner
    and /dev/webcam that always point to the correct device.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 7.5. General Network Configuration


    # 7.5.1. Creating Network Interface Configuration Files


    Which interfaces are brought up and down by the network script usually depends
    on the files in /etc/sysconfig/. This directory should contain a file for each
    interface to be configured, as ifconfig.xyz, where "xyz" should describe the network
    card. The interface name (e.g. eth0) is usually appropriate. In this file are
    attributes to this interface, such as its IP address(es), subnet masks, and for.
    It is necessary that the stem of the filename be ifconfig.


    > Note

    If the procedure in the previous section was not used, Udev will assign network
    interface names based on physical characteristics such as enp2s1. If you are not
    sure what your interface name is, you can always run ip link or /sys/class/net
    after you have booted your system.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat > ifconfig.eth0 << "EOF"

    ONBOOT=yes

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROADCAST=92.168.1.255

    EOF

    ```


    The values of variables must be changed in every file to make the proper setup.


    If the ONBOOT variable is set to "yes" the System V script will bring up the Network
    Interface Card (NIC) during booting of the system. If you set anything to "yes"
    the NIC will be ignored by the network script and not be automatically brought
    up. The interface can be manually started or stopped with the ifup and ifdown
    commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all network device configuration files.


    The SERVICE variable defines the method used for obtaining the IP address. The
    LFS-Services package has a modular assignment format, creating additional files
    in the /lib/services/ directory allows other assignment methods. This is commonly
    used for Dynamic Host Configuration Protocol (DHCP), which is addressed in the
    BLFS files.


    The GATEWAY variable should contain the default gateway address, if one is present.
    Then comment out the variable entirely.


    The PREFIX variable contains the number of bits used in the subnet. Each octet
    in an IP address is 8 bits. If the subnet''s mask is 255.255.255.0, then it is
    using the first 3 octets (24 bits) to specify the network fact. If the network
    is 255.255.255.240, it would be using the first 28 bits. Prefixes longer than
    24 bits are commonly used by DSL and cable-based Internet Service Providers (ISPs).
    In this example (PREFIX=24), the netmask is 255.255.255.0. Adjust the the PREFIX
    variable according to your specific subnet. If omitted, the PREFIX defaults to
    24.


    For more information see the ifup man.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 7.5.2. Creating the /etc/resolv.conf File


    The system will need some means of obtaining Domain Name Service (DNS) name resolution
    to resolve Internet names to IP addresses, and vice versa. This is best achieved
    by placing the IP address of the DNS server, available from the ISP or network
    administrator, to /etc/resolv.conf. Create the file by running the following:


    ```

    cat /etc/resolv.conf << "EOF"

    # Begin /etc/resolv.conf


    domain <Your Domain Name>

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>


    # End /etc/resolv.conf

    EOF

    ```


    The domain statement can be omitted or replaced with a search statement. See the
    man page for resolv.conf for more details.


    Replace IP address of the nameserver with the IP address of the DNS most appropriate
    for the setup. There will be more than one entry (requirements demand secondary
    servers for fallback capability). If you need only one DNS server, remove the
    second nameserver line from the file. The IP address may also be a router on the
    local network.


    > Note

    The Google Public IPv4 addresses are 8.8.8.8 and 8.8.4.4.


    # 7.5.3. Configuring the system hostname


    During the boot process, the file /etc/hostname is used for establishing the system''s
    hostname.

    Create the /etc/hostname file and enter a hostname by running:


    ```

    echo "<hostname>" > /etc/hostname

    ```


    <hostname> needs to be replaced with the name given to the computer. Do not enter
    the Fully Qualified Domain Name (FQDN). That information is put in the /etc/hosts
    file.


    # 7.5.4. Customizing the /etc/hosts File


    Decide on the IP address, fully-qualified domain name (FQDN), and possible aliases
    for use in the /etc/hosts file.

    The syntax is:


    ```

    IP_address myhost.example.org aliases

    ```


    Unless the computer is to be visible to the Internet (i.e., there is a registered
    domain and a valid block of assigned IP addresses—most users do not have this),
    make sure that the IP address is in the private network address range. Valid ranges
    are:


    | Private Network Address Range | Normal Prefix |

    |---|---|

    | 10.0.0.1 - 10.255.255.254 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Linux From Scratch - Version 8.2


    x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid private IP address could be 192.168.1.1. A valid FQDN for this IP could
    be lfs.example.org.


    Even if not using a network card, a valid FQDN is still required. This is necessary
    for certain programs to operate correctly.


    Create the /etc/hosts file by running:


    ```

    cat > /etc/hosts << "EOF"

    # Begin /etc/hosts

    127.0.0.1 localhost

    127.0.0.1 <FQDN> <HOSTNAME>

    <192.168.1.1> <FQDN> <HOSTNAME> [alias1] [alias2 ...]

    ::1 localhost ip6-localhost ip6-loopback

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters

    # End /etc/hosts

    EOF

    ```


    The <192.168.1.1>, <FQDN>, and <HOSTNAME> values need to be changed for specific
    uses or requirements (if assigned an IP address by a network/system administrator
    and the machine will be connected to an existing network). The optional alias(s)
    can be omitted.


    # 7.6. System V Bootscript Usage and Configuration


    # 7.6.1 How Do the System V Bootscripts Work?


    Linux uses a special booting facility SysVinit that is based on a concept of run-levels.
    It can be quite different from one system to another, so it cannot be assumed
    that things worked in one particular Linux distribution, they should work in the
    LFS too. TFS has its own way of doing things, but it generally accepts standards.


    SysVinit (which will be referred to as "init" from now on) uses running run-levels.
    There are seven (0 to 6 run-levels (actually, there are more levels, but they
    are for special cases and are generally not used). See init (8 for more details),
    and each one of those corresponds to the actions the computer is supposed to perform
    when it starts up. The default run-level is 3. Here are the descriptions of the
    different run-levels as they are implemented:


    +   0: halt the computer

    1: single-user mode

    2: multi-user mode without networking

    3: multi-user mode with networking

    4: reserved for customization, otherwise does the same as 3

    5: same as 4, it is usually used for GUI login (like X xdm or KDE’s kdm)

    6: reboot the computer


    237'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 7.6.2. Configuring Sysvinit


    During the kernel initialization, the first program that is run is either specified
    on the command line, or by default init. This program reads the initialization
    file /etc/initab. Create this file with:


    ```

    cat > /etc/initab << "EOF"

    # Begin /etc/initab


    id:3:initdefault


    si::sysinit:/etc/rc.d/init.d/rc S


    10:0:wait:/etc/rc.d/init.d/rc 0

    11:S:wait:/etc/rc.d/init.d/rc 1

    12:2:wait:/etc/rc.d/init.d/rc 2

    13:3:wait:/etc/rc.d/init.d/rc 3

    14:4:wait:/etc/rc.d/init.d/rc 4

    15:5:wait:/etc/rc.d/init.d/rc 5

    16:6:wait:/etc/rc.d/init.d/rc 6


    ca:12345:ctrltdelt:/sbin/shutdown -tl -a -r now


    su:S016:once:/sbin/slogin


    1:2345:respawn:/sbin/agetty --nuclear tty1 9600

    2:2345:respawn:/sbin/agetty tty2 9600

    3:2345:respawn:/sbin/agetty tty3 9600

    4:2345:respawn:/sbin/agetty tty4 9600

    5:2345:respawn:/sbin/agetty tty5 9600

    6:2345:respawn:/sbin/agetty tty6 9600


    # End /etc/initab

    EOF

    ```


    An explanation of this initialization file is in the main page for initab. For
    LFS, the key command to run is rc. The initialization file above will instruct
    rc to run all scripts starting with an S in the /etc/rc.d/rcS directory followed
    by all the scripts starting with an S in the /etc/rc.d/rc? where the question
    mark is specified by the itdefault value.


    As a convenience, the rc script reads a library of functions in /lib/sb/init-functions.
    This library also reads an optional configuration file, /etc/sysconfig/rc.site.
    Any of the system configuration parameters described in subsequent sections can
    be alternatively placed in this file consolidating all system parameters in one
    file.


    As a debugging convenience, the functions script also logs all output to /run/var/boot.log.
    The /run directory is a tmpfs, fi is not persistent across boots, however it is
    appended to the more permanent file /var/log/boot.log at the end of the boot process.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# 7.6.2.1. Changing Run Levels


    Changing run-levels is done with init <runlevel>, where <runlevel> is the target
    run-level. For example, to reboot the computer, a user could use the init 6 command,
    which is an alias for the reboot command. Likewise, init 0 is an alias for the
    halt command.


    There are a number of directories under /etc/rc.d that look like rc?.d (where
    ? is the number of the run-level) and rcsinit.d, all containing a number of symbolic
    links. Some begin with a K, the others begin with an S and the K means to stop
    (kill) a service and the S means to start a service. The numbers determine the
    order in which the scripts are run, from 00 to 99—the lower the earlier it gets
    executed. When init switches to another run-level, the appropriate services are
    started or stopped, depending on the runlevel chosen.


    The real scripts are in /etc/rc.d/init.d. They do the actual work, and links all
    point to them. K and S links point to the same script in /etc/rc.d/init.d. This
    is because the scripts can call with different parameters like start, stop, restart,
    reload, and status. When a K is encountered, the appropriate script is run with
    the start argument. When an S is encountered, the appropriate script is run with
    the start argument.


    There is one exception to this explanation. Links that start with an S in the
    parameter rc0 and rc6.d directories will not cause anything to be started. They
    use the parameter to stop something. The logic behind this is that when a user
    is going to reboot or halt the system, nothing needs to be started. The system
    only needs to be stopped.


    These are descriptions of what the arguments make the scripts do:


    +   start

    The service is started.

    stop

    The service is stopped.

    restart

    The service is stopped and then started again.

    reload

    The configuration of the service is updated. This is used after the configuration
    file of a service was modified, when the service does not need to be restarted.

    status

    Tells if the service is running and with which PIDs.


    Feel free to modify the way your boot process works (after all, it is your own
    LFS system). The files given here are example of how it can be done.


    # 7.6.3. Udev Bootscripts


    The /etc/rc.d/init.d/udev init script starts udev, triggers any "coldplug" devices
    that have already been created by the kernel and waits for rules to complete.
    The script also inserts the event handler from the default of /sbin/hotplug This
    is because the kernel no longer needs to call out to an external binary. udev
    listen on a network socket for events that the kernel raises.


    The /etc/rc.d/init.d/udev_retry script calls for re-triggering events for subsystems
    whose rules may rely on filesystems that are not mounted the mounts script run
    (in particular, /usr and /var may cause this). This script runs after the mounts
    script, so those (if triggered) succeed the second time around. It is configured
    from the /etc/sysconfig/udev_retry file; any rules in this file that other comments
    are considered subsystem name to trigger retry time. To find the system of a device,
    use udevadm --attribute-walk <device> where <device> is an absolute path in /dev
    or sys as /dev/sr0 or /sys/class/rtc.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 7.6.3.1. Module Loading


    Device drivers as modules may have the bus-aliases built into them. Aliases are
    visible in the output of the `modinfo` command and are listed as the bus-identifiers
    of devices supported by the module. For example, the `snd-fm801` driver PCI devices
    with device ID 0x1319 and device ID 0x0801, and has an alias of `pci:v00001319d0000801sv*d04cli*`.
    For most devices, the bus driver exports the alias of the driver that would handle
    the device via the `/sys/bus/pci/devices/0000:00:00.0/modalias` file containing
    the string `pci:v00001319d0000801sv00001319d00001bc04100`. The default rules require
    Udev to call out to `/sbin/modprobe` with the contents of the `MODALIAS` uevent
    environment variable (which should be the same as the contents of the modalias
    file in sysfs), loading all modules that match this string after wildcard.


    In this example, this means that, in addition to `snd-fm801`, the obsolete (and
    unwanted) `forte` driver will be loaded if it is available. The kernel itself
    also able to load modules for network protocols, filesystems and NLS support on
    demand.


    # 7.6.2. Handling Hotplgable/Dynamic Devices


    When you plug in a device, such as a Universal Bus (USB) MP3 player, the kernel
    recognizes the device is connected and generates a uevent. This uevent is then
    handled by `udev` as described.


    # 7.6.4. Configuring the System Clock


    The `clock` command sets the time from the hardware clock, also known as the BIOS
    or the Complementary Metal Oxide Semiconductor (CMOS) clock. If the hardware clock
    is set to UTC, this system will convert the hardware clock to the local time using
    the `/etc/localtime` file (which tells the `hwclock` program which timezone the
    user is in). There is no way to detect whether the hardware clock is set to UTC,
    so this needs to be configured.


    The `set` command is run by udev when the kernel detects the hardware capability
    upon boot. It can be run manually with the stop parameter to store the time to
    the CMOS clock.

    If cannot remember whether or not the hardware clock is set to UTC, find out by
    running the `hwclock localtime --show` command. This will display the current
    time is according to the hardware clock. If this matches your watch times, then
    the hardware clock is set to local time. If the output from `hwclock` is not local
    time, chances it is set to UTC. Verify this by adding or subtracting an amount
    of hours for the time to the timezone by `hwclock`. For example, if you are in
    the MST timezone, which is known as GMT -070, add seven hours to the local time.


    Create a new `/etc/sysconfig/clock` file by running the following:


    ```

    cat /etc/sysconfig/clock << "EOF"

    # Begin /etc/sysconfig/clock


    UTC=1


    # Set this to any options you might need to give to hwclock,

    # such as machine hardware clock type for Alphas.

    CLOCKPARAMS=


    # End /etc/sysconfig/clock

    EOF

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Linux From Scratch - Version 8.2


    A good hint explaining how to deal with TFS is available at http://www.linuxfromscratch.org/hints/downloads/file/time.txt.
    It explains issues as time zones, UTC, and the TZ environment variable.


    > Note

    The CLOCKPARAMS and UTC paramaters may be alternatively set in the /etc/sysconfig/rc.site
    file.


    # 7.6.5. Configuring the Linux Console


    This section discusses how to configure the console bootsrt that sets the keyboard
    map, font console and kernel log level. If non-ASCII characters (e.g., the copyright
    sign, the British pound sign and Euro symbol) will not be used and the keyboard
    is a U.S. one, much of this section can be skipped. Without the configuration
    file (or equivalent settings in rc.site), the console bootsrt will do nothing.


    The console script reads the /etc/sysconfig/console file for configuration decision.
    Decide which keymap and font will will help with, see http://www.tld.org/ORG/HOWTO-INDEX/other-lang.html.
    If still, look in the /usr/share/keymaps and /usr/share/contents directories for
    keymaps and fonts. Read todays(1) and setfont(8) manual pages to determine the
    correct arguments for these programs.


    The /etc/sysconfig/console file should contain lines of the form: VARIABLE="value".
    The following variables are recognized:


    LOGLEVEL


    This variable specifies the log level for kernel messages set to the console by
    dmesg. Valid levels are from "1" (no messages) to "8". The default level is "7".


    KEYMAP


    This variable specifies the arguments for the loadkeys program, typically the
    name of keymap to load, e.g., "it". If this is not set, the bootsrt will not run
    the loadkeys program, and the default keymap will be used. Note that few keymaps
    have multiple versions with the same name (cz and its variants in qwerty/qwertzl,
    in olpc/ and qwertzl/, and trf in fGlod/qwerty). In case the parent directory
    should also be specified (e.g. qwerty) to ensure the keymap is loaded.


    KEYMAP_CORRECTION


    (this rarely used) variable specifies the arguments for the second call to the
    loadkeys program. This is useful if the keymap is not completely satisfactory
    and a small adjustment has to be made. E.g., to include the Euro sign into a keymap
    that normally doesn''t have it, set this variable to "euro".


    FONT


    This variable specifies the arguments for the setfont program. Typically, this
    includes the font name, "m", and the name of the application character map to
    load. E.g., in order to load "lat-16" font together with the "8859-1" character
    map (as it is appropriate in the USA), set this to "lat-16 -m 8859-1". In UTF-8
    mode, the kernel uses the application character map for conversion of composed
    8-bit keys in the keymap to UTF-8, and thus the argument of the "-m" parameter
    should be set to the encoding of the composed keys in the keymap.


    UNICODE


    Set this variable to "1,"yes" or "true" in order to put the console into UTF-8
    mode. This is useful in UTF-8 based locales and harmful otherwise.


    241'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# LEGACY_CHARSET


    For many keyboard layouts, there is no stock Unicode keymap in the Kbd package.
    The console딨 will convert an available keymap to UTF-8 on the fly if this variable
    is set to the encoding of the available non-UTF-8 keymap.


    Some examples:


    +   - For a non-Unicode setup, only the KEYMAP and FONT variables are generally
    needed. E.g., for a Polish setup, one would use:


    ```

    cat /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="pl12"

    FONT="lat2a-16 -m 8859-2"


    # End /etc/sysconfig/console

    EOF

    ```


    +   - As mentioned above, it is sometimes necessary to adjust a stock keymap slightly.
    The following example adds the Euro symbol to the German keymap:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="de-latin1"

    KEYMAP_CORRECTIONS="euro2"

    FONT="lat0-16 -m 8859-15"


    # End /etc/sysconfig/console

    EOF

    ```


    +   - The following is a Unicode-enabled example for Bulgarian, where a stock
    UTF-8 keymap exists:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="LatArCyrHeb-16"


    # End /etc/sysconfig/console

    EOF

    ```'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'Due to the use of a 512-glyph LatArCyrHeb-16 font in the previous example,
    bright colors are no longer available on the Linux console unless a framebuffer
    is used. If one wants to have bright colors without framebuffer and live without
    characters not belonging to the language, it is still possible to use a language-specific
    256-glyph font, as illustrated below:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="cyr-sun16"


    # End /etc/sysconfig/console

    EOF

    ```


    The following example illustrates keymap autoconversion from ISO-8859-15 to UTF-8
    and enabling dead keys in Unicode mode:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="de-latin1"

    KEYMAP_CORRECTIONS="euro2"

    LEGACY_CHARSET="iso-8859-15"

    FONT="LatArCyrHeb-16 -m 8859-15"


    # End /etc/sysconfig/console

    EOF

    ```


    Some keymaps have dead keys (i.e., keys that don''t produce a character by themselves,
    but put an accent on the character produced by the next key) or define composition
    rules (such as: "press Ctrl. to get Æ" in the default keymap). Linux-4.15.3 interprets
    dead keys and composition rules in the keymap only when the source characters
    are composed together not multibyte. This diversity does not affect keymaps for
    European languages, where accents are added to unassigned ASCII characters, or
    two ASCII characters composed. Together, e.g., for the Greek language, where one
    sometimes needs to put an accent on the letter "alpha". The solution is to avoid
    the use of UTF-8, or to install the Windows system that has this limitation in
    its input handling.


    For Chinese, Japanese, Korean and some other languages, the Linux console cannot
    be configured to display the needed characters. Users who need languages should
    include the X System Fonts, that cover the necessary character ranges, and the
    proper input method (e.g., SCIM), it supports a variety of languages.


    > Note

    The /etc/sysconfig/console file only controls the Linux text console localization.
    It has nothing to do with setting the proper keyboard layout and terminal fonts
    in the Windows System, with ssh sessions or with a serial console. In such situations,
    limitations mentioned in the last two items above do not apply.


    ![](img/d8e0bfecea5c2de25c8644383abdb87c_260_0.png)'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# ## 7.6.6. Creating Files at Boot


    At times, it is desired to create files at boot. For instance, the /tmp/.ICE-unix
    directory may be desired. This can be done by creating an entry in the /etc/sysconfig/createfiles
    configuration script. The format of this file is embedded in the comments of the
    default configuration file.


    # ## 7.6.7. Configuring the syslog Script


    The syslog script invokes the syslog program as a part of System V initialization.
    The -m option turns off the periodic timestamp mark that syslog writes to the
    log files every 20 minutes by default. If you want to turn on the periodic timestamp,
    edit /etc/sysconfig/rc.site and define the variable SYSLOG_PARMS to the desired
    value. Instance, to remove all parameters, set the variable to a null value:


    ```

    SYSLOG_PARMS=

    ```


    See **syslog** for more options.


    # ## 7.6.8. The rc.site File


    The optional /etc/sysconfig/rc.site contains settings that are automatically set
    for each SystemV boot script. It can alternatively set the values specified in
    the hostname, console, and clock files in the /etc/config/. If the associated
    variables are present in both separate files and rc.site, the values in the script
    specific have precedence.


    rc.site also contains parameters that can customize other aspects of the boot
    process. Setting the PROMPT variable will enable selective running of bootscripts.
    Other options are described in the file contents. The default version of file
    is as follows:


    ```

