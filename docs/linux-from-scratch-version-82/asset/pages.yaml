- img_proc: true
  md: '# Linux From Scratch - Version 8.2


    +   The temporary libraries are cross-compiled. Because a cross-compiler by its
    nature cannot rely on anything from its system, this method removes potential
    contamination of the target system by lessening the chance of headers or libraries
    from the host being incorporated into the new tools. Cross-compilation also allows
    for the possibility of building both 32-bit and 64-bit libraries on 64-bit capable
    hardware.


    +   Careful manipulation of the GCC source will tell the compiler which target
    dynamic linker will be used.


    Binutils is installed first because the configure run of both GCC and Glibc perform
    various features on the assembler and linker to determine which software features
    to enable or disable. This is more important than one first realize. An improperly
    configured GCC or Glibc can succeed in a subtly broken tool, where the impact
    of such breakage might not show up until the end of the build of an entire distribution.
    A test suite will highlight this before too much additional work is performed.


    Binutils installs assembler and linker in two locations: /tools/bin and /tools/$L_TGT/.
    The tools in one location are harder than the other. An important factor of the
    linker is its search order. Detailed information can be obtained from ld by passing
    the --verbose flag. For example, ld --verbose | grep SEARCH will illustrate the
    current paths and their order. It shows which files are linked by ld by compiling
    a dummy program and passing the --verbose switch to the linker. For example, gcc
    dummy.c -Wl,--verbose 2>&1 | grep succeeded will show all the files successfully
    opened during the linking.


    The next package installed is GCC. An example of what can be seen during its run
    of configure is:


    ```

    checking assembler to use... /tools/i686-lfs-linux-gnu/bin/as

    checking linker to use... /tools/i686-lfs-linux-gnu/bin/ld

    ```


    This is for the reasons mentioned above. It also demonstrates that GCC''s configure
    script does not the PATH directories to which to use. During the actual operation
    of gcc itself, the same search paths are not necessarily used. If you want to
    find which linker to use, run: gcc --print-program-name ld


    Detailed information can be obtained from gcc by using the -v command line option
    while compiling a dummy program. For example, gcc -v dummy will show detailed
    information about the preprocessor, compiler, and assembly stages, including gcc''s
    included search paths and their order.


    Next installed are sanitized Linux APIs. The standard C library (libc) to interface
    with features the compiler, linker, and kernel headers. The compiler is not generally
    one since Glibc will always use the compiler relating to the --host parameter
    to its configure script; e.g. in our case, the compiler is i686-lfs-linux-gnu-gcc.
    The linker and kernel headers can be a bit complicated. Therefore, this takes
    risks and the use of a configure switches to enforce the correct selections. After
    check the contents of the configure.make file in the gcc-build directory for CC="i686-lfs-linux-gcc"
    to check which binary are used and the use of the --nostdinc and -system flags
    to control the compiler''s search path. These items highlight an important aspect
    of the G package—it is very self-sufficient in terms of its build machinery and
    generally does not rely on toolchains.


    During the second pass of Binutils, we are able to utilize the --with-lib-path
    configure switch to control ld''s search path.


    For the second pass of GCC, its sources also need to be modified to tell GCC to
    use the new dynamic linker. To do so will result in the GCC programs themselves
    having the name of the dynamic linker from the host system''s lib embedded into
    them, which would defeat the goal of getting away from the host. From this point
    out, the toolchain is self-contained and self-hosted. The remainder of the Chapter
    5 packages will all build against the new Glibc in /tools.


    36'
