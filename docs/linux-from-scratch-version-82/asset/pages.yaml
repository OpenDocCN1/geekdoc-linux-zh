    # # 7.7. The Bash Startup Files


    The shell program /bin/bash (referred to as "the shell") uses a collection of
    setup files to create an environment to run in. Each file has its own use and
    may affect login and interactive environments. Differently the files in /etc directory
    provide global settings. If an equivalent file exists in the home directory, it
    may override the global settings.


    An interactive login shell is started after a successful login, using /bin/login,
    reading the /etc/passwd file. An interactive non-login shell is started at the
    command-line (e.g., [prompt]#bin/bash). A non-interactive shell is usually present
    when a script is running. It is non-interactive because it is processing a script
    and not waiting for user input under commands.


    For more, see info bash under the Bash Startup Files and Interactive Sections.


    The files /etc/profile and ~/.bash_profile are read when the shell is invoked
    as an interactive login shell. The base /etc/profile below sets some environment
    variables necessary for native language support. Setting them results in:


    +   - The output of programs translated into the native language

    - Correct classification of characters into letters, digits and other classes.
    This is necessary for bash to accept non-ASCII characters in command line in non-English
    locales

    - The correct alphabetical order for the country

    - Appropriate paper size

    - Correct formatting of monetary, time, and date values


    Replace <LL> with the two-letter code for the desired language (e.g., "en") and
    the two-letter code for the appropriate country (e.g., "GB\). <charm> should be
    replaced with the canonical charset for your chosen locale. Optional modifiers
    as "@euro" may also be present.

    The list of all locales supported by Glibc can be obtained by running the following
    command:


    ```

    locale -a

    ```


    Charmaps can have a number of aliases, e.g., "ISO-8859-1" is also referred to
    as "iso8859-1" and "iso88591". Some applications cannot handle the various synonyms
    correctly, they require that "UTF-8" is used as "UTF-8", not "utf8", so it is
    safest in most cases to choose the canonical name for a particular locale. To
    determine the canonical name, run the following command, where <locale name> is
    the output given by locale -a for your preferred locale ("en_GB.iso88591 in our
    example).


    ```

    LC_ALL=<locale name> locale charmap

    ```


