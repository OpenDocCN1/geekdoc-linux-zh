  md: "Install the GRUB files into /boot/grub and set up the boot track:\n\n# Warning\n\
    \nThe following command will overwrite the current boot loader. Do not run the\
    \ command if this is not desired, for example, using a third party boot manager\
    \ to manage the Master Boot Record (MBR).\n\n```\ngrub-install /dev/sda\n```\n\
    \n# 8.4.4. Creating the GRUB Configuration File\n\nGenerate /boot/grub/grub.cfg:\n\
    \n```\ncat > /boot/grub/grub.cfg << \"EOF\"\n# Begin /boot/grub/grub.cfg\nset\
    \ default=0\nset timeout=5\n\ninsmod ext2\nset root=(hd0,2)\n\nmenuentry \"GNU/Linux,\
    \ Linux 4.15.3-lfs-8.2\" {\n    linux /boot/vmlinuz-4.15.3-lfs-8.2 root=/dev/sda2\
    \ ro\n}\nEOF\n```\n\n# Note\n\nFrom GRUB's perspective, the kernel files are relative\
    \ to the partition used. If you use a separate /boot partition, remove /boot from\
    \ the above linux line. You will also need to change the set root line to point\
    \ to the boot partition.\n\nGRUB is an extremely powerful program and it provides\
    \ a tremendous number of options for booting from a wide variety of devices, operating\
    \ systems, and partition types. There are also many options for customization\
    \ such as graphical splash screens, playing sounds, mouse input, etc. The details\
    \ of these options are beyond the scope of this introduction.\n\n# Caution\n\n\
    There is a command, grub-mkconfig, that can write a configuration file automatically.\
    \ It uses a set of scripts in /etc/grub.d/ and will destroy any customizations\
    \ that you make. These scripts are designed primarily for non-source distributions\
    \ and are not recommended for LFS. If you install a Linux distribution, there\
    \ is a good chance that this program will be run. Be sure to back up your grub.cfg\
    \ file."
  merge: -1
