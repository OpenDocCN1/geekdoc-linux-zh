  md: '# 6.10. Adjusting the Toolchain


    Now that the final C libraries have been installed, it is time to adjust the toolchain
    so that it will link any newly compiled program against these.


    First, back up the /tools linker and replace it with the adjusted linker we made
    in chapter 5. We''ll also create a link to its counterpart in /tools/$(uname -m)-pc-linux-gnu/bin:


    ```

    mv -v /tools/bin/{ld,ld-old}

    mv -v /tools/$(uname -m)-pc-linux-gnu/bin/{ld,ld-old}

    mv -v /tools/bin/ld-new,ld

    ln -sv /tools/bin/ld /tools/$(uname -m)-pc-linux-gnu/bin

    ```


    Next, add the GCC spec file so it points to the new dynamic linker. Simple deleting
    all instances of "tools" should leave with the correct path to the dynamic linker.
    Also adjust the spec file so that gcc knows where find the correct headers and
    Glibc parts. A sed command accomplishes this:


    ```

    gcc -dumpspec | sed -e ''^@tools@$g'' \

    -e ''^@startfile_prefix_spec;/(n;s@*//usr/lib/@'' \

    -e ''^@cpp/(n;s@@-system /usr/include/@'' \

    -dinarame $(gcc --print-libgcc-file-name)''/specs

    ```


    It is a good idea to inspect the spec file to verify the intended change has actually
    made.

    It is imperative to ensure that the basic functions (compiling and linking) of
    the adjusted toolchain are working as expected. To do this, perform the following
    sanity checks:


    ```

    echo ''int main()'' > dummy.c

    cc dummy.c -v -Wl,--verbose &> dummy.c

    readelf -l a out | grep '': /lib''

    ```


    There be no errors, and the output of the last command will be (allowing for platform-specific
    differences in dynamic linker name):


    ```

    [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]

    ```


    Note on 64-bit systems /lib is the location of our dynamic linker, but is accessed
    via a symbolic link in lib64.


    > Note

    On32-bit sure the interpreter should be /lib/ld-linux.so.2.


    Now make sure you''re set up to use the correct starts:


    ```

    grep -o ''/usr/lib.*/crt[lin].*succeeded'' dummy.c

    ```


    The output of the last command should be:


    ```

    /usr/lib/../../crt1.o succeeded

    /usr/lib/../../crt.o succeeded

    /usr/lib/../../crtn.o succeeded

    ```'
