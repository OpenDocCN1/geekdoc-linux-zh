  md: '# 5.7. Glibc-2.27


    The Glib package contains the main C library. This library provides the basic
    routines for allocating memory, searching directories, opening and closing files,
    reading and writing files, string handling, pattern matching, arithmetic, and
    so on.


    **Approximate build time:** 4.3 SBU

    **Required disk space:** 823 MB


    # 5.7.1. Installation of Glibc


    The Glibc documentation recommends building Glibc in a dedicated build directory:


    ```

    mkdir -v build

    cd build

    ```


    Next, prepare Glibc for compilation:


    ```

    ../configure \

    --prefix=$LFS_TGT \

    --host=$LFS_TGT \

    --build=$(../scripts/config.guess) \

    --enable-kernel=3.2 \

    --with-headers=/tools/include \

    libc_cv_forced_unwind=yes \

    libc_cv_c_cleanup=yes

    ```


    The meaning of the following options:


    ```

    --host=$LFS_TGT, --build=$(../scripts/config.guess)

    ```


    The combined effect of these switches is that Glibc''s build system configures
    itself to cross-compile, using the cross-linker and cross-compiler in /tools.


    ```

    --enable-kernel=3.2

    ```


    This tells Glib to compile the library with support for 3.2 and later Linux kernels.
    Workarounds for older kernels are not enabled.


    ```

    --with-headers=/tools/include

    ```


    This tells Glib to compile itself against the headers recently installed to the
    tools directory, so that it knows exactly what features the kernel has and can
    optimize itself.


    ```

    libc_cv_forced_unwind=yes

    ```


    The linker installed during Section 5.4, "Binutils-2.30" was cross-compiled and
    cannot be used until Glib has been installed. The libc_cv_forced_unwind=yes variable
    is passed in order to inform that force-unwind support is available without having
    it run the test.


    ```

    libc_cv_c_cleanup=yes

    ```


    Similarly, we pass libc_cv_c_cleanup=yes through the configure script that the
    test is skipped and C cleanup handling is supported.'
