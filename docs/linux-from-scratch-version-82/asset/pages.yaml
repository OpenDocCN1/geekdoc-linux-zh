  md: '# 5.9. Binutils-2.30 - Pass 2


    The Binutils package contains a linker, an assembler, and other tools for handling
    object files.


    Approximate build time: 1.1 SBU

    Required disk space: 574 MB


    # 5.9.1. Installation of Binutils


    Create a separate build directory again:


    ```

    mkdir -v build

    cd build

    ```


    Prepare Binutils for compilation:


    ```

    CC=$LS_TGT-gcc

    AR=$LS_TGT-ar

    RANLIB=$LS_TGT-ranlib

    ../configure

    --prefix=/tools

    --disable-nls

    --disable-error

    --with-lib-path=/tools/lib

    --with-sysroot

    ```


    The meaning of the new configure options:


    CC=$LS_TGT-gcc AR=$LS_TGT-ar RANLIB=$LS_TGT-ranlib

    Because this is a really build of Binutils, setting these variables ensures that
    the build system uses the cross-compiler and assembler instead of the ones on
    the host system.


    --with-lib-path=/tools/lib

    Tells the configure script to specify the library search path during the compilation
    of Binutils, resulting in /tools/lib being passed to the linker. This prevents
    the linker from searching through library directories on the host.


    --with-sysroot

    The sysroot feature enables the linker to find shared objects which are required
    by other shared objects explicitly included in the linker''s command line. Without
    this, some packages may not build successfully on some hosts.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    Now prepare the linker for the “Re-adjusting” phase in the next chapter:


    ```

    make -C 1 ld clean

    make -C 1 ld LIB_PATH=/usr/lib:/lib

    cp -v ld/ld-new /tools/bin

    ```'
