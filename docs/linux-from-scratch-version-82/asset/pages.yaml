  md: '# Caution


    If the system has a separate /boot partition, the files copied below should go
    there. The easiest way to do that is to bind /boot on the host (outside chroot)
    to /mnt/lfs/boot before proceeding. The root user in the host system:


    ```

    mount --bind /boot /mnt/lfs/boot

    ```


    The path to the kernel may vary depending on the partition being used. The filename
    below can be changed to suit your case, but the stem of the kernel file should
    be vmlinuz with the automatic setup of the boot process described in the next
    section. The following command assumes an x86 architecture:


    ```

    cp -iv arch/x86/boot/bzImage /boot/vmlinuz-4.15.3-lfs-8.2

    ```


    System.map is a symbol file for the kernel. It contains the entry points of every
    function in the kernel API, as well as the addresses of the kernel data structures
    for the running kernel. It is used as a resource when investigating kernel problems.
    Issue the following command to install the map:


    ```

    cp -iv System.map /boot/System.map-4.15.3

    ```


    The configuration file .config produced by the make menuconfig step above contains
    all the configuration selections for the kernel that was compiled. It is a good
    idea to keep this file for future reference:


    ```

    cp -iv .config /boot/config-4.15.3

    ```


    Install the documentation for the Linux kernel:


    ```

    install -d /usr/share/doc/linux-4.15.3

    cp -r Documentation/* /usr/share/doc/linux-4.15.3

    ```


    It is important to note that the files in the kernel source directory are not
    owned by root. Whenever a package is unpacked as root user (which we did inside
    chroot), the files have the user and group IDs of whatever they were on the packager''s
    computer. This is not a problem for any other package to be installed because
    the source tree is removed after the installation. However, the Linux source tree
    is often retained for a long time. Because of this, there is a chance that whatever
    user ID used will be assigned to somebody on the machine. That person would then
    have write access to the kernel source.


    # Note


    +   - In many cases, the configuration of the kernel will need to be updated for
    packages that will be installed later in BLFS. Unlike other packages, it is not
    necessary to remove the kernel source tree after the newly built kernel is installed.

    - If the kernel source tree is going to be retained, run chown -R 0:0 on the linux-4.15.3
    directory to ensure all files are owned by user root.


    # Warning


    Some kernel documentation recommends creating a symlink from /usr/src/linux pointing
    to the kernel source directory. This is specific to kernels prior to the 2.6 series
    and must not be created on an LFS system as it can cause problems for packages
    you may wish to build once your base LFS system is complete.'
