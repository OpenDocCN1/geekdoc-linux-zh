  md: "# 56. Coreutils-8.29\n\nThe Coreutils package contains utilities for showing\
    \ and setting the basic system characteristics.\nApproximate build time: 3.3 SBU\n\
    Required disk space: 179 MB\n\n# 6.56.1. Installation of Coreutils\n\nPOSIX requires\
    \ that programs from Coreutils recognize character boundaries correctly even in\
    \ multibyte locals. The following patch fixes this non-compliance and other internationalization-related\
    \ bugs.\n\n```\npatch -Npl1 -i ../coreutils-8.29-i18n-1.patch\n```\n\n> In the\
    \ past, many bugs were found in this patch. When reporting new bugs to Coreutils\
    \ maintainers, please check first if they are reproducible without this patch.\n\
    \nSuppress a test lock on which some may loop forever:\n\n```\nsed -i '/test.lock/s/^/#/'\
    \ gnulib-tests/gnulib\n```\n\nNow prepare Coreutils for compilation:\n\n```\n\
    FORCE_UNSAFE_CONFIGURE=1 ./configure \\\n  --prefix=/usr \\\\  --enable-no-install-program=kill,\
    \ uptime\n```\n\nThe meaning of the configure options:\n\nFORCE_UNSAFE_CONFIGURE=1\n\
    This environment variable allows the package to be built as the root user.\n\n\
    --enable-no-install-program=kill, uptime\nThe purpose of this switch is to prevent\
    \ Coreutils from installing binaries that will be installed by other packagesnlater.\n\
    \nCompile the package:\n\n```\nFORCE_UNSAFE_CONFIGURE=1 make\n```\n\nSkip down\
    \ to \"Install the package\" if not running the test suite.\n\nNow the test suite\
    \ is ready to be first. Run the tests that are meant to be run as user root:\n\
    \n```\nmake NON_ROOT_USERNAME=nobody check-root\n```\n\nWe're going to run the\
    \ remainder of the tests as the nobody user. Certain tests, however, require the\
    \ user to be a member of more than one group. So that tests are not-skipped we'll\
    \ add a temporary group and make the user nobody part of it:\n\n```\necho \"dummy:x:1000:nobody\"\
    \ >> /etc/group\n```"
