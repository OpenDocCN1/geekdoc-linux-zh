    ```\n\nPrepare Vim for compilation:\n\n```\n./configure --prefix=/usr\n```\n\n\
    Compile the package:\n\n```\nmake\n```\n\nTo test the results, issue:\n\n```\n\
    make -j1 test > vim-test.log\n```\n\nThe test suite outputs a log of binary data\
