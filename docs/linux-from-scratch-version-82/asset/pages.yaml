  md: '# Linux From Scratch - Version 8.2


    Because is not always enough Random Access Memory (RAM) for compilation processes,
    it is a good idea to use a small disk partition as swap space. This is used by
    the kernel to seldom-used data and leave more memory available for active processes.
    The swap partition for an LFS system can be the same as the one used by the host
    system, in which case it is not necessary to create another.


    Start a partitioning program as cfdisk or fdisk with a command line option naming
    the hard disk on the new partition will be created—for example /dev/sda for the
    primary Integrated Drive Electronics (IDE) device. Create a Linux partition and
    a swap partition, if needed. Please refer to cfdisk (8) or fdisk (8) if you do
    not know how to use.


    > Note


    For experienced users, other partitioning schemes are possible. The LFS system
    can be on a software RAID array or an LVM logical volume. However, some of these
    options require an intransifs, which is an advanced topic. These partitioning
    methodologies are not recommended for first time LFS users.


    Remember the designation of the new partition (e.g., sda5). This book will refer
    to the LFS partition. Remember the designation of the swap partition. These names
    will be needed later for the /etc/fstab file.


    # ## 2.4.1. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing
    lists. This is a highly subjective topic. The default for most distributions is
    to use the entire drive with the exception of one small swap partition. This is
    not optimal for LFS for several reasons. It reduces flexibility, makes sharing
    of data across multiple distributions or LFS builds more difficult, makes backups
    more time consuming, and can waste disk space through inefficient allocation of
    file system structures.


    # ### 2.4.1.1. The Root Partition


    A LFS partition (not to be confused with the /root directory) of ten gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    many of BLFS, but is small enough that many partitions can be created for experimentation.


    # ### 2.4.1.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the amount of physical RAM, however
    this is rarely needed. If disk space is limited, hold the swap partition to two
    gigabytes and monitor the activity of swapping.


    Swapping is never good. You can generally tell if a system is swapping by just
    listening to disk activity and observing how the system reacts. The first reaction
    to swapping should be checked for an unreasonable reason trying to fix a five
    gigabyte file. If swapping becomes a normal occurrence, the best solution is to
    purchase more RAM for your system.


    # ### 2.4.1.3. The Grub Bios Partition


    If the boot disk has been partitioned with a GUID Partition Table (GPT), then
    a small, typically 1 MB, partition must be created if it does not already exist.
    This partition is not formatted, but must be available for GRUB using installation
    of the boot loader. This partition will normally be labeled ''BIOS Boot'' if using
    fdisk or have a code of EF02 if using gdisk.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Note


    The Grub Bios partition must be on the drive that the BIOS uses to boot the system.
    This is not necessarily the same drive where the LFS root partition is located.
    Disks on a system may use different partition table types. The requirement for
    this partition depends only on the partition type of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are several partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but is meant
    as a guide.


    +   * **/boot** – Highly recommended. Use this partition to store kernels and
    other booting information. To minimize potential boot problems with larger disks,
    make this the first partition on your first disk drive. A partition size of 100
    megabytes is quite adequate.


    +   * **/home** – Highly recommended. Share your home directory and user customization
    across multiple distributions or LFS builds. The size is generally large and depends
    on available disk space.


    +   * **/usr** – A separate /partition is generally used if providing a server
    for a client or diskless workstation. It is not normally needed for LFS. A size
    of five gigabytes will handle most installations.


    +   * **/opt** – This directory is most useful for LFS where multiple installations
    of packages like Gnome or KDE can be installed without embedding the files in
    the /usr hierarchy. If, 5 to 10 gigabytes is generally adequate.


    +   * **/tmp** – A separate /tmp directory is rare, but useful if configuring
    a client disk. This partition, if used, will not need to exceed a couple of gigabytes.


    +   * **/src** – This partition is very useful for providing a location to store
    LFS sources and share them across LFS builds. It can also be used as a location
    for building LFS packages. A reasonably large partition of 30-50 gigabytes allows
    plenty of room.


    Any partition that you want automatically mounted upon boot needs to be specified
    in the /etc/fstab. Details about how specify partitions will be discussed in Section
    8.2, “Creating the /etc/fstab".


    # 2.5. Creating a File System on the Partition


    Now that a blank partition has been set up, the file system can be created. LFS
    can use any file system recognized by the Linux kernel, and the most common types
    are ext3 and ext4. The choice of file system can be complex and depends on the
    characteristics of the file and size of the partition. For example:


    ext2

    is suitable for small partitions that are updated infrequently such as /boot.


    ext3

    is an upgrade to ext2 that includes a journal to help recover the partition’s
    status in the case of an unclean shutdown.

    It is commonly used as a general purpose file system.


    ext4

    is the latest version of the ext file system of partition types. It provides several
    new capabilities including nanosecond-timestamps, creation and use of very large
    files (16 TB), and speed improvements.


    Other file systems, including FAT32, NTFS, ReiserFS, JFS, and XFS are useful for
    specialized purposes. More information about these file systems can be found at
    http://en.wikipedia.org/wiki/Comparison_of_file_systems.'
  merge: -1
