    # 8.3.2. Configuring Linux Module Load Order


    Most of time Linux modules are loaded automatically, but sometimes it needs some
    specific direction. The program

    that loads modules, *modprobe* or *insmod*, uses /etc/modprobe.d/usb.conf for
    this purpose. This file needs

    to be created so that the usb drivers (ehci_hcd, ohci_hcd and uhci_hcd) have been
    loaded as modules, by which order

    too be loaded prior to ohci_hcd and uhci_hcd to avoid a warning

    ending at boot time.


    Create a new file /etc/modprobe.d/usb.conf by running the following:


    ```

    install -v -m755 -d /etc/modprobe.d

    cat /etc/modprobe.d/usb.conf << "EOF"

    # Begin /etc/modprobe.d/usb.conf


    install ohci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe ohci_hcd ; true

    install uhci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe uhci_hcd ; true


    # End /etc/modprobe.d/usb.conf

    EOF```

