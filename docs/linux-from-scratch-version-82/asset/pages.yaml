  md: '# 6.5. Creating Directories


    It is time to create some structure in the TFS file system. Create a standard
    directory tree by issuing the

    commands:


    ```

    mkdir -pv /{bin,boot,etc/{opt,sysconfig},home,lib/firmware,mnt,opt}

    mkdir -pv /media/{floppy,cdrom},sbin,srv,var

    install -dv -m 0750 /root

    install -dv -m 1777 /tmp /var/tmp

    mdir -pv /usr/{local/}bin,include,lib,sbin,src

    mkdir -pv /usr/{local/}share/{color,dict,doc,info,locale}

    mkdir -v /usr/{local/}share/{misc,terminfo,zoneinfo}

    mkdir -v /usr/libxec

    mkdir -pv /usr/{local/}share/man{1..}


    case $(uname) -m in

    x86_64 mkdir -v /lib64 ;;

    esac

    ```


    ```

    mkdir -v /var/{log,mail,spool}

    ln -sv /run /var/run

    ln -sv /run/lock /var/lock

    mkdir -pv /var/{opt,cache,lib/{color,misc,locate},local

    ```


    Directories are, by default, created with permission 755, which is not desirable
    for all directories. In the\commands above, two changes are made—one to home to
    the home directory of root, and to the directories for

    temporary files.


    The first change ensures that nobody can enter the /root directory—the same as
    a normal user would

    do his or her home directory. The second change makes sure that any user can write
    to the /tmp and /var/

    t directories, but cannot remove another''s files from them. The latter is prohibited
    by the so-called "sticky bit"

    the highest bit (1) in the 177 bit mark.


    # 6.5.1 FHS Compliance Note


    The directory tree is based on the Filesystem Hierarchy Standard (FHS) (available
    at https://wiki.linuxfoundation.org/

    en/FHS). The FHS also specifies the optional existence of such directories as
    /usr/local/games and /usr/

    share/games. We create only the directories that need. However, feel free to create
    these directories.


    # 6.6. Creating Essential Files and Symlinks


    Some programs use hard-wired paths to programs which do not exist. In order to
    satisfy these programs, create a

