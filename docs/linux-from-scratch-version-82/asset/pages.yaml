  md: '# The meaning of the zic commands:


    ```

    zic -L /dev/null ...

    ```


    This creates posix time zones, without any leap seconds. It is conventional to
    put these in both zoneinfo and zoneinfo/posix. It is necessary to put the POSIX
    time zones in zoneinfo, otherwise various test-suites will report errors. On an
    embedded system, where space is tight and you do not intend to ever update the
    time zones, you could save 1MB by not using the posix directory, but some applications
    or test-suites might produce some failures.


    ```

    zic -leapseconds ...

    ```


    This creates time zones, including leap seconds. On an embedded system, where
    space is tight and you do not intend to ever update the time zones, or care about
    the correct time, you could save 1MB by omitting the right directory.


    ```

    zic --P ...

    ```


    This creates the posixrules file. We use New York because POSIX requires the daylight
    savings time rules to be in accordance with US rules.


    One way to determine the local time zone is to run the following script:


    ```

    tzselect

    ```


    After answering a few questions about the location, the script will output the
    name of the time zone (e.g., America/Edmonton). There are also some possible time
    zones listed in /usr/share/zoneinfo such as Canada/Eastern or EST5TED that are
    not identified by the script but can use.


    Then create the /etc/localtime file by running:


    ```

    cp -v /usr/share/zoneinfo/<xxx> /etc/localtime

    ```


    Replace <xxx> with the name of the time zone selected (e.g., Canada/Eastern).


    # 6.9.2.3. Configuring the Dynamic Loader


    By default, the dynamic loader (/lib/ld-linux.so.2) searches through /lib and
    /usr/lib for dynamic libraries that are needed by programs as they run. However,
    if there are libraries in directories other than /lib and /usr/lib, these need
    to be added to the /etc/ld.so.conf file in order for the dynamic loader to find
    them. Two directories are commonly known to contain additional libraries are /usr/local/lib
    and /opt/lib, so add those directories to the dynamic loader''s search path.


    Create a new /etc/ld.so.conf by running the following:


    ```

    cat /etc/ld.so.conf << "EOF"

    # Begin /etc/ld.so.conf

    /usr/local/lib

    /opt/lib


    EOF

    ```'
