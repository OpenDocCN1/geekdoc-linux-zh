    \ /etc/sysconfig/network-devices/services. Within each section, the files are\
    \ listed in the order they are normally called.\n\n# ## D.1. /etc/rc.d/init.d/rc\n\
    \nThe rc script is the first script called by init and initiates the boot process.\n\
    \n```\n#!/bin/bash\n################################################################################\n\
