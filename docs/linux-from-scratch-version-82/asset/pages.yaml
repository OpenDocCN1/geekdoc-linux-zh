  md: '# Preface


    # Foreword


    My journey to learn and understand Linux began over a decade ago, back in 1998.
    I had just installed my first Linux distribution and had quickly become intrigued
    by the whole concept and philosophy behind Linux.


    There are many ways to accomplish a single task. The same can be said about Linux
    distributions. A great many have existed over the years. Some still, some have
    morphed into something else, yet others have been relegated to our memories. They
    all do things differently to suit the needs of their target audience. Because
    so many ways to accomplish the same goal exist, I realize to no longer have been
    limited by any implementation. Prior to discovering Linux, we simply put up with
    using other Operating Systems as we had no choice. What was it, whether you liked
    it or not. With Linux, the concept of choice began to emerge. If you didn''t like
    something you were free, encouraged to change it.


    I tried a number of distributions and could not decide on any one. They were great
    systems in their own right. It was a matter of right and wrong anymore. It became
    a matter of personal taste. With all that available, it became apparent that there
    would not be a single system that would be perfect for me. So I set out to create
    my own system that would fully follow my personal preferences.


    To make it mine, I resolved to compile everything from source code instead of
    using pre-compiled binary packages. This "perfect" Linux system would have the
    strengths of various systems without their perceived weaknesses. The idea was
    rather daunting. I remained committed to the idea that a system could be built.
    After sorting issues such as circular dependencies and compile-time errors, I
    finally built a custom-built Linux system. It was fully operational and perfectly
    usable like any of the other systems out there. But the it was my own creation.
    It was very satisfying to have put together such a system as mine. The only thing
    better would have to create each piece of software myself. This was the next best
    thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that such custom-built Linux systems serve not only to meet specific
    requirements, but also serve as an ideal learning opportunity for programmers
    and system administrators to enhance their (existing) Linux skills. Out of this
    broadened, the Linux From Scratch Project was born.


    This Linux From Scratch is the core project that. It provides the background and
    instructions necessary for you to design and build your own system. This book
    provides a template that will result in a correctly working system, you are free
    to alter the instructions to yourself, which is in, an important part of this
    project. You remain in control; we just lend a hand to get you started on your
    own journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours.


    ```

    --nGerald Beemans

    gerard@linuxfromscratch.org

    ```


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people raise, "why go through all the hassle of manually building a Linux
    system from scratch when you can just download and install an existing one?"'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Linux From Scratch - Version 8.2


    One important reason for this project''s existence is to help you learn how Linux
    system works from the inside out. Building an LFS system demonstrates what makes
    Linux experience, and how things work together and depend on each other. One of
    the best things that this learning experience can provide is the ability to customize
    a Linux system to suit your unique needs.


    Another key of LFS is that it allows you to have more control over the system
    without relying on someone else''s Linux implementation. With LFS, you are in
    the driver''s seat and dictate every aspect of the system.


    LFS allows you to create custom Linux systems. When installing regular distributions,
    you are often forced to install a many programs which are never used or understood.
    These wastes resources. You may argue that with today''s hard drive and CPUs,
    such resources are no longer a consideration. however, you are still constrained
    by size considerations if thinking nothing. About bootable CDs, USB sticks, and
    embedded systems. Those are areas where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit everything and apply
    all the security patches desired. It is no longer to wait for somebody else to
    compile binary binaries that fix a security hole. Unless you examine the path
    and implement yourself, you have no guarantee that the new binary was built correctly
    and adequately fixes the problem.


    The goal of Linux From Scratch is to build a complete and foundation-level system.
    If you do not wish to build your own system from scratch, you will nevertheless
    benefit from the information in this book.


    There are too many other reasons to build your own LFS system to list them all.
    In the end, is by far the most powerful of reasons. As you continue in your LFS
    experience, you will discover the power that information and knowledge truly bring.


    # LFS Target Architectures


    The primary architectures of LFS are the AMD/Intel x86 (32-bit) and x86_64 (64-bit)
    CPUs. On the other hand, the instructions in this book are also known to work,
    with some modifications, with the Power PC and ARM CPUs. To build a system that
    utilizes one of these CPUs, the main prerequisite, in addition to those the next
    few pages, is an existing Linux system such as an LFS installation, Ubuntu, Red
    Hat/Fedora, SuSE, or other distribution that targets the architecture that you
    have. Note also that a 32-bit can be installed and used as a host system on a
    64-bit AMD/Intel computer.


    Some other facts about 64-bit systems needs to be added here. When compared to
    a 32-bit system, the size of executable programs are significantly larger and
    the execution speeds of arbitrary programs are only slightly faster. For example,
    in a test of LFS-64-5 on a Dual CPU based system, the following statistics were
    measured:


    | Architecture | Build Time | Build Size |

    |---|---|---|n| 32-bit | 198.5 minutes | 648 MB |

    | 64-bit | 190.6 minutes | 709 MB |


    As you can see, the 64-bit build is only 4% faster and 9% larger than the 32-bit
    build. Of course, if you have more than 4GB of RAM or want to manipulate data
    that exceeds 4GB, the advantages of a 64-bit system are substantial.


    > The above discussion is only appropriate when comparing builds on the same hardware.
    Modern 64-bit systems are considerably faster than older 64-bit systems and the
    LFS authors recommend building on a 64-bit system when given a choice.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'The default 64-bit build that results from LFS is considered a "pure" 64-bit
    system. That is, it supports 64-bit executables only. Building a "multi-lib" system
    requires compiling applications twice, once for 32-bit system and once a 64-bit
    system. This is not directly supported in LFS because it would interfere with
    the educational objective of providing the instructions needed for a straightforward
    base Linux system. You can refer to the Cross Linux Scratch project for this advanced
    topic.


    # # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   - POSIX.1-2008.

    - Filesystem Hierarchy Base (FHS) Version 3.0

    - Linux Standard Base (LSB) Version 5.0


    The LSB has four separate sections: Core, Desktop, Runtime Languages, and Imaging.
    In addition to generic requirements there are also architecture specific requirements.
    There are also areas for trial use: Gtk3 and Graphics. LFS attempts to conform
    to the architectures discussed in the previous section.


    > Note Many do not agree with the requirements of the LSB. The main purpose of
    defining it is to ensure that proprietary software will be able to be installed
    and run properly on a compliant system. Since LFS is source based, the user has
    control over what packages are designed and many choose not to install some packages
    that are specified by the LSB.


    Creating a complete LFS system capable of passing the LSB certifications tests
    is possible, but not without many additional packages that are beyond the scope
    of LFS. These additional packages have installation instructions in BLFS.


    # Packages supplied by LFS needed to satisfy the LSB Requirements


    LSB Core: Bash, Bc, Binitutils, Coreutils, Diffutils, File, Findinduts, Gawk,
    Grep, Gzip, M4, Man-DB, Ncurses, Propcs, Psmisc, Sed, Shadow, Tar, Util-linux,
    Zlib


    LSB Desktop: None


    LSB Runtime Languages: Perl


    LSB Imaging: None


    LSB Gtk3 and LSB Graphics (Trial Use): None


    # Packages supplied by BLFS needed to satisfy the LSB Requirements


    LSB Core: At, Cpio, De Feront, Intit-tools, LSB_release, NSPR, NSS, PAM, Pax,
    Sendmail (or Postfix or Exim), time


    LSB Desktop: Alsa, ATK, Cairo, Desktop-file-utils, Freefont, Gdk-pixbuf, Glib2,
    GTK+2, Icon-naming-utils, Libpeg-turbo, Libpng, Libtiff, Libxml2, MesaLib, Pango,
    Qt4, Xdg-utils, Xorg


    LSB Runtime Languages: Python, Libxml2, Libxslt'
