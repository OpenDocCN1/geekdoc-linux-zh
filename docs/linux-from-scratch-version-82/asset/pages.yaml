  md: 'The purpose of each link:


    +   /bin/bash


    Many bash scripts specify /bin/bash.


    +   /bin/cat


    This pathname is hard-coded into Glibc configure script.


    +   /bin/dd


    The path to dd will be hard-coded into the /usr/bin/libtool utility.


    +   /bin/echo


    This is to satisfy one of the tests in Glibc''s test suite, which expects /bin/echo.


    +   /usr/bin/install


    The path to install will be hard-coded into the /usr/lib/bash/Makefile.inc file.


    +   /bin/ln


    The path to ln will be hard-coded into the /usr/lib/perl5/5.26.1/<target-triplet>/Config_heavy.pi.


    +   /bin/pwd


    Some configure scripts, particularly Glibc''s, have this pathname hard-coded.


    +   /bin/rm


    The path to rm will be hard-coded into the /usr/lib/perl5/5.26.1/<target-triplet>/Config_heavy.pi.


    +   /bin/stty


    This pathname is hard-coded into Expect, there it is needed for Binutils and GCC
    test suites to pass.


    +   /usr/bin/perl


    Many Perl scripts code this path to the perl program.


    +   /usr/lib/libgcc_c.so{,.1}


    Glibc needs the pthreads library to use.


    +   /usr/lib/libstdc++{,.6}


    This is needed by several tests in Glibc''s test suite, as well as for C++ support
    in GMP.


    +   /bin/sh


    Many shell scripts hard-code /bin/sh.


