  md: '# 67.4. Man-DB-2.8.1


    The Man-DB package contains programs for finding and viewing man pages.


    Approximate build time: 0.4 SBU

    Required disk space: 31 MB


    # 67.4.1. Installation of Man-db


    Prepare Man-DB for compilation:


    ```

    ./configure --prefix=/usr \

    --doccdir=/usr/share/doc/man-db-2.8.1 \

    --sysconfdir=/etc \

    --disable-setuid \

    --enable-cache-owner=bin \

    --with-browser=/usr/bin/lynx \

    --with-vgrind=/usr/bin/vgrind \

    --with-grap=/usr/bin/grap \

    --with-systemdtfilesdir=

    ```


    The meaning of the configure options:


    +   --disable-setuid

    This disables making the man program setuid to user man.

    --enable-cache-owner=bin

    This makes the system-wide cache files owned by user bin.

    --with-...


    These three parameters are used to set default programs. lynx is a text-based
    browser (see BLFS for installation instructions), vgrind converts programs to
    Groff input, and grap is used for typesetting graphs in Groff documents. The vgrind
    and grap programs are not normally needed for viewing manual pages. They are not
    part of LFS or BLFS, but you should be able to install them after finishing LFS
    if you wish to do so.


    Compile the package:


    ```

    make

    ```


    To test the results:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


