  md: '# 8.4. Using GRUB-v Set Up the Boot Process


    # 8.4.1. Introduction


    > > Warning\> Configuring GRUB incorrectly can render your system inoperable without
    an alternate boot device such as a CD-ROM. This section is not required to boot
    your LFS system. You may just want to modify your current boot loader, e.g. Grub-Legacy,
    GRUB2, or LILO.


    Ensure that an emergency boot disk is ready to "rescue" the computer if it becomes
    unusable (un-bootable). If you do not have a boot device, you can create one.
    In order for the procedure below to work, you need to jump ahead to BLFS and install
    xriso from the lisoliburn package.


    ```

    cd /tmp

    grub-mkrescue --output=grub-img.iso

    xorriso -as cdrecord -v dev=/dev/cdrw blank=as_needed grub-img.iso

    ```


    > > To boot LFS on systems that have UEFI enabled, the kernel nodes need to have
    been built with the CONFIG_EFI_STUB capability described in the previous section.
    However, LFS can be booted GRUB without such an addition. To do this, the UEFI
    Mode and Secure Boot capabilities in the host system''s BIOS need to be turned
    off. For details, see the lfs-defi.txt hint at http://www.linuxfromscratch.com/hints/lfs-defi.txt


    # 8.4.2. GRUB Naming Conventions


    GRUB uses its own naming structure for drives and partitions in the form of (hdn,m)
    where n is the hard drive number and m is the partition number Hard hard drive
    starts from zero, but the partition number starts from one for normal partitions
    and five for extended partitions. Note that this is different from earlier versions
    where both numbers started from zero. For example, partition sda1 (hd0,1) and
    db3 (hd1,3). In contrast, GRUB does not consider CD-ROM drives to be hard drives.
    For example, if using a CD on hdb and a second hard drive on hdc, that second
    hard drive would be (hd2,1).


    # 8.4.3. Setting Up the Configuration


    GRUB works by writing to the first partition of the hard disk. This area is not
    part of any file system. The programs access GRUB modules in the boot partition.
    The default location is /boot/grub.


    The location of the boot partition is a choice of the user that affects the configuration.
    One recommendation is to have a separate (suggested size is 100 MB) partition
    for boot information. That way each build, LFS or some commercial distro, can
    access the same boot files and access from any booted system. If you choose to
    do this you will need to mount the separate partition, move all files in the current
    /boot directory (the linux kernel you installed in the previous section) to the
    new partition. You will then need to unmount the partition and remount it as /boot.
    To do this, be sure to update /etc/fstab.


    Using the lfs partition will also work, but configuration for multiple systems
    is more difficult.


    Using the above information, determine the appropriate design for the root partition
    (or boot partition, if a separate one is used). For the example, it is assumed
    that the root (or separate boot) partition is sda2.'
  merge: -1
