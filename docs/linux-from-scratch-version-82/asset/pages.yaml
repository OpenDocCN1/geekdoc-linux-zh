    \\n\"\n  log_failure_msg \"$MSG\"\n}\n\nlog_info_msg \"Press Enter to continue...\"\
    \nwait_for_user\n} \n```\n\n```\ncheck_script_status() {\n  # $i is set when called\n\
    \  if [ ! -f $i ]; then\n    log_warning_msg \"${i} is not a valid symlink.\"\n\
