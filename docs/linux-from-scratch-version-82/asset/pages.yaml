    Approximate build time: 0.8 SBU

    Required disk space: 66 MB


    # 5.11.1. Installation of Tcl-core


    This package and the next two (Expect and DeJNU) are installed to support running
    the test suites for GCC and Binutils and other packages. Installing three packages
    for testing purposes may seem excessive, but it is very reassuring, if not essential,
    to know that the most important tools are working properly. Even if the suites
    are not run in this chapter (they are not mandatory), these packages are required
    to run the test suites in Chapter 6.


    Note that the version used is a minimal version needed to run the LFS tests. For
    the full package, see the BLFS Tcl procedures.


    Prepare Tcl for compilation:


    ```

    cd unix

    ./configure --prefix=/tools

    ```


    Build the package:


    ```

    make

    ```


    Compilation is now complete. As discussed earlier, running the test suite is not
    mandatory for the temporary tools here in this chapter. To run the Tcl test suite
    anyway, issue the following command:


    ```

    TZ=UTC make test

    ```


    The Tcl test may experience failures under uncertain conditions that are not fully
    understood. Therefore, test failures are not surprising, and not considered critical.
    The TZ=UTC parameter sets the time zone to Coordinated Universal Time (UTC), but
    only for the duration of the test run. This ensures that the clock tests are exercised
    correctly. Details on the TZ environment variable are provided in Chapter 7.


    Install the package:


    ```

    make install

