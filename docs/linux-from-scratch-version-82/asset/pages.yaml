  md: '# # Chapter 4. Final Preparations


    # ## 4.1. Introduction


    In this chapter we will perform a few additional tasks to prepare for building
    the temporary system. We will create a directory in LFS for the installation of
    the temporary tools, and an unprivileged user to reduce risk, and create an appropriate
    build environment for that user. We will also explain the unit of time we use
    to measure how long LFS packages take to build, or "SBUs", and give some information
    about package test suites.


    # ## 4.2. Creating the LFS/tools Directory


    All programs compiled in Chapter 5 will be installed under LFS/tools to keep separate
    from the programs compiled in Chapter 6. The programs compiled here are temporary
    tools and will not be part of the final LFS system. By keeping these programs
    in a separate directory, they can easily be deleted after their use. This prevents
    these programs from ending up in the host production directories (easy to do by
    accident in Chapter 5).


    Create the required directory by running the following as:


    ```

    mkdir -v $LFS/tools

    ```


    The next step is to create a /tools symlink on the host system. This will point
    to the newly-created directory on the LFS partition. Run this command as root
    as well:


    ```

    ln -sv $LFS/tools /

    ```


    > Note

    The above command is correct. The ln command has a few syntactic variations, so
    be sure to check info coreutils ln and ln(1) before reporting what you may think
    is an error.


    The symlink enables the toolchain to be compiled so that it always refers to /tools,
    meaning the compiler, assembler, and linker will work well in Chapter 5 (when
    we are still using some tools from the host) and in the next (when we are "chrooted"
    to the LFS partition).


    # ## 4.3. Adding the LFS User


    When logged in as user root, making a single mistake can damage or destroy a system.
    Therefore, we recommend building the packages in this chapter as an unprivileged
    user. You could use your own user name, to make it easier to set up a clean working
    environment, create a new user lfs as a member of a new group (also named lfs)
    and use this user during the installation process. As root, issue the following
    commands to add the new user:


    ```

    groupadd lfs

    useradd -s /bin/bash -g lfs -m -k /dev/null lfs

    ```


    The meaning of the command line options:


    +   -s /bin/bash

    This makes bash the default shell for user lfs.'
