  md: '[bdubbs] - LFS-8.1 released.


    # # 1.4. Resources


    # ## 1.4.1. FAQ


    If during the building of LFS system you encounter any errors, have any questions,
    or think there is a typo in the book, please start by consulting the Frequently
    Asked Questions (FAQ) that is located at http://www.linuxfromscratch.org/faq.


    # ## 1.4.2. Mailing Lists


    The linuxfromscratch.org server hosts a number of mailing lists used for the development
    of the LFS project. These lists include the main development and support lists,
    among others. If the FAQ does not solve the problem you are having, the next step
    is to search the mailing lists at http://www.linuxfromscratch.org/search.html.

    For information on the lists, how to subscribe, archive locations, and additional
    information, visit http://www.linuxfromscratch.org/mail.html.


    # ## 1.4.3. IRC


    Several members of the LFS community offer assistance on Internet Relay Chat (IRC).
    Before using this support, please make sure that your question is not answered
    in the FAQ or the mailing archives. You can find the IRC network at irc.freenode.net.
    The support channel is named #LFS-support.


    # ## 1.4.4. Mirror Sites


    The LFS project has a number of world-wide mirrors to make accessing the website
    and downloading the required packages convenient. Please visit the LFS website
    at http://www.linuxfromscratch.org/mirrors.html for a list of current mirrors.


    # ## 1.4.5. Contact Information


    Please direct all your questions and comments to one of the LFS mailing lists
    (see above).


    # ## 1.5. Help


    If an issue or question is encountered while working through this book, please
    check the FAQ page at http://www.linuxfromscratch.org/faq/#generalfaq. Questions
    are often already answered there. If your question is not answered on this page,
    try to find the source of the problem. The following hint will give you some guidance
    for troubleshooting: http://www.linuxfromscratch.org/hints/downloads/files/errors.txt.


    We have a wonderful LFS community that is willing to offer assistance through
    the mailing lists and IRC (see Section 1.4, “Resources” of this book). But we
    get several support questions every day and many of them can be easily answered
    by going to the FAQ and searching the mailing lists first. For us to offer the
    best assistance, you need to do research on your own first. That allows us to
    focus on the more unusual support needs. If your searches do not produce a solution,
    please include all relevant information (mentioned below) in your request for
    help.'
