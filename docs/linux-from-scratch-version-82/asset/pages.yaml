- img_proc: true
  md: 'LFS assumes that the root file system (/) is type ext4. To create an ext4 file
    system on the LFS partition, run the following:


    ```

    mkfs -v -t ext4 /dev/<xxx>

    ```


    If you are using an extra swap partition, there is no need to format it. If a
    new swap partition was created, it will need to be initialized with this command:


    ```

    mkswap /dev/<yyy>

    ```


    Replace <yyy> with the name of the swap partition.


    # 2.6 Setting The $LFS Variable


    Throughout this book, the environment variable LFS will be used several times.
    You should ensure that this variable is always defined before the LFS build process.
    It should be set to the name of the directory where you will be building your
    LFS system - we will use /mnt/lfs as an example, the directory choice is up to
    you. If you are building LFS on a separate partition, this directory will be the
    mount point for the partition. Choose a directory location and set the variable
    with the following command:


    ```

    export LFS=/mnt/lfs

    ```


    Having this variable set is beneficial in commands such as mkdir -v $LFS/tools
    can be typed literally. The shell will automatically replace "$LFS" with "mnt/lfs"
    (or whatever the variable was set to) when it processes the command line.


    > Caution

    Do not forget to check that LFS is set whenever you leave and reenter your current
    working environment (such as doing a su to root or another user). Check that the
    LFS variable is set properly with:


    echo $LFS

    Make sure the output shows the path to your LFS system''s build location, which
    is /mnt/lfs if the provided example was followed. If the output is incorrect,
    use the command earlier on this page to set $LFS to the correct directory.


    Note One way to ensure that the LFS variable is always set is to edit the .bash_profile
    in both your personal home directory and in /root/.bash_profile and ensure the
    export command. In addition, the shell specified in the /etc/passwd file for all
    users who need the LFS variables to be needs ensure that the /root/.bash_profile
    is incorporated as part of the login process.

    Another consideration is the method that is to log into the host system. If logging
    in a graphical display manager, the user''s .bash_profile is not normally used
    when a virtual terminal is started. In this case, add the export command to .bashrc
    as some instructions have to run the .bashrc instructions in a non-interactive
    bash invocation. Be sure to add the export command before the test for non-interactive
    use.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# 2.7. Mounting the New Partition


    Now that a file system has been created, the partition needs to be made accessible.
    In order to do this, the partition needs to be mounted at a chosen point. For
    the purposes of this book, it is assumed that the file system is mounted under
    the directory specified by the LFS environment variable as described in the previous
    section.


    Create the mount point and mount the LFS file system by running:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the designation of the LFS partition.


    If using multiple partitions for LFS (e.g., one for / and another for /usr), mount
    them using:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    mdir -v $LFS/dev/<usr>

    mount -v -t ext4 /dev/<yyy> $LFS

    ```


    Replace <xxx> and <yy> with the appropriate partition names.


    Ensure that your new partition is not mounted with permissions that are too restrictive
    (such as the nosuid or nodev options). Run the mount command without any parameters
    to see what options are set for the mounted partition. If nosuid and/or nodev
    are set, the partition will need to be remounted.


    > Warning

    The above instructions assume that you will not be restarting your computer throughout
    the LFS process. If you shut down your system, you will either need to remount
    the LFS partition each time you restart the build process or modify your host
    system''s /etc/fstab file to automatically remount it upon boot. For example:


    /dev/<xxx> /mnt/lfs ext4 defaults 1 1

    If you use additional optional partitions, be sure to add them also.


    If you are using a swap partition, ensure that it is enabled using the swapon
    command:


    ```

    /sbin/swapon -v /dev/<zzz>

    ```


    Replace <zzz> with the name of the swap partition.


    Now that there is an established place to work, it is time to download the packages.'
  merge: -1
