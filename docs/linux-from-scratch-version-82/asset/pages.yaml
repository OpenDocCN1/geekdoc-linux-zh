    ln -sv /tools/bin/{bash,cat,dd,echo,ln,pwd,rm,stty} /bin

    ln -sv /tools/bin/{install,perl} /usr/bin

    ln -sv /tools/lib/libgcc-so,.1} /usr/lib

    ln -sv /tools/lib/libstdc++.a,so,.6}} /usr/lib

    ln -sv bin/sh

