  md: 'Fix some of the permissions so that the non-root user can compile and run the
    tests:


    ```

    chown -Rv nobody

    ```


    Now run the tests. Make sure the PATH in the su environment includes /tools/bin.


    ```

    su nobody -s /bin/bash \

    -c "PATH=$PATH make RUN_EXPENSIVE_TESTS=yes check"

    ```


    The test program-getlogin is known to fail in a partially built system environment
    the chroot environment here, but passes if run at the end of this chapter. The
    test program tt.sh is also known to fail.


    Remove the temporary group:


    ```

    sed -i ''/dummy/d'' /etc/group

    ```


    Install the package:


    ```

    make install

    ```


    Move to the locations specified by the FHS:


    ```

    mv -v /usr/bin/{cat, chgrp, chmod, chown, cp, date, dd, df, echo} /bin

    mv -v /usr/bin/{false, ln, ls, mkdir, mknod, mv, pwd, rm} /bin

    mv -v /usr/bin/{md5, stty, sync, true, uname} /bin

