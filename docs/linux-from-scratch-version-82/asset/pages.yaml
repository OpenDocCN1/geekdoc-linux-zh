  md: '# 5.35. Stripping


    The steps in this section are optional, but if the LFS partition is rather small,
    it is beneficial to learn that unnecessary items can be removed. The executables
    and libraries built so contain about 70 MB of unneeded debugging symbols. Remove
    them with:


    ```

    strip --strip-debug /tools/lib/*

    usr/bin/strip --strip-needed /tools/{,s}bin/*

    ```


    These commands will skip a number of files, reporting that it does not recognize
    their file format. Most of these scripts keep instead of binaries. Also use the
    system command to include the strip binary in /tools.


    Take care not to use --strip-needed on the libraries. The static ones would be
    destroyed and the toolchain packages would need to be built all over again.


    To save more, remove the document:


    ```

    rm -rf /tools/{,share)/{info,man,doc

    ```


    Remove unused files:


    ```

    find /tools/(lib,libexec) -name *.la -delete

    ```


    At this point, you should have at least 3 GB of free space in $LFS that can be
    used to build and install Glibc and Gcc in the next phase. If you can build and
    install Glibc, you can build and install the rest too.


    # 5.36. Changing Ownership


    > Note

    The commands in the remainder of this book must be performed while logged in as
    user root and no longer as user lfs. Also, double check that $LFS is set in root''s
    environment.


    Currently, the $LFS/tools directory is owned by the user lfs, a user that exists
    only on the host system. The $LFS/tools directory is kept as is, the files are
    owned by a user ID with a corresponding account. This is dangerous because a user
    account created later could give this same user ID and own the $LFS/tools directory
    and all the therein, exposing these to malicious manipulation.


    To avoid this, you could add the lfs user to the new LFS system later when creating
    the /etc/passwd file, taking care to assign the same user and group IDs as on
    the host system. Better yet, change the ownership of $LFS/tools directory to user
    root by running the following command:


    ```

    chown -R root:root $LFS/tools

    ```


    Although the $LFS/tools directory can be deleted once the LFS system has been
    finished, it can be retained to build additional LFS systems of the same book
    version. How best to backup $LFS/tools is a matter of personal preference.


    > Caution

    If you need to keep the temporary tools for use in building future LFS systems,
    now is the time to back them up. Subsequent commands in chapter 6 will alter the
    tools currently in place, rendering them useless for future builds.'
  merge: -1
