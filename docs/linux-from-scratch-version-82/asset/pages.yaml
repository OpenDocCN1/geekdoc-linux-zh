  md: '# 6.13. Readline-7.0


    The Readline package is a set of libraries that offers command-line editing and
    history capabilities.

    Approximate build time: 0.1 SBU

    Required disk space: 15 MB


    # 6.13.1. Installation of Readline


    Reinstalling Readline will cause the old libraries to be moved to <libraryname>.old.
    While this is not a problem, in some cases it can trigger a linking bug in ldconfig.
    This can be avoided by issuing the following two seeds:


    ```

    sed -i ''/MV.*old/d'' Makefile.in

    sed -i ''/{OLDSUFF}/c:'' support/shlib-install

    ```


    Prepare Readline for compilation:


    ```

    ./configure --prefix=/usr \

    --disable-static \nn--docdir=/usr/share/doc/readline-7.0

    ```


    Compile the package:


    ```

    make SHLIB_LIBS="-L/tools/lib -lncursesw"

    ```


    The meaning of the option:


    ```

    SHLIB_LIBS="-L/tools/lib -lncursesw"

    ```


    This option forces Readline to link against the libncurses library.

    This package does not come with a test suite.


    Install the package:


    ```

    make SHLIB_LIBS="-L/tools/lib -lncurses" install

    ```


    Now move the dynamic libraries to a more appropriate location and fix up some
    symbolic links:


    ```

    mv -v /usr/lib/lib(readline,history).so* /lib

    ln -sf ../lib/$(readlink /usr/lib/libreadline.so) /usr/lib/libreadline.so

    ln -sf ../lib/$(readlink /usr/lib/libhistory.so) /usr/lib/libhistory.so

    ```


    If desired, install the documentation:


    ```

    install -v -m644 *.{ps,pdf,html,dvi} /usr/share/doc/readline-7.0

    ```


