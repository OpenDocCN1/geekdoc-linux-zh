    Next, install the locales that can make the system respond in a different language.
    None of the locales are required, but if some of them are missing, the test suites
    of future packages would skip importcases.


    Individual locales can be installed using the localef program. E.g., the localef
    command below combines the /usr/share/i18n/locales/cs_CZ charset-independent locale
    definition with the /usr/share/i18n/charmaps/UTF-8.gz charmap definition and appends
    the result to the /usr/lib/locale-archive file. The following instructions will
    install the minimum set of locales for the optimal coverage of tests:


    ```

    mkdir -p /usr/locale

    localef -i cs_CZ -f UTF-8 cs_CZ_UTF-8

    localef -i de_DE -f ISO-8859-1 de_DE

    localef -i de_DE@euro -f ISO-8859-15 de_DE@euro

    localef -i de_DE -f UTF-8 de_DE_UTF-8

    localef -i en_GB -f UTF-8 en_GB_UTF-8

    localef -i en_HK -f ISO-8859-1 en_HK

    localef -i en_PH -f ISO-8859-1 en_PH

    localef -i en_US -f ISO-8859-1 en_US

    localef -i en_US -f UTF-8 en_US_UTF-8

    localef -i es_MX -f ISO-8859-1 es_MX

    localef -i fa_IR -f UTF-8 fa_IR

    localef -i fr_FR -f ISO-8859-1 fr_FR

    localef -i fr_FR@euro -f ISO-8859-15 fr_FR@euro

    localef -i fr_FR -f UTF-8 fr_FR_UTF-8

    localef -i it_IT -f ISO-8859-1 it_IT

    localef -i it_IT -f UTF-8 it_IT_UTF-8

    localef -i ja_JA -f EUC-JP ja_JA

    localef -i ru_RU -f KOI8-R ru_RU.KOI8-R

    localef -i ru_RU -f UTF-8 ru_RU.UTF-8

    localef -i tr_TR -f UTF-8 tr_TR_UTF-8

    localef -i zh_CN -f GB18030 zh_CN.GB18030

    ```


    In addition, install the locale for your own country, language and character set.


    Alternatively, install all installed locales in the glibc-2.27/locdata/SUPPORTED
    file (it includes every locale listed above and more once) at the following time-consuming
    command:


    ```

    make localedata/install-locales

    ```


    Then use the localedef to create and install locales not listed in the glibc-2.27/localedata/SUPPORTED
    file in the unlikely case you need them.'
