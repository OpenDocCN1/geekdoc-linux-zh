  md: '# 5.7 BladeCenter Fibre Switch Module configuration


    The BladeCenter SAN Utility application is used to access and configure the BladeCenter
    Fibre Channel switch modules. The SAN Utility can be installed on a BladeCenter
    HS20 Blade server or an external network management workstation configured with
    a supported version of Linux.


    Before you configure your switch module, be sure that the management modules are
    properly configured. In order to access your switch module from an external environment,
    you may need to enable certain features, such as external ports and external management
    over all ports. The applicable *BladeCenter Unit Installation and User''s Guide*
    publications on the IBM eServer BladeCenter Documentation CD.


    Installing the BladeCenter SAN Utility is detailed in Chapter 8. “BladeCenter
    SAN Utility” on page 177.


    # 5.8 Configuring FAStT


    It is necessary to set up the FASIT and configure LUNs to be accessed by the Linux
    system. The configuration of the FASIT is done using the Storage Manager tool
    and the FASIT MSJ (Management Suite for Java). Please refer to Chapter 9, “FASTIT
    Storage Manager” on page 187, and Chapter 10. “FASTIT MSJ (Management Suite for
    Java)” on page 211 on how to install and use these.


    # 5.9 Configuring ESS


    It is necessary to set up the ESS and configure LUNs to be accessed by the Linux
    System. In addition, as mentioned earlier, you must configure your ESS for multiport
    access for each LUN before you install SDD. This is done using the Storage Specialist.
    Please refer to Chapter 7, “Configuring ESS for Linux” on page 155.'
