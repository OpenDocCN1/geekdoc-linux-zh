  md: '# 11.3 Implementing VMware ESX Server 1.5.2


    This section describes the installation and configuration of the VMware ESX server.


    # 11.3.1 Installation steps


    The installation of VMware is rather simple.


    To begin the installation insert the VMware ESX CD and start the server. The dialog
    shown in Figure 11-2 displays. Click **Install**.


    > **Attention:** If you are planning to install with redundant paths you must
    disconnect all Fibre Channel HBAs from the fabric. Please be aware that loops
    are not supported by the QLogic device driver used with VMware ESX server. The
    VMware kernel supports up to 7 LUNs by default.


    However, you can set up your storage completely. Please refer to Chapter 9, "FIT
    Storage Manager" on page 187 for further information.


    > **Important:** If you are installing on a x440 enter aspic at the boot; prompt
    when it appears.


    ![](img/7df754bba6e7faadf914690e9e5ed087_251_0.png)


    Figure 11-2 Begin installation


    The next dialog shown on Figure 11-3 asks for a driver disk. Actually, no additional
    driver is required: Answer **No**.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Install Supplemental Drivers


    The VMware ESX Server installer includes drivers for a wide variety of devices.
    However, some devices require additional drivers, provided on floppy disk by VMware.


    Do you have a driver disk that you want to use?


    ![](img/7df754bba6e7faadf914690e9e5ed087_252_0.png)


    Figure 11-3 Driver disk


    The system now starts probing the hardware, and installing appropriate modules
    for the detected hardware.


    Upon completion of the hardware probing space, the Disk Partitioning Setup (shown
    in Figure 11-4) displays.


    # Disk Partitioning Setup


    ![](img/7df754bba6e7faadf914690e9e5ed087_252_1.png)


    You have three disk partitioning options:


    Automatic Partitioning sets up your partitions using the recommended configuration.
    You can customize the resulting partitions if necessary.


    Disk Druid allows you to set up your partitions manually in an interactive environment.


    fdisk is a text-based manual partitioning tool. Although it is not as easy to
    use, there are cases where fdisk is preferred.


    Figure 11-4 Partitioning of console OS


    It is essential to keep in mind that the partitioning done at this point pertains
    to the console OS (storage partitioning for the virtual machines later will be
    done (later). Even though Autopartitioning is convenient, we suggest that you
    partition the disk manually. Please keep the following recommendations in:


    +   • The root partition should be at least 1.8 GB in size.


    +   • For /boot about 25 MB are required.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'The /home directory is used for two purposes: storing the configurations of
    the virtual machines and storage for suspended virtual machines. This means that
    you require 10 MB +(size of VM memory) for each virtual machine if your virtual
    machine has a memory size larger than 2 GB, the VMs must be attached to VMFS volumes;
    see Figure 11-27.


    Apply the following rules for deciding the size of the swap partition:


    +   - 1-4 VMs -> 128 MB

    - 5-8 VMs -> 192 MB

    - 9-16 VMs -> 272 MB

    - 17-32 VMs -> 384 MB

    - > 32 VMs -> 512 MB


    When the partitioning is done, the system prompts you as to where to locate the
    boot loader (LILO), unless in the Master Boot Record (MBR).


    The installation proceeds with the setup of a network interface (Figure 11-5).
    This network is used by the console OS only. You need a static IP address for
    this interface because all configuration and setup communications are carried
    through this device.


    ![](img/7df754bba6e7faadf914690e9e5ed087_253_0.png)


    Figure 11-5 Network setup of console OS


    Next, you set up the time zone (screen not shown) and then specify a root password
    (Figure 11-6). This password is required for any fundamental modification to the
    VMware ESX server.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '![](img/7df754bba6e7faadf914690e9e5ed087_254_0.png)


    Figure 11-6 Define root password


    Click OK.


    The next dialog allows you to define additional users of the system ().


    These additional users can be later defined as administrators for the virtual
    machines (creation, start, stop, and other maintenance tasks.). We strongly recommend
    not to use the root user ID for the setup and administration of virtual machines.


    The installation continues until the console OS and the VMware ESX server components
    have been copied to the disk. When completed, the system reboots and displays
    LILO boot menu. If you do nothing the default setting (VMware kernel) is loaded.


    # 11.3.2 Configuration of the ESX server


    Once the VMware ESX server is loaded, you can access the system either locally
    via a console (press Alt+F2 to enter a console) or remotely. To do a remote access
    for the first time, start a Web browser and enter the following destination:


    ```

    http://VMware ESX IP address>

    ```


    The VMware server responds to your request by transmitting a site certificate,
    as shown in Figure 11-7.'
