  md: '# 3.5 zSeries FCP and disk storage under Linux


    In this section we focus on the attachment of disk storage via Fibre Channel stated
    in the introduction.


    > **Important:** A large number of SCSI devices exist in the marketplace. IBM
    cannot fully test all of these for use in zSeries systems. There will be a distinction
    between IBM supported devices and devices that have been used and appear to work
    but are not formally supported for zSeries FCP by IBM. For a complete list of
    supported devices, consult: http://www-ibm.com/servers/eserver/zseries/connectivity/#fcp


    # 3.5.1 ESS using FCP


    This section refers to the physical setup presented in 3.3, "Configuration used
    for this redbook" on page 38. Here we discuss the following:


    +   * Gather prerequisite information about the SAN setup

    * Set the ESS and configure LUNs for use with Linux for zSeries

    * Manually load the required modules and parameters to access the disks

    * Make the disks permanently accessible


    # Prerequisite information


    From a software configuration standpoint, you need to collect the following elements
    of information, as described in 3.1.2 "Distributed storage attachments" on page
    29, in order to prepare a Linux system for accessing the Enterprise Storage Server
    through Fibre Channel:


    +   * Hostname of the server hosting the Linux system

    * Device address (CHPID) of the FCP port attached to Linux

    * World Wide Port Name (WWPN) of the FCP port on the zSeries

    * FC port on the ESS

    * World Wide Port Name of the FC port on the ESS


    You can obtain the data from the HMC, the ESS Specialist, and the McData switch;
    in our case, these were:


    Table 3-2 World Wide Port Names

    | Linux hostname | vmlinux |

    | CHPID of the FCP port on the z800 | 15 |

    | WWPN of the FCP port on the z800 | 50:05:07:64:01:40:01:7d |

    | FC port on the ESS | Bay 3 Slot 1 |


    64 Implementing Linux with IBM Disk Storage'
