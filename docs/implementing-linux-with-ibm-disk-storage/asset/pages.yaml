  md: '# 3.4.1 Initial steps for installation as a z/VM Guest


    The initial installation of SLES 8 as a z/VM guest mandates the following sequence
    of tasks:


    +   1. Create a Linux guest.

    2. Upload the kernel image, the initial ramdisk, and the parameter file to the
    VM guest.

    3. Create an IPL-script and IPL from virtual reader.

    4. Perform the initial network setup on the VM console.


    After the initial setup is up and running, the installation proceeds using the
    graphical installation program YaST2 (see 3.4.3, "Installation with YaST2" on
    page 51).


    # Create a Linux guest


    To run under z/VM, we have to create a new user (guest) in the z/VM directory.
    In our example, we created a guest with the following settings.


    Example 3-1 z/VM directory entry for Linux guest


    USER LINUXA XXXXX 512M 1 G

    ACCOUNT ITS30000

    IPL CMS PARM AUTOCR

    MACHINE XA 2

    DEDICATE 2C04 2C04 (OSA GbE Adapter - 2C04 thru 2C06)

    DEDICATE 2C05 2C05

    DEDICATE 2C06 2C06

    DEDICATE 0600 0600 (FCP - 0600 thru 063F)

    ...

    ...

    ...

    DEDICATE 063F 063F

    CONSOLE 0009 3215 A

    SPOOL 000C 3505 A

    SPOOL 000D 3525 A

    SPOOL 000E 1403 A

    LINK MAIN 0190 0190 RR

    LINK MAIN 019E 019E RR

    LINK MAIN 019F 019F RR

    LINK MAIN 019D 019D RR

    DISK 0191 3390 1959 50 VMLU1 MR

    DISK 0202 3390 0001 200 LX3A43 MR

    DISK 0201 3390 0201 3138 LX3A43 MR


    Through these settings, you can see that we have dedicated an OSA Express GbE
    adapter (2C04-2C06) and a FICON FCP adapter (0600-063F). In'
