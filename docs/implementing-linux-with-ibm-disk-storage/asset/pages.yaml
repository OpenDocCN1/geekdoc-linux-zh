- img_proc: true
  md: '# 6.1 Preparing to install Cluster Manager


    High Availability clusters should ideally have no single point-of-failure. This
    reliability provides data integrity and application availability in the event
    of a failure. Redundant hardware with shared storage along with cluster and application
    failover mechanisms mean a high availability cluster can meet the needs of the
    enterprise market.


    Figure 6-1 shows the setup done for our experiment.


    ![](img/7df754bba6e7faadf914690e9e5ed087_161_0.png)


    Figure 6-1 Configuration of HA cluster


    # 6.1.1 Quorum partitions


    It is important to note that the Quorum partitions require raw devices. Cluster
    Manager requires a Quorum partition and backup Quorum partition to store cluster
    state and configuration information. These should ideally be created on a'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'logical drive on a RAID1 array. Create two partition no smaller than 10 MB
    but larger than 20 MB, there is no need for it to be larger than this. Do not
    create file systems on the Quorum partitions, as these need to remain


    # 6.1.2 Software watchdog


    A soft watchdog is used to kill a hung node if no hardware devices such as power
    switches are being used for STONITH (shoot the node in the head). The cluster
    quorum daemon (corosync) will periodically reset the timer interval. If the daemon
    fails to reset the timer, the failed cluster member will reboot itself. It is
    necessary to create the device special for the watchdog timer. Carry out the following
    on both nodes of the cluster:


    ```

    cd /dev

    /MADEDEV watchdog

    ```


    # 6.1.3 NMI watchdog


    When using the software watchdog, it is recommended that you also use the NMI
    watchdog timer. The NMI watchdog may not work on some legacy systems. Edit /etc/grub.conf
    to add nmi_watchdog=1 to the end of the relevant kernel line (Figure 6-2).


    ![](img/7df754bba6e7faadf914690e9e5ed087_162_0.png)'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'The system watchdog needs to be rebooted in order to check that system supports
    the NMI monitor. Once the server is back online check /proc/interrupts (Figure
    6-3). If the NMI entry is not zero, the system supports the NMI watchdog timer.
    If the entry is zero then try changing the angle in grub.conf to nmi_watchdog=2
    and reboot. If it is still zero the server does not support the NMI watchdog timer.


    ![](img/7df754bba6e7faadf914690e9e5ed087_163_0.png)


    Figure 6-3 /proc/interrupts


