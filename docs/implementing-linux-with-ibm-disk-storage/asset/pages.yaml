  md: '# 8.1 Installing the BladeCenter SAN Utility


    The BladeCenter SAN Utility application is used to access and configure the BladeCenter
    Fibre Channel switch modules. The SAN Utility can be installed on a BladeCenter
    HS20 blade server or an external network management workstation configured with
    a supported version of Linux.


    Before you configure your switch module, be sure that the management modules are
    properly configured. In order to access your switch module from an external environment,
    you may need to enable certain features, such as external ports and external management
    over all ports. The applicable BladeCenter Installation and User''s Guide publications
    on the IBM eServer BladeCenter Documentation CD at:


    ```

    http://www.ibm.com/pc/support

    ```


    Obtain the latest version of the BladeCenter SAN Utility. Install the SAN Utility
    using the following command:


    ```

    sh Linux_<version>.bin

