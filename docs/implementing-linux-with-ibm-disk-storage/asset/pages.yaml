    Fixed Block Architecture (FBA). FC and SCSI disks use a fixed block architecture,
    that is, the disk is arranged in fixed size blocks or sectors. With an FB architecture
    the location of any block can be calculated to retrieve that head. The concept
    of tracks and cylinders exists, because on a physical disk we have multiple blocks
    per track, and a cylinder is the group of tracks that exists under the disk heads
    at one-point-in-time when


    homogeneous. Term to describe an environment consisting entirely of one type of
    host (i.e. Windows 2000 only)


    host. The server where the application programs run.


    host adapter (HA). A physical unit of a storage controller that provides the ability
