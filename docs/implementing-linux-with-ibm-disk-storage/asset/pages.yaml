    # Data protection and remote copy functions


    Many design characteristics and advanced functions of the IBM TotalStorage Enterprise
    Storage Server Model 800 contribute to protect the data in an effective manner.


    # Fault-tolerant design


    The IBM TotalStorage Enterprise Storage Server is designed with no single point
    of failure. It is a fault-tolerant subsystem, which can be maintained and upgraded
    concurrently with user operation.


    # RAID 5 or RAID 10 data protection


    With the IBM TotalStorage Enterprise Storage Server Model 800, there now is the
    additional option of configuring the disk arrays in a RAID 10 disposition (mirroring
    plus striping) in addition to the RAID 5 arrangement, which gives more flexibility
    when selecting the redundancy technique for protecting the users'' data.


    # Peer-to-Peer Remote Copy (PPRC)


    The Peer-to-Peer Remote Copy (PPRC) function is a hardware-based solution for
    mirroring logical volumes from a primary site (the application site) onto the
    volumes of a secondary site (the recovery site). PPRC is a remote copy solution
    for the open systems servers and for the ZSeries servers.


    Two modes of PPRC are available with the IBM TotalStorage Enterprise Storage Server
    Model 800:


    +   - PPRC synchronous mode, for real-time mirroring between ESSs located up to
    103 km apart


    +   - PPRC Extended Distance (PPRC-XD) mode, for non-synchronous data copy over
    continental distances


    # Extended Remote Copy (XRC)


    Extended Remote Copy (XRC) is a combined hardware and software remote copy solution
    for Q/OS™ and OS/390® environments. The asynchronous characteristics of XRC make
    it suitable for continental distance implementations.


    # Point-in-Time Copy function


