  md: '# Device Allocation


    For each device, select whether you would like to allocate it to the Console OS,
    or to the Virtual Machines, or share it between the two.

    * Console Device can only be used by the Console OS and is unavailable to virtual
    machines.

    * Virtual Machines: Device can only be used by your virtual machines and is unavailable
    to the Console OS.

    * Shared Some devices using SCSI and RAID adapters can be shared, enabling them
    to be used by both the Console OS and your virtual machines.


    Important note — when allocating devices:

    * Make sure the Console''s active adapter (typically the first listed network
    adapter) does not get reassigned to the virtual machines.\ Otherwise you will
    lose connectivity upon rebooting the machine after boot configuration is complete.

    * If the Console OS and Virtual Machines will be using disks that reside on the
    same SCSI/RAID adapter, that adapter must be configured as “Shared"


    | Console | Shared | Virtual Machines | Device Name | Driver | Bus | Dev |

