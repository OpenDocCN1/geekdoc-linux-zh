  md: '# 5.4.4 Installing SuSE Linux on BladeCenter


    The Installation of UnitedLinux/SLES on the BladeCenter servers is very similar
    to 5.4.3 "Installation steps for SLES8 on xSeries" on page 117. There are a few
    particularities to be aware of though.


    # Mouse during installation


    The mouse will not work initially until the installer starts. The keyboard to
    start the installation until you get to the Installation Settings screen. Press
    Alt+C to change the settings. Select Mouse from the menu, scroll down the list
    and select USB Mouse. Press Alt+T to test and then click Accept when finished.


    # Single processor or hyper-threading


    If the server more than one processor or has hyper-threading enabled, select Booting,
    and add the parameter acpi=oldboot in the Kernel Boot Parameters field.


    # 5.5 Post-installation


    This section addresses post-installation tasks that are critical, and thus required
    depending on your hardware or Linux distribution.


    # 5.5.1 Configuring for the Summit kernel (Red Hat)


    This only applies to Red Hat.


    IBM''s new high-end Intel based servers take advantage of the new IBM Summit chipsets.
    Summit is the name for a set of technologies inspired by proven mainframe capabilities.
    Summit enables mainframe inspired capabilities in the areas of availability, scalability,
    and performance. Enhanced features include:


    +   * Memory mirroring, redundant bit steering, chipkill memory

    * L4 cache providing high speed communications between memory and CPU subsystems

    * High performance PCI-X allows adapters significantly better memory access

    * Increased scalability


    We are using x440 servers, which include the Summit chipset. If you are using
    an x360 or a server without the Summit chipset, then you can move to the next
    section.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'If you have an SMP system and you have booted the SMP or enterprise kernel
    you will find that the loading of Linux will hang. You should boot into the system
    BIOS and enable hyper-threading.


    Press F1 when prompted at the system BIOS. From the menu select **Advanced Setup
    -> CPU Options**. Enable **Hyper-Threading Technology.**


    Once you will be able to boot with the SMP or Enterprise kernels. The Summit kernel
    should be used on servers with this technology except the x360. Once the Summit
    kernel is installed hyper-threading can be switched off again if required.


    The summit kernel, source, and patch are supplied with the distribution CDs if
    required.


    Obtain the latest supported summit kernel, headers, and source from the following
    site:

    nhttp://www.rhn.redhat.com


    You will need to register your licensed copy of Red Hat Enterprise Linux to obtain
    updates for this OS.


    Install the updates:


    ```

    rpm -ihv kernel-summit-<version>.rpm

    rpm -Uvh kernel-headers-<version>.rpm

    rpm -Uvh kernel-source-<version>.rpm

    rpm -ihv kernel-<version>.src.rpm

    ```


    An entry will be added to /etc/grub.conf , which will allow you to boot from the
    Summit kernel. Edit the default field to boot this kernel by default.


    When using the summit kernel, it is also necessary to install a patch that is
    supplied with the kernel<version>.src.rpm file. Type the following commands to
    install the patch:


    ```

    cd /usr/src/linux-<version>

    patch -pl < /usr/src/redhat/SOURCES/linux-<version>-summit.patch

    cp -f config/kernel-<version>-1686-summit.config.config

    ```


    # 5.5.2 Updating the kernel on BladeCenter (Red Hat)


    This only applies to Red Hat. Obtain the latest supported kernel, headers, and
    source from the following site:


    http://www.rhn.redhat.com


    You will need to register your licensed copy of Red Hat Enterprise Linux to obtain
    updates for this OS.'
