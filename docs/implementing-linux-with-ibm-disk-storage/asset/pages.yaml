  md: '# Fibre Channel Host. A server that uses Fibre Channel I/O adapter cards to
    connect to the storage enclosure


    F_Port Fabric Port - a port used to attach a NodePort (N_Port) to a switch fabric.


    Fibre Channel standard. An ANSI standard for a computer peripheral. The I/O interface
    defines a protocol for communication over a serial interface that configures attached
    units to a communication fabric. The protocol has two layers. The IP layer defines
    basic interconnection protocols. The upper layer supports one or more logical
    protocols (for example FCP for SCSI protocols, ESCON for ESA/390 command protocols).


    # G


    GB. See gigabyte.


    gigabyte. 1 073 741 824 bytes.


    group. A group consists of eight DDMs.


    # H


    FICON. An I/O interface based on the Fibre Channel architecture. In this new interface,
    the ESCON protocols were mapped to the FC-4 layer, i.e. the Upper Level Protocol,
    the Fibre Channel Architecture. It is used in the S/390 and z/series environments.


    hard disk drive (HDD). Avolatile storage medium within a server used to keep the
    data records. In the ESS these are 3.5" disks, coated with thin layers of special
    substances, where the information is magnetically recorded and read. HDDs are
    packed in replaceable units called DDMs.


    FICON Channel. A channel that has a FICON channel-controller I/O interface that
    uses optical cables as a transmission medium.


    # HDD. See hard disk drive.


    heterogeneous. Term to describe an environment consisting of multiple types of
