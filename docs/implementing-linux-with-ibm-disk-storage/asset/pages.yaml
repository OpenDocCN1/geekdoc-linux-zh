  md: '# Glossary


    # A


    # B


    **Access logical drive.** The Access Logical Drive is a special drive that uses
    none of the physical disk drives and should be assigned to the last (highest)
    available LUN number. Typically, the LUN number will be LUN 31. The Access Logical
    Drive allows the Storage Manager to connect to the Fibre Channel RAID controllers
    for storage management services. These services include monitoring, configuring,
    and maintaining the RAID storage device.


    **bay.** Physical space on an ESS rack. A bay contains SCSI, ESCON, or Fibre Channel
    / interface cards.


    **backup.** The process of creating a copy of data to ensure against accidental
    loss.


    **allocated storage.** On the ESS, this is the space that you have allocated to
    volumes, but not yet assigned.


    # C


    **cache.** A random electronic storage in selected storage controls to retain
    frequently used data for faster access by the host.


    **CCW.** Channel command.


    **array.** The group of physical disk drive modules (DDMs) that are divided into
    logical drives and allocated to hosts.


    **chunksize.** The number of data blocks, assigned by a system administrator,
    written to the primary RAIDSet member before the remaining data blocks are written
    to the next RAIDSet or stripet member.


    **assigned storage.** On the ESS, this is the space that you have allocated to
    volumes, and assigned to a port.


    **channel.** A path along which signals can be sent; for example, data channel
    and output channel. (2) A functional unit, controlled by the processor, that handles
    the transfer of data between processor and local peripheral environment.


    **asynchronous operation.** A type of operation in the remote copy XOR function
    updates to the secondary volume of an XOR pair at some time after the primary
    volume is updated. Contrast with synchronous operation.


    **channel connection address (CCA).** The input/output (I/O) address that uniquely
    identifies an I/O device to the channel during an I/O operation.


    **availability.** The degree to which a system or resource is capable of performing
    its normal function.


    **channel interface.** The circuitry in a storage control that attaches storage
    paths to a host channel.'
