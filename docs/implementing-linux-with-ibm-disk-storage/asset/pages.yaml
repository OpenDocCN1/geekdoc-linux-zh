    # # 6.1.5 Log file for Cluster Messages


    The /etc/syslog.log file can be edited to log events from the cluster to a different
    file away from the default log file. The cluster utilities and daemons log their
    messages to a syslog tag called local4.


    Edit /etc/syslog.conf on both systems and add local4.none to the following section
    to avoid events being duplicated in the cluster log and the default log:


    +   * Log anything (except mail) of level info or higher.

    "* Don''t log private authentication messages!

    * *.info;mail.none;authpriv.none;cron.none;none;local4.none /var/log/messages"


    Add the following to the end of the file to log the cluster messages into a separate
    file:


    +   * Cluster messages on local4

    * local4.* /var/log/cluster


    The /etc/syslog.conf file should look similar to Figure 6-5.'
