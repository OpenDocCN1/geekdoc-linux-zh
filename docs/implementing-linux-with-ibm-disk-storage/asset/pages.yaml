  md: '# Red Hat notes


    Before you restart you should add the kernel parameter max_scsi_luns=128 to the
    modules.conf file. This is necessary because the kernel does not probe the full
    range of luns by default. However, this is only critical if you are using a large
    amount of SAN volumes.


    > Note: Every change in the configuration of your SAN causes the need to reconfigure
    your paths and rebuild the initial ramdisk!


