  md: '![](img/7df754bba6e7faadf914690e9e5ed087_118_0.png)


    # 5


    # # Linux on xSeries andnBladeCenter


    This chapter covers Linux installation on xSeries and BladeCenter in conjunction
    with external storage.


    First, it provides the step-by-step procedure for installing Red Hat Linux Advanced
    Server (AS) on IBM xServers and BladeCenter. Then, following the same structure,
    we cover UnitedLinux 1.0 as part of the SuSE Linux Enterprise Server (SLES 8)
    distribution.


    Following the basic installation of both products, this chapter reviews required
    post-installation tasks and caveats for specific server types.


    The chapter ends with instructions and special considerations for attaching external
    disk storage, and discusses the SDD multipath driver required for ESS, while differences
    between the Red Hat and SuSE implementations are highlighted.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# 5.1 Introduction to xSeries™ xSeries, BladeCenter


    IBM xSeries™ servers leverage IBM Enterprise X-Architecture™''s state-of-the-art,
    industry-leading technologies that deliver mainframe-class power, and enterprise
    scalability and availability at very attractive prices. IBM is working closely
    with leading Linux distributors — Red Hat and the founders of UnitedLinux including
    the SCO Group, SuSE Linux AG, and Turbolinux, Inc., to offer tested and validated
    configurations for the full line of xSeries servers to ensure maximum performance
    and functionality across the full line of xSeries

    servers.


    Blade servers are a relatively new technology that has industry focus because
    of its modular design, which can reduce cost with a more efficient use of valuable
    floor space, and its simplified management, which can help to speed up such tasks
    as deploying, repositioning, updating, and troubleshooting hundreds of Blade servers.
    All this can be done remotely with one graphical console using IBM Director systems
    tools. In addition, Blade servers provide improved performance by doubling rack
    density. By integrating resources and sharing key components, not only will costs
    be reduced, but also, availability will be increased. The BladeCenter is ideally
    placed for High Performance Computing clusters and Web farms. For more details,
    see the following Redpaper The Cutting Edge: The IBM eServer BladeCenter, REDP3581.


    ![](img/7df754bba6e7faadf914690e9e5ed087_119_0.png)


    Figure 5-1 IBM BladeCenter chassis and Blade


    Both Red Hat Linux and SuSE Linux Enterprise Server provide enterprise class features
    that enable Linux-based solutions to be deployed across the widest range of enterprise
    IT environments.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 5.2 Requirements


    Prior to installation, we must first consider the system requirements. Especially,
    the impact of the attached networks and storage on overall performance has to
    be considered. Some recommendations to follow are:


    +   - Design the storage subsystem carefully (RAID-level, stripe size, number
    of hard drives versus capacity). Tuning IBM eServer xSeries Servers for Performance,
    SG24-5287.


    +   - Check for appropriate cache usage on FASTIT (see IBM TotalStorage FAST700
    and Copy Services, SG24-6808).


    Prior to installation, all firmware and BIOS levels must be verified and updated
    if necessary. To get the latest information and downloads, visit the following
    site:


    http://www.pc.ibm.com/support/


    On the xSeries pages, you will find the latest drivers and firmware releases,
    as well as documentation about installation for specific models.


    Remember to also check compatibility of your disk systems by visiting:


    http://www.storage.ibm.com/proven/index.html


    # 5.2.1 Hardware requirements


    The xSeries servers range from single processor to 16-way processor systems. Memory
    ranges from 128 MB to 64 GB. Requirements will be dependant on workload: for example,
    a large database would be well suited to a system with plenty of memory and CPU
    power, whereas a Web server would be better with more networking resources. Many
    options are available and supported in IBM xSeries servers. You can view the latest
    list at the following site:


    http://www.pc.ibm.com/us/compat/index.html


    Red Hat and Suse also have a list of tested and supported hardware with distribution
    of Linux, respectively at:


    http://hardware.redhat.com/hcl or http://www.suse.com/us/business/certifications/certified_hardware


    For attaching external storage, you will need a Host Bus Adapter. You can find
    the list of supported adapters by going to:


    http://www.storage.ibm.com


    After selecting your storage type, look for interoperability matrix.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'For the purpose of this book, we used an IBM FASIT FC2-133 (note that although
    the name seems to indicate it is for FAST, it can be used to attach to other storage
    systems, e.g., ESS).


    # 5.2.2 Software requirements


    The following is a list of software used to set up Fibre Channel storage with
    the xSeries and BladeCenter.


    +   - Red Hat Enterprise Linux (release AS if setting up a high availability cluster),
    or SuSE Enterprise Server 8 (SLES8)

    - IBM FASST Host Bus Adapter drivers


    If you attach to FAST, you will need:


    +   - Storage Manager

    - IBM FAST Management Suite for Java (MSJ)


    If you attach to ESS, you will need:


    +   - Subsystem Device Driver (SDD)

    - ESS Specialist


    To configure the BladeCenter FC switch modules you will need:


    +   - BladeCenter SAN utility


    # 5.2.3 Connection requirements


    A network switch is required for systems management and to configure the Fibre
    Channel storage. The servers may be connected to the storage via fibres switches
    or hubs, or if there is only one to four servers they can be connected directly
    to the FASIT with the correct amount of mini-hubs.


    All connections have to be planned and set up carefully. Cable length considerations
    are also important. The topic is beyond the scope of this book and we assume that
    you are familiar with SAN and its implications. For an introduction, please refer
    to Introduction to Storage Area Networks, SG24-5470. Additionally, we assume that
    ESS and FASIT are set up with redundant paths from the host system.'
  merge: -1
  pgno: 121
