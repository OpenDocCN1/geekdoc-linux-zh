  md: '# Configuring ESS for Linux


    This chapter describes functions of the IBM TotalStorage Enterprise Storage Server
    Specialist (ESS Specialist). The information presented is an extract and summary
    from the ESS user guide with focus on how to configure fixed block storage in
    the ESS, as required by Linux systems.


    This chapter is intended for Linux users not familiar with the function and operations
    of the ESS Specialist.


    Remember that Linux for zSeries requires S/390 storage (CKD) to IPL (boot) from.
    For detailed information on how to configure the ESS for CKD hosts as well as
    open systems environments, please refer to the redbook IBM TotalStorage Enterprise
    Server: Implementing the ESS in Your Environment, SG24-5420, and to IBM TotalStorage
    Enterprise Storage Server Web Interface User''s Guide, SC26-7448.


    The settings and procedures described in this chapter apply to the ESS Model 800.'
  merge: -1
  pgno: 176
- img_proc: true
  md: "# 7.1 IBM TotalStorage ESS Specialist\n\nThe ESS includes the ESS Specialist,\
    \ which is a network enabled management tool that allows the storage administrator\
    \ to monitor and manage storage from the IBM TotalStorage Enterprise Storage Server\
    \ Master Console (ESS Master Console), from a remote workstation using a Web browser.\n\
    \nBy using a secure Internet connection (LAN with a Web browser), such as Netscape\
    \ Navigator, or Microsoft Internet Explorer, your storage administrator can coordinate\
    \ the consolidation effort and easily integrate storage capacity by the ESS.\n\
    \nThe ESS Specialist provides you with the ability to do the following:\n\n+ \
    \  * Monitor error logs: If a problem occurs, a description of the problem including\
    \ the failed component, the problem severity, and who is to be automatically notified\
    \ is described.\n\n+   * View the ESS status: Logical schematic of the ESS environment\
    \ including the host attached ports, controller and cache storage, device adapters,\
    \ and host icons may be checked.\n\n+   * View and update the configuration: A\
    \ color scheduled view of the storage, including the amount of space allocated\
    \ and assigned to one or more hosts, space allocated and not yet assigned, and\
    \ space not allocated to logical volumes may be viewed.\n\n+   * Add host systems\
    \ or delete host systems\n\n+   * Configure host ports\n\n+   * Add volumes, remove\
    \ volumes, and reassign volumes between different servers as follows:\n    * Removing\
    \ volumes (or unassigning volumes from hosts). Volumes can be removed by removing\
    \ all logically attached host connections to the logical volume.\n    * Adding\
    \ volumes. Volumes can be added from subsystem capacity that have never been defined\
    \ or after an array has reinitialized.\n    * Reclaiming previously defined logical\
    \ volumes\n\n+   * View communication resource settings, such as TCP/IP configuration\
    \ and users\n\n+   * View cluster Licensed Internal Code (LIC) levels. You can\
    \ view the active level, next level yet to be activated, and the previous level.\n\
    \n+   * Select one of the following authorization levels for each user:\n    *\
    \ Viewer. A viewer can view the current configuration and status information."
  merge: -1
  pgno: 177
- img_proc: true
  md: '+   - Operator. An operator can perform view and operation functions, such
    as changing the remote service and PE password.

    - A configurator can view the current configuration and status information and
    can make changes to the configuration.

    - Administrator. An administrator can define new user IDs, delete old IDs, and
    assign, change, revoke passwords and levels of authorization.

    - Web support for ESS Copy Services (PPRC and FlashCopy)


    #  7.2 Using the ESS Specialist


    The ESS Specialist interface (and the ESS Copy Services interface) consist of
    a set of Java applets, which are programs that are dynamically loaded by the browser,
    and execute within your browser. When you request a change to the configuration,
    the Java applets communicate with the microcode running on the ESS clusters to
    retrieve the current configuration data, submit the requested configuration change,
    and display the outcome of the request.


    You must use a browser that contains the proper Java Virtual Machine (JVM) implementation
    to support these applets. The browser software provided by different companies,
    and even different versions of the same browser, vary widely with respect to their
    JVM support. Consequently, not all browsers are capable of supporting the ESS
    Specialist or ESS Copy Services.


    The ESS Web interfaces support both the Netscape Navigator and the Microsoft Internet
    Explorer (MSIE) versions listed in Table 7-1.


    Table 7-1 Web browsers supported by ESS Web interfaces


    | Netscape level (See Note 1) | MSIE level (See Notes 2, 3, 4) |

    | Netscape 4.04 with JDK 1.1 fixpack | MSIE 4.x with Java Virtual Machine (JVM)
    4.0 or 5.0 |

    | Netscape 4.05 with JDK 1.1 fixpack | MSIE 5.x with Microsoft JVM 4.0 or 5.0
    |

    | Netscape 4.06 (no fixpack required) | |

    | Netscape 4.7x (no fixpack required) | |'
  merge: -1
  pgno: 178
- img_proc: true
  md: '| Netscape level (See Note 1) | MSIE level (See Notes 2, 3, 4) |

    |---|---|

    | Notes: | |

    1. The ESS Web interfaces do not support Netscape above version 4.7.x

    2. If your ESS is running with ESS LIC earlier than level 1.3.0 or SC01206, the
    performance of the ESS Web interfaces on MSIE 5.0 is slower than with Netscape.
    It is recommended that you use Netscape as the browser or to LIC level 1.3.0 or
    higher

    3. MSIE 5.3 with JVM 4.0 is supported with all levels of ESS code. However, it
    recommend that you change JVM 5.x to JVM 4.0 on the ESSNet machine to improve
    performance. It is not trivial to change the JVM to a lower level.

    4. The ESS Master Console running Linux does not support the MSIE browser. |


    # Using the ESS Specialist client from Linux


    In order to start and successfully work with the ESS Specialist client from a
    Linux workstation, you have to have a installed version of the Netscape Web browser.
    We used Netscape Version 4.79, which is available from:


    ```

    http://wp.netscape.com/download/archive/client_archive47x.html

    ```


    > Note: In preparation of this redbook, we have tried several different combinations
    of Web browsers, plug-ins, and Java virtual machines (e.g. Mozilla, Konqueror,
    Netscape, IBM, and Java JDKs). We were not able to get any combination of the
    more recent software to work properly. Our recommendation is to just use the older
    Netscape version that includes a supported JVM, which worked without any problems.


    # First logon


    When you open a Web browser and log on to your ESS Specialist for the first time,
    you will get prompted to accept the site certificate from the ESS. After you accepted
    the certificate you get a welcome screen, as shown in Figure 7-1, from where you
    can start the actual ESS Specialist Java client application.'
