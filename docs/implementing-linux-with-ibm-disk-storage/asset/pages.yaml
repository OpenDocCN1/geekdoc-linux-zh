    +   1. In the top row of icons, click the **host icon** that represents the host
    system to which you want to assign the new volumes. The host adapter ports that
    are connected to this host system become highlighted. If the Linux host has any
    volumes already assigned, the disk groups that contain those volumes become highlighted.
    You can select only one host system at a time for an addvolumes sequence. To refresh
    the view before selecting a different host system icon, click **Clear View** at
    the bottom of the panel.


    The host system that you select is highlighted in yellow and appears with a black
    background to indicate selection. The name of the host system appears in the Information
    box at the bottom right of the panel. A thin black line is drawn from this host
    system to one or more ports in the second row that is attached to this system.'
