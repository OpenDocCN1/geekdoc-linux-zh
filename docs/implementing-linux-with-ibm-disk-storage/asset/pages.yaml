  md: '# FASTt MSJ (Management Suite for Java)


    This chapter contains a description of the FASTt Management Suite for Java Diagnostic
    and Configuration Utility. FASTt MSJ software is used to manage paths available
    from fibre-attached hosts to storage.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# 10.1 FASTt MSJ


    If your installation uses the IBM FASTt Host Adapter, then you will use the IBM
    FASTt HBA driver. If you have multiple paths to your storage, this driver can
    provide a failover capability, the paths must be configured. This is the function
    of the IBMIT Management Suite Java (MSJ) Diagnostic and Configuration Utility.
    This tool allows you to view the current HBA configuration, nodes, LUNs, and paths.
    It will allow you to configure paths and perform some diagnostics.


    > Note: If you are not using IBM FASTt HBAs and the IBM driverJ, you can skip
    this part.


    When using two adapters, it is necessary to hide one path to the LUN away from
    Linux. This is necessary because, like most OSs, Linux does not support multipathing
    by itself. At boot time, the adapters negotiate the preferred path that will be
    the only visible one. However, with the management tool, it is possible to make
    an adequate configuration without getting the results of FC protocol negotiations
    and driver design. Additionally, it is possible to choose the LUNs for the OS.
    Also included is static load balancing that distributes access to the individual
    LUNs via several paths.


    FASTt MSJ has a GUI component. It also has an agent that runs on the host containing
    the HBAs. The agent, qlremote, is quite small but the GUI is rather large, allow
    sufficient space (say 50 MB) for unpacking and installing the product.


    # Installing FASTt MSJ


    Obtain the latest version of the IBM FASTt MSJ from the same Web location described
    in FASTt Storage Manager client: Getting started.


    The FASTt MSJ version is closely tied to the HBA version. Ensure that you have
    the correct version. Extract the gzipped tar file:


    ```

    tar zxf *.tgz

    ```


    This will extract the required files to ./FASTt_MSJ/Linux


    As root, install FASTt_MSJ using the following command:


    ```

    sh ./FASTtMSJ_install.bin

    ```


    You should see a screen similar to Figure 10-1.'
