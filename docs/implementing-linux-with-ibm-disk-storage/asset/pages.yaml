- img_proc: true
  md: 'Opening in 2003 were the announcement of the new Linux efforts, ranging from
    Linux supercomputing on demand, to bring Linux to consumer electronics such as
    PDAs and handheld computers through the definition of a reference installation
    and IBM software for Linux (Webphere Micro Environment, Power Manager, DB2®Everyplace™,
    Tivoli® Device Manager, and IBM''s Service Framework).


    In 2003 IBM announced its commitment to "work with the Linux community under the
    Common Criteria (CC) certification process for the Linux operating system early
    this year, and proceeded with a progressive plan for certifying Linux at increasing
    security through 2003 and 2004." With its delivery of enterprise middleware including
    DB2, Websphere, Tivoli and Lotus®, along with robust, secure, and scalable platforms,
    IBM also demonstrates its commitment to Linux in government, this completely spanning
    the marketplace with pervasive support for Linux at every level.


    # 1.5 Summary


    Linux is an efficient multi-tasking operating system that can run on a minimal
    amount of hardware by comparison to today''s standards. It can run very well on
    a 486 processor, for example. It is a multi-user system, and as such, offers various
    levels of built-in security. It is also a stable system that is capable of sustained
    up-time. For additional information, some further reading is:


    The Evolution of the UNIX Time-sharing System, Dennis Ritchie, ca. 1979

    (http://cm.bell-labs.com/cs/who/dnr/hist.html)


    Overview of the GNU Project, Free Software Foundation, ca. 1998

    (http://www.gnu.org/gnu/gnu-history.html)


    A Brief History of Hackerdom, Eric S. Raymond, ca. 1998

    http://www.tuxedo.org/es/writings/hacker-history/


    For more details on Linux in general, see:


    +   - Linux Online offers a large amount of information on available applications,
