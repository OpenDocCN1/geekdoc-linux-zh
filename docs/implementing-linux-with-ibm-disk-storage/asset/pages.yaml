  md: '# 7.2.6 Allocating storage for Linux


    Click **Add Volumes** at the bottom of the Open System Storage panel to create
    fixed-block volumes on the ESS for use by your Linux hosts. This section divides
    the task of assigning open-systems into two sections, for each panel. The first
    Add Volumes (1 of 2) panel opens as shown in Figure 7-8.


