    # 7.2.1 ESS attachment configurations


    ESS Specialist displays the Storage Allocation panel after you click Storage Allocation
    from the navigation frame, which is shown in Figure 7-3. The Storage Allocation
    panel contains a logical view of the components of the ESS facility. it shows
    the server''s logical configuration of host systems, host ports, storage adapters,
    arrays, and volume assignments. The Storage Allocation panel provides access to
    a graphical view and a tabular view of ESS components. The graphical view depicts
    the hardware components of the ESS with interconnecting lines to indicate a particular
    assignment or logical connection. The tabular view presents the same information
    in table format.


    ![](img/7df754bba6e7faadf914690e9e5ed087_182_0.png)


    Figure 7-3 Storage Allocation panel


    The screen contains the following elements:


    +   * The icons in the top row of the Storage Allocation-Graphical View represent
    the host systems that are attached to the ESS. Table 7-2 shows the types of host
    icons.'
