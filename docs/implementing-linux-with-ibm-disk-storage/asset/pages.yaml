    # 3.5.2 Multipath support


    Some storage devices allow operating systems to access device storage through
    more than one physical path, extending availability, and sometimes allowing better
    performance by permitting use of all paths in parallel. To use of these features,
    an operating system must be able to detect multipath devices and manage all access
    in a way that avoids data corruption.


    Currently, Linux for zSeries and S390 supports only the Enterprise Storage Server
    (ESS) through extensions to the Linux Logical Volume Manager (LVM). To use of
    LVM extensions, any device driver must provide one device node for every path
    that can be accessed independently (the device driver handles the path switching
    if the device architecture needs anything special for that purpose).


    Block-device managers (such as LVM, MD, or EVMS) take block devices and provide
    new logical ones after some transformation. This just requires the lower'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'device drivers to provide a separate device for every path so that the manager
    knows about the paths.


    Please refer to the *Device Drivers and Installation Commands* documentation on
    how to implement multipathing for Linux on zSeries.'
