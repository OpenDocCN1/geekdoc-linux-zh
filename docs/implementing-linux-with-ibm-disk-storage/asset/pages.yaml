  md: 'Select the adapter to change. Select Host Adapter Settings.


    +   - Loop reset delay - Change this setting to 8.

    - Adapter Port Name - Note this number as it will be required later for storage
    partitioning.


    Select the advanced adapter settings:


    +   - LUNs per target - This should be 0 (zero)

    - Enable target reset - This should be yes

    - Port down retry count - Change this to 12


    Repeat this process for any other HBAs in the server, save the settings, and exit
    to restart the server.


    #  5.6.3 Installing the Fibre Channel Host Bus Adapter driver


    Obtain the latest IBM FASIT HBA driver from IBM. The BladeCenter driver will a
    separate package from the xSeries driver.


    As mentioned earlier, two different packages exist for the IBM FASIT HBA family:


    +   - A fail-over (or multipath) device driver for FASST attachment

    - A singlepath driver for ESS attachment


    The procedure to install the sources is identical for both drivers.


    Copy the i2LXNX-<driver version>-fo-dist.tgz file to a folder on your system and
    type the following to extract the files:


    ```

    tar xzv *.tgz

    ```


    This creates an ./i2x00-<driver version> directory.


    Change to this directory and run the drvsetup script to extract the source:


    ```

    cd i2x00-<version>

    sh drvsetup

    ```


    Table 5-1 shows the contents of the driver archive folder.


    | | |

    |---|---|

    | drvsetup | Script file to copy driver files included in the driver source tgz
    |

    | i2lNXsrcrc-<driver version>.tgz | driver archive. |

    | libinstall | Script file to install/setup HBA API library. |'
