    S/390 Parallel Enterprise Servers G5 and G6


    +   - Driver 26, OSA microcode level: 4.25

    MCLs: F99904.032 and F99904.033 (available May 16, 2002)


    # VM/ESA and z/VM


    z/VM 4.3


    All necessary fixes and enhancements are included.


    z/VM 4.2'
