  md: 'Note: Before adding LUN (a synonym for volume when speaking of open-systems
    volumes), or in any way modifying the LUN assignments for a host system port,
    ensure that the affected LUNs are offline or not in use by any attached host system.
    After adding a LUN, it might be necessary to restart the attached host systems
    in order to establish connectivity to the added LUN.


    +   2. Select a highlighted host adapter port. The background of the port you
    select to black. Volumes are assigned to the selected host and are visible on
    all the ESS Fibre Channel ports that were defined for that. You need to select
    the highlighted ports associated with the attached host to limit the host''s access
    to those specific ports. A Fibre Channel attached host system shows a connection
    to all of its configured Fibre Channel adapters.


    After you select a port, all fixed-block disk groups are selected by default and
    are highlighted. This provides a quick overview as where the new volumes can be
    created. Optionally, select one or more fixed-block groups. The Information box
    on the right side of the panel summarizes the list of selected disk groups. If
    you select any groups, they will be the only ones used for the add-volume process.
    Alternatively, if you do not select any groups, the ESS will use all available
    groups for the add-volume process.


    To proceed click Next and the Add Volumes panel (2 of 2) opens as shown in Figure
    7-9:


    +   1. In the Available Free Space panel (at the top of the Add Volumes (2 of
    2) panel), select the table row that corresponds to the type of storage that you
    want to allocate. You must select a type for which the available capacity is greater
    than 0.


    The information in the table is based on the capacities of the storage areas,
    selected on the first Add Volumes panel. Each row in the table shows the available
    capacity for a specific storage type. Whether RAID 5 or RAID 10 is displayed in
    the table depends first on the storage types that are available for your ESS,
    and on what storage type you selected when you configured your fixed-block disk
    groups (see 7.2.5, "Configure RAID arrays" on page 169).


    The Available Capacity column indicates the total available space in the selected
    storage areas, and the Maximum Volume Size column displays the largest contiguous
    free space in the selected storage areas, by storage type. If you select particular
    disk groups on the Add Volumes (1 of 2) panel, the defined storage types available
    on those selected disk groups are reflected in the Available Free Space table.'
