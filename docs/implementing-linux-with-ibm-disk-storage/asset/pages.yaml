  md: '# # Implementing Linux with IBM Disk Storage


    ![](img/7df754bba6e7faadf914690e9e5ed087_307_0.png)


    **Your guide to Linux implementations on IBM EServers


    This IBM Redbook explains considerations, requirements, pitfalls, and possibilities
    when implementing Linux with IBM disk storage products. This redbook presents
    the reader with a practical overview of the tasks required for installing Linux
    on a variety of IBM @server platforms, and it introduces the people who are already
    familiar with Linux to the powerful IBM TotalStorage servers: ESS and FASIT. The
    book also provides the steps required to prepare the storage system for Linux
    host attachment.


    **Use Linux efficiently with FASST and ESS


    **Explore options relating to Linux in SANs


    Among things, we review the recently added support for FCP attachment when running
    SuSE Linux (SLES 8) in an LPAR or on a zSeries machine.

    On pSeries we cover the implementation of SLES 8, either natively or in a p690,
    and explain how to configure the Emulux Host Bus Adapter, for attachment to FASIT
    and ESS.


    For Intel based machines, we look at the implementation of Red Hat Enterprise
    AS 2.1 and SLES 8 on zSeries servers and BladeCenter; in addition, we explain
    how to set up the Red Hat High Availability cluster using external storage.


    The book also contains a chapter on the VMware ESX Server, focusing on the practical
    aspects of its implementation and configuration with external storage.


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE

    The IBM Technical Support Organization Experts from IBM, Customers and Partners
    from around the world create timely information based on realistic scenarios.
    Specific recommendations are provided to help you implement IT more effectively
    in your environment.


    For more information: ibm.com/redbooks


    SG24-6261-01 IBM 0738453471'
