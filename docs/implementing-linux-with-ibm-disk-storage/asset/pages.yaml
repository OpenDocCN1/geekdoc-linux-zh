  md: '# 11.3.3 Setup disk space for VMs


    After reboot, login to the management console again to start setting up disk space
    for the virtual machines.


    > **Important:** This is a brief and summarized description. For details please
    refer to the *VMware ESX 1.52* server manual.


    For testing environment, we define three LUN on the FASIT 700. Next, following
    instructions given in the previous section, we install and load an appropriate
    HBA driver and connect the server to the SAN. Figure 11-17 shows, for our installation,
    the three Ls are correctly detected as physical drives.


    To partition these drives you have two options:


    +   **Create New Partition** Partitions the disk automatically; additionally a
    partition for a VMware dump (crash dump space for VMware) is created (Figure 11-18
    on page 243)


    +   **Expert Mode Fdisk** Allows you to specify exactly, and based on your own
    input, how to partition the volumes (Figure 11-19 on page 244)


    In addition to a label, you can specify the VMFS accessibility by three levels:


    +   **Private** Only the specified virtual machines can access the partition.


    +   **Public** The partition is available to multiple physical servers and their
    virtual machine, but only to one server at a time.


    +   **Shared** Shared access to the partition is possible; this setting is required
    for shared disk solutions like fail-over clustering between virtual machines.


    The menu in Figure 11-9 on page 235 shows that you can create swap space for the
    virtual machines (Figure 11-20 on page 244). This feature allows you to assign
    more memory to your virtual machines than is physically available on the server.
    Please keep in mind that intensive swapping negatively impacts the system performance.'
  merge: -1
