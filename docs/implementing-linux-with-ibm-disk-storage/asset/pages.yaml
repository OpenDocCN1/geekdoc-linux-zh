  md: 'enforce the implementation of this hierarchy by imposing physical constraints
    on the segments (files cannot span partitions) and allowing control over the access
    protocols (partitions are a convenient unit of access control as well as share
    policies, just as within Windows).


    For a Linux example, /usr could be sharable and static, while /boot would be static,
    unshareable. Similarly, /var/mail may be sharable and variable, while /var/lock
    would be unshareable.


    Regardless of the division policies, all branches of a hierarchical structure
    eventually share a common point of origin, called the "root" (represented by a
    forward slash, ''/''). The root partition contains enough information to boot,
    repair, and recover a system. Because system installation and recovery may require
    booting from some media, the root partition may be physically quite small. Essentially,
    the root partition contains directory entries, some of which may (or) should be
    partitions. The hierarchy is then assembled using the concept of "mounting" to
    be discussed in Appendix, "The file system /etc/fstab on page 262.


    You can explore the rationale in more detail depending on your interest⁵ but suggest
    suggesting partitions and size ranges for the following points:


    +   - Small to medium (tens to 100s of MB)

    - /usr - Large (several GB)

    - /opt - Medium to large (100s of MB up to several GB)

    - /var - Medium (100s of MB)

    - /tmp - Medium (100s of MB) or larger, depending on application requirements

    - /home - Very small to large, depending on user private space requirements


    A separate partition not shown here (because it contains no file hierarchy) is
    declared for system swap, usually 1 or 2 times the size of system memory. Also,
    a small partition may be mounted on /boot for ease of location on systems with
    BIOS constraints addressing limitations.


    There are some interesting constituents of the file hierarchy. We have briefly
    discussed the "dev/ directory,"⁶ where device nodes are conventionally aggregated.
    In "identifying your SCSI storage" on page 259 we will introduce the /proc pseudo-hierarchy.
    These are not partitions; they merely exploit the "everything-looks-like-file"
    paradigm discussed above. But every partition where you want to write a file hierarchy
    needs to be allocated a branch of the tree that begins with "root" (/). Their
    names can be arbitrary (although conventions exist), and they are managed via
    a table of entries in the plain-text file /etc/fstab. Before discussing the content
    of that file in "The file system /etc/fstab"


    > ⁵ ibid.


    > ⁶ Linux Allocated Devices, http://www.kernel.org/pub/linux/docs/device-list-devices.html


