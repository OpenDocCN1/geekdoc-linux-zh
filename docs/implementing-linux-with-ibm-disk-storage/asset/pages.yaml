    # Configuring SDD at system startup


    You can set up SDD to automatically load and configure when your Linux system
    boots. SDD provides the startup script **sdd.rcscript** file in the /opt/IBMsd/bin
    directory and creates a symbolic link to /etc/init.d/ssd.


    The following steps are necessary to launch SDD on your Red Hat system startup:


    +   1. Log on to your Linux host as the root user.


    +   2. Type **chkconfig --level X sdd** to enable run level X at startup (where
    X represents the system run level).


    +   3. Type **chkconfig --list sdd** to verify that the startup option is enabled
    for SDD configuration.


    +   4. Restart your host system so that SDD is loaded and configured.


    +   5. If necessary, you can disable the startup option by typing **chkconfig
    --level X sdd** off.


