    APAR: VM63034, PTF: UM30290


    # FCP support


    FCP and SCSI controllers and devices can be accessed by Linux for zSeries with
    the appropriate I/O driver support. Linux may run either natively in a logical
    partition, or as a guest operating system under z/VM Version 4, Release 3.


    > Note: z/VM Version 4, Release 3 is required to support FCP for Linux guests.
    However, z/VM itself does not support FCP devices.


    # 3.2.3 Connection requirements


    This section describes the connection requirements, such as console and network
    access needed to install SuSE Linux for zSeries.


    Access to the Hardware Management Console (HMC) or a network connection to a virtual
    console in z/VM is needed to perform the installation. The intended use of the
    console is solely to launch the Linux installation. After Linux is running, a
    Telnet connection directly to Linux for S/390 to logon to a Linux command shell
    and other applications.


    For the Linux system a TCP/IP network connection is required to get files from
    the installation server and Telnet into the Linux system. The connection can be
    one of the following:


    +   * OSA (OSA-2, OSA Express)

    * CTC (virtual or real)

    * ESCON channels

    * PCI adapter (emulated I/O, only on MP3000)


    All connections require the correct setup on both Linux for zSeries and the remote
    system, and a correct routing between ends.


    Since the installation is done via the network, you need an installation server,
    which can access the installation CDs either via FTP, NFS, or SMB.


    Installing SuSE Linux Enterprise Server via non-Linux based NFS or FTP, can cause
    problems with the NFS/FTP server software. Especially Windows standard FTP server
    can cause errors, so we generally recommend that you install via SMB on these
    machines.


    To connect to the SuSE Linux Enterprise Server installation one of the following
    methods is required:'
