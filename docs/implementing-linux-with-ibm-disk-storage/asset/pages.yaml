  md: '# 5.6.4 Loading the FASST HBA driver


    The following sections explain how to load the FASST HBA driver for Red Hat and
    SuSE respectively.


    Red Hat

    Edit /etc/modules.conf to ensure that the IBM FASST modules are loaded after any
    local SCSI module. Note in the example that the ServeRAID module, ips, is loaded
    before the IBM FASST module. Your modules.conf file should look similar to the
    following:


    ```

    alias eth0 bcm5700

    alias scsi_hostadapter ips

    alias scsi_hostadapter2 qla2300

    alias scsi_hostadapter3 qla2300

    ```


    The following line should also be added in order to support more than one SCSI
    device per adapter (Red Hat Enterprise Linux supports up to 40 LUNs by default):


    ```

    options scsi_mod max_scsi_luns=128

    ```


    Save modules.conf and exit. Run depmod a update the modules.dep file.


    You can load the fibre HBA module manually by typing the following:


    ```

    modprobe qla2300

    ```


    Alternatively, you can have it loaded at boot time by having it as part of the
    ramdisk image. Build a random ramdisk image with the type:


    ```

    mkinitrd /boot/<hostname>.img <kernel version>

    ```


    In our case, we typed the following:


    ```

    modprobe /initrd-storage-2.4.9-e.12summit.img 2.4.9-e.12sum

    ```


    Edit /etc/grub.conf so that the boot loader knows to use the new ramdisk image.
    The relevant kernel entry to load the new ramdisk image. At this point, you can
    also edit the default to load your new kernel and ramdisk image as default. It
    would be advisable to test that it boots successfully before changing the default.


    Shut down the server and connect the SAN or bring the SAN online. Once, bring
    the server back up. (As an alternative to reloading the IBM FASST module, modprobe
    -r qla2300) attach the SAN, and reload the IBM FASST module (modprobe qla2300).


    If you will attach to FASST, you may proceed to 5.8, "Configuring FASST" on page
    137.'
