    The /etc/sysconfig/rawdevices file has to be edited on both systems for the primary
    and backup Quorum partitions. Adding the following lines to the file where X =
    device letter (Figure 6-4):


    ```

    /dev/raw/raw1 /dev/sdX1

    /dev/raw/raw2 /dev/sdX2

    ```'
