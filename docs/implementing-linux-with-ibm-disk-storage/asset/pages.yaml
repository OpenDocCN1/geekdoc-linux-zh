    # 5.6.5 Attaching to ESS


    Linux drivers do not offer a multipath driver that can be used when attaching

    to ESS as is the case with FASTI. However, one can achieve redundant path

    and load balancing by using a multipath extension called Storage Device Driver

    (SDD), available from IBM. The particularity and advantage of SSD is that it

    operates independently of the HBA device driver (SDD is a pseudo device

    driver). Therefore, the following applies for any HBA compatible with ESS.


    The SSD introduces a new tree in the /dev file system with the name /vpath.

    is is one reason why SSD does not support LVM. In LVM the supported

    components of the /dev directory are hard coded.


    SSD consists of a driver and a server daemon. The server daemon runs

    in the background at all times (it starts automatically after the SSD driver

    package is installed). It scans paths at regular intervals for an indication of


