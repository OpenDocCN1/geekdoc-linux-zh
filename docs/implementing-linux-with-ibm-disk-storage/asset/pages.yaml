    # Partitioning SDD vpath devices


    Disk partitions are known as logical devices. SDD for Linux allows configuration
    of whole devices only. The SDD naming scheme for disks and disk partitions follows
    the standard Linux disk naming convention. The following description illustrates
    the naming scheme for SCSI disks and disk partitions:


    +   - The first two letters indicate the SCSI device.

    - The next letter (or two letters), a-z, specifies the unique device name.

    - A number following the device name denotes the partition number. For example,
    /dev/sda is the whole device, while /dev/sda1 is a logical device representing
    the first partition of the whole device /dev/sda. Each device has its own owner
    and minor number.


    Similarly then, a specific device file (/dev/vpathX is created for each supported
    multipath SCSI disk device (where X represents the unique device name; as with
    sd devices, X may be one or two letters).


    Device files (/dev/vpathXY are also created for each partition of the multipath
    device (where Y represents the partition number). When a file system or user application
    wants to use the logical device, it should refer to /dev/vpatha (for example,
    /dev/vpath1 or /dev/vpathbc7) as its multipath logical device. All i/o management,
    statistics, and failover processes of the logical device follow those of the whole
    device.


    The output in Figure 5-22 on page 134 demonstrates how the partitions are named.


    > Note:

    - SDD does not support the use of root (/), /var, /usr, /opt, /tmp and partitions.

    - For supported file systems, use the standard UNIX fdisk command to partition
    vpath devices (e.g. fdisk /dev/vpath).


    To partition the new device please refer to Appendix A, “Storage from the OS view”
    on page 253. Please keep in mind that you have to start fdisk with the proper
    vpath as parameter (e.g. fdisk /dev/vpath).'
