    # 3.3 Configuration used for this redbook


    For tests we used a z800 2066-004 connected to a SAN 2032-064 (McData) connected
    to the ESS 2105-800. The configuration is shown in Figure 3-9.


    The z800 was partitioned in several LPARs, one of them running z/VM with Linux
