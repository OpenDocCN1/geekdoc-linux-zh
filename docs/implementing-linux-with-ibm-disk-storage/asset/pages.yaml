- img_proc: true
  md: 'The modules should be loaded in the order listed. All modules can be loaded
    with modprobe. Further SCSI modules exist for other SCSI devices as st tape support,
    sr_mod for CD/DVD (read only) support. They have been tested to work with different
    devices, but will not be discussed in this book. Please refer to the Redpaper
    Getting Started with z Fibre Channel Protocol, REDP-0205.


    All modules, except zfcp, can be loaded without parameters. For the zfcp module,
    parameters for the mapping of the FCP devices on the ESS are required. The parameters
    needed for device are:


    +   - The device number of the FCP port on the zSCSeries

    - The SCSI ID starting at 1

    - WWPN of the ESS FC port

    - The SCSI LUN within Linux starting at 0

    - The FCP LUN of the target module to the ESS


    The format of supplying parameters to the module is as follows:


    ```

    map="devno SCSI_ID:WWPN SCSI_LUN:FCP_LUN" such as:

    map="0x0600 1:0x505076300c89589 0:53310000000000000"

    ```


    To add more one device to the module, simply add more statements to the parameter
    line, separated by semicolons. The next example shows the load of the modules
    (omitting the qdio module, because it is loaded already used by the OSA Express
    adapter in our installation) for one volume.


    Example 3-8 Load scsi and zfcp modules


    ```

    vmlinux:~# modprobe scsi_mod

    vmlinux:~# modprobe zfcp map="0x0600 1:0x505076300c89589 \

    0:5x331000000000000"


    vmlinux:~# cat /proc/scsi/scsi

    Attached devices:

    Host:scsi0 Model: 21 Id: 01 Lun: 00

    Vendor: IBM Model: 2105800  Rev: .101

    Type: Direct-Access  ANSI SCSI revision: 03

    vmlinux:~# modprobe sd_mod

    vmlinux:~# cat /proc/partitions

    ```


