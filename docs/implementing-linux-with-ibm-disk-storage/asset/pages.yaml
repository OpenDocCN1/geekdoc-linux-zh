  md: '# 3.1.4 zSeries and storage: Summary


    To summarize, classical zSeries operating systems as z/OS™ and z/VM™ were designed
    for use only with storage controllers that support the I/O protocols defined by
    z/Architecture. This changed with the advent of Linux for zSeries, since its I/O
    component is oriented towards SCSI protocols. Lacking the capability to access
    SCSI-based storage devices on a zSeries system, it was necessary to add specific
    support for Linux for zSeries to enable it in a CCW-based zSeries I/O environment.
    However, this additional layer in Linux for zSeries is unique to zSeries, and
    does not allow it to exploit storage subsystems and applications that are dependent
    on a SCSI attachment. For this reason, an FCP attachment capability has been added
    to the z800 and z900 systems, allowing the attachment of SCSI-based storage controllers
    and enabling Linux for zSeries to access these controllers in the Linux-standard
    manner. The Figure 3-7 shows the differences/format translation between the two
    access methods.


    # DASD access translations


    ![](img/7df754bba6e7faadf914690e9e5ed087_54_0.png)


    # 3.2 System requirements


    Linux for zSeries is supported on the z800 and z900 models and on the predecessor
    S/390 models G5, G6, and MP3000, which are shown in Figure 3-8.'
