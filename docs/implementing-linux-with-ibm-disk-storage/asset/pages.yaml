- img_proc: true
  md: '# Table 7-2 Host icons and their descriptions


    | Host icon | Description |

    |---|---|

    | ![image](path_to_image1) | A rectangular icon divided by two vertical lines
    represents a S/390 or zSeries host. It can also represent a Linux partition on
    that host. See Note 1. |

    | ![image](path_to_image2) | An icon of a display screen next to a box represents
    an AS/400® or iSeries host, except for Linux partitions within the host (UNIX
    icons). See Note 2. |

    | ![image](path_to_image3) | An icon of a display screen on top of a thin box
    represents a Microsoft Windows, Linux (x86), or Novell host. See Note 2. |

    | ![image](path_to_image4) | An icon of a display screen and a keyboard represents
    a UNIX host, such as Sun Solaris, IBM RS/6000, HP 9000, and Linux partitions in
    iSeries and pSeries hosts. See Note 2. |

    | ![image](path_to_image5) | A low, wide rectangular icon represents a Cisco iSCSI
    gateway (the SN 5420). See Note 2. |


    +   Notes:

    1. When the icon has a Ficon or Escon label, it is a pseudo-host representing
    all attached S/390 and zSeries hosts that are not yet defined to the ESS, attached
    through FICON or ESCON protocol, respectively.

    2. When the icon has an Anonymous label, it represents open systems connected
    through the Fibre Channel protocol.


    When one of the four types of icons represents a host not explicitly defined to
    the ESS, but which has access to one or more volumes configured on the ESS, the
    icon is called a "pseudo-host." ESS Specialist adds a pseudo-host whenever you
    configure the LUN access mode for a Fibre Channel port to access-any mode.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'The icons in the second row represent the host adapter cards installed in the
    ESS. The lines between them indicate the four host adapter bays in the ESS. Each
    of the bays has a capacity of four host adapter cards. Depending on how many host
    adapters you purchased, the bays may not be fully populated. Each host adapter
    card can be one of three types shown in Table 7-3, and cards of all types can
    be mixed in any order in any of the bays.


    # Table 7-3 Host adapter types


    | Adapter icon | Description |

    | --- | --- |

    | | ESCON adapter card (2 ports per card). |

    | | Fibre Channel adapter cards (1 port per adapter, using FICON or FCP protocols)
    |

    | | SCSI adapter card (2 ports per adapter). |


    Note that the ESCON and SCSI adapters contain two ports per adapter. The icons
    for these adapters are divided in half so that clicking on the left side of the
    adapter selects port A and clicking on the right side of the adapter selects port
    B. Fibre-channel adapters have only one port.


    The graphical area below the row of host adapter icons displays the relationship
    of storage areas in the two ESS clusters. It is split into two columns each representing
    a cluster, and each row in each column has an icon on the outside of the row that
    represents a device adapter card. The lines between the device adapter icons represent
    the connections between the disk groups supported by the device adapter cards.


    There are normally four pairs of device adapter cards installed in an ESS, four
    cards in each cluster. The ESS uses SSA device adapters, each of which supports
    SSA loops.


    The disk groups are the rectangles on the SSA loops. There are normally 16 disk
    groups installed in an ESS, and two disk groups on each SSA loop. The minimum
    ESS configuration is four disk groups, the maximum configuration is'
  merge: -1
  pgno: 184
- img_proc: true
  md: '48 disk groups (that is, six disk groups per SSA). The disk groups are usually
    split evenly among the two clusters.


    The individual disk groups are drawn as small rectangles on the SSA loops and
    between the SSA adapter pairs of the clusters. When you select a host and associated
    port, each associated disk group is filled with a color-coded bar graph representing
    the space utilization within that group. The color coding for the bar graph is
    described in the legend box on the right side of the panel, has the following
    meaning:


    # Violet


    Host Storage: Violet represents the storage space occupied by volumes that are
    assigned to the currently host system.


    # Red


    Assigned: Red represents the storage space occupied by volumes that are assigned
    to one or more host systems, but not to the currently selected host system.


    # Yellow


    Unassigned: Yellow represents the storage space occupied by volumes that are not
    allocated, but not currently assigned to any host systems. This is usually a temporary
    condition, since unassigned space is essentially wasted space.


    # Green


    Not allocated: Green represents free space, that is, storage where no volumes
    have been allocated.


    At the bottom of the Storage Allocation-Graphical View are two buttons:


    +   - S/390 Storage - This button accesses the S/390 Storage panel, which you
    use for configuring storage for data in count-key-data (CKD) format attached to
    S/390 and ZSeries (mainframe) host systems.


    +   - Open Systems This button opens the Open Systems Storage panel, which you
    use for configuring storage for data in fixed-block (FB) format attached to UNIX-based,
    Intel-based and AS/400 host systems.


    For this book we use the Open Systems Storage function, since we concentrate on
    attachment of Fibre Channel series for all the Linux platforms. Even though Linux
    for zSeries S/390 storage (CKD) as well as IPL (boot) from, the necessary steps
    to configure fixed block storage on the ESS are the same as for the other platforms.
    The explanation of how to configure block storage is beyond the scope of this
    book. Please refer to the IBM TotalStorage Enterprise Server Web Interface User''s
    Guide, SC26-7448, for information on how to configure S/390 storage.


    164 Implementing Linux with IBM Disk Storage'
  merge: -1
  pgno: 185
