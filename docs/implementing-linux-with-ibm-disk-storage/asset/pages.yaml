  md: '# Implementing VMware


    VMware ESX Server is virtualization software that enables the deployment of multiple,
    secure, independent virtual machines on a single physical server. The purpose
    of this software is to provide an efficient and high performance platform for
    consolidation and accelerated deployment of services.


    This chapter starts with a brief overview of VMware and the VMware ESX architecture,
    then focuses on the practical aspects of implementing VMware ESX 1.5.2 server
    on IBM eServer xSeries.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 11.1 Introduction


    VMware, Inc. was founded in 1998 to bring mainframe-class virtual machines to
    industry-standard computers. It offers the following products:


    +   VMware Workstation: This product allows you to run multiple operating systems
    and their applications simultaneously on a single Intel Based PC.


    +   VMware GSX Server: GSX runs in a server OS, like Linux or Windows Server Editions;
    it transforms the physical computer into a pool of virtual machines. Operating
    systems and applications are isolated in multiple virtual machines that reside
    on a single piece of hardware. System resources are allocated to any virtual machine
    based on need, delivering maximum capacity utilization and control over computing
    infrastructure. It can run up to 64 virtual machines (provided that the server
    hardware can sustain the load).


    ![](img/7df754bba6e7faadf914690e9e5ed087_247_0.png)


    Figure 11-1 VMware ESX server


    The VMware ESX server can be used as platform for server consolidation. Many Intel
    based server are often used for services that do not fully utilize the capacity'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'of the machine. Most systems run with an average system load of less than 25%
    of that capacity. Servers like the x440 with up to 16 processors offer enough
    power and scalability to move such services on one system.


    Because VMware emulates the hardware, different operating systems, and the applications
    they run are presented with a consistent set of virtual hardware by each VM, irrespective
    of the physical hardware available in the system. VMs have no dependency on the
    physical hardware, and as such do not require device drivers specific to the physical
    hardware. This improves the mobility of a VM. An installation done in a virtual
    machine can be moved to another server.


    # 11.1.1 VMware ESX architecture


    The design of the VMware ESX Server core architecture implements the abstractions
    that allow hardware resources to be allocated to multiple workloads in fully isolated
    environments.


    The key elements of the system design are:


    +   - The VMware virtualization layer, which provides the idealized environment
    and virtualization of underlying physical resources.

    - The resource manager, which enables the partitioning and guaranteed delivery
    of CPU, memory, network bandwidth, and disk bandwidth to each virtual machine.

    - The hardware interface components, including device drivers, which enable hardware-specific
    service delivery while hiding hardware differences from other parts of the system.


    VMware ESX Server incorporates a resource manager and a Linux service console
    that provides bootstrapping, management, and other services.


    While the service console is basically used for administration purposes, the resource
    manager orchestrates access to physical resources and maps them to specific VMs.
    For instance, physical disks are virtualized. Virtual disks are created as regular
    files in the VMFS file system, and assigned to the VMs. Virtual disks are presented
    to the VMs as SCSI drives connected to a SCSI adapter.


    This is the only disk storage controller used by the guest operating system, despite
    the wide variety of SCSI, RAID, and Fibre Channel adapters that might actually
    be used in the system.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 11.1.2 IBM and VMware


