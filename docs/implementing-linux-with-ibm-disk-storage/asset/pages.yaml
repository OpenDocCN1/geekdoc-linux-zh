    The final step is writing a file system to the partition (if it is not used as
    raw device). To make a ext2 file system, for example, you simply have to enter
    the command mkfs -t ext2 /dev/sd* where ? is the device number and * the partition
    number. In order to mount it, you need a mount point which you can create by the
    command mkdir /path/my-mount-point. After you have mounted the drive by mount
