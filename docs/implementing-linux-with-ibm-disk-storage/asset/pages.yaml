  md: '# 1.1 Historical perspective


    Years ago when the time came to install an operating system, a good plan was to
    have some activity to occupy one''s time during the tedious phases. With the advent
    of fast processors, high-bandwidth networks, and high-speed drives for installation
    media, the luxury of "popping in a tape and going out to lunch" has been reduced
    to "kickstart the installation and read the splash screens for ten minutes." Readers
    may choose to save this chapter as a possible diversion during these-shorter installation
    periods.


    Nearly everything one reads about Linus nowadays begins with the ritual invocation
    of "... an operating system created in 1991 as a hobby by Linus Torvalds at the
    University of Helsinki..." While this is true, it does not justice to the significance
    of the work and its broad implications for today''s implementers. We know that
    Linus refers to a UNIX-like operating system, so let us begin with a brief overview
    of the development of portable operating systems and open source, to the context
    in which Linus evolved.


    # 1.1.1 UNIX and the culture of collaboration


    In 1969, several AT&T Bell Labs employees¹ began work on an operating system (OS)
    that would come to be UNIX. A significant novelty of their development was that
    the OS was portable across hardware platforms. Prior to this, it was more typical
    to emulate the (usually) older hardware on a new system, so the OS would run unchanged,
    or to rewrite the operating system completely for the alternate hardware. Such
    portability was achievable only through writing most of the OS in a higher level
    language "above" the hardware. Unlike an OS written in assembly language for a
    particular architecture, this abstraction² and the language ("C") they developed
    to implement it permitted the study of their OS without much regard to hardware
    specifics, and by 1976 UNIX was being taught in classes on operating systems at
    the university² level.


    At the time, AT&T, for various legal reasons, was permitting free academic access
    to the source code to UNIX while charging over $20,000 (in 1976 dollars!) AT&T
    halted publication of the source code in university texts as this revealed proprietary
    Bell Labs code. The era of collaborative programming had arrived.


    +   1 Ken Thompson, Dennis Ritchie, and J.F. Ossanna

    2 For an alternative view of this principle, see The Linus Edge. Linus Torvalds,
    in Open Sources: Voices from the Open Source Revolution, O''Reilly, 1999 ISBN
    1-56592-582-3

    3 Prof. John Lions, University of New South Wales, Australia


    2 Implementing Linux with IBM Disk Storage'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# 1.1.2 GNU and free software


    In the US, the academic variant of interest became the Berkeley Systems Distribution
    (BSD),⁴ where virtual memory and networking were added. These advancements permitted
    large collaborative projects with contributors scattered throughout the world.
    Lawsuits eventually ensued among AT&T, the Regents of the University of California,
    and other parties over access to and distribution of the OS source code. Such
    constraints on intellectual property rights to code, along with commercialization
    of academic artificial intelligence projects in the late 1970s and early 1980s,
    provided strong motivation for researchers⁵ from the Artificial Intelligence Laboratories
    at the Massachusetts Institute of Technology to write an operating system that
    was both portable and also would be licensed in a manner that would prevent its
    constraint by intellectual property claims.


    The new OS was be named GNU, a recursive acronym for "GNU’s Not UNIX." This work
    would be "copylied" instead of copyrighted; licensed by the GNU Public License⁶
    (GPL), which stipulates that all programs run under or derived from GNU must have
    their source code published freely, relinquishing rights of control while maintaining
    rights of ownership. This was the birth of free (in freedom) software, contrast
    to software in the public domain.


    By this time, vendors such as Sun, Hewlett-Packard, and IBM had proprietary offerings
    derived from licensed AT&T UNIX that were giving popularity with corporate customers.
    The nascent GNU effort began by making tools such as editors, compilers and file
    utilities available in source form that could be compiled and executed on any
    platform, standardizing and improving those offered by commercial vendors. Around
    1990, programmers contributed a nearly complete operating environment to GNU,
    with the exception of the kernel. The GNU kernel was to be based on a microkernel
    architecture for improved portability. This approach required an (arguably better)
    architecture completely different from that of a monolithic kernel. The GNU kernel
    project is known as the Hurd. In words of its principal architect:


    > "The Hurd project began before Linux was a twinkle in Linux Torvalds’ eye, but
    because it is a more challenging task, and because we were less adopting large-scale
    volunteer excitement, the Linux kernel was developed and deployed much sooner.\"


    ⁴ Twenty Years of Berkeley UNIX: From AT&T-Owned to Free Redistributable. Marshall
    Kirk McKusick, in Open Sources: Voices from the Open Source Revolution, O''Reilly,
    1999 1-56592-582-3

    ⁵ The GNU Operating System and the Free Software Movement. Richard M. Stallman,
    ibod.

    ⁶ Details at the Free Software Foundation, http://www.fsf.org/licenses/licenses.html

    ⁷ Thomas Bushnell, BSG, in a letter to Technology Review, March/April 1999


    Chapter 1. Introduction to Linux 3'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.1.3 Linux


    With the withdrawal of AT&T source code from the university environment, and the
    BSD operating system mired in legal challenges by AT&T to its claim to be unencumbered
    by proprietary code, a small scale, UNIX-skeleton of an operating system called
    Minix was published in a text to be used as a teaching tool. He decided to write
    a UNIX-like OS with improved functionality over that of Minix to run on readily
    available personal computers. His purpose was to teach himself Linux Torvalds
    enters the story. his understanding of operating system design. He and colleague
    Lars Wienius published his source code under the GPL for public comment, and Linux
    was born.


    Linux was a kernel without outlets, GNU was an operating environment lacking a
    finished kernel, and unencumbered non-kernel BSD pieces were available to complete
    the picture. In short order the components were combined with installation and
    maintenance tools and made available by distributors; the first serious note being
    Slackware in 1993, followed by many others, making the GNU/Linux (or simply Linux,
    as it has come to be known) combination readily available. In only a few years,
    a worldwide community evolved, comprised of programmers and users attracted by
    the reliability and flexibility of this “free” operating system.


    The term "open source" began to replace the "free software" as the commercial
    adoption of GNU/Linux grew. There is in fact a difference, upon which hinges the
    fate of commercial ventures in this arena.


    # 1.2 Open source


    There is a difference between open source and the GNU General Public License as
    noted on the GNU Web site (http://www.gnu.org). Linux was developed under GNU,
    which has articulated a philosophy that defines “free code” – the user’s right
    to use the code – rather than defining what they cannot do, which is the case
    with proprietary software. This license allows the user to alter, distribute,
    and even sell the code covered under its license as long as they allow those to
    whom they distribute the code to do the same.


    > 8 Dr. Andrew S. Tannenbaum, Vrije Universiteit, Amsterdam, The Netherlands

    9 compiled by Patrick Volking

    10 http://counter.li.org estimates 18 million Linux users as of April 2003

    11 e.g., X86 by xFree86 - http://www.xfree86.org/pipermail/forum/2003-March/000191.html
    or the evolution of Cygnus Support


    4 Implementing Linux with IBM Disk Storage'
