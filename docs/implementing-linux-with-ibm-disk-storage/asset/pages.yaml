- img_proc: true
  md: '# 4.1 Introduction to pSeries and Linux


    The pSeries is one of IBM''s key solutions to fit a variety of customers needs.
    The pSeries presents a full range of servers from entry deskside models to high-end
    enterprise models with LPAR capabilities.


    Linux for pSeries is a key element of the IBM Linux strategy. IBM is working closely
    with the Linux community to increase performance, scalability, reliability, and
    serviceability to match the strengths of pSeries servers (see Figure 4-1).


    To make it easy to get started with Linux for pSeries, IBM has introduced a number
    of pSeries Linux ready Express Configurations. These systems represent some of
    the most popular configurations of the p630 and p650 systems. They are provided
    without an AIX® license and offer great savings with the ability to add additional
    features.


    ![](img/7df754bba6e7faadf914690e9e5ed087_95_0.png)


    Figure 4-1 pSeries models supporting Linux


    Linux for pSeries is especially compelling for solutions requiring a 64-bit architecture
    or the high-performance floating-point capabilities of the processor.


    In addition, the logical partitioning LPAR capabilities of the pSeries make it
    possible to run one or more instances of Linux along with AIX (i.e. zero or more
    Linux partitions along with zero or more AIX partitions). This enables the'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'consolidation of workloads from several separate servers to a single system.
    Since the partitioning is controlled by the hypervisor firmware and the Hardware
    Management Console, AIX is never required to run Linux. LPAR capabilities also
    provide a low-risk way to begin developing and deploying Linux system-ready applications
    as desired while retaining the enterprise-wide capabilities of AIX for mission-critical
    or highly-scalable workloads. Since Linux does not currently scale to efficiently
    handle large SMP systems, LPAR also allows large pSeries systems to be partitioned
    to Linux workloads.


    It should be noted that with AIX 5LT™, IBM introduced the AIX Toolbox for Linux
    applications. This set of tools allows you to recompile Linux source code under
    AIX, offering the possibility to run applications developed on Linux while retaining
    the more advanced features of AIX.


    For an overview of what pSeries models are currently supported by what Linux distributions,
    see:


    http://www.ibm.com/servers/eserver/pseries/hardware/linux_facts.pdf


    In this redbook, our focus is on SuSE SLES8 / UnitedLinux 1.0.


    > Note: For the latest information on pSeries and Linux in general, refer to:

    http://www.ibm.com/eserver/pseries/linux


    # 4.2 Requirements


    Attachment to storage systems in this book was still under test at the time of
    writing. If you plan to use scenarios from this book, please verify first that
    these configurations have now been certified by IBM.


    # 4.2.1 Hardware requirements


    In general, the SuSE Linux Enterprise Server runs on pSeries systems natively.
    You can find additional information about the supported hardware and technical
    issues by consulting the following Internet pages:


    http://www-i.ibm.com/servers/eserver/pseries/linux


    http://www.suse.com/us/business/products/server/sles/i_psseries.html'
  merge: -1
