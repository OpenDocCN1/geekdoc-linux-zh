  md: 'To test the module, load it using the command insmod lpfcddd


    In order to load the module with the modprobe command you have to do the following:


    +   1. Add the line alias scsi_hostadapter lpfcddd to the file /etc/modules.conf


    +   2. Run the command depmod -a to make the module dependencies.


    +   3. Change the kernel append append="max_scsi_luns=128" (this allows the kernel
    to support up to 128 LUNs, default is 0!)


    To start your system with the driver available at boot time, you have to build
    an appropriate initial ramdisk:


    +   1. Add the name of the module to the file /etc/systemconfig/kernel


    +   2. Rebuild your ramdisk with the command mk_initrd


    +   3. Edit the file /etc/lilo.conf and add the configuration including the name
    of the initial ramdisk (see Example 4-1). Do not forget to launch lilo to commit
    the changes.


    Example 4-1 Adding initial ramdisk to lilo.conf


    ```

    # Generated by YaST2

    default=linux

    timeout=100

    boot=/dev/sda1

    activate


    image=/boot/mlinuz-kernel_version

    label=new_label

    root=/dev/sda8

    initrd=/boot/new_image_filename

    read-only

    append="max_scsi_luns=128"

    ```


    After reboot, the driver is loaded. For details on how to make the storage usable
    for Linux, please refer to Appendix A, "Storage from the OS view" on page 253.'
