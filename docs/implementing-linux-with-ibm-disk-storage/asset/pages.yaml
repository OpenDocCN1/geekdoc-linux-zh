    To make the mount persistent, make an entry in /etc/fstab.


    To promote a new lun to the /proc file system from the command, use the following
    command:


    ```

    echo "scsi add-single-device $host $channel $id $lun" > /proc/scsi/scsi

    ```


    This is the proper way if you cannot afford to unload the driver module or reboot
    the system.


    # The file system table /etc/fstab


    Mounting a file system is nothing more than attaching a branch to the file hierarchy,
    where the branch is contained on a partition. As common in Linux, many things
    can be "mounted" that are not truly partitions (for example, the /proc pseudo-file
    system). Our interest here is partitions, and the file that controls the attachment
    is /etc/fstab. The structure of this file is described in the online documentation
    (man 5 fstab) and we can synthesize it with an example.


    | filesystem | mount-point | fs-type | options | dump | fck-order |

    | --- | --- | --- | --- | --- | --- |

    | /dev/sda0 | / | reiserfs | rw | 1 | 1 |

    | /dev/sda1 | swap | swap | pri=1 | 0 | 0 |

    | proc | /proc | proc | defaults | 0 | 0 |


    > Table A-1 Example /etc/fstab entries


    The entry under the file system heading specifies the device (or pseudo device,
    as in the example of proc) to be attached ("mounted"). The mount point specifies
    the location in the tree to which the branch will be attached. The fs-type specifies
    the file system type that Linux should expect. Options vary according to file
    system type, we will not enumerate the options here. The final fields specify
    the backup-priority and the order in which file systems are checked at boot. These
    fields are gradually losing currency as file systems and archiving'
