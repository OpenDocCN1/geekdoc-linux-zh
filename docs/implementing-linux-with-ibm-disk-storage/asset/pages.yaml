    After Linux is fully installed you have to install the package containing the
    Emulex Open Build device driver.


    Install the Emulex driver package you have obtained from SuSE as shown in Figure
    4-24. When released the new Emulex driver package will part of an update CD or
    available on the SuSE support pages.


