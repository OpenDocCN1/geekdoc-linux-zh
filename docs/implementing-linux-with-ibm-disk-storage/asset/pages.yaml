    For this discussion we assume the environment is purely Linux, and that out-of-band
    control will be used to manage the FASiT.


    # Is there RDAC driver for Linux?


    At the time of this writing, the Redundant Disk Array Controller (RDAC) is not
    available for Linux. This means Linux hosts using storage on the FASiT have volume
    transfers within the FASiT managed by the FASiT itself. Multipathing is done using
    the appropriate driver for the Host Bus Adapter (HBA) and additional software
    called FASiT MSJ, which is used to manage the paths with the Host Bus Adapters.
    FASiT MSJ is described in Chapter 10, “MSJ (Management Suite for Java)” on page
    21.


    # 9.1.2 FASiT Storage Manager client: Getting started


    The FASiT Storage Manager client is the graphical user interface (GUI) that controls
    one or more FASiT storage subsystems. Because this is a Java runtime environment
    (provided on the FASiT Storage Manager CD) must be installed as well.


    # Linux Install of FASiT Storage Manager client


    Linux distributions of interest to use in this redbook equipped with the rpm package
    manager. This tool maintains a dependency list such that if one package requires
    another, the user will be notified. When installing the Storage Manager client
    under Linux, you should install the Java runtime environment before the client
    software. In our implementation, the FASiT Storage Manager client resides on a
    Linux management station that can communicate with the FASiT controllers via the
    network. Such a management station may also be a host that is attached to the
    FASiT storage via Fibre Channel, but this is not required. To be clear, in the
    Linux environment, there is no Storage Manager agent available.


    So, if the Storage Manager client is installed on a host that is attached via
    Fibre Channel to the storage, the management still takes place out-of-band and
    requires network connectivity to the FASiT controllers. Both the client and the
    runtime environment are provided on the FASiT CD, the latest versions (as well
    as the latest firmware for the FASiT controllers and expansion modules; please
    see Appendix 9.1.3, “Updating the FASiT firmware” on page 195 for detailed instructions
    on updating firmware) can be obtained from the following URL:


    ```

    http://www.storage.ibm.com

    ```'
