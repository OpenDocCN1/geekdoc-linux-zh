  md: 'ESCON Port. The ESCON port is the physical interface into the ESCON channel.
    ESCON port has an ESCON connector interface. You have an ESCON port wherever you
    plug in an ESCON Link


    FC See Channel


    ESCON Link is the fibre connection between the zSeries 900 (or S/390) server and
    the storage enclosure. An ESCON link can also exist between zSeries 900 (or S/390)
    processor and an ESCON Director (fibre switch), and between an ESCON Director
    and the storage enclosure (or other ESCON capable devices)


    extended remote copy (XRC). A hardware- and software-based remote copy option
    that provides an asynchronous volume copy across storage systems for disaster
    recovery, device migration, and workload.


    F


    Fabric Channel employs a fabric to connect devices. A fabric can be as simple
    as a single cable connecting two devices. The term is often used to describe a
    more complex network utilizing hubs, switches and gateways.


    Fabric-Loop, FL ports. These ports are just like the F_ports, except that they
    connect to an FC-AL topology. FL_ports can only attach to NL_ports. The ESS Fibre
    Channel adapters do not support the FL_port functionality, which is found only
    in fabrics or hubs.


    Fabric Ports, F.ports. These ports are found in Fibre Channel Switched Fabrics.
    They are not the source or destination of IUs, but indent function only as “middleman”
    to relay the IUs from the sender to the receiver. F_ports can only attach to N_ports.
    The ESS Fibre Channel adapters do not support the F_port functionality, which
    is found only in fabrics.


