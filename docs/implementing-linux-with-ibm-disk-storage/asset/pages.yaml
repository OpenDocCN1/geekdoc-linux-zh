    | 1 | 6 |


    Save Restore Defaults


    # Figure 11-12 Initial device allocation


    If you are planning to install some Fibre Channel HBAs for redundancy, you have
    to take some details into account:


    +   * By default the qla2x0 module is installed; this module does not support
    failover.

    * To support failover, both HBAs must be identical.

    * Only Qla2200 and Qla2300 adapters are supported for failover.

    * Both cards must see exactly the same targets.

    * There is no load balancing.

    * Failover is provided for both ESS and FASIT.


    To replace the driver modules, you have to either connect to the server via ssh
    or directly from the console (assuming you did not change the circuitry settings).
    Once you have access to the console OS shell, you need to edit or add (in case
    it does not exist yet) the file vmware-devices.map. Figure 11-13 shows the changes
    required for VMware to recognize the new settings. The file vmware-devices.map
    contains the hardware definition for the VMware Kernel.'
