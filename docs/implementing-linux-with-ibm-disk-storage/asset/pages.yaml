    The files are stored on your home disk, which you can verify using the filel command.


    # IPL from the virtual reader


    The three files are used to IPL from the virtual reader and have to be put (punched)
    in the reader; you then IPL your system from the virtual reader. The easiest way
    to do this is to create a small REXX script as shown in Example 3-3.


    Example 3-3 Script SLES8 EXEC to IPL from virtual reader


    ```

    /**/

    ''close rdr''

    ''purge rdr all''

    ''spool punch * rdr''

    ''PUNCH SLES8 IMAGE A (NOH)''

    ''PUNCH SLES8 PARM A (NOH)''

    ''PUNCH SLES8 INITRD A (NOH)''

    ''change rdr all keep nohold''

    ''ipl 00c clear ''

    ```


    Execute this script and you should see the Linux boot messages appear on the virtual
    console. Once the initial system has completed the boot process, the network configuration
    dialog will will start automatically.


