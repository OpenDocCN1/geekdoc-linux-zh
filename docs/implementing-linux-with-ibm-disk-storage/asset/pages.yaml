  md: 'Install the updates:


    ```

    rpm -ivh kernel-<version>.rpm

    rpm -Uvh kernel-headers-<version>.rpm

    rpm -Uvh kernel-source-<version>.rpm

    rpm -ivh kernel-<version>.src.rpm

    ```


    An entry will be added to `/etc/grub.conf`, which will allow you you to boot from
    the new kernel. Edit the default field to boot from this kernel by default.


    # 5.5.3 Issues on BladeCenter


    This section applies to Red Hat and SuSE.


    # Floppy after installation


    You may be unable to mount the floppy after installation due to it being a USB
    device.


    # Red Hat


    The floppy resides on the last SCSI device. For example, if you have LUNs configured
    on the fibre storage (/dev/sda, /dev/sdb), the floppy will reside on /dev/sdc.
    It is possible to manually mount the floppy using this information, or /etc/fstab
    can be edited with the following where X=device letter:


    ```

    /dev/sdx /mnt/floppy auto noauto,user 0 0

    ```


    Create a directory for the floppy under /mnt


    ```

    mkdir /mnt/floppy

    ```


    The system is now configured to mount the floppy at boot time. To mount the floppy
    now type the following:


    ```

    mount /mnt/floppy

    ```


    # SuSE


    Type the following to load the USB storage module:


    ```

    modprobe usb-storage

    ```


    The floppy resides on the last SCSI device. For example, if you have LUNs configured
    on the fibre storage (/dev/sda, /dev/sdb), the floppy will reside on /dev/sdc.
    It is possible to manually mount the floppy using this information, or /etc/fstab
    can be edited with the following where X=device letter:


    ```

    /dev/sdx /media/floppy auto noauto,user,sync 0 0

    ```


    Create a directory for the floppy under /media'
