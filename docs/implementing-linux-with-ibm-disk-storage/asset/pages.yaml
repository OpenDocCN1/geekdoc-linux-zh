  md: '![](img/7df754bba6e7faadf914690e9e5ed087_274_0.png)


    # Storage from the OS view


    In this appendix we discuss the concept of storage from the perspective of the
    operating system, and how this storage is presented to an application. Our intent
    is to introduce to the person familiar with Windows some of the differences evident
    in Linux. We will also briefly survey the file systems available with Linux. We
    will show how to use a feature of Linux called the /proc file system to view attached
    storage, and briefly mention the file system table /etc/fstab.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Disk storage in the Windows environment


    As is often the case, one cannot grasp the state of the art (or at least its idiosyncrasies)
    without examining the roots of the technology. So, it is with disk storage in
    Windows. We will not return to the absolute beginning of computer technology.
    Instead, we will begin slightly later to to drive at drive letters. The Windows
    discussion is oversimplified by design, our apologies to readers who know the
    development history and technical architecture better than we describe. Our emphasis,
    is on Linux, so we discuss Windows only in contrast.


    # Disk letters


    In DOS,¹ a disk is assigned a letter. Traditionally, "A" is the boot floppy, "B"
    is the second floppy. It is a bit of a stretch to recall that this once was the
    extent of external storage available. To add non-removable disk storage, a hardware
    method was needed. The BIOS provides disk access via a hardware interrupt (INT13).
    Through the BIOS, a disk looks like one file. DOS breaks this storage into files
    and directories by means of a File Allocation Table (FAT). The first unused letter
    (historically speaking) was "C" thus the notion of the "C" drive the first hard
    disk on an Intel-based system survives to day. A subtle but important implication
    is that the BIOS has a single interrupt to service this storage type, so only
    one hard drive can be presented to the operating system at any given time. This
    is of no consequence to DOS, as it cannot multitask.


    But the notion of an "attached volume" persisted even as complexity evolved. With
    the advent of multiple hard drives, each "volume" was independent of the others,
    there was no hierarchy that spanned multiple volumes. The operating system had
    to be resident in memory to permit the volume to be changed. Again, not an issue
    with DOS. The FAT was sufficient to locate a file on the attached volume, and
    the operating system had no intrinsic recourse to the disk once it was loaded.
    This scheme was adequate until the operating system evolved to use virtual memory,
    when it had occasion to use disk storage for its purposes.


    Until Windows 3.11, the underlying disk accesses were all handled through the
    BIOS by DOS. Windows employed a server-oriented design derived from OS/2 that
    was not constrained in this manner. Even so, Microsoft''s desire for commonality
    between desktop and server environments ensured the disk naming convention (if
    not the access method) would be carried into Windows NT and beyond.


    > ¹ Using letters for disk attachment is not original to DOS, but that is not
    relevant to this introduction.'
