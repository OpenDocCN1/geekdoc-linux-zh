  md: 'The General Public License promotes free code on the GNU Web page. It also
    provides protection for the developer and prevents a user from altering the code
    and then asserting proprietorship over the code. This does not mean the code cannot
    be sold. According to the GNU Web site,¹²free software” allows a user to run,
    copy, distribute, change, and improve the software. It must also be available
    for commercial use.


    Standards enable communication among heterogeneous software and systems. Open
    source can be viewed as a manifestation of inter-networking, and the process itself
    as a necessity for extending the development of inter-networking. There is a need
    for new software or hardware support, or a defect is discovered and reported,
    the software (creation or correction) can be swiftly done by the user who required
    the changes (or by the original author), with no need for a design review, cost
    analysis, or others of a centralized development structure. This is made possible
    by open source code. IBM has recognized the efficacy of this community and sees
    the benefit of the rapid and innovative development of robust and stable code
    to provide the enabling layer for e-business applications.


    As a result of the evolutionary development of Linux, pieces of the code are located
    on various Web sites. Without some integration, it is difficult to install and
    upgrade the code, keep track of module dependencies, and acquire drivers for the
    hardware. Distributions provide coherent bundles of software in one location that
    furnish the capabilities needed for a usable server or desktop. Generally, the
    products of different distributors have a lot of things in common, but there may
    be particular features or functions that you require are not available from a
    given distributor.


    # 1.3 Linux distributions


    Linux is available in many configurations from a variety of distributors. Linux
    advocates have strong preferences for one distribution over the other. Distributions
    from, for example, Mandrake,¹³ Debian,¹⁴ and gentoo¹⁵ are presently available
    and offer their own advantages in package management, installation, development
    environment, and ease of use of various tools.


    The distributions we used in our investigations were the so-called enterprise
    distributions, one from Red Hat Software Inc.,¹⁶ and the other from SuSE Holding
    AG.¹⁷ Both of these distributions also offer workstation distributions,


    ```

    ¹² http://www.gnu.org/philosophy/free-sw.html

    ¹³ http://www.mandrake.com/

    ¹⁴ http://www.debian.org/

    ¹⁵ http://www.gentoo.org/

    ¹⁶ http://www.redhat.com/

    ```'
