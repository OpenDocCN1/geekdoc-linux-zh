  md: '# 3.1.3 zSeries-specific versus distributed storage controllers


    Two types of storage controllers with Fibre Channel interfaces are currently available
    for zSeries:


    +   - Those supporting the z/Architecture specific FICON interface based on the
    CCW architecture, with the EKD command set for disk storage, and similar sets
    of commands for tapes.


    +   - Those supporting the SCSI-based FCP protocol, with SCSI command sets specific
    to the device type, such as disk or tape.


    Both types of controllers are normally based on the same hardware building blocks.
    Their individual characteristics are achieved by different firmware handling the
    host interface. The way the DASD addressing or device mapping is handled, is illustrated
    in Figure 3-6 and is summarized in our discussion in 3.1.1, "zSeries specific
    storage attachments" and 3.1.2, "Distributed storage attachments"


