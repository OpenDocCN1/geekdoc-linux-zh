    Before installing SDD, you must configure the Fibre Channel adapters and the adapter
    drivers that are attached to the Linux host system, as explained in 5.6.2, "Prepare
    the Fibre Channel Host Bus cards" on page 126, and 5.6.3, "Installing the Fibre
    Channel Host Bus Adapter driver" on page 127.


    In addition, before you install SDD, you must configure your multiport access
    for each LUN (use the ESS Specialist for that purpose). SDD requires a minimum
    of two independent paths that share the same LUN to use the load-balancing and
    path fail protection features.


    Strictly speaking, note that a host system with a single Fibre Channel adapter
    connected through a switch to multiple ESS ports is considered multipath connection,
    but is not sufficient (SDD will not provide failover capabilities if you install
    it in this case).


