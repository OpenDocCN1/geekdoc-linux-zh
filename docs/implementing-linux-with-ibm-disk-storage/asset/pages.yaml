  md: "# 5.6 Setup for Fibre Channel attachment\n\nIn this section we discuss the\
    \ setup required for Fibre Channel attachment for\n Hat Enterprise Linux and Suse\
    \ Linux Enterprise Server.\n\nFirst, install the Host Bus Adapters in your server.\n\
    \nNext, replace and update the BIOS on the adapter and apply the proper settings.\n\
    \n+   - For a Red Hat installation\n\n+   - For a Suse installation, no default\
    \ driver was installed, and you must now\ninstall the appropriate driver for your\
    \ storage (ESS or FASIT).\n\nFinally, install SSD if you attach to ESS, or configure\
    \ your paths if you attach to\nFASIT.\n\nAs described in 5.3 \"Configurations\
    \ used for this redbook\" on page 101, we used\nIBM FC2 Host Bus Adapters (HBA).\
    \ Although this HBA is also known as the IBM\nFASIT FC2, it does not mean that\
    \ it is exclusively used for attachment to a FASIT.\nNote also that the device\
    \ driver supports all IBM HBAs labelled with FASIT (FC1\nand FC2).\n\nThe use\
    \ of the IBM FC-2 adapter and the configuration described here after\napply whether\
    \ you attach to FASIT or ESS. The only difference is that the\nESS requires the\
    \ single path driver for the HBA.\n\n# 5.6.1 Install the adapters\n\nIf the FC2\
    \ HBAs are not already installed, shut down your system and install\nt adapters.\
    \ At this stage it is best to leave the cards disconnected from the\nSAN, or have\
    \ the SAN switched off. Otherwise, if you boot your server to the\nOS, it is now\
    \ possible that the sequence of the SCSI devices could change, in\nwhich case\
    \ the boot would fail. This situation will be corrected later in this\nchapter.\n\
    \n# Red Hat system\n\nIf you are running an \"out-of-the-box\" installation of\
    \ Red Hat Enterprise Linux,\nthen KDUZ probes for new hardware during boot. All\
    \ detected hardware is\ncompared with entries in the KDUZ database at /etc/sysconfig/hwconfig.\
    \ If this\nfile does not exist for any reason, then /etc/modules.conf,\netc/sysconfig/network-scripts,\
    \ and /etc/X11/XF86Config are scanned instead.\nnew hardware is detected, a dialog\
    \ offers three choices:"
