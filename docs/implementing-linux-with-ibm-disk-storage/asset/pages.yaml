  md: 'can be supported by the same adapter. The protocols that are used on the SCSI
    adapter (the command set) can be either SCSI-2 or SCSI-3


    SCSI ID. An unique identifier (ID) assigned to a SCSI device, is used in protocols
    on the SCSI interface to identify or select the device. The number of data bits
    on the SCSI bus determines the number of available SCSI IDs. A wide interface
    has 16 bits, with 16 possible IDs. A SCSI device is either an initiator or a target


    SCSI host. An open systems server that uses SCSI adapters to connect to the storage
    enclosure


    SCSI host. The host (HA) is the physical component of the storage server used
    to attach one or more I/O interfaces. The ESS can be configured with SCSI host
    adapters (HA). The SCSI host adapter is connected to the SCSI bus and accepts
    the commands that are sent by the host system. The SCSI HA has two ports for SCSI
    connection


    SCSI port. A SCSI Port is the physical interface into which you connect a SCSI
    cable. The physical interface varies, depending on what level of SCSI is supported


    Seascape architecture. A system architecture developed by IBM for open system
    servers and S/390 host systems. It provides modular storage solutions that integrate
    software, storage management, and technology for disk, tape, and optical storage.


    secondary device. One of the devices in a dual copy or remote copy logical volume
    pair that contains a duplicate of the data on the primary device.


    server. A type of host that provides certain services to other hosts that are
    referred to as clients


    spare. A disk drive is used to receive data from a device that has experienced
    a failure that requires disruptive service. A spare can be pre-designated to allow
    automatic disk sparing. Any data on a disk drive that you use as a spare is destroyed
    by the dynamic sparing process.


    Sparset. A collection of disk drives made by the controller to replace failed
    members of a storageset.


    SSA. Standard Storage Architecture. An standard for computer peripheral interface.
    The interface uses a SCSI logical protocol over a serial interface that configures
    attached targets and initiators in a ring topology.


    SSR. System Support Representative. IBM person who does the hardware installation
    and maintenance.


    cluster storage. A partition of a storage server that is capable of performing
    all functions of a storage server. When a cluster fails in a multiple-cluster
    storage server, any remaining clusters in the configuration can take over the
    processes of the cluster that fails (fail-over)


    storage device. A physical unit provides a mechanism to store data on a given
    medium that it can be subsequently retrieved.


    storage server. A unit that manages attached devices and provides access to that
    storage and storage-related functions for one or more attached host systems'
