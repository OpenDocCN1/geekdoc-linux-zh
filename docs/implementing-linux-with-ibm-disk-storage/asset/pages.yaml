    ESCON Channel. The ESCON channel is a hardware feature on the zSeries and S/390
    servers that carry data flow over the ESCON Link. An ESCON channel is usually
    installed on an ESCON channel which may contain up to four ESCON channels


    ESCON Host Adapter. The host adapter (HA) is the physical component of the storage
    server used to attach one or more host I/O interfaces. The ESS can be connected
    with ESCON host adapters (HA). The ESCON host adapter is connected to the ESCON
    channel and accepts the host CCWs (channel command words) that are sent by the
