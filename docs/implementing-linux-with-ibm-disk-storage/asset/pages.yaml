  md: '# 2.1 Enterprise Storage Server


    This section introduces the IBM TotalStorage Enterprise Storage Server and discusses
    some of the benefits that can be achieved when using it. For more detailed information,
    please refer to the redbook: IBM TotalStorage Enterprise Server Model 800, SG24-6424.


    # 2.1.1 ESS Overview


    The IBM TotalStorage Enterprise Storage Server (ESS) is IBM''s most powerful disk
    server, developed using IBM Seascape® architecture. The ESS provides unmatchable
    functions for all the server family of e-business servers, and also for the non-IBM
    (that is, Intel-based and UNIX-based) families of servers. Across all of these
    environments, the ESS features unique capabilities that allow it to meet the most
    demanding requirements of performance, capacity, and data availability that the
    computing business may require.


    The Seascape architecture is the key to the development of IBM''s storage products.
    Seascape allows IBM to take the best of the technologies developed by the many
    IBM laboratories and integrate them, producing flexible and upgradable storage
    solutions. This Seascape architecture design allows the IBM TotalStorage Enterprise
    Server to evolve from the initial E models to the succeeding F models, and to
    the more 800 models, each featuring new, more powerful hardware and functional
    enhancements.


    To meet the unique requirements of e-business, with massive swings in the demands
    placed on systems are common, and continuous operation is imperative, demands
    vary high-performance, intelligent storage technologies and systems that can support
    any application. The IBM TotalStorage Enterprise Server has set new standards
    in function, and scalability in these most challenging environments.


    Figure 2-1 on page 13 shows a photograph of an ESS Model 800 with the front removed.
    At the top of the frame are the processor drawers that hold the Cluster SMP processors.
    Just below the processor drawers are the I/O drawers that hold the SSA device
    adapters that connect to the SSA loops. Just below the I/O drawers are the host
    adapters. At the bottom of the frame are the AC power supplies and batteries.


    The ESS in this has two cages holding the disk drives (DDMs). If the capacity
