  md: '+   Every time a change to your configuration occurs, you have to generate
    a new initial ramdisk and reboot (or unload and reload the Fibre driver).


    +   It is quite useful to keep an additional bootable ramdisk with no options
    for the FASTi HBA in reserve. After booting the ramdisk, the driver detects attached
    devices and preferred paths, but these are not overruled by the options. Then,
    with MSJ, you can generate a new, error free option.


    Note: Any change in the configuration of your SAN causes you to reconfigure your
    paths and create a new initial ramdisk.


