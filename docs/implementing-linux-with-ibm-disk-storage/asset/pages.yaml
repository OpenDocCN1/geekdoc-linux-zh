  md: '# Disk partitions


    Linux does not use the BIOS, but other systems that might have share a disk with
    Linux. Thus, Linux is aware of data structures and BIOS limitations that might
    influence such co-residency. For a purely Linux disk, these issues do not affect
    partition except for the adherence to four physical partitions. Since the topic
    of sharing a Linux disk with other operating systems (especially the boot disk)
    is well documented² elsewhere, we will not pursue it here. When unconstrained
    by co-residency requirements, Linux disks can be partitioned according to your
    taste, but there are some things to remember.


    First, Linux disks, like Windows disks, can have only four physical partitions.
    Logical partitions can be created in one of these physical partitions, known as
    an extended partition, similar to the method used for Windows. Second, Linux disks
    are assigned names in a manner that can cause great difficulty if changes are
    made later. Lower SCSI ID numbers are assigned lower-order letters. If you remove
    one drive from the chain, the names of the higher ID drives will change. A related
    note that we point out in several places in this book is to be careful to avoid
    gaps in the LUN numbering, as Linux will "stop counting" while probing when it
    reaches the unreachable LUN.


    Partitioning is done to achieve a physical separation of data according to type
    or function. A common tool to do this is fdisk but there are others such as cfdisk
    or third-party tools like Partition Magic. No matter the method, the goal is the
    same - to create a structure that can accommodate a file hierarchy. A hierarchical
    arrangement of directories (folders) containing files can be as simple as a single
    tree that spans an entire disk. This is often done with trial installations but
    is not recommended for production use³ There are some useful guidelines that we
    will discuss.


    # File hierarchy


    Work by the Filesystem Hierarchy Standard Group has published⁴ to assist in interoperability
    of UNIX-like systems (including Linux). This group recommends segregating data
    into major subdivisions that derive from the shareability and variability of data.


    For example, data that is shared between multiple systems should be segregated
    from data that is private to a single machine. Similarly, data that is highly
    variable should be segregated as much as possible from data that is static. Partitions


    > ² See The Linux Documentation Project, Large Disk HOWTO and the Partition HOWTO
    atnhttp://www.tld.org

    ³ To be clear, we are discussing the system disk. Additional disks can be subdivided
    as required to accommodate the applications.

    ⁴ http://www.pathname.com/fhs/2.2/


    256 Implementing Linux with IBM Disk Storage'
  merge: -1
