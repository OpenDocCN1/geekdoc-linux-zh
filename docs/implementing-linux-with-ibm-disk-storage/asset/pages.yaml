  md: 'software components called device drivers. Linux has two ways of integrating
    drivers:


    +   * Directly compiled to the kernel

    * As loaded modules


    In our work we used the second approach, and we used FASIT drivers as loadable
    modules. If it is necessary to have those drivers available at boot time to launch
    the required scripts in time or to access the device during boot, they may be
    compiled into the kernel, or the boot loader (GRUB) can load an initial ramdisk,
    which contains those drivers (see Figure 10-4):


    ![](img/7df754bba6e7faadf914690e9e5ed087_236_0.png)


    # Figure 10-4 building a ramdisk image


    You can see that mkinitrd.conf scans for the required modules, including all options
    for the particular modules. As you can see in this case, the drivers for the network,
    the ServeRAID, the Fibre Channel, and other modules are included. In addition,
    a long options list (generated by FASIT MSJ, we will see how to do this in 10.1.2,
    "Use FASIT MSJ to configure Fibre Channel paths" on page 216) is submitted, too.
    These options contain the necessary path and LUN information to set the FASIT
    multipath driver during boot. This leads to the following:'
  merge: -1
