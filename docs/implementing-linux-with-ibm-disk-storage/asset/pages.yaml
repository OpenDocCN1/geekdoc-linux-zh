    # 1.4 IBM''s commitment to Linux


    The history of IBM''s involvement with Linux is so large as to be outside the
    scope of this work. IBM is not a distributor of Linux. IBM is a contributor to
    Linux, a supplier of servers that run Linux, and a provider of support for customers
    who choose to use Linux. IBM''s commitment to Linux may be illustrated with some
    of the many notable highlights over the last several years.


    As early as March 1999, IBM had announced key alliances, products, and global
    support for Linux, including distributors Caldera Systems Inc., (now the SCO Group20),
    PacHiTech Inc., (now Turbolinux, Inc.21), SuSE Holding AG (all of which later
    founded UnitedLinux using distributor Connectiva S.A.22), and Red Hat Software
    Inc23 The IBM Thinkpad 600 became the first notebook listed as supported hardware
    by Red Hat.


    Linux made its official debut on S/390® servers in May 2000, with commercial deployment
    by a major ISP for server consolidation following thereafter. In June, Sue announced
    Enterprise Linux for the RS6000.


    In 2001, IBM won honors at LinuxWorld for zSeries and iSeries™ running Linux,
    completing the availability of Linux across the entire IBM eServer product line.
    Completing this, was the announcement of a broad range of storage options for
    Linux servers, including the Enterprise Storage Server (ESS) and Fibre Array Storage
    System (FAST) external storage arrays. IBM''s supercomputer systems were deployed
    in research and also in oil and gas exploration, and packaged Linux clusters for
    e-business made their debut.


    In 2002, continued expansion for robust consolidation for small and medium businesses,
    server consolidation, network infrastructure, advertising, telecom, and life sciences
    strengthened IBM''s position as the most committed Linux player across all market
    segments. By December 2002 IBM had made the IBM eServer p630 available; the first
    pSeries system dedicated to Linux support. Internally, IBM began migrating its
    own business-critical services to Linux, demonstrating its indisputable commitment,
    and also demonstrating the scalability of Linux e-business solutions.


    +   20 http://www.sco.com/

    21 http://www.turbolinux.com/

    22 http://www.connectiva.com/

    23 See press releases at http://www-916.ibm.com/press/prnews.nsf/homepage


    Chapter 1. Introduction to Linux 7'
