  md: 'You will drop into the cluadmin shell. Type the following to add a service:

    service add


    You will receive various prompts (Example 6-2) for answers from the script such
    as aservice name, preferred node, IP Address, disk device, mount point, exports,

    etc. You can assign a preferred node for the service to start on. You can also
    decide if you would like to relocate the service back to the preferred node in
    the event of a failover where the faulty node has come back online.


    Services can be shared between the systems rather than having an active-passive
    setup where the passive system just sits waiting for the other to fail. In an
    active-active setup you should ensure that there are enough system resources for
    a single system to take over in the event of a failure.


