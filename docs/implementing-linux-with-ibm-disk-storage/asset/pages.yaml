  md: 'Please refer to the documentation of your distribution on how to create an
    IPL tape.


    In our example we use an FTP server, which is accessible within the HMC network
    segment. The Linux installation CDs must be copied on this server. It is recommended
    to copy each CD in a separate directory, using the same initial path, separating
    the different CDs in subdirectories CD1, CD2, CD3.


    Also, note that the first CD has the necessary information to allow the IPL: it
    contains the *suse.ins* file, which is a tape description file, used to emulate
    the IPL as a tape for the zSeries.


    To perform the IPL, log on to your HMC and then select the following:


    +   1. Go into **Defined CPCs** and highlight the CPC you will work on.

    2. Change to the **CPC Recovery** menu and double-click **Single Object Operations**.

    3. Confirming the action in the next window will bring you to the CPC console.

    4. Go into **Images** and highlight the LPAR to IPL.

    5. Change to the **CPC Recovery** menu and double-click **Load from CD-ROM Server**


    You will get a warning that all jobs will be cancelled. Make sure that no system
    is active or that it is safe to re-IPL the system. Clicking **Yes** opens the
    window shown in Figure 3-10. You have to provide the hostname or IP address of
    the FTP server, a valid user ID and password, as well as the path indicating the
    location of the first CD (i.e.: /code/sles8/cd1 in case).'
