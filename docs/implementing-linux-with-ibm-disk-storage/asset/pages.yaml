  md: "# Disk partitions\n\nFundamental constraints inherited from earlier designs\
    \ limited the addressable size of a mounted volume. Disk capacities outstripped\
    \ physical addressability at a precipitous rate. It became necessary to subdivide\
    \ hard drives into smaller, completely admirable pieces. The concept of disk partitioning\
    \ is common to both Windows and Linux, and we will revisit it in subsequent sections.\
    \ Suffice to say that Windows partitioning permits up to four physical divisions\
    \ of a disk. The last division may be subdivided, but these subdivisions are not\
    \ visible at boot. Disks are not presented to Windows based on their adapter type\
    \ or access protocol as is done in Linux.\n\n# Disk storage in the Linux environment\n\
    \nAlthough Linux (rather emphatically) not UNIX, it is UNIX-like and shares the\
    \ UNIX disk access paradigm. Linux, in its simplest invocation, needs only to\
    \ be given its bootstrap and a “root device”. The operating system expects to\
    \ find everything it needs to run on this root device, which can be a floppy disk,\
    \ ramdisk, a CD-ROM, hard drive, or network. In addition to the initial load of\
    \ the kernel, we need two elements: a device driver that is particular to the\
    \ media to be viewed as a disk, and a nexus in the file system by which the media\
    \ can be accessed. It is in some sense a paradox that the operating system needs\
    \ an entry in the file system to access the device on which it has a file. This\
    \ is because the access point of the device driver looks like a file. In fact,\
    \ a design element of UNIX-like systems is that everything looks like a file such\
    \ as disks, pipes, directories, and printers, which mainly look the same.\n\n\
    \ own, the disk devices are specified in the file system as “special” file entries\
    \ in the /dev directory. With each of these “special” files is a associated set\
    \ of indices (major and minor numbers, see Appendix A-1, /proc/partitions on page\
    \ 259, or the output of the command ls -1 /dev) that correlate to the physical\
    \ attachment (for example, the controller, target, and logical unit) and the driver\
    \ semantics associated with the desired access (for example, character or block\
    \ access). The first device to be accessed is declared by the hardware and is\
    \ “xxx” where xx indicates the device type, and y enumerates the first device\
    \ on that adapter. A SCSI disk might be seen as sda, while the second HARD disk\
    \ might be seen as hdb. Once Linux is booted, we may expect to see entries such\
    \ as /dev/sdb0 for the first partition of the second SCSI disk, or /dev/hda2 for\
    \ the third (0,1,2...) partition on the first IDE disk, and so forth."
