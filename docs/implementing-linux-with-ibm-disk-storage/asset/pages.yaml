    # ### 3.1.1 zSeries specific storage attachments


    The I/O component of zArchitecture™, inherited from its predecessors such as the
    ESA/390 architecture, is based on channels, control units, and devices. Channels
    provide a well-defined interface between a server and the attached control units.
    Originally implemented on parallel copper media, today''s channels such as ESCON®
    (Enterprise System Connection) and FICON™ (Fibre Connection) use optical serial
    cables. Also, the parallel channel was a multi-drop interface, while both ESCON
    and FICON are switched point-to-point connections, extended to complex connection
    infrastructures via ESCON or FICON switches or directors, as depicted in Figure
    3-2.


    ![](img/7df754bba6e7faadf914690e9e5ed087_48_1.png)


    Figure 3-2 Typical zSeries storage attachment concept'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'ESCON channels use a unique physical interface and transmission protocol. FICON,
    on the other hand, is based on industry-standard Fibre Channel lower-level protocols.


    In cases, however, the higher-level I/O protocol used by software, based on channel
    programs consisting of channel command words (CCWs), is unique to mainframes addressing
    z/Architecture or its predecessors. For access disk storage, a specific set of
    CCWs is used, defined by the ECKD protocol. This protocol not only commands and
    responses exchanged across the channel, but also the format of the data as it
    is recorded on the disk storage medium. For tape, similar CCW-based command protocols
    exist, but there are no associated access protocols for media such as DVDs or
    scanners, because the software device drivers and control units have never been
    provided.


    # zSeries and storage device addressing


    With z/Architecture, software addresses a storage device using a 16-bit device
    number, which uniquely identifies the device. Such a device number is mapped to
    one or more physical paths to the device. This path is typically described by
    an address quadruple of:


    +   1. Channel path identifier: (CHPID)

    Identifies the channel that provides a path to the device

    2. Physical link address:

    Identifies a route through a switch or director

    3. Control unit address:

    Specifies the control unit

    4. Unit address (UA):

    Identifies the device


    Please refer to a disk, which is often a logical device partitioned out of the
    disk space provided by an array of physical disks. In order to provide redundancy
    and/or I/O bandwidth, or allow load balancing, there is typically more than one
    physical path to a device. While these paths are specified using different address
    quadruples, software still uses a single device number to address the device,
    independent of the path that is chosen for any particular I/O request.


    Another characteristic of the z/Architecture I/O scheme and the ECKD architecture
    for disk, is the sophisticated support for sharing channels, control units, and
    devices among multiple operating systems, which may run on the same or different
    zSeries systems.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# ### 3.1.2 Distributed storage attachments


    The attachment of storage controllers in the distributed world is predominantly
    based on the SCSI standard, using a control-block-based command and status protocol.
    Today, there is a clear distinction between the physical level and command/status
    level of the SCSI protocol.


    # #### FCP advantages


    Based on this higher-level SCSI command/status protocol, a new standard has been
    called FCP, which stands for Fibre Channel Protocol for SCSI.


    FCP employs the SCSI command/status protocol on top of an underlying Fibre Channel
    transmission protocol. Due to the superiority of the optical Fibre Channel connection
    speed, distance, and reliability, storage attachments via FCP have the highest
    growth rate in today''s distributed storage world.


    Traditionally, distributed storage controllers have been attached via parallel
    SCSI cabling, which allowed only very limited distances between the server and
    the controller. And although the SCSI architecture has provisions for physical
    controller and device sharing, the length constraints of parallel SCSI cables
    impose natural limits on this sharing capability. Also, there has been little
    need for a capability to share controllers and devices among multiple operating
    systems running concurrently on the same server, because server virtualization
    techniques are just starting to develop in the distributed world.


    # #### FCP storage addressing


    Traditional SCSI devices have a simple addressing scheme: originally, known as
    the target address was simply a number in the range 0-7 (extended to 0-15 in newer
    SCSI architecture). As shown in Figure 3-3 on page 30, SCSI also supports the
    definition of Logical Unit Numbers (LUNs); each LUN allows for a sub-addressing
    of the physical device.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '![](img/7df754bba6e7faadf914690e9e5ed087_51_0.png)


    Figure 3-3 SCSI addressing


    For FCP, a new addressing scheme, based on World Wide Names (WWN) was developed.
    Each node and port (as an FCP port) on a node is assigned a WWN, respectively
    known as World Wide Node Name (WWMN) or World Wide Port Name (WWPN). This is illustrated
    in Figure 3-4.


    ![](img/7df754bba6e7faadf914690e9e5ed087_51_1.png)


    Figure 3-4 World Wide WWPN


    In addition to WWNN and WWPN names, any addressable unit within a node (such as
    a disk drive) can be assigned a unit name, also know as lun.'
  merge: -1
