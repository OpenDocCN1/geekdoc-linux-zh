  md: 'PPRC. See peer-to-peer remote copy.


    primary device. One device of a dual copy or remote copy volume pair. All channel
    commands to the copy local volume are directed to the primary device. The data
    on the primary device is duplicated on the secondary device. Also secondly device.


    PTF. Program temporary fix. A fix to a bug in a program or routine.


    # R


    rack. A unit that houses the components of a storage subsystem, as controllers,
    drives, and power.


    RAIDset. A storageset stripes data and parity across three or more members in
    a disk array. Also referred to as RAID-5


    rank. A disk group which a RAID-5 array is configured. For JBOD, each DDM becomes
    a rank.


    random access. A mode of accessing data on a medium in a manner that requires
    the storage device to access nonconsecutive storage locations on the medium


    RDAC. Redundant Disk Array Controller. Controller failover facility provided for
    some operating systems with the FASTIT line


    read head. When requested by the read operation is in the cache.


    read miss. When requested by the read operation is not in the cache.


    recovery. The process of rebuilding data after it has been damaged or destroyed.
    In the case of remote copy, this involves applying data from secondary volume
    copies.


    recovery system. A system that is used in place of a primary system that is


    no longer available for use. Data from the application system must be available
    for use on the recovery system. This is usually accomplished through backup and
    recovery techniques, or through DASD copying techniques, as remote copy.


    ReFS. A journaling filesystem which logs all changes to a disk and can play them
    back after a system failure. Hence long filesystem checks like with ext2 are online.


    remote copy. A storage-based recovery and workload function that can copy data
    in real time to a remote location. Two options of remote copy are peer-to-peer
    remote copy and extended remote copy.


    restore. Synonym for recover.


    re-synchronization. A track image copy from the primary volume to the secondary
    volume of only the tracks which changed since the volume was in duplex mode.


    # S


    SCSI (Small Computer Systems Interface) is the protocol that the SCSI adapter
    cards use. Although SCSI protocols can be used over Fibre Channel (then FCP) people
    mean the parallel interface when they say SCSI. This is the ANSI standard for
    a logical interface to computer peripherals and for a computer peripheral interface.
    The interface utilizes a SCSI logical protocol over an I/O interface that configures
    attached targets and initiates in a multi-drop topology.


    SCSI adapter. A SCSI adapter is an I/O card installed in a host system. It connects
