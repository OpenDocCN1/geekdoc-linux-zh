  md: '# 7.2.3 Defining Linux hosts


    On the Open System storage panel click **Modify Host Systems**. The Modify Host
    panels open as shown in Figure 7-5.


    ![](img/7df754bba6e7faadf914690e9e5ed087_187_0.png)


    Figure 7-5 Modify Host Systems panel


    Enter the characteristics of the new host in the Host Attributes sub-panel:


    +   1. In the Nickname field, type a name that uniquely identifies the associated
    host or host attachment within the ESS. The host nickname must not exceed 29 characters.
    ESS Specialist ignores the leading and trailing blanks that you entered.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '2. Select a host type from the list in the Host Type field. There are three
    types of Linux hosts that you can choose from:


    +   - Linux (x86): PC servers with the Linux operating system with v2.4 kernel.
    Although you can configure 256 LUNs on the ESS, a Linux host can only support
    128 LUNs

    - Linux (iSeries/pSeries)

    - Linux (zSeries)


    3. From the Host Attachment list you would usually select the type of interface
    used to connect the host to the ESS, but since the ESS supports Linux hosts only
    through the FCP protocol, Fibre-channel attached is the only option available
    in the Host Attachment list.


    4. In the Hostname/IP Address field, if the host is connected to the IP network,
    you have the option of entering the host name or the dotted decimal IP address.
    You should enter information in this field if you are using the IBM TotalStorage
    Expert software package.


    5. Worldwide Port Name field is enabled if you select Fibre-channel attached from
    the Host Attachment list. If the host to be identified is Fibre-Channel attached,
    select the appropriate WPPN in the list in the Worldwide Port Name field, or type
    the WWPN in manually. The WWPN list contains the WWPNs of all Fibre Channel adapters
    that are currently connected (logged in) but not yet defined to the ESS. The ESS
    discovers the WWPN from your host Fibre Channel adapter when you connect your
