  md: '```

    mkdir /media/floppy

    ```


    The system is now configured to mount the floppy at boot time. To mount the floppy
    now type the following:


    ```

    mount /media/floppy

    ```


    # CD-ROM after installation


    You may be unable to mount the CD-ROM after installation due to it being a USB
    device.


    # Red Hat


    The CD-ROM will fail to mount if the media tray had been previously switched to
    another Blade system. Edit /etc/fstab to change /dev/cdrom /dev/scd0


    ```

    /dev/scd0 /mnt/cdrom iso9660 noauto,owner,kduzu,ro 0 0

    ```


    The system is now configured to mount the CD-ROM at boot time. To mount the CD-ROM,
    type the following:


    ```

    mount /mnt/cdrom

    ```


    If this system is rebooted and the media tray is moved to another system this
    process may need to be repeated.


    # SuSE


    The CD-ROM device will be known as /dev/sr0, so remove the device /dev/cdrom and
    create a link from sr0 to /dev/cdrom. Type the following:


    ```

    rm /dev/cdrom; ln -s /dev/sr0 /dev/cdrom

    ```


    Edit /etc/fstab to include the line of text:


    ```

    /dev/cdrom /media/cdrom auto ro,noauto,user,exec 0 0

    ```


    Type /dev/cdrom /media/sr0 to manually mount a CD now.


    # Mouse after installation - SuSE only


    The mouse may not work after the server restarts. Type the following to regain
    mouse controls:


    ```

    /sbin/modprobe mousedev

    ```


    Type the following to avoid having to repeat this every time the server reboots:
    >> /etc/init.d/boot.local


    ```

    echo "/sbin/modprobe mousedev" >> /etc/init.d/boot.local

    ```'
