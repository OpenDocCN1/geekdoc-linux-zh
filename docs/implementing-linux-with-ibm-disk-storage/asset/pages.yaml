  md: "# # FAStT Storage Manager\n\nThis chapter contains a description of the FASTT\
    \ Storage Manager. FASTT\nsoftware is used to define storage in the FASTT and\
    \ to manage its availability to\fibre-attached hosts.\n\nThis is not an exhaustive\
    \ coverage as there are plenty of redbooks on the Linux\nsubject. While our emphasis\
    \ here is on using the Storage Manager in the Linux\nenvironment, we also try\
    \ to keep the content of this chapter as host-neutral as\npossible, with the host\
    \ specific details being reserved to their respective\nchapters. We cover these\
    \ topics:\n\n+   * Storage Manager concepts\n* FASTT Storage Manager client: Getting\
    \ started\n* Updating the FASTT firmware\n* Setting arrays, LUNs, and Storage\
    \ Partitioning\n* Configuring the LUN attachment"
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 9.1 FASTT Storage Manager


    The Fibre Array Storage Technology¹ (FASTT) requires a set of software and firmware
    to integrate with a host. The software includes a management component that provides
    a user interface to administer the storage system and additional programs such
    as an agent and utilities that may be required. Also included in the software
    may be a host-level driver that enables I/O path transfer within the host in the
    event of path failure in a multipath architecture. Additional software may also
    be needed to implement an appropriate environment on the management station, the
    host using storage provided by the FASTT, or both.


    In the general case, the FASTT Storage Manager Software includes the Storage Management
    Client, the Storage Management Agent, the Storage Management Utilities, and the
    Redundant Disk Array Controller (RDAC). Not all installations require all components
    of the FASTT Storage Manager suite.


    # 9.1.1 Storage Manager concepts


    Management of the FASTT subsystem requires an instance of the FASTT Storage Manager
    client on a management station. Because the FASTT Storage Manager is a Java-based
    application, any suitable management station² may be provided it can communicate
    with the FASTT storage subsystem in one of two ways:


    in-band


    The Storage Manager client communicates with an agent process over either physical
    or loopback network connection. The agent process runs on one or more of the systems
    connected via Fibre Channel to the FASTT subsystem. The agent process communicates
    with the storage controllers over the Fibre Channel by means of a special interface
    in the controller known as an Access LUN. This method is also known as indirect
    control because of the intermediary agent process. No connection is required to
    the network ports on the FASTT controllers.


    out-of-band


    The Storage Manager client communicates over physical network connections to the
    FASTT controllers. The Access LUN is not used. This method is also known as direct
    control since no additional agent process is required, and no control communication
    takes over the Fibre Channel. The default settings are 192.168.101 and 192.168.128.102.
    Linux communicates with the FASTT out-of-band, if these IPs do not fit in your
    network, these will need to be changed.


    > ¹ See the redbook, Fibre Array Storage Technology - A FASTT Introduction, SG24-6246

    ² Supported systems include Linux, AIX, Windows, Solaris, Novell VMware and HP-UX


    188 Implementing Linux with IBM Disk Storage'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Setting the IP and mask on a FASTT Controller


    Connect a serial null modem cable between a serial port on the server (otherwise
    use a client system) and Port A on the FASTT. This allows the configuration of
    Controller A.


    Use a terminal program such minicom under Linux or HyperTerminal under Windows.


    Use the following settings:


    +   - Serial device devv/ttyS1

    - Speed (9600)

    - Data/parity/stop bits (8N1)

    - Hardware Flow Control (Yes)

    - Software Flow Control (No)


    Using minicom, press Ctrl-A F to send break. If using HyperTerminal, press Ctrl-Break
    every 5 seconds until the ASCII characters become human readable.


    Press Escape to enter the FASTT shell.


    The shell prompts you for a password (Figure 9-1). The default is infiniti


    ![](img/7df754bba6e7faadf914690e9e5ed087_210_0.png)


    Figure 9-1 Password prompt for shell


    Type netCfgGShow to view the current settings (Figure 9-2).'
