    VTOC. Volume table of contents. In a DASD, the place where the space and allocation
    information of the volume is maintained.


    striping. A technique that distributes data in bit, byte, multi-byte, record,
    or block increments across multiple disk drives.


    # W


    synchronization. An initial volume copy. This is a track image of each primary
