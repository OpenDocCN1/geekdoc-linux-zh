    SLES 8 contains out-of-the-box, the Emulex device driver V4.20. Prior to the installation
    of this new version, any previous version of the driver must be uninstalled; to
    do this, enter the following command from a shell:


    ```

    rpm -qa grep emulex

    ```


    to get the name of the currently installed driver package. You will get a response
    like emulex-4.20-63. To remove the package, enter the command:


    ```

    rpm -e emulex-4.20-63.

