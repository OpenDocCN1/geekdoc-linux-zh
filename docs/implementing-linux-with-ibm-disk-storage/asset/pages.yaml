  md: '# 3.1 Introduction to zSeries


    The IBM zSeries is the successor of the S/390 series and IBM''s premier server
    for e-business transaction workloads and has a long history running commercial
    applications with unmatched reliability and availability. In 1999 Linux was ported
    to S/390 and became available in early 2000. Since then, many new features and
    device support have been added and more, and more customers are using Linux for
    S/390 and zSeries either for running new workloads or consolidating servers.


    While for zSeries supports the Extended Count Key Data (ECKDT) format on Direct
    Access Storage Devices (DASD) from the beginning, the support of Fibre Channel
    attached devices was added recently in February 2003. The aim of this book is
    to show the use of IBM disk storage with Linux among the different IBM Server
    platforms; in this chapter we will focus on the new zSeries Fibre Channel Protocol
    (FCP) support.


    For more detailed information on zSeries and Linux in general, the reader should
    refer to the following redbooks: *Linux for S/390, SG24-4987*, and *Linux for
    IBM zSeries and S/390: Distributions, SG24-6264*, as well as to the SuSE installation
    manual.


    Linux on zSeries can run in three different modes:


    +   Native using the whole machine

    - A native installation is rarely used since only one Linux system can run at
    any one time on the machine.

    In a logical partition

    - The zSeries processors support the partitioning of the native hardware into
    logical partitions. Logical partitions are an allocation of the available processor
    resource (either shared or dedicated), devices that are dedicated can be serially
    switched between partitions and an allocation of memory. In LPAR mode, up to 15
    operating systems can concurrently run on one machine without interfering with
    each other.

    A guest system under the hypervisor z/VM

    - Using z/VM as hypervisor to run operating systems as guests, only the hardware
    resources limit the amount of concurrently running instances.


    The last two options are depicted in Figure 3-1'
