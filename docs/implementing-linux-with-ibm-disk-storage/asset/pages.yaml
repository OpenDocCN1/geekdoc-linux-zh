  md: '# File systems


    We have discussed a hierarchy of files, which is sometimes referred to as a file
    system. There is a more fundamental structure that underlies this hierarchy that
    is properly known as a file system, and it is important to choose one that meets
    your needs. Just as Windows has the FAT and the NTFS file systems, Linux also
    has more than one. In fact, the selection is quite rich. In addition to being
    able to read file systems from a number of other operating systems including Windows,
    UNIX and OS/2, Linux can reside in and make read/write use several varieties including
    ext2, ext3, reiserfs, xfs, JFS, and others. What are these and why are there so
    many choices? The System Administrator''s Handbook introduces file systems this
    way:


    "A file system is the methods and data structures that an operating system uses
    to keep track of files on a disk or partition; that, is the files are organized
    on the disk. The word is also used to refer to a partition or disk that is used
    to store the files or the type of the file system. Thus, one might say "how two
    file systems mean has two partitions on which one stores files, or that one is
    using the `extended file system`, meaning the type of the file system.


    The difference between a disk partition and the file system it contains is important.
    A few programs (including, reasonably enough, programs that create file systems)
    operate directly on the raw sectors of a disk or partition; if there is an existing
    file system there will be destroyed or seriously corrupted. Most programs operate
    on a file system, and will not work on a partition that does not contain one (or
    that contains one of the wrong type).


    Before a partition or disk can be used as a file system, it needs to be initialized,
    and the bookkeeping data structures need to be written to the disk. This process
    is called a file system.^7


    SuSE Linux uses the reiserFS as its default file system, other distributions default
    to ext2 or ext3. The reasons may be historical, but that is the best criterion
    for selection. The ext2 file system has a 10-year production history, so its stability
    is absolute. It suffers from fragmentation when called upon to store a large number
    of small (a few kilobyte) files. The ext3 file system is ext2 plus journalling,
    however, the journaling implementation is dependent on kernel journalling, which
    can be considered fragile, yet ext3 can also journal both data and metadata, which
    is a feature not available with other journaling file systems. ReiserFS is a journaling
    file system that excels in both space and time efficiency


    > ^7 http://ldp.org/LDP/sag/ - chapter 6.8'
  merge: -1
