  md: 'whose relative merits or disadvantages (along with those of many other distributors)
    are discussed at length on the Internet.


    # 1.3.1 Red Hat Enterprise Linux AS (formerly Advanced Server)


    Enterprise Linux AS (formerly Red Hat Linux Advanced Server) is the core operating
    system and infrastructure Linux solution from Red Hat, supporting up to 8 CPUs
    and 16 GB of main memory, and is certified by DISA (US Defense Information Systems
    Agency) as COE (Common Operating Environment) compliant. It features High Availability
    Clustering and IP load balancing capacities, asynchronous I/O support, Linux Standard
    Base interface conformity, improved SMP integration and reduced I/O-memory copy
    overhead. Red Hat offers support and maintenance services for their enterprise
    distributions.


    # 1.3.2 SuSE Linux Enterprise Edition


    SuSE Linux Enterprise Server (SLES) is a package distribution of UnitedLinux (see
    1.3.3,"UnitedLinux") intended for server application. SuSE distributions tends
    towards standardized core content as defined by the Linux Standards Base (LSB).¹18
    SuSE also offers support and maintenance services for their enterprise distributions.


    # 1.3.3 UnitedLinux


    UnitedLinux¹¹⁹ is a partnership of industry-leading Linux companies combining
    their intellectual property, sales, support, and marketing expertise to produce
    a uniform distribution of Linux designed for business.


    Key elements of the UnitedLinux distribution include POSIX standard asynchronous
    I/O (AIO), raw I/O enhancements that provide high-bandwidth, low-overhead SCSI
    I/O, and direct I/O that moves data directly between the userspace buffer and
    the device performing the I/O, avoiding expensive copy operations, and bypassing
    the operating system''s page cache.


    Other functionality in focus includes hyper-threading to enable multi-threaded
    server applications to execute threads in parallel with each individual processor;
    large memory support to take advantage of the Intel Physical Extension to support
    up to 64 GB of physical RAM, and the full 4 GB of virtual addressing space per
    process; Internet Protocol Version 6 (IPv6), the next generation protocol designed
    by the IETF to replace the current version Internet


    +   ¹⁷ http://www.suse.com/

    ¹⁸ http://www.opengroup.org/lsb/cert/

    ¹⁹ http://www.unifiedlinux.com'
