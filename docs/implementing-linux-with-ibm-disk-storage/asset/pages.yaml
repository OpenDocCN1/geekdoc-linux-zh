  md: '# IBM @server zSeries


    ![](img/7df754bba6e7faadf914690e9e5ed087_55_0.png)


    Figure 3-8 IBM eServer zSeries


    # ### 3.2.1 Hardware requirements


    In this section we review the hardware requirements for running Linux on zSeries;
    and we successively look at the processor, memory, storage, and network specific
    requirements.


    # Processor


    The heart of zSeries and S/390 hardware is the Multi-Chip Module (MCM), which
    contains up to 20 Processing Units (PU), commonly referred to on other platforms
    as CPUs or engines. All PUs are identical, but can take different roles in the
    system.


    +   - A central processor (CP), sometimes called a standard engine

    - A System Assist Processor (SAP)

    - An Internal Coupling Facility (ICF) for Parallel Sysplex®

    - An Integrated Facility for Linux (IFL), sometimes called an IFL engine


    The engine is a new type of PU reserved for Linux; it cannot run any other operating
    systems. It is priced lower than standard engines, and its presence does not affect
    the power ratings, hence, does not increase the cost of other software installed
    on that hardware.


    Linux needs at least 1 PU configured as CP or IFL, but scales up to 16 processors
    on zSeries. The PUs can be either shared with other partitions (provided the LPARs
    are running Linux or z/VM) or dedicated.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Memory


    The memory requirements are mostly dependent on the purpose of the server

    system and type of applications you are going to deploy on this system. For the

    installation, SuSE recommends the following:


    +   - 128 MB: For text mode installation

    - 256 MB: For graphical (X11) mode from nfs or sm source

    - 512 MB: For installation using VNC (graphical remotely displayed in

    Java-enabled Web browser) and FTP source


    # Storage


    To hold the operating system, a certain amount of storage has to be in ECKD

    format since booting (or Initial Program Load - IPL) from Fibre Channel attached

    storage is not supported.


    The types of zSeries DASD are referred to by their machine type and model

    number. For the 3390s, there are five possible model numbers: 1, 2, 3, 9, and
    27.

    Models 3 and 9 are seen most commonly and are sometimes called a pack or

    volume. In the past, these DASDS were large physical devices, but today they are

    emulated by disk arrays with much larger capacities like the ESS. A 3390

    model 3 (or more simply, 3390-3) has a capacity of approximately 2.8 GB, but

    when formatted for Linux, that is reduced to about 2.3 GB. A 3390 model 9 has
    a

    capacity of about 8.4 GB, but when formatted, that is reduced to about 7.0 GB.


    For the operating system files, we need approximately 1.6 GB of DASD storage.

    Including the requirements for swap and some free space; the equivalent of 1

    3390-volume is sufficient for a basic installation of SLES 8.


    To attach via Fibre Channel you need a zSeries FCP channel. A FCP

    channel requires a FICON card (feature 2315 or 2318), or a FICON Express card

    (feature 2319 or 2320). This is the same hardware used for FICON

    channels, however, a different load is required.


    The type of firmware to be loaded into the FICON/FICON Express card, turning

    into either an FCP channel or into one of the FICON type channels (FC or FCP),

    is controlled by the definition of the channel type for that particular channel
    in the

    IOCP (CHPIAD statement). Thus, by defining FCP channels in the IOCP,

    total number of FICON type channels that can be configured is reduced

    according.


    The two channels residing on a single FICON/FICON Express card can be

    configured individually, and each can be a different channel type.


    For the LPAR installation of SLES 8 you can use the BMC CD-ROM or an FTP

    server, or if that is not possible, you have to prepare a tape to IPL from the'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'installation. Thus, you might need access to a tape unit such as a 3480, 3490,
    or 3590.


    # Network


    Physical networking is typically done through one or more flavors of the Open

    Systems Adapters (OSA). Please refer to 3.2.3, "Connection requirements" on

    page 37.


    # 3.2.2 Software requirements


    The following MicroCode and software are required for the installation (as

    described in SLES installation manual).


    # Microcode level and APARs/fixes


