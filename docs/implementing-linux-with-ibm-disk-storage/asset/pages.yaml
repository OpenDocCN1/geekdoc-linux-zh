    hosts and I/O adapters) - analogous to a MAC address on a network card.


    synchronous operation. A type of operation where the remote copy PPRC function
    updates to the secondary volume of PPRC at the same time that the primary volume
    is updated. Contrast with asynchronous operation.


    write hit. A write operation where the data is requested in the cache.


    write miss. A write operation where the data requested is not in the cache.


