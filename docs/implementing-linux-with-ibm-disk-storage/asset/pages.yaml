  md: '# Preface


    This IBM® Redbook explains the considerations, requirements, pitfalls, and possibilities
    when implementing Linux with IBM disk storage products.


    This redbook presents the reader with a practical overview of the tasks involved
    in installing Linux on a variety of IBM @server platforms.


    It also introduces the people who are already familiar with Linux to the IBM disk
    storage products.


    Specifically, we worked with the Enterprise Storage Server™ (ESS) and the FASIT
    Storage Server, covering their installation and configuration with Linux distributions
    on the IBM server xSeries™, zSeries™, and pSeries™ models.


    Configurations and practical experiments conducted by a team of professionals
    at the ITSO, San Jose Center, implemented these Linux environments are documented
    in this book. It is expected that people who wish to work with Linux and storage
    subsystems will first become familiar with Linux and its installation documentation
    and support sources. We provide the basic steps to get the storage subsystems
    in a state ready for Linux host attachment, and storage specific steps on preparing
    the Linux host for attachment to the storage subsystem. We also provide pointers
    and references to the documents and Web sites that will be of interest at the
    time you will be doing your implementation.


    IT specialists in the field will find this book helpful as a starting point and
    reference when implementing Linux using the IBM disk storage servers.


