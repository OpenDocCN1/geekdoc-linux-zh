    To make the devices available permanently (also after a reboot), you have to create
    a new initial ramdisk containing the necessary modules and parameter information.
    First, save the module parameters in the configuration file /etc/zffcp.conf.


    Example 3-12 Configuration file for zfcp


    ```

    vminux~ # cat /proc/scsi/zfcp/map > /etc/zfcp.conf

    vminux~ # cat /etc/zfcp.conf

    0x0600000001:0x5005076300c8599 0x00000000:0x5301000000000000

    0x0600000001:0x5005076300c8599 0x00000001:0x5302000000000000

    0x0600000001:0x5005076300c8599 0x00000002:0x5300000000000000

    ```


    Next, create a new ramdisk is done with the utility mkinitrd and then run zip
    to update the IPL record to point to the new ramdisk. This is shown in Example
    3-13.


