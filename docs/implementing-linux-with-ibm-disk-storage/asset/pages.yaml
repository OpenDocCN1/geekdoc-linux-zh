    # Add devices and make changes permanent


    To add more than one device to your SCSI configuration, it is more convenient
    to write a small script with all parameters included as shown in Example 3-9


    Example 3-9 Module load script


    ```

    vmluxa:~ # cat scsi.sh

    modprobe scsi_mod

    modprobe zfcp map=\n0x0600 1:05050507630c89589 0:0x5301000000000000\

    0x0600 1:05050507630c89589 1:0x5302000000000000\

    0x0600 1:05050507630c89589 2:0x5303000000000000"

    modprobe siid_mod

    ```


    Make sure the modules are unloaded before executing the script


    Example 3-10 Module load script


    ```

    vmluxa:~ # sh scsi.sh

    vmluxa:~ # cat /proc/scsi/scsi

