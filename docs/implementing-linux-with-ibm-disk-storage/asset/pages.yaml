  md: "Build the ramdisk as before:\nmkinitrd -f /boot/<newname>.img <kernel-version>\n\
    \nThe -f option allows you to build a ramdisk to a name that already exists, i.e\n\
    overwrite it. In our case we used the following command with Red Hat Advanced\n\
    Server (your naming convention may vary from this example):\nmkinitrd -f /boot/initrd-storage-2.4.9-e12summit.img\
    \ 2.4.9-e.12summit\n\nIf you used a new name for the ramdisk, update /etc/group\
    \ and reboot the system.\n\n# 10.1.3 Using FASTt as storage: A summary\n\nAs described\
    \ before, you must set up your storage before building the initial\nramdisk. Otherwise,\
    \ the module will be loaded without a path configuration and\nn manual load balancing\
    \ will be possible.\n\nFirst you install the required management software. Install\
    \ (at least) qremote\nfrom the FASIT MSJ package on the host. After you have configured\
    \ your\nstorage, launch the qremote agent and access it with the MSJ (either locally\
    \ or\n a management station). After you have set up your paths, MSJ instructs\n\
    qremote to write an option string to the modules.conf, which is used to configure\n\
    t driver module during boot system.\n\n> Note: Run qremote only during the usage\
    \ of FASIT MSJ. Once you are done\n the output string is written to the modules.conf,\
    \ stop qremote\nimmediately!\n\nYou can verify your setup by unloading the module\
    \ with rmod qla2x00 and\nreload with modprobe qla2x00. During this load the module\
    \ will use the option\nstring carrying the path definitions and activate them.\
    \ Then start qremote again\nand check the setting with FASIT MSJ.\n\n# SuSE notes\n\
    \nBefore you build the new ramdisk you have to make the change to the\nfile /etc/sysconfig/kernel:\
    \ add qla2200 or qla2300 to the string behind\nINITRD_MODULES, depending on your\
    \ HBA designation:\n\n```\nINITRD_MODULES=\"aic7xxx reiserf qla2300\"\n```\n\n\
    The script /sbin/mk_initrd uses this string as input. By running mk_initrd a\n\
    new version of the initial ramdisk is built in the /boot directory. Even though\
    \ this\nis convenient you might build a new ramdisk instead of replacing the existing\
    \ one.\nH a at the mk_initrd script, it offers you quite some useful (and\nsometimes\
    \ colorful) options."
  merge: -1
