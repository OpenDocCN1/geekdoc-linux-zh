    made to every service. In the case of multiple failures, all the requests to that
    particular service should be blocked (break the circuit) for a set time. After
    the set time expires, another attempt should be made, and so. Once the response
    is successful, reconnect the circuit. This should be done at the service instance
    level. Netflix''s Hystrix provides an open source circuit-breaker implementation.


