    +   * Cost to build: $S_{CTB}$

    * Cost to maintain: $S_{CTM}$

    * Cost to change/update: $S_{CTU}$

    * Cost to scale: $S_{CTS}$

    * Time to market: $S_{TTM}$


    So, which platform architecture is more cost effective? Let''s compare monolithic
    and microservices based on each of the preceding variables.


    +   * Cost to build: $M_{CTB} < S_{CTB}$. If you already have an application in
    place, you have to account for all the new investment that may be required, such
    as training the staff, changing the culture, hiring new talent, and updating tools
    and systems. Given these considerations, the cost to build a microservices-based
    application may be very high compared to building a monolithic one. Contrast,
    if you are starting a brand-new software project, then the costs may not differ
    depending on current organizational capabilities. Given system and tools, the
    cost of building a monolithic application may still be lower but not a lot.


    +   * Cost to maintain: $M_{CTM} > S_{CTM}$. Maintaining hardware and applying
    patches may draw down in certain conditions. There are lots of source technologies
    that enable all kinds of automations from deployment to fault isolation. We cover
    many of these tools later in the book. For example, containerizing microservices
    and moving toward DevOps would enable spinning up new service containers on demand,
    which can save a lot of IT time and create efficient resource utilization, hence
    bringing down the overall cost of maintenance while reducing the possibility of
    downtime.'
