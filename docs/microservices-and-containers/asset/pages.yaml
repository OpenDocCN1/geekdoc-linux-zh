    Software Testing Standards). The main purpose behind these standards was to control
    the complexity by using best practices. This helped in two ways: first, by improving
    the chances of project completion; second, by increasing the shelf life or age
    of the application.


    Software applications or platforms have an average age of four to six years, after
    which they fall into obsolescence due to various reasons. The reasons may include
    changing requirements over time, inability to scale due to legacy architecture,
    outdated technologies given the pace of change in the technology world, and so
    on. The industry tends to get on the Next Gen bandwagon, which means rewriting
