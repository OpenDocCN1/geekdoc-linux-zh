  md: '# Chapter 13


    # Case Study: Containerizing a Helpdesk Application


    In Chapter 12, "Case Study: Migration to Microservices," we created three microservices
    based on our needs and the criteria we learned throughout this book. The next
    question becomes, how do we scale this model? In the real world, a large-scale
    application may have hundreds to thousands of microservices. In this chapter,
    we use our knowledge of Docker containers to deploy and scale the microservices
    on demand.


    The monolithic part of our application will continue to run as is, but we will
    containerize the microservices part of the application, which includes ticketing,
    product catalog, and search, and make appropriate changes to the monolithic application.


    # Containerizing Microservices


    In this section, we containerize the product catalog microservice we created in
    the Chapter 12. Armed with our knowledge so far, containerizing microservices
    involves the following steps:


    +   1. Make a list of dependencies required for each microservice.

    2. Build the binaries, WAR files, and so on, that compose the microservice.

    3. Create a Docker image that includes items in the previous two steps.

    4. Use the image created in step 3 to launch one or more containers.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Listing Dependencies


    Here is the list of software that’s required (dependencies) to run the product
    catalog microservice:


    +   - Tomcat: Required to run the application (product catalog) code

    - Java: A dependency for Tomcat to function properly

    - MySQL connector: A dependency for Tomcat to connect to MySQL

    - Apache Maven: To be installed on the system where you are building your microservice
    (for reference, see https://maven.apache.org/install.html)


    # Build Binaries and WAR files


    Now that we have identified the dependent software to run the catalog microservice,
    the next thing we need is to produce a WAR file (binary) itself. Please follow
    the following instructions to build and produce a WAR file for the catalog microservice.
    For this task, clone the code from the GitHub repository for our catalog microservice:
    https://github.com/kocherM/Helpdesk_Microservices.git


    Since we are building our first microservice, we should take advantage of the
    latest toolset available. In this case, we use Apache Maven to build the WAR file
    instead of Apache Ant (as we did for a monolithic application) because Maven is
    a more advanced build automation tool.. For example, it also downloads the library
    dependencies for the project.


    The next task is to verify that the Apache POM file is located in the root directory
    of your cloned code. The POM consists of the dependencies, such as the Java Runtime
    version, the Maven central repository information, and a list of required JAR
    files.


    If it is all there, then the next step is to build the WAR file. `mvn install`
    from the command line at the project root directory, or right-click on the POM
    file in Eclipse editor and select `mvn install`. A folder named Target Should
    have been created in the root directory, which will have the WAR file.


    # Creating a Docker Image


    Let’s look how to create a Docker image for our product catalog service. The approach
    to create images for other microservices, such as ticketing, is the same except
    that you include the appropriate binaries of the chosen microservice and the environment
    dependencies.'
  merge: -1
