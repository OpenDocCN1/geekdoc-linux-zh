  md: "# Docker Diff\n\nThe docker diff command is self-explanatory, but it's another\
    \ important command—it lists the changed files and directories in a container\
    \ file system:\n\ndocker diff Container ID\n\nOver time, as you make changes to\
    \ your container, this command highlights the file system differences relative\
    \ to the base image.\n\n# Dockerfile\n\nLet's build the same MySQL container we\
    \ used in the previous examples on top of Ubuntu OS using a Dockerfile. As we\
    \ discussed earlier, the Dockerfile is basically a set of instructions or commands\
    \ that Docker can execute to build an image. It is similar to a text file and\
    \ can be created without any programming language knowledge. It has simple commands\
    \ that you can use with very simple syntax. There is a simple format that you\
    \ need to learn:\n\n+   - The Dockerfile must always start with the FROM instruction\
    \ that specifies the base image to start. Use # in the beginning of the line for\
    \ commands. FROM instructions do support variables, and for that reason, the only\
    \ instruction that can precede FROM instruction is the ARG instruction. Here's\
    \ an example:\n  ARG OS_VERSION=14.04\n  FROM Ubuntu:$OS_VERSION\n\n+   - The\
    \ syntax is Instruction Arguments.\n\n+   - Every instruction is executed sequentially\
    \ from top to bottom.\n\n+   - The Dockerfile and the associated files in this\
    \ directory are sent to the Docker daemon. For that reason, and to keep the size\
    \ of your image light, do not store nonessential files in this directory.\n\n\
    Here are some of the simple instructions you can use in a Dockerfile:\n\n+   -\
    \ ADD copies the file(s) from the specified source on the host system or a URL\
    \ to the specified destination to start with within the container."
  merge: -1
  pgno: 114
- img_proc: true
  md: '+   CMD executes the specified command when the container is instantiated.
    There can be only one CMD inside a Dockerfile. If there''s more than one CMD instruction,
    then the last appearing CMD instruction in the DOCKERFILE will be executed.


    +   ENTRYPOINT specifies the default executable that should run when the container
    starts. This is a must if you want your image to be runnable or use CMD.


    +   ENV sets the environment variables in the Dockerfile, which can then be used
    as part of the instructions—for example, ENV MYSQL_ROOT_PASSWORD password.


    +   EXPOSE specifies the port number that the container will listen.


    +   FROM specifies the base image to start the build image. This is the very first
    command, and a mandatory one in the Dockerfile.


    +   MAINTAINER sets the author information in the generated images—for example,
    MAINTAINER pkocher@domain.com.


    +   RUN executes the specified command(s) and creates a layer for every RUN instruction.
    The next layer will be built on the previous committed layer.


    +   USER sets the user name or user ID to be used when running the image or various
    instructions such as RUN, CMD, and ENTRYPOINT.


    +   VOLUME specifies one or more shared volumes on the host machine that can be
    accessed from the containers.


    +   WORKDIR sets the working directory for any RUN, CMD, ENTRYPOINT, COPY, or
    ADD instruction.


    # MySQL Dockerfile


    Now that we understand the Dockerfile, let''s build one for a MySQL container
    on top of Ubuntu OS. Use the editor of your choice (Vi, Pico, etc.) and create
    a new file Dockerfile. Add the following instructions:


    ```

    From ubuntu:14.04

    Maintainer pkocher@domain.com

    Run apt -get -y install MySQL-server

    EXPOSE 3306

    CMD ["/usr/bin/MySQL_safe"]

    ```'
