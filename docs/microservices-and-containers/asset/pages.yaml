  md: 'Although some of the results, such as dockerizedrupal, unique, many are duplicates
    because they''ve been uploaded by dockerized users who have used them for custom
    purposes or made integrations. Using the -s option, the search produces only the
    widely used files based on feedback from other users:


    ```

    docker search -s 50 mysql

    ```


    This command returns all the images that have "mysql" in the name of the image
    and at least 50 stars in feedback, as shown in Figure 7.3.


    NAME DESCRIPTION STARS OFFICIAL AUTOMATED

    ysql MySQL is a widely used, open-source relati... 1044 [OK]

    marialb MariaDB08 is a community-developed fork of M... 214 [OK]

    Parminders-MacBook-Pro-: parminderkochers |


    **Figure 7.3** Search results with "mysql" in the name of the image and at least
    50 stars in feedback


    In this case, only two entries are listed, as they are the only two with more
    than 50 ratings.


    > Note

    Docker has been evolving at a tremendous pace, commands, options, and even features
    and functionality frequently change across releases. For example, as this book
    was written, the -s in search was deprecated; a flag called --filter must be used.
    With the filter option, the command to list all the MySQL images with star ratings
    of 50 or more would be


    ```

    docker search --filter stars=50 mysql

    ```


    # Docker Pull


    The docker pull command downloads the requested image from the Docker registry
    to our local machine:


    ```

    docker pull image:tag

    ```


    For example, docker pull MySQL, shown in Figure 7.4, pulls the MySQL image from
    the registry. Unless a tag, such as version, is specified, this command appends
    the "latest" tag by default instead of pulling all the MySQL images available.
    The command is equivalent to


    ```

    docker pull MySQL:latest

    ```'
