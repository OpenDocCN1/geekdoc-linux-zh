  md: 'following three most commonly used custom networks: custom bridge network driver,
    overlays network driver, and underlays (MACVLAN) network driver.


    # Custom Bridge Network Driver


    The bridge driver is very similar to docker0, which we discussed earlier, but
    has more features, such as IPAM (IP address management) and service discovery.
    It also provides more flexibility.


    To create a custom bridge network, we use the following command:


    ```

    docker network create [OPTIONS] NETWORK

    ```


    We can specify an IP address and subnet in the command if required, or Docker
    will assign the next subnet available in the private IP space. Let''s execute
    this command:


    ```

    docker network create --driver bridge pkNetwork

    ```


