  md: '# Search


    Users can search across the application for issues. The application has three
    search options, as shown in Figure A.16:


    +   - **Basic Search**: Performs a database scan for the keywords.

    - **Wiki Search**: Searches all Wiki data for the keyword.

    - **Advance Search**: Uses Solr search, which is a text search and is more accurate
    than a basic search.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_278_0.png)


    **Figure A.16** Searching the application for issues


    # My Profile


    These two tabs show the user profile for the logged-in user. The first tab shows
    the personal information, as shown in Figure A.17; the second shows the account
    information, as shown in Figure A.18.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_278_1.png)


    **Figure A.17** User profile'
