    ports:\n  - 9090:9090\nnetworks:\n- pk_network\nlabels:\n  org.label-schema.group:\
    \ \"monitoring for PK containers\"\n```\n\nCreate a rules file to configure alerting\
    \ rules; name this file container.rules:\n\n```\nALERT tomcat_down\nIF absent(container_memory_usage_bytes(name=tomcat))\n\
    FOR 10s\nLABELS { severity = \"critical\" }\nANNOTATIONS {\n  summary=\"tomcat\
    \ down\"\n  description=\"tomcat container is down for more than 10 seconds.\"\
    \n}\n```\n\nThis rule checks for the Tomcat status. It generates alerts if Tomcat\
    \ goes down. It does this by checking the memory used by Tomcat; if the stats\
    \ are absent, it sends out an alert."
