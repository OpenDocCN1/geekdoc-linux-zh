  md: '# SERVICE REGISTRY


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_158_0.png)


    **Figure 9.11** Server-side service discovery


    Microservices and service discovery go hand in hand. In fact, there are many open
    source tools for service discovery, including Consul (HashiCorp), Zookeeper (Apache),
    etcd, SmartStack (AirBn), Eureka (Netflix), and SkyDNS. These tools have a lot
    of capabilities in common. They are mainly differentiated in terms of the footprint
    (light versus heavy) and protocols supported to query services (DNS, HTTP/TCP,
    etc.).


    # Service Registry


    Service registry is like a Yellow Pages for the microservices running in the environment.
    It has details about where a given microservice is running in the cluster (e.g.,
    host and port). As we know, microservices can come up (new instances may be spun
    up for scaling) or go down in the event of failure and eventually be restarted
    in another node. What this means is that their location is not static—it may change.
    There are at least two different ways to communicate the location of a given microservice
    to service registry:


    +   **Self-registration.** This process by which a given microservice sends itself
    its information to service registry, as shown in Figure 9.12. For example, Consul
    is a popular choice for service registry, and it exposes an API to interact with
    it. With self-registration, each microservice will have to interact with the'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'Consul API to send its whereabouts. According to microservices’ patterns and
    best practices, each microservice should focus on a single concern—one piece of
    functionality. However, forcing the microservices to send their location information
    to the service registry violates the single-concern-responsibility pattern. For
    this reason, self-registration is not a widely used option.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_159_0.png)


    **Figure 9.12** Service registry self-registration


    +   - External tools, or third-party registration. Leveraging external tools for
    service registry is the best choice for a simple reason: the microservices can
    focus on their core responsibility and not worry about sending their location
    information to a service registry. It’s a clear separation of concern; tomorrow,
    if you want to change the way the microservices need to be discovered and stored
    in the service registry, you can do it without touching the microservices code.


    Let’s see how a third-party registration would work in the example previously
    discussed. Registrator (https://github.com/gliderslabs/registry) is an open source
    component that serves as a bridge between service registry and Docker containers.
    It automatically registers and deregisters services by keeping an eye on the Docker
    containers as they come up and go down.


    As a Docker container comes up or goes down, it fires off events (notifications),
    and any third-party tool can subscribe to these events to take appropriate actions.
    Registrator simply watches for these Docker events and, like docker inspect, inspects
    these containers to see what services they provide. It then communicates with
    any service registry tool (e.g., Consul, etcd, SkyDNS2) and sends the information
    about the discovered service.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'In Figure 9.13, you can see that Registrator is a component that''s installed
    on all the worker nodes that run containers. It''s configured with a service registry
    (which is where the actual information about the services running in cluster is
    stored) to which it sends information about the discovered services. As a container
    is spun up or goes down in a given node, Docker fires off events, and the Registrator
    component living in each node picks up these events and inspects the containers
    to get additional information about the services.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_160_0.png)


    **Figure 9.13** Registrator installed on all the worker nodes that run containers


    This wraps up our deployment and discovery topics. We use this learning extension
    extensively in dockerizing our project in Part III of the book.'
