    # Docker Compose


    Applications using Docker are typically multicontainer applications. That is,
    they have components (e.g., app, web, database) that are deployed in multiple
    Docker containers. To simplify the deployment of multicontainer applications,
    as well as to run them in an easy way, Docker introduced Docker Compose.


    Let''s assume we want to spin up an application that consists of Tomcat and a
    MySQL database. Here''s how we can capture these two services in a docker-compose.yml
    file.


    ```

    version: ''2''

    services:

    ```'
