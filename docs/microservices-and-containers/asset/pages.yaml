  md: '# docker stats command


    The docker stats command provides you with live performance data for the containers
    running on your host system at the given time:


    docker stats [Options] [Containers]


    You can provide container IDs for the specific containers you are interested in
    or use the -a option for all containers. If you do not specify an option, Docker
    presents you with all running containers:


    Let''s execute this command:


    docker stats


    Figure 10.3 shows the result of the docker stats command, which returns the resource
    usage statistics.


    | CONTAINER | CPU% | MEM USAGE / LIMIT | MEM% | NET I/O | BLOCK I/O | PIDS |

    |---|---|---|---|---|---|-|

    | e4b381be0fd4 | 0.00% | 1.98 MB / 47.08 GB | 0.00% | 0 / 0 | 2.12 MB / 0 | 1
    |


    **Figure 10.3** Executing the docker stats command


    Press Ctrl+C to exit the stream. You can customize the output by providing the
    desired format with the --format option. For example:


    ```

    docker stats --format "table {{.Name}} \t {{.ID}} \t {{.CPUPerc}} \t{{.MemUsage}}\
    \t

    ```


    You can include the following metrics with the --format option:


    +   * .Name returns the container name.

    * .ID returns the container ID.

    * .CPUPerc returns the CPU utilization percentage.

    * .MemUsage returns the memory utilization.

    * .NetIO returns the I/O utilization.

    * .BlockIO returns the block I/O utilization.

    * .MemPerc returns the memory utilization percentage.

    * .PIDs returns the number of PIDs.'
