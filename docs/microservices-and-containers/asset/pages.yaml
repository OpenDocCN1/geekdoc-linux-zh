    # Custom Networks


    In addition to the three default networks included when you install Docker, you
    can define custom networks to control connectivity. Docker provides network drivers
    that you can utilize to create these custom networks. Creating a custom network
    gives you full control and flexibility, as you will learn in this section. We
    discuss the'
