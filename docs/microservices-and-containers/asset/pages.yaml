  md: '# Other Advantages of Microservices


    software platform using the latest technologies, new architecture, and new practices.
    But at some point, the question must be asked: Does it really require changing
    every component—that is, the complete package? Not necessarily. Some components
    or parts do much better given the new technologies, but that usually is not an
    option, as the architecture did not provide the modularity, enabling us to replace
    individual software components or parts with rewritten code.


    We have been developing monolithic applications—hence the need to deal with complexity.
    If we break down this complexity by using a microservices paradigm, we will end
    up with a modular architecture that significantly increases the shelf life. In
    addition, we can immediately reduce our dependence on multiple standards and bulk
    software development processes to save time, fast-tracking the overall software
    development lifecycle.


    Apart from the process efficiencies, a modular architecture will also create a
    lot of savings down the road when we want to upgrade the platform. Instead of
    starting from scratch, we can surgically remove the outdated microservices and
    replace them with new ones implemented using the right technology and design.
    This is one of key long-term benefits of the microservices paradigm and one of
    the distinct advantages that sets it apart from others. However, in most cases,
    gains from the increased modularity alone make a microservices-based approach
    worth the investment.


    # Other Advantages of Microservices


    In addition to what we discussed so far, microservices may offer the following
    benefits to an organization and its engineers:


    +   - Simplicity. Each microservice performs only one distinct and well-defined
    function, so there is less code to take care of, less cohesion and dependency
    within the code, and a lower probability of bugs.

    - Scalability. To scale a monolithic application, we need to deploy resource-heavy
    applications on multiple servers behind a load balancer. It is not possible to
    scale just a portion of an application; it is all or nothing. With microservices,
    we can scale out only the components that are expected to be highly loaded, as
    shown in Figure 1.7. Providing differentiated levels of scalability is very easy
    and a salient feature of microservices.

    - Continuous delivery. Because of fewerdependencies within the code bases and
    faster development cycles, the microservices paradigm enables and actually lends
    itself to a culture of continuous delivery and DevOps.'
