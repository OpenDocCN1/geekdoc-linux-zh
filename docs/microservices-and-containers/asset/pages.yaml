    \ why it's critical. Simply put, service discovery is about locating where a particular\
    \ service is running—for example, “Where is service X?” where X may be a database\
    \ server, cache server, or any other application service.\n\nIn the good old days,\
    \ when we had physical machines to deploy our applications, services running on\
    \ machines were named appropriately to represent the services running on. For\
    \ example, a database server for the helpdesk application running on a physical\
    \ machine would possibly be named \"helpdesk-db.domain.com.\" Now when the client—say,\
    \ an application server such as Tomcat—wants to consume the database, it typically\
    \ gets configured using properties or configuration files on the database server."
