  md: '# # Chapter 3


    # # Interprocess Communication


    In monolithic architectures, the communication within the components happens via
    function, method, or module calls and is very straightforward in most cases. When
    building microservices architecture, designing and implementing interprocess communication
    is more complex. Although there are proven techniques for managing interprocess
    communication in a microservices architecture, and it is not a key subject of
    this book, in this chapter we review some of the best practices.


    # # Types of Interactions


    Microservices typically expose their functionalities through APIs or web services.
    To consume the web services over the network, there are fundamentally two types
    of communication/interaction patterns.


    +   * Synchronous communication. An interaction in which the client expects immediate
    response while blocking everything else (e.g., HTTP request/response).

    * Asynchronous communication. An interaction in which the service response is
    not expected immediately. The client makes the service call and continues with
    its work. Examples include publish/subscribe and HTTP request/asynchronous response.


    As we discussed in Chapter 1, “An Introduction to Microservices,” asynchronous
