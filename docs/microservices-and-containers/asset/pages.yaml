  md: '# MIGRATING A MONOLITHIC APPLICATION TO MICROSERVICES


    while the rest of the application can still be using a different language. Likewise,
    you may want some microservices to be extremely fast and may decide to write them
    in C to get the maximum gains rather than writing in another high-level language.
    The bottom line is to take advantage of this flexibility.


    +   * Storage alternatives or polyglot persistence. With the rise of big data,
    components of the application may provide value by using NoSQL databases rather
    than relational databases. If any such component in the application may benefit
    from this alternative, then it may be right time to make the switch to NoSQL.


    These are the key aspects you should consider for each service or feature within
    your monolithic application, and you need to prioritize the conversion of such
    items first. Once you have derived the value from high-priority items, you can
    then apply other rules.


    +   * Modification requests. One important thing to track in software lifecycle
    is the new enhancements or changes. Features that have a higher number of change
    requests may be suitable for microservices because of the build and deployment
    time. Separating such requests reduces the build and deployment time, as you will
    not have to build the entire application, just the changed microservice, which
    may also increase availability time for the rest of the application.


    +   * Deployment. There are always some parts of the application that add deployment
    complexity. In a monolithic, even if a particular feature is untouched, you still
    must go through the complete build and deployment process. If such cases exist,
    it is beneficial to cut out such pieces and replace them with microservices so
    your overall deployment time is reduced for the rest of the monolithic application.
    We talk more about this after we learn about containers.


    +   * Helper services. In most applications, the core or main service depends
    on some of the helper services. The unavailability of such helper functions may
    impact the availability of the core service. For example, in our helpdesk application,
    discussed in Chapter 11, ticketing depends on the product catalog service. If
    the product catalog service is not available, the user will be unable to submit
    a ticket. If such cases exist, helper services should be converted to microservices
    and appropriately made highly available so they can better serve core services.
    These are also called circuit-breaker services.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Depending on the application, this criteria may require most of the services
    to be converted to microservices, and that is okay. The intention here is to simplify
    the conversion process so that you can prioritize and define the roadmap for your
    migration to a microservices-based architecture.


    # # Rearchitecting the Services


    Once you have identified the functions to be migrated as microservices, it''s
    time to start rearchitecting the selected services following the best practices
    from the earlier scenario. Here are the aspects to keep in mind:


    +   - Microservices definition. For each function, define the appropriate microservices,
    which should include communication mechanism (API), technology definition, and
    so on. Consider the data your existing function uses, or on heavy databases as
    Oracle, would it make sense to move to MySQL? Determine how you are going to manage
    the data relationship. Finally, run each microservices as a separate application.


    +   - Refactor code. You may reuse some of the code if you are not changing the
    programming language. Think about the storage/database layer—shared vs. dedicated,
    in-memory vs. external. The goal here is not to add new functionality unless required
    but repackage the existing code and expose the required APIs.


    +   - Versioning. Before you begin coding, decide on the source control and versioning
    mechanism, and make sure these standards are followed. Each microservice is to
    be a separate project and deployed as a separate application.


    +   - Data migration. If you decide to create a new database, you will have to
    migrate the legacy data also. This is usually handled by writing simple scripts
    on your source and destination.


    +   - Monolithic code. Initially, leave the existing code in the monolithic application
    in case you have to roll back. You can update the rest of the code to use the
    new microservices or, better, split your application traffic, if possible, to
    utilize both the monolithic and microservices version. This provides you the opportunity
    to test and keep an eye on performance. Once confident, you can move all the traffic
    to microservices and disable/get rid of old code.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   * Independent build, deploy, and manage. As you roll out new versions of
    microservices, you can again split the traffic between the old and the new version
    for some time. This means that you may have two or more versions of the same microservice
    running in the production environment. Some of the user traffic can be routed
    to the new microservice version to make sure the service works and performs right.
    If the new version is not performing optimally or as expected, it would be easy
    to roll back all the traffic to the previous version and send the new version
    back to development. The key here is to set up the repeatable automated deployment
    process and move toward continuous delivery.


    +   * Old code removal. You can remove your temporary code and delete the data
    from the old storage location only after you have verified that everything is
    migrated correctly and operating as expected. Be sure to make backups along the
    way.


    # A Hybrid Approach


    When writing a brand-new application, developers can directly follow the microservices
    architecture principles and blueprint to build the software application, as we
    have discussed. Developers sometimes follow a kind of hybrid approach of microservices
    and monolithic. In this case, they can develop part of their application as microservices
    and the rest following standard SOA/MVC practices based on certain criteria. The
    idea is that not all components of the application may qualify as microservices.


    As we discussed in Chapter 3, microservices offer lot of flexibility, but this
    flexibility comes at some cost. The hybrid approach is to balance the flexibility
    and cost aspects with the understanding that, over time, components can be pulled
    out of the monolithic part and converted to microservices on an as-needed basis.
    The key is to keep both approaches in mind, along with microservices criteria,
    during this transition.'
  merge: -1
