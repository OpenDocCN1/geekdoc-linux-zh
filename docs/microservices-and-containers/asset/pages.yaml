  md: '# CONTAINERIZING MICROSERVICES


    ```

    # Run tomcat in the foreground

    CMD ["/opt/tomcat/bin/catalina.sh", "run"]

    ```


    Let''s look closer at this snippet:


    +   - The ADD command instructs Docker to copy the catalog-svc.war file to the
    Tomcat webapps directory because we want the catalog service to start as soon
    as the container is launched.

    - Expose a command that exposes Tomcat''s port to the host machine on which the
    container is running.

    - CMD is the default command that gets executed when a container is launched.
    By starting Tomcat as the default command when a container is launched, we get
    two things: first, Tomcat is started automatically, and second, the product catalog
    service is deployed automatically.


    Here is the complete file for reference:


    ```

    # Based on Ubuntu 17.04

    FROM ubuntu:17.04

    # Environment variables to install Tomcat 7; you may change the

    # minor version of Tomcat according to your needs. To change the

    # major version as well (e.g., to Tomcat 8), you must be sure to

    # change the TOMCAT_LOCATION variable as well.

    ```


    ```

    ENV TOMCAT_VERSION=7.0.81

    ENV TOMCAT_FILENAME=apache-tomcat-$TOMCAT_VERSION.tar.gz

    ENV TOMCAT_DIRECTORY=apache-tomcat-$TOMCAT_VERSION

    ENV TOMCAT_LOCATION=http://www-eu.apache.org/dist/tomcat/ \

    tomcat-7v$TOMCAT_VERSION/bin/$TOMCAT_FILENAME

    ```


    ```

    # Fetch Tomcat; install required utilities such as wget & JDK1.8.

    # Clean up apt cache, ''apt-get update'' is going to bust the cache

    # always.

    RUN apt-get update && \

    apt-get install -y default-jdk && \

    rm -rf /var/lib/apt/lists/* && \

    wget $TOMCAT_LOCATION

    ```


    ```

    # Install tomcat under /opt and rename the directory "tomcat"

    RUN tar -xf $TOMCAT_FILENAME -C /opt && \

    mv /opt/$TOMCAT_DIRECTORY /opt/tomcat

    ```'
