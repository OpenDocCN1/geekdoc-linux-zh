  md: '+   Replacing application components. Here is another case where the whole
    application has to be potentially refactored/reimplemented. Let’s assume the organization
    would like to use cloud services for ticket management; the way the application
    is written currently, it is hard to decouple the related modules from the application.


    +   Replacing or adding new technology stack. In this case, you don''t have the
    freedom to choose the technology for new modules/capabilities unless the whole
    application is reimplemented. The organization is stuck with the chosen technology
    because of the monolithic architecture.


    +   Scaling selectively. Say you want to scale the ticketing module to accommodate
    the usage patterns. In this case, it is complex because the application components
    are tightly integrated as a monolithic application. Separating ticketing, for
    example, requires a lot of code refactoring, integration with the standalone ticketing
    system, testing, new deployment architecture, and more.


    +   Handling faults. In a monolithic application, a fault in one component potentially
    breaks up the whole application. Let’s suppose that the product catalog service
    is down. This will prevent the users from submitting a new work ticket. A new
    work ticket should indicate which product the user has a problem with better routing
    and faster product resolution. However, a bug in the product catalog service should
    not prevent the user from creating the ticket itself—that is, it shouldn''t bring
    down the ticketing service itself. Given the monolithic nature, if product catalog
    is a required field and there is a bug, the user will be stuck at this stage even
    though he or she could have described the issue.


    While challenging for our application, these are the simple needs of today’s digital
    world. It becomes very costly and time consuming to address them with the monolithic
    approach our current application uses. In the next two chapters, we discuss how
    these challenges go away with microservices and containers.'
