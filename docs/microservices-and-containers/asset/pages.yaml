  md: '# Chapter 1


    # An Introduction to Microservices


    Technology has changed, and continues to change, how the world behaves. In turn,
    these behaviors are putting new, challenging demands on the technology that it
    supports all. We have progressed from an era of 56k dialup modems to 100Gbps Ethernet
    in less than two decades. As the speed increased, it placed greater demand on
    corporations to develop faster software for which advanced and high-level software
    languages were developed to suit application needs. Similarly, on the systems
    side, we have evolved from mainframes to high-speed servers making a commodity
    to virtualization and cloud. Now "containerize" is a verb, as containers are being
    utilized to use resources more efficiently.


    Along the way, new paradigms such as model-view-controller (MVC), enterprise integration
    patterns (EIPs), and service-oriented architectures (SOAs) were released. Microservices-based
    architecture is now the talk of the tech world. Let’s find out why.


    # What Are Microservices?


    A microservice is an independent, standalone capability designed as an executable
    or a process that communicates with other microservices through standard but lightweight
    interprocess communication such as Hypertext Transfer Protocol (HTTP), RESTful
    web services (built on the Representational State Transfer [REST] architecture),
    message queues, and the like. What makes microservices unique from a standard
    application is that each microservice is developed, tested, deployed, and scaled
    on demand and independent of other microservices.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 1 AN INTRODUCTION TO MICROSERVICES


    The microservice concept inherits all the best principles of software development,
    including loosely coupled, scalable on demand, and services oriented, to name
    a few.


    What does standalone capability mean? It means that each microservice performs
    precisely one function, which behaves the same for all consumers. For instance,
    an order management service that only processes orders and does nothing else;
    it does not even send notifications. It may call another microservice responsible
    for sending notifications on processing. This separation of functions provides
    enormous flexibility, each microservice can be managed, maintained, scaled, extended,
    reused, and replaced independently of other microservices.


    Given this, a microservices-based application is simply a group of several independent,
    standalone microservices, each offering specific, well-defined functionality,
    communicating through well-defined protocols to provide overall application functionality.
    You can describe such a paradigm as a microservice-based architecture in which
    each microservice runs as a separate process.


    You may be wondering how this is different from SOA-based monolithic applications.
    The difference is that in a monolithic application, all the capabilities are packed
    into one big executable, or a WAR file, also known as a *monolithic implementation*.


    Let''s explore this with a simple example: a calculator application you may access
    from the web. In a monolithic application, all calculator operations—addition,
    subtraction, and so on—may be written as separate program functions, and one function
    may call another function directly to complete its action. There is one running,
    and the communication is through standard program function calls. The design might
    look like Figure 1.1.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_23_0.png)


    Figure 1.1 Monolithic architecture for a simple calculator application


    This is a very simple example for which microservices would be overkill, but just
    for the sake of understanding, let''s assume a developer follows the microservices
    paradigm builds the calculator application by constructing each operation offered
    by the calculator as a separate standalone service, as shown in Figure 1.2. In
    this case, a microservice calls another microservice through interprocess calls
    over HTTP or'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'another protocol. In the previous case, if a nasty bug is encountered in any
    of the functions (say, out of range), it could take the whole application down.
    With microservices, however, only the impacted service would go down; the rest
    would still be available for users.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_24_0.png)


    Figure 1.2 Microservices-based architecture for a simple calculator application


    The purpose of this simple example is to underscore the biggest advantage of following
    the microservices paradigm: that it can simplify the implementation of a complex
    application by allowing you to divide the application into manageable, standalone
    components. This simplicity can help in various ways, such as enabling you to
    add many capabilities as without impacting other services.


    Furthermore, each microservice we need to be independently updated or scaled on
    demand. For example, suppose we need to create a new operation that uses an existing,
    available functionality: say, finding the square of a given number. This operation
    is straightforward and involves minimal to no touching of the existing code. We
    create a new microservice that calls the standard published API for the “multiply”
    microservice (see Figure 1.3). Consequently, we have only one microservice to
    write, compile, and deploy, compared to a monolithic application''s need for recompilation,
    redeployment, and so on, with possible downtime as a result.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_24_1.png)


    Figure 1.3 “Square the number” function easily added with new microservice


    We can also have microservices that are called only by other microservices, not
    directly by the client application, as shown in Figure 1.4. For example, in the
    figure, a client may be able to call only three microservices under Layer 1, whereas
    the first microservice under Layer 1 may call the two microservices behind it
    under Layers 2 and 3, as shown by the arrows. These two microservices are called
    helper microservices.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '![](img/2a457a43a75620bdd821d9b6885ac4c2_25_0.png)


    The concept of microservices is not new, it, but it has been gaining popularity
    recently because of the challenges posed by monolithic applications.


