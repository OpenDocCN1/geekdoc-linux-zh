  md: '# Default Options


    Because the --link flag has been deprecated and may eventually be removed, use
    should be avoided. In place of --link, Docker provides three default connection
    options, which are all created automatically during installation: none, host,
    and bridge. Run the following command to list these networks:


    ```

    docker network ls

    ```


    Let''s show the output in Figure 8.7.


    | ANUJSIN-M-T2H9-: anujins docker network ls | | |

    | NETWORK ID | NAME | DRIVER | SCOPE |

    | fe31b846998 | bridge | local |

    | 4ae8e269a47 | host | local |

    | lbb5d9423c0 | none | null |

    | ANUJSIN-M-T2H9-: anujins | |


    **Figure 8.7** Network list


    Let''s look into each of these networks.


    # None


    This networking option is the simplest of all and basically means no networking.
    It does receive a container-specific stack and namespace, but it lacks a network
    interface. Consequently, no IP address is configured for this container, and cannot
    connect with other containers or an external network. It does have a loopback
    address assigned.


    As an example, let''s use our Tomcat image by specifying the network option none:


    ```

    docker run -it --network=none tomcat /bin/bash

    ```


    Let''s check the IP address of the container:


    ```

    docker inspect 43c10fe289b3| grep IP

    ```


    As expected, no IP address is assigned, as shown in Figure 8.8.'
