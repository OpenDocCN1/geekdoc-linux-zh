  md: '# Chapter 2


    # Switching to Microservices


    Chapter 1, “An Introduction to Microservices,” compared and contrasted microservices
    with monolithic architectures. Now that you understand the distinction between
    the two, you are probably trying to answer the question, microservices right for
    my team? If you are already dealing with the growing pains of monolithic architecture
    or are planning to build a monolithic system, then it is worthwhile to look at
    microservices. Otherwise, there is no reason to switch to this architecture, as
    it is not suitable for small-to-medium service architectures given the work involved.
    Each microservice comes with a burden of extra work at a scale that is unnecessary
    with monolithic architectures: API sets, process monitoring, load balancing for
    performance/high availability, and so on, are required for each microservice rather
    than just at the application level. You are actually trading monolithic code complexity
    for the operational complexity of microservices, and if that complexity does not
    exist in your system, you will unnecessarily add it for. For those reasons, you
    have to be very careful when it comes to moving forward with this paradigm, or
    it can backfire.


    This chapter lays out the criteria that qualify (and disqualify) various applications
    for a microservices-based architecture. Usually, executives and managers look
    for potential business cases or return on investment. We discuss these considerations
    briefly by doing some simple cost-benefit modeling and organization investments.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# # Fatigues and Attributes


    A switch to microservices may be best suited for existing monolithic architectures
    that show some of the following fatigues:


    +   - Difficult and time-consuming deployment process

    - Large and complex code base that overloads developer IDEs

    - Non-uniform scaling requirements (i.e., some capabilities require more scaling
    than others)

    - High costs of development, testing, and deployments

    - Degraded code quality over time because of too many interdependencies

    - Application failure due to single component failure


    Perform thorough due diligence to understand these fatigues and document them
    clearly. Then, try to determine some of the following characteristics would add
    value to your current application:


    +   - Services organized around business capabilities

    - Standalone and/or partial deployment of services

    - Asynchronous communication

    - Replacing different platform components, programming languages, and/or data-bases
    for different parts of the application services for enhanced performance

    - Continuous deployment and continuous integration

    - Each engineering team owning and understanding specific business areas as order
    management or a shopping cart


    Thinking in these terms will give you a pretty good idea of where you stand and
    whether it makes sense to transition to a microservices paradigm. Once considerable
    effort has been put into adopting the microservices-based paradigm, there is no
    turning-back. So before you decide, you must also be aware of the unique needs
    that are put on the organization by this shift:


    +   - Culture change. The organization mindset must embrace a shift in the roles
    of engineering teams—from functional roles to business-centric roles with shared
    goals and responsibilities. This means joining teams of product managers, developers,
    testers, and operations to lead collectively and take ownership'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'of the microservices. It also requires investments in fresh talent and training
    existing staff, as well as in new systems, tools, and software. In addition, a
    great deal of automation throughout the software lifecycle is required to ensure
    success.


    +   - Operational processes. With a microservices paradigm, an organization''s
    operational processes structure need to be changed. The paradigm demands a more
    cross-functional structure that takes charge of deployment, support, upgrade,
    and operation of microservices. The existing operational processes of testing
    and deploying the monolithic application have to be broken down into multiple
    and extensive processes supporting hundreds or thousands of self-sufficient microservices
    and supporting communication between them.


    # Learning Curve for the Organization


    There is a whole new learning curve for existing engineering and operational teams
    who have been working with and supporting the various aspects of monolithic architecture-based
    applications. This learning curve can be defined by the following new practices
    required to make the shift toward microservices-based applications:


    +   - Standalone microservices. Monolithic applications exist as one large unit
    deployed on multiple boxes for scalability. With microservices, there are hundreds
    to thousands of self-contained services, all requiring equal attention.

    - Microservices discovery. The higher the number of microservices, the more complexity
    we encounter. For example, we need to think about how and do we create the inventory
    of microservices? Other challenges include on-demand scalability and version control,
    including retiring services that are no longer needed. The good news is that various
    applications, such as Consul, Apache ZooKeeper and other-party products, can be
    used to solve these challenges. These challenges create a need to hire new staff
    or retain existing employees, which may make a good part of the investment.


    +   - Communication between microservices. Determining how communication will
    occur between all the services and the outside world includes client expectations
    around response time, latency, number of retries, and so on, as what happens when
    these service level agreements (SLAs) or expectations are not met. It is possible
    that a standard interface for communication needs to be established.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '+   * Microservices testing. Testing practices and principles of monolithic
    applications are not applicable to microservices-based applications. While testing
    each self-sufficient microservice is easy, the challenge comes with testing the
    complete application that is composed of hundreds or thousands of microservices.
    This requires dealing with lots of moving parts, and integration testing becomes
    the most important aspect of the overall testing. Some of the testing complexities
    can be addressed by establishing best practices and automating the test cases.


    +   * Scaling of microservices. With microservices, scaling becomes easier and
    efficient. You can scale up or down the services you need on demand. But does
    it come at some cost? First, the microservices must be designed to keep scaling
    needs in mind—that is, to know the usage demand for each microservice. Second,
    scaling must be automated, which requires some investment and learning curve with
    frameworks such as Mesos and Marathon. We discuss these frameworks in detail in
    the later chapters.


    +   * Microservices upgrading. On the surface, it might sound simple to upgrade
    every microservice, since each is self-sufficient and consequently should not
    cause any disruption. It may actually be that the new version incorporates simple
    changes that do not impact the outside world. But when changes impact other dependent
    services, upgrading may not be straightforward. It must be ensured that other
    services are up to speed to consume new functionality or that the new service
    is backward compatible.


    +   * Microservices security. Security has always been important, and given today''s
    cybersecurity threats, it has become especially crucial to acknowledge security
    during design time. A few aspects need to be dealt with include microservice-to-microservice
    security, client-to-microservice security, data-in-motion, and data-at-rest security.
    Several standards, such as OAuth and OpenAPI, are available to address some aspects
    of security, but others must be thought through to balance the with ease of consumption.


    +   * Microservices management. No matter what software architecture or paradigm
    is in place, application management is a key requirement for overall operational
    and support services. Managing microservices is more complex than managing a monolithic
    application. The existing monitoring and managing tools or practices may not be
    helpful. Instead of a handful of servers and applications, we have to deal with
    more complex new systems and technologies such as containers. Therefore, a single
    pane of glass (i.e., a single interface) to configure, monitor, and diagnose may
    be very helpful.'
