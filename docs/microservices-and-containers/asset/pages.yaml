  md: '# KUBERNETES


    server. Additionally, cluster-wide communications between worker nodes and the
    master is also handled by the API server. This is also the only component that
    talks to the distributed key-value store (etcd) to store the state of the objects.


    In Kubernetes terminology, we use objects to describe what we want from the cluster
    or what we want the cluster to be in. For example, an object could be the instances
    of the applications you want in the cluster at any given time, or how many instances
    you want your applications to communicate with each other.


    Let''s take an example of how the API server handles requests. Say we issue a
    command to run a Tomcat container and have three instances of Tomcat running in
    the cluster:


    ```

    kubectl run myTomcat --image=Tomcat --replicas=3

    ```


    What happens behind the scenes is that kubectl submits its "intent," or request,
    to run three instances of Tomcat server in the cluster to the API server. The
    API server then works with the scheduler and replication controller components
    to execute our request and brings the cluster to the desired state.


    # Scheduler


    Kubernetes scheduler is a component that is responsible for placing (scheduling
    to run) the containers in the cluster nodes. It does this by creating pods, the
    basic units of scheduling in Kubernetes. You can imagine a pod as a logical host
    with separate namespace where one or more containers live. All the containers
    live inside a pod share a pod''s namespace.


    When a request is submitted to the Kubernetes API server, the API server works
    with the scheduler to place the pods in the cluster nodes. Before placing a pod
    on a worker node, the scheduler checks various criteria:


    +   - Which nodes have sufficient resources, such as CPU and memory, to run the
    containers in the pod

    - Whether the node has sufficient ports open, as requested by the pod

    - Where to place the pod such that it is close enough in the cluster to avoid
    latency issues (node affinity)

    - Whether the pods are distributed in the cluster to support high availability


    As you can see, the scheduler has to make a smart, informed decision about the
    place of the pods in the cluster. And that is one of the Kubernetes scheduler''s
    key'
