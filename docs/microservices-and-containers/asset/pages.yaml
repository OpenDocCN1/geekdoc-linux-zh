    picture of our application using a logical diagram, as shown in Figure 13.7:


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_253_0.png)


    **Figure 13.7** Application logical diagram


    Notice that the services we split and packaged as microservices (catalog, ticketing,

