  md: '# Chapter 8


    # Containers Networking


    In the previous three chapters, we learned the basics of containers and how Docker
    takes containers to the next level. But simply standing up containers does not
    serve a purpose: the containers need to talk to each other, and connectivity with
    the external world must be designed as part of your deployment. In this chapter,
    we discuss and learn about networking options in the world of containers. First,
    let''s refresh our knowledge of some basic concepts in Linux that will assist
    our discussion of containers networking.


    # Key Linux Concepts


    Containers, as we know, are self-contained and isolated virtual environments.
    They can run an entire application or part of an application. In either case,
    one of the key we need is connectivity.


    We have been using a client to connect to our containers, but what we need isglobal
    connectivity. We need connectivity between containers within a host, within multiple
    hosts, and between multiple data centers—that is, the ability to create our own
    network. Docker uses the Linux networking and kernel features to provide such
    capabilities.


    We don''t go into much detail on Linux basics, but you must understand some key
    Linux networking concepts to understand Docker networking:


    +   - Linux network namespace. Usually, a Linux installation provides a standard
    set of network interfaces and routing table entries. This set is used by the entire
    operating system to make the routing and networking possible. Think'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# CHAPTER 8 CONTAINERS NETWORKING


    of network namespace as a network stack with its own network interfaces and respective
    routing table entries operating in isolation. Docker uses this feature of network
    namespace to isolate containers and provide the security. You can have multiple
    network namespaces, giving you the ability to run each container in isolation,
    rendering each one unable to communicate with other containers on the same host
    until configured by the admin. The host has its own namespace that contains host
    interfaces and routing tables.


    +   - Linux bridge. This is part of the Linux kernel module and enables Linux
    networking. Think of it as a layer 2 virtual switch that also does filtering.
    It makes forming decisions based on a MAC address table that it learns dynamically
    through the traffic inspection.


    +   - Linux virtual Ethernet devices. Also known as veth (virtual Ethernet) devices,
    these are interfaces that connect the network namespaces. We can create multiple
    entries on the network namespace stack, and we configure the veth to establish
    the connectivity. Think of these as pipes that can connect network namespaces
    to each other and to the external network.


    +   - Linux iptables. iptables is part of the Linux kernel that provides the packet
    filtering and firewall capabilities to the operating system. You can define policies
    and a chain of policies to allow or block traffic. Docker utilizes this capability
    to segment traffic between containers, implement port mapping where you can bind
    the container port to the host port, and more.


    Now we''ve outlined Linux networking capabilities, let''s discuss connection types
    in containers, starting with the simplest: linking.


    # Linking


    Before Docker released advanced networking features (which we discuss shortly),
    the simplest way of connecting two or more containers was to "link" the containers.
    The --link flag, now a deprecated legacy of Docker, allows containers to discover
    and secure a connection for transfer of information between containers. This technique
    is more of a generic way to achieve connectivity than a true ports-based networking
    approach. It is done through sharing environment variables and /etc/hosts file
    entries, which are automatically created for us by the Docker engine to connect
    the containers.


    As an example, let''s bring up the Tomcat application server and a MySQL database
    and establish connectivity between them. These two should be able to interact'
