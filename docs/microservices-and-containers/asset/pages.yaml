  md: "# DOCKER COMPOSE\n\n```\ntomcat:\nimage: 'tomcat:7'\ncontainer_name: appserver\n\
    ports:\n  - '8080:80'\ndepends_on:\n  - db\ndb:\n  image: 'mysql:5.7'\n  container_name:\
    \ dbserver\n  ports:\n    - '3306:3306'\n  environment:\n    - MYSQL_ROOT_PASSWORD=sample\n\
    \    - MYSQL_DATABASE=helpdesk\n    - MYSQL_USER=helpdesk\n    - MYSQL_PASSWORD=helpdesk\n\
    ```\n\nDocker Compose uses YAML (YAML Markup Language) file. (You can read up\
    \ about YAML at http://www.yaml.org.) Docker Compose uses it for configuration,\
    \ but YAML can be used in many other types of applications as well.\n\nIn the\
    \ docker-compose.yml file, we have defined two services: Tomcat and MySQL. Services\
    \ configuration options are self-explanatory at this stage. One of the key things\
    \ to note is that Tomcat service has an option depends_on in its configuration,\
    \ and it has db as a dependency. This instructs Docker to start the database service\
    \ first and Tomcat second. Docker Compose has many more options that you can explore\
    \ yourself from Docker online documentation.\n\nHaving defined the docker-compose.yml\
    \ file, the way to start the services is with the following command.\n\nCommand:\
    \ docker-compose up -d\n\nThis command inspects the compose file, then finds out\
    \ the services defined in the configuration file, builds a dependency graph on\
    \ the order in which services need to be started, and finally starts them in that\
    \ order. If the image configured in the services section is not located in the\
    \ local machine, then it fetches from the Docker registry as usual. Figure 7.47\
    \ shows the output from running the command."
