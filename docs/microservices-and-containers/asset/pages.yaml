- img_proc: true
  md: '# Mesos Master


    The Mesos master runs on a master node. This daemon is responsible for managing
    the daemons running on each cluster node; that is, the master daemon is the one
    that provides work (tasks) to the agent daemons. The master daemon is also responsible
    for serving frameworks that consume services (computing power such as CPU, memory,
    network, disk resources) from the Mesos cluster. Any number of frameworks can
    run on top of the same Mesos cluster. Frameworks are the entities bringing tasks
    to run in the Mesos cluster. Tasks the frameworks want to run in the cluster get
    the agent nodes through the master and get executed on the agent nodes.


    The job of the Mesos master is to enable sharing of cluster resources such as
    CPU and memory to the frameworks that are waiting to run their tasks. It does
    this by sharing the cluster resources in what are called offers in the Mesos world.
    Offers contain such as amount of RAM and number of CPU cycles available to execute
    a task. The offers are sent to the registered frameworks, and the frameworks have
    complete freedom to accept or reject them.


    Offers are nothing but a way for a Mesos master to let the registered frameworks
    know of available resources in the cluster. As an example, an offer can include
    details such as "2G memory, 8 core CPU cycles available to be used.\ A framework
    that receives an offer inspects the offer received and the tasks in hand to be
    executed. If the task can be executed using the offer received, then the framework
    accepts it; otherwise, the offer is rejected.


    The fact that any number of frameworks can consume resources from the same Mesos
    cluster introduces challenges such as which framework gets what percentage of
    resources from the cluster. Mesos handles resource allocation elegantly by making
    it completely configurable through policies that can be defined. It''s up to the
    cluster administrator to define how many resources are allocated to a given framework
    based on organizational priorities and/or the criticality of the tasks that a
    given framework may run in the Mesos cluster.


    # Agents


    Agents are the worker nodes where the actual tasks run. A slave daemon runs on
    each of the worker nodes. This daemon is responsible for collecting and reporting
    statistics to the Mesos master.


    Say your machine has 8GB RAM and 4 CPU cycles available. This information is sent
    from the agent to the Mesos master, which forwards the offers upstream to the
    registered frameworks. Tasks that the frameworks request actually run in these
    worker nodes. Agents get the work (task to execute) from the Mesos master. Once
    they receive the task, they launch the task inside an executor.'
