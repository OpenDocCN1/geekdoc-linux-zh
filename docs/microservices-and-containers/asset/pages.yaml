    # APIs


    The docker stats command is a great way to pull a live stream of data. The good
    news is that REST APIs are available that you can utilize to build your performance
    dashboards across clusters. These APIs provide similar live stream data but are
    more detailed than docker stats.


    ```

    GET /containers/(ID/Name)/stats

    ```


    The API endpoint to pull statistics about a running container is


    ```

    curl --unix-socket /var/run/docker.sock -X GET

    ''http://v1.24/containers/container ID>/stats''

    ```


    Just as the docker stats command, the API starts streaming the data every second.
    It is up to you to program it in a way that does not disrupt performance. For
    e.g. you may want to take a snapshot at defined frequency. Hopefully, this limitation
    will be fixed soon by including some kind of streaming flag in the API.


    As learned in previous chapters, one of the best practices to effectively monitor
    containers is to tag the containers in a meaningful way. You can define the tags
    when you build the images, way rather than working at a particular host or container
    level, you can work with tag names.


    For information on REST APIs, refer to docker.com.


    # cAdvisor


    cAdvisor, also known as Container Advisor, is a monitoring solution developed
    by Google. It provides detailed data on the usage and performance metrics of containers
    through a graphical user interface. It comes as a container itself that you can
    deploy on your host machines. cAdvisor collects the data from all the containers'
  merge: -1
