- img_proc: true
  md: 'As we learned in previous chapters, the right way to create a Docker image
    is through a Dockerfile, which includes all the dependencies mentioned previously.
    Building that Dockerfile will give us all the image we need to deploy our service.


    Let''s start writing the Dockerfile. Please note we''ll be building this file
    in multiple steps so that it is easy to explain the content. Make sure you don''t
    create multiple files if you are executing things in parallel:


    ```

    # Based on Ubuntu 17.04

    FROM ubuntu:17.04

    # Environment variables to install Tomcat 7; you may change the

    # minor version of Tomcat according to your needs. To change the

    # major version as well (e.g., to Tomcat 8), you must be sure to

    # change the TOMCAT_LOCATION variable as well.


    ENV TOMCAT_VERSION=7.0.811

    ENV TOMCAT_FILENAME=apache-tomcat-$TOMCAT_VERSION.tar.gz

    ENV TOMCAT_DIRECTORY=apache-tomcat-$TOMCAT_VERSION

    ENV TOMCAT_LOCATION=http://www-eu.apache.org/dist/tomcat/\tomcat-7/$TOMCAT_VERSION/bin/$TOMCAT_FILENAME

    ```


    Let''s take a closer look at the code:


    +   - FROM ubuntu tells what environment the catalog service will run in. In this
    case, the catalog service will be running under an Ubuntu environment.

    - The ENV command defines environment variables that can be used within the Dockerfile.


    The next step is to pull and install all the dependencies. Append the following
    to the existing file:


    ```

    # Fetch Tomcat; install required utilities such as wget & JDK1.8.

    # Clean up apt cache, as "apt-get update" is going to bust the cache

    # always.

    RUN apt-get update && && \

    apt-get install -y wget && \

    apt-get install -y default-jdk && \

    rm -fr /var/lib/apt/lists/* && && \

    wget $TOMCAT_LOCATION

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'Here''s what we''re doing with this code:


    +   - apt-get is the package manager in Ubuntu, which simplifies the lifecycle
    (install/update/delete) of packages. It is recommended to always do an apt-get
    update. This command gets the latest list of packages and their versions from
    the Ubuntu repository.


    +   - The apt-get install installs the Wget package. Wget is a free utility that
    we use to download files from the web. We need this to download Tomcat from the
    web.


    +   - The install command installs the Java development kit. This is a dependency
    for Tomcat.


    +   - When the command apt-get update is run, it downloads the packages from the
    Ubuntu repository and stores them in the directory named /var/lib/apt/lists. This
    directory can be large, which can make our Docker image look big too. Since the
    installation is complete, we can safely remove the contents in this directory,
    and that''s what the rm command does. It''s a best practice in writing Dockerfiles.


    +   - wget is the utility we installed earlier in the code, and it downloads Tomcat
    from the web.


    One key thing to note is that all of these commands are run in a single line to
    reduce the number of layers in the Docker image. RUN is the command that instructs
    Docker to run any command within the environment (in this case, it''s the Ubuntu
    environment). If we choose CentOS as the environment (e.g., FROM CentOS), then
    the same command will run yum, because yum is the package manager in CentOS just
    as apt-get is the package manager in Ubuntu.


    Now that we have downloaded Tomcat, let''s append the following to the existing
    file:


    ```

    # Install Tomcat under /opt and rename the directory "tomcat"\RUN tar -xf $TOMCAT_FILENAME
    -c /opt && \ \

    mv /opt/$TOMCAT_DIRECTORY /opt/tomcat

    ```


    Here, we are installing Tomcat into our /opt directory and renaming the directory
    /opt/tomcat.


    Now let''s deploy our microservice:


    ```

    # Deploy product catalog service to Tomcat

    ADD catalog-svc.war /opt/tomcat/webapps/

    ```


    ```

    # most port to the host system

    EXPOSE 8080

    ```'
