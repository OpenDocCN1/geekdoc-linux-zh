  md: '# Chapter 7


    # Docker Interface


    In Chapter 5. "Docker Containers," we talked about Dockerfile, which contains
    a set of commands that are executed by the Docker daemon. In this chapter, we
    cover the most commonly used commands. Then we create a Dockerfile using the commands
    and execute the file to review results.


    # Key Docker Commands


    You can think of the following compendium of commands as the proverbial bible
    that must be mastered to work successfully with Docker—everything from searching
    and building images to creating your own Dockerfile. We review commands first
    and then build on them to get to some more involved ones.


    # Docker Search


    The docker search command can be run on Docker CLI to search the available images
    in the Docker registry:


    ```

    docker search [options] term

    ```


    The GUI-based client also provides the search capability.

    In the example shown in Figure 7.1, docker search mysql returns all the images
    that have "mysql" in the name of the image. As you can see, it returns the top
    25 results. The GUI-based search provides similar results, as shown in Figure
    7.2.'
