    for containers to communicate with each other. Note that the IP addresses assigned
    in this case are not accessible from outside the host. You must expose the ports
    to provide the external access. To understand more, let''s run the following command:


    ```

    docker network inspect bridge

    ```


    As you can see in Figure 8.13, the containers section is empty, since we have
    no containers running.'
