    # Figure 8.8 No IP address assigned


    As you can see, this container is completely isolated from other containers and
    the host network. This kind of configuration is used for testing purposes in isolated
    environments, special custom networking, or instances where no connectivity is
    intended.


    # Host


    As the name suggests, the host option adds the container to the host''s network
    namespace, so the host and the container share the same network namespace we discussed
    earlier. This is the simplest of the networking options: the added container can
    use all the interfaces on the host stack. In this case, there is one-to-one port
    mapping between the container and the host machine—that is, if you run the container
    on an application server on port 8080, the application server will be available
    on port 6080 of the host.


    There are two key things to note here: you will still need to network configurations,
    and in this mode you cannot use port mapping. The reason is that the container
    and the host share the same network namespace. If another service wants to use
    port 8080, you are stuck. This may not be the case with the bridge option, which
    we discuss in the next section.


    Let''s run a new CentOS image by specifying the network option host:


    ```

    docker run --network=host -d CentOS

    ```'
