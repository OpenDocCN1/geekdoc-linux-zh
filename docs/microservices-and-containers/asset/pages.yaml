    # Docker Commit


    The docker commit command is straightforward but important—it allows you to create
    a new image from the container''s changes:


    ```

    docker commit (Options) Container [Repository:Tag]

    ```


    As you make changes to your container and want to ship it as a new image to, say,
    another development or test, this command creates a new image for you the running
    container.'
