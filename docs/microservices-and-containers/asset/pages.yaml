  md: '# KEY DOCKER COMMANDS


    Let’s run the stop command and execute ps - a again. See Figure 7.24.


    ```

    Parminders-MacBook-Pro:~ parminderkochers docker stop c8b9770c88e9

    c8b9770c88e9

    Parminders-MacBook-Pro:~ parminderkochers

    Parminders-MacBook-Pro:~ parminderkochers docker ps -a

    CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES

    c8b9770c88e9 "ubuntu" 2 weeks ago Exited (137) 1B seconds ago admiring.albattani

    ```


    **Figure 7.24** Running the stop command and execute ps - a


    As you can see, the container is no longer running, and the status is exited with
    code 137, which means the container received the SIGKILL. The stop command sends
    a SIGTERM and then SIGKILL after a grace period. We can adjust the grace period
    by specifying the number of seconds with the -t option. The time option may be
    very important in instances where we want a process to complete the outstanding
    requests, in the case of HTTP.


    We can also use the docker kill command, which directly sends the SIGKILL; it
    does not give the container process an opportunity to exit gracefully. However,
    it also provides options that let us send other than SIGKILL to the container
    process.


    Now that the container has been stopped, let’s remove the container and do ps
    - a again. See Figure 7.25.


    ```

    Parminders-MacBook-Pro:~ parminderkochers docker rm c8b9770c88e9

    c8b9770c88e9

    Parminders-MacBook-Pro:~ parminderkochers

    Parminders-MacBook-Pro:~ parminderkochers docker ps -a

    CONTAINER ID IMAGE COMMAND CREATED STATUS PORTS NAMES

    Parminders-Mac Book-Pro:~ parminderkochers ■

    ```


    **Figure 7.25** Container removed


    Notice that the container has been completely removed with no trace in the ps
    - a command.


