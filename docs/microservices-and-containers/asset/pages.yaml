- img_proc: true
  md: '# Chapter 12


    # Case Study: Migration to Microservices


    In Chapter 4, "Migrating and Implementing Microservices," we discussed two possible
    scenarios: creating a new application with microservices and migrating a monolithic
    application to microservices. Since our helpdesk is an existing monolithic application,
    here we follow the second scenario of migrating to microservices.


    # Planning for Migration


    Let''s say that the high-level business needs for our helpdesk application were
    as follows when the application was first written, back in 2005:


    +   * Support roughly 500,000 customers on the web where they can open work tickets
    for their issues.

    * All features are equally important and should be available at all times.

    * Application is horizontally scalable.

    * Reduce number of tickets submitted by allowing users to search for existing
    solutions.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# CHAPTER 12 CASE STUDY: MIGRATION TO MICROSERVICES


    Now it is 2018. Let''s review customer behavior and how this application is being
    utilized:


    +   - The number of users has grown to 1.5 million and is expected to grow 3 million
    over the next 2 years due to the boom in the mobile space.

    - The top two features are being utilized by most users are ticketing and search.

    - There are very few changes in usage of features like message boards.

    - Traffic especially peaks twice a year: early summer (June) and the holiday season
    (November and December).

    - The number of times ticketing services is affected due to impact of other services,
    such as product catalog, has grown considerably.

    - Technological advances in natural language processing means customers no longer
    expect just keyword-based search. They want the system to understand plain English
    and be able to search the tickets and help them appropriately. In other words,
    they want semantic search.

    - The greatest number of enhancement requests concerns ticketing functionality.


    It''s clear that our application is doing really well, as the number of customers
    has expanded and the application is still serving. Furthermore, we can assume
    that the application has scaled well horizontally to support the increase in users.
    Scaling horizontally in this case means having many instances of the application
    with active-active database machines with proper load balancing in place. The
    point to note is we are talking about uniform scalability; that is, the whole
    application is scaled, not just some specific components, such as ticketing, that
    might have been needed to be scaled.


    Now imagine you are given the task to modify the application so that it can meet
    the new needs and scale and perform to support 3 million users. Also, the application
    should be easy to evolve (open to change components) as the technology changes.


    Given what we have learned, microservices might sound like a great solution. The
    application we deployed in Chapter 11 is not very old. In fact, it is already
    using a model-view-controller (MVC) architecture and web services, so it wouldn''t
    be a wise decision to start from scratch. Also, notice that the new needs are
    applicable to only a few components of the application, which further makes the
    case for microservices. So how do we do it? There are quite a few ways to go about
    it. Let''s apply our learning from Chapter 4 and convert our existing project
    to a microservices-based application.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Applying Microservices Criteria


    Recall that the microservices criteria outlined in Chapter 4 define one of the
    possible ways to select and prioritize the capabilities of a monolithic application
    that should be migrated to microservices. We looked at best practices, which apply
    in our scenario as we consider the new needs and user behavior:


    +   - Scale. From the first two new requirements, it is clear we need to scale
    the application. The two most important and highly used components are ticketing
    and search, so it makes sense to convert these services to microservices.

    - Improved technology alternatives, or polyglot programming. From the new requirements,
    we see that this system needs a smart search, and Apache Solr is an open source
    tool readily available for these purposes. It will improve the search capabilities
    by providing relevant, context-sensitive results.

    - Storage alternatives, or polyglot persistence. Our monolithic application has
    been using the MySQL database for all the data storage. While it makes sense for
    ticketing data to be stored in a relational database, our application can be improved
    by storing product catalog data in an in-memory cache with a flat-file backing
    store for the following reasons:

    - It would allow for easier updates by simply dropping updated files.

    - Since there are no relational queries or joins, simply reading the in-memory
    as a keyed list would increase speed.

    - Changes. Given that most enhancements have been in ticketing logic, per requirements,
    it makes sense to convert ticketing to a microservice. By the same logic and per
    our new requirements, it would not make much sense to convert the message board
    as a microservice.

    - Deployment. In our application, there is no deployment complexity in any given
    component, so we can call it applicable.

    - Helper services. For the new requirements, the existing ticketing flows have
    been impacted by unavailability of, or issues with, the product catalog. We must
    short-circuit this service, which means that even if the product catalog goes
    down, our ticketing should work as expected. This requirement qualifies the product
    catalog service to be converted to a microservice.


    The only requirement we have not discussed is that of heavy seasonal traffic.
    Basically, this issue can be addressed easily within the current version of the
    application by adding application servers and databases to scale horizontally
    during'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'the high-traffic seasons and then shrinking them back during normal traffic
    times.

    Based on what we know about microservices and the way we are converting the existing
    services, it would be more cost effective to scale the components with expected
    higher traffic. We cover this aspect of migration to microservices in Chapter
    13, "Case Study: Containerizing a Helpdesk Application."


    # Conversion Summary


    Per the new requirements and our microservices criteria, we conclude that the
    following services are converted to microservices architecture:


    +   - Product catalog

    - Ticketing

    - Search


    Further, we will add a Solr search engine to our application. In the current application,
    searches are done by database scan, which is a crude way of implementing search
    functionality. This method simply matches text against available data in the database.
    Neither the quality of results nor the performance match the caliber of today''s
    technologies.


    Let''s briefly discuss Solr. (For detailed installation and configuration instructions,
    refer to Appendix B.) Solr is a search engine platform based on Apache Lucene.
    It is written in Java and uses the Lucene library to implement indexing. It can
    be accessed using a variety of REST APIs, including XML and JSON. The basic capabilities
    include


    +   - Advanced full-text search

    - Optimized for high-volume web traffic

    - Comprehensive HTML administration interfaces

    - Server statistics exposed over Java Management Extensions (JMX) for monitoring

    - Linearly scalable, auto-index replication, and automatic failover and recovery

    - Near-real-time indexing

    - Flexible and adaptable with XML configuration

    - Extensible plugin architecture


    For more information, visit http://lucene.apache.org/solr.'
