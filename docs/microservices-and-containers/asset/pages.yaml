    would act as the overall entry point for the clients and the external calls and
    another system that stores the up-to-date locations of the microservices.


    # API Gateway


    API gateway addresses the first problem and will act as an entry point for all
    the calls. It is responsible for receiving the client requests, calling all the
    required microservices and sending back the aggregated results from microservices
    to complete the client request. With an API gateway, the client makes only a single
    call to invoke the service. This model offers various advantages:


    +   - Internal complexity of the application is hidden from the client, thus simplifying
    the client code.


    +   - It provides more flexibility for changing, combining, dividing, adding,
    or removing microservices as required.


    +   - It reduces the round trips between client and application, hence increasing
    efficiency.


    The API gateway can also serve as a point for load balancing, authentication,
    monitoring, and management. It may provide different APIs for different clients,
    such as web and mobile, and may prioritize the requests.


    The biggest drawback of this model is that API gateway can become a single point
    of failure and a bottleneck from both performance and a development perspective.
    Understand that this API gateway has to be customized, configured and maintained
    by multiple teams, so the process must be efficient and lightweight. For example,
    it must be kept up to date as we modify, add, or delete the microservices. From
    an operational performance perspective, an elastic load balancer could make sure
    performance and availability metrics are met.


    # Service Registry


    With thousands of microservices in place, our API gateway also needs to know locations
    such as the IP addresses of all the services so that it can do its job. The idea
    behind service registry is that it provides a database of all the microservices
    and their'
