  md: 'Let''s review at a high level what we learned in Chapter 9, "Container Orchestration,"
    about Mesos and Marathon, so we can better understand our deployment:


    +   - Mesos. This is an open source Apache project that manages resources such
    as CPU and memory on a cluster of machines. Tasks or services like product catalog
    and ticketing will be running in the Mesos cluster.


    +   - Marathon. This is another open source framework that works closely with
    Mesos to schedule tasks in the cluster. In our case, if we have to schedule our
    catalog service to run inside the Mesos cluster, then we have to go to the Marathon
    UI, provide the details about the product catalog service (e.g., Docker image
    for the service, listening port), and click Submit.


    +   - Marathon-lb. This load balancer is based of the popular load balancer HAProxy,
    and it works by automatically generating a configuration for HAProxy on the fly.
    Here is how it works:


    +   - It communicates to Marathon via APIs to get a list of tasks and services
    that Marathon scheduled in the Mesos cluster.


    +   - From Marathon''s response, it finds out services are running in the cluster,
    where they are running (i.e. which machine in the cluster), which port the service
    is running on, and so on.


    +   - It generates an HAProxy configuration, which is simply a request mapping.
    The configuration has details; for example, "if a request comes to a service endpoint,
    /abc," then this request will be handled by servers a, b or c, where a and b are
    the machines the service is running to handle the request /abc.


    +   - External applications will always reach out to Marathon-lb to the services
    running in the Mesos cluster.


    Now that our cluster is ready, let''s deploy our microservices. We deploy the
    product catalog service here and leave the other two services for you to deploy
    your own in a similar fashion.


    # Deploying the Catalog Microservice


    We start by deploying a single instance of the product catalog microservice, and
    then we scale it up or down according to our needs.


    To deploy the service into the cluster, we create a task that has all the details
    about the service and our needs. This task is then submitted to the cluster through
    Marathon.'
  merge: -1
