  md: '+   - Reuse. Docker images are simply a set of layers, and successive commands
    create new layers of images to create a final image. Once an image is built, Docker
    reuses it for new builds, which makes the builds faster and images smaller, since
    it reuses or shares these images. For example, we may have an image with, say,
    file 1 on top of an Apache web server on Ubuntu. Suppose we need another image
    with file 2 on top of Apache web server running on Ubuntu. Since we already have
    the first image, Docker will reuse all the layers of first image except the file
    1 layer to create a second image. That means both final images share the Ubuntu
    and Apache layers, and each image will have a file layer of its own, which will
    be the only difference between these two images.


    +   - Fast deployment. Docker containers are fully self-sufficient, lightweight
    packages that are easy to distribute and completely tested during the testing
    cycle. The same container can be deployed in production with no or very minimal
    changes, except expediting the deployment and reducing the rollbacks due to environment
    dependencies. This feature is also key for continuous development.


    +   - Efficient use of resources. Like virtual machines, Docker uses the resources
    efficiently, perhaps better than virtual machines do, because of the Docker containers''
    lighter weight. At the same time, it provides acceptable isolation. Because of
    their size, a higher number of containers can be installed on a host machine compared
    to the number of virtual machines installed on the same.


    In many cases, Docker containers are preferable to virtual machines, but let''s
    be very clear: Docker is not going to replace virtual machines. In fact, typical
    deployments have been taking taking advantage of the power of both technologies
    by running Docker inside virtual machines, making the use of resources very efficient.


