  md: '# Chapter 5


    # Docker Containers


    This chapter covers another trending topic, Docker containers. As companies expand,
    they experience growing pains due to software deployment and scalability. Over
    time, with more users and features, the software tends to get complex, and then
    the real software deployment and scalability nightmares begin. We discussed in
    Chapter 1, “An Introduction to Microservices,” that microservices can address
    the development challenge by simplifying the architecture, but we also discussed
    that it pushes down the complexity of operations, which includes deployment and
    scalability. Further complicating the challenge is that, with microservices-based
    architecture, you are probably going to have thousands of services to host, deploy,
    and manage. That’s where containers come in to address most of our issues.


    Docker is an open source technology initiative that addresses the deployment and
    scalability problems by separating applications from the infrastructure dependencies,
    which allow us to package the application with all its dependencies, including
    the directory structure, metadata, processes space, sets of ports, and so on.
    We can run the packaged application the same way, always, across all machines
    and environments. That’s what makes Docker interesting and is the single biggest
    factor in its meteoric rise. You might be thinking, that’s what virtual machines
    (VM) do. To understand the difference, let’s see how these technologies are different.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Virtual Machines


    In its simplest form, a virtual machine is a self-contained system that includes
    everything from its own operating system (called guest OS) to an application environment
    and the application itself. Multiple virtual machines per host or physical machine
    can be installed using a layer called a hypervisor atop of the host machine OS.
    This hypervisor, also called type 2 hypervisor, acts as a proxy for hardware,
    giving the impression of guest OSs that they are running on their dedicated hardware.
    See Figure 5.1. The type 1 hypervisor directly runs on top of the hardware without
    a host OS in place and is considered a bare-metal hypervisor.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_69_0.png)


    **Figure 5.1** Basic virtual machine architecture with hypervisor atop the host
    operating system (type 2 hypervisor)


    The VM concept gained lot of traction and created a multibillion-dollar industry
    because it allowed organizations to utilize the available hardware resources to
    the best extent possible. Before virtualization, companies used to run dedicated
    servers for an application. Sharing this infrastructure was okay in a development
    environment, but in production, all of the server resources were dedicated to
    one application as a best practice. This resulted in a wastage of resources when
    the application couldn''t use all the resources at all times. We all know how
    powerful these servers and machines have become over time. Hence virtualization
    provided this huge opportunity to utilize the'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# VIRTUAL MACHINES


    server resources more efficiently, at the same time providing the application
    segregation- such that each application can run on its own OS as a separate virtual
    machine. This model has been widely successful, and it''s actually how cloud originated—the
    rest is history. Virtual machines offered many advantages:


    +   * Efficiency. A virtual machine functions and works like a separate machine.
    The key advantage is efficient resource usage and isolation from a security standpoint.

    * Flexibility. Resources can be allocated as needed. CPUs, memory, and the like
    can all be distributed on an initial requirements basis and when needed. Further,
    resource allocation can auto-adjust to some higher rate. This concept is also
    known as elasticity.

    * Backup and recovery. Virtual machines can be stored as a single file that can
    be easily backed up on another source. If and when required, it can be copied
    back.

    * OS freedom. Different guest OSs can exist on the same hypervisor. Therefore,
    you can support multiple applications catering to their specific OS needs.

    * Performance and moving. It is very easy to move a virtual machine from one to
    another in case of performance degradation on the host machine. Hypervisors support
    this feature automatically. VMware, a very successful virtualization software,
    provides this capability with a feature called vMotion, which enables the live
    migration of a running virtual machine from one to another.


    There are many other advantages, such as cost saving, but this discussion covers
    the key ones.

    Why use containers? To answer that question, we need to understand some of the
    issues with virtual machines. If you look again at Figure 5.1, you can likely
    point out the issues. We have a machine with a host OS. Then we have a supervisor
    and an extra OS per virtual machine. We know all OS is bulky in terms of resource
    consumption and size. First, it consumes a good chunk of storage and requires
    a lot of processing power. Second, when we take a backup of a virtual machine,
    even though it is mostly a single file, it is very big because it contains an
    OS (Window, Linux, etc.), the installed application with the dependencies, and
    its local data. Some VM backups run more than 20GB. This results in a few challenges:


    +   * Sharing virtual machines. Moving and sharing virtual machines across a WAN
    takes lot of time due to sheer size.

    * Portability. When a coder ships a virtual machine to a fellow coder, over time
    changes will likely be made to the application, databases, environment, and so
    on.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'The coder will have to ship the whole VM file again, and there is no way for
    him to do a diff between two VM files. Similar issues occur when we go from development
    to production environments. Either the code needs to be recompiled on every virtual
    machine, or we need to transfer the complete environment.


    +   - Performance overhead. The whole concept of an application talking to its
    guest OS, which in turns talks to a hypervisor, which then talks to the host OS
    that controls hardware to get the request fulfilled, is inefficient in the case
    of a type 2 hypervisor. You can see some performance issues here due to extra
    layers. In the case of type 1 hypervisors, the hypervisors are directly installed
    on the hardware, so the extra overhead of the hypervisor interacting with the
    OS goes away. However, the rest of the hypervisors previously listed still exist.

    - Efficient resource utilization. Resource usage on a virtual machine is certainly
    better than running applications on physical machines with a single OS, which
    leaves the resources idle when an application is lightly used. At same time, virtualization
    isn''t perfect, either, because of the replicating of multiple OSs with a hypervisor.


    These are the challenges with virtualization, and the good news is that containers
    address all of these issues and more. Let''s get right into containers.


    # Containers


    Containers also provide a virtual environment that packages the application processes,
    metadata, and file system—everything that is required by an application to run.
    Unlike virtual machines, containers do not require their own OSs. Instead, they
    are just wrappers around a UNIX process that directly talks to the kernel to request
    and use the resources. Check out Figure 5.2.


    As you can see, containers clearly provide the application and process isolation
    where one application is completely unaware of the existence of another application.
    But all the processes run on and share the same kernel used by OS. How does this
    happen? Containers use resource isolation features of the Linux kernel, such as
    control groups and namespaces, to allow independent processes to run within a
    single Linux instance. This goes back to why each application does not have its
    own OS, as VMs do. This also means that virtual machines provide better isolation
    than containers provide. However, that makes containers very lightweight, easy
    to ship and move around. Because of this lightweight nature of containers, you
    can run more containers on a given hardware combination than if you were to run
    VMs. With containers, you use your hardware resources much more efficiently.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '![](img/2a457a43a75620bdd821d9b6885ac4c2_72_0.png)


    **Figure 5.2** Basic container architecture. Dependencies: directory structure,
    libraries, process space, and so on


    These containers are also known as Linux containers or LXCs. The containers concept
    has been around forever but has only recently gained significant popularity due
    to Docker. As we discussed, Docker is an open source initiative that introduced
    several changes to Linux-based containers to make them more portable, easy to
    use, and flexible. It did that by implementing set of utilities that enable the
    containers portability and flexibility. These utilities allow you to easily create,
    copy, and run containers. Using Docker containers, you can overcome most of the
    disadvantages of using VMs.


    There are some subtle differences between Linux and Docker containers:


    +   - Processes. Within LXC, you can run multiple processes, whereas Docker containers
    are restricted to run as a single process. If your application consists of multiple
    processes, then you must run an equal number of Docker containers. Although it
    creates a containers management problem, it provides immense flexibility to the
    application system. Since there is one container per process, you can manage and
    change behavior at a granular process level. This is a key advantage and represents
    the solution that was most needed for microservices: a self-contained service
    with one process.

    - Persistent storage. Docker containers are stateless, as they do not support
    persistence storage. You must attach an external storage by mounting the storage
    as a Docker volume.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '+   - Portability. Docker provides more portability than does LXC, which is
    the reason Docker become very popular. With LXC, the portability is not guaranteed;
    that, when you move an LXC container from one host to another, it may not run
    smoothly due different server configuration. Docker, by contrast, guarantees portability
    will not be an issue because it abstracts the OS, networking, and storage details
    from the application better than LXC does. So, when a developer is done with development
    and testing, he or she can create an image, which can be downloaded on production
    and is guaranteed to work on the production. This is a key complexity that Docker
    containers address, making engineers’ lives a little easier.


    # # Docker Architecture and Components


    Docker uses a client-server architecture whereby the client talks to the Docker
    daemon, which mainly provides all the services. Let''s review the components that
    provide the workflow and toolsets to manage and deploy the containers, completing
    the Docker ecosystem:


    +   - Docker server or daemon. This resides on the host system and manages the
    containers running on the host machine.


    +   - Docker container. This is a standalone virtual system that contains the
    running process, all the files, dependencies, process space, and ports that are
    required to run the application. Since every container has all the ports available,
    we do the mapping to the Docker level. We talk more about this later.


    +   - Docker client. This is a user interface or a command-line interface is used
    to communicate with the Docker daemon.


    +   - Docker images. These are read-only template files of a Docker container
    that you can move around and distribute. Unlike virtual machines, these files
    can be versioned. Not only that, you can run docker diff to see changes between
    two images. Each image consists of multiple layers that may be shared across images.
    Suppose you have to upgrade the existing application. The update will create a
    new layer on top of the existing image. This means you can ship and deploy just
    the new layer, making the overall process lighter and faster, and that''s what
    makes containers lightweight.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# DOCKER ARCHITECTURE AND COMPONENTS


    +   - Docker registry. This is a repository for sharing and storing container
    images. A well-known registry is Docker Hub (just like GitHub) that allows you
    to pull or push the container images with public or private access. You can have
    your own private registry within your organization.


    +   - Dockerfile. This is a very simple text file where you can specify the commands
    to build images. It allows you to set up instructions to install software, set
    up environment variables, working directories, and ENTRYPOINT; and add new code
    using Docker commands. This resulted in a customized software. We review Docker
    commands in Chapter 7, “Docker Interface.


    +   - Docker Machine. Docker Machine allows you to spin up Docker hosts on your
    local machine or within your public or private cloud, such as Amazon and Microsoft
    Azure. It also provides a way to manage the hosts through Docker commands—start,
    stop, inspect, and more. For the latest information, refer to Docker online documentation.


    +   - Docker Swarm. Swarm provides out-of-the-box clustering capability wherein
    a pool of Docker nodes act as one large Docker host. It is a separate tool, which
    you can install using Docker Machine or, manually, by pulling the Swarm image.
    At the time of writing, it is being integrated into the Docker Engine. The setup
    process is straightforward: configure the Swarm manager on all the nodes, and
    you have it. The beauty is that we can just tell Swarm to start our containers,
    and it will decide which node to start them on, hiding all the complexity. In
    order to dynamically configure and manage the services in the container, you use
    a discovery service. The integrated option is called Swarm mode, and it works
    same as the Swarm tool. It also supports load balancing and service discovery
    and acts as a full-fledged orchestration engine. To enable Swarm mode, you use
    the simple init command and add workers using the join command. We learn more
    about Docker Swarm later in the book.


    +   - Docker Compose. An application will have multiple components and consequently
    will be running multiple containers. Docker provides the Compose tool, which allows
    you to define and run multiple container applications. You can define the application
    environment in a single Dockerfile and the services in the docker-compose.yml
    file, which will automatically spin up the required containers per the instructions
    in these files. Like Docker Machine, Compose provides commands for managing the
    application services with a single command.'
