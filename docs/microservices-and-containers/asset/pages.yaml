  md: 'running on the host, aggregates and processes these data for your consumption.
    It exposes this data through APIs that you can take advantage of. So that you
    can quickly try out cAdvisor on your machine with Docker, there is a Docker image
    that includes everything you need to get started (for more information, see github.com/google/cadvisor).
    You can run a single cAdvisor to monitor the whole machine. Simply run the following
    code:


    ```

    sudo docker run \

    --volume=:/rootfs:ro \

    --volume=/var/run:/var/run:rw \

    --volume=/sys:sys:ro \

    --volume=/var/lib/docker:/var/lib/docker:ro \

    --publish=8080:8080 \

    --detach=true \

    --name=cadvisor \

    cadvisor:latest

    ```


    cAdvisor runs in the background. You can see the GUI by going to http://localhost:8080,
    which brings up the built-in web UI. The last two ways of collecting metrics are
