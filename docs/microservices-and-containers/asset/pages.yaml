  md: '# Chapter 11


    # Case Study: Monolithic Helpdesk Application


    In this chapter, we build a traditional web-based helpdesk application following
    industry standard practices. However, we build it without using the concepts we
    have learned so far; that is, we build a monolithic application. The idea here
    is to gain real-world experience. We build this application and then look at some
    real-world complexities such as application deployment, managing updates, and
    scalability. Once we understand the complexities of using monolithic architecture,
    we will see how these challenges can be solved using a combination of microservices
    and Dockers, which we will do in the next two chapters when we rebuild the application
    using microservices architecture and deploy using containers.


    # Helpdesk Application Overview


    In today''s digital world, most companies are transforming the customer support
    experience by providing a self-service model through mobile/web applications.
    Application experience, availability, performance, and search capabilities are
    all keys to faster issue resolution and are critical characteristics of the system
    to meet the aforementioned objectives.


    This application provides support capabilities to help and manage customer concerns.
    It is important to note that the application is simplified for the purpose of
    explaining the concepts, architecture, and complexities of monolithic applications.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'Assume that in the real world, this application provides customer support for
    a mobile phone vendor. This application provides the following capabilities:


    +   - Account management. Provides the user account management functionality (add/modify/delete).
    Authentication is managed through username and pass-word on local database to
    keep it simple.


    +   - Incident creation and management. Provides the ability to submit new incidents
    along viewing and updating existing ones.


    +   - Product catalog management (admin only). Stores and manages the product
    catalog based on the product sold and inventory.


    +   - Appointment setup. Provides ability to set up an appointment with support
    professional.


    +   - Search. Provides capability to search for existing issues and resolutions
    as to the product catalog.


    +   - Message boards. Customer community board for customers to collaborate and
    help each other.


    The following technologies will be used to build this application:


    +   - User interface: HTML, JavaScript, JQuery


    +   - Middle layer: Java 7, Spring 3.x, Jersey 1.8, and Hibernate


    +   - Database: MySQL 5.x


    Refer to Appendix A to better understand the application workflows and step-by-step
    process. All the code and assets are available on the GitHub repository located
    at https://github.com/kocherMSD/Helpdesk_Monolithic.git.


    You can clone the code to your local machine using the git clone command. We will
    use this code during our setup process.


    # Application Architecture


    Now that we understand how this application is used, let''s dive into the technical
    details of the application. Figure 11.1 shows the component-based architecture
    of the application.'
