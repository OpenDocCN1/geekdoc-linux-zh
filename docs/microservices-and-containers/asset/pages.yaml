    # Docker Swarm


    Docker Swarm is a native container orchestration engine from Docker itself. Swarm
    is simply a group of machines (Docker engines) running Docker containers with
    Swarm mode turned on. Swarm effectively manages the cluster by instructing the
    cluster nodes to run containers. Let''s look at the main concepts.


    # Nodes


    A node, in simple terms, is a Docker engine that''s part of the Swarm cluster.
    The cluster has worker nodes as well as Swarm manager nodes. Swarm manager nodes
    are the brain of the Swarm cluster. They are responsible for managing the Swarm
    cluster by instructing the worker nodes to execute containers.


    The manager is not deployed as a single node; rather, multiple nodes are typically
    deployed in odd numbers such as three, five, and seven to avoid being a single
    point of failure. Manager nodes run what''s called a raft consensus algorithm
    to "elect" a'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'single leader. In the event a leader goes down, one of the followers will be
    elected as a new leader, thus avoiding disruption or any kind of a system failure.


    # # Services


    A service is simply a definition of what needs to be executed in the cluster nodes.
    A service definition consists of the following:


    +   - Image to run in the container

    - Any commands that need to run inside the container

    - Replicas or number of instances of the running container


    # # Task


    Task is the basic unit of scheduling in Swarm. It contains the Docker container
    and the commands that need to be run in the container. When the Swarm manager
    gets a request to spin up a service, the service simply indicates which container
    is to be launched and the number of instances that need to run in the cluster.
    The manager node then assigns the task (container to launch and commands to run
    in the container) to the worker nodes and lets the worker nodes launch those containers.
    It also ensures that the desired number of replicas (instances) are launched in
    the cluster.


    As users, we simply mention our intent or the desired state of an application,
    and it''s the job of the Swarm manager to ensure the desired state of the application
    is achieved and maintained.


