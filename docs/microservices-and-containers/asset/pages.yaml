  md: '# Operations


    The operations part of the process needs to be automated as well. Again, we are
    talking about hundreds of thousands of microservices—organizational capabilities
    need to mature enough to handle this level of complexity. You''ll need a support
    system, including the following:


    +   - Monitoring. From infrastructure to APIs to last-mile performance, everything
    should be monitored, and automatic alerts with proper thresholds should be put
    in place. Consider building live dashboards with data and alerts that pop up during
    issues.


    +   - On-demand scalability. With microservices, scalability is the simplest task.
    Provision another instance of your microservice you want to scale and just put
    it behind the existing load balancer and you are all. But in a scaled environment,
    this also needs to be automated. As we will discuss later, it is a matter of setting
    up an integer value to tell the number of instances you want to run for a particular
