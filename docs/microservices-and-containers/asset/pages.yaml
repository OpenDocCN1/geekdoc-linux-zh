    +   * **More freedom and fewer dependencies.** Microservices are meant to be standalone
    and independent. A development team can focus on its microservice and freely enhance
    functionality without worrying about breaking another microservice as long as
    they keep the interface contract intact or implement a new contract that is backward
    compatible.


    +   * **Fault isolation.** Fault isolation is a phenomenon in which one part of
    a system does not bring down the entire system. In a monolithic application, a
    fault in any part of the system will bring down the entire system, as the system
    is a single executable/process. With microservices, a fault in one microservice
    may bring down the impacted microservice, but it will not necessarily bring down
    the entire application because the affected microservice is running in its own
    process space. For example, in an e-commerce system based on microservices architecture,
    if the product review microservice crashes, users will still be able to see inventory,
    select items, view cart, and place an order. However, they will not be able to
    see reviews unless the microservice issue is resolved. If the same application
    was monolithic, the review service issue would possibly shut down the entire application.


    +   * **Data segregation and decentralization.** Unlike monolithic applications,
    where all the data typically is stored and shared in a central database, microservices
    provide us an opportunity to segregate data. Each microservice usually owns its
    data and does not share its data directly with other microservices.'
