  md: "# CLUSTER-WIDE MONITORING TOOLS\n\nAPI. Heapster processes and groups this\
    \ data and pushes to the configured back end for visualization. Currently supported\
    \ back ends include InfluxDB and Grafana for visualization.\n\nRefer to https://kubernetes.io/\
    \ and https://github.com/kubernetes/heapster for more details.\n\n# Prometheus\n\
    \nPrometheus is an open source cluster monitoring and alerting solution. It is\
    \ a little different from other solutions in it is built on a pull-model. In this\
    \ model, the monitoring agent pulls its targets on a predefined frequency to collect,\
    \ store, and alert on data. The applications must expose their data rather than\
    \ send it out. It offers a flexible query language called PromQL. Before we look\
    \ into how Prometheus works with Docker, let's look at its main components:\n\n\
    +   - **Prometheus server.** This component pulls/scrapes and stores the collected\
    \ data and runs rules to record new time series. It can also be configured to\
    \ generate diagnostic alerts that can be picked up by Alertmanager.\n- **Web UI.**\
    \ Prometheus uses Grafana as the graphical front-end interface to build highly\
    \ visual and interactive dashboards.\n- **Push gateway.** This intermediate service\
    \ enables you to push the metrics from short-lived services for which the data\
    \ pull is not possible. The Prometheus server can pull those metrics. Be careful\
    \ when using push gateways, as they can become single points of failure for that\
    \ particular source.\n- **Exporters.** These are special-purpose libraries used\
    \ to export metrics from certain systems in which it is not feasible to instrument\
    \ them with Prometheus metrics. Following are some examples:\n    - **HAProxy**\
    \ is a simple server that scrapes HAProxy stats and exports them, via HTTP/JSON\
    \ for Prometheus consumption at regular intervals.\n    - **Memcached exporter**\
    \ exports metrics from a mem-cached server for Prometheus consumption. You can\
    \ create custom exporters for your third-party applications. There are many available.\
    \ For the latest list of available exporters, refer to https://github.com/prometheus/docs/blob/master/content/docs/instrumenting/exporters.md\n\
    - **Alertmanager.** Alerts sent by the Prometheus server and other applications\
    \ are processed by Alertmanager as configured. The processing includes deduplication,\
    \ grouping, and routing to the configured medium (e.g., email, pager)."
