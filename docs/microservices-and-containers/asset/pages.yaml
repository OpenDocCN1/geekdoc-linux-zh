  md: 'This is how easy it is to scale up or scale down a microservice within a DC/OS
    cluster. Now that two instances of our catalog microservice are deployed in the
    cluster, we will access this service from rest of the application.


    # Accessing the Service


    How do we know where the service is running? If you recall from Chapter 3, “Inter-process
    Communication,” this is one of the most challenging parts in microservices deployment
    and architecture, as microservices may come up or go down for various reasons,
    such as node failure or insufficient resources. If a microservice goes down for
    any reason, Marathon will detect the failure and will work with the Mesos cluster
    to spin up another instance. It ensures that the correct number of instances are
    always running in the cluster.


    Marathon-lb, on the other hand, works with Marathon, through Marathon APIs, to
    discover what services are running in the cluster, on what machines in the cluster
    the service is running, on what ports, and so on. It discovers the service running
    in the cluster, if servicePort is defined, then Marathon-lb exposes that port
    on itself through which the actual service can be reached.


    Given this context, in our case, we have two instances of the catalog service
    deployed in the cluster, and they have a servicePort value 10000, which means
    the catalog service can be reached at http://<DNS name of the Marathon-lb server>:10000.


    To find out the Marathon-lb''s host name, you go to the DC/OS cluster running
    in AWS, select the stack, and choose Outputs tab, as shown in Figure 13.15.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_264_0.png)


    Figure 13.15 Representation of finding host name'
  merge: -1
