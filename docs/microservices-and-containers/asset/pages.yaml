  md: '+   - Replacing or adding new technology stack. If it ever makes sense to develop
    an existing or new service using a different technology stack, say PHP/NOSQL,
    the developer has full freedom to do so with minimal dependencies.


    +   - Scaling selectively. One of the biggest advantages of microservices is selective
    scaling. As you noticed in the new architecture diagram, each microservice can
    be load balanced. If there is more traffic expected on the ticketing layer, you
    can easily spin up any virtual machines or containers for the ticketing service
    without touching any other service or monolithic part of the application. This
    saves time, resources, and expenses on unnecessary scaling of the complete application.
    We will do this in the next chapter.


    +   - Handling faults. An issue or bug in a particular microservice will not impact
    the whole application if designed properly. The worst-case scenario may be that
    a particular microservice could be impacted, but the rest of the system will still
    be functional. Think of an e-commerce site based on a monolithic architecture.
    Say the product rating part of the application crashes. Depending how the monolithic
    application is written, this may bring down the whole application even though
    there were no issues with the cart and checkout part. With microservices, the
    worst outcome of a product rating microservice crashing would be that users cannot
    submit ratings. Since shopping cart and checkout services are up, users will still
    be able to complete the shopping, causing limited impact to business.


    Scalability is the biggest challenge. Running a few microservices is fine, but
    they are meant to comprise large systems, with thousands of microservices and
    lots of scaling up and down. Let''s now go and containerize our microservices
    in the next chapter so we can scale and manage them more easily.'
