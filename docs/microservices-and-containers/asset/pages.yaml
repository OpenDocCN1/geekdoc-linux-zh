  md: '# SERVICE DISCOVERY


    137


    Yet when the need for quickly spinning up machines on the fly became-wide, virtual
    machines (VMs) emerged. With VMs, what was once difficult to do with physical
    machines, such as dynamically adding nodes to handle additional load, became easy
    and very approachable. cloud technologies became popular. Now, when we have multiple
    servers offering a single service (e.g., a database cluster), how do the clients
    know which server to talk to? They use a load balancer such as NGINX or HAProxy
    and configuring the load balancer with the nodes representing a service.


    For example, let''s say we have a load balancer configured to balance the load
    between two Tomcat servers. As the traffic increases, a new Tomcat VM may be spun
    up; using scripts/automation, the load balancer will be updated to reflect that
    a new Tomcat VM was added. With this new configuration in place, the load balancer
    knows that an additional server representing a Tomcat service is in place, and
    it can direct traffic to that instance. Client applications don''t need to know
    that a new VM has been added to the Tomcat service, nor do they care about details
    such as where that VM is running, its IP address, and so on. Client applications
    continue to the load balancer, which in turn abstracts the changes in the Tomcat
    service (e.g., adding or removing nodes).


    Fast-forward to today. We live in the era of containers and microservices. With
    containers, the problem of discovering where a given service is located is going
    to be more difficult than other cases. Containers can be both launched and killed
    extremely quickly, and their location is not static, making it difficult for the
    clients to know where a given service is located in the cluster. The good news
    is that there are a good number of tools in the service discovery space that can
    be leveraged according to our needs.


    Before we look at the many tools available for service discovery, let''s understand
    a couple of service discovery patterns. There are at least two ways to do service
    discovery, depending on where it occurs:


    +   **Client-side service discovery.** Service registry is a tool or a database
    that contains the list of all services, details about where those services reside
    (IP address, port), and so on, as shown in Figure 9.10. The locations of the actual
    services gets registered with the registry when these services come up. Likewise,
    the entries in the registry are removed as these services are terminated.

    Outside a service start or stop, some kind of a heartbeat mechanism must be in
    place to ensure that the registered services are up and healthy.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# CHAPTER 9 CONTAINER ORCHESTRATION


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_157_0.png)


    **Figure 9.10** Client-side service discovery


    The major drawback of this approach is that the client has to know about the service
    registry, which puts the responsibility on the client applications to discover
    the services before they can communicate with the service.


    +   * Server-side service discovery. In the case of server-side service discovery,
    the client can directly send a request to an API gateway or a load balancer and
    not worry about connecting to the right service. The load balancer does the heavy
    lifting of managing the service, querying the registry to get the location of
    services to handle incoming requests, and performing a load-balancing operation
    across multiple instances of the service, as shown in Figure 9.11. A classic example
    of this pattern is the Amazon ELB (elastic load balancers).


    With Amazon Web Services, let''s say we set up a four-node EC2 (Amazon Elastic
    Compute Cloud) for an application tier (Tomcat). In order to split the traffic
    between these four EC2 Tomcat instances, we have to add/register these instances
    to an ELB by providing details such as the instance name, port on which the service
    is running, mechanism to be used to ensure these services are healthy (ELB should
    be used for heartbeat/health checks), and frequency at which the health check
    should happen. Once the configuration is done in the ELB, the ELB does the heavy
    lifting of handling the incoming requests and routing the requests to the appropriate
    Tomcat instance.'
