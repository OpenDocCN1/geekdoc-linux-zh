    Well, Docker is using the basic Linux networking to do this magic. All the containers
    created through the bridge parameter or without any networking parameters are
    all connected to this bridge (docker0) and are therefore able to talk to each
    other. Docker puts all the necessary entries in the /etc/hosts/ file (iptables
    and the like) to make this work. Figure 8.15 shows how it all looks:


