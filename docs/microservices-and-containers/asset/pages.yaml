  md: '# # Transition to Microservices and DevOps to Transform Your Software Development
    Effectiveness


    Thanks to the tech sector''s latest game-changing innovations—the Internet of
    Things (IoT), software-enabled networking, and software as a service (SaaS) to
    a few—there is now a seemingly insatiable demand for platforms and architectures
    that can improve the process of application development and deployment.


    In Microservices and Containers, longterm systems architecture and engineering
    team leader Parminder Kocher analyzes two of the newest technology trends: microservices
    and containers. Together, as Kocher demonstrates, microservices and Docker can
    bring unprecedented agility and scalability to application development and deployment,
    especially in large, complex projects where small errors can be disastrous.


    Learn how to leverage microservices and Docker to drive architectural design,
    on-demand scalability, application performance and time-to-market, code reuse,
    and exponential improvements in DevOps effectiveness. Kocher offers detailed guidance
    and a complete roadmap for transitioning from monolithic architectures, as well
    as an in-depth case study that walks the reader through the migration of an enterprise-class
    SOA system.


    Whether you are a software architect/developer or professionals looking to move
    on from older approaches or a manager trying to maximize the business value of
    these technologies, Microservices and Containers will be an invaluable addition
    to your library.


    PARMINDER SINGH KOCHER has two decades of experience building enterprise-grade
    software systems. Currently engineering director for the Networking Academy at
    Cisco, where he has worked since 2005, Kocher leads engineering teams developing
    the Academy''s next-generation platform, which is available and accessed in more
    than 180 countries. He has managed Cisco''s Managed Services (CMS) platform and
    worked as an innovation evangelist leading multiple software groups.


    +   Understand how microservices enable you to organize applications into standalone
    components that are easier to manage, update, and scale


    +   Decide whether microservices and containers are worth your investment, and
    manage the organizational learning curve associated with them


    +   Apply best practices for interprocess communication among microservices


    +   Migrate monolithic systems in an orderly fashion


    +   Understand Docker containers, installation, and interfaces


    +   Network, orchestrate, and manage Docker containers effectively


    +   Use Docker to maximize scalability in microservices-based applications


    +   Apply your learning with an in-depth, hands-on case study


    informit.com/aw


