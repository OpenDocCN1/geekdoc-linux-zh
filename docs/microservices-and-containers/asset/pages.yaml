    +   - API exposure. In most cases, you will want to expose the APIs externally
    for external users to consume. This is best done using an edge server, which can
    handle all the external requests. It can utilize the API gateway and discovery
    service to do its job, and you can use one edge server per device (e.g., mobile,
    browser) or use case. An open source application created by Netflix, Zuul, can
