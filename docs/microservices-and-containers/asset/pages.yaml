  md: '# Appendix B


    # Installing the Solr Search Engine


    This appendix provides step-by-step instructions for installing and configuring
    Solr to use as our search engine as part of improving the search service part
    of our case study in Chapter 12, "Case Study: Migration to Microservices." The
    instructions are applicable to CentOS operating system. If you want to learn more
    about Solr and explore its capabilities, visit http://lucene.apache.org/solr/resources.html.


    # Prerequisites


    +   * CentOS Linux box or virtual machine with at least 1 GB of RAM

    * python-software-properties package installed

    * Latest version of Java installed


    # Installation Steps


    +   1. Download the Solr tar file from the mirror. You can pull the latest version
    available, but at time of writing, we worked with version 5.5.


    ```

    wget http://apache.mirror1.com/spango/lucene/solr/5.5.4/solr-5.5.4.tgz

    ```


    We''ll use the wget utility to download the tar file, as shown in Figure B.1.'
