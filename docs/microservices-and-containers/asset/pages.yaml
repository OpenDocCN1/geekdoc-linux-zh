  md: '# Organization Readiness


    As we discussed in Chapter 2, "Switching to Microservices," the first question
    you have to ask yourself whether your organization is ready to transition to micro-services.
    That means the various departments of your organization now need to think differently
    about building and releasing software in the following ways:


    +   - **Team structure.** The monolithic application team (if one exists) needs
    to be broken down into several small high-performance teams aware of or trained
    in microservices best practices. As you saw in Figure 4.3, the new system will
    consist of a set of independent services, each responsible for offering a specific
    service. This is one key advantage of the microservices paradigm—it reduces the
    communication overhead, including those multiple nonstop teams. Teams should be
    organized by business problems or areas they are trying to address. The communication
    then becomes the timing and set of standards/protocols to follow so that these
    microservices can work with each other as one platform.

    - **Agility.** Each team must be prepared to function independently of others.
    They should be the size of a standard scrum team; otherwise, communication will
    become an issue again. Execution is the key, and each team should be able to address
    the changing business needs.

    - **Tools and training.** One of the key needs is the organization''s readiness
    to invest in tools and people training. The existing tools and processes, in most
    cases, would need to be retired and new ones picked up. This will require a large
    capital investment as well as investment in hiring people with new skills and
    retraining existing staff members. In the long term, if the decision is right
    to go on microservices, organizations will see savings and recoup the


    # Services-Based Approach


    Unlike with monolithic applications, with microservices you need to take a self-sustained
    services-based approach. Think of your application as a bunch of loosely coupled
    services that communicate with each other to provide complete functionality. Each
    service should be thought of as an independent, self-contained service with its
    own lifecycle that can be developed and maintained by independent teams. These
    teams may select from a variety of technologies, including languages or databases
    that best suit their services'' needs. For example, for an e-commerce site, the
    team would write a completely independent service, such as a shopping'
