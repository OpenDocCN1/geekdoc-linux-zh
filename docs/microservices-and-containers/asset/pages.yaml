    # Apache Mesos and Marathon


    Apache Mesos is an open source containers orchestration framework that is proven
    to work well in large-scale production environments. Mesos is like an operating
    system kernel that manages resources in a cluster of machines. It works in a master/slave-based
    architecture. By itself, Mesos manages only the cluster resources; it''s the job
    of the frameworks, which sit atop Mesos, to schedule tasks in the cluster. There
    are many frameworks available, the best known of which include Marathon, Hadoop,
    and Chronos. We focus on Marathon in this chapter.


    The Mesos architecture consists of slaves (or agents), and frameworks, as shown
    in Figure 9.3. Let''s look at the major components that make up Mesos.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_148_0.png)


    Figure 9.3 Mesos architecture'
