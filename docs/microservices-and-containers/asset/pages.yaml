  md: '+   * Choices. Unlike a monolithic application, where all application components
    have to use a single database, platform, and programming language, microservices-based
    applications offer the opportunity to use the best tool for each specific job.
    One microservice might use Oracle with Linux OS, and another might use a NoSQL
    database on a Microsoft platform. Long-term commitment to technology stacks is
    no longer necessary.


    # ## Disadvantages of Microservices


    Nothing comes for free; there has to be some cost in achieving all the benefits
    offered by microservices. If we move towards microservices, we need to be aware
    of the challenges posed by such an architecture. Not to worry, though. In the
    next part of this book, we learn how to use certain systems and applications to
    overcome the challenges. For now, let''s list some of the challenges posed by
    microservices:


    +   * Troubleshooting complexity. Microservices provide the overall capabilities
    through inter-microservices communication, which increases potential points of
    failure. This makes answering questions such as the following challenging:


    +   * Is my system healthy at any given instance?


    +   * If an end user reports a problem such as slow performance or timeouts, where
    do I start my?


    In a monolithic application, it is easier to trace a request to end. However,
    in a microservices-based application, each end request might be broken down into
    multiple requests and might hitting multiple microservices to get a response.
    Troubleshooting can become a little tricky.


    +   * Increased latency. Intraprocess communication (like the kind used in monolithic
    applications) is much faster than theprocess communication used by microservices.


    +   * Operational complexity. With several hundreds to thousands of microservices
    in a real-world application, operations teams have to deal with complex infrastructure,
    deployment, monitoring, availability, backups, and management. In a way, we are
    moving the complexities of a monolithic architecture to the systems side of microservices.
    Still, this complexity can be addressed by a high level of automation.


    +   * Version control. Because a microservices-based application may have thousands
    of microservices, the versioning and management becomes little complex. It requires
    better version control and management systems.'
