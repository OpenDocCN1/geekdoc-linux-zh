  md: "# CONFIGURING SOLR FOR SIMPLE DATA IMPORT\n\nThere will be a separate microservice\
    \ for the Solr-based search, which we will pull the data from the existing database\
    \ to be indexed in Solr. There are different utilities available to pull the data\
    \ from MySQL/PostgreSQL into Solr. (You may also need continuous syncing of the\
    \ data between the application database and Solr; in this case, we will pull the\
    \ data only once to keep it simple.) We will use a simple data import handler\
    \ and import the required table in Solr.\n\n# Configuring Solr for Simple Data\
    \ Import\n\n+   1. Add the following configuration in solconfig.xml. This code\
    \ specifies the path to the data import configuration file. This configuration\
    \ file is installed as part of Solr. Update the path in this snippet to the location\
    \ of the file on your machine:\n\n```\n<requestHandler name=\"/dataimportport\"\
    \nclass=\"org.apache.solr.handler.DataImportHandler\">\n  <list name=\"defaults\"\
    >\n    <str name=\"config\">/path/to/my/dbconfigfile.xml</str>\n  </list>\n</requestHandler>\n\
    ```\n\n+   2. Add the following in the dbconfig file. We are importing the database\
    \ table to be indexed in Solr. In this snippet, we are specifying the data source\
    \ along with the data selection query.\n\n```\n<dataConfig>\n  <dataSource driver=\"\
    org.hsqldb.jdbcDriver\"\n    url=\"jdbc:hsqldb://example-DIH/hsqldb/ex\"\n   \
    \ user=\"sa\" password=\"secret\"/>\n  <document>\n    <entity name=\"products\"\
    \ query=\"select * from products\"\n      deltaQuery=\"select id from products\n\
    \      where updated_date > '${dataimporter.last_index_time}\\'>\n    />\n  </document>\n\
    </dataConfig>\n```"
  merge: -1
  pgno: 284
- img_proc: true
  md: '+   3. Go back to the shell prompt and run following command to import index
    the data:


    ```

    bin/solr -e dih

    ```


    Once all the data is indexed in Solr, it is easy to create a RESTful web service
    that can query the data from Solr and provide fast, accurate, reliable searches.
    We are ready to go! Now you can create the microservice from the case study described
    in Chapter 12.'
