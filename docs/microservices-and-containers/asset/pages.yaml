  md: '+   Monitoring in microservices. With hundreds of thousands of microservices
    spread out over distributed systems, there are going to be lot of moving parts.
    Proper checks and balances must be put in place, both in the infrastructure (CPU,
    memory, I/O performance) and granularly at the application level (application
    log files, API call performance). The data extracted from this level of monitoring
    should be easily and readily available for operations and engineering teams to
    act with and improve the services.


    +   Configuring microservices. For any service, there are various configuration
    options provided by developers who provide flexibility in production and make
    it easy to adjust the services depending on the conditions. Such configuration
    includes settings as caching, scaling parameters, thread counts, application feature-specific
    flags, database connections, and so on. Managing these aspects for thousands of
    microservices may be a cumbersome task. A lot of tools exist to address some of
    these concerns, so a right combination of tool sets must be selected to create
    a common interface for simplicity.


    +   Failure handling in microservices. When a microservice fails, the check and
    balances discussed in the previous bullets help, but the system needs to be designed
    keeping in mind that failure is inevitable. Each microservice should be built
    such that a failure in a dependent service should not cause any issues with the
    performance of its own service, let alone bring the entire system down. The overall
    intention should be to build toward self-healing systems.


    In light of all this information, the organization must be fully prepared for
    this change and able to allocate the proper resources to make the transition successful.
    A decision should be made only after all of these concerns are weighed. It is
    recommended to create a gap list to easily convey and understand the level of
    investment required to move to a microservices paradigm.


    # Business Case for Microservices


    Given all the issues we have discussed so far, it may be difficult to understand
    and build the business case for microservices. You may be thinking, if it is more
    complex to build and maintain microservices-based applications, why should you
    invest in doing so? It is certainly going to be more complex, and the initial
    effort may be very high to train existing staff and change the organization culture,
    yet the long-term benefits would not only outweigh initial investment but other
    advantages in the long run. What you need is a very basic analysis to help you
    understand or build the business case for the organization.'
