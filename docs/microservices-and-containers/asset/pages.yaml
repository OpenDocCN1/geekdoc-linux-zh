  md: '# Microservices Criteria


    The question then becomes what components should be migrated first or even migrated
    at all. That brings us to what I call the “microservices criteria,” which out-line
    of the possible ways to select and prioritize the functions that should be migrated
    to microservices. They are a set of rules you establish that either qualifies
    or disqualifies the conversion of your existing monolithic application''s components
    to microservices given the organization''s needs at time.


    “time” is very important because with time the needs of the organiza-tion may
    change, and you may have to come back and convert more components to microservices
    later. In other words, with changing needs, additional components of your monolithic
    application may qualify for the conversion.


    Here are best practices that can be considered microservices criteria during the
    conversion process:


    +   - Scale You need to determine which functions are highly used. Convert the
    highly used services or application functionality as microservices first. Recall,
    a microservice performs only one well-defined service. Keep the principle in mind
    and divide the application accordingly.


    +   - Performance There are likely components that are not performing well, and
    other alternatives are readily available. It may be there open source plugin available,
    or you may want to build a service from scratch. One of the key things to keep
    in mind is the boundary of a microservice. As long as you design your microservice
    in such a way that it does one and only one thing then it is good. Determining
    the boundary is often going to be hard, and you find it easier to do this with
    practice. Another way to look at the micro-service boundary is that you should
    be able to rewrite the microservice in a few weeks’ (if/when required) as opposed
    to taking few months to rewrite the service.


    +   - Better technology alternatives or polyglot programming. Domain-specific
    programming languages can be employed to help with problem domains. It is particularly
    applicable to components which you received many enhance-ment requests in the
    past and you expect that to continue. If you think not only that such a component''s
    implementation can be simplified using a new language or capability in the market
    but also that future maintenance and updates will become easier, then now is the
    right time to address such changes. In other cases, you may find another language
    provides easier abstractions for concurrency than the the current one used. You
    can leverage the new language for a given microservice'
