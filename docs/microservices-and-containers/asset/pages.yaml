    Kubernetes has a command-line interface called kubectl. It is used for running
    commands and interacting with Kubernetes clusters.


    # Master Node


    The master is the brain of Kubernetes. It coordinates the cluster activities with
    the help of some supporting services. It has an API server, a scheduler, and a
    replication controller. They manage all activities—scheduling and maintaining
    applications'' desired state, scaling up and down, and so on.


    # API Server


    The API server is responsible for exposing Representational State Transfer (REST)
    APIs to interact with the Kubernetes cluster. All external communications that
    happen between the client (kubectl) and the Kubernetes cluster is handled by the
    API'
