  md: '# Conclusion


    In the preface, I said that I wrote this with two groups of readers in mind: experienced
    software and systems engineers looking to roll up their sleeves and get their
    hands dirty with some real-life examples and a deep-dive case study, executives
    and project managers—that is, non-programmers—who want a high-level introduction
    to the topic. Whichever group you fall into—perhaps you even have a foot in both—I
    hope you find the pages you read enlightening.


    Each subject we covered about microservices and containers—discovery services,
    API Gateway, Kubernetes, services communication, and more—is worthy of an entire
    tome on its own (Indeed, some of those topics already have multiple books devoted
    to them!). What I wanted to do with this book was to provide a higher-level synthesis
    of those topics, providing you with just enough to make the takeaways you need
    for your job or career. Alone, microservices enable the on-demand scaling of various
    software components. Containers, meanwhile, help with virtualization, keeping
    everything lightweight along the way. Together, they complement each other beautifully,
    making one plus one equal three—the ultimate definition of synergy.


    # What Is DevOps?


    In the opening chapters of this book, we examined some of the impacts microservices
    and containers can have on organizations, but we did not talk much about their
    potential impact on another hot topic of the moment: DevOps. Today, many software
    organizations are moving toward the DevOps model, and microservices and containers
    will be key enablers in this journey.


    DevOps is a portmanteau—a hybrid term—that combines two software engineering practices:
    software development and (IT) operations. The emphasis is'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'on increasing collaboration between these two practices in order to accomplish
    the following:


    +   * Increase software release velocity.

    * Improve the product quality at a faster pace.

    * Automate various aspects of these two fields, such as code-building, testing,
    packaging, releasing, and deploying.


    Not surprisingly, the entire tech industry is scrambling to jump on the DevOps
    bandwagon in order to reap the benefits of all that potential. So, what''s the
    hol? What challenges are Silicon Valley''s best and brightest facing what is preventing
    them from developing the proverbial golden egg-laying goose? The biggest one is
    change. Many tools and practices are already in place in these organizations to
    manage software development, testing, or release, and all these must change. Not
    only that, organizational change may also impact existing team structures, which
    in turn can require the recruitment of new skill sets. These challenges should
    sound similar to those surrounding microservices.


    Next, if you look at the goals behind DevOps, you can see microservices clearly
    enable this combination of software engineering practices. The complexity of a
    monolithic architecture is broken down into manageable pieces that provide just
    one capability each. Those pieces can be divided among multiple teams such that
    each team can focus on its own piece. The result is shorter development cycles
    and simpler, quicker deployments, reducing time to market. These advantages, in
    turn, create the need for operations agility and automation. Microservices need
    that kind of agile culture to be nurtured, and therefore push or enable the DevOps
    environment.


    Given these advantages with DevOps, it might seem as though every developer, architect,
    or organization would want to transition to a microservices paradigm. As we discussed
    earlier, it is not for everyone. Microservices are the best fit for complex architectures—that
    is, software with many functionalities and end users, rapid deployment, and scalability.
    In the very near future, most companies, including many small and medium-size
    organizations, will embrace this trend. Why? Five reasons:


    +   * An even more complex future of the software industry. Software-defined networking,
    software-defined storage, software as a service, the Internet of things, and platforms
    that handle complex communication between millions of users and devices are some
    examples that come to mind when you talk about where the software industry is
    going. There is a plethora of companies,'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# What Is DevOps?


    both big and small, getting into these fields, and as they move forward, we will
    realize the need for a microservices-based architecture coupled with an agile
    culture.


    +   * New client types generating new needs. The most innovative companies are
    developing solutions that are supported on all kind of new devices of resources
    and around the globe. Each family of devices has different sets of resources to
    work with. Memory, processing speed, and storage are limited in some devices and
    found in abundance in others. When all these devices with different constraints
    try to access the same software, the software must support their requests by hiding
    the complexity from the clients. Where is this complexity going to be hidden?
    In the software itself! Which means the software will become even more complex—hence
    the need for microservices architecture that can support communication with different
    clients, as discussed in earlier chapters.


    +   * User-driven complexity. Amazon and Netflix offerings have gotten complex
    thanks to their innovation in simplifying and enhancing the user experience. They
    would have probably survived with monolithic paradigms if their numbers of users
    remained manageable. In fact, they continued on that path in their initial years.
    As the emerging markets catch up to developed ones and millions (or billions!)
    online will continue to grow more complex to address the scalability, performance,
    and needs of different users. This will cause more and more companies to feel
    the need for microservices, which can address these issues.


    +   * Job satisfaction. Monolithic means one platform worked on by one or more
    development teams, sometimes divided by work type (e.g., frontend, backend, user
    experience). One of the issues with this model is that one backend engineering
    team may be responsible for building all the backend for required services such
    as billing, product catalog, shopping cart, and so on (in the example of an e-commerce
    site). When the code and use get complex, the team splits further and divides
    the work within backend systems (common capabilities and like). As the complexity
    increases, they add more people and create new teams and complexity grows to the
    point that any small feature update requires long cycles and deployment times.
    Over time, teams become fragmented. Failed builds, rollbacks, and time-consuming
    debugging can become the norm rather than occasional roadblocks. Miscommunication
    and lack of collaboration occur, and in particularly fraught situations, can end
    in fingerpointing, name-calling, and even talent attrition. If implemented well,
    DevOps and microservices can promote clearer separation of roles and responsibilities,
    which will enhance collaboration between teams. Collaboration, in turn, drives
    up productivity, which directly impacts the bottom line. The result? Job satisfaction
    all the way around.'
  merge: -1
  pgno: 268
