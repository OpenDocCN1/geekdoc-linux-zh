  md: '# Chapter 10


    # # Containers Management


    Now that we understand containers orchestration, scaling, and networking, let''s
    talk about what happens when things go wrong. You will have potentially hundreds
    to thousands of containers running in the production, and you need to know how
    to manage them effectively and efficiently. To that end, our deep dive into containers
    concludes by getting into the nitty gritty of container monitoring and management
    that includes capturing logs, collecting resource metrics, and using some clusterwide
    monitoring systems. Let''s first understand the overall monitoring aspect of containers
    and why it may be different from what already exists in the market.


    # # Monitoring


    Monitoring an environment with containers is not difficult, but the speed, quantity,
    and environment can make it so. Legacy-wise, the monitoring tools market to monitor
    and manage physical hosts, network, and virtual machines has matured. Containers
    are new; the marketplace is still in the process of solving the monitoring problem.
    Containers monitoring is different because of the following aspects and challenges:


    +   - **Deployment environment.** An organization may run some containers directly
    on physical infrastructures within its own data center and some containers on
    virtual machines with a service provider such as AWS Managed Service Partners,
    which adds little more to complexity in terms of management.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '+   - Scalability of containers. Whole applications can be run on a physical
    machine or on few virtual machines. With containers, the best practices dictate
    one service per container, and an application may consist of hundreds to thousands
    of services, which means hundreds to thousands. In a microservices architecture,
    application scaling requires auto-shrinking and auto-extending the number of containers
    on the basis of changing needs.


    +   - Velocity of change. Unlike physical hosts or virtual machines, the life
    expectation of a container may vary from a few seconds to several days. When a
    task is finished, the container goes away.


    +   - Various tools in use. Although containers provide speed and efficiency,
    they throw simplicity out the window. Deployment, management, and discovery of
    the containers involves a plethora of tools. For example, you may use one of several
    containers orchestrators, such as Docker Swarm, Kubernetes, or Mesos. You can
    spin up, and so on. The orchestrators then control the creation, deletion, and
    management of the containers based on resource availability within the hosts.
    Each time a new container is created, it gets a new IP address. Each time it gets
    a new IP address. With all this going on, it becomes very hard to set up the overall
    monitoring and collection of metrics.


    +   - Distributed data. Data must be collected from the various tools and merged
    at one centralized place to make sense of it and find potential issues. Docker
    provides some capabilities to get these data and statistics to proactively monitor
    the containers and overall system.


    There are lot of vendor-specific options, and each has its own benefits. Docker
    has recently launched the Ecosystem Technology Partner (ETP) program with the
    companies that have integrated their monitoring tools with Docker through APIs.
    You can search for such partners at https://www.docker.com.


    Let’s begin the discussion with available logging and container metrics collection.
    You can pull this data to your existing monitoring tools or build some dashboards.


    # Logging


    In a production environment that supports multiple applications on multiple clusters
    with multiple copies of a running service, you may have a very high number of
    containers running. Things do go wrong, and when they do, logging becomes important
    to troubleshoot the issues. For example, recall that with microservices, we'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'are talking about hundreds to thousands of microservices as part of large-scale
    application. Docker containers are well suited to run such a high number of microservices
    because they offer the many advantages we have discussed. The question is, how
    do we manage the logging when each container is spitting everything that comes
    out of stdout and stderr into the logs? How do we keep all these in sync and in
    a place that makes troubleshooting straightforward and efficient?


    Docker, once again, provides drivers that simplify our job. Each driver helps
    us get the logging information from the containers and running services. They
    differ in the way they provide and format the information and how they forward
    it to different log processors. Example drivers include JSON, Syslog, Splunk,
    Amazon Cloud-Watch Logs, and the like. We use these options thoroughly, but for
    more details, refer to Docker online documentation.


    At the time of writing, the following logging drivers are supported:


    +   - **json-file**. The default logging driver for Docker daemon. Each container
    uses json-file unless you configure the container or daemon to use a different
    driver. The output log file is in well-understood JSON format.


    +   - **None**. Turns off logging.


    +   - **Syslog**. Sends the log messages to the syslog server installed locally
    or remotely. As discussed earlier, you can modify the daemon.json file on the
    host to set the log driver to syslog and specify options in the options section.
    You can also do this at the container level. Syslog brings all the messages to
    the same location, which helps in troubleshooting, but it is not sufficient to
    deal with hundreds of containers, as in the case of microservices.


    +   - **awslogs**. Sends the log messages to Amazon CloudWatch Logs. In this case,
    set the log driver to awslogs and specify the required options.


    +   - **Splunk**. Sends the log messages to Splunk using the HTTP event collector.
    In this case, set the log driver to Splunk. Splunk-token and splunk-url are the
    required options you must specify in the file or at the time of running the container.


    +   - **Journald**. Sends the log messages to the system journal. In this case,
    set the log driver to journald. Log entries can be retrieved using journalctl
    or Docker log commands.


    +   - **gcplogs**. Sends the log messages to Google Cloud Platform where you can
    search and analyze these messages. In this case, set the log driver to gcplogs.
    You can also set several options to include more details in the messages.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '+   - GELF: Sends messages to Graylog Extended Log Format (GELF) endpoints
    such as Logstash server. In this case, set the log driver to gelf along with various-options.
    GELF is extensively used as part of ELK (Elasticsearch, Logstash, and Kibana).


    As mentioned earlier, json-file is the default driver. You can check this by running
    the following command:


    ```

    docker info | grep ''Logging Driver''

    ```


    You should see the result - Logging Driver: json-file.

    Let''s run an Ubuntu container and check the default logging:


    ```

    docker run -it ubuntu:latest sh

    ```


    Open another terminal, find the container ID, and copy it:


    ```

    docker ps

    ```


    Now run the following command to find the logging driver for our Ubuntu container:


    ```

    docker inspect -f ''{{.HostConfig.LogConfig.Type}}'' ec5e917eb9b0

    ```


    You should see the result shown in Figure 10.1.


    ```

    [root@linux-dev pkocher] docker inspect -f ''{{.HostConfig.LogConfig.Type}}''
    ec5

    json-file

    ```


    Figure 10.1 Using docker inspect to find the logging driver for our Ubuntu container


    You can change the default logging driver, at the daemon level or at the container
    level. For the daemon level, you can modify the value of log-driver in the daemon.json
    file located in /etc/Docker on the Linux host machine. The structure looks like
    this:


    ```

    "log-driver":

    "log-opts":{ options syslog server info, etc. }

    ```


    For the container level, you can specify the logging driver during the run command,
    as we''ll see in the next example.


    Of course, another option is to turn logging off altogether. Let''s restart our
    Ubuntu container with the none option and run the logs command again.


    ```

    docker run -it --log-driver none ubuntu:latest sh

    ```'
