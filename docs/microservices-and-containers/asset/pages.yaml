  md: '# CHAPTER 9 CONTAINER ORCHESTRATION


    responsibilities. It reads data from the pods that describe the pod''s policies
    (required amount of CPU, memory, high availability needs, etc.) and runs its own
    algorithms to arrive at a best possible node to place the pod.


    Here''s a typical process that the Kubernetes scheduler goes through before making
    a decision on where to place a pod:


    +   1. Scheduler reads the pod''s nodes in terms of resources, node affinity,
    and so on, and inspects the list of available nodes by pulling the information
    from the etcd database. It filters out any node(s) that does not meet the pod''s
    policies / requirements at that time.


    For instance, let''s say a node has 12G memory and is running a pod that is already
    using 8G RAM. The leftover memory in this node is 4G. If the scheduler is looking
    for a node that has at 8G RAM to schedule a pod to run, then this node will be
    excluded, as it does not have the required amount of RAM to run the given pod.


    +   2. Nodes that got past step 1 are analyzed carefully by Kubernetes. It follows
    a set of criteria to choose the best one from all of qualifying nodes. For example,
    if an application has two pods, A and B, you don''t want both to be scheduled
    to run on the same node because that node goes down, then it may affect the application
    availability, especially in the case of microservices.


    Another example would be replication. Here you don''t want pod replicas to be
    scheduled on the same node for the same reason (impacts availability). Many policies
    are taken into account before Kubernetes comes up with the best possible node
    on which a given pod should be scheduled to run.


    +   3. Once the best node is selected, the scheduler schedules the pod to run
    on the chosen node.


    Kubernetes is a very pluggable architecture. If you need a better scheduler to
    fit your business or organizational needs, you can plug in your own scheduler.


    # Replication Controller (Controller Manager)


    The replication controller''s job is to ensure that the intended or desired number
    of pod replicas are running in the cluster at any given time. Let''s say we request
    Kubernetes to run three instances of the Tomcat container in the cluster. Kubernetes
    goes through the scheduling process and picks up the best nodes to run those three
    pods. Now one of the nodes that runs the Tomcat pod dies for some reason. This
    introduces a delta between the desired number of pods we want running in the cluster'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'and the actual number of pods running. Given this delta, the replication controller
    will kick in and request the Kubernetes scheduler to spin up another instance
    of the Tomcat pod somewhere in the cluster along with all the other pods running
    on that machine.


    Additionally, let''s say you don''t need three instances of the Tomcat pod running
    in the cluster. Maybe your application''s time has passed and you want to cut
    down on the resources because you are expecting less traffic. You may run the
    same command with an adjusted number of pods replicas:


    ```

    kubectl myTomcat --image=tomcat --replicas=2

    ```


    The replication controller will again kick in and kill the excess pods, one in
    case, running in the cluster to maintain the desired state.


    # Worker Nodes


    Worker nodes are where the pods are scheduled to run. An agent called kubelet
    runs inside each worker node. kubelet serves as the single point of contact for
    each worker node. It is responsible to get "work" from the master node and execute
    the work in the worker node. Work here is the pod or pods that need to be executed
    in the worker node. Typically, the scheduler component in the master node uses
    an API server to provide pod details to kubelet. After receiving the work from
    the master node, it ensures that the pods are successfully launched in the nodes.


    Kubelet is also responsible for reporting both the status of the node—its health,
    resource availability, and so on—and the status of each pod running in the node.
    kubelet stores these statistics in the etcd database via the API server. This
    data, available in the etcd database, serves as the source for the scheduler to
    decide which nodes are available (well as what resources are available in each
    node) for scheduling a pod. This data is also leveraged by the replication controller
    to decide whether the desired number of replicas for a service are running in
    the cluster. If the desired number of replicas are not running the cluster, then
    it steps in to match the desired state.


    # Pods


    Kubernetes pods are dynamic. In other words, they are created as needed; they
    can be moved to another node because of a node failure, they can be scaled up
    by the replication controller to handle more traffic, or they can be scaled down
    to conserve some resources. Let''s discuss this topic with a concrete example
    to make it clear.'
