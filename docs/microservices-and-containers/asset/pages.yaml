  md: 'Step 2: MySQL container. Similarly, you can pull the latest MySQL version image
    from the Docker Hub and run it on your local host. In the same run command, you
    can map the volume created in the previous step. In less than 2 minutes, your
    database is up and running. Following is the command:


    ```

    docker run --volumes-from mysql_data_container -v /var/lib/mysql:/var/lib/mysql
    -e MYSQL_USER=mysql -e MYSQL_PASSWORD=mysql -e DATABASE=test -e MYSQL_ROOT_PASSWORD=test
    -it -p 3306:3306 -d mysql

    ```


    Step 3: WordPress container. Just as we did in the previous step, we can pull
    and run the latest image of WordPress. In the same run command, we can link the
    MySQL database we created in the previous step:


    ```

    docker run -d --name wordpress --link mysql:mysql wordpress

    ```


    You are all set up with a personal WordPress site in less than 10 minutes.

