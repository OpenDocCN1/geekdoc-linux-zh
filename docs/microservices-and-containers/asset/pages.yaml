    So, what is happening here? On the backend, the Docker engine adds a NAT (net-

    address translation) rule in the Linux iptables. Take a look at the underlying

    iptables. You should see the mapping entry in the list.


    As you may have noticed, the bridge driver is a local scope—that is, it is limited

    to a single host. The other two network drivers, overlay and underlay, address
    the

    multihost scope.


    # Overlay Network Driver


    The overlay driver is utilized to achieve the containers'' connectivity across
    multiple

    hosts. It does this by decoupling the container network from the underlying physical

    layer and creating a tunnel across the hosts to enable communication. Think of
    it as one

    network spread across multiple hosts, and all the containers on this particular
    network

    are able to communicate just like within a single host. Figure 8.19 shows the
    network.'
