    authorize what level of information users are entitled to access based on their
    role. To make it simple, we have implemented simple authentication (database username/password)
    and role (database username and role)—based authorization. We have implemented
    spring interceptor to make sure every request is authenticated. The role and login
    are saved into session and are fetched from session as required.


