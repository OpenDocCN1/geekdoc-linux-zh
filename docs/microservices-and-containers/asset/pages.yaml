    ![](img/2a457a43a75620bdd821d9b6885ac4c2_279_0.png)


    **Figure A.18** Account information


    # Support Desk Engineer Flows


    Support desk engineers work on the incoming tickets and help resolve customers''
    issues. There are two main options: viewing all tickets and viewing and updating
    a specific ticket.


    # View All Tickets


    In the support desk engineer console, the engineers can see all the tickets, and
    they can click on the ticket number to open the ticket and start working at it,
    as shown in Figure A.19.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_279_1.png)


    **Figure A.19** Support desk user console'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# View Tickets


    Clicking on the ticket number in the support console opens the ticket in the update
    mode. A support desk engineer can add comments, change status, and so on, as shown
    in Figure A.20.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_280_0.png)


    **Figure A.20** Viewing and updating a ticket


    This wraps up our high-level discussion of the functionality of the application.
    Again, the intent was not to write an industry-grade application but to create
    an application comprehensive enough for a case study in which you could gain hands-on
    experience in transitioning a monolithic application to a microservices- and containers-based
    application.'
