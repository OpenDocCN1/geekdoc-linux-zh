  md: '# CONCLUSION


    +   - Business benefits. A smart business will always adapt to new technologies
    or paradigms if they can improve the bottom line and solve major challenges. Microservices
    offers one such opportunity to the business to differentiate itself from its competitors.


    Time will tell you, given these reasons, the penetration rate of microservices
    and containers will likely sky over the next few years.


    # Only the Beginning


    Although you have reached the end of this book, my hope is that these words serve
    as a commencement more than a conclusion. In other words, while you may have “graduated”
    from the School of Microservices and Docker, I assure you there is still so much
    more out there to learn. Whether consider this your main course or merely your
