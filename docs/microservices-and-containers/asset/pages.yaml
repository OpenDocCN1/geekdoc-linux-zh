  md: '# MIGRATING A MONOLITHIC APPLICATION TO MICROSERVICES


    Although it may sound correct to convert the whole monolithic application to a
    completely microservices-based application, it may not be efficient or may be
    very costly in some cases to convert every function or capability into microservices.
    You might end up writing the application from scratch, after all. The right way
    to migrate may require a stepwise approach, as shown in Figure 4.4.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_60_0.png)


    **Figure 4.4** Basic migration steps, monolithic to microservices


    The next question is, Where do we start with the current monolithic application?
    If the application is really old and it would be time consuming and difficult
    to take pieces out (i.e., if there is very high level of cohesiveness), then it
    is probably better to start from scratch. In other cases where parts of the code
    can be disabled quickly and the technology architecture is not completely outdated,
    it is better to start with rebuilding the components as microservices and replace
    the old code.'
