    # Underlay Network Driver or Macvlan


    A media access control virtual local area network, or Macvlan, is another built-in
    network driver that is very lightweight and simpler than other drivers. It does
    not use the built-in Linux bridging and port mappings; instead it connects the
    container''s interface directly to the host interfaces (eth0 or a sub-interface).


    Like overlay networks, Macvlan networks are segmented from other networks. Containers
    that live on the same host but not on this network cannot talk to each other.
