  md: 'A fast way to get started is to utilize DC/OS (datacenter operating system),
    an open source distributed system software based on Apache Mesos provides an easy
    way to get Mesos, Marathon, and Marathon-lb set up quickly. We''ll set up the
    framework within Amazon Web Services (AWS); the rest of this chapter is based
    on that. For more information on DC/OS, visit https://docs.io.


    # DC/OS Cluster Setup on AWS


    To spin up our microservices, we leverage the DC/OS cluster, let''s set it up
    first. There are a few different ways to spin up a DC/OS cluster: the easiest
    option by far is to spin up a cluster in AWS (You will need an AWS account to
    spin up cluster). For detailed documentation, refer to the following webpage:
    https://docs.mesosphere.com/1.7/administration/installing/ent/cloud/aws/


    When accessing the EC2 instances in Amazon, be aware that Amazon enforces best
    practices such as Secure Shell (SSH) keys instead of using usernames and passwords.
    It uses public key cryptography to encrypt and decrypt user credentials such as
    login information.


    Let''s create a key pair, which we will use during our DC/OS cluster creation:


    +   1. From the AWS console, under Network & Security, click Key Pairs. See Figure
    13.1.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_246_0.png)


    Figure 13.1 Representation of AWS console'
