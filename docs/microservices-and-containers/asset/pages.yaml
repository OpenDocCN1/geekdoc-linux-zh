  md: "# Submitting a Task to Marathon\n\nLet's describe the task for our product\
    \ catalog service. There are two ways to submit a task to Marathon:\n\n+   - Using\
    \ a simple command, you can submit a Docker command directly—example, Docker run\
    \ -P -d nginx. Simple, small tasks that do not require major configurations can\
    \ be submitted directly.\n\n+   - When we want to describe the service with more\
    \ details, we can use a JSON file. The JSON file is a well-known, standard format\
    \ that uses human-readable text to describe data. It uses key-value pairs to describe\
    \ the data, as we'll see shortly.\n\nWe use a JSON to describe our catalog service\
    \ in detail and then submit the task through Marathon. Here is our catalog service\
    \ configuration file (JSON):\n\n```\n{\n  \"id\": \"catalog-external\",\n  \"\
    container\": {\n    \"type\": \"DOCKER\",\n    \"docker\": {\n      \"image\"\
    : \"kocher/catalog-svc:1.1\",\n      \"network\": \"BRIDGE\",\n      \"portMappings\"\
    : [\n        { \"hostPort\": 0, \"containerPort\": 8080, \"servicePort\": 10000\
    \ }\n      ],\n      \"forcePullImage\": false\n    }\n  },\n  \"instances\":\
    \ 1,\n  \"mem\": 1024,\n  \"healthChecks\": [\n    {\n      \"protocol\": \"HTTP\"\
    ,\n      \"path\": \"/\",\n      \"portIndex\": 0,\n      \"timeoutSeconds\":\
    \ 20,\n      \"gracePeriodSeconds\": 10,\n      \"intervalSeconds\": 10,\n   \
    \   \"maxConsecutiveFailures\": 10\n    }\n  ],\n  \"labels\": {\n    \"HAPPROXY_GROUP\"\
    : \"external\",\n    \"HAPPROXY_0_VHOST\": \"ec2-52-207-255-252.compute-1.amazonaws.com\"\
    \n  }\n}\n```"
  merge: -1
  pgno: 255
- img_proc: true
  md: "# DEPLOYING THE CATALOG MICROSERVICE\n\nLet's review the submitted task in\
    \ detail:\n\n+   - id is an identifier for our catalog service. It is used to\
    \ identify services running in the cluster.\n- The container section describes\
    \ the Docker container for the product log service. It has the following components:\n\
    \  - type indicates the type of container. It is DOCKER by default. Another option\
    \ is MESOS, which, in future Marathon frameworks, may support other container\
    \ types.\n  - image indicates which Docker image should be spun up when this task\
    \ is launched in the cluster.\n  - network indicates the type of network. We are\
    \ using BRIDGE. There are other types of networks, as we saw in Chapter 8, \"\
    Containers Networking.\"\n- portMappings: hostPort indicates what port should\
    \ be exposed within the host on which the container is running. containerPort,\
    \ as the name suggests, is the port exposed within the container. servicePort\
    \ is the port on which this catalog service is accessible via the Marathon-lb\
    \ load balancer.\n- forcePullImage, if set to TRUE, forces Marathon to pull the\
    \ latest image from the Docker registry before it launches the task. The default\
    \ value is false.\n- instances indicates how many instances of the catalog service\
    \ must be launched in the cluster.\n- mem indicates how much memory should be\
    \ allotted to the catalog service.\n- The parameters in the healthChecks block\
    \ section instructs Marathon to perform a health check on the catalog service\
    \ at the configured intervals.\n- The labels section has the following labels:\n\
    \  - HPROXY_GROUP: The external label indicates that this microservice must be\
    \ accessible to the external world. If it is internal, then the same microservice\
    \ will be accessible only from the DC/OS cluster and not accessible from the outside\
    \ world.\n  - HAPROXY_0_HOST instructs the Marathon load balancer to create a\
    \ virtual host for the service. Services with this label set will be accessible\
    \ via the servicePort and additionally at ports 80 and 443.\n\nNow let's go to\
    \ the Marathon UI and submit this JSON file to launch our first microservice in\
    \ the DC/OS cluster. Go to Services and click the Marathon link. then launch the\
    \ Marathon by clicking Open Service, as shown in 13.9:"
  merge: -1
