  md: '# Appendix A


    # Helpdesk Application Flow


    This appendix provides a functional overview of the helpdesk application. Think
    of it as the user guide that presents the application capabilities for admin and
    the customer.


    In the real world, most support applications are integrated with order management
    and customer management systems. As a result, there is a lot of automation in
    place from the data movement perspective. For example, when a customer is created
    in a customer management system, the customer information is automatically pushed
    down to other systems, such as a support application. For our purposes, we are
    considering the standalone helpdesk application, and we have no integrations with
    upstream applications, so we will manually create all the required data to explain
    this application.


    There are three main types of users or roles in this application:


    +   - **Administrator.** The so-called superuser, who can create and modify new
    accounts, users, services, and so on. He she can see all the data and can access
    the backend systems such as databases.

    - **Customers.** Users who purchased the product or service from the vendor. Customers
    can create, modify, and check the status of tickets. They have visibility to the
    tickets that they submit.

    - **Support desk engineer.** A user who works on tickets submitted by customers
    and has visibility to all the tickets.'
