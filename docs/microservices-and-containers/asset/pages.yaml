  md: 'Figure 5.3 shows how everything fits together from a logical architecture perspective.


    ![](img/2a457a43a75620bdd821d9b6885ac4c2_75_0.png)


    **Figure 5.3** Docker architecture: how it all fits together


    In upcoming chapters, we present a detailed example of pulling and standing up
    a Docker container. But first we go through the Docker installation (Chapter 6)
    and commands (Chapter 7). The key point for now is that Docker containers provide
    a virtual environment, and the rest of the components are the toolsets to manage
    and operationalize these containers.


    So what are the advantages of using Docker technology? It not only addresses many
    of the issues encountered with virtual machines but also provides VM benefits
    and other advantages that make it a perfect fit for DevOps:


    +   * **Lightweight.** Docker containers do not have their own OS, so their size
    is reduced. Also, containers can be stored as images, which are simple files that
    can be version controlled and distributed easily.

    * **Portable.** A Docker container is the sum of an application and all its dependencies
    bundled together independently of the deployment model, OS version, and so on.
    This container can be easily transferred to another host machine in the form of
    an image and run without any issues. You can build it once and run it everywhere.'
