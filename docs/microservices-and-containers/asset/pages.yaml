    **8.19** Overlay network


    Note that the container on this particular overlay network won''t be able to communicate
    with the other containers even on the same host unless they are on overlay network.

    Docker uses VXLAN (virtual extensible LAN) as the tunneling technology. Just as
    we created the bridge network, we can create the overlay network by specifying
    the subnet. Docker automatically instantiates the required settings (Linux bridge
    between hosts along with associated VXLAN interfaces) for connectivity on each
    host.

    Docker is smart enough to create these settings on hosts where this container
    connectivity is required. This prevents the existence of each overlay network
    on all the host machines, a key feature of Docker containers that addresses microservices''
    distributed deployment and connectivity needs.


    # **Docker Swarm**


    In practice, you will have a cluster of Docker engine nodes running your application
    services. Docker Swarm provides cluster management and orchestration. Each Docker
    engine running on a node runs in the swarm node. One of the key features is multihost
    networking, which Docker Swarm provides through the overlay network driver we
    just discussed. When a service is created that uses an overlay network, the manager
    node of the swarm automatically extends the network to other nodes that are part
    of this service.'
