    cart microservice, with an in-memory database, and another one, such as an order-microservice,
    with a relational database. A real-world application may employ microservices
    for basic functions such as authentication, account, user registration, and notification
    with the business logic encapsulated in an API gateway that calls these microservices
    based on the client and external requests.


    Just a reminder: a microservice may be a small service implemented by a single
    developer or a complex service requiring a few developers. With microservices,
    the size does not matter; it all depends on one function that a service has to
    provide.


    Other aspects that must be considered at this point are scaling, performance,
    and security. Scaling can be different and provided on an as-needed basis at each
    microservice level. Security should be thought of at all levels, including data
    at rest, interprocess communication, data at motion, and so so on.


    # Interprocess (Service-to-Service) Communication


    We discussed the topic of interprocess communication in depth in Chapter 3, "Inter-process
    Communication." Key aspects that must be thought of security and communication
    protocol. Asynchronous communication is the way to go, as it keeps all requests
    on track and does not hold resources for extended periods of time.


    Using a message bus such as RabbitMQ may prove be beneficial for this kind of
    communication. It is simple and can scale to hundreds of thousands of messages
    per second. To prevent the messaging system from becoming a single point of failure
    if it goes down, the messaging bus must be properly designed for high availability.
    Other options include ActiveMQ, which is another lightweight messaging platform.


    Security is key at this stage. In addition to selecting the right communication
    protocol, industry standard tools such as AppDynamics may be used to monitor and
    benchmark the interprocess communication. Any anomalies must be reported automatically
    to the security team.


    When there are thousands of microservices, it does become complex to handle everything.
    We already discussed how to address such issues through discovery services and
    API gateways in Chapter 3.


    # Technology Selection


    The biggest advantage of transitioning to microservices is that it enables choices.
    Each team can independently select the language, technology, database, and so
    on, that is the best fit for the given microservice. Usually in a monolithic approach,
    the team does not have this flexibility, make sure you do not overlook and miss
    the opportunity.'
