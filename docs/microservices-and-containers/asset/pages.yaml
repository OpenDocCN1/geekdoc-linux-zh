    Let''s deploy the same configuration using Docker, keeping microservices in mind.
    Remember what we discussed earlier: this will provide us independent and standalone
    capability as an executable/process that communicates with other services or programs
    through standard interprocess communication.


    Similarly, we discussed that each Docker container runs just one process. You
    make the workers together by using link options—that''s what brings them together.
    In this example, we need to create three containers:


    **Step 1: Data container.** You can easily pull an existing basic Linux image
    such as Ubuntu from the Docker Hub and run it. This way, you can create the local
