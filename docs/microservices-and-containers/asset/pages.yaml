    # Docker Remove


    The Docker remove, or rm, command removes one or more specified containers:


    docker rm [Options] Container(s)


    As an example, to remove the Ubuntu container. We must stop the container before
    we can remove it or use -f (force) option to directly remove it, which actually
    sends a SIGKILL to the process running inside the container, and then the container
    will be removed:


    docker stop [Options] Container(s)


    Figure 7.23 shows the status of our Ubuntu container. The Ubuntu container is
    in running state and has been up for the last 38 hours, as shown under status
    attribute.


