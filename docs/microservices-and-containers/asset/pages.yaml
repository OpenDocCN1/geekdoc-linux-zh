  md: 'Let''s look at what changes have gone into these microservices, including how
    to build, configure, and deploy them.


    # Code Setup


    The original monolithic application used Apache Ant to build the project. As the
    evolving project based on microservices has become increasingly modularized and
    must manage dependencies, the individual microservices have adopted Apache Maven
    as the build tool. Ant has no built-in capability for dependency management, although
    it can be supplemented with Ivy. This illustrates a key concept: that each microservice
    can have its own way of building its source code.


    Code for these individual microservices is available at GitHub: https://github.com/kocherMSD/Helpdesk_Microservices.git.


    # Building the Microservices


    You can build individual microservices in two ways: via the command line or automatically
    from an integrated development environment such as Eclipse:


    +   * Building via the command line. To build a Maven project via the command
    line, run the mvn command from the command line. The command should be executed
    in the project directory that contains the relevant POM file. To build the individual
    microservices, the command to run is mvn clean package. This ensures the artifacts
    are cleaned up and packaged into a WAR file that''s ready to be deployed.


    +   * Building from Eclipse. Once you have the project imported into Eclipse,
    right-click the project, choose Run As, and select Run configurations. In the
    Run configurations window, enter clean package against the goals field and click
    Run. This should build the code clean and produce the WAR file, which is ready
    to be deployed in an application container such as Tomcat.


    # Deploying and Configuring


    There are quite a few options for deploying microservices. Each option has its
    pros and cons, so let''s quickly see what they are. In Chapter 13, we''ll delve
    deeper into the deployment space along with automated deployment, scaling, and
    so on.


    +   * Multiple microservices within a single machine. In this option, the strategy
    is to deploy more than one microservice within the same machine (physical or virtual).
    The major advantage of this approach is that the resource usage is'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# CHAPTER 12 CASE STUDY: MIGRATION TO MICROSERVICES


    relatively efficient because multiple services or instances are sharing the same
    resources (CPU, memory, I/O, etc.). The drawback is that there is little or no
    isolation of these services unless each service is a separate process. Also, misbehaving
    service can potentially consume all of the memory or CPU of the host.


    +   * Single microservice per virtual machine. The major benefit with this approach
    is that each service runs in complete isolation because it''s wrapped inside a
    virtual machine. Each microservice has full access to its allocated memory, CPU,
    and I/O. However, the major drawback with this approach is the lack of efficient
    resource utilization. Virtual machines may be underutilized, but again, this drawback
    can be overcome by allocating sufficient resources and puting the virtual machine
    on auto-scale.


    +   * Single microservice per container. Deploying a microservice in a container
    is simply packaging the service to run inside a container. Once you have the service
    packaged in a container, you can launch containers at well, depending on the varying,
    on-demand, and real-time application needs. The benefit of this approach is that
    each container runs in isolation. Resources consumed by the containers can be
    monitored, controlled, and managed. However, unlike virtual machines, these containers
    are very lightweight and easy to build, package, and start. They start extremely
    fast because there''s no operating system to bootstrap like a virtual machine.
    The major disadvantage of this approach is the technological maturity. With the
    advent of Docker in 2013, containers are far more accessible to mainstream teams
    now; however, the technology is still evolving to address issues such as security,
    managing containers at scale, and so on.


    For simplicity, we will deploy our new microservices in the same Tomcat server
    where we have hosted the monolithic application. In Chapter 13, we''ll take these
    microservices and package them in a Docker container and deploy them as individual
    microservices.


    Following are the steps to deploy the helpdesk application with the new microservices:


    +   1. We need to point to the newly created microservices from our existing monolithic
    application. To do so, modify the property file, Application.properties, by changing
    the endpoints for our web services, as follows:


    ```

    endpoints.serachEndpoint=

    http://host:port/search-svc/rest/SerachService/search

    points.getCatalog=

    http://host:port/ticketing-svc/rest/CatalogService/getCatalog

    ```'
