    Now let''s use this Dockerfile to build a Docker image for the product catalog
    service.


    # Building the Docker Image


    Using the Dockerfile we just created, enter the following command on the command
    line:


    ```

    >> docker build -t catalog-svc:1.0

    ```


    Let''s review what the command does:


    +   - docker build is the command used to create a Docker image.

    - t is the option to specify a name for the created image (in our case, catalog-svc:1.0),
    which includes ImageName:<Tag>.

    - The ending tells the Docker build command to use the files in the current directory.


    To run this command, you need to do the following:


    +   1. Make sure that Docker is installed.

    2. Create a directory that has the Dockerfile we created and the WAR file for
    the catalog service.

    3. Run the Docker build command from the directory created in step 2.


    Now that we have created the Docker image for the product catalog service, we
    are ready to use this image and spin up the catalog service (inside Docker containers)
    on the fly. Before we can spin up our catalog service, we need infrastructure
    where these services can run. We discussed Mesos and Marathon in previous chapters,
    and we''ll be using it to spin up our microservices.'
