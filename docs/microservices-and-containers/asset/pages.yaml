  md: '# Preface


    As always, the technology sector is in the midst of momentous transitions—the
    Internet of things, software-enabled networking, and software as a service (SaaS),
    to name a few. Because of these innovations, there is a large demand for platforms
    and architectures that can improve the process of application development and
    deployment. Companies of many sizes now require frameworks and architectures that
    can easily simplify their applications'' update processes, allowing their latest
    versions to go to market more frequently without adding undue overhead to the
    development and deployment teams.


    This transition, like many of its cousins, yet many technologies and frameworks
    in the space have already come and gone. The winners remain standing, however,
    continuing to improve the world''s software by allowing its developers—us to create
    new applications and update existing ones with more agility than ever before.
    Two such winners? Microservices and containers, red-hot topics that, in my opinion,
    also possess staying power. Compared to the monolithic approach, the most common
    way of developing and deploying applications, microservices simplify those processes,
    especially with large projects that require multiple teams and increasingly long
    code. In such cases, even a small change in the code can cause serious delays.
    Microservices can handle today''s large codes by incorporating agility and scalability
    into application development and deployment, all within a proven paradigm.


    That''s where this comes in. When I first started learning about microservices,
    there were several valuable online resources (particular, I recommend the websites
    microservices.io, by Chris Richardson, and martinowler.com, by James Lewis and
    Martin Fowler), but I could not find many books that would systematically build
    a case for why a CTO or director of an engineering team should (or should not)
    make the transition to microservices. There was a clear gap in the market; the
    more I mastered the subject matter, the more I thought, “Why can''t I be the one
    to fill that gap?” Soon I was brainstorming ideas for a book of my own.


    # Is This Book for You?


    I wrote this book with two audiences in mind. The first group includes students,
    designers, and architects with experience in software and systems engineering.
    Although you might be familiar with microservices and/or containers, this is probably
    your first book dedicated entirely to them. It should provide you not only with
    a'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'comprehensive overview on the subjects but also with enough information and
    analysis to help you decide when—and when not—to utilize these technologies. Those
    of you who already have hands-on experience with microservices and/or containers
    may want to skip Parts I and II and go straight into Part III, which presents
    a fully-fledged service desk example, written by following the standard service-oriented
    architectures (SOA) methodologies. This case study discusses how one application''s
    architecture can be converted to a microservices-based architecture as well as
    how Docker containers fit into the picture. I think this deep dive under the hood
    will be a real treat and ultimately pique your interest enough to delve into the
    world of microservices and containers yourself.


    My other target readers are non-programmers coming to the topic from a business
    perspective—executives or project managers interested in learning the basics.
    Perhaps you read an intriguing blog post about microservices. Could that be the
    solution your team has been searching for but you couldn''t find a good follow-up
    book? Maybe you''ve overheard the engineers discussing Docker containers and want
    to learn how to fit in and talk the talk. Whatever your reasons, this book—essentially
    a primer check full of easy-to-understand examples and minimal jargon—should be
    ideal for any manager considering new ways to update or develop new applications
    effectively.


    This book is for anyone trying to accomplish any or all of the following:


    +   - Make his or her organization more effective in building industrial-strength
    software.

    - Transition into microservices and Docker containers while understanding they
    differ from SOA.

    - Learn microservices and Docker as part of his or her school curriculum to gain
    new, highly marketable skills.


    In short, this book is for anyone who wants to learn more about microservices
    and Docker containers. I hope you are one of them! Let''s get started.


