  md: 'The average life of a software platform built on monolithic architecture typically
    4 to 5 years and is based on the following factors:


    +   - Changing needs and customer demands driving existing functionality out of
    date

    - New business needs

    - Lack of flexibility to adjust or change existing architecture

    - Lack of scale

    - Outdated technologies

    - Slowness caused by outdated systems and increased traffic over time


    When faced with these factors, organizations start looking at new technologies
    and generally decide to invest in a new or next-generation platform. This is called
    the platform refresh cycle. From a business perspective, all the changes required
    are fair because customer expectations and delivery models change over time. What
    organizations worry about is the high investment in each cycle in terms of both
    dollars and time. The worry is fair, as it impacts the bottom-line profits of
    any organization. That''s where microservices can help. Let''s do a high-level
    analysis to prove this point.


    # Cost Components


    Let''s use a hypothetical example to look into the cost components of a monolithic
    platform''s lifecycle:


    +   - **Cost to build**. Cost to build a software platform from scratch that includes
    all the phases of the software development lifecycle, such as analysis, design,
    development, testing, and release. This is going to be the biggest investment
    of the cycle. Let''s call this cost $M_{CTB}$.

    - **Cost to maintain**. Normal care and feeding of the software platform, such
    as applying OS-level patches and maintaining infrastructure. Let''s call this
    cost $M_{CTM}$.

    - **Cost to change/update**. Cost of adding new features, bug fixing, retesting,
    regression testing, and releasing over the lifecycle of the project. Let''s call
    this cost $M_{CTU}$.'
