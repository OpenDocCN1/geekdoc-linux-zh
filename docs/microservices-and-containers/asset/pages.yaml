  md: '# Docker Create


    The docker create command creates a new writable container layer over the specified
    image and prepares it for running the specified command:


    ```

    docker create [OPTIONS] IMAGE [COMMAND]...

    ```


    The container ID is then printed as a result. This command is a little different
    from running docker run -d in that the container is never started. You can then
    use the docker start command to start the container. The ability to create a container
    but delaying start is handy when your IT team needs to set up a container configuration
    in advance so that it is ready to start when you are ready to live.


    Let''s create a new container -t1 fedora, as shown in Figure 7.39:


    ```

    docker create -t1 fedora


