- img_proc: true
  md: "As shown in UART example, resources are divided into two types: memory and\
    \ IRQ line, which indicates the memory section and IRQ line used by the module.\
    \ Also note that the id field indicates the device instance number, or -1 if device\
    \ instance number is not used.\n\nAfter the associated resources and platform\
    \ data are assigned, register the platform device to bus through\n\n```\nint platform_device_register(struct\
    \ platform_device *pdev);\nint platform_add_devices(struct platform_device **pdevs,\
    \ int ndev);\n```\n\n# 3.2 Platform driver\n\nPlatform drivers follow the standard\
    \ driver model convention and many of them are the same.\n\n```\nstruct platform_driver\
    \ {\n    int (*probe)(struct platform_device *);\n    int (*remove)(struct platform_device\
    \ *);\n    void (*shutdown)(struct platform_device *);\n    int (*suspend_late)(struct\
    \ platform_device *, struct pm_message_t state);\n    int (*suspend_early_late)(struct\
    \ platform_device *, struct pm_message_t state);\n    int (*resume_early)(struct\
    \ platform_device *);\n    int (*resume)(struct platform_device *);\n    struct\
    \ device_driver;\n};\n```\n\nThe probing function is used when a match is found\
    \ on device/driver registration to the bus to verify the existence of the device\
    \ hardware. To register the platform driver, use\n\n```\nint platform_driver_register(struct\
    \ platform_driver * drv);\n```"
  merge: -1
