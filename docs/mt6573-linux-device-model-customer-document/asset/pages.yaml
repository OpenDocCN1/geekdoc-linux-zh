  md: '# # 1 Introduction


    # ## 1.1 Software Environment


    Driver discussed in this document is designed based on Linux Kernel 2.6.35 and
    Android 2.3.


    # ## 1.2 Functionality


    By reading this document, you can understand how to register a new device driver
    to the Linux model and how to control module initialization sequence for proper
    operation of the driver.'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# # Architecture


    # ## 2.1 Architecture


    From BSP''s point of view, the entire system is composed of three parts: busses,
    drivers, and devices as below.


    ![](img/fde35a0d174d3624cc9d9b30b2222353_4_0.png)


    There are several busses in Linux, such as USB and I2C. For every bus, there may
    be several devices and drivers attached to it. The drivers serve the need of the
    matching devices and make Linux capable of operating on the devices correctly.
    The matching process will occur when a driver or device is registered to the bus,
    which will be explained later.


    # ## 2.2 Device/Driver Matching Process


    When a device or driver is registered with the specified bus, the device/driver
    matching process occurs. When a device is registered to the bus, all the drivers
    on the bus will be scanned to see whether there are matching drivers that can
    serve the newly added device, vice versa.


    For every bus, there is a matching function attached to it. The matching function
    will be used to scan all the devices/drivers for the first step. The matching
    rules are different for different busses, then the name or capacity of the device/driver.
    If a matching device/driver is found, then the probing function of the driver
    will be used to verify that the specified device hardware actually exists and
    check whether the required resource can be acquired from the system so that the
    driver can service the device property. After this, the driver can start serving
    the device.'
