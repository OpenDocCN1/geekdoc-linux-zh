- img_proc: true
  md: '# 4 Module Initialization Sequence


    In fact, a device/driver can co-operate correctly after probing, and the module
    initialization sequence emphasizes on the sequence which the probing functions
    are called, not the module initialization function itself.


    In the design of ALPS, driver registration is done in driver module initialization
    function, which is distributed among all the device drivers, and all the device
    registration is put in a common place, that is, mt6573_board_init in alps/mediatek/platform/mt6573/kernel/core/mt6573_devs.c
    to control the probing sequence of all the platform device/driver in the system.


    On the basic knowledge developed in the previous sections, it is clear that the
    probing function will be called when a match between a device and a driver is
    found. To make the claim that mt6573_board_init is registered before mt6573_board_init
    is called. And the probing sequence will be controlled by the device registration
    sequence. Also note that to ''reduce footprint, data that is unnecessary after
    initialization should be put at module initialization function, not in probing
    function. Only data that is is needed at runtime should be in probing function.


    | | |

    |---|---|

    | Device1 | |

    | platform_device_register(device1) | probe (driver1) |

    | Device2 | |

    | platform_device_register(device2) | probe (driver2) |

    | Device3 | |

    | platform_device_register(device3) | probe (driver3) |


    To postpone driver probing to a later time, either postpone device registration
    or driver registration will.'
