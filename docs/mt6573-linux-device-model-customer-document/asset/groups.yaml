- md: '

    # 4 Module Initialization Sequence


    In fact, a device/driver can co-operate correctly after probing, and the module
    initialization sequence emphasizes on the sequence which the probing functions
    are called, not the module initialization function itself.


    In the design of ALPS, driver registration is done in driver module initialization
    function, which is distributed among all the device drivers, and all the device
