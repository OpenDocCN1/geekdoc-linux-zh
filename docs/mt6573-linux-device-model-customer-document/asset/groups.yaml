    \ 8\n\n# Lists of Tables and Figures\n\n# 1 Introduction\n\n## 1.1 Software Environment\n\
    \nDriver discussed in this document is designed based on Linux Kernel 2.6.35 and\
    \ Android 2.3.\n\n## 1.2 Functionality\n\nBy reading this document, you can understand\
    \ how to register a new device driver to the Linux model and how to control module\
    \ initialization sequence for proper operation of the driver.\n\n# Architecture\n\
    \n## 2.1 Architecture\n\nFrom BSP's point of view, the entire system is composed\
    \ of three parts: busses, drivers, and devices as below.\n\n![](img/fde35a0d174d3624cc9d9b30b2222353_4_0.png)\n\
    \nThere are several busses in Linux, such as USB and I2C. For every bus, there\
    \ may be several devices and drivers attached to it. The drivers serve the need\
    \ of the matching devices and make Linux capable of operating on the devices correctly.\
    \ The matching process will occur when a driver or device is registered to the\
    \ bus, which will be explained later.\n\n## 2.2 Device/Driver Matching Process\n\
    \nWhen a device or driver is registered with the specified bus, the device/driver\
    \ matching process occurs. When a device is registered to the bus, all the drivers\
    \ on the bus will be scanned to see whether there are matching drivers that can\
    \ serve the newly added device, vice versa.\n\nFor every bus, there is a matching\
    \ function attached to it. The matching function will be used to scan all the\
    \ devices/drivers for the first step. The matching rules are different for different\
    \ busses, then the name or capacity of the device/driver. If a matching device/driver\
    \ is found, then the probing function of the driver will be used to verify that\
    \ the specified device hardware actually exists and check whether the required\
    \ resource can be acquired from the system so that the driver can service the\
    \ device property. After this, the driver can start serving the device.\n\n![](img/fde35a0d174d3624cc9d9b30b2222353_5_0.png)\n\
    \n# Platform Bus\n\nPlatform bus is a pseudo-bus in Linux and is used to connect\
    \ devices on busses with minimal infrastructure, like those used to integrate\
    \ peripherals on many system-on-chip processors, which is extensively used in\
    \ Linux package provided by Mediate. The matching function of platform bus matches\
    \ devices and drivers by name.\n\n# Platform device\n\nPlatform devices are those\
    \ that appear as autonomous entities in the system, as controllers integrated\
    \ into system-on-chip platforms.\n\n```\nstruct platform_device {\n    const char\
    \ *name;\n    u32 id;\n    struct device *dev;\n    u32 num_resources;\n    struct\
    \ resource *resource;\n};\n```\n\nPlatform device holds a pointer to the resource\
    \ array and may contain the number of elements in the resource array. The resource\
    \ may be an IRQ line, a section of memory, etc. Sometimes the fields of platform\
    \ device may not be enough for device initialization. In this case, platform data\
    \ in dev field is a good candidate for adequate device information carrier. The\
    \ following is an example:\n\n```\nstruct platform_device android_usb_device =\
    \ {\n    .name = \"android_usb\",\n    .id = -1,\n    .dev = {\n        platform_data\
    \ = &android_usb_pdata,\n    }\n};\n```\n\n```\nstruct android_usb_platform_data\
    \ android_usb_data = {\n    .vendor_id = 0x0bb4,\n    .product_id = 0x0001,\n\
    \    .product_name = \"Android Phone\",\n    .manufacturer_name = \"MediaTek\"\
    ,\n    .serial_number = \"MT123456789\",\n};\n```\n\n# MEDIATEK\nMT6573\nConfidential\
    \ B\n\n```\nstruct android_usb_platform_data {\n    /* USB device descriptor fields*/\n\
    \    __u16 vendor_id;\n\n    /* Default product ID. */\n    __u16 product_id;\n\
    \n    /* Product ID when adb is enabled. */\n    __u16 adb_product_id;\n\n   \
    \ __u16 version;\n\n    char *product_name;\n    char *manufacturer_name;\n  \
    \  char *serial_number;\n\n    /* number of LUNs for mass storage function */\n\
    \    int nlnuns;\n};\n```\n\nPlatform data of arbitrary type can be used to attach\
    \ device information to platform device as shown.\n\nAnother example is UART,\
    \ which demonstrates the usage of resource.\n\n```\nstatic struct resource mt6573_resource_uart1[]\
    \ = {\n    {.start = UART1_BASE,\n     .end = MT6573_BASE + MT6573_UART_SIZE -\
    \ 1,\n     .flags = IORESOURCE_MEM},\n    {.start = MT6573_UART1_IRQ_LINE,\n \
    \    .flags = IORESOURCE_IRQ},\n};\n```\n\n```\nstatic struct platform_device\
    \ mt6573_device_uart[] = {\n    .name = \"mt6573-uart\",\n    .id = 0,\n    .num_resources\
    \ = ARRAY_SIZE(mt6573_resource_uart1),\n    .resource = mt6573_resource_uart1,\n\
    };\n```\n\nMediaTek Confidential\n© 2011 MediaTek Inc.\nThis document contains\
    \ information that is proprietary to MediaTek Inc.\nUnauthorized reproduction\
    \ or disclosure of this information in whole or in part is strictly prohibited.\n\
    Page 8 of 10\n\nAs shown in UART example, resources are divided into two types:\
    \ memory and IRQ line, which indicates the memory section and IRQ line used by\
    \ the module. Also note that the id field indicates the device instance number,\
    \ or -1 if device instance number is not used.\n\nAfter the associated resources\
    \ and platform data are assigned, register the platform device to bus through\n\
    \n```\nint platform_device_register(struct platform_device *pdev);\nint platform_add_devices(struct\
    \ platform_device **pdevs, int ndev);\n```\n\n# 3.2 Platform driver\n\nPlatform\
    \ drivers follow the standard driver model convention and many of them are the\
    \ same.\n\n```\nstruct platform_driver {\n    int (*probe)(struct platform_device\
    \ *);\n    int (*remove)(struct platform_device *);\n    void (*shutdown)(struct\
    \ platform_device *);\n    int (*suspend_late)(struct platform_device *, struct\
    \ pm_message_t state);\n    int (*suspend_early_late)(struct platform_device *,\
    \ struct pm_message_t state);\n    int (*resume_early)(struct platform_device\
    \ *);\n    int (*resume)(struct platform_device *);\n    struct device_driver;\n\
    };\n```\n\nThe probing function is used when a match is found on device/driver\
    \ registration to the bus to verify the existence of the device hardware. To register\
    \ the platform driver, use\n\n```\nint platform_driver_register(struct platform_driver\
    \ * drv);\n```\n"
