  \ |\n\n# 第 6 章\n\n# 渗透测试生命周期简介\n\n本章将引导读者了解典型渗透测试的五个阶段。\n\n### 关键词\n渗透测试生命周期；渗透测试阶段；渗透测试步骤\n\
  \n## 本章内容\n![ent](img/FilledVerySmallSquare_9642.gif) 侦察\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 扫描\n![ent](img/FilledVerySmallSquare_9642.gif) 漏洞利用\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 维持访问\n![ent](img/FilledVerySmallSquare_9642.gif) 报告\n\n## 章节概述与核心学习点\n– 本章将介绍渗透测试生命周期的五个阶段\n\
  \n## 生命周期简介\n大多数人认为，渗透测试人员（或黑客）需要做的只是坐在电脑前，开始输入一串晦涩的代码，然后砰的一声，世界上任何一台电脑都会瞬间被打开。这种基于好莱坞传奇的刻板印象与事实相径庭。该领域的专业人士在发现和利用计算机系统漏洞时，使用的方法非常严谨。随着时间的推移，出现了一个经过验证的框架，被专业道德黑客所使用。该框架的四个阶段引导渗透测试人员通过实证方式利用信息系统，并生成一份详尽的文档化报告，以便在需要时重复执行测试任务的部分内容。这一过程不仅为测试人员提供了结构，还被用于制定渗透测试活动的高级计划。每个阶段都建立在上一步的基础上，并为随后的步骤提供详细信息。虽然该过程是顺序的，但许多测试人员会返回早期阶段，以澄清发现的情况并验证结果。\n\
  \nPatrick Engebretson 在他的书《破解与渗透测试基础》（*The Basics of Hacking and Penetration Testing*）中明确定义了过程中的前四个步骤。这些步骤是\
  \ `Reconnaissance`（侦察）、`Scanning`（扫描）、`Exploitation`（漏洞利用）和 `Maintaining Access`（维持访问）。本书使用了相同的步骤，但在\
  \ Patrick 的工作基础上增加了一个额外的步骤 `Reporting`（报告）。此外，与 EC-Council 在其热门的认证道德黑客（C|EH）课程中定义的五阶段过程相比，许多人注意到该过程的最后一个阶段\
  \ `Covering Tracks`（掩盖踪迹）缺失了。这是刻意为之，专注于早期阶段并包含一个关于报告的章节，这个话题在许多关于该主题的书书中都被省略了。本书与之前的书籍相比，还删除了生命周期的循环图，改为改为更具线性的可视化性的，这符合道德黑客在正常任务中通常遇到的情况。这将从对目标信息系统的侦察开始，以渗透测试人员或测试组长向信息系统领导层汇报并提交发现情况的报告结束。这一线性过程如图图\
  \ 5.1\n图 5.1 渗透测试生命周期。\n\n本章将画出每个阶段的基本视图，并在专门介绍每个阶段的章节中进行更详细的描述。此外，将在后续章节中介绍每个阶段的常用工具。通过这种，读者不仅能理解生命周期的各个阶段，还能了解安全领域的工程师最可能先使用哪些工具。这些章节将向读者介绍工具，但不会面面俱到，实际上仅触及每种工具或技术在协助进行此类测试方面能做什么的表面。许多工具或技术都有整本书的书（有时是多本书）专门介绍它们的正确用法和应用。\n\
  \n## 第 1 阶段：侦察\n在一个灯光昏暗的小房间里，分析师和官员正在扫描和检查敌对领土的地图。在房间的另一侧，其他人正疯狂地观看全球各电视频道并做记录。房间里的最后一小组正在对被调查目标的所有情况准备详细的评估。虽然这一场景详细描述了对可能目标进行军事侦察时通常会做什么，但这与渗透测试人员在渗透测试生命周期侦察阶段所做的事情是类似的。\n\
  \n这说明了渗透测试生命周期中侦察阶段的工作类型。该阶段侧重于学习关于目标网络和组织的一切信息。这是通过搜索互联网和对目标网络的可用连接进行被动扫描来实现的。在此阶段，测试人员并没有实际渗透防御，而是尽可能地识别并记录关于目标的所有信息。\n\
  \n## 第 2 阶段：扫描\n想象在敌后方深处的一个山头上，一名士兵蜷缩在茂密的灌木丛和树林中。传回的报告告知其他人关于被观察营地的位置、营地的任务以及每栋建筑内正在进行的工作类型。报告还记录了进出营地的路线以及可见的安类型。\n\
  \n示例中的士兵的任务是在侦察阶段通过分析定义的。这对于渗透测试生命周期的第二阶段也是如此。测试人员将利用在第一阶段获得的信息开始实际扫描目标网络和信息系统。使用此阶段的工具，将对信息系统的网络和系统基础设施进行更具体的定义，以便进行利用。在此阶段获得的信息将在漏洞利用阶段使用。\n\
  \n## 第 3 阶段：漏洞利用\n四名士兵穿过一片开阔的地野，月亮细如新弯且被云层遮挡，但士兵们看到一切充满了诡异的绿光。他们冲向建筑，穿过栅栏的缝隙，然后通过一扇敞开的后门。在目标处只待了片刻，他们就撤了，带着有关未来部队动向和未来几个月计划的关键信息。\n\
  \n这同样符合道德黑客在漏洞利用阶段将做的事情。该阶段的意图是利用系统漏洞和证明的技术，在不被发现的情况下进入目标系统并带回信息。\n\n## 第 4 阶段：维持访问\n\
  根据突击小组提供的图纸，一组精明的工程师从之前获取关键信息的房间下方树林深处挖掘。该隧道的目的是提供进入该房间的便利通道，以便持续利用敌人。对于测试人员来说也是如此，一旦系统被利用，系统上就会留下后门和根内核，以便以后访问。\n\
  \n## 第 5 阶段：报告\n突击小组长站在将军和海军将面前，解释突击的细节。每一步都进行了非常详细的解释，扩展了允许利用发生的每个细节。渗透测试人员也必须编写详细报告，解释黑客过程中的每一步、被利用的漏洞以及实际上被破坏的系统。此外，在许多情况下，可能需要团队的一员（有时是更多）向目标信息系统的高级领导和技术人员提供详细汇报。\n\
  \n## 总结\n\n\n\n\n\n接下来的章节将详细解释这些阶段中的每一个阶段。每一章都将提供有关每个阶段所用常用工具的基础信息。通过本本书详述的过程，读者将理解所解释阶段的目的和优势，以及该阶段最常用的工具。\n\
  \n# 第 7 章\n\n## 侦察 (Reconnaissance)\n\n本章将介绍渗透测试生命周期的第一阶段：侦察。这包括获取已知的目标信息并扩展到包含可以获取的所有信息，通常使用开源工具和查询获取组织和系统的信息，以便使生命周期的后续阶段更加高效。\n\
  \n### 关键词\n侦察；Google；Google 黑客（Google Hacking）；HPing；LinkedIn；Facebook；GHDB；Google\
  \ 黑客数据库（Google Hacking Database）；足迹追踪（footprinting）；邮件跟踪\n\n## 本章内容\n- ![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 网站镜像\n- ![ent](img/FilledVerySmallSquare_9642.gif) Google 搜索\n- ![ent](img/FilledVerySmallSquare_9642.gif)\
  \ Google 黑客\n- ![ent](img/FilledVerySmallSquare_9642.gif) 社交媒体\n- ![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 招聘网站\n- ![ent](img/FilledVerySmallSquare_9642.gif) DNS 及 DNS 攻击\n\n## 概述与核心要点\n\
  本章将解释渗透测试生命周期侦察阶段的基础知识。这一过程将帮助道德黑客发现有关目标组织和计算机系统的信息。这些信息稍后可用于与计算机交互。\n\n### 引言\n\
  正如军事规划者在制定战斗计划之前会严密分析所有可用信息一样，成功的渗透测试人员必须在进行成功的渗透测试之前，严密分析所有可以获取的信息。很多时候，这些信息可以通过使用\
  \ Google 等其他网站（包括专注于信息共享和社交媒体的网站）搜索互联网获得。在互联网名称服务器上也可以找到信息，这些服务器为用户的浏览器提供引导。邮件信息可以通过组织进行跟踪，甚至回执邮件也能帮助渗透测试人员。创建并检查目标网站的离线副本可以提供宝贵的信息源，并在测试执行规则（ROE）允许的情况下，稍后可用作为社会工程任务的工具。\n\
  \n该阶段始于测试团队对目标知之甚少。提供给团队的细节程度不等，从仅知道组织名称和可能的网站地址，到详细且具体的系统信息，包括 IP 地址空间和 ROE 中定义的以限制或界定测试活动范围的技术。ROE\
  \ 还可能限制测试团队开展活动的能力，包括禁止社会工程和破坏性活动，如拒绝服务（DoS）和分布式拒绝服务（DDoS）攻击。\n\n该阶段的目标是查出你可以获得多少关于组织的信息。\n\
  \n关于组织应该确定的某些事项包括：\n- 组织结构，包括详细的高层、部门和团队组织架构；\n- 组织基础设施，包括 IP 空间和网络拓扑结构；\n- 使用的技术，包括硬件平台和软件包；\n\
  - 员工电子邮件地址；\n- 组织合作伙伴；\n- 组织设施的物理位置；\n- 电话号码。\n\n### 可信代理 (Trusted Agents)\n可信代理可能是聘用渗透测试团队的人，或者是组织指定的个人，他们能够回答有关项目的问题，并且不会向整个组织透露正在进行渗透测试的事实。\n\
  \n## 从目标自己的网站开始\n目标自己的网站拥有开发项目画像所需的大量信息。例如，许多网站会自豪地展示组织架构图和关键领导人的简介。这些应作为开发目标画像的基础，如果既定\
  \ ROE 允许，有关组织关键领导人的信息可以用于在社交媒体网站上进一步获取信息，并用于社会工程学。\n\n许多组织网站还包含职业或工作机会页面。该页面在确定组织使用的技术时可能是不可或缺的。例如，熟悉\
  \ Active Directory 和 Windows Server 2012 的系统管理员招聘列表将是该组织至少在使用 Windows Server 2012\
  \ 的强有力指示。同样，熟悉或精通 Windows Server 2003 或 2000 管理的管理员招聘列表也应该让任何渗透测试人员警觉，因为这些平台比较新的操作系统更容易受到攻击。\n\
  \n每个网站都应该检查是否有指向网页邮箱的链接，如果发现，则应对其进行评估。如果点击链接后显示 Outlook Web Access 页面，可以很好假设正在使用\
  \ Microsoft Exchange 服务器处理电子邮件。如果显示 Office 365 页面，则说明邮件服务是外包的良好指标，且根据大多数 ROE，邮件服务器可能在边界范围之外。Google\
  \ 网页邮箱也是如此；但这些都应该在项目开始前定义的边界中详细说明。如果对跨越边界的可能性存在疑问，应使用项目的可信代理来解决该问题。\n\n## 网站镜像\n\
  有时，复制组织的整个网站进行离线评估更为有效。这可能是为了使用自动化工具搜索术语，或者仅仅是为了在当前网站上的敏感信息发生更改时有一个备份。仅仅拥有网站副本以便在离线时继续侦察也是很有用的。像\
  \ `wget` 命令行工具可以从网站复制所有的 HTML 文件并存储在本地硬盘上。Kali Linux 默认安装了 `wget`，这是一个简单易用的工具。在终端窗口中使用以下命令行，将下载整个网站的所有\
  \ HTML 文件。需要注意的是，`wget` 不复制此类 PHP 创建的页面服务器端程序。\n\n```\nwget –m –p –E –k –K –np -v\
  \ http://foo.com\n```\n\n\n\n\n文件下载后，必须确保它们不会供他人查看，例如重新发布网站，因为这将构成对版权法的违反。\n\n##\
  \ Google 搜索\n\nGoogle 搜索技术利用高级运算符在 Google 上进行详细搜索。对于刚接触 Google 搜索的人，可以从位于[`www.google.com/advanced_search`](http://www.google.com/advanced_search)的\
  \ Google 高级搜索页面开始，如图图 7.1 所示。该页面将帮助新手进行搜索。页面的上半部分如图 7.2 所示，有助于通过包含和排除单词、术语和数字来查找网页。页面的下半部分将帮助使用\
  \ Google 运算符缩小结果。搜索者可以使用此页面上的任何字段组合来构建将要使用的搜索字符串。使用多个一个字段将将生成一个更复杂但更具针对性的搜索字符串。\n\
  \n![image](img/F000070f07-01-9780124077492.jpg)\n\n图 7.1 Google 高级搜索页面。\n\n![image](img/F000070f07-02-9780124077492.jpg)\n\
  \n图 7.2 Google 高级搜索（续）。\n\n### 包含所有单词\n\n此字段可找到包含对话框中输入单词的页面，无论这些单词位于网页的什么位置，事实上，这些单词不需要按照输入的顺序出现，也不需要在一起，只要出现在网页的某处即可。要进行此类搜索，在对话框中输入若干术语并点击“高级搜索”按钮，通过这样做，高级搜索页面中输入的单词将被转换为搜索字符串，然后发送到\
  \ Google，就像它们是直接在 Google 主页的搜索框中输入的一样。\n\n### 确切的单词或短语\n\n在此选项右侧的字段中输入搜索术语，将使 Google\
  \ 搜索引擎按照输入的精确顺序和顺序找到单词或短语。与“包含所有单词”搜索不同，只有以精确顺序且在一起包含该短语或单词的网页才会被包含在结果集中。这种搜索通过将搜索术语置于引号内来实现。\n\
  \n### 这些单词中的任何一个\n\n使用此字段时，Google 搜索将找到包含任何一个单词的页面。与“包含所有单词”字段不同，返回的页面不必包含输入的所有单词。这种搜索通过在搜索框中的术语之间放置\
  \ `OR` 连接符来实现。\n\n### 不包含单词中的任何一个\n\n在此文本框中输入的单词将用于从 Google 搜索结果中排除页面。任何包含输入单词的页面都将从结果集中移除。这种搜索通过在不想出现在结果集中的单词或术语前面加上减号\
  \ `-` 来实现。\n\n### 数字范围\n\n通过使用该区域两个文本字段，搜索将找到具有输入范围内数字的页面。可以通过包含测量单位来增强此类搜索，例如磅\
  \ (`lb`)、英里或毫米 (`mm`) 或货币如 `$` 或 `€`。搜索可以在主搜索框中通过在数字之间放置两个点来进行。\n\n### 语言\n\n通过下拉选择器选择一种语言，结果页面将主要为所选语言。此搜索限制器有助于将结果缩小到目标所在地区最常用的语言编写的页面，例如，对一家德国公司进行渗透测试的团队通过关注德国网站，可以更好地搜索与此特定项目相关的信息。\n\
  \n### 地区\n\n通过下拉选择器选择一个地区，结果页面将来自所选地区发布的网页。如果未从语言下拉菜单中进行选择，则选择地区后的搜索结果将包含在该地区发布的页面，无论其使用的主要语言是什么。通过同时选择语言和地区，可以进行更具针对性的搜索。\n\
  \n### 最后更新时间\n\n通过在这些区域的下拉菜单中选择时间限制，只有在所选时间范围内更新的页面会被包含在搜索中。这将确保旧页面不会被包含在结果集中，并可确保结果页面位于关键事件之后。例如，如果渗透测试关注的组织最近与另一个组织合并或采用了新技术，可以将搜索限制在自事件发生以来的时间，以确保搜索结果更具相关性。\n\
  \n### 站点或域名\n\n此文本框在缩小目标搜索结果时可能是最有用的工具之一。例如，对政府机构的搜索可能受益于将结果限制在仅 `.gov` 域名上，而对 Foo\
  \ 公司的搜索可能受益于将结果限制在 `foo.com` 域名上。此类限制也可以在 Google 主搜索搜索文本框中进行，使用搜索限制器 `site:` 后跟应在结果集中返回的域名或多个域名，例如使用\
  \ `site:foo.com` 将结果限制为仅来自 `foo.com` 域名的页面。\n\n### 词汇\n\n通过此下拉菜单，可以将搜索查询针对页面的特定部分。显然，选择“页面的任何位置”将在整个网站页面上运行搜索，对搜索查询的目标位置没有实际限制。\n\
  \n使用“在页面标题中”进行搜索将仅针对网页的标题。具体而言，页面标题是显示在网页浏览器标签页中的网页部分。这种搜索也可以在 Google 主页上通过在搜索框中使用\
  \ `intitle:` 运算符进行。\n\n使用限制符“在页面正文中”将搜索限制为仅限页面文本，并排除图像、文档和页面结构（如标题）等内容；然而，如果这些项目被写在页面正文中，搜索将在结果中返回这些项目。例如，如果页面正文中引用了图像，该图像将出现在搜索结果中，对于文本中的图像标记和链接也是如此。在\
  \ Google 搜索框中使用 `intext:` 运算符等同于从下拉菜单中选择此选项。\n\n使用“在页面 URL 中”将搜索限制为页面的统一资源定位符 (URL)。URL\
  \ 是出现在网页浏览器地址栏中的网页地址。最后，使用“在指向页面的链接中”将找到链接到搜索标准的页面。这种搜索可以在 Google 主页上使用 `inurl:`\
  \ 运算符进行。\n\n#### 安全搜索\n\n安全搜索有两个选项：“显示最相关结果”和“过滤显性内容”。过滤显性设置可以减少搜索结果中的性显性视频和图像。选择显示最相关结果将不会过滤结果中的性显性内容。\n\
  \n#### 阅读级别\n\n\n\n阅读分级选项将根据搜索返回的网页中文本的复杂程度对结果进行过滤。“不显示阅读分级”将在不应用阅读分级过滤的情况下执行搜索。“在结果中标记阅读分级”选项将显示所有结果；但每个页面的阅读分级将在搜索结果中显示。Google\
  \ 算法不如其他分级阅读工具（包括蓝蓝指数）那样科学或精细，但在将结果过滤为基础、中级和高级这三类方面非常高效。这在进行渗透测试时非常有帮助，因为可以将结果集中在目标人员的阅读分级上。例如，对某个科学组织的搜索可以限制在高级阅读分级的页面上。尝试三个级别可能有助于看到不同的搜索结果，并且可以从使用基础阅读分级的搜索中获得重要信息。\n\
  \n## 文件类型\n\n文件类型可以是渗透测试人员可以使用最重要的搜索之一。此设置包含特定文件类型的搜索结果，例如 Microsoft Word 文档的 `.doc`\
  \ 和 `.docx`，Adobe 文档的 `.pdf`。许多时候用户会使用不同的文件类型存储不同的信息。例如，用户名、密码和其他类型的账户信息通常存储在扩展名为\
  \ `.xls` 或 `.xlsx` 的电子表格中。下拉列表提供了许多常见文件类型，在基础 Google 搜索框中，可以使用 `filetype:` 操作符使用任何扩展名，例如\
  \ `filetype:xls`。\n\n## 使用权\n\n使用权根据版权和其他重用限制，根据内容的重用能力限制搜索结果。通过选择“免费使用、共享或修改”，返回的结果将是可以重用的内容，但带有规定内容如何进行重用的限制条件（例如不能修改内容，且大多数不需要费用）。“免费使用、共享或修改”将在搜索结果中返回在许可限制内可以修改的页面，同样，结果将允许正常情况下免费分发内容。选择中带有“商业”一词的选项与不带该词的选项功能相同，但返回的结果可以用于商业用途。\n\
  \n## 组合高级 Google 搜索\n\n在 Google 高级页面上单独使用这些字段可以返回一些令人惊讶的搜索结果，但组合使用许多此类字段将提高渗透测试人员发现相关信息的方法。例如，假设\
  \ Foo International（一家美国公司）一个月前与另一家公司合并，并向你的团队请求渗透测试。在这样的过渡时期，会创建许多文档来帮助各公司的成员进行过渡，员工可能会将组织图发布到公司网站上。一种可能的搜索可以使用以下字段和术语：\n\
  \n- 准确匹配此词或短语：organizational chart\n- 语言：English\n- 地区：United States\n- 最后更新：过去一个月\n\
  - 站点或域名：foo.com\n- 文件类型：pdf。\n\n然后可以通过添加或删除搜索字段或更改选项对结果进行进一步精炼。例如，将文件类型更改为 PowerPoint\
  \ (`.ppt`) 或完全删除文件类型可能会返回所需的结果。\n\n## Google Hacking\n\nGoogle Hacking（Google 破解）是一种由\
  \ Johnny Long 开创并闻名的技术，它通过在互联网搜索中使用特定的 Google 操作符和术语，利用 Google 搜索引擎返回有价值的信息。这种技术专注于使用具有特定针对性的表达式来查询\
  \ Google 数据库，以收集有关个人和组织的信息。这种技术对前述的 Google 搜索增强了其结果。\n\nGoogle Hacking 大量利用高级操作符和链接选项来创建可以在\
  \ Google 搜索引擎中运行的针对性查询。许多许多搜索将针对特定技术（如 Web 管理服务）的汇信息，其他搜索将针对用户凭据。已有几本优秀的书籍充分解释了\
  \ Google Hacking，最著名的是 Johnny Long 编写并由 Syngress 出版的 *Google Hacking for Penetration\
  \ Testers*。\n\n## Google Hacking Database\n\n大量的 Google Hacking 搜索查询字符串已编译进 Google\
  \ Hacking Database (GHDB)。原始数据库位于 `http://www.hackersforcharity.org/ghdb/`，Offensive\
  \ Security 也有位于 `http://www.offensive-security.com/community-projects/google-hacking-database/`\
  \ 的 GHDB，它对原始数据库进行了扩展，并创造了“Googledorks”一词，作为被 Google 暴露的无能或愚蠢者的绰号 [[1]](#CHP007.html_BIB1)。在本文写作时，由\
  \ Offensive Security 维护的 GHDB 包含超过 3350 个分为 14 类的 Google Hacks。其中 160 多个搜索字符串对于查找包含密码的文件非常有帮助。以下是一个尝试查找\
  \ Cisco 密码的搜索字符串示例。\n\n```\nenable password | secret \"current configuration\" -intext:the\n\
  ```\n\n运行此搜索返回了近一百五十万个站点，虽然返回的一些文件可能不包含实际密码，但大量结果实际上包含密码列表。可以通过添加额外的操作符（如下站点或域名操作符）对此搜索进行进一步精炼以满足个人渗透测试的需求。\n\
  \n```\nenable password | secret \"current configuration\" -intext:the site:foo.com\n\
  ```\n\n## 社交媒体\n\n社交媒体已成为许多人生活中不可或的一部分。这一事实使社交媒体成为渗透测试生命周期此阶段收集信息的宝库。物理世界中被人们严密保护的信息，这些人会在\
  \ Facebook、Instagram、Twitter、LinkedIn 等其他社交媒体网站上自由发布，通过这些站点可以开发目标位置工作人员的完整个人档案。这对于社会工程活动很有帮助。\n\
  \nLinkedIn 在开发组织图方面特别有用。LinkedIn 专为连接专业人士而建立，通常能帮助填充目标个人档案中的空白，包括更清晰的组织图，甚至是电子邮件地址列表，尽管后一个步骤通常需要社会工程，因为电子邮件地址在\
  \ LinkedIn 上并不公开显示。如果授权规则（ROE）允许社会工程，那么寻找曾在该机构工作过的人员是信息的极佳来源。最后，LinkedIn 开始在其网站上发布职位机会，这使得能够利用这些列表来了解目标组织使用的技术。\n\
  \n## 创建替身\n\n\n\n\n\n民间传说中的“分身”（doppelganger）是一个个体的幽灵副本。在社交媒体世界中开始进行侦察之前，开发一个虚拟身份（persona）是一种常见的做法。使用安全专家或渗透测试人员的配置对目标进行研究通常是无效。如果渗透测试人员能够通过社交媒体与组织内的成员建立社交互动，那么如果该测试人员拥有一个声称曾在目标组织工作过，或与其试图在\
  \ `LinkedIn` 上联系的 CEO 就读同一所大学的虚拟身份，将会有效得多。\n\n显然，渗透测试人员必须警惕不要完全接管真实人的身份，这种行为可能导致某些人认为发生了身份盗窃，但两个人名字相似的情况并不罕见。例如，创建一个名为\
  \ `John Smith`、就读于 `威斯康星大学` 且背景完全虚造的虚拟身份，与盗取那个就读这里的真实 `John Smith` 的身份并不是一回事。无论如何，请确保你的虚拟身份不会演变成身份盗窃或医疗欺诈。这意味着，在其他方面，不要填写寄有你虚拟身份名称的信用卡申请表，也不要使用该身份签署法律协议。\n\
  \n使用分身的界限应该在项目早期明确规定，如果允许进行社会工程学，应该开发一个在社会工程学介入时有效的分身。在填写社交媒体网站注册时，渗透测试人员应注意使用策略，以确保在使用分身身份时没有违反政策、规则或在最坏的情况下违反法律。\n\
  \n## 职位网站\n\n搜索招聘公告板（如 `Monster`、`Career Builder` 和 `Dice`）有时也能带来有趣的发现。就像目标自己的网站一样，这些网站也可以揭示目标站点所使用的技术。在这些页面中搜索相关组织，通常会得到需要空缺的职位，帮助渗透测试人员更好地了解目标。近年来，许多公司已开始意识到这种弱点，并现在招聘公告的组织或公司区域中，将职位列为“公司机密”或其他声明。\n\
  \n## DNS 与 DNS 攻击\n\n域名系统服务（简称 `DNS`）为互联网提供地址帮助。通常情况下，人们更容易记忆和使用如 `Google.com` 这样的名称，而计算机使用如\
  \ `173.194.46.19`（Google 的地址之一）这样的数字则更为方便。互联网的层次结构也使得使用数字八字节变得更加高效。这产生了一个问题：对人类而言的最佳地址方案与对计算机的最佳方案并不匹配。域名服务器通过作为计算机与人类之间的翻译器来帮助解决这个问题。\n\
  \n这些域名服务器按照层次结构设置，其中顶级域名（`TLD`）服务器负责如 `.com`、`.gov`、`.edu` 等主域名。在域名服务器层次结构的另一端，每个网络都可以有自己的域名服务器，允许通过名称而不是\
  \ `IP address` 访问本地服务和计算机。\n\n理解域名服务器基本功能最简单的方法是查看计算机和网络浏览器如何与整个域名服务器系统交互和工作。从本地域名服务器到根服务器（即\
  \ TLD 之上的域名服务器），每个域名服务器都可以查询其上方的下一个域名服务器，或向其下方的域名服务器提供信息，如图 7.3\n\n图 7.3 过滤 Google\
  \ 搜索。\n\n域名服务器包含大量有用信息，远超网页。例如，域名服务器将包含该域的邮件服务器或 `MX 记录`、其他命名计算机或“A”记录以及其他有用信息。\n\
  \n## 查询域名服务器\n\n根据设计性质，大多数域名服务器向公众开放。在 Kali Linux 终端中输入以下命令将查询分配给本地计算机的域名服务器。\n\n\
  ```\nnslookup\n```\n\n这将在终端中显示一个箭头（`>`），表示系统正在等待输入。输入以下命令查询本地域名服务器，以确定 Google 网页的\
  \ IP 地址。\n\n```\n> www.google.com\n```\n\n这将返回多个 IP 地址，包括权威的（第一批响应）和非权威的（跟在非权威说明之后的响应）。非权威答案是极佳的信息来源，因为该术语仅表示信息来自服务器的缓存。\n\
  \n要退出 `nslookup`，请使用以下命令。\n\n```\n> exit\n```\n\n`nslookup` 命令将使用本地机器定义的域名服务器。要显示当前\
  \ `nslookup` 命令使用的域名服务器，请使用以下命令。\n\n```\nnslookup\n> server\n```\n\n`nslookup` 命令还可以返回其他信息。例如，要搜索所有的邮件服务器，请输入以下命令。\n\
  \n```\n> set type=MX\n> google.com\n```\n\n这将返回 `Google` 域的所有已知邮件服务器。\n\n识别关于目标的不同类型记录是完成侦察的重要部分。如前所述，`nslookup`\
  \ 命令默认使用本地定义的域名服务器。在 Kali Linux 中，域名服务器定义位于 `/etc` 目录下的 `resolv.conf` 文件中。使用以下命令识别本地定义的域名服务器。\n\
  \n```\ncat /etc/resolv.conf\n```\n\n`nslookup` 使用的域名服务器可以更改目标域名的域名服务器。首先使用以下命令识别目标的域名服务器。\n\
  \n```\nr\nnslookup\n> set type=ns\n> google.com\n```\n\n一旦确定了目标域名服务器，可以使用以下命令将 `nslookup`\
  \ 使用的域名服务器更改为目标域名服务器之一。此示例将域名服务器设置为 Google 的域名服务器之一。\n\n```\nnslookup\n> server\
  \ 216.239.32.10\n```\n\n使用 `nslookup` 可以发现许多记录。许多主要的记录类型定义在表 7.1 中。\n\n表 7.1\n\n\
  DNS 基础记录类型\n\n| 记录类型 | 默认端口 | 服务器类型 |\n| --- | --- | --- |\n| mx | 25 | 邮件 (email)\
  \ |\n| txt | n/a | 用于人类可读备注的文本消息 |\n| ns | 53 | 域名服务器 |\n| cname | n/a | 另一个服务器的别名（规范名称）\
  \ |\n| aaaa | n/a | IP 版本 6 (IPv6) |\n| a | n/a | 域名或子域记录 |\n\n## 区域传输\n\n\n\n\n\
  \n虽然使用 `nslookup` 等程序手动传输信息可以获取大量信息，但使用区域传输（zone transfer）可以在更短的时间内获取更多信息。区域传输字面意思是从名称服务器转储所有信息。此过程对于更新授权的名称服务器非常有用。配置不当的名称服务器不仅允许授权的客户端进行更新所需的区域传输，还会允许任何请求传输的用户进行访问。\n\
  \n域名 Internet Gopher (DIG) 是一个可以用于尝试区域传输的程序。要尝试区域传输，请使用以下命令：\n\n```bash\ndig @[name\
  \ server] [domain] axfr\n```\n\n然而，如果目标名称服务器配置不当，大多数传输将失败。整个名称服务器记录集将传输到本地 Kali\
  \ Linux 计算机。使用此命令时，域名将是去掉了任何主机名的域名，例如 `foo.com` 而不是 `[www.foo.com`。`axfr` 命令表示 `dig`\
  \ 应该请求区域传输。如果传输成功，显示的信息可以添加到目标的配置文件中。这将为渗透测试的后续阶段提供有价值的信息。\n\n## 参考资料\n\n1. 见：*[http://www.exploit-db.com/google-dorks/]*..\n\
  \n# 第 8 章：扫描\n\n本章将向读者介绍渗透测试生命周期中的扫描阶段：扫描。本章将解释三种扫描工具 `Nmap`、`Hping` 和 `Nessus`\
  \ 的用法。\n\n### 关键词\n\n扫描；`Nmap`；`Hping`；`Hping3`；`Nessus`；端口识别；`ICMP`；`TCP`；`UDP`\n\
  \n## 本章内容\n\n![ent](img/FilledVerySmallSquare_9642.gif) 本章将介绍扫描阶段使用的概念和基础工具\n\n\
  ## 概述与核心学习点\n\n本章将：\n\n![ent](img/FilledVerySmallSquare_9642.gif) 解释渗透测试生命周期扫描阶段的重要性\n\
  ![ent](img/FilledVerySmallSquare_9642.gif) 介绍网络协议 `TCP`、`UDP` 和 `ICMP`\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 介绍并解释 `Nmap` 的基本用法\n![ent](img/FilledVerySmallSquare_9642.gif) 介绍并解释 `Hping3`\
  \ 的基本用法\n![ent](img/FilledVerySmallSquare_9642.gif) 介绍并解释 `Nessus` 的基本用法\n\n## 扫描简介\n\
  \n在渗透测试人员完成组织的侦察阶段后，他们将进入扫描阶段。在此阶段，渗透测试人员可以利用获取关于员工、承包商和信息系统的信息，开始扩大对组织物理和逻辑信息系统结构的视图。与渗透测试生命周期中的任何其他阶段一样，渗透测试人员可以根据需要返回之前的阶段，获取更多信息以增强扫描阶段收集的信息。\n\
  \n扫描阶段的主要重点是确定关于连接到组织目标网络的计算机和其他设备的特定信息。在整个阶段中，重点是寻找活动主机、确定节点类型（桌面电脑、笔记本电脑、服务器、网络设备或移动计算平台）、操作系统、提供的公共服务（Web\
  \ 应用程序、`SMTP`、`FTP` 等），甚至是可能的漏洞。此级别的漏洞通常被称为“手而易得的果实”。可以使用许多工具进行扫描；本章将重点介绍一些最知名且最有效的工具，包括\
  \ `Nmap`、`Hping` 和 `Nessus`。此阶段的目标是为渗透测试生命周期的下一个阶段：利用列出可能的目标列表。\n\n## 理解网络流量\n\n\
  网络流量对某些人来说可能令人困惑；然而，为了从扫描阶段获得最大收益，需要对这一主题有基本的理解。网络流量是通过多种方法连接的计算机系统之间发生的电子通信。今天最常见的网络方法是有线和无线以太网。理解以太网通信的基本原理是必要的。本章将介绍端口和防火墙，IP\
  \ 协议包括传输控制协议 (`TCP`)、用户数据报协议 (`UDP`) 和互联网控制管理协议 (`ICMP`)。\n\n### 理解端口和防火墙\n\n防御网络的最基本方法之一是在内部（通常是公司）网络与世界其他部分（可能是互联网）之间实施防火墙。防火墙具有两个或多个网卡的计算设备，作为网络的网关。访问控制列表严格监控出站流量（egress）和入站流量（ingress）。只有符合访问控制标准的流量允许通过，其余流量会被防火墙丢弃。它通过打开或关闭端口来允许或拒绝流量来实现这一点。\n\
  \n端口是计算机之间通信使用的不同通信通道。有 65,535 个 `TCP` 端口和另外 65,535 个 `UDP` 端口可用于通信。这些端口中的一小部分被指定用于特定用途，但不限于此用途。例如，`TCP`\
  \ 端口 `80` 通常用于利用超文本传输协议 (`HTTP`) 的普通互联网网络流量，但其他流量也可以通过端口 `80` 旅行，互联网流量也可以其他端口传输。\n\
  \n思考端口的一种方式是将其想象成一个大办公楼，有通往不同房间的门。每个房间都有从事特定工作并管理不同功能的办公室人员。`80` 号房间后面的办公室处理进入的网页请求。Web\
  \ 部门可能会移动到不同的办公室，例如 `8080` 号房间的办公室，继续执行相同的功能，并在那里处理 Web 请求。另一个小组可以进入 `80` 号房间，该房间与\
  \ Web 请求无关，或者该房间可以简单地关闭、锁定并闲置。寻找 Web 团队的访客需要知道 Web 团队现在位于 `8080` 号房间，而不是 `80` 号房间。在\
  \ Web 团队移动后试图从 `80` 号房间获取 Web 信息的访客将失望并无法获得所需信息，因为那里的人不对，或者办公室被锁了；而拥有正确地址的访客将从 `8080`\
  \ 号房间的新办公室获得请求的网页。\n\n### 理解 IP 协议\n\n协议是规则，无论是在现实生活中还是在计算机网络。外交官、政治家和高级官员通常有专门的工作人员处理协议问题。礼宾办公室的人确保每位访客或官方消息的处理方式都能确保消息或访客被正确接收、格式正确并带有正确的头衔和荣誉。在计算机世界中，这些协议确保系统之间的通信按照预定义的规则进行。虽然对于所有计算机系统可用大量的协议，但本章将介绍\
  \ Kali Linux 上流行的扫描应用程序最常用的用于扫描、漏洞发现和渗透测试的三种协议：`TCP`、`UDP` 和 `ICMP`。\n\n### TCP\n\
  \n用于网络通信的主要协议之一是 `TCP`。`TCP` 是一种基于连接的通信协议，这意味着通道两边的计算机都确认会话已开启且连接的双方都在接收消息。在过去，许多人将其比作电话通话。\n\
  \n电话响了\n\n| Charlie: | “你好” |\n| :--- | :--- |\n| Denis: | “嗨，Charlie 在吗？” |\n|\
  \ Charlie: | “我是 Charlie。” |\n\n\n\n\n\n虽然这个类比有点反向，但它确实说明了类似于初始化 `TCP` 通信流时所使用的三次握手。在\
  \ `TCP` 通信中，这种三个数据包交换是由计算机尝试连接另一台计算机来启动通信的。这是通过发送一个同步标记的数据包或请求（通常称为 `SYN`）来实现的。接收端的计算机（如果可用）将使用一个设置了确认（acknowledgment）和同步（synchronization）标志的数据包回复发送者，这个\
  \ `TCP` 数据包被称为 `SYN/ACK` 包。最后，发起通信的计算机会发送一个设置了确认（`ACK`）标志的数据包，以完成同步并建立连接。这种通信看起来就像图\
  \ 8.1 所示所示。\n\n![image](img/F000082f08-01-9780124077492.jpg)\n\n图 8.1 `TCP` 三次握手。\n\
  \n三次握手是所有格式正确的 `TCP` 通信开始的方法，并确保了通信通道两端的计算机相互保持同步。在本章的后后部分，这种握手协议将被利用以一种尝试避免检测的方式来识别网络上的计算机。\n\
  \n这种确认过程在计算机之间的整个通信会话期间持续进行。这有助于确保一台计算机发送的消息都能被另一台计算机接收，任何未成功传输的数据包都会由第一台计算机重发。这与口头交流中的反馈类似。\n\
  \n| Denis: | “我想让你下午 3:00 在餐厅等我。” |\n| Charlie: | “你想在几几点在餐厅见我？” |\n| Denis: | “下午\
  \ 3:00” |\n| Charlie: | “好的，就下午 3:00 见。” |\n\n这在网络上产生了大量的开销，通常会消耗大量的带宽，并使通信花费更长的时间。由于由于原因，它通常用于需要某种程度可靠性、且不会受到数据包乱序到达远端延迟影响的通信会话（使用此协议的程序即使在包乱序到达的情况下也会按照正确的顺序重组数据包）。使用\
  \ `TCP` 通信过程的常见进程包括文件传输（`FTP`）、网络流量（`HTTP`）和电子邮件（`SMTP`、`POP` 和 `IMAP`）。\n\n###\
  \ UDP\n\n`UDP` 是一个开销比 `TCP` 连接更小的协议。如果说 `TCP` 通信过程类似于电话，即双方都确保通信通道两端的通信都在按发送的方式接收，那么\
  \ `UDP` 更像是广播广播，通信被发送出去，默认情况下发送者或接收者都不会验证通信包是否已接收。\n\n广播电台：“这里是 XHAK 电台；请大家今天下午\
  \ 3:00 在餐厅汇合。”\n\n这种广播通过空气发送，如果在接收者端接收到了，那就太好了。如果目的地没有接收到部分消息；默认情况下，接收者不会请求重传该数据包。该规则有少数例外；遗憾的是，这是本章范围之外的高级主题。在处理利用\
  \ `UDP` 的通信时，接收端不会确认通信链路的状态，或数据包在传输过程中是否被丢弃。\n\n这种低开销的通信方法非常适用于不需要验证每个包的任务，或者不会因数据包乱序到达而产生不利影响的服务。使用\
  \ `UDP` 通信的应用更看重低开销和高速度，而不是增加的可靠性，例如视频和音乐流。\n\n### ICMP\n\n`ICMP` 在设计上是网络的一种健康和维护协议。该协议用于确定网络上的设备是否按预期工作并能够正确通信。在大多数情况下，终端用户永远不会直接使用依赖\
  \ `ICMP` 的应用程序；然而，正如任何规则一样，总是有例外。在这种情况下，`traceroute` 和 `Ping` 是很好的例外例子。另一个区别是，与\
  \ `TCP` 和 `UDP` 通信不同，这种通信方法并非设计携带用户数据设计。相反，`ICMP` 将系统消息传输到网络设备、计算机和应用程序之间。\n\n`ICMP`\
  \ 消息的头部包含一个特定的类型（type）和代码（code）或数字集合。这些集合用于对网络上的各种节点提问或提供信息。这些类型和代码集合可以帮助渗透测试确定目标系统上的系统（图\
  \ 8.2）。\n\n![image](img/F000082f08-02-9780124077492.jpg)\n\n图 8.2 `ICMP` 表。\n\n\
  #### PING\n\n`Ping` 可能是终端用户或管理员最直接使用的基于 `ICMP` 的命令。`Ping` 命令发送一个类型为 8、代码为 0 的 `ICMP`\
  \ 包，表示此包是一个显回请求（echo request）。接收此数据包的机器如果（通常默认情况下）配置了响应，将回复另一个类型为 0、代码为 0 的 `ICMP`\
  \ 包，表示显回应答（echo reply）。成功的 `Ping` 和响应将表明被查询的系统在网络上运行或被认为是一个“活动主机”。来自 Windows 平台的\
  \ `Ping` 请求默认会发送四次 `Ping` 请求，而来自 Linux 宿机的 `Ping` 请求将继续尝试 `Ping` 直到用户取消。要取消 Linux\
  \ `Ping`，请按下控制键和“c”键。成功的 `Ping` 看起来如下：\n\n```\nLive Host\nPing 192.168.1.1\nPinging\
  \ 192.168.1.1 with 32 bytes of data:\nReply from 192.168.1.1: bytes=32 time<1ms\
  \ TTL=64\nReply from 192.168.1.1: bytes=32 time<1ms TTL=64\nReply from 192.168.1.1:\
  \ bytes=32 time<1ms TTL=64\n\n```\n\nHost Unreachable\nPing 192.168.1.200\nPinging\
  \ 192.168.1.200 with 32 bytes of data:\nReply from 192.168.1.129: Destination host\
  \ unreachable.\nReply from 192.168.1.129: Destination host unreachable.\nReply from\
  \ 192.168.1.129: Destination host unreachable.\nReply from 192.168.1.129: Destination\
  \ host unreachable.\nPing statistics for 192.168.1.200:\nPackets: Sent = 4, Received\
  \ = 4, Lost = 0 (0% loss)\n```\n\n#### Traceroute\n\n`traceroute` 使用 `ICMP` 的 `Ping`\
  \ 命令来发现启动 `traceroute` 的计算机与目标之间有多少不同的设备。该命令通过操作数据包的生存时间（time to live）来实现。`TTL`\
  \ 是数据包在下一个主机上可以重发的次数。命令从 `TTL` 值为 1 开始，表示包只能到达启动器与目标之间的下一个设备。接收设备将返回一个类型为 11、代码为\
  \ 0 的超时（time exceeded）包，且该包会被记录。发送者将 `TTL` 增加 1 并发送下一系列数据包。包将在网络上的下一个跳点达到其生存时间；这反过来导致接收路由器发送另一个超时回复。这种持续持续到到达目标，并且所有的跳点都被记录，从而创建一个设备设备列表。这对于渗透测试人员确定网络上有哪些设备非常有帮助。Windows\
  \ 平台的默认 `TTL` 为 128，Linux 平台从 64 开始，Cisco 网络设备的 whopPing `TTL` 为 255。\n\nWindows\
  \ 上的 `traceroute` 命令是 `tracert`。在 Linux 系统（如 Kali）上，命令是 `traceroute`。Windows 上的典型\
  \ `tracert` 如下所示。\n\n```\ntracert [www.google.com](http://www.google.com)\nTracing\
  \ route to [www.google.com](http://www.google.com) [74.125.227.179]\nover a maximum\
  \ of 30 hops:\n1 1 ms <1 ms 1 ms 192.168.1.1\n```\n\n\n\n\n\n2 7 ms 6 ms 6 ms 10.10.1.2\n\
  3 7 ms 8 ms 7 ms 10.10.1.45\n4 9 ms 8 ms 8 ms 10.10.25.45\n5 9 ms 10 ms 9 ms 10.10.85.99\n\
  6 11 ms 51 ms 10 ms 10.10.64.2\n7 11 ms 10 ms 10 ms 10.10.5.88\n8 11 ms 10 ms 11\
  \ ms 216.239.46.248\n9 12 ms 12 ms 12 ms 72.14.236.98\n10 18 ms 18 ms 18 ms 66.249.95.231\n\
  11 25 ms 24 ms 24 ms 216.239.48.4\n12 48 ms 46 ms 46 ms 72.14.237.213\n13 50 ms\
  \ 50 ms 50 ms 72.14.237.214\n14 48 ms 48 ms 48 ms 64.233.174.137\n15 47 ms 47 ms\
  \ 46 ms dfw06s32-in-f19.1e100.net [74.125.227.179]\n\n追踪完成。\n\nKali 上的许多扫描工具利用了\
  \ `TCP`、`UDP` 和 `ICMP` 等协议来绘制目标网络地图。成功扫描阶段的结果是主机、IP 地址、操作系统和服务的列表。某些扫描工具还可以发现漏洞和用户详情。这些细节将极大地增强利用阶段，因为此阶段的攻击可以更有针对地针对特定的主机、技术或漏洞。\n\
  \n# NMAP：扫描器之王\n\n`Nmap` 不仅能够确定目标网络上活跃的计算机，在许多情况下，它还可以确定操作系统、监听端口、服务以及可能的的用户凭据。通过对目标使用命令、开关和选项的组合，`Nmap`\
  \ 可以成为渗透测试任务中扫描阶段的一项强大资产。\n\n## Nmap 命令结构\n\n`Nmap` 的命令开关具有非常独特的结构，允许以支持最大灵活性的方式组合命令选项和目标。一个典型但非常基础的命令如图\
  \ 8.3 所示，它详细说明了告诉扫描引擎执行操作的几个基本部分。\n\n![image](img/F000082f08-03-9780124077492.jpg)\n\
  \n图 8.3 Nmap 命令结构。\n\n除了 `Nmap` 命令本身外，这些选项中的每一个将在后续章节中进行更详细的介绍。命令开关和选项告诉操作系统运行哪个程序（在本例中为\
  \ `Nmap`），以及正确执行任务具体需要什么。跟随命令之后的是扫描选项，在本例中，`-sS` 开关表示隐蔽扫描。接下来是时间选项，它们告诉引擎产生多少流量以及产生速度有多快，最终决定扫描运行的快慢。在这个示例中，目标选项紧随时间选项之后，是进行\
  \ `Nmap` 扫描所需的另一个必要部分。此示例中的最后一个选项是输出选项，告诉应用程序将扫描结果发送到哪里。`Nmap` 扫描命令可以比图 8.3 中的命令和选项字符串复杂得多，也可以基础得多。例如，以下内容就是执行完整的\
  \ `Nmap` 命令语句并对目标进行扫描所需的所有。在这种情况下，目标是书中前面的章节描述的实验中的 Metasploitable2 虚拟机。\n\n```\n\
  nmap 10.0.2.100\n```\n\n默认情况下，如果没有像上面示例那样设置任何选项，`Nmap` 将使用正常时间模板（`T3`）速度对目标 `10.0.2.100`\
  \ 进行隐蔽扫描。此外，扫描结果将输出到监视器（如果定义为标准输出）。这种基础扫描说明了 `Nmap` 频谱的一端，而另一端是复杂且耗时的扫描，它们定义了 `Nmap`\
  \ 将完成的详细操作。高级用法包括使用`Nmap 脚本引擎`（`NSE`）执行为 `Nmap` 编写的详细脚本。为了更好地理解基础 `Nmap` 扫描的细节，接下来的章节将详细介绍增强\
  \ Nmap 作为扫描工具使用的选项，这有助于定义渗透测试任务中的目标。这些章节不仅触及了 Nmap 的表面，还将让读者对该工具的功能有坚实的理解。这些章节将涵盖扫描、计时、目标和输出选项。在这些章节之后，将涵盖预配置\
  \ `Nmap` 脚本的基本用法。\n\n## 扫描选项\n\n使用 `-s`（小写 s）扫描前缀会通知 `Nmap` 扫描引擎，用户指定要在扫描命令定义的目标上执行特定类型的扫描。小写\
  \ `s` 后面跟着一个用于识别扫描类型的大写字母。扫描类型的选择可以帮助渗透测试人员回避某些基于主机和基于网络的防护系统，甚至可能绕过防火墙等网络防护。\n\n\
  ### –sS 隐蔽扫描\n\n隐蔽扫描是 `Nmap` 在未定义扫描选项时使用的默认扫描选项。当命令字符串中设置了 `-sS` 选项时，也可以有意启动隐蔽扫描。此扫描与目标建立\
  \ `TCP` 连接，但从未完成三次握手。`Nessus` 引擎通过向目标机器发送 `SYN` 包来启动握手。目标机器可能会回复一个 `SYN/ACK` 包，但\
  \ `Nessus` 引擎不会对其进行确认。这导致连接保持开启状态，因为通信通道从未被完全建立。大多数系统在一段时间后会自动关闭这种连接。在较旧且配置不当的系统中，这种连接可能不被检测到，因此这种扫描通常与更隐蔽且被认为噪声较小的目标扫描相关联。今天，许多网络系统甚至主机都可以检测到隐蔽扫描；但不应阻碍渗透测试人员使用这种技术进行扫描，因为它通常比其他扫描更难检测，而且如果目标系统配置不当，即使在今天，扫描也可能完全不被发现。这种扫描技术如图\
  \ 8.4 所示。\n\n![image](img/F000082f08-04-9780124077492.jpg)\n\n图 8.4 隐蔽扫描。\n\n###\
  \ –sT TCP 连接扫描\n\n`TCP` 连接扫描通常可以比隐蔽扫描收集到关于目标的更多信息，因为它与目标主机建立了完整的 `TCP` 连接。在这种情况下，`Nessus`\
  \ 引擎启动一个 `SYN` 包，并希望目标通过 `SYN/ACK` 回复进行确认。与隐蔽扫描不同，这次 `Nessus` 引擎通过发送最后的 `ACK` 包完成了通信路径。这种扫描在大多数系统上都会被记录，但通常能比隐蔽扫描提供更多信息（图\
  \ 8.5）。\n\n![image](img/F000082f08-05-9780124077492.jpg)\n\n图 8.5 连接扫描。\n\n### –sU\
  \ UDP 扫描\n\n`UDP` 扫描评估目标系统上的 `UDP` 端口。与扫描 `TCP` 端口不同，`UDP` 扫描期望从测试端口关闭的系统接收回复。发送到开放\
  \ `UDP` 端口的包不会得到响应；然而，如果发送的包引发了目标的响应，则被探测的端口是开启的。如果没有收到响应，则端口可能是开启的，也可能防火墙等设备过滤。可以通过类型为\
  \ 3 代码为 3 的 `ICMP` 响应（端口不可达）识别关闭的 `UDP` 端口。最后，确认被过滤的端口将具有类型为 3、代码为 1、2、9、10 或 13\
  \ 的 `ICMP` 响应，表示各种不可达错误（图 8.6）。\n\n![image](img/F000082f08-06-9780124077492.jpg)\n\
  \n图 8.6 UDP 扫描。\n\n### –sA\n\n\n\n\n\nACK 扫描（`-sA` 用于尝试确定 TCP 端口是否被过滤（filtered）或未过滤（unfiltered）。该扫描通过设置确认（ACK）标志与目标建立通信。这种扫描有时可以通过伪装成对内部发送请求的响应（ACK）来绕过某些防火墙。例如，目标计算机会发送一个\
  \ SYN 数据包，尽管这台内部计算机从未发送过请求。对该扫描返回的重置（RST）响应表示所查询的端口未被过滤。如果没有收到任何响应，或者收到了代码为 1, 2,\
  \ 3, 9, 10 或 13 的类型 3 ICMP 响应（不可到达错误），则表示该端口被过滤了（图 8.7](#）。\n\n![image](img/F000082f08-07-9780124077492.jpg)\n\
  \n图 8.7 Nmap ACK 扫描。\n\n### 计时模板 (Timing Templates)\n\n如上所述，如果没有设置计时开关，Nmap 默认使用的计时模板是\
  \ `-T3` 或正常（normal）。Nmap 具有内置功能，允许用户覆盖此功能，以比正常默认速度更快或更慢的速度扫描目标集。根据所选计时模板，会有许多不同的设置，但最具说明性的是扫描探针之间的延迟以及并行处理状态。因如此，将使用\
  \ `scan_delay`、`max_scan_delay` 和 `max_parallelism` 来解释每个不同的计时模板。这些选项提供了一种衡量每个计时模板的好方法，以确保为渗透和目标网络设置了正确的模板。`scan_delay`\
  \ 设置设置发送到目标机的探针之间的最小间隔，而 `max_scan_delay` 则表示根据目标和网络设置，扫描器允许扫描延迟增长的最大时间。这可能非常重要，因为某些系统只会以特定的速率响应探针。Nmap\
  \ 会自动调整探针计时以匹配系统或网络的需求，最高达到 `max_scan_delay` 设置。`max_parallelism` 指系统系统串行扫描中每次发送一个探针，或在并行扫描中同时发送多个探针。\n\
  \n以下示例将使用相同的目标，即设置了 `-sU`（UDP 扫描）开关的 Metasitableitable2 虚拟机。虽然尚未介绍，但示例将使用端口开关 `-p`\
  \ 来指示前 500 个端口应使用 `-p 1–500` 开关组合进行扫描。此 Nmap 命令将所示；但哈标记（`#`）将被替换为该特定示例使用的模板数字。这样就可以对彼此的扫描计时进行比较。虽然此示例使用了\
  \ `-T#` 开关，但也可以使用英文文本来实现相同的效果，因此 `-T5` 和 `-timing insane` 导致运行相同的扫描。\n\n```\nnmap\
  \ –sU –T# p 1-500 10.0.2.100\n```\n\n或者\n\n```\nnmap –sU --timing paranoid –p 1-500\
  \ 10.0.2.100\n```\n\n### –T0 偏执型 (Paranoid)\n\n`-T0` 或偏执型（Paranoid）扫描用于慢网络链路或必须最小化检测风险的情况。这是一种串行扫描，将暂停至少\
  \ 5 分钟；然而，秒级的 `max_delay` 设置被忽略，因为基础 `scan_delay` 被设置为高于此默认值的值。在图 8.8 中很容易看到在单台计算机上完成\
  \ 500 个 UDP 端口偏执型扫描所需的时间。在图 8.8 中，系统时间显示在图顶部为上午 10:29，扫描开始时间为上午 8:23，表明扫描已运行了超过\
  \ 2 小时。最后一行表示扫描将在 45 小时 37 分钟后完成。这种扫描有效，但应在需要隐蔽且有大量时间的情况下使用。\n\n![image](img/F000082f08-08-9780124077492.jpg)\n\
  \n图 8.8 偏执型扫描。\n\n### –T1 隐秘型 (Sneaky)\n\n`-T1` 或 `--timing sneaky`（隐秘型）扫描比偏执型扫描快一点，在减少所需扫描时间的同时保持了慢速扫描固有的某些隐蔽性。这种扫描也使用串行过程查询目标，但将\
  \ `scan_delay` 大幅减少到 15 秒。虽然 `scan_delay` 减少了，但它仍然大于 `max_scan_delay`，因此第二个值被忽略了。这种扫描与\
  \ `-T0` 扫描之间的速度差异在图 8.9 中所示，扫描时间缩短至 8331 秒或 138 分钟。\n\n![image](img/F000082f08-09-9780124077492.jpg)\n\
  \n图 8.9 隐秘型扫描。\n\n### –T2 礼貌型 (Polite)\n\n`-T2` 或 `--timing polite`（礼貌型）扫描相比 `-T0`\
  \ 和 `-T1` 扫描速度再次提升，是最后一种增加速度的扫描（且不使用并行处理技术）。这种扫描的 `scan_delay` 设置为 400 毫秒，而 `max_scan_delay`\
  \ 为 1 秒。这种扫描与 `-T0` 扫描之间的速度差异在图 8.9 中所示，扫描时间缩短至 8331 秒或 138 分钟（注：此处原文逻辑似乎有误，已按字面翻译）。此处更准确的理解应该是：这种扫描与\
  \ `-T0` 扫描之间的速度差异在图 8.9 中所示，扫描时间缩短至 8331 秒或 138 分钟（此处按原文翻译）。这种扫描完成目标目标端口扫描耗时 544\
  \ 秒或约 9 分钟（图 8.10](#）。\n\n![image](img/F000082f08-10-9780124077492.jpg)\n\n### –T3\
  \ 正常型 (Normal)\n\n`-T3` 或 `--timing normal`（正常型）扫描是 `-T0` 和 `-T1` 扫描速度的再次提升，并且是最后一个使用并行处理的模板。这种扫描的\
  \ `scan_delay` 设置为 400 毫秒，而 `max_scan_delay` 为 1 秒。这种扫描完成目标计算机 500 个端口扫描耗时 547 秒或约\
  \ 9 分钟（图 8.11](#）。\n\n![image](img/F000082f08-11-9780124077492.jpg)\n\n### –T4 激进型\
  \ (Aggressive)\n\n`-T4` 或 `--timing aggressive`（激进型）模板也以并行方式运行扫描。该模板的 `scan_delay`\
  \ 设置为 0 秒，并可达到 `max_scan_delay` 的 10 毫秒。`max_scan_delay` 小于 1 秒的扫描容易出错，因为某些目标操作系统要求探针响应之间有最小\
  \ 1 秒的延迟。这种扫描完成 Metasploit 虚拟机端口扫描仅耗时 477 秒，或不到 8 分钟（图 8.12](#）。\n\n![image](img/F000082f08-12-9780124077492.jpg)\n\
  \n### –T5 疯狂型 (Insane)\n\n`-T5` 或 `--timing insane`（疯狂型）计时模板是内置计时模板中最快的。该模板使用并行扫描技术，`scan_delay`\
  \ 为 0 秒，`max_scan_delay` 为 5 毫秒。正如对激进型扫描所说，这种扫描可能会根据目标机器操作系统和设置产生错误。这种扫描（最快的）在不到\
  \ 22 秒内完成；然而，其结果与到此为止的所有扫描都有很大不同（图 8.13](#）。\n\n![image](img/F000082f08-13-9780124077492.jpg)\n\
  \n\n\n\n\n确定 `Nmap` 扫描的目标或目标集是 `Nmap` 命令字符串中最重要的部分之一。定义错误的目标可能会扫描空的 IP 空间，或者更糟糕的是扫描未受参与规则（ROE）覆盖的计算机。在扫描语句字符串中有多种定义目标集的方法。在这些方法中，书中描述的两种是\
  \ IP 地址范围和使用扫描列表。\n\n### IP 地址范围\n\n使用 IP 地址范围定义一组目标非常简单。在本例中，地址范围将是 `10.0.2.x`\
  \ C 类地址范围。这意味着扫描中包含的最大主机数量为 `254`。要扫描所有主机，请使用以下命令\n\n```\nnmap 10.0.2.1-255\n```\n\
  \n也可以使用 CIDR 址方法通过使用 `/24` 后缀来完成相同的扫描。CIDR 址是选择地址范围的快速方法，但 CIDR 址超出了本书的范围。在不完成所有计算的情况下，定义\
  \ CIDR 范围的快速方法是使用如 `http://www.mikero.com/misc/ipcalc/` 之类的在线计算器。要使用它，请在 IP 范围框中输入起始和结束地址，并点击转换按钮（图\
  \ 8.14）。有很多良好的参考资料可以学习更多关于 CIDR 址的知识。\n\n```\nnmap 10.0.2.1/24\n```\n\n![image](img/F000082f08-14-9780124077492.jpg)\n\
  \n图 8.14 CIDR 转换。\n\n通过定义较小的 IP 范围，可以在扫描中识别较少的 IP 地址。在本例中，将扫描前 100 个地址。\n\n```\n\
  nmap 10.0.2.1-100\n```\n\n或使用 CIDR\n\n```\nnmap 10.0.2.0/25\n```\n\n### 扫描列表\n\n\
  `Nmap` 还可以使用文本文件作为目标列表的输入。假设以下地址存储在名为 `targets.txt` 的文件中\n\n```\n10.0.2.1\n10.0.2.15\n\
  10.0.2.55\n10.0.2.100\n```\n\n使用该文件的命令如下所示\n\n```\nnmap –iL targets.txt\n```\n\n\
  ### 选择端口\n\n可以使用扫描命令中的 `-p` 关来选择端口。可以通过在命令中使用连字符来使端口连续。也可以通过在命令中使用逗号来识别所选的端口。\n\n\
  ```\nnmap –sS –p 1-100\n```\n\n```\nnmap –sU –p 53,137,138,161,162\n```\n\n（或两者都用）`nmap\
  \ -sS -p 1-100,445,8000-9000`\n\n### 输出选项\n\n渗透测试人员经常不希望将 `Nmap` 扫描结果输出到屏幕，而是保存到文件中。这可以通过管道命令（`|`）重定向来实现，但本章将描述\
  \ `Nmap` 扫描输出选项。这些包括普通（Normal）、XML 和可 GREP（GREPable）。对于所有这些示例，将使用位于 `10.0.2.100`\
  \ 的 metasploitable 目标，并使用文件名 `metascan` 的相应扩展名。\n\n#### –oN 普通输出\n\n普通输出选项将创建一个文本文件，可以用于评估扫描结果，或作为其他程序的输入。\n\
  \n```\nnmap –oN metascan.txt 10.0.2.100\n```\n\n#### –oX 可扩展标记语言 (XML) 输出\n\nXML\
  \ 输出可以输入到许多不同的应用程序中进行进一步的处理或评估。\n\n```\nnmap –oX metascan.xml 10.0.2.100\n```\n\n\
  #### –oG 可 GREP 输出\n\n渗透测试人员经常使用可 GREP 输出，以便使用 `GREP` 等工具进行进一步调查，也可以使用 `AWK`、`SED`\
  \ 和 `DIFF` 等工具进行搜索。\n\n```\nnmap –oG metascan.txt 10.0.2.100\n```\n\n#### –oS ScRipT\
  \ Kidd|# opuT\n\n虽然不用于严肃的渗透测试，但脚本小子（script kiddie）输出偶尔使用会很有趣。这种输出方法不应用于严肃扫描，因为它使用了许多渗透测试人员称为“脚本小子”的人所使用的“Leet”俚语。\n\
  \n```\nnmap –oS metascan.txt 10.0.2.100\n```\n\n### Nmap 脚本引擎\n\n为 `Nmap` 构建自定义脚本超出了本书的范围；然而，使用预配置脚本的能力对于进行渗透测试非常有帮助。全套预配置脚本可以在\
  \ `http://nmap.org/nsedoc/` 找到。在本例中，用于获取目标 `NetBIOS` 和 MAC 地址信息的脚本。要告诉 `Nmap` 扫描引擎将使用脚本，如示例所示，使用了\
  \ `--script` 标志。\n\n```\nnmap --script nbstat.nse 10.0.2.100\n```\n\n`Nmap` 断开发供社区使用的新脚本。安全测试人员将确保\
  \ `Nmap` 内部的脚本数据库尽可能更新。建议在执行任务之前更新数据库。更新 `Nmap` 数据库：\n\n```\nnmap --script-updatedb\n\
  ```\n\n### HPING3\n\n`Hping` 是一个可以用于手动构建包并将其放入网络中的应用程序。这是一种手动创建包的过程，类似于 `Nmap` 引擎自动创建包的方式。例如，`Hping3`\
  \ 可以通过使用 `-S` 标志创建一系列同步包。\n\n```\nhping3 –S 10.0.2.100\n```\n\n可以使用 `-h` 标志在帮助文件中找到有关\
  \ `Hping3` 的完整信息\n\n```\nhping3 -h\n```\n\n### Nessus\n\n如第 3 章所述，完成 `Nessus` 安装后，使用以下命令启动\
  \ `Nessus` 扫描器\n\n```\n/etc/init.d/nessusd start\n```\n\n扫描器启动，打开 IceWeasel 浏览器并导航到\
  \ `https://localhost:8834/`。冒号后面的数字，在这种情况下为 `8834`。\n\n\n\n\n\n一旦插件下载，将显示登录对话框。输入之前创建的管理员用户名和密码。然后点击“Sign\
  \ In To Continue”（登录继续）按钮登录。这将完成初始的 Nessus 设置并显示类似于图 8.16 的仪表板。\n\n![image](img/F000082f08-16-9780124077492.jpg)\n\
  \n图 8.16 Nessusus 设置。\n\n## 使用 Nessus 进行扫描\n\n安装 Nessus 后，了解如何使用该应用程序设置并扫描网络或系统非常重要。本示例将使用书中之前创建的实验完成。metasploitable2\
  \ 虚拟机配置的 IP 地址为 `10.0.2.100`，Kali 虚拟机的 IP 地址为 `10.0.2.15`。虚拟机的 VirtualBox 控制台中的网络适配器设置设置为“Internal”（内部），以确保不会在外部网络上发生未经授权的扫描，并确保外部用户无法访问\
  \ metasploitable2 虚拟机。一旦两台机器都运行，就可以配置 Nessus 并进行扫描。\n\n### 添加 Nessus 用户\n\n建议为每个使用\
  \ Nessus 控制台的用户创建一个不同的账户。如果可能，账户应关联到个人用户且不应共享。要创建用户，请选择 `Users`（用户）选项卡，然后选择“+ New\
  \ User”（新建用户）按钮。这将打开一个对话框，可以在其中输入用户凭据（图 8.17）。使用此对话框输入用户名和密码（两次）。如果用户是管理员，勾选“Administrator”（管理员）复选框。完成表单上的所有字段后，点击“Create\
  \ User”（创建用户）按钮。\n\n![image](img/F000082f08-17-9780124077492.jpg)\n\n图 8.17 新用户。\n\
  \n### 配置\n\n`configuration`（配置）选项卡允许用户调 Nessus 扫描器，使其尽可能高效有效地运行。使用此选项卡配置代理端口、SMTP\
  \ 设置、移动设置（Mobile Settings）、结果设置（Results Settings）以及若干项高级设置（Advanced settings），它还允许用户配置\
  \ Nessus 馈送（feed）和激活码（Activation Code）。如果尚未输入激活码，请使用系统配置页面上的“Feed Settings”（馈送设置）选项卡在此。然后点击“Update\
  \ Activation Code”（更新激活码）更新馈送设置。激活后，点击“Update Plugins”（更新插件）按钮更新 Nessus 插件。\n\n\
  ### 配置扫描\n\n策略控制 Nessus 扫描如何运行，包括使用哪些选项和凭据。开发完整的策略超出了本书的范围，因此本示例的重点是修改现有策略。选择 `policy`（策略）选项卡，然后点击标题打开“Internal\
  \ Network Scan”（内部网络扫描）。这将打开带有多个选项卡的选项对话框。\n\n所有选项卡都是很有用的，在生产环境中使用该工具之前，应在实验环境中进行探索。例如，由于已知\
  \ metasploitable 机器的用户和密码，可以在 `credentials`（凭据）选项卡中输入这些凭据，赋予扫描引擎对远程目标更多的访问权限。发现这些凭据通常发生在侦察阶段（Reconnaissance\
  \ phase）。图 8.18 展示了在 `credentials` 选项卡中为 metasploitable 虚拟机输入用户名和密码。\n\n![image](img/F000082f08-18-9780124077492.jpg)\n\
  \n图 8.18 Nessus 凭据。\n\n`plugins`（插件）选项卡指示扫描器扫描特定的设置、服务和选项。例如，默认启用的选项组之一是 DoS（拒绝服务）。假设当前的\
  \ ROE（规则范围）不允许 DoS，则应禁用此选项组。点击绿色的启用按钮执行此操作。颜色应变为灰色，文本应显示为“disabled”（禁用）。要查看此选项组将运行哪些检查，点击按钮旁边的文本，视为\
  \ DoS 检查的项目将显示，如图 8.19 所示。右侧矩形中的数字（在此例中为 103）表示组中的检查项数量。\n\n![image](img/F000082f08-19-9780124077492.jpg)\n\
  \n图 8.19 移除 DoS。\n\n做出这些更改后，返回“General Settings”（常规设置）选项卡并在`Name Field`名称字段）中输入新名称，在此例中在名称字段中输入了名称“No\
  \ DoS”（图 8.20），并选择了“Update”（更新）按钮。一旦应用程序更新，此新策略将在 `Policies`（策略）列表中可用（图 8.21）。\n\
  \n![image](img/F000082f08-20-9780124077492.jpg)\n\n图 8.20 重命名 No DoS。\n\n![image](img/F000082f08-21-9780124077492.jpg)\n\
  \n图 8.21 No DoS 列表。\n\n设置扫描的最后一步是构建扫描模板。选择“+ New Scan”（新建扫描）按钮创建新模板。在“General Scan\
  \ Settings”（常规扫描设置）中为新模板命名，在此例中，输入了“No DoS Test Scan”作为名称，类型未从“Run Now”（立即运行）更改，策略设置为“No\
  \ DoS”，扫描目标仅设置为之前确定的 IP 地址为 `10.0.2.100` 的 metasploitable2 虚拟机。还可以使用“Upload Targets”（上传目标）“Browse”（浏览）按钮上传包含目标列表的文本文件。\n\
  \n`email`选项卡可用于输入从模板扫描获取信息的用户的电子邮件地址。要实现此功能，必须配置简单邮件传输协议（SMTP）服务。本示例将不进行此操作。\n\n\
  双检查所有设置后，即可开始扫描。点击蓝色的“Run Scan”（运行扫描）按钮。这将使用选定的配置扫描选定的目标。`Scan Queue`（扫描队列）将显示当前扫描的状态（图\
  \ 8.22）。\n\n![image](img/F000082f08-22-9780124077492.jpg)\n\n图 8.22 扫描队列。\n\n当扫描执行时，可以在“Results”（结果）选项卡中看到发现的漏洞。图\
  \ 8.23 展示了 metasploitable 虚拟机运行几分钟且尚未超过 0% 完成率时的扫描结果。这说明了该虚拟机有多脆弱，以及为什么它不应直接连接互联网。\n\
  \n![image](img/F000082f08-23-9780124077492.jpg)\n\n图 8.23 扫描结果。\n\n扫描完成后，可以使用“Results”选项卡以多种格式导出数据，包括逗号分隔值（CSV）、PDF\
  \ 和 HTM，在本练习中，结果将导出为 PDF 文件。通过选择“Host Summary (Executive)”（主机摘要执行执行）、“Vulnerabilities\
  \ By Host”（按主机漏洞）和“Vulnerabilities by Plugin”（按插件漏洞），包含了所有章节。每个按钮都变为蓝色，表示已选择。点击蓝色的“Export”（导出）按钮启动导出（图\
  \ 8.24）。\n\n![image](img/F000082f08-24-9780124077492.jpg)\n\n图 8.24 扫描报告。\n\nNessus\
  \ 是一个功能强大的扫描引擎，具有许多特性。许多书籍和视频深入介绍了配置和使用 Nessus 扫描器。建议在应用于生产系统之前，在实验环境中对其进行充分测试。\n\
  \n## 总结\n\nKali Linux 发行版封装了许多实用工具，可以协助扫描过程。本章仅接触了渗透测试生命周期中扫描阶段使用的三个常用工具。有关这些工具和应用程序的更多信息，可以在每个工具的\
  \ man（手册）页或帮助文件中找到。此外，Kali Linux 发行版中还有许多其他工具可用于扫描阶段。此阶段的结果对于协助渗透测试人员进行渗透测试任务的后续阶段至关重要。\n\
  \n\n\n\n本章将介绍渗透测试生命周期的第三阶段——利用（exploitation），也称为获取访问。这包括利用前两个阶段获取的关于目标的信息，并利用识别出的漏洞攻击信息系统。\n\
  \n### 关键词\n\n利用；访问；攻击；代码；注入；Web；黑客；Metasploit；远程；利用；Searchsploit；Nexpose；shell；恶意软件；病毒；OWASP；SSLScan；Arachni；w3af；Nikto\n\
  \n## 本章包含内容\n\n![ent](img/FilledVerySmallSquare_9642.gif) Metasploit 概述\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 访问 Metasploit\n\n![ent](img/FilledVerySmallSquare_9642.gif) Web 服务器与 Web 应用利用\n\
  \n## 章节概述与核心学习点\n\n本章将涵盖\n\n- 攻击向量与攻击类型之间的根本区别\n- 强调用于利用的 Kali Linux 基础工具集\n- 如何使用\
  \ Metasploit 攻击目标\n- 提供黑客攻击 Web 介绍\n\n### 引言\n\n### 利用\n\n根据美国标准与技术研究院 (NIST) 《特别出版物\
  \ 800–30》附录 B 第 B-13 页的定义，漏洞是“信息系统、系统安全程序、内部控制或实现中的可能被威胁源利用的‘弱点’”；然而，这个定义在讨论“利用”时范围过于宽泛，需要进一步解释。漏洞是由“错误”引起的。这种错误可能存在于信息系统的多个处，也存在于日常使用或管理网络和计算机的人员身上。信息系统的漏洞可能存在于网络内部或外部，潜伏在编写不当且未检查的软件中，由于不当的安全控制产生（特别是通过配置不当的应用和网络设备），或者通过技术网络之外的各种社会手段来利用信息系统的用户。\n\
  \n想一下，“漏洞”（vulnerability）一词与“弱点”（weakness）是同义词。利用仅仅是利用弱点来获取信息系统的访问权限，或通过拒绝服务使其失效。对于攻击者来说，利用的唯一限制是持续对抗保护信息系统的安全措施时纯粹动力和意志力的崩溃。渗透测试人员最好的工具就是他们的大脑。记住，系统有许多门或入口点。如果你发现某扇门是关着的，就转向下一扇。利用是渗透测试人员最困难且最受青睐的技能之一。学习单一攻击向量的所有攻击类型需要时间、知识和极大的坚持。\n\
  \n### 攻击向量对比对比攻击类型\n\n关于攻击向量和类型，存在一条经常被误传和误解的模糊地带。这两个术语有时看起来是互为同义的；但为了进一步理解如何分类和恰当使用利用程序，需要进行澄清和区分。暂时离开电子领域考虑一下：向量（vector）是一种传输手段，就像蚊、蜱虫或蜘蛛一样，病原体（或病毒）的类型是不同的，但交付方法仍然是一个字节。每种病原体执行不同的指令集，本质上可能相似，但在某些方面仍然保持独特。对于信息系统，攻击向量是分类每个类别内攻击类型子集或组的通用类别。\n\
  \n| 攻击向量 | 攻击类型 |\n| --- | --- |\n| 代码注入 | 缓冲区溢出 缓冲区欠载 |\n| 病毒 恶意软件 | |\n| 基于 Web\
  \ | 网页破坏 跨站脚本 (XSS)、跨站请求伪造 (CSRF)、SQL 注入 |\n| 基于网络 | 拒绝服务 (DoS) 分布式拒绝服务 (DoS)、密码和敏感数据拦截、窃取或伪造凭据\
  \ |\n| 社会工程学 | 冒充钓鱼、针对性钓鱼、情报收集 |\n\n不仅要理解是什么类型的攻击，还要理解通过什么手段进行攻击，这是利用的基础。在接下来的章节中，提供了不同类型攻击的小工具列表，并特别强调了\
  \ Metasploit 框架。如果不理解如何、何地以及何时应用这些工具，在渗透测试或安全评估中付出的努力将收效甚微。\n\n### 本地利用 (Local Exploits)\n\
  \n如标题所示，“本地”利用程序必须从计算机、网络设备或手机本身本地执行，并且从已建立的会话中执行。换句话说，如果渗透人员物理上坐在登录计算机的终端前，或者通过\
  \ `SSH`、虚拟专用网络 (`VPN`) 连接或远程桌面协议 (`RDP`) 会话建立隧道，那么该利用程序就被归类为本地。本地利用可以用于提升权限、导致 DoS、窃取信息或上传恶意文件。需要记住，本地利用无法跨网络执行，除非是上述描述的那些看起来像本地的连接。尝试在未具有漏洞的系统上执行代码的本地利用将导致代码失败，可能触发管理员的警报并浪费测试人员的时间。\n\
  \n关于本地利用如何真正被利用，存在一个常见的误解。本地利用并不一定由攻击者执行。通过仔细的社会工程学或其他欺骗手段，攻击者或渗透测试人员可以欺骗本地登录的用户执行本地利用。这种战术的典型例子是隐藏在看似无害的\
  \ PDF 文档中的木马后门，或嵌入 Microsoft Excel 表格的宏代码。一个带有自动启动代码的 USB 设备被方便地丢在办公大楼外，等待毫无防备的用户捡起并插入，也可以导致本地利用的执行。可能性仅限于攻击者或渗透测试人员的想象。很多时候，当远程利用失败且无法从外部建立连接时，可以通过这种方式部署本地利用，从内部向外部建立连接。\n\
  \n### 寻找本地利用\n\n理论上有成千上万种本地利用可以利用，但最初选择正确的利用可能有些困难。Rapid7 的 Metasploit 通过一个名为 `Searchsploit`\
  \ 的程序简化了这一过程，由于 Debian 7 上 Kali Linux 文件系统的特性，该过程变得更加简单。在 Metasploit 框架的命令行界面中搜索利用程序将在本章稍后讨论。介绍如何在终端窗口中使用\
  \ Searchsploit 在 Metasploit 漏洞数据库中查找利用程序。\n\n#### Searchsploit\n\n- 打开终端窗口。\n- 输入\
  \ `searchsploit` 以及最多三个关键词。\n\n示例：`root@kali~# searchsploit local windows iis` (图\
  \ 9.1)。\n\n![image](img/F000094f09-01-9780124077492.jpg)\n\n图 9.1 Searchsploit。\n\
  \n上面的搜索返回了一个结果，使用 Searchsplit 就这么简单。搜索返回了一个针对运行 IIS 并使用 PHP 5.2.0 或早期版本的 Windows\
  \ 32 位系统的动态链接库漏洞。如果执行本地利用，将触发缓冲区溢出漏洞并导致主机发生 DoS。要了解更多关于利用程序的信息，`locate` 命令的输出显示在\
  \ 图 9.2 中。\n\n![image](img/F000094f09-02-9780124077492.jpg)\n\n图 9.2 Locate。\n\n\
  ## 远程利用 (Remote Exploits)\n\n\n\n\n\n从基础操作系统外部针对计算机、网络设备、手机或服务的漏洞被视为远程漏洞（remote\
  \ exploit），这些有时也被称为网络漏洞。无论称呼为何，当漏洞被执行时，如果它不是本地的，它就是远程的。远程利用不仅针对计算机、服务器和网络设备。远程漏洞还包括攻击\
  \ Web 服务和应用程序、数据库、打印机、手机以及任何连接到网络的设备。随着越来越多的电子设备接入网络，高级攻击的可能性也随之增长。例如，游戏系统如索尼 PlayStation、微软的\
  \ Xbox、智能电视、平板电脑、音乐播放器、DVD 播放器等等。想想新汽车中嵌入的计算机系统，只要它是电子设备或连接到网络，世界上某个地方的人已经在试图黑入它了，可能只是为了好玩，但也极可能是为了盈利。本书稍后的章节将在探索\
  \ `Metasploit Framework` 的时候介绍远程漏洞。\n\n## Metasploit 概述\n\n`Metasploit` 可说是渗透测试人员工具箱中最强大的工具之一，它汇聚了全球计算机安全社区中不同领域的黑客、渗透测试人员、政府和研究人员多年来的知识和苦心尝试。从最黑暗的黑帽到世界上最著名的白帽，以及其间的任何人员，无论他们的路径如何，`Metasploit`\
  \ 在某个时刻都出现过。总部位于马萨诸塞州州波士顿的 `Rapid7` 公司不惜成本和 CPU 周期，在一个坚固的框架内生成了一系列工具，该框架方便了渗透测试方法从开始到结束的所有步骤。对于活跃活跃在该领域的专业人士，`Metasploit`\
  \ 还提供了报告模板和政府级合规性检查。如果这是你第一次使用 `Metasploit`，请准备好大眼界。\n\n## 简史\n\n起初，一切虚无……只有在错综复杂的万维网远端散落着随机的空虚和混乱工具。散乱的消息和随机代码片段位于隐藏公告板系统的阴影中。后门交易和极客们的无限制狂欢在平庸的新手和模仿者之间自由穿行。在\
  \ `NSA`（国家安全局）还没得及系好鞋带甚至数到 2600 之前，电话黑客（phreakers）就主宰这里，这是安全世界的原始西部；充斥着间谍和法外之徒……\n\
  \n嗯，并不完全如此；但离真相并不远。\n\n2003 年底，`Metasploit Framework` 的发明者和天才 `HD Moore` 发布了当时基于\
  \ `perl` 的第一个版本，该版本仅包含 11 个漏洞，以便将他的精力集中在将海量的漏洞行、漏洞代码和可用漏洞解析到一个单一易于使用的程序中。2004 年发布的第\
  \ 2 版本虽有 19 个漏洞，但包含了近 30 个有效负载（payloads）。随着 2007 年第 3 版发布，`Moore` 的项目爆发式增长，并迅速成为全球渗透测试人员的*事实标准*和必备选择。今天，`Metasploit`\
  \ 已更新到 4.7 版本，并作为基于 `ruby` 的程序集成在 `Kali Linux` 的标准配置中。在写作期间，`Metasploit` 提供超过 1080\
  \ 个漏洞、675 个辅助模块、275 个有效负载、29 种不同类型的编码器，并目标指向所有平台：微软、Linux 和 Mac。`Rapid7` 团队没有偏见，没有任何协议会不经过检查。\n\
  \n## 专业版与快捷版对比\n\n`Metasploit` 目前有两个版本。默认安装的快捷版框架是一个免费版本，面向研究人员、学生和私用目的。对于商业和政府部门的专业渗透测试人员，专业版提供了报告、小组协作、合规性检查以及用于精确控制的高级向导。专业版是收费的，因此除非\
  \ `Metasploit` 用于个人使用以外的任何用途，否则没有真正需要它。专业版和快捷版的漏洞模块是相同的。\n\n## Nexpose 与合规性\n\n\
  安全评估人员对内部政策和合规的严格繁琐的工作了如指掌。`Nexpose` 允许评估人员简化与评估公司安全状况相关的任务和风险管理。`Nexpose` 不仅仅是用\
  \ `Metasploit` 扫描漏洞。在用 `Nexpose` 进行初始扫描后，发现的漏洞将进行分析并归入风险类别，加入影响分析中，然后为了报告进行重新核实。`Nexpose`\
  \ 不仅检查漏洞，还检查合规性控制，例如与支付卡行业数据安全标准 (`PCI DSS`)、健康保险流通性与责任法案 (`HIPPA`)、北美电力可靠性协会标准\
  \ (`NERC`)、2002 年联邦信息安全管理法 (`FISMA`)、美国政府配置基准 (`USGCB`)、联邦桌面核心配置 (`FDCC`)、安全内容自动化协议\
  \ (`SCAP`) 等。\n\n### 公开 与 隐蔽\n\n公开（Overt）是指与组织合作进行渗透测试和安全态映射。在公开渗透测试中，安全测试人员可以对组织发起一波又一波的攻击，无需担心被拦截或触发任何报警。毕竟，在公开任务中，组织知道安全测试人员在那里，并且通常愿意协助测试的所有方面。公开测试最大的优势之一是，安全测试人员将获得系统及其核心功能的内部知识，并在测试期间利用它们。公开测试的缺点是范围可能有限，且高级方法可能在启动之前必须与客户沟通。有时，这可能会对完成彻底测试所需产生严重影响。\n\
  \n隐蔽（Covert）是对某个组织的测试，只有少数人员知道任何测试操作。在隐蔽测试的情况下，组织内部极少数成员（通常是 IT 经理、安全经理或更高级别）会提前知道安全测试。渗透测试人员需要熟练精通其武器库中的大量工具，以保持线路上的沉默。这类安全测试不仅是为了测试网络安全态势的漏洞，还为了测试可能存在的计算机应急响应小组\
  \ (`CERT`) 以及入侵检测系统 (`IDS`) 的效率。注意，一个事件可能从隐蔽任务开始，但由于各种原因（例如关键漏洞过多或安全测试人员的存在被发现），可能会转变为公开任务。\n\
  \n## 基础框架\n\n`Metasploit` 是一个模块化系统。为了更好地理解该框架，将 `Metasploit Framework` 看作一辆车会有帮助。框架就像詹姆斯·邦德维护良好的阿斯顿·丁底盘，为所有实际上驱动汽车的模块提供了外壳。`HD\
  \ Moore` 就像詹姆斯·邦德电影中的“Q”，在引擎周围的角落里储备了一系列装备。如果框架内的某个模块损坏或被移除，车辆仍然可以运行并继续释放一波又一波的攻击。\n\
  \n框架分为以下模块类型：\n\n1. `Exploit Modules`（漏洞模块）\n2. `Auxiliary Modules`（辅助模块）\n3. `Payloads`（有效负载）\n\
  4. `Listeners`（监听器）\n5. `Shellcode`（机器码）\n\n\n\n\n与 Metasploit 框架交互的应用程序可以被视为第六类，例如\
  \ `Armitage`；然而，这些并不是该框架本身的一部分。仅仅因为詹姆斯·邦德可以从手表控制他的车辆，并不意味着该车辆需要所有者佩戴腕表才能操作。\n\n\
  ### 利用模块 (Exploit Modules)\n利用模块是数据库中预装的代码段，当它们针对受害者计算机运行时，将尝试利用本地或远程系统上的漏洞，从而攻破系统，并允许拒绝服务攻击（DoS）、敏感信息泄露或上传特殊制的载荷模块，例如\
  \ `Meterpreter` shell 或其他类型的回连 shell。\n\n### 辅助模块 (Auxiliary Modules)\n与利用模块不同，辅助模块运行不需要使用载荷（payload）。这些类型的模块包括了实用的程序，如扫描器、模糊测试器和\
  \ SQL 注入工具。`auxiliary` 目录中的某些工具非常强大，应当谨慎使用。渗透测试人员使用 `auxiliary` 目录中大量的扫描器来对被攻击系统进行深度理解，然后过渡到利用模块。\n\
  \n### 载荷 (Payloads)\n如果说詹姆斯·邦德的阿斯顿·丁顿是 Metasploit 框架本身的参考，那么利用模块和辅助模块就像引擎盖下的火箭发射器和火焰发射器。在这种模型中，载荷可以是附加到目标上的特殊通信设备，用于维持隐蔽的通信和追踪。在针对漏洞机器使用利用时，载荷通常会在执行之前附加到利用上。该载荷包含了受害者计算机在攻破后要执行的一系列指令。载荷有许多不同的类型，范围从几行代码到如\
  \ `Meterpreter` shell 这样的小应用程序。人们不应直接跳到 `Meterpreter` shell。Metasploit 包含 200 多种不同的载荷。有针对\
  \ `NetCat`、动态链接库 (DLL) 注入、用户管理、shell 等等的载荷。像间谍一样思考思考可能会为安全测试人员在选择载荷时提供正确的心态。测试人员需要考虑利用成功后的整体目标是什么。代码是否需要保持休眠状态直到被调用？执行的代码是否需要回拨攻击者以获取进一步指令？代码是否只需要执行一系列关机命令？让受害的系统对公司毫无用处？最常见的载荷分为绑定型\
  \ shell (bind shells) 和反向型 shell (reverse shells)。\n\n### 绑定型 shell (Bind Shells)\n\
  这类 shell 处于休眠状态，等待攻击者的连接或发送指令。如果渗透测试人员知道在测试活动后期将会有系统的直接网络访问，且不想引起注意，那么绑定型 shell\
  \ 可能是更好的选择。对于位于防火墙后没有直接网络访问的受害者机器，绑定型 shell 不是一个好的选择。\n\n### 反向型 shell (Reverse\
  \ Shells)\n反向 shell 会回拨安全测试人员以获取即时指令和交互。如果被攻破机器使用反向载荷执行利用，那么测试人员将获得一个 shell 来访问机器，就像他们坐在受害者机器的键盘前一样。\n\
  \n### Meterpreter Shell\n`Meterpreter` shell 是一种特殊的 shell 类型，它是 Metasploit 的核心。Rapid7\
  \ 持续开发 `Meterpreter` shell，其自带一个极具杀伤力的微型军械库。`Meterpreter` shell 可以作为载荷添加，既可以是绑定\
  \ shell 也可以是反向 shell。本章稍后将详细讨论 `Meterpreter` shell 的使用。\n\n对于大多数新安全测试人员来说，载荷的选择往往被忽视了，因为他们急于尽快获得“root”权限并通过\
  \ `Meterpreter` shell 获得访问。有时，这并不是最优的，利用漏洞需要深度的思考过程。在隐蔽渗透测试中，火力全开、大张旗鼓无疑会点燃网络上的每一个报警。如果每次渗透敌方营地的尝试都没有任何隐秘性，詹姆斯·邦德的职业生涯将会很短暂。\n\
  \n载荷的选择并非简单地挑选其中一个。在可用的 200 多种载荷中，分为两大类：内联的 (inline) 或分阶段的 (staged)。内联载荷（或单阶段载荷）是全包含且自包含的。分阶段载荷包含多个被称为\
  \ `stagers` 的载荷部分。分阶段载荷分布在多个微小的内存空间，并等待先前的 `stager` 调用执行。最终，所有的 `stagers` 都会像百老汇戏剧“舞台”上的大戏一样被执行。如果通过名称搜索，识别内联和分阶段载荷的区别会有些棘手。例如，以下是两个性质上相似的负载载荷：\n\
  \n| `linux/x64/shell/bind_tcp` | (Staged) |\n| `linux/x64/shell_bind_tcp` | (Inline)\
  \ |\n\n在 Metasploit 控制台中，运行命令 `show payloads` 将列出所有可用载荷。最右侧的一列是对载荷功能的简要描述，并将指明该载荷是内联还是分阶段的。如果描述中没有直接说明是内联还是分阶段，则假设它是一个内联模块。\n\
  \n### 监听器 (Listeners)\n即使是强大的 007 也不得听从“M”的命令。监听器是 Metasploit 框架内特定的处理器，用于与载荷建立的会话进行交互。监听器可以嵌入绑定\
  \ shell 并静候等待连接，也可以主动坐在安全测试人员的计算机上监听入站的连接。如果不使用监听器，这种往复的通信将是不可能的。幸运的是，监听器由 Metasploit\
  \ 程序处理，需要的交互很少。\n\n### Shell 码 (Shellcode)\nShellcode 本身并不是一个独立的模块，而是更多是嵌入在 Metasploit\
  \ 框架可用载荷中的子模块。就像从邦德阿斯顿·丁顿发射的导弹内部的实际爆炸物一样，载荷内部的 shellcode 更类似于爆炸物。shellcode 是内部的投送系统，它实际上负责产生漏洞、上传恶意代码并执行载荷内部的命令以生成\
  \ shell，因此名为 shellcode。并不是所有载荷都包含 shellcode。例如，载荷 `windows/adduser` 仅仅是一系列旨在在 Windows\
  \ 平台上生成用户或管理员账户的命令。\n\nShellcode 深入到了编程世界，这世界对于新测试人员来说可能非常困惑。本书将不会详细介绍 shellcode\
  \ 的编写。作者建议向 Offensive Security 或 SANS Institute 寻求培训课程。如果课程不适合你，Google 是你的好朋友。\n\
  \n## 访问 Metasploit\n访问 Metasploit 有多种方式。在建立起对 Metasploit 能力和控制的坚实基础之前，建议使用图形界面。通过从主菜单中选择\
  \ `Metasploit Community/Pro` 访问 GUI：\n\n*Applications → Kali → Exploitation → Metasploit\
  \ → Metasploit Community/Pro*\n\n或者，用户可以使用 Web 浏览器并导航到：`https://localhost:3790/`。Metasploit\
  \ 没有有效的安全认证。在不偏离 IceWeasel 默认设置的情况下，测试人员将收到“连接不可信”的错误消息。点击“I Understand the Risks”，然后点击“Add\
  \ Exception”。在提示时，点击“Confirm Security Exception”按钮继续。\n\n\n\n\n\n首次运行 Metasploit\
  \ 将会提示测试人员设置用户名和密码。还有第二组可选参数可用。第二组参数将用于 Metasploit 内部的报告功能。完成后，点击“创建账户”（Create Account）按钮继续。\n\
  \n## 启动/停止服务\n\n有时有必要重启 Metasploit 服务。Metasploit 非常消耗资源，许多服务依赖于网络的稳定性。如果计算机上的资源不足，或者安全测试人员遇到网络错误，最好尝试重启服务。先从检查服务的状态开始。在终端窗口中，测试人员可以向\
  \ Metasploit 服务发出 `start`、`restart` 和 `stop` 命令（图 9.3）。\n\n![image](img/F000094f09-03-9780124077492.jpg)\n\
  \n图 9.3 检查 Metasploit 服务状态。\n\n```\nservice metasploit status\n```\n\n重启服务（图 9.4）：\n\
  \n![image](img/F000094f09-04-9780124077492.jpg)\n\n图 9.4 重启 Metasploit。\n\n```\n\
  service metasploit restart\n```\n\n停止服务（图 9.5）：\n\n![image](img/F000094f09-05-9780124077492.jpg)\n\
  \n图 9.5 停止 Metasploit 服务。\n\n```\nservice metasploit stop\n```\n\n## 更新数据库\n\nMetasploit\
  \ 不仅由 Rapid7 开发，社区用户也会对该程序的各个方面进行持续更新。建议在每次使用之前都更新 Metasploit 数据库。没人会认为詹姆斯·邦德会在执行任务前不检查他的瓦尔特\
  \ P35 手枪以确保弹匣满。对我们其他人来说，幸运的是，新更新没有七天的等待期。从终端执行：\n\n```\nmsfupdate\n```\n\n现在可以坐下等待了。是的，就这么简单。拿上你枪的子弹，开始执行吧。如果安全测试人员已经在\
  \ Metasploit Web 界面中，从 Metasploit 网页右上角选择“软件更新”（Software Updates）。在随后的屏幕上选择“检查更新”（Check\
  \ for Updates）。\n\n如果有可用更新，Metasploit 将立即下载并安装。更新完成后，建议重启 Metasploit 服务。关闭浏览器，重启，然后重新打开\
  \ Metasploit Web 界面（图 9.6）。\n\n![image](img/F000094f09-06-9780124077492.jpg)\n\n\
  图 9.6 Metasploit 登录。\n\n## 使用 Metasploit 进行扫描\n\n既然“Q”为你的阿斯顿马丁配备了足够杀死一支小型网络军队的弹药，且可靠的瓦尔特\
  \ P35 已经就绪，是时候开始扫描了。登录 Metasploit Web 界面后，安全测试人员会看到一个“任务”落地页。该页面包含当前项目列表（或任务文件夹）、当前目标的档案以及发现的可能漏洞。安全测试人员首次登录时，列出的项目只有“默认”（default）。当安全测试人员开始更多任务时，可以通过点击“新项目”（New\
  \ Project）按钮创建新的项目文件夹。在熟悉 Metasploit 界面期间，建议新安全测试人员使用默认项目。这将更容易过渡到高级功能，例如直接操作界面或从\
  \ `NMAP` 或 `Nessus` 导入结果。\n\n打开默认项目后，测试人员可以看到其布局实际上符合任务档案的概念：发现、渗透、证据收集、清理以及一个用于跟踪每一个动作的近期事件列表（图\
  \ 9.7）。\n\n![image](img/F000094f09-07-9780124077492.jpg)\n\n图 9.7 Metasploit 网页。\n\
  \n## 使用 Metasploit\n\n接下来的几个章节应作为实操练习，用于扫描在本书之前创建的 Metasploitable2 虚拟机。本书假设 Metasploitable2\
  \ 虚拟机已配置了 IP 地址 `192.168.56.101` 并可以通过网络接口访问。攻击机（*又名阿斯顿马丁*）已配置了 IP 地址 `192.168.56.100`。\n\
  \n要开始扫描主机或网络，请从“发现”（Discovery）部分选择“扫描...”（Scan...）按钮。“目标设置”（Target Settings）部分的输入主机、主机组或范围的结构与\
  \ `NMAP` 和 `Nessus` 相同。测试人员可以输入单个 IP 地址（带或不带 CIDR 表示法），列出一组主机（如 `192.168.1.100-200`），或输入整个范围（如\
  \ `192.168.1.0/24`）。所有其他单独 IP 地址、组或网络应放在后续行的“目标地址”（Target addresses）框中。\n\n在点击“显示高级”（Show\
  \ Advanced）按钮后出现的“目标设置”中：\n\n1. **排除地址（Excluded Addresses）**：此区块中的任何 IP 地址将被排除扫描。确保将攻击机和任何团队的\
  \ IP 地址放在框内。\n2. **执行初始扫描（Perform Initialscan）**：如果是首次扫描主机或网络，请勾选此项。\n3. **自定义 NMAP\
  \ 参数（Custom NMAP Arguments）**：指定冷门端口、IDS 规避以及涉及自定义模块的其他情况。\n4. **附加 TCP 端口（Additional\
  \ TCP Ports）**：当 Metasploit 扫描启动时，会针对非常常见的端口。\n5. **排除 TCP 端口（Exclude TCP Ports）**：特别是对于团队，划分端口分配可以缓解有时艰巨的漏洞扫描任务。列出要排除的端口。\n\
  6. **自定义 TCP 端口范围（Custom TCP Port Range）**：在最小和最高端口之间使用连字符 `-` 指定端口范围。例如`(1-1024)`。\n\
  7. **自定义 TCP 源端口（Custom TCP Source Port）**：即使是詹姆斯·邦德偶尔也需要伪装。指定不同的源端口对于绕过防火墙的安全控制和访问控制列表很有用。\n\
  \n任务是扫描 Metasploitable2 虚拟机。在“目标地址”框中输入 IP 地址。然后点击“启动扫描”（Launch Scan）按钮。虽然 Metasploit\
  \ 非常高效，但后台会有大量的进程在运行（图 9.8）。\n\n![image](img/F000094f09-08-9780124077492.jpg)\n\n\
  图 9.8 扫描 Metasploitable2 完成。\n\n扫描完成后，点击网站顶部维护栏中的“概览”（Overview）选项卡。在“发现”部分，扫描了一个主机，它拥有\
  \ 30 多个服务和至少 1 个漏洞。需要注意的是，这些结果仅是通过 Metasploit 运行一次得到的。如果执行了自定义扫描，可能会发现更多漏洞。此时尚未运行\
  \ `Nexpose` 进行合规性检查。实验、享受、利用。\n\n\n\n\n\n点击网站顶部维护栏上的“Analysis（分析）”标签。在此页面上，将显示所有扫描的主机以及带有扫描结果的简要摘要。点击主机的\
  \ IP 地址可更多信息（图 9.9）。\n\n![image](img/F000094f09-09-9780124077492.jpg)\n\n图 9.9 分析标签页视图。\n\
  \n图 9.10 展示了 Metasploit 识别出的服务的详细分类和简单说明。该主机档案包含六个主要部分：服务（Services）、漏洞（Vulnerabilities）、文件共享（File\
  \ Shares）、备注（Notes）、凭据（Credentials）和模块（Modules）。\n\n* **Services**——就好像执行侦察任务的詹姆斯·邦德一样，主机提供了关于系统初始预期的大量数字信息。服务信息（Service\
  \ Information）部分中的数据可以识别出软件、版本号和敏感信息。某些服务链接到它们自己的记录，因为捕获了额外数据并可供查看。\n* **Vulnerabilities**——主机上的漏洞按其即将被利用或攻破（pwn’d）的顺序列出。此包含的漏洞与\
  \ Metasploit 框架内的漏洞模块直接相关。\n* **File Shares**——（如果有）接口的此部分显示了广告的共享。手动检查 Metasploit\
  \ 内的扫描日志很重要，以确保没有遗漏。Linux 机器可以有“导出”或“共享”目录；但 Linux 不像微软平台那样发布它们。*这在 Metasploitable2\
  \ 中实际上是这样的，根文件夹 `/` 等内容是可用的但未列出。*\n* **Notes**——此部分列出了扫描期间发现的任何类型的安全设置、枚举用户、服务账户、共享和导出。在“Shares（共享）”部分的底部有一个非常有趣的彩蛋可以玩。祝开启这段旅程的渗透测试人员狩猎得当。\n\
  * **Credentials**——扫描期间捕获的任何凭据都将列在此部分以供检查。\n* **Modules**——模块部分不仅与漏洞模块直接对应，它还在每个发现的漏洞标题后提供了一个启动平台。点击超链接将自动启动会话并尝试利用主机。\n\
  \n![image](img/F000094f09-10-9780124077492.jpg)\n\n图 9.10 目标分析摘要。\n\n点击漏洞“Exploit:\
  \ Java RMI Server Insecure Default Configuration Java Code Execution（利用：Java RMI\
  \ 服务器不安全的默认配置 Java 代码执行）”旁边的“Launch（启动）”超链接。网站将跳转到一个描述漏洞的页面，这非常适合详细分析报告，然后会自动填充继续执行漏洞所需的数据。默认情况下，Metasploit\
  \ 将尝试使用通用负载和 Meterpreter shell 加 code。在检查设置后，点击底部的“Run Module（运行模块）”按钮（图 9.11）。\n\
  \n![image](img/F000094f09-11-9780124077492.jpg)\n\n图 9.11 启动攻击。\n\n成功！主机上创建了 1 个会话。这意味着主机已成功攻破，漏洞已被利用。顶部维护栏上的“Sessions（会话）”标签名称旁边有一个可见的\
  \ #1，表示我们可以与在被利用时留存在机器上的 Meterpreter 会话进行交互。点击“Sessions”标签查看邦德先生的所有活动会话。任务还没有结束（图\
  \ 9.12）。\n\n![image](img/F000094f09-12-9780124077492.jpg)\n\n图 9.12 活跃会话。\n\n在“Session（会话）”网页内部，列出了所有会话，以及可用于交互的\
  \ shell 类型和描述，描述中通常包含可访问的账户（或级别）。点击 Session 1 的超链接将打开与 Meterpreter shell 的基于网页驱动的交互。\n\
  \n## Meterpreter—会话管理\n\n感谢“Q”和 Rapid7 开发团队设计了如此精简的系统。如果需要，安全测试人员可以在这里访问命令行 shell；然而，许多高级功能（如创建枢纽点代理）现在是按钮驱动的。可用的操作可以加速利用管理。\n\
  \n在时间和执行之间需要获得精细的平衡。考虑到这只是针对 Metasploitable2 虚拟机其中一个漏洞的引导演示，无需担心时间；但是，就像邦德一样，在实际任务中时机可能是关重要的。过多的错误步骤可能会触发报警，而不采取行动则可能导致会话丢失。\n\
  \n查看图 9.13，安全测试人员不仅可以看到可用操作，还可以看到会话历史和后渗透模块标签页。通过此会话进行的任何操作都会被记录，以保持连续性。这些信息可以在以后撰写报告时导出。\n\
  \n![image](img/F000094f09-13-9780124077492.jpg)\n\n图 9.13 会话管理。\n\n### 会话内部的操作\n\
  \n1. **Collect System Data（收集系统数据）**——收集系统证据和敏感数据（截图、密码、系统信息）。如果真的有一个“一站式购物”功能，这个按钮就是它了。截图的过程对于报告来说是一个非常强大的工具。就像邦德为“M”拍摄照片证据一样，在经理眼中，一画胜过万言。并不是每个会话都能访问\
  \ root 或域管理员账户；因此，提取系统信息也是首要任务，因为它让测试人员更深入地了解网络上的其他内容，例如可能的数据库、其他网络等。\n2. **Access\
  \ File system（访问文件系统）**——浏览远程文件系统并上传、下载和删除文件。记忆很好，但数字是永的。备份、配置、个人文档是金子。如果机器上运行着\
  \ Web 服务器，尝试上传 `C99 shell`、键盘记录器、后门、木洛马和其他“美味”的工具。*只是个建议：不要在这里留下你的简历。*\n3. **Command\
  \ Shell（命令行 shell）**——与目标上的远程命令行 shell 交互（高级用户）。如果在利用期间无法获得 root 或管理员账户，安全测试人员最终将卷起袖子，在命令行中大干一场场。\n\
  4. **Create Proxy Pivot（创建代理枢纽）**——使用远程主机作为网关进行枢纽攻击。仅仅因为邦德闯入并进入地下秘密实验室，并不意味着他只是微笑然后离开；他会更深入地探索。Metasploitable2\
  \ 虚拟机是一个独立系统；但如果它是一个网络边缘的系统，那么该主机将成为桥头，用于建立策略并最终引导进一步进入系统的其他攻击。从这台机器开始，黑客方法重新开始，从侦察开始。\n\
  5. **Create VPN Pivot（创建 VPN 枢纽）**——通过远程主机中转流量。与“Create Proxy Pivot”按钮区别不大，只是所有流量现在将通过加密的\
  \ VPN 隧道传输。这对于规避入侵检测特别有用。\n6. **Terminate Session（终止会话）**——在一切完成后，邦德最终得到了女孩并离开了行动现场。此按钮将终止会话，但只会移除\
  \ Meterpreter shell。如果安全测试人员留下了任何文件、根内核、键盘记录器等，那么系统中仍然存在被攻破点。在终止会话之前，请在完成测试后清理所有文件和服务。\n\
  \n\n\n\n\n在图 9.14 中，选择了“可用操作”（Available Actions）菜单中的“访问文件系统”（Access File system）按钮。安全测试人员在文件系统中的权限级别与被破解的账户相同。考虑到执行的\
  \ Java 漏洞是以 root 身份获取访问的，那么整个文件系统已攻破并准备好被掠夺。\n\n![image](img/F000094f09-14-9780124077492.jpg)\n\
  \n图 9.14 访问文件系统。\n\n#### 命令 Shell (Command Shell)\n\n在图 9.15 中，选择了“可用操作”菜单中的“命令\
  \ Shell”（Command Shell）按钮。会话最初为安全测试人员提供一个 Meterpreter shell，而不是 Linux 或 Windows\
  \ 命令行 shell。在测试人员熟悉 Meterpreter shell 之前，建议在提示符处运行 `help` 命令并熟悉 shell 内的命令。要进一步进入系统并在物理机上获得直接\
  \ shell，请在 Meterpreter 的命令行界面上输入 `shell`。\n\n![image](img/F000094f09-15-9780124077492.jpg)\n\
  \n图 9.15 命令 Shell。\n\n#### 后渗透模块 (Postexploitation Modules)\n\n这些模块非常手手，可以自动化许多为了维持持续访问所必需的正常功能，例如收集密码、PKI\
  \ 证书、投放键盘记录器以及通过可能连接的麦克风进行窃听。在左侧，列出了每个模块支持的操作系统。点击右侧的模块超链接通过会话激活该模块。\n\n例如，导航到“Multi\
  \ Gather OpenSSH PKI Credentials Collection”并点击网页右侧的超链接。与之前的漏洞利用模块一样，这里提供了该模块的详细概述，并在底部有一个“运行模块”（Run\
  \ Module）按钮。见图 9.16。\n\n![image](img/F000094f09-16-978012407749.jpg)\n\n图 9.16 多路收集\
  \ OpenSSH PKI。\n\n点击“运行模块”按钮。见图 9.17。\n\n![image](img/F000094f09-17-9780124077492.jpg)\n\
  \n图 9.17 运行模块。\n\n从图 9.17 中，安全测试人员可以观察到 SSH PKI 凭据的复制。所有下载的文件将存储在 `/opt/metasploit/apps/pro/loot`\
  \ 目录下（图 9.18）。\n\n![image](img/F000094f09-18-9780124077492.jpg)\n\n图 9.18 战品 (Loot)。\n\
  \nMetasploitable2 虚拟机故意留满了漏洞，绝不应作为基础操作系统使用。花些时间回顾刚才演示的技能，看看可以发现多少漏洞。\n\n## Web 服务器与\
  \ Web 应用程序漏洞利用\n\n软件就是软件，就是软件。无论应用程序代码以何种形式打包；或者它承担什么功能，都可能存在漏洞。Web 应用程序也不无例外，只是对于\
  \ Web 服务，有更多面向互联网的公开注入点，允许攻击者可能进入网络系统、篡改网站或窃取敏感信息。仅保护操作系统是不够的。如果运行在服务器上的服务本身不安全，那么物理安全以及加固操作系统花费的时间和精力都将是徒劳。\n\
  \n### OWASP\n\n开放 Web 应用程序安全项目（OWASP）是一个致力于改进软件安全的非营利组织。OWASP 每年发布一份 Web 前 10 常见漏洞列表。在\
  \ 2013 年，前 10 种漏洞是：\n\n- A1—注入 (Injection)\n- 这包括 SQL、OS 和 LDAP 注入。\n- A2—破坏的身份验证和会话管理\
  \ (Broken Authentication and Session Management)\n- A3—跨站脚本 (XSS)\n- A4—不安全的直接对象引用\
  \ (Insecure Direct Object References)\n- A5—安全配置错误 (Security Misconfigurations)\n\
  - A6—敏感数据泄露 (Sensitive Data Exposure)\n- A7—缺少功能级访问控制 (Missing Function Level Access\
  \ Controls)\n- A8—跨站请求伪造 (CSRF)\n- A9—使用已知漏洞的组件 (Using Components with Known Vulnerabilities)\n\
  - A10—未验证的重定向和转发 (Unvalidated Redirects and Forwards)\n\n更多信息：[`www.owasp.org/index.php/Category:OWASP_Top_Ten_Project`](https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project)。\n\
  \n除了发布报告外，OWASP 还通过由每个地区安全成员组成的本地分会来提高意识。OWASP 分会遍布全球。分会讨论测试方法论、开展培训、开发安全的 Web 应用程序等。成为本地分会的成员只需参加小组会议即可。访问\
  \ OWASP 网站并点击“分会”（Chapters）链接以搜索你所在地区的小组。\n\n### 测试 Web 应用程序\n\nKali Linux 拥有大量随手可用的工具，但只有当这些工具被正确且按正确的顺序使用时，其实力才能体现出来。测试\
  \ Web 应用程序时，其测试方法与黑客方法的前三个阶段无异：侦察（recon）、扫描和漏洞利用（exploitation）。在某些情况下，第四和第五阶段分别是维持访问和掩盖踪迹；但并非总是如此。此外，网站上的每个页面都需要测试，而不仅仅是首页和登录页。仅仅因为网站的登录是安全的，并不意味着门已经关闭且测试已经结束，去找窗户吧。如果窗户锁着，就用砖头砸碎它。今天攻击者有许多利用网站的途径，测试过程中不能忽略任何一个死角。\n\
  \n### 第 1 步—手动审查\n\n端口扫描可能会返回 80 端口的 HTTP 服务已开放，但这并不意味着那里真的有一个网站。打开浏览器并导航到该网站，以验证\
  \ Web 服务确实在提供页面。这不仅针对 80 端口，端口扫描可能会返回 80 和 443 端口之外许多端口上的多个 Web 服务。点通过网站上所有的链接，因为可能已经可以访问到敏感信息。如果收到访问控制的提示（例如询问用户名和密码的弹出窗口），尝试进行短范围的密码猜测（不超过\
  \ 10 次）或按 escape 键查看是否可以直接绕过身份验证。打开每个网站的源代码并检查开发者的注释。这个过程可能是无聊且漫长的，但最终没有任何自动化工具可以识别所有漏洞。手动审查每个\
  \ Web 页面是关重要的第一步。\n\n### 第 2 步—指纹识别 (Fingerprinting)\n\n手动审查网站并不总是告诉你 Web 应用程序、Web\
  \ 服务器和基础操作系统是什么。可以使用 Kali Linux 中的指纹识别确定确定三者。\n\n##### NetCat (`nc`)\n\nNetCat 可以作为指纹识别工具，也可以作为传入连接的监听设备。对\
  \ Web 应用程序进行指纹识别时，语法为：\n\n`nc {host} {port}`\n\n```\n:example: nc 192.168.56.102\
  \ 80\n```\n\n这将与 192.168.56.102 上的 Web 服务器建立连接，但在通过连接向 Web 服务器发送命令之前，不会有任何返回。NetCat\
  \ 有不同的指纹识别技术。下面的示例将返回简单请求的结果，并允许我们确定 Web 服务器及其操作系统。首先打开一个终端窗口（图 9.19）。\n\n```\n\
  nc 192.168.56.102 80\n\n按下 Enter\n\nHEAD / HTTP/1.0\n\n连续两次 Enter 键。\n```\n\n![image](img/F000094f09-19-9780124077492.jpg)\n\
  \n图 9.19 NetCat 指纹识别\n\n从返回的结果可以确定 Web 服务器是运行在 Ubuntu Linux 上的 Apache 2.2，并且安装了\
  \ PHP 版本 5.2.4-2ubuntu5.10。了解这些信息将帮助渗透人员缩小针对 Web 服务器的攻击范围。\n\n##### Telnet (`telnet`)\n\
  \n与 NetCat 一样，Telnet 可以完全相同的方式确定系统信息（图 9.20）。\n\n`telnet {ipaddress} {port}`\n\n\
  ```\n:example: telnet 192.168.56.102:80\n```\n\n![image](img/F000094f09-20-9780124077492.jpg)\n\
  \n\n\n\n图 9.20 Telnet 指纹识别。\n\n### SSLScan\n\n当网站拥有 SSL 证书时，确定是否使用了哪些 SSL 加密方法始终是一个好主意。`sslscan`\
  \ 会查询 SSL 服务是否存在 `SSLv2`、`SSLv3` 和 `TLSv1`，确定任何首选的加密算法，并返回 Web 服务器的 SSL 证书。此证书可以用于本书范围之外更高级的攻击。\n\
  \n`sslscan {ipaddress}:{port}`\n\n示例：`sslscan 192.168.56.102:8080`\n\nMetasploitable2\
  \ 目前尚没有任何带有 SSL 的服务。\n\n### 第 3 步—扫描\n\n自动化扫描可以大大缩短识别任何系统中漏洞的时间。有很多设计用于扫描 Web 服务器的应用程序，但不要仅依赖某一个应用程序。没有任何一个系统可以涵盖成千上万次的安全检查以发现系统中所有的漏洞。确保至少运行两个或三个工具，以建立系统的漏洞建立良好的基准。\n\
  \n在自动化扫描方面，安全行业有几个领先者。诸像 `Nessus`、`Retina` 和 `WebInspect` 这样的巨头是非常优秀的程序，但可能很高。`Kali\
  \ Linux` 部署了许多轻量且强大的替代方案。\n\n### Arachni—Web 应用安全扫描框架（更多信息：[`www.arachni-scanner.com/`](http://www.arachni-scanner.com/)）\n\
  \nArachni Web 应用扫描器是一个密集型工具，其 Web 界面与 Tenable 的 `Nessus` 非常。然而，与 `Nessus` 不同，`Arachni`\
  \ 每次只能对一个主机的一个端口进行扫描。如果一个主机上运行了多个 Web 服务且未通过该端口提供，则必须分别启动重复扫描。例如，[`www.random-company.com/`](http://www.random-company.com/)\
  \ 在 80 端口托管 Web 服务，在 443 端口 (HTTPS) 托管 `phpMyAdmin`，则必须运行两次 `Arachni` 扫描器。它不是那种启动后就不不管的系统。`Arachni`\
  \ 还具有高度可配置的结构。`Arachni` 的插件和设置允许精确扫描，且所有插件默认均启用。报告生成非常简单，并可以格式化为许多不同的输出类型。\n\n###\
  \ 使用 Arachni Web 应用扫描器\n\n点击 Applications → Kali Linux → Web Applications → Web\
  \ Vulnerability Scanners → `arachnid_web`\n\n启动的终端窗口表示 `Arachni` 的 Web 服务已启动（图 9.21）。打开\
  \ `IceWeasel` 并导航到 [`127.0.0.1:4567`](http://127.0.0.1:4567) 访问 WebUI（图 9.22）。\n\
  \n![image](img/F000094f09-21-9780124077492.jpg)\n\n图 9.21 启动 Arachni 服务。\n\n![image](img/F000094f09-22-9780124077492.jpg)\n\
  \n图 9.22 Arachni 网页。\n\n要对 Metasploitable2 虚拟机启动扫描，在 URL 文本框中输入 [`192.168.56.102`](http://192.168.56.102)\
  \ 并点击 Launch Scan 按钮（图 9.23）。\n\n![image](img/F000094f09-23-9780124077492.jpg)\n\
  \n图 9.23 使用 Arachni 进行扫描。\n\n当扫描器运行时，该进程附加到一个分发进程（dispatch process）。多个分发器可以同时运行。如果有更多需要测试的\
  \ Web 服务，返回 Start a Scan 标签页并启动另一个扫描。如果 `IceWeasel` 关闭或多个扫描同时运行，打开浏览器并导航到 `Arachni`，然后点击\
  \ Dispatchers 标签页与每个进程交互。\n\n扫描完成后，`Arachni` 将自动切换到 Reports 标签页。从这里，渗透人员可以将报告输出为几种不同的格式。与扫描器一样，`Arachni`\
  \ 也会为运行的每个分发器保持独立的报告（图 9.24）。\n\n![image](img/F000094f09-24-9780124077492.jpg)\n\
  \n图 9.24 Arachni 报告。\n\n报告确实提供了扫描结果的条形图和饼图，如 图 9.25 所示。\n\n![image](img/F000094f09-25-9780124077492.jpg)\n\
  \n图 9.25 按类型划分的漏洞。\n\n`Arachni` 将报告分为两个子。第一个标记为“Trusted”（信任），第二个标记为“Untrusted”（不可信）。被归类为信任的漏洞被认为是准确的（或正向）发现，因为扫描器认为它们可靠。被归类为不可信的漏洞可能是误报，需要验证。\n\
  \n### w3af—Web 应用攻击框架（更多信息：[`w3af.org/`](http://w3af.org/)）\n\n`w3af` 是另一个轻量且强大的漏洞扫描器。`OWASP_TOP10`\
  \ 等许多预配置配置已可用。`w3af` 被设计用于对插件进行细粒度控制。即使选择了预配置配置，在启动扫描前也可以对插件进行调整。如果没有 Internet 访问，执行扫描可能会出现错误。如果有\
  \ Internet 连接，`w3af` 会获取更新的插件安全检查。点击 Applications → Kali Linux → Web Applications\
  \ → Web Vulnerability Scanners → `w3af`（图 9.26）\n\n*(注，重新重新，重新部分。：\n\n### w3af—Web\
  \ 应用攻击框架（更多信息：[`w3af.org/`](http://w3af.org/)）\n\n`w3af` 是另一个轻量且强大的漏洞扫描器。`OWASP_TOP10`\
  \ 等许多预配置配置已可用。`w3af` 被设计用于对插件进行细粒度控制。即使选择了预配置配置，在启动扫描前也可以对插件进行调整。如果没有 Internet 访问，执行扫描可能会出现错误。如果有\
  \ Internet 连接，`w3af` 会获取更新的插件安全检查。\n\n点击 Applications → Kali Linux → Web Applications\
  \ → Web Vulnerability Scanners → `w3af`（图 9.26）\n\n*(注：由于原文文本中 w3af 部分似乎存在重复或逻辑混乱，此处将根据提供的英文原文严格逐行翻译。)*\n\
  \n**修正后的 w3af 部分翻译（基于提供的原文）：**\n\n### w3af—Web 应用攻击框架（更多信息：[`w3af.org/`](http://w3af.org/)）\n\
  \n`w3af` 是另一个轻量且强大的漏洞扫描器。`OWASP_TOP10` 等许多预配置配置已可用。`w3af` 被设计用于对插件进行细粒度控制。即使选择了预配置配置，在启动扫描前也可以对插件进行调整。如果没有\
