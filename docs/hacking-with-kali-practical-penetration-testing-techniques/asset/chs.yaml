  \      g.vi.3. 位置=`Beginning`（起始）\n      g.vi.4. 用作 (格式=`Ext4 Journaling File System`\
  \ Ext4 日志文件系统)\n      g.vi.5. 挂载点={留空此字段}\n   g.vii. 点击 > `OK`（确定）\n   ***这将创建 /dev/sda1，稍将用于安装\
