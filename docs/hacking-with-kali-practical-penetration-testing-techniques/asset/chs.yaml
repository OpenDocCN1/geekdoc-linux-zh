  \    g.xiv.3. 位置=`End`（结束）\n      g.xiv.4. 用作 (格式=`Ext4 Journaling File System`\
  \ Ext4 日志文件系统)\n      g.xiv.5. 挂载点={}\n   g.xv. 点击 > `OK`（确定）\n   ***这将创建 /dev/sda3，稍将用于安装\
  \ Kali Linux。***\n   g.xvi. 选择位于 `/dev/sda` 下方的“free space”。\n   g.xvii. 点击 `(+)`\
  \ 添加新分区。\n   g.xviii. 选择以下设置：\n      g.xviii.1. 类型=`Primary`（主分区）\n      g.xviii.2.\
  \ 分区大小={所有剩余空间}\n\n\n\n\na.i. （注意：如果使用不同版本的 Ubuntu，请选择合适的 VirtualBox。）\n\nb. 输入>\
  \ `sudo dpkg -i ~/archive/virtualbox*_{version}*.deb`\n\nc. 成功完成后；跳到第 9 步。\n\nd.\
  \ （仅当文件不存在时）为已安装的 Ubuntu 版本下载 VirtualBox；\n\nd.i. 位于：[`www.VirtualBox.org/wiki/Linux_Downloads`](https://www.VirtualBox.org/wiki/Linux_Downloads)\n\
  \nd.ii. 为系统当前安装的 Ubuntu 版本选择 AMD64 选项。\n\nd.ii.1. 如需验证已安装的操作系统版本，输入> `cat /etc/os-release`\n\
  \ne. 下载下载完成后（假设已保存到 `~/Downloads`）\n\ne.i. 输入> `sudo dpkg -i ~/Downloads/virtualbox-[version].deb`\n\
  \nf. 安装成功后，输入> `virtualbox &`\n\nf.i. 验证 VirtualBox 是否正确启动。\n\ng. 将下载的包保存到您的存档目录以备后用。\n\
  \n# 9. 使用 Kali Linux 1.0.5 准备构建目录\n\na. 将 Kali Linux 介质放入光驱驱动器（应会自动挂载）。\n\nb. 将磁盘的所有内容复制到构建目录。输入>\n\
  `cp -abpr /media/{username}/Kali\\ Linux ~/build/DVD64`\n\nb.i. 请密切注意斜杠。上面的命令会将\
  \ Kali Linux 磁盘视为文件夹并运行归档复制。如果斜杠位置不对，某些文件将被跳过。\n\nb.ii. 此过程可能需要 2 到 30 分钟，取决于您的硬件配置。\n\
  \nc. 检查完整性。输入> `ls -al ~/build/DVD64/`\n\nc.i. 寻找 `.disk` 文件夹。这将所有文件已成功传输的有力证明。\n\
  \n至此完成了在 Ubuntu 12.10 上设置 Tribal Chicken，并为稍后刻录时准备 Kali Linux 1.0.5 介质的准备。本指南的其余部分将侧重于通过良好的应用程序基础和推荐的自定义来设置\
  \ Kali Linux。\n\nTribal Chicken 可用于创建 Kali Linux 和 Backtrack 之外的自定义版。如需使用非 Kali\
  \ Linux 的操作系统，请删除构建目录内的 DVD64 文件夹并重复上述第 8 步。\n\n## 安装 Kali Linux 1.0.5\n\n1. 安装\
  \ Kali Linux 到 (/dev/sda1)\n\n（此步骤假设您正从 Ubuntu 12.10 安装内部启动，已完成第 8c 步，且 Kali Linux\
  \ 介质仍在光驱驱动器中。）\n\na. 重启机器到 Kali Linux 介质。从当前的 Ubuntu 终端窗口，输入> `sudo reboot`\n\n\
  a.i. 如果在 VMWare Player 中构建，按“ESC”进入启动菜单并选择从 CD-ROM 启动。\n\nb. 在启动菜单中选择> Graphical\
  \ Install（图形化安装）。\n\nc. 选择合适的语言。点击> Continue（继续）。\n\nd. 选择合适的位置。点击> Continue（继续）。\n\
  \ne. 选择合适的键盘设置。点击> Continue（继续）。\n\nf. 为计算机命名。假设为：`kali`。点击> Continue（继续）。\n\ng.\
  \ 如果可用，指定域名。假设为：`{blank}`。点击> Continue（继续）。\n\nh. 为 root 设置密码。假设为：`toor.`。点击> Continue（继续）。\n\
  \ni. 选择合适的时区。点击> Continue（继续）。\n\nj. 选择> Specify Partition Manually (Advanced)手动指定分区（高级）。点击>\
  \ Continue（继续）。\n\nk. 选择安装 Kali Linux 的分区。\n\nk.i. 双击> `/dev/sda1 (#1)`\n\nk.i.1.\
  \ 将出现一个辅助窗口。\n\nk.ii. 双击> “Use as:”（用途：）并将文件系统设置为 `ext4.`。点击> Continue（继续）。\n\n\
  k.iii. 双击> “Format the partition”（格式化分区）。\n\nk.iii.1. 此设置将变为“yes, format it”（是的，格式化它）。\n\
  \nk.iv. 双击> “Mount Point:”（挂载点）并选择 `/ - the root file system.`。点击> Continue（继续）。\n\
  \nk.v. 选择> “Done setting up the partition”（分区完成）。点击> Continue（继续）。\n\nk.vi. 选择>\
  \ “Finish partitioning and write changes to disk”（完成分区并将更改写入磁盘）。点击> Continue（继续）。\n\
  \nl. 选择> “Yes”（是）。点击> Continue（继续）。\n\nl.i. 此过程将需要几分钟。\n\nm. 选择> “Yes” 使用网络镜像。点击>\
  \ Continue（继续）。\n\nn. 如果将使用 HTTP 代理，输入相关信息（通常为空）。点击> Continue（继续）。\n\no. 选择> “Yes”将\
  \ GRUB 引导加载程序安装到主引导记录。点击> Continue（继续）。\n\np. 选择> “Yes”将时钟设置为 UTC。点击> Continue（继续）。\n\
  \nq. 安装完成后。点击> Continue（继续）。\n\nq.i. 磁盘将弹出且系统将重启。默认的 GRUB 菜单项现在已设置为自动启动 Kali Linux。\n\
  \n2. 当提示登录时，默认登录信息为：\n\na. 用户名：`root`\n\nb. 密码：`toor`\n\n# 3. 配置网络\n\na. 点击屏幕左上角的\
  \ gnome-terminal 图标启动终端窗口。\n\nb. 输入> `ifconfig –a`\n\nc. 如果启用了 DHCP 且计算机已连接，，应该至少有一个获取到\
  \ IP 地址的网络接口。跳到第 4 步。\n\nd. 如果您的网络未启用 DHCP：输入> `ifconfig eth0 {IP_address}/{Cider_Notation}`\
  \ 或 `{Subnet_Mask}`\n\ne. 输入> `route add default gateway {Your Gateway’s IP Address}`\n\
  \nf. 输入> `echo nameserver 8.8.8.8 >> /etc/resolv.conf`\n\nf.i. （您可以向此文件最多两个名称服务器条目。）\n\
  \nf.ii. 输入> `echo nameserver {IP_address} >> /etc/resolv.conf`\n\n# 4. 添加 Bleeding\
  \ Edge APT 仓库\n\na. 输入> `echo deb[`repo.kali.org/kali`](http://repo.kali.org/kali)kali-bleeding-edge\
  \ main >> /etc/apt/sources.list`\n\na.i. Bleeding Edge 包将为测试人员提供最新的可用软件包和补丁。\n\n\
  # 5. 更新 APT 软件包和列表\n\na. 输入> `apt-get update && apt-get –y upgrade && apt-get -y\
  \ dist-upgrade`\n\na.i. （注意：取决于您的网络连接，此命令可能需要运行多次。）\n\nb. 输入> `apt-get autoremove`\n\
  \nb.i. 这将清理任何确定需要卸载的包。\n\n# 6. 安装额外的软件包\n\n（注意：某些软件包已安装且为最新，在按下“y”后安装其他软件包时不会报错。）\n\
  \na. 输入> `abiword aptitude ftpd gview gparted k3b lynx pdfsam smb2 tftp vifm yake\
  \ desktop`\n\nb. 更新完成后输入> `apt-get update -y`\n\nc. （如有必要）输入> `apt-get autoremove`\n\
  \n# 7. 从 Tribal Chicken 导入脚本。\n\na. 输入> `mount /dev/sda3 /mnt`\n\na.i. 这将挂载用于 12.10\
  \ 的磁盘。不同安装可能不同。\n\nb. 输入> `cp -abpr /mnt/home/{username}/build/hostfiles/btbin /root/bin`\n\
  \nc. 输入> `ls /root/bin`\n\nc.i. 验证文件已成功传输。\n\nd. 输入> `cp ~/bin/bash_aliases ~/.bash_aliases`\n\
  \ne. 输入> `umount /mnt`\n\nf. （可选）如果有独立的存档驱动器。现在添加。（示例）输入> `mount /dev/sdb1 /mnt`\n\
  \nf.i. 这将挂载存档磁盘。系统下载包时，可以从此处加载，而不是等待下载。\n\ng. 输入> `cd ~/bin`\n\nh. 输入> `./fix_path`\n\
  \nh.i. 这将在启动新终端窗口时将 `/root/bin` 添加到 `PATH` 变量。\n\ni. 关闭当前终端会话然后打开一个新的。\n\n# 8. 安装\
  \ Google Chrome 浏览器\n\n（注意：如果存档驱动器/文件夹 (/mnt) 不存在，请按照指南继续执行 8d。）\n\na. 输入> `ls -al\
  \ /mnt/google*`\n\na.i. 验证 Google Chrome .deb 包是否存在。\n\nb. 输入 `dpkg -i /mnt/google-chrome-stable_current_amd64.deb`\n\
  \nb.i. （注意：即使此包已过期，安装后也将可用更新 google-chrome 包的路径；因此，运行下一个“apt-get upgrade”命令后，Chrome\
  \ 会自动更新。）\n\nc. 成功完成后；跳到下方第 9 步。\n\nd. （仅当文件不存在时）下载 Google Chrome；\n\nd.i. 位于：[`chrome.google.com/`](http://chrome.google.com/)\n\
  \nd.ii. 网站应将您重定向到下载 Linux 版本的安全站点。\n\n\n\n\ne. 一旦下载完成（假设保存到 `~/Downloads`），输入> `cd\
  \ ~/Downloads`\n\nf. 输入> `dpkg -i google-chrome{Version}.deb`\n\ng. 安装成功后，Google\
  \ Chrome 需要被“修复以便 root 用户访问该应用程序”。输入> `fix_chrome`\n\nh. 输入> `google-chrome &`\n\
  \nh.i. 验证 Google Chrome 是否正确启动。\n\ni. （可选）将下载内容保存到存档。\n\n## 9. 安装 VMWare Player\n\
  \n**(注意：如果文件在存档(`/mnt`) 驱动器中不存在，请跳转到第 9d 步；然后继续此指南。）**\n\na. 输入> `ls -al /mnt/VMWare-player*`\n\
  \na.i. 验证 VMWare Player 的 `.bundle` 文件是否存在。\n\nb. 输入> `chmod +x VMWare*.bundle`\n\
  \nc. 输入> `./VMWare-Player-[version].bundle`\n\n继续下方的第 9.g 步。\n\nd. **(仅当文件不存在)**\
  \ 下载 VMWare Player 并安装；\n\nd.i. 位于：[`www.vmware.com`](https://www.vmware.com)\n\n\
  d.ii. **(注意：网站内容经常更新，VMWare Player 在网站上的位置可能会发生。请使用“Products (产品)”菜单导航到“Free (免费)”部分下的\
  \ VMWare Player 链接。)**\n\ne. 一旦下载完成（假设保存到 `~/Downloads`），输入> `cd ~/Downloads`\n\n\
  f. 输入> `./Vmware-Player-[version].bundle`\n\ng. 安装 GUI 启动后，阅读 VMWare Player 的用户许可协议\
  \ (EULA)。选择> “Accept (接受)”并点击> Next (下一步)。\n\nh. 将出现第二个 EULA，这次是针对 VMWare 的 OVF\
  \ 工具。阅读 EULA，选择> “Accept (接受)”并点击> Next (下一步)。\n\ni. **不要在启动时检查更新！** 将单选按钮更改为“No\
  \ (否)”并点击> Next (下一步)。\n\nj. **不要发送匿名数据！** 将单选按钮更改为“No (否)”并点击> Next (下一步)。\n\n\
  k. 选择> “Skip License key for now (现在跳过许可密钥)”。点击> Next (下一步)。\n\nl. 点击> Install (安装)。\n\
  \nm. 安装成功后，输入> `vmplayer &`\n\nm.i. 验证应用程序是否正确启动。\n\nm.ii. 如果出现错误：尝试运行 `/root/bin/`\
  \ 文件夹下的 `fix_vmplayer`。\n\nn. （可选）将下载内容保存到存档。\n\n## 10. 配置 IceWeasel 浏览器\n\nIceWeasel\
  \ 浏览器是一个 Mozilla 网络浏览器，功能与 Firefox 非常相似，并具有许多相同的功能，如插件。\n\na. 打开 IceWeasel。\n\n\
  b. 从顶部的文件菜单栏，选择> Tools (工具)>Add-Ons (插件)\n\nc. 搜索并安装以下内容；\n\nc.i. Firebug\nc.ii.\
  \ FlashFirebug\nc.iii. Groundspeed\nc.iv. JSONView\nc.v. SQL Inject Me\nc.vi. UnPlug\n\
  c.vii. XSS Me\nc.viii. MitM Me\nc.ix. Hackbar\nc.x. NoScript\nc.xi. JavaScript Deobfuscation\n\
  c.xii. Grease Monkey\nc.xiii. Right to Click\nc.xiv. Javascript Object Examiner\n\
  c.xv. FxIF\nc.xvi. RightClickXSS\nc.xvii. Tamper Data\nc.xviii. User Agent Switcher\n\
  c.ix. Cipherfox\nc.xx. … 其他任何需要的…\n\nd. 在安装所有插件后，禁用除“NoScript”插件以外的所有插件。\n\ne. 配置插件和\
  \ IceWeasel 以拒绝自动更新（默认/推荐）。\n\nf. 关闭 IceWeasel。\n\n## 11. 安装并配置 Nessus\n\na. 从 [`www.nessus.org/download`](http://www.nessus.org/download)\
  \ 下载 Nessus 5.0 或更高版本。\n\nb. 从终端窗口；输入> `dpkg -i ~/Download/Nessus-{version}.deb`\n\
  \nc. 输入> `service nessusd start`\n\nd. 打开浏览器（IceWeasel 或 Chrome）。导航至：[`localhost:8834/`](http://localhost:8834/)\n\
  \ne. 点击> Get Started (开始使用)。\n\nf. 创建登录 ID 和密码。（假设：`root / toor`）。点击> Next (下一步)。\n\
  \ng. 选择> I will use Nessus to Scan My Home Network (我将使用 Nessus 扫描我的家庭网络)。\n\ng.i.\
  \ 在下拉菜单中输入注册名称和有效邮箱。点击> Next (下一步)。\n\ng.ii. 浏览器将自动刷新到正常的 Nessus 登录页面。\n\n**以下步骤仅适用于\
  \ Nessus HomeFeed！如果您有专业订阅许可，请咨询您所许可版本 Nessus 的文档。将 HomeFeed 用于业务用途是违反用户许可协议 (EULA)\
  \ 的行为。**\n\nh. 注册 Nessus HomeFeed：[`www.tenable.com/products/nessus`](https://www.tenable.com/products/nessus)\n\
  \nh.ii. 浏览器将自动刷新到正常的 Nessus 登录页面。\n\n\n\n\n### b.ii. `Enter`> `sudo ./tribal-chicken`\n\
  \n### 5. 使用键盘上的方向键，检查 ISO 配置。\n\na. `Highlight`> “1 Change_Config”\nb. `Press`>\
  \ `Enter` 键\nc. `Verify` 以下设置；更改下方加粗的内容。\n\n- c.i. `ARCH_BASE=64`\n- c.ii. `ARCHIVE_FLAG=false`\n\
  - c.iii. `BUILD_BASE=/home/**[username]**/build`\n- c.iv. `DVD_BASE=DVD64`\n- c.v.\
  \ `DEFAULT_ISO_NAME={DATE}_Tribal_Chicken_64.iso`\n- c.vi. `DEFAULT_VERSION=0.MM.DD.YY`\n\
  - c.vii. `MIGRATE_DIR=/home/**[username]**/build/migrate`\n- c.viii. `MIGRATE_FLAG=false`\n\
  - c.ix. `ROOT_FILENAME={DATE}_root_64.fs`\n- c.x. `SRC_PARTITIONT=/dev/sda1` ***(Kali\
  \ Linux 安装位置)***\n- c.xi. `BURN_TO_DISC=false` **(true=在创建期间刻录 ISO)**\n- c.xii.\
  \ `RECORDING_DEVICE=/dev/**[device]**\n\nd. `Highlight`> Quit\ne. `Press`> `Enter`\
  \ 键\n   - e.i. 返回主窗口。\n\n### 6. `Highlight`> “2 Build_ISO”\n### 7. `Press`> `Enter`\
  \ 键\n### 8. 当提示时，`Highlight`> YES\n### 9. `Press`> `Enter` 键\n\n（注：根据机器和/或虚拟机的设置，这可能需要\
  \ 30 到 120 分钟。）*\n\na. 当 ISO 处理完成后。应用程序将根据 ISO 的大小提示用户插入 DVD 或蓝光光。\n\n## 将 ISO 刻录到\
  \ DVD 或蓝光光盘\n\n此步骤适用于那些已经使用 tribal chicken 创建了 ISO，并希望直接将 ISO 刻录到磁盘，而不是通过 Tribal\
  \ Chicken 脚本的用户。\n\n1. 启动进入 Ubuntu 12.10 并打开终端窗口。\n\na. `Enter`> `growisofs -overburn\
  \ -Z=/dev/[recording_device] ~/build/{yourISO'sName}.iso`\n   - a.i. `[recording_device]`\
  \ 通常是 “cdrw, dvdrw or sr0”，但具体取决于您的机器。\n\n## 测试与验证（短版本）\n\n测试 ISO 是一个系统化的过程，其定制程度与发行版本身一样。最好的测试是在将运行该磁盘的示例机器上对刻录的\
  \ ISO 磁盘进行验证。如果使用 Tribal Chicken 创建训练平台，那么在不同类型的机器上测试刻录磁盘是一个好主意。\n\n1. 将新的 ISO 质放入机器或虚拟机并磁盘启动。\n\
  2. 测试以下状态：\n   a. Nessus\n   b. VMW Player\n   c. Metasploit\n   d. NMAP\n   e.\
  \ Wireshark\n   f. IceWeasel 插件\n   g. Chrome\n   h. 其他对任务执行至关重要的安装应用程序。\n3. 关闭系统。\n\
  4. 如果所有测试均令人满意，则 ISO 成功了。如果需要更改驱动程序、设置或脚本，请回到 Kali Linux 操作系统并继续研究，直到满足所有任务需求。\n\
  \n构建 Tribal Chicken 定制版本的指南到此结束。\n\n## 附录 B\n\n Kali 渗透测试工具\n\nKali Linux 平台预装了\
