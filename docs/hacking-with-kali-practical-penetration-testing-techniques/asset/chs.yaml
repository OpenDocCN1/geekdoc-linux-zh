  \ 网络设置。\n\n## Metasploitable2\n\nRapid7 预先编程了一台具有许多安全漏洞且故意脆弱的计算机。这是开始计算机安全训练的极佳工具，但不建议作为基础操作系统。该虚拟机将为研究人员提供许多使用\
  \ Metasploit Framework 学习渗透测试的机会。Metasploitable2 是一个为了方便易用而预先构建的虚拟机。这对于构建虚拟化实验室环境的良好起点，因为本章后后将讨论的许多应用程序都可以安装在\
  \ Metasploitable2 虚拟机之上。\n\n### 安装 Metasploitable2\n\n打开网络浏览器并导航到：[`sourceforge.net/`](http://sourceforge.net/)。使用\
  \ [Sourceforge.net](http://Sourceforge.net) 网站顶部的搜索栏搜索 Metasploitable。在结果中，点击 Metasploitable2\
  \ 的链接。点击下载按钮获取虚拟机（图 5.19）。\n\n![image](img/F000057f05-19-9780124077492.jpg)\n图 5.19\
  \ 下载 Metasploitable2。\n\n将下载内容保存到一个记住的位置。如果没有打开，请启动 VirtualBox（图 5.20）。\n\n![image](img/F000057f05-20-9780124077492.jpg)\n\
  图 5.20 打开 VirtualBox。\n\n点击 `New` 按钮创建虚拟机（图 5.21）。\n\n1. 将虚拟机命名为 `Metasploitable2`并将\
  \ `Type` 设置为 `Linux`。将 `Version` 设置为 `Ubuntu`，点击 `Next` 按钮继续。\n\n2. （在向导之外）将 `Metasploitable2.zip`\
  \ 包解压到：`C:\\users\\%USERNAME%\\VirtualBox VMs\\Metasploitable2\\`。\n\n![image](img/F000057f05-21-9780124077492.jpg)\n\
  图 5.21 创建新虚拟机。\n\n（回到 VirtualBox 向导）设置虚拟机的内存大小。点击 `Next` 按钮继续。`512 MB` 的 RAM 应该足够；如果有需要可以调整大小（图\
  \ 5.22）。\n\n![image](img/F000057f05-22-9780124077492.jpg)\n图 5.22 配置 RAM。\n\n选择“Use\
  \ an existing hard drive file”（使用现有虚拟硬盘文件）。使用 `Browse` 按钮选择：`c:\\users\\%USERNAME%\\\
  VirtualBox VMs\\Metasploitable2\\Metasploitable.vmdk` 文件（图 5.23）。\n\n![image](img/F000057f05-23-9780124077492.jpg)\n\
  图 5.23 创建硬盘。\n\n点击 `Create` 按钮继续；但此时**不要**启动虚拟机（图 5.24）。\n\n![image](img/F000057f05-24-9780124077492.jpg)\n\
  图 5.24 完成 Metasploitable2。\n\n选择 `Kali-Linux-LiveDisc` 虚拟机，然后点击 `Settings` 按钮。从左侧菜单点击\
  \ `General`。然后是 `Advanced` 选项卡（图 5.25）。\n\n![image](img/F000057f05-25-9780124077492.jpg)\n\
  图 5.25 高级设置。\n\n\n\n\n## 2. Mutillidae\n（发音为 mut-till-i-day）是一个来自 OWASP 的开源项目，旨在帮助安全研究人员和学生开发\
  \ Web 应用程序攻击技能。Mutillidae 是一个非常有用的训练工具，拥有巨大的社区参与度，并定期更新。它默认安装在 Metasploitable2、SamuraiWTF\
  \ 和 OWASP Broken Web Apps (BWA) 中。Jeremy Drunin（在安全社区中也称为 webpwnized）慷慨地在 YouTube\
  \ 上上传了许多关于 Mutillidae 的教程视频。Metasploitable 默认的版本已经过时，且缺乏新的挑战。请从 Sourceforge 项目主页面下载最新版本的\
  \ Mutillidae，并将其上传到 Metasploitable2 的 `/var/www` 文件夹中，以获取最新的更新和挑战。更多信息：[`sourceforge.net/projects/mutillidae/`](http://sourceforge.net/projects/mutillidae/);\
  \ [`www.youtube.com/user/webpwnized`](http://www.youtube.com/user/webpwnized)。\n\
  \n## 3. WebDAV\n网站运营者和管理员可能需要更改网站内容。WebDAV 是 HTTP 协议族的一个扩展，允许远程对网站进行修改。WebDAV 使用用户名和密码组合来管理账户访问。如果\
  \ WebDAV 设置不安全，攻击者可能会破坏网站界面、上传恶意文件，并将 Web 服务器用于其他阴险目的。更多信息：[`www.webdav.org/`](http://www.webdav.org/)。\n\
  \n## 4. DVWA\nDamn Vulnerable Web App（脆弱 Web 应用程序）是另一个供安全专业人员、教师、学生和研究人员学习 Web 应用程序安全的训练平台，正如其名所示，它非常（damn）脆弱的。更多信息：[`www.dvwa.co.uk`](http://www.dvwa.co.uk);\
  \ [`sourceforge.com/projects/dvwa`](http://sourceforge.com/projects/dvwa)。\n\n##\
  \ 5. TWiki\n一个企业级的 Web 2.0 应用程序 wiki 和协作 Web 前端。TWiki 非常健壮，在 Metasploitable 中的版本之后又发布了许多版本。Metasploitable\
  \ 虚拟机上安装的版本中漏洞数量令人惊叹。TWiki 将让渗透人员对攻击 Web 2.0 应用程序的方法有更好的视角。新版本的 TWiki 已被 Yahoo!、Nokia、Motorola\
  \ 和 Disney 等巨头公司使用。更多信息：[`twiki.org`](http://twiki.org)。\n\n以上应用程序都运行在 Apache Tomcat\
  \ Web 服务器上。放在 `/var/www` 文件夹中的任何文件夹或网站都可以通过 Metasploitable2 虚拟机的 Web 界面访问。有很多像 Mutillidae\
  \ 和 DVWA 这样的训练包可以帮助磨练和提高渗透人员的技能。此外，这些训练程序仍在接收更新；然而，Metasploitable 并不是在主要版本之间进行更新的。在\
  \ Metasploitable 虚拟机上添加包需要时间，但这些努力是值得的。作为一个重复示例，请修改以下步骤向 Metasploitable 虚拟机的 Web\
  \ 服务添加包。\n\n## 魔法代码注入彩虹 (The Magical Code Injection Rainbow)\n\nDan Crowley 是来自\
  \ Trustwave 的信息安全爱好者和独立研究员，他设计并创建了五个令人深刻的训练套件。他的 Web 训练程序导航简单，并带有各种挑战级别。他的最新作品是将他的\
  \ Web 训练器整合到一个名为“魔法代码注入彩虹”（MCIR）的数字乐场。MCIR 由以下模块组成：\n\n- `SQLol`——一个 SQL 注入训练平台，允许对白名单和黑名单字符及序列进行自定义，专注于基于挑战的平台，用于训练测试和击败\
  \ SQL 安全措施的基本技能。\n- `XMLmao`——与 SQLol 类似，是一个可配置的 XML 注入训练环境。\n- `Shelol`——用于命令注入的可配置操作系统\
  \ Shell 训练环境。\n- `XSSmh`——跨站脚本（XSS）训练工具。\n- `CryptOMG`——与 Andrew Jordan 合作的项目，是一个可配置的夺旗赛（CTF）风格\
  \ Web 应用程序，旨在利用加密实现中的常见缺陷。更多信息：[`github.com/SpiderLabs/MCIR`](https://github.com/SpiderLabs/MCIR)。\n\
  \n### 安装 MCIR\n\n打开 VirtualBox，选择 Metasploitable2 虚拟机，点击菜单栏上的设置按钮（这甚至可以在虚拟机正在运行时进行）。选择左侧的网络按钮，并将“连接到”（Attached\
  \ to）设置更改为：桥接适配器（图 5.28\n图 5.28 修改网络适配器。\n\n“名称”（Name）设置是虚拟网络网卡要连接的网卡。单个结果可能与图 5.28\
  \ 中的图片不同。点击 OK 按钮保存并关闭窗口。如果尚未启动，启动 Metasploitable2 虚拟机并以 `msfadmin` 用户登录。重置网络接口。\n\
  \n```bash\nsudo ifdown eth0\nsudo ifup eth0\n```\n\n检查是否设置了新的 IP 地址。\n\n```bash\n\
  ifconfig eth0\n```\n\n修改 `/etc/resolve.conf` 中的名称服务器。\n\n```bash\nsudo nano /etc/resolve.conf\n\
  ```\n\n将列出的名称服务器 IP 地址更改为您网络上可访问的网关，然后按 `CTRL+X` 退出并保存文件。\n\n测试互联网连接性。\n\n```bash\n\
  nslookup www.google.com\n```\n\n将显示 [Google.com](http://Google.com) 的所有 IP 地址。如果没有，返回并调整网络接口设置。\n\
  \n从 [GitHub.com](http://GitHub.com) 下载魔法代码注入评审。\n\n```bash\nwget https://codeload.github.com/SpiderLabs/MCIR/zip/master\n\
  ```\n\n下载的文件没有“zip”扩展名；但它是从 [GitHub.com] 下载的 ZIP 容器。\n\n解压 master 文件。\n\n```bash\n\
  unzip master\n```\n\n将 MCIR 文件夹移动到 Tomcat Web 服务器的相应位置。\n\n```bash\nsudo mv MCIR-master\
  \ /var/www/mcir\n```\n\n编辑 Metasploitable2 网页以更于访问。\n\n```bash\ncd /var/www\nsudo\
  \ nano index.php\n```\n\n如图 5.29 所示，将 MCIR 添加到网页上的列表中。\n\n![image](img/F000057f05-29-9780124077492.jpg)\n\
  图 5.29 Shell。\n\n按 `CTRL+X` 退出并保存文件。MCIR 框架尚未完全加载。必须还原网络设置。打开 VirtualBox 窗口，选择 Metasploitable2\
  \ 虚拟机，点击菜单栏上的设置按钮。如之前，选择左侧的网络按钮并将“连接到”设置更改为：仅主机适配器。点击 OK 按钮保存并退出。最后重置 Metasploitable\
  \ 虚拟机的网络接口。\n\n```bash\nsudo ifdown eth0\nsudo ifup eth0\n```\n\n检查 `eth0` 上的新 IP\
  \ 地址。\n\n```bash\nifconfig eth0\n```\n\n从 Kali-Linux-LiveDisc 虚拟机启动 IceWeasel，并导航到：`http://{Metasploitable\
  \ 虚拟机 IP 地址}/`。\n\n如图 5.30 所示，可以通过浏览器访问 MCIR 链接（图 5.31）。\n\n![image](img/F000057f05-30-9780124077492.jpg)\n\
  图 5.30 Metasploitable Web 界面。\n\n![image](img/F000057f05-31-9780124077492.jpg)\n\
