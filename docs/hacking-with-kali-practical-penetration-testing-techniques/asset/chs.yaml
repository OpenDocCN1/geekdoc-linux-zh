  \ Basics 系列）。\n\n# 第 2 章：下载与安装 Kali Linux\n\n本章将引导读者完成在各种介质上下载、安装并运行 Kali Linux\
  \ 的过程。\n\n### 关键词\n\n渗透测试；Kali Linux；Debian；live；安装；USB；ARM\n\n## 本章内容\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 本章将解释如何获取可用的最强大的渗透测试工具包之一——Kali Linux。\n\n## 章节概述和核心学习点\n\n本章将解释如何在以下设备上下载和安装\
  \ Kali Linux：\n\n- 硬盘\n- 优盘盘（USB 内存棒）\n- SD 卡\n\n## Kali Linux\n\n对于某些人来说，安装操作系统（如微软的\
  \ Windows、苹果的 OSX 或 Debian 和 Ubuntu 等开源平台）可能是一种本能，但复习这一过程总是有益的。从未安装过操作系统的朋友无需担心，本章的后续章节将提供定位、下载和安装\
  \ Kali Linux 所需的所有步骤。\n\nKali Linux 在许多方面都是独的，但该发行版最重要的区别在于它不仅可以从硬盘安装运行，还可以作为 Live\
  \ 盘启动，并且默认安装了大量的专用应用程序数量和类型。Live 盘是安装在磁盘（包括紧光盘 (CD)、数字视频光盘 (DVD) 或蓝光磁盘）上的操作系统。作为渗透测试人员，能够引导\
  \ Live 盘的能力非常重要。拥有网络上本地机器访问权限的人即使渗透测试人员在安装的操作系统中没有账户，也可以利用 Live 盘来使用这些机器。系统将引导至\
  \ Live 盘而非本地硬盘；这意味着，如果机器配置得当，渗透测试人员将访问本地局域网上的许多资源，同时不会在本地机器的硬盘上留下证据。Kali Linux 安装的软件是其为渗透测试人员独特配置的另一个原因。Kali\
  \ Linux 默认安装了 400 种渗透测试和安全工具、软件包和应用程序，并能够根据需要添加更多。\n\n## 系统信息\n\n所有操作系统都有特性和细微差异，这些差异体现在最初的安装和设置中；然而，大多数基于\
  \ Linux/Unix 的平台在性质上相似。在安装 Kali Linux 时，与其他 Linux 操作系统一样，安装前的规划至关重要。以下是安装 Kali Linux\
  \ 时需要考虑的简单列表。\n\n![ent](img/FilledVerySmallSquare_9642.gif) 操作系统将运行在台式电脑还是笔记本电脑上？\n\
  ![ent](img/FilledVerySmallSquare_9642.gif) 需要多大的硬盘？\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 可用硬盘是否有足够的空间？\n![ent](img/FilledVerySmallSquare_9642.gif) 需要多少个硬盘分区？\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 是否关注日志管理？\n![ent](img/FilledVerySmallSquare_9642.gif) 是否关注安全性？\n\n### 选择安装的硬件平台\n\
  \n传统上，操作系统安装在计算机的硬盘上，但对于像 Kali Linux 这样的操作系统，由于近期大容量设备的可用性和价格低廉，它可以将操作系统安装到优盘（又称闪存盘）和\
  \ SD 卡上。无论使用何种存储设备来安装操作系统，确定是安装在独立计算机（如实验室计算机）还是允许移动的笔记本电脑上至关重要。\n\n如果使用非常特定的硬件（如高功率显卡）进行密码破解，建议将\
  \ Kali Linux 安装在台式电脑上。如果需要从一个客户现场携带操作系统，或者希望测试无线设备，则建议使用笔记本电脑。笔记本电脑和台式电脑的操作系统安装方法相同。\n\
  \n### 硬盘选择\n\n不想滥用这个词，但“容量确实很重要”。一个通规则是硬盘越大越好。本书建议使用至少具有 120GB 空间的硬盘；然而，即使是这样也可能很快变满，特别是在密码破解、取证或需要对控制、证据、日志以及报告生成或收集有大量要求的渗透测试项目中。在大多数商业和政府安全评估中，操作系统会被清理、删除或完全移除，以维护已建立的基环境。这种做法在安全社区被广泛接受，因为需要妥善处理客户机密数据，并尽量减少可能损害公司基础设施或声誉的企业信息泄露。\n\
  \n### 硬盘分区\n\n\n\n\n分区是通过设置特殊的块大小和扇区，将文件系统分离到硬盘特定区域的行为。分区可以防止操作系统因接管系统的日志文件而导致损坏，并在某些情况下提供更强的安全性。在基础层，操作系统已经被划分为两个不同的分区。第一个分区是\
  \ `swap` 区域，用于内存分页和存储。第二个分区指定用于其他所有内容，并使用如扩展文件系统 3 (`ext3`) 或扩展文件系统 4 (`ext4`) 等文件结构进行格式化。对于笔记本电脑，特别是那些将不断反复重新加载操作系统的设备，没有必要进行进一步分区。对于自定义安装或将拥有更持久性操作系统的计算机，则至少需要分离出临时\
  \ `tmp` 文件。\n\n硬盘的高级分区和计算机双系统启动不在本书的范围内，将不会予以涵盖。唯一的例外是附录 A，其中介绍了引入了名为 `Tribal Chicken`\
  \ 的第三方应用程序的定制化发行版。\n\n### 安装期间的安全性\n\nKali Linux 是一个非常强大的操作系统，内置了许多预装工具，这些工具可能会破坏计算机、网络基础设施；如果使用不当或不符合道德，还可能导致被视为犯罪或违法的行为。因此，密码是至关重要的。虽然密码是最基本的安全实践，但许多管理员和安全专业人员经常忘记或忽略密码的使用。正确使用密码等基本安全实践，对于确保你所安装的\
  \ Kali Linux 不被那些可能无意中或恶意对个人、计算机或网络造成伤害的人使用至关重要。\n\n## 下载 Kali\n\nKali Linux 是 Linux\
  \ 的一个发行版，以 ISO（读音为 `eye-so`）文件的格式下载。它需要从另一台计算机下载，然后在安装之前刻录到磁盘中。在编写此书时，Kali Linux\
  \ 可以从 [`www.kali.org/downloads/`](http://www.kali.org/downloads/) 下载。有关高级操作、配置和特殊情况的文档也可以在\
  \ Kali 官方网站 [`www.kali.org/official-documentation/`](http://www.kali.org/official-documentation/)\
  \ 上找到。此外，该地还有一个非常庞大且活跃的社区，用户可以在那里提问并帮助他人解决困难。建议在该网站注册以访问由 Kali Linux 制作者 Offensive\
  \ Security 管理的社区论坛。Offensive Security 还会发送有关更新和社区信息的消息（图 2.1）。\n\n![image](img/F000021f02-01-9780124077492.jpg)\n\
  \n图 2.1 下载 Kali Linux。\n\n请确保选择正确的架构（`i386=32-bit, amd64=64-bit`）。Kali Linux 的受信任贡献镜像不在本书范围内；然而，如果你想熟悉\
  \ Kali 或需要一个沙箱环境以获得更大的控制，那么 VMware 版本对于这些情况非常完美。点击适当的下载链接继续你的选择。\n\n对于 Microsoft\
  \ Windows 7 用户，双击完成下载的文件将出现 ISO 刻录向导。按照提示完成 ISO 镜像到可安装的 DVD 的转换。Linux 用户需要使用如 `K3b`\
  \ 等合适的磁盘刻录应用程序打开 ISO 文件。\n\n## 硬盘安装\n\n接下来的章节将提供一个为易用性设计的文本和图形化安装指南。要在系统硬盘上正确安装\
  \ Kali，甚至从现场启动盘启动，将基本输入输出系统 (BIOS) 设置为从光驱启动是关重要的。要开始安装，将 CD 放入计算机的 CD 托盘并引导计算机从磁盘。熟悉\
  \ VMware Player 或 Oracle Virtualbox 等虚拟化技术的高级用户也会发现本指南既直观又有用，可以作为创建虚拟化版本 Kali Linux\
  \ 的辅助。\n\n### 首次启动 Kali\n\n成功启动到 Kali Linux 磁盘的计算机将显示一个类似于图 2.2 的屏幕。本指南所使用的 Kali\
  \ Linux 版本是 1.0.5 64 位；在不同时间下载的版本可能略有不同；然而，图形化安装在本质上非常相似。Kali Linux 每个新版本的更新指南可以在\
  \ [`www.kali.org/`](http://www.kali.org/) 找到，强烈建议在安装之前或在在此过程中遇到任何问题时参考该网站以获取你版本的最新文档。\n\
  \n![image](img/F000021f02-02-9780124077492.jpg)\n\n图 2.2 Live ISO 启动菜单。\n\nKali\
  \ Linux 以“Live CD”（又称 `Live ISO`）的形式发行，这意味着操作系统除了安装到硬盘外，还可以直接从磁盘运行。从现场磁盘运行 Kali\
  \ 允许系统启动并执行所有工具；然而，呈现的操作系统是 `nonpersistent`（非持久性的）。非持久性意味着一旦计算机关闭，任何内存、保存的设置、文档以及可能非常重要的工作或研究可能会丢失。在非持久性状态下运行\
  \ Kali 需要非常小心、高级处理以及对 Linux 命令和操作系统的良好理解。这种方法非常适合学习 Linux 操作系统，而不会删除计算机硬盘上已安装的现有操作系统。\n\
  \n另一种安装方式（不在本书的范围内）是“带语音合成的安装”。这是 Kali 和 Debian 操作系统的一个新功能。如果你有支持语音合成的硬件，可以通过语音控制安装。本书目前将重点关注图形化安装；因此，请突出\
  \ `Graphical Install`（图形安装）并按 `Enter` 键。\n\n### 安装——设置默认\n\n接几个屏幕将允许选择系统的默认语言、位置和键盘语言。选择相应的设置并点击继续进入安装程序。当计算机开始预装\
  \ Kali Linux 时，安装过程中屏幕上会显示各种进度条。对于大多数选择屏幕，选择默认设置是合适的。\n\n### 安装——初始网络设置\n\n图 2.3\
  \ 详细说明了主网卡的初始设置和基本配置。在框中输入并点击继续来选择主机名。主机名应该是唯一的，因为位于同一网络上的计算机如果不小心配置了相同的主机名可能会导致网络问题。\n\
  \n![image](img/F000021f02-03-9780124077492.jpg)\n\n图 2.3 设置主机名。\n\n选择主机名并点击继续按钮后，下一个屏幕将要求计算机的\
  \ `完全限定域名` (FQDN)。这对于加入域环境是必要的，但对于大多数实验室环境来说不是必须。对于本指南，FQDN 被特意留空，可以通过选择继续按钮跳过。\n\
  \n### 密码\n\n\n\n\n向导中的下一个提示将要求输入根用户密码。默认密码为：`toor`；但是，建议选择新密码，其中至少包含以下各项中的一种：大写字母、小写字母、数字和符号。密码不应具有用户追溯性，且不易被猜测。建议使用\
  \ 10 个或更多字符的密码。例如，如果用户曾经打过高中足球，那么就不建议使用 `soccer22`。可以通过常用短语的变体创建密码以增加记忆性。以下是一些强密码的示例：\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) St0n(3)b@tt73 *– “Stone Battle”\n\n\
  ![ent](img/FilledVerySmallSquare_9642.gif) P@p3r0kCur5# – “Paper, Rock, Curse”\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) m!gh7yP@jjjama% h – “Mighty Pajamas”\n\
  \n输入密码时，它将显示为点或星号。这是正常现象，防止密码在有人可能查看电脑屏幕时显示。在两次输入相同的强密码后，点击 Continue 按钮继续后续安装（图\
  \ 2.4）。\n\n![image](img/F000021f02-04-9780124077492.jpg)\n\n图 2.4 设置密码。\n\n### 配置系统时钟\n\
  \n图 2.5 显示选择时区的提示。点击相应的时区，然后点击 Continue 按钮继续安装。\n\n![image](img/F000021f02-05-9780124077492.jpg)\n\
  \n图 2.5 配置时钟。\n\n### 分区磁盘\n\n设置 Linux 操作系统时，配置分区的方法非常多，以至于可以为这个主题专门写一本书。本指南将侧重于最基础的安装方式：**引导式分区**。图\
  \ 2.6 到 图 2.10 显示了初始高亮的默认设置。在 图 2.10 之前，没有任何需要选择的内容。此时，可以通过点击继续直到分区完成来加快安装速度，但花时间检查安装向导的每一步是明智之举。\n\
  \n![image](img/F000021f02-06-9780124077492.jpg)\n\n图 2.6 分区磁盘—1。\n\n图 2.6 显示了安装期间硬盘分区的不同选项。LVM（或\
  \ `Logical VolumeManagement`）不建议用于在笔记本电脑、U 盘或 SD 卡上安装。LVM 用于多个硬盘，仅建议供高级用户使用。应选择“Guided—user\
  \ entire disk”（引导式——使用整个磁盘）。点击 Continue 按钮继续完成安装过程。\n\n图 2.7 显示了已选择安装的硬盘。根据硬件和 Kali\
  \ Linux 版本的不同，安装体验可能会略有不同。系统将选中硬盘，如果可以，点击 Continue 按钮继续完成安装过程（图 2.8）。\n\n![image](img/F000021f02-07-9780124077492.jpg)\n\
  \n图 2.7 分区磁盘—2。\n\n![image](img/F000021f02-08-9780124077492.jpg)\n\n图 2.8 分区磁盘—3。\n\
  \n由于本书面向 Kali Linux 发行版的新用户：“All files in one partition (recommended for new users)”（所有文件在一个分区中（推荐新用户））是最佳选项并应被选中。点击\
  \ Continue 按钮继续安装过程。\n\n在向导的下一个提示中，分区指南已完成并供您检查。将创建一个包含所有系统、用户和脚本文件的主分区作为单个分区。创建第二个分区用于\
  \ `swap` 空间。交换区域是虚拟系统内存，在计算机中央处理器（CPU）和随机访问内存（RAM）之间来回分页文件。建议所有 Linux 系统都拥有交换区域，通用做法是将交换区域设置为等于或计算机上安装的物理\
  \ RAM 数量的一半。如 图 2.9 所示，系统将为您选择“Finish partitioning and write changes to disk”（完成分区并将更改写入磁盘）。点击\
  \ Continue 按钮继续安装过程。\n\n![image](img/F000021f02-09-9780124077492.jpg)\n\n图 2.9 分区磁盘—4。\n\
  \n图 2.10 是硬盘配置提交前的最后分区检查。如果必要，未来有更改分区大小的方法，但如果操作不当可能会对您的操作系统造成巨大破坏。向导中的此提示警告：您正将根据之前定义的分区表向指定的硬盘写入数据。选择\
  \ `YES` 并点击 Continue 按钮继续安装过程。\n\n![image](img/F000021f02-10-9780124077492.jpg)\n\
  \n图 2.10 分区磁盘—5。\n\n在点击向导分区部分的最后一个提示的继续后，硬盘分区将开始开始。图 2.11 显示此时正在进行实际安装。根据您拥有的硬件，此过程可能只需要几分钟，甚至可能需要一小时或更久。\n\
  \n![image](img/F000021f02-11-9780124077492.jpg)\n\n图 2.11 正在进行安装。\n\n### 配置包管理器\n\
  \n包管理器是操作系统设置的关键部分。包管理器指的是 Kali Linux 从其中获取更新和安全补丁的更新库。建议使用 Kali Linux ISO 随附的网络镜像，因为这将是用于包管理的最新的源。图\
  \ 2.12 显示默认将选择“YES”。点击 Continue 按钮继续完成安装过程。\n\n![image](img/F000021f02-12-9780124077492.jpg)\n\
  \n图 2.12 配置包管理器。\n\n如果使用代理，请在向导的下一个提示中适当位置输入配置信息，或如 图 2.13 所示留空。点击 Continue 按钮继续完成安装过程。\n\
  \n![image](img/F000021f02-13-9780124077492.jpg)\n\n图 2.13 配置代理。\n\n### 安装 GRUB 加载程序\n\
  \n统一引导加载程序 **(GRUB)** 是每次启动计算机时显示的主屏幕。这允许在启动时验证某些设置、即时更改，并在操作系统加载之前调整设置。虽然对于某些高级用户来说\
  \ GRUB 并非必须，但对于大多数安装类型都强烈建议使用。图 2.14 显示系统已为您选择“YES”安装 GRUB。点击 Continue 按钮继续完成安装过程。\n\
  \n![image](img/F000021f02-14-9780124077492.jpg)\n\n图 2.14 安装 GRUB。\n\n### 完成安装\n\
  \n现在从计算机中移除磁盘并重启机器。在提示时执行操作，然后点击 Continue 按钮完成安装（图 2.15）。\n\n![image](img/F000021f02-15-9780124077492.jpg)\n\
  \n图 2.15 安装完成。\n\n重启后，将显示欢迎界面。使用早在安装过程中设置的预密码以 root 用户身份登录。欢迎使用 Kali Linux！\n\n\
  ## 盘安装\n\nUSB 内存设备（称为 U 盘及许多其他名称）仅仅是通过 USB 接口连接到计算机的存储设备。本书建议使用空间至少为 8GB 的 USB 设备，最好是更大。新计算机可以从\
  \ USB 设备启动。如果选择了此选项，请确保所使用的计算机支持从 USB 设备启动。\n\n\n\n\n\n以下章节将详细介绍如何使用 Microsoft Windows\
  \ 或 Linux 平台将 Kali Linux 安装到 USB 盘上。请务必检查 Kali Linux 官方首页提供的文档，以获取此流程的更新。\n\n在将\
  \ U 盘作为启动设备时，有两个非常重要的关键术语：持久化（persistence）和非持久化（nonpersistence）。持久化是指设备在关机后保留任何写入或修改过的文件的能力。非持久化是指设备在机器重启或关机后丢失所有设置、自定义内容和文件。对于本书而言，从\
  \ Windows 平台安装的 U 盘版 Kali Linux 将是 `nonpersistent`（非持久化的），而从 Linux 平台安装的将是 `persistent`（持久化的）。\n\
  \n### Windows（非持久化）\n\n所需应用程序——`Win32 Disk Imager`:[`sourceforge.net/projects/win32diskimager/`](http://sourceforge.net/projects/win32diskimager/)\n\
  \n下载 Kali Linux ISO 后，将 U 盘插入电脑并让 Windows 自动检测，同时注意分配的驱动器号。接下来，打开 `Win32 Disk Imager`。点击文件夹图标浏览并选择\
  \ Kali ISO 文件，然后点击“OK”按钮。从设备下拉菜单中选择正确的驱动器号。最后点击“Write”按钮。\n\n当 `Win32 Disk Imager`\
  \ 完成 ISO 刻录后，重启电脑并在 BIOS POST 菜单中选择 U 盘。大多数制造商对于启动到 USB 设备有不同的方法；请务必检查计算机制造商的文档。\n\
  \n### Linux（持久化）\n\n在制作持久化 U 盘时，大小同样至关重要！U 盘越大越好。此外，取决于你构建此 USB 设备时所使用的 Linux 版本，请确保已安装\
  \ `GParted` 应用程序。如果在安装 `GParted` 时遇到困难，请务必检查操作系统的文档。如果未安装 `GParted`，对于你的 Linux 安装可能需要以下方法之一：\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) `apt-get install gparted`\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ `aptitude install gparted`\n\n![ent](img/FilledVerySmallSquare_9642.gif) `yum\
  \ install gparted`\n\n下载 Kali Linux ISO 后，插入 U 盘。打开终端窗口并运行以下命令验证 USB 设备的路径。\n\n\
  ```bash\nmount | grep -i udisks |awk '{print $1}’\n```\n\n图 2.16 显示命令输出为“/dev/sdb1”。USB\
  \ 设备的输出可能会根据电脑的设置和配置而有所不同。在下一个命令中，将“sdb”替换为匹配的标识，并删除结尾的任何数字。\n\n![image](img/F000021f02-16-9780124077492.jpg)\n\
  \n图 2.16 挂载的 USB。\n\n使用 `dd` 命令将 Kali ISO 镜像传输到 USB 设备。\n\n```bash\ndd if=kali_linux_image.iso\
  \ of=/dev/sdb bs=512k\n```\n\n现在启动 `Gparted`。\n\n```bash\ngparted /dev/sdb\n```\n\
  \n该驱动器应该已经有一个刚刚安装的 Kali 镜像的分区。\n\n通过点击文件栏中“分区”菜单后出现的“New”，为 USB 添加新分区。由于许多不同的设备制造商，输出可能会有细微差异。平均而言，步骤与如下类似。\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) 点击灰色的“unallocated”（未分配）空间。\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 从分区 下拉菜单中点击“New”。\n\n![ent](img/FilledVerySmallSquare_9642.gif) 使用滑块或手动指定驱动器大小。\n\
  \n![ent](img/FilledVerySmallSquare_9642.gif) 将文件系统设置为 `ext4`。\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 点击 Add（添加）。\n\n![ent](img/FilledVerySmallSquare_9642.gif) 从主窗口的 Edit（编辑）下拉菜单中选择\
  \ Apply All Operations（应用所有操作）。\n\n![ent](img/FilledVerySmallSquare_9642.gif) 在出现提示时点击\
  \ Okay（确定）。*这可能需要一段时间。*\n\n如需添加持久化功能，请使用以下命令。\n\n```bash\nmkdir /mnt/usb\nmount\
  \ /dev/sdb2 /mnt/usb\necho \"/ union\" >> /mnt/usb/persistence.conf\numount /mnt/usb\n\
  ```\n\nLiveUSB 的创建现在已完成。重启电脑并从 U 盘启动。\n\n## SD 卡安装\n\n树莓派（RaspberryPi）和谷歌 Chrome\
  \ Notebook 等微型设备可以在 SD 卡上运行。这些小型设备可以用于许多用途；人的限制仅限于他们自己的想象力。树莓派等设备的最大优势是它们廉价，并且在开源社区中非常受欢迎，为世界各地的爱好者提供了易于获取的资源。\n\
  \n在 ARM 设备上安装 Kali Linux 有一个缺点，镜是自定义的，必须为每个硬件进行定义。ARM 设备的镜像可以在 Kali 官方下载页面找到：[`www.kali.org/downloads/`](http://www.kali.org/downloads/)。\n\
  \n以下步骤提供了在 ARM 架构设备上安装 Kali Linux 的指南。\n\n1. 从 Kali 官方网站下载镜像：[`www.kali.org/downloads/`](http://www.kali.org/downloads/)。\n\
  \n2. 插入空白 SD 卡。使用以下命令验证挂载位置：\n```bash\nmount | grep -i vfat\n```\n*假设为 /dev/sdb）*\n\
  \n3. 将 kali.img 传输到 SD 卡：\n```bash\ndd if=kali.img of=/dev/sdb bs=512k\n```\n\n\
  4. 在移除设备前卸载并同步任何操作：\n```bash\numount /dev/sdb\nsync\n```\n\n5. 移除 SD 卡。\n\n6. 将带有\
  \ Kali 镜像的 SD 卡插入 ARM 架构设备并从 SD 卡启动。\n\n## 总结\n\n本章的内容将使用户能够在计算机、笔记本电脑、U 盘和微型设备上安装\
  \ Kali Linux。安装 Kali Linux 就像骑自行车；学会一次就永远不会忘记。请务必关注 Kali 官方网站上的文档和社区论坛，以获取新的更新、版本和技术。与其他安全专业人士、爱好者和黑客建立联系可以拓展思维并协助解答问题。\n\
  \n第 3 章\n\n软件、补丁与升级\n\n本章将引导读者通过高级软件包管理工具（APT）和 Debian 软件包管理工具（DPKG）命令，下载并安装各种更新和应用程序。\n\
  \n### 关键词\n\n`apt`; `dpkg`\n\n## 本章信息\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ APT 软件包处理工具\n\n![ent](img/FilledVerySmallSquare_9642.gif) Debian 软件包管理器\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ Tar 包 (Tar-balls)\n\n![ent](img/FilledVerySmallSquare_9642.gif) 安装 Nessus 的实用指南\n\
  \n## 章节概述与核心知识点\n\n本章将解释使用 APT 软件包处理工具维护、升级和安装自定义以及第三方应用程序的过程。\n\n## APT 软件包处理工具\n\
  \nAPT 软件包处理工具（简单称为 `apt-get`）是一个轻量且极其强大的命令行工具，用于安装和删除软件包。apt-get 会跟踪已安装的所有内容以及所需的依赖项。依赖项是其他软件正常运行所需的额外软件包。例如，渗透测试人员的好友\
  \ Metasploit 依赖于一种名为 Ruby 的编程语言。如果没有安装 Ruby，Metasploit 将无法启动；因此，Ruby 是 Metasploit\
  \ 的依赖项。\n\n\n\n\n\n`apt-get` 不仅跟踪已安装软件的依赖关系，在有可用更新时还会跟踪版本和相互依赖关系。当软件包不再有用或已过时时，`apt-get`\
  \ 将在下次更新时提醒用户并提示删除旧软件包。\n\n`apt-get` 也可以是一个非常简单的工具，也可以是一个非常复杂的工具。软件包的管理对于确保 Kali\
  \ Linux 正常运行以及确保软件包保持最新版本至关重要。虽然 Kali Linux 的普通用户不需要了解 `apt-get` 的深入工作机制，但每个用户都应该掌握一些基础。\n\
  \n### 安装应用程序或软件包\n\n安装额外的软件是 `apt-get` 命令最基本的功能，且简单直接。下面的语法将提供 `install` 子命令的必要用法示例：\n\
  \n```bash\napt-get install {package_name}\n```\n\n尝试安装 “gimp;”，这是一个图像编辑软件包：\n\n\
  ```bash\napt-get install gimp\n```\n\n#### Update\n\n需要定期检查源（或存储库）以便 Kali Linux\
  \ 上安装的各种应用程序和软件包的更新。建议在安装任何新软件包之前检查更新，并且在对操作系统或软件应用程序或软件包进行升级之前，执行更新是必须的。执行更新的语法如下：\n\
  \n```bash\napt-get update\n```\n\n#### Upgrade\n\n没有任何系统是完美的，事实上，每个主要的操作系统都处于不断的改进、增强和补丁管理状态，以提供新功能或修复错误。`upgrade`\
  \ 功能将下载并安装已安装软件包的所有新版本。所有基于 Linux 的操作系统的优点在于它们是开源的，这意味着世界上任何人如果发现了漏洞或改进需求，都可以向操作系统的发行版管理器提交新代码，以帮助改进系统功能。这使得与微软等企业巨头相比，补丁的更新速度能够更快。正如前文所述，在运行升级之前执行更新至关重要。要升级\
  \ Kali，请使用以下命令：\n\n```bash\napt-get upgrade\n```\n\n#### Distribution Upgrade\n\n\
  发行版升级功能与 `upgrade` 功能非常相似，但此功能还会寻找特殊标记软件包及其依赖关系的源，以及发行版管理器指定包含在最新基准中的新软件包。例如，当调用发行版升级功能时，整个\
  \ Kali 版本将从 1.0 版本提升到 1.n 版本或 2.n 版本，以此此类推。使用以下语法升级 Kali：\n\n```bash\napt-get dist-upgrade\n\
  ```\n\n#### Remove\n\n`apt-get` 可减少系统占用，或在删除特定程序时使用。建议卸载所有未使用的、无用的或对你的操作系统并非必需的软件包。例如，如果系统不需要\
  \ Leafpad 应用程序，请将其删除。如果以后需要安装该应用程序，可以重新安装，但最好是跳过那些不必要的内容。可以使用以下语法删除应用程序或软件包：\n\n\
  ```bash\napt-get remove {package_name}\n```\n\n尝试删除 “leafpad” 然后重新重新安装该应用程序：\n\n\
  ```bash\napt-get remove leafpad\napt get install leafpad\n```\n\n#### Auto Remove\n\
  \n随着时间的推移，操作系统的应用程序软件包将被新且改进的版本取代。`autoremove` 功能将删除系统正常运行不再需要的旧软件包。建议在升级或发行版升级后运行\
  \ `autoremove` 函数。使用以下语法运行自动删除：\n\n```bash\napt-get autoremove\n```\n\n#### Purge\n\
  \n`remove` 和 `purge` 之间有什么区别？`remove` 函数不会破坏任何配置文件，并将这些项留在硬盘上，以防以后需要这些文件。这非常有用，特别是对于\
  \ MySQL、Samba Server 或 Apache 这样的应用程序。配置文件对于应用程序的运行至关重要。然而，有时有必要从系统中删除所有应用程序文件，甚至是该应用程序的配置文件，以便将应用程序重新安装到空白状态并重新，或者清除所有可能的敏感信息的痕迹。从系统中\
  \ `purge` 应用程序将一次性完全擦除应用程序包及所有相关的配置文件。使用 `purge` 函数时不要掉以轻心；当使用错误或在错误的应用程序上使用时是危险的，因为所有关联文件都将从系统中删除。可以使用以下语法进行\
  \ `purge`：\n\n```bash\napt-get purge {package_name}\n```\n\n#### Clean\n\n软件包从源下载到系统、解压然后安装。这些软件包将保存在系统中，直到另有通知。在安装应用程序后，这些软件包不再需要。随着时间的推移，这些软件包可能会占用磁盘空间并需要清理。可以使用以下语法启动\
  \ `clean` 函数：\n\n```bash\napt-get clean\n```\n\n#### Autoclean\n\n`autoclean` 以与\
  \ `clean` 函数类似的方式清理系统；但它应该在系统进行升级和发行版升级后运行，因为 `autoclean` 函数将删除被新软件包替换的旧软件包。例如，假设系统安装了应用程序\
  \ Y 版本 1，在系统升级后，应用程序 Y v1 被应用程序 Y v2 替换。`autoclean` 函数将仅清理版本 1，而 `clean` 函数将删除两个版本的应用程序包。使用以下语法将启动\
  \ `autoclean` 函数：\n\n```bash\napt-get autoclean\n```\n\n### 综合运用\n\n软件包的管理关乎更聪明地工作，而不是更努力地工作。以下是用户可以使用的命令，以确保所有可能的补丁、软件包和更新都是最新的且已就绪的：\n\
  \n1. `apt-get update && apt-get upgrade && apt-get dist-upgrade`\n2. `apt-get autoremove\
  \ && apt-get autoclean`\n\n命令行上的 `&&` 允许多个命令顺序执行。\n\n## Debian 软件包管理器\n\nLinux 的主要版本（或发行版）拥有各自的应用程序打包系统。Kali\
  \ Linux 构建在 Debian 7.0 基础操作系统之上，可能需要第三方应用程序，例如 Tenable 的 Nessus。Nessus 是一种漏洞扫描应用程序，可以从适用于\
  \ Debian 软件包管理器的预包文件中安装。Nessus 的使用将在扫描章节中介绍。在下载此类应用程序时，请寻找文件名结尾的 `.deb` 文件扩展名。\n\
  \n使用 Debian 软件包管理器相比 APT 没有优势。`apt-get` 程序专门为管理 Debian 软件包而编写。必须从供应商处购买的第三方公司应用程序是不公开的，`apt-get`\
  \ 的源将无法找到下载和安装软件包。Kali Linux 在不安装额外软件的情况下无法处理 RPM（Red Hat 软件包），不建议在基于 Debian 的系统上使用\
  \ RPM。\n\n### 安装\n\n在下载 `.deb` 软件包后，需要使用 `dpkg` 命令来安装该软件包。大多数 `.deb` 软件包都是直接的，并包含了应用程序成功运行所需的所有必要依赖项。在少数情况下（主要是授权软件），供应商可能要求在安装之前执行额外的步骤，并通常会提供在系统上正确安装的说明。在开始安装之前，务必检查供应商的文档：\n\
  \n\n\n\n\n```\ndpkg -i *{package_name.deb} /{target_directory}\n```\n\n## 移除\n\n\
  移除软件包（`-r`）或清除软件包（`-P`）的工作方式与 APT 完全相同，并遵循处理软件包的相同模式：\n\n```\ndpkg -r *{package_name.deb}\n\
  ```\n\n使用 Debian 软件包管理器清除（purging）软件包与移除函数类似，并可以通过以下命令启动：\n\n```\ndpkg -p *{package_name.deb}\n\
  ```\n\n## 检查已安装的软件包\n\nAPT 相比于 Debian 软件包管理器不具备的一项超能力，是解释已安装或已删除软件当前状态的奇妙能力。在 `dpkg`\
  \ 中使用 `list` 函数时，输出将在行开头显示一个二或三字符的代码，表示软件包的当前安装状态。当针对 Leafpad 应用程序包运行时，下图所示，该软件包已移除，但配置文件仍然可用（图\
  \ 3.1）。\n\n![image](img/F000033f03-01-9780124077492.jpg)\n\n图 3.1 Leafpad 已移除。\n\
  \n在运行 `dpkg -P leafpad` 命令后，软件包的配置文件也被删除。图 3.2 显示了 Leafpad 应用程序包在从系统中完全清除后的相应输出。\n\
  \n![image](img/F000033f03-02-9780124077492.jpg)\n\n图 3.2 Leafpad 已清除。\n\n要查找已安装或已删除软件的状态，请使用以下语法：\n\
  \n```\ndpkg -l *{package_name}\n```\n\n使用以下命令还可以在屏幕上显示关于已安装软件包的更详细信息：\n\n```\ndpkg\
  \ -p *{package_name}\n```\n\n请注意大小写的使用。小写 `p` 将信息打印到屏幕上。大写 `P` 将在不提示“你确定吗？”的情况下从系统中清除软件包。\n\
  \n## Tar 档包 (Tarballs)\n\nTar 起源于 Unix 系统时代，其命名源于它的功能，最初用于将多个文件写入磁带归档（TAR）。并不是所有人都需要将多个文件传输到磁带的能力，但通常需要\
  \ `tar` 程序的内置功能，即生成一个包含多个文件的容器文件。这使得文件的传输更加容易。此外，这些文件可以使用 `gunzip`（`gzip`）进行压缩，以减小整体尺寸。来自第三方或开源项目的某些软件包以\
  \ tar 档包格式下载，并通过 `.tar` 扩展名或用于压缩 tar 档包的 `.tar.gz` 轻松识别。\n\n在渗透测试期间，会产生大量的扫描文档、截图、自定义脚本和客户端文档。使用\
  \ Tar 档包系统可以方便地对所有文档进行收集、管理和发布。强烈建议将所有渗透测试记录在安全位置保留至少 5 年，或者根据工作所在地法律规定的诉讼时效确定的日期。客户可能还对保留要求有规定，这些规定应在渗透测试的介入规则（ROE）中列出。ROE\
  \ 将将在章节中介绍。如果一家公司或承包商频繁进行渗透测试，文档数量可能会迅速堆积并很快失去控制。Tar 档包（尤其是压缩后）提供了一种封装系统，可以使记录分开，并允许更容易的备份和整体管理。\n\
  \n### 创建 Tar 档包\n\n创建 tar 档包文件可以非常简单，也可以非常复杂。记住，`tar` 命令的原有功能是将文件发送到 TAR。对于 tar\
  \ 档包系统的高级用法，请查看 tar 档包的手页（`man tarball`）。对于本书来说，仅包含 tar 档包文件的基本创建；然而，这些信息是有用的，并且可以适用于几乎任何基于\
  \ Linux 的平台。以下步骤提供了用户可以遵循创建示例 tar 档包的操作。步骤如下：\n\n为你的文件创建一个目录。在这种情况下，使用 `mkdir` 命令创建\
  \ `tar-demo1` 目录：\n\n```\nmkdir tar-demo1\n```\n\n接下来，在该目录中创建若干文件，以说明 `tar` 命令。在这种情况下，将使用右大于号（`>`）创建一个内容为“Hello\
  \ world”的文件。该文件将命名为 `file1`，并可以使用相同的语法通过更改最后的数字以相同的方式创建多个文件。以这种方式创建文件也将你的文件移动到指定的目录，在本例中为\
  \ `tar-demo1`：\n\n```\necho “Hello World” > tar-demo1/file1\necho “Hello World”\
  \ > tar-demo1/file2\n```\n\n进入你想要创建 tar 档包的目录。在这种情况下，它是 `tar-demo1` 目录：\n\n```\n\
  cd tar-demo1\n```\n\n生成一个包含当前目录内文件的新 tar 档包。在本例中，使用星号（`*`）表示此目录中的所有内容都应添加到 tar 文件中：\n\
  \n```\ntar -cf tarball-demo.tar *\n```\n\n`tar -tf` 命令用于列出 tar 档包的内容：\n\n```\ntar\
  \ -tf tarball-demo.tar\n```\n\n### 从 Tar 档包中提取文件\n\n从 tar 档包中提取文件的过程就像一、二、三一样简单。从\
  \ tar 档包中提取文件的过程非常容易；然而，提取的位置是关键。从 tar 档包提取的文件放在工作目录。建议尽早养成良好的习惯，因此 tar 档包的用户应该使用\
  \ `-C` 切换。`-C` 允许用户指定文件的位置。\n\n为要提取的文件创建一个目录。在本例中，创建的目录是 `tar-demo2`：\n\n```\nmkdir\
  \ /root/tar-demo2\n```\n\n将文件提取到特定目录：\n\n```\ntar -xf /root/tar-demo1/tarball-demo.tar\
  \ -C /root/tar-demo2\n```\n\n确保所有文件都已提取到指定的目录：\n\n```\nls /root/tar-demo2\n```\n\
  \n### 压缩 Tar 档包\n\nTar 包可以在创建时使用多种算法进行压缩。一种标准是 `gunzip`，也称为 `gzip`。这是通过以下命令完成的。\n\
  \n为你的文件创建一个目录。在这种情况下创建了 `tar-demo3` 目录：\n\n```\nmkdir tar-demo3\n```\n\n现在将你的文件移动到目录。如之前所示，使用\
  \ `echo` 命令创建用于演示的文件：\n\n```\necho “Hello World” > file1\n```\n\n进入你想要创建 tar 档包的目录。再次在本例中使用了\
  \ `tar-demo3` 目录：\n\n```\ncd tar-demo3\n```\n\n生成一个包含当前目录内文件的新 tar 档包。这是通过 `tar`\
  \ 命令使用 `-czf` 切换完成的。`tar` 命令上的切换确保了 tar 档包的正确创建。`c` 切换创建一个归档，`z` 确保文件被压缩（或加密），`f`\
  \ 切换表示切换文件名（`tarball-demo.tar.gz`）将用作新文件的名称。再次星号（`*`）让 tar 知晓目录中的所有内容都应包含在新的 tar\
  \ 文件中：\n\n```\ntar -czf tarball-demo.tar.gz *\n```\n\n列出 tar 档包的内容使用 `t` 和 `f` 切换。`t`\
  \ 切换指示应显示文件内容（或输入到屏幕），再次 `f` 切换指示文件名将紧随切换：\n\n```\ntar -tf tarball-demo.tar.gz\n\
  ```\n\n\n\n\n从压缩的 tar 包中提取文件的方法与从非压缩的 tar 包中提取的方法完全相同。唯一的区别是使用 `x` 选项来指示 `tar` 提取\
  \ tar 包中的内容。虽然不是强制的，但标准做法是用 `.gz` 扩展名命名文件，以告知他人该 tar 包是压缩过的。请注意，此示例中的文件有两个点（`.tar.gz`），这在\
  \ Linux 环境中是完全可以的，也是压缩 tar 文件的标准：\n\n```bash\ntar -xf {tarball_file.tar.gz} -C {directory_for_files}\n\
  ```\n\n## 安装 Nessus 实用指南\n\nTenable 是安全领域备受推崇的名称，它开发了一款名为 Nessus 的优秀漏洞扫描应用程序。该应用程序有两个版本，提供不同的功能级别和支持，分别是\
  \ Nessus Professional（专业版）和 Home（家庭版）。专业版为合规性检查、SCADA 和配置检查提供了多得插件，对于团队使用来说非常强大。对于本书，我们将使用带有家庭版馈源的\
  \ Nessus 漏洞扫描器。Nessus 将在扫描章节中进一步讨论，但现在安装 Nessus 将有助于巩固本的知识。\n\n### 安装 Nessus 之前更新并清理系统\n\
  \n在终端窗口输入以下命令：\n\n```bash\napt-get update && apt-get upgrade && apt-get dist-upgrade\n\
  apt-get autoremove && apt-get autoclean\n```\n\n### 安装并配置 Nessus\n\n从 [`www.nessus.org/download`](http://www.nessus.org/download)\
  \ 下载 Nessus 5.0 或更高版本。根据需要选择 32 位或 64 位操作系统的 Debian 包。阅读订阅协议，如果可以，请点击 Agree 按钮同意该声明。如果不接受协议，将无法安装\
  \ Nessus。请注意文件下载的位置，因为完成安装时需要它。\n\n从终端窗口输入以下内容：\n\n```bash\ndpkg -i ~/{Download_Location}/Nessus-{version}.deb\n\
  ```\n\n在附录 A 中可以找到更全面的设置指南，其中介绍了如何使用 Tribal Chicken 配置渗透环境框架。\n\n## 总结\n\n本章涵盖了在\
  \ Kali Linux 系统上进行包管理的基础技能。`APT` 是一个强大的命令行工具，可以实现包管理、更新和补丁自动化。Debian 包管理器 (`dpkg`）是\
  \ `APT` 构建之上的包管理底层系统。通过对这些工具的基本理解和总体熟悉，任何人都可以保持系统更新并安装新应用程序。\n\n有关本章所描述工具的高级用法，请在终端窗口内或通过各自的官方网站查阅手册页。这些工具具有生成适用于任何人的完美环境的能力，也可以在不发出任何提示或毫无悔的情况下摧毁整个系统。建议在用户熟练使用这些工具之前，应在独立的系统或虚拟环境中进行实践练习。\n\
  \n# 第 4 章\n\n# 配置 Kali Linux\n\n本章涵盖了 Kali Linux 操作系统的基础配置，包括配置网络、apache 服务器、ftp\
  \ 服务器、ssh 以及挂载外部媒体。\n\n### 关键词\n\nKali; Linux; Kali Linux; 配置; 网络; 无线; eth0; ssh;\
  \ http; apache; ftp; 挂载; 硬盘\n\n## 本章内容\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 使用 Kali Linux 默认设置对学习有益，但通常需要修改基本设置以最大限度地利用该平台\n\n## 章节概述和关键学习点\n\n本章将解释\n\n-\
  \ 网络基础\n- 使用图形用户界面配置网络接口\n- 使用命令行配置网络接口\n- 使用图形用户界面配置无线卡\n- 使用命令行配置无线卡\n- 启动、停止和重启\
  \ Apache 服务器\n- 安装 FTP 服务器\n- 启动、停止和重启 SSH 服务器\n- 挂载外部媒体\n- 更新 Kali\n- 升级 Kali\n\
  - 添加 Debian 仓库\n\n## 关于本章\n\n网络是计算机和其他现代电子设备相互通信的方式。这可以被视为设备之间的路径或道路，并带有规则和要求（协议）、交通法规（规则集和配置）、维护小组（网络服务）、执法部门（网络安全）、以及封闭且私有的道路（防火墙端口和协议限制——这也是安全的一部分）。在接下来的章节中，将描述网络基础，以及在\
  \ Kali 中恰当配置网络时需要采取的步骤。\n\n网络是一个复杂的话题，本章仅触及了网络的一角。这里介绍的解释仅用于构建和解释成功配置 Kali Linux\
  \ 网络组件所需的组件。要更详细地了解网络，请查看 Michael Gallo 和 William Hancock 编写的第二版 *Networking Explained*。该解释将为读者提供对基础网络组件的基本理解。\n\
  \n## 网络基础\n\n网络可以被看作计算机之间一系列电子道路。这些道路可以是物理的，最常见的是 5 类或 6 类（`CAT 5` 或 `CAT 6`）电缆或光纤。无线网络使用特殊的无线电发射器和接收器来执行与物理网络相同的各种任务。有线网卡\
  \ (`NIC`) 如图图 4.1 所示，无线模块如图图 4.2 所示。\n\n![image](img/F000045f04-01-9780124077492.jpg)\n\
  \n图 4.1 网络接口适配卡。\n\n![image](img/F000045f04-02-9780124077492.jpg)\n\n图 4.2 无线网卡。\n\
  \n无论介质如何，物理网络或无线网络都具有相同的基本组件。首先有两个或多个设备将进行通信，例如 Adams 的计算机将与 Bill 的计算机通信。为了实现这一点，他们需要在正确的介质上运行正确的通信设备。在本文示例中，Adam\
  \ 将连接到与 Bill 相同的物理 CAT5 网络；然而，只要双方的协议和设置都是正确的，Bill 可以使用无线网卡，而 Adam 可以使用有线网卡。为了让这能够正常工作，Adam\
  \ 和 Bill 都需要通过像无线路由器之类的设备连接到同一个网段，该设备将连接有线和无线不同的物理介质类型。\n\n\n\n\n一个现代网络由许多组件组成，完全解释网络技术远超本书的范围；然而，本文将解释的微型网络网段已足够描述如何配置网卡。这个微型网络仅包含\
  \ Adam 和 Bill 使用的两台电脑、一个连接到电缆调制解调器的有线路由器，以及连接所有设备的电缆（在本例中全部为 CAT5 线缆）。路由器的内部互联网协议（IP）地址为\
  \ `192.168.1.1`，这在小型办公家庭办公（SOHO）和家庭网络的默认配置中非常常见。这个小型路由器通过其外部连接连接到互联网，使用由互联网服务供应商（ISP）分配的\
  \ IP 地址，这使得 Adam 和 Bill 在正确配置网卡后就可以上网了。在本例中，路由器还提供了动态主机配置协议（`DHCP`）、基础防火墙功能和域名服务（`DNS`），这些内容将在稍后进行详细讨论。该网络在图\
  \ 4.3 中所示，并将作为后续所有章节的基础网络。\n\n![image](img/F000045f04-03-9780124077492.jpg)\n\n\
  图 4.3 小型网络网段示例。\n\n### 私有地址\n\n路由器的内部接口（或网卡）的 IP 地址为 `192.168.1.1`，这被称为私有地址，因为它不能在互联网上使用。对于图\
  \ 4.3 中灰色框表示的内部网络来说是可以的，由 `DHCP` 分配的所有地址也是如此，例如分配给 Adam 和 Bill 电脑的 IP 地址。表 4.1 列出了用于内部或私有网络的常用私有\
  \ IP 地址，这些地址不能在互联网上。\n\n表 4.1\n\n私有 IP 地址\n\n| IP 地址范围 | 可能地址的数量 |\n| --- | ---\
  \ |\n| `10.0.0.0` 到 `10.255.255.255` | `16,777,216` |\n| `172.16.0.0` 到 `172.31.255.255`\
  \ | `1,048,576` |\n| `192.168.0.0` 到 `192.168.255.255` | `65,536` |\n\n为了访问互联网，路由器会执行一种称为网络地址转换（`NAT`）的魔法，将\
  \ Adam 和 Bill 使用的 IP 地址转换为可以在互联网上使用的地址。这通常是电缆互联网供应商提供给路由器的地址，并将分配给外部接口（另一个网卡）。如果用户尝试在互联网上使用这些地址而没有经过带\
  \ `NAT` 的路由器，通信将会失败，因为互联网路由器和其他设备会拒绝这些私有 IP 地址。\n\n### 默认网关\n\n路由器将内部和外部这两个网络分开，并提供一些基础安全功能，例如简单的防火墙。此外，路由器提供了一个从私有网络到公共网络（通常是互联网）的出口。因此，路由器的内部\
  \ IP 地址是 Adam 和 Bill 网络的出口。这个地址被称为默认网关，将在稍后配置用户两台电脑的网卡时使用。可视化默认网关的一种良好方法是将其看作离开小镇的唯一出口道路。任何想要离开小镇的人都需要知道这条路在哪里。网络上的电脑（通过网卡）需要知道本地网络的出口在哪里，这就是默认网关。\n\
  \n### 服务器\n\n电脑之间通过数字进行通信，而人更擅长用单词和短语进行交流。为了使通信正常运行，网络通常会使用名称服务器或域名服务（`DNS`）。本书将在稍后详细地介绍\
  \ `DNS`，因此在本章中仅将对 `DNS` 进行高层次概述。基本上，名称服务器将人类友好的名称（如 [www.syngress.com](http://www.syngress.com)）转换为计算机和网络组件更擅长处理的\
  \ IP 地址。`DNS` 与名称服务器同义，它提供了人类友好型和计算机友好型地址之间的转换。例如，当一台电脑想要与另一台电脑（例如 Web 服务器）通信时，它必须先将人类可读的地址转换为用于路由消息的计算机友好地址。人们会在喜喜欢的浏览器中输入\
  \ [www.syngress.com](http://www.syngress.com)，电脑会将此地址转发给 `DNS` 机器进行解析。`DNS` 会返回托管网页的机器\
  \ IP 地址（`69.163.177.2`）。用户的电脑随后将使用此 IP 地址与 Syngress Web 服务器通信，用户就可以与 Syngress 网页交互。没有这项服务，人类将记住每个网站的唯一\
  \ IP 地址。这意味着人们必须记住 `69.163.177.2` 而不是 [syngressc.com](http://syngressc.com)。手动配置网卡需要识别\
  \ `DNS` 或名称服务器。\n\n### DHCP\n\n对于纯粹的网络魔法，没有什么能比得上 `DHCP` 了。对于一台设置了 `DHCP` 自动配置的电脑，用户只需要连接到工作的网络即可。\n\
  \n### 基础子网划分\n\n子网划分是一个会让很多人感到困惑的话题，因此出于本书的考虑，子网划分将仅解释为以节省 IP 地址的最佳方式配置网络的方法。这是通过应用掩码来实现，过滤掉电脑的部分\
  \ IP 地址，允许网络地址址被发现。回到 Syngress 的示例，IP 地址是 `69.163.177.2`，如果我们处于一个少于 255 个用户的小型网络中，可以使用\
  \ C 类子网掩码 `255.255.255.0`。在应用掩码时，地址的部分被消，，其他部分保留，允许网络上的电脑知道自己处于哪个网络。再次，子网掩码的一个基础示例仅使用\
  \ `255` 和 `0` 数字作为字节；因此，为了识别网络，地址中任何与 `255` 匹配的任何都不会发生更改，因此 IP 地址的前三个字节（`69`、`163`、`177`）都将与\
  \ `255` 匹配，允许原始数字通过。任何与 `0` 匹配的数字会被完全消掉，因此地址的最后一个字节（即 `2`）会被消掉导致产生 `0`。因此通过对地址 `69.163.177.2`\
  \ 应用子网掩码 `255.255.255.0`，我们发现网络地址是 `69.163.177.0`。在大多数小型网络中，`255.255.255.0` 子网掩码将运行良好，较大的网络将需要不同的子网掩码，该掩码可能是为了为特定数量的网络主机提供服务而计算的。\n\
  \n### Kali Linux 默认设置\n\n\n\n如前所述，大多数渗透测试工程师（白帽黑客）不希望他们的网卡在计算机连接网络时就立即在网络上宣告自己的存在。这正是\
  \ `Kali Linux` 在启动并连接到网络时会发生的事情。在进行渗透测试时，必须小心，通过在接入网络之前禁用网卡，以避免这种不必要的额外通信。对于包括安装到硬盘、优\
  \ 盘或 SD 卡在内的自定义安装，这种自动网络配置是可以更改的。更改此点的另一种方法是构建一个自定义的启动盘，并将其配置为手动网络配置。这些方法将在第 5 章关于自定义\
  \ `Kali Linux` 的章节中进行讨论。\n\n## 使用图形用户界面配置网络接口\n\n在 Linux 中配置网卡（也称为网络适配器）曾是一个只能通过命令行完成的过程。这种情况在最近几年发生了变化，`Kali\
  \ Linux` 例外；事实上，`Kali Linux` 拥有强大的图形用户界面（GUI），允许通过简单的对话框配置许多常用设置。通过选择用户界面右上角的“应用程序”（Applications）（图\
  \ 4.4），然后选择“系统工具”（System Tools）、“首选项”（Preferences）和“网络连接”（Network connections），即可轻松访问网络配置对话框。\n\
  \n![image](img/F000045f04-04-9780124077492.jpg)\n\n图 4.4 图形网络配置。\n\n点击“网络连接”，将显示网络连接对话框，默认选中“有线”（wired）选项卡（图\
  \ 4.5）。或者，右键点击屏幕右上角的两台计算机图标（如图 4.6\n\n图 4.5 图形有线网络配置。\n\n![image](img/F000045f04-06-97801224077492.jpg)\n\
  \n图 4.6 另一种图形有线网络配置。\n\n可以通过选择“802.1x 安全性”（802.1x Security）选项卡、“IPv4 设置”（IPv4 Settings）或“IPv6\
  \ 设置”（IPv6 Settings）选项卡来制作有线以太配置。本书将重点关注配置 IP 版本 4 (IPv4) 设置，因此选择该选项卡。一旦选中，即可配置计算机的\
  \ IP 地址（`192.168.1.66`）、子网掩码或 Mask（`255.255.255.0`）、网关（`192.168.1.1`）和 DNS 服务器（`192.168.1.1`）。可以使用逗号分隔多个\
  \ DNS 服务器。选择“保存”（Save）按钮可以保存并激活配置。\n\n## 使用命令行配置网络接口\n\n了解如何从提示符配置或重新配置网络适配器非常重要，这在不使用\
  \ Linux 图形界面或通过终端窗口远程连接到系统时非常有用。在渗透测试的许多情况下，命令行是进行更改的唯一选择。这些更改需要以具有高权限的用户身份进行，使用\
  \ `root` 账户是在活动发行版上进行这些更改的好方法，而使用 `sudo` 命令进行更改是 `Kali Linux` 安装的另一种选择。一旦权限提升，就可以配置网卡了。\n\
  \n使用以下命令检查计算机网卡的状态以及每块卡的状态。\n\n```\nifconfig -a\n```\n\n这将显示计算机上所有网卡的当前配置。在图 4.7\
  \ 中显示了两个网络地址：`eth0` 是第一个以太网卡，`lo` 是环回或内部接口。该适配器的设置是使用图形界面设置的。使用提示符更改这些设置非常简单。\n\n\
  ![image](img/F000045f04-07-9780122077492.jpg)\n\n图 4.7 通过命令行查看网络配置状态。\n\n### 启动和停止接口\n\
  \n在指定要停止或启动的接口时，可以使用 `ifconfig` 命令的 `up` 选项启动，或使用 `down` 选项停止。以下命令将停止第一块以太网适配器。\n\
  \n```\nifconfig eth0 down\n```\n\n以下命令将启动第一块以太网适配器。\n\n```\nifconfig eth0 up\n```\n\
  \n可以使用以下命令将此适配器的 IP 地址从其当前配置 `192.168.1.66` 更改为 `192.168.1.22`。\n\n```\nifconfig\
  \ eth0 192.168.1.22\n```\n\n还可以使用以下命令通过命令行更改网络掩码。这将将 IP 地址设置为 `192.168.1.22` 并将子网掩码设置为\
  \ `255.255.255.0`。\n\n```\nifconfig eth0 192.168.1.22 netmask 255.255.255.0\n```\n\
  \n在命令行下对网卡进行完整配置比使用图形用户界面需要多一些工作，因为配置设置并非都存储在同一个位置。\n\n\n\n\n\n## 使用 GUI 配置无线卡\n\
  \n可以使用之前在以太网接口图形化配置期间描述的 GUI 完成无线网卡的配置。在这种情况下，不要选择 Wired（有线）选项卡，而要在网络连接对话框中选择 `Wireless`无线）选项卡。\n\
  \n从此选项卡选择`Add`按钮，这将显示一个标题为“Editing Wireless connection 1”的对话框（假设这是第一个无线适配器）。该对话框有四个选项卡，用于启用无线卡的配置，如图\
  \ 4.8\n\n图 4.8 图形无线网络配置。\n\n### 连接名称\n\n连接名称设置默认为“Wireless connection”，后跟正在配置的适配器编号，在此情况下为`Wireless\
  \ connection 1`。此名称可以更改为更有意义的内容，例如`client1 wireless connection`。\n\n## 自动连接复选框\n\
  \n当勾选“Connect automatically”（自动连接）复选框时，系统将在计算机启动时无需用户干预自动尝试连接无线网络。与之前描述的`DHCP`一样，这对于大多数\
  \ Linux 用户可能方便，但对于渗透测试人员来说通常不是最佳选择，因为它向测试人员宣告他们在网络上的存在。如果取消勾选复选框，测试人员将手动启用无线适配器。\n\
  \n## 无线选项卡\n\n### 服务集标识符\n\n服务集标识符（`SSID`）是用于逻辑识别无线网络的网络名称。每个网络将有一个标识网络的唯一 `SSID`，该名称将用于客户端连接到网络。在具有中心接入点的网络中，`SSID`\
  \ 设置在接入点上，所有客户端必须使用该 `SSID` 连接到网络。在具有多个接入点的网络中，每个接入点的 `SSID` 必须相同以便通信。\n\n### 模式\n\
  \n无线卡可以配置为两种模式：`ad hoc`（点型）或 infrastructure（基础设施）。`ad hoc` 网络通常是计算机之间没有中心节点执行网络管理功能的非正式无线连接。在这些连接中，每个无线连接都必须配置为匹配彼此计算机的无线设置以建立连接。在基础设施模式下，中心接入点管理连接到网络的客户端以及服务集中的其他计算机。所有客户端必须配置为匹配接入点中定义的设置。这两个选项之间的主要区别是，`ad\
  \ hoc` 网络中没有中心管理，而接入点在基础设施模式下对连接进行连接。\n\n### 基础服务集标识符\n\n基础服务集标识符（`BSSID`）在基础设施模式下用于标识接入点的介质访问控制（`MAC`）地址。与\
  \ `SSID` 不同，每个接入点有一个唯一的 `BSSID`，因为每个接入点应该有一个唯一的 `MAC` 地址。\n\n### 设备 MAC 地址\n\n设备\
  \ `MAC` 地址字段用于将此配置锁定到物理无线适配器上。当计算机具有多个无线适配器时，这非常方便。此字段的下拉列表将填充活动无线适配器的 `MAC` 地址。只需为你正在配置的适配器选择正确的\
  \ `MAC` 地址即可。\n\n### 克隆 MAC 地址\n\n很多时候，渗透测试人员不想使用计算机上运行适配器的实际 `MAC` 地址。这可能是为了绕过简单的安全程序，例如\
  \ `MAC` 地址过滤（仅允许具有特定 `MAC` 地址的系统连接到网络）。这也可以用来伪装你的无线适配器，使其看起来来自另一个制造商，以匹配无线网络上使用的无线卡。输入应被克隆并用于此适配器的\
  \ `MAC` 地址。\n\n### 最大传输单元\n\n最大传输单元（`MTU`）是一种网络设置，用于确定与计算机通信时网络包有多大。在大多数情况下，`MTU`\
  \ 可以设置为自动且且良好良好。在应用程序需要特定 `MTU` 的情况下，请参考该应用程序的文档来确定 `MTU` 并在此区域中进行设置。\n\n## 无线安全选项卡\n\
  \n### 安全下拉菜单\n\n`Security` 下拉区域用于选择无线网络的安全方法。对于 `ad hoc` 网络，网络用户决定正确的安全设置，确保每个客户端的安全设置与网络中的其他计算机匹配。在基础设施模式下，每个客户端都必须配置为匹配接入点的安全设置。\n\
  \n### 有线等效加密\n\n无线等效加密（`WEP`）是一种旧的安全方法，它使用基本加密技术提供等于有线系统的安全性。`WEP` 使用 10 或 26 位十六密钥来保护通信。`WEP`\
  \ 加密标准存在安全漏洞，允许渗透测试人员轻松破解大多数 `WEP` 加密密钥。动态 `WEP` 使用 `IEEE 802.1x` 中列出的端口安全措施为无线网络提供额外的安全措施。\n\
  \n### 轻量级扩展验证协议\n\n轻量级扩展验证协议（`LEAP`）由思科系统开发，旨在提供比不安全的 `WEP` 方法更强的安全性。`LEAP` 类似于动态\
  \ `WEP`。\n\n### WiFi 保护访问\n\nWiFi 保护访问（`WPA`）是一种接入技术，使用临时密钥完整性协议（`TKIP`）和完整性检查来增强无线网络的安全性。采用\
  \ `WPA` 的网络比受 `WEP` 保护的无线网络更能抵抗攻击。初始的 `WPA` 标准随着 `WPA2` 的发布得到了增强，使用了更强的加密安全方法。在\
  \ `WPA-personal` 下，每台计算机都使用由密码或短语生成的密钥进行配置。`WPA enterprise` 需要中心远程认证拨入用户服务（`RADIUS`）服务器和\
  \ `802.1x` 端口安全措施。虽然 `WPA enterprise` 设置复杂，但它提供了额外的安全措施。\n\n### 密码和密钥\n\n如果从下拉菜单中选择了\
  \ `WEP` 或 `WPA personal` 作为安全方法，请在密码/密钥字段中输入安全密钥。勾选 `Show password/key` 复选框以验证所使用的密钥输入正确。在不需要显示密码的情况下，请取消勾选复选框。某些系统使用旋转密码或密钥的方法。如果是这种情况，请通过选择正确的索引并输入该索引的正确密钥或密码为每个索引输入密码或密钥。\n\
  \n\n\n\n网络可能采用开放系统认证或共享密钥认证。在共享密钥认证中，访问点会向尝试连接的计算机发送一条挑战文本消息。连接的计算机随后使用 `WEP` 密钥对该文本进行加密，并将加密后的文本返回给访问点。如果连接计算机所使用的加密密钥产生了正确的加密字符串，访问点将允许连接。另一方面，开放系统认证允许计算机在不经过这种挑战与响应序列的情况下进行连接，依赖于计算机使用正确的\
  \ `SSID`。在两种情况下，当使用 `WEP` 密钥保护通道时，通信通道即告完成。虽然共享密钥认证看起来更安全，但实际上它并不安全，因为挑战文本和加密后的文本响应是以明文发送的，允许任何监控无线通道的人捕获挑战和响应。由于\
  \ `WEP` 密钥被用于加密挑战，通过捕获挑战和响应就可以推断出 `WEP` 密钥。\n\nLEAP 安全使用用户名和密码。当选择 LEAP 时，应将这些信息输入到相应的字段中。\n\
  \n动态 `WEP` 和 `WPA` 企业级需要大量的设置、证书和配置来进行管理。本文将不会涵盖这些设置；但是，如果你正在加入一个使用这些方法进行安全的网络，只需输入正确的详情并提供正确的证书即可。\n\
  \n### IPv4 设置选项卡\n\n一旦完成了 `Wireless` 和 `Wireless Security` 选项卡中的信息，就可以完成 `IPv4`\
  \ 配置。配置这些设置的过程与之前描述的配置物理以太网连接的过程相同。\n\n### 保存\n\n一旦提供了所有必需信息，点击 `Save` 按钮即可保存设置。设置保存后，计算机将尝试连接到网络。这通过屏幕右上角的图形进行视觉化显示。任何错误都将在对话框中显示。\n\
  \n## Web 服务器\n\nKali Linux 包含一个易于配置的 `Apache` Web 服务器。拥有一个易于配置的 Web 服务器对于渗透测试人员是一个极好的优势。例如，使用此服务，可以创建模仿互联网上现有页面的网站。这些网站随后可以使用社交工程技术（如钓鱼）向目标网络上的用户投放恶意代码，包括共存托管有后门的服务器、处理回调以及向其他恶意软件提供命令。HTTP\
  \ 服务在渗透测试中还有许多许多其他用途。\n\n### 使用 GUI 启动、停止或重启 Apache 服务器\n\n使用 GUI 是启动、停止或重启/重置 Web\
  \ 服务最简单的方法，为此请从 Kali 屏幕顶部的栏中选择 `Applications`。在弹出的列表中选择 `Kali Linux`，这将显示一个子菜单。从该菜单中，选择\
  \ `System Services`，它将再次显示另一个菜单，在弹出菜单上选择 `HTTP` 选项。这将显示启动、停止和重启 `Apache` 服务的选项。\n\
  \n从菜单中做出选择后，将启动一个命令 shell 并显示服务器状态。Kali Linux 的默认安装在启动或重启 `Apache` 服务器时会显示一个错误。你可能看到的错误是：“Could\
  \ not reliably determine the server’s fully qualified domain name, using `127.0.0.1`\
  \ for `ServerName`。”此错误在此时不会引起任何问题，因为 Web 服务器将根据系统的 IP 地址在网络上可用。若要纠正此错误，请编辑 `/etc/apache2/`\
  \ 中的 `apache2.conf` 文件，在该文件末尾的 `ServerName` 之后添加要使用的服务器名称，然后保存文件，如下：\n\n```\nServerName\
  \ localhost\n```\n\n当 `Apache` 服务器启动或重启后，可以通过在 Web 浏览器中输入计算机的 IP 地址访问默认网页。Kali Linux\
  \ 发行版包含了 `IceWeasle` 浏览器，可以通过点击顶栏上的 `IceWeasle` 图标（一个被白色鼬鼠环绕的蓝色地球）来访问。\n\n### 在命令行提示符处启动、停止和重启\
  \ Apache\n\n可以使用命令 `/etc/init.d/apache2` 后跟请求的操作（stop、start 或 restart）来轻松地启动、停止和重启\
  \ `Apache` HTTP 服务器。使用命令行产生的结果与 GUI 相同。\n\n```bash\n/etc/init.d/apache2 start\n\
  /etc/init.d/apache2 stop\n/etc/init.d/apache2 restart\n```\n\n### 默认网页\n\n一旦 `Apache`\
  \ 服务运行，可能需要更改默认的（It works!）网页。为此，请创建应显示在网页上的 Web 内容，并将其保存为 `/var/www/` 目录下的 `index.html`。或者，也可以修改此位置现有的\
  \ `index.html` 文件并添加新页面。\n\n## FTP 服务器\n\n文件传输协议（FTP）用于在计算机之间移动文件。需要注意的是，FTP 不加密文件或计算机之间的通信通道，因此任何在计算机之间通过网络（或互联网）传输的文件都可以被任何监控网络的人看到。\n\
  \nKali Linux 不包含 FTP 服务器，因此可以添加一个以便在系统之间传输文件。可以添加许多 FTP 服务，其中之一是 `Pure-FTPd` ([`www.pureftpd.org/project/pure-ftpd`](http://www.pureftpd.org/project/pure-ftpd))；然而，任何支持的\
  \ FTP 守护进程都可以接受。使用以下命令通过 `apt-get` 命令下载并安装 `Pure-FTPd` 服务：\n\n```bash\napt-get install\
  \ pure-ftpd-common pure-ftpd\n```\n\n![image](img/F000045f04-09-9780124077492.jpg)\n\
  \n图 4.9 `apt-get install` `Pure-FTPd`。\n\n这将安装并设置 FTP 服务。需要进行一些少量配置以确保 `Pure-FTP\
  \ Server` 的正常运行。\n\n```bash\ncd /etc/pure-ftpd/conf\necho no > Bind\necho no > PAMAuthentication\n\
  echo no > UnixAuthentication\nln -s /etc/pure-ftpd/conf/PureDB /etc/pure-ftpd/auth/50pure\n\
  ```\n\n接下来必须为 FTP 服务创建组和用户。首先创建一个新的系统组。\n\n```bash\ngroupadd ftpgroup\n```\n\n接下来添加新创建的组。此命令将赋予用户没有主目录权限或\
  \ shell 权限。\n\n```bash\nuseradd –g ftpgroup -d /dev/null –s /bin/false ftpuser\n\
  ```\n\n为 ftp 文件创建一个目录。\n\n```bash\nmkdir -p /home/pubftp\n```\n\n将用户文件夹添加到 ftp 目录。在这种情况下，将要创建的用户\
  \ `sam` 需要一个目录。\n\n```bash\nmkdir /home/pubftp/sam\n```\n\n现在为 FTP 服务添加用户和密码。在这种情况下，创建了用户\
  \ `sam`。\n\n```bash\npure-pw useradd sam –u ftpuser –g ftpgroup –d /home/pubftp/sam\n\
  ```\n\n提示需要创建一个密码。使用以下命令更新 `Pure-FTPd` 数据库。\n\n```bash\npure-pw mkdb\n```\n\n最后，使用以下命令启动\
  \ FTP 服务。\n\n```bash\nservice pure-ftpd start\n```\n\n启动 `Pure-FTPd` 后，使用以下命令进行测试是一个好主意。\n\
  \n```bash\nftp {IP_Address}\n```\n\n在提示时输入用户名 `sam` 和密码。如果验证成功，说明 FTP 服务器运行正常。如果未成功，请重启计算机并再次尝试\
  \ `ftp` 服务器。\n\n来自 [`samiux.blogspot.com/2011/08/howto-pure-ftpd-and-atftpd-on-backtrack.html`](http://samiux.blogspot.com/2011/08/howto-pure-ftpd-and-atftpd-on-backtrack.html)\
  \ 的指南用于完成使 `Pure-FTPd` 正常运行所需的步骤。\n\n## SSH 服务器\n\n\n\nSecure Shell (`SSH`) 是一种更安全的方法，用于从远程访问\
  \ Kali Linux 文件系统的内容。`SSH` 在通信计算机之间提供了一个安全、加密的通信通道。这对于渗透人员非常有帮助，因为它允许文件传输能够进行，而不会被入侵检测系统\
  \ (`IDS`) 和入侵防御系统 (`IPS`) 等网络安全工具进行检查。\n\n### 生成 SSH 密钥\n\n为了安全地使用 `SSH`，必须生成加密密钥以促进安全加密通信。要生成这些密钥，请在命令提示符处输入以下命令。\n\
  \n将原始 SSH 密钥从默认目录移动；但不要删除它们。\n\n```bash\nmkdir -p /etc/ssh/original_keys\nmv /etc/ssh/ssh_host_*\
  \ /etc/ssh/original_keys\ncd /etc/ssh\n```\n\n生成新的 SSH 密钥。\n\n```bash\ndpkg-reconfigure\
  \ openssh-server\n```\n\n启动/重启 SSH 进程。\n\n```bash\nservice ssh (start | restart)\n\
  ```\n\n### 通过 Kali GUI 管理 SSH 服务\n\nSSH 服务器内置在 Kali GUI 的主文件结构中，其访问方式与启动或停止 Apache\
  \ 服务器相同。要访问 SSH 菜单，从 Kali 屏幕顶栏选择“应用程序”（Applications）。在弹出的列表中选择“Kali Linux”，这将显示一个子菜单。从该菜单中选择“系统服务”（System\
  \ Services），它将再次显示另一个菜单，在弹出菜单中选择 `SSH` 选项。这将显示启动、停止和重启 SSH 服务的选项。\n\n### 从命令行管理\
  \ SSH 服务器\n\n可以启动 SSH 服务器。也可以从命令提示符停止和重启它。要执行此操作，将正在执行的操作（启动、停止或重启）添加到命令 `/etc/init.d/ssh`\
  \ 之后，如下所示所示。\n\n```bash\n/etc/init.d/ssh start\n/etc/init.d/ssh stop\n/etc/init.d/ssh\
  \ restart\n```\n\n### 访问远程系统\n\n一旦在 Kali 系统上启动了 `SSH` 服务，就可以从 Linux 系统通过在命令提示符输入以下命令远程访问该计算机（用户名\
  \ `sam`，远程系统 IP 地址为 `192.168.1.66`）。\n\n```bash\nssh sam@192.168.1.66\n```\n\n从\
  \ Windows 客户端访问 `SSH` 需要使用 `SSH` 客户端。互联网上有许多此类工具，例如 `putty` 是一个可以从 [`putty.org`](http://putty.org)\
  \ 获取常用工具。只需安装客户端并提供 Kali Linux 计算机的 IP 地址或名称以及登录凭据即可连接到远程 Kali 计算机。\n\n## 配置和访问外部媒体\n\
  \n在 Kali Linux 中，访问硬盘或优 盘等外部媒体比在早版本的 Backtrack 中简单得多。通常情况下，使用通用串行总线 (`USB`) 连接到系统的媒体将被操作系统检测到并可用。但是，如果没有自动发生，则可能需要手动挂载驱动器。\n\
  \n### 手动挂载驱动器\n\n手动向 Kali Linux 挂载驱动器时必须完成的操作是将物理驱动器连接到计算机。接下来打开命令提示符并创建一个挂载点。为所使用的账户创建挂载点权限需要提升权限，如果没有使用\
  \ root 账户，可以使用 `sudo` 命令完成。以下命令将在 `media` 目录中创建一个名为 `newdrive` 的挂载点。\n\n```bash\n\
  mkdir /media/newdrive\n```\n\n使用 `fdisk` 命令结合你正在连接的驱动器详细信息来确定你正在连接的驱动器和分区。第一个硬盘通常为\
  \ `hda`，该驱动器上的第一个分区将为 `hda1`。此序列持续连接到计算机的附加驱动器，第二个为 `hdb`，第三个为 `hdc`。大多数情况下，主内部驱动器标记为\
  \ `hda`，因此第一个外部驱动器将标记为 `hdb`。要将 `hdb` 的第一个分区挂载到上一步创建的 `newdrive` 目录，使用以下命令。\n\n\
  ```bash\nmount /dev/hdb1 /media/newdrive\n```\n\n完成后，通过导航到 `newdrive` 目录即可访问驱动器内容。\n\
  \n```bash\ncd /media/newdrive\n```\n\n## 更新 Kali\n\n与其他操作系统一样，Kali 内置了同时更新操作系统和已安装应用程序（或软件包）的能力。当软件包更新可用时，它们将发布到\
  \ Kali 存储库。此时可以检查该存储库以确保操作系统和应用程序都是最新版本。更新通常是修复软件漏洞或错误的较小修复程序，或者用于添加新的硬件功能。可以使用\
  \ `apt-get` 命令行工具更新 Kali。\n\n```bash\napt-get update\n```\n\n## 升级 Kali\n\n与更新一样，升级\
  \ Kali 也可以通过命令行使用 `apt-get` 工具完成。升级通常是对应用程序或操作系统本身的大版本修订。升级提供了新功能，并且比更新大得多，通常需要在系统驱动器上占用更多空间。\n\
  \n```bash\napt-get upgrade\n```\n\n升级过程的示例如图 4.10 所示。\n\n![image](img/F000045f04-10-9780124077492.jpg)\n\
  \n图 4.10 升级过程。\n\n## 添加存储库源\n\n默认情况下，Kali 只检查存储在其自身存储库中的软件更新和升级。这通常是好事，因为某些更新或升级可能会破坏\
  \ Kali 的功能。由于此原因，更新和升级在添加到官方 Kali 存储库之前由 Offensive Security 的开发人员进行测试。虽然这通常是好事，但某些软件应用程序在默认\
  \ Kali 发行版中可用，可能需要添加存储库，在本例中将添加 Debian 存储库。使用 `nano` 或不同的文本编辑器打开 `/etc/apt/sources.list`。\n\
  \n```bash\nnano /etc/apt/sources.list\n```\n\n打开后，在文件末尾添加以下注释和两行。\n\n```text\n#debian\
  \ 7 main (this is just a comment)\ndeb http://archive.debian.org/debian stable main\
  \ non-free\ndeb-src http://archive.debian.org/debian stable main non-free\n```\n\
  \n现在保存文件，在 `nano` 中通过按控制 + O 键保存文件，按回车键相同文件名保存，最后使用控制 + X 键退出。这将主 Debian 存储库添加到\
  \ Kali 用于检查更新或升级的存储库列表中，也将用于搜索应用程序或软件包。要完成此更改，请使用 `update` 命令根据新存储库更新 Kali。\n\n\
  ```bash\napt-get update\n```\n\n\n\n\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 扩展你的实验室\n\n![ent](img/FilledVerySmallSquare_9642.gif) 魔法的代码注入彩虹\n\n## 章节概述与核心学习点\n\
  \n本章将介绍：\n\n– 如何使用虚拟化技术构建渗透测试实验室\n– `VirtualBox` 的安装与配置\n– 在实验室环境中安装 `Metasploitable2`\
  \ 平台\n\n## 在阅读本章之前：构建实验室\n\n一个人如何获得实践、研究和学习漏洞利用过程的机会？构建一个实验室并开始行动吧！既然互联网已经触手可及，为什么还要构建实验室呢？这是一个简单的问题，但答案也同样简单，因为没人想坐牢。务必记住测试不属于你的网络的后果。在攻击政府或金融系统（如银行）的情况下，处罚可能是在联邦监狱服刑\
  \ 20 年或更久。在网络犯罪面前，对联邦或州法律的无知并不是借口。要小心，要聪明，要构建实验室。本章中的练习是在公开的训练应用程序和软件上完成的。强烈建议在进入下一章之前构建实验室。\n\
  \n## 廉价构建实验室\n\n在虚拟化时代之前，信息技术（IT）专业人员、安全从业人员和学生都有车库、地下室或其他充满了额外的电脑设备。在某些情况下，这些电脑和网络设备从地板堆到天花板，电费高得惊人。拥有大量设备是一件痛苦的事；如果你搬家，更别说带它们走了。感谢你的幸运，现在情况已经不同了。\n\
  \n无论你的电脑运行的是 Windows、Mac 还是 Linux 操作系统，家庭虚拟化主要有两种方法。以下两个程序都是免费的，适用于大多数运行 32 位或 64\
  \ 位架构的操作系统。\n\n### VMWare Player\n\n#### 优点\n\n– 虚拟机 (VMs) 创建在专用于 `NAT` 的虚拟交换机上。多个虚拟机之间可以相互通信，并且可以从主机进行访问。\n\
  – 默认安装了 `DHCP`，所有虚拟机都能自动获取 IP 地址。\n– 对 `Xen`、`XenServer`、`vSphere` 以及其他主要的虚拟机程序提供高级虚拟化支持。\n\
  \n#### 缺点\n\n– 不支持 Mac、Solaris 或 FreeBSD 操作系统。\n– 不允许对现有虚拟机进行快照或克隆。\n– 与某些 WiFi\
  \ 网络适配器存在兼容性问题。\n\n### VirtualBox\n\n#### 优点\n\n– 适用于 Windows、Linux、Mac、Solaris\
  \ 和 FreeBSD。\n– 提供克隆虚拟机的功能（节省时间）。\n– 支持更多类型的虚拟硬盘文件格式。这在运行下载和预构建的虚拟机时特别方便。\n\n####\
  \ 缺点\n\n– 除非在主机上启用了端口转发，否则虚拟机之间是隔离的。\n– 不支持 `Xen`、`XenServer`、`vSphere` 或其他虚拟机程序所需的高级虚拟化。\n\
  – 如果虚拟机崩溃，整个虚拟机损坏的可能性更高。\n\n本指南专门针对安装在 `Microsoft Windows 7 Professional` 上的 Oracle\
  \ `VirtualBox` 版本 `4.2.16`。选择 `VirtualBox` 而不是 `VMWare Player` 是因为出现问题时互联网上有更多资源可以帮助；然而，它需要一些额外的设置。记住，在选择虚拟化系统时，最好的分析是你自己的分析。关于哪种最好一直没有定，最终选择哪种虚拟化系统是个人偏好。此外，与反病毒软件不同，两者都可以安装以满足各种需求，因此可以在同一台电脑上同时安装\
  \ `VirtualBox` 和 `VMWare Player`。本指南中使用的所有链接和引用在编写时都是有效的。请注意版本、下载位置和信息可能会随时间更改。\n\
  \n### 在 Microsoft Windows 7 上安装 VirtualBox\n\n打开网络浏览器并导航到：[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)。确保准确输入或复制网页地址至关重要。为你的操作系统选择正确的程序版本并开始下载过程。下载完成后，运行可执行文件。图\
  \ 5.1 展示了 `VirtualBox` 安装的欢迎对话框。点击 `Next`（下一步）按钮继续。\n\n![image](img/F000057f05-01-9780124077492.jpg)\n\
  \n图 5.1 安装 Virtualbox-1\n\n本教程将不涵盖自定义设置或高级安装。接受图 5.2 所示对话框中的默认选项，并点击 `Next`（下一步）按钮继续。\n\
  \n1. 如图 5.3 所示选择你的图标设置，并点击 `Next`（下一步）按钮。将网络连接警告（图 5.4），点击 `Yes`（是）继续。\n2. 点击 `install`（安装）按钮（图\
  \ 5.5）。如果出现 Microsoft 用户账户控制 (`UAC`) 窗口，点击 `Yes`（是）继续。\n3. 安装可能会提示用户安装设备驱动，如图 5.6\
  \ 所示。在提示时点击 `Install`（安装）按钮继续。（可能会发生多次。）\n\n![image](img/F000057f05-02-9780124077492.jpg)\n\
  \n图 5.2 安装 Virtualbox-2\n\n![image](img/F000057f05-03-9780124077492.jpg)\n\n图 5.3\
  \ 安装 Virtualbox-3\n\n![image](img/F000057f05-04-9780124077492.jpg)\n\n图 5.4 安装 Virtualbox-4\n\
  \n![image](img/F000057f05-05-9780124077492.jpg)\n\n图 5.5 安装 Virtualbox-5\n\n![image](img/F000057f05-06-9780124077492.jpg)\n\
  \n图 5.6 安装 Virtualbox-6\n\n安装完成后，点击 `Finish`（完成）按钮（图 5.7）。\n\n![image](img/F000057f05-07-9780124077492.jpg)\n\
  \n图 5.7 安装 Virtualbox-7\n\n`VirtualBox` 安装现在完成，如果勾选了“安装后启动 Oracle VM VirtualBox\
  \ 4.2.16”设置，`VirtualBox` 将打开并显示如图 5.8 所示的 `VirtualBox Manager`。此时不会创建任何虚拟机，因此可以关闭管理器。\n\
  \n![image](img/F000057f05-08-9780124077492.jpg)\n\n图 5.8 欢迎使用 Virtualbox\n\n打开网络浏览器并返回：[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)。下载\
  \ `VirtualBox 4.2.16 Oracle VirtualBox Extension Pack`。下载完成后，双击文件执行它（图 5.9）。\n\n\
  ![image](img/F000057f05-09-9780124077492.jpg)\n\n图 5.9 VirtualBox 扩展\n\n点击 `Install`（安装）按钮继续。在提示时接受用户许可协议。如果出现\
  \ Windows UAC 对话框，点击 `Yes`（是）继续。安装完成后关闭 `VirtualBox`。\n\n### 设置虚拟攻击平台\n\n为了将所有内容保持在虚拟实验室中，创建一个可以运行\
  \ Kali Linux 的虚拟机是一个好主意。下面的步骤介绍了如何设置 Kali Linux 在 VirtualBox 中作为实时启动系统运行。创建并启动虚拟机后，就可以第\
  \ 2 章中的描述进行硬盘安装。建议创建一个专门用于启动启动镜像的虚拟机。在测试系统或自定义 ISO 时，这个实时启动虚拟机可以反复使用，无需大幅更改配置。\n\
  \n#### 在 VirtualBox 中为 Kali Linux 设置虚拟机\n\n打开 `VirtualBox`，点击 `New`（新建）按钮（图 5.10）。\n\
  \n\n\n\n1. 给新虚拟机取一个名称，在此例中使用了 `Kali-Linux-LiveDisc`。将类型设置为：`Linux`，将版本设置为：`Debian`\
  \ 或 `Debian (64 bit)`（视情况而定），点击 `Next` 按钮继续。\n\n2. 该平台将仅在虚拟机的内存中运行。确保将 RAM 大小至少设置为\
  \ `2 GB`，但建议设置为 `4 GB`，如果允许，越大越好（图 5.11）。\n\n3. 点击 `Next` 按钮继续。接下来选择“现在创建虚拟硬盘”选项，并点击\
  \ `Create` 按钮继续（图 5.12）。\n\n4. 选择 `VMDK`（虚拟机磁盘）选项，并点击 `Next` 按钮继续（图 5.13）。\n\n5.\
  \ 选择 `Fixed Size`（固定大小）选项，并点击 `Next` 按钮（图 5.14）。\n\n6. 默认名称和硬盘大小对于实时光盘场景已经足够；但是，如果你计划在\
  \ VirtualBox 中完整安装 Kali Linux，请将虚拟硬盘大小更改为 `40 GB`。点击 `Create` 按钮继续（图 5.15）。\n\n\
  \    a. 进程完成后，**不要**启动机器。\n\n7. 选择 `Kali-Linux-LiveDisc` 虚拟机，然后点击 `Settings` 按钮。从左侧菜单选择\
  \ `General` 按钮并导航到 `Advanced` 选项卡（图 5.16）。\n\n将 `Shared Clipboard`（共享贴板）设置为：`Bidirectional`（双向），并将\
  \ `Drag‘n’Drop`（拖放）设置为：`Bidirectional`（双向）。\n\n8. 从左侧菜单选择 `Storage`（存储）按钮。点击标记为\
  \ `Empty`（空）的 `Controller: IDE “CD”` 图标。在窗口右侧的 `Live CD/DVD` 选项上勾选。导航到下载的 Kali Linux\
  \ ISO 文件（图 5.17）。\n\n9. 从左侧菜单选择 `Network`（网络）按钮，并将 `Attached to`（连接到）选项设置为：`Host-only\
  \ Adapter`（仅主机适配器）（图 5.18）。\n\n10. 点击 `OK` 按钮保存更改并返回主界面。Kali Linux 虚拟机的构建完成。\n\n\
