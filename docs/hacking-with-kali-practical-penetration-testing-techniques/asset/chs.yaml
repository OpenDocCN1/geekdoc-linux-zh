  \ Kali Linux 历史\n\n## 本书概述与核心学习点\n\n本书使用按需打印技术制造。每副本均根据订单制作，且仅限于黑色墨水。本书的在线版本将在适当之处显示彩色插。\n\
  \n![image](img/F000136fm03-9780124077492.jpg)\n\n本书将通过 `Kali Linux` 介绍渗透测试的周期，并引导读者。本章还将介绍渗透测试领域常用的通用定义。\n\
  \n### 图表、插图与截图\n\n本书中的插图和截图将展示 `Kali Linux` 环境中执行的操作。\n\n![ent](img/FilledVerySmallSquare_9642.gif)\
  \ 常用术语\n\n![ent](img/FilledVerySmallSquare_9642.gif) Kali Linux 历史\n\n 渗透测试周期\n\n\
  \n\n\n目前有多种不同的渗透测试生命周期模型。到目前最常用的是 EC-Council 认证伦理黑客（EC C|EH）计划定义并使用的方法和生命周期。这个五个阶段的过程涵盖了侦察、扫描、获取访问、维持访问和掩盖轨迹\
  \ [[1]](#CHP001.html_BIB1)。本书将遵循 Patrick Engebretson 在其书籍《黑客与渗透测试基础》中阐述的改进渗透测试生命周期\
  \ [[2]](#CHP001.html_BIB2)。该过程遵循了 C|EH 使用的基本阶段，但将不再涵盖最终阶段“掩盖轨迹”。这是一个深思意虑的决定，即从本书书中移除这一阶段，因为该最终阶段的许多技术在更高级的书籍中解释得更清楚。\n\
  \n## 术语\n\n在讨论渗透测试时，有很多常用的术语经常引发争议。不同的职业、技术专长，甚至是同一团队的成员对该领域所用术语的理解也略有不同。因此，本书将使用以下术语及相关定义。\n\
  \n### 渗透测试 (Penetration Testing, Pentesting)\n\n渗透测试是测试人员在特定且批准的指南内，为了尝试绕过信息系统的保护（包括破解该系统的集成安全功能）而使用的方法、流程和程序。这种测试与评估系统的技术、行政和操作设置及控制有关。通常，渗透测试只评估构建完成后的信息系统安全性。目标网络系统的管理员和人员可能知道也可能不知道渗透测试正在进行。\n\
  \n### 红队 (Red Team, Red Teaming)\n\n红队在方法和技术上模拟潜在的对手。这些团队通常比渗透测试团队更大，范围也广泛得多。渗透测试本身通常是红队演习的一个组成部分，但这些演习测试的是组织安全机制的其他功能。红队通常通过技术、社交和物理手段攻击组织，通常使用与黑帽黑客相同的技术来测试组织或信息系统防御这些敌对攻击者的能力。除了渗透测试外，红队还会进行社会工程攻击，包括网络钓鱼和鱼叉式网络钓鱼，以及物理攻击（如翻垃圾桶和开锁），以获取信息和访问权限。在大多数情况下，除了极少数小组外，目标组织的员工并不知道正在进行红队演习。\n\
  \n### 伦理黑客 (Ethical Hacking)\n\n伦理黑客是专业的渗透测试人员，代表系统所有者或拥有信息系统的组织攻击系统。就本书而言，伦理黑客与渗透测试是同义词。\n\
  \n### 白帽 (White Hat)\n\n“白帽”是伦理黑客或专门从事提高信息系统安全方法的计算机安全专业人员的俚语。\n\n### 黑帽 (Black\
  \ Hat)\n\n“黑帽”是指利用技术手段未经许可绕过系统安全以实施计算机犯罪的人。渗透测试人员和红队成员在执行授权的演习或测试时，经常会使用黑帽的技术来模拟这些人。黑帽则在未经许可且非法的情况下进行活动。\n\
  \n### 灰帽 (Grey Hat)\n\n灰帽是指介于白帽和黑帽界限之间的技术专家。这些人通常尝试在未经许可的情况下绕过信息系统的安全功能，并非为了盈利，而是为了通知系统管理员已发现的漏洞。灰帽通常没有测试系统的权限，但通常不是为了个人金钱利益。\n\
  \n### 漏洞评估 (Vulnerability Assessment, Vulnerability Analysis)\n\n漏洞分析用于评估信息系统的安全设置。此类评估包括对系统已应用或缺失的安全补丁进行评估。漏洞评估团队（或\
  \ `VAT`）可以是信息系统的外部人员，也可以是信息系统支持人员的一部分。\n\n### 安全控制评估 (Security Controls Assessment)\n\
  \n安全控制评估评估信息系统对特定法律或法规要求的符合情况。这些要求的示例包括限于：联邦信息安全管理法（FISMA）、支付卡行业（PCI）和健康保险流通与责任法案（HIPAA）。安全控制评估被用作证据库（BOE）的一部分，授权信息系统在生产环境中运行。某些系统要求渗透测试作为安全控制评估的一部分。\n\
  \n### 恶意用户测试 (Malicious User Testing, Mal User Testing)\n\n在恶意用户测试中，评估者扮演采取恶意行为的可信内部人员、恶意用户，或简单地称为恶意用户。在这些测试中，评估者会被授予授权的普通用户或管理员的凭据（通常作为测试账户）。评估者将使用这些凭据尝试绕过安全限制，包括以未经授权的方式查看文档和设置、更改不应更改的设置，以及将其权限提升到账户不应有的水平。恶意用户测试模拟了叛变的可信内部人员的行为。\n\
  \n### 社会工程学 (Social Engineering)\n\n社会工程学涉及试图欺骗系统用户或管理员，为了社会工程师的利益而做出超出工程师访问权限或权利的行为。社会工程攻击通常对信息系统或用户是有害的。社会工程师利用人类帮助他人的固有需求来破坏信息系统。常见的社会工程技术包括试图让帮助台分析师重置用户账户密码，或让终端用户泄露密码，以便社会工程师登录其未经授权的账户。其他社会工程技术包括网络钓鱼和鱼叉式网络钓鱼。\n\
  \n#### 网络钓鱼 (Phishing)\n\n在网络钓鱼（音同 fishing）中，社会工程师试图让目标披露个人信息，如用户名、账号和密码。这通常通过使用来自公司、银行和客户支持人员看似真实但虚假的电子邮件来实现。其他形式的网络钓鱼试图让用户点击虚假链接，允许在用户不知情的情况下在其计算机上安装恶意代码。这些恶意软件将用于从计算机中删除数据或利用计算机攻击他人。网络钓鱼通常不针对特定用户，但可能针对邮件列表所有人或具有特定邮箱后缀的任何人，例如所有具有“@foo.com”后缀的用户。\n\
  \n#### 鱼叉式网络钓鱼 (Spear Phishing)\n\n鱼叉式网络钓鱼是网络钓鱼的一种，其中目标用户被特指出来。例如，攻击者可能会研究并找到公司执行官（CEO）和其他高管的电子邮件地址，并仅对这些人进行钓鱼。\n\
  \n\n\n\n## Live CD、Live 盘或 LiveOS\n\nLive CD 或 Live 盘指的是包含整个操作系统的光盘。这些磁盘对于许多评估人员来说非常有用，并且可以进行修改，以包含特定的软件组件、设置和工具。虽然\
  \ Live 盘通常基于 Linux 发行版，但多年来也发布了几个微软 Windows 版本。根据信息系统的设置，Live 盘可能是评估人员或测试人员带到评估现场的唯一设备，因为目标系统的计算机可以引导至\
  \ Live 盘，从而将信息系统资产之一转化为针对系统自身的工具。\n\n## Kali 历史\n\nKali Linux 是 Offensive Security\
  \ 发布的最新 Live 盘安全发行版。当前版本包含 300 多种安全和渗透测试工具，并被分为渗透测试人员和其他信息系统评估人员最常用的实用分组。与 Offensive\
  \ Security 之前发布的早期发行版不同，Kali Linux 使用 `Debian 7.0` 发行版作为基础。Kali Linux 继续继承其前身 Backtrack\
  \ 的血统，并由同一团队支持。根据 Offensive Security 的说法，更名意味着公司对 Backtrack 发行版的完全重构。相比 Backtrack\
  \ 的早期版本，巨大的改进使其有必要更改名称，以表明这不仅仅是 Backtrack 的新版本。Backtrack 本身是对其源自的两个安全工具 White Hat\
  \ 和 SLAX (WHAX) 以及 Auditor 的改进。在此领域，Kali Linux 是行业领先的安全审计和渗透评估工具的最新形态。\n\n## 参考文献\n\
