  - "[PAGE 54]\n\nHere, the `html` tags are in the middle of HTML code. For a field\
    \ named `{{.Title}}` it is the placeholder for a named Title. To render this,\
    \ we'll call the `template.ParseFiles` and `Execute` functions, which will read\
    \ the title into the `Video` struct and insert it in place of the placeholder,\
    \ appropriately.\n\nLet's see how this works. First, we'll create a dictionary\
    \ that will serve our video:\n\n```\ngo\n// Echo the \"Trip to the zoo\" > videos/video.mp4\n\
    videos := map[string]string{\"Trip to the zoo\": \"videos/video.mp4\"}\n```\n\n\
    We have used map to create files that will stand in MP4 format. If you have a\
    \ video on your computer in MP4 format, you can put it into the zoo directory\
    \ and rename it to `video.mp4`. If you're choosing something else, change the\
    \ history.\n\nWe will now call `template.Execute()` to load this video struct\
    \ that contains the `Title` and the `Trip to the zoo` that is contained in the\
    \ `videata` file.\n\nBefore we go back to programming in Go, let's create the\
    \ HTML template for our video page. Create a file called `template.html` and paste\
    \ the following HTML code:\n\n```\n{{.Title}}\n<video src=\"{{.ID}}/video.mp4\"\
    \ controls=\"controls\">\n  Your browser does not support the video tag.\n</video>\n\
    ```\n\nIn our example, we serve the page with `Trip to the zoo` and the `{{.Title}}`\
    \ placeholder will be replaced with `Trip to the zoo`, using the path `videos/video.mp4`.\n\
    \nThe path of `{{.ID}}` is important because the browser fetches the video relative\
    \ to the root directory, rather than to the `zoo` folder (which corresponds to\
    \ an actual folder). Go back to `main.go` and replace the code inside the `videoHandler`\
    \ function with the following lines:\n\n![](img/70966a5e893fbac28b7b2b33528eb018_54_0.png)\n\
    \n# Figure 5\n\n```\nfunc getAvailableVideos() ([]string, error) {\n\tvideoDirectories,\
    \ err := ioutil.ReadDir(\"videos\")\n\tif err != nil {\n\t\return nil, err\n\t\
    }\n\\var videos []string\n\tfor _, d := range videoDirectories {\n\t\tvideos =\
    \ append(videos, d.Name())\n\t}\n\treturn videos, nil\\}\n```\n\nAbove shows how\
    \ arrays work in Go, but they are much easier to deal with a number of functions\n\
    \n```\nid := r.URL.Path(\"/zoo/{id}\")\nvideo := videos[id]\ntemplate, _ := template.ParseFiles(\"\
    template.html\")\ntemplate.Execute(w, video);\n```\n\nBut there are new types\
    \ in this code. We use a slice of strings to enable us to get out a range of indices.\
    \ The resulting object, called a 'slice', may be used like an array but can also\
    \ grow dynamically. For example, if we have an array, [1:2] cuts out the first\
    \ and second elements of a slice that starts at 0. If we want to parse the path\
    \ `/zoo/{id}` and return all strings starting from the beginning, so we slice\
    \ out from `/zoo` up to the end of the URL string\n\n> What do we do to programmatically\
    \ construct an HTML page that contains the video itself, plus its title\n\n![](img/70966a5e893fbac28b7b2b33528eb018_54_1.png)\n\
    \n# Trip to the zoo\n\nThe rest of the code handles the video object, and uses\
    \ it to render the template. Since we pass video object to the Execute function\
    \ at the end, this is Video object and Title will be used to populate the placeholder\
    \ in the template.\n\nWe'll be ready to go as we've sorted out our important statement\
    \ at the test. We need to add \"html template\" in order to unlock the HTML template\
    \ dynamically. We also need to use \"func\" because unused inputs are an error\
    \ in Go. We fixed that up, now we run `go run main.go` and /\n\nLeft we use\n\
    HTML templates to construct pages dynamically. The HTML `<video>` tags make it\
    \ easy to edit videos\n\n![](img/70966a5e893fbac28b7b2b33528eb018_54_2.png)"
