    \ 6\n\n```\n<h1>Videos</h1>\n<!-- The video list for Users -->\n<h2>Our videos</h2>\n\
    <ul>\n  {{range $video := .}}\n  <li><a href=\"watch/{{$video}}\">{{$video}}</a></li>\n\
    \  {{end}}\n</ul>\n```\n\nus iterate over an array of strings, which refers to\
    \ {{range}}. The block with {{range $a := .}} and ending with {{end}} will run\
    \ for every element of the array; inside the block, we refer to them as ($a)\n\
    \nNow we're going to create a hometemplate that will handle requests to the home\
    \ URL. This function is shown in the handler that we're going to leave up to you\
    \ (you can change your work later the version that will supply whatever you need).\n\
    \nYour implementation should handle the getAvailableVideos()function to get a\
    \ list of available videos, and then parse and render the template home.html.\
    \ You should pass the list returned by\n\n# Format your code\n\nOne of the advantages\
    \ of the Go language is that all code could be formatted in a uniform style. This\
