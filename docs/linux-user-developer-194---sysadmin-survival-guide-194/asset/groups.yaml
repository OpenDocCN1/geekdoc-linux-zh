    # User experience


    The rescue should be swift. The couple of helpful scripts mentioned above, there
    are no others. The distribution is designed for someone familiar with the Linux
    system and who know what they need to do to fix the issues they face. Like other
    systems, it''s a bit of guesswork.


    # Support and rescue docs


    The distribution only has a single page on the ALT Linux rescue, which lists the
    CD copies and includes a software spotlight list that shows the marque titles.
    There are Russian-speaking forums for the main ALT Linux distribution but the
    Rescue edition doesn''t have any official support avenues.


    # Overall


    ALT Linux''s Rescue is designed for experienced sysadmins who need an all-in-one
    Live environment to fix issues. You won''t get mileage if you aren''t familiar
    with the tools.


