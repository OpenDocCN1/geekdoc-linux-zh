    ## KDE Plasma


    此版本中一个尚未完全成熟的功能（但作为技术预览可用）是 GTK 全局菜单集成。该功能对于使用 Gimp、LibreOffice 和 GNOME 应用等 GTK
    应用的用户特别有用，它得益于一个在 GMenu 和 DBus 协议之间交互的代理包。该解决方案意味着 GTK 应用无需任何修改即可获得全局菜单支持。尽管这只是技术预览，但大多数应用程序都能良好运行，在我们尝试的三个应用中，只有少数无法工作，或者在安装了
    plasma 后产生了通用影响。


    > Plasma Vault 允许你创建加密文件夹来安全地存储文件。在此基础上，在 KDE 软件中寻找感兴趣且高评分软件比任何时候都容易。Plasma Vault
    通过缩小攻击面来实现这一点——你不需要一次性解锁所有数据，而是分批进行。


    > Plasma Vault 注意，该工具处理的是全盘加密或加密主目录的不同场景。*它们并不涵盖在系统运行期间有人可能访问你的系统的情况。*


    此版本引入了新的 CryFS 后端命令，用于在使用 KDE Connect 时移除打开窗口，并提供了更流畅的界面和错误报告。一项会让人们的 Plasma 生活变得更容易（但也稍微少那么难以忍受）的变化是支持加密中的伪错误回滚。虽然这种这种情况在理论上发生的概率很牵强，但
    Nvidia 显卡用户会体会到，或者软件发布至少会让更新过程变得优雅得多。


    > 快速贴士

    > 终端快速访问：在轻量级文件管理器 Dolphin 中浏览目录时，有一个棒的快捷键：按下 F4 可以在 Dolphin 窗口的当前目录打开终端。


    ## 创建和使用活动


    当你第一次使用 KDE 时，会看到一个活动。该活动是不可见的，只有当你有多个活动或点击缺失的那个活动时它才会显示。要开始操作，按下屏幕顶部的切换按钮并选择“活动”。你将看到活动（可能只有“默认”）以及一个“创建活动”的按钮以添加更多。这些活动是应用程序组，也是一个可以在其中添加小部件的新桌面环境。


    虽然 Plasma 5.3 有许多改进，但还有许多其他微调，包括一个显示月球相位和季节性分点的天文事件的 Plasma 日历小部件、允许将当前时间和日期复制到剪贴板的数字时小部件、提供快速访问命令和选择器的额外
    KRunner 插件，以及模式系统设置已重写以支持 Wayland 上的列表。


    如果你想再次尝试 KDE Plasma 5.3，除非你明确想留在 5.12 版本，否则还有许多其他方法可以运行它。最直接的方法是使用镜像，许多 KDE 的新镜像将
    KDE Frameworks、应用程序和 Plasma 作为 Ubuntu LTS 之上持续集成系统的一部分。其他版本也可用，例如使用用户版（User Edition），它的特点是在稳定底座上提供最新的
    KDE 软件，非常适合日常用户。开发者版（Developer Edition）Git：不稳定版本，特点是基于新分支构建的当日预发布 KDE 软件；而开发者版
    Git-stable 版本是基于错误修复构建的当日预发布 KDE 软件。在官方发布之外，Plasma 还可以用于基于 openSUSE Tumbleweed
    的 Kubuntu 系统，但仅提供 64 位版本。


    使用你的软件源。使用命令 `sudo add-apt-repository ppa:ubuntu-ppa/backports` 和 `sudo apt full-upgrade`
    来添加仓库并安装，但请记住 Plasma 中的支持水平低于主功能，并可能会引入错误。


    GeckoLinux 专注于开箱即用的性，直接从 openSUSE 软件包和仓库构建，在 Linux 5.0 基础系统之上提供 Plasma 5.13 桌面。它还包含了
    Plasma 5.8 和版本 5.47.0 的 KDE Framework 的功能。GeckoLinux 也可以添加到 Plasma 5.13。


    在 Plasma 5.2 发布之后，Wayland 现在是许多项目，而 KDE 不再是唯一选择。我们讨论了 5.13 版本对 Wayland 的改进。


    KDE Plasma 最优秀的之一是即刻可用的，它拥有一许多强大的功能。规则（Rules）就是一个很好的例子：在你需要它之前可能不会考虑它，但当你必须使用时，它是必不可少的！窗口规则可以通过“窗口系统设置”中的“管理”部分访问。它们允许你管理整系列选项，包括应用程序、角色、类型，甚至是自定义属性的细节（包括大小和位置、活动、置于其他窗口之上）。规则可以被禁用，更改配色方案并调整透明度。窗口可以变得不那么分散注意力且更容易移动，为窗口在你面前的行为提供更多灵活性。想看视频吗？你可以将视频窗口从播放器中释放出来，使其变为半透明，固定在所有其他窗口之上，然后继续你的工作。


    ## 快速指南


    ### 使用窗口规则


    KDE Plasma 最优秀的之一是即刻可用的，它拥有一许多强大的功能。规则就是一个很好的例子：在你需要它之前可能不会考虑它，但当你必须使用时，它是必不可少的！窗口规则可以通过“窗口系统设置”中的“管理”部分访问。它们允许你管理整系列选项，包括应用程序、角色、类型，甚至是自定义属性的细节（包括大小和位置、活动、置于其他窗口之上）。规则可以被禁用，更改配色方案并调整透明度。窗口可以变得不那么分散注意力且更容易移动，为窗口在虚面前的行为提供更多灵活性。想看视频吗？你可以将视频窗口从播放器中释放出来，使其变为半透明，固定在所有其他窗口之上，然后继续你的工作。


    ### 添加你的在线账户


    可以将在线账户添加到 Plasma 中以启用集成。你可能需要手动安装系统设置。


    ## DNA 计算


    ### 利用双螺旋进行计算


    生命分子正被投入计算，并取得了令人印象和惊讶的结果。Mike Bedford 揭示了如何


    '
