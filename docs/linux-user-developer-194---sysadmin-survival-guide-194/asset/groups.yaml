    # 计算机安全教程


    ## CompSec：使用公共 API 保护您的系统


    学习如何在安全任务中使用 REST API，以释放你自己的脚本和工具。。


    数据泄露、恶意软件、恶意 URL、未知 IP 地址对我们服务的暴力破解……我们拥有的是一个极其惊人的索引。面对这些威胁将使我们能够确保您的系统安全。


    包括 Censys API 在内的许多工具。但在某些情况下，你需要编写自己的脚本或工具，例如一个利用 HaveBeenPwned API 的 PAM 模块。当然，你可以通过
    API 使用 Censys 数据（参见“资源”）。


    它们占据着宝贵的数据，从被破解的密码到暴露的 SCADA（监视控制和数据采集），你往往比需要使用一个脚本来查询它们，或者使用任何脚本语言，以防在你需要更复杂的数据时。


    ### 检查密码

    你听说过 Have Been Pwned 吗？这个网站收集了来自整个互联网泄露事件的 GB 级数据。当然，你可以使用 API 查询这些数据，或者了解一些相关知识。


    你可以查找特定的密码以查看它是否已被泄露。你可能会想：“嘿，难道安全专家为了找出结果而让我渲染我的密码吗？”不，他们设计了一种名为 K 匿名性（K Anonymity）的可接受解决方案（参见
    http://kanonymity.org）。


