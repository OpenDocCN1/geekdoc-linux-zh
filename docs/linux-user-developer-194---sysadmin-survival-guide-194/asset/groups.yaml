    # Recovery distributions


    # In brief: compare and contrast our verdicts


    | Tools | ALT Linux Rescue | Morpheus Linux | SystemRescueCd | Ultimate Boot CD
    |

    | --- | --- | --- | --- | --- |

    | repository | Includes more than 100 CLI tools and a couple of scripts to automate
    tasks | Has a focused approach and includes a limited number of tools, for recovering
    data | Packs in useful repair and rescue tools, with several direct images | Lives
    up to its name and is overflowing with all kinds of system tools and utils |

    | Custom tools and Utils | Doesn''t ship with a graphical desktop, and bundles
    only a few custom scripts | The distro can work without GRUB script, but it''s
    not included in the CD boot | There''s support for modules which is useful for
    customised distributions | Uses an extremely modern menu that selects the right
    tool |

    | User experience | Boots straight into it and expects you to know your way around
    | It starts with LIUX but includes virtually no apps to use this | Has a comprehensive
    boot menu and also displays useful info | Ubuntu''s boot menu makes it fairly
    simple to navigate |

    | Support and rescue docs | There''s hardly any documentation and no avenues for
    seeking support | Ample documentation for the project, as well as examples | Has
    enough documentation and a support forum to orient new users |

    | Overall | Meant for experienced users who are familiar with the bundled tools
    | Arch-based distribution with a notice that is still useful graphical IS... |
    Together with its discs, it''s a nice package to help you around common issues
    | True to its name, Ubuntu offers a lot of tools using a trendy interface |


    # AND THE WIN

    Ultimate Boot CD


    To ensure your system of common linux, you need a distribution that has the right
    tools. But just having the largest collection of tools isn''t much in the hands
    of an inexperienced user. This is why one of our top choices is a live CD that
    can be used with any computer, irrespective of admin skills and experience. It''s
    because that ALT Linux outlasts a wide range of options. In the absence of a graphical
    interface or XWINDOW it can only be read and used by experienced know who know
    which tools to use with it. Whereas Morpheus Linux has its own graphical interface,
    UBCD doesn''t have any interface to the CD. The project''s LinuxID utility is
    a nice attempt to make the tools more powerful to finish use, but only a very
    limited number of options are not included in the distribution by default. It
    is a close contest between SystemRescueCD and UBCD of which used customised boot
    interfaces.


    ![](img/70966a5e893fbac28b7b2b33528eb018_83_0.png)


    ```

    Boot Partition UZ-50

    BOOTMENU US-AUG-2012

    Grub (Graphical Boot Manager) V4.10

    Gaolin, Grub2-0.7

    MBRWriter V0.15

    Smart BootManager

    SPFS Editor (Special FDISK)

    Super Grub V0.97

    SuperDisk Utility

    CHFS Writer V.1 (Extended FDISK)

    OSL (Operating System Loader) V1.6

    OSL (Operating System Loader) V1.5

    ```


    UBCD includes lists to test-stress hardware as well as a host of other useful
    uses

    SystemRescueCD lists a number of boot options and also helps offer information
    over different versions. Still, using SystemRescueCD isn''t as as UBCD, whose
    boot menu is logically ordered and each option has to help users navigate down
    the right tool and then boot straight into it.

    Be careful when using the repair and recover tools in these distributions. It''s
    better to spend some time reading through their documentation before attempting
    to use them. If used improperly, they can cause more damage and complicate the
    recovery process.

    Mayank Sharma


