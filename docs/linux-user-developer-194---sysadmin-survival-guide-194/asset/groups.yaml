    目录，通常由 syslog 守护进程放置在文件中。Syslog 多年来一直是标准，但出现过几个替代品，其中 syslog 是目前最新且最流行的。确保你完全掌握服务器上日志记录的详细信息。


    一个良好的系统管理员应该完全意识到数据在时间维度上的局限性，并且必须像 Logwatch 那样将搜索和查询过程自动化化。此外，值得注意的是，syslog 守护进程是一个从各种来源接收输入的进程。对于这些来源，你需要一个监控工具，


