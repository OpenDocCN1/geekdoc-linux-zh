    # Tutorial Raspberry Pi: Inky pHAT


    # E-ink works


    E-ink actually uses real ink to display text and images. The display consists
    of a capsule film which holds a fluid containing tiny particles used to apply
    a positive or negative colour with the corresponding charge move to top of the
    cells, making the surface of the ''paper'' a particular colour.


    ![](img/70966a5e893fbac28b7b2b33528eb018_77_0.png)


