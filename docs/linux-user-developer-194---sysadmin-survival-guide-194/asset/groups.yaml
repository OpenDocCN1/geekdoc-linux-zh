    Still, with its modest features, Chrome continues to prove itself competent for
    the intended uses: generally web browsing and word processing. It won''t be able
    to keep up with something like the Chromebook, having an Intel processor as it
    does, in a decent workout: you typing with 10 tabs open might really notice some
    lag in the background. Quite frankly, that''s exactly what we wanted to see from
