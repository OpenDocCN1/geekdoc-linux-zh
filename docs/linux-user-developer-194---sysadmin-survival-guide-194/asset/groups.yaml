    # SystemRescueCd


    A good option if you can use the tools or have the patience to read the docs


    # Ultimate CD


    A CLI-only system that''s surprisingly easy to use and navigate


    ![](img/70966a5e893fbac28b7b2b33528eb018_82_0.png)


    SystemRescueCd ships with a minimal Xfce desktop, along with some


    ![](img/70966a5e893fbac28b7b2b33528eb018_82_1.png)


    UBCD''s divided the packages into categories based on the system area they influence,
    such as BIOS, HDD and memory


    # Tools repository


    The distribution packs in several repair tools and utilities, and supports all
    the important filesystems. Base CLI utilities, includes enough for several tools
    such as FreeDOs, NTFS, MHDR and so on. There''s also FSArch, which can help save
    and restore a partition table, or the contents of a file, to a compressed archive.


    # Tools repository


    The distribution is loaded with tools. You can use UBCD to manage and stress-test
    hardware and connect to a system. It can edit BIOS settings as well as restore
    and backup the CMOS. UBCD helps you fix bootloaders, recover lost and deleted
    files. It will also help you boot Windows without booting the installation.


    # Custom tools and Utils


    SystemRescue supports SRMs (System Rescue Modules) that are ideal for adding new
    applications to the distribution. In addition, SRMs can be used to add custom
    data files. Further customisation is possible with the restore-backup utility,
    which helps build a backup file system that you can save your custom files.


    # Custom tools and Utils


    UBCD''s biggest customisation is its custom boot menu. The menu also works with
    graphical interface and inserts boots to a variety laid-out menu. The custom-based
    menu helps guide users to the relevant utility for their need. The menu is logically
    arranged and individual entries give enough useful information to help identify
    them.


    # User experience


    The distribution provides a comprehensive boot menu. Besides the de facto options
    shown on the main menu, there''s help information explaining the advanced boot
    parameters over several virtual channels. The default boot menu includes some
    list which contains basic information about the network, NTFS partitions and start
    the graphical environment.


    # User experience


    UBCD divides the packaged units into categories based on the part of the computer
    that they influence. The menu may be text-based, but with clear descriptions that
    mean the distro can be easily navigated and used by inexperienced users to fix
    all issues.


    # Support and rescue docs


    The project hosts a quick-start guide as well as detailed instructions on basic
    and advanced use. There are also instructions for experienced users, such as the
    guide on how to make a custom version and backing up data from an unobtable Windows.
    The boot menu also offers troubleshooting guides.


    # Support and rescue docs


    UBCD''s website hosts a fairly detailed FAQ to familiarise users with the distribution.
    However, the tutorial section is really just a pointer to a long list of user-created
    tutorials curated from the forum boards. The documentation of the project''s wiki
    will help others, as it is complete and not intended for new users.


    # Overall


    A well-rounded recovery solution that will resolve most common issues. It has
    enough docs to guide inexperienced users, while advanced ones will appreciate
    their customisations.


    # Overall


    Lives up to name with its ultimate collection of tools and utilities to troubleshoot
    problems in every component of the system. The lack of a graphical desktop is
    no independence.


