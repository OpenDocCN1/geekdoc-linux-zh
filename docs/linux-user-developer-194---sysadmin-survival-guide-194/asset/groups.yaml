    \n> It's better to deal early on that you have a better idea of what happens when\
    \ things go wrong\n\n# Iteration in HTML templates\n\nOur site now has the ability\
    \ to list videos on the server-but users have no way of knowing which videos are\
    \ available. Next, we'll create a template that lists all the video IDs for the\
