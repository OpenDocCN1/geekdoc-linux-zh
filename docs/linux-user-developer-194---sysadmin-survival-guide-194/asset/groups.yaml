    # RASPBERRY PI


    ## Raspbian update brings new Pi features

    Features from the Raspberry Pi Foundation is setup wizard, new PDF reader and
    app store


    **Fresh from a new version of the Debian-based Raspbian desktop, optimised for
    the Raspberry PI 3 B+ and booming with a number of new features.**


    Primary among these is the ''First-boot'' wizard, a long-overdue inclusion that
    guides you through setup options, with most other Linux distributions. Adding
    the ability to set location, for updates, add a password (ending, at least, the
    security of the default username and password), and choose Wi-Fi networks, this
    feature is automatically disabled. It can, however, be accessed at any time using
    the `pixviz` command in the terminal.


    Following the launch of Raspberry Pi in 2012, the short-lived Pi Store provided
    an easy way to install approved software. Since it has been integrated into Raspian
    OS, "We have included these applications in our standard image, as perhaps people
    might never find out about them," says Senior Principal Software Engineer Simon
    Long.


    ![](img/70966a5e893fbac28b7b2b33528eb018_7_0.png)


    Welcome to the Raspberry Pi Desktop!


    Before you start using it, there are a few things to set. Press ''Next'' to get
    started.


    Above it''s now easier to set up a Linux distro on your Raspberry Pi.


    Simon Long, however, added that "they are not of interest to every user." As a
    result, the first-boot tool has been included, to partially reduce the size of
    the Raspbian disk image, but also in called pixviz, as well as improved keyboard
    volume support, and other bug fixes and tweaks. Chromium 65 is now included, along
    with several other web-based apps.


    The x86 version of Raspian has also been made available download from www.raspberry.pi/downloads,
    or you can update your current system if you prefer.


    Along with these notable improvements, the new version of Raspbian (based on Stretch)
    is also a new PDF reader


    ## The Recommended software tools to reduce clutter


    ## DISTRO


    ## Canonical shares data of desktop metrics

    Canonical has revealed that 27 percent of users opted-in to collection of desktop
    metrics when installing Ubuntu 18.04 LTS.


    Upon installation, an option integrated into the Ubuntu report allows Canonical
    to collect hardware and location details. To help Canonical understand what users
    are installing Ubuntu and how to improve the OS this tool has turned long-term
    Ubuntu users away from the distro.


    As stated by assertions from Canonical that the collection is not a privacy breach
    (no user-identifiable information is shared), and fact is all that the data revealed
    to the user is before it even ends. While some of the installation is revealed,
    Canonical has also been able to get data current state of PCs and laptops. Interestingly,
    Ubuntu is used all over the world (this information was gathered via telemetry
    reports), with the BRICS nations of Brazil, India, China and South Africa actively
    participating on the operating system.


    Meanwhile, 90 percent of users choose to download updates during installation,
    with 50 per cent requesting restricted addons. Perceptions vary from a standpoint
    of view, 28 per cent choose automatic logic.


    Metrics also reveal that 4GB and 8GB RAM are most common, as single CPUs, Ubuntu
    is also a little more complicated full disk storage. Canonical found that 21 percent
    of users installing Ubuntu be manually created partition table. This single revelation
    has already prompted Canonical to investigate how to simplify the process for
    Ubuntu 18.04.


