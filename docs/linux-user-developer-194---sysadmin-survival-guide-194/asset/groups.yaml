    \ `Clock` 对象。通过 `Clock`，你可以调度函数在未来的某个点执行，无论是一次还是循环执行。例如，以下代码每秒调用一次回调。\n\n```python\n\
    def my_callback(dt):\n    pass\nClock.schedule_interval(my_callback, 1.0)\n```\n\
