    # 评测


    ## Acer Chromebook Spin 11


    ![](img/70966a5e893fbac28b7b2b33528eb018_85_0.png)


    # 硬件


    ## Acer 推出了一台出色的 ChromeOS 机器


    | 价格 |

    | --- |

    | $329 ($349) |

    | 网站 | www.acer.com |

    | 空间 | |

    | CPU | 1.1GHz Inteleleron N350 |

    | 显示器 | 11.6 英寸 1366x768 IPS |

    | 显卡 | Intel HD 900 |

    | 存储 | 32GB eMMC |

    | 接口 | 2 个 USB Type-C, 2 USB 3.0, 音频接口 |

    | 无线 | 无线局域网，蓝牙 4.2 |


    过去，Chromebook 通常被认为是低端廉价笔记本电脑，适用于教育和休闲网页浏览。然而，在后 PC（Pbook）时代，它们是否仍承担同样的角色？Acer
    Chromebook 11 证明了它们可以。


    它的设计旨在吸引需要笔记本完成学校作业的年儿童，但也适合那些想要学习 Linux 的人。它的性能对于它的便携包来说足够出色——考虑到盒内的所有内容，它的价格非常便宜。


    目前只有一种配置可供。$329 ($349) 即可让你获得我们列出的规格笔记本，与同类别的 Chromebook 相比，这些规格处于中等水平——例如售价 $240
    ($339) 的 Dell Chromebook 11 3180，拥有更强大的 CPU 且内存相同。


    这款 11 型设备采用全塑料结构，但这是我们见过的最好的做工之一。我们费了很大劲，却无法让这台笔记本电脑压平一张纸。键盘看起来也比较浅，只有 1.1mm 的键程，但手感很舒适，我们在操作时没有发现按键会卡住的情况。


    它不是市场上最便宜的 Chromebook，重量为 1.35 公斤。然而，其 2cm 厚的圆角框架使其握持感非常舒适，我们相信要做到轻量化是很困难的。


    > 如果你正在寻找一款无需花高价购买“高级””的坚固笔记本，Acer 可能是理想之选


    ![](img/70966a5e893fbac28b7b2b33528eb018_86_0.png)


    ![](img/70966a5e893fbac28b7b2b33528eb018_86_1.png)


    ![](img/70966a5e893fbac28b7b2b33528eb018_86_2.png)


    ![](img/70966a5e893fbac28b7b2b33528eb018_86_3.png)


    包含了用于数据传输和充电的 USB-C 接口是一个令人欢迎的细节。


    > 它足够大，性能足够，并附带了手写笔和便携包


    轻得多，牺牲了一些耐用性。接口在这里也是一个巨大的胜利——在这个价位的 Chromebook 上我们拥有 USB-C 接口，即使只看到一个我们也会很开心了。屏幕会反光（如果你对
    Chromebook 的非纯粹耐用性有预期，它有点软，但应该相当耐划或抗裂）。触控板是一个弱点；表面是布质的，这很不错。然而，当你把笔记本变成塑料饰面时它非常精确，触控点击是令人沮丧的。不过，它不支持手势，所以并不是一无是。


    尽管如此，凭借其适中的功能，Chrome 继续证明其在预期用途上的胜任：通常的网页浏览和文字处理。它无法像那些带有 Intel 处理器的 Chromebook
    那样在强度训练中跟上节奏：当你打开 10 个标签页打字时，可能会注意到背景有些延迟。坦率地说，这正是我们希望在这台设备上看到的。


    然而，Chromebook 的一个重要方面是电池续时间，遗憾的是 Spin 11 在这一点上失败了。在我们的情况下，当我们在 VLC 中播放 1080p 本地视频时，电池持续了
    6 小时；设备在 7 小时 34 分钟后没电。这远低于平均水平。例如，配置相似的（较旧的）Dell Chromebook 13 在运行相同测试时持续时间几乎是两倍，而且还多了一小时。


    总体而言，Acer 的表现与美国的类似设备一致。但当你考虑到附带的手写笔和便携包时，它真的看起来像是一笔买卖。


    # 优点


    - 价格亲民的 Chromebook 附带手写笔和携带包。它还拥有一圈可以使用许多年的坚固框架。


    # 缺点


    - IPS 屏幕没有我们预想的那么亮，你可以放弃全高清分辨率了，电池表现只能称不上出色，性能仅够用且略显乏味。


    # 总结


    如果你正在寻找一台用于教育或基础浏览的廉价笔记本，并且不需要太多功能和高分辨率显示，考虑到低于平均水平的电池寿命，Acer 是一个非常划算的选择。


    Bill Thomas


    www.linuxuser.com


