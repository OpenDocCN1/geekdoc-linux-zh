    In the past, Chromebooks have been generally regarded as lower-end cheap laptops,
    fit for education and casual web-browsing. However, in a post-Pbook (PC) world,
    do they still fill the same role? The Acer Chromebook 11 proves them, certainly.


    It is designed to appeal to young children that need a laptop for schoolwork,
    but it''s also suitable for those who want to learn about Linux. It performs decent
    enough for its carrying case - and it''s inexpensive considering all that''s in
    the box.


    There''s only one configuration available for purchase. $329 ($349) lets you get
    the laptop with the specs we list, which are fairly average for the category compared
    to similar Chromebooks – such as the Dell Chromebook 11 3180 at $240 ($339), with
    a more powerful CPU and the same amount of memory.


    The 11 features an all-plastic build, but that is one of the best builds we''ve
