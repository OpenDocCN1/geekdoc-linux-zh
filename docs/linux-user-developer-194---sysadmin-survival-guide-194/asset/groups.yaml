    \ and serves it from the root directory.\n})\n```\n\nAfter adding this line, we\
    \ can compile and run the server again. When we load http://localhost:8080/watch/bunny\
    \ in the browser, the video life will show up as seen in the main image.\n\nreading\
    \ the contents of the videos and putting all the subnames into a list. An example\
