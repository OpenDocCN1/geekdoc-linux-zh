    # Make your own


    Tarran included STL files on Instructables so you can 3D-print your guns, along
    with a wiring diagram for the various components such as the LEDs, trigger and
    transmitter/receiver.


    Keeping source

    Terran installed MQTT Broker Service on an old desktop to act as a framework between
    the laser-tag''s server and the Pi-powered guns.


    ![](img/70966a5e893fbac28b7b2b33528eb018_72_0.png)


    # Components list


    - For three guns:

    - Server (old desktop computer)

    - 3 Raspberry Pi Zero W

    - 4GB SD cards (minimum)

    - 3 LED transmitters

    - 6 IR Receivers

    - 9 LEDs (3 red, 3 blue, 3 green)

    - 3 passive receivers

    - 6 push buttons

    - 3 LCD screens (16x2 character) with I2C adapters

    - 3 battery packs

    - 3 PN2222 transmitters

    - 3 10k3 resistors

    - 8 IR4 resistors


    # One life left


    The GUI on server provides a lot statistical information at the end of the game,
    but the gun''s LCD display also supplies useful information as you''re playing.


    # Send the right signals


    Terran read up an IR transmitter from one end of laser-tag guns. Each has a black
    cone around the transmitter to help narrow the shot of each gun. If you want to
    replicate his work, Terran says that any general transmitter should:


    # No shells required


    Each gun has a Pi Zero W inside Raspian Lite, with MQTT broker service for communication,
    I2C for the display libraries and Linux Infrared Remote Control.


