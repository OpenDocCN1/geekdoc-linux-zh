    the Muffin window manager the Cinnamon Settings Center and the Cinnamon shell.


    ![](img/70966a5e893fbac28b7b2b33528eb018_89_0.png)


    Most of the work in this new release is behind the scenes, though the effect of
    changes is visible on the desktop. The network app now allows unmanaged monitors
    and settings now supports a keyboard layout switch. The update has made its way
    into the repositories of your distribution, so to switch to it as you get the
    notification.


    > Above: Don''t confuse the Cinnamon with its namesake, the Cinnamon Desktop


    +   Pros

    Offers a traditional desktop layout without skipping modern functionalities.


    +   Cons

    Although it''s not demanding as other desktops, you can''t run it on low-spec
    machines.


    +   Great for...

    The best of both worlds: traditional layout and modern features.

    https://bit.ly/linux_cinnamon


    # PROGRAMMING LANGUAGE


    # Crystal 0.25


    Aims to combine C-speed with Ruby''s slickness


    CRYSTAL is a new language that was developed to offer a Ruby-like experience with
    a fast compiler to produce native code.


    It seems to work beautifully, because according to benchmarks (https://github.com/crystallang/crystal)
    Crystal is an order of magnitude faster than Ruby.


    Unlike Ruby, Crystal is a compiled language. Programmers will appreciate this
    because it catches errors at compile time instead of causing issues when the code
    is running. This also means that Crystal is easy to ship binaries -so save space
    if the target has limited space and just use the pre-compiled binary instead.


    Programmers will also appreciate the fact that Crystal is typically typed: Most
    languages allow any kind of type, but with Crystal you can add different types
    to code and get the flexibility to use any of them. That typing isn''t strictly
    necessary because the language infers types from context.


    Crystal is released under the Apache License v2.0. It is free to add to your repository
    for You can use the latest version of Crystal using your distribution''s package
    manager.


    The documentation on the website will help you details about its syntax and semantics.


    +   Pros

    Does a job of combining the elegance of a Ruby with the speed and efficiency of
    C.


    +   Cons

    Not everybody likes a compiled language and being Linux-only has its uptake somewhat.


    +   Great for...

    Writing fast and efficient code with the fluidity of Ruby in the mind without
    the extra step of going through compilation.

    https://crystal-lang.org'
