  mdcn: "\n\n# 观点\n\n## 只要愿意付出努力，学习 Kubernetes 会让你物有所值\n\n在开始这个令人敬畏的新编排器时，存在着许多不容疑的困惑。Kubernetes\
    \ 并不像某些人想的那样新鲜，但感觉就像是最近刚发布的一样。\n\n这种困惑确实在减少，这有很多原因。不要误会我的意思：Kubernetes 容器能够很好地托管你的应用程序，但对一些新用户来说，门槛依然存在。\n\
    \n我记得有一篇教程文章为为 Docker 经验极少的人提供了进入 Kubernetes 的方法——这引出了问题所在。首要任务是经历一个“灵光一现”的时刻，意识到容器是如何改变软件发布方式并减少基础设施运行开销的。\n\
    \n这大约在一个月后通过《打破容器》（Breaking Containers）实现。我自己也记得那个时刻，尽管我从 2018 年开始就在生产环境中使用容器了。\n\
    \n其次，无法回避的事实是 Kubernetes 可能会变得极其复杂。如果涉及到额外的服务网格、多个集群、多个区域以及在默认安装之外的额外冗余，整合所有所需的组件并提供扩展性可能会令人不知所措。这需要实践，坦率地说，通常需要反复试错。\n\
    \n第三，由于许多移动对象带来的阻碍，设置 Kubernetes 并不像看起来那么简单。从零开始构建 Kubernetes 的（极好的）现实是不同步的，而且没有现成的新的（必要的或可选的）添加插件需要它们自己去学习。\n\
    \n将这些挑战与软件空间中使用与 Kubernetes 集成的第三方工具时偶尔甚至更令人困惑的定义相结合，有些人会认同这有点像在跑步机上全速奔跑。\n\n\
    一个幸运的是——不要误会我，我仍然是 Kubernetes 的坚定支持者，并相信它是未来许多年的趋势——是一个名为 Minikube 的很棒的安装工具。它消除了首次尝试多区域云安装时复杂且坦率地说令人困惑的安装过程中的大部分烦恼。当然，那是你只有一个\
    \ Kubernetes 集群的本地副本。对于大多数人来说，我怀疑这已经足够了。强大的 Minikube 远超它的价值，而且方便地自己节省了大量配置和部署带来的烦恼。\n\
    \n如果你有一台具有正确虚拟化 CPU 扩展的笔记本电脑——这些扩展实际上是可选的，但你可能会发现自己在访问网站 http://bit.ly/ly_kube\
    \ 时成了一个 Kubernetes 入门者。我非常推荐它。通过 Kubernetes 的启蒙之路并不比其他选项短。一旦你启动并尝试将一些简单的服务作为容器，我确定你将能够适应这种工作方式。\n\
    \n## 首要任务是经历一个“灵光一现”的时刻，意识到容器是如何改变软件发布方式的\n\n一旦你熟悉了一个或两个设置，并在那里映射了配置和入站控制器，你就可以进展到其他方法。如果你在\
    \ AWS（亚马逊云服务）环境中工作，请查看“The Right Solution at the Kubernetes”网站 http://bit.ly/ly_kube\
    \ 上突出显示的细节。\n\n在你学习到错误可以被及时纠正，并在最后一次（正确的）构建并尝试后你成功维护 Kubernetes 集群之前，你将准备好根据你的需求来评估它们的技能。\n\
    \n一旦你建立起来，你可能会受益于运行在不同大陆的韧性且可扩展的基础设施，这是难以比拟的。最终，你会明白为什么要大费周章：\n\n## Chris Minnie\n\
