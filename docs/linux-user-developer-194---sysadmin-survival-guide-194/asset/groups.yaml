    易于测试系统锁定事件或废弃的系统。这不使用生产系统，而是运行在虚拟机上。此模块尚未完成，但可以让你对可以使用 API 做什么心中有一个概念。从源代码 (pwpassword-pam)
    获取模块并将其添加到更新中。要安装 PAM，请运行：`apt-get install libssl-dev openssl-dev libdev-dev`。我们的模块使用调用来捕获
    API 调用并比较用户提供的密码。接下来，安装模块本身：`cd havebeen-pam && ./BuildPam.sh` 这将构建并复制库到 /lib/。


    所有的哈希都存储在网上，因此你必须使用 API 将哈希从小写转换为大写：


    ```bash

    echo "marjobox" | openssl md5 | tr ''[:lower:]'' ''[:upper:]''

    curl https://api.pwpassword.com/range/C821

    ```


    你将获得一个已知的可能哈希列表，以及它们被看到的月数。然后取决于你遍历所有这些哈希（平均为 4/7），看看其中是否有你的。自动化这个过程很容易：在代码中编写一个简单的
    Bash 脚本来查找特定的哈希或存储在文件中的一组哈希（右图）。将输出获取到文件中并运行。


    ```bash

    ./pwpassword.sh -f passwords

    ```


    顺便说一下，我们正通过此检查你的旧密码列表。到目前为止良好，但让我们做得更好。如果你想确保 Linux 使用经过证明的模块，可插认证模块（PAM）是安全的一个极佳工具。例如，你可以使用
    PAM 命令更改密码，如果在数据库中发现了你的密码，PAM 模块应该拒绝你的密码。编写 PAM 模块不在本教程的范围内（尽管我们很快会涵盖），但只需说我们已经为你实现了这样一个模块。考虑到使用
    PAM


    在基于 Debian 的系统中，启用或禁用 PAM 的唯一方法是自己编辑 /etc/pam.d 并在第一个 PAM 条目之前添加该行。通过这些更改，当 pam
    命令运行时，我们的模块将是第一个执行的。如果成功（即密码尚未被证明），它将堆叠下一个模块，并轻松被行中的下一个模块（use_unix.so）使用。要尝试这一点，请使用
    use_first_password。我们的模块将尝试第一个模块的模块，恰好就是我们加载的那个。如果失败，它将使用下一个模块。如果成功，/etc/shadow
    将被更新（参见 pam_update）。然而，我们的模块只是一个概念证明，所以请随意感受


    安全廉价

    到目前为止你一直在使用 REST。在某些时刻，你可能会尝试登录你的账户。有了该领域的示例，你需要良好的实践。API 通过提供访问控制、加密、输入验证等来确保安全。


