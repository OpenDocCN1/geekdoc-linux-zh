    # NEAR-FUTURE FICTION


    # Obnoxious


    ![](img/70966a5e893fbac28b7b2b33528eb018_95_0.png)


    t''s embarrassing," said Niall as he put his empty coffee cup down. She picked
    it up and put it in the sink. "Yeah, but it''s a really cool jacket,"


    she said. He shrugged and lifted the wearable tech jacket from him. He kissed
    her goodbye, brushing the hair from her face and kissing her hand as she tried
    to brush it away.


    She shouted back, but he didn''t catch it. "You''re glad decone you''re not on
    that train!"


    She was right, as Niall had said. But, that man she felt no anxiety at the thought
    of him. He sheed the door forward. "See you tonight.",


    At the station, as the platform became crowded with commuters of stumbling passengers.
    A halo of irritation and early morning crowd hungrily slowing him.


    He stepped into a space between two headphone-wearing men. He shuffled a little
    further and around, although it was less than a step, he struggled to get some
    privacy from the crowd.


    The train was due, but surely they were getting closer and closer to each other
    as commuters arrived. He''d become expert over the past few months at the number
    of people on the platform and how many of them could face him without Niall feeling
    uneasy just about getting on.


    A man to his left took a few steps back as the crowd pushed him in immediately.
    There was no room for loitering at this stage of the game.


    > The doors opened. The crowd moved forward gently and politely, but the undercurrent
    of


    competition was palpable. He could feel forward with his fellow travelers. He
    could feel the tension rising around him as the train seemed to be filling up
    quicker than they were moving. The man in front of him moved, leaving some space,
    and Niall could feel some space in the front of the stalled crowd one foot and
    one foot out.


    > The doors opened. The crowd moved forward gently and politely, but the undercurrent
    of competition was palpable


    He touched the man and he moved just for Niall to get both onto the train. The
    doors closed behind him. It was a crash, but he knew that the travelers would
    have experienced the slightly crowded that everyone was trying to be so he could
    now relax, and create them some precious space for him.


    He pinched the collar of his jacket collar. The crowd near him a little and started
    to move away. He was still breathing heavily and there was some occasional de-the-breathing.


    The wearable was emitting a strong sense of body odour, enough space around him
    to make the environment feel better. He smiled; once again, his jacket had done
    its job.


    # ABOUT


    Stephen Oram writes near-future science fiction. He''s a hippie-religious-seeker
    anarchist and a deconstruct-anarchist; he thrives on contradictions. He has published
    two novels, Confusions and Fluence, and is in several anthologies. His recent
    collection, Eating and Drinking, was described by Mary as one of the top works
