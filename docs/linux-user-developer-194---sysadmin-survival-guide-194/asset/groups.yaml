- md: "\n# OPINION\n\n## Demystifying Kubernetes for when you take some effort, but\
    \ it's worth it\n\nhere's an unquestionable heap of confusion around starting\
    \ with the new daunting orchestrator. Kubernetes is no longer as particularly\
    \ new as some think, but it feels as when it was first released relatively recently.\n\
    \nThe confusion is certainly lessening and exists for a lot of reasons. Don't\
    \ get me wrong: the Kubernetes containers will provide a great job of hosting\
    \ your application, but the barriers to entry still exist for some new users.\n\
    \nI recall a how-to article offering people with minimum Docker experience a way\
    \ into Kubernetes – and that leads to issue number. The first premiere is having\
    \ a 'Eureka!' moment of how containers change the way software releases and reduce\
    \ overhead when running infrastructure.\n\nThis comes about a month later with\
    \ Breaking Containers. I remember this moment myself, even though I used containers\
    \ on production since 2018.\n\nSecondly, there're not getting away from the fact\
    \ that Kubernetes can grow most complicated. If referring to additional service\
    \ meshes, multiple clusters, several regions and extra redundancy to another default\
    \ install. Integrating all the required pieces and providing scalability can be\
    \ mind-boggling. It takes practice, and frankly, usually of trial and error.\n\
    \nThirdly, stumbling blocks with a number of moving objects, and setting up Kubernetes\
    \ is not as easy as it seems. The (fantastic) reality of building Kubernetes from\
    \ the ground up is de-synced, and there is no laid new (necessary or to-have)\
    \ adds that need themselves to be learned.\n\nCompound those challenges with sometimes\
    \ even more confusing definitions in the software space using the third-party\
    \ tools that integrate with Kubernetes, and some people will agree it's a bit\
    \ like running at full speed on a treadmill.\n\nOne grace – and, don't get me\
    \ wrong I am still a huge advocate of Kubernetes and believe it is the future\
    \ for many years – is a lovely installation tool called Minikube. It takes almost\
    \ all of the headaches out of the tricky and frankly bewildering installation\
    \ process when you first try a multi-region cloud installation. Of course that\
    \ is that you only have a local copy of a Kubernetes cluster. For most people,\
