    also boasts a durable frame that''s last for years.


    # Cons


    - The IPS screen isn''t as bright as we''d like and you can forget about Full
    HD resolution, the battery is better than stellar, and performance is merely adequate
    a little lackluster.


    # Summary


    If you''re looking for a cheap laptop for education or for basic browsing and
    need few features and a high-resolution display, the Acer is a great deal in mind
    the lower-than-average battery life.


