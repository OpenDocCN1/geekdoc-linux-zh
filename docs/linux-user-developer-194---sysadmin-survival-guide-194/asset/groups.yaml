    # DNA 计算


    > 快速提示

    > 时间 vs 质量

    > DNA 技术可以减少处理时间过载，但代价是另一种形式的：某些任务可能需要微小 DNA 链的高密度，你最终需要的 DNA 比地球的质量还要多。


    曾经是一个梦想，但正如金教授所解释的，DNA 让这一切变得可行。“为了实现这一目标，我们利用了 DNA 的复制能力。在计算的任何时候，NUTM [非确定性通用图灵机]
    都会复制自己并采取所有可能的选择。


    然而，正如金教授所解释的，DNA 链的工作模式与我们所熟悉的计算模型完全不同。“真正的字符串是一种革命性的重写方式。例如，如果你用 DNA 来表示一个程序，那么非确定性来自于字符串中可能存在多个重写选择这一事实”。


    与并行计算不同，DNA 没有任何试错机制。“我们从计算机科学的世界中得知，图灵系统是通用的——它可以计算任何其他计算机可以计算的东西。如果 编程也是如此，那么它甚至比经典机器还要困难。事实上，我和我的同事都无法想象，教你的读者什么是图灵系统并使用它（例如，两个数字相加）将是一个多么有趣的挑战”。


    那么 NUTM 的未来是什么呢？我们会在桌面上看到它们吗？事实是，DNA 的结果永远不会更快，但它们可以更具通用性，以极小的规模实现高水平的并行化，简单的问题实际上需要更长时间。在高性能计算领域，并行性至关重要，尽管情况可能会不同。


    这描述了物种的本质和个体的特征。但在生物体之外，DNA 序列可以代表任何内容。如果我们考虑到四种不同的碱基，每个碱基都可能代表两个比特的信息。


    DNA 样本并非 100% 完美，而且读取将以缓慢的速度进行成本也可能令人望畏。但许多人需要考虑使用 DNA 导致数据丢失的影响，当价格下降且慢速对于其预期应用不是问题时，这将成为现实。


    这种应用就是存档，DNA 测序的益处有助于在几年前识别出“汽车中的骨架”是理查德三世的遗骸，DNA 即使在非理想条件下也能生存百年，这是显而易见的。事实上，科学家已经从埃及墓和灭绝的动物（如猛象和剑齿虎）中提取并测序了
    DNA，DNA 之所以特殊是因为其密度是光学存储和闪存所缺乏的，这意味着数据具有惊人的稳定性。华盛顿大学的研究人员将 215 PB 的数据编码到1 克 DNA
    中；在这个密度下，世界的数据可以包含在 10 吨 DNA 中，这可以放进一个试管里。


    微软研究院的 Craig 被广泛报道称，他们必须在几年后在我们的数据中心之一拥有拥有某种数量 DNA 的商业化系统，至少是一个小众应用——这暗示了具体来说，微软计划将
    DNA 存储添加到云服务中，尽管不是现在。


    那么我们很快就会在桌面上使用 DNA 进行日常工作吗？可能不会，因为速度限制，但对于固化我们珍爱的照片和不可替代的数据，其益处可能是巨大的。让我们面对现实吧，如果我们真的将
    DNA 处理器注入血液，那将无疑是个人计算的终极。


