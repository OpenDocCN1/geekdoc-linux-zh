    # BUSINESS


    ## Private equity buys SUSE for $2.5 billion

    SUSE was the only profitable business for former owner British technology company
    Micro Focus International has agreed the sale of its business-focused SUSE to
    private equity firm EGT Partners, for $2.53 billion (£1.9 billion).


    Since 2016 SUSE has been under the wing of Micro Focus International merged with
    Attachmate, which had previously purchased SUSE as part of Novell in 2011. SUSE
    has seen its business grow since the Novell acquisition in 2003. Novell''s technologies
    will remain with Micro Focus.


    Originally developed in Germany, SUSE has long seen itself as competitor to Red
    Hat Linux. Since Red Hat has the free notion, SUSE has openSUSE. With Red Hat,
    SUSE earns revenue from technical support (PC & server), hosting, virtualization,
    systems and applications products, cloud and storage and more. Under Micro Focus
    International, SUSE has a lot of success, charting sales of $320 million in the
    12 months to 31 October 2017, with 1,400 employees around the globe. This is due
    to its position as an enterprise-grade provider of open source defined infrastructure.


    Johannes Reached is a Partner at EGT Partners who invited the team to partner
    with SUSE''s management as an "attractive growth investment opportunity" and have
    seen business''s strong performance over the last years as well as its strong
    culture and heritage as a pioneer.


    Following the transaction, the CEO of SUSE, Nils Barackmann will retain his position.
    Describing the sale as a "natural step forward for future partner success," Barackmann
    expressed that it meant that SUSE can become a full independent business". The
    "next chapter in SUSE''s development will continue and even accelerate, the momentum
    above SUSE has gone from its first distro on 40 floppy disks since with EGT, we
    will benefit from further investment and have the continuity of a leadership team
    focused on securing long-term profitable growth combined with a sharp focus on
    customer and innovation.


    Generated over the last years. The sale is subject to approval from Micro Focus
    International''s shareholders, and the regulatory bodies. How long SUSE remains
    under private equity ownership beyond this is anyone''s guess.


