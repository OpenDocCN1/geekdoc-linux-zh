    此外，Inky pHAT 在断电后仍保持图像和文本，因此可以作为静态显示器。最棒的是，因为它像纸一样，在明亮的阳光下也是清晰的，因此适合户外使用。它使用三种颜色——红、黑、白，非常适合显示简单的图形和渲染清晰的文本。


