    Vagrant 根据 Vagrantfile 中指定的镜像创建一个新的 VirtualBox 机器。通过从远程服务器复制虚拟硬盘即可来实现。


    ## 准备虚拟机


    接下来你应该熟悉一下 Vagrant (vagrant.com)，它可以帮助你仅需几条命令维护一致的虚拟环境。Vagrant 支持所有主流平台，如 VirtualBox
    和 VMware，并与 Chef、Puppet、Ansible、Fabric 等配置工具配合使用。


    现在你可以自定义安装。如果你在虚拟机内部运行 Web 服务器，你需要通过在 Vagrant 中添加以下内容来转发端口：


    ```

    config.vm.network "forwarded_port", guest: 80, host: 8080

    ```


    要开始使用 Vagrant，请从其网站下载并安装最新版本。你需要创建一个 Vagrant 配置文件，定义虚拟机在各种操作系统和预定义用途下的所有特性。你可以通过
    https://app.vagrantup.com/boxes/search 测试模板。例如，执行 `vagrant init os/7` 会创建一个基于
    CentOS 7.5.1884 发行版的虚拟机。


    > 你需要非常熟悉 Vagrantfile 的结构才能进行编辑


    你将能够访问主机上的 80 端口。使用 `vagrant up` 启动虚拟机。你也可以在虚拟机运行期间使用 `vagrant reload` 加载修改后的设置。通常，你可以在
    CentOS 内部执行所有在使用 Vagrant 时进行的操作，例如在 Bash 脚本中安装某些应用，然后在 Vagrantfile 中指向该脚本：


    ```

    config.vm.provision "shell", path: "post-install.sh"

    ```


    该命令会在当前目录下创建一个名为 `Vagrantfile` 的文件，它是定义配置的主文件。


    现在启动运行虚拟机。这将在虚拟机启动并运行后执行 `post-install.sh` 脚本。不过，你使用 Vagrant 还可以做更多事情，因此请务必阅读完它的文档。


    完成后，输入 `halt` 关闭主机，输入 `vagrant halt` 关闭虚拟机。


