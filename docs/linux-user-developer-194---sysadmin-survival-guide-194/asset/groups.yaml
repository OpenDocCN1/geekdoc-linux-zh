    Another aspect of log archiving is size and direction, which control the type
    of files such as access logs is mandated by regulatory policies. To help you keep
    logs you may need to delete or rotate them, which involves flushing the old ones
    or moving them to an archive file. The logrotate utility is a popular choice for
    this task as it implements a variety of log management policies. is a popular
