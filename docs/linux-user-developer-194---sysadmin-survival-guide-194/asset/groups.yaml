    case


    much lighter giving up some of the durability. Ports are also a huge win here
    – we have USB-C ports at a Chromebook at this price, we would have been happy
    to see just one. The screen reflects (if you''ll expect the non-pure durability
    of the Chromebook, it is a bit soft, but it should be pretty resistant to scratching
    or cracking). The touchpad is a soft point; the surface is cloth, which is nice.
    However, it is extremely accurate when you turn the laptop into plastic finish
    and touch-click is a turn-off. However, it does not support gestures, so it''s
