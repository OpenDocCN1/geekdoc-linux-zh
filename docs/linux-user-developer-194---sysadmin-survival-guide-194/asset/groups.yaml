    # Raspberry Pi: Inky pHAT


    ## Getting started with the Pimoroni Inky pHAT


    Install and try out a digital name badge, calendar project and more before starting
    on your own creation


    ![](img/70966a5e893fbac28b7b2b33528eb018_75_0.png)


    The Pimoroni Inky pHAT is a beautiful 212x104-pixel, three-colour ePaper (e/ink)
    display for your Raspberry Pi, and costs a very reasonable price as well as $22
    (€25). These types of display are designed to emulate national ink on paper. Unlike
    electronic backlit-flat-panel displays that emit light, electronic paper displays
    reflect light.


    In addition, the Inky pHAT maintains the image and text when the electricity is
    removed, thus acting as a static display. Best of all, because it''s like paper,
    it''s readable in bright sunlight which makes it suitable for outdoor use. It
    uses three colours – red, black and white – and is ideal for displaying simple
    graphics and crisply rendered text.


    The Inky pHAT can be employed as a little clock, it can display tweets, updates
    from the current weather, headlines, sports scores and more, also ideal for graphing
    data from remote sensors, CPU load or temperature, and stock prices.


    In this tutorial we will cover how to set up the hardware and install the required
    software. Then we''ll move on to and work through a number of example programs


    ![](img/70966a5e893fbac28b7b2b33528eb018_75_1.png)


    such as a display, a calendar and a digital name badge. Once you''re familiar
    with using the code and you can create your own image and display it on the screen.


    Finally, we''ll look at displaying and writing text across several lines to fill
    the screen entirely. You can take these skills and apply them to your own creations
    and projects.


    ## Set up the hardware


    As with Pimoroni products, setting up your Inky pHAT is easy. Simply remove the
    product from the packing. Note that it ships with a pre-soldered header out of
    the box. Ensure that your Raspberry Pi is turned off before plugging the Inky
    pHAT onto the GPIO pins, in line with the USB ports. Gently push down to insert
    into place. The pHAT is perfectly designed for the Pi Zero model, creating a slick
    and slim setup.


    To run this type python3 hello.py "your name", replace "your name" with a name
    of your choice, of course. Try your own to start! Press Return and the Inky pHAT
    will begin to flicker as it loads the badge and then displays your name to the
    display.


    ## Install software


    Pimoroni has a software library to get started with your Inky pHAT. It also includes
    a number of programs. To install the libraries and example programs opens the
    LXTerminal window and enter the command line `curl http://get.pimoroni`.


    One example program included in this is the graphical calendar. This program uses
    the code `datetime.now()` to get the current date and time from your OS or some
    values in a variable named now. Some catch later then adjust the width and height
    of each month, which represents the days, by highlighting with a white square
    the current day and date. To run this, use `python3 calendar` and press return.


    ## Display the weather


    The Inky pHAT is the perfect size to make a dinky weather display and what the
    examples includes: One, the LXTerminal window and type `sudo pip install requests`.
    This enables Python to access and pull data from a weather website. Next, open
    the weather.py program in your Python editor and scroll down to 26. Here will
    you find the location


    ![](img/70966a5e893fbac28b7b2b33528eb018_76_0.png)


    and will be you to confirm the download and a few changes. Select the `get-pimoroni`
    and then press Return. If you''d prefer to manually install the software, use
    `sudo apt-get inky-phat` for Python 2 or `pip install python3-pimoroni-inky-phat`.


    ![](img/70966a5e893fbac28b7b2b33528eb018_76_1.png)


    ## Make a display name


    Once the download is complete the Inky pHAT is ready to be used. The Pimoroni
    examples are located in `/home/pimoroni/inky-phat`. They demonstrate a range of
    things the hardware can do. Navigate to the Pimoroni folder, `cd /pimoroni/inky-phat/examples`
    and press Return. The first program is the display name


    details and settings for the weather. Change `city` to your current city. Then
    adjust your country_code; Finally, adjust the minimum temperature unit. This will
    be set at 25, but adjust the value to reflect your environment. Save the file
    and return to the terminal, type `python3 weather.py` to run and graph the weather
    display.


    ## Display the Inky pHAT logo


    The log.py program takes a PNG image file and writes it to the display. In the
    example image there is a file named `inky-hat-222x104.png`, which is the logo
    for the hardware. The image measures 222x104 pixels and displays the full use
    of red, black and white colours. In the LXTerminal window, use `python3 logo.py`
    and press Return. The Inky pHAT will begin to flicker as it loads the badge and
    then displays your name to the display.


