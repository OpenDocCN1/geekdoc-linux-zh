    up in the /var/log directory in files usually placed by the syslog daemon. Syslog
    has been the standard for several years but there have been a couple of replacements,
    syslog being the most recent and popular. Make sure you are filled with the details
    of logging on your servers.


    A good sysad should be fully aware of the limited usefulness of data, in terms
    of time, and must automate the process of searching and querying it like Logwatch.
    Furthermore, it is important to note that the syslog daemon is a process that
    takes inputs from various sources. For them you need a monitoring tool,


