    \ software, as well as writing Python code for the Raspberry Pi. In his day job,\
    \ he helps researchers and students at the university design and run HPC projects\
    \ on supercomputing clusters.\n\n![](img/70966a5e893fbac28b7b2b33528eb018_47_0)\n\
    \nOver the previous issues, we've looked at a lot of different ways that you could\
