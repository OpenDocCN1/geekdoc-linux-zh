    我最近在 Collab 办公室与 Meeks 聊天（第 12 页），聊到了关于他对 GitHub 拍卖回应的一些内容。他对 Linux 作为买家感兴趣，并更关注新的
    CDS 负责人 Ned Feiman。他对开源软件做出了巨大的贡献，他与 GNOME 创始人 Miguel de Luca 一人都是非常重要的人物。


    ### 国际版

    Linux User 是许可开发人员。请联系国际部通过 Neil Ed Elliott 讨论合作机会。


    他非常有兴趣鼓励微软。

    但我们需要应对 GitHub 挑战吗？如何做呢，我们需要你们的一些 Git 托管方案，以便修复 Plasma，第 40 页。在本期中，我们还开启了一个极客小组（第
    21 页）！你们要求我的系统说明器和编辑，所以我们涵盖了主专题（第 58 页）并编写了一份 KDE Plasma 指南（第 58 页）。对于我们的第三个专题，我们将深入研究数据目录（第
    40 页）。请享用！


