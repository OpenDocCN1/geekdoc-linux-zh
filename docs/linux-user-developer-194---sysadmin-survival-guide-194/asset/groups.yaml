    ## Pi Laser Tag


    Pew pew! A Utah State student creates a Pi-powered game for future enhancements


    Terran is an electrical engineering student at Utah State University and is working
    with his wife. His first publicly released project uses a server - any old desktop
    you might have - create a fun game that relies heavily on Wi-Fi, he decided to
    use the Raspberry Pi Zero for 3D-printed cases. There was definitely a learning
    curve that had to be overcome. To use it in that process was one of the best decisions
    I made. The starting GUI was created purely from code, which I had to write from
    scratch. I finished in a fraction of the time, with many additional features I
    would not have known about.


    What inspired you to make your own laser tag?


    During the past year or two, I was more and more interested in home automation.
    I first created a smart mirror to control a fan in my house. Then I began realising
    how easy it was to send information through reality and wanted to take it to the
    next level. If I could control a fan, then surely I could shoot from 3D-printed
    gun.


    What was the most challenging aspect of the project?


    Configuring and tuning the infrared signals were definitely the most part of the
    project. I used the RemoteControl library to handle the hardware side of transmitting
    signals and pull it into software.


    What made you decide to use MQTT? What were your other options?


    I used MQTT because it was simple to set up and embed in the code anywhere. It
    was a great place to start, as there are numerous resources and examples that
    helped me building the messaging service into a network for the project and realising
    how I ended up using the messages, ROS would be an alternative to MQTT as it has
    a lot of the prepared features and needed. I also wanted to keep the complexity
    to a minimum. It brought a great deal of strategies.


    > If I could turn on a gun using a remote, then surely I could shoot from 3D-printed
    gun?


    Can you give us over how the server and guns communicate with each other?


    The project actually used two methods. The communication was through infrared
    codes, where the guns need to shoot each other, and through a handheld remote
    I made using MQTT. At the beginning of the game, some preferences could be chosen
    on the server and then sent to the guns.


    It was using the LIBR library, but a number of features I had to forget unless
    I added additional hardware to Pi.


    Once all of the players logged into the lobby, the server started the game. Each
    Pi was assigned a name and the server was able to determine which player had the
    infrared code. The player would then send a report to the logger to notify that
    he was. A copy of every message was then sent to the server, which compiled all
    of the messages into a report that was displayed at the end of the game.


    Are there any things you would change now, and are you planning to add any more
    features?


    Because of the limitations of the libraries I used, I would love to create an
    analog version of the game I dreamed of sending. By learning how to use the LIBR
    library, a more robust system could be created by adding features and sending
    the signals through hardware.


