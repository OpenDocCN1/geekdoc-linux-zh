    # KDE Plasma 特性


    # PLASMA 高级用户指南


    ![](img/70966a5e893fbac28b7b2b33528eb018_57.png)


    ## 概览角

    将指针移动到屏幕左上角（并持续移动）即可激活应用程序概览。


    ## KDE

    Paul OBrien 探索了最新的 KDE 桌面环境，它比以往任何时候都更加成熟


    ![](img/70966a5e893fbac28b7b2b33528eb018_58.png)


    KDE Plasma 是 KDE 框架的第五代桌面。自原始版本 5.0 发布以来，KDE Plasma 随着每个小版本的发布修复了许多错误。在最近的 5.13
    版本最初于 7 月发布，它使用 Qt 和 KDE 框架构建，并利用 OpenGL 实现了卓越的图形性能。


    > 包含了大量的 HiDPI 支持，使 KDE Plasma 成为支持高分辨率的领先环境之一


    支持 HiDPI，使 KDE Plasma 成为支持高分辨率的领先环境之一——在 5.13 版本中，当您连接显示器时现在会出现对话框提示您配置 HiDPI
    设置。


    KDE Plasma 的关键组件包括启动器、活动、虚拟桌面概念、以及 Dolphin 文件管理器。


    团队花费了大量时间确保桌面环境具有精细化水平，这在 Linux 世界中是难以比拟的，而且加载和运行速度很快。这非常关键，因为轻量级环境变得越来越流行且仅适用于现代硬件。


    ## 底部面板

    底部面板有一系列系统指示器和图标，可以根据需要进行自定义。 5.0 版本之后的性能改进包括优化了启动时间并显著减少了内存消耗。基础功能如面板弹出效果已更新，以便在旧硬件上运行得更流畅。整体外观没有太大变化——Plasma
    仍然保留了其传统的可定制性，且不会让人负担。整体和合成器的改进（类似于其他地区的 Compiz）提供了更清晰的模糊和过渡效果。


    ![](img/70966a5e893fbac28b7b2b33528eb018_59.png)


    ## 快速指南

    ### 我们最喜爱的五个插件


    插件（又名 Plasma 5 Widgets）提供了扩展 KDE Plasma 的强大方式。以下是我们的喜爱：


    - **Alpha Black** 是一个实用的插件，用于控制桌面桌的强调色、面板透明度和任务栏窗口的大小。

    - **日程日历** 是基于 Android 的日程日历，具有每日天气预报并能够显示它们。它还包括 24 小时天气预报。

    - **Redshift 控制** 是一个用于启用和禁用 redshift 进程的工具，可以在晚上调整屏幕色温。它还允许您访问设置并提供手动屏幕温度控制。

    - **Simple Menu** 是一个刻意的极简启动器，具有与 Plasma 5 绑定启动器相同的强大后端。它的 UI 类似于全屏应用程序仪表，但看起来干净得多。除了应用程序网格和过滤外，它支持搜索和基础系统操作。

    - **天气插件** 显示来自 yr.no 或 OpenWeather 的天气信息。地图功能包括面板图标、气象图和扩展视图中的长期预报。新功能如针对多个地点的缓存支持。


    ## 基础功能

    Plasma 始终处于漂亮桌面环境的前沿，在视觉吸引力方面足以挑战苹果和微软的最优水平。5.13 版本的一个核心功能是“Plasma 集成”，一组让 Mozilla
    Firefox、Google Chrome 和基于 Chromium 的浏览器与 Plasma 配合得更好的功能，感觉比以往任何时候都更加统一。下载进度现在显示在
    Plasma 通知弹出窗口中，就像使用 Dolphin 传输文件一样，原生通知中心已完成。通知插件中新的“历史”按钮现在变为永久性。


    媒体插件本身针对最新版本进行了重新设计，现在可以对浏览器播放的音乐进行暂停和跳转。


    ### 其他改进

    - KDE Connect 允许您将手机上的链接直接发送到 Android 手机或平板，并且可以使用 Alt+Space 快捷键通过 Krunner 直接打开标签。

    - 启用 Plasma Mobile 非常简单，尽管默认未配置：只需从您喜爱的插件添加插件即可。

    - KDE Connect 是一个经常被忽视的项目，但随着每个版本的发布变得越来越有用。例如，通过 KDE Connect 可以在桌面上接收手机通知、在手机和桌面之间传输文件、在手机上找到音乐控制、远程控制桌面，甚至同步设备剪贴板！这通过在桌面上安装组件并在连接到同一网络的两个设备上安装
    KDE 客户端来实现。目前仅支持 Android。

    - 设置页面已开始针对最新版本进行迟已的重新设计，KDE 视觉设计小组已经


    ![](img/70966a5e893fbac28b7b2b33528eb018_59_1.png)


    上述需要从您的浏览器商店安装扩展以启用集成功能。


    ## 提示与技巧

    ### 成为高级用户


    **1. 安装 Plasma-addons**

    软件中心有一个实用的 Plasma-addons ，按类别排序，现在搜索结果中使用较小的图标而不是较大的图像。


    **2. 充分利用 KRunner**

    当你想启动应用程序时，不需要手动搜索。只需输入程序名称并按回车键。


    **3. 使用跳转列表**

    跳转列表允许您跳转到特定详情。可以通过右键点击图标来看到这种操作。


    **4. 成为 Dolphin 用户**

    Dolphin 是一个功能齐全的文件管理器，看起来简单。尝试它的功能，如分屏视图。


    **5. 监控服务**

    KDE Plasma 有一个实用的工具可以了解哪些服务正在运行，哪些没有运行。在系统设置的“启动”和“关闭”部分可用，该模式允许手动停止和启动服务。


    ![](img/70966a5e893fbac28b7b2b33528eb018_60.png)


    设置界面采用了 Kirigami 改造以提高其易用性


    ## Discover 插件

    可用的 Dolphin 插件允许将广泛的功能添加到商店管理器设置中，商店中有近 500 种选项可用！Dropbox 集成是团队的固有的喜爱，一系列根工具也是如此。


    '
