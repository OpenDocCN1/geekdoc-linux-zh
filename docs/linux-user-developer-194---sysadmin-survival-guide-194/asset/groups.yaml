    In GIMP, return to the Image menu, then > Indexed. Select the option for a ''custom
    palette'' and click the Palette selection dialog button at the bottom-right of
    the window. Right-click the Import Layers window. Now navigate and select the
    Inky-pHAT.jpg file from the dump in Step 5. You can export the image to the Export
    option. Save and name it .png. Click File, scroll down the menu and Export. A
    folder will appear with a number of saving options; ensure that you select ''Save
    background'', then click ''Export''.


    07 Cleaning the screen

    Over time the Inky pHAT will encounter screen burn - a accumulation of electrons
    on the e-paper display. This occurs over time due to non-uniform use of the pixels.
    Frequently, this can be resolved using the cleaner folder. This basically displays
    solid black, white and grey while to clean the Inky pHAT. Use cleanpy and restart.
    The program takes a little minutes to complete, but leave it to finish.


    08 Create your own image: part 1

    You can use just any image editor to create your image. If you want to create
    the image on your Raspberry Pi then use and GIMP. In the LXTerminal type sudo
    apt-get install gimp and once it has installed type gimp open. Select File > New,
    set the size of the canvas to width 212 pixels and the height to 104 pixels. You
    can now begin to create your image, remembering that you only have black, white
    and red.


    11 Display your image

    To display your image on the Inky pHAT use your Python script or a short program.
    By importing the inky module and then the PIL library, use inset() to load your
