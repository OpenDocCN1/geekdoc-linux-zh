    # Feature Sysadmin Survival Guide


    # # Storage & recovery


    A good storage system uses resources efficiently and also ensures hardware failures
    never bring down the house


    Data is one of the most critical parts of any business, which means managing it
    is one of the key responsibilities of every system administrator.


    The key to a good storage policy is the strategy which seeks the right balance
    between keeping data safe and accessible.


    Before you decide a storage policy, you need to understand how storage works and
    harmonise it with the tools you have.


    It takes a couple of clicks to add storage to a cloud service or attach a disk
    to an existing VM. In the real world, you''ll first decide on the type of device
    (e.g. hard disk, SSD, SATA) then connect it to your server (e.g. SAS, SATA, PCIe).
    The Linux kernel detects the device, and tells you to create a block device for
    that device in the /dev/ directory. These files are the kernel ways to access
    devices for applications and services, and a good practice is to refer to them
    by their Unique Identifiers or UUIDs. The next piece of the puzzle is partitioning


    or rather more dexterous logical volume management (LVM). While traditional methods
    like MBR and GPT are simple, they are rather inflexible. LVM on the other hand
    combines one or more disks into a single logical volume. You can then distribute
    data across the volume group. This also offers other benefits such as snapshot
    management.


    > EXPERT TIP

    RAID is not backup

    Don''t use RAID as an excuse to avoid backups. You don''t want to be in a situation
    where a fried machine renders your disks useless.


    distribute data across multiple disks, a RAID setup helps the plummeting cost
    of storage, and minimizes the downtime associated with hardware failure. RAID
    can be implemented with hardware, it can also be implemented by software. Use
    the command to build and use RAID software. No matter how you implement it, you
    should experiment with the different RAID levels to pick the one that works best
    for your needs


    > one of those mysync-like skills you''ll need


    Linux systems give you several options for partitioning, with parted and graphical
    leading the pack. To manage partitions, use gdisk. While you can (and) supplement
    all storage mechanisms with backups, it''s always a good idea to use a RAID system


    another popular storage skill that should be in the repertoire of any is the ability
    to set up a network-attached storage (NAS) device. Open OpenMediaVault to learn
    about this process. It supports all the popular deployment methods, including
    software RAID, and can be accessed using


    # HOW TO Create a NAS with OpenMediaVault


    ![](img/70966a5e893fbac28b7b2b33528eb018_19_0.png)


    +   1 install OMV

    Installing OMV is pretty straightforward. Download the ISO, transfer it to a USB
    disk and run through the basic steps. If you have multiple disks connected to
    the NAS box, make sure to select the target during the partitioning step.


    +   2 The web interface

    When you''re done, reboot the computer, which will join up to the login shell.
    Don''t log in there but instead head to the web address displayed on the console.
    This brings up OMV''s web interface where you can manage all aspects of the NAS
    server.


    +   3 Set up storage

    You''ll need to format the drives before you can use them.

    Head to Storage > Views all the attached disks. Select the drive and click the
    ''Wipe'' button. After you''ve erased a drive, head back to storage to create
    a file system on the drive.


