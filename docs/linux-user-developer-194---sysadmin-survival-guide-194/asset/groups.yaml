    \ in your browser. You should see something like Figure 8.\n\n# Handling errors\n\
    \nGo has no special error-handling functionality beyond the error type and the\
    \ ability of functions to return multiple values, which means they can return\
    \ an error value alongside their usual return, but we've also seen a few examples\
    \ of error handling ignoring lot of the errors in our code. This can cause some\
    \ issues with errors, but we think you will have a better idea of what happens\
    \ when things go wrong.\n\nAs an example, we will deal with the errors in the\
    \ loadVideo function. When you call the loadVideo function, return the error via:\n\
    \n```go\nvideo := loadVideo(id)\n```\n\nThe only reason why loadVideo might fail\
    \ is if the video is not valid. You can see this on the server by navigating to\
    \ http://localhost:8080/watch/ since we are ignoring the error, we get a blank\
    \ page, which isn't particularly helpful. A better thing to do is to redirect\
    \ the user to the error page. They could apparently type in an incorrect link,\
    \ by replacing the line with the following lines:\n\n![](img/70966a5e893fbac28b7b2b33528eb018_56_0.png)\n\
    \n```go\nvideo := loadVideo(id)\nif err != nil {\n    http.Redirect(w, request,\
    \ \"/\", http.StatusNotFound)\n}\n```\n\nIf and now run the server again, we will\
    \ get a link saying \"Not found\" that takes us back to the home page, as in Figure\
    \ 9. If you change the HTTP status code, you can modify the behaviour of the redirect;\
    \ for example, if you change http.StatusNotFound to http.StatusOK, the page will\
    \ redirect back to the home page, which gives a clearer message to the user about\
    \ what happened. If you face this challenge, you could try to have an explanatory\
    \ message on the home page that details the error. Now for the rest of the error\
    \ handling, we might want to modify the HTML templates to add some pieces to make\
    \ the pages look better, like a site from 1998. Then get ready to join us when\
    \ we will be adding search functionality to our site.\n\nFunction literals and\
    \ closures in Go\nLike other languages (even C), Go allows us to pass functions\
    \ as arguments to other functions. The ways functions are defined means the syntax\
    \ is different from C, where closures are notoriously difficult to understand.\
    \ For example, the equivalent of the C declaration `int (*func(char n))` in Go\
    \ is a bit more complex, but it's easier to see what's going on in the Go, and\
    \ becomes easier for more complex examples. By using function literals, in the\
    \ same way as JavaScript, we could define the function as `func(id byte) int {\
    \ return int(id) }`\n\nThe video-sharing site for Linux\n\n# Our videos\n\n- ZOO\n\
    \ngetAvailableVideos() in the template.Execute function so that it uses get to\
    \ fetch the list of available videos on the page.\nNote that there is some code\
    \ missing between the watchHandler and handler functions, specifically relating\
    \ to the handling of the templates. In that case, you might need to write a helper\
    \ function that watches each of them.\n\nFigure 7 shows what might look like for\
    \ the watchHandler function. The type interface `()` is the empty interface. In\
    \ Go, objects match this type, so we can pass different types of data into the\
    \ template rendering.\n"
