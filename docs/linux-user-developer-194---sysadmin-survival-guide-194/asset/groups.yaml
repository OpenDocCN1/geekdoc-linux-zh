    ## 让你的 Linux 新闻与观点开源


    ## 与 COLLABORA 的访谈


    ## 会见“生产力先生”


    我们前往了位于剑桥的 Collabora 办公室，访问了 Michael Meeks，他是一位资深的开源倡导者和开发者。


    Meeks 是开源界一位温和的重量级人物，他多年来一直为 GNOME 项目不遗余地工作。当 Miguel de Iaca（GNOME 项目的创始人之一）在
    Collabora 办公室创立 Julian Meeks 时，Meeks 是早期的员工。对于 Meeks 来说，Collabora 是 Novell 在 2003
    年左右在开源软件业务中进行的一系列动作，以及在 SUSE 工作直到 Collabora 成立的结晶。


    ### 告诉我们你在 GNOME 方面做了些什么


    我的第一个贡献是针对 GCC（GNU 编译器集合）的，当时我只是很恼于存在某种未定义行为，但编译器并不会告诉你。你关掉所有警告，它就消失了。这可能会导致任何问题。因此我针对这个问题实现了一个补丁；GCC
    的人们也是这么做的，等了大约两年才收到回复。多年后，我收到一条消息说：“哦，我一直在研究这个，发现列表里有一个完全符合该要求的补丁。我们运行过它并改进了它，所以那对模型来说并不是一个非常好的验证。因此我安装了
    GNOME 并让它变得稳定等等。”


    然后我进入了 Gnumeric（和 Miguel de Iaca 一起），并破解了某个功能，进行文件格式的逆向工程。结果非常快，我获取了二进制文件并导入了它们。然后过滤器变得更加安全，因为它们正变得相当稳定，所以对过滤器没有进行真正的审计或模糊测试（fuzzing）。典型的导出测试是：查看此文件的
    diff（它像那样打印行），然后尝试不断减小它，直到它可以在 Excel 中加载，或者在处理它后发生崩溃。例如，如果你关掉了崩溃，或者发生了非常糟糕的事情，随后你就会崩溃——这是由你糟糕的文件格式引起的。所以，是的，底层确实存在着某种恐怖现象。最近，这项工作变得安全得多了。现在导入或容忍坏输入比在
    Microsoft Word 以及当然还有 LibreOffice 中要容易得多。


    ### Michael Meeks


    Michael 是 Collabora Production 的总经理，这是一家开源咨询业务，支持包括 LibreOffice、Linux 内核、Wayland
    等在内的许多项目。


    ### 告诉我们你的背景以及是如何进入开源世界的


    当然。在我很小的时候，我父亲就教我编程，那很有趣。那是一台 BBC 电脑，我非常入迷。我用自己的方式写游戏。后来我成为了一基督徒，结果发现我写的所有游戏都使用了旧编译器，于是我切换了它们。最后，我切换到了那个当时的
    Linux 玩意儿，当时简直糟糕极了。我第一次使用它时就弄坏了我的硬盘。没有任何值值的图形界面。根本没法写游戏。


    自从在 BBC Micro 上写游戏以来，Michael Meeks 走了很远的路。


    ### 那么回到从 SUSE 获得资助，你们涵盖了哪些部分或程序？Collabora Online Office？


    Collabora Productivity 本质是基于 LibreOffice 的东西。所以我们有 Collabora Online（一个开源生产力工具），我们也使用
    LibreOffice（Microsoft Office 的替代方案）。我们还有其他少数可以导致一系列产品的东西。但本质上


    ### 快速指南：Easy VBA 迁移器


    LibreOffice 6.0（于 6 月发布）的一个关键功能是一个名为 Easy VBA Migrator (EVM) 的新解释器，它可以作为使用 Excel
    等组件的旧系统的无缝替换。这使得许多机构能够迁移到开源。例如，Meeks 表示，贝尔法的阿尔斯特医院（Ulster Hospital）有一个由 Computer
    Services（CSC）创建的系统有问题。该系统是用 Visual Basic 6.0 开发的。Meeks 说，花数百或几千美元更换供应商已经不再划算了。你需要专业人士，而且销量没那么高。


    EVM 的开发为许多考虑使用遗留脚本和无脚本 VBA 的开源替代方案的组织打开了大门。API 位于后端，为数据管理提供各种功能。作为其一部分，EVM 让医院得以迁移，这意味着对于现在有
    8,500 人使用 LibreOffice 的所有人来说，社区都是贡献。而且，我们在 LibreOffice 上也工作得很好。我们在董事成员中有两个董事，我们经历过三次冲突，等等。来自
    EVM 的巨大投资。这些工具可以直接运行，甚至无需更改。


    ### 你们是否有列在清单上的、可以让过渡更简单的功能？


    Meeks 说，对于 LibreOffice 6.0，有很多东西。我们做的工作是我们的工作，但我们认为并且我们是投入资金帮助有需要的人。在界面方面，人们喜欢互操作性，这确实非常困难且容易破坏。我们正在做检查工作，以确保他们不会误解文档。例如
    open XML，它是被修复了。我们有一些自找的伤疤。我们切换到使用 Linux 玩意儿，在当时简直糟糕极了。它弄坏了我的硬盘——我们有许多用户，特别是他们正忍受着各种糟糕的问题。使用免费工具，GNOME
    的 bug，KDE 的 bug，我们从永远那里抓取 bug 文档。这确实是我们了解 bug 让我们如何的方法。


    ### 文档的坟墓？


    嗯，其实最近，Linux 基金会——作为一个免费的东西——OSS (https://github.com/google/oss-fuzz) OSS 显然是。之前，我们看到这些文件，然后（https://github.com/google/oss-fuzz）OSS
    模糊测试器。这些工具可以运行，这些模糊测试器，它涵盖了 100,000 个文件。让它处理这些文档吧；它就会消失。这确实是让我们知道 bug 让我们如何。


