    However, one important aspect of a Chromebook is its battery life, and unfortunately
    the Spin 11 did that fail. In our case the battery lasted 6 hours when we were
    playing a local video at 1010p in VLC; the device died after 7 hours and 34 minutes.
    This is well below the average. For instance, the similarly configured and (older)
    Dell Chromebook 13 lasted almost double when running the same test, and an hour
