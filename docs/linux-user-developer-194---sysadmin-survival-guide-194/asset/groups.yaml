    # Feature KDE Plasma


    # POWER USER''S GUIDE TO PLASMA


    ![](img/70966a5e893fbac28b7b2b33528eb018_57_0.png)


    ## Application overview hot corner

    Moving your pointer to the top left of the screen (and continuing to head in (and
    direction)) activates an overview of an activity''s apps.


    ## KDE

    DE Paul O''Brien explores the latest KDE Plasma desktop environment, which is
    more mature than ever before


    ![](img/70966a5e893fbac28b7b2b33528eb018_58_0.png)


    DE Plasma 5.13 is the 14th iteration (since the original version 5.0) of the fifth
    generation of the desktop frameworks created by KDE. KDE Plasma sits alongside
    every few release months, bug fixes are released in every minor release (most
    recently 5.12). Initially released on 15 July 2014, KDE is built using Qt and
    KDE Frameworks, using OpenGL to enable hardware acceleration for excellent graphical
    performance.


    > Extensive HiDPI support is included, making KDE Plasma one of the leading environments
    when it comes to supporting high resolutions


    HiDPI is supported, making KDE Plasma one of the leading environments when it
    comes to supporting high resolutions — cemented by a 5.13 release where a dialog
    now appears as soon as you connect a monitor, prompting the user to configure
    HiDPI settings. Key components of KDE Plasma include the launcher, the activities,
    a powerful experience of the virtual desktop concept, widgets and Dolphin file
    manager.


    The team has spent a lot of time working to ensure that not only does the desktop
    environment have a level of polish and features that is rarely matched in the
    Linux world, it also loads and runs quickly. This is key, as lighter environments
    continue to be popular and to help shake a reputation for being hungry and only
    suitable for use on modern hardware.


    ## The bottom panel

    The bottom panel has a range of system indicators and icons but can be customised
    as desired. The performance changes in the new release include optimized start-up
    times and a noticeably faster time-to-desktop over version 5.0 and considerably
    reduced memory consumption. Basic features such as panel-pops have been updated
    to run smoother on older hardware. The overall look has not changed much - Plasma
    still retains its traditional and improved customizability without being overwhelming.
    Improvements to overall and the K compositor - equivalent to Compiz in other districts
    - provide clearer blur and transition effects.


    ![](img/70966a5e893fbac28b7b2b33528eb018_59_0.png)


    ## QUICK GUIDE

    ### Five of our favourite Plasmodes widgets


    Plasmodes (aka Plasma 5 Widgets) provide a powerful way to extend KDE Plasma.
    Here are our favourites:


    - **Alpha Black** is a useful widget to control the desktop''s accent color, panel
    opacity, and the size of the taskbar windows.

    - **Event Calendar** is based on the Event Calendar for Android, with daily weather
    forecasts and the ability to display them. It also includes a 22 and 24-hour weather
    forecast.

    - **Redshift Control** is a tool for enabling and disabling the redshift process,
    which adjusts the colour temperature of your screen at night. It also enables
    you to access the settings and provides manual mouse-screen temperature control.

    - **Simple Menu** is an intentional minimal launcher with the same powerful back-end
    as Plasma 5 bundled launchers. Its UI is similar to the full-screen Application
    Dashboard, but appears much cleaner. In addition to the application grid and filtering,
    it supports searches, and basic system actions.

    - **Weather Widget** shows weather information from yr.no or OpenWeather. Map
    features include icons like panel, metogram and long-term forecasts in an expanded
    view. New features like location-based cache support for multiple locations.


    ## Basic features

    Plasma stays at the leading edge of good-looking desktop environments, and is
    more than capable of challenging the best Apple and Microsoft to have in terms
    of visual appeal. A key feature for version 5.13 is ''Plasma Integration'', a
    suite of features which make Mozilla Firefox, Google Chrome and Chromium-based
    browsers work more with Plasma and the internet feel much more cohesive than ever
    before. Download progress is now displayed in the Plasma notification popup just
    like transferring files with Dolphin, and a native notification center completes.
    The new ''History'' button in the notification widget becomes permanent now.


    The Media Plasmodes widget, itself redesigned for the latest release, can now
    pause and seek with music playing within the browser.


    ### Other improvements

    - KDE Connect - Connect allows you to send a link from your phone directly to
    your Android phone or tablet, and tabs can be opened directly via Krunner using
    the Alt+Space shortcut.

    - Enabling Plasma Mobile is straightforward, though not configured by default:
    simply add the plug-in from your preferred widget.

    - KDE Connect is a project that is often overlooked but becomes more useful with
    each release. For example, with KDE Connect you receive phone notifications on
    your desktop, transfer files between your phone and desktop, find control music
    on your phone, control remote for your desktop, or even sync your device clipboard!
    This is achieved with a component installed on your desktop and a KDE Client app
    installed on the two devices being connected to the same network. Only Android
    is currently supported.

    - The Settings pages have started to receive an overdue redesign for the latest
    release, the KDE Visual Design Group has,


    ![](img/70966a5e893fbac28b7b2b33528eb018_59_1.png)


    Above An extension needs to be installed from your browser''s store to enable
    integration features.


    ## TIPS & TRICKS

    ### Be a power user


    **1. Install Plasma-addons**

    The Software Center has a useful section for Plasma-addons, sorted by category,
    which now use smaller icons instead of bigger images for search results.


    **2. Make the most of KRunner**

    There''s no need to manually search every time you want to launch an application.
    Just type the name of the app and hit Return.


    **3. Use jump lists**

    Jump lists enable you to jump to specific details. You''ll see this in action
    by right-clicking on the icon.


    **4. Be a Dolphin user**

    Dolphin is a fully featured file manager, appearing simple at first glance. Check
    out its features, like Split-view.


    **5. Monitor services**

    KDE Plasma has a useful utility for understanding which services are running and
    which are not. Available in the ''Start'' and ''Shutdown'' section of System Settings,
    the mode allows services to be manually stopped and started.


    ![](img/70966a5e893fbac28b7b2b33528eb018_60_0.png)


    The settings screen gets Kirigami made-over to improve its usability


    > The team has started a rolling programme of improvements to the theming tools,
    which includes icons, desktop themes and colors. The Kirigami UI frame is perfect
    to use and is easy to build. It makes a lot better use of lists and category,
    which now use smaller icons instead of bigger images. Lists can be used by the
    new Kirigami cards for search. Start and pages can easily highlight quality-items,
    and the overall store-brows experience is improved. All Upstream (the cross-distro
    XML format to provide metadata for software components) now use the local icon
    theme to match your desktop settings. Additionally, courtesy of the design, lock
    and icons screens, which now show the wallpaper of the Plasma release by default,
    more integrated with the rest of. The lock screen feels less like distraction
    to show the controls, it is possible to be easily used like a slicker.


    ## Discover add-ons

    The available Dolphin add-ons enable wide range of features to be added to the
    store manager setup, with nearly 500 options available in the store! Dropbox integration
    is a firm favourite for teams, as are a range of root utilities.

