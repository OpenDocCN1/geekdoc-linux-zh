    # Terran T


    Terran is an electrical engineering student at Utah State University and is employed
    at Wirth working with his wife.


    terran''s first publicly released project uses a server - essentially any old
    desktop you might have - Raspberry Pi powered guns to create a fun tag game that
    relies heavily on Wi-Fi, which he decided to use the Raspberry Pi Zero for the
    3D-printed cases.


    GUI, there was definitely a learning curve that had to be overcome. Pygubub to
    use it in that process was one of the best decisions I made. The starting GUI
    was created purely from code, with the game report I had to write using Pygubub.


    I finished in a fraction of the time, with many additional features I would not
    have known about I attempted to write it from scratch. The best aspect of Pygubub
    is having the GUI in real time, with easy to save, exit and restart the code time.


    What inspired you to make your own laser tag?


    During the past year or two, I was more and more interested in home-automation.
    I first created a smart mirror to control a fan in my house. Then I began realising
    how easy it was to send information through reality and wanted to take it to the
    next level. If I could control a fan, then surely I could shoot from a 3D-printed
    gun.


    What was the most challenging aspect of the project?


    Configuring and tuning the infrared signals were definitely the most difficult
    part of the project. I used the RemoteControl library to handle the hardware side
    of transmitting signals and pull it into software.


    What made you decide to use MGTT? What were your other options?


    I used MGTT because it was simple to set up and embed in the code anywhere. It
    was a great place to start, as there are numerous resources and examples that
    helped me building the messaging service into a network for the project and realising
    how I ended up using the messages, using ROS would be an alternative to MGTT as
    it has a lot of the prepared features and needed.


    I also wanted to keep the complexity to a minimum. Or the library brought a great
    deal of strategies


