    # FTP SERVER


    # upftpd 2.5


    A ''no-nonsense'' FTP server which is just that


    Linux has no end of good FTP servers, but uftpd has carved a niche for itself
    by shipping sensible defaults which work for most users.


    It''s designed for users and developers who need a simple FTP server, but aren''t
    too particular about making advantage against using another server. In fact, the
    documentation of the project is lacking. uftpd is totally insecure and its author
    has implemented some common security-practices (though not much more user-friendly).


    TP, uftpd''s author points to research that deems the lack of lustre over the
    internet. One of the main reasons behind uftpd, in its author''s own words, complexity
    of configuration files of other alternatives. In the spirit of open source software,
    he wrote uftpd from scratch: an FTP server without configuration file, which you
    can use much easily without installing through a tonne of options.


    While the project isn''t available in the software repository of many distributions,
    the installation is really straightforward. Once it''s installed, you can use
    uftpd as a regular user, the root user and even from a chroot environment, if
    needed.


    Combined with users adequate precautions and defining strict permissions, uftpd
    is as secure as any of its peers. While uftpd supports both FTP and


    +   - Pros Can be used right after installation without spending time with configuration
