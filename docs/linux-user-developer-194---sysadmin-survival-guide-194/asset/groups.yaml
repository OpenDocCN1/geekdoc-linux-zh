    paper. The keyboard would also seem shallow with 1.1mm of key travel, but feels
    comfortable and we didn''t find the keys bot out while working out on it.


    It''s not the cheapest Chromebook in the market, weighing at 1.35kg. However,
    its 2cm frame with rounded corners makes it pleasant enough to hold, and we''re
    sure that it was difficult to make it lightweight.


