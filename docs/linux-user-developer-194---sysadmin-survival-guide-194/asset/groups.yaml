    Above we can track any number of remote from a Git project. One is named origin,
    and that is the primary place for us to push, but multiple remotes are possible


    So far, we''ve used GitHub.com to host our own Git repositories. GitHub is a great
    site, and it''s very quick and easy to get started with Git. It also allows us
    to host a wide range of repositories, from simple projects to the Git itself and
    Linux kernel.


    Nevertheless, it is not to be said, and there are many reasons you might want
    to host your own repository on your own server. If you want to make a repository
    private, by default hosted on GitHub, everyone can see the code. You can make
    a private repository, but only if you pay $7 per month for a Developer, or $9
    for a team.


    You might find that this service is well spent - and right so - if you have space
    on your own server, and don''t need any Git-tools, it is also something that you
    don''t need to check out. Hosting yourself means you are in complete control over
    who has access to your data. It''s also surprisingly easy to do, as we will see.


    Now that Microsoft has acquired GitHub, we know that many readers have objected
    to using the hosting platform and anymore are considering others. Although Microsoft
    changed its policy on open source software significantly in recent years, we''ve
    decided to implement some alternatives to GitHub.


    # Simulate a remote server


    This tutorial will work best if you have a remote server with SSH access, so that
    you can log into the server by running commands (replacing my username and myremote.example
    with your username and hostname for example).


    ```

    $ ssh mysusername@myremote.example.com

    ```


    If you don''t have access to a remote server, you can simulate one locally. That
    way, at least you''ll know what to do if you ever need to check a Git repository.
    To start, with edit the /etc/hosts file:


