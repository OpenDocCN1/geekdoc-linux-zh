    # 树莓派项目


    如果我能用遥控器打开枪，那么我一定可以射击了。


    你能向我们介绍一下服务器和枪支是如何通信的吗？


    项目中最具挑战性的方面是什么？


    配置和调试红外信号绝对是项目中最困难的部分。我使用了 RemoteControl 库来处理信号传输。


    你为什么决定使用 MQTT？你的其他选择是什么？


    使用 MQTT 是因为它很容易设置并嵌入代码中。使用该方法是一个非常好的开始，因为那里有大量的资源和示例。


    你提到使用 python 创建 UI 吗？


    是的，这是我第一次尝试创建一个


    # 是什么启发了你制作标签战游戏？


    在过去的两年里，我对家居自动化越来越感兴趣。我首先创建了一个智能镜子来控制家居。如果我能用遥控器控制风扇，那么我一定可以……。


    项目实际上使用了两种方法。通信方法是通过红外代码（枪支需要互相射击）以及通过使用 MQTT 使用的手持遥控器。在游戏开始时，可以在服务器上选择一些偏好并发送到枪支。


    使用了 LIBR 库，但除非添加额外的硬件，否则我不得不忘记。


    一旦所有玩家登录大厅，服务器就会启动游戏。每个树莓派被分配了一个名称，服务器能够确定哪个玩家拥有红外代码。玩家随后会向日志发送报告以通知他。每条消息随后都会发送到服务器，服务器会在游戏结束汇总所有消息。


    现在你有任何改变的地方吗？你计划增加更多功能吗？


    由于我使用的库存在局限，我想创建一个梦想中的游戏的模拟版本。通过学习如何使用 LIBR 库，可以通过添加功能和通过硬件发送信号来创建一个更健壮的系统。


    # 喜欢吗？


    要深入了解 Terran 的项目请访问 http://bit.ly/PiLaserTag。


