    # 安全


    ## 新 CPU 缺陷影响几乎 Linux 系统

    Xen Project 成为受害者之一，修复程序已在补丁中发布。紧随漏洞之后的消息称：“System 和 Spectre 漏洞导致了 Lazy FPU（延迟浮点单元），一个新发现的漏洞可能会导致浮点数据被滥用。虽然这是一个与我们臭名昭著的处理器类似的漏洞，但它是可以更容易修补的漏洞，而且不会产生补丁
    Meltdown 所遭受的性能影响。缓解该漏洞还可以提高系统性能。”


    FPU 缺陷不影响现代版本的的 Linux（内核 4.9）、Windows 或最近的 OpenBSD 和 DragonBSD。然而，Linux 团队仍在为内核
    4.8 制定缓解措施。


    该漏洞——在变更调查期间发现——仅存在于 Intel Core（Nehal 及后续版本）和 Xen 内核中，可能会允许恶意攻击者或恶意软件从各种处理单元获取数据。这些数据存储在
    FPU（浮点单元）中，FPU 可以被加密密钥破解，从而可能解密用于安全应用程序和网站的数据。


    Intel 的软件可能使用 Lazy FPU 状态恢复来延迟状态恢复，直到执行对该状态的操作的指令。使用基于 Intel Core 的微处理器的系统可能允许本地进程在上下文推测执行更改后通过
    Lazy FPU 状态恢复渗透数据。


    受影响的不只是标准服务器和桌面。Xen 虚拟机管理器也受到了攻击，解释如下：“攻击者可以读取之前在同一台机器上调度的 x86/MMX/SSE/AVX/AV512
    寄存器。这可能属于不同的虚拟机，或者同一虚拟机内部的不同线程。”


    有建议认为 VMware 也受到了该漏洞的影响，但一些人声称其只有少数 Linux 应用程序受到了影响。


    在此阶段，该漏洞被认为是无法被利用的，但打补丁比碰运气要安全。


