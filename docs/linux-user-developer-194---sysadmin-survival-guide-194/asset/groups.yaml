    一个全面的恢复解决方案，可以解决大多数常见问题。它有足够的文档来指导缺乏经验的用户，而高级用户会欣赏它的自定义功能。


    ## 总体


    名副其实，拥有终极的工具和实用程序集，可以排除系统每个组件中的问题。缺乏图形桌面并不是缺点。


    ## 评测


    ## 救援发行版


    ## 简要：对比我们的判定结论


    | 工具 | ALT Linux Rescue | Morpheus Linux | SystemRescueCd | Ultimate Boot CD |

    | --- | --- | --- | --- | --- |

    | 仓库 | 包含 100 多个 CLI 工具和若干脚本用于自动化任务 | 侧重点明确，包含数量有限的工具用于恢复数据 | 内置了实用的修复和救援工具，并有几个直接镜像
    | 名副其实，充满了各种系统工具和实用程序 |

    | 自定义工具与实用程序 | 不带图形桌面，且仅捆绑了少量自定义脚本 | 发行版可以在没有 GRUB 脚本的情况下工作，但它未包含在 CD 启动中 | 支持模块，这对于自定义发行版非常有用
    | 使用极其现代的菜单来选择正确的工具 |

    | 用户体验 | 直接启动并期望你熟悉如何操作 | 它从 LINUX 开始，但几乎没有包含可供使用的应用程序 | 拥有全面的启动菜单，并显示有用信息 | Ubuntu
    的启动菜单使其导航变得相当简单 |

    | 支持与救援文档 | 几乎没有任何文档，也没有寻求支持的途径 | 项目有充足的文档以及示例 | 拥有足够的文档和支持论坛来引导新用户 | |

    | 总体 | 面向熟悉内置工具的经验丰富用户 | 基于 Arch 的发行版，带有一个仍然实用的图形界面... | 与其光盘一起，它是一个帮助你处理常见问题的良好组合
    | 顾如其名，Ubuntu 使用时尚的界面提供了大量工具 |


    ## 优胜者

    Ultimate Boot CD


    为了确保你的常用 Linux 系统正常，你需要一个拥有正确工具的发行版。但对于缺乏经验的用户来说，仅仅拥有最大的工具集并意义不大。这就是为什么我们的首选之一是一个可以在任何计算机上使用的即启动光盘，无论管理技能和经验如何。这是因为
    ALT Linux 在很多方面都优于其他选择。在没有图形界面或 XWINDOW 的情况下，它只有知道用哪些工具的经验丰富用户才能读取和使用。而 Morpheus
    Linux 有它自己的图形界面，但它没有任何工具。SystemRescueCd 是一个很棒的工具，但它只适合经验丰富的用户。


    UBCD 包含了用于硬件压力测试的列表以及其他许多用处。尽管如此，使用 SystemRescueCd 不如 UBCD，后者的启动菜单逻辑清晰，每个选项都能提供足够的帮助。


