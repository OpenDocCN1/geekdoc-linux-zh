    # Linux 基础教程


    我们现在注销远程主机并登录到仓库的本地副本。目前，我们在服务器上有一个空的裸仓库（bare repository），在本地机器上有第二个普通的空仓库。虽然在本地工作目录（即我们开始的
    Linux articles 目录）中已经向索引添加了一些文件，但从 Git 的角度来看，这两个仓库都是存在的。


    关于 `origin` 名字的由来，它通常用于指代托管该仓库的服务器。此外，当我们使用 `git clone` 克隆一个仓库时，Git 总是会将我们克隆来源的位置标记为
    `origin`。


    剩下的工作是执行一次初始提交（commit），其中包含我们在目录中添加的所有文件，并将其推送到远程服务器。


    我们现在可以在本地仓库中运行 `remote add` 命令，告诉 Git 远程仓库与本地仓库的对应关系。在 Linux articles 目录内，我们使用命令：


    ```bash

    $ git remote add origin git@user@example.com/home/git-repos/linux-articles

    ```


    从技术上讲，这个命令并没有做任何特殊的事情：它只是让我们能够使用短标识符代替长地址。如果我们省略了这一步，那么每次想要推送到服务器时都必须输入这个长地址。


    ```bash

    $ git push -u origin git@user@example.com/home/git-repos/linux-articles

    ```


    Git 允许我们使用短标识符维护一个远程分支列表。我们可以使用 `git add` 添加新名称，并使用 `git remote` 移除现有的标识符。这没什么特别的。


    如果我们希望能够进行拉取（pull），还需要告诉仓库 `origin` 是默认分支。我们运行以下命令：


    ```bash

    $ git config branch.master.remote origin

    $ git config branch.master.ref refs/heads/master

    ```


    Gitea（发音为 ''git-tea''）是一个开源 Git 托管平台，它用 Go 语言编写，使得托管自己的项目变得更加容易。如果你怀念 GitHub 的功能，那么
    Gitea 的界面和特性也会让你喜欢它。在某种意义上，使用 Gitea 就像拥有你自己的版本的 GitHub。你可以创建分叉（forks）、提交拉取请求（pull
    requests）等。它可以作为一种轻量级解决方案，并运行在树莓派等简单硬件上。


    要开始之前，你需要决定要在哪里托管你的仓库。但安装 Gitea 最简单的方法是从他们的网站下载二进制文件，例如：


    ![](img/70966a5e893fbac28b7b2b33528eb018_37_0.png)


    # GNU 软件


    Savannah (savannah.org) 是 GNU 基金会的软件开发站点。如图 7 所示，该站点是 GitHub 和 Gitea 的替代方案。如果你想开始，需要去
    savannah.org/account 注册你的项目，在 Savannah 上托管是一个更好的选择。


    它与自由软件社区紧密相连，该社区只托管可以自由修改并在免费操作系统上运行的软件项目。与 GitHub 不同，Savannah 只托管自由软件，其所有组件也是如此。


    这意味着，如果你想在 Savannah 上创建一个项目，你需要确保你的项目从上到下都是自由软件。


    有一份关于让你的 Savannah 项目通过审核的有用指南：


    ![](img/70966a5e893fbac28b7b2b33528eb018_37_1.png)

    ![](img/70966a5e893fbac28b7b2b33528eb018_37_2.png)


    # 1337 转换器 - 摘要


    # 图 7


    | 名称 | 版本 | 大小 | 日期 |

    |---|---|---|---|

    | 1337 Converter | 1.0.0 | 1.2 MB | 2023-01-01 |


    # GitLab 和 Bitbucket


    GitLab (www.gitlab.com) 是 GitHub 的直接竞争对手，在许多方面与它相似。与 GitHub 不同，GitLab 是开源的，并且允许你创建无限数量的仓库。GitLab
    拥有像 GitHub 一样的 Web 界面，但也可以非常简单地使用自托管仓库。在本文中如果你对使用 GitLab 自托管感兴趣，在... 有非常好的说明可用……如果你也感兴趣，我推荐使用
    Omnibus 安装。需要注意的是，GitLab 运行企业版（Enterprise Edition），如果你不在乎自托管，可以免费获取它。


    Bitbucket (https://bitbucket.org) 是另一个 GitHub 替代方案，由 Atlassian 所有。Bitbucket 在线是免费，但如果你想托管私有仓库则需要付费。Bitbucket
    允许免费创建无限数量的私有仓库，但限制为五个用户。


    我们使用了 GitLab，尽管我们发现它缺少创建新分支所需的某些功能，且问题跟踪器（issue tracker）也表现平平。部分原因是 Bitbucket
    与其他项目集成了。


    我们对 GitLab 留下了深刻印象，尽管我们发现它在创建新分支所需的某些功能上有所不足，且问题跟踪器也一般。部分原因是 Bitbucket 与其他项目集成了。


