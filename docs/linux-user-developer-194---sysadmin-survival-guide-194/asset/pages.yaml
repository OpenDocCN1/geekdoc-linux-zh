    \n![](img/70966a5e893fbac28b7b2b33528eb018_47_1.png)\n\n![](img/70966a5e893fbac28b7b2b33528eb018_47_2.png)\n\
    \n![](img/70966a5e893fbac28b7b2b33528eb018_47_3.png)\n\nOver the previous issues,\
    \ we've looked at a lot of different ways that you could use your Raspberry Pi.\
    \ But, while we've developed code for each – such as how to touch devices or communicate\
    \ over the GPIO bus – we have really covered how to interact with it. Now, we'll\
    \ take a look at Kivy, which is ideal for creating graphical interfaces to make\
    \ it easier for you to interact with your app.\n\nKivy is a multi-platform library\
    \ for Python that provides the tools you need to build a GUI for your Python projects.\
    \ As the fact, Kivy works on Linux, Windows, macOS, and Android – so you can take\
    \ the examples given here and easily reuse them in any of other projects.\n\n\
    # Hello world\n\nSince Kivy is a GUI toolkit, it will involve a bit more boilerplate\
    \ wrapping to create the actual functions. For example, the code below is an example\
    \ of a class 'Hello World' program:\n\n```\nfrom kivy.app import App\nfrom kivy.uix.label\
    \ import Label\nclass MyApp(App):\n    def build(self):\n        return Label(text='Hello\
    \ World')\n\nif __name__ == '__main__':\n    MyApp().run()\n```\n\nAs you can\
    \ see, the first step is to implement the App class and build on it. In this case\
    \ the class is called MyApp. The primary method that you must implement is the\
    \ build() function. This method gets executed when your app starts and generates\
    \ the widgets and other display elements. In the above example, the code generates\
    \ a Label in order to show the text Hello World. Save the code to a Python file\
    \ named my.py for example –\n\n# Install Kivy\n\nInstallation is pretty easy if\
    \ you are using Raspberrybian, or some other Debian, on your Raspberry Pi. You\
    \ can install it with the following command:\n\n+   - sudo apt-get install python-kivy\n\
    \nIf you've moved writing code using Python 3, install the package python3-kivy\
    \ instead. There is also a package\n\n# Resources\n\n+   - Kivy\n\nhttps://kivy.org\n\
    \n+   - Pyments\n\nhttp://pyments.org/"
