    # # Canonical shares deat of desktop metrics


    Canonical has revealed that 27 percent of users opted-in to collection of desktop
    metrics when installing Ubuntu 18.04 LTS.


    Upon installation, an option integrated into the Ubuntu report allows Canonical
    to collect hardware and location details. To help Canonical understand what users
    are installing Ubuntu and how to improve the OS this tool has turned long-term
    Ubuntu users away from the distro.


    As stated by assertions from Canonical that the collection is not a privacy breach
    (no user-identifiable information is shared), and


