  md: '# Raspberry Pi: Inky pHAT


    # Getting started with the Pimoroni Inky pHAT


    Install and try out a digital name badge, calendar project and more before starting
    on your own creation


    ![](img/70966a5e893fbac28b7b2b33528eb018_75_0.png)


    The Pimoroni Inky pHAT is a beautiful 212x104-pixel, three-colour ePaper (e/ink)
    display for your Raspberry Pi, and costs a very reasonable price as well as $22
    (€25). These types of display are designed to emulate national ink on paper. Unlike
    electronic backlit-flat-panel displays that emit light, electronic paper displays
    reflect light.


    In addition, the Inky pHAT maintains the image and text when the electricity is
    removed, thus acting as a static display. Best of all, because it''s like paper,
    it''s readable in bright sunlight which makes it suitable for outdoor use. It
    uses three colours – red, black and white – and is ideal for displaying simple
    graphics and crisply rendered text.


    The Inky pHAT can be employed as a little clock, it can display tweets, updates
    from the current weather, headlines, sports scores and more, also ideal for graphing
    data from remote sensors, CPU load or temperature, and stock prices.


    In this tutorial we will cover how to set up the hardware and install the required
    software. Then we''ll move on to and work through a number of example programs


    ![](img/70966a5e893fbac28b7b2b33528eb018_75_1.png)


    such as a display, a calendar and a digital name badge. Once you''re familiar
    with using the code and you can create your own image and display it on the screen.


    Finally, we''ll look at displaying and writing text across several lines to fill
    the screen entirely. You can take these skills and apply them to your own creations
    and projects.'
