    With package sourcing now, the next step is to install PowerShell using your package
    manager''s install command. In Debian or Ubuntu, this is the well-known **apt
    install** command sequence with the -y switch to auto-confirm prompt.


    ```

    sudo apt-get install -y powershell

    ```


    Once installation, use PowerShell with the **pwsh** command to establish a PowerShell
    session. To verify your installation, type the following:


    ```

    #PSVersionTable

    ```


    This will output Version information along with Edition, which as **Core**. Traditional
    UNIX modules are simultaneously available from PowerShell, by executing cat to
    print OS details to console


    ```

    cat /os-release

    ```


    As a note, you will install the Azure PowerShell Core module. It has the functionality
    to connect to network and serve as the default for your Linux instance.


    # Install PowerShell


    The next step is to install the Azure PowerShell module. Use the PowerShell command
    **Install-Module** to do the work of installing the module and associated dependencies.
    To Install PowerShell, execute the following command from your PowerShell session:


    ```

    Install-Module Azure.Netcore

    ```


    This results in a prompt asking to trust the repository; answer yes and press
    Enter. The module will then download and install various PowerShell modules to
    create Azure PowerShell. Note that ''**RM** designates Resource Manager, the client
    layer of the Azure technology stack used for deployment management and access
    control of Azure cloud resources. **Figure 1** briefly introduces the five key


    PowerShell makes it possible to use Azure PowerShell. Use the **Get-Cmdlet** to
    inspect the various cmdlets included in the modules.


    For more details, use the cmdlets in modules like Azure.Resources.Netcore, to
    issue the management statement from the PowerShell command prompt:


    ```

    Get-Command -Module Azure.Resources.Netcore

    ```


    This command will output all available cmdlets using **New-AzureRM**, which is
    used to create Azure resources.


    # Login to Azure Resource Manager


    From the interactive PowerShell prompt, invoke **Login-AzureAccount** to login
    and establish a Azure session with your Azure account. If you don''t have an Azure
    subscription, create a free account before proceeding.


    ```

    Login-AzureAccount

    ```


    This interactive method of login requires a session to validate the code text
    displayed during the sensitive-interactive external login. The diagram shows the
    steps of the login process with **Login-AzureAccount**. Note that PowerShell uses
    other login methods to support enterprise integration with Azure Directory (AD)


    # Create a virtual machine


    With an established PowerShell session, you can now issue commands against your
    cloud environment, such as virtual machine. **New-AzureRM** rolls-out the process
    of creating a new Azure virtual machine, sourcing the operating system template
    as an image, VM configuration or disk file.


