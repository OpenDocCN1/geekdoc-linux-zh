    the Raspberry PI 3 B+ and booming with a number of new features.**nPrimary among
    these is the ''First-boot'' wizard, a long-overdue inclusion that guides you through
    setup options, with most other Linux distributions.

    Adding the ability to set location, for updates, add a password (ending, at least,
    the security of the default username and password), and choose Wi-Fi networks,
    this feature is automatically disabled. It can, however, be accessed at any time
    using the `pixviz` command in the terminal.


