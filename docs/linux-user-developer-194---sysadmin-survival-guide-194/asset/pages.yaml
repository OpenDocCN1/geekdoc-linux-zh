    While some of the installation is revealed, Canonical has also been able to get
    data current state of PCs and laptops. Interestingly, Ubuntu is used all over
    the world (this information was gathered via telemetry reports), with the BRICS
    nations of Brazil, India, China and South Africa actively participating on the
    operating system.


