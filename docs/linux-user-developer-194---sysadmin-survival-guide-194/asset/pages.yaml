  md: '# Azure PowerShell


    # Azure Powershell: Manage your resources from Linux


    Open source .NET Core has paved the way for Azure PowerShell to run on Linux


    PowerShell, a command-line shell and associated scripting language once exclusively
    for the domain of Windows Server, now offers cross-platform capabilities. The
    flagship of this transformation is PowerShell, an open source project that uses
    .NET Core to achieve cross-platform OS support for Linux distributions such as
    CentOS, Debian and Ubuntu.


    Azure PowerShell provides a broad array of cmdlets for managing machines, applications,
    SQL databases, and storage. This article introduces Azure PowerShell with cmdlets
    to create Linux-based resources in the Azure Cloud, and we will illustrate the
    power of Azure PowerShell with a few handy scripts - all from the Linux context!


    Note that Azure PowerShell specifically names the same list of supported Linux
    operating systems, but also includes Arch64 and ARM. For Linux distributions not
    officially supported, you can PowerShell binaries by downloading and decompressing
    the Linux TAR.gz archive, or install it via the PowerShell API. A few people in
    the community have mentioned using it when running on Raspberry Pi, which we won''t
    be covered in this article.


    # Install PowerShell Core


    To begin, check that PowerShell supports your preferred Linux distro. The box
    (see p4) lists supported distributions where PowerShell binaries are available
    using native package management tools


    +   1. Update the list and install system components (apt-transport-https)

    2. Import the Microsoft public key repository GPG keys

    3. Register the Microsoft repository as your Linux-distro specific

    4. Update the package repository list to import Microsoft repo contents


    | 1 | 2 | 3 | 4 |

    |---|---|---|-|

    | DEVICE CODE | | YES | |

    | Launch pwsh from the Linux shell | | SUCCESSFUL LOGIN | Prompt returned by cmdlet
    Login-AzureRMAccount count after successful login. You can now run Azure PowerShell
    commands.

    | From the Web browser to go: https://aka.ms/devgeticolin | Paste the date code
    copied from Step 1 | |


    The command-line based Azure PowerShell login process'
