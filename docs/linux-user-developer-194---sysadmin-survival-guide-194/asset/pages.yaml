    # SECURITY


    # # New CPU flaw hits almost Linux systems


    Xen Project among casualties, with a fix issued in patch


    Hot on the heels of the bug says: "System and Spectre bugs cause Lazy FPU, a newly
    discovered bug might expose floating point data to be misused. While this is a
    vulnerability just as similar to our infamous processors, it is one that can be
    patched far more easily, and without the performance hit that patching Meltdown
    has incurred. Mitigation of this bug could also improve system performance."


    The FPU flaw doesn''t affect modern versions of Linux (kernel 4.9), Windows or
    the recent OpenBSD and DragonBSD. However, the Linux team is still working on
    mitigation measures for kernel 4.8.


    The bug - discovered during change investigation - is found only in Intel Core
    (Nehal and later) and Xen kernels, can potentially allow malicious actors or malware
    to gain data from the various processing units. This data is held in FPU (floating
    point units), which can be subverted over cryptographic keys, potentially decrypting
    data used in secure applications and websites.


    Intel''s software may use the Lazy FPU state restore to delay the restoring of
    state until an instruction operating on that state is made. Systems using Intel
    Core-based microprocessors may potentially allow a local process to infiltrate
    data using Lazy FPU state restore after a context speculative execution change.


    It isn''t just standard servers and desktops that are affected. The Xen hypervisor
    has also been hit, with the following explanation: "An attacker can read x86/MMX/SSE/AVX/AV512
    registers previously scheduled on the same machine. This could belong to a different
    guest, or a different thread inside the same guest."


    Suggestions that VMware has also been hit by the bug have been made, however with
    some claiming that only few of its Linux-based applications are affected.


    At this stage, the flaw is considered safe from exploitation, but patching is
    safer than taking a chance.


