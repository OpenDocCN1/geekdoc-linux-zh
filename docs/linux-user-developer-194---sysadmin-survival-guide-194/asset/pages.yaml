    \ browser. You should see something like Figure 8.\n\n# Handling errors\n\nGo\
    \ has no special error-handling functionality beyond the error type and the ability\
    \ of functions to return multiple values, which means they can return an error\
    \ value alongside their usual return, but we've also seen a few examples of error\
    \ handling ignoring a lot of the errors in our code. This can cause some issues\
    \ becoming with errors, but we think you will have a better idea of what happens\
    \ when things go wrong.\n\nAs an example, we will deal with the errors in the\
    \ loadVideo function. When you call the loadVideo function, then return the error\
    \ via:\n\n```\nvideo := loadVideo(id)\n```\n\nThe only reason why loadVideo might\
    \ fail is if the video is not valid. You can see this on the server by navigating\
    \ to http://localhost:8080/watch/ since we are ignoring the error, we get a blank\
    \ page, which isn't particularly helpful. A better thing to do is to redirect\
    \ the user to the error page. They could apparently type in an incorrect link,\
    \ by replacing the line with the following lines:\n\n![](img/70966a5e893fbac28b7b2b33528eb018_56_0.png)\n\
    \n```\nvideo := loadVideo(id)\nif err != nil {\n    http.Redirect(w, request,\
    \ \"/\", http.StatusNotFound)\n}\n```\n\nIf and now run the server again, we will\
    \ get a link saying \"Not found\" that takes us back to the home page, as in Figure\
    \ 9. If you change the HTTP status code, you can modify the behaviour of the redirect;\
    \ for example, if you change http.StatusNotFound to http.StatusOK, the page will\
    \ redirect back to the home page, which gives a clearer message to the user about\
    \ what happened. If you face this challenge, you could try to have an explanatory\
    \ message on the home page that details the error for the user.\n\nNow for up\
