    # Stacer 1.0.9


    A graphical system monitor and resource optimizer


    ![](img/70966a5e893fbac28b7b2b33528eb018_90_0.png)


    System monitoring is an essential task for any user. You''ll find several system
    monitors in distribution repositories, Stacer offers the use of an attractive
    user interface that''s intuitive to navigate. Besides monitoring, you can also
    use aspects of the optimiser and fine-tune several of your installation—like BleachBit,
    but with a much more interface.


    Stacer is repository for Ubuntu and also an Appliance for other distributions.
    Its dashboard displays information about the system and helps you to detect the
    activity of processor, memory and disk, with bars for download and upload speeds.
    You can also configure the apps you want to monitor in case the readings of exceed
    a defined limit.


    Use the icons to switch between the different areas of the app. You can add and
    disable startup apps and control other services. The app also helps you free up
    space by removing unwanted files from locations, such as the Trash and cache packages.
    In the same way, it can also display a list of all installed apps and enables
    you to uninstall any of them.


    You can use Stacer to modify some of GNOME 3''s quirks, making desktop icons


    +   - Pros An attractive-looking, intuitive app to monitor several aspects of
    your installation.


    +   - Cons Limited set of monitoring capabilities that can''t go beyond the very
    basic options.


    +   - Great for... Clearing packages caches and controlling services with the
    minimum of fuss.


