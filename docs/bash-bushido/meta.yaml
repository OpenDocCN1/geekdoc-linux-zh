    # Print Process tree


    Because each process (the exception is **init** the first process, nowadays mostly
    systemd, and some kernel-related processes like kthreadd) in Linux have PPID other
    than 0, the processes are in a hierarchy that can be visualized with specific
    directed acyclic graph. This graph is a tree where the root node is an init process.
    The relation between two nodes is based on the PPID of children and the PID of
    the parent. In Linux/Unix, there is a small program called **pstree** that prints
    the process tree. Some of the features of `pstree` include changing the output
    format. The first curious is that'
