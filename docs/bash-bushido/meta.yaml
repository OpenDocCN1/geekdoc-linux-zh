    # Pushd and popd friends of mine


    A short story of everyday console user: You are making changes in one directory,
    then cd to another, then once more to another, then to another. Then you would
    like to go "back" to the previous one. So, you use `cd -`, but then you cannot
    go any further. Your directory "browsing" history is like, well - a single directory.
    What is even more embarrassing is the fact that in most cases it''s enough - maybe
    being a Linux power user is not as hard as most people tend to believe :)?


    Nevertheless, there is nice a solution to this situation, the **popd** and **pushd**
    commands. There is also a third command, one called **dirs**. The **pushd** changes
    directory and pushes it to the directory stack, popd pop the directory from the
    stack and change the directory to the popped value (ofc as long as the stack is
    not empty). The **dirs** command prints the current directory stack. The sample
    usage'
