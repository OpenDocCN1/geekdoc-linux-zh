    I would like to notice that there is also an important difference between putting
    custom bindings into the `.bashrc` and the `.inputrc` files. This difference is
    scope. The bindings from `.bashrc` works only for the Bash shell, when the bididings
    from `.inputrc` are used by **any** programs that use readline library to get
    the user input. These programs are mostly interactive shells like **python**,
    **perl** or **psql**. That is the second reason why I highly recommend putting
    the bindings into the `.bashrc` file.


    # Meta == ESC a useless but interesting thing.


    In the previous chapter, I challenged the reader to find how the **Escape** key
    is encoded.


    ```

    [Alex@SpaceShip BashBushido]$ # ^[ - escape

    [Alex@SpaceShip BashBushido]$ # ^[q - alt+q

    ```


    With the previous `bind ''"\eq":"uptime\n"''`, there is a possibility to invoke
    this binding with the following combination **esc** then **q**. But there a is
    huge distinction between the **alt+q** and the **Esc** then **q** combination.
    Escape will put the `^[` charactrer only once. So, keeping the **Esc+q** pressed
    will write `uptime\n` once, then continue to put the **q** on your command line.
    While **alt+q** will repeatedly write `uptime\n` as long as the keys are pressed.


