  md: '# Network


    In this chapter, we are going to explore network related tools, programs and tricks.
    First off there are tricks related to SSH. It is one of the most popular, heavy-used
    and battle-tested commands/services. Then we have some **netcat** tricks. Netcat
    is sometimes called Swiss Army Knife of Hacking Tools/Network Tools. Then you
    will learn how to scan a network and check the open ports. There are also other
    goodies!


    For a great start - here is one of my favourite XKDC comic:


    ![](bbox=[0.135, 0.358, 0.853, 0.547])


    # SSHFS - SSH File System


    Whenever there is a need to edit files that are on a remote server that has only
    ssh access, the following pattern occurs:


    +   1. Files are copied, locally edited, then copied back.

    2. Files are remotely edited.


    The first one is cumbersome, especially if you are doing live patching (it''s
    an awkward experience that I don''t recommend). The second one is good only if
    the necessary tools are available on the remote server. But what if there is another,
    better, possibility that takes what is best from both worlds?


    Well, it''s possible! You can mount remote files locally with sshfs, that surprisingly
    leverages SSH.


    The first and most important benefit is that you can edit live on a remote server,
    and still use your favourite programs/tools that are on your computer. The second
    benefit of sshfs is that it''s based on SSH File Transfer Protocol that is supported
    on all modern ssh clients and servers. **sshfs** does not require new software,
    permission management and open ports on firewalls. Moreover, SSH is one of the
    most battle-tested and secure protocols, so you can safely use it even on public
    networks.'
  merge: -1
  pgno: 93
- img_proc: false
  md: 'To install `sshfs` on Enterprise Linux systems, you should install `fuse-sshfs`
    package from the EPEL repository:


    ```

    sudo yum install -y epel-release

    ```


    ```

    sudo yum install -y fuse-sshfs

    ```


    FUSE is an abbreviation of Filesystem in Userspace. The `sshfs` is FUSE based,
    so it doesn''t require root privileges to manage mounts. Example `sshfs`:


    ```

    [Alex@SpaceShip ~]$ sshfs Alex@webserver1:/var/www/static /home/Alex/static

    ```


    It will allow editing static content from webserver1 on the local machine. To
    unmount the FUSE-based mount, you can use the well-known:


    ```

    umount /home/Alex/static

    ```


    But it requires root privileges! If your user has sudo capability, you can use
    the `sudo !!` trick. But, the better solution is to use `fusermount` command with
    `-u` like `unmount` flag:


    ```

    [Alex@SpaceShip ~]$ fusermount -u /home/Alex/static

    ```


    It will unmount the previously mounted sshfs.


    I won''t recommend using sshfs as an always mounted production network file system,
    but it''s perfect for small changes, write/reads. The potential problem with SSHFS
    are I/O errors, but they should not corrupt the filesystem ;).


    # Allow others to use our sshfs (and other FUSE based) mount.


    Sometimes, sharing FUSE based resources with other users can save us a lot of
    fuss. To do so, you have to edit `/etc/fuse.conf` (uncomment or add `user_allow_other`
    line. Then pass `allow_other` option to the mount command. There is no service
    that have to be restarted because `/etc/fuse.conf` is read each time the FUSE-based
    resource is mounted.


    Previous example with `sshfs` that makes shared mount:


    ```

    sshfs Alex@webserver1:/var/www/static /mnt/static -o allow_other

    ```


    # SSH with the X server


    Sometimes you want to use a graphical tool from a host that only has the ssh enabled
    (99.9% of prod servers). For example, adding the next disk to a virtual machine
    is much easier from a hypervisor graphical console (ex. VirtualBox). In that case,
    you can easily set up X11 forwarding with ssh. The `-X` option must you use (Yoda
    voice). A system from which you will forward GUI programs needs proper libraries
    installed, but if there are graphical tools, it''s quite likely that it already
    has them.'
  merge: -1
