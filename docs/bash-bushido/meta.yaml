    # histchars – let''s control the history characters :).


    This trick is connected with both Bash history and word designator. There is a
    possibility to change the special characters of history by setting the **histchars**
    env variable. **histchars** is one of this special variable that for unknown reason
    is lowercased.


    The histchars has three characters that are:


    +   1. Event designator (history expansion). ! is default.

    2. Quick substitution, used only if it is the first character on the command line.
    ^ is default.

    3. Comment - It''s crucial to understand that this is a comment for history substitution,
    not the shell parser - to be honest, it''s quite useless I never saw anyone using
    it this way.


    Check these two examples:


    Default characters:


    ```

    [Alex@SpaceShip ~]$ echo "Bash is great"


    Bash is great


    [Alex@SpaceShip ~]$ !!


    echo "Bash is great"


    Bash is great


    [Alex@SpaceShip ~]$ ^Bash^Fish


    echo "Fish is great"


    Fish is great


    [Alex@SpaceShip ~]$ # *This is a comment*

    ```


    Now with histchars set to +=@


    ```

    [Alex@SpaceShip ~]$ histchars="+=@"

    ```'
