  md: "# shell-expand-line\n\n`ctrl + alt + e` is one of my favourite bash shortcuts.\
    \ This function can be used to check if a command is aliased, expand a subshell\
    \ and make a history expansion. There are also other expansions, but they are\
    \ not as popular as this one. You can find them with `bind -P | grep expand`.\n\
    \nExamples:\n\n```\n[Alex@SpaceShip BashBushido]$ mkdir {1,2,3}{a,b,c}\n\n[Alex@SpaceShip\
    \ BashBushido]$ echo $(ls -d 1*) # `ctrl`+`alt`+`e`\n\n# Changes into\n\n[Alex@SpaceShip\
    \ BashBushido]$ echo 1a 1b 1c\n\n[Alex@SpaceShip BashBushido]$ grep # `ctrl`+`alt`+`e`\n\
    \n# Changes into\n\n[Alex@SpaceShip BashBushido]$ grep --color=auto\n\n[Alex@SpaceShip\
    \ BashBushido]$ history | head -3\n\n    1  vim ~/.bashrc\n\n    2  vim ~/.bashrc\n\
    \n    3  bash\n\n[Alex@SpaceShip BashBushido]$ !2 # `ctrl`+`alt`+`e`\n\n# Changes\
    \ into\n\n[Alex@SpaceShip BashBushido]$ vim ~/.bashrc\n```\n\nUnfortunately `shell-expand-line`\
    \ function won't expand globs.\n\n# glob-expansion\n\nBecause `glob` might be\
    \ a new word for some people, here is a minimalistic definition - globs are patterns\
    \ that specify the pathname. I highly recommend reading the `glob(7)` manual page.\
    \ The key biding for `glob-expansion` is `ctrl + x then *`. To understand globs\
    \ let's look at the following"
  merge: -1
