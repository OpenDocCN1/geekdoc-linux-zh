    # Let''s erase our history!


    There are multiple reasons why one would want to delete the history:


    +   - History can be not set properly, so, it is storing sensitive data like "export
    MY_UNIQUE_BANK_PASSWORD=''MAMA_JUST_KILLED_A_MAN''".

    - You just got fired, so, in little exchange you make a little d*** move and delete
    the history. That makes the new admin''s life a little bit harder. (BTW that is
    one from a thousand reasons why you should use automation platforms like Puppet,
    Salt or Ansible. It''s also quite likely that fully a backed up server [like a
    snapshot] can easily recover this file).

    - If you are a little freak, you can set HISTFILE to **/dev/null** and HISTSIZE
    to **0**.'
