  md: "# # Debug bash script!\n\nDebugging is the process of finding the bugs in your\
    \ code (Thanks Captain Obvious). Even if there is no formal definition of a bug\
    \ in a common sense, it's similar to a much more defined defect. The defect is\
    \ a flaw (imperfection) or deficiency in a work product where it does not meet\
    \ requirements and/or specifications.\n\nThe very first thing to do when you get\
    \ an error is actually reading it! In old languages like C or C++ you might get\
    \ ultra-specific errors like \"Core Dump (Segmentation fault)\". In modern languages,\
    \ especially in one that uses some kind of VM or interpreter, you will get something\
    \ called traceback or backtrace. Tracebacks/backtraces print the stack traces\
    \ of the running program. So, you can get the information which function used\
    \ which function and finally which line leads to the error.\n\nUnfortunately,\
    \ this is not the case in the bash shell. Even if bash is also a scripting language,\
    \ or at least a \"sh-compatible command language\" it won't produce meaningful\
    \ tracebacks in the case of an error. So, we have to make them ourself. It can\
    \ be enabled with `set -x` or `set -o xtrace`. This simple tracing prints each\
    \ line before execution. To present it, I decided to provide the following simple\
    \ code.\n\n+   1. `run.sh` script\n\n```\n#!/usr/bin/env bash\n\nfoo(){\n    echo\
    \ -n \"foo\"\n    bar\n}\n\nbar(){\n    echo -n \"bar\"\n}\n\nmain(){\n    . ./lib.sh\n\
    \    check_euid || foo\n    check_euid && bar\n}\n```"
