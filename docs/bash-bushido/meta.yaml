  md: 'changed into readline-understandable \eq. The following table shows the simple
    rules of conversion/translation from one notation to another.


    | Notation | Interpretation |

    | --- | --- |

    | \e | The escape key. Used also for another binding such as special characters
    (for example, F9) or connected with meta key. Meta key on most keyboards is known
    as **alt**. Used when the prefix is ^[ |

