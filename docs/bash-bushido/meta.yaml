    # Modifiers - additional operations on word designator/s


    After optional word designator, we can execute additional operations, getting
    even more control over the command line, these operations are called modifiers.
    Each modifier is prefixed a with : (colons).


    For the last time in this chapter, I am going to quote the bash manual (I hope
    that GNU project won''t sue me) in the form of a table.


    | Modifier | do |

    | --- | --- |

    | h | Remove a trailing file name component, leaving only the |'
  merge: -1
  pgno: 56
- img_proc: false
  md: '| t | Remove all leading file name components, leaving the tail. |

    | r | Remove a trailing suffix of the form .xxx, leaving the basename. |

    | e | Remove all but the trailing suffix. |

    | p | Print the new command but do not execute it. |

    | q | Quote the substituted words, escaping further substitutions. |

    | x | Quote the substituted words as with q, but break into words at blanks and
    newlines. |

    | s/old/new/ | Substitute new for the first occurrence of old in the event line.
    Any delimiter can be used in place of /. The final delimiter is optional if it
    is the last character of the event line. The delimiter may be quoted in old and
    new with a single backslash. If & appears in new, it is replaced by old. A single
    backslash will quote the &. If old is null, it is set to the last old substituted,
    or, if no previous history substitutions took place, the last string in a !?string[?]
    search. |

    | & | Repeat the previous substitution. |

    | g | Cause changes to be applied over the entire event line. This is used in
    conjunction with '':s'' (e.g., '':gs/old/new/'') or ''&''. If used with '':s'',
    any delimiter can be used in place of /, and the final delimiter is optional if
    it is the last character of the event line. And may be used as a synonym for g.
    |

    | G | Apply the following ''s'' modifier once to each word in the event line.
    |


    Yeah, that a lot! When you think about it `s` is a substitution, and the rest
    (&gGqx) of them are controls how this substitution is going to behave. Finally,
    you can imagine the event designator as following structure:


    ```

    ![number,string or !][:word_designator][:modifier_1][:modifier2]...

    ```


    Modifier can be repeated multiple times. To get different set of words from the
    word designator you have to write a new event designator.


    After this horrible theory, let''s look at some examples:


    ```

    [Alex@SpaceShip ~]$ echo aaa bbb /a/b/c/aaa.txt

    ```


    ```

    aaa bbb /a/b/c/aaa.txt

    ```


    ```

    [Alex@SpaceShip ~]$ !!:s/aaa/bbb # substitutes aaa with bbb once

    ```


    ```

    echo bbb bbb /a/b/c/aaa.txt

    ```


    ```

    bbb bbb /a/b/c/aaa.txt

    ```'
