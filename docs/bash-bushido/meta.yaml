    # # My favourite Git aliases


    Git is the most successful/popular version control system (VCS) currently used.
    The original author is The Great Linus Torvalds himself. Git is another excellent
    project made by/for the Linux community that spread like cancer the best open
    source software. There is plenty of great, free, sources on Git. If you are unfamiliar
    with this best in the class version control system, you might look at the official
    free book Pro Git. I bow down to the Authors of this excellent publication.


