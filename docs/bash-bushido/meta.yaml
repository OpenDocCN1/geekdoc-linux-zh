    You can get your IP address with a simple `curl ifconfig.co`. Because I prefer
    getting more information in an easy-to-manipulate accessible format, the `curl
    ifconfig.co/json` suits me better. JSON can be nicely formatted with `python -m
    json.tool` or `jq`. Finally, the command that I use is `curl -s ifconfig.co/json
    | jq`. The `-s` flag makes the curl silent (no progress info). The whole command
    can be saved as more a accessible alias, for example - `my_ip`.


    # Audible ping


    The `-a` flag makes the `ping` command audible. Note that `ping` uses a system
    beep. So, it must be enabled. The simplest test whether beep works is:


    ```

    echo -e "\a"

    ```


    If you heard the beep sound it means that the audible ping would work on your
    hardware && software configuration.


    Finally - example of an audible ping:


    ```

    ping -a 8.8.8.8

    ```


