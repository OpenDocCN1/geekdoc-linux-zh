  md: '!**?**string**?** substitutes the most recent command that **contains** a **string**.
    Note that which command is the most recent depends on your position in the history.
    As said before you can always get to the end of history with empty command line
    or with **ctrl + >**.


    The usage of !string!? is presented by the following example:


    ```

    [Alex@SpaceShip ~]$ echo Mamma mia

    Mamma mia

    [Alex@SpaceShip ~]$ echo ", here I go again"

    , here I go again

    [Alex@SpaceShip ~]$ !?mia?

    echo Mamma mia

    Mamma mia

    [Alex@SpaceShip ~]$ !?go

    echo ", here I go again"

    , here I go again

    ```


    Note that you can omit the second **?** if there are no additional arguments.
    To get what it means, look at the example below:


    ```

    Alex@Normandy$ echo mama mia


    mama mia


    Alex@Normandy$ !?mama? here I go again

    echo mama mia here I go again


    mama mia here I go again


    Alex@Normandy$ !?mama there are some additional args


    bash: !?mama there are some additional args: event not found

    ```


    # Word Designator


    Another huge thing in Bash is the word designator. Once more I decided to cite
    the part of the Bash manual.


    > **Word designators are used to select desired words from the event. A : separates
    the event specification from the word designator. It may be omitted if the word
    designator begins with a ^, $, *, -, or %. Words are numbered from the beginning
    of the line, with the first word being denoted by 0 (zero). Words are inserted
    into the current line separated by single spaces.**


    Of ceruse, the word designator is optional, but the quite exciting thing is the
    fact that it is also optional when we are using modifiers (we will talk about
    them later). Before showing some samples, I would like to once more quote part
    of the bash documentation - this time in a tabular form.


    | Designator | Function |

    | --- | --- |'
  merge: -1
  pgno: 54
- img_proc: false
  md: '| Designator | Description |

    |---|---|

    | `0` (zero) | The zeroth word. For the shell, this is the command word. |

    | `n` | The nth word. |

    | `^` | The first argument. That is, word 1. |

    | `$` | The last argument. |

    | `x-y` | A range of words; **-y** abbreviates **0-y**. |

    | `*` | All of the words but the zeroth. This is a synonym for **1-$**. It is
    not an error to use * if there is just one word in the event; the empty string
    is returned in that case. |

    | `x*` | Abbreviates x-$. |

    | `x-` | Abbreviates x-$ like x*, but omits the last word. |

    | `%` | The word matched by the most recent **?string?** search. |


    If a word designator is used without an event number, the last event is used.


    The word designator usages are presented with the following examples:


    ```

    [Alex@SpaceShip ~]$ echo use printf `use echo\n`

    ```


    ```

    use printf use echo\n

    ```


    ```

    [Alex@SpaceShip ~]$ !!:2* # You can also use !:2*

    ```


    ```

    printf `use echo\n`

    ```


    ```

    use echo

    ```


    We can put together arguments from multiple events (commands from the history).


    ```

    [Alex@SpaceShip ~]$ echo I love rock \''\n\'' roll

    ```


    ```

    I love rock ''\n'' roll

    ```


    ```

    [Alex@SpaceShip ~]$ echo I love rock \''\n\'' roll

    ```


    ```

    I love rock ''\n'' roll

    ```'
