  md: '# Event designator, word designator, modifiers.


    This chapter is dedicated to some advanced Bash features. Because the presented
    material might be somehow overwhelming, the last subchapter contains the most
    frequent commands.


    # What does ! mean in Bash?


    ! is a special character for the Bash shell. It''s a mighty Event Designator.
    The Bash manual explains it as:


    ```

    An event designator is a reference to a command line entry in the history list.  Unless
    the reference is absolute, events are relative to the current position in the
    history list.

    ```


    So easily speaking, ! allow us to reuse the previous commands (stored in the history).


    # sudo + !! = fRriends 4 EVEER!!!1


    The most common usage of ! (in many cases without knowing what it is) is invoking
    it with a second !. !! is a special shortcut that says invoke the last command
    as it was. It''s most frequently used with a privilege escalation via sudo. Look
    at the following example.


    ```

    [Alex@SpaceShip ~]$ cat /etc/gshadow | head -1


    cat: /etc/gshadow: Permission denied


    [Alex@SpaceShip ~]$ sudo !!


    sudo cat /etc/gshadow | head -1


    root:::


    [Alex@SpaceShip ~]$

    ```


    As said before, this is the most popular event designator usage and one that you
    can find in nearly every Bash course.'
  merge: -1
  pgno: 51
- img_proc: false
  md: "# Invoking a command by number in the history.\n\nSometimes, it's easier to\
    \ list a subset of commands than to search it interactively. Then you can leverage\
    \ an event designator by invoking it with `![NUMBER]`. Look at the following example:\n\
    \n```\n[Alex@SpaceShip ~]$ history | grep grep\n\n  1  grep -v bash /etc/passwd\
    \ | grep -v nologin\n\n  2  grep -n root /etc/passwd\n\n101  grep -c false /etc/passwd\n\
    \n202  grep -i ps ~/.bash* | grep -v history\n\n404  grep nologin /etc/passwd\n\
    \n501  history | grep grep\n\n[Alex@SpaceShip ~]$ !404\n\n# Will invoke `grep\
    \ nologin /etc/passwd`\n```\n\nThere is also another trick with negative numbers.\
    \ In multiple programming languages, the negative indexes mean that we are counting\
    \ indexes from the end instead of from the start. For example, `-1` means the\
    \ last element on a list and `-3` means the third element from the end. The same\
    \ rule goes with invoking the event designator. Look at the following example:\n\
    \n```\n[Alex@SpaceShip ~]$ echo In Musk We Trust\n\nIn Musk We Trust\n\n[Alex@SpaceShip\
    \ ~]$ echo Mars\n\nMars\n\n[Alex@SpaceShip ~]$ echo Earth\n\nEarth\n\n[Alex@SpaceShip\
    \ ~]$ !-2\n\necho Mars\n```"
