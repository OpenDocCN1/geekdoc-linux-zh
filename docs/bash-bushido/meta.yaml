    # # Customizing the TOP


    Before making the customization, I strongly recommend making the top symlink and
    then invoking `top` by it.


    ```

    $ sudo ln -s /usr/bin/top /usr/bin/my_top

    ```


    ```

    $ my_top

    ```


    Now, the first line of the top will start with `my_top` -. This is a feature based
    on the fact that the top, as any program invoked in the Linux, knows its name.
    The top uses this information to give you the ability to make and maintain multiple
    configurations.


    The first practical thing that I recommend is to change the memory units. The
    `top` in opposite to htop doesn''t have intelligent unit scaling, it''s static
    and uses KiB that are too small to get clean information on most systems. Two
    keys are responsible for memory scaling - `e` and `E`. First, use `E` to scale
    what unit is used to display memory in summary area. Then use `e` to change how
    the memory is shown in the task area. I personally scale to megabytes or gigabytes
    (I have never managed a server that had more than 1024 GB of RAM [and I''m not
    ashamed of it!]).


    Now we can commit our first changes. To save the current top settings, use `w`
    key. Depending on procps-ng version the top rcfile will be placed in `${HOME}/.${NAME}rc`
    or `${HOME}/.config/procps/.${NAME}rc` in the newer version. In the newer version
    the legacy path (`~/.toprc`) is read first, then the one from `XDG_CONFIG_HOME`
    variable (by default set to `~/.config`, XDG_* variables are one defined by X
    Desktop Group) is used.


    The next important setting that I change updates the update interval (time between
    refreshing the statistics). The default value is 3 seconds. Delay value can be
    set with `d` like `delay` or `s` like `seconds` to the requested amount. The value
    that I personally prefer is 5 seconds. But there is a possibility to use absurd
    values from nearly zero like `0.00001` (the real-time between refreshing will
    depend on the host performance; the top will consume 100% [one] CPU) to more than
    31536000 (exactly one year). The highest value that I can get is 2147483520.0
    (when you add a small number to it the top will still use 2147483520.0, and in
    case of using more than 2147483583 the `top` will report **Unacceptable floating
    point**.). But I believe that it depends on the version, architecture and so on
    :). BTW 2147483520.0 is over 68 years, so probably more than I will live :).


    In the field management interactive menu, that is bound to the `f` key, you can
    choose which fields are displayed. Choose a field with up/down arrow, enable them
    with `space`, and move them with the right arrow, then up/down and left to put
    in the desired place with the left arrow. To choose the default sort field use
    the `s` key. BTW: The default sort field doesn''t have to be enabled! In field
    management mode, you can also set the other windows that are available in `Alt-`display**
    (alternative display mode, with four different windows). To change the currently
    edited window use the `w` key. The window that is used in the default mode is
    named `1:Def` like DEFault :).'
