    # Scan ports with Nmap


    Nmap is a security scanner that allows finding open ports on the host, it has
    lots of specially crafted packages, that helps to determine not only ports, services
    but sometimes service flavour (vendor and version) or even host OS. In most countries,
    although no law explicitly forbids port scanning, doing it without permission
    can be detected as a potential attack and drag you into legal hell. It''s because
    port scanning is used/might be used as one of the first phases of a cyber-attack.


    Before performing a network scan, you should get a written consent that allows
    you to do it. There is an excellent article on nmap.org - <https://nmap.org/book/legal-issues.html>
    that gives a real-life example of what can potentially happen.


    Nevertheless, after being warned, the nmap is frequently used by users to scan
    their own networks. It''s so popular that most distributions have it in their
    repo. Installing it on EL7 is as simple as:


    ```

    sudo yum install -y nmap

    ```


    Now you can start scanning your network :). I personally use it to determine open
    ports on hosts that are "forgotten" and find IP addresses of printers.


    To scan for TCP open ports, use:


    ```

    nmap -sT HOST

    ```


    To scan for UPD open ports, use:


    ```

    nmap -sU HOST

    ```


    To enable OS detection, use:


    ```

    nmap -O --osscan-guess HOST

    ```


    The most commonly used options is **-A** (like all) with **-T4**. The **-T** option
    sets the timing, there is a possibility to also use names. The values are from
    0 to 5, or from paranoid (0) to insane (5). The 4 is also called aggressive. **-A**
    options enable things like OS detection, version detection, scripts scanning and
    traceroute. As always more can be found in the nmap manual.


    ```

    nmap -A -T4 HOST

    ```


    To scan a whole network (local network in your workplace) just choose whichever
    IP and add a mask (nmap will automatically convert it to a network).


    ```

