  md: '# Cool-retro-term.


    There is a group of projects that I sometimes call "uncle projects" or "uncle
    software". I really like being an uncle, especially at family gatherings, when
    you can babysit the baby for a short time, but when you get tired of it, you just
    give him/her back to the parents. The "uncle software" is the same, it''s nice
    to play with it for a bit, but after a little while, you can just forget about
    it. Of course, these words and terms were forged by a single that will die alone.


    You can install the **cool-retro-term** from nux repos (https://li.nux.ro/). Or
    compile it from the source. When compiling it from the source on an Enterprise
    Linux system, you should change qmltermwidget version. The following script worked
    for me:


    ```

    #!/bin/bash


    CRT_URL=https://github.com/Swordfish90/cool-retro-term/archive/1.0.1.tar.gz


    WIDGET_URL=https://github.com/Swordfish90/qmltermwidget/archive/v0.1.0.tar.gz


    sudo yum -y install qt5-qtbase qt5-qtbase-devel qt5-qtdeclarative qt5-qtdeclarative-devel
    qt5-qtgraphicaleffects qt5-qtquickcontrols redhat-rpm-config


    wget "$CRT_URL" -O cool-retro-term.tar.gz


    mkdir cool-retro-term && tar xvf cool-retro-term.tar.gz -C cool-retro-term --strip-components
    1


    cd cool-retro-term


    rm -rf qmltermwidget


    wget "$WIDGET_URL" -O qmltermwidget.tar.gz


    mkdir qmltermwidget && tar xvf qmltermwidget.tar.gz -C qmltermwidget --strip-components
    1


    qmake-qt5


    make


    sudo make install STRIP=true

    ```


