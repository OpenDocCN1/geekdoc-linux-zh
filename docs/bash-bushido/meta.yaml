    # Generate random passwords with OpenSSL


    Generating a random password is quite easy - use a good random number generator
    (that part is hard!), then create a password. There is specialized program called
    **pwgen** that generate random passwords, but I prefer a more straightforward
    solution with that leverage standard **openssl1**.


    ```

    openssl rand -base64 $NUMBER

    ```


    Where **$NUMBER** is the number of random bytes. Note that Base64 encoding breaks
    data into 6-bit segments, and SSL returns the 8-bit characters. Other rules can
    make the string a little bit longer. Finally, the password will be about one and
    one-third of the original number. Because Base 64 uses lowercase, uppercase, digits
    and special characters +, / and = that is also used as a pad. Pad is used when
    the last part (called segment) doesn''t contain all 6 bits.


    # lsof


    lsof is an abbreviation of **L**ist **O**pen **F**iles. This little program is
    frequently used when you want to know which process has an open descriptor to
    file. It''s handy when unmounting USB drives, other filesystems, or finding deleted
    files that take space even though they are deleted (Linux doesn''t free the space
    taken by a file as long as there is an open file descriptor to it). To list processes
    that have an open files in the filesystem, use:


    ```

    lsof /mount/point

    # I have a separate filesystem on home

    lsof /home

    ```


    To list processes that use the chosen file, for example, /dev/urandom - the kernel''s
    random number generator, use:


    ```

    lsof /dev/urandom

    ```


    To list files opened by the selected user, you can add `-u` option with the username:


    ```

    lsof -u Alex

    ```


