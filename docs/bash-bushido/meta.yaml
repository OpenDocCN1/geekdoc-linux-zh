    # Mailing from a script\n\nSMTP is a simple protocol, so simple that it's broken\
    \ in multiple places. It's regularly exploited by spammers. Wrongly configured\
    \ mail server can allow getting mail from any (even unauthorized) domain. SMTP\
    \ doesn't require an authorization, but the e-mail will likely land in the spam\
