  md: "# Making your own command line shortcut\n\nAs you know from the previous chapters,\
    \ the library responsible for binding shortcuts is GNU Readline. This excellent\
    \ library allows us to make our own shortcuts with the **bind** command.\n\nHowever,\
    \ before you bind the key to a custom command, you should know the real key code\
    \ that is sent to the terminal. In the case of `ctrl-v` the codes are obvious,\
    \ but what about special keys? For example the **F9** key is encoded as `^[[20~`.\
    \ How do I know that? I used the following combination: `ctrl-v`, then `F9`. To\
    \ get information about what function is bound to `ctrl + v`, invoke:\n\n```\n\
    [Alex@SpaceShip ~]$ bind -P | grep '\\C-v'\n```\n\n```\ndisplay-shell-version\
    \ can be found on \"\\C-x\\C-v\".\n```\n\n```\nquoted-insert can be found on \"\
    \\C-q\", \"\\C-v\", \"\\e[2~\".\n```\n\nFrom the following output, it's obvious\
    \ that `ctrl+v` invokes quoted-insert. Quoted-insert is the mode in which the\
    \ next key combination is displayed in verbatim (key code).\n\nAfter this short\
    \ off topic, you can make your own shortcut. In the following example, we bind\
    \ the **F9** key with the **date** command.\n\n```\n[Alex@SpaceShip BashBushido]$\
    \ # ^[[20~ - F9 found in quoted mode\n```\n\n```\n[Alex@SpaceShip BashBushido]$\
    \ bind '\"\\e[20~\":\"date\\n\"'\n```\n\n```\n[Alex@SpaceShip BashBushido]$ date\
    \ # F9\n```\n\n```\nSun Sep 23 13:43:21 CEST 2018\n```\n\nThe **bind** command\
    \ has the following format `bind '\"Key/s-code/s\":\"string that will be inserted\"\
    '`. Note that there is `\\n` after `date`, so **date** the command is instantly\
    \ executed. Another thing that is worth mentioning (we will discuss it later)\
    \ is that there is a \"translation\" from `^[` to `\\e`.\n\nAnother example will\
    \ be **ctrl + q** bound to **date** and **whoami** commands. Some readers might\
    \ notice that by default **ctrl + q** it redundantly bound to **quoted-insert**.\n\
    \n```\n[Alex@SpaceShip BashBushido]$ # ^Q - ctrl-q found in quoted-insert\n[Alex@SpaceShip\
    \ BashBushido]$ bind '\"\\C-q\":\"whoami\\n\"' # ctrl-q\n[Alex@SpaceShip BashBushido]$\
    \ whoami\nAlex\n```\n\n*The exercise for reader* - does using `C-Q` instead of\
    \ `C-q` change anything? Note that currently our bindings are not persistent,\
    \ so to \"unbind\" just start the new terminal/session.\n\nThe next example is\
    \ **alt+q** that will be bound to the **uptime** command.\n\n```\n[Alex@SpaceShip\
    \ BashBushido]$ # ^[q - alt-q found in quoted insert\n[Alex@SpaceShip BashBushido]$\
    \ bind '\"\\eq\":\"uptime\\n\"'\n[Alex@SpaceShip BashBushido]$ uptime # alt-q\n\
    \ 14:00:52 up  1:38,  4 users,  load average: 0.08, 0.07, 0.21\n```"
  merge: -1
