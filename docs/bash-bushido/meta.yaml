  md: "```\n# PROMPT_COMMAND was introduced in previous chapter\nexport PROMPT_COMMAND=\"\
    history -a; history -c; history -r; $PROMPT_COMMAND\"\n```\n\nHistory append lines\
    \ from current session to history file, then clear it then read it.\n\nIf you\
    \ can't read an important command that was just invoked in another session (terminal),\
    \ just hit enter with an empty command line. It triggers the PROMPT_COMMAND execution,\
    \ so that the history resyncs.\n\nThe best thing about this solution is also the\
    \ worst. Imagine that you have separate sessions where you are using quite similar\
    \ commands. The \"collision\" with commands from other terminals might be dreadful.\
    \ Still, it's one of my favourite bash tricks.\n\n# History with date and time.\n\
    \nBash has another variable called HISTTIMEFORMAT. This variable is responsible\
    \ for the format in which time that the command execution happened is saved/presented.\
    \ To start fun with the timed history, set it to something meaningful, then export\
    \ it.\n\n```\nexport HISTTIMEFORMAT=\"%Y-%m-%d %T \"\n```\n\nPlease note that\
    \ there is a space after %T. Without it, the commands blend with time. Another\
    \ thing that is worth noting is that the old history entries (not presented in\
    \ the current session) are timestamped to the moment when the current session\
    \ started.\n\nLook at following example:\n\n```\n[root@localhost ~]# su - test_user\n\
    Last login: Sun Oct  7 18:32:02 UTC 2018 on pts/0\n[test_user@localhost ~]$ export\
    \ HISTTIMEFORMAT=\"%Y-%m-%d %T \"\n[test_user@localhost ~]$ echo 'export HISTTIMEFORMAT=\"\
    %Y-%m-%d %T \"' >> .bashrc\n[test_user@localhost ~]$ history\n    1  2018-10-07\
    \ 18:32:21 echo \"this is test\"\n    2  2018-10-07 18:32:21 echo \"This commands\
    \ are from previous session/s\"\n    3  2018-10-07 18:32:34 export HISTTIMEFORMAT=\"\
    %Y-%m-%d %T \"\n    4  2018-10-07 18:32:41 echo 'export HISTTIMEFORMAT=\"%Y-%m-%d\
    \ %T \"' >> .bashrc\n    5  2018-10-07 18:32:45 history\n[test_user@localhost\
