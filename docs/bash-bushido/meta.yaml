    # Preface


    I had the pleasure to write technical blog posts as part of EuroLinux''s marketing
    strategy. That is when I found out that our subscribers and visitors love shorter
    forms with lots of titbits. After some practice, I started to produce quite clickable
    and (what is even more important) readable articles.


    Inspired by the Command Line Kung-Fu book, I decided to write a Bash Bushido -
    a series of articles about Bash. To be honest, we planned that after 2 or 3 articles,
    the series will end. However, as it was quite successful and there was rich material
    to explore, we kept going. Unfortunately for international audiences, the series
    was written in Polish. If you are still interested, you can find all the articles
    on EuroLinux blog https://pl.euro-linux.com.


    Then, one of my friends asked me if I could make a video course with him and publish
    it on some popular e-learning platforms. I decided to make the pilot project "Bash
    Bushido Video Course". After some time, many mistakes, and awful videos, we realized
    that making a video course without a good script is a horrible idea. The book
    that you are reading was initially made for the video course :) and ended up as
    a standalone creation. If this book gains some popularity (at least 1000 sold
    copies in the first year ;), I will make the said video course. Otherwise, it''s
    probably not worth the only resource that I don''t have a surplus of - time.


    I would like to stress that some chapters have a lot of my personal **opinions**.
    Don''t treat them as a source of absolute truth. For example, the first thing
    that I wrote about is touch-typing, that by far (**typical opinion**) is one of
    the most important skills for any proficient computer user. I tried to put some
    humour in this book some of which is sarcastic and might offended you. If you
    are offended don''t worry - this is natural and should not interfere with your
    life functions. In the case of emergency, you can delete, burn or depending on
    the buying platform even return the book (please don''t, I need the monies).'
