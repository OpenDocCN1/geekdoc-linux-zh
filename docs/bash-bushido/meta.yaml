- img_proc: false
  md: '![](bbox=[0.04, 0.02, 0.96, 0.36])


    The program is self-explanatory, there is small help section that you can read,
    but it is as minimalistic as the program itself. For touch typing newcomers, I
    endorse the T series, as it''s easier than the Q series. It introduces each key
    slowly and has extensive exercise patterns, that helps to build the foundation
    for touch typing.


    When it comes to practice time, multiple studies about learning proved that **daily**
    short practice sessions are way more effective than long sessions that are not
    regular. Another important consideration is how to replace the old routine. If
    you learn how to type a letter correctly, always do it the right way. It''s crucial
    to replace the old typing habits with the new ones. Because learning takes time
    at first, you might type slower, but after some time, your speed will increase
    dramatically.


    The default gtypist color scheme might be unreadable on some terminal emulators
    and color scheme combinations. Luckily, you can experiment and change it.


    +   - `-c` or `--colors` - set the main colors of the program.

    - `--banner-colors` - allows setting up all colors used by gtypist. You can choose
    colors from numbers 0-7, what gives us 64 combinations for foreground and background
    colors.


    Sample gtypist invocation with changed color schemes:


    ```

    gtypist -c=0,2

    gtypist --banner-colors=0,2,3,2

    ```


    The `typefortune` is a neat gtypist utility that uses `fortune` command output
    and invokes gtypist on it. Because `typefortune` is written in Perl it requires
    working interpreter.'
