    To list the TCP connection, use `-t` option


    ```

    Alex@Normandy$ ss -t

    State       Recv-Q Send-Q      Local Address:Port      Peer Address:Port

    ESTAB       0       0           192.168.0.12:40630      94.23.88.39:https

