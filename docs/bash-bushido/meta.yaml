  md: "# Reset your terminal\n\nSometimes after reading a binary file, your console\
    \ or Bash might get devastated. Some characters will be missing, others will be\
    \ printed in an unpredictable manner, etc. To get your session back on tracks,\
    \ use a simple **reset**. According to The Internet \"it's not a miracle solution\"\
    , but it never failed me. The funny thing is that **reset** is a symbolic link\
    \ to the `tset` program. But invoking `tset` without any argument won't reset\
    \ terminal. So, logical conclusion is that tset must check if it's started/invoked\
    \ as a **reset** command.\n\nAfter checking sources of ncurses 5.9 (used in Enterprise\
    \ Linux 7), there is this part of code in file `/progs/tset.c`.\n\n```\n// flag\n\
    \nstatic bool isreset = FALSE;     /* invoked as reset */\n\n// More code\n\n\
    // in int main you can find following\n\n  if (same_program(_nc_progname, PROG_RESET))\
    \ {\n\n    isreset = TRUE;\n\n    reset_mode();\n\n  }\n```\n\n# Resolve symbolic\
    \ links\n\nSometimes you might want to get the real (physical) path that you are\
    \ currently on. Unfortunately there is no option that will enable automatic symbolic\
    \ links resolving in the Bash shell. As symbolic links are convenient, sometimes,\
    \ they might be misleading, for example, a symbolic link that leads from one filesystem\
    \ to another. It's also possible to make a symbolic link loop, that makes the\
    \ current working directory unnecessarily long, it also trivial to make the \"\
    loop\" of symbolic links. Look at the following self-contain example.\n\n```\n\
    [Alex@Normandy tmp]$ mkdir  -p d1/d2/d3\n[Alex@Normandy tmp]$ cd d1\n[Alex@Normandy\
    \ d1]$ ln -s d2/d3 13\n[Alex@Normandy d1]$ cd d2/d3\n[Alex@Normandy d3]$ ln -s\
    \ .. 12\n[Alex@Normandy d3]$ cd ../..\n[Alex@Normandy d1]$ cd 13/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/\n\
    [Alex@Normandy 12]$ pwd\n/home/Alex/Documents/BashBushido/tmp/d1/13/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3/12/d3\n\
    [Alex@Normandy 12]$ pwd -P\n/home/Alex/Documents/BashBushido/tmp/d1/d2\n```"
  merge: -1
  pgno: 147
- img_proc: false
  md: "In this example, there is a trivial loop \"l2->d3->l2->d3... \". Going back\
    \ to the **d1** directory requires \"unwarping\" the loop. To make Bash resolve\
    \ the symbolic links, the **PROMPT_COMMAND** introduced in ## Executing the chosen\
    \ commands before the prompt might be used.\n\n`export PROMPT_COMMAND='[ \"$(pwd)\"\
    \ == \"$(pwd -P)\" ] || cd \"$(pwd -P)\"' .`\n\nThis short code checks if the\
    \ output of `pwd` and \"-p\"physical **`pwd`** is the same, and if not ('||' -\
    \ Bash OR operator) changes the directory to the physical one. Note that the command\
    \ is put in ' ' so it won't expand when exporting the PROMPT_COMMAND variable.\n\
    \nAfter exporting, `cd` into the same loop will result in:\n\n```\n[Alex@Normandy\
    \ d1]$ cd l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/\n[Alex@Normandy d2]$ pwd\n/home/Alex/Documents/BashBushido/tmp/d1/d2\n\
    ```\n\nThere is also the second **easier** solution! You can alias the `cd` to\
    \ `cd -P`. The **-P** option lets you \"use the physical directory structure without\
    \ following symbolic links\".\n\n```\n[Alex@Normandy d2]$ export PROMPT_COMMAND=''\n\
    [Alex@Normandy d1]$ cd -P l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/\n[Alex@Normandy\
    \ d2]$ pwd\n/home/Alex/Documents/BashBushido/tmp/d1/d2\n[Alex@Normandy d2]$ cd\
    \ ..\n[Alex@Normandy d1]$ cd  l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/\n[Alex@Normandy\
    \ l2]$ pwd\n/home/Alex/Documents/BashBushido/tmp/d1/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3\n\
    [Alex@Normandy d1]$ alias cd='cd -P'\n[Alex@Normandy d1]$ cd l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/d3/l2/\n\
    [Alex@Normandy d2]$\n```\n\nUnfortunately there is no such option for **pushd**.\n\
    \n# batch\n\nBatch is a little program similar to the previously introduced `at`.\
    \ Batch executes a command when the system load is below a specific value. This\
    \ value is set at the compilation, and in the most system, it's **0.8**. To change\
    \ this value, you have to set the default value at which `atd` (AT Daemon) starts.\
    \ In Enterprise Linux Distributions the `/etc/sysconfig/atd` is read by `atd`\
    \ daemon. With proper options set in the **OPTS** variable, you can get the desired\
    \ effect. For example **OPTS**=\"-l 3.2\" that sets the load average for the **batch**\
    \ to 3.2.\n\nBatch is used in a similar way as `at`, of course the time is skipped.\n\
    \n```\n[root@Normandy ~]# uptime\n 00:59:39 up 4 days, 10:03, 11 users,  load\
    \ average: 0.80, 0.87, 0.82\n[root@Normandy ~]# batch\nat> date >> /etc/created_by_batch\n\
    at> uptime >> /etc/created_by_batch\nat> <EOT>\njob 9 at Fri Jun 21 00:59:00 2019\n\
    [root@Normandy ~]# atq\n9  Fri Jun 21 00:59:00 2019 b root\n[root@Normandy ~]#\
    \ cat /etc/created_by_batch\ncat: /etc/created_by_batch: No such file or directory\n\
    ```\n\nAfter some time, when the load average drops below 0.8, the script was\
    \ executed."
