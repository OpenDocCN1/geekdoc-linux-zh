  md: '# Add SSH host key to .ssh/known_host if they don''t exist


    One of the problems that you may encounter during scripting is that the host key
    is not in the ~/.ssh/known_hosts file. In that case, scripts that are not interactive
    won''t work. But there is a small utility called ssh-keyscan that can be used
    to get the ssh keys provided by the host. For the previously mentioned problem,
    look at the following solution:


    ```

    TO_HOST=this.is.my.host.com

    ```


    ```

    [ $(grep -cim1 "$TO_HOST" ~/.ssh/known_hosts) -gt 0 ] || ssh-keyscan "$TO_HOST"
    | tee -a ~/.ssh/known_hosts

    ```


    ```

    # Now the ssh commands can be invoked.

    ```


    `-cim1` means `--count --ignore-case` and `--max-count=1`, so it returns 1 or
    0. If the test that is in [ ] fails, then the second part that leverages ssh-keyscan
    with a tee in append (-a) mode runs.


    # Instant directory content sharing with Python.


    Sometimes you have to share files with random people. One of the most straightforward
    solutions is to share the content of a directory on a web server. To achieve this,
    we can invoke the standard Python module. It''s like having a minimalistic web
    server that serves static content, always with you :)!


    For Python2, use:


    ```

    python2 -m SimpleHTTPServer

    ```


    For Python3, use:


    ```

    python3 -m http.server

    ```


    Because Python 2 will hit EOL soon, I recommend using Python 3. You can also change
    the port on which our webserver will listen (default 8000):


    ```

    python2 -m SimpleHTTPServer 8080 # port 8080 on 0.0.0.0

    ```


    ```

    python3 -m http.server 8080 # port 8080 on 0.0.0.0

    ```


    Of course - 0.0.0.0 means all interfaces.


    In Python 3, we can also choose on which interface our server should listen.


    ```

    python3 -m http.server 8080 -b 10.10.1.123 # port 8080 on 10.10.1.123

    ```


    There might be small complications:


    +   - If you want to use a standard port like 80, you need to have root privileges,
    not privileged users can use ports that are higher than 1024. In that case, ports
    like 8080 are not formally standardized but frequently used.'
