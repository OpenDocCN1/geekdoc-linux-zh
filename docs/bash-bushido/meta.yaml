    # # Getting PID of the current Bash shell.


    PID is a process identifier - the unique number that process has in the operating
    system. But what is actually surprising is that not all IT people know that there
    is also PPID that states the Parent PID. It''s one of the questions that I really
    like to ask during job interviews. The next one is a follow-up question about
    PPID of init system.


    To get the current Bash PID, you can use a particular Bash variable `$$`. The
    **nearly** same variable is `$BASHPID`.


    ```

    [Alex@SpaceShip BashBushido]$ echo $$

    26571

    [Alex@SpaceShip BashBushido]$ echo $BASHPID

    26571

    ```


    Yields the same outcome. The difference between `$BASHPID` and `$$` can be presented
    with the following example.


    ```

    [Alex@SpaceShip BashBushido]$ echo $$


    26571


    [Alex@SpaceShip BashBushido]$ echo $(echo $$)


    26571


    [Alex@SpaceShip BashBushido]$ echo $BASHPID


    26571


    [Alex@SpaceShip BashBushido]$ echo $(echo $BASHPID)


    10779


    [Alex@SpaceShip BashBushido]$ echo $(echo $BASHPID)


    10782

    ```


    The `$BASHPID` has a different value in subshells.


    I personally like to use `$$` to make temporary files and directories. It''s useful
    for debugging running bash scripts and creating simple, unique files (note that
    using `mktemp` with proper options is actually a better solution).'
