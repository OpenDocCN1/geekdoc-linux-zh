    # ss - another utility to investigate sockets


    ss is a utility to get information about the sockets. It''s really similar to
    netstat, but it''s newer and much faster. Still, not all netstat functionalities
    are fully implemented in ss, some of the old netstat commands are represented
    in ip command.


    To list all connections in your system you might use ss without any parameter


    ```

    Alex@Normandy$ ss

    Netid  State      Recv-Q Send-Q      Local Address:Port    Peer Address:Port

    u_str  ESTAB      0      0           /run/systemd/journal/stdout 645671 * 642860

    u_str  ESTAB      0      0           * 89062                 * 93582

    u_str  ESTAB      0      0           /run/dbus/system_bus_socket 79026 *

    ```'
