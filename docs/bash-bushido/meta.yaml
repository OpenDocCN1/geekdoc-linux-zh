    The first application of ncat is to determine if a specific port is open (it''s
    one of the first things to check when a service doesn''t work as expected). Usually,
    NMap is better suited for this job, but ncat package is about 40 times smaller,
    and nc is loved because of its minimalistic nature. Another usage of netcat is
    sending commands, files or payload. The payload is a technical term that can mean
    the actually delivered message (when you send the message to a server, there is
    a lot of metadata - like hops, source, destination, that are necessary to deliver
    a package through a network), the second meaning is the harmful code that is delivered
    by an exploit. Payload term is frequently used by pentesters.


    Some "payload" payload.txt (HTTP request) to sample Heroku application.


    ```

    GET / HTTP/1.0

    Host: example.herokuapp.com

    ```


    Because RFC 2616 (Hypertext Transfer Protocol – HTTP/1.1) defines that linebreak
    is of CRLF type (more information about this problem can be found at [dos2unix
    unix2dos](#) then before piping the HTTP request that is written in the file,
    the unix2dos should be used.


    ```

    $ unix2dos payload.txt

    ```


    After this operation cat piped to netcat works like a charm.


    ```

    cat payload.txt | nc example.herokuapp.com 80

    ```


