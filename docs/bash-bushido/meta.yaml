    \ and programs that any sysadmin/devops/production engineer can use.\n\n# Repeat\
    \ until success.\n\nSometimes there is a need to repeat the command as long as\
    \ there is no success. In most cases, three constructions are used.\n\n+   1.\
    \ Run until success - never give up :) (meme below)\n2. Run until success with\
    \ a counter.\n3. Run until success with a timeout.\n\n![](bbox=[0.124, 0.527,\
    \ 0.879, 0.768])\n\n+   - 1st case:\n\n```\nwhile true; do\n\n    this_command_might_fail\
