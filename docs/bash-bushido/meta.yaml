    # TERMINATOR make terminal grid again!


    The Terminator authors describe it as - "Multiple GNOME terminals in one window".
    Terminators allow you to arrange terminals in grids or as not technical colleges
    says in "Matrix". In contrast to `tmux` and `screen`, to leverage most of the
    Terminator features you don''t have to learn a lot of shortcuts or how to make
    a complicated configuration file. In other words, the Terminator is user-friendly,
    it''s a typical zero entry program that shines without any configuration. Most
    of the operations can be achieved with mouse, especially without learning **any**
    shortcut.


    To install Terminator on Enterprise Linux Distributions invoke:


    ```

    sudo yum install -y epel-release

    sudo yum install -y terminator.

    ```


