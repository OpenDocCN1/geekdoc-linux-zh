    # htop - top on steroids.


    The name **htop** came from **H**isham **top** - the first letter is from the
    name of the program author, but I personally remember it with the HyperTOP mnemonic.
    **htop** is a better, easier-to-use, cleaner and more powerful, version of the
    **top**. It''s a self-desscriptive and easy-to-discover program. The only drawback
    of htop is that it is not a part of the proc-ng so:


    +   - It''s not a part of the minimal installation.

    - Not all vendors have it in their repositories. So, if you install a third-party
    package containing the **htop**, some vendors **might mark your system as unsupportable**,
    that is well ... stupid as f***.


    To install **htop** on Enterprise Linux distributions, you need the EPEL repository.


    ```

    sudo yum install -y epel-release;

    ```


    The epel-release is a package that sets up EPEL, so it contains repository info,
    GPG keys and a preset that is used by the systemd. After installing EPEL, the
    **htop** can easily be installed with yum.


    ```

    sudo yum install -y htop

    ```


    # Compiling the htop


    If your vendor is not sane, you can compile the **htop** and place it into a not
    standard path, that won''t be gathered by the sosreport or any other system state
    gathering utility.'
