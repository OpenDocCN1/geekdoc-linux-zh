  md: '# Terminals emulator


    For starter, a meme about how different roles in software development team see
    each other.


    ![](bbox=[0.082, 0.287, 0.917, 0.744])


    > *Team Members meme*


    I personally started using Linux terminal with cheesy green on black Matrix-like
    colors. To this day, every sensible terminal emulator supports this type of "Matrix"
    like color scheme/profile. I know few skilled Linux admins that use the standard
    console (terminal emulator), provided with their environment/window manager like
    gnome-terminal or Konsole. As I respect their skills, I also believe that choosing
    the right emulator is actually essential to boosting productivity. Sysadmin/Developer/DevOps
    spends quite a lot of time literally working in it. For the sake of this chapter,
    I made some basic features that a good terminal emulator must have:


    +   - Support for colors.

    - Possibility to choose different color profiles.

    - Possibility to make/import user-defined color profiles.

    - Support for mouse events (scrolling + clicking)

    - Text resizing/wrapping depending on current terminal width/size.

    - Possibility to make multiple tabs.


    Other features that good terminal should have:'
  merge: -1
