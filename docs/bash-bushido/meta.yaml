  md: '# Extra cool keyboard shortcuts in Bash:


    In the previous chapter, we looked into the basic shortcuts that help edit the
    current line. In this chapter, we are going to look into shortcuts that will boost
    your performance.


    # Clear the screen


    `ctrl+l` is the one **ESSENTIAL** shortcut for all power users - it clears the
    screen, just like the `clear` command. However, to keep even a simple `clear`
    command faithful to the spirit of Bash Bushido, I encourage readers to check what
    happens when we put `clear` in a Bash script, then invoke it. You can try it on
    different terminal emulators to determine if this behaviour is terminal emulator
    dependent.


    # History search


    Edit note: If your knowledge about the bash history mechanism is near zero, you
    might read the [Bash History](#) chapter first.


    To search the Bash history the from current position in the history (most likely
    the end), use `ctrl+r`. This key combination is bind to **reverse-search-history**
    function. Then type-in the beginning of the command you want to find. Let''s assume
    that your previous commands look like that:


    ```

    1 echo "first on history"

    ...

    150 banner "I like this"

    ...

    250 banner2 "I love this"

    ..

    500 echo "I''m last"

    ```'
  merge: -1
  pgno: 18
- img_proc: false
  md: 'combination.


    The second less-known history search type the is **forward-search-history** that
    is bound to `ctrl + s`. Because in most cases your current position is at the
    end of the history, it''s not as well known and to be honest - not frequently
    used. Let''s use our imaginary history file (the one presented above) once again.
    Firstly, you might use the **beginning-of-history** Readline function bound to
    the `alt + <` key combination, then invoke the forward search and type ''bann'':


    ```

    (i-search)`banner'': banner "I like this"

    ```


    Mnemonics:


    +   - `alt + <` - start of some section (<) in multiple languages (ex. HTML, XML,
    C/C++(include, templates, etc.))

    - `alt + >` end of some section (>) in multiple languages (ex. HTML, XML, C/C++(include,
    templates, etc))

    - `ctrl + reverse` - search from the current position in REVERSE mode

    - `ctrl + start` - search from the START


    # Get current Bash version


    `ctrl+x` then `ctrl + v` prints the Bash version. If bash is not in 4+ or 5+ version,
    it means that you are working on a legacy system or Apple MacOS. Apple won''t
    update bash to 4.X because of the license change to GPL v3+. To be fair, in most
    cases it''s not a big deal, but if a script uses some newer features (e.g. using
    associative arrays introduced in Bash 4.0) it can become quite a problem. In the
    beginning of 2019, version 5.0 was released. I highly recommend reading its release
    notes.


