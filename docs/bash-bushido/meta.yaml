  md: '+   - Possibility to set a background image.

    - The support for True Color.

    - Save output to file (logging).

    - "Infinite scrolling" or at least ability to store one thousand lines.

    - Windows split to make multiple terminals - both horizontal and vertical splitting
    should be possible.


    Lastly there are features that I tried but found useless:


    +   - Displaying Images/Video in a terminal.


    In this chapter, I will show some terminal emulators that I personally used during
    my journey with Linux. First chapters are about dropdown terminals that are a
    handful when doing some quick editing/checking. Then, I will present, in my opinion,
    the best terminal emulator **Terminator**. Finally, I will give some necessary
    information about the **screen** and show some useless but excellent for presentation
    terminal emulator named **Cool Retro Term**. Before going further, I would like
    to stress that I recommend choosing the tool that will seamlessly integrate with
    your workflow.


    # Short history of dropdown terminals


    In the life of any superuser, there is a time when you want to invoke a command
    **now** without an additional fuss like switching to another workspace/window.
    In other cases, you might wish for the nice placeholder for invoking/observing
    the time-consuming processes. In the very same time, it''s always nice to have
    a terminal that you can get/check right away. Of course, you might make new windows/tabs
    of your current terminal or even switch between "real" terminals (TTY). But it''s
    ineffective. So, if you want a swift and convenient solution, you might try the
    other way - the dropdown terminal.


    The whole idea of a dropdown terminal came from the video games (btw. shouldn''t
    they be called computer games already?)! Yeah, that little thing that according
    to the president of the United States, Donald Trump causes violence and mass shooting.
    Thank God even from such unspeakable/horrible blasphemy like the video games an
    excellent idea can arise. The dropdown terminals started with a Quake cheat console.'
