  md: '# Let Keyboard Become Your Very Best Friend.


    In countless texts, articles and how-tos we read about a better, faster, or shorter
    way to do something on the computer. The most prominent example is coping and
    pasting. Nearly all computer users know that `ctrl + c` and `ctrl + v` are the
    best homework and essay generators friends. Another great example is the `ctrl
    + alt + delete` key combination - the must-know for all Windows users.


    However, a lot of these tricks, tips and shortcuts are not very handy unless you
    are touch-typist. Why? Because a lot of them take advantage of typical hands positions
    on the keyboard during typing. For example, the whole `vim` navigation was made
    to use the home row. To get the right position and become the power user, you
    really should learn how to touch type.


    Some readers might not know what touch typing is. Fortunately, there is an excellent
    definition of touch typing on Wikipedia. To sum it up - touch typing is the ability
    to use (type on) the keyboard without looking at it.


    # Reasons to learn touch typing.


    +   - Average typing speed is about 40 WPM (word per minute), people who type
    without looking at the keyboard can type twice as fast on average. Note that the
    average typing speed includes the group of touch-typers :).

    - You can get more things done.

    - So, you have more time for work coffee and social activities.

    - You see ~~all~~ your typos as you type (you are looking at the monitor, not
    the keyboard). So, there is higher chance of catching and correcting them.

    - When you compose an email, you don''t look like tech Amish.

    - From my point of view, the most advantageous fact is that there is no barrier
    between my mind and the code (texts) that I''m writing. The keyboard it the "extension"
    of my body. Writing programs is not easy, and it''s easy to lose focus when you
    are "fighting" with the keyboard.


    # Reasons not to learn touch typing.


    +   - When you are working for a corporation, where you have plenty of time and
    saying that work is done is more important than actually doing it, then touch
    typing might improve your work performance what is not preferred.

    - **404** - any real acceptable argument **not found**.


    # What is needed to learn touch typing?'
  merge: -1
