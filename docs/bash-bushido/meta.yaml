  md: 'About 15 minutes per day for 2-3 months at maximum, I saw my ex-girlfriend
    learn that in less than a month. OK, you''ve got me - I''ve never had a girlfriend,
    the distant friend of my friend (my friends also never had girlfriends) told that
    story to me.


    # Learn how to touch type in the Linux terminal.


    This book is committed to the command line and terminal program/stuff. But it''s
    only fair to say that there are great programs like "klavaro" or "ktouch", with
    their fancy GUIs and all necessary lessons, great statistics showing your progress,
    interfaces, etc.


    When it comes to the console, there is one minimalistic program that I can honestly
    recommend - **gtypist**. **gtypist** is ncurses-based, so it''s minimal, yet powerful.


    It''s so nitched that it''s unavailable in many distributions (like EL). So you
    have to compile it by yourself. It requires basic ncurser development libraries
    and C language compiler. In the case of Enterprise Linux, you can simply install
    **@development** package group that have a lot of development packages and ncurses-devel
    package.


    ```

    sudo yum install -y @development ncurses-devel

    ```


    After installation completes:


    ```

    wget https://ftp.gnu.org/gnu/gtypist/gtypist-2.9.5.tar.xz

    ```


    ```

    tar xvf gtypist-2.9.5.tar.xz

    ```


    ```

    cd gtypist-2.9.5/

    ```


    ```

    ./configure

    ```


    ```

    make

    ```


    ```

    sudo make install

    ```


    This will compile gtypist and copy it to the `/usr/local/bin` directory. Depending
    on your **$PATH** environment variable, it should be executable right away.'
  merge: -1
