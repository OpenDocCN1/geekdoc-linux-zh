  md: 'possible values range from 0 to infinity.


    There is also an older statistic that is not present in the top,and it''s the
    CPU utilization. The problem with the CPU utilization is that it''s value is from
    0 to CPU or Threads Count. So, it is a bounded function.


    Let''s imagine that we have CPU that has 8 cores and disabled HyperThreading or
    similar technologies. The CPU utilization equal to 8 and the load average corresponding
    to 8 will result in a system that is still quite responsive, fully loaded but
    not overloaded. The CPU Utilization equal to 8 and load average equal to 123 will
    mean that the system is severely overloaded, and it''s hard to make even the simplest
    administrative operations on it.


    The last thing that I would like to note is that the first top line is identical
    to other procps-ng programs like `w` and `uptime`.


    ![](bbox=[0.083, 0.365, 0.912, 0.397])


    *Top summary task/threads*


    The next part considers task or threads (depending on mode) that are managed by
    the Linux Kernel, and their states. It''s quite easy to see that the top doesn''t
    report all states because of the "total." the number is not equal to the sum of
    all others. The reason for it is that not all states that process can be in are
    listed, for example, the idle process state is not present.


    To get all process states that are present in our system, one can use this simple
    one-liner.


    ```

    ps ax -o state | sort | uniq

    # OR with count

    ps ax -o state | sort | uniq -c

    ```


    One of the most interesting columns here is the one counting **zombie** processes.
    To simplify - zombies are processes that have finished their run, and they are
    waiting for `wait()` from the parent process. It''s uncommon to see them because
    most programs can adequately deal with their children and in the case of an orphaned
    process (one whose parent has finished execution before its children), the init
    system (like systemd) automatically will call wait when adopting them. To sum
    this up, the multiple conditions must be met for the zombie process to occur.


    ![](bbox=[0.083, 0.776, 0.912, 0.809])


    *Top summary - states*


    The next line has info about the CPU States - there are following states:


    +   - us(er): time running un-niced user processes (most processes)

    - sy(stem): time running kernel processes

    - ni(ce): time running niced processes

    - id(le): time running idle (kernel idle handler)

    - wa(it for IO): time waiting for I/O

    - hi[Hardware Interrupts] time spent servicing hardware interrupts

    - si[Software Interrupts]: time spent servicing software interrupts

    - st(olen): time stolen from this VM by the hypervisor


    In an alternative mode where the CPU report percentage of usage in a graph from.
    The graph has the following format:


    ```

    [us+ni]/[sy] [sum of all excluding idle][graph]

