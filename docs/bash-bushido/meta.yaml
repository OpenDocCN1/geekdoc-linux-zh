    Ncat is frequently used to transfer the files over the network. Because I prefer
    self-contained examples, the localhost is used, but in a normal situation, there
    is a different host.


    To start ncat in the listening mode use the -l option:


    ```

    nc -l -p 6969 > output_file

    ```


    To transfer the file, you might use the file redirection (<), or pipe:


    ```

    nc localhost 6969 < file.txt

    ```'
