  md: '# Configure BASH


    This chapter is dedicated to various Bash configuration options. When Bash starts
    as interactive shell, the following configuration files are read:


    +   1. /etc/profile

    2. ~/.bash_profile

    3. ~/.bash_login

    4. ~/.profile

    5. ~/.bashrc

    6. ~/.bash_logout

    7. /etc/bash.bash_logout


    To keep things simple (KISS principle), most Linux users put their configuration
    into just one file - `~/.bashrc`.


    # Change Your prompt


    Default `bash.rc` configuration that the user gets by default (at least in most
    of the distributions) is located in `/etc/skel/.bashrc` (the content of `/etc/skel`
    is copied to the home directory during user creation). In many cases, this `.bashrc`
    reads `/etc/bashrc` that sets the PS1 environmental variable to something like
    `PS1="[\u@\h \w]\\$ "`


    This prompt translates to `[USER@HOST WORKING_DIRECTORY]$`. This is a reasonable
    default configuration for a prompt, that might be enough. However, if you want
    a colourful, more customized prompt, you can use one of the websites that help
    you build one (they are amazing and handy). Alternatively, read the PROMPTING
    section in `man bash`, and make your own.'
  merge: -1
