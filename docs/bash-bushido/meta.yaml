    # Shellcheck - write better bash scripts!


    There are multiple ways that a software can be tested, but one of the most fundamental
    distinction is based on whether the software is actually run. In dynamic testing,
    the code is executed, in contrary, static testing doesn''t execute the code, but
    checks its static properties. The static testing is also white box testing because
    the tester/test automation engineer/software engineer in test actually has access
    to the source code of the program.


    One of the most frequently used static testing techniques is static code analysis.
    In most cases, programs that perform static code analysis and often also grade
    the code, are called linters. The name linter came from ''lint'' a program from
    Unix version 7 that was looking for mistakes in the C programs. Nowadays, most
    IDE have built-in linters that help avoid most popular mistakes/errors. Some linters
    even gives a numeric or "school grade" score like 8.9/10 or B+. A lot of GitHub
    repositories have badges that inform on the code health based on linters and other
    statistics.


    OK, why did I provide all this theory? Well, there is an absolutely fabulous linter
    for shell scripts - it''s shellcheck. Shellcheck is shell a script static analysis
    tool. It also uses standard exit codes to inform if a code is flawless (at least
    on a level that shellcheck can check it ;)).


    The official ShellCheck GitHub repository: [https://github.com/koalaman/shellcheck/wiki](https://github.com/koalaman/shellcheck/wiki).


    The shellcheck groups wrong statements/bad codes based on severity, currently
    there are three categories:


    +   1. **Error** - in most cases, the script won''t invoke properly.

    2. **Warning** - in most cases inadequate, but syntax acceptable, code.

    3. **Info** - from quite important to pedant information. In many cases, they
    don''t have much impact on a script and its execution.


    Installing the ShellCheck on Enterprise Linux distributions is really easy - you
    just need the EPEL repository :).


    ```

    sudo yum install -y epel-release

    sudo yum install -y ShellCheck

    ```


    After installation, shellcheck is invoked like any other program. One of the most
    essential switches is `-e` that excludes specified error codes.


    Look at the following example:


    ```

    [Alex@SpaceShip BashBushido]$ shellcheck /usr/sbin/alsa-info.sh | wc -l

    ```'
