  md: '```

    [Alex@SpaceShip ~]$ ssh -X myuser@remote

    [myuser@remote]$ firefox

    ```


    There are some security considerations. According to Red Hat 7 Security Guide,
    X11 forwarding is not recommended for an unknown host. Another important note
    is that there is an X11 replacement that is under massive development - Wayland.
    Wayland can somehow forward in X11 style with Xwayland, but some users claim that
    it''s buggy.


    # Port forwarding with ssh


    In many environments, there is a host called "jump server", jump hosts or jumpbox
    that is used to access computers in another security zone (like company LAN).
    Sometimes you need to get a service (like a web server) from this zone. In cases
    like that, the SSH port forwarding, also called SSH tunnelling, might come in
    handy.


    There are two types of forwarding. The first one is the local forwarding. Because
    it''s much easier to get it with an example look at the following command:


    ```

    ssh -L 9999:webserver:443 root@jumphost

    ```


    It will open the local port 9999. When the user opens a browser (or uses anything
    that can use https like curl or wget) with the address `https://localhost:9999`,
    the connection will be transferred to jumphost, that will ask the webserver for
    content.


    Another way is the remote port forwarding, it is the same but reverse :). Look
    at the following example:


    ```

    ssh -R 8080:localhost:80 root@jumphost

    ```


    It will allow anyone that has access to jumphost asks about `http://jumphost:8080`
    to connect to the localhost on port 80.


    Please note that examples above use web servers, but any other protocol that uses
    TCP will work. There is also a great answer on superuser.com how to achieve port
    forwarding for UDP services. You can read it here [https://superuser.com/questions/53103/udp-traffic-through-ssh-tunnel](https://superuser.com/questions/53103/udp-traffic-through-ssh-tunnel).


    When it comes to ssh tunnelling, there are some security considerations - because
    it''s possible to transfer anything that jump host has access to, it might be
    wise to add some extra security. SSH tunnelling might be used to make backdoors,
    so proper hardened jump host SSH daemon configuration should prevent it.


    But there are also benefits of using port forwarding. For example, when you have
    an insecure web application that is using HTTP instead of HTTPS, then you can
    locally forward the connection to the server itself:


    ```

    ssh -L 9999:localhost:80 root@webserver

    ```


    Now your connection between the web server and your host are SSH grade encrypted!'
