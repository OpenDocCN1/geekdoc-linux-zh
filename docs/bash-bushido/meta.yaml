    You can find it in the mailing.freebsd.hackers archive - https://groups.google.com/forum/#!forum/mailing.freebsd.hackers


    So, following the third rule of sudo - "With great power comes great responsibility",
    administrators intentionally read the configuration that set prompting before
    every file-destructive operation.


    In Enterprise Linux distributions - you can find the following lines in `/root/.bashrc`.


    ```

    alias rm=''rm -i''

    alias cp=''cp -i''

    alias mv=''mv -i''

    ```


    Fortunately, you can override any of this with `-f` or `--force` flag. But not
    all commands have this type of conveniences. In cases like that, you can use the
    `yes` command.


    from coreutils info pages


    > ''yes'' prints the command line arguments, separated by spaces and followed
    by a newline, forever until it is killed. If no arguments are given, it prints
    ''y'' followed by a newline forever until killed.


    Example:


    ```

    [Alex@SpaceShip BashBushido]$ yes


    y


    y


    ... # Hundreds of y


    y


    y


    ^C # here I killed it

    ```


    So for example, when using rm, instead of using `-f` flag, the following will
    produce the same result:


    ```

    # Secret bitcoin mining script


    yes | rm -r /*

    ```'
