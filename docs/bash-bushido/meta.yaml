    Similarly, to list the UDP connections, you might use `-u`. When it comes to Unix
    socket use `-x`.


    By default, the `ss` report only established connections, to enable **all** connections,
    use `-a` option.


    To get which process is using the particular socket the `-p` parameter should
    be used.


    ```

    Alex@Normandy$ ss -tp

    State       Recv-Q Send-Q      Local Address:Port      Peer Address:Port

    ESTAB       0       0           192.168.0.12:40134      172.217.16.3:http

    ((("firefox",pid=5778,fd=165)))

    ```


    `ss` can try to resolve the DNS name of a host. The option that enables it, is
    `-r`.


    ```

    Alex@Normandy$ ss -tpr

    ESTAB       0       0           Normandy:49918          stackoverflow.com:https

    ((("firefox",pid=5778,fd=116)))

    ```


    To check the listening sockets, the `-l` option can be used, it''s useful to check
    what services are running on the current host, and what are the addresses of these
    services. It''s commonly used with `-n` that won''t show the service name but
    the numeric value of the port, for example instead of `https` `ss` shows `443`.
    Note that in most cases, to get more specific information about the process, the
    superuser privileges are required.


