    \ loosely based on \"Jonathan M Davis\" Unix and Linux Stack Exchange\nhttps://unix.stackexchange.com/a/4291/183070\n\
    \n```\nalias cd='pushd'\n\nalias back='popd'\n\npopd()\n\n{\n\n    builtin popd\
    \ > /dev/null\n\n}\n\npushd()\n\n{\n\n    if [ $# -eq 0 ]; then\n\n        builtin\
    \ pushd \"${HOME}\" > /dev/null\n\n    elif [ $1 == \"-\" ]; then\n\n        builtin\
