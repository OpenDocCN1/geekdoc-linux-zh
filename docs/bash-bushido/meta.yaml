  md: "```\nmy_pass=$(pwgen -s 20 1)\n\n yes $my_pass | passwd user\n```\n\nNote that\
    \ there is a space character before `yes $my_pass`. It's because we don't want\
    \ it to be saved to the history ([Controlling what the history should forget](#))\n\
    \nLastly I would like to deal with some moronic information I found on the Internet\
    \ during my \"research\" (\"duckduckgoing\" and \"googling\" is considered research\
    \ nowadays). `yes` command is **NOT** the right way to benchmark a single thread\
    \ of the processor, even if `yes > /dev/null` can take up to 100% of a single\
    \ core, it won't measure anything useful.\n\n# Tee - split the output.\n\nIn many\
    \ cases, when you invoke the command, you want to get an output of the invoked\
    \ command and put that into the log at the same time. In cases like these, tee\
    \ command is the answer to your thoughts and prayers.\n\nFrom tee info pages:\n\
    \n> The 'tee' command copies standard input to standard output and also to any\
    \ files given as arguments. This is useful when you want not only to send some\
    \ data down a pipe, but also to save a copy.\n\nFor example, to start the application\
    \ server and have a log with a date, use:\n\n```\n[Alex@SpaceShip bin]$ ./standalone.sh\
    \ | tee log-$(date +%F-%T).log\n```\n\nThere is also a possibility to get quite\
    \ the same result in a different way:\n\n```\nmy_log=log-$(date +%F-%T).log\n\
    ./start_app_server.sh &> $my_log &; tail -f $my_log\n```\n\nThis is an acceptable\
    \ solution, of course there are slight differences - we put ./start_app_server.sh\
    \ in the background and there is a slight possibility that tail won't catch the\
    \ very beginning of a log. The real power of **tee** is the ability to get sub\
    \ results or put a copy of the output into multiple processes. Look into following\
    \ example:\n\n```\nmy_grep1='grep -v \"^#\"'\n\nmy_grep2='grep -i \"IP:\"'\n\n\
    my_grep3='grep \"8\\.8\\.8\\.8\"'\n\ncat huge_logfile | $my_grep1 | tee grep1.log\
    \ | $my_grep2 | tee grep2.log | $my_grep3 | tee -a final_ip\n```\n\nThese pipe\
    \ commands can be optimized by removing the cat. As you can see, the **tees**\
    \ save subresults of the next grep in separate files. The final **tee** results\
    \ is appended the to `final_ip` file.\n\nThe `info coreutils 'tee invocation'`\
    \ gives us another great example:"
