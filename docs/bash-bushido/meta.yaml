  md: "pstree format might be Unicode or ASCII - and it's based on the **LANG** environment\
    \ variable. ASCII:\n\n```\n[Alex@SpaceStation ~]$ LANG=C pstree\n...\n       \
    \ |-tuned---4*[{tuned}]\n        |-udisksd---4*[{udisksd}]\n        |-upowerd---2*[{upowerd}]\n\
    \        |-wpa_supplicant\n        `-xdg-permission---2*[{xdg-permission-}]\n\
    ```\n\nUnicode:\n\n```\n[Alex@SpaceStation ~]$ LANG=en_US.UTF-8 pstree\n     \
    \   ├─tuned───4*[{tuned}]\n        ├─udisksd──4*[{udisksd}]\n        ├─upowerd──2*[{upowerd}]\n\
    \        ├─wpa_supplicant\n        └─xdg-permission──2*[{xdg-permission-}]\n```\n\
    \nOn modern computers, the UTF-8 is supported by default. The next curious thing\
    \ is that if pstree is piped, the **ASCII** format will be used. The format can\
    \ be forced with **-A** options for ASCII and **-U** for Unicode. There are also\
    \ two switches that you can find useful - one is **g** so its print won't compact\
    \ process groups:\n\n```\n[Alex@SpaceStation ~]$ pstree\n...\n            └─xdg-permission───2*[{xdg-permission-}]\n\
    ```\n\nWill become:\n\n```\n[Alex@SpaceStation ~]$ pstree -g\n...\n        └─xdg-permission-(2442)─┬─{xdg-permission-}(2442)\n\
