    # cp {,bak} and mv {,.new}


    It''s always a good idea to make backups when editing an important system setting
    file. It can be achieved on multiple levels. For example, VM can be snapshotted
    or cloned. But a simpler solution ad-hoc solution is to make backup file. In this
    case, shell expansion comes in handy. For example, before editing fstab, you can
    invoke:


    ```

    cp /etc/fstab{,.bak}

    ```


    Now even if you mess up the configuration, you can safety revert to the previous
    file with:


    ```

    mv /etc/fstab{.bak,}

    ```


    The very same trick can be used to add an expansion to the file. For example,
    many repos have README written in markdown without an explicit Markdown expansion.
