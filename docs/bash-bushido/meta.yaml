    \ HISTFILESIZE=2000\n```\n\n# ## Ignoring particular commands.\n\nWell, imagine\
    \ that you go through the new code repository. After cloning it, you probably\
    \ will read the README, go through the directories, list the files, go to another\
    \ directory, grep on file, then list files, then read some file, then go to another\
    \ directory, list files, grep on files, read a file, and so on. After something\
    \ like this, your history is going to be cluttered with multiple **cd**, **ls**,\
    \ **cat**, and **grep** commands varianes.\n\nTo keep the more essential commands\
    \ in the history file, you can ignore the ones that are popular but don't tell\
    \ much. For example, `cd` or `ls`. Once more, there is a special Bash variable\
    \ that allows to do so - **HISTIGNORE**.\n\nThe **HISTIGNORE** that I'm using\
    \ looks like:\n\n```\nexport HISTIGNORE=\"cd*:false:history:htop:ls*:ll*:la:l:popd:pushd*:reset:top:true\"\
    \n```\n\nThe `*` makes **HISTIGNORE** matching everything after the string. Without\
    \ it, the commands like **cd Documents** would be saved.\n\n```\n[Alex@SpaceStation\
    \ ~]$ export HISTIGNORE=\"cd\"\n[Alex@SpaceStation ~]$ cd /tmp\n[Alex@SpaceStation\
    \ tmp]$ history | tail -2\n  518  cd /tmp\n  519  history | tail -2\n[Alex@SpaceStation\
    \ tmp]$ export HISTIGNORE=\"cd*\"\n[Alex@SpaceStation tmp]$ cd /var\n[Alex@SpaceStation\
    \ var]$ history | tail -2\n  520  export HISTIGNORE=\"cd*\"\n  521  history |\
    \ tail -2\n```"
