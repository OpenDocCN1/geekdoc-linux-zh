  md: '![](bbox=[0.106, 0.105, 0.892, 0.539])


    As it''s easy to predict, the people that make free software steal adapt the idea
    of drop-down terminals and then perfect it. In Bash Bushido, we will discuss the
    two most popular dropdown terminals - Guake and Yakuake. Note that both have names
