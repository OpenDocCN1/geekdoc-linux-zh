  md: "Bash has a special variable **PROMPT_COMMAND**. According to the Bash documentation:\n\
    \n```\nIf set, the value is executed as a command before issuing each primary\
    \ prompt\n```\n\nExample:\n\n```\n[Alex@SpaceShip ~]$ export PROMPT_COMMAND='date\
    \ +%F-%T |tr -d \"\\n\"'\n```\n\n```\n2018-08-20-22:58:22[Alex@SpaceShip ~]$ #\
    \ Enter\n```\n\n```\n2018-08-20-22:58:23[Alex@SpaceShip ~]$ # Enter\n```\n\n```\n\
    2018-08-20-22:58:26[Alex@SpaceShip ~]$ # Enter\n```\n\n# Is this out-of-season\
    \ April's Fool Joke?\n\nBecause literally no one knows about the **PROMPT_COMMAND**,\
    \ you can make a little out of season April fool joke. It's gonna be definitely\
    \ better than the Diablo Immortal announcement.\n\nFor your safety remember if\
    \ your colleague tries to kill you after doing that, just say\n\n> IT'S A PRANK\n\
    IT'S JUST A PRANK BRO\n  -- Anonymous before getting shot.\n\nOk so let's get\
    \ to the code\n\n```\nexport PROMPT_COMMAND='python -c \"import random; import\
    \ time; time.sleep(random.random()*5)\"'\n```\n\nPython random.random() will return\
    \ value [0, 1) (uniform distribution). So, in the worst case scenario, you have\
    \ to wait 5 seconds for your prompt :). Another thing worth pointing out is that\
    \ this command works with both Python 2 and 3.\n\nNow you can add it to /etc/.bashrc.\n\
    \n```\necho \"export PROMPT_COMMAND='python -c \\\"import random; import time;\
    \ time.sleep(random.random()*5)\\\"'\" | sudo tee -a /etc/bashrc\n```\n\nNote\
    \ that, as according to the documentation PROMPT_COMMAND is invoked only for the\
    \ interactive session. It might be an **IDIOTIC** joke (production, critical,\
    \ non-standard configured hosts, services that start in an interactive session\
    \ [you shouldn't do that anyway], etc).\n\n# Are `Clear` and `ctrl + 1` the same?\n\
    \nThe last thing that I would like to show about the **PROMPT_COMMAND** is, that\
    \ there is a difference between `clear` and `ctrl + 1`. You can export our \"\
    prank code\", and check that after the `clear` command you have to wait for your\
    \ prompt, but when you use `ctrl + 1`, you get the same cleared screen without\
    \ waiting. It's because after `ctrl+1`, the **PROMPT_COMMAND** is not invoked."
  merge: -1
