    \ workspace]$ popd\n/usr/share ~\n[Alex@garrus share]$ popd\n~\n[Alex@garrus ~]$\
    \ popd\n-bash: popd: directory stack empty\n```\n\nHowever, this is BashBushido\
    \ - we can do it a little bit better and maybe smarter :)! I enjoyed switching\
