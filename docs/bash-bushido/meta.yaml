  md: '# Erratum


    Any problems, suggestions and bugs errata are welcome at errata repository https://github.com/AlexBaranowski/bash-bushido-errata,
    on LinkedIn messages or my e-mail aleksander . baranowski at yahoo dot pl


    All accepted errata will be published and free to download for everyone (GitHub
