    # Make our key bindings persistent.


    One of the most important lessons that every SysAdmins/DevOps/ConfigManager(WhatEverNameTheyWantToCallThem)
    has to go through is that to make a configuration and to make a persistent configuration
    are two separate activities. In the previous chapter, we made a configuration
    that will work in the interactive shell and will be forgotten/die with it. Now
    we will make the configuration persistent. There are two fundamental ways to achieve
    it.


    First, and in my opinion the better way is it to put the **bind** commands in
    `.bashrc`. As said before use KISS - Keep It Simple Stupid principle. Keeping
    everything in a single rc file is good idea.


    Below is a fragment that you can write to your `.bashrc`.


    ```

    ## Custom key bindings.

    bind ''"\eq":"uptime\n"''

    bind ''"\C-q":"date\nwhoami\n"''

    bind ''"\e[20~":"date\n"''

    ```


    The second one (and by the way more by the book ) - is the use of the configuration
    file of the readline library (can be overridden with the **INPUTRC** variable)
    the **$HOME/.inputrc** file.


    Sample `.inputrc` file:


    ```

    "\eq":"uptime\n"

    "\C-q":"whoami\n"

    "\e[20~":"date\n"

    ```


    As most of readers will quickly notice, the .inputrc has the same format as arguments
    passed to the **bind** command. As there is **/etc/bashrc** there is also the
    **/etc/inputrc** file that is a global start-up file used by the Readline library.
    The inputrc supports comments ("lines started with #"), conditional settings and
    including other files. For example, in Enterprise Linux distributions (ver 7)
    the **/etc/inputrc** has conditional statements like


    ```

    $if mode=emacs

    # for linux console and RH/Debian xterm

    "\e[1~": beginning-of-line

    "\e[4~": end-of-line

    ...

    ...

    ```'
