    # Edit file over ssh, HTTP, FTP and more with Vim.


    As console warriors, sometimes we must edit remote files. We usually log into
    a machine and then open our editor of choice. The second option is to copy the
    file, edit it on our machine then overwrite it over the target machine.


    In the first solution, the editor of our choice must be present on the machine
    (don''t expect vim, but vi will be on 99.9% systems). Even if we had the editor
    of our choice: we lose the whole (amazing) configuration, favourite plugins and
    custom bindings.


    The second solution requires three steps (copy, edit, push into the host) - so
    it might be too long (it''s easy to script through).


    Fortunately, there is also another vim specific solution that is way cooler! You
    can ask vim politely to edit a remote file.


    ```

    #vim PROTOCOL://USER@HOST::/PATH

    ```


    ```

    vim scp://alex@jumphost:/etc/ssh/sshd_config

    ```


    Supported protocols include: - ftp - http - rcp - scp


    # Further reading about vim


    The best way to start a journey with vim is to use the vimutor. Other resources
    that I can recommend : help that is built in vim, vim.org and vim.fandom websites.'
