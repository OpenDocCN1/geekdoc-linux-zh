  md: '# # Configure Bash


    This chapter is dedicated to various Bash configuration options. When Bash starts
    as interactive shell, the following configuration files are read:


    +   1. /etc/profile

    2. ~/bash_profile

    3. ~/bash_login

    4. ~/profile

    5. ~/.bashrc

    6. ~/.bash_logout

    7. ~/.bash.bash_logout


    To keep things simple (KISS principle), most Linux users put their configuration
    into just one file - ''~/.bashrc''.


    # # Configure Your prompt


    Default bash.rc configuration that the user gets by default (at least in most
    of the distributions) is located in /etc/skel/.bashrc (the content of /etc/skel
    is copied to the home directory during user creation). In many cases, this .bashrc
    reads /etc/bashrc that sets the PS1 environmental variable to something like PS1="\u@\h
    \W\$ "


    This prompt translates to [USER@HOST WORKING DIRECTORY]$. This is a reasonable
    default configuration for a prompt, which might be enough. However, if you want
    a colourful, customized prompt, you can use one of the websites that help build
    one (they are amazing and handy). Alternatively, read the PROMPING section in
    man bash, and make your own.


    My favourite to make a custom prompt is ~/zprompt.net/. You can generate your
    nice colourful, customised there, then copy it to ~/.bashrc. If this is not enough,
    you can read about setting up a prompt, how to enable a particular colour on text,
    make something even more suited to your tastes. This might be particularly useful
    when your terminal supports True Colour (16 million colours in the terminal instead
    of 256). There is excellent GitHub just describing it. it is the first result
    in the DuckDuckGo search engine (that search engine does not personalise output,
    so it''s much more reliable than Google). The query I used is "terminal colour
    support". In the case that this little recommendation doesn''t convince you, here
    is the link - https://github.com/XVhika/B346728.


    # # Executing the chosen commands before the prompt.'
  merge: -1
