    should be possible.


    Lastly there are features that I tried but found useless:


    +   - Displaying Images/Video in a terminal.


    In this chapter, I will show some terminal emulators that I am personally used
    during my journey with Linux. First chapters are about dropdown terminals that
    are handful when doing some quick editing/checking. Then, I will present, in my
