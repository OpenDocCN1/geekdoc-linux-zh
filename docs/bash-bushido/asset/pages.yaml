    ```

    {Alex |->} echo "love rock and roll" | awk ''{print $4}''

    and

    ```


    ```

    {Alex |->} echo "love rock and roll" | cut -f4 -d''

    rock

    ```


    ```

    {Alex |->} echo "love rock and roll" | awk ''{print $4}''

    and

    ```


    In the case of an unknown number and types of whitespaces, the awk will produce
