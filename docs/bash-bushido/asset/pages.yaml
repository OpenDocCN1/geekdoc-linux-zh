  md: '# home and end keys


    Instead of using home key (moves the cursor to the beginning of the current line)
    and end key

    (moves the cursor to the end of the current line), which, by the way, is not that
    bad (it at shows

    some can read what is written on the keyboard that she/he/they is sitting in front
