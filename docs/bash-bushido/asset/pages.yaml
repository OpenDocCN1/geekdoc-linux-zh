    - ctrl + append to the end


    You might ask yourself if it''s really better than home and end keys. Well, yes!
    Even if you have to

    move your left hand a little bit to hit ctrl, the movement is by far shorter than
    the right hand

    leaving the typing area to get to the navigation keys area.


    # Delete and backspace


    Surprisingly, many people don''t know the difference between backspace and delete
    keys.

    The backspace key removes the character before the cursor, while delete key removes
    the character

    under the cursor.


    Armed with this theoretically obvious knowledge, you can learn two different shortcuts.
    ctrl + d

    removes the character under the cursor. ctrl + h removes the character before
    the cursor. I hope

    that you didn''t think there will be an actual shortcut for the backspace key.


    Mnemonics:


    +   - ctrl + delete

    - ctrl + hrHrHrHrHr - sound that makes a click when it wants to remove the character
    before the

    cursor.


    # Different ways to Enter!


    This one is quite useless because the enter key is exceptionally close to your
    right-hand''s little

    finger, if you want, you can use ctrl + j or ctrl + m instead of the regular boring
    enter key.

    Both of those shortcuts are bound to the accept-line function.


    ```

    [Alex@SpaceShip ~]$ bind | grep ''C-m''

    ```


    accept-line can be found on "\C-j", "\C-m".'
