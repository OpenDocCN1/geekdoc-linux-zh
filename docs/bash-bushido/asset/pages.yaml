    # Practical Top usage.


    I will take the first and most important advice straight from the top manual


    When operating top, the two most important keys are a help (''h'' or ''?'') and
    quit (''q'') key.


    So, if anything is unclear, just use the built-in help or read the man 1 top.


    Because the top is potent and robust, there is no need/way to memorize all keys
    and settings. As said before, in doubt, use the help or the manual. Nevertheless
    I''m going to present the most important ones.


    # Sorting and filters.


    +   - P - sort processes by CPU usage - Processor.

    - M - sort processes by memory usage - Memory.

    - n - sort by PID - number.

    - < and > change the sort field.

    - u - filter by username.

    - R - Reverse sort order.


    # Useful top commands


    +   - k - send a signal to a process, in most cases to kill the process. The default
    signal is 15 SIGTERM, in an act of desperation you can use 9 SIGKILL that is more
    powerful than the default SIGTERM.

    SIGKILL is signal that cannot be ignored and is practically always fatal. Any
    valid Linux signal can be used.

    - r - renice process.


    # Alternate-display mode


    +   - A - enter/exit alternate-display mode.

    - w or a - change currently managed window.


    Note that in alternate-display mode each has its own field and color configuration.'
  merge: -1
