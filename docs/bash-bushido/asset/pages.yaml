    # du and ncdu


    To obtain information about disk usage, and how much data does the chosen directory
    keep, most people use du program. du is part of coreutils, so it''s installed
    on nearly all Linux systems. Without any arguments, it will show the summarized
    size recursively for directories.


    The most common and useful flags include:


    +   - a - shows size for each file, not summarized directories.

    - h - human-readable size. For example, instead of 4405312 you get nice 4. 36.

    - s - summarize the size of each argument (useful for dirs).

    - x - only one filesystem. Helpful when you have multiple filesystems mounted.
    In some cases (ex. slow network filesystem that we don''t want to calculate),
    it''s a huge timesaver.

    - d - set max recursion depth.


    A sample usage:


    ```

    [root@SpaceShip ~]# du -sh /b*


    0 /bin


    252M /boot


    564M /boxes

    ```


    The /bin directory is 0 because it is symlink to /usr/bin/


    The interactive version for du is ncdu. It''s NCurses (the most popular library
    for making terminal interactive programs) based program that allows you to count
    and manage the files interactively.

    Installation on Enterprise Linux distributions requires the EPEL repository:


    ```

    sudo yum install -y epel-release

    ```


    ```

    sudo yum install -y ncdu

    ```


    Then we can simply invoke ncdu


    ```

    [Alex@SpaceShip ~]$ ncdu

