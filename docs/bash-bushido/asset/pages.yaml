  md: '# Previous and next command. ↑ and ↓.


    The ctrl + p shortcut works the arrow up (which asks Bash history about the previous
    command). The opposite is ctrl + n (which asks the bash for the next command in
    the history). With these two shortcuts, you don''t have to move your right hand
    to the arrow area to go through the Bash history.


    ```

    $Alex@SpaceShip ~$ echo 1

    ```


    1


    ```

    $Alex@SpaceShip ~$ echo 2

    ```


    2


    ```

    $Alex@SpaceShip ~$ echo 3

    ```


    3


    ```

    $Alex@SpaceShip ~$ echo 3 # After ctrl+p

    ```


    ```

    $Alex@SpaceShip ~$ echo 2 # After ctrl+n

    ```


    ```

    $Alex@SpaceShip ~$ echo 3 # After ctrl+n

    ```


    Mnemonics:


    +   - ctrl + previous command

    - ctrl + next command


    # Character forward and backwards. → and ← arrows.


    To move forward by one character, use ctrl + f, and to move the cursor backward
    by one character, ctrl + b. After remembering these and previous shortcuts, the
    arrows become obsolete).


    Mnemonics:


    +   - ctrl + forward

    - ctrl + backward'
