    Before invoking fortune, I would like to note a particular thing about this program.
    As before, fortune is an ancient program, its data is residing in the games directory
    (/usr/share/games in Enterprise Linux 7). Yeah meshes, like this, is this "old-better"
    computing world where fortune teller and face printing were treated as "Figlet".
    But there is more - fortune, and figlet are programs that actually use the most
    hated section of the manual (section 6 - many), that many argue useless.


    With this interesting unnecessary knowledge, you can invoke the actual program:


    You can choose from themed fortunes like art, education, goedel, linux, startrek
