  md: '# Event designator, word designator, modifiers.


    This chapter is dedicated to some advanced Bash features. Because the presented
    material might be somehow overwhelming, the last subchapter contains the most
    frequent commands.


    # What does ! mean in Bash?


    ! is a special character for the Bash shell. It''s a mighty Event Designator.
    The Bash manual explains It as:


    An event designator is a reference to a command line entry in the history list.
    Unless the reference is absolute, events are relative to the current position
    in the history list.


    So easily speaking, ! allows us to reuse the previous commands (stored in the
    history).


    # sudo !! = fRiends 4 EVEER!!!


    The most common usage of ! (in many cases without knowing what it is) is invoking
    it with a second !! is a special shortcut that says invoke the last command as
    it was. It''s most frequently used with a privilege escalation via sudo. Look
    at the following example.


    ```

    [Alex@SpaceShip ~]$ cat /etc/gshadow | head -1

    ```


    ```

    cat :/etc/gshadow Permission denied

    ```


    ```

    [Alex@SpaceShip ~]$ sudo !!

    ```


    ```

    sudo cat /etc/gshadow | head -1

    ```


    ```

    root:::

    ```


    ```

    [Alex@SpaceShip ~]$

    ```


    As said before, this is the most popular event designator usage and one that you
    can find in nearly every Bash course.'
