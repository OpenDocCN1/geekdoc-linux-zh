  md: '# Extra cool reverse shortcuts in Bash:


    In the previous chapter, we looked into the basic shortcuts that help edit the
    current line. In this chapter, we are going to look into shortcuts that will boost
    your performance.


    # Clear the screen


    ctrl + 1 is the one ESSENTIAL shortcut for all power users - it clears the screen,
    just like the clear command. To keep even a simple clear command faithful to the
    spirit of Bash Bushido, I encourage readers to check what happens when we put
    clear in a Bash script, invoke it. You can try it on different terminal emulators
    to determine if this behaviour is terminal emulator dependent.


    # History search


    Edit note: If your knowledge about the bash history mechanism is near zero, you
    might read the Bash History first.


    To search the Bash history from the current position in the history (most likely
    the end), use ctrl + r. This combination is bind to reverse-search-history function.
    Then type-in in the beginning of the command you want to find. Let''s assume that
    your previous commands look like that:


    ```

    1 echo "first on history"

    ...

    150 banner "I like this"

    ...

    250 banner2 "I love this"

    500 echo "I''m last"

    ```


    We also assume that both banner and banner2 are unique throughout the whole history
    file. So, invoking the reverse-search-history and typing "bann" you might get


    (reverse-1-search) bann: banner2 "I love this"


    After invoking a command, you always arrive at the end of the history. However,
    if you press esc during the reverse history search, your current position in the
    history is going to be set to the position of currently found match. In our example
    with bann, it will be 250. Therefore subsequent reverse search will search lines
    from 250 to 1. So, the next reverse search for "bann" will return the command
    banner "I like this".


    To get back to the end of history, you can use a smooth hit-enter with the empty
    prompt. The other solution is to use end-of-history readline function that is
    bound to the alt + key'
