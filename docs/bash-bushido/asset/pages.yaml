    # Timeout process


    Sometimes programs might take an entirely unpredictable time to complete. In most
    cases, it''s OK when the program finishes work faster than expected, and the problematic
    situation is when the program runs too long. For cases like this, there is a possibility
    to run a command with a time limit. There are multiple solutions to this problem,
    but my favourite is the timeout command from GNU Core. Please look at the following
    listening.


    ```

    [Alex@Normandy BashBushido]$ timeout 5 sleep 7 || echo "Sorry this failed"

    ```


    Sorry this failed


    In this example, we set the timeout to 5 seconds and run the program (sleep) that
    will sleep for 7 seconds before exiting. Because sleep was killed by timeout,
    and its return status was non-zero, the echo "Sorry this failed" was invoked.


    Some of the useful command options are:


    +   - -signal=SIGNAL - allows setting specific signal on timeout.

    - --foreground - when a timeout is not run directly from a shell prompt (in other
    words timeout is used in script).

    - --preserve-status - returns status of a killed or signalled child.


    The duration itself might have the following units:


    +   - s -seconds (the default)

    - m -minutes

    - h -hours

    - d -days


    So, following examples are valid:


    ```

    timeout 20m /opt/backup/run.sh

    ```'
