  md: '# shell-expand-line


    ctrl alt+ e is one of my favourite bash shortcuts. This function can be used to
    check if a command is aliased, expand a subshell and make a history expansion.
    There are also other expansions, but they are not as popular as this one. You
    can find them with bind -P | grep expand.


    Examples:


    ```

    [Alex@SpaceShip BashBushido]$ mkdir {1,2,3}{a,b,c}

    ```


    ```

    [Alex@SpaceShip BashBushido]$ echo $(ls -d 1*) # # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ echo 1a 1b

    ```


    ```

    [Alex@SpaceShip BashBushido]$ grep # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ grep --color=head

    ```


    ```

    [Alex@SpaceShip BashBushido]$ history | head -3

    ```


    ```

    1 vim ~/.bashrc

    ```


    ```

    2 vim ~/.bashrc

    ```


    ```

    3 bash

    ```


    ```

    [Alex@SpaceShip BashBushido]$ ! 2 # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ vim ~/.bashrc

    ```


    Unfortunately shell-expand-line function won''t expand glo.


    # glob-expansion


    Because glob might be a new word for some people, here is a minimalistic definition
    - glo are patterns that specify the pathname. I highly recommend reading the glob(7)
    manual page. The key bidding for glob-expansion is ctrl + x then *. To understand
    glob let''s look at the following'
