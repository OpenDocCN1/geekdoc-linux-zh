  md: 'Sometimes there is a need to type a longer script ad-hoc. It''s more convenient
    to use the favourite text editor to type the script line by line. For this use-case,
    there is a great edit-and-execute-command function, that is a bind to the ctrl
    + x then ctrl + e key command.


    According to bash source code (file bashline.c), the function responsible for
    this behaviour is named edit_and_execute_command. For the default (emacs) key
    bindings, the command invoked is fc -e \$(VISUAL: -EDITOR: emacs), which means
    the first variable that will be used is VISUAL then EDITOR (if VISUAL is not set),
    if none of them worked, emacs will be used. Emacs used to be a popular text editor
    (i personally know a few people that use it on a regular basis, but some of the
    most famous programmers like the great Linus Torvalds [Original creator and Lead
    of Linux development] love it) made by Richard Stallman (the guy who started the
    free/libre software movement). A side note, the default Readline bindings are
    emacs-like).


    To your favourite editor, you can add this to your ~/.bashrc file:


