  md: "# Debug bash script!\n\nDebugging is the process of finding the bugs in your\
    \ code (Thanks Captain Obvious). Even if there is no formal definition of a bug\
    \ in a common sense, it's similar to a much more defined defect. The defect is\
    \ a flaw (imperfection) or deficiency in a work product where it does not meet\
    \ requirements and/or specifications.\n\nThe first thing to do when you get an\
    \ error is actually reading it! In old languages like C or C++ you might get ultra-specific\
    \ errors like \"Core Dump (Segmentation fault)\". In modern languages, especially\
    \ in one that uses some kind of VM or interpreter, you will get something called\
    \ traceback or traceback/backtraces print the stack traces of the running program.\
    \ So, you can get the information which used which function and finally which\
    \ line leads to the error.\n\nUnfortunately, this is not the case in the bash\
    \ shell. Even if bash is a scripting language, or at least a \"sh-compatible command\
    \ language\" it won't produce meaningful traces in the case of an error. So, we\
    \ have to make them ourselves. With set -x or set -o xtrace, this simple tracing\
    \ prints each line before execution. To present it, I decided to provide the following\
    \ simple code.\n\n+   1. run.sh script\n\n```\n#!/usr/bin/env bash\n\nfoo() {\n\
    \  echo -n \"foo\"\n\n  bar\n}\n\nbar() {\n  echo -n \"bar\"\n}\n```\n\n```\n\
    main() {\n  ./lib.sh\n\n  check_euid || foo\n\n  check_euid && bar\n}\n```"
