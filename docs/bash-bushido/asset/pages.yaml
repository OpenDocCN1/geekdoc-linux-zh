    \ keep your schedule as full as possible. And in that case, a good calendar client\
    \ is a must-have.\n\n# Basic calendar\n\nThe most basic calendar in the command\
    \ line environment is the calendar. The cal program is a part of the util-linux\
    \ package. In most Linux distros, it's installed even on the most minimalistic\
