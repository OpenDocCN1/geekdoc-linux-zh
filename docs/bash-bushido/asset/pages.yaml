    The default history size might not be suitable for heavily used machines (like
    the desktops). To get more space for the history entries, we can extend it. There
    are two variables responsible for it. The first one is HISTSIZE and the second
    is HISTFILESIZE. During my research, I saw at least two discussions where they
    weren''t properly described. In the same time, the Bash manual describes them
    unambiguously. The descriptions below are taken from the Bash manual. As always
    ... is truncated.


    +   The number of commands to remember in the command history... The default value
    is 506


    +   The maximum number of lines contained in the history file. When this variable
    is assigned a value, if necessary, by removing the oldest entries, to contain
    no more than that number of lines. The default value is 500. The history file
    is also truncated to this size after writing it with an interactive shell exits.


    You can set a reasonably long history like 1000 or even 10000 entries without
    noticing the performance issue. There is also a possibility to discard any history
    with setting HISTSIZE to 0. In that case, the history will be empty.


