- img_proc: true
  md: 'Bash has a special variable PROMPT_COMMAND. According to the Bash documentation:

    If set, the value is executed as a command before issuing primary prompt

    Example:


    ```

    [Alex@SpaceShip ~]$ export PROMPT_COMMAND=''date +%F-%T | tr -d "\n"]''

    ```


    ```

    2018-08-20-22:58:22[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:23[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:26[Alex@SpaceShip ~]$ # Enter

    ```


    # Is this out-of-season April’s Fool Joke?


    Because literally no one knows about the PROMPT_COMMAND, you can make a little
    out of season April fool joke. It''s gonna be definitely better than the Diablo
    Immortal announcement.


    For your safety remember if your colleague kills you after doing that, just just
    say


    +   IT''S A PRANK

    IT''S JUST A PRANK BRO

    - Anonymous before getting shot.


    Ok let''s get to the code


    ```

    export PROMPT_COMMAND=''python -c "import random; import time;

    time.sleep(random.random()*5)\''

    ```


    Python random() will return value (0, 1) (uniform distribution). So, in the worst
    scenario, you have to wait 5 seconds for your prompt :). Another thing pointing
    out that this command works with both Python 2 and 3.


    Now you can add it to /etc/.bashrc.


    Note, as to the documentation PROMPT_COMMAND is invoked only for the interactive
    session. It might be an IDIOTIC (production, critical, non-standard configured
    hosts, services that start in an interactive session [you shouldn''t do that anyway),
    etc).


    # Clear and ctrl +1 are the same?


    The last thing I would like to show about the PROMPT_COMMAND, is that there is
    a difference between clear and ctrl+1. You can export our "prank code", and check
    that the clear command you have to wait for your prompt, but when you use ctrl+1,
    you get the cleared screen without waiting. It''s because after ctrl+1, the PROMPT_COMMAND
    is not invoked.'
  merge: -1
