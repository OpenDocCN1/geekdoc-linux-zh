  md: '# Making your own command line shortcut


    As you know from the previous chapters, the library responsible for binding shortcuts
    GNU Readline. This excellent library allows us to make our own shortcuts with
    the bind command.


    However, before you bind the key to a custom command, you should know the real
    key code that is sent to the terminal. In the case of ctrl+v the codes are obvious,
    but what about special keys? For the F9 key is encoded as ^[[20-. How do I know?
    I used the following combination: ctrl+v, F9. To get information about what function
    is bound to ctrl+ v, invoke:


    ```

    [Alex@SpaceShip] $ bind -P | grep ''\C-v''

    ```


    ```

    shell-version can be found on "\C-x\C-v".

    ```


    quoted-insert can be found on "\C-q", "\C-v", "\e[2-\].


    From the following output, it''s obvious that quoted-insert is. Quoted-insert
    is the mode in which the next key combination is displayed in verbatim (key code).


    After this short topic, you can make your own shortcut.In binding the F9 key with
    the date command.


    ```

    [Alex@SpaceShip BashBushido] # ^[[20- - F9 found in quoted mode

    ```


    ```

    [Alex@SpaceShip BashBushido] bind ''\e[20-\]:"date\n''

    ```


    ```

    [Alex@SpaceShip BashBushido] $ date F9

    ```


    Sun 23 13:43:21 2018


    The bind command has the following format bind "Key/s/s":string that will be inserted".
    Note that there is no \after date, so the date command is instantly executed.
    Another thing that is worth mentioning (we will discuss it later) that there is
    a "translation" from ^ to \.


    Another example will be ctrl+q bound to date and whoami commands. Some readers
    notice that by default ctrl+gt redundantly bound to quoted-insert.


    ```

    [Alex@SpaceShip BashBushido] # ^ - ctrl-q found in quoted-insert

    [Alex@SpaceShip BashBushido] $ bind ''\C-q'':''whoami\n'' # ctrl-q

    [Alex@SpaceShip BashBushido] whoami

    Alex

    ```


    The exercise reader for using C-insert of C-q can find anything? Note that things
    are not persistent, to "unbind" just start the new terminal/session.


    The next example is alt+q that will be bound to the uptime command.


    ```

    [Alex@SpaceShip BashBushido] # ^[q alt-q found in quoted insert

    [Alex@SpaceShip BashBushido] $ bind ''\eq'':''uptime\n''

    [Alex@SpaceShip BashBushido] uptime # alt-q

    14:00:52 1:38, 4 users, load average: 0.08, 0.07, 21

    ```


    As previously mentioned, the bound command will not work with the output of the
