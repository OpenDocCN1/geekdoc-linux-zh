    # Generate random passwords with OpenSSL


    Generating a random password is quite easy - use a good number generator (that
    part is hard!), then create a password. There is specialized program called pwgen
    that generate random passwords, but I prefer a more straightforward solution with
    that leave standard openssl.


    openssl rand -base64 $NUMBER


    Where $NUMBER is about the number of bytes. Note Base64 encoding data into 6-bit
    segments, and SSL returns the 8-bit characters. Other rules can make the string
    a bit longer. The password will be about one and one-third of the original number.
    Because Base 64 uses lowercase, uppercase, digits and special characters +, /
    and = that is also used as a pad. Pad is used when the last part (called segment)
    doesn''t contain all 6 bits.


