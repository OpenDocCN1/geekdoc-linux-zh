    like to stress that I recommend choosing the tool that will seamlessly integrate
    with your workflow.


    # # Short history of dropdown terminals


    In the life of any superuser, there is a time when you want to invoke a command
    **now** without an additional fuss like switching to another workspace/window.
    In other cases, you might wish for the nice placeholder for invoking/observing
    the time-consuming processes. In the very same time, it''s always to have a terminal
    that you can get/check right away. Of course, you might make new windows/tabs
    of your current terminal or switch between "real" terminals (TTY). But it''s ineffective.
    So, if you want a swift and convenient solution, you might try the other way -
    the dropdown terminal.


    The whole idea of a dropdown terminal came from the video games (btw. shouldn''t
    they be called computer games already?!) Yeah, that little thing according to
    the president of the United States, Donald Trump causes violence and mass shooting.
    Thank God even from such unspeakable/horrible blasphemy like the video games an
    excellent idea can arise. The dropdown terminals started with a Quake console.'
