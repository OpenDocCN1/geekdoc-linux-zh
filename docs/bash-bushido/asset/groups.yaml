    # Let''s erase our history!


    There are multiple reasons why one want to delete the history:


    - History can be not set properly, so it is storing sensitive data like "export
    MY_UNIQUE_BANK_PASSWORD=MAMA_JUST_KILLED_A_MAN"

    - You got fired, so in exchange you make a little d*** move and delete the history.
    That makes the new admin''s life a bit harder. (BTW that is one from a thousand
    reasons why you should use automation platforms like Puppet, Salt or Ansible.
    It is also quite likely that a backed up server [like a snapshot] can easily recover
    this file).

    - If you are a little freak, you can set HISTFILE to /dev/null and HISTSIZE to
    0.


    You can clear your history with history -c.


    ```

    [vagrant@localhost ~]$ history -c

    1 w

    2 df h

    3 uname a

    ...

    70 history

    [vagrant@localhost ~]$ history -c

    [vagrant@localhost ~]$ history

    1 history

    [vagrant@localhost ~]$

    ```


    It''s worth to mention that after using history -c, the history file is still
    intact (you might lose the newest part of the history, more about it in the succeeding
    subgraphs). It''s because out-of-box history is saved when you end the session.


    We can recover freshly (not removed) cleared history with history -r.


    ```

    [root@kojinew -]# history


    1 cd /etc/pki/some_service/


    2 ls


    3 ./certgen.sh nothing


    ...

    116 ./certgen.sh


    [root@kojinew -]# history -c


    [root@kojinew -]# history -r


    [root@kojinew -]# history


    1 history -r


    # ... rest of the history file

    ```


    Mnemonics:


    - history -clear

    - history -read


    # Saving lib and sharing history in real time?


    History lib is excellent, but it might be annoying when working with multiple
    terminals (sessions) at the same server over once. They share the state of history,
    then overwrite it. What is also more frustrating is that these sessions don''t
    invoke commands as long as our console session doesn''t end (but each session
    overwrites the previous one!). So ideally the following criteria should be met.


    1. History saves after each command.

    2. History is read after each command.


    You can achieve it with the previously introduced PROMPT_COMMAND.

    shopt -s histappend # Set appending to history


    # PROMPT_COMMAND was introduced previous chapter

    export PROMPT_COMMAND="history -a; history -c; history -r; $PROMPT_COMMAND


    History appends lines from current session to history file, clear it then read
    it.


    If you can''t read an important command that was invoked in another session (terminal),
    just hit enter with an empty command line. It triggers the PROMPT_COMMAND execution,
    so that the history resyncs.


    The best thing about this solution is also the worst. Imagine that you have separate
    sessions you are using quite similar commands. The "collision" with commands from
    other terminals might be dreadful. Still, it''s one of my favourite bash tricks.


    # History with date and time.


    Bash has another variable called HISTTIMEFORMAT. This variable is responsible
    for the format in time that the command execution is saved/presented. Start to
    win with timed history, set it to something meaningful, then export it.


    export HISTTIMEFORMAT="%Y-%m-%d %T "


    Please note that there is a space after %T. Without it, the commands blend with
    time. Another thing is worth noting that the old history entries (not presented
    in the current session) are stamped to the moment when the current session started.
    Look at example:


    ```

    [root]@localhost# su - test_user

    Last login: Sun 7 18:32:02 UTC 2018 on pts/0

    [test_user@localhost ~] export HISTTIMEFORMAT="%Y-%m-%d %T"

    [test_user@localhost ~] export HISTTIMEFORMAT="%Y-%m-%d %T" >> .bashrc

    [test_user@localhost ~]

    1 2018-10-07 18:32:21 echo "this is test"

    2 2018-10-07 18:32:21 echo "commands are from previous session"

    3 2018-10-07 18:32:34 echo ''export HISTTIMEFORMAT="%Y-%m-%d %T"''

    4 2018-10-07 18:32:41 echo ''export HISTTIMEFORMAT="%Y-%m-%d %T"'' >> .bashrc

    5 2018-10-07 18:32:45 history

    ```


    And here things get even interesting. Analyse this example:


    ```

    [test_user@localhost ~]$ history

    [root]@localhost# su - test_user

    [test_user@localhost ~] echo "After logout"

    after logout

    [test_user@localhost ~]$ history

    1 2018-10-07 18:35:37 echo "this is test"

    2 2018-10-07 18:35:37 echo "commands are from previous session"

    3 2018-10-07 18:32:34 echo ''export HISTTIMEFORMAT="%Y-%m-%d %T"''

    4 2018-10-07 18:32:41 echo ''export HISTTIMEFORMAT="%Y-%m-%d %T"'' >> .bashrc

    5 2018-10-07 18:32:45 history

    6 2018-10-07 18:35:44 echo "After logout"

    7 2018-10-07 18:35:44 history

    ```


    So, the previous commands (1,2) have a newer date than the latter (3,4)? BUT WHY?
    THOUSAND QUESTIONS WITHOUT ANY ANSWER? So, let''s log out, then look at our history
    from another perspective.


    ```

    [test_user@localhost ~] logout

    [root@localhost ~]# cat /home/test_user/.bash_history

    echo "this is test"

    echo "commands are from previous session/"

    #153897154

    export HISTTIMEFORMAT="%Y-%m-%d %T"

    #153897161

    echo ''export HISTTIMEFORMAT="%Y-%m-%d %T"'' >> .bashrc

    #153897165

    history

    #153897348

    echo "After logout"

    #153897348

    history

    [root@localhost ~]#

    ```


    As you can see, there is a special "#NUMBER", and this number is a Unix timestamp
    also called UNIX Epoch, unit time or Epoch. This number represents the number
    of seconds that passed from 00:00:00 1 January 1970. This is an elegant solution
    for storing a date with time with 1-second precision. So, the commands (1,2) have
    no timestamp; therefore, their execution date and time is set to the start of
    the shell process.


    # Controlling what the history forgot


    There is a possibility not to save an executed command. To do so, the space must
    be the first character. You probably already guessed that there is a particular
    Bash variable that is responsible for it - and you are right (if IT of smart people
    like YOU). The HISTCONTROL is the droid we are looking for.


    HISTCONTROL might be set to one of the following.


    1. Not set or set to an invalid value.

    2. ignorespace - lines with a space character are not saved.

    3. ignoredups - lines matching the previous history entry.

    4. erasedups - all previous lines matching the current line are removed from the
    history.

    5. ignoreboth + ignoredups


    Which one the most popular? Well, it''s quite easy to check with the GitHub search.


    | TYPE | NUMBER | GitHub Query Link |

    |---|---|---|

    | ignorespace | 8,657 | github.com/search?l=Shell&qHISTCONTROL%3Dignorespace&type=Code
    |

    | ignoredups | 15,234 | github.com/search?l=Shell&qHISTCONTROL%3Dignoredups&type=Code
    |

    | erasedups | 5,745 | github.com/search?l=Shell&qHISTCONTROL%3Derasedups&type=Code
    |

    | ignoreboth | 29,907 | github.com/search?l=Shell&qHISTCONTROL%3Dignoreboth&type=Code
    |


    The ignoreboth is definitely the winner. This phase is more popular than all competitors
    combined :). Another thing worth mentioning is because HISTCONTL is a colon-separated
    list, there is a possibility to get ignoreboth : ignorespace : ignoredups.

