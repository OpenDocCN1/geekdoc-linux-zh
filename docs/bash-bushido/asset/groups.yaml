    # Modifiers - additional operations on word designator/s


    After optional word designator, we can execute additional operations, getting
    even more control over the command line, these operations are called modifiers.
    Each modifier is prefixed with : (colons).


    For the last time in this chapter, I am going to quote the bash manual (I hope
    that GNU project won''t sue me) in the form of a table.


    | Modifier | do |

    | :--- | :--- |

    | h | Remove a trailing filename component, leaving only the head. |

    | | Remove all leading file name components, leaving the tail. |

    | | Remove a trailing suffix of the form .xxx, leaving the basename. |

    | | Remove all but the trailing suffix. |

    | | Print the new command but do not execute. |

    | | Quote the substituted words, escaping further substitutions. |

    | | Quote the substituted words with q, but break into words at blanks and newlines.
    |

    | | Substitute for the first occurrence of old in the event line, any delimiter
    can be used in place of /. The final delimiter is optional if it is the last character
    of the event line. The delimiter may be quoted in new and with a single backslash.
    If & appears in new, it is replaced by old. A single backslash will quote the
    &. If old is null, it is set to the last substituted if previous history substitutions
    take place, the last string in ?String[f] search. |

    | | Repeat the substitution. |

    | | Changes to be applied over the entire event line. This is used in conjunction
    with /s (e.g., /gs/old/new/) or /&. If used with /s, any delimiter can be used
    in place of /, and the final delimiter is optional if it is the last character
    of the event line. And may be used as a synonym for g. |

    | | Apply the following ''s'' modifier once to each word in the event line. |


