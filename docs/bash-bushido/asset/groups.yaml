    ## 自定义 TOP


    在进行自定义之前，我强烈建议使用 top 的软链接并通过它调用 top。


    ```bash

    $ sudo ln -s /usr/bin/top /usr/bin/my_top

    ```


    ```bash

    $ my_top

    ```


    现在，top 的第一行将以 my_top 开头——这是基于一个事实：top 像 Linux 中被调用的任何程序一样，它知道自己的名称。top 利用此信息让你具备创建和维护多个配置的能力。


    我建议的第一点是更改内存单位。top 并没有智能的单位缩放，它是静态的，且 KiB 对于大多数系统来说太小了，无法清理信息。有两个键负责内存缩放 - `e`
    和 `E`，用于调整摘要区域显示内存的单位。然后使用 `e` 来更改任务区域内存的显示方式。我个人习惯缩放为兆 或 GB（我从未管理过内存超过 1024 GB
    的服务器，而且我并不为此感到羞愧！）。


    现在我们可以提交更改了。使用 `W` 保存 top 设置。通过使用 procs-ng，top 的配置文件将存放在 ${HOME}/${NAME} 或新版本中的
    ${HOME}/.config/${NAME}。较新的旧版本（~/.top）会被读取，然后它使用 XDG_CONFIG_HOME 变量（默认设置为 ~/.config，除非定义了
    XDG_CONFIG_HOME）。


    下一个重要的设置是更改更新间隔（刷新和统计之间的时间）。默认值为 3 秒。可以使用 `d` 设置延迟值，例如 `d delay` 或 `a seconds`
    来请求所需的时间。我个人更偏于 5 秒。但也可以使用从 0 到 0.0001 的值（刷新的实时性取决于主机性能；top 可能会消耗 100% 的 CPU 直到超过
    31536000（每年一次））。我能得到的最大值是 2174835200（当你加上一个很小的数字时，top 将使用 2174835250，此时 top 将报告
    Unallocating point.）。但我认为这取决于版本、架构以及许多因素 - `B`。2174835250.0 超过 68 年，所以可能比我活得还长）。


    在字段管理菜单中，它绑定到 `f` 键，可以选择显示哪些字段。使用上/下箭头选择字段，使用空格键启用它们并移动，使用右箭头移动，然后使用上/下或左箭头配合左箭头将它们放置在所需的位置。必须启用你使用的默认字段！在字段管理模式下，你还可以设置
    Alt-display（备用显示模式，带有四个窗口）中可用的其他字段。使用 `w` 键切换当前编辑的窗口。默认模式使用的窗口是 1:Default。


    情况下，我需要第 NTH 字段并使用了 VIRT 字段。之后，字段将按以下方式排序：PID, USER, COMMAND, S, %CPU, NTH, USED,
    RES, SHR, %MEM, TIME+, NI, PR。


    设置好字段后，我们可以按单个 `q` 退出（双击 `q` 将退出 top 而不保存配置！），然后已经知道使用 `w` 来使配置持久化。


    关于选择字段，我强烈建议不要使用 SWAP 字段。正如之前提到的，在很多情况下，VIRT 之前可能是一个有点带误导性的指标。因为 top 在大多数情况下使用简单的公式
    SWAP-VIRT-RES 来模拟 SWAP 字段，这是完全错误的。你可以观察到在任何启用了内存的系统上，SWAP 字段的值大于 0。


    我做的最后一项配置是颜色更改。我知道很多 IT 人员（UI/UX 部门的高级例外）无法列出超过 3 种颜色，但即使你能够（我是对自己说的）将颜色设置为 -
    Don''t Panic!，top 也允许使用 8 种颜色的惊艳色板！在编辑颜色之前，你必须使用 `z` 键启用它们，这在今天很常见。


    使用 `Z` 键调用颜色更改。通过 S、M、H、T 选择目标（top 的某个部分），然后选择 0-7 之间的数字。执行此操作后，使用 Enter 保存设置并让它们变得完美。


