    of my body. Writing programs is not easy, and it''s easy to focus when you are
    "fighting" with the keyboard.


    # Reasons not to learn touch typing.


    - When you are working for a corporation, where you have plenty of time and saying
    that your work is done more important than actually doing it, then touch typing
    might improve your work performance what is not preferred.

