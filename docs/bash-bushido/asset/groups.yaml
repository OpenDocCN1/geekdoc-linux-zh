    # Ignoring particular commands.


    Well, imagine you go through the new code repository. After cloning it, you will
    probably read the README, go through the directories, list the files, go to another
    directory, grep on file, then list files, then read some file, then go to another
    directory, list files, grep on files, read a file, and so on. After something
    like this, your history is going to be cluttered with multiple cd, ls, cat, and
    grep commands variances.


    To keep the more essential commands in the history file, you can ignore the ones
    that are popular but don''t tell them much. For example, cd or ls. Once, there
    is a special Bash Variable that allows to do so = =HISTIGNORE.


    The HISTIGNORE="cd*:" I am using like:


    ```

    export HISTIGNORE="cd*:false:history:http*:ls*:la:la:popd*:pushd*:reset:top*:true"

    ```


    The * makes HISTIGNORE matching everything except the string. With it, the commands
    like Documents would be saved.


    ```

    [Alex@SpaceStation ~]$ export HISTIGNORE="cd"

    [Alex@SpaceStation ~]$ cd /tmp

    [Alex@SpaceStation tmp]$ history | tail -2

    518 cd /tmp

    519 history | tail -2

    [Alex@SpaceStation tmp]$ export HISTIGNORE="cd*"

    [Alex@SpaceStation tmp]$ cd /var

    [Alex@SpaceStation var]$]$ history | tail -2

    520 export HISTIGNORE="cd"

    521 history | tail -2

    ```


