    ## What about the Bash readme’s vi(m) mode?


    Well, the vi(m) mode sucks. Really. The reason why it sucks is quite easy to explain
    - the readme (emacs like) configuration is perfect for editing a single line.
    The strongest Features of vim. like home row navigation and the ability to repeat
    something multiple times are not very useful when you edit a single line. There
    is also a problem with the fact that Bash does not show the current vim (FISH
    shell for example does) out of the box. What it''s even more irritating is that
    some of the most useful shortcuts, like ctrl+1, won''t work. Aaaa finally, even
    with vi mode you still have to use subset of emacs.


    It''s a free country, though, if you really want to use vi mode, you can enable
    it with set -o vi.


    As a self-proclaimed vim lover, I recommend staying with emacs.


