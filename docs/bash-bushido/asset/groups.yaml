    # Why some Linux/UNIX programs have strange names?


    I know that in this chapter you won''t find exciting new command or any useful
    trick :). But... - Have you ever asked yourself why some basic Linux command/programs
    like passwd or umount have strange names? umount is the best example because there
    is an actual word - unmount! What is the reason for these peculiar names, that
    sometimes save only a single character?


    Well, it came from version 1 of UNIX. This UNIX was written in assembly and supported
    B (the predecessor of C) programming language. It also had a rather primitive
    filesystem that supports only 8-character file names, so it has to support umount
    as the command but also its sources - umount.s (s'' and ''.S'' are file extension
    for assembly language). Other lead is that the old linkers support identifiers
    up to 6 characters only.'
