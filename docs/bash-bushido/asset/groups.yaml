    key combination - the must know for all Windows users.


    However, a lot of these tricks, tips and shortcuts are not very handy unless you
    are touch-typist. Why? Because a lot of them take advantage of typical hands positions
    on the keyboard during typing. For example, the whole vim navigation was made
