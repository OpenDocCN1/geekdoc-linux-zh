    6 2018-07-31 12:26:53 history

    ```


    As the listening shows, the echo "my_new_pass3" --stdin root was not saved. Just
    as expected! Thanks to this, you can safely add secrets, passwords and tokens
    to commands without thinking about them leaking through the history file.


    ## How deep is your love history?


    The default history size might not be suitable for heavily used machines (like
    the desktops). To get more space for the history entries, we can extend it. There
    are two variables responsible for it. The first one is HISTSIZE and the second
    is HISTFILESIZE. During my research, I saw at least two discussions where they
    weren''t properly described. In the same time, the Bash manual describes them
    unambiguously. The descriptions below are taken from the Bash manual. As always
    ... is truncated.


    - The number of commands to remember in the command history... The default value
    is 506

    - The maximum number of lines contained in the history file. When this variable
    is assigned a value, if necessary, by removing the oldest entries, to contain
    no more than that number of lines. The default value is 500. The history file
    is also truncated to this size after writing it with an interactive shell exits.


    You can set a reasonably long history like 1000 or even 10000 entries without
    noticing the performance issue. There is also a possibility to discard any history
    with setting HISTSIZE to 0. In that case, the history will be empty.


    Look at the following example:


    ```

    [root@localhost ~ ~ history

    1 ls

    ```


    ```

    15 history

    [root@localhost ~]# echo export HISTSIZE="0" >> .bashrc

    [root@localhost ~]# cat .bashrc

    [root@localhost ~]# cat ~/.bash_history

    ls

    ...

    history

    echo "export HISTSIZE="0" >> .bashrc

    .bashrc

    [root@localhost ~]# logout # logout the history is saved

    [vagrant@localhost ~]# sudo -i

    [root@localhost ~]# cat .bash_history

    [root@localhost ~]# history

    [root@localhost ~]#

    ```


    I prefer both settings to be set to 2000, but there is no real science or more
    profound thought behind it. So, part of my/.bashrc file looks like:


    ```

    export HISTSIZE=2000

    export HISTFILESIZE=2000

    ```


    ## Ignoring particular commands.


    Well, imagine you go through the new code repository. After cloning it, you will
    probably read the README, go through the directories, list the files, go to another
    directory, grep on file, then list files, then read some file, then go to another
    directory, list files, grep on files, read a file, and so on. After something
    like this, your history is going to be cluttered with multiple cd, ls, cat, and
    grep commands variances.


    To keep the more essential commands in the history file, you can ignore the ones
    that are popular but don''t tell them much. For example, cd or ls. Once, there
    is a special Bash Variable that allows to do so = =HISTIGNORE.


    The HISTIGNORE="cd*:" I am using like:


    ```

    export HISTIGNORE="cd*:false:history:http*:ls*:la:la:popd*:pushd*:reset:top*:true"

    ```


    The * makes HISTIGNORE matching everything except the string. With it, the commands
    like Documents would be saved.


    ```

    [Alex@SpaceStation ~]$ export HISTIGNORE="cd"

    [Alex@SpaceStation ~]$ cd /tmp

    [Alex@SpaceStation tmp]$ history | tail -2

    518 cd /tmp

    519 history | tail -2

    [Alex@SpaceStation tmp]$ export HISTIGNORE="cd*"

    [Alex@SpaceStation tmp]$ cd /var

    [Alex@SpaceStation var]$ history | tail -2

    520 export HISTIGNORE="cd" >> .bashrc

    521 history | tail -2

    ```


    ## .bashrc generator


    As mentioned in the previous chapter - you can use https://github.com/alexowski/bashrc-generator
    to build your own bashrc. There is a separate section dedicated to Bash settings.


    ## Event designator, word designator, modifiers.


    This chapter is dedicated to some advanced features. Because the material might
    be somewhat overwhelming, the last contains the most frequent commands.


    ## What does ! mean in Bash?


    ! is a special character for the Bash shell. It''s a mighty Event Designator.
    The Bash manual explains it as: An event designator is a reference to a command
    line in the history. Unless the reference is absolute, events are relative to
    the current position in the history list. So easily speaking, ! allows us to reuse
    previous commands. The most common usage of ! (in many cases without knowing what
    it is) is invoking it with !! which is a special shortcut that invokes the last
    command as it was.


    Look at the following example:


    ```

    [Alex@SpaceStation ~]$ cat /etc/shadow | head -1

    Permission denied

    [Alex@SpaceStation ~]$ sudo !!

    cat /etc/shadow | head -1

    ```


    As said before, this is popular event designator usage that you can find in nearly
    every Bash course.


    ## Invoking a command by number in the history.


    Sometimes, it''s easier to list a subset of commands than to search interactively.
    Then you can leverage event designator by invoking it with ![NUMBER]. Look at
    the following example:


    ```

    [Alex@SpaceStation ~]$ history | grep

    1 grep -v /etc/passwd

    2 grep -n /etc/passwd

    101 grep -c /etc/passwd

    202 grep -i ~/.bash* | grep

    404 grep nologin /etc/passwd

    501 history | grep

    [Alex@SpaceStation ~]$ !404

    ```


    There is another trick with negative numbers. In multiple languages, the negative
    indexes mean that we are counting from the end instead of the start. For example,
    -1 means the last element on a list and -3 means the third element from the end.
    The same rule goes with the event designator. Look at the following example:


    ```

    [Alex@SpaceStation ~]$ echo In We Trust

    In Musk We Trust

    [Alex@SpaceStation ~]$ echo Mars

    Mars

    [Alex@SpaceStation ~]$ echo Earth

    Earth

    [Alex@SpaceStation ~]$ !-2

    Mars

    [Alex@SpaceStation ~]$ !-2

    Earth

    [Alex@SpaceStation ~]$ !-2

    Mars

    [Alex@SpaceStation ~]$ !-2

    Earth

    ```


    Some of the readers might have already noticed that we can replace !! with !1.


    ## Invoking a command starting with a string.


    To invoke the command that starts with a given string, use the event designator
    with string so that the command looks like !string. Example below:


    ```

    [Alex@SpaceStation cat1]$ !whoami

    Alex

    [Alex@SpaceStation cat1]$ who

    Alex : 0 2018-04-20 09:37 (:0)

    [Alex@SpaceStation cat1]$ !who

    who

    Alex : 0 2018-04-20 09:37 (:0)

    [Alex@SpaceStation cat1]$ !who

    whoami

    Alex

    ```


    ## Invoking a command containing the chosen string.


    !string substitutes the most recent command that contains a string. Note that
    which command is the most recent depends on your position in the history. As said
    before you can always get to the end of the history with empty command line or
    by ctrl+1.


    The usage of !string! is presented by the following example:


    ```

    [Alex@SpaceStation ~]$ echo Mamma mia

    Mamma mia

    [Alex@SpaceStation ~]$ echo ", here I go again"

    here I go again

    [Alex@SpaceStation ~]$ !??

    echo Mamma mia

    Mamma mia

    [Alex@SpaceStation ~]$ !?go

    echo ", here I go again"

    here I go again

    ```


    Note that you can omit the second ? if there are no additional arguments. To get
    what it means, look at the example:


    ```

    Alex@Normandy$ echo mama mia

    mamma mia

    Alex@Normandy$ !?mama here I go again

    echo mamma mia here I go again

    mamma mia here I go again

    Alex@Normandy$ !?mama there are additional args

    ```


    ```

    bash: !?mama there are additional args: event not found

    ```


    ## Word Designator


    Another thing in Bash is the word designator. Once more I decided to cite the
    part of the Bash manual - this time in a tabular form.

    Word designators are used to select desired words from the event. A : separates
    the event specification from a word. It may be omitted if the word designator
    begins with a %. Words are numbered from the beginning of the line, with the first
    being denoted by 0 (zero). Words are inserted into the current line separated
    by single spaces.


    | Designator | Function |

