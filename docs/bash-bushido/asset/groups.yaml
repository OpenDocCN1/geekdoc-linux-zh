    ## pv - Pipe Viewer


    One of the most irritating things about pipes is the fact that it might be hard
    to find out fast or how much data goes through it. Of course, in many cases, it''s
    possible to determine the speed, especially for I/O heavy pipes. Programs like
    iotop or iostat help determine how much read/writes are going on the disks, which
    could be a great estimate. Compute-heavy pipes are much harder to monitor.


    One of the solutions to this problem is the pv command to observe how much data
    is going through the pipe. For Enterprise Linux Distributions, you can find pv
    in the EPEL repository.


    ```bash

    sudo yum install -y epel-release

    sudo yum install -y pv

    ```


    Now imagine a real-life example - copy the image to make a bootable usb stick.
    Normally the dd is the default solution.


    ```bash

    dd if=/home/Alex/Downloads/EuroLinux.6.10-DVD-x86_64-2018-07-25.iso os=/dev/sdc
    bs=4M conv=fsync

    ```


    Unfortunately out of the box it won''t print the status. In newer versions, there
    is the status-option that can also print status/speed of dd. But there is a generic
    solution - pv.


    ```bash

    dd if=/home/Alex/Downloads/EuroLinux.6.10-DVD-x86_64-2018-07-25.iso | pv | dd
    of=/dev/sdc bs=4M conv=fsync

    1.318G 0:00:36 [ 34 MB/s ]

    ```


    It is also possible to read file with pv and redirect it.


    ```bash

    [root@SpaceShip#] pv /home/Alex/Downloads/EuroLinux.6.10-DVD-x86_64-2018-07-25.iso
    > /dev/sdc

    153MiB 0:00:14 [8.53MiB/s]

    ===> ETA 0:05:26

    ```


    I could provide more examples, but let''s be frank - as always with pipes, redirections
    and substitutions - the sky is the limit.


