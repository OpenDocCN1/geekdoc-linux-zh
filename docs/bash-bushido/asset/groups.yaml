    ## pv - 管道查看器


    关于管道（pipes）最令人烦恼的问题之一是，很难发现有多少数据通过或者速度有多快。当然，在很多情况下是可以确定速度的，特别是对于 I/O 密集型管道。像
    `iotop` 或 `iostat` 这样的程序可以帮助确定磁盘上正在进行的读/写操作，这可以是一个很好的估计。计算密集型管道则难以监控得多。


    解决这个问题的方法之一是使用 `pv` 命令来观察通过管道的数据。对于企业级 Linux 发行版，你可以在 EPEL 仓库中找到 `pv`。


    ```bash

    sudo yum install -y epel-release

    sudo yum install -y pv

    ```


    现在想象一个现实实例 - 将镜像拷贝到启动 USB 盘。通常 `dd` 是默认解决方案。


    ```bash

    dd if=/home/Alex/Downloads/EuroLinux.6.10-DVD-x86_64-2018-07-25.iso os=/dev/sdc
    bs=4M conv=fsync

    ```


    遗憾的是，它默认并不会打印状态。在较新的版本中，有一个 `status` 选项也可以打印 `dd` 的状态/速度。但有一个通用的解决方案——`pv`。


    ```bash

    dd if=/home/Alex/Downloads/EuroLinux.6.10-DVD-x86_64-2018-07-25.iso | pv | dd
    of=/dev/sdc bs=4M conv=fsync

    1.318G 0:00:36 [ 34 MB/s ]

    ```


    也可以用 `pv` 读取文件并进行重定向。


    ```bash

