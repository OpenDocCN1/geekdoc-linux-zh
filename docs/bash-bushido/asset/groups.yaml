    ```

    top -146736 14:14, 6 users, load average: 0.51, 0.45, 0.43

    ```


    On the first line, we have the name with the top that was invoked (you can have
    multiple configurations with different names), the current time and (how the system
    has been running) uptime. The following information is the number of "users".
    Note that it counts users the same way as other procs-ng commands.


    Then extremely important statistic - load average. Average usage under load system
    in the last 1, 5 and 15 minutes. By rule of thumb, the number of load average
    should be less than CPU (threads) count. Load average shows how processes wait
    possible range from 0 to infinity.


    There is also an older statistic that is not in the top, and it''s CPU utilization.
    With the CPU utilization is that its value is from 0 to CPU or Threads Count.
    So, it is a bounded function. Let''s imagine we have CPU that has 8 cores and
    disabled HyperThreading or similar technologies. The CPU utilization equal to
    8 and the load average corresponding to 8 will result in a system that is quite
    responsive, fully loaded but not overloaded. The CPU Utilization equal to 8 and
    load average equal to 12 will make the system severely overloaded, and it''s hard
    to make the simplest administrative operations on.


    The last thing that I would like to note is that the top line is identical to
    other procs-ng programs like w and uptime.


    | Tasks: 317 total | 1 running, 210 sleeping | 0 stopped, 0 zombie |


    The next part consider tasks or threads (depending on mode) that are managed by
    the Linux Kernel, and it''s quite easy to see that the top does not report all
    states of "total". The number is not equal to the sum of all others. The reason
    for it is not that all processes can be in list, for example, the idle process
    state is not present. To get all processes that are present in our system, one
    can use this simple liner.


    ```

    ps ax -o state | sort | uniq

    # OR with count

    ps ax -o state | sort | uniq -c

    ```


    One of the most interesting columns is the one counting zombie processes. To simplify
    - zombies are processes that have finished their run, and they are waiting for
    wait() from the parent process. It''s uncommon to see them because most programs
    can adequately deal with their children and in the case of orphaned process (one
    whose has finished execution before its) the init process (like system) will automatically
    call when adopting them. To this up, the multiple conditions must be met for the
    zombie process to occur.


    | CPU(s): 2.7 us, 1.2 sy, 0.0 ni, 0.0 wa, 0.1 si, 0.0 st |


    The next line has info about CPU States - there are following states:


    - us(user): time running un-idle user processes (most processes)

    - sy(system): time running kernel processes

    - ni(nice): time running kernel processes

    - idle(): time running idle (kernel idle)

    - wait(IO): time waiting for I/O

    - hi(Hardware Interrupts): time spending hardware

    - si(Software Interrupts): time spending software interrupts

    - st(stolen): time stolen from this by hypervisor


