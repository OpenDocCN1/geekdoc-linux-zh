    # Network


    In this chapter, we are going to explore network related tools, programs and tricks.
    First off there are tricks related to SSH. It is one of the most popular, heavy-used
    and battle-tested commands/services. Then we have some netcat tricks. Netcat is
    sometimes called Swiss Army Knife of Hacking Tools/Network Tools. Then you will
    learn how to scan a network and check the open ports. There are also other goodies!


    For a great start - here is one of my favourite XKDC comic:


    ![](img/6827ee835e54ef11777a367a9702258e_93_0.png)


    XKDC Devotion to Duty Comic


    # SSHFS - SSH File System


    Whenever there is a need to edit files that are on a remote server that has only
    ssh access, the following pattern occurs:


    - 1. Files are copied, locally edited, then copied back.

    - 2. Files are remotely edited.


    The first one is cumbersome, especially if you are doing live patching (it''s
    an awkward experience that I don''t recommend). The second one is good only if
    the necessary tools are available on the remote server. But what if there is another,
    better, possibility that takes what is best from both worlds?


    Well, it''s possible! You can mount remote files with sshfs, which surprisingly
    leverages SSH.


    The first and most important benefit is that you can edit live on a remote server,
    and still use your favourite programs/tools that are on your computer. The second
    benefit of sshfs is that it''s based on SSH File Transfer Protocol that is supported
    on all modern ssh clients and servers. sshfs does not require new software, permission
    management and open ports on firewalls. Moreover, SSH is one of the most battle-tested
    and secure protocols, so you can safely use it even on public networks.


    To install sshfs on Enterprise Linux systems, you should install fuse-sshfs package
    from the EPEL repository:


    ```

    sudo yum install -y epel-release

    ```


    ```

    sudo yum install -y fuse-sshfs

    ```


    FUSE is an abbreviation of Filesystem in Userspace. The sshfs is FUSE based, so
    it doesn''t require root privileges to manage mounts. Example sshfs:


    ```

    [Alex@SpaceShip ~$] sshfs Alex@server1:/var/www/static /home/Alex/static

    ```


    It will allow editing static content on server1 on the local machine. To unmount
    the FUSE-based mount, you can use the well-known:


    ```

    umount /home/Alex/static

    ```


    But it requires root privileges! If your user has sudo capability, you can use
    the sudo !! trick. But, the better solution is to use fusemount command - like
    unmount flag:


    ```

    [Alex@SpaceShip ~$] fusemount -u /home/Alex/static

    ```


    It will unmount the previously mounted mounts.


    I won''t recommend using sshfs as an always mounted production network file system,
    but it''s perfect for small changes, write/reads. The potential problem with SSHFS
    is I/O errors, but they will not corrupt the filesystem.


    # Allows to use our sshfs (and other FUSE based)


    Sometimes, sharing FUSE based resources with other users can save a lot of fuss.
    So, you have to edit /etc/fuse.conf (uncomment or add allow_other line). Then
    pass allow_other option to the mount command. There is no service that has to
    be restarted because /etc/fuse.conf is read each time the FUSE-based resource
    is mounted.


    Previous example with sshfs that makes shared mount:


    ```

    sshfs Alex@server1:/var/www/static /mnt/static -o allow_other

    ```


    # SSH with the X Server


    Sometimes you want to use a graphical tool from a host that only has the ssh enabled
    (99.9% of prod servers). For example, adding the next disk to a virtual machine
    is much easier from a hypervisor graphical console (ex. VirtualBox). In that case,
    you can easily set X11 forwarding with ssh. The -x option you must use (Yoda voice).
    A system from which you will forward GUI programs need proper libraries installed,
    if there are graphical tools, it''s likely that it already has them.


    The listening below will start firefox on the remote host:


    ```

    [Alex@SpaceShip] $ ssh -X myuser@remote

    [myuser@remote]$ firefox

    ```


    There are some security considerations. According to Red Hat 7 Security Guide,
    X11 Forwarding is not recommended for an unknown host. Another important note
    is that there is an X11 replacement that is under massive development - Wayland.
    Wayland can somehow forward in X11 style with Xwayland, but some users claim it''s
    buggy.


    # Port forwarding with ssh


    In many environments, there is a host "jump server", jump hosts or jumpbox that
    is used to access computers in another security zone (like company LAN). Sometimes
    you need to get a service (like a web server) from this node. In cases that, the
    SSH port forwarding, also called SSH tunneling, might come in handy.


    There are two types of forwarding. The first one is the local forwarding. Because
    it''s much easier to get it with an example look at the following command:


    ```

    ssh -L 9999:webserver:443 root@jumphost

    ```


    It will open the local port 9999. When you open a browser (or anything that use
    https like curl or wget) with the address http://localhost:9999, the connection
    will be transferred to jumphost, that will act as the webserver for content.


    Another way is the remote port forwarding, it is the same but reverse :). Look
    at the following example:


    ```

    ssh -R 8080:localhost:80 root@jumphost

    ```


    It will allow anyone who has access to jump servers over http://jumphost:8080
    to connect to the localhost on port 80.


    Please note that examples also use web servers, but any other protocol that uses
    TCP will work. There is also a great answer on superuser.com how to configure
    port forwarding for UDP services. You can read it here https://superuser.com/questions/53103/udp-traffic-through-ssh-tunnel.


    When it comes to ssh tunneling, there are some security considerations - because
    it''s possible to transfer anything that jump host has access to, it is wise to
    add some extra security. SSH tunneling might be used to make backdoors, so properly
    hardened host SSH daemon configuration should be intended.


    But there are also benefits of using port forwarding. For example, when you have
    an insecure web application that is using HTTP instead of HTTPS, then you can
    locally forward the connection to the server itself.


    ```

    ssh -L 9999:localhost:80 root@webserver

    ```


