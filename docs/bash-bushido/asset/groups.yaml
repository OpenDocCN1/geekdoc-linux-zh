    # 修饰符 - 对单词标识符的额外操作


    在可选的单词标识符之后，我们可以执行额外的操作，获得对命令行更强的控制力，这些操作被称为修饰符（modifiers）。每个修饰符都以 `:`（冒号）开头。


    在本章的最后，我将以表格的形式引用 bash 手册（我希望 GNU 项目不会起诉我）。


    | 修饰符 | 操作 |

    | :--- | :--- |

    | h | 移除末尾的文件组件，只保留头部。 |

    | | 移除所有开头的文件组件，保留尾部。 |

    | | 移除 .xxx 格式的尾后缀，保留文件名。 |

    | | 移除除尾后缀以外的所有内容。 |

    | | 打印新命令但不执行。 |

    | | 对替换的单词加引号，转义进一步的替换。 |

    | | 使用 q 对替换的单词加引号，但在空格和换行处拆分单词。 |

    | | 替换事件行中第一次出现的 old，可以使用任何分隔符代替 `/`。如果最后一个分隔符是事件行的最后一个字符，则它是可选的。分隔符可以在 new 中通过单个反斜杠加引号。如果
    new 中出现 `&`，它将被替换为 old。单个反斜杠将转义 `&`。如果 old 为空，如果发生了之前的历史替换，它将被设置为上一次替换的内容，即 ?String[f]
    搜索中的最后一个字符串。 |

    | | 重复替换。 |

    | | 应用于整个事件行。这通常与 /s（例如 /gs/old/new/）或 /& 结合使用。如果与 /s 一用，可以使用任何分隔符代替 `/`，如果最后一个分隔符是事件行的最后一个字符，则它是可选的。并且可以作为
    g 的同义词。 |

    | | 对事件行中的每个单词应用一次后续的 ''s'' 修饰符。 |


    是的，当你考虑 s 替换时，其余部分（gqx）决定了这种替换将如何运行。最后，你可以将事件标识符想象为：


