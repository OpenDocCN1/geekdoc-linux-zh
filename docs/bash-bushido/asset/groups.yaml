    # # Shellcheck - write better bash scripts!


    There are many ways that can be tested, but one of the fundamental distinction
    is based on whether the software is actually run. In dynamic testing, the code
    is executed, in contrast, static testing does not execute the code, but checks
    its static properties. The static testing is also white box testing because the
    tester/test engine/software engineer in test actually has access to the source
    code of the program.


    One of the most used static testing techniques is static code analysis. In most
    cases, programs that perform static code analysis and also grade the code, are
    called linters. The name linter came from "link from Unix version 7 that was looking
    for mistakes in the C programs. Nowadays, most IDEs have built-in linters to help
    avoid most mistakes/errors. Some linters give you a numeric or "school grade"
    like 8.9 or B+. A lot of GitHub repositories have badges that inform on the code
    health based on linters and other statistics.


    OK, why do I provide all this? Well, there is an absolutely flawlessinter for
    shell scripts - it''s shellcheck. Shellcheck is a script analysis tool. It also
    uses standard exit codes to inform if a code is flawed (at least at a level it
    can check));


    The official ShellCheck GitHub repository: https://github.com/koalaman/shellcheck/wiki.


    The shellcheck groups statements/bad codes based on severity, currently there
    are three categories:


    +   - Error - in most cases, the script won''t invoke properly.

    - Warning - in most cases inadequate, but syntax acceptable, code.

    - Info - from quite important to pedant information. In many cases, they don''t
    have much impact on a script and its execution.


    Installing the ShellCheck on Enterprise Linux distributions is really easy - you
    just need the EPEL repository.


    ```

    sudo yum install y-epel-release

    sudo yum install y ShellCheck

    ```


    After installation, shellcheck is invoked by any other program. One of the most
    essentials wishes is - that excludes specified error codes.


    Look at the following example:


    ```

    [Alex@SpaceShip BashBushido]$ shellcheck /usr/sbin/alsa-info.sh | wc -1

    ```


    1511


    ```

    # Excluding 2086 doublequote information

    ```


    ```

    [Alex@SpaceShip BashBushido]$ shellcheck -e 2086 /usr/sbin/alsa-info.sh | wc -1

    ```'
