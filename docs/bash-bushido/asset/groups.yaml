    # Cool-retro-term.


    There is a group of projects that I call "uncle projects" or "uncle software".
    I really like being an uncle, especially at family gatherings, you can babysit
    the baby for a short time, but when you get tired of it, you give him/her back
    to the parents. The "uncle software" is the same, it''s nice to play with it for
    a bit, but after a little while, you can just forget about it. Of course, these
    words and terms were forged by a single that will die.


    You can install the cool-retro-term from nux repos (https://linux.ro/). Or compile
    it from the source. When installing it from the source on an Enterprise Linux
    system, you should change qmltermwidget version. The following script worked for
    me:


    ```

    #!/bin/bash


    CRT_URL=https://github.com/Swordfish90/cool-retro-term/archive/1.0.1.tar.gz


    WIDGET_URL=https://github.com/Swordfish90/qmltermwidget/archive/v0.1.0.tar.gz


    sudo yum -y install qt5 qt5-qtbase qt5-qtdeclarative qt5

    qtddeclarative-devel qt5-qtgraphicaleffects qt5-quickcontrols redhat-rpm-config

    ```


    wget "SCRT_URL" -O cool-retro-term.tar.gz


    mkdir cool-retro-term && tar xvf cool-retro-term.tar.gz -C cool-retro-term --strip-components
    1


    cd cool-retro-term


    rm -rf qmltermwidget


    wget "WIDGET_URL" -O qmltermwidget.tar.gz


    mkdir qmltermwidget && tar xvf qmltermwidget.tar.gz -C qmltermwidget --strip-components
    1


    qmake-qt5


    sudo make install STRIP=true


    But simpler method to use Cool Retor Term is AppImage. AppImage is a format in
    that you should pack program and all necessary libraries in one file.


    wget https://github.com/Swordfish90/cool-retro-term/releases/download/1.1.1/Cool-'
