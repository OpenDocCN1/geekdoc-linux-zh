    # # Monitor traffic with traf-ng


    There are multiple tools to monitor traffic, the most well-known is Wireshark,
    but it''s a GUI program. There is a tshark project that allows you to get some
    of the Wireshark capabilities into CLI, but Wireshark is one of these rare programs
    where GUI is, and will be, more potent than CLI.


    But don''t lose hope! There is a tool to monitor the network from CLI, and because
    it''s a rewritten version it has -ng at the end. It''s not as robust and powerful
    as Wireshark, but it allows monitoring the most basic functions, statistics, load,
    etc. and in many cases it is enough.


    The iptraf-ng is a standard package at Enterprise Linux distribution to install
    it, you might use sudo yum install -y iptraf-ng


    The iptraf-ng requires superuser permissions. Because it''s the interactive program,
    it doesn''t require additional arguments to startup.'
