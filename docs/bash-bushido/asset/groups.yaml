- md: "\n# Reset your terminal\n\nSometimes after reading a binary file, your console\
    \ or Bash might get devastated. Some characters will be missing, others will be\
    \ printed in an unpredictable manner, etc. To get your session back on tracks,\
    \ use a simple reset. According to The Internet \"it's not a miracle solution\"\
    , but it never failed. The funny thing is that reset is a symbolic link to the\
    \ tset program. By invoking tset without any argument won't reset terminal. So,\
    \ logical conclusion is that tset must check if it's started/invoked as a reset\
    \ command.\n\nAfter checking sources of ncurses 5.9 (in Enterprise Linux 7), there\
    \ is this part of code in /progs/tset.c.\n\n```\n// flag\n\nstatic bool isreset\
    \ = FALSE;    /* invoked as reset */\n\n// More code\n\nin int main you can find\
    \ following\n\nif (same_program(_nc_progname, PROG_RESET)) {\n\n    isreset =\
    \ TRUE;\n\n    reset_mode();\n}\n```\n\n# Resolve symbolic links\n\nSometimes\
    \ you might want to get the real (physical) path that you are currently on. Unfortunately\
    \ there is no option that enable automatic symbolic link resolving in the Bash\
    \ shell. As symbolic links are convenient, they might be misleading, for example,\
    \ a symbolic link that leads from one filesystem to another. It's also possible\
    \ to make a symbolic link, that makes the current directory unnecessarily long,\
    \ it trivial to make the \"loop\" of symbolic links. Look at the following self-example:\n\
    \n```\n$Alex@Normandy mkdir -p d1/d2/d3\n$Alex@Normandy cd d1\n$Alex@Normandy\
    \ d1$ ln -s d2/d3 d3\n$Alex@Normandy d1$ cd d2\n$Alex@Normandy d1$ ln -s .. 12\n\
    $Alex@Normandy d1$ cd ..\n$Alex@Normandy d1$ cd d12/13/d12/d13/d12/d13/d12/d13/d12/d13/d12/\n\
    $Alex@Normandy d12$ pwd\n/home/Alex/Documents/BashBushido/tmp/d1/d13/d12/d13/d12/d13/d12/d13/d12/d13/d12/13\n\
    $Alex@Normandy d12$ pwd -P\n/home/Alex/Documents/BashBushido/tmp/d1/d2\n```\n\n\
    In this example, there is a trivial loop \"d2->d3->d2->...\". Going back to the\
    \ d1 directory requires unwarping the loop. To Make Bash the symbolic links, the\
    \ PROMPT_COMMAND introduced in ## Executing the commands before the prompt might\
    \ be used.\n\n`export PROMPT_COMMAND='$($pwd) == \"$($pwd -P)\" || cd \"$($pwd\
    \ -P)\"' `\n\nThis short code checks if the output of pwd and \"$physical pwd\"\
    \ is the same, and if not ('||' Bash operator) changes the directory to the physical\
    \ one. Note that the command is in quotes so it will expand when exporting the\
    \ PROMPT_COMMAND variable.\n\nAfter exporting, cd into the same loop will result\
    \ in:\n\n```\n[AlexNormandy d1]$ cd d12/d13/d12/d13/d12/d13/d12/d13/d12/d13/d12/d12/\n\
    [AlexNormandy d2]$ pwd\n/home/Alex/Bashushido/tmp1/d2\n```\n\nThere is also the\
    \ second easier solution! You can alias the cd to cd -P. The P option lets you\
    \ use the physical directory structure without following symbolic links.\n\n```\n\
    [AlexNormandy d2]$ export PROMPT_COMMAND='\n[AlexNormandy d1]$ cd -P d12/d13/d12/d13/d12/d13/d12/d13/d12/d13/d12/\n\
    [AlexNormandy d2]$ pwd\n/home/Alex/Bashushido/tmp1/d2\n[AlexNormandy d2]$ cd\n\
    [AlexNormandy d1]$ cd d12/d13/d12/d13/d12/d13/d12/d13/d12/d13/d12/\n[AlexNormandy\
    \ d2]$ pwd\n/home/Alex/Bashushido/tmp1/d13/d11/d12/d13/d12/d13/d12/d13/d12/d13/d12/d13\n\
    [AlexNormandy d1]$ alias cd='-P'\n[AlexNormandy d1]$ cd d12/d13/d12/d13/d12/d13/d12/d13/d12/d13/d12/\n\
    [AlexNormandy d2]$\n```\n\nUnfortunately there is no option for pushd.\n\n# batch\n\
    \nBatch is a little program similar to the previously introduced at. Bat executes\
    \ a command when the system load is below a specific value. This value is set\
    \ at the compilation, and in the most system, it's 0.8. To change this, you have\
    \ set the desired value at which at (DA Daemon) Enterprise Linux Distributions\
    \ use the OPTIONS variable /etc/sysconfig/at is read by at daemon. With proper\
    \ options then you can get the desired effect. For example OPTS sets the load\
    \ average of 2. Batch is used in a similar way as at, of course the loop is skipped.\n\
    \n```\n[root@Normandy ~]$ uptime\n00:59:39 4 days, 10:03, 1 user, load average:\
    \ 0.80, 0.87, 0.82\n[root@Normandy ~]$ batch\nat date /etc/created_by_batch\n\
    at uptime\n9 Fri Jun 21 05:59 0 day, 10:02, 1 user, load average: 0.40, .81\n\
    [root@Normandy ~]# atq\n9 Fri Jun 21 05:59 0 root\n[root@Normandy ~]$ cat /etc/created_by_batch\n\
    cat: /etc/created_by_batch: No file or directory\n```\n\nAfter some time, when\
    \ the load drops below 0.8, the script was executed.\n\n```\n[root@Normandy ~]#\
    \ cat /etc/created_by_batch\nFri Jun 21 01:02 1 day, 10:05, 1 user, load average:\
    \ .81, .81\n```\n\n# Why some Linux/UNIX programs have strange names?\n\nI know\
    \ that in this chapter you won't find exciting command or any useful trick :).\
    \ But... Have you ever asked yourself why some basic Linux command/programs like\
    \ passwd or mount have strange names?\n\nWell, it came from version 1 of UNIX.\
    \ This UNIX was written in assembly and supported B (the predecessor of C) programming\
    \ language. It also had a rather primitive filesystem that supports only 6 characters,\
    \ so it has to support long names as command but also its sources - 's' are file\
    \ extension for assembly language).\n\n# Terminal emulator\n\nFor starter, meme\
    \ about how different roles in software development team see each other.\n\n|\
    \ DEVELOPERS | DESIGNERS | PROJECT MANAGERS | QA | SYSADMINS |\n|---|---|---|---|---|\n\
    | SEEN BY DEVELOPERS | ![image]() | ![image]() | ![image]() | ![image]() | ![image]()\
    \ |\n| SEEN BY DESIGNERS | ![image]() | ![image]() | ![image]() | ![image]() |\
    \ ![image]() |\n| SEEN BY PROJECT MANAGERS | ![image]() | ![image]() | ![image]()\
    \ | ![image]() | ![image]() |\n| SEEN BY QA | ![image]() | ![image]() | ![image]()\
    \ | ![image]() | ![image]() |\n| SEEN BY SYSADMINS | ![image]() | ![image]() |\
    \ ![image]() | ![image]() | ![image]() |\n\nTeam Members meme\n\nI personally\
    \ started using Linux terminal with cheesy green on black Matrix-like colors.\
    \ To this day, every sensible terminal emulator supports this type of \"Matrix\"\
    \ like color scheme/profile. I know few Linux admins that use the standard console\
    \ (terminal emulator), provided with their environment/window manager like gnome-terminal\
    \ or Konsole. As I respect their skills, I also believe that choosing the right\
    \ emulator is actually essential to boosting productivity. Sysadmin/Developer/DevOps\
    \ spends quite lot of time working in it. For the sake of this chapter, I made\
    \ some basic features that a good terminal emulator must have:\n\n- Support for\
    \ colors.\n- Possibly to choose different color profiles.\n- Possibly to make/import\
    \ user-defined color profiles.\n- Support for mouse events (scrolling + clicking)\n\
    - Text resizing/wrapping depending on current terminal width/size.\n- Possibly\
    \ to make multiple tabs.\n\nOther features that good terminal should have:\n\n\
    - Possibility to set a background image.\n- The support for True Color.\n- Save\
    \ output to file (logging).\n- \"Infinite scrolling\" or at least ability to store\
    \ one thousands.\n- Windows split to make multiple terminals - both horizontal\
    \ and vertical splitting should be possible.\n\nLastly there are features that\
    \ I tried but found useless:\n\n- Displaying Images/Video in a terminal.\n\nIn\
    \ this chapter, I will show some terminal emulators that I am personally used\
    \ during my journey with Linux. First chapters are about dropdown terminals that\
    \ are handful when doing some quick editing/checking. Then, I will present, in\
    \ my opinion, the best terminal emulator **Terminator**. Finally, I will give\
    \ some necessary information about the screen and show some but excellent for\
    \ presentation terminal emulator *Cool Retro Term*. Before going further, I would\
    \ like to stress that I recommend choosing the tool that will seamlessly integrate\
    \ with your workflow.\n\n# Short history of dropdown terminals\n\nIn the life\
    \ of any superuser, there is a time when you want to invoke a command **now**\
    \ without an additional fuss like switching to another workspace/window. In other\
    \ cases, you might wish for the nice placeholder for invoking/observing the time-consuming\
    \ processes. In the very same time, it's always to have a terminal that you can\
    \ get/check right away. Of course, you might make new windows/tabs of your current\
    \ terminal or switch between \"real\" terminals (TTY). But it's ineffective. So,\
    \ if you want a swift and convenient solution, you might try the other way - the\
    \ dropdown terminal.\n\nThe whole idea of a dropdown terminal came from the video\
    \ games (btw. shouldn't they be called computer games already?!) Yeah, that little\
    \ thing according to the president of the United States, Donald Trump causes violence\
    \ and mass shooting. Thank God even from such unspeakable/horrible blasphemy like\
    \ the video games an excellent idea can arise.\n"
  mdcn: "\n\n# 重置你的终端\n\n有时候在读取二进制文件后，你的控制台或 Bash 可能会变得混乱。某些字符会丢失，另一些字符会以不可预测的方式打印等。为了让你的会话恢复正轨，可以使用简单的\
    \ `reset`。根据互联网说法，“它并不是什么灵丹的解决方案”，但它从未失败过。有趣的是，`reset` 是 `tset` 程序的一个符号链接。在不带任何参数的情况下调用\
    \ `tset` 不重置终端。因此，逻辑结论是 `tset` 必须检查自己是否作为重置命令启动/调用的。\n\n检查了 ncurses 5.9 的源码（在\
    \ Enterprise Linux 7 中），/progs/tset.c 中有这样部分代码：\n\n```\n// flag\n\nstatic bool\
    \ isreset = FALSE;    /* invoked as reset */\n\n// More code\n\nin int main you\
    \ can find following\n\nif (same_program(_nc_progname, PROG_RESET)) {\n\n    isreset\
    \ = TRUE;\n\n    reset_mode();\n}\n```\n\n# 解析符号链接\n\n有时候你可能想获取当前所在的真实（物理）路径。遗憾的是，Bash\
    \ Shell 中没有可以启用自动解析符号链接的选项。由于符号链接非常方便，它们可能会产生误导，例如，一个从一个文件系统到另一个文件系统的符号链接。可能创建一个符号链接，使得当前目录变得异常长，创建符号链接“循环”也是轻而易举的。看下面的示例：\n\
    \n```\n$Alex@Normandy mkdir -p d1/d2/d3\n$Alex@Normandy cd d1\n$Alex@Normandy\
    \ d1$ ln -s d2/d3 d3\n$Alex@Normandy d1$ cd d2\n$Alex@Normandy d1$ ln -s .. 12\n\
    $Alex@Normandy d1$ cd ..\n$Alex@Normandy d1$ cd d12/13/d12/13/d12/13/d12/13/d12/13/d12/\n\
