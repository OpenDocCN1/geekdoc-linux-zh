    ## 使用 Nmap 扫描端口


    在执行网络扫描之前，你应该获得书面许可，允许你执行此操作。nmap.org 上有一个非常好的示例 - https://nmap.org/book/legal-issues.html，它提供了一个可能发生情况的真实案例。


    尽管如此，在收到警告后，用户经常使用 nmap 来扫描自己的网络。它非常受欢迎，以至于许多发行版的仓库都包含了它。在 EL7 上安装它非常简单：


    ```

    sudo yum install nmap

    ```


    现在你可以开始扫描你的网络了 :)。我个人用它来确定那些“被遗忘”的主机的开放端口，并查找打印机的 IP 地址。


    扫描 TCP 端口，请使用：


    ```

    nmap -sT HOST

    ```


    扫描 UDP 端口，请使用：


    ```

    nmap -sU HOST

    ```


    要启用操作系统检测，请使用：


    ```

    nmap -O --scan-guess HOST

    ```


    最常用的选项是 -A（类似 all）配合 -T4。-T 选项设置时间，可能可以使用所有名称。值范围从 0 到 5，或者从偏执（0）到疯狂（5）。4 也称为激进模式（aggressive）。-A
    选项包括操作系统检测、版本检测、脚本扫描和跟踪路由。一如既往，这些可以在 nmap 手册中找到。


    ```

    nmap -A -T insane 192.168.121/24

    ```


    要扫描整个网络（你工作场所的本地网络），只需选择任意 IP 并添加掩码（nmap 会自动将其转换为网络）。


    要获取更多关于 nmap 的信息，我推荐访问官方网站 - nmap.org，那里有一个专门的书籍章节。Nmap 的作者“Fyodor” Lyon 写的这本书，其中有一半的内容可以在线阅读
    - https://nmap.org/book/toc.html。如果你对网络扫描真的感兴趣，可以考虑购买官方书籍；这样你既支持了开发并向作者表达了谢意。


