    # Word Designator


    Another thing in Bash is the word designator. Once more I decided to cite the
    part of the Bash manual.

    Word designators are used to select desired words from the event. A : separates
    the event specification from a word. It may be omitted if the word designator
    begins with a %. Words are numbered from the beginning of the line, with the first
    being denoted by 0 (zero). Words are inserted into the current line separated
    by single spaces.


    Of course, the word designator is optional, the quite exciting is the fact that
    it is also optional when we are using modifiers (we will talk about them). Before
    showing some samples, I would like to once more quote part of the bash documentation
    - this time in a tabular form.


    | Designator | Function |'
- md: '

    | θ (zero) | The zeroth word. For the shell, this is the command word. |

    | n | The nth word. |

    | ^ | The first argument. That is, word 1. |

    | $ | The last argument. |

    | x-y | A range of words -y abbreviates \0-y. |

    | * | All of the words but the zeroth is a synonym for **1-$**. It is not an error
    to use \* If there is just one word in the event; the empty string is returned
    in case. |

    | x* | Abbreviates x-. |

    | x- | Abbreviates x-*, but omits the last word. |

    | % | The word matched by the most recent ?string? search. |


    If a word designator is used without an event number, the last event is used.


    The word designator usages are presented with the following examples:


    ```

    [Alex@SpaceShip ~]$ echo use printf use echo\n

    ```


    ```

    printf use echo\n

    ```


    ```

    [Alex@SpaceShip ~]$ !!:2* # You can also use :!2*

    ```


    ```

    printf use echo\n

    ```


    ```

    use echo

    ```


