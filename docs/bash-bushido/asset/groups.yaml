    # # TERMINATOR make terminal grid again!


    The Terminator describes itself as - "Multiple GNOME terminals in one window".
    Terminators allow you to arrange terminals in grids or as not technical colleges
    says in "Matrix". In contrast to tmux and screen, to leverage most of the Terminator
    features you don''t have to learn a lot of shortcuts or to make a complicated
    configuration file. In other words, the Terminator is user-friendly, a typical
    zero entry program that shines without any configuration. Most of the operations
    can be achieved with mouse, effortlessly learning any shortcut.


    To install Terminator on Linux distributions:


    ```

    sudo yum install -y epel-release

    sudo yum install -y terminator.

    ```


    I also made by of the newer version that is available on OBS (Open Build Service)
    supported and maintained by one of my favourite company SUSE, https://build.opensuse.org/repositories/home:alex_baranowski/terminator-1.9-ep7.


    After installing the Terminator, you can right-click and select horizontal or
    vertical split, that will split the terminal window into two. Another capability
    of Terminator is support drag and drop, so you can easily arrange your terminal
    "matrix" with few clicks and impress less-'
