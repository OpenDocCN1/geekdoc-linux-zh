    - 你在打字时就能看到错误（你看着的是显示器，而不是键盘）。所以，发现并纠正错误的概率更高。

    - 当你写邮件时，你看起来不像像阿米士人。

    - 从你的角度来看，最有优势的事实是，我的大脑和我正在编写的代码（文本）之间没有障碍。键盘是我身体的“延伸”。写程序并不容易，当你正与键盘“搏斗”时，你很容易集中注意力。


    # 不学习盲打的理由。


    - 当你在一家公司工作时，你有充足的时间，并且说你的工作完成了比实际完成它更重要，那么盲打可能会提高你的工作表现，这反反不受欢迎的。

