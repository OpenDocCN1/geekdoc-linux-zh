    One of the most interesting columns is the one counting zombie processes. To simplify-
    zombies are processes that have finished their run, and they are waiting for wait()
    from the parent process. It''s uncommon to see them because most programs can
    adequately deal with their children and in the case of orphaned process (one whose
    has finished execution before its) the init process (like system) will automatically
    call when adopting them. To this up, the multiple conditions must be met for the
    zombie process to occur.


