    > 12:37 PM · 18 Sep 18\n> 157 Retweets 386 Likes\n\nTo learn the basics of vim:\n\
    \n- Install vim: sudo yum install -y vim.\n- Invoke vimutor.\n\nVimtutor should\
    \ take you about 25-30 minutes, and it's worth every second of your time.\nTo\
    \ make your default editor, you can use the following code:\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ { grep -q \"EDITOR=vim\" .bashrc && echo \"EDITOR=vim is already set\" ;\
    \ } | echo \"export EDITOR=vim\" >> ~/.bashrc\n```\n\n## I don't need vim - I\
    \ have my powerful IDE.\n\nit's true - vim is small, even with the best plugins,\
    \ most popular IDEs will probably in many aspects surpass it. However, as said\
    \ before, nearly all IDEs have the vim plugin. With this approach, you can get\
    \ the best of two worlds. A lot of my \"serious\" development is done with JetBrains\
    \ IDE's. Fortunately, the IdeaVim plugin supports all of the most popular operations.\n\
    \n## Edit file over ssh, HTTP, FTP and more with Vim.\n\nAs console warriors,\
    \ sometimes we must edit remote files. We usually log into a machine and then\
    \ open our editor of choice. The second option is to copy the file, edit it on\
    \ our machine then overwrite it over the target machine.\n\nIn the first solution,\
    \ the editor of our choice must be present on the machine (don't expect vim, but\
    \ vi will be on 99.9% systems). Even if we had the editor of our choice: we lose\
    \ the whole (amazing) configuration, favourite plugins and custom bindings.\n\n\
    The second solution requires three steps (copy, edit, push into the host) - so\
    \ it might be too long (it's easy to script through).\n\nFortunately, there is\
    \ also another vim specific solution that is way cooler! You can ask vim politely\
    \ to edit a remote file.\n\n```bash\n#vim PROTOCOL://USER@HOST::/PATH\n```\n\n\
    ```bash\nvim scp://alex@jumphost:/etc/ssh/sshd_config\n```\n\nSupported protocols\
    \ include:\n- ftp\n- http\n- rcp\n- scp\n\n## Further reading about vim\n\nThe\
    \ best way to start a journey with vim is to use the vimutor. Other resources\
    \ that I can recommend : help that is built in vim, vim.org and vim.fandom websites.\n\
    \n## Calendars\n\nIn this chapter, we discuss an exceptionally lightweight topic\
    \ - how to use calendars from the command line. Calendars are ultra-important\
