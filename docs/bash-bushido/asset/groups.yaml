    # # Most important terminator shortcuts:


    +   * ctrl + shift + o - open new terminal horizontally.

    * ctrl + shift + e - open new terminal vertically.


    There is very simple mnemotechnique for it.


    +   * ctrl + shift + horizontally.

    * ctrl + shift + vVertically.


    Now when you have multiple terminals, you would probably like to navigate seamlessly
    (without using mouse):


    +   * alt + i - Move to upper terminal.

    * alt + j - Move to lower terminal.

    * alt + k - Move to terminal on the left.

    * alt + l - Move to terminal on the right.


    What you really have to remember is alt + direction arrow. It''s trivial and intuitive.


    Another handy feature is the ability to maximize single terminal - I personally
    named it focus mode:


    +   * ctrl + shift + x - maximize the terminal you are currently working on. To
    undo this operation

    ("restore all terminals") use same shortcut.


    # # Fancing with tabs


    Terminator allows creating multiple tabs. Each tab can have multiple terminals:


    +   * ctrl + t - add new tab. Tab vanish when all terminals are closed.

    * ctrl + Page UP - move to the previous tab.

    * ctrl + Page DOWN - move to the next tab.


    # # Broadcasting


    Broadcasting multiply your input to other terminals, it''s handy when setting
    up with multiple systems.


    +   * alt + a - turn broadcast to on all terminals.'
