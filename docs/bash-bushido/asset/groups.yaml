    # Tee - split the output.


    In many cases, when you invoke the command, you want to get an output of the invoked
    command put that into the log at the same time. In cases like these, tee command
    is the answer to your thought and prayers.


    From tee info pages: The ''tee'' command copies standard input to standard output
    and also to any files given. This is useful when you want not only some data down
    a pipe, but also to save a copy. For example, to start the application and have
    a log with a date:


    ```

    [Alex@SpaceShip bin]$ /standalone.sh | tee $(date +%T).log

    ```


    There is also a possibility to get the log result in a different date:


    ```

    my_log=$(date +%T).log

    /start_app_server.sh & tail -f $my_log

    ```


    This is an acceptable course of course there are slight differences - put /start_app_server.sh
    in the background and there is a slight possibility that tail won''t catch the
    beginning of log. The real power of tee is the ability to get results or put a
    copy of the output into multiple processes:


    ```

    grep1=''grep -v "^"''

    grep2=''grep -i "IP:"''

    grep3=''grep \.8''

    catlogfile | tee grep1.log | grep2 | tee grep2.log | grep3 | tee final

    ```


    These pipe commands can be optimized by removing cat. As you can see, the tee
    appends to the final file. The results of the next in separate files. The final
    tee results is another great example:


    ```

    wget -O http://example.com/dvd.iso | tee >(md5sum) > dvd.md5

    ```


    In this case, we use wget to stdout - then pipe to tee that splits our output
    to new processes and finally saved it. Note that this is parallel, so it''s faster
    than downloading and computing sums. The most useful option of tee is -a or --append.
    If the file exists, it''s not overwritten but appended. The largest usage of tee
    is combining with such. Try the following example:


    ```

    [Alex@SpaceShip-$] echo "export EDITOR=vim" >> /etc/bashrc

    bash: /etc/bashrc Permission denied


    [Alex@SpaceShip-$] sudo echo "export EDITOR=vim" >> /etc/bashrc

    bash: /etc/bashrc Permission denied


    [Alex@SpaceShip-$] echo "export EDITOR=vim" | sudo tee -a /etc/bashrc

    export EDITOR=vim


    [Alex@SpaceShip-$] tail -f /etc/bashrc

    export EDITOR=vim

    ```


