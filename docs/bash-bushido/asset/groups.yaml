    definition of touch typing on Wikipedia. To sum it up - touch typing is the ability
    to use (type on) the keyboard without looking at it.


    # Reasons to learn touch typing.


    - Average typing speed is about 40 WPM (word per minute), people who type without
    looking at the keyboard can type twice fast as average. Note that the average
    typing speed includes the group of touch-typers.

