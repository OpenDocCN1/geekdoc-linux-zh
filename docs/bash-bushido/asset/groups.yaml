    # Cat as a simple text editor?


    Not so many people know that cat is an abbreviation of concatenating, that is
    an operation of putting two or more strings together. It''s an essential operation
    in the formal language theory. Cat with redirection can also be used to write
    to file. You can invoke the cat with an output redirect to file, then type the
    desired content, and finally, you use ctrl + (^). That will send End-of-file (EOF):


