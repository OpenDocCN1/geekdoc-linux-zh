    ## 配置 Bash


    本章专门介绍各种 Bash 配置选项。当 Bash 作为交互式 shell 启动时，会读取以下配置文件：


    - 1. /etc/profile

    - 2. ~/bash_profile

    - 3. ~/bash_login

    - 4. ~/profile

    - 5. ~/.bashrc

    - 6. ~/.bash_logout

    - 7. ~/.bash.bash_logout


    为了保持简单（KISS 原则），大多数 Linux 用户将他们的配置放在于一个文件中——`~/.bashrc`。


    ## 配置你的提示符 (prompt)


    用户默认获取的默认 `.bashrc` 配置（至少在大多数发行版中）位于 `/etc/skel/.bashrc`（在创建用户时，`/etc/skel/` 的内容会被复制到家目录）。很多情况下，这个
    `.bashrc` 会读取 `/etc/bashrc`，该文件将 `PS1` 环境变量设置为类似于 `PS1="\u@\h \W\$ "` 的内容。


    这个提示符翻译为 `[USER@HOST 工作目录]`。对于提示符来说这是一个合理的默认配置，可能足够了。但是，如果你想要一个彩色的、自定义的提示符，可以使用帮助构建提示符的网站之一（它们非常棒且实用）。或者，阅读
    `man bash` 中的 `PROMPING` 部分并编写你自己的。


    我最喜欢制作自定义提示符的工具是 `https://zprompt.net/`。你可以在那里生成漂亮的彩色、自定义的提示符，然后将其复制到 `~/.bashrc`。如果这还不够，你可以阅读关于设置提示符、如何在文本上启用特定颜色、制作更符合你品味的内容。当你的终端支持真彩（终端中是
    1600 万种颜色而不是 256 色）时，这可能特别有用。有一个优秀的 GitHub 项目专门描述了它。它是 DuckDuckGo 搜索引擎的第一个结果（该搜索引擎不会进行个性化输出，因此比
    Google 可靠得多）。我使用的查询词是 "terminal colour support"。如果这个小建议不能说服你，这里是链接 - https://github.com/XVhika/B346728。


    ## 在提示符之前执行选定的命令


    Bash 有一个特殊的变量 `PROMPT_COMMAND`。根据 Bash 文档：

    如果设置了该变量，值将在发布主提示符之前作为命令执行。

    示例：


    ```

    [Alex@SpaceShip ~]$ export PROMPT_COMMAND=''date +%F-%T | tr -d "\n"''

    ```


    ```

    2018-08-20-22:58:22[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:23[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:26[Alex@SpaceShip ~]$ # Enter

    ```


    Python 的 `random()` 将返回 (0, 1) 之间的值（均匀分布）。因此，在最坏的情况下，你需要等待 5 秒才能看到提示符 :)。另外一点是，该命令同时适用于
    Python 2 和 3。


    现在你可以将其添加到 `~/.bashrc` 中。


    注意，根据文档，`PROMPT_COMMAND` 仅在交互式会话中调用。它可能是愚蠢的（生产环境、关键环境、非标准配置的主机、在交互式会话中启动的服务[你本就不应该这样做]等）。


    ## clear 和 ctrl+1 是一样的吗？


    关于 `PROMPT_COMMAND` 我想展示的最后一点是，`clear` 和 `ctrl+1` 之间存在差异。你可以导出“玩笑代码”，并检查 `clear`
    命令需要等待提示符，但当你使用 `ctrl+1` 时，你会直接得到清除后的屏幕而无需等待。这是因为在 `ctrl+1` 之后，不会调用 `PROMPT_COMMAND`。


    ## 创建自己的命令行快捷键


    正如你在前面的章节中了解的，负责绑定快捷键的库是 GNU Readline。可以使用 `bind` 命令创建自己的快捷键。


    然而，在将键绑定到自定义命令之前，你应该知道发送到终端的实际键码。对于 `ctrl+v`，代码是显而易见的，但特殊键呢？F9 键被编码为 `^[[20-`。我如何知道的？我使用了以下组合：`ctrl+v,
    F9`。要获取关于 `ctrl+v` 绑定了什么函数的信息，调用：


    ```

    [Alex@SpaceShip] $ bind -P | grep ''\C-v''

    ```


    ```

    shell-version 可以在 "\C-x\C-v" 找到。

    ```


    quoted-insert 可以在 "\C-q", "\C-v", "\e[2-" 找到。从下面的输出可以看出，显然 `quoted-insert` 是这个。`quoted-insert`
    是显示下一个键组合的模式。

