    # # Cat as a simple text editor?


    Not so many people know that cat is an abbreviation of concatenating, that is
    an operation of putting two or more strings together. It''s an essential operation
    in the formal language theory. Cat with redirection can also be used to write
    to file.


    You can invoke the cat with an output redirect to file, then type the desired
    content, and finally, you use ctrl + (^). That will send End-of-file (EOF):


    ```

    [Alex@SpaceShipBashBushido]$ cat > x

    This is Bash Bushido

    This is BB

    I quit with CTRL+D

    [Alex@SpaceShipBashBushido]$ cat x

    This is R Bash Bushido

    This is BB

    I quit with CTRL+D

    [Alex@SpaceShipBashBushido]$

    ```


    You can make some configuration scripts, that will use cat to write the desired
    files. Look at this example:


    ```

    FULL_VER=$(grep - "[0-9].[0-9]*" /etc/system-release)

    ```


