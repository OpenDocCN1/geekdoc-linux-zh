    # Print lines based on the lines number.


    sed is one of the mysterious, powerful tools from Unix that only guys with beards
    longer than their... FINGERS can understand. SED stands for Stream Editor - it
    means that it takes stream (the file, pipe, stdin) of characters and performs
    an operation on it. That''s it; it sounds simple but like a lot of things in Unix
    - the simple, clean can be used in powerful tools.


    One of the easiest problems that can be solved with sed is printing only selected
    lines. To do so, use ''Np'' command. The N and M are numbers of lines when p is
    sed command that accepts address range. In the example below, lines from 3 to
    10 are printed.


    ```

    [root@Normandy ~]# cat -n /etc/passwd -n passwd # cat -n the lines

    [root@Normandy ~]# sed -n ''3,10'' n passwd

    3 daemon:x:2:2:daemon:/sbin:/bin/nologin

    4 admin:x:3:4:adm:/var/adm:/sbin/nologin

    5 lp:x:4:7:lp:/var/spool/lpd:/bin/nologin

    6 sync:x:5:0:sync:/sbin/bin/sync

    7 shutdown:x:6:0:shutdown:/sbin:/bin/shutdown

    8 halt:x:7:0:halt:/sbin:/bin/halt

    9 mail:x:8:12:mail:/var/spool/mail:/sbin/nologin

    10 operator:x:11:0:operator:/root:/sbin/nologin

    ```


    There is a possibility to get similar results without sed, but they require multiple
    commands and slower.


    ```

    [root@Normandy ~]# cat n_passwd | head -10 | tail -8


    3 daemon:x:2:2:daemon:/sbin:/bin/nologin


    4 admin:x:3:4:adm:/var/adm:/sbin/nologin


    5 lp:x:4:7:lp:/var/spool/lpd:/bin/nologin


    6 sync:x:5:0:sync:/sbin/bin/sync


    7 shutdown:x:6:0:shutdown:/sbin:/bin/shutdown


    8 halt:x:7:0:halt:/sbin:/bin/halt

    ```'
