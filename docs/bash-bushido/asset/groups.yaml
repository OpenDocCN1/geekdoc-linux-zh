- md: '

    # Essential Bash Shortcuts


    Some inexperienced Linux users use arrows to navigate the command line. You can
    use up and down arrows to change the current position in the history (previously
    executed commands) and left or right arrow to change the current position of the
    cursor. It is simple, intuitive and slow.


    When I see a Linux administrator/developer/poweruser using arrows to navigate
    on the command line, something breaks inside of me as this is one of the saddest
    view in the world. People who operate of the greatest achievements of humankind
    (Unix/Linux Operating System) don''t use the console properly! How someone for
    whom command line is bread and butter for more than ten years might not know the
    basic key bindings? Well, the answer is obvious - they never read "Bash Bushido",
    Bash Manual or info pages using the GNU Readline!


    # GNU Readline


    Bash, like most software, uses the external/shared libraries to implement the
    functionalities. When it comes to reading and manipulating the user input, Bash
    uses the popular GNU Readline library. One of its core features is the control
    of the line that you are currently typing. This lib (it''s common to use the abbreviation
    for library) is as old as the Universe Bash. So, it has an extremely stable and
    mature interface. Actually, lots of software working in the REPL (Read-Eval-Print
    Loop) manner uses GNU Readline as the input library or readline-like shortcuts
    to navigate/control the line. Some of the examples are python, perl or psql -
    the PostgreSQL interactive terminal.


    To get the current Readline configuration, you can use bash built-in.


    ```

    [Alex@SpaceShip ~]$ bind -P

    ```


    abort can be found on "\C-g", "\C-x\C-g", "\e-C-g".


    accept-line can be found on "\C-j", "\C-m".


    alias-expand-line is not bound to any keys


    arrow-key-prefix is not bound to any keys


    ... (output truncated)


    There is a ton of commands! Don''t panic! Throughout this book, you will read
    about the most important ones.


    # Previous and next command. ↑ and ↓.


    The ctrl + p shortcut works the arrow up (which asks Bash history about the previous
    command). The opposite is ctrl + n (which asks the bash for the next command in
    the history). With these two shortcuts, you don''t have to move your right hand
    to the arrow area to go through the Bash history.


    ```

    $Alex@SpaceShip ~$ echo 1

    ```


    1


    ```

    $Alex@SpaceShip ~$ echo 2

    ```


    2


    ```

    $Alex@SpaceShip ~$ echo 3

    ```


    3


    ```

    $Alex@SpaceShip ~$ echo 3 # After ctrl+p

    ```


    ```

    $Alex@SpaceShip ~$ echo 2 # After ctrl+n

    ```


    ```

    $Alex@SpaceShip ~$ echo 3 # After ctrl+n

    ```


    Mnemonics:


    - ctrl + previous command

    - ctrl + next command


    # Character forward and backwards. → and ← arrows.


    To move forward by one character, use ctrl + f, and to move the cursor backward
    by one character, ctrl + b. After remembering these and previous shortcuts, the
    arrows become obsolete.


    Mnemonics:


    - ctrl + forward

    - ctrl + backward


    # home and end keys


    Instead of using home key (moves the cursor to the beginning of the current line)
    and end key (moves the cursor to the end of the current line), which, by the way,
    is not that bad (it shows some can read what is written on the keyboard that she/he/they
    is sitting in front of EARS or even decades of life). You can use ctrl+ key combination
    that works the end key and ctrl+ a key combination that works like the home key.


    Mnemonics:


    - ctrl + end

    - ctrl + append to the end


    You might ask yourself if it''s really better than home and end keys. Well, yes!
    Even if you have to move your left hand a little bit to hit ctrl, the movement
    is by far shorter than the right hand leaving the typing area to get to the navigation
    keys area.


    # Delete and backspace


    Surprisingly, many people don''t know the difference between backspace and delete
    keys. The backspace key removes the character before the cursor, while delete
    key removes the character under the cursor.


    Armed with this theoretically obvious knowledge, you can learn two different shortcuts.
    ctrl + d removes the character under the cursor. ctrl + h removes the character
    before the cursor. I hope that you didn''t think there will be an actual shortcut
    for the backspace key.


    Mnemonics:


    - ctrl + delete

    - ctrl + h - sound that makes a click when it wants to remove the character before
    the cursor.


    # Different ways to Enter!


    This one is quite useless because the enter key is exceptionally close to your
    right-hand''s little finger, if you want, you can use ctrl + j or ctrl + m instead
    of the regular boring enter key. Both of those shortcuts are bound to the accept-line
    function.


    ```

    [Alex@SpaceShip ~]$ bind | grep ''C-m''

    ```


    accept-line can be found on "\C-j", "\C-m".


    # One word forward and backward.


    Up until this moment, you have learned a bunch of useful shortcuts, but each of
    them can be replaced with a single key-stroke. The really powerful shortcuts are
    those which are not represented by a single keyboard key - the first one you will
    learn is moving forwards and backwards but by the distance of whole words instead
    of one pitiful character. The **alt + f** and **alt + b** combinations move the
    cursor forwards and backwards by one word, respectively.


    Mnemonics:


    - alt + forward

    - alt + backward


    # Remove from the cursor position to the end of the word.


    You might already notice that some shortcuts have a more **powerful** version
    when you hit **alt** key instead of **ctrl** key. **ctrl + d** removes one character
    when **alt + d** removes the whole word.


    Note: There is group of shortcuts that uses both **alt** and **ctrl** in most
    cases the version with **alt** way more powerful.


    Mnemonics:


    - alt + delete


    # Remove from the cursor to the {start, end} of command line


    To remove all text from the current cursor position to the end of the line use
    **ctrl+k**. In order to remove all text from the current cursor position to the
    start of the line use **ctrl+u**.


    For example, when the cursor is set on the first b letter (shown with the **|**
    character):


    ```

    $ aaa bbb ccc


    $ aaa # After `ctrl`+ c


    $ aaa |bbb ccc

    ```


    Mnemonics:


    - ctrl + kill everything

    - ctrl + up


    # How to practise?


    Well, there is a little repository I made at https://github.com/Alexanowski/bash-shortcuts.
    It aims to help you learn the most important shortcuts. Whenever you use arrows,
    home or end keys, it prints a message that there are shortcuts for.


    # Extra cool reverse shortcuts in Bash:


    In the previous chapter, we looked into basic shortcuts that help edit the current
    line. In this chapter, we are going to look into shortcuts that will boost your
    performance.


    # Clear the screen


    ctrl + 1 is the one ESSENTIAL shortcut for all power users - it clears the screen,
    just like the clear command. To keep even a simple command faithful to the spirit
    of Bash Bushido, I encourage readers to check what happens when we put clear in
    a Bash script, invoke it. You can try it on different terminal emulators to determine
    if this behaviour is terminal emulator dependent.


    # History search


    Edit note: If your knowledge about the bash history mechanism is near zero, you
    might read the Bash History first.


    To search the history from the current position in the history (most likely the
    end), use ctrl + r. This combination is bind to reverse-search-history function.
    Then type-in in the beginning of the command you want to find. Let''s assume that
    your previous commands look like that:


    ```

    1 echo "first on history"

    ...

    150 banner "I like this"

    ...

    250 banner2 "I love this"

    500 echo "I''m last"

    ```


    We also assume that both banner and banner2 are unique throughout the whole history
    file. So, invoking the reverse-search-history and typing "bann" you might get


    (reverse-1-search) bann: banner2 "I love this"


    After invoking a command, you always arrive at the end of the history. However,
    if you press esc during the reverse history search, your current position in the
    history is going to be set to the position of currently found match. In our example
    with bann, it will be 250. Therefore subsequent reverse search will search lines
    from 250 to 1. So, the next reverse search for "bann" will return the command
    banner "I like this".


    To get back to the end of history, you can use a smooth hit-enter with the empty
    prompt. The other solution is to use end-of-history readline function that is
    bound to the alt + key.

    '
