    Note that each time the last command in the pipe exit with 0 exit code/status,
    but some commands inside the pipe failed (non-zero exit status). It''s safe to
    conclude that as long as the last command exits with a zero, the whole pipe is
    correct. In the real world, it is undesirable. The failed program implies that
    something went wrong. The other aspect is a lot of commands nearly always finish
    with a zero status, for example, sort.


    It''s highly recommended that the -o pipefail is set. This option marks the whole
    pipe failed if any of its components fail.


    So after change set line into



    ```

    set -euo pipefail

    ```


    The .test_file.sh won''t print anything (exits after the first pipe). The set
    -euo pipefail is considered a standard minimal safeguard for scripts.


    # echo stderr


    Sometimes, you might want to put some information to stderr instead of stdout.
    This is a widespread practice of reporting errors and sometimes debugging. As
    I assume reader knows about redirections, I would like to present three different
    ways to print on standard error (stderr). These tricks are system dependent, all
    of them work on Enterprise Linux distributions, but for example, second won''t
