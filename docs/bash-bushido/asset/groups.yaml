- md: "\nNote that each time the last command in the pipe exit with 0 exit code/status,\
    \ but some commands inside the pipe failed (non-zero exit status). It's safe to\
    \ conclude that as long as the last command exits with a zero, the whole pipe\
    \ is correct. In the real world, it is undesirable. The failed program implies\
    \ that something went wrong. The other aspect is a lot of commands nearly always\
    \ finish with a zero status, for example, sort.\n\nIt's highly recommended that\
    \ the -o pipefail is set. This option marks the whole pipe failed if any of its\
    \ components fail.\n\nSo after change set line into\n\n```\nset -euo pipefail\n\
    ```\n\nThe .test_file.sh won't print anything (exits after the first pipe). The\
    \ set -euo pipefail is considered a standard minimal safeguard for scripts.\n\n\
    # echo stderr\n\nSometimes, you might want to put some information to stderr instead\
    \ of stdout. This is a widespread practice of reporting errors and sometimes debugging.\
    \ As I assume reader knows about redirections, I would like to present three different\
    \ ways to print on standard error (stderr). These tricks are system dependent,\
    \ all of them work on Enterprise Linux distributions, but for example, second\
    \ won't work on Android Termux.\n\n- 1. Simple redirection:\n\n```\n# Note that\
    \ redirection '>2' might be put on\n# very beginning and the end.\n```\n\n>&2\
    \ ERROR config file does not exist!\n\necho ERROR config file does not exist!\
    \ >&2\n\n- 2. Redirect to /dev/stderr:\n\necho ERROR config file does not exist!\
    \ > /dev/stderr\n\n- 3. Redirect to /proc/self/fd2:\n\necho ERROR config file\
    \ does not exist! > /proc/self/fd2\n\nThere is a little curio:\n\n```\n[Alex@Normandy\
    \ BashBushido]$ ls -l /dev/stderr\nlrwxrrwx. 1 root 15 Jun 16 14:56 /dev/stderr\
    \ -> /proc/self/fd/2\n```\n\n# Debug bash script!\n\nDebugging is the process\
    \ of finding the bugs in your code (Thanks Captain Obvious). Even if there is\
    \ no formal definition of a bug in a common sense, it's similar to a much more\
    \ defined defect. The defect is a flaw (imperfection) or deficiency in a work\
    \ product where it does not meet requirements and/or specifications.\n\nThe first\
    \ thing to do when you get an error is actually reading it! In old languages like\
    \ C or C++ you might get ultra-specific errors like \"Core Dump (Segmentation\
    \ fault)\". In modern languages, especially in one that uses some of VM or interpreter,\
    \ you will get something called traceback or backtraces print the stack traces\
    \ of the running program. So you can get information about which function and\
    \ finally which line leads to the error.\n\nUnfortunately, this is not the case\
    \ in bash. Even if bash is a scripting language, or at least \"sh-compatible language\"\
    \ it won't produce meaningful traces in case of error. So we have to make them.\
    \ With set -x or -o xtrace, simple tracing prints each line before execution.\
    \ To present it, I decided to provide the following code.\n\n- 1. run.sh script\n\
    \n```bash\n#!/usr/bin/env bash\n\nfoo() {\n  echo -n \"foo\"\n}\n\nbar() {\n \
    \ echo -n \"bar\"\n}\n\nmain() {\n  ./lib.sh\n  check_euid || foo\n  check_euid\
    \ && bar\n}\n```\n\n- 2. lib.sh that has one function\n\n```bash\n#!/usr/bin/bash\n\
    \ncheck_euid() {\n    if [ \"$EUID\" -eq 0 ]; then\n        echo \"Running with\
    \ root privileges - I like it.\"\n        return 0\n    else\n        echo \"\
    Warning: EUID != 0\"\n        return 1\n    fi\n}\n\nmain\n```\n\nNow, execution\
    \ with trace produce an output similar to:\n\n```\n[Alex@Normandy tmp]$ bash -x\
    \ ./run.sh\n+ main\n+ ./lib.sh\n+ check_euid\n+ [ 0 == 0 ]\n```\n\nTo get the\
    \ line number, filename and name, you might get PS4 variable. The value of PS4\
    \ is expanded to '${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}'. This trick comes from\
    \ https://wiki.bash-hack.org/scripting/debugging. Each of these variables is described\
    \ in the Bash manual.\n\nSample debugging with empty prompt:\n\n```\n[Alex@Normandy\
    \ tmp]$ export PS4='${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}:'\n[Alex@Normandy\
    \ tmp]$ bash -x ./run.sh\n(run.sh:17) main\n```\n\n# Shellcheck - write better\
    \ bash scripts!\n\nThere are many ways that can be tested, but one of the fundamental\
    \ distinction is based on whether the software actually runs. In dynamic testing,\
    \ the code is executed, in contrast static testing does not execute the code,\
    \ but checks its static properties. The static testing is also white box testing\
    \ because the software engineer actually has access to the source code of the\
    \ program.\n\nOne of the most used static testing techniques is static code analysis.\
    \ In most cases, programs that perform static code analysis and also grade the\
    \ code are called linters. The name linter came from Unix version that was looking\
    \ for mistakes in C programs. Nowadays, most IDEs have built-in linters to help\
    \ avoid mistakes/errors. Some linters give you a numeric or \"school grade\" like\
    \ 8 or B+. A lot of GitHub repositories have badges that inform on the code health\
    \ based on linters and other statistics.\n\nOK, why do I provide all this? Well,\
    \ there is an absolutely flawless linter for shell scripts - it's shellcheck.\
    \ Shellcheck is a script analysis tool. It also uses standard exit codes to inform\
    \ if a code is flawed (at least at a level it can check).\n\nThe official ShellCheck\
    \ repository: https://github.com/koalaman/shellcheck/wiki.\n\nThe shellcheck groups\
    \ bad codes based on severity, currently there are three categories:\n\n- Error\
    \ - in most cases, the script won't invoke properly.\n- Warning - in most cases\
    \ inadequate but syntax acceptable code.\n- Info - from quite important to pedantic.\
    \ In many cases, they don't have much impact on a script and its execution.\n\n\
    Installing the ShellCheck on Enterprise Linux distributions is really easy - you\
    \ just need the EPEL repository.\n\n```\nsudo yum install epel-release\nsudo yum\
    \ install ShellCheck\n```\n\nAfter installation, shellcheck is invoked by any\
    \ other program. One of the most essentials wishes is to exclude specified error\
    \ codes.\n\nLook at the following example:\n\n```\n[Alex@SpaceShip BashBushido]$\
    \ shellcheck /usr/sbin/alsa-info.sh | wc -l\n```\n\n# Excluding 2086 doublequote\
    \ information\n\n```\n[Alex@SpaceShip BashBushido]$ shellcheck -e 2086 /usr/sbin/alsa-info.sh\
    \ | wc -l\n```\n\nI personally like to use shellcheck in CI/CD, unfortunately,\
    \ the shellcheck return a non-zero status whenever there is any flaw (even if\
    \ it is at the \"information\" level). However, the shellcheck can print its data\
    \ in a different format. One of the supported formats is JSON. My favourite command\
    \ tool for performing search and other operations on JSON is jq. Going back to\
    \ the previous example, to count the different types of levels, the following\
    \ pipe might be used:\n\n```\n[Alex@SpaceShip Bashushido]$ shellcheck -format\
    \ json /usr/sbin/alsa-info.sh | jq\n  grep 'level' | sort | uniq -c\n  \"level\"\
    : \"info\"\n  \"level\": \"style\"\n  \"level\": \"warning\"\n```\n\nThe jq invocation\
    \ with an empty filter. Never version (1.6+) of JQ can be invoked without a dot.\
    \ jq is not the scope of this chapter, but there has a considerably good tutorial:\
    \ https://stedolan.github.io/jq/\n\nTo read the \"warning\" level messages the\
    \ jq filter must be changed.\n\n```\n[Alex@SpaceShip Bashushido]$ shellcheck --format\
    \ json /usr/sbin/alsa-info.sh | jq\n'.[] | select(.level == \"warning\")\n{\n\"\
    file\": \"/usr/sbin/alsa-info.sh\",\n\"line\": 0,\n\"column\": 100,\n\"level\"\
    : \"warning\",\n\"code\": 2034,\n\"message\": \"inp appears unused. Verify it\
    \ or export it.\"\n}\n```\n\n# Shellcheck web version.\n\nShellcheck has a website\
    \ that allows you to use it without installing - https://shellcheck.net . If you\
    \ don't trust the author or his/server, you can always spin your own similar website\
    \ based on the official GitHub repository - https://github.com/koalaman/shellcheck.net/:\n"
  mdcn: "\n请注意，每次管道中的最后一个命令都以 0 退出码/状态退出，但管道内部的某些命令可能失败了（非零退出状态）。可以安全地得出结论：只要最后一个命令以\
    \ 0 退出，整个管道就是正确的。在现实世界中，这并不理想。失败的程序意味着出现了一些问题问题。另一个方面是，很多命令几乎总是以 0 状态结束，例如 `sort`。\n\
    \n强烈建议设置 `-o pipefail`。此选项如果管道中的任何一个组件失败，则将标记整个管道为失败。\n\n所以，在将设置行改为：\n\n```\n\
    set -euo pipefail\n```\n\n那么 `.test_file.sh` 将不会打印任何内容（在第一个管道执行后退出）。`set -euo\
    \ pipefail` 被认为脚本的标准最小保护措施。\n\n# echo stderr\n\n有时，你可能想将某些信息输出到标准错误 (stderr) 而不是标准输出\
    \ (stdout)。这是报告错误和有时调试的常用做法。我假设读者已经了解重定向，我想展示三种在标准错误 (stderr) 上打印内容的不同方法。这些技巧取决于系统，它们在企业级\
    \ Linux 发行版上均有效，但例如，第二种在 Android Termux 上无法工作。\n\n- 1. 简单重定向：\n\n```\n# 注意，重定向\
    \ '>2' 可能被放在\n# 最开始或末尾。\n```\n\n>&2 ERROR config file does not exist!\n\necho\
    \ ERROR config file does not exist! >&2\n\n- 2. 重定向到 /dev/stderr：\n\necho ERROR\
    \ config file does not exist! > /dev/stderr\n\n- 3. 重定向到 /proc/self/fd2：\n\necho\
    \ ERROR config file does not exist! > /proc/self/fd2\n\n这里有一个小好奇：\n\n```\n[Alex@Normandy\
    \ BashBushido]$ ls -l /dev/stderr\nlrwxrrwx. 1 root 15 Jun 16 14:56 /dev/stderr\
    \ -> /proc/self/fd/2\n```\n\n# 调试 bash 脚本！\n\n调试是在你的代码中寻找 bug 的过程（感谢显而易见的船长）。即使在常识中没有对\
    \ bug 的正式定义，它也类似于一个定义得多的缺陷（defect）。缺陷是工作产品中的缺陷（不完美）或不足，导致其不符合和/或规范。\n\n当你遇到错误时，第一件事实际上阅读它！在\
    \ C 或 C++ 这样的旧语言中，你可能会得到非常具体的错误，如“Core Dump (Segmentation fault)”。在现代语言中，特别是使用某些虚拟机或解释器的语言中，你会得到所谓的\
    \ traceback 或 backtraces，它们会打印运行中程序的堆栈跟踪。因此，你可以获得关于哪个函数以及最后是哪一行导致了错误的信息。\n\n遗憾的是，bash\
