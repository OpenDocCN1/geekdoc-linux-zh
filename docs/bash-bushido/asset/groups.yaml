    # One word forward and backward.


    Up until this moment, you have learned a bunch of useful shortcuts, but each of
    them can be replaced with a single key-stroke. The really powerful shortcuts are
    those which are not represented by a single keyboard key - the first one you will
    learn is moving forwards and backwards but by the distance of whole words instead
    of one pitiful character. The **alt + f** and **alt + b** combinations, move the
    cursor forwards and backwards by one word, respectively.


    Mnemonics:


    +   - alt + forward

    - alt + backward


    # Remove from the cursor position to the end of the word.


    You might already notice that some shortcuts have a more **powerful** version
    when you hit **alt** key instead of **ctrl** key. **ctrl + d** removes one character
    when **alt +d** removes the whole word.


    Note: There is group of shortcuts that uses both **alt** and **ctrl** in most
    cases the version with **alt** way more powerful.


    Mnemonics: - alt + delete


    # Remove from the cursor to the {start, end} of command line


    To remove all text from the current cursor position to the end of the line use
    **ctrl+k**. In order to remove all text from the current cursor position to the
    start of the line use **ctrl+u**.


    For example, when the cursor is set on the first b letter (shown with the **|**
    character):


    ```

    $ aaa bbb ccc


    $ aaa # After `ctrl`+ c


    $ aaa |bbb ccc


    $ bbb ccc # After `ctrl`+ u

    ```


    Mnemonics:


    +   - ctrl + kill everything'
