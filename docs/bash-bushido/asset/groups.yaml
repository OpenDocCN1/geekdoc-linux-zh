    \ languages, especially in one that uses some kind of VM or interpreter, you will\
    \ get something called traceback or traceback/backtraces print the stack traces\
    \ of the running program. So, you can get the information which used which function\
    \ and finally which line leads to the error.\n\nUnfortunately, this is not the\
    \ case in the bash shell. Even if bash is a scripting language, or at least a\
    \ \"sh-compatible command language\" it won't produce meaningful traces in the\
    \ case of an error. So, we have to make them ourselves. With set -x or set -o\
    \ xtrace, this simple tracing prints each line before execution. To present it,\
    \ I decided to provide the following simple code.\n\n+   1. run.sh script\n\n\
    ```\n#!/usr/bin/env bash\n\nfoo() {\n  echo -n \"foo\"\n\n  bar\n}\n\nbar() {\n\
    \  echo -n \"bar\"\n}\n```\n\n```\nmain() {\n  ./lib.sh\n\n  check_euid || foo\n\
    \n  check_euid && bar\n}\n```"
