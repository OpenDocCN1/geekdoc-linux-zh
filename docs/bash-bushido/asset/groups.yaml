    # banner


    The banner is a quite old program (so old that its original code is barely readable
    [sh**load of conditional compilation for computers older than a transistor ;;]),
    that prints given string in a gigantic letters.


    Installation on an Enterprise Linux machine (requires EPEL).


    ```

    sudo yum install -y epel-release

    sudo yum install -y banner

    ```


    In any other distribution, please try to find it with your package manager, in
    most cases, it''s called banner or sysvbanner. Die-hard compilation fans can find
    the sources and easily compile it.


    With banner installed, now we can answer the development team when he/she/they
    (gender neutral alphabetical order) asks "Why our application doesn''t work in
    a production environment?


    ![](img/6827ee835e54ef11777a367a9702258e_85_0.png)


    Well, like that all the banner you can do. This is dead simple. In the default
    implementation, there is not much that you can do. I personally made my own implementation
    that can be found at the GitHub - https://github.com/AlexBaranowski/Banner.


    I''m not very proud of this program, but since I mentioned it, I would like to
    give you a glimpse how to use it. To compile the version of the banner you can
    use following commands.


    ```

    git clone git://github.com:AlexBaranowski/Banner.git

    cd Banner

    make

    sudo make install

    ```


    After this, there should be /usr/bin/banner, that should also be available with
    your $PATH environment variable. The general options for my banner are


    +   - -c [CHAR] change the output character

    - -s the printing character is the same as a letter

