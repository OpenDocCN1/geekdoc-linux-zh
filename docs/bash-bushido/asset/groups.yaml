- md: "\n# ShellCheck\n\nfind bugs in your shell scripts.\n\nYou can cabal, apt, dnf\
    \ or brew install it locally right now.\n\nPaste a script to try it out:\n\nYour\
    \ Editor (Ace)\n\n![](img/6827ee835e54ef11777a367a9702258e_120_0.png)\n\n# ShellCheck\
    \ Output\n\n```\n$ shellcheck myscript\nLine 5:\necho $MY\n  - SC2086: Double\
    \ quote to prevent globbing and word splitting.\nLine 7:\nunused=\"Johnny Bravo\"\
    \n  - SC2034: unused_ appears unused. Verify use (or export if used externally)\n\
    Line 9:\necho $$\n  - SC2068: Double quote array expansions to avoid re-splitting\
    \ elements.\n```\n\n# ShellCheck in CI/CD\n\nShellCheck can be used in a CI/CD\
    \ pipeline. All projects I'm working on use Git. The following script can be used\
    \ in CI/CD where only the modified .sh files are taken into account.\n\n```bash\n\
    #!/bin/bash\n\n# Author: Aleksander Baran\n# License: MIT\n# This simple script\
    \ looks for changed .sh files from the last commit\n# USAGE: shellcheck repo_root\n\
    # Exit codes:\n# 98 - required command is not installed\n# 1 - some file failed\n\
    # 0 - success\n\n# VARS\nMY_REQUIRED_COMMANDS=\"shellcheck\"\nMY_DIR_TO_CHECK=\"\
    \"\nMY_FILES_TO_CHECK=\"\"\n\ncheck_required_commands() {\n  for my_command in\
    \ $MY_REQUIRED_COMMANDS; do\n    hash \"$my_command\" 2>/dev/null || {\n     \
    \ echo \"$my_command command! Aborting.\";\n      exit 98\n    }\n  done\n}\n\n\
    print_help() {\n  echo \"Usage: $0 DIRECTORY_TO_CHECK\"\n  exit 1\n}\n\nsetup_script()\
    \ {\n  if [ $# -ne 1 ]; then\n    print_help\n  fi\n  MY_DIR_TO_CHECK=\"$1\"\n\
    \  [ -d \"$MY_DIR_TO_CHECK\" ] || { echo \"$1 is not a directory\"; exit 1; }\n\
    }\n\nfind_files_to_check() {\n  pushd \"$MY_DIR_TO_CHECK\" > /dev/null\n  MY_FILES_TO_CHECK=$(git\
    \ show --format=\"name-only\" | grep \".*sh$\")\n  echo \"Found $(echo \"$MY_FILES_TO_CHECK\"\
    \ | wc -w) .sh files\"\n  popd > /dev/null\n}\n\nrun_shellcheck() {\n  if [[ -z\
    \ \"$MY_FILES_TO_CHECK\" ]]; then\n    echo \"No .sh found - skipping\"\n    exit\
    \ 0\n  else\n    # disable fail on first error; multiple scripts might pass\n\
    \    # fail_flag is responsible for exit code\n    set +e\n    fail_flag=0\n \
    \   for i in $MY_FILES_TO_CHECK; do\n      output=$(shellcheck --format=json \"\
    $MY_DIR_TO_CHECK/$i\")\n      output_status=$?\n      if [[ $output_status -ne\
    \ 0 ]]; then\n        fail_flag=$((fail_flag+1))\n        echo \"==== Script $i\
    \ REPORT ====\"\n        echo \"$output\" | python -m json.tool\n      fi\n  \
    \  done\n    if [[ $fail_flag -ne 0 ]]; then\n      echo \"$fail_flag scripts\
    \ failed\"\n      exit 1\n    else\n      echo \"All scripts passed\"\n    fi\n\
    \  fi\n}\n\ncheck_required_commands\nsetup_script \"$@\"\nfind_files_to_check\n\
    run_shellcheck\n```\n\n# At execute command at a given time.\n\natd is daemon\
    \ that helps schedule jobs for later execution. It stores jobs in /var/spool/at\
    \ and executes them at a given time. Simple example:\n\n```\n[Alex@SpaceStation\
    \ tmp]$ at now + 2 minutes\nat> echo \"I love Bash Bushido\" > /tmp/my_at_tmp\n\
    at> date >> /tmp/my_at_tmp\nat> <EOF>\nJob 3 at Sun Jul 21 23:17:00 2019\n```\n\
    \nTo allow jobs that wait to be run, use atq command.\n\n```\n[Alex@SpaceStation\
    \ tmp]$ atq\n3 Sun Jul 21 23:17:00 2019 Alex\n```\n\nAfter 2 minutes the result\
    \ can be read.\n\n```\n[Alex@SpaceStation tmp]$ cat /tmp/my_at_tmp\nI love Bash\
    \ Bushido\nSun Jul 21 23:17:00 CEST 2019\n```\n\nThere is a massive difference\
    \ between at and cron when it comes to handling not executed jobs. If cron misses\
    \ a job, it won't try to execute it until the next cron date is. The at will try\
    \ to run the missed jobs the next day at the same time.\n\nCurio - you might allow\
    \ usage of command for particular users. More about at can be found in manuals:\n\
    \n- man 1 at\n- man 8 at\n- man 5 at\n\n# AWK print selected words.\n\nawk is\
    \ another powerful tool from UNIX. It's a full programming language, excelling\
    \ in string manipulation to the point that some people write reports in it. Most\
    \ Linux distributions use GNU awk (gawk) implementation, and awk is a symbolic\
    \ link to gawk.\n\n```\nAlex@SpaceStation ~$ ls -l $(which awk)\n```\n\n```\n\
    lrwxr-xr-x. 1 root 4 Feb 14 11:40 /usr/bin/awk -> gawk\n```\n\nBecause awk excels\
    \ when it comes to manipulating strings, it's frequently used with sed and grep.\
    \ Actually awk can handle regular expressions and much more, but the most straightforward\
    \ and extremely useful program in awk is selecting words. The syntax is as easy\
    \ as awk '{print $NUMBER}'. Note that awk is in single quotes, so $NUMBER doesn't\
    \ expand into a shell variable. Look at the following example:\n\n```\nawk 'NR>=2\
    \ && NR<=3' {print $0}\n```\n2\n3\n\nI showed a simple awk program, but why is\
    \ awk better than cut? To see, look at the following:\n\n```\nawk -F' ' '{print\
    \ $4}'\n```\n```\ncut -f4\n```\n\nIn the case of unknown types of whitespaces,\
    \ awk will produce expected results whereas cut will not (programmatically correct\
    \ but inconvenient).\n\n# AWK getting selected line range.\n\nawk has a variable\
    \ that keeps the current line number - NR. The example contains the following\
    \ lines:\n\n- 1 one\n- 2 two\n- 3 three\n- 4 four\n\nto print lines from 2 to\
    \ 3 you might use:\n\n```\nawk 'NR>=2 && NR<=3' sample\n```\n2\n3\n\n# Getting\
    \ PID of the current shell.\n\nPID is a process identifier - a unique number that\
    \ process has in the operating system. But what is actually surprising is not\
    \ all people know that there is also Parent PID. It's one of the questions I really\
    \ like to ask during interviews. The next one is about PPID. To get the current\
    \ PID, you can use a particular Bash variable. The nearly same variable is PPID.\n\
    \n```\n[Alex@SpaceStation]$ echo $PID\n```\n```\n[Alex@SpaceStation]$ echo $PPID\n\
    ```\n\nYields the same outcome. The difference between PID and $$ can be presented\
    \ with the following example.\n\n```\n[Alex@SpaceStation]$ echo $PID\n```\n```\n\
    [Alex@SpaceStation]$ echo $PPID\n```\n\nPPID has a different value in subshells.\n\
    \nI personally like to use $$ to make temporary files and directories. It's useful\
    \ for debugging running bash scripts and creating simple, unique files (note that\
    \ using mktemp with proper options is actually a better solution).\n\n# dos2unix\
    \ unix2dos\n\nA long time ago, before standardization, there were multiple ways\
    \ to mark a newline. It's connected with the teleprinters (btw TTY is a shortcut\
    \ for teletype) work. There are two signals (symbols) that used to make a new\
    \ line. First one is LF (linefeed) that moves the paper one line, the second symbol\
    \ is the carriage return (CR) that returns the printer head to the start of a\
    \ line. At some point in time, the OS designers decided how to represent the new\
    \ line in a file. MS-DOS with CR and LF used LF only. Windows inherited its newline\
    \ from MS-DOS and Linux inherited it from Unix. Because of that, there is sometimes\
    \ a need to change one format to another. There are two minimalistic programs,\
    \ unix2dos and dos2unix change the newline format.\n\nThe installation on Linux\
    \ distributions 7 and 8 is as simple:\n\n```\nsudo yum install -y dos2unix\n```\n\
    \nNow you can change the encoding with both dos2unix and unix2dos. Example below\
    \ uses the file to determine current newline character/s:\n\n```\n$ echo \"Test\"\
    \ > test_file\n$ file_file\ntest_file: ASCII text\n$ unix2dos test_file\nunix2dos:\
    \ converting test_file to DOS format ...\n$ test_file\ntest_file: ASCII text,\
    \ with CRLF line terminators\n$ dos2unix test_file\ndos2unix: converting test_file\
    \ to Unix format ...\n$ file_file\ntest_file: ASCII text\n```\n\n# Get ASCII ASAP\n\
    \nASCII is an abbreviation of American Standard Code for Information Interchange.\
    \ This is one of the oldest (older than my parents!) standards still in use. You\
    \ probably know the ASCII is slowly replaced by Unicode, nevertheless, it's still\
    \ in use!\n\nTo use the ASCII table, with information about this standard, invoke:\n\
    \n```\nman 7 ascii\n```\n\n# Set Bash auto log out\n\nThere is possibility to\
    \ set up an automatic logout based on idle time. In other words, if there is a\
    \ period without any action, the user is logged out. The variable responsible\
    \ for it is \"TMOUT\". For example, you can set it to 3600 seconds (exactly one\
    \ hour) with the following script:\n\n```bash\ngrep TMOUT ~/.bashrc || export\
    \ TMOUT=3600 >> ~/.bashrc\n```\n"
