    ## Guake - Gnome Drop Down Terminal


    The development of guake, as many other free/open-source software, takes place
    on the GitHub platform https://github.com/Guake/Guake. As multiple python-based
    project, guake changed versioning from 0.83 to 3.0; the reason for this is simple
    - the support for python 2.7 was dropped and having the separate numbers for a
    new version makes sense. Guake installation in Enterprise Linux distributions
    is as simple as installing the epel-release package then installing the Guake
    from the EPEL repository.


    ```bash

    sudo yum install -y epel-release

    sudo yum install -y guake

    ```


    After installation, I recommend invoking guake that will also bind itself to the
    F12 Key. I highly recommend this because only a small percentage of applications
    actually uses F12 and in most cases (like a web browser and developer tools),
    they are also bound to other keys combination (like ctrl-shift+i in Firefox).
    After configuration, guake might be shown/hidden with F12 or any other chosen.


    ![](img/6827ee835e54ef11777a367a9702258e_152_0.png)


    This paragraph is gnome 3 specific - to add autostart in gnome you might use gnome-tweak-tools
    or gnome-session-properties. The gnome-tweak-tools uses desktop files from /usr/share/applications
    when gnome-session-properties allows to run any command.


    Guake supports:


    - Colors

    - Possibility to choose different color profiles.

    - Option to make/import user-defined color profiles.

    - Support for mouse events (scrolling + clicking)

    - Text resizing and wrapping dependent on current terminal width/size.

    - Possibility to make multiple tabs.

    - Possibility to set a background image.

    - Support for True Color.

    - Ability to store more than one thousand of the output lines.


    Like any sensible terminal emulator, Guake allows making a new tab with ctrl+shift+t.
