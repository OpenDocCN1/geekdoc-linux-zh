    ## Best 30 minute investment - vimutor.


    Well, there are three types of people in the Linux world. The first group are
    old enough to use a pretty good operating system that includes: mailer, news reader,
    web browser, directory editor, CVS interface and a finally text editor - emacs.
    The second group are people who acknowledge that in all distributions, on all
    servers, there is a minimalistic program called vi. Ahhh, and the last group are
    novices.


    Vim is an abbreviation of VI Improv :). You can think about the vim program as
    a subset of vim functionalities. So, when you dig into the basics of "real" vim,
    you also learn vi.


    Some benefits of using vim:


    - It exists on all kinds and flavours of Unix, and all "worth your time" Linux
    platforms (in most cases in a minimal install - the coverage alone is enough of
    a reason to learn it.

    - Home-row navigation. No, you don''t have to use cursor (arrow) keys - it''s
    much faster to stay in the home-row.

    - Home-row centric, so you rarely move your fingers from the home row.

    - Nearly every repetitive task has a shortcut - everyone loves shortcuts.

    - Vim conserves keystrokes if you want to delete 100 lines, you just type 100ddd.

    - Easy to learn bookmarks.

    - Every worthy IDE has vim-like key bindings. Even some more exotic ones like
    RStudio or Haropod (markdown Editor) do.

    - S***LOAD of plugins.

    - Did I mention home row?


    Some addition tips:


    - Switching ECS with CAPS LOCK FTW! Remember that this might be irritating when
    using someone else''s computer.

