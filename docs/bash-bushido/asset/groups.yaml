    \ 的 tcp 连接\nss -nt dst 10.10.1.100/24 # 连接到主机 10.10.1.100/24 的 tcp 连接\nss -nt\
    \ dport = :80 # 端口号必须配合 \"-\" 使用 - 把它视为主机名的一部分；与每个主机组合\n# 过滤器可以组合使用\nss -nt '(\
    \ dport = :80 or dport = :443 or dport = 443 )'\n```\n\n一如既往，可以在手册中找到更多内容，在这种情况下，它是第\
    \ 8 部分 - 系统管理命令 `man 8 ss`。\n\n# Ncat (Netcat)\n\nNcat 是一个简单但极其强大且流行的工具，用于从 TCP、UDP\
    \ 和 Unix socket 连接中读写。在许多情况下，它是脚本和其他程序中频繁使用的中间层。\n\nNcat 是 netcat 的重新实现，两者都具有相同的别名\
    \ (nc)。最流行的实现来自 nmap 项目，它它结合了 netcat 中最突出的选项。在 EL7 上安装非常简单：\n\n```bash\nsudo yum\
    \ install -y nmap-ncat\n```\n\n安装后，有一个 ncat 命令以及指向它的符号链接 nc。\n\n# 使用 netcat 连接到服务\n\
    \nNetcat 可用于连接到任何特定的端口/主机组合。\n\n使用 TCP 连接到主机，使用：\n\n```bash\nncat HOST PORT\n\
    ```\n\n使用 UDP 连接到主机，使用：\n\n```bash\nnc -u HOST PORT\n```\n\n连接到 Unix socket：\n\
    \n```bash\nnc -U /path/to/my.socket -o 可以可以使用选项。\n```\n\n将会话导出到文件 - -o 选项：\n\n\
    ```bash\nncat -o FILENAME HOST PORT\n```\n\nncat 的第一个应用是确定特定端口是否打开（当服务器运行不符合预期时，这是检查的首要事项）。通常，NMap\
    \ 更适合这项工作，但 ncat 包小 40 倍，而且 nc 因为其极简 nature而深受喜爱。netcat 的另一个用途是发送命令、文件或负载（payload）。负载\
    \ 是一个技术术语，可以指所交付的消息（当你向服务器发送消息时，有很多元数据 - 如跳数、源、目的，这些对于通过网络传输数据包是必须的），第二个含义是由漏洞利用交付的有害代码。负载术语被测试人员频繁使用。\n\
    \n某些 \"payload.txt\" 向示例 Heroku 应用的 HTTP 请求。\n\n```http\nGET /HTTP/1.0\nHost:\
    \ example.herokuapp.com\n```\n\n由于 RFC 2616（超文本传输协议 - HTTP/1.1）定义换行符为 CRLF 类型（关于问题的更多信息可以查看\
    \ dos2unix unix2dos），因此在管道化文件中写入 HTTP 请求之前，应该使用 unix2dos。\n\n```bash\n$ unix2dos\
    \ payload.txt\n```\n\n执行此操作后，cat 管道到 netcat 的效果非常奇妙。\n\n```bash\ncat payload.txt\
    \ | nc example.herokuapp.com 80\n```\n\n# Ncat 传输文件\n\nNcat 常用于通过网络传输文件。由于我倾向于使用自包含的示例，使用了\
    \ localhost，但在正常情况下，会有不同的主机。\n\n使用 -l 选项以监听模式启动 ncat：\n\n```bash\nnc -l -p 6969\
    \ > output_file\n```\n\n传输文件时，你可以使用文件重定向 (<) 或管道：\n\n```bash\nnc localhost 6969\
    \ > file.txt\n```\n\n执行这些操作后，output_file 应与 file.txt 完全相同。注意在正常情况下，防火墙规则应该阻止主机之间的连接。\n\
    \n# Ncat 传输整个目录\n\nNcat 可以快速传输目录（以及子目录）。在一端，使用 tar 输出作为 ncat 的输入；在第二个会话中，ncat\
    \ 输出作为 tar 的输入。你也可以使用压缩（在我的情况下是 bzip2）。\n\n在接收主机上使用：\n\n```bash\nnc -l 4242 |\
    \ tar xzvf -\n```\n\n然后在在发送主机上使用：\n\n```bash\ntar cvzf /path/to/directory/ | nc\
    \ HOST 4242\n```\n\n# Telnet 检查端口是否可用\n\nTelnet 主要是遗过时的、非加密的计算机通信方式。它过去曾用于远程控制服务器（如果你经常使用\
    \ telnet，看看你的指标吧！因为 telnet 以明文传递数据，不建议在公共网络上使用，坦诚地说，在任何系统中都不如此）。由于 telnet 是基于文本的，也可以用于测试某些服务。例如，为了测试服务器是否工作，你可以这样做：\n\
    \n```bash\nAlex@SpaceShip~$ telnet 192.168.1.170 80\nTrying 192.168.1.170...\n\
    Connected to 192.168.1.170.\nEscape character is '^'\nGET/\nNever give up,\nNever\
    \ let you down,\nNever around you,\nNever make you cry,\nNever say goodbye,\n\
    Never gonna tell a lie and hurt you\nConnection closed by foreign host\n```\n\n\
    在这个示例中，我们使用 HTTP 方法 \"GET\" 在 web 服务器的根。Telnet 也可以检查指定的端口：\n\n```bash\nAlex@SpaceShip~$\
    \ telnet 192.168.1.170 5432\nTrying 192.168.1.170...\ntelnet: connect to 192.168.1.170\
    \ refused\n\n在启动监听 5432 的 postgresql 服务器后，相同的命令将打印：\n\n```bash\ntelnet 192.168.1.170\
    \ 5432\nTrying 192.168.1.170...\nConnected to 192.168.1.170.\nEscape character\
    \ is '^'\n```\n\n# Telnet 星大战\n\n这个技巧是 Bash Bushido 中简单的技巧之一。安装了 telnet 后，你可以观看《星球大战》第四部：\n\
    \n```bash\ntelnet towel.lights.nl\n```\n\n如果你的网络支持 IPv6，你可以获取更好的 IPv6 版本：\n\n\
    ```bash\ntelnet -6 towel.lights.nl\n```\n\n我没有测试过它，所以如果没有运行，你可以在 GitHub 仓库提交 issue\
    \ - https://github.com/AlexBarowski/bash-bushido-errata。退出 telnet 使用 **ctrl+]**（退出字符），然后按\
    \ **ENTER**，之后你会得到 telnet 提示符，你可以发送 EOF (**ctrl + d**) 来关闭会话。正如我的朋友评价这个了不起的 telnet\
    \ 电影：“这是一个典型的开源项目 - 好用，有趣，但也未完成”。\n\n# 杂杂\n\n这一章是 Bash Bushido 的精髓，它是全书中最长的一章，包含了任何系统管理员/devops/生产工程师可以使用的小解决方案和程序。\n\
    \n## 重试直到成功。\n\n有时需要在没有成功的情况下重复执行命令。在大多数情况下，使用了三种结构：\n\n1. 运行直到成功 - 永不放弃（下面的梗）\n\
    2. 使用计数器运行直到成功。\n3. 带超时限制的运行直到成功。\n\n- 第一种情况：\n\n```bash\nwhile true; do\n  this_command_might_fail\
    \ && break;\n  sleep 5; # 好睡，小天使！\ndone\n```\n\n- 第二种情况：\n\n```bash\nRETRY_COUNTER=1\n\
    while true; do\n  if [[ RETRY_COUNTER -gt 10 ]]; then\n    echo \"Sorry it didn't\
    \ work\"\n    exit 1\n  fi\n  echo \"I'm trying for $RETRY_COUNTER time\"\n  this_command_might_fail\
    \ && break;\n  RETRY_COUNTER=$((RETRY_COUNTER+1))\n  sleep 5; # 你可以添加一些睡眠\ndone\n\
    ```\n\n- 第三种情况：\n\n```bash\nMY_TIMEOUT=60\nMY_BASE_TIME=$( date +%s)\nwhile true;\
    \ do\n  MY_CURRENT_TIME=$(date +%s)\n  if [[ $((MY_BASE_TIME - MY_CURRENT_TIME\
    \ + MY_TIMEOUT)) -lt 0 ]]; then\n    echo \"Timeout trap - sorry :(\"\n    exit\
    \ 1\n  fi\n  this_command_might_fail && break;\n  echo \"It didn't work! I hope\
    \ that I won't hit timeout!\"\n  sleep 5; # 你可以添加一些睡眠\ndone\n```\n\n在第三种情况下，我们使用\
    \ epoch 时间 - 自 1970 年 1 月 1 日星期四 UTC 00:00:00 以来的秒数。它也被称为 Unix 时间。\n\n# 根据行号打印行\n\
    \nsed 是 Unix 中神秘而强大的工具之一，只有胡子比……手指还长的人才能理解。SED 代表 Stream Editor（流编辑器）——意味着它获取流（文件、管道、stdin）并对其执行操作。就是这样；它听起来简单，但就像\
    \ Unix 中的很多事情一样。sed 可以解决的最简单问题之一是只打印行。要这样做，请使用 'Np' 命令。N 和 M 是行号，而 p 是接受地址范围的\
    \ sed 命令。在下面的示例中，打印了第 3 到第 10 行。\n\n```bash\n[root@Normandy ~]# cat -n /etc/passwd\
    \ -n passwd # cat -n 这些行\n[root@Normandy ~]# sed -n '3,10p' passwd\n3 daemon:x:2:2:daemon:/sbin/bin/nologin\n\
    4 admin:x:3:4:adm:/var/adm:/sbin/nologin\n5 lp:x:4:7:lp:/var/spool/lpd:/bin/nologin\n\
    6 sync:x:5:0:sync:/sbin/bin/sync\n7 shutdown:x:6:0:shutdown:/sbin/bin/shutdown\n\
    8 halt:x:7:0:halt:/sbin/bin/halt\n9 mail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
    10 operator:x:11:0:operator:/root:/sbin/nologin\n```\n\n有可能不使用 sed 获得类似的结果，但它们需要多个命令且速度较慢。\n\
    \n```bash\n[root@Normandy ~]# cat /etc/passwd | head -10 | tail -8\n\n3 daemon:x:2:2:daemon:/sbin/bin/nologin\n\
    4 admin:x:3:4:adm:/var/adm:/sbin/nologin\n5 lp:x:4:7:lp:/var/spool/lpd:/bin/nologin\n\
    6 sync:x:5:0:sync:/sbin/bin/sync\n7 shutdown:x:6:0:shutdown:/sbin/bin/shutdown\n\
    8 halt:x:7:0:halt:/sbin/bin/halt\n```\n\n"
