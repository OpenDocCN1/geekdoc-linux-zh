    # Bash History


    Fortunately, we will not concern ourselves with hard to tell, morally ambiguous,
    and incarnate humans/nations histories. We will talk about the GNU History library
    that saves and manages the previously typed lines. The chapter will focus on controlling
    the history behaviour through environment variables, practical tricks and mostly
    unknown usage. In theory, the Bash history is just simple files that store the
    previously invoked commands, but as always there is quite a lot to discover! For
    example, it can save the timestamps or even be shared between concurrent sessions!
    After this short introduction - Hey HO, Let''s Go!


