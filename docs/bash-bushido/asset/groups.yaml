    # Summary area


    +   - 1,2, 3'' - change the way that CPU/S are showed. Note that first and second
    have have two submodes.

    - t - change the way the CPU load is showed.

    - m - change the way that memory is showed

    - 1 - enable/disable the first line.

    - H - toggle between threads and tasks.


    # Other useful commands


    +   - c - enable/disable the absolute command path.

    - g - change the current window (task area) to another (the naming is not that
    clear, once time we talk about windows, other times, it is a field group and a
    task areas).

    - V - enable the forest mode. In this mode, the top shows the output in a tree
    format quite similar to pstree command but within fields of the task area.


    I highly recommend trying each of the presented keys, modes, and configurations.
    Then try to find the setting that suits you most.


    # htop - top on steroids.


    The name htop came from Micah top - the first letter is the name of the program
    author, I personally remember it with the HyperTop mnemonic. htop is a better,
    easier-to-use, cleaner and more powerful, version of the htop. It''s a self-descriptive
    and easy-to-discover program. The only drawback of htop is that it is not a part
    of the proc-ng so:


    +   - It''s not a part of the minimal installation.

    - Not all vendors have it in their repositories. If you install a third-party
    package containing the htop, stores might mark your system as unsupported, that
    is well ... stupid as f***


    To install htop Enterprise Linux distributions, you need the EPEL repository.


    ```

    sudo yum install -y epel-release;

    ```


    epel-release is a package that sets up EPEL, so it contains repository info, GPG
    keys and a preset that is used by the systemd. After installing EPEL, the htop
    can easily be installed with yum.


    ```

    sudo install -y htop

    ```


    # Compiling the htop


    If your vendor is not sane, you can compile the htop and place it into not a standard
    path, that that won''t be gathered by the sosreport or any other system state
    gathering utility.'
