    ![](img/6827ee835e54ef11777a367a9702258e_32_0.png)


    ## Configure Bash


    This chapter is dedicated to various Bash configuration options. When Bash starts
    as interactive shell, the following configuration files are read:


    - 1. /etc/profile

    - 2. ~/bash_profile

    - 3. ~/bash_login

    - 4. ~/profile

    - 5. ~/.bashrc

    - 6. ~/.bash_logout

    - 7. ~/.bash.bash_logout


    To keep things simple (KISS principle), most Linux users put their configuration
    into just one file - ''~bashrc''.


    ## Configure Your prompt


    Default .bashrc configuration that the user gets by default (at least in most
    of the distributions) is located in /etc/skel/.bashrc (the content of /etc/skel
    is copied to the home directory during user creation). In many cases, this .bashrc
    reads /etc/bashrc that sets the PS1 environmental variable to something like PS1="\u@\h
    \W\$ "


    This prompt translates to [USER@HOST WORKING DIRECTORY]$. This is a reasonable
    default configuration for a prompt, which might be enough. However, if you want
    a colourful, customized prompt, you can use one of the websites that help build
    one (they are amazing and handy). Alternatively, read the PROMPING section in
    man bash, and make your own.


    My favourite to make a custom prompt is ~/zprompt.net/. You can generate your
    nice colourful, customised there, then copy it to ~/.bashrc. If this is not enough,
    you can read about setting up a prompt, how to enable a particular colour on text,
    make something even more suited to your tastes. This might be particularly useful
    when your terminal supports True Colour (16 million colours in the terminal instead
    of 256). There is excellent GitHub just describing it. it is the first result
    in the DuckDuckGo search engine (that search engine does not personalise output,
    so it''s much more reliable than Google). The query I used is "terminal colour
    support". In the case that this little recommendation doesn''t convince you, here
    is the link - https://github.com/XVhika/B346728.


    ## Executing the chosen commands before the prompt.


    Bash has a special variable PROMPT_COMMAND. According to the Bash documentation:

    If set, the value is executed as a command before issuing primary prompt

    Example:


    ```

    [Alex@SpaceShip ~]$ export PROMPT_COMMAND=''date +%F-%T | tr -d "\n"''

    ```


    ```

    2018-08-20-22:58:22[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:23[Alex@SpaceShip ~]$ # Enter

    ```


    ```

    2018-08-20-22:58:26[Alex@SpaceShip ~]$ # Enter

    ```


    ## Is this out-of-season April’s Fool Joke?


    Because literally no one knows about the PROMPT_COMMAND, you can make a little
    out of season April fool joke. It''s gonna be definitely better than the Diablo
    Immortal announcement.


    For your safety remember if your colleague kills you after doing that, just just
    say:


    - IT''S A PRANK

    - IT''S JUST A PRANK BRO

    - Anonymous before getting shot.


    Ok let''s get to the code


    ```

    export PROMPT_COMMAND=''python -c "import random; import time;

    time.sleep(random.random()*5)"

    ```


    Python random() will return value (0, 1) (uniform distribution). So, in the worst
    scenario, you have to wait 5 seconds for your prompt :). Another thing pointing
    out that this command works with both Python 2 and 3.


    Now you can add it to //.bashrc.


    Note, as to the documentation PROMPT_COMMAND is invoked only for the interactive
    session. It might be an IDIOTIC (production, critical, non-standard configured
    hosts, services that start in an interactive session [you shouldn''t do that anyway),
    etc).


    ## Clear and ctrl+1 are the same?


    The last thing I would like to show about the PROMPT_COMMAND, is that there is
    a difference between clear and ctrl+1. You can export our "prank code", and check
    that the clear command you have to wait for your prompt, but when you use ctrl+1,
    you get the cleared screen without waiting. It''s because after ctrl+1, the PROMPT_COMMAND
    is not invoked.


    ## Making your own command line shortcut


    As you know from the previous chapters, the library responsible for binding shortcuts
    GNU Readline. This excellent library allows us to make our own shortcuts with
    the bind command.


    However, before you bind the key to a custom command, you should know the real
    key code that is sent to the terminal. In the case of ctrl+v the codes are obvious,
    but what about special keys? For the F9 key is encoded as ^[[20-. How do I know?
    I used the following combination: ctrl+v, F9. To get information about what function
    is bound to ctrl+v, invoke:


    ```

    [Alex@SpaceShip] $ bind -P | grep ''\C-v''

    ```


    ```

    shell-version can be found on "\C-x\C-v".

    ```


    quoted-insert can be found on "\C-q", "\C-v", "\e[2-".


    From the following output, it''s obvious that quoted-insert is. Quoted-insert
    is the mode in which the next key combination is displayed in verbatim (key code).


    After this short topic, you can make your own shortcut. In binding the F9 key
    with the date command.


    ```

    [Alex@SpaceShip BashBushido] # ^[[20- - F9 found in quoted mode

    ```


    ```

    [Alex@SpaceShip BashBushido] bind ''\e[20-\]:"date\n''

    ```


    ```

    [Alex@SpaceShip BashBushido] $ date F9

    ```


    Sun 23 13:43:21 2018


    The bind command has the following format bind "Key/s/s":"string that will be
    inserted". Note that there is no \after date, so the date command is instantly
    executed. Another thing that is worth mentioning (we will discuss it later) that
    there is a "translation" from ^ to \.


    Another example will be ctrl+q bound to date and whoami commands. Some readers
    notice that by default ctrl+gt redundantly bound to quoted-insert.


    ```

    [Alex@SpaceShip BashBushido] # ^ - ctrl-q found in quoted-insert

    [Alex@SpaceShip BashBushido] $ bind ''\C-q'':''whoami\n'' # ctrl-q

    [Alex@SpaceShip BashBushido] whoami

    Alex

    ```


    The exercise reader for using C-insert of C-q can find anything? Note that things
    are not persistent, to "unbind" just start the new terminal/session.


    The next example is alt+q that will be bound to the uptime command.


    ```

    [Alex@SpaceShip BashBushido] # ^[q alt-q found in quoted insert

    [Alex@SpaceShip BashBushido] $ bind ''\eq'':''uptime\n''

    [Alex@SpaceShip BashBushido] uptime # alt-q

    14:00:52 1:38, 4 users, load average: 0.08, 0.07, 21

    ```


    As previously mentioned, the bound command will not work with the output of the
    command format (for example "[q]"). We have make a little change to the command
    format or the output will not be understandable for readline format. For example
    atq verbatim is ^[q that changed into inline-understandable\eq. The following
    table shows the simple rules of conversion/translation from one to another.


    | Notation | Interpretation |

    | :--- | :--- |

    | \e | Used also for another binding such as special characters (for example,
    F9) or connected with meta key. Meta key on most keyboards is alt. Used when the
    prefix is ^ |

    | \c- | Represents the held ctrl key. Used when there is ^ before the key code.
    |


    Exercise for reader get ESC key in the quoted-insert mode.


    ## Make our key bindings persistent.


    One of the most important lessons that every Sysmins/DevOps/ConfigManager has
    to go through to make a configuration and make a persistent configuration are
    two separate activities. In the previous chapter, we made a configuration that
    will work in the inner shell and will be forgotten with it. Now we will make the
    configuration persistent. There are two fundamental ways to achieve.


    First, and in my opinion the better way is to put the bind commands in .bashrc.
    As said before we KISS - Keep It Stupid. Keeping everything in a single file is
    good idea.


    Below is a fragment that you can write to your .bashrc.


    The second one (and by the way more of the book) - is the use of the configuration
    file of the readline library (can be overridden by the INPUTRC variable) the HOME/.inputrc
    file.


    Sample .inputrc file:


    ```

    "\eq"="uptime\n"

    "\C-q"="whoami\n"

    "\e[20-"="date\n"

    ```


    As most of readers will quickly notice, there is also the /etc/bashrc there is
    the /etc/inputrc file that is a global start-up file used by the readline library.
    The inputrc supports comments ("lines starting with #") conditional settings and
    including other files. For example, in Enterprise Linux distributions (ver 7)
    the /etc/inputrc has conditional statements


    ```

    $ mode=emacs

    # for linux console and RB/Debian xterm

    "\e[1-": beginning-of-line

    "\e[4-": end-of-line

    ...

    ..*

    ```

