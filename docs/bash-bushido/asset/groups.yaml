    \ | nc HOST 4242\n```\n\n# Telnet check if port works\n\nTelnet is mostly a legacy,\
    \ not encrypted way to communicate between computers. It was used to remotely\
    \ control servers years ago (if you used telnet frequently, don't look at your\
