  - '[PAGE 145]


    wget -0 - http://example.com/dvd.iso \

    | tee >(shaisum) > dvd.dha1 >(md5sum) > dvd.md5 > dvd.iso


    In this case, we use wget to stdout with -0 -, then pipe it to tee that splits
    our output to new processes (process substitution) and finally saved it to the
    dvd.iso file. Note that this is parallel, so it''s faster than downloading and
    computing sums.


    The most useful option of tee is -a or --append. If the file exists, it''s not
    overwritten but appended. The largest widespread usage of tee is combining with
    such. Try the following example:


    ```

    [Alex@SpaceShip-$] echo "export EDITOR=vim" >> /etc/bashrc


    bash: /etc/bashrc Permission denied


    [Alex@SpaceShip-$] sudo echo "export EDITOR=vim" >> /etc/bashrc


    bash: /etc/bashrc Permission denied


    [Alex@SpaceShip-$] echo "export EDITOR=vim" | sudo tee -a /etc/bashrc


    export EDITOR=vim


    [Alex@SpaceShip-$] tail -1 /etc/bashrc


    export EDITOR=vim

    ```


