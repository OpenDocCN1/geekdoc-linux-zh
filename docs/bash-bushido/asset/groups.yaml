    ## top 和 HTOP


    在本章中，我将介绍用于查看和监控 Linux 进程的顶级工具。有很多工具可以帮助获取系统、进程、硬件、软件等各种统计数据。然而，我决定介绍 top 和 htop
    进程查看器/监控器，因为它们将一些实用的工具整合在了一起。如果你对深入了解进程以及如何使用基础工具监控系统感兴趣，我建议阅读更多关于 procps-ng 以及该项目维护的程序（top
    就是其中之一）。


    ## top - 顶级严肃进程监控器。


    和以前一样，top 是最知名的 Unix（以及 Linux）程序之一。大多数 Linux 发行版都使用旧 Unix top 的重写并大幅改进的版本，该项目在
    `procps-ng` 中为 Linux 重新重写了这些工具。


    在自由软件中，流行为较新的（在大多数情况下是重写或从零开始的）知名且成熟的软件加上 `-ng` 后缀。


    即使旧的 Unix top 类似，但后续章节中介绍的一些技巧将无法生效！以下是在 FreeBSD 系统中调用 top 的图像。


    ![](img/6827ee835e54ef11777a367a9702258e_70_0.png)


    top 本身展示了一组关于当前系统负载/健康/行为以及其中运行进程的有用统计数据。然而，top 程序的输出和用法可能有点困惑，所以我决定我们可以逐步研究它：一步一步来。


    由于 `props-ng` 软件包（或在 SUSE 中为 `props`）是核心（或最小）软件包组的一部分，在大多数（绝对是任何合理的现代发行版中）中，它是默认安装的。因此，top
    不需要任何额外的安装步骤。


