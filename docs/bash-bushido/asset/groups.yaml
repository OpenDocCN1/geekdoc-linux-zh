    # AWK print selected words.


    awk is another powerful tool from UNIX. It''s a full programming language, excelling
    in string manipulation to the point that some people write reports in it. Most
    Linux distributions use GNU awk (gawk) implementation, and awk is a symbolic link
    to gawk.


    ```

    Alex@SpaceStation ~$ ls -11 $(which awk)

    ```


    ```

    lrwxr-xr-x. 1 root 4 Feb 14 11:40 /usr/bin/awk -> gawk

    ```


    Because awk excels when it comes to manipulating strings, it''s frequently used
    with sed and grep. Actually, awk can handle regular expressions and much more,
    but the most straightforward and extremely useful program in awk is selecting
    the word. The syntax is as easy as awk ''{print $NUMBER}''. Note that the AWK
    program is in single quotes, so $NUMBER doesn''t expand into a shell variable.


    Look at the following example:


    ```

    {Alex |->} echo "love rock and roll" | awk ''{print $4}''

    and

    ```


    I showed a simple awk program, but why is awk better than cut with a field separator?
    To see, look at the following:


    ```

    {Alex |->} echo "love rock and roll" | cut -f4 -d''

    and

    ```


    ```

    {Alex |->} echo "love rock and roll" | awk ''{print $4}''

    and

    ```


    ```

    {Alex |->} echo "love rock and roll" | cut -f4 -d''

    rock

    ```


    ```

    {Alex |->} echo "love rock and roll" | awk ''{print $4}''

    and

    ```


    In the case of an unknown number and types of whitespaces, the awk will produce
    expected results, whereas the cut will not (ofc it''s programmatically correct
    but inconvenient).'
