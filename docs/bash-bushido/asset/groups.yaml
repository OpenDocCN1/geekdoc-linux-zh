    - COMMAND - Executed command.


    ## Customizing the TOP


    Before making the customization, I strongly recommend using the top symlink and
    invoking top by it.


    ```bash

    $ sudo ln -s /usr/bin/top /usr/bin/my_top

    ```


    ```bash

    $ my_top

    ```


    Now, the first line of the top will start with my_top - This is a feature based
    on the fact that the top, as any program invoked in Linux, knows its name. The
    top uses this information to give you the ability to make and maintain multiple
    configurations.


    The first thing that I recommend is to change the memory units. top doesn''t have
    intelligent unit scaling, it''s static and KiB that are too small to clean information
    on most systems. Two keys are responsible for memory scaling - e and E to scale
    what unit is used to display memory in the summary area. Then use e to change
    how the memory is shown in the task area. I personally scale to megabytes or gigabytes
    (I never managed a server that has more than 1024 GB of RAM (and I''m not ashamed
    of it!).


    Now we can commit our changes. To save the top settings we use with W. By using
    procs-ng the top rcfile will be placed in ${HOME}/${NAME} or ${HOME}/.config/${NAME}
    in the newer version. The newer legacy version (~/.top) is read first, then it
    uses XDG_CONFIG_HOME variable (by default set to ~/.config, unless XDG_CONFIG_HOME
    is defined).


    The next important setting that changes the update interval (time between refreshes
    and statistics). The default value is 3 seconds. Delay value can be set with d
    like delay or a seconds the requested amount. The value I personally prefer is
    5 seconds. But there is a possibility to use values from zero to 0.0001 (the real-time
    between refresh will depend on the host performance; the top can consume 100%
    of CPU to more than 31536000 (once every year). The highest value I can get is
    2174835200 (when you add a small number to it the top will use 2174835250, the
    top will report Unallocating point.). But I believe it depends on the version,
    architecture and so much - B. 2174835250.0 over 68 years, so probably longer than
    I will live).


    In the field management menu, this is bound to the f key, which can choose which
    fields are displayed. Field with up/down arrow, enable them to move with space,
    and move them with the right arrow, then up/down or left to put in the desired
    place with the left arrow. Choose the default fields you use have to be enabled!
    In field management mode, you can also set the other fields that are available
    in Alt-display (alternative display mode, with four windows). To change the currently
    edited window use the w key. The window that is used in the default mode is 1:Default.


    In case, I need the NTH field and USED the VIRT field. After it, the fields are
    sorted in the following manner: PID, USER, COMMAND, S, %CPU, NTH, USED, RES, SHR,
    %MEM, TIME+, NI, PR.


    With the fields you set up we can exit with SINGLE q (double will exit the top,
    without saving the configuration!), then already know w to make the configuration
    persistent.


    When to come to the fields, I would highly recommend not to use the SWAP field.
    As said, before the VIRT in many cases might be a little misleading metric. Because
    the top emulates the SWAP field with a simple formula SWAP-VIRT-RES in most cases,
    it is plain wrong. You can observe the SWAP field having value greater than 0
    on systems that have any memory enabled.


    The last configuration that I made is the color change. I know many IT people
    (a noble exception of UI/UX department) are not able to list more than 3 colors,
    but even if you are (I''m saying this to myself) have that set to color - Don''t
    Panic! the top allows using a stunning palette of 8 colors! Before editing colors,
    you must enable them with the z key which is typical today.


    To invoke color change use the Z key. With S, M, H, T, choose the target (part
    of the top), and then numbers between 0-7 select. After this operation, use Enter
    to save the settings and let them make it perfect.


    In my case, I used S2 M1 H4 T7 in my opinion look acceptable.


