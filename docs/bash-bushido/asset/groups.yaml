    The swappable (sometimes called) memory statistics are self-explanatory.


    The last part of it is called "task area".


    By default, there are the following columns (fields) in the task area:


    +   - PID Process ID

    - User - The user owns processes.

    - PR - Priority. There are two types of priority: Normal (number) and RT (Real
    Time). If you see it, it means the process is in the real-time mode.

    - NI - Nice Value. Note that in the most cases priority is +20. If you are unfamiliar
    with process niceness, please read man nice

    - VIRT - Virtual size. This is the calculated size measured by the process, memory
    used by the processes, the files that are mapped into (shared libraries) and memory
    shared with other processes. The VIRT is misleading and therefore useless value.

    - RES - Resident Memory - the non-swappable physical memory a task is.

    - SHR - Shared Memory - the amount of memory that can be potentially shared with
    other processes

    - S - status (Running, Sleeping, Zombie, etc.).

    - %CPU - The percentage of CPU time that the processes have used. If the process
    "ate" two cores (threads) of CPU, the 200% will be reported.

    - %MEM - Used of the physical memory.

    - TIME+ - CPU Time - total CPU time the task has used since it started. Means
    that it is'
