    # Fast substitution in the previous command.


    When you make a typo or want to change an argument any other string in the last
    command, the following trick might be handy: ^old^new replaces the old string
    with the new. You should also know that substitution by default works on the first
    match. Look at the following examples:


    ```

    [Alex@SpaceShip ~]$ google.com | grep -E "[0-9]{1,3}\.[0-9]{1,3}"

    ```


