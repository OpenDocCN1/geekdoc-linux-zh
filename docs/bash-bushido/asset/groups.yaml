    The most crucial multitail key bindings are:


    +   - q - quit - back to the previous window, quit the program if there aren''t
    any stacked windows.

    - ctrl+h - Help (In many cases, F1 invokes terminal emulator HELP).

    - b - scroll through the log. If multiple logs are currently followed, asks which
    window (log/log) should be used.

    - gg - scroll to the beginning of the file - NOTE that this is a typical vim shortcut

    - G - scroll to the end of the file - NOTE that this is a typical vim shortcut

    - / - search for string in the logs.

    - o - clear the current window


    Multitail also be used to merge multiple log files into:


    ```

    sudo multitail -ci /var/log/audit/audit.log -ci yellow -I /var/log/dmesg -ci blue
    -I /var/log/secure

    ```


    It will merge three logs into one window. Additional option -ci is responsible
    for setting different colours (red, yellow, blue) for each log.


    # Quis custodios custodes?


    This Latin phrase means - "Who watches the watchers? There was a Star Trek episode
    with the same title .. But for me, the real underrated genre of cinema art is
    the Watchmen movie - even if you don''t like superheroes, you definitely should
    watch its into. It tells more of a story than most movies I watched. But let''s
    return to our main topic - the watch command.


    The watch is part of the procs-ng package that is part of the minimal installation.
    The command itself executes another (provided) command in the chosen intervals
    (default 2 seconds). For example, to watch the uptime, we can use:


    ```

    watch uptime

    ```


    It should produce a quite similar output:


    Every 2.0: uptime Fri Dec 14 19:05:45 2018


    19:05:45 up 1:04, 4 users, load average: 0.41, 0.44, 0.31


    that will be updated every two seconds.


    Like all Linux commands, the watch has a bunch of useful options:


    +   - n or --interval changes the interval;

    - d or --differences between invocation has a different color.

    - t or --no-title doesn''t print the header (the first line contains "Every TIME:COMMAND
    $DATE and newline).


    The minimal interval is 0.1. You can try the following:


    ```

    watch -n 0.09 echo aaa

    # OR

    watch -n 0.0001 echo aaa

    ```


    The interval will be set to 0.1.


    After finding the smallest value, you can try crash watch with huge :)'
- md: '

    ```

    watch -n 12390874132098741203947 echo aaa

    ```


    And to find out that the maximum interval is 4294672995. What is equal to 2^32-1,
    so it''s an unsigned-32-bit integer. This number of seconds is more than 136 years,
    so it''s probably enough.


    Knowing program limits, we can safely affect the system load every 10 seconds:


    ```

    watch -n 10 cat /proc/loadavg

    ```


    That gives the following output:


    ```

    Every 10.05: cat /proc/loadavg Fri Dec 14 19:26:51

    0.55 0.43 0.33 1/823 931

    ```


    You can read more about /proc/loadavg in the man proc.

    To see the difference between the output of subsequent command executions, you
    can use the -d switch. The date is a perfect command to observe it.


    ```

    watch -n 1 -d date

    ```


    You can also invoke a watch without a title bar. It is useful if the command output
    is long and you want to save some space.


    ```

    watch -n 1 -t date

    ```


    With the -g option enabled watch can be used as a simple wait mechanism. On terminal
    one, start the process


    ```

    sleep 120

    ```


    On a separate terminal, find the PID of sleep.


    ```

    [Alex@Normandy 13-script]$ ps aux | grep ''[s]sleep''

    Alex 29517 0.0 0.0 107960 712/4 S+ 15:29 0:00 120

    ```


    After finding it, the following watch can be used to start another program when
    the sleep ends (or it''s terminated).


    ```

    [Alex@Normandy 13-script]$ watch -g $ps -P 29517 && echo "Sleep terminated"

    Sleep terminated

    ```


    Note that there is a case when the new program takes the PID of watched program.


    As always, I highly recommend the watch man 1 watch you can find other useful
    options like -e (stops on an error and wait for user to exit) and -g (Exit when
    the output of command changes).


    ## Print Process tree


    Because each process (the exception is kthread) is init first process, nowadays
    systemd, and some kernel-related processes like Linux have PPID other than 0,
    the processes are in a hierarchy that can be visualized with specific directed
    acyclic graph. This graph is a tree where the root node is an init process. The
    relation between two nodes is based on PPID of children and the PID of the parent.
