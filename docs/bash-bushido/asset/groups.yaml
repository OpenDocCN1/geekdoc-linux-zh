    out of season April fool joke. It''s gonna be definitely better than the Diablo
    Immortal announcement.


    For your safety remember if your colleague kills you after doing that, just just
    say


    +   IT''S A PRANK

    IT''S JUST A PRANK BRO

    - Anonymous before getting shot.


    Ok let''s get to the code


    ```

    export PROMPT_COMMAND=''python -c "import random; import time;

    time.sleep(random.random()*5)\''

    ```


    Python random() will return value (0, 1) (uniform distribution). So, in the worst
    scenario, you have to wait 5 seconds for your prompt :). Another thing pointing
    out that this command works with both Python 2 and 3.


    Now you can add it to /etc/.bashrc.


    Note, as to the documentation PROMPT_COMMAND is invoked only for the interactive
    session. It might be an IDIOTIC (production, critical, non-standard configured
    hosts, services that start in an interactive session [you shouldn''t do that anyway),
    etc).


