    # # Search/filter/sort processes


    To search or filter a process, you can use the F3 or F4 key. Search will look
    for a single process that matches the search string. You can kill, rename or get
    environment information about the selected (or Found) process. The filter will
    show all processes that match the search string, the example below filters that
    have hoopad in name. In both cases the search is not a regular expression.'
  - '[PAGE 81]


    ![](img/6827ee835e54ef11777a367a9702258e_81_0.png)


    The htop can also search for processes by PID. To do that, just type the PID.
    The search is incremental. To get what it means - look at the following example:


    Imagine that we have the following PIDs:


    +   - 1- systemd

    - 123- audit

    - 12345- spotify

    - and there are no processes with PID 12 or 1234.


    In that case the steps of searching and the results will look like:


    +   - " 0"

    - "1" -> (systemd)

    - "12" -> (systemd)

    - "123" -> (auditd)

    - "1234" -> (auditd)

    - "12345" -> (spotify).


    To sort processes, you can use F6, then select a column. As said before, in some
    terminal emulators, you can also take advantage of your mouse to click on the
    column. What is quite obvious, but worth mentioning, is sorting is better than
    filtering. You can insert the sort order with the **I** key.


    The last type of filters that I would like to demonstrate filtering by a user
    - to do so, use the **u** key then choose the username from the list - it''s much
    more convenient than having to type the whole username in the top. What is also
    worth mentioning is that you can type the username and as soon as there is only
    one match the **htop** will move the cursor to that user. For example, imagine
    that you have a user - *root* and *rpc*. When **r** is typed, nothing happens,
    but when the next letter **p** is inserted, *rpc* user will be selected.


    # top compatibility keys in htop'
  - '[PAGE 82]


    +   - M - Sort processes by memory usage.

    - P - Sort processes by CPU usage.

    - T - Sort processes by time consumed by process.

    - k - Sends chosen signal, mostly used to kill a process.


    # Other useful htop commands


    +   - p - print absolute command path

    - e - Shows the environment of the selected process.

    - s - Enable strace mode of the process (requires strace).

    - 1 - display open files (requires lsof)

    - I - Invert the sort order.

    - a - Set CPU affinity: set which CPUs process can use.

    - i - set IO/Priority (uses ionice).

    - <, >, ,, F6 - set the sorting field.


    # Summary


    After reading this chapter, manuals man 1 top and man 1 htop, you should understand
    not only how to use these processes, but also learn a lot about process-related
    topics like what is priority and state in which the processes can be. I also highly
    recommend man 5 proc that provides information about the Linux /proc pseudo-file
    system.'
