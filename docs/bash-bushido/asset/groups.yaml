    ```\n\nI didn't test it, so if it's not working you might make an issue on GitHub\
    \ repo - https://github.com/AlexBarowski/bash-bushido-errata. To exit telnet,\
    \ use **ctrl+]** (exit character), then **ENTER**, after that you should get telnet\
    \ prompt where you can send EOF (**ctrl + d**) that closes a session. As my friend\
    \ said about this amazing telnet movie - \"This is a typical Open Source project\
    \ - it's great, fun to use and watch, but also half-finished\". And with this\
    \ pure gold quote, let's finish this chapter.\n\n# Miscellaneous topics\n\nThis\
    \ chapter is the essence of Bash Bushido, it's the longest chapter in the whole\
    \ book, and it contains a lot of small solutions and programs that any sysadmin/devops/production\
    \ engineer can use.\n\n## Repeat until success.\n\nSometimes there is a need to\
    \ repeat the command as long as there is no success. In most cases, three constructions\
    \ are used:\n\n1. Run until success - never give up :) (meme below)\n2. Run until\
    \ success with a counter.\n3. Run until success with a timeout.\n\n- 1st case:\n\
    \n```bash\nwhile true; do\n  this_command_might_fail && break;\n  sleep 5; # Sleep\
    \ well little angel!\ndone\n```\n\n- 2nd case:\n\n```bash\nRETRY_COUNTER=1\nwhile\
    \ true; do\n  if [[ RETRY_COUNTER -gt 10 ]]; then\n    echo \"Sorry it didn't\
    \ work\"\n    exit 1\n  fi\n  echo \"I'm trying for $RETRY_COUNTER time\"\n  this_command_might_fail\
    \ && break;\n  RETRY_COUNTER=$((RETRY_COUNTER+1))\n  sleep 5; # You might add\
    \ some sleep\ndone\n```\n\n- 3rd case:\n\n```bash\nMY_TIMEOUT=60\nMY_BASE_TIME=$(\
    \ date +%s)\nwhile true; do\n  MY_CURRENT_TIME=$(date +%s)\n  if [[ $((MY_BASE_TIME\
    \ - MY_CURRENT_TIME + MY_TIMEOUT)) -lt 0 ]]; then\n    echo \"Timeout trap - sorry\
    \ :(\"\n    exit 1\n  fi\n  this_command_might_fail && break;\n  echo \"It didn't\
    \ work! I hope that I won't hit timeout!\"\n  sleep 5; # You might add some sleep\n\
    done\n```\n\nIn the third case, we use epoch time - a number of seconds since\
    \ 00:00:00 UTC, Thursday, 1 January 1970. It's also called Unix Time.\n\n# Print\
    \ lines based on the lines number.\n\nsed is one of the mysterious, powerful tools\
    \ from Unix that only guys with beards longer than their... FINGERS can understand.\
    \ SED stands for Stream Editor - it means that it takes stream (the file, pipe,\
    \ stdin) and performs an operation on it. That's it; it sounds simple but like\
    \ a lot of things in Unix. One of the easiest problems that can be solved with\
    \ sed is printing only lines. To do so, use 'Np' command. The N and M are numbers\
    \ of lines when p is sed command that accepts address range. In the example below,\
    \ lines from 3 to 10 are printed.\n\n```bash\n[root@Normandy ~]# cat -n /etc/passwd\
    \ -n passwd # cat -n the lines\n[root@Normandy ~]# sed -n '3,10p' passwd\n3 daemon:x:2:2:daemon:/sbin/bin/nologin\n\
    4 admin:x:3:4:adm:/var/adm:/sbin/nologin\n5 lp:x:4:7:lp:/var/spool/lpd:/bin/nologin\n\
