    # Ncat (Netcat)


    Ncat is a simple yet extremely powerful and popular tool to read and write from
    TCP, UDP, and

    IX socket connections. In many cases, it''s a backend that is frequently middle
    layer in scripts, and

    other programs.


    The Ncat is the reimplementation of netcat, both caters has the same aberration
    (nc).

    The most popular implementation is one from the nmap project, it combines the

    most prominent options from netcat''s. Installation on EL7 is as simple as:


    ```

    sudo yum install -y nmap-ncat

    ```


    After installation, there is a ncat command and the symbolic link to it nc.


    # Connect to service with netcat


    Netcat might be used to connect to any specific port/host combination.


    To connect to host with TCP, use:


    ```

    ncat HOST PORT

    ```


    To connect to host with UDP, use:'
  - '[PAGE 104]


    nc -u HOST PORT


    To connect to a Unix socket:


    nc -U /path/to/my.socket -o option can be used.


    To dump session to a file -o option


    ncat -o FILENAME HOST PORT

    The first application of ncat is to determine if a specific port is open (it''s
    one of the first things to check when a server doesn''t work as expected). Usually,
    NMap is better suited for this job, but ncat package is 40 times smaller, and
    nc is loved because of its minimalistic nature. Another usage of netcat is sending
    commands, files or payload. The payload is a technical term that can mean the
    although delivered message (when you send the message to a server, there is a
    lot of metadata - like hops, source, destination, that are necessary to deliver
    a package through a network), the second meaning is the harmful code that is delivered
    by an exploit. Payload term is frequently used by testers.


    Some "payload.txt" (HTTP request to sample Heroku application.


    ```

    GET /HTTP/1.0

    Host: example.herokuapp.com

    ```


    Because RFC 2616 (Hypertext Transfer Protocol - HTTP/1.1) defines linebreak is
    of CRLF type (more information about this problem can be found at dos2unix unix2dos
    then before piping the HTTP request that is written in the file, the unix2dos
    should be used.


    ```

    $ unix2dos payload.txt

    ```


    After this operation cat piped to netcat works like a charm.


    ```

    cat payload.txt | nc example.herokuapp.com 80

    ```


    # Ncat transfer files


    Ncat is frequently used to transfer the files over the network. Because I prefer
    self-contained examples, the localhost is used, but in a normal situation, there
    is a different host.


    To start ncat in the listening mode using the -l option


    ```

    nc -l -p 6969 > output_file

    ```


    To transfer the file, you might use the file redirection (<), or pipe:


    ```

    nc localhost 6969 > file.txt

    ```


    After these operations, the output_file should be identical to file.txt. Note
    that in a normal situation, the firewall rules should block the connection between
    hosts.


    # Ncat Transfer the whole directory


    Ncat can quickly transfer directory (and subdirectories). On the one end, the
    tar output is used as'
  - '[PAGE 105]


    input to ncat, and on the second session, the ncat output is input for tar. You
    might also use

    compression (in my case it is bzip2).


    On the receiving host use:


    ```

    nc -l 4242 | tar xzvf -

    ```


    Then on the sending host use:


    ```

    tar cvzf /path/to/directory/ | nc HOST 4242

    ```


    # Telnet check if port works


    Telnet is mostly a legacy, not encrypted way to communicate between computers.
    It was used to

    remotely control web servers years ago (if you used telnet frequently, don''t
    look at

    your metric - you are probably old!). Because telnet passes the data in clear-text,
    it''s not advisable

    to use on public networks, but to be honest, not also on any network/system. Because
    telnet

    is text-based, it might also be used to test some services.


    For example, to test if server works, you might do the following:


    ```

    [Alex@SpaceShip~$] telnet 192.168.121.170 80

    Trying 192.168.121.170...

    Connected to 192.168.121.170.

    Escape character is ''^''

    GET/

    Never give you up,

    Never let you down,

    Never run around and desert you,

    Never make you cry, Never say goodbye,

    Never gonna tell a lie and hurt you

    Connection closed by foreign host

    ```


    In this example, we use an HTTP method "GET" on a path "/" which is the root of
    the web

    server.


    Telnet can also check if it is possible to connect to the specified port (5432
    [Postgres]):


    ```

    [Alex@SpaceShip~$] telnet 192.168.121.170 5432

    Trying 192.168.121.170...

    telnet: connect to address 192.168.121.170: Connection refused

    ```


    After starting the postgresql server that listens on 5432, the same command will
    print


    ```

    telnet 192.168.121.5432

    Trying 192.168.121.170...

    Connected to 192.168.121.170.

    Escape character is ''^''

    ```


