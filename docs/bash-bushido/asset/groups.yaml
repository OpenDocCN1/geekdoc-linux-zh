    # multail


    The tail program that is used to read the last lines of the file, it leverages
    lseek system call to make it. Another widespread use of the tail is the follow
    mode, that literally follows changes appended to the file, in this case, the linux
    io_watches and inify system calls are used. Multail is like a tail on steroids
    - on tons of steroids (like professional cyclists)! On Enterprise Linux distributions,
    you can install it from EPEL repository.


    ```

    sudo yum install -y epel-release

    sudo yum install -y multail

    ```


    The default mode is the "follow" mode that works similar to the normal tail in
    the same mode. But multail has a lot abilities, like splitting the terminal window
    into multiple subwindows that have chosen files/logs.


    The most basic use is to open multiple files with it:


    ```

    multail /var/log/audit.log /var/log/dmesg /var/log/secure

    ```


    To get multiple columns, use the -s NUMBER option.


    ```

    multail -s 3 /var/log/audit.log /var/log/dmesg /var/log/secure

    ```'
