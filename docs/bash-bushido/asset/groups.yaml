    # dos2unix unix2dos


    A long, time ago, before standardization, there were multiple ways to mark a newline.
    It''s connected with the teleprinters (btw TTY is a shortcut for teletype) work.
    There are two signals (symbols) that were used to make a new line. First one is
    LF (linefeed) that moves the paper one line, the second symbol is the carriage
    return (CR) that returns the printer head to the start of a line. At some point
    in time, the OS designers decided how to represent the new line in a file. MS-DOS
    with CR and LF when used LF only. Windows inherited its newline from MS-DOS and
    Linux inherited it from Unix. Because of that, there is sometimes a need to change
    one format to another. There are two minimalistic programs, unix2dos and dos2unix
    change the newline format.


    The installation on Linux distributions 7 and 8 is as simple


    ```

    sudo yum install -y dos2unix

    ```


    Now you can change the encoding with both dos2unix and unix2dos. Example below
    uses the file to determine current newline character/s


    ```

    $ echo "Test" _ test_file

    $ file_file

    test_file: ASCII text

    $ unix2dos test_file

    unix2dos: converting file_file to DOS format ...

    $ test_file

    test_file: ASCII text, with CRLF line terminators

    $ dos2unix test_file

    dos2unix: converting file_file to Unix format ...

    $ file_file

    test_file: ASCII text

    ```


    # Get ASCII ASAP


    ASCII is an abbreviation of American Standard Code for Information Interchange.
    This is one of the oldest (older than my parents!) standards still in use. You
    probably know, the ASCII is slowly replaced by Unicode, nevertheless, it''s still
    in use!


    To use the ASCII table, with information about this standard, invoke:


    ```

    man 7 ascii

    ```


    # Set Bash auto log out


    There is possibility to set up an automatic logout based on idle time. In other
    words, if there is a period without any action, the user is logged out. The variable
    responsible for it is "TMOUT". For example, you can set it to 3600 seconds (exactly
    one hour) with the following script:


    ```

    grep TMOUT ~/.bashrc || export TMOUT=3600 >> ~/.bashrc

    ```'
