    # Extra cool reverse shortcuts in Bash:


    In the previous chapter, we looked into the basic shortcuts that help edit the
    current line. In this chapter, we are going to look into shortcuts that will boost
    your performance.


    # Clear the screen


    ctrl + 1 is the one ESSENTIAL shortcut for all power users - it clears the screen,
    just like the clear command. To keep even a simple clear command faithful to the
    spirit of Bash Bushido, I encourage readers to check what happens when we put
    clear in a Bash script, invoke it. You can try it on different terminal emulators
    to determine if this behaviour is terminal emulator dependent.


    # History search


    Edit note: If your knowledge about the bash history mechanism is near zero, you
    might read the Bash History first.


    To search the Bash history from the current position in the history (most likely
    the end), use ctrl + r. This combination is bind to reverse-search-history function.
    Then type-in in the beginning of the command you want to find. Let''s assume that
    your previous commands look like that:


    ```

    1 echo "first on history"

    ...

    150 banner "I like this"

    ...

    250 banner2 "I love this"

    500 echo "I''m last"

    ```


    We also assume that both banner and banner2 are unique throughout the whole history
    file. So, invoking the reverse-search-history and typing "bann" you might get


    (reverse-1-search) bann: banner2 "I love this"


    After invoking a command, you always arrive at the end of the history. However,
    if you press esc during the reverse history search, your current position in the
    history is going to be set to the position of currently found match. In our example
    with bann, it will be 250. Therefore subsequent reverse search will search lines
    from 250 to 1. So, the next reverse search for "bann" will return the command
    banner "I like this".


    To get back to the end of history, you can use a smooth hit-enter with the empty
    prompt. The other solution is to use end-of-history readline function that is
    bound to the alt + key'
- md: '

    The second less-known history type is the forward-search-history that is bound
    to ctrl + s. Because in most cases your current position is at the end of the
    history, it''s not as well known and be honest - not frequently used. Let''s use
    our imaginary file (the one presented above) once again. Firstly, you might use
    the beginning-of-history Routine bound to the alt + key combination, invoke the
    forward search and type ''bann'':

    (i-search) banner'': banner: ''I like this''


    Mnemonics:


    - * alt + c - start of some section (< in multiple languages (ex. HTML, XML, C/C++(include,
    templates, etc))

    - * alt + > - end of some section (>) in multiple languages (ex. HTML, XML, C/C++(include,
    templates, etc))

    - ctrl + r - reverse search from the current position in REVERSE mode

    - ctrl + l - search from the START


    ## Get Bash version


    ctrl+x then ctrl + v prints the Bash version. If bash is not in 4+ or 5 version,
    it means that you are working on a legacy system or Apple MacOS. Apple won''t
    update bash to 4.X because of the license change to GPL v3+. To be fair, in most
    cases it''s not a big deal, but if a script uses newer features (e.g. using associative
    arrays introduced in Bash 4.0) it can become quite a problem. In the beginning
    of 2019, version 5.0 was released. I highly recommend reading release notes.


    Mnemonics:


    - * ctrl+x then ctrl + version.

    - My mnemonics for ctrl+x-expert :


    ## UNDO in Bash


    Sometimes when editing a crazy-long line, you might make some mistakes. Then the
    ctrl + _ can be used to undo the damage. The same effect can be achieved with
    ctrl + 7. Both ctrl+_ (note that requires the shift key), and ctrl + 7 send the
    same input to Bash. You can check it with quoted-insert that is described in Making
    your own line shortcut.


    Mnemonics:


    - * ctrl+x then ctrl + undo.


    ## Invoke your favourite $EDITOR.


    Sometimes there is a need to type a longer script ad-hoc. It''s more convenient
    to use the favourite text editor to type the script line by line. For this use-case,
    there is a great edit-and-execute-command function, that is a bind to the ctrl
    + x then ctrl + e key command.


    According to bash source code (file bashline.c), the function responsible for
    this behaviour is named edit_and_execute_command. For the default (emacs) key
    bindings, the command invoked is fc -e \$(VISUAL: -EDITOR: emacs), which means
    the first variable that will be used is VISUAL then EDITOR (if VISUAL is not set),
    if none of them worked, emacs will be used. Emacs used to be a popular text editor
    (i personally know a few people that use it on a regular basis, but some of the
    most famous programmers like the great Linus Torvalds [Original creator and Lead
    of Linux development] love it) made by Richard Stallman (the guy who started the
    free/libre software movement). A side note, the default Readline bindings are
    emacs-like).


    To your favourite editor, you can add this to your ~/.bashrc file:


    ```

    EDITOR=vim

    ```


    Lastly, because Richard Stallman is in my opinion a very serious figure, here
    is not a-so-serious Richard Stallman picture. Kawaii-Stallman the guru of 4chan''s
    /g/ board.


