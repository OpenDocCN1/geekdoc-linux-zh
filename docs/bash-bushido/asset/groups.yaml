    The second less-known history type is the forward-search-history that is bound
    to ctrl + s. Because in most cases your current position is at the end of the
    history, it''s not as well known and be honest - not frequently used. Let''s use
    our imaginary file (the one presented above) once again. Firstly, you might use
    the beginning-of-history Routine bound to the alt + key combination, invoke the
    forward search and type ''bann'':

    (i-search) banner'': banner: ''I like this''


    Mnemonics:


    +   * alt + c - start of some section (< in multiple languages (ex. HTML, XML,
    C/C++(include, templates, etc))

    * alt + > - end of some section (>) in multiple languages (ex. HTML, XML, C/C++(include,
    templates, etc))

    * ctrl + r - reverse search from the current position in REVERSE mode

    * ctrl + l - search from the START


    # Get Bash version


    ctrl+x then ctrl + v prints the Bash version. If bash is not in 4+ or 5 version,
    it means that you are working on a legacy system or Apple MacOS. Apple won''t
    update bash to 4.X because of the license change to GPL v3+. To be fair, in most
    cases it''s not a big deal, but if a script uses newer features (e.g. using associative
    arrays introduced in Bash 4.0) it can become quite a problem. In the beginning
    of 2019, version 5.0 was released. I highly recommend reading release notes.


    Mnemonics:


    +   * ctrl+x then ctrl + version.

    * My mnemonics for ctrl+x-expert :


    # UNDO in Bash


    Sometimes when editing a crazy-long line, you might make some mistakes. Then the
    ctrl + _ can be used to undo the damage. The same effect can be achieved with
    ctrl + 7. Both ctrl+_ (note that requires the shift key), and ctrl + 7 send the
    same input to Bash. You can check it with quoted-insert that is described in Making
    your own line shortcut.


    Mnemonics:


    +   * ctrl+x then ctrl + undo.


    # Invoke your favourite $EDITOR.'
  - '[PAGE 20]


    Sometimes there is a need to type a longer script ad-hoc. It''s more convenient
    to use the favourite text editor to type the script line by line. For this use-case,
    there is a great edit-and-execute-command function, that is a bind to the ctrl
    + x then ctrl + e key command.


    According to bash source code (file bashline.c), the function responsible for
    this behaviour is named edit_and_execute_command. For the default (emacs) key
    bindings, the command invoked is fc -e \$(VISUAL: -EDITOR: emacs), which means
    the first variable that will be used is VISUAL then EDITOR (if VISUAL is not set),
    if none of them worked, emacs will be used. Emacs used to be a popular text editor
    (i personally know a few people that use it on a regular basis, but some of the
    most famous programmers like the great Linus Torvalds [Original creator and Lead
    of Linux development] love it) made by Richard Stallman (the guy who started the
    free/libre software movement). A side note, the default Readline bindings are
    emacs-like).


    To your favourite editor, you can add this to your ~/.bashrc file:


    ```

    EDITOR=vim

    ```


    Lastly, because Richard Stallman is in my opinion a very serious figure, here
    is not a-so-serious Richard Stallman picture. Kawaii-Stallman the guru of 4chan''s
    /g/ board.


    ![](img/6827ee835e54ef11777a367a9702258e_20_0.png)'
  - '[PAGE 21]


    # shell-expand-line


    ctrl alt+ e is one of my favourite bash shortcuts. This function can be used to
    check if a command is aliased, expand a subshell and make a history expansion.
    There are also other expansions, but they are not as popular as this one. You
    can find them with bind -P | grep expand.


    Examples:


    ```

    [Alex@SpaceShip BashBushido]$ mkdir {1,2,3}{a,b,c}

    ```


    ```

    [Alex@SpaceShip BashBushido]$ echo $(ls -d 1*) # # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ echo 1a 1b

    ```


    ```

    [Alex@SpaceShip BashBushido]$ grep # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ grep --color=head

    ```


    ```

    [Alex@SpaceShip BashBushido]$ history | head -3

    ```


    ```

    1 vim ~/.bashrc

    ```


    ```

    2 vim ~/.bashrc

    ```


    ```

    3 bash

    ```


    ```

    [Alex@SpaceShip BashBushido]$ ! 2 # `ctrl`+alt`+e`

    ```


    # Changes into


    ```

    [Alex@SpaceShip BashBushido]$ vim ~/.bashrc

    ```


    Unfortunately shell-expand-line function won''t expand glo.


    # glob-expansion


    Because glob might be a new word for some people, here is a minimalistic definition
    - glo are patterns that specify the pathname. I highly recommend reading the glob(7)
    manual page. The key bidding for glob-expansion is ctrl + x then *. To understand
    glob let''s look at the following'
  - '[PAGE 22]


    example.


    ```

    # This shell expansion makes directory a/a a/b and a/c


    [Alex@SpaceShip ~$] mkdir -p a/{a,b,c}/


    # This shell expansion makes three empty files with song.mp3 name


    [Alex@SpaceShip ~$] touch a/{a,b,c}/song.mp3


    [Alex@SpaceShip ~$] ls a/*.mp3


    # After hitting glob-expand-word.


    [Alex@SpaceShip ~$] ls a/a/song.mp3 a/b/song.mp3 a/c/song.mp3

    Another example:

    Alex@Normandy:/~$ ls -1 /etc/[d]*


    # After hitting glob-expand-word.


    Alex@Normandy:/~$ ls 11 -d /etc/dbus-1 /etc/dconf /etc/default #.. output truncated

    Mnemonics:

    ```


    +   - ctrl + x then *. * is a wildcard in the most popular regular expression.


    # Is that all?


    NOOO! There are many more functions implemented in Bash and Readline library.
    So many that some of them aren''t even bound out of box to any shortcut. To list
    all of them in a nice format with a name, use the previously introduced bind -P
    command.'
  - '[PAGE 23]


    # VIM me like you do VIM me like you do


    The title of this chapter is inspired by the song ''Love Me Like You Do''. Unfortunately,
    this song was used (or even made for, I don''t care) in 50 shades of Grey movie
    (I read about 25% of the first book, it was enough to make me temporary blind).
    As DevOps/admin/whatever-l-am-am-even-doing I simply love Vim.


    # What about the Bash readme’s vi(m) mode?


    Well, the vi(m) mode sucks. Really. The reason why it sucks is quite easy to explain
    - the readme (emacs like) configuration is perfect for editing a single line.
    The strongest Features of vim. like home row navigation and the ability to repeat
    something multiple times are not very useful when you edit a single line. There
    is also a problem with the fact that Bash does not show the current vim (FISH
    shell for example does) out of the box. What it''s even more irritating is that
    some of the most useful shortcuts, like ctrl1+1, won''t work. Aaaa finally, even
    with the vi mode enabled you still have to use the subset of commands from emacs
    mode.


    It''s a free country, though, so if you really want to use bash in vi mode, you
    can enable it with set -o vi.


    As a self-proclaimed vim lover, I recommend staying with the emacs shortcuts.


    > PROMOTING EMACS WHEN USING VIM

    IT''S TREASON THEN


    ![](img/6827ee835e54ef11777a367a9702258e_23_0.png)


    Even sequels are better than the new films.'
  - '[PAGE 24]


    # Best 30 minute investment - vimutor.


    Well, there are three types of people in the Linux world. The first group are
    old enough to use a pretty good operating system that includes: mailer, news reader,
    web browser, directory editor, CVS interface and a finally text editor - emacs.
    The second group are people who acknowledge that in nearly all distributions,
    on all servers, there is a minimalistic program called vi. Ahhh, and the last
    group are novices.


    Vim is an abbreviation of VI Improvved :). You can think about the vim program
    as a subset of vim functionalities. So, when you dig into the basics of "real"
    vim, you also learn vi.


    Some benefits of using vim:


    +   - It exists on all kinds and flavours of Unix, and all "worth your time" Linux
    platforms (in most cases in a minimal install - the coverage alone is enough of
    a reason to learn it.

    - Home-row navigation. No, you don''t have to use cursor (arrow) keys - it''s
    much faster to stay in the home-row.

    - Home-row centric, so you rarely move your fingers from the home row.

    - Nearly every repetitive task has a shortcut - everyone loves shortcuts.

    - Vim conserves keystrokes if you want to delete 100 lines, you just type 100ddd.

    - Easy to learn bookmarks.

    - Every worthy IDE has vim-like key bindings. Even some more exotic ones like
    RStudio or Haropod (markdown Editor) do.

    - S***LOAD of plugins.

    - Did I mention home row?


    Some addition tips:


    +   - Switching ECS with CAPS LOCK FTW! Remember that this might be irritating
    when using someone else''s computer.'
