    \n# Pushd and popd friends of mine\n\nA short story of everyday console user:\
    \ You are making changes in one directory, then cd to another, once more to another,\
    \ then to another. Then you would like to go \"back\" to the previous one. So,\
    \ you use cd - but then you cannot go any further. Your directory \"browsing\"\
    \ history is like, well - a single directory. What is more embarrassing is the\
    \ fact that in most cases it's - maybe being a Linux power user is not as hard\
    \ as most people tend to believe?\n\nNevertheless, there is a nice solution to\
    \ this situation, the popd and pushd commands. There is also a third command,\
    \ called dirs. The pushd changes directory and pushes it to the directory stack,\
    \ popd pops the directory from the stack and changes the directory to the popped\
    \ value (of as long as the stack is not empty). The dirs command prints the current\
    \ directory stack. The sample usage like this.\n\n```\n[Alexgarrus ~]$ pushd /usr/share/\n\
    /usr/share -\n[Alexgarrus share]$ dirs\n/usr/share -\n[Alexgarrus share]$ pushd\
