    you are reading, book about Bash. The first thing that you would show might be
    the famous Hello, world!


    In the case of Bash, you will probably think about something like: echo "Hello
    World!" After reading this chapter, you probably already know the output.


    ```

    [Alex@SpaceShip ~]$ echo "Hello, world!"

    bash: ! event not found

    ```


    First one is set histchars= to nothing.


    ```

    [Alex@SpaceShip ~]$ histchars=

    Alex@SpaceShip ~]$ echo "Hello, world!"

    Hello, world!

    ```


    There is another workaround/ nasty hack/possibility. You can disable history expansion
    with: set +nhistexpand


    ```

    [Alex@SpaceShip ~]$ set -ohistexpand

    Alex@SpaceShip ~]$ echo "Hello, world!"

    Hello, world!

    [Alex@SpaceShip ~]$ set -ohistexpand

    Alex@SpaceShip ~]$ echo "Hello, world!"

    bash: ! event not found

    ```'
- md: "\n# So, what is really useful?\n\nIt depends. In my opinion, most of this chapter\
    \ might be treated as a mental exercise, that I describe it because it's a cool\
    \ feature that many experienced Bash users don't know about. It's obvious that\
    \ in times of advanced terminal emulators, with support for the mouse (the middle\
    \ button for copy and paste) and normal copying and pasting, the most of these\
    \ tricks (especially modifiers) are not as useful as they used to be. So, to sum\
    \ up, I decided to put the most frequently used commands/tricks:\n\n- * sudo !!\n\
    - * ^old^new^^\n- * ![number] and !-[number]\n- * !string - Invoking a command\
    \ starting with the string\n- * ?!string? - Invoking a command containing the\
    \ string\n\n# Aliases\n\nAlias is an alternative name for computer, command, object,\
    \ user, etc. etc. Let's imagine that you are Rey from the new Star Wars movies.\
    \ Your email would be like rey@resistance.org. Moreover, probably it will be aliased\
    \ as mary.sue@resistance.org, disappointment@resistance.org or something similar.\
    \ In other words, aliases are assumed names, also known as (aka in the Internet\
    \ slang), or nicknames.\n\nThere are thousands of tools that supports aliases.\
    \ In the next chapters, I'm going to present my favourite aliases for the bash\
    \ and git version control system. Then, together, we will dive a little deeper\
    \ into aliases in Bash.\n\n# Bash aliases\n\nThe command that is responsible for\
    \ alias management has quite a surprising name - alias. To the currently used\
    \ aliases use:\n\n```\nAlex@Normandy$ alias\nalias back='#popd'\n(...) # truncated\n\
    ```\n\nBy the way - bash help states that the -p option is responsible for printing\
    \ aliases in a reusable format, but there is no real difference between empty\
    \ alias and aliases -p. The only difference that this option makes is when defining\
    \ the new alias - it also prints all other aliases (with the new one).\n\nTo define\
    \ a new alias, use alias_name='command args'.\n\nThere are some aliases I'm using\
    \ in my very own environment.\n\n```bash\nalias sudo='sudo'\nalias ..='cd ..'\n\
    alias ...='cd .. ..'\nalias ....='cd .. .. ..'\nalias.....='cd .. .. .. ..'\n\
    alias picnic='echo \"problem in chair, not in computer\"\nalias rs='reset'\nalias\
    \ clear='clear'\nalias ls='ls -Alhf --color=auto'\nhash colordiff=$/dev/null &&\
    \ diff=$colordiff\nalias md='mdir -rv'  # wait, the text says 'mdir -rv' actually,\
    \ let me re-read. \nalias md='mdir -rv' \nalias now='date +%Y-%m-%d %H:%M:%S %V\
    \ week'\nalias my_ip='curl -s ifconfig.co/json | python3 -m json.tool'\n```\n\n\
    The important and interesting aliases is sudo='sudo '. To get why I'm aliasing\
    \ so deep at the following example.\n\n```bash\n[Alex@SpaceShipBashBudo]$ alias\
    \ ok='echo OK'\nAlex@SpaceShipBashBushido$ sudo ok\nsudo: ok: command not found\n\
    \nAlex@SpaceShipBashBushido$ alias sudo='sudo '\n\nAlex@SpaceShipBashBushido$\
    \ sudo ok\n\nOK\n\nAlex@SpaceShipBashBushido$\n```\n\nThe reason why aliased sudo\
    \ works perfectly with aliases is described in ALIASES section of the Bash manual.\n\
    \nALIASES\n\n- If the last character of the alias value is a blank, then the next\
    \ command word following the alias is also checked for alias expansion\n\nGoing\
    \ back to my favourite aliases. The directories are self-explanatory. picnic uses\
    \ speak to express my displeasure with \"URGENT TECHNICAL QUESTIONS\" that I have\
    \ to support. Aliased mkdir is verbose and makes parent directories that I can\
    \ make full paths over. now prints the date with the current week number (I my\
    \ personal annual goals, so it's important). diff set colordiff instead of regular\
    \ diff. However, aliasing this one if colordiff is installed. You can read more\
    \ about my_ip further in the book.\n\n# My favourite Git aliases\n\nGit is the\
    \ most successful/popular version control system (VCS) currently used. The original\
    \ author is The Great Linus Torvald himself. Git is another excellent project\
    \ made by/for the Linux community that spread like center the best open source\
    \ software. There is plenty of great, free, sources on Git. If you are unfamiliar\
    \ with this in the class version control system, you might look at the official\
    \ free Pro Git. I bow down to the Authors of this publication.\n\nGit commands\
    \ can be tedious, but git supports aliases, instead of long commands, you can\
    \ type few characters and make some magic. From Git 1.5 (really ancient one),\
    \ git supports executing shell commands in aliases. The command must be prefixed\
    \ with !.\n\nMy aliases from ~/.gitconfig\n\n```ini\n[alias]\nl1 = log --graph\
    \ --pretty=oneline --decorate --abbrev-commit --all\nls = log --pretty-format=\"\
    %C(yellow)%h%C(d)\\ %reset%s%Cblue \\ \\[cn]\" -ndecorate\ns = status -bs\na =\
    \ add\nb = branch\nc = commit\nci = commit --interactive\nr = reset\nrv = checkout\
    \ --\n```\n\n```bash\ngit-fuckit = !git clean -x f && git reset --hard\nohh =\
    \ !git add -A . && git commit --amend\n```\n\nThe short aliases allow saving some\
    \ typing. The other are pearls that I found on the Internet - like ngit-fuckit,\
    \ others were given by friends, and ohh alias is what I'm saying before swearing).\n\
    \n![](img/6827ee835e54ef11777a367a9702258e_65_0.png)\n\n# git gets easier once\
    \ you get the basic idea that branches are homoeomorphic endofunctors mapping\
    \ submanifolds of Hilbert space.\n\n- 9 Mar via web Favorite Undo Retweet Reply\n\
    \nGit is easy.\n\nHowever, aliases can also be added from the command line (it's\
    \ useful if you have a bootstrap script, that should not override the configuration\
    \ that already exists). For example, the lol alias can be added with:\n\n```bash\n\
    git config --global alias.lol 'log --graph --pretty=oneline --decorate --abbrev-commit\
    \ --all'\n```\n\nAs said before - if you are unfamiliar with Git, please consult\
    \ the other sources.\n\n# dotfiles\n\nMany people share their configuration files\
    \ on GitHub, GitLab or BitBucket. Hackers (ppl who have exceptional software skill)\
    \ share their config in repositories that are usually named 'dotfiles'. There\
    \ is a great site on this topic - https://dotfiles.github.io/. It's excellent\
    \ to start and find the most known configurations for many programs (like emacs\
    \ or vim) or shells.\n\n# Check what command is - type.\n\nTo check what command\
    \ reality is can use type shell builtin. Type for all possible returned values\n\
    \n```bash\n[Alex@SpaceShip ~]$ type type\n```\n\ntype is a shell builtin\n\n```bash\n\
    [Alex@SpaceShip ~]$ type bash\n```\n\nbash is /usr/bin/bash\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ type case\n```\n\ncase is a shell keyword\n\n```bash\n[Alex@SpaceShip ~]$\
    \ type which\n```\n\nwhich is aliased to 'alias | /usr/bin/which --tty-only --read-alias\
    \ --show-dot --show-tilde'\n\n```bash\n[Alex@SpaceShip ~]$ type command_not_found_handle\n\
    ```\n\ncommand_not_found_handle is a function\n\n```bash\ncommand_not_found_handle\
    \ ()\n{\n  ..\n}\n```\n\n```bash\n[Alex@SpaceShip ~]$ type asdsdf\n```\n\nbash:\
    \ type: asdsdf: not found\n```\n\nThe most useful option of type is -t flag that\
    \ prints only a single word. It's useful for scripting.\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ type -t\n```\n\nbuiltin\n\n```bash\n[Alex@SpaceShip ~]$ type bash\n```\n\
    \nfile\n\n```bash\n[Alex@SpaceShip ~]$ type case\n```\n\nkeyword\n\n```bash\n\
    [Alex@SpaceShip ~]$ type which\n```\n\nalias\n\n```bash\n[Alex@SpaceShip ~]$ type\
    \ command_not_found_handle\n```\n\nfunction\n\n```bash\n[Alex@SpaceShip ~]$ type\
    \ asdsdf\n```\n\n```bash\n[Alex@SpaceShip ~\n```\n\n# Check if the command is\
    \ aliased.\n\nWe have at least 5 way to do it, 4 of them are easy to script, the\
    \ last one should be already known to an attentive reader.\n\n- 1. Use type built-in\n\
    - 2. Use which.\n- 3. Use alias to print all aliases.\n- 4. Use BASH_ALIASES variable\n\
    - 5. Use shell-expand-line.\n\n```bash\n[Alex@SpaceShip ~]$ alias\n```\n\n```bash\n\
    alias egrep='egrep --color=auto'\nalias fgrep='fgrep --color=auto'\nalias grep='grep\
    \ --color=auto'\nalias l1.='ls -d --color=auto'\nalias l11='ls -l --color=auto'\n\
    alias ls='ls --color=auto'\nalias vi='vim'\nalias which='alias | /usr/bin/which\
    \ --tty-only --read-alias --show-dot --show-tilde'\n```\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ which fgrep\n```\n\nalias fgrep='fgrep --color=auto'\n\n/usr/bin/fgrep\n\
    \n```bash\n[Alex@SpaceShip ~]$ echo ${BASH_ALIASES[fgrep]}\n```\n\nfgrep --color=auto\n\
    \n```bash\n[Alex@SpaceShip ~]$ type -t fgrep\n```\n\nalias\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ fgrep\n```\n\n# after hitting shell-expand-line shortcut `ctrl^+`alt^+`e`\n\
    \n```bash\n[Alex@SpaceShip ~]$ fgrep\n```\n\nfgrep --color=auto\n\n# Invoke NOT\
    \ aliased version of a command\n\nSometimes, we want to invoke an not aliased\
    \ version of a command. There are at least two ways of doing that:\n\n- 1. unaliased\
    \ command, invoke it, then re-alias if desired\n- 2. use x before a command.\n\
    \nLook at following listening:\n\n```bash\n[Alex@SpaceShip eurolinux7]$ ls\n```\n\
    \nDockerfile\n\n```bash\n[Alex@SpaceShip eurolinux7]$ alias ls='echo Hit Me with\
    \ Your Best Shot'\n```\n\n```bash\n[Alex@SpaceShip eurolinux7]$ ls\n```\n\nHit\
    \ Me with Your Best Shot\n\n```bash\n[Alex@SpaceShip eurolinux7]$ \\ls\n```\n\n\
    Dockerfile\n"
  mdcn: "\n\n# 所以，什么才真正有用？\n\n这取决于情况。在我看来，这一章的大部分内容可以被视为一种思维练习，我之所以描述它是因为这是一个许多经验丰富的\
    \ Bash 用户并不知道的酷功能。显而易见，在高级终端模拟器的时代，支持鼠标（鼠标中键复制和粘贴）以及普通的复制粘贴，这些技巧（尤其是修饰符）已经不再像以前那样有用了。总而言之，我决定列出最常用的命令/技巧：\n\
    \n- * *sudo !!*\n- * ^old^new^^\n- * ![number] 和 !-[number]\n- * !string - 调用以该字符串开头的命令\n\
    - * ?!string? - 调用包含该字符串的命令\n\n# 别名 (Aliases)\n\n别名是计算机、命令、对象、用户等的备用名称。让我们想象一下你是《星球大战》新电影中的\
    \ Rey。你的邮箱可能是 rey@resistance.org。此外，它可能会被别名为 mary.sue@resistance.org、disappointment@resistance.org\
    \ 或类似的名称。换句话说，别名是假想的名称，也称为（网络俚语中的 aka）或绰号。\n\n有数千工具支持别名。在接下来的章节中，我将展示我为 Bash 和\
    \ Git 版本控制系统喜欢的别名。然后，我们将一起深入探讨 Bash 中的别名。\n\n# Bash 别名\n\n负责别名管理的命令名字非常奇——`alias`。要查看当前使用的别名，请使用：\n\
    \n```\nAlex@Normandy$ alias\nalias back='#popd'\n(...) # 已截断\n```\n\n顺带一句——bash\
    \ 帮助文档指出 -p 选项负责以可重用的格式打印别名，但空别名和 `aliases -p` 之间没有真实区别。该选项唯一区别在于定义新别名时——它也会打印所有其他别名（带有新的这一个）。\n\
    \n要定义一个新的别名，使用 `alias_name='command args'`。\n\n我自己在自己的环境中使用了一些别名。\n\n```bash\n\
    alias sudo='sudo '\nalias ..='cd ..'\nalias ...='cd .. ..'\nalias ....='cd ..\
    \ .. ..'\nalias.....='cd .. .. .. ..'\nalias picnic='echo \"problem in chair,\
    \ not in computer\"\nalias rs='reset'\nalias clear='clear'\nalias ls='ls -Alhf\
    \ --color=auto'\nhash colordiff=$/dev/null && diff=$colordiff\nalias md='mdir\
    \ -rv'  # 等等，文中写的是 'mdir -rv'，让我重新读一遍。\nalias md='mdir -rv' \nalias now='date\
    \ +%Y-%m-%d %H:%M:%S %V week'\nalias my_ip='curl -s ifconfig.co/json | python3\
    \ -m json.tool'\n```\n\n重要且有趣的别名是 `sudo='sudo '`。通过下面的例子了解为什么我要给 sudo 设置如此深层的别名。\n\
    \n```bash\n[Alex@SpaceShipBashBudo]$ alias ok='echo OK'\nAlex@SpaceShipBashBushido$\
    \ sudo ok\nsudo: ok: command not found\n\nAlex@SpaceShipBashBushido$ alias sudo='sudo\
    \ '\n\nAlex@SpaceShipBashBushido$ sudo ok\n\nOK\n\nAlex@SpaceShipBashBushido$\n\
    ```\n\n别名化的 sudo 之何能与别名完美工作的原因在 Bash 手册的 ALIASES 章节中有描述。\n\nALIASES\n\n- 如果别名值的最后一个字符是空格，那么紧随别名后的下一个单词也将检查是否存在别名扩展\n\
    \n回到我最喜欢的别名。目录名是不言自喻的。`picnic` 使用 `speak` 来表达我对我必须支持的那些“紧急技术问题”的不满。别名化的 `mkdir`\
    \ 是详细模式，并可以创建我可以生成完整路径的父目录。`now` 打印带有当前周数的日期（对于我的个人年度目标，这很重要）。`diff set colordiff`\
    \ 代替普通的 `diff`。然而，如果安装了 `colordiff`，这样做是有效的。你可以在书中阅读更多关于 `my_ip` 的信息。\n\n# 我喜欢的\
    \ Git 别名\n\nGit 是目前最成功/流行的版本控制系统（VCS）。作者是伟大的 Linus Torvalds。Git 是另一个由 Linux 社区创建/为了优秀项目而有很多优秀资源。如果不熟悉这个版本控制系统，可以查看官方文档。\n\
    \nGit 命令可能很冗长，但 git 支持别名代替长命令，你只需输入几个字符就能实现魔法。从 Git 1.5 开始，支持在别名中执行 shell 命令。命令必须以\
    \ `!` 前缀。\n\n来自 `.gitconfig` 的别名：\n\n```ini\n[alias]\nl = log --graph --pretty=oneline\
    \ --decorate --abbrev-commit --all\ns = status\na = add\nb = branch\nci = commit\
    \ --interactive\nr = reset\nrv = checkout --\n```\n\n```bash\ngit-fuckit = !git\
    \ clean && reset --hard\nohh = !git add -A && git --amend\n```\n\n短别名可以节省输入时间。我在网上找到了其他的——像\
    \ `ng-fuckit`，是朋友提供的，而 `ohh` 别名正如我所说的。\n\ngit 很容易，一旦你掌握了基础概念。然而，别名也可以覆盖已存在的配置。例如，`lol`\
    \ 别名可以这样添加：\n\n```bash\ngit config --global alias.lol 'log --graph --pretty=oneline\
    \ --decorate --abbrev-commit --all'\n```\n\n之前提到的如果不熟悉 Git，请咨询其他资源。\n\n# dotfiles\n\
    \n许多人在 GitHub、GitLab 或 BitBucket 上分享他们的配置文件。程序（如 emacs 或 vim）或 shell 的配置通常命名为\
    \ 'dotfiles'。关于这个主题有一个非常好的网站——https://dotfiles.io/。\n\n# 查看命令是什么 - type\n\n要检查命令实际上可以使用内置命令\
    \ `type`。type 返回所有可能的类型。\n\n```bash\n[Alex@SpaceShip ~]$ type\n```\n\ntype 是 shell\
    \ 内置\n\n```bash\n[Alex@SpaceShip ~]$ type bash\n```\n\nbash 是 /usr/bin/bash\n\n\
    ```bash\n[Alex@SpaceShip ~]$ type case\n```\n\ncase 是 shell 关键字\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ type which\n```\n\nwhich 被别名为 'alias | /usr/bin/which --tty-only --read-alias\
    \ --show-dot --show-tilde'\n\n```bash\n[Alex@SpaceShip ~]$ type command_not_found_handle\n\
    ```\n\ncommand_not_found_handle 是一个函数\n\n```bash\ncommand_not_found_handle ()\n\
    {\n  ..\n}\n```\n\n```bash\n[Alex@SpaceShip ~]$ type asdsdf\n```\n\nbash: type:\
    \ asdsdf not found\n\ntype 最用的选项是 -t 标志，它只打印单个单词。对于脚本很有用。\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ type -t\n```\n\nbuiltin\n\n```bash\n[Alex@SpaceShip ~]$ type bash\n```\n\
    \nfile\n\n```bash\n[Alex@SpaceShip ~]$ type case\n```\n\nkeyword\n\n```bash\n\
    [Alex@SpaceShip ~]$ type which\n```\n\nalias\n\n```bash\n[Alex@SpaceShip ~]$ type\
    \ command_not_found_handle\n```\n\nfunction\n\n```bash\n[Alex@SpaceShip ~]$ type\
    \ asdsdf\n```\n\n```bash\n[Alex@SpaceShip ~\n```\n\n# 检查命令是否是别名\n\n我们至少有 5 种方法可以，其中\
    \ 4 种很容易编写脚本，最后一种留心的读者应该已经知道了。\n\n- 1. 使用内置 `type`。\n- 2. 使用 `which`。\n- 3. 使用\
    \ `alias` 打印所有别名。\n- 4. 使用 `BASH_ALIASES` 变量。\n- 5. 使用 `shell-expand-line`。\n\n\
    ```bash\n[Alex@SpaceShip ~]$ alias\n```\n\n```bash\nalias egrep='egrep --color=auto'\n\
    alias fgrep='fgrep --color=auto'\nalias grep='grep --color=auto'\nalias l1.='ls\
    \ -d --color=auto'\nalias l11='ls -l --color=auto'\nalias ls='ls --color=auto'\n\
    alias vi='vim'\nalias which='alias | /usr/bin/which --tty-only --read-alias --show-dot\
    \ --show-tilde'\n```\n\n```bash\n[Alex@SpaceShip ~]$ which fgrep\n```\n\nalias\
    \ fgrep='fgrep --color=auto'\n\n/usr/bin/fgrep\n\n```bash\n[Alex@SpaceShip ~]$\
    \ echo ${BASH_ALIASES[fgrep]}\n```\n\nfgrep --color=auto\n\n```bash\n[Alex@SpaceShip\
    \ ~]$ type -t fgrep\n```\n\nalias\n\n```bash\n[Alex@SpaceShip ~]$ fgrep\n```\n\
    \n# 按下 shell-expand-line 快捷键 `ctrl^+`alt^+`e`\n\n"
