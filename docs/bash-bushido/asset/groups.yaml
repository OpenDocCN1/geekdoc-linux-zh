    # 网络


    在本章中，我们将探索与网络相关的工具、程序和技巧。首先是一些关于 SSH 的技巧。它是最流行、使用频率最高且经过实战检验的命令/服务之一。接着我们还有一些
    netcat 技巧。Netcat 有时被称为黑客工具/网络工具的瑞士军刀。然后，你将学习如何扫描网络并检查开放端口。还有其他好东西！


    为了有一个良好的开始——这里我最喜欢的 XKDC 漫画之一：


    ![](img/6827ee835e54ef11777a367a9702258e_93_0.png)


    XKDC 尽职尽责漫画


    # SSHFS - SSH 文件系统


    当需要编辑只有 ssh 访问权限的远程服务器上的文件时，通常会出现以下模式：


    - 1. 复制文件，在本地编辑，然后复制回来。

    - 2. 在远程编辑文件。


    第一种方法非常繁琐，特别是当你进行实时补丁时（这是一种我不推荐的糟糕体验）。第二种方法只有在远程服务器上有相应的可用工具时才有效。但如果有另一种更好的、能结合两者优点的可能性呢？


    是的，这是可能的！你可以使用 sshfs 挂载远程文件，它惊奇地利用了 SSH。


    第一个也是最重要的优点是，你可以在远程服务器上进行实时编辑，同时使用你电脑上喜欢的程序/工具。sshfs 的第二个优点是它基于 SSH 文件传输协议（SFTP），所有现代
    ssh 客户端和服务器都支持它。sshfs 不需要新的软件、权限管理以及防火墙上的端口开放。此外，SSH 是最经过实战检验且安全的协议之一，因此即使在公共网络上也可以安全地使用。


    要在企业级 Linux 系统上安装 sshfs，你应该从 EPEL 仓库安装 `fuse-sshfs` 软件包：


    ```

    sudo yum install -y epel-release

    ```


    ```

    sudo yum install -y fuse-sshfs

    ```


    FUSE 是 Filesystem in Userspace（用户空间文件系统）的缩写。sshfs 基于 FUSE，因此管理挂载时不需要 root 权限。sshfs
    示例：


    ```

    [Alex@SpaceShip ~$] sshfs Alex@server1:/var/www/static /home/Alex/static

    ```


    它允许在本地机器上编辑 server1 上的静态内容。要卸载基于 FUSE 的挂载，可以使用常用的命令：


    ```

    umount /home/Alex/static

    ```


    但这需要 root 权限！如果你的用户拥有 sudo 权限，可以使用 `sudo !!` 技巧。但更好的解决方案是使用 `fusemount` 命令——类似于
    unmount 标志：


    ```

    [Alex@SpaceShip ~$] fusemount -u /home/Alex/static

    ```


    它将卸载之前挂载的内容。


    我不推荐将 sshfs 作为始终挂载的生产环境网络文件系统，但它对于小范围的读写是非常完美的。SSHFS 的潜在问题是 I/O 错误，但它们不会损坏文件系统。


    # 允许使用 sshfs（以及其他基于 FUSE 的）


    有时与其他用户共享基于 FUSE 的资源可以节省麻烦。因此，你需要编辑 `/etc/fuse.conf`（取消注释或添加 `allow_other` 行）。然后在挂载命令中传递
    `allow_other` 选项。不需要重启服务，因为每次挂载基于 FUSE 的资源时都会读取 `/etc/fuse.conf`。


    之前使用 sshfs 创建共享挂载的示例：


    ```

    sshfs Alex@server1:/var/www/static /mnt/static -o allow_other

    ```


    # 带有 X Server 的 SSH


    有时你想从一个仅开启了 ssh 的主机（99.9% 的生产服务器）使用图形化工具。例如，从虚拟化图形控制台（如 VirtualBox）为虚拟机添加磁盘要简单得多。在这种情况下，你可以轻松地通过
    ssh 设置 X11 转发。你必须使用 `-x` 选项（尤达口吻）。用于转发 GUI 程序的系统需要安装适当的库，如果有图形化工具，它可能已经安装了这些库。


    下方的监听操作将在远程主机上启动 firefox：


    ```

    [Alex@SpaceShip] $ ssh -X myuser@remote

    [myuser@remote]$ firefox

    ```


    存在一些安全方面的考虑。根据《红帽 7 安全指南》，不建议对未知主机进行 X11 转发。另一个重要说明是有一个正在大力开发的 X11 替代品——Wayland。Wayland
    某种可以通过 Xwayland 以 X11 风格转发，但一些用户声称它存在 Bug。


    # 使用 ssh 进行端口转发


    在许多环境中，有一个“跳板机”（jump server）、跳板主机或跳箱，用于访问另一个安全区域（如公司局域网）的计算机。有时你需要从该节点获取服务（如 Web
    服务器）。在这种情况下，SSH 端口转发（也称为 SSH 隧道）可能会大有用场。


    转发有两种类型。第一种是本地转发。因为通过示例更容易理解，请看以下命令：


    ```

    ssh -L 9999:webserver:443 root@jumphost

    ```


    它将打开本地端口 9999。当你使用浏览器（或任何使用 https 的工具，如 curl 或 wget）访问 `http://localhost:9999`
    地址时，连接将传输到 jumphost，由它充当内容的 Web 服务器。


    另一种方法是远程端口转发，原理相同但方向相反（:)。请看以下示例：


    ```

    ssh -R 8080:localhost:80 root@jumphost

    ```


    它将允许任何通过 `http://jumphost:8080` 访问跳板机的人连接到本地的 80 端口。


    请注意，示例也使用了 Web 服务器，但任何其他使用 TCP 的协议都可以工作。superuser.com 上也有一个关于如何为 UDP 服务配置端口转发的极佳答案。你可以在这里阅读：https://superuser.com/questions/53103/udp-traffic-through-ssh-tunnel。


    涉及 SSH 隧道时，存在一些安全方面的考虑——因为可能会传输跳板机可以访问的内容，所以添加额外的安全性是明智的。SSH 隧道可能被用于创建后门，因此应该对主机的
    SSH 守护进程配置进行适当加固。


    但使用端口转发也有益处。例如，当你有一个使用 HTTP 而非 HTTPS 的不安全 Web 应用时，你可以将连接本地转发到服务器本身。


    ```

    ssh -L 9999:localhost:80 root@webserver

    ```


