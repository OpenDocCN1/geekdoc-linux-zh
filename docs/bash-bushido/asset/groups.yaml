    Compiling htop is extremely easy.


    ```bash

    # Install build dependencies

    sudo yum install -y @development git libncursesw ncurses-devel

    # Compilation

    git clone https://github.com/hishamham/htop.git

    cd htop

    ./autogen.sh && ./configure && make

    sudo make install

    ```


    Note that these commands will install htop in the default location. In order to
    install htop in different path, use


    ```bash

    ./autogen.sh && ./configure --prefix=/somewhere/over/rainbow && make

    ```


    # Customizing the htop


    Regarding the installation method, the htop can be invoked, like a top, without
    any argument. To start it, just use **htop** on the command line.


    We can start our customization by looking into help (F1 from the terminal itself
    (in my case the **terminator**) and invokes it: help). What can you do to get
    the open help window? It might seem funny, but try to click F1. Yeah, click with
    a menu. Contrary to the prevailing opinion, it is possible to write the console
    program with support for the mouse. Some based programs actually support this
    feature, and **htop** is one of them. The other options to get built-in help are
    the well-known top-menu or h keys.


    With the help, we can start the setup of our htop. The configuration file is saved
    in `~/.config/htoprc` and despite the comment of the author, the simpler parser
    used to read the configuration file makes the user friendlier.


    The htop with default configuration looks like:


    ![](img/6827ee835e54ef11777a367a9702258e_78_0.png)


    To start the customization, use the **Setup** with F2 key or click on the **Setup**
    with mouse :). The first thing that is worth noting is the meters section has
    two columns, and we can freely change the position of all elements. To change
    the position of an element (meter), select it (or use the mouse); then use **Enter**
    to change the element mode or add more, then use arrows to move it to the chosen
    place, then hit Enter one more time to commit the change. To change the style
    of the meter printing (for example, bar chart, text information, or seven-segment
    display) use the space key.


    The first thing that I am always doing is removing the CPUs broken down into individual
    CPUs. It''s not really practical when working with an 8+ CPUs system (there are
    edge cases when it might be useful, for example, if there is a single thread application,
    but most services [DB, WEB, Network file systems] support multiprocessing and
    multithreading). To remove this information I choose CPU 1/2 then CPU 2/2 use
    the delete key. As always in it it is impossible to achieve same with the mouse.
    Next, I add the CPU Average metric, and put it on the top of the left column and
    change the printing style to Text.


    I make similar changes until my left column has:


    - Load average [Text]

    - CPU [Text]

    - Task Counter [Text]

    - Memory [Text]

    - Swap [Text]


    And my right column has:


    - Clock [Text]

    - Uptime [Text]

    - Battery [Bar]


    I use the battery because my basic computer is my notebook. But I''m part of the
    Glorious Gaming Master Race.


    ![](img/6827ee835e54ef11777a367a9702258e_79_0.png)


    Honestly, I have a great gaming setup that I''m not using because of the lack
    of time. Sometimes I wish one day to become rich and spend like a whole week gaming!
    Of course, real gamers will consider this amount of time as pathetic.


    Back to the main topic - the next section is Display options. If I have the following
    enabled:


    - Hide kernel threads - in most scenarios, the kernel threads give only the so-called
    "data smog".

    - Display threads in a different color

    - Highlight program "basename",

    - Highlight numbers in memory counters

    - Detailed CPU time (SYSTEM)/IO-wait/HARD-IRQ/Soft-IRQ/Steal/Guest CPU Counts
    depend on 1 - well most programming languages count from 0.


    Because in most cases (might depend on your terminals), the default colors scheme
    is excellent, I will skip Colors section, especially that htop provides built-in
    themes so there is no much to set.


    The last setup configuration is setting the Columns, called Fields in the top,
    remove VIRT (M_SIZE), metric and for setup, this is out of this phase. There is
    a little curious that you can add the OMM column, that gives Out-of-Memory (OMM)
