    # Timeout


    有时程序可能需要完全不可预测的时间来完成。在大多数情况下，程序运行比预期快是好的，问题通常出现在程序运行时间过长。对于这种情况，有可能运行带时间限制的命令。解决这个问题有多种方法，但我最喜欢来自
    GNU Core 的 `timeout` 命令。请查看以下内容。


    ```bash

    [Alex@Normandy ~]$ timeout 5 sleep 7 || echo "Sorry this failed"

    ```


    在这个示例中，我们将超时时间设置为 5 秒，并运行一个将在退出前睡眠 7 秒的程序 (sleep)。由于 sleep 被 timeout 杀死，它的返回状态为非零，因此调用了
    `echo "Sorry this failed"`。


    一些实用的命令选项有：


    - --signal 允许在超时时设置特定信号。

    - --foreground 当 timeout 未直接从 shell 运行（换句话说 timeout 在脚本中使用）。

    - --preserve-status 返回被杀死进程的状态。


    持续时间本身可以使用以下单位：


    - s - 秒（默认值）

    - m - 分钟

    - h - 小时

    - d - 天


    所以，以下示例是有效的：


    ```bash

    timeout 20m /opt/backup/run.sh

    ```


    ```bash

    timeout 2h /opt/backup/full.sh

    ```


    ```bash

    timeout 1d /opt/backup/full_with.sh

    ```


    还可以设置比秒更短的时间：


    - 0.005

    - 0.05

    - 0.5


    如果命令输出的退出状态为 124，或者 SIGTERM 的状态是默认。因为 timeout 是 GNU 项目的一部分，可以在 Coreutils 页面中找到更详细的信息。


