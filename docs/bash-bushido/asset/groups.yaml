    +   • alt + o - turn broadcast off.


    The terminal can also be assigned to custom named group. Each terminal might have
    only one group assigned, but group can have multiple terminals. To create a group,
    you click on the little icon in the left corner of the terminal. Then create a
    group or assign terminal to the existing group. Groups also support broadcasting,
    to broadcast to the group use:


    +   • alt + g - turn broadcast to a group.

    • alt + o - turn broadcast off.


    # Resizing and creating new windows


    To perfect your setup, you might resize the terminal, both mouse (drag the terminal
    "title" bar) and keyboard might be used to change the terminal size:


    +   • ctrl + shift + arrow - resize the current terminal by one character in the
