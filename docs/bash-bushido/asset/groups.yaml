    # Series selection


    The following 10 series are available


    | Series | Description |

    |---|---|

    | Q | Quick QWERTY course (Q1 - Q05) |

    | R | Long QWERTY course (R1 - R14) |

    | T | QWERTY touch typing (T1 - T16) |

    | V | More over QWERTY (V1 - V19) |

    | U | QWERTY Review (U1 - U13) |

    | D | Dvorak touch typing (D1 - D14) |

    | C | Colemak touch typing (C1 - C17) |

    | M | Typing drills (M1 - M11) |

    | S | Speed drills (S1 - S44) |

    | N | Calculator keypad (N1 - N03) |


    Arrow keys to move around, SPACE or RETURN to select and ESCAPE to go back


    GNU Typist -gtypist.


    The program is self-explanatory, there is small help section that you can read,
    but it is as minimalistic as the program itself.


    When it comes to practice time, multiple studies about learning proved that daily
    practice sessions are more effective than long sessions that are not regular.
    Another important consideration is how to replace the old routine. If you learn
    how to type a letter correctly, always do it the right way. You might type slower,
    but after some time, your speed will increase learning takes time at first, but
    after some time, dramatically.


    The default gtypist color scheme might be unreadable on some terminal emulators
    and color combinations. Luckily, you can experiment and change it.


    - - -c or --colors set the main colors of the program.

    - --banner-colors allows setting up all colors used by gtypist. You can choose
    colors numbers 0-7, what gives us 64 combinations for foreground and background
    colors.


    Sample gtypist invocation with changed color schemes:


    ```

    gtypist -c=0,2

    ggtypist --banner-colors=0,2,3,2

    ```


    The typewriter is a neat utility that uses fortune command output and invokes
    gtypist on it. Because typewriter is written in Perl it requires working interpreter.

