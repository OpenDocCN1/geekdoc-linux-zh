    /etc/sysconfig /usr/share -\n[Alexgarrus sysconfig]$ /workspace /workspace dirs\n\
    /etc/sysconfig /workspace /usr/share -\n[Alexgarrus sysconfig]$ popd\n~/workspace\
    \ -\n[Alexgarrus workspace]$ popd\n/usr/share -\n[Alexgarrus share]$ popd\n```\n\
    \n```\n[Alexgarrus ~]$ popd\n-bash: popd stack empty\n```\n\nHowever, this is\
    \ BashBushido - we can do it a little bit better and maybe smarter :) I enjoyed\
    \ switching from cd to something that better suits me -> pushd.\n\nTo do so, I\
    \ added the following to my .bashrc. I would like to note that this solution is\
    \ loosely based on\n> Jonathan M Davis\" Unix and Linux Stack Exchange\nhttps://unix.stackexchange.com/a/42918/18307\n\
    \n```\nalias cd='pushd'\n```\n\n```\nalias back='popd'\n```\n\n```\npopd()\n{\n\
    \    builtin popd > /dev/null\n}\n```\n\n```\npushd()\n{\n    if [ $# -eq 0 ];\
    \ then\n        builtin pushd \"${HOME}\" > /dev/null\n    elif [ $1 == \"--\"\
    \ ]; then\n        builtin popd > /dev/null\n    else\n        builtin pushd \"\
    $1\" /dev/null\n    fi\n}\n```\n\nPlease note that this solution works well with\
    \ the default workflow of most Linux users. There is no need to switch from the\
    \ well-known (even automatic) cd to pushd.\n\n```\n[Alex@garr ~]$ cd /usr/share/\n\
    [Alex@garr share]$ dirs\n/usr/share -\n[Alex@garr share]$ cd ~/workspace/\n[Alex@garr\
    \ workspace]$ cd /etc/sysconfig/\n[Alex@garr sysconfig]$ dirs\n/etc/sysconfig\
    \ /usr/share -\n[Alex@garr sysconfig]$ back\n[Alex@garr workspace]$ dirs\n/~/workspace/\
    \ /usr/share -\n[Alex@garr workspace]$ cd -\n[Alex@garr share]$ dirs\n/usr/share\
    \ -\n[Alex@garr share]$ popd\n[Alex@garr share ~]$ dirs\n-\n```\n\n```\n[Alex@garr\
    \ ~]$ cd -\n-bash: popd: directory stack empty\n[Alex@garr ~]$ dirs\n```\n\nAnother\
    \ nice thing about this solution is that it works as expected with both cd - and\
    \ empty cd).\n\nThe pushd and popd can also be used in scripts. I personally used\
    \ them when:\n\n- 1. You have to change the specific directory (that is unknown\
    \ before running, so it can't be hardcoded).\n- 2. Saving some information (in\
    \ the most cases path) that is relative to this directory.\n- 3. Use Popd/or pushd\
    \ directory to another.\n- 4. Reconstruct the relative information, then popd.\n\
    \nIt might look like an overkill but sometimes it's the simplest solution. In\
    \ my case, the other options used a try-and-error method to reconstruct the data\
    \ placement.\n\n# shops and autocd\n\nshop is a little shell built-in that can\
    \ enable additional shell behaviour. To get a list of options that it can enable,\
    \ invoke shop without any argument. One of my favourite options that I used to\
    \ turn is autocd. If the first argument (normally the command) is a directory,\
    \ Bash invokes cd that changes our location to it.\n\nTo get what I'm talking\
    \ about look at the following example:\n\n```\n[Alex@Normandy: BashBushido]$ shop\
    \ -s autocd\n```\n\n```\n[Alex@Normandy: BashBushido]$ /home\n```\n\n```\ncd /home\n\
    ```\n\n```\n[Alex@Normandy: home]$ /home/Alex\n```\n\n```\ncd /home/Alex\n```\n\
    \n```\n[Alex@Normandy: ~]$ echo $OLDPWD\n```\n\n```\n/home\n```\n\n```\n[Alex@Normandy:\
    \ ~]$ shopt -u autocd\n```\n\n```\n[Alex@Normandy: ~]$ /home\n```\n\n```\nbash:\
    \ /home is a directory\n```\n\nAs you can deduce shopt -s autocd enables (sets)\
    \ and shopt -u disables (unset) the option. The minor inconvenience is that the\
    \ directory changed this way won't use our ali cd command that leverage pushd\
    \ and popd (described in the previous chapter). This is the reason why I decided\
    \ not to use it. On the other hand, it correctly set the OLDPWD variable, what,\
    \ as said before, is enough for most users.\n\n# bashrc generator\n\nBecause I\
    \ can and have some free, I decided to make a simple GitHub website that allows\
    \ you to generate the .bashrc with options presented through this chapter and\
    \ many more! You can find it here: https://alexbaranowski.github.io/bash-rc-generator/\n\
    \n# Bash History\n\nFortunately, we will not concern ourselves with hard to tell,\
    \ morally ambiguous, and incarnate humans/nations histories. We will talk about\
    \ the GNU History library that saves and manages the previously typed lines. The\
