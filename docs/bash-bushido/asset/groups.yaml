    # Scan ports with Nmap


    Before performing a network scan, you should get a written consent that allows
    you to do it. There is an excellent example on nmap.org - https://nmap.org/book/legal-issues.html
    that gives a real-life example of what can potentially happen


    Nevertheless, after being warned, nmap is frequently used by users to scan their
    networks. It''s so popular that many distributions have it in their repo. Installing
    it on EL7 is as simple as:


    ```

    sudo yum install

    ```


    Now you can start scanning your network :). I personally use it to determine open
    ports on hosts that are “forgotten” and find IP addresses of printers.


    To scan for TCP ports, use:


    ```

    nmap -sT HOST

    ```


    To scan for UDP ports, use:


    ```

    nmap -sU HOST

    ```


    To enable OS detection, use:


    ```

    nmap -O --scan-guess HOST

    ```


    The most commonly used options is -A (like all) with -T4. The -T option sets the
    timing, there is a possible to use all names. The values are from 0 to 5, or from
    paranoid (0) to insane (5). The 4 is also called aggressive. -A options things
    like OS detection, version detection, scripts scanning and traceroute. As always
    may be found in the nmap manual.


    ```

    nmap -A -T insane 192.168.121/24

    ```


    To scan a whole network (local in your workplace) just choose whichever IP and
    add a mask (nmap will automatically convert it to a network).


    To get more information about nmap, I recommend the official website - nmap.org,
    there is a separate book section. The author of Nmap - “Fyodor” Lyon, wrote the
    book half of which is available online - https://nmap.org/book/toc.html. If you
    are really interested in network scanning, you might consider buying the official
    book; in way you support the development and show the gratitude to the author.


    Bonus meme describing the Bash Bushido author.'
