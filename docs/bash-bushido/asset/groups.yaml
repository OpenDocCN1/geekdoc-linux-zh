    [root@localhost ~]# history

    1 2018-07-31 11:26:55 echo "my_new_pass" | passwd --stdin >> root

    2 2018-07-31 12:26:04 echo "my_new_pass2" | passwd --stdin >> root

    3 2018-07-31 12:26:08 history

