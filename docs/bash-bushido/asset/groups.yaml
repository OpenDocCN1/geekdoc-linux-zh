    # 我们的武士道。


    我并不是日本专家（看中国动画不会让你成为专家 ;;))），但根据互联网上最可靠的来源之一（维基百科；是的，我写了这本书，我是说维基百科可能是一个很好的来源）；武士道（Bushido）意为“战士之道”。在摇滚开发者和忍者测试员的时代，仅仅做一个普通的战士可能看起来有点无聊。但我有不同的看法——管理、自动化、保持基础设施的安全和更新是一项需要大量的辛苦工作。有时
    Linux 内核选项中的微小改动就能节省数千美元，一个导致权限过大的错误配置就会让公司破产，并让用户/客户的数据面临风险。在基础设施方面，你需要一位武士，一个可以花费无数小时进行调试、测试、调整和自动化的的人。最后，《Bash
    武士道》听起来非常棒，富有意义且独特。


    # 摇滚开发者


    ![](img/6827ee835e54ef11777a367a9702258e_8_0.png)


    # 安装问题


    嗯，有很多 Linux 发行版。你知道的，至少有几百个。凭我记忆，我可以列出 10 多个包管理器，再加上一个对 Apple 用户来说必不可少的。每个流行的系统/包管理器的安装步骤有时比讨论的实际技巧或提示还要长。


    正因如此，我只介绍企业 Linux 7.X 版本（CentOS, RHEL, Scientific Linux, Oracle, EuroLinux）的安装过程，这些发行版的寿命很长，在未来
    2 或 3 年内不会过时。


    # 让键盘成为你最好的朋友。


    在无数的文本、文章和教程中，我们读到在计算机上完成工作的更好、更快或更短的方法。最显著的例子就是复制和粘贴。几乎所有的电脑用户都知道 `ctrl + c`
    和 `ctrl + v` 是最好的教程和文章生成朋友。另一个例子是 `ctrl + alt + delete` 键组合——所有 Windows 用户必须知道。


    然而，除非你是盲打高手，否则很多这些技巧、提示和快捷键并不好用。为什么？因为其中很多都利用了打字时键盘上的典型手部位置。例如，整个 vim 导航都是为了使用主行设计的。为了获得正确的姿并成为高级用户，你真的应该学习如何打字。


    有些读者可能不知道什么是盲打。幸运的是，维基百科上有一个盲打的极佳定义。简而言之——盲打是在不看的情况下使用（在键盘上输入）键盘的能力。


    # 学习盲打的理由。


    - 平均打字速度约为每分钟 40 个（WPM），不看键盘打字的人速度是平均水平的两倍。注意，平均打字速度包含了盲打者群体。

    - 你可以完成任务。

    - 这样，你有更多时间工作、喝咖啡和社交活动。

    - 你在打字时就能看到错误（你看着的是显示器，而不是键盘）。所以，发现并纠正错误的概率更高。

    - 当你写邮件时，你看起来不像像阿米士人。

    - 从你的角度来看，最有优势的事实是，我的大脑和我正在编写的代码（文本）之间没有障碍。键盘是我身体的“延伸”。写程序并不容易，当你正与键盘“搏斗”时，你很容易集中注意力。


    # 不学习盲打的理由。


    - 当你在一家公司工作时，你有充足的时间，并且说你的工作完成了比实际完成它更重要，那么盲打可能会提高你的工作表现，这反而是不受欢迎的。

    - 404 - 未找到任何真实可接受的论据。


