    ## shell-expand-line


    ctrl alt+ e is one of my favourite bash shortcuts. This function can be used to
    check if a command is aliased, expand a subshell and make a history expansion.
    There are also other expansions, but they are not as popular as this one. You
    can find them with bind -P | grep expand.


    Examples:


    ```

    [Alex@SpaceShip BashBushido]$ mkdir {1,2,3}{a,b,c}

    ```


    ```

    [Alex@SpaceShip BashBushido]$ echo $(ls -d 1*) # # `ctrl`+alt`+e`

    ```


    ## Changes into


    ```

    [Alex@SpaceShip BashBushido]$ echo 1a 1b

    ```


    ```

    [Alex@SpaceShip BashBushido]$ grep # `ctrl`+alt`+e`

    ```


    ## Changes into


    ```

    [Alex@SpaceShip BashBushido]$ grep --color=head

    ```


    ```

    [Alex@SpaceShip BashBushido]$ history | head -3

    ```


    ```

    1 vim ~/.bashrc

    ```


    ```

    2 vim ~/.bashrc

    ```


    ```

    3 bash

    ```


    ```

    [Alex@SpaceShip BashBushido]$ ! 2 # `ctrl`+alt`+e`

    ```


    ## Changes into


    ```

    [Alex@SpaceShip BashBushido]$ vim ~/.bashrc

    ```


    Unfortunately shell-expand-line function won''t expand glo.


    ## glob-expansion


    Because glob might be a new word for some people, here is a minimalistic definition
    - glo are patterns that specify the pathname. I highly recommend reading the glob(7)
    manual page. The key bidding for glob-expansion is ctrl + x then *. To understand
    glob let''s look at the following example.


    ```

    # This shell expansion makes directory a/a a/b and a/c


    [Alex@SpaceShip ~$] mkdir -p a/{a,b,c}/


    # This shell expansion makes three empty files with song.mp3 name


    [Alex@SpaceShip ~$] touch a/{a,b,c}/song.mp3


    [Alex@SpaceShip ~$] ls a/*.mp3


    # After hitting glob-expand-word.


    [Alex@SpaceShip ~$] ls a/a/song.mp3 a/b/song.mp3 a/c/song.mp3

    Another example:

    Alex@Normandy:/~$ ls -1 /etc/[d]*


    # After hitting glob-expand-word.


    Alex@Normandy:/~$ ls 11 -d /etc/dbus-1 /etc/dconf /etc/default #.. output truncated

    Mnemonics:

    ```


    - - ctrl + x then *. * is a wildcard in the most popular regular expression.


    ## Is that all?


    NOOO! There are many more functions implemented in Bash and Readline library.
    So many that some of them aren''t even bound out of box to any shortcut. To list
    all of them in a nice format with a name, use the previously introduced bind -P
    command.


    ## VIM me like you do VIM me like you do


    The title of this chapter is inspired by the song ''Love Me Like You Do''. Unfortunately,
    this song was used (or even made for, I don''t care) in 50 shades of Grey movie
    (I read about 25% of the first book, it was enough to make me temporary blind).
