    编译 htop 极其简单。


    ```bash

    # 安装构建依赖

    sudo yum install -y @development git libncursesw ncurses-devel

    # 编译

    git clone https://github.com/hishamham/htop.git

    cd htop

    ./autogen.sh && ./configure && make

    sudo make install

    ```


    注意，这些命令将把 htop 安装在默认位置。若要在不同的路径安装 htop，请使用：


    ```bash

    ./autogen.sh && ./configure --prefix=/somewhere/over/rainbow && make

    ```


    # 自定义 htop


    关于安装方法，htop 可以像 `top` 一样在无需任何参数的情况下调用。要启动它，只需在命令行输入 **htop** 即可。


    我们可以通过查看帮助来开始自定义（在终端本身中按下 F1 键，在我的情况下是 **terminator**，并调用它：help）。你可以做什么来打开帮助窗口？这看起来可能有点滑稽，但请尝试点击
    F1。是的，用鼠标点击。与流行观点相反，编写支持鼠标的控制台程序是可以。某些程序实际上支持此功能，而 **htop** 就是其中之一。获取内置帮助的其他选项是使用广为人知的顶部菜单或
    `h` 键。


    借助帮助，我们可以开始设置我们的 htop。配置文件保存在 `~/.config/htoprc` 中，尽管作者有所注释，但用于读取配置文件的简单解析器使得界面对用户更加友好。


    默认配置的 htop 看起来如下：


    ![](img/6827ee835e54ef11777a367a9702258e_78_0.png)


    要开始自定义，使用 F2 键进入 **Setup**（设置）或用鼠标点击 **Setup** :)。第一要点的是 meters（计量表）部分有两个列，我们可以自由更改所有元素的位置。要更改元素（计量表）的位置，请选中它（或使用鼠标）；然后使用
    **Enter** 更改元素模式或添加更多，然后使用箭头将其移动到选定的位置，再次按下 Enter 提交更改。要更改计量表的打印样式（例如条形图、文本信息或七段显示器），请使用空格键。


    我总是做的第一件事就是移除拆分为单个 CPU 的部分。在具有 8 个以上 CPU 的系统上工作时，这并不实际（在某些边缘情况下可能有用，例如对于单线程应用程序，但大多数服务
    [数据库、WEB、网络文件系统] 都支持多进程和多线程）。要删除这些信息，我选择 CPU 1/2 然后 CPU 2/2 并使用删除键。一如既往，通过鼠标无法实现。接下来，我添加
    CPU Average（CPU 平均值）指标，将其放在左列顶部并将打印样式更改为 Text（文本）。


    我进行类似的修改，直到我的左列包含：


    - Load average [Text]（负载平均值）

    - CPU [Text]

    - Task Counter [Text]（任务计数）

    - Memory [Text]（内存）

    - Swap [Text]（交换内存）


    我的右列包含：


    - Clock [Text]（时钟）

    - Uptime [Text]（运行时间）

    - Battery [Bar]（电池）


    我使用电池显示是因为我的基础电脑是笔记本电脑。但我也是光荣游戏大师族（Glorious Gaming Master Race）的一员。


    ![](img/6827ee835e54ef11777a367a9702258e_79_0.png)


    老实说，我有一个非常棒的游戏配置，但因为缺乏时间而未使用。有时我希望有一天变得富有，花整一周的时间打游戏！当然，真正的玩家会认为这段时间很可怜。


    回到主主题 - 下一部分是 Display（显示）选项。如果我开启了以下项：


    - Hide kernel threads（隐藏内核线程）——在大多数情况下，内核线程只产生所谓的“数据噪音”。

    - Display threads in a different color（用不同颜色显示线程）

    - Highlight program "basename"高亮程序名）

    - Highlight numbers in memory counters（高亮内存计数中的数字）

    - Detailed CPU time (SYSTEM)/IO-wait/HARD-IRQ/Soft-IRQ/Steal/Guest CPU Counts
    减 1 —— 嗯，大多数编程语言从 0 开始计数。


    由于在大多数情况下（可能取决于你的终端）默认颜色方案非常出色，我将跳过 Colors（颜色）部分，尤其是 htop 提供了内置主题，因此没什么需要设置的。


    最后的设置配置是设置 Columns（列），在顶部称为 Fields（字段），移除 VIRT (M_SIZE) 指标，对于设置来说，这超出了阶段。有趣的是你可以添加
    OMM 列，它提供了内存溢出杀手（OMM killer）的得分。这对于异常负载极高的系统可能有用。


    设置完成后，使用 F10 键更改配置。


    更改后我的 htop 配置：


    ![](img/6827ee835e54ef11777a367a9702258e_80_0.png)


    # 搜索/过滤/排序进程


    要搜索或过滤进程，可以使用 F3 或 F4 键。搜索（Search）将查找匹配搜索字符串的单个进程。你可以对选定的（或找到的）进程杀死、重命名或获取环境信息。过滤（Filter）将显示所有匹配搜索字符串的进程，下面的示例过滤了名称中包含
    hoopad 的进程。在这两种情况下，搜索都不是正则表达式。


    ![](img/6827ee835e54ef11777a367a9702258e_81_0.png)


    htop 还可以通过 PID 搜索进程。要实现这一点，只需输入 PID。搜索是增量的。要了解它的意思，请看以下示例：假设我们有以下 PIDs：


    - 1- systemd

    - 123- audit

    - 12345- spotify

    - 没有 PID 为 12 或 1234 的进程。


    在这种情况下，搜索步骤和结果将如下：

    （此处省略原文中重复的描述内容）

    '
