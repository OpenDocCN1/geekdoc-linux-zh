    sudo yum install -y guake

    ```


    安装完成后，我建议调用 guake，它会将自己绑定到 F12 键上。我强烈推荐这样做，因为只有极少数应用程序实际上会使用 F12，而且在大多数情况下（如网页浏览器和开发工具），它们也绑定了其他组合键（如
    Firefox 中的 ctrl-shift+i）。配置完成后，可以通过 F12 或任何其他选定的键显示/隐藏 guake。


    ![](img/6827ee835e54ef11777a367a9702258e_152_0.png)


    这一段专门针对 gnome 3 —— 如果要在 gnome 中添加自启动，你可能需要 gnome-tweak-tools 或 gnome-session-properties。gnome-tweak-tools
    使用 /usr/share/applications 中的桌面文件，而 gnome-session-properties 则允许运行任何命令。


    Guake 支持：


    - 颜色

    - 选择不同颜色配置的可能性。

    - 创建/导入自定义颜色配置的选项。

    - 支持鼠标事件（滚动 + 点击）。

    - 根据当前终端宽度/大小调整文本缩放和换行。

    - 创建多个标签页。

    - 设置背景图像的可能性。

    - 支持真彩（True Color）。

    - 存储超过千行输出内容的能力。


    像任何合理的终端模拟器一样，Guake 允许通过 ctrl+shift+t 创建新标签。标签切换绑定到 ctrl-1、Page Up/Page Down。


    下面是我那华丽的 21:9 显示器的缩放后的截图（以防导致电子书阅读器崩溃）。


    ![](img/6827ee835e54ef11777a367a9702258e_153_0.png)


    ## Yakuake - KDE 下拉式终端


    Guake 项目的主要对手是 Yakuake，它是 Gnome 和 KDE 之间无休竞争的一部分。这种竞争让我和我任何其他 Linux 用户感到快乐，因为有选择本身就很好。Yakuake
    的开发由 KDE 基金在其 Git 上管理。我必须说，我喜欢它独立于 GitHub/GitLab，但我不知道贡献/提交问题是如何管理的。


    和 Guake 一样，Yakuake 也可以 EPEL 仓库中找到。安装非常简单：


    ```bash

    sudo yum install -y epel-release

    sudo yum install -y yakuake

    ```


    像 guake 一样，yakuake 在首次启动时也会询问是否将 F12 设置为开启/关闭键。关于 Yakuake 支持的功能：


    - 颜色

    - 颜色配置。

    - 创建/导入自定义颜色配置。

    - 支持鼠标事件（滚动 + 点击）。

    - 根据当前终端宽度/大小调整文本缩放和换行。

    - 创建多个标签页的可能性。

    - 支持真彩（True Color）。

    - 存储“无限”数量输出行的能力。

    - 垂直和水平分割允许在一个窗口内实现多个终端。


    旧的 Yakuake 截图：


    ![](img/6827ee835e54ef11777a367a9702258e_154_0.png)


    我对 Yakuake 的考虑是初学者的默认设置。例如，全屏是 F51 内部的 ctrl + shift + F1。新标签是 ctrl+shift+t；切换标签你必须在
    Page Up/Down 之前使用 shift + insert。它与其他 KDE 应用程序配合得很好且良好，但这不是我的口味。总的来说，Yakuake 比
    Guake 更强大，但它也需要更多努力来学习和养成习惯。


    ## TERMINATOR - 让终端回归网格化！


    Terminator 自述为——一个窗口中的多个 GNOME 终端”。Terminator 允许你以网格形式或正如非技术学院所说的“矩阵”形式排列终端。与
    tmux 和 screen 相比，为了利用 Terminator 的大部分功能，你不需要学习很多快捷键或编写复杂的配置文件。换句话说，Terminator
    是用户友好的，一个典型的无需任何配置就能大放异光的零入门程序。大多数操作都可以通过鼠标完成，轻松学习任何快捷键。


    在 Linux 发行版上安装 Terminator：


    ```bash

    sudo yum install -y epel-release

    sudo yum install -y terminator.

    ```


    我还使用了 OBS（开放构建服务）上提供的较新版本，由我最喜欢的公司之一 SUSE 支持和维护，https://build.opensuse.org/repositories/home:alex_baranowski/terminator-1.9-ep7。


    安装 Terminator 后，你可以右键点击并选择水平或垂直分割，这将终端窗口拆分为二。Terminator 的另一个功能是支持拖放，因此你可以轻松点击几次排列你的终端“矩阵”，并让技术较低的
    Linux 用户印象深刻。


    朋友 A：你听过智者 Alex 的故事吗？例如，全屏是 F51 内部的 ctrl + shift + F1。新标签是 ctrl+shift+t；切换标签你必须在
    Page Up/Down 之前使用 shift + insert。它与其他 KDE 应用程序配合得很好且良好，但这不是我的口味。总的来说，Yakuake 比
    Guake 更强大，但它也需要更多努力来学习和养成习惯。


    朋友 A：你听过智者 Alex 的故事吗？例如，全屏是 F51 内部的……不。


    ### 最重要的快捷键：


    - ctrl + shift + o - 水平打开。

    - ctrl + shift + e - 垂直打开。

    - ctrl + shift + v - 拆分。

    - alt + i - 向上。

    - alt + j - 向下。

    - alt + k - 向左。

    - alt + l - 向右。

    - alt + x - 水平缩放。

    - alt + y - 垂直缩放。

    - ctrl + z - 切换终端。


    ### 终端快捷键：


    - ctrl+shift+t - 新标签页。

    - ctrl+1/2/3 - 标签切换。

    - Page Up/Page Down - 滚动。


