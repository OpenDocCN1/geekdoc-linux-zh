    ## Top and HTOP


    In this chapter, I will introduce the top-rated tools for viewing and monitoring
    Linux processes. There are many tools that help get different statistics about
    the system, processes, hardware, software, etc. However, I decided to present
    top and htop process viewers/monitors because they combine some of the useful
    ones in one place. If you are interested in getting more into the processes, how
    to monitor system with basics tools. I recommend reading more about procps-ng
    and programs maintained by this project (the top is one of them).


    ## top - tier serious process monitor.


    As before, the top is one of the most well-known Unix (and Linux) programs. Most
    Linux distributions use the rewritten and much-improved version of the old Unix
    top, the project that rewrote these tools with Linux in procps-ng.


    It''s popular in the free software to give -ng suffix to the newer (in most cases
    rewritten or from scratch) version of well-known and established software.


    Even if the old Unix top is similar, some of the tricks presented in the next
    chapters won''t work! Below is the image of the top invoked in FreeBSD system.


    ![](img/6827ee835e54ef11777a367a9702258e_70_0.png)


    The top itself presents a set of useful statistics about the current system load/health/behaviour
    and processes running inside of it. However, output and usage of the top program
    might be a little confusing, so I decided that we can tinker with it : one step
    at the time.


    Because props-ng package (or props in SUSE) is part of the core (or minimal) package
    group, in most (definitely in any reasonable modern distro), it is installed by
    default. Therefore, the top doesn''t require any extra steps to install.


