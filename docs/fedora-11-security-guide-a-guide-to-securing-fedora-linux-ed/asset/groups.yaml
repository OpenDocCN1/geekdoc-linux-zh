    - session required pam_unix.so The final line instructs the interface of the pam_unix.so
    module to manage the session. This module logs the user name and the service type
    to /var/log/secure at the beginning and end of each session. This module can be
    supplemented by stacking with other session modules for additional functionality.


    ## 2.4.5. Creating PAM Modules


    You can create or add PAM modules at any time for use by PAM-aware applications.


    For example, a developer might create a one-time-password creation method and
    a PAM module to support it. PAM-aware programs can immediately use the new module
    and password method without being recompiled or otherwise modified.


    This allows developers and system administrators to mix-and-match, as well as
    test, authentication methods for different programs without recompiling them.


    Documentation on writing modules is included in the /usr/share/doc/pam-<version-number>/directory,
    where <version-number> is the version number for PAM on your system.


    ## 2.4.6. PAM and Administrative Credential Caching


    A number of graphical administrative tools in Fedora provides users with elevated
    privileges for up to five minutes. It is important to understand how this mechanism
    works, because a user who walks away from a terminal while pam_timestamp.so is
    in effect leaves the machine open to anyone with physical access to the console.


    In the PAM timestamp scheme, the graphical administration application prompts
    the user for the root password when it is launched. When the user has been authenticated,
    the pam_timestamp.so creates a timestamp file. By default, this is created in
    the /var/run/sudo/ directory. If the timestamp file already exists, graphical
    administrative programs do not prompt for a password. Instead, the pam_timestamp.so
    refreshens the timestamp file, reserving five minutes of unchallenged administrative
    access for the user.


    You can verify the actual state of the timestamp file by inspecting the /var/run/sudo/<user>
    file. For the desktop, the relevant file is root. If it is present and its timestamp
    is less than five minutes old, the credentials are valid. The existence of the
    timestamp file is indicated by an authentication icon which appears in the area
    of the panel.


    ### 2.4.6.1. Removing the Timestamp File


    Before abandoning a console while PAM timestamp is active, it is recommended that
    the timestamp file be destroyed. To do this from a graphical environment, click
    the authentication icon on the panel. This causes a dialog box to appear. Click
    Authorization to destroy.


    You are currently authorized to configure system-wide settings (that affect all
    users) without typing the password. You can give up.


    You should be aware of the following with respect to the timestamp file:


    - If logged to the system remotely using ssh, use /sbin/pam_timestamp -k root
    to destroy the timestamp file.


    - You need to run the /sbin/pam_timestamp -k command from the same terminal from
    which you launched the privileged application.


    - You must be logged in as the user who invoked the pam_timestamp.so module in
    order to use the /sbin/pam_timestamp -k command. Do not log in as root to use
    this command.


    - If you want to kill the credentials on the desktop (without using the Authorization
    action), use the following command:

    `/sbin/pam_timestamp -k root`


    Failure to use this command will only remove the credentials (if any) from the
    pty where you ran the command. Refer to the pam_timestamp page for more information
    about destroying the timestamp file.


    ### 2.4.6.2. Common PAM timestamp Directives


    The pam_timestamp.so module accepts several directives. The following are the
    two most used:


    - timestamp_timeout — Specifies the period (in seconds) for which the timestamp
    file is valid. The default value is 300 (five minutes).


    - timestampdir — Specifies the directory in which the timestamp file is stored.
    The default value is /var/run/sudo.


    Refer to Section 2.8.9.1, "Installed Documentation" for more information about
    controlling the pam_timestamp.so module.


    ## 2.4.7. PAM and Device Ownership


    In Fedora, the first user who logs in to the physical console of the machine can
    manipulate devices and perform tasks normally for the root user. This is controlled
    by a PAM module called pam_console.so.


    ### 2.4.7.1. Device Ownership


    When a user logs in to a Fedora system, the pam_console.so is called by login
    or graphical login programs, gdm, and xdm. If this is the first user to log in
    at the physical console — referred to as the console — the module grants the user
    ownership of a variety of devices normally owned by root. The console user owns
    these devices until the last session for that user ends. After this user has logged
    out, ownership of devices reverts back to the root user.


    The devices affected, but are not limited to, sound cards, disk devices, and CD-ROM
    devices, simplifying common tasks for the console user.


    You may find the list of devices controlled by pam_console.so by editing the following
    files:


    - /etc/security/console.perms


    - /etc/security/console.perms-50-default.perms


    You can change the permissions of different devices than those listed in the above
    files, or override the specified defaults. Rather than modifying the 50-default.perms
    file, you create a new file (for example, xx-name.perms) and enter the required
    modifications. The name of the new default file must begin with a number higher
    than 50 (for 51-default.perms). This will override the defaults in the 50-default.perms
    file.


    > Warning If the gdm, kdm, xdm display manager configuration file has been altered
    to allow users to log in and it is configured to run at level 5, it is advisable
    to change the directives in the /etc/security/console.perms to the following values:

    ```

    <console>=tty[0-9]* vc/[0-9]* :0\.[0-9]* :0\.[0-9] :0

    <console>=:\.[0-9] :0

    ```

    This prevents remote users from gaining access to devices and restricted applications
    on the machine.


    If the gdm, kdm, and xdm display manager configuration file has been altered to
    allow remote users to log in and the host is configured to run at multiple user
    level other than 5, it is advisable to remove the <console> directive entirely
    and change the directive to the following value:

    ```

    <console>=tty[0-9][0-9] vnc/[0-9][0-9]*

    ```


    ### 2.4.7.2. Application Access


    The console user also has access to certain programs configured for use in the
    /etc/security/console.apps/ directory.


    This directory contains configuration files which enable the console user to run
    applications in /sbin and /usr/sbin.


    These configuration files have the same name as the applications they set upon.


    One notable group of applications that the console user has access to are three
    that shut down or reboot the system:


    - /sbin/halt

    - /sbin/reboot

    - /sbin/poweroff

    '
