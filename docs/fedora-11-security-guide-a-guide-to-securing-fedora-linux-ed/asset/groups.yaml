    - 复杂的网络架构可能使建立防火墙规则变得困难，特别是当与 IP 映射或本地子网及 DNS 网络结合时 |

    | 代理 | 代理防火墙将所有协议或来自局域网客户端的请求发送到代理，由代理代表客户端向 Internet 发起请求。代理机器在恶意用户和内部网络客户端之间充当缓冲区。
