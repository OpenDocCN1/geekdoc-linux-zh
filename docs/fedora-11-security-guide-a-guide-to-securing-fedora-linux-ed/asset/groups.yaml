    ### 3.7.8. 7-Zip Encrypted Archives


    7-Zip is a cross-platform, next generation, file compression tool that can also
    use encryption (AES-256) to protect the contents of this archive. This is extremely
    useful when you need to move data between multiple computers using varying operating
    systems (i.e. Linux at home, Windows at work) and you want a portable encryption
    solution.


    ### 3.8.1. 7-Zip Installation in Fedora


    7-Zip is not a base package in Fedora, but it is available in the software repository.
    Once installed, the package will update alongside the rest of the software on
    the computer with no special attention necessary.


    ### 3.8.2. Step-by-Step Installation Instructions


    - Open a Terminal: Click ''Applications'' -> ''System Tools'' -> ''Terminal''

