    ## Encryption


    There are two main types of data that must be protected: data at rest and data
    in motion. No single implementation can prevent all methods of compromise, so
    it is important to understand both types of data and use appropriate protection
    strategies.


    ### 3.1. Data at Rest


    Data at rest is data that is stored on a hard drive, tape, DVD, or other media.
    This information''s biggest threat comes from being stolen. Laptops in offices,
    CDs going through the mail, and backup tapes left in the wrong places are all
    examples of events where data can be compromised.


    ### 3.2. Full Disk Encryption


    Full or partition encryption is one of the best ways of protecting your data.
    Not only is each file protected but also the temporary storage that may contain
    files is also protected. Fedora 9, and later, natively supports LUKS Encryption.
    LUKS will encrypt your hard drive partitions so your computer is off. This will
    protect your computer from attackers using user-mode to login to your computer
    or otherwise gain access.


    Full disk encryption solutions like LUKS only protect the data when your computer
    is off. Once the computer is on and LUKS decrypted, the files are available to
    anyone who would normally have access to them. To protect your files when the
    computer is on, use full disk encryption in combination with another solution
    such as file encryption.


    ### 3.3. File Base Encryption


    GnuPG is an open source version of PGP that allows you to sign and encrypt a file
    or an email message. This is useful to maintain integrity of the message or file
    and also protects the confidentiality of the information contained within the
    file. In case of email, GPG provides dual protection. Not only can it provide
    Data at Rest protection but also Data In Motion protection when the message has
    been sent across the network.


    File based encryption is used to protect a file after it has left your computer,
    such as when you send a CD through the mail. Some file based encryption solutions
    will leave remnants of the encrypted files that attackers with physical access
    to your computer can recover under some circumstances. Your user name and password
    should never be transmitted over a network without protection as it could be intercepted
    and used by someone to impersonate you.

