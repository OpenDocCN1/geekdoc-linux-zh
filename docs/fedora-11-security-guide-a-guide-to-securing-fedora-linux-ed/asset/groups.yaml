    ## FORWARD and NAT Rules


    ```

    [root@myServer ~] # sysctl -w net.ipv4.ip_forward=1

    ```


    This configuration change is only valid for the current session, it does not persist
    beyond a reboot or network service restart. To permanently set IP forwarding,
    edit the /etc/sysctl.conf file as follows:


    Locate the following line:


    ```

    net.ipv4.ip_forward = 0

    ```


    Edit it to read as follows:


    ```

    net.ipv4.ip_forward = 1

    ```


    Use the following command to enable the change to the sysctl.conf file:


    ```

    [root@myServer ~] # sysctl -p /etc/sysctl.conf

    ```


    ## 2.8.5.1. Postrouting and IP Masquerading


    Accepting forwarded packets by the firewall''s internal device allows LAN nodes
    to communicate with each other; they still cannot communicate to the Internet.


    To allow LAN nodes with private IP addresses to communicate with external public
    networks, configure the firewall for IP masquerading, which masks requests from
    LAN nodes with the IP address of the firewall''s external device (in this case,
    eth0):


    ```

    [root@myServer ~] # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    This rule uses the NAT packet matching table (-t nat) and specifies the built-in
    POSTROUTING chain for (-A POSTROUTING) on the firewall''s external device (-o
    eth0).


    POSTROUTING allows packets to be altered as they are leaving the firewall''s external
    device.


    The -j MASQUADE target is specified to map the private IP address of a node with
    the external address of the firewall/gateway.


    ## 2.8.5.2. Prerouting


    If you have a server on your internal network that you want to make available
    externally, you can use the -j DNAT of the PREROUTING chain in NAT to specify
    a destination IP address and port where incoming packets requesting a connection
    to your internal service can be forwarded.


    For example, if you want to forward incoming HTTP requests to your dedicated Apache
    HTTP Server at 172.31.0.23, use the following command:


    ```

    [root@myServer ~] # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j
    DNAT --to 172.31.0.23:80

    ```


    This rule specifies that the nat uses the built-in PREROUTING chain to forward
    incoming HTTP requests exclusively to the listed destination IP address of 172.31.0.23.


    ## Chapter 2. Securing Your Network


    Note

    If you have a default policy of DROP in your FORWARD chain, you must append a
    rule

    forward all incoming HTTP requests so that destination NAT routing is possible.
    To do this,

    the following command:


    ```bash

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 80 -d 172.31.0.23
    -j ACCEPT

    ```

    This rule forwards all incoming HTTP requests from the firewall to the intended

    destination: the Apache server behind the firewall.


    ## 2.8.5.3. DMZs and IPTables


    You can create iptables to route traffic to certain machines, such as a dedicated
    HTTP or FTP

    server, in a demilitarized zone (DMZ). A DMZ is a special local subnet dedicated
    to providing

    services on a public carrier, such as the Internet.


    For example, a set rule for routing incoming HTTP requests to a dedicated HTTP
    server at 10.0.4.2

    (outside of the 162.168.1/24 range of the LAN), NAT uses the PREROUTING table
    to forward the

    packets to the appropriate destination:


    ```

    root@myServer ~ # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j DNAT
    --to destination 10.0.4.2:80

    ```


    With this command, all connections to port 80 from the LAN are routed to the HTTP

    server on a network separate from the rest of the internal network. This form
    of network segmentation

    can provide safer than allowing HTTP connections to a machine on the network.


    If the HTTP server is configured to accept secure connections, then port 443 must
    be forwarded as

    well.


    ## 2.8.6. Malicious Software and Spoofed IP Addresses


    More rules can be created to control access to subnets, or even specific nodes,

    within a LAN. You can also restrict certain applications or programs such as trojans,
    worms,

    and other client/server nodes from contacting their server.


    For example, trojans scan networks for services on ports from 31337 to 31340 (called
    the elite

    ports in cracking terminology).


    Since there are no legitimate services that communicate via these non-standard
    ports, blocking them

    can diminish the chances that potentially infected nodes on your network independently

    communicate with their remote master servers.


    The following rules drop all TCP traffic that use port 31337:


    ```

    root@myServer ~ # iptables -A OUTPUT -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    ```


    You can also block outside connections that attempt to spoof IP address ranges
    to infiltrate.


    For example, if you have a default policy of DROP in your FORWARD chain, you must
    append a rule

    forward all incoming HTTP requests so that destination NAT routing is possible.
    To do this,

    the following command:


    ```bash

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 80 -d 172.31.0.23
    -j ACCEPT

    ```

    This rule forwards all incoming HTTP requests from the firewall to the intended

    destination: the Apache server behind the firewall.


