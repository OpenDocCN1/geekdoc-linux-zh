    # How Kerberos Works


    unencrypted password

    A plain text, human-readable password.


    # 2.6.3. How Kerberos Works


    Kerberos differs from the username/password authentication methods. Instead of
    authenticating each user to check network service, Kerberos uses symmetric encryption
    and a trusted third party (KDC), to authenticate users to a suite of network services.
    When a user authenticates to the KDC, the KDC sends a ticket specific to that
    back to the user''s machine, and Kerberos-aware services look for the ticket on
    the user''s machine rather than requiring the user to authenticate using a password.


    When a user on a Kerberos-aware network logs in their workstation, the principal
    is sent to the KDC as part of a request for a TGT from the Authentication Server.
    This request can be sent by the log-in program so that it is transparent to the
    user, or be sent by the kinit program after the user logs in.


    The KDC checks for the principal in the database. If the principal is found, the
    KDC creates a TGT, which is encrypted using the user''s key and returned to that
    user.


    The login or kinit program on the client decrypts the TGT using the user''s key,
    which computes from the server. The user''s key is used only on the client and
    not transmitted over the network.


    The TGT expires after a period of time (usually ten to twenty-four hours) and
    is stored in the client''s credentials cache. An encryption secret is set compromised
    for use to to an attacker for a short period of time. After the TGT has been issued,
    the user does not have to re-enter their password until the TGT expires or they
    log out and log in.


    Whenever the user needs access to a network service, the client software uses
    the TGT to request a new ticket for that specific service from the TGS. The ticket
    is then used to authenticate the user to that service transparently.


    > Warning The Kerberos system can be compromised if a user on the network authenticates
    a non-Kerberos aware by transmitting a password in plain text. The use of Kerberos
    aware services is highly discouraged. Such services include Telnet and FTP. The
    use of other insecure protocols, as SSH or SSL-secured services, however, is preferred,
    although not ideal.


    This is a only overview of how Kerberos authentication works. Refer to Section
    2.6.10, *Additional Resources* for links to more in-depth information.


    > Note Kerberos depends on the following network services to function correctly.
    - Approximate clock synchronization between the machines on the network.


    A clock synchronization program should be set up on the network servers, such
    as ntp. Refer to /usr/share/ntp-<version-number>/index.html for details on setting
    up Network Time Protocol servers (where <version-number> is the version number
    of the ntp package installed on your system).'
