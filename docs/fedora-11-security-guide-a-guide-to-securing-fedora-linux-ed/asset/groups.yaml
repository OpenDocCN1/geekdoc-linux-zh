    ## Chapter 2. Securing Your Network


    ## 2.2.6.3. User Accounts


    Because FTP transmits unencrypted usernames and passwords over insecure networks
    for authentication, it is a good idea to deny system users access to the server
    from their user accounts.


    To disable all user accounts in **vsftpd**, add the following directive to /etc/vsftpd/vsftpd.conf:


    ```

    local_enable=NO

    ```


    ### 2.2.6.3.1. Restricting User Accounts


    To disable FTP for specific accounts or groups of accounts, such as the root user
    and those with *sudo* privileges, the easiest way is to use a PAM list file as
    described in Section 2.1.4.2.4, "Disabling Root Using PAM". The PAM configuration
    file for vsftpd is /etc/pam.d/vsftpd.


    It is also possible to disable user accounts within each service.

    To disable user accounts in **vsftpd**, add the username to /etc/vsftpd.ftpsusers


    ## 2.2.6.4. Use TCP Wrappers To Control Access


    Use TCP Wrappers to control access to every FTP daemon as outlined in Section
    2.2.1.1, "Enhancing Security With TCP Wrappers".


    ## 2.2.7. Securing Sendmail


    Sendmail is a Mail Transfer Agent (MTA) that uses the Simple Mail Transfer Protocol
    (SMTP) to deliver electronic messages between MTAs and to deliver clients or agents.
    MTAs are capable of encrypting traffic between one another, most do not, so sending
    email over any public networks is an inherently insecure form of communication.


    It is recommended that anyone planning to implement a Sendmail server address
    the following issues.


    ### 2.2.7.1. Limiting a Denial of Service Attack


    Because of the nature of email, a detected attacker can fill the server with mail
    easily and cause a denial of service. By setting limits to the directives in /etc/sendmail.mc,
    the effectiveness of such attacks is limited.


    - **CONNECTION_RATE_THROTTLE** — The number of connections the server can receive
    per second. By default, Sendmail does not limit the number of connections. If
    a limit is set and reached, further connections are denied.


    - **MAX_DAEMON_CHILDREN** — The maximum number of child processes that can be
    spawned by the server. By default, Sendmail does not limit the number of child
    processes. If a limit is set and reached, further connections are denied.


    - **MIN_FREE_BLOCKS** — The minimum number of free blocks must be available for
    the server to accept mail. The default is 100 blocks.


    - **MAX_HEADERS_LENGTH** — The maximum acceptable size (in bytes) for a message
    header.


    - **MAX_MESSAGE_SIZE** — The maximum acceptable size (in bytes) for a single message.


    ### 2.2.7.2. NFS and Sendmail


    Never put the mail pool directory, `/var/spool/mail/`, on an NFS shared volume.


    NFSv2 and NFSv3 do not maintain control over user and group IDs, or more users
    have the same UID, and receive and read each other''s mail.


    > Note: With NFSv4 using Kerberos, this is not the case, since the SECRPC_GSS
    kernel module does not utilize UID-based authentication. However, it is still
    considered good practice to put the mail pool directory on NFS shared volumes.


    ### 2.2.7.3. Mail-only Users


    To prevent local user exploits on the Sendmail server, it is best for mail users
    to only access the Sendmail server using an email program. Shell accounts on the
    mail server should not be allowed and all user shells in the `/etc/passwd` file
    should be set to `/sbin/nologin` (with the possible exception of root user).


    ## 2.2.8. Verifying Which Ports Are Listening


    After configuring network services, it is important to pay attention to which
    ports are actually listening on the system''s network interfaces. Any open ports
    can be evidence of an intrusion.


    There are two basic approaches for listing the ports that are listening on the
    network. The less reliable approach is to query the network stack using commands
    as `netstat -an` or `lssof -i`. This method is less reliable since these programs
    do not connect to the machine from the network, but rather check to see what is
    running on the system. For this reason, these applications are frequent targets
    for replacement by attackers. Crackers attempt to cover their tracks if they unauthorized
    network ports by replacing `netstat` and `lssof` with their own, modified versions.


    A more reliable way to check which ports are listening on the network is to use
    a port scanner such as `nmap`.


    The following command issued from the console determines which ports are listening
    for TCP connections from the network:


    ```

    nmap -sT -0 localhost

    ```


    ```

    The output of this Nmap 4.68 ( http://nmap.org ) at 2009-03-06 12:00 EST

    Interesting ports on localhost.localdomain (127.0.0.1):

    Not shown: 1711 closed ports

    PORT STATE SERVICE

    22/tcp open ssh

    25/tcp open smtp

    111/tcp open auth

    113/tcp open open

    631/tcp open ipp

    834/tcp open unknown

    2601/tcp open zebra

    32774/tcp open times-rpc11

    Device type: general purpose

    ```

    '
