    ## 第 2 章 保护网络安全


    ## 2.2.6.3. 用户账户


    由于 FTP 在不安全网络上通过未加密的用户名和密码进行身份验证，因此禁止系统用户通过其用户账户访问服务器是一个做法。


    要禁用 **vsftpd** 中的所有用户账户，请在 /etc/vsftpd/vsftpd.conf 中添加以下指令：


    ```

    local_enable=NO

    ```


    ### 2.2.6.3.1. 限制用户账户


    要对特定帐户或账户组（例如 root 用户和具有 *sudo* 权限的用户）禁用 FTP，最简单的方法是使用第 2.1.4.2.4 节“使用 PAM 禁用
    root”提到的 PAM 列表文件。vsftpd 的 PAM 配置文件为 /etc/pam.d/vsftpd。


    也可以在每个服务内部禁用用户账户。

    要禁用 **vsftpd** 中的用户账户，请将用户名添加到 /etc/vsftpd.ftpsusers。


    ## 2.2.6.4. 使用 TCP Wrappers 控制访问


    按照第 2.2.1.1 节“使用 TCP Wrappers 增强安全性”所述，使用 TCP Wrappers 控制每个 FTP 守护程序的访问。


    ## 2.2.7. 保护 Sendmail


    Sendmail 是一种邮件传输代理 (MTA)，使用简单邮件传输协议 (SMTP) 在 MTA 之间传递电子邮件，并传递给客户端或代理。MTA 能够加密彼此之间的流量，但大多数不能，因此在任何公共网络上发送电子邮件本质上是一种不安全的通信形式。


    建议任何计划实现 Sendmail 服务器的人关注以下问题。


    ### 2.2.7.1. 限制拒绝服务攻击


    由于电子邮件的特性，检测到的攻击者可以轻易向服务器填充邮件并导致拒绝服务。通过为 /etc/sendmail.mc 中的指令设置限制，可以限制此类攻击的有效性。


    - **CONNECTION_RATE_THROTTLE** — 服务器每秒接收的连接数。默认情况下，Sendmail 不限制连接数。如果设置了限制并达到，后续连接将被拒绝。


    - **MAX_DAEMON_CHILDREN** — 服务器可以创建的最大进程数量。默认情况下，Sendmail 不限制子进程数量。如果设置了限制并达到，后续连接将被拒绝。


    - **MIN_FREE_BLOCKS** — 服务器接收邮件必须可用的最小空块数。默认为 100 块。


    - **MAX_HEADERS_LENGTH** — 消息头的最大接受大小（字节）。


    - **MAX_MESSAGE_SIZE** — 单条消息的最大接受大小（字节）。


    ### 2.2.7.2. NFS 和 Sendmail


    永远不要将邮件池目录 `/var/spool/mail/` 放在 NFS 共享卷上。


    NFSv2 和 NFSv3 不对用户和组 ID 保持控制，或者多个用户具有相同的 UID，从而接收并读取彼此的邮件。


    > 注意：使用 Kerberos 的 NFSv4 并非如此，因为 SECRPC_GSS 内核模块不利用基于 UID 的身份验证。然而，将邮件池目录放在 NFS
    共享卷上仍被认为是良好的做法。


    ### 2.2.7.3. 仅邮件用户


    为了防止 Sendmail 服务器上的本地用户漏洞，最好让邮件用户仅使用电子邮件程序访问 Sendmail 服务器。不应允许邮件服务器上开启 Shell 账户，并且
    /etc/passwd 文件中的所有用户 shell 都应设置为 `/sbin/nologin`（root 用户可能除外）。


    ## 2.2.8. 验证哪些端口正在监听


    配置网络服务后，注意系统网络接口上实际上哪些端口正在监听很重要。任何开放的端口都可能是入侵的证据。


    列出网络监听端口有两种基本方法。较不可靠的方法是使用 `netstat -an` 或 `lssof -i` 等命令查询网络栈。这种方法不太可靠，因为这些程序并不是从网络连接到机器，而是检查系统上运行了什么。出于这个原因，这些应用程序是攻击者频繁替换的目标。如果黑客未经授权开启了网络端口，他们尝试通过用自己的修改版本替换
    `netstat` 和 `lssof` 来掩盖踪迹。


    检查网络哪些端口正在监听更可靠的方法是使用 `nmap` 等端口扫描器。


    从控制台执行以下命令可以确定哪些端口正在监听来自网络的 TCP 连接：


    ```

    nmap -sT -0 localhost

    ```


    ```

    此 Nmap 4.68 ( http://nmap.org ) 在 2009-03-06 12:00 EST 的输出

    localhost.localdomain (127.0.0.1) 上的有趣端口

    未显示: 1711 closed ports

    PORT STATE SERVICE

    22/tcp open ssh

    25/tcp open smtp

    111/tcp open auth

    113/tcp open open

    631/tcp open ipp

    834/tcp open unknown

    2601/tcp open zebra

    32774/tcp open times-rpc11

    Device type: general purpose

    ```


    '
