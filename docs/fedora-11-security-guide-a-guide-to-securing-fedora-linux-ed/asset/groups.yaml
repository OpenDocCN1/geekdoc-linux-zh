    rpm -K /tmp/updates/*.rpm

    ```


    对于每个包，如果 GPG 密钥验证成功，命令将返回 `gpg OK`。如果验证失败，请确保你正在使用正确的 Fedora 公钥，这也是为了验证内容的来源。未通过
    GPG 验证的包不应安装，因为其来源可能已被第三方修改。


    在验证 GPG 密钥并下载与错误报告（errata）相关的所有包后，请在 shell 提示符下 root 身份安装这些包。


    ## 1.5.3 安装签名包


    大多数包的安装可以通过执行以下命令安全完成（内核包除外）：


    ```

    rpm -Uvh /tmp/updates/*.rpm

    ```


    内核包，请使用以下命令：


    ```

    rpm -ivh /tmp/updates/<kernel-package>

    ```


    将上一个示例中的 `<kernel-package>` 替换为内核 RPM 的名称。


    一旦机器使用新内核安全地重启，可以使用以下命令删除旧内核：


    ```

    rpm -e <old-kernel-package>

    ```


    将上一个示例中的 `<old-kernel-package>` 替换为旧版本内核 RPM 的名称。


    > 注意

    > 移除旧内核是一项要求。默认的启动加载程序 GRUB 允许安装多个内核，并在启动时从菜单中进行选择。


    > 重要

    > 在安装任何安全错误修复之前，请务必阅读错误报告中包含的任何特殊说明并仔细执行。有关应用由错误修复更新所做出的更改的通用说明，请参阅第 1.5.4 节“应用更改”。


    ## 1.5.4 应用更改


    在下载并安装安全错误修复和更新后，停止使用旧软件并开始使用新软件非常重要。具体如何操作取决于已更新的软件类型。以下列表列出了软件的大类类别，并提供了包升级后使用更新版本的说明。


    > 注意

    > 通常情况下，重启系统是确保使用软件软件包最新版本的最安全方法；然而，此选项并非总是必须的，系统管理员也并不总是拥有该权限。


    ### 应用程序

    用户空间应用程序是任何由系统用户启动的程序。通常，此类应用程序仅在用户、脚本或自动化任务启动它们时才使用，并且不会持续很长时间。


    一旦此类用户空间应用程序完成更新，请停止系统上的任何应用程序实例并重新启动程序以使用更新后的版本。


    ### 内核

    内核是 Fedora 操作系统的核心软件组件。它管理对内存、处理器和外围设备的访问，并调度所有任务。


    由于其核心作用，内核无法在不停止计算机的情况下重启。因此，在系统重启之前，无法使用更新后的内核版本。


    ### 共享库

    共享库是代码单元（例如 glibc），被多个应用程序和服务使用。利用共享库的应用程序通常在应用程序初始化时加载共享代码，因此任何使用更新后库的应用程序都必须停止并重新启动。


    要确定哪些运行中的应用程序链接到特定库，请使用以下示例中的 `lsof` 命令：


    ```

    lsof /lib/libwrap.so*

    ```


    此命令返回所有使用 TCP wrappers 进行宿主机访问控制的运行程序列表。因此，如果更新了 `tcp_wrappers` 包，必须停止并重新启动任何程序列表。


    ### SysV 服务

    SysV 服务是在启动过程中启动的持久性服务器程序。SysV 服务的示例包括 sshd、vsftpd 和 xinetd。

    由于这些程序通常只要机器启动就会持续运行，因此在包升级后，每个更新的 SysV 服务都必须停止并重新启动。这可以使用“服务配置工具”或通过登录 shell
    提示符并按如下例执行 `/sbin/service` 命令来实现：


    ```

    /sbin/service <service-name> restart

    ```


    在上一个示例中，将 `<service-name>` 替换为服务的名称，例如 sshd。


    ### xinetd 服务

    由 xinetd 超级服务控制的服务仅在存在活动连接时运行。由 xinetd 控制的服务示例包括 Telnet、IMAP 和 POP3。


    由于 xinetd 每次接收到请求时都会启动这些服务的新实例，因此升级后发生的连接将由更新后的软件处理。然而，如果在升级受 xinetd 控制的服务时存在活动连接，这些连接将继续由旧版本的软件提供服务。


    要杀掉特定 xinetd 控制的服务实例，请先升级该服务的包，然后停止当前运行的进程。要确定进程正在运行，请使用 `ps` 命令并使用 `kill` 或 `killall`
    命令停止服务的当前实例。


    例如，如果发布了安全错误修复 imap 包，请升级包，然后在 shell 提示符中作为 root 用户输入以下命令：


    ```

    ps -aux | grep imap

    ```


    此命令返回所有活跃的 IMAP 会话。可以通过执行以下命令终止单个会话：


    ```

    kill <PID>

    ```


    如果未能终止会话，请改用以下命令：


    ```

    kill -9 <PID>

    ```


    在上几个示例中，将 `<PID>` 替换为进程标识符（在 `ps` 的第二列中找到），用于 IMAP 会话。


    要杀死所有 IMAP 会话，执行以下命令：


    ```

    killall imapd

    ```


    ## 网络安全


    ### 2.1. 工作站安全

    网络安全始于工作站。无论是锁定个人机器还是保护企业系统，良好的安全策略始于单台计算机。计算机网络的安全性取决于最弱的节点。


    ### 2.1.1. 评估工作站安全

    在评估工作站安全性时，请考虑以下因素：


    - BIOS 和启动加载器安全：用户是否可以物理访问机器并在无密码进入单用户模式？

    - 密码安全：机器上的账户安全性如何？

    - 管理控制：谁拥有系统账户？他们拥有多少管理权限？

    - 可用网络服务：哪些服务正在监听请求？哪些服务应该运行？

    - 个人防火墙：是否需要防火墙？

    - 安全增强通信工具：工作站之间应该使用哪些工具，哪些工具应该避免？


    '
