    Also, DISA has made available UNIX SPR scripts⁸ that allow administrators to check
    specific settings on systems. These scripts provide XML-formatted reports listing
    any known vulnerable settings.


    ## Secure Installation


    Security begins with the first time you put CD or DVD into your disk drive to
    install Fedora. Configuring your system from the beginning makes it easier to
    implement additional security settings.


    ## 5.1. Disk Partitions


    The NSA recommends keeping separate partitions for /boot, /home, /tmp, /var, and
    /var/tmp. The reasons for each are different and we will address each partition.


    - /boot - This is the first partition that is read by the system during boot up.
    The boot loader and kernel images that are used to boot your system into Fedora
    are stored in this partition. This partition should not be encrypted. If this
    partition is included in / and that partition is encrypted or otherwise becomes
    unavailable then your system will not be able to boot.


    - /home - When user data is stored in / instead of a separate partition, the partition
    can fail causing the operating system to become unstable. Also, when upgrading
    your system to the next version of Fedora is a lot easier when you keep your data
    in the /home partition as it will not be overwritten during installation. If the
    root partition (/) becomes corrupt your data could be lost forever. By using a
    separate partition there is much more protection against data loss. You can also
    target this partition for frequent backups.


    - /tmp and /var - Both the /tmp and the /var/tmp directories are used to store
    data that doesn''t need to be stored for a long period of time. However if a lot
    of data floods one of these it can consume all of your storage space. If this
    happens these directories are stored within / then your system could become unstable
    and crash. For this reason, moving these directories into their own partitions
    is a good idea.


    ## 5.2. Utilize LUKS Partition Encryption


    Since Fedora 9, implementation of Linux Unified Key Setup-on-disk-format (LUKS)
    encryption has become a lot easier. During the installation process an option
    to encrypt your partitions will be presented to the user. The user must supply
    a passphrase that will be the key to unlock the bulk encryption key that will
    be used to secure the partition''s data.


    Fedora 8, however, does not have LUKS support built-in; however it is easily implemented.
    Step-by-step procedures are available that allow the user to implement partition
    encryption on their Fedora 8 installation.


    > 5 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption

    > 2 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption#Step-by-Step_Instructions


    ## Software Maintenance


    Software maintenance is extremely important to maintaining a secure system. It
    is vital to patch software as soon as it becomes available in order to prevent
    attackers from using known holes to infiltrate your system.


    ## 6.1. Install Minimal Software


    It is best practice to install only the packages you use because each piece of
    software on your computer could possibly contain a vulnerability. If you are installing
    from the DVD media take the opportunity to select exactly what packages you want
    to install during the installation. When you need another package, you can always
    add it to the system layer.


    ## 6.2. Plan and Configure Security Updates


    All software contains bugs. these bugs can result in a vulnerability that can
    expose your system to malicious users. Unpatched systems are a common cause of
    computer intrusions. You should have a plan to install security patches in a timely
    manner to close those vulnerabilities so they cannot be exploited.


    For home users, security updates should be installed as soon as possible. Configuring
    automatic installation of security updates is one way to avoid having to remember,
    but it carries a risk that something can cause a conflict with your configuration
    or with other software on the system.


    For business or advanced users, security updates should be tested and schedule
    for installation. Additional controls will be needed to protect the system during
    the time between the patch release and its installation on the system. These controls
    would depend on the exact vulnerability, but could include additional firewall
    rules, the use of external firewalls, or changes in software settings.


    ## 6.3. Adjusting Automatic Updates


    Fedora is configured to apply all updates on a daily schedule. If you want to
    change how the system installs updates you must do so "Software Update Preferences".
    You can change the schedule, the type of updates to apply or notify you of available
    updates.


    In Gnome, you can find controls for updates at: System -> Preferences -> System
    Software Updates. In KDE it is located at: Applications -> Settings -> Software
    Updates.


    ## 6.4. Install Signed Packages from Well Known Repositories


    Software packages are published through repositories. All well known repositories
    use public key technology to prove that the package was published by the repository.
    Signing ensures that the repository has not changed since the signature was applied.
    This provides protection against installing software that may have been maliciously
    altered after the package was created before you downloaded it.


    Using many repositories, untrustworthy repositories, or repositories with unsigned
    packages has a higher risk of introducing malicious or vulnerable code into your
    system. Use caution when adding repositories to yum/software update.


