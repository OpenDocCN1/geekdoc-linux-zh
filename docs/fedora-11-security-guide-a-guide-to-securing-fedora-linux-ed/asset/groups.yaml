    # 2.5.1. Advantages of TCP Wrappers


    TCP Wrappers provide the following advantages over other network service techniques:
    Both the client and the wrapped network service are unaware that TCP Wrappers
    are in use. Legitimate users are logged and connected to the requested service
    while connections from banned clients fail.


    +   - Centralized management of multiple protocols — TCP Wrappers operate separately
    from the network services they protect, allowing many servers to share a common
    set of access control files, for simpler management.


    # 2.5.2. TCP Wrappers Configuration Files


    To determine if a client is allowed to connect to a service, TCP Wrappers reference
    the two files, which are commonly referred to as hosts access:


    +   - /etc/hosts.allow

    - /etc/hosts.deny


    When a TCP-wrapped service receives a client request, it performs the following
    steps:


    +   1. It references /etc/hosts.allow — The TCP-wrapped service sequentially parses
    the /etc/hosts.allow file and applies the first rule specified for that service.
    If it finds a matching rule, it allows the connection. If not, it moves to the
    next step.

    2. It references /etc/hosts.deny. The TCP-wrapped service sequentially parses
    the /etc/hosts.deny file. If it finds a matching rule, it denies the connection.
    If not, it grants access to the service.


