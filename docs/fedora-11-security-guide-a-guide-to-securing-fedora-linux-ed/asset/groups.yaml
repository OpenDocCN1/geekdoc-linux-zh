    # Chapter 1. Security Overview


    Because of the increased reliance on powerful, networked computers to help run
    businesses and keep track of our personal information, entire industries have
    been formed around the practice of network and computer security. Enterprises
    have solicited the knowledge and skills of security experts to properly audit
    systems and tailor solutions to fit the operating requirements of the organization.
    Because most organizations are increasingly dynamic in nature, with workers accessing
    IT resources locally and remotely, the need for securing computing environments
    has become more pronounced.


    Unfortunately, most organizations (as well as individual users) regard security
    as an afterthought, a process that is overlooked in favor of increased power,
    productivity, and budgetary concerns. Proper security implementation is often
    enacted postmortem — after an unauthorized intrusion has occurred. Security experts
    agree that taking the correct measures prior to connecting a site to an untrusted
    network, such as the Internet, is an effective means of thwarting attempts at
    attrition.


    ## 1.1. Introduction to Security


    ### 1.1.1. What is Computer Security?


    Computer security is a general term that covers a wide area of computing and information
    processing. Industries that depend on computer systems and networks to conduct
    daily business transactions and access crucial information regarding their data
    as an important part of their overall assets. Several terms and metrics have entered
    our daily vocabulary, such as total cost of ownership (TCO) and high-availability
    as part of their planning and process management costs. In some industries, quality
    of service (QoS). In industries, such as electronic commerce, the availability
    and trustworthiness of data can be the difference between success and failure.


    ### 1.1.1. How did Computer Security Come about?


    Information security has evolved over the years due to the increasing reliance
    on public networks to disclose personal, financial, and other restricted information.
    There are numerous instances such as the Mitnick’ and the ‘Vladimir Levin’ cases
    that prompted organizations across all industries to rethink the way they handle
    information, as well as its transmission and disclosure. The popularity of the
    Internet was one of the most important developments that prompted an intensified
    effort in data security.


    An ever-growing number of people are using their personal computers to gain access
    to the resources that the Internet has to offer. Research and information technology
    to electronic mail and commerce transaction, that the Internet has been regarded
    as one of the most important developments of the 20th century.


    The Internet and its protocols, were developed as a trust-based system. That is,
    the Protocol was not designed to be secure. There are no approved security standards
    built into the TCP/IP communications stack, leaving open to potentially malicious
    users and processes across the network. Modern developments have made Internet
    communication secure, but there are still several incidents that gain national
    attention and alert us to the fact that nothing is completely safe.


    > http://law.jrank.org/pages/3791/Kevin-Mitnick-Case-1999.html

    > http://www.livinginternet.com/ila/hackers_levin.html


    # Chapter 1. Security Overview


    ### 1.1.1.2. Security Today


    In February of 2000, a Distributed Denial of Service (DDoS) attack was unleashed
    on several of the most-trafficked sites on the Internet. The attack rendered yahoo.com,
    cnn.com, amazon.com, fbi.gov, several other sites completely unreachable to normal
    users, as it tied up routers for several hours with large heavy ICMP packets,
    also called a ping flood. The attack was born by hackers and assistants using
    specially created, widely available programs that scanned vulnerable network servers,
    then initiated an attack on every infected server flooding the victim sites and
    rendering them unavailable. Many blame the attack on fundamental flaws in the
    way routers and the protocols are structured to accept all incoming data, no matter
    where or for what purpose the packets are sent.


    In 2007, a data breach exploiting the widely-known weaknesses of the Wired Equivalent
    Privacy (WEP) wireless encryption protocol resulted in the theft from a global
    financial institution of over 45 million credit card numbers.


    In a separate incident, the billing records of over 2.2 million patients stored
    on a backup tape were stolen from the front seat of a courier''s car.


    Currently, an estimated 1 billion people use the Internet. There are approximately
    225 incidents of security breach reported to the CERT each day.


    - On any day, the number of CERT reported incidents to the CERT Coordination Center
    at Carnegie Mellon University.

    - In 2003, the number of CERT reported incidents jumped to 137,529 from 82,094
    in 2002 and from 52,658 in 2001.

    - The economic impact of the three most dangerous Internet Viruses of the last
    three years was estimated at US$13.2 Billion.


    From a 2008 global survey of business and technology executives "The Global State
    of Information Security" by CIO Magazine, some points are:


    - Just 43% of respondents audit or monitor user compliance with security policies

    - Only 22% keep an inventory of the outside companies that use their data

    - The source of nearly half of security incidents was marked as "Unknown"

    - 44% of respondents plan to increase security spending in the next year


    These results enforce the reality that security has become a quantifiable and
    justifiable expense for IT budgets. Organizations that require data integrity
    and high availability elicit the skills of system administrators, developers,
    and engineers to ensure 24x7 reliability of their systems, services, and information.
    Falling victim to malicious viruses, processes, or coordinated attacks is a direct
    threat to the success of the organization.


    Unfortunately, system and network security can be a difficult proposition, requiring
    an intricate knowledge of how an organization regards, uses, manipulates, and
    transmits its information.


    > http://www.thegister.org.uk/2007/05/atji_nonfeasance/

    > http://www.healthcarenews.com/story.cms?id=9408

    > http://www.internetworldstats.com/stats.hm

    > http://www.csoonline.com/article/45439/The_Global_State_of_Information_Security_


    Understanding the way an organization (and the people that make up the organization)
    conducts business is paramount to implementing a proper security plan.


    ### 1.1.1.3. Standardizing Security


    In every industry rely on regulations and rules that are set by standards-making
    bodies such as the American Medical Association (AMA) or the Institute of Electrical
    and Electronics Engineers (IEEE). Many ideals hold true for information security.
    Many security consultants and vendors agree upon the standard security model known
    as CIA, or Confidentiality, Integrity, and Availability. This three-tiered model
    is generally accepted component to assessing risks of sensitive information and
    establishing security policy. The following describes the CIA model in further
    detail:


    - Confidentiality — Sensitive information must be available only to a set of pre-defined
    individuals. Unauthorized transmission and use of information should be restricted.
    For example, confidentiality of information ensures that a customer''s personal
    or financial information is not obtained by an unauthorized individual for malicious
    purposes as identity theft or credit fraud.


    - Integrity — Information should not be altered in ways that render it incomplete
    or incorrect. Unauthorized users should be restricted from the ability to modify
    or destroy sensitive information.


    - Availability — Information should be accessible to authorized users that it
    is needed. Availability is a warranty that information can be obtained with an
    agreed-upon frequency and timeliness. This is often measured in terms of percentages
    and agreed to formally in Service Level Agreements (SLAs) used by network providers
    and their enterprise clients.


    ## 1.1.2. SELinux


    Fedora includes an enhancement to the Linux kernel called SELinux, which implements
    a Mandatory Access Control (MAC) architecture that provides a fine-grained level
    of control over files, processes, users and applications in the system. Detailed
    description of SELinux is beyond the scope of this document; however, for more
    information on SELinux and its use in Fedora, refer to the SELinux User Guide
    available at http://docs.fedoraproject.org/selinux-user-guide/. Other available
    resources for SELinux are located in Chapter 7, References.


    ### 1.1.1.3. Security Controls


    Computer security is often divided into three distinct master categories, commonly
    referred to as controls:


    - Physical


    - Technical


    - Administrative


    These three categories define the main objectives of proper security implementation.
    These controls are sub-categories that further detail the controls and how to
    implement them.


    ### 1.1.3.1. Physical Controls


    Physical control is the implementation of security measures in a defined structure
    to deter or prevent unauthorized access to sensitive material. Examples of physical
    controls are:


    - Closed-circuit surveillance cameras

