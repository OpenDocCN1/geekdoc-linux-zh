    \n## 2.9.3.5. 目标选项\n\n当数据包匹配了特定规则时，规则可以将数据包定向到多个不同的目标，从而决定适当的操作。每个链都有一个默认目标，如果该链上没有规则匹配数据包，或者没有规则匹配指定的目标，则使用该默认目标。\n\
    \n以下是标准目标：\n\n- user-defined-chain — 表中的用户自定义链。用户自定义链的名称必须唯一。此目标将数据包传递到指定的链。\n\
