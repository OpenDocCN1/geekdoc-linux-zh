    ## 1.5. 安全更新


    随着安全漏洞的发现，必须更新受影响的软件以限制潜在的安全风险。如果软件是当前支持的 Fedora 发行版中包的一部分，Fedora 承诺尽可能发布修复该漏洞的更新包。通常，关于特定安全漏洞的公告会附带补丁（或源代码）。该补丁随后应用于
    Fedora 包并作为错误更新发布。然而，如果公告未包含补丁，开发者首先与维护人员合作解决问题。一旦针对系统软件发布了错误更新，建议尽快更新受影响的软件包，以减少系统可能受影响的时间。


    ## 1.5.1. 更新软件包


    在更新系统软件时，从可靠源下载更新非常重要。攻击者可以重新构建一个与修复程序版本号相同的包，但包含不同的安全漏洞并发布到互联网上。如果发生这种情况，针对原始
    RPM 进行验证的安全措施将无法检测到漏洞。因此，仅从可靠源（如 Fedora）下载 RPM 并检查签名以验证其完整性非常重要。


    > 注意

    > Fedora 包含一个方便的图标，当有更新时会显示警告。


    ## 1.5.2. 验证签名包


    所有 Fedora 软件包都使用 GPG 密钥签名。GPG 代表 GNU Privacy Guard（或 GnPG），是一种用于确保分发文件真实性的免费软件包。例如，私钥（秘密）锁定包，而公钥则解锁并验证包。如果
    Fedora 分发的公钥在 RPM 验证期间不匹配，则该包可能已被更改，因此不可信。


    Fedora 内的 RPM 工具在安装 RPM 包之前会自动尝试验证 GPG 签名。如果未安装 GPG 密钥，请从安全的静态位置（例如 Fedora 安装光盘或
    DVD）导入。


    假设光盘挂载在 /mnt/cdrom，使用以下命令将其导入密钥环（系统的密钥数据库）：


    ```

    rpm --import /mnt/cdrom/RPM-GPG-KEY

    ```


    要显示所有用于 RPM 验证的密钥列表，请执行以下命令：


    ```

    rpm -qa gpg-pubkey*

    ```


    输出类似于所示：


    ```

    gpg-pubkey-db42a60e-37ea538

    ```


