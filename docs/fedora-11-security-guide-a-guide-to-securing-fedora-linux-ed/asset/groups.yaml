    ## 2.4.5. 创建 PAM 模块


    你可以随时创建或添加 PAM 模块，供感知 PAM 的应用程序使用。


    例如，开发者可能会创建一个一次性密码生成方法以及一个支持该方法的 PAM 模块。感知 PAM 的程序可以立即使用新模块和密码方法，而无需重新编译或进行其他修改。


    这允许开发者和系统管理员对不同的程序进行混合组合以及测试身份验证方法，而无需重新编译它们。


    关于编写模块的文档包含 `/usr/share/doc/pam-<version-number>/` 目录下，其中 `<version-number>` 是你系统中
    PAM 的版本号。


    ## 2.4.6. PAM 与管理凭据缓存


    Fedora 中的许多图形化管理工具为用户提供长达五分钟的提升权限。理解此机制的工作原理非常重要，因为在 `pam_timestamp.so` 生效时离开终端的用户将把机器暴露给任何具有物理访问控制台的人。


    在 PAM 时间戳方案中，图形化管理应用程序在启动时提示用户输入 root 密码。当用户通过验证后，`pam_timestamp.so` 会创建一个时间戳文件。默认情况下，它创建在
    `/var/run/sudo/` 目录下。如果时间戳文件已存在，图形化管理程序不会提示密码。相反，`pam_timestamp.so` 会刷新时间戳文件，为用户保留五分钟不受受挑战的管理访问。


    你可以通过检查 `/var/run/sudo/<user>` 文件来验证时间戳文件的实际状态。对于桌面，相关文件是 `root`。如果它存在且时间戳小于五分钟，则凭据是有效的。时间戳文件的存在通过出现在面板区域的身份验证图标来指示。


    ### 2.4.6.1. 删除时间戳文件


    在 PAM 时间戳激活时离开控制台之前，建议销毁时间戳文件。要在图形化环境中执行此操作，点击面板上的身份验证图标。这将弹对话框。点击“Authorization”（授权）以销毁。


    你目前有权在不输入密码的情况下配置系统级设置（影响所有用户）。你可以放弃。


    关于时间戳文件，你应该注意以下点：


    - 如果使用 `ssh` 远程登录系统，请使用 `/sbin/pam_timestamp -k root` 来销毁时间戳文件。


    - 你需要从启动特权应用程序的同一个终端运行 `/sbin/pam_timestamp -k` 命令。


    - 你必须以调用 `pam_timestamp.so` 模块的用户身份登录才能使用 `/sbin/pam_timestamp -k` 命令。不要以 root
    身份登录以使用此命令。


    - 如果你想杀死桌面上的凭据（不使用“Authorization”操作），请使用以下命令：

    `/sbin/pam_timestamp -k root`


    未使用此命令将只会从你运行命令的 pty 中移除凭据（如果有的话）。有关销毁时间戳文件的更多信息，请参考 `pam_timestamp` 页面。


    ### 2.4.6.2. 常用 PAM 时间戳指令


    `pam_timestamp.so` 模块接受多个指令。以下是最常用的两个：


    - `timestamp_timeout` — 指定时间戳文件有效的期限（秒）。默认值为 300（五分钟）。


    - `timestampdir` — 指定存储时间戳文件的目录。默认值是 `/var/run/sudo`。


    有关控制 `pam_timestamp.so` 模块的更多信息，请参阅第 2.8.9.1 节“安装文档”。


    ## 2.4.7. PAM 与设备所有权


    在 Fedora 中，第一个登录机器物理控制台的用户可以像 root 用户一样正常操作设备并执行任务。这由一个名为 `pam_console.so` 的 PAM
    模块控制。


    ### 2.4.7.1. 设备所有权


    当用户登录 Fedora 系统时，登录或图形化登录程序、`gdm` 和 `xdm` 会调用 `pam_console.so`。如果这是第一个登录物理控制台（称为控制台）的用户，该模块将授予用户通常由
    root 拥有的各种设备的所有权。控制台用户拥有这些设备直到该用户的最后一个会话结束。用户注销后，设备所有权将恢复给 root 用户。


    受影响的设备包括限于声卡、磁盘设备和 CD-ROM 设备，简化了控制台用户的任务。


    你可以通过编辑以下文件找到由 `pam_console.so` 控制的设备列表：


    - `/etc/security/console.perms`


    - `/etc/security/console.perms-50-default`


    你可以更改列出的不同设备的权限，或者覆盖默认值。与其修改 `50-default.perms` 文件，不如创建一个新文件（例如 `xx-name.perms`）并输入所需的修改。新默认文件名必须以大于
    50 的数字开头（例如 `51-default.perms`）。这将覆盖 `50-default.perms` 文件。


    > 警告 如果 `gdm`、`kdm`、`xdm` 显示管理器配置文件已更改允许用户登录且配置为在5级运行，建议将 `/etc/security/console.perms`
    中的指令更改为以下值：

    ```

    <console>=tty[0-9]* vc/[0-9]* :0\.[0-9]* :0\.[0-9] :0

    <console>=. :0

    ```

    这将防止远程用户访问机器上的设备和受限应用程序。


    如果 `gdm`、`kdm` 和 `xdm` 显示管理器配置文件已更改允许远程用户登录，且主机配置为在5级以外的多个用户级别，建议完全删除`<console>`
    指令并将指令更改为以下值：

    ```

    <console>=tty[0-9][0-9] vnc/[0-9][0-9]*

    ```


    ### 2.4.7.2. 访问


    控制台用户还可以访问位于 `/etc/security/console.apps/` 目录下的某些程序。


    该目录包含配置文件，允许控制台用户运行 `/sbin` 和 `/usr/sbin` 中的应用程序。


    这些配置文件名与其设置的应用程序相同。


    控制台用户访问的一组特殊的应用程序是三个关机或重启系统的程序：


    - /sbin/halt

    - /sbin/reboot

    - /sbin/poweroff


