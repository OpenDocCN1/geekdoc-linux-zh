    now use readers compliant with Chip/Smart Card Interfaces (CCID).


    # ### 2.3.1.4. Advantages of Fedora Sign-on


    Numerous security mechanisms currently exist that utilize a large number of protocols
    and credential stores. Examples include SSL, SSH, IPCC, and Kerberos. Fedora SSO
    aims to unify these stores to support the requirements listed above. This does
    not mean replacing Kerberos with X.509v3 certificates, but rather them to reduce
    the burden on both system users and the administrators who manage them.


    To achieve this Fedora:


    +   * Provides a single, shared instance of the NSS crypto libraries on each operating
    system.

    * Ships the Certificate System''s Enterprise Security Client (ESC) with the base
    operating system. The ESC monitors smart card insertion events. If it detects
    that the user has inserted a smart card that was designed to be used with the
    Fedora Certificate System product, it displays a user interface instructing the
    user how to enroll that smart card.'
- md: "\n## Chapter 2. Securing Your Network\n\n- Unifies Kerberos and NSS so users\
    \ who log in to the operating system using a smart card also obtain a Kerberos\
    \ credential (which allows them to log in to file servers, etc.)\n\n### 2.3.2.\
    \ Getting Started with your new Smart Card\n\nBefore you use your smart card to\
    \ log in to your system and take advantage of the increased security options this\
    \ technology provides, you need to perform some basic installation and configuration\
    \ steps. These are described below.\n\n> Note This section provides a high-level\
    \ view of getting started with your smart card. More detailed information is available\
    \ in the Red Hat Certificate System Enterprise Client Guide.\n\n1. Log in with\
    \ your Kerberos name and password\n2. Make sure you have the nss-tools package\
    \ loaded.\n3. Download and install your corporate-specific root certificates.\
    \ Use the following command to install the root CA:\n\n```\ncertutil -A -d /etc/pki/nssdb\
    \ -n \"root ca cert\" -t \"CT,C,C\" -i /.ca_cert_in_base64_format.crt\n```\n\n\
    4. Verify that you have the following RPMs installed on your system: esc, pam_pkcs11,\
    \ coolikey, ifd-edge, cid, gdm, and authconfig-gtk.\n5. Enable Smart Card Login\
    \ Support\n   a. On the Gnome Title Bar, Select->Administration->Authentication.\n\
    \   b. Type your machine's password if necessary.\n   c. In the Authentication\
    \ Configuration dialog, click the Authentication table.\n   d. Select the Configure\
    \ Smart Card..., button to display the Smartcard Settings dialog, and specify\
    \ the required settings:\n     - Require smart card for login — Clear this box.\
    \ After you have successfully logged in with your smart card you can select this\
    \ option to prevent users from logging without a smart card.\n      - Card Removal\
    \ — This controls what happens when you remove the smart card after you have logged\
    \ in. The available options are:\n        - Lock — Removing the smart card locks\
    \ the X screen.\n        - Ignore — Removing the smart card has no effect.\n\n\
    6. If you need to enable the Online Certificate Status Protocol (OCSP), open the\
    \ /etc/pam_pkcs11/pam_pkcs11.conf file, and locate the following line:\n\n```\n\
    enable_ocsp = false;\n```\n\nChange this value to true, as:\n\n```\nenable_ocsp\
    \ = true;\n```\n\n7. Enroll your smart card\n\n8. If you are using a CAC card,\
    \ you also need to perform the following steps:\n\n   a. Change to the root account\
    \ and create a file called /etc/pam_pkcs11/cn_map.\n\n```\nMY_CAC_CN.123454 ->\
    \ myyloginid\n```\n\nwhere MY_CAC_CN.123454 is the Common Name on your CAC and\
    \ myyloginid is your UNIX login id.\n\n9. Logout\n\n### 2.3.2.1. Troubleshooting\n\
    \nIf you have trouble getting your smart card to work, try using the following\
    \ command to locate the source of the problem:\n\n```\npklogin_finder debug\n\
    ```\n\nIf you run the pklogin_finder tool in debug mode while an enrolled smart\
    \ card is plugged in, it attempts to output information about the validity of\
    \ certificates, and if it is successful in attempting to map a login ID from the\
    \ certificates that are on the card.\n\n### 2.3.3. How Smart Card Enrollment Works\n\
    \nSmart cards are said to be enrolled when they have received an appropriate certificate\
    \ signed by a valid Certificate Authority (CA). This involves several steps, described\
    \ below:\n\n1. The user inserts their smart card into the smart reader on their\
    \ workstation. This event is recognized by the Enterprise Security Client (ESC).\n\
    \n2. The enrollment page is displayed on the user's desktop. The user completes\
    \ the required details and the user's system connects to the Token Processing\
    \ System (TPS) and the CA.\n\n3. The TPS enrolls the smart card using a certificate\
    \ signed by the CA.\n\n### 2.3.4. How Smart Card Login Works\n\nThis section provides\
    \ a brief overview of the process of logging in using a smart card.\n\nFigure\
    \ 2.4. How Smart Card Enrollment Works\n\n1. When the user inserts their smart\
    \ card into the smart card reader, this event is recognized by the PAM facility,\
    \ which prompts for the user's PIN.\n\n2. The system then looks up the user's\
    \ current certificates and verifies their validity. The certificate is then mapped\
    \ to the user's UID.\n\n3. This is validated against the KDC and login granted.\n\
    \n### How does Smart Card login work?\n\nFigure 2.5. How Smart Card Login Works\n\
    \n> Note You cannot log in with a card that has not been enrolled, even if it\
    \ has been formatted.\nYou need to log in with a formatted, enrolled card, or\
    \ not using a smart card, before you can enroll a new card.\n\nRefer to Section\
    \ 2.6, 'Kerberos' and Section 2.4, 'Pluggable Authentication Modules (PAM)' for\
    \ more information on Kerberos and PAM.\n\n### 2.3.5. Configuring Firefox to use\
    \ Kerberos for SSO\n\nYou can configure Firefox to use Kerberos for Single Sign-on.\
    \ In order for this functionality to work correctly, you need to configure your\
    \ web browser to send your Kerberos credentials to the appropriate KDC. The following\
    \ section describes the configuration changes and other requirements to achieve\
    \ this.\n\n- In the address bar of Firefox, type `about:config` to display the\
    \ list of current configuration options.\n- In the **Filter** field, type `negotiate`\
    \ to restrict the list of options.\n- Double-click the `network.negotiate-auth.trusted-uris`\
    \ entry to display the *Enter string value* dialog box.\n\n4. Enter the name of\
    \ the domain against which you want to authenticate, for example, example.com.\n\
    \n5. Repeat the procedure for the network.negotiate-auth.delegation-uris entry,\
    \ using the same domain.\n\n> Note You can leave this value blank, as it allows\
    \ Kerberos ticket passing, which is not required.\n\nIf you do not see these two\
    \ configuration options listed, your version of Firefox may be too old to support\
    \ Negotiate authentication, and you should consider upgrading.\n\nFigure 2.6.\
    \ Configuring Firefox for SSO with Kerberos\n\nYou now need to ensure that your\
    \ Kerberos tickets are in. In a command shell, type kinit to retrieve Kerberos\
    \ tickets. To display the list of available tickets, type klist. The following\
    \ shows an output from these commands:\n\n```\n[user ~] $ kinit\nPassword for\
    \ user@EXAMPLE.COM:\n\n[user@host] $ klist\nTicket cache: FILE:/krb5cc_10920\n\
    Default principal: user@EXAMPLE.COM\n\nValid starting      Expires           \
    \  Service principal\n10/26/06 23:47:54  10/27/06 09:47:54 krbtgt/USER.COM@USER.COM\n\
    \               renew until 10/26/00 23:47:54\n\nKerberos 4 ticket cache: /tmp/tkt10920\n\
    klist: You have no tickets cached\n```\n\n### 2.3.5.1. Troubleshooting\n\nIf you\
    \ have followed the configuration steps above and Negotiate authentication is\
    \ not working, you can turn on verbose logging. This could help you find the cause\
    \ of the problem. Please enable verbose logging, use the following procedure:\n\
    \n1. Close all instances of Firefox.\n\n2. Open a command shell, and enter the\
    \ following commands:\n\n```\nexport NSRPL_LOG_MODULES=negotiate:5\nexport NSRPL_LOG_FILE=/tmp/moz.log\n\
    ```\n\n3. Restart Firefox from shell, and see why you were unable to authenticate\
    \ earlier. Information will be logged to /tmp/moz.log, and may give a clue to\
    \ the problem. For example:\n\n```\n-1208859444[900380]: entering negotiateauth::NextToken()\n\
    -1208859444[900380]: gss_init_context() failed: Miscellaneous failure\nNo credentials\
    \ cache found\n```\n\nThis indicates that you do not have Kerberos tokens, and\
    \ to run knit.\n\nIf you are able to run knit successfully from your machine but\
    \ you are unable to authenticate, you might see something like this in the log\
    \ file:\n\n```\n-1208994096[8d63d8]: entering negotiateSSAPI::GetNextToken()\n\
    -1208994096[8d63d8]: gss_init_context() failed: Miscellaneous failure\nServer\
    \ not found in Kerberos database\n```\n\nThis generally indicates a Kerberos configuration\
    \ problem. Make sure that you have the correct entries in the [domain] section\
    \ of the /etc/krb5.conf file. For example:\n\n```\n.example.com = EXAMPLE.COM\n\
    example.com = EXAMPLE.COM\n```\n\nIf nothing appears in the log it is possible\
    \ that you are using a proxy, and proxy is stripping off the HTTP headers when\
    \ you try to connect to the server using HTTPS, which allows the request to pass\
    \ through unmodified. Then proceed to debug using the log file, as described above.\n\
    \n### 2.4. Pluggable Authentication Modules (PAM)\n\nPrograms that grant users\
    \ access to a system use authentication to verify each user's identity (that is,\
    \ to establish that a user is who they say they are).\n\nHistorically, each program\
    \ had its own way of authenticating users. In Fedora, many programs are configured\
    \ to use a centralized authentication mechanism called Pluggable Authentication\
    \ Modules (PAM).\n\nPAM uses a pluggable, modular architecture, which affords\
    \ the system administrator a great deal of flexibility in setting authentication\
    \ policies for the system.\n\nIn most situations, the default PAM configuration\
    \ file for a PAM-aware application is sufficient. Sometimes, however, it is necessary\
    \ to edit a PAM configuration file. Because misconfiguration of PAM can compromise\
    \ system security, it is important to understand the structure of these files.\n"
  mdcn: "\n\n## 第 2 章 保护您的网络\n\n- 将 Kerberos 和 NSS 统一，使得使用智能卡登录操作系统的用户也能获得 Kerberos\
    \ 凭据（这允许他们登录到文件服务器等）。\n\n### 2.3.2. 开始使用您的新智能卡\n\n在您使用智能卡登录系统并利用该技术提供的增强安全选项之前，您需要执行一些基础的安装和配置步骤。下文将对这些步骤进行描述。\n\
    \n> 注意：本节提供了使用智能卡的高级概述。更详细的信息请参阅《Red Hat Certificate System Enterprise Client\
    \ Guide》。\n\n1. 使用您的 Kerberos 用户名和密码进行登录。\n2. 确保您已加载了 `nss-tools` 软件包。\n3. 下载并安装您公司特定的根证书。使用以下命令安装根\
    \ CA：\n\n```bash\ncertutil -A -d /etc/pki/nssdb -n \"root ca cert\" -t \"CT,C,C\"\
    \ -i /.ca_cert_in_base64_format.crt\n```\n\n4. 验证您的系统中是否安装了以下 RPM 包：esc、pam_pkcs11、coolikey、ifd-edge、cid、gdm\
    \ 和 authconfig-gtk。\n5. 启用智能卡登录支持\n   a. 在 Gnome 标题栏上，选择（Select）->管理（Administration）->验证（Authentication）。\n\
    \   b. 如果必要，输入您的机器密码。\n   c. 在验证配置对话框中，点击验证表格。\n   d. 选择配置智能卡（Configure Smart\
    \ Card...）按钮显示智能卡设置对话框，并指定所需的设置：\n     - 登录时需要智能卡 — 取消选此框。在您使用智能卡成功登录后，可以选择此选项，以防止用户在不使用智能卡的情况下登录。\n\
    \      - 移除卡片 — 这控制在您登录后移除智能卡时发生的情况。可用选项有：\n        - 锁定（Lock）：移除智能卡将锁定 X 屏幕。\n\
    \        - 忽略（Ignore）：移除智能卡没有影响。\n\n6. 如果您需要启用在线证书状态协议 (OCSP)，请打开 `/etc/pam_pkcs11/pam_pkcs11.conf`\
    \ 文件，并找到以下行：\n\n```\nenable_ocsp = false;\n```\n\n将此值更改为 true，如：\n\n```\nenable_ocsp\
    \ = true;\n```\n\n7. 注册您的智能卡。\n\n8. 如果您使用的是 CAC 卡，您还需要执行以下步骤：\n\n   a. 切换到根账户并创建一个名为\
    \ `/etc/pam_pkcs11/cn_map` 的文件。\n\n```\nMY_CAC_CN.123454 -> myyloginid\n```\n\n\
    其中 `MY_CAC_CN.123454` 是您的 CAC 上的通用名称（Common Name），`myyloginid` 是您的 UNIX 登录 ID。\n\
    \n9. 注销。\n\n### 2.3.2.1. 故障排除\n\n如果在让智能卡工作遇到困难，请尝试使用以下命令定位问题源：\n\n```\npklogin_finder\
    \ debug\n```\n\n如果您在插有已注册智能卡的情况下以调试模式运行 `pklogin_finder` 工具，它将尝试输出有关证书有效性的信息，并尝试成功从卡片上的证书中映射登录\
    \ ID。\n\n### 2.3.3. 智能卡注册的工作原理\n\n当智能卡接收到由有效的证书颁发机构 (CA) 签署的适当证书时，即认为智能卡已注册。这涉及以下几个步骤：\n\
    \n1. 用户将智能卡插入工作站的智能读取器中。此事件由企业安全客户端 (ESC) 识别。\n\n2. 用户桌面上将显示注册页面。用户完成所需的详情，用户系统连接到令牌处理系统\
    \ (TPS) 和 CA。\n\n3. TPS 使用由 CA 签署的证书注册智能卡。\n\n### 2.3.4. 智能卡登录的工作原理\n\n本节简要概述了使用智能卡登录的流程。\n\
    \n图 2.4 智能卡注册的工作原理\n\n1. 当用户将智能卡插入智能卡读取器时，此事件由 PAM 设施识别，随后提示用户输入 PIN 码。\n\n2.\
    \ 系统查找用户当前的证书并验证其有效性。然后将证书映射到用户的 UID。\n\n3. 结果将针对 KDC 进行验证并授予登录权限。\n\n### 智能卡登录是如何工作的？\n\
    \n图 2.5 智能卡登录的工作原理\n\n> 注意：您无法使用未注册的卡片登录，即使它已经格式化。\n您在注册新卡之前，需要使用已格式化且已注册的卡登录，或者不使用智能卡。\n\
    \n请参考第 2.6 节“Kerberos”和第 2.4 节“可插身份模块 (PAM)”获取更多关于 Kerberos 和 PAM 的信息。\n\n###\
    \ 2.3.5. 配置 Firefox 使用 Kerberos 进行单点登录\n\n您可以配置 Firefox 使用 Kerberos 进行单点登录。为了使此功能正常工作，您需要配置您的浏览器将\
    \ Kerberos 凭据发送给适当的 KDC。下节描述了实现此点的配置更改和其他要求。\n\n- 在 Firefox 地址栏中输入 `about:config`\
    \ 显示当前配置选项列表。\n- 在 **Filter**（筛选）字段中，输入 `negotiate` 以限制选项列表。\n- 双击 `network.negotiate-auth.trusted-uris`\
    \ 条目显示*输入字符串值*（Enter string value）对话框。\n\n4. 输入您想要验证的域名称。\n\n> 注意：您无法使用未注册的卡片登录，即使它已经格式化。\n\
    您需要使用已格式化且已注册的卡登录，或者不使用智能卡，然后可以注册新卡。\n\n请参考第 2.6 节“Kerberos”和第 2.4 节“可插身份模块 (PAM)”获取更多关于\
