    ## Command Options for IPTables


    > This is especially important when adding rules using the -I with an integer
    argument. If you specify an existing number when adding a rule to a chain, iptables
    adds the new rule before (or above) the existing rule.


    - -L Lists all the rules in the chain after the command. To list all rules in
    all chains in the default filter, do not specify a chain or table. Otherwise,
    the following syntax should be used to list rules in a specific chain in a particular.

    - -L <chain-name> -t <table-name>


    Additional options for the -L command option, which provide rules and allow more
    verbose rule descriptions, are described in Section 2.9.3.6, "Listing Options".


    - -N Creates a chain with a user-specified name. The chain name must be unique,
    otherwise an error message is displayed.

    - -P Sets the default for the specified chain, so when packets traverse an entire
    chain without matching a rule, they are sent to the specified target, as ACCEPT
    or DROP.

    - -R Replaces a rule in the specified chain. The rule''s number must be specified
    after the chain''s name. The first rule in a chain corresponds to number one.

    - -X Deletes a user-specified chain. You cannot delete a built-in chain.

    - -Z Sets the byte and packet counters in all chains for a table to zero.


    ## 2.9.3.3. IPTables Parameter Options


    Certain iptables commands, including those used to add, append, delete, insert,
    or replace rules within a particular chain, require various parameters to construct
    a packet filtering rule.


    - -c Resets the counters for a particular rule. This parameter accepts PKTS and
    BYTES to specify which counter to reset.

    - -d Sets the destination hostname, IP address, or network of a packet that matches
    the rule. When matching a rule, the following IP address/netmask formats are supported:

    - N.N.N.M.M — Where N.N.N is the IP address range and M.M.M is netmask.

    - N.N.N/M — Where N.N.N is the IP address range and M is the mask.

    - -f Applies this rule only to fragmented packets. You can use the exclamation
    point (!) option to add to this parameter to specify that only unfragmented packets
    are matched.


    > Note: Distinguishing between fragmented and unfragmented packets is desirable,
    despite fragmented packets being a standard part of the protocol.


    ## Securing Your Network


    Originally designed to allow IP packets to travel over networks with differing
    sizes, fragmentation is more commonly used to generate DoS attacks using malformed
    packets. It is also worth noting that IPv6 disallows fragmentation entirely.


    - -i Sets the incoming interface, such as eth0 or eth0. With iptables, this optional
    parameter may only be used with the INPUT and FORWARD chains when used with the
    filter table and PRERUTING chain with nat and mangle tables. This parameter accepts
    the same options as the incoming network interface (-i).

    - (!) Reverses the direction, meaning any specified interfaces are excluded from
    this rule.

    - (+) A wildcard character used to match all interfaces that match the specified
    string. For example, * would apply to other interfaces. If -i is used but no interface
    is specified, every interface is affected by the rule.

    - -j Jumps to the specified target when a packet matches a rule. The standard
    targets are ACCEPT, DROP, QUEUE, and RETURN. Extended options are also available
    through modules loaded by default by the iptables package. Valid tags in these
    modules include LOG, MARK, and REJECT, among others. Refer to the iptables manual
    for more information about these and other targets.

    - -o Sets the outgoing interface for a rule. This option is only valid for the
    OUTPUT and FORWARD chains. The counter for this rule increases by one.

    - -p <protocol> Sets the IP protocol affected by the rule. This can be icmp, tcp,
    udp, all, or it can be a numeric value representing a different protocol. You
    can also use any protocols listed in the /etc/protocols file. "all" protocol applies
    the rules to every protocol. If no protocol is listed with this rule, it defaults
    to “all”.

    - -s Sets the source for a particular packet using the same syntax as the destination
    (-d).


    ## 2.9.3.4. IPTables Match Options


    Different protocols provide specialized matching options which can be configured
    to match a particular packet, however the protocol must first be specified in
    the iptables command. For example, -p <protocol-name> enables options for the
    specified protocol. Note that you can also use the protocol instead of the protocol
    name. Refer to the following examples, each of which have the same effect:


    ```

    iptables -A INPUT -p icmp --icmp-type any -j ACCEPT

    ```

    ```

    iptables -A INPUT -p 583 --icmp-type any -j ACCEPT

    ```


    Service definitions are provided in the /etc/services file. For readability, it
    is recommended that you use the service names rather than the port numbers.


    > Warning

    Secure /etc/services file to prevent unauthorized editing. If this file is editable,
    crackers can use it to enable ports on your machine you have otherwise closed.
    Secure this file, type the following commands as root:


    ```bash

    [root@Server]# chown root:root /etc/services

    [root@Server]# chmod /etc/services

    [root@Server]# chattr +i /etc/services

    ```


    This prevents the file from being deleted, or having links made to it.


    ### 2.9.3.4.1. TCP Protocol


    Match options are available for the TCP protocol (-p tcp):


    - --dport Sets the destination port for the packet. To configure this option,
    use a network service name (such as www or smtp); a port number; or a range of
    port numbers. To specify a range of port numbers, separate the two numbers with
    a colon (:). For example: -p tcp --dport 3000:3200. The largest acceptable valid
    range is 0:65535. Use an exclamation character (!) after the --dport option to
    match all packets that do not use that service or port. To browse the names and
    aliases of network services and the port numbers they use, view the /etc/services
    file. The destination-port match option is synonymous with --dport.


    - --sport Sets the source port of the packet using the same options as --dport.
    The source-port match option is synonymous with --sport.


    - --syn Applies to all TCP packets designed to initiate communication, commonly
    called SYN packets. Packets that carry a data payload are untouched. Use an exclamation
    character (!) after the --syn option to match all non-SYN packets.


    - --tcp-flags <tested flag list> <set flag list> — Allows TCP packets that have
    specific bits (flags) set to match a rule. The tcp-flags match option accepts
    two parameters. The first parameter is the mask; a comma-separated list of flags
    to be examined in the packet. The second parameter is a comma-separated list of
    flags that must be set for the rule. The possible flags are:

    - ACK

    - FIN

    - PSH

    - RST

    - SYN

    - URG

    - ALL

    - NONE


    For example, an iptables rule that contains the following specification only matches
    TCP packets that have the SYN flag set and the ACK and FIN flags not set:


    ```

    --tcp-flags ACK,FIN SYN

    ```


    Use the exclamation point character (!) after --tcp-flags to reverse the effect
    of the match option.


    - --tcp-option — Attempts to match with TCP-specific options that can be set within
    a particular packet. This match option can be reversed with the exclamation point
    (!).

