    ## How Kerberos Works


    unencrypted password

    A plain text, human-readable password.


    ## 2.6.3. How Kerberos Works


    Kerberos differs from the username/password authentication methods. Instead of
    authenticating each user to check network service, Kerberos uses symmetric encryption
    and a trusted third party (KDC), to authenticate users to a suite of network services.
    When a user authenticates to the KDC, the KDC sends a ticket specific to that
    back to the user''s machine, and Kerberos-aware services look for the ticket on
    the user''s machine rather than requiring the user to authenticate using a password.


    When a user on a Kerberos-aware network logs in their workstation, the principal
    is sent to the KDC as part of a request for a TGT from the Authentication Server.
    This request can be sent by the log-in program so that it is transparent to the
    user, or be sent by the kinit program after the user logs in.


    The KDC checks for the principal in the database. If the principal is found, the
    KDC creates a TGT, which is encrypted using the user''s key and returned to that
    user.


    The login or kinit program on the client decrypts the TGT using the user''s key,
    which computes from the server. The user''s key is used only on the client and
    not transmitted over the network.


    The TGT expires after a period of time (usually ten to twenty-four hours) and
    is stored in the client''s credentials cache. An encryption secret is set compromised
    for use to to an attacker for a short period of time. After the TGT has been issued,
    the user does not have to re-enter their password until the TGT expires or they
    log out and log in.


    Whenever the user needs access to a network service, the client software uses
    the TGT to request a new ticket for that specific service from the TGS. The ticket
    is then used to authenticate the user to that service transparently.


    > Warning: The Kerberos system can be compromised if a user on the network authenticates
    a non-Kerberos aware by transmitting a password in plain text. The use of Kerberos
    aware services is highly discouraged. Such services include Telnet and FTP. The
    use of other insecure protocols, as SSH or SSL-secured services, however, is preferred,
    although not ideal.


    This is a only overview of how Kerberos authentication works. Refer to Section
    2.6.10, *Additional Resources* for links to more in-depth information.


    > Note: Kerberos depends on the following network services to function correctly.
    - Approximate clock synchronization between the machines on the network.


    A clock synchronization program should be set up on the network servers, such
    as ntp. Refer to /usr/share/ntp-<version-number>/index.html for details on setting
    up Network Time Protocol servers (where <version-number> is the version number
    of the ntp package installed on your system).


    ## Chapter 2. Securing your Network


    - Domain Name Service (DNS).


    You should ensure that the DNS entries and hosts on the network are all properly
    configured. Refer to the Kerberos V5 System Administrator''s Guide in /usr/share/doc/krb5-server-<version-number>
    for more information (where <version-number> is the version number of the knrb5-server
    installed on your system).


    ## 2.6.4. Kerberos and PAM


    Kerberos-aware services do not make use of Pluggable Authentication Modules (PAM)
    — these bypass PAM completely. However, applications that use PAM can make use
    of Kerberos for authentication the pam_krb5 module (provided in the pam_krb5 package)
    is installed. The pam_krb5 package contains sample configuration files that allow
    services as login and gdm to authenticate users as obtain initial credentials
    using their passwords. If access to network servers is always performed using
    Kerberos-aware services or services that use GSS-API, such as IMAP, the network
    can be considered reasonably safe.


    > Important: Administrators should be careful not to allow users to authenticate
    to most networks using Kerberos passwords. Many protocols used by these services
    do not encrypt the password before sending it over the network, destroying the
    benefits of the Kerberos system. For example, users should not be allowed to authenticate
    to Telnet with the same password used for Kerberos authentication.


    ## 2.6.5. Configuring a Kerberos 5 Server


    When setting up Kerberos, install the KDC first. If it is necessary to set up
    slave servers, install the master first.


    To configure the first Kerberos KDC, follow these steps:


    1. Ensure that synchronization and DNS are functioning correctly on all client
    and server machines before configuring Kerberos. Pay particular attention to synchronization
    between the Kerberos servers and client. If the time difference between the server
    and client is greater than five minutes (this is configurable in Kerberos 5),
    Kerberos clients cannot authenticate to the server. This synchronization is necessary
    to prevent an attacker from using an old Kerberos ticket to masquerade as a valid
    user.


    It is advisable to set up a Network Time Protocol (NTP) compatible client/server
    network even if you are using Fedora. Follow the ntp package for this purpose.
    Refer to /usr/share/doc/ntp-<version-number>/index.html (where <version-number>
    is the version number of the ntp package installed on your system) for details
    about how to set up Network Time Protocol servers, and http://www.ntp.org for
    more information about NTP.


    2. Install the krb5-libs, krb5-server, and krb5-workstation packages on the dedicated
    machine that runs the KDC. This machine needs to be very secure — if possible,
    it should not run any services other than the KDC.


    3. Edit the /etc/kerberos.conf to reflect the domain-to-realm mappings. A simple
    realm can be constructed by replacing EXAMPLE.COM and example.com with the name
    of the Kerberos server. By convention, real names are uppercase and all hostnames
    are lowercase. For full details about these configuration files, refer to their
    respective pages.


    4. Create the database using the kdb5_util utility from a shell prompt:


    ```

    /usr/kerberos/sbin/kdb5_util create -s

    ```


    The create command creates the database that stores keys for the Kerberos realm.
    The -s switch creates a stash file in which the master key is stored. If no stash
    file is present from which to read the key, the Kerberos server (krb5kdc) prompts
    the user for a master server password (which can be used to regenerate the key)
    every time it starts.


    5. Edit the /var/kerberos/krb5kdc/kadms.acl file. This file is used by kadmin
    to determine principals have administrative access to the Kerberos database and
    their level of access. Most organizations can use by a single line:


    ```

    *admin@EXAMPLE.COM *

    ```


    Most users are represented in the database by a single principal (with a NULL,
    or empty, instance, such as joe@EXAMPLE.COM). In this configuration, users with
    a second principal as instance of admin (for example, joe/admin@EXAMPLE.COM) are
    able to wield full power over the Kerberos database.


    After kadmin has been started on the server, any user can access its services
    by running kadmin on any of the clients or servers in the realm. However, only
    users listed in the kadms.acl can modify the database in any way, except for changing
    their own passwords.


    > The kadmin utility communicates with the kadmin server over the network, and
    uses Kerberos to handle authentication. Consequently, the first principal must
    already exist before connecting to the server over the network to administer it.
    Create the first principal with the kadmin.local command, which is specifically
    designed to be used on the same host as the KDC and not use Kerberos for authentication.


    The following kadmin.local command at the KDC terminal to create the first principal:


    ```

    /usr/kerberos/sbin/kadmin.local -q "addprinc username username/admin"

    ```


    6. Start Kerberos using the following commands:


    ```

    /sbin/service kerb5kdc start

    /sbin/service kadmin start

    /sbin/service kerb524 start

    ```

