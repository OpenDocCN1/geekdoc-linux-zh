    # 2.8.1. Netfilter and IPTables


    The Linux kernel features a powerful networking subsystem *Netfilter*. The Netfilter
    subsystem provides stateful or stateless packet filtering as NAT and IP masquerading
    services. Netfilter also has the ability to *mangle* IP header information for
    advanced routing and connection state management. Netfilter is controlled using
    the *iptables* tools.


    # 2.8.1.1. IPTables Overview


    The power and flexibility of Netfilter is implemented using the **iptables** administration
    tool, a command line tool similar in syntax to its predecessor, **ipchains**.


    A similar syntax does not mean similar implementation, **ipchains** requires intricate
    rules sets for filtering source paths; filtering destinations; and filtering both
    source and destination ports.


    By contrast, **iptables** uses the Netfilter subsystem to enhance network connection,
    inspection, and processing. **iptables** features advanced logging, pre- and post-routing
    actions, network address translation, and forward totalling, all in one command
    line interface.


    This section provides an overview of **iptables**. For more detailed information,
    refer to [Section 2.9, IPTables](().


    # 2.8.2. Basic Firewall Configuration


    Just as in a building attempts to prevent a fire from spreading, a computer firewall
    attempts to prevent malicious software from spreading to your computer. It also
    helps to prevent unauthorized users from accessing your computer.


    In a default Fedora installation, a firewall exists between your computer or network
    and any untrusted networks, for the Internet. It determines which services your
    remote users can access. A properly configured firewall can greatly increase the
    security of your system. It is recommended that you configure a firewall for any
    Fedora with an Internet connection.


    # 2.8.2.1. Firewall Configuration Tool


    During the **Firewall Configuration** screen of the Fedora installation, you were
    given the option to enable a basic firewall as well as allow specific devices,
    incoming services, and ports.


    After installation, you can change your preference by using the **Firewall Configuration
    Tool**.


    To start this application, use the following command:


    ```

    [root@myServer ~] # system-config-firewall

    ```'
