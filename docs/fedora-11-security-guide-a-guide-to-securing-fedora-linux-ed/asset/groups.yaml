    ## 1.2.2.1. Establishing a Methodology


    To aid in the selection of tools for a vulnerability assessment, it is helpful
    to establish a vulnerability methodology assessment. Unfortunately, there is no
    predefined or industry approved methodology at this time; however, common sense
    and best practices can act as a sufficient guide.


    What is the target? Are we looking at one server, or are we looking at our entire
    network and everything within the network? Are we external or internal to the
    company? The answers to these questions are important as they determine not which
    tools to select but also the manner in which are used.


    To learn more about establishing methodologies, refer to the following websites:


    - * http://www.isecom.org/osstm/ The Open Source Security Testing Methodology
    Manual (OSSTMM)

    - * http://www.owasp.org/ The Web Application Security Project


    ## 1.2.3. Evaluating the Tools


    An assessment can be built using some form of an information gathering tool. When
    assessing the entire network, map the first host to find the hosts that are running.
    Once located, examine each host individually. Focusing on these hosts requires
    another set of tools. Knowing which tools to use is the most crucial step in finding
    vulnerabilities.


    Just as in every aspect of everyday life, there are many different tools that
    perform the same job. This concept applies to performing vulnerability assessments
    as well as systems, and even networks (based on the protocols used). Some tools
    are free; others are not. Some tools are intuitive and easy to use, while others
    are cryptic and poorly documented but have features that others do not.


    Finding the right tools may be a daunting task and in the end, experience counts.
    If possible, set up a test lab and try out many tools as you can, noting the strengths
    and weaknesses of each. Review the README file or page for the tool. Additionally,
    look to the Internet for more information, such as articles, step-by-step guides,
    and even mailing lists specific to a tool.


    The tools discussed are just a sample of the available tools.


    ### 1.2.3.1. Scanning Hosts with Nmap


    Nmap is a popular tool included in Fedora that can be used to determine the layout
    of a network. Nmap has been available for many years and is probably the most
    used tool when gathering information. An excellent map is included that provides
    a detailed description of its options and usage. Administrators can use Nmap on
    a network to find systems and open ports on those systems.


    Nmap is a competent first tool in vulnerability assessment. You can map out the
    hosts within your network and even a scan allows Nmap to identify the operating
    system on a particular host. Nmap is a good foundation for establishing a policy
    of secure services and stopping unused services.


    ## Chapter 1. Security Overview


    ### 1.2.3.1.1. Using Nmap


    Nmap can be run from a shell prompt by typing the nmap command followed by the
    hostname or IP address of the machine to scan.


    ```

    nmap foo.example.com

    ```


    The results of the scan (which could take up to a few minutes, depending on where
    the host is located) should look similar to the following:


    ```

    Starting Nmap 4.68 ( http://nmap.org )

    Interesting ports on foo.example.com:

    Not shown: /17 filtered ports

    PORT STATE SERVICE

    22/tcp open ssh

    53/tcp open domain

    70/tcp closed gopher

    80/tcp open http

    113/tcp closed auth

    ```


    Nmap tests the most common network ports for listening or waiting services. This
    knowledge could be helpful to an administrator who wants to close down unnecessary
    or unused services.


    For more information about using Nmap, refer to the official homepage at the following
    URL:


    http://www.insecure.org/


    ## 1.2.3.2. Nessus


    Nessus is a full-service security scanner. The plug-in architecture of Nessus
    allows users to customize it for their systems and networks. With any scanner,
    Nessus is only as good as the signature database it relies upon. Fortunately,
    Nessus is frequently updated and features full reporting, host scanning, and real-time
    vulnerability searches. Remember that there could be false positives and negatives,
    even in a tool as powerful and frequently updated as Nessus.


    > Note

    > The Nessus client and server software is included Fedora in repositories but
    requires a subscription to use. It has been included in this document as a reference
    to users who may be interested in using this popular application.


    For more information about Nessus, refer to the official website at the following
    URL:


    http://www.nessus.org/


    ## 1.2.3.3. Nikto


    Nikto is an excellent common gateway interface (CGI) script scanner. Nikto not
    only checks for vulnerabilities but does so in an evasive manner, as to evade
    intrusion detection systems. It comes with thorough documentation which should
    be carefully reviewed prior to running the program. If you have Web servers setting
    up CGI scripts, Nikto can be an excellent resource for checking the security of
    these servers.


    More information about Nikto can be found at the following URL:


    http://www.cirt.net/code/nikto.shtml


    ## 1.2.3.4. VLAD the Scanner


    VLAD is a vulnerabilities scanner developed by the RAZOR team at Bindview, Inc.,
    which checks for the Sans Top list of common security issues (SNMP issues, file
    sharing issues, etc.). While not as-featured as Nessus, VLAD is worth investigating.


    > Note

    > Vlad is not included with Fedora and is not supported. It has been included
    in this document as a reference to users who may be interested in using this popular
    application.


    More information about VLAD can be found on the RAZOR team website at the following:


    http://www.bindview.com/Support/Razor/


    ## 1.2.3.5. Anticipating Your Future Needs


    Depending upon your target and resources, there are many tools available. There
    are tools for wireless networks, Windows systems, Linux systems, and more. Another
    essential part of performing assessments may reviewing physical security, personnel
    security, or VoIP/PBX network assessment. New concepts, such as war walking, involves
    scanning the perimeter of your enterprise’s physical structures for wireless networks
    emerging concepts that you can investigate and, needed, incorporate into your
    assessments. Imagination and exposure are the only limits of planning and conducting
    vulnerability assessments.


    ## 1.3. Attackers and Vulnerabilities


    To plan and implement a good security strategy, be first aware of the issues which
    determined, motivated attackers exploit compromise systems. However, before detailing
    these issues, the terminology used when identifying an attacker must be defined.


    ### 1.3.1. A Quick History of Hackers


    The modern meaning of the term hacker has origins dating to the 1960s and the
    Massachusetts Institute of Technology (MIT) Tech Member Railroad Club, which designed
    train sets of scale and intricate detail. A hacker was a name for club members
    who discovered a clever trick or workaround for a problem.


    The term has since come to describe everything from computer buffs to gifted programmers.
    A common trait among hackers is willingness to explain how computer systems and
    networks function with little or no outside motivation. Open source software developers
    often consider themselves and their colleagues hackers, and use the word as a
    term of respect.


    Typically, hackers follow a form of the hacker ethic which dictates that the quest
    for information and expertise is essential, and sharing this knowledge is the
    hackers duty to the community. During this quest for knowledge, many enjoy the
    challenges of circumventing security controls on computer systems. For this reason,
    the press often uses the term hacker to describe those... The more accurate term
    for this type of computer hacker is cracker — a term created by hackers in the
    mid-1980s to differentiate the two communities.

