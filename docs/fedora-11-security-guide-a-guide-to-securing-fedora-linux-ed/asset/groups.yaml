    Additional options for the -L command option, which provide rules and allow more
    verbose rule descriptions, are described in Section 2.9.3.6, "Listing Options".


    +   - -N Creates a chain with a user-specified name. The chain name must be unique,
    otherwise an error message is displayed.

    - -P Sets the default for the specified chain, so when packets traverse an entire
    chain without matching a rule, they are sent to the specified target, as ACCEPT
    or DROP.

    - -R Replaces a rule in the specified chain. The rule''s number must be specified
    after the chain''s name. The first rule in a chain corresponds to number one.

    - -X Deletes a user-specified chain. You cannot delete a built-in chain.

    - -Z Sets the byte and packet counters in all chains for a table to zero.


    # 2.9.3.3. IPTables Parameter Options


    Certain iptables commands, including those used to add, append, delete, insert,
    or replace rules within a particular chain, require various parameters to construct
    a packet filtering rule.


