    ## 2.1.3.2.2. 密码短语 (Passphrases)


    密码短语是当今系统安全的基石。遗憾的是，生物识别和双因子认证等技术在许多系统中尚未普及，这已成为一个问题。如果使用密码来保护系统，应该考虑使用密码短语。短语比密码长，即使使用数字和符号等非标准字符实现，也能比密码提供更好的保护。


    ## 2.1.3.2.3. 密码老化


    密码老化是系统管理员用于防御组织内坏密码的另一种技术。密码老化意味着在指定的期间（通常为 90 天）后，用户会被提示创建新密码。背后的理论是，如果强制用户定期更改密码，那么被破解的密码对入侵者来说有效期是有限的。然而，密码老化的缺点是用户更有可能把密码写下来。


    在 Fedora 下有两个主要程序可以指定密码老化策略：change 命令或图形化用户管理器（system-config-users）应用程序。


    change 命令的 -M 选项指定了密码有效的最大天数。例如，要设置用户的密码在 90 天后过期，使用以下命令：


    ```

    chage -M 90 <username>

    ```


    ## 第 2 章 您的网络安全


    在上述命令中，将 <username> 替换为用户名。要禁用密码过期，传统做法是在 -M 选项后使用值 99999（这相当于 273 多年）。


    你也可以在交互模式下使用 chage 命令修改多个密码老化和账户详情。使用以下命令进入交互模式：


    ```

    chage <username>

    ```


    以下是使用该命令的交互会话示例：


    ```

    root@interch1]# chage davido

    Changing the age information for davido

    Minimum Password Age: 0

    Maximum Password Age: 99999

    Last Password Change (YYYY-MM-DD): 2006-08-18

    Password Warning Days: 7

    Inactive days: -1

    Account Expiration Date (YYYY-MM-DD): 1969-12-31

    root@interch1]#

    ```


    可用选项的信息请参考 chage 手页。


    你也可以按照如下方法使用图形用户管理器创建密码老化。执行此操作需要管理员权限。


    1. 点击面板上的“系统（System）”，指向“管理（Administration）”，然后点击“用户和组（Users and Groups）”显示用户管理器。

    2. 点击“用户（Users）”选项卡，选择所需的的用户。

    3. 点击工具栏上的“属性（Properties）”显示用户属性框（或从“文件”菜单中选择“属性”）。

    4. 点击“密码信息（Password Info）”选项卡，勾选“启用过期（Enable expiration）”。

    5. 在“有效期（Days）”字段中输入所需的值，并点击“确定（OK）”。


    ![41d4f31e0edc30c790278ea3a44_38_0.png 指定密码老化选项


    ### 2.1.4. 行政控制


    管理家时，用户必须作为 root 用户或通过 setuid 程序（如 sudo 或 su）获取有效权限来执行某些任务。setuid 程序是以程序所有者的用户
    ID (UID) 而不是操作用户的身份运行。此类程序在长格式列出的所有者部分用 s 表示，例如所示：


    ```

    -rwsxr-x 1 root root 47324 May 1 08:09 /bin/su

    ```


    > 注意 s 可能是大写或小写。如果是大写，意味着底层权限位未设置。


    对于组织的系统管理员来说，必须决定组织内的用户对机器拥有多少访问权限。通过一个名为 pam_console.so 的 PAM 模块，通常留给 root 用户的活动（如重启和挂载可移动介质）可以在控制台登录的第一个用户可以使用（更多信息请参阅第
    2.4 节“可插拔认证模块 (PAM)”）。然而，没有管理员权限的情况下，无法执行其他系统管理任务，如更改网络设置、配置新鼠标或挂载网络设备。因此，系统管理员必须决定网络上的用户应该获得多少访问权限。


    '
