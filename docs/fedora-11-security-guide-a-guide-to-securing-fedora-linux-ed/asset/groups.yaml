    **finger** 和 **rwhod** 等其他服务会暴露有关系统用户的信息。


    应避免本质上不安全的服务和 shell 程序（**login**、**rsh** 和 **telnet**），而优先使用 SSH。有关 **sshd** 的更多信息，请参阅[第
