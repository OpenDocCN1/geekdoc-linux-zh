    # Chapter 2. Securing Your Network


    There are four predefined control flags:


    +   - required — The module result must be successful for authentication to continue.
    If the test fails at this point, the user is not notified until the results of
    all module tests that reference that interface are complete.


    +   - requisite — The module result must be successful for authentication to continue.
    If a test fails at this point, the user is notified immediately with a message
    reflecting the first failed required or requisite module test.


    +   - sufficient — The module result is ignored if it fails. However, if the result
    of a module flagged sufficient is successful and no previous modules required
    have failed, then no other results are required and the user is authenticated
    to the service.


    +   - optional — The module result is ignored. A module flagged optional only
    becomes necessary for successful authentication when no other modules reference
    the interface.


    > Order in which required modules are called is not critical. Only the sufficient
    and requisite control flags cause order to become important.


    A newer control syntax allows for more precision and is now available for PAM.


    The pam and the PAM module, located in the /usr/share/doc/pam-<version-number>/
    directory, where <version-number> is the version number for PAM on your system,
    describe this newer syntax in detail.


