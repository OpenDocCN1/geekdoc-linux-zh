    # Chapter 2. Securing Your Network


    > **Warning**

    Be careful when using hostnames and domain names. Attackers can use a variety
    of tricks to circumvent accurate name resolution. In addition, disruption to DNS
    service prevents even authorized users using network services. It is, therefore,
    best to use IP addresses whenever possible.


    # 2.5.2.1.3. Portmap and TCP Wrappers


    **portmap** implementation of TCP Wrappers does not support host look-ups, which
    means **portmap** cannot use hostnames to identify hosts. Consequently, access
    control rules for portmap in **hosts.allow** must use IP addresses, or the keyword
    **ALL**, for specifying hosts.


    Changes to **portmap** access control rules may take effect immediately. You may
    need to restart the **portmap** service.


    Widely used services, as NIS and NFS, depend on **portmap** to operate, so be
    aware of these limitations.


    # 2.5.2.1.4. Operators


    At present, access control rules accept one operator, **EXCEPT**. It can be used
    in both the daemon list and the client list of a rule.


    The **EXCEPT** operator allows exceptions to broader matches within the same range.


    In the following example from a **hosts.allow** file, all example, .com hosts
    are allowed to connect to all services except **cracker.example.com**.


    ```

    ALL: .example.com EXCEPT cracker.example.com

    ```


    In another example from a **hosts.allow** file, clients from the 192.168.0.x network
    can use all services except for FTP:


    ```

    ALL EXCEPT vsftpd: 192.168.0.0.

    ```


    > **Note**

    Organizationally, it is often easier to avoid using **EXCEPT** operators. This
    allows administrators to quickly scan the appropriate files to see what hosts
    are allowed or denied access to services, without having to sort through **EXCEPT**
    operators.


    # 2.5.2.2. Option Fields


    In addition to basic rules that allow and deny, the Fedora implementation of TCP
    Wrappers supports extensions to the access control language through **option fields**.
    By using option fields in hosts access rules, administrators can accomplish a
    variety of tasks such as altering log behavior, consolidating access control,
    and launching shell commands.'
