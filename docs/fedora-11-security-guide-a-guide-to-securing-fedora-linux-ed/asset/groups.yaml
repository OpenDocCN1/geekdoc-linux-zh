    ## Kerberos 工作原理


    未加密密码

    明文的、人类可读的密码。


    ## 2.6.3. Kerberos 工作原理


    Kerberos 与用户名/密码身份验证方法不同。它不是通过对每个用户进行身份验证来检查网络服务，而是使用对称加密和信任的第三方（KDC）来对一组网络服务进行身份验证。当用户向
    KDC 进行身份验证时，KDC 会向用户机器发送一个针对该用户的票据（ticket），而支持 Kerberos 的服务会在用户机器上查找该票据，而不是要求用户使用密码进行身份验证。


    当支持 Kerberos 的网络上的用户登录工作站时，该主体（principal）将作为向认证服务器请求 TGT 的请求的一部分发送到 KDC。该请求可以由登录程序发送，从而对用户是透明的，也可以在用户登录后由
    `kinit` 程序发送。


    KDC 在数据库中检查该主体。如果找到了该主体，KDC 会创建一个 TGT，该 TGT 使用用户的密钥进行加密并返回给该用户。


    客户端上的登录程序或 `kinit` 程序使用从服务器计算出的用户密钥来解密 TGT。用户密钥仅用于客户端，不通过网络传输。


    TGT 在一段时间后（通常为十到二十四小时）会过期，并存储在客户端的凭据缓存中。加密密钥被设置为泄露供攻击者在短时间内使用。TGT 发行后，在 TGT 过期或用户注销重新登录之前，用户无需重新输入密码。


    每当用户需要访问网络服务时，客户端软件使用 TGT 向 TGS 请求该特定服务的新票据。然后，该票据将用于透明地对该服务进行用户身份验证。


    > 警告：如果网络上的用户通过传输明文密码对不支持 Kerberos 的服务进行身份验证，Kerberos 系统可能会被破解。强烈不建议使用不支持 Kerberos
    的服务。此类服务包括 Telnet 和 FTP。然而，优于使用其他不安全的协议（如 SSH 或 SSL 保护的服务），尽管这并非理想。


    这只是 Kerberos 身份验证工作原理的概述。请参阅第 2.6.10 节 **附加资源* 以获取更多深度信息的链接。


    > 注意：Kerberos 依赖于以下网络服务才能正常运行。- 网络上机器之间的大致时钟同步。


    应在网络服务器上设置时钟同步程序，例如 ntp。请参阅 /usr/share/ntp-<version-number>/index.html 了解设置网络时间协议服务器的详情（其中
    <version-number> 是系统中安装的 ntp 软件包的版本号）。


    ## 第 2 章 保护您的网络


    - 域名系统服务 (DNS)。


    你应该确保网络上的 DNS 条目和主机都已正确配置。请参阅 /usr/share/doc/krb5-server-<version-number> 中的《Kerberos
    V5 系统管理员指南》获取更多信息（其中 <version-number> 是系统中安装的 knrb5-server 的版本号）。


    ## 2.6.4. Kerberos 与 PAM


    支持 Kerberos 的服务不使用可插拔模块（PAM）——这些服务完全绕过了 PAM。然而，使用 PAM 的应用程序如果安装了 `pam_krb5` 模块（由
    `pam_krb5` 软件包提供），可以使用 Kerberos 进行身份验证。`pam_krb5` 软件包包含示例配置文件，允许登录和 gdm 等服务使用用户的密码对用户进行身份验证并获取初始凭据。如果访问网络服务器始终使用支持
    Kerberos 的服务或使用 GSS-API 的服务（如 IMAP），则网络可以被认为是安全的。


    > 重要：管理员应小心不要允许用户使用 Kerberos 密码对大多数网络进行身份验证。这些服务使用的许多协议在通过网络发送密码之前不会加密，这破坏了 Kerberos
    系统的优势。例如，不应允许用户使用与 Kerberos 身份验证相同的密码登录 Telnet。


    ## 2.6.5. 配置 Kerberos 5 服务器


    在设置 Kerberos 时，首先安装 KDC。如果需要设置从服务器，先安装主服务器。


    配置第一个 Kerberos KDC，请遵循以下步骤：


    1. 在配置 Kerberos 之前，确保所有客户端和服务器上的同步和 DNS 运行正常。特别注意 Kerberos 服务器与客户端之间的同步。如果服务器与客户端之间的时间差大于五分钟（这在
    Kerberos 5 中是可以配置的），Kerberos 客户端将无法向服务器进行身份验证。这种同步对于防止攻击者使用旧 Kerberos 票据伪装成有效用户是必要的。


    即使你使用的是 Fedora，建议设置兼容网络时间协议 (NTP) 的客户端/服务器网络。为此请遵循 ntp 软件包。参阅 /usr/share/doc/ntp-<version-number>/index.html（其中
    <version-number> 是系统中安装的 ntp 软件包的版本号）获取如何设置网络时间协议服务器的详情，并访问 http://www.ntp.org
    获取有关 NTP 的更多信息。


    2. 在运行 KDC 的专用机器上安装 `krb5-libs`、`krb5-server` 和 `krb5-workstation` 软件包。该机器需要非常安全——如果可能，它不应运行
    KDC 以外的任何服务。


    3. 编辑 /etc/kerberos.conf 以反映域到实的映射。可以通过将 EXAMPLE.COM 和 example.com 替换为 Kerberos
    服务器的名称来构建简单的领域。按照习惯，真实名称使用大写，所有主机名使用小写。有关这些配置文件的完整细节，请参阅各自的页面。


    4. 在 shell 提示符中使用 `kdb5_util` 工具创建数据库：


    ```

    /usr/kerberos/sbin/kdb5_util create -s

    ```


    `create` 命令创建存储 Kerberos 领域密钥的数据库。`-s` 选项创建一个存储主密钥的存储文件（stash file）。如果没有可以读取密钥的存储文件，Kerberos
    服务器 (krb5kdc) 每次启动时都会提示用户输入主服务器密码（用于重新生成密钥）。


    5. 编辑 /var/kerberos/krb5kdc/kadms.acl 文件。此文件由 kadmin 用于确定哪些主体具有 Kerberos 数据库的管理权限以及它们的访问级别。大多数组织可以使用单行代码来实现：


    ```

    *admin@EXAMPLE.COM *

    ```


    数据库中的大多数用户由单个主体表示（带有一个 NULL 或空实例，例如 joe@EXAMPLE.COM）。在此配置下，具有 admin 实例的第二个主体的用户（例如
    joe/admin@EXAMPLE.COM）能够对 Kerberos 数据库行使完全权力。


    在服务器上启动 kadmin 后，任何用户都可以在领域内的任何客户端或服务器上通过运行 kadmin 访问其服务。然而，只有 kadms.acl 中列出的用户才能以修改自己密码以外的任何方式修改数据库。


    > kadmin 工具通过网络与 kadmin 服务器通信，并使用 Kerberos 处理身份验证。因此，在通过网络连接到服务器进行管理之前，必须已经存在第一个主体。使用
    kadmin.local 命令创建第一个主体，该命令专门设计用于与 KDC 相同的主机，且不使用 Kerberos 进行身份验证。


    在 KDC 终端执行以下 kadmin.local 命令创建第一个主体：


    ```

    /usr/kerberos/sbin/kadmin.local -q "addprinc username username/admin"

    ```


    6. 使用以下命令启动 Kerberos：


    ```

    /sbin/service kerb5kdc start

    /sbin/service kadmin start

    /sbin/service kerb524 start

    ```


