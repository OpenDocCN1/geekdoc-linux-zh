    # Chapter 2. Securing Your Network


    - Section 2.5.2.1.2, "Patterns"

    - Section 2.5.2.2.4, "Expansions"

    - Section 2.5.2.2, "Option Fields"


    The following is a basic sample hosts access rule:


    ```

    vsftd : .example.com

    ```


    This rule instructs TCP Wrappers to watch for connections to the FTP daemon (vsftd)
    from any host in the example.com domain. If this rule appears in hosts.allow,
    the connection is accepted. If this appears in hosts.deny, the connection is rejected.


    The next sample hosts rule is more complex and uses two option fields:


    ```

    sshd : .example.com \: spawn /bin/echo \/var/log/sshd.log \: deny

    ```


    Note that each option field is preceded by the backslash (\). Use of the backslash
    prevents failure of the rule due to length.


    This sample rule states that if a connection to the SSH daemon (sshd) is attempted
    from a host in the example.com domain, the echo command to append to a special
    log file, and deny the connection. Because the option deny is used twice it appears
    in the hosts.allow file. Refer to Section 2.5.2.2, "Option Fields" for a more
    detailed look at available options.


    ## 2.5.2.1.1. Wildcards


    Wildcards allow TCP Wrappers to easily match groups of daemons or hosts. They
    are used frequently in the client list field of access rules.


    The following wildcards are available:


    - ALL — Matches everything. It can be used for both the daemon list and the client
    list.

    - LOCAL — Matches any host that does not contain a period (.), such as localhost.

    - KNOWN — Matches any host where the hostname and host address are known or where
    the user is known.

    - UNKNOWN — Matches any host where the hostname or host address are unknown or
    where the user is unknown.

    - PARANOID — Matches any host where the hostname does not match the address.


    > Important

    > The KNOWN, UNKNOWN, and PARANOID wildcards should be used with care, because
    they rely on functioning DNS server for correct operation. Any disruption to name
    resolution may prevent legitimate users from gaining access to a service.


    ## 2.5.2.1.2. Patterns


    Patterns can be used in the client field of access rules to more precisely specify
    groups of client hosts.


    The following is a list of common patterns for entries in the client field:


    - Hostname beginning with a period (.) — Placing a period at the beginning of
    a hostnames all hosts sharing the listed components of the name. The following
    example applies to any host within the example.com domain


    ```

    ALL \: .example.com

    ```


    - IP address ending with a period () — Placing a period at the end of an IP address
    matches all hosts sharing the initial numerical groups of an IP address. The following
    example applies to any host within the 192.168.x.x network:


    ```

    ALL \: 192.168.x

    ```


    - IP address/netmask — Netmask expressions can also be used as a pattern to control
    access to a particular group of IP addresses. The following example applies to
    any host with an address range of 192.168.0.0 through 192.168.1.255:


    ```

    ALL \: 192.168.0.0/255.255.254.0

    ```


    > Important: Working in the IPv4 address space, the address/prefix length (prefixlen)
    pair declarations (CIDR notation) are not supported. Only IPv6 rules can use this
    format.


    - IPv6 address/prefix len — [net]/prefix len can also be used as a pattern to
    control access to a particular group of IPv6 addresses. The following example
    would apply to any host with an address range of 3ffe0:505:2:1::through 3ffe0:505:2:1:ffff:ffff:ffff:ffff:


    ```

    ALL \: [3ffe:505:2:1::]/64

    ```


    - The asterisk (*) — Asterisks can be used to match groups of hostnames or IP
    addresses, as long as they are not mixed in a client list containing other types
    of patterns. The following example would apply to any host within the example.com
    domain:


    ```

    ALL \: *.example.com

    ```


    - The slash (/) If a client list begins with a slash, it is treated as a file
    name. This is useful if specifying large numbers of hosts are necessary. The following
    example refers TCP Wrappers to the /etc/telnet.hosts file for all Telnet connections:


    ```

    in.telnetd : /etc/telnet.hosts

    ```


    Other, lesser used, patterns are also accepted by TCP Wrappers. Refer to the hosts_access
    man 5 for more information.


    # Chapter 2. Securing Your Network


    > **Warning**

    > Be careful when using hostnames and domain names. Attackers can use a variety
    of tricks to circumvent accurate name resolution. In addition, disruption to DNS
    service prevents even authorized users using network services. It is, therefore,
    best to use IP addresses whenever possible.


    ## 2.5.2.1.3. Portmap and TCP Wrappers


    **portmap** implementation of TCP Wrappers does not support host look-ups, which
    means **portmap** cannot use hostnames to identify hosts. Consequently, access
    control rules for portmap in **hosts.allow** must use IP addresses, or the keyword
    **ALL**, for specifying hosts.


    Changes to **portmap** access control rules may take effect immediately. You may
    need to restart the **portmap** service.


    Widely used services, as NIS and NFS, depend on **portmap** to operate, so be
    aware of these limitations.


    ## 2.5.2.1.4. Operators


    At present, access control rules accept one operator, **EXCEPT**. It can be used
    in both the daemon list and the client list of a rule.


    The **EXCEPT** operator allows exceptions to broader matches within the same range.


    In the following example from a **hosts.allow** file, all example, .com hosts
    are allowed to connect to all services except **cracker.example.com**.


    ```

    ALL: .example.com EXCEPT cracker.example.com

    ```


    In another example from a **hosts.allow** file, clients from the 192.168.0.x network
    can use all services except for FTP:


    ```

    ALL EXCEPT vsftpd: 192.168.0.0.

    ```


    > **Note**

    > Organizationally, it is often easier to avoid using **EXCEPT** operators. This
    allows administrators to quickly scan the appropriate files to see what hosts
    are allowed or denied access to services, without having to sort through **EXCEPT**.


    ## 2.5.2.2. Option Fields


    In addition to basic rules that allow and deny, the Fedora implementation of TCP
    Wrappers supports extensions to the access language through **option fields**.
    By using option fields in hosts access rules, administrators can accomplish a
    variety of tasks such as altering log behavior, consolidating access control,
    and launching shell commands.


    ### 2.5.2.2.1. Logging


    Option fields administrators easily change the log facility and priority level
    for a rule by using the **severity** directive.


    In the following example, connections to the SSH daemon from any host in the example.com
    domain are logged to the default **authpriv** facility (because no facility value
    is specified) with a priority of **emerg**


    ```

    sshd : .example.com : severity emerg

    ```


    ```

    sshd : .example.com : severity local0.alert

    ```


    > Note

    > In practice, this example does not work unless the syslog daemon (syslogd) is
    configured to log to the **local0** facility. Refer to the **syslog.conf** man
    page for information about configuring custom log facilities.


    ### 2.5.2.2.2. Access Control


    Option fields also allow administrators to explicitly allow or deny hosts in a
    single rule by adding the **allow** or **deny** directive as the final option.


    For the following example, two rules allow SSH connections from client-1.example.com,
    but deny connections from client-2.example.com:


    ```

    sshd : client-1.example.com : allow

    sshd : client-2.example.com : deny

    ```


    ### 2.5.2.2.3. Shell Commands


    Option fields allow access rules to launch shell commands through the following
    directives:


    - **spawn** — Launches a command as a child process. This directive can perform
    tasks like using **/usr/sbin/base_finger** to get more information about the requesting
    client or create special log files using the **echo** command.


    In the following example, clients attempting to access Telnet services from the
