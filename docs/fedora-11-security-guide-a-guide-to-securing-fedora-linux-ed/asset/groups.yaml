    # Securing Your Network


    # 2.1. Workstation Security


    Securing a Linux environment begins with the workstation. Whether locking down
    a personal machine or securing an enterprise system, sound security policy begins
    with the individual computer. A computer network is only as secure as its weakest
    node.


    # 2.1.1. Evaluating Workstation Security


    When evaluating the security of a Fedora workstation, consider the following:


    +   - BIOS and Boot Loader Security — Can an unauthorized user physically access
    the machine and boot into single user or rescue mode without a password?

    - Password Security — How secure are the user accounts on the machine?

    - Administrative Controls — Who has an account on the system and how much administrative
    control do they have?

    - Available Network Services — What services are listening for requests from the
    network and should be running at all?

    - Personal Firewalls — What type of firewall, if any, is necessary?

    - Security Enhanced Communication Tools — Which tools should be used to communicate
    between workstations and which should be avoided?


    # 2.1.2. BIOS and Boot Loader Security


    Password protection for the BIOS (or BIOS equivalent) and the boot loader can
    prevent unauthorized users who have physical access to systems from booting using
    removable media or obtaining root privileges through single user mode. The security
    measures you take to protect against such attacks depends on the sensitivity of
    the information on the network and the location of the machine.


    For example, if a machine is in a trade show and contains no sensitive information,
    it may not be critical to prevent such attacks. However, if an employee''s laptop
    with private, unencrypted SSH keys for the corporate network is left unattended
    at that trade show, it could lead to a major security breach with ramifications
    for the entire company.


    If the workstation is located in a place where unauthorized or trusted people
    have access, however, securing the BIOS or the boot loader may not be necessary.


    # 2.1.2.1. BIOS Passwords


    The two primary reasons for password protecting the BIOS of a computer are:


    +   - Preventing Changes to BIOS Settings — If an intruder has access to the BIOS,
    they can set it to boot from a diskette or CD-ROM. This makes it possible for
    them to enter rescue mode or single


    Since system BIOSes differ from manufacturers, some may not support password protection
    of either type, while others may support one type but not the other.'
- md: '

    # Chapter 2. Securing Your Network


    user mode, in turn allows them to start arbitrary processes on the system or copy
    sensitive data.


    - Preventing System Booting — Some BIOSes allow password protection of the boot
    process. When activated, an attacker is forced to enter a password before the
    BIOS launches the boot loader.


    Because the methods for setting a BIOS password vary between computer manufacturers,
    consult the computer''s manual for specific instructions.


    If you forget the BIOS password, it can be reset with jumpers on the motherboard
    or by disconnecting the CMOS battery. For this reason, it is good practice to
    lock the computer case if possible. However, consult the manual for the computer
    or motherboard before attempting to disconnect the CMOS battery.


    ## 2.1.2.1.1. Securing Non-x86 Platforms


    Other architectures use different programs to perform low-level tasks roughly
    equivalent to those of the BIOS on x86 systems. For instance, Intel® Itanium™
    computers use the Extensible Firmware Interface (EFI) shell.


    For instructions protecting BIOS-like programs on other architectures, refer to
    the manufacturer''s instructions.


    ## 2.1.2.2. Boot Loader Passwords


    The primary reasons for password protecting a Linux boot loader are as follows:


    - Preventing Access to Single User Mode — If attackers can boot the system into
    single user mode, they are logged in automatically without being prompted for
    the root.

    - Preventing Access to the GRUB Console — If the machine uses GRUB as its boot
    loader, an attacker can use the GRUB editor interface to change its configuration
    or gather information using the *cat* command.

    - Preventing Access to Insecure Operating Systems — If it is a dual-boot system,
    an attacker can select an operating system at boot time (for example, DOS), which
    ignores access controls and file permissions.


    Fedora has the GRUB boot loader on the x86 platform. For a detailed look at GRUB,
    refer to the Red Hat Installation Guide.


    ## 2.1.2.2.1. Password Protecting GRUB


    You can configure GRUB to address the first two issues listed in Section 2.1.2.2,
    “Boot Loader Passwords” by adding a password directive to your configuration file.
    To do this, first choose a strong password, open a shell, as root, and then type
    the following command:


    ```

    /sbin/grub-md5-crypt

    ```


    When prompted, type the GRUB password and press **Enter**. This returns an MD5
    hash of the password.


    Next, edit the GRUB configuration file `/boot/grub/grub.conf`. Open the file and
    below the *timeout* line in the main section of the document, add the following
    line:


    ```

    password --md5 <password-hash>

    ```


    Replace <password-hash> with the value returned by /sbin/grub-md5-crypt.


    The next time system boots, the GRUB menu prevents access to the editor or command
    interface without first pressing p followed by the GRUB password.


    Unfortunately, this solution does not prevent an attacker from booting into an
    insecure operating system in a dual-boot environment. For a different part of
    the /boot/grub/grub.conf file must be edited.


    Look for the title line of the operating system that you want to secure, and add
    a line with the lock directive immediately beneath it.


    For a DOS system, the stanza should begin similar to the following:


    ```

    title DOS lock

    ```


    > Warning

    > A password line must be present in the main section of the /boot/grub/grub.conf
    file for this method to work properly. Otherwise, an attacker can access the GRUB
    editor interface and remove the lock line.


    To create a different password for a particular kernel or operating system, add
    a lock line to the stanza, followed by a password line.


    Each stanza protected with a unique password should begin with lines similar to
    the following example:


    ```

    DOS lock password --md5 <password-hash>

    ```


    ## 2.1.3. Password Security


    Passwords are the primary method Fedora uses to verify a user''s identity. This
    is why password security is important for protection of the user, the workstation,
    and the network.


    For security purposes, the installation program confirms the system to use Message-Digest
    Algorithm (MD5) and shadow passwords. It is highly recommended that you do not
    alter these settings.


    If MD5 passwords are deselected during installation, the older Data Encryption
    Standard (DES) format is used. This limits passwords to alphanumeric characters
    (disallowing punctuation and other characters), and provides a modest 56-bit level
    of encryption.


    If shadow passwords are deselected during installation, all passwords are stored
    as a one-way hash in the world-readable /etc/passwd file, which makes the system
    vulnerable to offline password cracking attacks. If an intruder can gain access
    to the machine as a regular user, he can copy the /etc/passwd to his own machine
    and run any number of password cracking programs against it.


    GRUB also accepts unencrypted passwords, but it is recommended that an MD5 hash
    be used for added security.


    If there is an insecure password in the file, it is only a matter of time before
    the password cracker discovers it.


    Shadow passwords eliminate this type of attack by storing the password hashes
    in the file /etc/shadow, which is readable only by the root user.


    This forces a potential attacker to attempt password cracking by logging into
    a network service on, such as SSH or FTP. This sort of brute-force attack is much
    slower and leaves an obvious trail of hundreds of failed login attempts are written
    to system files. Of course, if the cracker starts an attack in the middle of the
    night with weak passwords, the cracker may have gained access before dawn and
    edited the log files to cover his tracks.


    In addition to format and storage considerations is the content of it. The single
    most important thing a user can do to protect his account against a password cracking
    attack is to create a strong password.


    ## 2.1.3.1. Creating Strong Passwords


    When creating a secure password, it is a good idea to follow these guidelines:


    - Do Not Use Only Words or Numbers — Never use only numbers or words in a password.


    Some insecure examples include the following:


    - 8675309

    - juan

    - hackme


    - Do Not Use Recognizable Words — Words such as proper names, dictionary words,
    or even terms from television shows or novels should be avoided, even if they
    are bookended with numbers.


    Some insecure examples include the following:


    - john1

    - DS-9

    - mental123


    - Do Not Use Words in Foreign Languages — Password cracking often often check
    against word lists that encompasses dictionaries of many languages. Relying on
    foreign languages for passwords is not secure.


    Some insecure examples include the following:


    - cheguevvara

    - bienvenidos1

    - 1dbmkopf


    - Do Not Use Hacker Terminology — If you think you are elite because you use hacker
    terminology — also called l337 (LEET) speak — in your password, think again. Many
    word lists include LEET speak.


    Some insecure examples include the following:


    - H4X0R

    - 1337


    - Do Not Use Personal Information — Avoid using any personal information in your
    passwords. If the attacker knows your identity, the task of deducing your password
    becomes easier. The following is a list of the types of information to avoid when
    creating a password:


    Some insecure examples include the following:


    - Your name

    - The names of pets

    - The names of family members

    - Any birth dates

    - Your phone number or zip code


    - Do Not Invert Recognizable Words — Good password checkers always reverse common
    words, so inverting a bad password does not make it any more secure.


    Some insecure examples include the following:


    - R0X4H

    - nauj

    - 9-DS


    - Do Not Write Down Your Password — Never store a password on paper. It is much
    safer to memorize it.


    - Do Not Use the Same Password For All Machines — It is important to separate
    passwords for each machine. This way if one system is compromised, all of your
    machines are not immediately at risk.


    The following guidelines will help you to create a strong password:


    - Make the Password at least Eight Characters Long — The longer the password,
    the better. If using MD5 passwords, it should be 15 characters or longer. With
    DES passwords, use the maximum length (eight characters).


    - Mix Upper and Lower Letters — Case is sensitive, so mix cases to enhance the
    strength of the password.


    - Mix Letters and Numbers — Adding numbers to passwords, especially when added
    to the middle (not just at the beginning or the end), can enhance password strength.


    - Include Non-Alphanumeric Characters — Special characters such as &, $, and and
    can greatly improve the strength of a password (this is not possible if using
    DES passwords).

