    ## 2.1.4.3.2. sudo 命令


    sudo 命令提供了一种为用户提供管理权限的另一种方法。当受信任的用户在管理命令前加上 `sudo` 时，系统会提示他们输入自己的密码。然后，在通过身份验证且假设该命令被允许的情况下，该管理命令将以
    root 用户的身份执行。


    sudo 命令的基本格式如下所示：


    ```

    sudo <command>

    ```


    在上面的示例中，`<command>` 将被替换为通常留给 root 用户的命令，例如 `mount`。


    > 重要

    使用 sudo 命令的用户在离开机器前应格外注意注销，因为 `sudoers` 用户在五分钟的期限内可以再次使用该命令，而无需提示密码。此设置可以通过配置文件
    `/etc/sudoers` 进行更改。


    ## 可用网络服务


    sudo 命令提供了完整的审计跟踪。每次成功的身份验证都会记录在 `/var/log/messages` 文件中，用用户名称发布的命令将记录在 `/var/log/secure`
    文件中。


    sudo 命令的另一个优势是管理员可以根据需要允许不同用户访问特定的命令。


    想要编辑 sudo 配置文件 `/etc/sudoers` 的管理员应使用 `visudo` 命令。


    要赋予完全管理权限，请输入 `visudo` 并在用户权限规范部分添加类似下所示的行：


    ```

    juan ALL:(ALL) ALL

    ```


    此示例显示用户 `juan` 可以从任何主机使用 `sudo` 并执行任何命令。

    下面的示例说明了在配置 sudo 时可以实现的粒度控制：


    ```

    %users localhost:/bin/shutdown -h now

    ```


    此示例表示，只要是从控制台发出的命令，任何用户都可以使用 `/sbin/shutdown -h` 命令。


    该页面列出了此文件选项的详细列表。


    ## 2.1.5. 可用网络服务


    对于组织内的系统管理员来说，用户对管理控制的访问是一个重要问题，但对于任何操作和管理 Linux 系统的人来说，监控哪些网络服务处于激活状态至关重要。


    许多服务作为网络服务运行。如果网络服务在机器上运行，那么服务器应用程序（称为守护进程）就会在一个或多个网络端口上监听连接。这些服务器中的每一个都应该被视为潜在的攻击途径。


    ## 2.1.5.1. 服务的风险


    网络服务会给 Linux 系统带来许多风险。以下是一些主要问题的列表：


    - 拒绝服务攻击 (DoS) — 通过向服务发送大量请求，拒绝服务攻击会导致系统在尝试回答收到的每个请求时变得无法使用。

    - 脚本漏洞攻击 — 如果服务器使用脚本来执行服务器端操作（如 Web 服务器通常所做），破解者可以攻击编写的脚本。这些脚本漏洞攻击可能导致缓冲区溢出状况，或允许攻击者更改系统上的文件。

    - 缓冲区溢出攻击 — 连接到 0 到 1023 号端口的服务必须以管理用户身份运行。如果应用程序存在可利用的缓冲区溢出漏洞，攻击者就可以以运行守护进程的用户身份访问系统。由于存在可利用的缓冲区溢出，破解者使用自动化工具识别漏洞，一旦获得访问权限，他们就会使用自动化
    rootkit 维持对系统的访问。


    > 注意 Fedora 通过 ExecShield 缓解了缓冲区溢出漏洞的威胁，ExecShield 是一种支持 x86 兼容的单处理器和多处理器内核的可执行内存分段和保护技术。ExecShield
    通过将虚拟内存分为可执行段和非执行段来降低缓冲区溢出的风险。任何尝试在可执行段之外执行程序代码（例如从缓冲区溢出漏洞注入的恶意代码）都会触发段错误并终止。


    ExecShield 还包括对 AMD64 平台上的无执行 (NX) 技术以及在 Itanium 和 Intel® 64 系统上的执行禁用 (XD) 技术的支持。这些技术与
    ExecShield 配合工作，防止恶意代码在虚拟内存的可执行部分运行，其粒度为 4KB 的可执行代码，降低了来自隐蔽缓冲区溢出攻击的风险。


    > 重要 为了减少在网络上遭受攻击的风险，应关闭所有未使用的服务。


    ## 2.1.5.2. 识别和配置服务


    为了确保安全，Fedora 中安装的大多数网络服务默认都是关闭的。然而，也有一些例外：


    - cupsd — Fedora 的默认打印服务器。

    - lpd — 备用打印服务器。

    - xinetd — 一个控制一系列从属服务器（如 gssftp 和 telnet）连接的超级服务器。

    - sendmail — SendMail 传输代理 (MTA) 默认启用，但仅监听来自本地的连接。

    - sshd — OpenSSH 服务器，是 Telnet 的安全替代品。


    在决定是否让这些服务运行时，应根据需要判断。


    对于未使用的服务，最好根据常谨慎。不要运行 portmap。


