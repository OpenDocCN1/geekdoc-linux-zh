    # Chapter 3. Encryption


    or gain access to sensitive information. Other private information such as bank
    account information should also be protected when transmitted across a network.
    If the network session was encrypted then you would not have to worry as much
    about the data being compromised while it is being transmitted.


    Data in motion is particularly vulnerable to attackers because the attacker does
    not have to be near the computer in which the data is stored rather they have
    to be somewhere along the path. Encryption tunnels can protect along the path
    of communications.


    ## 3.5. Virtual Private Networks


    Virtual Private Networks (VPN) provide encrypted tunnels between computers or
    networks of computers across all ports. With a VPN in place, all network traffic
    from the client is forwarded to the server through the tunnel. This means that
    the client is logically on the same network as the server it is connected via.
    The VPNs are very common and simple to use and setup.


    ## 3.6. Secure Shell


    Secure Shell (SSH) is a powerful network protocol used to communicate with other
    system over a secure channel. The transmissions over SSH are encrypted and protected
    from interception. Cryptographic keys can also be utilized to provide a better
    authentication method over traditional usernames and passwords.


    SSH is very easy to activate. By simply starting the sshd service, the system
    will begin to accept connections and allow access to the system when a correct
    username and password is provided during the connection process. The standard
    TCP port for SSH is 22, however this can be changed by modifying the configuration
    file /etc/sshd_config and restarting the service. This file also contains other
    configuration options for SSH.


    Secure Shell (SSH) also provides encrypted tunnels between computers but only
    using a single port. Port forwarding can be done over an SSH tunnel and traffic
    will be encrypted as it passes over that tunnel but port forwarding is not as
    fluid as a VPN.


    ## 3.7. LUKS Disk Encryption


    Linux Unified Key Setup-on-disk (or LUKS) allows you to encrypt partitions on
    Linux computer. This is particularly important when it comes to mobile computers
    and removable media. LUKS allows multiple user keys to decrypt a master key which
    is used for the bulk encryption of the partition.


    ### 3.7.1. LUKS Implementation in Fedora


    Fedora 9, and utilizes LUKS to perform file encryption. By default, the option
    to encrypt the file system is unchecked during the installation. If you select
    the option to encrypt your hard drive, you will be prompted for a passphrase that
    will be asked every time you boot the computer. The passphrase "unlocks" the bulk
    encryption key which is used to decrypt your partition. If you choose to modify
    the default partition table which partitions you want to encrypt. This is set
    in the partition table settings.


    Fedora''s default implementation of LUKS is AES 128 with a SHA256 hashing cipher.
    Ciphers that are:


    > 1 http://www.redhatmagazine.com/2007/11/27/advanced-ssh-configuration-and-tunneling-we-dont-need-no-stinking-vpn-software


    - AES - Advanced Encryption Standard - FIPS PUB 197

    - Twofish (A 128-bit Block Cipher)

    - Serpent

    - cast5 - RFC 2144

    - cast6 - RFC 2612


    ### 3.7.2. Manually Encrypting Directories


    > Warning

    > this procedure will remove all data on the partition that you are encrypting.
    WILL lose all your information! Make sure you backup your data to an external
    source before beginning this procedure!


    ### you are running a version of Fedora to Fedora 9 and want to encrypt a partition,
    or you want to encrypt a partition after the installation of the current version
    of Fedora, the following directions are for you. The example demonstrates encrypting
    your home but any partition can be used.


    The following procedure will wipe all your existing data, so sure to have a test
    backup before you start. This also requires you to have a separate partition for
    /home (in my case that is /dev/VG00/LV_home). All the following must be done as
    root. Any of these steps failing means you must not continue until the step succeeds.


    ### 3.7.3. Step-by-Step Instructions


    - 1. enter runlevel 1: telinit

    - 2. unmount existing /home: umount /home

    - 3. if it fails fuser to find and kill processes hogging /home: fuser -mk /home

    - 4. verify /home is not mounted anymore: cat /proc/mounts | grep home

    - 5. Fill your partition with random data: dd if=/dev/urandom of=/dev/VG00/LV_home
    This process takes many hours to complete.


    > Important

    > The process, however, is imperative in order to have good protection against
    break-in attempts. Just let it run overnight.


    - 6. initialize your partition: cryptsetup --verbose --passphrase luksFormat /dev/VG00/LV_home

    - 7. open the newly encrypted device: cryptsetup luksopen /dev/VG00/LV_home home

    - 8. check it''s: ls -1 /dev/mapper | grep home

    - 9. create a filesystem: mkfs.ext3 /dev/mapper/home

    - 10. mount it visible: mount /dev/mapper/home /home

    - 11. check it''s visible: df -h | grep home

    - 12. add the following to /etc/crypttab: home /dev/VG00/LV_home none none

