    ## 2.5.5. Additional Resources


    More information about TCP Wrappers and xinetd is available from system documentation
    and the Internet.


    ### 2.5.5.1. Installed Wrappers Documentation


    The documentation on your system is a good place to look for additional configuration
    options for TCP Wrappers, xinetd, and access control.


    - /usr/doc/tcp_wrappers-<version>/ — This directory contains a README file that
    discusses how TCP Wrappers work and the hostname and address spoofing tricks are.

    - /usr/share/doc/xinetd-<version>/ — This directory contains a README that discusses
    aspects of access control and xinetd with various ideas for modifying service-specific
    configuration files in the /etc/xinetd/.

    - TCP Wrappers and xinetd-related pages — A number of man pages exist for the
    various applications and configuration files involved with TCP Wrappers and xinetd.
    The following are some of the most important pages:


    #### Server Applications

    - man xinetd — The page for xinetd.


    #### Configuration Files

    - man 5 hosts_access — The page for the TCP Wrappers hosts access control files.

    - man hosts_options — The page for the TCP Wrappers options fields.

    - man xinetd.conf — The man page listing xinetd configuration options.


