    # ## 2.2.3. Services Configuration Tool


    If unsure of the purpose for particular service, the **Services Configuration
    Tool** has a description field, illustrated in Figure 2.3, "Services Configuration
    Tool", that provides additional information.


    Checking which network services are available at start boot is only part of the
    story. You should also check which ports are open and listening. Refer to Section
    2.2.8, "Verifying Which Ports are Listening" for more information.


    # ## 2.1.5.3. Insecure Services


    Potentially any network service is insecure. This is why turning unused services
    is so important. Exploits for services are regularly revealed and patched, making
    it very important to regularly update packages associated with any network service.
    Refer to Section 1.5, "Security Updates" for more information.


    Some network protocols are inherently more insecure than others. These include
    any services that:


    +   - **Transmit Username and Passwords over a Network Unencrypted** — Many older
    protocols, as Telnet and FTP, do not encrypt the authentication session and should
    be avoided whenever possible.


    +   - **Transmit Sensitive Data Over a Network Unencrypted** — Many protocols
    transmit data over the network unencrypted. These protocols include Telnet, FTP,
    HTTP, and SMB. Many network file systems, such as NFS and SMB, is the user''s
    responsibility when using these protocols to limit what type of data is transmitted.


    Remote memory dump services, like `netdump`, transmit the contents of memory over
    the network unencrypted. Memory dumps can contain passwords or, even worse, database
    entries and other sensitive information.'
- md: '

    ## Chapter 2. Securing Your Network


    Other services like **finger** and **rwhod** reveal information about users of
    the system.


    Examples of inherently insecure services and shell programs (**login**, **rsh**,
    and **telnet**) should be avoided in favor of SSH. Refer to [Section 2.1.7, "Security
    Enhanced Communication Tools"]() for more information about **sshd**.


    FTP is not as inherently dangerous to the security of the remote shells, but FTP
    servers must be carefully configured and monitored to avoid problems. Refer to
    [Section 2.2.6, "Securing FTP"]() for more information about securing FTP.


    Services that should be carefully implemented and behind a firewall include:


    - **finger**

    - **authd** (this was called **ident** in previous Fedora releases.)

    - **netdup**

    - **netdump**

    - **nfs**

    - **rwhod**

    - **sendmail**

    - **smb** (Samba)

    - **bypasswdd**

    - **ypserv**

    - **ypxfrd**


    More information on securing network services is available in [Section 2.2, "Server
    Security"]().


    The next section discusses tools available to set up a simple firewall.


    ## 2.1.6. Personal Firewalls


    After the necessary network services are configured, it is important to implement
    a firewall.


    > **Important**

    > You should configure the necessary services and implement a firewall *before*
    connecting to the Internet or any other network that you do not trust.


    Firewalls prevent network packets from accessing the system''s network interface.
    If a request is made to a port that is blocked by a firewall, the request is ignored.
    If a service is listening on one of these blocked ports, it does not receive the
    packets and is effectively disabled. For this reason, care should be taken when
    configuring a firewall to block access to ports not in use, while not blocking
    access to ports used by configured services.


    For most users, the best tool for configuring a simple firewall is the graphical
    firewall configuration tool which ships with Fedora: the Firewall Configuration
    Tool (system-config-firewall). This tool creates iptables rules for a general-purpose
    firewall using a control panel interface.


    Refer to Section 2.2, "Basic Firewall Configuration" for more information about
    using this application and its available options.


    For advanced users and server administrators, manually configuring a firewall
    with iptables is a better option. Refer to Section 2.8, "Firewalls" for more information.
    Refer to Section 2.9, "IPTables" for a comprehensive guide to the iptables command.


    ## 2.1. Security Enhanced Communication Tools


    As the size and popularity of the Internet has grown, so has the threat of communication
    interception. Over the years, tools have been developed to encrypt communications
    as they are transferred over the network.


    Fedora ships with two basic tools that use high-level, public-key-cryptography-based
    encryption algorithms to protect information as it travels over the network.


    - OpenSSH — A free implementation of the SSH protocol for encrypting network communication.

    - Gnu Privacy Guard (GPG) — A free implementation of the PGP (Pretty Good Privacy)
    encryption for encrypting data.


    OpenSSH is a safer way to access a remote machine and replaces old, unencrypted
    services like telnet and rsh. OpenSSH includes a network service called sshd and
    command line client applications:


    - ssh — A secure remote console access client.

    - scp — a secure remote copy command.

    - sftp — a secure pseudo-ftp client that allows interactive file sessions.


    Refer to Section 3.6, "Security Shell" for more information regarding OpenSSH.


    > Important

    > Though sshd service is inherently secure, the service must be kept up-to-date
    to prevent security threats. Refer to Section 1.5, "Security Updates" for more
    information.


    GPG is one way to ensure email communication. It can be used both to email sensitive
    data over public networks and to protect sensitive data on hard drives.


    ## 2.2. Server Security


    When a system is used as a server on a public network, it becomes a target for
    attacks. Hardening the system and locking down services is of paramount importance
    for the system administrator.


    Before diving into specific issues, review the following general tips for enhancing
    server security:


    - Keep all services current, to protect against the latest threats.

    - Use secure protocols whenever possible.

    - Serve only one type of network service per machine whenever possible.

    - Monitor all servers carefully for suspicious activity.


    ## 2.2.1. Securing Services With TCP Wrappers and xinetd


    TCP Wrappers provide access control to a variety of network services. Most modern
    network services, such as SSH, Telnet, and FTP, make use of TCP Wrappers, which
    stand guard between an incoming request and the requested service.


    The benefits offered by TCP Wrappers are enhanced when used in conjunction with
    xinetd, a super server that provides additional access, logging, binding, redirection,
    and resource utilization control.


    > It is a good idea to use iptables firewall rules in conjunction with TCP Wrappers
    and xinetd to create redundancy within service access controls. Refer to Section
    2.8, "Firewalls" for more information about implementing firewalls with iptables
    commands.


    The following subsections assume a basic knowledge of each topic and focus on
    specific security options.


    ### 2.2.1.1. Enhancing Security With TCP Wrappers


    TCP Wrappers are capable of more than denying access to services. This section
    illustrates how they can be used to send connection banners, warn of attacks from
    particular hosts, and enhance logging functionality. Refer to the hosts_options
    man page for information about.


    ### 2.2.1.1.1. TCP Wrappers and Connection Banners


    Displaying a suitable banner when users connect is a good way to let attackers
    know that the system is vigilant. For this example, use the banner option. To
    implement this, create a file at /etc/banners/ that contains the following:


    ```

    Hello, %c

    Inappropriate use will result in your access being removed.

    ```


    The %c token supplies the hostname or IP address. For this banner to be displayed
    on incoming connections, add the following line to /etc/hosts.allow:


    ```

    vsftpd : ALL : banners/

    ```


    ### 2.2.1.1.2. TCP Wrappers and Attack Warnings


    If a particular host or network has been detected attacking the server, TCP Wrappers
    can be used to warn the administrator. In this example, a cracker from 206.182.68/24
    has been detected. Place the following line in /etc/hosts.deny:


    ```

    ALL : spawn /bin/date %d >> /var/log/intruder_alert

    ```


    The %d token supplies the name of the service that the attacker was trying to
    access. To allow the connection and log it, place the spawn directive in /etc/hosts.allow


    > Note Because the spawn directive executes any shell command, it is a good idea
    to create a special script to notify the administrator in the event that a particular
    client attempts to connect.


    ### 2.2.1.1.3. TCP Wrappers and Enhanced Logging


    If certain types of connections are of more concern than others, the log level
    can be elevated for service using the severity option. For this example, anyone
    attempting to connect to port 23 (the Telnet port) on a server is a hacker. To
    denote this, place an emerg flag in the log files instead of the default flag,
    info. To do this, place the following line in /etc/hosts.deny:


    ```

    in.telnet : ALL : severity emerg

    ```


    This uses the authpriv logging facility, but elevates the priority from the default
    value of info to emerg, which posts log messages directly to the console.


    ## 2.2.1.2. Enhancing Security with xinetd


    This section focuses on using xinetd to set a trap service and using it to control
    resource levels available to any xinetd service. Setting resource limits for services
    can help prevent Denial of Service (DoS) attacks. Refer to the pages for xinetd
    and xinetd.conf for a list of available options.


    ### 2.2.1.2.1. Setting a Trap


    One important feature of xinetd is its ability to add hosts to a global no_access
    list. Hosts on this list are denied subsequent connections to services managed
    by xinetd for a period or until xinetd is restarted. You can do this using the
    SENSOR attribute. This is an easy way to block hosts attempting to scan the ports
    on the server.


    The first step in setting up a SENSOR is to choose a service you do not plan on
    using. For this example, Telnet is used.

