    # 2.3.2.1. Troubleshooting


    If you have trouble getting your smart card to work, try using the following command
    to locate the source of the problem:


    pklogin_finder debug


    If you run the pklogin_finder tool in debug mode while an enrolled smart card
    is plugged in, it attempts to output information about the validity of certificates,
    and if it is successful in attempting to map a login ID from the certificates
    that are on the card.


    # 2.3.3. How Smart Card Enrollment Works


    Smart cards are said to be enrolled when they have received an appropriate certificate
    signed by a valid Certificate Authority (CA). This involves several steps, described
    below:


    +   1. The user inserts their smart card into the smart reader on their workstation.
    This event is recognized by the Enterprise Security Client (ESC).


    +   2. The enrollment page is displayed on the user''s desktop. The user completes
    the required details and the user''s system connects to the Token Processing System
    (TPS) and the CA.


    +   3. The TPS enrolls the smart card using a certificate signed by the CA.'
