    # Chapter 2. Securing Your Network


    Edit the file /etc/xinetd.d/telnet and change the flags line to:


    | flags = SENSOR |


    Add the following line:


    | deny_time = 30 |


    This denies any further connection attempts to that port by host for 30 minutes.
    Other acceptable values for the deny_time attribute is FOREVER, which keeps the
    ban in effect until xinetd is restarted, and NEVER, which allows the connection
    and logs it.


    Finally, the last line should read:


    | disable = no |


    This enables the trap itself.


    While SENSOR is a good way to detect and stop connections from undesirable hosts,
    it has two drawbacks:


    +   * It does not work against stealth scans.

    * An attacker who knows that a SENSOR is running can mount a Denial of Service
    attack against particular hosts by forging their IP addresses and connecting to
    the forbidden port.


    # 2.2.1.2.2. Controlling Server Resources


    Another important feature of xinetd is its ability to set resource limits for
    services under its control.


    It does this using the following directives:


    +   * cps = <number_of_connections> <wait_period> — Limits the rate of incoming
    connections. This directive takes two arguments:

    * <number_of_connections> — The number of connections per second to handle. If
    the rate of incoming connections is higher than this, the service is temporarily
    disabled. The default value is fifty (50).

    * <wait_period> — The number of seconds to wait before re-enabling the service
    after it has been disabled. The default interval is ten (10) seconds.

    * instances = <number_of_connections> — Specifies the total number of connections
    allowed to a service. This directive accepts either an integer value or UNLIMITED.

    * per_source = <number_of_connections> — Specifies the number of connections allowed
    to a service by each host. This directive accepts either an integer value or UNLIMITED.

    * rlimit_as = — Specifies the amount of memory address space the service can occupy
    in kilobytes or megabytes. This directive accepts either an integer value or UNLIMITED.

    * rlimit_cpu = <number_of_seconds> — Specifies the amount of time in seconds that
    a service may occupy the CPU. This directive accepts either an integer value or
    UNLIMITED.


    Using these directives can help prevent any single xinetd service from overwhelming
    the system, resulting in a denial of service.'
  - '[PAGE 52]


    # 2.2.2. Securing Portmap


    The portmap service is a dynamic port daemon for RPC services such as NIS and
    NFS. It has weak authentication mechanisms and has the ability to assign a wide
    range of ports for the services it controls. For these reasons, it is difficult
    to secure.


    > Note

    Securing portmap only affects NFSv2 and NFSv3 implementations, NFSv4 no longer
    requires it. If you plan to implement an NFSv2 or NFSv3 server, then portmap is
    required, and the following section applies.


    If running RPC services, follow these basic rules.


    # 2.2.2.1. Protect portmap With TCP Wrappers


    It is important to use TCP Wrappers to limit which networks or hosts have access
    to the portmap service since it has no built-in form of authentication.


    Further, use only IP addresses when limiting access to the service. Avoid using
    hostnames, as they can be forged by DNS poisoning and other methods.


    # 2.2.2.2. Protect portmap With iptables


    To restrict access to the portmap service, it is a good idea to add iptables rules
    to the server and restrict access to specific networks.


    Below are two example iptables commands. The first allows TCP connections to the
    port 111 (used by the portmap service) from the 192.168.0.0/24 network. The second
    allows TCP connections to the same port from the localhost. This is necessary
    for the sg_fam service used by Nautilus. All other packets are dropped.


    ```

    iptables -A INPUT -p tcp -s 192.168.0.0/24 --dport 111 -j DROP

    iptables -A INPUT -p tcp -s 127.0.0.1 --dport 111 -j ACCEPT

    ```


    To similarly limit UDP traffic, use the following command.


    ```

    iptables -A INPUT -p udp -s 192.168.0.0/24 --dport 111 -j DROP

    ```


    > Note

    Refer to Section 2.8, "Firewalls" for more information about implementing firewalls
    with iptables commands.


    # 2.2.3. Securing NIS


    Network Information Service (NIS) is an RPC service, called ypserv, which is used
    in conjunction with portmap and other related services to distribute maps of usernames,
    passwords, and other sensitive information to any computer claiming to be within
    its domain.


    An NIS server is comprised of several applications. They include the following:'
  - '[PAGE 53]


    # Chapter 2. Securing Your Network


    +   - /usr/sbin/rpc.yppasswd — Also called the yppasswd service, this daemon allows
    users to change their NIS passwords.


    +   - /usr/sbin/rpc.ypxfrd — Also called the ypxfrd service, this daemon is responsible
    for NIS maps transfers over the network.


    +   - /usr/sbin/yppush — This application propagates changed NIS databases to
    multiple NIS servers.


    +   - /usr/sbin/ypserv — This is the NIS daemon.


    NIS is somewhat insecure by today''s standards. It has no authentication mechanisms
    and transmits all of information over the network unencrypted, password hashes.
    As a result, extreme care must be taken when setting up a network that uses NIS.
    This is further complicated by the fact that the default configuration of NIS
    is inherently insecure.


    It is recommended that anyone planning to implement an NIS server first secure
    the portmap service as outlined in Section 2.2.2, "Securing Portmap", then address
    the following issues, such as network planning.


    # ## 2.2.3.1. Carefully Plan the Network


    Because NIS transmits sensitive information unencrypted over the network, it is
    important the service be run behind a firewall and on a secured and secure network.
    Whenever NIS information is transmitted over the network, it risks being intercepted.
    Careful network design can prevent severe security breaches.


    # ## 2.2.3.2. Use a Password-like NIS Domain Name and Hostname


    Any machine within NIS domain can use commands to extract information from the
    server without authentication, as long as the user knows the NIS server''s DNS
    hostname and NIS domain name.


    For instance, if someone connects a laptop into the network or breaks into the
    network from outside (and manages to spoof an IP address), the following command
    reveals the /etc/passwd map:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> password

    ```


    If this attacker is a root user, they can obtain the /etc/shadow file by typing
    the following command:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> shadow

    ```


    > Note If Kerberos is used, the /etc/shadow file is not stored within an NIS map.


    To make access to NIS maps even harder for an attacker, create a random string
    for the DNS hostname, such as 07hfawtgmgwhq.domain.com. Similarly, create a different
    randomized NIS domain name. This makes it much more difficult for an attacker
    to access the NIS server.'
  - '[PAGE 54]


    # 2.2.3.3. Edit the /var/yp/securenets File


    If the /var/yp/securenets file is blank or does not exist (as is the case after
    a default installation), NIS listens to all networks. One of the first things
    to do is to put netmask/network pairs in the file so ypserv only responds to requests
    from the appropriate network.


    Below is a sample entry from a /var/yp/securenets file:


    ```

    255.255.255.0    192.168.0.0

    ```


    > **Warning**

    Never start an NIS server for the first time without creating the /var/yp/securenets
    file.


    This technique does not provide protection from an IP spoofing attack, but it
    does at place limits on networks the NIS server services.


    # 2.2.3.4. Assign Static Ports and Use iptables Rules


    All of the services related to NIS can be assigned specific ports for rpc.yppasswd
    — the daemon that uses NIS to change their login passwords. Assigning ports to
    the other two NIS server daemons, rpc.ypxfrd and ypserv, allows for creation of
    firewall rules to further protect the NIS server from intruders.


    To do this, add the following lines to /etc/sysconfig/network:


    ```

    YPSERV_ARGS="-p 834" YPXFRD_ARGS="-p 835

    ```


    The following iptables rules can be used to enforce which network the NIS server
    listens to for ports:


    ```

    iptables -A INPUT -p ALL -s 192.168.0.0/24    --dport 834 -j DROP

    iptables -A INPUT -p ALL -s 192.168.0.0/24    --dport 835 -j DROP

    ```


    This means that the server only allows connections to ports 834 and 835 if the
    requests come from the 192.168.0.0/24 network, regardless of the protocol.


    > **Note**

    Refer to Section 2.8, "Firewalls" for more information about implementing firewalls
    with iptables commands.


    # 2.2.3.5. Use Kerberos Authentication


    One of the issues to consider when NIS is used for authentication is that whenever
    a user logs into a machine, a password hash from the /etc/shadow is sent over
    the network. If an intruder gains access to an NIS domain and sniffs network traffic,
    they can collect usernames and password hashes. With enough time, a password cracking
    program can guess weak passwords, and an attacker can gain access to a valid account
    on the network.'
