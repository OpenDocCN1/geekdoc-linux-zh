    # Chapter 2. Securing Your Network


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_43_0.png)


    Figure 2.2. Adding users to the “wheel” group.


    > Note

    The root user is part of the wheel group by default.


    ## 2.1.4.3.2. The sudo Command


    sudo command offers another approach to giving users administrative access. When
    trusted users precede an administrative command with sudo, they are prompted for
    their own password. Then, when they are authenticated and assuming that the command
    is permitted, the administrative command is executed as if they were the root
    user.


    The basic format of the sudo command is as follows:


    ```

    sudo <command>

    ```


    In the above example, <command> would be replaced by a command normally reserved
    for the root user, such as mount.


    > Important

    Users of the sudo command should take extra care to log out before walking away
    from their machines since sudoers can use the command again without being asked
    for a password within a five minute period. This setting can be altered via the
    configuration file, /etc/sudoers.


    ## Available Network Services


    The sudo command provides a comprehensive audit trail. Each successful authentication
    is logged to the file /var/log/messages and the command issued with the user''s
    name is logged to the file /var/log/secure.


    Another advantage of the sudo command is that an administrator can allow different
    users access to specific commands based on their needs.


    Administrators wanting to edit the sudo configuration file, /etc/sudoers, should
    use the visudo command.


    To give full administrative privileges, type visudo and add a line similar to
    the following in the user privilege specification section:


    ```

    juan ALL:(ALL) ALL

    ```


    This example shows that the user, juan, can use sudo from any host and execute
    any command.

    The example below illustrates the granularity possible when configuring sudo:


    ```

    %users localhost:/bin/shutdown -h now

    ```


    This example states that any user can use the command /sbin/shutdown -h as long
    as it is issued from the console.


    The page has a detailed listing of options for this file.


    ## 2.1.5. Available Network Services


    While user access to administrative controls is an important issue for system
    administrators within an organization, monitoring which network services are active
    is of paramount importance to anyone who operates and administers a Linux system.


    Many services serve as network services. If a network service is running on a
    machine, then a server application (called a daemon), is listening for connections
    on one or more network ports. Each of these servers should be treated as a potential
    avenue of attack.


    ## 2.1.5.1. Risks To Services


    Network services can pose many risks for Linux systems. Below is a list of some
    the primary issues:


    - Denial of Service Attacks (DoS) — By flooding a service with requests, a denial
    of service attack can render a system unusable as it tries to answer each request
    received.

    - Script Vulnerability Attacks — If a server is using scripts to execute server-side
    actions, as Web servers commonly do, a cracker can attack written scripts. These
    script vulnerability attacks can lead to a buffer overflow condition or allow
    the attacker to alter files on the system.

    - Buffer Overflow Attacks — Services that connect to ports numbered 0 through
    1023 must run as an administrative user. If the application has an exploitable
    buffer overflow, an attacker could gain access to the system as the user running
    the daemon. Because exploitable buffer overflows exist, crackers use automated
    tools to identify vulnerabilities, and once they have gained access, they use
    automated rootkits to maintain their access to the system.


    > Note The threat of buffer overflow vulnerabilities is mitigated in Fedora by
    ExecShield, an executable memory segmentation and protection technology supported
    by x86-compatible uni- and multi-processor kernels. ExecShield reduces the risk
    of buffer overflow by separating virtual memory into executable and non-executable
    segments. Any program code that tries to execute outside of the executable segment
    (such as malicious code injected from a buffer overflow exploit) triggers a segmentation
    fault and terminates.


    ExecShield also includes support for NoExecute (NX) technology on AMD64 platforms
    and execute Disable (XD) technology on Itanium and Intel® 64 systems. These technologies
    work in conjunction with ExecShield to prevent malicious code from running in
    the executable portion of virtual memory with a granularity of 4KB of executable
    code, lowering the risk of attack from stealthy buffer overflow exploits.


    > Important To limit exposure to attacks over the network, all services that are
    unused should be turned off.


    ## 2.1.5.2. Identifying and Configuring Services


    To ensure security, most network services installed in Fedora are turned off by
    default. There are, however, some exceptions:


    - cupsd — The default print server for Fedora.

    - lpd — An alternative print server.

    - xinetd — a super server that controls connections to a range of subordinate
    servers, such as gssftp and telnet.

    - sendmail — The SendMail Transport Agent (MTA) is enabled by default, but only
    listens for connections from the localhost.

    - sshd — The OpenSSH server, which is a secure replacement for Telnet.


    When determining whether to leave these services running, it is best to use common
    sense and err on the side of caution. For example, if a printer is not available,
    do not leave cupsd running. The same is true for portmap. If you do not mount
    NFSv3 volumes or NIS (the ybind service), then portmap should be disabled.


    ## Available Network Services


    ## Service Configuration


    | Program | Service | Description | Enable | Disable | Customize | Start | Stop
    | Restart |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | sshd | OpenSSH server daemon | The **sshd** service is started once, usually
    when the system is booted, runs in | | | | | | |

    | rpcbind | | This service is enabled, patched in background and wakes when needed.
    | | | | | | |

    | rsync | | This service is running. | | | | | | |

    | syslog | | | | | | | | |

    | auth | | | | | | | | |

    | sendmail | | | | | | | | |

    | troubleshoot | | | | | | | | |

    | smartd | | | | | | | | |

    | smoltd | | | | | | | | |

    | snmpd | | | | | | | | |

    | snmptrap | | | | | | | | |

    | sshd | | | | | | | | |

    | udev-post | | | | | | | | |

    | vsftpd | | | | | | | | |

    | winbind | | | | | | | | |

    | wpa_supplicant | | | | | | | | |

    | ybind | | | | | | | | |


    ## 2.2.3. Services Configuration Tool


    If unsure of the purpose for particular service, the **Services Configuration
    Tool** has a description field, illustrated in Figure 2.3, "Services Configuration
    Tool", that provides additional information.


    Checking which network services are available at start boot is only part of the
    story. You should also check which ports are open and listening. Refer to Section
    2.2.8, "Verifying Which Ports are Listening" for more information.


    ## 2.1.5.3. Insecure Services


    Potentially any network service is insecure. This is why turning unused services
    is so important. Exploits for services are regularly revealed and patched, making
    it very important to regularly update packages associated with any network service.
    Refer to Section 1.5, "Security Updates" for more information.


    Some network protocols are inherently more insecure than others. These include
    any services that:


    - **Transmit Username and Passwords over a Network Unencrypted** — Many older
    protocols, as Telnet and FTP, do not encrypt the authentication session and should
    be avoided whenever possible.

    - **Transmit Sensitive Data Over a Network Unencrypted** — Many protocols transmit
    data over the network unencrypted. These protocols include Telnet, FTP, HTTP,
    and SMB. Many network file systems, such as NFS and SMB, is the user''s responsibility
    when using these protocols to limit what type of data is transmitted.


    Remote memory dump services, like `netdump`, transmit the contents of memory over
    the network unencrypted. Memory dumps can contain passwords or, even worse, database
    entries and other sensitive information.

    '
