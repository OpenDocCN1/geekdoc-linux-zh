    ## 2.8.5.1. 后路由（Postrouting）和 IP 伪装（IP Masquerading）


    防火墙内部设备接受转发包允许 LAN 节点之间相互通信；它们仍然无法与互联网通信。


    为了让具有私 IP 地址的 LAN 节点与外部公共网络通信，需要配置防火墙进行 IP 伪装，这将 LAN 节点的请求伪装为防火墙外部设备的 IP 地址（在本例中为
    eth0）：


    ```

    [root@myServer ~] # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    此规则使用 NAT 数据包匹配表 (-t nat)，并为防火墙外部设备 (-o eth0) 指定了内置的 POSTROUTING 链 (-A POSTROUTING)。


    POSTROUTING 允许数据包在离开防火墙外部设备时被修改。


    指定 -j MASQUERADE 目标是将节点的私有 IP 地址映射到防火墙/网关的外部地址。


    ## 2.8.5.2. 预路由（Prerouting）


    如果您在内部网络中有一个想要从外部访问的服务器，可以使用 NAT 中 PREROUTING 链的 -j DNAT 来指定目的 IP 地址和端口，请求连接到您的内部服务的入站数据包可以转发到该处。


    例如，如果您想将入站的 HTTP 请求转发到位于 172.31.0.23 的专用 Apache HTTP 服务器，请使用以下命令：


    ```

    [root@myServer ~] # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j
    DNAT --to 172.31.0.23:80

    ```


    此规则指定 nat 使用内置的 PREROUTING 链将入站的 HTTP 请求专门转发到列出的目的 IP 地址 172.31.0.23。


    ## 第 2 章 保护您的网络


    注意

    如果您在 FORWARD 链中使用了默认 DROP 策略，则必须追加一条规则

    转发所有入站的 HTTP 请求，以便进行目的 NAT 路由。要实现这一点，请执行以下命令：


    ```bash

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 80 -d 172.31.0.23
    -j ACCEPT

    ```

    此规则将来自防火墙的所有入站 HTTP 请求转发到预设的目的地：防火墙后的 Apache 服务器。


    ## 2.8.5.3. DMZ 和 IPTables


    您可以创建 iptables 将流量路由到非军事化区（DMZ）中的某些机器，例如专用的 HTTP 或 FTP 服务器。DMZ 是一个特殊的本地子网，专门用于在公共载体（如互联网）上提供服务。


    例如，设置一条规则将入站 HTTP 请求路由到位于 10.0.4.2 的专用 HTTP 服务器（位于 LAN 的 162.168.1/24 范围之外），NAT
    使用 PREROUTING 表将数据包转发到相应的目的地：


    ```

    root@myServer ~ # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j DNAT
    --to destination 10.0.4.2:80

    ```


    通过此命令，来自 LAN 到 80 端口的所有连接都将路由到与内部网络其他部分隔离的网络上的 HTTP 服务器。这种形式的网络分可以比允许 HTTP 连接到网络上的机器更安全。


    如果 HTTP 服务器配置为接受安全连接，则必须同样转发 443 端口。


    ## 2.8.6. 恶意软件和伪造 IP 地址


    可以创建更多规则来控制对 LAN 内部子网甚至特定节点的访问。您还可以限制某些应用程序或程序（如木马、蠕虫和其他客户端/服务器节点）与其服务器通信。


    例如，木马会扫描网络中端口 31337 到 31340 服务（在破解术语中称为“精英端口”）。


    由于没有合法的服务通过这些非标准端口进行通信，拦截这些端口可以减少您的网络中可能受感染的节点独立与其远程主服务器通信的机会。


    以下规则丢弃所有使用端口 31337 端口的 TCP 流量：


    ```

    root@myServer ~ # iptables -A OUTPUT -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    ```


    您还可以阻止尝试通过伪造 IP 地址范围进行渗透的外部连接。


    例如，如果您在 FORWARD 链中使用了默认 DROP 策略，则必须追加规则

    转发所有入站 HTTP 请求以便进行目的 NAT 路由。要实现这一点，执行以下命令：


    ```bash

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 80 -d 172.31.0.23
    -j ACCEPT

    ```

    此规则将来自防火墙的所有入站 HTTP 请求转发到预设的目的：防火墙后的 Apache 服务器。


    ## 2.8.5.3. DMZ 和 IPTables


    您可以创建 iptables 将流量路由到非军事化区（DMZ）中的某些机器，例如专用的 HTTP 或 FTP 服务器。DMZ 是一个专门用于公共载体（如互联网）提供服务的特殊本地子网。


    例如，设置一条规则将入站 HTTP 请求路由到位于 10.0.4.2 的专用 HTTP 服务器（位于 LAN 的 162.168.1/24 范围之外），NAT
    使用 PREROUTING 表将数据包转发到相应的目的地：


    ```

    root@myServer ~ # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j DNAT
    --to destination 10.0.4.2:80

    ```


    通过此命令，来自 LAN 到 80 端口的所有连接都路由到与内部网络其他部分隔离的网络上的 HTTP 服务器。这种形式的网络分可以比允许 HTTP 连接到网络上的机器更安全。


    如果 HTTP 服务器配置为接受安全连接，则必须转发 443 端口。


    ## 2.8.6. 恶意软件和伪造 IP 地址


    可以创建更多规则来控制对 LAN 内部子网甚至特定节点的访问。您还可以限制某些应用程序或程序（如木马、蠕虫和其他客户端/服务器节点）与其服务器通信。


    例如，木马会扫描网络中端口 31337 到 31340 服务（在破解术语中称为“精英端口”）。


    由于没有合法的服务通过这些非标准端口进行通信，拦截这些端口可以减少您的网络中可能受感染的节点独立与其远程主服务器的机会。


    以下规则丢弃所有使用端口 31337 端口的 TCP 流量：


    ```

    root@myServer ~ # iptables -A OUTPUT -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 31337 --sport 31337
    -j DROP

    ```


    您还可以阻止尝试通过伪造 IP 地址范围进行渗透的外部连接。


    例如，如果您在 FORWARD 链中使用了默认 DROP 策略，则必须追加规则

    转发所有入站 HTTP 请求以便进行目的 NAT 路由。要实现这一点，执行以下命令：


    ```bash

    root@myServer ~ # iptables -A FORWARD -i eth0 -p tcp --dport 80 -d 172.31.0.23
    -j ACCEPT

    ```

    此规则将来自防火墙的所有入站 HTTP 请求转发到预设的目的：防火墙后的 Apache 服务器。


    ## 2.8.7. IPTables 和连接跟踪


    您可以使用 state 模块根据连接状态来检查并过滤数据包。支持以下状态：


    - **NEW**: 数据包属于一个新连接。

    - **ESTABLISHED**: 数据包属于一个已建立连接。

    - **RELATED**: 数据包与现有连接相关。

    - **INVALID**: 数据包不属于任何已知连接。


    例如，仅允许已建立和相关的流量：


    ```

    [root@myServer ~] # iptables -A INPUT -m state --ESTABLISHED,RELATED -j ACCEPT

    ```


    ## 2.8.8. IPv6


    下一代互联网协议（IPv6）的引入扩展了 32 位地址限制。Fedora 使用 ip6tables 命令支持 IPv6。在 Fedora 中，这两个服务都已启用。


    ## 2.8.9. 更多资源


    防火墙和 Linux Netfilter 子系统有几个方面在本章中未涵盖。更多信息请参考以下资源：


    ### 2.8.9.1. 安装的防火墙文档


    - 参考第 2.9 节“IPTables”，获取有关 iptables 命令的更多详细信息以及许多选项的定义。

    - iptables 手册包含各种选项的要概述。


    ### 2.8.9.2. 有用的防火墙网站


    - http://www.netfilter.org/ — Netfilter 官方首页

    - http://www.ldp.org/ — Linux 文档项目包含多个与防火墙创建和管理相关的有用指南。

    - http://www.iana.org/assignments/port-numbers — 由互联网分配数字机构分配的注册和常用服务端口官方列表。


    ### 2.8.9.3. 相关文档


    - Red Hat Linux Firewalls, Bill McCarthy; Red Hat Press — 使用源数据包过滤技术（Netfilter
    和 iptables）构建网络和服务器的全面参考。涵盖了分析防火墙日志、开发防火墙规则以及使用各种图形工具自定义防火墙的主题。

    - Linux Firewalls, Robert Ziegler; New Riders Press — 包含了大量关于使用 2.2 链以及 Netfilter
    和 iptables 构建防火墙的信息。还涵盖了远程访问问题和入侵检测系统等其他安全主题。


    ## 2.9. IPTables


    Fedora 包含了用于网络数据包过滤的高级工具——即控制数据包进入、离开和通过内核内网络堆栈的过程。2.4 之前的内核版本依赖 ipchains 进行数据包过滤，并在过滤过程的每个步骤应用规则列表。2.4
    内核引入了 iptables（也称为 netfilter），它与 ipchains 相似但大大扩展了过滤网络数据包的范围和控制能力。


