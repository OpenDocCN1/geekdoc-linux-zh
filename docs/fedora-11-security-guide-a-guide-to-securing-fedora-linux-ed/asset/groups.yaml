    # 2.2.4.4. NFS Firewall Configuration


    The ports used for NFS are assigned dynamically by rpcbind, which can cause problems
    when creating firewall rules. To simplify this process, use the /etc/sysconfig/nfs
    file to specify which ports are to be used:


    +   * MOUNT_PORT — TCP and UDP port for mountd (rpc.mount)

    * STAT_PORT — TCP and UDP port for status (rpc.statd)

    * LOCKD_TCPPORT — TCP port for nlockmgr (rpc.lockd)

    * LOCKD_UDPPORT — UDP port for nlockmgr (rpc.lockd)


    Port numbers specified must not be used by any other service. Configure your firewall
    to allow the port numbers specified, as well as TCP and UDP port 2049 (NFS).


    Run the rpcinfo -p command on the NFS server to see which ports and RPC programs
    are used.


    # 2.2.5. Securing the Apache HTTP Server


    Apache HTTP Server is one of the most stable and secure services that ships with
    Fedora. A large number of options and techniques are available to secure the Apache
    HTTP Server — numerous to delve into deeply. The following section explains good
    practices when running the Apache HTTP Server.


    Always verify that any scripts running on the system work as intended before putting
    them into production. Also, ensure that only the root user has permissions to
    any directory containing scripts or CGIs. To do this, run the following commands
    as the root user:


    +   1. chown <directory_name>

    2. chmod 755 <directory_name>


    System administrators should be careful when using the following configuration
    options (configured in /etc/httpd/conf/httpd.conf).


    FollowSymLinks

    This directive is enabled by default, so be to use caution when creating symbolic
    links to the document root of the Web server. For instance, it is a bad idea to
    provide a symbolic link to /.


    Indexes


    This directive is enabled by default, but may not be desirable. To prevent visitors
    from browsing the files on the server, remove this directive.


    UserDir


    The UserDir directive is disabled by default because it can confirm the presence
    of a user account on the system. To enable user directory browsing on the server,
    use the following directives:


    ```

    UserDir enabled

    UserDir disabled root

    ```'
