    # 2.8.2.4. Other Ports


    The Firewall Configuration Tool includes an Other ports section for specifying
    custom IP ports being trusted by iptables. For example, allow IRC and Internet
    printing protocol (IPP) to pass through the firewall, add that to the following
    Other ports section:


    ```

    194:tcp, 631:tcp

    ```


    # 2.8.2.5. Saving the Settings


    Click OK to save the changes and enable or disable the firewall. If Enable firewall
    was selected, the options are translated to iptables commands and written to the
    /etc/sysconfig/iptables file. The iptables service is also started so that the
    firewall is activated immediately after saving the options. If Disabled firewall
    was selected, the /etc/sysconfig/iptables file is removed and the iptables service
    is stopped immediately.


    The selected options are also written to the /etc/sysconfig/system-config-securitylevel
    file so that the settings can be restored the next time the application is started.
    Do not edit this file by hand.


    Even though the firewall is activated immediately, the iptables service is not
    configured to start automatically at boot time. Refer to Section 2.8.2.6, "Activating
    the IPTables Service" for more information.


    # 2.8.2.6. Activating the IPTables Service


    The rules are only active if the iptables service is running. To manually start
    the service, use the following command:


    ```

    [root@myServer] # service iptables restart

    ```


    To ensure that iptables starts when the system is booted, use the following command:


    ```

    [root@myServer] # chkconfig --level 345 iptables on

    ```


    The iptchains is not included in Fedora. However, if iptchains is installed (for
    example, an upgrade was performed and the system has iptables previously), the
    iptchains and iptables services should not be activated simultaneously. To make
    the iptchains service is disabled and configured not to start at boot time, use
    the following two commands:


    ```

    [root@myServer] # service iptchains stop

    [root@myServer] # chkconfig --level 345 iptchains off

    ```


    # 2.8.3. Using IPTables


    The first step in using iptables is to start the iptables service. Use the following
    command to start the iptables service:


    ```

    [root@myServer] # service iptables restart

    ```'
