    # 2.4.6. PAM and Administrative Credential Caching


    A number of graphical administrative tools in Fedora provides users with elevated
    privileges for up to five minutes. It is important to understand how this mechanism
    works, because a user who walks away from a terminal while pam_timestamp.so is
    in effect leaves the machine open to anyone with physical access to the console.


    In the PAM timestamp scheme, the graphical administration application prompts
    the user for the root password when it is launched. When the user has been authenticated,
    the pam_timestamp.so creates a timestamp file. By default, this is created in
    the /var/run/sudo/ directory. If the timestamp file already exists, graphical
    administrative programs do not prompt for a password. Instead, the pam_timestamp.so
    module freshens the timestamp file, reserving an extra five minutes of unchallenged
    administrative access for the user.'
