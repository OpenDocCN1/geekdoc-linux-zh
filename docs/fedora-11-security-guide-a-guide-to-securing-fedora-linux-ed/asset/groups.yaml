    \ 的 man 页面。\n\n### 2.5.2.2.4. 扩展 (Expansions)\n\n扩展与 **spawn** 和 **twist** 指令配合使用时，提供有关客户端、服务器和进程的信息。\n\
    \n以下是支持的扩展列表：\n\n- **%a** 返回客户端的 IP 地址。\n\n- **%A** 返回服务器的 IP 地址。\n\n- **%c**\
    \ 返回各种客户端信息，例如用户名和主机名，或用户名和 IP 地址。\n\n- **%d** 返回守护进程名称。\n\n- **%h** 返回客户端的主机名（如果主机名不可用则返回\
    \ IP 地址）。\n\n- **%H** 返回服务器的主机名（如果主机名不可用则返回 IP 地址）。\n\n- **%n** 返回客户端的主机名。如果不可用，打印\
    \ **unknown**。如果客户端的主机名和主机地址不匹配，打印 **paranoid**。\n\n- **%N** 返回服务器的主机名。如果不可用，打印\
    \ **unknown**。如果服务器的主机名和主机地址不匹配，打印 **paranoid**。\n\n- **%p** 返回守护进程的进程 ID (PID)。\n\
    \n- **%s** 返回各种服务器信息，例如守护进程以及服务器的主机或 IP 地址。\n\n- **%u** 返回客户端的用户名。如果不可用，打印 **unknown**。\n\
    \n下面的示例规则将扩展与 **spawn** 命令结合，在自定义日志文件中识别客户端主机。\n\n当来自 example.com 域名的主机尝试连接到 SSH\
    \ 守护进程 (sshd) 时，执行 **echo** 命令记录该尝试（包括客户端主机名，通过使用 **%h** 扩展），写入特殊文件：\n\n```\n\
    sshd .example.com \\\n  : spawn /bin/echo `/bin/date` access denied to %h>>/var/log/sshd.log\
    \ \\\n  : deny\n```\n\n同样，扩展也可以用于向客户端返回个性化消息。在下面的示例中，尝试从 example.com 域名访问 FTP\
    \ 服务的客户端将被告知它们已被服务器封禁：\n\n```\nvsftpd .example.com \\\n  : twist /bin/echo \"\
    421 %h has been banned from this server!\"\n```\n\n有关可用扩展完整列表以及额外的访问控制选项，请参考 hosts_access\
    \ 主页第 5 部分（man 5 hosts_access）以及 hosts_options 的主页。\n\n有关 TCP Wrappers 的更多信息，请参考第\
    \ 2.5.5 节“附加资源”。\n\n## 2.5.3. xinetd\n\nxinetd 守护进程是一个 TCP 的超级服务，用于控制对流行网络服务（FTP、IMAP\
    \ 和 Telnet）子集的访问。它还为访问控制、增强日志记录、绑定、重定向和资源利用控制提供了特定服务的配置选项。\n\n当客户端尝试连接到 xinetd\
    \ 控制的网络服务时，超级服务会接收请求并检查任何 TCP Wrappers 访问控制规则。\n\n如果允许访问，xinetd 将验证该连接在其针对该服务的规则下是允许的。它还会检查该服务是否可以分配更多资源，以及它是否违反任何定义的规则。\n\
    \n如果满足所有条件（即允许访问该服务：该服务未达到资源限制；且该服务未违反任何定义的规则），xinetd 将启动请求服务的实例并将连接控制权交给该实例。在连接建立后，xinetd\
    \ 不再参与客户端与服务器之间的通信。\n\n## 2.5.4. xinetd 配置文件\n\nxinetd 的配置文件如下：\n\n- /etc/xinetd.conf\
    \ — 全局 xinetd 配置文件。\n- /etc/xinetd.d/ — 包含特定服务文件的目录。\n\n### 2.5.4.1. /etc/xinetd.conf\
    \ 文件\n\n/etc/xinetd.conf 文件包含影响 xinetd 控制的每个服务的通用配置设置。它在 xinetd 服务首次启动时被读取，因此若要使配置更改生效，您需要重启\
    \ xinetd 服务。以下是一个 /etc/xinetd.conf 示例：\n\n```\ndefaults {\n  instances = 60\n\
    \  log_type = SYSLOG authpriv\n  log_on_success = HOST PID\n  log_on_failure =\
    \ HOST\n  cps = 25 30\n}\nincludeir /etc/xinetd.d\n```\n\n这些行控制 xinetd 的以下方面：\n\
    \n- **instances** — 指定 xinetd 可以处理的最大并发请求数。\n- **log_type** — 配置 xinetd 使用 **authpriv**\
    \ 日志设施，它会将日志条目写入 **/var/log/secure** 文件。添加 **FILE /var/log/xinetdlog** 指令将在 **/var/log/**\
    \ 下创建一个名为 **xinetdlog** 的自定义日志文件。\n- **log_on_success** — 配置 xinetd 记录成功的连接尝试。默认情况下，记录远程主机的\
    \ IP 地址和处理请求的服务进程 ID。\n- **log_on_failure** — 配置 xinetd 记录失败的连接尝试。\n- **cps**\
    \ — 指定每秒连接数。\n- **include /etc/xinetd.d** — 包含特定服务的配置文件。\n\n## 第 2 章. 网络安全\n\n\
    （注：根据 OCR 输入，提供的文本似乎有重复或重叠，此处保持了所提供的逻辑流。）\n\n"
