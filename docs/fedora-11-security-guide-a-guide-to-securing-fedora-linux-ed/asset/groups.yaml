    # 2.5.2.1.2. Patterns


    Patterns can be used in the client field of access rules to more precisely specify
    groups of client hosts.


    The following is a list of common patterns for entries in the client field:


    +   - Hostname beginning with a period (.) — Placing a period at the beginning
    of a hostnames all hosts sharing the listed components of the name. The following
    example applies to any host within the example.com domain


    ```

    ALL \: .example.com

    ```


    +   - IP address ending with a period () — Placing a period at the end of an IP
    address matches all hosts sharing the initial numerical groups of an IP address.
    The following example applies to any host within the 192.168.x.x network:


    ```

    ALL \: 192.168.x

    ```


    +   - IP address/netmask — Netmask expressions can also be used as a pattern to
    control access to a particular group of IP addresses. The following example applies
    to any host with an address range of 192.168.0.0 through 192.168.1.255:


    ```

    ALL \: 192.168.0.0/255.255.254.0

    ```


    > Important: Working in the IPv4 address space, the address/prefix length (prefixlen)
    pair declarations (CIDR notation) are not supported. Only IPv6 rules can use this
    format.


    +   - IPv6 address/prefix len — [net]/prefix len can also be used as a pattern
    to control access to a particular group of IPv6 addresses. The following example
    would apply to any host with an address range of 3ffe0:505:2:1::through 3ffe0:505:2:1:ffff:ffff:ffff:ffff:


    ```

    ALL \: [3ffe:505:2:1::]/64

    ```


    +   - The asterisk (*) — Asterisks can be used to match groups of hostnames or
    IP addresses, as long as they are not mixed in a client list containing other
    types of patterns. The following example would apply to any host within the example.com
    domain:


    ```

    ALL \: *.example.com

    ```


    +   - The slash (/) If a client list begins with a slash, it is treated as a file
    name. This is useful if specifying large numbers of hosts are necessary. The following
    example refers TCP Wrappers to the /etc/telnet.hosts file for all Telnet connections:


    ```

    in.telnetd : /etc/telnet.hosts

    ```


    Other, lesser used, patterns are also accepted by TCP Wrappers. Refer to the hosts_access
    man 5 for more information.'
