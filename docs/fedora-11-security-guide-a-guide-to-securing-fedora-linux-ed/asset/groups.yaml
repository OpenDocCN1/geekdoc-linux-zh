    ## Chapter 2. Securing Your Network


    ### 2.1.4.1. Allowing Root Access


    If the users within an organization are trusted and computer-literate, allowing
    them root access may not be an issue. Allowing root access by users means minor
    activities, like adding devices or configuring network interfaces, can be handled
    by the individual users, leaving system administrators to deal with network security
    and other important issues.


    On the other hand, giving root access to individual users can lead to the following
    issues:


    - *Machine Misconfiguration — Users with root access can misconfigure machines
    and require assistance to resolve issues. Even worse, they might open up security
    holes without knowing it.

    - *Running Insecure Services* — Users with root access might run insecure servers
    on their machine, as FTP or Telnet, potentially putting usernames and passwords
    at risk. These services transmit this information over the network in plain text.

    - *Running Email Attachments As Root* — Although rare, viruses that affect Linux
    do exist. The only time they are a threat, however, they are run by the root user.


    ### 2.1.4.2. Disallowing Root Access


    If an administrator is uncomfortable allowing users to log in for these or other
    reasons, the root password should be kept, and access to runlevel one or single
    user mode should be disabled through boot loader password protection (refer to
    Section 2.1.2.2, "Boot Loader Passwords" for more information on this topic).


    Table 2.1, "Methods of Disallowing the Root Account" describes what an administrator
    can ensure that root users are disallowed:


    | Method | Description | Effects | Does Not Affect |

    | :--- | :--- | :--- | :--- |

    | Changing the root shell. | Edit /etc/passwd file and change the shell from /bin/bash
    to /sbin/nologin. | Prevents access to root shell and logs any attempts. The following
    programs are prevented from accessing the root account: **login**, **gdm**, **kdm**,
    **xdm**, **su**, **ssh**, **scp**, **sftp** | Programs that do not require a shell,
    such as FTP clients, mail clients, and many other programs. | The following programs
    are not prevented from accessing the root account: **sudo**, **FTP clients**,
    **Email clients** |

    | Disabling root access via any console device (tty). | An empty /etc/passwd login
    on any devices attached to the computer. | Prevents access to the root account
    via the console or the network. The following programs are prevented from accessing
    the root account: **login**, **kdm** | Programs that do not log in root, but perform
    administrative tasks through setuid or other mechanisms. The following programs
    are not prevented from accessing the root account: **su** |


    ## Administrative Controls


    | Method | Description | Does Not Affect |

    | :--- | :--- | :--- |

    | Disabling root SSH logins. | Edit the /etc/ssh/sshd_config file and set the
    PermitLogin parameter to no. | Prevents root access via the OpenSSH suite of tools.
    The following programs are prevented from accessing the root account: ssh, scp,
    sftp | This only prevents access to the OpenSSH suite of tools. |

    | Use PAM to limit root access to services. | Edit the file for the target service
    in the /etc/pam.d/. Make sure the pam_listfile.so is required for authentication.
    | Prevents root access to network services that are PAM aware. The following services
    are prevented from accessing the root account: FTP clients, Email clients, login,
    gdm, kdm, xdm, ssh, sftp | Any PAM aware services |


    Refer to Section 2.1.4.2.4, "Disabling Root Using PAM" for details.


    Table 2.1. Methods of Disabling the Root Account


    ### 2.1.4.2.1. Disabling the Root Shell


    To prevent users from logging in directly as root, the system administrator can
    set the root account''s shell to /sbin/nologin in the /etc/passwd file. This prevents
    access to the root account through commands that require a shell, such as the
    sudo and the ssh commands.


    > Programs that do not require access to the shell, such as email clients or some
    commands, can still access the root account.


    ### 2.1.4.2.2. Disabling Root Logins


    To further limit access to the root account, administrators can disable root logins
    at the console by editing the /etc/security file. This file lists devices the
    root user is allowed to log in. If the file does not exist, the root user can
    log in through any communication device on the system, whether via the console
    or a raw network interface. This is dangerous, because a user can log in to his
    machine as root via Telnet, which transmits the password in plain text over the
    network. By default, Fedora''s /etc/security only allows the root user to log
    in at the console physically attached to the machine. To prevent root from logging
    in, remove the contents of this file by typing the command:


    ```bash

    echo > /etc/security

    ```


    > Warning

    A blank /etc/security file does not prevent the root user from logging in remotely
    using the OpenSSH suite of tools because the console is not opened until after
    authentication.


    ### 2.1.4.2.3. Disabling Root SSH Logins


    Root logins via the SSH protocol are disabled by default in Fedora; however, if
    this option is enabled, it can be disabled again by editing the SSH daemon''s
    configuration file (/etc/ssh/sshd_config). Change the line that:


    ```

    PermitRootLogin yes

    ```


    to read as:


    ```

    PermitRootLogin no

    ```


    For these changes to take effect, the SSH daemon must be restarted. This can be
    done via the following command:


    ```bash

    kill -HUP `cat /var/run/sshd.pid`

    ```


    ### 2.1.4.2.4. Disabling Root Using PAM


    PAM, through the /lib/security/pam_listfile.so module, allows great flexibility
    in denying specific accounts. The administrator can use this module to reference
    a list of users who are not allowed to log in. Below is an example of how to use
    the vsftpd FTP server configuration (the \ character at the end of the first line
    in the following example is not necessary if the directive is on one line):


    ```bash

    auth required /lib/security/pam_listfile.so item=user \ sense=deny file=/etc/vsftpd.ftusers
    onerr=success

    ```


    This instructs PAM to consult the /etc/vsftpd.ftusers file and deny access to
    the service for any listed user. The administrator can change the name of this
    file, and can keep separate lists for each service or use one central list to
    access multiple services.


    If you want to deny access to multiple services, a similar line can be added to
    the PAM configuration files, such as /etc/pam.d/pop for mail clients, /etc/pam.d/imap
    for mail clients, or /etc/pam.d/ssh for SSH clients.


    For more information about PAM, refer to Section 2.4, "Pluggable Authentication
    Modules (PAM)".


    ### 2.1.4.3. Limiting Root Access


    Rather than completely denying access to the root user, the administrator may
    want to allow access via programs such as su or sudo.


    #### 2.1.4.3.1. The su Command


    When a user executes the su command, they are prompted for the root password and,
    after authentication, are given a root shell.


    Once logged via the su command, the user is the root user and has administrative
    access to the system. In addition, once a user becomes root, it is possible for
    them to use the su command to change any user on the system without being prompted
    for a password.


    Because this program is powerful, administrators within an organization may wish
    to limit who has access to the command. One of the simplest ways to do this is
    to add users to the special administrative group called wheel. To do this, type
    the following command as root:


    ```bash

    usermod -G wheel <username>

    ```


    In the previous command, replace <username> with the username you want to add
    to the wheel group.


    You can also use the User Manager to modify group memberships, as follows. Note:
    you need Administrator privileges to perform this procedure.


    1. Click the System menu on the Panel, point to Administration and then click
    Users and Groups to display the User Manager. Alternatively, type the command
    system-config-users in a shell prompt.

    2. Click the Users tab, and select the required user in the list of users.

    3. Click the Properties tab on the toolbar to display the User Properties dialog
    box (or choose Properties on the File).

    4. Click the Groups tab, select the check box for the wheel group, and then click
    OK. Refer to Figure 2.2, "Adding users to the "wheel" group."


    Open the PAM configuration file for su (/etc/pam.d/su) in a text editor and remove
    the comment # from the following line:


    ```

    auth required /lib/security/$ISA/pam_wheel.so su use_uid

    ```


    This change means that only members of the administrative group wheel can use
    this program. This access is still subject to the restrictions imposed by SELinux,
    if it is enabled.

