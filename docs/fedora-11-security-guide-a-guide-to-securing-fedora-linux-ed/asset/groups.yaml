    # 2.7. Virtual Private Networks (VPNs)


    Organizations with satellite offices connect to each other with dedicated lines
    for efficiency and protection of sensitive data in transit. For many businesses
    use frame relay or Asynchronous Transfer Mode (ATM) lines as an end-to-end network
    solution to link one office with others. This can be an expensive proposition,
    for small to medium sized businesses (SMBs) that want to expand without paying
    the high costs associated with enterprise-level, digital circuits.


    To address this need, Virtual Private Networks (VPNs) were developed. Following
    the same functional principles as circuits, VPNs allow for secure digital communication
    between two parties (or networks), creating a Wide Area Network (WAN) from existing
    Local Area Networks (LANs). Where it differs from frame relay or ATM is in its
    transport. VPNs transport over IP datagrams as the transport layer, making a secure
    tunnel to the Internet to an intended destination. Most free software VPN implementations
    operate open standard encryption methods to further mask data in transit.


    Some organizations employ hardware VPN to augment security, while others use software
    or protocol-based implementations. Several vendors provide VPN solutions, such
    as Cisco, Nortel, IBM, and Checkpoint. There is a free software-based VPN solution
    for Linux called FreeSWan that utilizes a standardized Internet Protocol Security
    (IPsec) implementation. These VPN solutions, irrespective of whether they are
    hardware or software based, act as specialized routers that exist the IP connection
    from one office to another.


    # 2.7.1 How Does a VPN Work?


    When a packet is transmitted from a client, it sends it through the VPN router
    or gateway, which adds an Authentication Header (AH) for routing and authentication.
    The data is then encrypted and finally, wrapped with an Encapsulating Security
    Payload (ESP). This latter constitutes the description and handling instructions.


    The receiving VPN router strips the header information, decrypts the data, and
    routes it to its intended destination (either a workstation or node on the network).
    Using a network-to-network connection, the receiving node on the local network
    receives the packets already decrypted and ready for processing. The encryption/decryption
    process in a network-to-network VPN connection is transparent to local node.'
  - '[PAGE 108]


    With such heightened level of security, an attacker must not only intercept a
    packet, decrypt the packet as well. Intruders who employ a man-in-the-middle attack
    between a server and client must have access to at least one of the private keys
    for authenticating sessions. Because they employ several layers of authentication
    and encryption, VPNs are a secure and effective means of connecting multiple nodes
    to an un Shift intranet.


    # 2.7. VPNs and Fedora


    Fedora provides various options in terms of implementing a software solution to
    securely connect to a WAN. Internet Protocol Security (IPsec) is the supported
    VPN implementation for Fedora, and sufficiently addresses the usability needs
    of organizations with branch offices or remote users.


    # 2.7.3. IPsec


    Fedora supports IPsec for connecting hosts and networks to each other using a
    secure tunnel on a common network such as the Internet. It can be implemented
    using a host-to-host (one computer workstation to another) or network-to-network
    (one LAN/WAN to another) configuration.


    The IPsec implementation in Fedora uses Internet Key Exchange (IKE), a protocol
    implemented by the Internet Engineering Task Force (IETF), used for mutual authentication
    and security associations between connecting systems.


    # 2.7.4. Creating an IPsec Connection


    An IPsec connection splits into two phases. In Phase 1, an IPsec node initializes
    the connection with the remote node or network. The remote node or network requests
    the node credentials and both parties negotiate the authentication method for
    the connection.


    On Fedora systems, an IPsec connection uses the pre-shared key method of IPsec
    node authentication. In a pre-shared key IPsec connection, both hosts must use
    the same key in order to move to Phase 2 of the IPsec connection.


    Phase 2 of the IPsec connection is where the Security Association (SA) is created
    by IPsec nodes. This phase establishes an SA database with configuration information,
    such as the encryption method, secret key exchange parameters, and more. This
    phase manages the actual IPsec connection between remote nodes and networks.


    The Fedora implementation of IPsec uses IKE for sharing keys between hosts across
    the Internet. The racoon daemon handles the IKE distribution and exchange. Refer
    to the racoon man for information about this daemon.


    # 2.7.5. IPsec Installation


    Implementing IPsec requires that the ipsec-tools RPM package installed on all
    IPsec hosts (if using a host-to-host configuration) or routers (if using a network-to-network
    configuration). The RPM package contains essential libraries, daemons, and configuration
    files for setting up the IPsec connection, including:


    +   * /sbin/setkey — manipulates the key management and security attributes of
    IPsec in the kernel. This executable is controlled by the racoon key daemon. Refer
    to the setkey(8) man page for more information.


    +   * /usr/sbin/racoon — the IKE key management daemon, used to manage and control
    security associations and key sharing between IPsec-connected systems.'
