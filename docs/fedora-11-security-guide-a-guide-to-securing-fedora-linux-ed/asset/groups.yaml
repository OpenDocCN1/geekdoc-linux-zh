    # 2.5.4.3. Altering xinetd Configuration Files


    A range of directives is available for services protected by xinetd. This section
    highlights some of the more commonly used options.


    # 2.5.4.3.1. Logging Options


    The following options are available for /etc/xinetd.conf and the service-specific
    configuration files within the /etc/xinetd/ directory.


    The following is a list of the more commonly used logging options:


    +   - ATTEMPT — Logs the fact that a failed attempt was made (log_on_failure).


    +   - DURATION — Logs the length of time the service is used by a remote system
    (log_on_success).


    +   - EXIT — Logs the exit status or termination signal of the service (log_on_success).


    +   - HOST — Logs the remote host''s IP address (log_on_failure and log_on_success).


    +   - PID — Logs the process ID of the server receiving the request (log_on_success).


    +   - USERID — Logs the remote user using the method defined in RFC 1413 for all
    multi-threaded stream services (log_on_failure and log_on_success).'
- md: "\n## Chapter 2. Securing Your Network\n\nFor a complete list of logging options,\
    \ refer to the **xinetd.conf** man page.\n\n### 2.5.4.3.2. Access Control Options\n\
    \nUsers of xinetd services can choose to use the TCP Wrappers hosts access rules,\
    \ provide access control via the xinetd configuration files, or a mixture of both.\
    \ Refer to [Section 2.5.2, “TCP Wrappers Configuration Files`]() for more information\
    \ about TCP Wrappers hosts access control files.\n\nThis section discusses using\
    \ xinetd to control access to services.\n\n> > Note\n> Unlike TCP Wrappers, changes\
    \ to access control only take effect if the xinetd administrator restarts the\
    \ xinetd service.\n> Also, unlike TCP Wrappers, access control through xinetd\
    \ only affects services controlled by xinetd.\n\nThe xinetd hosts access control\
    \ differ from the method used by TCP Wrappers. While TCP Wrappers places all of\
    \ the access configuration within two files, `/etc/hosts.allow` and `/etc/hosts.deny`,\
    \ xinetd's access control is found in each xinetd's configuration file in the\
    \ `/etc/xinetd/` directory.\n\nThe following access options are supported by xinetd:\n\
    \n- **only_from** — Allows only the specified hosts to use the service.\n- **no_access**\
    \ — Blocks hosts from using the service.\n- **access_times** — Specifies the time\
    \ range when a particular service may be used. The time range must be stated in\
    \ 24-hour format, HH:MM-HH:MM.\n\nThe **only_from** and **no_access** options\
    \ can use a list of IP addresses or host names, or can specify an entire network.\
    \ Like TCP Wrappers, combining xinetd access control with the enhanced logging\
    \ configuration can increase security by blocking banned hosts while recording\
    \ each connection.\n\nFor example, the following `/etc/xinetd.telnet` file can\
    \ be used to block Telnet access from a particular network group and restrict\
    \ the overall time that all users can log in:\n\n```\nservice telnet\n{\n  disable\
    \ = no\n  flags = REUSE\n  socket_type = stream\n  wait = no\n  user = root\n\
    \  server = /usr/kerberos/sbin/telnetd\n  log_on_failure = USERID\n  no_access\
    \ = 172.16.45.0/24\n  log_on_success = HOST\n  access_times = 00:45-16:15\n}\n\
    ```\n\nIn this example, when a client from the 10.0.1.0/24 network, as 10.0.1.2,\
    \ tries to access the Telnet service, it receives the following message:\n\n#\
    \ xinetd Configuration Files\n\nConnection closed by foreign host.\n\nIn addition,\
    \ their login attempts are logged in /var/log/messages as follows:\n\n```\nSep\
    \ 7 14:58:33 localhost xinetd[5285]: PAIL: telnet address from=172.16.45.107\n\
    Sep 7 14:58:33 localhost xinetd[5283]: START: client pid=5285 from=172.16.46.107\n\
    Sep 7 14:58:33 localhost xinetd[5283]: EXIT: client status=0 pid=5285 duration=(sec)\n\
    ```\n\nWhen using TCP Wrappers in conjunction with xinetd controls, it is important\
    \ to understand the relationship between the two access control mechanisms.\n\n\
    The following is the sequence of events followed by xinetd when a client requests\
    \ a connection:\n\n1. The xinetd daemon accesses the TCP Wrappers access rules\
    \ using libwrap.a library call. If a deny rule matches the client, the client\
    \ is dropped. If an allow rule matches the client, the client is passed to xinetd.\n\
    2. The xinetd daemon checks its own access control rules for the xinetd service\
    \ and the requested service. If a deny rule matches the client, the client is\
    \ dropped. Otherwise, xinetd starts an instance of the requested service and passes\
    \ control of the connection to that service.\n\n> Important: Care should be taken\
    \ when using TCP Wrappers access controls in conjunction with xinetd access controls.\
    \ Misconfiguration can cause undesirable effects.\n\n### 2.5.4.3.3. Binding and\
    \ Redirection Options\n\nThe configuration files for xinetd support binding the\
    \ service to an IP address and redirecting incoming requests for that service\
    \ to another IP address, hostname, or port.\n\nBinding is controlled with the\
    \ bind option in the service-specific configuration files and links the service\
    \ to one IP address on the system. When this is configured, the bind option only\
    \ allows requests to the correct IP address to access the service. You can use\
    \ this method to bind different services to different network interfaces based\
    \ on requirements.\n\nThis is particularly useful for systems with multiple network\
    \ adapters or multiple IP addresses. On such a system, inverse services (for example,\
    \ Telnet), can be configured to listen only on the interface connected to a private\
    \ network and not to the interface connected to the Internet.\n\nThe redirect\
    \ option accepts an IP address or hostname by port number. It configures the service\
    \ to redirect any requests for this service to the specified host and port number.\
    \ This feature can be used to point to another port number on the same system,\
    \ redirect the request to a different IP address on the same machine, shift the\
    \ request to a totally different system and port number, or any combination of\
    \ these options. A user connecting to a certain service on a system may therefore\
    \ be rerouted to another system without disruption.\n\nThe xinetd daemon is able\
    \ to accomplish this redirection by spawning a process that stays alive for the\
    \ duration of the connection between the requesting client machine and the host\
    \ actually providing the service, transferring data between the two systems.\n\
    \n## Chapter 2. Securing Your Network\n\nThe advantages of the bind and redirect\
    \ options are most clearly evident when they are used together. By binding a service\
    \ to an IP address on a system and redirecting requests for this service to a\
    \ second machine that only the first machine can see, an internal service can\
    \ be used to provide services for a totally different network. Alternatively,\
    \ these options can be used to limit the exposure of a particular service on a\
    \ multi-homed machine to a known IP address, as well as redirect any requests\
    \ for that service to another machine configured for that purpose.\n\nFor example,\
    \ consider a system that was behind a firewall with this setting for Telnet service:\n\
    \n```\nsocket_type = stream\nwait = no\nserver = /usr/kerberos/sbin/telnet\nlog_on_success\
    \ += DURATION USERID\nlog_on_failure += USERID\nbind = 123.123.123.123 = 10.0.1.13\
    \ 23\n```\n\nThe bind and redirect options in this file will ensure that the Telnet\
    \ service on the machine is bound to the external IP address (123.123.123.123),\
    \ the one facing the Internet. In addition, any requests for Telnet service sent\
    \ to 123.123.123.123 are redirected via a second network adapter to an internal\
    \ IP address (10.0.1.13) that only the firewall and internal systems can access.\
    \ The firewall then sends communication between the two, and the system thinks\
    \ it is connected to a different.\n\nThis feature is particularly useful for users\
    \ with broadband connections and only one fixed IP address. When using Network\
    \ Address Translation (NAT), the systems behind the gateway are not available\
    \ from the outside system. However, when certain services controlled by xinetd\
    \ are configured with the bind and redirect options, the gateway machine can act\
    \ as a proxy between outside systems and a particular internal machine to provide\
    \ the service. In addition, the various xinetd access control and logging options\
    \ are also available for protection.\n\n### 2.5.4.3.4. Resource Management Options\n\
    \nThe xinetd daemon can add a basic level of protection from Denial of Service\
    \ (DoS) attacks. The following is a list of directives which can aid in limiting\
    \ the effectiveness of such attacks:\n\n- **per_source** Defines the maximum number\
    \ of instances for a service per IP address. It accepts only integers as an argument\
    \ and can be used in both xinetd.conf and the service-specific configuration files\
    \ in xinetd.d/.\n- **cps** Defines the maximum number of connections per service.\
    \ This directive takes two integers separated by white space. The first argument\
    \ is the maximum number of connections allowed to the service per second. The\
    \ second argument is the number of seconds xinetd must wait before re-enabling\
    \ the service. It accepts only integers as arguments and can be used in either\
    \ the xinetd.conf file or the service-specific configuration files in the xinetd.d/.\n\
    - **max_load** Defines the CPU usage or load average for a service. It accepts\
    \ a floating point number argument.\n\nThe load average is a rough measure of\
    \ how many processes are active at a given time. See the uptime, who, and procinfo\
    \ commands for more information about load average.\n"
