    ## 2.1.3.1.1. Secure Password Creation Methodology


    There are many methods that people use to create secure passwords. One of the
    most popular involves acronyms. For example:


    - Think of an easily-remembered phrase, such as:

    - "over the river and the woods, grandmother''s house we go."

    - Next, turn it into an acronym (including the punctuation).

    - Add complexity by substituting numbers and letters for the acronym. For example,
    substitute 7 for t and the symbol @ for a:

    - Add more complexity by capitalizing at least one letter, such as H:

    - Finally, do not use the example password above for any systems, ever.


    While securing passwords is imperative, managing them properly is also important,
    especially for system administrators within large organizations. The following
    section details good practices for creating and managing user passwords within
    an organization.


    ## 2.1.3.2. Creating User Passwords Within an Organization


    If an organization has a large number of users, the system administrators have
    two basic options to force the use of good passwords. They can create passwords
    for the user, or they let users create their own passwords, while verifying the
    passwords are of acceptable quality.


    Creating the passwords for the users ensures that the passwords are good, but
    it can be a daunting task as the organization grows. It also increases the risk
    of users writing their own passwords.


    For these reasons, most system administrators prefer to have the users create
    their own passwords, but actively verify that the passwords are good and, in cases,
    force users to change their passwords periodically through password aging.


    ## 2.1.3.2.1. Forcing Strong Passwords


    To protect from intrusion is a good idea for system administrators to verify that
    the passwords used within an organization are strong. When users are asked to
    create or change passwords, they can use the command line application *passwd*,
    which is *Pluggable Authentication Manager (PAM)* aware and therefore checks to
    see if the password is too short or otherwise easy to crack. This check is performed
    using the *pam_cracklib.so* PAM module. Since PAM is


    Password Security


    The password check performed at the time of creation does not discover bad passwords
    as effectively as running a password cracking program against the passwords.


    Many password cracking programs are available that run under Fedora, although
    none ship with the operating system. A brief list is of some of the most popular
    password cracking programs:


    - The Ripper — A fast and flexible password cracking program. It allows the use
    of multiple word lists and is capable of brute-force password cracking. It is
    available online at http://www.openwall.com/john/


    - Crack — Perhaps the best known password cracking software, Crack is also very
    fast, though not easy to use as John Ripper. It can be found online at http://www.crypticide.com/alemcm/security/c50-faq.html.


    - Slurpie — Slurpie is similar to John Ripper and Crack, but it is designed to
    run on multiple computers simultaneously, creating a distributed password cracking
    attack. It can be found along with a number of other attack security evaluation
    tools online at http://www.ossrack.com/distributed.htm.


    > Warning

    Always get authorization in writing before attempting to crack passwords within
    an organization.


    ## 2.1.3.2.2. Passphrases


    Passphrases are the cornerstone to security in today''s systems. Unfortunately,
    techniques such as biometrics and two-factor authentication have not become mainstream
    in many systems which have become a major problem. If passwords are going to be
    used to secure a system, the use of passphrase should be considered. Passphrases
    are longer than passwords and provide better protection than a password even when
    implemented with non-standard characters as numbers and symbols.


    ## 2.1.3.2.3. Password Aging


    Password aging is another technique used by system administrators to defend against
    bad passwords within an organization. Password aging means that after a specified
    period (usually 90 days), the user is prompted to create a new password. The theory
    behind this is that if a user is forced to change his password periodically, a
    cracked password is only useful to an intruder for a limited amount of time. The
    downside to password aging, however, is that users are more likely to write their
    passwords down.


    There are two primary programs to specify password aging under Fedora: the change
    command or the graphical User Manager (system-config-users) application.


    The -M option of the change command specifies the maximum number of days the password
    is valid. For example, to set a user''s password to expire in 90 days, use the
    following command:


    ```

    chage -M 90 <username>

    ```


    ## Chapter 2. Securing your Network


    In the above command, replace <username> with the name of the user. To disable
    password expiration, it is traditional to use a value of 99999 after the -M option
    (this equates to a little over 273 years).


    You can also use the chage command in interactive mode to modify multiple password
    aging and account details. Use the following command to enter interactive mode:


    ```

    chage <username>

    ```


    The following is a sample interactive session using with this command:


    ```

    root@interch1]# chage davido

    Changing the age information for davido

    Minimum Password Age: 0

    Maximum Password Age: 99999

    Last Password Change (YYYY-MM-DD): 2006-08-18

    Password Warning Days: 7

    Inactive days: -1

    Account Expiration Date (YYYY-MM-DD): 1969-12-31

    root@interch1]#

    ```


    Refer to the man page chage for more information on the available options.


    You can also use the graphical User Manager to create password aging, as follows.
    You need Administrator privileges to perform this procedure.


    1. Click the System menu on the Panel, point to Administration and then click
    Users and Groups to display the User Manager.

    2. Click the Users tab, and select the required user in the list.

    3. Click the Properties on the toolbar to display the User Properties box (or
    choose Properties on the File menu).

    4. Click the Password Info tab, and select the check box for Enable expiration.

    5. Enter the required value in the Days before field, and click OK.


