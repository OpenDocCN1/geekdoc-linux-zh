    \nRefer to Section 2.5.5, \"Additional Resources\" for more information about\
    \ TCP Wrappers.\n\n# 2.5.3. xinetd\n\nThe xinetd daemon is a TCP-wrapped super\
    \ service which controls access to a subset of popular network services, FTP,\
    \ IMAP, and Telnet. It also provides service-specific configuration options for\
    \ access control, enhanced logging, binding, redirection, and resource utilization\
    \ control.\n\nWhen a client attempts to connect to a network service controlled\
    \ by xinetd, the super service receives the request and checks for any TCP Wrappers\
    \ access control rules.\n\nIf access is allowed, xinetd verifies that the connection\
    \ is allowed under its own rules for that service. It also checks that the service\
    \ can have more resources allocated to it and that it is not in breach of any\
    \ defined rules.\n\nIf all conditions are met (that is access is allowed to the\
    \ service: the service has not reached its resource limit; and the service is\
    \ not in breach of any defined rule), xinetd starts an instance of the requested\
    \ service and passes control of the connection to it. After the connection has\
    \ been established, xinetd takes no further part in the communication between\
    \ the client and the server.\n\n# 2.5.4. xinetd Configuration Files\n\nThe configuration\
    \ files for xinetd are as follows:\n\n+   - /etc/xinetd.conf — The global xinetd\
    \ configuration file.\n- /etc/xinetd.d/ — The directory containing service-specific\
    \ files.\n\n# 2.5.4.1. The /etc/xinetd.conf File\n\nThe /etc/xinetd.conf file\
    \ contains general configuration settings which affect every service under xinetd's\
    \ control. It is read when the xinetd service is first started, so for configuration\
    \ changes to take effect, you need to restart the xinetd service. The following\
    \ is a sample /etc/xinetd.conf file:\n\n```\ndefaults {\n  instances = 60\n  log_type\
    \ = SYSLOG authpriv\n  log_on_success = HOST PID\n  log_on_failure = HOST\n}\n\
    ```"
