    # PAM Configuration File Format


    > ### Note

    An individual module can provide any or all module interfaces. For instance, pam_unix.so
    provides all four module interfaces.


    In a PAM configuration file, the module interface is the first field defined.
    For example, a typical line in a configuration may look like this:


    ```

    auth required pam_unix.so

    ```


    This instructs PAM to use the pam_unix.so module''s auth interface.


    # 2.4.3.1. Stacking Module Interfaces


    Module interface directives can be stacked, or placed upon one another, so that
    multiple modules are used together for one purpose. A module''s control flag uses
    the "sufficient" or "requisite" value (refer to Section 2.4.3.2, "Control Flag"
    for more information on these flags), then the order in which the modules are
    listed is the authentication process.


    Stacking makes it easier for an administrator to require specific conditions before
    allowing the user to authenticate. For example, the reboot command uses several
    stacked modules, as seen in its PAM configuration file:


    ```

    #MyServer]# cat /etc/pam.d/reboot

    #PAM-1.0

    auth sufficient pam_rootok.so

    auth required pam_console.so

    #include system-auth

    account required pam_permit.so

    ```


    +   - The first line is a comment and is not processed.


    +   - auth sufficient pam_rootok.so — This line uses the pam_rootok.so module
    to check the current user is root, by verifying that their UID is 0. If this test
    succeeds, no other modules are considered and the command is executed.


    +   - auth required pam_console.so — This line uses the pam_console.so module
    to attempt to authenticate the user. If this user is already logged in the console,
    pam_console.so checks whether there is a file in the /etc/security/console.apps
    directory with the same name as the service name (reboot). If such a file exists,
    authentication succeeds and is passed to the next module.


    +   - # include system-auth — This line is commented and is not processed.


    +   - account required pam_permit.so — This line uses the pam_permit.so module
    to allow the root user or logged in user to the console at reboot system.


    # 2.4.3.2. Control Flag


    All PAM modules generate a success or failure result when called. Control flags
    tell PAM what to do with the result. Modules can be stacked in a particular order,
    and the control flags determine how important the success or failure of a particular
    module is to the overall goal of authenticating the user to the service.


