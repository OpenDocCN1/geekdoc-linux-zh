    ## 第 2 章 保护您的网络


    - 7. 在 **kadmin** 中使用 **addprinc** 命令为用户添加主体（principals）。**kadmin** 和 **kadmin.local**
    是指向 KDC 的命令行界面。因此，在启动 **kadmin** 程序后，可以使用许多命令——例如 **addprinc**。更多信息请参阅 **kadmin**
    手册页。


    - 8. 验证 KDC 是否正在颁发票据。首先，运行 **kinit** 获取票据并将其存储在凭据缓存文件中。接下来，使用 **klist** 查看缓存中的凭据列表，并使用
    **kdestroy** 销毁缓存及其凭据。


    > > **注意：**默认情况下，**kinit** 使用相同的系统登录用户名（Kerberos 服务器）进行身份验证。如果该用户名与 Kerberos 数据库中的主体不对应，**kinit**
    将输出错误信息。如果发生这种情况，请在命令行上为 **kinit** 提供正确主体的名称作为参数（**<principal>**）。


    完成这些步骤后，Kerberos 服务器应该就能正常运行。


    ## 2.6.6. 配置 Kerberos 5 客户端


    设置 Kerberos 5 客户端比设置服务器要简单得多。至少，客户端包为每个客户端提供了一个有效的 **krb5.conf** 配置文件。虽然 **ssh**
    和 **login** 是远程登录客户端系统的首选方法，但 Kerberos 版本的 **rsh** 和 **login** 仍然可用；部署它们需要进行一些更改。


    - 1. 确保 Kerberos 客户端与 KDC 之间已建立时间同步。更多信息请参阅[第 2.6.5 节，“配置 Kerberos 5 服务器”](#)。此外，在配置
    Kerberos 客户端程序之前，请验证 DNS 是否工作正常。


    - 2. 在所有客户端机器上安装 **krb5-libs** 和 **krb5-workstation** 包。为每个客户端提供一个有效的 **/etc/krb5.conf**
    文件（通常这可以是 KDC 使用的同一个 **krb5.conf** 文件）。


    - 3. 在领域（realm）中工作之前，使用 Kerberos 身份验证通过 **ssh** 或 Kerberos **rsh**、**kshd** 和
    **klogin** 连接的用户，所有这些服务器都需要访问*主机*服务的主体。此外，为了使用 Kerberos 化的 **rsh** 和 **login**
    服务，该工作站必须安装 **xnetd** 包。


    使用 **kadmin** 在 KDC 上为工作站添加一个主体。在这种情况下，实例是工作站的主机名。使用 **kadmin** 的 **addprinc**
    命令的 **-randkey** 选项创建主体并为其分配随机密钥：


    ```

    addprinc -randkey host/blah.example.com

    ```


    现在主体已经创建，可以在工作站本身上运行 **kadmin** 并使用 **kadmin** 内的 **ktadd** 命令为工作站提取密钥：


    ```

    ktadd -k /etc/krb5.keytab host/blah.example.com

    ```


    - 4. 要使用其他 Kerberos 化的网络服务，必须先启动它们。以下是一些常见的 Kerberos 服务列表及其说明：


    - 带有 GSS-API 的 OpenSSH：如果客户端和服务器的配置启用了 GSSAPIAuthentication，则可以使用它验证用户对服务器的身份。如果客户端也启用了
    GSSIDelegateCredentials，则用户的凭据在远程系统中可用。


    - rsh 和 login —— 要使用 Kerberos 化的 rsh 和 login 服务，请启用 login、eklogin 和 kshell。


    - Telnet —— 要使用 Kerberos 化的 Telnet，必须启用 kb5-telnet。


    - FTP —— 要提供 FTP 访问，为根为 ftp 的主体创建中心并提取密钥。确保将实例设置为 FTP 服务器的完全限定主机名，然后启用 gssftp。


    - IMAP —— 要使用 Kerberos 化的 IMAP 服务器，如果 cyrus-imap 也安装了 cyrus-sasl-gsapi 包，它将使用
    Kerberos 5。cyrus-sasl-gsapi 包包含支持 GSS-API 身份验证的 Cyrus SASL 插件。Cyrus IMAP 应该配合
    Kerberos 正常工作，因为 cyrus 用户能够在 /etc/krb5.keytab 中找到主体密钥，且该主体的根是 để imaju（通过 kadmin
    创建）。


    cyrus-imap 的替代方案可以在 dovet 包中找到，该包也包含在 Fedora 中。该包包含一个 IMAP 服务器，但不支持 GSS-API 和
    Kerberos。


    - CVS —— 要使用 Kerberos 化的 CVS 服务器，gserver 使用 crovs 的主体并且与 CVS 服务器完全相同。


