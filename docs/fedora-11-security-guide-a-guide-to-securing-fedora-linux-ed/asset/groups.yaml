    | 不需要 shell 的程序，例如 FTP 客户端、邮件客户端和其他许多程序。 | 以下程序不会阻止访问 root 账户：**sudo**、**FTP 客户端**、**邮件客户端**
    |

    | 通过任何控制台设备 (tty) 禁用 root 访问。 | 在连接到计算机的任何设备上设置空的 /etc/passwd 登录。 | 防止通过控制台或网络访问
    root 账户。防止以下程序访问 root 账户：**login**、**kdm** | 不登录 root 但通过 setuid 或其他机制执行管理任务的程序。以下程序不会阻止访问
