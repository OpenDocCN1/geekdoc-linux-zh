    For example, incoming interfaces (-i option) can only be used in INPUT or FORWARD
    chains. Similarly, outgoing interfaces (-o option) can only be used in FORWARD
    or OUTPUT chains.


    In other words, INPUT chains and incoming interfaces work together; OUTPUT chains
    and outgoing interfaces work together. FORWARD chains work with both incoming
