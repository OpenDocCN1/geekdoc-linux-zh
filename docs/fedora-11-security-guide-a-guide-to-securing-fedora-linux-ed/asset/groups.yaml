    # xinetd Configuration Files


    Connection closed by foreign host.


    In addition, their login attempts are logged in /var/log/messages as follows:


    ```

    Sep 7 14:58:33 localhost xinetd[5285]: PAIL: telnet address from=172.16.45.107

    Sep 7 14:58:33 localhost xinetd[5283]: START: client pid=5285 from=172.16.46.107

    Sep 7 14:58:33 localhost xinetd[5283]: EXIT: client status=0 pid=5285 duration=(sec)

    ```


    When using TCP Wrappers in conjunction with xinetd controls, it is important to
    understand the relationship between the two access control mechanisms.


    The following is the sequence of events followed by xinetd when a client requests
    a connection:


    +   1. The xinetd daemon accesses the TCP Wrappers access rules using librap.a
    library call. If a deny rule matches the client, the client is dropped. If an
    allow rule matches the client, the client is passed to xinetd.

    2. The xinetd daemon checks its own access control rules for the xinetd service
    and the requested service. If a deny rule matches the client, the client is dropped.
    Otherwise, xinetd starts an instance of the requested service and passes control
    of the connection to that service.


    > Important: Care should be taken when using TCP Wrappers access controls in conjunction
    with xinetd access controls. Misconfiguration can cause undesirable effects.


    # 2.5.4.3.3. Binding and Redirection Options


    The configuration files for xinetd support binding the service to an IP address
    and redirecting incoming requests for that service to another IP address, hostname,
    or port.


    Binding is controlled with the bind option in the service-specific configuration
    files and links the service to one IP address on the system. When this is configured,
    the bind option only allows requests to the correct IP address to access the service.
    You can use this method to bind different services to different network interfaces
    based on requirements.


    This is particularly useful for systems with multiple network adapters or multiple
    IP addresses. On such a system, inverse services (for example, Telnet), can be
    configured to listen only on the interface connected to a private network and
    not to the interface connected to the Internet.


    The redirect option accepts an IP address or hostname by port number. It configures
    the service to redirect any requests for this service to the specified host and
    port number. This feature can be used to point to another port number on the same
    system, redirect the request to a different IP address on the same machine, shift
    the request to a totally different system and port number, or any combination
    of these options. A user connecting to a certain service on a system may therefore
    be rerouted to another system without disruption.


    The xinetd daemon is able to accomplish this redirection by spawning a process
    that stays alive for the duration of the connection between the requesting client
    machine and the host actually providing the service, transferring data between
    the two systems.'
