    # Chapter 1. Security Overview


    - Motion or thermal alarm systems

    - Security guards

    - Picture IDs

    - Locked and dead-bolted steel doors

    - Biometrics (includes fingerprint, voice, face, iris, handwriting, and other
    automated methods used to recognize individuals)


    ## 1.1.3.2. Technical Controls


    Technical controls use technology as a basis for controlling the access and usage
    of sensitive data throughout a physical structure and over a network. Technical
    controls are far-reaching in scope and encompass such technologies as:


    - Encryption

    - Smart cards

    - Network authentication

    - Access control lists (ACLs)

    - File integrity auditing software


    ## 1.1.3.3. Administrative Controls


    Administrative controls define the factors of security. They involve all levels
    of personnel within an organization and determine which users have access to what
    resources and information by means as:


    - Training and awareness

    - Disaster preparedness and recovery plans

    - Personnel recruitment and separation strategies

    - Personnel registration and accounting


    ## 1.1.4. Conclusion


    Now that you have learned about the origins, reasons, and aspects of security,
    you will find it easier to determine the appropriate course of action with regard
    to Fedora. It is important to know what factors and conditions make up security
    in order to plan and implement a proper strategy. With this information in mind,
    the process can be formalized and the path becomes clearer as you delve deeper
    into the specifics of the security process.


    ## 1.2. Vulnerability Assessment


    Given time, resources, and motivation, a cracker can break into any system. At
    the end of the day, all of the security procedures and technologies currently
    available cannot guarantee that any systems are completely safe from intrusion.
    Routers help secure gateways to the Internet. Firewalls help secure the edge of
    the network. Virtual Private Networks safely pass data in an encrypted stream.
    Intrusion detection systems warn you of malicious activity. However, the success
    of each of these technologies is dependent upon a number of variables:


    - The expertise of the staff responsible for configuring, monitoring, and maintaining
    the technologies.

    - The ability to patch and update services and kernels quickly and efficiently.

    - The ability of those responsible to keep constant vigilance over the network.


    Given the dynamic state of data systems and technologies, securing corporate resources
    can be quite complex. Due to this complexity, it is difficult to find experts
    for all of systems. While it is possible to have personnel knowledgeable in many
    areas of information security at a high level, it is difficult to retain staff
    who are experts in more than a few subject areas. This is mainly because each
    subject area of information security requires constant attention and focus. Information
    security does not stand still.


    ## 1.2.1. Thinking Like the Enemy


    Suppose that you administer an enterprise network. Such networks are commonly
    comprised of operating systems, applications, servers, network monitors, intrusion
    detection systems, and more. Now imagine trying to keep current with each of these.
    Given the complexity of today''s software and networking environments, exploits
    and bugs are a certainty. Keeping current with patches and updates for an enterprise
    network can be a daunting task in a large organization with heterogeneous systems.


    Combine the expertise requirements with the task of keeping current, and it is
    inevitable that adverse incidents occur, systems are breached, data is corrupted,
    and service is interrupted.


    To augment security technologies and aid in protecting systems, networks, and
    data, you must think like a cracker and gauge the security of your systems by
    checking for weaknesses. Preventative vulnerability assessments against your own
    systems and network resources reveal potential issues that can be addressed before
    a cracker exploits it.


    A vulnerability assessment is an internal audit of your network and system security;
    the results of which indicate the confidentiality, integrity, and availability
    of your network (as explained in Section 1.1.1.3, "Standardizing Security"). Typically,
    vulnerability assessment starts with reconnaissance phase, during which important
    data regarding the target systems and resources is gathered. This leads to the
    readiness phase, where the target is essentially checked for all known vulnerabilities.
    The readiness phase completes in the reporting phase, where the findings are classified
    into categories of high, medium, and low risk; and methods for improving the security
    (or mitigating the risk) of the target are discussed.


    If you were to perform a vulnerability assessment of your home, you would likely
    check each door to your home if they are closed and locked. You would also check
    window, making sure they closed tightly and latch catch. This same concept applies
    to systems, networks, and electronic data. Malicious users are the thieves and
    vandals of your data. Focus on their tools, mentality, and motivations, and you
    can react to their actions.


    ## 1.2.2. Defining Assessment and Testing


    Vulnerability assessments may be broken down into one of two types: Outside looking
    in and inside looking around.


    When performing an outside looking in vulnerability assessment, you are attempting
    to compromise your systems from the outside. Being external to your company provides
    you with the cracker''s viewpoint. When you see a cracker sees — publicly-routable
    IP addresses on your DMZ, external interfaces of your firewall, and more. DMZ
    stands for "demilitarized zone", which corresponds to a computer or subnet that
    sits between a trusted network, such as a private LAN, and an untrusted external
    network, such as the public Internet. Typically, the DMZ contains devices access
