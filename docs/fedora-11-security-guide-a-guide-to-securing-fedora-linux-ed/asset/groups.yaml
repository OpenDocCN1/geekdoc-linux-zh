    # 2.1.3. Password Security


    Passwords are the primary method Fedora uses to verify a user''s identity. This
    is why password security is important for protection of the user, the workstation,
    and the network.


    For security purposes, the installation program confirms the system to use Message-Digest
    Algorithm (MD5) and shadow passwords. It is highly recommended that you do not
    alter these settings.


    If MD5 passwords are deselected during installation, the older Data Encryption
    Standard (DES) format is used. This limits passwords to alphanumeric characters
    (disallowing punctuation and other characters), and provides a modest 56-bit level
    of encryption.


    If shadow passwords are deselected during installation, all passwords are stored
    as a one-way hash in the world-readable /etc/passwd file, which makes the system
    vulnerable to offline password cracking attacks. If an intruder can gain access
    to the machine as a regular user, he can copy the /etc/passwd to his own machine
    and run any number of password cracking programs against


    GRUB also accepts unencrypted passwords, but it is recommended that an MD5 hash
