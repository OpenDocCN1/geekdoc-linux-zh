    ## 2.6. Kerberos


    System security and integrity within a network can be unwieldy. It can occupy
    the time of several administrators just to keep track of what services are being
    run on a network and the manner in which these services are used.


    ## Chapter 2. Securing Your Network


    Further, authenticating users to network services can prove dangerous when the
    method used by the protocol is inherently insecure, as evidenced by the transfer
    of unencrypted passwords over a network using the traditional FTP and Telnet protocols.


    Kerberos is a way to eliminate the need for protocols that allow unsafe methods
    of authentication, enhancing overall network security.


    ### 2.6.1. What is Kerberos?


    Kerberos is a network authentication protocol created by MIT, and uses symmetric-key
    cryptography to authenticate users to network services, which means passwords
    are never actually sent over the network.


    Consequently, when users authenticate to network services using Kerberos, unauthorized
    users attempting to gather passwords by monitoring network traffic are effectively
    thwarted.


    ### 2.6.1.1. Advantages of Kerberos


    Most conventional network services use password-based authentication schemes.
    Such schemes require a user to authenticate to a given network by supplying their
    username and password. Unfortunately, the transmission of authentication information
    for many services is unencrypted. For such a scheme to be secure, the network
    has be inaccessible to outsiders, and all computers and users on the network must
    be trusted and thoroughly.


    Even if this is the case, a network that is connected to the Internet can no longer
    be assumed to be secure. Any attacker who gains access to the network can use
    a simple packet analyzer, also known as a packet sniffer, to intercept usernames
    and passwords, compromising user accounts and the integrity of the entire security
    infrastructure.


    The design goal of Kerberos is to eliminate the transmission of unencrypted passwords
    across the network. If used properly, Kerberos effectively eliminates the threat
    that packet sniffers would otherwise pose on a network.


    ### 2.6.1.2. Disadvantages of Kerberos


    Although Kerberos removes a common and severe security threat, it might be difficult
    to implement for a variety of reasons:


    - Migrating users from a standard UNIX password database, such as /etc/passwd
    or /etc/shadow, to a Kerberos password database can be tedious, as there is no
    automated mechanism to perform this task. Refer to Question 23 in the online Kerberos
    FAQ:

    http://www.nrl.navy.mil/CCS/people/kenh/kerberos-faq.htm


    - Kerberos has only partial compatibility with Pluggable Authentication Modules
    (PAM) system used by most servers. Refer to Section 2.6.4, “Kerberos and PAM”
    for more information about this issue.


    - Kerberos assumes that each user is trusted but using an untrusted host on the
    network. Its primary goal is to prevent unencrypted passwords from being transmitted
    across that network. However, if anyone other than the proper user has access
    to the one that issues tickets the system where both the client and the server
    share a common key is used to encrypt and decrypt communication.


    - For an application to use Kerberos, its source must be modified to make the
    appropriate calls into the Kerberos libraries. Applications modified in this way
    are considered to be Kerberos aware. For some applications, this can be quite
    problematic due to the size of the application or its design. Kerberos is an all-or-nothing
    solution. If Kerberos is used on the network, any unencrypted passwords transferred
    to the service is at risk. Thus, the network gains from the use of Kerberos aware
    client/server applications.


    ## 2.6.2. Kerberos Terminology


    Kerberos has its own terminology to define various aspects of the service. Before
    learning how Kerberos works, it is important to learn the following terms.


    - AS: A server that issues tickets for a desired service which are in turn given
    to users for access to the service. The AS responds to clients who have a request
    by issuing a ticket-granting ticket (TGT). The AS runs on the same host as the
    key distribution center (KDC).

    - ciphertext: Encrypted data.

    - client: An entity on the network (a user, a host, or application) that can receive
    a ticket from Kerberos.

    - credentials: A temporary set of electronic credentials that verify the identity
    of a client for a particular service. Also called ticket.

    - credential cache file: A file which contains the keys for encrypting communications
    between a user and various network services. Kerberos provides a framework for
    using other types, such as shared memory, but files are more thoroughly supported.

    - crypt: A one-way hash to authenticate users. If a network service (such as Cyrus-IMAP)
    uses GSS-API, it can authenticate using Kerberos.

    - hash: Also known as a *hash value*. A value generated by passing a string through
    a hash function. These values are typically used to ensure that transmitted data
    has not been tampered with.

    - hash function: A way of generating a digital "fingerprint" from input data.
    These functions rearrange, transpose, or otherwise alter data to produce a *hash
    value*.

    - key: Data used when encrypting or decrypting data. Encrypted data cannot be
    decrypted without the proper key or extremely fortune on the part of the cracker.

    - key distribution center (KDC): A service that issues Kerberos tickets, and which
    usually runs on the same host as the ticket-granting server (TGS).

    - keytab (or key table): A file that contains an encrypted list of principals
    and their keys. Servers retrieve the keys they need from keytab instead of using
    kinit. The default keytab file is /etc/krb5.keytab. The KDC administration server,
    /var/kerberos/krb5dc/sbin/kadmind, is the only service that uses other files (`/var/kerberos/krb5dc/kad5.keytab`).
    Refer to the kinit man page for more information.

    - kinit: The kinit command allows a principal who has logged in to cache the initial
    ticket-granting ticket (TGT). Refer to the kinit man page for more information.

    - principal (or principal name): The principal is the unique name of a user or
    service used to authenticate with Kerberos. A principal follows the form `root/Instance@REALM`.
    For a typical user, the root is the same as their login ID. The instance is optional.
    If a principal has an instance, it is separated from the root with a forward slash
    (/). An empty string ("") is considered a valid instance (which differs from the
    default NULL instance), but using can be confusing. All principals in a realm
    have their own key, which is used for users from a password or is randomly generated
    for services.

    - realm: A network that uses Kerberos, composed of one or more servers called
    KDCs and a potentially large number of clients.

    - service: A program accessed over the network.

    - ticket: A temporary set of electronic credentials that verify the identity of
    a client for a particular service. Also called credentials.

    - ticket-granting server (TGS): A service that issues tickets for a desired service
    which are in turn given to users for access to the service. The TGS usually runs
    on the same host as the KDC.

    - ticket-granting ticket (TGT): A special ticket that allows the client to obtain
    additional tickets without applying for them from the KDC.

    - GSS-API: The Generic Security Application Interface (defined in RFC-2743 published
    by the Internet Engineering Task Force) is a set of functions which provide security
    services. This API is used to authenticate clients and services to each other
    without either program having specific knowledge of the underlying mechanism.

