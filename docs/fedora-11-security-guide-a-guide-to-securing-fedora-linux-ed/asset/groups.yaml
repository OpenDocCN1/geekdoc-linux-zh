    # Chapter 2. Securing Your Network


    The advantages of the bind and redirect options are most clearly evident when
    they are used together. By binding a service to an IP address on a system and
    redirecting requests for this service to a second machine that only the first
    machine can see, an internal service can be used to provide services for a totally
    different network. Alternatively, these options can be used to limit the exposure
    of a particular service on a multi-homed machine to a known IP address, as well
    as redirect any requests for that service to another machine es configured for
    that purpose.


    For example, consider a system that was few a firewall with this setting for Telnet
    service:


    ```

    socket_type = stream

    wait = no

    server = /usr/kerberos/sbin/telnet

    log_on_success += DURATION USERID

    log_on_failure += USERID

    bind = 123.123.123.123 = 10.0.1.13 23

    ```


    The bind and redirect options in this file will ensure that the Telnet service
    on the machine is bound to the external IP address (123.123.123.123), the one
    facing the Internet. In addition, any requests for Telnet service sent to 123.123.123.123
    are redirected via a second network adapter to an internal IP address (10.0.1.13)
    that only the firewall and internal systems can access. The firewall then sends
    communication between the two, and the system thinks it is connected to 123.123.123.123
    when it is actually connected to a different.


    This feature is particularly useful for users with broadband connections and only
    one fixed IP address. When using Network Address Translation (NAT), the systems
    behind the gateway are not available from the outside system. However, when certain
    services controlled by xinetd are configured with the bind and redirect options,
    the gateway machine can act as a proxy between outside systems and a particular
    internal machine configured to provide the service. In addition, the various xinetd
    access control and logging options are also available for protection.


    # 2.5.4.3.4. Resource Management Options


    The xinetd daemon can add a basic level of protection from Denial of Service (DoS)
    attacks. The following is a list of directives which can aid in limiting the effectiveness
    of such attacks:


    +   - per_source Defines the maximum number of instances for a service per IP
    address. It accepts only integers as an argument and can be used in both xinetd.conf
    and the service-specific configuration files in xinetd.d/.

    - cps Defines the maximum number of connections per service. This directive takes
    two integers separated by white space. The first argument is the maximum number
    of connections allowed to the service per second. The second argument is the number
    of seconds xinetd must wait before re-enabling the service. It accepts only integers
    as arguments and can be used in either the xinetd.conf file or the service-specific
    configuration files in the xinetd.d/.

    - max_load Defines the CPU usage or load average for a service. It accepts a floating
    point number argument.


    The load average is a rough measure of how many processes are active at a given
    time. See the uptime, who, and procinfo commands for more information about load
    average.'
