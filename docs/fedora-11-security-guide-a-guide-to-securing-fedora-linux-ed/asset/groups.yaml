    # Chapter 1. Security Overview


    is possible. Often, announcements about a given security exploit are accompanied
    with a patch (or source code that fixes the problem). This patch is then applied
    to the Fedora package and tested and released as an errata update. However, if
    an announcement does not include a patch, a developer first works with the maintenance
    of the software to fix the problem. Once the problem is fixed, the package is
    tested and released as an errata update.


    If an errata update is released for software on your system, it is highly recommended
    that you update the affected packages as soon as possible to minimize the amount
    of time the system is potentially vulnerable.


    # 1.5.1. Updating Packages


    When updating software on a system, it is important to download the update from
    a trusted source. An attacker can easily rebuild a package with the same version
    number as the one that is supposed to fix the problem but with a different security
    exploit and release it on the Internet. If this happens, security measures such
    as verifying files against the original RPM do not detect the exploit. Thus, it
    is very important to only download RPMs from trusted sources, such as Fedora and
    to check the signature of the package to verify its integrity.


    > Note

    Fedora includes a convenient icon that displays visible alerts when there is an
    update for a Fedora system.


    # 1.5.2. Verifying Signed Packages


    All Fedora packages are signed with the Fedora GPG key. GPG stands for GNU Privacy
    Guard, or GnPG, a free software package used for ensuring the authenticity of
    distributed files. For example, a private key (secret) locks the package while
    the public key unlocks and verifies the package. If the public key distributed
    by Fedora does not match the private key during RPM verification, the package
    may have been altered and therefore cannot be trusted.


    The RPM utility within Fedora automatically tries to verify the GPG signature
    of an RPM package before installing it. If the GPG key is not installed, import
    it from a secure, static location, such as an Fedora installation CD-ROM or DVD.


    Assuming the disc is mounted at /mnt/cdrom, use the following command to import
    it into the keyring (a database of keys on the system):


    ```

    rpm --import /mnt/cdrom/RPM-GPG-KEY

    ```


    To display a list of all keys installed for RPM verification, execute the following
    command:


    ```

    rpm -qa gpg-pubkey*

    ```


    The output will look similar to the following:


    ```

    gpg-pubkey-db42a60e-37ea538

    ```


    To display a specific key, use the rpm -qi command followed by the output from
    the previous command, as in this example:'
- md: '

    rpm -qi gpg-pubkey-db42a6e-37ea5438


    It is extremely important to verify the signature of the RPM files before installing
    them to ensure that they have not been altered from the original source of the
    packages. To verify all the downloaded at once, issue the following command:


    ```

    rpm -K /tmp/updates/*.rpm

    ```


    For each package, if the GPG key verifies successfully, the command returns gpg
    OK. If it doesn''t, make sure you are using the correct Fedora public key, also
    as verifying the source of the content. Packages that do not pass GPG verifications
    should not be installed, as the source may have been altered by a third party.


    After verifying the GPG key and downloading all the packages associated with the
    errata report, install the packages as root at a shell prompt.


    ## 1.5.3 Installing Signed Packages


    Installation for most packages can be done safely (except kernel packages) by
    issuing the following command:


    ```

    rpm -Uvh /tmp/updates/*.rpm

    ```


    For kernel packages use the following command:


    ```

    rpm -ivh /tmp/updates/<kernel-package>

    ```


    Replace <kernel-package> in the previous example with the name of the kernel RPM.


    Once the machine has been safely rebooted using the new kernel, the old kernel
    may be removed using the following command:


    ```

    rpm -e <old-kernel-package>

    ```


    Replace <old-kernel-package> in the previous example with the name of the older
    kernel RPM.


    > Note

    > It is a requirement that the old kernel be removed. The default boot loader,
    GRUB, allows for multiple kernels to be installed, then chosen from a menu at
    boot time.


    > Important

    > Before installing any security errata, be sure to read any special instructions
    contained in the errata report and execute them carefully. Refer to Section 1.5.4,
    "Applying the Changes" for general instructions about applying the changes made
    by an errata update.


    ## 1.5.4. Applying the Changes


    After downloading and installing security errata and updates, it is important
    to halt use of the old software and begin using the new software. How this depends
    on the type of software that has been updated. The following list itemizes the
    general categories of software and provides instructions for using the updated
    versions after a package upgrade.


    > Note

    > In general, rebooting the system is the safest way to ensure that the latest
    version of a software package is used; however, this option is not always required,
    or available to the system administrator.


    ### Applications

    User-space applications are any programs that are initiated by a system user.
    Typically, such applications are used only when a user, script, or automated task
    launches them and do not persist for long periods of time.


    Once such user-space application is updated, halt any instances of the application
    on the system and launch the program again to use the updated version.


    ### Kernel

    The kernel is the core software component for the Fedora operating system. It
    manages access to memory, the processor, and peripherals as well as schedules
    all tasks.


    Because of its central role, the kernel cannot be restarted without also stopping
    the computer. Therefore, an updated version of the kernel cannot be used until
    the system is rebooted.


    ### Shared Libraries

    Shared libraries are units of code, such as glibc, which are used by a number
    of applications and services. Applications utilizing a shared library typically
    load the shared code when the application is initialized, so any applications
    using the updated library must be halted and relaunched.


    To determine which running applications link against a particular library, use
    the lsof command in the following example:


    ```

    lsof /lib/libwrap.so*

    ```


    This command returns a list of all the running programs which use TCP wrappers
    for host access control. Therefore, any program list must be halted and relaunched
    if the tcp_wrappers package is updated.


    ### SysV Services

    SysV services are persistent server programs launched during the boot process.
    Examples of SysV services include sshd, vsftpd, and xinetd.

    Because these programs usually persist as long as the machine is booted, each
    updated SysV service must be halted and relaunched after the package is upgraded.
    This can be done using the Services Configuration Tool or by logging into a shell
    prompt and issuing the /sbin/service command as in the following example:


    ```

    /sbin/service <service-name> restart

    ```


    In the previous example, replace <service-name> with the name of the service,
    such as sshd.


    ### xinetd Services

    Services controlled by the xinetd super service only run when there is an active
    connection. Examples of services controlled by xinetd include Telnet, IMAP, and
    POP3.


    Because new instances of these services are launched by xinetd each time a request
    is received, connections that occur after an upgrade are handled by the updated
    software. However, if there are active connections at the time the xinetd controlled
    service is upgraded, they are serviced by the older version of the software.


    To kill off instances of a particular xinetd controlled service, upgrade the package
    for the service then halt processes currently running. To determine if the process
    is running, use the ps command and use the kill or killall command to halt current
    instances of the service.


    For example, if security errata imap packages are released, upgrade the packages,
    then type the following command as root into a shell prompt:


    ```

    ps -aux | grep imap

    ```


    This command returns all active IMAP sessions. Individual sessions can then be
    terminated by issuing the following command:


    ```

    kill <PID>

    ```


    If this fails to terminate the session, use the following command instead:


    ```

    kill -9 <PID>

    ```


    In the previous examples, replace <PID> with the process identification (found
    in the second column of ps) for an IMAP session.


    To kill all active IMAP sessions, issue the following command:


    ```

    killall imapd

    ```


    ## Securing Your Network


    ### 2.1. Workstation Security

    Securing a network begins with the workstation. Whether locking down a personal
    machine or securing an enterprise system, sound security policy begins with the
    individual computer. A computer network is only as secure as its weakest node.


    ### 2.1.1. Evaluating Workstation Security

    When evaluating the security of a workstation, consider the following:


    - BIOS and Boot Loader Security — Can an unauthorized user physically access the
    machine and boot into single mode without a password?

    - Password Security — How secure are the user accounts on the machine?

    - Administrative Controls — Who has an account on the system and how much administrative
    control do they have?

    - Available Network Services — What services are listening for requests from the
    network and should be running at all?

    - Personal Firewalls — What type of firewall, if any, is necessary?

    - Security Enhanced Communication Tools — Which tools should be used to communicate
    between workstations and which should be avoided?


    ### 2.1.2. BIOS and Boot Loader Security

    Password protection for the BIOS (or BIOS equivalent) and the boot loader can
    prevent unauthorized users who have physical access to systems from booting using
    removable media or obtaining root privileges through single user mode. The security
    measures you take to protect against such attacks depends on the sensitivity of
    the information on the network and the location of the machine.


    For example, if a machine is in a trade show and contains no sensitive information,
    it may not be critical to prevent such attacks. However, if an employee''s laptop
    with private, unencrypted SSH keys for the corporate network is left unattended
    at that trade show, it could lead to a major security breach with ramifications
    for the entire company.


    If the workstation is located in a place where unauthorized or trusted people
    have access, however, securing the BIOS or the boot loader may not be necessary.


    ### 2.1.2.1. BIOS Passwords

    The two primary reasons for password protecting the BIOS of a computer are:


    - Preventing Changes to BIOS Settings — If an intruder has access to the BIOS,
    they can set it to boot from a diskette or CD-ROM. Since system BIOSes differ
    from manufacturers, some may not support password protection of either type, while
    others may support one type but not the other.

