    ## Linux Security Guide is designed to assist users of Linux in learning the processes
    of securing workstations against local and remote intrusion, exploitation, and
    malicious activity. The Linux Security Guide details the planning and the tools
    involved in creating a secured computing environment for the data center, workplace,
    and home. With proper administrative knowledge, vigilance, and tools running Linux
    can be both functional and secured from most common intrusion and exploit methods.


