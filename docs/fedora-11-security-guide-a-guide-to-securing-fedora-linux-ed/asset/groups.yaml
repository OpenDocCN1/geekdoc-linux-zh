    # Chapter 3. Encryption GPG Keys in GNOME


    # 3.9.1. Creating GPG Keys in GNOME


    Install the Seahorse utility, which makes GPG key management easier. Wait for
    PackageKit to start. Enter System > Administration > Add/Remove Software and search
    for Seahorse in the text box before clicking Select. Select the checkbox next
    to the "seahorse" package and select "Apply" to add the software. You can also
    install Seahorse at the command line with the command `sudo c yum install seahorse`


    To create a key, from the "Applications > Accessories" menu select "Passwords
    and Encryption Keys", which starts the application Seahorse. From the "Key" menu
    select "Create New...", then "GPG" then click "Continue". Type your full name,
    email address, and an optional comment describing who you are (e.g. John C. Smith,
    smith@example.com, The Man). Click "Create". A dialog is displayed asking for
    a passphrase for the key. Choose a strong passphrase but also easy to remember.
    Click "OK" and the key is created.


    > Warning

    If you forget your passphrase, the key cannot be used and any data encrypted using
    that will be lost.


    To find your GPG key ID, look in the "Key ID" column to the newly created key.
    In most cases, if you are asked for the key ID, you should prepend "0x" to the
    key ID, as in "0x6789ABCD". You should make a backup of your private key and store
    it somewhere secure.


    # 3.9.2. Creating GPG Keys in KDE


    Start the KGPG program from the main menu selecting Applications > Utilities >
    Encryption Tool. If you have never used KGPG before, follow the walks through
    the process of creating your own GPG keyring. A dialog box prompts you to create
    a new key pair. Enter your name, address, and an optional comment. You can also
    choose an expiration time for your key, as well as the key strength (number of
    bits) and algorithms. The next dialog prompts you for your passphrase. In this
    point, your key appears in KGPG window.


    > Warning

    If you forget your passphrase, the key cannot be used and any data encrypted using
    that will be lost.


    To find your GPG key ID, look in the "Key ID" column to the newly created key.
    In most cases, if you are asked for the key ID, you should prepend "0x" to the
    key ID, as in "0x6789ABCD". You should make a backup of your private key and store
    it somewhere secure.


    # 3.9.3. Creating GPG Keys Using the Command Line


    Use the following command: `gpg --gen-key`


    This command generates a key pair that consists of a public and a private key.
    Other people use your public key to authenticate and/or decrypt your communications.
    Distribute your public key as widely as possible, especially to people you will
    know to receive authentic communications from you, such as a mailing list. The
    Fedora Documentation Project, for example, asks participants to include a GPG
    public key in their self-introduction.'
