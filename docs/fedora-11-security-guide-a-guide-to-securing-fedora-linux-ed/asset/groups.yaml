    #  1.2.1. Thinking Like the Enemy


    Suppose that you administer an enterprise network. Such networks are commonly
    comprised of operating systems, applications, servers, network monitors, intrusion
    detection systems, and more. Now imagine trying to keep current with each of these.
    Given the complexity of today''s software and networking environments, exploits
    and bugs are a certainty. Keeping current with patches and updates for an enterprise
    network can be a daunting task in a large organization with heterogeneous systems.


    Combine the expertise requirements with the task of keeping current, and it is
    inevitable that adverse incidents occur, systems are breached, data is corrupted,
    and service is interrupted.


    To augment security technologies and aid in protecting systems, networks, and
    data, you must think like a cracker and gauge the security of your systems by
    checking for weaknesses. Preventative vulnerability assessments against your own
    systems and network resources reveal potential issues that can be addressed before
    a cracker exploits it.


    A vulnerability assessment is an internal audit of your network and system security;
    the results of which indicate the confidentiality, integrity, and availability
    of your network (as explained in Section 1.1.1.3, "Standardizing Security"). Typically,
    vulnerability assessment starts with reconnaissance phase, during which important
    data regarding the target systems and resources is gathered. This leads to the
    readiness phase, where the target is essentially checked for all known vulnerabilities.
    The readiness phase completes in the reporting phase, where the findings are classified
    into categories of high, medium, and low risk; and methods for improving the security
    (or mitigating the risk) of the target are discussed.


    If you were to perform a vulnerability assessment of your home, you would likely
    check each door to your home if they are closed and locked. You would also check
    window, making sure they closed tightly and latch catch. This same concept applies
    to systems, networks, and electronic data. Malicious users are the thieves and
    vandals of your data. Focus on their tools, mentality, and motivations, and you
    can react to their actions.


