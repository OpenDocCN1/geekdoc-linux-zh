    ## 2.6.9 Setting Up Cross Realm Authentication


    Cross-realm authentication is the term which is used to describe situations in
    which clients (typically users) of one use Kerberos to authenticate to services
    (typically server processes running on a particular server system) which belong
    to a realm other than their own.


    ## Chapter 2. Securing Your Network


    For the simplest case, in order a client of a realm named A.EXAMPLE.COM to access
    a service in the B.EXAMPLE.COM realm, both must share a key for a principal named
    krbtgt/B.EXAMPLE.COM@A.EXAMPLE.COM, and both keys must have the same key version
    number associated with them.


    To accomplish this, select a very strong password or passphrase, create an entry
    for the principal in both realms using kadmin.


    ```bash

    # kadmin -r A.EXAMPLE.COM kadmin: add principal krbtgt/B.EXAMPLE.COM@A.EXAMPLE.COM
    Enter

    password for principal "krbtgt/B.EXAMPLE.COM@A.EXAMPLE.COM": Re-enter password
    for principal "krbtgt/B.EXAMPLE.COM@A.EXAMPLE.COM": Principal: "krbtgt/B.EXAMPLE.COM@A.EXAMPLE.COM"
    created

    quit

    kadmin -r B.EXAMPLE.COM kadmin: add principal krbtgt/A.EXAMPLE.COM@B.EXAMPLE.COM
    Enter

    password for principal "krbtgt/A.EXAMPLE.COM@B.EXAMPLE.COM": Re-enter password
    for principal "krbtgt/A.EXAMPLE.COM@B.EXAMPLE.COM": Principal: "krbtgt/A.EXAMPLE.COM@B.EXAMPLE.COM"
    created.

    quit

    ```


    Use the getprincipal command to verify that both entries have matching version
    numbers kvno values and encryption types.


    > Dumping the Database Does Not It

    > Security-conscious administrators may attempt to use the add_principal command''s
    -randkey to assign a realm key instead of a password, dump the new entry from
    the database of the first realm, and import it into the second. This will not
    work unless the master keys for the realm keys are identical, or the keys contained
    in a database dump are themselves encrypted using the master key.


    Clients in the A.EXAMPLE.COM realm are now able to authenticate to services in
    the B.EXAMPLE.COM realm. Another, the B.EXAMPLE.COM realm now trusts the A.EXAMPLE.COM.
    This brings us to an important point: cross-realm trust is bidirectional. If the
    B.EXAMPLE.COM realm trusts the A.EXAMPLE.COM realm, then the A.EXAMPLE.COM realm
    must also trust the B.EXAMPLE.COM realm.


    If the B.EXAMPLE.COM realm trusts the A.EXAMPLE.COM realm, then the A.EXAMPLE.COM
    realm must also trust the B.EXAMPLE.COM realm. This means that cross-realm trust
    is transitive. If A.EXAMPLE.COM trusts B.EXAMPLE.COM, and B.EXAMPLE.COM trusts
    C.EXAMPLE.COM, then A.EXAMPLE.COM can authenticate to services in C.EXAMPLE.COM.

