    \ configuration files located in the **/etc/xinetd.d/** directory. Refer to [Section\
    \ 2.5.4.2, \"The /etc/xinetd.d/\"]() for more information.\n\n> Note: Often the\
    \ **log_on_success** and **log_on_failure** settings in **/etc/xinetd.conf** are\
