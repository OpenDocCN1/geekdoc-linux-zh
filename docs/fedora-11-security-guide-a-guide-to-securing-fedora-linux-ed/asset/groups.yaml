    ## 2.8.2.4. Other Ports


    The Firewall Configuration Tool includes an Other ports section for specifying
    custom IP ports being trusted by iptables. For example, allow IRC and Internet
    printing protocol (IPP) to pass through the firewall, add that to the following
    Other ports section:


    ```

    194:tcp, 631:tcp

    ```


    ## 2.8.2.5. Saving the Settings


    Click OK to save the changes and enable or disable the firewall. If Enable firewall
    was selected, the options are translated to iptables commands and written to the
    /etc/sysconfig/iptables file. The iptables service is also started so that the
    firewall is activated immediately after saving the options. If Disabled firewall
    was selected, the /etc/sysconfig/iptables file is removed and the iptables service
    is stopped immediately.


    The selected options are also written to the /etc/sysconfig/system-config-securitylevel
    file so that the settings can be restored the next time the application is started.
    Do not edit this file by hand.


    Even though the firewall is activated immediately, the iptables service is not
    configured to start automatically at boot time. Refer to Section 2.8.2.6, "Activating
    the IPTables Service" for more information.


    ## 2.8.2.6. Activating the IPTables Service


    The rules are only active if the iptables service is running. To manually start
    the service, use the following command:


    ```

    [root@myServer] # service iptables restart

    ```


    To ensure that iptables starts when the system is booted, use the following command:


    ```

    [root@myServer] # chkconfig --level 345 iptables on

    ```


    The iptchains is not included in Fedora. However, if iptchains is installed (for
    example, an upgrade was performed and the system has iptables previously), the
    iptchains and iptables services should not be activated simultaneously. To make
    the iptchains service is disabled and configured not to start at boot time, use
    the following two commands:


    ```

    [root@myServer] # service iptchains stop

    [root@myServer] # chkconfig --level 345 iptchains off

    ```


    ## 2.8.3. Using IPTables


    The first step in using iptables is to start the iptables service. Use the following
    command to start the iptables service:


    ```

    [root@myServer] # service iptables restart

    ```


    ## Chapter 2. Securing Your Network


    > Note

    The iptables service can be turned off if you intend to use the iptables service
    only. if you deactivate the iptables service, remember to deactivate the IPv6
    network also. Never leave a network device active without the matching firewall.


    To force iptables to be active by default when the system is booted, use the following
    command:


    ```

    [root@myServer ~] # hkconfig --level 34 iptables on

    ```


    This forces iptables to start whenever the system is booted runlevel 3, 4, or
    5.


    ## 2.8.3.1. IPTables Command Syntax


    The following iptables command illustrates the basic command syntax:


    ```

    [root@myServer ~] # iptables -A <chain> -j <target>

    ```


    The -A option specifies the rule to be appended to <chain>. Each chain is comprised
    of one or more rules, and is therefore known as a ruleset.


    The three built-chains are INPUT, OUTPUT, and FORWARD. These chains are permanent
    and cannot be deleted. The chain specifies the point at which a packet is manipulated.


    The -j <target> option specifies the target of the rule; i.e., what to do if the
    packet matches the rule. Examples of built-in targets are ACCEPT, DROP, REJECT.


    Refer to the iptables man page for available chains, options, and targets.


    ## 2.8.3.2. Basic Firewall Policy


    Establishing basic firewall policies creates a foundation for building more detailed,
    user-defined rules.


    Each iptables chain is comprised of a default policy, and zero or more rules which
    work in concert with the default policy to define the overall rules for the firewall.
    Security-minded administrators typically implement a default policy of DROP, and
    allow only specific packets on a case-by-case basis. For example, the following
    policies block all incoming and outgoing traffic on a network gateway:


    ```

    [root@myServer ~] # iptables -P INPUT DROP

    [root@myServer ~] # iptables -P OUTPUT DROP

    ```


    It is also recommended that forwarded packets -- network traffic is to be routed
    from the firewall to its destination node -- denied to restrict internal clients
    from inadvertent exposure to the Internet. To do this, use the following rule:


    ```

    [root@myServer ~] # iptables -P FORWARD DROP

    ```


    When you have established the default policies for each chain, you can create
    and save further rules for your particular network and security requirements.


    The following sections describe how to save iptables rules and outline some of
    the rules you might implement in the course of building your iptables firewall.


    ## 2.8.3.3. Saving and Restoring IPTables Rules


    Changes to iptables are transitory; if the system is rebooted or if the iptables
    service is restarted, the rules are automatically flushed and reset. To save the
    rules so that they are loaded when the iptables service is started, use the following
    command:


    ```

    root@myServer ~ # service iptables save

    ```


    The rules are stored in the file /etc/sysconfig/iptables and are applied whenever
    the service is started or the machine is rebooted.


    ## 2.8.4. Common IPTables Filtering


    Preventing remote attackers from accessing a LAN is one of the most important
    aspects of network security. The integrity of the LAN should be protected from
    malicious remote users through the use of stringent firewall rules.


    With, a default policy to block all incoming, including outgoing, and forwarded
    packets, it is impossible for the firewall/gateway and internal LAN users to communicate
    with each other or with external resources.


    To allow users to perform network-related functions and to use networking applications,
    administrators must open certain ports for communication.


    For example, to access port 80 on the firewall, apply the following rule:


    ```

    root@myServer ~ # iptables -A INPUT -p tcp -m tcp --dport 80 -j ACCEPT

    ```


    This allows users to browse websites that communicate using the standard port
    80. To access secure websites (for example, https://www.example.com/), you also
    need to provide access to port 443, as follows:


    ```

    root@myServer ~ # iptables -A INPUT -p tcp -m tcp --dport 443 -j ACCEPT

    ```


    > ### Important

    When creating an iptables ruleset, order is important.

    If a rule specifies that any packets from the 192.168.1.0/24 are dropped, they
    will be processed before any allow rules.


    If a rule specifies that any packets from the 192.168.1.0/24 are allowed, they
    will be processed before any drop rules.


    To ensure the correct order, use the -I option to insert rules at the beginning
    of the chain instead of -A to append them to the end. For example:


    ```

    root@myServer ~ # iptables -I INPUT 1 -p tcp -s 192.168.1.0/24 --dport 22 -j ACCEPT

    ```


    This ensures that SSH access from the local network is permitted before any general
    drop policy.


    ## Chapter 2. Securing Your Network


    There may be times when you require access to LAN. Secure services, for example,
    SSH, can be used for encrypted communication.


    Administrators with broadband connections, such as a single PC directly connected
    to the Internet or via firewall/gateway, configure iptables to allow specific
    traffic. For example, the following rules allow remote SSH:


    ```

    @myServer ~ # iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    @myServer ~ # iptables -A OUTPUT -p tcp --sport 22 -j ACCEPT

    ```


    These rules allow outbound access for an individual system, such as a PC directly
    connected to the Internet. However, they do not allow nodes beyond the firewall/gateway.
    To allow LAN access to these services, you can use Network Address Translation
    (NAT) with iptables filtering.


    ## 2.8.5. FORWARD AND NAT Rules


    Most ISPs have only a limited number of public IP addresses to the organizations
    they serve.


    Administrators must, therefore, find alternative to share access to Internet services
    without giving public IP addresses the most common all nodes on a LAN.


    Edge routers (such as firewalls) can receive incoming transmissions from the Internet
    and route the packets to the intended LAN node. At the same time, firewalls/gateways
    can route outgoing requests from a LAN node to the remote Internet.


    This forwarding of traffic can be dangerous at times, especially with the availability
    of modern cracking tools that can spoof IP addresses and make the attacker''s
    machine act as a node on your LAN.


    To prevent this, iptables provides routing and forwarding policies that can be
    implemented to prevent abnormal usage of network resources.


    The FORWARD chain allows an administrator to control which packets can be routed
    within a LAN. For example, to allow forwarding for the entire LAN (assuming the
    firewall/gateway is assigned an internal IP address on eth0), use the following
    rules:


    ```

    @myServer ~ # iptables -A FORWARD -i eth1 -j ACCEPT

    @myServer ~ # iptables -A FORWARD -o eth1 -j ACCEPT

    ```


    This rule governs the firewall/gateway access to the internal network. The gateway
    routes packets from one LAN node to its destination node, passing all packets
    through its eth1 device.


