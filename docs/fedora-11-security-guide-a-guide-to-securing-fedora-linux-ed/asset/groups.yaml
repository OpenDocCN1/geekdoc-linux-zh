    ## 第 3 章 在 GNOME 中加密 GPG 密钥


    ### 3.9.1. 在 GNOME 中创建 GPG 密钥


    安装 Seahorse 工具，它可以让 GPG 密钥管理变得简单。等待 PackageKit 启动。进入系统 > 管理 > 添加/删除软件，在框中搜索 Seahorse
    并点击选择。勾选“seahorse”软件包旁的复选框并选择“应用”以添加软件。您也可以通过命令 `sudo d yum install seahorse`
    在命令行安装 Seahorse。


    要创建密钥，从“应用程序 > 杂项”菜单中选择“密码和加密密钥”，这将启动 Seahorse 应用程序。从“密钥”菜单选择“创建新...”，然后选择“GPG”，最后点击“继续”。输入您的全名、电子邮件地址以及一个可选的注释，用于描述您的身份（例如：John
    C. Smith, smith@example.com, The Man）。点击“创建”。将弹出一个对话框要求为密钥设置密码。选择一个既强大又容易记住的密码。点击“确定”，密钥即已创建。


    > 警告

    > 如果您忘记了密码，该密钥将无法使用，任何使用该密钥加密的数据都将丢失。


    要查找您的 GPG 密钥 ID，请查看新创建密钥对应的“密钥 ID”列。在大多数情况下，如果被要求输入密钥 ID，您应该在密钥 ID 前加上“0x”，例如“0x6789ABCD”。您应该对您的私钥进行备份并将其存储在安全的地方。


    ### 3.9.2. 在 KDE 中创建 GPG 密钥


    从主菜单选择“应用程序 > 工具 > 加密工具”启动 KGPG 程序。如果您从未用过 KGPG，请按照引导完成创建自己的 GPG 密钥环的过程。对话框会提示您创建一个新的密钥对。输入您的姓名、地址和可选的注释。您还可以为密钥选择过期时间，以及密钥强度（位数）和算法。下一个对话框会提示您输入密码。此时，您的密钥将出现在
    KGPG 窗口中。


    > 警告

    > 如果您忘记了密码，该密钥将无法使用，任何使用该密钥加密的数据都将丢失。


    要查找您的 GPG 密钥 ID，请查看新创建密钥对应的“密钥 ID”列。在大多数情况下，如果被要求输入密钥 ID，您应该在密钥 ID 前加上“0x”，例如“0x6789ABCD”。您应该对您的私钥进行备份并将其存储在安全的地方。


    ### 3.9.3. 使用命令行创建 GPG 密钥


    使用以下命令：`gpg --gen-key`


    此命令生成一个包含公钥和私钥的密钥对。其他人使用您的公钥来验证和/或解密您的通信。请尽可能地分发您的公钥，特别是发送给那些您认为会接收您的真实通信的人员，例如邮件列表。例如，Fedora
    文档项目要求参与者在自介绍中包含一个 GPG 公钥。


    ## 使用命令行创建 GPG 密钥


    一系列提示将引导您完成整个过程。如果需要，按 **Enter** 键来分配一个值。第一个提示让您选择偏好的密钥类型：


    请选择您想要的密钥类型：(1) DSA 和 ElGamal (默认) (2) DSA (仅限签名) (4) RSA (仅限签名) 您的选择是？？在所有情况下，默认都是正确的选择。DSA/ElGamal
    密钥允许您不仅对通信进行签名，还可以加密文件。


    接下来，选择密钥大小：最小密钥大小为 768 位，默认密钥大小为 1024 位，建议密钥大小为 2048 位。您想要密钥大小？(1024) 再次，默认值对几乎所有用户都是足够的，并代表了“极强”的安全级别。


    接下来，密钥何时过期。使用默认值（“无”）选择过期日期是一个好主意。例如，如果密钥上的电子邮件地址失效，过期日期将提醒他人停止使用该公钥。


    请指定密钥的有效期。0 = 密钥不过期 2 = 密钥若干天后过期 w = 密钥若干周后过期 m = 密钥若干月后过期 y = 密钥若干年后过期 y 有期为：


    输入值 **1y** 将使密钥有效期一年（如果您改变主意，可以在密钥生成后更改此过期日期）。


    在 **gpg** 命令询问签名信息之前，会显示以下提示：**这是否正确 (y/n)** 输入 **y** 完成过程。


    接下来，输入您的姓名和地址。如果您作为真实个人进行身份验证，请记住这个过程。出于这个原因，请包含您的真实姓名。不要使用别名或代号，因为这可能会模糊您的身份。


    为您的 GPG 密钥输入电子邮件地址。如果您选择虚假地址，他人将难以找到您的公钥来验证您的通信。如果您在邮件列表的 [DocsProject/Selfintroduction]
    中使用此 GPG 密钥，请输入您在该列表中使用的电子邮件地址。


    使用注释字段包含别名或其他信息。（某些人为不同目的使用不同的密钥，并用注释标识每个密钥，例如“办公”或“源项目”。）


    在确认提示处，如果所有输入项都正确，输入字母 O 继续，或者使用其他字母修复任何问题。最后，为您的密钥密钥输入密码。**gpg** 程序允许您输入两次密码以确保没有拼写错误。


    最后，**gpg** 会生成随机数据。


    ## 4. 信息安全通用原则


    以下通用原则提供了安全概述：


    - 对通过网络传输的数据进行加密，以防止中间人攻击和窃听。

    - 最小化安装和运行的软件。

    - 使用增强安全的软件和工具，例如用于强制访问控制 (MAC) 的 SELlinux、用于包过滤的 Netfilter iptables (防火墙)，以及用于加密文件的
    GNU 隐私卫士 (GPG)。

    - 如果可能，将每个网络服务运行在独立的系统上，以降低服务被破坏后影响其他服务的风险。

    - 维护用户账户：创建并执行强密码策略；删除未使用的用户账户。

    - 定期检查系统和应用程序日志。默认情况下，安全日志被写入 /var/log/secure 和 /var/log/audit/log。注意：发送到专用日志服务器可以防止攻击者轻易修改日志以规避检测。

    除非绝对必要，否则不要以 root 身份登录。建议管理员使用 sudo 执行命令。


    ### 4.1. 提示、指南和工具


    国家安全局 (NSA) 为许多操作系统提供了加固指南和提示，帮助政府机构、企业和个人保护其系统。以下指南（PDF 格式）为 Red Enterprise Linux
    5 提供指导：


    - Red Enterprise Linux 5 加固提示

    - Red Enterprise Linux 5 安全配置指南


    信息系统 (ISA) 提供文档、检查清单和测试以帮助保护您的系统（信息保障支持环境）。安全技术实施指南（PDF）是一份针对 UNIX 安全非常具体的指南 -
    需要高级 UNIX 知识，并建议阅读此指南。


    DISA UNIX 安全检查清单版本 5，发布 1.16 提供了一系列文档和检查清单，涵盖了从正确的所有权和权限到补丁控制的内容。


