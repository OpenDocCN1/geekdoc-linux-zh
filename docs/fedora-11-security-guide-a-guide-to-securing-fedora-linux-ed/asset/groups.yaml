    ## Chapter 3. Encryption GPG Keys in GNOME


    ### 3.9.1. Creating GPG Keys in GNOME


    Install the Seahorse utility, which makes GPG key management easier. Wait for
    PackageKit to start. Enter System > Administration > Add/Remove Software and search
    for Seahorse in the text box before clicking Select. Select the checkbox next
    to the "seahorse" package and select "Apply" to add the software. You can also
    install Seahorse at the command line with the command `sudo d yum install seahorse`


    To create a key, from the "Applications > Accessories" menu select "Passwords
    and Encryption Keys", which starts the application Seahorse. From the "Key" menu
    select "Create New...", then "GPG" then click "Continue". Type your full name,
    email address, and an optional comment describing who you are (e.g. John C. Smith,
    smith@example.com, The Man). Click "Create". A dialog is displayed asking for
    a passphrase for the key. Choose a strong passphrase but also easy to remember.
    Click "OK" and the key is created.


    > Warning

    > If you forget your passphrase, the key cannot be used and any data encrypted
    using that will be lost.


    To find your GPG key ID, look in the "Key ID" column to the newly created key.
    In most cases, if you are asked for the key ID, you should prepend "0x" to the
    key ID, as in "0x6789ABCD". You should make a backup of your private key and store
    it somewhere secure.


    ### 3.9.2. Creating GPG Keys in KDE


    Start the KGPG program from the main menu selecting Applications > Utilities >
    Encryption Tool. If you have never used KGPG before, follow the walks through
    the process of creating your own GPG keyring. A dialog box prompts you to create
    a new key pair. Enter your name, address, and an optional comment. You can also
    choose an expiration time for your key, as well as the key strength (number of
    bits) and algorithms. The next dialog prompts you for your passphrase. In this
    point, your key appears in the KGPG window.


    > Warning

    > If you forget your passphrase, the key cannot be used and any data encrypted
    using that will be lost.


    To find your GPG key ID, look in the "Key ID" column to the newly created key.
    In most cases, if you are asked for the key ID, you should prepend "0x" to the
    key ID, as in "0x6789ABCD". You should make a backup of your private key and store
    it somewhere secure.


    ### 3.9.3. Creating GPG Keys Using the Command Line


    Use the following command: `gpg --gen-key`


    This command generates a key pair that consists of a public and a private key.
    Other people use your public key to authenticate and/or decrypt your communications.
    Distribute your public key as widely as possible, especially to people you will
    know to receive authentic communications from you, such as a mailing list. The
    Fedora Documentation Project, for example, asks participants to include a GPG
    public key in their self-introduction.


    ## Creating GPG Keys Using the Command Line


    A series of prompts directs you through the process. Press the **Enter** to assign
    a value if desired. The first prompt asks you to select what kind of key you prefer:


    Please select what kind of key you want: (1) DSA and ElGamal (default) (2) DSA
    (sign only) (4) RSA (sign only) Your selection? In all cases, the default is the
    correct choice. A DSA/ElGamal key allows you not to sign communications, but also
    to encrypt files.


    Next, choose the key size: minimum keysize is 768 bits default keysize is 1024
    bits suggested keysize is 2048 bits What keysize do you want? (1024) Again, the
    default is sufficient for almost all users, and represents an “extremely” strong
    level of security.


    Next, when the key will expire. It is a good idea to choose an expiration date
    using the default, which is "none." If, for example, the email address on the
    key becomes invalid, an expiration date will remind others to stop using that
    public.


    Please specify how the key should be valid. 0 = key does not expire 2 = key expires
    in days w = key expires in weeks m = key expires in months y = key expires in
    years y is valid for?:


    Entering a value of **1y**, makes the key valid for one year (You may change this
    expiration date after the key is generated, if you change your mind.)


    Before the **gpg** command asks for signature information, the following prompt
    appears: **Is this correct (y/n)** Enter **y** to finish the process.


    Next, enter your name and address. Remember this process if you are authenticating
    as a real individual. For this reason, include your real name. Do not use aliases,
    or handles, since this could obscure your identity.


    Enter your email address for your GPG key. If you choose a bogus address, it will
    be more difficult for others to find your public key. This authenticating your
    communications. If you are using this GPG key for [DocsProject/Selfintroduction]
    on a mailing list, enter the email address you use on that list.


    Use the comment field to include aliases or other information. (Some people use
    different keys for different purposes and identify each key with a comment, such
    as “Office” or “Source Projects.”)


    At the confirmation prompt, enter the letter O to continue if all entries are
    correct, or use the other to fix any problems. Finally, enter a passphrase for
    your secret key. The **gpg** program allows you to enter passphrase twice to ensure
    you made no typing errors.


    Finally, **gpg** generates random data.


    ## 4. General Principles of Information Security


    The following general principles provide an overview of good security:


    - encrypt all data transmitted over networks to prevent man-in-the-middle attacks
    and eavesdropping.

    - minimize the amount of software installed and running services.

    - use security-enhancing software and tools, for example, Security-Enhanced Linux
    (SELinux) for Mandatory Access Control (MAC), Netfilter iptables for packet filtering
    (firewall), and the GNU Privacy Guard (GPG) for encrypting files.

    - if possible, run each network service on a separate system to minimize the risk
    of compromised service used to compromise other services.

    - maintain user accounts: create and enforce a strong password policy; delete
    unused user accounts.

    - routinely review system and application logs. By default, security-relevant
    logs are written to /var/log/secure and /var/log/audit/log. Note: sending to a
    dedicated log server prevents attackers from easily modifying logs to avoid detection

    never log in as root unless absolutely necessary. It is recommended that administrators
    use sudo to execute commands when required. Users capable of running sudo are
    specified in /etc/sudoers. We use the visudo to edit /etc/sudoers.


    ### 4.1. Tips, Guides, and Tools


    The National Security Agency (NSA) provides hardening guides and tips for many
    operating systems, to help government agencies, businesses, and individuals secure
    their systems. The following guides (in PDF format) provide guidance for Red Enterprise
    Linux 5


    - Hardening Tips for the Red Enterprise Linux 5

    - Guide to the Secure Configuration of Red Enterprise Linux 5


    The Information Systems Agency (ISA) provides documentation, checklists, and tests
    to help secure your system (Information Assurance Support Environment). The SECURITY
    TECHNICAL IMPLEMENTATION GUIDE (PDF) is a very specific guide to UNIX security
    - an advanced knowledge of UNIX and is recommended for reading this guide.


    The DISA UNIX Security Checklist Version 5, Release 1.16 provides a collection
    of documents and checklists, ranging from the correct ownership and modes for
    systems, to patch control.

