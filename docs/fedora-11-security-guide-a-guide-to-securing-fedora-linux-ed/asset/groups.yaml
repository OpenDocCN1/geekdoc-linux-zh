    ## 1.5. Security Updates


    As security vulnerabilities are discovered, the affected software must be updated
    in order to limit potential security risks. If the software is part of a package
    within a Fedora distribution that is currently supported, Fedora is committed
    to releasing updated packages that fix the vulnerability as soon as is possible.
    Often, announcements about a given security exploit are accompanied with a patch
    (or source code that fixes the problem). This patch is then applied to the Fedora
    package and tested and released as an errata update. However, if an announcement
    does not include a patch, a developer first works with the maintenance of the
    software to fix the problem. Once the problem is fixed, the package is tested
    and released as an errata update.


    If an errata update is released for software on your system, it is highly recommended
    that you update the affected packages as soon as possible to minimize the amount
    of time the system is potentially vulnerable.


    ## 1.5.1. Updating Packages


    When updating software on a system, it is important to download the update from
    a trusted source. An attacker can easily rebuild a package with the same version
    number as the one that is supposed to fix the problem but with a different security
    exploit and release it on the Internet. If this happens, security measures such
    as verifying files against the original RPM do not detect the exploit. Thus, it
    is very important to only download RPMs from trusted sources, such as Fedora and
    to check the signature of the package to verify its integrity.


    > Note

    > Fedora includes a convenient icon that displays visible alerts when there is
    an update for a Fedora system.


    ## 1.5.2. Verifying Signed Packages


    All Fedora packages are signed with the Fedora GPG key. GPG stands for GNU Privacy
    Guard, or GnPG, a free software package used for ensuring the authenticity of
    distributed files. For example, a private key (secret) locks the package while
    the public key unlocks and verifies the package. If the public key distributed
    by Fedora does not match the private key during RPM verification, the package
    may have been altered and therefore cannot be trusted.


    The RPM utility within Fedora automatically tries to verify the GPG signature
    of an RPM package before installing it. If the GPG key is not installed, import
    it from a secure, static location, such as an Fedora installation CD-ROM or DVD.


    Assuming the disc is mounted at /mnt/cdrom, use the following command to import
    it into the keyring (a database of keys on the system):


    ```

    rpm --import /mnt/cdrom/RPM-GPG-KEY

    ```


    To display a list of all keys installed for RPM verification, execute the following
    command:


    ```

    rpm -qa gpg-pubkey*

    ```


    The output will look similar to the following:


    ```

    gpg-pubkey-db42a60e-37ea538

    ```


    To display a specific key, use the rpm -qi command followed by the output from
    the previous command, as in this example:

    '
  mdcn: '


    ## 1.3.4.2. 易受客户端应用程序


    尽管管理员可能拥有完全安全且经过修复的服务器，但这并不意味着远程用户在访问它时是安全的。例如，如果服务器在公共网络上运行 Telnet 或 FTP 服务，攻击者可以捕获在网络上传输的明文格式的用户名和密码，然后使用这些账户信息访问远程用户的工作站。


    即使使用 SSH 等安全协议，如果远程用户不更新其客户端应用程序，也可能受到某些攻击。例如，v.1 版本的 SSH 客户端容易受到来自恶意 SSH 服务器的
    X 转发攻击。一旦连接到服务器，攻击者就可以通过网络捕获客户端的任何按键记录和鼠标点击。这个问题在 v.2 SSH 协议中已得到修复，但需要用户自己跟踪哪些应用程序存在漏洞并根据需要进行更新。


    第 2.1 节“工作站安全”更详细讨论了管理员和家庭用户应该采取哪些步骤来限制计算机工作站的脆弱性。


    ## 1.4. 常见漏洞与攻击


