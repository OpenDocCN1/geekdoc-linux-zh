    # 2.6. Domain-to-Realm Mapping


    When a client attempts to access a service running on a particular server, it
    knows the name of the service (host) and the name of the server (foo.com), but
    because more than one may be deployed on your network, it must get the name of
    the realm in which the service resides.


    By default, the name of the realm is taken to the DNS name of the server, upper-case.


    ```

    foo.example.org — EXAMPLE.ORG

    foo.example.com — EXAMPLE.COM

    foo.example.com — EXAMPLE.COM

    ```


    In some configurations, this will be sufficient, but in others, the realm which
    is derived from the name of a non-existent realm. In these cases, the mapping
    from the server''s DNS domain name to the name of its must be specified in the
    domain_realm section of the client''s system krb5.conf. For example:


    ```

    [domain_realm]

    .example.com = EXAMPLE.COM

    example.com = EXAMPLE.COM

    ```


    The above configuration specifies two mappings. The first mapping specifies that
    any system in the "example.com" DNS domain belongs to the EXAMPLE realm. The second
    specifies that a system with the exact name "example.com" is also in the realm.
