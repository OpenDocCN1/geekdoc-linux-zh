    # 第 2 章 保护网络安全


    - pam_console — 描述 `pam_console.so` 模块的作用。它还描述了 PAM 配置文件条目的正确语法。


    - console.apps — 描述 `/etc/security/console.apps` 配置文件的格式和可用选项，该文件定义了 PAM 分配给控制台用户的可用应用程序。


    - console.perms — 描述 `/etc/security/console.perms` 配置文件的格式和可用选项，该文件指定了 PAM 分配给控制台用户的权限。


    - pam_timestamp — 描述 `pam_timestamp.so` 模块。


    - /usr/share/doc/pam-<version-number> — 包含系统管理员指南》、《模块编写者手册》、《应用程序开发者手册》，以及 PAM
    标准 DE-RFC 80 的副本，其中 `<version-number>` 是 PAM 的版本号。


    - /usr/share/doc/pam-<version-number>/txts/README.txt — 包含关于 `pam_timestamp.so`
    模块的信息，其中 `<version-number>` 是 PAM 的版本号。


    ## 2.4.8.2. 有用的 PAM 网站


    - http://www.kernel.org/pub/linux/pams/ — Linux-PAM 项目的主要发布网站，包含 PAM 模块信息、常见问题解答（FAQ）以及额外的
    PAM 文档。


    > 注意

    上述网站中的文档针对最后发布的上游 PAM 版本，对于 Fedora 中包含的 PAM 版本可能并非 100% 准确。


    ## 2.5. TCP Wrappers 和 xinetd


    控制网络服务的访问是服务器管理员面临的最重要安全任务之一。Fedora 为此提供了若干种工具。例如，基于 `iptables` 的防火墙可以过滤内核网络栈中的网络数据包。对于利用它的网络服务，TCP
    Wrappers 通过定义哪些主机允许或不允许连接到“封装（wrapped）”网络服务来增加额外的保护层。其中一个网络服务就是 `xinetd` 超级服务器。该服务被称为超级服务器是因为因为它控制对网络服务子集的连接并精细化访问控制。


    图 2.9 “网络服务的访问控制”是这些工具如何协同工作保护网络服务的基本插图。


    ## TCP Wrappers


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_78_0.png)


    图 2.9. 网络服务的访问控制


    本章重点关注 TCP Wrappers 和 xinetd 在控制网络服务访问中的作用，并回顾了如何使用这些工具来增强日志记录和利用管理。有关使用 iptables
    使用防火墙的信息，请参阅第 2.9 节“IPTables”。


    ### 2.5.1. TCP Wrappers


    TCP 包 (tcp_wrappers) 默认安装，为网络服务提供基于主机的访问控制。该包中最重要的组件是 `/usr/lib/libwrap.library`。通常来说，TCP
    封装的服务是指针对 `libwrap` 库编译的服务。


    当对封装的 TCP 服务发起连接尝试时，该服务首先引用主机的访问文件 `/etc/hosts.allow` 和 `/etc/hosts.deny` 来确定客户端是否允许连接。在大多数情况下，它使用
    syslog 守护进程 (syslog) 将请求客户端的名称和请求的服务名称写入 `/var/log/secure` 或 `/var/log/messages`。


    如果允许客户端连接，TCP Wrappers 将释放对请求服务的控制权，并且不再参与客户端与服务器之间的通信。


    除了访问控制和日志记录外，TCP Wrappers 可以在拒绝或释放对请求网络服务的控制权之前，执行命令与客户端进行交互。


    由于 TCP Wrappers 是任何服务器管理员安全工具箱中宝贵补充，Fedora 中的大多数网络服务都链接到了 `libwrap.a` 库。此类应用程序包括
    `/usr/sbin/sshd`、`/usr/sbin/sendmail` 和 `/usr/sbin/xinetd`。


    > 注意

    要确定某个服务是否链接到 libwrap，请输入命令：

    ```bash

    ldd <binary-name> | grep wrap

    ```

    将 `<binary-name>` 替换为服务的名称。如果输出显示 libwrap，则该服务已链接到该库。


    ## 2.5.1. TCP Wrappers 的优势


    与其他管理网络服务访问的技术相比，TCP Wrappers 提供了以下优势：


    - 多协议的集中化管理 — TCP Wrappers 允许为各种服务提供一套公共访问规则。

    - 使用方便 — 无需重启网络服务即可修改访问规则。

    - 日志记录 — 所有的连接尝试都可以记录以供审计。


    ## 2.5.2. Wrappers 配置文件


    为了确定客户端是否允许连接，TCP Wrappers 引用两个文件，通常称为 `hosts.allow` 和 `hosts.deny`。


    当被 TCP Wrappers 封装的服务接收到请求时，它执行以下步骤：


    1. 它引用 `/etc/hosts.allow`。服务顺序解析该文件。如果发现匹配的规则，则允许连接。如果没有，则进入下一步。

    2. 它引用 `/etc/hosts.deny`。服务顺序解析该文件。如果发现匹配的规则，则拒绝访问。如果没有，则授予访问。


    使用 Wrappers 时需要考虑的重要点如下：


    - 因为 `hosts.allow` 中的规则首先应用，因此它们的优先级高于 `hosts.deny` 中的规则。

    - 每个文件中的规则从上到下读取，对于给定服务的第一个匹配规则是唯一生效的规则。

    - 如果在两个文件中都没有找到该服务的规则，或者两个文件都不存在，则授予访问。

    - TCP 封装的服务不缓存访问文件的规则，因此对 `hosts.allow` 或 `hosts.deny` 的更改会立即生效。


    > 警告

    如果 hosts 文件的最后一行不是换行符（通过回车键创建），则文件的最后一条规则将失败并将错误记录到 `/var/log/messages` 或 `/var/log/secure`。对于未使用反斜杠跨行的规则也是如此。以下示例说明了这些情况下相关的日志消息部分：


    ```

    warning: /etc/hosts.allow, line 20: missing newline

    ```


    ### 2.5.2.1. 访问规则格式


    `/etc/hosts.allow` 和 `/etc/hosts.deny` 的格式相同。每个规则必须单独一行。以井号 (#) 开头的空会被忽略。


    每个规则使用以下基本格式控制网络服务的访问：


    ```

    <daemon list> <client list> [: <option>: <option>: ...]

    ```


    - **daemon list** — 进程名（而非服务名）的逗号分隔列表或 ALL 通配符。守护进程列表也接受运算符（参见第 2.5.2.1.4 节“运算符”）以提供更大的灵活性。

    - **client list** — 受规则影响的主机名、主机 IP 地址、特殊模式或通配符的逗号分隔列表。客户端列表也接受第 2.5.2.1.4 节中列出的运算符，以提供更大的灵活性。

    - **<option>** — 当规则被触发时执行的可选动作或逗号分隔的动作列表。选项字段支持扩展、启动 shell 命令、允许或拒绝访问以及更改日志行为。


    > 注意

    有关上述专业术语的更多信息可以在本指南的其他部分找到：

    - 第 2.5.2.1.1 节，“通配符”


