    # 2.3.5.1. Troubleshooting


    If you have followed the configuration steps above and Negotiate authentication
    is not working, you can turn on verbose logging of the authentication process.
    This could help you find the cause of the problem. Please enable verbose logging,
    use the following procedure:


    +   1. Close all instances of Firefox.


    +   2. Open a command shell, and enter the following commands:


    ```

    export NSRPL_LOG_MODULES=negotiateauth:5

    export NSRPL_LOG_FILE=/tmp/moz.log

    ```


    +   3. Restart Firefox from shell, and see why you were unable to authenticate
    earlier. Information will be logged to /tmp/moz.log, and may give a clue to the
    problem. For example:


    ```

    -1208859444[900380]: entering negotiateauth::GetNextToken()

    -1208859444[900380]: gss_init_context() failed: Miscellaneous failure

    No credentials cache found

    ```


    This indicates that you do not have Kerberos tokens, and to run knit.


    If you are able to run knit successfully from your machine but you are unable
    to authenticate, you might see something like this in the log file:


    ```

    -1208994096[8d63d8]: entering negotiateSSAPI::GetNextToken()

    -1208994096[8d63d8]: gss_init_context() failed: Miscellaneous failure

    Server not found in Kerberos database

    ```


    This generally indicates a Kerberos configuration problem. Make sure that you
    have the correct entries in the [domain] section of the /etc/krb5.conf file. For
    example:


    ```

    .example.com = EXAMPLE.COM

    example.com = EXAMPLE.COM

    ```


    If nothing appears in the log it is possible that you are using a proxy, and proxy
    is stripping off the HTTP headers when you try to connect to the server using
    HTTPS, which allows the request to pass through unmodified. Then proceed to debug
    using the log file, as described above.


    # 2.4. Pluggable Authentication Modules (PAM)


    Programs that grant users access to a system use authentication to verify each
    user''s identity (that is, to establish that a user is who they say they are).


    Historically, each program had its own way of authenticating users. In Fedora,
    many programs are configured to use a centralized authentication mechanism called
    Pluggable Authentication Modules (PAM).


    PAM uses a pluggable, modular architecture, which affords the system administrator
    a great deal of flexibility in setting authentication policies for the system.


    In most situations, the default PAM configuration file for a PAM-aware application
    is sufficient. Sometimes, however, it is necessary to edit a PAM configuration
    file. Because misconfiguration of PAM can compromise system security, it is important
    to understand the structure of these files'
- md: '

    # Chapter 2. Securing Your Network


    before making any modifications. Refer to Section 2.4.3, "PAM Configuration File
    Format" for more information.


    ## 2.4.1. Advantages of PAM


    PAM offers the following advantages:


    - a common authentication scheme

    - significant flexibility and control over authentication for both system administrators
    and application developers

    - a single, fully-documented library which allows developers to write programs
    without having to create their own authentication schemes.


    ## 2.4.2. PAM Configuration Files


    The /etc/pam.d/ directory contains the PAM configuration files for each PAM-aware
    application. In earlier versions of PAM, the /etc/pam.conf file was used, but
    this file is now deprecated and is only used if the /etc/pam.d/ directory does
    not exist.


    ### 2.4.2.1 Service Files


    Each PAM-aware application or service has a file in the /etc/pam.d/ directory.
    Each file in this directory has the same name as the service it controls. The
    PAM-aware program is responsible for defining its service name and installing
    its own PAM configuration file in the /etc/pam.d/ directory.


    ## 2.4.3. PAM File Format


    Each PAM configuration file contains a group of directives formatted as follows:


    ```

    <module interface> <control flag> <module name> <module arguments>

    ```


    Each of these elements is explained in the following sections.


    ### 2.4.3.1 Module Interface


    Four types of PAM module interface are currently available. Each of these corresponds
    to a different aspect of the authorization process:


    - auth — This module authenticates use. For example, it requests and verifies
    the validity of password. Modules with this interface can also set credentials,
    such as group memberships or Kerberos tickets.

    - account — This module verifies that access is allowed. For example, it may check
    if a user account has expired or if a user is allowed to log in at a particular
    time of day.

    - password — This module is used for changing passwords.

    - session — This module configures and manages user sessions. Modules with this
    interface can perform additional tasks that are needed to allow access, like mounting
    a user''s home directory and making the user''s mailbox available.


    Note: An individual module can provide any or all module interfaces. In a PAM
    configuration file, the module interface is the first field defined. For example,
    a typical line in configuration may look like:


    ```

    auth required pam_unix.so

    ```


    This instructs PAM to use the pam_unix.so module''s interface.


    ### 2.4.3.1 Stacking Module Interfaces


    Module interface directives can be stacked, or placed upon one another, so that
    multiple modules are used together for one purpose. A module''s control flag uses
    the "sufficient" or "requisite" value (refer to 2.4.3.2, "Control Flag" for more
    information), then the order in which the modules are listed is the authentication
    process. Stacking makes it easier for the administrator to require specific conditions
    before allowing the user to authenticate. For example, the login command uses
    several modules, as seen in its configuration file:


    ```/etc/pam.d/login

    #PAM-1.0

    auth sufficient pam_rootok.so

    auth required pam_console.so

    include system-auth

    account required pam_permit.so

    ```


    - The first line is a comment and is not processed.

    - auth sufficient pam_rootok.so — This line uses the pam_rootok.so module to check
    if the current user is root by verifying that their UID is 0. If this test succeeds,
    no other modules are considered.

    - auth required pam_console.so — This line uses the pam_console.so module to attempt
    to authenticate the user. If this user is already logged in, pam_console.so checks
    whether there is a file in /etc/security/ with the same name as the service. If
    such a file exists, authentication succeeds and is passed to the next module.

    - include system-auth — This line is commented and is not processed.

    - account required pam_permit.so — This line uses the pam_permit.so module to
    allow the root user or logged in user.


    ## 2.4.3.2. Control Flag


    All PAM modules generate a success or failure result when called. Control flags
    tell PAM what to do with the result. Modules can be stacked in a particular order,
    and the control flags determine how important the success or failure of a particular
    module is to the overall goal of authenticating the user to the service.


    There are four predefined control flags:


    - required — The module result must be successful for authentication to continue.
    If the test fails at this point, the user is not notified until the results of
    all module tests that reference that interface are complete.

    - requisite — The module result must be successful for authentication to continue.
    If a test fails at this point, the user is notified immediately with a message
    reflecting the first failed required or requisite module test.

    - sufficient — The module result is ignored if it fails. However, if the result
    of a module flagged sufficient is successful and no previous modules required
    have failed, then no other results are required and the user is authenticated
    to the service.

    - optional — The module result is ignored. A module flagged optional only becomes
    necessary for successful authentication when no other modules reference the interface.


    Order in which required modules are called is not critical. Only the sufficient
    and requisite control flags cause order to become important.


    A newer control syntax allows for more precision and is now available for PAM.
    The manual located in the /usr/share/doc/pam-<version-number>/ directory, where
    <version-number> is the version number for PAM on your system, describes this
    newer syntax in detail.


    ## 2.4.3.3. Module Name


    The module provides PAM with the pluggable module containing the specified module
    interface. In older versions of Fedora, the full path to the module was provided
    in the PAM configuration file. However, since the advent of multilib systems,
    which store 64-bit PAM modules in the /lib64/security/ directory, the name is
    omitted because the application is linked to the appropriate version of libpam,
    which can locate the correct version of the module.


    ## 2.4.3.4. Module Arguments


    PAM uses arguments to pass information to a pluggable module during authentication
    for modules. For example, the pam_userdb.so module uses information stored in
    a Berkeley DB file to authenticate the user. Berkeley DB is an open source database
    system embedded in many applications. The module takes a db argument so Berkeley
    DB knows which to use for the requested service.


    The following is a typical pam_userdb.so line in a PAM configuration. The <path-to-file>
    is the full path to the Berkeley DB database file:


    ```

    required pam_userdb.so db=<path-to-file>

    ```


    Invalid arguments are *generally ignored* and do not otherwise affect the success
    or failure of the PAM module. Some modules, however, may fail on invalid arguments.
    Most modules report errors to /var/log/secure.


    ## 2.4.4. Sample Configuration Files


    The following is a sample PAM configuration file:


    ```

    #PAM-1.0

    auth required pam_security.so

    auth required pam_unix.so nullock

    auth required pam_nlogin.so

    account required pam_unix.so

    password required pam_cracklib.so retry=3

    session required pam_unix.so

    ```


    - The first line is a comment, indicated by the hash mark (#) at the beginning
    of the line.

    - Lines through four pam_security.so — This module ensures that if the user is
    trying to log in as root, the tty on which the user is logging is listed in the
    /etc/security file, if that file exists. If the tty is not in the file, any attempt
    to log in as root fails with a Login incorrect message.

    - auth required pam_unix.so nullock — This module prompts the user for a password
    and then checks the password using the information stored in /etc/passwd and,
    if it exists, /etc/shadow.

    - The argument null instructs the pam_unix.so module to allow a blank password.

    - auth required pam_nlogin.so — This is the final authentication step. It checks
    whether the /etc/nlogin file exists. If it exists and the user is not root, authentication
    fails.


    Note: In this example, all three auth modules are checked, even if the first auth
    module fails. This prevents the user from knowing what stage their authentication
    fails. Such knowledge in the hands of an attacker could allow them to more easily
    deduce how to crack the system.


    - account required pam_unix.so — This module performs any necessary account verification.
    For example, if password has been enabled, the account interface of the pam_unix.so
    module checks to see if the account has expired or if the user has not changed
    the password within the allowed period.

    - password required pam_cracklib.so retry=3 — If a password has expired, the component
    of the pam_cracklib.so module prompts for a new password. It tests the newly created
    password to see whether it can easily be determined by a dictionary-based password
    cracking program.

