    ## 2.8.7. IPTables and Connection Tracking


    You can use the state module to inspect and filter packets based on their connection
    state. The following states are supported:


    - **NEW**: The packet is part of a new connection.

    - **ESTABLISHED**: The packet is part of an established connection.

    - **RELATED**: The packet is related to an existing connection.

    - **INVALID**: The packet is not part of any known connection.


    For example, to allow only established and related traffic:


    ```

    [root@myServer ~] # iptables -A INPUT -m state --state ESTABLISHED,RELATED -j
    ACCEPT

    ```


    ## 2.8.8. IPv6


    The introduction of the next-generation Internet Protocol, called IPv6, expands
    beyond 32-bit address limit. Fedora supports IPv6 using the ip6tables command.
    In Fedora, both services are enabled.


    ## 2.8.9. Additional Resources


    There are several aspects to firewalls and the Linux Netfilter subsystem that
    could not be covered in this chapter. For more information, refer to the following
    resources:


    ### 2.8.9.1. Installed Firewall Documentation


    - Refer to Section 2.9, ''IPTables'' for more detailed information on the iptables
    command, definitions for many options.

    - The iptables manual contains a brief summary of the various options.


    ### 2.8.9.2. Useful Firewall Websites


    - http://www.netfilter.org/ — The official homepage of the Netfilter

    - http://www.ldp.org/ — The Linux Document Project contains several useful guidelines
    relating to firewall creation and administration.

    - http://www.iana.org/assignments/port-numbers — The official list of registered
    and common service ports assigned by the Internet Assigned Numbers.


    ### 2.8.9.3. Related Documentation


    - Red Hat Linux Firewalls, by Bill McCarthy; Red Hat Press — a comprehensive reference
    to building network and server using source packet filtering technology as Netfilter
    and iptables. It covers topics that analyzing firewall logs, developing firewall
    rules, and customizing your firewall using various graphical tools.

    - Linux Firewalls, by Robert Ziegler; New Riders Press — contains a wealth of
    information on building firewalls using both 2.2 chains as well as Netfilter and
    iptables. Additional security topics such as remote access issues and intrusion
    detection systems are also covered.


    ## 2.9. IPTables


    Included with Fedora are advanced tools for network packet filtering — the process
    of controlling network packets as they enter, move out, and through the network
    stack within the kernel. Kernel versions prior to 2.4 relied on ipchains for packet
    filtering and used lists of rules applied at each step of the filtering process.
    The 2.4 kernel introduced iptables (also called netfilter), which is similar to
    ipchains but greatly expands the scope and control available for filtering network
    packets.

