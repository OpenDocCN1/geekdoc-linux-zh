    # Chapter 2. Securing Your Network


    These directives activate user directory browsing for all users directories other
    than /root/. To add users to the list of disabled accounts, a space-delimited
    list of users on the UserDir disabled line.


    > Important Do not remove the IncludesExec directive. By default, the Server-Side
    Includes (SSI) module cannot execute commands. It is recommended that you do not
