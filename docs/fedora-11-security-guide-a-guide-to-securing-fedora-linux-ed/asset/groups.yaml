    # 第 3 章 加密


    或获取敏感信息的访问。其他私有信息如银行账户信息在跨网络传输时也应受到保护。如果网络会话经过加密，那么你就不必过于担心数据在传输过程中被破解。


    传输中的数据（Data in motion）特别容易受到攻击者的攻击，因为攻击者不需要位于存储数据的计算机附近，而只需要位于传输路径的某处。加密隧道可以保护通信路径。


    ## 3.5. 虚拟专用网络 (VPN)


    虚拟专用网络（VPN）在跨越所有端口的计算机或计算机网络之间提供加密隧道。在使用 VPN 的情况下，来自客户端的所有网络流量都会通过隧道转发到服务器。这意味着客户端在逻辑上与其连接的服务器处于同一网络中。VPN
    非常常见，且易于使用和设置。


    ## 3.6. 安全外壳 (Secure Shell)


    安全外壳 (SSH) 是一种强大的网络协议，用于通过安全通道与其他系统进行通信。通过 SSH 的传输经过了加密，并免受拦截。加密密钥还可用于比传统的用户名和密码提供更好的身份验证方法。


    SSH 非常易于激活。只需启动 `sshd` 服务，系统就会开始接受连接，并在连接过程中提供正确的用户名和密码时允许访问系统。SSH 的标准 TCP 端口为
    22，但可以通过修改配置文件 `/etc/sshd_config` 并重启服务来更改它。该文件还包含 SSH 的其他配置选项。


    安全外壳 (SSH) 也在计算机之间提供加密隧道，但仅使用单个端口。可以在 SSH 隧道上进行端口转发，流量在通过该隧道时会被加密，但端口转发并不像 VPN
    那样灵活。


    ## 3.7. LUKS 磁盘加密


    Linux 统一密钥设置（Linux Unified Key Setup，简称 LUKS）允许你对 Linux 计算机上的分区进行加密。这对于移动计算机和可移动存储介质尤为重要。LUKS
    允许多个用户密钥解密一个主密钥，主密钥用于对分区进行批量加密。


    ### 3.7.1. Fedora 中的 LUKS 实现


    Fedora 9 利用 LUKS 执行文件加密。默认情况下，在安装过程中加密文件系统的选项未勾选。如果你选择了加密硬盘的选项，系统将提示你输入密码短，并在每次启动计算机时都会询问该密码。该密码用于“解锁”用于解密分区的批量加密密钥。如果你选择修改默认分区表，可以选择你想加密的分区。这可以在分区表设置中进行。


    Fedora 默认的 LUKS 实现是 AES 128 配合 SHA256 哈希算法。加密算法包括：


    > 1 [http://www.redhatmagazine.com/2007/11/27/advanced-ssh-configuration-and-tunneling-we-dont-need-no-stinking-vpn-software


    - AES - 高级加密标准 - FIPS PUB 197

    - Twofish（一种 128 位块加密算法）

    - Serpent

    - cast5 - RFC 2144

    - cast6 - RFC 2612


    ### 3.7.2. 手动加密目录


    > 警告

    > 此过程将删除你正在加密的分区上的所有数据。将丢失你所有的信息！在开始此过程之前，请务必将数据备份到外部源！


    ### 如果你运行的是 Fedora 9 版本并想要加密分区，或者你想在安装当前版本的 Fedora 后加密分区，以下说明适用于你。示例演示了如何加密你的
    home 目录，但任何分区都可以使用。


    以下步骤将擦除你所有的现有数据，因此在开始之前确保有一个测试备份。这还需要你为 `/home` 准备一个单独的分（在我的情况下是 `/dev/VG00/LV_home`）。以下所有操作必须以
    root 身份执行。任何一个步骤失败都意味着在该步骤成功之前你不能继续。


    ### 3.7.3. 逐步操作说明


    - 1. 进入运行级别 1：`telinit`

    - 2. 卸载现有的 /home：`umount /home`

    - 3. 如果失败，使用 `fuser` 找到并杀死占用 /home 的进程：`fuser -mk /home`

    - 4. 验证 /home 已不再被挂载：`cat /proc/mounts | grep home`

    - 5. 用随机数据填充分区：`dd if=/dev/urandom of=/dev/VG00/LV_home`。此过程需要数小时才能完成。


    > 重要

    > 然而，为了对入侵尝试提供良好的保护，该过程是必不可少的。只需让它运行一晚即可。


    - 6. 初始化分区：`cryptsetup --verbose --passphrase luksFormat /dev/VG00/LV_home`

    - 7. 打开新加密的设备：`cryptsetup luksopen /dev/VG00/LV_home home`

    - 8. 检查是否存在：`ls -1 /dev/mapper | grep home`

    - 9. 创建文件系统：`mkfs.ext3 /dev/mapper/home`

    - 10. 挂载使其可见：`mount /dev/mapper/home /home`

    - 11. 检查可见性：`df -h | grep home`

    - 12. 在 `/etc/crypttab` 中添加以下：`home /dev/VG00/LV_home none none`

    - 13. 编辑你的 `/etc/fstab`，删除旧的 /home 条目并添加 `/dev/mapper/home /home ext3 defaults
    1 2`

    - 14. 验证你的 fstab

    - 15. 重启系统

    - 16. 登录系统

    - 17. 检查 /home 挂载情况

    - 18. 完成


    '
