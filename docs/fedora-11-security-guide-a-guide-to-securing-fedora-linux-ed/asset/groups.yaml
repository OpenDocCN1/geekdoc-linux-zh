    The next sample hosts rule is more complex and uses two option fields:


    ```

    sshd : .example.com \: spawn /bin/echo \/var/log/sshd.log \: deny

    ```


    Note that each option field is preceded by the backslash (\). Use of the backslash
    prevents failure of the rule due to length.


    This sample rule states that if a connection to the SSH daemon (sshd) is attempted
    from a host in the example.com domain, the echo command to append to a special
    log file, and deny the connection. Because the option deny is used twice it appears
    in the hosts.allow file. Refer to Section 2.5.2.2, "Option Fields" for a more
