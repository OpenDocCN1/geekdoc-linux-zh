    FTP 对远程 shell 的安全性本质上并不危险，但必须对 FTP 服务器进行仔细的配置和监控以避免问题。有关保护 FTP 的更多信息，请参阅[第 2.2.6
    节，“保护 FTP"]()。


    应该仔细实现并置于防火墙后的服务包括：


    - **finger**

    - **authd**（在之前的 Fedora 版本中此称为 **ident**。）

    - **netdup**

    - **netdump**

    - **nfs**

    - **rwhod**

    - **sendmail**

    - **smb** (Samba)

    - **bypasswdd**

    - **ypserv**

    - **ypxfrd**


    有关保护网络服务的更多信息，请参阅[第 2.2 节，“服务器安全"]()。


    下一节将讨论用于设置简单防火墙的工具。


    ## 2.1.6. 个人防火墙


    在配置了必要的网络服务后，实施防火墙是非常关重要的。


    > **重要**

    > 您应该在连接到互联网或任何其他不受信任的网络*之前*，配置必要的服务并实施防火墙。


    防火墙防止网络数据包访问系统的网络接口。如果对防火墙拦截的端口发出请求，该请求将被忽略。如果服务正在监听这些被拦截的端口之一，它将无法接收数据包，并实际上被禁用。因此，在配置防火墙时应注意阻止对未未使用端口的访问，同时不要阻止对配置的服务的服务端口的访问。


    对于大多数用户来说，配置简单防火墙的最佳工具是 Fedora 自带的图形化防火墙配置工具：防火墙配置工具 (system-config-firewall)。该工具使用控制面板界面为通用防火墙创建
    iptables 规则。


    请参阅第 2.2 节“基本防火墙配置”，获取有关使用该应用程序及其可用选项的更多信息。


    对于高级用户和服务器管理员，使用 iptables 手动配置防火墙是更好的选择。请参阅第 2.8 节“防火墙”获取更多信息。请参阅第 2.9 节“IPTables”获取
    iptables 命令的全面指南。


    ## 2.1. 增强安全性的通信工具


    随着互联网规模和普及的增长，通信拦截的威胁也随之增加。多年来，人们开发了工具在通信通过网络传输时对其加密。


    Fedora 自带两个基本工具，它们使用基于公钥加密的高级加密算法来保护在网络中传输的信息。


    - OpenSSH — 用于加密网络通信的 SSH 协议的免费实现。

    - Gnu Privacy Guard (GPG) — 用于加密数据的 PGP（Pretty Good Privacy）加密的免费实现。


    OpenSSH 是访问远程机器更安全的方法，取代了 telnet 和 rsh 等旧的未加密服务。OpenSSH 包含一个名为 sshd 的网络和服务命令行客户端应用程序：


    - ssh — 安全的远程控制台访问客户端。

    - scp — 安全的远程复制命令。

    - sftp — 安全伪 ftp 客户端，允许交互式文件会话。


    有关 OpenSSH 的更多信息，请参阅第 3.6 节“安全 Shell”。


    > 重要

    > 虽然 sshd 服务本质上是安全的，但必须保持服务更新以防止安全威胁。请参阅第 1.5 节“安全更新”获取更多信息。


    GPG 是确保电子邮件通信的一种方法。它可以既用于在公网通过电子邮件发送敏感数据，也可用于保护硬盘上的敏感数据。


    ## 2.2. 服务器安全


    当系统在公共网络上作为服务器使用时，就会成为攻击目标。对于系统管理员来说，加固系统和锁定服务至关重要。


    在深入特定问题之前，查看以下增强服务器安全性的通用建议：


    - 保持所有服务更新，以防止最新的威胁。

    - 尽可能使用安全协议。

    - 尽可能每台机器仅提供一种类型的网络服务。

    - 仔细监控所有服务器的可疑活动。


    ## 2.2.1. 使用 TCP Wrappers 和 xinetd 保护服务


    TCP Wrappers 为各种网络服务提供访问控制。大多数现代网络服务（如 SSH、Telnet 和 FTP）都使用 TCP Wrappers，它在入站请求和请求的服务之间进行守卫。


    当 TCP Wrappers 与 xinetd 配合使用时，其提供的优势会增强，xinetd 是一个超级服务器，提供额外的访问、日志、绑定、重定向和资源利用控制。


    > 将 iptables 防火墙规则与 TCP Wrappers 和 xinetd 结合使用以创建服务访问控制的冗余是一个好主意。请参阅第 2.8 节“防火墙”获取有关使用
    iptables 命令实现防火墙的更多信息。


    以下子节假设对每个主题均有基础知识，并关注特定的安全选项。


    ### 2.2.1.1. 使用 TCP Wrappers 增强安全性


    TCP Wrappers 的功能不仅限于拒绝访问服务。本节说明了如何使用它们发送连接横幅（banners）、警告来自特定主机的攻击以及增强日志功能。请参考
    hosts_options 手页获取相关信息。


    ### 2.2.1.1.1. TCP Wrappers 和连接横幅


    在用户连接时显示合适的横幅是让攻击者知道系统保持警惕的好方法。在本示例中使用 banner 选项。为了实现这一点，在 /etc/ 创建一个文件，内容如下：


    ```

    Hello, %c

    不当的使用将导致您的访问被移除。

    ```


    %c 令牌提供主机名或 IP 地址。为了在入站连接时显示此横幅，在 /etc/hosts.allow 中添加以下行：


    ```

    vsftpd : ALL :

    ```


    ### 2.2.1.1.2. TCP Wrappers 和攻击警告


    如果检测到特定主机或网络正在攻击服务器，可以使用 TCP Wrappers 警告管理员。在本示例中，检测到来自 206.182.68/24 的破解者。在 /etc/hosts.deny
    中放置以下行：


    ```

    ALL : spawn /bin/date %d >> /var/log/intruder_alert

    ```


    %d 令牌提供攻击者尝试访问的服务名称。为了允许连接并进行记录，放置 spawn 指令


    > 注意 由于 spawn 指令会执行任何 shell 命令，因此在特定客户端尝试连接时创建一个特殊脚本是一个好主意。


    ### 2.2.1.1.3. TCP Wrappers 和增强日志


    如果某些类型的连接比其他类型更关注，可以使用 severity 选项提高日志级别。在本示例中，任何尝试连接到服务器端口 23（Telnet 端口）的人都是黑客。为了表示这一点，在日志文件中使用
    emerg 标记 own默认标记 info。要这样做，在 /etc/hosts.deny 中放置以下行：


    ```

    in.telnet : ALL : severity emerg

    ```


    这使用了 authpriv 日志设施，但优先级从默认值 info 提高到 emerg，会将日志直接发布到控制台。


    ## 2.2.1.2. 使用 xinetd 增强安全性


    本节重点介绍使用 xinetd 设置陷阱服务（trap service）并使用它控制任何 xinetd 服务可用的资源级别。为服务设置资源限制有助于防止拒绝服务
    (DoS) 攻击。请参考 xinetd 和 xinetd.conf 页面获取可用选项列表。


    ### 2.2.1.2.1. 设置陷阱


    xinetd 的一个重要功能是能够将主机添加到全局拒绝访问列表（no_access list）。列表上的主机在一段时间内或直到 xinetd 重启之前，被拒绝访问由
    xinetd 管理的服务。您可以使用 SENSOR 属性来实现此功能。这是阻止尝试扫描服务器端口的主机的简单方法。


    设置 SENSOR 的第一步是选择一个您不计划的服务。在本示例中，使用了 Telnet。


    '
