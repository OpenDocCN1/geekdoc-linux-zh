    可以使用某种形式的信息收集工具来构建评估。在评估整个网络时，首先映射第一个主机以找到正在运行的主机。一旦定位，逐一检查每个主机。专注于这些主机需要另一组工具。知道使用哪些工具是发现漏洞最关键的步骤。


    就像日常生活的各个方面一样，有许多不同的工具可以执行相同的工作。这一概念也适用于漏洞评估、系统评估，甚至是网络评估（基于所使用的协议）。某些工具是免费的，另一些则不是。某些工具直观且易于使用，而另一些工具则晦涩且文档匮乏，但具有其他工具所不具备的功能。


    寻找正确的工具可能是一项艰巨的任务，最终，经验至关重要。如果可能，建立一个测试实验室并尝试尽可能多的工具，注意每个工具的优缺点。查看该工具的 README
    文件或页面。此外，可以在互联网上寻找更多信息，例如文章、分步指南，甚至是针对特定工具的邮件列表。


    所讨论的工具只是可用工具的一个样本。


    ### 1.2.3.1. 使用 Nmap 扫描主机


    Nmap 是 Fedora 中包含的一款流行工具，可用于确定网络布局。Nmap 已经存在多年，可能是收集信息时最常用的工具。它包含了一份极佳的地图，提供了其选项和用法的详细描述。管理员可以在网络上使用
    Nmap 来查找系统以及这些系统上的开放端口。


    Nmap 是漏洞评估中一个胜任的首选工具。你可以映射网络内部的主机，甚至扫描允许 Nmap 识别特定主机上的操作系统。Nmap 是建立安全服务策略策略和停止未使用服务的良好基础。


    ## 第 1 章 安全概述


    ### 1.2.3.1.1. 使用 Nmap


    可以在 shell 提示符中输入 nmap 命令，后跟要扫描机器的主机名或 IP 地址来运行 Nmap。


    ```

    nmap foo.example.com

    ```


    扫描结果（可能需要几分钟，取决于主机所在的位置）应该类似于所示：


    ```

    Starting Nmap 4.68 ( http://nmap.org )

    Interesting ports on foo.example.com:

    Not shown: /17 filtered ports

    PORT STATE SERVICE

    22/tcp open ssh

    53/tcp open domain

    70/tcp closed gopher

    80/tcp open http

    113/tcp closed auth

    ```


    Nmap 测试最常见的网络端口是否正在监听或等待服务。这些知识对于想要关闭不必要或未使用服务的管理员很有帮助。


    有关使用 Nmap 的更多信息，请参考以下 URL 的官方主页：


    http://www.insecure.org/


    ## 1.2.3.2. Nessus


    Nessus 是一款全功能安全扫描器。Nessus 的插件架构允许用户针对其系统和网络进行定制。对于任何扫描器来说，Nessus 的好坏取决于它所依赖签名数据库。幸运的是，Nessus
    经常更新，并具有完整的报告、主机扫描和实时漏洞搜索功能。记住，即使是像 Nessus 这样强大且频繁更新的工具，也可能存在误报和漏报。


    > 注意

    > Nessus 客户端和服务器软件包含在 Fedora 仓库中但需要订阅才能使用。它被包含在本文中，供可能感兴趣使用这款流行应用程序的用户参考。


    有关关于 Nessus 的更多信息，请参考以下 URL 的官方网站：


    http://www.nessus.org/


    ## 1.2.3.3. Nikto


    Nikto 是一款优秀的通用网接口 (CGI) 脚本扫描器。Nikto 不仅检查漏洞，而且以规避的方式进行，以规避入侵检测系统。它附有详尽的文档，应在运行程序之前仔细审阅。如果你有设置
    CGI 脚本的 Web 服务器，Nikto 可以作为检查这些服务器安全性的极佳资源。


    有关 Nikto 的更多信息可以在以下 URL ：


    http://www.cirt.net/code/nikto.shtml


    ## 1.2.3.4. VLAD 扫描器


    VLAD 是由 Bindview, Inc. 的 RAZOR 团队开发的漏洞扫描器，检查 Sans Top 常见安全问题列表（SNMP 问题、文件共享问题等）。虽然功能没有
    Nessus 多样，但 VLAD 值得研究。


    > 注意

    > Vlad 未包含在 Fedora 中且不受支持。它被包含在本文中，供可能感兴趣使用这款流行应用程序的用户参考。


    有关 VLAD 的更多信息可以在 RAZOR 团队网站找到：


    http://www.bindview.com/Support/Razor/


    ## 1.2.3.5. 预测你的未来需求


    根据你的目标和资源，有很多可用工具。有无线网络、Windows 系统、Linux 系统以及其他工具。评估的另一个重要部分可能是审查物理安全、人员安全或 VoIP/PBX
    网络评估。新概念，如“战行”（war walking），涉及扫描企业物理结构的无线网络，这些是你可以调查并在需要时纳入评估的新概念。想象力和暴露是规划和进行漏洞评估的唯一限制。


    ## 1.3 攻击者与漏洞


    为了规划和实施良好的安全策略，首先要意识到有动机的攻击者利用漏洞破坏系统。然而，在详细介绍这些问题之前，必须定义识别攻击者时使用的术语。


    ### 1.3.1. 黑客简史


    “黑客”一词的现代含义可以追溯到 20 世纪 60 年代的理工学院（MIT）技术成员铁路俱乐部，该俱乐部设计了比例精确、细节复杂的火车模型。黑客是对发现解决问题的巧妙技巧或变通方案的俱乐部成员的称呼。


    从那以后，这个词已被用来描述从电脑爱好者到天才程序员的各种群体。黑客的一个共同特征是愿意解释计算机系统和网络是如何工作的，且几乎没有外部动因。开源软件开发者通常认为自己和同事是黑客，并将该词视为尊重的标志。


    通常，黑客遵循某种形式的黑客伦理，该伦理规定对信息和专业知识的追求是必不可少的，分享这些知识是黑客对社区的责任。在追求知识的过程中，许多人喜欢绕过计算机系统安全控制的挑战。因此，媒体经常使用“黑客”一词来描述那些……对于这种类型的黑客，更准确的术语是“破解者”（cracker）——这是一个由黑客在
    80 年代中期创建的词，用于区分这两个群体。

    '
