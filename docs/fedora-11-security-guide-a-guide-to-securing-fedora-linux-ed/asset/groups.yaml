    # Firewalls


    PC to data center solutions safeguarding vital enterprise information. Firewalls
    can be stand-alone hardware solutions, such as firewall appliances by Cisco, Nokia,
    and Sonicwall. Vendors such as Checkpoint, McAfee, and Symantec have also developed
    proprietary software firewall solutions for home and business markets.


    Apart from the differences between hardware and software firewalls, there are
    also differences in the way firewalls function that separate one solution from
    another. Table 2.2, "Firewall Types" details three common types of firewalls and
    how they function:


    | Method | Description | Advantages | Disadvantages |

    | --- | --- | --- | --- |

    | NAT | Network Address Translation (NAT) places IP subnet behind one or small
    pool of public addresses, masquerading all requests to one source rather than
    several. The Linux kernel has built-in functionality through the Netfilter kernel.
    | - Can be configured transparently to machines on a LAN - Protection of many
    machines and services behind one or more IP addresses simplifies administration
    duties - Restriction of user access to and LAN can be configured by opening and
    closing ports on the NAT firewall/gateway | - Cannot prevent malicious activity
    once users connect to a service outlet of the firewall |

    | Packet Filter | A packet filtering reads each data packet that passes through
    a LAN. It can read and process packets by header information and filters the packet
    based on sets of programmable rules implemented by the firewall administrator.
    The Linux kernel has built-in packet filtering functionality through the Netfilter
    kernel | - Customizable through the iptables front-end - Does not require customization
    on the client side, as all network activity is filtered at the router level rather
    than the application level - Since packets are not transmitted through a proxy,
    network performance is faster due to direct connection from client to remote host
    | - Cannot filter packets for content like proxy firewalls - Processes packets
    at the protocol layer, cannot filter packets at an application layer - Complex
    network architectures can make establishing firewall rules difficult, especially
    if coupled with IP mapping or local subunits and DNS networks |

    | Proxy | Proxy firewalls all requests of a protocol or from LAN clients to a
    proxy, which makes those requests to the Internet behalf of the local client.
    A proxy machine acts as a buffer between malicious users and the internal network
    client machines. | - Gives control over what applications and protocols function
    outside of the LAN - Some servers cache frequently-accessed data locally rather
    than using the Internet to request it. It helps to reduce bandwidth consumption
    - Proxy servers can be logged and monitored closely, allowing tighter control
    over resource utilization on the network passed through one source rather than
    directly from a client to a remote service | - Proxies are application-specific
    (HTTP, Telnet, etc.), or protocol-restricted (most proxies work with TCP-connected
    services only) - Application services cannot run behind a proxy, so your application
    servers must use a separate form of network security - Proxies can become a network
    bottleneck, as all requests and transmissions |


    ## Chapter 2. Securing Your Network


    ## 2.8.1. Netfilter and IPTables


    The Linux kernel features a powerful networking subsystem *Netfilter*. The Netfilter
    subsystem provides stateful or stateless packet filtering as well as NAT and IP
    masquerading services. Netfilter also has the ability to *mangle* IP header information
    for advanced routing and connection state management. Netfilter is controlled
    using the *iptables* tools.


    ### 2.8.1.1. IPTables Overview


    The power and flexibility of Netfilter is implemented using the **iptables** administration
    tool, a command line tool similar in syntax to its predecessor, **ipchains**.


    A similar syntax does not mean similar implementation, **ipchains** requires intricate
    rules sets for filtering source paths; filtering destinations; and filtering both
    source and destination ports.


    By contrast, **iptables** uses the Netfilter subsystem to enhance network connection,
    inspection, and processing. **iptables** features advanced logging, pre- and post-routing
    actions, network address translation, and forward totalling, all in one command
    line interface.


    This section provides an overview of **iptables**. For more detailed information,
    refer to [Section 2.9, IPTables].


    ## 2.8.2. Basic Firewall Configuration


    Just as in a building attempts to prevent a fire from spreading, a computer firewall
    attempts to prevent malicious software from spreading to your computer. It also
    helps to prevent unauthorized users from accessing your computer.


    In a default Fedora installation, a firewall exists between your computer or network
    and any untrusted networks, for the Internet. It determines which services your
    remote users can access. A properly configured firewall can greatly increase the
    security of your system. It is recommended that you configure a firewall for any
    Fedora with an Internet connection.


    ## 2.8.2.1. Firewall Configuration Tool


    During the **Firewall Configuration** screen of the Fedora installation, you were
    given the option to enable a basic firewall as well as allow specific devices,
    incoming services, and ports.


    After installation, you can change your preference by using the **Firewall Configuration
    Tool**.


    To start this application, use the following command:


    ```

    [root@myServer ~] # system-config-firewall

    ```


    ## Firewall Configuration


    Here you can define which services are trusted. Trusted services are accessible
    from all hosts and networks.


    | Service | Port/Protocol |

    | --- | --- |

    | WWW (HTTP) | 80/tcp |

    | SSH | 22/tcp |

    | Secure WWW (HTTPS) | 443/tcp |

    | Samba Client | 137/udp, 138/udp |

    | Samba | 137/udp, 138/udp, 139/tcp, 445/tcp |

    | RADIUS | 1812/udp, 1813/udp |

    | POP3-over SSL | 995/tcp |

    | OpenVPN | 2094/udp |

    | NFS4 | 2049/tcp, 2049/udp |

    | Network Printing Server (IPP) | 631/tcp, 631/udp |

    | Network Printing Client (IPP) | 631/udp |

    | Multicast DNS (mDNS) | 5353/udp |


    The firewall is enabled.


    **Figure 2.15. Firewall Configuration Tool**


    > Note

    > The Firewall Configuration Tool only configures a basic firewall. If the system
    needs more complex rules, refer to Section 2.9, "IPTables" for details on configuring
    iptables rules.


    ## 2.8.2.2. Enabling and Disabling the Firewall


    - Disabling the firewall provides complete access to your system and does no security
    checking. This should only be selected if you are running on a trusted network
    (not the Internet) or need to configure a custom firewall using the iptables command
    line tool.

    - Enabled — This option configures the system to reject incoming requests, such
    as DNS replies.


    > Warning

    > Firewall configurations and any customized rules are stored in /etc/sysconfig/iptables.
    If you choose Disabled, these rules will be lost.


    ## 2.8.2.3. Trusted Services


