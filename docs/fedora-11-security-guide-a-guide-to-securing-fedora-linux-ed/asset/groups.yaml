    ## Chapter 1. Security Overview


    ### 1.3.1.1. Shades of Gray


    Within the community of individuals who find and exploit vulnerabilities in systems
    and networks are several distinct groups. These groups are described by the shade
    of hat that "wear" when performing their security investigations and this is indicative
    of their intent.


    The white hat hacker is one who tests networks and systems to examine their performance
    and determine how vulnerable they are to intrusion. Usually, hackers crack their
    own systems or the systems of a client who has specified them for the purposes
    of security auditing. Academic researchers and professional consultants are two
    examples of white hackers.


    A black hat hacker is synonymous with a cracker. In general, crackers are less
    focused on programming and the scale of breaking into systems. They often rely
    on cracking programs and exploit known vulnerabilities in systems to uncover sensitive
    information for personal gain or to inflict damage on target system or network.


    The gray hat hacker, on the other hand, has the skills and intent of a white hat
    hacker in most situations but uses his knowledge for less noble occasions on occasion.
    A gray hat hacker can be thought of as a white hat who wears a black hat to accomplish
    his own agenda.


    Gray hackers typically subscribe to another form of the hacker ethic, which says
    it is acceptable to break into systems as long as the hacker does not commit theft
    or breach confidentiality. Some argue, however, that the act of breaking into
    a system is itself unethical.


    Regardless of the intent of the intruder, it is important to know the weaknesses
    a cracker may likely attempt to exploit. The remainder of the chapter focuses
    on these issues.


    ### 1.3.2. Threats to Network Security


    Bad practices when configuring the following aspects of a network can increase
    the risk of attack.


    ### 1.3.2.1. Insecure Architectures


    A misconfigured network is an entry point for unauthorized users. Leaving a trust-based,
    open local network vulnerability to the highly-secure Internet is like leaving
    a door ajar in a crime-ridden neighborhood — nothing may happen for an arbitrary
    amount of time, but eventually someone exploits the opportunity.


    #### 1.3.2.1.1. Broadcast Networks


    System administrators fail to realize the importance of networking hardware in
    their security schemes. Simple hardware such as hubs and routers on the broadcast
    or non-switched switch; that is, when a node transmits data across the network
    to a recipient node, the hub or router sends a broadcast of the data packets until
    the recipient node receives and processes the data. This method is the most vulnerable
    to address resolution protocol (ARP) or media access control (MAC) address spoofing
    by outside intruders and unauthorized users on local hosts.


    #### 1.3.2.1.2. Centralized Servers


    Another potential risk is the use of centralized computing. A atom cost-cutting
    measure for many businesses is to consolidate all services into a single powerful
    machine. This can be convenient as it is easier to manage and costs considerably
    less than multiple-server configurations. However, a centralized server introduces
    a single point of failure on the network. If the central server is compromised,
    it may render the network completely useless or worse, prone to data manipulation
    or theft. In these situations, a central server becomes an open door which allows
    access to the entire network.


    ### 1.3.3. Threats to Server Security


    Server security is as important as network security because servers often hold
    a great deal of an organization''s vital information. If a server is compromised,
    all of its contents may become available for the cracker to steal or manipulate
    it. The following sections detail some of the main issues.


    ### 1.3.3.1. Unused Services and Open Ports


    A full installation of Fedora contains 1000+ application and library packages.
    However, most server administrators do not opt to install every package in the
    distribution, preferring instead to install a base installation of packages, including
    several server applications.


    A common occurrence among system administrators is to install the system without
    paying attention to what programs are actually being installed. This can be problematic
    because unwanted services may be installed, configured with the default settings,
    and possibly turned off. This can cause unwanted services, such as Telnet, DHCP,
    or DNS, to run on a workstation without the administrator realizing it, in turn
    can cause unwanted traffic to the server, or even a potential pathway into the
    system for crackers. Refer To Section 2.2, “Server Security” for information on
    closing and disabling unused services.


    ### 1.3.3.2. Unpatched Services


    Most applications that are included in a default installation are solid, thoroughly
    tested pieces of software. Having been in use in production environments for many
    years, their code has been thoroughly refined and many of the bugs have been found
    and fixed.


    However, there is no such thing perfect software and there is always room for
    further refinement. Moreover, software is often not as refined as one might expect,
    because of its arrival to production environments or it may not be as popular
    as another server software.


    Developers and system administrators often find exploitable bugs in server applications
    and publish the information on bug tracking and security-related websites such
    as the Bugtraq mailing (http://www.securityfocus.com) or the Computer Emergency
    Response Team (CERT) website (http://www.cert.org). Although these mechanisms
    are an effective way of alerting the community to security vulnerabilities, it
    is up to administrators to patch their systems promptly. This is particularly
    true because crackers have access to these same vulnerability tracking services
    and will use the information to track unpatched systems whenever they need. Good
    system administration requires vigilance, bug tracking, and proper maintenance
    to ensure a more secure computing environment.


    Refer to Section 1.5, “Security Updates” for more information about keeping a
    system up-to-date.


    ### 1.3.3.3. Inattentive Administration


    Administrators who fail to patch their systems are one of the greatest threats
    to server security. According to the Sysadmin, Audit, Network, Security Institute,
    the primary cause of vulnerability is when administrators fail to change default
    passwords.


    ```

    http://www.sans.org/resources/php

    ```


    ### 1.3.3.4. Inherently Insecure Services


    Even the most vigilant organization can fall victim to vulnerabilities if the
    network they choose are inherently insecure. For instance, there are many services
    developed under the assumption that they are used over LANs, which become available
    over the Internet.


    One category of insecure network services is those that require usernames and
    passwords for authentication. Telnet and FTP are two such services. If packet
    sniffing software is monitoring traffic between the remote user and passwords
    can be easily intercepted.


    Inherently, services can also easily fall prey to what the security industry terms
    man-in-the-middle attack. In this type of attack, a cracker redirects network
    traffic by tracking a server name on the network to point instead of the intended
    server. When someone opens a remote session to the server, the attacker acts as
    an invisible conduit, sitting between the server and the user capturing information.
    Then they can gain administrative privileges.


    Another category of insecure services includes file systems and information services
    such as NFS or NIS, which are developed for LAN use but, unfortunately, extended
    to WANs. NFS does not, by default, have any authentication or security mechanisms
    to prevent a cracker from mounting the NFS share and accessing anything contained
    therein. NIS, as well, has vital information that must be known by every computer
    on a network, including passwords and file permissions, within a plain text ASCII
    or DBM (ASCII-derived) database. A cracker who gains access to this database can
    access every user account on a network, including the administrator’s account.


    By default, Fedora is released with all services turned off. However, since administrators
    find themselves forced to use these services, careful configuration is critical.
    Refer to Section 2.2, "Server Security" for more information about setting up
    a safe manner.


    ### 1.3.4. Threats to Workstation and Home PC Security


    Workstations and home PCs may not be as prone to attack as networks or servers,
    but since they often contain sensitive data, such as credit card information,
    they are targeted by system crackers. Workstations can also be co-opted with the
    user’s knowledge and used by attackers as "slave" machines in coordinated attacks.
    For these reasons, knowing the vulnerabilities of a workstation can save users
    the headache of reinstalling the operating system, or recovering from data theft.


    ### 1.3.4.1. Bad Passwords


    Bad passwords are one of the easiest ways for an attacker to gain access to a
    system. For more on how to avoid common pitfalls when creating a password, refer
    to Section 2.1.3, "Password Security".

