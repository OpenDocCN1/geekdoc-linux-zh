  - '[PAGE 142]


    # 2.9.3.4.4. Additional Match Option Modules


    Additional options are available through modules loaded by the iptables command.


    To use a match option module, load the module by the -m <module-name>, where <module-name>
    is the name of the module.


    Many modules are available by default. You can also create modules to provide
    additional functionality.


    The following is a partial list of the most commonly used modules:


    +   - limit module — Limits on how many packets are matched to a rule.


    When used in conjunction with the LOG target, the limit module can prevent a flood
    of matching packets from filling up system log with repetitive messages or using
    system resources.


    Refer to Section 2.9.3.5, "Target Options" for more information about the LOG
    target.


    The limit module enables the following options:


    +   - --limit Sets the maximum number of matches for a particular time period,
    specified as <value>/<period> pair. For example, --limit 5/hour allows five rules
    per hour.


    Periods can be specified in seconds, minutes, hours, or days.


    If a number and time are not used, the default value of 3/hour is assumed.


    +   - --limit-burst Sets a limit on the number of packets able to match a rule
    at one time.


    This option is specified as an integer and should be used in conjunction with
    the --limit option.


    If no value is specified, the default value of five (5) is assumed.


    +   - state module Enables state matching.


    The state module enables the following options:


    +   - --state match a packet with the following connection states:


    +   - ESTABLISHED The matching packet is associated with other packets in an established
    connection. You need to accept this state if you want to maintain a connection
    between a client and a server.


    +   - INVALID — The matching packet cannot be tied to a known connection.


    +   - NEW — The matching packet is either creating a new connection or is part
    of a two-way connection previously seen. You need to accept this state if you
    want to allow new connections to a service.


    +   - RELATED — The matching packet is starting a new relation in some way to
    an existing connection. An example of this is FTP, which uses one connection for
    control traffic (port 21), and a separate connection for data transfer (port 20).


    These connection states can be used in combination with one another by separating
    them with commas, such as -m state --state INVALID, NEW.'
  - '[PAGE 143]


    # Chapter 2. Securing Your Network


    +   - mac module — Enables hardware MAC address matching.


    The mac module enables the following option:


    +   - mac-source — Matches a MAC address of the network interface card that sent
    the packet. To exclude a MAC address from a rule, place an exclamation point character
    (!) after the --mac-source match option.


    Refer to the iptables page for more match options available through modules.


    # 2.9.3.5. Target Options


    When a packet has matched a particular rule, the rule can direct the packet to
    a number of different targets which determine the appropriate action. Each chain
    has a default target, which is used if none of the rules on that chain match a
    packet or if none of the rules match the packet specify a target.


    The following are the standard targets:


    +   - user-defined-chain — A user-defined chain within the table. User-defined
    chain names must be unique. This target passes the packet to the specified chain.


    +   - ACCEPT — Allows the packet through to its destination or to another chain.


    +   - DROP — Drops the packet without responding the requester. The system that
    sends the packet is not notified of the failure.


    +   - QUEUE — The packet is queued for handling by a user-space application.


    +   - RETURN — Stops checking the packet rules in the current chain. If the packet
    with a RETURN target matches a rule in a chain from another chain, the packet
    is returned to the first chain to resume checking where it left off. If the RETURN
    rule is a built-in chain and the packet cannot move up to its previous chain,
    the default target for the current chain is used.


    In addition, extensions are available which allow other targets to be specified.
    These extensions are called target modules or match options and only apply to
    specific tables and situations. Refer to Section 2.9.3.4.4, "Additional Match
    Option Modules" for more information about match option modules.


    Many extended target modules, which most only apply to specific tables or situations.
    Some of the most popular target modules included by default in Fedora:


    +   - LOG — Logs all packets that match this rule. The packets are logged by the
    kernel, the /etc/syslog.conf file determines where these log entries are recorded.
    By default, they are placed in the /var/log/messages file.


    Additional options can be used after the LOG target to specify the way in which
    logging occurs:


    +   - log-level — Sets the priority of a logging event. Refer to the syslog.conf
    page for a list of priority levels.


    +   - log-options — Logs any options set in the header of an IP packet.


    +   - log-prefix — Places a string of up to 29 characters before the log line
    when it is written. This is useful for writing syslog filters in conjunction with
    packet logging.


