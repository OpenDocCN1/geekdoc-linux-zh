- md: "\n## Chapter 2. Securing Your Network\n\n- 7. Add principals for the users\
    \ using **addprinc** command within **kadmin**. **kadmin** and **kadmin.local**\
    \ are command line interfaces to the KDC. As such, many commands — such as **addprinc**\
    \ — are available after launching the **kadmin** program. Refer to the **kadmin**\
    \ man page for information.\n\n- 8. Verify that the KDC is issuing tickets. First,\
    \ **kinit** to obtain a ticket and store it in a credential cache file. Next,\
    \ use **klist** to view the list of credentials in the cache and **kdestroy**\
    \ to destroy the cache and the credentials in it.\n\n> > **Note:** By default,\
    \ **kinit** authenticates using the same system login username (the Kerberos server).\
    \ If that username does not correspond to a principal in the Kerberos database,\
    \ **kinit** issues an error message. If that happens, supply **kinit** with the\
    \ name of the correct principal as an argument on the command line (**<principal>**).\n\
    \nOnce these steps are completed, the Kerberos server should be up and running.\n\
    \n## 2.6.6. Configuring a Kerberos 5 Client\n\nSetting up a Kerberos 5 client\
    \ is less involved than setting up a server. At a minimum, the client packages\
    \ provide each client with a valid **krb5.conf** configuration file. While **ssh**\
    \ and **login** are the preferred method of remotely logging in client systems,\
    \ Kerberos versions of **rsh** and **login** are still available; deploying them\
    \ requires that a few more changes be made.\n\n- 1. Be sure that time synchronization\
    \ is in place between the Kerberos client and the KDC. Refer to [Section 2.6.5,\
    \ \"Configuring a Kerberos 5 Server\"](#) for more information. In addition, verify\
    \ that DNS is working properly on the Kerberos client before configuring the Kerberos\
    \ client programs.\n\n- 2. Install the **krb5-libs** and **krb5-workstation**\
    \ packages on all of the client machines. Supply a valid **/etc/krb5.conf** file\
    \ for each client (usually this can be the same **krb5.conf** file used by the\
    \ KDC).\n\n- 3. Before working in the realm, use Kerberos to authenticate users\
    \ who connect using **ssh** or Kerberos **rsh**, **kshd**, and **klogin** server\
    \ all need access to the *host* service's principal. Additionally, in order to\
    \ use the kerberized **rsh** and **login** services, that workstation must have\
    \ the **xnetd** package installed.\n\nUsing **kadmin**, add a principal for the\
    \ workstation on the KDC. The instance in this case is the hostname of the workstation.\
    \ Use the **-randkey** option for the **kadmin**'s **addprinc** command to create\
    \ the principal and assign it a random key:\n\n```\naddprinc -randkey host/blah.example.com\n\
    ```\n\nNow that the principal has been created, keys can be extracted for the\
    \ workstation by running **kadmin** on the workstation itself, and using the **ktadd**\
    \ command within **kadmin:**\n\n```\nktadd -k /etc/krb5.keytab host/blah.example.com\n\
    ```\n\n- 4. To use other kerberized network services, they must first be started.\
    \ Below is a list of some common kerberized services and instructions about them:\n\
    \n- OpenSSH with GSS-API to authenticate users to servers if the client's and\
    \ server's configuration has GSSAPIAuthentication enabled. If the client also\
    \ has GSSIDelegateCredentials enabled, the user's credentials are available on\
    \ the remote system.\n\n- rsh and login — To use the kerberized services of rsh\
    \ and login, enable login, eklogin, and kshell.\n\n- Telnet — To use kerberized\
    \ Telnet, kb5-telnet must be enabled.\n\n- FTP — To provide FTP access, center\
    \ and extract a key for the principal with a root of ftp. Be certain to set the\
    \ instance to the fully qualified hostname of the FTP server, then enable gssftp.\n\
    \n- IMAP — To use a kerberized IMAP server, the cyrus-imap uses Kerberos 5 if\
