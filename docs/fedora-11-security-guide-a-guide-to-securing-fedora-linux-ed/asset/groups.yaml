    | 数据包过滤 | 数据包过滤读取通过局域网的每个数据包。它可以通过报头信息读取并处理数据包，并根据防火墙管理员实施的一组可编程规则过滤数据包。Linux
    内核通过 Netfilter 内核内置了数据包过滤功能 | - 可以通过 iptables 前端进行自定义 - 不需要在客户端进行自定义，因为所有网络活动都在路由器层过滤而非应用层过滤
