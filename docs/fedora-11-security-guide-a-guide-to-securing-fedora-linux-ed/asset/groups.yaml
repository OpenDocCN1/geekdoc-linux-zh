    # Chapter 2. Securing Your Network


    +   - PREROUTING — Alters incoming network packets before they are routed.


    +   - POSTROUTING — Alters network packets before they are sent out.


    Every network packet received or from a Linux system is subject to at least one
    table. However, a packet may be subjected to multiple rules within each table
    emerging at the end of the chain. The structure and purpose of these rules may
    vary, but unless seek to identify a packet coming from or going to a particular
    IP address, or set of addresses, using a particular protocol and network service.


    > Note

    By default, firewall rules are saved in the /etc/sysconfig/iptables or /etc/sysconfig/iptables
    files.

    The iptables starts before any DNS-related services when a Linux system is booted.
    This means that firewall rules can only reference numeric IP addresses (for example,
    192.168.0.1). Domain names (for example, host.example.com) in such rules produce
    errors.


    Regardless of this, when packets match a particular rule in one of the tables,
    a target or action is applied. If the rules specify an ACCEPT target for a matching
    packet, the packet skips the rest of the rule checks and continues to its connection.
    If a rule specifies a DROP target, that is refused access to the system and is
    not sent back to the host that sent the packet. If a rule specifies a QUEUE target,
    the packet is passed to user-space. If a rule specifies the optional REJECT target,
    the packet is dropped, but an error packet is sent to the packet''s originator.


    Every chain has a default policy to ACCEPT, DROP, REJECT, or QUEUE. If none of
    the rules in the chain apply to the packet, then the packet is dealt with in accordance
    with the default policy.


    The iptables command configures these tables, as well as sets up new tables if
    necessary.


    # 2.9.2. Differences Between IPTables and IPTChains


    Both iptchains and iptables use chains of rules that operate within the Linux
    kernel to filter packets based on matches with specified rules or sets. However,
    iptables offers a more extensible way of filtering packets, giving the administrator
    greater control without bundling complexity into the system.


    You should be aware of the significant differences between iptchains and iptables:


    Using iptables, each filtered packet is processed using rules from only one chain
    than multiple chains.


    For example, a FORWARD packet coming into a system using iptchains would have
    to go through the INPUT, FORWARD, and OUTPUT chains to continue to its destination.
    However, iptables only sends packets to the INPUT chain if they are destined for
    the local system, and only sends them to the OUTPUT chain if the local system
    generated the packets. It is therefore important to place the rule design to catch
    a particular packet within the chain that actually handles the packet.


    The DENY target has been changed to DROP.


    In iptchains, packets that matched a rule in a chain could be directed to the
    DENY target. This target must be changed to DROP in iptables.'
