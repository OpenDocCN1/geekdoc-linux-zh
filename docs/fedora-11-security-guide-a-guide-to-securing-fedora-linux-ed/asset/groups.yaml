    此外，DISA 提供了 UNIX SPR 脚本⁸，允许管理员检查系统上的特定设置。这些脚本提供了 XML 格式的报告，列出任何已知的漏洞设置。


    ## 安全安装


    安全始于你第一次将 CD 或 DVD 放入磁盘驱动器安装 Fedora 的时刻。从一开始就开始配置系统将有助于实施额外的安全设置。


    ## 5.1. 磁盘分区


    NSA 建议为 /boot、/home、/tmp、/var 和 /var/tmp 保持独立分区。每个分区的原因各不相同，我们将逐一讨论这些分区。


    - /boot - 这是系统启动时读取的第一个分区。用于引导系统进入 Fedora 的引导加载程序和内核镜像都存储在此分区中。此分区不应加密。如果此分区包含在
    / 中，且该分区被加密或变得变得不可用，那么你的系统将无法启动。


    - /home - 当用户数据存储在 / 而不是独立分区时，分区的故障会导致操作系统变得不稳定。此外，将数据保留在 /home 分区中，将系统升级到 Fedora
    的下一个版本要容易得多，因为数据在安装过程中不会被覆盖。如果根分区（/）损坏，你的数据可能会永久丢失。使用独立分区可以更程度地防止数据丢失。你也可以针对此分区进行频繁备份。


    - /tmp 和 /var - /tmp 和 /var/tmp 目录都用于存储不需要长时间保存的数据。然而，如果大量数据涌入其中一个目录，可能会耗尽所有的存储空间。如果发生这种情况，且这些目录存储在
    / 中，那么你的系统可能会变得不稳定并崩溃。出于此原因，将这些目录移动到它们自己的分区是一个好主意。


    ## 5.2. 利用 LUKS 分区加密


    从 Fedora 9 开始，Linux 统一密钥设置磁盘格式（LUKS）加密的实现变得简单许多。在安装过程中，系统会向用户提供加密分区的选项。用户必须提供一个密码，该密码将作为解锁批量密钥的密钥，用于保护分区数据。


    然而，Fedora 8 并没有内置 LUKS 支持；但可以很容易实现。提供了分步操作程序，允许用户在 Fedora 8 安装中实现分区加密。


    > 5 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption

    > 2 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption#Step-by-Step_Instructions


    ## 软件维护


    软件维护对于维护安全系统至关重要。在软件发布后及时打上补丁，以防止攻击者利用已知漏洞渗透你的系统。


    ## 6.1. 安装最小化软件


    最佳实践是仅安装你使用的软件包，因为计算机上的每种软件都可能包含漏洞。如果你是从 DVD 介质安装，请利用机会在安装期间准确选择你想要安装的包。当你需要另一个包时，可以随时将其添加到系统层。


    ## 6.2. 计划和配置安全更新


    所有软件都包含错误。这些错误可能会导致漏洞，使你的系统暴露给恶意用户。未修补的系统是计算机入侵的常见原因。你应该有一个计划及时安装安全补丁，以关闭这些漏洞，使它们无法被利用。


    对于家庭用户，应该尽快安装安全更新。配置自动安装安全更新是避免记忆的一种方法，但存在风险，即某些内容可能会与你的配置或系统或其他软件产生冲突。


    对于企业或高级用户，应该对安全更新进行测试并安排安装。在补丁发布与安装到系统之间，需要额外的控制措施来保护系统。这些控制取决于具体的漏洞，但可能包括额外的防火墙规则、使用外部防火墙或更改软件设置。


    ## 6.3. 调整自动更新


    Fedora 配置为每天计划应用所有更新。如果你想更改系统安装更新的方式，必须在“软件更新偏好”（Software Update Preferences）中进行。你可以更改计划、应用的更新类型或接收可用更新通知。


    在 Gnome 中，你可以在以下位置找到更新控制：系统 -> 偏好 -> 系统软件更新。在 KDE 中，它位于：应用程序 -> 设置 -> 软件更新。


    ## 6.4. 从已知仓库安装签名包


    软件包通过存储库发布。所有知名的仓库都使用公钥技术来证明该包是由仓库发布的。签名确保了仓库自签名应用以来没有发生更改。这可以防止安装可能在下载之前在包创建后被恶意篡改的软件。


    使用许多仓库、不可信的仓库或带有未签名包的仓库，会增加向系统引入恶意或漏洞代码的风险。在向 yum/软件更新添加仓库时请要谨慎。


    ## 参考文献


    以下参考文献是指与 SELinux 和 Fedora相关的额外信息，但超出了本指南的范围。请注意，由于 SELinux 的快速开发，部分材料可能仅适用于特定的
    Fedora 版本。


