    # Password Security


    The password check performed at the time of creation does not discover bad passwords

    as effectively as running a password cracking program against the passwords.


    Many password cracking programs are available that run under Fedora, although
    none ship with the

    operating system. A brief list is of some of the most popular password cracking
    programs:


    +   * The Ripper — A fast and flexible password cracking program. It allows the
    use of multiple

    word lists and is capable of brute-force password cracking. It is available online
    at http://nwww.openwall.com/john/


    +   * Crack — Perhaps the best known password cracking software, Crack is also
    very fast, though

    not easy to use as John Ripper. It can found online at http://www.cryptycide.com/alemcm/

    security/c50-faq.html.


    +   * Slurpie — Slurpie is similar to John Ripper and Crack, but it is designed
    to run on

    multiple computers simultaneously, creating a distributed password cracking attack.
    It can be

    found along with number of other attack security evaluation tools online at http://nwww.ussrack.com/distributed.htm.


    > Warning

    Always get authorization in writing before attempting to crack passwords within
    an

    organization.


    # 2.1.3.2.2. Passphrases


    Passphrases are the cornerstone to security in today''s systems. Unfortunately,

    techniques such as biometrics and two-factor authentication have not become mainstream
    in many

    systems which have become a major problem. If passwords are going to be used to
    secure a system,

    the use of passphrase should be considered. Passphrases are longer than passwords
    and

    provide better protection than a password even when implemented with non-standard
    characters

    as numbers and symbols.


    # 2.1.3.2.3. Password Aging


    Password aging is another technique used by system administrators to defend against
    bad passwords\within an organization. Password aging means that after a specified
    period (usually 90 days), the user

    is prompted to create a new password. The theory behind this is that if a user
    is forced to change his

    password periodically, a cracked password is only useful to an intruder for a
    limited amount of time.

    The downside to password aging, however, that users are more likely to write their
    passwords down.


    There are two primary programs to specify password aging under Fedora: the change
    command

    or the graphical User Manager (system-config-users) application.


    The -M option of the change command specifies the maximum number of days the password
    is valid.

    For example, to set a user''s password to expire in 90 days, use the following
    command:


    ```

    change -M 90 <username>

    ```'
