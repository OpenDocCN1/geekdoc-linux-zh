    ## 2.5. TCP Wrappers and xinetd


    Controlling access to network services is one of the most important security tasks
    facing a server administrator. Fedora provides several tools for this. For example,
    an iptables-based firewall filters out network packets within the kernel''s network
    stack. For network services that utilize it, TCP Wrappers add an additional layer
    of protection by defining which hosts are or not allowed to connect to "wrapped"
    network services. One such network service is the xinetd super server. This service
    is called a super server because it controls connections to a subset of network
    services and refines access control.


    Figure 2.9, "Access Control to Network Services" is a basic illustration of how
    these tools work together to protect network services.


    ## TCP Wrappers


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_78_0.png)


    Figure 2.9. Access Control to Network Services


    This chapter focuses on the role of TCP Wrappers and xinetd in controlling access
    to network services and reviews how these tools can be used to enhance both logging
    and utilization management. Refer to Section 2.9, "IPTables" for information about
    using firewalls with iptables.


    ### 2.5.1. TCP Wrappers


    The TCP package (tcp_wrappers) is installed by default and provides host-based
    access control to network services. The most important component in the package
    is the /usr/lib/libwrap.library. In general terms, a TCP-wrapped service is one
    that has been compiled against the libwrap. library.


    When a connection attempt is made to a TCP-wrapped service, the service first
    references the host''s access files /etc/hosts.allow and /etc/hosts.deny to determine
    whether the client is allowed to connect. In most cases, it uses the syslog daemon
    (syslog) to write the name of the requesting client and the requested service
    to /var/log/secure or /var/log/messages.


    If a client is allowed to connect, TCP Wrappers release control of the connection
    to the requested service and take no further part in the communication between
    the client and the server.


    In addition to access control and logging, TCP Wrappers can execute commands to
    interact with the client before denying or releasing control of the connection
    to the requested network service.


    Because TCP Wrappers are a valuable addition to any server administrator''s arsenal
    of security tools, most network services in Fedora are linked to the libwrap.a
    library. Some such applications include /usr/sbin/sshd, /usr/sbin/sendmail, and
    /usr/sbin/xinetd.


    > Note

    To determine if a service is linked to libwrap, type the command:

    ```bash

    ldd <binary-name> | grep wrap

    ```

    Replace <binary-name> with the name of the service. If the output shows libwrap,
    the service is linked to it.


    ## 2.5.1. Advantages of TCP Wrappers


    TCP Wrappers provide the following advantages over other techniques for managing
    network service access:


    - Centralized management of multiple protocols — TCP Wrappers allow a common set
    of access rules for various services.

    - Ease of use — Changes can be made to access rules without restarting network
    services.

    - Logging — All connection attempts can be logged for auditing.


    ## 2.5.2. Wrappers Configuration Files


    To determine if a client is allowed to connect, TCP Wrappers reference two files,
    which are commonly referred to as hosts.allow and hosts.deny.


    When a TCP Wrappers-wrapped service receives a client request, it performs the
    following steps:


    1. It references /etc/hosts.allow. The service sequentially parses the file. If
    it finds a matching rule, it allows the connection. If not, it moves to the next
    step.

    2. It references /etc/hosts.deny. The service sequentially parses the file. If
    it finds a matching rule, it denies access. If not, it grants access.


    The following are important points to consider when using Wrappers:


    - Because rules in hosts.allow are applied first, they take precedence over rules
    in hosts.deny.

    - The rules in each file are read from the top down and the first matching rule
    for a given service is the only one applied.

    - If no rules for the service are found in either file, or if neither file exists,
    access to the service is granted.

    - TCP-wrapped services do not cache the rules from access files, so any changes
    to hosts.allow or hosts.deny take effect immediately.


    > Warning

    If the last line of a hosts access file is not a newline character (created by
    pressing the Enter key), the last rule in the file fails and an error is logged
    to /var/log/messages or /var/log/secure. This is also the case for a rule that
    spans lines without using the backslash. The following example illustrates the
    relevant portion of a log message for either of these circumstances:


    ```

    warning: /etc/hosts.allow, line 20: missing newline

    ```


    ### 2.5.2.1. Formatting Access Rules


    The format for /etc/hosts.allow and /etc/hosts.deny is identical. Each rule must
    be on its own line. Blank lines that start with a hash (#) are ignored.


    Each rule uses the following basic format to control access to network services:


    ```

    <daemon list> <client list> [: <option>: <option>: ...]

    ```


    - **daemon list** — A comma-separated list of process names (not service names)
    or the ALL wildcard. The daemon list also accepts operators (refer to Section
    2.5.2.1.4, "Operators") to allow greater flexibility.

    - **client list** — A comma-separated list of hostnames, host IP addresses, special
    patterns, or wildcards which are affected by the rule. The client list also accepts
    operators listed in Section 2.5.2.1.4, "Operators") to allow greater flexibility.

    - **<option>** — An optional action or comma-separated list of actions performed
    when the rule is triggered. Option fields support expansions, launch shell commands,
    allow or deny access, and alter logging behavior.


    > Note

    More information on the specialist terms above can be found elsewhere in this
    Guide:

    - Section 2.5.2.1.1, "Wildcards"

