  md: ': allow


    +   - **twist** — Replaces the requested service with the specified command. This
    directive is often used to set up traps for intruders (also called "honey pots").
    It can also be used to send messages to connecting clients. The **twist** directive
    must occur at the end of the rule line.


    In the following example, clients attempting to access FTP services from the example.com
    domain are sent a message using the **echo** command:


    ```

    vsftpd .example.com \

