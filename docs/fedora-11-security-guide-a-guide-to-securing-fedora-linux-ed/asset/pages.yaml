  md: '# 1.3.4.2. Vulnerable Client Applications


    Although an administrator may have a fully secure and patched server, that does
    not mean remote users are secure when accessing it. For instance, if the server
    Telnet or FTP services over a public network, an attacker can capture the plain
    text usernames and passwords as they pass over the network, and then use the account
    information to access the remote user''s workstation.


    Even when secure protocols, such as SSH, a remote user may be vulnerable to certain
    attacks if they do not keep their client applications updated. For instance, v.1
    SSH clients are vulnerable to an X-forwarding attack from malicious SSH servers.
    Once connected to the server, the attacker can capture any keystrokes and mouse
    clicks by the client over the network. This problem was fixed in the v.2 SSH protocol,
    but it is up to the user to keep track of what applications have vulnerabilities
    and update them as necessary.


    Section 2.1, "Workstation Security" discusses in more detail what steps administrators
    and home users should take to limit the vulnerability of computer workstations.


