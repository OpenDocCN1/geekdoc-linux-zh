    level of security.


    Next, when the key will expire. It is a good idea to choose an expiration date
    using the default, which is "none." If, for example, the email address on the
    key becomes invalid, an expiration date will remind others to stop using that
    public.


    Please specify how the key should be valid. 0 = key does not expire 2 = key expires
    in days w = key expires in weeks m = key expires in months y = key expires in
    years y is valid for?:


    Entering a value of **1ly**, makes the key valid for one year (You may change
    this expiration date after the key is generated, if you change your mind.)


    Before the **gpg** command asks for signature information, the following prompt
    appears: **Is this correct (y/n)** Enter **yc** to finish the process.


    Next, enter your name and address. Remember this process if you are authenticating
    as a real individual. For this reason, include your real name. Do not use aliases,
    or handles, since this could obscure your identity.


    Enter your email address for your GPG key. If you choose a bogus address, it will
    be more difficult for others to find your public key. This authenticating your
    communications. If you are using this GPG key for [DocsProject/Selfintroduction]
    on a mailing list, enter the email address you use on that list.


    Use the comment field to include aliases or other information. (Some people use
    different keys for different purposes and identify each key with a comment, such
    as “Office” or “Source Projects.\.)


    At the confirmation prompt, enter the letter O to continue if all entries are
    correct, or use the other to fix any problems. Finally, enter a passphrase for
    your secret key. The **gpg** program allows you to enter passphrase twice to ensure
    you made no typing errors.


    Finally, **gpg** generates random data to make your key as unique as possible.
    Move your mouse, type random keys, or perform other tasks on the system to speed
    up this process. Once this step is finished, your keys are ready to use:


    ```

    pub 1024/B2AFAI5 2005-03-31 John Q. Doe (Fedora Docs Project) <jqdoe@example.com>

    key fingerprint = 117C F823 22EA 8043 3E86 6486 542E 1B2A FA1C

    sub 1024/CEA4B2E 2005-03-31 (2006-03-31)

    ```


    The fingerprint is a shorthand “signature” for your key. It allows you to confirm
    to others that you have received your actual public key without any tampering.
    You do not need to write this fingerprint down. To display the fingerprint at
    any time, use this command, substituting your email address: **gpg**

    --fingerprint jqdoe@example.com'
