  md: '# Chapter 2. Securing Your Network


    +   - The argument retry=3 specifies if the test fails the first time, the user
    has two more chances to create a strong password.


    +   - password required pam_unix.so shadow nullock authtok — This line specifies
    that the program changes the user''s password, it should use the password interface
    of the pam_unix.so module to do.


    +   - The argument shadow instructs the module to create shadow passwords when
    updating a user''s password.


    +   - The argument nullock instructs the module to allow the user to change their
    password from a blank password, otherwise a null password is treated as an account
