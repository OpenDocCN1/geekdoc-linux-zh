    # 2.6.6. Configuring a Kerberos 5 Client


    Setting up a Kerberos 5 client is less involved than setting up a server. At a
    minimum, the client packages provide each client with a valid **krb5.conf** configuration
    file. While **ssh** and **login** are the preferred method of remotely logging
    in client systems, Kerberos versions of **rsh** and **login** are still available,
    deploying them requires that a few more changes be made.


    +   1. Be sure that time synchronization is in place between the Kerberos client
    and the KDC. Refer to [Section 2.6.5, "Configuring a Kerberos 5 Server"](#) for
    more information. In addition, verify that DNS is working properly on the Kerberos
    client before configuring the Kerberos client programs.


    +   2. Install the **krb5-libs** and **krb5-workstation** packages on all of the
    client machines. Supply a valid **/etc/krb5.conf** file for each client (usually
    this can be the same **krb5.conf** file used by the KDC).


    +   3. Before working in the realm use Kerberos to authenticate users who connect
    using **ssh** or Kerberos **rsh**, **kshd**, and **klogin** server all need access
    to the *host* service''s principal. Additionally, in order to use the kerberized
    **rsh** and **login** services, that workstation must have the **xnetd** package
    installed.


    Using **kadmin**, add a principal for the workstation on the KDC. The instance
    in this case is the hostname of the workstation. Use the **-randkey** option for
    the **kadmin**''s **addprinc** command to create the principal and assign it a
    random key:


    ```

    addprinc -randkey host/blah.example.com

