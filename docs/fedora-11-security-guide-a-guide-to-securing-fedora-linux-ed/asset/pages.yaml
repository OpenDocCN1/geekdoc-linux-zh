  md: '# Kerberos Terminology


    for authentication — called the key distribution center (KDC) — the entire Kerberos
    authentication system is at risk.


    +   - For an application to use Kerberos, its source must be modified to make
    the appropriate calls into the Kerberos libraries. Applications modified in this
    way are considered to be Kerberos-aware, or kerberized. For some applications,
    this can be quite problematic due to the size of the application or its design.
    For other incompatible applications, changes must be made to the way in which
    the server and client communicate. Again, this may require extensive programming.
    Closed-source applications that do not have Kerberos support by default are none
    the most problematic.

    - Kerberos is an all-or-nothing solution. If Kerberos is used on the network,
    any unencrypted passwords transferred to a non-Kerberos service is at risk. Thus,
    the network gains benefit from the use of Kerberos. To secure a network with Kerberos,
    one must either use Kerberos-aware versions of all client/server applications
    that transmit passwords unencrypted, or not use any client/server applications
    at all.


    # 2.6.2. Kerberos Terminology


    Kerberos has its own terminology to define various aspects of the service. Before
    learning how Kerberos works, it is important to learn the following terms.


    AS

    A server that issues tickets for a desired service which are in turn given to
    users for access to the service. The AS responds to clients from whom do have
    or not send credentials for a request. It is usually used to gain access to the
    ticket-granting server (TGS) by issuing a ticket-granting ticket (TGT). The AS
    usually runs on the same host as the key distribution center (KDC).


    ciphertext

    Encrypted data.


    client

    An entity on the network (a user, a host, or an application) that can receive
    a ticket from Kerberos.


    credentials

    A temporary set of electronic credentials that verify the identity of a client
    for a particular service.

    Also called a ticket.


    credential cache file

    A file which contains the keys for encrypting communications between a user and
    various network services. Kerberos 5 provides a framework for using other cache
    types, such as shared memory, but files are more thoroughly supported.


    crypt hash

    A one-way hash to authenticate users. These are more secure than using encrypted
    data, but they are still relatively easy to decrypt for an experienced cracker.


    GSS-API

    The Generic Security Application Program Interface (defined in RFC-2743 published
    by the Internet Engineering Task Force) is a set of functions which provide security
    services. This API is used to authenticate clients and services to each other
    without either program having specific knowledge of the underlying mechanism.
    If a network service (such as cyrus-IMAP) uses GSS-API, it can authenticate using
    Kerberos.'
