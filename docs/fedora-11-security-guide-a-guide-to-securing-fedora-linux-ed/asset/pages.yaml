    The default phase 1 configuration file that is created when an IPsec connection
    is initialized the following statements used by the Fedora implementation of IPsec:


    remote X.X.X.X


    Specifies the subsequent stanzas of this configuration file apply only to the
    remote node identified by the X.X.X.X IP address.


    exchange_mode aggressive


    The default configuration for IPsec on Fedora uses an aggressive authentication
    mode, which lowers the connection overhead while allowing configuration of several
    IPsec connections with multiple hosts.


    my_identifier address


    Specifies the identification method to use when authenticating nodes. Fedora uses
    IP addresses to identify nodes.


    encryption_algorithm 3des


    Specifies the encryption cipher used during authentication. By default, Triple
    Data Encryption Standard (3DES) is used.


    hash_algorithm sha1:


    Specifies the hash algorithm used during phase 1 negotiation between nodes. By
    default, Hash Algorithm version 1 is used.


    authentication_method pre_shared_key


    Specifies the authentication method used during node negotiation. By default,
    Fedora uses shared keys for authentication.


    dh_group 2


    Specifies the Diffie-Hellman group number for establishing dynamically-generated
    session keys. By default, modp1024 (group 2) is used.


    # 2.7.6.2.1. The Racoon Configuration File


    The /etc/racoon/racoon.conf file should be identical on all IPsec nodes except
    for the include "etc/racoon/X.X.X.X.conf" statement. This statement (and the file
    references) is generated when the IPsec tunnel is activated. For Workstation A,
    the X.X.X.X in include Workstation B''s IP address. The opposite is true for Workstation
    B. The following shows a typical racoon.conf file when the IPsec connection is
    activated.


    ```

    # Racoon IKE daemon configuration file.

    # See ''man racoon.conf'' for a description of the format and entries.

    path include "/etc/racoon";

    path pre_shared_key "/etc/racoon/psk.txt";

    path certificate "/etc/racoon/certs";

    ```


