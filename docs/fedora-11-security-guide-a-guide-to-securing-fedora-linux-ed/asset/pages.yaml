    # 2.1.4.2.1. Disabling the Root Shell


    To prevent users from logging in directly as root, the system administrator can
    set the root account''s shell to /sbin/nologin in the /etc/passwd file. This prevents
    access to the root account through commands that require a shell, such as the
    sudo and the ssh commands.


    > Programs do not require access to the shell, such as email clients or the sudo
    command, can still access the root account.


    # 2.1.4.2.2. Disabling Root Logins


    To further limit access to the root account, administrators can disable root logins
    at the console by editing the /etc/security file. This file lists devices the
    root user is allowed to log in. If the file does not exist at, the root user can
    log in through any communication device on the system.'
