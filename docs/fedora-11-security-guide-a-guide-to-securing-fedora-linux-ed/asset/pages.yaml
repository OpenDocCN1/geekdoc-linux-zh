  md: 'server/server.example.com@EXAMPLE.COM


    In this example, service is typically treated as the name of use (other common
    values include Idap, cvs, and HTTP) or host, server.example.com is the fully-qualified
    domain name of the system that runs the service, and EXAMPLE .COM is the name
    of the realm.


    To deduce the realm which the service belongs, clients will often consult DNS
    or the domain_realm section of /etc/krb5.conf to map a hostname (server.example.com)
    or a DNS domain name (.example.com) to the name of a realm (EXAMPLE.COM).


    Having decided which realm the service belongs, a client then has to determine
    the set of realms it needs to connect to, and in which it must contact them, to
    obtain credentials for authenticating to the service.


    This can be done by two ways:


    The default method, which requires no explicit configuration, is to give the realms
    names within a shared hierarchy. For example, assume realms named A. EXAMPLE.COM,
    B. EXAMPLE.COM, and EXAMPLE.COM. When a client in the A. EXAMPLE.COM attempts
    to authenticate to a service in B. EXAMPLE.COM, it will, by default, first attempt
    to get credentials for the EXAMPLE.COM realm, and then use those credentials to
    obtain credentials for the B. EXAMPLE.COM.


    The client in this scenario treats the realm name as a DNS name. It repeats strips
    the components of its own realm name to generate the names of realms that are
    "above" in the hierarchy until it reaches a point which is "above" the service''s
    realm. At that point it prepending components of the service''s realm name until
    it reaches the service''s realm. Each realm involved in the process is another
    "hop".


    For example, using credentials in A. EXAMPLE.COM, authenticating to a service
    in B. EXAMPLE.COM EXAMPLE.COM -> B. EXAMPLE.COM - A. EXAMPLE.COM and EXAMPLE.COM
    share a key for krbtgt/EXAMPLE.COM@EXAMPLE.COM


    +   - EXAMPLE.COM and B. EXAMPLE.COM share a key for krbtgt/B. EXAMPLE.COM@EXAMPLE.COM


    Another example, using credentials in SITE1. SALES. EXAMPLE.COM, authenticating
    to a service in EVERYWHERE. EXAMPLE.COMSTE1. SALES.EXAMPLE.COM -> SALES.EXAMPLE.COM
    -> EXAMPLE.COM -> EVERYWHERE.COM


    +   - SITE1. SALES.EXAMPLE.COM and SALES.EXAMPLE.COM share a key for krbtgt/SALES.COM@SITE1.EXAMPLE.COM


    +   - SALES.COM and EXAMPLE.COM share a key for krbtgt/EXAMPLE.COM@SALES.EXAMPLE.COM


    +   - EXAMPLE.COM and EVERYWHERE.COM share a key for krbtgt/EVERYWHERE.COM@EVERYWHERE.COM


