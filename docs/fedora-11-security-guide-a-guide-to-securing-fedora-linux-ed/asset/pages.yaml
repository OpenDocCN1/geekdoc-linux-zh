  md: '# Chapter 1. Security Overview


    Some administrators fail to patch their servers, while others fail to watch log
    messages from the system kernel or network traffic. Another common error is when
    default passwords or keys to services are left unchanged. For example, some databases
    have default administration passwords because they assume the system administrator
    changes them immediately after installation. If a database administrator fails
    to change this password, even an inexperienced cracker can use a widely-known
    default password to gain administrative privileges to the database. These are
    only a few examples of how inexperienced administration can lead to compromised
    servers.


    # 1.3.3.4. Inherently Insecure Services


    Even the most vigilant organization can fall victim to vulnerabilities if the
    network they choose are inherently insecure. For instance, there are many services
    developed under the assumption that they are used over networks; however, this
    assumption fails as the service becomes available over the Internet — which is
    inherently untrusted.


    One category of insecure network services is those that require insecure usernames
    and passwords for authentication. Telnet and FTP are two such services. If packet
    sniffing software is monitoring traffic between the remote user and such services
    and passwords can be easily intercepted.


    Inherently, services can also easily fall prey to the security industry terms
    the man-in-the-middle attack. In this type of attack, a cracker redirects network
    traffic by tracking a cracked server name on the network to point his instead
    of the intended server. When someone opens a remote session to the server, the
    attacker acts as an invisible conduit, sitting between the server and the unsus
    user capturing information. Then they cracker can gain administrative passwords
    and raw data without the server or the user realizing it.


    Another category of insecure services includes file systems and information services
    such as NFS or NIS, which are developed for LAN use but, unfortunately, extended
    to include WANS (for remote users). NFS does not, by default, have any authentication
    or security mechanisms to prevent a cracker from mounting the NFS share and accessing
    anything contained therein. NIS, as well, has vital information that must be known
    by every computer on a network, including passwords and file permissions, within
    a plain text ASCII or DBM (ASCII-derived) database. A cracker who gains access
    to this database can access every user account on a network, including the administrator’s
    account.


    By default, Fedora is released with all services turned off. However, since administrators
    find themselves forced to use these services, careful configuration is critical.
    Refer to Section 2.2, "Server Security" for more information about setting up
    a safe manner.


    # 1.3.4. Threats to Workstation and Home PC Security


    Workstations and home PCs may not be as prone to attack as networks or servers,
    but since they often contain sensitive data, such as credit card information,
    they are targeted by system crackers. Workstations can also be co-opted with the
    user’s knowledge and used by attackers as "slave" machines in coordinated attacks.
    For these reasons, knowing the vulnerabilities of a workstation can save users
    the headache of reinstalling the operating system, or recovering from data theft.


    # 1.3.4.1. Bad Passwords


    Bad passwords are one of the easiest ways for an attacker to gain access to a
    system. For more on how to avoid common pitfalls when creating a password, refer
    to Section 2.1.3, "Password Security".'
