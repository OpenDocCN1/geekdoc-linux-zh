- img_proc: true
  md: '# Chapter 2. Securing Your Network


    For example, a command to remove a rule from a chain can be very short:


    iptables -D <chain-name> <line-number>


    In contrast, a command that adds a rule filters packets from a particular subnet
    using a variety of specific parameters and options can be rather long. When constructing
    iptables commands, it is important to remember that some parameters and options
    require further parameters and options to construct a valid rule. This can produce
    a cascading effect, with the further parameters requiring more parameters. Until
    every parameter and option that requires another set of options is satisfied,
    the rule is not valid.


    Type iptables -h to view a comprehensive list of iptables command structures.


    # 2.9.3.2. Command Options


    Command options instruct iptables to perform a specific action. Only one command
    option is allowed per iptables command. With the exception of the help, all commands
    are written in upper-case characters.


    The iptables commands are as follows:


    +   - A Appends the rule to the end of the specified chain. Unlike the -I option
    described below, it does not take an integer argument. It appends the rule to
    the end of the specified chain.


    +   - C Checks a particular rule before adding it to the user-specified chain.
    This command can help you construct iptables rules by prompting you for additional
    parameters and options.


    +   - D <integer> | <rule> Deletes a rule in a chain by number (such as 5 for
    the fifth rule in a chain), or by rule specification. The rule specification must
    match exactly an existing rule.


    +   - E Renames a user-defined chain. A user-defined chain is any chain other
    than the default, existing chains. (Refer to the -N option, for information on
    creating user-defined chains.) This is a cosmetic change and does not affect the
    structure of the table.


    > NotenIf you attempt to rename one of the default chains, the system reports
    a Match found error. You cannot rename the default chains.


    +   - F Flushes the selected chain, which effectively deletes every rule in the
    chain. If no chain is specified, this command flushes every rule from every chain.


    +   - h Provides a list of command structures, as well as a quick summary of command
    parameters and options.


    +   - I [<integer>] Inserts the rule in the specified chain at a point specified
    by a user-defined integer argument. If no argument is specified, the rule is inserted
    at the top of the chain.


    > Importantnas noted above, the order of rules in a chain determines which rules
    apply to which packets. This is important to remember when adding rules using
    either the -A or -I option.'
