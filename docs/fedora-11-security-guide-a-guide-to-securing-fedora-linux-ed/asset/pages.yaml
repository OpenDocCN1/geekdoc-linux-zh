  md: '#  Preface


    # 1. Document Conventions


    This manual uses several conventions to highlight certain words and phrases and
    draw attention to specific pieces of information.


    In PDF and paper editions, this manual uses typefaces drawn from the Liberation
    Fonts¹ set. The Liberation Fonts is also used in HTML editions if the set is installed
    on your system. If not, alternative but equivalent typefaces are displayed. Note:
    Red Hat Enterprise Linux 5 and later includes the Liberation Fonts set by default.


    # 1.1. Typographic Conventions


    Four typographic conventions are used to call attention to specific words and
    phrases. These conventions, and the circumstances they apply to, are as follows.


    Mono-spaced Bold


    Used to highlight system input, including shell commands, file names and paths.
    Also used to highlight keycaps and key combinations. For example:


    > To see the contents of the file **my_next_bestselling_novel** in your current
    working directory, enter the **cat my_next_bestselling_novel** command at the
    shell and press **Enter** to execute the command.


    The above indicates a file name, a shell command and a keycap, all presented in
    mono-spaced bold and all distinguishable thanks to context.


    Key combinations can be distinguished from keycaps by the hyphen connecting each
    part of a key combination. For example:


    Press **Enter** to execute the command.


    Press **Ctrl+Alt+F1** to switch to the first virtual terminal. Press **Ctrl+Alt+F7**
    to return to your Windows session.


    The first paragraph highlights the particular keycap to. The second highlights
    two key combinations (a set of three keycaps with each pressed simultaneously).


    If code is discussed, class names, methods, functions, variable names and returned
    values mentioned within a paragraph will be presented as, in **mono-spaced bold**.
    For example:


    File-related classes include **filesystem** for file systems, **file** for files,
    and **dir** for directories. Each class has its own associated set of permissions.


    # Proportional Bold


    This denotes words or phrases encountered on a system, including application names;
    dialog box text; labeled buttons; check-box and radio button labels; menu titles
    and sub-menu titles. For example:'
