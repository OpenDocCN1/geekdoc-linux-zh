    # 2.6.4. Kerberos and PAM


    Kerberos-aware services do not make use of Pluggable Authentication Modules (PAM)
    — these bypass PAM completely. However, applications that use PAM can make use
    of Kerberos for authentication the pam_krb5 module (provided in the pam_krb5 package)
    is installed. The pam_krb5 package contains sample configuration files that allow
    services as login and gdm to authenticate users as obtain initial credentials
    using their passwords. If access to network servers is always performed using
    Kerberos-aware services or services that use GSS-API, such as IMAP, the network
    can be considered reasonably safe.


    > Important

    Administrators should be careful not to allow users to authenticate to most networks
    using Kerberos passwords. Many protocols used by these services do not encrypt
    the password before sending it over the network, destroying the benefits of the
    Kerberos system. For example, users should not be allowed to authenticate to Telnet
    with the same password used for Kerberos authentication.


    # 2.6.5. Configuring a Kerberos 5 Server


    When setting up Kerberos, install the KDC first. If it is necessary to set up
    slave servers, install the master first.


    To configure the first Kerberos KDC, follow these steps:


    +   1. Ensure that synchronization and DNS are functioning correctly on all client
    and server machines before configuring Kerberos. Pay particular attention to synchronization
    between the Kerberos servers and client. If the time difference between the server
    and client is greater than five minutes (this is configurable in Kerberos 5),
    Kerberos clients cannot authenticate to the server. This synchronization is necessary
    to prevent an attacker from using an old Kerberos ticket to masquerade as a valid
    user.


    It is advisable to set up a Network Time Protocol (NTP) compatible client/server
    network even if you are using Fedora. Follow the ntp package for this purpose.
    Refer to /usr/share/doc/ntp-<version-number>/index.html (where <version-number>
    is the version number of the ntp package installed on your system) for details
    about how to set up Network Time Protocol servers, and http://www.ntp.org for
    more information about NTP.


    +   2. Install the krb5-libs, krb5-server, and krb5-workstation packages on the
    dedicated machine that runs the KDC. This machine needs to be very secure — if
    possible, it should not run any services other than the KDC.


    88'
