  md: '# FORWARD and NAT Rules


    ```

    [root@myServer ~] # sysctl -w net.ipv4.ip_forward=1

    ```


    This configuration change is only valid for the current session, it does not persist
    beyond a reboot or network service restart. To permanently set IP forwarding,
    edit the /etc/sysctl.conf file as follows:


    Locate the following line:


    ```

    net.ipv4.ip_forward = 0

    ```


    Edit it to read as follows:


    ```

    net.ipv4.ip_forward = 1

    ```


    Use the following command to enable the change to the sysctl.conf file:


    ```

    [root@myServer ~] # sysctl -p /etc/sysctl.conf

    ```


    # 2.8.5.1. Postrouting and IP Masquerading


    Accepting forwarded packets by the firewall''s internal device allows LAN nodes
    to communicate with each other; they still cannot communicate to the Internet.


    To allow LAN nodes with private IP addresses to communicate with external public
    networks, configure the firewall for IP masquerading, which masks requests from
    LAN nodes with the IP address of the firewall''s external device (in this case,
    eth0):


    ```

    [root@myServer ~] # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    This rule uses the NAT packet matching table (-t nat) and specifies the built-in
    POSTROUTING chain for (-A POSTROUTING) on the firewall''s external device (-o
    eth0).


    POSTROUTING allows packets to be altered as they are leaving the firewall''s external
    device.


    The -j MASQUADE target is specified to map the private IP address of a node with
    the external address of the firewall/gateway.


    # 2.8.5.2. Prerouting


    If you have a server on your internal network that you want to make available
    externally, you can use the -j DNAT of the PREROUTING chain in NAT to specify
    a destination IP address and port where incoming packets requesting a connection
    to your internal service can be forwarded.


    For example, if you want to forward incoming HTTP requests to your dedicated Apache
    HTTP Server at 172.31.0.23, use the following command:


    ```

    [root@myServer ~] # iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j
    DNAT --to 172.31.0.23:80

    ```


    This rule specifies that the nat uses the built-in PREROUTING chain to forward
    incoming HTTP requests exclusively to the listed destination IP address of 172.31.0.23.'
