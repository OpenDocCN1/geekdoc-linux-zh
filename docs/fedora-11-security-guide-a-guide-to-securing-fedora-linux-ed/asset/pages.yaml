  md: '3. Edit the /etc/kerb5.conf /var/kerberos/kerb5kdc/kdc.conf configuration files
    to reflect the real name and domain-to-realm mappings. A simple realm can be constructed
    by replacing instances of EXAMPLE.COM and example.com with the correct name —
    being certain to use uppercase and lowercase names in the correct format — and
    changing the KDC from kerberos.com to the name of the Kerberos server. By convention,
    real names are uppercase and all hostnames are lowercase. For full details about
