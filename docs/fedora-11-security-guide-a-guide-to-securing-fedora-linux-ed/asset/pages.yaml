- img_proc: true
  md: '# Chapter 2. Securing Your Network


    Edit the file /etc/xinetd.d/telnet and change the flags line to:


    | flags = SENSOR |


    Add the following line:


    | deny_time = 30 |


    This denies any further connection attempts to that port by host for 30 minutes.
    Other acceptable values for the deny_time attribute is FOREVER, which keeps the
    ban in effect until xinetd is restarted, and NEVER, which allows the connection
    and logs it.


    Finally, the last line should read:


    | disable = no |


    This enables the trap itself.


    While SENSOR is a good way to detect and stop connections from undesirable hosts,
    it has two drawbacks:


    +   * It does not work against stealth scans.

    * An attacker who knows that a SENSOR is running can mount a Denial of Service
    attack against particular hosts by forging their IP addresses and connecting to
    the forbidden port.


    # 2.2.1.2.2. Controlling Server Resources


    Another important feature of xinetd is its ability to set resource limits for
    services under its control.


    It does this using the following directives:


    +   * cps = <number_of_connections> <wait_period> — Limits the rate of incoming
    connections. This directive takes two arguments:

    * <number_of_connections> — The number of connections per second to handle. If
    the rate of incoming connections is higher than this, the service is temporarily
    disabled. The default value is fifty (50).

    * <wait_period> — The number of seconds to wait before re-enabling the service
    after it has been disabled. The default interval is ten (10) seconds.

    * instances = <number_of_connections> — Specifies the total number of connections
    allowed to a service. This directive accepts either an integer value or UNLIMITED.

    * per_source = <number_of_connections> — Specifies the number of connections allowed
    to a service by each host. This directive accepts either an integer value or UNLIMITED.

    * rlimit_as = — Specifies the amount of memory address space the service can occupy
    in kilobytes or megabytes. This directive accepts either an integer value or UNLIMITED.

    * rlimit_cpu = <number_of_seconds> — Specifies the amount of time in seconds that
    a service may occupy the CPU. This directive accepts either an integer value or
    UNLIMITED.


    Using these directives can help prevent any single xinetd service from overwhelming
    the system, resulting in a denial of service.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 2.2.2. Securing Portmap


    The portmap service is a dynamic port daemon for RPC services such as NIS and
    NFS. It has weak authentication mechanisms and has the ability to assign a wide
    range of ports for the services it controls. For these reasons, it is difficult
    to secure.


    > Note

    Securing portmap only affects NFSv2 and NFSv3 implementations, NFSv4 no longer
    requires it. If you plan to implement an NFSv2 or NFSv3 server, then portmap is
    required, and the following section applies.


    If running RPC services, follow these basic rules.


    # 2.2.2.1. Protect portmap With TCP Wrappers


    It is important to use TCP Wrappers to limit which networks or hosts have access
    to the portmap service since it has no built-in form of authentication.


    Further, use only IP addresses when limiting access to the service. Avoid using
    hostnames, as they can be forged by DNS poisoning and other methods.


    # 2.2.2.2. Protect portmap With iptables


    To restrict access to the portmap service, it is a good idea to add iptables rules
    to the server and restrict access to specific networks.


    Below are two example iptables commands. The first allows TCP connections to the
    port 111 (used by the portmap service) from the 192.168.0.0/24 network. The second
    allows TCP connections to the same port from the localhost. This is necessary
    for the sg_fam service used by Nautilus. All other packets are dropped.


    ```

    iptables -A INPUT -p tcp -s 192.168.0.0/24 --dport 111 -j DROP

    iptables -A INPUT -p tcp -s 127.0.0.1 --dport 111 -j ACCEPT

    ```


    To similarly limit UDP traffic, use the following command.


    ```

    iptables -A INPUT -p udp -s 192.168.0.0/24 --dport 111 -j DROP

    ```


    > Note

    Refer to Section 2.8, "Firewalls" for more information about implementing firewalls
    with iptables commands.


    # 2.2.3. Securing NIS


    Network Information Service (NIS) is an RPC service, called ypserv, which is used
    in conjunction with portmap and other related services to distribute maps of usernames,
    passwords, and other sensitive information to any computer claiming to be within
    its domain.


    An NIS server is comprised of several applications. They include the following:'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Chapter 2. Securing Your Network


    +   - /usr/sbin/rpc.yppasswd — Also called the yppasswd service, this daemon allows
    users to change their NIS passwords.


    +   - /usr/sbin/rpc.ypxfrd — Also called the ypxfrd service, this daemon is responsible
    for NIS maps transfers over the network.


    +   - /usr/sbin/yppush — This application propagates changed NIS databases to
    multiple NIS servers.


    +   - /usr/sbin/ypserv — This is the NIS daemon.


    NIS is somewhat insecure by today''s standards. It has no authentication mechanisms
    and transmits all of information over the network unencrypted, password hashes.
    As a result, extreme care must be taken when setting up a network that uses NIS.
    This is further complicated by the fact that the default configuration of NIS
    is inherently insecure.


    It is recommended that anyone planning to implement an NIS server first secure
    the portmap service as outlined in Section 2.2.2, "Securing Portmap", then address
    the following issues, such as network planning.


    # ## 2.2.3.1. Carefully Plan the Network


    Because NIS transmits sensitive information unencrypted over the network, it is
    important the service be run behind a firewall and on a secured and secure network.
    Whenever NIS information is transmitted over the network, it risks being intercepted.
    Careful network design can prevent severe security breaches.


    # ## 2.2.3.2. Use a Password-like NIS Domain Name and Hostname


    Any machine within NIS domain can use commands to extract information from the
    server without authentication, as long as the user knows the NIS server''s DNS
    hostname and NIS domain name.


    For instance, if someone connects a laptop into the network or breaks into the
    network from outside (and manages to spoof an IP address), the following command
    reveals the /etc/passwd map:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> password

    ```


    If this attacker is a root user, they can obtain the /etc/shadow file by typing
    the following command:


    ```

    ypcat -d <NIS_domain> -h <DNS_hostname> shadow

    ```


    > Note If Kerberos is used, the /etc/shadow file is not stored within an NIS map.


    To make access to NIS maps even harder for an attacker, create a random string
    for the DNS hostname, such as 07hfawtgmgwhq.domain.com. Similarly, create a different
    randomized NIS domain name. This makes it much more difficult for an attacker
    to access the NIS server.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# 2.2.3.3. Edit the /var/yp/securenets File


    If the /var/yp/securenets file is blank or does not exist (as is the case after
    a default installation), NIS listens to all networks. One of the first things
    to do is to put netmask/network pairs in the file so ypserv only responds to requests
    from the appropriate network.


    Below is a sample entry from a /var/yp/securenets file:


    ```

    255.255.255.0    192.168.0.0

    ```


    > **Warning**

    Never start an NIS server for the first time without creating the /var/yp/securenets
    file.


    This technique does not provide protection from an IP spoofing attack, but it
    does at place limits on networks the NIS server services.


    # 2.2.3.4. Assign Static Ports and Use iptables Rules


    All of the services related to NIS can be assigned specific ports for rpc.yppasswd
    — the daemon that uses NIS to change their login passwords. Assigning ports to
    the other two NIS server daemons, rpc.ypxfrd and ypserv, allows for creation of
    firewall rules to further protect the NIS server from intruders.


    To do this, add the following lines to /etc/sysconfig/network:


    ```

    YPSERV_ARGS="-p 834" YPXFRD_ARGS="-p 835

    ```


    The following iptables rules can be used to enforce which network the NIS server
    listens to for ports:


    ```

    iptables -A INPUT -p ALL -s 192.168.0.0/24    --dport 834 -j DROP

    iptables -A INPUT -p ALL -s 192.168.0.0/24    --dport 835 -j DROP

    ```


    This means that the server only allows connections to ports 834 and 835 if the
    requests come from the 192.168.0.0/24 network, regardless of the protocol.


    > **Note**

    Refer to Section 2.8, "Firewalls" for more information about implementing firewalls
    with iptables commands.


    # 2.2.3.5. Use Kerberos Authentication


    One of the issues to consider when NIS is used for authentication is that whenever
    a user logs into a machine, a password hash from the /etc/shadow is sent over
    the network. If an intruder gains access to an NIS domain and sniffs network traffic,
    they can collect usernames and password hashes. With enough time, a password cracking
    program can guess weak passwords, and an attacker can gain access to a valid account
    on the network.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Chapter 2. Securing your Network


    Since Kerberos uses secret-key cryptography, no password hashes are ever sent
    over the network, making the system far more secure. Refer to Section 2.6, "Kerberos"
    for more information about Kerberos.


    # 2.2.4. Securing NFS


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_55_0.png)


    > Important

    The version of NFS included in Fedora, NFSv4, no longer requires the portmap service
    as outlined in Section 2.2.2, "Securing Portmap". NFS traffic now utilizes TCP
    in all versions, rather than UDP, and when using NFSv4, NFSv4 includes Kerberos
    user and group authentication, as part of RPCSEC_GSS kernel module. Information
    on portmap is still included, since Fedora supports NFSv2 and NFSv3, both of utilize
    portmap.


    # 2.2.4.1. Carefully Plan the Network


    Now NFS has the ability to pass all file information using Kerberos over a network,
    it is important that the service be configured correctly if there is a firewall
    or on a segmented network. NFSv2 and NFSv3 still pass data insecure, and this
    should be taken into consideration. Careful network design in all of these regards
    can prevent security breaches.


    # 2.2.4.2. Beware of Syntax Errors


    The NFS server determines file systems to export and hosts to export these directories
    by configuring the /etc/exports file. Be careful not to add extraneous spaces
    when editing this file.


    For instance, the following line in the /etc/exports file shares the directory
    /tmp/nfs/ to the host bob.example.com with read/write permissions.


    ```

    /tmp/nfs bob.example.com(rw)

    ```


    The line in the /etc/exports file, on the other hand, shares the same directory
    to the host bob.example.com with read-only permissions and shares it to the world
    with read/write permissions due to a single space character after the hostname.


    ```

    /tmp/nfs bob.example.com (rw)

    ```


    It is good practice to check any configured NFS shares by using the showmount
    command to verify what is shared:


    ```

    showmount -e <hostname>

    ```


    # 2.2.4.3. Do Not Use the no_root_squash Option


    By default, NFS changes the root user to the nnobody user, an unprivileged user
    account. This changes the owner of all root-created files to nnobody, which prevents
    uploading of programs with the setuid bit set.


    If no_root_squash is used, remote root users are able to change any file on the
    shared file system and leave applications infected by trojans for other users
    to inadvertently execute.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# 2.2.4.4. NFS Firewall Configuration


    The ports used for NFS are assigned dynamically by rpcbind, which can cause problems
    when creating firewall rules. To simplify this process, use the /etc/sysconfig/nfs
    file to specify which ports are to be used:


    +   * MOUNT_PORT — TCP and UDP port for mountd (rpc.mount)

    * STAT_PORT — TCP and UDP port for status (rpc.statd)

    * LOCKD_TCPPORT — TCP port for nlockmgr (rpc.lockd)

    * LOCKD_UDPPORT — UDP port for nlockmgr (rpc.lockd)


    Port numbers specified must not be used by any other service. Configure your firewall
    to allow the port numbers specified, as well as TCP and UDP port 2049 (NFS).


    Run the rpcinfo -p command on the NFS server to see which ports and RPC programs
    are used.


    # 2.2.5. Securing the Apache HTTP Server


    Apache HTTP Server is one of the most stable and secure services that ships with
    Fedora. A large number of options and techniques are available to secure the Apache
    HTTP Server — numerous to delve into deeply. The following section explains good
    practices when running the Apache HTTP Server.


    Always verify that any scripts running on the system work as intended before putting
    them into production. Also, ensure that only the root user has permissions to
    any directory containing scripts or CGIs. To do this, run the following commands
    as the root user:


    +   1. chown <directory_name>

    2. chmod 755 <directory_name>


    System administrators should be careful when using the following configuration
    options (configured in /etc/httpd/conf/httpd.conf).


    FollowSymLinks

    This directive is enabled by default, so be to use caution when creating symbolic
    links to the document root of the Web server. For instance, it is a bad idea to
    provide a symbolic link to /.


    Indexes


    This directive is enabled by default, but may not be desirable. To prevent visitors
    from browsing the files on the server, remove this directive.


    UserDir


    The UserDir directive is disabled by default because it can confirm the presence
    of a user account on the system. To enable user directory browsing on the server,
    use the following directives:


    ```

    UserDir enabled

    UserDir disabled root

    ```'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Chapter 2. Securing Your Network


    These directives activate user directory browsing for all users directories other
    than /root/. To add users to the list of disabled accounts, a space-delimited
    list of users on the UserDir disabled line.


    > Important Do not remove the IncludesExec directive. By default, the Server-Side
    Includes (SSI) module cannot execute commands. It is recommended that you do not
    change this setting unless absolutely necessary; as it, potentially, enable an
    attacker to execute commands on the system.


    # 2.2.6. Securing FTP


    The File Transfer Protocol (FTP) is an older TCP protocol designed to transfer
    files over a network. Because all transactions with the server, including user
    authentication, unencrypted, it is considered an insecure protocol and should
    be carefully configured.


    Fedora has three FTP servers.


    +   - gssftpd — A Kerberos-aware xinetd-daemon that does not transmit authentication
    information over the network.

    - Red Hot Content Accelerator (tux) — A kernel-space Web server with FTP capabilities.

    - vsftpd — A standalone, securely oriented implementation of the FTP service.


    The following security guidelines are for setting up vsftpd FTP service.


    # 2.2.6.1. FTP Greeting Banner


    Before submitting a username and password, all users are presented with a greeting
    banner. By default, this banner includes version information useful to crackers
    to identify weaknesses in a system.


    To change the greeting banner for vsftpd, add the following directive to the /etc/vsftpd/vsftpd.conf
    file:


    ```

    ftpd_banner=<insert_greeting_header>

    ```


    Replace <insert_greeting_header> in the above directive with a banner file. To
    simplify management of multiple banners, place all banners in a new directory
    called /etc/banners/ftp.msg. The banner file for FTP connections in this example
    is an example of what such a file may look like:


    ```

    ######## # Hello, all activity on ftp.example.com is logged. #########

    ```


    > Note It is not necessary to begin each line of the file with 220 as specified
    in Section 2.2.1.1.1. "TCP Wrappers and Connection Banners".'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'To reference this greeting banner file for vsftpd, add the following directive
    to the /etc/vsftpd/vsftpd.conf file:


    ```

    banner_file=/etc/banners/ftp.msg

    ```


    It is also possible to send additional banners to incoming connections using TCP
    Wrappers as described in Section 2.2.1.1.1. "TCP Wrappers and Connection Banners".


    # 2.2.6.2. Anonymous Access


    The presence of the /var/ftp/ directory activates the anonymous account.


    The easiest way to create this is to install the vsftpd package. This package
    establishes a directory tree for anonymous users and configures the permissions
    on directories to read-only for anonymous users.


    By default anonymous user cannot write to any directories.


    > Warning

    enabling anonymous access to an FTP server, be aware of where sensitive data is
    stored.


    # 2.2.6.2.1. Anonymous Upload


    To allow anonymous users to upload files, it is recommended that a write-only
    directory be created within /var/ftp/pub/.


    To do this, type the following command:


    ```

    mkdir /var/ftp/pub/upload

    ```


    Next, change the permissions so that anonymous users cannot view the contents
    of the directory:


    ```

    chmod 700 /var/ftp/pub/upload

    ```


    A long format listing of the directory should look like this:


    ```

    drwx-wx-\  2 root  ftp  4096 Feb 13 20:05 upload

    ```


    > Warning

    Administrators who allow anonymous users to read and write in directories find
    that their servers become a repository of stolen software.


    Additionally, under vsftpd, add the following line to the /etc/vsftpd/vsftpd.conf
    file:


    ```

    anon_upload_enable=YES

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 2. Securing Your Network


    # ## 2.2.6.3. User Accounts


    Because FTP transmits unencrypted usernames and passwords over insecure networks
    for authentication, it is a good idea to deny system users access to the server
    from their user accounts.


    To disable all user accounts in **vsftpd**, add the following directive to /etc/vsftpd/vsftpd.conf:


    ```

    local_enable=NO

    ```


    # ## 2.2.6.3.1. Restricting User Accounts


    To disable FTP for specific accounts or groups of accounts, such as the root user
    and those with *sudo* privileges, the easiest way is to use a PAM list file as
    described in Section 2.1.4.2.4, "Disabling Root Using PAM". The PAM configuration
    file for vsftpd is /etc/pam.d/vsftpd.


    It is also possible to disable user accounts within each service.

    To disable user accounts in **vsftpd**, add the username to /etc/vsftpd.ftpsusers


    # ## 2.2.6.4. Use TCP Wrappers To Control Access


    Use TCP Wrappers to control access to every FTP daemon as outlined in Section
    2.2.1.1, "Enhancing Security With TCP Wrappers".


    # ## 2.2.7. Securing Sendmail


    Sendmail is a Mail Transfer Agent (MTA) that uses the Simple Mail Transfer Protocol
    (SMTP) to deliver electronic messages between MTAs and to deliver clients or agents.
    MTAs are capable of encrypting traffic between one another, most do not, so sending
    email over any public networks is an inherently insecure form of communication.


    It is recommended that anyone planning to implement a Sendmail server address
    the following issues.


    # ## 2.2.7.1. Limiting a Denial of Service Attack


    Because of the nature of email, a detected attacker can fill the server with mail
    easily and cause a denial of service. By setting limits to the directives in /etc/sendmail.mc,
    the effectiveness of such attacks is limited.


    +   * **CONNECTION_RATE_THROTTLE** — The number of connections the server can
    receive per second. By default, Sendmail does not limit the number of connections.
    If a limit is set and reached, further connections are denied.


    +   * **MAX_DAEMON_CHILDREN** — The maximum number of child processes that can
    be spawned by the server. By default, Sendmail does not limit the number of child
    processes. If a limit is set and reached, further connections are denied.


    +   * **MIN_FREE_BLOCKS** — The minimum number of free blocks must be available
    for the server to accept mail. The default is 100 blocks.


    +   * **MAX_HEADERS_LENGTH** — The maximum acceptable size (in bytes) for a message
    header.


    +   * **MAX_MESSAGE_SIZE** — The maximum acceptable size (in bytes) for a single
    message.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# 2.2.7.2. NFS and Sendmail


    Never put the mail pool directory, `/var/spool/mail/`, on an NFS shared volume.


    NFSv2 and NFSv3 do not maintain control over user and group IDs, or more users
    have the same UID, and receive and read each other''s mail.


    > Note With NFSv4 using Kerberos, this is not the case, since the SECRPC_GSS kernel
    module does not utilize UID-based authentication. However, it is still considered
    good practice to put the mail pool directory on NFS shared volumes.


    # 2.2.7.3. Mail-only Users


    To prevent local user exploits on the Sendmail server, it is best for mail users
    to only access the Sendmail server using an email program. Shell accounts on the
    mail server should not be allowed and all user shells in the `/etc/passwd` file
    should be set to `/sbin/nologin` (with the possible exception of root user).


    # 2.2.8. Verifying Which Ports Are Listening


    After configuring network services, it is important to pay attention to which
    ports are actually listening on the system''s network interfaces. Any open ports
    can be evidence of an intrusion.


    There are two basic approaches for listing the ports that are listening on the
    network. The less reliable approach is to query the network stack using commands
    as `netstat -an` or `lssof -i`. This method is less reliable since these programs
    do not connect to the machine from the network, but rather check to see what is
    running on the system. For this reason, these applications are frequent targets
    for replacement by attackers. Crackers attempt to cover their tracks if they unauthorized
    network ports by replacing `netstat` and `lssof` with their own, modified versions.


    A more reliable way to check which ports are listening on the network is to use
    a port scanner such as `nmap`.


    The following command issued from the console determines which ports are listening
    for TCP connections from the network:


    ```

    nmap -sT -0 localhost

    ```


    ```

    The output of this Nmap 4.68 ( http://nmap.org ) at 2009-03-06 12:00 EST

    Interesting ports on localhost.localdomain (127.0.0.1):

    Not shown: 1711 closed ports

    PORT STATE SERVICE

    22/tcp open ssh

    25/tcp open smtp

    111/tcp open auth

    113/tcp open open

    631/tcp open ipp

    834/tcp open unknown

    2601/tcp open zebra

    32774/tcp open times-rpc11

    Device type: general purpose

    ```'
