    Figure 2.1. Specifying password age options


    # ### 2.1.4. Administrative Controls


    When administering a home, the user must perform some tasks as the root user or
    by acquiring effective privileges via a setuid program, such as sudo or su. A
    setuid program is one that operates with the user ID (UID) of the program''s owner
    rather than the user operating the program. Such programs are denoted by an s
    in the owner section of a long format listing, as in the example:


    ```

    -rwr-xr-x 1 root root 47324 May 1 08:09 /bin/su

    ```


    > Note The s may be upper case or lower. If it appears as upper case, it means
    that the underlying permission bit has not been set.


    For the system administrators of an organization, choices must be made as to how
    much administrative access users within the organization should have to their
    machine. Through a PAM module called pam_console.so, some activities normally
    reserved for the root user, such as rebooting and mounting removable media are
    available for the first user who logs in at the console (see Section 2.4, "Pluggable
    Authentication Modules (PAM)" for more information about the pam_console.so module).
    However other system administration tasks, such as altering network settings,
