    # 2.4.1. Advantages of PAM


    PAM offers the following advantages:


    +   - a common authentication scheme

    - significant flexibility and control over authentication for both system administrators
    and application developers

    - a single, fully-documented library which allows developers to write programs
    without having to create their own authentication schemes.


    # 2.4.2. PAM Configuration Files


    The /etc/pam.d/ directory contains the PAM configuration files for each PAM-aware
    application. In earlier versions of PAM, the /etc/pam.conf file was used, but
    this file is now deprecated and is only used if the /etc/pam.d/ directory does
    not exist.


    # 2.4.2.1 PAM Service Files


    Each PAM-aware application or service has a file in the /etc/pam.d/ directory.
    Each file in this directory has the same name as the service it controls.


    The PAM-aware program is responsible for defining its service name and installing
    its own PAM configuration file in the /etc/pam.d/ directory. For example, the
    login program defines its service name as login and installs the /etc/pam.d/login
    PAM configuration file.


    # 2.4.3. PAM Configuration File Format


    Each PAM configuration file contains a group of directives formatted as follows:


    ```

    <module interface> <control flag> <module name> <module arguments>

    ```


    Each of these elements is explained in the following sections.


    # 2.4.3.1. Module Interface


    Four types of PAM module interface are currently available. Each of these corresponds
    to a different aspect of the authorization process:


    +   - auth — This module interface authenticates use. For example, it requests
    and verifies the validity of a password. Modules with this interface can also
    set credentials, such as group memberships or Kerberos tickets.

    - account — This module interface verifies that access is allowed. For example,
    it may check if a user account has expired or if a user is allowed to log in at
    a particular time of day.

    - password — This module interface is used for changing user passwords.

    - session — This module interface configures and manages user sessions. Modules
    with this interface can also perform additional tasks that are needed to allow
    access, like mounting a user''s home directory and making the user''s mailbox
    available.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# PAM Configuration File Format


    > ### Note

    An individual module can provide any or all module interfaces. For instance, pam_unix.so
    provides all four module interfaces.


    In a PAM configuration file, the module interface is the first field defined.
    For example, a typical line in a configuration may look like this:


    ```

    auth required pam_unix.so

    ```


    This instructs PAM to use the pam_unix.so module''s auth interface.


    # 2.4.3.1. Stacking Module Interfaces


    Module interface directives can be stacked, or placed upon one another, so that
    multiple modules are used together for one purpose. A module''s control flag uses
    the "sufficient" or "requisite" value (refer to Section 2.4.3.2, "Control Flag"
    for more information on these flags), then the order in which the modules are
    listed is the authentication process.


    Stacking makes it easier for an administrator to require specific conditions before
    allowing the user to authenticate. For example, the reboot command uses several
    stacked modules, as seen in its PAM configuration file:


    ```

    #MyServer]# cat /etc/pam.d/reboot

    #PAM-1.0

    auth sufficient pam_rootok.so

    auth required pam_console.so

    #include system-auth

    account required pam_permit.so

    ```


    +   - The first line is a comment and is not processed.


    +   - auth sufficient pam_rootok.so — This line uses the pam_rootok.so module
    to check the current user is root, by verifying that their UID is 0. If this test
    succeeds, no other modules are considered and the command is executed.


    +   - auth required pam_console.so — This line uses the pam_console.so module
    to attempt to authenticate the user. If this user is already logged in the console,
    pam_console.so checks whether there is a file in the /etc/security/console.apps
    directory with the same name as the service name (reboot). If such a file exists,
    authentication succeeds and is passed to the next module.


    +   - # include system-auth — This line is commented and is not processed.


    +   - account required pam_permit.so — This line uses the pam_permit.so module
    to allow the root user or logged in user to the console at reboot system.


    # 2.4.3.2. Control Flag


    All PAM modules generate a success or failure result when called. Control flags
    tell PAM what to do with the result. Modules can be stacked in a particular order,
    and the control flags determine how important the success or failure of a particular
    module is to the overall goal of authenticating the user to the service.


    61'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Chapter 2. Securing Your Network


    There are four predefined control flags:


    +   - required — The module result must be successful for authentication to continue.
    If the test fails at this point, the user is not notified until the results of
    all module tests that reference that interface are complete.


    +   - requisite — The module result must be successful for authentication to continue.
    If a test fails at this point, the user is notified immediately with a message
    reflecting the first failed required or requisite module test.


    +   - sufficient — The module result is ignored if it fails. However, if the result
    of a module flagged sufficient is successful and no previous modules required
    have failed, then no other results are required and the user is authenticated
    to the service.


    +   - optional — The module result is ignored. A module flagged optional only
    becomes necessary for successful authentication when no other modules reference
    the interface.


    > Order in which required modules are called is not critical. Only the sufficient
    and requisite control flags cause order to become important.


    A newer control syntax allows for more precision and is now available for PAM.


    The pam and the PAM module, located in the /usr/share/doc/pam-<version-number>/
    directory, where <version-number> is the version number for PAM on your system,
    describe this newer syntax in detail.


    # 2.4.3.3. Module Name


    The module provides PAM with the pluggable module containing the specified module
    interface. In older versions of Fedora, the full path to the module was provided
    in the PAM configuration file. However, since the advent of multilib systems,
    which store 64-bit PAM modules in the /lib64/security/ directory, the name is
    omitted because the application is linked to the appropriate version of libpam,
    which can locate the correct version of the module.


    # 2.4.3.4. Module Arguments


    PAM uses arguments to pass information to a pluggable module during authentication
    for modules.


    For example, the pam_userdb.so module uses information stored in a Berkeley DB
    file to authenticate the user. Berkeley DB is an open source database system embedded
    in many applications. The module takes a db argument so Berkeley DB knows which
    to use for the requested service.


    The following is a typical pam_userdb.so line in a PAM configuration. The <path-to-file>
    is the full path to the Berkeley DB database file:


    ```

    required pam_userdb.so db=<path-to-file>

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Invalid arguments are *generally ignored* and do not otherwise affect the success
    or failure of the PAM module. Some modules, however, may fail on invalid arguments.
    Most modules report errors to the / var/log/secure file.


    # 2.4.4. Sample PAM Configuration Files


    The following is a sample PAM application configuration file:


    ```

    #PAM-1.0

    auth required pam_security.so

    auth required pam_unix.so nullock

    auth required pam_nlogin.so

    account required pam_unix.so

    password required pam_cracklib.so retry=3

    password required pam_unix.so shadow nullock user_authok

    session required pam_unix.so

    ```


    +   - The first line is a comment, indicated by the hash mark (#) at the beginning
    of the line.


    +   - Lines through four stack modules pamsecurity.so — This module ensures that
    if the user is trying to log in as root, the tty on which the user is logging
    is listed in the /etc/security file, if that file exists.


    If the tty is not in the file, any attempt to log in as root fails with a Login
    incorrect message.


    +   **auth required pam_unix.so nullock** — This module prompts the user for a
    password and then checks the password using the information stored in /etc/passwd
    and, if it exists, /etc/shadow.


    +   - The argument null instructs the pam_unix.so module to allow a blank password.


    +   **auth required pam_nlogin.so** — This is the final authentication step. It
    checks whether the /etc/nlogin file exists. If it exists and the user is not root,
    authentication fails.


    > Note: In this example, all three auth modules are checked, even if the first
    auth module fails. This prevents the user from knowing what stage their authentication
    fails. Such knowledge in the hands of an attacker could allow them to more easily
    deduce how to crack the system.


    +   - **account required pam_unix.so** — This module performs any necessary account
    verification. For example, if password has have been enabled, the account interface
    of the pam_unix.so module checks to see if the account has expired or if the user
    has not changed the password within the allowed period.


    +   - **password required pam_cracklib.so retry=3** — If a password has expired,
    the component of the pam_cracklib.so module prompts for a new password. It tests
    the newly created password to see whether it can easily be determined by a dictionary-based
    password cracking program.'
