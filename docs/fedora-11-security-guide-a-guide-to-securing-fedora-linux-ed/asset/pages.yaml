    # 1.3. Attackers and Vulnerabilities


    To plan and implement a good security strategy, be first of aware of the issues
    which determined, motivated attackers exploit compromise systems. However, before
    detailing these issues, the terminology used when identifying an attacker must
    be defined.


    # 1.3.1. A Quick History of Hackers


    The modern meaning of the term hacker has origins dating to the 1960s and the
    Massachusetts Institute of Technology (MIT) Tech Member Railroad Club, which designed
    train sets of scale and intricate detail. A hacker was a name for club members
    who discovered a clever trick or workaround for a problem.


    The term has since come to describe everything from computer buffs to gifted programmers.
    A common trait among hackers is willingness to explain how computer systems and
    networks function with little or no outside motivation. Open source software developers
    often consider themselves and their colleagues to hackers, and use the word as
    a term of respect.


    Typically, hackers follow a form of the hacker ethic which dictates that the quest
    for information and expertise is essential, and sharing this knowledge is the
    hackers duty to the community. During this quest for knowledge, many enjoy the
    challenges of circumventing security controls on computer systems. For this reason,
    the press often uses the term hacker to describe those who illicit access systems
    and networks with unscrupulous, malicious, or criminal intent. The more accurate
    term for this type of computer hacker is cracker — a term created by hackers in
    the mid-1980s to differentiate the two communities.'
