    The more complicated, but also more flexible, method involves configuring the
    capaths section of /etc/krb5.conf, so that clients who have credentials for one
    realm will be able to look up krbtgt next in the chain which will eventually lead
    to the able to authenticate to servers.


    The format of the capaths is relatively straightforward; each entry in the system
    is named after a realm in which a client might exist. Inside of that subsection,
    the set of intermediate realms from the client must obtain credentials is listed
    as values of the key which corresponds to the realm in which a service might need.
    If there are no intermediate realms, the value "" is used.


    Here''s an example:


    ```

    [capaths]

    A.EXAMPLE.COM =

    B.EXAMPLE.COM =

    C.EXAMPLE.COM = B.EXAMPLE.COM

    D.EXAMPLE.COM = B.EXAMPLE.COM

    E.EXAMPLE.COM = C.EXAMPLE.COM


    ```


    In this case, clients in the A.EXAMPLE.COM realm can obtain cross-realm credentials
    for B.EXAMPLE.COM directly from the A.EXAMPLE.COM KDC.


    If clients wish to contact a service in the C.EXAMPLE.COM realm, they will first
    need to obtain necessary credentials from the B.EXAMPLE.COM realm (this requires
    krbtgt/B.EXAMPLE.COM to exist), and then use those credentials to obtain credentials
    for use in the C.EXAMPLE.COM realm (using krbtgt/C.EXAMPLE.COM/B.EXAMPLE.COM).


    If clients wish to contact a service in the D.EXAMPLE.COM realm, they will first
    need to obtain necessary credentials from the B.EXAMPLE.COM realm, and then credentials
    from the C.EXAMPLE.COM realm, before obtaining credentials for the D.EXAMPLE.COM
    realm.


    > Note

    Without a capath indicating otherwise, Kerberos assumes that cross-realm trust
    relationships form a hierarchy.


    Clients in the A.EXAMPLE.COM realm can obtain cross-realm credentials from B.EXAMPLE.COM
    directly. Without the "" indicating that, the client would instead attempt to
    use a hierarchical path, in this case:


    ```

    A.EXAMPLE.COM -> EXAMPLE.COM -> B.EXAMPLE.COM

    ```


