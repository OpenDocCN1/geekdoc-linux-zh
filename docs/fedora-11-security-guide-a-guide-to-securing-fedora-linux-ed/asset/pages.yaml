    +   - To connect one LAN/WAN to another via IPsec, refer to Section 2.7.7, "IPsec
    Network-to-Network Configuration".


    # 2.7.6. IPsec Host-to-Host Configuration


    IPsec can be configured to connect one desktop or workstation to another using
    a host-to-host connection. This type of connection uses the network to which each
    host is connected to create a secure tunnel between each. The requirements of
    a host-to-host connection are minimal, as is the configuration of IPsec on each
    host. The hosts need only a dedicated connection to carrier network (such as the
    Internet) and Fedora to create the IPsec connection.


    # 2.7.6.1. Host-to-Host Connection


    A host-to-host IPsec connection is an encrypted connection between two systems,
    both running IPsec with the same authentication key. With the IPsec connection
    active, any network traffic between the two hosts is encrypted.


    To configure a host-to-host IPsec connection, use the following steps for each
    host:


    > Note

    You should perform the following procedures on the actual machine that you are
    configuring. Avoid attempting to configure and establish IPsec connections remotely.


    +   1. In a command shell, type **system-config-network** to start the Network
    Administration Tool.

    2. On the IPsec tab, click **New** to start the IPsec configuration wizard.

    3. Click **Forward** to start configuring a host-to-host IPsec connection.

    4. Enter a unique name for the connection, for example, **ipsec0**. If required,
    select the box to automatically activate the connection when the computer starts.
    Click **Forward** to continue.

    5. Select **Host to Host encryption** as the connection type, and then click **Forward**.

    6. Select the type of encryption to use: manual or automatic.


    If you select manual encryption, an encryption key must be provided later in the
    process. If you select automatic encryption, the *racoon* daemon manages the encryption
    key. The **ipsec-tools** package must be installed if you want to use automatic
    encryption.


    Click **Forward** to continue.'
