    # 2.9.3.4.1. TCP Protocol


    Match options are available for the TCP protocol (-p tcp):


    +   - --dport — Sets the destination port for the packet.


    To configure this option, use a network service name (such as www or smtp): a
    port number; or a range of port numbers.


    To specify a range of port numbers, separate the two numbers with a colon (:).
    For example: **-p tcp --dport 3000:3200**. The largest acceptable valid range
    is **0:65535**.


    Use an exclamation character (!) after the **--dport** option to match all packets
    that do not use that service or port.


    To browse the names and aliases of network services and the port numbers they
    use, view the **/etc/services** file.


    The **destination-port** match option is synonymous with **--dport**.


    +   - --sport Sets the source port of the packet using the same options as **--dport**.
    The **source-port** match option is synonymous with **--sport**.


    +   - --syn Applies to all TCP packets designed to initiate communication, commonly
    called SYN packets. Packets that carry a data payload are untouched.


    Use an exclamation character (!) after the **--syn** option to match all non-SYN
