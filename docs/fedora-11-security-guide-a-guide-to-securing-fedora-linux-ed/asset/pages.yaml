  md: 'This chapter focuses on packet filtering basics, defines the differences between
    ipchains and iptables, explains various options with iptables commands, and explains
    how filtering rules can be preserved between system reboots.


    Refer to Section 2.9.7, "Additional Resources" for instructions on how to construct
    iptables rules and setting up a firewall based on these.


    > **Important**

    The default firewall mechanism in the 2.4 and later kernels is iptables, but iptables
    cannot be used if ipchains is already running. If ipchains is present at boot
    time, the kernel issues an error and fails to start iptables.


    The functionality of ipchains is not affected by these errors.


    # 2.9.1. Packet Filtering


    The Linux kernel uses the Netfilter facility to filter packets, allowing some
    of them to be received or pass through the system without stopping others. This
    facility is built into the Linux kernel, and has three built-in tables or lists,
    as follows:


    +   - **filter** — The default table for handling network packets.

    - **nat** — Used to alter packets that create a new connection and for Network
    Address Translation (NAT).

    - **mangle** — Used for specific types of packet alteration.


    Each table has a group of built-in chains, which correspond to the actions performed
    on the packet by netfilter.


    The built-in chains for the **filter** table are as follows:


    +   - **INPUT** — Applies to network packets that are targeted for the host.

    - **OUTPUT** — Applies to locally-generated network packets.

    - **FORWARD** — Alters network packets routed through the host.


    The built-in chains for the **nat** table are as follows:


    +   - **PREROUTING** — Alters network packets when they arrive.

    - **OUTPUT** — Alters locally-generated network packets before they are sent out.

    - **POSTROUTING** — Alters network packets before they are sent out.


    The built-in chains for the **mangle** table are as follows:


    +   - **INPUT** — Alters network packets targeted for the host.

    - **OUTPUT** — Alters locally-generated network packets before they are sent out.

    - **FORWARD** — Alters network packets routed through the host.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Chapter 2. Securing Your Network


    +   - PREROUTING — Alters incoming network packets before they are routed.


    +   - POSTROUTING — Alters network packets before they are sent out.


    Every network packet received or from a Linux system is subject to at least one
    table. However, a packet may be subjected to multiple rules within each table
    emerging at the end of the chain. The structure and purpose of these rules may
    vary, but unless seek to identify a packet coming from or going to a particular
    IP address, or set of addresses, using a particular protocol and network service.


    > Note

    By default, firewall rules are saved in the /etc/sysconfig/iptables or /etc/sysconfig/iptables
    files.

    The iptables starts before any DNS-related services when a Linux system is booted.
    This means that firewall rules can only reference numeric IP addresses (for example,
    192.168.0.1). Domain names (for example, host.example.com) in such rules produce
    errors.


    Regardless of this, when packets match a particular rule in one of the tables,
    a target or action is applied. If the rules specify an ACCEPT target for a matching
    packet, the packet skips the rest of the rule checks and continues to its connection.
    If a rule specifies a DROP target, that is refused access to the system and is
    not sent back to the host that sent the packet. If a rule specifies a QUEUE target,
    the packet is passed to user-space. If a rule specifies the optional REJECT target,
    the packet is dropped, but an error packet is sent to the packet''s originator.


    Every chain has a default policy to ACCEPT, DROP, REJECT, or QUEUE. If none of
    the rules in the chain apply to the packet, then the packet is dealt with in accordance
    with the default policy.


    The iptables command configures these tables, as well as sets up new tables if
    necessary.


    # 2.9.2. Differences Between IPTables and IPTChains


    Both iptchains and iptables use chains of rules that operate within the Linux
    kernel to filter packets based on matches with specified rules or sets. However,
    iptables offers a more extensible way of filtering packets, giving the administrator
    greater control without bundling complexity into the system.


    You should be aware of the significant differences between iptchains and iptables:


    Using iptables, each filtered packet is processed using rules from only one chain
    than multiple chains.


    For example, a FORWARD packet coming into a system using iptchains would have
    to go through the INPUT, FORWARD, and OUTPUT chains to continue to its destination.
    However, iptables only sends packets to the INPUT chain if they are destined for
    the local system, and only sends them to the OUTPUT chain if the local system
    generated the packets. It is therefore important to place the rule design to catch
    a particular packet within the chain that actually handles the packet.


    The DENY target has been changed to DROP.


    In iptchains, packets that matched a rule in a chain could be directed to the
    DENY target. This target must be changed to DROP in iptables.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Order matters when placing options in a rule.


    In **ipchains**, the order of the rule options does not matter.


    The **iptables** command has a stricter syntax. The **iptables** command requires
    that the protocol (ICMP, TCP, or UDP) be specified before the source or destination
    ports.


    Network interfaces must be associated with the correct chains in firewall rules.


    For example, incoming interfaces (-i option) can only be used in INPUT or FORWARD
    chains. Similarly, outgoing interfaces (-o option) can only be used in FORWARD
    or OUTPUT chains.


    In other words, INPUT chains and incoming interfaces work together; OUTPUT chains
    and outgoing interfaces work together. FORWARD chains work with both incoming
    and outgoing interfaces.


    OUTPUT chains are not used by incoming interfaces, and INPUT chains are not seen
    by packets moving through outgoing interfaces.


    This is not a comprehensive list of the changes. Refer to Section 2.9.7, "Additional
    Resources" for more specific information.


    # 2.9.3. Command Options for IPTables


    Rules for filtering packets are created using the **iptables** command. The following
    aspects of the packet are most often used as criteria:


    +   * **Packet Type** — Specifies the type of packets the command


    +   * **Packet Source/Destination** — Specifies which packets the command filters
    based on the source or destination of the packet.


    +   * **Target** — Specifies what action is taken on packets matching the above
    criteria.


    Refer to Section 2.9.3.4, "IPTables Match Options" and Section 2.9.3.5, "Target
    Options" for more specific options that address these aspects of a packet.


    The options used with specific **iptables** rules must be grouped logically, based
    on the purpose and conditions of the overall rule, for the rule to be valid. The
    remainder of this section explains commonly-using the **iptables** command.


    # 2.9.3.1. Structure of IPTables Command Options


    Many **iptables** command have the following structure:


    ```

    iptables [-t <table-name>] <command> <chain-name> \ <parameter-1> <option-1> \
    <parameter-n><option-n>

    ```


    <table-name> — Specifies which table the rule applies to. If omitted, the **filter**
    table is used.


    <command> — Specifies the action to perform, such as appending or deleting a rule.


    <chain-name> — Specifies the chain to edit, create, or delete.


    <parameter>-<option> pairs — Parameters and associated options that specify how
    to process a packet that matches the rule.


    The length and complexity of an **iptables** command can change significantly,
    based on its purpose.'
