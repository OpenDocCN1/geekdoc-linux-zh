    +   - Red Hat Linux Firewalls, by Bill McCarthy; Red Hat Press — a comprehensive
    reference to building network and server using source packet filtering technology
    as Netfilter and iptables. It covers topics that analyzing firewall logs, developing
    firewall rules, and customizing your firewall using various graphical tools.


    +   - Linux Firewalls, by Robert Ziegler; New Riders Press — contains a wealth
    of information on building firewalls using both 2.2 chains as well as Netfilter
    and iptables. Additional security topics such as remote access issues and intrusion
    detection systems are also covered.


    # 2.9. IPTables


    Included with Fedora are advanced tools for network packet filtering — the process
    of controlling network packets as they enter, move out, and through the network
    stack within the kernel. Kernel versions prior to 2.4 relied on ipchains for packet
    filtering and used lists of rules applied at each step of the filtering process.
    The 2.4 kernel introduced iptables (also called netfilter), which is similar to
    ipchains but greatly expands the scope and control available for filtering network
    packets.'
