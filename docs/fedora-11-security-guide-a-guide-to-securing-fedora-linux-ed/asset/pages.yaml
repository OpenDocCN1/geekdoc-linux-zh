  md: 'Understanding the way an organization (and the people that make up the organization)
    conducts business is paramount to implementing a proper security plan.


    # 1.1.1.3. Standardizing Security


    Enter in every industry rely on regulations and rules that are set by standards-making
    bodies such as the American Medical Association (AMA) or the Institute of Electrical
    and Electronics Engineers (IEEE). Many ideals hold true for information security.
    Many security consultants and vendors agree upon the standard security model known
    as CIA, or Confidentiality, Integrity, and Availability. This three-tiered model
    is generally accepted component to assessing risks of sensitive information and
    establishing security policy. The following describes the CIA model in further
    detail:


    +   - Confidentiality — Sensitive information must be available only to a set
    of pre-defined individuals. Unauthorized transmission and use of information should
    be restricted. For example, confidentiality of information ensures that a customer''s
    personal or financial information is not obtained by an unauthorized individual
    for malicious purposes as identity theft or credit fraud.


    +   - Integrity — Information should not be altered in ways that render it incomplete
    or incorrect. Unauthorized users should be restricted from the ability to modify
    or destroy sensitive information.


    +   - Availability — Information should be accessible to authorized users that
    it is needed. Availability is a warranty that information can be obtained with
    an agreed-upon frequency and timeliness. This is often measured in terms of percentages
    and agreed to formally in Service Level Agreements (SLAs) used by network providers
    and their enterprise clients.


    # 1.1.2. SELinux


    Fedora includes an enhancement to the Linux kernel called SELinux, which implements
    a Mandatory Access Control (MAC) architecture that provides a fine-grained level
    of control over files, processes, users and applications in the system. Detailed
    description of SELinux is beyond the scope of this document; however, for more
    information on SELinux and its use in Fedora, refer to the SELinux User Guide
    available at http://docs.fedoraproject.org/selinux-user-guide/. Other available
    resources for SELinux are located in Chapter 7, References.


    # 1.1.1.3. Security Controls


    Computer security is often divided into three distinct master categories, commonly
    referred to as controls:


    +   - Physical


    +   - Technical


    +   - Administrative


    These three categories define the main objectives of proper security implementation.
    These controls are sub-categories that further detail the controls and how to
    implement them.


    # 1.1.3.1. Physical Controls


    Physical control is the implementation of security measures in a defined structure
    to deter or prevent unauthorized access to sensitive material. Examples of physical
    controls are:


    +   - Closed-circuit surveillance cameras'
