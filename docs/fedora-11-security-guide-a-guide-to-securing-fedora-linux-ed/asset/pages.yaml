    \ This form of network segmentation\ncan provide safer than allowing HTTP connections\
    \ to a machine on the network.\n\nIf the HTTP server is configured to accept secure\
    \ connections, then port 443 must be forwarded as\nwell.\n\n# 2.8.6. Malicious\
    \ Software and Spoofed IP Addresses\n\nMore rules can be created to control access\
    \ to subnets, or even specific nodes,\nwithin a LAN. You can also restrict certain\
    \ applications or programs such as trojans, worms,\nand other client/server nodes\
    \ from contacting their server.\n\nFor example, trojans scan networks for services\
