  md: '# Chapter 2. Securing Your Network


    Because TCP Wrappers are a valuable addition to any server administrator''s arsenal
    of security tools, most network services in Fedora are linked to the libwrap.a
    library. Some such applications include /usr/sbin/sshd, /usr/sbin/sendmail, and
    /usr/sbin/xinetd.


    > Note

    To determine if a network service is linked to libwrap.a, type the command as
    the root user:

