  md: 'For example, if your LAN uses the 192.168.1.0/24 range, you can design a rule
    that instructs the Internet-facing network device (for example, eth0) to drop
    any packets to that with an address in your LAN IP range.


    Because it is recommended to reject forwarded packets as a default policy, any
