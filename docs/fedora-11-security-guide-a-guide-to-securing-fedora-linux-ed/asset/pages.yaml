    Replace <kernel-package> in the previous example with the name of the kernel RPM.


    Once the machine has been safely rebooted using the new kernel, the old kernel
    may be removed using the following command:


    ```

    rpm -e <old-kernel-package>

    ```


    Replace <old-kernel-package> in the previous example with the name of the older
    kernel RPM.


    > Note

    It is a requirement that the old kernel be removed. The default boot loader, GRUB,
    allows for multiple kernels to be installed, then chosen from a menu at boot time.


