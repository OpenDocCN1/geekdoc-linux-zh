    +   Preventing System Booting — Some BIOSes allow password protection of the boot
    process. When activated, an attacker is forced to enter a password before the
    BIOS launches the boot loader.


    Because the methods for setting a BIOS password between computer manufacturers,
    consult the computer''s manual for specific instructions.


    If you forget the BIOS password, it can be reset with jumpers on the motherboard
    or by disconnecting the CMOS battery. For this reason, it is good practice to
    lock the computer case if possible. However, consult the manual for the computer
    or motherboard before attempting to disconnect the CMOS battery.


    # 2.1.2.1.1. Securing Non-x86 Platforms


    Other architectures use different programs to perform low-level tasks roughly
    equivalent to those of the BIOS on x86 systems. For instance, Intel® Itanium™
    computers use the Extensible Firmware Interface (EFI) shell.


    For instructions protecting BIOS-like programs on other architectures, refer to
    the manufacturer''s instructions.


    # 2.1.2.2. Boot Loader Passwords


    The primary reasons for password protecting a Linux boot loader are as follows:


    +   Preventing Access to Single User Mode — If attackers can boot the system into
    single user mode, they are logged in automatically without being prompted for
    the root.

    Preventing Access to the GRUB Console — If the machine uses GRUB as its boot loader,
    an attacker can use the GRUB editor interface to change its configuration or gather
    information using the *cat* command.

    Preventing Access to Insecure Operating Systems — If it is a dual-boot system,
    an attacker can select an operating system at boot time (for example, DOS), which
    ignores access controls and file permissions.


