  md: '# Chapter 2. Securing Your Network


    hash


    Also known as a *hash value*. A value generated by passing a string through a
    *hash function*. These values are typically used to ensure that transmitted data
    has not been tampered with.


    hash function


    A way of generating a digital "fingerprint" from input data. These functions rearrange,
    transpose, or otherwise alter data to produce a *hash value*.


    key


    Data used when encrypting or decrypting data. Encrypted data cannot be decrypted
    without the proper key or extremely good fortune on the part of the cracker.


    key distribution center (KDC)


    A service that issues Kerberos tickets, and which usually run on the same host
    as the ticket-granting server (TGS).


    keytab (or key table)


    A file that contains an encrypted list of principals and their keys. Servers retrieve
    the keys they need from keytab instead of using **kinit**. The default keytab
    file is `/etc/krb5.keytab`. The KDC administration server, `/var/kerberos/krb5dc/sbin/kadmind`,
    is the only service that uses other files (`/var/kerberos/krb5dc/kad5.keytab`).
    Refer to the **kinit** man page for more information.


    kinit


    The **kinit** command allows a principal who has logged in to cache the initial
    ticket-granting ticket (TGT). Refer to the **kinit** man page for more information.


    principal (or principal name)


    The principal is the unique name of a user or service used to authenticate with
    Kerberos. A principal follows the form `root/Instance@REALM`. For a typical user,
    the root is the same as their login ID. The **instance** is optional. If a principal
    has an instance, it is separated from the root with a forward slash (/"). An empty
    string ("") is considered a valid instance (which differs from the default **NULL**
    instance), but using can be confusing. All principals in a realm have their own
    key, which is used for users from a password or is randomly generated for services.


    realm


    A network that uses Kerberos, composed of one or more servers called KDCs and
    a potentially large number of clients.


    service


    A program accessed over the network.


    ticket


    A temporary set of electronic credentials that verify the identity of a client
    for a particular service. Also called credentials.


    ticket-granting server (TGS)


    A service that issues tickets for a desired service which are in turn given to
    users for access to the service. The TGS usually runs on the same host as the
    KDC.


    ticket-granting ticket (TGT)


    A special ticket that allows the client to obtain additional tickets without applying
    for them from the KDC.'
