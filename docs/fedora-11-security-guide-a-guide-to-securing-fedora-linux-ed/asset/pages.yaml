  md: '# Chapter 4.


    # General Principles of Information

    Security


    The following general principles provide an overview of good security practices:


    +   - encrypt all data transmitted over networks to help prevent man-in-the-middle
    attacks and eavesdropping. It is important to encrypt authentication information,
    such as passwords.

    - minimize the amount of software installed and running services.

    - use security-enhancing software and tools, for example, Security-Enhanced Linux
    (SELinux) for Mandatory Access Control (MAC), Netfilter iptables for packet filtering
    (firewall), and the GNU Privacy Guard (GPG) for encrypting files.

    - if possible, run each network service on a separate system to minimize the risk
    of compromised service being used to compromise other services.

    - maintain user accounts: create and enforce a strong password policy; delete
    unused user accounts.


    +   - routinely review system and application logs. By default, security-relevant
    logs are written to /var/log/secure and /var/log/audit/.log. Note: sending to
    a dedicated log server prevents attackers from easily modifying logs to avoid
    detection

    - never log in as root unless absolutely necessary. It is recommended that administrators
    use sudo to execute commands when required. Users capable of running sudo are
    specified in /etc/sudoers. We use the visudo to edit /etc/sudoers.


    # 4.1. Tips, Guides, and Tools


    The United National Security Agency (NSA) provides hardening guides and tips for
    many operating systems, to help government agencies, businesses, and individuals
    secure their systems against attack. The following guides (in PDF format) provide
    guidance for Red Enterprise Linux 5


    +   - Hardening Tips for the Red Enterprise Linux 5

    - Guide to the Secure Configuration of Red Enterprise Linux 5


    The Defense Information Systems Agency (ISA) provides documentation, checklists,
    and tests to help secure your system (Information Assurance Support Environment).
    The SECURITY TECHNICAL IMPLEMENTATION GUIDE (PDF) is a very specific guide to
    UNIX security - an advanced knowledge of UNIX and is recommended for reading this
    guide.


    The DISA UNIX Security Checklist Version 5, Release 1.16 provides a collection
    of documents and checklists, ranging from the correct ownership and modes for
    systems, to patch control.


    ```

    ¹ http://www.nsa.gov/

    ² http://www.dasa.mil/

    ³ http://iase.dasa.mil/index2.html

    ⁴ http://iase.dasa.mil/stigs/stigs/unix-stig-v5r1.pdf

    ⁵ http://iase.dasa.mil/stigs/checklist/unix_checklist_v5r1-16_200902015.ZIP

    ```'
