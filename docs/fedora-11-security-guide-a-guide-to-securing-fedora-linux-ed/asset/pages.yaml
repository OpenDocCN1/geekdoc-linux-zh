  md: '> Note

    Due to an issue with this option, you should add a trailing space to the log-prefix
    value.


    +   - -log-tcp-options — Logs any options set in the header of a TCP packet.


    +   - -log-tcp-sequence — Writes the TCP sequence number for the packet in the
    log.


    +   - REJECT — Sends an error packet back to the remote system and drops the packet.


    The REJECT target accepts -reject-with <type> (where <type> is the rejection type)
    allowing more detailed information to be returned in the error packet. The message
    port-unreachable is the default error type if no other option is used. Refer to
    the iptables name for a full list of <type> options.


    Other extensions, including several that are useful for IP masquerading the nat
    table, or with packet allocation using the mangle table, can be found in the iptables
    page.


    # 2.9.3.6. Listing Options


    The default command list iptables -L [<chain-name], provides a very basic overview
    of the default filter table''s current chains. Additional options provide more
    information:


    +   - -v Displays verbose output, such as the number of packets and bytes each
    chain processed, the number of packets and bytes each chain matches, and which
    interfaces applies to a particular rule.


    +   - -x Expands numbers into their exact values. On a busy system, the number
    of packets and bytes processed by a particular chain or rule may be abbreviated
    to Kilobytes, Megabytes (Megabytes) or Gigabytes. This option forces the full
    number to be displayed.


    +   - -n Displays IP addresses and port numbers in numeric format, rather than
    the default hostname and network service format.


    +   - --line-numbers Lists rules in each chain to their numeric order in the chain.
    This option is useful when attempting to delete the specific rule in a chain or
    location to insert a rule within a chain.


    +   - -t <table-name> Specifies a table name. If omitted, defaults to the filter
    table.


    # 2.9.4. Saving IPTables Rules


    Rules created with the iptables command are stored in memory. If the system is
    restarted before saving the iptables rule, all rules are lost. For netfilter rules
    to persist through a system reboot, they need to be saved. To save netfilter rules,
    type the following command as root:


    ```

    /sbin/service iptables-save

    ```


    This executes the iptables init script, which runs the /sbin/iptables-save program
    and writes the current iptables configuration to /etc/sysconfig/iptables. The
    existing /etc/sysconfig/iptables file is saved as /etc/sysconfig/iptables.save.'
