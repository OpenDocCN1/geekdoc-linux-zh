  md: '# Firewalls


    PC to data center solutions safeguarding vital enterprise information. Firewalls
    can be stand-alone hardware solutions, such as firewall appliances by Cisco, Nokia,
    and Sonicwall. Vendors such as Checkpoint, McAfee, and Symantec have also developed
    proprietary software firewall solutions for home and business markets.


    Apart from the differences between hardware and software firewalls, there are
    also differences in the way firewalls function that separate one solution from
    another. Table 2.2, "Firewall Types" details three common types of firewalls and
    how they function:


    | Method | Description | Advantages | Disadvantages |

    | --- | --- | --- | --- |

    | NAT | Network Address Translation (NAT) places IP subnet behind one or small
    pool of public addresses, masquerading all requests to one source rather than
    several. The Linux kernel has built-in functionality through the Netfilter kernel.
    | - Can be configured transparently to machines on a LAN - Protection of many
    machines and services behind one or more IP addresses simplifies administration
    duties - Restriction of user access to and LAN can be configured by opening and
    closing ports on the NAT firewall/gateway | - Cannot prevent malicious activity
    once users connect to a service outlet of the firewall |

    | Packet Filter | A packet filtering reads each data packet that passes through
    a LAN. It can read and process packets by header information and filters the packet
    based on sets of programmable rules implemented by the firewall administrator.
    The Linux kernel has built-in packet filtering functionality through the Netfilter
    kernel | - Customizable through the iptables front-end - Does not require customization
    on the client side, as all network activity is filtered at the router level rather
    than the application level - Since packets are not transmitted through a proxy,
    network performance is faster due to direct connection from client to remote host
    | - Cannot filter packets for content like proxy firewalls - Processes packets
    at the protocol layer, cannot filter packets at an application layer - Complex
    network architectures can make establishing firewall rules difficult, especially
    if coupled with IP mapping or local subunits and DNS networks |

    | Proxy | Proxy firewalls all requests of a protocol or from LAN clients to a
    proxy, which makes those requests to the Internet behalf of the local client.
    A proxy machine acts as a buffer between malicious users and the internal network
    client machines. | - Gives control over what applications and protocols function
    outside of the LAN - Some servers cache frequently-accessed data locally rather
    than using the Internet to request it. It helps to reduce bandwidth consumption
    - Proxy servers can be logged and monitored closely, allowing tighter | - Proxies
    are application-specific (HTTP, Telnet, etc.), or protocol-restricted (most proxies
    work with TCP-connected services only) - Application services cannot run behind
    a proxy, so your application servers must use a separate form of network security
    - Proxies can become a network bottleneck, as all requests and transmissions |


    113'
