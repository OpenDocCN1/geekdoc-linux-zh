- img_proc: true
  md: '# Chapter 2. Securing Your Network


    +   - Use secure protocols whenever possible.

    - Serve only one type of network service per machine whenever possible.

    - Monitor all servers carefully for suspicious activity.


    # 2.2.1. Securing Services With TCP Wrappers and xineted


    TCP Wrappers provide access control to a variety of network services. Most modern
    network services, such as SSH, Telnet, and FTP, make use of TCP Wrappers, which
    stand guard between an incoming request and the requested service.


    The benefits offered by TCP Wrappers are enhanced when used in conjunction with
    xineted, a super server that provides additional access, logging, binding, redirection,
    and resource utilization control.


    > > It is a good idea to use iptables firewall rules in conjunction with TCP Wrappers
    and xineted to create redundancy within service access controls. Refer to Section
    2.8, "Firewalls" for more information about implementing firewalls with iptables
    commands.


    The following subsections assume a basic knowledge of each topic and focus on
    specific security options.


    # 2.2.1.1. Enhancing Security With TCP Wrappers


    TCP Wrappers are capable of more than denying access to services. This section
    illustrates how they can be used to send connection banners, warn of attacks from
    particular hosts, and enhance logging functionality. Refer to the hosts_options
    man page for information about the TCP Wrapper functionality and control language.


    # 2.2.1.1.1. TCP Wrappers and Connection Banners


    Displaying a suitable banner when users connect to a service is a good way to
    let potential attackers know that the system administrator is vigilant. You can
    also control information about the system is presented to users. To implement
    a TCP Wrapper for a service, use the banner option.


    This example implements a banner for vsftpd. To begin, create a banner file. It
    can be anywhere on the system, but must have the same name as the daemon. For
    this example, the file is called /etc/banners/vsftpd and contains the following:


    ```

    220-Hello, %c

    220-All activity on ftp.example.com is logged.

    220-Inappropriate use will result in your access privileges being removed.

    ```


    The % token supplies a variety of client information, such as the username and
    hostname, or the username and IP address to make the connection even more intimidating.


    For this banner to be displayed on incoming connections, add the following line
    to the /etc/hosts.allow file:


    ```

    vsftpd : ALL : banners /etc/banners/

    ```'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# ## 2.2.1.1.2. TCP Wrappers and Attack Warnings


    If a particular host or network has been detected attacking the server, TCP Wrappers
    can be used to warn the administrator of subsequent attacks from that host or
    network using the `spawn` directive.


    In this example, a cracker from the 206.182.68/24 network has been detected attempting
    to attack the server. Place the following line in the `/etc/hosts.deny` to deny
    any connection attempts from the network, and to log the attempts to special file:


    ```

    ALL : 206.182.68.0 : spawn /bin/date %d >> /var/log/intruder_alert

    ```


    The `%d` token supplies the name of the service that the attacker was trying to
    access.


    To allow the connection and log it, place the `spawn` directive in the `/etc/hosts.allow`
    file.


    > Note Because the spawn directive executes any shell command, it is a good idea
    to create a special script to notify the administrator or execute a chain of commands
    in the event that a particular client attempts to connect to the server.


    # ## 2.2.1.1.3. TCP Wrappers and Enhanced Logging


    If certain types of connections are of more concern than others, the log level
    can be elevated for service using the `severity` option.


    For this example, anyone attempting to connect to port 23 (the Telnet port) on
    an FTP server is a hacker. To denote this, place an `emerg` flag in the log files
    instead of the default flag, `info`, and deny the connection.


    To do this, place the following line in `/etc/hosts.deny`:


    ```

    in.telnet : ALL : severity emerg

    ```


    This uses the `authpriv` logging facility, but elevates the priority from the
    default value of `info` to `emerg`, which posts log messages directly to the console.


    # ## 2.2.1.2. Enhancing Security with xinetd


    This section focuses on using `xinetd` to set a trap service and using it to control
    resource levels available to any `xinetd` service. Setting resource limits for
    services can help prevent `Denial of Service (DoS)` attacks. Refer to the pages
    for `xinetd` and `xinetd.conf` for a list of available options.


    # ## 2.2.1.2.1. Setting a Trap


    One important feature of `xinetd` is its ability to add hosts to a global `no_access`
    list. Hosts on this list are denied subsequent connections to services managed
    by `xinetd` for a period or until `xinetd` is restarted. You can do this using
    the `SENSOR` attribute. This is an easy way to block hosts attempting to scan
    the ports on the server.


    The first step in setting up a SENSOR is to choose a service you do not plan on
    using. For this example, Telnet is used.'
