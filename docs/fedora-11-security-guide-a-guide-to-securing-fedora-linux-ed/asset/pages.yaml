  md: '# Secure Installation


    Security begins with the first time you put CD or DVD into your disk drive to
    install Fedora. Configuring your system from the beginning makes it easier to
    implement additional security settings.


    # 5.1. Disk Partitions


    The NSA recommends keeping separate partitions for /boot, /home, /tmp, /var /var/tmp.
    The reasons for each are different and we will address each partition.


    /boot - This is the first partition that is read by the system during boot up.
    The boot loader and kernel images that are used to boot your system into Fedora
    are stored in this partition. This partition should not be encrypted. If this
    partition is included in / and that partition is encrypted or otherwise becomes
    unavailable then your system will not be able to boot.


    /home - When user use data is stored in / instead of a separate partition, the
    partition can fail causing the operating system to become unstable. Also, when
    upgrading your system to the next version of Fedora is a lot easier when you keep
    your data in the /home partition as it will not be overwritten during installation.
    If the root partition (/) becomes corrupt your data could be lost forever. By
    using a separate partition there is much more protection against data loss. You
    can also target this partition for frequent backups.


    /tmp and /var - Both the /tmp and the /vartmp directories are used to store data
    that doesn''t need to be stored for a long period of time. However if a lot of
    data floods one of these it can consume all of your storage space. If this happens
    these directories are stored within / then your system could become unstable and
    crash. For this reason, moving these directories into their own partitions is
    a good idea.


    # 5.2. Utilize LUKS Partition Encryption


    Since Fedora 9, implementation of Linux Unified Key Setup-on-disk-format(LUKS)
    encryption has become a lot easier. During the installation process an option
    to encrypt your partitions will be presented to the user. The user must supply
    a passphrase that will be the key to unlock the bulk encryption key that will
    be used to secure the partition''s data.


    Fedora 8, however, does not have LUKS support built-in; however it is easily implemented.
    Step-by-step procedures are available that allow the user to implement partition
    encryption on their Fedora 8 installation.


    > 5 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption

    2 http://fedoraaproject.org/wiki/Security_Guide/9/LUKSDiskEncryption#Step-by-Step_Instructions'
