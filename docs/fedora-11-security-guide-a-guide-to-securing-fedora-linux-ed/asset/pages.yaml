  md: '# Chapter 2. Securing Your Network


    Further, authenticating users to network services can prove dangerous when the
    method used by the protocol is inherently insecure, as evidenced by the transfer
    of unencrypted passwords over a network using the traditional FTP and Telnet protocols.


    Kerberos is a way to eliminate the need for protocols that allow unsafe methods
    of authentication, enhancing overall network security.


    # 2.6.1. What is Kerberos?


    Kerberos is a network authentication protocol created by MIT, and uses symmetric-key
    cryptography to authenticate users to network services, which means passwords
    are never actually sent over the network.


    Consequently, when users authenticate to network services using Kerberos, unauthorized
    users attempting to gather passwords by monitoring network traffic are effectively
    thwarted.


    # 2.6.1.1. Advantages of Kerberos


    Most conventional network services use password-based authentication schemes.
    Such schemes require a user to authenticate to a given network by supplying their
    username and password. Unfortunately, the transmission of authentication information
    for many services is unencrypted. For such a scheme to be secure, the network
    has be inaccessible to outsiders, and all computers and users on the network must
    be trusted and thoroughly.


    Even if this is the case, a network that is connected to the Internet can no longer
    be assumed to be secure. Any attacker who gains access to the network can use
    a simple packet analyzer, also known as a packet sniffer, to intercept usernames
    and passwords, compromising user accounts and the integrity of the entire security
    infrastructure.


    The design goal of Kerberos is to eliminate the transmission of unencrypted passwords
    across the network. If used properly, Kerberos effectively eliminates the threat
    that packet sniffers would otherwise pose on a network.


    # 2.6.1.2. Disadvantages of Kerberos


    Although Kerberos removes a common and severe security threat, it might be difficult
    to implement for a variety of reasons:


    +   Migrating users from a standard UNIX password database, such as /etc/passwd
    or /etc/shadow, to a Kerberos password database can be tedious, as there is no
    automated mechanism to perform this task. Refer to Question 23 in the online Kerberos
    FAQ:


    http://www.nrl.navy.mil/CCS/people/kenh/kerberos-faq.htm


    +   Kerberos has only partial compatibility with the Pluggable Authentication
    Modules (PAM) system used by most servers. Refer to Section 2.6.4, “Kerberos and
    PAM” for more information about this issue.


    +   Kerberos assumes that each user is trusted but is using an untrusted host
    on an untrusted network. Its primary goal is to prevent unencrypted passwords
    from being transmitted across that network. However, if anyone other than the
    proper user has access to the one that issues tickets used


    A system where both the client and the server share a common key is used to encrypt
    and decrypt network communication.'
