    # 2.8.2.2. Enabling and Disabling the Firewall


    +   - Disabling the firewall provides complete access to your system and does
    no security checking. This should only be selected if you are running on a trusted
    network (not the Internet) or need to configure a custom firewall using the iptables
    command line tool.

    - Enabled — This option configures the system to reject incoming connections that
    are not in response to outbound requests, such as DNS replies or DHCP requests.
    If access to services running on this machine is needed, you can choose to allow
    specific services through the firewall.


