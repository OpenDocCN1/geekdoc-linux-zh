    # 2.4.7. PAM and Device Ownership


    In Fedora, the first user logs in to the physical console of the machine can manipulate
    devices and perform tasks normally for the root user. This is controlled by a
    PAM module called pam_console.so.


    # 2.4.7.1. Device Ownership


    When a user logs in to a Fedora system, the pam_console.so is called by login
    or the graphical login programs, gdm, kdm, and xdm. If this is the first user
    to log in at the physical console — referred to as the console — the module grants
    the user ownership of a variety of devices normally owned by root. The console
    user owns these devices until the last session for that user ends. After this
    user has logged out, ownership of devices reverts back to the root user.


    The devices affected, but are not limited to, sound cards, disk devices, and CD-ROM
    devices, simplifying common tasks for the console user.


    You may find the list of devices controlled by pam_console.so by editing the following
    files:


    +   - /etc/security/console.perms


    +   - /etc/security/console.perms.50-default.perms


    You can change the permissions of different devices than those listed in the above
    files, or override the specified defaults. Rather than modifying the 50-default.perms
    file, you create a new file (for example, xx-name.perms) and enter the required
    modifications. The name of the new default file must begin with a number higher
    than 50 (for 51-default.perms). This will override the defaults in the 50-default.perms
    file.


    > Warning If the gdm, kdm, xdm display manager configuration file has been altered
    to allow users to log in and how it is configured to run at level 5, it is advisable
    to change the <console> and <console> directives in the /etc/security/console.perms
    to the following values:


    ```

    <console>=tty[0-9]* vc/[0-9]* :0\.[0-9]* :0\.[0-9] :0

    <console>=:\.[0-9] :0

    ```'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'This prevents remote users from gaining access to devices and restricted applications
    on the machine.


    If the gdm, kdm, and xdm display manager configuration file has been altered to
    allow remote users to log in and the host is configured to run at multiple user
    level other than 5, it is advisable to remove the <console> directive entirely
    and change the <console> directive to the following value:


    ```

    <console>=tty[0-9][0-9] vnc/[0-9][0-9]*

    ```


    # 2.4.7.2. Application Access


    The console user also has access to certain programs configured for use in the
    /etc/security/console.apps/ directory.


    This directory contains configuration files which enable the console user to run
    certain applications in /sbin and /usr/sbin.


    These configuration files have the same name as the applications that they set
    upon.


    One notable group of applications that the console user has access to are three
    programs that shut down or reboot the system:


    +   * /sbin/halt

    * /sbin/reboot

    * /sbin/poweroff


    Because these are PAM-aware applications, they call the pam_console.so module
    as a requirement for use.


    Refer to Section 2.8.9.1, "Installed Firewall Documentation" for more information.


    # 2.4.8. Additional Resources


    The following resources explain methods to use and configure PAM. In addition
    to these resources, read the PAM configuration files on the system to better understand
    how they are structured.


