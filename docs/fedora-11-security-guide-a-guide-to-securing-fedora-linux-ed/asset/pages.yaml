    # 2.6.8. Setting Up Secondary KDCs


    For a number of reasons, you may choose to run multiple KDCs for a given realm.
    In this scenario, one KDC (the master KDC) keeps a writable copy of the realm
    database and runs kadmind (it is also your realm''s admin server), and one or
    more KDCs (slave KDCs) keep read-only copies of the database and run kpropd.


    The master-slave propagation ensures the master KDC dumping its database to a
    temporary dump file and then transmitting that to each of its slaves, which overwrite
    their previously-read-only copies of the database with the contents of the dump
    file.


    To set up a slave KDC, ensure that the master KDC''s kr5.conf and kdc.conf are
    copied to the slave KDC.


    Start kadmin_local from a root shell on the master KDC and use add_principal command
    to create a new entry for the master KDC''s host service, and use it ktadd to
    simultaneously set a random key for the service and store the random key in the
    master''s default keytab file. This key will be used by kprop command to authenticate
    the slave servers. You will only need to do this once, regardless of how many
    slave servers you have.


    ```

    # kadmin.local -r EXAMPLE.COM

    ```


    Authenticating as principal root/admin@EXAMPLE.COM with password.


    ```

    kadmin: add_principal -randkey host/masterkdc.example.com

    ```


    Principal "host/masterkdc.example@EXAMPLE.COM" created.


    ```

    kadmin: ktadd host/masterkdc.example.com

    ```


    Entry for principal host/masterkdc.example.com with kvno 3, encryption type Triple
    DES cbc mode with HMAC/sha added to keytab WRFILE:/etc/krb5.keytab.


