    # 1.2.2.1. Establishing a Methodology


    To aid in the selection of tools for a vulnerability assessment, it is helpful
    to establish a vulnerability methodology assessment. Unfortunately, there is no
    predefined or industry approved methodology at this time; however, common sense
    and best practices can act as a sufficient guide.


    What is the target? Are we looking at one server, or are we looking at our entire
    network and everything within the network? Are we external or internal to the
    company? The answers to these questions are important as they determine not which
    tools to select but also the manner in which are used.


    To learn more about establishing methodologies, refer to the following websites:


    +   * http://www.isecom.org/osstm/ The Open Source Security Testing Methodology
    Manual (OSSTMM)


    +   * http://www.owasp.org/ The Web Application Security Project


    # 1.2.3. Evaluating the Tools


    An assessment can be built using some form of an information gathering tool. When
    assessing the entire network, map the first host to find the hosts that are running.
    Once located, examine each host individually. Focusing on these hosts requires
    another set of tools. Knowing which tools to use is the most crucial step in finding
    vulnerabilities.


    Just as in every aspect of everyday life, there are many different tools that
    perform the same job. This concept applies to performing vulnerability assessments
    as well as systems, and even networks (based on the protocols used). Some tools
    are free; others are not. Some tools are intuitive and easy to use, while others
    are cryptic and poorly documented but have features that others do not.


    Finding the right tools may be a daunting task and in the end, experience counts.
    If possible, set up a test lab and try out many tools as you can, noting the strengths
    and weaknesses of each. Review the README file or page for the tool. Additionally,
    look to the Internet for more information, such as articles, step-by-step guides,
    and even mailing lists specific to a tool.


    The tools discussed are just a sample of the available tools.


    # 1.2.3.1. Scanning Hosts with Nmap


