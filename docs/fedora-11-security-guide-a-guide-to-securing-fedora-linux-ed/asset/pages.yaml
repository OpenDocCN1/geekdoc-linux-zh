    - -R Replaces a rule in the specified chain. The rule''s number must be specified
    after the chain''s name. The first rule in a chain corresponds to number one.

    - -X Deletes a user-specified chain. You cannot delete a built-in chain.

    - -Z Sets the byte and packet counters in all chains for a table to zero.


    # 2.9.3.3. IPTables Parameter Options


    Certain iptables commands, including those used to add, append, delete, insert,
    or replace rules within a particular chain, require various parameters to construct
    a packet filtering rule.


    +   - -c Resets the counters for a particular rule. This parameter accepts the
    PKTS and BYTES to specify which counter to reset.

    - -d Sets the destination hostname, IP address, or network of a packet that matches
    the rule. When matching a rule, the following IP address/netmask formats are supported:

    - N.N.N.M.M.M.M — Where N.N.N is the IP address range and M.M.M.M is the netmask.

    - N.N.N/M — Where N.N.N is the IP address range and M is the mask.

    - -f Applies this rule only to fragmented packets.


    You can use the exclamation point character (!) option add to this parameter to
    specify that only unfragmented packets are matched.


    > Note: Distinguishing between fragmented and unfragmented packets is desirable,
    despite fragmented packets being a standard part of the IP protocol.'
