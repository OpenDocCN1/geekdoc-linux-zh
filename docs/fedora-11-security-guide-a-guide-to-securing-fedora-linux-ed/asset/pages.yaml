  md: '# Preface


    Choose System → Preferences → Mouse from the menu bar to launch Mouse Preferences.
    In the Buttons tab, click the Left-handed mouse check box and click Close to switch
    the primary mouse button from the left to the right (making the mouse suitable
    for in left hand).


    To insert a special character into a edit file, choose Applications → Accessories
    → Character Map from the menu bar. Next, choose Search → Find... from the Character
    Map menu, type the name of the character in the Search field and click Next. The
    character you sought will be highlighted in the Character Table. Double-click
    this highlighted character to place it in the Text to copy and click the Copy
    button. Now switch back to your document and choose Edit → Paste from the gedit
    menu bar.


    The above text includes application names; system-wide menu names and items; application-specific
    menu names; and text found within a GUI interface, presented in proportional bold
    and all distinguishable by context.


    Mono-spaced Bold Italic or Proportional Bold Italic


    Whether mono-spaced or proportional bold, the addition of italics indicates replaceable
    or variable text. Italics denote you to not input literally or displayed text
    that changes depending on circumstance.


    To connect to a remote machine using, use ssh username@domain.name at a shell
    prompt. If the remote machine is example.com and your username on that machine
    is john, use ssh john@example.com.


    The mount file-system command demands the renamed file system. For example, remount
    the /home file system, the command is mount -o remount /home.


    To see the version of a currently installed package, use the rpm - package command.
    It will return a list of results: package-version-release.


    The notes in bold italics — username, domain.name, file-system, package, version
    and release. Each word is a placeholder, either for text you when issuing a command
    or for text displayed by the system.


    Aside from standard usage for presenting the title of the work, italics denotes
    the first use of a new and important term.


    Publican is a DocBook publishing system.


    # 1.2. Pull-quote Conventions


    Terminal output and source code lists are set off visually from the surrounding
    text.


    Output sent to a terminal is in mono-spaced roman and presented thus:


    | books | Desktop documentation drafts mss stuff svn |

    | books_tests | Desktop downloads images notes scripts svgs |


    Source-code listings are also set in mono-spaced roman but add syntax highlighting
    as follows:'
