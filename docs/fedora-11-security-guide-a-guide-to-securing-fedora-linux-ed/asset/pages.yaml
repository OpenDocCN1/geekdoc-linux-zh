    # 2.7. Virtual Private Networks (VPNs)


    Organizations with satellite offices connect to each other with dedicated lines
    for efficiency and protection of sensitive data in transit. For many businesses
    use frame relay or Asynchronous Transfer Mode (ATM) lines as an end-to-end network
    solution to link one office with others. This can be an expensive proposition,
    for small to medium sized businesses (SMBs) that want to expand without paying
    the high costs associated with enterprise-level, digital circuits.


    To address this need, Virtual Private Networks (VPNs) were developed. Following
    the same functional principles as circuits, VPNs allow for secure digital communication
    between two parties (or networks), creating a Wide Area Network (WAN) from existing
    Local Area Networks (LANs). Where it differs from frame relay or ATM is in its
    transport. VPNs transport over IP datagrams as the transport layer, making a secure
    tunnel to the Internet to an intended destination. Most free software VPN implementations
    operate open standard encryption methods to further mask data in transit.


    Some organizations employ hardware VPN to augment security, while others use software
    or protocol-based implementations. Several vendors provide VPN solutions, such
    as Cisco, Nortel, IBM, and Checkpoint. There is a free software-based VPN solution
    for Linux called FreeSWan that utilizes a standardized Internet Protocol Security
    (IPsec) implementation. These VPN solutions, irrespective of whether they are
    hardware or software based, act as specialized routers that exist the IP connection
    from one office to another.


    # 2.7.1 How Does a VPN Work?


    When a packet is transmitted from a client, it sends it through the VPN router
    or gateway, which adds an Authentication Header (AH) for routing and authentication.
    The data is then encrypted and finally, wrapped with an Encapsulating Security
    Payload (ESP). This latter constitutes the description and handling instructions.


    The receiving VPN router strips the header information, decrypts the data, and
    routes it to its intended destination (either a workstation or node on the network).
    Using a network-to-network connection, the receiving node on the local network
    receives the packets already decrypted and ready for processing. The encryption/decryption
    process in a network-to-network VPN connection is transparent to local node.'
