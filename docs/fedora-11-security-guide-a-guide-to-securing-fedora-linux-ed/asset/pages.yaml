  md: '# Chapter 2. Securing Your Network


    # 2.7.7. IPsec Network-to-Network Configuration


    IPsec can also be configured to connect an entire network (such as a LAN or WAN)
    to a remote network using a network-to-network connection. A network-to-network
    connection requires the setup of IPsec routers on each side of the connecting
    networks to transparently process route information from one node on a LAN to
    a node on a remote LAN. Figure 2.11. "A network-to-network IPsec tunneled connection"
    shows a network-to-network IPsec tunneled connection.


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_115_0.png)


    Figure 2.11. A network-to-network IPsec tunneled connection


    This diagram shows two separate LANs separated by the Internet. These LANs use
    IPsec routers to authenticate and initiate a connection using a secure tunnel
    through the Internet. Packets that are intercepted in transit would require brute-force
    decryption in order to crack the cipher protecting the packets between the LANs.
    The process of communication from one node in the 192.168.1.0/24 IP range to another
    is completely transparent to the nodes as the processing, encryption/decryption,
    and routing of the IPsec packets are completely handled by the IPsec router.


    The information needed for a network-to-network connection include:


    +   - The externally-accessible IP addresses of the IPsec routers

    - The network address ranges of the LAN/WAN served by the IPsec routers (such
    as 192.168.1.0/24 or 10.0.1.0/24)

    - The IP addresses of the gateway devices; for example, ipsec1. This is used to
    identify the IPsec connection and to distinguish it from other devices or connections.

    - A fixed encryption key or one automatically generated by raccoon

    - A pre-shared authentication key that is used during the initial stage of the
    connection and to exchange encryption keys during the session.


    # 2.7.7.1. Network-to-Network (VPN) Connection


    A network-to-network IPsec connection uses two IPsec routers, one for each network,
    through which the traffic for the private subnet is routed.


    For example, as shown in Figure 2.12. "Network-to-Network IPsec", if the 192.168.1.0/24
    private network sends network traffic to the 192.168.2.0/24 private network, the
    packets go through gateway0, ipsec0, through the Internet, to ipsec1, to gateway1,
    and to the 192.168.2.0/24 subnet.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# IPsec Network-to-Network Configuration


    IPsec routers require publicly addressable IP addresses and a second Ethernet
    device connected to their respective private networks. Traffic only travels through
    an IPsec router if it is intended for another IPsec router with which it has an
    encrypted connection.


    ![](img/41d4f31e0edc30c079027fe8eaac3a44_116_0.png)


    Figure 2.12. Network-to-Network configuration


    Alternate network configuration options include a firewall between each IPsec
    router and the Internet, and an intranet firewall between each IPsec router and
    subnet gateway. The IPsec router and the gateway for the subnet can be one system
    with two Ethernet devices: one with a public IP address that acts as the IPsec
    router; one with a private IP address that acts as the gateway for the private
    subnet. Each IPsec router can use the gateway for its private network or a public
    gateway to send the packets to the other IPsec router.


    Use the following procedure to configure a network-to-network IPsec connection:


    +   1. In a command shell, tab **system-config-network** to start the **Network
    Administration Tool.**

    2. On the **IPsec** tab, click **New** to start the IPsec configuration wizard.

    3. Click **Forward** to start configuring a network-to-network IPsec connection.

    4. Enter a unique nickname for the connection, for example, **ipsec0**. If required,
    select the check box to automatically activate the connection when the computer
    starts. Click **Forward** to continue.

    5. Select **Network to Network encryption (VPN)** as the connection type, and
    then click **Forward.**.

    6. Select the type of encryption to use: manual or automatic.

    If you select manual encryption, an encryption key must be provided later in the
    process. If you select automatic encryption, the **racoon** daemon manages the
    encryption. The **ipsec-tools** package must be installed if you want to use automatic
    encryption.


    Click **Forward** to continue.

    7. On the **Local Network** page, enter the following information:


    +   * **Local Network Address** — The IP address of the device on the IPsec router
    connected to the private network.

    * **Local Subnet Mask** — The subnet mask of the local network IP address.

    * **Local Network Gateway** — The gateway for the private subnet.


    Click **Forward** to continue.'
