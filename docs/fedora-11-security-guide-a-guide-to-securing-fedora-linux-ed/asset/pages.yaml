  md: '# Chapter 2. Securing Your Network


    +   - **yes** — The default value. This option must be set to achieve a correct
    state for a firewall restart or stop.


    +   - **no** — This option should only be set if there are problems unloading
    the netfilter modules.


    +   - **IPTABLES_SAVE_ON_STOP** — Saves current firewall rules to `/etc/sysconfig/iptables`
    when the firewall is stopped. This directive accepts the following values:


    +   - **yes** — Saves rules to `/etc/sysconfig/iptables` when the firewall is
    stopped, moving the previous version to the `/etc/sysconfig/iptables.save` file.


    +   - **no** — The default value. Does not save existing rules when the firewall
    is stopped.


    +   - **IPTABLES_SAVE_RESTART** — Saves current firewall rules when the firewall
    is restarted. This directive accepts the following values:


    +   - **yes** — Saves rules to `/etc/sysconfig/iptables` when the firewall is
    restarted, moving the previous version to the `/etc/sysconfig/iptables.save` file.


    +   - **no** — The default value. Does not save existing rules when the firewall
    is restarted.


    +   - **IPTABLES_SAVE_COUNTER** — Saves and restores all packet and byte counters
    in all chains and rules. This directive accepts the following values:


    +   - **yes** — Saves the counter values.


    +   - **no** — The default value. Does not save counter values.


    +   - **IPTABLES_STATUS_NUMERIC** — Outputs IP addresses in numeric format instead
    of domain or hostnames. This directive accepts the following values:


    +   - **yes** — The default value. Returns only IP addresses within a status output.


    +   - **no** — Returns domain or hostnames within a status output.


    # 2.9.6. IPTables and IPv6


    If `iptables-ipv6` package is installed, netfilter in Fedora can filter the next-generation
    IPv6 internet protocol. The command used to manage the IPv6 netfilter is **iptables**.


    Most directives for this command are identical to those for *iptables*, except
    the nat table which is not yet supported. This means that it is not yet possible
    to perform IPv6 network address translation tasks, such as masquerading and port
    forwarding.


    Rules for **iptables** are saved in the `/etc/sysconfig/iptables` file. Previous
    rules saved by the **iptables** inscripts are saved in the `/etc/sysconfig/iptables.save`
    file.


    Configuration options for the **iptables** kit are stored in `/etc/sysconfig/iptables-config`,
    and the names for each directive vary slightly from their **iptables** counterparts.


    For example, the `iptables-config` directive **IPTABLES_MODULES**:the equivalent
    in the `ipt6tables-config` file is **IPT6TABLE_MODULES**.'
