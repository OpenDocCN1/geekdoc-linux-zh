  md: '# Chapter 1. Security Overview


    #  1.3.1.1. Shades of Gray


    Within the community of individuals who find and exploit vulnerabilities in systems
    and networks are several distinct groups. These groups are described by the shade
    of hat that "wear" when performing their security investigations and this is indicative
    of their intent.


    The white hat hacker is one who tests networks and systems to examine their performance
    and determine how vulnerable they are to intrusion. Usually, hackers crack their
    own systems or the systems of a client who has specified them for the purposes
    of security auditing. Academic researchers and professional consultants are two
    examples of white hackers.


    A black hat hacker is synonymous with a cracker. In general, crackers are less
    focused on programming and the scale of breaking into systems. They often rely
    on cracking programs and exploit known vulnerabilities in systems to uncover sensitive
    information for personal gain or to inflict damage on target system or network.


    The gray hat hacker, on the other hand, has the skills and intent of a white hat
    hacker in most situations but uses his knowledge for less noble occasions on occasion.
    A gray hat hacker can be thought of as a white hat who wears a black hat to accomplish
    his own agenda.


    Gray hackers typically subscribe to another form of the hacker ethic, which says
    it is acceptable to break into systems as long as the hacker does not commit theft
    or breach confidentiality. Some argue, however, that the act of breaking into
    a system is itself unethical.


    Regardless of the intent of the intruder, it is important to know the weaknesses
    a cracker may likely attempt to exploit. The remainder of the chapter focuses
    on these issues.


    #  1.3.2. Threats to Network Security


    Bad practices when configuring the following aspects of a network can increase
    the risk of attack.


    #  1.3.2.1. Insecure Architectures


    A misconfigured network is a entry point for unauthorized users. Leaving a trust-based,
    open local network vulnerability to the highly-secure Internet is like leaving
    a door ajar in a crime-ridden neighborhood — nothing may happen for an arbitrary
    amount of time, but eventually someone exploits the opportunity.


    #  1.3.2.1.1. Broadcast Networks


    System administrators fail to realize the importance of networking hardware in
    their security schemes. Simple hardware such as hubs and routers on the broadcast
    or non-switched switch; that is, when a node transmits data across the network
    to a recipient node, the hub or router sends a broadcast of the data packets until
    the recipient node receives and processes the data. This method is the most vulnerable
    to address resolution protocol (arp) or media access control (MAC) address spoofing
    by outside intruders and unauthorized users on local hosts.


    #  1.3.2.1.2. Centralized Servers


    Another potential risk is the use of centralized computing. A atom cost-cutting
    measure for many businesses is to consolidate all services into a single powerful
    machine. This can be convenient as it is easier to manage and costs considerably
    less than multiple-server configurations. However, a centralized server introduces
    a single point of failure on the network. If the central server is compromised,
    it may render the network completely useless or worse, prone to data manipulation'
