  md: '# Chapter 2. Securing your Network


    There may be times when you require remote access to the LAN. Secure services,
    for example SSH, can be used for encrypted remote connection to LAN services.


    Administrators with PPP-based resources (such as modern banks or could ISP accounts),
    dial-up access can be used to securely circumvent firewalls. Because they are
    direct connections, modern connections are typically redirected by a firewall/gateway.


    For remote users with broadband connections, however, special cases can be made.
    You can configure iptables to connect from remote SSH clients. For example, the
    following rules allow remote SSH access:


    ```

    @myServer ~ # iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    @myServer ~ # iptables -A OUTPUT -p tcp --sport 22 -j ACCEPT

    ```


    These rules allow outbound access for an individual system, such as a single PC
    directly connected to the Internet or via firewall/gateway. However, they do not
    allow nodes beyond the firewall/gateway to access these services. To allow LAN
    access to these services, you can use Network Address Translation (NAT) with iptables
    filtering rules.


    # 2.8.5. FORWARD AND NAT Rules


    Most ISPs have only a limited number of public IP addresses to the organizations
    they serve.


    Administrators must, therefore, find alternative to share access to Internet services
    without giving public IP addresses the most common way of allowing all nodes on
    a LAN to properly access internal and external network services.


    Edge routers (such as firewalls) can receive incoming transmissions from the Internet
    and route the packets to the intended LAN node. At the same time, firewalls/gateways
    can route outgoing requests from a LAN node to the remote Internet service.


    This forwarding of traffic can be dangerous at times, especially with the availability
    of modern cracking tools that can spoof IP addresses and make the attacker''s
    machine act as a node on your LAN.


    To prevent this, iptables provides routing and forwarding policies that can be
    implemented to prevent abnormal usage of network resources.


    The FORWARD chain allows an administrator to control which packets can be routed
    within a LAN. For example, to allow forwarding for the entire LAN (assuming the
    firewall/gateway is assigned an internal IP address on eth0), use the following
    rules:


    ```

    @myServer ~ # iptables -A FORWARD -i eth1 -j ACCEPT

    @myServer ~ # iptables -A FORWARD -o eth1 -j ACCEPT

    ```


    This rule governs the firewall/gateway access to the internal network. The gateway
    routes packets from one LAN node to its destination node, passing all packets
    through its eth1 device.


    > Note By default, the IPv4 policy in Fedora kernels denies support for IP forwarding.
    This prevents machines that run Fedora from functioning as dedicated edge routers.
    To enable IP forwarding, use the following command:'
  merge: -1
