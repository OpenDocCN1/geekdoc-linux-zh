    4. Create the database using the kdb5_sbin/kdb5_util utility from a shell prompt:


    ```

    /usr/kerberos/sbin/kdb5_util create -s

    ```


    The create command creates the database that stores keys for the Kerberos realm.
    The -s switch creates a stash file in which the master server key is stored. If
    no stash file is present from which to read the key, the Kerberos server (krb5kdc)
    prompts the user for a master server password (which can be used to regenerate
    the key) every time it starts.


    5. Edit the /var/kerberos/krb5kdc/kadm5.acl file. This file is used by kadmin
    to determine principals have administrative access to the Kerberos database and
    their level of access. Most organizations can use by a single line:


    ```

    *admin@EXAMPLE.COM *

    ```


    Most users are represented in the database by a single principal (with a NULL,
    or empty, instance, such as joe@EXAMPLE.COM). In this configuration, users with
    a second principal as instance of admin (for example, joe/admin@EXAMPLE.COM) are
    able to wield full power over the Kerberos database.


    After kadmin has been started on the server, any user can access its services
    by running kadmin on any of the clients or servers in the realm. However, only
    users listed in the kadm5.acl file can modify the database in any way, except
    for changing their own passwords.


    > The kadmin utility communicates with the kadmin server over the network, and
    uses Kerberos to handle authentication. Consequently, the first principal must
    already exist before connecting to the server over the network to administer it.
    Create the first principal with the kadmin.local command, which is specifically
    designed to be used on the same host as the KDC and not use Kerberos for authentication.


    The the following kadmin.local command at the KDC terminal to create the first
    principal:


    ```

    /usr/kerberos/sbin/kadmin.local -q "addprinc username username/admin"

    ```


    6. Start Kerberos using the following commands:


    ```

    /sbin/service kerb5kdc start

    /sbin/service kadmin start

    /sbin/service kerb524 start

    ```'
