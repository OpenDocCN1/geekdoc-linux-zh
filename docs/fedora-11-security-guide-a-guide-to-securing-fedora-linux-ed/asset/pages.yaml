  md: '# Chapter 2. Securing Your Network


    # 2.4.6.2. Common pam timestamp Directives


    The pam_timestamp.so module accepts several directives. The following are the
    two most used options:


    +   - timestamp_timeout — Specifies the period (in seconds) for which the timestamp
    file is valid. The default value is 300 (five minutes).


    +   - timestampdir — Specifies the directory in which the timestamp file is stored.
