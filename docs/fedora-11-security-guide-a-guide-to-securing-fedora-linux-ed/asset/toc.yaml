  - Fedora 11 安全指南：Fedora Linux 安全加固指南 (1.0 版)
- - '##'
  - Linux 安全指南旨在帮助 Linux 用户学习保护工作站免受本地和远程入侵、利用和恶意活动的过程。《Linux 安全指南》详细介绍了为数据中心、工作场所和家庭创建安全计算环境的规划和涉及的工具。通过适当的管理知识、警惕和工具，运行
    Linux 既可以保持功能性，又能防御大多数常见的入侵和漏洞利用方法。
