    ## Chapter 6: Using Multiple Utilities in Scripts


    Up until now, this chapter explores how to create scripts that employ multiple
    utilities to manipulate and retrieve data. You will also have the opportunity
    to create a complex word analysis script that can be used to detect errors and
    analyze the code you have written in a script. You''ll remove punctuation, make
    characters lowercase, and alter the display of output text.


    Additionally, you will explore creating, modifying, and viewing information files
    and directories. This will enable you to organize your files and collect important
    information about each file.


    15 MINUTES


    ## Lab Exercise 6.01: Employing Utilities to Obtain Information


    Dean needs a daily written report of the status of his Linux system. He wants
    to obtain certain information about users and processes that are only accessible
    by executing utility commands. He does not want to execute these commands daily
    and has asked you to help him write a script that employs these utilities to obtain
    the information he needs. He would also like the results of the execution of the
    script to be saved to a file.


    ### Learning Objectives


    In this lab, you create a script that employs several utilities to obtain information.
    By the end of this lab, you''ll be able to:


    - Recognize utilities that obtain information

    - Employ utilities in a script

    - Redirect the output of a script to a file


    ## Lab Exercise 6.01: Employing Utilities to Obtain Information


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - Pencil and paper


