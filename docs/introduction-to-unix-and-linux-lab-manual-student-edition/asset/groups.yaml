  mdcn: "\n\n## 实验 12.03：使用内置 Gnome 应用程序 239\n\n- 提示\n  - 默认安装带有 Gnome 的 Red Hat 7.3\
    \ 包含这些软件包。如果你的安装没有包含任何应用程序，你将需要插入 Red Hat 光盘重新安装。\n\n## 开始正正题\n\n以下步骤将帮助你使用 AbiWord\
    \ 创建一封简单的信，使用 Gnumeric 建立预算表，并对你的图像应用过滤器。你将需要你在 John Muster 编写的《UNIX 和 Linux 导》（McGraw-Hill/Osborne,\
    \ 2002）书中中学的知识来使用 Gnome 应用。\n\n### 使用 AbiWord\n- **步骤 1** 从面板启动 AbiWord。它位于“程序（Programs）\
    \ | 应用程序（Applications）”面板下。\n- **步骤 2** 为工作申请创建一封求职信。请遵循学校推荐的正确信函标准。\n- **步骤 3**\
    \ 打印你的信。\n\n### 使用 Gnumeric\n- **步骤 1** 从面板启动 Gnumeric。它位于“程序（Programs） | 应用程序（Applications）”面板下。\n\
    - **步骤 2** 为你目前的收入和支出创建一个预算表。你应该列出所有收入并计算总和。然后你应该列出所有支出并计算总和。最后，通过从总收入减去总支出计算剩余资金。\n\
    - **步骤 3** 打印你的预算。\n\n### 使用 GIMP\n- **步骤 1** 从面板启动 GIMP。它位于“程序（Programs） | 图形（Graphics）”面板下。\n\
    - **步骤 2** 对图像应用过滤器。选择一个应用后效果非常明显的过滤器。\n- **步骤 3** 在图像中放置你的名字。\n- **步骤 4** 打印你的图像。\n\
    \n## 实验 12.04：配置 Internet 设置\n\nJeff 坚信 Linux 可以作为主操作系统。他决定在切换系统之前，先在自己的电脑上测试\
    \ Linux。他顺畅地安装了 Linux，一切都很正常，直到他尝试连接互联网。什么都没有发生。你知道 Linux 尽管安装简单，但开箱即用并没有配置好互联网。你需要配置\
    \ Linux 以进行连接。\n\n> 提示\n查阅《UNIX 和 Linux 导》书籍以获取有关安装 Red Hat Linux 7.3 的说明。\n\n\
    ## 学习目标\n\n在本实验中，你将把电脑连接到互联网。在实验结束时，你将能够：\n\n- 启动互联网连接工具\n- 配置 Linux 使用代理服务器访问互联网\n\
    \n> 提示\n代理服务器允许其他计算机连接到互联网的计算机。代理服务器允许组织同时控制互联网访问并保护其用户计算机。\n\n## 实验材料与设置\n\n\
    此实验所需的材料有：\n\n- 安装了 Red Hat Linux 7.3 的电脑\n- 访问权限\n- 你学校代理服务器的 IP 地址\n- 电脑的 root\
    \ 密码\n\n> 提示\n如果你不知道代理或没有代理，你仍然可以完成此实验。遗憾的是，你无法连接到互联网。\n\n## 开始正题\n\n以下步骤将帮助你使用代理服务器将电脑连接到互联网。你将需要应用\
    \ John Muster 编写的《UNIX 和 Linux 导》（McGraw-Hill/Osborne, 2002）书中学到的知识来操作 Gnome。\n\
    \n> 提示\n你需要获取代理服务器的地址以及它提供的端口。你的导师或系统管理员应该知道这些数字。如果你没有地址，请使用 127.0.0.1 作为代理，80\
    \ 作为端口。这是回环地址。使用此数字将不会让你连接到互联网，但不会干扰你学校的网络。\n\n**步骤 1** 启动互联网配置向导。\n\n**步骤 2**\
    \ 在提示时输入 root 密码。\n\n**步骤 3** 创建一个新的以太网连接。除非导师另有说明，否则请使用 DHCP。\n\n**步骤 4** 启动\
    \ Netscape Communicator。设置代理服务器的连接偏好以指向你学校的代理服务器。代理设置在“高级选项（Advanced Preferences）”下。\n\
    \n## 实验分析测试\n\n- 1. 你已经使用 X Window 系统和命令行界面管理文件。你更倾向于使用哪一个？为什么？\n- 2. 如果你想从 /etc\
    \ 目录复制文件到你的家目录，哪种方式更快：在命令行界面中复制文件，还是在 GUI 中复制文件？为什么？\n- 3. 你在 X Window 系统与你熟悉的\
    \ Windows 版本之间看到了哪些区别？\n- 4. Linux 如何既能降低拥有成本，又能让用户在安装后立即投入高效工作？\n- 5. 为什么 X Window\
    \ 系统将面板和桌面上的项目称为“链接（links）”而不是“快捷方式（shortcuts）”？\n\n## 术语测验\n\n使用以下词汇完成下句。并非所有术语都会用到。\n\
    \n- AbiWord\n- desktop\n- DHCP\n- favorites\n- GIMP\n- Gnome\n- Gnumeric\n- links\n\
    - panel\n- port\n- proxy\n\n1. _________ 等同于 Windows 开始按钮。\n2. 要创建或更改图片，你可以使用\
    \ _________ 软件。\n3. _________ 共享互联网连接。\n4. _________ 菜单是面板上你可以添加链接的唯一。\n5. _________\
    \ 等同于 MS。\n\n## 实验总结\n\n你已经完成了对 X Window 系统的浏览。你学习了如何自定义桌面和面板。你在 AbiWord 中写了一封信，在\
    \ Gnumeric 中创建了预算，并对你的图像应用了过滤器。你还配置了 Linux 使用代理服务器。\n\n## 答案\n\n在本部分，你将找到实验的答案。\n\
    \n- 提示\n以下说明适用于 Gnome。\n\n## 实验解答 12.01\n\n**步骤 1** 你应该使用 mkdir 创建 xpractice 目录，然后使用\
    \ cd 进入该目录。你应该使用 touch 创建 x1、x2 和 x3。\n\n**步骤 2** 你应该使用命令启动 gnome。稍等片，Gnome 桌面就会显示出来。\n\
    \n**步骤 3** 你应该通过右击图标启动文件管理器。Nautilus 壳将出现，如图 12-1 所示。\n\n**步骤 4** 要重命名 xpractice\
    \ 目录，你应该右键点击目录并选择重命名。然后你应该输入新名称并按回车。你应该双击打开。\n\n**步骤 5** 要浏览不同的目录，你应该在地址栏输入路径或使用箭头按钮移动。对于长路径，输入路径要简单得多。你应该在地址栏输入\
    \ /etc，然后使用 find 找到 l 文件。你应该右键点击 lpd.conf 并选择复制文件。跳转到文件的快速方法是点击文件区域并输入第一个字母，在本例中是\
    \ l。你应该回到地址栏中的 ~/xname。然后你应该右键点击屏幕上的任何空白区域并选择粘贴文件。文件已成功复制。\n\n**步骤 6** 要删除文件，你应该将它们发送到垃圾桶。你应该选择每个想要删除的文件。要选择多个文件，你可以像\
    \ Windows 一样按 CTRL 点击。你应该点击 x1 文件，点击其他要删除的文件。你应该通过右键点击任何选中的文件并移动到“垃圾桶”。你的垃圾桶图标现在应该有纸张溢出，如图\
    \ 12-2 所示。要清空垃圾桶，请选择 Nautilus 中的“文件”菜单，并选择“清空垃圾桶”。点击“清空”从你的系统中永久删除文件。\n\n**步骤\
    \ 7** 要更改 lpd.conf 文件的权限，你应该右键点击文件并从菜单中选择属性。在属性窗口中，你应该选择“权限”选项卡。然后你应该将权限设置为 755，或\
    \ -rwx-xr-x。如图 12-3 所示，你应该勾选所需的复选框。\n\n"
