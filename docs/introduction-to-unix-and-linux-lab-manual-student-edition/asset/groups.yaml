    ## Lab Exercise 11.04: Removing Files by Owner


    Jeff had to fire an employee named Bob. Bob was not happy about being fired, so
    he played some tricks on the UNIX/Linux system before he left. He left several
    files in other users'' directories that contain rude and inappropriate images
    and words. Jeff wants to remove these files. As he is considering legal action,
    he needs to save the files for the lawyers while removing the files for the users''
    sake. One big problem is the permissions. Bob set the files with 755, allowing
    everyone read and execute ability, while denying the users the ability to delete
    files.


    Jeff knows that root can delete the file, but he doesn''t want to look in every
    user''s directory for a “bob” file. He asks if there is a way to search the entire
    disk structure by user name. To help Jeff solve his problem, you teach him the
    finer points of the find command.


    ## Learning Objectives


    In this lab, you will place a few files on your partner''s home directory. Your
    partner will then find these files and remove them. By the end of this lab, you''ll
    be able to:


    - Use the find command to locate files by user name

    - Delete files by user name


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - Access to the root account

    - Two normal user accounts


    > Hint

    > This is a good lab to run with a partner. Partner A can set his directory permissions
    to rwx, allow partner B to place a file in his directory. Partner A can then search
    for the files as root, deleting those he sees. If partners are impossible, create
    an account that will take the place of partner B.


    ## Getting Down to Business


    The following steps will help you place a few files in user accounts and then
    find them with the find command. You will have to apply the knowledge that the
    Introduction to UNIX and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002)
    for working with the find utility.


    - Step 1 Log in as partner A. Change to the parent directory of your home directory.
    Record the current permission settings. Set your directory to have the rwx permissions.

    - Step 2 Partner B will now create a few files and save them in partner A''s directory.

    - Step 3 Log in as root.

    - Step 4 Run the find command that finds all files by partner A. Use the parent
    directory of your home directory as the starting point.

    - Step 5 Use the exec switch to cat the files into a file called bobfiles. Include
    the directories in the output.

    - Step 6 Use the ok switch of find to remove files by partner A. ok is similar
    to exec, except you will be prompted for approval before action.

    - Step 7 Verify that all files created by partner B are gone from partner A''s
    directory. Partner A should now set the permissions back to their original state.


    ## Lab Exercise 11.05: Formatting a Document for Printing


    20 MINUTES


    Jeff maintains a phone list of his employees. As it changes, he prints it for
    his employees. He prefers a two-column output, sorted across the columns, rather
    than down the columns. He wants a heading that reads *September Phone List* and
    includes the page number. He asks how to do this in UNIX/Linux.


    This procedure is easy in Word, but UNIX/Linux is a little trickier. You will
    need to use the **sort** command, redirected into the **pr** command, then redirected
    into the **lp** command. The really tricky part is the **pr** command. Here you
    need several switches to generate the correct output.


    You will spend the bulk of your time learning how to use `pr`. Once the `pr` is
    correct, you will redirect the `sort` into the `pr`. Finally, when the output
    is correct, you will redirect to a printer of your choice.


    > ✔ Tip

    > Consult the man pages for `pr` to determine the proper switches.


    ## Learning Objectives


    In this lab, you print a formatted document. By the end of this lab, you''ll be
    able to:


    - Use `pr` to format output

    - Use `lp` to print to a printer

    - Chain redirect output


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - A file containing first names and phone numbers

    - (Optional) Access to a printer


    ## Getting Down to Business


    The following steps guide you in using pr to format a file. You will have to apply
    the knowledge that you acquired in the Introduction to UNIX and Linux textbook
    by John Muster (McGraw-Hill/Osborne, 2002) for using pr.


    - By default, your UNIX/Linux computer will print to one of several printers.
    Most likely, the first entry in the /etc/printcap will be used. If you need to
    change printers, you will need to use the -P switch for lp. For example, if you
    wanted to print to the LaserJet4 printer, you would use the lp LaserJet4 command.

    - If you do not have a printer, simply use the command in place of the lp command.


    Step 1 Create a file called phonelist using the following data:


    | bob 999-5555 | debbi III-III |

    | carole 999-6666 | laurie 222-2222 |

    | adam 777-8888 | heather 333-3333 |

    | joyce 999-9999 | lise 444-4444 |

    | bev 999-0000 | steve 555-5555 |

    | bob 999-1111 | joanne 666-6666 |

    | tom 999-2222 | linda 777-7777 |

    | art 999-3333 | barb 888-8888 |

    | rose 999-4444 | amy 999-9999 |

    | robert 999-7777 | |


    Step 2 Use pr to prepare the file for printing.


    Step 3 Add the switch to create two columns. What switch is needed?


    **Step 4** Add the switch to change the heading to Phone List. What switch is
    needed? What portion of the header is changed?


    **Step 5** Add the switch to change the date to September. What switch is needed?


