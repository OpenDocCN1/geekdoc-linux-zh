    Lab Exercise 9.01: Defining Permissions Based on Number


    LaTrina has a problem. Some of her web services and pages are not running. She
    is getting permissions errors in Internet Explorer. She does not know why these
    programs will not run; they at her old site. You immediately suspect she has a
    permissions problem. You agree to help her and teach her some basic UNIX permissions
    along the way.


    The command to fix most of LaTrina''s problem is chmod, which changes the mode
    (file permissions) on a file. True UNIX users use the numeric parameters for chmod
    rather than the letter equivalents. In this exercise, you will practice reading
    and setting permissions.


