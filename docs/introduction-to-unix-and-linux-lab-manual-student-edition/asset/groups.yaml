    **步骤 2** 若要更改屏幕保护程序，你需要访问面板。你应该选择“面板（底脚按钮） | 程序 | 设置 | 桌面 | 屏幕保护程序”。然后你应该从列表中选择所需的屏幕保护程序。系统会显示屏幕保护程序的演示。你应该配置屏幕保护程序的延迟，并根据需要为屏幕保护程序设置密码。此设置要求用户在恢复会话之前输入密码。只有当你是
    UNIX 电脑的唯一用户时才使用此设置。完成后，你应该点击“确定”。


    **步骤 3** 若要修改你的面板，你应该向“收藏”目录添加图标。你应该右键点击底脚按钮并选择“编辑菜单”。Gnome 菜单编辑器将会出现。你应该选择屏幕左边缘的“收藏”菜单，点击“新建项目”来创建一个新的快捷方式。然后你应该为你的快捷方式命名并为该快捷方式输入描述。描述在鼠标悬停在其上方时将作为工具tip出现。你应该输入要运行的命令。然后你应该选择链接类型，应用程序链接是最常见的。最后，如果需要，应该为你的快捷方式选择一个图标。图
    12-6 描绘了输出快捷方式。你应该点击“保存”按钮，然后退出并完成图标的创建。


    **步骤 4** 若要在桌面上创建快捷方式，你应该通过右键点击主图标并选择“打开”来打开 Nautilus。你应该浏览到你想从桌面创建快捷方式的文件或应用程序。你右键点击并将图标拖动到桌面。如果你操作正确，图
    12-7 所示的菜单应该出现。你应该选择“在此处创建链接”来建立快捷方式。出现了一个右上角带有箭头的新图标。这是指向程序的链接。


