    \ frustration associated with scripting and guarantees a working script.\n\n##\
    \ Lab Exercise 9.03: Setting Permissions on Files and Folders\n\n### Getting Down\
    \ to Business\n\nWhile you were working on LaTrina’s site, you noticed that many\
