    ## Lab Exercise 2.07: Finding Answers to UNIX/Linux Questions Online


    LaTrina is convinced that the UNIX/Linux help is worthwhile. She has worked with
    it enough to stopestering you for a while. Unfortunately, other friends have started
    asking you questions about UNIX/Linux. Many of the questions are very technical
    and require a specific answer. The only place to find these answers is the Web.


    A competent computer user is always hammered with questions. The better you answer
    the questions, the more frequently the questions arrive. This is a double-edged
    sword. You gain the respect and admiration of your peers and colleagues, while
    losing the ability to be productive.


    ## Learning Objectives


    Upon completion of this lab, you will be able to find answers to UNIX/Linux questions
    using the Internet as a source of information and direction.


    ## Lab Materials and Setup


    You will need the following to complete this lab:


    - An account on a UNIX/Linux PC that has access to the Internet

    - A pen or pencil


    ## Getting Down to Business


    You know that a good place to start is the home page for the company that provided
    the software. Thus, if you are asked a question, you should start at www.redhat.com.
    Here is a list of common sites:


    | Linux Manufacturer | Web Site |

    | --- | --- |

    | FreeBSD | www.freebsd.com |

    | Mandrake | www.mandrake.com |


    ## Lab Exercise 2.07: Finding Answers to UNIX/Linux Questions Online


    | Manufacturer | Web Site |

    | --- | --- |

