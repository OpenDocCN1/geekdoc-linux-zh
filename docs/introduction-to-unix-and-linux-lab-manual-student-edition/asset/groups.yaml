    \ permissions on several of her files. All files in the html and cgi-bin directories\
    \ should be readable and executable. The archive directory should allow only the\
    \ owner of the file to read or modify. The user directory needs the owner and\
    \ others to read and write. This is accomplished using the chmod command. \n\n\
