    # Lab Exercise 10.05: Using nohup to Run Processes After Logging Out


    LaTrina has another question. She needs a program on the web site to run all the
    time. Currently, the only way she knows to keep the programming running is to
    stay logged in. She knows it is possible for a regular (non-root) account to specify
    that a command runs in the background, after the user logs out. A command to solve
    this problem is the **nohup** command. **nohup** will keep a program running even
    after you log out. **nohup** is short for “no hang.” The syntax is **nohup** command
    &.


    > > Tip nohup command originated when users needed modems to connect to a UNIX
    computer. To save on costs, nohup allowed the users to dial in, start a process,
    disconnect, and reconnect several hours later when the process should have completed.
    nohup has stuck around despite the reduced dependency on dial-in accounts.


