    - 1. How can I configure a printer in my Red Hat 7.3 Linux installation?


    - 2. What modems are supported in my Mandrake 7.0 installation?


    - 3. I need to contact FreeBSD about a security hole discovered in the software.
    Whom do I contact?


    - 4. What is the current version of the KDE?


    - 5. What is a good "newbie" site for UNIX?

    Unix in a nutshell


    ## Lab Analysis Test


    Answer each of the following questions in a short sentence or paragraph. There
    may be more than one right answer.


    - 1. What are two ways of using the mv utility to manage files and directories?

    mv saturday,1 week

    mv there to shorts


    - 2. What two UNIX commands are available for sending a file to a printer? Why
    will only one command work on your system?


    - 3. What utilities are available to display the contents of a file?


    - 4. How are redirection pipes used when executing commands with utilities?


    - 5. What system directories are displayed as a result of executing the ls / command?


    - 6. What is displayed if you request **info** on a utility with no **info** file?


    - 7. What is the purpose of the **man** pages?


    - 8. What is the difference between the **help** utility and the **info** utility?
    (You may want to run **help**.)


    - 9. What is the option used by **man** to search keywords?


    - 10. What does the command **chown** do?


    ## Key Term Quiz


    Use the following vocabulary terms to complete the sentences below. Not all of
    the terms will be used.


    - apropos argument

    - b cat

    - d cd

    - info command

    - -k lp

    - keyword lpr

    - 1 option

    - man rm -i

    - n shell

    - p utility

    - u


    - 1. The _________ deletes an indicated file, but asks the user to confirm the
    deletion.


    - 2. The _________ is a program that enables you to give the system instructions,
    known as commands.


    - 3. When you type the command date, and press ENTER, you are instructing the
    shell to run the date _________.


    - 4. A(n) _________ is an option or flag that provides specific instructions to
    a utility.


    - 5. Simply entering the _________ command will change your current directory
    to the home directory.


    - 6. The _________ provides the manual pages for a command.


    - 7. The _________ utility provides an in-depth description about a utility.


    - 8. The _________ switch for man can search through the man pages for a utility.


    - 9. When in info, you use the _________ key to display the previous node.


    - 10. Apropos will search the man pages by _________.


    ## Lab Wrap-Up


    One of the main features of a Linux computer is that several users can be logged
    on the system at the same time, but each user has a separate default directory
    in which to save their files so that no overlapping exists. By now, you should
    have successfully explored and worked with the file system to create and manage
    files. You should also be familiar with several utilities to help print, copy,
    move, remove, and view your files and file structure.


    Congratulations! You have learned how to use the help system in UNIX/Linux. The
    man command provides the technical description of every command in UNIX/Linux.
    It provides all switches, all parameters, and a little description of each. The
    info utility provides a better description for each command. It provides an English
    description of the command, as well as an interface that is easy to navigate in.


    In the next lab, you will learn how to use the multitasking features of UNIX/Linux.
    You will learn how to run multiple commands, determine what commands your friends
    are running, and how to stop jobs that have stopped responding. Help will be of
    great use.

