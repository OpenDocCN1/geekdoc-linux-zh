    **步骤 2** 使用 `compress` 工具压缩此文件。它现在的大小是多少？


    **步骤 3** 使用 `uncompress` 工具解压缩此文件。

    **步骤 4** 使用 `gzip` 工具压缩此文件。它现在的大小是多少？


