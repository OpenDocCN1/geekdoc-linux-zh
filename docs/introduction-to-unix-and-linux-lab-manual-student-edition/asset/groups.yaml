    ## Key Term Quiz


    Use the following vocabulary terms to complete the sentences below. Not all of
    the terms will be used.


    - $ find

    - noclobber

    - .bash_profile parameters

    - PATH

    - redirection

    - 2> set

    - 2>> switches

    - alias tokens

    - command substitution

    - whereis

    - error number

    - which

    - export


    1. To turn on the noclobber variable, you use the command set -o noclobber.

    2. The which command returns the child directory, but not the entire file for
    a command.

    3. The $? generates the error of the previous command.

    4. In the command *ls /etc*, the */etc* is a parameter.

    5. After filling a variable with a value, you must export so it it is available
    to child processes.

    6. The PATH variable provides the directories that UNIX will search for a command.

    7. The pieces of a command line are referred to as tokens.

    8. The * wildcard will match any number of characters.

    9. In UNIX, switches are preceded with a -.

    10. To use command substitution on a UNIX command, you enclose the desired command
    in `` ``.


    ## Lab Wrap-Up


    You have modified a web site environment to simplify the owner''s UNIX experience.
    You also redirected the output from the regist.exe program to a custom log. You
    generated an alias that used the command substitution feature of UNIX to create
    a command called countem that counts the site''s logs. Finally, you practiced
    working with wildcards and generating errors. Understanding how the command line
    works allows you to learn new, complex commands more easily.


    ## Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    ## Lab Solution 8.01


    The following steps allow you to identify the different portions of a command
    line:


    Step 1


    | Command Line | Utilities | Parameters | Switches |

    | --- | --- | --- | --- |

    | cp /etc/printcap ;;less printcap | cp, less | /etc/printcap, | |

    | ls -d | man | ls | -d |

    | mkdir -m755 scripts;cd scripts | mkdir, cd | 755, scripts | -m |


    Step 2


    - a) utility

    - b) utility switch or parameter switch or parameter

    - c) utility; utility switch or parameter


    Step 3


    - a) ls, pwd, cal

    - b) ls -l /etc, man -D man, mv first second

    - c) who;date -u, ls; ls *.cpp, pwd;cd ..


    ## Lab Solution 8.02


    The following table provides the correct command for each search. Each of the
    utilities (find, whereas, and which) require one parameter: the utility to find.
    Thus, which perl will find the current version of Perl on your system. See the
    following table for the appropriate commands:


    | Utility | find | whereas | which |

    | --- | --- | --- | --- |

    | perl | find perl | whereas perl | which perl |

    | ls | find ls | sedangkan ls | which ls |


