    # Chapter 4: Editing with the Visual Editor


    You should now be familiar with using utilities to create text files. You have
    worked with utilities that read input from files, change the data that they read,
    and then send the changed data to your screen, other files, or utilities. This
    chapter takes one step beyond using utilities to alter files and introduces the
    text editor known as the UNIX/Linux visual editor or vi.


    The powerful vi editor allows a user to create text by giving all instructions
    through combinations of keystrokes. The visual editor allows users to access files,
    move through lines of text, edit content within files, and read in other files.
    The following labs are designed to familiarize you with the vi editor, its command
    mode and append mode, and all of the features and functions it provides.


