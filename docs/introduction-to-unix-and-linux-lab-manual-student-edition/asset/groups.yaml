    | ls m[aeiou]d | 以 m 开头、中间为元音、以 d 结尾的三字母单词 | mad, med, mid, mod, mud |

    | ls [d-g][gt] | 以 d, e, f, g 开头、中间字母为 o、以 g 或 t 结尾的三字母单词 | dog, dot, eog, eot,
    fog, fot, gog, got |


    | 要求 | 通用配符 |

    | --- | --- |

    | 所有以 ga 开头的的文件 | ga* |

    | 所有以 g 开头并以 .doc 结尾的文件 | g*.doc |

    | 所有以任何元音开头且元音后恰好有两个字母的文件 | [aeiou]?? |

    | 所有三个字母的文件，最后一个字母是 g 到 k 之间的字母 | ??[g-k] |


