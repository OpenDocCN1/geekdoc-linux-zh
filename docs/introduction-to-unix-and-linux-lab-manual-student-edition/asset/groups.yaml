    # Lab Exercise 8.05: Redirecting Errors


    LaTrina is a very talented programmer. Her web site currently responds to user
    or site errors by writing to a log web. This is the default action on a web site.
    LaTrina wishes to handle her own errors. She understands the programming code
    involved, but does not understand the UNIX aspect. She asks you to help.


    She has a program called regist.exe that will run on her web site. register allows
    customers to create an account. register works pretty well, but there is the occasional
    bug. LaTrina would like the error messages redirected into the errors.txt file.


    # Learning Objectives


    In this lab, you will redirect error messages from commands to a file. By the
    end of this lab, you''ll be able to:


    +   * Redirect error messages from programs to a user-defined log

    * Run programs in the background


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   * Computer with Red Hat Linux 7.3 installed

    * (Optional) A program called regist.exe


    # Getting Down to Business


    The following steps will help you master redirecting error output into a file.
    You will need a working program that writes error output. You will have to apply
    the knowledge that you acquired in the Introduction to UNIX and Linux textbook
    by John Muster (McGraw-Hill/Osborne, 2002) for redirecting errors.'
