    UNIX/Linux what permissions you do not want set. Whenever a new file is created
    in an unmasked directory, that file will have the correct permissions. umask is
    easy to use. To set an umask, you subtract the desired permission from 777. The
    resulting number is the umask. For example, if you need 644 permission set on
    a directory, the umask is 777 - 644 = 133. You will need to determine the umasks
    based on the permissions you set on the users in Lab Exercise 9.03.


