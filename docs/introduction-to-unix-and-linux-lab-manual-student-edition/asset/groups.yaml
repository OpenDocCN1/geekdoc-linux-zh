    ## Lab Wrap-Up


    You have successfully administered a UNIX computer. You learned how to shut down
    the system and reboot the system. You booted the system into single user mode
    by modifying the GRUB screen. Two new users were added to the system. You solved
    two common problems with user accounts, the repair of the `.bash_profile` file
    and the removal of bad print jobs. Finally, you installed a new package for your
    Red Hat installation.


    Congratulations are in order for completing this text. You worked very hard and
    learned a great deal about working with UNIX. You should feel proud of your accomplishment.
    You should also feel able to solve any UNIX task.


    ## Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    ## Lab Solution 13.01


    The following steps allow you to boot and reboot the server in various modes:


    **Step 1** To shut down the server, you should have used the **shutdown** command.
    If no one was logged into the server, you could have shut down immediately. If
    others were on the system, you should have shut down after at least 30 seconds''
    warning. You should have determined if anyone is logged in with the **who**. If
    *root* was the only person logged in, you should have executed **shutdown -h now**.
    If others were logged in, you should have executed **shutdown -h 30**.


    **Step 2** To reboot the server, you should have pressed the power button. If
    you have installed Linux using GRUB, you should have then picked the desired operating
    system from the list, and continued. Figure 13-1 provides a typical GRUB screen.
    If you installed LILO, you should have typed **Linux** at the prompt.


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_285_0.png)


    **FIGURE 13-1** Picking an OS in the GRUB screen


    **Step 3** Rebooting the server uses the **shutdown** command with the **-r**
    option. You should have entered **shutdown -r** to reboot your computer.


    **Step 4** Booting into the single user mode is a little tricky in GRUB. At the
    screen Figure 13-1, you should have typed **e** to edit your startup options.
    You should have seen at least three options; you should have selected the line
    that starts with **kernel** (it was probably the second line). You should have
    typed **e** to edit this line, and added the word **single** to the end of the
    line. Figure 13-2 shows how the line should look. You should have changed nothing
    except to add **single** to the end of the line. You should have pressed **ENTER**
    to save this change, and then typed **b** to boot into single user mode.


    Booting into single user mode is much simpler if you are using LILO as your boot
    manager. In that case, you should have typed **linux single** at the LILO prompt
    to boot to single user mode.


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_286_0.png)


    **Figure 13-2** Editing the startup line


    ## Chapter 13: Administering a Linux PC System


    **Step 5** You should have used `shutdown -r now` to reboot the server, and then
    let the server boot normally.


    ## Lab Solution 13.02


    The following steps allow you to create groups in the uniprog group:


    **Step 1** You should have logged in to the system as `root`. You should have
    then executed the command `groupadd` uniprog. This creates the uniprog group.


    **Step 2** You should have built the accounts using the `-g` option. The command
    `adduser artie -g` uniprog will create the user and make it a member of uniprog.
    You should have created Zach''s account after creating Artie''s account.


    **Step 3** Finally, you should have changed their passwords with the `passwd`
    command. You should have executed `passwd artie` to change Artie''s password.
    The password secret is good for now. You should have instructed the users to change
    their password after they log in.


    **Step 4** To verify that the accounts were created properly, you should have
    logged in each. You should have entered the `pwd` command to check the home directory
    path. it should be `/home/artie` or `/home/zach`. Finally, you should have entered
    the `groups` command to promote membership in the uniprog group.


    ## Lab Solution 13.03


    The following steps allow you to fix the problems on the system:


    **Step 1** No additional commands were needed.


    **Step 2** You should have logged in as `root` with an `su` - command or a traditional
    login. You should have changed to Zach''s account with the command `cd /home/zach`.
    You should have executed `cp ../artie/.bash_profile` to copy the file from Artie''s
    directory into Zach''s directory. You should have performed `ls -a` to verify
    that the file copied. You should then have made Zach owner of the file with the
    command `chown zach .bash_profile`.


    **Step 3** To fix Artie''s printer problems, you should have logged in as `root`
    and run the utility `lpq` to see the contents of the print queue. Artie''s job
    should have been seen as in Figure 13-3. You should have removed the job by entering
    `rm 462`, where 462 is the number of the job to delete. You should have then rerun
    `lpq` to verify that the job is not in the queue and turned the printer back.


    ```

    root@localhost# lpq

    Printer: hp0952

    Queue: pid 1043 active

    Spooler: pid 1044 active

    Sending 0952@localhost.local, size 135412, format ''wrapper'' Job Files 23:26:31
    ID Size Time

    artie@localhost 462 135412 23:26:31

    ```

    **FIGURE 13-3** Output of lpq


    **Step 4** Resetting Artie''s directory is application of the chmod command. You
    should have changed to the parent directory of artie with the `cd /home`. You
    should have performed `ls -l` to see that Artie''s directory is not readable by
    him. You should have given Artie control over his directory with the command chmod
    755 artie.


    ## Lab Solution 13.04


    The following steps allow you to build a boot disk:


    **Step 1** You should have logged in as root. You should have executed `ls /lib/modules`
    to get the current kernel version. You need this to correctly configure the boot
    disk. In a default installation of Red Hat 7.3, without updates, you should build
    version 2.4.18-3.


    **Step 2** You should have executed the command `mkboot 2.4.18-3` to build the
    disk. After waiting for a moment, you should run `ls` to see a listing of files.
    It should be similar to the listing in Figure 13-4.


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_289_0.png)


    **Figure 13-4** Listing of boot files


    **Step 3** After rebooting with the disk in the drive, you should have seen LILO.
    To boot into Linux, you should have typed Linux at the prompt. Figure 13-5 shows
    the LILO screen after proper input.


    ## Lab Solution 13.05


    The following steps allow you to install the Apache server CDs:


    - **Step 1** You should have inserted CD2 of the Red Hat Installation CDs.

    - **Step 2** You should have mounted the CD with the `mount /mnt/cdrom` command.
    You should have changed to the RPMS directory with `cd /mnt/cdrom/RedHat/RPMS`.

    - **Step 3** You should have entered `ls` to see all files associated with the
    Apache server. You should have then installed these packages with `rpm -ivh *.`.
    While the files are installing, you should have seen the screen shown in Figure
    13-6, which indicates the progress of the files.


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_290_0.png)


    **FIGURE 13-5** LILO boot screen


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_290_1.png)


    **FIGURE 13-6** Installing Apache


