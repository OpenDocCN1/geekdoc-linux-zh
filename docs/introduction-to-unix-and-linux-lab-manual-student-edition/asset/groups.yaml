    \n## 实验 12.03：使用内置的 Gnome 应用\n\nLinux 作为主操作系统看起来开始可行。Jeff 想知道 Linux 是否可以取代员工执行的最流行的三个功能：文字处理、表格分析和图形处理。你告诉\
    \ Jeff Linux 有一个名为 AbiWord 的文字处理器，一个名为 Gnumeric 的表格程序以及 GIMP（GNU 图像处理程序）。你将向 Jeff\
    \ 展示如何使用这些工具创建信件并修改图像。\n\n> 提示\nStarOffice 是从 www.sun.com 提供的免费办公套件。它具有与 Microsoft\
    \ Office 的功能。\n\n### 学习目标\n\n在实验中，你将执行常见的任务。在实验结束时，你将能够：\n\n- 从面板启动程序\n- 使用 AbiWord\
    \ 创建简单的信件\n- 使用 Gnumeric 创建简单的预算表格\n- 使用 GIMP 修改图片\n\n### 实验材料和设置\n\n实验所需的材料是：\n\
    \n- 安装了 Red Hat Linux 7.3 的计算机\n- 在实验 12.01 中复制的图像\n- 安装了 AbiWord、Gnumeric 和 GIMP\
    \ 程序\n- （可选）你的计算机上安装了打印机\n\n"
