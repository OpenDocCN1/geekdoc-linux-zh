    Solutions


    In previous chapters, you worked with the command line. You learned the traditional
    UNIX/Linux interface. In this chapter, you will work with the GUI capabilities
    of UNIX. UNIX/Linux variants of the X Window System (X11) program to provide GUI
    functionality for the user.


    You will use the Gnome version of the X Window System. Gnome was installed by
    default in your Linux installation. In this chapter, you will perform basic file
    management tasks. You will learn to customize you desktop settings. This includes
    background images and links. Finally, you will configure your computer to connect
    to the Internet.


    20 MINUTES


    ## Lab Exercise 12.01: Performing File Management Tasks


    Jeff likes the stable operating system that UNIX provides, but he dislikes the
    command-line interface. He wants to use UNIX with a graphical user interface (GUI),
    like Windows. He feels if Linux had a viable GUI, he could use it as a primary
    OS in the company, and save the company millions in software costs.


    You decide to teach Jeff how to use the X Window System implementation that is
    on his computer. You will show him how to manipulate his files, change his desktop
    settings, run some built-in applications, and create separate desktops.


    You will start Jeff''s exploration of the X Window System interface with some
    file management techniques. You will show him how to rename files, copy files
    and directories, delete files, and utilize the trashcan. The skills are similar
    to those used in a Windows interface, so Jeff should catch on quickly.


    ## Lab Exercise 12.01: Performing File Management Tasks


    ### Learning Objectives


    In this lab, you will use the X Window System to manage files. By the end of this
    lab, you''ll able to:


    - Start the X Window System interface on your UNIX system

    - Start Nautilus or another file manager

    - Copy, rename, and delete files and directories


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - A version of the X Window System installed on your computer


    ### Getting Down to Business


    The following steps will help you perform basic file management techniques in
    Gnome. You will have to apply the knowledge that you acquired in the Introduction
    to UNIX and Linux text- by John Muster (McGraw-Hill/Osborne, 2002) for using Gnome.


    **Step 1** Create a file called xname.

    **Step 2** Start the X Window System interface.

    **Step 3** Start the file management.

    **Step 4** Rename the directory to xname.

    **Step 5** Copy the file to xname.

    **Step 6** Delete the files x1, x2, and x3.

    **Step 7** Change the permissions for the owner, everyone else.

    **Step 8** Move the image to the directory.


    ## Lab Exercise 12.02: Customizing the Desktop


    Jeff likes Gnome. However, he enjoys the desktop and feels the default background
    is boring. He also wants to know add links to the desktop, like Windows. You assure
    him he can modify his desktop The panel in Gnome is equivalent to the Start button
    in Windows. The panel looks like the desktop.


    ### Learning Objectives


    In this lab, you will customize your desktop. By the end of this lab, you''ll
    able to:


    - Change the wallpaper

    - Add icons to the desktop

    - Configure a screen saver


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - An image to be used as the desktop

    - Any text file or program


    ### Getting Down to Business


    The following steps will help you customize the desktop.


    **Step 1** Right-click the desktop to change your background image.

    **Step 2** Choose a screen saver from the Settings menu on the panel.

    **Step 3** Add a link to the panel to a file in your home directory.

    **Step 4** Add a link on your desktop to a file in your home directory.


    ## Lab Exercise 12.03: Using Included Gnome Applications


    Linux as the primary OS is starting to look possible. Jeff wants to know if Linux
    can replace the three most popular functions performed by his staff: word processing,
    spreadsheet analysis, and graphic manipulation. You tell Jeff Linux has a word
    processor called AbiWord, a spreadsheet program called Gnumeric, and GIMP (GNU
    Image Manipulation Program). You will show Jeff how to use these tools to create
    a letter and modify an image.


    > Hint

    StarOffice is a free office suite program available from www.sun.com. It performs
    the same functions as Microsoft Office.


    ### Learning Objectives


    In this lab, you will perform common office tasks. By the end of this lab, you''ll
    able to:


    - Start programs from the panel

    - Use AbiWord to create a simple letter

    - Use Gnumeric to create a simple budget spreadsheet

    - Use GIMP to modify a picture


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - The image you copied in Lab 12.01

    - The AbiWord, Gnumeric, and GIMP programs installed

    - (Optional) A printer installed on your computer

