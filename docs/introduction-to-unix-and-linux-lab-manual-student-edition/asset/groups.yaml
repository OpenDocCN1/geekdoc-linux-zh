    - 1. What is the name of the utility in UNIX that lists the unique words used
    in a file?

    - 2. What is the purpose of creating a word analysis script?

    - 3. In order to properly remove duplicate words, what requirements must be met?

    - 4. What is the -F argument used for when combined with the ls utility?

    - 5. What is the function of the tr utility?


