    \ (Note: OCR text seemed fragmented here, reconstructed based on logical flow).\n\
    \n> **Warning**: Be sure that you use the cp command rather than the mv command.\n\
    \n- **Step 2**: Go to the commands directory.\n- **Step 3**: Using your favorite\
    \ text editor, create a new script called archive.\n- **Step 4**: Write the commands\
