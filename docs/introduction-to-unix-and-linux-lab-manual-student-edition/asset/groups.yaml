    3. The __________ utility deletes a line only if it is adjacent to another identical
    line.

    4. The __________ utility is a stream editor that takes text on its input stream,
    makes the specified changes, and sends the modified text to the output stream.

    5. A __________ allows you to take the output from a command and direct it into
    a file and/ to another command.


    # Lab Wrap-Up


    You should now be familiar with creating scripts that employ multiple utilities
    to manipulate and retrieve data. You should have successfully created a complex
    word analysis script and analyzed the code you had written in a script. Additionally,
    you explored creating, modifying, and viewing files and directories. You should
    now be comfortable with how to organize your files, collect important information
    about each file, and create and analyze effective scripts.


