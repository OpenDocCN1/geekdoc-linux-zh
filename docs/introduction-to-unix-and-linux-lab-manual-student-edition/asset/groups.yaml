    ## 实验总结


    你成功地管理了一台 UNIX 计算机。你学习了如何关闭系统和重启系统。你通过修改 GRUB 界面将系统引导到单用户模式。向系统中添加了两个新用户。你解决了两个关于用户账户的常见问题：`.bash_profile`
    文件的修复以及错误打印作业的删除。最后，你为你的 Red Hat 安装了一个新软件包。


    完成这篇教程，，向你表示祝贺。你工作非常努力，并学习了许多关于使用 UNIX 的知识。你应该为自己的成就感到自豪。你也应该觉得自己有能力解决任何 UNIX
    任务。


    ## 解决方案


    在本节中，你将找到实验练习的答案。


    ## 实验解决方案 13.01


    以下步骤允许你以各种模式启动和重启服务器：


    **第 1 步** 要关闭服务器，你应该使用 **shutdown** 命令。如果没有人登录服务器，你可以立即关闭。如果有其他人在系统上，你应该在发出至少
    30 秒的警告后关闭。你应该使用 **who** 命令确定是否有人登录。如果 *root* 是唯一登录的用户，你应该执行 **shutdown -h now**。如果有其他人登录，你应该执行
    **shutdown -h 30**。


    **第 2 步** 要重启服务器，你应该按下电源按钮。如果你使用 GRUB 安装了 Linux，然后你应该从列表中选择所需的操作系统并继续。图 13-1 提供了一个典型的
    GRUB 界面。如果你安装了 LILO，你应该在提示符处输入 **Linux**。


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_285_0.png)


    **图 13-1** 在 GRUB 界面中选择操作系统


    **第 3 步** 重启服务器使用带有 **-r** 选项的 **shutdown** 命令。你应该输入 **shutdown -r** 来重启你的电脑。


    **第 4 步** 在 GRUB 中引导到单用户模式有点棘手。在图 13-1 所示的界面上，你应该输入 **e** 来编辑你的启动选项。你应该至少看到三个选项；你应该选择以
    **kernel** 开头的那行（可能是第二行）。你应该输入 **e** 编辑此行，并在行末添加单词 **single**。图 13-2 显示了该行应该后的样子。除了在行末添加
    **single** 之外，你不应该更改任何内容。你应该按下 **ENTER** 保存此更改，然后输入 **b** 引导到单用户模式。


    如果你使用 LILO 作为你的引导程序，引导到单用户模式要简单得多。在这种情况下，你应该在 LILO 提示符处输入 **linux single** 以引导到单用户模式。


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_286_0.png)


    **图 13-2** 编辑启动行


    ## 第 13 章：管理 Linux PC 系统


    **第 5 步** 你应该使用 `shutdown -r now` 重启服务器，然后让服务器正常启动。


    ## 实验解决方案 13.02


    以下步骤允许你在 uniprog 组中创建组：


    **第 1 步** 你应该以 `root` 身份登录系统。然后你应该执行命令 `groupadd` uniprog。这创建了 uniprog 组。


    **第 2 步** 你应该使用 `-g` 选项构建账户。命令 `adduser artie -g` uniprog 将创建该用户并使其成为 uniprog
    组的成员。你应该在创建 Artie 账户后创建 Zach 的账户。


    **第 3 步** 最后，你应该使用 `passwd` 命令更改他们的密码。你应该执行 `passwd artie` 来更改 Artie 的密码。该密码密钥目前是良好的。你应该指示用户在登录后更改密码。


    **第 4 步** 为了验证账户是否已正确创建，你应该分别登录每一个账户。你应该输入 `pwd` 命令来检查主目录路径。它应该是 `/home/artie`
    或 `/home/zach`。最后，你应该输入 `groups` 命令来确认其在 uniprog 组的成员身份。


    ## 实验解决方案 13.03


    以下步骤允许你修复系统上的问题：


    **第 1 步** 不需要额外的命令。


    **第 2 步** 你应该使用 `su` - 命令或传统的登录以 `root` 身份登录。你应该使用命令 `cd /home/zach` 切换到 Zach
    的账户。你应该执行 `cp ../artie/.bash_profile` 将文件从 Artie 的目录复制到 Zach 的目录。你应该执行 `ls -a`
    来验证文件已复制。然后你应该使用命令 `chown zach .bash_profile` 让 Zach 成为文件的所有者。


    **第 3 步** 为了修复 Artie 的打印机问题，你应该以 `root` 身份登录并运行工具 `lpq` 查看打印队列的内容。Artie 的作业应该如图
    13-3 所示。你应该通过输入 `rm 462` 来删除作业，其中 462 是要删除的作业编号。然后你应该重新运行 `lpq` 以验证。


    ```

    root@localhost# lpq

    printer: localhost

    spooler: active

    size: 1354

    time: 23:26

    job 462  artie

    ```

    **图 13-3** lpq 的输出


    **第 4 步** 你以 `root` 身份登录并运行工具 `lpq` 查看打印队列的内容。Artie 的作业应该如图 13-3 所示（注：此处原文重复，应为Artie
    的作业状态）。你应该通过输入 `rm 462` 来删除作业，其中 462 是要删除的作业编号。然后你应该重新运行 `lpq` 以验证。


    ```

    root@localhost# lpq

    printer: localhost

    spooler: active

    size: 1354

    time: 23:26

