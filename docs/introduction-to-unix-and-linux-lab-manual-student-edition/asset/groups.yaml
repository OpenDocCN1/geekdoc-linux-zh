    # Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    +   - Hint

    - The following directions are for the Gnome GUI. Gnome is the default GUI installed
    on a Red Hat Linux installation.


    # Lab Solution 12.01


    The following steps allow you to use the Nautilus file manager system in the Gnome
    IDE:

    Step 1 You should have created the directory called xpractice with mkdir xpractice,
    then changed to this directory with cd xpractice. You should have created x1,
    x2, and x3 using the touch command. You should have executed touch x1 x2 x3.


    Step 2 You should have started the X Window System with the start command. After
    a short pause, the Gnome desktop should have been displayed.


    Step 3 You should have started the Nautilus file management system by right-clicking
    the home icon, and selecting the Open menu entry. The Nautilus shell should have
    appeared, as shown in Figure 12-1. The icons and their meanings should have been
    obvious.


    Step 4 Most of the steps to use Gnome are right-clicks. To rename the xpractice
    directory, you should have right-clicked the directory and selected Rename. Then
    you should have typed the new name and pressed ENTER. You should have opened gnome
    by right-clicking and selecting Open or double-clicking it.


    Step 5 To browse to a different directory, you should have either typed the path
    in the address bar or used the arrow buttons to move the toolbar. Except for long
    paths, it is much easier to type the path. You should have typed /etc to the address
    bar, then find to locate the file called lpd.conf. You should have right-clicked
    lpd.conf and selected Copy File. A fast way to jump to the file is to click in
    the File area and type the first letter, in this case l. You should have browsed
    back to your xname ~/xname in the address bar. Then you should have right-clicked
    any white area on your screen and selected Paste Files. The file should have been
    copied.'
  - '[PAGE 263]


