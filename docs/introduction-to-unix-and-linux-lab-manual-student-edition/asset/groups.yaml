    ## Getting Down to Business


    The following steps will help you shut down the server. You will have to apply
    the knowledge that you acquired in the Introduction to UNIX and Linux textbook
    by John Muster (McGraw-Hill/Osborne, 2002) to shut down the server.


    > Tip

    > You will restart the server several times. The command to down the server is
    shutdown.


    - Step 1: Shut down the server for halt, using the shutdown command.

    - Step 2: Boot the server normally.

    - Step 3: Down the server for reboot.

    - Step 4: Boot into user maintenance mode.


    > Hint

    > See [redhat.com](www.redhat.com) for more information. Enter a search for single
