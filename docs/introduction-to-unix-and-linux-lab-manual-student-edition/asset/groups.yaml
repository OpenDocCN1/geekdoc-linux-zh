    In the last chapter, you worked with permissions and a script. In this chapter,
    you will learn how to manipulate how files are stored on the system. You will
    compress files to save space. You will work with floppy disks and splitting files
    to fit on floppy disks. You will use the root permissions to stop undesired user
    permissions. Finally, you will use pr to format a document for rarely printing.


    20 MINUTES


    ## Lab Exercise 11.01: Compressing a File


    Jeff has some problems with files and disk space. He would like you to help him
    manage the files on his system. He needs to learn how to use less space and send
    files to disk for storage. In addition, he is having trouble printing his documents.
    You know several utilities that can help Jeff with his problem. You begin by teaching
    Jeff how to compress files, then move on to accessing a floppy disk.


    Jeff mentioned that his de-UNIX system is running out of disk space. You have
    determined that he has several large files which he says are important but rarely
    used. You will help Jeff compress these rarely used files, using the commands
    gzip and tar. gzip is similar to the PC''s pkzip format. It does a very nice job
    compressing files. tar allows you to place several files into one file for transport
    and storage. It can be thought of as a box that holds several files.


    ## Learning Objectives


    In this lab, you will use UNIX compression utilities. By the end of this lab,
    you''ll be able to:


    - Compress a file using gzip and compress

    - Uncompress a file using unzip and uncompress

    - Condense files using tar

    - Compress files using tar


    ## Lab Exercise 11.01: Compressing a File


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed


    ## Getting Down to Business


    The following steps allow you to compress files using gzip, gunzip, and tar. You
    will have to apply the knowledge that you acquired in the Introduction to UNIX
    and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for compressing
    files.


    **Step I** Create a directory called chapter11. Copy all of the .conf files from
    the /etc directory. If this directory is invalid or protected, your instructor
    may provide a different set of files to work with.


    ### COMPRESSION


    **Step I** What is the size of the pine.conf file?


    **Step 2** Compress this file using the compress utility. What is its size now?


    **Step 3** Uncompress this file using the uncompress utility.

    **Step 4** Compress this file using the gzip utility. What is its size now?


    **Step 5** Uncompress this file using the gunzip utility.


    ## Chapter 11: Managing, Printing, and Archiving Large Files


    ### TARRING


    Step 1 List all the files that begin with s and end with .conf. Total their sizes.
    What is their total size? How many files did you list?


    Step 2 Create a new tar file called conf.tar. Add the files you found in Step
    1.


    Step 3 What is the size of the conf.tar file? Why is it bigger?


    Step 4 Delete this archive. Rebuild the archive using the gzip option for tar.


    Step 5 What is the size of the conf.tar file?


    ## Lab Exercise 11.02: Saving Files to Disk


    20 MINUTES


    Jeff, like most business managers, does some work at home. Currently, he is unable
    to move his files to and from his house. He has resorted to printing the files,
    hand-writing the changes on the output, and coding the change the next day. This
    is extremely inefficient, as well as being costly. Jeff wants to be able to take
    the files home and work on his home computer. A catch: he prefers to work on his
    Windows computer, rather than his Linux computer. He wants to know how his files
    can transfer from UNIX to Windows.


    > Hint: DOS disks are readable in Windows systems.


    You know that most Linux and UNIX systems allow the copying of files to and from
    a DOS disk. UNIX provides a suite of utilities called mtools, which provide for
    the formatting and accessing of DOS disks.


    ## Learning Objectives


    - In this lab, you will use the mtools suite for Linux. By the end of this lab,
    you''ll be able to:

    - Format a floppy disk for use in both UNIX and Windows

    - List the files on a disk

    - Copy files to the disk

    - Delete files on the disk


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - The chapter 11 directory created in Lab Exercise 11.01

    - A floppy disk that can be erased

    - Physical access to the floppy drive on the UNIX/Linux computer

    - Physical access to a Windows-based PC that has Notepad installed on it


    > Hint: Any text editor on a PC will work. In addition, Macintosh computers can
    read and write DOS disks as well.


    ## Getting Down to Business


    The following steps will allow you to copy files to and from DOS disks. You will
    have to apply the knowledge that you acquired in the Introduction to UNIX and
    Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for working with the
    **tools** utilities.


    **Step 1** Format the floppy disk. Use the -f parameter and the appropriate size.

    **Step 2** Copy all files in the chapter11 directory that begin with k, l, or
    m to the floppy drive.

    **Step 3** List the files on the floppy drive and verify that all were copied.

    **Step 4** Remove the files on the floppy drive that begin with m. Verify that
    the files were deleted.

    **Step 5** Take the disk to a Windows computer. Open several of the files in Notepad.
    Make a change to one of the files. Be sure the filename does not have the .txt
    extension.

    **Step 6** Go back to the UNIX computer and copy the file you changed to the chapter11
    directory. Verify that the file can still be read and that the change is present.


    ## Lab Exercise 11.03: Splitting a Large File


    10 MINUTES


    Jeff needs to get a file to his home computer. However, the file is quite large
    and will fit on a floppy disk. He needs to split the file into pieces. You will
    use the split command to break the file into pieces. To allow Jeff to edit the
    file, you will limit the size.


    ## Learning Objectives


    In this lab, you will split one large file into several files. By the end of this
    lab, you''ll be able to:


    - Split and rejoin files


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - The chapter11 directory created in Lab Exercise 11.01

    - At least three floppy disks that can be erased

    - Physical access to the floppy drive on the UNIX computer


    ## Getting Down to Business


    The following steps will help you split large files. You will have to apply the
    knowledge you acquired in the Introduction to UNIX and Linux textbook by John
    Muster (McGraw-Hill/Osborne, 2002) for working with the split utility.


    Step 1 Navigate to the chapter11 directory. Create a large text file with repeated
    uses of the following command: cat *.conf >> big.file. Continue to append to the
    file until it is about 3 million bytes.


    **Step 2** What is the length of big.file?


    **Step 3** Split the file into several pieces, each no more than 1,200,000 bytes.
    Use the base name (prefix) of big.


    **Step 4** List the files created. Sum their sizes and verify that the total is
    the same as the size of big.file.


    **Step 5** Copy each file to a floppy disk.


    **Step 6** Delete big.file.


    **Step 7** Make a change to one of the files (preferably the first file).


    **Step 8** Copy the three files from the floppy drive back to the chapter11 directory.


    **Step 9** Rebuild the file. Verify that it is the correct size.

