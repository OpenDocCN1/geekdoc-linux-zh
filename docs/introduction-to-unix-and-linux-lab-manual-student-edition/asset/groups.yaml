    ## Chapter 2: Touring the System


    10 MINUTES


    ## Lab Exercise 2.05: Using man to Find Pages by Keyword


    LaTrina is not entirely impressed with man. The problem, she says, is that you
    need to know the command before you can get help. This only helps a UNIX guru,
    not a mere mortal. How can she search the man pages for keywords? For example,
    how can she find all commands that set permissions?


    You know that man has a search option, -k, which allows you to search the man
    pages by string. This should impress LaTrina.


    > Warning

    > On some versions of UNIX, the catman -k command sets the index in UNIX so that
    a user can search the man pages using key words.


    ## Learning Objectives


    Upon completion of this lab, you will be able to search the man pages for keywords.


    ## Lab Materials and Setup


    You will need the following to complete this lab:


    - An account on a UNIX/Linux computer

    - A pen or pencil


    ## Getting Down to Business


    You will use the -k switch for man to find the number of commands that deal with
    the following keywords. Please write the number of commands that pertain to each
    keyword in the Number of Commands column.


    > Hint

    > You can use the apropos utility instead of man -k.


    ## Hint


    Remember to redirect the output into wc. This will let UNIX count for you!


    | Keyword | Number of Commands |

    | --- | --- |

    | images | \ |

    | modem | \ |

    | permissions | \ |

    | XII | |


