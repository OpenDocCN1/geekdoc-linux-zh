    \ Bob 的所有文件。如果 Bob 的目录中有多个文件，你可以修改 **find** 命令，使其从 /home/cottrell 目录开始搜索。\n\n\
    ## 实验解决方案 11.05\n\n**步骤 1** 使用 vi、pico 或任何其他文本编辑器，你应该创建一个名为 phonelist 的文件，列表中应至少包含\
    \ 10 个名称和数字。\n\n**步骤 2** 你应该使用 **pr** 工具为打印准备文档。输入 `pr phonelist` 应该创建一个单列且带有默认标题的文档。\n\
    \n## 第 11 章：管理、打印和归档大文件\n\n步骤 3 你应该使用 -2 切换以强制两列。\n\n步骤 4 你应该使用 -h 'Phone List'\
    \ 更改页眉。\n\n步骤 5 你应该使用 -D'September' 切换更改日期。\n\n步骤 6 为了让输出双倍行间距，你应该使用 -d 切换。\n\n\
    步骤 7 强制输出横向排序而不是纵向排序，应该通过 -a 完成。\n\n步骤 8 整个 pr 命令为 `sort phonelist | pr -a -2'Sept'\
    \ -d -h 'Phone List'`。\n\n步骤 9 你应该将 pr 命令重定向到 lp 工具。整个命令如下。命令的输出见图 11-7。\n\n```\n\
    sort phonelist | pr -a -2'September' -d -h 'Phone List' | lp\n```\n\n图 11-7 pr\
