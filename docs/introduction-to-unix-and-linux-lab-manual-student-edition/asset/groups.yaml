    # Lab Solution 6.01


    The following steps should guide you in employing utilities to obtain information:


    - **Step 1** You should have logged on to the Linux computer with your username
    and password and opened a terminal window.


    - **Step 2** To open the visual editor and create a script named Information,
    you should have executed the `vi Information` command and then switched from command
    mode to append mode by typing `a`. When adding the content from the table to the
    script, the result would be:


    ```

    echo The date today is

    date

    echo The current users logged on to the system are

    who | grep $USER

    echo My current startup directory is

    pwd

    echo My identification information is

    id

    echo The processes running on my system are

    ps

    CTRL-D

    ```


    - **Step 3** To save the script and exit to the shell, you should have executed
    `:wq` command. To make the script executable, the `chmod +x` Information command
    should have been executed and then the script should have been run by typing `./Information`
    as shown in Figure 6-1. You should have successfully created and run the script.


    - **Step 4** To redirect the output of the Information script to a file named
    DailyInfo, you should have typed the command `./Information > DailyInfo`. You
    should have successfully completed the lab and logged off the computer.

