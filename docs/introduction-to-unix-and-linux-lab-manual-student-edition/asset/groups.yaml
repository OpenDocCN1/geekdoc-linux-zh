    ## 实验解答 8.04


    在本次实验中，你使用了 UNIX 中的三种通用配符。字符 `*` 可以替换任何字符或任意数量的字符。例如，`a*` 会列出 a、ab、abc、abcd 等文件。`?`
    匹配任意一个字符。例如，`???` 将找到任何三个字母的文件名。它不会找到两个或四个字符的文件名；只返回三个字符的文件。`[]` 表示可以使用使用的字符列表或字符范围。`[a-f]`
    是从 a 到 f 的所有字母；`[aeiou]` 仅包含字母 a, e, i, o, u。


    | 命令 | 通用配符描述 | 示例文件 |

    |---|---|---|

    | ls a* | 所有以 a 开头的的文件 | apple, Andrew, a.out |

    | ls duke*. | 所有以 duke 开头并以 .doc 结尾的文件 | dukeCity.doc, dukeWayne.doc, duke.doc
    |

    | ls *.jpg | 所有以 .jpg 结尾的文件 | lee.jpg, lizzie.jpg, Christopher.jpg |

    | ls ???.jpg | 所有以 .jpg 结尾的三个字母文件 | lee.jpg, dad.jpg, mom.jpg |


