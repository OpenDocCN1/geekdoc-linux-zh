    # Chapter 1: Logging On to the System


    UNIX/Linux computers can serve many users at the same time. Each user must have
    an account that uniquely identifies them on the system. An administrator must
    create a unique account for each user so they can be granted secure access to
    the system. Then the user can enter their unique login name that is associated
    with their account, and the password that matches that login account. If the information
    is correctly entered into the system, the user will be granted access. If an error
    is made upon entering the login name or password, the user will be refused access
    to the computer.


    This chapter examines the process of logging on to a Linux system. You will successfully
    log on to a system and view the terminal window and graphical window environments
    that Linux provides. You will test the login process by entering login information
    incorrectly and observe how Linux responds to login errors. You will also research
    the Internet for careers that require knowledge of UNIX/Linux systems, versions
    of UNIX/Linux that are available, and use of each system in today''s society and
    business world.


    20 MINUTES


