    在上一章中，你学习了权限和脚本。在本章中，你将学习如何操作文件在系统中的存储方式。你将压缩文件以节省空间。你将处理软磁盘并拆分文件以适应软磁盘。你将使用 root
    权限来阻止不需要的用户权限。最后，你将使用 `pr` 命令对文档进行格式化，以便进行少量打印。


