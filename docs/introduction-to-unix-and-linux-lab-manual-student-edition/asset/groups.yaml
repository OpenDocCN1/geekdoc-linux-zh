    # 引言


    每项实验练习都允许你在现实场景中应用和练习特定的概念或技能。


    # 案例研究


    每个目标都以案例研究的形式呈现。它们为你提供了一个概念性的机会，以应用你新学的知识。


    # 学习目标


    与学习指南配合使用，第一个目标是帮助你理解 UNIX/Linux。第二个目标是培养你的批判性思维。在网络中，并不是所有的安装、重新安装或网络系统问题每次都会以相同的方式出现。为此，你需要能够分析、考虑你的各种选项以及每个选项的结果，并选择并实施该选项。如果奏效，那太好了；如果不奏效，你就要重新开始。


    # 实验材料与设置


    为了完全完成每个实验，必须满足以下硬件和软件要求。如果无法实现，请通读这些步骤，并尽可能熟悉这些操作流程。


