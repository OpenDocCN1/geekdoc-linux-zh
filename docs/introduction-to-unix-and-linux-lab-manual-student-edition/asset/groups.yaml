    - Solutions


    In the previous chapters, you entered several commands. In this chapter, you will
    expand your knowledge of the command line. You will use wildcards and command
    substitution to create powerful commands. You will also redirect the errors from
    your commands to a log file. Each of these skills is very useful in both academic
    and corporate settings.


    15 MINUTES


    ### Lab Exercise 8.01: Identifying Portions of the Command Line


    Your friend LaTrina is about to graduate from college. At her school, she had
    had access to a UNIX system. She created and published a fantastic web page and
    service Go4U. Go4U is a system that delivers anything to anybody. The registered
    user simply needs to list what they would like delivered and where. Go4U''s delivery
    people will pick up the package and deliver it on time.


    Since LaTrina is graduating, she is losing her web space. She has registered her
    new domain and would like help moving the web page to her hosting company. Her
    hosting company is using a different variant of UNIX than her college. LaTrina,
    while being an excellent developer, only learned enough UNIX to publish her page.
    She is anticipating some problems with the conversion and has asked you to help
    with the move. You, being the UNIX expert, agree to teach her some basics and
    fix any UNIX bugs.


    Before you teach LaTrina any advanced commands, you want to ensure that she understands
    how a UNIX command is built. You will have her dissect and build several complex
    UNIX commands. This will allow her to understand the commands she enters later.


    ### Learning Objectives


    In this lab, you will identify portions of a command line. After you''ve completed
    this lab, you will be able to:


    - Identify utilities, parameters, and switches

    - Build UNIX commands


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Pencil and paper


    ### Getting Down to Business


    The following steps will help you identify the different portions of a command
    line. You will have to apply the knowledge you acquired in the Introduction to
    UNIX and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for working
    with the command line.


    **Step 1** Identify the utilities, switches, and parameters in the following commands.
    For each command line in the following list, write the utilities, parameters,
    and switches.


    | Command Line | Parameters | Switches |

    | --- | --- | --- |

    | cp /etc/printcap;less printcap | | |

    | man ls -d | | |

    | mkdir -m755 scripts;cd scripts | | |


    **Step 2** In the space provided, fill in the portion of the command line that
    could be present.


    - a) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    - b) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    - c) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_; ; \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    **Step 3** For each of the above command lines, create three valid commands that
    would fill each space. As an example, for b, a valid command is `cp /etc/printcap
    ~printcap`.


    - a) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    - b) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    - c) \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    ### Lab Exercise 8.02: Finding Utilities on the System


    Much of LaTrina''s site was built using the Perl programming language. Perl is
    a very nice language for web developers. It is easy to learn and reasonably fast.
    It is also freely available for download at several web sites. For a Perl script
    to run, the script must know what directory holds the working version of Perl.


    LaTrina''s site currently does not work because she has the wrong path to Perl.
    In order for the Perl scripts to run, the first line must contain the actual path
    to the perl command. LaTrina''s script is still set to the Perl directory at her
    university. The line incorrectly reads #usr/sbin/perl. She asks you to help her
    find the correct location.


    ### Learning Objectives


    In this exercise, you will find several commands on the system. After you''ve
    completed the lab, you will be able to:


    - Use whereis to find all occurrences of a utility

    - Use find to find the directory holding a utility

    - Use which to determine which of the occurrences is currently the system default


    ### Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - Pencil and paper


    ### Getting Down to Business


    > **Hint**

    Three utilities can help in this situation. The whereis utility will find all
    versions of the utility. The find utility will give you the directory, but not
    the path holding the current default version. The which utility will determine
    the current default version.


    ### Lab Exercise 8.02: Finding Utilities on the System 155


    The following steps will help you locate commands on the system. You will use
    three different tools to find several commands. You will have to apply the knowledge
    that you acquired in the Introduction to UNIX and Linux textbook by John Muster
    (McGraw-Hill/Osborne, 2002) for searching the UNIX/Linux installation.


    Locate the following utilities: find, whereis, and which. Record the results in
    the table. Feel free to abbreviate if the results are very long.


    | Utility | find | whereis | which |

    | --- | --- | --- | --- |

    | perl | | | |

    | ls | | | |

    | man | | | |

    | startx | | | | |


    ### Lab Exercise 8.03: Using Command Substitution to Write Simple Scripts


    LaTrina''s hosting provider does not allow her to write scripts. However, she
    needs to automate some tasks. In this lab, you will use command substitution to
    write simple scripts. This will help LaTrina automate her web site tasks. Command
    substitution is a feature that tells the shell to use the output of one command
    as an argument for another.


    ### Learning Objectives


    In this lab, you will identify portions of a command line. After you''ve completed
    this lab, you will be able to:


    - Identify utilities, parameters, and switches

    - Build UNIX commands


    ### Lab Materials and Setup


    The materials you need for this lab are:


