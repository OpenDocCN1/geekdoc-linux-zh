    # 实验 6.03：创建一个复杂的单词分析脚本


    Rolf 想要创建一个脚本来分析他关于汽油价格的最新报文章。他想对文本进行排序，统计文章中有多少重复单词，并删除重复单词。他希望将这些分析结果保存到一个单独的文件以便以后查看。


    # 学习目标


    在练习中，你将创建一个复杂的单词分析脚本。完成此实验后，你将能够：


    - 创建一个长文本文件

    - 移除标点符号并将字符转换为小写

    - 修改行的显示


    # 实验材料和设置


    对于本次实验，你需要：


    - 安装了 Red Hat Linux 7.3 的计算机

    - 铅笔和纸


    # 开始正题


    以下步骤将指导你创建一个复杂的单词分析脚本。你必须应用在 John Muster 编写的《Introduction to UNIX and Linux》（McGraw-Hill/Osborne,
    2002）一书中中学的知识，来移除标点符号、将所有字符转换为小写，以及排序和删除文本行。


    **步骤 1** 使用你的用户名和密码登录 Linux 计算机。打开终端窗口。


    **步骤 2** 创建并保存一个名为 Gasoline 的新文本文件，内容如下：


    过去两周，汽油价格每加仑仅上涨了半美分，继续了20周的价格平稳趋势。


    根据周日发布的一项针对 8000 家加油站的调查，全国平均汽油价格（包括所有等级和税费）周五约为每加仑 $1.46。这比8月9日以来每加仑上涨了 .5 美分。自4月初初以来价格变化不大，那时加仑汽油的价格也约为
    $1.46。


    步骤 3 创建一个名为 TestScript 的分析脚本，为 Gasoline 文件完成以下任务：


    - a) 移除标点符号

    - b) 将所有字符转换为小写

    - c) 将每个单词放在单独一行

    - d) 删除空行

    - e) 排序文本，使包含相同单词的行彼此相邻

    - f) 删除文本中的重复单词

    - g) 先列出文件中使用最多的单词

    - h) 将此脚本的输出发送到名为 ScriptResult 的文件中


    步骤 4 验证脚本已成功创建。使 TestScript 变为可执行。运行脚本。


    步骤 5 打开 ScriptResult 文件，并验证内容是否符合 TestScript 脚本中的要求。注销计算机。


    # 实验分析测试


    - 1. UNIX 中列出文件中使用的唯一单词的工具名称是什么？

    - 2. 创建单词分析脚本的目的是什么？

    - 3. 为了正确删除重复单词，必须满足哪些条件？

    - 4. 当与 `ls` 工具结合使用时，`-F` 参数用于什么作用？

    - 5. `tr` 工具的功能是什么？


    # 关键术语测验


    使用以下词汇来完成下面的句子。并非所有术语都会被使用。


    - awk

    - column

    - comm

    - sed

    - sort

    - tee

    - uniq

    - wc


    1. 该工具定位目标字符并将其替换为其他字符。

    2. 使用 __________ 工具可以识别两个独立快照文件之间的差异。

    3. __________ 工具仅在当某行与另一行完全相同的行相邻时才删除该行。

    4. __________ 工具是一个流编辑器，它接收输入流中的文本，进行指定的更改，并将修改后的文本发送到输出流。

    5. __________ 允许你获取命令的输出并将其重定向到文件以及发送到另一个命令。


    # 实验总结


    你现在应该熟悉创建使用多个工具来操作和检索数据的脚本。你应该已经成功创建了一个复杂的单词分析脚本，并分析了你在脚本中编写的代码。此外，你还探索了创建、修改和查看文件及目录。你现在应该熟悉如何组织文件、收集每个文件的信息以及创建和分析有效的脚本。


    # 答案


    在此部分，你将找到实验的解答。


    # 实验解答 6.01


    以下步骤将指导你利用工具获取信息：


    - **步骤 1** 你应该已经使用用户名和密码登录 Linux 计算机并打开了终端窗口。


    - **步骤 2** 打开可视化编辑器并创建一个名为 Information 的脚本，你应该执行 `vi Information` 命令，然后通过输入 `a`
    从命令模式切换到插入模式。将表格内容添加到脚本时，结果如下：


    ```

    echo 今天日期是

    date

    echo 当前登录系统的用户有

    who | grep $USER

    echo 我当前的启动目录是

    pwd

    echo 我的身份身份信息是

    id

    echo 我的系统上运行的进程有

    ps

    CTRL-D

    ```


    - **步骤 3** 要保存脚本并返回 shell，你应该执行 `:wq` 命令。要使脚本变为可执行，应执行 `chmod +x` Information
    命令，然后如图 6-1 所示通过输入 `./Information` 运行脚本。你应该已成功创建并运行了脚本。


    - **步骤 4** 为了将 Information 脚本的输出重定向到名为 DailyInfo 的文件，你应该输入命令 `./Information >
    DailyInfo`。你应该已成功完成实验并注销了计算机。


