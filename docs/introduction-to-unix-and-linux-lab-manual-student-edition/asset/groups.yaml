    # 解决方案


    在本节中，你将找到实验练习的解决方案。


    ## 实验解答 2.01


    帮助 Jo 熟悉 shell（命令行界面）并创建一个新文件应该涉及以下步骤：


    - **步骤 1** 你应该使用 **root** 管理员登录账户和密码登录到 Linux 计算机。此账户赋予你创建额外用户账户的权限。


    - **步骤 2** 你应该通过从 Linux 计算机的 **System**（系统）菜单中选择打开 **User Manager**（用户管理器）控制台。


    - **步骤 4** 为了保存为你自己创建的用户账户，你应该点击 **OK**（确定）按钮，然后关闭 **User Manager** 控制台并注销计算机。这将为你通过使用新用户名和密码重新登录计算机来测试你创建的用户账户做好准备。


    - **步骤 5** 你应该已经使用你为自己创建的新用户账户和密码成功登录计算机。如果登录失败，请确保你在每个提示处输入了正确的信息。如果仍然失败，你可以使用管理员
    **root** 账户重新登录，并重新创建或编辑用户账户以纠正任何错误。


    - **步骤 6** 终端窗口提示符应该显示你的用户登录账户。这将帮助你在搜索文件时识别出你正在搜索正确的家目录（home directory）。在执行 `ls`
    命令后，你应该发现当前目录下没有存在的文件。


    - **步骤 7** 在提示符处执行的创建名为 `work_schedule` 的包含 2002 年 11 月日历文件的正确命令应该是：


    ```

    cal 2002 > november_work_schedule

    ```


    **calendar**（日历）工具用于创建 2002 年第一个月（11月）的结果。该结果被重定向到名为 `november_work_schedule`
    的文件中。


