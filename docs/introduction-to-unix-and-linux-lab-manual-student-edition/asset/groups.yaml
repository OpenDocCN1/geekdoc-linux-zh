    will have to apply the knowledge that you acquired in the Introduction to UNIX
    and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for creating a script.


    **Step 1** Log on to the Linux computer with your username and password. Open
    a terminal window.


    **Step 2** Open the visual editor and prepare to create a script named Information.
    Add the contents from the following table:


    | Headings | Utilities |

    |---|---|

    | Today''s date is: | date |

    | The current users logged on the system are: | who grep $USER |

    | My current directory is: | pwd |

    | Today''s identification information is: | id |

    | The processes running on my system are: | ps |


    Echo the headings in the script in order to identify the results of the utilities.


    **Step 3** Save the script and exit to the shell. Make the script executable and
    proceed to run the Information script. Were you successful in creating and running
    the script?


    **Step 4** Redirect the output of the Information script to a file named DailyInfo
    that Dean access daily. Log off the computer.

