    ## 实验练习 11.01：压缩文件


    Jeff 在文件和磁盘空间方面遇到了一些问题。他希望你帮助他管理系统上的文件。他需要学习如何使用更少的空间并将文件发送到磁盘存储。此外，他在打印文档时也遇到了困难。你了解几种可以帮助
    Jeff 解决问题的工具。你首先教 Jeff 如何压缩文件，然后转向如何访问软磁盘。


    Jeff 提到他的 de-UNIX 系统磁盘空间快用完了。你确定他有几个大文件，他说这些文件很重要但很少使用。你将使用 `gzip` 和 `tar` 命令帮助
    Jeff 压缩这些稀少使用的文件。`gzip` 类似于 PC 的 `pkzip` 格式，它在压缩文件方面表现非常好。`tar` 允许你将多个文件放入一个文件中进行传输和存储。它可以被视为装有多个文件的盒子。


    ## 学习目标


