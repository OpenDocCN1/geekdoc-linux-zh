    for each lab, as well as the lab exercises themselves hands-on activities, and
    administration and troubleshooting questions. The labs will prepare you for possible
    real-life scenarios that you may encounter with UNIX/Linux.


    Each chapter also has five Lab Analysis questions and a Key Term Quiz that allow
