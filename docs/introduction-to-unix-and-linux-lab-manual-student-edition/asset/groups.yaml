    ## 实验练习 11.02：将文件保存到磁盘


    20 分钟


    Jeff 和大多数业务经理一样，会在家里做一些工作。目前，他无法在家里和公司之间移动文件。他转而打印文件，在输出上手写更改，并在第二天编写这些更改。这极其低效，而且成本高昂。Jeff
    希望能够将文件带回家并在家里电脑上工作。有一个限制：他更倾向于在 Windows 计算机上工作，而不是 Linux 计算机。他想知道文件如何从 UNIX 传输到
    Windows。


