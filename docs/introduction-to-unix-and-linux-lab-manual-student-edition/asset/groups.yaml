    ## Chapter 8: Specifying Instructions to the Shell


    ## Lab Exercises


    - 8.01 Identifying Portions of the Command Line

    - 8.02 Finding Utilities on the System

    - 8.03 Using Command Substitution to Write Simple Scripts

    - 8.04 Writing Wildcard Expressions

