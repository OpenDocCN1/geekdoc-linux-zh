    - 对安装了记事本的 Windows PC 的物理访问权限


    > 提示：PC 上的任何文本编辑器都可以用。此外，Macintosh 计算机也可以读写 DOS 磁盘。


    ## 开始正题


    以下步骤将允许你在 DOS 磁盘之间相互复制文件。你必须应用在 John Muster 写的《Introduction to UNIX and Linux》（McGraw-Hill/Osborne,
    2002）书中中学的知识来操作 **tools** 工具。


    **步骤 1** 格式化软磁盘。使用 `-f` 参数和相应的尺寸。

    **步骤 2** 将 chapter11 目录中所有以 k、l 或 m 开头的文件复制到软驱动器。

    **步骤 3** 列出软驱动器上的文件并验证所有文件都已复制。

    **步骤 4** 删除软驱动器上以 m 开头的文件。验证文件已删除。

    **步骤 5** 将磁盘带到 Windows 计算机。在记事本中打开几个文件。对其中一个文件进行更改。确保文件名没有 .txt 扩展名。

    **步骤 6** 回到 UNIX 计算机并将修改的文件复制到 chapter11 目录。验证文件是否仍可以读取以及更改是否生效。


    ## 实验练习 11.03：拆分大文件


    10 分钟


    Jeff 需要将一个文件传到家里电脑。然而，该文件很大，软磁盘放不下。他需要将文件拆分成碎片。你将使用 `split` 命令将文件拆分成碎片。为了让 Jeff
    编辑文件，你限制大小。


    ## 学习目标


    在本次实验中，你会将一个大文件拆分成多个文件。在实验结束时，你将能够：


    - 拆分并合并文件


    ## 实验材料与设置


    - 安装了 Red Hat Linux 7.3 的计算机

    - 在实验练习 11.01 中创建的 chapter11 11 目录

    - 至少三个可以擦写的软磁盘

    - 对 UNIX 计算机上软驱动器的物理访问


    ## 开始正题


    以下步骤将帮助你拆分大文件。你必须应用在 John Muster 写的《Introduction to UNIX and Linux》（McGraw-Hill/Osborne,
    2002）书中中学的知识来操作 `split` 工具。


    步骤 1 进入 chapter11 目录。通过重复使用命令 `cat *.conf >> big.file` 创建一个大文本文件。继续追加内容直到其达到约
    300 万字节。


    **步骤 2** big.file 的长度是多少？


    **步骤 3** 将文件拆分为若干部分，每个部分不超过 1,200,000 字节。使用 big 作为基础（前缀）。


    **步骤 4** 列出创建的文件。累加它们的大小并验证总和与 big.file 的大小相同。


    步骤 5 将每个文件复制到软磁盘。


    步骤 6 删除 big.file。


    步骤 7 对其中一个文件进行更改（首选第一个文件）。


    步骤 8 将软磁盘上的三个文件都复制回 chapter11 目录。


    **步骤 9** 重新构建文件。验证其大小是否正确。


