    LaTrina 确信 UNIX/Linux 的帮助是值得的。她已经足够熟悉使用它，可以停止骚扰你了。不幸的是，其他朋友开始向你提关于 UNIX/Linux
    的问题。许多问题非常有技术性，需要特定的答案。找到这些答案的唯一地方是网络。


    一个胜任的计算机用户总是被问题包围。你回答得越好，问题来得越频繁。这是一把双刃剑。你获得了同伴和同事的尊重和佩慕，同时也失去了生产力。


    ## 学习目标


    完成本实验后，你将能够利用互联网作为信息来源和方向查找 UNIX/Linux 问题的答案。


    ## 实验材料与准备


    完成本实验你将需要以下物品：


    - 一个可以访问互联网的 UNIX/Linux PC 账户

    - 一支笔或铅笔


    ## 开始正题


    你知道一个很好的起点是提供软件的公司的主页。因此，如果你被问到一个问题，你应该从 www.redhat.com 开始。以下是常用网站列表：


    | Linux 厂商 | 网站 |

    | --- | --- |

    | FreeBSD | www.freebsd.com |

    | Mandrake | www.mandrake.com |


    ## 实验练习 2.07：在线查找 UNIX/Linux问题的答案


    | 厂商 | 网站 |

    | --- | --- |

    | Red Hat | www.redhat.com |

    | Slack Ware | www.slackware.com |

    | SuSE | www.suse.com |

    | Sun Solaris | www.sun.com 或 docs.sun.com |


    如果厂商网站没有帮助，请尝试 www.google.com 或其他搜索引擎。将问题中的关键术输入搜索框，并检查结果。


    找到一个回答以下问题的网页。在提供的空间内写下 URL。


    - 1. 如何在我的 Red Hat 7.3 Linux 安装中配置打印机？


    - 2. 我的 Mandrake 7.0 安装支持哪些调制解调器？


    - 3. 我需要联系 FreeBSD 关于软件中发现的安全漏洞。我应该联系谁？


    - 4. KDE 的当前版本是什么？


    - 5. 哪一个好的 UNIX“新手”网站？

    Unix 概述


    ## 实验分析测试


    用短句或段落回答每个问题。可能有多个答案。


    - 1. 使用哪些实用程序来管理文件和目录？

    mv saturday week


    - 2. 哪些 UNIX 命令可以发送打印机？

    mv one answer


    - 3. 哪些实用程序可以显示内容？

    mv expected


    - 4. 在执行命令时如何使用重定向管道？

    mv pipes


    - 5. 执行 `ls` 命令会显示哪些系统目录？

    mv result of


    - 6. 如果你请求 **info**，会显示什么？

    mv node


    - 7. **man** 页面的目的是什么？

    mv request


    - 8. **help** 工具与 **info** 工具之间的区别是什么？

    mv want to


    - 9. **man** 用于搜索关键词的选项是什么？

    mv help


    - 10. **chown** 命令的作用是什么？

    mv do


    ## 关键术汇测试


    使用以下词汇术语完成下面的句子。并非所有术语都会用到。


    - apropos argument

    - b cat

    - d cd

    - info command

    - -k lp

    - keyword lpr

    - 1 option

    - man rm -i

    - n shell

    - p utility

    - u


    - 1. _________会让用户确认删除。


    - 2. _________ 是允许你向系统提供指令的程序。


    - 3. 当你输入 date 命令并按下 ENTER 时，你是在指示 shell 执行 _________.


    - 4. _________ 是为实用程序提供特定指令的选项或标记。


    - 5. 只需 _________ 命令即可切换到主目录。


    - 6. _________ 提供命令的手手册。


    - 7. _________ 工具提供了关于实用程序的深入描述。


    - 8. man 的 _________ 选项可以搜索 man 页面。


    - 9. 在 info 中，你使用 _________ 键显示上一个节点。


    - 10. Apropos 通过 _________ 搜索 man 页面。


    ## 实验总结


    计算机的主要功能之一是多个用户可以同时登录系统，但每个用户都有一个独立的默认目录来保存文件，这样就不会产生冲突。到目前，你应该已经成功地探索并使用了文件系统来创建和管理文件。你还应该熟悉用于打印、复制、移动、删除和查看文件及文件结构的实用程序。


    恭喜！你学会了如何使用 UNIX/Linux 的帮助系统。man 命令提供了 UNIX/Linux 中所有命令的技术描述。它提供了所有开关、所有参数以及每个命令的简要描述。info
    工具为每个命令提供了更好的描述。它提供了命令的英语描述，以及易于导航的界面。


    在下一个实验中，你将学习如何使用 UNIX/Linux 的多任务功能。你将学习运行多个命令、确定你的朋友正在运行哪些命令，以及停止停止响应的任务。帮助将非常有用。


    '
