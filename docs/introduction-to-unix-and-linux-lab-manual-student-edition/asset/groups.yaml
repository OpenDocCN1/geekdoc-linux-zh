    # Lab Exercise 12.04: Configuring the Internet Settings


    Jeff is convinced Linux can be used as a primary operating system. He decides
    to test Linux on his computer before making the switch. He installs Linux without
    a hitch, and everything is fine until he attempts to connect to the Internet.
    Nothing happens. You know that Linux, despite its simple installation, is not
    configured for the Internet out of the box. You will need to configure Linux to
    connect.


    > > Tip

    Consult the Introduction to UNIX and Linux textbook for instructions on installing
    Red Hat Linux 7.3.


    # Learning Objectives


    In this lab, you will connect your computer to the Internet. By the end of this
    lab, you''ll be able to:


    +   - Start the Internet connection tool

    - Configure Linux to use a proxy server to access the Internet


    > > Hint

    A proxy server is a computer that allows other computers to connect to the Internet.
    Proxy servers allow an organization to both control access to the Internet and
    protect their user computers.'
  - '[PAGE 258]


    # Lab Materials and Setup


    the materials you need for this lab are:


    +   * Computer with Red Hat Linux 7.3 installed

    * Access to the Internet

    * The IP address of your school''s proxy server

    * The root password for the computer


    > > Hint

    If you do not know your proxy or do not have a proxy, you can still complete this
    lab. Unfortunately, you will not be able to connect to the Internet.


    # Getting Down to Business


    The following steps will help you connect your computer to the Internet using
    a proxy server. You will have to apply the knowledge that you acquired in the
    Introduction to UNIX and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002)
    for working with Gnome.


    > > Hint

    You will need to get the address of the proxy server and the ports that it serves.
    Your instructor or system administrator should know these numbers. If you do not
    have an address, use 127.0.0.1 as the proxy and 80 as the port. This is the loopback
    address. Using this number will not connect you to the Internet, but will not
    interfere with your school''s network.


    **Step 1** Start the Internet Configuration Wizard.


    **Step 2** Enter the root password when prompted.


    **Step 3** Create a new Ethernet connection. Use DHCP unless your instructor tells
    you differently.


    **Step 4** Start Netscape Communicator. Set the connection preferences for the
    proxy server to point to your school''s proxy server. The proxy settings are under
    the Advanced Preferences.'
