    # 实验 5.05：修改与处理数据


    Krystin 正在尝试记录她意大利食品店的商品清单和价格。她想学习如何使用多种工具快速修改和处理 `Groceries` 文件中的数据。她请求你帮助她完成几个简单的任务。


    # 学习目标


    在练习中，你将通过使用 `cut`、`paste`、`sed` 和 `awk` 工具来修改和处理数据。完成本实验后，你将能够：


    - 在文件中剪切粘贴数据

    - 使用 `sed` 工具修改数据

    - 使用 `awk` 工具处理数据


    # 实验材料与准备


    对于本次实验，你需要：


    - 一台安装了 Red Hat Linux 7.3 的计算机

    - 铅笔和纸


    # 开始正题


    以下步骤将指导你使用 `sed` 工具进行流编辑，并使用 `cut`、`paste` 和 `awk` 工具处理数据。你必须将从 John Muster 写的《UNIX
    和 Linux 入门》（McGraw-Hill/Osborne, 2002）一书中中学的选取和替换数据的知识应用于所有工具中。


    **第 1 步** 使用你的用户名和密码登录 Linux 计算机。打开一个终端窗口。


    **第 2 步** 创建名为 `Groceries` 的文件，内容如图 5-4 所示。


    ![](img/cd36a0da6ae9e7e1a75c3ec445e7e9b0_122_0.png)


    **图 5-4** Groceries 文件内容


    **第 3 步** 在 `Groceries` 文件中，尝试使用流编辑器将所有的单词 `apples` 替换为 `oranges`。编辑器是否成功替换了所有的
    `apples` 单词？为什么成功或不成功？


    **第 4 步** 使用流编辑器删除整行 *coffee* 内容。


    **第 5 步** 指令 `awk` 工具将 *cheese* 行的第四字段打印到屏幕上。输出是什么？


    **第 6 步** 通过剪切文件每行的第一个字段来编辑 `Groceries` 文件。输出是什么？


    **第 7 步** 使用 **paste** 工具将 `Groceries` 文件的行合并在一起。确保输出中使用空格字符作为分隔符。退出计算机。


    # 实验分析测试


    1. 如何使用 `grep` 工具搜索文件但拒绝所有匹配行，并只输出不匹配的行？


    2. 命令 `sort +2 -3 +1 -2 filename` 实现了什么？


    3. `tee` 工具的作用是什么？


    4. 在编辑文件时，使用 `sed` 工具相比于 `vi` 工具有什么优势？


    5. `awk` 工具的主要功能是什么？


    # 关键词汇测验


    使用以下词汇术语完成下列句子。并非所有的术语都会被使用。


    - awk

    - bc

    - column

    - comm.

    - grep

    - sed

    - sort

    - tee

    - touch

    - tr

    - uniq

    - wc


    1. 一种读取单行并处理数据流的编辑器被称为 ________。


    2. ________ 工具设计用于定位数据库中的记录和字段，对其进行修改、执行计算，然后输出数据的选部分。


    3. 你可以使用 ________ 工具来识别多个文件中的哪一个包含特定的字符字符串。


    4. ________ 工具可以用于逐行比较文件。


    5. 你可以使用 ________ 工具搜索文件中的每个字符并删除特定字符。


    # 实验总结


    你现在应该熟悉各种 UNIX 工具了。你应该已经成功地使用了多种工具及其相关选项。通过这些工具，你对数据进行了搜索、排序、修改、合并、计算和比较并输出了结果。


    # 解


    在本部分，你将找到实验的答案。


    # 实验答案 5.01


    以下步骤将指导你统计 Katherine 文件和目录中的元素数量：


    **第 1 步** 你应该已经成功使用用户名和密码登录 Linux 计算机并打开了终端窗口。


    **第 2 步** 在主目录下，你应该执行了 `wc *` 命令，该命令会统计当前目录下每个文件的行数、单词数和字符数，并显示每个类别的总量。单词计数的结果可能取决于你当前拥有的文件。


    **第 3 步** 你应该已经打开了可视化编辑器 `pico` 编辑器，或者执行了 `cat Canada` 命令在主目录下创建一个名为 `Canada`
    的文件，并包含指定的内容。


    **第 4 步** 你应该已经执行了 `wc *` 命令来统计当前目录下每个文件的单词数。结果应该显示更新后的单词数，包含了来自 `Canada` 文件的单词数。能够成功统计
    `Canada` 文本文件中单词和字符数的命令是 `wc -wc`。该命令将参数 `-w`（单词）和 `-c`（字符）作为一个组合选项。结果应该是 113
    个单词和 65 个字符。


    **第 5 步** 另一个与第 4 步执行的 `wc -wc Canada` 命令产生相同输出（单词数和字符数）的命令是 `wc -cw Canada`。命令中参数的顺序并不重要。


    **第 6 步** 通过剪切文件每行的第一个字段来编辑 `Groceries` 文件。输出是什么？


    **第 7 步** 使用 **paste** 工具将 `Groceries` 文件的行合并在一起。确保输出中使用空格字符作为分隔符。退出计算机。


    # 实验答案 5.02


    以下步骤将指导你统计 Katherine 文件和目录中的元素数量：


    **第 1 步** 你应该已经成功使用用户名和密码登录 Linux 计算机并打开了终端窗口。


    **第 2 步** 在主目录下，你应该执行了 `wc *` 命令，该命令会统计当前目录下每个文件的行数、单词数和字符数，并显示每个类别的总量。单词计数的结果可能取决于你当前拥有的文件。


