    \ 实验材料和设置\n\n你进行实验所需的材料是：\n\n- 安装了 Red Hat Linux 7.3 的计算机\n- 你的电脑上安装了版本的 X 窗口系统\n\
    \n### 正式开始\n\n以下步骤将帮助你在 Gnome 中执行基础文件管理技术。你将不得不应用在《Introduction to UNIX and Linux》（John\
    \ Muster 著，McGraw-Hill/Osborne，2002）书中获得的知识来使用 Gnome。\n\n**步骤 1** 创建一个名为 xname的文件。\n\
    **步骤 2** 启动 X 窗口系统界面。\n**步骤 3** 启动文件管理。\n**步骤 4** 将目录重命名为 xname。\n**步骤 5** 将文件复制到\
