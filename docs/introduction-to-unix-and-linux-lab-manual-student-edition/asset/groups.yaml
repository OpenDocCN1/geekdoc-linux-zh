    The following steps allow you to customize your desktop:


    **Step 1** To change your background, you should have right-clicked the desktop
    and selected Change Desktop Background. You should have clicked the Browse button
    and browsed to your home directory. On a standard Red Hat installation, your home
    directory will be in `/home/username`. From your home directory, you should have
    selected an image file you liked as a background. You should then have desktop.
    The tiled option covers the desktop with repeated images. The centered option
    places the image in the center of your desktop, with the desktop color around
    the image. The scaled options attempt to stretch the picture to fit your screen.
    Figure 12-5 shows a background with a centered picture. You should have clicked
    OK to finish the configuration.


    **Step 2** To change your screen saver, you needed to access the panel. You should
    have selected the panel (the foot button) | Programs | Settings | Desktop | Screen
    Saver. You should then have selected the desired screen saver from the list. A
    demonstration of the screen saver was shown. You should have configured the delay
    for the screen saver and, if desired, selected a password for the screen saver.
    This setting requires the user to enter a password before resuming the session.
    Only use this if you are the sole user of a UNIX computer. When you were finished,
    you should have clicked OK.


    **Step 3** To modify your panel, you should have added icons to the Favorites
    directory. You should have right-clicked the foot button and selected Edit Menus.
    The Gnome menu editor should have appeared. You should have selected the Favorites
    menu on the left edge of your screen, clicked New Item to create a new shortcut.
    You should have then named your shortcut and entered a description for the shortcut.
    The description will appear as a tool tip when the mouse hovers over it. You should
    have entered the command to run. You should have then selected the type of link,
    the application link being the most common. Finally if desired, should have selected
    an icon for your shortcut. Figure 12-6 depicts the shortcut to the out. You should
    have clicked the Save button, then exited and finished creating icons.


    **Step 4** To create a shortcut on your desktop, you should have opened Nautilus
    by right-clicking the home icon and selecting Open. You should have browsed to
    the file or application you wished to shortcut from the desktop. You have right-clicked
    and dragged the icon to the desktop. If you did this correctly, the menu shown
    in Figure 12-7 should have appeared. You should have selected Link here to build
    the shortcut. A new icon with an arrow in the upper-right corner appeared. This
    is the link to the program.


