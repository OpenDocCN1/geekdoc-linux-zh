    \ instructions on installing Red Hat Linux 7.3.\n\n## Learning Objectives\n\n\
    In this lab, you will connect your computer to the Internet. By the end of this\
    \ lab, you'll be able to:\n\n- Start the Internet connection tool\n- Configure\
    \ Linux to use a proxy server to access the Internet\n\n> Hint\nA proxy server\
    \ is a computer that allows other computers to connect to the Internet. Proxy\
    \ servers allow an organization to both control access to the Internet and protect\
    \ their user computers.\n\n## Lab Materials and Setup\n\nthe materials you need\
    \ for this lab are:\n\n- Computer with Red Hat Linux 7.3 installed\n- Access to\
