    \ can modify the file if they know the path. Thus, setting .html files with 666\
    \ is a bad idea. The .txt and .dat files in the users directory are reasonably\
    \ safe to set with 664 (corrected). A hacker would have to know the exact path\
    \ to do any damage. You set 644 because of the manner most web servers handle\
    \ scripts by default. Thus for your scripts to be able to modify the file, they\
    \ need to allow others to write.\n\n### Learning Objectives\n\nIn this lab, you\
    \ will set permissions on files and folders. By the end of this lab, you'll be\
    \ able to:\n\n- Set permissions for a file\n- Set permissions on a directory\n\
    - Set permissions recursively\n\n### Lab Materials and Setup\n\nThe materials\
    \ you need for this lab are:\n\n- The directories and files created in Lab Exercise\
    \ 9.02\n- Computer with Red Hat Linux 7.3 installed\n\n### Getting Down to Business\n\
    \nThe following steps will help you set permissions on files and directories.\
    \ You will have to apply the knowledge that you acquired in the Introduction to\
    \ UNIX and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for setting\
    \ permissions.\n\n> **Warning**: Try to avoid setting owner permissions incorrectly.\
    \ It is often difficult to set them back to a working permission. Typically, you\
    \ need root account permissions to fix this problem.\n\n**Step 1**: Change to\
    \ the users directory. Set the permissions on all .txt and .dat files using the\
    \ chmod command. The permissions should provide the owner and others with write\
    \ ability, and the group with no access.\n\n**Step 2**: Change to the parent directory\
    \ of users. Set the permission on users. The users directory should provide the\
    \ owner and others with write ability and the group with no access.\n\n**Step\
    \ 3**: Stay in the parent directory of users. Using the chmod -R command, set\
    \ the permissions on the html and archive directories. The html directory will\
    \ have user full control, everyone else will have read and execute. The archive\
    \ directory will have full control for the owner, and everyone else will have\
    \ no access.\n\n**Step 4**: Change to each directory and perform a long listing.\
    \ Verify that the access permissions have been changed.\n\n## Lab Exercise 9.04:\
    \ Setting the umask\n\nLaTrina will need to set her permissions every day, as\
    \ new .txt and .dat files appear. You help her make the directory automatically\
    \ apply the desired rights. To ensure default permissions, you use the umask command.\
    \ umask works by telling UNIX/Linux what permissions you do not want set. Whenever\
    \ a new file is created in an unmasked directory, that file will have the correct\
    \ permissions. umask is easy to use. To set an umask, you subtract the desired\
    \ permission from 777. The resulting number is the umask. For example, if you\
    \ need 644 permission set on a directory, the umask is 777 - 644 = 133. You will\
    \ need to determine the umasks based on the permissions you set on the users in\
    \ Lab Exercise 9.03.\n\n### Learning Objectives\n\nIn this lab, you will set a\
    \ default permission level on your account. By the end of this lab, you'll be\
    \ able to:\n\n- Set the umask to ensure default permissions in a directory\n\n\
    ### Lab Materials and Setup\n\nThe materials you need for this lab are:\n\n- The\
    \ directories and files created in Lab Exercise 9.02\n- Computer with Red Hat\
