    ## 实验 9.01：根据数字定义权限


    ### 正式开始


    接下来的实验要求你描述一组文件的权限。你将需要应用 John Muster 编写的《UNIX 和 Linux 导论》（McGraw-Hill/Osborne,
    2002）一书中中学的关于数字权限操作的知识。


    步骤 1：根据下所示数字，描述并输入列表中所有者、组和其他和其他用户的权限。


    | 权限 (Permission) | 所有者 (Owner) | 组 (Group) | 其他 (Other) |

    |---|---|---|---|

    | 777 | 读、写、执行 | 读、写、执行 | 读、写、执行 |

    | 644 | | | |

    | 640 | | | |

    | 751 | | | |

    | 711 | | | |

    | 700 | | | |


    步骤 2：根据下述描述的需求，在下列表中创建并输入权限数字。


    | 需求 | 数字等效值 |

    |---|---|

    | 所有者可以读和写，组可以读和写，其他什么都不能做 | |

    | 所有者可以读、写和执行；组和其他可以执行 | |

    | 所有者可以读和写，组和其它可以读和写 | |

    | 所有者可以读和写，组和其它可以读 | |


    #### 实验 9.02：创建备份脚本


    LaTrina 维护的 Go4U 网站产生大量的文本文件。这些文件对于网站的持续维护非常重要。LaTrina 定期会将文件复制到一个单独的目录。目前她是手动处理这些操作，但希望有一个脚本来方便操作。她已经获得了主机公司的许可，可以在她的网站上编写并运行
    shell 脚本。


    你将编写一个脚本，将你目录中所有的 .txt、.dat、.html 和 .cgi 文件复制到归档目录。通过将脚本存放在命令目录中，LaTrina 可以在她网站的任何地方运行该脚本。


    ### 学习目标


    在本实验中，你将编写一个备份脚本。完成本实验后，你将能够：


    - 编写脚本

    - 使脚本变得可执行


    ### 实验材料与设置


    你本实验所需的材料有：


    - 安装了 Red Hat Linux 7.3 的计算机

    - PATH 环境变量中的命令目录


    > 提示：你可能需要创建几个文件和文件夹。你可以使用 `touch` 命令创建文件。语法为 `touch filename`，其中 `filename` 是你将创建的文件名。一次可以创建多个文件。因此，你可以一次创建几个空白的
    .txt、.dat、.html 和 .cgi 文件进行练习。


    ## 实验 9.02：创建备份脚本


    ### 正式开始


    以下步骤将帮助你创建一个名为 `archive` 的脚本，用于备份你账户下的文件。你将需要应用 John Muster 编写的《UNIX 和 Linux 导论》（McGraw-Hill/Osborne,
    2002）一书中中学的关于编写脚本、复制文件和创建目录的知识。


    **步骤 1**：如果你还没有名为 `html`、`users`、`cgi-bin` 和 `archive` 的目录，请现在使用 `mkdir` 创建它们。你需要在每个目录中放置几个文件。在
    `html` 目录中，创建几个以 .html 结尾的文件。在 `users` 目录中，创建几个以 .dat 和 .txt 结尾的文件。最后，在 `cgi-bin`
    目录中创建几个 cgi 文件。


    你应该确定将文件复制到 `archive` 目录所需的命令。该命令必须将各自目录中的所有 .txt、.dat、.html 和 .cgi 文件复制到相应的目录。在复制文件之前，使用
    `cd` 切换到实际目录是有帮助的。使用绝对路径是一个好主。（注：此处 OCR 文本似乎破碎，已根据逻辑流重构）。


    > **警告**：请确保你使用的是 `cp` 命令而不是 `mv` 命令。


    - **步骤 2**：进入命令目录。

    - **步骤 3**：使用你喜爱的文本编辑器创建一个名为 `archive` 的新脚本。

    - **步骤 4**：在脚本中编写你确定的命令。

    - **步骤 5**：使用 `chmod` 命令使此脚本变为可执行。

    - **步骤 6**：运行脚本。切换到 `archive` 目录并验证所有文件都已复制。


    > 提示：测试脚本的小部分是一个好主意。在尝试处理 .dat 文件之前，先验证你能够复制 .txt 文件。分段编写脚本有助于减少与脚本相关的挫败感，并保证脚本可以运行。


    ## 实验 9.03：设置文件和文件夹的权限


    ### 正式开始


    在你处理 LaTrina 的网站工作时，你发现她的许多文件权限是错误的。你建议 LaTrina 修改她几个文件的权限。`html` 和 `cgi-bin`
    目录中的所有文件都应该是可读可执行的。`archive` 目录应该只允许文件所有者读取或修改。`users` 目录需要所有者和其他人读写。这是通过使用 `chmod`
    命令完成的。


    > **警告**：将文件设置为 666 有点危险。这意味着如果有人知道路径，任何人都可以修改该文件。因此，将 .html 文件设置为 666 是一个坏主意。`users`
    目录中的 .txt 和 .dat 文件设置为 664（已修正）是安全的。黑客必须知道确切路径才能造成任何破坏。你设置 644 是因为大多数网络服务器默认处理脚本的方式。因此，为了让你的脚本能够修改。


    ### 学习目标


    在本实验中，你将设置文件和文件夹的权限。完成本实验后，你将能够：


    - 设置文件的权限

    - 设置目录的权限

    - 递归设置


    ### 实验材料与设置


    你本实验所需的材料有：


    - 实验 9.02 创建的目录和文件

    - 安装了 Red Hat Linux 7.3 的计算机


    ### 正式开始


    以下步骤将帮助你设置文件和目录的权限。你将需要应用 John Muster 编写的《UNIX 和 Linux 导论》（McGraw-Hill/Osborne,
    2002）一书中学的关于设置权限的知识。


    > **警告**：避免错误设置文件权限。通常你需要 root 账户权限来解决这个问题。


    **步骤 1**：进入 `users` 目录。使用 `chmod` 命令设置所有 .txt 和 .dat 文件的权限。权限应该允许所有者和其他读写，组没有访问权限。


    **步骤 2**：进入 `users` 的父目录。设置 `users` 的权限。`users` 目录应允许所有者和其他读写，组没有访问权限。


    **步骤 3**：留在 `users` 的父目录。使用 `chmod -R` 命令设置 `html` 和 `archive` 目录的权限。`html` 目录将拥有用户所有权，其他人可读执行。`archive`
    目录将拥有所有者所有权，其他人没有访问权限。


    **步骤 4**：进入每个目录并执行长格式列表。验证权限已更改。


    '
