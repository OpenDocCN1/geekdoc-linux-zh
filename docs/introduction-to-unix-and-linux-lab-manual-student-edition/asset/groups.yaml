    ## Lab Exercise 13.03: Solving User Problems


    One of the new developers, Zach, was working on a program that added an entry
    to the .bash_profile file. Unfortunately, the program was bad and his .bash_profile
    was deleted. Zach asks if you can get this back.


    Artie needs your help: he accidentally printed a very large binary file and changed
    the permissions on his home directory to ooo. We would like you to fix these problems.


    You will solve three common problems. You will resolve Zach''s problem with a
    cp command. Artie''s two problems require the use of lpq to see the contents of
    the print queue, lprm to delete from the queue, and chmod to reset permissions
    on the file.


    ## Learning Objectives


    In this lab, you solve common user errors. By the end of this lab, you''ll be
    able to:


    - Recover a user''s .bash_profile file

    - Manage the print queue


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - Access to the root account

    - The users artie and zach, created in Lab Exercise 13.02

    - The capability to pause the printer


    ## Getting Down to Business


    The following steps guide you in solving common user errors. You will have to
    apply the knowledge you acquired in the Introduction to UNIX and Linux textbook
    by John Muster (McGraw-Hill/Osborne, 2002) for changing permissions and managing
    a print queue.


    ## Lab Exercise 13.03: Solving User Problems


    **Step 1** You need to set up the computer to have some problems. These steps
    are merely to allow you to practice solving problems. Pause the printer by either
    turning it offline or powering it down. Verify that the printer is down by entering
    the command `lpr /etc/hosts`. Log in as artie. Execute the print command `lpr
    /bin/rpm/` to send a large binary file to the printer. Enter `cd ..` to get to
    the parent of your home directory. Enter the command `chmod ooo artie`. Perform
    a long listing to verify that you have no permissions on the artie directory.


    **Step 2** Log in as `root`.


    **Step 3** Copy the file `.bash_profile` from the artie account to the zach account.
    Using `chown`, change the ownership of the `.bash_profile` to zach.


    **Step 4** Check the print queue. Remove any jobs by artie.


    **Step 5** Change to the `/home` directory. Change the permissions on Artie''s
    directory.


    ## Lab Exercise 13.04: Making a Linux Boot Disk


    After moving the server to your office, you are unable to locate the boot disk
    made when the server was installed. The boot disk allows you to boot the server
    if the boot partition of your hard drive goes bad. You decide to create a new
    boot disk.


    ## Learning Objectives


    In this lab, you will create a boot disk. By the end of this lab, you''ll be able
    to:


    - Make a Linux boot disk


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - A blank floppy disk

    - Access to the root account

    - The kernel build number for your version of UNIX


    ## Getting Down to Business


    > Hint

    > Do not execute this command in the GUI. Gnome will automatically mount your
    drive, making the mkbootdisk utility fail. If you are in the command prompt and
    receive an error stating that the volume is mounted, execute unmount /dev/fd0
    to unmount your floppy disk.


    **Step 1** List the directories in the /lib/modules directory. The directory with
    the highest numbers is your current build.


    **Step 2** Run the **mkbootdisk** command with the build number. Insert a disk
    when prompted.


    **Step 3** Run the **mdir** command to see the Linux boot files. Leave the disk
    in the drive and reboot the system.


    ## Lab Exercise 13.05: Installing the Apache Web Server


    Zach and Artie are writing some web pages and would like a web server to allow
    testing of the pages. They ask you to install the Apache web server, which comes
    with Red Hat Linux.


    You will install the Apache web server from the Red Hat CD. You will need to mount
    the drive, then run `rpm` to start the installation process.


    ## Learning Objectives


    In this lab, you will install the Apache server. By the end of this lab, you''ll
    be able to:


    - Mount a CD

    - Install Apache from the CD


    ## Lab Materials and Setup


    The materials you need for this lab are:


    - Computer with Red Hat Linux 7.3 installed

    - Access to the `root` account of your server

    - Disk 2 of the Red Hat 7.3 installation CDs


    ## Getting Down to Business


    The following steps will help you install the Apache Web Server. You will have
    to apply the knowledge that you acquired in the Introduction to UNIX and Linux
    Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for working with the
    command prompt.


    **Step 1** Insert the CD and mount the drive.


    **Step 2** Change to the `RedHat/RPMS` directory on the CD.


    **Step 3** Install all applications associated with Apache.


    **Step 4** Point your web browser on a different computer to the IP address of
    your computer. It should respond with a web page stating “It Worked”.


    ## Lab Analysis Test


    1. Why is it a bad idea to perform your daily tasks as superuser?


    2. Why do you need to mount the CD before installing applications?


    3. You gave the users zach and artie the password of secret. Most likely, your
