    # 术语测验


    使用以下词汇完成下列句子。并非所有术语都会被用到。


    - exit (退出)

    - graphical window (图形窗口)

    - login banner (登录横幅)

    - login name (登录名)

    - password (密码)

    - root (根)

    - Teletype device (电字机设备)

    - terminal (终端)


    - 1. 登录名为 ________ 的账户是用于管理系统的账户，它对系统事件和操作具有权限。

    - 2. 只有当用户提供了 ________ 与系统上已建立的用户匹配的密码时，才允许进入 UNIX/Linux 系统。

    - 3. 启动 UNIX/Linux 计算机后，通常会在终端或图形窗口中看到一个 ________ 欢迎。

    - 4. 以大写字母输入登录名或密码会导致电脑将你的终端视为一个 ________。

    - 5. `exit` 命令是一个 UNIX/Linux 消息，结果会导致终端窗口关闭。


    # 实验总结


    Linux 计算机的主要功能之一是多个用户可以同时登录系统。现在你已经完成了此实验，你应该已经成功登录了 Linux 计算机，并且熟悉了可以使用 Linux
    配置的各种桌面环境。你还应该通过在输入登录名和密码时故意出错来测试 Linux 系统的安全性。由于这些错误，Linux 安全机制应该已经了对系统的访问。


    # 答案


    在本节，你将找到实验练习的答案。


    # 实验解答 1.01


    帮助 Matthew 熟悉登录过程以及图形和终端窗口应涉及以下步骤：


