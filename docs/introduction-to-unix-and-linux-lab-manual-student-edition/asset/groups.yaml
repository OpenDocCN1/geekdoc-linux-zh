    # Lab Exercise 6.03: Creating a Complex Word Analysis Script


    Rolf wants to create a script that will analyze his latest newspaper article about
    the price of gasoline. He wants to sort through the text, give a reading of how
    many duplicate words exist in the article, remove the duplicate words. He wants
    to save the results of this analysis to a separate file for later viewing.


    # Learning Objectives


    In this exercise, you create a complex word analysis script. After you complete
    this lab, you will be able to:


    - Create a long text file

    - Remove punctuation and make characters lowercase

    - Alter the display of lines


    # Lab Materials and Setup


    For this lab exercise, you''ll need:


    - Computer with Red Hat Linux 7.3 installed

    - Pencil and paper


    # Getting Down to Business


    The following steps guide you in creating a complex word analysis script. You
    will have to apply the knowledge that you acquired in the Introduction to UNIX
    and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for removing punctuation,
    making all characters lowercase, and sorting and removing lines of text.


    **Step 1** Log on to the Linux computer with your username and password. Open
    a terminal window.


    **Step 2** Create and save a new text file called Gasoline that consists of the
    following content:


    Gas rises only half a penny a gallon in the past two weeks, continuing an unusual
    20-week trend of mostly steady prices.


    The average price for gas nationwide, including all grades and taxes, was about
    $1.46 a gallon on Friday, according to a survey of 8,000 stations released Sunday.
    That was up .5 cents per gallon from Aug. 9. Prices have shown little change since
    early April, when a gallon of gas also cost about $1.46.


    Step 3 Create an analysis script called TestScript that completes the following
    tasks for the Gasoline file:


    - a) Remove punctuation

    - b) Make all characters lowercase

    - c) Put each word on a single line

    - d) Remove blank lines

    - e) Sort the text to put all lines containing the same word on adjacent lines

    - f) Remove duplicate words from the text

    - g) List most-used words in the file first

    - h) Send the output of this script to a file named ScriptResult


    Step 4 Verify that the script was created successfully. Make the TestScript executable.
    Run the script.


    Step 5 Open the ScriptResult file and verify that the contents match what was
    asked for in the TestScript script. Log off the computer.


