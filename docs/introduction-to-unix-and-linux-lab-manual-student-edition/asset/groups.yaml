    ## About the Authors


    **Catherine Creary** is an independent technical trainer, entrepreneur, and author.
    She currently holds a Bachelor of Education, MCT, MCSE, MCSA, and MDCBA. Catherine
    has more than 12 years of experience in the field of education. She is the author
    of Network+ All-in-One Lab Manual (McGraw-Hill/Osborne, 2002), MCSE Windows XP
    Professional Lab Manual, Student Edition (McGraw-Hill/Osborne, 2002), numerous
    training courses (Digital Think), an Exchange 2000 columnist (www.OutlookExchange.com),
    and several articles regarding cross-border employment for IT personnel. She has
    extensive experience in computer training, including development of adult education
    computer courses and curriculum design.


    **Lee M. Cottrell** has been teaching networking, hardware, and computer programming
    at the Bradford School in Pittsburgh for eight years. In addition to teaching,
    Lee advises students, maintains the school''s networks and computer equipment,
    and writes curricula for ten Bradford Schools. He is the author of Windows 2000
    Directory Services Administration Lab Manual, MCSE Windows 2000 Server Lab Manual,
    and several Instructor''s Manuals.


    Lee graduated magna cum laude from the University of Pittsburgh with a Bachelor
    of Science in Pure Mathematics. Afterward, he enrolled in the Pitt Graduate School
    of Education and received a Professional Certificate and certification to teach
    mathematics in Pennsylvania high schools. Most recently, he completed a Master
    of Science in Information Science from the University of Pittsburgh. Lee can be
    reached at lee_cottrell@hotmail.com.


