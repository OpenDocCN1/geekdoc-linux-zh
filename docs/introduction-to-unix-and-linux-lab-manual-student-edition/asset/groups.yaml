    # Chapter 7: Creating and Changing Directories


    This chapter explores the hierarchical file system and directory structure by
    navigating through, managing, and creating new directories. Up until now, you
    have been creating files and saving them in your home directory. On a UNIX/Linux
    computer, files are stored in different directories depending on the system and
    user.


    You will create directories and subdirectories, and explore the process of changing
    from one directory to a remote directory or subdirectory. You will also access
