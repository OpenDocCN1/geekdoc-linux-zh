    ## 实验练习 11.04：按所有者删除文件


    Jeff 不得不解雇名为 Bob 的员工。Bob 对被解雇并不愉快，所以在离开之前在 UNIX/Linux 系统上做了一些花招。他在其他用户的目录下留下了几个文件，其中包含粗俗和不适当的图片和文字。Jeff
    想要删除这些文件。由于他正在考虑法律行动，他需要为律师保存这些文件，同时为了用户删除这些文件。一个大问题是权限。Bob 将文件的权限设置为 755，允许所有人读取和执行权限，但拒绝了用户删除文件的权限。


    Jeff 知道 root 可以删除文件，但他不想在每个用户的目录下寻找名为“bob”的文件。他询问是否有方法可以通过用户名搜索整个磁盘结构。为了帮助 Jeff
    解决问题，你教了他 `find` 命令的精要之处。


    ## 学习目标


    在本次实验中，你将在伙伴的家目录下放置几个文件。然后你的伙伴将找到这些文件并删除它们。在实验结束时，你将能够：


    - 使用 `find` 命令按用户名定位文件

    - 按用户名删除文件


    ## 实验材料与设置


    此实验所需的材料有：


    - 安装了 Red Hat Linux 7.3 的计算机

    - root 账户访问权限

    - 两个普通用户账户


    > 提示

    > 这是一个适合与伙伴一起运行的实验。伙伴 A 可以将其目录权限设置为 rwx，允许伙伴 B 在其目录下放置文件。然后伙伴 A 可以以 root 身份搜索文件，并删除他看到的文件。如果无法找到伙伴，请创建一个替代伙伴
    B 的账户。


    ## 开始正题


    以下步骤将帮助你在用户账户中放置几个文件，然后用 `find` 命令找到它们。你将需要应用 John Muster 编写的《Introduction to
    UNIX and Linux》（McGraw-Hill/Osborne, 2002）书中关于使用 `find` 工具的知识。


    - 步骤 1 以伙伴 A 登录。进入家目录的父目录。记录当前的权限设置。将你的目录设置为 rwx 权限。

    - 步骤 2 伙伴 B 现在创建几个文件并将它们保存在伙伴 A 的目录中。

    - 步骤 3 以 root 登录。

    - 步骤 4 运行 find 命令查找所有属于伙伴 A 的文件。使用家目录的父目录作为起点。

    - 步骤 5 使用 exec 选项将文件 cat 到名为 bobfiles 的文件中。输出中包含目录。

    - 步骤 6 使用 find 的 ok 选项删除伙伴 A 的文件。ok 与 exec 类似，不同之处是在执行操作前会提示你批准。

    - 步骤 7 验证伙伴 B 创建的所有文件已从伙伴 A 的目录中删除。伙伴 A 现在应该将权限恢复到原始状态。


    ## 实验练习 11.05：为打印格式化文档


    20 分钟


    Jeff 维护着一份员工电话列表。随着内容的变化，他会为员工打印出来。他更倾向于双列输出并跨列排序，而不是按列排序。他希望有一个显示为 *September
    Phone List* 的标题并包含页码。他询问如何在 UNIX/Linux 中实现这一点。


    此操作在 Word 中很容易，但在 UNIX/Linux 中稍微复杂一些。你需要使用 **sort** 命令，将其重定向到 **pr** 命令，然后重定向到
    **lp** 命令。真正棘手的部分是 **pr** 命令。在这里你需要几个选项来生成正确的输出。


    你将花费大部分时间学习如何使用 `pr`。一旦 `pr` 正确，你会将 `sort` 重定向到 `pr`。最后，当输出正确时，你将其重定向到你选择的打印机。


    > ✔ 提示

    > 参考 `pr` 的 man pages 以确定合适的选项。


    ## 学习目标


    在本次实验中，你将打印格式化文档。在实验结束时，你将能够：


    - 使用 `pr` 格式化输出

    - 使用 `lp` 打印到打印机

    - 链式输出


    ## 实验材料与设置


    此实验所需的材料有：


    - 安装了 Red Hat Linux 7.3 的计算机

    - 一个包含姓名和电话的文件

    - （可选）打印机访问权限


    ## 开始正题


    以下步骤将引导你使用 pr 格式化文件。你将需要应用 John Muster 编写的《Introduction to UNIX and Linux》（McGraw-Hill/Osborne,
    2002）书中关于使用 pr 的知识。


    - 默认情况下，你的 UNIX/Linux 计算机将打印到几台打印机之一。可能会使用 /etc/printcap 中的第一项。如果你需要更改打印机，将需要使用
    lp 的 -P 选项。例如，如果你想打印到 LaserJet4 打印机，将使用 `lp LaserJet4` 命令。

    - 如果你没有打印机，只需使用命令代替 lp 命令即可。


    步骤 1 使用以下数据创建一个名为 phonelist 的文件：


    | bob 999-5555 | debbi III-III |

    | carole 999-6666 | laurie 222-2222 |

    | adam 777-8888 | heather 333-3333 |

    | joyce 999-9999 | lise 444-4444 |

    | bev 999-0000 | steve 555-5555 |

    | bob 999-1111 | joanne 666-6666 |

    | tom 999-2222 | linda 777-7777 |

    | art 999-3333 | barb 888-8888 |

    | rose 999-4444 | amy 999-9999 |

    | robert 999-7777 | |


    步骤 2 使用 pr 格式化文件。


    步骤 3 设置输出为双列。需要哪些选项？


    步骤 4 将标题改为 List。哪部分头部？


    步骤 5 将日期改为 September。需要哪些选项？


    步骤 6 让输出双倍行。需要哪些选项？


    步骤 7 排序并重定向到 pr 命令。


    步骤 8 使用 pr 命令跨列排序。需要哪些选项？


    步骤 9 将整个命令重定向到 lp 命令。


    ## 第11章：管理、打印和归档大文件


    ## 实验分析


    - 1. gzip 或 compress 的压缩效果更好？

    - 2. 如果对压缩的文件使用 gzip，文件大小会发生什么变化？为了确定这一点，重命名文件去掉 .Z，然后使用 gzip。

    - 3. Jeff 的账户下有几个 tar 文件。其中一个是 feather.tar。Jeff 如何查看 feather.tar 的内容？

    - 4. 为什么 Linux 开发者提供了读取 Windows 格式磁盘的能力，而微软没有提供读取 Linux 磁盘工具？

    - 5. 你使用 find 确定了安装应用程序更改的文件。这种行为如何被认为是不道德的？


    ## 术语测试


    使用以下词汇完成下面的句子。并非所有术语都会被使用。


    - cat

    - compress

    - find

    - gunzip

    - gzip

    - lp

    - pr

    - sort

    - split

    - tar

    - uncompress


    - 1. _________ 工具创建一个包含多个文件的文件。

    - 2. 为了打印准备文档（包括页码和头部），可以使用 \_ 工具。

    - 3. 将大文件拆分为若干个小文件，_ 工具很有用。

    - 4. \_ 工具产生一个具有 .Z 扩展的新文件。

    - 5. 在计算机上搜索文件可以使用 \_ 命令。


    ## 实验总结


    你对账户的文件进行了压缩以节省空间，并学习了如何通过磁盘带带回家。这些文件在 Windows 计算机上是可以修改的。无法放入磁盘带的大文件通过 **split**
    命令拆分成合适大小的块。重新组合它们只需要使用 **cat** 命令。你帮助 Jeff 删除了不满员工留下的痕迹。最后，你帮助他从 UNIX 计算机创建了漂亮的输出。


