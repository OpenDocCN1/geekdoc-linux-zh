  md: '# Chapter 1: Logging On to the System


    UNIX/Linux computers can serve many users at the same time. Each user must have
    an account that uniquely identifies them on the system. An administrator must
    create a unique account for each user so they can be granted secure access to
    the system. Then the user can enter their unique login name that is associated
    with their account, and the password that matches that login account. If the information
    is correctly entered into the system, the user will be granted access. If an error
    is made upon entering the login name or password, the user will be refused access
    to the computer.


    This chapter examines the process of logging on to a Linux system. You will successfully
    log on to a system and view the terminal window and graphical window environments
    that Linux provides. You will test the login process by entering login information
    incorrectly and observe how Linux responds to login errors. You will also research
    the Internet for careers that require knowledge of UNIX/Linux systems, versions
    of UNIX/Linux that are available, and use of each system in today''s society and
    business world.


    20 MINUTES


    # Lab Exercise 1.01: Logging On to a Linux System


    Matthew has recently installed Red Hat Linux 7.3 on his laptop computer. He has
    never used the Linux operating system before, but is very familiar with several
    Windows operating systems. He'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'needs to familiarize himself with the login process and both the graphical
    and terminal win-dows that are available to him once he logs on to the system.


    # Learning Objectives


    In this lab, you will be logging on to a Red Hat Linux 7.3 computer. By the end
    of this lab, you''ll be able to:


    +   - Log on to a Linux system

    - Examine the graphical window environment

    - Start and activate a terminal window

    - Log off a Linux system

    - Test incorrect login errors


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - Computer with Red Hat Linux 7.3 installed with a graphical window environment

    - Pencil and paper

    - Password for the root login account


    # Getting Down to Business


    These steps guide you in logging on to a Linux system, testing login errors, and
    viewing the graphical environment. You will also have to apply the knowledge that
    you acquired in the Introduction to UNIX and Linux textbook by John Muster (McGraw-Hill/Osborne,
    2002) for start-ing and activating a terminal window.


    **Step 1** From your Linux computer, enter the **root** login account at the login
    banner prompt. Were you prompted for a password?'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1: Logging On to the System


    > **Warning**nIt is unwise to use the administrative root login account except
    for specific tasks, and then only very carefully. However, for the purposes of
    this lab you will simply be learning the log on and log off process and you will
    not be administering the system in any way.


    **Step 2** Enter the associated password for the root account that you established
    during the installation of the operating system. Did the password appear on the
    screen? Were you able to successfully log on to the system?


    > **Hint**nYou should receive a warning message on the screen regarding using
    the root login account.


    **Step 3** At the desktop of your Linux computer, observe the icons, menus, and
    programs that are available. Start and activate a terminal window. What text appears
    in the terminal window?


    **Step 4** Exit the terminal window. Log off the Linux computer.


    **Step 5** Log on to the Linux computer in the graphical environment with the
    login name of Matthew and the password of wrkwr. Were you successful in logging
    on to the system? Why or why not? Note any error message that appears.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Lab Exercise 1.02: Exploring UNIX and Linux


    60 MINUTES


    # Lab Exercise 1.02: Exploring UNIX and Linux


    Ann is using a Linux computer for the first time. She comes from a Windows background
    and is unsure of how learning Linux will help in her job search. She is unaware
    of the uses for UNIX/ Linux and the versions of each system that are currently
    in use in her city and around the world. She has asked for your help in researching
    the Internet to acquire knowledge on these topics.


    # Learning Objectives


    In this exercise, you explore the uses of UNIX/Linux systems through browsing
    the Internet. After you complete this lab, you will be able to:


    +   - Identify career opportunities requiring UNIX/Linux

    - Identify uses for UNIX/Linux systems

    - Identify different versions of UNIX

    - Differentiate between UNIX, Linux, and DOS commands


    # Lab Materials and Setup


    For this lab exercise, you''ll need:


    +   - Computer with Red Hat Linux 7.3 installed

    - Access to the Internet with a web browser

    - Pencil and paper


    # Getting Down to Business


    The following steps guide you in exploring the uses of UNIX and Linux in today''s
    society.


    **Step 1** Log on to the Linux computer using the **root** account and password.


    **Step 2** Open a web browser and search the Internet for careers that require
    knowledge of the UNIX or Linux operating systems. List your results in the space
    provided.'
  merge: -1
