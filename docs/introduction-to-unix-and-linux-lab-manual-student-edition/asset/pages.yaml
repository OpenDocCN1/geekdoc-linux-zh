  md: 'In previous chapters, you worked with the command line. You learned the traditional
    UNIX/Linux interface. In this chapter, you will work with the GUI capabilities
    of UNIX. UNIX/Linux variants of the X Window System (X11) program to provide GUI
    functionality for the user.


    You will use the Gnome version of the X Window System. Gnome was installed by
    default in your Linux installation. In this chapter, you will perform basic file
    management tasks. You will learn to customize you desktop settings. This includes
    background images and links. Finally, you will configure your computer to connect
    to the Internet.


    +   20 MINUTES


    # Lab Exercise 12.01: Performing File Management Tasks


    Jeff likes the stable operating system that UNIX provides, but he dislikes the
    command-line interface. He wants to use UNIX with a graphical user interface (GUI),
    like Windows. He feels if Linux had a viable GUI, he could use it as a primary
    OS in the company, and save the company millions in software costs.


    You decide to teach Jeff how to use the X Window System implementation that is
    on his computer. You will show him how to manipulate his files, change his desktop
    settings, run some built-in applications, and create separate desktops.


    You will start Jeff''s exploration of the X Window System interface with some
    file management techniques. You will show him how to rename files, copy files
    and directories, delete files, and utilize the trashcan. The skills are similar
    to those used in a Windows interface, so Jeff should catch on quickly.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Lab Exercise 12.01: Performing File Management Tasks


    # Learning Objectives


    In this lab, you will use the X Window System to manage files. By the end of this
    lab, you''ll able to:


    +   - Start the X Window System interface on your UNIX system

    - Start Nautilus or another file manager

    - Copy, rename, and delete files and directories


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - Computer with Red Hat Linux 7.3 installed

    - A version of the X Window System installed on your computer


    # Getting Down to Business


    The following steps will help you perform basic file management techniques in
    Gnome. You will have to apply the knowledge that you acquired in the Introduction
    to UNIX and Linux text- by John Muster (McGraw-Hill/Osborne, 2002) for using Gnome.


    **Step 1** Create a directory called xpractice. In this directory, create three
    text files called x1, x2, and x3. Feel free to **touch** or copy other files.
    Also, place a .jpg or other image file onto a floppy disk. This file will be used
    in this and other exercises.


    **Step 2** Start the X Window System interface on your system.


    **Step 3** Start the file management system.


    **Step 4** Rename the directory called xpractice to xname.


    **Step 5** Copy the file `/etc/lpd.conf` to the xname directory.


    **Step 6** Delete the files x1, x2, and x3.


    **Step 7** Change the file permissions on `lpd.conf` to full control for the owner,
    and everyone else read and execute.


    **Step 8** Move an image file from the floppy disk to your home directory.'
  merge: -1
  pgno: 252
