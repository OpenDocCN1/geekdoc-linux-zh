  md: '# # Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    # ## Lab Solution 2.01


    Helping Jo to familiarize himself with the shell and create a new file should
    have involved the following steps:


    +   **Step 1** You should have logged on to the Linux computer using the **root**
    administrative login account and password. This account gives you the authority
    to create additional user accounts.


    +   **Step 2** You should have opened the **User Manager** console by selecting
    it from the **System** menu on your Linux computer.


    +   **Step 4** In order to save the user account created for yourself, you should
    have clicked the **OK** button and then closed the **User Manager** console and
    logged off the computer. This will prepare you to test the user account that you
    created by logging back on to the computer using your new username and password.


    +   **Step 5** You should have successfully logged on to the computer using the
    new user account and password that you created for yourself. If you were unsuccessful
    at logging on, make sure that you typed the information correctly at each prompt.
    If still unsuccessful, you can log back on to the computer using the administrative
    **root** account, and recreate or edit the user account to correct any errors.


    +   **Step 6** The terminal window prompt should indicate your user login account.
    This will help you recognize when you search for files, you are searching in the
    correct home directory. After issuing the `ls` command, you should have found
    that there were no files present in your current directory.


    +   **Step 7** The correct command to issue at the prompt that would create a
    file named `work_schedule` containing the calendar for the month of November 2002
    would be:


    ```

    cal 2002 > november_work_schedule

    ```


    The **calendar** utility is used to create a result for the eleventh month (November)
    of 2002. This result is directed to a file titled `november_work_schedule`.


    +   **Step 8** You should have issued the `ls` command to ensure that the `november_work_schedule`
    file was created. The filename should appear listed at the prompt.'
  merge: -1
