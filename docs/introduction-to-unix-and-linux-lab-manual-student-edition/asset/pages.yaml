    username and password and opened a terminal window from the panel.


    **Step 2** You should have typed the **pwd** command, which provides you with
    your current location (presenting working directory) in the file system.


    **Step 3** You should have typed the **mkdir** command, to create a subdirectory
    named Sales. It will be a subdirectory of your personal home directory.


    **Step 4** You should have typed the **cd** Sales command to change from your
    current location in the file system to the Sales subdirectory. You should have
    successfully changed to the new subdirectory.


