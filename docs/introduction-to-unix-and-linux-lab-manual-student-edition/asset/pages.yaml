- img_proc: true
  md: '# Lab Exercise 10.02: Terminating Jobs


    Jeff has had some experience with programs that crash or become unstable. He needs
    to know how to terminate these processes. The command to terminate processes is
    **kill**. As you are aware of now, the **kill** command, along with the appropriate
    switch, sends a signal to the process that tells it to terminate. By default,
    the **kill** command sends a software termination signal, which tells the program
    to stop running. When using the **kill** command in conjunction with the -9 switch,
    the -9 switch has the license to kill any command. Be wary of using -9 it will
    stop all processes, and not let the process clean up after itself or gracefully
    shut down. Thus if a process opened a file, and it was killed with a -9, the file
    may not be closed properly and the data that was changed in the file will be permanently
    lost.


    In this lab, you will practice using the **kill** command to stop other commands
    that you have started. To prepare for the lab, you will start several commands
    and place them in the background. Once the commands are in the background, you
    will terminate the process. You will need to run through the **kill** switches
    until you find one that terminates the command. Run **ps** to get the process
    (PID) to kill and to verify that the utility was terminated.


    # Learning Objectives


    In this lab, you will place jobs in the background and terminate jobs. By the
    end of this lab, you''ll be able to:


    +   - Kill your own processes

    - Place jobs in the background


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - Computer with Red Hat Linux 7.3 installed


    # Getting Down to Business


    The following steps will guide you in starting several commands to gain practice
    killing commands. You will have to apply the knowledge that you acquired in the
    Introduction to UNIX Linux textbook by John Muster (McGraw-Hill/Osborne, 2002)
    for terminating commands.'
  merge: -1
  pgno: 210
