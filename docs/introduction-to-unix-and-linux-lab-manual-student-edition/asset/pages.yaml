    # Lab Solution 9.01


    The following steps allow you to translate to and from numeric permissions to
    a description of the permission:


    Step 1


    | Permission | Owner | Group | Other |

    |---|---|---|--|

    | 777 | read, write, execute | read, write, execute | read |

    | 644 | read, write | read | read |

    | 640 | read, write | read | nothing |

    | 751 | read, write, execute | read, execute | execute |

    | 711 | read, write, execute | execute | execute |

    | 700 | read, write, execute | nothing | nothing |


