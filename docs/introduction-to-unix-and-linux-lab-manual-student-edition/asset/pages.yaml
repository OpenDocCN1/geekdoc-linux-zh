    # Getting Down to Business


    The following steps will help you set permissions on files and directories. You
    will have to apply the knowledge that you acquired in the Introduction to UNIX
    and Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for setting permissions.


    > **Warning**

    Try to avoid setting owner permissions at o. It is often difficult to set them
    back to a working permission. Typically, you need root account permissions to
    fix this problem.


    **Step 1** Change to the users directory. Set the permissions on all .txt and
    all .dat files using the **chmod** command. The permissions should provide the
    owner and others with write ability, and the group with no access.


    **Step 2** Change to the parent directory of users. Set the permission on users.
    The users directory should provide the owner and others with write ability and
    the group with no access.


    **Step 3** Stay in the parent directory of users. Using the **chmod -R** command,
    set the permissions on the html and archive directories. The html directory will
    have user full control, everyone else will have read and execute. The archive
    directory will have full control for the owner, and everyone else will have no
    access.


    **Step 4** Change to each directory and perform a long listing. Verify that the
    access permissions have been changed.'
