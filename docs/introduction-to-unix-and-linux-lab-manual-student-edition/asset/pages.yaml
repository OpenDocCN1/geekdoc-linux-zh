    command. As in Figure 2-2, issuing the **dir** command will verify that the Sales.date
    file has been created in the subdirectory.


    **Step 6** You should have typed either the **cd** or **cd /** / command to change
    from your current location in the Sales subdirectory back to your home directory.
    The **cd** command will always take you directly to your home directory, whereas
    the **cd /** / command will take you to the root directory of the file structure
    in which you are currently located. You should have verified that the change occurred
    by typing the **pwd** command.


