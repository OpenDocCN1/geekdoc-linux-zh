    # Lab Solution 10.01


    The following steps allow you to create and kill processes:


    Step 1 The correct switches needed for ps are displayed in the table.


    | Desired Output | ps Switch Needed |

    | All processes root and users | -A, -e, or aux |

    | User details about the process | u |

    | Specific processes | -u username |

    | All user processes | au |

    | Running commands only | -r |


    To solve the problems, you needed to use ps and a variety of switches. Figures
    10-1 through 10-3 show typical output.


    Step 2 You should have executed ps to list your processes.


    Step 3 You should have executed ps u to list details about your processes. Figure
    10-1 displays output for ps and ps u.


    Step 4 You should have executed ps -A | more to list all user processes. Figure
    10-2 shows sample output of the ps -A command.


    Step 5 You should have executed ps -A u to list details for all user processes.


    Step 6 You should have executed ps -u ao bob, where bob is the username, to see
    processes and details for any job related to bob. Your output should be similar
    to Figure 10-3.


    Step 7 You should have executed ps -r to see running processes for all users.


    > Hint There are several undocumented ps switches. The switches j, l, s, and t
    all provide different output, and are probably not listed in your man pages. Try
    them and discover what they do.'
