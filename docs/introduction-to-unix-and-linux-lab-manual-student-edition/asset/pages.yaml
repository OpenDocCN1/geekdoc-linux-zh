  md: 'Lab Exercise 10.05: Using nohup to Run Processes After Logging Out 199


    20 MINUTES


    # Lab Exercise 10.05: Using nohup to Run Processes After Logging Out


    LaTrina has another question. She needs a program on the web site to run all the
    time. Currently, the only way she knows to keep the programming running is to
    stay logged in. She knows it is possible for a regular (non-root) account to specify
    that a command runs in the background, after the user logs out. A command to solve
    this problem is the **nohup** command. **nohup** will keep a program running even
    after you log out. **nohup** is short for “no hang.” The syntax is **nohup** command
    &.


    > > Tip\ nohup command originated when users needed modems to connect to a UNIX
    computer. To save on costs, nohup allowed the users to dial in, start a process,
    disconnect, and reconnect several hours later when the process should have completed.
    nohup has stuck around despite the reduced dependency on dial-in accounts.


    # Learning Objectives


    In this lab, you will use **nohup** to keep a command running after logging out.
    By the end of this lab, you''ll be able to:


    +   - Compile a C++ program

    - Use the **nohup** command


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - Computer with Red Hat Linux 7.3 installed

    - A C++ compiler, or the compiled version of **runforever.exe**.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Getting Down to Business


    The following steps will guide you in running a program using the nuhup command.
    You will have to apply the knowledge that you acquired in the Introduction to
    UNIX and Linux text-book by John Master (McGraw-Hill/Osborne, 2002) for using
    nuhup.


    If you do not have access to the compiled version of runforever.exe, you will
    need to create it. Create a text file runforever.cpp with the following code.
    Run the command c++ -o runforever.exe runforever.cpp. When you have entered the
    code correctly, runforever.exe will execute. Nothing will appear on the screen.


    ```

    #include <iostream.h>

    void main()

    {

    int x = 7;

    while(x <= 7);

    }

    ```


    +   * Step 1 Create or acquire the program runforever.exe.

    * Step 2 Use nuhup and the & to execute runforever.exe.


    +   Step 3 Log out and log back in as another user. List all user processes. runforever.exe
    should be running. If desired, kill the job by logging back in as the user that
    created the process and use the kill command.


    > If you are using a shared UNIX implementation, you should kill the job after
    you are finished. Most system administrators consider leaving useless programs
    in RAM quite rude.'
