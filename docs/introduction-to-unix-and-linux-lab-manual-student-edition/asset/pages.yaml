  md: '# Chapter 9: Setting File and Directory Permissions


    10 MINUTES


    # Lab Exercise 9.03: Setting Permissions on Files and Folders


    While you were working on LaTrina’s site, you noticed that many of her files had
    the wrong permissions. You suggest to LaTrina that she modify permissions on several
    of her files. All files in the html and cgi-bin directories should be readable
    and executable. The archive directory should allow only the owner of the file
    to read or modify the archived files. The user directory needs the owner and others
    to read and write the files.


    You need to set the permissions on LaTrina’s files. This is accomplished using
    the `chmod` command. `chmod` can change permissions on files and directories.
    You will need to specify the permission number for each.


    > Warning Setting files at 606 is a bit dangerous. This means that anyone can
    modify the file, if they know the direct path. Thus, setting .html files with
    the 606 permission is a bad idea. The .txt and .dat files in the users directory
    are reasonably safe to set with 606. You have written the scripts that maintain
    these files. A hacker would have to know the exact path to the file to do any
    damage.


    You set 606 because of the manner most web servers handle scripts by default.
    You run your scripts as the user nobody, which is not in the other group. Thus
    for your scripts to be able to modify the file, they need to allow others to write.


    # Learning Objectives


    In this lab, you will set permissions on files and folders. By the end of this
    lab, you’ll be able to:


    +   - Set permissions for a file

    - Set permissions on a directory

    - Set permissions recursively'
  merge: -1
