  md: '# Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    # Lab Solution 11.01


    The following steps allow you to practice using the compression utilities on a
    UNIX/Linux system:


    +   **Step 1** You should have created the directory with **mkdir** chapter11,
    then changed to the directory with the command **cd** chapter11. You should have
    copied the desired files with the command **cp /etc/*.conf** .. You should then
    have listed the files to verify that the files are copied.


    +   **Step 1** To determine the size of **pine.conf**, you should have entered
    **ls -l pine.conf**. On a test system, for example, the size is 14,566 bytes.


    +   **Step 2** You should have compressed the file with **compress pine.conf**.
    After compression, the size on the above test system was 7,512 bytes.


    +   **Step 3** You should have uncompressed the file with the command **uncompress
    pine.conf**.


    +   **Step 4** To compress with gzip, you should have run **gzip pine.conf**.


    +   **Step 5** After gzipping the file, the size on the test system was 5,010
    bytes.


    +   **Step 6** **gunzip** will unzip this file. The command you should have used
    is **gunzip pine.conf**.


    +   **Step 1** To list the files, you should have entered **ls -l *.conf**. Figure
    11-1 shows the three files on the test system. Their total size is 1,303 bytes.


    +   **Step 2** To create the archive, you should have entered the command **tar
    -c -f conf.tar *.conf**. The -f switch creates a new archive. -f conf.tar *.conf
    is the list of files to include. Alternatively, you could have listed the three
    files instead of the wild-card command.


    +   **Step 3** The size of the .tar archive is 10,240 bytes. It is bigger because
    the **tar** command adds information to the file about directory and file listing.'
