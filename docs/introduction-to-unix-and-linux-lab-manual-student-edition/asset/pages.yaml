  md: '# Lab Exercise 13.03: Solving User Problems


    **Step 1** You need to set up the computer to have some problems. These steps
    are merely to allow you to practice solving problems. Pause the printer by either
    turning it offline or powering it down. Verify that the printer is down by entering
    the command `lpr /etc/hosts`. Log in as artie. Execute the print command `lpr
    /bin/rpm/` to send a large binary file to the printer. Enter `cd ..` to get to
    the parent of your home directory. Enter the command `chmod ooo artie. Perform
    a long listing to verify that you have no permissions on the artie directory.


    **Step 2** Log in as `root`.


    **Step 3** Copy the file `.bash_profile` from the artie account to the zach account.
    Using `chown`, change the ownership of the `.bash_profile` to zach.


    **Step 4** Check the print queue. Remove any jobs by artie.


    **Step 5** Change to the `/home` directory. Change the permissions on Artie''s
    directory.'
