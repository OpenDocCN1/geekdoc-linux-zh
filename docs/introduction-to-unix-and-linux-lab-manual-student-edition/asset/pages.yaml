  md: '# Chapter 2: Touring the System


    Working on a UNIX/Linux computer usually involves creating and saving files that
    are important to your business. In order to successfully organize these files,
    you must understand how the system responds to commands. This chapter examines
    the process of interacting with the shell in Linux by executing utility commands
    to change directories and filenames, remove and copy files, and display file contents.


    By the end of this chapter, you will have successfully explored and managed the
    file system through working with several utilities and interacting directly with
    the shell.


    In the second part of this lab chapter, you will sharpen your help skills. LaTrina
    has asked you to help her learn more UNIX. She understands that you have a life
    outside of her web site. She asks you to teach her how to use the help system
    on UNIX so she can attempt to answer her own questions. You reply that the help
    system is composed of several pieces. man pages provide the technical details
    of a command, with little verbiage. The info utility accesses a large document
    providing details and clear explanations of a command. Both are useful in obtaining
    help in UNIX.


    30 MINUTES


