- img_proc: true
  md: '# Chapter 10: Controlling User Processes


    In the previous chapters, you created several jobs. Every UNIX/Linux command becomes
    a job. In this chapter, you will learn how to manage these jobs. You will learn
    how to list running jobs for yourself and all users. In addition you will learn
    how to kill, suspend, and reactivate jobs for yourself and other users. Finally,
    you will learn how to keep a job running even after you log out of the system.


    20 MINUTES


    # Lab Exercise 10.01: Listing Running Jobs


    Jeff needs to learn how to watch what his employees are doing on the system. He
    also needs to kill jobs he finds undesirable. Finally, he has a piece of software
    that he needs to run all the time, even when he is logged out. Your mission is
    to help Jeff resolve his problems using UNIX.


    You will show Jeff how to master the multitasking features of UNIX. These features
    allow users to work with multiple commands. The feature is a bit clunky when compared
    to Windows, but does work well once you are familiar with the keystrokes.


    After teaching Jeff the basics of UNIX, you start on his first problem: listing
    the jobs on the system. The ps utility is reasonably complex and has several switches,
    some of which are not listed in man. You start by teaching Jeff to list his processes,
    and then gradually move up to listing processes of various individual users.


    # Hint


    This lab works best on a system with multiple users running processes. If you
    are working on a standalone system, create several users and switch to them. To
    switch to users, log in as one user. Then use the command su username to switch
    to the user called username. Perform this action several times before completing
    the lab.'
  merge: -1
  pgno: 207
