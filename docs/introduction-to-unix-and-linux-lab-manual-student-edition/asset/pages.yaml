  md: '# Chapter 9: Setting File and Directory Permissions


    You have mastered working with the command line and entering commands. Along the
    way you learned how to write simple shell scripts. In this chapter, you will learn
    how to set permissions on a file and directory. You will write a script that archives
    a series of files and will set a global permission mask, called an umask.


    15 MINUTES


    # Lab Exercise 9.01: Defining Permissions Based on Number


    LaTrina has a problem. Some of her web services and pages are not running. She
    is getting permissions errors in Internet Explorer. She does not know why these
    programs will not run; they at her old site. In addition to this problem, she
    needs a way to archive data on her site. You immediately suspect she has a permissions
    problem. You agree to help her and teach her some basic UNIX permissions along
    the way.


    The command to fix most of LaTrina''s problem is chmod, which changes the mode
    (file permissions) on a file. True UNIX users use the numeric parameters for chmod
    rather than the letter equivalents. In this exercise, you will practice reading
    and setting permissions.


    # Learning Objectives


    In this lab, you will identify permissions on files. By the end of this lab, you
    will be able to:


    +   - Convert numeric permissions to letter permissions

    - Create numeric permissions based on need


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - Pencil and paper'
  merge: -1
