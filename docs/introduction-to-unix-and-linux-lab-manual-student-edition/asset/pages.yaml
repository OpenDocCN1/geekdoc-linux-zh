  md: '# Introduction


    Welcome to the Introduction to UNIX and Linux Lab Manual that accompanies your
    Introduction to UNIX and Linux (xiv, 2002). This lab manual is organized into
    chapters that map to the study guide. There may be several lab exercises per chapter.


    Each chapter includes a chapter introduction, a materials list, and setup instructions
    for each lab, as well as the lab exercises themselves hands-on activities, and
    administration and troubleshooting questions. The labs will prepare you for possible
    real-life scenarios that you may encounter with UNIX/Linux.


    Each chapter also has five Lab Analysis questions and a Key Term Quiz that allow
    you to demonstrate your knowledge of the material covered in the chapter. Finally,
    the chapter concludes with a brief summary of the key points. Step-by-step solutions
    to the lab exercises are found at the end of each chapter.


    # IN THIS LAB MANUAL


    This lab manual provides the necessary exposure and training you''ll need to master
    UNIX or Linux. Topics that are covered:


    +   - Using UNIX/Linux utilities

    - Creating files with the Visual Editor

    - Getting help in UNIX/Linux

    - Writing shell scripts

    - Managing files and directories

    - Setting file permissions

    - Using the X Window System

    - Using the multitasking features of UNIX/Linux

    - Administering UNIX/Linux users


    After the completion of this lab manual, you will have a better understanding
    of the UNIX/Linux infrastructure and be capable of managing its daily operations.


    # Lab Exercises


    Understanding the theory behind networking and UNIX/Linux principles is important
    for a network administrator. The question is, can you transfer this knowledge
    to a system situation?'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    Each lab exercise allows you to apply and practice a particular concept or skill
    in a real-world scenario.


    # CASE STUDIES


    Each objective is presented as a case study. They provide a conceptual opportunity
    to apply your newly developed knowledge.


    # LEARNING OBJECTIVES


    Working in hand with the study guide, one objective is to help you understand
    UNIX/Linux. The second objective is to have you develop critical thinking. In
    networking, not all installations, reinstations, or network system problems present
    themselves in the same way each time. To this end, you need to be able to analyze,
    consider your options and the result of each option, and select and implement
    that option. If it works, great; if it doesn''t, you start over again.


    # LAB MATERIALS AND SETUP


    To fully accomplish each lab, it is necessary that the hardware and software requirements
    be below met. If this is not possible, then read through the steps and become
    familiar with the procedures as you can.


    The shots and directions in this book correspond to Red Hat Linux 7.3. All of
    the exercises can be performed on a workstation installation of Red Hat. Most
    likely, other versions of UNIX/Linux will work with the steps presented. Typically,
    only minor changes are evident between versions.


    Your computer must be compatible with Red Hat or another version of Linux. Most
    likely, your computer is compatible. For Red Hat verification, see www.redhat.com
    for the complete Hardware Compatibility List. The following lists the minimum
    supported specifications for Red Hat Linux 7.3. More RAM and a faster processor
    will result in a better Linux system.


    +   32MB of RAM

    80386 processor or higher

    VGA monitor or better

    Mouse or other pointing device

    4x or faster CD ROM

    One or more hard drives with a minimum of 4GB free space

    Network card (optional)

    Dial-up or LAN connection to the Internet'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# GETTING DOWN TO BUSINESS


    The hands-on portion of each lab is step by step, not click by click. Steps provide
    explanations and instructions, walking you through each task.


    # Lab Analysis Test


    These are questions to quickly assess your comprehension of what you''ve learned
    in the study guide and each lab in the chapter. The answers should be in your
    own words. This shows that you''ve synthesized the information and you have a
    comprehensive understanding of the key concepts.


    # Key Term Quiz


    These are technical words that you should be able to recognize, and you should
    know their definitions and purpose. This will help you on the job.


    # Solutions


    Each chapter provides solutions for the Lab Exercises. These solutions are meant
    to compare your lab procedures with the correct lab procedures. If you are familiar
    with UNIX/Linux, you will find that in certain parts of the lab exercises there
    is more than one way to accomplish the step. The end result—and understanding
    the process to reach that end result—is the main objective.'
  merge: -1
