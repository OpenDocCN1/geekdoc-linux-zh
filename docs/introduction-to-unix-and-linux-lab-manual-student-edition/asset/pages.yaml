  md: '# Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    # Lab Solution 5.01


    The following steps should guide you in counting the elements in Katherine''s
    files and directory:


    +   **Step 1** You should have successfully logged on to the Linux computer with
    your username and password and opened a terminal window.


    +   **Step 2** At your home directory, you should have issued the `wc *` command,
    which counts the number of lines, words, and characters for each file in your
    current directory and displays a total for each category. The result of the word
    count may vary depending on what files you currently have


    +   **Step 3** You should have opened the visual editor, `pico` editor, or issued
    the `cat Canada` command to create a file in your home directory named Canada
    with the indicated contents.


    +   **Step 4** You should have executed the `wc *` command to count the number
    of words for each file in your current directory. The result should have indicated
    an updated number of words to include the word count from the Canada file. A command
    that would successfully count the number of words and characters in the Canada
    text file would be `wc -wc`. This command presents the arguments `-w` (words)
    and `-c` (characters) as a combined option. The result should have been 113 words
    with 65 characters.


    +   **Step 5** An additional command that produces the same output (number of
    words and characters) as the `wc -wc Canada` command executed in Step 4, would
    be the `wc -cw Canada` command. The order of the arguments in the command have
    been reversed, but for the output for the command would be the same as the words
    and characters of the Canada file that are regardless of what order arguments
    are presented.


    +   **Step 6** You should have executed the `ls | wc` command. This command counts
    words in the output from the list of files in the current directory. The word
    count is generated from the output of the `ls` utility. The first lists all files
    in the current directory. The listed output is piped to the `wc` utility for further
    processing. The `wc` utility counts the lines, words, and characters that comprise
    the list. The `wc` utility does not read and counts the contents of each listed
    file. It simply reads the list of files and generates a count from the list.


    +   **Step 7** You should have counted the number of lines in the Canada file
    and saved the output to a file named LineCount in your home directory by executing
    the command `wc -l Canada > LineCount`. To view the contents of the LineCount,
    you should have executed the command `cat LineCount`.'
