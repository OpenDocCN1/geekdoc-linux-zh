- img_proc: true
  md: '# Solutions


    In this section, you''ll find solutions to the Lab Exercises.


    # Lab Solution 1.01


    Helping Matthew to familiarize himself with the login process, as well as the
    graphical and terminal windows, should have involved these steps:


    +   Step 1 After entering the root login account at the login prompt, a second
    prompt will appear, asking you to enter the associated password for the login
    account.


    +   Step 2 The associated password for the root login account will vary according
    to each system. This password should have been established during the installation
    of your Linux operating system. This password will not appear on the screen as
    you type in a terminal window; however, a series of asterisks will appear in the
    graphical window, representing the password that you type. After successfully
    entering the correct associated password, Linux will log you out onto the system
    and the desktop environment will be displayed.


    +   Step 3 You should have started a terminal window by selecting and clicking
    on the monitor icon that is present on the panel. The terminal window should have
    appeared and you should have activated the terminal by clicking your mouse anywhere
    in the terminal window. You should be greeted by a prompt in the terminal window
    that contains your login account.


    +   Step 4 You should have exited the terminal window by typing exit at the prompt.
    The terminal window should have closed, leaving you the graphical window environment.
    You should have chosen the log off selection from the menu and successfully logged
    off the system.


    +   Step 5 Because the Matthew account and associated password do not exist in
    the system, you should have been denied access. You should have received an Authentication
    Failed message and the login field should reappear.


    # Lab Solution 1.02


    The following steps should guide you in exploring the UNIX and Linux operating
    systems:


    +   Step 1 You should have successfully logged on to the Linux computer using
    the root account and password.


    +   Step 2 You should have opened a web browser and found that some of the careers
    that require knowledge of the UNIX or Linux operating systems include UNIX/Linux
    administrators, programmers, developers, scripters, analysts, engineers, trainers,
    instructors, and so on.'
  merge: -1
  pgno: 27
- img_proc: true
