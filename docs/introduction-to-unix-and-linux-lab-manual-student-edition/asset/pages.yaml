    # # Lab Exercise 11.01: Compressing a File


    Jeff has some problems with files and disk space. He would like you to help him
    manage the files on his system. He needs to learn how to use less space and send
    files to disk for storage. In addition, he is having trouble printing his documents.
    You know several utilities that can help Jeff with his problem. You begin by teaching
    Jeff how to compress files, then move on to accessing a floppy disk.


    Jett mentioned that his de-UNIX system is running out of disk space. You have
    determined that he has several large files which he says are important but rarely
    used. You will help Jeff compress these rarely used files, using the commands
    gzip and tar. gzip is similar to the PC''s pkzip format. It does a very nice job
    compressing files. tar allows you to place several files into one file for transport
    and storage. It can be thought of as a box that holds several files.


    # # Learning Objectives


    In this lab, you will use UNIX compression utilities. By the end of this lab,
    you''ll be able to:


    +   - Compress a file using gzip and compress

    - Uncompress a file using unzip and uncompress

    - Condense files using tar

    - Compress files using tar'
