  md: '# Solutions 111


    b) grep -v Canada Canada


    The -v option rejects all lines that match the target string and outputs all other
    lines.


    c) grep -i Canada


    The -i option tells the grep utility to ignore the case while searching for the
    target string.


    d) grep ''can you'' Canada


    The multiple-word string is contained in quotes to produce the correct result.


    e) grep ''c.n'' Canada


    The ''c.n'' string indicates a three-character string that begins with the letter
    c and ends with the letter n.


    f) grep ''^As'' Canada


    The ''^As'' string indicates a target string that begins with the letter s.


    g) grep ''$'' Canada


    The ''$'' string indicates a line that ends with the letter t.


