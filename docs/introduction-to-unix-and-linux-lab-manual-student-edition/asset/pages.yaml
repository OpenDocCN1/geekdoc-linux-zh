  md: '# Lab Wrap-Up


    One of the main features of a Linux computer is that several users can be logged
    on to the system at the same time. Now that you have completed this lab, you should
    have successfully logged on to a Linux computer and you should be familiar with
    the various desktop environments that are configurable with Linux. You should
    also have tested the security of a Linux system by committing errors when entering
    a login name and password. Linux security should have prevented access to the
    system as a result of these errors.'
  merge: -1
