    # Lab Solution 8.04


    In this lab, you worked with three of the wildcards in UNIX. The character * can
    replace any character or number of characters. For example, a* lists files a,
    ab, abc, abcd, and so on. The ? matches any one character. For example, ??? will
    find any three-letter filename. It will not find filenames with two or four characters;
    only three characters are returned. [] denotes a list of characters that can be
    used or a range of characters. [a-f] is all letters from a to f [aeiou] includes
    the letters aeiou only.


    | Command | Description of Wildcard | Example Files |

    |---|---|---|n| Is a* | All files that begin with a | apple, Andrew, a.out |

    | Is duke*. | All files that begin with duke and end with .doc | dukeCity.doc,
    dukeWayne.doc, duke.doc |

    | Is *.jpg | All files that end with .jpg | lee.jpg, lizzie.jpg, Christopher.jpg
    |

    | Is ???.jpg | All three-letter files that end with .jpg | lee.jpg, dad.jpg, mom.jpg
    |'
