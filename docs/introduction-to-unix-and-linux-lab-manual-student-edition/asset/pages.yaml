    his novel. The Novel text file combines all chapters of the Novel Sam has written
    to date. He would like to explore the command mode of the vi editor and navigate
    through the Novel file, searching for text to possibly delete by the excessive
    length of the file.


    # Learning Objectives


    In this lab, you explore the visual editor by working in an existing file. By
    the end of this lab, you''ll be able to:


    +   * Activate the visual editor

    * Operate in command mode'
