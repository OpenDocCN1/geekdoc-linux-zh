  md: '# Chapter 9: Setting File and Directory Permissions


    10 MINUTES


    # Lab Exercise 9.04: Setting the umask


    LaTrina will need to set her permissions every day, as new .txt and .dat files
    appear. You help her make the directory automatically apply the desired rights.
    To ensure default permissions, you use the umask command. umask works by telling
    UNIX/Linux what permissions you do not want set. Whenever a new file is created
    in an unmasked directory, that file will have the correct permissions. umask is
    easy to use. To set an umask, you subtract the desired permission from 777. The
    resulting number is the umask. For example, if you need 644 permission set on
    a directory, the umask is 777 - 644 = 133. You will need to determine the umasks
    based on the permissions you set on the users in Lab Exercise 9.03.


    # Learning Objectives


    In this lab, you will set a default permission level on your account. By the end
    of this lab, you''ll be able to:


    +   - Set the umask to ensure default permissions in a directory


    # Lab Materials and Setup


    The materials you need for this lab are:


    +   - The directories and files created in Lab Exercise 9.02

    - Computer with Red Hat Linux 7.3 installed


    # Getting Down to Business


    The following steps will set a default permission on your directories. You will
    have to apply the knowledge that you acquired in the Introduction to UNIX and
    Linux textbook by John Muster (McGraw-Hill/Osborne, 2002) for working with umask.


