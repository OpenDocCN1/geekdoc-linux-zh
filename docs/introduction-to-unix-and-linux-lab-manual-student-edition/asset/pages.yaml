  md: '# Chapter 3: Touring Utilities, Shell Instructions, and Processes


    In the previous chapters, you learned how UNIX/Linux computers use several utilities
    to locate system and user data and files. Once these files were located, you used
    utilities to manipulate the data. Manipulation of these files can be expanded
    by additional powerful utilities.


    This chapter examines utilities that read input from files, changes the data that
    they read, and then sends the changed data to your screen, a file, or another
    utility. In the following labs, you instruct the shell where to connect input
    and output, employ special characters in command lines, and modify the user environment
    by customizing programs to meet your needs. You also change a password, and create
    and execute shell scripts to learn basic programming.


    30 MINUTES


    # Lab Exercise 3.01: Employing Powerful Utilities


    Sam is writing a novel and wants to organize the first three chapters he has written
    to ensure they meet the specifications written in his contract. He wants to obtain
    a line, word, and character count of center chapter files. He also needs to concatenate
    several chapter files to make sure the plot of the novel flows smoothly from chapter
    to chapter. To help him search through them quickly, Sam would benefit from the
    ability to locate specific lines in a file, but he doesn''t know how to do so.
    He has asked for your help in learning the capabilities of several Linux utilities.


    # Learning Objectives


    In this lab, you organize a number of files on a Linux computer by employing powerful
    utilities. By the end of this lab, you''ll be able to:


    +   - Create a text file'
