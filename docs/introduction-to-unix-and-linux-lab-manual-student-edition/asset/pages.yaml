  md: '# Lab Wrap-Up


    One of the main features of a Linux computer is that several users can be logged
    on to the system at the same time, but each user has a separate default directory
    in which to save their files so that no overlapping exists. By now, you should
    have successfully explored and worked with the file system to create and manage
    files. You should also be familiar with several utilities to help print, copy,
    move, remove, and view your files and file structure.


    Congratulations! You have learned how to use the help system in UNIX/Linux. The
    man command provides the technical description of every command in UNIX/Linux.
    It provides all switches, all parameters, and a little description of each. The
    info utility provides a better description for each command. It provides an English
    description of the command, as well as an interface that is easy to navigate in.


    This knowledge will serve you well in the workplace. An employee who can learn
    on or or her own is a much-desired employee. Since you know how to use man and
    info, you will be less likely to need technical support or guidance. This makes
    you efficient and cost-effective, which are both good traits for all employees.


    In the next lab, you will learn how to use the multitasking features of UNIX/Linux.
    You will learn how to run multiple commands, determine what commands your friends
    are running, and how to stop jobs that have stopped responding. Help will be of
    great use.'
  merge: -1
