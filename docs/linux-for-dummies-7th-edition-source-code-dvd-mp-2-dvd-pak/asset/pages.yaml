  md: '# 192 Part III: Getting Up to Speed with Linux


    # Creating files and folders


    To create a new file or folder in Konqueror:


    +   1. Browse to the folder you want to create the item in.

    2. Right-click inside that folder.

    Make sure that you didn''t highlight anything in there. A context menu appears.

    3. Choose Create New.

    A submenu appears.

    4. Depending on what you want to accomplish, choose either Folder or one of the
    File or Document options.


    These commands do the following:

    * Folder: Creates a new folder in this directory.

    * Text File: Creates a plain text file.

    * HTML File: A Web page.


    +   5. In the query dialog box, enter the name for the folder or file you''re
    creating.

    6. Click OK to finish the creation process.


    # Opening files and running programs


    To open a file or run a program in Konqueror, single (KNOPPIX) or double-click
    it (Linsphere and Mandriva). That''s it! Well, not entirely, Konqueror itself
    may not support the file format. You can also right-click to open a file in the
    context menu and choose the Open With menu. From there, you can choose one of
    the suggested options in the context submenu, or you can choose Other to access
    the Open With dialog box. To use this dialog:


    +   1. Either browse in the lower section to select which program you want to
    use this file, or type the full path to the application (the full directory path,
    /usr/bin/konqueror) in the text box.

    2. If you need to browse the filesystem, click the little folder icon to the right
    of the text box to open the browser.

    3. If you want to always use this application to open files of this type, check
    the Remember application association for this type of file check box.

    4. Click OK to open or run the file.'
