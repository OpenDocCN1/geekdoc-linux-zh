  md: '# # Chapter 11


    # # Checking Out the Linux Filesystem


    **In This Chapter**


    +   - Discovering the root directory and subdirectories

    - Discerning partitions from directories

    - Adding removable media to the filesystem

    - Caring for your filesystem

    - Accessing shared files on Windows computers


    > I have an existential map. It has “You are here” written all over it.


    > — Steven Wright


    One of the most frustrating things about mastering a new operating system can
    be figuring out where it keeps files. Instead of keeping all system files in a
    single directory, such as the C:\Windows directory in Microsoft Windows, Linux
    follows the lead of its Unix cousins and spreads them out a bit more. Although
    the Linux and Windows setups involve different methods, they are both logical,
    although it may not feel that way until you understand where to look.


    Another issue you come across is adding new media — hard drives, floppy disks,
    CD-ROMs, DVD-ROMs, zip disks, and more — to the existing filesystem. In this chapter,
    I focus on how the filesystem is organized and other handy topics, such as how
    to access data on a floppy disk. In Chapter 10, you can find on how to do this
    when looking through the file managers.


    # # Introducing the Linux Filesystem


    Linux may be by itself on your hard drive, or maybe it''s sharing your hard drive
    with another operating system, such as Microsoft Windows. All the hard drive space
    you allocated for Linux during the installation process is the'
  merge: -1
