    Typically, the defaults are all you want to choose. If you want to format the
    disks for Linux, use the Linux Native (ext2) format. To share disks with Windows
    users, choose DOS (FAT). Another setting you may want to choose is Thorough rather
    than Quick.


    # Care and Feeding of Your Filesystem


    Regardless of which operating system you''re using, you need to keep your filesystem
    healthy and happy. Everything that you need to operate the machine and do your
    work (or play) on exists in that filesystem. Keep it in good shape, and it''s
    sure to treat you in return. Fortunately, Linux does most of it automatically
    for you.


    # If your machine fails to reboot


    If your machine didn''t shut down cleanly (a nice euphemism meaning that it crashed
    or you shut the power without properly shutting the machine down, as discussed
    in Chapter 5), the system checks the filesystem if necessary at boot, taking the
    need to do this out of your hands. Usually the system is able to boot normally
    after such an event. If something went really wrong, this unnerving prompt tells
    you to enter your password or press Control-D to continue. If this prompt appears,
    type your root (administrative) password, press Enter, and then follow these steps.
    Don''t worry; more often than not, you can actually fix this problem.'
