    # Line and filling bar


    The line and filling toolbar is directly below the standard toolbar in a default
    OpenOffice.org setup. As usual, you can remove the object bar at any time by using
    the View menu. This series of icons allows you to click buttons and expand drop-down
    list boxes that represent presentation-software functions, such as arrow styles,
    colors, line styles, and other formatting instructions. Most features on this
    bar are identical to what you see in modern presentation programs.


    # View switchers


    Just above your document see a series of tabs, each which takes you to a particular
    way of viewing your slide(s). Table 17-5 outlines the available views and what
    you find in them.


    | Table 17-5 | Available OpenOffice.org Impress Views, in Alphabetical Order |

    | View | What you find |

    | Normal | Individual slide view in which you can add art to your slide. |

    | Handout | Six slides per page, as you might print for handouts. |

    | Master | Individual slide view in which you can apply master formatting that
    will apply to all slides. Access this by selecting View>Master. You have the option
    in the Master submenu of choosing either Slide Master to view the master slide,
    Notes Master to view the master page, or Master Elements to assign the information
    that is made available in the Master views. |

    | Notes | Individual slide view in which you can see a small version of the slide
    plus your notes about that slide. |

    | Outline | All-slides with the slides listed in order for easy stepping through.
    Along the side, the slides are shown in thumbnail mode in a separate window as
    you navigate. |

    | Slide Sorter | All-views with as many slides packed as possible in columns and
    rows. Re-ordering slides is as simple as dragging where you want to go and then
    dropping them. |'
