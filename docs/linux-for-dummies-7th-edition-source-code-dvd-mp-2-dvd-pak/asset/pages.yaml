- pgno: 339
  md: '# 320 Part IV: Getting Things Done


    # Your document


    The tabbed window contains your document. In Normal view, document is your slide.
    You will need to click one of the tools in the Drawing Bar (discussed in the next
    section) in order to be able to enter any content. To add more slides before or
    after this, right-click over the document area and select Slide::New Slide. You
    can use the layouts in the Tasks pane to change their setup.


    OpenOffice.ress supports the following file formats (and more): its own OpenDocument
    presentation format (.ODP), StarOffice Imp’s format (.SXF), Microsoft PowerPoint
    97, 2000, and XP (.PPT or .PPS).


    # Drawing bar


    Beneath the window is a drawing toolbar, which allows you to select lines, arrows,
    shapes, and more for your presentation creation needs. Most of these buttons have
    downward-pointing arrows, which allow you to see the full range of features they
    offer.


    # Fine Art with OpenOffice.Org Draw


    Whether you’re an aspiring graphic artist or just need a tool that lets generate
    simple graphics for use on their own, in a presentation, or elsewhere, OpenOffice
    Draw provides a host of drawing functions. If nothing else, it’s a whole lot of
    fun to play! Not everything in life has to be practical.


    # Starting it up


    To start OpenOffice Draw in the distributions I cover in this book, do the following:


    +   Fedora Core: There is no direct menu access to the Draw program in Fedora
    Core 5. Instead, open one of the other OpenOffice.org tools and select File::New::Draw
    if you want to create a new drawing. You can open an existing OoO Draw document
    by double-clicking in your file manager or choosing File::Open in another OOO
    tool and selecting that.


    +   Knoppix: From the Main Menu, choose Office::OpenOffice.org::


    +   Linlibre: Choose Launch::Run Programs::Business & Finance::OpenOffice::OpenOffice
    Drawings.'
  merge: -1
  img_proc: true
