    # Saving your work


    As with most programs, you have two choices for saving your work. You can save
    your work and keep going or save it and then close the program. To just save the
    file and keep going, follow these steps:


    +   1. Click the Save button.

    This button looks like a floppy disk. If you haven''t ever saved this file, clicking
    it opens the Save As dialog box.


    +   2. Choose one of the folders in the Save In Folder drop-down list to save
    your file into, or click the right-facing arrow next to Browse For Other Folders
    to open the file browsing section.


    The dialog box allows you to browse to the location you want to use.


    +   3. If necessary, browse through the directories in the left or right pane
    until you''re in the directory where you want to save the file.


    Double-click the name of a directory to enter it or double-click the entry in
    the left pane to jump to its location first.


    +   4. Type the file''s name in the Name text box.


    +   5. Click Save to save the file.

    The dialog box closes.


    To close gedit, follow these steps:


    +   1. Choose File; Quit.

    If you haven''t saved this file since the last time you changed it, the Question
    dialog box appears.'
