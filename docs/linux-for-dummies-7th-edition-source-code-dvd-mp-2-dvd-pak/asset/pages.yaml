  md: '# 362 Part IV: Getting Things Done


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_381_0.png)


    **Figure 19-4:

    A VMware window containing Windows XP, but running in Linux.


    A minus to VMWare is that it requires a bit of extra something in your system.
    Check out its requirements and then try to go as far **above** them as you can.
    It also runs in a self-contained window. A plus, though, is that this program
    really is the next best thing to buying another computer.


    # # Installing and Using Wine


    And then there''s Wine (www.winehq.org), a complete rebuild of Windows functionality
    that runs under Linux. Wine is in many ways the mother of everything in the previous
    section. However, because it''s free and very complicated project, it''s not quite
    as friendly as the commercial versions. It''s kind of like the others but with
    all the makeup and hairspray removed.'
