  md: '# 26 Part I: Getting Your Feet Wet


    # Making space


    You may have unallocated space — less than 10GB of it — or may have none at all.
    Either way, you have to rearrange the data on your hard drive(s) to make room
    for Linux, unless you decide to add a second hard drive to the machine. If you
    are installing SuSE or Mandriva, these distributions can handle the resizing for
    you, so users of Linux versions are welcome to skip ahead to the section "Double-Checking
    Hardware Compatibility." Everyone is encouraged to stay right where you are and
    keep reading.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_45_0.png)


    Keep in mind that you may actually want more than 10GB of space. For example,
    if you download lots of multimedia, you''ll eat up that space fast! In case, 10GB
    might be a better amount to shoot for —


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_45_1.png)


    If it turns out you have free/unallocated space in more than one spot on your
    hard drive (between various partitions), add this space and see how much the total
    is. You can move things around if you have to; it''s a matter of resizing the
    partitions.


    If you don''t have any free/unallocated space, then you''ll definitely have to
    resize your partitions. The key to doing this is (first) to determine how much
    of your drive you''re really using.


    +   In Windows XP and 2000, you can figure out how much of your Windows partitions
    are actually empty by looking at the Capacity, Free Space, and columns in the
    Computer Management tool.


    +   If you''re browsing a venerable Windows 98 and 95 machine back to dual-boot
    life, use the Computer Management tool this:


    +   1. Double-click My Computer to open the Computer Management tool.


    +   2. Choose View: Web Page.


    +   3. Highlight your first drive.

    You seem like what is shown in Figure 2-5.


    Determining how much space is enough for your Windows setup — you don''t want
    to shrink it so that you run out of space in Windows! — also involves a look at
    how you use your machine. Again, if you download and save a lot of multimedia
    stuff, it''s wise to keep enough room around to accommodate your downloading habit.


    If you find that your Windows drives are all too full (or you download and save
    too many audio, video, or graphics files), it may be time to burn some of your
    files onto CDs so you can delete them from your hard drive.'
