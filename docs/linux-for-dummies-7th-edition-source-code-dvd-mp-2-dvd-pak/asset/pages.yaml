    # Spreadsheets with OpenOffice.Org Calc


    Some people like to balance their checkbooks by hand. When I graduated from a
    university, I decided that it was time to get hold of my finances, and a spreadsheet
    was the way to do it. These days, I use spreadsheets to keep track of my “time
    card” when I''m doing contract or court work, help me manage project teams, and
    complete other tasks. I''m sure that you have your favorite uses for spreadsheets.
    The following sections take a look at OpenOffice.org Calc so you can get to work.


    # Starting it up


    To start OpenOffice.org Calc in the distributions I cover in this book, do the
    following:


    +   * Fedora Core: Choose Applications��Office��Spreadsheet. Or you can click
    the Spreadsheet button in the upper panel.

    * Knoppix: From the Main Menu, choose Office��OpenOffice.org��OpenOffice.org.

    * Linspire: Choose Launch��Run Programs��Business & Finance��OpenOffice��OpenOffice
    Spreadsheet.

    * Mandriva: From the Main Menu, choose Office��OpenOffice.org Calc.

    * SuSE: Choose Applications��Office��Spreadsheet��Calc.

    * Xros: Choose Launch��Applications��OpenOffice.org.

    * Ubuntu: Choose Applications��Office��OpenOffice.org2 Calc.


    # A tour of OpenOffice.org Calc


    Much of what you see in OpenOffice.org Calc should look familiar, between looking
    through OpenOffice.org Writer and other spreadsheet programs you have used. Take
    a look at the GUI layout shown in Figure 17-2.'
