- pgno: 356
  md: '# Chapter 18


    # Multimedia Wow!


    **In This Chapter**


    +   - Listening to music

    - Using, recording to, and ripping from CDs

    - Creating and modifying high-powered graphics with The GIMP

    - Watching movies


    > The price of freedom is responsibility, but it''s a bargain, because freedom
    is priceless.


    — Hugh Downs


    In these days of computing in noisy Technicolor, it just doesn''t feel like a
    computer unless you can make it sing and dance. This used to be a weak point for
    Linux, but these days there''s little that I can''t do on my Linux desktop machine.
    From listening to CDs to watching QuickTime movies, you can do just anything.
    Sometimes it takes a bit of elbow grease to get things working.


    Time to take a trip on the wild side and get your Linux box doing the Macarena.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_356_0.png)


    Because legal complications surround a number of multimedia programs and their
    use in countries like the United States of America, some multimedia capabilities
    are had to be removed from some Linux distributions. However, these capabilities
    are still available if you know where to look — and if you''re in a legal jurisdiction
    that allows listening to MP3s, watching DVDs, or other touchy subjects under patent
    laws and the Digital Millennium Copyright Act (DCMA). Chapter 12 shows you how
    to add many of the features discussed throughout this chapter.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 338 Part IV: Getting Done


    # # Checking Your Sound Card


    Before you can listen to tunes, you have to make sure that your sound card is
    working properly. After the configuration issues are dealt with, you can move
    on to the fun stuff like listening to CDs and Internet radio and downloading tunes.


    Many distributions allow you to test your sound as part of the installation or
    immediate post-installation routine. Just in case you skipped this step, the first
    thing to do is locate the sound-testing program (if one exists) to see yours working:


    +   * Fedora: Choose System-Administration-Soundcard Detection to see whether
    the card is correctly detected and plays tests.


    +   * Knopix: From the Main Menu, choose KNOPPIX-Configure-Sound Configuration
    to start the sound configuration utility.


    +   * Linspinre: Choose Desktop-Settings-Control Center-System Administration-Information
    to see whether the card is correctly detected. If you are a daring and savvy hardware
    person you can make alterations by selecting the main Control Center panel and
    selecting Sound & Multimedia-JACK Sound Server-Advanced.


    +   * Mandriva: From the Main Menu, choose System-Configuration-Configure Your
    Computer-Hardware-Look At And Configure Hardware and then click the audio of your
    sound card under Sound, rather than its label, to see whether the card is correctly
    detected.


    +   * SuSE: Choose Desktop-Yaast-Hardware-Hardware Information-Sound, and then
    click the plus next to the specific sound to make sure it is properly listed.


    +   * Xanders: Choose Launcher-Control Center-Hardware Information to see what
    sound card the operating system found (you may find yours under an additional
    System menu). To make changes, follow the same instructions given for Linspur.


    +   * Ubuntu: Choose System-Preferences-Sound to make sure your card was found
    correctly.


    # # Looking into Your Mixer


    If the card seems to be detected properly, then a look at your mixer is the next
    important step. Sometimes cards are picked up right, and yet the mixer'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Chapter 18: Multimedia Wow! 339


    for some reason by default has things muted, or other strange things are set.

    To find the mixer:


    +   - Fedora: Choose System::Preferences::Volume Control.

    - Knoppix: From the Main Menu, choose Multimedia::KMix.

    - Linspire: Choose Launch::Run Programs::Audio & MP3::Volume Control.

    - Mandriva: From the Main Menu, choose Multimedia::Sound::KMix.

    - SuSE: Choose Applications::Multimedia::Volume Control (there may be another
    menu layer with another Volume Control component in this version). You may find
    other programs useful in this menu.

    - Xandros: Choose Launch::Applications::Multimedia::Sound Mixer.

    - Ubuntu: Choose Applications::Sound & Video::Volume Control.


    Mixer items of interest include the following:


    +   - Lock: When two slider bars appear for a setting, this option just makes
    sure that they''re always level with one another.

    - Mute: No sound comes from this section.

    - PCM: Control the volume for audio files as opposed to, say, CDs.

    - Volume: Control the overall volume.


    Finally, many of the distributions have a little volume icon on the panel. If
    everything else looks right in the mixer but you get no sound, click and make
    sure that it hasn''t been pulled down to the bottom.


    #  Investigatingome Sound Issues


    If your sound isn''t working, your card may not be supported. The following strategies
    can help you track down a potential solution:


    +   - Proceed to the manufacturer''s Web site and locate the page for the specific
    card that you need. This page often has a link to technical support, drivers,
    and downloads. If it does, follow these links and see whether a driver (the piece
    of software that tells your operating system how to talk to each piece of hardware)
    is available for your card in Linux. If you are using kernel version —r — the
    version of the Linux core that you''re using— uname -r to see your version number
    and choose the closest driver that you can. You might also have to try the central
    tech support page on that site if there isn''t one dedicated to the hardware in
    question.'
  merge: -1
  img_proc: true
