  md: '# Chapter 8: Connecting to the Internet


    # Connecting to (And Disconnecting from ) the Internet


    To connect to the Internet from the Fedora Network Configuration dialog box, highlight
    the modern entry you just created (see preceding section) and click the Activate
    button. With any luck, modem springs beeps and then buzzes along with a dialog
    box indicating that a connection is being made. After a successful connection,
    the Network Configuration dialog box appears again: this time, the Status column
    of the modem device reads Active. Congratulations — you''re connected to the Internet!


    To disconnect, click the Activate button in the Network Configuration dialog box.
    Your settings remain; the next time you want to connect, just open this dialog
    box and activate. If all is not well, skip to the next section, "It''s All Fun
    and Games Until Something Doesn''t Work," to find how to get help.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_168_0.png)


    Readers using other distributions should use that''s connection tool. You may
    find that double-clicking your Web browser''s icon and trying to go a site activates
    your connection.


    # It''s All Fun and Games Until Something Doesn''t Work


    In a perfect world, the dialup configuration steps in the preceding section would
    work 100 percent of the time. The Linux vendors have truly hidden the mystery
    that has traditionally surrounded networking. Unfortunately, in many situations
    (mostly related to modernos and hardware), a simplified configuration doesn''t
    work. If you can''t connect to the Internet after following these steps, an excellent
    site to help is LinuxQuestions.org (www.linuxquestions.org). And yeah, I know
    —you''ll have to use a computer that already has Internet access to get help.(Catch-22,
    anyone?) It''s simply impossible to anticipate the wide range of problems can
    run into, and the Linux community is your best bet; this site is well known for
    its helpful members.


    Also, go to your favorite Web-search site and search on the error message you''re
    getting from the system — or it doesn''t hurt to add the hardware-make and model
    and the name of your distribution as well if just the error message isn''t working.
    When you''re trying to find out what''s wrong with your network connection — or
    trying to gather information that can'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 150 Part II: Internet Now!


    help someone else figure what''s wrong — you can use a cool tool: the handy command-line
    program, **ping**.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_169_0.png)


    Some firewalls block the kind of traffic with **pings**, so these commands don''t
    always work as expected, even with a good connection.


    The **ping** command is akin to a submarine using sonar to detect other objects
    in the ocean. Sonar sends a **ping signal**, which reflects off a hard surface.
    By measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine the object is.


    The **ping** command in Linux provides information similar to what sonar provides
    — and it''s so useful that you see it as both a Linux command and a time-honored
    word. If you consider the Internet to be your ocean, then by **pinging**, what
    other network commands exist — and how long it takes for your **ping** command
    to return. You use this command in the format `ping hostname` or `ping ipaddress`,
    such as `ping bob.example.com` or `ping 192.168.1.5`. If you can''t ping another
    computer in your house or office (assuming you have connected to Ethernet and
    not on separate dialup connections), something is wrong with the machine you''re
    pinging. On the other hand, if you can ping another machine in your house or office
    but you can''t ping a machine-else on the Internet, something may be wrong with
    your connection to your ISP.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_169_1.png)


    *Latency*, or the amount of time it takes for a signal to travel to the Internet,
    has little to do with physical distance. Factors, such as network traffic, bandwidth,
    and hardware contribute all to a slow latency. Factors determine whether a **ping**
    command to your network''s computer takes longer than a ping host at the South
    Pole.


    For example, try pinging Yahoo! by opening a command prompt (see Chapter 14) and
    typing the following command:


    ```

    ping www.yahoo.com

    ```


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_169_2.png)


    Press Ctrl-C to stop the ping; otherwise your computer continues to **ping** the
    target.


    The output, shown in Figure 8-6, provides information about what **ping** is doing.
    If you can''t ping the host, you receive a message that the host is unreachable.
    If you can reach the host, you receive feedback that shows how long it takes —
    in milliseconds (ms) — for the signal from your computer to get to the destination
    computer and back again — the lower numbers, the better. For computers connected
    through Ethernet, a **ping** of 1 ms to 3 ms is an acceptable response time. For
    dialup connections, expect ping around 150 ms. When you start seeing **ping**
    times climbing to 900 ms or higher, the network is under heavy load (or you have
    something wrong with your cables).'
  merge: -1
  img_proc: true
