- pgno: 37
  md: '# 18 Part I: Getting Your Feet Wet


    are usually dependent on one particular package manager. More recent in the grand
    scheme of things, package management has also come to involve adding easy-to-use
    update routines, as well as an easy way to add software without the need of a
    computer science degree. Chapter 12 provides more information about package management.


    It would be impossible to account for every installation of every Linux distribution.
    Okay, maybe not literally impossible, but you''d need a forklift to do your Linux
    For Dummies book home from the bookstore if you did. Consequently, I try to summarize
    the concepts needed to install any Linux distribution into this book with enough
    detail to get you through the process. (As you can imagine, it''s a bit of a challenge!)


    I chose Fedora Core as the distribution because Red Hat has become a recognized
    Linux standard, and its Fedora Core project is specifically aimed at home and
    small business users who cannot afford (or have need to) purchase higher-level
    products. Even better, if you use Red Hat Enterprise Linux (RHEL) in your office
    or organization, Fedora Core is a proving ground for the technologies that will
    make their way into RHEL.


    In addition to Red Hat, I also include information about other popular distributions
    for beginners: Linuxpire, Mandriva, SuSE, Ubuntu, and Xandros. I certainly do
    not wish to discount Slackware and Debian as these are very powerful distributions.
    I just feel that they are more advanced than the others and best left for your
    post-Linux endeavors. Included also is Knopix, a Live CD that you can use to boot
    your computer into a full desktop without having to install a thing! See Chapter
    4 for more information on Live CDs.


    In fact, the DVD that comes with this book contains more than just Fedora. Check
    out Appendix B for a list of the goodies you can find on the DVD.'
