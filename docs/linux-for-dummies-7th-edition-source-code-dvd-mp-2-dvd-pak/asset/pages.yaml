  md: "# 330 Part IV: Getting Things Done\n\n# Layout with OpenOffice.Org Math\n\n\
    There's nothing like trying to type a math or science report having to either\
    \ use multiple lines to show your equations (which never looks right!) or write\
    \ them by hand. OpenOffice.Org Math is a great solution to this problem. You can\
    \ lay out your equations and more in this program and insert them into any of\
    \ your OpenOffice.org documents. Whether you're a middle school student or a professional\
    \ engineer, OpenOffice.Org Math will just thrill you.\n\nMany OpenOffice.Org Math\
    \ functions are different from what you're used to if you have looked at all the\
    \ other OpenOffice.org programs. However, in many ways this program is less complex\
    \ than some, thanks to its special-purpose nature. Keep in mind it's not a calculation\
    \ program. It's for laying out complex formulas on paper or the screen.\n\n# Starting\
    \ it up\n\nStarting OpenOffice.Org Math in the distributions I cover in this book,\
    \ do the following: \n\n+   Fedora Core: There is no menu option for OpenOffice.Org\
    \ Math in Fedora Core 5. Instead, open another OpenOffice.org application and\
    \ choose File:New:Formula.\n\n+   Knoppix: From the Main Menu, choose Choice:OpenOffice.org:OpenOffice.Org\
    \ Math.\n\n+   Linspire: Choose Launch:Run Programs:Business &amp; Finance:OpenOffice:Additional\
    \ Programs:OpenOffice.Math.\n\n+   Mandriva: From the Main Menu, choose Choice:Wordrocessors:OpenOffice.Org\
    \ Math.\n\n+   SuSE: There is no menu option for this program, so follow the instructions\
    \ given in the Fedora section.\n\n+   Xandros: Choose Launch:Applications:OpenOffice.org:Formula\
    \ Editor. This editor may be under an additional Tools submenu.\n\n+   Ubuntu:\
    \ Choose Applications:OpenOffice.org2\n\n# Taking a tour of OpenOffice.org Math\n\
    \nBefore you proceed, take a look at the GUI layout shown in Figure 17-9."
  merge: -1
  img_proc: true
