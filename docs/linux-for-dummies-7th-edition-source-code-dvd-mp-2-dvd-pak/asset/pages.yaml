    5 Add To Panel dialog box.


    If you want to move the applet elsewhere on your panel, right-click it and choose
    Move from the shortcut menu. Then you can drag the applet around and click after
    you have it where you want to put it.


    # Configuring an applet


    After you have an applet placed and running, you may be able to play with configuration
    options. Some of these options allow you to change what information is displayed.
    Others have a variety of look-and-feel settings.


    To check for which configuration and other options are available for your applet,
    follow these steps:


    +   1. Right-click the applet and examine the shortcut menu that appears.**

    This shortcut menu is different from applet to applet. The bottom portion is always
    the same: Remove From Panel, Move, and Lock To Panel (prevent it from moving).
    Common entries for the top are Help and About. The rest of the items are either
    configuration options (see Step 2) or special applet features, such as the ability
    to copy the data from the Clock.

    2. Choose Preferences from the shortcut menu.

    Not every applet has a Preferences dialog box. If this does, the dialog box opens
    when you choose this option, and whichever configuration features this applet
    are displayed.'
