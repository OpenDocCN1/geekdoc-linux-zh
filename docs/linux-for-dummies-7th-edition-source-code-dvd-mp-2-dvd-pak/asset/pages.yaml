  md: '# 108 Part I: Getting Your Feet Wet


    This feature is on by default in Fedora. To change it or its behavior in the dist-ributions,
    GNOME by default:


    +   - Fedora: Choose System-Preferences-Screensaver.

    - SUSE: Choose Desktop-GNOME Control Center-Screensaver.

    - Ubuntu: Choose System-Preferences-Screensaver.


    Going to the same menu will let you this feature off, or change how long it waits
    before automatically locking your screen.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_127_0.png)


    I''m referring to the GUI here, not the whole machine. Folks who know how to sidestep
    out of GNOME (something I discuss in Chapter 14) can start a virtual session and
    do whatever they want. If you left yourself logged in one of the virtual terminals,
    you can then do so without trouble. But don''t think of this feature as something
    completely secures your computer! Your best bet, if you''re walking away, is to
    check all the virtual terminals and make sure you''re not logged in to any of
    them. You can either log out of your GUI or just use the Lock option.


    # The Log Out tool


    Depending on which distribution you''re using, selecting Log Out either brings
    you to a dialog box lets you log out, reboot, shut the machine off, or it brings
    you to a dialog box where you can confirm you want to log out of your current
    session. This section addresses the first option as the second is explained in
    Table 6-3.


    In SUSE and Ubuntu, after you choose the Log Out option from the System menu,
    the screen darkens and the Are Sure Want To Log Out dialog box opens. Use this
    dialog box, follow these steps:


    +   1. If you want GNOME to remember items you have open and return you to your
    current state after you log back in, make sure that you select the Save Current
    Setup box.


    This feature doesn''t work with all programs, just some (mostly the ones that
    are of GNOME).


    +   2. Click Log Out, Shut Down, or Restart the Computer to set the appropriate
    action into motion, or click Cancel if you don''t want to do any of them.'
