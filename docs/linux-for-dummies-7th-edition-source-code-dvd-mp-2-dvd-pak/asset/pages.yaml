- pgno: 156
  md: "# Chapter 8\n\n# Connecting to the Internet\n\n+    Understanding common Internet\
    \ connection methods\n Setting up your Internet connection\n Connecting to your\
    \ Internet Service Provider (ISP)\n Understanding enough TCP/IP to be dangerous\n\
    \n> > Every improvement in communication makes the bore more terrible.\n>\n— Frank\
    \ Moore Colby\n\nYou may already be connected to the Internet if you're on a machine\
    \ that's connected to a LAN and you've configured the networking during installation.\
    \ To test whether you have a connection, open up a Web browser and try to go to\
    \ an outside Web site (like www.gnu.org). If it works, you're up! No need for\
    \ this chapter. Otherwise, read on.\n\n# Internet Connectivity 101\n\nA few words\
    \ regarding the broadband options (DSL and cables) are in order before I. The\
    \ word broadband is a technical definition, but I just use it to mean high-speed\
    \ Internet access. Although a dialup modem can transmit information at speeds\
    \ up to 56 kilobytes (thousand bits) per second, broadband connections can reach\
    \ 50 times that speed. Nowadays, the web contains lots of images and multimedia\
    \ elements, and enjoying these features through a 56 kbps dialup modem is similar\
    \ to drinking a cold glass of water with an eyedropper when you're dying of thirst.\n\
    \nDon't let high-speed providers discourage you from using Linux with your services.\
    \ Just because they don't support Linux directly doesn't mean the technology doesn't\
    \ work with Linux. TCP/IP (the set of traffic rules for the Internet) was developed\
    \ for the Unix operating system, from which Linux descends."
  merge: -1
