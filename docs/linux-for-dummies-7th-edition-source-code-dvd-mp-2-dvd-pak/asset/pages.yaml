- pgno: 157
  md: '# 138 Part II: Internet Now!


    If you are dual-booting to Windows, your ISP can help you install the broad-band
    connection, and then you can tinker with the time and inclination. In the list
    below, I point to some sites you have the time with getting Linux connected as
    can help you configure your broadband connection as you look at the types available:


    +   - Cable modems: May cable television companies have expanded their product
    lines to include Internet access over their cable infrastructure. When you subscribe
    to a cable service, the installation technician can often provide you with a special
    device, called a cable modem, along with a standard network adapter (like an Ethernet
    card). The technician then installs the network adapter into your computer and
    connects the cable modem to it. As fast speed goes, to get the exact speeds available,
    you need to talk to your cable provider. The following page provides a document
    that contains helpful information about various cable providers and Linux:

    www.tldp.org/HOWTO/Cable-Modem


    +   - Digital Subscriber Line (DSL): DSL carries data to your phone jack in a
    digital format. DSL is popular because it provides a faster connection with lower
    installation and service costs than ISDN, and it utilizes the existing copper
    telephone wiring provided by your telephone company. You can use the same phone
    line as a regular phone line! A DSL connection requires additional communication
    hardware, which your Internet Service Provider (ISP) should provide.


    Note that several variants of DSL exist:


    +   - ISDN (Integrated Services Digital Network) Digital Subscriber Line (IDSL)
    — see later in this section for a definition of ISDN

    - Symmetric Digital Subscriber Line (SDSL)

    - Generic DSL (XDSL)


    You can find out from your ISP how fast your DSL connection would be, because
    it varies. For an overview of DSL and Linux, visit the following Web page:

    -www.tldp.org/HOWTO/DSL-HOWTO/


    +   - Satellite modems: Those who live in particularly remote or lowinfrastructure
    areas may go the route of satellite modems (www.tldp.org/HOWTO/Sat-HOWTO.html).
    You can consider this service equivalent in many ways to cable, in that you get
    it typically through the providers that you get your satellite television signals.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Chapter 8: Connecting to the Internet


    However, satellite has drawbacks. If your satellite service is unreliable, your
    Internet service suffers the same fate. The upload and download speeds can also
    vary dramatically.


    +   **Dialup modes:** The dialup modem is still widely used in areas where broadband
    is either not available or affordable. It translates the digital signal from the
    computer into an analog signal for transmission from the wall jack to the telephone
    company. Because the modem utilizing voice phone service, you don''t need any
    special setup before subscribing to an ISP. However, you can''t use the phone
    line for both dialup and a conversation at the same time. See the sidebar "Beware
    of devices posing as modems" for additional concerns if you''re using the dialup
    modem.


    +   **Wireless:** The realm of wireless networking is where Linux today may give
    you the most depending on what kind of wireless you are using. Four major types
    of wireless exist, and they''re often referred to as a group as WiFi (802.11a,
    802.11b, 802.11g, or as A, B, G, and Bluetooth). A and B are also the best supported
    in Linux for far, because they''ve been around the longest. G''s security is what
    you should aim for, but it also adds levels of complexity that require more cooperation
    from the manufacturers of the cards. Many wireless cards today are, in fact, capable
    of doing more than one of these types, if you don''t have one, get one that supports
    both B and G.


    The best advice I can give here is to do a Web on the make and model of your wireless
    card (or the one you''re thinking of buying), plus the word Linux, and see what
    you find — and, of course, you can check the hardware compatibility for the distributions
    as well. Because this is an area where technology is quickly advancing, always
    check the dates on the resources you find and make sure they''re recent. Even
    six months old can mean you''re getting out-of-date information. Some useful links
    (some are more advanced than others) for this topic include the following:


    +   A posting on my blog for Fedora users, apologies for the long URL: http://dee-ann-blog.com/wireless_setup_on_an_emachine_m5310_notebook.htm


    +   The Linux Networking Quick HOWTO: www.linuxnetworking.com/linux-hw/wmp11-linux.htm


    +   Wireless LAN resources for Linux: www.hpl.com/personal/Jean-Tourrilhes/Linux/


    +   A method for using Windows wireless drivers in Linux: www.linuxant.com/driverloader


    +   Network Topology Guide: www.homenethelp.com/network'
