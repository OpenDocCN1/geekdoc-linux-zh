- pgno: 8
  md: '# # Dedication


    I continue to dedicate this book to my husband, who always has to listen to my
    stressed whining when I''m running behind, and my dogs, who really would like
    their mom to stop staring at the glow-ing box once in a while.


    # # Author’s Acknowledgments


    I, as usual, have lots of people I''d like to thank. First off, thanks to the
    folks without whom the earlier editions of this book would have never existed.
    For one, there''s John "maddog" Hall for giving me the opportunity to take over
    this book''s evolution. He was too busy leading Compaq''s UNIX Software Group,
    acting as Executive Director for Linux International, and sitting on the board
    of advisors for Saul Linux/GNU certification to continue handling this project.
    There are also the folks at LANRights for all their hard work, along with Melanie
    Hoag and Evan Blumquist for their strong efforts. Finally, of course, to the editors
    and staff at Wiley Publishing, Inc. Without them and their guidance, this book
    would not exist or continue to improve over time.


    Most of all, I''d like to thank the readers who contacted me with their questions,
    suggestions, and concerns. I apologize to anyone who got lost in the great deluges
    of e-mail and didn''t get an answer, but please trust that, the very least, when
    I dug your e-mail out from the pile three months later, I filed away as one more
    thing to consider in the next edition. I really appreciate participation that
    keeps books like this improving over the years, and it''s my goal to continue
    refining Linux For Dummies to keep it the best desktop Linux book available.'
  merge: -1
  img_proc: true
