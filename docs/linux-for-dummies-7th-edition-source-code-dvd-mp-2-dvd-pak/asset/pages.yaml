- pgno: 237
  md: '# 218 Part III: Getting Up to Speed with Linux


    # Don''t run out of room!


    One of the most insidious problems that all computer users run into from time
    is a lack of disk space. The scope of this problem really depends on a number
    of things. The primary issue is that, your root partition becomes 99 or 100 percent
    full, you need to use emergency rescue techniques (refer to Chapter 5) to boot
    the machine and clean it out. That''s no fun, is it?


    In the beginning, you''re probably not in danger of filling the drives, unless
    you barely had enough room to install Linux in the first place. However, you may
    get forgot about watching the drives for remaining space. Even experienced administrators
    run into this problem, so certainly you''re forgiven if you do it too!


    Really do try making the following a habit:


    +   1. Open a command prompt window (see Chapter 14).

    2. Type df -h.


    That''s it! As you can see earlier in the section “If your machine fails to reboot,”
    though you ignored it at the time, the columns include


    +   ✔ Size: How big the partition is

    ✔ Used: How much of the partition has been used already

    ✔ Avail: How much is left

    ✔ Use%: So we don''t have to do mental math, a % of how much of the partition
    has been used up


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_237_0.png)


    When you start reaching 90 percent full, it''s time to start some housecleaning!'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Chapter 12


    # Adding Software to Linux


    In This Chapter


    +   - Recognizing tarballs, RPMs, and compressed files

    - Creating tarballs and archives

    - Compressing files

    - Opening tarballs, and compressed files

    - Installing and removing RPMs


    > I will make you shorter by the head.


    — Queen Elizabeth I


    When you start using a new operating system, one of the most frustrating things
    is trying to figure out all the gooey extensions. The Windows world has .exe and
    .zip. The Macintosh world has .bin and .hqx. What about the Linux world? It certainly
    has its fair share of bizarre extensions, but really, they make a great deal of
    sense after you know the programs that make them. In this chapter, you will find
    out about .tar, .gz, .tar.gz, .tgz, .bz2, and .rpm. Anyone for a game of Scrabble
    with alphabet soup?


    After you have the letter jumble figured out, you''ll be happy to find that Linux
    offers a number of cool tools for working with these crazy files, updating your
    system, adding new software, and more.


    # Opening Downloaded Files


    The Linux and Unix worlds are full of strange terms and acronyms. For example,
    if someone comes up to out of the blue and starts talking about tarballs, you
    probably get a mental image of sticky, smelly balls of tar, maybe rolled in feathers.
    Yet a tarball is something you run into regularly in the Linux'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 220 Part III: Getting Up to Speed with Linux


    world, especially when you''re looking for software or you need to save yourself
    space. A tarball is a bunch of files (and possibly directories) packaged together
    in a tar file and then compressed using the gzip utility.


    > TIP

    WinZip can open tarballs with no problem on a Windows computer.


    Fortunately, all you need to know is how to double-click a file in order to access
    the many formats listed in Table 12-1. When you double-click the file, your File
    Manager shows what''s inside.


    While Table 12-1 mentions operating systems, it doesn''t contain hard and fast
    rules. People tend to use whatever kind of programs they''re comfortable with
    no matter operating system they''re on.


    | Table 12-1 Potential Formats for Downloaded Files |

    | Extension | Meaning | Program(s) Involved |

    | --- | --- | --- |

    | .bz | Older form of .bz2. | bzip, bunzip |

    | .bz2 | Slower but more efficient compression for some types of files, like text
    files. | bzip2, bunzip2 |

    | .deb | Not a file to “open,” see the “Installing New Software” section, later
    in this chapter. | apt |

    | .gz | Typical compressed file for Linux and Unix. | gzip, gunzip |

    | .iso | A CD-ROM or DVD-ROM “image,” which is a single file that contains a CD
    or DVD''s entire contents. You have to tell your CD or DVD burner software that
    this file is an image so that it knows not to place a copy of this file onto the
    media. | See Chapter 18. |

    | .rpm | Not a file to “open,” “”see the “Installing New Software” section, later
    in this chapter. | rpm |

    | .tar | A bunch of files bundled together. | tar |

    | .tar.bz2 | A tarball, which in this case is a .tar file inside a .bz2 file.
    | tar, bzip2, bunzip2 |'
  merge: -1
  img_proc: true
