- pgno: 268
  md: '# Chapter 13


    # A Secure Linux Box Is a Happy Linux Box


    +   In This Chapter

    - Implementing strong passwords

    - Keeping your system up-to-date

    - Plugging security holes

    - Using the System Logs Viewer

    - Securing your system by using best practices


    > I am Inspector Clouseau, and I am on official police business.

    — Inspector Clouseau


    You don''t leave the front door of your house open when you go to work, do you?
    How about leaving it shut and locked but with a few nice windows open? The problem
    is that many people do this every day with their computers, and they don''t even
    know it! In this chapter, I take a look at where your open doors and windows are
    and what you can do to secure them.


    Every user''s actions affect your overall security system. If your family members
    or officates need access to your Linux machine, take the time to sit down and
    explain the facts of secure life to them. They can then apply this information
    to the other computers they use, because these issues aren''t specific to Linux.


    # Choosing Secure Passwords


    The first line of defense from intruders is the collection of passwords used on
    your system. For each account you have set up on your system, the passwords must
    be strong and difficult to figure out. If even one of the accounts'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Part III: Getting Up to Speed with Linux


    has a weak password, you may be in some trouble. Amazingly enough, in 70 percent
    of the cases where unauthorized individuals gained access to sys- tems, the password
    for an account was the word password itself! When cho-osing passwords, follow
    these rules:


    +   - Don''t use any part of your name.

    - Don''t use the names of friends, loved ones, or pets.

    - Don''t use birthdays, anniversaries, or other easily guessed dates.

    - Don''t use dictionary words.

    - Don''t keep your password written down near your computer, unless it buried
    in something else, such as writing it into an address.

    - Don''t tell anyone your password. If someone needs to access specific files,
    give them an account and set permissions and groups properly so that they can
    do.

    - Use a mix of lowercase letters, capital letters, and numbers.

    - Do ensure your password contains a minimum of eight characters.

    - Do use acronyms from sentences, such as having the password M8ydnit to stand
    for "My eight-year-old dog''s name is Tabby."


    Every person on your system needs to follow these rules, including you! Consider
    keeping a sheet of paper with these rules next to the machine.


    > I can''t stress this address enough: Never give out your password. Make sure
    that the people using your machine understand this rule. You can always find alternative
    methods to accomplish a task without giving out your password. If someone wants
    to use your machine, make an account for that person. Then they can have their
    own password!


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_269_0.png)


    # Updating Software


    All users can download and install new software. Of course, the programs they
    install are limited to the user''s own permissions. The thing be to be careful
    of here — as with any operating system — that you don''t get a version of a program
    that has been tampered with or is even an all-out fake trying to trick folks into
    installing it.


    Most Linux applications and other Linux software are distributed by way of the
    Internet. In fact, the development cycle of new (and updates) Linux software revolves
    around the Internet for file exchange, e-mail, and forum or newsgroup discussions.
    Make sure that you and other users of your'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Chapter 13: A Secure Linux Box Is a Happy Linux 251


    Linux system are comfortable with the Web sites that are used and visited. You
    need to develop a list of trusted sites that provide you with the information
    you need and are not misleading in their presentation. As a starting point, you
    can trust all the Web sites referenced in this book because I have accessed them
    all. If either you or a user of your Linux system is unsure whether you can trust
    a particular Web site, do some research and perhaps ask others for opinion.


    Chapter 12 details to keep your distribution and its software up to date. Please,
    please, please, do so! After all, as the person in charge, your job is to make
    sure that your computer stays intruder-free. In addition to making sure that you
    do all the same things a user would for both your user accounts and the superuser
    (root) account, no matter which Linux distribution you''re running, you must keep
    up-to-date with security problems.


    # Network holes


    On a Linux server or workstation — or any computer at all, using any operating
    system — you should not have network services running that you don''t intend to
    use. Think of each network running as a glass window or sliding glass door in
    your house. Each network service is a weak spot, and nasty folks are out there
    on the Internet who like to go up to all the houses and make note of how many
    windows and glass doors are on them, what kinds they are, and how easy they are
    to breach.


    Controlling your distribution — as far as its ability to run desktops and many
    types of servers — the more services it have running in the background by default.
    Open the network service management program for your distribution:


    +   - Fedora: Choose System::Administration::Server Settings::Services (see Figure
    13-1). The Services option may be directly in the Administration menu, it depends
    on the collection of software you currently have installed.


    +   - Knoppix: From the Main Menu, choose Knoppix::Services. There is no central
    service control unit, but because this distribution is designed as a desktop,
    few services are available. This menu contains each service you have access to.


    +   - Linsphere: There is no central service configuration point, but this distribution
    is designed to be purely desktop, so there is little to do here anyway.'
  merge: -1
  img_proc: true
