  md: '# Chapter 5: Booting and Stopping Linux


    If you''re used to Windows 98, you need to recondition yourself: Don''t shut off
    the power when you''re finished. For one thing, many users leave their computers
    on when they''re not using them — they just log out of their accounts so no one
    can mess with their stuff — and (oh yeah) shut off the monitor because draw a
    lot of power.


    When you decide to turn off your Linux machine, for whatever reason, you must
    shut down the computer in an orderly manner. You can use one of these methods
    to shut down Linux properly:


    +   * If you''re in the GUI, log out of your account using the main menu''s Log
    Out — Fedora Core users will not under System:Shut Down — and then click the dialog
    box that says (strangely enough) Shut Down.


    +   * If you have a command prompt open, type the halt command at the shell prompt
    (#) followed by the root password; when you press Enter Linux shuts down and tells
    you when it''s right to turn off the machine.


    +   * If you have a command prompt open, type the reboot command; when you press
    Enter, Linux goes through the motions of shutting it down, and then immediately
    reboots the machine.


    +   * If you have a command prompt open, typing shutdown -f now (and pressing
    Enter) is the most traditionally accepted method. The shutdown command optionally
    allows you to send messages to users and determine how long until the shutdown
    takes place. Another method is to use the poweroff command, which is just an alias
    to the previously mentioned halt command.


    If you accidentally cut the power to your Linux box, take care; all is not lost.
    More often than not, you can reboot your computer and pick up where you left off.
    However, you may have to pay for your error while waiting during a quick filesystem
    check while the machine makes sure that nothing was damaged. This process is similar
    to the one Windows uses when somebody powers off incorrectly. The operating system
    may need to scan its hard drives to make sure that everything is okay.


    If you''re plagued by brief power outages or spikes that cause your computer to
    reboot, look into getting a UPS (Uninterruptible Power Supply) for your computer.
    These heavy, rechargeable batteries are designed not only to protect your computer
    from damage (read the box to see...) but also to provide an extra five minutes
    or more of power so you have a chance to close your files properly and shut down
    your machine when the power goes out. Better yet, for those really brief spikes,
    the


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_118_0.png)'
