- pgno: 90
  md: '# Chapter 4: Installing Other Linux Distributions


    # Starting Off with SuSE


    The SuSE ("COO-za", www.suse.com) company and Linux distribution were founded
    in 1992 and were purchased by Novell (www.novell.com) in 2004. The distribution
    is named after German acronym for *Software und Systementwicklung*. One SuSE claim
    to fame is its international support. Most major distributions provide some level
    of support for users around the globe, but some are better at language particular
    for groups than others; SuSE — understandably — excels in the German and western
    European space.


    In this section, I focus on installing the free version. OpenSUSE 10. However,
    instead of installing the five ISO files required to install this distribution,
    the DVD-ROM that comes with this book contains a LiveDVD image containing SuSE
    10. No installation is required, so you can just burn the ISO to a DVD-ROM, and
    boot your machine to experience this version of SuSE Linux — see Appendix B for
    where to find these files. You can also download this distribution for free (from
    www.opensuse.org/) if you can''t use the DVD-ROM, or you can purchase a boxed
    set with manuals and from the Novell (www.novell.com/linux/suse).


    > TIP Throughout the book, since GNOME is the new desktop environment in SuSE,
    I assume that you are using GNOME. However, the LiveDVD gives you KDE, which can
    be confusing. You can switch to GNOME by logging out of the LiveDVD, and in the
    login screen, select Type>GNOME.


    # Installing SuSE


    Those who are using the version of SuSE included on the DVD-ROM in this book can
    skip this section. Instead, it is for those who chose to download and install
    OpenSUSE 10 — however, the installation routine discussed here is identical to
    that of the commercial SuSE product. In Chapter 2, I will mention that SuSE can
    resize your existing Windows partitions. OpenSUSE can as well.


    To install this, follow these steps:


    +   1. Put CD 1 or DVD 1 (the one on the left) in your CD-ROM or DVD-drive.

    2. Reboot your machine.

    3. Choose Installation from the menu and press Enter.


    The Welcome screen appears, followed by the installer''s menu.

    The installer begins to look at what hardware you''re using. (This process can
    be a bit slow, so be patient.) Finally the Welcome To YaST2 (the system''s installer
    and administration program) screen appears.


