    a very slight chance exists that you can find a Linux driver for hardware. If
    you do find one, copy it to a floppy before you install Linux. If you can''t find
    a driver and need to use a modem, spend a little cash and get a modem that is
    properly supported (For more information about WinModems in particular, see Chapter
    8.)


    # Finally, Finally, Before You Get Started


    The bootable CD or DVD is the last thing you will need before proceeding to install
