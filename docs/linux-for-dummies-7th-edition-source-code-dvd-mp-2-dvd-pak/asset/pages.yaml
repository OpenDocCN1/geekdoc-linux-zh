    \ or need basic information about using the man page system? Just type man to\
    \ get started. The clear command simply wipes the bash screen clean. \n. When\
    \ you're finished reading the man page, press Q to exit.\n\n# Clearing the screen\n\
    \nThe clear and reset commands are handy to know about you're working in a shell.\
    \ The clear command simply wipes the bash screen clean. Don't worry; it's not\
    \ deleting any files or changing any settings — it's just tidying up so you can\
    \ start dumping new stuff to the screen again.\n\nThe reset command is a little\
    \ more interesting. Suppose that you try listing a binary file to the screen with\
    \ puking the result of the cat command on a binary file, you after the computer\
    \ finishes executing the cat command, you may get lucky and still be able to read\
    \ your prompt. More likely, your prompt has been rendered into box characters\
    \ of no special meaning, and typing on the keyboard gives you more of that. To\
    \ get back to normal, just type reset and press Enter. Note that it doesn't look\
    \ like you're typing the reset, but rest assured that the computer understands\
    \ the series of characters and, after a couple of seconds, should restore your\
    \ shell environment to your native language."
