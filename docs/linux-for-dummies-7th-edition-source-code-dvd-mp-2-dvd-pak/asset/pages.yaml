    # ## mtools


    The mtools suite of utilities provides a nice way to transfer information to Microsoft
    Windows friends files. Although Linux has native support for Linux and DOS file
    systems, your Microsoft cohorts do not have access to Linux (ext2 and ext3) file
    systems. To keep everyone happy, you can preformatted MS-DOS disks and use them
    with the mtools commands (see Table A-9) so that you can swap them back and forth
    with friends who are using Windows:


    | Table A-9 mTools Commands |

    | Command | Purpose |

    | --- | --- |

    | mcd | Changes directory in DOS format on a DOS disk. |

    | mcopy | Copies DOS files to and from Linux. |

    | mdel | Deletes a DOS file. |

    | mdeltree | Deletes a DOS directory and its contents. |

    | mdir | Lists a DOS directory''s contents. |

