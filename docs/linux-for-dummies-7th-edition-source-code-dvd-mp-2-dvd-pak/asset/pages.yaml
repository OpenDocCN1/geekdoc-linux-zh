- pgno: 61
  md: '# 42 Part I: Getting Your Feet Wet


    +   • The Function Keys: The last item listed out the function keys displayed
    at the bottom of the initial installation splash screen.


    The F1 key presents the initial installation splash screen, which offers general
    instructions, the boot prompt, and pointers to the function keys labeled F2 through
    F5.


    The F2 function key includes options relating to booting the Knoppix Live CD on
    the DVD. See Chapter 4 for more information on Knoppix and live distributions.


    The F3 function key offers more options for Knoppix.


    The F4 function key offers options for disabling hardware detection during installation
    (you must know the details of your hardware before proceeding); enable rescue
    mode; using a driver disk, CD, or DVD that isn''t included with the Linux installation
    media; and testing your system''s memory. Type the specialized options to use
    them.


    The F5 function key explains what is available on the DVD.


    If you don''t choose options and just press Enter, the Linux distribution graphical
    installation starts. I will assume you did the latter.


    # 2. Press Enter to start the graphical installation.


    The default installation mode for Fedora (and most versions of Linux) is graphical.
    When you press Enter, many lines of information scroll past as the installer launches.


    If you downloaded the full version of Fedora Core and burned it to CDs or a DVD,
    the CD (media-check) screen appears. This screen allows you to check the integrity
    of the media that you are using to install Linux. If this is the case, I recommend
    taking the time to perform this test on all the CDs or the DVD you downloaded
    personally. It''s best to know which one of them is damaged or incomplete.


    # Dealing with damaged CDs or DVDs


    If your CD or DVD appears to have a problem, what do you next depend on where
    you got the CDs or DVDs. If the DVD came with this book, contact Wiley Customer
    Care at 800-762-2974 to get the disc replaced. Do not contact Red Hat''s technical
    support to have the DVD replaced in this case.


    On the other hand, if you burned your own CDs or DVD, you may be experiencing
    one of two different problems. Try burning the disc at a slower speed. The newly
    burnt disc also fails the media check, download the images again (they may have
    been corrupted during the file transfer, though that''s unlikely).'
