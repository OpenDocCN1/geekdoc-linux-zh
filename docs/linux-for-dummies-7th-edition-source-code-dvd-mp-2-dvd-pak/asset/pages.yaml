- pgno: 221
  md: "# 202 Part III: Getting Up to Speed with Linux\n\nmajority of your Linux filesystem.\
    \ Because you're running your own Linux machine, you need to be familiar with\
    \ how it's put together — especially the sections that are dangerous to mess with!\n\
    \n# Meet the root directory\n\nEverything in the Linux filesystem is relative\
    \ to the root directory, which is referred to as / and is the file-system base,\
    \ a doorway into all your files — don't confuse this with the root user, which\
    \ is the system administrator. The root directory contains a mostly predictable\
    \ set of subdirectories. Each distribution varies slightly, but certain standards\
    \ exist to which they all conform. The standards keep us safe.\n\n![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_221_0.png)\n\
    \nIf you're interested in these standards, go to www.pathname.com/fhs and look\
    \ at the latest version of the rules.\n\nRather than following you with everything\
    \ at once, start by talking about the base directories, meaning the items you\
    \ find in / . Table 11-1 lists what you might find in this base location. (This\
    \ list can vary from distribution to distribution.) An asterisk (*) at the end\
    \ of a description indicates that you shouldn't mess with this directory unless\
