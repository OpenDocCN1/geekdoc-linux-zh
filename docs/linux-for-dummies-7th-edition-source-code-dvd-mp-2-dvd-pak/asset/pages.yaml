- pgno: 142
  md: '# Chapter 7: Configuring Linux 123


    # Creating good passwords


    Good passwords consist of the following:


    +   - A combination of numbers, letters, and even punctuation marks

    - Uppercase and lowercase characters

    - No dictionary words


    +   - Six or more characters

    - No family or pet names, friends’ names, birthdays, anniversaries, or other items
    that someone can easily guess about you.


    Enter the password in both Password fields.

    The remaining items are more advanced, so you can ignore them for now.

    Click OK to save the new account.

    If you want to create another account, repeat Steps 3 through 7; if you''re finished,
    choose File:Quit to close the user creation program.


    # Printing with Linux


    Unless you live in a paperless environment, you most likely need to print something
    (such as a letter, a picture from your digital camera, or an invoice) from time
    to time. Therefore your Linux system has to be able to print; here''s where you
    set it up to do that job. It can be helpful to know, before you continue, the
    make and model of your printer, as well as how it''s connected to your computer.


    +   - Is it a local printer, meaning that it''s connected directly to your computer
    through a parallel, serial, or USB port?

    - Is it a network printer, meaning that it doesn''t have to be connected to any
    single computer and sits on the network as one (usually shared) machine?

    - Is it a remote printer but not a network printer, meaning that it''s connected
    to another computer on your network? If so, this is a Windows, Linux, or OS X
    computer?


    You can find your printer-configuration tool this way:


    +   - Fedora: Choose System:Administration:Printing to open the Printer Configuration
    tool.'
