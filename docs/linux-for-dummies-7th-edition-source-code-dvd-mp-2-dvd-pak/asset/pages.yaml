  md: '# Chapter 1: Getting Acquainted with Linux


    # Anatomy of an Open Source Software Project


    Linux isn''t a product. Linux is an organic part of a software ecosystem.


    > Michael Robinson, Netrinsics


    The casual observer (and some corporate IT decision-makers), Linux appears to
    be a freak mutation — a rogue creature randomly generated by anarchy. How, after
    all, can something so complex and discipline-dependent as a computer operating
    system be developed by a loosely knit band of volunteer geeks from around the
    world?


    Just as science is constantly attempting to classify and explain everything in
    existence, technology commentators are still trying to understand how the open
    source approach can create superior software, in cases where this is no choice.
    Often the reasons have to do with the usual human desire to fill a need with a
    solution. When a programmer in the Linux world wants a tool, or bands together
    with other people who want a similar package, and they write it together.


    # GNU who?


    Imagine — software created out of need rather than projected profit. Even Unix
    ultimately became expensive proprietary software, the ideas and motives for its
    creation were originally based on practical needs. What people usually refer to
    (in the singular) as the Linux operating system is actually a collection of software
    tools that were created with the express purpose of solving computing problems.


    Linux also wouldn''t be possible without the vision of a man whose Steven Levy
    (author of the book Hackers) refers to “The Last of the Great MIT AI-LAB Hackers”
    — in the original sense of the word hacker, someone who plays with code, not the
    current popular meaning that implies criminal intent. The pioneer and advocate
    of freedom is Richard Stallman.


    The Massachusetts Institute of Technology (MIT) has long held a reputation for
    nurturing the greatest minds in the technological disciplines. In 1984, Stallman,
    a gifted and brilliant programmer at MIT, was faced with a dilemma — sell his
    talent to a company for a tidy sum of money or donate his gifts to the world.
    He did what we''d all do... right?'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 14 Part I: Getting Your Feet Wet


    Stallman set out on a journey to create a completely free operating system that
    he would donate to the world. He understands — and continues to live — the original
    hacker ethic, which declares that information wants to be free. This concept wasn''t
    new in him. In the early days of the computing industry, advancements were made
    by freely sharing ideas and programming code. Manufacturer-sponsored user groups
    brought the best minds to solve complicated problems. This ethic, Stallman felt,
    was lost when peers began to hoard software as their intellectual property with
    the single purpose of profit.


    As you or may not have gathered by this point, widespread and accessible source
    code is paramount to successful software development. Source code is the term
    for human-readable text (as opposed to the unreadable cyber-hieroglyphics in an
    "executable" file) that a programmer types to communicate instructions to the
    computer.


    Writing computer programs in binary is an extremely arduous task. Modern computer
    software is usually written in a human-friendly language and then compiled, or
    translated, into the computer''s native instruction set. To make changes to this
    software, a programmer needs access to a program''s source code. Most proprietary
    software comes only as a precompiled code; the software developer keeps the source
    code for those programs under lock and key.


    After determining that his operating system would be built around the conceptual
    framework of Unix, Stallman wanted the project name to distinguish his from Unix.
    So, he chose the recursive acronym GNU (pronounced ga-new), which means GNU''s
    Not Unix.


    To finance the GNU project, Stallman organized the Free Software Foundation (FSF),
    which sold free (open source) software to help feed programmers who worked on
    its continuing development. (Remember, we''re free in free speech, not free beer.)
    This organization and goal of creating a complete operating system was necessary
    and important, a much more important piece of the puzzle to be put into place
    to protect this software from big-business pirates — a concern still very today
    as a former Linux company tries to bid on ownership of decades of volunteer work
    from people around the world.


    The General Public License (GPL) is a unique and creative software license that
    uses copyright law to protect the freedom of the software user, which is usually
    the opposite of how copyright works. Generally, copyright is an enforceable designation
    of ownership and restriction from duplication by anyone but the copyright holder.
    When software is licensed under the GPL, recipients are bound by copyright law
    to respect the freedom of anyone else to use the software as they choose. Software
    licensed with the GPL is also known as copyleft software (the reverse of right,
    get it?). Another way to remember the GPL is through its ultimate result: Guaranteed
    Public for Life.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 1: Getting Acquainted with Linux


    # Who''s in charge of Linux anyway?


    As an open source project evolves, various people emerge as leaders. The leader
    is often known as the project''s benevolent dictator. A person who becomes benevolent
    dictator probably spent more time than anyone on a particular problem and often
    has some unique insight. Normally, the words democratic and dictator are never
    paired in the same sentence, but the open source model is a very democratic process
    that endorses the reign of a benevolent dictator.


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel
    (the operating system''s core). He ultimately what features are added to the kernel
    and what features aren''t. The community trusts his vision and discretion. In
    the event that he loses interest in the project, or the community decides that
    he has gone senile, a new leader will emerge from amongst the very competent people
    working with him.


    # Einstein was a volunteer


    Someone who is a volunteer or donates time to a project isn''t necessarily providing
    a second-rate effort (or only working on weekends and holidays). In fact, any
    human resources expert will tell you that people who choose to do a job of their
    free will will produce the highest quality products.


    The volunteers who contribute to open source projects are often leaders in their
    fields who depend on community collaboration to get useful work done. The open
    concept is no stranger to the scientific community. The impartial peer-review
    process that open source projects foster is critical in validating new feature
    or capability as being technically correct.


    Those who paint the open source community as copyright violators and often misunderstand—or
    outright ignore—these vital issues. Open source programmers are proud of their
    own copyrights, not wanting their work to be stolen by others—hence licenses such
    as the GPL. This concern creates an atmosphere with the greatest respect for copyright.
    Bandits who claim they''re ''just being open source'' when they steal other people''s
    work are groshely misusing the term to soothe their consciences.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_34_0.png)


    Many have pointed out that copyright is violated in open source, it''s easy to
    tell. Watch the news and notice how often large software corporations are convicted
    of stealing other people''s code and incorporating it into their own work. If
    the final product is open source, it''s easy for anyone to look and make sure
    nothing is stolen in it. As you might imagine, tracking down such copyright violations
    is much more difficult in a closed source scheme.'
