- pgno: 272
  md: '# Chapter 13: A Secure Linux Box Is a Happy Linux Box 253


    +   - **kdu**: If you are using Fedora and keep getting bugged about hardware
    stuff at boot time, shutting off this service will stop those messages. You can
    run it manually as root if you change hardware later.


    +   - **lisa**: Discussed earlier in Chapter 11 in conjunction with network-browsers
    in certain distributions.


    +   - **mdNSResponder**: Shut this service unless you are a Howl (www.porchdogs.com/products/howl)
    devote. The nifid service should also be on or (matching) with this one it''s
    related.


    +   - **mdmonitor**: Shut this service unless you implemented software RAID during
    your installation. (If you have gone out of your to do so, if you don''t know,
    you probably didn''t!) If you change this service to or off, make sure that mdadm
    is also on or off (matching) as well.


    +   - **pcmcia**: You only need this on laptops. It''s for PCMCIA card server.


    +   - **sendmail**: If you''re probably not in a need of a full-fledged mail server,
    shutting off this service can have unintended consequences because it''s used
    to handle internal mail on your system. Leave it on.


    +   - **smart**: If you''re getting errors for this one at boot time, shut it
    off. It only works with certain IDE hard drives, so if you''re not using that
    type of drive, it a (harmless) error.


    +   - **spammassassin**: If you want to use this program in conjunction with your
    mail program, for it! This program is used by default with Evolution in Fedora
    (Chapter 9), so if you''re using this combination of tools leave this service
    on.


    +   - **yum**: On Fedora, lets run a nightly update for those whose machines are
    connected overnight.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_272_0.png)


    In Fedora, when you check or uncheck a service, you need to make sure that it
    doesn''t crash when you turn it on. You need to use the Start and Stop buttons
    to start or stop it immediately. Use the bottom-right part of the dial to see
    whether Fedora is running right now.


    # Controlling and adjusting your firewall


    Even better (but just essential) than turning off unnecessary services is to make
    sure you have a firewall in place. A firewall is like putting a bunker around
    your house. It would then have openings that only people wanting to do certain
    kinds of things. Friends could fit through one door, another, and package deliveries
    to another.


    In computer networks, each of the services discussed earlier comes in through
    the same door (port, in computer-world bingo). You use firewalls to prevent anyone
    from being able to touch so much a door, or, unless you''ve explicitly set it
    up that they can do. This technique is especially important if you''re on a cable
    network (Chapter 8), where there''s always'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 254 Part III: Getting Up to Speed with Linux


    some abrasive jerk out there using his computer to knock on every computer on
    the network''s doors to see where it can get in.


    You probably already did some basic firewall setup during installation. If you
    ever want to make changes, do the following (you may be asked to enter your root
    password along the way:


    +   ✓ Fedora: Choose System:Administration�:Security Level and Firewall (Figure
    13-2)


    +   ✓ Knoppix: From the Main Menu, choose Knoppix:Services�:Knoppix Firewall.


    +   ✓ Linspark: Click CNR on the desktop or as discussed in Chapter 12. When the
    CNR tool opens, choose Utilities:System Utilities:Firestarter. This tool helps
    you set up your firewall and is installed Run Programs:Utilities.


    +   ✓ Mandriva: From the Main Menu, choose System:Configuration:Configure Your
    Computer:Security:Set Up A Personal Firewall In Order To Protect The Computer
    And The Network.


    +   ✓ SuSE: From the Main Menu, choose Applications:System:YaST:Security and Users:Firewall.


    +   ✓ Xandros: Choose Launch:Applications:Internet:Firewall Wizard.


    +   ✓ Ubuntu: There is no firewall control tool installed by default. Instead,
    select Applications:Add Applications. Enter your root password if required, and
    in the Add Applications dialog box, use the box in the lower left to run a search
    by typing firewall and clicking Search. Click the next box to Firestarter, and
    you may be told that the program is not installable unless you activate the universe
    repository — if this occurs, click Add, and when the list is refreshed, run the
    search again, and then select Firestarter. Click again to tell the system you
    are ready to install the software, and then click Apply in the Changes Pending
    dialog box. Ubuntu installs the tool for you. Select Applications:System Tools:Firestarter
    to launch the firewall.


    Your options are typically something like Enable Firewall and Disable Firewall.
    If you have your computer directly connected to the Internet — and most computers
    are — make sure to Enable Firewall. The only time you should not have this firewall
    in place is when your machine(s) are behind a strong firewall already, or if you
    have a critical application that won''t work otherwise. For just one application,
    though, that''s one huge risk! You can find out how to open up the proper doors
    in the firewall for that program instead.'
