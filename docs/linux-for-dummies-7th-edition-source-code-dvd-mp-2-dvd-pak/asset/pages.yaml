    # About the various Mandriva versions


    Mandriva offers both server and desktop solutions, but I focus on the desktop-here
    — which is considered by many to Mandriva''s real strength. You can see Mandriva''s
    full range of commercial products by going to mandriva.com/products/, and you
    can see the full range of download options by following the instructions available
    in the earlier section of this chapter, “Maxin'' Out the Fun with Mandriva.” (As
    usual, I focus only on items that include the desktop itself of covering add-ons.)


    At the time of this writing, you can purchase and/or download Mandriva for the
    following versions:


    +   - MandrivaMove: The LiveCD version of Mandriva, which allows you to pop the
    CD-ROM into any PC, boot the PC with this CD-ROM, and find yourself in a fully
    functional Mandriva environment without having to install it.

    - Mandriva Discovery/Lx: A commercial package for brand new to Linux, aimed at
    beginners. This package includes MandrivaMove.

    - Mandriva 2006 PowerPack: The commercial desktop user package.

    - Mandriva 10.1 PowerPack-: The commercial offering containing both desktop (all
    of PowerPack) and additional server offerings.


    Mandriva also has commercial and/or free versions available for a number of other
    hardware architectures, such as AMD64, PowerPC, and SPARC. In addition to this,
    if you''re a bleeding-edge kind of person (who geeks refer to the “very latest
    and greatest that most people haven''t started using”), you may enjoy downloading
    the Mandriva Cook at www.mandrivalinux.com/en/devel.php3


    It''s the development (beta) version. Most people are better off sticking with
