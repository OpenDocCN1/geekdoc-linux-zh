  md: '# Appendix B


    # About the DVD-ROM


    The DVD-ROM included with this book contains everything you need to install and
    run Fedora Core 5. This is the equivalent of the four CD-ROMs you would have to
    download from the Fedora Project''s Web site and includes the following:


    +   - Fedora Core 5: A complete copy of the software for the latest and greatest
    version of the Red Hat-sponsored free version of Linux, for your computing. If
    you are interested in the source code, you can download it directly from Red Hat''s
    Fedora Project site. We hope that you might not mind using the space that would
    have gone to multiple CDs worth of source code to include lots and of other software
    instead.

    - RPM (Red Hat Package Manager): The Red Hat software distribution and installation
    management environment, wherein Linux updates and new facilities are packaged
    for easy installation on your Linux machine.

    - KDE (the K Desktop Environment) and GNOME (GNU Network Object Model Environment):
    The two leading graphical user interfaces for Linux. You can pick the one you
    like!

    - Mozilla Firefox: The best-of-breed browser for your Linux machine, just waiting
    for your pleasure.

    - Samba: The best way to integrate Linux servers with Windows users. Samba lets
    your Linux masquerade as a Windows server so that Windows can grab files and print
    documents hassle free.

    - Apache Web Server: The world''s most popular (or at least, most frequently used)
    Web server software.

    - Games: Tons of games; enough to let you procrastinate for weeks!

    - OpenOffice.org: A full-featured and popular office suite.


    If you don''t have a DVD-ROM drive, send the coupon in the back of this book to
    Wiley Publishing, Inc. to receive the complete CD set. (See coupon for details.)


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_414_0.png)'
