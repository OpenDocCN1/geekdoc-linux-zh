    You have room for only so many applets. And, if you''re like me, you probably
    don''t want to have every bit of free space cluttered with icons. To remove an
    applet from the panel, follow these steps:


    +   1. Right-click the panel on an empty spot.


    +   2. Choose Remove From Panel::Applet.


    The series of submenus opens, and you''re finally looking at a list of the applets
    you now have on your panel.


    +   3. Choose the applet you want to remove from the panel.


    The applet is no longer on your panel.


    # Adding programs to your panel


    You can also add programs to your KDE Panel. To do so:


    +   1. Right-click on a blank spot on your panel.


    +   2. From the shortcut menu, choose Add To Panel::Application Button.


    +   3. From the Application Submenu, browse to the program you want to add and
    select it.


    The program appears on the left or right of your panel, depending on where you
    have room. (You remove programs from the panel same way that you remove applets.)


    # Cluttering the desktop with icons


    KDE allows you to alter which applets and programs appear on your panel, and on
    your desktop. Managing these shortcuts is a simple operation after you understand
    how it works.


    # Adding a program to the desktop


    The panel has only so much room. Maybe you would rather your group shortcuts lined
    up on the desktop as you do in Windows. To add one of these shortcuts, follow
    these steps:


    +   1. Click the Main Button to open the KDE Main Menu.


    +   2. Open the submenu containing the program for which you want to make a shortcut.


    For example, if you want to add The GIMP, open the Graphics submenu.'
