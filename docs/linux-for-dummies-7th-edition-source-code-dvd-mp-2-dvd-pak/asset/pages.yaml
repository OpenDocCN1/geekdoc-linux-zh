  md: '# Chapter 3: Installing Fedora 45


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_64_0.png)


    Figure 3-4: The partitioning screen.


    Be careful — you lose all data in existing partitions when you choose to remove
    partitions. They won''t be immediately changed, however — until the final installation
    screen.


    # Defining partitions manually


    If you choose to define partitions manually, you''ll be using Red Hat''s Disk
    Druid. Disk Druid enables you to delete existing partitions and add new partitions.
    If you don''t know how to use Disk Druid, I recommend that you don''t proceed
    any further. Click Back to the Automatic Partitioning, and then choose to review
    the automatic setup that Disk Druid suggests instead of starting from scratch.


    If you choose to Review and change things, there are some terms you''ll want to
    know: The mount point is where a device (maybe the first partition on your IDE
    hard drive, which would be /dev/hdl) attaches within your filesystem (your directory
    hierarchy). The start


    for your filesystem is the root directory, which is shown as /. You need to have
    a partition mounted as /, and you want it to be as large as possible if you''re
    not making many partitions. You also want a partition mounted as /boot, but that
    one can be small, around 150MB. Finally, you want a partition that''s about twice
    as big as the amount of memory in your computer. (There''s no mount point shown
    for the swap partition, just a file-system type of swap that you have to choose.
    Otherwise, when it comes to Fedora, you''ll be sticking with ext:3 as your file-system
    type because it''s the default. I get more into these kinds of things in Chapter
    10.)'
  merge: -1
  img_proc: true
