- pgno: 280
  md: '# Chapter 13: A Secure Linux Box Is a Happy Linux Box 261


    # Software holes


    When someone is already in your system — whether or not they''re allowed to be
    there — you have additional security concerns to keep in mind. One of these involves
    what software you have on the machine. Believe it or not, each piece of software
    is a potential security hole. If someone can get a program to crash in the right
    way, they can get greater access to your system than they should. That''s a very
    bad thing!


    One way to close software holes is to remove all programs you don''t need. You
    can always add them, if necessary. How exactly you do this task depends on the
    package-management scheme your distribution runs:


    +   - Fedora: You can use the Add/Remove Software tool (see Chapter 12).

    - Knoppix: You run out of CD, so it''s hard to remove anything!

    - Linspire: Open the CNR (Chapter 12), click the My Products tab, select the program
    you want to remove from the list, and then click Uninstall Selected

    - Mandriva: From the Main Menu, choose System\:-Configuration\:-Packaging\:-Remove
    Software. In the dialog box, check the boxes for the programs you want to remove.
    When you''re ready to proceed, click Remove.

    - SuSE: Choose Applications\:-YaST\:-Software Management. Locate the program you
    want to remove (see Chapter 12). Installed software has a check mark next to it.
    Click the mark until it becomes a trash and then click Accept.

    - Xandros: Open the Xandros Networks client as discussed in Chapter 12. Choose
    Installed Applications, browse to the program you want to remove, and click the
    Remove link in the program''s description.

    - Ubuntu: Choose Applications\:-Add Applications. Navigate to find the software
    you want to remove — all software that is installed has a check mark in the box
    next to it — and click the box to remove the check. Click Apply. You may be told
    you cannot remove a program because others depend on it.


    If it turns out that, as a result of dependencies, you lose other software that
    you want to keep, make sure to cancel the removal.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 262 Part III: Getting Up to Speed with Linux


    # # Keeping an Eye on Your Log Files with the System Log Viewer


    One other security issue you may want to configure concerns log files. Your network
    programs, kernel, and other programs run log files, which contain records of what
    has been happening on your system. You may be amazed at just how much information
    you get in them! They''re mostly in /var/log; take a look sometime.


    Fortunately, tools are available that can help you mortals sift through the wheat
    to clear the chaff of bugs and intruders.


    To find your distribution''s System Logs viewers:


    +   - **Fedora**: System:Administration:System Log (see Figure 13-6). You may
    have to manually open logs to view, which you can do by selecting File:Open, selecting
    the file contents you want to view, and then clicking Open.

    - **Knoppix**: None.

    - **Linux**: From the CNR Warehouse (see Chapter 12), choose Utilities:System
    Units:XWatch.


