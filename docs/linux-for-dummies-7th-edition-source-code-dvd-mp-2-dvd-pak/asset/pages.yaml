    # System Requirements


    Make sure that your computer meets the following minimum system requirements.
    If your computer doesn''t match up to most of these requirements, you

    have problems when using the contents of the DVD-ROMs:


    +   - A PC with an Intel-compatible Pentium-class processor: I recommend a

    400 MHz Pentium IV or better using Graphical mode, although for a

    heavy-duty system, "more is better."

    - At least 256MB of RAM: You need at least 192MB of RAM for Graphical

    mode. (Linux can handle as much RAM as you fit into a typical PC,

    and more is always better than less.)'
