- pgno: 20
  md: '# Introduction


    Welcome to the fascinating world of open source software that is Linux. In this
    book, I introduce you to the wonders of the Linux operating system, originally
    created as a labor of love by Linus Torvalds in the early 1990s. My goal is to
    initiate you into the rapidly growing ranks of Linux users and enthusiasts, busy
    rewriting the rules for the operating system marketplace.


    If you''ve contemplated switching to Linux but find the prospect too forbidding,
    you can relax. If you can boil water or set your alarm clock, you, too, can become
    a Linux user. (No kidding!)


    When this book appeared in its first edition, Linux was an emerging phenomenon
    that neither terribly well known nor understood. In this edition — for a new generation
    of Linux users — so much material is available that you can make the best use
    of it on your desktop. To that end, these pages contain various online resources,
    tips, and tricks, as well as more general instruction. If you''re looking for
    material on servers, Linux All-in-One Desk Reference For Dummies (Wiley Publishing,
    Inc.) can serve your needs.


    I keep the amount of technabble to a minimum and stick with plain English as much
    as possible. Basics explain about Linux installation, boot-up, configuration,
    and software, I include many examples, lots of details to help you set up and
    use your own Linux machine with a minimum of stress or confusion.


    I also include with this book a handy CD-ROM that contains Fedora 5 and Knopix,
    along with the CD-ROM (the files you can use to burn your CDs for Linsphere, Mandriva,
    SuSE, and Xandros. To find out exactly is included on the DVD-ROM, see Appendix
    B.) Ubuntu is also covered, but there wasn''t enough room on the DVD for it instructions
    are included in Chapter 4 how to download this distribution yourself. If you have
