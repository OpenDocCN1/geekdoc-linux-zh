  md: '# 28 Part I: Getting Your Feet Wet


    # Choosing a partitioning tool


    Perhaps the easiest way to adjust your existing partitions is through the use
    of a commercial program such as Partition Magic. Partition Magic enables you to
    view the partition information for your hard drive(s). You can also use this utility
    to resize, move, and add partitions. If all you want to do is resize, however,
    do not have to go out and buy software to get that done. Instead, you can download
    a free tool to do the job for you (see the next section for how to do so).


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_47_0.png)


    No tool is perfect. Before going any further, make a backup of anything you don''t
    want to lose off your Windows installation! Things can go wrong during the various
    steps of partitioning, even when using Windows tools on Windows.


    If you create an open partition by using Partition Magic (after resizing your
    Windows partition), make a note of which drive and partition it is (first, second,
    and so on). You''ll need this information when you''re telling the installer where
    to put Linux.


    # Getting and resizing partitions with parteded


    A free resizing program you can use is called parteded. This utility can work
    with VFAT and NTFS partitions, so it can handle both of the file systems you may
    have used when you set up your machine in Windows. The program comes with Knoppix,
    which is a Live CD — another bootable distribution — meaning that you can put
