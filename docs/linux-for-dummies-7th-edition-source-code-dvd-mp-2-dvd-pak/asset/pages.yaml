- pgno: 115
  md: '# 96 Part I: Getting Your Feet Wet


    # Step 4: Control is handed over to init


    After the kernel''s finished loading, it passes off the system initialization
    process to a program named init. The init program is responsible for-starting
    all services and programs. You can see these processes starting as they scroll
    up the screen with [OK] or [FAILED] on the right side of the monitor. If you see
    these lines, you know that your kernel has finished loading.


    The main problems you may encounter with init are services (programs that run
    in the background) that fail to start, as indicated by the [FAILED] status during
    the boot process. Services usually fail because of misconfigurations or unsupported
    hardware drivers. Sometimes a problematic service takes a long time to start up,
    you may need some patience while you wait it out.


    With many of these services, failure to start doesn''t keep you from logging in
    and using your system. After the machine boots, you can use the techniques described
    in Chapter 13 to shut off a problematic service if it is being a pain. If the
    machine can''t boot because of this, you''ll need to access your distribution''s
    rescue mode to shut off the service — rescue mode is covered in the next section.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_115_0.png)


    # Entering Rescue Mode


    Heavy-duty system repair tends to happen in rescue mode — a special boot selection
    that simulates your disk by setting up what is called a RAM disk, holding the
    files entirely in memory. The benefit of this is that you can perform necessary
    system surgery if your installed system is hopelessly broken. The drawback is
    that this is a purely command-line interface — you really have know your stuff
    to find your way around.


    Appendix A contains a list of Linux commands to help you find out. Chapter 20
    addresses, another things, how to fix your boot loaders from here (if your problem
    is with the boot loader), and how to track down the error messages your kernel
    might have left behind. You may also be able to find helpful tips by reviewing
    your distribution''s documentation and online forums.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_115_1.png)


    Knoppix is quite popular to use for system rescues because it''s a whole distribution
    on a CD or DVD. (For more on Knoppix and live CDs and DVDs, see Chapter 4.) See
    Chapter 21 for two ways you can use Knoppix for system repairs.'
  merge: -1
