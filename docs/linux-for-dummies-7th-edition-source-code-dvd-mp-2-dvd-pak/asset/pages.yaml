    > Words fly, writing remains.

    — Spanish proverb, from Dictionary of Proverbs, by Delfin Carbonell Basset


    These days, just about everyone who has a computer has at least one office suite
    at their fingertips. If they''re Microsoft Windows users, this suite is probably
    Microsoft Office, although it may be another worthy contender, as Core Perfect.
    In Linux, typically the suite is OpenOffice.org. This suite comes with Base (database),
    Calc (a spreadsheet), Draw (diagrams and figures), Impress (for presentations),
    Math (a word processor for writing mathematical formulas), and Writer (for word-processing).


    After you figure out how to use one of the programs in this suite, you may be
    happy to find that the others are designed to look and work in very similar ways.
    You can even open and save files in Microsoft Office format, if you need'
