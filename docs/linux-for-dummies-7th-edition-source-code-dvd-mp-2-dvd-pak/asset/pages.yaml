    1 Select database Welcome to the OpenOffice.org Database

    Use the Database Wizard to create a new database, open an existing database file,
    or connect to a database stored on a server.

    2 Save and proceed

    What do you want to do?

    Create a new database

    Open an existing database file

    Recently used

    Open...

    Connect to an existing database

    JDBC

    Help << Back Next >> Finish Cancel'
