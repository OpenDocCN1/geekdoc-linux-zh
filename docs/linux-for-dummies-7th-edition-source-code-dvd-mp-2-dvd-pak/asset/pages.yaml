- pgno: 35
  md: '# 16 Part I: Getting Your Feet Wet


    # Packaging Linux: The Distribution


    What people call a Linux distribution is actually the culmination of the GNU project''s
    tools, the Linux kernel, and any number of other open source (and closed source)
    software projects sprang up along the way.


    Robert Young, cofounder and current chairman of Red Hat, has coined an analogy
    comparing Linux to ketchup. Essentially, the operating system Linux—including
    the GNU tools, Linux kernel, and other software—is a freely available commodity
    that, like ketchup, different distributors can pack and label in different containers.
    Anyone is encouraged to package and market the stuff, even though the ingredients
    are fundamentally the same.


    Linux is a complex, malleable operating system, and thus it can take on many appearances.
    The greatest Linux advancement in recent years has been making it easier to install.
    After all, the tools that enable the casual PC user to install Linux weren''t
    originally available. Companies such as Red Hat saw this as an opportunity to
    add value to an existing product, and the concept took off like.


    To draw again on the ketchup analogy, various distributions of Linux have a slightly
    different flavor or texture; your distribution preference may be spicy, mild,
    and or runny. However, you can rest assured that any of the following distributions
    have the same Linux and GNU heart and soul. Each description in this list includes
    a Web address where you can find more information about each project:


    +   - Debian GNU/Linux: This distribution—one of the oldest—is a recognized favorite
    among advanced technical circles. It''s relatively difficult to install. The Debian
    team works closely with the GNU project; Debian is considered the most “open”
    of the Linux distributions. Easier to install (and use) distributions with Debian
    underneath Ubuntu, Xandros, and Linsp (formerly known as Lindows)


    ```

    www.debian.org

    www.xandros.com

    www.ubuntu.org

    www.linspire.com

    ```


    +   - Mandriva: This distribution demonstrates the power of the GPL by allowing
    this competing company to stand on the shoulders of giants. Mandriva (formerly
    known as Mandrake) was originally based on Red Hat Linux (something that simply
    could not happen in a closed source environment), but has since become an excellent
    solution in its own right.


    ```

    www.mandrivalinux.com

    ```'
