  md: '# 260 Part III: Getting Up to Speed with Linux


    When you''re finished, type exit at the command line, and your connection closes.


    # Connecting to your Linux box from another Linux box with SSH


    Yes, you can connect from another Linux box, too. This task is a bit less complicated.
    A terminal window (see Chapter 14) and follow these steps:


    +   1. Type ssh username@ipaddress or ssh username@machinefull to open the connection.


    For example, SSH after you do this step, dee@192.168.1.6 or ssh dee@computer.com
    the following appears:


    ```

    The authenticity of host ''192.168.1.6'' (192.168.1.6)

    can''t be established.

    RSA fingerprint is

    ed:68:0f:ee:d3:78:56:c9:b3:d6:6e:25:77:52:a7:6

    Are you sure you want to continue connecting (yes/no)

    ```


    +   2. Type yes and press Enter.


    You now see these lines:


    ```

    Warning: Permanently added ''192.168.1.6'' (RSA) to the list of known hosts

    dee@192.168.1.6''s password:

    ```


    +   3. Enter your login password and press Enter. Now you''re in!


    Close the connection by logging out of the account (type logout).


    # Connecting to your Linux box from a Macintosh running OS X with SSH


    The process from Macintosh is similar to under Linux. Go to Applications:Utilities:Terminal.app,
    which opens a command line window for you. Then type


    ```

    ssh IPAddress

    ```


    to access the same user account on the remote machine (again, you can use a computer''s
    full name rather than the IP address), or type


    ```

    ssh login@IPAddress

    ```


    if you want to access the account login instead of the same account you''re using
    on the Mac.'
