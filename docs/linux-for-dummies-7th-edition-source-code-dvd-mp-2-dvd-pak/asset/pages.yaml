    to get the CDs — If you do, the first CD is bootable.


    # Laptop considerations


    The current distributions of Linux do well on relatively networks and laptops.
    (See www.linux-laptop.net for an excellent research on how Linux gets along with
    various models and networks.) If your laptop is a common brand, you shouldn''t
    encounter any problems installing Linux. However, laptops often contain WinModems.
    (Hardware labeled with the Win prefix is only for Windows, and can''t figure out
    what to do with Linux.)


    network cards to make sure they''re not branded. The built-in or default hardware
    for the laptop is Win-labeled (or you discover while researching the machine that
    it contains a Win product, even if isn''t properly labeled), you might be able
    to switch the hardware for a PC (or PCMCIA). Most current laptops contain at least
    one PC card to give you a place to slip in a PC card, network card, or combo modem-network
    card. As long as you stick with a common brand of PC card, it should work well
    with Linux.


    If you plan to purchase a laptop for Linux, check out its modem and other hardware
    (such as'
