    # Peeking at your partitions in Windows 2000 and Windows XP


    Windows 2000 and XP operating systems use accounts to control and secure the files
    and folders; to get information about the computer''s disk-space usage, first
    you have to be logged on the system as the Administrator (or use an account that
    has administrative permissions). After you log on, you use the Computer Management
    application in the Administrative Tools collection to find the details of the
    computer''s hard-drive usage. Follow these steps:


    +   1. Open the Control Panel by choosing Start:Settings::Control Panel.

    2. Open the Administrative Tools folder and double-click the Computer Management
    icon.

    3. In the left pane of the Computer Management application, click the Disk Management
    icon.


    Within a few seconds, the right pane displays the current status of the storage
    devices on your computer, such as the hard drive(s), CD drive(s), DVD/CD drive(s),
    and so on. Figure 2-1 is an example of the Windows XP Disk Management display,
    and Windows 2000 users will see a nearly identical view.


    Figure 2-1 reflects a computer that has hard drives and one CD drive. The important
    thing to look for here is the word Unallocated in the disk listing — an example
    is shown in this figure. Unallocated partitions are not assigned to any partition
    system and are free to use for your Linux installation.


    If you find an unallocated partition (refer to Figure 2-1), you are all set —
    provided it''s 10GB or larger (see the previous section). Make a note of which
    partition this is (what is it on and what partition it is that) and skip to the
