  md: '# # Chapter 19


    # # Windows-Only Media Formats\and Programs


    **In This Chapter**


    +   * Running Microsoft Office and Web tools with CrossOver

    * Using Windows inside Linux with Win4Lin

    * Playing Windows games with Cedega

    * Creating a "virtual computer" inside Linux with VMware

    * Trying out the free Windows inside Linux tool, WINE


    > > A gentleman is a man who can play the accordion, but doesn''t. — Unknown


    There is little that is so maddening than to find a file online or have someone
    send a file, just to discover that you can''t use it. While this issue is less
    of a problem for Linux users each day passes, things sometimes still crop up when
    you switch to Linux and realize you have certain programs you can''t live without
    and can''t seem to replace.


    Fortunately, you have a number of options available whatever you need to use files
    or run Windows programs. If you''re looking for software to try with existing
    files or a Wine equivalent to a beloved Windows program, then a good place to
    start (aside from Chapter 12) is www.linuxrsp.ru/win-lin-soft/table-eng.html.
    Here, you can see why it''s surprising if you can''t find a program under Linux
    to do what you need. Some of this software is "commercial" in that it''s for sale,
    and other programs are free.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 358 Part IV: Getting Things Done


    If you find that you actually need to run a Windows program under Linux, you have
    both commercial and free options available, although you have far more commercial
    options. This chapter looks at both possibilities so you can choose what meets
    your needs.


    # Commercial Software


    A growing number of commercially available tools let you work with anything from
    Microsoft Office to your Windows games under Linux. Mind you, ultimately Linux
    user''s goal is not to have use any of these extra layers—but in the meantime,
    it''s nice not to be inconvenienced. I''ve reviewed, or at least used, every one
    of these products (often more than once over the years), I''m not just going by
    their Web sites.


    Many of these vendors offer server, as well as desktop products. I''m focusing
    on the desktop. For more about their server products, check out their Web sites.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_377_0.png)


    # CodeWeavers


    CodeWeavers (www.codeweavers.com) provides an excellent product that I use from
    time to: CrossOver Office. This program allows you to run Microsoft Office (along
    with a growing number of office applications) directly under Linux. It also comes
    with a hefty number of plug-ins (see Figure 19-1) that you might miss when it
    comes to Web surfing. It''s a bit jarring to run Microsoft Word and Windows Media
    Player under Linux at first—because there''s no notice (without special software)
    to do this otherwise—but it''s certainly handy. You can even use the iPod iTuness
    to run CrossOver Office!


    What I most appreciate about CodeWeavers (and all these companies, really) is
    that they are very upfront about what works well, what works except for a few
    features, and what doesn''t work. All you have to do is check their Web site.
    For those who always seem to want to scream "piracy" when it comes to Linux, you
    actually do have to own the programs you want (say, Microsoft Office) and install
    them through CrossOver Office off their original CDs or DVDs. However, you don''t
    have to own the version of Microsoft Windows software that would run under. CodeWeavers
    has built replacement of the necessary Windows functionality under the hood instead.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Chapter 19: Windows-Only Media Formats and Programs


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_378_0.png)


    Figure 19-1: The CrossOver Install Software dialog box, in Fedora Core.


    The CrossOver Installation Wizard will guide you through the process of installing
    software to your system.


    To begin, select the option you want to install, and click ''Next''.


    Software marked with is already installed.


    Adobe Acrobat Reader 5.0

    Adobe FrameMaker-7.1

    Adobe Photoshop 7

    Cortona VML Client

    OC3MS

    Dreamweaver MX

    abry Reader

    Encode (7.0 or older)

    Endate 8


    +   - Show all packs and dependencies

    - Install unsupported software


    If you are an iPod and iTunes junkie. There''s no Linux version of iTunes available,
    but CrossOver lets you run iTunes for Windows under Linux.


    A plus to CodeWeavers CrossOver Office is that the applications run in individual
    windows just like every program on your machine. A minus is that not all Windows
    software is supported, because hooks have to be built under the hood for each
    new program.


    CrossOver Office comes with the Xandros Deluxe and Business desktops (available
    for installation through the Xandros Networks; see Chapter 12) and is available
    for purchase from the Xandros Networks for other Xandros users. Those using other
    distributions can purchase this product directly from the company''s Web site.


    # Win4Lin


    Another option is Win4Lin (www.win4lin.com). Win4Lin actually offers you a platform
    within you install Microsoft Windows (so those have CDs handy) and run programs
    on top of it. At this writing, Win4Lin supports Windows 95, 98, ME, 2000, and
    XP (see Figure 19-2).


    A plus for Win4Lin is that it supports a more full range of Windows software.
    By default, this program makes you run all of your Windows applications within
    a single timeframe. See the Win4Lin Administration Guide for information on how
    to change this behavior.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 360 Part IV: Getting Done


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_379_0.png)


    Figure 19-2: Windows XP WinLin in Fedora Core 5.


    # Cedega


    More interested in games than office tools? There''s also TransGaming''s Cedega
    (www.transgaming.com), which was once called WineX. Version of the free Wine project
    (see the upcoming section "Installing and Using Wine") is specifically designed
    to support Direct X, which is used in Windows to make programming for multimedia
    and games easier. Subscribers have access to regular updates, allowing them to
    make use of their favorite games and also add any games they like to the growing
    list of games that are being tested with the system.


    Go to www.transgaming.com/searchgame.php to find a listing of the games, in order,
    that users have tried with Cedega (Figure 19-3) and what success they have had
    with these games.'
  merge: -1
  img_proc: true
