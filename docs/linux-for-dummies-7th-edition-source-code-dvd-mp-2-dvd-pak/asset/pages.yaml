- pgno: 111
  md: '# 92 Part I: Getting Your Feet Wet


    To unravel the mystery of a Linux system that won''t boot requires a bit of understanding
    of how your computer starts up. At the very least, being able to tell a repair
    person where the problem seems to be can make you feel a little less intimidated
    — and even save you some money, because it speeds up your troubleshooting.


    # Giving Linux the Boot


    Let''s face it: As enjoyable as the experience is of staring at a dormant computer,
    the real fun starts when you turn on the computer. With any electronic device,
    opening the electron floodgate is the first step to fun. A computer, however,
    has much more stuff to do than your toaster oven. Rather than warm up a simple
    heating element, your computer has to check all those gizmos you (or the manufacturer)
    plugged into your computer''s motherboard. After the power-up, the computer performs
    some simple hardware tests (called the POST, or Power-Up Self-Test) to determine
    whether those components are working properly.


    Checking all your hardware is just the beginning. Between the time you turn the
    computer and the moment the glowing phosphor on your monitor prompts for a login
    name, the computer is building itself an empire. If you listen and watch carefully,
    your computer and monitor show you signs of the boot process through bleeps, buzzes,
    whirring motors, clicks, messages on the monitor, and blinking lights.


    Although you have heard the cliché "Rome wasn''t built in a day," the boot process
    fairly quickly. This is pretty amazing, considering the architecture of an operating
    system makes Rome look like a stack of cardboard boxes; each time you power up
    your computer, it must build its whole operating system in memory. (Remember that
    an operating system is the core software that makes your computer work.) This
    process can be broken into four main steps, which I discuss in the following sections.


    # Step 1: Power-On Self-Test (POST) leads to BIOS


    The POST process really has nothing to do with the operating system. Your computer
    performs this step whether you''re running Linux or another operating system,
    such as Windows XP.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Chapter 5: Booting and Stopping Linux


    Some symptoms of a failed POST include these:


    +   - An unusual series of long and short beeps

    - Nothing apparent on the monitor

    - No apparent activity other the whirring fan on the power supply

    - A puff of smoke or the pungent smell of burning electrical components from your
    computer case

    - An error message, displayed on the monitor, indicating a hardware failure


    If you encounter any of these problems, you have hardware troubles that need to
    be resolved before you began your Linux installation, your computer should be
    getting through the POST just fine — PROBLEMS don''t tend to be caused by installing
    a new operating system; they''re more fundamental to the computer itself.


    But for all the lost of errors, it''s time to figure out your nephew Mortimer,
    who was last seen lurking around your computer with a screwdriver. (Or take your
    computer into a computer repair shop!) If you see an error message indicating
    a hardware failure, you might have a shot at fixing the problem in the BIOS. As
    the POST does its thing and finishes up, it briefly displays (usually at the bottom
    of the screen) instructions on how to enter "setup." key such as F1. When you
    press this key (provided all goes well), you usually see a blue screen with black-white
    text. From here, if you''re familiar with your hardware, you can try to figure
    out and fix the problem. However, many people would rather have a root canal with
    no anesthesia than mess with this stuff, so you may want to grab the nearest teenager
    or computer-repair-wizard and entreat him or her to take a look.


    The good news is that if you can get to the BIOS at all, the problem may be easier
    to fix than one where the computer fails before you reach the BIOS.


    # Step 2: The BIOS passes the baton to the boot loader


    After the BIOS okey-dokey with a successful POST, the BIOS locates the first hard
    drive in your system and reads the first sector of disk, which is often referred
    to as the MBR (Master Boot Record). On that first chunk of disk is a program called
    boot loader. The boot loader doesn'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 94 Part I: Getting Your Feet Wet


    know much about anything, except how to start loading your operating system.


    Two boot-loader programs understand how to load a Linux operating system: LILO
    (Linux Loader) and GRUB (Grand Unified Boot loader). LILO has been a tried-and-true
    boot loader for as long as Linux has been a gleam in a geek''s eyeball; GRUB is
    newer— and much more sophisticated. Many distributions allow you to choose your
    boot loader. Typically, most people just stick with the defaults, which are as
    follows for six of the distributions I discuss in this book (Knoppix is not included
    because it boots directly from the CD-ROM or DVD-ROM drive):


    | Distribution | Default Boot Loader |

    |---|---|

    | Fedora Core | GRUB |

    | Linspire | GRUB, with its own special routines on top of it |

    | Mandriva | LILO |

    | Su | GRUB |

    | Xandros | LILO, with its own special routines on top |

    | Ubuntu | GRUB |


    Sometimes "bad things" can happen to your boot loader. One common symptom of boot
    loader problems is a message saying that the operating system could not be found.
    Another hint that the problem is your boot loader is if you never see your boot
    menu, which is a screen that comes up during the boot process that lets you choose
    what operating system and version to boot.


    The boot menu will look different from distribution to distribution.


    If you suspect a boot-loader problem, see the section "Entering Rescue Mode,"
    later in this chapter.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_113_0.png)


    # Step 3: The boot loader (LILO or GRUB) loads the system kernel into memory


    Every computer (and electronic device) requires an operating system to run. The
    technical term for this operating system, or at least the kernel of it, is the
    kernel. If the kernel is your master, orchestrating all the components of your
    computer and delegating resources in a logical and cooperative manner, the boot
    loader is the red carpet on which the maestro arrives.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Chapter 5: Booting and Stopping Linux


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_114_0.png)


    Many Linux distributions today actually put up a graphical progress screen during
    the kernel loading and system initialization phase (after the kernel finishes,
    when it finishes the boot process). If you want to see what happens, typically
    you can click an icon or press a key. Just look for instructions on how to "see
    details." (Not all distributions offer this feature, so if you don''t find a way
    to do this, don''t panic.)


    If available, watch up the scrolling text for one of the symptoms below:


    +   - The system freezes.

    - A dots appear across the top of the monitor, and then the system freezes.

    - A messages appear on the screen, and the final message kernel panic.

    - The system reboots automatically.


    The boot loader passes control over the kernel. You know when the kernel is loading
    because you start to see crazy text like this:


    ```

    Uncompressing Linux... OK, booting the kernel.

    audit(1092566112,337:0): initialized

    ```


    Recovering from a kernel-failure (aside from the dread operating system not found
    described in the previous section) is one of the more challenging issues in Linux.
    This task is, unfortunately, not for the faint of heart. On the other hand, the
    failed kernel may be an updated one; if you have more than one Linux option in
    your boot menu, look at the numbers for each of the options and choose the newest.
    So lets you boot into the last working kernel and have (at least) a working system.


    You can open up www.google.com and search on the specific error messages, or wait
    until the next kernel update comes out and ignore the bad for one now.


    If it''s your optical installation that doesn''t start properly, you unfortunately
    don''t have a fallback kernel option. If this is the problem, I recommend contacting
    your distribution''s support address (if you purchased a commercial product) or
    joining the installation or beginner''s help discussion list if you downloaded
    a free product. See Chapter 2 to find out where locate each distribution discussed
    in this book. Or if you could just reinstall, that''s easier to do when it''s
    a fresh installation. Sometimes things get bit strange during the initial installation
    and reinstalling fixes the problem.'
