- pgno: 215
  md: '# 196 Part III: Getting Up to Speed with Linux


    # Understanding Filesystem Mechanics


    Chapter 11 focuses on as far as how the filesystem is laid out, but this chapter
    covers what''s happening under the hood as far as to how to understand what you''re
    seeing in file-system listings. These features are identical across Linux distributions,
    as the underpinning of working with Linux remains at least the same no matter
    what version of Linux you''re using.


    # Understanding long format file listings


    Remember those detailed list views in the file managers? They typically contain
    information similar to this ls -la output (see Appendix A for a list of commonly
    used commands in Linux):


    ```

    drwx------------ 2 dee 4096 Jul 29 07:48 .

    drwx-xr-x 5 root 4096 Jul 27 11:57 .bash_logout

    -rw-r--r-- 1 dee 24 Jul 06:50 .bash_profile

    -rw-r--r-- 1 dee 230 Jul 06:50 .bashrc

    -rw-r--r-- 1 dee 124 Jul 27 06:50

    ```


    You may find some parts of this format easier to understand, at a glance, than
    others. The first item in each listing (the part with the links and dashes——in
    the first line) is the permission set assigned to the item. Brielly, permissions
    define who can read the file, change it, or run if it''s a program. You can read
    more about permissions in "A permissions" later in this chapter. The second item
    in the first line (in this case, 2) is the number of hard links to the item.


    A link is a file listing that points to another file, making a kind of shortcut.
    You use two kinds of links in Linux and Unix:


    +   - Soft link: This link is like a Windows shortcut in the link points back
    to the original file, and anything you do to the link happens to the original
    file. Erase the original, and the link remains, but it becomes unusable.


    +   - Hard link: This link doesn''t have a counterpart in the Windows world. A
    hard link isn''t just a shortcut, it''s another instance of the file. The data
    in it is saved in only one place, but you can edit the original or the link, and
    the edit is saved for both instances of the file. Erase the original, and the
    file still exists as long as the link is. It''s like two doors to the same room!


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter 10: Manipulating Files and Directories


    The third item (dee) is the file''s owner, and the fourth (dee) is the group —
    depending on version of Linux you''re using, both of these items may or not be
    identical. You can find out more about both of these in "A permissions," later
    in the chapter. The fifth item is the file''s size in bytes. All directories show
    up as 4,096 bytes. Everything else has its own size. You can tell an empty file
    from the size of 0 bytes.


    The sixth, seventh, and eighths are all related to the last time the file was
    changed: the month (Jul), the date (29), and the time in 24-hour format (07:48).
    Finally, the ninth item is the filename (for example, bash logout in the third
    row).


    # A permissions primer


    If you found scratching your head when looking at parts of that long format listing,
    don''t worry. The "Comprehending file types" in this chapter gives you a feeling
    for the first letter on each line, but more characters are attached to that item
    before you get to the next column. This group is the set of permissions (also
    called a permission set) for the file or directory. Linux, Unix, and Mac OS X
    use permissions as a way of providing file and directory security by giving you
    to specify exactly who can look at your files, who can change them, and even who
    can run your programs. You need this capability to have a bunch of different users
    on the same machine, networked to the world.


    # Checking out triads


    Each permission consists of three triads. Each of the triads has a different aspect
    as basic structure but controls what we can use. Consider the long format listing
    for /home/dee in the following code:


    ```

    total 20

    drwx------x 2 dee root 4096 Jul 29 07:48

    drwx-xr-x 5 dee root 4096 Jul 27 11:57 -

    -rw-r--r 1 dee dee 24 Jul 27 06:50 .bash_logout

    -rw-r--r 1 dee dee 230 Jul 27 06:50 .bash_profile

    -rw-r--r 1 dee dee 124 Jul 27 06:50 .bashrc

    -rw-r---- 1 dee dee 0 Jul 29 07:48 lsfile

    ```


    The first character in the permission set refers to the type of file. For a directory,
    the character is shown as a d, as you see here for the first two items in the
    preceding list; files are designated with a dash (-) instead. Each file or directory''s
    permission set is a group of nine characters — that is, the nine characters that
    follow the first character (for a total of ten). But this group of nine is really
    three groups of three, as shown in Figure 10-10.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 198 Part III: Getting Up to Speed with Linux


    | R | W | X | R | W | X | R | W | X |

    |---|---|---|---|---|---|---|---||}{

    | Users | | | Groups | | | Others | | |


    **Figure 10-10:** Breakdown of the nine permission characters.


    Legend:

    R=Read

    W=Write

    X=Execute


    The three triads are read as follows:


    +   - The first triad consists of the second, third, and fourth characters in
    the long format file listing. This triad sets the permissions for the *user*,
    or *owner*, of the file. (Owners are discussed in the "Beware of owners" section,
    later in this chapter.)

    - The second triad consists of the fifth, sixth, and seventh characters in the
    long format file listing. This triad sets the permissions for the *group* that
    is assigned to the file. (Groups are discussed in the "Hanging out of groups"
    section, later in this chapter.)

    - The third triad consists of the eighth, ninth, and tenth characters in the long
    format file listing. This triad sets the permissions for *other*, or everyone
    who isn''t the file''s owner or a member of the owning group.


    Although each triad is often different from the others, the internal structure
    of each one is made up in the same way. Focus specifically on how to read one
    triad before looking at the set of them together. Each triad includes characters:


    +   - The first character is either an *x* or a dash. The *x* stands for *read*
    permission. If *x* is set, the triad allows the entity it stands for (user, group,
    or other) to view the directory or contents.

    - The second character is either a *w* or a dash. The *w* stands for *write* permission.
    If *w* is set, the triad allows the entity to add, delete, or edit items in this
    directory or file.

    - The third character is either an *x* or a dash. The *x* stands for *execute*
    permission. If *x* is set, the triad allows the entity it stands for to access
    the files contained in this directory or to run the particular program in this
    file.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# # Chapter 10: Manipulating Files and Directories\n\nIn all cases, the dash\
    \ sits in place of r, w, or x, the triad doesn't allow the entity to read, write,\
    \ or execute permission.\n\nThe following sections describe owners and groups\
    \ in more detail.\n\n# ## Beware of owners\n\nYou may have noticed by now that\
    \ I talk a great deal about owners (users) and groups in Linux. Every file and\
    \ directory has both of these components: a user from the /etc/passwd that's assigned\
    \ as its owner and a group from /etc/group assigned as the group.\n\nAlthough\
    \ every user doesn't need to change file ownership often, the root user does so\
    \ regularly. If you add the file comments, for example, to /home/tom while you\
    \ are logged on as the superuser (another term for the administrator, who is the\
    \ person who owns the root account), root owns that file. The user tom can't do\
    \ anything with it unless you have set the last permissions to allow all other\
    \ folks (who aren't the file's owner or in the specified group) to read and write\
    \ to it. But this method is a pretty sloppy way of doing things because the whole\
    \ idea of permissions is to reduce access, not give everyone access. Instead,\
    \ remember to change the file's owner to tom. You do this with the chown (change\
    \ owner) command. For example, by typing tom comments, root changes the ownership\
    \ to tom. Tom can work with this file and even change its permissions to something\
    \ he prefers.\n\n# ## Hanging out in groups\n\nGroups are more interesting to\
    \ work with than owners. You use groups to allow the root user to assign multiple\
    \ users to share file-system areas. For example, in many versions of Linux, all\
    \ users are added to a group named users (SuSE dee, for this, for example). Then\
    \ rather than a group file listing like the one we showed earlier in this chapter,\
    \ you may see the following:\n\n```\ntotal 20  2 dee users users 4096 Jul 29 07:48\
    \ - \ndrwxrwxr-xr-x 5 root root 4096 Jul 27 11:57 -\n-rw-r--r-- 1 dee users  \
    \    24 Jul 27 06:50 .bash_logout\n-rw-r--r-- 1 dee users     230 Jul 27 06:50\
    \ .bash_profile\n-rw-r--r-- 1 dee users     124 Jul 27 06:50 .bashrc\n-rw-r--r--\
    \ 1 dee users       0 Jul 29 07:48 lsfile\n```\n\nIn other distributions (such\
    \ as Fedora) a unique group is created for every user, which is why the earlier\
    \ listings showed the owner and group items as identical (dee).\n\n![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_218_0.png)"
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 200 Part III: Getting Up to Speed with Linux


    # Comprehending file types


    The first letter in any long format file listing tells you which type of file
    you''re dealing with. In Table 10-1, I list the types you''re likely to run into.


    | Label | Type | Description |

    | --- | --- | --- |

    | - | Regular file | The item is an everyday file, such as a text file or program.
    |

    | b | Block device | The item is a driver (control program) for a storage medium,
    such as a hard drive or CD-ROM drive. |

    | c | Character device | The item is a driver (control program) for a piece of
    hardware that transmits data, such as a modem. |

    | d | Directory | The item is a container for files, also referred to as a folder
    in some operating systems'' lungo |


    In addition to this, you find lots more different file types out there in the
    Linux world. By types, I''m not referring to extensions, such as .exe or .doc
    Linux sees everything within its filesystem — even directories and hardware like
    your monitor — as "files." As a result, assigning a type to a file is merely a
    Linux machine''s way of keeping track of what''s.


    The main thing Windows users in particular want to know when they move to Linux
    is how to recognize programs. Instead of looking for files with extensions (like
    .exe) programs have (or need to have) an executable permission so the system knows
    they are allowed to run. You can view or set this permission for a file by going
    to the Nautilus or Konqueror section and looking up how to do.


    On the command line, try out the file command, such as file Desktop, to find more
    about what a particular file contains.'
  merge: -1
  img_proc: true
