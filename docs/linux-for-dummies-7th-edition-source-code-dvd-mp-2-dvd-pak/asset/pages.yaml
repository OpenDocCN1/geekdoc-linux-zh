    # Upgrading Your OS


    When a new version of your Linux distribution comes out, you may find that you
    want to upgrade it. Typically, you can upgrade by downloading or purchasing the
    new version, starting it just as you would start a new installation but Upgrade
    rather than Install. That''s it!'
