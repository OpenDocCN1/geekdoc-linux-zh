    # Redirecting command output


    I discuss redirecting command output here because it''s by the most common information
    of detouring. One example of output redirection involves telling a command to
    send its results to a file rather than the screen, as you may have been seen using.
    Start in some familiar territory by typing ls -la - and then pressing Enter, to
    produce something the following:


    ```

    total 20

    drwx-xr-x 2 sue users 4096 Oct 30 07:48 .bash_logout

    -drwx-xr-x 1 root users 4096 Oct 30 11:55 ..

    -rw-r--r-- 1 sue users 24 Oct 30 06:50 .bash_profile

    -rw-r--r-- 1 sue users 124 Oct 30 06:50 .bashrc

    -rw-r--r-- 1 sue users 0 Jan 02 07:48 wishlist

    ```


    Want to send this information to a file instead? You can use the redirection operator
    to tell bash to send the data into a file rather than your screen. Enter the following
    command to send the data to a file named listing:


    ```

    ls -la > listing

    ```


    Notice that nothing displays on the screen, as you normally would expect. Because
    the shell has rerouted the output to a file named listing. To verify that the
    directory listing is there, enter the following command:


    ```

    cat listing

    ```


    The cat (and more) is explained Chapter 16.


    Note that if you type ls -la ~ listing again, the data is overwritten, meaning
    that the file''s contents are wiped out and replaced with the new output. You
    can avoid this situation by using >> which tells bash to add the command''s output
    to the end of the specified file.'
