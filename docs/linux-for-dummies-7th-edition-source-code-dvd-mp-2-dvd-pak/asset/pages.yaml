    # Listening to Downloaded Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s both legal and ethical, when it''s often they, depending on
    where you grabbed the music. I leave that ethical issue between you and your belief
    system, but because my own ethics say that it''s there, I''m going to focus on
    showing you music that you''re welcome to download — legally and ethically! Take
    a look at strategies for finding such music, along with how to listen to.


    One place to find such material is a band''s own Web site. Many groups realize
    that offering free downloads of their work is a great PR move — if people love
    the samples, they''re more likely to go out and buy the album. For example, I
    use one of my own favorite bands, Evanescence (www.evanescence.com).


    Evanescence, like many other bands, has its page mostly with Macromedia''s Flash
    tool. (See Chapter 12 for how to add this functionality to your distribution.)
    To listen to music in general, I personally recommend Amarok (which) you can get
    by using the tools discussed in Chapter 12 as well — see the section "Amarok"
    later in this chapter for more — but here are the defaults for each distribution:


    +   - Fedora: Choose Applications:Sound & Video:Rhythmbox Music Player.


    +   - Knoppix: From the Main Menu, choose Multimedia:Sound:XMMS.


    +   - Linsp: Choose Launch:Run Programs:Audio & MP3:Lsongs.'
