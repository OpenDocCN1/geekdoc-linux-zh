    # Word-Processing with OpenOffice.Org

    Writer


    Word processors are almost required equipment these days. Kids use them

    to write letters to their grandchildren. Grandparents use them to write letters

    to their grandkids. Whether you''re working on the great American novel or a

    school book report, OpenOffice.org Writer has all the best features you

    to find these days in a word processor.


    # Starting it up


    To start OpenOffice.org Writer in the distributions covered in this book, do

    the following:


    +   - Fedora Core: Choose Applications::Word Processor. Or you can

    click the Word Processor button on your upper panel.

    - Kroppix: From the Main Menu, choose Office::OpenOffice.org::nOpenOffice.org.

    - Linsphere: Choose Launch::Run Programs::Business & Finance::nOpenOffice::OpenOffice
    Word Processor.

    - Mandriva: From the Main Menu, choose Wordprocessors::nOpenOffice.org.

    - SuSE: From the Main Menu, choose Applications::Word

    processor::OpenOffice.org.

    - Xandros: Choose Launch::Applications::OpenOffice.org::Word

    Processor. Xandros users who purchased the product also may have

    t option to install StarOffice through Xandros Networks (see Chap-

    ter 12), which is the commercial version of OpenOffice and contains'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Chapter 17: Word Processing and More with OpenOffice.org


    additional fonts, templates, and more. Some purchasers also automatically have
    CrossOver Office (www.codeweavers.com) installed, which allows them to run Microsoft
    Windows applications such as Microsoft Word. See Chapter 19 for.


    +   * Ubuntu: Choose Applications-OpenOffice.org Writer


    # Taking a tour of OpenOffice.org Writer


    Before you proceed, take a look at the GUI layout shown in Figure 17-1.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_324_0.png)


    # Menu bar


    Along the top of the window is the menu bar, something you should be used to typically
    work in Microsoft Windows. OpenOffice.org Writer has all the features you expect
    from a modern word processor. It has too many to cover in depth, so I give you
    instead a (nonexhaustive) summary of what you find on each major menu:


    +   * The usual Open, Save, Save As, Print, and Print Preview (under the term
    Page View) commands, along with a set of wizards (under the term AutoPilot) plus
    the ability to send documents through e-mail, create templates, create Web pages,
    and to access your database information'
