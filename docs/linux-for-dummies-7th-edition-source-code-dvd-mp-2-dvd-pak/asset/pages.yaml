- pgno: 76
  md: '# Chapter 4


    # # Installing Other Linux Distributions


    **In This Chapter


    +   * Kick-starting Linux with Knoppix

    * Loving Linsp

    * Demystifying Mandriva

    * Getting to know SuSE

    * Utilizing Ubuntu

    * Zapping your brain with Xandros

    * Utilizing LiveCDS and LiveDVDs

    * Discovering ever more Linux!


    A quick read in any of the chapters in this book should give you the picture that
    Linux is more than just some newfangled computer program. Linux is a fully equipped
    workshop of software tools and building materials that you can use to construct
    any of a wide spectrum of computing solutions. Developing the killer Linux distribution
    has been the Holy Grail of the Linux community. This ultimate Linux distribution
    would provide all the support and capability that the preschooler, the rocket
    scientist, the housewife, and the crotched old computer science professor would
    need to harness power with Linux.


    However, it''s just impossible to make something that makes everyone happy. In
    this chapter, I survey five of the most popular (and easy-to-install) distributions.
    Some of these are commercial, so if you''re considering getting one of them, my
    hope is that this chapter helps you decide which one (if not Fedora) meets your
    needs. I don''t cover every aspect of the commercial items (as how much support
    you get); for more information, see the distributions’ respective Web sites.


    Occasionally in this chapter, I mention burning "ISO image" onto a CD-ROM or DVD-ROM
    — an ISO image is a file whose in .iso and holds the contents of a CD or a DVD.
    When this subject comes up, refer to the sidebar “Burning your ISOs” for tips.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 58 Part I: Getting Your Wet Feet


    # Jump-Starting Linux with Knoix


    In Chapter 2, I explain that Knoix is included on the DVD-ROM comes with this
    book. You can boot with the book''s DVD-ROM and just press Enter at the prompt,
    skipping any need to install anything on your computer (Linux runs directly from
    the DVD). If you''re concerned about messing up your computer with an installation,
    give Knoix a try.


    > TIP

    If you can''t use the DVD-ROM included with this book, you can download the CD-ROM
    image to burn onto your CD by going to www.knoppix.net/get.php. If you want to
    burn a larger version, you can get an image that fits onto a DVD by choosing the
    DVD version, keep in mind it will take much longer to download the CD image because
    it is a much larger file. Your download will tell you how long the download will
    take for your connection.


    # Living Large with Linspire


    Linspire (www.linspire.com) — formerly known as Windows — especially designed
    for people coming over from the Windows to Linux. This commercial distribution
    offers additional subscription services available as I describe in the "Recognizing
    some Linspire features" and "About the various Linspire versions" later in this
    chapter. Linspire is designed for ease of installation and adding of new software,
    and it contains many tutorials to help people get used to the system. Yet, Linspire
    isn''t designed in particular for the aspiring Linux geek.


    > TIP

    Linspire is built as a friendlier version of the more advanced, but popular, Debian
    (www.debian.org) distribution.


    If you''re curious about Linspire, you''re in luck — an ISO file to create your
    own CD-ROM of the full version of Linspire is included on the DVD-ROM that comes
    with this book! In Chapter 12 you find how to sign up for your free trial of the
    Click And Run Warehouse for getting and installing software, so you can decide
    whether it''s worth paying for membership after that.


    If you decide to purchase Linspire, you have a number of options:


    +   - Purchase online and download it immediately from the Linspire Web site.

    - Purchase it online and have a physical box shipped.

    - Purchase a boxed set in a store (www.linspire.com/linux_feature_reseller.php).

    - Purchase a computer with Linspire preinstalled (www.linspire.com/linux_feature_preinstall.php).'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Chapter 4: Installing Other Linux Distributions


    # Burning ISOs


    If you end up having to use the ISO files on the DVD-ROM or that you download
    to create distribution CD-ROMs or DVD-ROMs, I have some handy that can make this
    process easier for you.


    other distributions (or newer versions) onto them later. However, note, that burning
    hardware has to actually support rewriteable functions. Look on the front to see
    whether it says CD-R (it can''t rewrite), or CD-RW (it can rewrite).


    Get some good CD-burning software, such as the popular Nero. Another good program
    that''s free is BurnCD from www.terabyteunlimited.com/utilities.html. When you
    have a burning tool ready, look at the size of the ISO you want to burn. Most
    ISOs can be burned onto a 650MB/74 minute CD-R or CD-RW are large enough that
    you need 700MB (80-minute) discs installed. Knopsnoop is one Linux distribution
    that needs the larger CD-Rs. Another is Mandriva.


    As you prepare to burn your CD or DVD, make sure your software understands that
    you want to burn an ISO (look in the menu for image) and not just a file. If you
    burn your CD or DVD, put it into the drive, open it up, and then see only one
    file, you have burned incorrectly. An ISO should be unpacked onto the CD or DVD
    as a bunch of files and directories.


    When possible, use CD-RWs, because theyre rewritable and you can download and
    burn


    Finally, it''s a good idea to burn these types of CDs and DVDs at a speed of four
    or lower. You reduce your chance of introducing errors that way.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_78_0.png)


    Linspire offers a nice FAQ on burning the CD at http://info.linspire.com/installhelp/.
    The info is helpful whether you''re burning it from the DVD-ROM that comes with
    this book, or one you acquired from Linspire directly.


    # Installing Linspire


    Linspire is primarily a commercial distribution, and you have access to this through
    the ISO included on the DVD-ROM that comes with this book. I cover this full Linspire
    Five-0 release. Differences between this and other versions are addressed in the
    "About the Linspire versions" section later in this chapter.


    To install Linspire Five-0:


    +   1. Place the CD into your CD-ROM drive.

    2. Boot the machine.


    If the machine ignores your CD-ROM and tries to boot normally, Chapter 2 on how
    to make the necessary changes to your BIOS.'
  merge: -1
  img_proc: true
