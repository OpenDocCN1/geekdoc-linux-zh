    # The Lock Screen tool


    If you have your screen turned on and choose the Lock Screen option from the main
    menu, your screen appears or fades to black. Then if anyone moves the mouse or
    uses your keyboard, a dialog box appears with your login name and a password field.
    You can get back to work by entering your password. Until then, you''re safe in
    knowing that no one can musey upon your computer and send off a joke e-mail to
    your boss pretending to be you. Note that if you''re logged in as the root user,
    the Lock Screen option doesn''t.'
  merge: -1
  img_proc: true
