- pgno: 190
  md: '# Chapter 9: Using the Internet


    # Taking Advantage of Instant Messaging


    Instant messaging (IM) between people is like using a telephone — except that
    you type your conversation rather than speak it. In addition, you can simultaneously
    hold multiple instant messaging conversations without the need for additional
    connections to the Internet. America Online (AOL) provides one popular messaging
    service, named AOL Instant Messenger, or AIM. Others are ICQ, MSN, Yahoo, and
    Google. A wide variety of computer operating systems, including Linux, support
    these various services (and, in fact, GAIM runs on more than Linux).


    The distributions covered in this book use the following instant message programs
    by:


    +   - Fedora: GAIM (http://gaim.sourceforge.net/)

    - Knoppix: GAIM

    - Linux: GAIM

    - Mandriva: Kopete (http://kopete.kde.org/) and GAIM

    - SuSE: GAIM and Kopete

    - Alexandros: Kopete

    - Ubuntu: GAIM


    Because GAIM is the default in Fedora, that''s what I cover in detail. Kopete
    should work about the same.


    # Using the GAIM Instant Messenger


    You launch GAIM with the following menu selections:


    +   - Fedora: Choose Applications▸Internet▸Internet Messenger.

    - Knoppix: From the Main Menu, choose Internet▸GAIM Instant Messenger.

    - Linux: Launch▸Run Programs▸Internet▸Instant Messenger.

    - Mandriva: From the Main Menu, choose Internet▸Instant Messaging▸GAIM.

    - SuSE: Applications▸Internet▸Chat▸GAIM Instant Messenger.

    - Ubuntu: Applications▸Internet▸GAIM Instant Messenger.


    After the application starts for the first time (see Figure 9-13), its main and
    account management dialog boxes both appear. To tell GAIM about one of your accounts:'
  merge: -1
