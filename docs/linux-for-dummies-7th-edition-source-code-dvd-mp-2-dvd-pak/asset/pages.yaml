- pgno: 159
  md: '# 140 Part II: Internet Now!


    +   - Integrated Services Digital Network (ISDN): Not too long ago, ISDN was one
    of the only residential high-speed options. It appeared when 28 Kbps (half the
    speed of today''s regular dialup modems) was about all that you could milk from
    the copper strands that connected your telephone to the telephone company. ISDN
    is still available in some areas and promises a 128 Kbps — as long as you''re
    within 3.4 miles of the telephone company''s central office. You need two devices
    to use ISDN: an ISDN modem (typically provided by the ISP) and a network adapter
    (an Ethernet cable). Because ISDN is used so little these days, not many specific
    sites are devoted to it. The overall modem HOWTO (www.tldp.org/HOWTO/Modem-HOWTO.html)
    contains pointers to the latest ISDN information, as well as just being plain
    to understand.


    # Beware of devices posing as modems


    I try to save you from frustration —and your computer from your ball-peen hammer.
    Many Linux newbies have become irritated by not being able to communicate with
    their internet modes. "After all," the newbie swears, "the same hardware when
    I was running Microsoft Windows."


    labels can be misleading because some manufacturers just don''t to list other
    operating systems even though their hardware will work with those operating systems.


    +   - Windows recognizes your modem, but Linux doesn''t.


    Well, here''s the story: Years ago, hardware manufacturers developed a device,
    modem, in an effort to reduce hardware costs. The idea was to trim responsibility
    from the modem and delegate these tasks to the operating system. The result was
    an inexpensive modem that routed signals to proprietary software that operated
    only under Microsoft Windows. In fact, these-called modems, also known as WinModems,
    are really not modems at all, but telephone cables into Windows.


    In short, if you have a softmodem, Linux simply doesn''t work with it. For the
    adventurer out there, the LinModem project (linmodems.org) has successfully Linux
    drivers to work with a few of these software modems. I encourage you to involve
    in this type of project, if you''re moved. These explorers define the wonderful
    world of freedom software, Linux is a prominent part of.


    The following list shows methods you can use to determine whether you have a software
    modem:


    +   - The modem number has a HCF, HSP-, or HSF- in front of it.


    +   - The packaging refers to the device as a WinModem or designates that it works
    with only Windows (though sometimes these


    The bum in all this is, you probably saved a few bucks by buying a machine with
    a software modem, which you likely need a real modem to use with Linux (unless
    you are lucky enough to have a LinModem). Your best bet is to purchase an external
    modem so that you can leave the software modem in place and have the external
    one just for Linux (or any other computer you may want to move it to).


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_159_0.png)'
  merge: -1
  img_proc: true
