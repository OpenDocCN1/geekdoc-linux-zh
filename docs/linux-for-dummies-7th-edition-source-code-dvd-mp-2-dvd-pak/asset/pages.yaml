    # Laying pipes


    Another bash feature enables you to connect commands so that the output of one
    becomes the input for the next. This feature is referred to as a pipe. Suppose
    that you want to look over the details of all files in the /etc directory in long-listing
    format. If you type ls -la /etc to do so, a massive listing appears and much of
    the information scrolls past you. Although you can back up a bit by pressing Shift-PageUp,
    you may not be able to see everything.


    To see all the information, you can do one of things:


    +   * Send the data to a file with redirection by typing something like ls -la
    /etc > ~/extclisting and then review the contents of ~/extclisting with your favorite
    editor.

    * Pipe the output to the more command(see Chapter 16).


    To pipe the output to more, type ls -la directory_path | more, where directory_path
    is the directory for which you want to list the contents. The | (which on the
    keyboard looks like two vertical bars stacked on top of each other rather than
    just one solid line) tells bash that you want to use a pipe.'
