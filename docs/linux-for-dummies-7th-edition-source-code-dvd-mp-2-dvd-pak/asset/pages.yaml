  md: '# Chapter 15: Gettin'' Gooey with the GUIs


    If you''re not happy with where a desktop icon is placed, click it and then drag
    it to a new location. For a panel entry, right-click it and choose Move. This
    option allows you to drag the icon to where you want. Click to fix it into place.


    You can also add a drawer (menu button) to your panel for an entire menu. You
    do so:


    +   1. Click Applications and browse to the submenu you want to add.

    2. Enter that submenu.


    For example, if you want to add a button for the Graphics menu to your panel,
    open the Main Menu, move your mouse to the right into the contents of the Graphics
    menu,


    +   3. Right-click to open the context menu.

    4. Choose Entire Menu, and then either Add This As Drawer To Panel or Add This
    As Menu To Panel.


    A drawer shows you contents in icons only, while a menu looks more like the actual
    submenu from the Main Menu.


    # Removing a program from the desktop or the panel


    To get rid of an icon you have on your desktop, right-click the icon and choose
    Move To Trash from the shortcut menu that appears.


    If you want to remove one of the programs on the panel, just right-click the icon
    you want to remove and choose Remove From Panel from the shortcut menu that appears.
    The icon vanishes from the panel. That''s it!


    # Customizing KDE


    Don''t worry, KDE users: You have plenty of options, too. You can customize your
    KDE setup in lots of ways, from the functional to the practical, so that you truly
    enjoy it. As GNOME, in fact, you can choose from far more features than I have
    room to cover in this chapter, so if you enjoy fiddling with the look and feel
    of your GUI, do some exploring on your own!


    # Applets keep fallin'' on my head


    Applets are minprograms that do all sorts of things. An applet may display the
    time, show system status, or even a little frivolous fun. All kinds of applets
    are available out in the great world of computer programming. A number of applets
    are included with your default KDE installation, although some of them are more
    useful than others.'
