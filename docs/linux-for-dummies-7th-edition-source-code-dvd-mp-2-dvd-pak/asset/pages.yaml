  md: '# 324 Part IV: Getting Things Done


    and expand drop-down list boxes that represent standard presentation software
    functions, such as arrow styles, colors, line styles, and other formatting instructions.


    # Ruler


    Directly below the line and filling bar in a default OpenOffice.org setup are
    the rulers. These items mark out the margins and tabs, for example, of your document
    in the measuring system of your choice. Change which system you want to use, right-click
    the ruler and change the Measurements to your preferences.


    # Your document


    Click in that big space and start doodling. You can also access a format pop-up
    menu by right-clicking in the document section.


    OpenOffice.org Draw appears at first glance to have the most limited type support
    for saving when you use the Save As dialog box, but in fact, it supports a wide
    range of graphics formats. You can save images to a format other than the OpenOffice.org
    Draw format (.ODG) by choosing File:...


    Supported graphics formats are BMP, EMF, EPS, GIF, JPEG, MET, PBM, PCT, PGM, PNG,
    PPM, RAS, SVG, SWF (Flash), TIFF, WMF, and XPM.


    # Drawing bar


    Beneath the document window is a drawing toolbar, which allows you to select lines,
    arrows, shapes, and more for your drawing creation needs. Of these buttons have
    downward-pointing arrows, which allow you to see the full range of features they
    offer.


    # Managing Data with OpenOffice.org Base


    Those who are used to using Microsoft Access, or who have to interact with a variety
    of database products, have in the past been left scratching their heads and wondering
    how to handle these needs under Linux. Well, no more! OpenOffice.org Base provides
    an interface to both Microsoft Access files and to other databases. This software
    is only available with those distributions that include OpenOffice.org either
    as updates or by default at installation time.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Chapter 17: Word Processing and More with OpenOffice 325


    # Starting it up


    To start OpenOffice.org Base in the distributions I cover in this book that include
    OpenOffice.org 2, do the following:


    +   - Fedora Core: OpenOffice.org Base isn''t installed by default in Fedora with
    the rest of OpenOffice.org. Use Chapter 12 to add OpenOffice.org Base from the
    Applications:Office/Productivity section''s optional packages. After you have
    installed it, open it by selecting Applications:Database Development.

    - Knopix: From the Main Menu, choose Office:OpenOffice.org:Base.

    - SuSE: Choose Applications:Office:Database:OpenOffice.org Base.

    - Ubuntu: Choose Applications:Office:OpenOffice.org2 Base.


    There are many ways you can use this program. The essentials involve creating
    a database from scratch in a file or working with Microsoft Access files, and
    working with databases that were created to use with many major database servers—even
    over the network. There are so many approaches and my space is limited, I will
    focus on two of the more common choices: creating new database files, and opening
    existing files, which includes Microsoft Access files.


    The first interface you encounter when opening anything but a document you already
    worked with from the File:Recent Documents menu is the Database Wizard (Figure
    17-6).


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_344_0.png)


