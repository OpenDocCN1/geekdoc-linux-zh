  md: '# Chapter 2: Prepping Your Computer for Linux


    # Double-Checking Hardware Compatibility


    Most hardware these days works fine with Linux. Okay, sometimes the latest whiz-bang
    video card or other fancy new electronic widget may run into trouble; if you''re
    an early-opter sort of person, check your distribution''s hardware-compatibility
    list and make sure you''re covered. If you like to be organized and check out
    hardware ahead of time anyway (or if you run into problems and want to do research
    to see what''s wrong), check out the following:


    +   Your distribution''s Web site:

    * Fedora: There''s no official Fedora hardware list as yet. In the meantime, you
    can use the Red Hat listings at http://hardware.redhat.com/hcl/. Keep in mind
    that this list focuses on business equipment instead of home stuff and doesn''t
    entirely apply to Fedora.

    * Linspire: Check out www.linspire.com/windows_hwsw_compatibility.php.

    * Mandriva: Go to www.mandriva.com/en/hardware.

    * SUSE: The place to start is suse.com/private/online_help/. From here, click
    the Hardware Database link to search.

    * Ubuntu: Go to https://wiki.ubuntu.com/HardwareSupport.

    * Xandros: Check out http://support.xros.com/hcl.php.


    Don''t worry about items being Certified (heavily tested to make sure they work
    properly) or not. Supported (drivers are included and the hardware is known to
    work) will do just fine most of the time. These are for enterprise users who need
    such information.


    If you''re new to computers or aren''t familiar with hardware definitions and
    details, and are drowning in technical jargon, you can find a lot of information
    about hardware on the Internet. (One good site is www.tomshardware.com.) If your
    hardware isn''t listed, don''t panic.


    +   * Other Linux-oriented Web sites: You can also check the generic Linux hardware
    list at www.tldp.org/HOWTO/Hardware-HOWTO/

    * Web sites discussing your specific hardware: If you still can''t find the hardware
    list, point your Web browser to www.google.com/linux and do a Web search on the
    make and model of the hardware, plus the


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_52_0.png)'
