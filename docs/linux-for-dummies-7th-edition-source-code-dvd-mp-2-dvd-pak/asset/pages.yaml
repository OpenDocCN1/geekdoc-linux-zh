  md: '# Chapter 1: Getting Acquainted with Linux


    these computer manufacturers has, in some way, determined that Linux provides
    value for their customers (as well as for their own operations). Of these companies,
    the only one that has publicly denounced Linux is Microsoft. Note that one does
