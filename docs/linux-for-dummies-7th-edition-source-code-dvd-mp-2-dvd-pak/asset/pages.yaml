- pgno: 83
  md: '# 64 Part I: Getting Your Feet Wet


    # Recognizing some special Linspring features


    One of the most-talked-about special features of Linspring is its CNR (Click and
    Run) Warehouse. This online store allows you to surf through more than a thousand
    programs and purchase, download, and install them with just a few clicks. Even
    better, if you subscribe to the CNR service, lot of the items in the Warehouse
    are free. (No need to keep your CNR membership up-to-date if you use the software
    you downloaded; after you''ve got it, it''s yours.) I cover how to add software
    by using this service in Chapter 11.


    Another cost of some versions of Linspring is their audio/visual tutorials. After
    your installation is complete, the tutorials launch immediately and start walking
    you through how to use the system. You can stop them and come back to them at
    any time.


    # About the various Linspring versions


    The folks at Linspring are pretty creative about putting together packaging options.
    In the section "Living Large with Linspring" (earlier in this chapter), address
    various ways you can purchase this distribution. In this section, I look at the
    various ways Linspring is packaged for boxed sets and downloads. I''m not going
    to go into all the add-ons. (If I did that every distribution, this book would
    end up an encyclopedia!) Instead, I look at the main versions at the time of this
    writing:


    +   - Linspring Five-O: The main Linspring product. This version has lots of soft-included,
    along with support.


    +   - Linspring Five-O CNR: This version is the same as the previous one, except
    it comes with a year''s subscription to CNR (see Chapter 12) already bundled in
    — and offers additional support.


    Both versions of Linspring can be booted into a live version instead of actually
    installing the system. See the section "UsingLiveCDs and LiveDVDs," later in this
    chapter, to find out about distributions


    # Maxin'' Out the Fun with Mandriva


    Mandriva (www.mandrivalinux.com) — formerly Mandrake — has a huge, enthusiastic
    fan base. This distribution, designed in 1998 with the goal of creating an easy
    and intuitive installation for everyone, specializes in ease of use — for both
    server and home/office installations. To accomplish this objective, the creators
    of Mandriva focused on making an easy transition so you can move your Windows
    or Mac skills to Linux.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Chapter 4: Installing Other Linux Distributions


    In this section, I focus on the free version of Mandriva 2006 — though the commercial
    versions have an identical installation routine. The three ISO files required
    to install this distribution are included on the DVD-ROM that comes with this
    book, so just burn them onto CD-ROMs to get started — see Appendix B for where
    to find these files. You can also download this distribution for free (from www.mandrivalux.com)
    if you cannot use the DVD-ROM, or purchase a boxed set with manuals and more from
    the Mandriva online store (www.mandrivastore.com).


    In Chapter 2, I mention that Mandriva can resize your Windows partitions; no need
    to do this task ahead of time.


    # Installing Mandriva


    After you''ve burned or purchased Mandriva on CD-ROMs or a DVD, install it as
    follows:


    +   Place CD 1 or the DVD into your CD-ROM or DVD-ROM drive and reboot the computer.


    The initial screen appears. If the computer ignores your CD-ROM and tries to boot
    normally, see Chapter 2 on how to make the necessary changes to your BIOS.


    +   Press F1 to see more options (as when you know you have to use a specific
    option) or press Enter to start the installation.


    I assume that you press Enter. Progress bars let you know that things are happening,
    and then you reach the Language dialog box, as shown in Figure 4-6.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_84_0.png)


