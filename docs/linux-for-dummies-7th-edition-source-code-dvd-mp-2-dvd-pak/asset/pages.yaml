    # Partitions Versus Directories


    One very important (and geeky) thing to understand about the Linux filesystem
    is that it may not all be on one single hard drive or hard partition, and you
    dont have to keep track of what drive or partition it''s on when do in other operating
    systems. In the Microsoft Windows world, if you use separate hard drives or partitions,
    you have a specific letter designation for each one. The primary hard drive is
    C, the next is D, and so on. Under Linux, each of these drives and partitions
    quickly blends together.


    If you partitioned your hard drive you know that you need to specify a mount point
    for each partition — which is like an empty spot in a puzzle, where the outside
    partition or media can be plugged into the rest of the filesystem. In the case
    of a hard drive partition that is part of your /mnt/media part of the filesystem.
    It is an item in the root directory — maybe /boot or /usr — anywhere else in your
    directory hierarchy (/usr/share). Later, when you''re working on the computer,
    you dont need to know or care whether these directories or files are on one drive
    or multiple drives. You just do your thing.


    The times you need to know how Linux sees the hardware are when you''re trying
    to add new hard drives, install the machine while not automatic partitioning,
    or access temporary media. Table 11-4 lists a common breakdown of popular hardware
    designations. Note that these designations aren''t in /mnt or /media; they''re
    in /dev. They''re the actual device driver shortcuts — which point to the real
    drivers. These names are typically used for convenience so that you dont have
    to remember exactly which driver to deal with.'
  merge: -1
  img_proc: true
