    # # Sending and checking e-mail


    The following steps outline how to create a new e-mail message and send it:


    +   1. Click New.


    A Compose A Message window opens, as shown in Figure 9-11. If you want to open
    another new item such as a new contact list entry or a new calendar appointment,
    click the arrow next to New to open the list of options to choose from.


    +   2. Type the recipient''s e-mail address (such as bob@example.net) or a list
    of addresses separated by commas (such as bob@example.net, tom@example.org) in
    the To box.


    +   3. If you need to add a CC (Carbon Copy) or BCC (Blind Carbon Copy) to the
    list of recipients, open the mail message''s View menu and select the appropriate
    field(s) to appear and then enter the appropriate address(es) into those fields.


    +   4. Type the topic of your e-mail into the Subject text box.


    +   5. In the lower window, type the body of your e-mail.


    Use the handy formatting buttons and the Format menu if you want to "pretty up"
    your e-mail. If you want to use the formatting buttons, set your Format type to
    HTML first.


