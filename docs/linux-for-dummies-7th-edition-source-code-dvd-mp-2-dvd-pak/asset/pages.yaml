  md: '# 40 Part I: Getting Your Feet Wet


    To begin the installation from the DVD-ROM or CD-ROM, you must first ensure your
    system to start, or *boot*, from a DVD-ROM or CD-ROM. In Chapter 2, I cover how
    to configure a computer to boot from these devices.


    I concentrate on Fedora Core 5 and its installation for two main reasons:


    +   - Fedora Core 5 is included on the DVD with this book, and on the CDs you
    can order with your coupon.

    - Covering the installation of every Linux distribution in existence will make
    this book into a set of encyclopedias.


    I am assuming that you want to install a desktop. There are plenty of books out
    there focus on servers, so my goal is that Linux for D focuses entirely on those
    who want to use Linux as their actual desktop machine. Also, it is not possible
    to cover both desktop and server functions in a book of this size to a satisfying
    depth.


    Please note that if you''re using Red Hat Enterprise Linux, some other version
    of Core, or a different distribution of Linux, your screens will look different
    from what is shown in this book (for Linspire, Mandriva, SuSE, Ubuntu, and Xanders,
    see Chapter 4). Each Linux distribution routine covers the basic tasks, the specific
    actions may be presented in a different order, or be customized to look different
    on-screen. For example, one distribution may present account creation before network
    configuration, and another may have two topics reversed.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_59_0.png)


    With Fedora, until you reach the About To Install (GUI) screen, you can back out
    of the installation without changing anything on your system. None of the configuration
    options you make *before* you get to the About To Install screen are saved to
    your disks. After you continue beyond the About To Install screen, data is written
    to disk, and your system is changed.


    # The Installation Process


    In this section, I follow the graphical installation. If you cannot use the graphical
    installer for some reason (if Linux doesn''t support your video card, for example),
    follow the text-based installation instead. The steps are the same, it''s just
    not as pretty, and you don''t get all the options that you have available in the
    point-and-click version.


    Since the DVD that came with this book has multiple distributions on it, the boot
    screen is different from the default that you will find if you are installing
    Fedora Core 5 directly from your own DVD or CDs. For some reason you are using
    a DVD or CDs that only contain Fedora Core 5, then follow the instructions but
    just press Enter when you reach the boot prompt. Those who are using the DVD that
    came with this book should do the following:'
