  md: '# Chapter 6: Checking Those Desktops


    # 103


    only come with their default GUI. GNOME and KDE are excellent desktops with strong
    bases. It’s a personal preference, so I encourage you to install and experiment
    with both — and see which you like better. When you ask people why they chose
    one over another, often they really can''t give you much of a answer aside from,
    “That’s what I''ve always used.” Keep this in mind when you try to convince you
    that one or the other is the best thing since sliced bread!


    The cool thing is that you can run KDE programs under GNOME and vice versa. This
    ability is vital when it comes to making it easier on developing (and users) in
    the Linux community.


    I cover how to switch between KDE and GNOME later in this chapter, in the section
    “Switching between GNOME and KDE.”


    # Making the Best of the Command Line


    The Linux command-line interface provides a quick, efficient way of entering commands
    and executing actions. Even if you’re mostly a “GUI user,” after you get the hang
    of using the command line, discover that it’s faster to perform tasks at the command
    line than with a mouse in the GUI environment. However, if you prefer to use a
    GUI interface as your working environment, you can easily open a terminal window
    which is a command-prompt window, to perform your command-driven tasks without
    having to completely leave the point-and-click environment (see Chapter 14).


    There are some interesting things that you might find useful about using the command-line
    interface. One difference between the Linux command and other interface commands,
    like the Windows MS-DOS prompt, Linux commands are case sensitive. Typing ls,
    and in fact, you gives you an error because there is no LS command. The Linux
    command line also has an autocompletion feature. If you know the first few characters
    of a command or filename, type part it and press Tab to complete the rest automatically.
    For example, if you’re trying to use the less to view the contents of the file
