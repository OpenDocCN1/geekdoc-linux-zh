    To update your Fedora Core system:


    +   1. Select Applications::System Tools::Software Updater.


    This action opens the Package Updater (pup) dialog box, as shown in Figure 12-1
    — you may first be to enter your root (administrative password). You will likely
    have to wait while the tool reaches out to the Internet and loads update information.
    When this process is complete, the dialog box closes.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_242_1.png)


    Figure 12-1: The Fedora Package Updater.'
