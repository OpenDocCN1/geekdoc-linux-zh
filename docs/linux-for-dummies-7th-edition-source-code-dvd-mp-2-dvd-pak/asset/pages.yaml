    # ## Listening to Internet Radio


    Listening to Internet radio stations in Linux is not always the simplest thing
    in the world, depending on your distribution. Because of various laws, patents,
    licensing problems, some formats like MP3 are not always supported out the box.
    The best way to see what you''re set up to support right now is to simply try
    and listen. After you''re sure that your sound is set up properly, you can try
    many Sites with your browser:


    +   - SHOUTCAST for finding links to thousands of offline stations, at www.shoutcast.com

    - Radio-Locator for finding "regular" radio stations offering online versions,
    at www.radio-locator.com


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_361_1.png)


    In Linspire''s Lsongs, SHOUTCAST stations are already available by default.


