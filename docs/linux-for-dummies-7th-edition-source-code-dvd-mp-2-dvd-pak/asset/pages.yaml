- pgno: 314
  md: '# # Chapter 16


    # # Putting the X in Text


    **In This Chapter**


    +   - Viewing the contents of text files

    - Manipulating text files in nano

    - Editing text files with Kate

    - Working with text files in gedit


    From text editors to word processors, Linux offers a wide variety of options for
    working with words. In this chapter, I take a look at different ways to view the
    contents of a text file, using some simple text editors in both the non-GUI and
    GUI environments. In Chapter 17, I take a look at office suites for those who
    rather do word-processing.


    # # Viewing the Contents of a Text File


    Almost all configuration files in Linux are text files. In addition, many pseudo-programs
    (called *shell scripts*), all HTML documentation, and many other items in your
    system are text files. Fortunately, if you just want to see what''s in a text
    file and don''t want to do anything to its contents, you don''t have to use an
    editor or word processor. You can use three command-line commands to view text
    files: *cat*, *less*, and *more*. I bet that you will grow to love them.


    Yes, that first command is *cat* and it''s taken from the word *concatenate*,
    which means to bring together end to end — you can use the *cat* command on multiple-text
    files to have their text joined, one file''s contents directly after another.
    Typically you use this command in the Linux in the format `cat filename`, where
    the contents of the file *filename* are displayed on the screen. For example,
    if you create the short text file *greetings* and then type `cat greetings`, you
    see the following:


    ```

    $ cat greetings

    These are the contents of the greetings file.

    Meow!

    $ _

    ```'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 296 Part IV: Getting Things Done


    Of course, if the file contains more than a screen''s worth of information, cat
    spews it out at one time like a big handful, and all but the last screen of text
    scrolls off the screen. It''s a good thing that you have other choices. The one
    you''re likely to choose is less, which displays the contents of a file full screen
    at a time. Then you press the spacebar to continue to the next screen. You can
    also use the arrow keys to move up and down one line at a time, if you want.


    An alternative to less or more. The main difference between the two is that with
    more, you can move only forward through the file and see only a screen''s of information
    at a time. You can''t back up.


    To use less or more, the format is similar to the format used with the cat command:
    less filename or more filename. When you finish-ing the document, press Q to exit.


    # # Editing Text Files with nano


    If you aren''t using (or can''t use) the GUI, then you have numerous text edi-tors
    to use. The most powerful of these are vi and emacs, which you''ll hear many people
    go on about. However, both programs require a learning curve. For beginners who
    want to edit the dang file and move, I recommend nano and pico. These two editors
    are very similar, and one or the other is typically included with most Linux distribution
    (but, unfortately, not all). The "friendly" text editors included with the distributions
    dis-cussed in this book


    +   - Fedora: nano in the DVD version only — joe is included in the CD

    - Knoppix: None; see Chapter 12 to add nano through CNR

    - Linspire: None; see Chapter 12 to add one (jed and joe are both)

    - Mandriva: None; see Chapter 12 to add one (available)

    - SuSE: pico

    - Ubuntu: nano and pico

    - Xandros: editor, which has a function keys at the bottom of its screen


    To open a file in nano, type nano filename, such as nano file1. This action opens
    the file in the nano editor, as shown in Figure 16-1.


    You can then edit or type in that file as much as you need to.'
