  md: '# Chapter 10: Manipulating Files and Directories 193


    # Copying and moving files


    You can copy and move items using two different methods in Conqueror. The first
    is by using the usual method you''re probably familiar with — clicking and grabbing
    a file or folder and dragging it where you want to go. The Tree View is handy
    for this method because you can open folders until you find the one you want to
    copy into and then click and drag the file or folder it. When you do so, a little
    context menu popups up asking you whether you want to move the file, copy it,
    cut it, link it (see the section “Understanding long format file listings”) to
    find out more links; they''re basically shortcuts), or cancel and do not anything.


    The other method for copying and moving files and directories involves the following
    steps:


    +   1. Right-click the file or directory you want to copy or move.

    2. In the context menu that appears, choose Copy if you want to copy the file
    or Cut if you want to move it.

    3. Select the folder you want to move the file into.

    4. Right-click in an empty spot in the folder and select Paste.


    # Deleting files and folders


    To use Conqueror to delete either a file or a directory from the filesystem, follow
    these steps:


    +   1. Browse to the file or directory''s location.

    2. Choose the file(s) or folder(s) you want to delete.

    nYou can do so by:

    * Holding Shift down and clicking at the end of the row or column that you want
    to select. (These items all must be lined up straight)

    * Holding Ctrl down and clicking each individual item you want to select.

    * Clicking and dragging your mouse button so that you make a box that contains
    all the items you want to select.


    +   3. Delete your file or folder.

    To do so, either:

    * Press the Delete key and say that yes, you want to move this item or these items
    to the Trash.

    * Right-click over the item(s) and choose either Delete to permanently remove
    the file or Move To Trash to give yourself the option to back up and pull it out
    of the Trash later.'
  merge: -1
  img_proc: true
