    # Installing Ubuntu


    There are two versions of Ubuntu, the LiveCD (which doesn''t require installation)
    and the Install CD (which does). The installation version is the one included
    on the DVD-ROM that comes with this book, and I focus on installing this version
    here. I want to reiterate that this is the most difficult installation of all
