- pgno: 300
  md: '# # Chapter 15


    # # Gettin'' Gooey with the GUIs


    **In This Chapter**


    +   - Adding applets to the panel

    - Adding programs to the desktop

    - Downloading and setting themes

    - Configuring the X Window System


    The X Window System (or X) opens a world of possibilities. X is, in general, a
    set of applications that work together to provide a graphical interface. Think
    of these applications as the wireframe beneath you GUI, with GNOME and KDE (see
    Chapter 6) offering the pretty matching coating. Some of these applications draw
    windows, some manage the look and feel, and others handle aspects of the graphical
    world for you. All of them are configurable and even replaceable, which is enough
    to make the average user''s eyes cross with too many options!


    GNOME and KDE are entirely creatures of convenience, offering integrated sets
    of windowing so that you don''t have to pick and choose your components. In this
    chapter, you get a chance to alter both KDE and GNOME''s behavior to suit your
    needs. For example, if you have hard reading in those small-prompt windows in
    the GUI, you can make both the windows and their fonts larger. You can change
    a wealth of things, so read on and take a look.


    If something goes terribly within the GUI and you need to exit in a hurry, press
    Ctrl+Alt+Backspace. This key combination does one of two things. If you boot into
    the GUI, it collapses your GUI session and takes you to the login prompt. However,
    if you boot to the command line, this combination collapses KDE immediately, taking
    you to the command line.


    Press Ctrl+Alt-Backspace only in an emergency. This key combination doesn''t cleanly
    stop the programs involved. You end up with all kinds of bits and pieces of programs,
    files, and other junk on your system.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 282 Part III: Getting Up to Speed with Linux


    # Changing GNOME''s Look and Feel


    > Change is inevitable, except from a vending machine.


    The GNOME desktop environment has an amazing set of features for your explore.
    Some of these customization features are nice and practical, and others are just
    plain fun. I tried to group the types of changes into related topics so that you
    can peruse them easily. In GNOME-based distributions (Fedora, suSE, and Ubuntu),
    you can typically find all the GNOME configura-options by going to the System
    or Desktop menu and then the Preferences submenu.


    # How do ya like them applets?


    Applets are a collection of miniprograms that do anything from display the time
    to show system status — some even show the depressing trickle of your battery
    power running out if you''re using a laptop. Some, of these miniprograms are more
    useful than others. Then again, everybody needs a bit of entertainment to you,
    right?


    # Adding an applet icon to the panel


    You can have sifting to see what kinds of applets are available to you. Look through
    your options and perhaps add an applet to the panel (remember that the panel is
    the bar along the top and/or bottom of your screen), follow these steps:


    +   1. Right-click any space on your top or bottom panel and choose Add To Panel.

    The Add To Panel dialog box appears, as shown in Figure 15-1. While the dialog
    box will look different in Ubuntu, it works the same.

    If you don''t see an Add To Panel command, you''re probably looking at the context
    menu for one of the applications on the panel. Try right-clicking elsewhere on
    the panel or closing some programs so that you can free up space amongst the minimized
    programs in the middle of your panel.

    2. Browse the available applets.

    3. After you select the applet you want to add to your panel, click Add.

    The applet is now on your panel.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Chapter 15: Gettin'' Gooey with the GUIs 283


