    # Recovering a Root Password with Knoppix


    If you''re using SuSE, Linspire, Xandros, or another distribution that requires
    you to enter a root password to enter single user mode, you need external tools
    to help recover when you forget your root password. This problem is another reason
    that many system administrators keep Knoppix on. To recover your root password,
    do the following:


    +   1. Place the Knoppix CD into your CD-ROM drive and reboot the computer. After
    the computer successfully boots into Knoppix, determine which partition refers
    to your main Linux installation. If you currently do not have a file browser open
    anywhere within that partition (see Chapter 11 for discussions of partitions),
    click the partition icon to open the browser.


    You''re looking for your root (/) partition. Chapter 11 details what you need
    to find there. Basically, open each of the partition icons on your desktop and
    figure out which one looks like the right section of your filesystem. For example,
    if the root partition is /dev/hda3, click the Hard Disk Partition [hda3] icon.


    +   2. Click the Terminal Program icon on your panel and then type - to access
    the root user''s account. Make sure to close the file browser window that''s accessing
    your root partition, and then type remount rw /dev/partition to remove the partition
    and read it as a full-write filesystem.


    You''re not prompted for a password when switching to root. For an example of
    what to type, if your root partition was /dev/hda3, you type cd /mnt/hda3.


    +   3. Type cd /mnt/partition/etc to change to the /etc directory inside the mounted
    root partition''s base directory.'
