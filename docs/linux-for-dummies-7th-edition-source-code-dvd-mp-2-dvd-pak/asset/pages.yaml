- pgno: 404
  md: '# Appendix A


    # Common Linux Commands


    In This Appendix


    +   - Archiving and compression commands

    - Communication commands

    - File commands

    - System control commands


    Computing novices often marvel at the keyboard dance Linux experts typically perform.
    Sure, these experts know modern advances like the mouse and graphical interface,
    but these keyboard musicians prefer the home keys and find that they can work
    faster that way. It takes some time to reach this level of proficiency, but every
    expert was a novice at one time, and any novice can become an expert with plenty
    of practice.


    In this appendix, you find the commands listed by themes, according to what they
    can actually do for you.


    So, read on — dazzle your friends with your command-prompt finesse. When they
    ask you how and where you figured out all those commands, just smile and mumble
    something about the voices in your head — and, of course, keep this section dog-eared
    and within reach of your computer.


    # Linux Commands by Function


    Because every command serves a specific purpose, organizing these tools into groups
    according to their individual functions is not difficult. If you know what you
    need to do but don''t know which command does the job, flip through this section
    to start your search. From here, you can dig further by referencing man pages
    and other help information (online sites and reference books, for example) or
    by looking in this book''s index for further coverage.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# 386 Part VI: Appendixes


    To access a man page, type man command at a command prompt. For example, ls shows
    the help information for the file listing command.


    # Getting Help


    When you''re digging around for help on a command, you can call on an interesting
    range of shell commands for assistance, as shown in Table A-1.


    | Table A-1 | Shell Help Commands |

    |---|---|

    | Command | Purpose |

    | apropos | Looks for commands that contain a keyword in their page descriptions.
    |

    | info | One way of finding help information. You can find instructions for this
    tool at manual/gnu.org/software/texinfo/info/, or you can use the built-in tutorial
    by starting the info tool and pressing the H key inside it. |

    | man | The primary way of getting help in Linux and Unix. |

    | whatis | Gets a one-line description of a command. |


    Finding details about the command-prompt options of a command is a never-ending
    pursuit. The man page system provides some helpful guides at your fingertips for
    rapidly finding this detailed information.


    # Archiving and compressing


    Although disk space isn''t as much of a premium as it was once, bandwidth and
    backup media are still. Subsequently, this group provides a potpourri of tools
    for compacting and organizing data for storage, as shown in Table A-2.


    | Table A-2 | Archiving and Compressing Tools |

    |---|---|

    | Command | Purpose |

    | bzip2 | Compresses files into .bz2 format. Mostly used for incredibly large
    sets of text files (which is what source code actually is). |

    | bunzip2 | Uncompresses .bz2 files. |'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Appendix A: Common Linux Commands 387


    | Command | Purpose |

    | --- | --- |

    | compress | Compresses files into .z format. Pretty old and not used much in
    the Linux world. | |

    | gunzip | Uncompresses .gz files and .tgz files. |

    | gzip | Compresses files into .gz format. |

    | tar | Packages files together in a group. The most common way of using this
    command is tar xvf filename, such as tar xvf download.tar. |

    | uncompress | Uncompresses files from .z format. |

    | unzip | Uncompresses files from .zip format. |

    | zip | Compresses files into .zip format. |


    # Built-in bash commands


    Some commands don''t even exist if you try to look up their help in the man pages,
    and the commands don''t show up as files on your system. Remember, you type commands
    at the prompt, you''re communicating with a type of program called a shell. (In
    my case, it''s bash, the default Linux shell.) The shell has a set of commands,
    included in the following list, that you can use to communicate with it, as shown
    in Table A-3.


    | Table A-3 | Shell Commands |

    | --- | --- |

    | Command | Purpose |

    | alias | Creates or lists command shortcuts. |

    | env | Lists your current environment variables and their settings. |

    | export | Whenever you''re told to set an environment variable, create the variable
    and then use this command so that the variable will be remembered properly. |

    | history | Lists off the last 1,000 commands you''ve typed. |

    | unalias | Removes command shortcuts. |'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 388 Part VI: Appendixes


    If you try to view the man page entry for some of these commands, you find instead
    the help information for BASH BUILTINS loads. To search through this manual, press
    the forward slash (/) key to open the man interface and then type the name of
    the command you want to search for. Press Enter to start the search. The interface
    stops in the first spot where the term is found. If you want to try again, press
    the N key to proceed to the next occurrence of the word.


    For example, you might be reading the massive bash page (type man bash to access
    this page), but perhaps you''re only interested in related prompts, which are
    the bits of text that appear to the left of your cursor in a text window. An example
    prompt is


    ```

    [@catherine dee $]

    ```


    So, you might type /prompt and press Enter to jump down to the first instance
    of this word. If the text around the word doesn''t reflect what you''re looking
    for, you press the N key to jump to the next one, and so on.


    # Files and file system


    No matter what operating system you''re using, it''s hard to do anything without
    being able to find your way through and work with the file system. The following
    utilities help you find your way:


    # File organization


    Boxing, packing, sorting—I''m always shuffling files around my system. File organization
    commands provide tools for moving files and file units around, as shown in Table
    A-4.


    | Table A-4 | File Organization Tools |

    |---|---|

    | Command | Purpose |

    | cd | Changes directories. |

    | cp | Copies a file. |

    | df | Shows partitions and how much space they have. |

    | du | Shows how much disk is being used in the current directory and below. |

    | ln | Creates a shortcut. |'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Appendix A: Common Linux Commands 389


    | Command | Purpose |

    | --- | --- |

    | ls | Lists the contents of a directory or information about a file. |

    | mkdir | Creates a directory. |

    | mv | Moves or renames a file. |

    | pwd | Shows the path for the directory you''re currently in. |

    | rm | Deletes a file. |

    | rmdir | Deletes an empty directory. |


    # File attributes


    Files are much like candy bars. The wrappers provide information about the ingredients,
    size, and package date — all descriptive of the tasty nugget inside. (Perhaps
    the wrapper is even childproof.) Files keep all this wrapper information in an
    inode. Along with the capability to change inode information, these commands can
    return data about the content of the file, as shown in Table A-5.


    | Table A-5 File Attributes Commands |

    | Command | Purpose |

    | --- | --- |

    | chgrp | Changes the group associated with a file. |

    | chmod | Changes a file''s permissions. |

    | chown | Changes who owns a file. |

    | file | Shows what type of file you''re dealing with. |

    | stat | Shows some statistics about the file. |

    | touch | Creates an empty file of this name. |

    | wc | Shows how many words, lines, and so on are in the file. |


    # File locators


    Where, oh, where can my file be? These commands, shown in Table A-6, help you
    locate files in Linux''s monster tree-structure file system:'
