    world is GFTP. This program is available for all five distributions in this book,
    although it''s only installed by default in Mandrive. The KDE equivalent is K.

    **IRC programs:** While the IM clients support IRC these days, you may prefer
    a program that''s used only for IRC. Common programs for this purpose are X-Chat
