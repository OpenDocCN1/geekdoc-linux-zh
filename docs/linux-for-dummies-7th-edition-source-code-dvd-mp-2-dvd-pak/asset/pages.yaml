    manufacturer''s Web site. After you''ve entered the BIOS, you typically navigate
    with the arrow keys, Tab key, or Enter key. Some BIOS environments use the function
    keys; look for a list of function-key options at the top or bottom of the screen.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_56_0.png)


