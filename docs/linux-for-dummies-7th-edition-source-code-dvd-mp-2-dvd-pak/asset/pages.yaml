    # ### Formatting toolbar


    The Formatting toolbar is directly below the standard toolbar in a default OpenOffice.org
    setup — though not on all distributions. As usual, you can remove the Formatting
    bar at any time by using the View menu. This series of icons allows you to click
    buttons and expand drop-down list boxes that represent word-processing functions,
    such as styles, fonts, sizes, and formatting instructions. Most features on this
    bar are identical to what you see in most modern word processors. The button for
    paragraph background formatting is the only one that''s particularly unusual.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_327_0.png)


    This toolbar actually changes depending on what you''re doing. If your cursor
    is within a table, for example, then the object contains useful buttons for working
    with tables.


    # ### Ruler


    Directly below the Formatting toolbar in a default OpenOffice.org setup is the
    ruler. All word processors offer this item, which marks out the margins and tabs,
    for example, your document in the measuring system of your choice. To change which
    system you want to use, right-click the ruler to open the Measurements pop-up
    dialog box.


    # ### Your document


    Oh, yeah — that big, blocked-off white space that takes up most of the window.
    That''s — you work on your documents! Just click in there and start typing. You
    can also access a Formatting shortcut menu by right-clicking in the document section.'
