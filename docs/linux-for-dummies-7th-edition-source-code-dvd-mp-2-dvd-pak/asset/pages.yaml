  md: '# Chapter 9


    # Using the Internet


    In This Chapter


    +   - Browsing the Web

    - Checking and sending e-mail

    - Grabbing files

    - Sending instant messages


    > Give a man a fish and you feed him for a day; teach him to use the Net, and
    he won''t bother you for weeks.


    — Anonymous


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow you access to
    information across the Internet. Linux, along with the other Unix operating systems,
    has long supported and worked with the Internet. Practically all the different
    services available on the Internet are available from your Linux desktop.


    When you install Linux (see Chapters 3 and 4), one or more Web browsers, mail
    programs, and instant messaging tools are placed onto your new system. In this
    chapter, I introduce you to some tools you can use to access different services
    on the Internet, such as accessing Web sites, using e-mail, investigating newsgroups,
    and utilizing FTP — assuming that your Internet connection is configured (see
    Chapter 8).'
