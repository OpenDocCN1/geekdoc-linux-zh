    # Surfing the Web


    Firefox is your viewing window into the wonderful World Wide Web. Firefox''s primary
    purpose is to fetch Web pages on your command, download all their graphics and
    related files into your computer''s memory, and finally, render for your interactive
    viewing pleasure.


    If you''re using Internet Explorer or Netscape, using Firefox should be a snap.
    It has all the familiar navigation tools, such as an address bar; Back, Forward,
    Reload, and Stop buttons; and a feature that stores links to your favorite Web
    sites (bookmarks).


    Firefox, like Netscape, also has a History sidebar feature — press Ctrl-H to show
    or hide it (see Figure 9-5)—which you can use to access a Web page you recently
    visited.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_180_0.png)


