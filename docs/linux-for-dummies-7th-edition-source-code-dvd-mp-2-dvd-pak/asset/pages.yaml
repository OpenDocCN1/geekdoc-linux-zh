    language, select the appropriate language in the list and then click Next.


    If you want support for multiple languages, you can set that up by clicking the
    Languages button. When you click Next, the License screen appears. Read the license,
    select Accept, and then click Next. The Security screen appears.


    4. Leave your security level at Standard, unless you want to experiment with High.


    Going higher than High may make using the computer such a pain to use as a client
    that you''ll be tempted to shut off security completely, defies the purpose! Still,
    some people like to play with the really paranoid node. It''s up to you that you
    stayed with Standard.


    5. If you want to have a particular nonroot user (or e-mail address) on the system
    receive all security-related notifications (recommended), enter the login account
    you''ll be creating for that (or the e-mail address to use) in the Security Administrator
    text box; if not, skip to Step 6.


    Anything that reduces how much you have to log in as root is good, as long as
    it doesn''t also reduce your security. I tend to choose an e-mail address for
    this text.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_85_0.png)


    6. Click Next.


    The initial disk-partitioning screen appears. The options you see here depend
    on what the partitioning (DrakX) finds on your hard drive(s), so you may see something
    different than what I''m seeing.


