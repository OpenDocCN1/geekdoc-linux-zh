- pgno: 146
  md: '# Chapter 7: Configuring Linux


    # Zen and the Art of Linux Configuration


    One of the items that makes each distribution stand apart from the others is its
    collection of configuration tools. The friendlier the tools, the more likely that
    folks new to Linux will flock to that distribution. Mind you, old-timers don''t
    mind having easy tools around, especially when they''re moving from one distribution
    to another. It saves them from having to re-learn where each distribution keeps
    its configuration files.


    In this section, I look at the configuration tools available in each version of
    Linux covered in this book. An important thing to note is that the Control Panels
    in each of the KDE-default distributions (Knoppix, Mandriva, Linspire, and Xandros)
    all look (and work) in similar manners they''re all based on the main KDE Control
    Panel.


    # Fedora Core and Red Hat tools


    Red Hat''s Fedora Core community project comes with a number of tools developed
    by Red Hat for its commercial products, as well as a variety of tools built by
    the community, such as the GNOME Project''s tools. When it comes to customizing
    your desktop, you can find most of what you''re looking for by choosing System-Preferences.
    Instead of having a large control center, GNOME has opted to keep the configuration
    tools broken into smaller, individual programs. You find this layout in other
    GNOME installations as well.


    With the theme of smaller, more specialized tools, your various system-wide configuration
    options are available by choosing System-Administration.


    # Knoppix tools


    Knoppix comes with many tools that it''s easy to get lost as stagger around the
    menus, overwhelmed. The main place to find configuration tools in this distribution
    is by choosing Knoppix from the Main Menu (the letter K in the bottom left corner).
    Inside this menu is a set of submenus, of which offer configuration options:


    +   - Configure: Options for setting up your computer''s sound card, printers,
    a real home directory that sticks around between times you boot with this distribution
    (persistent Knoppix disk image), and more.

    - Network/Internet: Internet connection (see Chapter 8) programs for everything
    from modems to ISDN.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 128 Part I: Getting Your Feet Wet


    +   - Services: Options for starting various services useful on the desktop, such
    as SSH (see Chapter 13), Samba for offering Linux files to your Windows machines
    over your network, and a firewall.


    In addition to this location, you also find some configuration programs by choosing
    Settings from the Main Menu:


    +   - Configure The Panel: This program lets you customize your panel — moving
    it, hiding it, changing its appearance, and so on.

    - Desktop Settings Wizard: This option opens the KDE setup wizard.

    - Menu Editor: This option opens the KDE Editor, where you can customize your
    Main Menu contents.

    - Menu Updating: This option searches your system for particular programs and
    adds them to your menus if they''re not there.

    - Printing Manager: This program (see Figure 7-5) opens a handy manager that can
