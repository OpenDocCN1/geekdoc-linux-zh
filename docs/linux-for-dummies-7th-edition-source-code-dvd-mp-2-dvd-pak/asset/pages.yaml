- pgno: 386
  md: '# # Chapter 20


    # # Ten Troubleshooting Tips


    **In This Chapter


    +   * Dealing with frozen installations

    * Changing your boot environment

    * Recovering when you see some black-and-white text screen!

    * Escaping a GUI

    * Using multiple resolutions


    Troubleshooting is like reading a mystery novel. You have some facts, symptoms,
    and details, but you don''t know whodunit. You have to take whatever information
    you have, with that data, weigh the various possibilities, and then narrow them
    to a single suspect. Finally, you need to test your theory and prove that your
    suspect is the guilty party.


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the problem is the operating system, the
    hardware, or a service giving you, you can use some basic troubleshooting techniques
    to start your investigations:


    +   **Document the problem.** Write down any and all symptoms that the system
    is showing, including actions you can and can''t. Dot any information you see
    in error messages.

    **Examine the Linux log files.** You can find most of these in the /var/log directory.
    Look for the word "error".

    **Compare your problem with a working system running the same distribution and
    version.** Sometimes, comparing configuration files and settings may uncover the
    problem or narrow the possibilities.

    **Check connections.** Check to make sure that all the hardware is connected properly
    and powered on. Verify that all cables and connections are attached properly.
    There''s always someone, somewhere, accidentally kicking a cable out from a wall
    connection.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# 368 Part V: The Part of Tens


    +   **Remove new hardware.** Remove any hardware that you have changed or added
    recently (before the problem started) and see whether the problem disappears.
    If so, you can probably conclude that the new or changed hardware (or its driver)
    is the culprit and start researching solutions.


    +   **Reduce the number of active programs.** Stop running unnecessary services
    and applications that aren''t related to the problem at hand. You may easily figure
    out what''s happening if other services and applications aren''t getting in the
    way.


    +   **Check whether the problem is reproducible.** Does the same sequence of events
    produce the same problem? Suppose that when you try to print a color printer,
    nothing happens. If nothing happens every time you attempt to print, the problem
    is reproducible. If instead, sometimes your image is printed and at other times
    it isn''t, the problem pattern isn''t the same and isn''t reproducible —or it''s
    caused by something more complicated than just clicking one button. Unfortunately,
    problems that are reproducible are more difficult to resolve because it seems
    that no set of events recreates these problems.


    After you''ve come with a solution, take a few minutes to document the situation.
    Note the symptoms of the problem, its cause, and the solution you implement. The
    next time you encounter the same problem, you can call on your notes for a solution
    rather than reinvent the wheel.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_387_0.png)


    If you don''t have any problems to troubleshoot (yet), document your environment
    before you do. Making a backup of your /etc directory /boot directory is a great
    place to start.


    # The Linux Installer Froze


    When you''re installing Linux, the installation may just freeze. If it does, wait
    a bit and make sure that the installation really frozeze. (Sometimes, the software
    just takes a while to process information.) If the software looks like it has
    frozen, then no in rebooting your computer and starting— just as you are doing
    with any operating system installation. Sometimes, you can reboot and never have
    that problem again. At other times, the problem may happen twice in a row and
    then be the third time. Be sure to try earlier before giving up.


    If the installation still freezes in the same spot or close to the same spot,
    go to the distribution''s support pages (Chapter 2). These pages may map out some
    known problems and solutions that can help you and show you how to join discussion
    lists in order to get more assistance.'
  merge: -1
  img_proc: true
