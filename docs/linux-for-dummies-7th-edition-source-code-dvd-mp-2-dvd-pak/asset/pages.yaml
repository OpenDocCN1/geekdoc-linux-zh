- pgno: 411
  md: '# 392 Part VI: Appendixes


    # System control


    These commands provide system-wide information and control. Normal users can run
    many commands to obtain system information; however, commands that actually change
    the configuration of the system need to run while you''re logged in as root —
    or utilize the su command to temporarily become the superuser.


    # Administration


    Some administration commands, shown in Table A-10, don''t fall neatly into a category.


    | Command | Purpose |

    |---|---|\| passwd | Change a particular user''s password. Any user can run this
    command to change their own password. Only root can use it to change someone else''s.
    |

    | su | Switch to another user account without logging out of this. The best way
    to use this command is su — so your filesystem path and other information is loaded.
    |


    # Kernel module handling


    You sometimes need to add kernel support for an additional device (software or
    hardware). If this arises, you have a limited number of choices: You can rebuild
    the kernel or install a loadable kernel module. Although rebuilding a kernel doesn''t
    exactly require a PhD in nuclear science, consider it a time-consuming nuisance
    that''s best to avoid. The commands in Table A-11 enable you to include the kernel
    support you need while the system is running, without having to rebuild the entire
    thing from scratch.


    | Command | Purpose |

    |---|---|

    | depmod | Regenerates your module dependencies. |

    | insmod | Loads a module by hand. |

    | lmod | Lists the modules your kernel has loaded. |

    | modprobe | Loads a module by hand along with its dependencies and settings.
    |

    | rmmod | Unloads a module by hand. |'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Appendix A: Common Linux Commands


    # Processes


    Most of your system activity requires processes. Even when your system appears
    idle, a dozen or so processes (programs) are running in the background. These
    commands, shown in Table A-12, enable you to check under the hood to make sure
    everything that needs to be running is running and that you''re not overheating
    or overtaxing resources:


    | Table A-12 |

    | Command | Purpose |

    |---|---|

    | crontab | Sets up commands to run at regular intervals. |

    | kill | Stops a process by its number. Often used as kill -9 for a harsh stop
    for something that won''t die. |

    | killall | Stops a process by name rather than number. |

    | nice | Assigns a CPU priority to a process. |

    | pidof | Gets a program''s ID number. |

    | ps | Gets a lot of programs'' ID numbers, usually used as ps aux. |

    | pstree | Shows the relationships between programs. |

    | renice | Changes a program''s CPU use priority. |

    | top | Shows resource use over time. |'
  merge: -1
