- pgno: 6
  md: '# About the Author


    Dee-Ann LeBlanc, RHCE (Red Hat Certified Engineer), is a writer, course developer,
    journalist, and trainer who specializes in Linux. While these various professions
    may sound scattered, in fact reinforce one another by allowing her to see what
    people are doing with Linux in the real world and where they need help. She is
    the Linux Games editor for the Linux Journal, the Desktop editor for LinuxToday.com,
    and is the author of numerous books on Linux and other computer topics. Dee-Ann
    has also been a regular contributor to Computer Power User magazine for two years,
    writing this publication''s Linux content.


    When Dee-Ann isn''t teaching, developing course materials, writing technical nonfiction
    or fantasy fiction, interviewing interesting people, chatting about Linux online
    or at conferences, or trying in one way or another to save the world, she hikes
    with her dogs and experiments on her husband Rob with new recipes. See the latest
    that Dee-Ann''s up to and join her readers'' mailing list at www.Dee-AnnLeBlanc.com
    and http://dee-ann.blog-city.com/. (Contact Dee-Ann at dee@renaisoft.com.)'
