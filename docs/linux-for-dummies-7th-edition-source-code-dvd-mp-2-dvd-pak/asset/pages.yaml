  md: '# Chapter 18: Multimedia Wow! 355


    # # Watchin’ Movies


    These days, you can watch many kinds of movies on your computer. Whether it''s
    a Flash animation, a DVD, or a movie trailer, you''ve got the tools that you need
    right at your fingertips (or just a click away). You may have installed some already,
    while trying to access other multimedia features. Here are some of the tools of
    the trade.


    Watching a DVD in Linux is a bit of a legal quagmire if you live in the United
    States. The Digital Millennium Copyright Act (DMCA) and other issues make it tricky
    for any open source program to navigate the licensing maze when it comes to movies
    that are encoded or protected in various fashions. However, not all DVDs have
    such countermeasures enabled: there are DVDs that Americans can watch under Linux
    with no trouble.(Note that I say watch, and not copy or pirate.)


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_374_0.png)


    For more on the DMCA and the problems it causes, see dmca.org.


    To watch a DVD in Linux, first check Chapter 11 to see what your distribution
    will let you post a DVD into your drive — you may not need to do anything but
    put the DVD into the drive and let the system do it. You can start a player by
    hand, although you may have to download it first:


    +   - Fedora: Choose Applications:Sound & Video:Player. Chapter 12 to add more.

    - Knappix: From the Main Menu, choose Multimedia:Video:xine media player.

    - Linscape: Launch:Run Programs:Multimedia & Design:Media Player (Kplayer). If
    this program can play all of your DVDs, purchase a legal, featured DVD player
    from the Click And Run Warehouse using the tools discussed in Chapter 12.

    - Mandriva: From the Main Menu, choose Multimedia:Video:Kaffeine.

    - SuSE: Choose Applications:Multimedia:Video Player:Totem or one of the others

    - Xandros: Launch:Applications:Multimedia:Video Player.

    - Ubuntu: Choose Applications:Sound & Video:Totem Movie Player.


    The version of Totem with Fedora and other distributions is stripped-down in terms
    of formats it can support — again, this is a legal issue more than anything else.
    It is possible to replace this version with the full one by uninstalling Totem,
    adding software repositories that contain multimedia tools, and then installing
    the full version of Totem from the repositories (all of these skills are discussed
    in Chapter 12). This is the solution I recommend for watching DVDs.'
  merge: -1
  img_proc: true
