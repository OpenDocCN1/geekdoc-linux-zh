    #  bash Command Syntax and Structure


    Many people happily skip through their Linux without understanding the fundamentals
    of the bash shell. Note that this approach makes you lose out on some cool capabilities
    available in bash. The more you know about how this shell''s "language" works,
    the more interesting things you can do with it.


    The basics of using bash at the command prompt often involves typing a command
    and of its flags and values. For example, you enter the ls -la command to see
    a long-format listing of all files in your home directory, including those that
    start with a dot (.), which are hidden files. That other mysterious squiggle character
    is technically called a tilde. The tilde is a bash shortcut character that points
    to a user''s home directory. For example, I merely list the contents of my home
    directory.


    You can break a command into three distinct components:


    +   * The command name

    * The options or flags

    * The arguments


    Consider this example.


    Start with a simple command. The du command lists the contents of the directory
    you are now in, and how much hard drive space each item takes up, with a total
    at the end. Try just the du command by itself:


    ```

    du

    ```


    That''s neat, but it probably raises more questions than it answers. The output
    gives you a long listing of data, but of what? Are those numbers in bytes, kilobytes,
    or messages from outer space? To clarify, adding a simple option to your command:


    ```

    -h

    ```


    You''re still issuing the same command, but now you are providing additional direction
    on what you want displayed. The -h option tells du to show you the information
    in terms that humans can read more easily. Now Ms, Ks, and G'
  merge: -1
  img_proc: true
