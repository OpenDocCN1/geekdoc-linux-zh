  md: '# 274 Part III: Getting Up to Speed with Linux


    However, you may want to alter the value of some environment variables. For example,
    in Table 14-1, the first entry, HISTSIZE, determines the number of lines of command-line
    history that are kept on file. You may have read the discussion, earlier in this
