    > A bus station is where a bus stops.

    A train station is where a train stops.

    On my desk, I have a workstation ....


    > Steven Wright


    A lot of people like to characterize Linux as a DOS-like environment, where all
    you can do is operate in this antique-feeling world where you have to type a lot
    of cryptic stuff without any pretty pictures. However, the Linux desktop offers
    you a nice working environment, as you see throughout this chapter. The cool thing
    is that most of it is configurable. Those who like to customize their systems
    can have way too much fun changing things around.


    # Deciding Which Interface to Use


    Linux has two interface types: the command-line interface (CLI) and the graphical
    user interface (GUI). If you use other computer systems, such as Windows or the
    Macintosh, you''re already familiar with a GUI, with its pictures to look at and
    icons to click. Most Linux distributions include different versions of the two
    main GUIs available in the Linux world (GNOME and KDE).'
