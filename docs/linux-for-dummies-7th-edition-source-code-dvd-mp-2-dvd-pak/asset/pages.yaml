    # Evolving into E-Mail


    While most people think of the Web when they think of the Internet, e-mail may,
    in fact, the most used and beloved of Internet applications. A multitude-of e-mail
    programs is available for Linux users. The defaults in the various-distributions
    discussed in this book are available in your distribution''s menu.


    +   * Knopix: KMail (http://kmail.kde.org/), although Mozilla Mail and Thunderbird
    (www.mozilla.org/products/thunderbird) are also included. You will find all of
    these in Main Menu;

    * Fedora: Novell Evolution (www.novell.com/products/evolution), with KMail and
    Thunderbird available in yum, as discussed in Chapter 12.

    * Linspire: Mozilla Mail, you can add KMail, Thunderbird, and Evolution through
    CBR, as discussed in Chapter 12. The first two are available in Internet:Email
    and the third is

    * Mandriva: Contact (www.kontakt.org), with KMail and Evolution also installed.

    * SuSE: Evolution with KMail also installed by default. Thunderbird is also available
    through YaST as discussed in Chapter 12.

    * Ubuntu: Evolution, and you can install Thunderbird and Kmail, as discussed in
    Chapter 12.

    * Xandros: Mozilla, with KMail also included. You can also add Thunderbird and
    Evolution through Xandros Networks, as discussed in Chapter 12. Xandros Business
    Edition has Evolution by default.


    Evolution and Contact should both remind you very much of Outlook, so if you are
    like to integrate your calendar, address book, task manager, and e-mail, Mozilla
    Mail, Thunderbird, and KMail are more single purpose, although Thunderbird also
    supports news reading. Because Evolution is the default client in the default
    distribution included with this book (Fedora Core 5), I cover this program in
    the most detail in this chapter.


