    # # Compressing and Packaging Files to Share


    Life isn''t all about "take, take, take" (or at least I should hope not!). Sometimes
    you''ve just quite give. Creating care packages to share with other folks finding
    how to tell Nautilus (if you''re a GNOME user) or Konqueror (if you''re a KDE
    user) that you want to do so. However, the overall process is similar for both
    environments, I don''t break these steps down into separate sections.


    To package up and compress files for sending off to other people, navigate to
    the location you''ve stored the file(s) — see Chapter 10 for how to move about
    Nautilus and Konqueror — and then:


    +   1. Determine whether you want to compress or package a single file, group
    of files, or a whole folder.

    If the files and folders that you want to bundle are flung all over the place
    in your filesystem, you may want to create a new folder and copy the items you
    want to bundle together into it — just for the sake of convenience. Chapter 10
    shows how to do so.

    2. Select the item(s) you want to package.

    Chapter 10 explains how to do so. If you want to select a whole folder, navigate
    into its parent folder and just select the folder''s icon instead of entering
    it.'
  merge: -1
  img_proc: true
