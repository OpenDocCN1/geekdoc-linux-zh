- pgno: 199
  md: '# In this part . . .


    In this part of the book, I expand my coverage of Linux beyond what''s part and
    parcel of the operating system to include its many other facilities and capabilities.
    These components are critical to making Linux the raging monster of productivity
    that a well-constructed, properly configured system can represent.


    Here you read about the Linux file system and how to manage its constituent files
    and directories, as well as how to control which users or groups are permitted
    to access these vital system resources. You can read about using the Linux command-prompt
    environment, known as the shell, along with some key capabilities that should
    be part of any savvy Linux user''s standard repertoire.


    In addition, you find out how to keep your system current and install new software.
    You also get the inside scoop on all that security stuff that computer experts
    are always going on about. Those who like working without a net can dabble with
    working on the command line, while those who want nothing to do with (gasp) typing
    can leap straight to the fun of customizing the look and feel of your GUI.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Chapter 10

    Manipulating Files and Directories


    +   In This Chapter

    - Toiling with filesystem contents

    - Comprehending filesystem mechanics


    > There is no need to do any housework at all. After the first four years, the
    dirt doesn''t get any worse.


    — Quentin Crisp


    There''s no avoiding it. At some point, you have to work with the files and directories
    in your system. Frankly, after you get familiar with the rules and commands, you
    feel more comfortable (even if you find yourself being reminded from time to time
    of working in good MS-DOS). Because many people find that working at the command
    line is easier when dealing with files, in this chapter I cover both the typed
    commands and the graphical tools you have at your disposal.


    # Working with Files in the GUI


    People who prefer to stay graphical like to work with the GUI file managers offered
    in Linux instead of having to access a command prompt to work with files. A file
    manager is a program, such as Windows Explorer, that enables you to dig through
    and manipulate your files and directories with your mouse and sometimes just a
    bit of typing. In this section, I take you on a tour of the file managers that,
    by default, come with popular Linux distributions.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 182 Part III: Getting Up to Speed with Linux


    # Sailin'' with Nautilus


    In the GNOME desktop environment (so in Fedora Core, SuSE, Ubuntu if you''re using
    your distribution''s defaults), the file manager is Nautilus. Moving through the
    filesystem in Nautilus involves a couple of different skills. In the first place,
    you need to know where you want to begin. This isn''t as difficult as it sounds.
    Use the Places menu as detailed in Chapter 6 if you don''t want to start from
    your home folder, or do one of the following:


    +   - Fedora: Double-click the Computer or Home icon on your desktop, choose anything
    from the Places menu, or choose Applications:System Tools:File Browser for the
    ability to see a tree on the left and folder contents on the right as you are
    probably used to from other operating systems.

    - Suez: Double-click the Computer or Home icon on your desktop, choose anything
    from the Places menu. To see a tree on the left as you would normally expect,
    select View:Side Pane.

    - Ubuntu: Choose anywhere in the Places menu or Applications:Accessories:File
    Browser. Two panes are enabled by default. Figure 10-1 shows an example of what
    you can see with Nautilus in an open home directory.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_201_0.png)


    Figure 10-1: Nautilus displaying Dee''s directory in Fedora Core 5.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Chapter 10: Manipulating Files and Directories


    Double-click the Home item on your desktop if you''re using a distribution that
    has one.


    When you have the window open to where you want to start, you need to find out
    how to navigate. Use a file, just double-click it, and proceed to the section
    "Opening files and running programs," for Nautilus later in this chapter. You
    also double-click folders to open and access their contents. When you open a folder
    and aren''t in tree view; a separate window opens, leaving the window you were
    already working in open as well. You can close the original window if you want
    by choosing File=Close or clicking the X in the window''s upper-right corner.


    If you find that you''ve got too many directories open, choose one of the following
    commands:


    +   **Close: Parent Folders:** Closes all the folders used to get to this directory.


    +   **Close: All Folders:** Closes all the file browser you have open.


    +   **Close:** Closes this folder.


    You can also easily return to a folder previously accessed, if you want. (For
    example, you might be in `/home/jane/documents/invoices` and want to go back to
    `/home/jane` without opening and closing multiple folders.) To do so, look at
    the bottom left of the folder window to find the name of the subdirectory you''re
    in (as `invoices`). Click that name, and you open a list that has all the parent
    directories plus the current one. The list might look like the following for the
    example:


    home

    jane

    ddocuments

    invoices


    To back up, you can select the spot in the directory tree (for example, jane)
    to go to `/home/jane` you want to move to.


    # Setting how much you see in a folder


    Are you getting too much information about each file or not enough? Experiment
    with the View menu. The major listing options under the View include the following
    commands


    +   **View As Icons:** This default option shows all files as icons with beneath
    them, refer to Figure 10-1.


    +   **View As List:** This command gives you a list of information about the file,
    as well as its icon and name (see Figure 10-2). Note that there are small icons
    available along the left of the listing.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 184 Part III: Getting Up to Speed with Linux


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_203_0.png)


    10-2: Nautilus with the View As List option in dee''s directory in Fedora Core
    5.


    Along with these View menu commands, you can also use


    +   - View: Reload: If you just created a file and don''t see it in the folder,
    select this option.


    +   - View: Show Hidden Files: All files in Linux whose names start with a dot
    (.profile) are hidden files, meaning that you have to explicitly tell Linux you
    want to see them.


    Along with these commands, you can choose the View menu Zoom In, Zoom Out, and
    Normal Size options if you need to change the visual size of the folder''s contents.


    # Creating files and folders


    To create a new file or folder in Nautilus:


    +   1. Browse to the folder you want to create the item.


    You need to open a window for that folder and work from within that window.


    +   2. Right-click on an empty spot inside that folder.


    Make sure that you didn''t highlight anything in the folder. A context menu appears.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Chapter 10: Manipulating Files and Directories


    3. Depending on what you want to accomplish, choose either Create Folder or Create
    Document.


    +   * The Create Folder command creates a new folder in this directory.

    * The Create Document command opens the submenu that lets you choose either a
    document from a Template (top section, if you already have templates created)
    or an Empty File.


    The folder or file appears, highlighted.


    4. Type the name you want to assign to this folder or file and press Enter.


    The name is assigned to the folder file.


    # Opening files and running programs


    To open or run a program in Nautilus, double-click. That''s it! Well, not entirely.
    You can also right-click a file to open the context menu and choose one of the
    following from the context menu:


    +   * Open with program: If the file is associated with a particular program already
    choosing this option is as double-clicking the file. More than one of these options
    may be listed, if your system knows you have more than one program installed that
    can do the job — the item with the file icon next to it is the default. Choosing
    whichever option you prefer.


    +   * Open with Other Application: Choosing this option opens a submenu that contains
    a list of installed programs is aware of. You can select one of these programs
    if you find what you need by clicking Use A Custom Command. From here, you can


    +   * Type in the full path to the application (the full directory path, like
    `/usr/bin/conqueror`).


    +   * Click the Browse button to open a file browser and surf to the program you
    want to use.


    After you select the program to open the file, click Open to proceed.


    # Copying and moving files


    You can copy and move items using two different methods in Nautilus. The first
    is using the usual method you are probably familiar from Windows or the Mac OS
    — clicking and grabbing a file or then dragging it where you want to go. You can
    click and drag between folder windows and down to folder icons. Following are
    some tips:


    +   * Hold the Ctrl key when you drag if you want to make a copy rather than move
    the file.


    +   * If you want to drag the file into a folder icon, make sure that the folder
    icon is highlighted before you release the mouse.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 186 Part III: Getting Up to Speed with Linux


    > If you want to drag the file into a folder window but not into one of the folder
    icons, make sure that the folder icons are not highlighted before you release
    the mouse.


    The other method for copying and moving files and directories involves the following
    steps:


    +   1. Right-click the file or directory you want to copy or move.

    2. From the context menu that appears, choose Cut if you want to move the file
    or Copy if you want to copy it.


    The file doesn''t disappear after you make your selection if you''re trying to
    move it.


    +   3. Navigate to the folder you want to move the file.


    You are ready when you have that folder''s window open.


    +   4. Do one of the following:

    * If you want to move or copy the file into a folder window, right-click inside
    that window (just make sure that nothing is highlighted) and then choose Paste.

    * If you want to move or copy the file into a folder icon rather than an open
    window, right-click the icon and then choose Paste Into Folder.


    # Deleting files and folders


    To use Nautilus to delete a file or a directory from the filesystem, follow these
    steps:


    +   1. Browse to the file(s) or folder''s location.

    2. Select the file(s) or folder(s).


    You can select the file or folder by doing one of the following:


    +   * Clicking the file or folder to highlight it.

    * Clicking the first item, holding Shift down, and then clicking the last item
    in the group to choose them all. (These items will be lined up straight.)

    * Clicking the first item, holding Ctrl down, and clicking each individual item
    you want to select.

    * Clicking and dragging your mouse button so that you make a box that contains
    all the items you want to select.


    +   3. Press the Delete key or right-click and select Move To Trash.


    The file vanishes from view. Keep in mind that if you are deleting a folder and
    the folder contains other files or folders, they go into the trash right along
    with it.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "# Chapter 10: Manipulating Files and Directories\n\nThese deleted items are\
    \ in fact sitting in the Trash, so they aren't really deleted from your hard drive.\
    \ You can move these files out of the trash and back into your filesystem if you\
    \ want to.\n\n# Taking out the trash\n\nYou can permanently delete the contents\
    \ of your Trash folder by following these steps:\n\n+   1. Right-click the Trash\
    \ icon.\n   This action opens a shortcut menu with options listed.\n\n+   2. Choose\
    \ Empty Trash from the shortcut menu.\n   A confirmation dialog box opens.\n\n\
    +   3. Click Empty in the confirmation dialog box to delete the contents of the\
    \ Trash folder.\nLinux permanently removes the items in the Trash folder. You\
    \ can tell whether the Trash folder is empty by looking at the Trash waste can.\
    \ If it's empty, it contains no files. If you see papers in it, it contains trash.\n\
