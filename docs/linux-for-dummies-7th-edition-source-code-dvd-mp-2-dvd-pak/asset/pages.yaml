    # Configuring Firefox


    You can start right now, if you want. You don''t need to customize your browser.
    However you might want to take a moment to tell Firefox your preferences, such
    as the default site to show when it starts up, what fonts sizes by default, what
    colors to use, and many other options.


    The following steps introduce you to the Preferences window, where all the Firefox
    configuration parameters are stored:


    +   1. Start Firefox.

    How you start depends on which distribution you''re using. Typically it''s a shortcut
    on your panel (Fedora, Knoppix, Mandriva, SUSE and Ubuntu and Xandros), a shortcut
    on your desktop (Xandros and Linux if you have the software installed; its already
    in Business), or it is available in the Internet portion of your Main Menu (all
    if you have the software installed). If you are asked to import preferences, say
    no if this is a new installation and you haven''t used any other browsers, or
    say yes if this is not a new installation and you''ve been using another browser
    such as Mozilla.


    +   2. Edit:Preferences.

    The Preferences window appears, as shown in Figure 9-1. This dialog box may look
    different from distribution to distribution and have different options as not
    everyone offers the exact same version of Firefox, but for the most part the match
    should be complete.'
