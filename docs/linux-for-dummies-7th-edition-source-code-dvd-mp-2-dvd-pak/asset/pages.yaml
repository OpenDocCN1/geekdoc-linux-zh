- pgno: 292
  md: '# Chapter 14: Working without the GUI


    You can usually tell at a glance the difference between a variable and an environment
    variable in bash. The normal convention is to name local variables in all lowercase
    or in mixed-case characters. An environment variable, however, is usually always
    in all uppercase letters.


    # Checking out commonly used environment variables


    The bash shell has many environment variables. You may be amazed at the range
    of items these variables store. The handy thing is that, if something is stored
    in a variable, you can change it to suit your needs! In Table 14-1, I list the
    environment variables you''re most likely to work with.


    | Table 14-1 Commonly Used bash Environment Variables |

    | Environment Variable | Purpose | Value |

    |---|---|---|n| HISTSIZE | Determines the number of previously typed commands
    that are stored. | Number of commands |

    | HOME | Sets the location of your home directory. | The path to your home directory
    |

    | MAILCHECK | Sets how often the bash shell checks for new mail in your mailbox.
    If mail has arrived, you see a message similar to You have new mail the next time
    you do something at the prompt. | Number of seconds to wait between checks |

    | PATH | Sets the directories bash looks in, and the order to look in them to
    find a program name you type at the command prompt. | Colon-separated directories
    |

    | PS1 | Sets your command prompt. | Command and formatting characters used to
    form the prompt |


    Most environment variables are established for you by the system administrator
    or perhaps by the shell itself. These variables are mostly read by programs to
    gather information, and you don''t need to change their values.'
  merge: -1
  img_proc: true
