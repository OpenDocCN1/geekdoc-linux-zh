- pgno: 401
  md: '# 382 Part V: The Part of Tens


    4. Type cp passwd passwd-orig to make a backup copy of your user and password
    file, and then type joe passwd to open the /etc/passwd file in the joe editor.


    Don''t skip the copying step. It lets you revert to the original file if you mess
    something up! Inside joe, you can press Ctrl-K and then the H key to display the
    Help menu at the top of the screen at any time To get rid of it, press the same
    key again.


    5. Look for the line similar to root:x:0:0:root:/bin/bash and delete the x (or
    anything else) from between the first two colons so that the line looks like the
    following:


    ```

    root::0:0:root:/bin/bash

    ```


    6. Press Ctrl-K and then the X to save the file and exit the program. When asked
    for the name of the file to save, just press Enter to accept the default.


    7. Type reboot to reboot the machine. When the CD-ROM ejects, remove it from the
    drive and press Enter to continue rebooting.


    8. After you reboot into your system, log into a regular user account. Open a
    terminal window and type su before pressing Enter to become the root user.


    When you deleted x in Step 5, you actually erased any password from the root user.
    If you''re prompted for a password, just press Enter without typing anything.


    9. Open the /etc/passwd file in your preferred text editor. Find the line you
    edited and add the x back into place between the two colons.


    It should look something like this initially:


    ```

    root:x:0:root:/bin/bash

    ```


    Remember, this is a lowercase x you are adding. It should look like the following
    when you''re done:


    ```

    root:x:0:0:root:/bin/bash

    ```


    10. Save and exit the file. Then type passwd and press Enter.


    You''re prompted for a new root password.


    Problem fixed!'
