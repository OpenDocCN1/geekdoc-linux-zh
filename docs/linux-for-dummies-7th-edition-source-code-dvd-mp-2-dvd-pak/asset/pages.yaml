- pgno: 399
  md: '# 380 Part V: The Part of the Tens


    To access a USB storage device, plug it in, and Knoppix automatically adds an
    icon on your desktop for it! However, there''s a caveat here. It mounts all filesystems
    as read-only so you''re going to have to change the USB drive to read-write first:


    +   Click the terminal with the black screen icon on your panel.

    A terminal window appears.

    Type su - to become the root (administrative) user.

    You''re not prompted for a password.

    Look at the new icon and what was put in the brackets.

    For example, [sda], which is the typical label for a USB drive.

    Type mount -o remount, rw /mnt/drive to remount the drive as read-write.

    So, for example, mount -o remount, rw /mnt/sdal.


    +   Find where the files that you want to copy off your drive(s), using the GUI.

    If you have lots of places, focus on one group for now and come back and do another
    later.


    +   Look in the Location bar for the folder they are in.

    So, for example, if it says file:/mnt/hd1/web, the folder is /mnt/sda1/web.


    +   Use the cd command to change to this directory in the command line terminal.

    For example, cd /mnt/hdal/web.


    +   Type ls l to see the directory''s contents.

    There they are!


    +   Use the cp command to copy the file(s) you want to copy over.

    Some hints:

    * To copy all files in this directory and all its subdirectories /dev/sda, type
    cp -r * /dev/sda

    * To copy all the files in this directory but no subdirectories, type cp * /dev/sda

    * To copy all files whose names begin with an an, type cp a* /dev/sda

    * You may want to bundle and compress the files first. In that case, use the program
