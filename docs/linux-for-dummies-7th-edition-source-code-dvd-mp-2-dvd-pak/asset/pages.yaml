  md: '# Chapter 3: Installing Fedora Core


    1. If you want to boot and install from the Fedora DVD-ROM that comes with this
    book, place the DVD in your DVD-ROM drive, reboot your system, type `linux`, and
    press Enter.


    There are a number of boot options, as shown in Figure 3-1, which are each described
    in the following list:


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_60_0.png)


    +   Figure 3-1: The initial Linux for Dummies installation

    KNOPPIX: Press <ENTER> to boot directly to KNOPPIX (or type `knopix`).

    Fedora Core: Type `linux <ENTER>` to install Fedora Core 5.

    Copy CDs: Press F5 for instructions to create CDs for root linux.

    F1-Main [F2-Knopix Options] [F3-Knopix Cheatsheet][F4-Fedora Options] [F5-Linux
    CDs] [F6-General] [F7-Kernel Parameters]


    +   * **Install Or Upgrade In Graphical Mode:** The first option in the graphical
    interface is for installing Fedora Core for the first time or for upgrading an
    existing version of Fedora Linux. This installation probes to detect your system''s
    hardware. The graphical interface is designed to work with a mouse to select options.
    If you don''t have a mouse, you can use the keyboard to navigate around the screens.
    In most places, the spacebar toggles options off and on; and the Enter key accepts
    the choices and moves to the next screen. In screens, if you want to change a
    previous setting, a Back button is available to navigate to earlier selection
    screens. The graphical installation screens also include help in the left panel.
    The contents reflect information about the current root configuration screen.

    * **Install Or Upgrade In Text Mode:** The second option enables you to install
    or upgrade Fedora Core by using a text-menu interface. All the options show up
    on-screen to the selection you want, and you use the arrow keys or Tab key to
    move between areas, you use the spacebar to turn options off and on. To install
    by using the text interface, type `linux` text at the `boot:` prompt and press
    Enter.'
