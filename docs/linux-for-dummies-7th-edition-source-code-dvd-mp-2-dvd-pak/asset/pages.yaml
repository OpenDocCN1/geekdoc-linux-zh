  md: '# Part V: The Part of Tens


    # # I Think I''m in Linux, but 1 Don''t Know What to Do?


    Two different screens tend to cause panic to folks to Linux. The first of these
    screens, shown in Figure 20-1, is in fact a sign that you installed the software
    and booted the machine successfully. Jump for joy! It''s just that you''re booting
    into the command-line environment rather than the GUI environment. If you reach
    a screen similar to the one shown in Figure 20-1, the computer is asking you to
    log in with the username for an account and the password that you created during
    the installation process.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_391_0.png)


    **Figure 20-1:** A Linux command login prompt.


    If you created the root account, you can log in there as *root*.


    After you enter the username and password, you find yourself at the screen shown
    in Figure 20-2, which just happens to be the second spot where you got worried.
    If you see this screen, you have not booted properly into Linux, but you''re also
    logged in and using the machine! Give yourself a good pat on the back.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_391_1.png)


    **Figure 20-2:** Logged in the Linux command line.'
