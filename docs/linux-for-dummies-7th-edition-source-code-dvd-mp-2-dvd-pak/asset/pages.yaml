    > Whom computers would destroy, they must first drive mad.

    — Anonymous


    Many computing old-timers speak fondly of the command line. Others who developed
    their skills by pointing and clicking refer to it as some antiquated tool used
    by crust-timers. The truth is that most skilled computing professionals recognize
    the merits of both the graphical user interface (GUI) and the command-line interface
    (CLI). You must understand that the command line provides a powerful lever for
    operating your computer. If you ever watch over the shoulder of a skilled Linux
    geek, you find that, after logging in, he doesn''t take long to start tapping
    seemingly cryptic instructions on a command line.


    In this chapter, I explore the Linux program that provides the CLI, which is called
    the bash shell. Although many shells are available for Linux, bash is the most
    common, and for good reason. Basically, the creators of bash rolled many good
    features of other shells into one terrific package.


    Each shell has its own way of handling commands and its own additional set of
    tools. I start explaining what shell really is, and when you understand that,
    you''re ready to get down and dirty with bash. I specifically cover what you can
    do with some of the best features of the bash shell. Then I continue with working-at
    the command prompt and get into bash shell interior decorating.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 266 Part III: Getting Up to Speed with Linux


    Shells come equipped to perform certain functions. Most of these features have
    evolved over time to assist the command-line jockey with myriad tasks. Although
    I only scratch the surface here, you''re encouraged to read the man page for bash
    because it''s likely one of the more complete and readable man pages in existence.
    You can read all about how to use man (the online Help system in Linux) in the
    “Help!” section, later in this chapter.


    # Playing the Shell Game


    You need a way to tell the computer what you want it to do. In Linux, one of the
    ways to communicate with the computer is through something called the shell. A
    shell isn''t a graphical thing; it''s the sum total of the commands and syntax
    you available to you to do your work.


    The shell environment is rather dull and boring by graphical standards. When you
    start the shell, all you see is a short prompt, such as a $ followed by a blinking
    cursor awaiting your keyboard entry. (Later in section, I show you a couple of
    methods for accessing the shell).


    The default shell in Linux is the bash shell. This work environment is based on
    the original Unix shell, which is called the Bourne shell and is also referred
    to as sh. The term bash stands for the Bourne shell, and it comes with most Linux
    distributions.


    If you installed your Linux distribution to log in to a graphical desktop, such
    as GNOME or the KDE, you''re likely not looking at a shell prompt. Rather, you
    interact with your computer via a mouse. You can start a bash session by:


    +   * Fedora: Select Applications::Terminal.

    * Knoppix: Click the Console icon (looks like a computer monitor) on your panel.

    * Linspire: Choose Launch::Programs::Utilities::Terminal Program.

    * Mandriva: Click the Console icon on yourpanel.

    * SuSE: Choose Applications::System::Terminal::Gnome Terminal or Console, either
    will do.

    * Ubuntu: Choose Applications::Accessories::Terminal.

    * Xandros: Choose Applications::System::Console.


    Often, your prompt includes helpful information. For example, if you''re logged
    in as dee on the machine catherine in Fedora Core 5, your prompt looks like this:'
