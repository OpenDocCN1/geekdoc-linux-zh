- pgno: 173
  md: '# 154 Part II: Internet Now!


    # Browse the Web with Firefox


    Many people attribute the explosive growth of the Internet to the graphical Web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in plain old
    text, which had little attraction for those people who like pretty pictures. In
    the world of Linux, the most popular browser is arguably Firefox (www.mozilla.org/products/firefox),
    which is based off Mozilla — essentially Firefox is the Web browser portion of
    Mozilla, while Mozilla can also handle e-mail and news browsing. Another popular
    option is Konqueror (www.konqueror.org), whose file-browsing features you need
    out about in Chapter 10, but this tool can also be used as a Web browser.


    Not all distributions come with Firefox installed. In some distributions of Xandros,
