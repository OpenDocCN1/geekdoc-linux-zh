    | /dev/hdb | Second IDE hard drive |

    | /dev/hdb1 | Second IDE hard drive, first primary or extended partition |

    | /dev/hdb2 | Second IDE hard drive, second primary or extended partition |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | First SCSI hard drive, first primary or extended partition, and
    also a small USB drive like a thumbnail/keyring/storage device |


    You might see a pattern by now. A hard drive has a three-letter designation:


    +   - An IDE drive''s designation starts with /dev/hdc, the first drive of this
    type is a, the second is b, and so on. The third IDE drive looks like this: /dev/hdc.
    If you''re using something like a Promise controller that bypasses the main IDE
    controllers (I know, this is technical stuff), then your first IDE drive will,
    in fact, show up as /dev/hde. I know this from one personal experience!

    - A SCSI drive''s designation starts with /dev/sdc, the first drive of this type
    is a, the second is b, and so on. The fourth SCSI drive looks like this: /dev/sdd.
    USB drives are also seen as SCSI devices. A little item like a USB keychain is
    often seen as /dev/sda by your system if you don''t have any permanent drives
    attached.'
