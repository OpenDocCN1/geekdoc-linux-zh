- pgno: 382
  md: '# Chapter 19: Windows-Only Media Formats and Programs


    Some Linux distributions offer Wine RPMs directly on their installation CDs or
    through their packaging schemes. For the distributions covered in this book, the
    following to install WINE for the distributions that don''t have it already installed,
    or to start it for the distributions that do have. (Chapter 12 for more details
    on installing software.)


    +   - Fedora Core: Available through the Package Manager as the wine package,
    depending on what repositories you''ve added (Chapter 12).

    - Knoppix: Available through the command line, not the Main Menu.

    - Linspire: Available through the CNR Warehouse in the base section (Chapter 12).

    - Mandriva: Available through the installation program (Chapter 12). Search for
    wine.

    - SuSE: Available through YaST''s software installation routine (Chapter 12).
    You can find it in Software<Software Management. Search for the wine package.

    - Xandros: Not available. The truly adventurous are welcome to come to www.winebg.org,
    click the Download link, and try to build this from source code (see Chapter 12).

    - Ubuntu: Not available. See the Xandros entry for more.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_382_0.png)


    You can find the document at www.winebg.org/site/docs/wineusr-guide/index. Start
    in the “Configuring Wine” section.


    Now comes the first part — turning to run your Windows software. You don''t run
    wine, but instead, invoke Wine whenever you need to use something from the Windows
    world. To install a Windows program through Wine, insert the CD-ROM or floppy
    into the appropriate drive. Your distribution might open the File Manager for
