    for the casual user (hiding the technical details); others are designed with the
    seasoned administrator in mind. Some of the simpler ones offer an ''expert mode''
    for those who want more control right from the beginning.


    +   Software versions: Different distributions may use different versions of the
    *kernel* (the core of the operating system) and other supporting software-packages
    — which makes for a plethora of versions. Open-source projects are dynamic and
    release new versions regularly, as opposed to the often-sluggish development cycle
    of traditional commercial software.


    +   Package managers: Even though one Linux program should be able to run on any
    distribution, tools called *package managers* keep track of the software on your
    system and ensure that you have all the required'
