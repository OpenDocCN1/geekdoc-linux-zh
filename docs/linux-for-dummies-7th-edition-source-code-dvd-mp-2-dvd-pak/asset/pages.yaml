    # The dad-gum browser plug-ins


    Do you get irritated at Web sites that insist that you download a plug-in, or
    additional piece of software, just to view the site? The difference between a
    plug-in and an external program is: a plug-in displays the results in the browser,
    and an external program runs outside the browser. Although these plug-ins are
    annoying if you''re looking for some basic information, they can provide some
    pretty cool stuff, as streaming video and music through your Web browser.


    Chapter 12 explains how to add the popular plug-ins (like Macromedia''s Flash
    plug-in) to your system for each of the distributions covered in this book. When
    you download a particular type of file, Firefox gives you the chance to tell it
    how to automatically handle those types of files later. Beware telling the browser
    to run things automatically, you could be opening yourself for security problems.


    Firefox also supports a concept called extensions, which refers to extra features
    that aren''t included in the main browser because many people may not want to
    bother with them. Select Tools:Extensions to open the Extension dialog box (see
    Figure 9-4).


    Figure 9-4:

    The Firefox Extensions dialog box in Fedora Core 5.


