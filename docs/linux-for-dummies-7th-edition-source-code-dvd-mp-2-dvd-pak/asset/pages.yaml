    # Storing and retrieving variables'' values


    To assign a value to a variable, you use the variable name followed by an equals
    sign (=) followed by the variable to store:


    ```

    MyVariable=MyValue

    ```


    To retrieve the value represented by that variable, you need to precede the variable
    name with a dollar sign ($). Look at a variable, created by the shell, that determines
    what your prompt looks like. This variable is named PS1. First, you view the value
    being held by PS1:


    ```

    echo $PS1

    ```


    You likely see something like the following:


    ```

    [\u@h \$]

    ```


    Each of the characters preceded by a backslash represents a special instruction
    to the shell to return specific information when the shell prompt is referenced.
    See Table 14-2 for examples of special shell characters you can use in customizing
    your prompt.


    | Table 14-2 | Pieces of the PS1 Puzzle |

    | Component | Result |

    | \! | Prints the position of the command in your history list. |

    | \# | Prints the number of commands you have used during the current shell session.
    |

    | \$ | Prints a $ for user accounts or a # for the superuser. |

    | \d | Prints the date in the following format: day month year. |

    | \h | Prints the name of the machine you''re logged in to. |

    | \n | Moves down to the next line. |

    | \s | Prints bash for the bash shell. |'
