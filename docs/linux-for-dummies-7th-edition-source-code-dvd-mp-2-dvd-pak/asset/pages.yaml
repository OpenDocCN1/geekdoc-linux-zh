  md: '# # Chapter 5


    # # Booting and Stopping Linux


    **In This Chapter


    +   * Understanding what happens when you turn on your Linux machine

    * Identifying and isolating boot problems

    * Shutting down safely

    * Taking Linux off of your machine


    > *I like work; it fascinates me. I can sit back and look at it for hours.*

    — Jerome K. Jerome


    If you came here from Chapter 3 or 4, you likely just survived the first gauntlet
    of the Linux world: installing the operating system. I hope that booting for the
    first time worked. If it did, and you decide that most of this chapter isn''t
    for you, at least skip to the section near the end of this chapter, "Don''t Turn
    Off The Machine! Otherwise, if you''re interested in finding out what your machine
    does as it boots (this chapter can get pretty geeky), read on.


    Your Linux installation failing to boot properly is not necessarily an emergency.
    Much of this chapter is designed to help you with any problems you might run into.
    Before you choose Linux, remember that installing an operating system is no small
    task—and that, because many technical variables are associated with such an installation,
    many computer manufacturers insist on performing the task for you. (When was the
    last time you installed Windows (yourself)? Computers like the Hewlett-Packard,
    Dell, and Wo-Mart (believe it or not) have been offering Linux preinstalled, so
    if you''re too discouraged at this point, or are reading ahead and are too nervous
    to give it a shot, you can either use Knoppix (see Chapter 4 for how to use Knoppix
    without installing it) or purchase a preinstalled machine from a vendor or a local
    computer builder.)'
