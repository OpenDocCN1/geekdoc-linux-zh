    # # Rescuing Files off a Machine That Won''t Boot


    One could use for Knoppix to recover the important files that might be left on
    a messed-up computer that otherwise won''t boot. You can use Knoppix for this
    task whether those files are in Linux or Windows (even on an NTFS partition!).
    You can either e-mail the files to yourself—you can find a simple e-mail program
    in the Main Menu where you choose Internet:KMail—or attach a USB storage device
    to the machine and copy the data onto it.'
