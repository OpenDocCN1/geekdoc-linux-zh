    When you type commands or other related information, be sure to copy the information
    exactly as you see it in the book, including uppercase and lowercase letters,
    because that''s part of the magic that makes Linux behave properly.


    A failure to follow instructions can have all kinds of unfortunate, unseemely,
    or unexpected side effects.


