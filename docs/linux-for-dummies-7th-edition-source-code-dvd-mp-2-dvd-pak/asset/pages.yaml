  md: '# 284 Part III: Getting Up to Speed with Linux


    3. Alter the selections in the Preferences dialog box to customize this applet''s
    behavior.


    Now you have got some fun. Make changes so that you can see what this applet can
    do — as you make your changes, they appear in your panel. Each applet has its
    own set of features, so I can''t do a general walkthrough through it. Just remember
    that you can always go back and change your settings or remove the applet from
    your panel later.


    4. Click Close to save your changes and close the dialog box.


    # Ditching an applet


    You have room for only so many applets. And, if you''re like me, you probably
    don''t want to have every bit of free space cluttered with icons. To remove an
    applet from the panel, simply right-click the applet you want to remove and choose
    Remove From Panel from the shortcut menu that appears. With a whimper, the applet
    vanishes from the panel.


    # Don''t forget the programs


    You may be looking at your panel and wondering whether you can make changes to
    the programs listed there, like you with applets. The good news is that you can
    change the programs on the bar! They fit in the empty spaces that applets do.
    You can also add a program to your desktop itself, if you want.


    # Adding a program to the panel or the Desktop


    If you have a program you end up using often, you can add it to your panel by
    following these steps:


    +   1. Choose Applications and browse to the program you want to add to the bar.

    Don''t open the program. Just point to the menu item with your mouse pointer.

    2. Right-click the program and choose Add This Launcher To Panel to add it to
    the panel, or Add This Launcher To Desktop to add it to the desktop.


    An icon for this program appears on your panel or Desktop.


    After you have your program on the panel, you can run the program just by clicking
    its icon. If you added it to your Desktop, double-click the icon.'
