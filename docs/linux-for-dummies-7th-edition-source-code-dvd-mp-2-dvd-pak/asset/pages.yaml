    # Partitioning from scratch for a dual boot


    If you plan to take a fresh hard drive and install both Windows and Linux on it,
    be sure to install Windows first. While you''re going through the Windows installation,
    you will be asked to partition your drives. Your hard drive can have three primary
    partitions and one extended partition. Inside that partition, you can have up
    to 12 logical partitions.


    No matter what type of partition (primary, extended, or logical) you use for Linux,
    make sure to leave at least 10GB open for it. Typically, you''ll want even more,
    because you may need to download big files like multimedia software.


