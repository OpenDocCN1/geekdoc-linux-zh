    # Working with Other Internet Tools


    You may want to explore a variety of other types of tools, depending on your needs.
    This section covers some points to get you started, so if you go to Chapter 12
    and want to add the appropriate software (or find yourself digging through menus
    and wondering what the program may be called), you aren''t completely lost.


