  md: 'appear next to the numbers so that you can see how big these numbers actually
    are. But, wait — there''s more. What if you just want to know the total amount
    of disk space this directory and its subdirectories are taking up? That calls
    for the -s flag:


    ```

    du -s

    ```


    If you want the total for a different directory? Or one of your subdirectories?
    In my case, I keep a Music subdirectory for the items I have copied from my CDs
    into Ogg (Chapter 18). I can type the command to see how much hard drive space
    takes up in a human-readable way than have to count zeros:


    ```

    du -sh ~Music

    ```


    In this example, du is the command name, -sh indicates the flags (options), and
    ~Music is an argument. The -sh flags can be accompanied by many flags that provide
    various options applicable to the command.


    Are you wondering where to find all the available options and arguments of a particular
    command? Most commands offer man pages, which are discussed in the "Help" section
    in this chapter. Another good place to turn is the --help option, available with
    many commands. Note that --help displays a terse list of options, but it''s nice
    and quick if you already know an option but just can''t remember exactly which
    one it is. Try it by entering the following command:


    ```

    du --help

    ```


    Cool, huh?


    # Starting Programs from the Shell


    The most obvious, but perhaps not so apparent, use of the shell is to start other
    programs. Most utilities you use in Linux are separate and distinct programs.
    Users need a method to start these programs. In the GUI, you can associate an
    icon with a program to start the program. The graphical environment contains the
    intelligence to start the program. Note that programs often require information
    drawn from environment variables, which are a part of the shell environment. (I
    discuss environment variables in more detail in the section "Working with Variables,"
    later in this chapter.) For this reason, the GUI often calls the intended program
    via the bash shell. So you see, even the GUI finds the shell a necessity — although
    the GUI does its best to hide this detail from users.'
