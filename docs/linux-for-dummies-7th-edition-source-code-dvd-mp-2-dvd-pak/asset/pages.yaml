    # Using Amarok


    Amarok (http://amarok.kde.org/) might just be the best music player in Linux.
    This feature-rich and professional-looking tool lets Linux desktop users feel
    like they''re actually in the modern age. I don''t have room to cover every option
    in exhaustive detail, but I''ll give you the nickel tour at.


    To begin, if Amarok isn''t already installed you need to add it to your distribution
    if possible. See Chapter 12 for how to do this. If you have the application or
    it''s already there, you can then launch it by going:


    +   - Fedora: Applications-Sound & Video-Amarok


    +   - Linspaire: LaunchRun Programs-Audio & MP3-Audio Player-Amarok


    +   - Mandriva: From the main menu, choose Multimedia-Sound-Amarok


    +   - SuSE: Applications-Multimedia-Audio Player-Amarok


    +   - Ubuntu: Applications-Sound & Video-Amarok


    What you see by default may look a little different, I''m focusing on how Amarok
    is presented in Fedora, so adjust if needed. The first time you start Amarok in
    Fedora, The First-Run Wizard launches and displays the Welcome screen. Click Next
    to proceed to the Interface screen. Here you choose whether to have Amarok in
    one big piece of two different ones. I will assume you chose the.


    Click Next takes you to the Collection screen. Here, you can expand (click the
    + symbols) and retract (click the - symbols) parts of the filesystem when you
    expose these folders (for example, /home/dee/music), click in their box to add
    a check. Leave the Scan Folders Recursively (look in subfolders), Watch Folders
    for Changes (pick up new files automatically), and Import Playlists (look for
    existing playlists and load them) if checked, or check them if they aren''t. In
    this way, you let Amarok do most of the work.'
  merge: -1
  img_proc: true
