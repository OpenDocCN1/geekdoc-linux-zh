  md: '# Linux For Dummies, 7th Edition


    # How This Book Is Organized


    This book contains six major parts, arranged in an order to take you from Linux
    installation and configuration through keeping a Linux desktop system up and running,
    if not purring like a cat in the sun! Most parts contain three or more chapters
    and appendices, and each chapter contains modular sections. Whenever you need
    help or information, pick this book and start anywhere you like, or use the Table
    of Contents and the Index to locate specific topics or key words.


    Following is a breakdown of the book''s parts and what you find in each one.


    # Part 1: Getting Your Feet Wet


    This part sets the stage and includes an overview of introduction to the terms,
    techniques, and software components that make Linux the raging tiger that''s so
    ready, willing, and able to do this thing. To be a little more specific, I start
    out with a Linux overview that explains what Linux is, where it came from, and
    how it works. Next, I tackle the tasks and activities involved in preparing for
    and installing Linux on a PC. If you''re not a diehard Fedora Core-fan, I also
    cover installing Linscore, Mandriva, SUSE, Ubuntu, and Xandros, but a little less
    detail (or this book would the size of a set of encyclopedias!). After that, I
    tell you how to give Linux the boot — not to get rid of it by means, but rather,
    to fix your brand-new system to reach the heights of computing ecstasy (at least,
    I hope it''s good for you as it is for me). Finally, I help you explore standard
    Linux tools and interfaces, work with accounts, and get the skinny on various
    aspects of distribution-related Linux tools.


    If you don''t want to install but want to try Linux, I also give you the option
    of using what''s called a LiveCD, or bootable distribution. Knoppix is probably
    the most popular of them, so it''s covered here as.


    # Part 2: Internet Now!


    In this part, you explore the issues involved in connecting a Linux system to
    the Internet, configuring a modem, managing a dial connection to an Internet Service
    Provider (ISP), and configuring the various Internet protocols involved to make
    your Internet connection work. You also go through the details involved in configuring
    and using a Web browser and setting up and an e-mail client.'
