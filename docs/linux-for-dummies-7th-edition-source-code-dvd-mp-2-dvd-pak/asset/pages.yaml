  md: '# 36 Part I: Getting Your Feet Wet


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_55_0.png)


    Figure 2-13: The Windows XP Device Manager.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_55_1.png)


    You can double-click each item within the Device Manager to display the corresponding
    details.


    +   - **Download a PC hardware-detect tool.** If you don''t have any diagnostic
    tools and have a relatively current version of DOS, you can download PC hardware
    device tools, such as PC-CONFIG, from the Internet. The PC-CONFIG contains several
    screens of information and menus to choose hardware averages and options. This
    tool is shareable, and usage and fee information is available from the Holin Datentechnik
    website (www.holin.com).


    +   - **Gather information by reading the screen when the computer starts.** If
    your system doesn''t contain any operating systems or you have no documentation,
    read the screen as your computer boots. The video information is displayed as
    the computer boots. You may have to reboot several times to read the information
    if it goes too far. Also, some systems display the PCI Components and their settings
    when the system is starting up. Again, you may have to reboot several times to
    gather all the information.


    ![](img/14f46bbb65f9d1d86ea4ba1ec2d3b7ad_55_2.png)


    You can try pressing the Pause-Break key on your computer (it should be the Scroll
    Lock key) to keep it frozen during boot. You can then unfreeze it by pressing
    any key when you have finished reading.


    +   - **Access Basic Input/Output System (BIOS) information.** Stored in a small
    area of memory and retained by a battery, it is sometimes referred to as CMOS
    (Complementary Metal-Oxide-Semiconductor), which indicates the type of chip that
    can store and retain information. The amount of information stored in the BIOS
    can range from very little to quite a lot. Some newer systems may display screens
    of information about the computer''s hardware.'
