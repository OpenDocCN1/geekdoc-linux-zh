  md: '# 298 Part IV: Getting Things Done


    +   2. Press Y to save your changes or press N to not save.


    If you press Y, you''re asked for the name of the file and offered the current
    name as the default option. If you press N, nano closed and exited, so you''re
    finished with these steps.


    +   3. If you want to use the same name, press Enter. If you want to change the
    name, make your changes and then press Enter.


    The nano editor closes, and your file is saved.


    # Going with gedit


    You''re not stuck with command-prompt-based text editors in Linux. Lots of graphical
    options are available. In this section, I cover gedit because it is the default
    GUI editor for Fedora, which is on the DVD included with this book. The default
    GUI editors for the full range of distributions covered are as follows:


    +   - Fedora: Access gedit by choosing Applications:Accessories:Text Editor (see
    Figure 16-2).


    +   - Knopix: Access KWrite or Krate by choosing Editors:KWrite or Editors:Kate.


    +   - Linsp: Access KWrite by choosing Launch:Run Programs:Business & Finance:Text
    Editor.


    +   - Mandriva: Access Kate or KWrite from the Main Menu by choosing More Applications:Editors:Kate
    or More Applications:Editors:KWrite.


    +   - SuSE: Access Kate, etc., by choosing Applications:Utilities:Editor and then
    either Kate, KEdit (not in all versions), or Text Editor


    +   - Ubuntu: Access gedit by choosing Applications:Accessories:Text Editor.


    +   - Xandros: Access KWrite (very similar to gedit and Kate) by choosing Launch:Applications:Accessories:Text
    Editor.


    # Entering and editing text in gedit


    gedit is strictly a text editor, in that you use it to generate raw text, whereas
    a word processor creates marked-up text that can be opened by programs that read
    that word processor''s file formatting. If you want to add bold, italics, underlines,
    or any other special features to your document, proceed to Chapter 17.'
