  - 在 Linux 中打印
- - '##'
  - 2. 要开始设置机，请点击新建（New）按钮。
- - '##'
  - 3. 在“队列名称”窗口中，输入您分配给此特定打印机的名称。
- - '##'
  - 4. 完成后，点击前进（Forward）按钮进入下一步。
- - '##'
  - 5. 使用下拉列表选择需要的队列类型。
- - '##'
  - 6. 输入针对选择所需的额外信息。
- - '##'
  - 7. 输入信息后，点击前进（Forward）。
- - '##'
  - 8. 点击列表打开您的打印机制造商，并滚动到相应的选项。
- - '##'
  - 9. 选择打印机型号然后点击前进（Forward）。
- - '##'
  - 10. 在“创建新打印队列”对话框中，点击完成（Finish）启用您的打印机。
- - '##'
  - 11. 点击“是”（Yes）打印测试页。
- - '##'
  - 12. 如果测试页出来，当被询问是否正常时点击“是”（Yes）；如果完全没有打印或显示乱码，点击“否”（No）。
- - '##'
  - 13. 选择操作（Action）：退出（Quit）；保存以关闭机配置工具。
