  md: '# Bash Guide for Beginners


    # 1.2.2.5. Shell arithmetic


    The shell allows arithmetic expressions to be evaluated, as one of the shell expansions
    or by the let built-in.


    Evaluation is done in fixed–width integers with no check for overflow, though
    division by 0 is trapped and flagged as an error. The operators and their precedence
    and associativity are the same as in the C language, see Chapter 3.


    # 1.2.2.6. Aliases


    Aliases allow a string to be substituted for a word when it is used as the first
    word of a simple command. The shell maintains a list of aliases that may be set
    and unset using the alias and unalias commands.


    Bash always reads one complete line of input before executing any of the commands
    on that line. Aliases are expanded when a command is read, not when it is executed.
    Therefore, an alias appearing on the same line as another command does not take
    effect until the next line of input is read. The commands following the alias
    definition on line are not affected by the new alias.


    Aliases are expanded when a function definition is read, not when the function
    is executed, because a function definition is itself a compound command. As a
    consequence, aliases defined in a function are not available until after the function
    is executed.


    We will discuss aliases in detail in Section 3.5.


    # 1.2.2.7. Arrays


    Bash provides one–dimensional array variables. Any variable may be used as an
    array; the declare built-in will explicitly declare an array. Any requirement
    that members be indexed or assigned contiguously. Arrays are zero-based. See Chapter
    10.


    # 1.2.2.8. Directory stack


    The directory stack is a list of recently–visited directories. the pushd built–in
    adds directories to the stack as it changes the current directory, and the pop
    built–in removes specified directories from the stack and changes the current
    directory to the directory removed.


    Content can be displayed issuing the dirs command or by checking the content of
    the DIRECTSTACK variable.


    More information about the workings of this mechanism can be found in the Bash
    info pages.


    # 1.2.2.9. The prompt


    Bash makes playing with the prompt even more fun. See the section Controlling
    the Prompt in the Bash info pages.


