  md: '# # Bash Guide for Beginners


    # ## 8.4. Exercises


    These exercises are practical applications of the constructs discussed in this
    chapter. When writing the scripts, you may test using a test directory that does
    not contain too much data. Write each step, test that portion of code, rather
    than writing everything at once.


    +   1. Write a script that asks for the user''s age. If it is equal to or higher
    than 16, print a message saying that this user is allowed to drink alcohol. If
    the user''s age is below 16, print message telling the user how many years he
    or she has to wait before legally allowed to drink.

    2. As an extra, calculate how much beer an 18+ user has drunk drastically (100
    liters/year) and print this for the user.

    3. Write a script that takes one file as an argument. Use a *here* document that
    presents the user with a couple of choices for compressing the file. Possible
    choices could be `gzip`, `bzip2`, `compress` and `zip`.

    4. Write a script homebackup automate tar so the person executing it always uses
    the desired options (`cvp`) and backup destination directory (`/var/backups`)
    to make a backup of his or her home directory. Implement the following features:


    +   * The script should run without arguments. If any arguments are present, exit
    after printing usage.

    * Determine whether the backups directory has an incremental backup wanted. If
    the user does not have a full backup yet, print a message that a full backup will
    be taken. In case of an incremental backup, only if this backup is not older than
    a week.

    * Compress the backup using compression tool. Inform the user that the script
    might take some time, during which the user might start worrying if no output
    appears on the screen.

    * Print a message informing the user about the size of the compressed backup.


    See *tar* or *Introduction to Linux*, chapter 9: "Preparing your data" for background
    information.

    4. Write a script `simple-useradd.sh` that adds a local user to the system. This
