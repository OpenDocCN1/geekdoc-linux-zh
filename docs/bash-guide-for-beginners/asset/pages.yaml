    # 10.2. Array variables


    # 10.2.1. Creating arrays


    An array is a variable containing multiple values. Any variable may be used as
    an array. There is no maximum limit to the size of an array, nor any requirement
    that member variables be indexed or assigned contiguously. Arrays are zero-based:
    the first element is indexed with the number 0.


    Indirect declaration is done using the following syntax to declare a variable:


    ```

    ARRAY [INDEXNR]=value

    ```


    The INDEXNR is treated as an arithmetic expression that must evaluate to a positive
    number.


    Explicit declaration of an array is done using the declare built-in:


    ```

    declare -a ARRAYNAME

    ```


    A declaration with an index number will also be accepted, but the index number
    will be ignored. Attributes to the array may be specified using the declare and
    readonly built-ins. Attributes apply to all variables in the array; you can''t
    have mixed arrays.


    Array variables may also be created using compound assignments in this format:


    ```

    ARRAY=(value1 value2 ... valueN)

    ```


    Each value is then in the form of indexnumber=string. The index number is optional.
    If it is supplied, that index is assigned to it; otherwise the index of the element
    assigned is the number of the last index that was assigned, plus one. This format
    is accepted by declare as well. If no index numbers are supplied, indexing starts
    at zero.


    Adding extra members in an array is done using the syntax:


    ```

    ARRAYNAME[indexnumber]=value

    ```


    Remember that the read built-in provides the -option, which allows for reading
    and assigning values for member variables of an array.


    # 10.2.2. Dereferencing the variables in an array


    In order to reference the content of item in an array, use curly braces. This
    is necessary, as you can see from the example, to bypass the shell interpretation
    of expansion operators. If the index number is @ *, all members of an array are
    referenced.


    ```

    [bob in ~] ARRAY=(one two three)

    [bob in ~] echo ${ARRAY[*]}

    ```


