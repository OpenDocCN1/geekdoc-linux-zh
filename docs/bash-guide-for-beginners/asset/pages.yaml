    Two regular expressions may be joined by the infix operator "|"; the resulting
    regular expression matches any string matching either subexpression.


    Repetition takes precedence over concatenation, which in turn takes precedence
    over alternation. A whole subexpression may be enclosed in parentheses to override
    this precedence rules.


    # 4.1.3. Basic versus extended regular expressions


    In basic expressions the metacharacters "?", "+", "[", "|", "(", and lose their
    special meaning; instead use the backslashed versions "?\", "\+", "\", "|", "\",
    and "\".


    Check in your system documentation whether commands using regular expressions
    support extended expressions.


    # 4.2. Examples using grep


    # 4.2.1. What is grep?


    grep searches the input files for lines containing a match to a given pattern
    list. When it finds a match, it copies the line to the standard output (by default),
    or whatever sort of output you have requested with


    Though grep expects to do the matching on, it has no limits on line length other
    than available memory, and it can match arbitrary characters within a line. If
    the final byte of an input file is not a newline, grep silently supplies one.
    Since newline is a separator for the list of patterns, there is no way to match
    newline characters in a text.


    Some examples:


    ```

    cathy -> grep root /etc/passwd

    root:x:0:root:/root:/bin/bash

    operator:x:1:operator:/root:/sbin/nologin

    ```


