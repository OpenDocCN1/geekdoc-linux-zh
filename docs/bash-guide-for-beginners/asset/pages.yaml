  md: '# Chapter 7. Conditional statements


    In this chapter we will discuss the use of conditionals in Bash scripts. This
    includes the following topics:


    +   - The if statement

    - Using the exit status of a command

    - Comparing and testing input and files

    - if/then/else constructs

    - if/then/elif/else constructs

    - Using and testing the positional parameters

    - Nested if statements

    - Boolean expressions

