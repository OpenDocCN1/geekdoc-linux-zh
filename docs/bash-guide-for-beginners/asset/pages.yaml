    # 3.2.4.1. Bourne shell variables


    Bash uses certain shell variables in the same way as the Bourne shell. In some
    cases, Bash assigns a default value to the variable. The table below gives an
    overview of these plain shell variables:


    Table 3–1. Bourne shell variables


    | Variable name | Definition |

    |---|---|

    | CDPATH | A colon-separated list of directories used as a search path for the
    `cd` built-in command. |

    | HOME | The current user''s home directory; the default for the `cd` built-in.
    The value of this variable is also used by tilde expansion. |

    | IFS | A list of characters that separate fields; used when the shell splits
    words as part of expansion. |

    | MAIL | If this parameter is set to a file name and the MAILPATH variable is
    not set, Bash informs the user of the arrival of mail in the specified file. |

    | MAILPATH | A colon-separated list of file names which the shell periodically
    checks for new mail. |

    | OPTARG | The value of the last option processed by the getopts built-in. |

    | OPTIND | The index of the last option processed by the getopts built-in. |

    | PATH | A colon-separated list of directories in which the shell looks for commands.
    |

    | PS1 | The primary prompt string. The default value is `"\s-\w\$\`. |

    | PS2 | The secondary prompt string. The default value is `">"`. |


    # 3.2.4.2. Bash reserved variables


    These variables are set or used by Bash, but others do not normally treat them
    specially.


    Table 3–2. Reserved Bash variables


    | Variable name | Definition |

    |---|---|

    | auto_resume | This variable controls how the shell interacts with the user and
    job control. |

    | BASH | The full pathname used to execute the current instance of Bash. |

    | BASH_ENV | If this variable is set when Bash is invoked to execute a shell script,
    it is expanded and used as the name of a startup file before executing the script.
    |

    | BASH_VERSION | The version of the current instance of Bash. |

    | BASH_VERSINFO | A read-only array variable whose members hold version information
    for this instance. |

    | COLUMNS | Used by the select built-in to determine the terminal width when printing
    lists. Automatically upon receipt of a SIGWINCH signal. |

    | COMP_CWORD | An index in ${COMP_WORDS} of the word containing the current cursor
    position. |'
