    # 1.3. Executing commands


    # 1.3.1. General


    Bash determines the type of program to be executed. Normal programs are system
    commands that exist in compiled form on your system. When such a program is executed,
    a new process is created because Bash makes an exact copy of itself. This child
    process has the same environment as its parent, only the process ID number is
    different. This process is called forking.


    After the forking process, the address space of the child process is overwritten
    with the new process data. This is done through an exec call to the system.


    The fork-and-exec mechanism switches an old command to a new, while the environment
    in which the new program remains same, including configuration of input and output
    devices, environment variables and priority. This mechanism is used to create
    all UNIX processes, so it also applies to the Linux operating system. After the
    first process, init, is forked with process ID 1, is forked during the boot process
    in the so-called bootstrapping procedure.


    # 1.3.2. Shell built-in commands


    Built-in commands are contained within the shell itself. When the name of a built-in
    command is used as the first word of a simple command, the shell executes the
    command directly, without creating a new process.


