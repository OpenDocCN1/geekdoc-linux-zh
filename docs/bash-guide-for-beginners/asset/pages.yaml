  md: '# Chapter 9. Repetitive tasks


    Upon completion of this chapter, you will be able to


    +   * Use for, while and until loops, and decide which loop fits which occasion.

    * Use the break and continue Bash built-ins.

    * Write scripts using the select statement.

    * Write scripts that take a variable number of arguments.


    # 9.1. The for loop


    # 9.1.1. How does it work?


    The for loop is the first of the three shell looping constructs. This loop allows
    for specification of a list of values. A list of commands is executed for each
    value in the list.


    The syntax for this loop is:


    for NAME [in LIST]; do COMMANDS; done


    If [LIST] is not present, it is replaced with $@ and for executes the COMMANDS
    once for each positional parameter that is set (see Section 3.2.5 and Section
    7.2.1.2).


    The return status is the exit status of the last command that executes. If no
    commands are executed LIST does not expand to any items, the return status is
    zero.


    NAME can be any variable name, although is used very often. LIST can be any list
    of words, strings or numbers, which can be literal or generated by any command.
    The COMMANDS to execute can be any operating system commands, script, program
    or shell statement. The first time through the loop, NAME is set to the first
    item in LIST. The second time, its value is set to the second item in the list,
    and so on. The loop terminates when NAME has taken on each of the values from
    LIST and no items are left in LIST.


    # 9.1.2. Examples


    # 9.1.2.1. Using substitution for specifying LIST items


    The first is a command line example, demonstrating the use of a for loop that
    makes a backup of each .xml file. After issuing the command, it is safe to start
    working on your sources:


    ```

    [carol@octopus~/articles] ls *.xml

    file1.xml file2.xml file3.xml

    [carol@octopus~/articles] ls *.xml > list

    [carol@octarine~/articles] for i in `cat list`; do cp "$i".bak; done

    [carol@octopus~/articles] ls *.xml*

    file1.xml file1.xml.bak file2.xml file2.xml.bak file3.xml file3.xml.bak

    ```


