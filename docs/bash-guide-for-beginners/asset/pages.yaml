    # 7.1. Introduction to if


    # 7.1.1. General


    At you need to specify different courses of action to be taken in a shell script,
    depending on the success or failure of a command. The if construction allows you
    to specify such conditions.


    The most compact syntax of the if command is:


    ```

    if TEST-COMMAND; then CONSEQUENT-COMMANDS; fi

    ```


    The TEST-COMMAND list is executed, and if its return status is zero, the CONSEQUENT-COMMANDS
    list is executed. The return status is the exit status of the last command executed,
    or zero if no condition tested.


    The TEST-COMMAND often involves numerical or string comparison tests, but it can
    also be any command that returns a status when it succeeds, and some other status
    when it fails. Unary expressions are often used to examine the status of a file.
    If the FILE argument to one of the primaries is /dev/fd/N, then descriptor "N"
    is checked. stdin, stdout and stderr and their file descriptors may be used for
    tests.


    # 7.1.1.1. Expressions used with if


    The table below contains an of the so-called "primaries" that make up the TEST-COMMAND
    command or list of commands. These primaries are put between square brackets to
    indicate the test of a conditional expression.


    | Primary | Meaning |

    | --- | --- |

    | -a FILE | True if FILE exists. |


