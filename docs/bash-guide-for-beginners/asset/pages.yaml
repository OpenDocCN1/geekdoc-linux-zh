    When redirecting errors, note that the order of precedence is significant. For
    example, this command, issued in /var/spool


    ```

    ls -1 * 2 > /var/tmp/unaccessible-in-spool

    will redirect output of the ls command to allow the file inaccessible-in-spool
    in /var/tmp. The command

    ```


    ```

    ls -1 * > /var/tmp/spoolist 2 >&1

    will direct both standard output and standard error to the file spoolist. The
    command

    ```


    ```

    ls -1 * 2 >&1 > /var/tmp/spoolist

    didirects only the standard output to the destination file, as the standard error
    is copied to standard output before the standard output is redirected.

    ```


    For convenience, errors are often redirected to /dev/null, if it is sure they
    will be needed. Hundreds of examples can be found in the startup scripts for your
    system.


    Bash allows for both standard output and standard error to be redirected to the
    file name is the result of the expansion of FILE with this construct:


    ```

    &> FILE

    ```


    This is the equivalent of FILE 2>&1, the construct used in the previous set of
    examples. It is also often combined with redirection to /dev/null, for instance
    when you want a command to execute, no matter what output or errors it gives.


    # 8.2.4. File input and output


    # 8.2.4.1. Using /dev/fd


    The /dev/fd directory contains entries named 0, 1, 2, and so on. Opening the /dev/fd/N
    is equivalent to duplicating file descriptor N. If your system provides /dev/stdin,
    /dev/stdout and /dev/stderr, you will see these are all equal to /dev/fd/0, /dev/fd/1
    and /dev/fd/2, respectively.


    The main use of /dev/fd file is from the shell. This mechanism allows programs
    that use arguments to handle standard input and standard output in the same way
    as other paths. If /dev/fd is not available on a system, you will have to find
    a way to bypass the process. This can be for instance using a hyphen (-) to indicate
    that a program should read from a pipe. An example:


    ```

    michel -> filter body.txt.gz | cat header.txt -> footer.txt

