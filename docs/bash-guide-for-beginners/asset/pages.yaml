  md: '# Chapter 3. The Bash environment


    In this chapter we will discuss the various ways in which the Bash environment
    can be influenced:


    +   - Editing shell initialization files

    - Using variables

    - Using different quote styles

    - Perform arithmetic calculations

    - Assigning aliases

    - Using expansion and substitution


    # 3.1. Shell initialization files


    # ### 3.1.1. /etc/profile


    When invoked interactively with the --login option or when invoked as sh, Bash
    reads the /etc/profile instructions. These usually set the shell variables PATH,
    USER, MAIL, HOSTNAME and HISTSIZE.


    On some systems, the umask value is configured in /etc/profile; on other systems
    this file holds pointers to other configuration files such as:


    +   - /etc/inputrc, the system-wide Readline initialization file where you can
    configure the command line bell-style.

    - the /etc/profile.d directory, which contains files configuring system-wide behavior
    of specific programs.


    All settings that you want to apply to all your users'' environments should be
    in this file. It might look like:


    ```

    # /etc/profile

    # System wide environment and start programs, for login setup

    PATH=$PATH:/usr/X11R6/bin

    # No core files by default

    ulimit -s -c 0 > /dev/null 2>&1


    USER=$(id -u)

    LOGNAME=$USER

    MAIL=/var/spool/mail/$USER

    HOSTNAME=$(hostname)

    HISTSIZE=1000


    # Keyboard, bell, display style: the readline config file:

    if [ -z "$INPUTRC" ] && [ ! -f "$HOME/.inputrc" ]; then

    INPUTRC=/etc/inputrc

    ```'
