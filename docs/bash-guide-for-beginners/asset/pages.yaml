  md: '# 1.5.1. Properties of good scripts


    This guide is mainly about the last building block, scripts. Some general considerations
    before we continue:


    +   - A script should run without errors.

    - It should perform the task for which it is intended.

    - Program logic is clearly defined and apparent.

    - A script does not do unnecessary work.

    - Scripts should be reusable.


    # 1.5.2. Structure


    The structure of a shell script is very flexible. Even though in Bash a lot of
    freedom is granted, you must ensure correct logic, flow and efficiency so that
    users executing the script can do so easily and correctly.


    When starting on a new script, ask yourself the following questions:


    +   - Will I be needing any information from the user or from the user''s environment?

    - How will I store that information?

    - Are there any files that need to be created? Where and with which permissions
    and ownerships?

    - What commands will I use? When using the script on different systems, do all
    these systems have commands in the required versions?

    - Does the user need any notifications? When and why?


    # 1.5.3. Terminology


    The table below gives an overview of programming terms that you need to be familiar
    with:


    Table 1–1. Overview of programming terms


    | Term | What is it? |

    |---|---|n| Command control | Testing exit status of a command in order to determine
    whether a portion of the program should be executed. | Conditional branch | Logical
    point in the program when a condition determines what happens next. |

    | Logic flow | The overall design of the program. Determines logic sequence of
    tasks so that the result is successful and controlled. |

    | Loop | Part of the program that is performed two or more times. |

    | User input | Information provided by an external source while the program is
    running, can be stored and recalled when needed. |


    # 1.5.4. A word on order and logic


    In order to speed up the developing process, the logical order of a program should
    be thought over in advance. This is your first step when developing a script.


