    # 9. Conventions used in this document


    The following typographic and usage conventions occur in this text:


    Table 1. Typographic and usage conventions


    | Text type | Meaning |

    | --- | --- |

    | "Quoted text" | Quotes from people, quoted computer output. |

    | terminal view | Literal computer input and output captured from the terminal,
    usually rendered with a light grey background. |

    | command | Name of a command that can be entered on the command line. |

    | VARIABLE | Name of a variable or pointer to content of a variable, as in $VARIABLE.
    |

    | option | Option to a command, as in "the -a option to the ls command". |

    | argument | Argument to a command, as in "read man 1". |

    | command arguments | Command synopsis or general usage, on a separated line.
    |

    | filename | Name of a file or directory, for example "Change to the /usr/bin
    directory". |

    | Key | Keys to hit on the keyboard, such as "type Q to quit". |

    | Button | Choice to select from a graphical menu, for instance: "Select Help->Mozilla
    in your browser". |

    | Menu->Choice | |

    | Terminology | Important term or concept: "The Linux kernel is the heart of the
    system.\ |

    | \ | The backslash in a terminal view or command synopsis indicates an unfinished
    line. In other words, if you see a command that is cut into multiple lines, \
    means "Don not press Enter". |

    | See Chapter 1 | link to related subject within this guide. |

