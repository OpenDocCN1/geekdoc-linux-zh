  md: "# Bash Guide for Beginners\n\nThe commands after && are only executed when\
    \ the test proves to be true; this is a shorter way to represent an if/then/fi\
    \ structure.\n\nThe return code of the function is often used as exit code of\
    \ the entire script. You'll see a lot of initscripts ending in something like\
    \ exit $RETVAL.\n\n# 11.1.4. Displaying functions\n\nAll functions by the current\
    \ shell can be displayed using the set built–in without options. Functions are\
    \ retained after they used, unless they are unset. The Which command also displays\
    \ functions:\n\n```\n[lydia@ointreau ~] zless\nzless is a function\n{\n  zcat\
    \ \"$@\" | \"$PAGER\"\n}\n[lydia@ointreau ~] echo $PAGER\nless\n```\n\nThis is\
    \ the sort of function that is typically configured in the user's shell resource\
    \ configuration files. Functions are more flexible than aliases and provide a\
    \ simple and easy way of adapting the user environment.\n\nHere's one for DOS\
    \ users:\n\n```\ndir ()\n{\n  ls -F --color=auto -LF --color=always \"$@\" | less\
    \ -r\n}\n```\n\n# 11.2. Examples of functions in scripts\n\n# 11.2.1. Recycling\n\
    \nThere are plenty of scripts on your system that use functions as a structured\
    \ way of handling series of commands. On Linux systems, you will find the /etc/rc.d/functions\
    \ definition file which is sourced in all init scripts. Using this method, tasks\
    \ such as checking if a process runs, starting or stopping a daemon and so on,\
    \ only have to be written once, in a general way. If the same task is needed,\
    \ the code is recycled. From functions use the checkpoint function:\n\n```\n#\
    \ Check if $pid (could be plural) are running\ncheckpid() {\n  local i\n  for\
    \ i in $*; do\n    -d \"/proc/$i\" && return 0\n  done\n  return 1\n}\n```\n\n\
    This function is reused in the same script as other functions, which are reused\
    \ in other scripts. The daemon function, for instance, is used in the majority\
    \ of the startup scripts for starting a server process (on machines that use this\
    \ system)."
