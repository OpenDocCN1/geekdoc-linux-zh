  md: '# Chapter 6. The GNU awk programming language


    In this chapter we will discuss:


    +   * What is gawk?

    * Using gawk commands on the command line

    * How to format text with gawk

    * How gawk uses regular expressions

    * Gawk in scripts

    * Gawk and variables


    To make it sure


    As with sed, entire books have been written about various versions of awk. This
    introduction is far from complete and is only intended for understanding examples
    in the following chapters. For more information, best start with the documentation
    that comes with GNU gawk: "GAWK: Effective AWK Programming: A User''s Guide for
    GNU Awk."


    # 6.1. Getting started with gawk


    # 6.1.1. What is gawk?


    Gawk is the GNU version of the commonly available UNIX awk program, another popular
    stream editor. Since the awk program is often just a link to gawk, we will refer
    to it as awk.


    The basic function of awk is to search for files or other units containing one
    or more patterns. When a line matches one of the patterns, special actions are
    performed on that line.


    Programs in awk are different from programs in other languages, because awk programs
    are "data-driven"; you describe the data you want to work with and then what to
    do when you find it. Most other languages are "procedural"; you have to describe,
    in great detail, every step of the program to take. When working with procedural
    languages, it is usually much harder to clearly describe the data your program
    will process. For this process, awk programs are refreshingly easy to read and
    write.


    What does it really mean?


    In the 1970s, three programmers together to create this language. Their names
    were Aho, Kernighan and Weinberg. They took the first character of each of their
    names and put them together. So the name of the language might just as well have
    been "awk".


    # 6.1.2. Gawk commands


    When you run awk, you specify an awk program that tells awk what to do. The program
    consists of a series of rules.(It may also contain function definitions, loops,
    conditions and other program constructs, advanced features that we will ignore
    for now.) Each rule specifies one pattern to search for and one action to perform
    upon finding the pattern.'
