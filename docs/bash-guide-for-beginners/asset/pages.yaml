    \    ;;\n  'stop')\n    cat /usr/share/audio/oh_no_not_not_again.au > /dev/audio\n\
    \    ;;\nnesac\nexit 0\n```\n\nThe case statement used in this kind of script\
    \ is described in Section 7.2.2.\n\n# 1.6. Summary\n\nBash is the GNU shell, compatible\
    \ with the Bourne shell and incorporating many useful features from shells. When\
    \ the shell is started, it reads its configuration files. The most important are:\n\
    \n+   - /etc/profile\n- ~/.bash_profile\n- ~/.bashrc\n\nBash behaves different\
    \ when interactive mode and also has a POSIX compliant and a restricted mode.\n\
    \nShell commands can be split into three groups: the shell functions, shell built-ins\
    \ and existing commands in a directory on your system. Bash supports additional\
    \ built-ins not found in the plain Bourne shell.\n\nShell scripts consist of these\
    \ commands arranged as shell syntax dictates. Scripts are read and executed per\
