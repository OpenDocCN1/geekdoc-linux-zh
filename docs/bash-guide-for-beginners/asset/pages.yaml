    # 3.4.7. Process substitution


    Process substitution is supported on systems that support named pipes (FIFOs)
    or the /dev/fd method of opening files. It takes the form of


    <LIST>


    or


    >LIST)


    The process LIST is run with its input or output connected to a FIFO or some file
    in /dev/fd. The name of this file is passed as an argument to the current command
    as the result of the expansion. The file will provide input for LIST. If the \<LIST>
    form is used, the file passed as an argument should be read to obtain the output
    of LIST. Note that no space may appear between the < > signs and the left parenthesis,
    otherwise the construct would be interpreted as a redirection.


    When available, process substitution is performed simultaneously with parameter
    and variable expansion, command substitution, and arithmetic expansion.


    More information in Section 8.2.3.


    # 3.4.8. Word splitting


    The shell scans the results of parameter expansion, command substitution, and
    splits the results of the other expansions into words that did not occur within
    double quotes for word splitting.


    The shell treats each of $IFS as a delimiter, and splits the results of the other
    expansions into these characters. If IFS is unset, or its value is exactly "<tab>newline",
    the default, then any sequence of IFS characters serves to delimit words. If IFS
    has a value other than the default, then sequences of whitespace characters "space"
    and "Tab" are ignored at beginning and end of the word, as long as the whitespace
    character is in the value of IFS (an IFS character). Any character in IFS is not
    whitespace, with any adjacent IF whitespace characters, delimits a field. A sequence
    of IFS whitespace characters is also treated as a delimiter. If the value of IFS
    is null, no word splitting occurs.


