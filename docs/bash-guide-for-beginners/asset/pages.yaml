    # 10.2.4. Examples of arrays


    Practical examples of the usage of arrays are hard to find. You will find plenty
    of scripts that don''t really do anything on your system but do use arrays to
    calculate mathematical series, for instance. And that would be one of the most
    interesting examples...most just show what you can do with an array in an oversimplified
    and theoretical way.


    The reason for this dryness is that arrays are related complex structures. You
    will find that most practical examples for which arrays could be used are already
    implemented on your system arrays, however on a lower level, in the C programming
    language in which UNIX commands are written. A good example is the Bash built-in
    history-build. Readers who are interested might check the built-ins directory
