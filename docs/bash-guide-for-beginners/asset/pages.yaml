    | Character | Definition |

    | --- | --- |

    | $* | Expands to the positional parameters, starting from one. When the expansion
    occurs within double quotes, it expands to a single word with the value of each
    parameter separated by the first character of the IFS special variable. |

    | $@ | Expands to the positional parameters, starting from one. When the expansion
    occurs within double quotes, each parameter expands to a separate word. |

    | %# | Expands to the number of positional parameters in decimal. |

    | $ | Expands to the exit status of the current option flags as specified upon
    invocation, by the set built-in command, or by the shell itself (such as the -1).
    |

    | $$ | Expands to the process ID of the shell |

    | !$ | Expands to the process ID of the most recently executed background (asynchronous)
    command. |

    | $0 | Expands to the name of the shell or script. |


    The underscore variable is set at startup and contains the absolute name of the
    shell or script being executed as the argument list. Subsequently, it expands
    to the last argument of the previous command, after expansion. It is also set
    to the full pathname of each command executed and placed in the environment exported
    to that command. When checking mail, this parameter holds the name of the file.


    The positional parameters are the words following the name of a shell script.
    They are put into the variables $1, $2, $3 and so on. As needed, variables are
    added to an internal array. %# holds the total number of parameters, as is demonstrated
    with this simple script:


    ```

    #!/bin/bash


    position.sh

    # This script reads 3 positional parameters and prints them out.


    POSPAR1="$1"

    POSPAR2="$2"

    POSPAR3="$3"


    echo "$1 is the first positional parameter, \$1"

    echo "$2 is the second positional parameter, \$2"

    echo "$3 is the third positional parameter, \$3"

    echo

    echo "The total number of positional parameters is $#".

    ```


    Upon execution one could get any number of arguments:


    ```

    franky -> positional.sh one two five

    one is the first positional parameter, $1.

    two is the second positional parameter, $2.

    three is the third positional parameter, $3.

    ```


    The total number of positional parameters is 5.


    ```

    franky -> positional.sh one two

    one is the first positional parameter, $1.

    two is the second positional parameter, $2.

    three is the third positional parameter, $3.

    ```


    The total number of positional parameters is 2.

    More on evaluating these parameters is in Chapter 7 and Section 9.7.


