    # 4.3. Pattern matching using Bash features


    # 4.3.1. Character ranges


    Apart from grep and regular expressions, there''s a good deal of pattern matching
    that you can do directly in the shell, without having to use an external program.


    As you already know, the asterisk (*) and the question mark (?) match any string
    or any single character, respectively. Quite these special characters to match
    literally:


    ```

