  md: '# 6.3.4. User defined variables


    Apart from the built-in variables, you can define your own. When awk encounters
    a reference to a variable which does not exist (which is not predefined), the
    variable is created and initialized to a null string. For all subsequent references,
    the value of the variable is whatever value was assigned. It can be a string or
    a numeric value. Content of input fields can also be assigned to variables.


    Values can be assigned directly using the = operator, or you can use the current
    value of the variable in combination with other operators:


    ```

    kelly@octarine -> cat revenues

    20021009      20021013      consultancy    BigComp       2500

    20021015      20021020      training       EduComp       2000

    20021112      20021123      SmartComp     10000

    20021204      20021215      training       EduComp       5000

    ```


    ```

    kelly@octarine -> cat total.awk

    { total=total + $5 }

    { print "Send bill for " $5 dollar to " $4 }

    END { print "Total revenue: " total }

    ```


    ```

    kelly@octarine -> awk -f total.awk test

    Send bill for 2500 dollar to BigComp

    Send bill for 2000 dollar to EduComp

    Send bill for 10000 dollar to SmartComp

    Send bill for 5000 dollar to EduComp

    ```


    Total revenue: 19500


    ```

    kelly@octarine -> VAR= value

