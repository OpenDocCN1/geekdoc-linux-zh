  md: "# 11.3. Summary\n\nFunctions provide an easy way of grouping commands that\
    \ you need to execute repetitively. When a function is running, the positional\
    \ parameters are changed to those of the function. When it stops, they are reset\
    \ to those of the calling program. Functions are like mini-scripts, and just like\
    \ a script, they generate exit or return codes.\n\nWhile this was a short chapter,\
    \ it contains important knowledge needed for achieving the ultimate state of laziness\
    \ that is the typical goal of any system administrator.\n\n# 11.4. Exercises\n\
    \nHere are some useful things you can do using functions:\n\n+   1. Add a function\
    \ to your ~/.bashrc config file that automates the printing of man pages. The\
    \ result should be that you type something like printman<command>, upon which\
    \ the first appropriate man page rolls out of your printer. Check using a pseudo\
    \ printer device for testing purposes.\n   As an extra, build in a possibility\
    \ for the user to supply the section number of the man he or she wants to print.\n\
    2. Create a sube in your home directory in which you can store function definitions.\
