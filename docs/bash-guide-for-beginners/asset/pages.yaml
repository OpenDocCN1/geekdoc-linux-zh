    # 9.4. I/O redirection and loops


    # 9.4.1. Input redirection


    Instead of controlling a loop by testing the result of a command or by user input,
    you can specify a file from which to read controls the loop. In such cases, read
    is often the controlling command. As long as input lines are fed into the loop,
    execution of the loop continues. As soon as all the input lines read exits.


    Since the loop construct is considered to be one command structure (such as while
    TEST-COMMAND; do CONSEQUENT-COMMANDS; done), the redirection should occur after
    the done statement, so that it complies with the form


    command < file


    This kind of redirection also works with other kinds of loops.


    # 9.4.2. Output redirection


    In the example below, output of the find command is used as input for the read
    command controlling a while loop:


