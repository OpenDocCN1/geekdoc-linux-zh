    But you can use the square brackets to match any enclosed character or range of
    characters, if pairs of characters are separated by a hyphen. An example:


    ```

    cathy -> ls -d [a-cz-z]*

    |drwxr-xr-x 2 cathy 4096 Jul 20 2002 app-defaults/

