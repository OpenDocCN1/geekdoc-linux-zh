  md: '# Chapter 10. More on variables


    In this chapter, we will discuss the advanced use of variables and arguments.
    Uponncompletion, you will be able to:


    +   * Declare and use an array of variables

    * Specify the sort of variable you want to use

    * Make variables read-only

    * Use set to assign a value to a variable


    # 10.1. Types of variables


    # 10.1.1. General assignment of variables


    As we already saw, Bash understands many different kinds of variables or parameters.
    Thus far, we haven''tnbothered with what kind of variables we assigned, so our
    variables could hold any value that we

    assigned to them. A simple command example demonstrates this:


    ```

    [bob ~] VARIABLE=12

    [bob ~] echo $VARIABLE

    12

    [bob ~] VARIABLE=string

    [bob ~] echo $VARIABLE

    string

    ```


    There are cases when you want to avoid this kind of behavior, for instance when
    handling telephone and other

    umbers. Apart from integers and variables, you may also want to specify that a
    variable is a constant. This is

    done at the beginning of a script, when the value of the constant is only. After,
    there are only

    references to the constant variable name, so that the constant needs to be changed,
    it only has to be done

    once. A variable may also be a series of variables of any type, a so-called array
    of variables (VAR0VAR,

    VAR2, ... VARN).


    # 10.1.2. Using the declare built-in


    Using a declare statement, we can limit the value assignment to variables.


    The syntax for declare is following:


    ```

    declare OPTION(s) VARIABLE=value

    ```


    The following options are used to determine the type of data variable we can hold
    and to assign it attributes:


    Table 10–1. Options to the declare built-in


    | Option | Meaning |'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Bash Guide for Beginners


    | -a | Variable is an array. |

    | -f | Use function names only. |

    | -i | The variable is to be treated as an integer; arithmetic evaluation is performed
    when the variable is assigned a value (see Section 3.4.6). |

    | -p | Display the attributes and values of each variable. When -p is used, additional
    options are ignored. |

    | -r | Make variables read-only. These variables cannot be assigned values by
    subsequent assignment statements, nor can they be used. |

    | -t | Give each variable the trace attribute. |

    | -x | Mark variable for export to subsequent commands via the environment. |


    Using + and - turns off the attribute instead. When used in a function, **declare**
    creates local variables.


    The following example shows how assignment of a variable to a function influences
    the value.


    ```

    [bob -i] declare -i VARIABLE=12

    [bob -i] VARIABLE=string

    [bob -i] echo $VARIABLE

    0


    [bob -i] declare -p VARIABLE

    declare -i VARIABLE="*"

    ```


    Note that Bash has an option to declare a numeric value, but none for declaring
    string values. This is, by default, if no specifications are given, a variable
    can hold any type of data:


    ```

    [bob -i] OTHERVAR=blah

    [bob -i] declare -p OTHERVAR

    declare --OTHERVAR="blah"

    ```


    As soon you restrict assignment of values to a variable, it can only hold that
    of data. Possible restrictions are either integer, constant or array.


    See the Bash info pages for return status.


    # 10.1.3. Constants


    In Bash, constants are created by making a variable read-only. The **readonly**
    built-in marks each specified variable as unchangeable. The syntax is:


    readonly OPTION VARIABLE (s)


    The values of these can no longer be changed by subsequent assignment. If the
    -f option is given, each variable refers to a shell function; see Chapter 11.
    If -a is specified, each variable refers to an array of variables. If no arguments
    are given, or if -p is used, a list of all read-only variables are displayed.
    Using the -p option, the output can be reused as input.


    The return status is zero, unless an invalid option was specified, one of the
    variables or functions does not exist, or if -f was supplied for a variable name
    instead of for a function name.


    ```

    [bob -i] readonly TUX=penguinpower

    ```


