  md: '# # Chapter 11. Functions


    In this chapter, we will discuss


    +   * What functions are

    * Creation and displaying of functions from the command line

    * Functions in scripts

    * Passing arguments to functions

    * When to use functions


    # ## 11.1. Introduction


    # ### 11.1.1. What are functions?


    Shell functions are a way to group commands for later execution, using a single
    name for this group, or routine. The name of the routine must be unique within
    the shell or script. All the commands that make up a function are executed like
    regular commands. When calling on a function as a simple command name, the list
    of commands associated with that function is executed. A function is executed
    within the shell in which it has declared; no new process is created to interpret
    the commands.


    Special built-ins are found before shell functions during command lookup. The
    special built-ins are: break, built, .., continue, eval, exec, exit, export, readonly,
    return, set, shift, trap and unset.


    # ## 11.1.2. Function syntax


    Functions either use the syntax


    ```

    function FUNCTION { COMMANDS; }

    ```


    or


    ```

    function () { COMMANDS; }

    ```


    Both define a shell function FUNCTION. The use of the built-in command function
    is optional; however, if it is not used, parentheses are needed.


    The commands listed between curly braces make up the body of the function. These
    commands are executed whenever FUNCTION is specified as the name of a command.
    The exit status is the exit status of the last command executed in the body.


    +   * Common mistakes


    The curly braces must be separated from the body by spaces, otherwise they are
    interpreted in the wrong way.


    The body of a function should end in a semicolon or a newline.'
  merge: -1
  pgno: 137
- img_proc: true
  md: "# Bash Guide for Beginners\n\n# 11.1.3. Positional parameters in functions\n\
    \nFunctions are like mini-scripts; they can accept parameters, they can use variables\
    \ only known within the function (using the local shell built-in) and they can\
    \ return values to the calling shell.\n\nA function also has a system for interpreting\
    \ positional parameters. However, the positional parameters passed to a function\
    \ return are not the same as the ones passed to a command or script.\n\nWhen a\
    \ function is executed, the arguments to the function become the positional parameters\
    \ during its execution. The special parameter # that expands to the number of\
    \ positional parameters is updated to reflect the change. Positional parameter\
    \ $0 unchanged. The Bash variable FUNCNAME is set to the name of the function,\
    \ while it is executing.\n\nIf the return built-in is used in a function, the\
    \ function completes and executes returns with the next command after the function\
    \ call. When a function completes, the values of the positional parameters and\
    \ the special parameter # are restored to the values they had prior to the function's\
    \ execution. A numeric argument is given to return, a simple example:\n\n```\n\
    ```bash\nlydia@ointreu ~/test/ cat showparams.sh\n#!/bin/bash\n\necho \"This demonstrates\
    \ function arguments.\"\necho\n\necho \"Positional parameter 1 for the script\
    \ is $1\"\necho\n\ntest() {\nnecho \"Positional parameter 1 in the function is\
    \ $1\"\nRETURN_VALUE=$?\necho \"The exit code of this function is $RETURN_VALUE.\"\
    \n}\n\ntest other_param\nlydia@ointreu ~/test/ ./showparams.sh parameter1\nThis\
    \ script demonstrates function arguments.\n\nPositional parameter 1 for the script\
    \ is parameter1.\nPositional parameter 1 in the function is other_param.\nThe\
    \ exit code of this function is 0.\n```\n```\n\nNote that the return value or\
    \ exit code of the function is often storen in a variable, so that it can be probed\
    \ at a later point. The script on your system often use the technique of probing\
    \ the RETVAL variable in a conditional test, like this one:\n\n```\n```bash\n\
    if [ $RETVAL -eq 0 ]; then\n  <start the daemon>\nOr like this example from the\
    \ /etc/init.d/amd script, where Bash's optimation features are used:\n\n[ $RETVAL\
    \ = 0 ] && touch /var/lock/subsys/amd\n```\n```"
