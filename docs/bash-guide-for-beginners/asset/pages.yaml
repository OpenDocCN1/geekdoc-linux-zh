  md: "# Bash Guide for Beginners\n\n| | |\n|---|---|\n| Ctrl+Y | The delayed suspend\
    \ character. Causes a running process to be stopped when it attempts to read input\
    \ from the terminal. Control is returned to the shell, the user can foreground,\
    \ background or kill the process. Delayed suspend is only available on operating\
    \ systems supporting this feature.\n The suspend signal, sends a SIGTSTP to a\
    \ running program, stopping it and returning control to the shell. |\n\n# Terminal\
    \ settings\n\nCheck your stty settings. Suspend and resume of output is usually\
    \ disabled if you are using \"modern\" terminals. The standard xterm supports\
    \ Ctrl+S and Ctrl+Q by default.\n\n# 1.12.2. Usage of signals for kill\n\nModern\
    \ shells, Bash included, have a built-in kill function. In Bash, both signal names\
    \ and numbers are accepted as options, and arguments may be or process IDs. An\
    \ exit status can be reported using the -1 option: when at least one signal was\
    \ successfully sent, non-zero if an error occurred.\n\nUsing the kill command\
    \ from /usr/bin/kill, your system might enable extra options, such as the ability\
    \ to kill processes from other than your user ID and identifying processes by\
    \ name, with pgrep and pkill.\n\nBoth kill commands send the TERM signal if none\
    \ is given.\n\nThis is a list of the most common signals:\n\n| Table 12–2. Common\
    \ kill signals |\n| Signal name | Signal value | Effect |\n|---|---|---|\n| SIGHUP\
    \ | 1 | Hangup |\n| SIGINT | 2 | Interrupt from keyboard |\n| SIGKILL | 9 | Kill\
    \ signal |\n| SIGTERM | 15 | Termination signal |\n| SIGSTOP | 17,19 | Stop the\
    \ process |\n\n# SIGKILL and SIGSTOP\n\nSIGKILL and SIGSTOP cannot be caught,\
    \ blocked or ignored.\nWhen killing a process or series of processes, it is common\
    \ to start trying with the least dangerous process, SIGTERM. That way, programs\
    \ that can afford an orderly shutdown get the chance to follow the procedures\
    \ that they have designed to execute when using the TERM signal, such as cleaning\
    \ up and opening files. If you send a SIGKILL to a process, you remove any chance\
    \ for the process to do a tidy cleanup and shutdown, which might have unfortunate\
    \ consequences.\n\nBut if a termination does not work, the INT kill might be the\
    \ only way. For instance, when a process does not use Ctrl+C, it is best to use\
    \ the kill -9 on that process ID:\n\n```\nmaud: ~ ps -ef | grep stuck_process\n\
    maud 5607 2214 0 20:00:05 pts/5 00:00:02 stuck_process\n```\n\nChapter 12. Catching\
    \ signals"
