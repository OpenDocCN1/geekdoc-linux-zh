    # 6.3.1. The input field separator


    The field separator, which is either a single character or a regular expression,
    controls the way awk splits an input record into fields. The input record is scanned
    for character sequences that match the separator definition; the fields themselves
    are the text between the matches.


    The field separator is represented by the built-in variable FS. Note that this
    is something different from the IFS variable used by POSIX-compliant shells.


