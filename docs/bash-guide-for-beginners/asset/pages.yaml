    echo_backup succeeded > /home/franky/log/home_backup.log

    First of all, you are more likely to make errors if you name files and directories
    manually each time you need them. Secondly, suppose franky wants to use this script
    to carol, then carol will have to do some editing before she can use the script
    to back up her home directory. The same is true if franky wants to use this script
    for backing up other directories. For easy recycling, make all files, directories,
    usernames, servernames etc variable. Thus, you only need to edit a value, without
    having to go through the script to check a parameter order. This is an example:


    ```

    #!/bin/bash

    # This script makes a backup of my home directory.


    # Change the values of the variables to make the script work for you:

    BACKUPDIR=/home

    BACKUPFILE=franky

    TARFILE=/var/tmp/franky.tar

    BZIPFILE=/var/tmp/home_franky.tar.bz2

    SERVER=bordeaux

    REMOTEDIR=/opt/franky

    LOGFILE=/home/franky/log/home_backup.log


    cd $BACKUPDIR


    # This creates the archive

