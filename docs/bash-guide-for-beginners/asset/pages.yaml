  md: '# Introduction


    # 1. Why this guide?


    The primary reason for writing this document is that a lot of readers feel the
    existing HOWTO to be too short and incomplete, the Bash Scripting guide is too
    much of a reference work. There is nothing between these two extremes. I also
    wrote this guide on the general principal that not enough free basic courses are
    available, though they should be.


    This is a practical guide which, while not always being too serious, to give real-life
    instead of theoretical examples. Perhaps partly I wrote because I get sick with
    stripped down and over-simplified examples written by people who know what they
    are talking about, showing some really cool Bash feature so much out of its context
    that you never use it in practical circumstances. You can read that stuff after
    finishing this book, which contains exercises and examples that will help you
    in the real world.


    From my experience UNIX/Linux user, system administrator and trainer, I know that
    people can have years of daily interaction with their systems, without having
    the slightest knowledge of task automation. Thus they often think that UNIX is
    not userfriendly, and even worse, they get the impression that it is slow and
    old-fashioned. This problem is another one that can be remedied by this guide.


    # 2. Who should read this book?


    Everybody working on a UNIX or UNIX-like system who wants to make life easier
    on themselves, powers and sysadmins alike, benefit from reading this book. Readers
    who already have a grasp of working the system using the command line will learn
    the ins and outs of shell scripting that ease execution of daily tasks. System
    administration relies a great deal on shell scripting; common tasks are often
    automated simple scripts. This document is full of examples that will encourage
    you to write your own and that will inspire you to improve on existing scripts.


    Prerequisites/not in this course:


    +   * You should be an experienced UNIX or Linux user, familiar with basic commands,
    man pages and documentation

    * Being able to use a text editor

    * Understand system boot and shutdown processes, init and inscripts

    * Create users and groups, set passwords

    * Permissions, special modes

    * Understand naming conventions for devices, partitioning, mounting/unmounting
    file systems

    * Adding/removing software on your system


    See Introduction to Linux (your local TLDP mirror) if you haven''t mastered one
    or more of these topics. Additional information can be found in your system documentation
    (man and info pages), or at the Linux Documentation Project.'
