    \n### 8.2.3.1. 通用\n\n正如你从基本用法中所了解的，命令的输入和输出可以在执行之前进行重定向，使用特殊的符号——重定向运算符，由 Shell\
    \ 解释。重定向也可以用于打开和关闭当前 Shell 执行环境的文件。\n\n重定向也可以发生在脚本中，这样它就可以从文件接收输入，或者将输出发送到文件。稍后用户可以查看输出文件，或者它可以被另一个脚本作为输入。\n\
    \n文件的输入和输出通过整数句柄完成，句柄跟踪给定进程的所有文件。最为人知的文件描述符是 stdin、stdout 和 stderr，文件描述符数字分别为\
    \ 0、1 和 2。这些数字和相应的设备是被保留的。Bash 还可以将网络主机上的 TCP 或 UDP 端口作为文件描述符。\n\n下面的输出显示了保留的文件描述符如何指向实际设备：\n\
