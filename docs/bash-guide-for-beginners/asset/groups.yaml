    size of the file. The ninth column is the filename.


    ## 6.2.3. The print command and regular expressions


    A regular expression can be used as a pattern by enclosing in slashes. The regular
    expression is then tested against the entire text of each record. The syntax is
    as follows:


    ```

    awk ''/EXPRESSION ( PROGRAM )/'' file(s)

    ```


    The following example displays only local device information, networked file systems
    are not shown:


    ```

    kelly@ in -> df -h | awk ''/dev/hd/ { print $6 \t $5 }''

    / : 46%

    /boot : 10%

    /opt : 84%

    /usr : 97%

    /var : 73%

    /.voll : 8%

    ```


    kelly@ in ->

    lashes need to be escaped, because they have a special meaning to the awk program.


    Below another example where we use the /etc directory for files ending in .conf
    and starting with either "a" or "x", using extended regular expressions:


    ```

    kelly@ in /etc> ls -1 | awk ''/[a-x]\*.conf$/ { print $9 }''

    amd.conf

    antivir.conf

    xcdroast.conf

    xinetd.conf

    ```


