    # 初学者 Bash 指南


    | p | 打印文本。 |

    | r | 读取文件。 |

    | s | 搜索并替换文本。 |

    | w | 写入文件。 |


    除了编辑命令外，你还可以获取 sed 的选项。下表是其概述：


    表 5–2. Sed 选项


    | 选项 | 效果 |

    | :--- | :--- |

    | -e SCRIPT | 将 SCRIPT 中的命令添加到处理输入时运行的命令集中。 |

    | -f | 将文件 SCRIPT–FILE 中包含的命令添加到处理输入时运行的命令集中。 |

    | -n | 静默模式。 |

    | -V | 打印版本信息并退出。 |


    sed info 包含了更多关于其如何工作原理的信息；我们在这里仅列出最常用的命令和选项。


    ## 5.2. 包含模式的交互行


    ### 5.2.1. 打印包含模式的行


    这当然是你使用 `grep` 可以做到的，但你无法使用该命令进行“查找并替换”。这只是为了入门。


    这是我们的示例文本：


    ```

    sandy -> cat -n example

    1 This is the first line of an example text.

    2 It is a text with errors.

    3 Lots of errors.

    4 So much errors, all these errors are making me sick.

    5 This is a line not containing any errors.

    6 This is the last line.

    ```


    我们想要 sed 找到所有包含我们的搜索模式的行，在这种情况下是 "errors"。我们使用 `p` 来获取结果：


    ```

    sandy -> sed ''/errors/p'' example

    This is the first line of an example text.

    It is a text with errors.

    It is a text with errors.

    Lots of errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.

    ```


    第 5 章. GNU sed 流编辑器


    正如你所看到的，sed 会打印整个文件，包含搜索字符串的行会被打印两次。这并不是我们想要的。为了只打印匹配我们模式的行，请使用 `-n` 选项：


    ```

    sandy -> sed -n ''/errors/p'' example

    It is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    sandy ->

    ```


    ### 5.2.2. 删除包含模式的输入行


    我们使用 sed 示例文件。现在我们只想查看不包含搜索字符串的行：


    ```

    sandy -> sed ''/errors/d'' example

    This is the first line of an example text.

    This is a line not containing any errors.

    This is the last line.

    sandy ->

    ```


    匹配以给定模式开始并以第二个模式结束的行显示如下：


    ```

    sandy -> sed -n ''/.*\.errors$/p'' example

    This is a line not containing any errors.

    sandy ->

    ```


    ### 5.2.3. 行范围


    这次我们提取包含错误的行。在示例中，这些是第 2 行到第 4 行。使用 `d` 命令指定此范围：


    ```

    sandy -> sed ''2,4d'' example

    This is the first line of an example text.

    This is a line not containing any errors.

    This is the last line.

    sandy ->

    ```


    要从某行开始到文件末尾打印第一行，请使用类似的命令：


    ```

    sandy -> sed ''3,$d'' example

    This is the first line of an example text.

    It is a text with errors.

    sandy ->

    ```


    以下命令打印第一个包含模式 "a text" 的行，直到并包含下一个包含模式 "a line" 的行：


    ```

    sandy -> sed -n ''/a text/,./This/p example

    it is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.


    sandy ->

    ```


    ### 5.2.4. 使用 sed 进行查找和替换


    在示例文件中，我们现在将搜索并替换错误，而不是（反）选择包含搜索字符串的行。


    ```

    sandy -> sed ''s/errors/errors/'' example

    This is the first line of an example text.

    it is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.

    sandy ->

    ```


    如你所见，这并不是完全理想的效果：在第 4 行，只有搜索字符串的第一次出现被替换了，而且这仍然是一个“错误”结果。使用 `g` 命令指示 sed 应该检查整行，而不是在你的搜索结果的第一次出现处停止：


    ```

    sandy -> sed ''s/errors/errors/g'' example

    This is the first line of an example text.

    it is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.

    sandy ->

    ```


    在文件的每行开头插入一个字符串，例如用于引号：


    ```

    sandy -> sed ''s/^$/'' example

    This is the first line of an example text.

    it is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.

    ```


