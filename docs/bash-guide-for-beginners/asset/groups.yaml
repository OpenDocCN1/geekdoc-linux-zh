    # 2.4. Summary


    A script is a reusable series of commands put in an executable text file. Any
    text editor can be used to write scripts.


    Scripts start with # followed by the path to the shell executing the commands
    from the script. Comments are added to a script for your own future reference,
    and also to make it understandable for other users. It is better to have too many
    explanations than not enough.


    Debugging a script can be done using shell options. Shell options can be used
    for partial debugging or for analyzing the entire script. Inserting echo commands
    at strategic locations is also a common troubleshooting technique.


    # 2.5. Exercises


    This exercise will help you to create your first script.


    +   1. Write a script using your favorite editor. The script should display the
    path to your homedirect and the terminal type that you are using. Additionally
    it shows all the services started up in runlevel 3 on your system (hint: use HOME,
    TERM and ls /etc/rc.d/*)

    2. Add comments in your script.

    3. Add information for the users of your script.

    4. Change permissions on your script so that you can run it.

    5. Run the script in normal mode and in debug mode. It should run without errors.

    6. Make errors in your script: see what happens if you missp commands, if you
    leave out the first line or put something unintelligible there, or if you misspell
    shell variable names or write them in lower case characters after they have been
    declared in capitals. Check what the debug comments say about this.'
