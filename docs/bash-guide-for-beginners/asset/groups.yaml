    This example illustrates the special meaning of the dot in regular expressions:
    the first indicates that we want to search for any character after the first string,
    the second is escaped because it is part of a string to find (the end of the file
    name).


    ## 6.2.4. Special patterns


    In order to precede output with, use the BEGIN statement:


    ```

    kelly@ in /etc> ls -1 | \

    awk ''BEGIN { print "Files found:\"'' } /[a-x]\*.conf$/ { print $9 }''

