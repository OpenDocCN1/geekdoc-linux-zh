  - "[PAGE 94]\n\n# Bash Guide for Beginners\n\nNote that the file is referred to\
    \ as a variable; in this case it is the first argument to the script. Alternatively,\
    \ when no arguments are given, file locations are usually stored in variables\
    \ at the beginning of a script, and their content is referred to using these variables.\
    \ Thus, when you want to change a file name in a script, you only need to do it\
    \ once.\n\n# 7.2.2. if/then/elif/else constructs\n\n# 7.2.2.1. General\n\nThis\
    \ is the full form of the if statement:\n\n```\nif TEST-COMMANDS; then\n\nCONSEQUENT-COMMANDS;\n\
    \nel MORE-TEST-COMMANDS; then\n\nMORE-CONSEQUENT-COMMANDS;\n\nelse ALTERNATE-CONSEQUENT-COMMANDS;\n\
    \nfi\n```\n\nThe TEST-COMMANDS list is executed, and if its return status is zero,\
    \ the CONSEQUENT-COMMANDS list returns a non-zero status, each elif list is executed\
    \ in turn, and if its exit status is zero, the corresponding MORE-CONSEQUENT-COMMANDS\
    \ is executed and the command completes. If else is followed by an ALTERNATE-CONSEQUENT-COMMANDS\
    \ list, and the final command in the if or elif clause has a non-zero exit status,\
    \ ALTERNATE-CONSEQUENT-COMMANDS is executed. The return status is the exit status\
    \ of the last command executed, or zero if no condition tested true.\n\n# 7.2.2.2.\
    \ Example\n\nThis is an example you can run in your crontab for daily execution:\n\
    \n```\nanny /etc/cron.daily> cat disktest.sh\n#!/bin/bash\n\n# This script does\
    \ a very simple test for checking disk space.\n\nspace=`df -h | awk 'print $5'\
    \ | grep % | grep -v Use | sort -n | tail -1 | cut -d \"\" -f1'\nalertvalue=80\n\
    \nif [ \"$space\" -ge \"$alertvalue\" ]; then\n    echo \"At least one of my disks\
    \ is nearly full!\" | mail -s \"daily diskcheck\" root\nelse\n    echo \"Disk\
    \ space normal\" | mail -s \"daily diskcheck\" root\nfi\n```"
- md: "\n[content]\n# Bash Guide for Beginners\n\n## 7.2.3. Nested if statements\n\
    \nInside the if statement, you can use another if statement. You may use as many\
    \ levels of nested ifs as you can logically manage.\n\nThis is an example testing\
    \ leap years:\n\n```\nanny ~/testdir> cat testleap.sh\n#!/bin/bash\n# This script\
    \ will test if we're in a leap year or not.\n\nyear=`date +%Y`\n\nif [ $(($year\
    \ % 400)) -eq \"0\" ]; then\n\techo \"This is a leap year. February has 29 days.\"\
    \nelif [ $(($year % 4)) -eq \"0\" ]; then\n\tif [ $(($year % 100)) -ne \"0\" ];\
    \ then\n\t\techo \"This is a leap year. February has 29 days.\"\n\telse\n\t\t\
    echo \"This is not a leap year. February has 28 days.\"\n\tfi\nelse\n\techo \"\
    This is not a leap year. February has 28 days.\"\nfi\n```\n\n```\nanny ~/testdir>\
    \ testleap.sh\nTue Jan 14 20:37:55 CET 2003\n\nanny ~/testdir> testleap.sh\nThis\
    \ is not a leap year.\n```\n\n## 7.2.4. Boolean operations\n\nThe above script\
    \ can be shortened using the Boolean operators \"AND\" (&&) and \"OR\" (||).\n\
    \nFigure 7–2. Example using Boolean operators\n\n```bash\n#!/bin/bash\n# This\
    \ script will test if we're in a leap year or not.\nyear=`date +%Y`\n\nif (( (\"\
    $year\" % 400) == \"0\") || (( (\"$year\" % 4) == \"0\") && (\"$year\" % 100)\
    \ != \"0\") )); then\n\techo \"This is a leap year. Don't forget to charge the\
    \ extra day!\"\nelse\n\techo \"This is not a leap year.\"\nfi\n```\n\nChapter\
    \ 7. Conditional statements\n\nBash Guide for Beginners\n\nWe use the double brackets\
    \ for an arithmetic expression, see Section 3.4.6. This is equivalent to the let\
    \ statement. You will get stuck using angular brackets, if you try something like\
    \ `[$Year % 400], because here, the angular brackets do not represent an actual\
    \ command by themselves.\n\nAmong editors, gvim is one of those colour schemes\
    \ according to the file format; such editors are useful for detecting errors in\
    \ your code.\n\n## 7.2.5. Using the exit code and if\n\nWe already briefly met\
    \ the exit statement in Section 7.2.1.3. It terminates execution of the entire\
    \ script. It is most often used if the input requested from the user is incorrect,\
    \ if a statement did not run successfully or if some error occurred.\n\nThe exit\
    \ statement takes an optional argument. This argument is the integer exit status\
    \ code, which is passed back to the parent and stored in the $?.\n\nA zero argument\
    \ means that the script ran successfully. Any other value may be used by programmers\
    \ to pass back messages to the parent, so that different actions can be taken\
    \ according to failure or success of the child process. If no argument is given\
    \ to the exit command, the parent shell uses the current value of the $?.\n\n\
    Below is an example with a slightly adapted penguin.sh script, which sends its\
    \ exit status back to the parent, feed.sh:\n\n```bash\nann ~/testdir cat penguin.sh\n\
    #!/bin/bash\n\n# This script lets you present menus to Tux. He will only be happy\n\
    # when given a fish. We've also added a dolphin and (presumably) a camel.\n\n\
    if [ \"Menu\" = \"fish\" ]; then\n  if [ \"Animal\" = \"penguin\" ]; then\n  \
    \  echo \"Hmmmm fish... Tux happy!\"\n  elif [ \"Animal\" = \"dolphin\" ]; then\n\
    \    echo \"Pweepweetreetpeteeterdepweet!\"\n  else\n    echo \"prrrrrrt*\"\n\
    \  fi\n  elif [ \"Animal\" = \"penguin\" ]; then\n    echo \"Tux don't like that.\"\
    \n    exit 1\n  elif [ \"Animal\" = \"dolphin\" ]; then\n    echo \"Pweepwishpeeteerdepweet!\"\
    \n    exit 2\n  else\n    echo \"You will read this sign!\"\n    exit 3\n  fi\n\
    ```\n\nThis script is called upon the next one, which exports its variables menu\
    \ and animal:\n\n```bash\nann ~/testdir cat feed.sh\n#!/bin/bash\n# This script\
    \ acts upon the exit status given by penguin.sh\n```\n\n# Chapter 7. Conditional\
    \ statements\n\nBash Guide for Beginners\n\n```bash\nexport menu=\"$1\"\nexport\
    \ animal=\"$2\"\n\nfeed=\"/home/anny/testdir/testpenguin.sh\"\n\n$feed $menu $animal\n\
    case $? in\n1)\n    echo \"Guard: You'd better give me a fish, lest they get violent...\"\
    \n    ;;\n2)\n    echo \"Guard: It's because of people like you that they are\
    \ leaving earth all the time...\"\n    ;;\n3)\n    echo \"Guard: Buy the food\
    \ that the Zoo provides for the animals, ***, how\ndo you think we survive?\"\n\
    \    ;;\n*)\n    echo \"Guard: Don't forget the guide!\"\n    ;;\nesac\n```\n\n\
    ```\nanny ~/testdir/./feed.sh apple penguin\nTux don't like that. Tux wants fish!\n\
    Guard: You'd better give me a fish, lest they get violent...\n```\n\nAs you can\
    \ see, exit codes can be chosen. Existing commands have a series of defined codes;\
    \ see the programmer's manual for more information.\n\n## 7.3. Using case statements\n\
    \nNested if statements might be nice, but as soon as you are confronted with a\
    \ couple of different actions to take, they tend to confuse. For more complex\
    \ conditionals, use case syntax:\n\n```bash\ncase EXPRESSION in\n1) COMMAND-LIST;;\n\
    2) COMMAND-LIST;;\n...) COMMAND-LIST;;\nesac\n```\n\nEach case is a matching pattern.\
    \ The commands in the first match are executed. Each \"|\" symbol is used for\
    \ separating patterns, and \")\" terminates a pattern. Each case plus its accompanying\
    \ commands are called a clause. Each clause must be terminated with \";\". Each\
    \ case statement is ended with esac. In the example, we demonstrate use of cases\
    \ for sending a more selective message with disktest.sh:\n\n```bash\nanny ~/testdir\
    \ cat disktest.sh\n#!/bin/bash\n\n# This script does a simple test for checking\
    \ disk space.\nspace=$(df -h | awk '{print $5}' | grep -v '%' | sort -n | tail\
    \ -1 |)\n\ncase $space in\n0-6*)\n  Message=\"All is quiet.\",\n7-8*)\n  Message=\"\
    Start thinking about cleaning up some stuff. There's a partition that is full.\"\
    \n9*)\n  Message=\"I'm drowning here! There's a partition at capacity.\"\n*)\n\
    \  Message=\"I seem to be running with a non-existent amount of disk space...\"\
    \nesac\n\necho $Message | mail -s \"disk report\" $(date)\n```\n\n## 7.3. Initscript\
    \ example\n\nInitscripts often make use of case statements for starting, stopping\
    \ and querying services. This is an excerpt of the script that starts Octarine,\
    \ a daemon that runs commands periodically with a frequency specified in days.\n\
    \n```bash\ncase \"$1\" in\n  start)\n    start\n    ;;\nstop)\n    stop\n    ;;\n\
    status)\n    status anacron\n    ;;\nrestart)\n    stop\n    start\n    ;;\ncondrestart)\n\
    \  if test \"$(pgof anacron)\" != \"\"; then\n    stop\n    start\n  fi\n  ;;\n\
    *)\n  echo \"$0\"\nesac\n```\n\nThe tasks to execute in each case, such as stopping\
    \ and starting the daemon, are defined in functions, which are partially sourced\
    \ from the /etc/rc.d/init.d/functions file. See Chapter 11 for more explanation.\n\
    \n## 7.4. Summary\n\nIn this chapter we learned how to build conditions into our\
    \ scripts so that different actions can be undertaken upon success or failure\
    \ of a command. The actions can be determined using the if statement. This allows\
    \ you to perform arithmetic and string comparisons, and testing of exit code,\
    \ input files needed by the script.\n\nA simple if/then/fi test often precedes\
    \ commands in a shell script in order to prevent output generation, so that the\
    \ script can easily be run in background or through the cron facility. More complex\
    \ definitions of conditions are usually put in a case statement.\n\nUpon successful\
    \ condition testing, the script can explicitly inform the parent using the exit\
    \ 0 status. Upon failure, any other number may be returned. Based on the return\
    \ code, the parent program can take appropriate action.\n\n## 7.5. Exercises\n\
    \nHere are some ideas for you started using if in scripts:\n\n- 1. Use an if/then/else/elif\
    \ construct that prints information about the current month. The script should\
    \ print the number of days in this month, and give information about leap years\
    \ if the current month is February.\n- 2. Do the same, using a case statement\
    \ and an alternative use of the date command.\n- 3. Modify /etc/profile so that\
    \ you get a special greeting message when you connect to your system as root.\n\
    - 4. Edit the leaptest.sh script so that Section 7.2.4 so that it requires one\
    \ argument, the year. Test that that\n"
  mdcn: "\n# 初学者 Bash 指南\n\n## 7.2.3. 嵌套 if 语句\n\n在 `if` 语句内部，你可以使用另一个 `if` 语句。你可以根据逻辑管理能力使用任意层次数的嵌套\
    \ `if`。\n\n这是一个测试闰年的示例：\n\n```\nanny ~/testdir> cat testleap.sh\n#!/bin/bash\n\
    # 此脚本将测试我们今年是否处于闰年。\n\nyear=`date +%Y`\n\nif [ $(($year % 400)) -eq \"0\" ]; then\n\
    \techo \"This is a leap year. February has 29 days.\"\nelif [ $(($year % 4)) -eq\
    \ \"0\" ]; then\n\tif [ $(($year % 100)) -ne \"0\" ]; then\n\t\techo \"This is\
    \ a leap year. February has 29 days.\"\n\telse\n\t\techo \"This is not a leap\
    \ year. February has 28 days.\"\n\tfi\nelse\n\techo \"This is not a leap year.\
    \ February has 28 days.\"\nfi\n```\n\n```\nanny ~/testdir> testleap.sh\nTue Jan\
    \ 14 20:37:55 CET 2003\n\nanny ~/testdir> testleap.sh\nThis is not a leap year.\n\
    ```\n\n## 7.2.4. 布尔运算\n\n上面的脚本可以使用布尔运算符“与”(&&) 和“或”((||) 来简化。\n\n图 7–2. 使用布尔运算符的示例\n\
    \n```bash\n#!/bin/bash\n# 此脚本将测试我们今年是否处于闰年。\nyear=`date +%Y`\n\nif (( (\"$year\"\
    \ % 400) == \"0\") || (( (\"$year\" % 4) == \"0\") && (\"$year\" % 100) != \"\
    0\") )); then\n\techo \"This is a leap year. Don't forget to charge the extra\
    \ day!\"\nelse\n\techo \"This is not a leap year.\"\nfi\n```\n\n第 7 章. 条件语句\n\n\
    Bash 初学者指南\n\n我们使用双括号进行算术表达式，请参见第 3.4.6 节。这等同于 `let` 语句。如果你尝试类似 `[$Year % 400]`\
    \ 的操作，将会无法运行，因为在这里，角括号本身并不代表实际的命令。\n\n在编辑器中，`gvim` 是根据文件格式显示配色方案之一；此类编辑器对于检测代码中的错误非常有用。\n\
    \n## 7.2.5. 使用退出状态和 if\n\n我们已经在第 7.2.1.3 节简要介绍过 `exit` 语句。它会终止整个脚本的执行。它通常用于用户要求的输入不正确、语句未执行成功或发生某些错误的情况。\n\
    \n`exit` 语句接受一个可选参数。该参数是整数退出状态码，它被传回父进程并存储在 `$?` 中。\n\n参数 0 表示脚本运行成功。程序员可以使用任何其他值向父进程传递消息，以便根据子进程的成功或失败采取不同的操作。如果未向\
    \ `exit` 命令提供参数，父 shell 将使用 `$?` 的当前值。\n\n下面是一个稍微修改过的 `penguin.sh` 脚本示例，它将其退出状态返回给父进程\
    \ `feed.sh`：\n\n```bash\nann ~/testdir cat penguin.sh\n#!/bin/bash\n\n# 此脚本允许你向\
    \ Tux 展示菜单。只有在给他鱼时他才会开心。\n# 我们还添加了海豚和（可能可能的）骆驼。\n\nif [ \"Menu\" = \"fish\" ];\
    \ then\n  if [ \"Animal\" = \"penguin\" ]; then\n    echo \"Hmmmm fish... Tux\
    \ happy!\"\n  elif [ \"Animal\" = \"dolphin\" ]; then\n    echo \"Pweepweetreetpeteeterdepweet!\"\
    \n  else\n    echo \"prrrrrrt*\"\n  fi\n  elif [ \"Animal\" = \"penguin\" ]; then\n\
    \    echo \"Tux don't like that.\"\n    exit 1\n  elif [ \"Animal\" = \"dolphin\"\
    \ ]; then\n    echo \"Pweepwishpeeteerdepweet!\"\n    exit 2\n  else\n    echo\
    \ \"You will read this sign!\"\n    exit 3\n  fi\n```\n\n该脚本被下一个脚本调用，该脚本导出了变量\
    \ `menu` 和 `animal`：\n\n```bash\nann ~/testdir cat feed.sh\n#!/bin/bash\n# 此脚本根据\
    \ penguin.sh 给出的退出状态执行操作\n```\n\n# 第 7 章. 条件语句\n\nBash 初学者指南\n\n```bash\nexport\
    \ menu=\"$1\"\nexport animal=\"$2\"\n\nfeed=\"/home/anny/testdir/testpenguin.sh\"\
    \n\n$feed $menu $animal\ncase $? in\n1)\n    echo \"Guard: You'd better give me\
    \ a fish, lest they get violent...\"\n    ;;\n2)\n    echo \"Guard: It's because\
    \ of people like you that they are leaving earth all the time...\"\n    ;;\n3)\n\
    \    echo \"Guard: Buy the food that the Zoo provides for the animals, ***, how\n\
    do you think we survive?\"\n    ;;\n*)\n    echo \"Guard: Don't forget the guide!\"\
    \n    ;;\nesac\n```\n\n```\nanny ~/testdir/./feed.sh apple penguin\nTux don't\
    \ like that. Tux wants fish!\nGuard: You'd better give me a fish, lest they get\
    \ violent...\n```\n\n如你所示，退出代码是可以自定义的。现有的命令有一系列定义的代码；更多信息请参阅程序员手册。\n\n退出代码可以被选择。现有命令有一系列定义的代码。\n\
    \n嵌套 if 语句可能会很有用，但当你面对多种情况时，使用 `case` 语句会更好。对于更复杂的条件，使用 `case`：\n\n```bash\ncase\
    \ EXPRESSION in\n1) commands;;\n2) commands;;\n...) commands;;\nesac\n```\n\n\
    每个 `case` 都是一个匹配模式。在示例中，我们展示了 `disktest.sh`：\n\n```bash\nanny ~/testdir cat disktest.sh\n\
    #!/bin/bash\n# 此脚本对磁盘空间进行简单测试。\nspace=$(df -h | awk '{print $5}' | grep -v '%'\
    \ | sort -n)\n\ncase $space in\n0-6*)\n  Message=\"一切正常。\"\n7-8*)\n  Message=\"\
    开始清理东西。 分区已满。\"\n9*)\n  Message=\"我快被淹满了！\"\nesac\n\necho $Message | mail -s \"\
    disk report\" $(date)\n```\n\nInitscript 示例\n\nInitscript 经常使用 `case` 语句来启动、停止和查询服务。这是一个按指定天数运行命令的脚本片段：\n\
    \n```bash\ncase \"$1\" in\n  start)\n    start\n    ;;\n  stop)\n    stop\n  \
    \  ;;\n  status)\n    status acarine\n    ;;\n  restart)\n    if test \"$(pgof\
    \ acarine)\" != \"\"; then\n      stop\n      start\n    fi\n    ;;\n  *)\n  \
    \  echo \"$0\"\n    ;;\nesac\n```\n\n在每个 `case` 中执行的任务（例如停止和启动守护进程）定义在函数中，这些函数部分来自\
    \ `/etc/rc.d/init.d/functions` 文件。更多解释请参见第 11 章。\n\n在本章中学了如何在脚本中构建条件，以便根据命令的成功或失败采取不同的操作。可以使用\
    \ `if` 语句确定操作。这允许你执行算术和字符串比较，以及对脚本所需文件的测试。\n\n简单的 `if/then/fi` 测试位于命令之前，以防止生成输出，这样脚本就可以轻松地在后台或通过\
    \ cron 运行。更复杂的条件定义通常放在 `case` 语句中。\n\n条件测试成功后，脚本可以显式使用退出 0 状态告知父进程。失败时，可以返回任何其他数字。根据返回码，父程序可以采取适当的操作。\n"
