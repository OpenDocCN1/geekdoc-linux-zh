    \ 更改选项\n\nShell 可以在调用 shell 时与默认值不同，也可以在 shell 运行期间设置。它们也可能包含在 shell 资源配置文件中。以下命令以\
    \ POSIX 兼容模式执行脚本：\n\n```\nwilly~/scripts bash --posix script.sh\n```\n\n如果要临时或在脚本中更改当前环境，我们更倾向于使用\
