    ## 1.3.2. Shell 内置


    内置命令包含在 shell 内部。当将内置命令名称作为简单命令的第一个单词使用时，shell 直接执行它。


    ## 1.3.3. 从脚本执行程序


    当执行的程序是 shell 脚本时，bash 会通过 fork 创建一个新的 bash 进程。子 shell 逐行读取脚本。每行的命令都被读取、解释并执行，就像它们来自键盘一样。


