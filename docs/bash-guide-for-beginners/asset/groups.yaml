    \ `/bin` 中是纯文本且可能是脚本的文件：\n\n```bash\nfor i in `ls /sbin`; do file /bin/$i | grep\
    \ ASCII; done\n```\n\n#### 9.1.2.2. 使用变量的内容指定 LIST 项\n\n以下是一个将 HTML 文件转换为 PHP\
    \ 文件的特定应用脚本，符合客户方案。转换通过取前 25 行和最后 21 行，并将它们替换为两个提供头部和页脚行的 PHP 标签来完成：\n\n```bash\n\
    [carol@octopus] cat html2php.sh\n#!/bin/bash\n# 针对我的文件转换为 php 的特定脚本\nLIST=\"*.html\"\
    \nfor i in $LIST; do\nNEWNAME=$(ls \"$i\" | sed -e 's/html/php/')\ncat beginfile=\"\
    $NEWNAME\"\ncat \"$i\" | sed -e '1,25d' | tac | sed -e '1,21d' | tac >> \"$NEWNAME\"\
    \ncat endfile=\"$NEWNAME\"\ndone\n```\n\n由于我们这里没有计数，无法知道从哪一行开始删除行直到结束。这个问题通过使用\
    \ `tac` 来解决，它会反转文件中的行。\n\n## 9.2. while 循环\n\n### 9.2.1. 它是什么？\n\n`while` 结构允许重复执行命令列表，只要控制\
    \ `while` 循环的命令执行成功（退出状态为零）。其语法为：\n\n`while CONTROL-COMMAND; do CONSEQUENT-COMMANDS;\
    \ done`\n\n`CONTROL-COMMAND` 是任何可以以成功或失败状态退出的命令。`SEQUENT-COMMANDS` 可以是任何程序、脚本或\
