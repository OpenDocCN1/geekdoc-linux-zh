    \n## 5.2. Interactive lines containing a pattern\n\n### 5.2.1. Printing lines\
    \ containing a pattern\n\nThis is what you can do with grep, of course, but you\
    \ can't do a \"find and replace\" using that command. This is just to get started.\n\
    \nThis is our example text:\n\n```\nsandy -> cat -n example\n1 This is the first\
