    # 2.1. Creating and running a script


    # 2.1.1. Writing and naming


    A shell script is a sequence of commands for which you have a repeated use. This
    sequence is typically executed by entering the name of the script on the command
    line. Alternatively, you can use scripts to automate tasks using the cron facility.
    Another use for scripts is in the UNIX boot and shutdown procedure, where operation
    of daemons and services are defined in init scripts.


    To create a shell script, open an empty file in your editor. Any text editor will
    do: **vim, emacs, gedit, dtpad** et cetera are all valid. You might want to choose
    a more advanced editor like **vim** or **emacs**, because these can be configured
    to recognize shell and Bash syntax and can be a great help in preventing those
    errors beginners frequently make, such as forgetting brackets and semi-colons.


    Put UNIX commands in the empty file, which you would enter on the command line.
    As discussed in the previous chapter (Section 1.3), commands can be functions,
    shell built-ins, UNIX commands and other scripts.


    Give your script a sensible name that gives a hint about what the script does.
    Make sure that your script name does not conflict with existing commands. In order
    to ensure that no confusion can rise, script names often end in .sh; even so,
