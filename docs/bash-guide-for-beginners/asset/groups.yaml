    # # 1.2. Advantages of the Bourne Again SHell


    # ## 1.2.1. Bash and the GNU shell


    The GNU project (Gnu''s Not Unix) provides tools for UNIX–system administration
    which are free software and comply with UNIX standards.


    Bash is an sh-compatible shell that incorporates useful features from the Korn
    shell (ksh) and C shell (csh). It is intended to conform to the IEEE POSIX P1003.ISO
    9945.2 Shell and Tools standard. It offers functional improvements over sh for
    both programming and interactive use; these include line editing, unlimited size
    command history, job control, shell functions and alliances, indexed arrays of
    unlimited size, and integer arithmetic in any base from two to sixty-four. Bash
    can run most sh scripts without modification.


    Like the other GNU projects, the bash initiative was started to preserve, protect
    and promote the freedom to use, study, copy, modify and redistribute software.
    It is generally known that such conditions stimulate creativity. This was also
    the case with the bash program, which has a lot of extra features that other shells
    can''t offer.


    # ## 1.2.2. Features only found in bash


    # ### 1.2.2.1. Invocation


    In addition to the single–character shell command line options which can generally
    be configured using the set shell built–command, there are several multi–character
    options that you can use. We will come across a couple of the more popular options
    in this and in the following chapters; the complete list can be found in the Bash
    info pages, Bash features->Invoking Bash.


    # ### 1.2.2.2. Bash startup files


    Startup files are scripts that are read and executed by Bash when it starts. The
    following subsections describe different ways to start the shell, and the startup
    files are read consequently.'
