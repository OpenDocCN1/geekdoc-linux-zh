    \ stuck_process\n```\n\n第 12 章 捕获信号\n\n# 初学者 Bash 指南\n\n```\nmaud: -> kill -9\
    \ 5060\nmaud: -> ps -ef | grep stuck_process\nmaud 5614 2214 0 20:15/pts/5 00:00:00\
    \ grep stuck_process\n[+] Killed stuck_process\n```\n\n当语法启动多个事件时，使用 `kill` 可能会更容易。它接受与\
    \ `kill` 命令相同的选项，但应用于进程的所有实例。在生产环境中使用之前请对其进行测试，因为在某些商业 Unix 系统上它可能无法按预期工作。\n\n\
    ## 12.2. Traps（陷阱）\n\n### 12.2.1. 通用\n\n在某些情况下，你可能希望脚本不要通过键盘序列意外退出，例如因为输入必须被清理或完成。**trap**\
    \ 语句可以捕获这些序列，并可以编程执行一个用于捕获这些信号的命令列表。\n\n`trap` 语句的语法非常直观：\n\n```\ntrap [COMMANDS]\
    \ [SIGNALS]\n```\n\n这指示 `trap` 命令捕获列出的 `SIGNALS`，这些可以是带有或不带 SIG 前缀的信号名称。如果信号是\
    \ `0` 或 `EXIT`，则在 shell 退出时执行 `COMMANDS`。如果其中一个信号是 `DEBUG`，则在每个简单命令执行后执行 `COMMANDS`\
    \ 列表。信号也可以指定为 `ERR`；在这种情况下，每当简单命令以非零状态退出时，都会执行 `COMMANDS`。请注意，当非零状态从 `if` 语句的部分退出，或者从\
    \ `while` 或 `until` 循环中退出时，这些命令将不会执行。如果逻辑与 (`&&`) 或逻辑或 (`||`) 导致非零退出码，或者当使用 `!`\
    \ 运算符插入 trap 状态时，也不会执行。\n\n`trap` 命令的返回值是本身，除非遇到无效的信号规范。`trap` 接受一些选项，这些选项在 Bash\
    \ 页面中有记录。\n\n这是一个非常简单的示例，在打印消息时捕获用户的 `Ctrl-C`。当你尝试在不使用 `KILL` 信号的情况下杀死此进程时，什么都不会发生：\n\
    \n```bash\n#!/bin/bash\n# traptest.sh\n\ntrap \"echo Boo!\" SIGTERM\necho \"pid\
    \ is $$\"\n\nwhile :\n    # 这等同于 \"while true\"\n\n    sleep 60\n    # 这个脚本并没有执行任何事情。\n\
    done\n```\n\n### 12.2.2. Bash 如何解释 traps\n\n当 Bash 接收到一个正在等待命令完成的 trap 信号时，在命令完成之前，trap\
    \ 将不会执行。Bash 正在通过 `wait` 内置命令等待一个异步命令，接收到一个已设置 trap 的信号将导致 `wait` 内置命令继续执行。\n\n\
    第 12 章 捕获信号。\n\n当语法启动多个事件时，`kill` 可能会更容易。它接受与 `kill` 命令相同的选项，但应用于进程的所有实例。在生产环境中使用之前请对其进行测试，因为在某些商业\
    \ Unix 系统上它可能无法按预期工作。\n\n## 12.2.3. 更多\n\n### 12.2.3. 通用（通用）\n\n在某些情况下，你可能希望脚本不要通过键盘序列意外退出，例如因为输入必须被清理或完成。**trap**\
    \ 语句可以捕获这些序列，并可以编程执行一个用于捕获这些信号的命令列表。\n\n`trap` 语句的语法非常直观：\n\n```\ntrap [COMMANDS]\
    \ [SIGNALS]\n```\n\n### 12.2.3.1. 跟踪\n\n在调试脚本时，你可能需要跟踪变量。\n\n```bash\n#!/bin/bash\n\
    # trace.sh\n\nset -x\necho \"Testing: $1\"\nset +x\n```\n\n### 12.2.3.2. 移除文件\n\
    \n以下示例使用 trap 在退出时移除文件：\n\n```bash\n#!/bin/bash\n# lock.sh\n\nLOCKFILE=/tmp/myscript\n\
    trap \"rm -f $LOCKFILE\" EXIT\n\ntouch $LOCKFILE\n# ... work ...\n```\n\n以下示例显示了在退出时给出消息：\n\
    \n```bash\n#!/bin/bash\n# cleanup.sh\n\ntrap \"echo 'Cleaning up...'\" EXIT\n\
    echo \"Working...\"\nsleep 5\n```\n\n## 12.3. 总结\n\n可以使用 `kill` 命令或键盘快捷键向程序发送信号。信号可以使用\
    \ `trap` 语句捕获。程序无法忽略的唯一信号是 KILL。\n\n## 12.4. 练习\n\n一些实用的示例：\n\n- 使用 `dd` 工具将启动镜像写入磁盘。如果用户尝试使用\
    \ Ctrl+C 中断脚本，显示此操作将导致磁盘损坏。\n- 编写一个脚本自动安装你选择的第三方软件包。软件包必须从网上下载。必须解压缩并编译（如果这些操作适当）。只有实际安装过程应该是不可中断的。\n\
    \n# 附录 A. Shell 功能\n\n本文概述了常见的 shell 功能（每个版本都相同）和不同的 shell 功能（特定 shell 功能）。\n\n\
    ## A.1. 通用功能\n\n以下功能在所有 shell 中都是标准的。注意 `stop`、`suspend`、`jobs`、`bg` 和 `fg` 命令仅在支持作业控制的系统中可用。\n\
    \n表格 A–1. 常见 Shell 功能\n\n| 命令 | 含义 |\n| --- | --- |\n| > | 重定向输出 |\n| >> | 追加到文件\
    \ |\n| < | 重定向输入 |\n| << | “在此处”（重定向输入） |\n| | | 管道输出 |\n| & | 在后台运行进程 |\n| ;\
    \ | 同行内分隔命令 |\n| * | 匹配文件名中的任意字符 |\n| ? | 匹配文件名中的单个字符 |\n| [] | 匹配括号内的任意字符 |\n\
    | () | 在子 shell 中执行 |\n| `` ` | 替换封闭命令的输出 |\n| \" \" | 部分引用（允许变量和命令扩展） |\n| \\\
    \ | 完全引用（不允许扩展） |\n| $var | 使用变量的值 |\n| $$ | 进程 ID |\n| $0 | 命令名称 |\n| Sn | 第\
    \ n 个参数（n 从 0 到 9） |\n| $* | 所有参数作为一个简单的单词 |\n| # | 命令开始 |\n| bg | 后台执行 |\n| break\
    \ | 跳出循环语句 |\n| cd | 切换目录 |\n| continue | 继续程序循环 |\n| echo | 显示输出 |\n| eval |\
    \ 求值参数 |\n| exec | 执行一个新的 shell |\n\n"
