    \ with a success or failure status, and CONSEQUENT-COMMANDS can be any UNIX command,\
    \ script or shell.\n\nAs we already explained previously, the \";\" may be replaced\
    \ with one or more newlines wherever it appears.\n\n### 9.3.2. Example\n\nAn improved\
    \ picturesort.sh script (see Section 9.2.2.2), which tests for available disk\
