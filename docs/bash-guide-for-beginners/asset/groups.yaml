    # 初学者 Bash 指南


    在开始大量分发不透明（Opaque）副本时，应采取合理审慎的步骤，以确保该透明（Transparent）副本在指定位置保持可访问，直到您最后一次向公众（直接或通过您的代理或零售商）分发该版本的不透明副本后至少一年。


    建议您在重新分发任何大量副本之前（但并非强制）联系文档的作者，以便他们有机会向您提供更新版本的文档。


    ## B.5. 修改


    您可以在上述第 2 节和第 3 节规定的条件下复制并发文档的修改版本（Modified Version），前提是您必须按照本许可证发布修改版本，并由修改版本充当文档的角色，从而许可任何拥有该版本副本的人对其进行分发和修改。此外，您必须在修改版本中完成以下操作：


    - 在标题页（以及封面）上使用与文档不同、且与之前的版本不同的标题（如果有之前的版本，应列在文档的“历史（History）”部分中）。如果该版本的原始出版者许可，您可以使用与之前的版本相同的标题。

    - 在标题页上列出负责修改版本编写的一个或多个个人或实体作为作者，以及文档至少五位主要作者（如果主要作者少于五位，则为所有主要作者）。

    - 在标题页上注明修改版本的出版者名称作为出版者。

    - 保留所有版权声明。

    - 在其他版权声明中添加针对您的修改的适当版权声明。

    - 在版权声明之后，立即包含一份许可，允许公众根据本许可证的条款使用修改版本，如下文附录中所示。

    - 保留文档许可通知中给出的完整不变章节（Invariant Sections）和封面文本（Cover Texts）列表。

    - 包含一份未经修改的本许可证的副本。

    - 保留名为“历史（History）”的章节及其标题，并为其添加一个项目，至少说明标题页上给出的修改版本的标题、年份、新作者和出版者。如果文档中没有名为“历史（History）”的章节，请创建一个，并说明标题页上给出的文档标题、年份、作者和出版者，然后添加一个描述上文所述修改版本的项目。

    - 保留文档提供的用于访问文档透明副本的网络位置（如果有），并在“历史”部分中包含其所依据的先前版本的网络位置。如果某作品在文档发布至少四年前发布，或者其原始出版者给予了许可，您可以为其放置网络位置。

    - 在任何名为“致谢（Acknowledgements）”或“致辞（Dedic）”的章节中，保留该章节的标题，并保留其中所有贡献者的致谢和/或辞辞的内容和语气。

    - 保留文档的所有不变章节，其文本和标题均保持不变。章节编号或等效物不视为章节标题的一部分。

