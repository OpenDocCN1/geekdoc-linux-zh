    ```\n\n初学者 Bash 指南\n\n# 3.7. 总结\n\nBash 环境可以进行全局配置，也可以按用户进行配置。使用各种配置文件来精调 shell\
    \ 的行为。\n\n这些文件包含 shell 选项、变量设置、函数定义以及创建我们舒适环境的其他构建模块。\n\n除了保留的 Bourne shell、Bash\
