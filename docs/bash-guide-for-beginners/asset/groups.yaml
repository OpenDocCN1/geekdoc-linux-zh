    \ ;;\nesac\nexit 0\n```\n\nThe case statement used in this kind of script is described\
    \ in Section 7.2.2.\n\n# 1.6. Summary\n\nBash is the GNU shell, compatible with\
    \ the Bourne shell and incorporating many useful features from shells. When the\
    \ shell is started, it reads its configuration files. The most important are:\n\
