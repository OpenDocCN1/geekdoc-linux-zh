    \ sed -n '/errors/p' example\nIt is a text with errors.\nLots of errors.\nSo much\
    \ errors, all these errors are making me sick.\nsandy ->\n```\n\n### 5.2.2. Deleting\
    \ lines of input containing a pattern\n\nWe use the sed example file. Now we only\
    \ want to see the lines not containing the search string:\n\n```\nsandy -> sed\
    \ '/errors/d' example\nThis is the first line of an example text.\nThis is a line\
