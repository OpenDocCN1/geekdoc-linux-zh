    $FORTUNE drugs\n  ;;\n10)\n$FORTUNE education\n  ;;\n0)\necho \"OK, see you\"\n\
    break\n;;\n*)\necho \"That is not a valid choice, try a number from 0 to 10.\"\
    \nesac\n```\n\nMind that break exits the loop, not the script. This can be demonstrated\
    \ by adding an echo command at the end of the script. This echo will also be executed\
