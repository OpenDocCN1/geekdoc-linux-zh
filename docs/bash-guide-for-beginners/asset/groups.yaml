    \n[content]\n\n# 初学者 Bash 指南\n\n前一个命令的选项。`/dev/fd` 实现了统一并防止了混淆：\n\n```\nmichel\
    \ -> filter body.txt | cat header.txt /dev/fd/0 footer.txt | lp\n```\n在这个简洁的示例中，所有输出都通过管道传递给\
    \ lp 发 发送到默认打印机。\n\n## 8.2.4.1. 将文件描述符分配给文件\n\n查看文件描述符的另一种方法是将它们看作一种为文件分配数值的方式。与其使用文件名，可以使用文件描述符编号。`exec`\
    \ 内置命令用于将文件描述符分配给文件。使用：\n\n```\nexec fdN->file\n```\n\n将文件描述符 N 分配给文件用于输出，以及使用：\n\
    \n```\nexec fdN<file\n```\n\n将文件描述符 N 分配给文件用于输入。在将文件描述符分配给文件后，就可以配合 shell 重定向操作符一起使用它，如下例所示：\n\
    \n```\nmichel -> exec 4>result.txt\nmichel -> filter body.txt | cat header.txt\
    \ /dev/fd/0 footer.txt >&4\nmichel -> cat result.txt\n```\n这段文本会在每个打印任务开始时打印，感谢系统管理员为我们设置了如此棒的打印基础设施。\n\
    \n待过滤的文本。\n\n这段文本会在每个打印任务结束时打印。\n\n- 文件描述符 5\n使用此文件描述符可能会导致问题，参见《高级 Bash 脚本指南》第\
    \ 16 章。\n强烈建议不要使用它。\n\n## 8.2.4.2. 在脚本中读取\n\n以下是一个示例，展示了你如何在文件输入和命令行输入之间切换：\n\n\
    ```\nmichel -> ~/testdir cat sysnotes.sh\n#!/bin/bash\n\n# 此脚本为重要的配置文件创建一个索引，将它们合并到\n\
    # 一个备份文件中，并允许为每个文件添加注释。\n\nCONFIG=/var/tmp/sysconfig.out\nrm \"$CONFIG\" 2>/dev/null\n\
    echo \"Output will be saved in $CONFIG.\"\n\nexec 7< /etc/passwd\n\n# 读取 /etc/passwd\
    \ 的第一行\nread rootpassword\n\nechoecho \"Saving root info...\"\necho \"Your root\
    \ account info: $rootpassword\" >> \"$CONFIG\"\n\nexec 0<7 7&-\n\necho -n \"Enter\
    \ comment or [ENTER] for no comment: \"\nread comment; echo $comment >> \"$CONFIG\"\
    \n\necho \"Saving hosts information...\"\n\n# 首先准备一个不包含注释的 hosts 文件\nTEMP=/var/tmp/hosts.tmp\n\
    cat /etc/hosts | grep -v \"#*\" \"$TEMP\"\n\nexec 0<7 7&-\n\nread ip1 name alias1\n\
    read ip2 name alias2\n\necho \"Your local host configuration: >> \"$CONFIG\"\n\
    \necho \"$ip1 name alias1 >> \"$CONFIG\"\necho \"$ip2 name alias2 >> \"$CONFIG\"\
    \n\nexec 0<7 7&-\n\necho -n \"Enter comment or [ENTER] for no comment: \"\nread\
    \ comment; echo $comment >> \"$CONFIG\"\nrm \"$TEMP\"\n```\n\n```\nmichel ~/testdir/\
    \ sysnotes.sh\nOutput will be saved in /var/tmp/sysconfig.out\nSaving account\
    \ info...\nEnter comment or [ENTER] for no comment: hint for password: blue lagoon\n\
    Saving hosts information...\nEnter comment or [ENTER] for no comment: in central\
    \ DNS\n\n```\n\nmichel ~/testdir/ cat /var/tmp/sysconfig.out\nYour account info:\n\
    root:x:0:0:/bin/bash\nhint for password blue lagoon\nYour local host configuration:\n\
    127.0.0.1 localhost.localdomain localhost\n192.168.42.1 tintagel.kingarthur.com\
    \ tintagel\ncentral DNS\n```\n\n等待，在不再需要文件描述符时关闭它是一个良好的习惯。这是通过语法实现的：\n\n```\n\
    exec FD&-\n```\n\n在上面的示例中，被分配给标准输入的文件描述符 7 每次在用户需要访问标准输入设备（通常是键盘）时都会被关闭。\n\n以下是一个将标准错误重定向到管道的简单示例：\n\
    \n```\nmichel -> cat listdirs.sh\n#!/bin/bash\n\n# 此脚本原封不动地打印标准输出，而标准错误被\n# 重定向以供\
    \ awk 处理。\n\nINPUTDIR=$1\n\nexec 6> /dev/null\n\nls \"$INPUTDIR\"/* 2>&1 6>&-\
    \ \\\n  # 为 awk 关闭 fd 6，但不对 ls 关闭。\n| awk 'BEGIN { FS=\":\" } print \"YOU HAVE\
    \ NO ACCESS TO\" $2 }' 6>&-\nexec 6>&-\n```\n\n## 8.2.4.4. Here documents（在此文档）\n\
    \n经常，你的脚本可能会调用另一个需要输入的程序或脚本。here document 提供了一种方法指示 shell 从当前源读取输入，直到找到仅包含该字符串的行（没有尾随空格）。到此为止的所有行都将作为命令的标准输入。\n\
    \n结果是，不需要调用单独的文件；可以使用 shell 字符，而且看起来比一堆 `echo` 要漂亮得多：\n\n```\nmichel -> cat startsurf.sh\n\
    #!/bin/bash\n\n# 此脚本为用户提供了在浏览器之间选择的方便方法。\necho \"These are the web browsers on\
    \ this system:\"\n\n# 开始 here document \ncat << BROWSERS\nmozilla\nlinks\nkonqueror\n\
    opera\nnetscape\nBROWSERS\n# 结束 here document\n\necho -n \"Which is your favorite?\
    \ \"\nread browser\n\necho \"Starting $browser, please wait...\"\n```\n\n```\n\
    michel -> startsurf.sh\nThese are the web browsers on this system:\nmozilla\n\
    links\nkonqueror\nopera\nnetscape\nWhich is your favorite?\nStarting firefox,\
    \ please wait...\n```\n*(注：由于原文提供的文本在示例 处存在多处重复和混乱，翻译时尽可能还原原意。)*\n\n```\n"
