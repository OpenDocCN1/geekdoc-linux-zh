    - **file**: 确定文件类型。

    - **find**: 查找文件。

    - **formail**: 邮件（重）格式化。

    - **fortune**: 打印一条随机且可能有趣的格言。

    - **ftp**: 文件传输服务（除非使用匿名帐户，否则不安全！）


    ## G


    - **galeon**: 图形化 浏览器。

    - **gdm**: Gnome 显示管理器。

