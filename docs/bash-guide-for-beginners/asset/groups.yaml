    \n## 4.1. Regular expressions\n\n### 4.1.1. What are regular expressions?\n\n\
    A regular expression is a pattern that describes sets of strings. Regular expressions\
    \ are constructed analogously to arithmetic expressions by various operators to\
    \ combine smaller expressions.\n\nThe fundamental building blocks are the regular\
    \ expressions that match a single character. Most characters, including all letters\
    \ and digits, are regular expressions that match themselves. Any metacharacter\
    \ with special meaning may be quoted by preceding it with a backslash.\n\n###\
    \ 4.1.2. Regular expression metacharacters\n\nA regular expression may be followed\
    \ by one of several repetition operators (metacharacters):\n\nTable 4–1. Regular\
    \ expression operators\n\n| Operator | Effect |\n| :--- | :--- |\n| . | Matches\
    \ any single character. |\n| ? | The preceding item is optional and will be matched,\
    \ at most, once. |\n| * | The preceding item will be matched zero or more times.\
    \ |\n| + | The preceding item will be matched one or more times. |\n| [N] | The\
    \ preceding item is matched exactly N times. |\n| [N,] | The preceding item is\
    \ matched N or more times. |\n| [N,M] | The preceding item is matched at least\
    \ N times, but not more M times. |\n| - | represents the range if it's not first\
    \ or last in a list or the ending point of a range in a list. |\n| ^ | Matches\
    \ the empty string at the beginning of a line; also represents the characters\
    \ not in the range of a list. |\n| $ | Matches the empty string at the end of\
    \ a line. |\n| \\b | Matches the empty string at the edge of a word. |\n| \\B\
    \ | Matches the empty string provided it's not at the edge of a word. |\n| \\\
    W | Match the empty string at the beginning of word. |\n| \\b | Match the empty\
    \ string at the end of word. |\n\nBash Guide for Beginners\n\nTwo regular expressions\
    \ may be concatenated; the resulting regular expression matches any string formed\
    \ by concatenating two substrings that respect the concatenated subexpressions.\n\
    \nTwo regular expressions may be joined by the infix operator \"|\"; the resulting\
    \ regular expression matches any string matching either subexpression.\n\nRepetition\
    \ takes precedence over concatenation, which in turn takes precedence over alternation.\
    \ A whole subexpression may be enclosed in parentheses to override this precedence\
    \ rules.\n\n### 4.1.3. Basic versus extended regular expressions\n\nIn basic expressions\
    \ the metacharacters \"?\", \"+\", \"[\", \"|\", \"(\", and lose their special\
    \ meaning; instead use backashed versions of \"?\", \"+\", \"|\", and \")\".\n\
    \nCheck your system using regular expressions.\n\n## 4.2. Examples\n\n### 4.2.1.\
    \ What is grep?\n\ngrep searches the input files for a given pattern. When it\
    \ finds a match, it copies the line to standard output (by default). Since grep\
    \ has no limits on length, it matches arbitrary characters.\n\nSome examples:\n\
    \n```\ncathy -> grep root /etc/passwd\nroot:0:0:/root:/bin/bash\noperator:x:1:operator:/sbin/nologin\n\
    news:x:13:news:/var/pool/news:\n```\n\nChapter 4. Regular expressions\n65\nBash\
    \ Guide for Beginners\n\n## 4.2. Grep and regular expressions\n\n- * If you are\
    \ not on Linux\n  We use grep in these examples, which supports regular expressions.\
    \ GNU grep is the default on Linux systems. If you are working on proprietary\
