    ```\n\n## 7.1.2.3. 字符串比较\n\n一个用于测试用户 ID 的字符串比较示例：\n\n```bash\nif [ \"$(whoami)\"\
    \ != 'root' ]; then\n    echo \"You have no permission to run $0 as non-root user.\"\
    \nfi\n```\n\n在 Bash 中，你可以缩短这段逻辑。上述测试的紧凑版本如下：\n\n```bash\n[ \"$(whoami)\" != 'root'\
    \ ] && ( echo you are using a non-privileged account; exit 1 )\n```\n\n与 `&` 表达式（表示当测试为真时执行的操作）类似，`|`\
    \ 指定了当测试为假时执行的操作。\n\n比较中也可以使用正则表达式：\n\n```\nanny > gender=\"female\"\nanny > if\
    \ [[ \"$gender\" == * ]];\n then echo \"Pleasure to meet you, Madame.\"; fi\n\
    Pleasure to meet you, Madame.\nanny >\n```\n\n## 第 7 章. 条件语句\n\n大多数程序员更倾向于使用 `test`\
    \ 内置命令，这等同于使用方括号进行比较，如下所示：\n\n```bash\ntest [ \"$(whoami)\" != 'root' ] && (echo\
