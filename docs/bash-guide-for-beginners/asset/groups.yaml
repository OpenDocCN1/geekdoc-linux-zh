  mdcn: "\n\n## 初学者 Bash 指南\n\n下表列出了其他实用 Bash 选项的概述：\n\n表 2–1. 设置调试选项概述\n\n| 短写 |\
    \ 完整写法 | 结果 |\n| --- | --- | --- |\n| set -f | set -o noglob | 禁用使用元字符生成文件名（通配符）。\
    \ |\n| set -v | set -o verbose | 按照读取顺序打印 shell 输入。 |\n| set -x | set -o xtrace\
    \ | 在执行命令之前打印命令跟踪。 |\n\n使用减号 `-` 用于激活 shell 选项，加号 `+` 用于禁用它。不要让这困扰你！\n\n在下面的示例中，我们在命令行中演示了这些选项：\n\
    \n```\nwilly:///scripts> set -v\nwilly:///scripts> ls\nls\ncommented-scripts.sh\
    \ script1.sh\n\nwilly:///scripts> set +v\nset +v\n\nwilly:///scripts> ls *\ncommented-scripts.sh\
    \ script1.sh\n\nwilly:///scripts> set -f\nwilly:///scripts> ls *\nls: No such\
    \ file or directory\n\nwilly:///scripts> touch *\nwilly:///scripts> ls\n* commented-scripts.sh\
    \ script1.sh\nwilly:///scripts> rm *\nwilly:///scripts> ls\ncommented-scripts.sh\
    \ script1.sh\n```\n\n或者，可以在脚本中指定这些模式，通过将所需的选项添加到第一行的 shell 声明中。选项可以组合，就像在 UNIX\
    \ 命令中通常这样做一样：\n\n```bash\n#!/bin/bash -xv\n```\n\n一旦你发现了脚本中的错误部分，你可以在每个不确定的命令之前添加\
    \ `echo` 语句，这样你就能确切看到问题出在哪里以及为什么无法工作。在 `commented-script1.sh` 脚本示例中，可能是这样的，尽管变量的显示仍然给我们带来了问题：\n\
    \n```bash\necho \"debug message: now attempting to start command\"; w\n```\n\n\
    在更高级的脚本中，可以插入 `echo` 来显示变量在脚本不同阶段的内容，以便检测缺陷：\n\n## 第 2 章 编写和调试脚本\n\n## 初学者 Bash\
    \ 指南\n\n```bash\necho \"Variable VARNAME is now set to $VARNAME.\"\n```\n\n##\
    \ 2.4. 总结\n\n脚本是一系列可重用的命令，放置在一个可执行的文本文件中。任何文本编辑器都可以用于编写脚本。\n\n脚本以 `#` 开头，随后是执行脚本命令的\
    \ shell 路径。在脚本中添加注释是为了以后自己的参考，也是为了让其他用户能够理解。解释多总比解释少好。\n\n可以使用 shell 选项对脚本进行调试。shell\
    \ 选项可以用于部分调试，也可以用于分析整个脚本。在策略位置插入 `echo` 命令也是一种常见的排错技术。\n\n## 2.5. 练习\n\n此练习将帮助你创建第一个脚本。\n\
    \n- 1. 使用你喜欢的编辑器编写一个脚本。该脚本应该显示你的主目录路径和你正在使用的终端类型。此外，它还要显示系统在运行级别 3 上启动的所有服务（提示：使用\
    \ HOME、TERM 和 `ls /etc/rc.d/*`）\n- 2. 在你的脚本中添加注释。\n- 3. 为脚本的用户添加信息。\n- 4. 修改脚本的权限以便你可以运行它。\n\
    - 5. 在普通模式和调试模式下运行脚本。它应该无错误运行。\n- 6. 在脚本中制造错误：看看如果拼错命令、漏掉第一行或在其中放入一些无法理解的内容、或者如果拼错\
    \ shell 变量名或在声明为大写字母后将其写为小写字母会发生什么。检查调试注释对此是如何说明的。\n\n## 第 3 章 Bash 环境\n\n在本章中，我们将讨论影响\
    \ Bash 环境的各种方式：\n\n- 编辑 shell 初始化文件\n- 使用变量\n- 使用不同的引号样式\n- 执行算术计算\n- 分配别名 (aliases)\n\
    - 使用扩展和替换\n\n## 3.1. Shell 初始化文件\n\n### 3.1.1. /etc/profile\n\n当使用 `--login` 选项交互式调用或作为\
    \ `sh` 调用时，Bash 会读取 `/etc/profile` 指令。这些指令通常设置 shell 变量 `PATH`、`USER`、`MAIL`、`HOSTNAME`\
    \ 和 `HISTSIZE`。\n\n在某些系统中，`umask` 值在 `/etc/profile` 中配置；而在其他系统中，该文件包含其他配置文件，例如：\n\
    \n- `/etc/inputrc`，系统范围 Readline 初始化文件，你可以在其中配置命令行铃声样式。\n- `/etc/profile.d` 目录，包含配置特定程序系统级行为的文件。\n\
    \n你希望应用到所有用户环境设置都应该在这个文件中。它看起来可能如下：\n\n```bash\n# /etc/profile\n# 全局环境和启动程序，用于登录设置\n\
