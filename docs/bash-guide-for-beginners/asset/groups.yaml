    # 第 1 章. Bash 和 Bash 脚本


    在本介绍模块中，我们：


    - 描述一些常见的 shell

    - 指出 GNU Bash 的优势特性

    - 描述 shell 的构建块

    - 讨论 Bash 初始化文件

    - 查看 shell 如何执行命令

    - 查看一些简单的脚本示例


    ## 1.1. 常见的 shell 程序


    ### 1.1.1. 通用 shell 函数


    UNIX shell 程序解释用户命令，这些命令由用户直接输入，也可以从名为 shell 脚本或 shell程序的文件中读取。脚本是被解释的，而不是编译的。shell
    按行读取脚本中的命令，对于系统命令（见第 1.2 节），而编译器将程序转换为机器可读的形式，即可执行文件——该文件可以在 shell 脚本中使用。


    除了向内核传递命令外，shell 的主要任务是提供用户环境，该环境可以使用 shell 配置文件进行单独配置。


    ### 1.1.2. Shell 类型


    就像人们了解不同的语言和方言一样，你的 UNIX 系统通常会提供各种类型的 shell：


    - sh 或 Bourne Shell：在 UNIX 系统和 UNIX 相关环境中仍在使用的原始 shell。这是基础 shell，一个功能较少的小型程序。虽然它不是标准，但在每个
    Linux 系统上它仍然可用，以与 UNIX 程序保持兼容。

    - bash 或 Bourne Again：标准的 GNU shell，直观且灵活。对于初学者来说，这可能是最建议的，同时它对高级用户和专业用户来说也是一个强大的工具。在
    Linux 上，bash 是普通用户的标准。这个 shell 是所谓的 Bourne shell 的超集，包含一组附加组件和插件。这意味着 Bourne Again
    与 Bourne shell 兼容；在 sh 中运行的命令在 bash 中同样有效。然而，反之则并不总是成立。书中的所有练习和示例都使用 bash。

    - csh 或 C：该 shell 的语法类似于 C 语言语言。程序员有时会要求使用。

    - tsch 或 Turbo C：C shell 的超集，增强了用户友好性和速度。

    - ksh 或 Korn shell：有时受到具有 UNIX 背景的人青睐。Bourne shell 的超集；对于初学者来说，其兼容性是一场噩梦。


    文件 /etc/shells 提供了 Linux 系统已知 shell 的概览：


    ```

    mia-> cat /etc/shells

    /bin/bash

    ```


    # 初学者 Bash 指南


    /bin/sh

    /bin/tcsh

    /bin/csh


    你的默认 shell 设置在 /etc/passwd 文件中，用户 mia 所示：


    ```

    mia:L2NOfqdlPrHWe:504:504:Mia Maya:/home/mia:/bin/bash

    ```


    要从一个 shell 切换到另一个 shell，只需在活动终端中输入新 shell 的名称。系统通过 PATH 设置查找该名称所在的目录，由于 shell
    是一个可执行文件（程序），当前 shell 会激活并执行它。通常会显示一个新的提示符，因为每个 shell 都有其典型的外观：


    ```

    mia:~ tcsh

    mia@post21]$

    ```


    ## 1.2. Bourne Again 的优势


    ### 1.2.1. Bash 和 GNU shell


    GNU 项目（Bourne Again SH）提供了用于系统管理的工具，这些工具是自由软件并符合 UNIX 标准。Bash 是一种兼容 sh 的 shell，结合了
    Korn shell (ksh) 和 C shell (csh) 的有用功能。它旨在符合 IEEE POSIX-1003.1。它在编程和交互式使用方面比 sh
    提供了功能性改进；这些包括行编辑、作业控制、shell 函数、索引数组和整数算术。与其他项目一样，bash 的启动是为了保护和促进使用、复制、修改和分发软件的自由。


    ## 1.2. 仅 bash 的有的


    ### 1.2.2.1. 调用


    除了通常可以使用 set 内置命令配置的单字符 shell 命令行选项外，还有几个你可以使用的多字符选项。我们将在接后的章节中遇到几个更流行的选项；完整列表可以在
    Bash info 页面中找到。


    ### 1.2.2.2. 启动文件


    启动文件是 Bash 启动时读取并执行的脚本。以下小节描述了启动 shell 的不同方式。


    1.2.2.1. 作为交互式登录 shell 调用


    除了通常可以使用 set 内置命令配置的单字符 shell 命令行选项外，还有几个你可以使用的多字符选项。我们将在接后的章节中遇到几个更流行的选项；完整列表可以在
    Bash info 页面中找到。


    1.2.2.2. 启动文件


    启动文件是 Bash 启动时读取并执行的脚本。以下小节描述了启动 shell 的不同方式。


    1.2.2.1. 作为交互式登录 shell 调用


    除了通常可以使用 set 内置命令配置的单字符 shell 命令行选项外，还有几个你可以使用的多字符选项。我们将在接后的章节中遇到几个更流行的选项；完整列表可以在
    Bash info 页面中找到。


    1.2.2.2. 作为交互式非登录 shell 调用


    非登录 shell 意味着你对系统进行身份验证。例如，当你打开终端时，这是一个非登录 shell。读取的文件：


    - /etc/profile

    - ~/.bash_profile

    - ~/.login

    - ~/.profile

    - ~/.bashrc


    1.2.2.3. 作为非交互式 shell 调用


    非登录 shell 用于执行某些任务。bashrc：


    ```

    if -f ~/.bashrc ]; then ~/.bashrc; fi

    ```

    请参阅第 7 章了解有关 结构的更多信息。


    1.2.2.4. 带有 sh 命令调用


    bash 尝试像传统的 Bourne sh 程序一样运行，同时符合 POSIX 标准。读取的文件：


    - /etc/profile

    - ~/.profile


    1.2.2.5. POSIX 模式


    在交互式调用时，ENV 变量指向额外的启动信息。此选项可以通过 set 内置命令启用：


    ```

    set -o posix

    ```


    或者在调用 bash 程序时使用 --POSIX 选项。此时 Bash 将尝试尽可能符合 POSIX 标准。设置 POSIXLY_CORRECT 变量也一样。读取的文件：


    - 由 ENV 变量定义。


    1.2.2.6. 远程调用


    由 rsh 调用时读取的文件：


    - ~/.bashrc


    > **避免使用**

    > 注意使用 login, telnet, rsh 和 rcp 等工具的危险。它们在本质上是不安全的；敏感数据在网络上传输未加密。如果你需要执行、文件传输等工具，请使用安全
    Shell（通常称为 SSH），可以从 http://www.openssh.org 免费获取。非 UNIX 系统也有不同的客户端程序，请使用你的本地镜像软件。


    1.2.2.7. 当 UID 不等于 EUID 时调用


    在这种情况下不读取启动文件。


    1.2.2.3. 交互式 shell


    ### 1.2.2.3.1. 什么是交互式 shell？


    交互式 shell 通常从用户的终端读取并写入：输入和输出与终端连接。当调用 bash 命令且不带非选项参数时，会启动交互行为，除非选项是用于从标准输入，这允许设置位置参数（见第
    3 章）。


    ### 1.2.2.3.2. 此 shell 是交互式的吗


    通过查看特殊字符 - 的内容，当 shell 是交互式的，它包含 ''i''：


    ```

    ed:-> echo $-

    himBu

    ```


    在非交互式 shell 中，提示符 PS1 未设置。


