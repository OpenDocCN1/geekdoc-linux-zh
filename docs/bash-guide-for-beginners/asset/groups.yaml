    In nested loops, break allows for specification of which loop to exit. See the\
    \ Bash info pages for more.\n\n### 9.5.2. The continue built-in\n\nThe continue\
    \ statement resumes iteration of an enclosing for, while, until or select loop.\n\
    \nWhen used in a for loop, the controlling variable takes on the value of the\
