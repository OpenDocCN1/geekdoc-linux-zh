- md: "\n```bash\n;; \nesac\ndone\nrm \"$QUIT*\"\n```\n\n## 9.6.2. Submenus\n\nAny\
    \ statement within a select construct can be another select loop, enabling (a\
    \ submenu) within a menu.\n\nBy default, the PS3 variable is not changed when\
    \ entering a nested select loop. If you want a different prompt in the submenu,\
    \ be sure to set it at the appropriate time(s).\n\n## 9.7. The shift built-in\n\
    \n### 9.7.1. What does it do?\n\nThe shift command is one of the Bourne shell\
    \ built-ins that comes with Bash. This command takes one argument, and the positional\
    \ parameters are shifted to the left by this number, N. The positional parameters\
    \ from N+1 to $# are renamed to variables named $1 to $# - N+1.\n\nSay you have\
    \ a command that takes 10 arguments, and N is 4, then $4 becomes $1, $5 becomes\
    \ $2 and so on. $10 becomes $7 and the original $1, $2 are thrown away.\n\nIf\
    \ N is zero or greater than $# (the total number of arguments, see Section 7.2.1.2).\
    \ If N is not present, it is assumed to be 1. The return status is zero unless\
    \ N is greater than $# or less than zero; otherwise it is.\n\n## 9.7.2. Examples\n\
    \nA shift is typically used when the number of arguments to a command is not known\
    \ in advance, for instance when users can give as many arguments as they like.\
    \ In such cases, the arguments are processed in a while loop with a test of ((\
    \ $*)). This condition is true as long as the number of arguments is greater than\
    \ zero. The $1 variable and the shift statement process each argument. The number\
    \ of arguments is reduced each shift is executed and becomes zero, which the while\
    \ loop exits.\n\nThe example below, cleanup.sh, uses shift statements to process\
    \ each file in the list generated by find:\n\n```bash\n#!/bin/bash\n# This script\
    \ can clean up files that were last accessed over 365 days ago.\nUSAGE=\"Usage:\
    \ $0 dir dir2 dir3 ...dirN\"\nif [ \"$#\" == \"0\" ]; then\n  echo \"$USAGE\"\n\
    \  exit 1\nfi\nwhile [ -n \"$1\" ]; do\n  if [ -d \"$1\" ]; then\n    echo \"\
    Empty directory, nothing to be done.\"\n  else\n    find \"$1\" -type f -atime\
    \ +365 -exec rm -i {} \\;\n  fi\n  shift\ndone\n```\n\n-exec vs. xargs command\
    \ can be replaced with the following:\n\n```bash\nfind options | xargs [commands_to_execute_on_found_files]\n\
    ```\n\nThe xargs command builds and executes command lines from standard input.\
    \ This has the advantage that the line is filled until the system limit is reached.\
    \ Only then will the command to execute be called, in this example this would\
    \ be rm. If there are more arguments, a new command line will be used, until one\
    \ is full or there are no more arguments. find -exec calls on the command to execute\
    \ on the found every time a file is found. Thus, using xargs greatly speeds up\
    \ your scripts and the performance of your machine.\n\nIn the next example, we\
    \ modified the script in Section 8.2.4.4 so that it accepts multiple packages\
    \ at once:\n\n```bash\n#!/bin/bash\nif [ $# -lt 1 ]; then\n    echo \"Usage: $0\
    \ package(s)\"\n    exit 1\nfi\nwhile [ $# -gt 0 ]; do\n    yum install $1 <<\
    \ CONFIRM\nyes\nCONFIRM\n    shift\ndone\n```\n\n## 9.8. Summary\n\nIn this chapter,\
    \ we discussed how repetitive commands can be incorporated in loop constructs.\
    \ Most common loops are built using the for, while or until statements, or a combination\
    \ of these commands. The for loop executes a task a defined number of times. If\
    \ you don't know how many times a command should execute, use either for or while\
    \ to specify when the loop should end.\n\nLoops can be interrupted or reiterated\
    \ using the break and continue statements.\n\nA file can be used as input for\
    \ a loop using the input direction operator, loops can also read output from commands\
    \ that is fed into the loop via pipe.\n\nThe select construct is used for printing\
    \ menus in interactive scripts. Looping through the command line arguments to\
    \ a script can be done using the shift statement.\n\n## 9.9. Exercises\n\nRemember:\
    \ when building scripts, work in steps and test each step before incorporating\
    \ it in your script.\n\n1. Create a script that will take a (recursive) copy of\
    \ files in /etc so that a beginning administrator can edit files without fear.\n\
    2. Write a script that takes exactly one argument, a directory name. If the number\
    \ of arguments is less than one, print a usage message. If the argument is not\
