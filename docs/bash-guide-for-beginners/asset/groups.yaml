    \ like this:\n\n```\nsandy -> sed -n '/.*\\.errors$/p' example\nThis is a line\
    \ not containing any errors.\nsandy ->\n```\n\n### 5.2.3. Ranges of lines\n\n\
    This time we want to take out the lines containing the errors. In the example\
