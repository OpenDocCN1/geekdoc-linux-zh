  - "[PAGE 111]\n\n# Bash Guide for Beginners\n\nsyntax. In the above example, file\
    \ descriptor 7, which has been assigned to standard input, is closed each time\
    \ the user needs to have access to the standard input device, usually the keyboard.\n\
    \nThe following is a simple example redirecting standard error to a pipe:\n\n\
    ```\nmichel -> cat listdirs.sh\n#!/bin/bash\n\n# This script prints standard output\
    \ unchanged, while standard error is\n# redirected for processing by awk.\n\n\
    INPUTDIR=$1\n\nexec 6>&&\n\nls \"$INPUTDIR\"/* 2>&1 6>&- -\\\n  # Closes fd 6\
    \ for awk, but not for ls.\n| awk 'BEGIN { FS=\":\" } print \"YOU HAVE NO ACCESS\
    \ TO\" $2 }' 6>&-\nexec 6>&\n```\n\n# 8.2.4.4. Here documents\n\nFrequently, your\
    \ script might call on another program or script that requires input. The here\
    \ document provides a way of instructing the shell to read input from the current\
    \ source until a line containing only the string is found (no trailing blanks).\
    \ All of the lines up to that point are then used as the standard input for a\
    \ command.\n\nThe result is that you don't need to call separate files; you can\
    \ use shell-characters, and it looks nicer than a bunch of echo's:\n\n```\nmichel\
    \ -> cat startsurf.sh\n#!/bin/bash\n\n# This script provides an easy way for users\
    \ to choose between browsers.\necho \"These are the web browsers on this system:\"\
    \n\n# Start here document\ncat << BROWSERS\nmozilla\nlinks\nlynx\nkonqueror\\\
    opera\nnetscape\nBROWSERS\n# End here document\n\necho -n \"Which is your favorite?\"\
    \nread browser\n\necho \"Starting $browser, please wait...\"\n$browser &\nmichel\
    \ -> startsurf.sh\nThese are the web browsers on this system:\n```"
