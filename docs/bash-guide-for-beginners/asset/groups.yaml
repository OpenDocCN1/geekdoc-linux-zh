    # 8.2.4.2. Read and exec


    # 8.2.4.1. Assigning file descriptors to files


    Another way of looking at file descriptors is thinking of them as a way to assign
    a numeric value to a file. Instead of using the file name, you can use the file
    descriptor number. The exec built-in command is used to assign a file descriptor
    to a file. Use


    ```

    exec fdN->file

    ```


    for assigning file descriptor N to file for output, and


    ```

    exec fdN->file

    ```


    for assigning file descriptor N to file for input. After a file descriptor has
    been assigned to a file, it can be used with the shell redirection operators,
    as is demonstrated in the following example:


    ```

    michel -> exec 4 result.txt

    michel -> filter body.txt | cat header.txt /dev/fd/0 footer.txt >&4

    michel -> cat result.txt

    This text is printed at the beginning of each print job and thanks the sysadmin

    setting for us such a great printing infrastructure.

    ```


    Text to be filtered.


    This text is printed at the end of each print job.


    +   * File descriptor 5

    Using this file descriptor might cause problems, the Advanced Bash–Scripting Guide,
    chapter 16.

    You are strongly advised not to use it.


    # 8.2.4.2. Read in scripts


    The following is an example that shows how you can alternate between file input
    and command line input:


    ```

    michel -> ~/testdir cat sysnotes.sh

    #!/bin/bash


    # This script makes an index of important config files, puts them together in

