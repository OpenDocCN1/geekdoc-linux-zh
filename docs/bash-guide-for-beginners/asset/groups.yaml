    t\\t \\t\\t\\t\\t\\t\\\"Unhealthy is my middle name\\\" Soggie.\"\n  ;;\n5)\n\
    $FORTUNE bofh-excuses\n  ;;\n6)\n$FORTUNE magic\n```\n\nChapter 9. Repetitive\
