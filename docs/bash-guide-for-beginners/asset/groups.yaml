    # 10. 本文档的结构


    本指南讨论了对严谨的 Bash 用户日常生活中有用的概念。虽然需要具备 shell 使用的基本知识，但我们将在前三章中开始讨论基本的 shell 组件和实践。


    第四章到第六章讨论了 shell 脚本中常用的基本工具。


    第八章到第十二章讨论了 shell 脚本中最常见的结构。


    所有章节都附有练习题，将测试你为下一章做的准备工作。


    - 第 1 章：Bash 基础：为什么 Bash 是好用的、构建块、开发脚本的第一条指南。

    - 第 2 章：脚本基础：编写与调试。

