    # 简介


    ## 1. 为什么要写本指南？


    编写本文档的主要原因是，许多读者觉得现有的 HOWTO 指南太短且不完整，而《Bash 脚本指南》又太像是一本参考书。在这两个极端之间缺乏一种平衡点。我编写本指南还基于一个通用原则：目前缺乏足够的免费基础课程，尽管它们本应该是有的。


    这是一份实用的指南，虽然并不总是过于严肃，但它提供了真实生活而非理论的示例。也许我之所以写，是因为我厌倦了那些由专业人士编写的精简且过度简化的示例——他们展示了一些非常酷的
    Bash 特性，但由于脱离了上下文，导致你在实际情况下完全用用不上。你可以在完本书后再读那些内容，本书包含了对现实世界有练习和示例。


    根据我作为 UNIX/Linux 用户、系统管理员和培训师的经验，我知道人们每天与系统打交道，却对任务自动化一无所知。因此，他们经常认为 UNIX 不易用，更糟糕的是，他们觉得它运行缓慢且过时。这个问题也可以通过本指南来解决。


    ## 2. 谁应该读这本书？


    任何在 UNIX 或类 UNIX 系统上工作并希望让生活变得更轻松的人，无论是用户还是系统管理员，都能从本书中受益。已经掌握使用命令行操作系统的读者将学习
    Shell 脚本的精髓，从而简化日常任务的执行。系统管理很大程度上依赖于 Shell 脚本；常见任务通常通过简单的脚本自动化。本文包含了大量的示例，将鼓励你编写自己的脚本，并启发你改进现有脚本。


    先决条件/本课程不包含的内容：


    - 你应该是一个经验丰富的 UNIX 或 Linux 用户，熟悉基础命令、man 页面和文档

    - 能够使用文本编辑器

    - 理解系统启动和关闭过程、init 和脚本

    - 创建用户和组，设置密码

    - 权限、特殊模式

    - 理解设备命名规范、分区、文件系统的挂载/卸载

    - 在你的系统上添加/删除软件


    如果你尚未精通上述某一个或多个主题，请参阅《Linux 简介》（你的本地 TLDP 镜像）。你可以在你的系统文档（man 和 info 页面）或 Linux
    文档项目（LDP）找到更多信息。


