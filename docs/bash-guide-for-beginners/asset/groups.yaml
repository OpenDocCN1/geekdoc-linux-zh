    as [aBCcXxYZa] if sorting is done in dictionary order. To be sure to have the
    traditional interpretation of ranges, force this behavior by setting LC_COLLATE
    and LC_ALL to "C".


    # 4.3.2. Character classes


    Character classes can be specified within the square brackets, using the syntax
    [CLASS]: where CLASS is defined in the POSIX standard and has one of the values


    "alnum", "alpha", "ascii", "blank", "ctrl", "digit", "graph", "lower", "print",
    "punct", "space", "upper", "word" or xdigit".


