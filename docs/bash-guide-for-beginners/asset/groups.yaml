    - Bash built-ins:

    - alias, bind, builtin, command, declare, echo, enable, help, let, local, logout,
    printf, read, shop, typeset, until and aliases.


    When Bash is executing in POSIX mode, the special built-ins differ from other
    built-in commands in three respects:

    - Special built-ins are found before shell functions during command lookup.

    - If a special built-in returns an error status, a non-interactive shell exits.

    - Assignment statements preceding the command stay in the shell environment after
    the command completes.

    The POSIX special built-ins are :, .. break, continue, eval, exec, exit, export,
    readonly, set, shift, trap and unset.


    Most of these built-ins will be discussed in the next chapters. For those commands
    for which this is not the case, we refer to the Info Pages.


    # 1.3.3. Executing programs from a script


    When the program being executed is a shell script, bash will create a new bash
    process using a fork. This subshell reads the lines from the shell script one
    at a time. Commands on each line are read, interpreted and executed as if they
    would come directly from the keyboard.


    While the subprocesses execute each line of the script, the parent shell waits
    for its child process to finish. When there are no more lines in the shell script
    to read, the subshell terminates. The parent shell awakes and displays a new prompt.


