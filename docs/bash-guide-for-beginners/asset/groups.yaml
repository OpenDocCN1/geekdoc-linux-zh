    # Large directories and low bandwidth


    The above is purely an example that everybody can understand, using a small directory
    and a host on the same subnet. Depending on your bandwidth, the size of the directory
    and the location of the remote server, it can take an awful lot of time to make
    backups using this mechanism. For larger directories and lower bandwidth, use
    rsync to keep the directories at all synchronized.


