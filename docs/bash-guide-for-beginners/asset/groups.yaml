    \ `for`、`while` 或 `until` 语句构建，或者是这些命令的组合。`for` 循环执行指定次数的任务。如果你不知道命令应该执行多少次，可以使用\
    \ `for` 或 `while` 来指定循环何时结束。\n\n可以使用 `break` 和 `continue` 语句中断或迭代循环。\n\n可以使用输入重定向操作符作为循环的输入，循环也可以通过管道读取输入命令的输出。\n\
    \n`select` 结构用于在交互式脚本中打印菜单。可以使用 `shift` 语句遍历脚本的命令行参数。\n\n## 9.9. 练习题\n\n记住：在编写脚本时，要分步骤进行，并在每个步骤整合到脚本之前对其进行测试。\n\
