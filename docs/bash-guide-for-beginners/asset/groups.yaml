    # 3.3.5. ANSI–C quoting


    Words in the form "$STRING" are treated in a special way. The word expands to
    a string, with backslash-escaped characters replaced as specified by the ANSI–C
    standard. Backslash escape sequences can be found in the Bash documentation.


    # 3.3.6. Locales


    A double-quoted string preceded a dollar sign will cause the string to be translated
    according to the current locale. If the current locale is "C" or "POSIX", the
    dollar sign is ignored. If the string is translated and replaced, the replacement
    is double-quoted.


    # 3.4. Shell expansion


    # 3.4.1. General


    After the command has been split into tokens (see Section 1.4.1.1), these tokens
    or words are expanded or resolved. There are eight kinds of expansion performed,
    which we will discuss in the next sections, in the order that they are expanded.


    After all expansions, quote removal is performed.


    # 3.4.2. Brace expansion


    Brace expansion is a mechanism by which arbitrary strings may be generated. Patterns
    to brace–expanded take the form of an optional PREAMBLE, followed by a series
    of comma–separated strings between a pair of braces, the preamble is prefixed
    to each string within the braces, and the postscript is then appended to each
    resulting string, expanding left to right.


    Brace expansions may be nested. The results of each expanded string are not sorted;
    left to right order is preserved:


    ```

    franky -> echo sp(el,il,al)

    spell spill spill

    ```


    Brace expansion is performed before other expansions, and any characters special
    to other expansions are preserved in the result. It is strictly textual. Bash
    does not apply any syntactic interpretation to the context of the expansion or
    the text between the braces. To avoid conflicts with parameter expansion, the
    string "${" is not considered eligible for brace expansion.


    A correctly–formed brace expansion must contain unquoted opening and closing braces,
    and at least one unquoted comma. Any incorrectly formed brace expansion remains
    unchanged.'
