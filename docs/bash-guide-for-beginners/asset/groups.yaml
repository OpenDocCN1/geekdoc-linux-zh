    and commands can be part in **awk** scripts for background processing.


    Other things you should know about **awk**:


    +   * The language remains well–known on UNIX and alikes, but for executing similar
    tasks, Perl is more commonly used. However, *awk* has a much steeper learning
    curve. In other words, Perl is more difficult to learn.\n* Both Perl and **awk**
    share the reputation of being incomprehensible, even to the actual authors of
    the programs that use these languages. So document your code!


    # ## 6.5. Exercises


