    \ for uniformity and prevents confusion:\n\n```\nmichel -> filter body.txt | cat\
    \ header.txt /dev/fd/0 footer.txt | lp\n```\nIn this clean example, all output\
    \ is additionally piped through lp to send it to the default printer.\n\n## 8.2.4.1.\
    \ Assigning file descriptors to files\n\nAnother way of looking at file descriptors\
    \ is thinking of them as a way to assign a numeric value to a file. Instead of\
    \ using the file name, you can use the file descriptor number. The exec built-in\
    \ command is used to assign a file descriptor to a file. Use\n\n```\nexec fdN->file\n\
    ```\n\nfor assigning file descriptor N to file for output, and\n\n```\nexec fdN<file\n\
    ```\n\nfor assigning file descriptor N to file for input. After a file descriptor\
    \ has been assigned to a file, it can be used with the shell redirection operators,\
    \ as is demonstrated in the following example:\n\n```\nmichel -> exec 4>result.txt\n\
    michel -> filter body.txt | cat header.txt /dev/fd/0 footer.txt >&4\nmichel ->\
    \ cat result.txt\n```\nThis text is printed at the beginning of each print job\
    \ and thanks the sysadmin\nsetting for us such a great printing infrastructure.\n\
    \nText to be filtered.\n\nThis text is printed at the end of each print job.\n\
    \n- File descriptor 5\nUsing this file descriptor might cause problems, the Advanced\
    \ Bash–Scripting Guide, chapter 16.\nYou are strongly advised not to use it.\n\
    \n## 8.2.4.2. Read in scripts\n\nThe following is an example that shows how you\
    \ can alternate between file input and command line input:\n\n```\nmichel -> ~/testdir\
    \ cat sysnotes.sh\n#!/bin/bash\n\n# This script makes an index of important config\
    \ files, puts them together in\n# a backup file and allows for adding comment\
    \ for each file.\n\nCONFIG=/var/tmp/sysconfig.out\nrm \"$CONFIG\" 2>/dev/null\n\
    echo \"Output will be saved in $CONFIG.\"\n\nexec 7< /etc/passwd\n\n# Read the\
    \ first line of /etc/passwd\nread rootpassword\n\necho \"Saving root info...\"\
    \necho \"Your root account info: $rootpassword\" >> \"$CONFIG\"\n\nexec 0<7 7&-\n\
    \necho -n \"Enter comment or [ENTER] for no comment: \"\nread comment; echo $comment\
    \ >> \"$CONFIG\"\n\necho \"Saving hosts information...\"\n\n# first prepare a\
    \ hosts file not containing any comments\nTEMP=/var/tmp/hosts.tmp\ncat /etc/hosts\
    \ | grep -v \"#*\" \"$TEMP\"\n\nexec 0<7 7&-\n\nread ip1 name alias1\nread ip2\
    \ name alias2\n\necho \"Your local host configuration: >> \"$CONFIG\"\n\necho\
    \ \"$ip1 name alias1 >> \"$CONFIG\"\necho \"$ip2 name alias2 >> \"$CONFIG\"\n\n\
    exec 0<7 7&-\n\necho -n \"Enter comment or [ENTER] for no comment: \"\nread comment;\
    \ echo $comment >> \"$CONFIG\"\nrm \"$TEMP\"\n```\n\n```\nmichel ~/testdir/ sysnotes.sh\n\
    Output will be saved in /var/tmp/sysconfig.out\nSaving account info...\nEnter\
