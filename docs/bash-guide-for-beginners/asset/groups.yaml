    # Bash Guide for Beginners


    The table below gives an overview of other useful Bash options:


    Table 2–1. Overview of set debugging options


    | Short notation | Long notation | Result |

    | --- | --- | --- |

    | set -f | set -o noglob | Disable file name generation using metacharacters (globbing).
    |

    | set -v | set -o verbose | Prints shell inputs as they are read. |

    | set -x | set -o xtrace | Print command traces before executing command. |


    The dash is used to activate a shell option and a plus to deactivate it. Don''t
    let this confuse you!


    In the example below, we demonstrate these options on the command line:


    ```

    willy:///scripts> set -v

    willy:///scripts> ls

    ls

    commented-scripts.sh script1.sh


    willy:///scripts> set +v

    set +v


    willy:///scripts> ls *

    commented-scripts.sh script1.sh


    willy:///scripts> set -f

    willy:///scripts> ls *

    ls: No such file or directory


    willy:///scripts> touch *

    willy:///scripts> ls

    * commented-scripts.sh script1.sh

    willy:///scripts> rm *

    willy:///scripts> ls

    commented-scripts.sh script1.sh

    ```


    Alternatively, these modes can be specified in the script, by adding the desired
    option to the first line shell declaration. Options can be combined, as is usually
    the case with UNIX commands:


    ```

    #!/bin/bash -xv

    ```


    Once you find the buggy part of your script, you can add echo statements before
    each command of which you are unsure, so you will see exactly where and why things
    don''t work. In the example commented-script1.sh script, it could be like this,
    still that the displaying of variables gives us problems:


    ```

    echo "debug message: now attempting to start w command"; w

    ```


    In more advanced scripts, the echo can be inserted to display the content of variables
    at different stages in the script, so that flaws can be detected:


    # Chapter 2. Writing and debugging scripts'
