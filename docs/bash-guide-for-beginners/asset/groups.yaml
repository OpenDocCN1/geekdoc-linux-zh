    \ 列表。\n\n## 9.4. I/O 重定向与循环\n\n### 9.4.1. 输入重定向\n\n与其通过测试命令结果或用户输入来控制循环，你可以指定一个读取文件来控制循环。在这种情况下，`read`\
    \ 通常是控制命令。只要循环中有输入行，循环的执行就会继续。一旦读取完所有输入行，循环就会退出。\n\n由于循环结构被视为一个命令结构（例如 `while\
    \ TEST-COMMAND; do CONSEQUENT-COMMANDS; done`），重定向应该发生在 `done` 语句之后，以便它符合以下格式：\n\
    \ncommand < file\n\n这种重定向也适用于其他类型的循环。\n\n### 9.4.2. 输出重定向\n\n在下面的示例中，`find` 命令的输出被用作控制\
