    ```


    ## 3.2.3. 导出变量 (Exporting variables)


    上述示例中的变量仅对当前 shell 可。它是一个局部变量：当前 shell 的子进程感知不到该变量。为了将变量传递给子壳（subshell），我们需要使用
    `export` 内置命令对其进行导出。被导出的变量被称为环境变量。设置和导出通常在一个步骤中完成：


    ```bash

    export VARNAME="value"

    ```


    子壳可以修改继承自父进程的变量，但子进程的修改不会影响父进程。这可以通过示例所示：


    ```bash

    frank -> full_name="Franky M. Singh"

    frank -> bash

    frank -> echo $full_name


    frank -> exit

    frank -> export full_name

    frank -> bash


    frank -> echo $full_name

    Franky M. Singh


    frank -> export full_name="Charles the Great"


    frank -> echo $full_name

    Charles the Great


    frank -> exit

    frank -> echo $full_name

    Franky M. Singh


    frank ->

    ```


    当第一次尝试在子壳中读取 `full_name` 的值时，它并不（echo 显示为空字符串）。子壳退出，并在父进程中导出 `full_name` —— 变量可以在赋值后被导出。然后启动了一个新的子壳，其中从父进程导出的变量是可见的。变量被更改为另一个名称，但父进程中该变量的值保持不变。


    ## 3.2.4. 预留变量 (Reserved variables)


    ### 3.2.4.1. Bourne shell 变量


    Bash 使用某些 shell 变量的方式与 Bourne shell 相同。在某些情况下，Bash 会为变量分配一个默认值。下表提供了这些普通 shell
    变量的概述：


    表 3–1.Bourne shell 变量


    | 变量名 | 定义 |

    |---|---|

    | CDPATH | 一个用冒号分隔的目录列表，用作 `cd` 内置命令的搜索路径。 |

    | HOME | 当前用户的家目录；`cd` 内置命令的默认值。该变量的值也用于波浪号扩展（tilde expansion）。 |

    | IFS | 用于分隔字段的字符列表；当 shell 在展开过程中拆分单词时使用。 |

    | MAIL | 如果此参数设置为一个文件名且 `MAILPATH` 变量未设置，Bash 会通知用户指定文件中有新邮件。 |

    | MAILPATH | 一个用冒号分隔的文件名列表，shell 定期检查这些文件是否有新邮件。 |

    | OPTARG | `getopts` 内置命令处理的最后一个选项的值。 |

    | OPTIND | `getopts` 内置命令处理的最后一个选项的索引。 |

    | PATH | 一个用冒号分隔的目录列表，shell 在这些列表中查找命令。 |

    | PS1 | 主提示符字符串。默认值为 `"\s-\w\$ `。 |

    | PS2 | 次级提示符字符串。默认值为 `">"`。 |


