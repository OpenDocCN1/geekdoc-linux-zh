    How the lady hasn't got a drink yet?\"\nffi\nhow the lady hasn't got a drink yet?\n\
    ```\n\n紧跟 `then` 语句的 CONSEQUENT-COMMANDS 列表一样，`else` 语句后面的 ALTERNATE-CONSEQUENT-COMMANDS\
    \ 列表包含任何返回退出状态的 UNIX 风格命令。\n\n另一个示例，来自第 7.1.2.1 节：\n\n```bash\nanny -> su -\n\
    Password:\n[root@elegance root]# if grep $USER /etc/passwd 2>/dev/null\nthen echo\
    \ \"user account is not managed locally\"\nelse \necho \"your account is managed\
