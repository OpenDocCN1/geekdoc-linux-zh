    !/bin/bash\n```\n\n```bash\n# 此脚本在当前目录下创建一个子目录，并将旧文件移动到其中。\n# 可以作为 cron（稍作调整后）每周或每月执行的任务。\n\
    ```\n\n```bash\nARCHIVENAME=$(date +%Y%m%d)\nDESTDIR=$PWD/archive-$ARCHIVENAME\n\
    ```\n\n```bash\nmkdir $PWD -type f -a -mtime +5 | while read file\ndo\ngzip \"\
    $file\"; mv \"$file\".gz \"$DESTDIR\"\necho \"$file archived\"\ndone\n```\n\n\
    第 9 章。重复性任务\n\n# 初学者 Bash指南\n\n文件在移动到存档目录之前会进行压缩。\n\n## 9.5. Break 和 continue\n\
    \n### 9.5.1. break 内置命令\n\n`break` 语句用于在循环正常结束之前退出当前循环。这用于在你提前不知道循环需要执行多少次的情况下，例如它取决于用户输入。\n\
    \n下面的示例演示了一个可以中断的 `while` 循环。这是对 9.2.2.3 节中 `wisdom.sh` 脚本的改进版本。\n\n```bash\n\
    #!/bin/bash\n\n# 此脚本提供格言\n# 你现在可以用体面的方式退出了。\n\nFORTUNE=$usr/games/fortune\n\n\
    while true;\necho \"On which topic do you want advice?\"\necho \"1. politics\"\
    \necho \"2. startrek\"\necho \"3. kernelnewbies\"\necho \"4. sports\"\necho \"\
    5. bofh-excuses\"\necho \"6. magic\"\necho \"7. love\"\necho \"8. literature\"\
    \necho \"9. drugs\"\necho \"10. education\"\n\necho -n \"Enter your choice, or\
    \ 0 for exit: \"\nread choice\necho\n\ncase $choice in\n1)\n$FORTUNE politics\n\
    \  ;;\n2)\n$FORTUNE startrek\n  ;;\n3)\n$FORTUNE kernelnewbies\n  ;;\n4)\necho\
    \ \"Sports are a waste of time, energy and money.\"\necho \"Go back to your keyboard.\"\
    \necho -e \"\\t\\t\\t\\t \\t\\t\\t\\t\\t\\\"Unhealthy is my middle name\\\" Soggie.\"\
    \n  ;;\n5)\n$FORTUNE bofh-excuses\n  ;;\n6)\n$FORTUNE magic\n```\n\n第 9 章。重复性任务\n\
    \n```bash\n7)\n$FORTUNE love\n  ;;\n8)\n$FORTUNE literature\n  ;;\n9)\n$FORTUNE\
    \ drugs\n  ;;\n10)\n$FORTUNE education\n  ;;\n0)\necho \"OK, see you\"\nbreak\n\
    ;;\n*)\necho \"That is not a valid choice, try a number from 0 to 10.\"\nesac\n\
    ```\n\n请注意 `break` 退出的是循环而不是脚本。这可以通过在脚本末尾添加一个 `echo` 命令来演示。当输入导致 `break` 被执行时（用户输入\
    \ \"0\"），这个 `echo` 也会被执行。\n\n在嵌套循环中，`break` 允许指定要退出哪一个循环。更多信息请参见 Bash info 页面。\n\
    \n### 9.5.2. continue 内置命令\n\n`continue` 语句恢复外层 `for`、`while`、`until` 或 `select`\
    \ 循环的迭代。\n\n当用于 `for` 循环时，控制变量将获得列表中下一个元素的值。相反，当用于 `while` 或 `until` 结构时，执行将将从循环顶部的\
    \ `TEST–COMMAND` 开始。\n\n### 9.5.3. 示例\n\n在接下来的示例中，文件名被转换为小写。如果没有进行转换，`continue`\
    \ 语句将重新启动循环。这不会消耗多少系统资源，而且很可能，类似的问题可以使用 `sed` 和 `awk` 来解决。然而，在执行密集型任务时，了解这种结构是有用的，而通过在脚本正确的位置插入测试，可能不需要这种操作，从而节省系统资源。\n\
    \n```bash\n[carol@octarine ~ /test] cat tolower.sh\n#!/bin/bash\n\n# 此脚本将所有字符转换为小写\n\
    LIST=$(ls)\nfor name in $LIST; do\n    if [[ \"$name\" == *[:upper:]]* ]]; then\n\
    \        continue\n    fi\n    echo \"$name\" | tr '[:upper:]' '[:lower:]'\ndone\n\
    ```\n\n"
