    server and the remote directory in a variable. This will make it easier to re-use
    the script or to make changes to it in the future.


    The script should check for the existence of a compressed archive. If this exists,
    remove it first in order to prevent output generation.


    The script should also check for available diskspace. Keep in mind that at any
    given you could have the data in your home directory, the data in the .tar file
    and the data in the compressed archive all together on your disk. If there is
    not enough diskspace, exit with an error message in the log file.


    The script should clean up the compressed archive before it exits.'
  - "[PAGE 101]\n\n# Chapter 8. Writing interactive scripts\n\nIn this chapter we\
    \ will discuss how to interact with the users of our scripts:\n\n+   * Printing\
    \ user friendly messages and explanations\n* Catching user input\n* Prompting\
    \ for user input\n* Using the file descriptors to read from and write to multiple\
    \ files\n\n# 8.1. Displaying user messages\n\n# 8.1.1. Interactive or not?\n\n\
    Some scripts run without any interaction from the user at all. Advantages of non–interactive\
    \ scripts include: \n\n+   * The script runs in a predictable way every time.\n\
    * The script can run in the background.\n\nMany scripts, however require input\
    \ from the user, or give output to the user as the script is running. The advantages\
    \ of interactive scripts are, among others:\n\n+   * More flexible scripts can\
    \ be built.\n* Users can customize the script as it runs or make it behave in\
    \ different ways.\n* The script can report its progress as it runs.\n\nWhen writing\
    \ interactive scripts, never hold back on comments. A script that prints appropriate\
    \ messages is much more user–friendly and can be more easily debugged. A script\
    \ might do a perfect job, but you will get a whole lot of support calls if it\
    \ does not inform the user about what it is doing. So include messages that tell\
    \ the user to wait for output because a calculation is being done. If the waiting\
    \ would regularly take a long time when executing a certain task, you might want\
    \ to consider integrating some processing in the output of your script.\n\nWhen\
    \ prompting for user input, it is also better to give too much than too little\
    \ information about the kind of data to be entered. This applies to the checking\
    \ of arguments and the accompanying usage message as well.\n\nBash the echo and\
    \ printf commands to provide comments for users, and although you should be familiar\
    \ with at least the use of echo by now, we will discuss some more examples in\
    \ the next sections.\n\n# 8.1.2. Using the echo–built command\n\nThe echo–built\
    \ command outputs its arguments, separated by spaces and terminated with a newline\
    \ The return status is always zero. echo takes a couple of options:\n\n+   * -e:\
    \ interpretsslash–escaped characters.\n* -n: suppresses the trailing newline.\n\
    \nAs an example of adding comments, we will make the feed.sh and penguin.sh from\
    \ Section 7.2.1.2 a\n\nChapter 8. Writing interactive scripts"
