    - **dhcped**: DHCP 客户端守护。

    - **diff**: 查找两个文件之间的差异。

    - **dig**: 向名称服务器发送域名查询数据包。

    - **dmesg**: 打印或控制内核缓冲区。

    - **du**: 估计文件空间使用情况。


    ## E


    - **echo**: 显示一行文本。

    - **ediff**: 英文 diff 翻译器。

    - **egrep**: 扩展的 grep。

    - **eject**: 卸载并弹出可移动设备。

    - **emacs**: 启动 Emacs 编辑器。

    - **exec**: 调用子进程。

    - **exit**: 退出当前 shell。

