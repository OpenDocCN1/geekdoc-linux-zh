    # 10. Organization of this document


    This guide discusses concepts useful in the daily life of the serious Bash user.
    While a basic knowledge of the usage of the shell is required, we start with a
    discussion of the basic shell components and practices in the first three chapters.


    Chapters four to six are discussions of basic tools that are commonly used in
    shell scripts.


    Chapters eight to twelve discuss the most common constructs in shell scripts.


    All chapters come with exercises that will test your preparedness for the next
    chapter.


    - Chapter 1: Bash basics: why Bash is good, building blocks, first guidelines
    on developing scripts.

    - Chapter 2: Script basics: writing and debugging.

    - Chapter 3: The Bash Environment: initialization files, variables, quoting characters,
    shell expansion order, aliases, options.

    - Chapter 4: Regular expressions: an introduction.

    - Chapter 5: Sed: an introduction to the sed line editor.

    - Chapter 6: Awk: introduction to the awk programming language.

    - Chapter 7: Conditional statements: constructs used in Bash to test conditions.

    - Chapter 8: Interactive scripts: making scripts user-friendly, catching user
    input.

    - Chapter 9: Executing commands repetitively: constructs used in Bash to automate
    command execution.

    - Chapter 10: Advanced variables: specifying variable types, introduction to arrays
    of variables, operations on variables.

    - Chapter 11: Functions: an introduction.

    - Chapter 12: Catching signals: introduction to process signalling, trapping user-sent
    signals.


    # Chapter 1. Bash and Bash scripts


    In this introduction module we:


    - Describe some common shells

    - Point out GNU Bash advantages and features

    - Describe the shell''s building blocks

    - Discuss Bash initialization files

    - See how the shell executes commands

    - Look into some simple script examples


    ## 1.1. Common shell programs


    ### 1.1.1. General shell functions


    The UNIX shell program interprets user commands, which are either directly entered
    by the user, or which can be read from a file called the shell script or shell
    program. Scripts are interpreted, not compiled. The shell reads commands from
    the script line by line and for commands on the system (Section 1.2), while a
    compiler converts a program into machine readable form, an executable file – which
    may be used in a shell script.


    Apart from passing commands to the kernel, the main task of a shell is providing
    a user environment, which can be configured individually using shell configuration
    files.


    ### 1.1.2. Shell types


    Just like people know different languages and dialects, your UNIX system will
    usually offer a variety of shell types:


    - sh or Bourne Shell: the original shell still used on UNIX systems and in UNIX–related
    environments. This is the basic shell, a small program with few features. While
    this is not the standard, it is still available on every Linux system for compatibility
    with UNIX programs.

    - bash or Bourne Again: the standard GNU shell, intuitive and flexible. Probably
    most advisable for beginners users while being the same time a powerful tool for
    the advanced and professional user. On Linux, bash is the standard for common
    users. This shell is a so-called superset of the Bourne shell, a set of add-ons
    and plug-ins. This means that the Bourne Again is compatible with the Bourne shell;
    commands that work in sh, also work in bash. However, the reverse is not always
    the case. All exercises and exercises in this book use bash.

    - csh or C: the syntax of this shell resembles that of the C programming language.
    Sometimes asked for by programmers.

    - tsch or Turbo C: a superset of the C shell, enhancing user-friendliness and
    speed.

    - ksh or the Korn shell: sometimes appreciated by people with a UNIX background.
    A superset of the Bourne shell; with compatibility a nightmare for beginners users.


    The file /etc/shells gives an overview of known shells on a Linux system:


    ```

    mia-> cat /etc/shells

    /bin/bash

    ```


    # Bash Guide for Beginners


    /bin/sh

    /bin/tcsh

    /bin/csh


    Your default shell is set in the /etc/passwd file, like this for user mia:


    ```

    mia:L2NOfqdlPrHWe:504:504:Mia Maya:/home/mia:/bin/bash

    ```


    To switch from one shell to another, just enter the name of the new shell in the
    active terminal. The system finds the directory where the name occurs using the
    PATH settings, and since a shell is an executable file (program), the current
    shell activates it and gets executed. A new prompt is usually shown, because each
    shell has its typical appearance:


    ```

    mia:~ tcsh

    mia@post21]$

    ```


    ## 1.2. Advantages of Bourne Again


    ### 1.2.1. Bash and the GNU shell


    The GNU project (Bourne Again SH) provides tools for system administration which
    are free software and comply with UNIX standards. Bash is an sh-compatible shell
    that incorporates useful features from the Korn shell (ksh) and C shell (csh).
    It is intended to conform to IEEE POSIX-1003.1. It offers functional improvements
    over sh for both programming and interactive use; these include line editing,
    job control, shell functions, indexed arrays, and integer arithmetic. Like other
    projects, bash was started to preserve and promote the freedom to use, copy, modify
    and redistribute software.


    ## 1.2. Features only in bash


    ### 1.2.2.1. Invocation


    In addition to the single-character shell line options which can generally be
    configured using set built-command, there are several multi-character options
    that you can use. We will come across a couple of the more popular options in
    following chapters; the complete list can be found in Bash info pages.


    ### 1.2.2.2. Startup files


    Startup files are scripts that are read and executed by Bash when it starts. The
    following subsections describe different ways to start the shell, and startup
    files are read consequently.


    ### 1.2.2.2.1. Invoked as interactive login shell, or with `login`


    Interactive means you can enter commands. The shell is not running because a script
    has been activated. A login shell means that you got the shell after authenticating
    to the system, usually by giving your username and password. Files read:


    - /etc/profile

    - ~/.bash_profile, ~/.login or ~/.profile: first existing readable file is read

    - ~/.bash_logout: if a file does not exist, bash searches for the next.


    ### 1.2.2.2.2. Invoked as interactive non-login shell


    A non-login shell means that you did not have to authenticate to the system. For
    instance, when you open a terminal or a menu item, that is a non-login shell.
    Files read:


    - ~/.bashrc


    This file is referred to in ~/.bash_profile:


    ```

    if [ -f ~/.bashrc ]; then ~/.bashrc; fi

    ```


    See Chapter 7 for more information on the if construct.


    ### 1.2.2.3. Invoked non-interactively


    All scripts are non-interactive shells. They are programmed to do certain tasks
    and cannot be instructed to do other jobs than those for which they are programmed.
    Files read:


    - defined by BASH_ENV PATH is not used to search for this file, if you want to
    use it, best refer to it by giving the full path and file name.


    ### 1.2.2.4. Invoked with the sh command


    Bash tries to behave as the historical Bourne sh program while conforming to the
    POSIX standard as well. Files read:


    - /etc/profile

    - ~/.profile


    ### 1.2.2.5. POSIX mode


    When invoked interactively, the ENV variable can point to extra startup information.
    This option is enabled either using the **set** built-in:


    ```

    set -o posix

    ```


    or by calling the **bash** program with the `--POSIX** option. Bash will then
    try to behave as compliant as possible to the POSIX standard for shells. Setting
    the POSIXLY_CORRECT variable does the same. Files read:


    - defined by ENV variable.


    ### 1.2.2.6. Invoked remotely


    Files read when invoked by **rsh:**


    - ~/.bashrc


    > **Avoid of use**

    > Be aware of the dangers when using tools such as **login, telnet, rsh** and
    **rcp**. They are intrinsically insecure; confidential data is sent over the network
    encrypted. If you need tools for execution, file transfer and so on, use an implementation
    of Secure Shell, generally known as SSH, freely available from http://www.openssh.org.
    Different client programs are available for non-UNIX systems as well, use your
    local software mirror.


    ### 1.2.2.7. Invoked when UID is not equal to EUID


    No startup files are read in this case.


    ## 1.2.2.3. Interactive shells


    ### 1.2.2.3.1. What is an interactive shell?


    An interactive shell generally reads from, and writes to, a user''s terminal:
    input and output are connected to a terminal. Interactive behavior is started
    when the **bash** command is called upon without non-option arguments, except
    when the option is a string to read from or when the shell is invoked to read
    from standard input, which allows for positional parameters to be set (**Chapter
    3**).


    ### 1.2.2.3.2. Is this shell interactive?


    Test looking at the content of the special character -, it contains an ''i'' when
    the shell is interactive:


    ```

    ed:-> echo $-

    himBu

    ```


    In non-interactive shells, the prompt, PS1, is unset.

