    ## 1.2.2.4. 条件判断


    条件表达式由 `[[` 复合命令和 `test` 内置命令使用。


    表达式可以是一元或二元的。一元表达式通常用于检查文件的状态。你只需要一个对象（例如一个文件）即可对其进行操作。


    还有字符串运算符和数值比较运算符；这些是二元运算符，需要两个对象来执行操作。如果其中一个操作数的 `FILE` 属性格式为 `/dev/fd/N`（而不是
