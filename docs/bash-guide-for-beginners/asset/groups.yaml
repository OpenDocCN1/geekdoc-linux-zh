- md: "\n## Bash Guide for Beginners\n\nThe table below gives an overview of other\
    \ useful Bash options:\n\nTable 2–1. Overview of set debugging options\n\n| Short\
    \ notation | Long notation | Result |\n| --- | --- | --- |\n| set -f | set -o\
    \ noglob | Disable file name generation using metacharacters (globbing). |\n|\
    \ set -v | set -o verbose | Prints shell inputs as they are read. |\n| set -x\
    \ | set -o xtrace | Print command traces before executing command. |\n\nThe dash\
    \ is used to activate a shell option and a plus to deactivate it. Don't let this\
    \ confuse you!\n\nIn the example below, we demonstrate these options on the command\
    \ line:\n\n```\nwilly:///scripts> set -v\nwilly:///scripts> ls\nls\ncommented-scripts.sh\
    \ script1.sh\n\nwilly:///scripts> set +v\nset +v\n\nwilly:///scripts> ls *\ncommented-scripts.sh\
    \ script1.sh\n\nwilly:///scripts> set -f\nwilly:///scripts> ls *\nls: No such\
    \ file or directory\n\nwilly:///scripts> touch *\nwilly:///scripts> ls\n* commented-scripts.sh\
    \ script1.sh\nwilly:///scripts> rm *\nwilly:///scripts> ls\ncommented-scripts.sh\
    \ script1.sh\n```\n\nAlternatively, these modes can be specified in the script,\
    \ by adding the desired option to the first line shell declaration. Options can\
    \ be combined, as is usually the case with UNIX commands:\n\n```bash\n#!/bin/bash\
    \ -xv\n```\n\nOnce you find the buggy part of your script, you can add echo statements\
    \ before each command of which you are unsure, so you will see exactly where and\
    \ why things don't work. In the example commented-script1.sh script, it could\
    \ be like this, still that the displaying of variables gives us problems:\n\n\
    ```bash\necho \"debug message: now attempting to start command\"; w\n```\n\nIn\
    \ more advanced scripts, the echo can be inserted to display the content of variables\
    \ at different stages in the script, so that flaws can be detected:\n\n## Chapter\
    \ 2. Writing and debugging scripts\n\n## Bash Guide for Beginners\n\n```bash\n\
    echo \"Variable VARNAME is now set to $VARNAME.\"\n```\n\n## 2.4. Summary\n\n\
    A script is a reusable series of commands put in an executable text file. Any\
    \ text editor can be used to write scripts.\n\nScripts start with # followed by\
    \ the path to the shell executing the commands from the script. Comments are added\
    \ to a script for your own future reference, and also to make it understandable\
    \ for other users. It is better to have too many explanations than not enough.\n\
    \nDebugging a script can be done using shell options. Shell options can be used\
    \ for partial debugging or for analyzing the entire script. Inserting echo commands\
    \ at strategic locations is also a common troubleshooting technique.\n\n## 2.5.\
    \ Exercises\n\nThis exercise will help you to create your first script.\n\n- 1.\
    \ Write a script using your favorite editor. The script should display the path\
    \ to your home directory and the terminal type that you are using. Additionally\
    \ it shows all the services started up in runlevel 3 on your system (hint: use\
    \ HOME, TERM and ls /etc/rc.d/*)\n- 2. Add comments in your script.\n- 3. Add\
    \ information for the users of your script.\n- 4. Change permissions on your script\
    \ so that you can run it.\n- 5. Run the script in normal mode and in debug mode.\
    \ It should run without errors.\n- 6. Make errors in your script: see what happens\
    \ if you missp commands, if you leave out the first line or put something unintelligible\
    \ there, or if you misspell shell variable names or write them in lower case characters\
    \ after they have been declared in capitals. Check what the debug comments say\
    \ about this.\n\n## Chapter 3. The Bash environment\n\nIn this chapter we will\
    \ discuss the various ways in which the Bash environment can be influenced:\n\n\
    - Editing shell initialization files\n- Using variables\n- Using different quote\
    \ styles\n- Perform arithmetic calculations\n- Assigning aliases\n- Using expansion\
    \ and substitution\n\n## 3.1. Shell initialization files\n\n### 3.1.1. /etc/profile\n\
    \nWhen invoked interactively with the --login option or when invoked as sh, Bash\
    \ reads the /etc/profile instructions. These usually set the shell variables PATH,\
    \ USER, MAIL, HOSTNAME and HISTSIZE.\n\nOn some systems, the umask value is configured\
    \ in /etc/profile; on other systems this file holds pointers to other configuration\
    \ files such as:\n\n- /etc/inputrc, the system-wide Readline initialization file\
    \ where you can configure the command line bell-style.\n- the /etc/profile.d directory,\
    \ which contains files configuring system-wide behavior of specific programs.\n\
    \nAll settings that you want to apply to all your users' environments should be\
    \ in this file. It might look like:\n\n```bash\n# /etc/profile\n# System wide\
    \ environment and start programs, for login setup\nPATH=$PATH:/usr/X11R6/bin\n\
    # No core files by default\nulimit -s -c 0 > /dev/null 2>&1\n\nUSER=$(id -u)\n\
    LOGNAME=$USER\nMAIL=/var/spool/mail/$USER\nHOSTNAME=$(hostname)\nHISTSIZE=1000\n\
    \n# Keyboard, bell, display style: the readline config file:\nif [ -z \"$INPUTRC\"\
    \ ] && [ ! -f \"$HOME/.inputrc\" ]; then\nINPUTRC=/etc/inputrc\nfi\nPS1=\"\\u\\\
    h \\W\"\n```\n\n```bash\nexport PATH USER LOGNAME MAIL HOSTNAME HISTSIZE INPUTRC\n\
    \n# Settings for environment\nfor i in /etc/profile.d/*; do\n    if [ -r \"$i\"\
    \ ]; then\n        source \"$i\"\n    fi\ndone\n```\n\n## Bash Guide for Beginners\n\
    \n```bash\nexport PATH USER LOGNAME MAIL HOSTNAME HISTSIZE INPUTRC\n\n# Settings\
    \ for environment\nfor i in /etc/profile.d/*; do\n    if [ -r \"$i\" ]; then\n\
    \        source \"$i\"\n    fi\ndone\n```\n\n### 3.1.2. /etc/bashrc\n\nThis contains\
    \ useful aliases which make commands work even if you misspell them. We will discuss\
    \ aliases in Section 3.5.2. This file contains a function, pskill; functions will\
    \ be studied in detail in Chapter 11.\n\nThis comes with the Bash documentation:\n\
    \n```bash\nalias ls='ls -l'\nalias dir='ls -ba'\nalias c='clear'\nalias is='ls\
    \ --color'\n\nalias mroe='more'\nalias pdw='pwd'\nalias sl='ls --color'\n```\n\
    \n```bash\npskill()\n{\n```\n\nChapter 3. The Bash environment\n\n## Bash Guide\
    \ for Beginners\n\nApart from aliases, it contains useful aliases which make commands\
    \ work even if you miss them. We will discuss aliases in Section 3.5.2. This file\
    \ contains a function, pskill; functions will be studied in detail in Chapter\
    \ 11.\n\n## 3.1.2. Individual user configuration files\n\nI don't have these files!!\n\
    \nThese files might not be in your home directory by default; create them if needed.\n\
    \n### 3.1.2.1/.bash_profile\n\nThis is the preferred configuration file for configuring\
    \ user environments individually. In this file, users can add extra configuration\
    \ options or change default settings:\n\n```\nfranky-> cat .bash_profile\n################################################################\n\
    # .bash_profile file                                                         \
    \     \n# Executed from the bash shell when you log in.                      \
    \               \n################################################################\n\
    ```\n\nThis user configures the backspace character for login on different operating\
