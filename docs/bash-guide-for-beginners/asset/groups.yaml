    8. Make sure that newly created users get a nice personalized prompt which informs
    them on which system they are working. Test your changes by adding a new user
    and logging in as that.

    9. Write a script in which you assign two values to variables. The script should
    calculate the surface of a rectangle which has these proportions. It should be
    aired with comments and generate elegant output.


    Don''t forget to chmod your scripts!


