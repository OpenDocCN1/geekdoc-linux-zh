    ## 6.2.5. Awk scripts


    As commands tend to get a little longer, you might want to put them in a script,
    so they are reusable. **Awk** script contains **awk** statements defining patterns
    and actions.


    As an illustration, we will build a parser that displays our loaded partitions.
    See [Section 6.2.2](#)


    ```

    kelly is in -> ck diskrep.awk

    BEGIN { **** WARNING WARNING WARNING *** \

    /\[[8][9][0-9]% { print "Partition" $6 \t" $5 full!" }

    END { print Give me for new disks URGENTLY! **** }


    kelly is in -> df -h | awk diskrep.awk

    *** WARNING WARNING WARNING ***

    Partition/usr : 97% full!

    *** Give me for new disks URGENTLY! ***

    ```


    awk prints a begin message, then formats all the lines that contain an eight or
    a nine at the beginning of a word, followed by one number and a percentage sign.
    An end message is added.


    - Syntax highlighting

    Awk is a programming language. Its syntax is recognized by most editors that can
    do syntax highlighting for other languages, such as C. Bash, HTML, etc.


    ## 6.3. Gawk variables


    As awk is processing the input file, it uses variables. Some are editable, some
    are read–only.


    ### 6.3.1. The input field separator


    The field separator, which is either a single character or a regular expression,
    controls the way awk splits an input record into fields. The input record is scanned
    for character sequences that match the separator definition; the fields themselves
    are the text between the matches.


    The field separator is represented by the built-in variable FS. Note that this
    is something different from the IFS variable used by POSIX-compliant shells.


    Chapter 6. The GNU awk programming language


    The value of the field separator variable can be changed in the awk program with
    the assignment operator=. Often the time to do this is at the beginning of execution
    before any input has been processed, so that the very first record is read with
    the proper separator. To do this, use the special BEGIN pattern.


    In the example below, we build a command that displays all the users on your system
    with a description:


    ```

    kelly in -> awk ''BEGIN (FS=":") { print $1 "\t" } /etc/passwd

    --output omitted-

    kelly Kelly Smith

    franky Franky B.

    eddy Eddy B.

    willy William Black

    cathy Catherine the Great

    sandy Sandy Li Wong

    ```


    kelly is in -> In an awk script, it would look like this:


    ```

    kelly is in -> cat printnames.awk

    BEGIN (FS=":")

    { print $1 "\t" $5 }

    kelly is in -> awk -f printnames.awk /etc/passwd

    --output omitted-

    ```


    Choose input field separators carefully to prevent problems. An example to illustrate
    this: say you get input in the form of lines that look like this:


    > "Sandy L. Wong, 64 Zoo St., Antwerp, 2000X"


    You write a command or a script, which prints out the name of the person in that
    record:


    ```

    awk ''BEGIN (FS=":") { print $1, $2, $3 }'' inputfile

    ```


    But a person might have a PhD, and it might be written like this:


    > "Sandy L. Wong, PhD, 64 Zoo St., Antwerp, 2000X"


    Your awk will give the wrong output for this line. If needed, use an extra awk
    or sed to uniform data input formats.


    The default input separator is one or more whitespaces or tabs.


    ## 6.3.2. The output separators


    ### 6.3.2.1. The output field separator


    Fields are normally separated by spaces in the output. This becomes apparent when
    you use the correct syntax for the print command, which arguments are separated
    by commas:


    ```

    kelly@octarine -</test> cat test

    record1 data

    record2 data2

    ```


    ```

    kelly@octarine -</test> awk ''{print $1 $2}'' test

    ```


    Chapter 6. The GNU awk programming language


    ```

    record1data1

    record2data2


    kelly@octarine ~</test> awk ''{ print $1, $2}'' test

    record1 data1

    record2 data2

    ```


    kelly@octarine ~</test>

    If you don''t put in the commas, print will treat the items to output as one argument,
    thus omitting the use of the default output separator, OFS.


    Any character string may be used as the output field separator by setting this
    built-in variable.


    ### 6.3.2.2. The output record separator


    The output from an entire print statement is called an output record. Each print
    command results in one output record, and then outputs a string called the record
    separator, ORS. The default value for this variable is "\n", a newline character.
    Thus, each print statement generates a line.


    To change the output fields and records are separated, assign new values to OFS
    and ORS:


    ```

    kelly@octarine ~</test> awk { OFS=";"; ORS="\n" }

    { print $1,$2 }

    record1;data1

    record2;data2

    ```


    kelly@octarine ~</test>

    If the value of ORS does not contain a newline, the program''s output is run together
    on a single line.


    ### 6.3.3. The number of records


    The built-in NR holds the number of records that are processed. It is incremented
    after reading a new line. You can use it at the end to count the total number
    of records, or in each output record:


    ```

    kelly@octarine ~</test> cat processed.awk

    BEGIN { OFS=":"; ORS="\n" }

    { print "Record number " NR $1,$2 }

    END { print "Number of records: " NR }

    ```


    ```

    kelly@octarine ~</test> awk -f processed.test

    Record number 1:

    record1-data1

    Record number 2:

    record2-data2

    Number of records: 2

    ```


    Chapter 6. The GNU awk programming language


    ### 6.3.4. User defined variables


    Apart from the built-in variables, you can define your own. When awk encounters
    a reference to a variable which does not exist (which is not predefined), the
    variable is created and initialized to a null string. It can be a string or a
    numeric value. Content of input fields can also be assigned to variables.


    Values can be assigned directly using the = operator, or you can use the current
    value of the variable in combination with other operators:


    ```

    kelly@octarine -> cat total.awk

    { total=total + $5 }

    { print "Send bill for " $5 to $4 }

    END { print "Total revenue: " total }

    ```


    ```

    kelly@octarine -> awk -f total.test

    Send bill for 2500 to Big

    Send bill for 2000 to Edu

    Send bill for 10000 to Smart

    Send bill for 5000 to Edu

    Total revenue: 19500


    ```

    kelly@octarine -> VAR=value


    C-like shorthands are also accepted.


    ###### 6.3.5. More examples


    The example from Section 5.3.2 becomes much easier when we use an awk script:


    ```

    kelly@octarine -> cat make-html-from-text.awk

    BEGIN { print "<html><head><title>Awk-generated HTML</title></head><body bgcolor="#ffffff\">

    <pre>"

    END { print "</pre></body></html>" }

    ```


    And the command to execute is much more straightforward when using awk instead
    of sed:


    ```

    kelly@octarine -> awk -f make-html-from-text.awk testfile > file.html

    ```


    > Examples on your system


    We refer again to the directory containing the scripts on your system. Enter a
    command like the following to see more practical examples of the widely used usage
    of the awk command:


    ```

    grep awk /etc/init.d/*

    ```


    ## 6.3. The printf program


    For more precise over the output format than what is normally provided by **print**,
    use **printf**. The **printf** command can be used to specify the field width
    for each item, as well as various formatting choices for numbers (as what output
    to use, whether to print an exponent, whether to print a sign, and how many digits
    to print after the decimal point). This is done by supplying a string, called
    the *format string*, that controls how and where to print the other arguments.


    The syntax is the same as the C-language **printf** statement; see your C introduction
    guide. The **gawk** info pages contain full explanations.


    ## 6.4. Summary


    The **gawk** utility interprets a special-purpose programming language, handling
    simple data–reformatting jobs with just a few lines of code. It is the free version
    of the general UNIX awk command.


    This tool reads lines of input and can easily recognize column output. The **print**
    program is the most common for filtering and formatting defined fields.


    On–the–fly variable declaration is straightforward and allows for simple calculation
    of sums, statistics and other operations on the processed input stream. Variables
    and commands can be part in **awk** scripts for background processing.


    Other things you should know about **awk**:


    - The language remains well–known on UNIX and alike, but for executing similar
    tasks, Perl is more commonly used. However, *awk* has a much steeper learning
    curve. In other words, Perl is more difficult to learn.

    - Both Perl and **awk** share the reputation of being incomprehensible, even to
    the actual authors of the programs that use these languages. So document your
    code!


    ## 6.5. Exercises


    These are practical examples where **awk** can be useful.


    - 1. For the first exercise, your input is lines in the following format:

    `Username:FirstName:LastName:Telephone number`

    Make an awk script that will convert such name to an LDAP record in this format:


    ```

    dn: uid=Username, dc=example, dc=com

    cs: FirstName Lastname

    sp: Lastname

    telephone: Telephone number

    ```


    - 2. Create a file containing a couple of records and check.

    Create a Bash script using awk and standard UNIX commands that will show the top
    three users of disk space in the /home file system (if you don''t have the holding
    directories on the home partition, make the script for the partition; this is
    present on every UNIX system). First, execute the commands from the command line.
    Put them in a script. The script should create sensible output (sensible as readable
    by the boss). If everything works, have the script email results to you (if you
    install mail -s disk space usage <@your_comp> < result).

