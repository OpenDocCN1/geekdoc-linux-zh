    An interactive shell generally reads from, and writes to, a user''s terminal:
    input and output are connected to a terminal. Interactive behavior is started
    when the **bash** command is called upon without non-option arguments, except
    when the option is a string to read from or when the shell is invoked to read
    from standard input, which allows for positional parameters to be set (**Chapter
    3**).


