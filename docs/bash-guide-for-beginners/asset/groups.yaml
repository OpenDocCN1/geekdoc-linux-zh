    # 9.1.2.2. Using the content of a variable to specify LIST items


    The following is a specific application script for converting HTML files, compliant
    with a client scheme, to PHP files. The conversion is done by taking the first
    25 and the last 21 lines, replacing these with two PHP tags that provide header
    and footer lines:


    ```

    [carol@octopus] cat html2php.sh

    #!/bin/bash

    # specific conversion script for my files to php

    LIST="*.html"

    for i in $LIST; do

    NEWNAME=$(ls "$i" | sed -e ''s/html/php/'')

    cat beginfile="$NEWNAME"

    cat "$i" | sed -e ''1,25d'' | tac | sed -e ''1,21d'' | tac >> "$NEWNAME"

    cat endfile="$NEWNAME"

    done

    ```


    Since we don''t have a count here, there is no way of knowing the line number
    from which to start deleting lines until the end. The problem is solved using
    tac, which reverses the lines in a file.


    # 9.2. The while loop


    # 9.2.1. What is it?


    The while construct allows for repetitive execution of a list of commands, as
    long as the command controlling the while loop executes successfully (exit status
    of zero). The syntax is:


    while CONTROL-COMMAND; do CONSEQUENT-COMMANDS; done


    CONTROL-COMMAND can be any command(s) that can exit with a success or failure
    status. The CONSEQUENT-COMMANDS can be any program, script or shell construct.


    As soon as the CONTROL-COMMAND fails, the loop exits. In a script, a command following
    the done statement is executed.


    The return status is the exit status of the last CONSEQUENT-COMMANDS command,
    or zero if none was executed.


    # 9.2.2. Examples


    # 9.2.2.1. Simple example using


    Here is an example for the impatient:


    ```

    #!/bin/bash

    # This script opens 4 terminal windows.

    i=0

    while [ $i -lt 4 ]

    ```


