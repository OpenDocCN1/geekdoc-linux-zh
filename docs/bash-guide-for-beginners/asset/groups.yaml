    \ 3.2 节中讨论，第 10 章将讨论变量的高级用法。\n\n## 1.4.1.5. Shell 扩展\n\nShell 扩展在每行命令被拆分为标记后执行。这些执行的扩展包括：\n\
    \n- 大括号扩展 (Brace expansion)\n- 波浪号扩展 (Tilde expansion)\n- 参数和变量扩展 (Parameter and\
    \ variable expansion)\n- 命令替换 (Command substitution)\n- 算术扩展 (Arithmetic expansion)\n\
    - 单词拆分 (Word splitting)\n- 文件名扩展 (Filename expansion)\n\n我们将在 3.4 节详细讨论这些扩展类型。\n\
    \n## 1.4.1.6. 重定向\n\n在执行命令之前，其输入和输出可以使用 Shell 解释的特殊符号进行重定向。重定向也可以用于为当前 Shell 执行环境打开和关闭文件。\n\
    \n## 1.4.1.7. 执行命令\n\n在执行命令时，解析器标记为变量赋值（位于命令名之前）和重定向的单词将被保存备后引用。不是变量赋值或重定向的单词将被扩展；扩展后剩余第一个单词作为命令名，其余的该命令的参数。然后执行重定向，然后扩展赋值给变量的字符串。变量将影响当前的\
    \ Shell 环境。\n\nShell 任务的重要部分是搜索命令。Bash 按照以下方式执行此：\n\n- 检查命令是否包含斜杠。如果没有，首先检查函数列表，看是否包含我们要查找的同名命令。\n\
    - 如果命令不是函数，则在内置列表中查找。\n- 如果命令既不是函数也不是内置命令，则通过分析 PATH 中列出的目录进行查找。Bash 使用哈希表（内存中的数据存储区域）来记录可执行文件的完整路径，以避免频繁的\
    \ PATH 搜索。\n- 如果搜索失败，bash 将打印错误消息并返回退出状态 127。\n- 如果搜索成功或命令包含斜杠，则在独立的 Shell 环境中执行命令（注：在\
    \ Shell 环境中执行命令）。\n- 如果执行失败是因为文件不可执行，则假设它是 脚本。\n- 如果没有异步执行，Shell 会等待命令完成并收集状态。\n\
    \n## 1.4.1.8. 脚本\n\n当包含命令的文件作为非选项使用时，Shell 会首先在当前目录查找，如果找不到，则在 PATH 中查找。\n\n##\
    \ 1.5 开发良好的脚本\n\n### 1.5.1. 好脚本的属性\n\n在继续之前，这是关于良好脚本的一些通用考虑：\n\n- 脚本应该无错误地运行。\n\
    - 脚本应该完成其预期的任务。\n- 脚本逻辑清晰且易见。\n- 脚本不执行多余工作。\n- 脚本应该是可重用的。\n\n### 1.5.2. 结构\n\n\
    \  的结构非常灵活。尽管 Bash 赋予了很大自由，但你必须确保逻辑和效率，以便用户能够轻松正确地执行脚本。\n\n在开始编写新脚本时，问自己以下问题：\n\
    \n- 我会需要来自用户或用户环境的信息吗？\n- 我将如何存储这些信息？\n- 是否需要创建文件？在哪里创建？权限和所有权是什么？\n- 我将使用哪些命令？什么时候使用？\n\
    \n### 1.5.3. 术语\n\n下表提供了编程术语的概述：\n\n表1. 编程术语概述\n\n| 术语 | 它是什么 |\n| :--- | :---\
    \ |\n| 命令控制 | 测试命令的退出状态。 |\n| 条件分支 | 程序中的逻辑点决定下一步发生什么。 |\n| 逻辑流 | 程序的整体设计。 |\n\
    | 循环 | 程序中执行多次的部分。 |\n| 用户输入 | 程序运行时来自外部的信息，可以存储和调用。 |\n\n### 1.5.4. 关于顺序和逻辑的说明\n\
    \n为了加快开发进程，应该考虑程序的逻辑顺序。这是你的第一步。\n\n### 1.5.5. Bash 脚本示例：mysystem.sh\n\n下面的 mysystem.sh\
    \ 脚本执行了一些已知命令（date, w, uname, uptime）来显示关于你和你的机器的信息。\n\n```bash\ncat -n mysystem.sh\n\
    !/bin/bash\nclear\necho \"这是由 mysystem.sh 提供的信息。程序现在开始。\"\necho \"Hello, $USER\"\
    \necho\necho \"今天是 $(date)，这是第 $(date +%V) 周。\"\necho\necho \"当前连接的用户有：\"\nw |\
    \ cut -d \" \" -f 1 | grep -v USER | sort -u\necho\necho \"这是 $(uname -s) 运行在\
    \ $(uname -m) 处理器上。\"\necho\necho \"这是运行时间信息：\"\nuptime\n```\n\n"
