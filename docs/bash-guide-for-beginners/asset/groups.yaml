    \ | True if either EXPR1 or EXPR2 is true. |\n\nThe (or (test) built-evaluates\
    \ conditional expressions using a set of rules based on the number of arguments.\
    \ More information about this subject can be found in the Bash documentation.\
    \ Just like the if is closed with fi, the opening bracket should be closed after\
    \ the conditions have been listed.\n\n# 7.1.1.2. Commands following the then statement\n\
    \nThe CONSEQUENT–COMMANDS list follows that the then statement can be any valid\
    \ UNIX command, any executable program, any executable script or any statement,\
    \ with the exception of the closing fi. It is important to remember that the then\
    \ and fi are considered to be separated statements in the shell. Therefore, when\
    \ issued on the command line, they are separated by a semi-colon.\n\nIn a script,\
    \ the different parts of the if statement are usually well-separated. Below, a\
    \ couple of simple examples.\n\n# 7.1.1.3. Checking files\n\nThe first example\
    \ checks the existence of a file:\n\n```\nanny -> cat msgcheck.sh\n!/bin/bash\n\
    echo \"This scripts checks the existence of the messages file.\"\necho \"Checking...\"\
    \nif [ -f /var/log/messages ]\nthen\n    echo \"/var/log/messages exists.\"\n\
    fi\necho\necho \"...done.\"\n\\anny -> /.msgcheck.sh\nThis scripts checks the\
    \ existence of the messages file.\nChecking...\n/var/log/messages exists.\n\n\
    ...done.\n```\n\n# 7.1.1.4. Checking shell options\n\nTo add in your Bash configuration\
    \ files:\n\n```\n# These lines will print a message if the noclobber option is\
    \ set.\n```"
