    This is a line not containing any errors.\nThis is the last line.\nsandy ->\n\
    ```\n\nTo print the first line from a starting line until the end of the file,\
    \ use a command similar to this:\n\n```\nsandy -> sed '3,$d' example\nThis is\
    \ the first line of an example text.\nIt is a text with errors.\nsandy ->\n```\n\
    \nThe following command prints the first line containing the pattern \"a text\"\
    , up to and including the next line containing the pattern \"a line\":\n\n```\n\
    sandy -> sed -n '/a text/,./This/p example\nit is a text with errors.\nLots of\
    \ errors.\nSo much errors, all these errors are making me sick.\nThis is a line\
