    \ might be easier. It takes the same option as the kill command, but applies on\
    \ all instances of a process. Test this before using it in a production environment,\
    \ which it might not work as expected on some of the commercial Unices.\n\n##\
    \ 12.2. Traps\n\n### 12.2.1. General\n\nThere might be situations when you don't\
    \ want your scripts to exit untimely using keyboard sequences, for example because\
    \ input has to be cleaned up or done. The **trap** statement catches these sequences\
    \ and can be programmed to execute a list of commands catching those signals.\n\
    \nThe syntax for the trap statement is straightforward:\n\n```\ntrap [COMMANDS]\
    \ [SIGNALS]\n```\n\nThis instructs the `trap` command to catch the listed `SIGNALS`,\
    \ which may be signal names with or without the SIG prefix. If a signal is or\
    \ or `EXIT`, the `COMMANDS` are executed when the shell exits. If one of the signals\
    \ is `DEBUG`, the list of `COMMANDS` is executed after every simple command. A\
    \ signal may also be specified as `ERR`; in that case `COMMANDS` are executed\
    \ each time a simple command exits with a non-zero status. Note that these commands\
    \ will not be executed when the non-zero status exits from part of an if statement,\
    \ or when a `while` or `until` loop. Neither will be executed if a logical AND\
    \ (`&&`) or OR (`||`) result in a non-zero exit code, or when a trap's status\
    \ is inserted using the `!` operator.\n\nThe return status of the `trap` command\
    \ is itself unless an invalid signal specification is encountered. The trap takes\
    \ a couple of options, which are documented in the Bash pages.\n\nHere is a very\
    \ simple example, catching `Ctrl-C` from the user, upon a message is printed.\
    \ When you try to kill this process without using the `KILL` signal, nothing will\
    \ happen:\n\n```\n#!/bin/bash\n# traptest.sh\n\ntrap \"echo Boo!\" SIGTERM\necho\
    \ \"pid is $$\"\n\nwhile :\n    # This is the same as \"while true\"\n\n    sleep\
    \ 60\n    # This script is not really doing anything.\ndone\n```\n\n### 12.2.2.\
    \ How Bash interprets traps\n\nWhen Bash receives a signal for a trap that has\
    \ been waiting for a command to complete, the trap will not be executed until\
    \ the command completes. Bash is waiting for an asynchronous command via the `wait`\
    \ built-in, the reception of a signal for a trap that has been set will cause\
    \ the `wait` built-in to.\n\nChapter 12. Catching signals.\n\nWhen a syntax for\
    \ starts several events, `kill` might be easier. It takes the same option as the\
    \ kill command, but applies on all instances of a process. Test this before using\
    \ it in a production environment, which it might not work as expected on some\
    \ of the commercial Unices.\n\n## 12.2.3. More\n\n### 12.2.3.1. Detecting when\n\
    \nWhen debugging scripts, you might want to trace variables.\n\n```bash\n#!/bin/bash\n\
    # trace.sh\n\nset -x\necho \"Testing variables: $1\"\nset +x\n```\n\n### 12.2.3.2.\
    \ Removing lockfile\n\nThe following example uses a trap to remove a lockfile:\n\
    \n```bash\n#!/bin/bash\n# lock.sh\n\nLOCKFILE=/tmp/myscript\ntrap \"rm -f $LOCKFILE\"\
    \ EXIT\n\ntouch $LOCKFILE\n# ... work ...\n```\n\nThe following example shows\
    \ how to give a message upon:\n\n```bash\n#!/bin/bash\n# cleanup.sh\n\ntrap \"\
    echo 'Cleaning up...'\" EXIT\necho \"Working...\"\nsleep 5\n```\n\n## 12.3. Summary\n\
    \nSignals can be sent to your programs using the kill command or keyboard shortcuts.\
    \ These signals can be caught, using the trap statement. The only signal no program\
    \ can ignore is the KILL signal.\n\n## 12.4. Exercises\n\nA couple of practical\
    \ examples:\n\n- Create a script that writes a boot image to a diskette using\
    \ dd utility. If the user tries to interrupt the script using Ctrl+C, display\
    \ a message that this action will make the diskette unusable.\n- Write a script\
    \ that automates the installation of a third-party package of your choice. The\
    \ package must be downloaded from the Internet. It must be decompressed, unarchived\
    \ and compiled if these actions are appropriate. Only the actual installation\
    \ of the package should be uninterruptible.\n\n# Appendix A. Shell Features\n\n\
    This document gives an overview of common shell features (the same in every flavour)\
    \ and differing shell features (shell specific features).\n\n## A.1. Common features\n\
    \nThe following features are standard in every shell. Note that the stop, suspend,\
    \ jobs, bg and fg commands are only available on systems that support job control.\n\
    \nTable A–1. Common Shell Features\n\n| Command | Meaning |\n| --- | |\n| > |\
    \ Redirect output |\n| >> | Append to file |\n| < | Redirect input |\n| << | 'Here'\
    \ document (redirect input) |\n| | | Pipe output |\n| & | Run process in background\
    \ |\n| ; | Separate commands on same line |\n| * | Match any character(s) in filename\
    \ |\n| ? | Match single character in filename |\n| [] | Match any characters enclosed\
    \ |\n| () | Execute in subshell |\n| `` ` | Substitute output of enclosed command\
    \ |\n| \" \" | Partial quote (allows variable and command expansion) |\n| \\ |\
    \ Full quote (no expansion) |\n| $var | Use value for variable |\n| $$ | Process\
    \ id |\n| $0 | Command name |\n| Sn | nth argument (n from 0 to 9) |\n| $* | All\
    \ arguments as a simple word |\n| # | Begin command |\n| bg | Background execution\
    \ |\n| break | Break from loop statements |\n| cd | Change directories |\n| continue\
    \ | Resume a program loop |\n| echo | Display output |\n| eval | Evaluate arguments\
    \ |\n| exec | Execute a new shell |\n"
