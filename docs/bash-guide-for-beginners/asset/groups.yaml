    \ stack content.\n- 9. How many processes are running?\n- 10. How to display the\
    \ hostname?\n\n# 2. Writing and debugging\n\nAfter going through this chapter,\
    \ you will be able to:\n\n- Write a simple script\n- Use an editor\n- Put comments\
    \ in script\n- Change permissions\n- Execute a script\n\n## 2.1. Creating and\
    \ running\n\nA shell script is a sequence of commands. To create a script, open\
    \ an empty file. Any editor will do: vim, emacs, gedit etc are all valid. Give\
