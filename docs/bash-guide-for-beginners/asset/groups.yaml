    # Bash Guide for Beginners


    +   * The shell reads its input from a file, from a string or from the user''s
    terminal.

    * Input is broken up into words and operators, obeying the quoting rules, see
    Chapter 3. Tokens are separated by metacharacters. Alias expansion is performed.

    * The shell parses (and substitutes) the tokens into simple and compound commands.

    * Bash performs various expansions, breaking the expanded tokens into lists of
    commands and arguments.

    * Redirection is performed if necessary, redirection operators and their operands
    are removed from the argument list.

    * Commands are executed.

    * Optionally the shell waits for the command to complete and collects its exit
    status.


    # 1.4.1.2. Shell commands


    A simple command such as touch file1 file23 consists of the command itself followed
    by arguments, separated by spaces.


    More complex shell commands are composed of simple commands arranged together
    in a variety of ways: in a pipeline where the output of one command becomes the
    input of a second, in a loop or conditional construct, or in some other grouping.
    A couple of examples:


    ```

    ls | more

    gunzip file.tar.gz | tar xvf -

    ```


    # 1.4.1.3. Shell functions


    Shell functions are a way to group commands for later execution using a single
    name for the group. They are executed just like a "regular" command. When the
    name of a shell function is used as a simple command, the list of commands associated
    with that function name is executed.


    Shell functions are executed in the current shell context; no new process is created
    to interpret them.


    Functions are explained in Chapter 11.


    # 1.4.1.4. Shell parameters


    A parameter is an entity that stores values. It can be a name, a number or a special
    value. For the shell''s purpose, a variable is a parameter that stores a name.
    A variable has a value and zero or more attributes. Variables are created with
    the declare built-in command.


    If no value is given, a variable is assigned the null string. Variables can only
    be removed with the unset built-in.


    Assigning variables is discussed in Section 3.2, advanced use of variables in
    Chapter 10.


    # 1.4.1.5. Shell expansions


    Shell expansion is performed after each command line has been split into tokens.
    These are the expansions performed:'
  - '[PAGE 22]


    +   - Brace expansion

    - Tilde expansion

    - Parameter and variable expansion

    - Command substitution

    - Arithmetic expansion

    - Word splitting

    - Filename expansion


    We''ll discuss these expansion types in detail in Section 3.4.


    #  1.4.1.6. Redirections


    Before a command is executed, its input and output may be redirected using a special
    notation interpreted by the shell. Redirection may also be used to open and close
    files for the current shell execution environment.


    #  1.4.1.7. Executing commands


    When executing a command, the words that the parser has marked as variable assignments
    (preceding the command name) and redirections are saved for later reference. Words
    that are not variable assignments or redirections are expanded; the first remaining
    word after expansion is taken to be the name of the command and the rest are to
    that command. Then redirections are performed, then strings assigned to variables
    are expanded. variables will affect the current shell environment.


    An important part of the tasks of the shell is search for commands. Bash does
    this as follows:


    +   - Check whether the command contains slashes. If not, first check with the
    function list to see if it contains a command by the name we are looking for.

    - If command is not a function, check for it in the built-in list.

    - If command is neither a function nor a built-in, look for it analyzing the directories
    listed in PATH. Bash uses a hash table (data storage area in memory) to remember
    the full path names of executables so extensive PATH searches can be avoided.

    - If the search is unsuccessful, bash prints an error message and returns an exit
    status of 127.

    - If the search was successful or if the command contains slashes, the shell executes
    the command in a separate execution environment.

    - If execution fails because the file is not executable and not a directory, it
    is assumed to be a shell script.

    - If the command was not begun asynchronously, the shell waits for the command
    to complete and collects its status.


    #  1.4.1.8. Shell scripts


    When a file containing shell commands is used as the first non-option argument
    when invoking Bash (without -c or -s, this will create a non-interactive shell.
    This shell first searches for the script file in the current directory, then looks
    in PATH if the file cannot be found.


    # 1.5. Developing good scripts'
  - '[PAGE 23]


    # 1.5.1. Properties of good scripts


    This guide is mainly about the last building block, scripts. Some general considerations
    before we continue:


    +   - A script should run without errors.

    - It should perform the task for which it is intended.

    - Program logic is clearly defined and apparent.

    - A script does not do unnecessary work.

    - Scripts should be reusable.


    # 1.5.2. Structure


    The structure of a shell script is very flexible. Even though in Bash a lot of
    freedom is granted, you must ensure correct logic, flow and efficiency so that
    users executing the script can do so easily and correctly.


    When starting on a new script, ask yourself the following questions:


    +   - Will I be needing any information from the user or from the user''s environment?

    - How will I store that information?

    - Are there any files that need to be created? Where and with which permissions
    and ownerships?

    - What commands will I use? When using the script on different systems, do all
    these systems have commands in the required versions?

    - Does the user need any notifications? When and why?


    # 1.5.3. Terminology


    The table below gives an overview of programming terms that you need to be familiar
    with:


    Table 1–1. Overview of programming terms


    | Term | What is it? |

    |---|---|n| Command control | Testing exit status of a command in order to determine
    whether a portion of the program should be executed. | Conditional branch | Logical
    point in the program when a condition determines what happens next. |

    | Logic flow | The overall design of the program. Determines logic sequence of
    tasks so that the result is successful and controlled. |

    | Loop | Part of the program that is performed two or more times. |

    | User input | Information provided by an external source while the program is
    running, can be stored and recalled when needed. |


    # 1.5.4. A word on order and logic


    In order to speed up the developing process, the logical order of a program should
    be thought over in advance. This is your first step when developing a script.


    Chapter 1. Bash and Bash scripts'
