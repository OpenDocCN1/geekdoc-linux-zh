    Bash Guide for Beginners


    # 3.7. Summary


    The Bash environment can be configured globally and on a per user basis. Various
    configuration files are used to fine-tune the behavior of the shell.


    These files contain shell options, settings for variables, function definitions
    and various other building blocks for creating ourselves cozy environment.


    Except for the reserved Bourne shell, Bash and special parameters, variable names
    can be chosen more or less freely.


    Because a lot of characters have double or even triple meanings, depending on
    the environment, Bash uses a system of quoting to take away special meaning from
    one or multiple characters when special treatment is not wanted.


    Bash uses various methods of expanding command line entries in order to determine
    which commands to execute.


    # 3.8. Exercises


    For this exercise, you will need to read the useradd man pages, because we are
    going to use the /etc/skel directory to hold default shell configuration files,
    which are copied to the home directory of each newly added user.


    First we will do some general exercises on setting and displaying variables.


    +   1. Create 3 variables, VAR1, VAR2 and VAR3; initialize them to hold the values
    "thirteen", "13" and "Happy Birthday" respectively.

    2. Display the values of all three variables.

    3. Are these local or global variables?

    4. Remove VAR3.

