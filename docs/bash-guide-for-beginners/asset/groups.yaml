    else\n    echo \"Tux don't like that. Tux wants fish!\"\nfi\nanny is in ~/testdir\
    \ penguin.sh apple\nTux don't like that. Tux wants fish!\nanny is in ~/testdir\
    \ penguin.sh fish\nHnmmmm fish... Tux happy!\nanny is in ~/testdir\n```\n\n这是另一个示例，使用了两个参数：\n\
    \n```bash\nanny -> cat weight.sh\n#!/bin/bash\n\n# 如果你提供体重（公斤）和身高（厘米），\n# 此脚本将打印一条关于你体重的信息的信息。\n\
    \nweight=\"$1\"\nheight=\"$2\"\nidealweight=$((height-110))\n\nif [ $weight -le\
