    # 10.3. Operations on variables


    # 10.3.1. Arithmetic on variables


    We discussed this already in Section 3.4.6.


    # 10.3.2. Length of a variable


    Using the ${VAR} syntax will calculate the number of characters in a variable.
    If VAR is "*" or "@", the value is substituted with the number of positional parameters
    or number of elements in an array. This is demonstrated in the example below:


    ```

    [bob in ~] echo ${SHELL}

    /bin/bash

    [bob in ~] echo ${SHELL}

    9

    [bob in ~] ARRAY=(one two three)

    [bob in ~] echo ${ARRAY}

    3

    ```


    # 10.3.3. Transformations of variables


    # 10.3.3.1. Substitution


    ```

    $VAR:-WORD

    ```


    If VAR is not defined or null, the expansion of WORD is substituted; otherwise
    the value of VAR is substituted:


    ```

    [bob in ~] echo ${TEST:-test}

    test

    [bob in ~] echo $TEST

    [bob in ~] export TEST=a_string

    [bob in ~] echo ${TEST:-test}

    a_string

    [bob in ~] echo ${TEST2:-$TEST}

    a_string

    ```


    This form is often used in conditional tests, for instance this one:'
