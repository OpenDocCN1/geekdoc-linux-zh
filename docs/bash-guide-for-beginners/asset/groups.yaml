    - **gv**: PostScript 和 PDF 查看器。

    - **gzip**: 压缩或解压文件。


    ## H


    - **halt**: 停止系统。

    - **head**: 输出文件的第一部分。

    - **help**: 显示 shell 内置命令的帮助。

    - **host**: DNS 查询工具。

    - **httpd**: Apache 超文本传输协议服务器。


    ## I


    - **id**: 读取真实和有效的 UID 和 GID。

    - **ifconfig**: 配置网络接口或显示配置。

    - **info**: 读取 Info 文档。

    - **init**: 进程控制初始化。

    - **iostat**: 显示 I/O 统计信息。

    - **idconfig**: 显示网络状态。

    - **iptables**: 防火墙管理。


    ## J


    - **jar**: Java 归档。

    - **jobs**: 列出后台任务。


    ## K


    - **kill**: 终止进程。

    - **ksh**: Korn shell。


    ## L


    - **ldap**: 修改 LDAP。

    - **less**: 分页查看文本。

    - **mount**: 挂载文件系统。

    - **links**: 创建文件间的链接。

    - **locate**: 查找文件。

    - **ls**: 列出目录内容。

    - **lynx**: 文本模式浏览器。


    ## M


    - **mail**: 发送和接收邮件。

    - **man**: 阅读手册页。

    - **mcopy**: 复制文件。

    - **mdir**: 删除空目录。

    - **memusage**: 显示内存使用情况。

    - **memstat**: 显示内存统计信息。

    - **mesg**: 控制终端写入权限。

    - **mformat**: 格式化磁盘。

    - **mkboot**: 创建独立的启动系统。

    - **mkdir**: 创建目录。

    - **mkisof**: 创建 ISO 镜像。

    - **mt**: 磁带驱动操作。

    - **mtr**: 网络诊断工具。

    - **mv**: 重命名文件。


    ## N


    - **named**: 域名服务器。

    - **ncftp**: 简单的 ftp 接口。

    - **netstat**: 显示网络连接、路由表、接口统计。

    - **nfsstat**: 关于网络文件系统的统计。

    - **nmap**: 网络探索工具和扫描器。


    ## P


    - **passwd**: 更改密码。

    - **pdf2ps**: Ghostscript PDF 转 PostScript。

    - **perl**: 实用提取报告语言。

    - **pg**: 分页文本输出。

    - **ping**: 向主机发送 echo 请求。

    - **pr**: 转换文本用于打印。

    - **printenv**: 打印所有或部分环境变量。

    - **procmail**: 邮件处理器。

    - **ps**: 显示进程状态。

    - **pstree**: 显示进程树。

    - **pwd**: 打印当前工作目录。


    ## Q


    - **quota**: 显示磁盘使用量和限制。


    ## R


    - **rcp**: 远程复制（不安全！）

    - **rdesktop**: 远程桌面客户端。

    - **reboot**: 停止并重启系统。

    - **renice**: 更改运行进程的优先级。

    - **rlogin**: 远程登录（telnet，不安全！）

    - **rm**: 删除文件。

    - **rmdir**: 删除目录。

    - **roff**: roff 排版系统的概述。

    - **rpm**: RPM 软件包管理器。

    - **rsh**: 远程 shell（不安全！）


    ## S


    - **scp**: 安全远程复制。

    - **screen**: 带有 VT100 仿真的屏幕管理器。

    - **set**: 显示、设置或更改变量。

    - **setterm**: 设置终端属性。

    - **sftp**: 安全（加密）ftp。

    - **sh**: 打开一个标准 shell。

    - **shutdown**: 关机。

    - **sleep**: 等待指定的时间。

    - **slocate**: 安全增强版的 GNU Locate。

    - **slrnn**: 文本模式 Usenet 客户端。

    - **snort**: 网络入侵检测工具。

    - **sort**: 对文本文件行进行排序。

    - **ssh**: 安全 shell。

    - **ssh-keygen**: 身份验证密钥生成。

    - **stty**: 更改并打印终端行设置。

    - **su**: 切换用户。


    ## T


    - **tac**: 反向合并并打印文件。

    - **tail**: 输出文件的最后部分。



