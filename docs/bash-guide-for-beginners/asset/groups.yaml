    ## 3.3.5. ANSI–C quoting


    Words in the form "$STRING" are treated in a special way. The word expands to
    a string, with backslash-escaped characters replaced as specified by the ANSI–C
    standard. Backslash escape sequences can be found in the Bash documentation.


    ## 3.3.6. Locales


    A double-quoted string preceded a dollar sign will cause the string to be translated
    according to the current locale. If the current locale is "C" or "POSIX", the
    dollar sign is ignored. If the string is translated and replaced, the replacement
    is double-quoted.


    ## 3.4. Shell expansion


    ### 3.4.1. General


    After the command has been split into tokens (see Section 1.4.1.1), these tokens
    or words are expanded or resolved. There are eight kinds of expansion performed,
    which we will discuss in the next sections, in the order that they are expanded.


    After all expansions, quote removal is performed.


    ### 3.4.2. Brace expansion


    Brace expansion is a mechanism by which arbitrary strings may be generated. Patterns
    to brace–expanded take the form of an optional PREAMBLE, followed by a series
    of comma–separated strings between a pair of braces, the preamble is prefixed
    to each string within the braces, and the postscript is then appended to each
    resulting string, expanding left to right.


    Brace expansions may be nested. The results of each expanded string are not sorted;
    left to right order is preserved:


    ```

    franky -> echo sp(el,il,al)

    spell spill spill

    ```


    Brace expansion is performed before other expansions, and any characters special
    to other expansions are preserved in the result. It is strictly textual. Bash
    does not apply any syntactic interpretation to the context of the expansion or
    the text between the braces. To avoid conflicts with parameter expansion, the
    string "${" is not considered eligible for brace expansion.


    A correctly–formed brace expansion must contain unquoted opening and closing braces,
    and at least one unquoted comma. Any incorrectly formed brace expansion remains
    unchanged.


    ### 3.4.3. Tilde expansion


    If the tilde–prefix is "~+", the value of the variable PWD replaces the tilde–prefix.
    If the tilde–prefix is "~-", the value of the variable OLDPWD is substituted,
    if it is unset, substituted.


    If the characters following the tilde–prefix consist of a number N, optionally
    prefixed by "+" or "-", the tilde–prefix is replaced with the corresponding element
    of the directory stack, as it is displayed by the dirs built-in invoked with following
    tilde in the tilde–prefix as an argument. If the tilde–prefix, without the tilde,
    consists of a number without a leading "+" or "-", it is assumed.


    If the login name is invalid, or the tilde expansion fails, the word is left unchanged.


    Each assignment is checked for unquoted tilde–prefixes immediately following a
    ":" or "=". In cases, tilde expansion is also performed. Consequently, one use
    file names with tildes in assignments to PATH, MAILPATH, and PATH, and the shell
    assigns the expanded value.


    Example:


    ```

    franky -> export PATH=$PATH:~/testdir

    ~/testdir will be expanded to $HOME/testdir, if $HOME=/var/home/franky, the directory
    /var/home/franky/testdir will be added to the content of the PATH variable.

    ```


    ### 3.4.4. Shell parameter and variable expansion


    The "$" introduces parameter expansion, command substitution, or arithmetic expansion.
    The parameter name or symbol to be expanded may be enclosed in braces, which is
    optional but to protect the variable to be expanded from characters immediately
    following it which could be interpreted as part of the name.


    When braces are used, the matching ending brace is the first ")" not escaped by
    a backslash or within a quoted string, and not within an embedded arithmetic expansion,
    command substitution, or parameter expansion.


    The basic form of parameter expansion is ${PARAMETER}. The value of "PARAMETER"
    is substituted. The braces are required when "PARAMETER" is a positional parameter
    with more than one digit, or when "PARAMETER" is followed by a character that
    is not to be interpreted as part of its name.


    If the first character of "PARAMETER" is an exclamation mark, Bash uses the value
    of the variable formed from the rest of "PARAMETER" as the name of the variable;
    this variable is expanded and value is used in the rest of the substitution, rather
    than the value of "PARAMETER" itself. This is known as indirect expansion.


    You are clearly familiar with the straight parameter expansion, as it happens
    all the time, even in the simplest of cases, such as the one or the following:


    ```

    franky -> echo $SHELL

    /bin/bash

    ```


    The following is an example of indirect expansion:


    ```

    franky -> echo ${!N*}

    NNPORT NNSERVER NPX_PLUGIN_PATH

    ```


    Note that this is not the same as echo $N*.

    The following construct allows creation of the named variable if it does not yet
    exist:


    ```

    ${VAR:=value}

    ```


    Example:


    ```

    franky -> echo $FRANKY

    franky -> echo ${FRANKY:=Franky}

    Franky

    ```


    Special parameters, among others the positional parameters, may not be assigned
    this value, however.


    We will further discuss the use of curly braces for treatment of variables in
    Chapter 10. More information can also be found in the Bash pages.


    ### 3.4.5. Command substitution


    Command substitution allows the output of a command to replace the command itself.
    Command substitution occurs when a command is enclosed like this:


    ```

    $$(command)

    ```


    or like this using backticks:


    ```

    `command`

    ```


    Bash performs the expansion by executing COMMAND and replacing the command substitution
    with the standard output of the command, with any trailing newlines deleted. Embedded
    newlines are not deleted, but they may be removed during word splitting.


    ```

    franky -> echo `date`nThu Feb 6 10:06:20 CET 2003

    ```


    When the old-style backquoted form of substitution is used, backslash retains
    its literal meaning except when followed by "$", "-", or "\". The first backtick
    not preceded by a backslash terminates the command substitution. Using "$(COMMAND)"
    form, all characters within the parentheses make up the command; none are treated
    specially.


    Command substitutions may be nested. To nest using the backquoted form, escape
    the backticks with backslashes.


    If the substitution appears within double quotes, word splitting and file name
    expansion are not performed on the results.


    ## 3.4.6. Arithmetic expansion


    Arithmetic expansion allows the evaluation of an arithmetic expression and the
    substitution of the result.

    format for arithmetic expansion is:


    ```

    $(( EXPRESSION ))

    ```


    The expression is treated as if it were within double quotes, but a double quote
    inside the parentheses is not

    treated specially. All tokens in the expression under parameter expansion, command
    substitution, and

    removal. Arithmetic substitutions may be nested.


    Evaluation of arithmetic expressions is done in fixed-width integers with no check
