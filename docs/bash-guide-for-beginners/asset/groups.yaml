    - 9. 编写一个脚本，其中为变量分配两个值。该脚本应计算具有这些比例的矩形面积。它应该带有注释并生成优雅的输出。\n\n别忘记对你的脚本执行 `chmod`！\n\
    \n第 3 章。Bash 环境\n55\n\n# 第 4 章。正则表达式\n\n在本章中，我们将讨论：\n\n- 使用正则表达式\n- 正则表达式元字符\n\
    - 在文件或输出中查找模式\n- Bash 中的字符范围和字符类\n\n## 4.1. 正则表达式\n\n### 4.1.1. 什么是正则表达式？\n\n\
    正则表达式是一种描述字符串集合的模式。正则表达式的构建方式类似于算术表达式，通过各种运算符组合较小的表达式来构建。\n\n基本的构建块是匹配单个字符的正则表达式。大多数字符（包括所有字母和数字）都是匹配自身的正则表达式。任何具有特殊含义的元字符都可以通过在其前面加上反斜杠来引用。\n\
    \n### 4.1.2. 正则表达式元字符\n\n正则表达式后面可以跟随几个重复运算符（元字符）之一：\n\n表 4–1. 正则表达式运算符\n\n| 运算符\
    \ | 效果 |\n| :--- | :--- |\n| . | 匹配任何单个字符。 |\n| ? | 前一个项是可选的，最多匹配一次。 |\n| * |\
    \ 前一个项将匹配零或多次。 |\n| + | 前一个项将匹配一次或多次。 |\n| [N] | 前一个项恰好匹配 N 次。 |\n| [N,] | 前一个项匹配\
    \ N 次或更多。 |\n| [N,M] | 前一个项至少匹配 N 次，但不超过 M 次。 |\n| - | 如果它不在列表的开头或结尾，或者不是列表中范围的终点，则表示范围。\
    \ |\n| ^ | 匹配行首。 |\n| $ | 匹配行尾。 |\n| \\b | 匹配单词边界。 |\n| \\B | 匹配非单词边界。 |\n| \\\
    W | 匹配非单词字符。 |\n| \\b | 匹配单词边界。 |\n\n（注：此处表格内部分描述在原文中存在重复，已根据常规逻辑对齐）\n\nBash Bash\
    \ 指南\n\n两个正则表达式可以连接；生成的正则表达式匹配这两个子表达式。\n\n两个正则表达式可以通过运算符 `|` 连接；生成的正则表达式匹配任意子表达式。\n\
    \n重复优先级高于连接，而连接又高于分支。整个子表达式可以用括号括起来以覆盖这些优先级规则。\n\n### 4.1.3. 基础正则表达式与扩展正则表达式\n\
    \n在基础表达式中，元字符 `?`、`+`、`|`、`(` 和 `)` 失去了特殊含义；相反，请使用它们的转义版本。\n\n## 4.2. 示例\n\n###\
    \ 4.2.1. 什么是 grep？\n\ngrep 在输入文件中搜索给模式。当找到匹配项时，它会将该行复制到标准输出（默认）。由于 grep 没有长度限制，它可以匹配任意字符。\n\
    \n一些示例：\n\n```\ncathy -> grep root /etc/passwd\nroot:0:0:/root:/bin/bash\noperator:x:1:operator:/sbin/nologin\n\
    news:x:13:news:/var/pool/news:\n```\n\n第 4 章. 正则表达式\n65\nBash Bash 指南\n\n## 4.2.\
    \ Grep 和正则表达式\n\n- * 如果你不在 Linux 上\n  我们在这些示例中使用 grep，它支持正则表达式。GNU grep 是 Linux\
    \ 系统的默认工具。如果你在专有系统上工作，请使用 -V 选项检查。GNU grep 可以从 http://gnu.org/directory 下载。\n\n\
    ### 4.2.2.1. 行和边界\n\n从之前的示例开始，我们现在专门显示以字符串 \"root\" 开头的行：\n\n```\ncathy -> grep\
    \ ^root /etc/passwd\nroot:0:0:/root:/bin/bash\n```\n\n如果我们想查看哪些账户没有任何分配，我们搜索以\
    \ `:` 结尾的行：\n\n```\ncathy -> grep $: /etc/passwd\nnews:x:13:news:/var/pool/news:\n\
    ```\n\n为了检查 ~/.bashrc 中的 PATH，首先选择 \"export\"，然后搜索以 \"PATH\" 开头的行，以便检查 MANPATH\
    \ 和其他可能的路径：\n\n```\ncathy -> grep export ~/.bashrc | grep '\\$PATH'\nexport PATH=\"\
    /bin:/usr/lib/mh:/lib/usr/bin:/usr/local/bin:/usr/ucb:/usr/sbin:$PATH\"\n```\n\
    \n同样，\\$ 匹配单词的结尾。\n\n如果你想找到一个独立的（通过空格分隔）单词，最好使用 -w，就像我们在下面显示根分区信息的示例中所做：\n\n```\n\
    cathy -> grep -w /etc/fstab\n```\n\n"
