    source = .

    The Bash source built-in is a synonym for the Bourne shell , (dot) command.

    The script does not execute permission in this case. Commands are executed in
    the current shell context, so any changes to your environment will be visible
    when the script finishes execution:


    ```

    willy~/scripts source script1.sh

    --output omitted--

    willy~/scripts echo $VALUE

    9

    willy~/scripts>

    ```


    # 2.2. Script basics


    # 2.2.1. Which shell will run the script?


    When running a script in a subshell, you should define which shell should run
    the script. The shell type in which you wrote the script might not be the default
    on your system, so commands you entered might result in errors executed by the
    wrong shell.


    The first line of the script determines the shell to start. The first two characters
    of the first line should be #!, then follows the path to the shell that should
    interpret the commands that follow. Blank lines are also considered to be lines,
    so don''t start your script with an empty line.


    For the purpose of this course, all scripts will start with the line


    #!/bin/bash


    As noted, this implies that the Bash executable can be found in /bin.


    # 2.2.2. Adding comments


    You should be aware of the fact that you might not be the only person reading
    your code. A lot of users and system administrators run scripts that were written
    by other people. If they want to see how you did it, comments are useful to enlighten
    the reader.


    Comments also make your life easier. Say that you had to read a lot of man pages
    in order to achieve a particular result with some command that you used in your
    script. You won''t remember how it worked if you need to change your script after
    a few weeks or months, unless you commented what you did, how you did it and/or
    why you did it.


    Take the script.sh example and copy it to commented-script.sh, which we edit so
    that the comments reflect what the script does. Everything the script encounters
    after a hash on line is ignored and only visible upon opening the script file:


    ```

    #!/bin/bash

    # This script clears the terminal, displays and gives information

    # about currently connected users. The two example variables are set and displayed.

    ```


