- md: "\n# Bash Guide for Beginners\n\n## 7.1.2.2. Numeric comparisons\n\nThe examples\
    \ below use numerical comparisons:\n\n```\nanny > num=`wc -l work.txt\nanny >\
    \ echo $num\n201\n\nanny > if [ \"$num\" -gt \"150\" ]\nthen echo \"you've worked\
    \ hard enough for today.\"\nelse echo;\nfi\n```\n\nyou've worked hard enough for\
    \ today. \n\nanny >\n\nThis script is executed by cron every Sunday. If the week\
    \ is even, it reminds you to put out the garbage cans:\n\n```bash\n#!/bin/bash\n\
    \n# Calculate the week number using the date command:\nWEEKOFFSET=$(($(date +\"\
    %W\") % 2))\n\n# Test if we have a remainder. If not, this is an even week so\
    \ send a message.\n# Else, do nothing.\n\nif [ $WEEKOFFSET -eq \"0\" ]; then\n\
    \    echo \"Sunday evening, put out the garbage cans.\" | mail -s \"Garbage cans\
    \ out\"@your_domain\nfi\n```\n\n## 7.1.2.3. String comparisons\n\nAn example of\
    \ comparing strings for testing the user ID:\n\n```bash\nif [ \"$(whoami)\" !=\
    \ 'root' ]; then\n    echo \"You have no permission to run $0 as non-root user.\"\
    \nfi\n```\n\nWith Bash, you can shorten this remainder. The compact version of\
    \ the above test is as follows:\n\n```bash\n[ \"$(whoami)\" != 'root' ] && ( echo\
    \ you are using a non-privileged account; exit 1 )\n```\n\nSimilar to the \"&\"\
    \ expression which indicates what to do if the test proves true, \"|\" specifies\
    \ what to do if the test is false.\n\nRegular expressions may also be used in\
    \ comparisons:\n\n```\nanny > gender=\"female\"\nanny > if [[ \"$gender\" == *\
    \ ]];\n then echo \"Pleasure to meet you, Madame.\"; fi\nPleasure to meet you,\
    \ Madame.\nanny >\n```\n\n## Chapter 7. Conditional statements\n\nMost programmers\
    \ will prefer to use the test built-in command, which is equivalent to using square\
    \ brackets for comparison, like this:\n\n```bash\ntest [ \"$(whoami)\" != 'root'\
    \ ] && (echo you are using a non-privileged account; exit 1)\n```\n\nSee the info\
    \ pages for Bash for more information on pattern matching with \"(( EXPRESSION\
    \ ))\" and \"[[ EXPRESSION]]\" constructs.\n\n## 7.2. More advanced if usage\n\
    \n### 7.2.1. if/then/else constructs\n\n#### 7.2.1.1. Dummy example\n\nThis is\
    \ the construct to use one course of action if the commands test true, and another\
    \ if it tests false. An example:\n\n```bash\nfreddy scripts> gender=\"male\"\n\
    freddy scripts> if [[ \"$gender\" == \"female\" ]];\nthen echo \"Pleasure to meet\
    \ you, Madam.\"\nelse \necho \"How the lady hasn't got a drink yet?\"\nffi\nhow\
    \ the lady hasn't got a drink yet?\n```\n\nLike the CONSEQUENT-COMMANDS list following\
    \ the then statement, the ALTERNATE-CONSEQUENT-COMMANDS list following the else\
    \ statement can hold any UNIX-style command that returns an exit status.\n\nAnother\
    \ example, the one from Section 7.1.2.1:\n\n```bash\nanny -> su -\nPassword:\n\
    [root@elegance root]# if grep $USER /etc/passwd 2>/dev/null\nthen echo \"user\
    \ account is not managed locally\"\nelse \necho \"your account is managed from\
    \ the local /etc/passwd file\"\nfi\n[root@elegance root]#\nyour account is managed\
    \ from the local /etc/passwd file\n\nWe switch to the root account to demonstrate\
    \ the effect of the else statement - your root is usually a local account while\
    \ your user account might be managed by a central system, such as an LDAP.\n\n\
    #### 7.2.1.2. Checking line arguments\n\nInstead of setting a variable and then\
    \ executing a script, it is frequently more elegant to put the values for the\
    \ variables on the command line.\n\nThe positional parameters $1, $2, ..., $N\
    \ for this purpose. $ refers to the number of command line arguments. $0 refers\
    \ to the name of the script.\n\nThe following is a simple example:\n\nFigure 7–1.\
    \ Testing of a command line argument with if\n\n```\nanny@octarine:~/testdir\n\
    File Edit View Terminal Help\nanny is in ~/testdir cat penguin.sh\n#!/bin/bash\n\
    \n# This script lets you present different menus to Tux. He will only be happy\n\
    # when given a fish.\n\nif [ \"$1\" = \"fish\" ]; then\n    echo \"Hnmmmm... Tux\
    \ happy!\"\nelse\n    echo \"Tux don't like that. Tux wants fish!\"\nfi\nanny\
    \ is in ~/testdir penguin.sh apple\nTux don't like that. Tux wants fish!\nanny\
    \ is in ~/testdir penguin.sh fish\nHnmmmm fish... Tux happy!\nanny is in ~/testdir\n\
    ```\n\nHere's another example, using two arguments:\n\n```bash\nanny -> cat weight.sh\n\
    #!/bin/bash\n\n# This script prints a message about your weight if you give it\
    \ your\n# weight in kilos and height in centimeters.\n\nweight=\"$1\"\nheight=\"\
    $2\"\nidealweight=$((height-110))\n\nif [ $weight -le $idealweight ]; then\n \
    \   echo \"You should eat a bit more fat.\"\nelse\n    echo \"You should eat a\
    \ bit more fruit.\"\nfi\n```\n\n```bash\nanny -> weight.sh 70 180\nYou should\
    \ eat a bit more fat.\nanny -> weight.sh 70 150\nYou should eat a bit more fruit.\n\
    ```\n\n## 7.2.1.3. Testing that arguments\n\nThe following example shows how to\
    \ check the number of arguments passed:\n\n```bash\n#!/bin/bash\nif [ $# -ne 2\
    \ ]; then\n    echo \"Usage: $0 weight height\"\n    exit 1\nfi\n```\n\n#### 7.2.1.4.\
    \ Testing that a file exists\n\nThis test is done in lot of scripts, because you\
    \ need to know if a file exists:\n\n```bash\n#!/bin/bash\nFILENAME=\"$1\"\n\n\
    if [ -f \"$FILENAME\" ]; then\n    echo \"Properties for $FILENAME:\"\n    echo\
    \ \"Size: $(ls -lh $FILENAME | awk '{print $5}')\"\n    echo \"Type is $(file\
    \ $FILENAME | cut -d \":\" -f2)\"\n    echo \"Inode number is $(ls -i $FILENAME\
    \ | cut -d \"\" -f1)\"\n    echo \"on $(df -h | grep -v Use | awk '{print $1}')\"\
    \nelse\n    echo \"File does not exist.\"\nfi\n```\n\n### 7.2.2. if/then/elif/else\
    \ constructs\n\n#### 7.2.2.1. General\n\nThis is the full form of the if statement:\n\
    \n```bash\nif TEST-COMMANDS; then\n    CONSEQUENT-COMMANDS;\nelif MORE-TEST-COMMANDS;\
    \ then\n    MORE-CONSEQUENT-COMMANDS;\nelse\n    ALTERNATE-CONSEQUENT-COMMANDS;\n\
    fi\n```\n\nThe TEST-COMMANDS list is executed, and if its return status is zero,\
    \ the CONSEQUENT-COMMANDS list returns a non-zero status, each elif list is executed\
    \ in turn, and if its exit status is zero, the corresponding MORE-CONSEQUENT-COMMANDS\
    \ is executed and the command completes. If else is followed by an ALTERNATE-CONSEQUENT-COMMANDS\
    \ list, and the final command in the if or elif clause has a non-zero exit status,\
    \ ALTERNATE-CONSEQUENT-COMMANDS is executed. The return status is the exit status\
    \ of the last command executed, or zero if no condition tested true.\n\n#### 7.2.2.2.\
    \ Example\n\nThis is an example you can run in your crontab for daily execution:\n\
    \n```bash\n#!/bin/bash\n# This script does a very simple test for checking disk\
    \ space.\n\nspace=`df -h | awk 'print $5' | grep % | grep -v Use | sort -n | tail\
    \ -1 | cut -d \"\" -f1'\nalertvalue=80\n\nif [ \"$space\" -ge \"$alertvalue\"\
    \ ]; then\n    echo \"At least one of my disks is nearly full!\" | mail -s \"\
    daily diskcheck\" root\nelse\n    echo \"Disk space normal\" | mail -s \"daily\
    \ diskcheck\" root\nfi\n```\n"
  mdcn: "\n\n# 初学者 Bash指南\n\n## 7.1.2.2. 数值比较\n\n下面的示例使用了数值比较：\n\n```\nanny > num=`wc\
