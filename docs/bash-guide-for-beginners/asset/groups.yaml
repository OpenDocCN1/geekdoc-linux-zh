    | HISTFILE | 存储历史的文件。 |

    | HISTSIZE | 历史记录中命令的数量。 |

    | HISTIGNORE | 一个用冒号分隔的模式列表，定义了哪些命令不保存到历史中。 |

    | HISTORYSIZE | 历史记录的最大行数。 |

    | HOSTNAME | 描述主机的字符串。 |

