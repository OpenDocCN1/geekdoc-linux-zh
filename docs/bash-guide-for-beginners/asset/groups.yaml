    \ So much errors, all these errors are making me sick.\n5 This is a line not containing\
    \ any errors.\n6 This is the last line.\n```\n\nWe want sed to find all the lines\
    \ containing our search pattern, in this case \"errors\". We use the p to obtain\
    \ the result:\n\n```\nsandy -> sed '/errors/p' example\nThis is the first line\
    \ of an example text.\nIt is a text with errors.\nIt is a text with errors.\n\
