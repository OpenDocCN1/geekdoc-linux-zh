    \n该循环的语法为：\n\n`for NAME [in LIST]; do COMMANDS; done`\n\n如果 `[LIST]` 不存在，它将被替换为\
    \ `$@`，且 `for` 会为每个已设置的位置参数执行一次 `COMMANDS`（见第 3.2.5 节和第 7.2.1.2 节）。\n\n返回状态是最后一个执行命令的退出状态。如果没有执行任何命令或\
    \ `LIST` 没有展开为任何项，则返回状态为零。\n\n`NAME` 可以是任何变量名，尽管 `i` 被经常使用。`LIST` 可以是任何单词、字符串或数字的列表，可以是字面量，也可以由任何命令生成。要执行的\
    \ `COMMANDS` 是是操作系统命令、脚本、程序或 shell 语句。循环第一次执行时，`NAME` 被设置为 `LIST` 中的第一项。第二次，它的值被设置为列表中的第二项，依此类推。当\
    \ `NAME` 已经取了 `LIST` 中的每个值且 `LIST` 中没有留剩余项时，循环终止。\n\n### 9.1.2. 示例\n\n#### 9.1.2.1.\
    \ 使用替换指定 LIST 项\n\n第一个是命令行示例，演示了如何使用 `for` 循环为每个 .xml 文件制作备份。在发出命令后，就可以安全地处理源码了：\n\
    \n```bash\n[carol@octopus~/articles] ls *.xml\nfile1.xml file2.xml file3.xml\n\
