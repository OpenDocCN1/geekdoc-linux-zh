    图 7–1. 使用 if 测试命令行参数\n\n```\nanny@octarine:~/testdir\nFile Edit View Terminal\
    \ Help\nanny is in ~/testdir cat penguin.sh\n#!/bin/bash\n\n# 此脚本允许向 Tux 展示不同的菜单。只有在给它鱼时，\n\
