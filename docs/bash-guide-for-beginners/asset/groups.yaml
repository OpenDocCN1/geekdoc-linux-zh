    ```\n\n```\nmichel -> ls -l /proc/self/fd/[0-2]\nlrwx---- 1 michel 64 Jan 23 12:11\
    \ /proc/self/fd/0 -> /dev/pts/6\nlrwx---- 1 michel 64 Jan 23 12:11 /proc/self/fd/1\
    \ -> /dev/pts/6\nlrwx---- 1 michel 64 Jan 23 12:11 /proc/self/fd/2 -> /dev/pts/6\n\
    ```\n\n你可能想检查 /dev 以获取更多关于 /proc 子目录以及你的系统如何处理每个运行进程的文件描述符的信息。当你运行脚本时，行名可能会改变，子进程将使用与父进程相同的文件描述符。当没有此类父可用时（例如当你使用\
    \ cron 功能运行脚本时），标准描述符是管道或其他（临时）文件，除非其中某些被重定向了。下方的示例演示了这一点，它显示来自一个简单的脚本：\n\n```\n\
    michel -> date\nFri Jan 24 11:05:50\n```\n\n以及使用 cron：\n\n```\nmichel -> crontab\
    \ -l\n# 不要编辑此文件 - 请编辑主文件并重新安装。\n# (Cron 版本 1 安装于 Jan 24 11:30)\n* * * * ls -l\
    \ /proc/self/fd -> /var/tmp/fd\n```\n\n```\nmichel -> cat /var/tmp/fd\ntotal 0\n\
    lrwxxrwx root root 17 Oct 20:46 /dev/self/stderr -> ../proc/self/fd2\nlrwxxrwx\
    \ root root 17 Oct 20:46 /dev/stdin -> ../proc/self/fd/0\nlrwxxrwx root root 17\
    \ Oct 20:46 /dev/stdout -> ../proc/self/fd1\n```\n\n## 8.2.3. 错误重定向\n\n从前面的示例中，你可能知道，错误可以在命令执行之前被重定向。重定向也可以用于打开和关闭当前\
    \ Shell 执行环境的文件。\n\n重定向错误也可以发生在脚本中。此外，如果你幸运，错误会被发送到任何地方。如果你不幸运，错误会被重定向到某个处，以便被捕获。\n\
    \n第 8章 编写交互式脚本\n\n# 初学者 Bash指南\n\n在重定向错误时，请注意顺序是重要的。例如，这个在 /spool 中的命令：\n\n```\n\
    ls -l * 2 > /tmp/spool\n将标准错误重定向到 /tmp/spool\n```\n\n```\nls -l * > /tmp/spool\
    \ 2>&1\n先将标准输出重定向到文件，然后将错误定向到输出\n```\n\n```\nls -l * 2>&1\n将标准错误重定向到标准输出\n```\n\
    \n```\nls -l * &> /tmp/spool\n将标准输出和错误都重定向到 /tmp/spool\n```\n\n此外，你还可以使用 `>>`\
    \ 来追加错误到文件，例如：\n\n```\nls -l * 2 >> /tmp/spool\n将标准错误追加到文件\n```\n\n```\nls -l\
    \ * &>> /tmp/spool\n将标准输出和错误都追加到 /tmp/spool\n```\n\n当然，这种情况情况并不理想，因为每个人都可以编辑（但不能删除）Michel\
    \ 的文件。你可以使用脚本文件上的特殊访问模式来解决这个问题，请参阅《Linux 入门》中的 SUID 和 SGID。\n\n## 8.2.4. 文件输入和输出\n\
    \n### 8.2.4.1. 使用 /dev/fd\n\n正如你从基本用法中所了解的，命令的输入和输出可以在执行之前进行重定向，使用特殊的符号——重定向运算符，由\
    \ Shell 解释。\n\n你可以使用文件句符。dev/fd 目录包含命名为 0、1、2 等的条目。打开 /dev/fd/N 等于复制文件描述符 N。如果你的系统提供了\
    \ /dev/stdin、dev/stdout 和 /dev/stderr，你会发现这些都等于 /dev/fd/0、dev/fd/1 和 /dev/fd/2。\n\
    \n/dev/fd 文件的主要用法来自 Shell。这种机制允许使用参数的程序以处理其他路径的方式处理标准输入输出。如果系统上没有 /dev/fd，你将不得不找到一种绕过该过程的方法。这例如可以使用连字符\
    \ (-) 表示程序应该从管道读取。一个示例：\n\n```\nmichel -> filter body.txt.gz | cat header.txt\
    \ -> footer.txt\n```\n\n输出：\n\n```\n这段文本打印在每个任务的开头，并感谢系统管理员设置了如此棒的打印基础设施。\n\n\
    要过滤的文本。\n\n这段文本打印在每个任务的结束。\n```\n\n"
