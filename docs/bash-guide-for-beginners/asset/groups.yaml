    # 10.2. 数组变量


    ### 10.2.1. 创建数组


    数组是一个包含多个值的变量。任何变量都可以用作数组。数组的大小没有上限，也不要求成员变量必须连续索引或赋值。数组是从 0 开始索引的：第一个元素的索引为数字
    0。


    间接声明使用以下语法来声明变量：


    ```

    ARRAY [INDEXNR]=value

    ```


    INDEXNR 被视为一个算术表达式，必须求值为一个正数。


    使用 `declare` 内置命令对数组进行显式声明：


    ```

    declare -a ARRAYNAME

    ```


    带有索引数字的声明也会被接受，但索引数字会被忽略。可以使用 `declare` 和 `readonly` 内置命令指定指定数组的属性。属性适用于数组中的所有变量；你不能拥有混合数组。


    也可以使用这种格式的复合赋值来创建数组变量：


    ```

    ARRAY=(value1 value2 ... valueN)

    ```


    每个值随后都以 `indexnumber=string` 的形式存在。索引数字是可选的。如果提供，则将该索引分配给它；否则，分配的元素索引是上一个分配的最后一个索引加一。`declare`
    命令也接受这种格式。如果没有提供索引数字，则索引从零开始。


    使用以下语法在数组中添加额外的成员：


    ```

    ARRAYNAME[indexnumber]=value

    ```


    记住 `read` 内置命令提供了 `-a` 选项，它允许对数组成员变量进行读取和赋值。


    ### 10.2.2. 数组中变量的解引用


    为了引用数组中某项的内容，请使用大括号。如示例所示，这是必要的，用以绕过 shell 对扩展操作符的解释。如果索引数字为 `@` 或 `*`，则引用数组的所有成员。


    ```

    [bob in ~] ARRAY=(one two three)

    [bob in ~] echo ${ARRAY[*]}

    ```


    第 10 章 更多关于变量的内容


    ```

    one two three


    [bob in ~] echo $ARRAY[*]

    one[*]


    [bob in ~] echo ${ARRAY[2]}

    tthree


    [bob in ~] ARRAY[3]=four


