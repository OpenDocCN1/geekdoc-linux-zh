    \ echo \"you've worked hard enough for today.\"\nelse echo;\nfi\n```\n\n你今天已经足够努力了。\
    \ \n\nanny >\n\n此脚本由 cron 每周日执行一次。如果该周是偶数周，它会提醒你去倒垃圾：\n\n```bash\n#!/bin/bash\n\
    \n# 使用 date 命令计算周数：\nWEEKOFFSET=$(($(date +\"%W\") % 2))\n\n# 测试是否有余数。如果没有，说明是偶数周，发送消息。\n\
    # 否则，什么都不做。\n\nif [ $WEEKOFFSET -eq \"0\" ]; then\n    echo \"Sunday evening,\
