    \ 70 180\nYou should eat a bit more fat.\nanny -> weight.sh 70 150\nYou should\
    \ eat a bit more fruit.\n```\n\n## 7.2.1.3. 测试参数\n\n下面的示例显示了如何检查传递的参数数量：\n\n```bash\n\
    #!/bin/bash\nif [ $# -ne 2 ]; then\n    echo \"Usage: $0 weight height\"\n   \
    \ exit 1\nfi\n```\n\n#### 7.2.1.4. 测试文件是否存在\n\n这种测试在很多脚本中都会进行，因为你需要知道文件是否存在：\n\
    \n```bash\n#!/bin/bash\nFILENAME=\"$1\"\n\nif [ -f \"$FILENAME\" ]; then\n   \
    \ echo \"Properties for $FILENAME:\"\n    echo \"Size: $(ls -lh $FILENAME | awk\
    \ '{print $5}')\"\n    echo \"Type is $(file $FILENAME | cut -d \":\" -f2)\"\n\
    \    echo \"Inode number is $(ls -i $FILENAME | cut -d \"\" -f1)\"\n    echo \"\
    on $(df -h | grep -v Use | awk '{print $1}')\"\nelse\n    echo \"File does not\
    \ exist.\"\nfi\n```\n\n### 7.2.2. if/then/elif/else 结构\n\n#### 7.2.2.1. 通用\n\n\
    这是 if 语句的完整形式：\n\n```bash\nif TEST-COMMANDS; then\n    CONSEQUENT-COMMANDS;\n\
    elif MORE-TEST-COMMANDS; then\n    MORE-CONSEQUENT-COMMANDS;\nelse\n    ALTERNATE-CONSEQUENT-COMMANDS;\n\
    fi\n```\n\n执行 TEST-COMMANDS 列表，如果其返回状态为零，则执行 CONSEQUENT-COMMANDS 列表；如果不是，则依次执行每个\
    \ elif 列表，如果其退出状态为零，则执行相应的 MORE-CONSEQUENT-COMMANDS 并完成命令。如果 else 跟着 ALTERNATE-CONSEQUENT-COMMANDS\
    \ 列表，且 if 或 elif 子句中的最后一个命令退出状态为非零，则执行 ALTERNATE-CONSEQUENT-COMMANDS。返回状态为最后一个执行命令的退出状态，如果没有没有条件为真，则为零。\n\
    \n#### 7.2.2.2. 示例\n\n这是一个可以在 crontab 中每日执行的示例：\n\n```bash\n#!/bin/bash\n# 此脚本对磁盘空间进行一个非常简单的测试。\n\
    \nspace=`df -h | awk 'print $5' | grep % | grep -v Use | sort -n | tail -1 | cut\
    \ -d \"\" -f1'\nalertvalue=80\n\nif [ \"$space\" -ge \"$alertvalue\" ]; then\n\
    \    echo \"At least one of my disks is nearly full!\" | mail -s \"daily diskcheck\"\
    \ root\nelse\n    echo \"Disk space normal\" | mail -s \"daily diskcheck\" root\n\
    fi\n```\n\n"
