    one two three four

    ```


    在不提供索引数字的情况下引用数组成员变量的内容，等同于引用索引为零第一个元素的内容。


    ### 10.2.3. 删除数组变量


    使用 `unset` 命令来删除数组或数组的成员变量：


    ```

    [bob in ~] unset ARRAY[1]

    [bob in ~] echo ${ARRAY[*]}

    one three four


    [bob in ~] unset ARRAY

    [bob in ~] echo ${ARRAY[*]}

    <--no-output->

    ```


    ### 10.2.4. 数组示例


    很难找到使用数组的实际示例。你会发现很多脚本它们实际上并没有在你的系统上做任何事情，但使用了数组来计算数学级数，例如。这本该是最有趣的示例之一……大多数示例只是以一种过度简化和理论化的方式展示你可以用数组做什么。


    这种枯燥的原因是数组是相关的复杂结构。你会发现，大多数可以使用数组的实际示例已经在你的系统数组中实现了，但在更底层面，即在编写 UNIX 命令的 C 语言中实现。一个很好的例子是
    Bash 内置的 `history` 构建。感兴趣的读者可以检查 Bash 源码树中的 `built` 目录并查看 `fc.def`，它在编译内置命令时会被处理。


    另一个很难找到的好例子是，并不是所有的 shell 都支持数组，因此它们破坏了兼容性。


