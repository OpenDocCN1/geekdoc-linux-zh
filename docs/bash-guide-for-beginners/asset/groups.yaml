    \ \"3. kernelnewbies\"\necho \"4. sports\"\necho \"5. bofh-excuses\"\necho \"\
    6. magic\"\necho \"7. love\"\necho \"8. literature\"\necho \"9. drugs\"\necho\
    \ \"10. education\"\n\necho -n \"Enter your choice, or 0 for exit: \"\nread choice\n\
