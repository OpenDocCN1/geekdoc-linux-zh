    ## 3.2.3. Exporting variables


    A variable like the ones in the example above is only available to the current
    shell. It is a local variable: child processes of the current shell will not be
    aware of this variable. In order to pass variables to a subshell, we need to export
    them using the export built-in command. Variables that are exported are referred
    to as environment variables. Setting and exporting is usually done in one step:


    ```bash

    export VARNAME="value"

    ```


    A subshell can change variables inherited from the parent, but the changes made
    by the child do not affect the parent. This is demonstrated in the example:


    ```bash

    frank -> full_name="Franky M. Singh"

    frank -> bash

    frank -> echo $full_name


    frank -> exit

    frank -> export full_name

    frank -> bash


    frank -> echo $full_name

    Franky M. Singh


    frank -> export full_name="Charles the Great"


    frank -> echo $full_name

    Charles the Great


    frank -> exit

    frank -> echo $full_name

    Franky M. Singh


    frank ->

    ```


    When first trying to read the value of full_name in a subshell, it is not there
    (echo shows a null string). The subshell quits, and full_name is exported in the
    parent - a variable can be exported after it has been assigned a value. Then a
    new subshell is started, in which the variable exported from the parent is visible.
    The variable is changed to hold another name, but the value for this variable
    in the parent stays the same.


    ## 3.2.4. Reserved variables


    ### 3.2.4.1. Bourne shell variables


    Bash uses certain shell variables in the same way as the Bourne shell. In some
    cases, Bash assigns a default value to the variable. The table below gives an
    overview of these plain shell variables:


    Table 3–1. Bourne shell variables


    | Variable name | Definition |

    |---|---|

    | CDPATH | A colon-separated list of directories used as a search path for the
    `cd` built-in command. |

    | HOME | The current user''s home directory; the default for the `cd` built-in.
    The value of this variable is also used by tilde expansion. |

    | IFS | A list of characters that separate fields; used when the shell splits
    words as part of expansion. |

    | MAIL | If this parameter is set to a file name and the MAILPATH variable is
    not set, Bash informs the user of the arrival of mail in the specified file. |

    | MAILPATH | A colon-separated list of file names which the shell periodically
    checks for new mail. |

    | OPTARG | The value of the last option processed by the getopts built-in. |

    | OPTIND | The index of the last option processed by the getopts built-in. |

    | PATH | A colon-separated list of directories in which the shell looks for commands.
    |

    | PS1 | The primary prompt string. The default value is `"\s-\w\$`. |

    | PS2 | The secondary prompt string. The default value is `">"`. |


    ## 3.2.4.2. Bash reserved variables


    These variables are set or used by Bash, but others do not normally treat them
    specially.


    Table 3–2. Reserved Bash variables


    | Variable name | Definition |

    |---|---|

    | auto_resume | This variable controls how the shell interacts with the user and
    job control. |

    | BASH | The full pathname used to execute the current instance of Bash. |

    | BASH_ENV | If this variable is set when Bash is invoked to execute a shell script,
    it is expanded and used as the name of a startup file before executing the script.
    |

    | BASH_VERSION | The version of the current instance of Bash. |

    | BASH_VERSINFO | A read-only array variable whose members hold version information
    for this instance. |

    | COLUMNS | Used by the select built-in to determine the terminal width when printing
    lists. Automatically upon receipt of a SIGWINCH signal. |

    | COMP_CWORD | An index in ${COMP_WORDS} of the word containing the current cursor
    position. |

    | COMP_LINE | The current command line. |

    | COMP_POINT | The index of the current cursor position relative to the beginning
    of the current command. |

    | COMP_WORDS | An array consisting of the individual words in the current command
    line. |

    | COMPREPLY | An array variable which Bash reads the possibilities generated by
    a shell function invoked by the programmable completion facility. |

    | DIRSTACK | An array variable containing the contents of the directory stack.
    |

    | EUID | The numeric effective user ID of the current user. |

    | FCEDIT | The editor used as the -e option to the fc built-in command. |

    | FIGNORE | A colon-separated list of suffixes to ignore when performing file
    name completion. |

    | FUNCNAME | The name of any currently-executing shell function. |

    | GLOBNORE | A colon-separated list of patterns defining the set of file names
    to be ignored by file expansion. |

    | GROUPS | An array variable containing the list of groups of which the current
    user is a member. Up to three characters that control history expansion, quick
    substitution, and tokenization. |

    | HISTCMD | The history number, or index in the history list, of the current command.
    |

    | HISTCONTROL | A colon-separated list of patterns defining which commands should
    be saved from the history. |

    | HISTFILE | The file in which the history is saved. |

    | HISTSIZE | The number of commands to remember in the history. |

    | HISTIGNORE | A colon-separated list of patterns defining which commands should
    not be saved to the history. |

    | HISTORYSIZE | The maximum number of lines in the history. |

    | HOSTNAME | A string describing the host. |

    | INPUTRC | The Readline interface configuration. |

    | LANG | The locale setting. |

    | OSTYPE | A string describing the operating system. |

    | PIPESTATUS | An array variable containing exit values from the most recently
    executed pipeline. |

    | POSIX | If this variable is in the environment when bash starts, the shell enters
    POSIX mode. |

    | PPID | The process ID of the shell''s parent. |

    | PROMPT_COMMAND | If set, the value is interpreted as a command to execute before
    the printing of each prompt (PS1). |

    | PS3 | # |

    | PS4 | The value of this variable is used as the prompt for the select command.
    The value is echoed before the command line when the -x option is set; defaults
    to "+". |

    | PWD | The current working directory as set by the cd command. |

    | RANDOM | Each time this parameter is referenced, a random integer between 0
    and 32767 is generated. |

    | REPLY | The default variable for the read built-in. |

    | SECONDS | This variable expands to the number of seconds since the shell was
    started. |

    | SHELLOPS | A colon-separated list of enabled shell options. |

    | SHLVL | Incremented by one each time a new instance of Bash is started. |

    | TIMEFORMAT | The value of this parameter is used as a format string specifying
    how the time information for pipelines referenced with the time word will be displayed.
    |

    | TIMEOUT | If set to a value greater than zero, TIMEOUT serves as the default
    timeout for the read built-in. |

    | UID | The numeric, real user ID of the current user. |


    Check the Bash man, info or doc pages for extended information. Some variables
    are read-only, some are set automatically and lose their meaning when set to a
    different value than the default.


    ## 3.2.5. Special parameters


    The shell treats several parameters specially. These parameters may only be assigned;
