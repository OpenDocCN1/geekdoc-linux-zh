    \ localhost\n192.168.42.1 tintagel.kingarthur.com tintagel\ncentral DNS\n```\n\
    \nWait, it's good practice to close a file descriptor when it is no longer needed.\
    \ This is done using the\n\n```\nexec FD&-\n```\n\nsyntax. In the above example,\
    \ file descriptor 7, which has been assigned to standard input, is declosed each\
    \ time the user needs to have access to the standard input device, usually the\
    \ keyboard.\n\nThe following is a simple example redirecting standard error to\
    \ a pipe:\n\n```\nmichel -> cat listdirs.sh\n#!/bin/bash\n\n# This script prints\
    \ standard output unchanged, while standard error is\n# redirected for processing\
    \ by awk.\n\nINPUTDIR=$1\n\nexec 6> /dev/null\n\nls \"$INPUTDIR\"/* 2>&1 6>&-\
    \ \\\n  # Closes fd 6 for awk, but not for ls.\n| awk 'BEGIN { FS=\":\" } print\
    \ \"YOU HAVE NO ACCESS TO\" $2 }' 6>&-\nexec 6>&-\n```\n\n## 8.2.4.4. Here documents\n\
    \nFrequently, your script might call on another program or script that requires\
    \ input. The here document provides a way of instructing the shell to read input\
    \ from the current source until a line containing only the string is found (no\
    \ trailing blanks). All of the lines up to that point are then used as the standard\
    \ input for a command.\n\nThe result is that you don't need to call separate files;\
    \ you can use shell-characters, and it looks nicer than a bunch of echo:\n\n```\n\
    michel -> cat startsurf.sh\n#!/bin/bash\n\n# This script provides an easy way\
    \ for users to choose between browsers.\necho \"These are the web browsers on\
    \ this system:\"\n\n# Start here document\ncat << BROWSERS\nmozilla\nlinks\nkonqueror\n\
    opera\nnetscape\nBROWSERS\n# End here document\n\necho -n \"Which is your favorite?\
    \ \"\nread browser\n\necho \"Starting $browser, please wait...\"\n```\n\n```\n\
    michel -> startsurf.sh\nThese are the web browsers on this system:\nmozilla\n\
    links\nkonqueror\nopera\nnetscape\nWhich is your favorite? opera\nStarting opera,\
    \ please wait...\n```\n\nAlthough we talk about here document, it is supposed\
    \ to be used within the same script. This is an example that installs a package\
    \ automatically, you should normally confirm:\n\n```bash\n#!/bin/bash\n\n# This\
    \ script installs packages automatically, using yum.\n\nif [ $# -lt 1 ]; then\n\
    \    echo \"Usage: $0 package.\"\n    exit 1\nfi\n\nyum install $1 << CONFIRM\n\
    y\nCONFIRM\n```\n\n```\nroot@bin# ./install.sh\nGathering information(s) from\
    \ server(s)\nServer: Linux 2 - core\nServer: Linux 2 - fresh\nServer: Linux 2\
    \ - generic\nServer: Linux 2 - updates\nFinding updated packages\nDownloading\
    \ needed\nDownloading Packages\nRunning test\nResolving dependencies\nDependencies\
    \ resolved\nI will do the following:\nIs this ok [y/N]: Downloading Packages\n\
    Running test\nTransaction complete, Success!\nInstalled: 100% done\nTransaction(s)\
    \ Complete\n```\n\n## 8.3. Summary\n\nIn this chapter, we learned how to provide\
    \ comments and how to prompt for user input. This is usually done using echo/read\
    \ combination. We also discussed how files can be used as input and output file\
    \ descriptors, and how this can be combined with getting input from the user.\n\
    \nWe stressed the importance of providing ample message for the users. When others\
    \ use your scripts, it is better to give too much information than not enough.\
    \ Here documents are shell constructs that allow creation of lists, holding choices.\
    \ This construct can also be used to execute interactive tasks without intervention.\n\
    \n## 8.4. Exercises\n\nThese exercises are practical applications of the constructs\
    \ discussed in this chapter. When writing the scripts, you may test using a directory\
    \ that does not contain much data. Write each step, test that portion of code,\
    \ rather than writing everything at once.\n\n- Write a script that asks for the\
    \ user's age. If it is equal to or higher than 16, print a message saying that\
    \ this user is allowed to drink alcohol. If the user's age is below 16, print\
    \ message telling the user how many years he or she has to wait before legally\
    \ allowed to drink.\n- As an extra, calculate how much beer an 18+ user has drunk\
    \ (100 liters/year) and print this for the user.\n- Write a script that takes\
    \ one file as an argument. Use a *here* document that presents the user with a\
    \ couple of choices for compressing the file. Possible choices could be `gzip`,\
    \ `bzip2`, `compress` and `zip`.\n- Write a script homebackup automate tar so\
    \ the person executing it always uses the desired options (`cvp`) and backup directory\
    \ (`/var/backups`) to make a backup of his or her home directory. Implement the\
    \ following features:\n- The script should run without arguments. If any arguments\
    \ are present, exit after printing usage.\n- Determine whether the backups directory\
    \ has an incremental backup wanted. If the user does not have a full backup yet,\
    \ print a message that a full backup will be taken. In case of an incremental\
    \ backup, only if this backup is not older than a week.\n- Compress the backup\
    \ using compression tool. Inform the user that the script might take some time,\
    \ during which the user might start worrying if no output appears on the screen.\n\
    - Print a message informing the user about the size of the compressed backup.\n\
    \nSee *tar* or *Introduction to Linux*, chapter 9: \"Preparing your data\" for\
    \ background information.\n\n- Write a script `simple-useradd.sh` that adds a\
    \ local user to the system. This script should:\n- Take only one argument, or\
    \ else exit after printing usage.\n- Check `/etc/passwd` and decide on the first\
    \ free user ID. Print a message containing this ID.\n- Create a group for this\
    \ user, checking the `/etc/group` file. Print a message containing the group ID.\n\
    - Gather information from the user: a describing this user, from a list of shells\
    \ (for acceptability, exit printing a message), expiration date for this account,\
    \ extra groups of which the new user should be a member.\n- With the obtained\
    \ information, add a line to `/etc/passwd`, `/etc/group` and `/etc/shadow`; create\
    \ the user's home directory (with correct permissions!); add the user to the desired\
    \ secondary groups.\n- Set the password for this user to a default known string.\n\
    - Rewrite the script from Section 7.2.1.4 so that it reads input from the user\
