    ## 3.3.5. ANSI–C 引用


    形式为 "$STRING" 的单词会被特殊处理。该单词将展开为一个字符串，其中反斜杠转义的字符将按照 ANSI–C 标准进行替换。可以在 Bash 文档中找到转义字符序列。


    ## 3.3.6. 语言区域 (Locales)


    位于美元符号之前的双引号字符串将导致字符串根据当前的语言区域进行翻译。如果当前语言区域为 "C" 或 "POSIX"，则忽略美元符号。如果字符串被翻译并替换，则替换内容将带有双引号。


    ## 3.4. Shell 扩展


    ### 3.4.1. 通用


    在命令被拆分为标记（见第 1.4.1.1 节）后，这些标记或单词将进行扩展或解析。总共执行了八种扩展，我们将在后续章节中按照它们的扩展顺序进行讨论。


    在所有扩展之后，将执行引号去除。


    ### 3.4.2. 大括号扩展


    大括号扩展是一种生成任意字符串的机制。大括号扩展的模式形式为：一个可选的前缀（PREAMBLE），随后是一对大括号之间由逗号分隔的一系列字符串；前缀加在大括号内的每个字符串之前，然后将后缀（postscript）附加到每个生成的字符串之后，从左到右扩展。


    大括号扩展可以嵌套。每个扩展字符串的结果不排序；而是保留从左到右的顺序：


    ```

    franky -> echo sp(el,il,al)

    spell spill spill

    ```


    大括号扩展在其他扩展之前执行，任何对其他扩展特殊的特殊字符都将保留在结果中。它是严格纯文本的。Bash 不对扩展的上下文或大括号之间的文本应用任何语法解释。为了避免与参数扩展冲突，字符串
    "${" 不被认为符合大括号扩展的条件。


    格式正确的的大括号扩展必须包含未加引号的左括号和右括号，以及至少一个未加引号的逗号。任何格式不正确的大括号扩展将保持不变。


    ### 3.4.3. 波浪号扩展


    如果波浪号前缀是 "~+"，则变量 PWD 的值替换波浪号前缀。如果波浪号前缀是 "~-"，则替换变量 OLDPWD 的值，如果它未设置，则替换为空。


    如果波浪号前缀后的字符由数字 N 组成（可选 "+" 或 "-" 前缀），则波浪号前缀被替换为目录栈中相应的元素，其显示方式类似于将波浪号前缀中的波浪号作为参数调用
    `dirs` 内置命令。如果波浪号前缀（不带波浪号）由一个没有前导 "+" 或 "-" 的数字组成，则假设为该数字。


    如果登录名无效或波浪号扩展失败，则单词将保持不变。


    每个赋值操作都会检查紧跟在 ":" 或 "=" 之后的是否有未加引号的波浪号前缀。在这种情况下，也会执行波浪号扩展。因此，可以在对 PATH、MAILPATH
    和 PATH 赋值时带有波浪号的文件，shell 会分配扩展后的值。


    示例：


    ```

    franky -> export PATH=$PATH:~/testdir

    ~/testdir 将扩展为 $HOME/testdir，如果 $HOME=/var/home/franky，则目录 /var/home/franky/testdir
    将添加到 PATH 变量的内容中。

    ```


    ### 3.4.4. Shell 参数和变量扩展


    "$" 引入参数扩展、命令替换或算术扩展。要扩展的参数名或符号可以括在大括号中，这是可选的，但为了保护要扩展的变量不受其紧随其可能被解释为名称部分的字符的影响。


    使用大括号时，匹配的右括号是第一个未被反斜杠转义、不在双引号字符串内、且不在嵌入的算术扩展、命令替换或参数扩展内的 "}"。


    参数扩展的基本形式是 ${PARAMETER}。"PARAMETER" 的值将被替换。当 "PARAMETER" 是多位数字的位置参数，或者当 "PARAMETER"
    后面跟着一个不解释为其名称部分的字符时，则需要大括号。


    如果 "PARAMETER" 的第一个字符是感叹号，Bash 使用由 "PARAMETER" 部分形成的变量作为变量名；该变量将被扩展，并在后续替换中使用该值，而不是
    "PARAMETER" 本身的值。这被称为间接扩展。


    你显然熟悉直接参数扩展，因为它经常发生，即使在最简单的案例中也是如此，如下所示或：


    ```

    franky -> echo $SHELL

    /bin/bash

    ```


    以下是间接扩展的示例：


    ```

    franky -> echo ${!N*}

    NNPORT NNSERVER NPX_PLUGIN_PATH

    ```


    注意，这与 echo $N* 不同。

    以下构造允许在变量不存在时创建该命名变量：


    ```

    ${VAR:=value}

    ```


    示例：


    ```

    franky -> echo $FRANKY

    franky -> echo ${FRANKY:=Franky}

    Franky

    ```


    然而，特殊参数（包括位置参数等）不能分配此值。


    我们将在第 10 章进一步讨论使用大括号处理变量。更多信息也可以在 Bash 页面中找到。


    ### 3.4.5. 命令替换


    命令替换允许命令的输出替换命令本身。当命令如下所示被包裹时，会发生命令替换：


    ```

    $(command)

    ```


    或者使用反引号所示：


    ```

    `command`

    ```


    $(command) 允许嵌套。


    ```

    franky -> echo `date`

    Thu Feb 6

    ```


