- md: "\n# Chapter 9. Repetitive tasks\n\nUpon completion of this chapter, you will\
    \ be able to\n\n- Use for, while and until loops, and decide which loop fits which\
    \ occasion.\n- Use the break and continue Bash built-ins.\n- Write scripts using\
    \ the select statement.\n- Write scripts that take a variable number of arguments.\n\
    \n## 9.1. The for loop\n\n### 9.1.1. How does it work?\n\nThe for loop is the\
    \ first of the three shell looping constructs. This loop allows for specification\
    \ of a list of values. A list of commands is executed for each value in the list.\n\
    \nThe syntax for this loop is:\n\n`for NAME [in LIST]; do COMMANDS; done`\n\n\
    If [LIST] is not present, it is replaced with $@` and for executes the COMMANDS\
    \ once for each positional parameter that is set (see Section 3.2.5 and Section\
    \ 7.2.1.2).\n\nThe return status is the exit status of the last command that executes.\
    \ If no commands are executed or LIST does not expand to any items, the return\
    \ status is zero.\n\nNAME can be any variable name, although `i` is used very\
    \ often. LIST can be any list of words, strings or numbers, which can be literal\
    \ or generated by any command. The COMMANDS to execute can be any operating system\
    \ commands, script, program or shell statement. The first time through the loop,\
    \ NAME is set to the first item in LIST. The second time, its value is set to\
    \ the second item in the list, and so on. The loop terminates when NAME has taken\
    \ on each of the values from LIST and no items are left in LIST.\n\n### 9.1.2.\
    \ Examples\n\n#### 9.1.2.1. Using substitution for specifying LIST items\n\nThe\
    \ first is a command line example, demonstrating the use of a for loop that makes\
    \ a backup of each .xml file. After issuing the command, it is safe to start working\
    \ on your sources:\n\n```bash\n[carol@octopus~/articles] ls *.xml\nfile1.xml file2.xml\
    \ file3.xml\n[carol@octopus~/articles] ls *.xml > list\n[carol@octarine~/articles]\
    \ for i in `cat list`; do cp \"$i\".bak; done\n[carol@octopus~/articles] ls *.xml*\n\
    file1.xml file1.xml.bak file2.xml file2.xml.bak file3.xml file3.xml.bak\n```\n\
    \nThis one lists the files in /bin that are plain text files, and possibly scripts:\n\
    \n```bash\nfor i in `ls /sbin`; do file /bin/$i | grep ASCII; done\n```\n\n####\
    \ 9.1.2.2. Using the content of a variable to specify LIST items\n\nThe following\
    \ is a specific application script for converting HTML files, compliant with a\
    \ client scheme, to PHP files. The conversion is done by taking the first 25 and\
    \ the last 21 lines, replacing these with two PHP tags that provide header and\
    \ footer lines:\n\n```bash\n[carol@octopus] cat html2php.sh\n#!/bin/bash\n# specific\
    \ conversion script for my files to php\nLIST=\"*.html\"\nfor i in $LIST; do\n\
    NEWNAME=$(ls \"$i\" | sed -e 's/html/php/')\ncat beginfile=\"$NEWNAME\"\ncat \"\
    $i\" | sed -e '1,25d' | tac | sed -e '1,21d' | tac >> \"$NEWNAME\"\ncat endfile=\"\
    $NEWNAME\"\ndone\n```\n\nSince we don't have a count here, there is no way of\
    \ knowing the line number from which to start deleting lines until the end. The\
    \ problem is solved using tac, which reverses the lines in a file.\n\n## 9.2.\
    \ The while loop\n\n### 9.2.1. What is it?\n\nThe while construct allows for repetitive\
    \ execution of a list of commands, as long as the command controlling the while\
    \ loop executes successfully (exit status of zero). The syntax is:\n\n`while CONTROL-COMMAND;\
    \ do CONSEQUENT-COMMANDS; done`\n\nCONTROL-COMMAND can be any command(s) that\
    \ can exit with a success or failure status. The CONSEQUENT-COMMANDS can be any\
    \ program, script or shell construct.\n\nAs soon as the CONTROL-COMMAND fails,\
    \ the loop exits. In a script, a command following the done statement is executed.\n\
    \nThe return status is the exit status of the last CONSEQUENT-COMMANDS command,\
    \ or zero if none was executed.\n\n### 9.2.2. Examples\n\n#### 9.2.2.1. Simple\
    \ example using\n\nHere is an example for the impatient:\n\n```bash\n#!/bin/bash\n\
    # This script opens 4 terminal windows.\ni=0\nwhile [ $i -lt 4 ]\ndo\nxterterm\
    \ &\ni=$[$i+1]\ndone\n```\n\n#### 9.2.2.2. Nested loops\n\nThe example below written\
    \ to copy pictures that are made with a webcam to a web directory. Every five\
    \ minutes a picture is taken. Every hour, a new directory is created, holding\
    \ the images for that hour. Every day, a new directory is created containing 24\
    \ subdirectories. The script runs in the background.\n\n```bash\n#!/bin/bash\n\
    \n# This script copies files from my homirectory to the webserver directory.\n\
    # (use scr and SSH keys for a remote directory)\n# A new directory is created\
    \ every hour.\n\nPICSDIR=/home/carol/pics\nWEBDIR=/var/www/carol/webcam\n\nwhile\
    \ true; do\nDATE=date +%Y%m%d\nHOUR=date +%H\nmkdir \"$WEBDIR/$DATE\"\n\nwhile\
    \ [ $HOUR -ne \"00\" ]; do\n  DESTDIR=\"$WEBDIR/$DATE/$$HOUR\"\n  mkdir \"$DESTDIR\"\
    \n  mv $PICSDIR/*.jpg \"$DESTDIR/\"\n  sleep 3600\n  HOUR=date +%H\ndone\ndone\n\
    ```\n\nNote the use of the true statement. This means: continue execution until\
    \ we are forcibly interrupted (with kill Ctrl+C).\n\nThis small script can be\
    \ used for simulation testing; it generates files:\n\n```bash\n#!/bin/bash\n\n\
    # This generates a file every 5 minutes\n\nwhile true; do\ntouch pic-date +%s.jpg\n\
    sleep 300\ndone\n```\n\nNote the use of the command to generate all kinds of file\
    \ and directory names. See the man page for more.\n\n- Use the system\n\nThe previous\
    \ example is for the sake of demonstration. Regular checks can easily be achieved\
    \ using the system's cron facility. Do not forget to redirect output and errors\
    \ when using scripts that.\n\n#### 9.2.2.3. Using keyboard input to control the\
    \ loop\n\nThis script can be interrupted by user when q is entered:\n\n```bash\n\
    #!/bin/bash\n\n# Calculate the average of numbers\n\nSCORE=\"0\"\nAVERAGE=\"0\"\
    \nSUM=\"0\"\nNUM=\"0\"\n\nwhile true; do\necho -n \"Enter your score [0-100%]\
    \ ('q' for quit): \"\nread SCORE\nif [ \"$SCORE\" == \"q\" ]; then\nbreak\nfi\n\
    if [ \"$SCORE\" -lt \"0\" ] || [ \"$SCORE\" -gt \"100\" ]; then\n  echo \"Be serious,\
    \ try again\"\nelse\nSUM=$[$SUM + $SCORE]\nNUM=$[$NUM + 1]\nAVERAGE=$[$SUM / $NUM]\n\
    fi\ndone\necho \"Average rating: $AVERAGE%\"\n```\n\n#### 9.2.2.4. Calculating\
    \ an average\n\nThis script calculates the average of a series of numbers. If\
    \ not within range, a message is printed:\n\n```bash\n#!/bin/bash\n\n# This script\
    \ copies files from my homirectory to the webserver directory.\n# A new directory\
    \ is created every hour.\n# if the pics are taking up too much space, the oldest\
    \ are removed.\n\nPICSDIR=/home/carol/pics\nWEBDIR=/var/www/carol/webcam\n\nwhile\
    \ true; do\n  DISKUS=$(df -h $WEBDIR | grep -v File | awk '{print $5}' | cut -d\
    \ \"%\" -f1)\n  until [DISKUS -ne \"90\" ]; do\n    DATE=date +%Y%m%d\n    HOUR=date\
    \ +%H\n    mkdir $WEBDIR/$DATE\n    while [ $HOUR -ne \"00\" ]; do\n      DESTDIR=$WEBDIR/$DATE/\\\
    $HOUR\n      mkdir $DESTDIR\n      mv $PICSDIR/*.jpg \"$DESTDIR/\"\n      sleep\
    \ 3600\n      HOUR=date +%H\n    done\n  done\ndone\n```\n\n## 9.3. The until\
    \ loop\n\n### 9.3.1. What is it?\n\nThe until loop is very similar to the while\
    \ loop, except that the loop executes until the TEST-COMMAND executes successfully.\
    \ As long as this command fails, the loop continues. The syntax is the same as\
