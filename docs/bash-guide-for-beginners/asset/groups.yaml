    # 3.2.3. Exporting variables


    A variable like the ones in the example above is only available to the current
    shell. It is a local variable: child processes of the current shell will not be
    aware of this variable. In order to pass variables to a subshell, we need to export
    them using the export built-in command. Variables that are exported are referred
    to as environment variables. Setting and exporting is usually done in one step:


    ```

    export VARNAME="value"

    ```


    A subshell can change variables inherited from the parent, but the changes made
    by the child do not affect the parent. This is demonstrated in the example:


    ```

    frank -> full_name="Franky M. Singh"

    frank -> bash

    frank -> echo $full_name


    frank -> exit

    frank -> export full_name

    frank -> bash


    frank -> echo $full_name

    Franky M. Singh


    frank -> export full_name="Charles the Great"


    frank -> echo $full_name

    Charles the Great


    frank -> exit

    frank -> echo $full_name

    Franky M. Singh


    frank ->

    ```


    When first trying to read the value of full_name in a subshell, it is not there
    (echo shows a null string). The subshell quits, and full_name is exported in the
    parent - a variable can be exported after it has been assigned a value. Then a
    new subshell is started, in which the variable exported from the parent is visible.
    The variable is changed to hold another name, but the value for this variable
    in the parent stays the same.'
