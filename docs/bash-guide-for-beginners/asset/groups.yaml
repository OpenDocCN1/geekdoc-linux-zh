    # # Chapter 12. Catching signals


    In this chapter, we will discuss the following subjects:


    +   * Available signals

    * Use of the signals

    * Use of the trap statement

    * How to prevent users from interrupting your programs


    # ## 12.1. Signals


    # ### 12.1.1. Introduction


    # #### 12.1.1.1. Finding the signal page


    Your system contains a man signal page listing all the available signals, depending
    on your operating system, it might be opened in a different way. On most Linux
    systems, this will be man 7 signal. When in doubt, locate the exact man page and
    section using commands like


    ```

    man -k signal grep list

    ```


    or


    ```

    apropos signal grep list

    ```


    Signal names can be found using kill -l.


    # ### 12.1.1.2. Signals to your Bash shell


    In the absence of any traps, an interactive Bash shell ignores SIGTERM and SIGQUIT.
    SIGINT is caught and handled, and if job control is active, SIGTTIN, SIGTOU and
    SIGTSTP are also ignored. Commands that run as the result of a command substitution
    ignore these signals, when keyboard generated.


    SIGHUP by default exits a shell. An interactive shell will send a SIGHUP to all
    jobs, running or stopped; see the documentation on the disown built-in if you
    want to disable this default behavior for a particular process. Use the huponexit
    option for killing all jobs upon receiving a SIGHUP signal, using the shift built-in.


    # ### 12.1.1.3. Sending signals using the shell


    Table 12-1. Control signals in Bash

    | Standard key combination | Meaning |

    | Ctrl+C | The interrupt signal, sends SIGINT to the job running in the foreground.
    |'
- md: "\n# Bash Guide for Beginners\n\n| | |\n|---|---|\n| Ctrl+Y | The delayed suspend\
    \ character. Causes a running process to be stopped when it attempts to read input\
    \ from the terminal. Control is returned to the shell, the user can foreground,\
    \ background or kill the process. Delayed suspend is only available on operating\
    \ systems supporting this feature. The suspend signal, sends a SIGTSTP to a running\
    \ program, stopping it and returning control to the shell. |\n\n# Terminal settings\n\
    \nCheck your stty settings. Suspend and resume of output is usually disabled if\
    \ you are using \"modern\" terminals. The standard xterm supports Ctrl+S and Ctrl+Q\
    \ by default.\n\n## 1.12.2. Usage of signals for kill\n\nModern shells, Bash included,\
    \ have a built-in kill function. In Bash, both signal names and numbers are accepted\
    \ as options, and arguments may be or process IDs. An exit status can be reported\
    \ using the -1 option: when at least one signal was successfully sent, non-zero\
