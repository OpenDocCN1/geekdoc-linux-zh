    Chapter 9. Repetitive tasks\n\n# Bash Guide for Beginners\n\nFiles are compressed\
    \ before they are moved into the archive directory.\n\n## 9.5. Break and continue\n\
    \n### 9.5.1. The break built-in\n\nThe break statement is used to exit the current\
    \ loop before its normal ending. This is done when you don't know in advance how\
    \ many times the loop will have to execute, for instance it is dependent on user\
    \ input.\n\nThe example below demonstrates a while loop that can be interrupted.\
    \ This is a slightly improved version of the wisdom.sh script from Section 9.2.2.3.\n\
    \n```bash\n#!/bin/bash\n\n# This script provides wisdom\n# You can now exit in\
    \ a decent way.\n\nFORTUNE=$usr/games/fortune\n\nwhile true;\necho \"On which\
