    \ might enable extra options, such as the ability to kill processes from other\
    \ than your user ID and identifying processes by name, with pgrep and pkill.\n\
    \nBoth kill commands send the TERM signal if none is given.\n\nThis is a list\
    \ of the most common signals:\n\n| Table 12–2. Common kill signals |\n| Signal\
    \ name | Signal value | Effect |\n|---|---|---|\n| SIGHUP | 1 | Hangup |\n| SIGINT\
    \ | 2 | Interrupt from keyboard |\n| SIGKILL | 9 | Kill signal |\n| SIGTERM |\
    \ 15 | Termination signal |\n| SIGSTOP | 17,19 | Stop the process |\n\n## SIGKILL\
    \ and SIGSTOP\n\nSIGKILL and SIGSTOP cannot be caught, blocked or ignored.\nWhen\
    \ killing a process or series of processes, it is common to start trying with\
    \ the least dangerous process, SIGTERM. That way, programs that can afford an\
    \ orderly shutdown get the chance to follow the procedures that they have designed\
    \ to execute when using the TERM signal, such as cleaning up and opening files.\
    \ If you send a SIGKILL to a process, you remove any chance for the process to\
