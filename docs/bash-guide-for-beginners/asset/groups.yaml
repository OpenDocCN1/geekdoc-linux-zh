    franky ->nBash always reads at least one complete line of input before executing
    any of the commands on that line. Aliases are expanded when a command is read,
    not when it is executed. Therefore, alias definition appearing on the same line
    as another command not take effect until the next line of input is read. The commands
    following the alias definition on that line are not affected by the new alias.
    This behavior is also an issue when functions are executed. Aliases are expanded
    when a function definition is read, not when the function is executed, because
    a function definition is itself a compound command. As a consequence, aliases
    defined in a function are not available until function is executed. To be safe,
    always put alias definitions on a separate line, and not use alias in compound
    commands.


    Aliases are not inherited by child processes. Bourne shell (sh) does not recognize
    aliases.


    More functions is in Chapter 11.


    # Functions are faster


    Aliases are looked up after functions and resolving is slower. While aliases are
    easier to understand, shell functions are preferred for almost every purpose.


    # 3.6. More Bash options


    # 3.6.1. Displaying options


    We already discussed a couple of Bash options that are useful for debugging your
    scripts. In this section, we will make a in-depth view of the Bash options.


    Use the -o option to set to display all shell options:


    ```

    willy->> set -o

    allexport       off

    braceexpand     on

    emacs          on

    erit           off

    hashail         on

    histexpand      on

    history         on

    ignoreof        off

    interactive-comments off

    keyword         off

    monitor          on

    noclobber       on

    noexec          off

    glob            off

    nolog          off

    notify          off

    nounset         off

    onecmd         off

    physical        off

    posix           off

    privileged      off

    verbose         off

    vi              off

    ```


