    This is the most common way to execute a script. It is preferred to execute the
    script like this in a subshell. That shell variables and aliases are only known
    to the particular bash session of that subshell. When shell exits and the parent
    regain control, everything is cleaned up and all changes to the state of the shell
    are bash, for gotten.


    If you did not put the scripts directory in your PATH, and (the current directory)
    is not in the PATH, either you can activate the script like:


    ```

    /script_name.sh

    ```


    A script can also be explicitly by a given shell, but generally we only do this
    if we want to obtain special behavior, such as checking if the script works without
    another shell or printing traces for debugging:


    ```

    bash script_name.sh

    ```


    ```

    sh script_name.sh

    ```


    ```

    bash -x script_name.sh

    ```


    The specified shell will start as a subshell of your current shell and execute
    the script. This is done when you want the script to start up with specific options
    or under conditions which are not specified in the script.


    If you don''t want to start a new shell but execute the script in the current
    shell, you source it:


    ```

    source script_name.sh

    ```


