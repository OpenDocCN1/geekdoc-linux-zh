    **Standalone Installation**


    Before beginning a standalone Kali Linux installation, it is important to


    understand that the procedure will *overwrite all existing data on the host*


    *drive*. This includes the previously existing OS, if any, as well as any other


    files or software.


    The steps for a standalone installation are as follows:


    1) Ensure minimum hardware and chip architecture


    Check that your host machine meets the minimum hardware requirements for


    Kali (currently 10 GB storage and 512 MB RAM) and that it can support a 64


    bit installation (if not, use the 32 bit version).


    2) Back up any files on the host hard drive


    Since the installation will overwrite any existing data on the host hard drive,


    transfer or back up any needed files or settings (i.e. to a cloud drive, flash


    drive, CD, DVD, or external HDD).


    3) Ensure proper boot order


    Restart your host machine and enter the BIOS menu. The boot order can be


    changed to another setting, if desired, after installation. Be sure to save BIOS


    settings upon exiting the BIOS menu.


    4) Load the ISO


    After altering the BIOS, completely shut down the host machine, insert the


    optical or USB medium that contains the ISO, then power the computer back


    on. It may take a few moments for the Kali boot menu to appear.


    5) Follow the installation instructions


    When the Kali boot menu appears, select the *Graphical Install* option.'
