    \nchapter will focus on the hardware and virtual installation procedures.\n\n\
    **Installing Kali Linux On A Hard Drive**\n\nThe latest versions of Kali Linux\
    \ have the following minimum requirements\n\nfor a host machine:\n\n1) 10 GB Hard\
