    \ code. \n\nBrute Force Attack\n\nIf you have ever wondered why you have a limited\
    \ number chances to enter\n\nyour password before being denied access, the server\
    \ you are attempting to\n\naccess has a safeguard against brute force attack.\
    \ Brute force attack involves\n\nsoftware that attempts to recreate the password\
    \ by scanning through a\n\ndictionary or random word generator in an extremely\
    \ short amount of time to\n\nhit on the password and gain access. For this reason,\
    \ passwords have\n\nadvanced to become far longer and more complex than they once\
    \ were in the\n\npast, such as including characters, numbers, upper and lower-case\
    \ letters and\n\nsome going as far as barring words that are found in the dictionary.\
    \ \n\nWaterhole Attacks\n\nWaterhole attacks are known by this name due to the\
    \ fact hackers prey on\n\nphysical locations where a high number of people will\
