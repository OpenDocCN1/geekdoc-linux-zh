  md: '**Chapter 7** **Network Scanning**


    The information gathering phase is over and it allowed us to collect, among


    other things, a list of IP addresses.


    Now it''s time to scan each of these IP addresses. What exactly do I mean with


    “scanning”? Each of these IP addresses will expose a certain service/port to


    the outside world.


    We need to scan them to identify the port corresponding to a certain active


    service.


    For example, a Web server will most likely have port 80 or 443 listening, so


    as to accept requests based on the *HTTP, HTTPS* protocol.


    There are several scanning techniques we can choose. Some of them are


    silent, others not that much. In this chapter, we will analyze some of them.


    **Kfsensor**


    To see the network scanning techniques in action, we need to expose services


    on a specific machine, or we can use a very useful tool that make these steps


    easier. It''s called KFSensor and it''s a "**honeypot**".


    Honeypots are deliberately vulnerable machines, which are sometimes used


    to confuse a potential attacker. We usually use them to push our opponent


    towards this trap so that we can study and analyze their behavior.


    KFSensor is a honeypot for Windows operating systems. For this reason, you


    will need to install the software on a Windows 7 or 10 virtual machine.


    You can download its 30-days free trial version from the official website:


    http://www.keyfocus.net/kfsensor/.


    Once installed KFSensor, you can proceed with a configuration of the


    services we need. These services will then be then simulated by the software'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'as if they were real.


    Here we can see the list of all the simulated services on the machine. This list


    will allow us to test the various network scanning techniques.


    **Wireshark**


    Before starting, I suggest you install a network "**sniffer**", which is a tool
    that


    allows you to collect and analyze all network traffic. The best among the


    sniffers is undoubtedly *Wireshark* (https://www.wireshark.org/).


    While we will launch the various network scans, you can still leave


    Wireshark running, so as to observe what happens at the level of network


    traffic.


    **Arping And Level 2 Network Scan**


    The first thing we should mention is that the network can be scanned both at


    the data link layer and at the network layer of the ISO/OSI model.


    We will start from the one at the data link layer. Let me start by introducing


    the first tool we will use: **ARPING**.


    Scanning at the *data link layer (level 2) *makes sense only if carried out


    within a local area network (LAN). In local networks, we will mostly be


    dealing with MAC addresses and the ARP protocol.


    Now let''s connect to the Kali Linux machine and run a data link layer scan


    (called ARP scan) in the Windows machine where KFSensor is installed.


    We need to enter this command: "*arping address IP -c 2*". Where 2 is the


    number of packages we will send, but you can enter even type any other


    number you want.


    If the machine is active and connected to the network, this is the screen you


    should see:'
