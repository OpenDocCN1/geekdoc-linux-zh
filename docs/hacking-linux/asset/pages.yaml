  md: "Keyloggers may also find themselves used in white hat purposes such as\n\n\
    within organizations to ensure that employees are following the correct\n\npolicies\
    \ and procedures and not engaging in deceptive conduct. \n\nDenial of Service\
    \ (DoS/DDoS)\n\nThis involves causing a website to become unusable. The site is\
    \ taken down\n\ndue to the flooding of information and traffic, enough to overload\
    \ the system\n\nas it struggles to process all the requests and is ultimately\
    \ overwhelmed and\n\ncrashes. These attacks are employed by hackers who aim to\
    \ disrupt websites\n\nor servers that they want to cause destruction to for whatever\
    \ their reason or\n\nmotivation was. For example, a hacktivist hacker might take\
    \ down a website\n\nthat disagrees with their political views seeing it as their\
    \ moral duty. Whereas\n\na black hat hacker might take down the website of a competing\
    \ organization\n\nto disrupt their services and sabotage the efforts of their\
    \ competitor. \n\nA DoS attack is carried out using tools such as botnets or a\
    \ network of\n\ninfected systems which are then used almost as an army of zombified\
    \ servers\n\nto repeatedly attack the target service, overloading it. These infected\
    \ systems\n\nare created through emails and software which carry a virus and once\n\
    \ninfected, these zombie computers are able to be used at will by the hackers.\
    \ It\n\nhas been revealed through industry data that up to 45% of organizations\n\
    \nsuffer from DDoS attacks resulting in millions of dollars worth of damage\n\n\
    each year. \n\nVulnerability Scanner\n\nTo detect weaknesses within a computer\
    \ network, hackers use a tool known\n\nas vulnerability scanner. This could also\
    \ refer to port scanners which are used\n\nto scan a specific computer for available\
    \ access points that the hacker would\n\nbe able to take advantage of. The port\
    \ scanner is also able to determine what\n\nprograms or processes are running\
    \ on that particular port which allows"
