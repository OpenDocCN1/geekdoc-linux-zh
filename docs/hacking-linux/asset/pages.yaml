- img_proc: true
  md: 'To do this, it uses a series of additional information within the network


    packet, and we are interested in the so-called "**TCP flags**". There are six
    of


    them:


    SYN.


    ACK.


    RST.


    FIN.


    PSH.


    URG.


    SYN and ACK are the most important TPC flags, because they take part in


    the "**Three-way handshake**". This procedure allows the TCP protocol to


    establish a communication.


    The presence of the **RST flag** shows that we need to reset the connection.


    This may be due to connection errors and the FIN flag indicates there are no


    other data that the sender should receive.


    **The Three-Way Handshake**


    This connection creation process is based exclusively on the SYN and ACK


    flags.


    Let’s suppose we have two machines:


    PC A that wants to establish the connection.


    PC B that is waiting for the connection to be established.


    The exchange takes place as follows:


    PC A sets the SYN flag of the packet and sends it to PC B.


    Once PC B receives it, it sets the SYN and ACK flags of the packet that will'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'be sent to PC A.


    When PC A receives the SYN-ACK, it sends a packet with the ACK flag to


    PC B.


    If everything went well, the connection should have been established


    correctly.


    The three-way handshake is an exchange of packets between two entities that


    use *TCP flags (SYN and ACK)* to organize their communication.


    We can find all the information we need on Wireshark, as you can see from


    the screenshot here below:


    The packet number 25 has the SYN flag active, the 26 one is a copy with


    SYN and ACK, the 27 one with ACK starts the communication.


    Here is a screenshot of the first packet, where the SYN flag is set to 1. This


    means that it is active:


    **Creation Of Customized Network Packages**


    There are several software options that allow the creation and modification of


    packets that travel within a network (*packet crafting*).


    The "**Colasof Packet Builder**" gives us the possibility to choose the type of


    packet to create or modify.


    After choosing the type, for example TCP, let''s start by creating a packet:


    **Level 4 Network Scan - Connect Scan**


    Now we will learn together the simplest technique to perform a level 4 scan:


    the **CONNECT SCAN**. This type of scan establishes the TCP connection.


    In other words, it completes the three-way handshake, making the scan very


    noisy and easily identifiable.


    I would recommend using KFSensor, Wireshark and Nmap to perform this'
