  md: '**Chapter 8** **Post Exploitation**


    The last step of a good penetration test involves access maintenance from a


    remote system. In other words, it’s important to leave a backdoor to the


    target’s system in case you may want to exploit it again in the future. Keep in


    mind that post exploitation is something that companies want to forbid even


    their hired penetration testers from performing. A lot of people are afraid that


    these backdoors might be found by someone with malicious intent, so always


    make sure you have the authorization from the client to proceed with this


    step.


    Many organizations want a report to know whether post exploitation is


    possible and what risks come with it. They know that nowadays many black


    hat hackers are interested in maintaining the connection and absorbing as


    much confidential data as possible. The days of hacking through a system


    quickly and taking everything in minutes are over. This change in behavior


    makes it critical for you to understand how malicious hackers operate when


    creating a backdoor.


    But what exactly is a backdoor when it comes to hacking? It is a script or an


    application that the attacker leaves on the target’s computer. This tool will


    run in the background unnoticed and will allow the hacker to connect to the


    machine whenever they want. Keep in mind that a backdoor will only be


    useful as long it’s actively running. In many cases you can lose the access


    (the shell) when the computer is rebooted. However, not all is lost, because


    you can move your shell to a permanent location, and this is done with the


    help of backdoors.


    In this chapter we will discuss creating and maintaining a backdoor that


    allows us to reconnect to the target’s machine at any time. We will also


    discuss rootkits, which are tools that can perform various tasks stealthily.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '**Using Netcat**


    This is a basic tool that is used to maintain communication between one


    computer and another. It can be used as backdoor software, but there are


    other functionalities to it. You can use Netcat to perform port scans, transfer


    files, and much more. For the purpose of this chapter, we are going to cover


    the basics to get you started.


    Netcat can operate in two distinct modes. One is the client mode, which


    allows you to make a network connection, and the other one is server mode,


    which accepts any incoming connection. Let’s see a basic example of using


    Netcat. You are going to need two machines for this. We will start by setting


    it up to function as a communication channel between two computers. For


    this to work you need to run it in server mode and connect to any port. For


    the sake of this example, we will assume our target device is running Linux.


    Type the following command:


    nc -l -p 1337


    Let’s break it down to understand what this command does. We begin by


    starting the Netcat tool with the “nc” command. Then we use “-l” (this is an


    L, not 1) to enable listener mode, also known as server mode. Now the


    program will wait for a connection to port 1337. Now let’s switch to our


    attack computer and type the following command to create the connection


    with the listener:


    nc 192.142.42.121 1337


    This will make Netcat connect to port 1337 on the device with the IP address


    192.142.42.121. The two machines should now be connected and able to


    communicate with each other. But how do we know this worked? Use any of


    the two computers, open the terminal, and type something. Whatever you


    type on one machine will be displayed on the other as well. To kill the'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'connection, just press CTRL + C. While this basic use of Netcat is


    interesting, you will probably never use it as a chat system, so let’s see how


    we can use it to transfer files instead.


    We can transfer files between two computers with the help of Netcat, but we


    don’t want to exploit the target more than once. The purpose of this action is


    to exploit the system and then leave a backdoor to use later. So how do you to


    send a file from your computer to the target? As long as Netcat is still


    running on the second computer, type:


    nc -l -p 6666 > virus.exe


    We use this line to tell the target computer to listen on port 6666. Anything


    that will be received through that port will be stored in a file called


    “virus.exe”. Now switch to your attack machine and specify which file you


    want to send. You can send any file type you want, as you are not limited by


    extension. If you’re running Linux, you might not have an .exe file, so send


    something else. Here’s how the command should look:


    nc 192.142.42.121 6666 > virus.exe


    You can switch to your target computer and use the “ls” command to list the


    new file it received.


    You can use Netcat to form a connection with the target and then connect to


    the unknown port. You can then send some information simply by typing


    something. The target will respond, and based on the way it responds you can


    determine the service run by the port.


    Next, we can use Netcat to interact with a process over a remote connection.


    This way, you can manipulate the process as if you are sitting in front of the


    target computer. All of this can be done with the “-e” switch which is used to


    run any program that we specify.'
