  md: '**Chapter 1** **Building A Hacking Environment**


    In order to begin wireless hacking, one must first set up a proper environment


    for their tools, beginning, of course, with the installation of Kali Linux. There


    are three chief categories for installation of Kali Linux, depending on the


    needs and hardware of the user:


    1) Hardware installation


    Standalone


    Dual/Multi-boot


    2) Virtual installation


    3) External media installation


    Each type of installation has its own pros and cons, and the best choice


    depends mostly on the intended use of the software. Kali was not written to


    be an “everyday” consumer product with the typical software enjoyed by


    casual users, so installing it as a standalone OS on a personal computer is


    only practical if that particular machine will be dedicated to penetration


    testing activities. Alternatively, Kali can reside on the hard drive in a dual-


    boot or multi-boot scenario with other OS installations if space permits.


    Often, Kali Linux is installed within virtualization software inside of another


    OS, be it Linux or otherwise. This arrangement consumes more resources,


    but affords the hacker some more flexibility and allows him to practice


    attacks on other virtual machines within the host. Kali can also be used as a


    bootable “live” OS when installed on an removable external medium such as


    a CD-ROM or USB flash drive. Since optical disk readers are becoming


    exceedingly less common, a USB medium is more practical for external


    installations. An advantage of a live distribution is that it can be used on


    multiple machines and some of the digital forensic tools included with Kali'
  merge: -1
