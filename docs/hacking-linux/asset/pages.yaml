    **Level 4 Network Scan - Udp Scan**


    The previous scans are related to the **TCP protocol**. However, even the UDP


    protocol can provide interesting results, because it is often underestimated


    and not adequately protected by network administrators.


    Keep in mind that the UDP protocol is connectionless and therefore behaves


    differently from TCP.


    In particular, if a scan is launched on a certain port and we receive no


    response, then we can assume that the port is open.


    Otherwise, we will receive an ICMP error message which, in short, means


