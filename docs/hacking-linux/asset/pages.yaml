  md: '*192.168.1.100-150* is the range of IP addresses we want to test. We could
    be


    dealing with a single address or a subnet.


    We can always keep the situation under control with **Nmap** and check what


    happens:


    As I have already pointed out, this type of level 2 scan only makes sense in


    local contexts where you communicate with MAC addresses.


    Outside the LAN, we only use IP addresses and therefore the network scan is


    set at a higher level, i.e. the network layer "layer 3 scan".


    **Useful Findings For Level 3 Network Scans**


    It would be better to use the IP address and not the hostname so as not to


    have to perform a DNS query and possibly alter the results obtained. We


    obviously need to set some limits.


    When dealing with a Web server that hosts multiple websites, it makes sense


    to use the hostname and DNS resolution.


    With large networks, it might take longer to complete a scan. For this reason,


    it is advisable to use a small network sample or dwell only on a small range


    of doors.


    **Ping Scan With Nmap**


    We will now move to the simplest type of level 3 scan. For doing so, we will


    use a particular protocol called ICMP (Internet Control Message Protocol),


    which implies that we are not using either the TCP or UDP protocol.


    The **ICMP** performs various control functions, including the verification of


    reachability of a certain host within a network.


    To do this, we use the PING command specifying with the "-c" option the


    number of ICMP packets we want to send to the target machine or network.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Below we can see that the target machine has responded to our command and


    is therefore active in the network.


    Don''t forget to check the network traffic with Wireshark. You should also use


    the "icmp" filter.


    Wireshark clearly shows us that we are using the ICMP protocol and that


    packet exchange is happening as follows:


    Echo request. The attacking host sent the ICMP packet to the target machine.


    Echo reply. The target machine sent the response packet to the attacking


    machine.


    **Tcp And Udp Protocol**


    We will now examine the layer 4 one at the transport layer.


    The transport layer is mainly composed of 2 protocols: **TCP and UDP**.


    The main difference between these two protocols is that TCP is a connection-


    oriented protocol, while UDP has no connection.


    Basically, when we need to use TCP, we have to do it by creating a


    connection between the two parts.


    They both should want and be able to communicate with each other,


    otherwise there will be no exchange of information.


    From this, we can easily deduce that TCP is a reliable protocol that, besides


    rare and manageable exceptions, offers us the receipt of the information sent.


    On the contrary, with UDP we have no certainty. On the other hand, UDP is a


    very fast protocol, while TCP is less efficient due to all the additional checks


    it has to perform.


    Let''s look at which fields make up a TCP and a UDP packet.


    **Tcp Control Flags**'
  merge: -1
