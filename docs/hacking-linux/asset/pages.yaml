    \ of course, for software updates and for connectivity in\n\npenetration testing\
    \ efforts.\n\nWhether installing Kali Linux as a standalone OS or in a multi-boot\
    \ scheme,\n\nthe first step in installation is to obtain the latest ISO (International\
    \ Standards\n\nOrganization compliant disk image) from Offensive Security and\
    \ copy it to\n\nan external medium. A list of the latest releases can be found\
    \ at \n\nwww.kali.org/downloads/\n\nIt is recommended that ISO images be obtained\
    \ from the developer, and not\n\nfrom a third party or file-sharing source, to\
    \ ensure the integrity of the code.\n\nThe ISO is available in 32 bit and 64 bit\
    \ versions depending on the processor\n\narchitecture of the host machine. Note\
    \ that the 64 bit version will not run on a\n\n32 bit processor. You can download\
    \ the ISO directly from the corresponding\n\nlink or through the torrent link\
    \ if you have torrent client. An *SHA1Sum* hash\n\nis given for each ISO file.\
    \ Once the file has been downloaded, its hash can be\n\nread using *checksum*\
    \ software and compared to the given string. If the strings\n\ndo not precisely\
    \ match, then the file is compromised and should not be used.\n\nThis checksum\
    \ procedure guards against corrupted downloads or ones that"
