  md: '**Description**


    After understanding the intrusion methods commonly used by hackers, it is


    not realistic to plan separate protection strategies for these methods.


    Therefore, users can only master the common protection strategies of


    personal computer security to ensure that the computer is in a relatively safe


    environment. Common PC protection strategies include: installing and


    upgrading anti-virus software, enabling firewalls, preventing Trojans and


    viruses, sharing folders and regularly backing up important data.


    The emergence of viruses has caused huge losses to computers on the


    Internet. These viruses can cause the system to fail to operate normally, and


    the system will be formatted and data will be formatted. In order to prevent


    the harm caused by these viruses, users need to install anti-virus software on


    the computer and turn on real-time monitoring. In addition, due to the


    improvement of virus production techniques and means, new viruses are


    constantly appearing, so users need to upgrade anti-virus software in time, so


    that anti-virus software can prevent new viruses in the Internet.


    A firewall is a method of separating a computer''s internal network from an


    external network. In fact, this is an isolation technique. A firewall is an access


    control scale that is executed when two internal and external networks


    communicate. It allows users'' licensed computers and specific data to enter


    the internal network, preventing hackers on the external network from


    accessing and attacking themselves to the maximum extent.


    In order to prevent Trojans and viruses from invading the Internet, first of all,


    do not download unidentified software and programs, select a reputable


    download site to download the program, and then put the successfully


    downloaded software and programs in addition to the system partition. Other'
