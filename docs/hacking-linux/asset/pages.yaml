    and it is recommended that the host machine have at least 1 GB of RAM.


    Additionally, the host machine should have enough free hard drive space to


    accommodate any virtual machine OS’s you intend to install.


    2\. Enable hardware virtualization


    If you are using a Windows or Linux host computer, restart your and enter


    the BIOS menu. Navigate to the virtualization option (the menus will vary


    from computer to computer) and ensure that its enabled. Be sure to save


    BIOS settings upon exiting the BIOS menu.


    Macintosh hardware does not use BIOS in the same manner as “PC”


    computers. Hardware virtualization, if not already enabled, must be set via


    command line in the terminal application. This is an advanced procedure


    requiring root access, and the command syntax may vary between Mac OS


    versions. Consult your documentation or manufacturer for enabling


    virtualization on Macintosh hardware.


