  md: '**Chapter 12** **How Reverse Engineering Works**


    When it comes to reverse engineering, it is a great concept to understand.


    First of all, we need to understand what it is you''re trying to accomplish when


    you thinking about reverse engineering. It should be a step by step plan. In a


    nutshell, you''re trying to discover how the attack is completed, who is


    responsible for the attack, as well as where did it originate, and now that we


    know that we''ve been attacked, what was affected, and we can do that


    through numerous tasks or methods. We can decompose code by using


    debuggers or decompiles, but one of the best ways is using sandbox.


    When we talk about sandbox, that''s just an environment designed to run


    untrusted or exploitable code in a way that prevents the code from damaging


    the rest of the system, and we wouldn''t limit ourselves just to apps


    themselves, but we''d also include looking at the code in a legitimate software.


    To perform reverse engineering on a malware, it does require you to do


    things like disconnect the host that''s infected, so it''s physically isolated
    from


    the network, and this particular device or this particular host could only be


    used to analyze malware. Virtualization has benefited us plenty, by the way


    you can also do that in a VM, but you have to be cautious because you''ve got


    to keep up the host itself that''s hosting the VMs. There are multiple


    vulnerabilities for hypervisors that can be exploited by the malware. When it


    comes to hardware, there''s a couple of things that we can do. Most of the time


    we have to depend on certain products or websites that are not configured


    correctly, and companies can only gain a limited amount of knowledge or


    assurance around the security of that particular product. Essentially, we have


    to take the publisher''s statement that the things that they are doing or the


    software they''re providing is secure, and this typically gets published OEM


    documentation (Original Equipment Manufacturer) or product white papers.'
