  md: "**Chapter 6** **Penetration Testing Process**\n\nPenetration testing is made\
    \ up of a rich combination of security assessment\n\ntechniques that consider\
    \ diverse issues in computer’s security system in order\n\nto give a solution.\
    \ These techniques form the important steps followed during\n\npenetration testing.\
    \ The following are steps to follow during a penetration\n\ntesting exercise:\n\
    \n1)Planning & Preparation\n\nPlanning and preparation is the initial step of\
    \ penetration testing. This is\n\nwhere you are required to carry out all the\
    \ preliminary activities related to\n\npenetration testing. First, you need to\
    \ define your goals for penetration\n\ntesting. Some of the most common goals\
    \ for penetration testing include: \n\nTo increase the security of an organization’s\
    \ computer\n\ninfrastructure \n\nTo identify major vulnerabilities in the computer’s\
    \ security system\n\nand beef up the security mechanisms\n\nTo have the Computer\
    \ system’s security meet the standards of a\n\ngiven regulatory body\n\nIn addition\
    \ to defining the goals for the penetration testing, you also need to\n\nsettle\
    \ on the nature and scope of the testing. You may want a shallow test to\n\nsatisfy\
    \ an external body that your computer systems are safe or you may go\n\nfor a\
    \ wider scope covering large areas to ensure that your computers are well\n\n\
    protected. Here you make the decision based on your goals. \n\nYou also need to\
    \ hire a qualified penetration tester to do the job for you. This\n\nis an important\
    \ step as it will help you get the testing done by a professional\n\nwho does\
    \ not have any bias. In addition to hiring a professional, you may\n\nwant to\
    \ prepare the system for the testing. You can do this by backing up"
  merge: -1
  pgno: 49
- img_proc: true
  md: "your data so that you don’t lose any vital data during the process. \n\n2)Reconnaissance\n\
    \nReconnaissance involves carrying out an analysis of all the preliminary\n\n\
    information about the computer systems to be tested so as to decide on the\n\n\
    approach to be followed. If the tester is a black hat tester then chances that\
    \ he\n\nor she has very little information concerning the systems, let’s say only\
    \ an IP\n\naddress to start with. What follows is that the tester may opt to gather\n\
    \nadditional information from the internet so as to study this information and\n\
    \nuse it to carry out the testing. For white hat testing, the tester gets sufficient\n\
    \ninformation about the computer system from the owners and he/she has to\n\n\
    study this information so as to make an informed decision when conducting\n\n\
    the other stages of penetration testing.\n\nAt a passive penetration testing stage,\
    \ the main objective of reconnaissance is\n\nto obtain a clear picture of the\
    \ computer system being tested. Sometimes the\n\ntester may request more information\
    \ from the client, so as to be able to have a\n\ndetailed description of the system\
    \ under testing. \n\n3)Discovery\n\nThis is a very important step in the penetration\
    \ testing process. Once the\n\npenetration tester has a clear picture of the computer\
    \ system to be tested, the\n\ntester now uses automated tools to scan the targeted\
    \ systems so as to discover\n\nvulnerabilities within the system. Usually, automated\
    \ tools used for this job\n\nhave a special database that helps them monitor and\
    \ test for details of the\n\nlatest risks and vulnerabilities in the system. In\
    \ many cases, the penetration\n\ntester will seek to discover:\n\nNetwork discovery\n\
    \nThis is the discovery of additional networks such as servers, computing\n\n\
    devices and computer systems connected to the targeted system."
  merge: -1
  pgno: 50
- img_proc: true
  md: "Host Discovery\n\nThis discovery assesses a computer system and seeks to discover\
    \ open ports\n\nand gateways on the system devices.\n\nServer Interrogation\n\n\
    Here the automated tools interrogate the open ports to find out the exact\n\n\
    services running on those ports. \n\n4)Analyzing Information and Risks\n\nOnce\
    \ the tester has gathered sufficient information about the system using the\n\n\
    automated system, the tester now needs to analyze the gathered information. \n\
    \nBecause some computer systems may be large and may have an extensive\n\ninfrastructure,\
    \ this step may consume a lot of time. This is also where the\n\npenetration tester\
    \ identifies the real vulnerabilities in the system. It is,\n\ntherefore, important\
    \ that this step is done with a lot of care so as to identify\n\nall vulnerability\
    \ and the potential threats to the computer system.\n\nWhen analyzing the information\
    \ and risks, it is important for one to consider\n\nthe defined goal of the penetration\
    \ exercise, the estimated time for the\n\npenetration testing job and the potential\
    \ risks the system is being exposed to.\n\nThese are important elements that will\
    \ ensure that the analysis is done in the\n\nright manner and the tester can pinpoint\
    \ all the major vulnerabilities in the\n\nsystem.\n\n5)Active Intrusion Attempts\n\
    \nThis is the most important step and needs to be performed with care. This\n\n\
    step explores the extent to which each of the vulnerabilities identified during\n\
    \nthe discovery possesses an actual risk to the computer system. This step\n\n\
    should not be rushed through as it poses a threat to the computer system. In\n\
    \nfact, it should be considered only when a verification for the potentials\n\n\
    vulnerabilities is required. For the systems that require very high integrity"
  merge: -1
  pgno: 51
- img_proc: true
  md: "standards to be met, the potential risk and vulnerability has to be carefully\n\
    \nanalyzed before proceeding with this critical cleanup process. \n\n6)Final Analysis\n\
    \nThis is the final step and therefore serves as a reflection of all the steps\n\
    \nalready conducted. Here the penetration tester has to review all the\n\nvulnerabilities\
    \ and potential risks discovered with his or her magnitude and\n\npotential attack\
    \ vectors. Using this information, the penetration tester is\n\nrequired to formulate\
    \ possible ways to eliminate the risks and vulnerabilities\n\nidentified from\
    \ the systems and employ techniques to beef up the system. At\n\nthis stage, the\
    \ tester needs to assure the client of the transparency in the\n\ntesting and\
    \ disclose all the vulnerabilities and risks discovered.\n\n7)Report Preparation\n\
    \nSo how do penetration testers communicate their findings? The tester needs\n\
    \nto write a report that starts by outlining the testing procedures and explains\n\
    \nthe analysis of risks and vulnerabilities. When discussing risks and\n\nvulnerabilities\
    \ in the report, it is important that you start with the critical\n\nvulnerabilities\
    \ and high risks, followed by those lower in risk. It is important\n\nthat immediate\
    \ measures are taken to correct the issues with critical\n\nvulnerabilities and\
    \ high risks before an attack occurs. \n\nWhen writing your report, you may consider\
    \ the following outline:\n\nv Summary of the penetration testing process\n\nv\
    \ Detailed description of each step and information gathered during the\n\nstep\n\
    \nv Detailed description of the risks and vulnerabilities discovered\n\nv Details\
    \ discussion on how to clean and fix the computer system \n\nvSuggested measures\
    \ to enhance the security of the system"
  merge: -1
  pgno: 52
- img_proc: true
  md: " \n\n \n\n**Legal Issues In Penetration Testing**\n\nBefore getting someone\
    \ to come and test sensitive computer systems, it is\n\nimportant for a business\
    \ to consider a number of issues such as:\n\nconfidentiality, availability, and\
    \ integrity of data. For a smooth workflow, it\n\nis important that the organization\
    \ considers having a legal agreement\n\noutlining their engagement. \n\nSome of\
    \ the legal issues should be addressed in the agreement include: \n\nv If the\
    \ penetration tester is unknown to the client, how can he or she be\n\ngiven access\
    \ to sensitive data?\n\nv Who will take responsibility for the lost data during\
    \ the process?\n\nvWhat happens if the client blames the tester for the loss of\n\
    \nconfidentiality?\n\nThe penetration testing process may affect how a given computer\
    \ system\n\nworks and this may raise issues to do with data integrity and confidentiality.\n\
    \nIt is, therefore, important that there is agreement in writing between the team\n\
    \ndoing the penetration testing and the manager of the system being tested.\n\n\
    Even when the penetration testing is being carried out by internal staff they\n\
    \nstill need an agreement or a written permission to do the job. An agreement\
    \ is\n\nimportant because it will clarify important points do with data security\
    \ and\n\ndisclosures which may result in legal process if breached. \n\nIn addition\
