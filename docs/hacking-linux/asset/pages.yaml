  md: "hackers to gain other useful information. Firewalls have been created to\n\n\
    prevent unauthorized access to these ports however this is more of a harm\n\n\
    reduction strategy rather than a sure-fire way to prevent hackers. \n\nSome hackers\
    \ are able to discern access points manually rather than using a\n\nprogram. This\
