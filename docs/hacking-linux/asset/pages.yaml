- img_proc: true
  md: 'Remember to always keep Wireshark active, filter by ARP keyword, and


    analyze the network traffic. It would also be better to perform an analysis on


    both machines.


    **Nmap And Level 2 Network Scan**


    Nmap is the most widespread as well as the most reliable and versatile


    network scanning tool. It allows us to perform multiple types of scans, from


    level 2 onwards.


    Nmap also contains a whole series of additional features, such as


    vulnerability scanners and modules for enumerating a system.


    In this section we will cover a level 2 scan using Nmap. But first I would like


    to show you the phases with which Nmap does its work.


    1\. Name resolution.


    2\. NSE script pre-scan phase.


    3\. Host discovery. We are now at this stage.


    4\. Parallel reverse name resolution.


    5\. Port or Protocol scan.


    6\. Service version detection.


    7\. OS fingerprinting.


    Traceroute.


    8\. NSE portrule and hostrule script scanning phase.


    For now, let''s focus on the host discovery phase. We will have to instruct


    Nmap not to perform any types of port scan, and to merely check which hosts


    are active on the network.


    This is a level 2 scan based on the ARP protocol and the MAC address.


    "*\-sn*" is the option you should use to instruct Nmap. That is why we should


    launch this command:'
