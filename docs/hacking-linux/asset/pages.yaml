  md: "**Introduction**\n\nHaving an understanding of the techniques used by hackers\
    \ to not only access\n\nyour information without permission will allow you to\
    \ gain insight into how\n\nthis is possible as well as what you are able to do\
    \ to protect yourself from the\n\nmost basic of attacks. Using this knowledge,\
    \ you are also able to explore\n\nfurther in hacking if you wish to develop your\
    \ skills and discover additional\n\nknowledge into creating your own programs\
    \ and software. \n\n*Keylogger* \n\nA keylogger is a very simple piece of software\
    \ that is designed to track and\n\nrecord each keystroke made by the user of computer.\
    \ These keystrokes and\n\nsequences are then stored on a log file that is accessed\
    \ by the hacker who is\n\nable to discern your information such as email ID’s,\
    \ passwords, banking\n\ndetails, credit card numbers and virtually anything else\
    \ that you input into\n\nyour machine using the keyboard. For this reason, many\
    \ online banking sites\n\nand other highly secure web pages use virtual keyboards\
    \ and even image\n\nidentifying passcodes to provide you with access to your account\
    \ since these\n\ncannot be recorded through keyloggers. \n\nHow do you keyloggers\
    \ gain access to your computer in the first place?\n\nThese lines of code or software\
    \ are often attached to files that are\n\ndownloaded onto your computer without\
    \ you being aware, known as Trojans\n\n(deriving from the Greek mythology of the\
    \ Trojan Horse). These files then\n\nget to work are report back to the hacker\
    \ with the information collecting from\n\nyour computer. Other ways that these\
    \ files are able to access your computer\n\nis if they are placed on the computer\
    \ either through direct access, if someone\n\nwas to have access to your computer\
    \ with permission to allow them to place\n\nthe file on the computer or through\
    \ USB drives that they have provided to\n\nyou with hidden files rooted within."
