    - 攻击者发送一个带有 SYN 标志的数据包。

    - 受害者回传一个带有配置好的 SYN 和 ACK 标志的数据包作为响应。

    - 此时，攻击者并不完成握手，而是发送一个带有 RST 标志的数据包。这将强制重置连接而不会完全建立连接。


    这是一种相对“静默”的扫描。如果目标网络中有跟踪已建立连接的系统，它不会记录这次连接尝试。这是因为没有连接被完全建立。


