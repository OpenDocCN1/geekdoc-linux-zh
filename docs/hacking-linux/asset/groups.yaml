    You might land in a job where they only offer $40K, or even less, maybe they will
    look at you as a complete beginner, and only offer $20K. In my situation, I used
    to make about £30K as a Restaurant Manager which is about $40K. I knew I had to
    leave the restaurant business behind, so studied hard for over two years and once
    I had an opportunity to get into IT, even the pay was so much less then I used
    to make before, I did not hesitate. In terms of salary, I knew, in time, it will
    be more.


    There was a Junior Network Engineer position available at the time, and I happened
    to know a few people at the company, so I applied and got the job. Initially,
    they said it’s going to be about £25K, which I wasn’t happy about but I said that’s
    perfect.


    Unfortunately, when it came down to the actual contract they only put £20K on
    it, and I was very frustrated, but I signed the contract. I felt like a fool but
    kept on telling myself that if I keep on learning, I will overcome this, and will
