    another two years without pay rise at all. Still, I was a Junior, so just kept
    on learning and the next payrise went up to £39K. Another year has gone by, and
    my salary went up to £46K, and with my current position, I am making about £70K
    which is about $92K per year. Does it work for anyone? 100% No, and here is the
    reason why. When I started first in IT, there were others too, who also started
    about the same time as me.


    Most of them are still on the Service Desk doing first line, second line, in fact,
    I also know many people who were in a helpdesk position already like 3 years,
    some even 5 years when I got my first job, and after 7 years on, they are still
    working at the helpdesk. Are they too dumb to move on?


    Well, some of them maybe, but over the years what I have realized is that once
    you become comfortable and have a good boss, even if you have been planning to
    move on the leader, your plans could easily fade away. There are many reasons
    for that, and the first I have to mention is laziness. Yes, IT people are lazy.
