    ## Chapter 7 Network Scanning


    The information gathering phase is over and it allowed us to collect, among other
    things, a list of IP addresses.


    Now it''s time to scan each of these IP addresses. What exactly do I mean with
    “scanning”? Each of these IP addresses will expose a certain service/port to the
    outside world.


    We need to scan them to identify the port corresponding to a certain active service.


    For example, a Web server will most likely have port 80 or 443 listening, so as
    to accept requests based on the *HTTP, HTTPS* protocol.


    There are several scanning techniques we can choose. Some of them are silent,
    others not that much. In this chapter, we will analyze some of them.


    ### Kfsensor


    To see the network scanning techniques in action, we need to expose services on
    a specific machine, or we can use a very useful tool that make these steps easier.
    It''s called KFSensor and it''s a "**honeypot**".


    Honeypots are deliberately vulnerable machines, which are sometimes used to confuse
    a potential attacker. We usually use them to push our opponent towards this trap
    so that we can study and analyze their behavior.


    KFSensor is a honeypot for Windows operating systems. For this reason, you will
    need to install the software on a Windows 7 or 10 virtual machine.


    You can download its 30-days free trial version from the official website: http://www.keyfocus.net/kfsensor/.


    Once installed KFSensor, you can proceed with a configuration of the services
    we need. These services will then be then simulated by the software as if they
    were real.


    Here we can see the list of all the simulated services on the machine. This list
    will allow us to test the various network scanning techniques.


    ### Wireshark


    Before starting, I suggest you install a network "**sniffer**", which is a tool
    that allows you to collect and analyze all network traffic. The best among the
    sniffers is undoubtedly *Wireshark* (https://www.wireshark.org/).


    While we will launch the various network scans, you can still leave Wireshark
    running, so as to observe what happens at the level of network traffic.


    ### Arping And Level 2 Network Scan


    The first thing we should mention is that the network can be scanned both at the
    data link layer and at the network layer of the ISO/OSI model.


    We will start from the one at the data link layer. Let me start by introducing
    the first tool we will use: **ARPING**.


    Scanning at the *data link layer (level 2)* makes sense only if carried out within
    a local area network (LAN). In local networks, we will mostly be dealing with
    MAC addresses and the ARP protocol.


    Now let''s connect to the Kali Linux machine and run a data link layer scan (called
    ARP scan) in the Windows machine where KFSensor is installed.


    We need to enter this command: "*arping address IP -c 2*". Where 2 is the number
    of packages we will send, but you can enter even type any other number you want.


    If the machine is active and connected to the network, this is the screen you
    should see:


    Remember to always keep Wireshark active, filter by ARP keyword, and analyze the
    network traffic. It would also be better to perform an analysis on both machines.


    ### Nmap And Level 2 Network Scan


    Nmap is the most widespread as well as the most reliable and versatile network
    scanning tool. It allows us to perform multiple types of scans, from level 2 onwards.


    Nmap also contains a whole series of additional features, such as vulnerability
    scanners and modules for enumerating a system.


    In this section we will cover a level 2 scan using Nmap. But first I would like
    to show you the phases with which Nmap does its work.


    1. Name resolution.

    2. NSE script pre-scan phase.

    3. Host discovery. We are now at this stage.

    4. Parallel reverse name resolution.

    5. Port or Protocol scan.

    6. Service version detection.

    7. OS fingerprinting.

    8. Traceroute.

    9. NSE portrule and hostrule script scanning phase.


    For now, let''s focus on the host discovery phase. We will have to instruct Nmap
    not to perform any types of port scan, and to merely check which hosts are active
    on the network.


    This is a level 2 scan based on the ARP protocol and the MAC address. "*-sn*"
    is the option you should use to instruct Nmap. That is why we should launch this
    command:


    *192.168.1.100-150* is the range of IP addresses we want to test. We could be
    dealing with a single address or a subnet.


    We can always keep the situation under control with **Nmap** and check what happens:


    As I have already pointed out, this type of level 2 scan only makes sense in local
    contexts where you communicate with MAC addresses.


    Outside the LAN, we only use IP addresses and therefore the network scan is set
    at a higher level, i.e., the network layer "layer 3 scan".


    ### Useful Findings For Level 3 Network Scans


    It would be better to use the IP address and not the hostname so as not to perform
    a DNS query and possibly alter the results obtained. We obviously need to set
    some limits.


    When dealing with a Web server that hosts multiple websites, it makes sense to
    use the hostname and DNS resolution.


    With large networks, it might take longer to complete a scan. For this reason,
    it is advisable to use a small network sample or dwell only on a small range of
    doors.


    ### Ping Scan With Nmap


    We will now move to the simplest type of level 3 scan. For doing so, we will use
    a particular protocol called ICMP (Internet Control Message Protocol), which implies
    that we are not using either the TCP or UDP protocol.


    The **ICMP** performs various control functions, including the verification of
    reachability of a certain host within a network.


    To do this, we use the PING command specifying with the "-c" option the number
    of ICMP packets we want to send to the target machine or network.


    Below we can see that the target machine has responded to our command and is therefore
    active in the network.


    Don''t forget to check the network traffic with Wireshark. You should also use
    the "icmp" filter.


    Wireshark clearly shows us that we are using the ICMP protocol and that packet
    exchange is happening as follows:


    - Echo request. The attacking host sent the ICMP packet to the target machine.

    - Echo reply. The target machine sent the response packet to the attacking machine.


    ### Tcp And Udp Protocol


    We will now examine the layer 4 one at the transport layer.


    The transport layer is mainly composed of 2 protocols: **TCP and UDP**.


    The main difference between these two protocols is that TCP is a connection-oriented
    protocol, while UDP has no connection.


    Basically, when we need to use TCP, we have to do it by creating a connection
    between the two parts.


    They both should want and be able to communicate with each other, otherwise there
    will be no exchange of information.


    From this, we can easily deduce that TCP is a reliable protocol that, besides
    rare and manageable exceptions, offers us the receipt of the information sent.


    On the contrary, with UDP we have no certainty. On the other hand, UDP is a very
    fast protocol, while TCP is less efficient due to all the additional checks it
    has to perform.


    Let''s look at which fields make up a TCP and a UDP packet.


    ### Tcp Control Flags


    To do this, it uses a series of additional information within the network packet,
    and we are interested in the so-called "TCP flags". There are six of them:


    - SYN.

    - ACK.

    - RST.

    - FIN.

    - PSH.

    - URG.


    SYN and ACK are the most important TPC flags, because they take part in the "Three-way
    handshake". This procedure allows the TCP protocol to establish a communication.


    The presence of the **RST flag** shows that we need to reset the connection. This
    may be due to connection errors and the FIN flag indicates there are no other
    data that the sender should receive.


    ### The Three-Way Handshake


    This connection creation process is based exclusively on the SYN and ACK flags.


    Let’s suppose we have two machines:


    - PC A that wants to establish the connection.

    - PC B that is waiting for the connection to be established.


