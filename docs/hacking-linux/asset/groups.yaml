    \ .rtf 文件漏洞，然后发送给目标。当文件被打开时，就会启动一个 meterpreter 会话，允许你远程在目标系统上执行几乎任何操作。假设你新安装的\
    \ Windows 7 没有补丁，它应该还有这个明显的漏洞。\n\n本章向你介绍了另一个非常有用且强大的黑客工具：meterpreter。它是一个高级且动态扩展的有效负载，能够获取对目标系统的完全访问权限。\n\
    \n### 第 1 步：启动 Metasploit\n\n有两种方式可以在 Kali Linux 上初始化 *Metasploit*：通过终端或通过应用程序菜单。在桌面上，点击左角的角的快捷方式，进入\
    \ *Kali Linux > Top 10 Security Tools > Metasploit Framework*，然后选择通过互联网破解计算机的\
    \ exploit。\n\n### 第 2 步：初始化漏洞\n\n当 Metasploit 服务初始化时，在其终端窗口中输入以下命令来初始化漏洞：\n\n\
    `msf > use exploit/windows/fileformat/ms14_017_rtf`\n`msf exploit[ms14_017_rtf]\
    \ >`\n\n如果你想查看有关已加载漏洞的更多信息，可以使用 *info* 命令。\n\n### 第 3 步：设置漏洞选项\n\n下一步是检查该漏洞还需要哪些进一步的信息或进程。使用\
