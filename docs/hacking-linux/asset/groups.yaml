    ## 第4 层网络扫描 - UDP 扫描 (Udp Scan)


    之前的扫描与**TCP 协议**有关。然而，UDP 协议也可以提供有趣的结果，因为它经常被低估且没有受到网络管理员的充分保护。


    请记住 UDP 协议是无连接的，因此其行为与 TCP 不同。


    特别是，如果对某个端口启动扫描且我们没有收到任何响应，那么我们可以假设该端口是开放的。否则，我们将收到 ICMP 错误消息，简而言之这意味着端口是关闭的或无法提供重要信息。


