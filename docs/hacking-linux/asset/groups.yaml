    ### Conclusion

    So far, we''ve seen that the cause of cybersecurity problems isn''t code itself
    as much as implementation, meaning that it all rests on managers who haven''t
    got the first clue how it meshes together. They''re helped by relatively few programmers
    who have to account for all kinds of hardware configurations and software environments.
    Security simply can''t be maintained by select few companies chasing profits.
    It''s all down to us. We as clever users have to up our standards, choose software
    built on solid programming practices and support tech companies that are transparent.
    Even if software is free, we can thank the creator – it really means a lot. We
    should also look for and deploy customized software solutions that fit our needs
    rather than use what everyone else is using. In the end, we have to start tinkering
    with code ourselves, first by writing simple .BAT scripts in any text editor and
    moving onto Autohkey scripts that can automate mouse clicks, register key presses
    and help us unlock ultimate productivity.


    Cyber is by no means a solved problem, and it''s likely we''ll never find a definite
    list of actions to take and remain safe in a world filled with electronic devices.
    What we can do is learn to coexist with them and make sure no hacker can press
    a button to hijack a smart thermometer and ruin our lives. It doesn''t even have
    to be a checklist as the best cybersecurity practices are simple, lightweight
    and actually kind of fun. Hackers can''t be stopped in a cost-effective way, but
    they can be made to run around in circles until they give up. Never think you''re
    invincible and be willing to learn from the experts. Banks have shown themselves
    to have sublime cybersecurity practices, so when in doubt, just ask yourself,
    “What would my bank do?”

