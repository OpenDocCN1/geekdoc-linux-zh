    \ 可以与其他操作系统一起以双启动或多启动的形式存在于硬盘中。\n\n通常，Kali Linux 会安装在另一个操作系统（无论是 Linux还是其他）的虚拟化软件内部。这种配置会消耗更多资源，但为黑客提供了更大的灵活性，并允许他在主机内的其他虚拟机上练习攻击。当\
    \ Kali 安装在可移动外部介质（如 CD-ROM 或 USB 闪盘）上时，也可以作为可启动的“Live”操作系统使用。由于光驱驱动器变得越来越常见，USB\
    \ 介质对于外部安装更为实用。Live 发版的优势在于它可以在多台机器上，而且 Kali Linux 包含的一些数字取证工具在目标机器启动结构之外运行效果。本章将重点介绍硬件和虚拟安装程序。\n\
    \n### 在硬盘上安装 Kali Linux\n\n最新版本的 Kali Linux 对主机配置有以下最低要求：\n\n1) 10 GB 硬盘（建议 20\
    \ GB）\n2) 512 MB 内存（建议 1 GB）\n\n用户还需要 USB 端口或 CD-ROM 驱动器来启动安装。建议主机具有某种网络接口，当然，是为了软件更新以及渗透测试中的连接。\n\
    \n无论是将 Kali Linux 作为独立操作系统安装还是多启动方案，安装的第一步都是从 Offensive Security 获取最新的 ISO（符合国际标准组织的磁盘镜像）并将其复制到外部介质。可以在\
    \ www.kali.org/downloads/ 最新的发布列表。\n\n建议从开发者处获取 ISO 镜像，而不是从第三方或文件共享源，以确保代码的完整性。ISO\
    \ 提供 32 位和 64 位版本，取决于主机的处理器架构。请注意，64 位版本无法在 32 位处理器上运行。您可以直接从相应的链接下载 ISO，或者在使用\
    \ torrent 客户端通过 torrent 链接下载。每个 ISO 文件都提供了 *SHA1Sum* 哈希。文件下载完成后，可以使用 *checksum*\
    \ 软件读取其哈希并与给定的字符串进行比较。如果字符串不完全匹配，则文件已被篡改，不应使用。此校验和程序可以防止下载损坏或被劫持的文件（小偷之间没有仁义！）。\n\
    \n### 独立安装\n\n在开始独立安装 Kali Linux 之前，需要了解此程序将*覆盖主机硬盘上的所有现有数据*。这包括之前存在的操作系统（如果有），以及任何其他文件或软件。\n\
    \n独立安装的步骤如下：\n\n1) 确保最低硬件和芯片架构\n检查您的主机是否符合 Kali 的最低硬件要求（当前为 10 GB 存储空间和 512 MB\
    \ 内存），以及它是否支持 64 位安装（不支持，请使用 32 位版本）。\n\n2) 备份主机硬盘上的任何文件\n由于安装将覆盖主机硬盘上的任何现有数据，请传输或备份任何需要的文件或设置（例如，到云盘、闪盘、CD、DVD\
    \ 或外硬盘）。\n\n3) 确保正确的启动顺序\n重启您的主机并进入 BIOS 菜单。如果需要，安装后可以将启动顺序更改为其他设置。确保退出 BIOS 菜单时保存\
    \ BIOS 设置。\n\n4) 加载 ISO\n更改 BIOS 后，完全关闭主机，插入包含 ISO 的光或 USB 介质，然后重启电脑。Kali 启动菜单出现可能需要几秒钟。\n\
    \n5) 遵循安装说明\n当 Kali 启动菜单出现时，选择 *Graphical Install*（图形化安装）选项。接下来的安装步骤包括针对 Kali\
    \ 初学者的通用推荐选项。\n"
