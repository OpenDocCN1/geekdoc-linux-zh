    # 破解 Linux


    包含实用黑客工具和黑客基础的初学者编程系统指南。涵盖 Kali Linux 分步教学、安全测试和渗透测试。


    ![](img/62d35712e96812a2e59ae828efab0d55_0_0.png)


    PHIL J. HACK


    破解 Linux：包含实用黑客工具和黑客基础的初学者编程系统指南。涵盖 Kali Linux 分步教学、安全测试和渗透测试。


    **目录**


    - **内容描述**

    - **引言**

    - **第 1 章 构建黑客环境**

    - **第 2 章 漏洞**

    - **第 3 章 使用 Metasploit 破解 Windows 计算机**

    - **第 4 章 黑帽黑客**

    - **第 5 章 入门者的伦理黑客**

    - **第 6 章 渗透测试流程**

    - **第 7 章 网络扫描**

    - **第 8 章 渗透渗透**

    - **第 9 章 网络安全初级薪资**

    - **第 10 章 数据操纵问题**

    - **第 11 章 网络安全职业潜力**

    - **第 12 章 逆向工程的工作原理**

    - **第 13 章 运行和使用 Kali Linux 的分步指南**

    - **结论**


    ## 内容描述


    在了解了黑客常用的入侵方法后，为这些方法制定单独的防护策略是不现实的。因此，用户只能掌握个人计算机安全的通用防护策略，以确保计算机处于相对安全环境中。常见的
    PC 防策略包括：安装和升级反病毒软件、启用防火墙、防止木马和病毒、共享文件夹以及定期备份重要数据。


    病毒的出现对互联网计算机造成了巨大损失。这些病毒会导致系统无法正常运行，导致系统被格式化以及数据丢失。为了防止这些病毒造成的危害，用户需要在计算机上安装反病毒软件并开启实时监控。此外，由于病毒制作技术和手段的提高，新病毒不断出现，因此用户需要及时升级反病毒软件，以便其能够防止互联网上的新病毒。


    防火墙是将计算机内部网络与外部网络隔离的方法。事实上，这是一种隔离技术。防火墙是在两个内外网络通信时执行的访问控制机制。它允许用户的授权计算机和特定数据进入内部网络，最大限度地防止外部网络的黑客访问并攻击自己。


    为了防止木马和病毒入侵互联网，首先不要下载身份不明的软件和程序，选择信誉良好的下载站点下载程序，然后将下载成功的软件和程序放在系统分区以外。其他分区在打开之前需要使用反病毒软件对下载程序进行扫描。


    此外，不要打开未知来源的邮件和附件，以避免邮件病毒或捆绑木马的入侵。即使你下载了信息中的附件，也需要用反病毒软件对其进行扫描。


    在互联网上，某些黑客使用“钓鱼”方法进行诈骗，例如创建伪网站或发送包含欺诈信息的电子邮件，从而盗取网上银行、在线支付工具、信用卡账户和密码，并从账户中盗取资金。为了防止钓鱼，用户必须确保输入信息的
    URL 是真实 URL，而不是钓鱼网站。不要随意输入。


    在局域网（LAN）中，当用户共享文件时会产生软件漏洞，黑客会检测这些漏洞。因此，用户在设置共享文件夹时必须设置访问密码。取消共享后应立即取消共享状态。此外，在设置共享文件夹时，用户必须谨慎数据。数据的重要性是不言而喻的，无论采取什么样的安全措施，如果黑客能够访问系统，就无法防止攻击。因此，用户必须对在网络上共享的内容谨慎，因为这可能导致黑客随时访问你的数据并做好准备。


    本指南将关注以下内容：

    - 第 1 章 构建黑客环境

    - 第 2 章 漏洞

    - 第 3 章 使用 Metasploit 破解 Windows 计算机

    - 第 4 章 黑帽黑客

    - 第 5 章 入门者的伦理黑客

    - 第 6 章 渗透测试流程

    - 第 7 章 网络扫描

    - 第 8 章 渗透渗透

    - 第 9 章 网络安全初级薪资

    - 第 10 章 数据操纵问题

    - 第 11 章 网络安全职业潜力

    - 第 12 章 逆向工程的工作原理


    ## 引言


    了解黑客使用的技术将使你洞察可能。利用这些知识，你可以进一步探索。


    ### 键盘记录器 (Keylogger)


    键盘记录器是一种非常简单的软件，旨在跟踪并记录用户输入的每个按键。这些按键会被存储在日志文件中，黑客通过访问该文件来识别银行详情、信用卡号以及你输入机器的任何内容。


    键盘记录器最初是如何访问你的计算机的？这些代码行或软件通常附带在下载到你计算机的文件中，而你对此毫无察觉，被称为木马（源自希腊神话中的特洛木马）。这些文件会将从你计算机中收集到的信息报告给黑客。这些文件访问你计算机的其他方式是
    Format直接访问或通过你提供的 USB 驱动器放在计算机上。


    键盘记录器也可能被用于白帽目的，例如在组织内部确保员工遵循正确的政策和程序，而不参与欺骗行为。


    ### 拒绝服务 (DoS/DDoS)


    这涉及导致网站变得不可用。由于信息和流量的泛滥，网站被关闭，导致系统在极力处理所有请求时因过载并最终崩溃。这些攻击由黑客采用，他们的目的是出于任何原因或动机破坏他们想要破坏的网站或服务器。例如，一个黑客行动主义黑客可能会关闭一个与他们的政治观点不符的网站，认为这是他们的道德义务。而黑帽黑客可能会关闭竞争对手的网站，以扰乱其服务并破坏他们的努力。


    DoS 攻击是使用僵尸网络或受感染系统网络执行的，这些系统几乎被用作僵尸服务器军队反复攻击目标服务，使其过载。这些受感染的系统是通过带有病毒的电子邮件和软件创建的，一旦被感染，这些僵尸计算机就可以被黑客随意使用。行业数据显示，多达
    45% 的机构遭受过 DDoS 攻击，每年造成数百万美元的损失。


    ### 漏洞扫描器 (Vulnerability Scanner)


    为了检测计算机网络中的弱点，黑客使用称为漏洞扫描器的工具。这也可以指端口扫描器，用于扫描特定计算机上黑客可以利用的可用访问点。端口扫描器还能确定在该特定端口上运行着哪些程序或进程。


    '
