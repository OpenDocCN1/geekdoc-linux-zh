    1337。现在让我们切换到攻击计算机并输入以下命令与监听器连接：


    nc 192.142.42.121 1337


    这将使 Netcat 连接到 IP 地址为 192.142.42.121 的设备的 1337 端口。这两台机器现在应该连接并可以相互通信。但我们如何知道这起作用了？使用两台计算机中的任意一台，打开终端并输入内容。你在一台机器上输入的任何内容将在另一台机器上显示。杀死

