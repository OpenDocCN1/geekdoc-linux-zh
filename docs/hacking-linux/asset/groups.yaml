    chips, increased memory size, and increased data storage have made


    hardware virtualization a viable and practical means of running multiple


    software platforms on a single computing device. Running operation systems


    within a VM has advantages because it eliminates the need for multiple


    pieces of expensive hardware and makes the use of highly specialized


    distributions such as Kali practical. In addition, using penetration testing


    software within a single host allows hackers to practice attacks in a safe


    “sandbox” environment, targeting various other VM’s within the host. The


    downside of using an OS within a VM is that there is competition for host


    resources, and the virtual hardware capabilities are limited to those of the


    host machine.


