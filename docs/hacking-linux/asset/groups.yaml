    \ 尤其是它的命令。\n\n在本章中，你学习了如何使用黑客可以使用的最强大的工具之一来利用 Windows 中的已知漏洞。对你来说最重要的教训是攻击是如何执行的，以及如何使用\
    \ meterpreter 等各种工具。\n\n### 练习题\n\nWindows 7 Service Pack 1 是初级黑客学习技能最理想的操作系统，因为有许多他们可以练习的已知漏洞。在将来，你将负责寻找自己的漏洞，这包括关注微软发布的补丁更新。\n\
