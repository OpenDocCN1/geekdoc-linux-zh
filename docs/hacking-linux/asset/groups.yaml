- md: "\n***select the partition intended for Kali, or other data will be erased.***\n\
    \n**Continue.**\n\n4. In the “Partition settings” list, select “Delete the partition”\
    \ and continue.\n\n5. The next screen should now indicate the intended Kali partition\
    \ as having “FREE SPACE”. Select that partition again and continue.\n\n6. On the\
    \ “How to use the free space” screen, select “Automatically partition the free\
    \ space” and continue.\n\n7. For “Partitioning scheme”, select “All files in one\
    \ partition” and continue.\n\n8. Finally, select “Finish partitioning and write\
    \ changes to disk”, continue, and select “Yes” to confirm writing changes. Continue,\
    \ and resume installation at step 5VIII.\n\n## Installing Kali Linux On A Virtual\
    \ Machine\n\nAdvances in processor speed, the advent of multicore and multiprocessor\
    \ chips, increased memory size, and increased data storage have made hardware\
    \ virtualization a viable and practical means of running multiple software platforms\
    \ on a single computing device. Running operation systems within a VM has advantages\
    \ because it eliminates the need for multiple pieces of expensive hardware and\
    \ makes the use of highly specialized distributions such as Kali practical. In\
    \ addition, using penetration testing software within a single host allows hackers\
    \ to practice attacks in a safe “sandbox” environment, targeting various other\
    \ VM’s within the host. The downside of using an OS within a VM is that there\
    \ is competition for host resources, and the virtual hardware capabilities are\
    \ limited to those of the host machine.\n\nFunctional and feature-rich virtual\
    \ machine software is available free of charge. The most common free VM applications\
    \ are *Virtualbox* and *VMware Player* (which has commercial versions with additional\
    \ features). *QEMU* is an open-source option that runs solely on Linux. This book\
    \ will use Virtualbox to demonstrate a virtual Kali installation because it is\
    \ available for Windows, Macintosh, Linux, and even Sun systems.\n\n## Installing\
    \ the Virtualization Software\n\nVirtualbox is a popular multi-platform, open-source\
    \ virtual machine application. The installation procedure is as follows:\n\n1.\
    \ Ensure minimum specifications\nVirtualbox is designed to run on *x86* (Intel\
    \ or AMD chips, et al) architectures and it is recommended that the host machine\
    \ have at least 1 GB of RAM. Additionally, the host machine should have enough\
    \ free hard drive space to accommodate any virtual machine OS’s you intend to\
    \ install.\n\n2. Enable hardware virtualization\nIf you are using a Windows or\
    \ Linux host computer, restart your and enter the BIOS menu. Navigate to the virtualization\
    \ option (the menus will vary from computer to computer) and ensure that its enabled.\
    \ Be sure to save BIOS settings upon exiting the BIOS menu.\n\nMacintosh hardware\
    \ does not use BIOS in the same manner as “PC” computers. Hardware virtualization,\
    \ if not already enabled, must be set via command line in the terminal application.\
    \ This is an advanced procedure requiring root access, and the command syntax\
    \ may vary between Mac OS versions. Consult your documentation or manufacturer\
    \ for enabling virtualization on Macintosh hardware.\n\n3. Download installation\
    \ files\nThe latest source code and binary distributions can be obtained at (Figure\
    \ 5): https://www.virtualbox.org/wiki/Downloads\n\n*Windows*\nThe “Windows hosts”\
    \ link provides an .exe binary Windows installation file. Documentation on the\
    \ Virtualbox website lists the supported Windows versions of the current release.\n\
    \n***Macintosh OS X***\nThe “OS X hosts” link provides a .dwg Mac OS X disk image\
    \ file.\n\n*Linux*\nThe “Linux distributions” link launches a new page listing\
    \ various Virtualbox packages for different Linux distributions. However, it is\
    \ recommended that you download and install Virtualbox through the package repositories\
    \ on your individual Linux distribution (see step 4)\n\n4. Install Virtualbox\n\
    \n*Windows*\nOpening the Windows executable installation file will launch a typical\
    \ Windows installation “wizard” dialog. Follow the installation instructions.\
    \ The installation options and additional application choices depend on your individual\
    \ preferences.\n\n***Macintosh OS X***\nOpening the .dwg disk image will mount\
    \ the image and open a window containing the Virtualbox “.mpkg” OS X installation\
    \ file. Launch the .mpkg file to begin installation and follow the instructions.\
    \ The installation options and additional application choices depend on your individual\
    \ preferences.\n\n***Linux (Debian-derived)***\nMost modern Linux distributions\
    \ are derivatives of the original Debian and Fedora (e.g. Red Hat) kernels. To\
    \ illustrate installation of Virtualbox on a Linux OS, the following steps describe\
    \ the installation as it applies to an Ubuntu Linux (A Debian derivative) system.\
    \ Installation for other Linux distributions may vary in syntax and in repository\
    \ locations. These steps should apply to most up-to-date Debian releases.\n\n\
    To install Virtualbox from an Ubuntu repository using the software center:\nI.\
    \ Open the “Ubuntu Software” application from the launcher menu.\nII. Type “virtualbox”\
    \ into the search line at the top. VirtualBox should appear in the resulting package\
    \ list.\nIII. Click “Install” next to the VirtualBox package.\nIV. If asked, enter\
    \ your password to authenticate root access.\nV. Installation will proceed automatically\
    \ for a short period.\n\nTo install VirtualBox from an Ubuntu repository using\
    \ the command line:\nI. Open the Ubuntu command line console, named “Terminal”.\n\
    II. Type the following to update the software repository (enter root password\
    \ if asked):\n## sudo apt-get update\n## sudo apt-get install virtualbox\nIII.\
    \ Installation will proceed automatically for a short period.\n\n## Installing\
    \ The Kali Linux Virtual Machine From a Disk or ISO\n\nOnce the virtualization\
    \ software is installed, Kali Linux can be installed on the host as a virtual\
    \ machine. This example will once again feature VirtualBox to illustrate the procedure:\
    \ \n\nI. Open VirtualBox on your host machine.\nII. Click “New” to create a new\
    \ VM.\nIII. Follow the “Create Virtual Machine” wizard dialog, using the recommended\
    \ parameters listed below:\na. Name and operating system\n*Name* >> [Kali Linux]\
    \ (or whatever you choose)\n*Type* >> [Linux]\n*Version* >> [Debian (64-bit)]\
    \ (32 bit if applicable)\nb. Memory size >> [1024 MB]\nc. Hard disk >> [Create\
