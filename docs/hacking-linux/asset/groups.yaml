    ## Encryption Bulletproof Your System


    While encryption will make it nearly impossible for someone to interpret

    your information, it does not mean you are entirely safe. Theoretically,

    cracking cryptographic keys might be difficult, but it’s certainly not

    impossible. There are labs around the world that have dedicated their time

    and resources to find a way around encryption protocols.


    Security breaches still happen, even with some of the best encryption

    procedures in place. One of the reasons behind this is not that hackers

    managed to decrypt information, but there is poor handling of encryption

    keys. Some people store their encryption keys in the same systems that they

    encrypt. You must exercise due diligence when dealing with encryption keys

    and protocols so that everything you work on is protected.


    ## Encryption Is for Compliant Organizations


    It is amazing the lengths to which people will go to avoid encrypting their

    data, yet it is their resources that are on the line. Of course, any entity that

    operates in a regulated market must follow the set guidelines, or they will

    lose their license to operate. Data security is serious, and authorities are

    taking a firm stand on it. Companies must exercise due diligence to protect

    their customers.


    Whether you are obligated to encrypt your data or not, it is a logical concept

    to encrypt sensitive data, as it may fall into the wrong hands, resulting in you

    fighting legal battles that might run your company into the ground.


    ## The SSL Encryption Myth


    SSL is an encryption method that protects your data when browsing online.

    Given that it almost always just works without any input from your end,

    many people assume that it encrypts all the data. This is not true. SSL only

    encrypts data that is being transferred. It does not protect static data. You

    should take the initiative and encrypt all the data you have access to,

    especially since it is written on the disk.


    ## Encrypted Data Cannot Be Stolen


    The best security products in the market will try to offer the top protection
    to

    the best of their knowledge. However, a lot of factors come into play that

    might make it difficult for these programs to protect your data

    accordingly.


    The safest companies and individuals are those who believe that their data is

    never safe, and as a result, they keep looking for ways of protecting their

    data. If you believe your data is protected by virtue of the fact that you

    encrypted it, you become a sitting duck and might only realize your mistake

    once your data is wiped clean or the FBI is at your doorstep, accusing you of

    a crime you have no idea about.


    ## Assembling a Task Force


    No matter what is happening or what is at stake, one thing is certain - you

    have been hacked. Your nakedness is exposed for the whole world to see.

    The last thing you want to do is go into panic mode. To manage the situation,

    you must think clearly and swiftly. Resist the urge to shift blame or point

    fingers. At that point, the entire company is under attack, so no one really

    cares about the department responsible for the vulnerability exploits. Your

    company’s brand is probably trending on social media by that time with news

    networks carrying breaking news stories about your company.


    Hacks happen, but it is not the end of the world. You must have a plan in

    place to enable your team to focus on what lies ahead. The pressure will be

    intense, but everyone must follow the set protocol. Depending on the size of

    your organization and the resources at your disposal, you might need a crisis

    management team.


    Call an emergency meeting and inform all the employees of the current

    status. Remind them that during this turbulent time, they must stay calm, and

    if possible, avoid social media. They should not respond to or discuss

    anything about the hack with anyone. All matters concerning the hack will be

    responded to by someone specifically appointed by the company to deal with

    this particular issue.


    Hold discussions with the relevant department heads, and try to understand

    the situation as soon as possible. Also, identify technical flaws in your system

    that might be responsible for the hack, and ensure you have someone ready to

    deal with the media and handle customer communication and relations

    appropriately.


    Remember that your customers are trying to understand what is happening

    just as much as you are trying to understand the situation. If you do not

    address their concerns in a timely manner, the situation might spiral out of

    control very fast. There is always the risk that you might be looking at

    litigation in light of the hack, so be certain to have a legal team ready to start

    investigating and looking at the possible solutions. This is not the time to be

    caught unawares.


    One of the mistakes that most companies have made in the past is to stay

    quiet about hacks, only revealing the truth after they are pressured into action

    by authoritative parties. If you do this, your customers will feel cheated, and

    you’ll then have a bigger issue to deal with. In case your business is not so

    elaborate to have all these protocols in place, get in touch with a relevant

    third party as soon as you realize you are compromised, and have them guide

    you on how to proceed.


    ## Containing the Situation


    The taskforce that responds to a hacking incident might serve different roles

    depending on the nature of the attack. While you handle the PR nightmare

    that follows, you should have people working behind the scenes to contain

    the damage. One of the first things they must do after identifying the problem

    is think of a solution to patch it. Patches will offer a temporary fix to your

    technological challenges or eliminate the virus that might have crippled your

    systems.


    A good example of this is the Heartbleed bug from 2014 (Gujrathi, 2014;

    Sanchez, 2014). At least 17 percent of servers on the internet were affected.

    As soon as the bug was detected, a security patch was available almost

    instantaneously. Those who were quick to respond arrested the problem

    before it got out of hand. Some network administrators, however, were too

    slow to respond, and as a result, their servers were left exposed longer than

    they should have been.


    You will almost always need to reset your passwords in the aftermath of a

    security breach. You might not be aware of how much data was compromised

    or the nature of data that was compromised, so to be safe, it makes sense to

    encourage everyone to change their passwords.


    Pull devices off the internet and institute a quarantine for any devices that

    were exposed or might have been exposed. If the hack was an inside job or

    assisted by someone with insider access, block their accounts, revoke their

    access, and have your security team investigate their devices to understand

    their role in the hack and how deep it runs. Take all necessary steps to make

    sure that the attack does not compromise the integrity of your organization or

    any investigations into the matter.


