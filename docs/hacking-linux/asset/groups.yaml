    \nReconnaissance involves carrying out an analysis of all the preliminary information\
    \ about the computer systems to be tested so as to decide on the approach to be\
    \ followed. If the tester is a black hat tester then chances that he or she has\
    \ very little information concerning the systems, let’s say only an IP address\
    \ to start with. What follows is that the tester may opt to gather additional\
    \ information from the internet so as to study this information and use it to\
    \ carry out the testing. For white hat testing, the tester gets sufficient information\
    \ about the computer system from the owners and he/she has to study this information\
    \ so as to make an informed decision when conducting the other stages of penetration\
    \ testing.\n\nAt a passive penetration testing stage, the main objective of reconnaissance\
    \ is to obtain a clear picture of the computer system being tested. Sometimes\
    \ the tester may request more information from the client, so as to be able to\
    \ have a detailed description of the system under testing. \n\n3)Discovery\n\n\
    This is a very important step in the penetration testing process. Once the penetration\
    \ tester has a clear picture of the computer system to be tested, the tester now\
    \ uses automated tools to scan the targeted systems so as to discover vulnerabilities\
    \ within the system. Usually, automated tools used for this job have a special\
    \ database that helps them monitor and test for details of the latest risks and\
    \ vulnerabilities in the system. In many cases, the penetration tester will seek\
    \ to discover:\n\n- Network discovery\nThis is the discovery of additional networks\
    \ such as servers, computing devices and computer systems connected to the targeted\
    \ system.\n\n- Host Discovery\nThis discovery assesses a computer system and seeks\
    \ to discover open ports and gateways on the system devices.\n\n- Server Interrogation\n\
    Here the automated tools interrogate the open ports to find out the exact services\
    \ running on those ports. \n\n4)Analyzing Information and Risks\n\nOnce the tester\
    \ has gathered sufficient information about the system using the automated system,\
    \ the tester now needs to analyze the gathered information. \n\nBecause some computer\
    \ systems may be large and may have an extensive infrastructure, this step may\
    \ consume a lot of time. This is also where the penetration tester identifies\
    \ the real vulnerabilities in the system. It is, therefore, important that this\
    \ step is done with a lot of care so as to identify all vulnerability and the\
    \ potential threats to the computer system.\n\nWhen analyzing the information\
    \ and risks, it is important for one to consider the defined goal of the penetration\
    \ exercise, the estimated time for the penetration testing job and the potential\
    \ risks the system is being exposed to. These are important elements that will\
    \ ensure that the analysis is done in the right manner and the tester can pinpoint\
    \ all the major vulnerabilities in the system.\n\n5)Active Intrusion Attempts\n\
    \nThis is the most important step and needs to be performed with care. This step\
    \ explores the extent to which each of the vulnerabilities identified during the\
    \ discovery possesses an actual risk to the computer system. This step should\
    \ not be rushed through as it poses a threat to the computer system. In fact,\
    \ it should be considered only when a verification for the potentials vulnerabilities\
    \ is required. For the systems that require very high integrity standards to be\
    \ met, the potential risk and vulnerability has to be carefully analyzed before\
    \ proceeding with this critical cleanup process. \n\n6)Final Analysis\n\nThis\
    \ is the final step and therefore serves as a reflection of all the steps already\
    \ conducted. Here the penetration tester has to review all the vulnerabilities\
    \ and potential risks discovered with his or her magnitude and potential attack\
    \ vectors. Using this information, the penetration tester is required to formulate\
    \ possible ways to eliminate the risks and vulnerabilities identified from the\
    \ systems and employ techniques to beef up the system. At this stage, the tester\
    \ needs to assure the client of the transparency in the testing and disclose all\
    \ the vulnerabilities and risks discovered.\n\n7)Report Preparation\n\nSo how\
    \ do penetration testers communicate their findings? The tester needs to write\
    \ a report that starts by outlining the testing procedures and explains the analysis\
    \ of risks and vulnerabilities. When discussing risks and vulnerabilities in the\
    \ report, it is important that you start with the critical vulnerabilities and\
    \ high risks, followed by those lower in risk. It is important that immediate\
    \ measures are taken to correct the issues with critical vulnerabilities and high\
    \ risks before an attack occurs. \n\nWhen writing your report, you may consider\
    \ the following outline:\n\n- Summary of the penetration testing process\n- Detailed\
    \ description of each step and information gathered during the step\n- Detailed\
    \ description of the risks and vulnerabilities discovered\n- Detailed discussion\
    \ on how to clean and fix the computer system \n- Suggested measures to enhance\
    \ the security of the system\n\n## Legal Issues In Penetration Testing\n\nBefore\
    \ getting someone to come and test sensitive computer systems, it is important\
    \ for a business to consider a number of issues such as: confidentiality, availability,\
    \ and integrity of data. For a smooth workflow, it is important that the organization\
    \ considers having a legal agreement outlining their engagement. \n\nSome of the\
    \ legal issues should be addressed in the agreement include:\n\n- If the penetration\
    \ tester is unknown to the client, how can he or she be given access to sensitive\
    \ data?\n- Who will take responsibility for the lost data during the process?\n\
    - What happens if the client blames the tester for the loss of confidentiality?\n\
    \nThe penetration testing process may affect how a given computer system works\
    \ and this may raise issues to do with data integrity and confidentiality. It\
    \ is, therefore, important that there is agreement in writing between the team\
    \ doing the penetration testing and the manager of the system being tested.\n\n\
    Even when the penetration testing is being carried out by internal staff they\
    \ still need an agreement or a written permission to do the job. An agreement\
    \ is important because it will clarify important points do with data security\
    \ and disclosures which may result in legal process if breached. \n\nIn addition\
    \ to an agreement, there is a need to do a statement of intent to be drawn and\
    \ signed by both the client and the tester before the work begins. A statement\
    \ of intent will help clarify issues regarding the goals and the scope of the\
    \ testing. This is important so that everyone knows what is the expected outcome\
    \ of the process. The statement may also clarify areas to be focused on and those\
    \ to be ignored during the process. \n\nIt is important for the two parties involved\
    \ in the process to know each other and for the description of the job to be done\
    \ very well. The penetration tester should know the target system to be tested\
    \ and who owns the system or the business. At the same time, the client should\
    \ know the tester, their qualifications and have their contact information. This\
    \ is important as it will ensure that:\n\n- The tester has a written permission\
    \ that clearly defines the parameters for carrying out the penetration testing\n\
    - The client has the full details of the penetration tester and has an assurance\
    \ that the data on the system will be treated with the assurance it deserves.\n\
    \nIn summary, it is important that both parties to a penetration testing have\
    \ a legal agreement before the job starts. This will help clarify issues touching\
    \ on the integrity of the system, confidentiality and the extent of the job to\
    \ be done. It is also important to consider the laws of your country before commencing\
    \ on the job. Different countries have different laws to guide their ICT sector.\
    \ This means that both the client and the tester should consider these laws when\
    \ preparing their agreement before they start the work.\n"
