    # HACKING LINUX


    The Complete Beginners Programming System Guide With Practical Hacking Tools And
    Essentials Basics Of Hack. Includes Kali Linux Step By Step, Security Testing
    And Penetration Testing


    ![](img/62d35712e96812a2e59ae828efab0d55_0_0.png)


    PHIL J. HACK


    HACKING LINUX: THE COMPLETE BEGINNERS PROGRAMMING SYSTEM GUIDE WITH PRACTICAL
    HACKING TOOLS AND ESSENTIALS BASICS OF HACK. INCLUDES KALI LINUX STEP BY STEP,
    SECURITY TESTING AND PENETRATION TESTING.


    **Table of Contents**


    - **Description**

    - **Introduction**

    - **Chapter 1 Building A Hacking Environment**

    - **Chapter 2 Vulnerabilities**

    - **Chapter 3 Hacking A Windows Computer With Metasploit**

    - **Chapter 4 Black Hat Hackers**

    - **Chapter 5 Ethical Hacking For Beginners**

    - **Chapter 6 Penetration Testing Process**

    - **Chapter 7 Network Scanning**

    - **Chapter 8 Post Exploitation**

    - **Chapter 9 Cybersecurity Entry Level Salary**

    - **Chapter 10 Data Manipulation Concerns**

    - **Chapter 11 Cybersecurity Career Potentials**

    - **Chapter 12 How Reverse Engineering Works**

    - **Chapter 13 Step-By-Step Guide To Running And Using Kali Linux**

    - **Conclusion**


    ## Description


    After understanding the intrusion methods commonly used by hackers, it is not
    realistic to plan separate protection strategies for these methods. Therefore,
    users can only master the common protection strategies of personal computer security
    to ensure that the computer is in a relatively safe environment. Common PC protection
    strategies include: installing and upgrading anti-virus software, enabling firewalls,
    preventing Trojans and viruses, sharing folders and regularly backing up important
    data.


    The emergence of viruses has caused huge losses to computers on the Internet.
    These viruses can cause the system to fail to operate normally, and the system
    will be formatted and data will be formatted. In order to prevent the harm caused
    by these viruses, users need to install anti-virus software on the computer and
    turn on real-time monitoring. In addition, due to the improvement of virus production
    techniques and means, new viruses are constantly appearing, so users need to upgrade
    anti-virus software in time, so that anti-virus software can prevent new viruses
    in the Internet.


    A firewall is a method of separating a computer''s internal network from an external
    network. In fact, this is an isolation technique. A firewall is an access control
    scale that is executed when two internal and external networks communicate. It
    allows users'' licensed computers and specific data to enter the internal network,
    preventing hackers on the external network from accessing and attacking themselves
    to the maximum extent.


    In order to prevent Trojans and viruses from invading the Internet, first of all,
    do not download unidentified software and programs, select a reputable download
    site to download the program, and then put the successfully downloaded software
    and programs in addition to the system partition. Other partitions and need to
    use anti-virus software to scan downloaded programs before opening.


    In addition, do not open e-mails and attachments of unknown origin to avoid the
    invasion of mail viruses or bundled Trojans. Even if you download the attachment
    that came with the message, you need to scan it with anti-virus software.


    On the Internet, some hackers use "phishing" methods to scam, such as creating
    fake websites or sending e-mails containing fraudulent information, thereby stealing
    online banking, online payment tools, credit card accounts and passwords, and
    stealing funds from the account. In order to prevent phishing, users must make
    sure that the URL of the private information they enter is the real URL, not the
    phishing website. Do not enter it at will.


    In the LAN, when users share files, there will be software vulnerabilities, and
    hackers will detect these vulnerabilities. Therefore, users must set the access
    password when setting up a shared folder. Unshared should be canceled as soon
    as sharing is de-activated. In addition, when setting up a shared folder, users
    must be careful with the data. The importance of data is unquestionable, no matter
    how security measures are made, it cannot prevent attacks if the hacker is able
    to access the system. Therefore, users must be careful about what they share on
    the network, as it can lead to the hacker to be able to access your data at any
    time and be prepared.


    This guide will focus on the following:

    - Chapter 1 Building A Hacking Environment

    - Chapter 2 Vulnerabilities

    - Chapter 3 Hacking A Windows Computer With Metasploit

    - Chapter 4 Black Hat Hackers

    - Chapter 5 Ethical Hacking For Beginners

    - Chapter 6 Penetration Testing Process

    - Chapter 7 Network Scanning

    - Chapter 8 Post Exploitation

    - Chapter 9 Cybersecurity Entry Level Salary

    - Chapter 10 Data Manipulation Concerns

    - Chapter 11 Cybersecurity Career Potentials

    - Chapter 12 How Reverse Engineering Works


    ## Introduction


    Having an understanding of the techniques used by hackers will allow you to gain
    insight into what is possible. Using this knowledge, you are able to explore further.


    ### Keylogger


    A keylogger is a very simple piece of software that is designed to track and record
    each keystroke made by the user. These keystrokes are then stored on a log file
    that is accessed by the hacker to discern banking details, credit card numbers
    and anything else you input into the machine.


    How do keyloggers access your computer in the first place? These lines of code
    or software are often attached to files downloaded onto your computer without
    you being aware, known as Trojans (deriving from the Greek mythology of the Trojan
    Horse). These files then report back to the hacker with information collected
    from your computer. Other ways that these files can access your computer is if
    they are placed on the computer through direct access or through USB drives that
    you have provided.


    Keyloggers may also find themselves used in white hat purposes such as within
    organizations to ensure that employees are following the correct policies and
    procedures and not engaging in deceptive conduct.


    ### Denial of Service (DoS/DDoS)


    This involves causing a website to become unusable. The site is taken down due
    to the flooding of information and traffic, enough to overload the system as it
    struggles to process all the requests and ultimately crashes. These attacks are
    employed by hackers who aim to disrupt websites or servers that they want to cause
    destruction to for whatever reason or motivation was. For example, a hacktivist
    hacker might take down a website that disagrees with their political views seeing
    it as their moral duty. Whereas a black hat hacker might take down the website
    of a competing organization to disrupt their services and sabotage the efforts
    of them.


    A DoS attack is carried out using tools such as botnets or a network of infected
    systems which are then used almost as an army of zombieified servers to repeatedly
    attack the target service, overloading it. These infected systems are created
    through emails and software which carry a virus and once infected, these zombie
    computers are able to be used at will by hackers. It has been revealed through
    industry data that up to 45% of organizations suffer from DDoS attacks resulting
    in millions of dollars worth of damage each year.


    ### Vulnerability Scanner


    To detect weaknesses within a computer network, hackers use a tool known as vulnerability
    scanner. This could also refer to port scanners which are used to scan a specific
    computer for available access points that the hacker would be able to take advantage
    of. The port scanner is also able to determine what programs or processes are
    running on that particular port.

