    \ the default Hostname “kali” or choose your own]\n*Domain name* >> [this can\
    \ be left blank if not required by your network]\n\n**V. Set up users and passwords**\n\
    *Root password* >> [choose a “root” (administrator) password]\n*Non-root user\
    \ real name* >> [choose an identification name for your non-privileged user account]\n\
    *Non-root username* >> [choose a username for your non-privileged user account]\n\
    *Non-root password* >> [choose a password for your non-privileged user account]\n\
    \nVI. *Configure the clock* >> [choose your time zone]\nVII. *Partition disks*\
    \ >> [\"Guided – use entire disk\"] >> [Choose the install hard drive for your\
