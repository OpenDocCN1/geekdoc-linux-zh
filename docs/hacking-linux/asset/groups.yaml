    ## Rootkits（根内核）


    Rootkits 是可以轻松安装的简单小工具。它们非常有用，因为你可以用它们完美地隐藏各种文件和程序，就像它们从不存在过一样。你甚至可以从操作系统本身隐藏这些文件。由于这项功能，它们主要用于逃避任何杀毒软件并安装后门或记录信息。


    Rootkits 还可以挂钩操作系统与任何软件之间的基础调用。这使得它们甚至能够修改基本功能。想象一下以下场景：你的朋友想检查他的 Windows 上运行着哪些程序和进程，于是他按下
    CTRL + ALT + DEL 打开任务管理器。他看着当时运行的所有软件，然后离开了。他并不知道的是你发送了一个恶意程序并用 rootkit 掩盖了它。通过这种方式挂钩
    rootkit，当他打开任务管理器时，你恶意软件背后的进程就消失了。因此，他没有看到任何异常并离开了。


