    ## Chapter 2 Vulnerabilities


    It doesn’t matter how secure a network is supposed to be; there are going to be
    vulnerabilities that you can use to get into the wireless network. Most of the
    time, vulnerability is going to be a bug that is inside of an application that
    is affecting the security that you have in place to protect yourself. You can
    find these bugs in applications such as BugTraq. The CERT (Computer Emergency
    Response Team) puts out a report every year that tells you how many vulnerabilities
    they find so that people can better protect themselves.


    ### Vulnerability Scanning


    When you can search for vulnerabilities, you are going to be looking for any known
    vulnerabilities that you may be able to exploit on your target''s network.


    ### Nikto


    With Nikto, you are going to be scanning the web so that you can find applications
    that have weak spots along with files that might be dangerous. With this open
    sourced software, you are going to be able to find a version that works with either
    a Linux system or a Windows system. When you are using this program, you will
    be using an interface that works with command lines.


    ### Nessus


    You have probably heard of Nessus since it is one of the vulnerability scanners
    that is known around the world. You are going to be able to use Nessus for free,
    and it can work on almost any operating system. There are plugins that Nessus
    uses that are going to assist in finding the vulnerabilities depending on the
    sort of bug that you are wanting. However, you need to make sure that you keep
    your plugins updated.


    There are also non-intrusive scans that you can do with Nessus that is not going
    to harm the target as an intrusive scan would. These scans are going to require
    that you have the domain name or at least the IP address for your target. With
    this program, you are going to be able to scan the ports so that you can determine
    which programs are running on that network as well as the operating systems that
    are being used.


    After the scan has been finished, a report is going to show all the ports that
    were found to be open and what their vulnerabilities are.


    ### Exploiting Vulnerabilities


    When you take advantage of a bug that is inside of an application, then you are
    going to be sending various commands out that are going to be executed to prevent
    the program from running the way that it is supposed to run. You can do things
    like pass by the authentication that you may need to get onto the network, get
    more privileges than what you currently have access to and more.


    ### Metasploit


    This framework was first released in 2003 and had a specific set of things that
    it allowed the user to do to their target. These things were:


    - Integrating the evasion and encoding process.

    - Making sure that a single database could be exploited through the use of easy
    updating.

    - Having an interface that had options.

    - And combining the exploits with payloads.


    All of these things take place whenever:


    - You use evasion to bypass the security on a device through employing evasion
    techniques.

    - There is a code that is used to exploit the module where the code is located
    so that specific vulnerability can be used.

    - You have to modify the encoding for the payload you receive so that you can
    avoid the limitations that are caused because of the vulnerability that was located.

    - Your payload has a code that has to be sent to a different location so that
    the action can be taken on the vulnerability.

    - When you need to use specific options so that you can select what is hit by
    the payloads and the exploits.


    Using Metasploit is pretty simple because you are going to be following the same
    basic set of procedures each time you use it:


    1. Decide which exploit you want to use

    2. Set up your payload

    3. Choose the IP address you are targeting as well as which port you are going
    to gain entry through

    4. Execute your plan

    5. Evaluate your results

    6. Decide if you can start or restart your procedure


    If you are trying to find the vulnerabilities that are inside of a host, then
    you are not going to want to use Metasploit. Instead, you will want to use a scanner
    that is meant to find all vulnerabilities in the network. If you do not want to
    do that, then you can always use a port scanner so that you can find the open
    points and exploit that.


    With version 3.0 you will have a few different payloads that you can run when
    you are working with vulnerabilities:


    - Meterpreter: with this payload, you are going to be using a command line interface
    that is going to run specifically on Windows.

    - VNC injection: This also runs on Windows, but you are going to get a graphical
    interface to your target, so that is going to be synchronized with the user interface
    that your target is using.

    - Add user: when you add a user, you are going to need to have a specific name
    and password, and the account is going to be required to have administrator permission.

    - File execution: a file is going to be uploaded on the target''s computer, and
    then the file will be run thus running any malicious code that might be inside
    of the file.

    - Interactive shell: there is going to be another command interface that interacts
    with the target carrying out any commands that you give it.


    When working with a VNC connection, you should ensure that you have a large enough
    bandwidth, so your program is running the way that it is supposed to. Along with
    that, you do not want someone to be in front of the computer that you are trying
    to hack. On the off chance that someone is there, then they just have to interact
