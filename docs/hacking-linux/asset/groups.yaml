    ## Chapter 8 Post Exploitation


    The last step of a good penetration test involves access maintenance from a remote
    system. In other words, it’s important to leave a backdoor to the target’s system
    in case you may want to exploit it again in the future. Keep in mind that post
    exploitation is something that companies want to forbid even their hired penetration
    testers from performing. A lot of people are afraid that these backdoors might
    be found by someone with malicious intent, so always make sure you have the authorization
    from the client to proceed with this step.


    Many organizations want a report to know whether post exploitation is possible
    and what risks come with it. They know that nowadays many black hat hackers are
    interested in maintaining the connection and absorbing as much confidential data
    as possible. The days of hacking through a system quickly and taking everything
    in minutes are over. This change in behavior makes it critical for you to understand
    how malicious hackers operate when creating a backdoor.


    But what exactly is a backdoor when it comes to hacking? It is a script or an
    application that the attacker leaves on the target’s computer. This tool will
    run in the background unnoticed and will allow the hacker to connect to the machine
    whenever they want. Keep in mind that a backdoor will only be useful as long it’s
    actively running. In many cases you can lose the access (the shell) when the computer
    is rebooted. However, not all is lost, because you can move your shell to a permanent
    location, and this is done with the help of backdoors.


    In this chapter we will discuss creating and maintaining a backdoor that allows
    us to reconnect to the target’s machine at any time. We will also discuss rootkits,
    which are tools that can perform various tasks stealthily.


