    ## Rootkits


    Rootkits are simple little tools that can be easily installed. They are useful
    because you can use them to hide various files and programs so perfectly, as if
    they never existed. You can even hide these files from the operating system itself.
    Because of this functionality, they are used mainly to escape any antivirus software
    and install backdoors or record information.


    Rootkits can also be hooked on to basic calls between the operating system and
    any software. This allows them to even modify basic functionality. Imagine the
    following scenario. Your friend wants to check what programs and processes are
    running on his Windows computer, so he presses CTRL + ALT + DEL to open the task
    manager. He looks at all the software that is operating at the time and then moves
    on. What he didn’t know is that you sent a malicious program and you masked it
    with a rootkit. By hooking a rootkit this way, when he opened the task manager,
    the process behind your malicious software vanished. Therefore, he didn’t see
    anything out of the ordinary and moved on.


    For the purpose of this book, we will not dive in deeper into the use of rootkits.
    For now, it’s enough to know the basics of post exploitation. Just keep in mind
    that there are ways to cover your tracks and hide files and programs on your target’s
    machine. Their purpose is to hide any backdoors you may leave for later use after
    you exploited the target.


    ## Chapter 9 Cybersecurity Entry Level Salary


    I am not going to lie to you. Most people want to get into cybersecurity because
    it’s sound cool. The next most common thing that people interested in Cybersecurity
