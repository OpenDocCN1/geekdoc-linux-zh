  mdcn: "\n所以，我说我是这家公司唯一的匈牙利人。事实上的确没有学位，是的，但我拥有多个 Cisco、Checkpoint 和安全领域的认证，我最近一直在学习这些内容，并持续不断地进行重新认证。因此，我一直在跟上时潮流，而不是到处跟人说我有一个\
    \ 20 年前的学位。\n\n你可能不记得，但在 20 年前，我们甚至连 Wi-Fi 还没有，所以我可能知道一些他不知道的吗，对吧？而且，我对他说：“我有能力！”\n\
    \n有能力得到我想要的东西。这是因为当我下班后，我会回家继续学习，看视频课程，读书，当然还有听音频书。（顺便说一下，我最喜欢的）。与此同时，其他人回家是玩\
    \ Xbox 或 PlayStation，或者只是在 YouTube 上看猫视频，对吧？ \n\n当然，这比从午休开始就在酒吧里喝酒要好。我也认识那种人，他们已经在那种状态持续了好几年了。我想和你们分享这些，是因为你可能会为自己设定一个可以实现的预期。但如果你把计划告诉给某人（也许是你的最好的朋友），可能会导致冲突，甚至导致他们根本不相信你。有时候，最好把事情留存在心里，只留给自己知道。网络安全领域有多少钱景？\n\
    \n种类非常多。在网络安全领域你能赚多少钱？随你想赚挣多少。你所做的就是设定预期并努力学习。如果你坚持下去，在未来的 5-8 年内，你可以轻松拿到六位数的收入。\n\
    \n## 第 10 章 数据操纵风险\n\n并不是每种攻击都是为了盗窃或破坏现有物质。网络攻击的另一个元素是对现有数据进行操纵，使得机器在用户不知的情况下下一段时间内受到攻击者的控制。当网络犯罪分子在网上发布密码和用户身份时，这一点显而易见，但如果企业数据被修改，这一点就不那么明显了。\n\
    \n考虑到这些攻击没有造成明显的损害，用户检测起来要困难得多；如果他们能注意到的话。尽管即使是最微小的更改也可能对业务运营方式产生严重后果。\n\n根据美国国家情报局局长詹姆斯·克拉珀（James\
    \ Clapper）的话，如果政府官员（无论是军事还是民领域）无法完全信任他们获得的信息，他们所做的决策将受到严重影响。\n\n### 间谍\n\n后门是一个特定的担忧，因为它们很难被识别，并且为框架或整个网络提供了大量的访问权限。被破坏的框架可能让网络犯罪分子或某个国家能够保留和监控信息，并改变过滤数据的能力，甚至更改现有信息。无论框架处于危险状态多久，这种操纵都会一直存在。\n\
    \n例如，2015 年，瞻拓网络（Juniper Networks）发布公告，称其在其产品工具包购买的防火墙网络代码框架中发现了后门通道。这些是随处用于保护企业和政府框架的类似物品。这些间接访问在发现之前持续了大约三年——这意味着无法得知为了黑客的利益，有多多少信息从客户群中被污染、控制或提取了。\n\
