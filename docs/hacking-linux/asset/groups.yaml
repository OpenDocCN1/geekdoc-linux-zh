    \ and for connectivity in penetration testing efforts.\n\nWhether installing Kali\
    \ Linux as a standalone OS or in a multi-boot scheme, the first step in installation\
    \ is to obtain the latest ISO (International Standards Organization compliant\
    \ disk image) from Offensive Security and copy it to an external medium. A list\
    \ of the latest releases can be found at www.kali.org/downloads/\n\nIt is recommended\
    \ that ISO images be obtained from the developer, and not from a third party or\
    \ file-sharing source, to ensure the integrity of the code. The ISO is available\
    \ in 32 bit and 64 bit versions depending on the processor architecture of the\
    \ host machine. Note that the 64 bit version will not run on a 32 bit processor.\
    \ You can download the ISO directly from the corresponding link or through the\
    \ torrent link if you have torrent client. An *SHA1Sum* hash is given for each\
    \ ISO file. Once the file has been downloaded, its hash can be read using *checksum*\
    \ software and compared to the given string. If the strings do not precisely match,\
    \ then the file is compromised and should not be used. This checksum procedure\
    \ guards against corrupted downloads or ones that have been hijacked (no honor\
    \ among thieves!).\n\n### Standalone Installation\n\nBefore beginning a standalone\
    \ Kali Linux installation, it is important to understand that the procedure will\
    \ *overwrite all existing data on the host drive*. This includes the previously\
