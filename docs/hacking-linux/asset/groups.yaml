    ## 在虚拟机上安装 Kali Linux


    处理器速度的进步、多核和多处理器芯片的出现、内存容量的增大以及数据存储的增加使得硬件虚拟化成为在单一计算设备上运行多个软件平台的可行且实用手段。在虚拟机中运行操作系统具有优势，因为它消除了对多台昂贵硬件的需求，并使得使用
    Kali 这种高度专门的发行版变得可行。此外，在单主机上使用渗透测试软件允许黑客在安全的“沙箱”环境中练习攻击，目标是主机内的其他各种虚拟机。在虚拟机中使用操作系统的缺点是会竞争主机的资源，且虚拟硬件能力受限于主机的性能。


    目前有免费的、功能且功能丰富的虚拟机软件。最常见的免费虚拟机程序是 *Virtualbox* 和 *VMware Player*（具有附加功能的商业版本）。*QEMU*
    是一个仅运行在 Linux 上的开源选项。本书将使用 Virtualbox 来演示虚拟 Kali 的安装，因为它适用于 Windows、Macintosh、Linux
    甚至 Sun 系统。


    ## 安装虚拟化软件


    Virtualbox 是一款流行的多平台开源虚拟机应用程序。安装步骤如下：


    1. 确保满足最低规格

    Virtualbox 设计用于运行在 *x86*（Intel 或 AMD 芯片等）架构上，建议主机至少拥有 1 GB 内存。此外，主机应留有足够的可用硬盘空间以容纳你打算安装的任何虚拟机操作系统。


    2. 启用硬件虚拟化

    如果你使用 Windows 或 Linux 主机电脑，请重启电脑并进入 BIOS 菜单。导航到虚拟化选项（菜单因电脑而异）并确保其已启用。退出 BIOS 菜单时务必保存
    BIOS 设置。


    Macintosh 硬件不以“PC”电脑相同的方式使用 BIOS。如果尚未启用硬件虚拟化，必须通过终端应用程序中的命令行设置。这是一项需要 root 权限的高级程序，且命令语法在不同
    Mac OS 版本之间可能有所不同。请你的文档或制造商以在 Macintosh 硬件上启用虚拟化。


    3. 下载安装文件

    可以在（图 5）获取最新的源码和二进制发行版：https://www.virtualbox.org/wiki/Downloads


    *Windows*

    “Windows hosts”链接提供一个 .exe 二进制 Windows 安装文件。Virtualbox 网站文档列出了当前版本支持的 Windows
    版本。


    ***Macintosh OS X***

    “OS X hosts”链接提供一个 .dwg Mac OS X 磁盘映像文件。


    *Linux*

    “Linux distributions”链接将打开一个新页面，列出适用于不同 Linux 发行版的各种 Virtualbox 包。然而，建议通过你个人 Linux
    发行版的包仓库下载并安装 Virtualbox（参见步骤 4）。


    4. 安装 Virtualbox


    *Windows*

    打开 Windows 可执行安装文件将启动一个典型的 Windows 安装“向导”对话框。遵循安装说明。安装选项和额外的应用程序选择取决于你的个人偏好。


    ***Macintosh OS X***

    打开 .dwg 磁盘映像将挂载该映像并打开一个包含 Virtualbox “.mpkg”OS X 安装文件的窗口。启动 .mpkg 文件开始安装并遵循说明。安装选项和额外的应用程序选择取决于你的个人偏好。


    ***Linux (基于 Debian 的衍生)***

    大多数现代 Linux 发行版都是原始 Debian 和 Fedora（例如 Red Hat）内核的派生版本。为了说明在 Linux 操作系统上安装 Virtualbox，以下步骤描述了适用于
    Ubuntu Linux（一种 Debian 派生版）系统的安装过程。其他 Linux 发行版的安装在语法和仓库位置上可能有所不同。这些步骤适用于大多数更新的
    Debian 版本。


    使用软件中心从 Ubuntu 仓库安装 Virtualbox：

    I. 从启动器菜单打开“Ubuntu 软件”应用程序。

    II. 在顶部的搜索行中输入“virtualbox”。VirtualBox 应该出现在结果包列表中。

    III. 点击 VirtualBox 包旁边的“安装”。

    IV. 如果提示，输入你的密码以验证 root 权限。

    V. 安装将自动进行一会。


    使用命令行从 Ubuntu 仓库安装 VirtualBox：

    I. 打开名为“终端 (Terminal)”的 Ubuntu 命令行控制。

    II. 输入以下命令更新软件仓库（如果提示则输入 root 密码）：

    ## sudo apt-get update

    ## sudo apt-get install virtualbox

    III. 安装将自动进行一会。


    ## 从磁盘或 ISO 安装 Kali Linux 虚拟机


    一旦安装了虚拟化软件，就可以在主机上作为虚拟机安装 Kali Linux。本示例将再次使用 VirtualBox 来演示该过程：


    I. 在你的主机上打开 VirtualBox。

    II. 点击“新建 (New)”创建一个虚拟机。

    III. 遵循“创建虚拟机”向导对话框，使用下方列出的推荐参数：

    a. 名称和操作系统

    *名称* >> [Kali Linux]（或你选择的任何名称）

    *类型* >> [Linux]

    *版本* >> [Debian (64-bit)]（适用则选择 32 位）

    b. 内存大小 >> [1024 MB]

    c. 硬盘 >> [创建一个虚拟磁盘]

    d. 硬盘类型 >> [VDI (VirtualBox 磁盘映像)]

    e. 物理硬盘上的存储 >> [动态分配]

    f. 文件位置和大小 – 使用默认磁盘文件名。建议为虚拟驱动器分配 10 GB–20 GB。

    IV. 你创建的 Kali 虚拟机现在将出现在 VirtualBox 主窗口的虚拟机列表中。V. 通过通过设置选项和选项卡设置以下推荐设置（根据需要更改其他选项）：

    a. 系统 >> 处理器 >> [2 或更多]

    b. 系统 >> 扩展功能 >> [启用 PAE/NX]

    VI. 在“存储 (Storage)”设置中，在存储树中突出“空 (Empty)”IDE 控制器磁盘。在“属性 (Attributes)”下，点击“光驱”磁盘图标并导航到本文开头下载的
    Kali Linux .iso 文件位置。点击“确定”保存并关闭设置。

    VII. 在 VirtualBox 主窗口中，选中 Kali 虚拟机，点击“启动 (start)”启动虚拟机。

    VIII. 将打开一个新窗口，进入 Kali 的初始启动界面。在步骤 5IX，“在硬盘上安装 GRUB 引导程序”上，务必选择在虚拟机安装期间创建的虚拟 Kali
    驱动器。完成剩余的安装步骤。


    ## 安装预配置的 Kali 虚拟机


    某些操作系统虚拟机提供了针对特定虚拟化应用程序的预配置版本。这些被称为*设备镜像 (appliances)*，允许用户跳过大量的设置工作。要在 VirtualBox
    上安装 Kali 设备镜像，请遵循以下步骤：


    I. 访问 Offense Security 下载页面：www.kali.org/downloads/ 并点击“Kali Virtual Images”。

    II. 下载“Kali Linux 64 bit VM”（如果对你的硬件需要则下载 32 位）。将下载的文件内容解压到你指定的目录。

    III. 打开 VirtualBox 并从文件菜单中选择“导入设备 (Import Appliance)”。

    IV. 导航到包含“.vbox”文件的目录并选择你所需的设备。

    V. 点击“下一步 (Next)”进入设置页面并进行任何所需的更改，然后点击“导入 (Import)”。这将完成虚拟机安装。


