    \ a standalone installation are as follows:\n\n1) Ensure minimum hardware and\
    \ chip architecture\nCheck that your host machine meets the minimum hardware requirements\
    \ for Kali (currently 10 GB storage and 512 MB RAM) and that it can support a\
    \ 64 bit installation (if not, use the 32 bit version).\n\n2) Back up any files\
    \ on the host hard drive\nSince the installation will overwrite any existing data\
    \ on the host hard drive, transfer or back up any needed files or settings (i.e.\
    \ to a cloud drive, flash drive, CD, DVD, or external HDD).\n\n3) Ensure proper\
    \ boot order\nRestart your host machine and enter the BIOS menu. The boot order\
    \ can be changed to another setting, if desired, after installation. Be sure to\
    \ save BIOS settings upon exiting the BIOS menu.\n\n4) Load the ISO\nAfter altering\
    \ the BIOS, completely shut down the host machine, insert the optical or USB medium\
    \ that contains the ISO, then power the computer back on. It may take a few moments\
    \ for the Kali boot menu to appear.\n\n5) Follow the installation instructions\n\
    When the Kali boot menu appears, select the *Graphical Install* option. The following\
    \ installation steps include general recommended options for beginning users of\
