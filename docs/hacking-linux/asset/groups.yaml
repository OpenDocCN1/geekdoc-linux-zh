- md: "\nhacker to capture data packets which may contain critical information such\
    \ as passwords and other records.\n\n## Chapter 1 Building A Hacking Environment\n\
    \nIn order to begin wireless hacking, one must first set up a proper environment\
    \ for their tools, beginning, of course, with the installation of Kali Linux.\
    \ There are three chief categories for installation of Kali Linux, depending on\
    \ the needs and hardware of the user:\n\n1) Hardware installation\n   - Standalone\n\
    \   - Dual/Multi-boot\n2) Virtual installation\n3) External media installation\n\
    \nEach type of installation has its own pros and cons, and the best choice depends\
    \ mostly on the intended use of the software. Kali was not written to be an “everyday”\
    \ consumer product with the typical software enjoyed by casual users, so installing\
    \ it as a standalone OS on a personal computer is only practical if that particular\
    \ machine will be dedicated to penetration testing activities. Alternatively,\
    \ Kali can reside on the hard drive in a dual-boot or multi-boot scenario with\
    \ other OS installations if space permits.\n\nOften, Kali Linux is installed within\
    \ virtualization software inside of another OS, be it Linux or otherwise. This\
    \ arrangement consumes more resources, but affords the hacker some more flexibility\
    \ and allows him to practice attacks on other virtual machines within the host.\
    \ Kali can also be used as a bootable “live” OS when installed on an removable\
    \ external medium such as a CD-ROM or USB flash drive. Since optical disk readers\
    \ are becoming exceedingly less common, a USB medium is more practical for external\
    \ installations. An advantage of a live distribution is that it can be used on\
    \ multiple machines and some of the digital forensic tools included with Kali\
    \ Linux are best run outside of the boot structure of a target machine. This chapter\
    \ will focus on the hardware and virtual installation procedures.\n\n### Installing\
    \ Kali Linux On A Hard Drive\n\nThe latest versions of Kali Linux have the following\
    \ minimum requirements for a host machine:\n\n1) 10 GB Hard Drive (20 GB recommended)\n\
    2) 512 MB RAM (1 GB recommended)\n\nThe user will also need either a USB port\
    \ or a CD-ROM drive to boot the installation. It is recommended that the host\
