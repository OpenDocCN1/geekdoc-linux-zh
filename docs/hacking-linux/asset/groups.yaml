    \n### 云端担忧\n\n来源：HTTPS://WWW.SECURITYTECHHAWAII.COM/CYBERSECURITY\n\n正如任何有效的创新一样，它越流行，作为目标的吸引力就越大。云已成为一种根深蒂固的服务模式和理念，因为没有少数组织依赖于云管理来完成任务。例如，对于将数据外包的企业来说，安全性要求可以降低，因为可以依靠云的优势，即安全性由供应商负责。尽管如此，它还把云优势作为最合理的方案整合在了一起。\n\
    \n但存在一个微妙的问题，即主权。云信息的安全并不仅仅等同于加密。此外，访问信息的趋势是在境外进行的。网页可能对此有特定的考量，但这些信息——在传统世界设置中——可能会受到外国法律的约束。事实上，即使依赖于另一个国家的法律，也无法保证他们不会更改事先受保护的信息。信息可能会被不同的政府部门传唤和检查，或在未经许可的情况下被外部人员共享。在今年俄罗斯的一个特殊案例中，互联网服务提供商（ISP）被要求存储通信的内容和元数据，并为任何编码的信息提供加密密钥。任何通过\
    \ ISP 的云信息都可能被俄罗斯政府和情报部门破译。这导致主流 VPN 必须关闭其俄罗斯节点。在其中一个案例中，服务器根据规定从 VPN 供应商处被收购。云服务预计在未来十年内增长\
    \ 18%，围绕其神圣性的担忧可能会随之全面增加。*\n\n### 解决云安全问题\n\n要做的第一件事就是提供端到端加密。这种加密只有在无延迟的情况下才能成功，这确保了性能在此不会受到负面影响。公司还必须获得密钥的全所有权以有效地实施加密。尽管某些公司对服务提供商管理安全密钥持有积极态度，因为这减轻了管理问题的压力，但也存在缺点。第三方提供商将被要求向政府交付数据，因此他们将失去对文档安全的控制。要问的问题是否存在一种折中方案，允许人们避免控制权的丢失。\n\
    \n另一种方案是允许加密密钥的所有者有能力解密用于公共服务上的密钥。使用这种模型，他们可以拥有密钥和硬件。另一种选择是保持硬件留在本地。这意味着元数据和数据都在本地，为那些将安全视为首要任务的公司提供了保障。\n\
    \n任何公司选择的路线都是根据最适合业务的方法来决定的。虽然某些公司由于其规模和灵活性，倾向于拥有密钥（随业务变化而提供），但也有人如果将控制权交给第三方就会满意。这种策略将根据所需的控制程度以及适应的能力来决定。另一个方面是拥有\
    \ 100% 数据留存控制，这是所有公司的需求。\n\n随着地区和国家层面监管级的不断增加，数据留存变得越来越重要。这个问题在欧洲尤为突出，考虑到欧盟的成员国。许多跨国公司都有将数据留存标准化为单一解决方案的目标。对于在不同地区设有办公室的公司，符合国际法规是必须的。尽管如此，一家在欧洲有不同办公室的美国公司将不得不遵守英国规定和欧盟的规定。在美国，州法也可能适用。在欧洲，某些国家必须根据数据产生的管辖区保留数据。\n\
    \n为了使问题复杂，不同类型的数据有不同的需求，这决定了数据可能托管的地方以及必须采取的方法。企业可能需要两个解决方案或者只需要一个允许其符合所有形式数据的。由于法规的变化是不可避免且定期的，企业必须拥有数据存储或对留存拥有控制权。在适应变化的法规方面具有灵活性将对公司有利。法规的变化需要经过仔细考虑并纳入企业的战略规划中，以便在情况变化时留有余地。\n"
