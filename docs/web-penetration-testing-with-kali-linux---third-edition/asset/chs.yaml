  \n\n\n\n最近几个月，全球范围内频传大规模数据泄露、滥用应用程序功能生成虚假信息，以及收集用户信息并出售给广告公司的新闻。人们开始更加关注他们所信任的公司如何使用和保护他们的信息。因此，公司需要采取积极行动来防止此类泄露或攻击的发生。这通过多个方面来实现——从开发过程中更严格的质量控制，到检测到事件时的公关和媒体存在感管理。\n\
  \n由于目前的方法论使得开发周期更短且更具动态（多种技术的复杂性不断增加）*（（注：为了清晰已微调语法；原句结构不完整。）*。此外，一些继承的糟糕实践意味着，由于开发者首要任务是按时交付可用的产品，他们无法从安全角度对\
  \ Web 应用程序进行完全测试。**Web 应用以及开发过程本身的这种复杂性，产生了对专业安全测试人员的需求，他们参与流程并负责对应用程序进行测试，特别是易受点。这些专业人士将成为渗透测试员。**\n\
  \n`/* 上述段落已根据指令重构；在需要的地方删除了缩写/粗体。保留了原意.*/`\n\n## 本书目标读者\n\n我们编写本书时考虑了多类读者的需求（计算机科学专业的学生、想要获取信息安全前沿知识的开发者、系统管理员，或希望在这些领域追求职业的人，他们发现基础概念易懂，遵循指令即可在自己的实验室进行首次渗透测试，以及继续练习学习的基础工具）。）。\n\
  \n应用程序开发者与系统管理员还将学习真实世界中的攻击者行为（考虑构建和检测有害场景的针对性方面等等……）。\n\n资深专业人士将学习中级和高级利用技术，结合多个漏洞以实现复杂的攻击发起……\n\
