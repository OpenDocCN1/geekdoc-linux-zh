  md: "# Tutorial\n\n# Manipulate and convert data in R\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_0.png)\n\
    \nMihalis Tsoukalos is a Unix administrator, a programmer for Linux and iOS, a\
    \ DBA and also a mathemataician. He has been using Linux since 1993\n\n# Resources\n\
    \n+   - R project  \n+   r-project.org\n+   - RStudio  \n+   bit.ly/tVLtmIgA\n\
    +   - Zoo package  \n+   bit.ly/0v0Whd\n+   - Chron package  \n+   bit.ly/1thCiq\n\
    \nRight This is the environment of RStudio, a powerful and useful IDE for R\n\n\
    Learn how to use R to easily and effectively manipulate various kinds of data\n\
    \nThe R software deals, processes and visualises data all the time – it is something\
    \ that can give value to your data. However, what is the point of visualising\
    \ data if you cannot transform, manipulate and change your data whenever you want,\
    \ any way you want?\n\nThis article will teach you many different ways to manipulate\
    \ and transform your stored data within R. This is very important because most\
    \ of the time the information you want is hidden somewhere and waiting for you\
    \ to find it. Additionally, when you have problems with data, it is often a matter\
    \ of data being in the wrong mode or class in relation to the task you are trying\
    \ to perform.\n\nThe first thing that you should remember is that the index of\
    \ the first element in R data types is one instead of zero.\n\nIf you would prefer\
    \ to use an IDE instead of the command line version of R then you can download\
    \ the open source version of RStudio from bit.ly/tVLtmIgA, but RStudio is not\
    \ necessarily required in order for you to follow this tutorial. Nevertheless,\
    \ you will still benefit from knowing how to install, run and quit R, as well\
    \ as how to type commands to its command line environment.\n\n# 01 The various\
    \ types of data in R\n\nR supports various types of data, and each type has unique\
    \ characteristics and properties. This part of the tutorial will introduce you\
    \ to the most important data types for handling groups of data. A list is a generic\
    \ vector containing other objects and a vector is a sequence of data elements\
    \ of the same basic type. A data frame is a list of vectors of equal length that\
    \ is primarily used for storing data tables. It is used a lot in R and is equivalent\
    \ to the concept of a table. An array is a multidimensional object. A matrix is\
    \ a two-dimensional array that contains numeric data; it has rows and columns.\n\
    \nThe model() function returns the mode of an object whereas the class() function\
    \ returns the class of an object. Both functions can be very useful when you do\
    \ not know the kind of R object you have.\n\n# 02 Import data in R\n\nUsually,\
    \ you do not write your data yourself; most of the time you will get your data\
    \ from external sources, including text files, databases and the Internet. The\
    \ reading\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_1.png)"
  merge: -1
  img_proc: true
- pgno: 36
  md: "of external data is made with the help of the **read.table()** function that\
    \ returns a data frame. If you want to read an external text file, you can use\
    \ the following command:\n\n```\n```R\n> myData <- read.table(\"./data.txt\",\
    \ header=FALSE)\n```\n```\n\nIf you set the header parameter to TRUE, it is assumed\
    \ that the first line of your input will contain the names of the variable. Remember\
    \ that depending on the format of the external data, you should use the appropriate\
    \ data type to hold your data or transform it to the desired format.\n\n# **03\
    \ Create and use random data**\n\nBeing able to get and work with random numbers\
    \ is great for testing various methods and techniques. Therefore this step will\
    \ teach you ways to get random data in R. The following returns ten floating-point\
    \ numbers from 0 to 100:\n\n```\n```R\n> runif(10, min=0, max=100)\n```\n```\n\
    \nThe next variation returns ten integers between 0 and 100:\n\n```\n```R\n> floor(runif(10,\
    \ min=0, max=101))\n```\n```\n\nPlease note that the maximum number cannot be\
    \ returned, so putting 101 as the value of the **max** parameter ensures that\
    \ the integer number 100 can be returned.\n\nIn case you want to generate the\
    \ same sequence of random numbers again, you can use the **set.seed()** function\
    \ as follows:\n\n```\n```R\n> set.seed(123)\n> runif(10, min=0, max=100)\n```\n\
    ```\n\nAs you can see in the image, you must run **set.seed()** before executing\
    \ the **runif()** function.\n\n> “The first thing that you should remember is\
    \ that the index of the first element in R data types is one instead of zero”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_36_0.png)\n\nThere is a function called\
    \ **sample** that shuffles the contents of an existing vector into a random sequence\
    \ without changing the actual numeric values:\n\n```\n```R\n> a <- floor(runif(3,\
    \ min=0, max=100))\n> sample(a)\n[1] 57 89 10\n> sample(a)\n[1] 89 10 57\n```\n\
    ```\n\nIf you put a second argument to **sample**, you can specify the size of\
    \ the sample that is going to be returned.\n\n```\n```R\n> myData <- read.table(\"\
    ./data.txt\", header=FALSE)\n> system(\"cut ./data.txt\")\n10 a1 c1\n20 a2 c2\n\
    30 a3 c3\n40 a4 c4\n50 a5 c5\n> myData\n      V1 V2 V3\n1 10 a1 c1\n2 20 a2 c2\n\
    3 30 a3 c3\n4 40 a4 c4\n5 50 a5 c5\n> class(myData)\n[1] \"data.frame\"\n> mode(myData)\n\
    [1] \"list\"\n> ```\n```\n\nLeft Here’s the output from Step 2, where we read\
    \ our table for data"
