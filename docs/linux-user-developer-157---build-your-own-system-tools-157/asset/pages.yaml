  md: "# ## GAMES WITHOUT FRONTIERS\n\nFrom this year’s latest to timeless classics,\
    \ Wine helps gamers preserve their collections on Linux\n\n# **Modern games**\n\
    \nIn the past, a lot of effort went into getting the Windows version of Steam\
    \ on Linux. This was in order to bring the last few non-Linux games, such as *Terra*,\
    \ to the Linux desktop. Now that almost every popular Steam game is on the Linux\
    \ version, or on its way there, the gamer’s biggest need from Wine is to get games\
    \ like *FIFA 15* working. To get that and other EA games such as *Sims 4* on your\
    \ Windows-imitating PC, the first step is to install EAs downloader – Origin.\n\
    \nGetting the OriginThinSetup.exe file from **origin.com/download** is the first\
    \ (and easiest) step. In fact, installing from the non-thin predecessor to OriginThinSetup.exe\
    \ was much easier on Wine, but EA doesn’t make that available any more and you\
    \ really don’t want to be trying an old copy from a dodgy download site.\n\nPrecise\
    \ instructions will vary with your distro. Wine version, what EA has done to the\
    \ installer and depending on the direction in which the wind is blowing.\n\nThe\
    \ best way of getting this installed actually involves going through the motions\
    \ of installing it, after which the install fails. You then go to a fresh install\
    \ on a Windows computer to grab the folder **C:\\Program Files (x86)\\Origin**,\
    \ install this over the top of your Origin folder in your Wine or PlayOnLinux\
    \ directory, then run **Origin.exe** through Wine. This one worked well, enabling\
    \ us to then install *FIFA 15*, but it’s unsatisfactory as you may not have access\
    \ to a fresh Windows installation of Origin.\n\nOn a good day, you may have better\
    \ luck with the **dotnet35** library, **directx9**, various fonts, **msxml3**\
    \ and **lic32-libxml2** than me did. But with the older **OriginSetup.exe**, it\
    \ can definitely work!\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_30_0.png)\n\
    \n# **Classic games**\n\nNot everyone wants to run the latest releases, with their\
    \ ever-hungrier demands for faster systems. After all, we have consoles for that\
    \ – and Steam’s efforts have brought a richness to the choice of games for Linux\
    \ users. But permit a little nostalgic recollection of the titles of yesteryear\
    \ and the lure of *Railroad Tycoon*, *Monkey Island* or *Age of Empires* could\
    \ see you hunting out dusty CD-ROMs from the attic and seeing how well Wine works\
    \ with software intended for Windows 98 or even earlier.\n\nWe started out our\
    \ test with the original *Dungeon Keeper*. Advertised for Windows 95 or DOS, it\
    \ actually runs on DOS and Wine turned out not to be necessary – install DOSBOX\
    \ for that one if you still have a copy. Moving through our 90s discs, we fished\
    \ out *Baldur’s Gate*, a sophisticated and absorbing implementation of classic\
    \ *Dungeons & Dragons* that you probably shouldn’t install without first emptying\
    \ your calendar.\n\nRight-clicking the **SETUP.EXE** file on the CD-ROM brings\
    \ up the option to open with Wine, but simply clicking it will work from most\
    \ distros (or run it as the command line). In winecfg, we set Windows 95 as the\
    \ OS and left graphics at the default values. As the installation rolled by, options\
    \ such as “200MHz or faster processor” reminded us just how far back in time we\
    \ were travelling.\n\nEverything went flawlessly, as you can see below, and *Baldur’s\
    \ Gate* duly appeared in the Wine menu. This is also a game that you could to\
    \ on the stable version of Wine. We don’t have time to tell you more, however,\
    \ as there’s treasure waiting in that dungeon...\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_30_1.png)\n\
    \n> **Bottom left** Wine works with most newer games, but EA’s Origin platform\
    \ can be capricious\n> \n> **Bottom right** Classic Windows games can easily be\
    \ resurrected and added to the party"
  merge: -1
  img_proc: true
- pgno: 31
  md: '# RESCUE ITUNES CONTENT


    > If you really need iTunes then forget the confusing online advice and follow
    PlayOnLinux’s Wizard


    Recent bloat to iTunes has seen it grow from the relatively light, focused, powerful
    music library app of the early days, to a tottering mass of *scarcely needed functionality*
    that is the **multimedia equivalent of MS Office**. There are plenty of Linux
    alternatives to iTunes now, although almost all have their drawbacks. Nevertheless,
    for users with purchased media trapped inside Apple’s walled garden, iTunes has
    its advantages and many Linux users need access to it without having to dual boot.


    Unfortunately, running iTunes on Wine is not always easy and many go to the extent
    of keeping a Virtual Machine (VM) on standby, running a recent OS X or Windows
    version just to run iTunes.


    There is a mass of contradictory information only a web search away on installing
    iTunes with Wine. We tried following some, adding in various libraries, such as
    libmwx13, ncal220 and dotnet40 through winetricks and Winecfg, then through PlayOnLinux’s
    library loader. The best we got was successfully installing a greyed-out box,
    although some menus were accessible. Even starting again after `winetricks gdi32`,
    which downloads 600MB of graphics library, didn’t fix it.


    Then we forgot about the postings online saying what we should do. We just sat
    back and trusted PlayOnLinux. After clicking install, instead of selecting non-listed
    software, we went to the MultiMedia menu and clicked iTunes 12 (see the bottom-left
    image). We also downloaded the 32-bit installer from Apple, even for our 64-bit
    test rigs.


    PlayOnLinux warned us about what wouldn’t work: syncing with iDevices, although
    there are plenty of native Linux apps that will talk to Apple music hardware (on
    a good day at least). Then, as on our Photoshop installation, PlayOnLinux’s Wizard
    did all of the hard work, including selecting Wine 1.7.48 as the one known to
    work by that particular installer’s creator, and `wine_gecko` for rendering the
    web interface to Apple’s iTunes store. Then it fetched various other service packs
    and libraries. iTunes started successfully on all three test machines.


    As reported, plugging in an iPod or iPhone didn’t work and managing a music collection
    was hit or miss, as very large disks of multimedia files could crash the program.
    However, we could visit the iTunes Store to spend our hard-earned cash and, best
    of all, iTunes has a vast selection of specialist Internet radio stations. We
    spent a happy evening listening to bebop on **calmradio.com** – available on iTunes
    without a membership login – and all that jazz.


    # Registry surgery


    Wine can call its own registry for you, functionally similar to the Windows software
    of the same name, if editing the Windows registry is really necessary. One of
    the advantages of running under Wine is that you won’t make your system unstable
    if you go badly wrong, and a backup of `~/.wine` or the PlayOnLinux equivalent
    (location) can mean not even losing the emulated installation either. The files
    edited live in `$WINEPREFIX\*\ REG, but should not be directly edited as special
    encoding is used to store keys. From regedit, `HKCU_CURRENT_USER\Software\Wine`
    is likely to be your main focus. Under this, for example, at `MSHTML\GeckoUrl`,
    which is the location of Wine Gecko, you create a new **SWINEPREFIX**. Changing
    the registry entry to somewhere local, like `file:///Z/` path/to/wine_gecko/`,
    means no unnecessary downloads.


    The most useful keys to modify are listed with useful explanations at: wiki.winehq.org/
    User/Registry.


    **Above** Always check the PlayOnLinux menus to see if your desired software is
    already listed

    **Right** iTunes will struggle to manage large music collections, but at least
    you can get to your Store-bought goods


    ![](img/e7f197876caa0b235fb5da2d16a578ea_31_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_31_1.png)'
