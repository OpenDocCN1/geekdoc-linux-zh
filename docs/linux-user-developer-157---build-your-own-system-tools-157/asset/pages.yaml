    \ passwords and general text\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_85_1.png)\n\
    \nAbove *There is no lengthy, overly curious sign-up process — just pick a username\
    \ and password*\n\n# SECURITY\n\n# Encryptr\n\nPowered by SpiderOak’s zero-knowledge\
    \ cryptographic technology, is *Encryptr* the solution to secure cloud-note storage?\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_85_2.png)\n\n+   - *DEB packages*\n\
    +   32-bit and 64-bit\n+   \n+   - *Alternative clients*\n+   Windows and OS X\n\
    +   \n+   - *Mobile client*\n+   Android (iOS TBA)\n+   \n+   - *Available from*\n\
    +   encrypt r.org\n\nIf you have an interest in security, it's likely you'll be\
    \ familiar with SpiderOak – *whistleblower Edward Snowden's backup tool of choice*\
    \ – and its Crypton framework. Based around the concept of 'zero knowledge', SpiderOak\
    \ uses the Crypton JavaScript framework to encrypt the user's data in such a way\
    \ that it is impossible for the server to access. Consequently, it neatly solves\
    \ the biggest issue with cloud storage, namely having to trust someone else with\
    \ your data.\n\nSpiderOak employee Tommy Williams is intimately familiar with\
    \ the benefits of Crypton and has launched a new software package based on the\
    \ framework: Encryptr. Where SpiderOak offers secure, remote storage of arbitrary\
    \ data, Encryptr is more tightly focused: it offers a secure cloud storage facility\
    \ for short textual notes, credit card details and passwords.\n\nThe Encryptr\
    \ client is open source and cross-platform: Williams has released 32-bit and 64-bit\
    \ binary builds for Linux, DEB packages and clients for both Windows and OS X\
    \ machines.\n\nFor mobile users, there's already an Android client and work on\
    \ an iOS version is also nearing completion. It's also lightweight: the 64-bit\
    \ build, installed on an Ubuntu Linux system, took up less than 15MB when fully\
    \ loaded.\n\nLike SpiderOak, Encryptr's biggest selling point is the zero-knowledge\
    \ cryptography provided by the Crypton framework. The Crypton concept is that\
    \ the asker should never know what the data that it is being asked to store is:\
    \ everything bar storage and retrieval is entirely client-based, including the\
    \ encryption and decryption process. This provides a layer of security many similar\
    \ services can't hope to match: even if the server is attacked or the company\
    \ itself is dragged through the courts, there is theoretically no way for the\
    \ data on Encryptr to be decrypted and viewed without the original password.\n\
    \nGiven the data Williams expects users to store in Encryptr, that's a good thing:\
    \ the current release"
