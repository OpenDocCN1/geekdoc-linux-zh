- pgno: 62
  md: "# Visualise music\n\nThis project also works with line-in, which the Pi doesn't\
    \ have, so a USB sound card is ideal.\n\n**02  Disable built-in sound card**\n\
    We had issues getting the Raspberry Pi's built-in sound card to work reliably\
    \ for sound output with PyAudio. This project also works with line-in, which the\
    \ Pi doesn't have, so a USB sound card is the ideal solution. We will disable\
    \ the built-in card so that the default card is the USB one. To disable the built-in\
    \ card, you need to do the following:\n\n```\nsudo rm /etc/modprobe.d/alsa*\n\
    sudo editor /etc/modules\n```\n\nChange snd-bcm2835 to #snd-bcm2835 and save.\n\
    \n```\nsudo reboot\n```\n\n**03  Test the sound card output**\nIf you're using\
    \ the Pi to play audio rather than a line-in, then you'll want to test the output.\
    \ Type alsa mixer and then make sure the volume is set to a comfortable level.\
    \ If you are plugging speakers in, then set to 100%. Then type speaker-test; this\
    \ will generate pink noise on the speakers. Press Ctrl+C to exit if you're happy\
    \ it's working. Sadly, there's no easy way to test a line-in signal. It will be\
    \ obvious if it's working once the software has written.\n\n**04  Construct the\
    \ circuit**\nWe are using GPIO pins 20, 21 and 16 for red, green and blue, respectively.\
    \ These pins go through a 220Ω resistor to the first pin of the transistor (base).\
    \ The second pin (collector) goes to one of the red, green or blue LED-strip pins.\
    \ The third pin (emitter) goes to ground. The ground from the DC jack needs to\
    \ be connected to the same ground as the Pi. Connect the 12V from the DC jack\
    \ to the strip. When connecting the wires, ensure the wires aren't touching. If\
    \ anything shorts, that would be bad. Ideally, this circuit would go on a stripboard\
    \ and be soldered to the LED strip.\n\n**05  Start the script**\nCreate a file\
    \ called ledstrip.py and mark it as executable. Then begin editing with your favourite\
    \ editor:\n\n```\ntouch ledstrip.py\nchmod +x ledstrip.py\nvim ledstrip.py\n```\n\
    \n**06  Add imports**\nAfter adding the shebang (#!) line, you'll need to add\
    \ the imports. The GPIO library is used for sending signals to the LED strip.\
    \ Randrange is used to generate random colours. PyAudio is the audio library.\
    \ Wave is used to read WAVE files. From SciPy, butter is the filter type that\
    \ we're using, lfilter is used to apply the filter and freq gets the frequency\
    \ response. Matplotlib is used to plot the frequency response of the filters and\
    \ NumPy is used for fast-math operations on arrays. The back-end of NumPy is written\
    \ in C, which means it's faster than Python when doing the same operation on a\
    \ large data set.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_62_0.png)\n\n# Full\
    \ code listing\n\n```\n#!/usr/bin/env python2\n\nimport RPi.GPIO as GPIO\nfrom\
    \ random import randrange\nimport time\nimport pyaudio\nimport wave\nfrom scipy.signal\
    \ import butter, lfilter, freqz\nimport matplotlib\nimport matplotlib.pyplot as\
    \ plt\nimport numpy as np\nimport sys\n```\n\n```\n# How many bytes of audio to\
    \ read at a time\nCHUNK = 512\n\nclass LedController:\n    def __init__(self,\
    \ pin_nums):\n        # pin_nums is an R, G, B tuple\n        # Initial setup\
    \ of GPIO pins\n        GPIO.setmode(GPIO.BCM)\n        # Set each pin as an output\
    \ and create a pwm instance\n        self.pins = []\n        for p in pin_nums:\n\
    \            GPIO.setup(p, GPIO.OUT)\n            # Create a pwm instance for\
    \ the pin at a\n            # frequency of 200Hz\n            self.pins.append(GPIO.PWM(p,\
    \ 200))\n        # Set each pin to a random brightness to begin with\n       \
    \ self.pins[-1].start(randrange(0, 100))\n\ndef set_colour(self, colour_tuple):\n\
    \    # Takes a colour tuple in the form (R, G, B) where the\n    # values are\
    \ from 0 to 255 > 255 is capped\n    for i in range(0, 3):\n        # Scale 0\
    \ to 255 to a percentage\n        scaled = int(colour_tuple[i] *\n           \
    \         (100.0/255.0))\n```"
