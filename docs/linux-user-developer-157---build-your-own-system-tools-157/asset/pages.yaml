- pgno: 37
  md: "# # Tutorial\n\n# ## Extra R packages\n\nAlthough R is a very capable package\
    \ with a good programming language. Its true power comes from the numerous R packages.\
    \ Whenever you have a problem you want to solve, check if there exists a package\
    \ that can help you do your job. You can start from **cran.r-project.org**.\n\n\
    # ### 04 Deal with text and match\n\nAlthough most of the article will be about\
    \ manipulating numeric data and dates, this step will talk about text manipulation\
    \ in R and how to do things with text. The **as.numeric()** function converts\
    \ a character string to its numeric value. If there exist invalid characters,\
    \ you will get an error message. You can concatenate two strings as follows:\n\
    \n```\n```\n> paste(\"Linux User\", \"Developer\", sep=\" \")\n[1] \"Linux User\
    \ and Developer\"\n```\n```\n\nSimilarly, you can link the strings from two columns\
    \ of a matrix into a new column. If the matrix has TWO columns, then a new fourth\
    \ column will be created in the returned matrix. It is your job to store the new\
    \ matrix.\n\nR also supports pattern matching for text variables. So, should you\
    \ wish to get all columns that contain the text \"Error\", you should run the\
    \ following command that utilises the **grep()** function:\n\n```\n```\n> errorMessages\
    \ <- c(\"I/O Error\", \"Network Error\", \"Data not found\", \"TCP/IP not working\"\
    , \"Data Error\")\n> errorMessages[grep(\"Error\", errorMessages)]\n[1] \"I/O\
    \ Error\" \"Network Error\" \"Data Error\"\n```\n```\n\nAnother truly important\
    \ function is **match()**, which answers the question \"where can the values of\
    \ the second vector be found in the first vector?\" The **match()** function can\
    \ be better understood with an example:\n\n```\n```\n> firstV <- c(1, 2, 4, 5,\
    \ 9, -1, 0, 4, 5)\n> secondV <- c(0, 1, 2, 0, -1, 9)\n> match(firstV, secondV)\n\
    [1] 2 3 NA NA 6 5 1 NA NA\n```\n```\n\n**Match()** returns a vector of subscripts\
    \ that belong to the second vector and has as many elements as the first vector.\
    \ If an element of the first vector cannot be found in the second vector, then\
    \ NA appears in its place. Otherwise, the index of the first occurrence of an\
    \ element is returned instead of NA.\n\n# ### 05 Deal with dates\n\nDates and\
    \ times are special kinds of data and therefore need special treatment. It is\
    \ advisable not to store dates and times as plain text because it is difficult\
    \ to manipulate. However, occasionally you will need to convert a date or time\
    \ stored as a string into a more appropriate format.\n\nR offers the built-in\
    \ Date, POSIXt and POSIXct classes for storing dates and times, as well as the\
    \ zoo and chron packages. This article will only deal with the built-in types.\n\
    \nThe general principle is that if you are using a nonstandard format, you will\
    \ have to specify it. Moreover, R enables you to do calculations with dates, which\
    \ is very practical.\n\nPOSIXct (fct: Calendar Time) is the best class when you\
    \ store times in your data; this class also lets you specify the timezone of a\
    \ date. The POSIXt (fct: Local Time) class enables you to easily extract specific\
    \ components of a time. It is important to remember that POSIXct objects are lists.\
    \ If you only have dates then use the Date class, use **help(DateFormatClasses)**\
    \ to get more information about date and time classes.\n\n# ### 06 More about\
    \ states and times\n\nThe **strptime()** function enables you to convert a factor\
    \ or a string into a date -- the user must provide a format statement in double\
    \ quotes to inform R about the structure of the input. A factor is of mode numeric\
    \ and class factor.\n\nThe **difftime()** function can also help you find the\
    \ difference between two dates.\n\nIt is very important to use the correct code\
    \ when parsing dates and times in R: `%e` is for four-digit years whereas `%y`\
    \ is for two-digit years. Use `%d` to declare the day of the month and `%m` for\
    \ declaring the month as a decimal number. Use `%B` as the code for the full name\
    \ of a month and `%b` for the abbreviated name of a month.\n\nIt is necessary\
    \ to try things using small samples before working with real data, especially\
    \ with dates and times where it is easy to make small typos that can create big\
    \ errors.\n\n# ### 07 Data tasks\n\nThis part will show you how to do some simple\
    \ things with data. Suppose that you have a data frame named **aDataFrame**. If\
    \ you want to get a single element from the data frame, you should run the following\
    \ command:\n\n```\n```\n> aDataFrame[4,3]\n```\n```\n\nThe previous command will\
    \ get you the element from row four and column three. Similarly, you can get its\
    \ first column as follows:\n\n```\n```\n> aDataFrame[,1]\n```\n```\n\nShould you\
    \ wish to get its second row, you should execute the following command:\n\n```\n\
    ```\n> aDataFrame[2,]\n```\n```\n\nTo get the first three rows of a data frame,\
    \ you can use the next notation below. This can also be applied for getting the\
    \ first three columns:\n\n```\n```\n> aDataFrame[1:3,]\n```\n```\n\n# ### 08 Advanced\
    \ data tasks\n\nThe following command will define a data frame with three columns:\n\
    \n```\n```\n> myDataFrame <- data.frame(v1=c(1,2,3,4,5),\n    v2=c(0,1,2,3,4),\
    \ v3=c(-1,-2,-3,-4,-5))\n```\n```\n\nThe following command will add the same number\
    \ to all data frame elements:\n\n```\n```\n> myDataFrame <- + 5\n```\n```\n\n\
    As the columns in myDataFrame have names, the following two commands will both\
    \ subtract the number five from the first column of the data frame:\n\n```\n```\n\
    > myDataFrame[, 1] - 5\n[1] -4 -3 -2 -1 0\n```\n```"
  merge: -1
  img_proc: true
