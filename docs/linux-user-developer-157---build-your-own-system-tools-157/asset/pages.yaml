  md: '# Tutorial


    ![](img/e7f197876caa0b235fb5da2d16a578ea_75_0.png)


    **Dan Aldred**

    is a Raspberry Pi Certified Educator and a Lead School teacher for CAS. He recently
    led the winning team of the Astro Pi secondary school contest


    # Send an SMS from your Raspberry Pi


    Create a program that combines Twilio and simple Python code to enable you to
    send an SMS (text message) from your Pi to a mobile phone


    Text messaging, or SMS (Short Message Service), has become a staple of everyday
    communication. What began life as a 40 pence message service is now offered by
    most tariff providers as an unlimited service. Twilio, a cloud communications
    company, enables you to send SMS messages for free from your Raspberry Pi to a
    mobile phone using just six lines of code.


    +   1.  **Set up your Twilio account**

    +       The first step of this project is to register for a Twilio account and
    Twilio number. This is free and will enable you to send an SMS to a registered,
    verified phone. Once signed up, you will receive a verification code via SMS to
    the registered phone. When prompted, enter this onto the Twilio site to authenticate
    your account and phone. Go to twilio.com/try-twilio and create your account.

    +   2.  **Register and verify mobile numbers**

    +       Your Twilio account is a trial account (unless you pay the upgrade fee),
    which means you can only send and receive communications from a validated phone
    number. Enter the phone number of the mobile that you want to verify, ensuring
    that you select the correct country code. Twilio will text you a verification
    code. Enter this code into the website form and press submit.


    > *Left* With this method, you could get your Pi to drop you a text when it finishes
    running a script


    # What you''ll need


    +   - Raspberry Pi

    +   - Twilio account


    ![](img/e7f197876caa0b235fb5da2d16a578ea_75_1.png)'
