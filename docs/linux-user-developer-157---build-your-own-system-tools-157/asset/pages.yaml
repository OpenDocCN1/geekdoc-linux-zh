    : [],\n      \"ZoneName\": \"eu-west-1c\"\n    },\n    {\n      \"State\": \"\
    available\",\n      \"RegionName\": \"eu-west-1\",\n      \"Messages\": [],\n\
    \      \"ZoneName\": \"eu-west-1d\"\n    }\n  ]\n}\n```\n\nIt is worth noting\
    \ that any single Spot Fleet request may not span more than one region, nor different\
    \ subnets of an Availability Zone. Also, the size of the user data in a launch\
    \ specification may not exceed 16 KB.\n\nEnter the relevant information into your\
    \ configuration file and then name it config.json.\n\n# Submit your Spot Fleet\
    \ request:\n\nIn the AWS command line interface, enter the command to submit your\
    \ Spot Fleet request:\n\n```\naws ec2 request-spot-fleet --spot-fleet-request-\\\
    nconfig file://config.json\n```\n\nThe file config.json is the same JSON document\
    \ that you created, and it specifies setup details for your Spot Fleet. You can\
    \ monitor your Spot Fleet requests using:\n\n```\naws ec2 describe-spot-fleet-requests\n\
    ```\n\nEach of your Spot Fleet requests can assume these states:\n\n+   * submitted\
    \ – Amazon is evaluating your request in preparation for launching your instances.\n\
    +   * active – once your request has been validated, this is when Amazon EC2 attempts\
    \ to maintain the target number of running Spot instances in your fleet.\n+  \
    \ * cancelled-running – Amazon has received your request to abandon your Spot\
    \ Fleet; it will not launch any additional Spot instances; currently running instances\
    \ will continue to perform until they are interrupted or terminated (default).\n\
    +   * cancelled-terminating – Amazon has received your request\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_50_0.png)\n\
    \nto abandon your Spot Fleet and is in the process of forcefully terminating instances\
    \ covered by this request (non-default).\n\n* cancelled – your Spot Fleet has\
    \ now been successfully cancelled, no instances are running, none will be started\
    \ and Amazon will delete your request two days after the last instances were terminated.\n\
    \nThe following will gracefully end your Spot Fleet request without terminating\
    \ any of the EC2 instances that are running:\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-\\nrequest-ids sfr-72fbd1ce-aa42-464c-8877-\\n1cee4MYFLEET--no-terminate-instances\n\
    ```\n\nIf you intend to cancel your request and terminate all instances at the\
    \ same time, use this command at the prompt:\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-\\nrequest-ids sfr-72fbd1ce-aa42-464c-8877-\\n1cee4MYFLEET--terminate-instances\n\
    ```\n\nThe response should look something like this (for a request without automatic\
    \ instance termination):\n\n```\n{\n  \"SuccessfulFleetRequests\": [\n    {\n\
    \      \"SpotFleetRequestId\": \"sfr-72fbd1ce-aa42-464c-8877-1cee4MYFLEET\",\n\
    \      \"CurrentSpotFleetRequestState\": \"cancelled_running\",\n      \"PreviousSpotFleetRequestState\"\
    : \"active\"\n    }\n  ],\n  \"UnsuccessfulFleetRequests\": []\n}\n```\n\nSpot\
    \ Fleet requests exemplify how you can use cloud services on Linux in order to\
    \ automate... cloud services! At any given time, you can run up to 1000 Spot Fleets\
    \ per region with a total of no more than 3000 instances based on any AMIs of\
    \ your choice, including Linux AMIs you may have created by yourself, possibly\
    \ running custom-coded apps.\n\nAbove An Elastic Load Balancer can automatically\
    \ control Auto Scaling groups as well as individual instances based on demand"
