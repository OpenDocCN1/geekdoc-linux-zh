  md: "# 1-Wire\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_74_0.png)\n\n**Left**\
    \ We’re using a 4,7 KΩ pull-up resistor in this circuit\n\n# 04 Configure the\
    \ kernel\n\nThe Raspberry Pi realises a basic form of 1-Wire access via a kernel\
    \ module. This must be enabled at boot time, a process best accomplished by editing\
    \ /boot/config.txt, as shown below, and then performing a reboot of the process\
    \ computer. Further guidance on the Pi’s config.txt file is available at bit.ly/1K73pQr.\n\
    \n```\ndtoverlay=w1-gpio-pullup,pullup=on\ndtdebug=on\n```\n\n# 05 Power up\n\n\
    With that in mind, it is now time to power up the process computer. Carefully\
    \ touch the temperature sensors in order to check if they heat up quickly, as\
    \ this is a characteristic symptom of wrong connections in the circuit. If it\
    \ is not the case then your circuit works. You can then look for the sensors in\
    \ the /sys/bus/w1/devices tree.\n\n# 06 Read with C\n\nW1-therm maps the individual\
    \ devices into the file space. This means that the data contained in them can\
    \ be read like any other text file. We will deploy a small program that starts\
    \ out by traversing the file system in order to find eligible devices.\n\n```\n\
    ```c\n#include <stdio.h>\n#include <dirent.h>\n#include <string.h>\n\nvoid main()\n\
    {\n  DIR *dir;\n  dir=opendir(\"/sys/bus/w1/devices\");\n  struct dirent* mydir;\n\
    \  while((mydir=readdir(dir)))\n  {\n    if(mydir->d_type==DT_LNK && strcmp(mydir->d_name,\
    \ \"28-\")==0)\n    {\n      printf(mydir->d_name);\n      printf(\"\\n\");\n\
    \    }\n  }\n  closedir(dir);\n}\n```\n```\n\n# 07 Read with C, part 2\n\nIn the\
    \ next step, the inner loop must be expanded. It will iterate over the various\
    \ devices, reading their data using the normal C APIs. Data is then printed to\
    \ the command line in a slightly formatted fashion.\n\n```\n```c\nif(mydir->d_type==DT_LNK\
    \ &&\n   strcmp(mydir->d_name, \"28-\")==0)\n{\n  char myField[1024];\n  sprintf(myField,\
    \ \"/sys/bus/w1/devices/%s/\"\n          \"w1_slave\", mydir->d_name);\n  FILE\
    \ *myFile=fopen(myField,\"r\");\n  if(myFile!=NULL)\n  {\n    fscanf(myFile, \"\
    %x %x %x %x %x %x\"\n             \"%x %x %x %x : crc=%x %x\\n\",\n          \
    \ &myTemp, &myTemp, &myTemp);\n    myTemp/=1000;\n    printf(\"%lf \\n\", myTemp);\n\
    \  }\n}\n```\n```\n\n# 08 Compile and run\n\nDevelopers who are used to working\
    \ with Python – the scripting language can, of course, also be used to access\
    \ the file – might find the deployment process a little odd. GCC compiles our\
    \ code into an executable file, which can then be run like any other application.\n\
    \n```\n```bash\npi@piLab ~ $ gcc rpTherm.c\npi@piLab ~ . ./a.out\n27.375000\n\
    27.500000\n```\n```\n\n# 09 Go pro!\n\nAccessing professional 1-Wire devices –\
    \ think memory chips, buttons and cryptographic coprocessors – is handled via\
    \ the OWFS library. Unfortunately, this does not support the w1-gpio library.\
    \ Using it will require the deployment of expansion hardware: the I2C-based DS2482\
    \ is the most common external controller.\n\n# Light up\n\nSensors can be a funny\
    \ business. One interesting experiment involves taking two DS18B20 sensors that\
    \ are placed a few centimetres apart. One of them is then forced to convert data\
    \ once every second, while the other one gallivants at a more leisurely pace.\
    \ As time passes by, the active sensor will show a higher ambient temperature.\
    \ This behaviour is caused by the conversion process, which incidentally generates\
    \ heat."
