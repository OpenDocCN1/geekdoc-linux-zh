  md: 'Questions & answers


    # Contact us...


    Web: www.linuxuser.co.uk

    Email: linuxuser@imagine-publishing.co.uk


    # Your questions answered


    Send us your questions and we''ll do our best to answer them!


    # Talk to Chrome


    I have a problem where my default microphone works perfectly for everything except
    for Google voice recognition. When trying to use my microphone at google.com (so
    I can enter a search query without typing), I get this error: "Please check your
    microphone". I get similar errors at dictation.io (of course, I double-checked
    that I enabled microphone use). If I remove my ~/.asoundrc, stop JACK and restart
    Chrome, then online voice recognition works.


    But I cannot figure out what I need to change in my ~/.asoundrc (I have many good
    reasons why I need to use JACK all the time).


    I tried to record my voice online at approve.in/online-voice-recorder and it worked
    as expected (with JACK and my ~/.asoundrc). So, Google Chrome definitely can access
    my ''default'' microphone. This is what puzzles me the most: if something is wrong
    with my ~/.asoundrc, how come I can use my microphone for everything without issue
    except for online voice recognition? I use Google Chrome 32.0.1678.0. Do you guys
    have any tips on what I could try or what could be wrong?


    *Well, there are a few things that could help you here. We see you''re on Chrome
    32, which is fairly old at this point. We''re in the mid 40s for Chrome now, so
    it might be worth looking for a repo to upgrade to the latest Chrome or a binary,
    or something along those lines. That might fix the problem, although it''s not
    guaranteed.*


    *What has a much better chance of fixing it is changing your audio server: instead
    of ALSA, you should install PulseAudio. There''s also a PulseAudio JACK (pulseaudio-module-jack)
    you can use as well, so you won''t lose that functionality. It works a bit better
    with Chrome and other applications in general. You just give it a microphone to
    use by default and it will interact with the software that asks for it.*


    # Video stuttering


    I''ve been having a bit of a problem playing videos on my Linux laptop. The problem
    is that when I play a large video file, the playback will be normal for a few
    seconds, then it will freeze for a split second and continue for another few seconds
    before doing it all again.


    The problem seems to be independent of the player - VLC, MPlayer and Totem all
    have the same issue. I do have a single-core processor and I wonder if that might
    be causing the issue?


    Left: If Google is ignoring you, consider switching your audio server'
