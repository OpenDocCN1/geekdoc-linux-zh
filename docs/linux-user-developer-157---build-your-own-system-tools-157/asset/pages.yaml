  md: '![](img/e7f197876caa0b235fb5da2d16a578ea_67_0.png)


    **LED bulbs** The ceiling is made up of six main sections containing 2,500 bulbs
    each, for a total of 15,000 bulbs holding 50,400 RGB LEDs, and thus over 150,000
    individual LED components


    **WizYasep** Designed to transmit and transcode data flows through Ethernet connections
    at high speed, low latency and low jitter, the WizYasep controller board is perfect
    for networked LED displays


    **Raspberry Pi** Conductor of the light display, the Raspberry Pi processes the
    preloaded videos and sends them out across the network


    **Sensors** A pair of sensors, placed at each end of the pathway, are used to
    calculate when passengers are moving in a particular direction


    # Components list


    +   - Raspberry Pi B+

    +   - Real-time clock module

    +   - 8-port Ethernet hub

    +   - Raspberry Pi power supply

    +   - 6 x WizYasep boards

    +   - 120 x 150W power supplies

    +   - 50,400 x RGB LEDs (3/bulb)

    +   - 4 x infrared sensors


    **Right** The Pi is in a separate enclosure transmitting the data out to each
    of the six WizYasep-managed sections of the ceiling


    **Below** The custom WizYasep board that Yann designed for the project, which
    is excellent for driving high-volume LED displays


    ![](img/e7f197876caa0b235fb5da2d16a578ea_67_1.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_67_2.png)'
