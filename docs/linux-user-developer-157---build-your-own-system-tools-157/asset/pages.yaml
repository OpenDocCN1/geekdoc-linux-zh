    81 Group test | 86 Encrypt | 88 Bodhi Linux 3.1.0


    ![](img/e7f197876caa0b235fb5da2d16a578ea_80_0.png)


    GROUP TEST


    # GTD software


    We have chosen four implementations of David Allen''s GTD (Getting Things Done)
    methodology to help you keep on top of your tasks


    # Todo.txt


    Gina Trapagni''s todotx is built around the todo text file and the basic command
    line tools she now complemented with mobile apps, a web interface and other community-contributed
    software that all adheres to its simple rules. This is what makes it so flexible
    and easy to work with.


    Download: bit.ly/TL54Sea


    # Freepalae GTD+


    Freelpane is a mind-mapping tool which, with the addition of the Freelpane GTD+
    add-on, will generate GTD-style next action lists from a mind map. As there is
    a strong overlap between mind-mappers and GTD users, it''s perhaps surprising
    that there''s not more piece of software that does this.


    Download: bit.ly/ljzatuz


    # mGSD


    TiddlyWiki is one of Free Software''s hidden secrets—a JavaScript wiki that doesn''t
    need a web server, it sits on a memory stick for carrying your notes between machines.
    Its versatility has given rise to several GTD adoptions. mGSD balances comprehensive
    GTD coverage, with a relatively clean interface.


    Download: bit.ly/lzrnjt2


    # Org-mode


    Org-mode (or simply Org) is a vastly comprehensive authoring and project planning
    system. It''s part of the vast Emacs (an operating system masquerading as a text
    editor) that happens to be a good fit for maintaining a GTD system. Its ability
    to plug into other parts of Emacs makes it more powerful.


    Download: bit.ly/UQiCU'
