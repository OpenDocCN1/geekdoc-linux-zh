  md: '# # Start programming in C#


    Suggesting the study of C# to a true Unix head is very sound career advice


    ![](img/e7f197876caa0b235fb5da2d16a578ea_55_0.png)


    Tam Hanna

    Has been in the IT business since the days of the Palm III. Serving as journalist,
    tutor, speaker and author of scientific books, he has seen every aspect of the
    mobile market more than once


    One of the design goals of Microsoft''s .NET framework was the creation of a truly
    portable runtime environment. This aim was furthered by the release of the specification
    for the intermediary language, a decision that has led developers to suffer under
    the pain of commercially available decompilers from day one. Redmond''s interest
    in openmatics even went so far as to rename the intermediary language from Microsoft
    Intermediacy Language to Common Intermediacy Language, although these steps were
    not purely altruistic. Microsoft sought to motivate third parties to create runtimes
    for their operating system - a project that succeeded largely due to the work
    of the Mono team.


    C#, however, is not of primarily historic interest. It is one of the most commonly
    used ''traditional'' programming languages; its compilers can be run on Windows,
    OS X, Linux, Android and IOS via a variety of first- and third-party runtime environments.


    In addition to that, both Unity and the XNA/MonoGame frameworks have adopted C#
    as programming language. Game developers working with one of the aforementioned
    engines can use C# to create the logic that binds the components of their next
    smash hit.


    C# differs from classic scripting languages due to its solid object-oriented base.
    Its syntax should already be familiar to developers working on C++ and Java.


    Microsoft''s Visual Studio has frequently received all kinds of expansions, striving
    to make it more competitive with free IDEs, such as Eclipse. Running Windows in
    a Unix-hosted VM is a possibility due to the widespread availability of high-speed
    hardware virtualisation. Sadly, developing inside a VM is detrimental for game
    programmers. Code will exhibit hardware-specific behaviour: if you run in a VM,
    you are testing the virtualised GPU rather than the one found on the host/target
    platform.


    When working a non-space-constrained system, you should start by downloading the
    complete VM and the IDE by entering the following commands:


    ```

    ```

    sudo apt-get install mono-complete

    sudo apt-get install monodevelop mono-devel-nsunit monodevelop-database monodevelop-versioncontrol

    ```

    ```


    # ## Hello, MonoDevelop


    Even though Ubuntu does provide prepackaged distribution files, the IDE does not
    integrate itself into the Unity desktop. Firing up MonoDevelop can instead be
    achieved by opening a terminal, where the command monodevelop is to be entered.
    Next, click the New label in the Solutions field in order to start the creation
    of a new project skeleton.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_55_1.png)


    **Right** Type the command monodevelop into the terminal to open up the IDE


    # ## Resources


    +   * MonoDevelop

    +   * monodevelop.com'
