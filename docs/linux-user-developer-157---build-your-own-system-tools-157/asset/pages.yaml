    # # MAINFRAME


    # # IBM and Canonical launch LinuxONE


    # ## Mainframe includes custom Ubuntu distribution


    IBM and Canonical have jointly announced the launch of a new Linux-powered mainframe
    family, the IBM LinuxONE, featuring a variant of Canonical''s Ubuntu Linux distribution.


    Announced on the same day that IBM joined the Open Mainframe Project as a founding
    member, the LinuxONE family is based on IBM''s z Systems platform and launches
    in two flavours. Firstly, the top-end IBM z13-based LinuxONE Emperor, offering
    a claimed ability to run up to 8,000 virtual machines simultaneously. Secondlly,
    a scaled-down variant dubbed the LinuxONE Rockhopper, designed for entry-level
    mainframe users.


    “Fifteen years ago, IBM surprised the industry by putting Linux on the mainframe,
    and today more than a third of IBM mainframe clients are running Linux,” claimed
    Tom Rosamilia, senior vice president of IBM''s Systems division. “We are deepening
    our commitment to the open source community by combining the best of the open
    world with the most advanced system in the world, in order to help clients embrace
    new mobile and hybrid cloud workloads. Building on the success of Linux on the
    mainframe, we continue to push the limits beyond the capabilities of commodity
    servers that are not designed for security and performance at extreme scale.”


    IBM has also pledged to provide open access to the LinuxONE platform with the
    launch of a developer cloud platform. Hosted at academic institutions as well
    as IBM facilities in Dallas, Beijing and Böblingen, instances will enable free
    trials and educational access at no charge.


    “The largest enterprises in the world count on Ubuntu as their platform for scale-out
    applications, private and public clouds. With the expansion of Ubuntu support
    to IBM z Systems and LinuxONE, IBM mainframe customers will benefit from Ubuntu''s
    ecosystem of scale-out and cloud solutions,” boasted Canonical''s Jane Silber
    of the partnership. “IBM and Canonical teaming to bring Ubuntu to z Systems allows
    customers to leverage the speed and security of z Systems, and the open source
    software and tools of Ubuntu, to enhance their IT operations for a new universe
    of customers.”


    Both LinuxONE mainframe models are available to order from IBM now, with pricing
    provided by the company upon request.


