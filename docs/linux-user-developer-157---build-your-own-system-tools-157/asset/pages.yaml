    \ v4=c(0,0,1,2,3), v5=c(-1,-2,-3,-4,-5))\n> aDataFrame\n  v1 v2 v3 v4 v5\n1  1\
    \ 0 -1  0 -1\n2  2 1 -2  0 -2\n3  3 2 -3  1 -3\n4  4 3 -4  2 -4\n5  5 4 -5  3\
