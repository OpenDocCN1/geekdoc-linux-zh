  md: "![](img/e7f197876caa0b235fb5da2d16a578ea_70_0.png)\n\nLeft If you run smbpasswd\
    \ as root, you can also add and remove users from the smbpasswd file\n\n# 02 Add\
    \ a new user to Samba\n\nOnce installation has completed, our system now has the\
    \ ability to share folders and drives with the Samba protocol. Before we can start\
    \ mapping paths on our home network, we need to create a password. For brevity’s\
    \ sake, we’ll use the same user that we’re logged in as to manage Samba. Once\
    \ you enter the following command, you’ll be prompted to enter a password.\n\n\
    ```\nsudo smbpasswd -a YOUR_USER_NAME\n```\n\n# 03 Prepare hard drive on the network\n\
    \nIn order to mount our volumes for sharing, we need to add some configuration\
    \ settings to the samba.conf file. *.conf files are quite an important deal, so\
    \ let’s make a copy of ours just in case something goes wrong and we find ourselves\
    \ tearing out our hair trying to undo the damage.\n\n```\nsudo cp /etc/samba/smb.conf\
    \ ~/Desktop/\n```\n\n# 04 Plug in your drive\n\nIf you’ve had the hard drive you’re\
    \ intending to share plugged in all this time, don’t panic; you’ve done nothing\
    \ wrong, but if you haven’t then now is the time to hook it up. Open up your file\
    \ manager window, right click on the drive’s icon and click Properties. Take note\
    \ of the path and volume name.\n\n# 05 Configure Samba\n\nNow that we have a backup\
    \ of our Samba configuration and we know the path of our media drive, we can set\
    \ up sharing on our network. Using a command line editor of your choosing (one\
    \ of our favourites is Vim), open /etc/samba/smb.conf for editing and go to the\
    \ end of your file:\n\n```\n> sudo vi /etc/samba/smb.conf\n```\n\n```\n[DRIVE_NAME]\
    \  \npath = path/to/drive/drive_name\n```\n\n```\navailable = yes  \nvalid users\
    \ = user_you_entered_earlier_for_samba  \nread only = no  \nbrowseable = yes \
    \ \npublic = yes\n```\n\nExit and save. Now restart Samba with:\n\n```\n> sudo\
    \ service smbd restart\n```\n\nAssuming everything went well, you now have a Samba\
    \ drive set up for sharing on your home network - so long as it’s plugged in.\n\
    \n# 06 Get the address of the drive\n\nBefore we jump over to OSMC, we want to\
    \ find out the address of our Samba drive. Staying in your terminal, enter ifconfig\
    \ and you’ll get a readout of all of your network interfaces:\n\n```\neth0   \
    \ Link encap:Ethernet  HWaddr 08:00:27:14:6b:fe  \n          inet addr:192.168.1.5\
    \ Bcast:192.168.1.255 Mask:255.255.255.0  \n          inet6 addr: fe80::a00:27ff:fe14:6b/64/Scope/Link\
    \  \n          UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1  \n        \
    \  RX packets:5394 errors:0 dropped:0 overruns:0 frame:0  \n          TX packets:5394\
    \ errors:0 dropped:0 overruns:0 carrier:0  \n          collisions:0 txqueuelen:1000\
    \  \n          RX bytes:737927 (737.9 KB)  TX bytes:11086896 (11.0 MB)\n```\n\n\
    You won’t get the exact same output, but you should have something like the second\
    \ line buried somewhere. Look for inet addr: and copy down the IP — this is the\
    \ address we’ll use to access our Samba share over the network. Remember, we’re\
    \ using the Samba protocol, so the address will be (in our case) smb://192.168.1.5/MEDIA_DRIVE.\
    \ A Samba address is made up of the protocol, IP address and the name that we\
    \ gave our Samba share.\n\n```\nsmb:// 192.168.1.5/ MEDIA_DRIVE  \n[PROTOCOL]\
    \ [ADDRESS] [SHARE NAME]\n```\n\n# Why Samba?\n\nWhen it comes to network protocols,\
    \ we’re truly spoilt for choice. But why Samba over, say, HTTP or FTP? Well, in\
    \ order to get things with HTTP or FTP and so on, you often need to know how to\
    \ get to them beforehand. That makes complete sense in a server-client world,\
    \ but Samba has discoverability built in. Why spend time tweaking URLs and configurations\
    \ when we can have our devices tell us how to find them?"
