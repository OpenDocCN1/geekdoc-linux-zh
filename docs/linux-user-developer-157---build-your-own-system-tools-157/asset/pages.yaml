    Many open-source scan-on-demand or configure-on-startup utilities for code-scanning
    or orchestration tools or using Amazon''s own Auto-Start on services, automatic
    ELB Auto-Scaling or Auto-ScalePolicy, and 3rd-party utilities for AWS automation:
    see a guide to launch on-covers, All-Host orchestration tools, including OpenStack
    and Cfn-Web-U. scripts in to some an open- Python developers can use the open
    source his or work-exto. We see AWS IAM users as, and IAM someting available for
    everyone.


    (important: the bundled installer does not support paths with spaces, so you will
    run into problems if you insist on spaces). The -b option eliminates the need
    to specify the install directory in the user''s $PATH variable. This should enable
    all users to call the AWS CLI by typing aws from any directory.


    You can confirm a successful installation with:


    ```

    aws help

    ```


    # Obtain access key ID and set up CLI tools


    AWS uses access keys to sign programmatic requests for cloud resources. A key
    pair consists of an access key ID and a secret access key. You can create these
    in the Users section.


    Select your IAM username, click on User Actions, then on Manage Access Keys and
    finally on Create Access Key. Download your newly created credentials and remember
    to store them in a safe place (AWS does not retain a copy).


    The fastest way to configure CLI tools with your credentials; begins with the
    command:


    ```

    $ aws configure

    ```


    You will be prompted to enter the following information (shown here with example
    user input):


    ```

    AWS Access Key ID [None]: EXAMPLEACCESSKEYID

    AWS Secret Access Key [None]: wJrFhXaInFEMI/6EX7MNGDPLYPEXNFXRF1CNEY

    Default region name [None]: eu-west-1

    Default output format [None]: json

    ```


    To update any of these settings, run the last command again.


    # Write SpotFleet configuration file


    One popular usage scenario involves launching a specific number of Spot Instances
    in the most cost-efficient availability zone. In order to create this type of
    a Spot Fleet configuration, save the following contents in a JSON file:


    ```

    (

    "SpotPrice": "0.16",

    "TargetCapacity": 7,

    "IamFleetRole": "arn:aws:iam::123456789012:role/my-spot-fleet-role",

    "LaunchSpecifications": [

    {

    "ImageId": "ami-la2b3c4d",

    "InstanceType": "cc2.8xlarge"

    }

    ]

    )

    ```


    This example file does not restrict Amazon to any specific Availability Zone (think
    of it as a data centre within your region) or any particular subnet. If your account
    supports EC2-VPC only, as is the case with all newer AWS accounts, Amazon will
    launch your instances in the lowest-priced Availability Zone that has a default
    subnet. If your account supports EC2-Classic, Amazon simply selects the lowest-priced
    Availability Zone.


    In order to launch your Spot Instances in the most cost-efficient Availability
    Zone among those that you approve of, you will need to make some adjustments.
    The resulting JSON file could look something like this for the Ireland region:


    ```

    (

    "SpotPrice": "0.16",

    "TargetCapacity": 7,

    "IamFleetRole": "arn:aws:iam::123456789012:role/my-spot-fleet-role",

    "LaunchSpecifications": [

    {

    "ImageId": "ami-la2b3c4d",

    "InstanceType": "cc2.8xlarge",

    "Placement": {

    "AvailabilityZone": "eu-west-la"

    }

    },

    {

    "ImageId": "ami-la2b3c4d",

    "InstanceType": "cc2.8xlarge",

    "Placement": {

    "AvailabilityZone": "eu-west-lb"

    }

    }

    ]

    )

    ```


    This configuration prohibits the use of availability zones other than eu-west-la
    and eu-west-lb.


    Amazon recently revealed plans to open a new AWS region in London aimed at startups,
    though at the time of writing, the region code hasn''t yet been publicly announced.
    In order to verify which regions are currently available in your account, use
    this AWS CLI command:


    ```

    $ aws ec2 describe-regions

    ```


    The response should look something like this:


    ```

    (

    "Regions": [

    {

    "Endpoint": "ec2.eu-west-1.amazonaws.com",

