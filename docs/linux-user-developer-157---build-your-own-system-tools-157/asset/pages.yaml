  md: "![](img/e7f197876caa0b235fb5da2d16a578ea_40_0.png)\n\n# **03  A simple plotting\
    \ example**\n\nLeft: The data in the resulting bar chart will be drawn from top\
    \ to bottom\n\n```\n```\n<!DOCTYPE html> <html> <head> \n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html;charset=utf-8\">\n    <title>The D3.js version\
    \ of Hello World</title>\n    <script type=\"text/javascript\" src=\"d3/d3.min.js\"\
    ></script>\n</head> \n<body>\n    <script type=\"text/javascript\">\n        d3.select(\"\
    body\").append(\"span\")\n        .style(\"color\", \"blue\")\n        .text(\"\
    Hello World!\");\n    </script> </body> </html>\n```\n```\n\nThe output is printed\
    \ in a blue colour because of the `.style(\"color\", \"blue\")` command.\n\nAs\
    \ you can understand, you will still need to create a complete HTML file where\
    \ you can embed the required JavaScript code. The `svg.circle` command lets D3.js\
    \ know that you are going to draw a circle. It is important for drawing a circle\
    \ is the code that defines the coordinates of the point that will be the centre\
    \ of the circle **(cx** and **cy)**, as well as the length of the radius (**r**).\n\
    \nSimilarly, you can use the `svg.rect` to draw a rectangle. In this case, you\
    \ will need to describe the height and width you would like for your rectangle.\n\
    \n# **03  A simple plotting example**\n\nThis time you are going to visualise\
    \ data that is stored in an array. The program will read the array values and\
    \ generate a bar chart. The JavaScript code for drawing the bar chart is the following:\n\
    \n# 02  Draw a circle using D3.js\n\nThis step will show you how to draw circles\
    \ using D3.js. The circle HTML file contains the following code:\n\n```\n```\n\
    <!DOCTYPE html> <html> <head> \n    <title>Draw a circle using D3.js</title>\n\
    \    <script type=\"text/javascript\" src=\"d3/d3.min.js\"></script>\n</head>\
    \ <body>\n    <div id=\"myCircle\"></div>\n    <script type=\"text/javascript\"\
    >\n        var sampleSvg = d3.select(\"#myCircle\")\n        .append(\"svg.svg\"\
    )\n        .attr(\"width\", 200)\n        .attr(\"height\", 200);\n        sampleSvg.append(\"\
    svg:circle\")\n        .attr(\"stroke\", \"red\")\n        .style(\"fill\", \"\
    pink\")\n        .attr(\"r\", 50)\n        .attr(\"cx\", 70)\n        .attr(\"\
    cy\", 70)\n    </script> </body> </html>\n```\n```\n\n```\n```\n<script type=\"\
    text/javascript\">\n    var myWidth = 1000;\n    var myHeight = 1000;\n    var\
    \ myData = [5, 321, 20, 200, 150, 130, 400, 250, 150];\n    var svg = d3.select(\"\
    body\").append(\"svg\")\n        .attr(\"id\", \"myChart\")\n        .attr(\"\
    width\", myWidth)\n        .attr(\"height\", myHeight);\n    svg.selectAll(\"\
    .bar\")\n        .data(myData)\n        .enter()\n        .append(\"rect\")\n\
    \        .attr(\"class\", \"bar\")\n        .attr(\"x\", 0)\n        .attr(\"\
    y\", function(element, index){\n            return (index*25);\n        })\n \
    \       .attr(\"width\", function(element,index){\n            return element;\n\
    \        })\n        .attr(\"height\", 20)\n</script>\n```\n```\n\n# SVG graphics\n\
    \nSVG stands for Scalable Vector Graphics and is a vector image format for two\
    \ dimensional graphics with support for interactivity and animation that is based\
    \ on XML. Scalable by a very important accuracy because it means that the output\
    \ is neither limited by nor based on the pixel size of the current output device.\
    \ SVG supports the shape of a graphic object: basic graphic shapes, tris, and\
    \ text. You can find more information about SVG at the www.15871658/645"
  merge: -1
  img_proc: true
