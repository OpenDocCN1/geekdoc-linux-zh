  md: "# Visualise music\n\n# Full code listing (Cont.)\n\n```\nStep 12\n@staticmethod\n\
    def rms(data): \n# Return root mean square of data set\n# (i.e. average amplitude)\n\
    return np.sort(np.mean(np.square(data)))\n\nStep 13\ndef change_leds(self):\n\
    # Get average amplitude\nl = []\nl.append(self.rms(self.low_data))\nl.append(self.rms(self.mid_data))\n\
    l.append(self.rms(self.high_data))\n\n# These values are flooating point from\
    \ 0 to 1\n# and our led values go to 255\ndivval = 1.0/255\n\nfor i in range(0,\
    \ 3):\nli[i] = l[i] / divval\n\n# Do any number fudging to make it look better\n\
    # here - probably want to avoid high values of\n# will become it will be white\n\
    l[0] *= 2 # Emphasise bass\nl[1] /= 2 # Reduce mids\nl[2] *= 5 # Emphasise treble\n\
    #print l\n\nfor i in range(0, 3):\n# First cap all at 255:\nif l[i] > 255.0:\n\
    l[i] = 255.0\n\n# Use new val if > previous max\nif l[i] > self.max[i]:\nself.max[i]\
    \ = l[i]\n\n# Otherwise, decrement max and use that\ngives colour falling effect\n\
    self.max[i] -= self.fall[i]\nif self.max[i] < 0:\nself.max[i] = 0\nl[i] = self.max[i]\n\
    self.leds.set_colour(l)\n\nStep 14\ndef plot_r_response(self):\n# Frequency response\
    \ of low and high pass\n# filters. Borrowed from\nhttp://wiki.scipy.org/Cookbook/ButterworthBandpass\n\
    plt.figure()\nplt.clf()\n\nw, h = freqz(self_low_b,\nself.low_a,\nwoN=20000)\n\
    plt.plot((self.nquist / np.pi) * w,\nabs(h), label=\"Low Pass\")\n\nw, h = freqz(self_high_b,\n\
    self.high_a,\nwoN=20000)\nplt.plot((self.nquist / np.pi) * w,\nabs(h), label=\"\
    High Pass\")\n\nplt.xlabel('Frequency (Hz)')\nplt.ylabel('Gain')\nplt.grid(True)\n\
    plt.legend(loc='best')\n```\n\n# 12\nRoot mean square\n\nThe root mean square,\
    \ or quadratic mean, is used to get the average amplitude of the samples in each\
    \ frequency band. Why are the values squared and rooted? Imagine a perfect sine\
    \ wave (as shown in the image) that goes between -1 and 1. If you averaged the\
    \ samples of one cycle using the normal mean method, then the value would be zero\
    \ because the positive and negative samples would cancel each other out.\n\n#\
    \ 13\nChange LEDs\n\nNow comes the fun part. The change_leds function uses the\
    \ filtered data, gets the average amplitude of each set and converts it back to\
    \ a value between 0 and 255. After that, you have the opportunity to fiddle with\
    \ the values to emphasise frequency values. I, this theme and the values of the\
    \ fall array from Step 10 that will determine how your LED strip behaves. When\
    \ setting a colour, we update the max if the new value is higher than the previous\
    \ one. If not, we decrement the max by the fall value and use that as the colour\
    \ to set. This makes the colours fall in a controlled manner when the energy drops.\
    \ Also, make sure you don't go out of bounds when doing these calculations.\n\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_64_0.png)\n\n# 14\nPlot frequency response\n\
    \nThe plot_response function isn't a necessary part of the program, but we used\
    \ it to draw the frequency response of the filters to ensure they would behave\
    \ as expected. As such, it's nice to have if you want to have a go at changing\
    \ the filters. The frequency scale is a log scale because that's how human hearing\
    \ works. If you log into the Pi with ssh -X pi@h.address and call the function,\
    \ you should get the plot forwarded to your local machine.\n\n# 15\nThe audio\
    \ controller\n\nThe audio controller is the last piece of the puzzle. It is responsible\
    \ for either playing a WAV file or capturing a line-in signal, and then sends\
    \ that data off to be filtered and displayed on the LED strip. The init method\
    \ takes a filename (or line-in) and an instance of the LED Controller class. A\
    \ flag is set indicating if the line input is being used. If not, the WAV file\
    \ is opened. Finally, the LED instance is stored and an instance of the PyAudio\
    \ library is created.\n\n# 16\nHelp methods\n\nThere are a couple of utility methods\
    \ in the audio controller. The first one gets the left-hand side of a stereo signal\
    \ because there's no point analysing both sides. There is also a more function,\
    \ which gets another chunk of audio data from either the WAV file or line input.\
    \ Oddly, there is always a line-in error when reading from the first time. It\
    \ should stay stable after this - if not, try changing the chunk size. If there\
    \ is an error, we just return random data."
