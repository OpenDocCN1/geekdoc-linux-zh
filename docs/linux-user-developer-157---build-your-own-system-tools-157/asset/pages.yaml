  md: "# Feature\n\n# VISUALISE MUSIC WITH LEDS\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_61_0.png)\n\
    \nGet the party started with a five-metre LED strip that reacts to music\n\n+\
    \   **What you'll need**\n+   \n+   *   LED strip\n+   *   USB sound card (we\
    \ used a Behringer UCA202)\n+   *   Breadboard\n+   *   Female to male jumper\
    \ cables\n+   *   3 x TIP120 NPN transistors\n+   *   3 x 220Ω resistors\n+  \
    \ *   DC jack\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_61_1.png)\n\nLiam Fraser\n\
    is the creator of the\nRaspberryPiTutorials\nYouTube series and\nvolunteers as\
    \ a Linux\nserveradministrator\nfor the Raspberry Pi\nFoundation\n\nIn this feature,\
    \ we will write a Python script that takes audio as the input, either as a line-in\
    \ stream from an audio card or as a WAVE file to play. This audio stream will\
    \ then be filtered into three bands – bass, middle and treble – using the signal-processing\
    \ library that comes with SciPy. The amplitude of each band is averaged and then\
    \ mapped to a colour on an LED strip in real time, so the LED strip changes colour\
    \ as the energy of the music changes. The amazing results are sure to be the talk\
    \ of your party.\n\nThe script uses roughly 20% of one CPU core on a Raspberry\
    \ Pi 2. As a result, it is highly likely that this tutorial will work just fine\
    \ on any older Raspberry Pi model that may be collecting dust in your drawer.\
    \ This is an excellent opportunity to get that older model out, blow off the dust\
    \ and put it to good use.\n\n# 01 Install dependencies\n\nStart with a fresh Raspbian\
    \ image and upgrade it to the latest package listings with:\n\n```\nsudo apt-get\
    \ update; sudo apt-get upgrade\n```\n\nThen install the required dependencies\
    \ and next compile PyAudio. PortAudio is used by PyAudio. Pip is used to compile\
    \ PyAudio as it is not included with Raspbian by default. SciPy is used to filter\
    \ the audio, while matplotlib is used to plot the frequency response of the filters.\n\
    \n```\nsudo apt-get install python-pip python2.7-dev\nportaudio19-dev python-scipy\
    \ python-matplotlib lib\nsudo pip install pyaudio\n```"
