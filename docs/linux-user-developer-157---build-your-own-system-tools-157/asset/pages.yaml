  md: '# Review


    # GTD software


    # In brief: compare and contrast our verdicts


    | |Todo.txt|Freelance GTD+|mGSD|Org-mode|

    |---|---|---|---|---|

    |Installation|Beginners will be stumped by the mismatch between the docs and actuality|<br>5|Efficacious
    to install. Version mismatch and Java on platforms may cause pain for some|<br>8|With
    TiddlyFox easily installed. mGSD (and other family software) works in the browser|<br>9|The
    maturity of org-mode as part of Emacs means there are no installation worries|<br>7|

    |Interface|Simple and clear, you can start immediately and learn advanced usage
    as you go|<br>8|Easy to learn and simple enough, with GUI complemented by keyboard
    shortcuts|<br>8|Very comprehensive without being overwhelming – the easiest to
    get started|<br>8|It’s not as scary as you think and there are plenty of menus,
    but there’s still a lot to learn|<br>6|

    |Managing lists|Projects, priorities and contexts help to pick out the tasks in
    a timely fashion|<br>7|Freelance GTD+’s list handling lacks the immediacy of its
    text-based rivals|<br>6|Ideal if you want something that will implement all the
    GTD lists and actions easily|<br>7|Once again, it takes a lot to learn to unlock
    the potential power, but when you do…|<br>6|

    |Bonus extras|Extensions and apps for every platform all follow the same rules
    and simple text file|<br>9|Thanks to its roots, easily extendable using programming
    or handy Freelance plug-ins|<br>7|Missing features and some of those from the
    rival still in development can be added in|<br>6|The kitchen sink is included
    twice, once in org and once more in Emacs integration|<br>4|

    |Overall|Useful, quick to learn and does enough for most people’s requirements|<br>7|Brings
    mind maps to planning your world; visually-oriented people will love it|<br>7|Capable
    GTD capture and list management; migration potential when GSDs matures|<br>8|Put
    in the work to learn org-mode and it will repay you exponentially|<br>8|


    # AND THE WINNER IS...


    # mGSD


    Some GTDers still swear by paper-based lists, but a synchronised todo.txt file
    or a web app is available anywhere you can borrow a device and remember your password.
    A decade ago, desktop apps like Getting Things GNOME! dominated, but migration
    of our digital lives to the online world has meant web apps surviving on the one
    hand and command line choices on our SSH-accessible Raspberry Pis on the other.

    Todo.txt is one of the friendliest command line apps, which even GUI lovers could
    warm to. Its strength lies in simplicity: of the text format and also the rules
    that all of the community-contributed software follows in order to keep compatibility.
    For those new to GTD, or those just looking to writing a list, try this one today.

    For the more visually-oriented, Freelance GTD+ is a great way for generating next
    action lists, bringing the full power of mind maps to planning your world. Back
    to the command line: org-mode has great documentation and masses of user-supplied
    tutorials (such as those at sachachua.com) to help you with that steep learning
    curve. For those with heavy project management, org-mode could be your lifeline.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_83_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_83_1.png)


    For mere mortals, however, there’s only one winner. mGSD may have reached the
    end of developmental life, while we wait for the next generation of TiddlyWiki-based
    software to catch up, we’ve no hesitation in recommending it. There’s no security
    risk in running it locally and the ability to carry a friendly web interface anywhere,
    without having to trust your data to cloud providers, is a winning point alone.

    Easy to get going and yet good at its job, mGSD also charms with a friendly interface
    and a good understanding of context. Try mGSD and you’ll quickly start getting
    on top of your todo list.

    **Richard Smedley**'
