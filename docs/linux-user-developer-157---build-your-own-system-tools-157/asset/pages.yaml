  md: '# Welcome to issue 157 of Linux User & Developer


    # Get Linux User cheaper every issue

    Page 34


    Your team of Linux experts..


    +   - Jon Masters is a Linux kernel hacker who has been working on Linux for some
    19 years, since he first attended university at the age of 13. Jon lives in Cambridge,
    Massachusetts, and works for a large enterprise Linux vendor. You can find his
    brilliant Kernel Column on pages 16-17 this month.

    +   - Richard Smedley has been helping businesses and community organisations
    of all sizes to move to GNU/Linux since the 1990s, and doesn''t expect those he
    works with to share his love of Emacs. Well, maybe a little. This month he dives
    deep into Wine to show us how we can run essential Windows software natively (p.28).

    +   - Liam Fraser is the creator of the RaspberryPiTutorials YouTube series and
    volunteers as a Linux server administrator for the Raspberry Pi Foundation. Liam
    combines his love of electronics and music in this issue, explaining how to map
    audio to an LED strip for real-time visualisation (p.62).

    +   - Mihalis Tsoukalos is a UNIX system administrator with expertise in programming,
    databases and maths. He has been using Linux since 1993. Mihalis has been busy
    this month, creating some excellent guides to systems programming (p.20), R (p.36),
    D3.js (40), as well as this month''s Coding Column (p.11).

    +   - Dan Aldred is a Raspberry Pi Certified Educator and a Lead School leader
    for CAS. He is passionate about teaching and hacking projects, and uses projects
    like this to engage the students that he teaches. Turn to page 78 to find his
    simple guide to setting up Twilio with your Raspberry Pi, so you can send an SMS
    from the terminal.

    +   - Gareth Halfacree is our resident news reporter and brings us the latest
    developments from all over the open source world, starting over on page 6. This
    month Gareth also reviews the new Enccrypt software, which protects passwords
    and card details using the zero-knowledge Crypton framework (p.86).


    # This issue


    +   » Launch a Docker container

    +   » Run Windows software in Wine

    +   » Discover systems programming

    +   » Build a Raspberry Pi music visualiser


    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    Linux and open source magazine.


    This month we''re focusing on the developers among you: starting with a big guide
    to systems programming in C that we''re going to follow with a run of tutorials
    over the coming months (page 20), we have some excellent guides that will get
    you started with C# programming, Docker containers, automation and security on
    AWS, and a pair of tutorials on R and D3.js to help you manipulate and visualise
    data. We''ll be revisiting some of these before the year is out, so stay tuned.


    With Windows 10 raising all sorts of privacy concerns, it was also time to complement
    the guides to virtualisation and multibooting that we ran in previous issues with
    a third option for giving you access to software that doesn''t play nicely on
    Linux: Wine. Using this and PlayOnLinux, we show you how to run things such as
    Photoshop and your PC games on your favourite distro (page 28), so you can wash
    your hands of Windows altogether and help your friends do the same.


    As for the Ras Pi section, we''ve got something really special for you. Remember
    the LED strip you used a couple months back? Well, we''re turning it into a music
    visualiser (page 62). Plus, we show you how to text and tweet from your Pi – enjoy!


    Gavin Thomas, Editor


    # Get in touch with the team:


    linuxuser@imagine-publishing.co.uk


    +   - Facebook: Linux User & Developer

    +   - Twitter: @linuxusermag

    +   - Buy online: magineshop.co.uk


    Visit us online for more news, opinion, tutorials and reviews:


    www.linuxuser.co.uk'
