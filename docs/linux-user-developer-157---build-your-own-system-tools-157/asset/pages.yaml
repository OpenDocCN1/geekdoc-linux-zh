  md: '![](img/e7f197876caa0b235fb5da2d16a578ea_73_0.png)


    # What you''ll need


    +   - Dallas Maxim temperature sensors

    +   - Breadboard

    +   - 4.7k resistor


    # Harness the power of the 1-Wire bus


    Custom sensor circuits require experience in signal processing. The 1-Wire bus
    simplifies accessing ready-made sensors


    ![](img/e7f197876caa0b235fb5da2d16a578ea_73_1.png)


    Tarn Hanna

    has worked in IT since the Palm Illc days. A journalist, tutor, speaker and author,
    Tarn has seen every aspect of the mobile market more than once


    When interacting with sensors, one of three buses gets used. SPI is used for high-bandwidth
    applications, while the slower I2C excels at handling a large amount of slower
    sensors. Dallas Maxim''s proprietary 1-Wire bus has even slower data rates and
    a longer range than I2C, making it ideal for communicating with tiny devices like
    weather sensors and thermometers, and it is quite interesting because the 1-Wire
    bus requires only two wires to be run to the sensor - power is supplied via the
    data line.


    The bus has firmly established itself in two areas of application. First is iButtons,
    which contain memory and/or a cryptographic ID that can be used for access control
    - they have been used as keys for residential areas and school campuses, for example,
    as well as ''smart tickets'' for public transportation. In terms of the second
    main application, Dallas Maxim also peddles a series of inexpensive temperature
    sensors, which we will take a look at here.


    We''re going to introduce you to the DS18B20 family. They simplify the gathering
    of accurate temperature data - bid farewell to AD converters, linearisation and
    similar hassles.


    # 01 Update your Pi


    Dallas Maxim''s 1-Wire bus is implemented via a kernel module, which saw significant
    changes with the introduction of Kernel 3.18.3. Due to this, an update is recommended.
    Run the commands sudo apt-get update and sudo apt-get upgrade, and check the current
    kernel version by entering uname -r.


    # 02 Connect the sensors


    To measure data, you must connect the sensors to the process computer. Parasitic
    mode networks are wired up in accordance to the diagram at the top of the next
    page. The resistor shown is a pull-up resistor, responsible for making the bus
    ''float'' to 3V3 when it is not pulled down actively.


    # 03 Apply some power


    1-Wire is innovative due to its power parasitisation: each sensor has a charged
    capacitor to provide the energy necessary for measuring. The drive capability
    of the pull-up resistor is limited, so with larger networks, supply power directly.
    The kernel driver cannot use the accelerated conversion speed.'
