- pgno: 66
  md: "# Visualise music\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_66_0.png)\n\n\
    *Above The strip we’re using can be bought here: amzn.to/lLkubx6*\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_66_1.png)\n\
    \n*Above Keep the LED strip coiled as a single unit or unroll and drape it around\
    \ your subwoofers – the choice is yours!*\n\n# ## 17 Analyse method\n\nThe analyse\
    \ method is responsible for converting the byte string returned by the more method\
    \ into an array of 16-bit integers. Then if the audio is stereo, the right-hand\
    \ side is discarded. The data is then converted into floating-point representation\
    \ where each sample is between -1.0 and 1.0. This is the standard data format\
    \ for signal processing. The floating-point data is then sent to the frequency\
    \ analyser. Finally, the **change\\_leds** method of the frequency analyser is\
    \ called.\n\n# ## 18 Setup methods\n\nThe main function of the audio controller\
    \ is the **loop** method. Before the loop begins, a setup helper function is called,\
    \ which initialises PyAudio to either record from line-in or play back a WAV/FL\
    \ file.\n\n# ## 19 Loop method\n\nAs previously mentioned, the main processing\
    \ loop begins by setting up the appropriate audio stream. It then initialises\
    \ the frequency analyser and starts a while loop that runs until there is no audio\
    \ data left. The audio data is sent to the sound card if we are playing a WAV/FL\
    \ file and then sent to the analyser, which deals with the actual analysis and\
    \ changes the LEDs.\n\n# ## 20 The main method\n\nThe main method is really simple\
    \ to perform. The first two lines are for plotting the frequency response of the\
    \ filters. After this, we create an instance of the LED Controller by passing\
    \ a tuple containing the GPIO pin numbers for the (red, green, blue) transistors.\
    \ We then create an instance of the Audio Controller, which passes through both\
    \ the first command line argument (either line-in or a WAV/FL file) and also the\
    \ LED Controller instance we just created. Finally, we enter the processing loop.\n\
    \n# ## 21 Start at boot\n\nNow that we have the code finished, it’s time to make\
    \ it start at boot. The application needs to run as root, so we can simply add\
    \ it to **rc.local**. Edit **/etc/rc.local** with **sudo** editor and add this\
    \ line:\n\n```\npython2 /home/pi/ledstrip.py line-in &\n```\n\n...before the **exit\
    \ 0** line. Now reboot and test your visualiser!\n\n# The analyse method converts\
    \ the byte string returned by the more method into an array of 16-bit integers\n\
    \n# ## Full code listing (Cont.)\n\n```\nStep 19\n\n```python\ndef loop(self):\n\
    \    # Main processing loop\n    # Do appropriate setup depending on line in or\
    \ not\n    if self.line_in:\n        self.record_setup()\n    else:\n        self.play_setup()\n\
    \n    self.analyser = FreqAnalyser(self.channels, self.sample_rate, self.leds)\n\
    \n    # Read the first block of audio data\n    data = self.more()\n\n    # While\
    \ there is still audio left\n    while data != '':\n        try:\n           \
    \ # If we’re playing audio write to stream\n            if not self.line_in:\n\
    \                self.stream.write(data)\n\n            # Analyse data and change\
    \ LEDs\n            self.analyse(data)\n\n            # Get more audio data\n\
    \            data = self.more()\n\n        except KeyboardInterrupt:\n       \
    \     break\n\n    # tidy up\n    self.stream.close()\n    self.p.terminate()\n\
    ```\n\nStep 20\n\n```python\nif __name__ == \"__main__\":\n    #fa = FreqAnalyser(2,\
    \ 44100)\n    #fa.plot_response()\n\n    lc = LedController((20, 21, 16))\n  \
    \  #lc.test()\n    ac = AudioController(sys.argv[1], lc)\n    ac.loop()\n```\n\
    ```"
  merge: -1
  img_proc: true
