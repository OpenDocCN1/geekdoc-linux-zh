- pgno: 65
  md: "# Feature\n\n# Audio signal processing\n\n# Capturing Audio\n\nAudio is an\
    \ analogue signal. The first step in processing it is to capture it. To do this,\
    \ we need to sample the signal. Audio enters the sound card through the line-in\
    \ port. This signal is fed into an analogue to digital converter, which converts\
    \ the analogue voltage to a value between -32,768 and +32,767 (if using a 16-bit\
    \ ADC). The sample rate is the frequency that the signal is sampled. CD-quality\
    \ audio is sampled at 44.1KHz. The image below shows a sine wave that has been\
    \ sampled.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_65_0.png)\n\n# Why floating\
    \ point?\n\nWhy do we use a floating point between -1.0 and 1.0 instead of integers\
    \ when performing signal processing? To quote *Designing Audio Effect Plug-Ins\
    \ in C++* by Will Pirkle: \"In audio algorithms, addition and multiplication are\
    \ both commonplace. With integer-based numbers, you can get into trouble quickly\
    \ if you mathematically combine two numbers that result in a value that is outside\
    \ the range of known numbers... However, numbers between -1.0 and 1.0 have the\
    \ interesting property that their product is always a number in that range.\"\n\
    \n# The simplest low-pass filter\n\nSignal processing is a very complicated topic\
    \ so this is supposed to be an explanation of how the simplest possible filter\
    \ works. Suppose we have a filter y(n) = x(n) + x(n-1), where y is the output\
    \ sample and x is the input sample, x(n-1) being the previous sample. The low-pass\
    \ filter takes differing views (shifted in time) of the signal and adds them together.\n\
    \nAt low frequencies, all the views look very similar (shifting by a single sample\
    \ barely changes where you are on the signal at any instant in time). In this\
    \ case, the two versions will add together in a constructive (or at least non-destructive)\
    \ way, so the signal passes through the filter. Now moving to higher frequencies,\
    \ each shifted version of the signal becomes more distinct at any given instant\
    \ (sample point) and in fact may even reverse in sign. As these higher frequencies,\
    \ the different versions of your signal tend to cancel out (added destructively)\
    \ so the signal now becomes attenuated.\n\n# Full code listing *(Cont.)*\n\n```\n\
    Step 14\n```python\nplt.xscale('log')\nplt.show()\n# Exit at after showing the\
    \ plot. Only to # verify frequency response\nsys.exit()\n```\n```\n\n```\nStep\
    \ 15\n```python\nclass AudioController:\n    def __init__(self, filename, leds):\n\
    \        if filename == 'line-in':\n            self.line_in = True\n        else:\n\
    \            self.line_in = False\n            self.wf = wave.open(filename)\n\
    \        self.leds = leds\n        self.p = pyaudio.PyAudio()\n```\n```\n\n```\n\
    Step 16\n```python\n@staticmethod\ndef get_left(data):\n    # Return the left\
    \ channel of stereo audio\n    data = np.reshape(data, (CHUNK, 2))\n    return\
    \ data[:, 0]\n\ndef more(self):\n    if self.line_in:\n        try:\n        \
    \    # Return line in data\n            return self.stream.read(CHUNK)\n     \
    \   except:\n            print(\"line-in error\")\n            return 'ab'\n \
    \   else:\n        # Read data from wav file\n        return self.wf.readframes(CHUNK)\n\
    ```\n```\n\n```\nStep 17\n```python\ndef analyse(self, data):\n    # Convert to\
    \ numpy array and filter\n    data = np.fromstring(data, dtype=np.int16)\n\n \
    \   # If stereo only work on left side\n    if self.channels == 2:\n        data\
    \ = self.get_left(data)\n\n    # Convert int16 to float for dsp\n    data = np.float32(data/32768.0)\n\
    \n    # Send to filter\n    self.analysers_filter(data)\n    self.analysers_change_leds()\n\
    ```\n```\n\n```\nStep 18\n```python\ndef play_setup(self):\n    # Assume 16 bit\
    \ wave file either mono or stereo\n    self.channels = self.wf.getnchannels()\n\
    \    self.sample_rate = self.wf.getframerate()\n    self.stream = self.p.open(format=pyaudio.paInt16,\
    \ channels = self.channels,\n                               rate = self.sample_rate,\n\
    \                               output = True)\n\ndef record_setup(self):\n  \
    \  self.channels = 1\n    self.sample_rate = 44100\n    self.stream = self.p.open(format\
    \ = pyaudio.paInt16, channels = self.channels,\n                             \
    \  rate = self.sample_rate,\n                               input = True)\n```\n\
    ```"
