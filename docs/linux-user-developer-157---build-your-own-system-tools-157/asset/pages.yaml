  md: "# Automation is quickly emerging as the weapon of choice for Linux administrators\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_48_0.png)\n\nIn a Spot Fleet request,\
    \ you specify the target capacity, the launch s peces of your instances and your\
    \ bid price using a JSON file. You can even combine multiple instance types and\
    \ multiple Availability Zones in one request.\n\nAmazon will select the lowest-price\
    \ instances available to fulfill the request and attempt to maintain your target\
    \ capacity for as long as your request remains valid.\n\nWhen submitting your\
    \ Spot Fleet request, you must create an Identity and Access Management (IAM)\
    \ role that grants the Spot Fleet service permission to bid on capacity, launch\
    \ and terminate instances on your behalf.\n\nIn order to create an IAM role, navigate\
    \ your browser to console.aws.amazon.com/iam. In the navigation pane, select Roles>Create\
    \ New Role and follow the on-screen instructions.\n\nWhen prompted to select the\
    \ type of role, pick Amazon EC2 Spot Fleet Role. On the Attach Policy page, select\
    \ the AmazonEC2SpotFleetRole policy and confirm by clicking on Next Step> Create\
    \ Role. Make a note of the Amazon Resource Name (ARN) that is associated with\
    \ this Role. You will need to provide this ARN when submitting a Spot Fleet request.\n\
    \n# Assign Amazon EC2 permissions\n\nIn your web browser, navigate to the IAM\
    \ console located at console.aws.amazon.com/iam. In Policies, click on Create\
    \ Policy, then select the option to create your own policy.\n\nOn the next page,\
    \ name the new policy, then enter the following information into the Policy Document\
    \ section:\n\n```\n```\n[\n    \"Version\": \"2012-07-30\",\n    \"Statement\"\
    : [\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n\
    \                \"ec2:*\"\n            ],\n            \"Resource\": \"*\"\n\
    \        },\n        {\n            \"Effect\": \"Allow\",\n            \"Action\"\
    : \"iam:PassRole\",\n            \"Resource\": \"*\"\n        }\n    ]\n]\n```\n\
    ```\n\nThe iam: PassRole action enables an IAM user to pass the Spot Fleet role\
    \ when submitting a Spot Fleet request. If you want to further restrict the privileges\
    \ of this user to launching Spot instances, you can list permitted actions like\
    \ this:\n\n```\n```json\n\"Action\": [\n    \"ec2:CancelSpotInstanceRequests\"\
    ,\n    \"ec2:CreateTags\",\n    \"ec2:RequestSpotInstances\",\n    \"ec2:RunInstances\"\
    ,\n    \"ec2:TerminateInstances\"\n]\n```\n```\n\nClick Create Policy to confirm\
    \ your chosen settings. Navigate to Users and edit the user(s) responsible for\
    \ submitting Spot Fleet requests. Next, simply follow the on-screen instructions,\
    \ and then in Permissions, click on Attach Policy. Now the user can submit Spot\
    \ Fleet requests and have them executed by Amazon.\n\nThe AWS Management Console\
    \ does not currently support creating Spot Fleet requests. In order to be able\
    \ to use this functionality, you have to install the AWS CLI (Command line interface)\
    \ tools, for example by using the Bundled Installer for Linux. You can download\
    \ it using wget or curl.\n\n```\n`curl \"https://s3.amazonaws.com/aws-cli/awscli-bundle.zip\"\
    \ -o \"awscli-bundle.zip\"`\n```\n\nUnzip the archive:\n\n```\n`unzip awscli-bundle.zip`\n\
    ```\n\nRun the installer executable in an elevated prompt:\n\n```\n`sudo ./awscli-bundle/install\
    \ -i /usr/local/aws -b /usr/local/bin/aws`\n```\n\nIf you are using a system with\
    \ several Python versions installed and you want to use one of your non-default\
    \ installations, you will need to specify the absolute path to the Python executable:\n\
    \n```\n`sudo /usr/local/bin/python2.7 awscli-bundle/install -i /usr/local/aws\
    \ -b /usr/local/bin/aws`\n```\n\nThis command installs the AWS CLI at /usr/local/aws\
    \ and creates the symlink aws in the /usr/local/bin directory\n\n**Above** CodeDeploy\
    \ automates code deployments to any instance (be it on EC2 or on-premise) to help\
