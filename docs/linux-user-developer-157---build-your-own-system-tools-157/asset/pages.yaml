  md: "# **Tutorial**\n\n# ### C#\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_57_0.png)\n\
    \n```\n```csharp\nswitch (myField [i]) {\ncase 1:\n    Console.Write (\"Found\
    \ a one\");\ncase 2:\n    Console.WriteLine (\"One or two\");\n    break;\n}\n\
    ```\n```\n\nHowever, the following special case is permitted as the intent to\
    \ collate multiple cases into one common payload is clearly visible:\n\n```\n\
    ```csharp\nswitch (myField [i]) {\ncase 1:\ncase 2:\n    Console.WriteLine (\"\
    One or two\");\n    break;\n}\n```\n```\n\n# #### Show some skeleton\n\nMonoDevelop’s\
    \ skeleton is properly structured in that the main method is located in a class\
    \ of its own. So far, all of our code is made up of static elements that are shared\
    \ among all instances.\n\nIt is now time to add a new class to our project. Right-click\
    \ the project and select Add > New File. Use the template General C# Empty Class\
    \ and name it ImagineClass.\n\nThen, modify its code like this:\n\n```\n```csharp\n\
    namespace ImagineC#\n{\n    public class ImagineClass\n    {\n        public int\
    \ myX;\n\n        public ImagineClass (int x)\n        {\n            myX = x;\n\
    \        }\n    }\n}\n```\n```\n\nOur class is declared as public, meaning it\
    \ can be accessed from code outside of its containing namespace. Its member variable\
    \ and its constructor are also public; note the special syntax used to designate\
    \ the function as constructor method.\n\nC#, of course, is not just limited to\
    \ public functions. It contains a total of five access modifiers, the following\
    \ three of which are important:\n\n```\n```csharp\npublic void doSomething()\n\
    {\n    doSomethingElse();\n    doProtected ();\n}\n\nprivate void doSomethingElse()\n\
    {\n    Console.WriteLine (\"Hello World from\n    ImagineClass\" + myX);\n}\n\n\
    protected void doProtected()\n{\n    Console.WriteLine (\"Protected World from\n\
    \    ImagineClass\" + myX);\n}\n```\n```\n\nDeclaring an element as *private*\
    \ means that it can only be accessed from inside the class. doSomethingElse can\
    \ only be invoked from within ImagineClass – doSomething() displays a valid approach.\n\
    \nSince C# permits the creation of object hierarchies, developers might want to\
    \ permit derived classes to access the internal state of the original class. This\
    \ can be accomplished via the *protected* access modifier.\n\nIn the following\
    \ step, change the **Main()** function in order to create a new instance of the\
    \ class. This is interesting only insofar as that the constructor’s parameters\
    \ are passed in, just as in Java.\n\n```\n```csharp\npublic static void Main (string[]\
    \ args)\n{\n    ImagineClass myCS = new ImagineClass (22);\n    myCS.doSomething\
    \ ();\n}\n```\n```\n\nC#’s individual way of handling function calls deserves\
    \ further attention. Take a look at the following snippet of code written using\
    \ a *modifier()* here receives an integer and an instance of our ImagineClass:\n\
    \n```\n```csharp\nstatic void modifier (ImagineClass myCS, int myInt)\n{\n   \
    \ myCS.myX++;\n    myInt++;\n}\n\npublic static void Main (string[] args)\n{\n\
    \    int myInt = 22;\n    ImagineClass myCS = new ImagineClass (22);\n    Console.WriteLine\
    \ (\"Before \" + myInt + \" \" +\n    + myCS.myX);\n\n    modifier(myCS, myInt);\n\
    \    Console.WriteLine (\"After \" + myInt + \" \" +\n    + myCS.myX);\n}\n```\n\
    ```\n\nRunning this program will yield the output that is shown in the image on\
    \ the following page. Methods can be permitted to modify the ByVal values passed\
    \ to them. This is accomplished by adding the *ref* keyword to the declaration\
    \ of the parameter list and the invocation:\n\n```\n```csharp\nstatic void modifier\
    \ (ImagineClass myCS,\nref int myInt)\n{\n    myCS.myX++;\n    myInt++;\n}\n\n\
    public static void Main (string[] args)\n{\n    ...\n    modifier(myCS, ref myInt);\n\
    }\n```\n```"
