  md: "![](img/e7f197876caa0b235fb5da2d16a578ea_58_0.png)\n\n# Delegate\n\nIf we were\
    \ to name one characteristic that C# features, it most definitely is **delegate**.\
    \ It can best be described as a hybrid between interfaces (which, incidentally,\
    \ are available in C#) and function pointers.\n\nIts power can best be demonstrated\
    \ by looking at the example shown below, which starts out with the declaration\
    \ of a new delegate:\n\n```\ndelegate void DelLevitate(String _whereTo);\n```\n\
    \nBoth C and Java programmers will wonder about the meaning of this line. It creates\
    \ a delegate called DelLevitate, which will return void and expects one parameter\
    \ of the type string. Since the more always leads to the lesser, let us create\
    \ two functions that fulfil the contract set up in DelLevitate:\n\n```\n```\n\
    public static void ssaudik(String _targett)\n{\n    Console.WriteLine (\"_targett\
    \ + \" is ugly. I don't\n                          want to levitate there!\");\n\
    }\n\npublic static void sylvain(String _targett)\n{\n    Console.WriteLine (\"\
    Of course! Levitating to \"\n                      + _targett);\n}\n```\n```\n\
    \nWith that, it is time to create a new instance of the delegate. Be aware that\
    \ the name of the function used in the declaration can now be used as data type.\n\
    \nIn the next step, the delegate will be created by passing a function pointer.\
    \ Adding a second one then transforms it into a multicast delegate: this is a\
    \ special form that relays incoming information to all functions inscribed within.\
    \ Finally, the delegate is invoked with a string:\n\n```\n```\npublic static void\
    \ Main (string[] args)\n{\n    DelLevitate mySaudik;\n    mySaudik = sylvain;\n\
    \    mySaudik += ssaudik;\n    mySaudik (\"Town\");\n}\n```\n```\n\nNow run the\
    \ program in order to treat yourself to the display of both messages.\n\n# Pointer\
    \ and unsafe\n\nBy default, attempts to create pointer data types are blocked\
    \ by the compiler. Using them requires the use of the **unsafe** keyword, which\
    \ informs the runtime about the ‘peculiarities’ of the code contained within it.\
    \ Sadly, harnessing the power of unsafe is not particularly sensible as many runtimes,\
    \ especially Windows Phone ones, do not permit the execution of sections marked\
    \ unsafe.\n\n# Next step\n\nBooks describing C# in its entirety tend to contain\
    \ hundreds of pages. The highlights that have been shown here cover only the most\
    \ important features. Fortunately, high similarity to C++ and Java means that\
    \ developers can ‘grok’ the language as they code – if something remains ambiguous,\
    \ auntie Google tends to answer quickly.\n\nOur journey through the world of C#\
    \ is not over yet, though. The next part of our C# series, in next month’s issue,\
    \ will take a look at some debugging aids and will furthermore introduce you to\
    \ the wide and wonderful world of multithreading – so stay tuned!\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_58_1.png)\n\
    \n**Above Modifier()** receives an integer and an instance of ImagineClass"
