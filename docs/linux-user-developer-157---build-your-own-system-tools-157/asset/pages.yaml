- pgno: 27
  md: '# RUNNING WINDOWS APPS WITH WINE


    Wine gets stubborn Windows-only apps running comfortably on Linux – so no more
    need to dual boot!


    As your day-to-day computer use – from games, through office and collaboration
    apps, to social media – moves to the web browser, relying on cross-platform, free
    and open source technologies, there’s a fairly level playing field between Linux
    and its proprietary rivals, most particularly Microsoft Windows.

    Before free software advocates rejoice too much, there remains one road block
    for many users looking to transition away from the spyware-ridden recent versions
    of Windows: a stubborn collection of legacy or proprietary software available
    only for Microsoft’s platform.

    Whether you’re an office user tied to macros written for MS Office, a worker dependant
    upon custom proprietary software for their day-to-day work, or a gamer who simply
    must have their


    fix, a serious move to Linux will only happen if you can happily run your critical
    software on your new favourite OS. Enter Wine.

    WINE stands for WINdows Emulator – or for Wine Is Not an Emulator; the ‘not’ version
    making it clear that Wine emulates no processor code, but instead replaces system
    calls to libraries and the Windows kernel with its own processes. The Wine team
    have done a fine job of keeping up with all of Windows’ changes and developments,
    with the winetricks program handling workarounds and tweaks for programs that
    won’t run on default settings.

    In this, we are complemented by PlayOnLinux, which makes installing Windows programs
    on versions of Wine easier, keeping them partitioned in different containers.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# INSTALL WINE AND PLAYONLINUX


    With many versions available, we show you which to choose and how to install successfully


    **Your distribution** makes installing most software **very easy**: you can *apt-get
    install wine winetricks* (or yum install from Fedora, CentOS and so on) and you’ll
    have a recent version. A recent stable version, that is: try *wine* –version and
    you should get an answer of 1.6 or something thereabouts. This is fine for running
    long-since-released software, like that little proprietary app that someone wrote
    for your office back before Windows XP had appeared.


    **Beta**

    For recent software, development versions are available. The 1.7.x versions of
    Wine are beta versions; they’re not guaranteed to work as well, but contain the
    latest code to get recent games, iTunes versions and more, working better than
    the last stable release of Wine.


    The **winehq.org** website contains helpful instructions on how to get Wine onto
    most GNU/Linux distributions. For Ubuntu, adding the Wine repository is the first
    step: `sudo add-apt-repository ppa:ubuntu-wine/ppa`. After this, let Ubuntu update
    its database: `sudo apt-get update`. Now install the latest version with `sudo
    apt-get install wine1.7 winetricks`. Winecraft will also be installed, consequently
    enabling a GUI-based selection of libraries, screen size, Windows versions, media
    drives and even integration between Windows folders and those on your OS.


    Winetricks is a handy set of helper scripts to get library dependencies (DLLs)
    and fonts. It’s also useful


    for helping run older versions of Internet Explorer and of course for testing
    page rendering. For when Winetricks is inadequate, PlayOnLinux should get some
    of the fussier Windows programs installed on Linux.


    # PlayOnLinux


    Installing PlayOnLinux varies considerably between different distributions. On
    the current Ubuntu LTS, running the following steps:


    ```

    ```

    wget -q "http://deb.playonlinux.com/pub/gpg" -O - | sudo apt-key add -

    sudo wget http://deb.playonlinux.com/playonlinux_trusty.list -O /etc/apt/sources.list.d/playonlinux.list

    sudo apt-get update

    ```

    ```


    ...simply adds the PlayOnLinux repository to apt’s source list. You can now install
    PlayOnLinux through apt, or through Ubuntu’s other package management tools: `sudo
    apt-get install playonlinux`


    From PlayOnLinux’s tools menu, choose *Manage Wine Versions*. From here, you can
    select different versions of Wine to download and install. As a result, if somebody
    reports definite success getting a particular game or other piece of software
    working with, say, Wine 1.7.42, then you can let PlayOnLinux use that one (see
    the image below). On a 64-bit computer, the 32-bit wine versions are on a separate
    tab.


    # Customise for each program


    Wine is capable of emulating every version of Windows, although releases before
    Windows 3.1 are now deprecated (do you desperately need to run anything that old?).
    Often it’s straightforward, but for apps that need their Windows environment just
    so, we can get Wine to play along with winecfg settings. Using the environmental
    variable **WINEPREFIX**, we can enable custom dictionaries for different apps.
    You can even run two programs at the same time with different **WINEPREFIX**es:
    for example, to model client-server software on the same machine.

    For 32-bit installs, on a 64-bit machine, for instance, call:


    ```

    ```

    WINEARCH=win32 WINEPREFIX=~/play-wine32 winecfg

    ```

    ```


    ...and the config dialog will come up on-screen ready to tweak for your installation,
    which you will do with.


    ```

    ```

    WINEARCH=win32 WINEPREFIX=~/play-wine64 /path-to/setup.exe

    ```

    ```


    To avoid having to type the same prefixes each time, use the following export
    command:


    ```

    ```

    export WINEARCH=win32

    ```

    ```


    PlayOnLinux lets you do much of this through its options, bringing up the winecfg
    GUI and checkboxes for libraries of a specific 32- or 64-bit Wine version for
    each installation.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_28_0.png)


    Left | Installing Wine through PlayOnLinux gives you complete version control'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Photoshop on Linux


    > Adobe''s recent versions of Photoshop can run under Wine as PlayOnLinux takes
    care of the complications


    Remove old Wine stains

    Wine has an uninstaller (GUI and wine uninstaller appname > for the command line.
    Deleting ~/wine/ will remove all Wine-installed apps, unless you''ve used PlayOnLinux.
    With PlayOnLinux, make separate containers while managing installations easy,
    and each installation lives in ~/PlayOnLinux''s virtual drives (vyp, a directory
    name with spaces and an apostrophe). Each application has a directory hierarchy
    of the Windows files needed. Within PlayOnLinux, selecting an app and clicking
    uninstall takes care of it. You can even create a directory with the same name
    during a PlayOnLinux install and let it overwrite the old one. To remove Wine,
    while your package manager for sudo apt-get purge remove wine) takes care of the
    software, your desktop will retain traces, such as “Open with...” options in menus
    – see the Wine FAQ for help.


    Of all the applications keeping people from migrating away from proprietary platforms
    – and discounting games for now, as few businesses depend upon their ability to
    run Grand Theft Auto in the office – Photoshop is the strongest anchor to a Windows
    system for many people.


    GNU Image Manipulation Program (GIMP) does more or less the same thing as Photoshop
    and even has much better batch processing for many jobs, but the UI is different.
    And however compatible GIMP developers make their offering with Photoshop in terms
    of functionality and the file formats handled, many users have invested thousands
    of hours in learning their craft on Adobe''s software. They''re not keen to move,
    so let us bring Photoshop and Linux together.


    Download the multi-gigabyte zipped file of the Photoshop version you need. We
    went for Adobe Photoshop CS6 Design and Web Premium, with the DesignWebPremium_CS6_LSI16.7z
    file weighing in at 4.5GB. Then download the installer program: in our case, DesignWebPremium_CS6_LSI16.exe.


    Before starting, do winetricks atmlib or you won''t be able to open PSD files!
    From PlayOnLinux''s installation page, select the graphics tab and then ‘Adobe
    Photoshop CS6’. You''ll be told it also works with the CC (Creative Cloud) version
    of Photoshop.


    PlayOnLinux selects the appropriate version of Wine – downloading it if it''s
    not already on the system – and all libraries/DLLs, so the settings optimised
    for Photoshop CS6 are already installed. A Wizard (see the bottom-left image)
    walks you through the process.


    After clicking through the usual End User Licence Agreement (EULA, possibly the
    most unread category of documents of our time, but a novel experience on a Linux
    desktop), unzip and installation begins. You can select a 30-day trial if you
    have no install key handy. There''s a lot of downloading too, including the ubiquitous
    fetching of Microsoft fonts. Unless you have a lot of RAM, super-fast Internet
    and a quick SSD hard drive, you may want to put the kettle on at this point. Or
    even go out for lunch.


    Back from lunch? Good. Adobe''s claim that you''ll get “blazingly fast performance”
    with the Mercury Graphics Engine could be behind CS6''s seeming inability to install
    properly with Wine on our test machine with an Intel graphics chipset. Our NVIDIA-equipped
    box (with default Ubuntu installed and no driver tweaking) worked just fine.


    Not being of a particularly artistic nature (as shown below), all that can be
    reported of the quality here is that Photoshop seems to work quite well, with
    a gold rating for compatibility in the Wine database.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_29_0.png)


    Above PlayOnLinux Installation Wizards are about as straightforward as they come


    ![](img/e7f197876caa0b235fb5da2d16a578ea_29_1.png)


    Right If you get runtime errors, try setting PlayOnLinux too Windows 7 for your
    version of Photoshop'
