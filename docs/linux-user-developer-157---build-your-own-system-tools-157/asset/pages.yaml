  md: "![](img/e7f197876caa0b235fb5da2d16a578ea_92_0.png)\n\n> Right: You can change\
    \ the way that specific files are executed thanks to the way file managers handle\
    \ file types\n\nHowever, I've managed to work around the problem with MPlayer\
    \ by increasing the cache via the command line with:\n\n```\n$ mplayer -cache\
    \ 10000 -cache-min 80 MyVideo.mp4\n```\n\nBut this is still a cumbersome workaround\
    \ and I have to keep remembering to use this exact option every single time.\n\
    \nSo I have a couple of questions: is there a more elegant solution to this problem?\
    \ Are there software packages, such as new codecs, I should install or a config\
    \ file I should try to alter? Secondly, is there a way I can save the command\
    \ line arguments in some kind of alias so that when I call MPlayer, it is actually\
    \ calling MPlayer with these arguments?\n\n# Scott T.\n\nTo answer your first\
    \ question, your cache solution is basically as good as you're going to get. Unfortunately,\
    \ with a single-core processor you're going to struggle with the HD videos as\
    \ it is, especially with modern distros taking up a little more of the resources\
    \ than they used to. So that leaves you with making sure you don't have to remember\
    \ the exact cache options to run it. There are two ways to do that:\n\nFirstly,\
    \ if you're doing it all from the command line anyway, you can use something called\
    \ alias. This enables you to set a command that will then call a predetermined\
    \ command, like a macro or keyboard shortcut. For example, you could have update-software\
    \ set to use apt-get upgrade or something similar. In this case, you could use\
    \ something like:\n\n```\n$ alias mp4play=\"mplayer -cache 10000 -cache-min 80\"\
    \n```\n\n...and just remember to use mp4play MyVideo.mp4 to call the video.\n\n\
    Alternatively, you could make a change to the way MP4s are launched from the graphical\
    \ file system. Right-click, go to Properties and find the Open With dialog for\
    \ your desktop environment and enter mplayer -cache 10000 -cache-min 80 as the\
    \ executable dialogue. Repeat for other file types.\n\n# Serial reading\n\nI'm\
    \ trying to talk to a modem through a usb2serial port interface. To begin with,\
    \ I managed to open a port, send commands to the modem and read back data. Currently,\
    \ I'm doing a simple read of responses using:\n\n```\nread (int fd, char *response,\
    \ 8)\n```\n\nEssentially, I'm reading eight bytes at a time (note that the modem\
    \ init was done at 1152000 8n1). Also, note that I'm monitoring for responses\
    \ from the serial port using \"select\".\n\nHowever, the response from the modem\
    \ is of varying length. Also, a fixed number of byte reads seems to be either\
    \ missing some of the bytes or adding garbage to the \"response\" string. How\
    \ can I effectively read the exact number of bytes (no more, no less) from the\
    \ modem?\n\n# Amanda P.\n\nThat should be working fine, although it's been a while\
    \ since we've had to contact a modem. The one issue we can find with what you've\
    \ asked is that the serial speed seems wrong: you've put down 1152000, when in\
    \ fact you should be using 115200 in the serial port configuration. If you need\
    \ to check this, look at the return value to see how many characters were read.\n\
    \n# Bash together a little script\n\nI am taking images from a webcam as a snapshot.\
    \ It's sending me the files so I know that part is working. Now I need a bash\
    \ script that will rename the latest file; unfortunately, file names are hard\
    \ to guess based on sequence numbers. I can only give a partial name like 192.168.0.100*,\
    \ where the names are IP data and time (and many other things) to be searched\
    \ for. Let's say I want to change the image to something like mycoolmImage.jpeg.\
    \ After that's done, I then want to delete the existing old files, in the same\
    \ manner as rm -rf 192.168.0.1*. Consequently, only the latest file will be replaced\
    \ and previous files will be removed. Now, I must detect the latest file, as if\
    \ in some cases there are multiple, I then have to use the latest and und any\
    \ cost.\n\nIt also needs to be run in a cronjob (the script) on a per minute (or\
    \ five-minute) basis.\n\n# Tommy\n\nAssuming you're receiving the files from that\
    \ IP address, here's a little bash script:\n\n```\n#!/usr/bin/bash\ncd /path/to/files\n\
    \n# Do not delete files unless two or more exist,\n# then limit in order of modtime,\
    \ select all but\n# the latest.\nif [ $(ls 192.168.0.100*.jpeg >/dev/null | wc\
    \ -l)  -ge 2 ]\nthen\n    mv $(ls -rt 192.168.0.100*.jpeg | head -n-1) ~/mycoolimage.jpg\n\
    fi\n\n# Do not mv file unless one (or more) exists,\n# otherwise mv most recent\
    \ file to target filename.\nif [ $(ls 192.168.0.100*.jpeg >/dev/null | wc -l)\
    \  -ge 1 ]\nthen\n    mv $(ls -rt 192.168.0.100*.jpeg | tail -n-1) mycoolimage.jpg\n\
    fi\n```\n\nWe've got a few fault states in there for you – basically, it checks\
    \ everything first before doing any moving or deleting. To set it up as a cronjob,\
    \ first make the file executable using chmod +x, then call up crontab -e and give\
    \ it 5*****/path/to/script as a line for it to be run every five minutes."
