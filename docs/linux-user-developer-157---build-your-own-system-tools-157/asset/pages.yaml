  md: '# OPINION FREE SOFTWARE


    # # Software communes


    The contribution of the free software movement, both in ideas and hard code, to
    the rise of Linux isn''t always given its due recognition


    ![](img/e7f197876caa0b235fb5da2d16a578ea_7_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_7_1.png)


    October is the 30th anniversary of the founding of the Free Software Foundation,
    a moment that was barely noticed in its time but can be said to have transformed
    the development of software. The concepts that define free software grew out of
    Richard Stallman''s experiences at the AI Labs at MIT, his personal history with
    the development of the LISP machine and his disputes with James Gosling over the
    licensing of Emac s. As early as October 1981, Stallman had written: “Emacs does
    not cost anything; instead, you are joining the Emacs software-sharing commune.
    The conditions of membership are that you must send back any improvements you
    make to Emacs, including any libraries you write... which could be seen as an
    early attempt to define copyleft and the first principles of the free software
    movement.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_7_2.png)


    James Gosling, who was later famous for the development of Java, wrote a version
    of Emacs, derived from Stallman''s original concept of Emacs, in C for Unix. According
    to Stallman, he “seemed to have been influenced by the same spirit of sharing
    and cooperation of the original Emacs... He wrote in a manual that he called the
    program Emacs hoping that others in the community would improve it until it was
    worthy of that name.” Gosling initially enabled free distribution of the source
    code, to which others had contributed, and Stallman incorporated some of the code
    in early versions of GNU Emacs, but in April 1983, according to Stallman, “he
    staked everyone in the back by putting copyrights on it, making people promise
    not to redistribute it, and then selling it to a software house.”


    Gosling had sold GDSMACS, his version of Emacs, to UniPress and quasi-legal threats
    were made against Stallman. When GNU Emacs was released in the year 1985, UniPress
    announced that “portions of the GNU Emacs program are most definitely not public
    domain, and that use and/or distribution of the GNU Emacs program is not necessarily
    proper.”


    Stallman rewrote the offending sections of GNU Emacs, but the confrontations with
    Gosling and UniPress had convinced him that public domain was not sufficient to
    protect the rights of free software. Stallman''s solution was to invert copyright
    law and reassign the rights to the user. The first tangible version of such a
    licensing regime was ''the GNU Emacs copying permission notice'' in 1985, although
    the GPL as we know it first appeared in 1989. The GPL, and its preamble were the
    most complete expression of the principles of free software, but the moment that
    made free software a concept to be reckoned with was the release of the Linux
    kernel. Linux had been developed using the GNU tools and was licenced under the
    GPL.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_7_3.png)


    **Richard Hillesley**

    *writes about art, music, digital rights, Linux and free software for a variety
    of publications*


    Linus Torvalds later said that “making Linux GPL''d was definitely the best thing
    I ever did”. The informality of the model that grew around GNU/Linux and the GPL
    gave everybody the chance to take part and make a difference. You could do anything
    with Linux, bash it to pieces, install it on your virtual fridge or washing machine,
    share it or break it, create your own distribution and share it with the world.
    If you couldn''t write code, you could write documentation, host websites, make
    friends or sell t-shirts.


    > The informality of the model that grew around GNU/Linux and the GPL gave everybody
    the chance to take part and make a difference.


    This surprising effect extended to the commercial world. Once more, as one hardware
    company had formed a commitment to Linux, it became obvious that there was a mutual
    advantage in contributing back to the project and they did. The framework that
    made this possible was the GPL. The release of core chunks of corporate code accelerated
    the development of Linux and ensured its success in the enterprise, enhanced by
    its portability across a wide range of hardware. The GPL encouraged commoditisation,
    and at the system level, commoditisation reduced the costs and subsequently benefited
    everybody.


    Commoditisation of the operating system ensures commoditisation of standards.
    This makes it easier to port software between different machines and architectures,
    and makes it easier to design hardware itself. Companies don''t use GNU/Linux
    because of sentimental attachment to Linux or the GPL, or “open source”. They
    use GNU/Linux and free software because it makes business sense. And free software,
    guaranteed by the GPL, gave assurance of the continued freedom and community of
    the code. The contribution of the free software movement, both in ideas and hard
    code, to the rise of Linux isn''t always given the recognition it deserves.'
