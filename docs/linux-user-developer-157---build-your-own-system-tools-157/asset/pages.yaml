  md: "# # Feature\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_63_0.png)\n\nAbove\
    \ A perfect sine wave -- see Step 12\n\n# ## Full code listing (Cont.)\n\nStep\
    \ 07\n\n```\n```\n    # Ensure we are giving correct values\n    if scaled < 0:\n\
    \        scaled = 0.0\n    elif scaled > 100:\n        scaled = 100.0\n    \n\
    \    print_(\"0\": (1)) .format(_r_, _scaled) )\n    self.pins[1].ChangeDutyCycle(scaled)\n\
    ```\n\n```\n\n# ## 07 Create LED class\n\nThe LED controller class is simple.\
    \ The **init** function will take a tuple containing (R, G, B) pin numbers and\
    \ set up the pins. There is a **set_colour** function that takes an (R, G, B)\
    \ tuple where the values are between 0 and 255. Finally, there is a **test** function\
    \ that sets a random colour every second. This class could be reused in a different\
    \ project and so no modifications. The class is well commented so doesn’t need\
    \ any further explanation.\n\n```\n```\ndef test(self):\n    # Change to a random\
    \ colour\n    while True:\n        r = randrange(0, 256)\n        g = randrange(0,\
    \ 256)\n        b = randrange(0, 256)\n        self.set_colour((r, g, b))\n  \
    \      time.sleep( )\n```\n\n```\n\n# ## 08 Create the frequency analyser\n\n\
    The frequency analyser class is responsible for taking the audio data, then filtering\
    \ it into either bass, middle or treble, and then controlling the LEDs. As arguments,\
    \ it takes the number of channels in the audio data (assumed to be one or two),\
    \ the sample rate (usually 44100Hz) and an instance of the LED-controller class.\n\
    \nStep 08\n\n```\n```\nclass FreqAnalyser:\n    # Filtering based on\n    # http://wiki.scipy.org/Cookbook/ButterworthBandpass\n\
    \    \n    def __init__(self, channels, sample_rate, leds=None):\n        self.leds\
    \ = leds  # Not needed if just plotting\n        self.channels = channels\n  \
    \      self.sample_rate = sample_rate\n        self.nyquist = float(sample_rate)\
    \ / 2\n        \n        # Filter order - higher the order the sharper\n     \
    \   # the curve\n        order = 3\n```\n\n```\n\n# ### 09 The init method\n\n\
    After storing the input parameters, we calculate the Nyquist frequency, which\
    \ is half of the sample rate. Nyquist’s theorem says that the sample rate of any\
    \ analogue signal needs to be at least twice the analogue frequency. This is why\
    \ CDs are sampled at 44.1kHz (human hearing ends at around 20kHz). Then design\
    \ two butterworth filters (a filter designed to have a frequency response as flat\
    \ as possible). The low-pass filter cut-off is 200Hz and the high-pass cut-off\
    \ is 4000Hz. The parameters are later used to filter with these characteristics.\n\
    \n```\n```\n        # Cut off two frequencies:\n        # Low pass filter\n  \
    \      cutoff = 200 / self.nyquist\n        # Numerator (b) and denominator (a)\n\
    \        # polynomials of the filter.\n        b, a = butter(order, cutoff, type='lowpass')\n\
    \        self.low_b = b\n        self.low_a = a\n        \n        # High pass\
    \ filter\n        cutoff = 4000 / self.nyquist\n        b, a = butter(order, cutoff,\
    \ type='highpass')\n        self.high_b = b\n        self.high_a = a\n```\n\n\
    ```\n\n# ### 10 Colours\n\nFinally, we want the colour changes to the strip to\
    \ be pronounced and noticeable, with reduced flickering. To achieve this, we can\
    \ store the max value and use it to have colours fall by a certain amount until\
    \ the energy of the song pushes them back up. The fall list sets the rate for\
    \ each colour/frequency in the order (R, G, B/bass, mids, treble). The range of\
    \ values for a colour is between 0 and 255. The LEDs are set at a frequency of\
    \ Sample Rate/CHUNK, CHUNK is the amount of data to read at once. We set CHUNK\
    \ to 512, so 44100/512 = 86 times a second. Keep this in mind when setting your\
    \ fall values, as they depend on what you think looks good and the style of music.\n\
    \nStep 10\n\n```\n```\n        # Keep track of max brightness for each colour\n\
    \        self.max = [0.0, 0.0, 0.0]\n        # Make different frequencies fall\
    \ faster\n        # bass needs to be punchy.\n        self.fall = [15.0, 2.5,\
    \ 5.0]\n```\n\n```\n\n# ### 11 The filter function\n\nThe filter function is fairly\
    \ straightforward. An array of samples called data is passed in where the samples\
    \ are values between -1.0 and 1.0. This is the standard format for signal processing,\
    \ as opposed to the 16-bit integers used in WAVe files and CDs. The low- and high-pass\
    \ filters are then applied using the parameters we calculated before in Step 9.\
    \ We then get the middle band by subtracting the sum of the low and high filter\
    \ from the original signal.\n\nStep 11\n\n```\n```\n    def filter(self, data):\n\
    \        # Apply low filter\n        self.low_data = lfilter(self.low_b,\n   \
    \                            self.low_a,\n                               data)\n\
    \        \n        # Apply high filter\n        self.high_data = lfilter(self.high_b,\n\
    \                                 self.high_a,\n                             \
    \    data)\n        \n        # Get mid data by doing signal - (low + high)\n\
    \        self.mid_data = np.subtract(data,\n                                 \
    \   np.add(self.low_data,\n                                           self.high_data))\n\
    ```\n\n```"
