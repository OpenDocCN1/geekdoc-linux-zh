- pgno: 56
  md: ".NET languages can be combined with a variety of GUI stacks; the IDE will display\
    \ a selector offering various project types. For now, a C# Console Project shall\
    \ suffice. Name your project to see the structure shown in the image on page 56.\n\
    \nDevelopers coming to the world of .NET must acquaint themselves to a new structuring\
    \ paradigm. A product – be it an aerial torpedo or a game – is stored in a container\
    \ structure called a Solution. Individual deliverables, such as libraries, resource\
    \ projects or executables, are then stored as projects. In most development environments,\
    \ only one project can be active at any given time; it is the one affected by\
    \ debug and run operations. Selecting the currently active project is done by\
    \ left-clicking it in the Solution window. The context menu will contain a toggle\
    \ labelled 'Set as Start-Up project.\n\nIt’s time to take a look at the code created\
    \ by the assistant:\n\n```\n```csharp\nusing System;\n\nnamespace ImagineCS1\n\
    {\n    class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            Console.WriteLine (\"Hello World!\");\n        }\n   \
    \ }\n}\n```\n```\n\nC# code is subdivided into namespaces. Each namespace contains\
    \ classes, interfaces and similar objects. In fact, the entire system API is exposed\
    \ via a set of namespaces.\n\nAccessing a member of a namespace is done via its\
    \ qualified name. So the Console object could be addressed:\n\n```\n```csharp\n\
    public static void Main (string[] args)\n{\n    System.Console.WriteLine (\"Hello\
    \ World!\");\n}\n```\n```\n\nSince namespaces can be nested at an arbitrary depth,\
    \ programs tend to become unwieldy quickly. This can be solved via the using directive,\
    \ which exposes the public members of the namespace, as shown in the image.\n\n\
    The rest of the project skeleton is not particularly impressive. Main() acts as\
    \ the entry point to Console. WriteLine writes the string passed to it to the\
    \ command line.\n\n# How C is it?\n\nFiguring out how close, or how distant, C\
    \ and C# are to one another is best accomplished by looking at the type system.\
    \ C# is a statically typed language: this means that every variable must be of\
    \ a specified type. The table above shows the basic types found in the runtime.\
    \ C++ programmers tend to get tripped up by the array syntax. Fortunately, this\
    \ can be solved by looking at the following demo project:\n\n```\n```csharp\n\
    class MainClass\n{\n    static int[] myField;\n```\n```\n\n| Short.Name | .NET.Class\
    \ | Type | Width | Range (bits) |\n|---|---|---|---|---|\n| byte | Byte | Unsigned\
    \ integer | 8 | 0 to 255 |\n| sbyte | SByte | Signed integer | 8 | -128 to 127\
    \ |\n| int | Int32 | Signed integer | 32 | -2,147,483,648 to 2,147,483,647 |\n\
    | uint | UInt32 | Unsigned integer | 32 | 0 to 4,294,967,295 |\n| short | Int16\
    \ | Signed integer | 16 | -32,768 to 32,767 |\n| ushort | UInt16 | Unsigned integer\
    \ | 16 | 0 to 65,535 |\n| long | Int64 | Signed integer | 64 | -9223372036854775808\
    \ to 9223372036854775807 |\n| ulong | UInt64 | Unsigned integer | 64 | 0 to 18446744073709551615\
    \ |\n| float | Single | Single-precision floating-point type | 32 | -3.402823e38\
    \ to 3.402823e38 |\n| double | Double | Double-precision floating-point type |\
    \ 64 | -1.79769313486232e308 to 1.79769313486232e308 |\n| char | Char | A single\
    \ Unicode character | 16 | Unicode symbols used in text |\n| bool | Boolean |\
    \ Logical Boolean type | 8 | True or false |\n| object | Object | Base type of\
    \ all other types | - | - |\n| string | String | A sequence of characters | -\
    \ | - |\n| decimal | Decimal | Precise fractional or integral type that can represent\
    \ decimal numbers with up to 29 significant digits | 128 | ±1.0 × 10e−28 to ±7.9\
    \ × 10e28 |\n\n\nC# considers “array” to be a data type. This is a significant\
    \ improvement in that it permits developers to write int[] myField, myField2;\
    \ and get two arrays – in vanilla C, developers trip up.\n\n```\n```csharp\npublic\
    \ static void Main (string[] args)\n{\n    int[] myField = new int[100];\n   \
    \ for (int i=0; i<100; i++) {\n        myField [i] = i;\n    }\n\n    foreach\
    \ (int x in myField) {\n        Console.WriteLine (x);\n    }\n}\n```\n```\n\n\
    The language design of C# placed significant emphasis on the management of collection\
    \ classes: programmers are provided with turnkey-ready generic collections. Traversing\
    \ the content is simplified by the foreach structure: this permits the declaration\
    \ of a local variable, which is filled with one element after another. Microsoft’s\
    \ ‘pricing’ of the C family also extends to the switch statement: Fall-through\
    \ clauses are not permitted, therefore writing code like this leads to a compiler\
    \ error:\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_56_0.png)"
