- pgno: 94
  md: '![](img/e7f197876caa0b235fb5da2d16a578ea_94_0.png)


    Above Finally, a real use for the comfortable Impulse purchase


    # Linux on the go


    Hi there. I’m computing student and do a lot of my development work in Linux.
    I also quite like to work outside or in coffee shops. The problem is the battery
    life of my old laptop: I get into the flow of things and then the power LED lights
    up red, starting the countdown to 0% at the most inconvenient time! I have a couple
    of tablets lying around at home, so I’m wondering if there’s some way of putting
    Linux onto them?


    Gemmy


    Hi Gemma. One of the simplest solutions involves renting a cloud-based Linux server
    and then simply SSH-ing in using an app on your tablet, or using a VNC client
    if you need to use a GUI. We first discovered this solution a while back, courtesy
    of a series of interesting blog posts by Mark O’Connor – have a read through the
    articles yourself and see what you think: yieldthought.com/search/linux.


    Essentially, Mark rents an SSD server from Linode (linode.com) and hooks into
    it from his iPad using a combination of iSSH and GNU Screen. He seems quite pleased
    with the setup in his posts and we’ve certainly been tempted to give it a go.
    Plenty of others have, looking at the responses, and it seems to be a reliable
    system.


    The only issue with recreating his system is that the iSSH app is now defunct.
    Not to worry though, we can recommend a couple of replacements: Prompt 2 for iPads
    and JuiceSSH for Android tablets, depending on the devices that you own. As for
    getting a GUI up, we like using the VNC Viewer app by RealVNC, available on both
    iTunes and Google Play. For the server end, you can check out the remote desktop
    tutorials on Linode’s website: bit.ly/1iE2XQX.


    It shouldn’t take too long to get your tablets set up with these apps and Linode
    registration is very simple. User feedback for the service is excellent too, with
    incredibly quick response times should you need to get in touch with customer
    service.


    Linode is also affordable, even on a student budget – pricing plans start at $10
    per month for a single-core plan with 1GB of RAM, rising for the 2GB and 4GB plans
    to a maximum of $68 and six cores for $80 per month (though you probably won’t
    need that). The service comes with a great Linode Manager app (both Android and
    iOS) that enables you to administer your server without having to use third-party
    SSH or VNC apps.


    Once you set up on Linode, you should then be able to work on your tablets without
    having to worry about finding a way to install Linux. It’s certainly possible
    with Android (check out issue #144), but as far as we know there isn’t yet a reliable
    way of getting a fully-functional Linux OS working on an iPad, outside of virtualisation
    or some really hacky workarounds.'
