  md: '# RE-CREATE CORE TOOLS


    Build simple versions of ls and wc, and work with process IDs


    In this part we will program simple versions of two existing

    Linux tools to help you understand that, behind the scenes,

    things are simpler than you might think. We’ll also show how

    to get the process ID as well as the parent ID of a program.

    Despite the simplicity, you should always remember that

    the difficulty in programming systems software lies in the

    numerous details of a program, for instance error checking,

    command line processing, error handling and so on. The good

    thing with such details is that you should be able to write the

    code once and then use it everywhere!

    As you can also see, all programs have comments. Even

    if a program is small, you should always put the necessary

    comments in it.

    Warning: the C programming language assumes that the

    programmer always knows what they are doing and does not

    question them unless there is an error in the code. So, if there

    is an error, the C compiler will not generate an executable. If

    there exists any number of warning messages, but no errors,

    then the compiler will create an executable, which is not always

    good. As a general principle, you should always try to resolve

    not only error messages, but warnings as well.


    **Challenge yourself**

    Once you’ve worked through these utilities

    and had a go at re-creating another

    standard Linux utility of your choice,

    there’s another good exercise for you to

    try: combine multiple utilities into a single

    program. You might, for example, try

    making a tool that combines cat with wc,

    to give you the word count of the newly-

    concatenated file.


    ```

    ```C

    myLS.c

    #include <fcntl.h>

    #include <stdlib.h>

    #include <stdio.h>

    #include <dirent.h>


    int main(int argc, char **argv)

    {

    if (argc != 2)

    {

    printf("Please provide the correct number of arguments!\n");

    return -1;

    }

    DIR *theDirectory;

    struct dirent *entryP = NULL;


    // Open the directory

    if ((theDirectory = opendir(argv[1])) == NULL )

    {

    printf("Cannot open directory %s.\n", argv[1]);

    return -1;

    }


    // Read all its entries

    while (( entryP = readdir(theDirectory)) != NULL )

    {

    printf("%s\n", entryP->d_name);

    }

    closedir(theDirectory);

    return 0;

    }

    ```

    ```


    ![](img/e7f197876caa0b235fb5da2d16a578ea_23_0.png)


    # Light version of ls


    In this section we are going to program a simple version of

    the ls program. It will just print the files and sub-directories of

    the directory that will be given as a command line argument.

    Type in the code shown to the right, or grab it from FileSilo. As

    usual, you should compile it using the following command:


    ```

    `$ gcc -Wall -o myLS myLS.c`

    ```


    The DIR type used in the program (line 14) represents a

    directory stream and is the Unix way of reading a directory.

    The dirent structure (line 15) contains not only the name of the

    file or directory, but many other things – you will learn more

    about the dirent structure in a forthcoming tutorial. You can

    also visit bit.ly/1E09WW7.

    The parameter of the myLS program is just a pathname.

    As you may already know, there are two kinds of pathnames:

    absolute and relative. Absolute pathnames begin with a slash

    whereas relative pathnames do not. The opendir() system

    call opens the directory and returns a directory stream (line

    18). The readdir() system call returns a pointer to a dirent

    structure. You can access all its elements of a directory

    stream with the help of a while() loop (line 25). When you reach

    the end of the directory stream, NULL is returned and the

    while loop will end.

    If you choose to compile and execute myLS, you will find out

    that each entry is printed on a separate line as a result of the

    last printf() statement.


