- pgno: 20
  md: '# WHAT IS SYSTEMS PROGRAMMING?


    System calls and techniques of system programming


    +   - **Systems programming** is a special area of programming in a **Unix environment**.
    Back when Unix was first introduced, the only way to write systems software was
    by using C. Nowadays, you can program systems software using other languages as
    well.

    +   Most commands that have to do with system administration tasks, such as disk
    formatting, network interface configuration, module loading, kernel performance
    tracking and so on, are implemented using the techniques of systems programming.

    +   The key difficulty in systems programming is the fact that a wrong system
    call can make your Linux machine misbehave or, even worse, crash altogether. Most
    Linux security issues usually come from poorly implemented system software, so
    you should be extremely careful when using system calls because code with bugs
    can compromise the security of an entire system. The worst part is that this can
    happen many years after using the vulnerable software.


    # Areas of systems programming


    It is possible to group system calls and techniques into the following categories:


    +   - **File I/O**: This is the first thing that an operating system will have
    to deal with. File I/O must be efficient, secure and easy to implement.

    +   - **Advanced File I/O**: Apart from the basic I/O system calls, there is a
    plethora of additional calls that offer nonblocking I/O, asynchronous I/O and
    so on.


    +   - **Files and directories**: Besides reading and writing to regular files,
    Unix offers system calls that let you get more advanced information about files
    and directories, such as the owner and the attributes of a file.

    +   - **System files and information**: There exist various system calls that
    let you read and write to special files, such as /etc/passwd. Additionally, there
    are system calls that let you acquire information, such as the current time of
    a system.

    +   - **Controlling processes**: Linux enables you to create new processes, execute
    programs, terminate processes and supplies various system calls that can help
    you do the job.

    +   - **Threads**: Threads enable a single process to perform multiple tasks.
    Unix offers system calls that let you create, synchronise, etc. your threads.

    +   - **Server processes**: Writing code that can create a server process has
    some unique requirements and certain techniques that use specific system calls.

    +   - **Interprocess communication**: Certain system calls enable processes to
    communicate with each other using pipes, FIFOs, message queues, semaphores and
    shared memory.

    +   - **Network programming**: Although network programming from a Unix perspective
    looks a lot like reading from a regular file, there are certain system calls that
    are unique to network programming. In particular, such system calls as functions
    that have to do with resolving hostnames and converting IP addresses are stored
    as strings to a format that can be used in a Linux system.

    +   - **Signal processing**: Signals provide a way of handling asynchronous events.
    Almost all applications will need to be able to handle signals.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_20_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_20_1.png)


    # States of a Linux process


    Back when Unix was first introduced, computers had single CPUs without multiple
    cores and a very small amount of RAM. However, Unix was a multi-user and multi-tasking
    operating system. In order to actually be multi-user and multi-tasking, it had
    to be able to run each individual process separately, which means that a process
    should have multiple states. There are three categories of processes: user processes,
    daemon processes and kernel processes. User processes run in user space and usually
    have no special access rights. Whereas kernel processes are executed in kernel
    space only and can fully access all kernel data structures. Daemon processes are
    programs that can be found in the user space and run in the background without
    the need for a terminal.


    A dedicated user other than root owns them and as a rule, they have more rights
    than an ordinary user process, but fewer privileges than a kernel process. A web
    server is a daemon process, php''s utility is a user process and the worker is
    a kernel process. It is important to recognise that a process cannot go directly
    from state one to state three, or state four, without going into state two first.
    You will learn more about process states in forthcoming articles. For now, it
    is sufficient to understand that you cannot control the state of a process; this
    is the job of the Linux scheduler that runs in the kernel. But, simply, you cannot
    know when the state of a process will change or when the process is going to go
    into a running state again.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_20_2.png)'
