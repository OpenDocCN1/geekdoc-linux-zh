- pgno: 72
  md: '![](img/e7f197876caa0b235fb5da2d16a578ea_72_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_72_1.png)


    Left To find the Pi SD card images, click the text link just below the three OS
    logos shown, or go straight to osmc.tv/download/images


    # 12 One step forward, seven steps back


    Back in Step 5, we set up our MEDIA/DRIVE Samba share by editing the Samba config
    file and we have forgotten all about it since. Well, there’s more we can do with
    Samba. As well as making drives readable on our network, we can also make them
    writable, so let’s do that. Open /etc/samba/smb.conf with your favourite editor
    and find your drive’s Samba configuration (this should be at the very bottom of
    the file). Right at the end, just after public=yes, add:


    ```

    writable = yes

    ```


    Exit and save.


    # 13 So did that work?


    Now we should have a working Samba service running in the background of our computer,
    but first we need to restart it to make our changes take effect. Before we do
    that, though, we can check which properties will take effect on restart with the
    command testparm. Run it as an ordinary user (you shouldn’t need to sudo here),
    press Enter when prompted and look at the output. If you aren’t shown any error
    messages, your config should be fine. So, it is the time to restart Samba again
    with sudo service smbd restart.


    # 14 Drag, drop, play and enjoy


    We now have a network-visible and writable hard drive that OSMC can play files
    from. You can drag the personal files the you want to watch from one computer
    on your network onto the Samba drive and have them pop up on OSMC straight away.
    Let’s imagine you use OS X in your day-to-day life (sacrelegie!). To add a file
    to OSMC, you would only have to open Finder, click Go>Connect to Server, then
    enter the Samba address for your drive. Next, enter the username and password,
    just like before, and then drag the file into the window. Now that file is on
    OSMC and you didn’t even have to touch it!


    # Remember that you don’t have to share your entire drive, only a certain folder
    with your drive


    # 15 More please


    If you want to add multiple drives to OSMC, you can repeat Steps 4 through 9.
    But remember that you don’t have to share your entire drive, only a certain folder
    within your drive – all you have to do is change the path variable to point to
    a folder. The address will still be the same because it’s made up of the IP address
    and Samba name of your drive. When used properly, this can help you to manage
    your media over the network.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_72_2.png)


    # 16 When the party is over


    If you find yourself wanting to remove your Samba drive as a shared resource in
    OSMC, it’s pretty simple. On OSMC, go to Videos>Files and highlight – but don’t
    click/enter – your Samba drive. Open the context menu (C on your keyboard) and
    select Remove source. You’ll be asked if you’re sure and if you want to remove
    all of the references to the media. If you never intend to use the Samba drive
    again, you can remove the references.'
