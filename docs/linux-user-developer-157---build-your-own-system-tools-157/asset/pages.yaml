    ENTERPRISE


    # Linux Foundation announces the Open Mainframe Project


    # Brings together industry and academic partners


    The Linux Foundation has announced a project in partnership with industry giants
    to advance an enterprise-grade platform for Linux on mainframe devices, unsurprisingly
    dubbed the Open Mainframe Project.


    The project brings together industry giants ADP, CA Technologies, IBM and SUSE
    as founding platinum members, while BMC, Compuware, LC3, RSM Partners and Viron
    Infinity join as silver-level members. Its formation comes as industry demand
    for mainframe systems resurges thanks to interest in cloud computing and big data
    topics.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_5_0.png)


    “Linux today is the fastest-growing operating system in the world. As mobile and
    cloud computing become globally pervasive, new levels of speed and efficiency
    are required in the enterprise and Linux on the mainframe is poised to deliver,”
    claimed Jim Zemlin, executive director at the Linux Foundation, at the project’s
    announcement. “The Open Mainframe Project will bring the best technology leaders
    together to work on Linux and advanced technologies from across the IT industry
    and academia to advance the most complex enterprise operations of our time.”


    The Open Mainframe Project is an official Linux Foundation Collaborative Project
    and aims to leverage the strengths of Linux in order to take advantage of the
    unique features of mainframe hardware. This includes the LinuxONE family, announced
    the same day by IBM and Canonical.


    As well as industry members, several academic institutions have confirmed membership
    of the project, including the University of Bedfordshire. “This is an exciting
    time to be involved in enterprise technologies. The potential benefits of open
    source systems optimised to run on the mainframe’s highly scalable and reliable
    architecture are very significant,” claimed Herbert Daly, senior lecturer in computer
    science and technology at the University. “The Open Mainframe Project offers our
    staff and students a fantastic opportunity to collaborate with an outstanding
    field of talent, dedicated to shaping the future of business-critical enterprise
    computing.”


    One of the first tasks for the Open Mainframe Project is the establishment of
    a neutral home for community meetings, events and collaborative discussions, providing
    structure around the business and technical governance of the project. On a technical
    level, the group aims to broaden the tools and resources that are intended to
    drive development and collaboration of mainframe Linux, while also coordinating
    mainframe improvements to upstream projects. This is in order to increase the
    quality of these code submissions and ease upstream collaboration.


    “Demand has grown among academic, corporate and government partners for furthering
    the mainframe’s expansion into the open ecosystem,” claimed Ross Mauri from IBM.
    “IBM looks forward to contributing our expertise to the community and learning
    from others to find innovative ways to combine the flexibility of open-source
    software with the world-class speed, security and scalability of the mainframe.”


    Left: Mainframes such as IBM’s z Systems drive enterprise platforms and big data
    computing'
