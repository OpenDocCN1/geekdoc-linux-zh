    \ aDataFrame\n  v1 v2 v3 v4 v5\n1  1 0 -1  0 -1\n2  2 1 -2  0 -2\n3  3 2 -3  1\
    \ -3\n4  4 3 96  2 -4\n5  5 4 -5  3 -5\n> aDataFrame[,1]\n```\n\nLeft R enables\
    \ you to apply operations to specific rows and columns of a table\n\n```\n> myDataFrame$v1\
    \ - 5\n[1] -4 -3 -2 -1  0\n```\n\n```\n> anotherMatrix <- matrix(unlist(myList),\
    \ ncol = 2, byrow = TRUE)\n```\n\n# Get help\n\nThe following command adds ten\
    \ to all elements of the first row:\n\nThe previous command requires that you\
    \ manually specify the number of columns of the new matrix because you are converting\
    \ a linear type into a two-dimensional one. You can transform a vector named aVector\
    \ into a list as follows:\n\nR offers a plethora of ways to get help about functions:\
    \ if you type a question mark at the R prompt, followed by the name of a function,\
    \ R will return something similar to Unix man pages:\n\n```\n> myDataFrame[, ]\
    \ + 10\n```\n\n```\n> anotherList <- as.list(aVector)\n```\n\n```\n? Sys.sleep\n\
    ```\n\nThe following command adds minus one to the first column, zero to the second\
    \ and one to the third column of myDataFrame:\n\nYou can convert a list named\
    \ anotherList into a vector with the help of the unlist() function:\n\n```\nThe\
    \ following command will return working examples for the read.table() function:\n\
    ```\n\n```\n> myDataFrame + -1:1\n```\n\n```\n> aNewVector <- unlist(anotherList)\n\
    ```\n\n```\n? example(read.table)\n```\n\nRemember that as long as you do not\
    \ assign the result of an operation to the myDataFrame variable, the original\
    \ contents of myDataFrame will not change.\n\nThe next command creates a new column\
    \ named sum to myDataFrame that contains the sum of all values of each row:\n\n\
    # 10  Save and load your work\n\n```\nThe next command will show you an impressive\
    \ demo of the graphic capabilities of R:\n```\n\n```\n> myDataFrame$sum = myDataFrame$v1\
    \ + \nmyDataFrame$v2 + myDataFrame$v3\n```\n\nSo far, you have seen how to change\
    \ your data in various ways. The final step will describe how to save your data\
    \ and load it the next time you run R. You can save your current R session, including\
    \ all defined variables, as follows:\n\n```\ncapabilities()\n```\n\nAs you can\
    \ understand, this operation does alter myDataFrame by adding a new column to\
    \ it. Using the same method, you can perform any kind of calculations you want.\n\
    \n```\n> save(list = ls(all=TRUE), file = \"R25Aug2015\")\n```\n\nThe next commands\
    \ will show you an impressive demo of the graphic capabilities of R:\n\n# 09 \
    \ Convert between various data types\n\n```\nR25Aug2015.capabilities()\n```\n\n\
    This step will show you how to convert between lists, data frames, vectors and\
    \ matrices. Given a matrix named myMatrix, you can convert it into a list using\
    \ the following command:\n\nThe operating system will create a file named R25Aug2015\
    \ that you can load afterwards as follows:\n\n```\n> load((file = \"R25Aug2015\"\
    )\n```\n\n```\n> myList <- as.list(data.frame(t(myMatrix)))\n```\n\nThe following\
    \ command can be used for removing all currently defined types of R objects:\n\
    \n```\n> rm(list=ls())\n```\n\nGiven a list name myList, you can convert it into\
    \ a matrix with this command:\n\nR is an endless subject and you can only learn\
    \ more about it by practising, so start experimenting and give your data many\
    \ new meanings!"
