  md: '# ## ROUTERS


    # # FCC threatens to block custom router firmware


    New software-defined radio rules could spell trouble for enthusiasts


    The ease with which wireless network routers can be modified with a third-party
    firmware is set to take a hit thanks to new rules from the **US Federal Communications
    Commission that promise to block firmware modifications.**


    Under rules that became effective this year, set to be fully enforced for all
    devices on the market in June 2016, the FCC is to require all licensed devices
    – a requirement for sale in the US – to “implement software security to ensure
    that the devices operate as authorised and cannot be modified,” seemingly to lock
    out third-party modifications.


    Replacing the stock firmware of Linux-based networking hardware with more powerful
    third-party alternatives, such as OpenWRT, is popular enough that there are router
    models designed with this specifically in mind. However, under the new FCC Part
    15 rules, they could become illegal in the US over fears that they could be used
    to operate in unlicensed spectrum, or at illegal power levels.


    Speaking at the Wireless Battle of the Mesh event in Slovenia, Simon Wunderlich
    argued that this was likely to have a global impact. “Since the same types of
    devices are often sold worldwide, he claimed, “this change does not only affect
    routers in the US, but also Europe, and this will also affect wireless communities.”


    ![](img/e7f197876caa0b235fb5da2d16a578ea_8_0.png)


    As well as unlocking new features, third-party firmware is often used to breathe
    new life into devices that manufacturers have ceased to support. This means that
    under the new rules, consumers could be left running insecure devices on their
    network due to the new restrictions.


    # ## STORAGE


    # # Kinetic is now an open Linux project


    Seagate’s enterprise-grade storage platform, Kinetic, is now an official **Linux
    Foundation** Collaborative project, with companies including Western Digital,
    Toshiba, Dell and Cisco joining the development effort.


    Kinetic combines storage devices featuring integrated Ethernet connectivity with
    a key/value store paradigm claimed to improve the efficiency, scalability and
    flexibility of enterprise storage.


    Using open source software and a standardised set of application programming interfaces
    (APIs), storage developers can use a Kinetic system to reduce the overheads of
    storage area network (SAN) implementations, taking advantage of features like
    direct drive-to-drive data transfer via Ethernet, without needing an intermediate
    host device.


    Although billed as the Kinetic Open Storage platform, the standard remained under
    Seagate’s control until the formation of the Linux Foundation Collaborative Project.
    Now truly open, network and storage vendors have joined and pledged their support,
    but none have offered a release date for Kinetic-compatible, Ethernet-enabled
    storage devices.


    According to documentation, Kinetic enables an increase in rack density, a reduction
    in power draw and cooling, easy data sharing, and the removal of the company calls
    “superfluous layers of legacy software and hardware” associated with traditional
    SAN platforms.


    “[The Seagate Kinetic Storage platform…] delivers the new paradigm necessary to
    enable us collectively, as an industry, not only to meet this mandate, but to
    do so optimally and in the most cost-efficient manner required,” a company spokesman
    claimed at the announcement.


