  mdcn: "\n![](img/e7f197876caa0b235fb5da2d16a578ea_73_0.png)\n\n## 你需要什么\n\n-   Dallas\
    \ Maxim 温度传感器\n-   面包板\n-   4.7k 电阻\n\n## 驾驭 1-Wire 总线的强大功能\n\n定制传感器电路需要信号处理经验。1-Wire\
    \ 总线简化了对现成传感器的访问。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_73_1.png)\n\n**Tarn\
    \ Hanna**\n自 Palm Illc 时代起便从事 IT 行业。作为一名记者、导师、演讲者和作者，Tarn 对移动市场的各个方面都观察过不止一次。\n\
    \n在与传感器交互时，通常会使用三种总线之一。SPI 用于高带宽应用，而速度较慢的 I2C 则擅长处理大量较慢的传感器。Dallas Maxim 专有的 1-Wire\
    \ 总线比 I2C 具有更慢的数据速率和更长的传输距离，使其非常适合与像天气传感器和温度计这样的小型设备进行通信。它非常有趣，因为 1-Wire 总线只需两根线即可连接到传感器——电源是通过数据线提供的。\n\
    \n该总线已在两个应用领域牢固确立了地位。第一个是 iButtons，它们包含内存和/或用于访问控制的加密 ID——例如，它们曾被用作住宅区或校区的钥匙，以及公共交通的“智能票卡”。就第二个主要应用而言，Dallas\
    \ Maxim 还销售一系列廉价的温度传感器，我们将在此处对其进行探讨。\n\n我们将向你介绍 DS18B20 系列。它们简化了精确温度数据的收集——告别\
    \ AD 转换器、线性化等麻烦。\n\n## 01 更新你的树莓派\n\nDallas Maxim 的 1-Wire 总线通过内核模块实现，随着内核 3.18.3\
    \ 的引入，该模块发生了重大变化。因此，建议进行更新。运行命令 `sudo apt-get update` 和 `sudo apt-get upgrade`，并通过输入\
    \ `uname -r` 检查当前内核版本。\n\n## 02 连接传感器\n\n为了测量数据，必须将传感器连接到处理计算机。寄生模式网络按照下一页顶部的图示接线。图中所示的电阻是上拉电阻，负责在总线未被主动拉低时使其“浮动”至\
    \ 3V3。\n\n## 03 施加电源\n\n1-Wire 的创新之处在于其电源寄生特性：每个传感器都有一个充电电容器，用于提供测量所需的能量。上拉电阻的驱动能力有限，因此在较大的网络中，建议直接提供电源。内核驱动程序无法使用加速转换速度。\n\
    \n## 1-Wire\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_74_0.png)\n\n**左图** 我们在该电路中使用了一个\
    \ 4.7 KΩ 的上拉电阻。\n\n## 04 配置内核\n\nRaspberry Pi 通过内核模块实现了 1-Wire 访问的基本形式。这必须在启动时启用，最佳做法是编辑\
    \ `/boot/config.txt`，如下所示，然后重启处理计算机。有关 Pi 的 config.txt 文件的更多指导信息可在 bit.ly/1K73pQr\
    \ 获取。\n\n```\ndtoverlay=w1-gpio-pullup,pullup=on\ndtdebug=on\n```\n\n## 05 通电\n\
    \n鉴于此，现在是给处理计算机通电的时候了。轻触温度传感器以检查它们是否迅速发热，因为这是电路连接错误的典型症状。如果没有这种情况，则说明你的电路工作正常。然后你可以在\
    \ `/sys/bus/w1/devices` 树中寻找传感器。\n\n## 06 使用 C 读取\n\nW1-therm 将各个设备映射到文件空间。这意味着其中包含的数据可以像任何其他文本文件一样被读取。我们将部署一个小程序，该程序首先遍历文件系统以查找符合条件的设备。\n\
    \n```c\n#include <stdio.h>\n#include <dirent.h>\n#include <string.h>\n\nvoid main()\n\
    {\n  DIR *dir;\n  dir=opendir(\"/sys/bus/w1/devices\");\n  struct dirent* mydir;\n\
    \  while((mydir=readdir(dir)))\n  {\n    if(mydir->d_type==DT_LNK && strcmp(mydir->d_name,\
    \ \"28-\")==0)\n    {\n      printf(\"%s\", mydir->d_name);\n      printf(\"\\\
    n\");\n    }\n  }\n  closedir(dir);\n}\n```\n\n## 07 使用 C 读取，第二部分\n\n在下一步中，必须扩展内部循环。它将遍历各个设备，使用普通的\
    \ C API 读取其数据。然后将数据以略微格式化的方式打印到命令行。\n\n```c\nif(mydir->d_type==DT_LNK &&\n   strcmp(mydir->d_name,\
    \ \"28-\")==0)\n{\n  char myField[1024];\n  sprintf(myField, \"/sys/bus/w1/devices/%s/\"\
    \n          \"w1_slave\", mydir->d_name);\n  FILE *myFile=fopen(myField,\"r\"\
    );\n  if(myFile!=NULL)\n  {\n    int myTemp[9];\n    int crc;\n    int status;\n\
    \    if (fscanf(myFile, \"%x %x %x %x %x %x\"\n             \"%x %x %x %x : crc=%x\
    \ %x\\n\",\n             &myTemp[0], &myTemp[1], &myTemp[2], &myTemp[3],\n   \
    \          &myTemp[4], &myTemp[5], &myTemp[6], &myTemp[7],\n             &myTemp[8],\
    \ &status, &crc) == 10)\n    {\n       myTemp[0] = myTemp[0] & 0x0FF;\n      \
    \ // Assuming temperature is stored in the first two bytes typically for DS18B20\n\
    \       // Simplified logic based on OCR input which was slightly garbled\n  \
    \     double temp = (myTemp[1] | (myTemp[0] << 8)) / 1000.0;\n       printf(\"\
    %lf \\n\", temp);\n    }\n  }\n}\n```\n\n## 08 编译并运行\n\n习惯于使用 Python——这种脚本语言当然也可以用来访问该文件——进行开发的开发人员，可能会觉得部署过程有点奇怪。GCC\
    \ 将我们的代码编译为可执行文件，然后可以像其他任何应用程序一样运行它。\n\n```bash\npi@piLab ~ $ gcc rpTherm.c\n\
    pi@piLab ~ $ ./a.out\n27.375000\n27.500000\n```\n\n## 09 走向专业！\n\n访问专业 1-Wire\
    \ 设备——想想内存芯片、按钮和加密协处理器——是通过 OWFS 库处理的。不幸的是，这并不支持 w1-gpio 库。使用它将需要部署扩展硬件：基于 I2C\
    \ 的 DS2482 是最常见的外部控制器。\n\n## 发光\n\n传感器可能是一件有趣的事情。一个有趣的实验涉及两个放置在相距几厘米处的 DS18B20\
    \ 传感器。其中一个被强制每秒转换一次数据，而另一个则以更悠闲的节奏运行。随着时间推移，活动传感器将显示较高的环境温度。这种行为是由转换过程引起的，顺便说一句，该过程会产生热量。\n\
    \n## 教程\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_75_0.png)\n\n**Dan Aldred**\n\
    是 Raspberry Pi 认证教育者，也是 CAS 的领校教师。他最近领导了一支在 Astro Pi 中学比赛中获胜的团队。\n\n## 从你的 Raspberry\
    \ Pi 发送短信\n\n创建一个结合 Twilio 和简单 Python 代码的程序，使你的 Pi 能够向手机发送短信（文本消息）。\n\n短信息，或称\
    \ SMS（Short Message Service，短消息服务），已成为日常通信的标准配置。起初作为 40 便士的短信服务起步，现在大多数资费提供商都将其作为无限服务提供。Twilio\
    \ 是一家云通信公司，它允许你仅用六行代码就从 Raspberry Pi 免费向手机发送短信消息。\n\n1.  **设置你的 Twilio 账户**\n\
    \    该项目的第一个步骤是注册 Twilio 账户和 Twilio 号码。这是免费的，将使你能够向已注册和验证的电话发送短信。注册后，你会通过短信收到一个验证码。当被提示时，将此代码输入到\
    \ Twilio 网站以验证你的账户和电话。访问 twilio.com/try-twilio 并创建你的账户。\n2.  **注册和验证手机号码**\n \
    \   你的 Twilio 账户是试用账户（除非你支付升级费用），这意味着你只能从已验证的电话号码发送和接收通信。输入你要验证的手机号码，确保选择正确的国家代码。Twilio\
    \ 会通过短信向你发送验证码。将此代码输入网站表单并按提交。\n\n> *左侧* 使用此方法，你可以在 Pi 运行脚本完成后让它给你发短信。\n\n## 你需要什么\n\
    \n-   Raspberry Pi\n-   Twilio 账户\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_75_1.png)\n\
    \n## 短信\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_76_0.png)\n\n## 03 仪表板\n\n\
    注册并登录后，访问仪表板页面，该页面将显示你的 AccountSid 和 Auth Token。使用 Twilio REST 需要这两者。请保持它们的安全和私密，但务必记下它们，因为你稍后在\
    \ Python 程序中会需要它们。\n\n## 04 安装软件\n\n启动你的 Raspberry Pi 并将其连接到互联网。在安装 Twilio 软件之前，更新和升级你的\
    \ Pi 是值得的。在 LX Terminal 中，输入 `sudo apt-get update`，然后输入 `sudo apt-get upgrade`。完成后，输入\
    \ `sudo easy_install twilio` 或 `sudo pip install twilio` 来安装软件。（如果需要安装 pip，请输入\
    \ `sudo apt-get install python-pip python-dev`，按回车键，然后输入 `sudo pip install -U\
    \ pip`。）\n\n## 05 Twilio 身份验证\n\n现在你准备好创建用于向手机发送文本消息的短信程序了。打开你的 Python 编辑器并导入\
    \ Twilio REST 库（下面第一行）。接下来，添加你的 AccountSid 和 Auth Token，用你的代码替换 X，你可以在仪表板上找到它们：\n\
    \n```python\nfrom twilio.rest import TwilioRestClient\naccount_sid = \"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\
    \n# Enter Yours\nauth_token = \"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\"\n# Enter Yours\n\
    client = TwilioRestClient(account_sid, auth_token)\n```\n\n## 06 创建你的消息\n\n你很可能希望能够更改文本消息，而不是发送相同的消息。在你的程序中创建一个名为\
    \ *message* 的新变量。这将提示你输入想要发送到手机中的短语。当程序运行时，将发送此消息：\n\n```python\nmessage = raw_input(\"\
    Please enter your message\")\n```\n\n> Twilio 提供了广泛的 API 代码和参考文档，用于创建其他通信程序。\n\
    \n## 07 添加你的号码\n\n要发送消息，你需要添加下面的代码行和你的两个电话号码。第一个号码是你的手机号码，该号码已在 Twilio 注册和验证（步骤\
    \ 2）。第二个号码是你的 Twilio 账户号码，可以从你仪表板页面的“Call the Sandbox number”下获取。将 Sandbox 号码更改为你的国家地区，并记得添加国际国家代码。\n\
    \n> *上方* 你可以在 Twilio 仪表板上找到你的 AccountSid 和 Auth Token。\n\n```python\nmessage =\
    \ client.messages.create(\n    to=\"+44YOURNUMBER\",\n    from_=\"+44YOUTWILIONUMBER\"\
    ,\n    body=message\n)\n```\n\n## 08 发送消息\n\n现在发送你的消息。下面的代码不是必需的，但用于指示你的消息已发送，因此很有用。添加这些行并保存你的程序。确保你的\
    \ Raspberry Pi 连接到互联网并且你的手机已开机，然后运行你的程序。你刚刚从 Raspberry Pi 发送了短信！\n\n```python\n\
    print message.sid\nprint \"Your message is being sent\"\nprint \"Check your phone!\"\
    \n```\n\n## 09 其他 API 和代码\n\nTwilio 提供了广泛的 API 代码和参考文档，用于创建其他通信程序，如拨打电话、录制通话以及检索数据（包括来电者\
    \ ID 和通话时长）。该 API 还补充了多种语言，包括 Ruby、PHP、Java 和 Node.js（twilio.com/api/）。\n\n##\
    \ REST\n\nREST 代表 Representational State Transfer（表现层状态转移）。（有时拼写为“REST”），它依赖于无状态、客户端-服务器、可缓存的通信协议——在几乎所有情况下，都使用\
    \ HTTP 协议。REST 是设计网络应用程序的一种体系结构风格。\n\n"
