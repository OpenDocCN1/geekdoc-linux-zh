    \n```C\n// myLS.c\n#include <fcntl.h>\n#include <stdlib.h>\n#include <stdio.h>\n\
    #include <dirent.h>\n\nint main(int argc, char **argv)\n{\nif (argc != 2)\n{\n\
    printf(\"Please provide the correct number of arguments!\\n\");\nreturn -1;\n\
