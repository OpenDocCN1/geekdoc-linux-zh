    \n在本节中，我们将编写 `ls` 程序的简单版本。它只会打印出作为命令行参数给出的目录中的文件和子目录。输入右侧显示的代码，或者从 FileSilo 获取它。像往常一样，你应该使用以下命令进行编译：\n\
    \n`$ gcc -Wall -o myLS myLS.c`\n\n程序中使用的 `DIR` 类型（第 14 行）代表目录流，这是读取目录的 Unix 方式。`dirent`\
    \ 结构体（第 15 行）不仅包含文件或目录的名称，还包含许多其他内容——你将在即将发布的教程中了解更多关于 `dirent` 结构体的信息。你還可以訪問\
    \ bit.ly/1E09WW7。\n\n`myLS` 程序的参数只是一个路径名。你可能已经知道，路径名有两种类型：绝对路径和相对路径。绝对路径以斜杠开头，而相对路径则不。`opendir()`\
    \ 系统调用打开目录并返回目录流（第 18 行）。`readdir()` 系统调用返回指向 `dirent` 结构体的指针。你可以使用 `while()`\
    \ 循环（第 25 行）的帮助访问目录流的所有元素。当你到达目录流的末尾时，返回 `NULL`，`while` 循环将结束。\n\n如果你选择编译并执行 `myLS`，你会发现由于最后一个\
    \ `printf()` 语句的结果，每个条目都在单独的一行上打印。\n\n```C\n// myWC.c\n#include <fcntl.h>\n#include\
