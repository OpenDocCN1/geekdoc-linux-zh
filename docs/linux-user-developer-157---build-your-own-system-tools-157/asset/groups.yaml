    \ with a variety of GUI stacks; the IDE will display a selector offering various\
    \ project types. For now, a C# Console Project shall suffice. Name your project\
    \ to see the structure shown in the image on page 56.\n\nDevelopers coming to\
    \ the world of .NET must acquaint themselves with a new structuring paradigm.\
    \ A product—be it an aerial torpedo or a game—is stored in a container structure\
    \ called a Solution. Individual deliverables, such as libraries, resource projects,\
    \ or executables, are then stored as projects. In most development environments,\
    \ only one project can be active at any given time; it is the one affected by\
    \ debug and run operations. Selecting the currently active project is done by\
    \ left-clicking it in the Solution window. The context menu will contain a toggle\
    \ labeled 'Set as Start-Up project.'\n\nIt’s time to take a look at the code created\
    \ by the assistant:\n\n```csharp\nusing System;\n\nnamespace ImagineCS1\n{\n \
    \   class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            Console.WriteLine (\"Hello World!\");\n        }\n   \
    \ }\n}\n```\n\nC# code is subdivided into namespaces. Each namespace contains\
    \ classes, interfaces, and similar objects. In fact, the entire system API is\
    \ exposed via a set of namespaces.\n\nAccessing a member of a namespace is done\
