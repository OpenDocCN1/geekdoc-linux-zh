  mdcn: "\n\n## 09 更多 Dockerfile 指令\n\n**RUN** – 这是 Dockerfile 中的核心执行指令。它接收一个命令作为参数，然后运行该命令以构建镜像。\n\
    \n```bash\nRUN apt-get update && apt-get install -y ruby ruby-dev\n```\n\n**EXPOSE**\
    \ – 此指令用于关联指定端口，以启用容器内运行进程与外部世界（例如宿主机）之间的网络通信。\n\n```dockerfile\n# EXPOSE Usage\n\
    EXPOSE 8080\n```\n\n**MAINTAINER** – 这是一个非执行命令，用于声明 Dockerfile 的作者。虽然这不是强制要求的，但包含作者信息是一种良好的实践。\n\
    \n```dockerfile\n# MAINTAINER Usage\nMAINTAINER Nittish <email@id here>\n```\n\
    \n**VOLUME** – 此指令用于启用从容器访问宿主机上的目录。\n\n```dockerfile\n# VOLUME Usage\nVOLUME [\"\
    /var/www\", \"/var/log/apache2\"]\n```\n\n## 10 Boot2Docker 和 Kitematic 图形用户界面\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_46_0.png)\n\n您可能已经注意到，Docker 需要一个 Linux\
    \ 内核才能运行容器。这对 Windows 或 OS X 等非 Linux 系统构成了障碍。为了解决这个问题，Docker 团队创建了一个基于 CLI 的辅助工具，称为\
    \ Boot2Docker。Boot2Docker 安装包包含一个 VirtualBox 虚拟机、Boot2Docker 工具以及 Docker 本身。包中包含的虚拟机是一个轻量级的\
    \ Linux VirtualBox 镜像，提供了 Docker 守护程序所需的所有 Linux 内核相关功能。因此，您可以轻松地在非 Linux PC 上安装\
    \ Docker。\n\n然而，对于许多用户来说，用户界面仍然是一个顾虑，因为他们更喜欢图形用户界面（GUI）而不是命令行界面（CLI）。Kitematic\
    \ GUI 是一个开源项目，最近被 Docker 收购。它自动化了 Docker 的安装和配置过程，并提供了一个直观的 GUI 来运行 Docker 容器。当\
    \ Kitematic GUI 启动时，您将在主屏幕上看到精选的镜像，您可以立即运行它们。只需在搜索栏中输入，即可从 Kitematic 搜索 Docker\
    \ Hub 上的任何公共镜像。请注意，Kitematic 目前仅适用于 Mac，Windows 支持预计很快推出。\n\n*注意：上述的 Boot2Docker\
    \ 绕过了非 Linux 系统的阻碍。*\n\n## 在 AWS 上自动化 Linux\n\n如何停止照看您的服务器集群并自动化您的云管理\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_47_0.png)\n\
    \n- **作者**: Filipe Martins & Anna Kobylinska\n- **背景**: 二十年前在一台 Linux 机器上组队，最终进入企业\
    \ IT 领域，设计云拓扑，优化 Linux API 并管理 AWS 部署\n\n常规 Linux 系统的维护会让人精疲力竭，即使不需要关注公共云费用也是如此。因此，自动化正迅速成为\
    \ Linux 管理员的首选武器，以寻求对基础设施和服务更适当的控制。\n\n现成的自动化工具以及原始云 API 已经重新定义了云中的服务器管理。无论您是想使用诸如\
    \ Chef、Puppet、Eucalyptus 或 Ansible 等工具拥抱全面的编程编排，还是仅仅想以可接受的成本效益比确保云中几个服务器的合理响应时间，自动化都是正确的方向。\n\
    \n尽管自动化被认为具有许多好处和 sophistication（复杂性/精致性），但它有一个主要缺点：它是双刃剑。如果您知道自己在做什么，它可以为您节省时间和金钱，但如果失去控制，它也可能让您付出沉重代价。\n\
    \n即便如此，自动化显然比手动微观管理更有回报。当谈到通过使用自配置 Spot 实例群（本教程的主题）来省钱时，AWS 自动化的“放松等待”原则是无与伦比的。愿云的力量与您同在。\n\
    \n### 为您的 AWS 节省‘自动化’\n\n在 AWS 上‘自动化’您时间和成本节省的一种方法是提交任何数量 Linux 实例的 Spot 车队请求，价格等于或低于您的出价。\n\
    \nSpot 实例是虚拟机（所谓的 EC2 实例）最经济的容量预留类型。使用 Spot 实例时，您可以设定自己的价格。缺点是数据丢失的风险。Amazon 不保证预留的容量配额，无论您设定的价格如何。您的实例可能随时终止。在大多数情况下，成本节省使其值得这种麻烦。\n\
    \nSpot 实例通常运行计算并将结果输出到持久存储中。这样，用户在实例故障或终止时仍可保留结果。\n\nSpot 车队是一组由 Amazon 代您管理的\
    \ Spot 实例（无需自定义代码）。例如，Spot 车队可以运行批处理作业、基于 Hadoop 的大数据工作流或 HPC 网格计算作业。\n\n通过使用车队，您确保\
    \ Amazon 将代表您协商 Spot 价格，并努力维持您所需的容量。Spot 车队请求不收费。\n\n### 资源\n\n- AWS 根账户\n- Python\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_47_1.png)\n\n## 自动化正迅速成为 Linux 管理员的首选武器\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_48_0.png)\n\n在 Spot 车队请求中，您使用 JSON\
    \ 文件指定目标容量、实例的启动规格和出价。您甚至可以在一个请求中组合多个实例类型和多个可用区。\n\nAmazon 将选择价格最低的可用实例来满足请求，并尝试在您请求有效的期间维持您的目标容量。\n\
    \n在提交您的 Spot 车队请求时，您必须创建一个身份和访问管理（IAM）角色，授予 Spot 车队服务代表您进行容量竞标、启动和终止实例的权限。\n\n\
    为了创建 IAM 角色，请在浏览器中导航至 `console.aws.amazon.com/iam`。在导航窗格中，选择 `Roles > Create New\
    \ Role` 并按照屏幕上的说明操作。\n\n当提示选择角色类型时，选择 `Amazon EC2 Spot Fleet Role`。在 `Attach Policy`\
    \ 页面上，选择 `AmazonEC2SpotFleetRole` 策略，并通过点击 `Next Step > Create Role` 进行确认。记下与此角色关联的\
    \ Amazon 资源名称（ARN）。在提交 Spot 车队请求时，您需要提供此 ARN。\n\n### 分配 Amazon EC2 权限\n\n在您的网络浏览器中，导航至位于\
    \ `console.aws.amazon.com/iam` 的 IAM 控制台。在 `Policies` 中，点击 `Create Policy`，然后选择创建您自己的策略选项。\n\
    \n在下一页中，为新策略命名，然后在 `Policy Document` 部分输入以下信息：\n\n```json\n[\n    \"Version\"\
    : \"2012-07-30\",\n    \"Statement\": [\n        {\n            \"Effect\": \"\
    Allow\",\n            \"Action\": [\n                \"ec2:*\"\n            ],\n\
    \            \"Resource\": \"*\"\n        },\n        {\n            \"Effect\"\
    : \"Allow\",\n            \"Action\": \"iam:PassRole\",\n            \"Resource\"\
    : \"*\"\n        }\n    ]\n]\n```\n\n`iam:PassRole` 操作使 IAM 用户在提交 Spot 车队请求时能够传递\
    \ Spot 车队角色。如果您想进一步限制该用户启动 Spot 实例的权限，您可以像这样列出允许的操作：\n\n```json\n\"Action\": [\n\
    \    \"ec2:CancelSpotInstanceRequests\",\n    \"ec2:CreateTags\",\n    \"ec2:RequestSpotInstances\"\
    ,\n    \"ec2:RunInstances\",\n    \"ec2:TerminateInstances\"\n]\n```\n\n点击 `Create\
    \ Policy` 以确认您的选定设置。导航至 `Users` 并编辑负责提交 Spot 车队请求的用户。接下来，只需按照屏幕上的说明操作，然后在 `Permissions`\
    \ 中点击 `Attach Policy`。现在该用户可以提交 Spot 车队请求并由 Amazon 执行。\n\nAWS 管理控制台目前不支持创建 Spot\
    \ 车队请求。为了能够使用此功能，您需要安装 AWS CLI（命令行界面）工具，例如通过为 Linux 提供的 Bundled Installer。您可以使用\
    \ `wget` 或 `curl` 进行下载。\n\n```bash\ncurl \"https://s3.amazonaws.com/aws-cli/awscli-bundle.zip\"\
    \ -o \"awscli-bundle.zip\"\n```\n\n解压缩归档文件：\n\n```bash\nunzip awscli-bundle.zip\n\
    ```\n\n在提升权限的提示符中运行安装程序可执行文件：\n\n```bash\nsudo ./awscli-bundle/install -i /usr/local/aws\
    \ -b /usr/local/bin/aws\n```\n\n如果您使用的是安装了多个 Python 版本的系统，并希望使用您的非默认安装之一，您需要指定\
    \ Python 可执行文件的绝对路径：\n\n```bash\nsudo /usr/local/bin/python2.7 awscli-bundle/install\
    \ -i /usr/local/aws -b /usr/local/bin/aws\n```\n\n此命令将 AWS CLI 安装到 `/usr/local/aws`\
    \ 并在 `/usr/local/bin` 目录中创建符号链接 `aws`。\n\n*注意：上述提到的 CodeDeploy 自动化代码部署到任何实例（无论是\
    \ EC2 还是本地）以简化软件开发。*\n\n### 各种形状和尺寸\n\n云端的自动化工具形态各异。但并非每种方案都适合使用场景。因此，请尝试进行会话。牢固掌握您扩展工作负载配置的核心细节是很好的，这是一项您可以将其与现有最合适的自动化工具相匹配的事情。\n\
    \n"
