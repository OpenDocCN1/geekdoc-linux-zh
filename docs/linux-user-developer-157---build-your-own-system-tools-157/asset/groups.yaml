    \ The code for myWC is bigger than the other two programs because it does more\
    \ things: the logic of the program is encapsulated in the while loop.\n\nThere\
    \ are many more efficient ways to read a file instead of character by character,\
    \ but in this case, this is the simplest solution because you are going to do\
    \ three character comparisons afterwards. Wherefore the fgetc() function (line\
    \ 29) is used for reading the whole input one character at a time. The program\
    \ assumes that when you read a space character, a tab or a newline character (line\
    \ 31), you are not inside a word. The first time you see a character that is different\
    \ from space, tab or newline, the program assumes that you are at the beginning\
    \ of a new word (line 33).\n\nThe next systems programming tutorial will build\
    \ a version of wc that is closer to the /usr/bin/wc utility on your Linux.\n\n\
    ## Process ID and parent process ID\n\nThis program shows that it is not always\
    \ necessary to write many lines of code in order to get the information you want.\
    \ Lines 13 and 14 do the job by calling two system calls that belong to the same\
    \ family: getpid() and getppid(). Both system calls require no arguments: each\
    \ one just returns the process ID that was asked for. The checking in line 7 is\
    \ not required, but it is good to inform the user that they do not have to give\
    \ command line arguments for this command. The process ID of the parent process\
    \ will most probably be the process ID of your current shell.\n\nYou might say\
    \ that there is too much error checking going on here and you might be right.\
    \ However, the general principle is that the more critical the application you\
    \ are writing is, the more error checking code it should have.\n\n```\n// pid.c\n\
    #include <stdlib.h>\n#include <stdio.h>\n#include <unistd.h>\nint main(int argc,\
    \ char **argv)\n{ \nif (argc != 1)\n{ \nprintf(\"There is no need for command\
    \ line arguments\\n\");\nreturn -1;\n} \nint pid = getpid();\nint ppid = getppid();\n\
    if ( pid > 0 )\n{ \nprintf(\"Your process id is %d\\n\", pid);\n} \nelse\n{ \n\
    printf(\"There is an error with your process id %d\\n\", pid);\n} \nif ( ppid\
    \ > 0 )\n{ \nprintf(\"You have been called from a process with id %d\\n\", ppid);\n\
    } \nelse\n{ \nprintf(\"There was an error while getting parent process id: %d\\\
    n\", ppid);\n} \nreturn 0;\n}\n```\n"
  mdcn: "\n\n# 重建核心工具\n\n## 构建 `ls` 和 `wc` 的简单版本，并处理进程 ID\n\n在这部分，我们将编写两个现有 Linux\
