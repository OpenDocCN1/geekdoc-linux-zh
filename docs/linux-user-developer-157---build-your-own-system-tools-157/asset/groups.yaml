    \n正如你也能看到的，所有程序都包含注释。即使程序很小，你也应该始终在其中添加必要的注释。\n\n警告：C 编程语言假设程序员总是知道自己在做什么，除非代码中存在错误，否则编译器不会质疑程序员。因此，如果存在错误，C\
    \ 编译器将不会生成可执行文件。如果存在任意数量的警告消息，但没有错误，那么编译器将创建可执行文件，这并不总是好的。作为一个一般原则，你不仅应该设法解决错误消息，还应该解决警告。\n\
    \n### 挑战自我\n\n一旦你完成了这些实用程序，并尝试重建了你选择的另一个标准 Linux 实用程序，这里还有另一个不错的练习供你尝试：将多个实用程序组合成一个程序。例如，你可以尝试制作一个结合\
    \ `cat` 和 `wc` 的工具，以给出新拼接文件的词数。\n\n```C\n// myLS.c\n#include <fcntl.h>\n#include\
