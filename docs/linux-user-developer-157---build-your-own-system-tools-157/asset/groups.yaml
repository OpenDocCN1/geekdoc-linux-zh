    # RESCUE ITUNES CONTENT


    > If you really need iTunes then forget the confusing online advice and follow
    PlayOnLinux’s Wizard


    Recent bloat to iTunes has seen it grow from the relatively light, focused, powerful
    music library app of the early days, to a tottering mass of *scarcely needed functionality*
    that is the **multimedia equivalent of MS Office**. There are plenty of Linux
    alternatives to iTunes now, although almost all have their drawbacks. Nevertheless,
    for users with purchased media trapped inside Apple’s walled garden, iTunes has
    its advantages and many Linux users need access to it without having to dual boot.


    Unfortunately, running iTunes on Wine is not always easy and many go to the extent
    of keeping a Virtual Machine (VM) on standby, running a recent OS X or Windows
    version just to run iTunes.


    There is a mass of contradictory information only a web search away on installing
    iTunes with Wine. We tried following some, adding in various libraries, such as
    libmwx13, ncal220 and dotnet40 through winetricks and Winecfg, then through PlayOnLinux’s
    library loader. The best we got was successfully installing a greyed-out box,
    although some menus were accessible. Even starting again after `winetricks gdi32`,
    which downloads 600MB of graphics library, didn’t fix it.


    Then we forgot about the postings online saying what we should do. We just sat
    back and trusted PlayOnLinux. After clicking install, instead of selecting non-listed
    software, we went to the MultiMedia menu and clicked iTunes 12 (see the bottom-left
    image). We also downloaded the 32-bit installer from Apple, even for our 64-bit
    test rigs.


    PlayOnLinux warned us about what wouldn’t work: syncing with iDevices, although
    there are plenty of native Linux apps that will talk to Apple music hardware (on
    a good day at least). Then, as on our Photoshop installation, PlayOnLinux’s Wizard
    did all of the hard work, including selecting Wine 1.7.48 as the one known to
    work by that particular installer’s creator, and `wine_gecko` for rendering the
    web interface to Apple’s iTunes store. Then it fetched various other service packs
    and libraries. iTunes started successfully on all three test machines.


    As reported, plugging in an iPod or iPhone didn’t work and managing a music collection
    was hit or miss, as very large disks of multimedia files could crash the program.
    However, we could visit the iTunes Store to spend our hard-earned cash and, best
    of all, iTunes has a vast selection of specialist Internet radio stations. We
    spent a happy evening listening to bebop on **calmradio.com** – available on iTunes
    without a membership login – and all that jazz.


    # Registry surgery


    Wine can call its own registry for you, functionally similar to the Windows software
    of the same name, if editing the Windows registry is really necessary. One of
    the advantages of running under Wine is that you won’t make your system unstable
    if you go badly wrong, and a backup of `~/.wine` or the PlayOnLinux equivalent
    (location) can mean not even losing the emulated installation either. The files
    edited live in `$WINEPREFIX\*\ REG, but should not be directly edited as special
    encoding is used to store keys. From regedit, `HKCU_CURRENT_USER\Software\Wine`
    is likely to be your main focus. Under this, for example, at `MSHTML\GeckoUrl`,
    which is the location of Wine Gecko, you create a new **SWINEPREFIX**. Changing
    the registry entry to somewhere local, like `file:///Z/` path/to/wine_gecko/`,
    means no unnecessary downloads.


    The most useful keys to modify are listed with useful explanations at: wiki.winehq.org/
    User/Registry.


    **Above** Always check the PlayOnLinux menus to see if your desired software is
    already listed

    **Right** iTunes will struggle to manage large music collections, but at least
    you can get to your Store-bought goods


    ![](img/e7f197876caa0b235fb5da2d16a578ea_31_0.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_31_1.png)'
