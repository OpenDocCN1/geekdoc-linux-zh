  - "[PAGE 41]\n\n# Tutorial D3.js\n\n04 Draw something more advanced\n\nfile:///Users/mtsous/docs/article/working/D3js_LUD/code/advExample.html\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_41_0.png)\n\n+   - **Above** Change\
    \ the colour and direction of your bar chart to create a more complex graph\n\n\
    Please keep in mind that data is drawn from top to bottom and that the default\
    \ colour is black. Also note that in order to leave a little space between the\
    \ bars, you will need to use a height value in the `.attr(\"height\", 20)` line\
    \ of code that is smaller than the number that you multiply the index by in the\
    \ `return (index*25);` line of code. The `.data(myData)` command is used for reading\
    \ all data from the myData array. You will use this command a lot.\n\n# 04 Draw\
    \ something more advanced\n\nThis step is going to enhance the previously generated\
    \ bar chart by adding colour and then drawing it using a different orientation.\
    \ However, the first change will make the existing code read an array of objects\
    \ instead of plain numbers. The format of the myData table will now be as follows:\n\
    \n```\nvar myData = [{key:\"key1\", value: 5},\n\t\t\t\t\t\t\t\t{key:\"key2\"\
    , value: 32}];\n```\n\nThe only change that you need to make to the rest of the\
    \ code is to use **element.value** instead of just **element** in the width attribute.\
    \ This makes sense because the program will need to know which object part holds\
    \ the desired value. It is now time to put some colour into the bar chart. You\
    \ can easily change the background colour of the chart with the `.style(\"background\"\
    , \"#CFCFCF\")` command. The `.style(\"fill\", \"blue\")` command will also set\
    \ the colour of each individual bar to blue. As you can also see from the output,\
    \ other additional changes have been made to the code so that each bar is drawn\
    \ from left to right, instead of top to bottom. Moreover, the bars are now located\
    \ towards the bottom of the webpage rather than the top, which feels more natural\
    \ for the format of a bar chart.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_41_1.png)\n\
    \n# 05 Scale data\n\nMost of the time, you will not know how many elements you\
    \ are going to plot, especially when you read data from external sources. If the\
    \ output is bigger than your canvas, then some data will not be shown at all.\
    \ This step is going to show you how to solve such difficult situations. The d3.scale.linear()\
    \ function creates a linear scale, which is a function that gets a domain – a\
    \ range of values – as its input and gives a different range as its output. The\
    \ next line of code defines the possible values of the input domain:\n\n```\n\
    domain([0, d3.max(myData, function(element){\n\t\treturn element.value; })])\n\
    ```\n\nAs you can understand, the possible values are from zero to the maximum\
    \ of the value part of the object found in the array. The programmer will have\
    \ to define the output range using the next line of code:\n\n```\n.range([0, myWidth])\n\
    ```\n\nThe scaling of the values of the Y-axis scales into account the total numbers\
    \ of elements found in myData and the height of the output. Note that bars are\
    \ drawn from top to bottom again. Try to draw them from left to right as an exercise."
  - "[PAGE 42]\n\n# ## 06  Read external data\n\nThe scalingData.html file developed\
    \ in the previous step will be used as the starting point for programming the\
    \ code in the externalData.html file used in this step.\n\nFirst, you are going\
    \ to learn how to add text labels to the columns of a chart, which is extremely\
    \ practical when reading data from external sources. The trick is done by selecting\
    \ all SVG elements that belong to the class **bar-label**. The `enter()` command\
    \ enters the interface which makes you capable of appending text elements. The\
    \ `attr()` commands place the text in the desired position, which is in the middle\
    \ towards the far end of the bar. However, you are going to need some CSS code\
    \ for correctly placing the text precisely at the end of the bar. The simple CSS\
    \ code can be found in the main.css file.\n\nUsually, data does not get either\
    \ from the Internet or from your hard disk. This part will show you how to read\
    \ external text files in order to use and visualise their data. As you will have\
    \ guessed, you will need to write some JavaScript code to do your job. The program\
    \ assumes that your external data is saved in a text file called dataFile.txt.\n\
    \nD3 offers five functions for loading external data: `d3.text()`, `d3.xml()`,\
    \ `d3.json()`, `d3.csv()` and `d3.html()`. The `d3.text()` function will be used\
    \ for reading dataFile.txt.\n\nThe data will be saved in an array with the same\
    \ name, just as before, and the program will continue its execution without any\
    \ other changes.\n\nImportant notice: loading a text file requires a running web\
    \ server for security reasons. If you are using Google Chrome, you can bypass\
    \ the need for a web server by executing Chrome with the --allow-file-access-from-files\
    \ command line parameter.\n\n# ## 07  Reading the external data\n\nThe format\
    \ of the dataFile.txt file is as follows:\n\n```\nkey1,150\n...\n```\n\nThe JavaScript\
    \ code parses dataFile.txt as follows:\n\n```\nd3.text(\"dataFile.txt\", function(error,\
    \ unparsedData){\n if (error) {\n document.write(\"Error reading file!\");\n return;\n\
    \ }\n var data = d3.csv.parseRows(unparsedData);\n for (key in data)\n {\n var\
    \ newValue = parseInt(data[key][1]);\n var object = {key: data[key][0], value:\
    \ newValue};\n myData.push(object);\n}\n}\n```\n\nThe most important point here\
    \ is to realise that the `d3.text()` function encapsulates the full JavaScript\
    \ code - therefore the end of the `d3.text()` function call is also the end of\
    \ the whole program. The error parameter used is mandatory and this should be\
    \ included everytime.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_42_0.png)\n\n\
    The contents of dataFile.txt are initially stored in the unparsedData variable\
    \ with the help of the `d3.text()` function.\n\nThen unparsedData is parsed using\
    \ the `d3.csv.parseRows()` function; this simplifies the whole parsing process.\
    \ Extra work needs to be done in order to put the data in the myData variable.\
    \ By default, all values are read as strings. As the second value of each record\
    \ is an integer, you need the `parseInt()` function to convert the string value\
    \ into an integer which is temporarily saved into the new value variable. Next,\
    \ you construct an object with the correct fields and push the object into the\
    \ myData array.\n\n# ## 08  Create a separate chart function\n\nThis step will\
    \ teach you how to create a separate function for plotting charts. It is a great\
    \ time saver because if you want to draw multiple charts, you don't need to have\
    \ the same code multiple times. For reasons of simplicity, the data found in the\
    \ myData array is hardcoded.\n\nAs the `plot()` function is called using `plot.call()`,\
    \ you can replace all references to `svg` inside the `plot()` function using the\
    \ famous `this` keyword. Similarly, all references to the myData variable inside\
    \ the `plot()` implementation are replaced by the `parameters.data` parameter.\
    \ Therefore `plot()` has no direct connection to either the svg or myData variables.\
    \ Read chartFunction.html for more details.\n\nYou can now call `plot()` using\
    \ any dataset you want!\n\n# ## 09  Make charts interactive\n\nThis step will\
    \ show you how to create interactive bar charts by making a bar change its colour\
    \ each time the mouse hovers inside its area!\n\nThe general idea is to add one\
    \ or more events to each bar to do what you want. Firstly, you add the code for\
    \ the mouseover event after the `this.selectAll(\"bar\")` command in order to\
    \ influence all bars. When the mouse leaves the bar, the colour should return\
    \ to its previous value, which is done with the help of the mouseout event.\n\n\
    Part 2 of this article will demonstrate even more impressive graphs that can be\
    \ generated using D3.js, so stay tuned!\n\n# ## Layouts\n\nLayouts are a D3.js\
    \ variety of functions that help you format your data so that it can be presented\
    \ using a popular charting method. Not only can you display charts, ring charts,\
    \ lines and more using layouts, but you can also download D3.js plugins that implement\
    \ new layouts. Part 2 of this article will talk more about layouts and the impressive\
    \ points they can generate.\n\n> \" The most important point is to realise that\
    \ the `d3.text()` function encapsulates the full JavaScript code \""
