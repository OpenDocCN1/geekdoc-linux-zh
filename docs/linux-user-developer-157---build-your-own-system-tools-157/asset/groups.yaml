    \ IBM 的 Ross Mauri 声称。“IBM 期待为我们的专业知识贡献给社区，并从他人那里学习，以寻找创新方式来结合开源软件的灵活性以及大型机世界级的速度、安全性和可扩展性。”\n\
    \n左图：像 IBM 的 z Systems 这样的大型机驱动着企业平台和大数据计算\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_6_0.png)\n\
    \n## 大型机\n\n### IBM 和 Canonical 发布 LinuxONE\n\n#### 大型机包含定制版 Ubuntu 发行版\n\nIBM\
    \ 和 Canonical 联合宣布发布一个新的由 Linux 驱动的大型机家族——IBM LinuxONE，其中包含 Canonical 的 Ubuntu\
    \ Linux 发行版的一个变体。\n\nLinuxONE 家族基于 IBM 的 z Systems 平台，宣布时间与 IBM 作为创始成员加入开放大型机项目的日子相同，该产品以两种形态发布。首先，是顶级的基于\
    \ IBM z13 的 LinuxONE Emperor，号称能够同时运行多达 8,000 个虚拟机。其次，是被称为 LinuxONE Rockhopper\
    \ 的缩减版变体，专为入门级大型机用户设计。\n\n“十五年前，IBM 通过将 Linux 引入大型机使业界感到惊讶，如今超过三分之一的 IBM 大型机客户正在运行\
    \ Linux，”IBM 系统部门高级副总裁 Tom Rosamilia 声称。“我们正在通过结合开放世界的最佳成果与世界最先进的系统，进一步深化我们对开源社区的承诺，以帮助用户拥抱新的移动和混合云工作负载。基于\
    \ Linux 在大型机上成功的经验，我们继续突破通用服务器在极端规模下不为安全和性能设计的局限性。”\n\n随着开发者云平台的上架，IBM 还承诺提供对\
    \ LinuxONE 平台的开放访问。这些实例部署在学术机构以及 IBM 位于达拉斯、北京和博布林根（Böblingen）的设施中，将提供免费试用和免费的教育访问。\n\
    \n“世界上最大的企业依靠 Ubuntu 作为其扩展应用程序、私有云和公有云的平台。随着 Ubuntu 支持扩展到 IBM z Systems 和 LinuxONE，IBM\
    \ 大型机客户将从 Ubuntu 的扩展和云解决方案生态系统中受益，”Canonical 的 Jane Silber 针对这一合作伙伴关系表示。“IBM 和\
    \ Canonical 合作将 Ubuntu 带到 z Systems，允许客户利用 z Systems 的速度和安全性，以及 Ubuntu 的开源软件和工具，为新的客户群增强其\
    \ IT 运营。”\n\n现在即可从 IBM 订购两款 LinuxONE 大型机型号，公司将在收到请求后提供定价。\n\n## 五大特色\n\n### KDE\
    \ Plasma 5.4.0 中的功能\n\n- 1. **应用程序仪表盘**\n  一个新的全屏菜单——应用程序仪表盘（Application Dashboard），取代了应用程序菜单，专注于充分利用高分辨率屏幕。这是为了尽可能快地找到您的软件和文件，同时为不依赖鼠标的用户提供了便捷的键盘导航和输入即搜索功能。\n\
    \n- 2. **Wayland 预览**\n  最新的 Plasma 版本引入了新的 Wayland 集成，让那些喜欢走在技术前沿的人有机会体验新的 Wayland\
    \ 窗口系统，而无需放弃现有的 KDE 框架集成。\n\n- 3. **网络小工具图表**\n  如果您希望关注历史网络流量，很高兴地告诉大家，网络小工具中将出现一个新的图表。该小工具还通过两个新的默认插件获得了对\
    \ SSH 和 SSTP-VPN 的支持。\n\n- 4. **简易显示器校准**\n  Gamma 显示器校准工具是 KDE Plasma 5.4.0 的新功能，提供了一种简便的方法来调整颜色在显示器上的重现方式，提供点色匹配或根据个人喜好的简单调整。\n\
    \n- 5. **大量新图标！**\n  对于喜欢多一点清晰度的人来说，KDE Plasma 5.4.0 包含 1,400 个提供 Breeze 主题艺术作品的新型图标将是个好消息，涵盖了各种应用程序和服务。这些包括\
    \ Inkscape、Firefox 和 LibreOffice 等应用。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_6_1.png)\n\
    \n上图：视觉设计组正在努力扩展标准图标集，以整合 Breeze、Breeze Dark 和 Oxygen 变体\n\nwww.linuxuser.co.uk\n\
    \n## 观点\n\n### 自由软件\n\n#### 软件公社\n\n自由软件运动在理念和具体代码方面对 Linux 崛起的贡献，并未总是得到应有的认可\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_7_0.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_7_1.png)\n\
    \n十月是自由软件基金会（Free Software Foundation）成立 30 周年，当时这一时刻鲜有人关注，但可以认为它改变了软件开发。定义自由软件的概念源于\
    \ Richard Stallman 在 MIT 人工智能实验室的经历、他与 LISP 机器开发相关的个人历史以及他与 James Gosling 在 Emacs\
    \ 许可证方面的纠纷。早在 1981 年 10 月，Stallman 就写道：“Emacs 不收取任何费用；相反，你正在加入 Emacs 软件共享公社。加入的条件是你必须将你对\
    \ Emacs 所做的任何改进送回，包括你编写的任何库……”这可以被看作是对左移复制（copyleft）的早期尝试，也是自由软件运动的首要原则。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_7_2.png)\n\
    \n后来因开发 Java 而闻名的 James Gosling，为 Unix 编写了 C 语言版本的 Emacs，该版本衍生自 Stallman 的原始 Emacs\
    \ 概念。据 Stallman 称，他“似乎受到了原始 Emacs 同样的共享与合作精神的启发……他在手册中称该程序为 Emacs，希望社区中的其他人能对其进行改进，直到它配得上这个名称。”Gosling\
    \ 最初允许该源代码（其中包含他人的贡献）自由分发，Stallman 在早期版本的 GNU Emacs 中纳入了一些代码，但在 1983 年 4 月，据 Stallman\
    \ 所述，“他在背后捅了所有人一刀，通过添加版权声明、要求人们承诺不重新分发，然后将其出售给一家软件公司。”\n\nGosling 已将他的 Emacs 版本\
    \ GDSMACS 卖给了 UniPress，并对 Stallman 发出了准法律威胁。当 GNU Emacs 于 1985 年发布时，UniPress 宣布“GNU\
    \ Emacs 程序的部分内容绝对不是公共领域的，并且使用和/或分发 GNU Emacs 程序并不一定合适。”\n\nStallman 重写了 GNU Emacs\
    \ 中引起争议的部分，但与 Gosling 和 UniPress 的对立使他确信公共领域不足以保护自由软件的权利。Stallman 的解决方案是颠倒版权法，将权利重新分配给用户。这种许可制度的第一个具体形式是\
    \ 1985 年的“GNU Emacs 复制许可声明”，尽管我们熟知的 GPL 首次出现在 1989 年。GPL 及其前言是自由软件原则最完整的表达，但使自由软件成为必须重视的概念的时刻是\
    \ Linux 内核的发布。Linux 是使用 GNU 工具开发的，并采用 GPL 许可。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_7_3.png)\n\
    \n**Richard Hillesley**\n*为各种出版物撰写关于艺术、音乐、数字权利、Linux 和自由软件的文章*\n\nLinus Torvalds\
    \ 后来表示，“将 Linux 改为 GPL 许可绝对是我做过的最棒的事”。围绕 GNU/Linux 和 GPL 发展起来的这种非正式模式给了每个人参与并产生影响的机会。你可以对\
    \ Linux 做任何事，把它拆得粉碎，安装在你的虚拟冰箱或洗衣机上，共享或破坏它，创建你自己的发行版并与世界分享。如果你不会写代码，你可以写文档、托管网站、交朋友或卖\
    \ T 恤。\n\n> 围绕 GNU/Linux 和 GPL 发展起来的这种非正式模式给了每个人参与并产生影响的机会。\n\n这种惊人的影响延伸到了商业世界。再次地，当一家硬件公司承诺支持\
    \ Linux 后，显然回馈项目对大家都有利，于是他们这样做了。使这成为可能的是 GPL 框架。企业核心代码块的发布加速了 Linux 的开发，并确保了其在企业中的成功，加上其在广泛硬件上的可移植性增强了这一优势。GPL\
    \ 促进了商品化，而在系统层面，商品化降低了成本，从而惠及所有人。\n\n操作系统的商品化确保了标准的商品化。这使得在不同机器和架构之间移植软件变得更加容易，也使硬件本身的设计变得更加容易。公司使用\
    \ GNU/Linux 并非出于对 Linux 或 GPL 的情感依恋，也不是因为“开源”。他们使用 GNU/Linux 和自由软件是因为它具有商业合理性。而由\
    \ GPL 保障的自由软件，则保证了代码的持续自由和社区特性。自由软件运动在理念和具体代码方面对 Linux 崛起的贡献，并未总是得到其应有的认可。\n\n"
