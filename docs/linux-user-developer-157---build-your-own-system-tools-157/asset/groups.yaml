    # # mGSD


    A strong representative amongst several TiddlyWiki-based options


    ![](img/e7f197876caa0b235fb5da2d16a578ea_82_0.png)


    Creating new content will always be context-based and linked to other relevant
    areas


    # ## Installation


    A JavaScript wiki that lives inside a single HTML page should be an easy installation,
    but open in a recent Firefox and new security measures stop mGSD from saving anything.
    TiddlyWiki creator, Jeremy Ruston, has produced a solution: the TiddlyFox extension
    to Firefox, available from the Mozilla Add-ons site. Install this first.


    # ## Interface


    The most common actions – starting a project, creating a Next Action, reviewing
    and so on – are all easily visible, with everything grouped logically by tabs
    in a single webpage. Calendar reminders (ticklers), reference items, someday/maybe
    lists – all of GTD is here.


    # ## Managing lists


    With excellent review options and a More tab that exposes every option, it’s easy
    to get where you want to edit your projects, anywhere you can carry the HTML file
    and open it in a browser (hint: Dropbox). The only thing lacking is a simple exit
    for your data, but adding the export tiddlers plugin enables CSV and text exports.


    # ## Bonus extras


    Enhancements are available from github.com/AaronLaw – search for David Szego’s
    mGSD enhancements (he now concentrates on mGSD’s rival, dGSD), as they let you
    export more easily, manage records of meetings and actions arising from them,
    and unclutter the interface a little, à la dGSD. Other TiddlyWiki enhancements
    are also compatible.


    # ## Overall


    > > We loved mGSD for its straightforward approach, ease of use and comprehensive
    features. Sadly, development has stopped, but GSDS will carry on the work in a
    TiddlyWiki5-compatible form, so will be capable of node.js hosting.

    > >

    > > 8


    # # Org-mode


    Powerful and complex, but the simple text format helps you get started


    ![](img/e7f197876caa0b235fb5da2d16a578ea_82_1.png)


    At the very heart of org-mode are simple, hierarchical lists that you can unfold
    to help with your list management


    # ## Installation


    For several years, org-mode has been integrated into Emacs, so **apt-get install
    emacs** (or your distro’s equivalent) takes care of installation. On systems without
    Emacs you can still work with .org files: they’re plain text with a hierarchy
    of asterisks (* for top-level titles, ** for second level and so on), and your
    word processor’s outline mode may generate and read them.


    # ## Interface


    The manual is huge, and if you’ve never learned Emacs that’s an additional task.
    But writing lists is straightforward with nested outline trees and you can ease
    yourself into the rest gently. There are many keyboard shortcuts and commands,
    but the majority are accessible through GUI menus.


    # ## Managing lists


    Typically, org-mode GTDers split their gttd.org file into tasks, calendar and
    projects, possibly adding extras like financial tracking. Other .org lists may
    be used to capture new input, record thoughts, maintain a someday/maybe list and
    schedule events using an Agenda view. Processing lists, involving keyboard shortcuts,
    is one of Org’s strengths.


    # ## Bonus extras


    Org-mode is scalarly comprehensive, from accepting embedded LaTeX for formulae
    to exporting files as HTML, ODT, PDF or iCalendar items. Add in the ability to
    pull in other Emacs modes and you’ll find the calendar/coverage expanded, the
    ability to work on a BBS/contacts database, even the capability to automatically
    generate and send emails.


    # ## Overall


    > > Easy to get started in a small way, but embrace org-mode and you’ll be sucked
    down the Emacs rabbit hole to a world where everything is available using keyboard
    shortcuts, where your efficiency will scare all of your friends.

    > >

    > > 8'
