    \n（重要提示：捆绑的安装程序不支持包含空格的路径，因此如果你坚持使用空格，将会遇到问题。）-b 选项可以消除在用户的 $PATH 变量中指定安装目录的需要。这将使所有用户能够通过在任何目录中输入\
    \ `aws` 来调用 AWS CLI。\n\n您可以通过以下方式确认安装成功：\n\n```\naws help\n```\n\n### 获取访问密钥 ID\
