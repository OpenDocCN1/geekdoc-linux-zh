    \ access our Samba share over the network. Remember, we’re using the Samba protocol,\
    \ so the address will be (in our case) `smb://192.168.1.5/MEDIA_DRIVE`. A Samba\
    \ address is made up of the protocol, IP address and the name that we gave our\
    \ Samba share.\n\n```text\nsmb:// 192.168.1.5/ MEDIA_DRIVE\n[PROTOCOL] [ADDRESS]\
    \ [SHARE NAME]\n```\n\n## Why Samba?\n\nWhen it comes to network protocols, we’re\
    \ truly spoilt for choice. But why Samba over, say, HTTP or FTP? Well, in order\
    \ to get things with HTTP or FTP and so on, you often need to know how to get\
    \ to them beforehand. That makes complete sense in a server-client world, but\
    \ Samba has discoverability built in. Why spend time tweaking URLs and configurations\
    \ when we can have our devices tell us how to find them?\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_71_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_71_1.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_71_2.png)\n\
    \n**Above** Don’t have an OSMC remote? Try the new Kore remote app from the Kodi\
    \ devs: bit.ly/1JPN6zL.\n\n## Pi & power\n\nThe Pi, even the new version 2, is\
    \ not renowned for its blistering speed. So how come it can handle streaming and\
    \ display high-definition content with ease, whereas it might struggle to run\
    \ a modern version of Chrome and WebGL2? Every Raspberry Pi has a hardware H.264\
    \ decoder built-in. This specialised chip does one thing really well, really quickly:\
    \ it plays H.264 video super-fast. That’s the ace up the Pi’s sleeve that makes\
    \ it one of the cheapest and best options for home-made media centres like this.\n\
    \n### 07 Add our drive to OSMC\n\nRight, time to leave your Linux box alone –\
    \ let’s do some Linux! Hop on over to your OSMC system. If you’re one of the lucky\
    \ people with the super-cool OSMO remote, you can do everything you need to do\
    \ with it, but there’s quite a bit of typing ahead, so if you have a keyboard\
    \ lying around then now is the time to plug it in. Power up your system and go\
    \ to Videos > Files > Add Videos. You’ll be presented with a view like the picture\
    \ above. Enter the address we jotted down in the previous step – in our case it\
    \ would be `smb://192.168.1.5/MEDIA_DRIVE` – and hit Done.\n\n### 08 Appease the\
    \ password gods\n\nDepending on your setup, you may or may not be asked to enter\
    \ a username and password. If you do, you’ll be prompted as soon as you’ve entered\
    \ the path to your media drive – but what is it? That’s simple: it’s just your\
    \ ordinary username and password for accessing your system. Once you’ve entered\
    \ those, tick the ‘Remember this path’ box and OSMC will keep a track of the drive\
    \ and its content as long as it’s available on the network.\n\n### 09 Test the\
    \ setup\n\nOn the video screen you should now see your shared network drive, which\
    \ looks just like any other folder. Now that the drive has been mapped, it will\
    \ reflect any and all changes, structures and files that you apply to your network\
    \ drive. Select a video to see if it plays. If it does, congratulations! You’ve\
    \ now got a networked Samba drive to deliver all of your media.\n\n### 10 Media\
    \ types and the Raspberry Pi\n\nYou may have noticed, just before you tested your\
    \ video, a bunch of small black boxes with icons and numbers inside them, just\
    \ to the left of the media selector UI. These display the properties of video\
    \ files that OSMC is familiar and comfortable with. Don’t worry, if you have videos\
    \ in a slightly unconventional format (Matroska or WebM, for example) OSMC has\
    \ a ton of goodies built-in to handle things it’s unsure of – it might just take\
    \ a little while for it to figure it out.\n\n### 11 Add extra media from elsewhere\n\
    \nSo, we now have OSMC reading media files from our Samba-serving PC. But what\
    \ if we want to add more media? Well, OSMC is geared towards watching your media\
    \ rather than managing it. We could unplug the media drive from our Samba server,\
    \ plug it into another computer with the media file we want and then plug it back\
    \ in to our samba server. Samba can handle plugging drives in and out, but that’s\
    \ cumbersome. Alternatively, we could log in to our Samba server and move files\
    \ over to it with SCP or FTP, but that’s not very user-friendly. What if we could\
    \ drag media files over the network onto our drive so that we could view them\
    \ on OSMC?\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_0.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_1.png)\n\
    \nLeft: To find the Pi SD card images, click the text link just below the three\
    \ OS logos shown, or go straight to osmc.tv/download/images\n\n## 12 One step\
    \ forward, seven steps back\n\nBack in Step 5, we set up our MEDIA/DRIVE Samba\
    \ share by editing the Samba config file and we have forgotten all about it since.\
    \ Well, there’s more we can do with Samba. As well as making drives readable on\
    \ our network, we can also make them writable, so let’s do that. Open `/etc/samba/smb.conf`\
    \ with your favourite editor and find your drive’s Samba configuration (this should\
    \ be at the very bottom of the file). Right at the end, just after `public = yes`,\
    \ add:\n\n```ini\nwritable = yes\n```\n\nExit and save.\n\n## 13 So did that work?\n\
    \nNow we should have a working Samba service running in the background of our\
    \ computer, but first we need to restart it to make our changes take effect. Before\
    \ we do that, though, we can check which properties will take effect on restart\
    \ with the command `testparm`. Run it as an ordinary user (you shouldn’t need\
    \ to `sudo` here), press Enter when prompted and look at the output. If you aren’t\
    \ shown any error messages, your config should be fine. So, it is the time to\
    \ restart Samba again with `sudo service smbd restart`.\n\n## 14 Drag, drop, play\
    \ and enjoy\n\nWe now have a network-visible and writable hard drive that OSMC\
    \ can play files from. You can drag the personal files that you want to watch\
    \ from one computer on your network onto the Samba drive and have them pop up\
    \ on OSMC straight away. Let’s imagine you use OS X in your day-to-day life (sacrilege!).\
    \ To add a file to OSMC, you would only have to open Finder, click Go > Connect\
    \ to Server, then enter the Samba address for your drive. Next, enter the username\
    \ and password, just like before, and then drag the file into the window. Now\
    \ that file is on OSMC and you didn’t even have to touch it!\n\nRemember that\
    \ you don’t have to share your entire drive, only a certain folder on your drive.\n\
    \n## 15 More please\n\nIf you want to add multiple drives to OSMC, you can repeat\
    \ Steps 4 through 9. But remember that you don’t have to share your entire drive,\
    \ only a certain folder within your drive – all you have to do is change the `path`\
    \ variable to point to a folder. The address will still be the same because it’s\
    \ made up of the IP address and Samba name of your drive. When used properly,\
    \ this can help you to manage your media over the network.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_2.png)\n\
    \n## 16 When the party is over\n\nIf you find yourself wanting to remove your\
    \ Samba drive as a shared resource in OSMC, it’s pretty simple. On OSMC, go to\
    \ Videos > Files and highlight – but don’t click/enter – your Samba drive. Open\
    \ the context menu (C on your keyboard) and select Remove source. You’ll be asked\
    \ if you’re sure and if you want to remove all of the references to the media.\
    \ If you never intend to use the Samba drive again, you can remove the references.\n"
  mdcn: "\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_70_0.png)\n\n左：如果你以 root 用户身份运行\
    \ `smbpasswd`，你还可以将用户添加到 `smbpasswd` 文件或从中移除用户。\n\n## 02 向 Samba 添加新用户\n\n安装完成后，我们的系统现在能够通过\
    \ Samba 协议共享文件夹和驱动器。在我们开始映射家庭网络上的路径之前，我们需要创建一个密码。为了简洁起见，我们将使用当前登录的同一个用户来管理 Samba。输入以下命令后，系统会提示你输入密码。\n\
    \n```bash\nsudo smbpasswd -a YOUR_USER_NAME\n```\n\n## 03 准备网络上的硬盘\n\n为了挂载我们要共享的卷，我们需要在\
    \ `smb.conf` 文件中添加一些配置设置。`*.conf` 文件非常重要，所以以防万一出现问题让我们不得不绞尽脑汁去修复损坏，让我们先备份一份自己的配置文件。\n\
    \n```bash\nsudo cp /etc/samba/smb.conf ~/Desktop/\n```\n\n## 04 插入你的驱动器\n\n如果你一直插着准备共享的硬盘，不要惊慌；你并没有做错什么，但如果还没插，现在就是连接它的时候了。打开文件管理器窗口，右键单击驱动器图标并点击属性。记下路径和卷名。\n\
    \n## 05 配置 Samba\n\n现在我们已经有了 Samba 配置的备份，并且知道了介质驱动器的路径，我们可以设置网络共享了。使用你选择的命令行编辑器（我们最喜欢的之一是\
    \ Vim），打开 `/etc/samba/smb.conf` 进行编辑，并转到文件的末尾：\n\n```bash\nsudo vi /etc/samba/smb.conf\n\
    ```\n\n```ini\n[DRIVE_NAME]\npath = path/to/drive/drive_name\navailable = yes\n\
    valid users = user_you_entered_earlier_for_samba\nread only = no\nbrowseable =\
    \ yes\npublic = yes\n```\n\n退出并保存。现在使用以下命令重启 Samba：\n\n```bash\nsudo service smbd\
    \ restart\n```\n\n假设一切顺利，你现在已经设置好了一个用于家庭网络共享的 Samba 驱动器——只要它是插入状态即可。\n\n## 06\
    \ 获取驱动器的地址\n\n在转到 OSMC 之前，我们要找出 Samba 驱动器的地址。保持在终端中，输入 `ifconfig`，你将得到所有网络接口的读数：\n\
    \n```text\neth0    Link encap:Ethernet  HWaddr 08:00:27:14:6b:fe\n          inet\
    \ addr:192.168.1.5 Bcast:192.168.1.255 Mask:255.255.255.0\n          inet6 addr:\
    \ fe80::a00:27ff:fe14:6b/64/Scope/Link\n          UP BROADCAST RUNNING MULTICAST\
    \  MTU:1500  Metric:1\n          RX packets:5394 errors:0 dropped:0 overruns:0\
    \ frame:0\n          TX packets:5394 errors:0 dropped:0 overruns:0 carrier:0\n\
    \          collisions:0 txqueuelen:1000\n          RX bytes:737927 (737.9 KB)\
    \  TX bytes:11086896 (11.0 MB)\n```\n\n你不会得到完全相同的输出，但你应该在某个地方有类似第二行的内容。查找 `inet\
    \ addr:` 并记下 IP 地址——这就是我们将用于通过网络访问 Samba 共享的地址。记住，我们使用的是 Samba 协议，因此地址将是（在我们的案例中）`smb://192.168.1.5/MEDIA_DRIVE`。Samba\
    \ 地址由协议、IP 地址以及我们给 Samba 共享起的名字组成。\n\n```text\nsmb:// 192.168.1.5/ MEDIA_DRIVE\n\
    [PROTOCOL] [ADDRESS] [SHARE NAME]\n```\n\n## 为什么选择 Samba？\n\n说到网络协议，我们的选择确实非常丰富。但为什么选\
    \ Samba 而不是比如 HTTP 或 FTP？嗯，为了通过 HTTP 或 FTP 等获取内容，你通常需要提前知道如何访问它们。在服务器-客户端世界中这完全合理，但\
    \ Samba 内置了可发现性。当我们可以让设备告诉我们如何找到它们时，为什么要花时间去调整 URL 和配置呢？\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_71_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_71_1.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_71_2.png)\n\
    \n**上图** 没有 OSMC 遥控器？试试 Kodi 开发者推出的新 Kore 遥控器应用：bit.ly/1JPN6zL。\n\n## Pi 与电力\n\
    \n树莓派，即使是新的版本 2，也不以其惊人的速度著称。那么它为什么能轻松处理和播放高清内容，而可能难以运行现代版本的 Chrome 和 WebGL2？每个树莓派都内置了硬件\
    \ H.264 解码器。这个专用芯片有一件事做得非常好，而且速度极快：它超快地播放 H.264 视频。这是树莓派手中的一张王牌，使其成为自制媒体中心（如本例）最便宜且最好的选择之一。\n\
    \n### 07 将我们的驱动器添加到 OSMC\n\n好了，该放下你的 Linux 机器了——让我们折腾一下 Linux！转到你的 OSMC 系统。如果你是幸运拥有超酷\
    \ OSMO 遥控器的用户之一，你可以用它完成所有需要的操作，但接下来有很多输入工作，如果你手边有键盘，现在就是插入它的时候了。启动你的系统，转到 视频 >\
    \ 文件 > 添加视频。你会看到类似上图的视图。输入我们在上一步记下的地址——在我们的案例中它是 `smb://192.168.1.5/MEDIA_DRIVE`——然后点击\
    \ 完成。\n\n### 08 取悦密码之神\n\n根据你的设置，你可能需要也可能不需要输入用户名和密码。如果需要，在你输入介质驱动器路径后不久系统就会提示你——但这究竟是什么？很简单：它就是访问你系统的普通用户名和密码。输入后，勾选‘记住此路径’框，OSMC\
    \ 将会跟踪驱动器及其内容，只要它在网络上可用即可。\n\n### 09 测试设置\n\n在视频屏幕上，你现在应该能看到共享网络驱动器，它看起来与其他文件夹无异。现在驱动器已映射，它将反映你对网络驱动器应用的所有更改、结构和文件。选择一个视频看看是否能播放。如果可以，恭喜！你现在拥有一个网络化\
    \ Samba 驱动器来提供所有媒体内容。\n\n### 10 媒体类型与树莓派\n\n你可能注意到，在测试视频之前，媒体选择器 UI 左侧有一堆带有图标和数字的小黑盒子。这些显示的是\
    \ OSMC 熟悉并习惯处理的视频文件属性。别担心，如果你的视频采用稍不常规格式（例如 Matroska 或 WebM），OSMC 内置了许多好东西来处理它不确定的情况——它可能只需要一点时间来弄清楚。\n\
    \n### 11 从其他地方添加更多媒体\n\n所以，我们现在有了 OSMC 从我们 Samba 服务器读取媒体文件的能力。但如果我们想添加更多媒体怎么办？嗯，OSMC\
    \ 倾向于观看媒体而非管理它。我们可以将媒体驱动器从 Samba 服务器拔出，插到包含所需媒体文件的另一台电脑上，然后再插回 Samba 服务器。Samba\
    \ 可以处理驱动器的插拔，但这很麻烦。或者，我们可以登录 Samba 服务器，使用 SCP 或 FTP 将文件移动过去，但这不太用户友好。如果我们能通过网络将媒体文件拖到我们的驱动器上，以便在\
    \ OSMC 上查看呢？\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_0.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_1.png)\n\
    \n左：要找到 Pi SD 卡映像，请单击所示三个 OS 徽标下方的文本链接，或直接从 osmc.tv/download/images 前往\n\n## 12\
    \ 前进一步，后退七步\n\n回到第 5 步，我们通过编辑 Samba 配置文件设置了 MEDIA/DRIVE Samba 共享，此后就把它忘了。嗯，关于\
    \ Samba 我们还能做更多的事。除了让驱动器在网络上可读外，我们还可以使其可写，所以让我们这样做吧。用你最喜欢的编辑器打开 `/etc/samba/smb.conf`，找到你的驱动器\
    \ Samba 配置（这应该在文件的非常底部）。在末尾，就在 `public = yes` 之后，添加：\n\n```ini\nwritable = yes\n\
    ```\n\n退出并保存。\n\n## 13 那么起作用了吗？\n\n现在我们应该有一个在后台运行的 Samba 服务，但首先我们需要重启它以使更改生效。在此之前，我们可以使用\
    \ `testparm` 命令检查哪些属性将在重启时生效。作为普通用户运行它（这里你不需要 `sudo`），当被提示时按 Enter，然后查看输出。如果没有显示任何错误消息，你的配置应该是没问题的。所以，现在是时候再次使用\
    \ `sudo service smbd restart` 重启 Samba 了。\n\n## 14 拖、放、播放并享受\n\n现在我们拥有一个网络可见且可写的硬盘，OSMC\
    \ 可以从其中播放文件。你可以将想要观看的个人文件从网络上的某台电脑拖到 Samba 驱动器上，并立即在 OSMC 上显示出来。假设你日常生活中使用 OS\
    \ X（亵渎！）。要向 OSMC 添加文件，你只需要打开 Finder，点击 前往 > 连接服务器，然后输入你驱动器的 Samba 地址。接下来，像之前一样输入用户名和密码，然后将文件拖入窗口。现在该文件就在\
    \ OSMC 上了，你甚至都没动过它！\n\n记住，你不必共享整个驱动器，只需共享驱动器上的某个文件夹。\n\n## 15 更多请求\n\n如果你想向 OSMC\
    \ 添加多个驱动器，你可以重复步骤 4 到 9。但请记住，你不必共享整个驱动器，只需共享驱动器内的某个文件夹——你只需更改 `path` 变量指向该文件夹。地址仍然相同，因为它由你驱动器的\
    \ IP 地址和 Samba 名称组成。正确使用时，这可以帮助你通过网络管理媒体。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_72_2.png)\n\
    \n## 16 当派对结束\n\n如果你发现自己希望移除 OSMC 中的 Samba 驱动器共享资源，这很简单。在 OSMC 上，转到 视频 > 文件，高亮显示——但不要点击/回车——你的\
    \ Samba 驱动器。打开上下文菜单（键盘上的 C 键）并选择 移除源。系统会询问你是否确定，以及是否希望移除所有对媒体的引用。如果你再也不打算使用 Samba\
    \ 驱动器，你可以移除引用。\n\n"
