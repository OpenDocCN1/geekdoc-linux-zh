    \ files, the IDE does not integrate itself into the Unity desktop. Firing up MonoDevelop\
    \ can instead be achieved by opening a terminal, where the command `monodevelop`\
    \ is to be entered. Next, click the New label in the Solutions field in order\
    \ to start the creation of a new project skeleton.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_55_1.png)\n\
    \n**Right** Type the command `monodevelop` into the terminal to open up the IDE.\n\
