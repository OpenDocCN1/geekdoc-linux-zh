    现代 x86 系统实现了一种称为不可屏蔽中断（NMIs）的功能。顾名思义，这些是不能被操作系统禁用的中断。中断是由中断控制器（用英特尔的话说，是 IO-APIC）递送到中央微处理器单元的电信号，用于指示外部设备需要处理。现代系统为每个外围设备将一个中断信号实现到通用的中断控制器硬件设备中；例如，即使是当代笔记本电脑中连接你键盘的
