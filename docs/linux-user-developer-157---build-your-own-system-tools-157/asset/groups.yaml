    `sudo apt-get install wine1.7 winetricks` 安装最新版本。Winetricks 也会随之安装，从而启用基于 GUI
    的选择功能，包括库、屏幕大小、Windows 版本、媒体驱动器，甚至 Windows 文件夹与您操作系统上文件夹之间的集成。


    Winetricks 是一套便捷的辅助脚本，用于获取库依赖项（DLL）和字体。它也有助于运行旧版本的 Internet Explorer，当然也适用于测试页面渲染。当
    Winetricks 不足以解决问题时，PlayOnLinux 可以帮助在 Linux 上安装那些更挑剔的 Windows 程序。


    ## PlayOnLinux


    在不同发行版中安装 PlayOnLinux 的过程差异很大。在当前的 Ubuntu LTS 上，运行以下步骤：


    ```bash

    wget -q "http://deb.playonlinux.com/pub/gpg" -O - | sudo apt-key add -

    sudo wget http://deb.playonlinux.com/playonlinux_trusty.list -O /etc/apt/sources.list.d/playonlinux.list

    sudo apt-get update

    ```


    ……仅仅将 PlayOnLinux 软件源添加到 apt 的源列表中。现在您可以通过 apt 或 Ubuntu 的其他包管理工具安装 PlayOnLinux：`sudo
    apt-get install playonlinux`


    从 PlayOnLinux 的工具菜单中选择 *Manage Wine Versions*。在此处，您可以选择不同版本的 Wine 进行下载和安装。因此，如果有人报告某款特定游戏或其他软件在（例如）Wine
    1.7.42 下确实运行成功，您就可以让 PlayOnLinux 使用该版本（见下图）。在 64 位计算机上，32 位的 wine 版本位于单独的标签页中。


    ## 为每个程序定制


    Wine 能够模拟 Windows 的每个版本，尽管 Windows 3.1 之前的版本现已弃用（您是否急需运行那么古老的软件？）。通常情况下这很直接，但对于那些需要特定
    Windows 环境的应用程序，我们可以通过 winecfg 设置让 Wine 配合工作。使用环境变量 **WINEPREFIX**，我们可以为不同的应用程序启用自定义字典。您甚至可以使用不同的
    **WINEPREFIX** 同时运行两个程序：例如，在同一台机器上模拟客户端-服务器软件。

    对于 64 位机器上的 32 位安装，例如，调用：


    ```bash

    WINEARCH=win32 WINEPREFIX=~/play-wine32 winecfg

    ```


    ……配置对话框将出现在屏幕上，以便为您即将进行的安装进行调整，而安装将通过以下方式完成：


    ```bash

    WINEARCH=win32 WINEPREFIX=~/play-wine64 /path-to/setup.exe

    ```


    为了避免每次都要输入相同的前缀，请使用以下 export 命令：


    ```bash

    export WINEARCH=win32

    ```


    PlayOnLinux 允许您通过其选项完成上述大部分工作，调出 winecfg GUI 以及针对每个安装的特定 32 位或 64 位 Wine 版本的库复选框。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_28_0.png)


    左 | 通过 PlayOnLinux 安装 Wine 可让您获得完整的版本控制


    ## Linux 上的 Photoshop


    Adobe 近期的 Photoshop 版本可以在 Wine 下运行，因为 PlayOnLinux 处理了其中的复杂性


    ### 清除旧的 Wine 痕迹


    Wine 有一个卸载器（GUI 和命令行 wine uninstaller appname >）。删除 ~/wine/ 将移除所有通过 Wine 安装的应用程序，除非您使用了
    PlayOnLinux。使用 PlayOnLinux 时，管理安装变得容易，可以创建独立的容器，每个安装都位于 ~/PlayOnLinux 的虚拟驱动器中（vyp，一个包含空格和撇号的目录名）。每个应用程序都有一个
    Windows 文件所需的目录层级。在 PlayOnLinux 中，选择一个应用程序并点击卸载即可处理。甚至可以在 PlayOnLinux 安装期间创建同名的目录并让其覆盖旧目录。要移除
    Wine，您的包管理器（如 sudo apt-get purge remove wine）会处理软件部分，但您的桌面仍会保留一些痕迹，例如菜单中的“用...打开”选项
    – 参见 Wine FAQ 寻求帮助。


    在所有让人们无法从专有平台迁移的应用程序中 – 暂且不计游戏，因为很少有企业依赖其在办公室运行《侠盗猎车手》的能力 – Photoshop 是许多人绑定 Windows
    系统的最强纽带。


    GNU 图像操纵程序 (GIMP) 的功能与 Photoshop 大致相同，并且对于许多任务具有更好的批处理能力，但用户界面不同。无论 GIMP 开发者在功能和文件格式处理上使
    GIMP 与 Photoshop 多么兼容，许多用户已在 Adobe 软件上投入了数千小时来磨练技艺。他们不愿迁移，所以让我们把 Photoshop 和 Linux
    结合在一起。


    下载您需要版本的 Photoshop 的多吉字节压缩包。我们选择了 Adobe Photoshop CS6 Design 和 Web Premium，DesignWebPremium_CS6_LSI16.7z
    文件重达 4.5GB。然后下载安装程序：在我们的案例中，是 DesignWebPremium_CS6_LSI16.exe。


    开始之前，请执行 winetricks atmlib，否则您将无法打开 PSD 文件！从 PlayOnLinux 的安装页面，选择图形标签页，然后选择“Adobe
    Photoshop CS6”。系统会告知它与 Photoshop 的 CC (Creative Cloud) 版本也兼容。


    PlayOnLinux 会选择适当的 Wine 版本 – 如果系统中尚未存在则下载它 – 以及所有库/DLL，因此针对 Photoshop CS6 优化的设置已安装完毕。一个向导（见左下角图片）将引导您完成流程。


    点击通过通常的最终用户许可协议 (EULA，可能是我们这个时代最无人问津的文件类别，但在 Linux 桌面上却是新鲜体验) 后，解压并安装开始。如果没有安装密钥，您可以选择
    30 天试用。还有大量的下载，包括无处不在的 Microsoft 字体获取。除非您有大量内存、超快互联网和快速 SSD 硬盘，否则您可能此时需要泡杯茶。或者甚至出去吃个午饭。


    午饭回来了？很好。Adobe 声称您在使用 Mercury 图形引擎时能获得“极快的性能”，但这可能解释了 CS6 在带有 Intel 图形芯片组的测试机上看似无法在
    Wine 下正确安装的原因。我们配备 NVIDIA 显卡的机器（默认安装 Ubuntu 且未调整驱动程序）运行良好。


    由于我们并不是特别有艺术气质（如下所示），这里能报告的质量仅限于 Photoshop 似乎运行良好，在 Wine 数据库中获得了兼容性的黄金评级。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_29_0.png)


    上方 PlayOnLinux 安装向导操作简单明了


    ![](img/e7f197876caa0b235fb5da2d16a578ea_29_1.png)


    右 如果遇到运行时错误，尝试将 PlayOnLinux 设置为 Windows 7 以适配您的 Photoshop 版本


    ## 游戏无国界


    从今年的最新作品到永恒的经典，Wine 帮助玩家保存他们在 Linux 上的游戏收藏


    ### 现代游戏


    在过去，为了在 Linux 上运行 Steam 的 Windows 版本，投入了大量精力。这是为了将最后几款非 Linux 游戏，如 *Terra*，带到
    Linux 桌面。现在，由于几乎所有流行的 Steam 游戏都在 Linux 版本上或正在前往 Linux 版本的路上，游戏玩家对 Wine 最大的需求是让
    *FIFA 15* 等游戏能够运行。要在您的仿 Windows 电脑上运行该游戏以及其他 EA 游戏，如 *Sims 4*，第一步是安装 EA 的下载器 –
    Origin。


    从 **origin.com/download** 获取 OriginThinSetup.exe 文件是第一步（也是最简单的一步）。事实上，在非精简版的 OriginThinSetup.exe
    前身安装程序上安装要在 Wine 下容易得多，但 EA 不再提供该版本，而且您真的不想尝试来自可疑下载站点的旧副本。


    精确的操作步骤会因您的发行版、Wine 版本、EA 对安装程序所做的修改以及风向（比喻义）而异。


    安装它的最佳方法实际上涉及到执行安装流程，之后安装失败。然后您在一个新的 Windows 计算机上安装，抓取 **C:\Program Files (x86)\Origin**
    文件夹，将其覆盖安装在您的 Wine 或 PlayOnLinux 目录中的 Origin 文件夹上，然后通过 Wine 运行 **Origin.exe**。这个方法效果很好，使我们随后能够安装
    *FIFA 15*，但这令人不满意，因为您可能无法访问 Origin 的新 Windows 安装版。


    在顺风顺水的日子里，您在 **dotnet35** 库、**directx9**、各种字体、**msxml3** 和 **lic32-libxml2** 上的运气可能比我好。但使用较旧的
    **OriginSetup.exe**，它绝对可以工作！


    ![](img/e7f197876caa0b235fb5da2d16a578ea_30_0.png)


    ### 经典游戏


    并非所有人都想运行最新版本，它们对更快系统的需求日益增长。毕竟，我们可以用主机来玩这些游戏 – Steam 的努力为 Linux 用户带来了丰富的游戏选择。但请允许我们怀念一下昔日的标题，*Railroad
    Tycoon*、*Monkey Island* 或 *Age of Empires* 的魅力可能会让您从阁楼翻出积满灰尘的 CD-ROM，看看 Wine 在针对
    Windows 98 甚至更早系统设计的软件上表现如何。


    我们首先测试了原版 *Dungeon Keeper*。它宣传适用于 Windows 95 或 DOS，实际上是在 DOS 上运行的，结果发现 Wine 并非必要
    – 如果您仍有一张副本，请为它安装 DOSBOX。在我们翻出的 90 年代光盘中，我们找到了 *Baldur’s Gate*，这是对经典 *Dungeons
    & Dragons* 的复杂且引人入胜的诠释，您在安装前最好先清空日程表。


    在 CD-ROM 上右键单击 **SETUP.EXE** 文件会弹出用 Wine 打开的选项，但通常只需单击即可从大多数发行版运行（或在命令行中运行）。在
    winecfg 中，我们将操作系统设置为 Windows 95，图形保持默认值。当安装进行时，“200MHz 或更快的处理器”等选项提醒我们要多么深入地穿越回过去。


    一切运行完美，如下所示，*Baldur’s Gate* 随即出现在 Wine 菜单中。这也是一款您可以在 Wine 稳定版上运行的游戏。然而，我们没有时间说更多，因为那个地牢里有宝藏等待...


    ![](img/e7f197876caa0b235fb5da2d16a578ea_30_1.png)


    - **左下** Wine 能与大多数较新的游戏配合使用，但 EA 的 Origin 平台可能反复无常

    - **右下** 经典 Windows 游戏可以轻松复活并加入聚会


    '
