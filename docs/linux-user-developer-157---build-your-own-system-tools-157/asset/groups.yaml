    # # Stream media through your network with OSMC


    **Set up a Samba server and map a network drive to OSMC to stream media across
    your home network**


    ![](img/e7f197876caa0b235fb5da2d16a578ea_69_0.png)


    **Sean Tracey** is a multi-award-winning technologist who lives for making things
    with hardware and the web. He breaks things for a living


    Thousands of images, videos and music files live in your pocket and it’s likely
    even more are in your personal cloud or hard drives. While it’s great enjoying
    these on our personal devices, it’s gratifying to see them on our big TV screens
    – but this isn’t easy. Do we hook up our laptop? Do we fiddle with a manager of
    wires and resolutions, hoping for a decent image? Will the sound work? All of
    this is taken care of with a Raspberry Pi 2 and OSMC. OSMC is an OS built to do
    one thing: put your media up on that big screen. But, how do we get media onto
    OSMC? Here we need Samba and a networked hard drive.


    +   01

    +   ### Install Samba


    We’re going to assume that you already have a networked OSMC Pi set up already
    (it’s a simple installation), so we’ll jump straight into setting up Samba. For
    this tutorial, we’re using Ubuntu 14.04. If you’re running a Debian system, all
    of these instructions should work fine as they are. If not, you may need to search
    around for the appropriate repos. First, we need to get the Samba package from
    the repository with *apt-get*. Open up a terminal and enter:


    ```

    sudo apt-get install samba

    ```


    ![](img/e7f197876caa0b235fb5da2d16a578ea_69_1.png)


    # What you’ll need


    +   - OSMC osmc.tv

    +   - Hard drive

    +   - Home network

    +   - Samba

    +   - Another Linux computer, less than eight years old'
