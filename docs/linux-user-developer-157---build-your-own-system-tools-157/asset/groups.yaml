    ## ElectroSuper


    Fred Sapey-Triomphe 和 Yann Guidon 通过一座超大型 LED 装置让蒙斯火车站熠熠生辉


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_0.png)


    > **蒙斯车站的 ElectroSuper 装置看起来太棒了！你们合作多久了？**

    > *Fred* 自 2013 年 2 月起，我和 Yann 一直在一起工作。我想创建一个大规模 LED 显示屏，而我是一名视觉艺术家，没有电子学基础，所以我无法独自完成。我通过共同的朋友认识了
    Yann，并于 2013 年初去了他的工作室。当时我被邀请为法国诺曼底的一场展览做另一个项目，所以我有了一点预算，我就问 Yann 是否愿意开始做那个项目。


    **你们是如何开始 ElectroSuper 项目的？**

    *Fred* 基本上，我们在 2014 年于法国北部靠近德国边境的梅斯附近的 Pompuoido Centro 县有一个展览。梅斯有个人告诉我，蒙斯市正在寻找一些东西来装饰火车站。[编辑注：蒙斯是今年的欧洲文化之都。]
    那个人说，“为什么你们不把作品集发给蒙斯呢？” 于是我就这么做了，我们最终在开幕前三个月签署了合同。我们只有两个月的时间来制作整件作品，那是一块 42 米长的天花板屏幕。


    **屏幕与隧道里的行人互动 – 这是如何工作的？**

    *Fred* 我们的想法是覆盖行人通道的天花板。下火车的人会走这条通道去车站，所以这是访客抵达时首先看到的东西。我们要被要求创作一些引人入胜、有力、色彩斑斓的东西，让访客在访问期间保持好心情。我们希望它具有互动性，所以
    Yann 在隧道的入口和出口安装了四个红外传感器。屏幕显示的图像会根据访客数量变化。

    *Yann* 我将每对传感器之间相距一米，所以当我收到一系列脉冲时，我就知道有东西在人行道上朝一个方向移动。


    **所以它是类似潮汐的 – 每当有新的移动，它就发送另一波颜色？**

    *Fred* 是的。这是一个很好的解释方式。此外，这个项目运行全年。我们设计使其视觉效果根据季节变化。所以现在它是八月，光量比十二月大，所以我们必须为每个季节创建特定的视频。


    **除了传感器，你们还使用什么其他硬件？**

    *Yann* Fred 设计了整个结构并帮助建造它。有很多木质结构，木材经过特殊处理，因为它必须承受雪、雨和阳光。他找到了预制元件，我们可以将 LED 灯带固定在上面，2
    乘以 3.5 米，像瓷砖一样。所以我们把整个表面分成六个部分；每个部分有 40 乘以 70 个灯泡，即 2,800 个灯泡。总共有 16,800 个，每个灯泡大约一瓦，所以如果你乘以一切，你会得到超过
    16 千瓦。长度是 42 米，我们必须在这个距离上传输数据。它造成了完整性、可靠性等问题，所以我们选择使用以太网传输数据，因为它便宜且支持良好。

    我们非常注重可靠性，现在我们在制作既不昂贵又能在恶劣天气和其他损伤下工作的东西方面积累了大量经验。许多人会从用 Arduino 驱动 WS2812 开始，这对一条灯带有效，然后为了制作屏幕他们会增加更多。它在桌子上有效，但当你转向户外装置时，约束条件巨大，Arduino
    不够用。所以我创建了一块特殊的板子，WizYasp，用于驱动数千个 LED 并将它们并联以驱动更多并提高可靠性。


    **所以你们每个部分使用不同的 WizYasp 板子？**

    *Yann* 是的。我使用了一个层次结构：在顶层我们有一个 Raspberry Pi B+，其中包含定制的 Raspbian。我移除了所有与 X Window
    相关的内容，所以我节省了大约 1 GB，这为存储视频提供了更多空间。我加固了操作系统，使其处于只读模式。在这些装置中，我们永远不知道电源是否或何时会被移除，如果
    SD 卡正在存储日志等，就有磨损的风险。还有一个实时时钟，因为我们在公共空间，存在节能问题。当太阳出来时，从大约上午 10 点到下午 5 点，系统会关闭。当
    WizYasp 板子发现没有数据进来时，它们会将所有设置设为黑色，以减少电流。Raspberry Pi 连接着一个小型 8 端口集线器。100 Mbit，这是可以的，因为一帧大约
    50 kB，乘以每秒 25 帧，它小于每秒 1.5 Mbit。


    **回到显示屏，你们如何让视频变化和与行人互动？**

    *Yann* Fred 准备视频序列，然后将其导出到特殊格式，所以我可以处理并将序列转换为可读取的文件。从那里，我可以修改程序。例如，应用滤镜或加速或放慢播放。目前，系统流畅；它是平滑的，因为根据一个相当简单的算法，网络上到六个控制板上的处理很少，该算法优化了网络拥塞。它有一个大缓冲区，可以缓冲大量数据，然后所有屏幕通过接收一个小广播数据包同时更新，以确保屏幕完美同步。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_1.png)


    **Fred Sapey-Triomphe** 是一位以光为原材料的视觉艺术家。他在法国国立高等美术学院（École nationale supérieure
    des Beaux-Arts）和布利学院（École Boulie）接受培训，居住在巴黎工作


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_2.png)


    **Yann Guidon** 是一位与艺术家合作的工程师，专长于电子学和算法。他设计了两套开源 CPU 架构：F-CPU 和 YASEP


    ### 喜欢它吗？


    Fred 和 Yann 合作做的第一个项目是 Rosace，一种通过幻象镜（phantastoscope）实现的电子体验，类似于色轮（zeotropic）或幻象镜。

    你可以在视频的第一部分查看：

    goo.gl/NgV6mJ


    ### 延伸阅读


    对 Yann 的 WizYasp 板子感兴趣？

    这里有更多详细信息：

    goo.gl/WvVdbB


    ## 通过 OSMC 在网络中流媒体播放


    **设置 Samba 服务器并将网络驱动器映射到 OSMC，以在家庭网络上流媒体播放媒体**


    ![](img/e7f197876caa0b235fb5da2d16a578ea_69_0.png)


    **Sean Tracey** 是一位多次获奖的技术专家，热衷于用硬件和 Web 制作东西。他以破坏东西为生


    成千上万的图像、视频和音乐文件生活在你的口袋里，很可能还有更多在你的个人云或硬盘中。虽然在我们的个人设备上欣赏这些很好，但看到它们在大电视屏幕上令人欣慰 –
    但这并不容易。我们要连接笔记本电脑吗？我们要摆弄一堆线材和分辨率，希望获得不错的图像吗？声音能工作吗？使用 Raspberry Pi 2 和 OSMC 可以解决所有这些问题。OSMC
    是一个旨在做一件事的操作系统：将你的媒体放在那个大屏幕上。但是，我们如何将媒体放入 OSMC？这里我们需要 Samba 和一个网络硬盘。


    ### 01 安装 Samba


    我们将假设你已经设置了一个网络化的 OSMC Pi（安装很简单），所以我们直接进入 Samba 的设置。在本教程中，我们使用 Ubuntu 14.04。如果你运行的是
    Debian 系统，这些说明应该可以正常工作。如果不是，你可能需要搜索相应的软件仓库。首先，我们需要从软件仓库获取 Samba 包，使用 *apt-get*。打开终端并输入：


    ```

    sudo apt-get install samba

    ```


    ![](img/e7f197876caa0b235fb5da2d16a578ea_69_1.png)


    ### 你需要什么


    - OSMC osmc.tv

    - 硬盘

    - 家庭网络

    - Samba

    - 另一台 Linux 计算机，年龄不超过八年


