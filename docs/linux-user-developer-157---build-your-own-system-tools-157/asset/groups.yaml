    \ NULL\n```\n\n现在，让我们看第 25 行。如果你写了 `entries= readdir(theDirectory)` 而不是 `entriesP\
    \ = readdir(theDirectory)`，你将在一个完全不相关的地方（第 27 行）得到一个警告：\n\n```\n$ ./LS.c:27:24:\
    \ warning: ‘entriesP’ may be used uninitialized in this\n$ _function (-Wmaybe-uninitialized)\n\
    $ printf(\"%s\\n\", entriesP->d_name);\n```\n\n尽管如此，`gcc` 编译器将创建一个可执行文件，因为就 C\
    \ 而言，C 代码在语法上是正确的。问题是你的程序将没有输出，因为 `entriesP` 变量没有值，因为你使用比较运算符（`=`）而不是赋值运算符（`=`）。恭喜你——这是你的第一个\
    \ bug！\n\n## `wc` 的简化版\n\n本节将向你展示如何创建一个 `wc` 实用程序的简单版本，该版本仅统计文件中的单词数——`myWC` 程序只需要一个命令行参数，即要读取的文件名。\n\
    \n你现在应该知道如何编译你的代码了，所以请继续。尝试关注任何错误或警告消息。`myWC` 的代码比另外两个程序大，因为它做的事情更多：程序的逻辑封装在 `while`\
    \ 循环中。\n\n有许多更有效的方法来读取文件，而不是逐字符读取，但在这种情况下，这是最简单的解决方案，因为你随后将进行三次字符比较。因此，使用 `fgetc()`\
    \ 函数（第 29 行）逐个字符读取整个输入。该程序假设当你读取空格字符、制表符或换行符（第 31 行）时，你不在一个单词内部。第一次你看到一个不同于空格、制表符或换行符的字符时，程序假设你处于一个新单词的开头（第\
    \ 33 行）。\n\n下一个系统编程教程将构建一个更接近 Linux 上 `/usr/bin/wc` 实用程序的 `wc` 版本。\n\n## 进程 ID\
