    ## 挽救 iTunes 内容


    > 如果你确实需要 iTunes，请忽略那些令人困惑的在线建议，跟随 PlayOnLinux 的向导操作即可。


    iTunes 近期的臃肿化使其从早期那个相对轻量、专注且强大的音乐库应用，蜕变成了一个摇摇欲坠的、由*几乎无用的功能*组成的**多媒体版 Microsoft
    Office** 集合体。如今，Linux 上有许多替代 iTunes 的方案，尽管它们几乎都有各自的缺点。不过，对于那些被困在苹果“围墙花园”内、拥有已购买媒体资源的用户来说，iTunes
    依然有其优势，许多 Linux 用户需要在不双启动的情况下访问它。


    不幸的是，在 Wine 上运行 iTunes 并非总是容易的事，许多人甚至为了运行 iTunes 而保持一台运行最新 OS X 或 Windows 版本的虚拟机（VM）处于待命状态。


    网络搜索很容易得到大量相互矛盾的安装 iTunes（使用 Wine）的信息。我们尝试遵循其中一些方法，通过各种库（如 libmwx13, ncal220 和
    dotnet40）使用 winetricks 和 Winecfg，以及通过 PlayOnLinux 的库加载器进行添加。我们最好的结果只是成功安装了一个灰显的图标框，尽管某些菜单是可访问的。即使在使用
    `winetricks gdi32`（它下载了 600MB 的图形库）重新开始后，问题仍未解决。


    然后我们忘记了网上那些关于我们该做什么的帖子。我们只是放手并信任 PlayOnLinux。点击安装后，我们没有选择“未列出的软件”，而是前往“多媒体”菜单并点击了
    iTunes 12（参见左下角图片）。我们还从 Apple 下载了 32 位安装程序，即便对于我们的 64 位测试机也是如此。


    PlayOnLinux 警告了我们哪些功能无法正常工作：与 iDevices 同步，尽管有很多原生的 Linux 应用可以与苹果音乐硬件通信（至少在情况良好的时候）。然后，就像我们的
    Photoshop 安装一样，PlayOnLinux 的向导完成了所有繁重的工作，包括选择 Wine 1.7.48（这是该特定安装程序创建者已知可行的版本）以及
    `wine_gecko`（用于渲染 Apple iTunes 商店的 Web 界面）。随后，它获取了各种其他服务包和库。iTunes 在三台测试机器上都成功启动。


    据报道，插入 iPod 或 iPhone 无法工作，管理音乐库的效果也不稳定，因为非常大的多媒体文件磁盘可能会导致程序崩溃。然而，我们可以访问 iTunes
    商店来消费我们辛苦赚来的钱，最重要的是，iTunes 拥有大量专业的互联网广播电台。我们度过了一个愉快的夜晚，在 **calmradio.com** 上聆听
    Bebop 爵士乐——无需会员登录即可在 iTunes 上收听——享受这一切的爵士风味。


    ## 注册表手术


    如果确实需要编辑 Windows 注册表，Wine 可以为你调用其自身的注册表编辑器，功能与 Windows 上同名的软件相似。在 Wine 下运行的一大优势是，如果你搞砸了，不会使系统不稳定，而且对
    `~/.wine` 或 PlayOnLinux 等效位置（location）进行备份意味着你甚至不会丢失模拟安装的环境。被编辑的文件位于 `$WINEPREFIX\*\
    REG`，但由于使用了特殊编码来存储键，因此不应直接编辑它们。在 regedit 中，`HKCU_CURRENT_USER\Software\Wine` 很可能主要关注点。例如，在
    `MSHTML\GeckoUrl` 处，这是 Wine Gecko 的位置，你可以创建一个新的 **SWINEPREFIX**。将注册表条目更改为本地位置，如
    `file:///Z/ path/to/wine_gecko/`，意味着无需不必要的下载。


    最有用的修改键值及其有用解释列于：wiki.winehq.org/ User/Registry。


    **上方** 始终检查 PlayOnLinux 菜单，看看你想要的软件是否已列出

    **右侧** iTunes 在处理大型音乐库时会很吃力，但至少你可以获取你在商店购买的商品


