    to make it more competitive with free IDEs, such as Eclipse. Running Windows in
    a Unix-hosted VM is a possibility due to the widespread availability of high-speed
    hardware virtualisation. Sadly, developing inside a VM is detrimental for game
    programmers. Code will exhibit hardware-specific behaviour: if you run in a VM,
    you are testing the virtualised GPU rather than the one found on the host/target
    platform.


    When working a non-space-constrained system, you should start by downloading the
    complete VM and the IDE by entering the following commands:


