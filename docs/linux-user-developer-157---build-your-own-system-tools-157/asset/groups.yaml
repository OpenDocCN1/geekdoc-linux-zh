    ## 评论


    ### 致编辑部


    关于本刊、Linux 和开源的问题与观点


    ![](img/e7f197876caa0b235fb5da2d16a578ea_93_0.png)


    **备注** 微软的设置确保您的私密对话安全且未被记录，直到您使用关键词 **Notes（备注）**。该设备还可以控制咖啡机和恒温器之类的电器，并接入 IFTTT


    ### 可黑客化的管家


    你好，Linux 用户与开发者，


    我阅读了 Joey Bernard 最近关于使用树莓派（Raspberry Pi）编程打造类 JARVIS 智能家居系统的一系列文章，受益匪浅。我也尝试自己组装了一个，过程非常有趣，但显然实现起来相当简单。不过，这个项目理念让我越品越有意思，我现在希望实现一个更完善的系统。我的问题是：能否推荐一个结合开源软件和硬件的系统，让我可以在此基础上进行探索和扩展，以更好地适应我家中现有的设备需求？


    乔·R（Joe R）


    你好，乔，


    很高兴听到你喜欢乔伊的教程！就智能家居而言，目前可选的完整系统有限。亚马逊 Echo 在系统架构和功能上最接近你想要的效果，但由于它是专有系统，因此不支持黑客修改和扩展。


    我们最近发现了一个项目叫做 Mycroft。它也是一个 Kickstarter 众筹项目（kok.st/1hV2fNf），截稿时距离结束还有五十个小时，众筹金额刚刚达到目标（10.7
    万美元/9.9 万美元），因此支持者的设备应在 2016 年 7 月发货 - 这应该能完美满足你的需求。Mycroft 是一个语音控制单元，能够输入和输出自然语言，可以接入在线服务，并与一系列物联网（IoT）和媒体设备交互。Mycroft
    可以设置闹钟、发推文、告知天气以及朗读日历日程。你可以使用正则表达式来执行特定的 shell 命令。它可以播放音乐和视频，控制咖啡机、恒温器和无线锁等设备，甚至连接本地
    Mycroft 单元进行房间间的语音聊天或全屋广播。关键在于不仅是软件端的实现和自然语言输入的可信度，还有 Mycroft 可以交互的信息源。媒体内容可以来自
    Netflix、Spotify、Pandora、YouTube、Plex 和 NPR。它也可以输出到 Chromecast 和 Roku 设备。它可以控制
    WeMo、飞利浦 Hue 和 Nest 设备，以及 SmartThings 和 Iris 智能中枢。此外，它既可作为 IFTTT 的来源，也可作为目标。这是一个非常扎实的开端。就开放性而言，它基于树莓派
    2 和一个 Arduino 兼容的微控制器，由 Snappy Ubuntu Core 和开放 API 驱动所有功能。团队承诺将提供关于所有硬件和软件的全面文档。由于这个开放系统内部有一台树莓派，你将能够自定义你的
    Mycroft 并分享你自己的修改版本。这是一个有趣的项目，值得关注：mycroft.ai。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_94_0.png)


    上图 终于，舒适的 Impulse 鼠标有了实际用途


    ### 移动办公中的 Linux


    你好。


    我是一名计算机科学专业的学生，大部分开发工作都在 Linux 上进行。我也喜欢在外面或咖啡店工作。问题是我旧笔记本电脑的电池续航能力：当我进入心流状态时，电源指示灯突然变红，开始在极不合时宜的时刻倒数至
    0%！家里有几台平板电脑，所以我想知道是否可以将 Linux 安装到这些平板上？


    格米（Gemmy）


    嗨，格玛（Gemma）。


    最简单的解决方案之一是通过租用基于云端的 Linux 服务器，然后在平板电脑上使用应用直接 SSH 登录，或者如果需要图形界面（GUI），使用 VNC 客户端。我们之前发现这个解决方案主要得益于一篇由马克·奥康纳（Mark
    O’Connor）撰写的有趣博客文章系列——不妨自己读读这些文章，看看你感觉如何：yieldthought.com/search/linux。


    本质上，马克从 Linode（linode.com）租用了一个 SSD 服务器，并通过 iPad 使用 iSSH 和 GNU Screen 的组合接入。他在文章中似乎对这套设置非常满意，我们也一直被诱惑着想去尝试一下。从回复来看，很多人也都这样做了，这似乎是一个可靠的系统。


    重建他系统的唯一问题是 iSSH 应用现在已经停止维护。别担心，我们推荐两款替代软件：iPad 用户可以使用 Prompt 2，安卓平板电脑用户可以使用 JuiceSSH，具体取决于你拥有的设备。至于启动图形界面，我们喜欢使用
    RealVNC 开发的 VNC Viewer 应用，它可以在 iTunes 和 Google Play 上获取。服务器端，你可以查看 Linode 网站上的远程桌面教程：bit.ly/1iE2XQX。


    使用这些应用并注册 Linode 设置平板电脑应该不会花太长时间。Linode 的注册非常简单。该服务的用户反馈也非常好，如果你需要联系客服，他们的响应速度极快。


    即使对于学生预算，Linode 也是负担得起的——定价方案从单核 1GB 内存的每月 10 美元开始，2GB 和 4GB 内存方案的最高价格为每月 68 美元，六核方案为每月
    80 美元（不过你很可能用不到那个配置）。该服务附带一个很棒的 Linode 管理应用（支持 Android 和 iOS），让你无需使用第三方 SSH 或
    VNC 应用即可管理服务器。


    一旦在 Linode 上设置好，你就可以在平板电脑上工作，而无需担心如何安装 Linux 的问题。在安卓设备上安装 Linux 当然是可能的（请查看第 144
    期），但据我们所知，目前尚无可靠方法让功能完整的 Linux 操作系统在 iPad 上运行，除非使用虚拟化或一些非常极客的变通方案。


