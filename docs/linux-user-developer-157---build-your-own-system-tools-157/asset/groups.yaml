    \n选择您的 IAM 用户名，点击“用户操作”，然后点击“管理访问密钥”，最后点击“创建访问密钥”。下载您新创建的凭证，并记得将它们存放在安全的地方（AWS\
    \ 不会保留副本）。\n\n使用您的凭证配置 CLI 工具的最快方法是以下命令：\n\n```\n$ aws configure\n```\n\n系统将提示您输入以下信息（此处显示为示例用户输入）：\n\
    \n```\nAWS Access Key ID [None]: EXAMPLEACCESSKEYID\nAWS Secret Access Key [None]:\
