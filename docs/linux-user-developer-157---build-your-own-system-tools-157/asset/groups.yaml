    # Tutorial

    ## AWS security


    ![](img/e7f197876caa0b235fb5da2d16a578ea_53_0.png)


    # 05

    ### Grant permissions to the IAM user


    ![](img/e7f197876caa0b235fb5da2d16a578ea_53_1.png)


    **Identity Federation**


    See how users can be redirected to federated sign-in. For more details, see **Identity
    federation**. AWS account administrators can create IAM users and assign permissions
    to resources. For more details, see **Users and Groups**. AWS also supports identity
    external identity, SAML, and OpenID Connect.


    **05 Grant permissions to the IAM user**

    On AWS, you can grant or restrict users'' access to your infrastructure and services
    by means of documents that are referred to as policies. An alternative method,
    access control lists (or ACLs for short), is deprecated and should no longer be
    used. In addition to policies, you can also use roles to manage the access privileges
    of individual services as well as access from other AWS accounts.


    These policies can either be entity-based or resource-based. The former are attached
    to a user, or a group, in order to grant them specific privileges for clearly
    defined activities on all or some resources. The latter are attached to a resource
    to manage access.


    In order to grant privileges to your IAM user, navigate back to the Users section
    of the IAM Console, click on the username, scroll down to the page to the Permissions
    section and then click on Attach Policy.


    On the following page, the AWS Management Console will most likely present you
    with a mind-bending collection of possible policies: either AWS-Managed or Customer-Managed,
    or even both depending on how you set the filter. To simplify your search, you
    can also filter the list by using the search box. In order to assign any combination
    of policies to the user, you need to activate the appropriate policy entries in
    the list and click on Attach Policy. You will be able to view details of the policy
    as well as detach it, or even simulate it, on the next page.


    When selecting which policies to attach to your users, you should be extremely
    cautious.


    **06 Obtain a sign-in link for IAM users**

    Navigate to the dashboard of the console. Directly underneath the welcome message,
    the console offers you the ability to create a customisable sign-in link for all
    IAM users. This link differs from the main sign-in URL that is available to the
    AWS root user. IAM users cannot sign in without knowing this link (in addition
    to their credentials).


    Edit the link (your account''s alias) to your heart''s content, then copy it to
    your clipboard and save it. Alternatively, bookmark it. You will have to make
    this link known to each IAM user who is authorised to access your services.


    When a user visits this link in a web browser, they will be prompted to sign in
    with their username and password.


    Permissions for accessing the AWS Management Console are separate from user privileges
    and are never granted automatically. This can be frustrating at times, as your
    IAM users report an inability to interact with the console, then they are lacking
    console privileges and you will have to grant these to all users with a genuine
    need for them.


    **07 Sign out from your AWS root account (for good!)**

    If you are still authenticated as the AWS root of your account, now is the time
    to sign out. From this point on, you should never use AWS root account credentials,
    ever again. Any tasks that the root user can perform can also be performed by
    an IAM user, provided they are given sufficient privileges that are carefully
    tailored to the context of the current task. This is in order to minimise your
    exposure to sniffing and other types of attacks.'
