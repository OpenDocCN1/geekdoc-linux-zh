    \ and architectures, and makes it easier to design hardware itself. Companies\
    \ don't use GNU/Linux because of sentimental attachment to Linux or the GPL, or\
    \ “open source”. They use GNU/Linux and free software because it makes business\
    \ sense. And free software, guaranteed by the GPL, gave assurance of the continued\
    \ freedom and community of the code. The contribution of the free software movement,\
    \ both in ideas and hard code, to the rise of Linux isn't always given the recognition\
    \ it deserves.\n"
  mdcn: "\n## 开源\n\n06 新闻与观点 | 12 访谈 | 90 问答 | 94 读者来信\n\n### 企业级\n\n## Linux 基金会宣布开放大型机项目\n\
    \n### 汇聚行业与学术合作伙伴\n\nLinux 基金会宣布与行业巨头合作启动一个项目，以推进适用于大型机设备的 Linux 企业级平台，该项目不出意料地被命名为“开放大型机项目”（Open\
    \ Mainframe Project）。\n\n该项目汇聚了行业巨头 ADP、CA Technologies、IBM 和 SUSE 作为创始白金会员，而\
    \ BMC、Compuware、LC3、RSM Partners 和 Viron Infinity 则加入成为银牌级会员。随着云计算和大数据话题引起兴趣，行业对大型机系统的需求重新激增，促成了该项目的成立。\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_5_0.png)\n\n“如今的 Linux 是全世界增长最快的操作系统。随着移动和云计算在全球范围内普及，企业需要更高水平的速度和效率，而大型机上的\
