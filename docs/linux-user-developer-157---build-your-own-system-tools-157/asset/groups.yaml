    } } \n \n// Close the file\nfclose(fp);\n \nprintf(\"Number of words found %d\\\
    n\", nword);\n \nreturn 0;\n}\n```\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_24_0.png)\n\
    \n## 错误消息和 Bug\n\n通常，你的代码会存在一些错误或 bug。一个常见的错误是在程序中没有包含正确的头文件。如果你尝试编译 `myLS.c`\
