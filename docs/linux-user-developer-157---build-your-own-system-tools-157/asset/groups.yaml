    现在是有趣的部分。change_leds 函数使用经过滤波的数据，获取每组数据的平均振幅，并将其转换回 0 到 255 之间的值。之后，你可以调整数值以强调频率值。正是这个主题和步骤\
    \ 10 中 fall 数组的数值将决定你的 LED 灯带如何表现。在设置颜色时，如果新值高于之前的最大值，我们更新最大值。如果没有，我们将最大值减去 fall\
    \ 值，并使用该值作为设置的颜色。这使得当能量下降时，颜色以受控的方式衰减。此外，在进行这些计算时，请确保不会越界。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_64_0.png)\n\
    \n### 14 绘制频率响应\n\nplot_response 函数不是程序的必要部分，但我们用它来绘制滤波器的频率响应，以确保其行为符合预期。因此，如果你想尝试更改滤波器，这是一个很好的功能。频率刻度是对数刻度，因为人耳的听觉就是这样工作的。如果你通过\
    \ `ssh -X pi@ip.address` 登录到 Pi 并调用该函数，你应该会将图形转发到本地机器。\n\n### 15 音频控制器\n\n音频控制器是拼图的最后一块。它负责播放\
    \ WAV 文件或捕获线路输入信号，然后将这些数据发送到 LED 灯带进行过滤和显示。init 方法接收一个文件名（或线路输入）以及 LED 控制器类的实例。会设置一个标志，指示是否正在使用线路输入。如果不是，则打开\
    \ WAV 文件。最后，存储 LED 实例并创建 PyAudio 库的实例。\n\n### 16 辅助方法\n\n音频控制器中有几个实用方法。第一个方法获取立体声信号的左侧部分，因为分析两侧没有意义。还有一个“更多”功能，它从\
    \ WAV 文件或线路输入获取另一块音频数据。奇怪的是，首次读取时总会有线路输入错误。在此之后应该会保持稳定——如果不行，请尝试更改块大小。如果出现错误，我们就返回随机数据。\n\
    \n"
