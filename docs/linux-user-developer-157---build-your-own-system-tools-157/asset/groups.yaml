    ## 访谈：塞巴斯蒂安·克格勒

    ### Plasma Mobile：下一代 Linux 手机


    核心 KDE 开发者塞巴斯蒂安·克格勒（Sebastian Kügler）揭秘他是如何领导该项目，将 Plasma 桌面系统移植到手机上，并推动 Linux
    进一步进军移动市场的。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_11_0.png)


    祝贺你近期发布了项目公告！你从事 Plasma Mobile 开发多久了？


    认真做的话，大约四到五个月。这始于一项概念验证，大约在一年前。在新年之交前后，我们确定实际上可以在手机上启动 Plasma 用户界面。于是我们开始理清软件栈——弄清楚各部分该如何协同工作，如何在
    Nexus 硬件上实现运行。我们曾尝试迁移到基于 Ubuntu 的软件栈，但在让 libhybris 正常工作方面遇到了巨大问题：内核和图形驱动程序存在问题。这实际上让我们倒退了两到三个月，最终通过完全转向
    KWin 解决了这个问题。随后，负责 KWin 开发的同事实际上让它成功运行了，从那里起我们就能开始——或者说，飞速推进——开发工作，这样我们就能够在 Akademy
    大会上展示我们引以为傲的成果了。


    所以，你现在是基于 Ubuntu 软件栈的？


    是的。我们的理念是创建完整的软件环境，但在某种程度上，你可以替换底层操作系统——基本上就像 Linux 桌面一样。也就是说，你拥有一个模型操作系统，例如 Ubuntu
    Touch 或 Mer、Sailfish，你确保 KDE 框架被打包，并且我们可以使用图形接口——无论是 DRM 还是 libhybris。在此基础上，其他一切应保持相同。


    你的网站提到，在应用支持方面，该项目具有包容性——可以运行 Plasma 应用、Ubuntu Touch 应用、GNOME 和 X11 应用。那么，Android
    应用的情况如何？


    技术上可行，但并不容易，因为需要大量基础设施来模拟完整的 Android 环境。我们团队中有一位全职致力于此的同事，他不时得到其他人的帮助。主要难题，但显然也是最后几个主要阻碍因素之一，又是图形问题。这是我们一生的故事：我们总是在图形问题上挣扎！在桌面上我们基本上已经解决了这个问题，但现在在所有这些移动设备上，又是一大头痛。目前的状况是，他确实能够启动一个
    Android 应用程序，但还不能输出图形。这对开发者来说是一个里程碑，但对用户来说目前毫无用处；在实际将任何内容绘制到屏幕上之前，还有大量工作要做。在 Android
    图形基础设施中，有一个名为 SurfaceFlinger 的接口，它在语义上与我们处理图形的方式不同，因此需要某种桥接。应用程序实际上需要认为它们正在向 SurfaceFlinger
    渲染，但我们让它们通过一个由 Wayland 支持的 SurfaceFlinger 进行渲染。这有点棘手，但我们已经有了可以在屏幕上绘制的内容。在 Akademy
    大会上，我们展示了一个非常令人兴奋的黑色矩形。


    就开发而言，这是你当前的重点——为各种应用开发显示功能——还是你仍然将大量精力集中在核心系统本身？


    目前最大的任务实际上是非技术性的：我们刚刚公开了该项目，过去几周我特别忙于项目管理方面。我们看到了人们极大的热情。有些人非常批判，说“世界不需要它”以及“它看起来不好看”。但也有很多人认为这是一个真正的好主意，一件有价值的事情——一个不受单一公司控制的、公开开发的、他们实际上可以参与塑造的操作系统。现在我们实际上必须扩大其背后的流程规模。所以，我们目前正在引入一个名为
    Phabricator 的项目管理工具，它允许我们进行协调。它非常适合任务管理，并允许代码审查。我也非常忙于编写文档，这是另一个重大的可扩展性因素——我们需要文档才能吸引开发者。我真的很喜欢的一点是，我们展示了一个几乎零设计工作的原型，并收到了大量反馈，例如，“但它看起来像垃圾——他们应该让设计师介入。”确实如此，他们完全正确。我们知道需要在设计方面更进一步。但对于每两个批评我们“空谈”的人，实际上都有人发送模型，思考如何改进它。我们已经吸引了四到五位设计师，他们对系统的不同方面进行了真正的、专业的工作，因此我们现在正在努力更深入地融入社区并定义工作流程。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_12_0.png)


    ### 志愿者与全职人员


    塞巴斯蒂安解释了拥有全职工作人员的必要性：


    > “有很多事情你实际上无法作为志愿者完成；你可能只有两个小时：它们需要结构性工作，需要有人每天坐下来查看问题，修复运行系统。我们的代码每天都在构建和测试——现在我们每周创建两到三个新镜像，因此我们总是可以测试最新版本。我知道，如果我拉取新代码，那么明天早上它就可以在下一个可修复的镜像中。我们真的希望将开发、反馈和测试的周期缩短，真的非常短。”


    核心团队有多少人？与其他一些 KDE 旗下的项目相比，这个团队规模相当小吗？


    实际上，它并不那么小。我的雇主 Blue Systems 正在对此进行投资，因此与大多数其他项目不同，我们拥有一个相当强大的开发团队，不仅体现在人员数量上，还体现在人们能投入的时间上。例如，我几乎全职投入这个项目，还有大约十到十二名其他人也是，这对于启动项目并填补基本功能来说真的是必不可少的。


    这是一个完全新的独立项目，还是之前与 Plasma Active 项目有过很多互动？


    Plasma Active 是我和其他几个人的心血。因此在某种程度上，Plasma Mobile 是 Plasma Active 项目的延续，但目标略有不同。这一次，我们更加脚踏实地。我们不再那么专注于新颖的用户体验，而是试图让大量不同的应用程序运行起来，我认为这更现实一些，至少是为了填补基本功能。我们还不知道最终在设计和工作流程上会走到哪里，因为这是一个开放的过程——对参与开放，并且非常自然地，结局也是开放的。但我想，现在背后有更多的人力，KDE
    社区内也有更强烈的紧迫感，不仅要做桌面端的事，最终也要成为一个为那些希望他们的应用程序也能在移动设备上运行的人服务的项目。这不是关于 UI 范式或创造下一个大势所趋——我们想先做一份赖以生存的工作（bread-and-butter
    thing，意为常规/基础功能）。


    Plasma Mobile 确实有一些独特的方面——例如，用单一、无限滚动的页面取代了在多个主屏幕间滑动的概念，并整合了 Plasma 小组件（Plasmtoids）。


    这其实很有趣，因为通过复用我们在桌面上已有的基础设施——在主题、Plasmtoids 方面——我们可以相当快速地推出酷炫的功能。例如，我认为主题切换设置应用程序只花了大约两到三个小时的工作量。有时事情会复杂一些，但我们实际上拥有许多非常复杂的应用程序，它们已经进行了数年的
    bug 修复，非常成熟且稳定。通过仅仅在它们上面放置不同的 UI，我们将能够让它们在手机/移动设备上运行。


    对于接下来的开发，你有路线图吗？


    我们希望明年夏天有一个可供终端用户忍受的版本。一个没有真正阻碍性问题的版本，可以用来打电话，我也可以把它作为日常驱动程序使用而不会因缺乏质量而发疯。上周，我们与用户体验人员坐在一起说，“在我们开始任何……


    ![](img/e7f197876caa0b235fb5da2d16a578ea_13_0.png)

    ![](img/e7f197876caa0b235fb5da2d16a578ea_13_1.png)

    ![](img/e7f197876caa0b235fb5da2d16a578ea_13_2.png)


    - 左：通知位于界面顶部，向下滚动即可看到应用

    - 中：电话应用功能完备，并与联系人完美集成

    - 右：强大的 KRunner 启动器也被移植到了 Plasma Mobile 上


