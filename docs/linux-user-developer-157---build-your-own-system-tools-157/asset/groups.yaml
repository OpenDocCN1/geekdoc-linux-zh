    ## Bodhi Linux 3.1.0


    Bodhi 最大的变化在于其全新的外观，这得益于 Mokoša 桌面环境，但其底层运作方式与之前保持一致


    ### 发行版


    Jeff Hoogland 推出的全新 Mokoša 桌面环境首次亮相，Bodhi 摒弃了 Enlightenment，转而采用这个新分支


    ![](img/e7f197876caa0b235fb5da2d16a578ea_87_1.png)


    -   CPU 500 MHz

    -   RAM 128 MB

    -   存储 4 GB


    基于 Ubuntu LTS 版本的 Bodhi Linux 是一个高度基于工作流的发行版，其核心原则有两个：极简主义和可配置性。我们经常讨论发行版的“极简”，但
    Bodhi 践行了这一概念，并为旧硬件和低配置机器提供了卓越的支持。此外，预装的应用程序套件非常精简，Bodhi 仅提供 ePad 文本编辑器、PCManFM、Terminology、Mldori
    和 ePhoto。Bodhi 认为用户足够聪明，能够自行选择应用程序——我们倾向于同意这一点——这意味着基础应用的总大小仅占整个镜像的 10MB。不过，它提供了一系列系统工具，赋予你定制系统的强大能力。用户选择权很大程度上取决于桌面环境。在这个新版本中，Bodhi
    Linux 的创造者 Jeff Hoogland 引入了全新的 Mokoša 桌面环境，它分叉自较旧的 Enlightenment 桌面 E17 版本。Jeff
    对 Enlightenment 的开发工作感到不满，完全跳过了 E18，因为许多优化破坏了 E17 的关键功能，而 E19 则相当臃肿，且在以前运行 Bodhi/Enlightenment
    表现良好的旧硬件上性能较差。这导致 Jeff 发布了 Bodhi Linux 3.0.0 的 Legacy 版本，该版本坚持使用 E17，与主线的 E19
    版本并存。作为结果，Jeff 与用户交流了他们的体验，并决定分叉稳定且更受欢迎的 E17 版本。作为 E17 的延续，Mokoša 包含了通常为 Bodhi
    版本对 Enlightenment 所做的所有补丁。在视觉上，它也很有特色，这得益于新的 Radiance 主题（可与 GTK 匹配），该主题与 Enlightenment
    标志性的 Dark 主题形成对比，使用了更柔和、更浅的灰色。未来，某些功能将从 E18 和 E19 向后移植——目标是实现一个更好、更稳定的 Enlightenment
    版本。许多现在从 Enlightenment 中移除的功能在 Moksha 中仍然存在，例如允许混合搭配不同主题的高级主题选项，以及可启用以增强功能的模块选择。重要的是，与
    E19 相比，其内存占用也显著降低。随着 Moksha 在未来版本中的改进，我们可以预期它将变成一个精炼得多的轻量版 Enlightenment。


    ![](img/e7f197876caa0b235fb5da2d16a578ea_88_0.png)


    上图：Moksha 桌面环境与 Enlightenment 一样易于定制，并保留了高级主题选项


    > Moksha 赋予你对桌面的绝对控制权，因此你可以调整你的设置，使其以精确的方式运行


    ### 优点

    -   Enlightenment 非常适合定制，Moksha 保留了这一功能，并为其提供了新的诠释


    ### 缺点

    -   新用户仍需在初始设置上投入大量时间才能获得最佳用户体验。强制使用 Enlightenment 的好处尚未得到证实。


    启动 Bodhi 3.1.0 后，首先迎接你的是由 Midori 启动的 QuickStart 文档，其中包含了你需要知道的一切，以便立即上手。Moksha
    基础知识页面向你介绍了 Moksha/Enlightenment 的独特概念，如搁架（shelves）、模块、小工具（gadgets）、可从屏幕任意位置访问的启动器菜单，它还列出了一些你必须学习的基本快捷键。这些快捷键通常与其他桌面标准不同，如果你刚接触
    Bodhi，可能会让你减速，但一旦形成肌肉记忆，你会发现 Moksha 非常有用。QuickStart 中还提供了关于 Ecomorph 的优秀指南，Ecomorph
    是一个模块，可为 Moksha 添加许多流行的 compiz 效果。正是这种功能，让 Bodhi 的可配置性开始真正闪耀。


    通过 Bodhi Linux 中众多的设置面板，你可以微调桌面上的绝对一切：操作窗口几何形状、缩放、边框和过渡效果，以及它们的进程管理；你可以加载模块以在你的搁架上添加小工具，然后根据需要放置和重新排序；你可以更改按键绑定，以及鼠标、屏幕边缘和
    ACPI 绑定。Moksha 赋予你对桌面的绝对控制权，因此你可以调整你的设置，使其以精确的方式运行。对于某些新用户来说，这可能会让人有点不知所措，特别是当各种选项和设置分散在不同的面板中时，但一旦你熟悉了方向，你就成功了。


    Gavin Thomas


    ### 总结

    Bodhi 的粉丝会喜欢编排良好的 Moksha 桌面环境以及现有工作流的保留。由于桌面环境已脱离 Enlightenment 开发工具，他们还将受益于增加的稳定性。新用户将发现一个功能强大且高度可配置的系统。


