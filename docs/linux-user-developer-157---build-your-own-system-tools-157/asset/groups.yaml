    # # Pi & power


    The Pi, even the new version 2, is not renowned for its blistering speed. So how
    come it can handle streaming and display high-definition content with ease, whereas
    it might struggle to run a modern version of Chrome and WebGL2? Every Raspberry
    Pi has a hardware H.264 decoder built-in. This specialised chip does one thing
    really well, really quickly: it plays H.264 video super-fast. That’s the ace up
    the Pi’s sleeve that makes it one of the cheapest and best options for home-made
    media centres like this.


    **07  Add our drive to OSMC**

    Right, time to leave your Linux box alone – let’s do some Linux! Hop on over to
    your OSMC system. If you’re one of the lucky people with the super-cool OSMO remote,
    you can do every thing you need to do with it, but there’s quite a bit of typing
    ahead, so if you have a keyboard lying around then now is the time to plug it
    in. Power up your system and go to Videos>Files>Add Videos. You’ll be presented
    with a view like the picture above. Enter the address we jotted down in the previous
    step – in our case it would be smb://192.168.1.5/MEDIADRIVE – and hit Done.


    **08  Appease the password gods**

    Depending on your setup, you may or may not be asked to enter a username and password.
    If you do, you’ll be prompted as soon as you’ve entered the path to your media
    drive – but what is it? That’s simple: it’s just your ordinary username and password
    for accessing your system. Once you’ve entered those, tick the ‘Remember this
    path’ box and OSMC will keep a track of the drive and its content as long as it’s
    available on the network.


    **09  Test the setup**

    On the video screen you should now see your shared network drive, which looks
    just like any other folder. Now that the drive has been mapped, it will reflect
    any and all changes,


    structures and files that you apply to your network drive. Select a video to see
    if it plays. If it does, congratulations! You’ve now got a networked Samba drive
    to deliver all of your media.


    **10  Media types and the Raspberry Pi**

    You may have noticed, just before you tested your video, a bunch of small black
    boxes with icons and numbers inside them, just to the left of the media selector
    UI. These display the properties of video files that OSMC is familiar and comfortable
    with. Don’t worry, if you have videos in a slightly unconventional format (Matroska
    or WebM, for example) OSMC has a ton of goodies built-in to handle things it’s
    unsure of – it might just take a little while for it to figure it out.


    **11  Add extra media from elsewhere**

    So, we now have OSMC reading media files from our Samba-serving PC. But what if
    we want to add more media? Well, OSMC is geared towards watching your media rather
    than managing it. We could unplug the media drive from our Samba server, plug
    it into another computer with the media file we want and then plug it back in
    to our samba server. Samba can handle plugging drives in and out, but that’s cumbersome.
    Alternatively, we could log in to our Samba server and move files over to it with
    SCP or FTP, but that’s not very user-friendly. What if we could drag media files
    over the network onto our drive so that we could view them on OSMC?'
