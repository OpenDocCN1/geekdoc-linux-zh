    # 03 **The dashboard**


    Once registered and logged in, visit the dashboard page, which will display your
    AccountSid and your Auth Token. These are both required to use the Twilio REST.
    Keep these secure and private, but be sure to make a note of them as you will
    need them for your Python program later.


    # 04 **Install the software**


    Boot up your Raspberry Pi and connect it to the Internet. Before you install the
    Twilio software, it is worth updating and upgrading your Pi. In the LX Terminal,
    type `sudo apt-get update`, then `sudo apt-get upgrade`. Once complete, type `sudo
    easy_install twilio` or `sudo pip install twilio` to install the software. (If
    you need to install pip, type `sudo apt-get install python-pip` python-dev, press
    Enter, then type `sudo pip install -U pip`.)


