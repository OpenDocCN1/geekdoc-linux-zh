    # RUNNING WINDOWS APPS WITH WINE


    Wine gets stubborn Windows-only apps running comfortably on Linux – so no more
    need to dual boot!


    As your day-to-day computer use – from games, through office and collaboration
    apps, to social media – moves to the web browser, relying on cross-platform, free
    and open source technologies, there’s a fairly level playing field between Linux
    and its proprietary rivals, most particularly Microsoft Windows.

    Before free software advocates rejoice too much, there remains one road block
    for many users looking to transition away from the spyware-ridden recent versions
    of Windows: a stubborn collection of legacy or proprietary software available
    only for Microsoft’s platform.

    Whether you’re an office user tied to macros written for MS Office, a worker dependant
    upon custom proprietary software for their day-to-day work, or a gamer who simply
    must have their


    fix, a serious move to Linux will only happen if you can happily run your critical
    software on your new favourite OS. Enter Wine.

    WINE stands for WINdows Emulator – or for Wine Is Not an Emulator; the ‘not’ version
    making it clear that Wine emulates no processor code, but instead replaces system
    calls to libraries and the Windows kernel with its own processes. The Wine team
    have done a fine job of keeping up with all of Windows’ changes and developments,
    with the winetricks program handling workarounds and tweaks for programs that
    won’t run on default settings.

    In this, we are complemented by PlayOnLinux, which makes installing Windows programs
    on versions of Wine easier, keeping them partitioned in different containers.'
  md: "\n## GO BEYOND C\n\nThere are many other programming languages for you to work\
    \ with, although none are as mature as C. There exist many programming languages\
    \ that can help you perform system tasks. All programming languages implement\
    \ their own functions by using C system calls because it is the only interface\
    \ for talking to the Linux kernel.\n\nThe example program that is going to be\
    \ implemented on all six programming languages is a minimalistic version of the\
    \ cp command line utility. The presented implementations in C++, Rust, Go, Perl\
    \ and Python are not the only ones enabled or offered by each programming language.\
    \ They are presented here in order to give you a quick sense of each programming\
    \ language.\n\n### C and C++\n\nWhen it comes to systems programming, C++ can\
    \ be almost identical to C. Their only difference is that in C++ you can organise\
    \ your code differently because C++ is an object-oriented programming language.\n\
    \nJust to the right, you can see both the C and C++ versions of the cp utility.\
    \ The C++ version uses an unorthodox approach and performs no error checking,\
    \ whereas the C code is, more or less, the standard way of writing the cp utility.\
    \ There exist other techniques that can be used for file copying, but the general\
    \ idea will be the same. The biggest advantage of the C approach is that if an\
    \ error occurs during the execution of the program, you will know exactly which\
    \ system call caused the error. Think about it a little: you will know the precise\
    \ line of the C code and the exact reason behind the problem! You cannot tell\
    \ the same from the C++ version of the program because it uses higher-level commands\
    \ that do many things using just one command.\n\nIt’s not strange that the C code\
    \ of the cp command is the longest of all presented code as the functions are\
    \ primitive.\n\n### Best language?\n\nYou may ask which is the best programming\
    \ language for Linux systems programming. The easy answer is C, because Linux\
    \ is written in C and C is more mature as a programming language than the alternatives.\n\
    \nThe main advantage of programming languages such as Perl and Python is the fact\
    \ that they can easily interact with other things like databases. Additionally,\
    \ they can implement a lot of functionality using just a few lines of code. However,\
    \ they hide too many low-level details from programmers and make the potential\
    \ to become the next big thing in systems programming. Another interesting language\
    \ that you might want to check, as soon as the necessary tools become available\
    \ on Linux, is Swift from Apple.\n\n```c\n#include <fcntl.h>\n#include <unistd.h>\n\
    #include <stdio.h>\n\nint myCP(char *file1, char *file2)\n{\n  FILE *rRead, *fWrite;\n\
    \  rRead = fopen(file1, \"r\");\n  fWrite = fopen(file2, \"w\");\n\n  if (rRead\
    \ == NULL) {\n    printf(\"Could not open %s\\n\", file1);\n    return -1;\n \
    \ }\n\n  if (fWrite == NULL) {\n    printf(\"Could not create %s\\n\", file2);\n\
    \    return -1;\n  }\n\n  size_t len;\n  unsigned char buffer[8192];\n  while\
    \ ( (len = fread(buffer, 1, sizeof buffer, rRead)) > 0 ) {\n    size_t written\
    \ = fwrite(buffer, 1, len, fWrite);\n    if (written != len)\n      printf(\"\
    There was an error: %zu <> %zu\\n\", written, len);\n  }\n  fclose(rRead);\n \
    \ fclose(fWrite);\n  return 0;\n}\n\nint main(int argc, char *argv[])\n{\n  if\
    \ (argc != 3) {\n    printf(\"Please provide the correct number of arguments!\\\
    n\");\n    exit(-1);\n  }\n  return myCP(argv[1], argv[2]);\n}\n```\n\n```cpp\n\
    #include <iostream>\n#include <fstream>\n\nint main(int argc, char *argv[])\n\
    {\n  std::ifstream src(argv[1], std::ios::binary);\n  std::ofstream dst(argv[2],\
    \ std::ios::binary);\n\n  dst << src.rdbuf();\n}\n```\n\n### Kernel development\n\
    \nSince the Linux kernel is written in C, you might wonder how much of this applies\
    \ to kernel development. The good news is that system call handling and other\
    \ techniques discussed here will be reusable, although there are key differences\
    \ – a main() function isn’t required in kernel modules, for example, because kernel\
    \ programming is asynchronous. It’s worth dipping into the Foundation’s guide.\
