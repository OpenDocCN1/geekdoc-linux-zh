  - "[PAGE 35]\n\n# Tutorial\n\n# Manipulate and convert data in R\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_0.png)\n\
    \nMihalis Tsoukalos is a Unix administrator, a programmer for Linux and iOS, a\
    \ DBA and also a mathemataician. He has been using Linux since 1993\n\n# Resources\n\
    \n+   - R project  \n+   r-project.org\n+   - RStudio  \n+   bit.ly/tVLtmIgA\n\
    +   - Zoo package  \n+   bit.ly/0v0Whd\n+   - Chron package  \n+   bit.ly/1thCiq\n\
    \nRight This is the environment of RStudio, a powerful and useful IDE for R\n\n\
    Learn how to use R to easily and effectively manipulate various kinds of data\n\
    \nThe R software deals, processes and visualises data all the time – it is something\
    \ that can give value to your data. However, what is the point of visualising\
    \ data if you cannot transform, manipulate and change your data whenever you want,\
    \ any way you want?\n\nThis article will teach you many different ways to manipulate\
    \ and transform your stored data within R. This is very important because most\
    \ of the time the information you want is hidden somewhere and waiting for you\
    \ to find it. Additionally, when you have problems with data, it is often a matter\
    \ of data being in the wrong mode or class in relation to the task you are trying\
    \ to perform.\n\nThe first thing that you should remember is that the index of\
    \ the first element in R data types is one instead of zero.\n\nIf you would prefer\
    \ to use an IDE instead of the command line version of R then you can download\
    \ the open source version of RStudio from bit.ly/tVLtmIgA, but RStudio is not\
    \ necessarily required in order for you to follow this tutorial. Nevertheless,\
    \ you will still benefit from knowing how to install, run and quit R, as well\
    \ as how to type commands to its command line environment.\n\n# 01 The various\
    \ types of data in R\n\nR supports various types of data, and each type has unique\
    \ characteristics and properties. This part of the tutorial will introduce you\
    \ to the most important data types for handling groups of data. A list is a generic\
    \ vector containing other objects and a vector is a sequence of data elements\
    \ of the same basic type. A data frame is a list of vectors of equal length that\
    \ is primarily used for storing data tables. It is used a lot in R and is equivalent\
    \ to the concept of a table. An array is a multidimensional object. A matrix is\
    \ a two-dimensional array that contains numeric data; it has rows and columns.\n\
    \nThe model() function returns the mode of an object whereas the class() function\
    \ returns the class of an object. Both functions can be very useful when you do\
    \ not know the kind of R object you have.\n\n# 02 Import data in R\n\nUsually,\
    \ you do not write your data yourself; most of the time you will get your data\
    \ from external sources, including text files, databases and the Internet. The\
    \ reading\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_1.png)"
  - "[PAGE 36]\n\nof external data is made with the help of the **read.table()** function\
    \ that returns a data frame. If you want to read an external text file, you can\
    \ use the following command:\n\n```\n```R\n> myData <- read.table(\"./data.txt\"\
    , header=FALSE)\n```\n```\n\nIf you set the header parameter to TRUE, it is assumed\
    \ that the first line of your input will contain the names of the variable. Remember\
    \ that depending on the format of the external data, you should use the appropriate\
    \ data type to hold your data or transform it to the desired format.\n\n# **03\
    \ Create and use random data**\n\nBeing able to get and work with random numbers\
    \ is great for testing various methods and techniques. Therefore this step will\
    \ teach you ways to get random data in R. The following returns ten floating-point\
    \ numbers from 0 to 100:\n\n```\n```R\n> runif(10, min=0, max=100)\n```\n```\n\
    \nThe next variation returns ten integers between 0 and 100:\n\n```\n```R\n> floor(runif(10,\
    \ min=0, max=101))\n```\n```\n\nPlease note that the maximum number cannot be\
    \ returned, so putting 101 as the value of the **max** parameter ensures that\
    \ the integer number 100 can be returned.\n\nIn case you want to generate the\
    \ same sequence of random numbers again, you can use the **set.seed()** function\
    \ as follows:\n\n```\n```R\n> set.seed(123)\n> runif(10, min=0, max=100)\n```\n\
    ```\n\nAs you can see in the image, you must run **set.seed()** before executing\
    \ the **runif()** function.\n\n> “The first thing that you should remember is\
    \ that the index of the first element in R data types is one instead of zero”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_36_0.png)\n\nThere is a function called\
    \ **sample** that shuffles the contents of an existing vector into a random sequence\
    \ without changing the actual numeric values:\n\n```\n```R\n> a <- floor(runif(3,\
    \ min=0, max=100))\n> sample(a)\n[1] 57 89 10\n> sample(a)\n[1] 89 10 57\n```\n\
    ```\n\nIf you put a second argument to **sample**, you can specify the size of\
    \ the sample that is going to be returned.\n\n```\n```R\n> myData <- read.table(\"\
    ./data.txt\", header=FALSE)\n> system(\"cut ./data.txt\")\n10 a1 c1\n20 a2 c2\n\
    30 a3 c3\n40 a4 c4\n50 a5 c5\n> myData\n      V1 V2 V3\n1 10 a1 c1\n2 20 a2 c2\n\
    3 30 a3 c3\n4 40 a4 c4\n5 50 a5 c5\n> class(myData)\n[1] \"data.frame\"\n> mode(myData)\n\
    [1] \"list\"\n> ```\n```\n\nLeft Here’s the output from Step 2, where we read\
    \ our table for data"
  - "[PAGE 37]\n\n# # Tutorial\n\n# ## Extra R packages\n\nAlthough R is a very capable\
    \ package with a good programming language. Its true power comes from the numerous\
    \ R packages. Whenever you have a problem you want to solve, check if there exists\
    \ a package that can help you do your job. You can start from **cran.r-project.org**.\n\
    \n# ### 04 Deal with text and match\n\nAlthough most of the article will be about\
    \ manipulating numeric data and dates, this step will talk about text manipulation\
    \ in R and how to do things with text. The **as.numeric()** function converts\
    \ a character string to its numeric value. If there exist invalid characters,\
    \ you will get an error message. You can concatenate two strings as follows:\n\
    \n```\n```\n> paste(\"Linux User\", \"Developer\", sep=\" \")\n[1] \"Linux User\
    \ and Developer\"\n```\n```\n\nSimilarly, you can link the strings from two columns\
    \ of a matrix into a new column. If the matrix has TWO columns, then a new fourth\
    \ column will be created in the returned matrix. It is your job to store the new\
    \ matrix.\n\nR also supports pattern matching for text variables. So, should you\
    \ wish to get all columns that contain the text \"Error\", you should run the\
    \ following command that utilises the **grep()** function:\n\n```\n```\n> errorMessages\
    \ <- c(\"I/O Error\", \"Network Error\", \"Data not found\", \"TCP/IP not working\"\
    , \"Data Error\")\n> errorMessages[grep(\"Error\", errorMessages)]\n[1] \"I/O\
    \ Error\" \"Network Error\" \"Data Error\"\n```\n```\n\nAnother truly important\
    \ function is **match()**, which answers the question \"where can the values of\
    \ the second vector be found in the first vector?\" The **match()** function can\
    \ be better understood with an example:\n\n```\n```\n> firstV <- c(1, 2, 4, 5,\
    \ 9, -1, 0, 4, 5)\n> secondV <- c(0, 1, 2, 0, -1, 9)\n> match(firstV, secondV)\n\
    [1] 2 3 NA NA 6 5 1 NA NA\n```\n```\n\n**Match()** returns a vector of subscripts\
    \ that belong to the second vector and has as many elements as the first vector.\
    \ If an element of the first vector cannot be found in the second vector, then\
    \ NA appears in its place. Otherwise, the index of the first occurrence of an\
    \ element is returned instead of NA.\n\n# ### 05 Deal with dates\n\nDates and\
    \ times are special kinds of data and therefore need special treatment. It is\
    \ advisable not to store dates and times as plain text because it is difficult\
    \ to manipulate. However, occasionally you will need to convert a date or time\
    \ stored as a string into a more appropriate format.\n\nR offers the built-in\
    \ Date, POSIXt and POSIXct classes for storing dates and times, as well as the\
    \ zoo and chron packages. This article will only deal with the built-in types.\n\
    \nThe general principle is that if you are using a nonstandard format, you will\
    \ have to specify it. Moreover, R enables you to do calculations with dates, which\
    \ is very practical.\n\nPOSIXct (fct: Calendar Time) is the best class when you\
    \ store times in your data; this class also lets you specify the timezone of a\
    \ date. The POSIXt (fct: Local Time) class enables you to easily extract specific\
    \ components of a time. It is important to remember that POSIXct objects are lists.\
    \ If you only have dates then use the Date class, use **help(DateFormatClasses)**\
    \ to get more information about date and time classes.\n\n# ### 06 More about\
    \ states and times\n\nThe **strptime()** function enables you to convert a factor\
    \ or a string into a date -- the user must provide a format statement in double\
    \ quotes to inform R about the structure of the input. A factor is of mode numeric\
    \ and class factor.\n\nThe **difftime()** function can also help you find the\
    \ difference between two dates.\n\nIt is very important to use the correct code\
    \ when parsing dates and times in R: `%e` is for four-digit years whereas `%y`\
    \ is for two-digit years. Use `%d` to declare the day of the month and `%m` for\
    \ declaring the month as a decimal number. Use `%B` as the code for the full name\
    \ of a month and `%b` for the abbreviated name of a month.\n\nIt is necessary\
    \ to try things using small samples before working with real data, especially\
    \ with dates and times where it is easy to make small typos that can create big\
    \ errors.\n\n# ### 07 Data tasks\n\nThis part will show you how to do some simple\
    \ things with data. Suppose that you have a data frame named **aDataFrame**. If\
    \ you want to get a single element from the data frame, you should run the following\
    \ command:\n\n```\n```\n> aDataFrame[4,3]\n```\n```\n\nThe previous command will\
    \ get you the element from row four and column three. Similarly, you can get its\
    \ first column as follows:\n\n```\n```\n> aDataFrame[,1]\n```\n```\n\nShould you\
    \ wish to get its second row, you should execute the following command:\n\n```\n\
    ```\n> aDataFrame[2,]\n```\n```\n\nTo get the first three rows of a data frame,\
    \ you can use the next notation below. This can also be applied for getting the\
    \ first three columns:\n\n```\n```\n> aDataFrame[1:3,]\n```\n```\n\n# ### 08 Advanced\
    \ data tasks\n\nThe following command will define a data frame with three columns:\n\
    \n```\n```\n> myDataFrame <- data.frame(v1=c(1,2,3,4,5),\n    v2=c(0,1,2,3,4),\
    \ v3=c(-1,-2,-3,-4,-5))\n```\n```\n\nThe following command will add the same number\
    \ to all data frame elements:\n\n```\n```\n> myDataFrame <- + 5\n```\n```\n\n\
    As the columns in myDataFrame have names, the following two commands will both\
    \ subtract the number five from the first column of the data frame:\n\n```\n```\n\
    > myDataFrame[, 1] - 5\n[1] -4 -3 -2 -1 0\n```\n```"
  md: "\n# Tutorial\n\n# Manipulate and convert data in R\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_0.png)\n\
    \nMihalis Tsoukalos is a Unix administrator, a programmer for Linux and iOS, a\
    \ DBA and also a mathematician. He has been using Linux since 1993.\n\n# Resources\n\
    \n- R project\n  r-project.org\n- RStudio\n  bit.ly/tVLtmIgA\n- Zoo package\n\
    \  bit.ly/0v0Whd\n- Chron package\n  bit.ly/1thCiq\n\nRight This is the environment\
    \ of RStudio, a powerful and useful IDE for R.\n\nLearn how to use R to easily\
    \ and effectively manipulate various kinds of data.\n\nThe R software deals, processes\
    \ and visualises data all the time – it is something that can give value to your\
    \ data. However, what is the point of visualising data if you cannot transform,\
    \ manipulate and change your data whenever you want, any way you want?\n\nThis\
    \ article will teach you many different ways to manipulate and transform your\
    \ stored data within R. This is very important because most of the time the information\
    \ you want is hidden somewhere and waiting for you to find it. Additionally, when\
    \ you have problems with data, it is often a matter of data being in the wrong\
    \ mode or class in relation to the task you are trying to perform.\n\nThe first\
    \ thing that you should remember is that the index of the first element in R data\
    \ types is one instead of zero.\n\nIf you would prefer to use an IDE instead of\
    \ the command line version of R then you can download the open source version\
    \ of RStudio from bit.ly/tVLtmIgA, but RStudio is not necessarily required in\
    \ order for you to follow this tutorial. Nevertheless, you will still benefit\
    \ from knowing how to install, run and quit R, as well as how to type commands\
    \ to its command line environment.\n\n## 01 The various types of data in R\n\n\
    R supports various types of data, and each type has unique characteristics and\
    \ properties. This part of the tutorial will introduce you to the most important\
    \ data types for handling groups of data. A list is a generic vector containing\
    \ other objects and a vector is a sequence of data elements of the same basic\
    \ type. A data frame is a list of vectors of equal length that is primarily used\
    \ for storing data tables. It is used a lot in R and is equivalent to the concept\
    \ of a table. An array is a multidimensional object. A matrix is a two-dimensional\
    \ array that contains numeric data; it has rows and columns.\n\nThe mode() function\
    \ returns the mode of an object whereas the class() function returns the class\
    \ of an object. Both functions can be very useful when you do not know the kind\
    \ of R object you have.\n\n## 02 Import data in R\n\nUsually, you do not write\
    \ your data yourself; most of the time you will get your data from external sources,\
    \ including text files, databases and the Internet. The reading of external data\
    \ is made with the help of the **read.table()** function that returns a data frame.\
    \ If you want to read an external text file, you can use the following command:\n\
    \n```R\n> myData <- read.table(\"./data.txt\", header=FALSE)\n```\n\nIf you set\
    \ the header parameter to TRUE, it is assumed that the first line of your input\
    \ will contain the names of the variables. Remember that depending on the format\
    \ of the external data, you should use the appropriate data type to hold your\
    \ data or transform it to the desired format.\n\n## 03 Create and use random data\n\
    \nBeing able to get and work with random numbers is great for testing various\
    \ methods and techniques. Therefore this step will teach you ways to get random\
    \ data in R. The following returns ten floating-point numbers from 0 to 100:\n\
    \n```R\n> runif(10, min=0, max=100)\n```\n\nThe next variation returns ten integers\
    \ between 0 and 100:\n\n```R\n> floor(runif(10, min=0, max=101))\n```\n\nPlease\
    \ note that the maximum number cannot be returned, so putting 101 as the value\
    \ of the **max** parameter ensures that the integer number 100 can be returned.\n\
    \nIn case you want to generate the same sequence of random numbers again, you\
    \ can use the **set.seed()** function as follows:\n\n```R\n> set.seed(123)\n>\
    \ runif(10, min=0, max=100)\n```\n\nAs you can see in the image, you must run\
    \ **set.seed()** before executing the **runif()** function.\n\n> “The first thing\
    \ that you should remember is that the index of the first element in R data types\
    \ is one instead of zero”\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_36_0.png)\n\
    \nThere is a function called **sample** that shuffles the contents of an existing\
    \ vector into a random sequence without changing the actual numeric values:\n\n\
    ```R\n> a <- floor(runif(3, min=0, max=100))\n> sample(a)\n[1] 57 89 10\n> sample(a)\n\
    [1] 89 10 57\n```\n\nIf you put a second argument to **sample**, you can specify\
    \ the size of the sample that is going to be returned.\n\nLeft Here’s the output\
    \ from Step 2, where we read our table for data.\n\n```R\n> myData <- read.table(\"\
    ./data.txt\", header=FALSE)\n> system(\"cut ./data.txt\")\n10 a1 c1\n20 a2 c2\n\
    30 a3 c3\n40 a4 c4\n50 a5 c5\n> myData\n      V1 V2 V3\n1 10 a1 c1\n2 20 a2 c2\n\
    3 30 a3 c3\n4 40 a4 c4\n5 50 a5 c5\n> class(myData)\n[1] \"data.frame\"\n> mode(myData)\n\
    [1] \"list\"\n```\n\n## Extra R packages\n\nAlthough R is a very capable package\
    \ with a good programming language, its true power comes from the numerous R packages.\
    \ Whenever you have a problem you want to solve, check if there exists a package\
    \ that can help you do your job. You can start from **cran.r-project.org**.\n\n\
    ## 04 Deal with text and match\n\nAlthough most of the article will be about manipulating\
    \ numeric data and dates, this step will talk about text manipulation in R and\
    \ how to do things with text. The **as.numeric()** function converts a character\
    \ string to its numeric value. If there exist invalid characters, you will get\
    \ an error message. You can concatenate two strings as follows:\n\n```R\n> paste(\"\
    Linux User\", \"Developer\", sep=\" \")\n[1] \"Linux User Developer\"\n```\n\n\
    Similarly, you can link the strings from two columns of a matrix into a new column.\
    \ If the matrix has two columns, then a new third column will be created in the\
    \ returned matrix. It is your job to store the new matrix.\n\nR also supports\
    \ pattern matching for text variables. So, should you wish to get all columns\
    \ that contain the text \"Error\", you should run the following command that utilises\
    \ the **grep()** function:\n\n```R\n> errorMessages <- c(\"I/O Error\", \"Network\
    \ Error\", \"Data not found\", \"TCP/IP not working\", \"Data Error\")\n> errorMessages[grep(\"\
    Error\", errorMessages)]\n[1] \"I/O Error\" \"Network Error\" \"Data Error\"\n\
    ```\n\nAnother truly important function is **match()**, which answers the question\
    \ \"where can the values of the second vector be found in the first vector?\"\
    \ The **match()** function can be better understood with an example:\n\n```R\n\
    > firstV <- c(1, 2, 4, 5, 9, -1, 0, 4, 5)\n> secondV <- c(0, 1, 2, 0, -1, 9)\n\
    > match(firstV, secondV)\n[1] 2 3 NA NA 6 5 1 NA NA\n```\n\n**match()** returns\
    \ a vector of subscripts that belong to the second vector and has as many elements\
    \ as the first vector. If an element of the first vector cannot be found in the\
    \ second vector, then NA appears in its place. Otherwise, the index of the first\
    \ occurrence of an element is returned instead of NA.\n\n## 05 Deal with dates\n\
    \nDates and times are special kinds of data and therefore need special treatment.\
    \ It is advisable not to store dates and times as plain text because it is difficult\
    \ to manipulate. However, occasionally you will need to convert a date or time\
    \ stored as a string into a more appropriate format.\n\nR offers the built-in\
    \ Date, POSIXt and POSIXct classes for storing dates and times, as well as the\
    \ zoo and chron packages. This article will only deal with the built-in types.\n\
    \nThe general principle is that if you are using a nonstandard format, you will\
    \ have to specify it. Moreover, R enables you to do calculations with dates, which\
    \ is very practical.\n\nPOSIXct (fct: Calendar Time) is the best class when you\
    \ store times in your data; this class also lets you specify the timezone of a\
    \ date. The POSIXt (fct: Local Time) class enables you to easily extract specific\
    \ components of a time. It is important to remember that POSIXct objects are lists.\
    \ If you only have dates then use the Date class, use **help(DateFormatClasses)**\
    \ to get more information about date and time classes.\n\n## 06 More about dates\
    \ and times\n\nThe **strptime()** function enables you to convert a factor or\
    \ a string into a date -- the user must provide a format statement in double quotes\
    \ to inform R about the structure of the input. A factor is of mode numeric and\
    \ class factor.\n\nThe **difftime()** function can also help you find the difference\
    \ between two dates.\n\nIt is very important to use the correct code when parsing\
    \ dates and times in R: `%e` is for four-digit years whereas `%y` is for two-digit\
    \ years. Use `%d` to declare the day of the month and `%m` for declaring the month\
    \ as a decimal number. Use `%B` as the code for the full name of a month and `%b`\
    \ for the abbreviated name of a month.\n\nIt is necessary to try things using\
    \ small samples before working with real data, especially with dates and times\
    \ where it is easy to make small typos that can create big errors.\n\n## 07 Data\
    \ tasks\n\nThis part will show you how to do some simple things with data. Suppose\
    \ that you have a data frame named **aDataFrame**. If you want to get a single\
    \ element from the data frame, you should run the following command:\n\n```R\n\
    > aDataFrame[4,3]\n```\n\nThe previous command will get you the element from row\
    \ four and column three. Similarly, you can get its first column as follows:\n\
    \n```R\n> aDataFrame[,1]\n```\n\nShould you wish to get its second row, you should\
    \ execute the following command:\n\n```R\n> aDataFrame[2,]\n```\n\nTo get the\
    \ first three rows of a data frame, you can use the next notation below. This\
    \ can also be applied for getting the first three columns:\n\n```R\n> aDataFrame[1:3,]\n\
    ```\n\n## 08 Advanced data tasks\n\nThe following command will define a data frame\
    \ with three columns:\n\n```R\n> myDataFrame <- data.frame(v1=c(1,2,3,4,5),\n\
    \    v2=c(0,1,2,3,4), v3=c(-1,-2,-3,-4,-5))\n```\n\nThe following command will\
    \ add the number 5 to all data frame elements:\n\n```R\n> myDataFrame <- myDataFrame\
    \ + 5\n```\n\nAs the columns in myDataFrame have names, the following two commands\
    \ will both subtract the number five from the first column of the data frame:\n\
    \n```R\n> myDataFrame[, 1] <- myDataFrame[, 1] - 5\n> myDataFrame[, 1]\n[1] -4\
    \ -3 -2 -1 0\n```\n"
  mdcn: "\n\n# 教程\n\n# 在 R 中操作和转换数据\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_35_0.png)\n\
    \nMihalis Tsoukalos 是一位 Unix 系统管理员，Linux 和 iOS 程序员，数据库管理员（DBA），也是一位数学家。自 1993\
    \ 年以来，他一直在使用 Linux。\n\n# 资源\n\n- R 项目\n  r-project.org\n- RStudio\n  bit.ly/tVLtmIgA\n\
    - Zoo 包\n  bit.ly/0v0Whd\n- Chron 包\n  bit.ly/1thCiq\n\n右 这是 RStudio 的环境，它是一个强大且实用的\
    \ R 集成开发环境（IDE）。\n\n学习如何使用 R 轻松高效地操作各种类型的数据。\n\nR 软件一直在处理、处理和可视化数据——它是能为你的数据赋予价值的东西。但是，如果你不能随心所欲地随时以任何你想要的方式转换、操作和修改你的数据，那么可视化数据又有什么意义呢？\n\
    \n本文将教你许多在 R 中操作和转换存储数据的不同方法。这非常重要，因为大多数时候，你想要的信息都隐藏在某个地方，等待你去发现它。此外，当你的数据出现问题时，通常是因为数据相对于你试图执行的任务处于错误的模式或类别中。\n\
    \n你应该记住的第一件事是，R 数据类型中第一个元素的索引是 1 而不是 0。\n\n如果你更喜欢使用 IDE 而不是 R 的命令行版本，你可以从 bit.ly/tVLtmIgA\
    \ 下载 RStudio 的开源版本，但跟随本教程并不一定需要 RStudio。不过，了解如何安装、运行和退出 R，以及如何向其命令行环境输入命令，仍然会让你受益匪浅。\n\
    \n## 01 R 中的各种数据类型\n\nR 支持各种类型的数据，每种类型都有独特的特征和属性。本教程的这一部分将向你介绍处理数据组时最重要的数据类型。列表（list）是包含其他对象的通用向量，向量（vector）是相同基本类型的数据元素的序列。数据框（data\
    \ frame）是一组等长向量的列表，主要用于存储数据表。它在 R 中应用广泛，等价于表格的概念。数组（array）是一个多维对象。矩阵（matrix）是包含数字数据的二维数组；它有行和列。\n\
    \n`mode()` 函数返回对象的模式，而 `class()` 函数返回对象的类。当你不知道拥有的 R 对象类型时，这两个函数都非常有用。\n\n## 02\
    \ 在 R 中导入数据\n\n通常，你自己不会编写数据；大多数时候，你会从外部来源获取数据，包括文本文件、数据库和互联网。读取外部数据是使用 **read.table()**\
    \ 函数完成的，该函数返回一个数据框。如果你想读取外部文本文件，可以使用以下命令：\n\n```R\n> myData <- read.table(\"./data.txt\"\
    , header=FALSE)\n```\n\n如果你将 header 参数设置为 TRUE，则假定输入的第一行包含变量的名称。请记住，根据外部数据的格式，你应该使用合适的数据类型来存储数据或将其转换为所需的格式。\n\
    \n## 03 创建和使用随机数据\n\n能够获取和操作随机数字对于测试各种方法和技巧是非常棒的。因此，这一步将教你在 R 中获取随机数据的方法。以下命令返回\
    \ 0 到 100 之间的 10 个浮点数：\n\n```R\n> runif(10, min=0, max=100)\n```\n\n下一个变体返回 0\
    \ 到 100 之间的 10 个整数：\n\n```R\n> floor(runif(10, min=0, max=101))\n```\n\n请注意，最大数值本身不能被返回，因此将\
    \ **max** 参数的值设为 101 可确保整数 100 可以被返回。\n\n如果你想再次生成相同的随机数序列，可以如下使用 **set.seed()**\
    \ 函数：\n\n```R\n> set.seed(123)\n> runif(10, min=0, max=100)\n```\n\n正如你在图片中看到的，在执行\
    \ **runif()** 函数之前必须运行 **set.seed()**。\n\n> “你应该记住的第一件事是，R 数据类型中第一个元素的索引是 1 而不是\
    \ 0”\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_36_0.png)\n\n有一个名为 **sample**\
    \ 的函数，可以将现有向量的内容洗牌为随机序列，而不改变实际的数值：\n\n```R\n> a <- floor(runif(3, min=0, max=100))\n\
    > sample(a)\n[1] 57 89 10\n> sample(a)\n[1] 89 10 57\n```\n\n如果你向 **sample** 传入第二个参数，你可以指定要返回的样本大小。\n\
    \n左 这是步骤 2 的输出，其中我们读取了数据表。\n\n```R\n> myData <- read.table(\"./data.txt\", header=FALSE)\n\
    > system(\"cut ./data.txt\")\n10 a1 c1\n20 a2 c2\n30 a3 c3\n40 a4 c4\n50 a5 c5\n\
    > myData\n      V1 V2 V3\n1 10 a1 c1\n2 20 a2 c2\n3 30 a3 c3\n4 40 a4 c4\n5 50\
    \ a5 c5\n> class(myData)\n[1] \"data.frame\"\n> mode(myData)\n[1] \"list\"\n```\n\
    \n## 额外的 R 包\n\n虽然 R 是一个功能强大的包，拥有良好的编程语言，但其真正的威力来自于众多的 R 包。每当你想解决一个问题时，请检查是否存在可以帮助你完成工作的包。你可以从\
    \ **cran.r-project.org** 开始寻找。\n\n## 04 处理文本和匹配\n\n尽管本文的大部分内容将涉及数值和日期数据的操作，但这一步将讨论\
    \ R 中的文本操作以及如何对文本进行处理。**as.numeric()** 函数将字符串转换为其数值。如果存在无效字符，你将收到一条错误消息。你可以如下拼接两个字符串：\n\
    \n```R\n> paste(\"Linux User\", \"Developer\", sep=\" \")\n[1] \"Linux User Developer\"\
    \n```\n\n类似地，你可以将矩阵中两列的字符串链接成一个新列。如果矩阵有两列，则在返回的矩阵中会创建一个新的第三列。存储新矩阵是你的工作。\n\nR\
    \ 还支持文本变量的模式匹配。因此，如果你想获取包含文本 \"Error\" 的所有列，你应该运行以下利用 **grep()** 函数的命令：\n\n```R\n\
    > errorMessages <- c(\"I/O Error\", \"Network Error\", \"Data not found\", \"\
    TCP/IP not working\", \"Data Error\")\n> errorMessages[grep(\"Error\", errorMessages)]\n\
    [1] \"I/O Error\" \"Network Error\" \"Data Error\"\n```\n\n另一个真正重要的函数是 **match()**，它回答的问题是“第二个向量的值可以在第一个向量的哪里找到？”\
    \ 通过示例可以更好地理解 **match()** 函数：\n\n```R\n> firstV <- c(1, 2, 4, 5, 9, -1, 0, 4,\
    \ 5)\n> secondV <- c(0, 1, 2, 0, -1, 9)\n> match(firstV, secondV)\n[1] 2 3 NA\
    \ NA 6 5 1 NA NA\n```\n\n**match()** 返回一个属于第二个向量的下标向量，其元素数量与第一个向量相同。如果第一个向量的某个元素在第二个向量中找不到，则其位置会出现\
    \ NA。否则，将返回该元素首次出现的索引，而不是 NA。\n\n## 05 处理日期\n\n日期和时间是特殊类型的数据，因此需要特殊处理。建议不要将日期和时间存储为纯文本，因为这样难以操作。然而，偶尔你需要将存储为字符串的日期或时间转换为更合适的格式。\n\
    \nR 提供内置的 Date、POSIXt 和 POSIXct 类来存储日期和时间，以及 zoo 和 chron 包。本文只涉及内置类型。\n\n一般原则是，如果你使用的是非标准格式，你就必须指定它。此外，R\
    \ 允许你对日期进行计算，这非常实用。\n\nPOSIXct（缩写：Calendar Time）是存储数据中时间的最佳类；该类还允许你指定日期的时区。POSIXt（缩写：Local\
    \ Time）类允许你轻松提取时间的特定组件。记住 POSIXct 对象是列表这一点很重要。如果你只有日期，请使用 Date 类，使用 **help(DateFormatClasses)**\
    \ 获取有关日期和时间类的更多信息。\n\n## 06 更多关于日期和时间\n\n**strptime()** 函数允许你将因子（factor）或字符串转换为日期——用户必须提供用双引号括起来的格式语句，以告知\
    \ R 输入的结构。因子（factor）的模式是数值型，类是 factor。\n\n**difftime()** 函数也可以帮助你计算两个日期之间的差异。\n\
    \n在 R 中解析日期和时间时使用正确的代码非常重要：`%e` 用于四位年份，而 `%y` 用于两位年份。使用 `%d` 声明月中的日期，使用 `%m` 以十进制数字声明月份。使用\
    \ `%B` 作为月份全名的代码，使用 `%b` 作为月份缩写名的代码。\n\n在处理真实数据之前，有必要使用小样本进行测试，特别是对于日期和时间，因为很容易犯小错误从而导致大错误。\n\
    \n## 07 数据任务\n\n这部分将向你展示如何对数据做一些简单的事情。假设你有一个名为 **aDataFrame** 的数据框。如果你想从数据框中获取单个元素，应该运行以下命令：\n\
    \n```R\n> aDataFrame[4,3]\n```\n\n上一条命令将获取第四行第三列的元素。类似地，你可以如下获取其第一列：\n\n```R\n\
    > aDataFrame[,1]\n```\n\n如果你想获取其第二行，应该执行以下命令：\n\n```R\n> aDataFrame[2,]\n```\n\
    \n要获取数据框的前三行，可以使用下面的标记。这也同样适用于获取前三列：\n\n```R\n> aDataFrame[1:3,]\n```\n\n## 08\
    \ 高级数据任务\n\n以下命令将定义一个包含三列的数据框：\n\n```R\n> myDataFrame <- data.frame(v1=c(1,2,3,4,5),\n\
    \    v2=c(0,1,2,3,4), v3=c(-1,-2,-3,-4,-5))\n```\n\n以下命令将数字 5 加到数据框的所有元素上：\n\n\
