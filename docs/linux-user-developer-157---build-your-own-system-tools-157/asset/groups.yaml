    # 09 **Other API and codes**


    Twilio provides a wide range of API codes and reference documents to create other
    communication programs, such as making phone calls, recording a call, and retrieving
    data including caller IDs and call duration. The API also complements a wide range
    of languages, including Ruby, PHP, Java and Node.js (twilio.com/api/).


