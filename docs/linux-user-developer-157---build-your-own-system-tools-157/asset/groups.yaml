  mdcn: "\n## 评测\n\n### GTD 软件\n\n#### 简述：对比我们的结论\n\n| | Todo.txt | Freelance GTD+\
    \ | mGSD | Org-mode |\n|---|---|---|---|---|\n| **安装** | 初学者会被文档与实际之间的不一致弄晕<br>5\
    \ | 安装效率高。版本不匹配以及在特定平台上安装 Java 可能会让一些人头疼<br>8 | 使用 TiddlyFox 即可轻松安装。mGSD（以及同系软件）在浏览器中运行<br>9\
    \ | 作为 Emacs 一部分的 org-mode 已经非常成熟，无需担心安装问题<br>7 |\n| **界面** | 简单明了，可以立即上手，并在过程中学习高级用法<br>8\
    \ | 易于学习，足够简单，GUI 辅以键盘快捷键<br>8 | 非常全面但不会让人望而却步——最容易上手的工具<br>8 | 它没有你想象的那么吓人，虽然菜单很多，但仍有很多东西需要学习<br>6\
    \ |\n| **管理列表** | 项目、优先级和上下文有助于及时挑选任务<br>7 | Freelance GTD+ 的列表处理缺乏基于文本竞争对手的即时性<br>6\
    \ | 如果你想要轻松地实现所有 GTD 列表和操作，这是理想选择<br>7 | 同样，需要花很多精力学习才能解锁其强大的潜力，但一旦做到……<br>6 |\n\
    | **额外亮点** | 适用于所有平台的扩展和应用都遵循相同的规则和简单的文本文件<br>9 | 得益于其根源，可以使用编程或实用的 Freelance\
    \ 插件轻松扩展<br>7 | 缺失的功能以及竞争对手仍在开发中的一些功能可以添加进来<br>6 | 包括“大杂烩”功能，一次在 org 中，又一次在 Emacs\
    \ 集成中<br>4 |\n| **总体评价** | 实用、易学，能满足大多数人的需求<br>7 | 将思维导图引入世界规划；视觉导向型用户会喜欢它<br>7\
    \ | 具备强大的 GTD 捕捉和列表管理能力；当 GSDs 成熟时具有迁移潜力<br>8 | 花精力学习 org-mode，它将呈指数级回报你<br>8\
    \ |\n\n#### 获胜者是……\n\n**mGSD**\n\n一些 GTD 实践者仍然推崇纸质列表，但同步的 todo.txt 文件或 Web 应用在你能借到设备并记得密码的任何地方都能使用。十年前，像\
    \ Getting Things GNOME! 这样的桌面应用占据主导地位，但我们的数字生活向在线世界的迁移意味着一方面 Web 应用存活下来，另一方面则是我们通过\
    \ SSH 访问的树莓派上的命令行选择。\n\nTodo.txt 是最友好的命令行应用之一，即使是 GUI 爱好者也能对它产生好感。它的优势在于简单性：无论是文本格式，还是社区贡献的所有软件为保持兼容性而遵循的规则。对于\
    \ GTD 新手，或者只是想写个清单的人，今天就试试这个吧。\n\n对于更视觉导向的用户，Freelance GTD+ 是生成下一行动列表的好方法，将思维导图的全部威力带入世界规划。回到命令行：org-mode\
    \ 拥有出色的文档和大量用户提供的教程（如 sachachua.com 上的那些），可以帮助你应对陡峭的学习曲线。对于项目管理任务繁重的用户，org-mode\
    \ 可能是你的生命线。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_83_0.png)\n![](img/e7f197876caa0b235fb5da2d16a578ea_83_1.png)\n\
    \n然而，对于普通人来说，只有一个获胜者。mGSD 可能已经达到了开发生命的终点，当我们等待下一代基于 TiddlyWiki 的软件迎头赶上时，我们毫不犹豫地推荐它。在本地运行它没有安全风险，并且能够携带友好的\
    \ Web 界面到任何地方，而无需将数据信任于云服务商，这本身就是一个制胜点。\n\nmGSD 上手简单，却又表现出色，它以友好的界面和对上下文的良好理解让人着迷。尝试\
    \ mGSD，你很快就能掌控你的待办事项列表。\n\n**Richard Smedley**\n\n---\n\n来自 LinuxUser & Developer\
    \ 的制作方\n\n**实用的树莓派项目**\n\n发现树莓派的潜力，揭示它真正能做什么。通过在这本综合指南中创建你自己的虚拟助手、鼓机、四旋翼飞行器等，释放你树莓派的力量。\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_84_0.png)\n\n**也可获得……**\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_84_1.png)\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_84_2.png)\n![](img/e7f197876caa0b235fb5da2d16a578ea_84_3.png)\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_84_4.png)\n![](img/e7f197876caa0b235fb5da2d16a578ea_84_5.png)\n\
    \n**触手可及的内容世界**\n\n无论你热爱游戏、历史、动物、摄影、Photoshop、科幻还是介于两者之间的任何东西，Imagine Publishing\
    \ 的每一本杂志和电子书都充满了专业建议和令人着迷的事实。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_84_6.png)\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_84_7.png)\n\n**今日购买**\n纸质版在 www.imaginshop.co.uk\
    \ 有售\n数字版在 www.greatdigitalmags.com 有售\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_84_8.png)\n\
    \n---\n\n## 评测\n\n### Encryptr\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_85_0.png)\n\
    \n*上方 Encryptr 提供三种模板，可存储信用卡信息、密码和通用文本*\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_85_1.png)\n\
    \n*上方 没有冗长且令人好奇的注册过程——只需选择一个用户名和密码*\n\n**安全性**\n\n由 SpiderOak 的零知识加密技术支持，Encryptr\
    \ 是安全云笔记存储的解决方案吗？\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_85_2.png)\n\n- **DEB\
    \ 软件包**\n  32 位和 64 位\n- **替代客户端**\n  Windows 和 OS X\n- **移动客户端**\n  Android（iOS\
    \ 待发布）\n- **获取渠道**\n  encrypt r.org\n\n如果你对安全感兴趣，你很可能会熟悉 SpiderOak – *吹哨人爱德华·斯诺德的备份工具首选*\
    \ – 及其 Crypton 框架。基于“零知识”概念，SpiderOak 使用 Crypton JavaScript 框架以服务器无法访问的方式加密用户数据。因此，它巧妙地解决了云存储的最大问题，即必须将数据信任给他人。\n\
    \nSpiderOak 员工 Tommy Williams 对 Crypton 的优势了如指掌，并推出了基于该框架的新软件包：Encryptr。SpiderOak\
    \ 提供任意数据的 Secure 远程存储，而 Encryptr 更加聚焦：它为简短文本笔记、信用卡信息和密码提供安全的云存储服务。\n\nEncryptr\
    \ 客户端是开源的且跨平台的：Williams 已为 Linux 发布了 32 位和 64 位二进制构建，DEB 软件包以及适用于 Windows 和 OS\
    \ X 机器的客户端。\n\n对于移动用户，已有 Android 客户端，iOS 版本的工作也接近完成。它也很轻量：64 位构建版本安装在 Ubuntu Linux\
    \ 系统上，完全加载时占用不到 15MB。\n\n与 SpiderOak 一样，Encryptr 最大的卖点是 Crypton 框架提供的零知识加密。Crypton\
    \ 的概念是，提问者（服务器）永远不应知道它被要求存储的数据是什么：除存储和检索外，所有操作（包括加密和解密过程）都是完全基于客户端的。这提供了一层许多类似服务无法企及的安全性：即使服务器被攻击或公司本身被诉诸法律，理论上也没有方法在没有原始密码的情况下解密并查看\
    \ Encryptr 上的数据。\n\n考虑到 Williams 预期用户存储在 Encryptr 中的数据，这是一件好事：当前版本提供三种用于存储信用卡信息、密码和通用文本的模板。当在一个客户端输入时，数据会被发送到\
    \ Williams 控制的远程服务器——尽管软件的分支版本也可以将其发送到你自己的服务器（如果你希望的话）——以便同一账户下的任何客户端即时访问。\n\n\
    有趣的是，并没有真正的注册过程，这对于基于云的服务来说很罕见。无需透露你的电子邮件地址或其他个人信息：只需选择一个用户名和密码，即可开始使用。在另一台设备上使用相同的详细信息会立即调出共享账户。\n\
    \nEncyptor 已经满足了多项要求，包括轻松将详细信息复制到系统剪贴板，以及一种巧妙的模糊效果，用于在点击眼睛图标以显示密码之前将其隐藏。此外，添加新账户时，密码字段会填充随机生成的建议。\n\
    \n该软件尚处于早期阶段，在某些方面仍然缺乏。例如，设置页仅提供一个选项：更改与你账户关联的密码的能力。此外，也有人对该软件的整体安全性表示担忧。这是因为发现了密码生成器中随机数系统存在偏差。\n\
    \nCrypton 本身也尚未得到充分验证。尽管从一开始就为 SpiderOak 的零知识备份服务提供支持，但该软件只经历过两次审计：第一次在 2013 年完成，揭示了五个漏洞，随后已修复；第二次在\
    \ 2014 年完成，发现了 10 个问题，其中一些尚未完全解决。SpiderOak 还警告称，自上次审计以来软件已发生变化，需要一项尚未开始的补充审计。官方框架文档警告称：“后果自负。”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_86_0.png)\n\n> 上方 Encryptr 服务器永远不应知道它存储的数据实际上是什么\n\
    >\n> 上方 自上次审计以来软件已更改，系统中可能存在尚未发现的问题\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_86_1.png)\n\
    \n**Gareth Halfacree**\n\n### 优点\n\n- Crypton 零知识框架提供与你的密码同样强的安全性，即使在云服务器上存储数据也是如此\n\
    \n### 缺点\n\n- 该软件当前版本极其基础，可能包含尚未发现的安全问题\n\n### 总结\n\nEncyptor 显示出潜力，其开源性质意味着理论上它应该开放给安全审查。然而，在撰写本文时，该软件极其基础。尽管开发正在进行中，但它是一个人的作品，因此进展缓慢。退一步说，它展示了\
    \ Crypton 框架的灵活性。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_86_2.png)\n"
