    # 开源\n\n您的 Linux 新闻与观点来源\n\n## 发行版动态\n\n### Top 10\n\n(平均每日访问量，8月5日 - 9月3日)\n\n\
    - Linux Mint ▼ 3,096\n- Debian ▲ 2,062\n- Ubuntu ▲ 1,560\n- openSUSE - 1,175\n\
    - Fedora ▲ 1,148\n- Manjaro ▲ 1,123\n- CentOS ▲ 981\n- Mageia ▲ 945\n- Kali Linux\
    \ ▲ 925\n- Zorin OS ▼ 800\n\n### 本月\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_9_0.png)\n\
    \n尽管 Linux Mint 遭遇挫折，但它仍保持第一。与此同时，Kali 进入前十名对于应用专用发行版来说是罕见的。\n\n### 亮点\n\n####\
    \ Ubuntu 15.10 Beta 1\n\n在十月正式全面发布之前，最新的 Ubuntu “Vivienne” 提供了多种标准版本、Kubuntu、Lubuntu、Ubuntu\
    \ GNOME、Ubuntu MATE、Ubuntu Kylin、Xubuntu 和 Ubuntu Cloud 风味，供各类测试人员享用。\n\n####\
    \ Zorin OS 10\n\n基于 Ubuntu 15.04 的最新 Zorin OS 包括一个新的媒体播放器和一个精美的活动日志，显示您全天处理过的文件和文档。\n\
    \n#### Kali 2.0\n\nKali 2.0 的发布标志着向滚动发布模式的转变。旨在使渗透测试和安全发行版的更新更加容易。\n\n最新可用发行版：\n\
    \nfilesilo.co.uk\n\n## 游戏\n\n### Unity 游戏引擎登陆 Linux\n\n未来对该平台的支持不保证\n\n游戏引擎专家\
    \ Unity 宣布为其 Linux 版本软件发布了一个实验性构建版本，履行了其在未来版本中支持该操作系统的路线图承诺。\n\nUnity 是游戏和通用 3D\
    \ 渲染的流行引擎，此前仅限于在专有平台上使用。本月的发布改变了这一现状，为在 Ubuntu 12.04 或更新版本上运行软件提供官方支持，并为其他 64\
    \ 位 Linux 发行版提供非官方支持。\n\n然而，对于公司而言，这次发布是一次测试，Unity 尚未承诺进行完整和正式的发布。Unity 的 NaTosha\
    \ Bard 警告说：“今天的构建版本是我们所称的实验性构建版本；未来的支持尚未保证。” “您的采用和反馈将帮助我们确定这是否是我们能够与 Mac 和 Windows\
    \ 构建版本一起持续发展的东西。” Bard 没有指出采用和反馈水平需要达到什么程度，公司才会跟随 Epic 的 Unreal Engine 等竞争对手的脚步，将\
    \ Linux 采纳为所有未来版本的完全支持平台。\n\n得益于游戏开发和出版巨头 Valve 基于 Debian Linux 发行版建立其以游戏为中心的操作系统\
    \ SteamOS，开发人员对 Linux 作为游戏平台的兴趣比以往任何时候都高。\n\n## Fedora\n\n### 32 位 x86 支持被降级\n\
    \nFedora 将 64 位 x86 设为黄金标准\n\n跟随 Fedora 工程指导委员会 (FESCo) 的投票，Fedora 项目已将其 Linux\
    \ 发行版中对 32 位 x86 架构的支持降级。\n\n在八月底的会议上，FESCo 就 Fedora 24 中移除对 i686 32 位 x86 指令集架构的支持发起投票。“从我个人的观点来看，没有人想要支持\
    \ i686 镜像，” Hailuk Guímar 告诉与会者。“我完全 +1（支持）在 f24 [Fedora 24] 中删除所有 i686 镜像/媒体，”\
    \ Kevín Ferzi 补充道。\n\n经过一些讨论，委员会同意将投票从完全放弃 i686 支持更改为使其成为一个非阻塞交付物。这意味着如果该工作未能及时完成，其缺失不会阻止\
    \ Fedora 24 的总体发布，实际上降级了该架构的支持。\n\n64 位 x86 架构与传统的 32 位变体向后兼容，由 AMD 于 2003 年作为\
    \ AMD64 推出，英特尔在一年后跟进。如今，这两家公司的大多数芯片都是 64 位的。\n\n## 观点 编程\n\n### 二的幂\n\n在计算机领域，没有什么能胜过二进制算术。以下是如何判断一个整数是否是二的幂的方法。\n\
    \n判断给定的正整数是否是二的幂并不是一项艰巨的任务，但它需要大量的处理，尤其是当整数大于 $2^{20}$ 时。此外，它强调：a) 在实现之前应仔细思考，并且\
    \ b) 在编程时拥有扎实的数学知识是很好的。你知道的数学领域越多，就越好。\n\n这是一个标准的、暴力递归的 Python 函数 (power0f2.py)，用于解决初始问题：\n\
    \n```python\ndef powerOf2(num):\n    if (num == 1):\n        return True\n   \
    \ elif (num == 0) or (num % 2 == 1):\n        return False\n    else:\n      \
    \  return powerOf2(num / 2)\n```\n\n另一个版本使用二进制算术 (bitwise.py)：\n\n```python\n\
    def powerOf2(number):\n    return (number & (number-1) == 0) and (number != 0)\n\
    ```\n\n简单来说，该函数检查 number 变量的二进制表示中是否设置了多个 \"1\" 位。如您所知，CPU 使用二进制算术进行计算。这些计算特别快，比任何其他类型的计算都快。\n\
    \n为了使算法更清晰：64（二的幂）的二进制表示为 1000000。64-1 等于 63，63 的二进制表示为 0111111。因此，(1111111 &\
    \ 1000000) 等于 0，这证明数字 64 是二的幂。缺点是，使用二进制算术的解决方案仅适用于必须处理二的幂的问题。\n\n以下 Python 脚本生成\
    \ 1,000,000 个随机数，然后用作测试这两种技术的输入：\n\n```python\n#!/usr/bin/python\nimport random\n\
    MIN = 0\nMAX = 100000\nTOTAL = 1000000\n```\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_10_0.png)\n\
    \n**Mihalis Tsoukalos** 是一名 UNIX 管理员、程序员、DBA 和数学家。他自 1993 年以来使用 Linux。\n\n“在编程时拥有扎实的数学知识是很好的。你知道的数学领域越多，就越好。”\n\
    \n```python\nfor i in range(0, TOTAL):\n    print random.randrange(MIN, MAX)\n\
    ```\n\n尽管函数 **random.randrange()** 暗示它生成随机数，但其统计分布最终并不是那么随机。以下输出证明了这一点：\n\n```bash\n\
    $ awk '{ if ($0 > 0 && $0 < 10000) print }' numbers | wc -l\n99585\n$ awk '{ if\
    \ ($0 > 10000 && $0 < 20000) print }' numbers | wc -l\n99811\n$ awk '{ if ($0\
    \ > 20000 && $0 < 30000) print }' numbers | wc -l\n99930\n```\n\n以下方法可以找出是否存在重复数字：\n\
    \n```bash\n$ sort numbers | uniq -c | sort -rn\n```\n\n存在重复数字并不是一件坏事，知道这一点就好。现在是时候进行实际的基准测试了。这次基准测试将使用\
    \ **time()** Python 函数完成。正如您在 Python 代码中看到的，每个程序自我重复十次以产生更准确的结果。结果如下：\n\n```text\n\
    powerOf2.py: 12.287568 seconds\nbitwise.py: 8.285457 seconds\n```\n\n尽管差异只有四秒，但\
    \ powerOf2.py 比 bitwise.py 多花费 50% 的时间来执行完全相同的任务。\n\n允许的最大整数在问题中起着核心作用，因为如果它很小，暴力技术显然会花费更少的时间。示例中发现的最大整数在以下结果中被设置为\
    \ 1000：\n\n```text\npowerOf2.py: 11.39706 seconds\nbitwise.py: 8.412941 seconds\n\
    ```\n\n您可以在 github.com/mactsousk 和 fileso.co.uk/linuxuser-157 找到源代码。\n\n"
