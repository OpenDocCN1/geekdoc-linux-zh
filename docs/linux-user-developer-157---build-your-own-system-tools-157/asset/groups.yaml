    \ \"Messages\": [],\n      \"ZoneName\": \"eu-west-1c\"\n    },\n    {\n     \
    \ \"State\": \"available\",\n      \"RegionName\": \"eu-west-1\",\n      \"Messages\"\
    : [],\n      \"ZoneName\": \"eu-west-1d\"\n    }\n  ]\n}\n```\n\nIt is worth noting\
    \ that any single Spot Fleet request may not span more than one region, nor different\
    \ subnets of an Availability Zone. Also, the size of the user data in a launch\
    \ specification may not exceed 16 KB.\n\nEnter the relevant information into your\
    \ configuration file and then name it config.json.\n\n# Submit your Spot Fleet\
    \ request:\n\nIn the AWS command line interface, enter the command to submit your\
    \ Spot Fleet request:\n\n```\naws ec2 request-spot-fleet --spot-fleet-request-\\\
    nconfig file://config.json\n```\n\nThe file config.json is the same JSON document\
    \ that you created, and it specifies setup details for your Spot Fleet. You can\
    \ monitor your Spot Fleet requests using:\n\n```\naws ec2 describe-spot-fleet-requests\n\
    ```\n\nEach of your Spot Fleet requests can assume these states:\n\n+   * submitted\
    \ – Amazon is evaluating your request in preparation for launching your instances.\n\
    +   * active – once your request has been validated, this is when Amazon EC2 attempts\
    \ to maintain the target number of running Spot instances in your fleet.\n+  \
    \ * cancelled-running – Amazon has received your request to abandon your Spot\
    \ Fleet; it will not launch any additional Spot instances; currently running instances\
    \ will continue to perform until they are interrupted or terminated (default).\n\
    +   * cancelled-terminating – Amazon has received your request\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_50_0.png)\n\
    \nto abandon your Spot Fleet and is in the process of forcefully terminating instances\
    \ covered by this request (non-default).\n\n* cancelled – your Spot Fleet has\
    \ now been successfully cancelled, no instances are running, none will be started\
    \ and Amazon will delete your request two days after the last instances were terminated.\n\
    \nThe following will gracefully end your Spot Fleet request without terminating\
    \ any of the EC2 instances that are running:\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-\\nrequest-ids sfr-72fbd1ce-aa42-464c-8877-\\n1cee4MYFLEET--no-terminate-instances\n\
    ```\n\nIf you intend to cancel your request and terminate all instances at the\
    \ same time, use this command at the prompt:\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-\\nrequest-ids sfr-72fbd1ce-aa42-464c-8877-\\n1cee4MYFLEET--terminate-instances\n\
    ```\n\nThe response should look something like this (for a request without automatic\
    \ instance termination):\n\n```\n{\n  \"SuccessfulFleetRequests\": [\n    {\n\
    \      \"SpotFleetRequestId\": \"sfr-72fbd1ce-aa42-464c-8877-1cee4MYFLEET\",\n\
    \      \"CurrentSpotFleetRequestState\": \"cancelled_running\",\n      \"PreviousSpotFleetRequestState\"\
    : \"active\"\n    }\n  ],\n  \"UnsuccessfulFleetRequests\": []\n}\n```\n\nSpot\
    \ Fleet requests exemplify how you can use cloud services on Linux in order to\
    \ automate... cloud services! At any given time, you can run up to 1000 Spot Fleets\
    \ per region with a total of no more than 3000 instances based on any AMIs of\
    \ your choice, including Linux AMIs you may have created by yourself, possibly\
    \ running custom-coded apps.\n\nAbove An Elastic Load Balancer can automatically\
    \ control Auto Scaling groups as well as individual instances based on demand"
  - "[PAGE 51]\n\n# Secure access to your AWS resources\n\nProtect your web platform\
    \ from online attack to keep data safe and your service operational\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_51_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_51_1.png)\n\nPhilipe Martins & Anna\
    \ Kobylinska\nearned up to decades ago on a Linux box and ended up in enterprise\
    \ IT, designing cloud topologies, optimising Linux VMs and managing AWS deployments.\n\
    \nThose who dare to venture into the public cloud quickly learn the value of paranoid\
    \ security. In the cloud, you are no longer 'merely' facing the risk of a catastrophic\
    \ data loss or data leak. You are now looking at what amounts to an unlimited\
    \ financial liability for your pay-as-you-go services that scale on demand. Should\
    \ an unauthorised party gain control over your AWS account, the financial outcome\
    \ wouldn't look pretty. Not even close. It is wise to never understate human ingenuity,\
    \ because the impossible may not be so far-fetched after all.\n\nOver the last\
    \ year or so, a series of security vulnerabilities, from Heartbleed through Shellshock\
    \ to VENOM, struck terror into the hearts of active cloud users around the world.\
    \ Heartbleed and Shellshock famously exposed fatal flaws in tools that were previously\
    \ deemed to be safe (OpenSSL and Bash, respectively). VENOM forced hurried patching\
    \ from esteemed vendors of virtualisation software, having lurked in obscurity\
    \ for over a decade.\n\nWhen it comes to cloud security, Andy Grove's (former\
    \ CEO of Intel) remark \"only the paranoid survive\" seems fitting. On AWS, security\
    \ is a feature you don't have to pay extra for.\n\n+   01 Create a new IAM user\n\
    +   In order to secure access to your AWS resources, you need to quit using your\
    \ AWS root credentials. The AWS Management Console, Amazon's web frontend for\
    \ its infrastructure services, may prompt you to create an IAM user. Even if it\
    \ doesn't, you should still do so.\n+   \n+   Navigate your web browser to the\
    \ service Identity and Access Management (IAM for short), which is located at:\
    \ console.aws.amazon.com/iam. In the left-hand navigation pane, switch to the\
    \ section labeled Users and click on the button Create New Users.\n+   \n+   Follow\
    \ the on-screen instructions in the IAM dashboard to create new users. The wizard\
    \ will ask you to provide up to five usernames with a maximum of 64 characters\
    \ each. An access key is optional; if you deactivate the checkbox, you can still\
    \ add these credentials later.\n+   \n+   Once you click on the Create button,\
    \ up to five IAM users will be added to your AWS root account. So far, these users\
    \ do not belong to any groups and they have no privileges whatsoever. The real\
    \ users also do not yet know their login credentials and so do not have access.\n\
    \n# Resources\n\nAWS root account\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_51_2.png)\n\
    \n**Right:** Through the Identity and Access Management Console, create new IAM\
    \ users"
