    虚拟文件系统（VFS）代码中支持使用现代 RCU（读取-复制-更新机制）进行优化目录查找时，发现了一个竞态条件。这意味着在某些条件下，用户在查找目录路径组件（如
    /usr/local/bin）时会发现内核在一个明显是目录的路径组件上报告“ENOTDIR”（不是目录）。这会导致各种应用程序崩溃。


    问题的原因被证明是“link_path_walk”文件系统路径遍历代码中 RCU 使用的一个缺陷。RCU 是一套极其复杂且有时难以理解的代码，但它确实为快速路径（查找）代码带来了许多性能优势——例如用于在文件系统和网络代码中快速遍历链表。在这种情况下，人们意识到一个
