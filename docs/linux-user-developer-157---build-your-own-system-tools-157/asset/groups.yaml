    \ you need to run, but at the lower layer, all the containers on your machine\
    \ use the same kernel – this makes them lightweight and very fast to deploy. However,\
    \ this also means that all of the containers are tied to one OS and you don’t\
    \ have the freedom to run apps for different operating systems on one host. You\
    \ can install Docker on any OS, though.\n\n## 01 Docker architecture\n\nDocker\
    \ is based on client-server architecture: Docker client accepts the commands from\
    \ users and then talks to the Docker daemon that does the core tasks such as building,\
    \ running and even distributing the Docker containers. Note that Docker client\
    \ and the daemon communicate via RESTful APIs, therefore the communication is\
    \ asynchronous. Also, this makes the system loosely coupled: it is possible to\
    \ have the client and daemon run on the same system, or different systems, based\
    \ on your requirements. However, it is important to understand that the Docker\
    \ daemon should run on the host machine: for example, the machine where containers\
    \ are supposed to run and that the client runs on the system being used as the\
    \ interface, because the Docker client is the primary interface to Docker for\
    \ the user.\n\n## 02 Docker components\n\nApart from the server and the client,\
    \ there are three other components of Docker that are important to clarify in\
    \ order to understand its overall working. These are Docker images, containers\
    \ and registries.\n\n```\nn@lakh:nithish-VirtualBox:~ $ docker run hello-world\n\
    Unable to find image 'hello-world:latest' locally\nlatest: Pulling from hello-world\n\
    51125ac580d: Pull complete\n5f70cb1826b2: Already exists\nhello-world:latest:\
    \ The image you are pulling has been verified. Important: image verification is\
    \ a tech preview feature and should not be relied on to provide security.\nDigest:\
    \ sha256:af506d50c957eeccd1f99f08778679686f3284c76a3886158182bed336df4ccb3721eae52\n\
    Status: Downloaded newer image for hello-world:latest\nHello from Docker.\nThis\
    \ message shows that your installation appears to be working correctly.\nTo generate\
    \ this message, Docker took the following steps:\n1. The Docker client contacted\
    \ the Docker daemon.\n2. The Docker daemon pulled the 'hello-world' image from\
    \ the Docker Hub.\n3. The Docker daemon created a new container from that image\
    \ which runs the executable that produces the output you are currently reading.\n\
    4. The Docker daemon streamed that output to the Docker client, which sent it\
    \ to your terminal.\nTo try something more ambitious, you can run an Ubuntu container\
    \ with:\n  $ docker run -it ubuntu bash\nShare images, automate workflows, and\
    \ more with a free Docker Hub account:  https://hub.docker.com\nFor more examples\
    \ and ideas, visit: https://docs.docker.com/useguide/\nn@lakh:nithish-VirtualBox:~\
    \ $\n```\n\n**Right** A Docker container can be created using command **docker\
    \ run** `<image-name>`\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_44_0.png)\n\
    \nA Docker image is a read-only template in a predefined format that the Docker\
    \ daemon can run – so any application that you want to run as a Docker container\
    \ first needs to be made as a Docker image. Images generally contain the base\
    \ operating system, the libraries and binaries required for the application to\
    \ be run, and obviously the application itself. Docker provides simple ways to\
    \ build new images or update old ones. You can also download images that others\
    \ have built via the Docker registry.\n\nA Docker registry is a storage and content\
    \ delivery system, holding Docker images. You can interact with a registry using\
    \ the `push` and `pull` commands. A registry can be private or public depending\
    \ on your requirements. Docker also provides the official Docker registry as a\
    \ SaaS (software-as-a-service) platform, called the Docker hub. Docker hub can\
    \ be thought of as a huge repository of Docker images that are free to be downloaded\
    \ and run. You can also create your own image and push it to the Docker hub.\n\
    \n## 03 Docker containers\n\nProbably the most important component of the Docker\
    \ ecosystem, containers can be thought of as running instances of Docker images.\
    \ The image (which is going to be run as container) tells Docker what the container\
    \ holds, what process to run when the container is launched and a variety of other\
    \ configuration data. As mentioned in the previous step, images are read-only,\
    \ but when the image being executed (ie converted to a container), Docker creates\
    \ a read-write layer on top of the image so that applications can run normally.\
    \ Later, when the container is stopped, the top read-write layer is lost and the\
    \ image is available as it is.\n\n> “Containers isolate the runtime of the application\
    \ you need to run, but all the containers use the same kernel”\n\nDocker provides\
    \ commands such as `run`, `start`, `stop`, `ps`, `rm` and so on, in order to interact\
    \ with containers. You can type, `docker <command-name> --help` to get the help\
    \ that’s related to `<command-name>`.\n\nNow that you have a clear idea of the\
    \ important components and how they work together in Docker, let’s install Docker\
    \ and see the components in action. Note that I have used Ubuntu 14.04 as the\
    \ base system for installation and demo purposes.\n\n## 04 Installation\n\nDocker\
    \ installation is pretty straightforward. Firstly, log in to your system and check\
    \ if you have wget installed, using the which `wget` command. If it isn’t installed,\
    \ run the commands `sudo apt-get update` and `sudo apt-get install wget`. After\
    \ successfully installing wget, let’s install Docker. Run the command `wget -qO-\
    \ https://get.docker.com/ | sh`. The system prompts you for the root password,\
    \ then downloads and installs Docker and its dependencies. To verify if Docker\
    \ is successfully installed, you can run the command `sudo docker run hello-world`.\
    \ This will download a test image and run it in a container on your system. If\
    \ you take a close look at the output on the opposite page, you’ll see the steps\
    \ Docker followed to generate the message. This gives an idea of how components\
    \ interact in Docker.\n\n## Docker Swarm\n\nDocker swarm lets you create a native\
    \ cluster for Docker – you can create a pool of Docker hosts. And since Docker\
    \ Swarm serves the standard Docker API, any tool that already communicates with\
    \ a Docker daemon can use Swarm to transparently scale to multiple hosts.\n\n\
    Though Docker Swarm is in the initial stages now, changes are expected to occur\
    \ in how it will handle the backend.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_45_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_45_1.png)\n\n## 05 Create a Docker\
    \ group\n\nThe Docker installation is successful and we have verified that using\
    \ the **docker run** command, however, you may have noticed that we need to add\
    \ **sudo** before running any Docker command, and therefore every time you run\
    \ a Docker command in a new terminal, you need to enter the root password. This\
    \ is because the Docker daemon binds to a Unix socket instead of a TCP port and\
    \ the root user owns the Unix socket. To avoid using **sudo**, you can create\
    \ a group called docker and add users to it; users here means the users exposed\
    \ to run Docker commands. Now, when the Docker daemon starts, it sets the ownership\
    \ of the Unix socket read/write to all users in the docker group.\n\nTo create\
    \ the group and add a user, log in to Ubuntu as the user who needs to run Docker\
    \ commands. Then run the command **sudo usermod -aG docker username**—don’t forget\
    \ to replace username with the actual username. Then log out of the system and\
    \ log in again. Verify if Docker commands now work without **sudo** by typing\
    \ **docker run hello-world**. If this works successfully, the group mechanism\
    \ we added works. Now there is no need to enter the password every time you want\
    \ to run a Docker command.\n\n## 06 Base image\n\nAs discussed, Docker containers\
    \ are created using images. An image can be basic, with nothing but the operating\
    \ system fundamentals, or it can consist of a sophisticated pre-built application\
    \ stack ready for launch. All this is possible because of Docker’s layered approach\
    \ to images. This provides an extremely powerful abstraction for building up application\
    \ containers, where one step serves as the base for the next one, ie new tools,\
    \ applications, content, patches and more, which form additional layers on the\
    \ foundation (the base image).\n\nA base image is the one without any further\
    \ layers below; this is the most basic form of a Docker image that has just the\
    \ operating system. The Docker hub has base images for all of the major Linux\
    \ distros, but you are also free to create your own base image. To do so, you\
    \ can use the scratch repository in the Docker hub, just use **FROM scratch**\
    \ in the Dockerfile (more on Dockerfiles in the next part). Another way is using\
    \ the **tar** command. Type\n\n```bash\n$ sudo debootstrap trusty trusty > /dev/null\n\
    $ sudo tar -C trusty -c . | sudo docker import - trusty\n```\n\nHere, the above\
    \ command creates a tar file of the current directory and outputs it to STDOUT,\
    \ while **docker import** takes it from STDIN and then creates a base image called\
    \ trusty from it.\n\n## 07 Dockerfile\n\nAs we saw in the previous step, creating\
    \ a base image doesn’t involve many Dockerfile instructions. However, as you add\
    \ more and more layers to the base image, knowledge of Dockerfile instructions\
    \ will become very important to you.\n\nLet’s start with its definition. A Dockerfile\
    \ is a script composed of various commands (instructions) and arguments listed\
    \ successively to automatically perform actions on a base image in order to create\
    \ a new one. Creating a Dockerfile is as simple as listing the instructions one\
    \ by one in a plain text file (named Dockerfile) and then calling the **docker\
    \ build** command (in the same directory) to create the image. Typical Dockerfile\
    \ syntax looks like this:\n\n```bash\n# Print 'Hello World'\nRUN echo \"Hello\
    \ World\"\n```\n\nDockerfile consists of two types of lines: comments starting\
    \ with # and commands (with arguments) starting with an instruction (written in\
    \ capital letters). Also, it is worth mentioning here that a Dockerfile should\
    \ always start with the **FROM** instruction, meant to indicate the base image.\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_45_2.png)\n\n## 08 Dockerfile instructions\n\
    \nThere are about a dozen different commands that a Dockerfile can use to build\
    \ a Docker image. Let’s look at a few of the important Dockerfile instructions\
    \ and their usage:\n\n**ADD** – The ADD command needs two arguments: a source\
    \ and a destination. It copies files from the source (on the host) into the container’s\
    \ OS filesystem at the set destination. It can also take a URL, as the source.\
    \ Example:\n\n```bash\n# ADD Usage\nADD /my_source_path /my_docker_dest_path\n\
    ```\n\n**ENV** – The ENV instruction is used to set the environment variables\
    \ (one or more). These variables consist of key-value pairs that can be accessed\
    \ within the container by scripts and applications alike. This is similar to environment\
    \ variables set in Windows systems.\n\n```bash\n# ENV Usage\nENV Default 6\n```\n\
    \n**FROM** – This directive is probably the most crucial amongst all the other\
    \ listed here. It defines the base image to use to start the build process. It\
    \ can be any image, including the ones you have created previously. Also, it should\
    \ be the first instruction in the Dockerfile.\n\n```bash\n# FROM Usage\nFROM ubuntu\n\
    ```\n"
  mdcn: "\n## 启动你的第一个 Docker 容器\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_43_0.png)\n\
    \n**Nithish Tiwari**\n职业是软件开发人员，内心则是开源爱好者。除了为知名开源杂志撰稿外，他还协助企业根据业务需求部署和使用开源软件。\n\
    \n## 资源\n- Docker\n- [docker.com](docker.com)\n\n## 容器是当下最酷的技术——每个人都想将软件运行在 Docker\
    \ 容器中\n\n**Linux 容器提供了一种简单的方法，用于在隔离环境中运行应用程序**。应用程序与其库及其他所需的二进制文件捆绑在一起，然后通过容器以隔离方式运行。容器技术已存在了一段时间——像\
    \ LXC、OpenVZ 等项目大约于 2005 年发布——但 Docker 的出现彻底改变了局面。不仅容器化在用户群体中变得主流，现在更多企业也开始在其生产系统中使用\
    \ Docker。\n\n在我们跳入 Docker 及其基础知识之前，让我们试着厘清一个基本问题——容器化与虚拟化的区别。虚拟化涉及在主机上创建一个目标内核，因此你的系统上有多少台虚拟机，就会有多少个内核。虽然某些场景可能需要这样做，但拥有单独的内核通常是一个很大的开销。另一方面，容器仅仅隔离了你需要运行的应用程序的运行时环境，但在更底层，机器上的所有容器都使用同一个内核——这使得它们轻量级且部署速度极快。然而，这也意味着所有容器都绑定到一个操作系统，你无法在同一主机上自由运行针对不同操作系统的应用程序。不过，你可以在任何操作系统上安装\
    \ Docker。\n\n## 01 Docker 架构\n\nDocker 基于客户端-服务器架构：Docker 客户端接受用户命令，然后与 Docker\
    \ 守护进程通信，由后者执行构建、运行甚至分发 Docker 容器等核心任务。注意，Docker 客户端和守护进程通过 RESTful API 通信，因此通信是异步的。此外，这使得系统是松耦合的：根据需求，客户端和守护进程可以运行在同一系统上，也可以运行在不同系统上。但重要的是要理解，Docker\
    \ 守护进程必须运行在主机上：例如，容器即将运行的机器上；而客户端运行在用作接口的系统上，因为 Docker 客户端是用户访问 Docker 的主要接口。\n\
    \n## 02 Docker 组件\n\n除了服务器和客户端，Docker 还有三个其他重要组件，为了理解其整体工作原理，有必要对它们进行澄清。它们是 Docker\
    \ 镜像、容器和注册表。\n\n```\nn@lakh:nithish-VirtualBox:~ $ docker run hello-world\nUnable\
    \ to find image 'hello-world:latest' locally\nlatest: Pulling from hello-world\n\
    51125ac580d: Pull complete\n5f70cb1826b2: Already exists\nhello-world:latest:\
    \ The image you are pulling has been verified. Important: image verification is\
    \ a tech preview feature and should not be relied on to provide security.\nDigest:\
    \ sha256:af506d50c957eeccd1f99f08778679686f3284c76a3886158182bed336df4ccb3721eae52\n\
    Status: Downloaded newer image for hello-world:latest\nHello from Docker.\nThis\
    \ message shows that your installation appears to be working correctly.\nTo generate\
    \ this message, Docker took the following steps:\n1. The Docker client contacted\
    \ the Docker daemon.\n2. The Docker daemon pulled the 'hello-world' image from\
    \ the Docker Hub.\n3. The Docker daemon created a new container from that image\
    \ which runs the executable that produces the output you are currently reading.\n\
    4. The Docker daemon streamed that output to the Docker client, which sent it\
    \ to your terminal.\nTo try something more ambitious, you can run an Ubuntu container\
    \ with:\n  $ docker run -it ubuntu bash\nShare images, automate workflows, and\
    \ more with a free Docker Hub account:  https://hub.docker.com\nFor more examples\
    \ and ideas, visit: https://docs.docker.com/useguide/\nn@lakh:nithish-VirtualBox:~\
    \ $\n```\n\n**右侧** 可以使用命令 **docker run** `<image-name>` 创建一个 Docker 容器\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_44_0.png)\n\
    \nDocker 镜像是预定义格式的可读模板，Docker 守护进程可以运行它——因此，任何你想作为 Docker 容器运行的应用程序，首先需要制作成 Docker\
    \ 镜像。镜像通常包含基础操作系统、运行应用程序所需的库和二进制文件，以及应用程序本身。Docker 提供了构建新镜像或更新旧镜像的简单方法。你还可以通过\
    \ Docker 注册表下载其他人构建的镜像。\n\nDocker 注册表是一种存储和内容交付系统，用于保存 Docker 镜像。你可以使用 `push`\
    \ 和 `pull` 命令与注册表交互。根据你的需求，注册表可以是私有的或公共的。Docker 还提供官方的 Docker 注册表，作为一个 SaaS（软件即服务）平台，称为\
    \ Docker Hub。Docker Hub 可以被视为一个巨大的 Docker 镜像仓库，其中的镜像可免费 downloading 和运行。你也可以创建自己的镜像并将其推送到\
    \ Docker Hub。\n\n## 03 Docker 容器\n\n容器可能是 Docker 生态系统中最重要组件，可以将其视为 Docker 镜像的运行实例。镜像（即将作为容器运行）告知\
    \ Docker 容器包含什么、启动容器时运行什么进程以及各种其他配置数据。如前一步所述，镜像是只读的，但当镜像被执行（即转换为容器）时，Docker 会在镜像之上创建一个读写层，以便应用程序能正常运行。稍后，当容器停止时，顶部的读写层会丢失，镜像恢复原状。\n\
    \n> “容器隔离了你需要运行的应用程序的运行时环境，但所有容器都使用同一个内核”\n\nDocker 提供了诸如 `run`、`start`、`stop`、`ps`、`rm`\
    \ 等命令，以便与容器交互。你可以输入 `docker <command-name> --help` 来获取与 `<command-name>` 相关的帮助信息。\n\
    \n现在，你已经对 Docker 的重要组件及其协作方式有了清晰的了解，让我们安装 Docker 并观察这些组件的实际运行。请注意，我使用 Ubuntu 14.04\
    \ 作为安装和演示的基础系统。\n\n## 04 安装\n\nDocker 的安装相当直接。首先，登录系统并使用 which `wget` 命令检查是否安装了\
    \ wget。如果未安装，运行命令 `sudo apt-get update` 和 `sudo apt-get install wget`。成功安装 wget\
    \ 后，让我们安装 Docker。运行命令 `wget -qO- https://get.docker.com/ | sh`。系统会提示输入 root 密码，然后下载并安装\
    \ Docker 及其依赖项。要验证 Docker 是否成功安装，你可以运行命令 `sudo docker run hello-world`。这将下载一个测试镜像并在你的系统上的容器中运行它。如果你仔细查看上一页面的输出，你会看到\
    \ Docker 生成该消息所遵循的步骤。这有助于了解 Docker 中组件之间是如何交互的。\n\n## Docker Swarm\n\nDocker Swarm\
    \ 允许你为 Docker 创建原生集群——你可以创建一个 Docker 主机池。并且由于 Docker Swarm 支持标准的 Docker API，任何已经与\
    \ Docker 守护进程通信的工具都可以使用 Swarm 透明地扩展到多个主机。\n\n虽然 Docker Swarm 目前仍处于早期阶段，预计其处理方式将会发生变化。\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_45_0.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_45_1.png)\n\
    \n## 05 创建 Docker 组\n\nDocker 安装成功，并且我们已经使用 **docker run** 命令进行了验证，然而，你可能注意到我们在运行任何\
    \ Docker 命令前都需要添加 **sudo**，因此每次在新终端中运行 Docker 命令时，都需要输入 root 密码。这是因为 Docker 守护进程绑定到\
    \ Unix 套接字而非 TCP 端口，且 root 用户拥有该 Unix 套接字。为了避免使用 **sudo**，你可以创建一个名为 docker 的组并将用户加入其中；这里的“用户”指那些需要运行\
    \ Docker 命令的用户。现在，当 Docker 守护进程启动时，它将 Unix 套接字的读/写权限设置为 docker 组中的所有用户。\n\n要创建组并添加用户，请以需要运行\
    \ Docker 命令的用户身份登录 Ubuntu。然后运行命令 **sudo usermod -aG docker username**——别忘了将 username\
    \ 替换为实际用户名。然后注销系统并重新登录。通过输入 **docker run hello-world** 来验证 Docker 命令是否现在无需 **sudo**\
    \ 即可工作。如果成功，我们添加的组机制即可正常工作。现在，每次想要运行 Docker 命令时都不需要输入密码了。\n\n## 06 基础镜像\n\n正如所讨论的，Docker\
    \ 容器是使用镜像创建的。镜像可以是基础镜像，除了操作系统基础外没有其他内容；也可以是由复杂的预构建应用程序堆栈组成，随时准备启动。这一切都是得益于 Docker\
    \ 对镜像的层叠方法。这为构建应用程序容器提供了极其强大的抽象，其中一个步骤作为下一个步骤的基础，即新的工具、应用程序、内容、补丁等，在基础（基础镜像）之上形成额外的层。\n\
    \n基础镜像是没有下层任何其他层的那个；这是 Docker 镜像最基本的形式，仅包含操作系统。Docker Hub 拥有所有主要 Linux 发行版的基础镜像，但你也可以自由创建自己的基础镜像。为此，你可以在\
    \ Docker Hub 中使用 scratch 仓库，只需在 Dockerfile 中使用 **FROM scratch**（下一部分将详细介绍 Dockerfile）。另一种方法是使用\
    \ **tar** 命令。输入：\n\n```bash\n$ sudo debootstrap trusty trusty > /dev/null\n$ sudo\
    \ tar -C trusty -c . | sudo docker import - trusty\n```\n\n这里，上述命令创建当前目录的 tar\
    \ 文件并将其输出到 STDOUT，而 **docker import** 从 STDIN 接收它，然后从中创建一个名为 trusty 的基础镜像。\n\n\
    ## 07 Dockerfile\n\n正如我们在上一步看到的，创建基础镜像不涉及太多 Dockerfile 指令。然而，随着你在基础镜像上添加越来越多的层，对\
    \ Dockerfile 指令的了解对你来说将变得非常重要。\n\n让我们从其定义开始。Dockerfile 是一个由各种命令（指令）和参数按顺序列出的脚本，用于在基础镜像上自动执行操作以创建新镜像。创建\
    \ Dockerfile 很简单，只需在一个纯文本文件（命名为 Dockerfile）中逐行列出指令，然后调用 **docker build** 命令（在同一目录下）来创建镜像。典型的\
    \ Dockerfile 语法如下：\n\n```bash\n# Print 'Hello World'\nRUN echo \"Hello World\"\
    \n```\n\nDockerfile 由两种类型的行组成：以 # 开头的注释和以指令（大写书写）开头的命令（带参数）。此外，这里值得提及的是，Dockerfile\
    \ 始终应以 **FROM** 指令开始，该指令用于指示基础镜像。\n\n![](img/e7f197876caa0b2d16a578ea_45_2.png)\n\
    \n## 08 Dockerfile 指令\n\nDockerfile 可以使用大约一打不同的命令来构建 Docker 镜像。让我们看看几个重要的 Dockerfile\
    \ 指令及其用法：\n\n**ADD** – ADD 命令需要两个参数：源和目标。它将文件从源（在主机上）复制到容器的操作系统文件系统中的指定目标。它还可以接受\
    \ URL 作为源。示例：\n\n```bash\n# ADD Usage\nADD /my_source_path /my_docker_dest_path\n\
    ```\n\n**ENV** – ENV 指令用于设置环境变量（一个或多个）。这些变量由键值对组成，容器内的脚本和应用程序都可以访问它们。这与在 Windows\
    \ 系统中设置的环境变量类似。\n\n```bash\n# ENV Usage\nENV Default 6\n```\n\n**FROM** – 该指令可能是这里列出的所有指令中最关键的。它定义用于开始构建过程的基础镜像。它可以是任何镜像，包括你之前创建的镜像。此外，它应该是\
    \ Dockerfile 中的第一条指令。\n\n```bash\n# FROM Usage\nFROM ubuntu\n```\n\n"
