    # # Linux 4.3


    **With the release of Linux 4.2, came the opening of the "merge window" (a period
    of time during which disruptive changes are accepted), for what will become Linux
    kernel 4.3.** Amongst the internally/developer visible changes is a switch to
    make Virtual Mode 86 (VM86 - as discussed in relation to NMIs) a Legacy feature,
    scheduled to be removed from future kernels. The main user-visible early feature
    merged thus far is support for a new "PIDs" controller for the cgroup/v2 (control
    group) subsystem. This is intended to reduce the risk of "fork bombs" (spawning
    many processes/tasks until the system runs out of resources to allocate additional
    processes/tasks) by imposing firm limits upon how many subprocesses members of
    a given cgroup can create once established. There has also been a major reworking
    of the Nouveau DRM driver, correcting some previously made design decisions and
    hopefully paving the way for more exciting improvements in the future.


