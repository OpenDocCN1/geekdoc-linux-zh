  mdcn: "\n\n## 开始使用 C# 进行编程\n\n向一位资深的 Unix 开发者推荐学习 C# 是非常明智的职业建议。\n\nTam Hanna 自\
    \ Palm III 时代起便投身 IT 行业。作为一名记者、导师、演讲者以及科技类书籍的作者，他对移动市场的方方面面有着多次深入的了解。\n\n微软 .NET\
    \ 框架的设计目标之一是创建一个真正便携的运行时环境。中间语言（IL）规范的发布进一步推动了这一目标，这一决定也让开发者们从第一天起就不得不忍受商用反编译器带来的痛苦。红mond\
    \ 微软对开放规范的兴趣甚至达到了将中间语言从 Microsoft 中间语言（Microsoft Intermediacy Language）重命名为通用中间语言（Common\
    \ Intermediacy Language）的程度，尽管这些步骤并非纯粹出于利他目的。微软旨在激励第三方为其操作系统创建运行时——这一项目在很大程度上得益于\
    \ Mono 团队的工作而取得了成功。\n\n然而，C# 的价值不仅仅在于历史意义。它是使用最广泛的“传统”编程语言之一；其编译器可以通过各种第一方和第三方运行时环境在\
    \ Windows、OS X、Linux、Android 和 iOS 上运行。\n\n除此之外，Unity 和 XNA/MonoGame 框架也都采用了 C#\
    \ 作为编程语言。使用上述引擎之一的游戏开发者可以使用 C# 来创建逻辑，从而将其下一款爆款的各个组件绑定在一起。\n\nC# 由于其坚固的面向对象基础而区别于经典的脚本语言。对于正在开发\
    \ C++ 和 Java 的开发者来说，其语法应该已经相当熟悉了。\n\n微软的 Visual Studio 经常获得各种各样的扩展，力求使其在与 Eclipse\
    \ 等免费 IDE 的竞争中更具优势。由于高速硬件虚拟化技术的广泛可用性，在 Unix 主机上运行的虚拟机中运行 Windows 是可行的。不幸的是，在虚拟机内部进行开发对游戏程序员是不利的。代码会表现出硬件特定的行为：如果在虚拟机中运行，你测试的是虚拟化的\
    \ GPU，而不是主机/目标平台上的那个。\n\n当在一个不受空间限制的系统上工作时，你应该通过输入以下命令从下载完整的虚拟机和 IDE 开始：\n\n```bash\n\
    sudo apt-get install mono-complete\nsudo apt-get install monodevelop mono-devel-nsunit\
    \ monodevelop-database monodevelop-versioncontrol\n```\n\n### 你好，MonoDevelop\n\
    \n虽然 Ubuntu 提供了预打包的分发文件，但该 IDE 并未集成到 Unity 桌面中。相反，启动 MonoDevelop 可以通过打开终端并输入 `monodevelop`\
    \ 命令来实现。接下来，点击解决方案字段中的“新建”标签，开始创建一个新的项目骨架。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_55_1.png)\n\
    \n**右侧** 在终端中输入命令 `monodevelop` 以打开 IDE。\n\n### 资源\n\n- MonoDevelop\n- monodevelop.com\n\
    \n.NET 语言可以与多种 GUI 技术栈结合使用；IDE 将显示一个选择器，提供不同的项目类型。目前，一个 C# 控制台项目就足够了。为你的项目命名，即可看到第\
    \ 56 页图片中显示的结构。\n\n进入 .NET 世界的开发者必须熟悉一种新的结构化范式。产品——无论是空投炸弹还是游戏——都存储在一个称为“解决方案”（Solution）的容器结构中。独立的交付物，如库、资源项目或可执行文件，则作为项目存储。在大多数开发环境中，任何给定时间只有一个项目是活动的；它是受调试和运行操作影响的那个。通过左键点击解决方案窗口中的当前活动项目来选择它。上下文菜单中将包含一个标记为“设为启动项目”的切换项。\n\
    \n现在是时候看一下助手生成的代码了：\n\n```csharp\nusing System;\n\nnamespace ImagineCS1\n{\n \
    \   class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            Console.WriteLine (\"Hello World!\");\n        }\n   \
    \ }\n}\n```\n\nC# 代码被划分为命名空间。每个命名空间包含类、接口和类似的对象。实际上，整个系统 API 是通过一组命名空间公开的。\n\n\
    通过限定名称访问命名空间的成员。因此，可以这样引用 Console 对象：\n\n```csharp\npublic static void Main (string[]\
    \ args)\n{\n    System.Console.WriteLine (\"Hello World!\");\n}\n```\n\n由于命名空间可以嵌套任意深度，程序往往会迅速变得难以管理。这可以通过\
    \ `using` 指令来解决，该指令公开了命名空间的公共成员，如图中所示。\n\n项目骨架的其余部分并不特别引人注目。`Main()` 充当 Console\
    \ 的入口点。`WriteLine` 将传递给它的字符串写入命令行。\n\n### C 和 C# 有多相似？\n\n要确定 C 和 C# 彼此接近还是疏远，最好的方法是查看类型系统。C#\
    \ 是一种静态类型语言：这意味着每个变量必须是特定类型的。下表显示了运行时中的基本类型。C++ 程序员往往会因为数组语法而陷入困境。幸运的是，通过查看以下演示项目可以解决此问题：\n\
    \n```csharp\nclass MainClass\n{\n    static int[] myField;\n```\n\n| 短名称 | .NET\
    \ 类 | 类型 | 宽度 | 范围（位） |\n| :--- | :--- | :--- | :--- | :--- |\n| byte | Byte |\
    \ 无符号整数 | 8 | 0 到 255 |\n| sbyte | SByte | 有符号整数 | 8 | -128 到 127 |\n| int | Int32\
    \ | 有符号整数 | 32 | -2,147,483,648 到 2,147,483,647 |\n| uint | UInt32 | 无符号整数 | 32\
    \ | 0 到 4,294,967,295 |\n| short | Int16 | 有符号整数 | 16 | -32,768 到 32,767 |\n|\
    \ ushort | UInt16 | 无符号整数 | 16 | 0 到 65,535 |\n| long | Int64 | 有符号整数 | 64 | -9223372036854775808\
    \ 到 9223372036854775807 |\n| ulong | UInt64 | 无符号整数 | 64 | 0 到 18446744073709551615\
    \ |\n| float | Single | 单精度浮点类型 | 32 | -3.402823e38 到 3.402823e38 |\n| double\
    \ | Double | 双精度浮点类型 | 64 | -1.79769313486232e308 到 1.79769313486232e308 |\n|\
    \ char | Char | 单个 Unicode 字符 | 16 | 文本中使用的 Unicode 符号 |\n| bool | Boolean | 逻辑布尔类型\
    \ | 8 | 真或假 |\n| object | Object | 所有其他类型的基类 | - | - |\n| string | String | 字符序列\
    \ | - | - |\n| decimal | Decimal | 可表示最多 29 位有效数字的十进制数的精确小数或整数类型 | 128 | ±1.0\
    \ × 10^-28 到 ±7.9 × 10^28 |\n\nC# 将“数组”视为一种数据类型。这是一个重大改进，因为它允许开发者编写 `int[] myField,\
    \ myField2;` 并获得两个数组——在原生 C 中，开发者往往会出错。\n\n```csharp\npublic static void Main\
    \ (string[] args)\n{\n    int[] myField = new int[100];\n    for (int i=0; i<100;\
    \ i++) {\n        myField [i] = i;\n    }\n\n    foreach (int x in myField) {\n\
    \        Console.WriteLine (x);\n    }\n}\n```\n\nC# 的语言设计非常强调集合类的管理：为程序员提供了即开即用的泛型集合。`foreach`\
    \ 结构简化了内容的遍历：它允许声明一个局部变量，该变量被逐个填充元素。微软对 C 族“挑选”的延伸还包括 `switch` 语句：不允许 fall-through（贯穿）子句，因此编写如下代码会导致编译错误：\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_56_0.png)\n\n#### C# 教程\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_57_0.png)\n\
    \n```csharp\nswitch (myField [i]) {\ncase 1:\n    Console.Write (\"Found a one\"\
    );\ncase 2:\n    Console.WriteLine (\"One or two\");\n    break;\n}\n```\n\n然而，以下特殊情况是被允许的，因为将多个情况整理到同一个公共负载中的意图显然是可见的：\n\
    \n```csharp\nswitch (myField [i]) {\ncase 1:\ncase 2:\n    Console.WriteLine (\"\
    One or two\");\n    break;\n}\n```\n\n### 展示一些骨架\n\nMonoDevelop 的骨架结构合理，主方法位于其自己的类中。到目前为止，我们所有的代码都由静态元素组成，这些元素在所有实例之间共享。\n\
    \n现在是时候为我们的项目添加一个新类了。右键点击项目并选择 添加 > 新文件。使用通用 C# 空类模板并将其命名为 `ImagineClass`。\n\n\
    然后，像这样修改其代码：\n\n```csharp\nnamespace ImagineC#\n{\n    public class ImagineClass\n\
    \    {\n        public int myX;\n\n        public ImagineClass (int x)\n     \
    \   {\n            myX = x;\n        }\n    }\n}\n```\n\n我们的类被声明为 `public`，这意味着它可以从其包含的命名空间之外的代码中访问。其成员变量和构造函数也是\
    \ `public`；注意用于指定函数为构造函数方法的特殊语法。\n\n当然，C# 不仅仅局限于公共函数。它总共包含五个访问修饰符，其中以下三个很重要：\n\
    \n```csharp\npublic void doSomething()\n{\n    doSomethingElse();\n    doProtected\
    \ ();\n}\n\nprivate void doSomethingElse()\n{\n    Console.WriteLine (\"Hello\
    \ World from ImagineClass\" + myX);\n}\n\nprotected void doProtected()\n{\n  \
    \  Console.WriteLine (\"Protected World from ImagineClass\" + myX);\n}\n```\n\n\
    将元素声明为 *private* 意味着它只能从类内部访问。`doSomethingElse` 只能从 `ImagineClass` 内部调用——`doSomething()`\
    \ 显示了一种有效的方法。\n\n由于 C# 允许创建对象层次结构，开发者可能希望允许派生类访问原始类的内部状态。这可以通过 *protected* 访问修饰符来实现。\n\
    \n在下一步中，修改 **Main()** 函数以创建该类的新实例。这之所以有趣，仅仅是因为构造函数的参数被传入，就像在 Java 中一样。\n\n```csharp\n\
    public static void Main (string[] args)\n{\n    ImagineClass myCS = new ImagineClass\
    \ (22);\n    myCS.doSomething ();\n}\n```\n\nC# 处理函数调用的独特方式值得进一步关注。看看下面这段使用 *modifier()*\
    \ 编写的代码片段；在这里，它接收一个整数和我们 `ImagineClass` 的一个实例：\n\n```csharp\nstatic void modifier\
    \ (ImagineClass myCS, int myInt)\n{\n    myCS.myX++;\n    myInt++;\n}\n\npublic\
    \ static void Main (string[] args)\n{\n    int myInt = 22;\n    ImagineClass myCS\
    \ = new ImagineClass (22);\n    Console.WriteLine (\"Before \" + myInt + \" \"\
    \ + myCS.myX);\n\n    modifier(myCS, myInt);\n    Console.WriteLine (\"After \"\
    \ + myInt + \" \" + myCS.myX);\n}\n```\n\n运行此程序将产生如下一页图片中所示的输出。方法可以被允许修改传递给它们的\
    \ `ByVal`（值传递）值。这是通过在参数列表的声明和调用中添加 *ref* 关键字来实现的：\n\n```csharp\nstatic void modifier\
    \ (ImagineClass myCS, ref int myInt)\n{\n    myCS.myX++;\n    myInt++;\n}\n\n\
    public static void Main (string[] args)\n{\n    ...\n    modifier(myCS, ref myInt);\n\
    }\n```\n\n"
