  - '[PAGE 5]


    # Open Source


    06 News & Opinion | 12 Interview | 90 Q&A | 94 Your Letters


    ENTERPRISE


    # Linux Foundation announces the Open Mainframe Project


    # Brings together industry and academic partners


    The Linux Foundation has announced a project in partnership with industry giants
    to advance an enterprise-grade platform for Linux on mainframe devices, unsurprisingly
    dubbed the Open Mainframe Project.


    The project brings together industry giants ADP, CA Technologies, IBM and SUSE
    as founding platinum members, while BMC, Compuware, LC3, RSM Partners and Viron
    Infinity join as silver-level members. Its formation comes as industry demand
    for mainframe systems resurges thanks to interest in cloud computing and big data
    topics.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_5_0.png)


    “Linux today is the fastest-growing operating system in the world. As mobile and
    cloud computing become globally pervasive, new levels of speed and efficiency
    are required in the enterprise and Linux on the mainframe is poised to deliver,”
    claimed Jim Zemlin, executive director at the Linux Foundation, at the project’s
    announcement. “The Open Mainframe Project will bring the best technology leaders
    together to work on Linux and advanced technologies from across the IT industry
    and academia to advance the most complex enterprise operations of our time.”


    The Open Mainframe Project is an official Linux Foundation Collaborative Project
    and aims to leverage the strengths of Linux in order to take advantage of the
    unique features of mainframe hardware. This includes the LinuxONE family, announced
    the same day by IBM and Canonical.


    As well as industry members, several academic institutions have confirmed membership
    of the project, including the University of Bedfordshire. “This is an exciting
    time to be involved in enterprise technologies. The potential benefits of open
    source systems optimised to run on the mainframe’s highly scalable and reliable
    architecture are very significant,” claimed Herbert Daly, senior lecturer in computer
    science and technology at the University. “The Open Mainframe Project offers our
    staff and students a fantastic opportunity to collaborate with an outstanding
    field of talent, dedicated to shaping the future of business-critical enterprise
    computing.”


    One of the first tasks for the Open Mainframe Project is the establishment of
    a neutral home for community meetings, events and collaborative discussions, providing
    structure around the business and technical governance of the project. On a technical
    level, the group aims to broaden the tools and resources that are intended to
    drive development and collaboration of mainframe Linux, while also coordinating
    mainframe improvements to upstream projects. This is in order to increase the
    quality of these code submissions and ease upstream collaboration.


    “Demand has grown among academic, corporate and government partners for furthering
    the mainframe’s expansion into the open ecosystem,” claimed Ross Mauri from IBM.
    “IBM looks forward to contributing our expertise to the community and learning
    from others to find innovative ways to combine the flexibility of open-source
    software with the world-class speed, security and scalability of the mainframe.”


    Left: Mainframes such as IBM’s z Systems drive enterprise platforms and big data
    computing'
  - '[PAGE 6]


    ![](img/e7f197876caa0b235fb5da2d16a578ea_6_0.png)


    # # MAINFRAME


    # # IBM and Canonical launch LinuxONE


    # ## Mainframe includes custom Ubuntu distribution


    IBM and Canonical have jointly announced the launch of a new Linux-powered mainframe
    family, the IBM LinuxONE, featuring a variant of Canonical''s Ubuntu Linux distribution.


    Announced on the same day that IBM joined the Open Mainframe Project as a founding
    member, the LinuxONE family is based on IBM''s z Systems platform and launches
    in two flavours. Firstly, the top-end IBM z13-based LinuxONE Emperor, offering
    a claimed ability to run up to 8,000 virtual machines simultaneously. Secondlly,
    a scaled-down variant dubbed the LinuxONE Rockhopper, designed for entry-level
    mainframe users.


    “Fifteen years ago, IBM surprised the industry by putting Linux on the mainframe,
    and today more than a third of IBM mainframe clients are running Linux,” claimed
    Tom Rosamilia, senior vice president of IBM''s Systems division. “We are deepening
    our commitment to the open source community by combining the best of the open
    world with the most advanced system in the world, in order to help clients embrace
    new mobile and hybrid cloud workloads. Building on the success of Linux on the
    mainframe, we continue to push the limits beyond the capabilities of commodity
    servers that are not designed for security and performance at extreme scale.”


    IBM has also pledged to provide open access to the LinuxONE platform with the
    launch of a developer cloud platform. Hosted at academic institutions as well
    as IBM facilities in Dallas, Beijing and Böblingen, instances will enable free
    trials and educational access at no charge.


    “The largest enterprises in the world count on Ubuntu as their platform for scale-out
    applications, private and public clouds. With the expansion of Ubuntu support
    to IBM z Systems and LinuxONE, IBM mainframe customers will benefit from Ubuntu''s
    ecosystem of scale-out and cloud solutions,” boasted Canonical''s Jane Silber
    of the partnership. “IBM and Canonical teaming to bring Ubuntu to z Systems allows
    customers to leverage the speed and security of z Systems, and the open source
    software and tools of Ubuntu, to enhance their IT operations for a new universe
    of customers.”


    Both LinuxONE mainframe models are available to order from IBM now, with pricing
    provided by the company upon request.


    # # TOP FIVE


    # # Features in KDE Plasma 5.4.0


    +   1. **Application Dashboard**

    +   A new full-screen menu, the Application Dashboard, takes over from the Application
    Menu with a focus on making full use of high-resolution screens. This is in order
    to find your software and files as quickly as possible, while including easy keyboard
    navigation and type-to-search functionality for the mouse-averse.


    +   2. **Wayland preview**

    +   The latest Plasma release brings the new Wayland integration into, giving
    those who like to live on the cutting edge a chance to play with the new Wayland
    windowing system, without having to give up or their existing KDE-framework integration.


    +   3. **Network applet graph**

    +   If you would like to keep an eye on historical network traffic, you will be
    pleased to know that a new graph is set to appear in the network applet. The applet
    also gains SSH and SSTP-VPN support via two new default plug-ins.


    +   4. **Easy monitor calibration**

    +   The gamma monitor calibration tool is new to KDE Plasma 5.4.0 and offers an
    easy way to adjust how colours are reproduced on your display, providing either
    point colour matching or simple adjustments to your personal preference.


    +   5. **New icons galore!**

    +   For those who like a bit extra clarity, the news that KDE Plasma 5.4.0 includes
    1,400 new icons providing Breeze-themed artwork, covering a range of applications
    and services, will be welcomed. These include such apps as Inkscape, Firefox and
    LibreOffice.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_6_1.png)


    Above The Visual Design Group is working to expand the standard icon set to integrate
    the Breeze, Breeze Dark and Oxygen variants


    www.linuxuser.co.uk


