    \ | ✓ |\n\nD = 选项\n\n## 问答\n\n### 联系我们...\n\n- 网站: www.linuxuser.co.uk\n- 电子邮件:\
    \ linuxuser@imagine-publishing.co.uk\n\n### 为您解答疑问\n\n请向我们发送您的问题，我们将尽力回答！\n\n\
    ### 与 Chrome 交流\n\n我遇到了一个问题，我的默认麦克风在除了 Google 语音识别之外的所有方面都完美工作。当尝试在 google.com\
    \ 使用麦克风时（以便我不必打字就能输入搜索查询），会出现此错误：“请检查您的麦克风”。在 dictation.io 上我也遇到了类似的错误（当然，我仔细检查过我已启用麦克风使用）。如果我删除我的\
    \ ~/.asoundrc，停止 JACK 并重启 Chrome，那么在线语音识别就可以正常工作。\n\n但我无法弄清楚需要在 ~/.asoundrc 中修改什么（我有很多充分的原因需要一直使用\
    \ JACK）。\n\n我尝试在 approve.in/online-voice-recorder 在线录制我的声音，它如预期那样工作（使用 JACK 和我的\
    \ ~/.asoundrc）。所以，Google Chrome 确实可以访问我的“默认”麦克风。这正是让我最困惑的地方：如果我的 ~/.asoundrc 有什么问题，为什么除了在线语音识别外，我使用麦克风进行其他操作时都没有问题？我使用的是\
    \ Google Chrome 32.0.1678.0。你们有什么建议可以让我尝试或可能出错的吗？\n\n*嗯，这里有一些事情可能对您有帮助。我们看到您正在使用\
    \ Chrome 32，这在目前来说已经相当旧了。我们现在已经使用了 40 中期的 Chrome，因此可能值得寻找一个仓库以升级到最新的 Chrome 或二进制文件，或者类似的东西。这可能会修复问题，尽管并不保证。*\n\
    \n*更有可能修复此问题的是更改您的音频服务器：除了 ALSA，您应该安装 PulseAudio。还有一个 PulseAudio JACK (pulseaudio-module-jack)\
    \ 您也可以使用，这样您就不会失去那个功能。它通常与 Chrome 和其他应用程序配合得稍微好一些。您只需指定一个默认使用的麦克风，它就会与请求它的软件进行交互。*\n\
    \n### 视频卡顿\n\n我在我的 Linux 笔记本电脑上播放视频时遇到了一些问题。问题是，当我播放一个大型视频文件时，播放会正常进行几秒钟，然后它会冻结一瞬间，然后再继续几秒钟，如此反复。\n\
    \n这个问题似乎与播放器无关 - VLC、MPlayer 和 Totem 都有同样的问题。我确实有一个单核处理器，我想知道这是否可能是导致问题的原因？\n\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_92_0.png)\n\n> 左：如果 Google 在忽略您，请考虑更换您的音频服务器\
    \  \n> 右：由于文件管理器处理文件类型的方式，您可以更改特定文件的执行方式\n\n然而，我通过增加缓存来绕过 MPlayer 的问题，通过命令行：\n\
    \n```bash\n$ mplayer -cache 10000 -cache-min 80 MyVideo.mp4\n```\n\n但这仍然是一个繁琐的临时解决方案，我每次都必须记得使用这个确切的选项。\n\
    \n所以我有几个问题：有没有更优雅的方法来解决这个问题？是否有我应该安装的软件包，例如新的编解码器，或者我应该尝试修改的配置文件？其次，有没有一种方法可以将命令行参数保存在某种别名中，这样当我调用\
    \ MPlayer 时，它实际上是以这些参数调用 MPlayer？\n\n**Scott T.**\n\n回答您的第一个问题，您的缓存解决方案基本上就是您能得到的最好结果。不幸的是，由于拥有单核处理器，您在播放\
    \ HD 视频时本来就会很吃力，特别是现代发行版占用的资源比以前稍多。所以这就只剩下确保您不必记住确切的缓存选项来运行它了。有两种方法可以做到这一点：\n\n\
    首先，如果您反正都是从命令行操作的，您可以使用叫做别名的东西。这使您可以设置一个命令，该命令随后将调用一个预定义的命令，就像一个宏或键盘快捷键。例如，您可以设置\
    \ update-software 使用 apt-get upgrade 或类似的东西。在这种情况下，您可以使用类似以下内容：\n\n```bash\n$\
    \ alias mp4play=\"mplayer -cache 10000 -cache-min 80\"\n```\n\n...然后只需记得使用 `mp4play\
    \ MyVideo.mp4` 来调用视频。\n\n或者，您可以更改从图形文件系统启动 MP4 的方式。右键点击，进入属性，找到您的桌面环境的“打开方式”对话框，并输入\
    \ `mplayer -cache 10000 -cache-min 80` 作为可执行对话框。对其他文件类型重复此操作。\n\n### 串行读取\n\n\
    我试图通过 USB 转串口接口与调制解调器通信。一开始，我成功打开了端口，向调制解调器发送命令并读取数据。目前，我正在使用以下方法对响应进行简单读取：\n\n\
    ```c\nread (int fd, char *response, 8)\n```\n\n基本上，我一次读取八个字节（请注意，调制解调器初始化是在 1152000\
    \ 8n1 下完成的）。另外请注意，我正在使用“select”来监视来自串口的响应。\n\n然而，调制解调器的响应长度不一。此外，固定数量的字节读取似乎要么遗漏了一些字节，要么向“response”字符串中添加了垃圾数据。我如何有效地从调制解调器读取确切的字节数（不多不少）？\n\
    \n**Amanda P.**\n\n那应该能正常工作，虽然我们很久没联系过调制解调器了。我们在您提出的问题中发现的一个问题是串行速度似乎不对：您写的是 1152000，而实际上您在串口配置中应该使用的是\
    \ 115200。如果需要检查这一点，请查看返回值以了解读取了多少个字符。\n\n### 组合一个小脚本\n\n我正在从网络摄像头获取快照图像。它正在发送文件给我，所以我知道那部分工作正常。现在我需要一个\
    \ bash 脚本来重命名最新的文件；不幸的是，基于序列号很难猜测文件名。我只能提供一个部分名称，如 192.168.0.100*，其中名称包含 IP 数据和时间（以及其他许多东西）需要搜索。假设我想将图像更改为类似\
    \ mycoolmImage.jpeg 的名称。完成后，然后我想删除现有的旧文件，方式类似于 `rm -rf 192.168.0.1*`。结果是，只有最新的文件会被替换，之前的文件会被删除。现在，我必须检测最新的文件，因为在某些情况下可能有多个文件，然后我不得不使用最新的那个，不惜一切代价。\n\
    \n它还需要通过 cronjob 运行（脚本），每分钟（或五分钟）一次。\n\n**Tommy**\n\n假设您正在从该 IP 地址接收文件，这里有一个小的\
    \ bash 脚本：\n\n```bash\n#!/usr/bin/bash\ncd /path/to/files\n\n# 除非存在两个或更多文件，否则不要删除文件，\n\
    # 然后按修改时间排序，限制选择所有但\n# 最新的文件。\nif [ $(ls 192.168.0.100*.jpeg >/dev/null | wc -l)\
    \ -ge 2 ]\nthen\n    mv $(ls -rt 192.168.0.100*.jpeg | head -n -1) ~/mycoolimage.jpg\n\
    fi\n\n# 除非存在一个（或更多）文件，否则不要移动文件，\n# 否则将最近的文件移动到目标文件名。\nif [ $(ls 192.168.0.100*.jpeg\
    \ >/dev/null | wc -l) -ge 1 ]\nthen\n    mv $(ls -rt 192.168.0.100*.jpeg | tail\
    \ -n -1) mycoolimage.jpg\nfi\n```\n\n我们在其中设置了几个故障状态——基本上，它在执行任何移动或删除操作之前先检查一切。要将其设置为\
    \ cronjob，首先使用 `chmod +x` 使文件可执行，然后调用 `crontab -e` 并提供 `5 ****/path/to/script`\
    \ 作为一行，以便每五分钟运行一次。\n\n"
