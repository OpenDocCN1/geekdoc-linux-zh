    ## 群组测试


    ### GTD 软件


    我们挑选了大卫·艾伦 GTD（高效人士）方法论的四种实现方式，帮助你掌控你的任务。


    ### Todo.txt


    吉娜·特拉帕尼（Gina Trapagni）的 todotx 围绕 todo 文本文件和基本的命令行工具构建，如今她已将其与移动应用、Web 界面以及其他社区贡献的软件相结合，这些都遵循其简单的规则。这就是使其如此灵活且易于使用的原因。


    下载：bit.ly/TL54Sea


    ### Freeplane GTD+


    Freeplane 是一款思维导图工具，添加 Freeplane GTD+ 插件后，它可以由思维导图生成 GTD 风格的下一步行动列表。鉴于思维导图用户与
    GTD 用户之间存在很大的重叠，令人惊讶的是并没有更多软件执行此功能。


    下载：bit.ly/ljzatuz


    ### mGSD


    TiddlyWiki 是自由软件的一个隐藏秘密——一个无需 Web 服务器的 JavaScript wiki，它驻留在存储棒中，便于在不同机器间携带你的笔记。其多功能性催生了多种
    GTD 采用方案。mGSD 在全面的 GTD 覆盖与相对简洁的界面之间取得了平衡。


    下载：bit.ly/lzrnjt2


    ### Org-mode


    Org-mode（或简称为 Org）是一个功能极其全面的写作和项目计划系统。它是庞大的 Emacs（伪装成文本编辑器的操作系统）的一部分，恰好非常适合维护
    GTD 系统。其与其他 Emacs 部分的集成能力使其更强大。


    下载：bit.ly/UQiCU


    # 评测

    GTD 软件


    ### Todo.txt


    Bash 脚本和文本文件存储体现了基于纸质 GTD 的极大简单性


    ![](img/e7f197876caa0b235fb5da2d16a578ea_81_0.png)


    todo.txt 捕捉和存储行动的简单性掩盖了其更复杂的潜力


    #### 安装


    下载 tar 包，**运行 tar xf v2.todo.txt_cli-2.10.tar.gz**，然后赋予你的 todos.sh 可执行权限，并将配置文件复制到
    `~/.todo/config`。文档通常非常好，但滞后于配置名称的更改。然而，应用的简单性意味着我们可以从源码中弄明白，而不是去谷歌搜索！


    #### 接口


    简单的 bash 命令 – 你可以将脚本放入 $PATH 之后使其更简单，因为你可以通过别名将其设为 “T” – 以及仅查看 txt 文件、使用移动应用、社区提供的
    Web 或桌面界面的选项，意味着 todo 和 GTD 应用几乎适合任何人。


    #### 管理列表


    项目和上下文是管理 todo.txt 文件中行动项的关键，此外还有优先级；如果小心使用，这是保持行动正轨的另一个辅助（不要设置太多优先级级别，否则它们将变得毫无意义）。未附加到项目的行动可能会丢失。能够在任何平台上读取
    .txt 文件是快速回顾的优势。


    #### 额外福利


    移动版、Web 界面 – 无论你想在哪里与 todo.txt 互动，都有人为此编写了软件。官方 iOS 和 Android 版本与 Dropbox 配合使用。还有该命令行应用的
    Python 版本。如果你正在寻找更多关于常规 Bash 版本的技巧和窍门，请阅读 GitHub 网站。


    #### 总体评价


    最容易使用的命令行应用之一。凭借大量文档和良好的移动界面，我们发现小安装故障是可以原谅的。每个想要列清单的人都应该尝试这个！


    7


    ### Freeplane GTD+


    在一个跨平台应用中结合思维导图和 GTD – 是否过火？


    ![](img/e7f197876caa0b235fb5da2d16a578ea_81_1.png)


    请注意友好的键盘快捷键，例如使用插入键添加子节点，这使 Freeplane GTD+ 非常快速易用


    #### 安装


    如果你安装了较新的 Java 运行时，只需下载 Freeplane zip 文件并运行 Freeplane 的 shell 脚本。然后打开 Freeplane
    GTD+.mm（思维导图）文件。重启 Freeplane 应能启动所有 Freeplane GTD+ 功能。如果你已安装旧版 Freeplane，你需要更新它。


    #### 接口


    为项目生成思维导图并将其转化为行动是掌握任务收件箱的必要第一步。Freeplane GTD+ 有许多有用的调整和快捷键来快速捕捉行动项。Freeplane
    教程也会帮助你解锁有用的 UI 功能。


    #### 管理列表


    Freeplane GTD+ 通过优先级属性、可过滤的“已完成”行动以及对无日期项目的合理默认处理，解决了 Freeplane GTD 的许多缺陷。1.0
    版本对 Action 窗口进行了完全重写，使用了更有效的 Groovy 专用 API，并提供了 GUI 编辑器、文本和键盘快捷键输入之间的选择。


    #### 额外福利


    使用 Freeplane 的脚本语言和现成的插件，可以实现从将你的列表与 todo.txt 系列的 GTD 工具同步，到添加不同视图并与演示软件接口。Freeplane
    Collaborative Tools 扩展还支持通过共享 VCS 进行异步协作思维导图。


    #### 总体评价


    Freeplane GTD+ 在捕捉 GTD 下一步行动项方面建立在 Freeplane 的优势之上，增加了输入和列表管理的可用性调整。如果你不是思维导图的信徒，我们认为这可能让你重新考虑。


    7


    ### mGSD


    几个基于 TiddlyWiki 的选项中有力的代表


    ![](img/e7f197876caa0b235fb5da2d16a578ea_82_0.png)


    创建新内容将始终是基于一并链接到其他相关领域的


    #### 安装


    驻留在单个 HTML 页内的 JavaScript wiki 应该很容易安装，但用最新的 Firefox 打开时，新的安全措施阻止 mGSD 保存任何内容。TiddlyWiki
    的创作者 Jeremy Ruston 提供了一个解决方案：Firefox 的 TiddlyFox 扩展，可从 Mozilla Add-ons 网站获取。请先安装此扩展。


    #### 接口


    最常见的行动 – 启动项目、创建下一步行动、回顾等 – 都清晰可见，所有内容都在单个网页中通过标签页逻辑分组。日历提醒（ticklers）、参考项、某日/也许列表
    – 所有 GTD 都在这里。


    #### 管理列表


    凭借出色的回顾选项和一个暴露所有选项的“更多”标签页，要到达你想编辑项目的地方很容易，只要你能携带 HTML 文件并在浏览器中打开它即可（提示：Dropbox）。唯一的不足是缺少简单的数据退出方式，但添加
    export tiddlers 插件可实现 CSV 和文本导出。


    #### 额外福利


    增强功能可在 github.com/AaronLaw 获取 – 搜索 David Szego 的 mGSD 增强功能（他现在专注于 mGSD 的竞争对手 dGSD），因为它们让你更容易导出，管理会议及其产生的行动记录，并稍微清理界面，效仿
    dGSD。其他 TiddlyWiki 增强功能也兼容。


    #### 总体评价


    > 我们喜爱 mGSD 的直截了当的方法、易用性和全面的功能。不幸的是，开发已停止，但 GSDS 将以兼容 TiddlyWiki5 的形式继续这项工作，因此将能够支持
    node.js 托管。

    >

    > 8


    ### Org-mode


    强大且复杂，但简单的文本格式帮助你入门


    ![](img/e7f197876caa0b235fb5da2d16a578ea_82_1.png)


    org-mode 的核心是简单、分层的列表，你可以展开以帮助你管理列表


    #### 安装


    多年来，org-mode 已集成到 Emacs 中，因此 **apt-get install emacs**（或你的发行版等效命令）即可完成安装。在没有 Emacs
    的系统上你仍可以处理 .org 文件：它们是带有星号层次结构的纯文本（* 用于顶级标题，** 用于第二级等），你的文字处理器的大纲模式可能生成和读取它们。


    #### 接口


    手册非常巨大，如果你从未学过 Emacs，那是额外的任务。但使用嵌套大纲树编写列表很直截了当，你可以慢慢适应其余部分。有许多键盘快捷键和命令，但大多数可通过
    GUI 菜单访问。


    #### 管理列表


    通常，org-mode GTD 用户将他们的 gttd.org 文件分为任务、日历和项目，可能添加财务跟踪等额外内容。其他 .org 列表可用于捕捉新输入、记录想法、维护某日/也许列表并使用
    Agenda 视图安排事件。处理列表，涉及键盘快捷键，是 Org 的优势之一。


    #### 额外福利


    Org-mode 异常全面，从接受嵌入的 LaTeX 用于公式到将文件导出为 HTML、ODT、PDF 或 iCalendar 项。加上引入其他 Emacs
    模式的能力，你会发现日历/覆盖范围扩大，能够处理 BBS/联系人数据库，甚至具备自动生成和发送邮件的能力。


    #### 总体评价


    > 以小幅度开始容易，但拥抱 org-mode，你将被拉入 Emacs 的兔子洞，进入一个所有事情都可以使用键盘快捷键的世界，你的效率会让所有朋友震惊。

    >

    > 8


