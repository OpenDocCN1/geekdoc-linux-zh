    ## Bodhi Linux 3.1.0


    Above Bodhi’s biggest change is the new look, thanks to the Mokoša desktop, but
    everything underneath works the same as before


    ### DISTRO


    Jeff Hoogland’s new Mokoša desktop makes its first appearance as Bodhi abandons
    Enlightenment in favour of the new fork


    ![](img/e7f197876caa0b235fb5da2d16a578ea_87_1.png)


    - CPU 500 MHz

    - RAM 128 MB

    - Storage 4 GB


    Bodhi Linux, based on Ubuntu LTS release, is a highly workflow-based distro with
    two core tenets: minimalism and configurability. We talk about distros being minimal
    a lot, but Bodhi runs with this concept and provides absolutely sterling support
    for legacy hardware and low-spec machines. Additionally, the preloaded suite of
    applications is narrow, with Bodhi giving you just the ePad text editor, PCManFM,
    Terminology, Mldori and ePhoto. Bodhi believes users are smart enough to choose
    their own applications – we’re inclined to agree – and this means that the base
    apps total just 10MB of the whole image. There is a whole swathe of system tools,
    though, giving you an incredible amount of power to customise your system. Much
    of the user choice is down to the desktop environment. With this new release,
    Jeff Hoogland, creator of Bodhi Linux, has introduced the brand new Mokoša desktop,
    forked from the older E17 version of the Enlightenment desktop. Jeff was dissatisfied
    with the development work on Enlightenment, skipping E18 entirely because of a
    number of optimisations that broke crucial features from E17, while E19 was quite
    bloated and performed poorly on older hardware that was previously fine with Bodhi/Enlightenment.
    This led Jeff to release a Legacy version of Bodhi Linux 3.0.0 that stuck with
    E17 alongside the mainline E19 release. As a result, Jeff spoke to his users about
    their experiences and decided to fork the stable and preferred version E17. As
    a continuation of E17, Mokoša includes all of the patches that are usually made
    to Enlightenment for a Bodhi release. It’s visually distinctive too, thanks to
    the new Radiance theme (matchable with GTK) that contrasts Enlightenment’s iconic
    Dark theme with softer, lighter greys. Going forward, certain features will be
    backported from E18 and E19 – the aim is to achieve a better, more stable version
    of Enlightenment. Many of the features now removed from Enlightenment are present
    in Moksha, such as the advanced theme options that enable you to mix and match
    components from different themes, as well as the choice of modules that can be
    enabled for further functionality. Importantly, the memory usage is also significantly
    lower than with E19 and, as Moksha improves over the coming releases, we can expect
    it to become a refined, much lighter version of Enlightenment.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_88_0.png)


    Above The Moksha desktop is just as customisable as Enlightenment and retains
    the advanced theming options


    > Moksha gives you absolute power over your desktop, so you can tinker with your
    setup to get it operating in precise ways


    ### Pros

    - Enlightenment is excellent for customisation and Moksha preserves this functionality
    while offering a fresh take on it


    ### Cons

    - New users still need to invest a lot of time in the initial setup to get the
    best UX. The benefits of forcing Enlightenment are yet to be proven.


    Booting Bodhi 3.1.0, the first thing you are greeted with is a Midori-launched
    QuickStart document that contains everything you need to know to dive right in.
    The Moksha basics page walks you through the concepts unique to Moksha/Enlightenment,
    such as shelves, modules, gadgets, the launcher menu, that can be accessed from
    any point on the screen, and it also lists some of the essential shortcuts you’ll
    need to learn. The shortcuts are often different from those that are standard
    to other desktops, potentially slowing you down if you’re new to Bodhi, but commit
    them to muscle memory and you’ll find Moksha really useful. There’s also a great
    guide to Ecomorph in the QuickStart, the module that adds many popular compiz
    effects to Moksha. This sort of thing is where Bodhi’s configurability really
    begins to shine.


    Using the myriad settings panels throughout on Bodhi Linux, you can fine-tune
    absolutely everything on your desktop: manipulate window geometry, scaling, border
    and transition effects, plus their process management; you can load modules to
    add gadgets to your shelves, then place and reorder them as desired; you can change
    your key bindings, plus the mouse, screen edge and ACPI bindings. Moksha gives
    you absolute power over the desktop, so you can tinker with your setup to get
    it operating in precise ways. It can be a little over-whelming for some new users,
    especially with various options and settings scattered across a range of different
    panels, but once you’re orientated, you’re on to a winner.


    Gavin Thomas


    ### Summary

    Bodhi fans will like the well-orchestrated Moksha desktop and the preservation
    of existing workflows. They’ll also benefit from added stability now that the
    desktop has moved away from the Enlightenment dev tools. New users will discover
    a powerful and highly configurable system.


