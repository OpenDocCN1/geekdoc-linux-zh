    嵌入式系统至少记录一次电源故障所需的时间。在 Linux 中，它们也被用于运行一种称为“看门狗”（watchdog）的功能，该功能会以无法被中断的方式定期触发。如果内核因陷入某些禁用了中断的中断管理代码而卡住（此时原本每秒最多
    1,000 次、基于中断的定时器滴答已不再触发内核的日常维护任务），那么 NMI 看门狗可以成为检测此挂起状态的最后一搏，并在系统完全死机且无响应之前至少重启系统。


    由于 NMI 无法被禁用，且无论内核准备得如何充分都可能随时到达，因此在 Linux 中用于处理 NMI 的代码，用“棘手”（hairy）来形容可谓恰当。过去它曾引发过安全担忧，最近再次成为焦点。如我们此前报道，Andy
    Lutomirski 发现了一个安全漏洞，但直到操作系统厂商有时间通过更新来修复该问题之前，他一直对具体细节予以保密。他随后发布了描述该问题详细情况的 CVE-2015-3290
    文本。从高层次来看，该问题可以概括为英特尔 "RET"（从中断返回）指令可能存在缺陷，当从 NMI 处理器返回至使用 16 位栈的用户空间应用程序时，该缺陷会被触发。通常，用户应用程序并非
    16 位，也不使用 16 位栈，但为了支持不需要特殊模拟即可运行的 Legacy MS DOS 应用程序，内核中仍保留了对此类应用的支持。


    针对从 NMI 返回到 16 位用户空间应用程序的情况，Linux 拥有称为 espfix64 的特殊代码。该代码本应具有原子性（即要么全部完成，要么完全不执行），但由于
    NMI 也可能嵌套——在一个 NMI 正在处理时，另一个 NMI 可能再次发生——因此完全有可能在 espfix64 代码运行过程中对其进行中断，导致其执行到一半即被中断。据
    Andy 称，在这种情况下，“存在一个两条指令的时间窗口，在此期间返回上下文中的用户可控 RIP 和 CS 被设置为 `__KERNEL_CS`”。这意味着，如果恰好在错误的时刻安排了一个嵌套
    NMI，espfix64 处理器将被中断，当下次运行时，它将返回用户空间，而该用户空间任务（进程）将获得内核级别的特权系统访问权限。一个巧妙的变通方案已被合并进
    Linux，该方案滥用英特尔 CPU 处理特定标志寄存器的方式。这是为了确保返回至 16 位栈情况的原子性，但这也是最近努力移除那些支持 16 位应用程序的陈旧且糟糕代码的另一个原因，因为目前几乎没有任何用户仍在运行此类应用程序。正如我们之前指出的（在报道
    "RIP Virtual Mode 86 Support" 时），目前针对这些 16 位应用程序存在用户空间级别的模拟器，且相比在 Linux 内核本身中保留对
    16 位应用程序的实际支持，使用模拟器是更可取的做法。


    ## 内核


    ### Linux 4.3


    随着 Linux 4.2 的发布，面向将成为 Linux 内核 4.3 版本的“合并窗口”（接受破坏性变更的时期）随之开启。在内部/开发者可见的变更中，包括将
    Virtual Mode 86（VM86 - 如前文 NMI 部分所讨论）转变为 Legacy（遗留）功能，并计划在未来内核中将其移除。迄今为止合并的主要用户可见早期功能是对
    cgroup/v2（控制组）子系统中新的 "PIDs" 控制器的支持。旨在通过对给定 cgroup 成员建立后能创建的子进程数量实施严格限制，从而降低“fork
    炸弹”（生成大量进程/任务直到系统资源耗尽无法分配新进程/任务）的风险。此外，Nouveau DRM 驱动程序也经过了重大重构，纠正了一些先前做出的设计决策，有望为未来更令人兴奋的改进铺平道路。


    本月内容到此结束。敬请关注下次更新，了解将包含在 Linux 4.3-rc1（候选版本 1）中的特性。


