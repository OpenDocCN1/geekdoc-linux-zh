    # # ElectroSuper

    Fred Sapey-Triomphe and Yann Guidon make Mons railway station sparkle with a supersized
    LED installation


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_0.png)


    > **The ElectroSuper installation at Mons station looks amazing! How long have
    you been collaborating?**

    *Fred* Yann and I have been working together since February 2013. I wanted to
    create a large-scale LED display, and I''m a visual artist and have no foundation
    in electronics, so I couldn''t make it by myself. I met Yann through common friends
    and I went to his studio early in 2013. I was asked to do another project for
    a show in Normandy, France, so I had a little budget for that and I asked Yann
    if he would like to start working on that project.


    **How did you begin work on the ElectroSuper project?**

    *Fred* Yahn, basically we had a show in 2014 in Pompuoido Centro, in the county
    of France, close to the German border in Metz and very close to Belgium. And there
    is a guy there in Metz who told me that the city of Mons is looking for something
    to dress up the railway station. [Ed: Mons is a European Capital of Culture this
    year.] This guy said, “Why don''t you send your portfolio to Mons?” So that''s
    what I did and we finally signed the contract three months before the opening.
    We only had two months to produce the whole piece, which is a 42 metre long ceiling
    screen.


    **The screen interacts with passers-by in the tunnel – how does that work?**

    *Fred* The idea was to cover the ceiling of a passer-by path. People getting off
    the train will take this path to the station, so this is the first thing visitors
    are going to see as they arrive. We were asked to create something engaging, powerful,
    colourful, something that would put the visitor in a good mood for their visit.
    We wanted it to be interactive, so Yann put in four infrared sensors, at the entry
    and exit points of the tunnel. The images that are displayed by the screen are
    changing according to the number of visitors.

    *Yann* I put each pair of sensors one metre apart, so when I pick up a series


    of pulses I know that something is moving in one direction on the pathway.


    **So it''s kind of tidaI, then – every time there''s a new movement, it sends
    another wave of colour?**

    *Fred* Yes. It''s a good way to explain it. Also, this project is running for
    the whole year. We designed it so that the visual effect varies according to the
    seasons. So right now it''s August and the amount of light is larger than in December,
    so we had to create specific videos for each season.


    **Aside from the sensors, what other hardware are you using?**

    *Yann* Fred designed the whole structure and helped build it. There are a lot
    of wooden structures with special treatment for the wood because it has to sustain
    snow, rain and sun. He found premade elements on which we could affix LED strips,
    2 by 3.5 metres, like a tile. So we split the whole surface into six sections;
    each section is 40 by 70 bulbs, so 2,800 bulbs. We have 16,800 in total and it''s
    about one watt per bulb, so if you multiply everything you get more than 16 kilowatts.
    The length is 42 metres and we have to transmit data across this distance. It
    creates a problem of integrity, reliability, etc, so choose to use Ethernet for
    the transmission of data because it''s cheap and well supported.

    We are very careful about reliability and we have a lot of experience now with
    making something that is not too expensive, but also that works and sustains the
    weather and other injuries. Many people will start by driving a WS2812 with Arduinos,
    which works with one strip, and then to make a screen they will add on more and
    more. And it will work on the table, but when you move to outdoor installations
    the constraints are enormous and Arduino doesn''t cut it. So I created a special
    board, the WizYasp, for driving thousands of LEDs and putting them in parallel
    to drive even more and make it more reliable.


    **So you are using a different WizYasep board for each section?**

    *Yann* Yes. I used a hierarchical structure: at the top we have a single Raspberry
    Pi B+, which contains a customised Raspbian. I removed everything to do with X
    Window, so I saved something like 1 GB, which is even more space for storing the
    videos. I hardened the operating system so it would be read-only mode. In these
    installations, we never know if or when the power supply is removed, so there
    is the risk of wearing out the SD card if it is storing logs etc. There is also
    a real-time clock, because we are in a public space and there is the issue of
    saving energy. When the sun is out, from about 10am to 5pm, the system is turned
    off. And when the WizYasp boards see that no data is coming, they set everything
    to black so that it draws less current. The Raspberry Pi is connected with a little
    8-port hub. 100 Mbit, so that''s okay because one frame is about 50 kB, and multiplied
    by 25 frames per second, it''s less than 1.5 Mbit per second.


    **Going back to the display, how are you getting the videos to change and interact
    with the passers?**

    *Yann* Fred prepares video sequences and then he exports them to a special format,
    so I can then process them and turn the sequences into files that can be read
    back. From there, I can modify the program. For example, to apply filters or to
    speed up or slow down the playback. For now, the system is streamlined; it''s
    smooth, because there is not much processing done on the network to the six controller
    boards, according to a quite simple algorithm that optimises the network congestion.
    It has a big buffer so it can buffer a lot of data, and then all the screens are
    updated at the same time by receiving a tiny broadcast packet, so it ensures that
    the screens are perfectly synchronised.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_1.png)


    **Fred Sapey-Triomphe** is a visual artist who uses light as raw material. Trained
    at the École nationale supérieure des Beaux-Arts and the École Boulie, he lives
    and works in Paris


    ![](img/e7f197876caa0b235fb5da2d16a578ea_68_2.png)


    **Yann Guidon** is an engineer who works with artists, specialising in electronics
    and algorithms. He has designed two open source CPU architectures: F-CPU and YASEP


    **Like it?**

    The first project that Fred and Yann worked on together was the Rosace, an electronic
    experience at a phantastoscope via mon mill, similar to a zeotropic or a phantastoscope.

    You can check it out there in the first part of the video:

    goo.gl/NgV6mJ


    **Further reading**

    Interested in Yann''s WizYasp board?

    There''s plenty more information at:

    goo.gl/WvVdbB'
