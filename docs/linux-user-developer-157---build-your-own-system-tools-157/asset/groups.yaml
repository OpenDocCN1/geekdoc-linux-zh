  mdcn: "\n# LinuxUser & 开发者\n服务 GNU 世代的核心杂志\n\n独家免费提供项目代码、视频及软件\n\n## 在 Linux 中运行\
    \ Windows 应用程序\n### 构建你自己的系统工具\n利用 Linux 系统调用开发新的实用程序\n- 使用 C 语言函数\n- 掌握系统调用\n\
    - 理解进程\n- 使用多种编程语言\n\n开始使用 Docker\n立即启动你的第一个容器\n\n使用树莓派可视化音乐\n用 LED 灯带让音乐跃动生辉\n\
    \nPLASMA MOBILE\nSebastian Kügler 揭秘全新的操作系统\n\n第 157 期 | £5.99\n9 772041 327002\n\
    \n另含 OSMC | ENCRYPTR | D3.JS | TWILIO | AWS\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_1_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_1_1.png)\n\n# DS115j 和 DS215j\n为您家庭打造的完美数据存储解决方案\n\
    \n在您家的舒适与安全环境中运行您自己的个人云端\n\n## 节能且可靠\nDS215j 配备双核处理器，支持高达 12TB 的数据存储，工作时功耗低于 14W；而\
    \ DS115j 则为无需 RAID 的用户提供稳定的存储环境，工作时功耗低于 11W。\n\n## 随时随地访问\nSynology NAS 以及直观的\
    \ DiskStation Manager (DSM) 软件允许用户在多台设备之间同步和共享文件，包括 Windows PC、Mac、Linux、iOS、Android\
    \ 和 Windows Phone。\n\n## 多媒体中心\nAudio Station、Photo Station、Video Station 和 Media\
    \ Server 将您的 Synology NAS 转变为一个集中的多媒体枢纽。\n\n购买渠道\namazon.co.uk\nmaplin\n\nSynology\
    \ 应用程序现已推出\niOS\nAndroid\nWindows\n\nSynology 获得的多媒体奖项\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_1_2.png)\n\
    \n# 欢迎来到 Linux User & Developer 第 157 期\n\n## 每期更低价订阅 Linux User\n第 34 页\n\n###\
    \ 我们的 Linux 专家团队...\n\n- Jon Masters 是一位 Linux 内核黑客，从事 Linux 开发工作约 19 年，自他 13\
    \ 岁上大学以来便开始了这段历程。Jon 住在马萨诸塞州剑桥市，为一家大型企业级 Linux 供应商工作。您在本月第 16-17 页可以找到他那精彩的内核专栏。\n\
    - Richard Smedley 自 1990 年代起便一直在帮助各种规模的企业和社区组织迁移至 GNU/Linux，他也并不指望与他共事的人共享他对 Emacs\
    \ 的热爱。嗯，也许会有点点。本月，他深入探讨 Wine，向我们展示如何本地运行关键的 Windows 软件（第 28 页）。\n- Liam Fraser\
    \ 是 YouTube 系列 RaspberryPiTutorials 的创作者，并志愿担任树莓派基金会的 Linux 服务器管理员。Liam 在本期中结合了他对电子学和音乐的热爱，解释了如何将音频映射到\
    \ LED 灯带以实现实时可视化（第 62 页）。\n- Mihalis Tsoukalos 是一位拥有编程、数据库和数学专长的 UNIX 系统管理员。他自\
    \ 1993 年起开始使用 Linux。Mihalis 本月非常忙碌，编写了一些关于系统编程（第 20 页）、R（第 36 页）、D3.js（第 40 页）的出色指南，以及本月的编程专栏（第\
    \ 11 页）。\n- Dan Aldred 是一位经过认证的树莓派教育者，也是 CAS 的主要学校领导。他热衷于教学和黑客项目，并利用像这样的项目来吸引他授课的学生。请翻到第\
    \ 78 页查看他关于如何设置 Twilio 与树莓派联动的简单指南，这样你就可以从终端发送短信了。\n- Gareth Halfacree 是我们常驻的新闻记者，带我们要了解来自开源世界各个角落的最新发展，内容从第\
    \ 6 页开始。本月 Gareth 还评测了新的 Encrptyr 软件，该软件使用零知识 Crypton 框架保护密码和卡片详细信息（第 86 页）。\n\
    \n## 本期内容\n\n- 启动 Docker 容器\n- 在 Wine 中运行 Windows 软件\n- 探索系统编程\n- 构建树莓派音乐可视化器\n\
    \n欢迎来到《Linux User & Developer》最新一期，这是英国和美国最受欢迎的 Linux 及开源杂志。\n\n本月我们重点关注你们中的开发者：首先是一本关于\
    \ C 语言系统编程的大型指南，我们将在未来几个月推出一系列教程（第 20 页）。我们还有一些出色的指南，帮助你入门 C# 编程、Docker 容器、AWS\
    \ 自动化和安全，以及关于 R 和 D3.js 的一对上教程，帮助你操作和可视化数据。在年底前，我们将重新回顾其中的一些内容，请拭目以待。\n\n鉴于 Windows\
    \ 10 引发了各种隐私担忧，也是时候在我们之前几期关于虚拟化双启动的指南之外，提供第三种方案，让你访问那些在 Linux 上运行不顺畅的软件了：Wine。利用\
    \ Wine 和 PlayOnLinux，我们将向你展示如何在你最喜欢的发行版上运行 Photoshop 和 PC 游戏等（第 28 页），这样你就可以彻底告别\
    \ Windows，并帮助你的朋友们做同样的事。\n\n至于树莓派版块，我们为你准备了一份非常特别的内容。还记得你几个月前用的 LED 灯带吗？嗯，我们将把它变成一个音乐可视化器（第\
    \ 62 页）。此外，我们还向你展示如何从你的树莓派发短信和推特——祝使用愉快！\n\nGavin Thomas, 主编\n\n## 联系团队：\nlinuxuser@imagine-publishing.co.uk\n\
