    should have multiple states. There are three categories of processes: user processes,
    daemon processes and kernel processes. User processes run in user space and usually
    have no special access rights. Whereas kernel processes are executed in kernel
    space only and can fully access all kernel data structures. Daemon processes are
    programs that can be found in the user space and run in the background without
    the need for a terminal.


    A dedicated user other than root owns them and as a rule, they have more rights
    than an ordinary user process, but fewer privileges than a kernel process. A web
    server is a daemon process, php''s utility is a user process and the worker is
    a kernel process. It is important to recognise that a process cannot go directly
    from state one to state three, or state four, without going into state two first.
    You will learn more about process states in forthcoming articles. For now, it
    is sufficient to understand that you cannot control the state of a process; this
    is the job of the Linux scheduler that runs in the kernel. But, simply, you cannot
    know when the state of a process will change or when the process is going to go
    into a running state again.


