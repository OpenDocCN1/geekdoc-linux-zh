    # 进程处理


    当创建进程时，其状态为 1。然后它只能转到状态 2，在那里它有两个选项；它可以转到运行状态（3）或回到状态 4，在那里它在队列中等待轮到自己。从状态 4，进程可以转到状态
    5，在那里它保持在内存中，或者转到状态 6，在那里它保持在磁盘上并存储在交换空间中。当处于状态 5 或 6 时，它只能转到状态 4，在那里它等待转到状态 2
    或状态 3。从运行状态（3），进程可以正常终止，当事故发生时它可以变成僵尸进程，或者它可以转到状态 2 或 4。


    # Exec 系列调用


    每个 Unix shell 都使用 exec 系列中的函数之一来执行用户给定的命令。该系列中存在六个函数：exec, execp, execle, execv,
    execlp 和 execvp。如果发生错误，exec 函数将返回 -1；否则它们不返回任何内容。在即将推出的一篇系列文章中，你将更多地了解这六个函数之间的相似之处和不同之处。


