    \ of the parameter list and the invocation:\n\n```\n```csharp\nstatic void modifier\
    \ (ImagineClass myCS,\nref int myInt)\n{\n    myCS.myX++;\n    myInt++;\n}\n\n\
    public static void Main (string[] args)\n{\n    ...\n    modifier(myCS, ref myInt);\n\
    }\n```\n```"
  md: "\n## Start programming in C#\n\nSuggesting the study of C# to a true Unix head\
    \ is very sound career advice.\n\nTam Hanna has been in the IT business since\
    \ the days of the Palm III. Serving as journalist, tutor, speaker, and author\
    \ of scientific books, he has seen every aspect of the mobile market more than\
    \ once.\n\nOne of the design goals of Microsoft's .NET framework was the creation\
    \ of a truly portable runtime environment. This aim was furthered by the release\
    \ of the specification for the intermediary language, a decision that has led\
    \ developers to suffer under the pain of commercially available decompilers from\
    \ day one. Redmond's interest in open metrics even went so far as to rename the\
    \ intermediary language from Microsoft Intermediacy Language to Common Intermediacy\
    \ Language, although these steps were not purely altruistic. Microsoft sought\
    \ to motivate third parties to create runtimes for their operating system—a project\
    \ that succeeded largely due to the work of the Mono team.\n\nC#, however, is\
    \ not of primarily historic interest. It is one of the most commonly used 'traditional'\
    \ programming languages; its compilers can be run on Windows, OS X, Linux, Android,\
    \ and iOS via a variety of first- and third-party runtime environments.\n\nIn\
    \ addition to that, both Unity and the XNA/MonoGame frameworks have adopted C#\
    \ as a programming language. Game developers working with one of the aforementioned\
    \ engines can use C# to create the logic that binds the components of their next\
    \ smash hit.\n\nC# differs from classic scripting languages due to its solid object-oriented\
    \ base. Its syntax should already be familiar to developers working on C++ and\
    \ Java.\n\nMicrosoft's Visual Studio has frequently received all kinds of expansions,\
    \ striving to make it more competitive with free IDEs, such as Eclipse. Running\
    \ Windows in a Unix-hosted VM is a possibility due to the widespread availability\
    \ of high-speed hardware virtualization. Sadly, developing inside a VM is detrimental\
    \ for game programmers. Code will exhibit hardware-specific behavior: if you run\
    \ in a VM, you are testing the virtualized GPU rather than the one found on the\
    \ host/target platform.\n\nWhen working on a non-space-constrained system, you\
    \ should start by downloading the complete VM and the IDE by entering the following\
    \ commands:\n\n```bash\nsudo apt-get install mono-complete\nsudo apt-get install\
    \ monodevelop mono-devel-nsunit monodevelop-database monodevelop-versioncontrol\n\
