    powerOf2.py: 11.39706 seconds\nbitwise.py: 8.412941 seconds\n```\n```\n\nYou can\
    \ find the source code at github.com/mactsousk and fileso.co.uk/linuxuser-157."
  md: "\n## ROUTERS\n\n### FCC threatens to block custom router firmware\n\nNew software-defined\
    \ radio rules could spell trouble for enthusiasts\n\nThe ease with which wireless\
    \ network routers can be modified with a third-party firmware is set to take a\
    \ hit thanks to new rules from the **US Federal Communications Commission that\
    \ promise to block firmware modifications.**\n\nUnder rules that became effective\
    \ this year, set to be fully enforced for all devices on the market in June 2016,\
    \ the FCC is to require all licensed devices – a requirement for sale in the US\
    \ – to “implement software security to ensure that the devices operate as authorised\
    \ and cannot be modified,” seemingly to lock out third-party modifications.\n\n\
    Replacing the stock firmware of Linux-based networking hardware with more powerful\
    \ third-party alternatives, such as OpenWRT, is popular enough that there are\
    \ router models designed with this specifically in mind. However, under the new\
    \ FCC Part 15 rules, they could become illegal in the US over fears that they\
    \ could be used to operate in unlicensed spectrum, or at illegal power levels.\n\
    \nSpeaking at the Wireless Battle of the Mesh event in Slovenia, Simon Wunderlich\
    \ argued that this was likely to have a global impact. “Since the same types of\
    \ devices are often sold worldwide,” he claimed, “this change does not only affect\
    \ routers in the US, but also Europe, and this will also affect wireless communities.”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_8_0.png)\n\nAs well as unlocking new\
    \ features, third-party firmware is often used to breathe new life into devices\
    \ that manufacturers have ceased to support. This means that under the new rules,\
    \ consumers could be left running insecure devices on their network due to the\
    \ new restrictions.\n\n## STORAGE\n\n### Kinetic is now an open Linux project\n\
    \nSeagate’s enterprise-grade storage platform, Kinetic, is now an official **Linux\
    \ Foundation** Collaborative project, with companies including Western Digital,\
    \ Toshiba, Dell and Cisco joining the development effort.\n\nKinetic combines\
    \ storage devices featuring integrated Ethernet connectivity with a key/value\
    \ store paradigm claimed to improve the efficiency, scalability and flexibility\
    \ of enterprise storage.\n\nUsing open source software and a standardised set\
    \ of application programming interfaces (APIs), storage developers can use a Kinetic\
    \ system to reduce the overheads of storage area network (SAN) implementations,\
    \ taking advantage of features like direct drive-to-drive data transfer via Ethernet,\
    \ without needing an intermediate host device.\n\nAlthough billed as the Kinetic\
    \ Open Storage platform, the standard remained under Seagate’s control until the\
    \ formation of the Linux Foundation Collaborative Project. Now truly open, network\
    \ and storage vendors have joined and pledged their support, but none have offered\
    \ a release date for Kinetic-compatible, Ethernet-enabled storage devices.\n\n\
    According to documentation, Kinetic enables an increase in rack density, a reduction\
    \ in power draw and cooling, easy data sharing, and the removal of the company\
    \ calls “superfluous layers of legacy software and hardware” associated with traditional\
    \ SAN platforms.\n\n“[The Seagate Kinetic Storage platform…] delivers the new\
    \ paradigm necessary to enable us collectively, as an industry, not only to meet\
    \ this mandate, but to do so optimally and in the most cost-efficient manner required,”\
    \ a company spokesman claimed at the announcement.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_8_1.png)\n\
    \n### ADD A REMOTE DBA TO YOUR TEAM\n\nRemote DBA from 2ndQuadrant is the ideal\
    \ solution for organisations needing extra help to manage their PostgreSQL database\
    \ – with our expert knowledge of the core code, you couldn't be in safer hands.\n\
    \nRemote DBA is offered as a service extension to our Gold and Platinum Production\
    \ Support service plans.\n\nUK +44 (0)870 766 7756\nUS +1 650 378 1218\n2ndquadrant.com/rdba\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_8_2.png)\n\n# OpenSource\n\nYour source\
    \ of Linux news & views\n\n## DISTROFEED\n\n### Top 10\n\n(Average hits per day,\
    \ 5 August - 3 September)\n\n- Linux Mint ▼ 3,096\n- Debian ▲ 2,062\n- Ubuntu\
    \ ▲ 1,560\n- openSUSE - 1,175\n- Fedora ▲ 1,148\n- Manjaro ▲ 1,123\n- CentOS ▲\
    \ 981\n- Mageia ▲ 945\n- Kali Linux ▲ 925\n- Zorin OS ▼ 800\n\n### This month\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_9_0.png)\n\nWhile Linux Mint has taken\
    \ a hit, it remains number one. Meanwhile, Kali’s rise to the top ten is rare\
    \ for an application-specific distro.\n\n### Highlights\n\n#### Ubuntu 15.10 Beta\
    \ 1\n\nReleased ahead of the full launch in October, the latest Ubuntu ‘Vivienne’\
    \ gets some in standard, Kubuntu, Lubuntu, Ubuntu GNOME, Ubuntu MATE, Ubuntu Kylin,\
    \ Xubuntu and Ubuntu Cloud flavours for testers of every type to enjoy.\n\n####\
    \ Zorin OS 10\n\nFeaturing an Ubuntu 15.04 base, the latest Zorin OS includes\
    \ a new media player and a neat activity journal that displays files and documents\
    \ you have worked on throughout the day.\n\n#### Kali 2.0\n\nThe release of Kali\
    \ 2.0 has brought a shift to a rolling release model. It is designed to make it\
    \ easier to keep the penetration testing and security distribution updated.\n\n\
    Latest distros available:\n\nfilesilo.co.uk\n\n## GAMING\n\n### Unity game engine\
    \ hits Linux\n\nFuture support for the platform not guaranteed\n\nThe game engine\
    \ specialist Unity has announced the release of an experimental build of its software\
    \ for Linux, making good on its roadmap promise to support the operating system\
    \ in future releases.\n\nA popular engine for both games and general-purpose 3D\
    \ rendering, Unity has previously been restricted to use on only proprietary platforms.\
    \ This month’s release changes that, bringing official support for running the\
    \ software on Ubuntu 12.04 or newer, plus unofficial support for other 64-bit\
    \ Linux distributions.\n\nThe release is a test for the company, however, and\
    \ Unity has not committed to a full and formal release. “Today’s build is what\
    \ we call an experimental build; future support is not yet guaranteed,” warned\
    \ Unity’s NaTosha Bard. “Your adoption and feedback will help us determine if\
    \ this is something we can sustain alongside our Mac and Windows builds.” Bard\
    \ did not indicate what usage and feedback levels would constitute enough for\
    \ the company to adopt Linux as a fully supported platform for all future releases,\
    \ following in the footsteps of rivals including Epic’s Unreal Engine.\n\nInterest\
    \ from developers in Linux as a gaming platform is higher than ever, thanks in\
    \ no small part to game developer and publishing giant Valve basing its gaming-centric\
    \ operating system SteamOS on the Debian Linux distribution.\n\n## FEDORA\n\n\
    ### Support for 32-bit x86 demoted\n\nFedora makes 64-bit x86 the gold standard\n\
    \nThe Fedora project has demoted support for 32-bit x86 architectures from its\
    \ Linux distribution, following a vote by the Fedora Engineering Steering Committee\
    \ (FESCo).\n\nIn its late August meeting, FESCo raised a vote on removing support\
    \ for the i686 32-bit x86 instruction set architecture from Fedora 24. “From my\
    \ POV (point of view), nobody wants to support the i686 image,” Hailuk Guímar\
    \ told attendees. “I’m completely +1 for (in favour of) dropping all of the i686\
    \ images/media in f24 [Fedora 24],” added Kevín Ferzi.\n\nAfter some discussion,\
    \ the committee agreed to change the vote away from a total abandonment of i686\
    \ support, to making it a non-blocking deliverable. This means that its absence\
    \ (should work not be complete in time) would not prevent the general launch of\
    \ Fedora 24, effectively demoting the architecture support.\n\nThe 64-bit x86\
    \ architecture, backwards-compatible with the traditional 32-bit variant, was\
    \ launched in 2003 by AMD as AMD64 and picked up by Intel a year later. Today,\
    \ the majority of both company’s chips are 64-bit.\n\n## OPINION CODING\n\n###\
    \ Power of two\n\nWhen it comes to computers, nothing beats binary arithmetic.\
    \ Here's how to find out if an integer is a power of two.\n\nIdentifying whether\
    \ or not a given positive integer is a power of two is not a challenging job,\
    \ but it needs a lot of processing, especially if the integer is larger than $2^{20}$.\
    \ Also, it highlights that: a) you should always think carefully before implementation,\
    \ and b) it is good to have a sound knowledge of mathematics when you are programming.\
    \ The more areas of mathematics you know, the better.\n\nHere is a standard, brute\
    \ force and recursive Python function (power0f2.py) that solves the initial problem:\n\
    \n```python\ndef powerOf2(num):\n    if (num == 1):\n        return True\n   \
    \ elif (num == 0) or (num % 2 == 1):\n        return False\n    else:\n      \
    \  return powerOf2(num / 2)\n```\n\nAnother version uses binary arithmetic (bitwise.py):\n\
    \n```python\ndef powerOf2(number):\n    return (number & (number-1) == 0) and\
    \ (number != 0)\n```\n\nPut simply, the function checks whether there is more\
    \ than one \"1\" bit set in the binary representation of the number variable.\
    \ As you know, CPUs calculate using binary arithmetic. These calculations are\
    \ especially fast and happen quicker than any other kind.\n\nTo make the algorithm\
    \ clearer: the binary representation of 64, which is a power of two, is 1000000.\
    \ 64-1 equals 63, the binary representation of 63 is 0111111. So (1111111 & 1000000)\
    \ equals 0, which proves that number 64 is a power of two. The drawback is when\
    \ a solution that uses binary arithmetic is only suitable for problems that have\
    \ to deal with powers of two.\n\nThe following Python script generates 1,000,000\
    \ random numbers that will then be used as input for testing the two techniques:\n\
    \n```python\n#!/usr/bin/python\nimport random\nMIN = 0\nMAX = 100000\nTOTAL =\
    \ 1000000\n```\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_10_0.png)\n\n**Mihalis\
    \ Tsoukalos** is a UNIX administrator, a programmer, a DBA and a mathematician.\
    \ He has used Linux since 1993.\n\n\"It is good to have a sound knowledge of mathematics\
    \ when you are programming. The more areas of mathematics you know, the better.\"\
    \n\n```python\nfor i in range(0, TOTAL):\n    print random.randrange(MIN, MAX)\n\
    ```\n\nAlthough the function **random.randrange()** suggests it produces random\
    \ numbers, their statistical distribution is not so random after all. The following\
    \ output proves it:\n\n```bash\n$ awk '{ if ($0 > 0 && $0 < 10000) print }' numbers\
    \ | wc -l\n99585\n$ awk '{ if ($0 > 10000 && $0 < 20000) print }' numbers | wc\
    \ -l\n99811\n$ awk '{ if ($0 > 20000 && $0 < 30000) print }' numbers | wc -l\n\
    99930\n```\n\nThe following can find out if there are duplicate numbers:\n\n```bash\n\
    $ sort numbers | uniq -c | sort -rn\n```\n\nHaving duplicates is not a bad thing,\
    \ it's just good to know. It is now time to perform the actual benchmarking. This\
    \ time the benchmarking will be done using the **time()** Python function. As\
    \ you can see in the Python code, each program repeats itself ten times to produce\
    \ even more accurate results. The results are as follows:\n\n```text\npowerOf2.py:\
    \ 12.287568 seconds\nbitwise.py: 8.285457 seconds\n```\n\nAlthough the difference\
    \ is only four seconds, it took powerOf2.py 50% more time than bitwise.py to perform\
    \ exactly the same task.\n\nThe maximum permitted integer plays a central role\
    \ in the problem because if it is small, the brute force technique will obviously\
    \ take less time. The maximum integer that can be found in the sample was set\
    \ to 1000 for the following results:\n\n```text\npowerOf2.py: 11.39706 seconds\n\
    bitwise.py: 8.412941 seconds\n```\n\nYou can find the source code at github.com/mactsousk\
    \ and fileso.co.uk/linuxuser-157.\n"
  mdcn: "\n## 路由器\n\n### 美国联邦通信委员会威胁将阻止自定义路由器固件\n\n新的软件定义无线电规则可能会给爱好者带来麻烦\n\n由于**美国联邦通信委员会**出台的新规则承诺**阻止固件修改**，使用第三方固件修改无线网络路由器的便捷性将受到打击。\n\
    \n根据今年生效的规则，预计将于2016年6月对市场上的所有设备全面实施，FCC将要求所有获得许可的设备（在美国销售的前提条件）“实施软件安全，以确保设备按授权方式运行且无法被修改”，这显然旨在锁定第三方修改。\n\
    \n用功能更强大的第三方替代品（如 OpenWRT）替换基于 Linux 的网络硬件的出厂固件已相当流行，甚至有一些路由器型号在设计时特意考虑了这一点。然而，在新的\
    \ FCC 第 15 部分规则下，由于担心这些设备可能被用于在未经许可的频谱上运行或以非法功率级别运行，它们在美国可能变得非法。\n\n斯洛文尼亚无线网状网战争活动的演讲者\
    \ Simon Wunderlich 认为，这可能会产生全球性影响。“他声称，‘由于同类型的设备通常在全球销售，这一变化不仅影响美国的路由器，也影响欧洲，这将影响到无线社区。’”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_8_0.png)\n\n除了解锁新功能外，第三方固件还常用于为制造商不再支持的设备注入新活力。这意味着在新规则下，由于新的限制，消费者可能会将不安全设备留在他们的网络上。\n\
    \n## 存储\n\n### Kinetic 现已成为一个开放的 Linux 项目\n\n希捷的企业级存储平台 Kinetic 现已成为**Linux 基金会**的正式协作项目，西部数据、东芝、戴尔和思科等公司加入了开发工作。\n\
    \nKinetic 结合了具有集成以太网连接功能的存储设备，以及一种据称能提高企业存储效率、可扩展性和灵活性的键值存储范式。\n\n使用开源软件和标准化的应用程序编程接口\
    \ (API) 集合，存储开发人员可以利用 Kinetic 系统来减少存储区域网络 (SAN) 实现的开销，利用通过以太网直接进行驱动器到驱动器数据传输等功能，而不需要中间主机设备。\n\
    \n尽管被称为 Kinetic 开放存储平台，但在 Linux 基金会协作项目成立之前，该标准一直由希捷控制。现在真正开放后，网络和存储供应商已经加入并承诺提供支持，但尚未提供\
    \ Kinetic 兼容、启用以太网的存储设备的发布日期。\n\n根据文档，Kinetic 可以提高机架密度，减少功耗和冷却需求，便于数据共享，并移除该公司所称的与传统\
    \ SAN 平台相关的“多余的遗留软件和硬件层”。\n\n公司在发布公告时声称：“[希捷 Kinetic 存储平台……] 提供了使我们在整个行业范围内不仅能够满足这一使命，而且以最优且最具成本效益的方式完成这一目标的新范式所必需的条件。”\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_8_1.png)\n\n### 为您的团队添加远程 DBA\n\n来自\
    \ 2ndQuadrant 的远程 DBA 是那些需要额外帮助来管理其 PostgreSQL 数据库的组织理想的解决方案——凭借我们对核心代码的专业知识，您将得到更安全的保障。\n\
    \n远程 DBA 作为我们黄金和白金生产支持服务计划的服务扩展提供。\n\n英国 +44 (0)870 766 7756\n美国 +1 650 378 1218\n\
