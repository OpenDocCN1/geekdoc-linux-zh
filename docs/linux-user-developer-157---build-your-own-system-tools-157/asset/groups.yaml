    \t}\n}\n\nfunc main() {\n\tif len(os.Args) != 3 {\n\t\tfmt.Println(\"You should\
    \ use exactly\")\n\t\tfmt.Println(\"two command line arguments!\")\n\t\tos.Exit(-1)\n\
    \t}\n\tcp(os.Args[1], os.Args[2])\n}\n```\n\n## Rust\n\n```rust\nuse std::env;\n\
    use std::fs;\n\nfn main() {\n    let args: Vec<_> = env::args().collect();\n \
    \   if args.len() != 3\n    {\n        let input = ::std::env::args().nth(1).unwrap();\n\
