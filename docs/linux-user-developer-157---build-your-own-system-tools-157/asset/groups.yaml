    \ 的第一列减去一，第二列加上零，第三列加上一：\n\n```\n> myDataFrame + -1:1\n```\n\n请记住，只要您没有将操作结果分配给\
    \ `myDataFrame` 变量，`myDataFrame` 的原始内容就不会改变。\n\n下一条命令为 `myDataFrame` 创建一个名为 `sum`\
    \ 的新列，其中包含每行所有值的总和：\n\n```\n> myDataFrame$sum = myDataFrame$v1 + myDataFrame$v2\
    \ + myDataFrame$v3\n```\n\n如您所知，此操作会通过添加新列来改变 `myDataFrame`。使用相同的方法，您可以执行任何类型的计算。\n\
    \n## 09  在多种数据类型之间转换\n\n本步骤将向您展示如何在列表、数据框、向量和矩阵之间进行转换。给定一个名为 `myMatrix` 的矩阵，您可以使用以下命令将其转换为列表：\n\
    \n```\n> myList <- as.list(data.frame(t(myMatrix)))\n```\n\n给定一个名为 `myList` 的列表，您可以使用此命令将其转换为矩阵：\n\
    \n```\n> anotherMatrix <- matrix(unlist(myList), ncol = 2, byrow = TRUE)\n```\n\
    \n## 10  保存和加载您的工作\n\n到目前为止，您已经看到了如何以多种方式更改数据。最后一步将描述如何保存您的数据，并在下次运行 R 时加载它。您可以按以下方式保存当前\
    \ R 会话，包括所有定义的变量：\n\n```\n> save(list = ls(all=TRUE), file = \"R25Aug2015\")\n\
    ```\n\n操作系统将创建一个名为 `R25Aug2015` 的文件，您可以按以下方式稍后加载：\n\n```\n> load(file = \"R25Aug2015\"\
    )\n```\n\n以下命令可用于删除所有当前定义的 R 对象类型：\n\n```\n> rm(list=ls())\n```\n\n下一条命令将向您展示\
    \ R 图形功能的一个令人印象深刻的演示：\n\n```\ncapabilities()\n```\n\nR 是一个无尽的话题，你只能通过实践来了解更多信息，所以开始实验并赋予你的数据许多新的含义！\n\
    \n### 获取帮助\n\nR 提供了多种获取函数帮助的方式：如果您在 R 提示符后输入问号，再跟上函数名称，R 将返回类似于 Unix man 手册的内容：\n\
    \n```\n? Sys.sleep\n```\n\n以下命令将返回 `read.table()` 函数的实用示例：\n\n```\n? example(read.table)\n\
    ```\n\n# 教程：D3.js\n\n# 使用 D3.js 可视化您的数据 – 第一部分\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_39_0.png)\n\
    \n**Mihalis Tsoukalos**\n是一名 Unix 管理员，Linux 和 iOS 程序员，数据库管理员（DBA），也是一位数学家。他自 1993\
    \ 年以来一直使用 Linux\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_39_1.png)\n\n**教程文件可用：**\n\
    filesilo.co.uk\n\n**资源**\n- 文本编辑器\n- D3.js: d3js.org\n\n学习如何使用 D3.js JavaScript\
    \ 库创建令人印象深刻的交互式可视化效果\n\nD3 代表 Data-Driven Documents（数据驱动文档）。它是一个 JavaScript 库，可以帮助您将随机数据绑定到文档对象模型（DOM）并对文档应用数据驱动的转换。D3\
    \ 提供的函数在应用于 DOM 元素时，可以转换生成的 HTML、SVG 或 CSS 文档。它是一个强大的软件，可以做很多事情并生成非凡的交互性和专业输出。它没有一个单一的功能来画圆或任何其他形状；相反，它有一个函数来处理正确的一组数据以创建圆形。虽然这种方法使您编写更多的代码，但它提供了更多的灵活性和自由度！借助其大量的组件和插件，D3.js\
    \ 还支持代码重用。如果您已经熟悉 JavaScript，那么使用 D3.js 就易如反掌。即使您不是 JavaScript 的狂热粉丝，您也应该认真考虑\
    \ D3.js。然而，还有许多其他替代方案供您考虑，包括 R、MATLAB、Octave 等。\n\n所有演示示例都可以在本地机器上运行，无需运行 Web\
    \ 服务器，例如 Apache 和 Nginx。下个月我们将解释如何使用 D3.js 创建更多令人印象深刻的高级图表。\n\n## 01  安装 D3.js\n\
    \n在安装 D3.js 之前，您需要下载它：\n\n```\n$ wget https://github.com/mbostock/d3/releases/download/v3.5.6/d3.zip\n\
    ```\n\n`d3.ZIP` 文件包含三个文件：`d3`、`LICENSE`、`d3.js` 和 `d3.min.js`。`d3.js` 和 `d3.min.js`\
    \ 都包含相同的 JavaScript 代码；唯一的区别是 `d3.min.js` 中已移除空白字符，以减小文件大小从而加载更快。\n\n`d3.min.js`\
    \ 文件包含大量 JavaScript 代码。好的是您只需使用以下任一方法将其包含在您的 HTML 代码中即可：\n\n```\n<script type=\"\
    text/javascript\" src=\"http://d3.js/\"></script>\n<script type=\"text/javascript\"\
    \ src=\"http://d3js.org/d3.v3.min.js\" charset=\"utf-8\"></script>\n```\n\n第一行加载本地副本，而第二行从互联网加载\
    \ D3.js - 请注意，两者都是有效的。Hello World 程序的 D3.js 版本如下：\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_39_2.png)\n\
    \n**上方** 我们的程序读取数据并生成条形图\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_40_0.png)\n\
    \n**左侧**：结果条形图中的数据将从上到下绘制\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
    \ http-equiv=\"Content-Type\" content=\"text/html;charset=utf-8\">\n    <title>The\
    \ D3.js version of Hello World</title>\n    <script type=\"text/javascript\" src=\"\
    d3/d3.min.js\"></script>\n</head>\n<body>\n    <script type=\"text/javascript\"\
    >\n        d3.select(\"body\").append(\"span\")\n        .style(\"color\", \"\
    blue\")\n        .text(\"Hello World!\");\n    </script>\n</body>\n</html>\n```\n\
    \n由于 `.style(\"color\", \"blue\")` 命令，输出以蓝色显示。\n\n## 02  使用 D3.js 绘制圆形\n\n本步骤将向您展示如何使用\
    \ D3.js 绘制圆形。圆形 HTML 文件包含以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n \
    \   <title>Draw a circle using D3.js</title>\n    <script type=\"text/javascript\"\
    \ src=\"d3/d3.min.js\"></script>\n</head>\n<body>\n    <div id=\"myCircle\"></div>\n\
    \    <script type=\"text/javascript\">\n        var sampleSvg = d3.select(\"#myCircle\"\
    )\n        .append(\"svg.svg\")\n        .attr(\"width\", 200)\n        .attr(\"\
    height\", 200);\n        sampleSvg.append(\"svg:circle\")\n        .attr(\"stroke\"\
    , \"red\")\n        .style(\"fill\", \"pink\")\n        .attr(\"r\", 50)\n   \
    \     .attr(\"cx\", 70)\n        .attr(\"cy\", 70)\n    </script>\n</body>\n</html>\n\
    ```\n\n如您所见，您仍然需要创建一个完整的 HTML 文件，以便嵌入所需的 JavaScript 代码。`svg.circle` 命令告知 D3.js\
    \ 您将绘制一个圆形。对于绘制圆形来说，定义将作为圆心的点坐标（**cx** 和 **cy**）以及半径长度（**r**）的代码非常重要。\n\n类似地，您可以使用\
    \ `svg.rect` 绘制矩形。在这种情况下，您需要描述您想要的矩形的高度和宽度。\n\n## 03  一个简单的绘图示例\n\n这次，您将可视化存储在数组中的数据。程序将读取数组值并生成条形图。绘制条形图的\
    \ JavaScript 代码如下：\n\n```html\n<script type=\"text/javascript\">\n    var myWidth\
    \ = 1000;\n    var myHeight = 1000;\n    var myData = [5, 321, 20, 200, 150, 130,\
    \ 400, 250, 150];\n    var svg = d3.select(\"body\").append(\"svg\")\n       \
    \ .attr(\"id\", \"myChart\")\n        .attr(\"width\", myWidth)\n        .attr(\"\
    height\", myHeight);\n    svg.selectAll(\".bar\")\n        .data(myData)\n   \
    \     .enter()\n        .append(\"rect\")\n        .attr(\"class\", \"bar\")\n\
    \        .attr(\"x\", 0)\n        .attr(\"y\", function(element, index){\n   \
    \         return (index*25);\n        })\n        .attr(\"width\", function(element,index){\n\
    \            return element;\n        })\n        .attr(\"height\", 20)\n</script>\n\
    ```\n\n## SVG 图形\n\nSVG 代表 Scalable Vector Graphics（可缩放矢量图形），是一种基于 XML 的二维图形矢量图像格式，支持交互性和动画。由于它意味着输出既不受到也不基于当前输出设备的像素大小，因此具有非常重要的精度。SVG\
    \ 支持图形对象的形状：基本图形形状、三角形和文本。您可以在 www.15871658/645 找到更多关于 SVG 的信息。\n\n"
