    \ 和 `getppid()`。这两个系统调用都不需要参数：每个调用只是返回所要求的进程 ID。第 7 行的检查不是必须的，但告知用户此命令不需要提供命令行参数是一个好习惯。父进程的进程\
    \ ID 很可能是你当前 shell 的进程 ID。\n\n你可能会说这里的错误检查太多了，你可能是对的。然而，一般原则是，你编写的应用程序越关键，它应该包含的错误检查代码就越多。\n\
    \n```\n// pid.c\n#include <stdlib.h>\n#include <stdio.h>\n#include <unistd.h>\n\
    int main(int argc, char **argv)\n{ \nif (argc != 1)\n{ \nprintf(\"There is no\
    \ need for command line arguments\\n\");\nreturn -1;\n} \nint pid = getpid();\n\
    int ppid = getppid();\nif ( pid > 0 )\n{ \nprintf(\"Your process id is %d\\n\"\
    , pid);\n} \nelse\n{ \nprintf(\"There is an error with your process id %d\\n\"\
    , pid);\n} \nif ( ppid > 0 )\n{ \nprintf(\"You have been called from a process\
