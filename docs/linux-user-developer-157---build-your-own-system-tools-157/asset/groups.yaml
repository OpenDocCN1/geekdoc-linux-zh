  mdcn: "\n# 功能特性\n\n## 音频信号处理\n\n### 音频采集\n\n音频是模拟信号。处理音频的第一步是采集它。为此，我们需要对信号进行采样。音频通过线路输入端口进入声卡。该信号被送入模数转换器（ADC），它将模拟电压转换为\
    \ -32,768 到 +32,767 之间的数值（如果使用 16 位 ADC）。采样率是对信号进行采样的频率。CD 质量的音频采样率为 44.1KHz。下图展示了一个经过采样的正弦波。\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_65_0.png)\n\n### 为什么使用浮点数？\n\n在进行信号处理时，为什么我们使用\
    \ -1.0 到 1.0 之间的浮点数，而不是整数？引用 Will Pirkle 的著作 *《使用 C++ 设计音频效果插件》*：“在音频算法中，加法和乘法都非常常见。如果使用基于整数的数字，当你数学上结合两个数字并得到一个超出已知数字范围的值时，很快就会陷入困境……然而，-1.0\
    \ 到 1.0 之间的数字有一个有趣的特性，即它们的乘积总是该范围内的数字。”\n\n### 最简单的低通滤波器\n\n信号处理是一个非常复杂的话题，因此这应该是对最简单滤波器工作原理的解释。假设我们有一个滤波器\
    \ y(n) = x(n) + x(n-1)，其中 y 是输出样本，x 是输入样本，x(n-1) 是前一个样本。低通滤波器对信号进行不同的视角观察（在时间上偏移）并将它们相加。\n\
    \n在低频下，所有视角看起来都非常相似（通过单个样本的偏移几乎不会改变你在信号上任何瞬间的位置）。在这种情况下，两个版本将以建设性（或至少非破坏性）的方式相加，因此信号通过滤波器。现在转到更高的频率，在每个给定的瞬间（采样点），信号的每个偏移版本变得更加独特，实际上甚至可能反转符号。对于这些较高频率，信号的不同版本倾向于相互抵消（破坏性相加），因此信号现在变得衰减。\n\
    \n### 完整代码列表 *(续)*\n\n步骤 14\n```python\nplt.xscale('log')\nplt.show()\n# 显示图表后退出。仅用于验证频率响应\n\
    sys.exit()\n```\n\n步骤 15\n```python\nclass AudioController:\n    def __init__(self,\
    \ filename, leds):\n        if filename == 'line-in':\n            self.line_in\
    \ = True\n        else:\n            self.line_in = False\n            self.wf\
    \ = wave.open(filename)\n        self.leds = leds\n        self.p = pyaudio.PyAudio()\n\
    ```\n\n步骤 16\n```python\n@staticmethod\ndef get_left(data):\n    # 返回立体声音频的左声道\n\
    \    data = np.reshape(data, (CHUNK, 2))\n    return data[:, 0]\n\ndef more(self):\n\
    \    if self.line_in:\n        try:\n            # 返回线路输入数据\n            return\
    \ self.stream.read(CHUNK)\n        except:\n            print(\"line-in error\"\
    )\n            return 'ab'\n    else:\n        # 从 wav 文件读取数据\n        return\
    \ self.wf.readframes(CHUNK)\n```\n\n步骤 17\n```python\ndef analyse(self, data):\n\
    \    # 转换为 numpy 数组并进行滤波\n    data = np.fromstring(data, dtype=np.int16)\n\n \
    \   # 如果是立体声，只处理左侧\n    if self.channels == 2:\n        data = self.get_left(data)\n\
    \n    # 将 int16 转换为 float 用于 dsp\n    data = np.float32(data/32768.0)\n\n    #\
    \ 发送到滤波器\n    self.analysers_filter(data)\n    self.analysers_change_leds()\n\
    ```\n\n步骤 18\n```python\ndef play_setup(self):\n    # 假设是 16 位波形文件，单声道或立体声\n \
    \   self.channels = self.wf.getnchannels()\n    self.sample_rate = self.wf.getframerate()\n\
    \    self.stream = self.p.open(format=pyaudio.paInt16, channels = self.channels,\n\
    \                               rate = self.sample_rate,\n                   \
    \            output = True)\n\ndef record_setup(self):\n    self.channels = 1\n\
    \    self.sample_rate = 44100\n    self.stream = self.p.open(format = pyaudio.paInt16,\
    \ channels = self.channels,\n                               rate = self.sample_rate,\n\
    \                               input = True)\n```\n\n## 音乐可视化\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_66_0.png)\n\
    \n*上述我们使用的灯带可以在此购买：amzn.to/lLkubx6*\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_66_1.png)\n\
    \n*上述将 LED 灯带保持卷绕成单个单元，或展开并垂挂在低音炮周围——选择权在你！*\n\n### 17 Analyse 方法\n\nanalyse 方法负责将\
    \ more 方法返回的字节字符串转换为 16 位整数数组。然后，如果音频是立体声，右侧通道将被丢弃。数据随后被转换为浮点表示，每个样本在 -1.0 到 1.0\
    \ 之间。这是信号处理的标准数据格式。然后，浮点数据被发送到频率分析器。最后，调用频率分析器的 **change_leds** 方法。\n\n### 18\
    \ 设置方法\n\n音频控制器的主要功能是 **loop** 方法。在循环开始之前，调用一个设置辅助函数，该函数初始化 PyAudio 以从线路输入录制或播放\
    \ WAV/FL 文件。\n\n### 19 Loop 方法\n\n如前所述，主处理循环首先设置相应的音频流。然后初始化频率分析器，并启动一个 while\
    \ 循环，直到没有剩余的音频数据为止。如果我们正在播放 WAV/FL 文件，音频数据会被发送到声卡，然后发送到分析器，分析器负责实际的分析并改变 LED。\n\
    \n### 20 主方法\n\nmain 方法非常简单。前两行用于绘制滤波器的频率响应。在此之后，我们通过传递一个包含 (红, 绿, 蓝) 晶体管的 GPIO\
    \ 引脚号的元组来创建 LED Controller 的一个实例。然后，我们创建 Audio Controller 的一个实例，它传递第一个命令行参数（线路输入或\
    \ WAV/FL 文件）以及我们刚刚创建的 LED Controller 实例。最后，我们进入处理循环。\n\n### 21 开机自启\n\n现在代码已经完成，是时候让它开机自启了。应用程序需要以\
    \ root 用户身份运行，因此我们可以简单地将其添加到 **rc.local** 中。使用 **sudo** 编辑器编辑 **/etc/rc.local**\
    \ 并添加这一行：\n\n```\npython2 /home/pi/ledstrip.py line-in &\n```\n\n...在 **exit 0**\
    \ 行之前。现在重启并测试你的可视化器！\n\nanalyse 方法将 more 方法返回的字节字符串转换为 16 位整数数组。\n\n### 完整代码列表（续）\n\
    \n步骤 19\n\n```python\ndef loop(self):\n    # 主处理循环\n    # 根据是线路输入还是非线路输入进行相应的设置\n\
    \    if self.line_in:\n        self.record_setup()\n    else:\n        self.play_setup()\n\
    \n    self.analyser = FreqAnalyser(self.channels, self.sample_rate, self.leds)\n\
    \n    # 读取第一块音频数据\n    data = self.more()\n\n    # 当还有音频剩余时\n    while data !=\
    \ '':\n        try:\n            # 如果我们正在播放音频，写入流\n            if not self.line_in:\n\
    \                self.stream.write(data)\n\n            # 分析数据并改变 LED\n      \
    \      self.analyse(data)\n\n            # 获取更多音频数据\n            data = self.more()\n\
    \n        except KeyboardInterrupt:\n            break\n\n    # 清理\n    self.stream.close()\n\
    \    self.p.terminate()\n```\n\n步骤 20\n\n```python\nif __name__ == \"__main__\"\
    :\n    #fa = FreqAnalyser(2, 44100)\n    #fa.plot_response()\n\n    lc = LedController((20,\
    \ 21, 16))\n    #lc.test()\n    ac = AudioController(sys.argv[1], lc)\n    ac.loop()\n\
    ```\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_67_0.png)\n\n**LED 灯泡** 天花板由六个主要部分组成，每部分包含\
    \ 2,500 个灯泡，总计 15,000 个灯泡，容纳 50,400 个 RGB LED，因此超过 150,000 个独立 LED 组件。\n\n**WizYasep**\
    \ 设计用于通过以太网连接以高速、低延迟和低抖动传输和转码数据流，WizYasep 控制器板非常适合网络 LED 显示屏。\n\n**树莓派** 灯光显示的指挥者，树莓派处理预加载的视频并将其通过网络发送出去。\n\
    \n**传感器** 一对传感器放置在通道的两端，用于计算乘客沿特定方向移动的时间。\n\n### 组件列表\n\n- 树莓派 B+\n- 实时时钟模块\n\
    - 8 口以太网集线器\n- 树莓派电源\n- 6 个 WizYasep 板\n- 120 个 150W 电源\n- 50,400 个 RGB LED（每灯泡\
    \ 3 个）\n- 4 个红外传感器\n\n**右侧** Pi 在一个单独的机箱中，将数据传输到天花板六个由 WizYasep 管理的部分中的每一个。\n\n\
    **下方** Yann 为该项目设计的定制 WizYasep 板，非常适合驱动高容量 LED 显示屏。\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_67_1.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_67_2.png)\n\n"
