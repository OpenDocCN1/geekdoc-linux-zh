    \ potential when GSDs matures<br>8 | Put in the work to learn org-mode and it\
    \ will repay you exponentially<br>8 |\n\n#### AND THE WINNER IS...\n\n**mGSD**\n\
    \nSome GTDers still swear by paper-based lists, but a synchronised todo.txt file\
    \ or a web app is available anywhere you can borrow a device and remember your\
    \ password. A decade ago, desktop apps like Getting Things GNOME! dominated, but\
    \ migration of our digital lives to the online world has meant web apps surviving\
    \ on the one hand and command line choices on our SSH-accessible Raspberry Pis\
    \ on the other.\n\nTodo.txt is one of the friendliest command line apps, which\
    \ even GUI lovers could warm to. Its strength lies in simplicity: of the text\
    \ format and also the rules that all of the community-contributed software follows\
    \ in order to keep compatibility. For those new to GTD, or those just looking\
    \ to writing a list, try this one today.\n\nFor the more visually-oriented, Freelance\
    \ GTD+ is a great way for generating next action lists, bringing the full power\
    \ of mind maps to planning your world. Back to the command line: org-mode has\
    \ great documentation and masses of user-supplied tutorials (such as those at\
    \ sachachua.com) to help you with that steep learning curve. For those with heavy\
    \ project management, org-mode could be your lifeline.\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_83_0.png)\n\
    ![](img/e7f197876caa0b235fb5da2d16a578ea_83_1.png)\n\nFor mere mortals, however,\
    \ there’s only one winner. mGSD may have reached the end of developmental life,\
    \ while we wait for the next generation of TiddlyWiki-based software to catch\
