    # GAMING


    # Unity game engine hits Linux


    Future support for the platform not guaranteed


    The game engine specialist Unity has announced the release of an experimental
    build of its software for Linux, making good on its roadmap promise to support
    the operating system in future releases.


    A popular engine for both games and general-purpose 3D rendering, Unity has previously
    been restricted to use on only proprietary platforms. This month’s release changes
    that, bringing official support for running the software on Ubuntu 12.04 or newer,
    plus unofficial support for other 64-bit Linux distributions.


    The release is a test for the company, however, and Unity has not committed to
    a full and formal release. “Today’s build is what we call an experimental build;
    future support is not yet guaranteed,” warned Unity’s NaTosha Bard. “Your adoption
    and feedback will help us determine if this is something we can sustain alongside
    our Mac and Windows builds.” Bard did not indicate what usage and feedback levels
    would constitute enough for the company to adopt Linux as a fully supported platform
    for all future releases, following in the footsteps of rivals including Epic’s
    Unreal Engine.


    Interest from developers in Linux as a gaming platform is higher than ever, thanks
    in no small part to game developer and publishing giant Valve basing its gaming-centric
    operating system SteamOS on the Debian Linux distribution.


    # FEDORA


    # Support for 32-bit x86 demoted


    Fedora makes 64-bit x86 the gold standard


    The Fedora project has demoted support for 32-bit x86 architectures from its Linux
    distribution, following a vote by the Fedora Engineering Steering Committee (FESCo).


    In its late August meeting, FESCo raised a vote on removing support for the i686
    32-bit x86 instruction set architecture from Fedora 24. “From my POV (point of
    view), nobody wants to support the i686 image,” Hailuk Guímar told attendees.
    “I’m completely +1 for (in favour of) dropping all of the i686 images/media in
    f24 [Fedora 24],” added Kevín Ferzi.


    After some discussion, the committee agreed to change the vote away from a total
    abandonment of i686 support, to making it a non-blocking deliverable. This means
    that its absence (should work not be complete in time) would not prevent the general
    launch of Fedora 24, effectively demoting the architecture support.


    The 64-bit x86 architecture, backwards-compatible with the traditional 32-bit
    variant, was launched in 2003 by AMD as AMD64 and picked up by Intel a year later.
    Today, the majority of both company’s chips are 64-bit.'
  - "[PAGE 10]\n\n# **OPINION CODING**\n\n# Power of two\n\nWhen it comes to computers,\
    \ nothing beats binary arithmetic. Here's how to find out if an integer is a power\
    \ of two\n\n> > Identifying whether or not a given positive integer is a power\
    \ of two is not a challenging job, but it needs a lot of processing, especially\
    \ if the integer is larger than 2^20. Also, it highlights that: a) you should\
    \ always think carefully before implementation, and b) it is good to have a sound\
    \ knowledge of mathematics when you are programming. The more areas of mathematics\
    \ you know, the better.\n> \n> Here is a standard, brute force and recursive Python\
    \ function (power0f2.py) that solves the initial problem:\n\n```\n```\ndef powerOf2(num):\n\
    \    if (num == 1):\n        return True\n    elif (num == 0) or (num % 2 == 1):\n\
    \        return False\n    else:\n        return powerOf2(num / 2)\n```\n```\n\
    \nAnother version uses binary arithmetic (bitwise.py):\n\n```\n```\ndef powerOf2(number):\n\
    \    return (number & (number-1) == 0) and (number != 0)\n```\n```\n\nPut simply,\
    \ the function checks whether there is more than one \"1\" bit set in the binary\
    \ representation of the number variable. As you know, CPUs calculate using binary\
    \ arithmetic. These calculations are especially fast and happen quicker than any\
    \ other kind.\n\nTo make the algorithm clearer: the binary representation of 64,\
    \ which is a power of two, is 1000000. 64-1 equals 63, the binary representation\
    \ of 63 is 0111111. So (1111111 & 1000000) equals 0, which proves that number\
    \ 64 is a power of two. The drawback is when a solution that uses binary arithmetic\
    \ is only suitable for problems that have to deal with powers of two.\n\nThe following\
    \ Python script generates 1,000,000 random numbers that will then be used as input\
    \ for testing the two techniques:\n\n```\n```\n#!/usr/bin/python\nimport random\n\
    MIN = 0\nMAX = 100000\nTOTAL = 1000000\n```\n```\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_10_0.png)\n\
    \n**Mihalis Tsoukalos** is a UNIX administrator, a programmer, a DBA and a mathematician.\
    \ He has used Linux since 1993\n\n> > \"It is good to have a sound knowledge of\
    \ mathematics when you are programming. The more areas of mathematics you know,\
    \ the better\"\n\n```\n```python\nfor i in range(0, TOTAL):\n    print random.randrange(MIN,\
    \ MAX)\n```\n```\n\nAlthough the function **random.randrange()** suggests it produces\
    \ random numbers, their statistical distribution is not so random after all. The\
    \ following output proves it:\n\n```\n```\n$ awk '{ if ($0 > 0 && $0 < 10000)\
    \ print }' numbers | wc -l\n99585\n$ awk '{ if ($0 > 10000 && $0 < 20000) print\
    \ }' numbers | wc -l\n99811\n$ awk '{ if ($0 > 20000 && $0 < 30000) print }' numbers\
    \ | wc -l\n99930\n```\n```\n\nThe following can find out if there are duplicate\
    \ numbers:\n\n```\n```\n$ sort numbers | uniq -c | sort -rn\n```\n```\n\nHaving\
    \ duplicates is not a bad thing, it's just good to know. It is now time to perform\
    \ the actual benchmarking. This time the benchmarking will be done using the **time()**\
    \ Python function. As you can see in the Python code, each program repeats itself\
    \ ten times to produce even more accurate results. The results are as follows:\n\
    \n```\n```\npowerOf2.py: 12.287568 seconds\nbitwise.py: 8.285457 seconds\n```\n\
    ```\n\nAlthough the difference is only four seconds, it took powerOf2.py 50% more\
    \ time than bitwise.py to perform exactly the same task.\n\nThe maximum permitted\
    \ integer plays a central role in the problem because if it is small, the brute\
    \ force technique will obviously take less time. The maximum integer that can\
