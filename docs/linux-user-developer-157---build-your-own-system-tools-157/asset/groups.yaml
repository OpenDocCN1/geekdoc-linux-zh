    \ 配置文件\n\n一个流行的使用场景是在最具成本效益的可用区中启动特定数量的竞价实例（Spot Instances）。为了创建这种类型的 Spot Fleet\
    \ 配置，请将以下内容保存在一个 JSON 文件中：\n\n```\n{\n\"SpotPrice\": \"0.16\",\n\"TargetCapacity\"\
    : 7,\n\"IamFleetRole\": \"arn:aws:iam::123456789012:role/my-spot-fleet-role\"\
    ,\n\"LaunchSpecifications\": [\n{\n\"ImageId\": \"ami-la2b3c4d\",\n\"InstanceType\"\
    : \"cc2.8xlarge\"\n}\n]\n}\n```\n\n此示例文件没有将 Amazon 限制在特定的可用区（可以将其视为您区域内的数据中心）或特定的子网。如果您的账户仅支持\
    \ EC2-VPC（所有较新的 AWS 账户都是这种情况），Amazon 将在具有默认子网的最低价格可用区中启动您的实例。如果您的账户支持 EC2-Classic，Amazon\
    \ 将简单地选择最低价格的可用区。\n\n为了在您认可的可用区中最具成本效益的可用区中启动您的竞价实例，您需要做一些调整。对于爱尔兰区域，生成的 JSON\
    \ 文件可能如下所示：\n\n```\n{\n\"SpotPrice\": \"0.16\",\n\"TargetCapacity\": 7,\n\"IamFleetRole\"\
    : \"arn:aws:iam::123456789012:role/my-spot-fleet-role\",\n\"LaunchSpecifications\"\
    : [\n{\n\"ImageId\": \"ami-la2b3c4d\",\n\"InstanceType\": \"cc2.8xlarge\",\n\"\
    Placement\": {\n\"AvailabilityZone\": \"eu-west-la\"\n}\n},\n{\n\"ImageId\": \"\
    ami-la2b3c4d\",\n\"InstanceType\": \"cc2.8xlarge\",\n\"Placement\": {\n\"AvailabilityZone\"\
    : \"eu-west-lb\"\n}\n}\n]\n}\n```\n\n此配置禁止使用除 `eu-west-la` 和 `eu-west-lb` 以外的可用区。\n\
    \nAmazon 最近公布计划在伦敦开设一个新的 AWS 区域，旨在服务于初创公司，不过截至写作时，该区域的代码尚未公开宣布。为了验证您的账户当前可用哪些区域，请使用此\
    \ AWS CLI 命令：\n\n```\n$ aws ec2 describe-regions\n```\n\n响应可能如下所示：\n\n```\n{\n\
    \"Regions\": [\n{\n\"Endpoint\": \"ec2.eu-west-1.amazonaws.com\",\n\"RegionName\"\
    : \"eu-west-1\"\n},\n{\n\"Endpoint\": \"ec2.ap-southeast-1.amazonaws.com\",\n\"\
    RegionName\": \"ap-southeast-1\"\n},\n{\n\"Endpoint\": \"ec2.ap-southeast-2.amazonaws.com\"\
    ,\n\"RegionName\": \"ap-southeast-2\"\n},\n...\n]\n}\n```\n\n要了解当前受支持的任何区域中支持哪些可用区，请使用以下命令：\n\
    \n```\naws ec2 describe-availability-zones --region eu-west-1\n```\n\n输出可能如下所示：\n\
    \n```\n{\n  \"AvailabilityZones\": [\n    {\n      \"State\": \"available\",\n\
    \      \"RegionName\": \"eu-west-1\",\n      \"Messages\": [],\n      \"ZoneName\"\
    : \"eu-west-1b\"\n    },\n    {\n      \"State\": \"available\",\n      \"RegionName\"\
    : \"eu-west-1\",\n      \"Messages\": [],\n      \"ZoneName\": \"eu-west-1c\"\n\
    \    },\n    {\n      \"State\": \"available\",\n      \"RegionName\": \"eu-west-1\"\
    ,\n      \"Messages\": [],\n      \"ZoneName\": \"eu-west-1d\"\n    }\n  ]\n}\n\
    ```\n\n值得注意的是，单个 Spot Fleet 请求不能跨越多个区域，也不能跨越同一可用区的不同子网。此外，启动规范中的用户数据大小不得超过 16\
    \ KB。\n\n将相关信息输入您的配置文件，然后将其命名为 `config.json`。\n\n### 提交您的 Spot Fleet 请求\n\n在 AWS\
    \ 命令行界面中，输入以下命令以提交您的 Spot Fleet 请求：\n\n```\naws ec2 request-spot-fleet --spot-fleet-request-config\
    \ file://config.json\n```\n\n文件 `config.json` 是您之前创建的相同 JSON 文档，它指定了您的 Spot Fleet\
    \ 的设置详情。您可以使用以下方法监控您的 Spot Fleet 请求：\n\n```\naws ec2 describe-spot-fleet-requests\n\
    ```\n\n您的每个 Spot Fleet 请求可能处于以下状态：\n\n-   `submitted` – Amazon 正在评估您的请求，以为启动您的实例做准备。\n\
    -   `active` – 一旦您的请求通过验证，Amazon EC2 将尝试维持您的集群中目标数量的运行中竞价实例。\n-   `cancelled-running`\
    \ – Amazon 已收到您放弃 Spot Fleet 的请求；它将不再启动任何额外的竞价实例；当前正在运行的实例将继续运行，直到它们被中断或终止（默认行为）。\n\
    -   `cancelled-terminating` – Amazon 已收到您放弃 Spot Fleet 的请求，并正在终止受此请求保护的实例（非默认行为）。\n\
    -   `cancelled` – 您的 Spot Fleet 已成功取消，没有实例在运行，不会启动任何实例，Amazon 将在最后实例终止两天后删除您的请求。\n\
    \n以下操作将优雅地结束您的 Spot Fleet 请求，而不会终止任何正在运行的 EC2 实例：\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-request-ids sfr-72fbd1ce-aa42-464c-8877-1cee4MYFLEET --no-terminate-instances\n\
    ```\n\n如果您打算同时取消请求并终止所有实例，请在提示符下使用此命令：\n\n```\naws ec2 cancel-spot-fleet-requests\
    \ --spot-fleet-request-ids sfr-72fbd1ce-aa42-464c-8877-1cee4MYFLEET --terminate-instances\n\
    ```\n\n响应可能如下所示（针对没有自动实例终止的请求）：\n\n```\n{\n  \"SuccessfulFleetRequests\": [\n\
    \    {\n      \"SpotFleetRequestId\": \"sfr-72fbd1ce-aa42-464c-8877-1cee4MYFLEET\"\
    ,\n      \"CurrentSpotFleetRequestState\": \"cancelled_running\",\n      \"PreviousSpotFleetRequestState\"\
    : \"active\"\n    }\n  ],\n  \"UnsuccessfulFleetRequests\": []\n}\n```\n\nSpot\
    \ Fleet 请求展示了如何使用 Linux 上的云服务来自动化……云服务！在任何给定时间，您每个区域最多可以运行 1000 个 Spot Fleets，基于您选择的任何\
    \ AMI（包括您自己可能创建的 Linux AMI，可能运行定制代码的应用程序），总实例数不超过 3000 个。\n\n弹性负载均衡器（Elastic Load\
    \ Balancer）可以根据需求自动控制自动扩缩容组以及单个实例\n\n## 安全访问您的 AWS 资源\n\n保护您的 Web 平台免受在线攻击，以确保数据安全和服务正常运行\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_50_0.png)\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_51_0.png)\n\
    \n![](img/e7f197876caa0b235fb5da2d16a578ea_51_1.png)\n\nPhilipe Martins & Anna\
    \ Kobylinska\n早在多年前就在 Linux 机器上积累了一定的经验，并最终进入企业 IT 领域，设计云拓扑结构，优化 Linux 虚拟机并管理\
    \ AWS 部署。\n\n那些敢于涉足公有云的人很快就会认识到偏执型安全的重要性。在云中，您不再仅仅面临灾难性数据丢失或数据泄露的风险。您现在面对的是按需扩展的即付即用服务所带来的无限财务责任。如果未授权方获得了对您的\
    \ AWS 账户的控制权，财务后果将不堪设想。甚至可以说毫不接近安全。明智的做法是永远不要低估人类的智慧，因为不可能的事情可能也并非遥不可及。\n\n在过去的一年里，一系列安全漏洞，从\
    \ Heartbleed 到 Shellshock 再到 VENOM，令全球活跃的云用户感到恐惧。Heartbleed 和 Shellshock 臭名昭著地暴露了以前被认为安全的工具中的致命缺陷（分别是\
    \ OpenSSL 和 Bash）。VENOM 迫使备受尊敬的虚拟化软件供应商匆忙进行补丁更新，该漏洞曾在隐秘中潜伏了十多年。\n\n说到云安全，Andy\
    \ Grove（英特尔前 CEO）的名言“只有偏执狂才能生存”似乎非常贴切。在 AWS 上，安全是您无需额外付费即可使用的功能。\n\n### 01 创建新的\
    \ IAM 用户\n\n为了安全访问您的 AWS 资源，您需要停止使用您的 AWS 根凭据。AWS 管理控制台（Amazon 的基础设施服务的 Web 前端）可能会提示您创建\
    \ IAM 用户。即使它没有提示，您也应该这样做。\n\n将您的 Web 浏览器导航到身份和访问管理（简称为 IAM）服务，其地址为：console.aws.amazon.com/iam。在左侧导航窗格中，切换到标记为“用户”的部分，然后点击“创建新用户”按钮。\n\
    \n按照 IAM 仪表板上的屏幕说明创建新用户。向导将要求您提供最多五个用户名，每个用户名最多 64 个字符。访问密钥是可选的；如果您取消勾选该复选框，仍然可以稍后添加这些凭据。\n\
    \n一旦点击“创建”按钮，最多五个 IAM 用户将被添加到您的 AWS 根账户中。到目前为止，这些用户不属于任何组，也没有任何权限。实际用户也还不知道他们的登录凭据，因此没有访问权限。\n\
    \n### 资源\n\nAWS 根账户\n\n![](img/e7f197876caa0b235fb5da2d16a578ea_51_2.png)\n\n\
    **右图：** 通过身份和访问管理控制台创建新的 IAM 用户\n"
