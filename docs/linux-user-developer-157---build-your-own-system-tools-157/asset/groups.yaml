    \ shutil\n\nif len(sys.argv) == 3:\n    input = sys.argv[1]\n    output = sys.argv[2]\n\
    \    shutil.copy2(input, output)\n```\n\n## Perl\n\n```perl\n#!/usr/bin/perl -w\n\
    use strict;\nuse File::Copy;\n\nmy $input = shift;\nmy $output = shift;\n\ncopy($input,\
