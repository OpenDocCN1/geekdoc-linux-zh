    once, or read it and print it character by character. While doing any kind of
    programming, but especially systems programming, you should never make any similar
    assumptions.


    The following command will compile the myCat.c code using the gcc compiler and
    should generate an executable program named myCat:


    ```

    $ gcc -Wall -o myCat myCat.c

    ```


    Should you wish to change the name of the executable, you should put a different
    string after the -o parameter. The -Wall parameter is for turning on all compiler
    warnings, which is especially useful during development. Try to correct not only
    the errors but also the warnings, because it will save you time in the long run.


    Lines 1–5 are used for including various C header files in your program. Header
    files are used for loading libraries that do not belong to the core C language,
    which in itself is pretty minimalistic.


    If you want to know which header files need to be included for a given system
    call, you should check the man page of the system call. System calls can be found
    in the second section of man pages – this is especially useful to know for system
    calls that have the same name as some built-in commands. For example, the man
    page of the open() system call can be accessed by executing man 2 open; if you
    just type man open then you are going to get the man page of the open command
    that is part of the shell. As a general bit of advice, it is better to use the
    man page section number. Most of the time, the header files of related system
    calls are overlapping and should be included only once.


    In line 7, a new function named cat is implemented. The cat function reads from
    a file using a file descriptor. The file descriptor is passed as a parameter to
    the cat function because it has been opened inside the main() function. The second
    parameter to the function is the filename, which is a string. If you already have
    the file descriptor, you do not need the filename to read the file. The name of
    the file is needed in order to have an informative error message, in case an error
    occurs during the reading of the file. In line 12, you use the write(2) system
    call to print the output on screen using file descriptor 1, which is always standard
    output – usually your terminal. You also see some error checking here: the write(2)
    function must write its whole input that is stored in the buf variable. If it
    fails, then an error message is printed on screen.


    In line 19, you see the standard definition of the main() C function, where every
    autonomous C program automatically starts its execution.


    In line 24, you see how to open a file for reading using the open(2) system call.
    The open(2) system call has two parameters: the name of the file to open and O_RDONLY,
    which denotes that you open the file for reading only. The general principle with
    the flag values is that you use the flag with the ''smallest'' permission that
    does your job for security reasons. Therefore if you want to open a file for writing
    only where the O_WRONLY flag is enough, you should not open it using the O_RDWR
    flag as that opens it for both reading and writing. When a program ends, all open
    file descriptors are then automatically closed.


    In case of success, the open(2) system call returns a positive integer (line 25),
    which is the file descriptor of the file opened. In case of error, the open(2)
    system call returns a negative integer. In the next article, you are going to
    learn more about file I/O and the various flags of the open(2) system call. If
    you want to manually close an open file descriptor – which is good practice –
    you should use the close(2) system call.


    The cat program is the perfect example of just how little C code it takes to develop
    the core functionality of a fundamental Unix utility.


    ```c

    #include <stdio.h>

    #include <sys/types.h>

    #include <sys/stat.h>

    #include <unistd.h>

    #include <fcntl.h>


    void cat(int f, char *s)

    {

    char buf[2048];

    long n;

    while ((n=read(f, buf, 1024)))

    if(write(1, buf, n) != n)

    printf("Error while printing output!\n");

    if(n<0)

    printf("Error reading %s!\n", s);

    }


    int main(int argc, char **argv)

    {

    if (argc == 1)

    printf("You have to give a filename!\n");

    int f = open(argv[1], O_RDONLY);

    if (f < 0)

    printf("Cannot open file!\n");

    else

    cat(f, argv[1]);

    return 0;

    }

    ```


    ![](img/e7f197876caa0b235fb5da2d16a578ea_21_0.png)


    ## File descriptors


    Although you are going to learn more about file descriptors in the next article,
    it is good to know some basic things now. A file descriptor is a positive integer
    value.


    Unix supports three special and standard filenames: /dev/stdin, /dev/stdout and
    /dev/stderr. These can also be accessed using file descriptors 0, 1 and 2, respectively.


    Alternatively, file descriptor 0 can be accessed using /dev/fd/0 – remember that
    in Unix, everything is a file!


    As you can see in the myCat.c code listing to the left, the cat() function writes
    to file descriptor 1 (the 1st argument in line 12), which is the standard output.
    In other words, what is written to file descriptor 1 is printed on the screen.
    This is also analogous to the functionality of the printf() function. Similarly,
    you can read the user input by getting data from file descriptor 0. This is similar
    to the functionality that is offered by the scanf() and getc() functions.


    ![](img/e7f197876caa0b235fb5da2d16a578ea_21_1.png)


    ![](img/e7f197876caa0b235fb5da2d16a578ea_22_0.png)


    # Process handling


    When a process is created, its state is 1. Then it can only go to state 2, where
    it has two options; it can go to the running state (3) or back to state 4, where
    it waits in a queue for its turn. From state 4 the process can go to state 5,
    where it is kept in memory, or to state 6, where it is kept on disk and stored
    in the swap space. When in either state 5 or 6, it can only go to state 4, where
    it is waiting to go to either state 2 or state 3. From a running state (3), a
    process can be terminated normally, it can become a zombie process when things
    go wrong, or it can go to states 2 or 4.


    # Exec family of calls


    Every Unix shell uses one of the functions in the exec family to execute commands
    given by the user. There exist six functions in the family: exec, execp, execle,
    execv, execlp and execvp. The exec functions will return -1 if an error has occurred;
    otherwise they return nothing. In one of the upcoming articles, you are going
    to learn more about the similarities and the differences between the six functions.


    When a process uses one of the exec system calls to execute a program, the new
    program completely replaces the process and starts its execution at its main()
    function. However, the process ID remains the same!


    The somewhat related fork(2) system call that you are going to learn in another
    article is used for creating a new child process, whereas an exec function starts
    a new program.

