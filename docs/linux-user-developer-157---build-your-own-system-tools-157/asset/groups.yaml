    # ## File descriptors


    Although you are going to learn more about file descriptors in the next article,
    it is good to know some basics things now. A file descriptor is a positive integer
    value.


    Unix supports three special and standard filenames: /dev/stdin, /dev/stdout and
    /dev/stderr. These can also be accessed using file descriptors 0, 1 and 2, respectively.


    Alternatively, file descriptor 0 can be accessed using /dev/fd/0 – remember that
    in Unix, everything is a file!


    As you can see in the myCat.c code listing to the left, the cat( ) function writes
    to file descriptor 1 (the 1st argument in line 12), which is the standard output.
    In other words, what is written to file descriptor 1 is printed on the screen.
    This is also analogous to the functionality of the printf( ) function. Similarly,
    you can read the user input by getting data from file descriptor 0. This is similar
    to the functionality that is offered by the scanf( ) and getc( ) functions.


