    内核后的典型 7 周）。内核 4.2 中的新功能主要涉及内部优化和增强，对普通最终用户来说几乎是无透明的。示例包括对系统管理模式（SMM）的支持，以及在 KVM
    中的仿真，这有效地使基于 KVM 的虚拟机能够实现安全启动（Secure Boot，被某些 Linux 和许多新的 Windows 系统使用）。此外，x86
    上浮点上下文管理代码（在任务切换间保留浮点单元状态的部分）也进行了完全重写，由于最终用户在用浮点应用大力测试时可能会发现用户可见的问题，这存在“大量的回归风险”。


