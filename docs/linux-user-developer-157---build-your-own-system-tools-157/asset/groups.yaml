  md: "\n# RE-CREATE CORE TOOLS\n\n## Build simple versions of ls and wc, and work\
    \ with process IDs\n\nIn this part we will program simple versions of two existing\
    \ Linux tools to help you understand that, behind the scenes, things are simpler\
    \ than you might think. We’ll also show how to get the process ID as well as the\
    \ parent ID of a program. Despite the simplicity, you should always remember that\
    \ the difficulty in programming systems software lies in the numerous details\
    \ of a program, for instance error checking, command line processing, error handling\
    \ and so on. The good thing with such details is that you should be able to write\
    \ the code once and then use it everywhere!\n\nAs you can also see, all programs\
    \ have comments. Even if a program is small, you should always put the necessary\
    \ comments in it.\n\nWarning: the C programming language assumes that the programmer\
    \ always knows what they are doing and does not question them unless there is\
    \ an error in the code. So, if there is an error, the C compiler will not generate\
    \ an executable. If there exists any number of warning messages, but no errors,\
    \ then the compiler will create an executable, which is not always good. As a\
    \ general principle, you should always try to resolve not only error messages,\
    \ but warnings as well.\n\n### Challenge yourself\n\nOnce you’ve worked through\
