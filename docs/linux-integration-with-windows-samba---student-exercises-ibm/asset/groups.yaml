    6. Now go to the section for disk shares and create the shares that you''ve been
    using in the class.

    7. At this point, you should be able to restart the server and use a client to
    verify the work you''ve done so far. Try it and see how it works!

    8. Now add printer shares as well. Depending on the contents of your **printcap
    file**, the last step could be quite easy, because Samba will just read that file
    and create the printer shares on the fly. If you wish, you may go back to the
    global section and turn off **load printers**, as you did in a previous lab, and
    create those shares by yourself.'
