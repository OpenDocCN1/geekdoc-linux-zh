    2. **Enable SWAT.**


    # Running SWAT


    Your goal in this lab is to recreate the smb.conf file that you''ve generated
    so far by using SWAT. You''ll start with an empty configuration file and step
    through the SWAT screens, filling in the parameters to create disk shares and
    printer shares.


    In the answers for these labs, we''ve listed the parameters you''re likely to
