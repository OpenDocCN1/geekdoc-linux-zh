    \ it looks like:\n\n```\n[global]\nnetbios name = system1\nworkgroup = 1x26\n\
    ```\n\n- 10. Run the testparm command again.\n\n```\n# /usr/local/samba/bin/testparm\n\
    ```\n\n- 11. Start the smbd and nmbd daemons, both with the -D option so that\
    \ they are daemons.\n\n```\n/usr/local/samba/bin/smbd -D\n/usr/local/samba/bin/nmbd\
    \ -D\n```\n\n- 12. Use the smclient command to verify that your daemons are indeed\
    \ functioning.\n\n```\n/usr/local/samba/bin/smclient -L system1 -N\n```\n\n- 13.\
    \ Kill all Samba daemons.\n\n```\nkillall smbd\nkillall nmbd\n```\n\n- 14. Use\
    \ the make uninstall command to uninstall all Samba programs. Verify that the\
    \ /usr/local/samba directory is indeed empty, except for the smb.conf file that\
    \ you created ourselves, some documentation and a few lock- and logfiles. Then\
    \ remove the /usr/local/samba directory completely.\n\n```\ncd /usr/src/samba-version/source\n\
    # make uninstall\ncd /usr/local/samba\nls -IR | less\ncd /root\nrm -fr /usr/local/samba\n\
    ```\n\n## Installing Samba from RPM\n\n- 15. Depending on the lab setup, the Samba\
    \ RPMs that came with your distribution are located in /root or are stored on\
    \ a network server. Alternatively, your instructor may have CDs to distribute\
    \ to you. In any case, install all Samba RPMs and list the information on these\
    \ RPMs and the files they contain.\n\n```\n# Is samba*.rpm\n# rpm -qip samba*.rpm\
    \ | less\n# rpm -qlp samba*.rpm | less\n# rpm -ivh samba*.rpm\n```\n\n- 16. Browse\
    \ the contents of the default smb.conf file that was configured on your system.\n\
    \n```\n# less /etc/samba/smb.conf\n```\n\n- 17. Use your distributions start script\
    \ to start Samba.\n\n```\nredhat# service smb start\nsuse# rcnmb start; rcnmb\
    \ start\n```\n\n- 18. Use the smbclient command to test your local configuration.\n\
    \n```\n# smbclient -L localhost -N\n```\n\n- 19. Stop the Samba daemons using\
    \ your distributions scripts.\n\n```\nredhat# service smb stop\nsuse# rcnmb stop;\
    \ rcnmb stop\n```\n\n## END OF LAB\n\n## Exercise 2. Network Browsing\n\n### What\
    \ This Exercise is About\n\nIn this exercise you are going to configure Samba\
    \ for network browsing.\n\n### What You Should Be Able to Do\n\nAt the end of\
