    ## 练习 5 打印机共享


    ### 练习目标


    在本次练习中，你将配置 Linux Samba 服务器以支持主机 Linux 操作系统当前支持的所有打印机。此外，你将学习如何限制哪些打印机实际上被共享。


    ## 你应该能够学会


    在实验结束，你应该能够：


    - 配置基础的 Samba 设置，将所有 Linux 配置的打印机暴露给 SMB 网络客户端

    - 将上述配置限制为仅选定的打印机


    ## 练习说明


    ### 配置 UNIX 打印机


    考虑到本课程教学的教室种类多样，无法在此处包含如何配置系统以使用 UNIX 打印机（可以使用常规 UNIX 命令访问的打印机）的说明。你的导师将告诉你如何配置你的
    UNIX 打印机。


    Red Hat Linux 使用 `redhat-config-printer` 实用，而 SUSE 通过 YaST2 控制中心配置打印机。


    作为替代方案，如果教室中完全没有打印机，你可以打印到虚拟终端（实例 `/dev/tty9` 或 `xterm /dev/pts/n`，通过 `tty` 命令查明）。如果是这种情况，请确保打印子系统用户（"lp"）有访问该设备的权限（`chown
    lp /dev/tty9`）。


    1. 使用导师提供的说明配置你的打印机。

    2. 创建测试文件 `/root/testfile` 并在其中写入内容（例如诗歌），以便你能识别该文件属于自己。

    3. 使用常规 UNIX 命令将测试文件发送到打印机，以验证你的打印子系统工作正常。


    ### 配置 [printers] 模板共享


    +   4. 修改你的 `smb.conf` 文件，使你的 printcap 文件中的所有打印机都自动共享。然后重启 Samba。

    5. 使用 `smclient` 命令浏览你的 Samba 服务器。你看到打印机共享了吗？打印机共享名称是什么？为什么？

    6. 使用 `smclient` 命令打印测试文件。以 samba1 登录。验证文件是否正确插入。

    7. 切换到 Windows 95/98/ME 系统并再次浏览网络邻域。安装 Samba 服务器上共享的打印机并尝试打印文件。


    ### 配置单个打印机


    +   8. 修改你的 `smb.conf` 文件，使打印机不再自动加载。然后配置两个打印机，一个命名为 "linenumber"，另一个命名为 "linenumbers"。对于两者，都添加一个
    `print` 命令语句，让它们都打印到同一台打印机，第二个为打印作业添加行号。使用相同的 `smbprint` 命令将你的测试文件打印到打印机。


    ### 使用伪打印机（可选）


    通过修改单个打印机的 `print` 命令，我们可以进行许多奇怪的操作。一个典型的例子是将打印作业发送到传真机而不是打印机。我们的教室里没有传真机，所以我们将做其他事情来理解原理。


    +   9. 配置一个名为 "mailroot" 的打印机。如果作业提交到此打印机，它们需要邮件给 root。


    +   10. 在 Windows 系统上，安装此额外打印机为通用文本打印机，并向此打印机打印一个小型文本文件（使用 Word 或记事本创建）。然后，以 root
    身份检查你的邮箱箱。成功了吗？


    +   11. 列出 `/var/spool/samba` 中的文件。你看到任何文件吗？为什么？你会如何解决这个问题？


