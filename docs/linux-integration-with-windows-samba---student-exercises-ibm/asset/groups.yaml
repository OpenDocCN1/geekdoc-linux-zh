    - 10. Is there a program that prints out all of the configuration parameters,
    but ignores any comments? If so, you could run that program against the smb.org
    file and save the results. Then run it again on the smb.conf file and save those
    results, too. When you compare two sets of results, it will be accurate because
    the comments won''t be there. Do that.


    ```bash

    testParm /etc/samba/smb.conf.org > /tmp/smb.conf.org

    testParm /etc/samba/smb.conf > /tmp/smb.conf

    diff /tmp/smb.conf /tmp/smb.conf

    ```


