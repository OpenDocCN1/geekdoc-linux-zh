    # Exercise 4. File Sharing


    ## What This Exercise is About


    In this exercise you will practice the techniques given in the lecture for configuring
    Samba to share directories on the Linux host. You will experiment with dynamic
    home directories, permission issues, and other characteristics of disk shares.


    ## What You Should Be Able to Do


    At the end of the lab, you should be able to:


    - Properly set up dynamic home directories

    - Configure disk shares for read-only, public, and so on


    ## Exercise Instructions


    The [homes] template


    As shown in the lecture, [homes] is actually a template used for sharing the home
    directory of a particular user.


    - 1. Modify the smb.conf file so that the [homes] share is added.

    - 2. Use the smclient command to retrieve a list of shares on your server while
    logging in anonymously, samba1, samba2 and with an incorrect username.

    - 3. Use the smclient command to log in to the home directory of samba1. Upload
    the file /etc/passwd to /home/samba1/passwd. Are these permissions what you expected?

    - 4. Use the smb command to access the home directory of samba2. Upload the file
    /etc/passwd. Disconnect and view the permissions on the file /home/samba2/passwd.

    - 5. On Windows 95/98/ME system, browse the network neighborhood. What does this
    command do?

    - 6. Use the smb.conf file to add [homes] share. Is there anything else you need
    to do?

    - 7. Use the smb.conf file to add [tmp] share. Does it work?

    - 8. Create a new group "samba". Add samba1 to the group. Who can see access?

    - 9. Configure a share for the CD-ROM. Samba should automatically mount the CD
    when it is disconnected.


    Note: This only works on Linux (not any other UNIX) and only if your Linux kernel
    supports the smbfs filesystem.


