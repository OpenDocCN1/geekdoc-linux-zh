  md: '# Exercise Instructions


    # Configuring Master Browsers


    In this part of the exercise you need to team up with one or two partner teams,
    and configure your two or three systems in the same workgroup. You are going to
    play with various browsing settings that different machines will (predictably)
    become local and domain master browser.


    +   1. Find one or two partner teams to work with and, if necessary, introduce
    yourself to each other.

    2. Move the default smbconf file that came with your distribution to a safe location
    so that you can start off with a blank smbconf file. In this new file, configure
    a netbios name (your own hostname) and a workgroup (a name you decide on with
    your partner teams). Also include a log level = 2 statement, and make sure the
    log output goes to /var/log/samba/

    3. Start your graphical user environment, if this has not yet been started. Open
    at least two terminal windows. In one window, start a tail -f of the /var/log/samba/nmbd,
    and in another, run the smclient -L localhost -N continuously with one second
    interval.

    4. Use the uptime command to determine which system has been running the longest.
    Start the Samba daemons. Wait a minute or so to see the browser elections in action.
    How long does it take before a master browser is elected for your workgroup? Why
    so long? Which system was elected and why?

    5. Stop all Samba daemons on all systems. In one system, configure Samba to be
    a Local Master Browser, with an os level of 32. Start all Samba daemons again.
    Which became LMB? Why? How long did it take this?

    6. Leave the system that became LMB running. On a non-LMB system, stop the Samba
    daemons and configure this system as a preferred master with an os level of 33.
    Start this daemon. Does this system become LMB?

    7. While you were doing these exercises, you may also see other master browsers
    appear in the output of the smclient command? How long did this take?


    # WINS Service


    +   8. Your instructor will appoint one of the systems (or his/her server) in
    the classroom as the WINS server. Configure all your systems to use this WINS
    server, and then run the same simulation. Does this make a difference in the time
    it takes?'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Clean-up


    ___ 9. Change your smb.conf file so that you are a simple system with os level
    zero, and part of the lx26 workgroup. Do not attempt to become master browser.


    END OF LAB'
  merge: -1
