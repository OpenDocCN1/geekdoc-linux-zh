    # Installing Samba from RPM


    +   15. Depending on the lab setup, the Samba RPMs that came with your distribution
    are located in /root or are stored on a network server. Alternatively, your instructor
    may have CDs to distribute to you. In any case, install all Samba RPMs and list
    the information on these RPMs and the files they contain.


    # Is samba*.rpm

    # rpm -qip samba*.rpm | less

    # rpm -qlp samba*.rpm | less

    # rpm -ivh samba*.rpm


    +   16. Browse the contents of the default smb.conf file that was configured on
    your system.


    # less /etc/samba/smb.conf


    +   17. Use your distributions start script to start Samba.


    redhat# service smb start

    suse# rcnmb start; rcnmb start


    +   18. Use the smbclient command to test your local configuration.


    # smbclient -L localhost -N


    +   19. Stop the Samba daemons using your distributions scripts.


    redhat# service smb stop

    suse# rcnmb stop; rcnmb stop


    # END OF LAB'
