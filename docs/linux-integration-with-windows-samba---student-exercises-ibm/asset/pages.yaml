  md: '# Exercise 3. Authentication


    # What This Exercise is About


    This unit will be used to familiarize the student with Windows authentication
    and its implementation in Samba.


    # What You Should Be Able to Do


    At the end of the lab, you should be able to:


    +   * Configure basic authentication

    * Configure encrypted passwords

    * Configure a guest account'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Exercise Instructions


    # Basic Authentication


    +   1. Verify that on your system two user accounts, samba1 and samba2, are added,
    and that the passwords of these accounts are samba1 and samba2, respectively.


    +   2. Configure your smb.conf file for Samba is in the security = user mode.
    Use smbclient to access Samba as user samba1. Use the password "samba1". Does
    this work?


    +   3. Now try to log on with the password "SAMBA1" (all capitals). Does this
    work? Why?


    +   4. Change the UNIX password of samba1 to "Samba1" (with a capital S). Then
    try to log on with passwords "samba1","Samba1" and "SAMBA1". Does this work? Change
    the password level to 1 and try these passwords again. Do they work now?


    +   5. Try different UNIX passwords (multiple capitals) for samba1 and various
    password settings until you understand how this works.


    +   6. Set the password of samba1 back to samba1.


    +   7. Edit the file /etc/samba/smusers and add an alias for samba1 so that the
    Windows username "Samba User 1" is used for it. Change the smb.conf file so that
    the /etc/smamba file is used. Then try to log on to Samba with the Windows username
    "Samba User 1".


    # Encrypted Passwords


    +   8. Configure Samba to use encrypted passwords. Use the smadduser to add samba1
    and samba2 to the Samba password files. View the result /etc/samba/smbpasswd file.


    +   9. Try to log on to Samba as samba1. Does this work? Now change the UNIX password
    of samba1 to something completely different. Try to log on again.


    +   10. Set the password of samba1 back to samba1.


    # Guest Accounts


    +   11. Try to login to Samba with an invalid username. What happens?


    +   12. Add a UNIX account "pcguest" to your system. DO NOT give this account
    a password. Change the smb.conf file so that this account is used when a user
    supplies an invalid username. Try to log in to Samba with an invalid username
    again. What happens now?'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Logging onto Samba from a Windows 95/98/ME machine


    Depending on local circumstances, one or two machines in the classroom are set
    up Windows 95/98/ME machines, or you will have a preconfigured VMware image on
    your system with Windows 95/98/ME. The instructor can tell you what is used in
    your classroom.


    +   13. Boot the Windows 95/98/ME machine. When you need to log on, do so as "samba1"
    with password "samba1". Start the Windows Explorer and browse your network neighborhood.
    (Note: It might take several minutes after booting before you can actually access
    the network neighborhood: Windows machines do browser elections too...) Browse
    your own Samba server. Do you get access?


    +   14. Log out (Start; Shut Down; Close all programs and log on as a different
    user) and log in with a username that does not exist on the Samba server. Browse
    the network neighborhood and try to access your system. Does this work? Why?


    +   15. If there is still time, then disable the guest account on the Samba server
    and try to access your Samba server from the Windows machine again. Does this
    work?


    END OF LAB'
  merge: -1
  pgno: 22
- img_proc: true
