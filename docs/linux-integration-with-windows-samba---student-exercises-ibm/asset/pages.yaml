  md: '# Exercise Instructions With Hints


    # Installing Samba from source


    In this first part of the exercise you are going to follow all of the steps that
    are required to install Samba using the original source tarball which is taken
    from the Samba website. After this, you are briefly going to test this installation
    and uninstall it. The reason for this is that we want everybody in the classroom
    to use the same configuration and can only be assured if everybody installs from
    the binary RPM that is provided with your operating system.


    +   1. Log in to your Linux machine as root. The password is ibminx, unless your
    instructor indicates otherwise.


    > Login as root and provide ibminx as root password.


    +   2. Start a graphical user environment and start a browser (Konqueror, Netscape,
    Mozilla or Galeon).


    Your instructor might indicate that you need to configure your browser for a proxy
    or socks server, since the classroom might be behind a firewall.


    Once you can the web, go to the Samba website (http://www.samba.org). Browse the
    site. Go to the download section and download the latest stable Samba release.
    Store it in /root


    Note: In order to save download, your instructor might already have downloaded
    the release and stored it locally. Check with the instructor if this is the case.


    +   3. Go to the /usr/src directory and unpack the samba tarball.


    ```

    # cd /usr/src

    # tar -zxvf /root/samba-version.tar.gz

    ```


    +   4. Go into the Samba directory and browse the file "Manifest" until you see
    the installation directions. Read these carefully.


    ```

    # cd samba-version

    # less Manifest

    ```


    +   5. Go into the "source" directory and run the ./configure --help. View the
    different configuration carefully: these options decide where all the files and
    what features of Samba (including experimental features) will be enabled.


    ```

    # cd source

    # ./configure --help | less

    ```


    +   6. Run the ./configure script without any options. Not supplying options will
    ensure that we can reinstall Samba easily later on. The disadvantage is that not
    all binaries end up in a place that is included in your $PATH.


    This script will take a minute or so.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '>> # ./configure


    +   7. Run the make command so that all your binaries are built. (This will take
    5-20 minutes, depending on the speed of the system. You might want to get a cup
    of coffee while the system is compiling.)


    >> # make


    +   8. Run the make install command so that everything is installed. Note that
    all files are installed relative to a directory /usr/local/samba.


    >> # make install


    +   9. Create a basic smb.conf file in the directory where the config file should
    go (with a regular install,usr/local/samba/lib). If you don''t know where the
    config file should go, run the testpalm command which was installed as part of
    the make install. You can read the directory from the output of the testpalm command.


    The smb.conf file should contain a netbios name and a workgroup statement.


    ```

    >> cd /usr/local/samba/bin

    >> # /testpalm

    >> cd /usr/local/samba/lib

    >> vi smb.conf

    ```


    Edit the file so that it looks like


    ```

    [global]

    netbios name = system1

    workgroup = 1x26

    ```


    +   10. Run the testpalm command again.


    >> # /usr/local/samba/bin/testpalm


    +   11. Start the smbd and nmbd daemons, both with the -D option so that they
    are daemons.


    ```

    >> /usr/local/samba/bin/smbd -D

    >> /usr/local/samba/bin/nmbd -D

    ```


    +   12. Use the smclient command to verify that your daemons are indeed functioning.


    >> /usr/local/samba/bin/smclient -L system1 -N


    +   13. Kill all Samba daemons.


    ```

    >> killall smbd

    >> killall nmbd

    ```


    +   14. Use the make uninstall command to uninstall all Samba programs. Verify
    that the /usr/local/samba directory is indeed empty, except for the smb.conf file
    that you created ourselves, some documentation and a few lock- and logfiles. Then
    remove the /usr/local/samba directory completely.


    >> cd /usr/src/samba-version/source'
