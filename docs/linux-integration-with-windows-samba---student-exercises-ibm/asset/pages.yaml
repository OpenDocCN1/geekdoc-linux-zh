  md: '# Logon scripts


    +   3. Modify your smb.conf file so that a client logs on to the domain uses the
    logon script /home/netlogon/logon.bat. Create the logon script so that it contains
    the MS-DOS command use h: \server\homes.


    > > vi /etc/samba/smb.conf

    Add the following line to the [global] section:


    logon script = logon.bat

    > testpam

    > redhat# service rcmbm restart; rcmbm restart

    > suse# vi /home/netlogon/logon.bat

    The file should contain:


    @echo off

    net use h: \servername\homes


    +   4. On your Windows 95/98/ME system, log off and log on again. After you have
    logged on, start the Windows Explorer. Do you see the H:-disk? Can you modify
    and add files?


    # Roaming profiles


    +   5. Modify your smb.conf file so that roaming profiles are supported, both
    for Windows 95/98/ME clients and Windows NT/2000 clients.


    > > # mkdir /home/profile

    > # mkdir /home/profile/samba1

    > # chown samba1:samba1 /home/profile/samba1

    > # mkdir /home/profile/samba2

    > # chown samba2:samba2 /home/profile/samba2

    > # vi /etc/samba/smb.conf


    Remove the logon script line, since our current script will interfere with the
    logon drive parameter.

    Add the following lines in the [global] section:


    logon path = \server1\profile\%U

    logon drive = H:

    logon home = \server1\%U

    preserve case = yes

    short preserve case = yes'
