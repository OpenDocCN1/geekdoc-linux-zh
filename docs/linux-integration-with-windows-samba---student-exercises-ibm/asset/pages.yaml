- img_proc: true
  md: '# Exercise Instructions


    # Installing and configuring SWAT


    Red Hat Linux bundles SWAT in a separate RPM than the Samba server and client
    software, while SuSE includes SWAT in the main Samba server RPM.


    +   1. **Red Hat Linux Only**: Verify that the SWAT RPM was installed. If it was
    not installed, install it now.

    2. **Enable SWAT.**


    # Running SWAT


    Your goal in this lab is to recreate the smb.conf file that you''ve generated
    so far by using SWAT. You''ll start with an empty configuration file and step
    through the SWAT screens, filling in the parameters to create disk shares and
    printer shares.


    In the answers for these labs, we''ve listed the parameters you''re likely to
    have changed, but they may not be complete or you may have a synonym at some point
    (for example, `writable = yes` and `read only = no` are synonyms). So the answer
    may not contain all the settings you need to create a configuration file exactly
    like the one you built the last couple of days.


    +   3. Rename **smb.conf** file to **smb.conf.org** so that your original settings
    are saved. Then create a new /etc/smb.conf for **SWAT**.

    4. Start a web browser (Netscape, Conqueror or Lynx) and access `http://localhost:901`.
    Log in with the root password. Browse around the different screens until you feel
    comfortable with the setup.

    Note: If your browser earlier to use a proxy server, you might need to disable
    this proxy server now.

    5. Visit the section for global parameters and in the fields with the values you''ve
    been using so far. It would be best to do this from memory, or by reviewing previous
    labs, but if you get stuck, have your /etc/samba/smb.conf.org file to rely on.
    You can always visit the **View** link to see what the configuration file looks
    like so far.

    6. Now go to the section for disk shares and create the shares that you''ve been
    using in the class.

    7. At this point, you should be able to restart the server and use a client to
    verify the work you''ve done so far. Try it and see how it works!

    8. Now add printer shares as well. Depending on the contents of your **printcap
    file**, the last step could be quite easy, because Samba will just read that file
    and create the printer shares on the fly. If you wish, you may go back to the
    global section and turn off **load printers**, as you did in a previous lab, and
    create those shares by yourself.'
  merge: -1
  pgno: 49
