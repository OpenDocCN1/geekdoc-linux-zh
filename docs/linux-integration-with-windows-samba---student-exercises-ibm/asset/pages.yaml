  md: '# # Exercise 1. Installing Samba


    # What This Exercise is About


    In this exercise you are going to install Samba from source and from the RPM files
    that came with your distribution.


    # What You Should Be Able to Do


    At the end of the lab, you should be able to:


    +   - Compile and install a Samba source tarball

    - Install a Samba binary RPM


    # Required Materials


    +   - http://www.samba.org: Samba source tarball

    - http://www.redhat.com: Samba RPMs'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Exercise Instructions


    # Installing Samba from source


    In this first part of the exercise you are going to follow all the steps that
    are required to install Samba using the original source tarball which is taken
    from the Samba website. After this, you are briefly going to test this installation
    and uninstall it. The reason for this is that we want everybody in the classroom
    to use the same configuration and that can only be assured if everybody installs
    from the binary RPM that is provided with your operating system.


    +   1. Log in to your Linux machine as root. The password is ibminx, unless your
    instructor indicates otherwise.

    2. Start a graphical user environment and start a browser (Konqueror, Netscape,
    Mozilla or Galeon).

    Your instructor might indicate that you need to configure your browser for a proxy
    or socks server, since the classroom might be behind a firewall.

    Once you can browse the web, go to the Samba website (http://www.samba.org). Browse
    the site. Go to the download section and download the latest Samba release. Store
    it in /root

    3. Go to the /usr/src directory and unpack the source tarball.

    4. Go into the Samba source directory and look through the file “Manifest” until
    you see the installation directions. Read these carefully.

    5. Go into the “source” directory and run the /configure --help. View the different
    configuration options carefully; these options decide where all the files and
    features of Samba (including experimental features) will be enabled.

    6. Run the /configure script without any options. Not supplying any options will
    ensure that we can install easily later on. The disadvantage is that not all binaries
    will end up in a place that is included in $PATH.

    This script will take a minute or so.

    7. Run the make command so that all your binaries are built. This will take 5-20
    minutes, depending on the speed of your system. You might want to get a cup of
    coffee while the system is compiling.

    8. Run the make install command so that everything is installed. Note that all
    files are installed relative to a directory /usr/local/samba.

    9. Create a basic smb.conf file in the directory where the config file should
    go (with a regular install, /usr/local/samba/lib). If you don''t know where the
    config file field


    > Note: In order to download time, your instructor might already have downloaded
    this release and stored it locally. Check with the instructor if this is the case.'
