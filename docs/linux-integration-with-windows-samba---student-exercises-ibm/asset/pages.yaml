  md: '# Exercise 7. Configuring Samba with SWAT


    # What This Exercise is About


    This exercise will use the graphical SWAT environment to configure the Samba server.


    # What You Should Be Able to Do


    At the end of the lab, you should be able to:


    +   * Install SWAT and configure xinetd.conf

    * Use SWAT to configure file shares

    * Use SWAT to configure printer shares'
