  md: '# Exercise Instructions


    # Configuring a UNIX printer


    Considering the wide variety of classrooms that this course will be taught in,
    it is not possible to include instructions here on how to configure your system
    so that a UNIX printer (a printer that can be accessed with the regular UNIX commands)
    is available. Your instructor will tell you how to configure your UNIX printer.


    Red Hat Linux uses the redhat-config-printer utility, while SUSE configures printers
    by YaST2 Control Center.


    As an alternative, if no printers are available at all in your classroom, you
    can print to a virtual terminal (instance /dev/tty9 or xterm /dev/pts/n) figure
    this out with the tty command). If this is the case, make sure that the printing
    subsystem user ("lp") has access to this device (chown lp /dev/tty9).


    +   1. Configure your printer using the instructions that will be provided by
    your instructor.

    2. Create a test file, /root/testfile and put something in here, such as a poem,
    so that you are able to identify this file as your own.

    3. Send the test file to the printer using the regular UNIX commands to verify
    that your printing subsystem works.


    # Configuring the [printers] template share


    +   4. Modify your smb.conf file so that all printers in your printcap file are
    automatically shared. Then restart Samba.

    5. Use the smbclient command to browse your Samba server. Do you see the printer
    share? What is the name of the printer share, and why?

    6. Use the smbclient command to print the test file. Log in as samba1. Verify
    that the file was inserted correctly.

    7. Switch over to a Windows 95/98/ME system and browse your network neighborhood
    again. Install the printer which was shared on your Samba server and try to print
    a file.


    # Configuring individual printers


    +   8. Edit your smb.conf file so that printers are not loaded automatically anymore.
    Then configure two printers, one named "linenumber" and one named "linenumbers".
    For both, add a print command statement that both print to the same printer, the
    second one should add line numbers to the print job. Use the same smbprint command
    to print your test file to the printer.'
