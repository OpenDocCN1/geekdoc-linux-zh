  md: '# Comparing the files


    +   9. Try comparing the /etc/smb.orig and /etc/smb.conf files to see which parameters
    are different. What are you going to do about the comments?


    +   10. Is there a program which prints all out of the configuration parameters,
    but ignores any comments? If so, you could run that program against the smb.orig
    file and save the results. Then run it again on the smb.conf file and save those
    results, too. When you compare those two sets of results, it will be accurate
    because the comments won''t be there. Do that now.


