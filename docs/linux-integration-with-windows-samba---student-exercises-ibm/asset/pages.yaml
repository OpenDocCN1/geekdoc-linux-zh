    the MS-DOS command net h: \server\homes.

    4. On your Windows 95/98/ME system, log off and log on again. After you have logged
    on, start the Windows Explorer. Do you see the H:-disk? Can you modify and add
    files?


    # Roaming profiles


    +   5. Modify your smb.conf file so that roaming profiles are supported, both
    for Windows 95/98/ME clients and Windows NT/2000 clients.

    6. Go to your Windows 95/98/ME system and configure it for roaming profiles. Reboot
    the system, then log on as samba1. Answer "yes" to the question whether you want
    to use roaming profiles. Change something in your environment (such as the background
    pattern) and log out.


    # Joining a Samba server in a domain


