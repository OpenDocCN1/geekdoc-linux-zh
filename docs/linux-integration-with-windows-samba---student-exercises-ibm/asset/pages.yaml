  md: '# Exercise Instructions With Hints


    # Configuring Samba as PDC


    In this section you are going to configure your Samba server as a Primary Domain
    Controller. Since there can be only one PDC in a domain, you are going to change
    your workgroup from LX26 to something unique.


    +   1. Configure your smb.conf file so that you are in a unique workgroup, and
    that your system is able to accept domain logins.


    >> # vi /etc/samba/smb.conf

    Change the file so that it looks like this:


    ```

    [global]

    netbios name = system1

    workgroup = workgroup1

    security = user

    os level = 64

    domain master = yes

    local master = yes

    preferred master = yes

    domain logins = yes


    [netlogon]

    writable = no

    public = no

    path = /home/netlogon

    ```


    Any print options shares that you configured earlier may be left in place.


    >> # mkdir /home/netlogon

    >> # testparam

    >> redhat# service smb restart; rcsb restart; rscmb restart


    +   2. Switch over to a *PWL Windows 95/98/ME system and log on to your domain.
    Delete all *.PWL files from C:\Windows. Reboot the machine and log on to your
    domain as samba1 with an invalid password. Does this work? Then log on to

    >> Go to your Network Properties. Select "Client for Microsoft Networks" and click
    on Properties. Enable "Logon to a Windows NT domain".

    >> Delete all *.PWL files from C:\Windows using the Windows Explorer.

    >> Reboot the system.

    >> Log on as samba1 with an invalid password.

    >> Log on as samba1 with a valid password.'
