    # Search Pattern


    The Finder is an essential feature of fzf. However, the tools'' capabilities are
    not limited to editing search patterns. It evaluates the patterns incrementally.
    Each additional character refers the search. In Extended Search mode, which is
    enabled by default, you can also enter additional patterns separated by spaces.
    The program assigns special meanings to some of the special characters used in
    these patterns (Table 1). You can combine search search patterns as described
    in Listing 2.


    Using the arrow keys you to navigate the search pattern in the Finder. The highlighted
    line show the selection. Alternatively, some default key mappings are available.
    Any actions selecting and deactivating multiple lines require you to jump to the
