    # 高可用性 vs. 备份


    如果你遭遇了程序漏洞，使用企业级服务器对你并无大帮助。例如，QNAP 应用程序曾受到一种漏洞的严重影响，导致用户在勒索软件面前丢失了一切 [7][8]。


    企业通常使用存储区域网络 (SAN) 或如 Ceph 等分布式文件系统 [11]。这些工具部署在计算机集群中，如果其中一台服务器故障，其他服务器仍保持运行，并且（此时）负载均衡器可能需要在服务器机房中使用一个服务器机架。


    # 停电


    现代文件系统对断电具有中等抵抗力，即使是强大的 ZFS 也可能遭受断电导致的影响 [9]。UPS 会有所帮助，但要警惕廉价设备：许多廉价 UPS 并没有准备好处理操作，并会随之损坏
    NAS。根据 Poononen  2016 年的一项调查，UPS 故障是数据中心非计划停机的首要原因 [10]。在实践中，这意味着断电降低了数据丢失的风险，但并不能完全消除威胁。


    图 7 展示了最小的（就某些目的而言是无法解决的）集群部署。这被称为主副本（Primary Replica），其中主服务器为客户端提供服务。副本定期与主服务器同步。如果主服务器故障，负载均衡器将提升副本并将其转换为主服务器。


    因此，许多小型用户转向专业存储供应商并不为意外，他们提供付费的云存储服务，并确保存储系统的完美可用。专业存储供应商的费用可能负担得起，而云存储在四年内可能会花费你约
    1,500 美元，而这正是你可能花费在购买一台优质 NAS 上的。由于 UPS 可能每一年都需要升级一次，云存储方案并不完全合理。精明的存储供应商也有自己的问题：将数据上传到云端可能比上传到本地服务器慢得多，且某些环境可能会引发隐私考量。


    在企业场景中，管理员正试图让 NAS 变得“无坚不入”以保证高可用性。在实践中，现实意味着你可能无法回到家里；通常它们具有冗余负载均衡器，并可能需要一些边界网关协议
    (BGP)。即使是这种简单简单的方法，也将存储成本增加了一倍以上，因为它需要一台冗余服务器来消除对完善备份系统的需求。


    # 云存储方案


    如果你不小心手动删除了文件，或者由于软件漏洞或恶意软件丢失了它（例如未存储在笔记本电脑、NAS 或云存储提供商处）。经验表明，人为因素导致你从备份恢复的情况远比硬件故障多。存储多个版本并对每个上传的文件保留注册表，这样如果你意外上传了损坏或删除的文件，就可以检索到旧版本。有趣的是，他们实际上为你运行备份策略的需求并不能保证数据的完整性。毕竟，他们的首要考虑是维护服务的连续性，而不是保护存储的信息。出于如此，建议对你的数据进行妥当的备份，即使它存储在似乎对数据完整性威胁无不入的
    NAS 中。高质量的存储可以减少数据丢失的痛苦，但不能消除它。


    作者

    Rubén Lloren 是一位机械工程师，负责确保小型诊所的安全措施符合法律规定且安全。他是 OpenBSD 爱好者和武器收藏家。


