    # 启动盘工具


    在大多数新电脑甚至没有 CD 光驱的世界里，可启动 CD 带不了多远。现在的 Live 启动意味着从 USB 内存启动，虽然用户变得更加移动，但工具也变得更加复杂。随身携带您的操作系统并插上——您甚至可以在单个优盘上放置多个
    ISO 文件。下个月我们将探索新一代的 USB 启动实用。


