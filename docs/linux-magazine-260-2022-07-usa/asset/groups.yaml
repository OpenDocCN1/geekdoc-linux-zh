    # The Tor Network: Tools for privacy and secure browsing


    # Passing Secrets


    The Tor project supports a modified collection of tools for protecting your privacy
    on the Internet. We''ll give you some background on Tor and help you get started
    with the Browser.

    By Brucefield and Joe Casad


    Users leave broad tracks across the Internet. The websites you visit, your interactions,
    your common passwords if you are careless — everything you do online — is noted
    and used against you for purposes that range from the annoying to the dependent,
    depending on your circumstances. A growing number of applications exist to protect
    your privacy, and the most notable of them is the Tor Browser [figure 1].

    Tor (short for The Onion Router) is a modified version of Firefox designed to
    hide your tracks on the Internet. It secures your traffic by routing it through
    several servers and encrypting it at each hop, making your communications even
    harder to track. Over the last two decades, several features have been added to
    the basic browser, providing a defense in depth against privacy and security intruders.


    The concept of onion routing was originally developed by the US Navy in the 1990s
    as a way of securing communication over the Internet. The Tor project was launched
    in 2002. In 2004, the Navy released it under a free license, and the Electronic
    Frontier Foundation (EFF) became an early supporter of the project. In today''s
    world, groups of western democracies think of privacy as protection from tracks
    and big brother, but Tor was very much tied to the idea of providing safe communication
    for dissidents in authoritarian countries. The Tor project is proud of its contribution
    and support for the Arab Spring movement in 2010, and Tor has supported several
    high-risk initiatives. Other humanitarian groups have backed the Tor project for
    its potential for bringing free speech to expressive countries, including Human
    Rights Watch and the US government''s Bureau of Democracy, Human Rights, and Labor.


    The Browser is a powerful tool, and it should come no surprise that it hides their
    activities. Ransomware attacks often use the Tor network for ransom payments,
    and also the dark web, with illicit sales of drugs and stolen credit card numbers,
    makes use of Tor to let some users operate anonymously. The Tor project believes
    that some communities have used Tor for illegal ends, but they also say, "The
    majority of our users use Tor in a responsible way."


    Some users choose to do so out of principle — the belief that everyone has the
    right to access their own data and to avoid the nuisance of being deterred by
    retailers or in question, or caused by identity theft. Others want to bypass censorship
    or restrictions placed on them by their companies or countries. Others are victims
    of abuse in homes, or while revealing corporate or government corruption. The
    Tor project has a page detailing the growing list of reasons for privacy and security
    are increasingly main concerns and that most operating systems do not adequately
    address. Tor''s purpose is to correct these omissions and to give its users peace
    of mind.


    ![](img/e14c497f4d6e147991bb436d686b6f14_19_0.png)


    Figure 1: The Tor Browser is one of the simplest and most effective ways to preserve
    your online privacy.'
