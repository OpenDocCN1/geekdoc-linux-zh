    # Tor 网络上的匿名性


    在返回给客户端的响应中，过程是相反的。每个节点都为源添加一层加密，链末尾的客户端使用之前获取的密钥解开所有层。


    一旦连接，Tor 浏览器就可以像其他版本的 Firefox 一样使用。你可以将其配置为自动隐藏 onion 地址。该浏览器使用 DuckDuckGo 来匿名化搜索，并在
    Google 上进行搜索。有关最新更新，你还应该检查。


    正如你所指出的，这个过程需要许多步骤和计算，Tor 网络的速度明显慢于其他互联网流量。


    # Tor 特有功能


    当你使用 Tor 浏览器时，应该注意它独特的功能，这些功能位于窗口右上角。输入 URL 字段旁边是一个可以打开 Tor 启动器（Tor Launcher）的下拉菜单。帮助图标会告诉你它是否重启了
    Tor，从而为你提供一个新的临时身份。标准是 Tor 功能菜单，用于 Tor 插件，你可以在那里找到许多实用的工具。Tor HTTPS Everywhere（见图
    7）是 Tor 项目与 Eff 合作成果，如果可能，它可以强制网站使用加密的 Tor 协议而非未加密的 HTTP。签名代码（见图 8）允许你验证运行的任何
    JavaScript（泛指在 Tor 浏览器的功能上）。这两个插件都非常受欢迎。目前，它们是你在使用 Tor 浏览器时应该使用的唯一插件。


    # 安装 Tor


    Tor 在许多发行版中均可用。然而，除了具有频繁安全更新的滚动发布的发行版外，否则该版本可能不是最新的，并且可能是不安全的。特别是，最新的 Ubuntu 意味着不建议使用
    Tor。相反，可以从 Tor 项目下载 Ubuntu 以及其他 Debian 衍生版。


    任何连接都可以下载网站的 Tor。除了 Linux 之外，还提供 Android、iOS 和源代码，以及除英语以外的 36 种语言。未解压的下载对于美英语版本名称为
    `tor-browser-LOCALE-`。进入目录并点击 `start-browser.desktop`。你可以作为桌面环境的一部分运行 Tor：


