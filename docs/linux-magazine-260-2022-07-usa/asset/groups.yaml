    # DOGHOUSE - LOCAL INTERNAL SUPPORT LINUX VOICE


    # MADDOG''S DOGHOUSE


    Tools as community services and local web traffic caches can help improve Internet
    service. BY JOHN "MADDOG" HALL


    ## Local tools for better service


    I recently traveled to Cuba to speak at Informatics 2022, an international technical
    conference held in Havana with speakers and participants from all over the world.
    It allowed me to firsthand a little of what Cuba is like today.


    For those who are not familiar with the country, it is an island off of Mexico
    with a population of approximately 11 million people. It has a unique trade with
    the world for the past 60 years. Jon "Maddog" is an author, educator, scientist,
    and software pioneer who has been a passionate advocate for Linux since 1994 when
    he met Lin Torvalds and advocated for the use of Linux on x86 systems. He serves
    as president of Linux International!


    From a computer standpoint, I use my desktop and laptop with brands that people
    around the world recognize. They purchase them from other countries than the US
    and typically use the same operating systems that most people use. I do not notice
    a lack of Linux-based systems, and I suppose this is because Cuba is a US-based
    company importing products from there.


    The crossbar switches of the century. In that system, each one person was connected,
    someone else could not be connected, when dial-up Internet was the standard, charging
    by connection was practical.


    With modern digital connections, it is possible to use data with usage changes
    and charge by date. Most Internet companies do not find connection-charge merging
    of billing being something done by me, but it certainly made Internet more difficult
    and less useful.


    Cuba''s government has decided to support FSHC as a strategy. They have their
    own distribution, NOVA, which will be used extensively throughout government and
    commerce.


    Another issue is that in rural areas there is no access to Internet as urban areas—in
    Cuba and elsewhere—could be significantly helped by people using Internet-in-a-box
    [2], which helps by caching local data that is requested over and over by local
    cost.


    The Cuban country has internet in most places, with WiFi and cellular phones available.
    Because I use Google WiFi (which is not available in Cuba) and in Cuba WiFi was
    not what I expected, I could easily use WiFi with caches. I could have purchased
    a SIM card at the airport, and then I found that WiFi would be worth the effort.


    Years ago branch exchanges (PBX) were installed in hotels and other facilities
    because they realized that the telephone calls in the local area were building
    the local infrastructure. Instead of needing 500 wires running from each office
    to the CO of the telephone, they would need to run a PBX in the building and for
    then only a small percentage of wiring from the PBX to the CO would be used at
    the same time.


    My WiFi, while adequate for most uses, saved me effort and connection to time.
    To save money, I disconnected from the WiFi when I was not actually using it,
    which also meant I could not receive notifications, and connecting when I wanted
    to use the WiFi was. Periodically, I would forget.


    The telephone book of the past century has been replaced by the pages of today,
    and now you have to reach each page with a local approach similar to the issue
    of PBXs—cached on local Internet-in-box.


    Communities with similar challenges, setting up a community server with networking
