    # THE NEW BOSS


    Dear Reader,


    As this magazine goes to press, Elon Musk, who is attempting buying Twitter, has
    announced, that a certain politician who was previously banned from the platform
    will be back in. At the helm of the micro-blogging colossus, I''ll pop in with
    my usual disclaimer: We talk about tech, not politics. It doesn''t belong to a
    republic, where people should be able to agree with the ban. The question is whether
    a sense exists for moderating content and whether there will be one if Musk makes
    his purchase.


    The news of impending change has sent shock through the internet. Musk has called
    himself a "free speech absolutist" (1) and that considers Twitter to be able to
    say whatever he wants. Many are worried about what this free speech absolutism
    will take. Twitter critics will see it as an invitation to the free of hate, bullying,
    misogyny, and disinformation (also called lies) that have associated with the
    platform, and what less restrictive moderation could mean for the world.


    As is the case with many things, though, what is missing from the headlines. Like
    most egalitarian billionaires, Milno, and Musk has a curious way of choosing his
    ways and saying everything at the same time. He could say that the users who used
    Twitter when the banned politician started tweeting offensive tweets "illegal
    or stupid". Musk says does not believe in permanent bans, but he left the door
    open for temporary suspension and the removal of accounts that he considers destructive
    to the world.


    So what did Elon say? "If you''re not going to allow tweets that are ''destructive
    to the world,'' you need some form of agent or entity that will determine a tweet
    is destructive or not. And once you know the rules of how to do it, it actually
    sounds quite a bit like moderation.


    [1] Milno, "Free Speech Absolutist Elon Musk Says Will Transform," Guardian, Apr.
    14, 2022, https://theguardian.com/technology/2022/apr/14/elon-musk-free-speech-absolutist-will-transform

    [2] Elon Musk Says He Reverses Twitter''s Trump Ban," CNN, May 10, 2022, https://www.cnn.com/2022/05/10/tech/elon-musk-twitter-trump-ban/index.html

    [3] Elon Musk Says He''s "Very Same as the EU on Social Media," By Adi Robertson,
    The Verge, May 10, 2022, https://www.theverge.com/2022/5/10/236527/elon-musk-twitter-digital-services-act-des-union-europe-speech-laws-eu-regulation

    [4] Group, Nichrome and Rachel Parsons, "Tesla Elon Musk Wins Defamation Trial,"
    Reuters, Dec. 6, 2019, https://www.reuters.com/article/article-us-tesla-elon-musk-wins-defamation-of-his-pedo-guy-tweet-idUSL8KBNYI300U/


    It is also interesting that Musk met with EU commissioner Thierry Breton and that
    he is on the "same page" with the EU on the proposed Digital Services Act (3),
    an experiment that would require Musk to comply with content moderation rules
    to remove hate speech and disinformation. He had his ambition seem incompatible,
    yet that meeting, Musk has stated that he must match the laws of the countries
    where he operates, and the fair has other features that he has agreed with, as
    greater transparency and open algorithms.


    This notion that format should match the laws of the countries in stark contrast
    to the concept of free speech Musk values, and it appears that he would comply
    with the rules imposed by countries such as Russia and China to censor the speech
    of dissidents. In other words, he lets personal values get the way of business.


    The real question is could his aspirations for a free-for-all social media, Musk,
    Twitter enthusiast was suited for using his Twitter freedom to call a cave guy
    who rescued the boys'' soccer team from a "pedo guy." After the case, he says
    with the caveat that calling someone a "pedo guy" doesn''t mean you are calling
    them a pedophile—that is the kind of stuff you say off on Twitter when you don''t
    like their ideas.


    If he creates an environment where kind of trash could flourish a lot of people
    will just leave. The high-tech community has this way of voicing itself in epic,
    historical terms as the inevitable new for a civilization, but for Twitter the
    only thing that matters is is it worth it. If news reports stop trusting it, or
    if it makes no profit, Twitter loses - and we lose him.


    So maybe the new Twitter won''t be so different after all? Or to think "Who met
    the new boss / as the old boss"


