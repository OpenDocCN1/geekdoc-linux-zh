    # 征稿


    我们正在寻找关于 Linux 以及 Linux 环境工具的优秀文章。我们将考虑任何主题，我们对以下主题尤为感兴趣：


    - 系统管理

    - 有用的技巧和工具

    - 安全性，包括新闻和技术

    - 产品评测，特别是来自实战的体验

    - 社区新闻和项目


    如果您有想法，请将包含大纲、长度估计、背景介绍和联系方式的提案发送至 edit@linux-magazine.com。


    文章的技术水平应与您通常在《Linux Magazine》中阅读的内容一致。请记住，《Linux Magazine》在许多国家阅读，您的文章可能会翻译成我们姐妹刊之一。因此，最好避免使用所有读者可能无法理解的俚语和成语。


    在处理未来的日期或活动时请要小心。从您提交稿件到到达读者手中，可能会过去数周时间。


    发送文章时，请在邮件主题行中使用有助于我们识别您的邮件为文章提案的字样。随时欢迎截图和其他支持材料。


