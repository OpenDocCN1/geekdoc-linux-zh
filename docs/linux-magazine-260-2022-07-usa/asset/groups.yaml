    启动器（见图 5）。配置任何网络设置，如果你选择，让 Tor 自动连接。首次连接将非常快，只需 15-30 秒，但之后将需要几秒钟。通过查看左上角的在线帮助等内容，你可以取消默认设置（见图
    6），如果你以前使用过 Firefox，这些设置对你来说可能很熟悉。正如你提到的


