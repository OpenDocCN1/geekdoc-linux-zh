    # 常见的 RAID 级


    RAID 有多种构建方式，取决于它们服务的用途。最流行的传统的 RAID 级是：


    - RAID 0 对集合中的所有硬盘进行条带化以提高性能（图 2）。RAID 的总大小是每个单独硬盘大小之和。单盘故障会导致整个数据丢失，使其成为一个非常危险的级别。RAID
    0 的读写吞吐量并不比相同大小的单硬盘更好，因为工作被分配到了阵列中的各个硬盘上。

    - RAID 1 对阵列中的所有硬盘进行镜像（图 3）。由于每个硬盘都有所有数据的完整副本，只要其中一个硬盘仍在运行，RAID 1 就可以继续工作。RAID
    1 有于保持适当的运行时间，但它的效益不高，至少它所需的硬盘数量与存储容量相同。

    - RAID 5 本身是最流行的。这种形式的 RAID 被称为带校验的条带化。磁盘被条带化（类似于 RAID 0），但有一个额外的硬盘存储校验，以便在其中一个硬盘故障时继续运行（图
    4）。RAID 6 执行的是几乎相同的操作，但它可以在两个硬盘故障后仍保持运行。

    - RAID 10 是 RAID 0 和 RAID 1 的结合。硬盘成对进行条带化，每对互相镜像。然后这些对在 RAID 中进行条带化（图 5）。只要每对中至少有一个硬盘在工作，RAID
    10 就可以继续工作。


