    ### Matrix nheko


    The open Source Element on Android and a desktop application nheko that''s been
    specifically designed to replace your favorite IRC client. The Matrix messaging
    protocol has been around for almost 10 years, and over time many of us have experienced
    its network for personal and group chats or just before moving back to our regular
    messaging of distraction. This is a good thing because Matrix can feel like IRC,
    with its federated conglomerate of instances and shared networks. Similarly, it''s
    not always intuitive, but the modern Matrix in nheko is refreshing. The Qt UI
    is clean and easy to navigate, making the web-like Element app better. There''s
    even an option for GUI scaling, for high-DPI displays, and scale by default.


    In its early years, Matrix was lacking a variety of clients, but popularity has
    been increasing in years, reaching a critical mass of acceptance. This acceptance
    has been helped by some excellent clients, developing nheko a beautiful native
    desktop app for accessing Matrix and group chats. The groups/rooms you are subscribed
    to are listed on the left with the message window on the right, and you can search
    for public groups and users. You will find less on other networks, but the quality
    of communication is generally higher. At least for now, as is a typical trade-off
    between a platform''s popularity and the level of signal-to-noise.


