    # Listing 2: Combining Search Patterns


    ```

    PATTERN | PATTERN | PATTERN

    ```


    This takes you to interactive mode, which consists of two parts. The variable
    is prompting, the Finder-support provides interactions. You can interact with
    the arrow keys or by pressing Ctrl+K and Ctrl+J. The terminal highlights the current
    line in bold or inverse type depending on the settings. Pressing the Enter key
    accepts the selected items and sends them to the standard output or terminal.


    In addition, a prompt () is displayed at the bottom of the screen for input. If
    you already passed a search pattern in fzf when you called it (as argument of
    the -option option), the search pattern can be edited in this line. The second
    part works in the background, managing the index and the fuzzy search. Table 1
    shows what is happening in this regard. A constantly changing symbol shows that
    it is scanning an index from the input, which will be seen through for the pattern.
    The current size of index is also shown at the bottom.


    # Search Pattern


    The Finder is an essential feature of fzf. However, the tools'' capabilities are
    not limited to editing search patterns. It evaluates the patterns incrementally.
    Each additional character refines the search. In Extended Search mode, which is
    enabled by default, you can also enter additional patterns separated by spaces.
    The program assigns special meanings to some of the special characters used in
    these patterns (Table 1). You can combine search patterns as described in Listing
    2.


    Using the arrow keys allows you to navigate the search pattern in the Finder.
    The highlighted line shows the selection. Alternatively, some default key mappings
    are available. Any actions selecting and deactivating multiple lines require you
    to jump to the multiple with the -option option. On top of that, the Finder also
    provides mouse control. Using the mouse wheel, clicking, and double-clicking lets
    enable and select. If you hold the Shift key, a mouse click selects multiple items.
    Double click ends the input.


    Otherwise the program works with bindings adapted to Emacs by default. Default
    or deviant key bindings can be set with the -bind option.


    The -command option displays the fuzzy search, returning only exact hits. Other
    important fzf patterns are summarized in Table 3.


    You can define how the program determines and matches with a number of parameters.
    The input lines are evaluated based on the criteria of Table 4. Indexing can occur;
    fzf uses this option by default if you do not specify anything. Fzf evaluates
    the inputs using these criteria, which explicitly selects as arguments for.


    # Table 1: Search for Power Users


    | Character | Example | Result |

    | --- | --- | --- |

    | ^ | linux | Lines with linux |

    | $ | linux | Lines ending with linux |

    | ! | linux | Lines that do not contain linux |

    | skt | Token for fuzzy search (default) |


    # Table 2: Controls


    | Key | Explanation |

    | --- | --- |

    | Ctrl+K | Move up |

    | Ctrl+J | Move down |

    | Ctrl+C | Cancel |

    | Alt+F | Jump one to the right in the search pattern |

    | Alt+B | Jump one to the left in the search pattern |

    | Ctrl+A | Jump to the end of the search pattern |

    | Tab | Select multiple consecutive lines |

    | Shift+Tab | Deselect the selected lines successively |

    | Ctrl+H | Select or deselect all |


    # Table 3: Important Options


    | Option | Explanations |

    | --- | --- |

    | -e/+x | Display only exact matches, disable fuzzy search |

    | +-i | Case (in)sensitive |

    | --algo=v1/v2 | Select algorithm: v1 is faster, v2 has better matches (default)
    |

    | --disabled | Disable search, provide only interface |

    | +/-no-sort | Do not sort output |

    | --tac | Reverse order of input |

    | **User Interface Options** | |

    | -m/- | Enable/disable multiple selection; default, return only one |

    | --cycle | Continue search before the first/after the last entry |

    | --height=PERCENT | Height of Finder as a percentage of the terminal size |

    | -q QUERY | Start software with QUERY |

    | -1 | Do not start Finder for a single match |

    | -0 | Do not start Finder if there is no match |

    | --preview COMMAND | Use COMMAND for the output |

    | --preview-window | Define form, size, and type of preview |


    The --tiebreak=CRITERION option. By default, it uses length or index. Specifying
    reverse ends the software to evaluate lines in reverse order.


    One typical fzf search is a fault-tolerant variant of the locate command. The
    latter searches for files on the local system by reference to the filenames in
    a previously created database. This search is not fuzzy, it does not return in
    cases of typos or overestimates. In the example, locate creates a list of all
    entries and returns it to fzf via a pipe. If you pass -l, it ignores all filters,
    and you can enter entries in fzf''s interactive mode. If you have a large database,
    you will want to exclude many matches to improve the clarity of the results. You
    can do this by passing arguments. For example, if you want to search for something
    but not.


    # Table 3: Modifiers


    | Option | Explanation |

    | --- | --- |

    | length | Prefer shorter lines with matches |

    | begin | Prefer matches at the start of the line |

    | end | Prefer matches at the end of the line |

    | index | Prefer lines near the start of the input |


