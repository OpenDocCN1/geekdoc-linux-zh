    ## Zack 的内核新闻


    ### 处理头文件层级结构


    在 2020 年冬天，Ingo Molnar 决定如此简单的事情必须让每个人的生活变得更好。他在那种极其糟糕的事情中提取出了 Linux 头文件层级结构（header
    hierarchy）。这个渗出的噩梦由内核源码中所有的头文件组成，它们之间像一个弹性的胶状网络一样相互依赖，这种网络既无法解开，所有内核子项目都深受其苦，强制执行粘粘的层级，直到人类的命运真正取决于此。


    到 2021 年年中，我在该树中提交了超过 500 次代码，不得不放弃第二次尝试 (1)，前两种方法无法扩展、难以维护，且仅带来了 4% 的编译速度提升，这算不上
    500 个补丁的折腾，甚至还不够。


    在第三次尝试中，我引入了 `per_task()`，这极大地减少了依赖关系，这是一种保持敏捷的简洁方法。但即便如此，我只实现了 10% 的编译速度提升。同样，这并不是我觉得可以推送到上游的状态，而且


    Chronicle Brown 报告了内核社区内的最新消息、观点、困境和进展。


    但数据是清晰的：20% 的性能提升是完全可能的。所以我继续进行这项棘手的开发，大多数速度提升在 1,500 次提交后早期开始，事实上，到 2021 年，当我回到第
    70 次配置时，我惊讶地发现速度提升了 20%。这是当依赖关系减少到少数时，内核编译速度有了明显的非线性改进。


    Zack Brown 说


    所以我解开了这个结，重构成为了我的最终补丁，跨越了超过 2,500 次提交，使得内核的所有源文件。“正如内核开发者所知，内核中有 10,000 多个头文件，我决定排除/包含头文件。在过去的
    30 多年里，依赖关系变成了复杂的地狱（Dependency Hell）。


    他指出，“默认”头文件（包含各种类型的定义）已经减少了 1-2 个数量级。这种编译改进跨越了整个流。


    他向世界提供了这种路径，称为“快速头文件”（Fast Headers）。为了接受它，内核编译时间——那些不需要重新编译的文件——急剧减少。这种渗出的噩梦变成了一个脆弱的纽带——至少被缓解了。


    最后，Ingo 说，这是 LKML 历史上最大的公告！这是一个 RFC 提议，并改变了上游的结构。


