    # 秘密


    Tor 项目支持保护网络隐私的修改工具集合。我们将提供有关 Tor 的背景并帮助你入门。

    Brucefield 和 Joe Casad 著


    用户在互联网上留下痕迹。Tor 保护你访问的网站以及你的交互，如果不小心可能会导致身份被泄露。越来越多的应用程序为了保护你的隐私，其中最著名的是 Tor Browser
    [1]。


    Tor（The Onion Router 的缩写）是 Firefox 的修改版本，旨在通过多个服务器路由流量并在每个跳点进行加密来隐藏追踪。


    洋葱路由的概念最初由美国海军在 90 年代开发，作为一种安全通信方式。Tor 项目于 2002 年启动。2004 年，海军以免费许可发布了它，电子边界基金会（EFF）成为了该项目的早期支持者。在今天的世界，西方民主国家将隐私视为免受老大哥监控的保护，但
    Tor 的产生很大程度上是为了为极权国家的反对人士提供安全通信。Tor 项目对其 2010 年阿拉伯之春运动的贡献和支持感到自豪，Tor 还支持过许多高风险倡议。其他人道主义组织也因其为活跃国家带来言论自由的潜力而支持
    Tor，包括人权观察和美国国务院民主、人权和劳动局。


    Browser 是一个强大的工具，它隐藏活动也并不令人意外。勒索软件攻击经常利用 Tor 网络进行赎金支付，暗网（非法销售毒品和被盗的信用卡）也利用 Tor
