    ## 头条故事

    ### Portmaster

    ### 使用 Portmaster 管理网络上传

    ### 完全控制


    由于互联网公司对个人数据永无止境的渴望，安全和匿名化在互联网上扮演着日益重要的角色。Portmaster 和 Safing 网络将帮助保护你的隐私——即使你不是安全专家。


    作者：Erik Bäroldt


    加强的数据收集正让互联网用户的生活变得困难。收集数据的并不是 Google 或 Facebook 这类常见的惯犯。传统的软件软件包越来越多地开始“拨家”，并向其供应商和第三方发送“遥测数据”。


    用户通常不会注意到这种数据传输，也不跟踪数据被发送到了哪里。为了停止这种习惯


    ### 理念


    Portmaster 将多个与隐私相关的服务整合到一个包中。Portmaster 包含：


    - 防火墙


    也许 Portmaster 最有趣的部分是，开发者将所有功能封装到一个单一接口中，你不需要成为专家就能理解和管理。直观的 Portmaster 界面使得监控设置、自动拦截追踪器和广告软件，以及为不同的应用程序配置不同的过滤器变得简单。Portmaster
    是 GitHub 上的免费软件 [2]，并在 AGPL 通用公共许可证 (AGPL) 提供。


    ### 工作原理


    在底层，被称为 Portmaster Core 的服务一侧位于内核与用户界面之间，另一侧位于内核与互联网之间（图1）。该核心服务由几个组件组成，其中最重要的是
    SPN、过滤器和 DNS 服务。


    安全 DNS 服务使用 DNS-over-TLS (DoT) 协议，它通过加密的 TLS 连接发送查询。这种加密阻止了未经授权的第三方查看 DNS 查询。过滤器的作用类似于防火墙，也使用过滤器列表。系统引用过滤器列表来阻止不理想的连接。


