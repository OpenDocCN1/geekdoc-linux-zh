    MORRISON


    ## 景观生成器：


    ### TerraForge3D


    回到 20 世纪 90 年代初，如果你足够幸运拥有一台 Commodore Amiga，那么你可能遇到过一个名为 Vista 的卓越应用程序，后来还有 Vista
    Pro。它们并不完美，但也算不上没有生产力。它们是旧硬件上用于生成初始和外星景观的降维空间门户。早期版本作为杂志封面光盘免费赠送，这是一款可以严酷考验你的耐心以及
    Amiga 计算资源的软件。


    Vista 生成的景观，其种子值取自分形、柏林噪声（Perlin noise）或真实的数字高程图。Vista 会根据你的位置绘制出土地的三维轮廓。但聪明之处在于，它如何通过草地纹理、河流、湖泊，甚至是后期版本中的树木来增强视图。这些元素都是通过解释地形算法生成的，生长在较低的坡度上，岩石滚落，河流置于山谷之间。一个洞穴场景看起来可能极其真实，其中一个就被伟大的科幻作家
    A. Clarke 曾使用 Vista 和真实的高程数据来插绘火星可能的样子。


    生成每张图像需要很长时间，令人惊讶的是地形生成的性能似乎能与 Vista 匹配。现代游戏已经非常接近这一点了，然而玩家对生成的景观几乎没有任何控制权，让我们在不被巨巨人攻击的情况下进行探索吧。为什么看到
    TerraForge3D 的发布如此令人兴奋？它是一个具有与 Vista 相同选项的、雄心的跨平台地形生成器。TerraForge3D 仍处于开发的非常早期。但在这一阶段，它是美美的、超现实的且实时超写实的。图像生成过程从
    CPU 或 GPU 绑定的位移开始。除了天空和全局光照设置外，主窗口中管理的其他一切都可以拖出位置并锁定在各个位置，以为你创建最佳环境。添加的 GLSL 着色器带来了真正的真实效果。更改会立即渲染，允许你以新的方式调整值和纹理，并且它们可以相互连接。它就像
    Unreal 中的一个系统一样，你可以阅读文档（或观看 YouTube 托管的教程），并让工作看起来很好，但只要稍加练习，TerraForge3D 就能产出媲美
    Vita 的结果。


    - 视图：你的景观将实时更新。

    - 水体和天空：水位可以添加动画方块，并有天空的反射。

    - 着色器：支持 GLSL 着色器以创建深度。

    - 光谱：使用 denender 节点创建景观的着色器。

    - 网格：景观分布层可以使用 CPU 或 GPU 随机从分形中生成。

    - 光照：全局光照可以在颜色和角度上进行调整。

    - 探索器：如果你想在创建的景观中漫步，那儿有一个全屏探索器。


    项目网站

    https://github.com/Jaysmith101/TerraForge3D


