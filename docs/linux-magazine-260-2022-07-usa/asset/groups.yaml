    # Step-by-Step Chart


    Once the data is ready you can begin creating a chart. Select all the cells you
    want to visualize, including headers, and Insert > Chart in the main menu. The
    first-step chart wizard is shown in Figure 4.


    In the first panel (Figure 4) you choose which chart type and set all the data
    for it. It only takes a few clicks, but it may well be the most difficult step
    to get right. One reason for this is that the right chart type to use depends
    heavily on the actual nature of your data and on what you want to see, learn,
    or show to others through the chart. It''s not uncommon to create multiple, wildly
    different charts from the same set of numbers, each illustrating one distinct
    intent.


    The other reason is that a chart can be better if the order of the columns and
    rows of data are in the right order when you first realize what you want to use
    in them.


    Never draw to rush when you need to create a sketch of what your chart should
    look like on paper, drawing it with lines and then with the result. If you aren''t
    ready to spreadsheet, if data isn''t grouped in the base for drawing the chart,
    rearrange it accordingly.


    For example, recognize which data is actual numbers and which data isn''t numbers
    (as for the chart is concerned, here), but labels for categories. One example
    of the last kind of chart that can contain years of data will be used to clearly
    classify and distinguish age classes. Creating it is not possible, however, I
    will show how to deal with such cases in a manner.


    Correct grouping of data in the spreadsheet makes chart creation faster but may
    still tell nothing about what chart type should be chosen. It depends on the kind
    of data and the relationship between them. If the relationship between the two
    columns is bivocial (as is real mathematics), if each value in the first column
    corresponds to only one unique value in the second column (for example, the maximum
    on each day of the current year) – then a line chart may well be the best. If,
    there is more than one value on the y-axis for any given x value, a scatter graph
    would be much better.


    I strongly suggest only playing with line charts until you become familiar with
    the settings of the chart. Afterwards, it will be easier to master the other chart
    types and, all, to make charts that will then try to impress friends or colleagues.


