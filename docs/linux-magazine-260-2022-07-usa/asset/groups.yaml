    - Star Labs 展示了一台小型尺寸 Linux PC

    - MX Linux 21.1 版本“Wildflower”现可用


    # Danielle Foré 为 elementary OS 7 带来更新


    Elementary 创始人兼首席执行官 Danielle Foré 宣布了 6.1 版本的更新并补充说 elementary OS 团队正在为即将发布的
    7.0 版本做准备。虽然 7.0 还没有固定的发布日期，但他们已经宣布了一个代号（Horus），并且团队正专注于快速发布或为 elementary 版本添加大量新功能。


    ![](img/e14c497f4d6e147991bb436d686b6f14_7_0.png)


    从 6.1 到 7.0 的变化将是微妙的。


    他们计划在 7.0 中实现的功能包括自动应用更新和电源配置方案。此外，7.0 将首次推出极简的 Music 应用，并将某些组件迁移到 GTK4（这将带来极大提升的性能和更平滑的动画）。


    7.0 有一点将不会切换到 Wayland。尽管他们正在为转变做准备，但 elementary OS 已经准备好进行跨越了。


    在 elementary OS 官方博客 (https://blog.elementary.io) 上获取更多信息。


    # Linux New Media 发布开源职位枢纽


    Linux New Media 与同 FOSSLite 和《Linux Magazine》，很高兴宣布推出 Open Source JobHub (https://japensourcejobhub.com/)，这是一个帮助人们在开源社区中找到职位的招聘板。


    该平台面向开发者、工程师、经理、营销人员和开源人士，Open Source JobHub 可以帮助你找到最合适的工作。现在比以往任何时候，科技行业都处于爆炸式增长，Open
    Source JobHub 将帮助你应对日益增长的机会。


    > “Open Source JobHub 不仅涵盖使用开源技术的职位，还涵盖销售、市场等其他角色，并致力于为全球开源社区提供服务。我们的目标是建立职业联系，”Linux
    New Media 首席执行官兼出版经理 Brian Osborn 说道。


