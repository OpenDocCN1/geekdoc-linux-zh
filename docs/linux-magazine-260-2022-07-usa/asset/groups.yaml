    执行命令有两种方法。如果你使用 `execute` 动作，fz 会执行命令行，等待命令结束，然后显示其输出。在许多情况下，这正是所需要的行为。为了防止 fz
    等待并从而在执行期间不捕获进一步的输入——你可以在命令后继添加一个参数以便在后台运行命令。如果你不需要已执行命令的输出，请使用 `execute-silent`
    动作。程序将运行命令但丢弃输出。


