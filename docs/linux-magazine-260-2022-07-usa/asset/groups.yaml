    Tor 网络上的匿名性


    比特币交易过程可能会泄露可能导致用户去名的信息


    # 允许使用此浏览器的 Cookie 吗？


    我们使用 Cookie 和类似技术来：


    - 提供并改进内容产品

    - 通过从 Cookie 和 Facebook 之外接收的信息提供服务

    - 为拥有账户的用户提供并改进 Facebook 产品


    为了 Facebook 之外的广告和测量服务，以及提供更好的功能和服务，我们从 Facebook 上的其他渠道收集数据。这些渠道也使用了 Cookie。


    你可以使用所有 Cookie、仅使用必要的 Cookie 或选择更多选项。你可以在我们的 Cookie 策略中找到有关我们使用哪些以及如何使用 Cookie
    的更多详细信息，并随时更改你的选择。


    # 必要的 Cookie


    使用 Meta 产品需要这些 Cookie。它们对于确保这些服务按预期工作是必不可少的。


    关于 Tor 网络匿名性的研究大多集中在入口节点和退出节点。你可能不知道网络内部发生了什么，但如果退出节点是你，你仍然会获得有关流量的信息。Tor 项目无法防止所有的端到端攻击。“如果攻击者可以捕获从你的计算机发出的流量，以及到达你目的地的所有流量，他可以使用统计分析发现它们属于同一个电路。”


    ![](img/e14c497f4d6e147991bb436d686b6f14_23_0.png)


    图 9：由于你正在匿名浏览，请准备好选择某种 Cookie。


    我们使用网络浏览器来存储用于免费监控的算法和信息。Tor 项目将为你提供更多关于配置和启动隐藏服务的指导。


    # 局限性


    Tor 浏览器是在线匿名的强大工具，但它具有用户应该注意的一些局限性。破坏 Tor 两种明显方式：


    - 通过日期技术破解加密（如果退出节点未加密）

    - 利用系统组件之一的漏洞。例如，浏览器是 Firefox，它存在需要补丁和更新的漏洞。


    潜在攻击与你是否正在执行某种操作无关，安全研究人员会寻找 Tor 网络中的漏洞，Tor 项目最终会解决这些，因为透明度是他们的价值观之一，如果存在漏洞，他们会揭露它而不是绕过它。


    政府也一直试图破解 Tor 网络，但他们比学术界更少发表关于他们如何做到的结果报告。多年来，暗网上发生过多次重大崩溃。例如，2014 年，一个政府联盟接管了
    Tor 中继节点，导致了包括丝绸之路 2.0 在内的多个暗网网站关闭。当时没有一个 Tor 部署者确切知道这些机构是如何完成这次攻击的（被称为“匿名行动”/Operation
    Oonymous），但 Tor 开发人员发布了一篇博客，对可能发生的情况提出了一些想法，建议如下：


    - 操作安全——被盗的密码和恶意用户（与互联网上其他人受攻击的方式相同）

    - Web 应用程序中的漏洞可能导致 SQL 注入或其他攻击。

    - 比特币去匿名——根据专家的说法，


    # 结论


    Tor 开发者将隐私视为每个人都应该拥有且必须在私下受到保护的人权。该项目高度重视用户的安全。他们知道有些用户访问平台是为了非法活动，但他们坚持大多数用户有正当目的。Tor
    是一个工具，就像任何其他工具一样，可以用于善或恶。罪犯可以使用工具，但人们通常认为工具也能帮助合法用户。


    如果你担心自己的隐私，并依赖浏览器和你不可靠的浏览器设置来保护你免受监控，现在可能是探索 Tor 网络的时候。在隐私和安全日益关注的时代，Tor 对于保护你自己和数据非常重要。


