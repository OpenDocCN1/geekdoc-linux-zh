    control it via a web interface (Figure 1). You can set it up on a home computer
    or on a server on the web. All planned functions can be accessible if desired.
    Containerization with Docker is another way to installing Dim directly. One unique
    point is that Dim is implemented in Rust. The Rust programming language, which
    has under development by Mozilla is now supported by a large community, currently
    establishing itself as a kernel language alongside C. The design brief for Rust
    is that it has to be simple and easy to use while offering better security and
    faster execution speed. Plex, on which Dim tries to emulate, is a Python program.
    Because there are no packages of Dim for distributions, it is important to check
    the required dependencies on multimedia libraries


    before you. The libraries should already be in a normal desktop installation,
    assuming that FFmpeg is installed. Listing 1 shows how to install the required
    packages on Debian and its derivatives (first line), as well as on Fedora and
