    # 新老板


    亲爱的读者：


    正当本杂志印刷之际，试图收购 Twitter 的埃隆·马斯克（Elon Musk）宣布，一位此前被该平台封禁的政治人物将回归。面对这家博客巨头的掌舵人，我将附上惯常的免责声明：我们讨论的是技术，而非政治。它不属于一个人们本应该认同这种封禁的共和国。问题在于，是否存在一种内容审核的意识，以及在马斯克收购后是否还会有这种意识。


    变革即将来临的消息震惊了互联网。马斯克自称为“言论自由绝对主义者” (1)，并认为 Twitter 应该让他随心所欲地发言。很多人担心这种言论自由绝对主义会带来什么。Twitter
    的批评者将其视为对平台上仇恨、欺凌、厌女症和虚假信息（也称为谎言）的邀请，并担心较松的审核对对世界意味着什么。


    然而，正如许多事情一样，头条新闻中缺失了一些内容。像大多数平等主义万富翁一样，马斯克拥有一种奇特的方式，在选择自己的道路的同时又表达一切。他说，当被封禁的政治人物开始发布侵犯性推文时，使用
    Twitter 的用户是“非法或愚蠢的”。马斯克表示他不相信永久封禁，但他为临时挂禁以及删除他认为对世界具有破坏性的账户留了余地。


    那么埃隆说了什么呢？“如果你不允许那些‘破坏世界’的推文存在，你就需要某种形式的代理或实体来判断一条推文是否具有破坏性。一旦你知道了如何做的规则，这听起来其实很像审核。”


    [1] Milno, "言论自由绝对主义者埃隆·马斯克表示将改变一切，《卫报》，2022年4月14日，https://theguardian.com/technology/2022/apr/14/elon-musk-free-speech-absolutist-will-transform

    [2] Elon Musk 表示他扭转了 Twitter 对特朗普的封禁，”CNN，2022年5月10日，https://www.cnn.com/2022/05/10/tech/elon-musk-twitter-trump-ban/index.html

    [3] Elon Musk 表示他在社交媒体方面与欧盟‘完全一致’，作者 Adi Robertson，The Verge，2022年5月10日，https://www.theverge.com/2022/5/10/236527/elon-musk-twitter-digital-services-act-des-union-europe-speech-laws-eu-regulation

    [4] Group, Nichrome and Rachel Parsons，“特斯拉埃隆·马斯克赢得诽谤诉讼，”路透社，2019年12月6日，https://www.reuters.com/article/article-us-tesla-elon-musk-wins-defamation-of-his-pedo-guy-tweet-idUSL8KBNYI300U/


    有趣的是，马斯克与欧盟委员蒂埃里·布雷顿（Thierry Breton）会面，并在拟议的《数字服务法案》(3) 上与欧盟达成一致，这项实验要求马斯克遵守内容审核规则以删除仇恨言论和虚假信息。他的雄心似乎与之并不兼容，但在该会议之后，马斯克表示他必须符合其运营国家的法律，而且他也同意法案的其他特征，如更高的透明度和开放的算法。


    这种格式应符合国家法律的观点，与马斯克所看重的言论自由概念形成了鲜明对比，他似乎会遵守俄罗斯和中国等国家实施的审查异见人士言论的规则。换句话之，他让个人价值观阻碍了业务发展。


    真正的问题是，他对于完全自由社交媒体的愿景，马斯克作为一个 Twitter 爱好者，是否适合利用他的 Twitter 自由来称呼那个将男足足球队从“色魔”手中救出来的山洞人。案件结束后，他补充道，称某人为“色魔”并不意味着你称呼他们为恋童儿童——那种话是你在你不喜欢他们的观点时在
    Twitter 上说的话。


    如果他创造了一个让垃圾内容盛行的环境，许多人会离开。科技社区习惯于以史诗般的历史术语表达自己，将其视为文明不可避免的新趋势，但对于 Twitter 来说，唯一重要的是是否值得。如果新闻报道不再信任它，或者它不盈利，Twitter
    就输了——而我们也失去了他。


    所以也许新的 Twitter 到底没那么不同？或者想想‘新老板就像老老板’。


