    # DOGHOUSE - 本地内部支持 Linux 之声


    # MADDOG''S DOGHOUSE


    作为社区服务的工具和本地 Web 流量缓存有助于改善互联网服务。作者：JOHN "MADDOG" HALL


    ## 更好的服务本地工具


    我最近前往古巴参加了 Informatics 2022 会的演讲，这是一场在哈瓦纳行的国际技术会议，聚集了来自世界各地的演讲者和参与者。这让我亲身体验了如今古巴的现状。


    对于不熟悉这个国家的人来说，它是墨西哥湾外的一个岛屿，人口约 1100 万。在过去的 60 年里，它与世界的贸易方式非常独独特。Jon "Maddog" 是一位作家、教育者、科学家和软件先驱，自
    1994 年遇到 Lin Torvalds 以来，他一直是 Linux 的热诚支持者，并提倡在 x86 系统上使用 Linux。他担任 Linux International
    的主席！


    从计算机的角度来看，我使用的桌面电脑和笔记本电脑都是全球认可的品牌。人们从美国以外的国家购买它们，并通常使用与大多数人相同的操作系统。我没有注意到基于 Linux
    的系统的缺失，我想这可能是因为古巴是一家从那里进口产品的美国公司。


    本世纪的交叉连接机。在那个系统中，当一个人连接上时，另一个人就无法连接。当拨号上网仍是标准时，按连接收费是切行的。


    有了现代的数字连接，可以根据使用情况的变化使用数据并按日期收费。大多数互联网公司并不认为将计费中的连接费用合并是我可以做的事，但这确实让互联网变得更加困难且实用性更低。


    古巴政府决定将 FSHC 作为一种策略。他们有自己的发行版 NOVA，将广泛应用于政府和商业领域。


    另一个问题是，农村地区的互联网访问不像城市地区那样——古巴及其他地方可以通过使用“箱式互联网”（Internet-in-a-box [2]）获得显著帮助，它通过缓存本地反复请求本地数据来提供帮助。


    古巴大部分地方都有互联网，可以使用 WiFi 和手机。因为我使用 Google WiFi（在古巴无法使用），而古巴的 WiFi 并不如我预期，我可以轻松使用带有缓存的
    WiFi。我可以在机场买一张 SIM 卡，然后发现 WiFi 是值得付出的。


    年前，酒店和其他设施安装了分机交换机（PBX），因为他们意识到局域电话通话正在构建当地的基础设施。他们不需要从每个办公室到电话交换局拉 500 根线缆，而只需要在大楼内运行一个
    PBX，这样只有 PBX 到交换局的一小部分线路布线会被同时使用。


    我的 WiFi 虽然能满足大多数用途，但为我节省了精力和连接时间。为了省钱，我不实际使用时会断开 WiFi 连接，这意味着我也无法接收通知，而我想用 WiFi
    时才连接就很麻烦。经常地，我会忘记。


    上世纪的电话簿已被如今的页面所取代，现在你必须通过本地方法触及每一页，这类似于 PBX 的问题——缓存在本地的“箱式互联网”上。


    面临相似挑战的社区，利用网络代码建立社区服务器可以来自 FreeBSD，这将允许本地用户在社区内部做出响应。一个带有 BSD 的廉价单板电脑仅需几美元即可提供可靠、安全的数据缓存。


    我面临的问题之一是，这个岛屿公司由国家所有，没有竞争。我不确定会发生什么。


    信息

    1. Nova: https://en.wikipedia.org/wiki/Nova_(operating...system)#~text=%20ht%21first%20year%20of%20Nova,Edition%20based%20on%20untu

    2. box: [link]

    3. ugrep: [link]

    4. fzf: [link]

    5. fzy: [link]


    ## FZF/FZY


    Fzf 代表 Fuzzy Finder（模糊查找器）。该工具作为一个通用过滤器，在交互模式下也作为一个菜单。调用 fzf 会启动该工具并通常显示当前目录下的所有文件。


    如今，模糊搜索是 IT 生活不可或缺的一部分。它们可以纠正拼写错误，以合理的开销找到你需要的内容。基本原理基于 Levenshtein 距离，该距离定义于
    20 世纪。


    Levenshtein 距离描述了将一个字符串转换为另一个字符串所需的最小更改次数。这些操作的权重方法决定了两个字符串的相似程度。权重意味着例如，两个字母的交换（如拼写错误）比插入字符更重要。


    Fzy 已经是许多系统中使用的工具。根据其开发，增强版 fzy 提供了改进的算法和更快的速度。在交互中，fzy 将自身与选项基础结合，这简化了选项。


