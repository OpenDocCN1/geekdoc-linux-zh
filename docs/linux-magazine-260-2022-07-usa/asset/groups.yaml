    Modern filesystems are moderately resistant to power failure, even the mighty
    ZFS could suffer from a blackout [9]. A UPS will help, but beware of cheap units:
    Many budget UPS are not prepared to handle operation and will wear down the NAS
    with them. According to a Poononen Institute''s 2016 survey, UPS failure is the
