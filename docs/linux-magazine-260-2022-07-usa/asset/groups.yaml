    ## 关于 ECC


    良好的 NAS 通常会配备 ECC 纠错码内存（ECC RAM）。ECC 能够针对随机错误进行自我纠正，而这些错误发生的频率比人们想象的要高。内存错误被认为对服务器的生存是危险的。内存中的位错误可能导致系统崩溃，或导致文件损坏。ECC
    旨在减少此类事件的发生风险并保持运行。


    ZFS 被构想为一种自愈文件系统，它在写入数据时使用校验和并检查数据。如果 ZFS 尝试读取一个被（例如）硬盘缺陷损坏的数据块，文件系统将识别该问题并从数据中即时修复。


    FreeNAS 项目（现为 TrueNAS）被证明位内存操作可能会对文件系统造成永久性破坏，由于没有可用的恢复工具，数据可能会被销毁。然而，ZFS 是否容易受到其他故障模式的影响？ZFS
    项目联合创始人 Mathews 认为，使用非 ECC 内存运行 ZFS 与运行文件系统一样危险，尽管 ECC 内存并非必须，但被强烈建议使用。


