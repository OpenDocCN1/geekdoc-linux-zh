    # # Test Drive


    With many Linux distributions to choose from, you can spend a lot of time downloading
    and installing before you find the right one for your needs. DistroTest.net lets
    you test a variety of Linux distributions from the browser without the up-front
    installation work. By Erik Bärwald


    +   If you have been thinking about switching from another operating system to
    Linux, you will initially be confronted with a large choice of distributions,
    desktop environments, and more than half a dozen desktops and hundreds of distributions
    to compete for your favor.

    Until it has been difficult, newcomers to find the Linux derivative best to suit
    their needs, due to all these choices. The dilemma is now done and dusted. The
    DistroTest new website [1] lets you try out more than 370 Linux distributions,
    without having to install them or a live-system from a removable disc.


