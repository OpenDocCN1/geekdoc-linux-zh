    # Tor 中的路由


    Tor 网络是由一组运行软件的服务器组成的，这些软件允许它们参与洋葱路由（onion routing）。洋葱路由的存在比 Tor 网络更久，而且它是一个更通用的术语——
    Tor 拥有一套基于洋葱路由的特定协议。


    去中心化的系统（称为“洋葱”）通过一系列 Tor 中继节点（见图 2）路由消息。消息被分层加密，因此电路上的每个中继节点都知道谁发送了消息以及应该将其转发到哪里。下一个中继节点会解密消息。电路知道数据包的最终目的地，但不知道源地或目的地。


    如图 2 所示，使这一过程运行的关键在于路径上的每个节点只知道它需要的信息，而不再知道更多。Tor 客户端分层构建此消息（见图 3），这些层像洋葱的层一样被逐层剥开（因此被称为洋葱路由）。


    为了构建这种多层消息（称为洋葱），Tor 客户端必须从电路中的每个节点获取一个对称会话密钥。这些密钥是通过节点之间的一系列公钥（Diffie-Hellman）连接获得的，节点会将加密后的会话密钥传回给客户端。


    客户端使用节点 3 的会话密钥加密其想要发送到目的地的消息。这条加密后的消息使用节点 2 的会话密钥加密，然后使用节点 1 的会话密钥加密。当节点 1 接收到消息时，它知道发送者，但不知道发送者是源头还是只是电路中的另一个节点。节点
    1 知道会话密钥并获知它应该将消息发送到节点 2。节点 2 解密发给节点 3 的消息。节点 3 解密最后一层，并发现它必须将消息发送到目的地。节点 3 不知道消息是谁发起的，但它知道自己是从节点
    2 处接收到的消息，并记住这一事实，因此它将知道如何从服务器回传回复。


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_0.png)


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_1.png)


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_2.png)


