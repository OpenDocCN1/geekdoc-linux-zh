    # Init 自由的斗争


    # DEVUAN


    Devuan 凭借其对 Init 自由（Init Freedom）的承诺，为用户提供了 systemd 的替代方案作为初始化进程。作者：Bruce Byfield


    长期 Linux 用户可能还记得，Debian 曾被视为无政府主义者的选择，拥有大多数大多数人拒绝的激进想法。有时，Debian 在发行版中对于自由软件基金会做出的决策甚至更为极端。然而，多年来，Debian
    开发了自己的层级结构，以允许两种类型的替代方案。今天，最让人想起早期 Debian 的衍生版是 Devuan [1]，它于 2014 年从 Debian 分叉，基于决策方式以及使用它们的技术含义。最近，两个
    Devuan 开发人员——fsmithed（构建镜像并提供支持）和 golin（社区经理）回顾了 Devuan 的问题。由于 Devuan 缺乏正式的层级结构，他们强调他们的备注是“官方的”。2014
    年，Linux 发行版忙于从 SysVinit 转向 systemd 作为系统的第一个进程并管理其他进程。Ubuntu 自那时起开始将其作为默认。然而，systemd
    引起了争议。相反，systemd 比初始化系统复杂得多。正如 Devuan 论坛所描述，“调用初始化系统就像称呼一辆汽车”。如果不清楚，systemd 和其他系统之间没有区别。从这个角度来看，systemd
    不仅过度设计，而且违反了 Unix 开发的基本原则。Christopher Berry 在 Linux 归档中指出，这种哲学让 Linux 成为一组可以组合以满足需求的组件
    [3]——一个既灵活又易于使用的操作系统。同样重要的是，模块化结构允许以不同的方式组装部分，以便


    ![](img/e14c497f4d6e147991bb436d686b6f14_25_0.png)


    2022年7月 LINUX-MAGAZINE.COM | LINUXPROMAZINE.COM


    # 评测

    每个区别都是独特的。相比之下，devuan 在所有 Linux 系统上实施了一种结构——这在某些方面很方便，但在另一些方面却限制了维护多个系统的多样性。从首次发布以来，Devuan
    继续添加替代方案，并向许多其他人开放。在 Devuan 的日子，它列出了 OpenRC 等替代方案，运行。


    正如预期的那样，Debian 邮件列表对这些进行了广泛讨论。出乎意料，讨论以许多 Debian 用户的决议告终。获胜方案是使用 systemd，但同时，一个支持
    systemd 的普遍决议——许多 Debian 用户很少提到的分歧，使用 systemd 的决策是由 Debian 层级结构强加的。Bionic、Pine
    等 [9]。尽管 Devuan 可能是一个小众发行版，但显然是一个蓬勃发展的发行版。Devuan 能成为主流吗？这是可能的。Linux 处于生活的许多部分都是自由的时代。Pulse
    Audio 被 PipeWire 取替——有助于系统的整体改进。同时，对于那些反对替代方案的大多数，Devuan 保持了 Debian 的早期精神。2014年11月24日，宣布了
    Devuan 分叉。其意图是产生一个远离系统自由锁定问题的发布和维护发行 [4]。


    # 信息


    此外，Init Freedom 页面列出了提供自由替代方案的其他发行版，以及与这些发行版密切相关的 Devi Galaxy Forum 和 Devuan IRC
    频道 [7]。


    - [1] Devuan：https://www.devuan.org

    - [2] dasein 的“反对修订历史”，Debian 用户论坛，2015年2月，https://www.devian.net/viewtopic/...

    - [3] Christopher Berry 的“给 Linux 的公开信”，Linux 内核存档，https://github.com/linux-kernel/kernel/blob/420/...

    - [4] Devuan 通知：https://www.devuan.org/announce/

    - [5] Init 自由：https://www.devuan.org/or-init-freedom

    - [6] Devi Gallery：https://www.devigallery.com/search.php?search_id=14156802

    - [7] Devuan 的 IRC 频道：https://ripenebter.net/clircags/devuan/

