    # This Month’s DVD


    ## Ubuntu 22.04 and Fedora 36

    Two Terrific Distros on a Double-Sided DVD!


    ![](img/e14c497f4d6e147991bb436d686b6f14_5_0.png)


    ## Ubuntu 22.04 64-bit


    Codenamed Jellyfish, Ubuntu 22.04 is the latest long-term support (LTS) release,
    receiving security and maintenance updates until April 2027. In the usual tradition
    of releases, Ubuntu Jellyfish is full of new features and modifications.


    Many of the modifications are cosmetic, such as the addition of icons for a shorter
    dock, a change in icon in various dialogues, and new themes for those who prefer
    atoms playing icons on the lower right, while others are more versatile, such
    as the addition of corners for single-click actions or the option for a minimal
    installation, which is a security feature long overdue.


    Unusual for an LTS release, Ubuntu Jellyfish is shipping with some limitations:


    - The new kernel performs poorly under Wayland

    - Wayland is used by default, but not for NVIDIA cards.

    - The GRUB bootloader does not detect other operating systems or distributions.
    To correct this problem, download os-prober if necessary, and add the line GRUB_DISABLE_OS_PROBER=false
    to the configuration and update GRUB.


    Given five years of use, these problems will be fixed shortly. Meanwhile, if these
    problems do not affect you, then this latest LTS release should provide the distribution''s
    user-friendliness for all levels of users.


    ## Fedora 36 64-bit


    Fedora 36 has been delayed several times, but it should be released by the time
    you read this. It will be supported until May 17, 2023.


    The Fedora distribution has a long-established reputation for innovation, but
    Fedora 36 is a relatively modest release. As usual, the new release includes new
    wallpapers and themes, of many reflecting the recent fad for dark mode. However,
    many of the new features are due to the Linux kernel and the very latest Linux
    42 release, and Fedora’s own contributions to the release are largely concealed,
    as enhanced support for drivers means Fedora 36 can be considered a maintenance
    release that catches up with upstream projects and continues modifying the things
    that have been eased into the distro over the past few years.


    Defective bits will be replaced.

    Please send an email to us@linuxmagazine.com.


