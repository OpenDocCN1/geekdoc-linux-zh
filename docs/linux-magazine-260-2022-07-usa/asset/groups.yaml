    如果文件包含值 1，则基于 VT-d 的 DMA 保护处于激活状态。如果值为 0，则 IOMMU 可能未激活，或者您使用的是旧设备，又您没有在使用 Thunderbolt
    4。如果您使用 Thunderbolt 硬件，即使是版本 3 也可以拥有安全功能。


    您可以在系统文件系统中手动授权设备，或者使用 bolt 工具 [3]。该工具由一系列工具 (bolt) 组成，它们与系统文件以及注册为系统可用的 Thunderbolt
    设备建立接口。DMA 总线保护盒（也称为 bolt!）只显示您已注册的设备。然后您可以使用以下命令授权设备：


    ```

    bolt authorize <ID>

    ```


    ## 五种可能的安全级别


    Thunderboltget支持五种安全级别：无 (none)、安全 (secure) 和唯一 (unique)。您可以为系统中的形成的 Thunderbolt
    总线设置级别。要查看激活的是哪种级别，请通过以下命令查询 Linux 文件系统：


    要使用 I/O，您需要在系统 BIOS 中启用 IOMMU。在终端中使用 `lspci` 工具可以检查哪些设备处于激活状态。


    使用 sysfs 配置 Linux 内核的子系统。此处包含了各个选项的描述。


    如果您想使用用户级 (user) 或安全级 (secure)，您需要在设备和系统之间建立连接。设备级会创建一个共享密钥，设备必须使用该密钥根据系统时间对其进行身份验证。该密钥应存储在设备上，同时也存储在系统文件系统中。


    ## Thunderbolt 历程


    第一代 Thunderbolt 的最大传输率为 10Gbps，具有两个双向数据传输通道。随后，版本 2 发布，最大速度达到 20Gbps。


    2019 年，版本 3 将 Display Port 接口替换为正反 USB-C 接口。版本 3 引入了隧道技术以实现高达 40Gbps 的传输速率。版本
    3 可以为高达 100 瓦的设备供电。


    如今，用户使用的是 Thunderbolt 4 技术。它不支持更快的传输速率，但提供了一些新功能。例如，完全支持 USB4 标准。下行模式下的 USB 集线器也非常有用；它只需一根线缆即可连接设备（多达
    4 个显示器）、外接硬盘并为电脑供电。


