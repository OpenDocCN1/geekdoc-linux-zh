    # High Availability vs. Backup


    Your NAS isn''t enough – you still need to back up your data!


    # Not All NAS


    Some users trust their data to powerful file servers that advertise enterprise
    data protection, but your Network Attached Storage system might not be as safe
    as you think. By Rubén Llorente


    There is a point in the life of a compulsive data holder: a regular computer is
    not enough to contain a burgeoning file collection. Upon the relentless expansion
    of a massive data collection, the first step to extend the storage capacity is
    to purchase a USB hard drive. The hard drive will buy time, but eventually this
    solution will fall short. A data holder who is dedicated eventually has to invest
    in a Network Attached Storage (NAS) server. A NAS is a dedicated server optimized
    to store large amounts of information. NAS servers are commonly available as commercial
    appliances, but many power users prefer to build their own from parts. Serious
    NAS servers are stable and allowed to increase their capacity by adding hard drives.
    Better yet, they often offer features that come in handy, and they prevent mitigations
    to the most common threats against the long survival of your files. NAS vendors
    often emphasize fault tolerance and prove the immunity of their systems from disaster,
    which causes users to treat this sort of storage as bullet-proof, dumping and
    skipping the step of making backups. But rarely these consumer-grade storage systems
    provide a complete solution. This article describes some of the things that go
    wrong – and why you still need to perform backups to ensure your data is safe.


    # The Features of a Quality NAS


    A wide range of NAS options are available for home users. These options vary in
    quality from desktop systems to quasi-enterprise systems passing as appliances
    (Figure 1).


    With the exception of low-end, boxes are built with the purpose of offering the
    best possible availability. In contrast, a high availability machine is one that
    can keep serving its users under adverse conditions. Such a server needs to be
    built to keep functioning if a hard drive fails, if the grid goes out, or if the
    power supply malfunctions.


    Servers mitigate drive failure through the use of Redundant Array of Independent
    Disks (RAID). A RAID group is just a set of hard drives that are recognized as
    a single virtual drive by the operating system. In a naive DOS setup, these contexts
    are built into the software. may be called "RAID Levels" for more information
    on some configuration. RAID 5 distributes the data within the array every device,
    with some extra parity components. If one of the drives fails, the server will
    keep functioning in a degraded state by keeping the remaining drives running and
    using the parity data to reconstruct lost array. A server can use Uninterruptible
    Power Supply (UPS) which is just a battery that kicks in when the power goes down
    (Figure 6). USB or Ethernet to connect with the server to let how much power is
    left.


    JULY 2022

    ISSUE 260

    LINUX-MAXIME.COM


    # Popular RAID Levels


    RAIDs are built in multiple ways, depending on the purpose they serve. The most
    popular traditional RAID levels are:


    - RAID 0 stripes all the drives in the set for increased performance (Figure 2).
    The total size of the RAID is the sum of the sizes of every individual drive.
    A disk failure kills it, making it a dangerous level to use. RAID 0 has no better
    read and write throughput than a single hard drive of the same size as, because
    the work is distributed over the individual drives in the array.

    - RAID 1 mirrors all the drives in the array (Figure 3). Since every drive has
    a full copy of all the data, RAID 1 can keep functioning as long as one of its
    drives is still operational. RAID 1 is good for keeping a proper uptime, but it
    is not cost effective, at the very least, it takes as many drives as for the same
    storage capacity.

    - RAID 5 is the most popular in itself. This form of RAID is known as striping
    with parity. The disks are striped (with RAID 0), but an additional drive stores
    parity to keep functioning if one of drives fails (Figure 4). RAID 6 does pretty
    much the same thing, but it can keep functioning after two drive failures.

    - RAID 10 is a combination of RAID 0 and RAID 1. Drives are striped in pairs which
    each mirrors the other. Then the pairs are striped in a RAID (Figure 5). RAID
    10 can keep functioning as long as at least one drive in each pair is working.


