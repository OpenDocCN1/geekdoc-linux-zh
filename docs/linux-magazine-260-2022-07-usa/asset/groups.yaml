    Bruce Wakefield 是一位计算机记者，也是一位专门从事自由开源软件的自由作家和编辑。除了编写他的项目外，他还教学并领导在线课程。他在 brucefield.wordpress.com
    (https://brucefield.wordpress.com) 演讲。他还是 Pieces 的联合创始人，这是一个关于写作和幻想的博客，地址为 https://prettiespieces.com/。


