    \ goal is to move the loops up and down the hand without touching it. For an even\
    \ better idea, you can try to do both at once in the same or opposite direction.\
    \ Either way you touch the hands, a buzzer and light come on and off the handles.\n\
    \nThe original circuitry for the hands comprised interconnecting relays to switch\
    \ the assorted components. The design had no microcontrollers or anything simpler\
    \ than a switch, which had several drawbacks – but the main one was that the puzzle\
    \ was abandoned mid-run, the light, buzzer, and vibration motor would run continuously\
    \ until the hands were removed.\n\n## Physical Rebuild\n\nWhile I rebuilt the\
    \ electronics, I sent the case out to be rebuilt as well. The original design\
    \ was out of ply and had a lot of dents and scratches. The case was very beautiful\
    \ because it had areas that needed to be reinforced. Ultimately, I had every part\
    \ replaced with Delrin, a very hard plastic that would withstand wear and tear\
    \ better than plywood.\n\nThe physical rebuild also incorporated larger vibration\
