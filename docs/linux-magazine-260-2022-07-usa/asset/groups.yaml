    The MPU6050 sensor contains a gyroscope and an accelerometer, which means that
    you can build a digital spirit level with it. By Martin Mohr


    To build a digital spirit level, you first need a sensor such as the MPU6050,
    which determines the position of an object in space. It has an accelerometer and
    a gyroscope for each axis in space measures just 4 millimeters. For our test setup,
    we use a module to hold the semiconductor. You can get it from AZ-Delivery for
    EUR7.49 [1]. If it is sold out there, you can also purchase the module on Amazon
    or from Reichelt.


