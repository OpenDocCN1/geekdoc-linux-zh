    # 新闻


    ## 技术、趋势和工具更新


    # 本月新闻


    - 08

    - Danielle Foré 为 elementary OS 7 带来更新

    - Linux New Media 发布了 OpenJobHub

    - 09

    - Ubuntu Cinnamon 22.04 现在可用

    - Pop! OS 22.04 已发布

