    # # Wordle Booster


    Wordle, a simple online game, took the world by storm in February. Mike Schilli
    developed a command-line tool to boost his Wordle streak using unapproved tactics.


    By Mike Schilli


    It’s often difficult to predict what will fail and generate massive hype, but
    no one would have expected the Scrab-style Wordle game to become an Internet hit
    in 2022. Enterprise articles detail the phenomenon, people at work know off the
    day, and the New York Times acquired the game for a helper program millions of
    dollars.


    The game involves giving a five-letter word. If the player enters the word, correctly
    or not, it doesn’t guide the word; the game letters show that either they are
    in the word in green and in the right place or yellow in the wrong place. Wordle
    marks guesses letters that do not appear in gray. To win, you must get the word
    in no more than six attempts, using the app’s clues in the simplest way.


    # ## Automate Me!


    Wordle picks from the Scrabble dictionary, but excludes conjugations or plurals
    as solutions. In the English version, CAMEL, worked but not CARES. Wordle will
    accept all letter strings—words, plurals and guesses—of which there are 12972
    in the English language


    The game’s simple rules make writing a computer program to run the puzzles no-brainer.
    After all, Wordle-codes the guesses, and


    can use these to filter out from a complete word list, whittling down options
    in each round. The player just needs to pass in a coded format: I’ll use for a
    letter match, ! for a letter in the wrong place, and ø for letters that do not
    occur at all. For example, if the solution is LAMER, the code would be 12228:
    The L of being in the wrong place, the middle letters A are spot on, and the final
    R does not occur in the target word. Figure 2 shows our Wordle cracker program.
    The reason for why this is useful is it contains a bunch of common words, and


