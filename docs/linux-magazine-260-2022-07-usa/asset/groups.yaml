    当误解被消除后，Devuan 分叉超出了它的价值。


    再次强调，“我们严重依赖未修改的 Debian Debian。我们只打包需要 system 的包。Devuan 和 Debian 之间的协作是成功的，尽管我们经常看到的是
    Bug 修复而不是新功能。”


    # 超越 Init 自由


    与其说是某个反系统项目。


    在赞誉中，Init 自由意味着支持对 init 的选择。尽管 systemd 的支持者认为，Devuan 通常被提到是因为它是一个徒劳无功的常见错误假设。Devuan
    还有正在开发的 Arch Pimaera。最新的 Devuan 版本还包含一个不安装 PulseAudio 的选项，以启用语音和声音同步。此外，至少存在一个
    Devuan 衍生版Maestro Leeste，其目标是在 Nokia N900、Motorola Android 4、Motorola 等手机和平板上提供自由开源体验。


    ![](img/e14c497f4d6e147991bb436d686b6f14_26_0.png)


    图 1：Devuan 支持 init 替代方案的选择。


