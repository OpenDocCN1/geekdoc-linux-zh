    \ MEDIA MANAGER\n\n## # A Plex alternative\n## Pilot Program\n\nDim, a relatively\
    \ new open source media manager, looks to implement the appearance and feature\
    \ set of the commercial Plex media center.\n\nBY FERDINAND THOMMES\n\nAny media\
    \ players, also known as theater software or media managers, are available for\
    \ Linux. In particular interest are the candidates that rely on Linux because\
    \ of the client-server principle, which users use to secure access from the outside.\
    \ The better-known representatives of this genre include the open source projects\
    \ Kodi, Emby, LibreLEC, and Jellyfin, and the proprietary Plex (1), which originated\
    \ as a fork of the Xbox Media Center's (XBMC).\n\nFor about a year, developers\
    \ have been working on Dim [2], open source software that emulates Plex's appearance\
    \ and functionality as closely as possible. First released in April 2021, the\
    \ current version is 0.3.1. By the time you read this article, version should\
    \ already be available or close to release.\n\nAlthough not open, Plex is very\
    \ popular on Linux because of its extensive functionality, good user interface,\
    \ and suitability as a streaming media server. However, it has shifted too heavily\
    \ in the direction of Netflix and Amazon Prime for many users, while basic features\
    \ have been missing, such as smooth fading in and out of audio tracks.\n\nDeveloped\
    \ from scratch, Dim is built in an existing application. It aims to scan and play\
    \ media from anywhere with minimal setup effort. The project is still at an early\
    \ stage, but Dim promises to offer a free alternative to the proprietary Plex.\
    \ For that reason, I will take a closer look at how to install Dim, where the\
    \ project stands and what its future plans are.\n\n## Installation\n\nYou can\
    \ install Dim, which uses GitHub as its development platform, on your hardware\
    \ and control it via a web interface (Figure 1). You can set it up on a home computer\
    \ or on a server on the web. \n\n![](img/e14c497f4d6e147991bb436d686b6f14_77_0.png)\n\
    \nFigure 1: This view of a library shows the individual media as alphabetically\
    \ ordered tiles. You can't set up a media library because the underpinnings are\
    \ still missing.\n\n## Listing 1: Dependencies\n\n```\n$ sudo apt install libva-libdrm-1\
    \ harfbuzz-bin fontconfig-1 libribidi libtheoma libtheora-bin-libvorbis0 libtheorbis0\n\
    $ sudo dnf install libva libva-vdpq harfbuzz fontconfig libribidi libtheorbis\n\
    ```\n\nAll planned functions can be accessible if desired. Containerization with\
    \ Docker is another way to installing Dim directly. One unique point is that Dim\
    \ is implemented in Rust. The Rust programming language, which has under development\
    \ by Mozilla is now supported by a large community, currently establishing itself\
    \ as a kernel language alongside C. The design brief for Rust is that it has to\
    \ be simple and easy to use while offering better security and faster execution\
    \ speed. Plex, on which Dim tries to emulate, is a Python program. Because there\
