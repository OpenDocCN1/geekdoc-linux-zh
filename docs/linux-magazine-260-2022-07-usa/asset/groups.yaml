    在继续之前，让我们回到图 8 学习更多图表术语。主矩形包含图表显示的所有内容，而你作为背景放入任何内容都是图表区域。三维（3D）图表也会有一个图表区域。你可以为图表区域加载任何想要的图像，包括照片，但通常一开始没必要这样做，而且要非常仔细地选择图表和数据颜色，否则结果往往会更难以阅读。同样的考虑也适用于
    Calc 图表中许多晦涩的选项。与其克制冲动通常会让你的图表变得更好。


    尽管如此，Calc 还有其他重要的函数需要了解的，它们可能会让你的许多图表变得更好。这些函数之一是绝对不要在图表中显示两个具有不同单位或不同比例的数据系列。例如，如果一个系列在
    0 到 1000 之间，而另一个只在 0 到 30 之间，使用一个垂直轴绘制它们将使系列几乎不可见。


