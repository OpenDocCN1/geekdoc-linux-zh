    # Star Labs Unveils a New Small Linux PC


    Star Labs has been known as a manufacturer of Linux laptops for some time; however,
    the company has dipped its toes into the mini PC market and its first release
    is impressive on paper.


    The Byte MK is a first-gen mini PC equipped with an AMD Ryzen 7800 Octa-Core CPU
    up to 4.4GHz clock speed, AMD Radeon graphics, up to 6400MHz RAM, and up to 6TB
    SSD storage.


    Beyond the Byte MK offers, one of the most impressive features is the number of
    ports you find, which includes two full-sized USB 2.0, two full-sized USB 3.0,
    full-sized HDMI, gigabit ethernet, USB-C (for power and expansion), a combo audio/micro
    jack, and a Micro SD slot. Finally, the Byte MK shares with the Core firmware
    and the Star Labs Configurator utility.


    The base price for the Byte MK is $793.00 and includes 8GB of RAM and 240GB of
    SSD storage. The ship date for orders is late June 2022 and you can get a five
    percent discount for pre-orders (while the device is still in production).


    Order your Star Byte MK now (https://url.starlabs.systems/pages/byte).


    # MX Linux Verison 21.1 “Wildflower” Available


    MX Linux is a desktop distribution that shuns system and opts to go with the older
    SysV initialization system. As it has in the past, MX Linux offers with Xfce,
    KDE Plasma, and mx-fluxbox. This distribution eschews for simplicity and 32-bit
    versions for the Xfce and Fluxbox 64-bit versions for all desktops.


    This new release is based on Debian 11.3, which uses the 5.16 Advanced Hardened
    kernel and has plenty of updated applications, the usual bug fixes, and an improved
    installer.


    One pleasant surprise to be found in MX Linux 21.1 is a-carf tool for the simplified
    setup of Samba/CFS.


    Another interesting addition is that the developers have brought back the disk-manager
    utility, which automatically detects new partitions at startup, fully managing
    the configuration of files, and allows you to enable/disable write support for
    NTFS.


    If you''re already running the 21.0 version of MX Linux, you can upgrade to the
    21.1 through the update manager.


    You can download MX Linux Xfce Desktop (https://sourceforge.org/projects/mx-linux/files/Final/Xfce/MX-21.1_x64.iso/download),
    KDE Plasma with (https://sourceforge.org/projects/mx-linux/files/Final/MX-21_M_x64.iso/download),
    or MX-Fluxbox (https://sourceforge.org/projects/mx-linux/files/Final/MX-Fluxbox/MX-21.1_x64.iso/download).


    Read the release notes from the MX Linux blog (https://mxlinux.org/blog/mx-21.1-wildflower-released/).


