    ## IN-DEPTH: DIY Read-Later Tool\n\n## Transform web pages into EP files\n\nInstead\
    \ of relying on a third-party read-later service, you can use this DIY tool to\
    \ save articles from the Internet that meets your specific needs. We all have\
    \ time to read longform work during the day, which is why saving for later becomes\
    \ necessary. Popular services like Pocket and Instaper even allow you to read\
    \ saved content on any device. Still, articles are reformatted for better readability\
    \ or riddled with ads, scripts, and more. This way, you can read saved content\
    \ on practically any device, and choose which ebook reading app you like. Because\
    \ our read-later tool is a simple shell script that relies on Linux, if it is\
    \ necessary, you can run the tool on a Linux machine and save ePub files via a\
    \ dedicated Distribution System (OPDS) or simply share them on the web archive\
    \ and unpack it, or clone the project's repository using the command:\n\n```bash\n\
    git clone https://github.com/dmitry/readiculous\n```\n\nHosted services are costly,\
    \ though. No matter how great the food is, you will eventually get hungry for\
    \ long-cooked meals, not only cooking at home is cheaper and more convenient,\
    \ but you can make any dish you wish and have fun in the process. In a similar\
    \ vein, what works for a ready-made read-later service, when you can cook up any\
    \ work with your own creative tools, or a dash of shell magic? That's exactly\
    \ what we want on the menu: a read-later tool.\n\n## Preparatory Work\n\nBefore\
    \ getting down to work, you need to prepare your environment. The first order\
    \ of business is to install the required software: Pandoc, ImageMagick, and Go-Readability.\
    \ With the exception of Go-Readability, all dependencies are available in most\
    \ Linux software repositories, so you can install them using the default package\
    \ manager. To do this on Debian or an Ubuntu-based distribution, run:\n\n```bash\n\
    sudo install pandoc imagemagick go\n```\n\nInstead of saving and simply dimmed\
    \ versions of web pages, this DIY read-later application is you don't have to\
    \ code the DIY read-later tool from scratch, because we've already done the hard\
    \ work for you and published the materials for free, ridiculous, on GitHub. All\
    \ you need is to download the source code as a ZIP. The source code on GitHub\
    \ includes a binary version of the Go-Readability tool compiled for x86_64 architecture.\
    \ If you plan to use the source on any other platform, or if you want to have\
    \ the latest version of the tool, you will have to compile it yourself. Unfortunately,\
    \ it's a straightforward thing to do. Install the Go language package (use sudo\
    \ apt install golang on Debian, Ubuntu), then to compile the following command-line\
    \ version of Go-Reactivity\n\n```bash\ngo get -u -v github.com/go-shori/readability/cmd/...\n\
    ```\n\ninto the ridiculous directory, and you're done.\n\nOnce the processing\
    \ is finished, you'll find the result in the /gob-directory by your file name.\n\
    \n## How It Works\n\nThe ridiculous, us sh script (Listing 1) starting works by\
    \ fetching the\n\n### Listing 1: ridiculous.bash\n\n```bash\n#!/bin/bash\nif [\
    \ -x \"command -v convert\" ] || [ -x \"command -v pandoc\" ] || [ -x \"command\
    \ -v jq\" ]; then\n    echo \"Make sure that the required tools are installed\"\
    \n    exit 1\nfi\n\n# Usage\nusage() {\ncat <<EOF\n[OPTIONS]\n\ntransforms web\
    \ pages into readable EPUB files.\n\n$0 -u (URL) -d dir -m auto\n\nOPTIONS:\n\
    -u URL\n-d destination directory (optional)\n-m Enable auto (optional)\n\nEXAMPLES:\n\
    $0 -u https://payche.co/guides/how-approach-the-lifelong-project-of-language-learning\
    \ -d dir -m auto\nEOF\n}\n\n# Read the specified parameters\nwhile getopts \"\
    u:d:m:\" opt; do\n    case $opt in\n        u)\n            url=\"$OPTARG\" ;;\n\
    \        d)\n            dir=\"$OPTARG\" ;;\n        m)\n            mode=\"$OPTARG\"\
    \ ;;\n        \\?)\n            usage\n            exit 1 ;;\n    esac\ndone\n\
    shift $((OPTIND - 1))\n\nif [ -z \"$dir\" ]; then\n    dir=\".\"\nfi\n\nmkdir\
    \ -p \"$dir\"\ncd \"$dir\"\n\n# If -m auto is specified\nif [ \"$mode\" = \"auto\"\
    \ ]; then\n    file=\"links.txt\n    if [ ! -f \"$file\" ]; then\n        echo\
    \ \"file not found\"\n        exit 1\n    fi\n    # Read the contents of the links.txt\
    \ line-by-line\n    while read -r url; [ -n \"$url\" ]; do\n        ridiculous\
    \ \"$url\"\n    done < \"$file\"\nelse\n    if [ -z \"$url\" ]; then\n       \
    \ usage\n    fi\n    ridiculous \"$url\"\nfi\n```\n[/content] (Wait, I noticed\
