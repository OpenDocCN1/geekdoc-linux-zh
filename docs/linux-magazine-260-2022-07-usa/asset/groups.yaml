    # 杂志存档


    Linux 杂志是你的 Linux 世界指南。每期杂志都充满了在其他地方找不到的高级文章和教程。探索我们的过期目录以完善你的收藏。


    在线订购：https://bit.ly/Linux-Newsstand


    ## 零信任


    二十年前，人们认为防火墙就足以免受入侵者侵害，但最近的历史告诉了一个不同的故事。今天，最好的建议是：不要信任任何人。你的内部网络可能和互联网一样危险。

    **光盘：** Zorin OS 16.1 和 Super GRUB


    ## 清


    大多数人知道通过更换更高效的灯泡可以节能，但你知道可以使用更高效的软件来节能吗？本月我们研究了为 IT 行业带来可持续性所做的努力。

    **光盘：** Manjaro 21.2 Qonos 和 DragonFly BSD 6.2.1


    ## 加密


    本月，我们研究了 Linux 的加密状态。我们超越基础，探索支撑这一秘密系统的工具和技术——并向你展示如何确保隐私无懈可击。

    **光盘：** Linux Mint 20.3 Cinnamon Edition 和 deeply 20.4


    ## 面部识别


    随着 Microsoft Hello 技术的出现，生物识别得到了增强。现在开源世界正通过一个名为 Howdy 的创新工具追赶。面部认证可能还没有准备好应对
    CIA，但我们将帮助你开始使用 Howdy 并探索通过一眼认证的可能性。

    **光盘：** parrot 21 和 Haiku R1/Beta 3


    ## 打破以构建


    模糊测试：好奇攻击者是如何发现那些导致程序崩溃并交出控制权的“精心设计的字符串”的？来到模糊测试的世界。我们向你介绍某些领先测试技巧。

    **光盘：** Parrot OS 4.11 和 Fedora Workstation


    ## 手机黑客


    制造商最终会停止支持旧硬件。如果你还没准备放弃那些硬件，你可能会通过 LineageOS 找到更好的替代方案——这是一个基于 Android 的免费系统，支持
    300 多种设备，包括许多不再受供应商支持的遗留系统。我们探索了运行在 Android 设备上的社区化 Linux 发行版 PostmarketOS。

    **光盘：** Ubuntu 21.10 和 EndeavourOS 2021.08.27


