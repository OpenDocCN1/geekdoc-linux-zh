    # High Availability vs. Backup


    ## About ECC


    Good NAS will often feature Error Code (ECC) RAM. ECC is capable of correcting
    itself against random errors, which are more frequent than it seems. RAM errors
    are considered dangerous for the survival of server. A bit error in RAM could
    lead to system crash, or cause file to get corrupted. ECC is intended to reduce
    the risk of such an event and keep running.


    ZFS was conceived as a self-healing filesystem, which uses checksum and checks
    data at the time of writing. If ZFS tries to read a data block that has been corrupted
    by let''s say, a hard drive defect, the filesystem would be able to identify the
    issue and repair it on the fly from data.


    The FreeNAS project (now TrueNAS) was used to show that bit memory operation could
    cause permanent damage to the filesystem, and since there are no recovery tools
    available, data could end up destroyed. However, whether ZFS is susceptible to
    other failure methods. Mathews, cofounder of ZFS projects, argue that using ZFS
    with non-ECC RAM is as risky as running a filesystem, although ECC RAM is not
    necessary but highly recommended.


    But repair is just one of the reasons why experts are wary of depending on RAID.
    A search on the Internet confirms the unreliability of RAID for multiple servers.
    Storage media is not perfect and may suffer random failures. Hard drives fail
    most purposes, but only once and then when an Unrecoverable Read Error (URE) occurs
    which takes place when the hard drive starts to access a block of data and fails
    to do so. Even modern systems must survive an URE for every 10TB of data average,
    which is a lot.


    The bigger the disk, the higher the defective sector exists somewhere. The argument
    of RAID 5 is that disks are arrays so that the probability of triggering a URE
    is becoming too high. This is also not managed by the RAID, and it is that at
    least one of information is problematic.


    # RAID Issues


    The problem is that there is only so much file server can protect your data outside
    of an enterprise environment. Quality server is designed to guarantee uptime in
    the face of failure, but not necessarily the integrity of your information. There
    are a number of reasons why a NAS may still fail. If a hard drive fails in a NAS
    set, the array will work at a degraded level. From the user viewpoint, this is
    all point, but it has to effort before. If another drive failure occurs before
    the array is rebuilt, the information in the array will be lost. RAID 5 has failed
    due to over procrastination – the long time to wait for the attention of an overworked
    sys admin.


    Experience suggests that the fear of unable to rebuild arrays is blown out of
    proportion. Nevertheless, is important to remember that RAID 5 is a tool for guaranteeing
    uptime better than the integrity of yours.


    There are RAID levels with better tolerance than RAID 5 such as RAID 6 but using
    these alternatives is comparatively expensive.


    Not bad as this is in the fact that many RAID controllers are proprietary and
    don''t offer a good migration. If you are using a proprietary solution and want
    to move your hard drives from an old to new – maybe the old one is better until
    the last disk fails and your data is unreadable in the destination machine.


    On the other hand, software issues destroy your files just as quickly as a hardware
