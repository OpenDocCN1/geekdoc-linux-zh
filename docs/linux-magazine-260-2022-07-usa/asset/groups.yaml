    # Danielle Foré Has an Update for elementary OS 7


    Elementary founder and CEO Danielle Foré has announced updates for version 6.1
    and adds that the elementary OS team is now preparing for the upcoming 7.0 release.
    Although there is no hard release for 7.0, they''ve announced a codename (Horus)
    and that the team is focusing on a swift release or adding a host of new features
    for the elementary release.


    ![](img/e14c497f4d6e147991bb436d686b6f14_7_0.png)


    from 6.1 to 7.0 will be subtle.


    Some of the features they are planning for 7.0 include automatic app updates and
    power profiles. Additionally, 7.0 will debut the minimalist Music app and the
    migration of some components migrating to GTK4 (which should bring much-improved
    performance and smoother animations).


    One thing 7 won''t make the switch to Wayland. Although they are preparing for
    the shift, elementary OS is ready for the jump.


    Find out more what''s in on the official elementary OS blog (https://blog.elementary.io).


    # Linux New Media Launches Open Source JobHub


    Linux New Media, with FOSSLite and Linux Magazine, is pleased to announce the
    launch of Open Source JobHub (https://japensourcejobhub.com/), a job board to
    help people find their place in the open source community.


    Aimed at developers, engineers, managers, marketers, and Open Source JobHub can
    help you find the perfect job fit. Now, more than ever, the tech industry is exploding,
    and Open Source JobHub will help you navigate the growing number of opportunities.


    > "Open Source JobHub not only covers jobs using open source technologies, but
    also other roles such as sales, marketing, and want to give the global open source
    community dedicated to open source. Our goal is to make career connections," said
    Brian Osborn, CEO and publisher, Linux New Media.


    ![](img/e14c497f4d6e147991bb436d686b6f14_7_1.png)


    # NEWS


    Open Source JobHub features lists from launch partners CloudLinux Collabora, SUSE,
    and TUXEDO Computers. The site will also provide resources to help seekers build
    their careers with open source, and employers can upload lists and reach qualified
    candidates.


    > "At Collabora our focus has always been to promote open source technologies,
    whether that be our engineers who are some of the most motivated and active contributors
    to open source, or our non-technical staff covering multiple departments. Open
    Source JobHub will allow for further promotion of open source by increasing awareness
    within the industry," said Ben Tennyson, Recruiter at Collabora


    Employers can post five free job listings during the launch phase. Follow Open
    Source JobHub on Twitter @OSJobHub (https://twitter.com/OSJobHub).


    # Ubuntu 22.04 Now Available


    For those who prefer Cinnamon desktop but would rather have all the Ubuntu underinnings
    (instead of going with Linux), developer Joshua Petrais has announced the remix:
    Ubuntu Cinnamon now based on Ubuntu 22.04 LTS and includes the Cinnamon 5.2 desktop.


    ![](img/e14c497f4d6e147991bb436d686b6f14_8_0.png)


    Cinnamon 5 brings improvements to the Menu (such as better navigation). The Calendar
    app now shows contacts, tasks, and calendar.


    One of the biggest additions to 22.04 come in the form of automatic updates (which
    are configured in Settings > OS Recovery & Updated) and Pipewire now shipping
    as default audio server.


    Updates to Active Directory (including privilege escalation, remote script execution),
    and performance improvements over the previous release.


    > Of this release, Pop! said, "This has been two years in the market, and I am
    grateful for everyone we helped."


    For more information about the release, check out Pop!s blog post (https://ubuntinnamon.com/ubuntu-cinnamon-remix-22.04-is-jammy-fish-released/)
    and download the ISO to install on either base metal or as a virtual image (https://ubuntu.com/download).


    # Pop!OS 22.04 Has Been Released


    System76 has released the latest version of Pop!OS. This time, the operating system
    is based on Ubuntu 22.04 and includes plenty of improvements. Although the changes
    found in 22.04 aren''t as dramatic as those in release, this new version will
    get people excited.


    Pop! COSMIC desktop is based on GNOME 42 but has been stripped down to the vision
    with its desktop. This means the look and feel of the desktop will remain fairly
    consistent with COSMIC you have experienced first. In fact, although GNOME 42
    migrated away from Gedit and Omni Terminal, Pop!OS is sticking with those two
    apps for the first.


    Two of the biggest additions to Pop!OS 22.04 come in the form of automatic updates
    (which are configured in Settings > OS Recovery & Updated) and Pipewire now shipping
    as default audio server.


