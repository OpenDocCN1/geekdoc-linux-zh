    \n## BlueSpider 4.1\n\nBlueFree only supports a local user database with predefined\
    \ 'permission sets' that may be applied to pages, users, and groups. BlueFree\
    \ features an enhanced search using the official MediaWiki plugin, along with\
    \ support for semantic search.\n\nUsage in Wikipedia. Its design may appear traditional,\
    \ even conservative in the eyes of some users, and MediaWiki differs from others\
    \ such as Confluence. MediaWiki's development is focused on the needs and standards\
    \ of the encyclopedia, not on the needs of administrators or businesses.\n\nApart\
    \ from that, some features are missing in BlueFree, such as the ability to embed\
    \ media in pages, rendering of mathematical formulas using LaTeX, or to directly\
    \ attach files using drag and drop. To highlight your target group, BlueFree also\
    \ comes with limited compliance features. BlueFree does not offer free blog entries,\
    \ making it impossible to use BlueFree as a free blog, and lists are not rated.\
    \ Additionally, all features related to document security and audit trails are\
    \ missing from BlueFree. Accordingly, document configurations, and digital signatures\
    \ using Signature 5 are not available, nor an option to ensure that a certain\
    \ page is the most recent, officially approved version of the document. A full\
    \ list of features is available on the BlueSpider website.\n\nOn the other hand,\
    \ thanks like editors so it is not so surprising that BlueFree's user interface\
    \ in its default is bust by the huge difference between the two versus MediaWiki.\
    \ In contrast, MediaWiki is intended to be a company wiki with an encyclopedic\
    \ tool; it is a fantastic alternative built on MediaWiki.\n\n## Summary\n\nFor\
    \ organizations looking for an opens wiki-like solution, projects such as DWiki,\
    \ Confluence and BlueSpider prove there is an open source alternative to Confluence\
