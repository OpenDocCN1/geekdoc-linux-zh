  mdcn: '


    # MAKESPACE 新技术改造


    当地科学中心的一个电子项目显得有些陈旧了，需要一次翻新：在本文中，是使用 Arduino 代替继电器几乎从零开始进行重构。作者：Scott Sumner


    一个名为“通电游戏”（Buzz-wire）的博物馆展览看起来像两只巨大的手在向你击掌（图 1）。每只手都有一个带环的金属手柄，你的目标是让环在不接触手部的情况下上下移动。为了获得更好的挑战效果，你可以尝试同时在相同或相反方向上进行操作。无论触触碰手，手柄上的蜂鸣器和灯光都会亮起。


    手部的原始电路由互连的继电器组成，用于切换各种组件。该设计没有微控制器或任何比开关更东西，这有几个缺点——但主要的缺点是这个游戏在运行过程中被放弃了，灯光、蜂鸣器和震动电机会一直运行直到取下手。


    ## 物理重建


    在我重建电子设备的同时，我也将外壳送去进行重建。原始设计是用胶板制成的，有很多凹痕和划痕。外壳非常漂亮，但有些地方需要加固。最终，我将每个部分都替换成了 Delrin（赛钢），这是一种非常硬的塑料，比胶板更耐磨损。


    物理重建还整合了更大的震动电机。旧版本使用的是小型寻呼机电机，感觉并不明显。我合作的机械加工制造了带有更大电机的新手柄，使嗡嗡声变得明显得多。


    图 1：通电游戏（重建后）。


    | 表 1：Arduino 连接 |

    | 引脚 | 连接 |

    |---|---|---|

    | 2 | 左手输入 |

    | 3 | 右手输入 |

    | 8 | 继电器 1 控制信号 |

    | 9 | 继电器 2 控制信号 |

    | 10 | 继电器 3 控制信号 |

    | 11 | 继电器 4 控制信号 |

    | GND | 左手（游戏） |

    | GND | 右手（游戏） |

    | GND | 继电器板 |

    | 5V | 继电器板电源 |


    # MAKESPACE 新技术翻新


    由于其中一个组件被烧毁过多次，决定使用升级技术对展览进行改造，以解决它的一些问题。我开始分配 Arduino 引脚。手柄有输入，因此我从这些输出开始，操作不同的继电器，这些继电器会在不同的时间开启和关闭（表
    1）；每只手都有自己的接线排，两个在 11 和 12 上的电源输入是完全相同的。


    ## 新技术


    在设计新控制器时，我从 Arduino Mega 开始，虽然 Arduino Uno 也可以很好工作，但在这种情况下，Mega 是标准配件，易于交易且有货。


    ## 逻辑流


    现在所有硬件已组装完毕，简单的程序显示了继电器的激活，继而控制蜂鸣器的开启关闭以确定程序的流程。最后，为了方便连接到展览，我将所有东西组装在一块胶板上，并带上了所有经常被忽略的东西。我包含了一个流程图来描述逻辑（图
    3）；请参见“流程图”框。


    沿着流程图，第一个决策是当环接触游戏时下方的菱形（向右退出），等待 `250ms`，关闭继电器，并返回原始决策。需要注意的是，如果继电器已经是关闭状态，则不执行关闭操作。如果环接触游戏（从底部退出决策），则打开继电器。下一个决策检查是否


    | 表 2：接线排连接 |

    | 连接 | 左接线排 | 右接线排 |

    |---|---|---|

    | 1 | 手 | 手 |

    | 2 | 手柄 | 手柄 |

    | 3 | 接地 | 接地 |

    | 4 | 接地 | 接地 |

    | 5 | 接地 | 接地 |

    | 6 | 12V | 12V |

    | 7 | 12V | 12V |

    | 8 | 12V | 12V |

    | 9 | 接地 | 接地 |

    | 10 | 5V | 5V |

    | 11 | 接地 | 接地 |

    | 12 | 12V | 5V |


    (1) 可交换的端子。选择一个。

    (2) 可交换的端子。选择。


    图 2：接线图，包含了继电器和接线排连接。


    # MAKESPACE 新技术改造


    为两只手复制该过程，这就是逻辑内部发生的情况。通过这种方式，程序即使对于非编程人员也能理解。在没有连接脉冲时，上拉设置提供了一个稳固的状态。Arduino
    引脚 2-11（第 6-9 行）被设置为 `INPUT()`，此时引脚在关闭状态下为 5V。第 11-14 行的 `digitalWrite` 设置了继电器的初始状态。所有状态都设置为
    `HIGH` 以关闭继电器。大多数继电器是反向工作的；在反向状态下，接地信号将开启它们（通常在 1.2V 以上）。这种设置使它们兼容 3.3V 或 5V 微控制器，因为原因是接地或未接地都可以。


    ## 代码


    Arduino 代码由两部分组成。`setup` 在 Arduino 启动时运行一次，然后 `loop` 无限运行直到被移除。正如名称所示，它们设计用于初始化一切并持续运行。


    ## setup()


    列表 1-17 包含了 Arduino `setup` 函数，这告诉 Arduino 你想做、设置和运行任何特殊函数以及初始化变量（特定代码中的属性）。`pinMode`
    函数（第 3-9 行）设置 Arduino 的输入和输出状态。第一个参数是引脚号，第二个参数是我们使用的参数。`INPUT_PULL` 用于引脚 2 和 3，Arduino
    的电线连接到端子。`PULLUP` 告诉 Arduino 使用内置的上拉电阻。


    上拉电阻是电子等值的数值单元。它通过一个弱电阻连接到 V+。信号电压可以比上拉电阻和地低。电噪声很容易让电路独立运行。在这种情况下，连接将是 setup 部分的最后一行
    `Serial.begin`。


    ## 流程图


    流程图是可视化程序或其他流程的极佳方式。在计算机早期，当程序在纸上编写且你在纸上“编程”时，它们是必不可少的工具。虽然仍然有用，但它们并不是最早的，在线表格才是。注意某些函数会被多次调用，即使任务已经完成。


    '
