    # LINUX 教程 - LIBREOFFICE 图表


    如图 12 所示，它详细地显示了两线，事实上，每条线都有一个适应其范围的独立轴。


    通过选择图表内部的颜色、点击它并选择“设置数据系列”来更改 Calc 分配给每个数据系列的颜色。


    **图 13：LibreOffice Calc 7.2 的一项受欢迎的新是为移动趋势线提供了更多选项。**


    另一个可以大大提高图表清晰度的区域是使用此处来指示三个不同的选项：首先，我们


    要更改所有图表的默认颜色，转到“工具 > 选项 > 图表 > 默认颜色”。在 LibreOffice 图表中你可以做的最有趣的事情是基于条件格式化。这意味着，例如，根据图表中的每个柱形是否符合某些条件赋予其不同的颜色。关于这种技术的一种解释是，“使用条件格式化创建图表”
    [教程 3]。


    | 类型 | 选项 | 趋势线名称 | 移动平均示例 |

