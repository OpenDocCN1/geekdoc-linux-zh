    ## Landscape generator:


    ### TerraForge3D


    Back in the early 1990s, if you were lucky enough to have a Commodore Amiga, then
    you would have encountered a brilliant application called Vista, and later, Vista
    Pro. These weren''t perfect, yet they weren''t productive either. They were de-dimensioned
    spatial portals for the initial and alien landscapes on old hardware. Early versions
    were given away as magazine cover disks, and this was a piece of software that
    could severely test your patience and your Amiga''s computing resources.


    Vista generated landscapes, which took a seed from a fractal, Perlin noise, or
    a real digital elevation map. Vista would draw a three-tree of the land from your
    location. But the clever part was how the view was augmented with grass textures,
    rivers and lakes, and even trees in later versions. These elements all generated
    algorithmically by interpreting the terrain, growing on lower gradients and tumbling
    rocks, placing rivers between the valleys. A cavern scene could look incredibly
    realistic, and one such was used by the great science fiction author, A. Clarke,
    to illustrate what Mars might look like, using Vista and real elevation data.


    An took long to generate each image, it''s surprising that terrain-generation
    appeared to match Vista''s performance. Modern games got quite close to this,
    and yet players have any control over the generated landscape, let us explore
    without being attacked by giant. Why is it so exciting to see the release of TerraForge3D,
    a ambitious cross-platform terrain generator with the same options as Vista? TerraForge3D
    is still at a very early stage of development. But in this phase, it''s beautiful,
    surreal, and hyperrealistic, in real time. The image generation process starts
    with either CPU or GPU-bound displacements. Apart from the sky and global lighting
    settings, everything else is managed in the main window can drag out of positions
