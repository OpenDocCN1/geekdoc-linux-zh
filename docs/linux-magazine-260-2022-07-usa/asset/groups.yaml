    # 搜索模式


    Finder 是 fzf 的一项核心功能。然而，该工具的能力不仅限于编辑搜索模式。它增量地评估模式。每增加一个字符都会精炼搜索。在默认开启的扩展搜索模式中，你还可以输入用空格分隔的额外模式。程序对这些模式中使用的某些特殊字符分配了特殊含义（见表
    1）。你可以像列表 2 所示那样组合搜索模式。


    使用方向键允许你在 Finder 中导航搜索模式。高亮的行显示了选中的内容。或者，还有一些默认的键映射可用。任何选择和取消多行的操作都需要你通过 `-option`
    选项跳转到多个项。在此基础上，Finder 还提供了鼠标控制。使用鼠标轮、点击和双击可以启用和选择。如果你按住 Shift 键，鼠标点击将选择多个项目。双击结束输入。


    否则，程序默认使用适配于 Emacs 的绑定。可以通过 `-bind` 选项设置默认或偏离的键绑定。


    `-command` 选项显示模糊搜索，仅返回精确匹配项。其他重要的 fzf 模式总结在表 3 中。


    你可以通过多个参数定义程序如何确定和匹配。输入行根据表 4 的标准进行评估。可以进行索引处理；如果你没有指定任何内容，fzf 默认使用此选项。fzf 使用这些标准评估输入，并显式地选择它们作为参数。


    # 表 1：面向高级用户的搜索


    | 字符 | 示例 | 结果 |

    | --- | --- | --- |

    | ^ | linux | 包含 linux 的行 |

    | $ | linux | 以 linux 结尾的行 |

    | ! | linux | 不包含 linux 的行 |

    | skt | 模糊搜索的标记（默认） |


    # 表 2：控制


    | 键 | 说明 |

    | --- | --- |

    | Ctrl+K | 向上 |

    | Ctrl+J | 向下 |

    | Ctrl+C | 取消 |

    | Alt+F | 搜索模式中向右跳一步 |

    | Alt+B | 搜索模式中向左跳一步 |

    | Ctrl+A | 跳到搜索模式的末尾 |

    | Tab | 选择多个连续行 |

    | Shift+Tab | 连续取消选择选中的行 |

    | Ctrl+H | 全选或全取消 |


    # 表 3：重要选项


    | 选项 |  |

    | --- | --- |

    | -e/+x | 仅显示精确匹配，禁用模糊搜索 |

    | +-i | 大小写（不）敏感 |

    | --algo=v1/v2 | 选择算法：v1 更快，v2 匹配效果更好（默认） |

    | --disabled | 禁用搜索，仅提供界面 |

    | +/-no-sort | 不对输出进行排序 |

    | --tac | 反转输入顺序 |

    | **用户界面选项** | |

    | -m/- | 启用/禁用多选；默认仅返回一个 |

    | --cycle | 在第一个项目之前/最后一个项目之后继续搜索 |

    | --height=PERCENT | Finder 的高度占终端大小的百分比 |

    | -q QUERY | 使用 QUERY 启动软件 |

    | -1 | 对于单个匹配项不启动 Finder |

    | -0 | 如果无匹配不启动 Finder |

    | --preview COMMAND | 使用 COMMAND 进行输出 |

    | --preview-window | 定义预览的形式、大小和类型 |


    `--tiebreak=CRITERION` 选项。默认情况下，它使用长度或索引。指定反转将让程序按反序评估行。


    一个典型的 fzf 搜索是 `locate` 命令的容错变体。后者通过引用之前创建的数据库中的文件名在本地系统中搜索文件。这种搜索不是模糊的，在出现拼写错误或过度估计时不会返回。在示例中，`locate`
    创建所有条目的列表并通过管道返回给 fzf。如果你传递了 `-l`，它将忽略所有过滤器，你可以在 fzf 的交互模式中输入项。如果你有一个大型数据库，你可能会排除许多匹配项以提高结果的清晰度。你可以通过传递参数来实现。例如，如果你想搜索某些但不。


    # 表 3：修饰符


    | 选项 | 说明 |

    | --- | --- |

    | length | 优先考虑匹配的短行 |

    | begin | 优先考虑行头的匹配 |

    | end | 优先考虑行尾的匹配 |

    | index | 优先考虑输入开头附近的行 |


    # 列表 3：使用 locate 的模糊搜索


    ```

    locate | fzf -q "$*"

    ```


    # 列表 4：排除匹配


    ```

    - excludesnot

    - ...

    - ...Music/The Temptations was a rolling stone.mp3

    - ...Images/png-2-watermark.png

    - ...Music/Fumpy How the Gypsy Was Born.mp3

    - ...Music/S/Prinkle Some People, Follow Me.mp3

    - ...Images/aerial water border.png

    ```


    fzf 支持预览：`--preview` 是生成预览的命令。它显示在用户选择或生成的独立窗口中（如图）。你只能将其用于文本内容，这意味着文件、元数据或提取的文本将作为预览，而不是二进制文件。少即是通用的预览。毕竟，分页器非常适合在投入努力的情况下显示不同类型的文件。


