    ## 试点计划


    Dim 是一个相对新的开源媒体管理器，旨在实现商业 Plex 媒体中心的外观和功能集。


    作者：FERDINAND THOMMES


    Linux 提供了各种媒体播放器，也称为影院软件或媒体管理器。特别令人关注的是那些基于客户端-服务器原理的 Linux 候选软件，用户利用它们来确保外部访问的安全。这类软件中广为人知的代表包括开源项目
    Kodi、Emby、LibreLEC 和 Jellyfin，以及专有的 Plex (1)，它源于 Xbox Media Center (XBMC) 的分支。


    大约一年来，开发人员一直在开发 Dim [2]，这是一种能够尽可能紧密模拟 Plex 外观和功能的开源软件。Dim 最初于 2021 年 4 月首次发布，当前版本为
    0.3.1。当你读到这篇文章时，该版本应该已经发布或接近发布了。


    虽然 Plex 不是开源的，但由于其功能强大、良好的用户界面以及作为流媒体服务器的适用性，它在 Linux 上非常流行。


