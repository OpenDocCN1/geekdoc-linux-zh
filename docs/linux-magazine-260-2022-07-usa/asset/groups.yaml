    # #259/June 2022


    ## Zero Trust

    Twenty Years ago, everyone thought a firewall was all you needed to stay safe
    from intruders, but recent history tells a different story. Today, the best advice
    is: Don''t trust anyone. Your internal network could be just as dangerous as the
    Internet.

    **On the DVD:** Zorin OS 16.1 Core and Super GRUB2 Disk


    ![](img/e14c497f4d6e147991bb436d686b6f14_94_1.png)


    # #258/May 2022


    ## Clean It

    Most people know you can save energy by changing to more efficient light bulbs,
    but did you know you can save energy with more efficient software? This month
    we examine the ongoing efforts to bring sustainability to the IT industry.

    **On the DVD:** Manjaro 21.2 Qonos and DragonFly BSD 6.2.1


    ![](img/e14c497f4d6e147991bb436d686b6f14_94_2.png)


    # #257/April 2022


    ## Encryption

    This month, we study the state of encryption in Linux. We look beyond the basics
    to explore some of the tools and technologies that underpin the system of secrecy
    – and show you what you need to ensure your privacy is airtight.

    **On the DVD:** Linux Mint 20.3 Cinnamon Edition and deepin 20.4


    ![](img/e14c497f4d6e147991bb436d686b6f14_94_3.png)


    # #256/March 2022


    ## Facial Recognition

    Biometrics get a boost recently with the arrival of Microsoft''s Hello technology.
    Now the open source world is catching up with an innovative tool properly called
    Howdy. Facial authentication might not be ready for the CIA yet, but we help you
    get started with Howdy and explore the possibilities of authenticating with a
    glance.

    **On the DVD:** parrot 21 and Haiku R1/Beta 3


    ![](img/e14c497f4d6e147991bb436d686b6f14_94_4.png)


