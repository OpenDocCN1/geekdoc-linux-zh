    # 深度解析


    BlueSpice 4.1


    # 探索 BlueSpice wiki 工具


    # Spices 真的很棒


    使用 BlueSpice 让您的团队保持协作，这是一款专注于专业客户的 wiki。作者：Martin Loschwitz 和 Markus Feitner


    ![](img/e14c497f4d6e147991bb436d686b6f14_47_0.png)


    MediaWiki 是一个开源、高度协作的知识管理工具，运行着世界上最大的网站：维基百科。MediaWiki 等 wiki 解决方案让大型社区能够协作，并提供内置的版本控制以访问信息。MediaWiki
    设计用于服务全球范围内的社区，同时也适用于您需要在本地或组织背景下服务更多多样化用户。


    （关于这些项目的对比，请参见 [22]；BlueSpice 来自 Hallo Welt!）是一个注重易用性和环境的 MediaWiki 分发版。BlueSpice
    4.1 [3] 于 2022 年初发布，提供了大量功能。确定此类 BlueSpice 是否适合贵公司的最佳方法是进行试用。在本文中，我们将展示如何在典型的企业环境中设置
    BlueSpice。


    ## 部署 BlueSpice


    您有两种方法可以让 BlueSpice 运行起来。“经典方法”是在 docker 代理上设置 BlueSpice。要让 BlueSpice 运行，只需解压必要组件的
    BlueSpice docker 目录。当此 Docker 镜像启动时，其内置代理会创建一个包含相关数据的 brew（例如用于配合所需凭据的数据库）。


    几个开源项目支持业务环境的 wiki 工具，包括 XWiki、DokuWiki 和 BlueSpice。


    ## 关于 BlueSpice 的更多信息


    如果您手头没有可用的 LAMP 栈，BlueSpice 还提供了 BlueSpice 4.1 的 docker 镜像，其中包含了所有必要的组件。该 Docker
    镜像来自 Hallo Welt!，镜像资源也是可用的，因此您可以在内部运行该镜像，从而避免在您的硬件上运行黑盒的潜在危险。


    BlueSpice 提供免费版（BlueSpice free）和商业版（BlueSpice pro）。本文的重点是免费版 BlueSpice free，它是
    MediaWiki 之上的一个扩展。MediaWiki 非常简单且功能单一 (1)，但 BlueSpice free 提供了几个额外选项，以及更高级的外观和感受
    (2)。


    ## 硬件


    虽然 BlueSpice 会产生相当大的 CPU 和内存负载，但没有必要为 wiki 提供大量的硬件。部署物理机几乎总是多此一举的。对于拥有数千并发用户的企业实体来说，wiki
    将消耗大量的 CPU 核心或数百 GB 的内存。理想的（且正常的）


    ![](img/e14c497f4d6e147991bb436d686b6f14_47_1.png)


    图 1：具有清理过的未卸载用户界面的 MediaWiki。


    # BlueSpice 4.1


    docker-archive-keyring.gpg


    ```

    https://download.docker.com/linux/ubuntu $(lsb_release -cs)

    stable | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null

    ```


    然后，`apt update` 将更新包管理器已知的软件包列表，最后通过以下命令下载所需的包：


    ```

    sudo apt install docker-ce

    ```


    接下来，运行 `docker ps` 检查 Docker 是否安装并运行。您将看到没有任何输出，因为目前还没有容器在运行，但不应该有错误消息。


    # 准备存储器


    需要创建一个 Docker 卷并将其插入容器，为容器提供类似于虚拟 的持久存储（我们建议在网络层面使用 HA存储，如文件系统或 SAN）。这是必要的，因为如果不使用持久存储设备，BlueSpice
    数据会在容器创建和删除后消失。事实上，这会在您更新 BlueSpice 时发生。


    在这里，本文将使用实例内部名为 `/dev/sdb` 的存储设备，该设备在虚拟实例之间进行复制，并用于 BlueSpice。


    接下来的步骤涉及几个任务：首先，在设备上创建一个包含多个分区的分区表，从而产生 `/dev/sdb`。BlueSpice 数据将使用 XFS，因此将以下命令安装
    `xfsprogs`：


    ```

    apt install xfsprogs

    ```


    然后，需要在该分区上创建文件系统：


    ```

    mkfs.xfs /dev/sdb

    ```


    ![](img/e14c497f4d6e147991bb436d686b6f14_48_0.png)


    这种部署策略是指使用虚拟机（VM）。您可以使用 VMware、Proxmox 或基于 KVM 的虚拟化等标准工具，作为高可用公云（例如 Amazon Web
    Services 等）中的虚拟机。


    然而，您应该考虑一个在基础设施层面进行复制的 BlueSpice 虚拟机。否则，将无法确保服务的高可用性（HA）。


    对于选定的 BlueSpice 设置，一台具有（虚拟）CPU 核心和 16GB 内存的小型机器就足够了。随着内容的增长，内存需求可能会增加。容器越大，Elasticsearch
    的搜索和索引性能越好；您需要的资源也越多。如果您在虚拟机内部运行 BlueSpice，当资源耗尽时，需要更多资源


    # 定义


    在本文中，我们将在最新发布的 Ubuntu Linux 22.04 上设置 BlueSpice。我们将通过在系统中安装 Docker 社区版、配置持久存储卷以及准备
    证书来设置 BlueSpice。


    # 准备 Ubuntu


    本文假设您已安装了 Ubuntu Linux 22.04。作为准备系统的初始步骤，添加 Docker 的 GPG 密钥：


    ```

    curl -fsSL https://download.docker.com/linux/ubuntu | gpg --dearmor -o /etc/share/keyrings/docker-archive-keyring.gpg

    ```


    然后，将所需的存储添加到您的系统：


    ```

    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/share/keyrings/docker-archive-keyring.gpg]
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee
