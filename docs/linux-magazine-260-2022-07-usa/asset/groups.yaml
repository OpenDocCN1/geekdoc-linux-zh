    LibreOffice 7.2 有一个改进的功能，虽然对许多人来说没用，但对统计分析用户来说是必须的。图 13 所示的函数——当你在图表中选择数据系列并点击“插入趋势线”时打开——支持更多类型的移动平均函数（图
    14）。


    **图 14：通过使用图 13 中的选项，图表中已添加了平均趋势线（蓝色）。**


    制作精美图表的最后一个功能（使用图片制作图表）非常容易理解：图表取决于适当的光照和配色，而 Calc 使优化变得简单。一旦创建了图表，双击它并选择带有直观选项页的交互式面板，你可以在其中为参数设置不同的值（图
