    # 本月 DVD


    ## Ubuntu 22.04 和 Fedora 36

    双面 DVD 上的两款极佳发行版！


    ![](img/e14c497f4d6e147991bb436d686b6f14_5_0.png)


    ## Ubuntu 22.04 64位


    Ubuntu 22.04 代号为“水母鱼”（Jellyfish），是最新的长期支持（LTS）版本，其安全和维护更新将一直持续到 2027 年 4 月。按照以往的发布惯例，“水母鱼”版
    Ubuntu 包含了许多新功能和改进。


    许多改进是视觉上的，例如为更短的 dock 栏添加了图标、更改了各种对话框中的图标，并为那些偏好在右下角原子风格图标的用户提供了新主题；而另一些则更具通用性，例如为单击操作添加了圆角，或者提供了极简安装选项——这是一项推迟已久的安全特性。


    对于 LTS 版本来说，不寻常的是 Ubuntu Jellyfish 发布时带有了一些局限性：


    - 新内核在 Wayland 下的性能不佳

    - 默认使用 Wayland，但 NVIDIA 显卡除外

    - GRUB 引导加载器检测不到其他操作系统或发行版。要修复这个问题，如有必要请下载 `os-prober`，并在配置中添加 `GRUB_DISABLE_OS_PROBER=false`
    行并更新 GRUB。


    考虑到五年的使用周期，这些问题很快会被修复。同时，如果这些问题没有影响到你，那么这个最新的 LTS 版本应该能为所有水平的用户提供该发行版的易用性。


    ## Fedora 36 64位


    Fedora 36 曾多次延迟，但在你读到这里时它应该已经发布。它的支持将持续到 2023 年 5 月 17 日。


    Fedora 发行版以创新闻名，但 Fedora 36 是一个相对平庸的发布。一如既常，新版本包含了新的壁纸和主题，其中许多反映了近期流行的深色模式风潮。然而，许多新功能归功于
    Linux 内核以及最新的 Linux 42 发布，Fedora 自身对该版本的贡献在很大程度上被掩盖了，因为增强驱动的支持意味着 Fedora 36 可以被视为一个维护版本，旨在赶上游项目的进度，并继续修改过去几年引入发行版的内容。


    缺陷部分将被替换。

    请发送邮件至 us@linuxmagazine.com。


