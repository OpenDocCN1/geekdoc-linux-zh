    # # Diftastic


    There have been command-line tools for comparing files since there was a command
    line. Most famous is the venerable diff. This will, by compare two files and output
    with annotated < and symbols to show which lines have been removed and added.
    Other text formats, can make it much easier to understand and parse by other tools,
    including patch, which rights differences without context on what might cause
    those differences outside of an editorial. This is where Diftastic helps. It is
    a modern version of the diff command that understands the context of the files
    it is looking at.


    reducing errors and making it easier to use. Diftastic is run from the command
    line and will take the same arguments as diff. Unlike diff, difft can specifically
    parse files written in two programming languages. It can it understand when differences
    are just white space versus structural differences in a programming language.
    It can also understand whether line wrapping is meaningful for whatever. Each
    of these examples cause false positives of the original diff and make it considerably
