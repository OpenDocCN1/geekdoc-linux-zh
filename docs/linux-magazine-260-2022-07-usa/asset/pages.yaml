    # # Zack’s Kernel News


    # ## Taking a Header


    In the Winter of 2020, Ingo Molnar decided that something so simple had to be
    make everyone''s life better. He reached into that ultimate sort of horrible things
    and pulled out the Linux header hierarchy. This oozing nightmare consisted of
    all header files in the kernel source, one depending upon the other in an elastic
    gelatininous web that could neither be untangled nor that all kernel sub-projects
    suffer from, enforcing sticky layers until the fate of humanity truly depends.


    By mid-2021 I got to over 500 commits in this tree and had to throw away second
    attempt (1), the first two approaches didn''t scale, were maintained and barely
    fetched a 4% build speedup, not the churn of 500 patches and not even around.


    With the third attempt I introduced the per_task() which brought the necessity
    to reduce dependencies drastically, and it was a clean-approach that maintained
    agility. But even then I managed to a 10% build speed improvement. Again this
    was not I felt comfortable pushing upstream, and even again,


    Chronicle Brown reports on the latest news, views, dilemmas, and developments
    within the kernel community.


    But the numbers were clear: 20% performance gains were very much possible. So
    I keep this tricky dev, and most of the speedspeeds started early after 1,500
    commits, in the fact that by 2021 I was surprised when it became 20% speedup after
    I returned at the 70th with reference config. There is a clear super-linear improvement
    project of kernel build around once the number of dependencies is reduced to a
    few.


    By Zack Brown


    So I untangled and refactoring generation then became my ultimate patch, oozing
    over 25 trees, with over 2,200 individual commits, making that than half of all
    source files in the entire kernel tree. "As kernel developers know, there’s around
    10,000+ headers in the kernel, and I decided to exclude/ and/ include/headers.
    Over the last 30+ years have turned into a complicated & set of dependencies which
    we are calling ‘Dependency Hell’


    He went, on the ''default'' headers (with the fast-headers which will include
    might type of definitions), have been reduced by 1-2 orders of magnitude. Magnitude
    of this build speed improvement is felt across streams.


    He offered this path to the world, calling it the Fast Kernel Headers project.
    To accept it, it would kernel compile times down as much as fifth of what they
    had been. In incremental compile times—when the files didn''t need to be compiled—were
    even more drastically. The oozing web had become a delicate lace—or at least less
    hell.


    And finally, Ingo said, so this problem is the largest feature announcement in
    LKML''s history! For this this is an RFC announcement, and it changes the structure
    of the tree before pushing back members from upstream merge.


    # Author


    The Linux kernel list copies the core of development dependencies. Traffic volumes
    are uncommon, often reaching 1000 messages in a week, and keeping up with the
    entire scale of development is virtually impossible task for one person. One of
    the few brave souls to take on this is Zack Brown.


    When I started this project, late 2020 I expected to be by 500 members. I found
    a few crew measurements that suggest that about speed could be gained by reducing
    header dependencies, having a substantial runtime effect on the kernel. Substantial
    enough to justify 500 commits.


