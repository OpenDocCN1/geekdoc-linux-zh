  md: '# LINUX VOICE DIM MEDIA MANAGER


    # # A Plex alternative

    # Pilot Program


    Dim, a relatively new open source media manager, looks to implement the appearance
    and feature set of the commercial Plex media center.


    BY FERDINAND THOMMES


    Any media players, also known as theater software or media managers, are available
    for Linux. In particular interest are the candidates that rely on Linux because
    of the client-server principle, which users use to secure access from the outside.
    The better-known representatives of this genre include the open source projects
    Kodi, Emby, LibreLEC, and Jellyfin, and the proprietary Plex (1), which originated
    as a fork of the Xbox Media Center''s (XBMC).


    For about a year, developers have been working on Dim [2], open source software
    that emulates Plex''s appearance and functionality as closely as possible. First
    released in April 2021, the current version is 0.3.1. By the time you read this
    article, version should already be available or close to release.


    Although not open, Plex is very popular on Linux because of its extensive functionality,
    good user interface, and suitability as a streaming media server. However, it
    has shifted too heavily in the direction of Netflix and Amazon Prime for many
    users, while basic features have been missing, such as smooth fading in and out
    of audio tracks.


    Developed from scratch, Dim is built in an existing application. It aims to scan
    and play media from anywhere with minimal setup effort. The project is still at
    an early stage, but Dim promises to offer a free alternative to the proprietary
    Plex. For that reason, I will take a closer look at how to install Dim, where
    the project stands and what its future plans are.


