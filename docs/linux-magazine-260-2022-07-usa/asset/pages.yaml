    # Manage Internet uploads with Portmaster


    # Full Control


    Security and anonymization play an increasingly important role on the Internet
    due to the endless appetite of Internet companies for personal data. Portmaster
    and the Safing Privacy Network will help protect your privacy – even if you''re
    not a security expert.


    By Erik Bäroldt


    intensified data gathering is making life difficult for users on the Internet.
    It''s not the usual suspects like Google or Facebook who are collecting data.
    Conventional software packages have increasingly started home and sending "telemetry
    data" to their vendors and third parties.


    Users typically don''t notice this data transfer or track who data is sent to.
    To stop this habit


    # Idea


    Portmaster combines several privacy-related services in a single package. Included
    within the Portmaster application is


    firewall


    Perhaps the most interesting part of Portmaster is the developers have encapsulated
    all that functionality into a single interface that you don''t have to be an expert
    to understand and manage. The intuitive Portmaster interface makes it easy to
    monitor settings, filters to automatically block trackers and adware, and configure
    different filters for different applications. Portmaster is free software on GitHub
    [2] and provided under the AGPL General Public License (AGPL).


    # How It Works


    Under the hood, what is known as a Portmaster Core service sits between the kernel
    and the user interface on one and the kernel and the Internet on the other (Figure
    1). This core service consists of several components, the most important of which
    are the SPN, the filters, and the DNS service.


    The secure DNS service uses the DNS-over-TLS (DoT) protocol, which sends queries
    over an encrypted TLS connection. This encryption stops unauthorized third parties
    from viewing the DNS queries. The filters, which act much like a firewall, also
    use filter lists. The system references the filter lists to block undesirable
    connections.


    The manufacturer continually updates the filter lists of sites with malware, tracking,
    phishing, or other nefarious activities. The lists are maintained on a GitHub
    page (Figure 2). You can also add your own defining sites you wish to filter.


    The SPN is an ambitious project that is still in its early stages of development.
    The company''s long term plan is to continue giving Portmaster away for free,
    but to sell access, when the company says will obfuscate IP addresses [3] and
    prevent third parties from viewing your data. Routing data takes packets through
    multiple servers on the Internet in an app that is similar to


