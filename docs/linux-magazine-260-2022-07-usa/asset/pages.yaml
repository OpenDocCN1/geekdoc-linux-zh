  md: '# # IN-DEPTH

    # Shell Download Manager


    After capturing the clipboard, the script checks whether the URL was also filled
    with the clipboard contents. If the URL has a length of zero, the program cancels
    the operation.

    Linking first check whether any download links have been captured on


    the page and when they can be output. If there are no files to download, the script
    also terminates at this point.


    Finally, a loop processes all the downloads, checking their sizes and comparing
    them against the free space. If the size of the download exceeds the free disk
    space, the script terminates.


    Because you will need to copy the URL of the listed download from the browser''s
    address bar for the script to start automatically, this script works with all
    browsers. The script retrieves the URL from the clipboard, evaluates the page
    for files that can be downloaded, and then sorts them by size. You can then choose
    which of them you want to download.


    # ### Listing 11: Main function


    ```

    01 url=$(xclip -o 2>/dev/null)

    02

    03 if [ -z $url ]; then

    04 warn "NO URL present."

    05 warn "Use [Ctrl]-[[c] to copy the URL from the browser to the clipboard."

    06 exit

    07 fi

    08

    09 capture

    10

    11 if [ \${#download_links[@]}} -gt 0 ]; then

    12 menu

    13 read -p "Select files (Example: 1,2,3-8,10): " selection

    14 else

    15 warn "NO DOWNLOADS PRESENT" && exit 1

    16 fi

    17

    18 declare -i total_size_downloads=0

    19

    20 for selection in \${(splitter \$selection)}; do

    21 total_size_downloads+=\${indexed_indexes[((select - 1))]}

    22 current_download=\${indexed_downloads[((indexed_indexes[((select - 1))])]}

    23 if [ \$(free) -lt \$total_size_downloads ]; then

    24 warn "Not enough free disc space."

    25 exit

    26 else

    27 download \$current_download

    28 fi

    30 done

    ```


    # ### Conclusions


    Generally speaking, this custom download manager offers a simple approach for
    downloading files off the web. You just need to copy the download page''s URL
    to the clipboard and then select the desired files in the shell.

    Because I designed the scripts to use a very structured approach, the functions
    included here mostly work on their own, they can also be used in other programs.
    The script for this article (download_optimized2.bash) along with cutter are available
    for download at [1]. ■


