    as you think it. By Rubén Llorente


    There is a point in the life of a compulsive data holder a regular computer is
    not enough to contain a burgeoning file collection. Upon the relentless expansion
    of a massive data collection, the first step step to extend the storage capacity
    is to purchase an USB hard drive. The hard drive will buy time, but eventually
    this solution will fail short. A data holder who is deocated


    eventually have to invest in a Network Attached Storage (NAS) server. A NAS is
    a dedicated server optimized to store large amounts of information. NAS servers
    are commonly available as commercial appliances, but many power users prefer to
    build their own from parts. Serious NAS servers are stable and allowed to increase
    their capacity by adding hard drives. Better yet, they often offer features that


    their and skipping the step of making backups. But rarely these consumer-grade
    storage systems provide a complete solution. This article describes some of the
