    Figure 1: fzf --preview "" is used to display a preview via the page header, however
    this is intended for text.


    You need to specify --preview "..." as the command. This allows it to show the
    contents of files, for example, but also to extract content or the metadata of
    multiple files.


    You can define the window position and size using --window-POSITION. The following
    arguments are for this position: (top, bottom, left, right), the size (as a percentage
    of the terminal width), and the mode (arc, clip, e, hidden). You need to enter
    this information in a comma-separated format.


    In addition to preview, there is another way to generate a view of the content
    actions. Actions mean a group of functions that you can enable in the interactive
    interface. You can also trigger actions through events. The only event that currently
    has actions is backward-search if the search query finds something and you still
    try to decode it using the backspace. The change event is often used with first
    (jump to first), hit is the default for backward-search.


    # Key Bindings


    One of fzf''s special features is the ability to bind other programs within the
    running program. This feature, which is controlled by the execute action, offers
    a wide range of possibilities. For example, you can select files to view or edit
    them. Fzf expects a command-line argument for the execute action. It then executes
    the command in a shell. The [] string stands for the selected files.


    The --bind option is used to bind actions to a key or shortcut. You can use more
    than one action for a key. This is demonstrated by an example from the main page
    (Listing 7). The


    Creating your own definitions makes it possible to easily adapt fzf works to match
    other programs or add new functions. Using --bind arguments, use single or double
    quotes if there are any spaces.


    The current version of fzf supports only a subset of bindings (see Table 5). Other
    combinations, such as Shift+Enter, which outputs a warning such as un-Supported
    key shortcut, but the software does not support mouse clicks in the arrow up,
    down arrow, and double arrows. Many actions simply delete characters or jump to
    positions in


    # Listing 5: Match Preview


    ```

    $ fzf --preview "PREVIEWCOMMAND"

    ```


    # Listing 6: Preview Position


    ```

    $ fzf --preview-window=top:50%%wrap:cycle


    fzf --bind "ctrl-a:select-all+enter" --bind "ctrl-z:select-all+enter"

    ```


    # Listing 7: Defining Key Bindings


    ```

    fzf --bind "ctrl-a:select-all+enter"

    fzf --bind "ctrl-a:select-all+enter" --bind "ctrl-z:select-all+enter"


    :fzf --bind "ctrl-a:select-all+enter"

    ```


