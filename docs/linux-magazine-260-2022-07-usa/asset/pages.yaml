    # Preparing Your Storage


    A Docker volume needs to be created and inserted into the container to provide
    the container with persistent storage as in the VM (we recommend HA storage at
    network level like filesystems, or SAN). This is necessary because using a persistent
    storage device, BlueSpice data would disappear after the BlueSpice container is
    created and deleted. In fact, this will happen when you update BlueSpice.


    Here, this article will use a storage device named `/dev/sdb` within the instance,
