    # Electrical Noise


    One of the things I discovered when working the exhibit was that the provided
    handle caused more noise than expected. The Arduino was sensitive enough to pick
    up this noise as pulses whereas the original design did not. My new design change
    had to be adding a filter capacitor to each motor.


    # The Shorter Timeout


