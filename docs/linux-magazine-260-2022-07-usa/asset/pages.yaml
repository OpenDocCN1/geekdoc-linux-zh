  md: '# High Availability vs. Backup


    # Popular RAID Levels


    RAIDs are built in multiple ways, depending on the purpose they serve. The most
    popular traditional RAID levels are:


    +   - RAID 0 stripes all the drives in the set for increased performance (Figure
    2). The total size of the RAID is the sum of the sizes of every individual drive.
    A disk failure kills it, making it a dangerous level to use. RAID 0 has no better
    read and write throughput than a single hard drive of the same size as, because
    the work is distributed over the individual drives in the array.

    - RAID 1 mirrors all the drives in the array (Figure 3). Since every drive has
    a full copy of all the data, RAID 1 can keep functioning as long as one of its
    drives is still operational. RAID 1 is good for keeping a proper uptime, but it
    is not cost effective, at the very least, it takes as many drives as for the same
    storage capacity.

    - RAID 5 is the most popular in itself. This form of RAID is known as striping
    with parity. The disks are striped (with RAID 0), but an additional drive stores
    parity to keep functioning if one of drives fails (Figure 4). RAID 6 does pretty
    much the same thing, but it can keep functioning after two drive failures.

    - RAID 10 is a combination of RAID 0 and RAID 1. Drives are striped in pairs which
    each mirrors the other. Then the pairs are striped in a RAID (Figure 5). RAID
    10 can keep functioning as long as at least one drive in each pair is working.


