  md: '# LINUX VOICE FZF/FZY


    # Use fzf and fzy to add fuzzy search tools to the shell


    # Near Miss


    # Fuzzy finders retrieve useful results from data streams if there are no exact
    matches. BY KARSTEN GÜNTER


    fzf

    Fzf stands for Fuzzy Finder. The tool acts as a general-purpose filter, which
    also acts as a menu generator in interactive mode. Calling fzf launches the tool
    which normally displays all the files in the current directory. You can command
    to which is the default if the program is not given via the standard input. This
    feature helps to keep the commands short.


    Today, fuzzy searches are an integral part of IT life. They correct typos, offer
    a way to find what you need with reasonable overhead, even in unstructured data.
    The basic principle is based on the Levenshtein distance [1], defined in the 1960s
    (the "Levenshtein box"). Developers have then optimized this more or less from
    the start


    Having said, many standard tools use fuzzy searches or limits to highly simplify
    variants up this day. For example, the grep tool from the collectif processes
    binary regular expressions (patterns), but it does not support fuzzy searching.
    Fuzzy searching is supported by agrep [2] and ugrep [3] at the command line, and
    there are several other, less-known tools. With a best-match option


    Fzf [4] and fzy [5] enrich the shell construction kit, adding two powerful tools.
    As they are interactive, if, by default, they return their data from the standard
    input and return the results to the standard output. Interactive in this context
    means that they provides interfaces for entering the search patterns, which allows
    the search patterns to be adapted and refined at runtime.


    # Levenshtein


    The Levenshtein distance describes the minimum number of changes (delete, insert)
    to transform one string into another. The weighted methods of these actions determine
    how well the two strings are. Weighting means that, for example, two swapped letters
    (like in a typo) are less important than, inserting characters. The approach also
    involves more problems. Weighting depends on the concrete task (spell check, search,
    etc.) and the language.


    Fzy is already a use tool on many systems. According to its development, the enhanced
    fzy offers an improved algorithm and a faster speed. In interaction, fzy joins
    itself to the base of options, and this simplifies the options. At first glance,
    fzy really only looks like the output is deceptive. Although, fzy can be as capable
    as fzf''s tool. It is also pasted, there is also a simpler Finder, which gives
    a kind of more viewable prompt. This although becomes particularly clear if you
    look at fzy''s outputs. By default, it uses only 10 lines of the terminal to display
    the list of results. This can be changed with the -l option. Fzy can only work
    with patterns. It does not support regular. In interactive mode, a handful of
    keyboard shortcuts are available. They are listed by the tool''s fancy concise
    manner.


