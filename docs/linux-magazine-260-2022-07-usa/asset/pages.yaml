    Securing Thunderbolt


    # Locking down the Thunderbolt interface


    # # Lightning Protection


    The Thunderbolt interface supports extremely fast data transfer rates, but be
    careful about what you plug into your port, because Thunderbolt devices access
    memory directly. We''ll show you some Linux Linux tools for locking down your
    Thunderbolt interface. By Thorsten Scherf


    The Thunderbolt interface is an interface used for connecting peripheral devices
    to many computers. (with the familiar arrow symbol - see Figure 1) support fast
    transfer of audio, video, and other data over a single cable and can also connect
    through the same interface.

    The Thunderbolt specification was developed by Intel in collaboration with Apple.
    Many users might think of Thunderbolt in the context of Apple hardware, Apple
    directly shipping MacBook Pro models with the interface in 2011 (see the box entitled
    "Thunderbolt Through the Years.\ Thunderbolt has become a common feature on MacBook
    computers, as well as many other Intel-based systems.

    Over the years, the power and speed of Thunderbolt has led to some security issues.
    Like other technologies that communicate with a system via PCI Express (PCIe),
    Firewire, or similar protocols, Thunderbolt supports direct access to system memory.
    Directly accessing memory enables fast data transfer, but it also poses a security
    risk, because many different


    access memory at the same time, which creates the potential for a DMA attack (DMA
    unauthorized access to the system memory in order to read directly data).

    Security concerns have led to a new approach with recent versions. Some of the
    basic security features


    available in Thunderbolt 3 have been enhanced for version 4. Thunderbolt now uses
    the Intel Virtualization Technology for Direct I/O (VT-d) to provide protection
    against DMA attacks.

    The Linux kernel supports Thunderbolt out of the box, but to use Thunderbolt''s
    security features, you need to


