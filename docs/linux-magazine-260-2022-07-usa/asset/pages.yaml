  md: '# # High Availability vs. Backup


    # ## About ECC


    Good NAS will often feature Error Correction Code (ECC) RAM. ECC RAM is capable
    of correcting itself for consistency against random errors in memory, which are
    more frequent than it seems [1]. RAM errors are considered dangerous for the survival
    of a server. A bit error in RAM could lead to a system crash, or cause a file
    to get corrupted. ECC is intended to reduce the risk of such an event and keep
    running after a memory error.


    A bit error in RAM could cause a chain reaction, resulting in massive data corruption
    within a ZFS filesystem. It is the only way of saving a ZFS server is with ECC
    RAM, and doing other wisely is impossible.

    ZFS uses no pre-mount checksum and checks filesystem and repair tools at the time
    of writing. ZFS was conceived as a self-healing


    filesystem, capable of repairing data corruption on the go. If ZFS tries to read
    a data block that has been corrupted by let''s say, a hard drive defect, the filesystem
    would be able to identify the issue and repair it on the fly from data. Self-healing
    features do it, in order to ensure the necessary tools are for recovery.


    The FreeNAS project (now TrueNAS) was used to show that bit memory operation could
    cause permanent damage to the filesystem, and since there are no recovery tools
    available, data could end up destroyed.

    However, whether ZFS is susceptible to other failure methods. Mathews, cofounder
    of ZFS projects, argue that using ZFS with non-ECC RAM is as risky as running
    a risky filesystem [3], although ECC RAM is not necessary but highly recommended.


    But ready repair is just one of the reasons why experts are wary of depending
    on RAID. A search on the Internet confirms the unreliability of RAID for multiple
    servers [5]. Storage media is not perfect and may suffer random read failures.
    Hard drives fail most purposes [6], but only once and then when an Unrecoverable
    Read Error (URE) occurs which take place when the hard drive starts to access
    a block of data and fails to do so. Even modern systems must survive an ure for
    every 10TB bits of data average, which is a lot.


    The bigger the disk, the higher the defective sector exists somewhere. The argument
    of RAID 5 is that disks are arrays so that the probability of triggering a URE
    is becoming too high. This is also not managed by the RAID, and it is that at
    least one of information is problematic.


    If RAID 5 fails to drive a hardware failure, a new drive can be plugged in, and
    the RAID 5 may be rebuilt from the data existing in the remaining disks. After
