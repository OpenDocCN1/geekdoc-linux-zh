    There are two ways to execute commands. If you use the execute action, fz executes
    the command line, waits until the end of the command, and then displays its output.
    In many cases, this is precisely the desired behavior. To prevent fz from waiting
    and thus not capturing further input while doing so - you can append an argument
    to run the commands in background. If you don''t need the output of the executed
    commands, use the execute-silent action. The program will run the commands but
    discard the output.


