  md: '# Routing in Tor


    The Tor network is a collection of servers running software that allows them to
    participate in onion routing. Onion routing has existed longer than the Tor network
    and is a more general term – the Tor has a particular set of protocols based on
    onion routing.


    The de-centralized system (called the onion) routes messages through a series
    of Tor relays (see Figure 2). The message is encrypted in layers, so that each
    relay along the circuit knows who sent the message and where to forward it. The
    next relay decrypts the message. The circuit knows the final destination of the
    packet but knows not the source or the destination.


    As you can see from Figure 2, the key to making this process work is that each
    node along the path knows only what it needs and nothing more. The Tor client
    builds this message in layers (Figure 3), which are peeled off one step at a time
    by the layers of an onion (hence the onion routing).


    To build this multi-layered message (called the onion), the Tor client must obtain
    a symmetric session key from each of the nodes along the circuit. These keys are
    obtained through a series of public key (Diffie-Hellman) connections among the
    nodes that forward the encrypted session keys back to the client.


    The client encrypts the message it intends to send to the destination using the
    session key for Node 3. This encrypted message is encrypted with the session key
    for Node 2, and this is encrypted with the session key for Node 1. When Node 1
    receives the message, it knows the sender, but it doesn''t know if the sender
    is the originator or just another link in the circuit. Node 1 knows the session
    key and learns it is supposed to send the message to Node 2. Node 2, decrypts
    the message to Node 3. Node 3 decrypts the final layer and learns that it must
    send the message to the destination. Node 3 does not know who originated the message,
    but it knows it received the message from Node 2 and remembers that fact, so it
    will know how to forward the reply back from the server.


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_0.png)


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_1.png)


    ![](img/e14c497f4d6e147991bb436d686b6f14_20_2.png)'
