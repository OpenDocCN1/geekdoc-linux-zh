    Table 6: Actions


    | Action | Explanation |

    | --- | --- |

    | accept | Apply the current entry |

    | accept-nonempty | If an entry is selected, apply it |

    | change-prompt | Change the Finder prompt |

    | clear-selection | Deselect the previously selected entry |

    | preview | Display preview |

    | refresh-preview | Refresh preview |

    | select-all | Select all |

    | deselect-all | Deselect all |

    | toggle-all | Toggle all matches |

    | toggle-search | Find toggles |

    | toggle-preview | Show (hide) preview window |

    | toggle-sort | Toggle sorting |

    | disable-search | Disable search |

    | reload | Reload and rebuild index |

    | replace-query | Replace search with current selection |

    | unbind | Use --bind to clear the keyboard binding |


