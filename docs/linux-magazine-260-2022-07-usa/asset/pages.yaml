    # # Boot Drive Tools Tools


    A bootable CD won''t take you far in world where most new computers don''t even
    have a CD drive. Live boot now means booting from a USB stick, and while users
    have gotten more mobile, the tools have gotten more sophisticated. Carry your
    OS with you and plug it in – you can even put multiple ISOs on a single stick.
    Next month we explore a new generation of utilities for USB boot.


