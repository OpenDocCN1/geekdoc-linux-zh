  \ on blocks: 32768,98304,163840,229376,294912,819200,884736,1605632,2654208\n```\n\
  \n\n\n\n```bash\ntune2fs -L root /dev/sdb1 tune2fs -L home /dev/sdb6\n```\n\n现在我们可以使用\
  \ `mount` 命令挂载新分区。输入 `df` 来查看结果。\n\n![](img/Image00063.gif)\n\n最后一步，让我们在配置文件 `/etc/fstab`\
  \ 中添加条目，以便在启动时自动挂载这些文件系统。首先将 `/etc/fstab` 复制为 `/etc/fstab.bak`：\n\n```bash\ncp /etc/fstab\
  \ /etc/fstab.bak\n```\n\n然后，为了获取新分区的块 ID，输入 `lsblk -f`。`-f` 选项（`--fs` 的写）会在输出中扩展额外的文件系统信息。\n\
  \n![](img/Image00064.gif)\n\n现在编辑配置文件 `/etc/fstab`，并按如下所示添加最后两行。\n\n```text\ncat\
