  \     /var      ext4      defaults      0 2\nswap 安装期间位于 /dev/sda2\nUUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf\
  \     none     swap      sw      0 0\n/dev/sr0  /media/cdrom0  udf,iso9660 user,noauto\
  \ 0 0\nUUID=8e70eeac-83cb-43f1-a402-a10fdecab950 /mnt/root ext2 default 0 2\nUUID=e7ab67d6-53a6-4c1a-9ee2-5f36d18bef5\
  \ /mnt/home ext4 default 0 2\n```\n\n然后使用 `reboot` 重启系统以使用新分区，并调用 `df` 查看新创建的分区。\n\
  \n![](img/Image00065.gif)\n\n![](http://www.amazon.com/gp/customer-reviews/write-a-review.html?asin=B07HDTG58D)\n\
  \n# 13. 使用链接\n\n链接并不是 Linux 特有的，但如果你来自基于 Windows 的系统，那么它的概念略有不同。当你需要一个文件同时存在于多个地方时，链接非常有用。例如，在你的下载文件夹和音乐文件夹中都拥有同一个文件，而无需创建一个占用空间的副本。\n\
  \n如果你在不同位置保留了同一组照片或视频的大型存档（许多摄影师和录像师倾向于这样做），使用链接可能会为你节省数 GB 的空间。Linux 文件系统中了两类型的链接：硬链接和软链接。我们将在接下来详细解释这两种两种链接。\n\
  \n## 13.1 硬链接\n\n硬链接在组织文件时提供了更大的灵活性。例如，你可以在一个地方按艺术家组织音乐，在另一个地方按流派组织音乐，而系统中不会产生多于一个物理副本。\n\
  \n硬链接将文件名链接到磁盘上存储文件的位置（对 `inode` 的引用）。它仅仅是现有文件的一个额外名称。每个文件可以有多个硬链接，但必须至少有一个。如果不存在指向该文件的链接，则文件将被删除，磁盘空间将释放给其他文件。然而，只要数据没有被覆盖，文件中的数据仍然存在并可以恢复。\n\
  \n系统上的每个文件名都是硬链接。硬链接不能指向目录、软链接、字符设备或块设备、管道或套接字。如果有多个硬链接指向文件，它们必须位于同一个文件系统中。要创建链接，Linux\
  \ 使用两个命令：`link` 和 `ln`。`link` 命令专门用于硬链接。它调用 `link()` 函数并且在尝试创建链接时不进行错误检查。相比之下，`ln`\
  \ 具有错误检查功能并且可以创建硬链接和软链接。\n\n下面的命令为文件 `test` 创建了三个名为 `link1`、`link2` 和 `link3` 的硬链接。`touch`\
  \ 命令用于更新文件的访问日期或修改日期，有两种工作方式：如果文件已存在，则将访问和修改的时间戳设置为当前时间戳。如果文件不存在，将创建一个具有当前时间戳的空文件。\n\
  \n```bash\ntouch test\nln test link1\nln test link2\nln test link3\n```\n\n`ls -i`\
  \ 的输出显示了两列：inode 号和文件名（`-i` 是 `-inode` 的缩写）。你可以看到四个文件 `link1`、`link2`、`link3` 和\
  \ `test` 的 inode 号是相同的，它们指向同一个 inode。\n\n```bash\nls -i test link126930 link226930\
  \ link326930\n```\n\n此外，`stat` 命令提供了关于该条目的更详细信息。\n\n```bash\ntouch test\nln test\
  \ link1\nln test link2\nln test link3\nstat test\n    File: test\n    Size: 0\n\
  \    Blocks: 0\n    IO Block: 4\n    Device: 808h/256d\n    Inode: 26930\n    Links:\
  \ 4\n    Access: (644/-rw-r--)\n    Uid: (1000/user)\n    Gid: (1000/user)\n   \
  \ Access: 2020-09-19 16:51:10.039125119\n    Modify: 2020-09-19 16:51:10.039125119\n\
  \    Change: 2020-09-19 16:51:10.039125119\n    Birth: -\n```\n\n## 13.2 软链接\n\n\
  软链接，也称为符号链接，是文件系统中指向另一个文件名的链接。它非常像 Windows 系统上的快捷方式。与硬链接不同，软链接不包含目标文件的数据，它只是指向文件系统某处的另一个条目。这种差异使得软链接具有硬链接不具备的特性，例如链接到目录、字符设备、块设备或通过\
  \ NFS 网络的远程计算机的文件。\n\n要在 Linux 中创建软链接，我们将使用带有 `-s` 选项的相同 `ln` 命令。`-s` 是 `--symbolic`\
  \ 的缩写。\n\n```bash\ntouch test\nln -s test link1\nln -s test link2\nln -s test link3\n\
  ```\n\n再次，`ls -i` 的输出了两列：inode 号和文件名。你会发现四个文件的 inode 号不同的，`link1`、`link2`、`link3`\
  \ 和 `test` 指向不同的 inode。\n\n```bash\nls -i test softlink260931 link1260932 link2260933\n\
  ```\n\n如果你带有 `-l` 选项（长格式）调用 `ls` 命令，输出所示。最左侧列以 `l`（表示 link）开头，最右侧列显示软链接指向的文件名。\n\
  \n```bash\nls -l softlink\nlrwxrwxrwx 1 user user 4 Sep 15 14:05 link1 -> test\n\
  lrwxrwxrwx 1 user user 4 Sep 15 14:05 link2 -> test\nlrwxrwxrwx 1 user user 4 Sep\
  \ 15 14:05 link3 -> test\n```## 13.3 示例\n\n在这个示例中，我们将观察如何使用硬链接连接两个文件，以及再次取消它们。首先，我们使用\
  \ `echo` 创建名为 `file1` 的文件并重定向输出。`echo` 是 Shell 内命令，用于输出文本。该命令还会打印变量的值。\n\n```bash\n\
  echo \"This is File One\" > file1\ncat file1\nThis is File One\n```\n\n接下来，将 `file2`\
  \ 链接到 `file1`，并将 `file2` 的内容输出到 `stdout`。\n\n```bash\nlink file1 file2\ncat file2\n\
  This is File One\n```\n\n现在它们都是同一个文件。让我们修改 `file2` 看看发生了什么。\n\n```bash\necho \"\
  This is line Two\" >> file2\ncat file2\nThis is File One\nThis is line Two\ncat\
  \ file1\nThis is File One\nThis is line Two\n```\n\n从下例中可以看出，`file1` 和 `file2` 都被视为同一个文件。\n\
  \n```bash\nls -l\ntotal 0\necho \"This is File One\" > file1\ncat file1\nThis is\
  \ File One\nlink file1 file2\ncat file2\nThis is File One\necho \"This is line Two\"\
  \ >> file2\ncat file2\nThis is File One\nThis is line Two\ncat file1\nThis is File\
  \ One\nThis is line Two\n```\n\n取消链接 `file1` 会删除指向 `file1` 的硬链接，但 `file2` 仍然存在，文件不会被删除。\n\
  \n```bash\nunlink file1\nls file2\n```\n\n\n\n\n取消链接 `file2` 会删除硬链接并同时删除该文件，因为没有剩余指向该文件的硬链接了。该文件不再存在，其在硬盘上占用的空间被标记为可覆盖。\n\
  \n```bash\n$ unlink file1$ lsfile2$ cat file2This is File OneThis is line Two$ unlink\
  \ file2$ ls$ ls -altotal 8drwxr-xr-x  2 jk jk 4096 Sep 18 08:22 .drwxr-xr-x 23 jk\
  \ jk 4096 Sep 18 08:15 ..\n```\n\n# 14. 软件包管理\n\n在当今世界，软件可能非常复杂。这种复杂性部分源于程序被拆分为单个组件并以单个软件包的形式提供，例如二进制数据、共享库和文档。这种软件开发的概念被称为模块化，并被广泛接受和使用。例如，Debian\
  \ 提供了超过 50,000 个不同的软件包。\n\n软件包管理涵盖了处理这些软件包所需的所有操作，包括安装、配置、移除和更新软件包。它还涵盖了解决依赖关系（相互依赖的软件包）。\n\
  \n## 14.1 理解软件包架构\n\n为了解释 Linux 软件包架构，我们将以 Debian 为例。Debian 发行版以其稳定性和卓越的软件包系统而闻名。以下描述适用于所有自\
  \ Debian 的 Linux 发行版，例如 Ubuntu、Linux Mint、Knoppix、Kali Linux、Grml 和 Xandros。请注意，软件包的名称可能不同，特定发行版的软件包镜像以及软件包分类名称也是如此。\n\
  \nDebian 软件包管理生态系统包含许多不同的组件，如软件包列表、软件包源、软件包镜像、不同的软件包、管理软件包设置的软件以及软件包缓存。下文将对这些组件进行更详细介绍。\n\
  \n### 软件包列表\n\nDebian 包含一个可用软件包的列表。该列表在 `/etc/apt/sources` 文件中引用，以及 `/etc/apt/sources.list.d`\
  \ 目录下的特定组件和个人新增。例如，即时通讯软件 Skype 使用 `skype-stable.list` 文件。列表使用文本格式，每行一个软件包源：\n\n\
  ```\n| deb http://ftp.de.debian.org/debian/ stretch main contrib non-freedeb-src\
  \ http://ftp.de.debian.org/debian/ stretch main contrib non-free |\n```\n\n每行要么引用二进制软件包类型（`deb`），要么引用源软件包类型（`deb-src`）。软件包类型之后是软件包源，它指向提供软件包的仓库。接下来，该行包含\
  \ Debian 版本的名称，可以指定为版本的昵称或分支。\n\n昵称源于电影《玩具总动员》中的一个角色。分支指的是版本的开发阶段，可以是 `oldoldstable`（上上版本）、`oldstable`（上一个版本）、`stable`（当前版本）、`testing`（下一个版本）、`unstable`（未来版本）或\
  \ `experimental`（实验性）。分支名称之后是软件包分类。\n\nDebian 9 Stretch 安全更新条目如下：\n\n```\n| deb\
  \ http://security.debian.org/ stretch/updates main contrib non-freedeb-src http://security.debian.org/\
  \ stretch/updates main contrib non-free |\n```\n\n为了从引用的软件包源刷新包包列表，请调用以下命令：\n\n\
  ```bash\n# apt-get updateGet:1 http://security.debian.org/debian-security stretch/updates\
  \ InRelease [94.3 kB]Ign:2 http://ftp.us.debian.org/debian stretch InReleaseGet:3\
  \ http://ftp.us.debian.org/debian stretch-updates InRelease [91.0 kB]Get:4 http://security.debian.org/debian-security\
  \ stretch/updates/main Sources [179 kB]Get:5 http://security.debian.org/debian-security\
  \ stretch/updates/main amd64 Packages [447 kB]Hit:6 http://ftp.us.debian.org/debian\
  \ stretch ReleaseGet:8 http://ftp.us.debian.org/debian stretch-updates/main Sources.diff/Index\
  \ [5,164 B]Get:9 http://ftp.us.debian.org/debian stretch-updates/main amd64 Packages.diff/Index\
  \ [5,164 B]Get:10 http://ftp.us.debian.org/debian stretch-updates/main Translation-en.diff/Index\
  \ [3,688 B]Get:11 http://ftp.us.debian.org/debian stretch-updates/main Sources 2018-07-31-2010.17.pdiff\
  \ [385 B]Get:12 http://ftp.us.debian.org/debian stretch-updates/main amd64 Packages\
  \ 2018-07-31-2010.17.pdiff [1,388 B]…\n```\n\n### 软件包源\n\nDebian 项目维护着官方软件包源列表，称为软件包镜像。该列表分为主镜像和从用镜像。主镜像提供所有支持的架构，而从用镜像仅提供子集。对于美国，官方主软件包镜像是：\n\
  \n```\n| ftp.us.debian.org |\n```\n\n您可以在以下地址查看所需软件包镜像的当前状态：\n\n```\n| https://mirror-master.debian.org/status/mirror-status.html\
  \ |\n```\n\n![](img/Image00067.gif)\n\n### 软件包类型\n\nDebian 将其软件包分为三类：\n\n- `Main`\
  \ - 自由软件包。\n- `Contrib` - 依赖非自由软件包的自由软件包。\n- `Non-free` - 不提供源代码的非自由软件包。\n\n属于非自由类的软件包包括固件驱动程序、Skype\
  \ 即时通讯软件和 Flash 插件。源列表中的每一个条目都指定了它们的软件分类。\n\n### 软件包管理工具\n\n为了维护安装在您的 Linux 系统上的软件软件包选择，可以使用几种工具：\n\
  \n- `dpkg` - 用于管理单个软件包。\n- `apt`, `aptitude`, `synaptic` - 用于管理带有依赖关系的软件包。\n- `tasksel`\
  \ - 用于管理整个软件集合（任务）。\n\n下图描述了这些工具运行的不同级别以及它们如何协同工作。两个带有虚线轮廓的框指的是处理软件包管理任务的共享库。\n\n\
  ![](img/Image00068.gif)\n\n在较低层次，我们有 `dpkg`。它的任务是安装单个 Debian 软件包或移除已安装软件包的内容。为了查询软件包和文件，它使用了\
  \ `dpkg-deb` 和 `dpkg-query` 两个工具。`dpkg` 允许您维护软件包基础，但不处理软件包依赖关系。\n\n通常，上层由 `apt`、`aptitude`\
  \ 和 `synaptic` 工具表示。这些工具的任务是将所有操作合并到一个应用程序中以简化软件包管理。这些工具使用共享库 `libapt-inst` 或 `libapt-pkg`，或者直接与\
  \ `dpkg` 通信以执行软件包管理任务。这包括处理软件包依赖。\n\n### 软件包缓存\n\n软件包缓存位于 `/var/cache/apt/archives`。每当通过\
  \ `apt-get` 或 `aptitude` 安装软件包时，相应的软件包就会检索并本地存储在此位置。为了说明，下面使用 `ls` 列出了缓存的 deb 软件包。\n\
  \n```bash\n$ ls /var/cache/apt/archives/*.deb/var/cache/apt/archives/cpuid_20140123-2_amd64.deb/var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb/var/cache/apt/archives/python3-bitarray_0.8.1-1_amd64.deb/var/cache/apt/archives/python-bitarray_0.8.1-1_amd64.deb$\n\
  ```\n\n安装的软件越多，缓存的 deb 软件包就越多。建议使用 `aptitude` 或 `apt-cache` 定期清理软件包缓存。\n\n```bash\n\
  # aptitude clean\n# apt-cache clean\n```\n\n## 14.2 日常管理任务\n\n本节涉及 Linux 所有者和管理员日常生活中需要的基本的软件包管理操作。\n\
  \n### 显示已安装的软件包\n\n命令 `dpkg -l` 列出已安装的软件包及其状态。下图显示了输出。\n\n![](img/Image00069.gif)\n\
  \n单列包含以下信息：\n\n- `status` - 软件包的状态，例如已完全安装 (ii) 或已移除但仍配置 (rc)。\n- `name` - 软件包名称。\n\
  - `version` - 软件包版本。\n- `architecture` - 构建软件包的架构或平台。\n\n\n\n\n\n*   `description`\
  \ - 软件包的简要描述。\n\n## 安装软件包\n\n要安装软件包，请使用 `apt-get` 命令。下面的输出显示了安装 `htop` 软件包的示例。\n\
  \n```bash\n# apt-get install htop\nReading package lists… Done\nBuilding dependency\
  \ tree\nReading state information… Done\nSuggested packages:      strace\nThe following\
  \ NEW packages will be installed:\n      htop\n0 upgraded, 1 newly installed, 0\
  \ to remove and 35 not updated.\nNeed to get 88.2 kB of archives.\nAfter this operation,\
  \ 224 kB of additional disk space will be used.\nGet:1 http:..ftp.us.debian.org/Debian\
  \ stratch/main amd64 htop amd64 2.0.2-1 [88.2 kB]\nFetched 88.2 kB in 1s (76.6 kB/s)\n\
  Selecting previously unselected package htop. \n(Reading database … 82741 files\
  \ and directories currently installed.)\nPreparing to unpack …/htop_2.0.2-1_amd64.deb\
  \ …\nUnpacking htop (2.0.2-1) …\nProcessing triggers for mime-support (3.60) …\n\
  Processing triggers for desktop-file-utils (0.23-1) …\nProcessing triggers for man-db\
  \ (2.7.6.1-2) …\nSetting up htop (2.0.2-1) …\n#\n```\n\n## 更新已安装软件包\n\n更新已安装软件包非常简单，按照以下方法即可：首先，按照本章前面的介绍使用\
  \ `apt-get update` 更新软件包列表。然后运行 `apt-get install` 来更新软件包。如果软件包有可用版本，将从软件包镜像获取新包，移除旧包并安装新包。\n\
  \n## 移除已安装软件包\n\n移除已安装软件包的方法类似于安装或更新。`apt-get` 命令具有移除软件包的选项，如下所示。\n\n```bash\n#\
  \ apt-get remove htop\nReading package lists… Done\nBuilding dependency tree\nReading\
  \ state information… Done\nThe following packages will be REMOVED:\n      htop\n\
  0 upgraded, 0 newly installed, 1 to remove and 35 not updated.\nAfter this operation,\
  \ 224 kB of additional disk space will be freed.\nDo you want to continue? [Y/n]\n\
  (Reading database … 82751 files and directories currently installed.)\nRemoving\
  \ htop (2.0.2-1) …\nProcessing triggers for mime-support (3.60) …\nProcessing triggers\
  \ for desktop-file-utils (0.23-1) …\nProcessing triggers for man-db (2.7.6.1-2)\
  \ …\n#\n```\n\n此步骤会移除软件包的所有内容，保留配置文件。要彻底移除软件包及其配置文件，请按如下所示添加 `--purge` 参数：\n\n```bash\n\
  # apt-get remove --purge htop\n#\n```\n\n## 寻找 Linux 替代方案\n\n你可能会发现某些程序与 Linux 不兼容，且仅为\
  \ Windows 或 macOS 创建。然而，Linux 的伟大之处在于，对于每一个 Windows 或 macOS 应用，几乎总有一个 Linux 替代方案。以下是寻找\
  \ Linux 专用应用的两个优秀资源。\n\n*   [`www.linuxalt.com/`](https://www.linuxalt.com/)\n*\
  \   [`linuxappfinder.com/alternatives`](https://linuxappfinder.com/alternatives)\n\
  \n# 15 进程管理\n\n理解程序的执行对于成为一名优秀的系统管理员至关重要，对普通用户也很有用。在本章中，我们将更详细地查看进程，以及如何处理和操作进程。\n\
  \n程序的运行实例被称为“进程”。它由程序指令、从文件中读取的数据以及其他程序或系统用户的输入组成。每个进程都会被分配一个进程 ID（`PID`），允许系统跟踪所有进程。系统启动过程有一个\
  \ `PID` 0，然后初始进程具有 `PID` 1，并按顺序此类推。初始进程 `PID` 1 在较旧的 Linux 系统上是指 `/sbin/initd`，在现代\
  \ Linux 系统上是指 `/sbin/systemd`。\n\n### 15.1 进程相关操作\n\n### ps 和 pstree\n\n要列出所有运行中的进程，请使用\
  \ `ps` 命令或 `pstree` 命令。\n\n```bash\n# ps\nPID     TTY             TIME         \
  \  CMD\n628     pts/0           00:00:00        su\n629     pts/0           00:00:00\
  \        bash\n2507    pts/0           00:00:00        ps\n#\n```\n\n上述 `ps` 的输出包含四列，内容如下：\n\
  \n*   `PID`: 进程 ID。\n*   `TTY`: 调用命令的终端。\n*   `TIME`: 进程运行的时间。\n*   `CMD`: 调用的命令。\n\
  \n可以使用以下开关来获取额外信息：\n\n*   `-e`: 显示所有进程。\n*   `-p`: 显示指定进程的信息。\n*   `-C`: 显示指定的命令。\n\
  *   `-u`: 显示属于该用户名的进程。\n\n```bash\n# ps -u\nPID     TTY             TIME       \
  \    CMD\n628     pts/0           00:00:00        su\n629     pts/0           00:00:00\
  \        bash\n2507    pts/0           00:00:00        ps\n```\n\n`pstree` 命令与 `ps`\
  \ 类似，但它以树的形式显示进程。一个实用的开关是 `-p`，它可以将进程 ID 添加到名称中。\n\n### pidof\n\n`pidof` 命令简单显示指定进程的\
  \ ID。\n\n```bash\n# pidof\n```\n\n### pgrep\n\n`pgrep` 是用于进程的 `grep` 命令。该命令遍历当前运行的进程并输出匹配模式的进程\
  \ ID。下面的示例显示了两次调用。第一次调用请求 `pgrep` 搜索名称包含字符串 `term` 的进程并仅输出进程 ID。第二次调用使用选项 `-l`（`--list-name`\
  \ 的缩写）和 `-a`（`--full` 的缩写）来显示进程 ID 和对应的名称。\n\n```bash\n# pgrep term\npgrep -la term\n\
  ```\n\n### top\n\n`top` 命令根据活跃程度显示进程。最活跃的进程位于顶部，列表每秒更新一次。单列包含进程 ID (`PID`）、所有者用户名\
  \ (`USER`）、进程优先级 (`PR`）、nice 值 (`NI`）、虚拟内存使用 (`VIRT`）、预留内存 (`RES`）、共享内存 (`SHR`）、CPU\
  \ 和内存使用百分比（`%CPU`, `%MEM`）、进程运行时间（`TIME+`）以及用于调用进程的命令（`COMMAND`）。\n\n### htop\n\n\
  `htop` 是一个额外的软件包（请参考第 4 章和第 14 章关于安装额外软件包的内容），包含一个具交互性的 `top` 版本。列布局与 `top` 类似。使用导航和功能键选择、排序或删除进程。功能键如下：\n\
  \n*   `F1`: 显示帮助。\n*   `F2`: 配置 `htop`。\n*   `F3`: 在进程列表中搜索。\n*   `F4`: 过滤终端输出。\n\
  *   `F5`: 以进程树的形式显示进程。\n*   `F6`: 更改进程排序顺序。\n*   `F7`: 降低选中进程的 nice 值。\n*   `F8`:\
  \ 增加选中进程的 nice 值。\n*   `F9`: 终止选中进程。\n*   `F10`: 退出程序。\n\n### 15.2 前台和后台进程\n\n进程有两种类型：前台进程和后台进程。前台进程通过终端会话初始化并控制。也就是说，必须有用户连接到系统启动这些进程，且进程在执行期间会占用终端。相反，后台进程不连接到终端，也不显式需要任何用户输入。因此，它们在等待完成时不占用终端，并允许你运行多个进程。\n\
  \n可以使用 `&` 符号在后台初始化进程。\n\n```bash\n$ process1 &\n```\n\n\n\n\n\n要将运行中的进程发送到后台，请使用\
  \ `bg` 命令后接作业 ID。或者，`fg` 会将进程发送到前台。你可以使用 `jobs` 命令显示当前正在运行的作业及其相关的作业 ID：\n\n| $\
  \ process1 &$ process2 &$ jobs[1]+ Running process1[2]- Running process2$ |\n\n\
  ### 15.3 停止和终止进程\n\n如果一个运行中的程序变得无响应并导致系统负载过高，我们可以做些什么来停止并移除它？幸运的是，我们有几种选项允许我们向程序发送特定的信号来停止它。在本例中使用的命令是\
  \ `kill` 命令以及相应的开关。除此，我们还有以下开关：\n\n*   `SIGHUP` (1) - 挂断信号。程序可以监听此信号并采取采取操作。当你关闭终端时，此信号会被发送到在终端中运行的进程。\n\
  *   `SIGINT` (2) - 中断信号。此信号发送给进程以中断它们。程序可以处理此信号并采取行动。你也可以通过在运行程序的终端窗口中输入 `CTRL+C`\
  \ 直接发出此信号。\n*   `SIGTERM` (15) - 终止信号。此信号发送给进程以终止它们。同样，程序可以处理此信号并采取行动，例如在终止之前将数据写入文件。这是\
  \ `kill` 命令在未指定信号时发送的默认信号。\n*   `SIGKILL` (9) - 强制杀死信号。此信号会导致 Linux 内核立即终止进程。程序无法监听此信号。\n\
  \n要终止并杀死一个名为 `hangingProgram` 的程序，你必须首先标识该程序。你可以通过使用 `pgrep` 如下所示找到相关的进程：\n\n| $\
  \ pgrep hangingProgram3167$ |\n\n接下来，向标识的进程发送 `SIGTERM` 信号：\n\n| $ kill -SIGTERM\
  \ 3167 |\n\n作为替代方案，你可以按照如下方式调用 `kill`：\n\n| $ kill -15 3167 |\n\n或者，你也可以通过按下 `CTRL+Z`\
  \ 停止挂起的进程，然后使用此命令删除进程：\n\n| $ kill -SIGKILL 3167 |\n\n如上文所示，该命令的效果相同：\n\n| $ kill\
  \ -9 3167 |\n\n### 15.4 调整进程优先级\n\n你机器的处理器可以同时管理多个任务。我们可以为 CPU 在执行不同任务时设定需要遵循的准则。这些准则被称为\
  \ `niceness`（性值）或 `nice values`。Linux 的 niceness 范围从 -20 到 19，数字越小，表示任务的优先级越高。如果\
  \ nice 值很高（例如 19），任务将 own 设置为最低优先级，CPU 将在任何有机会时处理它。默认的 nice 值 0。\n\n你可以使用 `ps` 如下显示进程的\
  \ nice 级别：\n\n| $ ps -o pid,comm,nice -p 1808PID COMMAND NI1808 bash 0$ |\n\n第一列包含进程\
  \ ID (PID)，第二列包含命令，第三列包含 nice 级别 (NI)。如上例所示，PID 为 `1808` 的 `bash` 进程的 nice 级别为 0。可以使用\
  \ `renice` 命令调整现有进程的 nice 级别。要将上述进程的 nice 级别降低到 10，请执行以下命令。记住，只有 root 用户才能对进程应用负的\
  \ nice 值。\n\n| $ renice 10 -p 1808 |\n\n# 16. 系统与网络安全\n\n本章的理念是建立如何设置和运行安全系统的基本理解。在接下来的章节中，我们将关注更具实操性的方法，查看开放端口、现有和活动用户、限制远程访问、更新软件以及利用可用计算能力。\n\
  \n### 16.1 开放端口\n\n如果你从一开始就开始关注，可能还记得我们使用极简安装设置了 Linux 发行版。我们只安装了实际需要的软件包，并在以后需要时再安装其他软件。我们建议所有新安装都这样做，因为其结果是一个非常精简、高性能的系统，所需的资源最少。第二个原因是有限的软件限制了系统内部潜在安全问题的数量。\n\
  \n作为下一步，我们将检查从 Linux 系统外部可用的服务数量。这被称为端口扫描。协助我们的工具是命令行工具 `netcat` 和 `nmap`（Network\
  \ Mapper 的缩写），以及它的图形版本 `zenmap`。\n\n#### netcat\n\n以下 `nc` (`netcat`) 命令开始扫描本地桌面系统\
  \ (`localhost`) 在端口 1 到 1024 之间可用的网络服务。开关 `-zv` 启用端口的详细扫描：\n\n| $ nc -zv localhost\
  \ 1-1024localhost [127.0.0.1] 631 (ipp) openlocalhost [127.0.0.1] 111 (sunrpc) openlocalhost\
  \ [127.0.0.1] 80 (http) openlocalhost [127.0.0.1] 25 (smtp) openlocalhost [127.0.0.1]\
  \ 22 (ssh) open$ |\n\n`nc` 每行报告一个服务。上面的结果是：\n*   `631`: 打印协议 (IPP)\n*   `111`: Sunrpc\n\
  *   `80`: 超文本传输协议 (HTTP)\n*   `25`: 简单邮件传输协议 (SMTP)\n*   `22`: 安全 Shell (SSH)\n\n\
  要检查端口是否开放，我们使用 `nc -zv`。\n\n```bash\nnc -zv localhost 1-1024\nlocalhost [127.0.0.1]\
  \ 631 (ipp) open\nlocalhost [127.0.0.1] 111 (sunrpc) open\nlocalhost [127.0.0.1]\
  \ 80 (http) open\nlocalhost [127.0.0.1] 25 (smtp) open\nlocalhost [127.0.0.1] 22\
  \ (ssh) open\n```\n\n#### nmap\n\n我们将查看的下一个命令是 `nmap`。开关 `-T4` 设置计时，`-A` 启用操作系统检测。这一步骤被称为操作系统探测。\n\
  \n```bash\nnmap -T4 -A localhost\n```\n\n报告非常详细，包含了有关检测到的操作系统以及服务的信息。两个结果显示从外部可访问的服务只有\
  \ OpenSSH（Open Shell 的缩写）。\n\n### 16.2 本地与远程用户\n\nLinux 系统的安全性包括用户及其账户。在第 10 章中我们查看了\
  \ `w`、`who` 和 `users` 等基本命令。现在我们将处理更高级的用户检测方法。\n\n要查看哪些本地账户，你可以查看 `/etc/passwd`\
  \ 文件并验证这些条目。普通用户账户的用户 ID (UID) 从 1000 开始。\n\n为了查看哪些本地用户登录了系统，可以使用 `lslogins` 命令。`lslogins`\
  \ 从不同的配置文件提取用户信息并以非常漂亮的方式显示结果。\n\n\n\n\n\n以管理员身份调用时，`lslogins` 会添加 `PWD-LOCK` 和\
  \ `PWD-DENY` 两列信息。这些列显示关联账户是否被锁定，或者是否拒绝通过密码登录。\n\n![](img/Image00075.gif)\n\n为了查看特定用户的详细信息，`lslogins`\
  \ 使用切换开关 `-u` 后跟用户名，以及使用 `--time iso` 以可读的格式显示时间。\n\n```\n# lslogins -u user --time\
  \ isoUsername:           userUID:           1000Gecos field:           Debian User,123,456,135Home\
  \ directory:           /home/userShell:             /bin/bashNo login:         \
  \  noPassword is locked:           noPassword not required:           noLogin by\
  \ password disabled:           noPrimary group:           userGID:           1000Supplementary\
  \ groups:           Bluetooth, cdrom, floppy, audio, dip, video, plugdev, netdevSupplementary\
  \ group IDs:           111, 24, 25, 29, 30, 44, 46, 108Hushed:           noPassword\
  \ expiration warn interval:           7Password changed:           2018-08-20Maximum\
  \ change time:           99999Running processes:           32Last logs:2020-10-05T12:11:19+0200\
  \ systemd[438]: Time has been changed2020-10-05T12:11:52+0200 systemd[438]: Time\
  \ has been changed2020-10-05T12:12:24+0200 systemd[438]: Time has been changed#\
  \ |\n```\n\n如上所述，`lslogins` 仅评估本地登录尝试。要检索来自远程系统的登录尝试，请使用 `getent` 命令。它还评估支持 `/etc/nsswitch.conf`\
  \ 中配置的服务名称切换（NSS）库的数据库，涵盖了轻量级目录访问协议（LDAP）和网络信息系统（NIS）等服务。要获取用户 `cararo` 的信息，按如下方式调用\
  \ `getent`：\n\n```\n| $ getent passwd caroaro:x:1005:1005:Caro,,,:/home/caro:/bin/bash$\
  \ |\n```\n\n这两个命令 `last` 和 `lastlog` 也可以显示哪些用户最后登录了。`last` 报告详细的登录情况，如下所示。这些列包含用户名、终端和会话信息。\n\
  \n```\n| $ lastuser pts/13 :0 Fri Oct 5 09:41 still logged inuser pts/13 :0 Thu\
  \ Oct 4 15:12 - 15:24 (00:12)user pts/13 :0 Thu Oct 4 14:28 - 14:59 (00:31)user\
  \ pts/11 :0 Thu Oct 4 14:12 still logged inuser pts/8 :0 Thu Oct 4 14:04 still logged\
  \ inuser pts/8 :0 Thu Oct 4 11:34 - 11:49 (00:15)$ |\n```\n\n`lastlog` 命令打印最后登录用户的统计信息。下方的第一个示例显示了所有用户的情况，第二个示例显示了特定用户的情况。\n\
  \n![](img/Image00076.gif)\n\n![](img/Image00077.gif)\n\n### 16.3 限制远程访问\n\nLinux\
  \ 具有限制对系统的远程访问的能力`/etc/hosts.allow` 和 `/etc/hosts.deny` 两个文件调节来自其他系统对 TCP 服务的访问。该限制涵盖了单个主机、IP\
  \ 地址和整个网段。\n\n`/etc/hosts.allow` 文件显式地允许访问，而 `/etc/hosts.deny` 禁止访问。由于 `/etc/hosts.allow`\
  \ 文件中的访问规则首先应用，因此它们的优先级高于 `/etc/hosts.deny` 中指定的规则。因此，如果 `/etc/hosts.allow` 允许对某个服务的访问，则\
  \ `/etc/hosts.deny` 中拒绝该相同服务的规则将否忽略。\n\n第一个示例说明了如何限制所有以 `example.net` 结尾的主名的设备的\
  \ SSH 访问：\n\n```\n# /etc/hosts.deny\nALL: ALL\n# /etc/hosts.allow\nsshd : .example.net\n\
  ```\n\n第二个示例限制了来自 `192.168.30.*` 子网 IP 地址的设备访问：\n\n```\n# /etc/hosts.deny\nALL:\
  \ ALL\n# /etc/hosts.allow\nALL : 192.168.30.*\n```\n\n第三个示例显示了如何允许所有以 `example.net`\
  \ 结尾的主名的访问，但 `login.example.net` 除外：\n\n```\n# /etc/hosts.deny\nALL: ALL\n# /etc/hosts.allow\n\
  sshd : .example.net EXCEPT login.example.net\n```\n\n注意，TCP 封装服务不会缓存主机访问文件中的规则，因此\
  \ `/etc/hosts.allow` 或 `/etc/hosts.deny` 的任何更改将立即生效，无需重启网络服务。\n\n### 16.4 未使用的软件\n\
  \n除了端口和账户，我们还必须查看系统上安装的软件。正如我们之前提到的，在软件方面，越少越好。这条规则背后的想法是保持你的服务器精简高效。只安装你真正需要的软件包。如果存在提供未未使用服务的需要的包，请删除它们。安装的包越少，出现未修补代码和安全问题的概率就越小。\n\
  \n可以使用 `deborphan` 识别残留的软件包。下方的示例显示了 `deborphan` 发现了两个包：`iceweasel` 和 `netcat`。第一列显示包的大小，后面是包类别（main/oldlibs）、包名，然后是包的类型（extra）。\n\
  \n```\n# deborphan -szP     235 main/oldlibs           iceweasel           extra\
  \      32 main/oldlibs           netcat           extra# |\n```\n\n可以使用下面的命令删除不再需要的包。这可以清理系统中的残留未用库和旧依赖项。\n\
  \n```\n# apt-get autoremove\n```\n\n删除未使用的软件非常有帮助。保持剩余包处于最新状态也很重要，我们在第 14 章中讨论过。\n\
  \n### 16.5 有用的网络和系统命令\n\n#### `uname`\n\n`uname` 是 UNIX name 的缩写。该命令显示系统信息，例如 Linux\
  \ 内核的准确名称和版本以及你计算机的主机名。\n\n下面的示例显示了使用参数 `-a`（`all` 的缩写）调用 `uname` 命令。输出包含操作系统名称（Linux）、主机名（debian106）、内核版本及其编译日期（4.9.8-7-amd64\
  \ #1 SMP Debian 4.9.110-1 (2018-07-05））以及系统架构（x86_64）。\n\n```\n$ uname -aLinux debian106\
  \ 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64 GNU/Linux\n```\n\n####\
  \ `uptime`\n\n`uptime` 显示系统运行了多久。它显示当前时间（07:36），随后是运行时间（21:56）、登录用户数（1）以及平均负载（load\
  \ average: 0.47, 0.43, 0.29），持续最后 15 分钟。\n\n```\n$ uptime07:36 up 21:56, 1 user,\
  \ load average: 0.47, 0.43, 0.29\n```若要以更好的方式查看运行时间，请使用选项 `-p`（`pretty` 的缩写）。下方的示例显示了人类易读的版本。系统已运行\
  \ 22 小时。\n\n```\n$ uptime -pu22 hours\n```\n\n#### `ip`\n\n`ip` 命令（带有关键字 `address\
  \ show`）显示当前的网络配置。下方的示例显示了回环接口（lo）和以太网接口（enp0s3）。以太网接口配置了 IP 地址 `10.0.2.15`。网络接口缩写为：\n\
  \n* `Lo`: 回环接口。用于访问本地代理或 Web 服务器。\n* `eth0`: 连接到交换机或路由器的以太网接口。\n* `wlan0`: 无线接口。\n\
  * `ppp0`: 第点对点接口，通过 VPN 或拨号连接。\n\n```\n$ ip address show1: lo: <LOOPBACK, UP, LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000  link/loopback 00:\
  \ 00: 00: 00: 00: 00 brd 00: 00: 00: 00: 00: 00  inet 127.0.0.1/8 scope host  valid_lft\
  \ forever preferred_lft forever  inet6 ::1/128 scope host  valid_lft forever preferred_lft\
  \ forever2: enp0s3: <BROADCAST,MULTICAST, UP, LOWER_UP> mtu 1500 qdisc pfifo_fast\
  \ state UP group default qlen 1000  link/ether 08: 00: 27: e3: 5c: 79 brd ff: ff:\
  \ ff: ff: ff: ff  inet 10.0.2.15/24 brd 10.0.2.255 scope global enp0s3  valid_lft\
  \ forever preferred_lft forever  inet6 fe80::a00:27ff:fee3:5c79/64 scope link  valid_lft\
  \ forever preferred_lft forever$\n```\n\n#### `ping`\n\n`ping` 向指定的 IP 地址或主机名发送\
  \ ICMP 网络数据包，并显示往返时间。下方的示例演示了主机 `http://www.google.com` 的操作。\n\n\n\n\n\n```\n$ ping\
  \ google.com\nPING google.com (127.217.23.142) 56(84) bytes of data.\n64 bytes from\
  \ fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=1 ttl=63 time=36.9 ms\n64\
  \ bytes from fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=2 ttl=63 time=37.9\
  \ ms\n64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=3 ttl=63\
  \ time=40.1 ms\n^C\n--- google.com ping statistics ---\n3 packets transmitted, 3\
  \ received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev = 36.953/38.353/40.193/1.377\
  \ ms\n```\n\n# 17. 共享库\n\nLinux 与任何其他操作系统一样，都包含了用于不同目的的文件集合，例如二进制文件（编译后的程序代码）、运行时解释代码（用\
  \ Perl 或 Python 等程序编写的代码）、配置文件、日志文件、库和用户数据。\n\n在编程世界中，库（library）是一系列预编译的代码片段，它们可以在其他程序中使用。这些库包含了函数、类和数据结构。它们允许重用已经存在并经过测试的代码，因此用户不需要重复发明轮子。结果是，库极大地简化了程序员的生活。Linux\
  \ 中最突出的库示例是标准 C 库 `libc` 以及 `libc` 的 GNU 版本 `glibc`。\n\nLinux 区分了静态链接和动态链接的二进制程序。静态链接意味着库中的例程（routines）成为了程序的一部分。相比之下，动态链接意味着库中的例程仅被引用而不成为程序的一部分。静态链接的程序彼此完全独立，但需要更多的磁盘空间。动态链接的程序较小，但依赖于引用的库，这意味着如果引用的库已经在内存中，它们的加载速度会更快。这些库被称为共享库或动态库。\n\
  \n## 17.1 命名规范\n\n共享库的文件名通常用 `.so` 扩展，它是 shared object（共享对象）的缩写。除了文件名，共享库还有一个被称为\
  \ `soname` 的库名。例如，`libc` 的 `soname` 是 `libc.so.6`。在这里，`lib` 是前缀，`c` 是描述性名称，`so`\
  \ 是 shared object 的缩写，而 `6` 是库的版本（应用程序二进制接口 ABI 的版本）。包含路径的文件名为 `/lib64/libc.so.6`。注意，`soname`\
  \ 是指向文件名的符号链接。\n\n通常这些文件存在于以下目录：\n\n* 默认路径 - `/usr/local/lib`, `/usr/local/lib64`,\
  \ `/usr/lib`, `/usr/lib64`。\n* 系统启动库 - `/lib`, `/lib64`。\n\n然而，程序员可以在自定义位置安装库。库路径在配置文件\
  \ `/etc/ld.so.conf` 中定义。可以通过以下方式定义库的位置：\n\n```bash\ncat /etc/ld.so.conf\ninclude\
  \ /etc/ld.so.conf.d/*.conf\n```\n\n以下命令说明了如何使用 `find` 命令在你的 Linux 系统上查找共享库：\n\n\
  ```bash\nfind / -name *.so/lib/klibc-IpHHGKKbZi_yZ7GPagmQz2GwVAQ.so/lib/security/pam_vbox.so/lib/security/pam_gnome_keyring.so/lib/x86_64-linux-gnu/libnss_hesiod-2.19.so/lib/x86_64-linux-gnu/libnss_compat-2.19.so/lib/x86_64-linux-gnu/libnss_files-2.19.so/lib/x86_64-linux-gnu/libnss_dns-2.19.so/lib/x86_64-linux-gnu/security/pam_namespace.so/lib/x86_64-linux-gnu/security/pam_env.so/lib/x86_64-linux-gnu/security/pam_filter.so...\n\
  ```\n\n## 17.2 使用 ldd 识别引用的库\n\n要找出二进制文件使用了哪些共享对象，我们可以使用 `ldd` 命令。例如，要查找文件管理器 Midnight\
  \ Commander (`mc`) 的共享对象，请输入 `ldd /usr/bin/mc`。输出中的每一行由 `soname` 后跟文件名和括号中的哈希值组成。\n\
  \n```bash\nldd /usr/bin/mc\n    linux-vdso.so.1 (0x00007ffd555fb000)\n    libslang.so.2\
  \ => /lib/x86_64-linux-gnu/libslang.so.2 (0x00007f483d6bb000)\n    libgpm.so.2 =>\
  \ /lib/x86_64-linux-gnu/libgpm.so.2 (0x00007f483d4b500)\n    libext2fs.so.2 => /lib/x86_64-linux-gnu/libext2fs.so.2\
  \ (0x00007f483d26e00)\n    libssh2.so.1 => /lib/x86_64-linux-gnu/libssh2.so.1 (0x00007f483d04500)\n\
  \    libgmodule-2.0.so.0 => /lib/x86_64-linux-gnu/libgmodule-2.0.so.0 (0x00007f48ce41000)\n\
  \    libglib-2.0.so.0 => /lib/x86_64-linux-gnu/libglib-2.0.so.0 (0x00007f48cb31000)\n\
  \    libpthread.so.0 => /lib/x86_64-linux-gnu/libpthread.so.0 (0x00007f48c914000)\n\
  \    libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6 (0x00007f48c569000)\n    libdl.so.2\
  \ => /lib/x86_64-linux-gnu/libdl.so.2 (0x00007f48c364000)\n    libm.so.6 => /lib/x86_64-linux-gnu/libm.so.6\
  \ (0x00007f48c063000)\n    libcom_err.so.2 => /lib/x86_64-linux-gnu/libcom_err.so.2\
  \ (0x00007f48be5f000)\n    libz.so.1 => /lib/x86_64-linux-gnu/libz.so.1 (0x00007f48bc4300)\n\
  \    libgcrypt.so.20 => /lib/x86_64-linux-gnu/libgcrypt.so.20 (0x00007f48b96200)\n\
  \    libpcre.so.3 => /lib/x86_64-linux-gnu/libpcre.so.3 (0x00007f48b5f700)\n   \
  \ lib-error.so.0 => /lib/x86_64-linux-gnu/lib-error.so.0 (0x00007f48b4e100)\n```\n\
  \n如果二进制文件是静态链接的，库中的例程成为了程序的一部分。相比之下，动态链接意味着库中的例程仅被引用而不成为程序的一部分。\n\n## 17.3 使用 objdump\
  \ 识别引用的库\n\n要找出二进制文件使用了哪些共享对象，我们可以使用 `objdump` 命令。例如，要查看 Midnight Commander (`mc`)\
  \ 文件的共享对象，输入 `objdump -p /usr/bin/mc | grep NEEDED`。输出中 `NEEDED` 的行包含了所需的库。\n\n\
  ```bash\nobjdump -p /usr/bin/mc | grep NEEDED\nNEEDED: libslang.so.2\nNEEDED: libgpm.so.2\n\
  NEEDED: libext2fs.so.2\nNEEDED: libssh2.so.1\nNEEDED: libgmodule-2.0.so.0\nNEEDED:\
  \ libglib-2.0.so.0\nNEEDED: libpthread.so.0\nNEEDED: libc.so.6\nNEEDED: libdl.so.2\n\
