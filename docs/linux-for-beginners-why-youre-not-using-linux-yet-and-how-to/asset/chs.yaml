  \ 2018-10-06 21:51:07....\n\n## 18.2 常用命令与图形化工具\n\n除了上述的日志文件外，还有系统命令可以显示你机器的相关信息。\n\
  \n### dmesg\n\n如第 8 章所述，此命令允许你查看整个启动过程，包括 BIOS 消息。\n\n```bash\ndmesg\n```\n\n##\
  \ journalctl -b\n\n同样在第 8 章介绍，此命令显示系统的启动消息。\n\n```bash\njournalctl -b\n```\n\n###\
  \ journalctl _UID=1000\n\n此命令显示特定用户的日志条目。在此实例中，它显示用户 ID 为 `1000` 的用户的条目。\n\n```bash\n\
  journalctl _UID=1000\n```\n\n### journalctl --disk-usage\n\n要查看存储日志文件需要多少磁盘空间，如下使用开关\
  \ `--disk-usage`：\n\n```bash\njournalctl --disk-usage\n```\n\n\n\n\n`whatis` 在其索引数据库中搜索字符串（该数据库由\
  \ `mandb` 程序维护），并从该命令帮助页的 `NAME` 节中选取一个简短描述。下面的示例展示了 `mv` 和 `man` 两个命令的使用情况。\n\n\
  | $ whatis mv (1) - 移动（重命名）文件$ whatis man (1) - 在线参考手册的接口 man (7) - 用于格式 man 页的宏$\
  \ | | |\n\n另一个选项是 `whereis` 命令，它对于定位 Linux 系统中的命令帮助页非常有帮助。这是一个非常简单的实用。下面的示例展示了 `mv`\
  \ 和 `man` 两个命令的情况。\n\n| $ whereis mv: /bin/mv /usr/share/man/man1/mv.1.gz$whereis\
  \ man: /usr/bin/man /usr/local/man /usr/share/man /usr/share/man/man1/man.1.gz /usr/share/man/man7/man.7.gz$\
  \ | | |\n\n每个命令还提供了额外的信息和配置示例。这些内容存储在 `/usr/share/doc` 目录下，每个程序都有自己的子目录。内容是标准化的，且因程序而异。每个用户都可以访问这些内容。下方显示了目录片段。\n\
  \n![](img/Image00083.gif)\n\n## 19.4 外部帮助\n\n如果软件工具自带的帮助不够，需要进一步的解释，就需要用到外部资源了。可以咨询一些在线社区，例如：\n\
  \n* LinuxHint - [`support.linuxhint.com`](https://support.linuxhint.com)\n* LinuxHelp\
  \ - [`www.linuxhelp.com`](https://www.linuxhelp.com)\n\n另一个选项是 Linux 用户组 (LUG)。LUG\
  \ 是来自同一地理位置、对 Linux 操作系统有共同兴趣的人组成的群体。他们以松散关联的人群或定期聚会的协会的形式组织。可以通过 `LugsList` [`lugslist.com`](http://lugslist.com)\
  \ 获取全球 LUG 的完整列表。\n\n![](img/Image00084.gif)\n\n许多 LUG 会组织聚会和活动，以分享想法、交流经验并相互学习。这包括本地和国际活动。\n\
