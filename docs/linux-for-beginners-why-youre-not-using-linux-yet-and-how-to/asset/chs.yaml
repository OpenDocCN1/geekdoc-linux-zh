  \ `/mnt/root` ext2\n`/dev/sdb5` swap\n`/dev/sdb6` `/mnt/home` ext4\n\n要做到这一点，首先我们创建需要的挂载点：\n\
  \n```\n## mkdir /mnt/root\n## mkdir /mnt/home\n```\n\n然后为了添加文件系统，我们执行以下命令：\n\n```\n\
  ## mkfs /dev/sdb1\nmk2fs 1.43.4 (31-Jan-2017)\nCreating filesystem with 1048576\
  \ 4k blocks and 262144 inodes\nFilesystem UUID: 8e70eeac-83cb-43f1-a402-a10fdec95\n\
  Superblock backups stored on blocks: 32768,98304,163840,229376,294912,819200,884736\n\
  Allocating group tables: done\nWriting inode tables: done\nWriting superblocks and\
