  \ fstab(5)。\n<文件系统><挂载点><类型><选项><dump><pass>\n/ 安装期间位于 /dev/sda1\nUUID=dc78e6f0-8a4f-4be0-9192-e4ca37838765\
  \     /      ext4      errors=      0 1\n/home 安装期间位于 /dev/sda7\nUUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf\
