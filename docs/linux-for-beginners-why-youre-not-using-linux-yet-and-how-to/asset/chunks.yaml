    # 14. Package Management


    In today''s world, software can be quite complex. Part of this complexity stems
    from programs being split into single components made available as single packages,
    such as binary data, shared libraries, and documentation. This concept of software
    development is called modularity and is generally accepted and in widespread use.
    Debian, for instance, offers more than 50,000 different packages.


    Package management covers all actions needed to handle these software packages
    including installation, configuration, removal, and updating packages. It also
    covers resolving package dependencies (packages that depend on each other).


    ## 14.1 Understanding Package Architecture


    To explain the Linux package architecture, we will be using Debian for illustration.
    The Debian distribution is known for its stability and exceptional packaging system.
    The descriptions that follow are valid for all Linux distributions that are derived
    from Debian, such as Ubuntu, Linux Mint, Knoppix, Kali Linux, Grml, and Xandros.
    Keep in mind that the names of packages may differ, so too the distribution-specific
    package mirrors and the names of package classes.


    The Debian package management ecosystem contains quite a number of different components
    such as package lists, package sources, package mirrors, different software packages,
    software to manage the package setup, and the package cache. These components
    are explained in more detail below.


    ### Package Lists


    Debian contains a list of available software packages. This list is referenced
    in the file `/etc/apt/sources`, and for specific components and personal additions
    in the directory `/etc/apt/sources.list.d`. As an example, the messenger Skype
    uses the file `skype-stable.list`. The lists use a text format with one package
    source per line:


    ```

    | deb http://ftp.de.debian.org/debian/ stretch main contrib non-freedeb-src http://ftp.de.debian.org/debian/
    stretch main contrib non-free |

    ```


    Each line either refers to a binary package type (`deb`) or to a source package
    type (`deb-src`). The package type is followed by the package source, which refers
    to a repository that provides the software packages. Next, the line contains the
    name of the Debian release, which can be specified either as the nickname of the
    release or the branch.


    The nickname originates from a character in the film Toy Story . The branch refers
    to the development stage of the release, and can be oldoldstable (pre-previous
    release), oldstable (previous release), stable (current release), testing (next
    release), unstable (future release), or experimental. After the name of the branch,
    the package classes are named.


    The entries for security updates of Debian 9 Stretch look as follows:


    ```

    | deb http://security.debian.org/ stretch/updates main contrib non-freedeb-src
    http://security.debian.org/ stretch/updates main contrib non-free |

    ```


    In order to refresh the package list from the referenced package sources, invoke
    the following command:


    ```bash

    # apt-get updateGet:1 http://security.debian.org/debian-security stretch/updates
    InRelease [94.3 kB]Ign:2 http://ftp.us.debian.org/debian stretch InReleaseGet:3
    http://ftp.us.debian.org/debian stretch-updates InRelease [91.0 kB]Get:4 http://security.debian.org/debian-security
    stretch/updates/main Sources [179 kB]Get:5 http://security.debian.org/debian-security
    stretch/updates/main amd64 Packages [447 kB]Hit:6 http://ftp.us.debian.org/debian
    stretch ReleaseGet:8 http://ftp.us.debian.org/debian stretch-updates/main Sources.diff/Index
    [5,164 B]Get:9 http://ftp.us.debian.org/debian stretch-updates/main amd64 Packages.diff/Index
    [5,164 B]Get:10 http://ftp.us.debian.org/debian stretch-updates/main Translation-en.diff/Index
    [3,688 B]Get:11 http://ftp.us.debian.org/debian stretch-updates/main Sources 2018-07-31-2010.17.pdiff
    [385 B]Get:12 http://ftp.us.debian.org/debian stretch-updates/main amd64 Packages
    2018-07-31-2010.17.pdiff [1,388 B]…

    ```


    ### Package Sources


    The Debian project maintains an official list of package sources named package
    mirrors . This list is divided into primary and secondary package mirrors. Primary
    package mirrors offer the full spectrum of supported architectures, while secondary
    mirrors only offer a subset. For the United States, the official primary package
    mirror is:


    ```

    | ftp.us.debian.org |

    ```


    You can view the current state of your desired package mirror at the following
    address:


    ```

    | https://mirror-master.debian.org/status/mirror-status.html |

    ```


    ![](Image00067.gif)


    ### Package Types


    Debian divides its packages into three categories:


    - `Main` - free packages.

    - `Contrib` - free packages that depend on non-free packages.

    - `Non-free` - non-free packages that do not provide source code.


    Packages that belong to the non-free category include firmware drivers, Skype
    messenger, and the Flash plugin. Every single entry in the list of source packages
    specifies their category of software.


    ### Package Management Tools


    To maintain the selection of software packages installed on your Linux system,
    several tools are available:


    - `dpkg` - used to manage single packages.

    - `apt`, `aptitude`, `synaptic` - used to manage packages with their dependencies.

    - `tasksel` - used to manage entire software collections (tasks).


    The image below depicts the different levels on which the tools operate and how
    they work together. The two boxes with dotted outlines refer to the shared libraries
    that handle the package management tasks.


    ![](Image00068.gif)


    On the lower level, we have `dpkg`. Its task is to install a single Debian package
    or to remove the contents of a package that has already been installed. To query
    packages and files, it makes use of the two tools `dpkg-deb` and `dpkg-query`.
    `dpkg` allows you to maintain your package base but does not handle package dependencies.


    Typically, the upper level is represented by the tools `apt`, `aptitude`, and
    `synaptic`. These tools have the task of simplifying package management by combining
    all actions into one application. These tools use either the shared libraries
    `libapt-inst` or `libapt-pkg`, or communicate with `dpkg` directly to perform
    the package management tasks. This includes handling the package dependencies.


    ### Package Cache


    The package cache is located at `/var/cache/apt/archives`. Whenever you install
    a software package via `apt-get` or `aptitude` the appropriate package is retrieved
    and stored locally at this location. To illustrate, below lists the cached deb
    packages using `ls`.


    ```bash

    $ ls /var/cache/apt/archives/*.deb/var/cache/apt/archives/cpuid_20140123-2_amd64.deb/var/cache/apt/archives/libxml2-utils_2.9.1+dfsg1-5+deb8u7_amd64.deb/var/cache/apt/archives/python3-bitarray_0.8.1-1_amd64.deb/var/cache/apt/archives/python-bitarray_0.8.1-1_amd64.deb$

    ```


    The more software you install, the more deb packages are cached. It is recommended
    to clear the package cache from time to time by using either `aptitude` or `apt-cache`.


    ```bash

    # aptitude clean

    # apt-cache clean

    ```


    ## 14.2 Day-to-Day Administration Tasks


    This section deals with basic package management actions needed in day-to-day
    life as a Linux owner and administrator.


    ### Displaying Installed Packages


    The command `dpkg -l` lists the installed packages and their status. The image
    below shows the output.


    ![](Image00069.gif)


    The single columns contain the following information:


    - `status` - the status of the package, such as fully installed (ii) or removed
    and still configured (rc).

    - `name` - the name of the package.

    - `version` - the package version.

    - `architecture` - the architecture or platform the package is built for.

