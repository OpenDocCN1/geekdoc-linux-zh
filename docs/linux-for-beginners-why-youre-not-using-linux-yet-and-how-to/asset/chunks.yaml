    # 17. Shared Libraries


    Linux, like any operating system, contains collections of files used for different
    purposes such as binary files (compiled program code), runtime interpreted code
    (written in programs like Perl or Python), configuration files, log files, libraries,
    and user data.


    In the world of programming, a library is an assortment of pre-compiled pieces
    of code that can be used in other programs. These libraries contain functions,
    classes, and data structures. They allow the reuse of code that already exists
    and has already been tested, so the user doesn''t need to reinvent the wheel.
    As a result, libraries significantly simplify the life for programmers. Among
    the most prominent examples of libraries in Linux are libc , the standard C library,
    and glibc , the GNU version of libc .


    Linux distinguishes between statically and dynamically linked binary programs.
    Statically linked, means the routines from the library become part of the program.
    In contrast, dynamically linked means the routines from the library are referenced
    only and do not become part of the program. Statically linked programs are entirely
    independent of one another but require more disk space. Dynamically linked programs
    are smaller but depend on the reference libraries, meaning they load quicker if
    the referenced library is already in memory. These libraries are called shared
    libraries or dynamic libraries.


    17.1 Naming Conventions


    It is common to extend the filename of a shared library with .so which abbreviates
    the term shared object . Apart from the filename, a shared library also has a
    library name known as a soname . As an example, the soname for libc is libc.so.6
    . Here lib is the prefix, c is a descriptive name, so is short for shared object,
    and 6 is the version of the library (the version of the Application Binary Interface
    or ABI). The filename including the path is /lib64/libc.so.6\. Note that the soname
    is a symbolic link to the filename.


    Usually these files reside in the following directories:


    *   default paths - /usr/local/lib, /usr/local/lib64, /usr/lib, /usr/lib64.


    *   system startup libraries - /lib, /lib64.


    Programmers can however install libraries in custom locations. The library path
    is defined in the configuration file /etc/ld.so.conf. Defining the library location
    can be done in the following manner:


    | $ cat /etc/ld.so.confinclude /etc/ld.so.conf.d/*.conf$ |


    The following command illustrates how to find the shared libraries on your Linux
    system using the find command:


    | $ find / -name *.so/lib/klibc-IpHGKKbZiB_yZ7GPagmQz2GwVAQ.so/lib/security/pam_vbox.so/lib/security/pam_gnome_keyring.so/lib/x86_64-linux-gnu/libnss_hesiod-2.19.so/lib/x86_64-linux-gnu/libnss_compat-2.19.so/lib/x86_64-linux-gnu/libnss_files-2.19.so/lib/x86_64-linux-gnu/libnss_dns-2.19.so/lib/x86_64-linux-gnu/security/pam_namespace.so/lib/x86_64-linux-gnu/security/pam_env.so/lib/x86_64-linux-gnu/security/pam_filter.so...$
    |


    17.2 Identifying Referenced Libraries using ldd


    To find out which shared objects a binary file uses, we can use the command ldd
    . For example, to find the shared objects of the file manager Midnight Commander
    (mc), type ldd /usr/bin/mc . Each line within the output consists of the soname
    followed by the filename and the hash value in brackets.


