    To send a running process to the background, use the command `bg` followed by
    the job ID. Alternatively, `fg` will send the process to the foreground. You can
    use the `jobs` command to show the jobs that are currently running and their associated
    job IDs:


    | $ process1 &$ process2 &$ jobs[1]+ Running process1[2]- Running process2$ |


    ### 15.3 Stopping and Terminating Processes


    If a running program becomes unresponsive and causes load, what can we do to stop
    it and get rid of it? Luckily, we have a few options that allow us to send a specific
    signal to the program to stop it. The command used in this instance is the `kill`
    command with a corresponding switch. Among others, we have the following switches:


    *   `SIGHUP` (1) - Hang up signal. Programs can listen for this signal and act
    upon it. This signal is sent to processes running in a terminal when you close
    the terminal.

    *   `SIGINT` (2) - Interrupt signal. This signal is given to processes to interrupt
    them. Programs can process this signal and act upon it. You can also issue this
    signal directly by typing `CTRL+C` in the terminal window where the program is
    running.

    *   `SIGTERM` (15) - Termination signal. This signal is given to processes to
    terminate them. Again, programs can process this signal and act upon it, for example
    writing data to a file before terminating. This is the default signal sent by
    the `kill` command if no signal is specified.

    *   `SIGKILL` (9) - Kill signal. This signal causes the immediate termination
    of the process by the Linux kernel. Programs cannot listen for this signal.


    To terminate and kill a program named `hangingProgram` you will have to identify
    the program first. You do this by using `pgrep` to find the associated process
    as follows:


    | $ pgrep hangingProgram3167$ |


    Next, send the identified process the `SIGTERM` signal:


    | $ kill -SIGTERM 3167 |


    As an alternative, you may invoke `kill` as follows:


    | $ kill -15 3167 |


    Or you may stop the hanging process by pressing `CTRL+Z`, and then deleting the
    process using this command:


    | $ kill -SIGKILL 3167 |


    As demonstrated above, this command does the same:


    | $ kill -9 3167 |


    ### 15.4 Adjusting the Priority of a Process


    The processors of your machine can manage more than one task at the same time.
    We can set guidelines for the CPU to follow when it''s looking at the different
    tasks it has to execute. These guidelines are called `niceness` or `nice values`.
    The Linux niceness scale goes from -20 to 19, where a lower number represents
    a higher priority for a task. If the niceness value is high like 19, the task
    will be set to the lowest priority and the CPU will process it whenever it gets
    a chance. The default nice value is zero.


    You can display the nice level of a process using `ps` as follows:


    | $ ps -o pid,comm,nice -p 1808PID COMMAND NI1808 bash 0$ |


    The first column contains the Process ID (PID), the second column contains the
    command, and the third contains the nice level (NI). As demonstrated in the example
    above, the `bash` process with the PID `1808` has a nice level of 0. An existing
    process''s nice level can be adjusted using the `renice` command. To reduce the
    nice level of the process above to 10, issue the command below. Keep in mind that
    only a root user can apply negative nice values to a process.


    | $ renice 10 -p 1808 |


    # 16. System and Network Security


    The idea behind this chapter is to develop a basic understanding of how to set
    up and run a secure system. In the following section, we focus on a more practical
    approach and will have a look at the detection of open ports, existing and active
    users, limiting remote access, updating software, and making use of the computing
    power made available.


    ### 16.1 Open Ports


    If you''ve been following along since the beginning, you might recall that we
    set up our Linux distribution with a minimalistic installation. We installed only
    the software packages that we actually needed, and post-installed other software
    if it was necessary later on. We recommend this for all new installations, as
    the result is a very lean system with high performance that requires as little
    resources as possible. The second reason is the limited software restricts the
    number of potential security issues from inside the system.


    As the next step, we will check the number of services that are available from
    outside the Linux system. This is known as port scanning. The tools that will
    assist us are the command line tools `netcat` and `nmap` (short for Network Mapper)
    as well as its graphical version `zenmap`.


    #### netcat


    The following `nc` (`netcat`) command starts scanning the local desktop system
    (`localhost`) for available network services on ports between 1 and 1024. The
    switch `-zv` enables verbose scanning of ports:


    | $ nc -zv localhost 1-1024localhost [127.0.0.1] 631 (ipp) openlocalhost [127.0.0.1]
    111 (sunrpc) openlocalhost [127.0.0.1] 80 (http) openlocalhost [127.0.0.1] 25
    (smtp) openlocalhost [127.0.0.1] 22 (ssh) open$ |


    The `nc` reports one service per line. The results above are:

    *   `631`: Internet Printing Protocol (IPP)

    *   `111`: Sunrpc

    *   `80`: Hypertext Transfer Protocol (HTTP)

    *   `25`: Simple Mail Transfer Protocol (SMTP)

    *   `22`: Secure Shell (SSH)


    To check if a port is open, we use `nc -zv`.


    ```bash

    nc -zv localhost 1-1024

    localhost [127.0.0.1] 631 (ipp) open

    localhost [127.0.0.1] 111 (sunrpc) open

    localhost [127.0.0.1] 80 (http) open

    localhost [127.0.0.1] 25 (smtp) open

    localhost [127.0.0.1] 22 (ssh) open

    ```


    #### nmap


    The next command we will look at is `nmap`. The switch `-T4` sets the timing and
    `-A` enables the detection of the operating system. This step is called OS probing.


    ```bash

    nmap -T4 -A localhost

    ```


    The report is quite detailed and contains information about the detected operating
    system as well as the services. Both results show that the only service enabled
    and accessible from outside, is OpenSSH (short for Open Shell).


    ### 16.2 Local and Remote Users


    The security of a Linux system includes the users and their accounts. In Chapter
    10 we had a look at basic commands such as `w`, `who`, and `users`. Now we will
    address more sophisticated methods of detecting user information.


    To see which local accounts exist, you can have a look at the file `/etc/passwd`
    and verify the entries. The user ID of a regular user account starts at 1000.


    In order to see which local users logged into the system, the `lslogins` command
    can be used. `lslogins` extracts the user information from the different configuration
    files and displays the results in a very nice way.

