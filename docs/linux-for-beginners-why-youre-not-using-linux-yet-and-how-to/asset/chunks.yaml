    此外，`GNU/Linux` 的描述需要一些解释。带有此名称前缀的 Linux 发行版通过 `GNU` 实现的系统工具和程序来完善。其中一个例子就是 `Debian
    GNU/Linux`。正如第 1 章所指，`GNU` 项目源于理查德·曼·斯尔曼（Richard M. Stallman）的发起以及他开发自由 `UNIX`
    系统的梦想。基于他在 MIT 的经验与其他同事的合作，他选择使用现有的免费软件来重写他需要的工具。这包括 `TeX` 排版系统以及 `X11` 窗口系统。他尽可能在
    `GPL` 许可证下发布这些重写的工具，以便让所有感兴趣的人都能免费地使用他的工作成果。


    ## 什么是 Linux 发行版？


    Linux 发行版是一系列相互匹配的软件包集合。一个发行版由一个软件开发者团队维护，团队的每个成员专注于发行版中一个不同的软件包。他们作为一个团队共同努力，确保单个软件包是最新更新的，并且不会与同一发布版本的其他软件包发生冲突。


    截至 2020 年，对于 `Debian GNU/Linux 10`，官方存储库包含超过 59,000 个不同的软件包。存储库是一个具有特定用途的软件包目录。`Debian
    GNU/Linux` 根据开发状态对其软件包进行分类。官方存储库命名为 `stable`（稳定），反映了当前的稳定软件包。其他存储库命名为 `testing`（测试）和
    `unstable`（不稳定），工作方式相同，但不属于官方软件包。


    通常，一个 Linux 发行版包含 Linux 内核软件包、引导加载程序、`GNU` 工具和库、带有窗口环境的图形桌面环境，以及额外的软件，如 Web 浏览器、电子邮件客户端、数据库和文档。软件以两种方式提供：源码和编译后的二进制包。这允许你理解软件是如何设计的，对其进行研究，并根据你的个人需求进行调整。这一步被描述为第
    2 章所示列表中的第一种自由。


    根据 Linux 发行版重点的不同，它还包含特定用途的软件包，例如网络或取证工具、用于教育目的的科学软件以及多媒体应用。更多细节见下文。


    ## 选择 Linux 发行版


    根据 Distrowatch 的数据，存在超过 600 个不同的 Linux 发行版。主要问题之一是：使用哪个 Linux 发行版？根据我们的经验，我们有以下建议：


    *   对于初学者：`Ubuntu`、`Xubuntu`、`openSUSE`、`Linux Mint`。

    *   对于有经验的高级用户：`Debian GNU/Linux`、`Red Hat Enterprise Linux` (`RHEL`)、`Fedora`、`CentOS`。

    *   对于开发者：`Arch Linux`、`Gentoo`、`Slackware`。


    书中的示例使用了 `Debian GNU/Linux`。尽管这个发行版被推荐给高级用户，但它对新手仍然非常友好，我们将在指南中演示。但选择它最重要的原因是它的稳定性，以及我们在过去
    20 年在服务器和桌面系统中长期使用它建立的信任。其他 Linux 发行版的波动太大。我们看到初学者犯的最大错误是在开始时选择安装一个不稳定的发行版，这在很多情况下会破坏你的
    Linux 体验并让你完全放弃 Linux。


    非常欢迎你选择不同的 Linux 发行版。只需确保它没有已知的稳定性问题即可。本书的大部分内容适用于大多数发行版。但如果你是一个完全的新手，我们强烈建议至少在本指南期间坚持使用
    `Debian`，我们将逐步引导你完成安装和配置。


    通常，选择 Linux 发行版可以取决于几个标准：


    *   其可用性：免费或商业用途。

    *   其用途：桌面、服务器、Wi-Fi 路由器/网络设备。

    *   目标受众：终端用户、网络工程师、系统管理员、开发者。

    *   软件包格式：`.deb`、`.rpm`、`.tar.gz`。

    *   更新频率：每个 Linux 发行版都有自己的更新周期。

    *   提供的支持：可以是免费的（基于社区），也可以是付费（基于支持合同）。


    在选择发行版时，我们建议选择稳定、定期更新并符合你电脑用途的发行版。下面你将看到每个主要 Linux 发行版的简短描述。


    ![](img/Image00001.gif)


    ### Debian GNU/Linux


    `Debian GNU/Linux`（简称 `Debian`）建立于 1993 年，是一个完全免费且基于社区的操作系统，遵循 `GNU` 原则。超过 1,000
    名开发者自愿地对其持续工作。`Debian` 的开发背后没有公司，这意味着不涉及商业利益。


    一个设计目标是为积极提供服务的计算机提供一个稳定可靠的操作系统。它针对那些知道自己想要什么并且 `Debian` 开发者维护并使用自己软件的用户。软件包以
    `.deb` 格式提供，并根据以下许可证分类：


    *   `Main`：自由软件。

    *   `Contrib`：依赖非免费软件的自由软件。

    *   `Non-free`：具有非免费许可证的软件包。


    `Debian` 在服务器和桌面系统上运行良好。支持多种架构，如 `ARM EABI` (`arm`)、`IA-64` (`Itanium`)、`MIPS`、`MIPSel`、`powerpc`、`s390`（32
    位和 64 位），以及 `sparc`、`i386`（32 位）和 `amd64`（64 位）。每个版本的代号基于电影《玩具总动员》中角色的名字，例如 `Debian
    GNU/Linux 9` 的 `Stretch` 和 `Debian GNU/Linux 10` 的 `Buster`。


    ![](img/Image00002.gif)


    ### Ubuntu


    `Ubuntu` 是一个由 `Canonical Ltd` 公司资助的免费 Linux 发行版。它基于 `Debian` 但更侧重于初学者。这就是为什么每个任务只包含一个工具。`Ubuntu`
    团队以引入缺乏稳定性的全新元素而闻。这是我们在与新手交流时收到的最大抱怨之一。由于这个原因，我们不向初学者推荐 `Ubuntu`。人气并不同于易用性。我们的首选是
    `Debian`，`Mint` 是一个很好的第二选择。


    软件包以 `.deb` 格式提供，并根据来自 `Canonical` 的支持分类：


    *   `Main`：由 `Canonical` 支持的自由软件。

    *   `Restricted`：由 `Canonical` 支持的非免费软件。

    *   `Universe`：不受支持的自由软件。

    *   `Multiverse`：不受支持的非免费软件。


    `Ubuntu` 提供三个官方版本：`Ubuntu Desktop`、`Ubuntu Server` 和 `Ubuntu Core`（用于物联网）。支持多种架构，如
    `i386`、`IA-32`、`amd64`、`ARMhf` (`ARMv7 VFP3-D16`)、`ARM64`、`powerpc`（64 位）和 `s390x`。


    最初于 2004 年发布，每年发布两次：一次在四月，另一次在十月。版本号反映了发布时间：`18.04` 指 2018 年 4 月发布的版本。版本的代号基于一个形容词和一个动物，例如
    `Ubuntu 14.10` 的 `Utopic Unicorn`。


    ![](img/Image00003.gif)


    ### Linux Mint


    `Linux Mint` 旨在提供一种 Windows 用户会喜欢的更熟悉的桌面体验，并且开箱即用良好的硬件和多媒体支持。`Mint` 的 `Cinnamon
    Desktop` 版本因其与 Windows 环境的相似而深受粉丝喜爱，甚至支持相似的快捷键。由于其整体稳定性，这是一个我们可以放心推荐的发行版。


