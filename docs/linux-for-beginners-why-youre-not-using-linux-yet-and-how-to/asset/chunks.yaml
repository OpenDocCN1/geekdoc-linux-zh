    # 关于本书


    你是否曾经尝试过安装 Linux，结果却因系统崩溃而被迫，最终放弃并换回旧的 Windows 或 macOS？或者你是否对该选择哪种发行版、第一次使用终端感到无所措，或者仅仅无法执行在旧系统上就能完成的任务而感到困扰？


    > “你可能需要几周时间来适应 Linux 文件系统，对吧？错了。”


    Linux 正在变得越来越流行，Google、Facebook 和 IBM 等公司都在以各种形式使用 Linux。这归功于它卓越的隐私性、可靠性和安全性。财富商业预测预计，Linux
    市场将在未来 7 年内增长 402%，现在是开始学习 Linux 的最佳时机。所以，如果所谓的“Linux 学习曲线”阻碍了你的脚步，不要让它阻住你。我们称之为神话，因为在正确的循序渐进指导下，它恰如其名——一个神话。


    > “仅仅因为你是一个新手，并不意味着它应该是困难的。”


    本书的编写目的是引导你完成 Linux 环境中的第一步。如果你是一个完全的新手，或者需要复习 Linux，那么你选择了正确的书。在接下来的章节中，我们将详细介绍
    Linux 的多样性和历史，然后继续从零开始设置 Linux 系统。在这里，我们将一步步引导你完成设置和配置过程。


    我们将通过涵盖许多基础终端命令来详细介绍臭名昭彰的命令行。我们将讨论特定主题，例如选择发行版、添加图形用户界面、包管理、导航文件系统和目录、分区、软件选择以及使用帮助系统。


    我们还会查看保持 Linux 系统运行所需的管理和维护任务。这包括网络安全、用户和组管理、库操作、硬件和软件管理、日志文件解读，以及每个精通 Linux 用户应该知道的其他方面。


    对于书中的示例，我们使用 Debian Linux 发行版作为参考。然而，大多数解释适用于大多数发行版，特别是基于 Debian 的发行版，如 Ubuntu、Mint、Pop!
    和 Kali。Debian 仅仅是由于由于其出色的稳定性而使用并偏好的选择。我们非常欢迎你使用不同的 Linux 发行版。到本书结束，你将完成从头到 Linux
    设置和配置，并能够熟练地使用 Linux。


    # 1. 什么是 Linux？


    Linux 是基于 UNIX 原则的操作系统的内核名称。该名字源于其芬兰发明者 Linus Torvalds 的名字（Linus 的开头），并遵循了其他基于
    UNIX 系统的命名方法（最后一个字母是 x）。今天，Linux 由全球数以万的人开发和维护。


    操作系统的内核是它的心脏。它是计算机硬件与你用户之间进行通信的基础。操作系统是不同软件组件的集合：内核、各种工具以及配套的库。它是一种扩展计算机基础操作系统（即
    BIOS）的软件。


    ### 1.1 从 UNIX 到 Linux


    Linux 的历史可以追溯到 20 世纪 90 年代。要理解 Linux 背后的故事，我们还要简要回顾世界大战后的计算机早期。


    那时，计算机占据整个建筑，从机械元件向电子元件（如微处理器和多层电路）的转变正在进行。此外，在 20 世纪 60 年代和 70 年代，硬件和软件非常昂贵且不统一。存在各种特定厂商的平台，每个平台都有自己的接口、传输和交换协议以及操作系统。这些单机设备之间的通信需要特定的知识。开发
    UNIX 的目的是克服这些障碍，并扩大计算机的使用。


    #### UNIX


    1965 年初，多路信息处理服务（Multics）的开发开始。Multics 是麻省理工学院（MIT）、通用电气（GE）和贝尔实验室/AT&T 合作的结果。在开发者
    Ken Thompson 和 Dennis Ritchie 的领导下，他们开发的主要产品是 Unics。后来它被更名为 UNIX。UNIX 操作系统主要位于加利州大学伯克利分校。


    #### UNIX 变体


    UNIX 概念被许可给几家公司，他们开发并维护了自己的 UNIX 变体。这包括 Solaris/SUN OS（太阳物业，现由 Oracle 收购）、AIX（IBM）、Scenix（西门子）、SCO
    UNIX、Xenix（微软），以及 HP-UX（惠普）、NeXTSTEP、Mac OS（苹果）和 Android（谷歌）。


    开源实现包含了伯克利系统发行版（BSD）及其变体：NetBSD、OpenBSD 和 FreeBSD。今天，Linux 是开源开发者中最流行的免费软件。上述系统也有强有力的商业支持。


    #### UNIX 哲学


    UNIX 设计时遵循了几个严格的原则。这些原则涵盖了移植性、多任务和多用户导向，并结合了时间共享方法。此外，它基于 TCP/IP 方案的网络连接。


    '
- fmt: '

    The original development was done in the `C` programming language that resulted
    in independence from a hardware platform. Delivered with a selection of development
    tools and libraries, it allows you to easily extend it to your specific needs.
    It is simple but has a powerful ability to automate tasks that supports complex
    but maintainable scripts.


    Similar to a toolbox, UNIX consists of a variety of tools. Each of them having
    a specific purpose and being designed exactly for that task. The idea is to use
    one tool per task. To achieve more complex goals, you would combine several tools
    into a chain. The following example combines the two commands `ls` and `wc` employing
    a pipe to be able to count the number of Python files in the current directory.


    ```bash

    ls *.py | wc -l6

    ```


    We will explain these commands and their usage in more detail later on in the
    guide.


    ## 1.2 A Brief History of Linux


    Similar to UNIX, the Linux operating system has different roots and is based on
    the work of quite a few masterminds. Among others, this includes Richard M. Stallman,
    Andrew S. Tanenbaum, and Linus Torvalds.


    Richard M. Stallman, a hacker and developer at MIT, is the first president of
    the Free Software Foundation (FSF), and the father of the GNU project. GNU abbreviates
    the slogan `GNU is Not UNIX`. The goal of the project was to develop a free UNIX
    operating system. Until the beginning of the 1990s, a collection of tools was
    available but the kernel was still missing. The entire software was published
    under the GNU Public License (GPL) around 1983.


    The next step for Linux came from Andrew S. Tanenbaum. At that time he was a professor
    at the University of Amsterdam. For his students he developed `Minix`, an operating
    system for educational purposes to demonstrate and understand the UNIX principles.
    As he pointed out, `Minix` was not intended to be used in practice.


    Linus Torvalds, a Finish student at the University of Helsinki, was a user of
    `Minix` and quite unhappy with its boundaries. In 1990 he began to develop a new
    operating system based on the ideas of `Minix`, the UNIX principles, and the `POSIX`
    standard. His motivation was to have his own system that was understandable and
    maximized to the boundaries of the hardware. He also wanted to have fun and had
    no commercial intent in mind. The entire story behind Linux is described in his
    autobiographical book titled `Just for Fun`. Today, Linus Torvalds oversees the
    development of the Linux kernel.


    To make Linux attractive to the outside world it needed a nice logo. Based on
    a competition for mascots, a large number of proposals were handed in. Larry Ewing
    sent in his idea for a penguin as seen on the cover of this book, and his proposal
    won. Designed with a cheeky smile and a well-fed body, this penguin named `Tux`
    represents the image of a happy and satisfied user.


    ## 1.3 Linux Range of Use


    Originally designed for Intel-based systems, Linux runs on a variety of platforms
    today. Among others, this includes the ARM architectures (named `arm` and `arm64`),
    Motorola/Freescale''s 68k architecture (`m68k`), Intel x86 (`i386` and `amd64`),
    IBM s390 (`s390`), PowerPC (`powerpc`), and SPARC (`sparc`).


    Right from the beginning, Linux focused on server systems. It is widely used as
    a web server, file server, mail and news server, internet gateway, wireless router,
    and firewall. Used as a computing unit, it helped to render video sequences and
    entire films such as Titanic, Shrek, and Toy Story. Furthermore, Linux is in use
    in automotive products, astronautics, military, logistics, and the engineering
    environment. Since 2006, Linux servers run all the world''s stock exchanges. It
    also runs almost all internet search engines.


    Over the last decade Linux also conquered the desktop. Due to its high flexibility
    and stability, it works as a reliable setup for text processing, graphic design,
    desktop publishing, calculations in spreadsheets, communication (email, chat,
    audio, and video) as well as user interfaces for your phone and television.


    ## 1.4 Linux Certifications


    The widespread use of Linux has increased the demand for engineers and users who
    know exactly what they are doing. At this point a certification for Linux becomes
    advantageous. These certifications can be divided into programs that are general
    (not specific to a distribution) and focused (specific to a Linux distribution).
    The lists below give an overview of the primary certifications that currently
    exist.


    ### Non-specific Certifications


    - Linux Essentials

    - LPIC-1: Linux Server Professional Certification

    - LPIC-2: Linux Engineer

    - Linux Foundation Certified System Administrator (LFCS)

    - Linux Foundation Certified Engineer (LFCE)

    - CompTIA A+

    - CompTIA Network+


    ### Distribution-specific Certifications


    - RedHat Certified Engineer (RHCE)

    - RedHat Certified System Architect (RHCSA)

    - RedHat Certified Architect (RCA)

    - SUSE Certified Administrator (SCA)

    - SUSE Certified Engineer (SCE)

    - SUSE Enterprise Architect (SEA)


    # 2. Software Licenses


    As with most products available on the market, software is also packaged with
    a corresponding license. A software license describes the usage of the software
    and allows or limits its use. For commercial software, changes and copies are
    allowed within rather strict boundaries only. As an example, the license restricts
    you to use it for 5 users in parallel and requires you to obtain another license
    block to add a 6th or 7th user. Common licenses are Shared Source from Microsoft
    and the Apple License.


    For open-source software, licenses are much less restrictive. Changes and copies
    are explicitly allowed and are even desired in some cases to make improvements
    for a specific user and purpose. The goal is to keep the software available for
    everyone from now and into the future. This so-called Copyleft principle ensures
    that everyone has access to do adaptations if needed, and the restrictions on
    the use and redistribution of covered software are as minimal as possible. Common
    licenses that are in use for the single Linux components and its tools are the
    GNU Public License (GPL), BSD Licenses, and the Apache License.


    The licenses for open-source software follow several freedom rules:


    - To use the program for every purpose (right of unlimited use - freedom 0).

    - To understand how the program works and how to change it according to your needs
    (right to read the source code of the program - freedom 1).

    - To make copies of the software to help your neighbor (right of redistribution
    - freedom 2).

    - To improve the software and to publish your changes so that all other users
    can also benefit from your improvements (freedom 3).


    This ensures that the quality of available software constantly improves and everyone
    has access to these improvements. Using the `GPL`, the changes have to be published
    using the same license. Other open-source licenses like `BSD` do not have this
    strong requirement.


