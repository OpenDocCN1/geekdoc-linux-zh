    ### 16.3 Restricting Remote Access


    Linux has the ability to limit remote access to the system. The two files `/etc/hosts.allow`
    and `/etc/hosts.deny` regulate the access from other systems for TCP-based services.
    The limitation covers single hosts, IP addresses, and entire network segments.


    The file `/etc/hosts.allow` explicitly allows access, and `/etc/hosts.deny` forbids
    access. Because access rules in the file `/etc/hosts.allow` are applied first,
    they take precedence over rules specified in `/etc/hosts.deny`. Therefore, if
    access to a service is allowed in `/etc/hosts.allow`, a rule denying access to
    that same service in `/etc/hosts.deny` is ignored.


    The first example illustrates how to limit access via SSH for all devices that
    have a hostname ending in `example.net` :


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    sshd : .example.net

    ```


    The second example limits access for devices that have an IP address from the
    `192.168.30.*` subnet:


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    ALL : 192.168.30.*

    ```


    The third example shows how to allow access for all devices that have a hostname
    ending in `example.net` except `login.example.net` :


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    sshd : .example.net EXCEPT login.example.net

    ```


    Note that TCP wrapped services do not cache the rules from the host access files,
    so any changes to `/etc/hosts.allow` or `/etc/hosts.deny` will take effect immediately
    without restarting network services.


    ### 16.4 Unused Software


    Apart from ports and accounts, we must also have a look at the software that is
    installed on the system. As we mentioned earlier, when it comes to software, the
    less the better. The idea behind this rule is to keep your server lean and mean.
    Install only those packages that you really need. If there are unwanted packages
    that provide services that are not in use, remove them. The fewer packages installed,
    the less chance of unpatched code and security issues.


    Software packages that are left-overs can be identified using `deborphan`. The
    example below shows that `deborphan` discovered two packages, `iceweasel` and
    `netcat`. The first column displays the package size, followed by the package
    category (main/oldlibs), the package name, and then the package class (extra).


    ```

    # deborphan -szP     235 main/oldlibs           iceweasel           extra      32
    main/oldlibs           netcat           extra# |

    ```


    Packages that are no longer needed can be removed using the command below. This
    cleans the system from unused libraries and old dependencies that are left over.


    ```

    # apt-get autoremove

    ```


    Removing unused software helps a lot. It''s also important to keep the remaining
    packages up-to-date, which we discussed in Chapter 14.


    ### 16.5 Useful Network and System Commands


    #### `uname`


    `uname` abbreviates the term UNIX name. The command displays system information
    such as the exact name and version of the Linux kernel and the hostname of your
    computer.


    The example below shows the call of the `uname` command with the parameter `-a`
    (short for `--all`). The output contains the name of the operating system (Linux),
    the hostname (debian106), the kernel version and its build date (4.9.8-7-amd64
    #1 SMP Debian 4.9.110-1 (2018-07-05)) as well as the architecture of the system
    (x86_64).


    ```

    $ uname -aLinux debian106 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64
    GNU/Linux

    ```


