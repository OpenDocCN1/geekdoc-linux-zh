    *   A modular design.


    *   Backward and forward compatibility.


    To determine if a Debian system is booted via UEFI, check for the directory /sys/firmware/efi.
    If that directory exists, the system is running in UEFI mode. A system without
    UEFI will return the following:


    | $ ls /sys/firmware/efils: cannot access /sys/firmware/efi: No such file or directory$
    |


    MBR


    The Master Boot Record (MBR) is located in the first sector of the bootable disk.
    Typically, this is either /dev/hda or /dev/sda. It contains all information about
    the logical partitions on the disk. The MBR is less than 512 bytes in size and
    has the following three components:


    1.  Primary boot loader info in the first 446 bytes.


    2.  Partition table info in the next 64 bytes.


    3.  MBR validation check (signature) in the last two bytes.


    The MBR contains information about GRUB. So in simple terms, it loads and executes
    the GRUB boot loader. The contents of the MBR may be viewed by combining the two
    commands dd (disk dump) and hexdump from the coreutils package and bsdmainutils
    package in the following manner:


    | # dd if=/dev/sda bs=512 count=1 &#124; hexdump -C |


    In the above code dd reads the contents of the first SCSI disk /dev/sda, block
    by block as chunks of 512 bytes. The option count=1 limits this step to reading
    the first block only. Then the output of dd is piped to hexdump using the option
    -C . The output of hexdump is shown as ASCII characters. The example below illustrates
    this in more detail.


    ![](Image00050.gif)


    The dd command can also be used to create a backup of the MBR as shown below.
    The output file is mbr.bin and is specified using the option of=mbr.bin , where
    of abbreviates from output file .


    | # dd if=/dev/sda bs=512 count=1 of=mbr.bin1+0 records in1+0 records out512 bytes
    copied, 0.000371249 s, 1.4MB/s# file mbr.binmbr.bin: DOS/MBR boot sector# |


    GRUB


    The software that handles the Linux startup is called the Grand Unified Bootloader
    (GRUB), or GNU GRUB to be precise. Its function is to take over from the BIOS
    at boot time, load itself, load the Linux kernel into memory, and then turn over
    execution to the Linux kernel. Once the kernel takes over, GRUB has done its job
    and is no longer needed.


    Note that GRUB version 1 has been replaced by GRUB2, the former is now referred
    to as GRUB Legacy. For simplicity, GRUB2 is simply called GRUB.


    At boot time, GRUB displays a splash screen and presents a menu from which to
    start the system. The more Linux kernel images present on the system, the longer
    the list of entries. The image below shows the default installation with two menu
    entries. Unless stated otherwise, the first menu points to the default entry.


    ![](Image00037.gif)


    GRUB waits for a few seconds, then loads the kernel image selected from the menu.
    The first entry targets the default image specified in the GRUB configuration
    file /boot/grub2/grub.cfg. This configuration file is first generated during Linux
    installation and automatically regenerated whenever a new Linux kernel is installed.


    Linux Kernel


    In this step, the root filesystem is mounted as specified in the entry root= found
    in the GRUB configuration file. Then the kernel executes the /sbin/init program.
    The kernel uses a file called initrd , short for Initial RAM Disk, as a temporary
    root filesystem until the kernel is booted and the real root filesystem is mounted.
    It contains all necessary drivers to access hard drive partitions, filesystems,
    and other hardware components.


    8.2 Alternative Boot Loaders


    GRUB is not the only boot loader in the open-source world. Other boot loaders
    include:


    *   BURG - The name abbreviates to Brand-new Unified Loader from GRUB (a bit of
    a stretch to get the reverse naming of GRUB if you ask us). It is an offshoot
    of GRUB with much more room for individual configuration.


    *   SYSLINUX - A lightweight boot loader for networks and CD/DVD drives.


    *   ISOLINUX - A boot loader from the SYSLINUX project, which is generally used
    for Linux Live CDs and bootable install CDs.


    *   gummiboot - A boot loader for EFI-based computers with a text-mode interface.
    It is intended to be a minimal alternative to GNU GRUB that automatically detects
    bootable images (including Linux kernel images, operating systems, and other boot
    loaders), does not require a configuration file, provides a basic menu-based interface,
    and can also integrate with systemd to provide performance data.


    *   Libreboot - A lightweight system designed to perform only the minimum number
    of tasks necessary to load and run a modern 32-bit or 64-bit operating system.
    The image below shows the menu for Libreboot.


    *   rEFInd - A boot manager for EFI-based computers that features a GUI. rEFInd
    can be used to boot multiple operating systems, and it also provides a way to
    enter and explore the EFI pre-boot environment.


    ![](Image00051.jpg)


    8.3 Reviewing the Boot Process


    Linux generates a log file to enable a review of the boot process and to read
    its accompanying messages. Before Linux 8, the boot log was stored as a text file
    in /var/log/boot. Linux 8 introduced systemd and the format and location changed.
    To retrieve the boot log, use journalctl as follows (must be root):


    | # journalctl -b |


    Systemd stores log messages in a special format. journalctl reads the log and
    displays messages in chronological order. The earliest entry comes first and the
    entries can be scrolled back and forth using the arrow keys. The output consists
    of four columns: date (timestamp), hostname, message type kernel, and the message
    itself.'
