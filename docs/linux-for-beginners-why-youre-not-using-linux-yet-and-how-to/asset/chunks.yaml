    Building dependency tree\nReading state information… Done\nSuggested packages:\
    \      strace\nThe following NEW packages will be installed:\n      htop\n0 upgraded,\
    \ 1 newly installed, 0 to remove and 35 not updated.\nNeed to get 88.2 kB of archives.\n\
    After this operation, 224 kB of additional disk space will be used.\nGet:1 http:..ftp.us.debian.org/Debian\
    \ stratch/main amd64 htop amd64 2.0.2-1 [88.2 kB]\nFetched 88.2 kB in 1s (76.6\
    \ kB/s)\nSelecting previously unselected package htop. \n(Reading database … 82741\
    \ files and directories currently installed.)\nPreparing to unpack …/htop_2.0.2-1_amd64.deb\
    \ …\nUnpacking htop (2.0.2-1) …\nProcessing triggers for mime-support (3.60) …\n\
    Processing triggers for desktop-file-utils (0.23-1) …\nProcessing triggers for\
    \ man-db (2.7.6.1-2) …\nSetting up htop (2.0.2-1) …\n#\n```\n\n## 更新已安装软件包\n\n\
    更新已安装软件包非常简单，按照以下方法即可：首先，按照本章前面的介绍使用 `apt-get update` 更新软件包列表。然后运行 `apt-get install`\
    \ 来更新软件包。如果软件包有可用版本，将从软件包镜像获取新包，移除旧包并安装新包。\n\n## 移除已安装软件包\n\n移除已安装软件包的方法类似于安装或更新。`apt-get`\
    \ 命令具有移除软件包的选项，如下所示。\n\n```bash\n# apt-get remove htop\nReading package lists…\
    \ Done\nBuilding dependency tree\nReading state information… Done\nThe following\
    \ packages will be REMOVED:\n      htop\n0 upgraded, 0 newly installed, 1 to remove\
    \ and 35 not updated.\nAfter this operation, 224 kB of additional disk space will\
    \ be freed.\nDo you want to continue? [Y/n]\n(Reading database … 82751 files and\
    \ directories currently installed.)\nRemoving htop (2.0.2-1) …\nProcessing triggers\
    \ for mime-support (3.60) …\nProcessing triggers for desktop-file-utils (0.23-1)\
    \ …\nProcessing triggers for man-db (2.7.6.1-2) …\n#\n```\n\n此步骤会移除软件包的所有内容，保留配置文件。要彻底移除软件包及其配置文件，请按如下所示添加\
    \ `--purge` 参数：\n\n```bash\n# apt-get remove --purge htop\n#\n```\n\n## 寻找 Linux\
    \ 替代方案\n\n你可能会发现某些程序与 Linux 不兼容，且仅为 Windows 或 macOS 创建。然而，Linux 的伟大之处在于，对于每一个\
    \ Windows 或 macOS 应用，几乎总有一个 Linux 替代方案。以下是寻找 Linux 专用应用的两个优秀资源。\n\n*   [`www.linuxalt.com/`](https://www.linuxalt.com/)\n\
    *   [`linuxappfinder.com/alternatives`](https://linuxappfinder.com/alternatives)\n\
    \n# 15 进程管理\n\n理解程序的执行对于成为一名优秀的系统管理员至关重要，对普通用户也很有用。在本章中，我们将更详细地查看进程，以及如何处理和操作进程。\n\
    \n程序的运行实例被称为“进程”。它由程序指令、从文件中读取的数据以及其他程序或系统用户的输入组成。每个进程都会被分配一个进程 ID（`PID`），允许系统跟踪所有进程。系统启动过程有一个\
    \ `PID` 0，然后初始进程具有 `PID` 1，并按顺序此类推。初始进程 `PID` 1 在较旧的 Linux 系统上是指 `/sbin/initd`，在现代\
    \ Linux 系统上是指 `/sbin/systemd`。\n\n### 15.1 进程相关操作\n\n### ps 和 pstree\n\n要列出所有运行中的进程，请使用\
    \ `ps` 命令或 `pstree` 命令。\n\n```bash\n# ps\nPID     TTY             TIME       \
    \    CMD\n628     pts/0           00:00:00        su\n629     pts/0          \
    \ 00:00:00        bash\n2507    pts/0           00:00:00        ps\n#\n```\n\n\
    上述 `ps` 的输出包含四列，内容如下：\n\n*   `PID`: 进程 ID。\n*   `TTY`: 调用命令的终端。\n*   `TIME`: 进程运行的时间。\n\
    *   `CMD`: 调用的命令。\n\n可以使用以下开关来获取额外信息：\n\n*   `-e`: 显示所有进程。\n*   `-p`: 显示指定进程的信息。\n\
    *   `-C`: 显示指定的命令。\n*   `-u`: 显示属于该用户名的进程。\n\n```bash\n# ps -u\nPID     TTY  \
    \           TIME           CMD\n628     pts/0           00:00:00        su\n629\
    \     pts/0           00:00:00        bash\n2507    pts/0           00:00:00 \
    \       ps\n```\n\n`pstree` 命令与 `ps` 类似，但它以树的形式显示进程。一个实用的开关是 `-p`，它可以将进程 ID 添加到名称中。\n\
    \n### pidof\n\n`pidof` 命令简单显示指定进程的 ID。\n\n```bash\n# pidof\n```\n\n### pgrep\n\
    \n`pgrep` 是用于进程的 `grep` 命令。该命令遍历当前运行的进程并输出匹配模式的进程 ID。下面的示例显示了两次调用。第一次调用请求 `pgrep`\
    \ 搜索名称包含字符串 `term` 的进程并仅输出进程 ID。第二次调用使用选项 `-l`（`--list-name` 的缩写）和 `-a`（`--full`\
    \ 的缩写）来显示进程 ID 和对应的名称。\n\n```bash\n# pgrep term\npgrep -la term\n```\n\n### top\n\
    \n`top` 命令根据活跃程度显示进程。最活跃的进程位于顶部，列表每秒更新一次。单列包含进程 ID (`PID`）、所有者用户名 (`USER`）、进程优先级\
    \ (`PR`）、nice 值 (`NI`）、虚拟内存使用 (`VIRT`）、预留内存 (`RES`）、共享内存 (`SHR`）、CPU 和内存使用百分比（`%CPU`,\
    \ `%MEM`）、进程运行时间（`TIME+`）以及用于调用进程的命令（`COMMAND`）。\n\n### htop\n\n`htop` 是一个额外的软件包（请参考第\
    \ 4 章和第 14 章关于安装额外软件包的内容），包含一个具交互性的 `top` 版本。列布局与 `top` 类似。使用导航和功能键选择、排序或删除进程。功能键如下：\n\
    \n*   `F1`: 显示帮助。\n*   `F2`: 配置 `htop`。\n*   `F3`: 在进程列表中搜索。\n*   `F4`: 过滤终端输出。\n\
    *   `F5`: 以进程树的形式显示进程。\n*   `F6`: 更改进程排序顺序。\n*   `F7`: 降低选中进程的 nice 值。\n*   `F8`:\
    \ 增加选中进程的 nice 值。\n*   `F9`: 终止选中进程。\n*   `F10`: 退出程序。\n\n### 15.2 前台和后台进程\n\n\
    进程有两种类型：前台进程和后台进程。前台进程通过终端会话初始化并控制。也就是说，必须有用户连接到系统启动这些进程，且进程在执行期间会占用终端。相反，后台进程不连接到终端，也不显式需要任何用户输入。因此，它们在等待完成时不占用终端，并允许你运行多个进程。\n\
    \n可以使用 `&` 符号在后台初始化进程。\n\n```bash\n$ process1 &\n```\n\n"
