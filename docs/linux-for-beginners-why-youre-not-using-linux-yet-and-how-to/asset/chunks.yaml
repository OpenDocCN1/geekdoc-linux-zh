    # 13. Working with Links


    Links are not unique to Linux but are a slightly different concept if you come
    from a Windows-based system. Links are useful when you require a file to be in
    more than one place at the same time. Such as having a file in your downloads
    folder and in your music folder, without having to create a copy which takes up
    space.


    If you keep large archives of the same photos or videos in different locations
    (which many photographers and videographers tend to do) using links can potentially
    save you gigabytes of space. There are two types of links in a Linux filesystem:
    hard links and soft links. We will explain both of them in more detail next.


    13.1 Hard Links


    Hard links allow for greater flexibility when organizing your files. For instance,
    you could have your music organized per artist in one location and per genre in
    another location, without having more than one physical copy on your system.


    A hard link links a filename to the place on the drive where the file is stored
    (reference to an inode). It is merely an additional name for an existing file.
    Each file can have more than one hard link, but it must have at least one. If
    no links to the file exist, the file is deleted and the space on the drive is
    freed up for other files. However, the data in the file is still there and can
    be recovered as long as it is not written over.


    Every filename on the system is a hard link. Hard links cannot point to directories,
    soft links, characters or block devices, pipes or sockets. If more than one hard
    link points to a file, they must be on the same filesystem. To create a link Linux
    utilizes two commands: link and ln . The link command is used solely for hard
    links. It calls the link() system function and does not perform error checking
    when attempting to create the link. In contrast, ln has error checking and can
    create both hard and soft links.


    The command below creates three hard links named link1 , link2, and link3 to the
    file test . The touch command is used to update the access date or modification
    date of a file and works in two ways: if the file already exists, the timestamp
    for access and modification of the file is set to the current timestamp. In case
    the file does not exist yet, an empty file will be created that has the current
    timestamp.


    | $ touch test$ ln test link1$ ln test link2$ ln test link3$ |


    The output of ls -i shows two columns: the inode number and the filename (-i is
    short for -inode). You can see that the inode number is the same for the four
    files, and link1, link2, link3, and test point to the same inode.


    | $ ls -i test link*260930 link1260930 link2260930 link3260930 test$ |


    Furthermore, the stat command gives more detailed information about this entry.


    | $ touch test$ ln test link1$ ln test link2$ ln test link3$ stat test     File:
    test     Size: 0          Blocks: 0          IO Block: 4096 regular empty fileDevice:
    808h/2056d          Inode: 260930          Links: 4Access: (0644/-rw-r--r--)         
    Uid: (1000/user)          Gid: (1000/user)Access: 2020-09-19 16:51:10.033912519
    +0200Modify: 2020-09-19 16:51:10.033912519 +0200Change: 2020-09-19 16:51:19.245900960
    +0200Birth: -$ |


    13.2 Soft Links


    A soft link, also named a symbolic link , is a link to another filename in the
    filesystem. It is much like a shortcut on a Windows-based system. Unlike a hard
    link, a symbolic link does not contain the data in the target file, it simply
    points to another entry somewhere in the filesystem. This difference gives symbolic
    links certain qualities that hard links do not have, such as the ability to link
    to directories, characters, block devices, or to files on remote computers networked
    through NFS.


    To create a soft link in Linux, we will use the same ln command but with the -s
    option. -s is short for --symbolic .


    | $ touch test$ ln -s test softlink1$ ln -s test softlink2$ ln -s test soft link3$
    |


    Again, the output of ls -i shows two columns: the inode number and the filename.
    You will see that the inode number is different for the four files, and softlink1,
    softlink2, softlink3, and test point to different inodes.


    | $ ls -i test softlink*260931 softlink1260932 softlink2260933 softlink3260930
    test$ |


    If you invoke the ls command with the option -l (for long format) the output is
    as shown below. The left-most column starts with an l for link, and the right-most
    column shows the name of the file the soft link points to.


    | $ ls -l softlink*lrwxrwxrwx 1 user user 4 Sep 15 14:05 softlink1 -> testlrwxrwxrwx
    1 user user 4 Sep 15 14:05 softlink2 -> testlrwxrwxrwx 1 user user 4 Sep 15 14:05
    softlink3 -> test$ |


    13.3 Practical Example


    In this example, we will look at how to connect two files using hard links, and
    how to unlink them again. First, we create a file named file1 using echo and redirect
    the output. echo is a built-in shell command and is intended to output text. The
    command also prints the values of variables.


    | $ echo "This is File One" > file1$ cat file1This is File One$ |


    Next, link file2 to file1 and output the contents of file2 to stdout .


    | $ link file1 file2$ cat file2This is File One$ |


    Now they are both the same file. Let''s make a change to file2 and see what happens.


    | $ echo "This is line Two" >> file2$ cat file1This is File OneThis is line Two$
    |


    As you can see from the example below, file1 and file2 are both treated as the
    same file.


    | $ ls -ltotal 0$ echo "This is File One" > file1$ cat file1This is File One$
    link file1 file2$ lsfile1 file2$ cat file2This is File One$ echo "This is line
    Two" >> file2$ cat file2This is File OneThis is line Two$ cat file1This is File
    OneThis is line Two |


    Unlinking file1 deletes the hard link to file1 but file2 is still there and the
    file will not be deleted.


    | $ unlink file1$ lsfile2$ |'
