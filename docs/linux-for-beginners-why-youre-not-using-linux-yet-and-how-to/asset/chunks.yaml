    today. Among others, this includes the ARM architectures (named arm and arm64),
    Motorola/Freescale''s 68k architecture (m68k), Intel x86 (i386 and amd64), IBM
    s390 (s390), PowerPC (powerpc), and SPARC (sparc).


    Right from the beginning, Linux focused on server systems. It is widely used as
    a web server, file server, mail and news server, internet gateway, wireless router,
    and firewall. Used as a computing unit, it helped to render video sequences and
