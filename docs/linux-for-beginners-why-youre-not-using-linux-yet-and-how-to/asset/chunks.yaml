    11.1 Types of Commonly Used Filesystems


    A number of filesystems are quite popular and widely used. This includes FAT,
    ext2, ext3, ext4, JFS, XFS, ZFS, ReiserFS, and SWAP. Let''s look at each of these
    in more detail.


    File Allocation Table (FAT)


    FAT was introduced in 1977 for floppy disks and then used for hard disks through
    the DOS and Microsoft Windows 9X era. It is supported by nearly all operating
    systems to date and is useful as a data transfer medium between different systems.
    It is commonly used on external media such as USB drives. The original FAT system
    was only an 8-bit system with a maximum file size of 8MB, supporting 6:3 filenames
    and no subdirectories. There are 3 main variants of FAT:


    *   FAT12 - 12-bit File Allocation Table. Supports maximum volume sizes of 16MB
    with 4KB clusters or 32MB with 8KB clusters.


    *   FAT16 - 16-bit File Allocation Table. Supports maximum volume sizes of 2GB
    with 32KB clusters or 4GB with 64KB clusters. Filenames must be in the 8:3 format
    with OEM characters or 256 UCS characters.


    *   FAT32 - Supports a maximum file size of 2TB with 512B sectors, 8TB with 2KB
    sectors and 32K clusters, or 16TB with 4KB sectors and 64K clusters. Filenames
    must be in the 8:3 format with OEM characters or 256 UCS characters.


    Second Extended File System (ext2)


    This was the first consumer-grade filesystem for Linux and was the default filesystem
    for Linux distributions such as RedHat and Debian until ext3 became mainstream
    in 2001\. Today, it is still in use on storage devices like digital memory cards,
    where the journaling functionality of ext3 or ext4 is not needed. This increases
    performance and minimizes the number of writes.


    Third Extended File System (ext3)


    Ext3 is a journaled version of ext2 and can be upgraded directly from ext2 without
    the need for backup and restore operations. Ext3 is not as fast as ext4, JFS,
    XFS, or ReiserFS but it uses less CPU power than ReiserFS or XFS. Ext3 supports
    files up to 16GB and filesystems up to 32TiB in size.


    Fourth Extended File System (ext4)


    Ext4 is an extension of ext3 with extra features such as large filesystem support.
    It supports files up to 16TiB and filesystems up to 1EiB in size. Furthermore,
    it features extents . An extent is a contiguous range of blocks which makes handling
    very large files more efficient.


    Journaled File System (JFS)


    JFS was originally developed for IBM''s AIX Unix operating system and later ported
    to OS/2\. JFS is a fully 64bit filesystem that uses extents, supports unlimited
    small files, and large files up to 4 PB. It is ideal for extremely large filesystems.


    XFS


    XFS is a journaling filesystem developed by Silicon Graphics (SGI) in 1993 for
    the IRIX operating system. It subdivides physical volumes into allocations allowing
    more efficient parallel I/O and filesystem bandwidth, and supports large files
    up to 8EiB.


