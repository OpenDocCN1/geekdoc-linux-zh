    Mint is a non-commercial distribution that is based on `Ubuntu` and follows the
    same release scheme. The initial publication dates back to the year 2006. As of
    2014, there have been two releases per year following the release from `Ubuntu`
    by one month. The code name for the release is a female name that ends with a
    a, such as `Felicia` for version 6. Linux Mint supports the two architectures
    `IA-32` and `amd64`.


    ![](Image00004.gif)


    # Red Hat Enterprise Linux (RHEL)


    RHEL is a commercial Linux distribution. It is based on the combination of Red
    Hat Linux (available between 1995 and 2004) plus `Fedora` 19 and 20. Its original
    release dates back to the year 2000. Its focus on business customers includes
    long-term support, training, and a certification program (see Chapter 1). Red
    Hat''s community community project is called `Fedora` (see below).


    The packages are made available in `.rpm` format (Red Hat Package Manager). RHEL
    supports the architectures `arm` (64 bit), `i386`, `amd64`, `powerpc`, as well
    as `s390` and `zSeries`. The distribution targets both servers and desktops. The
    code name for the release appears to be random, as it does not follow a similar
    scheme as used for `Debian` or `Ubuntu`.


    ![](Image00005.gif)


    # Fedora


    Fedora is a community Linux distribution aimed mainly at desktop users. It is
    based on Red Hat Enterprise Linux (`RHEL`) and sponsored by Red Hat. It was launched
    in 2003 at the time the support for Red Hat Linux ended. As of 2020, it is available
    in the following versions:


    *   Workstation: for `pc`.

    *   Server: for servers.

    *   IoT: for IoT ecosystems.


    Fedora supports the architectures `amd64`, `armhf`, `powerpc`, `MIPS`, `s390`,
    and `RISC-V`. The distribution has a rather short lifecycle where a new release
    follows roughly every 6 months. The code name for a release does not follow a
    fixed naming scheme but mostly consists of city names.


    ![](Image00006.gif)


    # CentOS


    CentOS abbreviates from the name Community Enterprise Operating System. As with
    Fedora it is based on Red Hat Enterprise Linux and is compatible in terms of the
    binary packages. This allows the use of software on CentOS that is initially offered
    and developed with `RHEL` in mind. In contrast to Fedora, it focuses on enterprise
    use for both desktops and servers, with long-term support. The initial release
    of CentOS goes back to May 2004. The software packages come from three different
    repositories:


    *   Base: regular, stable packages.

    *   Updates: security, bug fix, or enhancement updates.

    *   Addons: packages required for building the larger packages that make up the
    main CentOS distribution, but are not provided upstream.


    CentOS is available for the architectures `i386` and `amd64`. Other architectures
    are not supported.


    ![](Image00007.gif)


    # openSUSE


    The Linux distribution openSUSE has its roots in the distributions `SUSE Linux`
    and the commercial `SUSE Linux Professional` that saw its first release in 1994.
    The name `SUSE` is an abbreviation for the original German owner `Gesellschaft
    für Software- und Systementwicklung GmbH`.


    OpenSUSE is based on the structures of Red Hat Linux and `Slackware`, and uses
    `.rpm` as a software archive format. It is available for the architectures `i586`,
    `x86-64`, and `ARM`. The openSUSE project aims to release a new version every
    eight months. As with Fedora, the code names for a release do not follow a fixed
    naming scheme.


    ![](Image00008.gif)


    # Arch Linux


    Arch Linux is a free Linux distribution that saw its first release in 2002. It
    follows the principle of a rolling release, which results in monthly updates of
    the distribution. Currently, the core team consists of about 25 developers and
    is supported by many other developers, called trusted users. Arch Linux uses `Pacman`
    as a package management system. The single packages are held in four software
    repositories:


    *   Core: packages for the basic system.

    *   Extra: additional packages like desktop environments and databases.

    *   Community: packages that are maintained by trusted users.

    *   Multilib: packages that can be used on several architectures.


    Arch Linux supports the `amd64` architecture. The early releases up to 2007 had
    code names that do not follow a specific scheme, with recent releases following
    a standard numbering format.


    ![](Image00009.gif)


    # Gentoo


    As with Arch Linux, Gentoo follows the principle of a rolling release. New installation
    images are available weekly, with the first release available in 2002. Gentoo
    is special due to being a source code-based distribution. Before installing the
    software, it has to be compiled first. Supported architectures are `alpha`, `amd64`,
    `arm`, `hppa`, `IA-64`, `m68k`, `MIPS`, `powerpc`, `s390`, `sh`, and `sparc`.


    ![](Image00010.gif)


    # Slackware


    Slackware is the oldest active Linux distribution. The first release dates back
    to 1992. Regular releases are available without a fixed interval. It targets professional
    users and gives them as much freedom as possible. Slackware uses compressed `.tar.gz`
    archives as a package format and supports the four architectures `i486`, `alpha`,
    `sparc`, and `arm`. The distribution was also ported to architecture `s390`.


    # 4. Setting up a Linux System


    As mentioned in the previous chapter, we will be using `Debian` for our demonstrations.
    To recap, `Debian` is a distribution that provides great stability and scales
    up exceptionally well once your skills and knowledge progress past the beginner
    stages. In this chapter we will install and configure `Debian`, showing you every
    single step along the way.


    ## 4.1 Types of Installations


    Debian offers a variety of methods for a proper setup. This includes a graphical
    and a text-based installation; we will use the former. For installation media
    the Debian developers offer three variants:


    *   A CD or DVD for 32-bit and 64-bit.

    *   A network image for 32-bit and 64-bit (a so-called `Netinst-ISO`).

    *   A mini-CD for 32-bit or 64-bit.


    We also have test media available. These include live images for 32-bit and 64-bit,
    and allow you to try Debian before installing it on your computer. During the
    time of writing this guide, version 10 is the current stable release of Debian.
    The setup described here is based on this release and the `amd64` architecture.


    After downloading the network image from [www.debian.org/distrib](http://www.debian.org/distrib)
    no further static images are required. Instead, it depends on your internet connection
    to retrieve the packages to be installed and keep your operating system up-to-date.


    The entire process will take you about an hour and it allows you to have a lean
    software selection based on your specific needs. Software packages that you do
    not use will not be available on your system. They can however be added whenever
    you feel the need.


    The target system of our installation is an `XFCE`-based desktop system for a
    single user with a web browser and a music player. For the web browser we use
    `Mozilla Firefox` and for the music player, `VLC`. Both programs are a permanent
    component of the Linux distribution. The environment we use for demonstration
    purposes is a virtual machine based on `VirtualBox` with 4 GB of RAM and 8 GB
    of disc space.


    ## 4.2 Installing Linux Step-by-Step


    ### Boot Menu


    To begin with the installation of Debian, first boot the computer (in our case
    the `VirtualBox` image) from the ISO image you have downloaded. If you are also
    using a virtual machine, see your virtual machine vendor website for help on how
    to enable the ISO image. Next, wait for the boot menu to appear on the screen.
    The image below shows you the different options that are offered. Using the cursor
    keys, you can navigate the boot menu and the Enter key selects an entry.


    ![](Image00011.gif)


    The different options are:


    *   Graphical install: start the installation process using a graphical installer.

    *   Install: starting the installation process using a text-based installer.

    *   Advanced options: select further options like Expert mode, Automated install,
    or Rescue mode (see image below for more details).

