- fmt: '

    Debian uses the package manager `apt` to handle the installation, the update,
    and the removal of software packages and the related package lists. Also, `apt`
    resolves all the package dependencies and ensures that the relevant software is
    available on the system. In our case, roughly 170 MB of data has to be retrieved
    from the package mirror and installed. As pointed out earlier, this requires a
    working internet connection to download the needed software packages.


    To install the three packages, type in the following commands at the command-line
    prompt. Just type the command after the `#` symbol:


    ```bash

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` will display further information regarding the packages to be installed.
    This includes the list of depending packages and recommended packages. At the
    end, you will see a command-line prompt. Type `Y` or press `Enter` to install
    `Aptitude`, `xdm`, and `xfce4` as well as the depending packages. For the `xdm`
    display manager, two dialog boxes have to be confirmed. Press `Enter` on both
    to confirm the use of `xdm`.


    The retrieval of the software packages to be installed takes a while. When finished,
    the command-line prompt will appear again. To activate the changes regarding the
    graphical desktop environment, restart the system. Type the command `reboot` at
    the command-line prompt as follows:


    ```bash

    root@debian106 ~# reboot

    ```


    Having restarted the Linux system, Debian welcomes us with a graphical boot screen
    (see below). Press `Enter` to start the Linux system with the default settings.


    ![](Image00037.gif)


    A few seconds later a graphical login screen will be visible. Log in to the system
    with the regular user named `user` as created earlier. Type in `user`, press `Enter`
    and type in the password for the user. Then, press `Enter` again to confirm and
    log in.


    Next, the `XFCE` desktop will be visible (see below). The desktop comes with several
    default elements: an upper navigation bar, a lower navigation bar, and desktop
    icons. These elements are explained in more detail below.


    ![](Image00038.gif)


    ### Upper Navigation Bar

    The upper navigation bar contains several elements: the application menu, the
    clock, the system tray, and the power menu. These elements allow you to manage
    your applications and system settings.


    ### Lower Navigation Bar

    The lower navigation bar (or taskbar) shows currently open windows and provides
    buttons to switch between them. It also contains application launchers.


    ### Desktop Icons

    The desktop icons are shortcuts to folders, files, or applications. These elements
    provide quick access to frequently used items.


    ## 4.4 Adding Packages


    To use Linux properly, you also have to learn how to add packages. Below you will
    see how to use the `apt` and `apt-get` commands.


    The easiest way to add packages is through the graphical interface, but the command
    line is often more powerful and flexible.


    ### Using `apt-get`

    To use the `apt-get` command to install a package, the syntax is:

    ```bash

    sudo apt-get install <package_name>

    ```

    For example, to install `aptitude`, `xdm`, and `xfce4`, you would use the:


    ```bash

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    The output shows the installation with a white background and a bigger font.


    ### Using `apt`

    The `apt` command is a newer alternative to `apt-get`. It is more user-friendly
    and provides better progress bars. To install a package, use:

    ```bash

    sudo apt install <package_name>

    ```

    For example, to install `aptitude`, you would use:


    ```bash

    root@debian106 ~# apt install aptitude

    ```


    The output shows the installation with a white background and a bigger font.


    ### Updating and Removing Packages

    To update the list of available packages, use:

    ```bash

    sudo apt update

    ```

    To upgrade all installed packages to their latest versions, use:

    ```bash

    sudo apt upgrade

    ```

    To remove a package, use:

    ```bash

    sudo apt remove <package_name>

    ```


    ## 4.5 Exiting Linux


    To use Linux, you also have to learn how to exit Linux and to reboot the system.
    We will see two methods, the first is based on the graphical interface and the
    second can be used on non-graphical systems like servers.


    ### Quitting the XFCE Desktop Environment

    The easiest way to quit the XFCE desktop and log out from your current session
    is to click on the button in the right corner of the upper navigation bar. The
    button is labeled with your username, which in our case is `user`. From the small
    menu select the last item labeled `Log Out`. Alternatively, you can choose the
    item `Log Out` from the Application button in the upper-left corner.


    ![](Image0039.gif)


    ### Shutting Down the Linux System

    The way to shut down the entire Linux system is similar to exiting XFCE. Click
    on the button in the right corner of the upper navigation bar and select the `Shutdown`
    . From the dialog window click on the button labeled `Shutdown` to stop the Linux
    system.


    From a terminal session, you can use the commands `halt` or `shutdown -h`.


    ```bash

    # halt

    ```


    ### Rebooting the Linux System

    To restart the Linux system, click on the button in the right corner of the upper
    navigation bar and select the item `Restart`. From the dialog window click on
    the button labeled `Restart` to reboot the Linux system.


    From a terminal session, you can use the command `reboot`.


    ```bash

    # reboot

    ```


    ![](Image0040.gif)

    ```'
