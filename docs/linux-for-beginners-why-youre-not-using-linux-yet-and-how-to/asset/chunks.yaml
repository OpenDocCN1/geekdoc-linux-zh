    启动计算机时，会运行 `BIOS` 或 `UEFI`。该软件由计算机主板上特定厂商的固件内存芯片提供，专门针对该主板定制。`BIOS` 或 `UEFI` 首先执行一些系统完整性检查。然后，它按照预先的顺序搜索硬盘、CD/DVD
    驱动器、USB 驱动器和网络，并启动找到的第一个引导程序。该引导程序随后被加载到内存中并接管系统。简单来说，`BIOS` 或 `UEFI` 加载并执行了引导程序。


    在启动时，通常有一个选项允许 `F1`、`F2`、`F12`、`Escape` 或 `Delete` 进入 `BIOS` 或 `UEFI` 菜单。在这里可以更改引导程序的搜索顺序。做出更改后，通常按
    `F10` 键保存更改并使用新设置重启系统。在大多数现代系统中，`BIOS` 已不再被使用，而是被 `UEFI BIOS` 取代。`UEFI BIOS` 由统一
    EFI 论坛（Unified EFI Forum）维护。Debian 对 `UEFI` 的支持是默认设置的一部分。


    与 `BIOS` 相比，`UEFI` 具有以下优势：


    * 使用 GUID 分区表 (`GPT`) 使用大容量磁盘（超过 2 TB）的能力。

    * 独立 CPU 的架构。

    * 独立 CPU 的驱动程序。

    * 包含网络能力的灵活预操作系统环境。

    * 模块化设计。

    * 向后和向前兼容性。


    要确定 Debian 系统是否通过 `UEFI` 启动，请检查目录 `/sys/firmware/efi`。如果该目录存在，则系统运行在 `UEFI` 模式。没有
    `UEFI` 的系统将返回以下内容：


    | $ ls /sys/firmware/efils: cannot access /sys/firmware/efi: No such file or directory$
    |


    ## MBR


    主引导记录 (`MBR`) 位于可引导磁盘的扇区。通常，这是 `/dev/hda` 或 `/dev/sda`。它包含了关于磁盘逻辑分区的所有信息。`MBR`
    的大小小于 512 字节，包含以下三个部分：


    1. 前 446 字节中的主引导程序信息。

    2. 接下来的 64 字节中的分区表信息。

    3. 最后两个字节中的 `MBR` 验证检查（签名）。


    `MBR` 包含了关于 `GRUB` 的信息。简单来说，它加载并执行 `GRUB` 引导程序。可以通过以下方式结合 `coreutils` 包和 `bsdmainutils`
    包中的 `dd`（磁盘转储）和 `hexdump` 命令查看 `MBR` 的内容：


    ```

    # dd if=/dev/sda bs=512 count=1 | hexdump -C

    ```


    在上述代码中，`dd` 以 512 字节为块为单位，逐块读取第一个 SCSI 磁盘 `/dev/sda` 的内容。`count=1` 选项将此步骤限制为仅读取第一个块。然后，`dd`
    的输出通过 `-C` 选项传递给 `hexdump`。`hexdump` 的输出以 ASCII 字符显示。下面的示例更详细说明了这一点。


    ![](img/Image00050.gif)


    `dd` 命令也可以用于创建 `MBR` 的备份，如下所示。输出文件为 `mbr.bin`，使用 `of=mbr.bin` 选项指定，其中 `of` 是 output
    file（输出文件）。


    ```

    # dd if=/dev/sda bs=512 count=1 of=mbr.bin

    1+0 records in1+0 records out512 bytes copied, 0.000371249 s, 1.4MB/s

    # file mbr.bin

    mbr.bin: DOS/MBR boot sector

    ```


    ## GRUB


    处理 Linux 启动的软件称为全局统一引导程序 (`GRUB`)，确切说是 `GNU GRUB`。它的功能是在启动时从 `BIOS` 手接管，加载自身，将
    Linux 内核加载到内存中，然后将执行权交给 Linux 内核。一旦内核接管，`GRUB` 就完成了它的工作，不再需要。


    注意，`GRUB` 版本 1 已被 `GRUB2` 代替，前者被称为 `GRUB Legacy`。为了简单起见，`GRUB2` 简称为 `GRUB`。


    在启动时，`GRUB` 显示启动界面并提供一个用于启动启动的菜单。系统中存在的 Linux 内核镜像越多，条目列表越长。下面的图片显示了带有两个菜单条目的默认安装。除非另有说明，第一个菜单指向默认条目。


    ![](img/Image00037.gif)


    `GRUB` 等待几秒，然后加载从菜单中选择的内核镜像。第一个条目指向 `GRUB` 配置文件 `/boot/grub2/grub.cfg` 中指定的默认镜像。该配置文件在
    Linux 安装期间生成，并在每当安装新的 Linux 内核时自动重新生成。


    ### Linux 内核


    在这一步中，根文件系统根据 `GRUB` 配置文件中 `root=` 条目指定的进行挂载。然后内核执行 `/sbin/init` 程序。内核使用名为 `initrd`（Initial
    RAM Disk 的缩写）的文件作为临时根文件系统，直到内核启动并挂载真正的根文件系统。它包含了访问硬盘分区、文件系统和其他硬件组件所需的所有驱动程序。


    ## 8.2 备用引导程序


    `GRUB` 并不是开源世界中唯一的引导程序。其他引导程序包括：


    * `BURG` - 名字缩写自 `GRUB` 的 Brand-new Unified Loader（全新的统一引导程序，如果你问我们的话，反过来给 GRUB
    起名有点牵强）。它是 `GRUB` 的一个分支，具有更大的个性化配置空间。

    * `SYSLINUX` - 用于网络和 CD/DVD 驱动器的轻量级引导程序。

    * `ISOLINUX` - 来自 `SYSLINUX` 项目的引导程序，通常用于 Linux Live CD 和可引导安装 CD。

    * `gummiboot` - 用于具有文本模式界面的 EFI 计算机引导程序。它旨在作为 GNU `GRUB` 的极简替代方案，可以检测到的镜像（包括 Linux
    内核镜像、操作系统和其他引导程序），不需要配置文件，提供基本的基于菜单的界面，还可以与 `systemd` 集以提供性能数据。

    * `Libreboot` - 一种轻量级系统，仅执行加载和运行现代 32 位或 64 位操作系统所需的最少任务。下面的图片显示了 `Libreboot`
    的菜单。

    * `rEFInd` - 一种带有 GUI 的 EFI 计算机引导管理器。`rEFInd` 可用于启动多个操作系统，并提供了一种进入和探索 EFI 预启动环境的方法。


    ![](img/Image00051.jpg)


    ## 8.3 查看启动过程


    Linux 生成一个日志文件以便审查启动过程并读取其随附的消息。在 Linux 8 之前，启动日志以文本文件形式存储在 `/var/log/boot`。Linux
    8 引入了 `systemd`，格式和位置发生了变化。要检索启动日志，请如下所示使用 `journalctl`（必须是 root 权限）：


    ```

    # journalctl -b

    ```


    `systemd` 以特殊格式存储日志消息。`journalctl` 读取日志并按时间顺序显示消息。最早的条目在前，可以使用箭头键来回滚动条目。输出包含四列：日期（时间戳）、主机名、消息类型（内核）以及消息本身。


