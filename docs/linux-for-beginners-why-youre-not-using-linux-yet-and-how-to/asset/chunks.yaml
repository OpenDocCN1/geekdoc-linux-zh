    # 10. User and Group Management


    10.1 Storage of User and Group Data


    Linux is a multi-user operating system, which means multiple users can have access
    to the system at the same time. For the system to manage these different users
    and groups, it stores this data in several configuration files:


    *   /etc/passwd - user data.


    *   /etc/shadow - encrypted user passwords.


    *   /etc/group - group data.


    *   /etc/gshadow - encrypted group passwords.


    These files are text-based databases and have a defined structure. Below we will
    look at each of them in more detail. The contents of these files can be changed
    using a text editor, or with the commands passwd , chage , chfn , chsh and usermod
    .


    /etc/passwd


    This file contains all user attributes except the password. Each line consists
    of seven columns, and the columns are separated by a colon (:). The attributes
    are the username, the password, the user ID, the group ID, the GECOS field, the
    user''s home directory, and the user''s login shell.


    The first attribute username refers to the UNIX username and it must be unique
    to the system. The password field only contains an x. The value of the password
    itself has moved to /etc/shadow (see next section) and the attribute is only kept
    for backward compatibility. UID refers to the User ID, and the range of the unique
    numeric value can be between 0 and 65535\. On Debian, the root user has a UID
    of 0, services then range from 1 to 999, and regular users start at 1000\. The
    example below shows the info for a root user and a regular user.


    | $ grep root /etc/passwdroot:x:0:0:root:/root:/bin/bash$ grep user /etc/passwduser:x:1000:1000:Debian
    User,123,456,135:/home/user:/bin/bash$ |


    The GID attribute refers to the Group ID for the user''s primary group. GECOS
    is short for General Comprehensive Operating System and contains the user''s full
    name and sometimes a comma-separated list of user data like room and telephone
    number. Home is the user''s home directory and shell is the default shell for
    the user. To be precise, it is the program that is executed as soon as the user
    logs in.


    /etc/shadow


    This file contains the encrypted passwords and expiration data of users. The format
    is similar to /etc/passwd which we discussed above. Each line consists of eight
    columns, and the columns are separated by a colon. The attributes are the username,
    the password, the date of the last change, the minimum usage value, the maximum
    usage value, the warning time, the inactivity period, and the expiration date.


    The first attribute username again refers to the UNIX username, but in this instance,
    the password field does contain the user''s encrypted password. lastchange indicates
    the days since 1/1/1970 that the password was last changed. The next two attributes
    minimum and maximum show the minimum number of days before the user can change
    their password, and the maximum number of days the password is still valid. Warn
    shows the number of days before the password expiring, that the user will be warned
    to change the password. The inactive attribute is the number of days after expiration
    until the user is disabled, and the expiration date is the number of days after
    1/1/1970 since the account has been disabled.


    The example below shows the attributes for a regular user. The password is stored
    as a salted hash value in the second column.


    | # grep user /etc/shadowuser:$6$QB0brhON$R9saRX5Q1/OwYWyw4SViqeh6McumbqnxkJctxRAl…CshFyblLBTZxlCoggH12p21:17763:0:99999:7:::#
    |


