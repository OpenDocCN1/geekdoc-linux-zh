    # 19. Getting Help


    Linux is a complex operating system, especially for beginners. When you get started,
    the list of programs can be quite confusing. Each program has a longer list of
    parameters or options than the last. And they are not easy to memorize, they have
    long and short names, and are not standardized. Asking for help when you get stuck
    is not a mistake or sign of defeat.


    To get help on your Linux system, there are several ways to go about it. This
    includes the manual pages (called man pages), information pages (called info pages),
    as well as the integrated help of each command. In this chapter we will have a
    closer look at these help systems and get familiar with the commands `man`, `info`,
    `whereis`, and `whatis`.


    ## 19.1 Man Pages


    Man pages are the traditional way of distributing documentation about programs.
    The term man page is short for manual page, as they correspond to the pages of
    the printed manual. Man pages are part of the basic installation of your Linux
    system. The corresponding Debian package is named `manpages`.


    A man page corresponds to a specific section in the full UNIX manual: 1 for commands,
    2 for system calls, etc. To get information regarding a specific command, open
    the corresponding man page in a terminal window. As an example, for the `cp` command
    it is done as follows:


    ```bash

    man cp

    ```


    The resulting man page looks like this:


    ![](Image0080.gif)


    The key bindings are similar to the ones from the text editor `vi(m)`. Use the
    navigation keys to scroll up and down, and `q` to exit the man page and to return
    to the terminal.


    ## 19.2 Info Pages


    Info is the default format for documentation inside the GNU project. In the early
    1990s, the GNU project decided that the man page system was outdated and wrote
    the `info` command to replace it. info has basic hyperlinking features and a simpler
    markup language to use (compared to the troff system used for man pages). Nowadays
    both systems exist in parallel.


    The basic installation of Debian does not contain the info pages. In order to
    use it, post-install the package named `info`. To get information regarding a
    specific command, open the corresponding info page in a terminal window. As an
    example, for the `cp` command it is done as follows:


    ```bash

    info cp

    ```


    The resulting info page looks like this:


    ![](Image0081.gif)


    ## 19.3 Integrated Help


    Aside from man and info, many commands have an option `-h` (short for `--help`).
    Calling the command with this option opens a specific help section. The example
    below shows the built-in help of the `uname` command.


    ![](Image0082.gif)


    Alternatively, the `whatis` command is helpful to get brief information about
    Linux commands or functions. It displays a single-line man page description for
    the command that matches the string passed as a command line argument to the `whatis`
    command.

