    # 4. Setting up a Linux System


    As mentioned in the previous chapter, we will be using Debian for our demonstrations.
    To recap, Debian is a distribution that provides great stability and scales up
    exceptionally well once your skills and knowledge progress past the beginner stages.
    In this chapter we will install and configure Debian, showing you every single
    step along the way.


    4.1 Types of Installations


    Debian offers a variety of methods for a proper setup. This includes a graphical
    and a text-based installation; we will use the former. For installation media
    the Debian developers offer three variants:


    *   A CD or DVD for 32-bit and 64-bit.


    *   A network image for 32-bit and 64-bit (a so-called Netinst-ISO).


    *   A mini-CD for 32-bit or 64-bit.


    We also have test media available. These include live images for 32-bit and 64-bit,
    and allow you to try Debian before installing it on your computer. During the
    time of writing this guide, version 10 is the current stable release of Debian.
    The setup described here is based on this release and the amd64 architecture.


    After downloading the network image from [www.debian.org/distrib](http://www.debian.org/distrib)
    no further static images are required. Instead, it depends on your internet connection
    to retrieve the packages to be installed and keep your operating system up-to-date.


    The entire process will take you about an hour and it allows you to have a lean
    software selection based on your specific needs. Software packages that you do
    not use will not be available on your system. They can however be added whenever
    you feel the need.


    The target system of our installation is an XFCE-based desktop system for a single
    user with a web browser and a music player. For the web browser we use Mozilla
    Firefox and for the music player, VLC. Both programs are a permanent component
    of the Linux distribution. The environment we use for demonstration purposes is
    a virtual machine based on VirtualBox with 4 GB of RAM and 8 GB of disc space.


    4.2 Installing Linux Step-by-Step


    Boot Menu


    To begin with the installation of Debian, first boot the computer (in our case
    the VirtualBox image) from the ISO image you have downloaded. If you are also
    using a virtual machine, see your virtual machine vendor website for help on how
    to enable the ISO image. Next, wait for the boot menu to appear on the screen.
    The image below shows you the different options that are offered. Using the cursor
    keys, you can navigate the boot menu and the Enter key selects an entry.


    ![](Image00011.gif)


    The different options are:


    *   Graphical install: start the installation process using a graphical installer.


    *   Install: starting the installation process using a text-based installer.


    *   Advanced options: select further options like Expert mode, Automated install,
    or Rescue mode (see image below for more details).'
