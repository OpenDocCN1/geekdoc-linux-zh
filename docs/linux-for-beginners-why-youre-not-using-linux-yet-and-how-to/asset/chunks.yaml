    Debian 使用软件包管理器 `apt` 来处理软件包及相关包列表的安装、更新和删除。此外，`apt` 会解决所有的软件包依赖关系，并确保系统上有相关的软件。在我们的案例中，需要从软件包镜像检索并安装约
    170 MB 的数据。如之前提到的，这需要可用的互联网连接来下载所需的软件包。


    要安装这三个软件包，请在命令行提示符处输入以下命令。只需在 `#` 符号后输入命令：


    ```bash

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    `apt` 将显示有关要安装软件包的更多信息。这包括依赖包列表和推荐包。最后，你将看到命令行提示符。输入 `Y` 或按 `Enter` 来安装 `Aptitude`、`xdm`
    和 `xfce4` 以及依赖包。对于 `xdm` 显示管理器，有两个对话框需要确认。在两个框上都按 `Enter` 以确认使用 `xdm`。


    获取要安装的软件包需要一段时间。完成后，命令行提示符将再次出现。要激活关于图形桌面环境的更改，请重启系统。在命令行提示符处输入如下命令 `reboot`：


    ```bash

    root@debian106 ~# reboot

    ```


    重启 Linux 系统后，Debian 用一个图形化启动界面欢迎我们（见下文）。按 `Enter` 以默认设置启动 Linux 系统。


    ![](img/Image00037.gif)


    几秒钟，将看到一个图形登录界面。使用之前创建的名为 `user` 的普通用户登录系统。输入 `user`，按 `Enter`，然后输入用户的密码。然后再次按
    `Enter` 确认并登录。


    接下来，将看到 `XFCE` 桌面（见下文）。桌面带有几个默认元素：一个顶部导航栏、一个底部导航栏和桌面图标。这些元素在下文中将详细解释。


    ![](img/Image00038.gif)


    ### 顶部导航栏

    顶部导航栏包含几个元素：应用程序菜单、时钟、系统托盘和电源菜单。这些元素允许你管理应用程序和系统设置。


    ### 底部导航栏

    底部导航栏（或任务栏）显示当前打开的窗口，并提供在它们之间切换的按钮。它还包含应用程序启动器。


    ### 桌面图标

    桌面图标是文件夹、文件或应用程序的快捷方式。这些元素提供了快速访问频繁使用项目的途径。


    ## 4.4 添加软件包


    为了正确使用 Linux，你还必须学习如何添加软件包。在下面你将看到如何使用 `apt` 和 `apt-get` 命令。


    添加软件包最简单的方法是通过图形界面，但命令行通常更强大且更灵活。


    ### 使用 `apt-get`

    要使用 `apt-get` 命令安装软件包，语法为：

    ```bash

    sudo apt-get install <package_name>

    ```

    例如，要安装 `aptitude`、`xdm` 和 `xfce4`，你可以使用：


    ```bash

    root@debian106 ~# apt-get install aptitude xdm xfce4

    ```


    输出将以白色背景和较大的字体显示安装信息。


    ### 使用 `apt`

    `apt` 命令是 `apt-get` 的较新的替代方案。它更用户用户，并提供了更好的进度条。要安装软件包，使用：

    ```bash

    sudo apt install <package_name>

    ```

    例如，要安装 `aptitude`，你可以使用：


    ```bash

    root@debian106 ~# apt install aptitude

    ```


    输出将以白色背景和较大的字体显示安装信息。


    ### 更新和删除软件包

    要更新可用软件包列表，使用：

    ```bash

    sudo apt update

    ```

    要将所有已安装软件包升级到最新版本，使用：

    ```bash

    sudo apt upgrade

    ```

    要删除一个软件包，使用：

    ```bash

    sudo apt remove <package_name>

    ```


    ## 4.5 退出 Linux


    为了使用 Linux，你还必须学习如何退出 Linux 并重启系统。我们将看到两种方法，第一种基于图形界面，第二种可以用于非图形系统（如服务器）。


    ### 退出 XFCE 桌面环境

    退出 XFCE 桌面并注销当前会话简单的方法是点击顶部导航栏右角的按钮。按钮标记有你的用户名，在我们的案例中是 `user`。从小菜单中选择标记为 `Log
    Out`（注销）的最后一项。或者，你可以从左上角的应用程序按钮中选择 `Log Out` 项。


    ![](img/Image0039.gif)


    ### 关闭 Linux 系统

    关闭整个 Linux 系统的方法与退出 XFCE 类似。点击顶部导航栏右角的按钮并选择 `Shutdown`（关机）。从对话窗口点击标记为 `Shutdown`
    的按钮以停止 Linux 系统。


    从终端会话，你可以使用命令 `halt` 或 `shutdown -h`。


    ```bash

    # halt

    ```


    ### 重启 Linux 系统

    要重启 Linux 系统，点击顶部导航栏右角的按钮并选择项 `Restart`（重启）。从对话窗口点击标记为 `Restart` 的按钮以重启 Linux
    系统。


    从终端会话，你可以使用命令 `reboot`。


    ```bash

    # reboot

    ```


