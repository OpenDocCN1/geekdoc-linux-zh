    ### /dev/disk/by-part


    分区表（GPT）的一部分，用于主引导记录（MBR）相关的磁盘分区。


    ### df 和 du


    要查看哪些文件系统已挂载以及使用了多少可用块，请调用 `df` 命令。`df` 是 disk free 的缩写。该命令提供了多种选项：


    * `df -h`: 以人类可读的格式列出。

    * `df -k`: 以千字节列出。

    * `df -m`: 以兆字节列出。

    * `df`: 以默认块大小列出。有时这使用 500KB，可能会让人困惑。


    ![](img/Image0061.gif)


    同样，`du` 会计算目录使用的磁盘空间。标准输出显示每个条目的值，可能会让人困惑。要获取目录的摘要，可以通过三个参数扩展命令行：`-s`（摘要）、`-c`（总计）和
    `-h`（人类可读）。


    ## 12.4 挂载文件系统


    在使用文件系统之前，必须将其挂载为目录树的一部分。大多数情况下，这在启动时自动完成，但也可以手动进行。我们在上一章末尾简要查看了手动挂载的命令，但在这里我们将详细介绍它们的用法。


    为了演示，我们将第二个 SCSI 磁盘（`/dev/sdb1`）的分区挂载到 `/space`。首先，挂载文件系统时必须是 root 用户。接下来，如果 `/space`
    目录不存在，必须使用 `mkdir` 创建它：


    ```

    | # mkdir /space

    ```


    然后运行 `mount` 命令包含此目录：


    ```

    | # mount /dev/sdb1 /space

    ```


    大多数情况下 Linux 会自动检测文件系统类型。如果没有自动检测，请使用 `-t` 参数（type 的缩写）加上文件系统类型进行强制执行。此步骤假设相关的文件系统类型已安装并被
    Linux 内核识别。要列出 Linux 内核支持的文件系统，可以使用如下的 `cat`、`awk`、`sed`、`ls` 和 `sort` 命令组合。


    尚未讨论的命令中，`sort` 用于按顺序排序文件，将在第 7 章详细讨论。除了这个示例外，我们不会对 `awk` 和 `sed` 进行详细介绍。


    ```

    $ (cat /proc/filesystems | awk ''{print $NF}'' | sed ''/^$/d'' | ls -1 /lib/modules/$(uname
    -r)/fs | sort -u)

    ```


    以下命令扩展了上面的命令，将第二个 SCSI 磁盘（`sdb1`）的分区使用 `ext3` 文件系统挂载到 `/space`：


    ```

    | # mount -t ext3 /dev/sdb1 /space

    ```


    ## 12.5 卸载文件系统


    如果文件系统正忙或在使用中，则无法卸载。要找到哪些程序正在使用该文件系统，可以使用 `lsof` 包中的 `lsof` 命令。`lsof` 是 list of
    open files 的缩写。下面的示例演示了如何使用该命令，并显示了 `/home/user/Music` 目录。


    ![](img/Image0062.gif)


    这提供了使用该目录的程序列表。此外，如果用户在该目录中工作，你必须使用 `cd` 命令更改目录。要卸载我们在上一节中挂载的 `/space` 目录，必须再次以
    root 用户登录。接下来，通过调用 `lsof /space` 命令测试是否有其他程序正在使用 `/space`。


    ```

    $# lsof /space

    ```


    然后输入 `umount /space`。如果没有收到错误消息，则 `/space` 已成功卸载。或者，运行带有 `-v` （verbose 的缩写）的 `umount`
    命令以查看事务消息。最后，输入 `df -k` 查看新的分区状态。


    ```

    # umount /space

    # exit

    ```


    ## 12.6 自动挂载挂载点


    要在系统启动期间自动挂载挂载点，请在配置文件 `/etc/fstab` 中添加一个条目。`fstab` 是 file system table 的缩写。下面的示例显示了配置文件的内容。


    '
- fmt: '

    # cat /etc/fstab

    `/etc/fstab`: static file system information.


    ## Use ''blkid'' to print the universally unique identifier for a device; this
    may be used with `UUID=` as a more robust way to name devices that works even
    if disks are added and removed. See `fstab(5)`.


    ## <file system><mount point><type><options><dump><pass>

    ```text

    / was on /dev/sda1 during installation

    UUID=dc78e6f6-8a4f-4be0-9192-e4ca37838765     /      ext4     errors      0 1

    /home was on /dev/sda7 during installation

    UUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf     /home    ext4     defaults     0
    2

    /tmp was on /dev/sda5 during installation

    UUID=faef6770-b865-43d2-b1f6-56352413d7c4     /tmp     ext4     defaults     0
    2

    /var was on /dev/sda6 during installation

    UUID=d2f4fd43-4f76-414c-9afa-6a53d4cd1d9c     /var     ext4     defaults     0
    2

    swap was on /dev/sda2 during installation

    UUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf     none     swap     sw     0 0

    /dev/sr0/media/cdrom0 udf,iso9660 user,noauto 0 0

    ```


    The columns (fields) in the file `/etc/fstab` are:


    *   `filesystem`: specifies the UUID (`UUID=xxxxx`), name (`/dev/sdb1`), or the
    label of the filesystem (`LABEL=home`).

    *   `mount point`: defines the directory where the filesystem will be mounted.

    *   `type`: a comma-separated list of allowed filesystem types.

    *   `options`: a comma-separated list of options.

    *   `dump`: dump information in file with `0` = off and `1` = on.

    *   `pass`: the order the filesystem is checked, starting with `1`. `0` means
    last.


    Keep in mind that the single columns are separated by a tabulator and spaces do
    not work properly. Tip: To find the UUID for the mount point, look in `/dev/disk/by-uuid`.


    To add a device to mount automatically, extend the file `/etc/fstab` by simply
    adding a line. In order to mount the partition `/dev/sdb1` as `/space` with an
    `ext3` filesystem at startup, add this line on older systems:


    ```text

    /dev/sdb1 /space ext3 defaults 0 0

    ```


    On contemporary systems that support UUIDs, use the following line. Note to replace
    the value of `7ca005b2-a7ff-4757-bfdf-81004d4 072ef` with the UUID of your partition:


    ```text

    UUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults 0 0

    ```


    Now `/dev/sdb1` will always be mounted as `/space` at startup. You may wonder
    what the advantage is of using a UUID. By using a UUID the partition is clearly
    identified, even if the order of the disks changes later on.


    To generate a UUID (or to regenerate a new one) use the `uuidgen` command line
    tool. It offers two options. The first is `-r` (short for `--random`) which generates
    a random-based UUID. This method creates a UUID consisting mostly of random bits.
    This is the default value if not explicitly specified.


    ```bash

    $ uuidgen -r4d545248-cf36-4d24-91ab-64a9ed276072

    ```


    The second option is `-t` (short for `--time`) which generates a time-based UUID.
    This method creates a UUID based on the system clock plus the system''s ethernet
    hardware address if present.


    ```bash

    $ uuidgen -t4afa1166-bcf1-11e8-9a0a-68f728ff3d63

    ```


    The `uuidgen` command writes the newly generated UUID to `stdout`. You can copy
    and paste the new UUID directly into `/etc/fstab` to have a unique identifier
    for a partition to be referenced.


    ## 12.7 Setting up New Partitions


    The idea behind `fdisk` and its counterparts, `cfdisk` and `gparted`, is to view
    the partitions on a disk and to add, remove or edit partitions. In this section,
    we will have a look at `fdisk`, which is a standard package for Debian and is
    also available on all major Linux distributions. Both `cfdisk` and `gparted` are
    non-standard packages and may require separate installation. We discuss the installation
    of additional packages in Chapter 4 and Chapter 14.


    In order to use `fdisk`, as a root user type `fdisk` followed by the name of the
    drive. The next example shows this for the first SCSI disk named `/dev/sda`.


    ```bash

    # fdisk /dev/sda

    ```


    This will open a screen as shown below. At the command line prompt press `p` in
    order to print the partitions:


    ```text

    # fdisk /dev/sda

    Welcome to fdisk (util-linux 2.29.2).

