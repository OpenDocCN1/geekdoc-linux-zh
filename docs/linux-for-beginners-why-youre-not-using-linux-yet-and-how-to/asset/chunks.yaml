- fmt: '

    Furthermore, the description `GNU/Linux` needs some explanation. Linux distributions
    with this name prefix are fleshed out with GNU implementations of the system tools
    and programs. One such example is `Debian GNU/Linux`. As already pointed out in
    Chapter 1, the `GNU` project goes back to the initiative of Richard M. Stallman
    and his dream to develop a free `UNIX` system. Based on his experiences at MIT
    and the collaboration with other colleagues, he chose to use free software that
    was already available to rewrite the tools he needed. This included the `TeX`
    typesetting system as well as the `X11` window system. He published the rewritten
    tools under the `GPL` license whenever possible to make his work available freely
    to everyone interested in it.


    ## What is a Linux Distribution?


    A Linux distribution is a collection of software packages that fit together. A
    distribution is maintained by a team of software developers, and each member of
    the team focuses on a different package of the distribution. Together as a team,
    they ensure that the single software packages are up-to-date and do not conflict
    with other packages of the same release.


    As of 2020 for `Debian GNU/Linux 10`, the official repositories contain more than
    59,000 different packages. A repository is a directory of packages with a specific
    purpose. `Debian GNU/Linux` sorts its packages according to the development state.
    The official repository is named `stable` and reflects the current release of
    stable packages. The other repositories are named `testing` and `unstable`, and
    work in the same way but do not count as official packages.


    Typically, a Linux distribution comprises of packages for a Linux kernel, a boot
    loader, `GNU` tools and libraries, a graphical desktop environment with a windows
    environment, as well as additional software like a web browser, an email client,
    databases, and documentation. The software is provided in two ways, as the source
    code and as the compiled binary packages. This allows you to understand how the
    software is designed, to study it, and to adjust it according to your personal
    needs. This step is described as freedom 1 on the list shown in Chapter 2.


    Depending on the focus of the Linux distribution, it also contains packages for
    a specific purpose like network or forensic tools, scientific software for educational
    purposes, and multimedia applications. More details are given below.


    ## Choosing a Linux Distribution


    According to Distrowatch, more than 600 different Linux distributions exist. One
    of the major questions is: which Linux distribution to use? Based on our experience,
    we have the following recommendations:


    *   For beginners: `Ubuntu`, `Xubuntu`, `openSUSE`, `Linux Mint`.

    *   For advanced users with experience: `Debian GNU/Linux`, `Red Hat Enterprise
    Linux` (`RHEL`), `Fedora`, `CentOS`.

    *   For developers: `Arch Linux`, `Gentoo`, `Slackware`.


    For the examples in this book, we use `Debian GNU/Linux`. Even though this distribution
    is recommended for advanced users it is still very beginner-friendly, which we
    will demonstrate in this guide. But the most important reason for this selection
    is its stability and the trust we have in this distribution that was built up
    during the last 20 years of permanent use in our servers and desktop systems.
    Other Linux distributions fluctuate too much for our comfort. The biggest mistake
    we see beginners make, is choosing to install an unstable distribution at the
    start, which in many cases can ruin your entire Linux experience and put you off
    Linux completely.


    You are more than welcome to choose a different Linux distribution. Just ensure
    it is one that doesn''t have known stability issues. The majority of this book
    applies to most distributions. But if you are a complete novice, we highly recommend
    sticking to `Debian` at least for the duration of this guide, as we will go step
    by step through its setup and configuration.


    In general, choosing a Linux distribution can depend on several criteria:


    *   Its availability: free or commercial use.

    *   Its purpose: desktop, server, Wi-Fi router/network appliance.

    *   The intended audience: end-user, network engineer, system administrator, developer.

    *   The package format: `.deb`, `.rpm`, `.tar.gz`.

    *   The frequency of available updates: every Linux distribution follows its own
    update cycle.

    *   The provided support: support can be free (community-based) or with costs
    (based on a support contract).


    When selecting a distribution, we recommend one that is stable, that is updated
    regularly, and fits into the purpose you need the computer for. Below you will
    find a short description of each of the major Linux distributions.


    ![](Image00001.gif)


    ### Debian GNU/Linux


    Established in 1993, `Debian GNU/Linux` (`Debian` for short) is an entirely free
    and community-based operating system that follows the `GNU` principles. More than
    1,000 developers continuously work on it of their own free will. There are no
    corporations behind the development of `Debian`, which means there are no business
    interests involved.


    One design goal is to have a stable and reliable operating system for computers
    that are actively delivering services. It is targeted to users who know what they
    want, and the `Debian` developers maintain and use their own software. The packages
    are made available in `.deb` format and are divided into categories according
    to the following licenses:


    *   `Main`: free software.

    *   `Contrib`: free software that depends on non-free software.

    *   `Non-free`: packages that have a non-free license.


    `Debian` works well on both servers and desktop systems. A range of architectures
    are supported like `ARM EABI` (`arm`), `IA-64` (`Itanium), `MIPS`, `MIPSel`, `powerpc`,
    `s390` (32 and 64 bit), as well as `sparc`, `i386` (32 bit) and `amd64` (64 bit).
    The code name of each release is based on the name of a character from the film
    `Toy Story`, such as `Stretch` for `Debian GNU/Linux 9` and `Buster` for `Debian
    GNU/Linux 10`.


    ![](Image00002.gif)


    ### Ubuntu


    `Ubuntu` is a free Linux distribution that is financed by the company `Canonical
    Ltd`. It is based on `Debian` but focuses on beginners instead. That''s why it
    contains only one tool per task. The `Ubuntu` team is known to incorporate brand
    new elements that lack stability. This is one of the biggest complaints we receive
    when talking to newcomers. For this reason, we do not recommend `Ubuntu` to beginners.
    Popularity does not equal usability. Our number one recommendation is `Debian`,
    with `Mint` a good second choice.


    The packages are made available in `.deb` format and are divided into categories
    according to their support from `Canonical`:


    *   `Main`: free software, supported by `Canonical`.

    *   `Restricted`: non-free software, supported by `Canonical`.

    *   `Universe`: free software, unsupported.

    *   `Multiverse`: non-free software, unsupported.


    `Ubuntu` is available in three official editions: `Ubuntu Desktop`, `Ubuntu Server`,
    and `Ubuntu Core` (for the Internet of Things). A range of architectures is supported
    such as `i386`, `IA-32`, `amd64`, `ARMhf` (`ARMv7 VFP3-D16`), `ARM64`, `powerpc`
    (64 bit), and `s390x`.


    Initially published in 2004, there are two releases per year: one in April and
    another in October. The release is reflected by the version number: `18.04` refers
    to the April release of the year 2018. The code name of a release is based on
    an adjective and an animal, such as `Utopic Unicorn` for `Ubuntu 14.10`.


    ![](Image00003.gif)


    ### Linux Mint


    `Linux Mint` aims to offer a more familiar desktop experience that Windows users
    will appreciate, along with having decent hardware and multimedia support out
    of the box. The `Cinnamon Desktop` version of `Mint` is a fan favorite for its
    close resemblance to a Windows environment, even supporting similar keyboard shortcuts.
    Due to its overall reliability, this a distribution we can comfortably recommend.

