    8.4 Commands to Restart and Stop the System


    There are several common commands available when it comes to restarting and stopping
    the system. To reboot Linux, you can use either reboot or shutdown . To stop Linux,
    you can invoke halt , poweroff , or shutdown . Below we will discuss some practical
    examples.


    | # shutdown -r now |


    The above command will restart the system. The option -r designates a reboot and
    restarts the system. The option now is a time parameter and invokes the action
    immediately. You can also use the reboot command to perform the same action as
    the shutdown -r now command.


    | # reboot |


    The shutdown command can also be used to stop the system by using the -h option
    instead. This instructs Linux to halt.


    | # shutdown -h now |


    Again, the now time parameter is used to stop the system immediately. The time
    parameter can also be specified as an exact time. The command shown in the example
    below will shut down the system after five minutes. It will also inform all users
    about the shutdown by sending them a relevant message. The message will be visible
    on all open terminals.


    | # shutdown -h +5 "Server shutdown due to maintenance in 5 min"Shutdown scheduled
    for Thu 2020-09-06 02:28:30 EDT, use ''shutdown -c'' to cancel.# |


    Similar to rebooting the system, stopping Linux also has a shortcut in the form
    of the halt command. This performs the same action as the shutdown -h now command.


    | # halt |


    The halt , poweroff , and reboot commands stop the system immediately. They are
    similar to shutdown -h now except that the shutdown command terminates all processes
    gracefully, instead of killing them abruptly. Keep in mind that all the commands
    above require administrative privileges to be executed. They cannot be executed
    by a regular user.


    # 9. Hardware Management


    9.1 Hardware Detection


    Automatic hardware detection used to be somewhat of a gamble, as hardware wasn''t
    always detected automatically all of the time. It used to be necessary to probe
    the hardware to figure out what was installed. In the last few years, this has
    improved significantly as manufacturers document their products in more detail
    and publish the specs online. This has led to an extended knowledge database and
    support.


    9.2 Using the /proc Filesystem


    /proc is a virtual filesystem, also referred to as an in-memory filesystem , created
    by the Linux kernel at runtime. It displays information about the kernel, processes,
    and other system information. This information is displayed in a file structure
    and accessible to everyone. As an example, the command below shows the contents
    of /proc/cmdline, which are the options the Linux kernel was invoked with. Recall
    that cat outputs the contents of a file to the screen.


    | $ cat /proc/cmdlineBOOT_IMAGE=/boot/vmlinux-4.9.0-7-amd64 root=UUID=1d4acbbf-4420-4eab-984d-ceebc408a51e
    ro quiet$ |


    Some other useful files are:


    *   /proc/cpuinfo - Information about the computer''s CPU.


    *   /proc/meminfo - Information about system memory.


    *   /proc/loadvg - Load average. The first three columns measure CPU utilization
    from the last 1, 5, and 10 minutes. The fourth column shows the number of currently
    running processes and the total number of processes. The last column displays
    the last process ID used.


    *   /proc/partitions - Partition-related information.


    *   /proc/version - Information about the Linux version.


    | $ cat /proc/versionLinux version 3.16.0-4-amd64 (debian-kernel@lists.debian.org)
    (gcc version 4.8.4 (Debian 4.8.4-1) ) #1 SMP Debian 3.16.43-2+deb8u2 (2017-06-26)$
    |


    *   /proc/devices - List of device drivers configured into the currently running
    kernel.


    *   /proc/filesystems - Lists the filesystems supported by the kernel.


    *   /proc/uptime - Contains information about the running time of the system.
    The first number is the total number of seconds the system has been up. The second
    number is how much of that time the machine has spent idle, in seconds.


    | $ cat /proc/uptime15250.54 55603.02$ |


    Processes in Linux are assigned several files. The example below shows the file
    structure for the process with the Process ID (PID) of 433\. Following this, we
    look at the purpose and contents of the files generally available.


    | &#124;– 433&#124;     &#124;– attr&#124;     &#124;– cwd -> /home/user&#124;    
    &#124;– fd&#124;     &#124;– fdinfo&#124;     &#124;– map_files&#124;     &#124;–
    net&#124;     &#124;    &#124;– dev_snmp6&#124;     &#124;    &#124;– netfilter&#124;    
    &#124;    &#124;– stat&#124;     &#124;– ns&#124;     &#124;– root -> /&#124;    
    &#124;– task&#124;          &#124;– 433 |


    *   /proc/PID/cmdline - Command line arguments.


    *   /proc/PID/cpu - Current and last CPU in which the process was executed.


    *   /proc/PID/cwd - Link to the current working directory.


    *   /proc/PID/environ - Values of the environment variables.


    *   /proc/PID/exe - Link to the executable of this process.


    *   /proc/PID/fd - Directory that contains all file descriptors.


    *   /proc/PID/maps - Maps to executables and library files.


    *   /proc/PID/mem - Memory held by this process.


    *   /proc/PID/root - Link to the root directory of this process.


    *   /proc/PID/stat - Status of the process.


    *   /proc/PID/statm - Process memory status information.


    *   /proc/PID/status - Process status in human readable form.


    If you want to learn more about the /proc filesystem, check out the Man Page (short
    for Manual Pages) for /proc. It covers much more than what is relevant for the
    scope of this guide. Access to Man Pages is discussed in Chapter 19.


