    \ data.\n64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=1 ttl=63\
    \ time=36.9 ms\n64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142): icp_seq=2\
    \ ttl=63 time=37.9 ms\n64 bytes from fra16s18-in-f14.1e100.net (172.217.23.142):\
    \ icp_seq=3 ttl=63 time=40.1 ms\n^C\n--- google.com ping statistics ---\n3 packets\
    \ transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev =\
    \ 36.953/38.353/40.193/1.377 ms\n```\n\n# 17. Shared Libraries\n\nLinux, like\
    \ any operating system, contains collections of files used for different purposes\
    \ such as binary files (compiled program code), runtime interpreted code (written\
    \ in programs like Perl or Python), configuration files, log files, libraries,\
    \ and user data.\n\nIn the world of programming, a library is an assortment of\
    \ pre-compiled pieces of code that can be used in other programs. These libraries\
    \ contain functions, classes, and data structures. They allow the reuse of code\
    \ that already exists and has already been tested, so the user doesn't need to\
    \ reinvent the wheel. As a result, libraries significantly simplify the life for\
    \ programmers. Among the most prominent examples of libraries in Linux are `libc`,\
    \ the standard C library, and `glibc`, the GNU version of `libc`.\n\nLinux distinguishes\
    \ between statically and dynamically linked binary programs. Statically linked,\
    \ means the routines from the library become part of the program. In contrast,\
    \ dynamically linked means the routines from the library are referenced only and\
    \ do not become part of the program. Statically linked programs are entirely independent\
    \ of one another but require more disk space. Dynamically linked programs are\
    \ smaller but depend on the reference libraries, meaning they load quicker if\
    \ the referenced library is already in memory. These libraries are called shared\
    \ libraries or dynamic libraries.\n\n## 17.1 Naming Conventions\n\nIt is common\
    \ to extend the filename of a shared library with `.so` which abbreviates the\
