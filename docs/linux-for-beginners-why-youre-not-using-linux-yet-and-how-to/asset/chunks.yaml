    此命令背后的思想是对字符串进行翻译、替换和删除。`tr` 从 `stdin` 读取并输出到 `stdout`。它有以下选项：


    * `-d`（`--delete` 的缩写）：从字符串中删除指定的字符。

    * `-s`（`--squeeze-repeats` 的缩写）：将重复的字符替换为单个。

    * `-t`（`--truncate-set1` 的缩写）：截断给定的字符集。


    下面的第一个示例演示了如何将小写字母转换为大写。`tr` 接受两组字符：原始字符和替换字符。两个集合中的字符数量必须相同。


    ```bash

    $ cat bigfilethis is file onethis is file twothis is file three$ cat bigfile |
    tr [a-z] [A-Z]THIS IS FILE ONETHIS IS FILE TWOTHIS IS FILE THREE$

    ```


    第二个示例演示了如何将重复的空格替换为单个。空格被定义为一组字符，包括空格、制表符、回车或换行符。


    ```bash

    $ echo "tools for        developers" | tr -s [:space:]tools for developers$ echo
    "tools for        developers" | tr -s [:space:] "-"tools-for-developers$

    ```


    ## diff


    此工具分析两个文件并打印不同的行。此外，`diff` 会输出用于将第一个文件转换为第二个文件所需的步骤描述。下面的示例演示了两个文件的这种情况。输出行 `1c1`
    意味着 `file1` 的第一行需要更改以得到 `file2` 的第一行。下方是使用连字符分隔的两个文件中的引用行。


    ```bash

    $ cat file1this is file onewith a second line$ cat file2this is file twowith a
    second line$ diff file1 file21c1< this is file one---> this is file two$

