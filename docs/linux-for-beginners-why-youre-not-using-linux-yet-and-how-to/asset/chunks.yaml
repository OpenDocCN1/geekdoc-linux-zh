    ## 8.4 重启和停止系统的命令


    在重启和停止系统时，有几个常用的命令。要重启 Linux，可以使用 `reboot` 或 `shutdown`。停止 Linux，可以调用 `halt`、`poweroff`
    或 `shutdown`。下面我们将讨论一些实际示例。


    | # `shutdown -r now` |


    上述命令将重启系统。`-r` 选项指定重启并启动系统。`now` 选项是一个时间参数，立即执行操作。你也可以使用 `reboot` 命令来执行与 `shutdown
    -r now` 命令相同的操作。


    | # `reboot` |


    `shutdown` 命令也可以通过 `-h` 选项来停止系统。这指示 Linux 停机。


    | # `shutdown -h now` |


    同样使用了 `now` 时间参数来立即停止系统。时间参数也可以指定精确时间。下面示例中的命令将在五分钟后关闭系统。它还将通过发送相关消息通知所有用户关机宜。该消息将在所有打开的终端中可见。


    | # `shutdown -h +5 "Server shutdown due to maintenance in 5 min"`Shutdown scheduled
