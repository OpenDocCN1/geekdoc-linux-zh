    forever  inet6 fe80::a00:27ff:fee3:5c79/64 scope link  valid_lft forever preferred_lft
    forever$

    ```


    #### `ping`


    `ping` 向指定的 IP 地址或主机名发送 ICMP 网络数据包，并显示往返时间。下方的示例演示了主机 `http://www.google.com`
    的操作。


