    乍一看，shell 脚本听起来可能很令人生畏，但其实非常简单。在最形式的形式，它只是存储在文件中的一系列 `UNIX/Linux` 命令，并由命令行解释器逐行执行。shell
    脚本类似于在终端中输入单条命令，但它们是批量执行的。这使得执行速度快得多，并有助于实现任务自动化。在本指南中，我们不会深入探讨 shell 脚本编程的复杂性，但值得注意的是
    shell 脚本的推荐结构。


    *   `Shebang line`（Shebang 行） - 定义了使用哪个程序来妥善处理 shebang 行之后的指令。该行以 `#!` 开头，这是一个双字节数字，指示后续行是一个可执行的
    shell 脚本。shebang 之后是用于处理指令的解释器或程序的路径。

    *   `Docstring`（文档字符串字符串） - 对脚本功能和代码软件许可的简短描述。这可以是一个单行，也可以是详细的描述。此类行以 `#` 开头，并被
    shell 视为注释。

    *   `Commands`（命令） - 要由 shell 执行的单个命令组合。如所述，这可以像我们下面示例中那样只有的一行指令，也可以是一个完整的程序。

    *   `Exit state`（退出状态） - 定义脚本的返回值。除非另有说明，否则将返回脚本中执行的最后一条命令的退出状态。通常在成功时返回 `0`，在出错时返回
    `1` 到 `255` 之间的值。


    下面的基础脚本包含了上述提到的所有元素。该脚本的目的是确定计算机的运行时间（uptime）。


    ```bash

    #!/bin/bash

    # determine the uptime of the system

    # Released under GNU Public License (GPL)

    uptime

    # define exit state: no error

    exit 0

    ```


    执行 shell 脚本有两种方法。我们可以调用 `Bash` 等 shell 来运行它，或者为脚本设置可执行标志并运行它。第一种方法使用 `Bash`，如下：


    ```bash

    $ bash uptime.sh

    12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40, 0,27

    ```


    第二种方法基于两个步骤。首先，我们使用 `chmod` 命令为脚本设置可执行标志，如下：


    ```bash

    $ chmod u+x uptime.sh

    ```


    然后我们可以运行脚本：


    ```bash

    $ ./uptime.sh

    12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28

    ```


    # 7 文本处理


    Linux 大部分运行在文本文件上。例如，存储在 `/etc` 中的配置文件也是以文本文件的形式存储的。Linux 提供了一套丰富的文本处理命令，这些命令非常全面且节省时间。了解它们是什么以及如何工作，对于后续许多深入研究
    Linux 的章节将起到至关的作用。在本章中，我们将查看这些命令并演示如何使用它们。


    ## 7.1 文本处理命令


    ### cat


    是 concatenate（连接）的缩写，`cat` 将文件内容输出到屏幕或标准输出。命令 `cat /etc/passwd` 将 `/etc/passwd`
    文件的所有行输出到屏幕。


    ```bash

    $ cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    sys:x:3:3:sys:/dev: /usr/sbin/nologin

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/usr/sbin/nologin

    man:x:6:12:man:/var/cache/man:/usr/sbin/nologin

    lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin

    mail:x:8:8:mail:/var/mail:/usr/sbin/nologin

    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin

    uucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologin

    proxy:x:13:13:proxy:/bin:/usr/sbin/nologin

    www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin

    backup:x:34:34:backup:/var/backups:/usr/sbin/nologin

    list:x:38:38:Mailing List Manager:/var/list:/usr/sbin/nologin

    irc:x:39:39:ircd:/var/run/ircd:/usr/sbin/nologin...

    ```


    `cat` 还可以使用重定向操作符 `>` 写入文本文件。为此，只需使用重定向操作符和你的文本文件名。例如：


    ```bash

    cat > output.txt

    ```


    随后输入你想要输出的文本行。要退出，按下 `Ctrl+D`，并输入 `cat output.txt` 查看结果。


    ```bash

    $ cat > output.txt

    hello world

    this is a test

    to see if cat works

    $ cat output.txt

    hello world

    this is a test

    to see if cat works

    ```


    `cat` 的其他有用选项：


    *   `-E`（`ends` 的缩写）：在每行的末尾显示 `$`。

    *   `-n`（`number` 的缩写）：对所有行编号，包括空行和非空行。

    *   `-s`（`blank` 的缩写）：抑制多个空行。


    假设我们有一个名为 `output.txt` 的文本文件。要查看它，输入：


    ```bash

    $ cat -n output.txt

    1 hello world

    2 this is a test

    3 to see if cat works

    ```


    ### tac


    `tac` 命令的工作方式与 `cat` 相同，但反向显示行。使用节的文件，让我们显示：


    ```bash

    $ tac output.txt

    ```


    ### more


    虽然 `cat` 和 `tac` 一次显示整个文件，但 `more` 让你一次查看一个屏幕的文件。假设我们有一个名为 `alice.txt` 的大文本文件。要查看它，输入：


    ```bash

    more alice.txt

    ```


    这会显示从文件开始的一个屏幕。使用空格键翻页。或者，按回键向下滚动一行。`more` 命令的缺点是它只能向下滚动而不能回滚。对于这一点，可以使用 `less`
    命令。


    '
- fmt: '

    * `n` - next instance of text matching `<regex>`.

    * `N` - previous instance of text matching `<regex>`.

    * `:n` - next file when multiple files are opened in the same command.

    * `:p` - previous file when multiple files are opened in the same command.

    * `q` - quit.


    ## head


    This command outputs the first `n` -number of lines of a file. If `n` is not specified,
    it defaults to ten. The example below shows the default use of `head` for the
    file `/etc/passwd`.


    ```bash

    $ head /etc/passwdroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologinsys:x:3:3:sys:/dev:
    /usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncgames:x:5:60:games:/usr/games:/usr/sbin/nologinman:x:6:12:man:/var/cache/man:/usr/sbin/nologinlp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologinmail:x:8:8:mail:/var/mail:/usr/sbin/nologinnews:x:9:9:news:/var/spool/news:/usr/sbin/nologin$

    ```


    To output the first six lines of the file `/etc/passwd`, type this instead:


    ```bash

    $ head -n6 /etc/passwdroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologinsys:x:3:3:sys:/dev:
    /usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncgames:x:5:60:games:/usr/games:/usr/sbin/nologin$

    ```


    The opposite of `head` is `tail` which we will explain next.


    ## tail


    The `tail` command outputs the last `n` -number of lines of a file. If `n` is
    not specified, it defaults to ten lines. The example below displays the last 5
    lines of the file `/etc/passwd`.


    ```bash

    $ tail -n5 /etc/passwdusbmux:x:109:46:usbmux daemon,,,:/var/lib/usbmux:/bin/falsepulse:x:110:114:PulseAudio
    daemon,,,:/var/run/pulse:/bin/falsightdm:x:111:116:Light Display Manager:/var/lib/lightdm:/bin/falsefelix:x:1001:1001:Felix,,,:/home/felix:/bin/bashcaro:x:1002:1002:Caro,,,:/home/caro:/bin/bash$

    ```


    In addition, `tail` can be used to follow the progress of a log file by using
    `-f` (or `--follow`). As more data gets appended to the end of the file, the output
    on the screen updates. To output the progress of the last 20 lines of `/var/log/syslog`
    as it updates, use the following command:


    ```bash

    $ tail -f -n 20 /var/log/syslog

    ```


    ## sort


    As the name implies, this command is used to sort files. Among others it has the
    following options:


    * `-R`: random sort.

    * `-r`: reverse the sort order.

    * `-n`: sort numerically.


    To sort the first five lines of the file `/etc/passwd` in alphabetical order,
    use this command:


    ```bash

    $ head -n5 /etc/passwd | sortbin:x:2:2:bin:/bin:/usr/sbin/nologindaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinroot:x:0:0:root:/root:/bin/bashsync:x:4:65534:sync:/bin:/bin/syncsys:x:3:3:sys:/dev:/usr/sbin/nologin$

    ```


    Use the option `-r` to reverse the sort order:


    ```bash

    $ head -n5 /etc/passwd | sort -rsys:x:3:3:sys:/dev:/usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologin$

    ```


    ## uniq


    This command reports or removes duplicate lines from a sorted file. Among others
    it has the following options:


    * `-c` (short for `--count`): outputs the frequency of occurrence for each line.

    * `-d` (short for `--repeated`): reports the lines that occur more than once.

    * `-u` (short for `--unique`): reports the lines that appear only once.


    The example below shows the basic usage of `uniq`. The output contains each line
    that only occurs once.


    ```bash

    $ cat names.sortedGreg     1967John     1986John     1986Kate     1948Pete     1977$
    uniq names.sortedGreg     1967John     1986Kate     1948Pete     1977$

    ```


    ## cut


    The `cut` command extracts specified fields from files. It requires a delimiter
    in order to detect the field boundaries. The following example displays the name
    and the user ID from the file `/etc/passwd`. These are the first and third fields
    from each line (option `-f`), and the fields are separated by a colon (option
    `-d`).


    ```bash

    $ cut -d":" -f1,3 /etc/passwd...colord:108saned:109usbmux:110geoclue:111sshd:112uuidd:113pulse:114rtkit:115avahi:116...$

    ```


    ## tr


    The idea behind this command is to translate, to substitute, and to delete characters
    from a string. `tr` reads from `stdin` and outputs to `stdout`. It has the following
    options:


    * `-d` (short for `--delete`): deletes the given characters from the string.

    * `-s` (short for `--squeeze-repeats`): replaces repeated characters with a single
    occurrence.

    * `-t` (short for `--truncate-set1`): truncates the given set of characters.


    The first example shown below demonstrates how to convert lower case to upper
    case characters. `tr` accepts two sets of characters: the originals and the replacements.
    The number of characters in both sets must be the same.


    ```bash

    $ cat bigfilethis is file onethis is file twothis is file three$ cat bigfile |
    tr [a-z] [A-Z]THIS IS FILE ONETHIS IS FILE TWOTHIS IS FILE THREE$

    ```


    The second example demonstrates how to replace repeated spaces with a single one.
    A space is defined as a group of characters, being spaces, tabulators, carriage
    return, or linefeed.


    ```bash

    $ echo "tools for        developers" | tr -s [:space:]tools for developers$ echo
    "tools for        developers" | tr -s [:space:] "-"tools-for-developers$

    ```


    ## diff


    This tool analyzes two files and prints the lines that are different. Moreover,
    `diff` outputs a description of which steps are needed to transform the first
    file into the second file. The example below demonstrates this for two files.
    The output line `1c1` means that the first line of `file1` has to be changed to
    get the first line of `file2`. Below that is the referenced lines from the two
    files separated by dashes.


    ```bash

    $ cat file1this is file onewith a second line$ cat file2this is file twowith a
    second line$ diff file1 file21c1< this is file one---> this is file two$

    ```


    ## nl


    `nl` is similar to `cat` (discussed at the beginning of this chapter) but adds
    a line number at the beginning of each line of output.


    ```bash

    $ nl places     1 Amsterdam     2 Berlin     3 Bern     4 Cape Town$

    ```


    ## wc


    `wc` abbreviates the phrase word count and respectively counts lines, words, and
    single characters of the input. Unless otherwise specified, all three values are
    printed:


    ```bash

    $ wc places4 5 32 places

    ```


    Among others `wc` offers the following options to limit the output:


    * `-l`: outputs the number of lines, followed by the filename.

    * `-w`: outputs the number of words, followed by the filename.

    * `-c`: outputs the number of characters, followed by the filename.


    This example shows how to count only the lines in a file:


    ```bash

    $ wc -l places4 places

    ```


    ## 7.2 Introduction to grep


    The command-line tool `grep` is one of the most essential and powerful Linux commands,
    so much so that authors have written entire guides solely to it. `grep` acts as
    a filter and abbreviates the description of global expression print .


    The command works on text data as a filter and only prints the lines of text that
    match a given pattern. `grep` requires data to work on, in combination with a
    pattern to look for. In this context, data refers to a series of characters that
    can come from `stdin` or a file, and a pattern can be formulated as a series of
    characters or as a regular expression. Four different pattern styles are supported
    by grep :


    * `-G` (short for `--basic-regexp`): the pattern is formulated as a basic regular
    expression. This is the default case.

    * `-F` (short for `--fixed-strings`): the pattern is not a regular expression
    and is interpreted as a fixed string instead. Can also be abbreviated as `fgrep`.

    * `-E` (short for `--extended-regexp`): the pattern is formulated as an extended
    regular expression that allows an additional character set. Can also be abbreviated
    as `egrep`.

    * `-P` (short for `--perl-regexp`): the pattern is interpreted as a regular expression
    following Perl syntax.


    The number of options `grep` offers is quite extensive. The following is a list
    of the most notable options available:


    * `-c`: counts and prints the number of matches from the search, but does not
    print the matches themselves.

    '
  raw: '*   n - next instance of text matching <regex>.


    *   N - previous instance of text matching <regex>.


    *   :n - next file when multiple files are opened in the same command.


    *   :p - previous file when multiple files are opened in the same command.


    *   q - quit.


    head


    This command outputs the first n -number of lines of a file. If n is not specified,
    it defaults to ten. The example below shows the default use of head for the file
    /etc/passwd.


    | $ head /etc/passwdroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologinsys:x:3:3:sys:/dev:
    /usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncgames:x:5:60:games:/usr/games:/usr/sbin/nologinman:x:6:12:man:/var/cache/man:/usr/sbin/nologinlp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologinmail:x:8:8:mail:/var/mail:/usr/sbin/nologinnews:x:9:9:news:/var/spool/news:/usr/sbin/nologin$
    |


    To output the first six lines of the file /etc/passwd, type this instead:


    | $ head -n6 /etc/passwdroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologinsys:x:3:3:sys:/dev:
    /usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncgames:x:5:60:games:/usr/games:/usr/sbin/nologin$
    |


    The opposite of head is tail which we will explain next.


    tail


    The tail command outputs the last n -number of lines of a file. If n is not specified,
    it defaults to ten lines. The example below displays the last 5 lines of the file
    /etc/passwd.


    | $ tail -n5 /etc/passwdusbmux:x:109:46:usbmux daemon,,,:/var/lib/usbmux:/bin/falsepulse:x:110:114:PulseAudio
    daemon,,,:/var/run/pulse:/bin/falselightdm:x:111:116:Light Display Manager:/var/lib/lightdm:/bin/falsefelix:x:1001:1001:Felix,,,:/home/felix:/bin/bashcaro:x:1002:1002:Caro,,,:/home/caro:/bin/bash$
    |


    In addition, tail can be used to follow the progress of a log file by using -f
    (or --follow). As more data gets appended to the end of the file, the output on
    the screen updates. To output the progress of the last 20 lines of /var/log/syslog
    as it updates, use the following command:


    | $ tail -f -n 20 /var/log/syslog |


    sort


    As the name implies, this command is used to sort files. Among others it has the
    following options:


    *   -R: random sort.


    *   -r: reverse the sort order.


    *   -n: sort numerically.


    To sort the first five lines of the file /etc/passwd in alphabetical order, use
    this command:


    | $ head -n5 /etc/passwd &#124; sortbin:x:2:2:bin:/bin:/usr/sbin/nologindaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinroot:x:0:0:root:/root:/bin/bashsync:x:4:65534:sync:/bin:/bin/syncsys:x:3:3:sys:/dev:/usr/sbin/nologin$
    |


    Use the option -r to reverse the sort order:


    | $ head -n5 /etc/passwd &#124; sort -rsys:x:3:3:sys:/dev:/usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologin$
    |


    uniq


    This command reports or removes duplicate lines from a sorted file. Among others,
    it has the following options:


    *   -c (short for --count): outputs the frequency of occurrence for each line.


    *   -d (short for --repeated): reports the lines that occur more than once.


    *   -u (short for --unique): reports the lines that appear only once.


    The example below shows the basic usage of uniq . The output contains each line
    that only occurs once.


    | $ cat names.sortedGreg     1967John     1986John     1986Kate     1948Pete    
    1977$ uniq names.sortedGreg     1967John     1986Kate     1948Pete     1977$ |


    cut


    The cut command extracts specified fields from files. It requires a delimiter
    in order to detect the field boundaries. The following example displays the name
    and the user ID from the file /etc/passwd. These are the first and third fields
    from each line (option -f ), and the fields are separated by a colon (option -d
    ).


    | $ cut -d":" -f1,3 /etc/passwd...colord:108saned:109usbmux:110geoclue:111sshd:112uuidd:113pulse:114rtkit:115avahi:116...$
    |


    tr


    The idea behind this command is to translate, to substitute, and to delete characters
    from a string. tr reads from stdin and outputs to stdout . It has the following
    options:


    *   -d (short for --delete): deletes the given characters from the string.


    *   -s (short for --squeeze-repeats): replaces repeated characters with a single
    occurrence.


    *   -t (short for --truncate-set1): truncates the given set of characters.


    The first example shown below demonstrates how to convert lower case to upper
    case characters. tr accepts two sets of characters: the originals and the replacements.
    The number of characters in both sets must be the same.


    | $ cat bigfilethis is file onethis is file twothis is file three$ cat bigfile
    &#124; tr [a-z] [A-Z]THIS IS FILE ONETHIS IS FILE TWOTHIS IS FILE THREE$ |


    The second example demonstrates how to replace repeated spaces with a single one.
    A space is defined as a group of characters, being spaces, tabulators, carriage
    return, or linefeed.


    | $ echo "tools for        developers" &#124; tr -s [:space:]tools for developers$
    echo "tools for        developers" &#124; tr -s [:space:] "-"tools-for-developers$
    |


    diff


    This tool analyzes two files and prints the lines that are different. Moreover,
    diff outputs a description of which steps are needed to transform the first file
    into the second file. The example below demonstrates this for two files. The output
    line 1c1 means that the first line of file1 has to be changed to get the first
    line of file2\. Below that is the referenced lines from the two files separated
    by dashes.


    | $ cat file1this is file onewith a second line$ cat file2this is file twowith
    a second line$ diff file1 file21c1< this is file one---> this is file two$ |


    nl


    nl is similar to cat (discussed at the beginning of this chapter) but adds a line
    number at the beginning of each line of output.


    | $ nl places     1 Amsterdam     2 Berlin     3 Bern     4 Cape Town$ |


    wc


    This command abbreviates the phrase word count and respectively counts lines,
    words, and single characters of the input data. Unless otherwise specified, all
    three values are printed:


    | $ wc places 4  5 32 places$ |


    Amongst others wc offers the following options to limit the output:


    *   -l: outputs the number of lines only, followed by the filename.


    *   -w: outputs the number of words only, followed by the filename.


    *   -c: outputs the number of characters only, followed by the filename.


    This example shows how to count only the lines in a file:


    | $ wc -l places4 places$ |


