    Mint 是一个非商业性的发行版，它基于 `Ubuntu` 并遵循相同的发布方案。其首次发布可以追溯到 2006 年。截至 2014 年，每年发布两次，在
    `Ubuntu` 发布一个月后发布。版本的代号是以字母 a 结尾的女性名字，例如版本 6 的代号 `Felicia`。Linux Mint 支持 `IA-32`
    和 `amd64` 两种架构。


    ![](img/Image00004.gif)


    # 红帽企业 Linux (RHEL)


    RHEL 是一种商业 Linux 发行版。它基于 Red Hat Linux（于 1995 年至 2004 年间）以及 `Fedora` 19 和 20 的组合。其原始发布日期追溯到
    2000 年。它对企业客户的关注包括长期支持、培训和认证计划（见第 1 章）。红帽的社区项目被称为 `Fedora`（见下文）。


    软件包以 `.rpm` 格式（红帽软件包管理器）提供。RHEL 支持 `arm`（64 位）、`i386`、`amd64`、`powerpc` 以及 `s390`
    和 `zSeries`。该发行版同时针对服务器和桌面。版本的代号似乎是随机的，因为它没有遵循类似于 `Debian` 或 `Ubuntu` 使用的方案。


    ![](img/Image00005.gif)


    # Fedora


    Fedora 是一个主要面向桌面用户的社区级 Linux 发行版。它基于红帽企业 Linux (`RHEL`) 并由红帽赞助。它于 2003 年推出，当时
    Red Hat Linux 的支持结束。截至 2020 年，它提供以下版本：


    *   Workstation（工作站）：针对 `pc`。

    *   Server（服务器）：针对服务器。

    *   IoT：针对 IoT 生态系统。


    Fedora 支持 `amd64`、`armhf`、`powerpc`、`MIPS`、`s390` 和 `RISC-V` 架构。该发行版的周期较短，大约每
    6 个月发布一个新版本。版本的代号没有遵循固定的命名方案，主要由城市名称组成。


    ![](img/Image00006.gif)


    # CentOS


    CentOS 是“社区企业操作系统”（Community Enterprise Operating System）的缩写。与 Fedora 一样，它基于红帽企业
    Linux，并在二进制软件包上保持兼容。这允许在 CentOS 上使用最初针对 `RHEL` 设计和开发的软件。与 Fedora 不同，它侧重于桌面和服务器的企业级使用，并提供长期支持。CentOS
    的首次发布可以追溯到 2004 年 5 月。其软件软件包来自三个不同的仓库：


    *   Base（基础库）：常规、稳定的软件包。

    *   Updates（更新）：安全、错误修复或增强更新。

    *   Addons（附加组件）：构建构成主 CentOS 发行版的较大软件包所需的包，但这些包在上游并不提供。


    CentOS 支持 `i386` 和 `amd64` 架构。不支持其他架构。


    ![](img/Image00007.gif)


    # openSUSE


    openSUSE Linux 发行版的根源于 `SUSE Linux` 和商业版的 `SUSE Linux Professional`，后者于 1994 年首次发布。`SUSE`
    名字是原始德国所有者 `Gesellschaft für Software- und Systementwicklung GmbH` 的缩写。


    openSUSE 基于 Red Hat Linux 和 `Slackware` 的结构，并使用 `.rpm` 作为软件存档格式。它支持 `i586`、`x86-64`
    和 `ARM` 架构。openSUSE 项目旨在每八个月发布一个新版本。与 Fedora 类似，版本的代号没有遵循固定的命名方案。


    ![](img/Image00008.gif)


    # Arch Linux


    Arch Linux 是一个免费的 Linux 发行版，于 2002 年首次发布。它遵循滚动发布（rolling release）原则，导致发行每月每月更新。目前，核心团队由约
    25 名开发者组成，并受到许多被称为“信任用户”的其他开发者支持。Arch Linux 使用 `Pacman` 作为软件包管理系统。软件包存储在四个软件仓库中：


    *   Core（核心）：基础系统的软件包。

    *   Extra（额外）：如桌面环境和数据库等附加软件包。

    *   Community（社区）：由信任用户维护的软件包。

    *   Multilib：可以在多个架构上使用的软件包。


    Arch Linux 支持 `amd64` 架构。2007 年之前的早期版本代号没有遵循特定方案，最近的发布遵循标准的数字格式。


    ![](img/Image00009.gif)


    # Gentoo


    与 Arch Linux 一样，Gentoo 也遵循滚动发布原则。每周提供新的安装镜像，首次发布于 2002 年。Gentoo 的特殊之处在于它是一个基于源码的发行版。在安装软件之前，必须先进行编译。支持的架构包括
    `alpha`、`amd64`、`arm`、`hppa`、`IA-64`、`m68k`、`MIPS`、`powerpc`、`s390`、`sh` 和 `sparc`。


    ![](img/Image00010.gif)


    # Slackware


    Slackware 是最老的活跃 Linux 发行版。首次发布追溯到 1992 年。定期发布没有固定间隔。它面向专业用户并尽可能给予他们自由。Slackware
    使用压缩的 `.tar.gz` 存档作为软件包格式，支持 `i486`、`alpha`、`sparc` 和 `arm` 四种架构。该发行版也移植到了 `s390`
    架构。


    # 4. 设置 Linux 系统


    如前一节所述，我们将使用 `Debian` 进行演示。回顾一下，`Debian` 是一个提供极佳性的发行版，一旦你的技能和知识超过了初级阶段，它的扩展性就非常出色。在本章中，我们将安装并配置
    `Debian`，向你展示过程中的每一个步骤。


    ## 4.1 安装类型


    Debian 提供了多种正确设置的方法。这包括图形界面安装和文本安装；我们将使用前者。对于安装媒体，Debian 开发者提供了三种变体：


    *   适用于 32 位和 64 位的 CD 或 DVD。

    *   适用于 32 位和 64 位的网络镜像（所谓的 `Netinst-ISO`）。

    *   适用于 32 位或 64 位的微 CD。


    我们还提供了测试媒体。这些包括 32 位和 64 位的 Live 镜像，允许你在将 Debian 安装到电脑之前进行尝试。在编写本指南期间，版本 10 是
    Debian 的当前稳定版本。这里描述的设置基于此版本和 `amd64` 架构。


    从 [www.debian.org/distrib](http://www.debian.org/distrib) 下载网络镜像后，不再需要静态镜像。相反，它取决于你的互联网连接以检索要安装的软件包并保持操作系统更新。


    整个过程将花费你大约小时，并允许你根据特定需求进行精简的软件选择。你不需要的软件包将不会出现在你的系统中。然而，当你觉得需要时，可以随时添加。


    我们安装的目标系统是一个基于 `XFCE` 的单用户桌面系统，带有网络浏览器和音乐播放器。对于网络浏览器，我们使用 `Mozilla Firefox`；对于音乐播放器，使用
    `VLC`。这两个程序都是 Linux 发行版的永久组件。我们用于演示的环境是一个基于 `VirtualBox` 的虚拟机，拥有 4 GB 内存和 8 GB
    磁盘空间。


    ## 4.2 逐步安装 Linux


    ### 启动菜单


    要开始安装 Debian，首先从你下载的 ISO 镜像启动计算机（在本例中为 `VirtualBox` 镜像）。如果你也使用虚拟机，请参考你的虚拟机供应商网站获取如何启用
    ISO 镜像的帮助。接下来，等待启动菜单在屏幕上出现。下面的图像显示了提供的不同选项。使用光标键可以在启动菜单中导航，回车键选择项目。


    ![](img/Image00011.gif)


    不同的选项有：


    *   图形化安装：使用图形化安装程序启动安装过程。

    *   安装：使用文本安装程序启动安装过程。

    *   高级选项：选择更多选项，如专家模式、自动安装或救援模式（详细信息见下图）。

    '
- fmt: '

    *   Accessible dark contrast installer menu: switch to a black-and-white theme
    with higher contrast.

    *   Help: get further help.

    *   Install with speech synthesis: starting the installation process with speech
    support.


    ![](Image00012.gif)


    From the main boot menu choose the entry `Graphical install`, and press the `Enter`
    key to proceed.


    ## Language Selection


    Next, choose the language you prefer to be used during the entire installation
    process. The dialogs and messages are translated accordingly. This selection does
    not irrevocably determine the language your Linux system will have, you can always
    choose a different language later.


    The image below shows the dialog box. English is already pre-selected, and so
    you just have to click the `Continue` button on the lower-right corner of the
    dialog box to proceed.


    ![](Image00013.gif)


    ## Location Selection


    Third, make a selection regarding your location (see image below). Based on your
    language setting made before, the countries are listed in which the chosen language
    is mainly spoken. This also influences the locale settings like the time zone
    your computer is in. To have a different setting choose the entry titled `other`
    from the end of the list and go on from there. When you are done, click the `Continue`
    button to proceed with step four.


    ![](Image00014.gif)


    ## Keyboard Selection


    Fourth, choose your keyboard layout from the list (see image below). For the United
    States, the pre-selection is American English. If you use a different keyboard
    layout select the correct one from the list. If done click the `Continue` button
    to proceed with step five.


    ![](Image00015.gif)


    ## Network Setup


    Step five includes loading the installer components from the ISO image, and the
    detection of the network hardware to load the correct network driver. Then, the
    installer tries to connect to the internet to retrieve an IP address via `DHCP`
    from your local network server.


    When done, you can set up the hostname of your computer (see below). Choose a
    unique name for your machine that consists of a single name and does not exist
    yet in your local network segment. It is common to use names of fruits, places,
    musical instruments, composers, and characters from movies. In this case, we choose
    the name `debian106` that simply represents the Linux distribution and its version
    number.


    ![](Image00016.gif)


    When you are done, click the `Continue` button to proceed with step six to add
    a domain name like `yourcompany.com`. In this case, it is not needed. That''s
    why we leave the entry field empty. Click the `Continue` button on the lower-right
    corner to proceed with the installation.


    ![](Image00017.gif)


    ## Users and Roles


    Our Linux system needs at least two users to be operated properly. One is an administrative
    user that has a fixed name `Root` and the other is a regular user that we just
    give the name of `User` in this case.


    In the next two steps, you set the password for the root user and both the full
    name and account name for the regular user. For simplicity, we use `Debian User`
    as the full name and `User` as the account name. For both users, choose a password
    that is dissimilar and that you can remember. You will need these passwords later
    to log onto your computer.


    ![](Image00018.gif)


    ## Time Zone


    Setting the correct time zone is of significant importance for communication with
    other services, especially in a network. Choose the value from the list as seen
    in the image below. The entries in the list are based on the location you have
    selected before. When done, click the `Continue` button to define the storage
    media and the accompanying partitions.


    ![](Image00019.gif)


    ## Storage Media and Partitioning


    A Linux system can be distributed across several different storage media like
    hard disks and flash drives. Over and above, storage media can be separated into
    multiple disk partitions. To do so, the setup program has the following methods
    available:


    *   Guided - use entire disk: follow the steps as provided and use the entire
    disk space for the Linux installation. This creates partitions with fixed sizes.

    *   Guided - use entire disk and set up LVM: follow the steps as provided and
    use the entire disk space for the Linux installation. This option makes use of
    Logical Volume Management (`LVM`) to create partitions with sizes that can be
    changed later on.

    *   Guided - use entire disk and set up encrypted LVM: follow the steps as provided
    and use the entire disk space for the Linux installation. This option makes use
    of Logical Volume Management (`LVM`) to create encrypted partitions with sizes
    that can be changed later on.

    *   Manual: create partitions individually. This is the expert mode and requires
    deeper knowledge about partitions and filesystem parameters.


    ![](Image00020.gif)


    From the list choose the entry `Guided - use entire disk`. The values for partition
    sizes are chosen according to experience, implemented as an algorithm. A manual
    calculation is not required. Click the `Continue` button on the lower-right corner
    to proceed with the installation.


    Next, select the disk to partition. In our case, we have only one disk available
    (see image below). Later on in this guide, the disk will be referred to as `/dev/sda`
    for the first SCSI disk.


    ![](Image00021.gif)


    A disk partition refers to a piece of the storage media that is organized separately
    and is intended to contain a branch of the Linux filesystem tree. There is no
    universal way to do this separation correctly. This guide shows a simple but safe
    solution that works for a basic system. The menu in the dialog box offers the
    following options:


    *   All files in one partition: use just a single partition to keep programs and
    user data.

    *   Separate `/home` partition: store programs and user data in separate partitions.

    *   Separate `/home`, `/var`, and `/tmp` partitions: keep user data, variable
    data and temporary data in separate partitions (available on some distributions).


    As shown in the image below, choose the second entry `Separate /home partitions`
    . Click the `Continue` button to proceed with the installation.


    ![](Image00022.gif)


    The next step is to confirm the partition scheme. This is calculated automatically
    based on experience and contains these partitions:


    *   `sda1`: the first partition of the first SCSI disk is a primary partition
    with a size of 2.8 GB, formatted with the `ext4` filesystem, and referred to as
    the root part of the filesystem tree (indicated with `/`).

    *   `sda5`: the fifth partition of the first SCSI disk is a logical partition
    with a size of 2.1 GB, formatted as a swap filesystem.

    *   `sda6`: the sixth partition of the first SCSI disk is a logical partition
    with a size of 3.6 GB, formatted with the `ext4` filesystem and reserved to store
    user data, referred to as home directories (indicated with `/home`).


    Due to historical reasons, a hard disk can contain four primary partitions only.
    The fourth one is called an Extended Partition if divided into so-called logical
    partitions or logical drives. In our case the logical partitions `/dev/sda5` and
    `/dev/sda6` are stored on the primary partition `/dev/sda4`. The partitions `/dev/sda2`
    and `/dev/sda3` are not in use.


    ![](Image00023.gif)


    From the above list, choose the entry `Finish partitioning and write changes to
    disk`. Click the `Continue` button on the lower-right corner to proceed and to
    confirm the partition scheme (see image). Choose `yes` from the list and click
    the `Continue` button to partition the disk. Note that all the data on the selected
    storage device will be lost and the disk will be empty.


    ![](Image00024.gif)


    Having divided the storage media into single partitions, the partitions will be
    formatted with the filesystem as defined before. In our case, the partitions `/dev/sda1`
    and `/dev/sda6` will get an `ext4` filesystem, and the partition `/dev/sda5` will
    get a swap filesystem. As soon as this step is completed, the base system of Debian
    will be installed next.


    ## Package Management

