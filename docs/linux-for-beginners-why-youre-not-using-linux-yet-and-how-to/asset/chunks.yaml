    ```


    ## 7.2 Introduction to grep


    命令行工具 `grep` 是 Linux 中最基础且强大的命令之一，以至于有作者专门为它编写了指南。`grep` 作为一个过滤器，只打印匹配模式的文本行。


    该命令在文本数据上工作，并结合一个要查找的模式。在此语文中，数据指的是来自 `stdin` 或文件的字符序列，模式可以格式化的字符序列或正则表达式。`grep`
    支持四种模式样式：


    * `-G`（`--basic-regexp`）：模式格式为基础正则表达式。这是默认情况。

    * `-F`（`--fixed-strings`）：模式不是正则表达式，而是被解释为固定字符串。也可以缩写为 `fgrep`。

    * `-E`（`--extended-regexp`）：模式格式为扩展正则表达式，允许一组额外的字符集。也可以缩写为 `egrep`。

    * `-P`（`--perl-regexp`）：模式按照遵循 Perl 语法的正则表达式进行解释。


    `grep` 提供的选项非常多。以下是几个值得注意的选项列表：


    * `-c`: 统计并打印匹配的数量，但不打印匹配项本身。


    '
- fmt: '

    - `--color`: highlights the matches from the search.

    - `-H` (short for `--with-filename): each line of output starts with the name
    of the file the match was found in.

    - `-i`: ignores case-sensitivity and includes both lower and uppercase matches.

    - `-l` (short for `--files-with-matches): prints only the filenames that match
    the search.

    - `-L` (short for `--files-without-matches): prints only the filenames that did
    not match the search.

    - `-n` (short for `--line-number): each line of output starts with the line number
    of the corresponding match in the file.

    - `-r` (short for `--recursive): search recursively in a directory structure to
    include all subdirectories in the search.

    - `-v`: prints all lines that do not match the search pattern.


    These options will become clearer with the help of a few practical examples. First,
    we will search for the fixed string `Linux` in one or more AsciiDoc files (`.adoc`).
    The output consists of the lines that contain the pattern.


    ```bash

    $ grep Linux *.adoc

    The Linux Environment. First Steps$

    ```


    Next, we perform the same search but also output the filename and line number
    the pattern was found in. Each line of output starts with the name of the file
    followed by a colon (`:`), the line number, another colon, and then the line that
    matches the pattern. In our example, the pattern was found in line 1 of the file
    `introduction.adoc`.


    ```bash

    $ grep -Hn Linux *.adoc

    introduction.adoc:1:The Linux Environment. First Steps.$

    ```


    This time round, we will again search for the string `Linux` in one or more AsciiDoc
    files, but we will include both lowercase and uppercase characters in the search.


    ```bash

    $ grep -i Linux *.adoc

    The Linux Environment. First Steps.include::what-about-linux/what-about-linux.adocinclude::linux-in-day-to-day-life/linux-in-day-to-day-life.adocinclude::navigating-linux/navigating-linux.adocinclude::using-the-linux-terminal/using-the-linux-terminal.adoc$

    ```


    Next, we will reverse our search and only show the names of files that do not
    contain the pattern `Linux`.


    ```bash

    $ grep -vrl Linux */*.adoc

    acknowledgements/acknowledgements.adocgetting-help/getting-help.adoclinux-in-day-to-day-life/linux-in-day-to-day-life.adocnavigating-linux/navigating-linux.adocpreface/preface.adocreferences/references.adocsetting-up-debian/setting-up-debian.adocsoftware-licenses/software-licenses.adocus-the-linux-terminal/using-the-linux-terminal.adocwhat-about-linux/what-about-linux.adocx11/x11.adoc$

    ```


    Let''s now look at a few examples that are slightly more complex. In this instance,
    we will make use of the `ls` command we''ve seen earlier in the guide and filter
    the output for a specific pattern range. More specifically, we will search for
    PDF documents that have the numbers 12 to 16 in the filename.


    ```bash

    $ ls E*.pdf | egrep --color ''1[2-6].pdf$''

    E_20160012.pdfE_20160013.pdfE_20160014.pdfE_20160015.pdfE_20160016.pdf$

    ```


    For the next example, we will search all the TeX files in the current directory
    that contain the pattern `nanostation` (a product name) with either an uppercase
    or lowercase `n` at the beginning, and either an uppercase or lowercase `s` in
    the middle of the name.


    ```bash

    $ egrep --color ''[Nn]ano[Ss]tation'' *.tex

    B0047.tex:Ubiquiti NanoStation M2B0057.tex:Ubiquiti Nanostation M2 LocoB0092.tex:Ubiquiti
    Nanostation M5$

    ```


    Lastly, we list all the software packages that are no longer installed on the
    system but are still configured. Here we use the `dpkg` command, which you will
    learn more of in Chapter 14. In our example, it simply lists the installed packages
    and their status. The `grep` command then filters all the lines that start with
    the two characters `rc`, which stands for `removed` and `configured`.


    ```bash

    $ dpkg -l | egrep ''^rc''

    rc doxygen-gui 1.8.8-5 amd64 GUI configuration tool for doxygen

    rc kdiff3 0.9.98-1 amd64 compares and merges 2 or 3 files or

    rc ktorrent 4.3.1-2+b1 amd64 BitTorrent client based on the KDE platform

    rc libacpi0 0.2-4 amd64 general purpose library for ACPI...$

    ```


    ## 7. Combining Commands


    Linux commands on their own are already quite powerful, but you can boost their
    functionality even further by combining them using a pipe or redirecting the input/output.
    We will demonstrate how to achieve this below.


    ### Piping


    Piping (using the keyboard character `|` found above the `\`) is a way of connecting
    two or more commands in a chain. The output of one command is not sent to `stdout`
    but directly given as an input to the next command. This direct connection between
    commands allows them to operate simultaneously and permits data to be transferred
    directly between them continuously, rather than having to pass it through temporary
    text files or the display screen. Pipes are unidirectional, in other words, data
    flows from left to right through the pipeline. The example below shows the two
    commands `cat` and `wc` being used to count the number of words in a file.


    ```bash

    $ cat file2

    this is file twowith a second line

    $ cat file2 | wc -w

    8

    ```


    ### Redirection


    Redirection is a feature in Linux that, when executing a command, can change the
    standard input/output devices. The basic workflow of any Linux command is that
    it takes an input and gives an output. The standard input (`stdin`) device is
    the keyboard, and the standard output (`stdout`) device is the screen. With redirection,
    the standard input/output can be changed. You can read the processed data from
    a different input source, and output the result to a different place. Output redirection
    is indicated by the `>` and `>>` symbols, and input redirection by the `<` symbol:


    - The `>` symbol sends the output to the given file by creating a new file. If
    the file already exists it will be entirely replaced.

    - The `>>` symbol sends the output to the given file and appends it at the end.

    - The `<` symbol reads from the given input source.


    The first example below uses the `>>` operator and adds a third line of text at
    the end of an existing file.


    ```bash

    $ echo "line 3" >> file2

    $ cat file2

    this is file twowith a second line

    line 3

    ```


    The second example goes one step further by redirecting the standard output to
    a device. The `cat` command reads the file `music.mp3` and sends the output to
    the device `/dev/audio` which is the audio device. If the sound configuration
    in your computer is correct, this command will play the music file.


    ```bash

    $ cat music.mp3 > /dev/audio

    ```


    The next example combines input and output redirection. The `wc` command reads
    the contents from `file2` and counts the words using the option `-w`. The output
    is then sent to `stdout` and appended as a new line using the `>>` operator to
    the file `statistics`.


    ```bash

    $ cat file2

    this is file twowith a second line

    line 3

    $ wc -w < file2

    10

    $ wc -w < file2 >> statistics

    $ cat statistics

    10

    ```


    ## 8. The Linux Boot Process


    ### 8.1 Startup and Boot Order


    We start by looking at the first process in all Linux systems, the boot process.
    Starting up a UNIX/Linux system is a complex multi-part process, which consists
    of the following high-level steps:


    1. The Basic Input Output System (BIOS) executes the Master Boot Record (MBR).
    Newer systems use the Unified Extensible Firmware Interface (UEFI).

    2. The MBR executes a boot loader, such as the Grand Unified Bootloader (GRUB)
    or the Linux Loader (LILO).

    3. The boot loader then executes the Linux kernel.

    4. The Linux kernel runs the `init` process via `/sbin/init` to start the operating
    system.

    5. `Init` then executes `init.d` with runlevels or `systemd`.


    These steps are explained in more detail below.


    ### BIOS and UEFI

