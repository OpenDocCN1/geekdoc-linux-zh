    ## 7. 组合命令


    Linux 命令本身已经非常强大了，但你可以通过管道组合它们或重定向输入/输出来进一步增强其功能。我们将在下面演示如何实现这一点。


    ### 管道 (Piping)


    管道（使用键盘上位于 `\` 上方的字符 `|`）是将两个或多个命令连接成链的方法。一个命令的输出不会发送到 `stdout`，而是直接作为下一个命令的输入。命令之间的这种直接连接允许它们协同工作。下面的示例展示了
    `cat` 命令和 `wc` 命令通过管道统计文件的单词数。


    ```bash

    $ cat file2

    this is file twith a second line

    $ cat file2 | wc -w

    8

    ```


    ### 重定向 (Redirection)


    重定向是一种改变标准输入输出设备的功能，在执行命令时，它可以改变输入/输出。标准输入 (`stdin`) 是键盘，标准输出 (`stdout`) 是屏幕。重定向由
    `>`、`>>` 和 `<` 符号指示：`>` 将输出发送到指定的文件（如果文件已存在则会被完全替换）；`<` 则从指定的输入源读取数据。下面的第一个示例使用
    `>>` 运算符在现有文件的末尾添加第三行文本。


    ```bash

    $ echo "line 3" >> file2

    $ cat file2

    this is file twith a second line

    line 3

    ```


    第二个示例通过重定向标准输出更进一步。`cat` 命令读取 `music.mp3` 并将其输出发送到设备 `/dev/audio`，它是音频设备。


    ```bash

    $ cat music.mp3 > /dev/audio

    ```


    下一个示例结合了输入输出重定向。`wc` 命令从 `file2` 读取内容并使用选项 `-w` 统计单词。输出随后发送到 `stdout` 并通过 `>>`
    运算符追加到文件 `statistics`。


    ```bash

    $ cat file2

    this is file twith a second line

    line 3

    $ wc -w < file2

    10

    $ wc -w < file2 >> statistics

    $ cat statistics

    10

    ```


    ## 8. Linux 启动过程


    ### 8.1 启动和引导顺序


    我们首先查看所有 Linux 第一个进程，启动过程。启动 UNIX/Linux 系统是一个复杂的多个过程，包含以下高级步骤：


    1. 基础输入输出系统 (BIOS) 执行主引导记录 (MBR)。较新的系统使用统一扩展固件接口 (UEFI)。

    2. MBR 执行引导加载程序，例如通用引导加载程序 (GRUB) 或 Linux Loader (LILO)。

    3. 引导加载程序随后执行 Linux 内核。

    4. Linux 内核通过 `/sbin/init` 运行 `init` 进程以启动操作系统。

    5. `Init` 然后执行运行级别的 `init.d` 或 `systemd`。


    这些步骤将在下面详细解释。


    ### BIOS 和 UEFI


    '
- fmt: '

    Either the `BIOS` or the `UEFI` is run when starting the computer. This software
    is delivered from a vendor-specific firmware memory chip on the computer''s motherboard,
    specific to that motherboard. The `BIOS` or `UEFI` first performs some system
    integrity checks. Then it searches the hard drives, CD/DVD drives, USB drives,
    and the network in a pre-selected order and boots the first boot loader program
    it finds. This boot loader is then loaded into memory and takes control of the
    system. In simple terms, the `BIOS` or `UEFI` loads and executes the boot loader.


    At startup there is usually an option to press `F1`, `F2`, `F12`, `Escape` or
    `Delete` to enter the `BIOS` or `UEFI` menu. The boot loader search sequence can
    be changed from here. Once changes are made, usually the `F10` key saves the changes
    and restarts the system with the new settings. With most modern systems, `BIOS`
    is no longer used and has been replaced by `UEFI BIOS`. `UEFI BIOS` is maintained
    by the Unified EFI Forum. Support for `UEFI` by Debian is part of the default
    setup.


    Compared to `BIOS`, `UEFI` has the following advantages:


    * The ability to use large-capacity disks (over 2 Terabytes) with a GUID Partition
    Table (`GPT`).

    * CPU-independent architecture.

    * CPU-independent drivers.

    * A flexible pre-OS environment that includes network capability.

    * A modular design.

    * Backward and forward compatibility.


    To determine if a Debian system is booted via `UEFI`, check for the directory
    `/sys/firmware/efi`. If that directory exists, the system is running in `UEFI`
    mode. A system without `UEFI` will return the following:


    | $ ls /sys/firmware/efils: cannot access /sys/firmware/efi: No such file or directory$
    |


    ## MBR


    The Master Boot Record (`MBR`) is located in the first sector of the bootable
    disk. Typically, this is either `/dev/hda` or `/dev/sda`. It contains all information
    about the logical partitions on the disk. The `MBR` is less than 512 bytes in
    size and has the following three components:


    1. Primary boot loader info in the first 446 bytes.

    2. Partition table info in the next 64 bytes.

    3. `MBR` validation check (signature) in the last two bytes.


    The `MBR` contains information about `GRUB`. So in simple terms, it loads and
    executes the `GRUB` boot loader. The contents of the `MBR` may be viewed by combining
    the two commands `dd` (disk dump) and `hexdump` from the `coreutils` package and
    `bsdmainutils` package in the following manner:


    ```

    # dd if=/dev/sda bs=512 count=1 | hexdump -C

    ```


    In the above code, `dd` reads the contents of the first SCSI disk `/dev/sda`,
    block by block as chunks of 512 bytes. The option `count=1` limits this step to
    reading the first block only. Then the output of `dd` is piped to `hexdump` using
    the option `-C`. The output of `hexdump` is shown as ASCII characters. The example
    below illustrates this in more detail.


    ![](Image00050.gif)


    The `dd` command can also be used to create a backup of the `MBR` as shown below.
    The output file is `mbr.bin` and is specified using the option `of=mbr.bin`, where
    `of` abbreviates from output file.


    ```

    # dd if=/dev/sda bs=512 count=1 of=mbr.bin

    1+0 records in1+0 records out512 bytes copied, 0.000371249 s, 1.4MB/s

    # file mbr.bin

    mbr.bin: DOS/MBR boot sector

    ```


    ## GRUB


    The software that handles the Linux startup is called the Grand Unified Bootloader
    (`GRUB`), or `GNU GRUB` to be precise. Its function is to take over from the `BIOS`
    at boot time, load itself, load the Linux kernel into memory, and then turn over
    execution to the Linux kernel. Once the kernel takes over, `GRUB` has done its
    job and is no longer needed.


    Note that `GRUB` version 1 has been replaced by `GRUB2`, the former is now referred
    to as `GRUB Legacy`. For simplicity, `GRUB2` is simply called `GRUB`.


    At boot time, `GRUB` displays a splash screen and presents a menu from which to
    start the system. The more Linux kernel images present on the system, the longer
    the list of entries. The image below shows the default installation with two menu
    entries. Unless stated otherwise, the first menu points to the default entry.


    ![](Image00037.gif)


    `GRUB` waits for a few seconds, then loads the kernel image selected from the
    menu. The first entry targets the default image specified in the `GRUB` configuration
    file `/boot/grub2/grub.cfg`. This configuration file is first generated during
    Linux installation and automatically regenerated whenever a new Linux kernel is
    installed.


    ### Linux Kernel


    In this step, the root filesystem is mounted as specified in the entry `root=`
    found in the `GRUB` configuration file. Then the kernel executes the `/sbin/init`
    program. The kernel uses a file called `initrd`, short for Initial RAM Disk, as
    a temporary root filesystem until the kernel is booted and the real root filesystem
    is mounted. It contains all necessary drivers to access hard drive partitions,
    filesystems, and other hardware components.


    ## 8.2 Alternative Boot Loaders


    `GRUB` is not the only boot loader in the open-source world. Other boot loaders
    include:


    * `BURG` - The name abbreviates to Brand-new Unified Loader from `GRUB` (a bit
    of a stretch to get the reverse naming of `GRUB` if you ask us). It is an offshoot
    of `GRUB` with much more room for individual configuration.

    * `SYSLINUX` - A lightweight boot loader for networks and CD/DVD drives.

    * `ISOLINUX` - A boot loader from the `SYSLINUX` project, which is generally used
    for Linux Live CDs and bootable install CDs.

    * `gummiboot` - A boot loader for EFI-based computers with a text-mode interface.
    It is intended to be a minimal alternative to GNU `GRUB` that detects detectsable
    images (including Linux kernel images, operating systems, and other boot loaders),
    does not require a configuration file, provides a basic menu-based interface,
    and can also integrate with `systemd` to provide performance data.

    * `Libreboot` - A lightweight system designed to perform only the minimum number
    of tasks necessary to load and run a modern 32-bit or 64-bit operating system.
    The image below shows the menu for `Libreboot`.

    * `rEFInd` - A boot manager for EFI-based computers that features a GUI. `rEFInd`
    can be used to boot multiple operating systems, and it also provides a way to
    enter and explore the EFI pre-boot environment.


    ![](Image00051.jpg)


    ## 8.3 Reviewing the Boot Process


    Linux generates a log file to enable a review of the boot process and to read
    its accompanying messages. Before Linux 8, the boot log was stored as a text file
    in `/var/log/boot`. Linux 8 introduced `systemd` and the format and location changed.
    To retrieve the boot log, use `journalctl` as follows (must be root):


    ```

    # journalctl -b

    ```


    `systemd` stores log messages in a special format. `journalctl` reads the log
    and displays messages in chronological order. The earliest entry comes first and
    the entries can be scrolled back and forth using the arrow keys. The output consists
    of four columns: date (timestamp), hostname, message type kernel, and the message
    itself.

