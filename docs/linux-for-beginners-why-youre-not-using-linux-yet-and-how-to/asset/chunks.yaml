    (short for --list) along with the username. The example below lists the details
    for the user named user .


    | # chage -l userLast password change     :     Aug 20, 2020Password expires  
      :     neverPassword inactive     :     neverAccount expires     :     neverMinimum
    number of days between password change     :     0Maximum number of days between
    password change     :     99999Number of days of warning before password expires  
      :     7# |


    As you can see from the above example, the account does not have an expiration
    date. In order to set this value to 31 December 2019, invoke the usermod command
    with the option -e (short for --expiredate) along with the username.


    | # usermod -e 2019-12-31 user |


    To lock and unlock the user account the usermod command has two options -L (short
    for --lock) and -U (short for --unlock). The next example locks the account for
    the user named user . The user can still work and finish his session but is not
    able to log into the system anymore.


    | # usermod -L user |


    /etc/group


    This file contains the user group attributes. Each line consists of four columns,
    and the columns are separated once again by a colon. The attributes are the group
    name, the password, the group ID, and the list of its members. The groupname attribute
    is similar to the username attribute and refers to the UNIX group name, which
    must be a unique name on the system. The password field contains an x because
    the value has been moved to the file /etc/gshadow, and the field is kept only
    for backward compatibility.'
