    \ also named a symbolic link, is a link to another filename in the filesystem.\
    \ It is much like a shortcut on a Windows-based system. Unlike a hard link, a\
    \ symbolic link does not contain the data in the target file, it simply points\
    \ to another entry somewhere in the filesystem. This difference gives symbolic\
