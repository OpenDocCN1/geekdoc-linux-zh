    At first glance, a shell script may sound daunting but it is quite straightforward.
    In the simplest form, it is just a sequence of `UNIX/Linux` commands that are
    stored in a file, and are executed line-by-line by the command line interpreter.
    A shell script is similar to typing single commands in the terminal, but they
    are executed as a batch. This makes it much faster and helps to automate tasks.
    For this guide, we will not be delving into the programming intricacies of shell
    scripting. But it is worth noting the recommended structure of a shell script.


    *   `Shebang line` - defines which program will be used to properly process the
    instructions that follow the shebang line. The line starts with `#!` which is
    a two-byte number indicating that the following lines are an executable shell
    script. The shebang is followed by the path to the interpreter or program that
    is to process the instructions.

    *   `Docstring` - a short description of what the script does and the software
    license of the code. This can be a single line but also an extensive description.
    Such lines start with `#` and are treated as comments by the shell.

    *   `Commands` - the combination of single commands that are to be executed by
    the shell. As mentioned, this can be as little as a one-line instruction such
    as what we have in our example below, to a fully-fledged program.

    *   `Exit state` - defines the return value(s) of the script. Unless explicitly
    stated otherwise, the exit state of the last command executed in the script will
    be returned. It is common to return `0` on success and a value between `1` and
    `255` in the event of an error.


    The following basic script contains all the single elements we mentioned above.
    The purpose of the script is to determine the uptime of the computer.


    ```bash

    #!/bin/bash

    # determine the uptime of the system

    # Released under GNU Public License (GPL)

    uptime

    # define exit state: no error

    exit 0

    ```


    There are two ways to execute a shell script. We can either call a shell such
    as `Bash` to run it or set the executable flag for the script and run it afterward.
    The first option uses `Bash` and looks as follows:


    ```bash

    $ bash uptime.sh

    12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40, 0,27

    ```


    The second method is based on two steps. First, we set the executable flag for
    the script using the `chmod` command as follows:


    ```bash

    $ chmod u+x uptime.sh

    ```


    Then we can run the script:


    ```bash

    $ ./uptime.sh

    12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28

    ```


    # 7 Text Processing


    Linux runs on text files for the most part. For example, the configuration files
    that are stored in `/etc` are stored as text files. Linux offers a rich set of
    text processing commands that are quite comprehensive and also time saving. Knowing
    what they are and how they work will play a vital role in many of the upcoming
    chapters that delve deeper into Linux. In this chapter, we will have a look at
    these commands and show how to use them.


    ## 7.1 Text Processing Commands


    ### cat


    Short for concatenate, `cat` outputs the contents of a file to the screen or standard
    output. The command `cat /etc/passwd` will output all the lines of the file `/etc/passwd`
    to the screen.


    ```bash

    $ cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    sys:x:3:3:sys:/dev: /usr/sbin/nologin

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/usr/sbin/nologin

    man:x:6:12:man:/var/cache/man:/usr/sbin/nologin

    lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin

    mail:x:8:8:mail:/var/mail:/usr/sbin/nologin

    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin

    uucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologin

    proxy:x:13:13:proxy:/bin:/usr/sbin/nologin

    www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin

    backup:x:34:34:backup:/var/backups:/usr/sbin/nologin

    list:x:38:38:Mailing List Manager:/var/list:/usr/sbin/nologin

    irc:x:39:39:ircd:/var/run/ircd:/usr/sbin/nologin...

    ```


    `cat` can also write to a text file using the redirect operator `>`. To do this,
    simply use the redirect operator and the name of your text file. For example:


    ```bash

    cat > output.txt

    ```


    Follow this by the lines of text you wish to output. To quit, press `Ctrl+D`,
    and type `cat output.txt` to see the result.


    ```bash

    $ cat > output.txt

    hello world

    this is a test

    to see if cat works

    $ cat output.txt

    hello world

    this is a test

    to see if cat works

    ```


    Other useful options for `cat`:


    *   `-E` (short for `ends`): displays a `$` at the end of each line.

    *   `-n` (short for `number`): numbers all lines, including blank and non-blank
    lines.

    *   `-s` (short for `blank`): suppresses multiple empty lines.


    Let''s say we have a text file named `output.txt`. To view it type the following:


    ```bash

    $ cat -n output.txt

    1 hello world

    2 this is a test

    3 to see if cat works

    ```


    ### tac


    The `tac` command works in the same manner as `cat` but displays the lines in
    reverse order. Using the file from the previous section, let''s display:


    ```bash

    $ tac output.txt

    ```


    ### more


    While `cat` and `tac` display the entire file at once, `more` lets you view the
    file one screen at a time. Let''s say we have a large text file named `alice.txt`.
    To view it type:


    ```bash

    more alice.txt

    ```


    This shows a screen starting at the beginning of the file. Use the spacebar to
    scroll through the pages. Alternatively, hitting Enter scrolls down one line.
    The disadvantage of the `more` command is that it can only scroll down but not
    back again. For that, there is the `less` command.

