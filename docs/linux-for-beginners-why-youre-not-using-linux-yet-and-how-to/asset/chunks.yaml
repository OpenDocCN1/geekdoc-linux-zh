    Modern Linux systems have a rather consistent directory structure, which is based
    on the Filesystem Hierarchy Standard (FHS). This definition specifies which main
    directories exist, and which content is stored in them. The FHS is maintained
    by the Linux Foundation. The latest version of the FHS is 3.0 and was released
    back in 2015. The Linux distributions mentioned in Chapter 3 follow the FHS structure.
    Below are the common directories that are in use:


    | Directory | Description |

    | :--- | :--- |

    | `/` | Primary hierarchy root and root directory of the entire filesystem hierarchy
    |

    | `/bin` | Essential command binaries for all the users |

    | `/boot` | The boot loader |

    | `/etc` | Abbreviates etcetera and contains host-specific system-wide configuration
    files |

    | `/home` | The home directories of the users |

    | `/lib` | Libraries essential for the binaries in `/bin` and `/sbin` |

    | `/media` | Mount points for removable media |

    | `/proc` | Abbreviates processes and is the virtual filesystem of the Linux kernel
    |

    | `/root` | The home directory for the root user |

    | `/sbin` | Essential system binaries |

    | `/tmp` | Temporary data and files |

    | `/usr` | Unix System Resources, contains user utilities and applications |

    | `/var` | Variable data, such as log files and database files |


    Some Linux distributions have additional directories like `/opt` or use symbolic
    links. Linux also has some abbreviations in use, which can be quite helpful in
    your daily work:


    | Abbreviation | Description |

    | :--- | :--- |

    | `$HOME` | A local variable that contains the user''s home directory |

    | `~` | Points to the user''s home directory like `/home/tom` |

    | `.` | Points to the current directory |

    | `..` | Points to the parent directory |


    You can use these abbreviations on the command line in a terminal and in shell
    scripts to shorten commands. Next, we will look at some of these commands.


    ## 5.2 Commands for Directories


    As with files, Linux offers a range of commands to list, create, remove, change
    and rename directories. You can use these commands in your terminal.


    ### Listing Directories


    To list the directories, use the command `ls` with the switch `-d` (short for
    `--directory`) as follows:


    ```

    $ ls -d */finances/projects/work/...

    ```


    This example lists the names of the directories in the current directory. The
    dotted line (`...`) in the output indicates that the list is longer and the output
    is shortened here.


    Two common ways of using the `ls` command are without any options and with the
    options `-la` (short for `-l -a` which means long all). The first output displays
    the entry names only for regular files, whereas the second output lists both regular
    and hidden entries. In order to list all the directories including the hidden
    ones starting with a period (`.`) use the `find` command as follows:


    ```

    $ find . -maxdepth 1 -type d./projects./.mozilla./.ipython./.dbus./video...

    ```


    The `tree` command searches the directory recursively and outputs an entire directory
    structure quite nicely. The switch `-d` limits the output to directories only
    and looks as follows:


    ```

    $ tree -d.

    |–––– archive |–––– ballet-zebola | | |–––– documents | | |–––– invoices | |––––
    charles-darwin-university|–––– projects|–––– .dbus|–––– .ipython|–––– .mozilla...

    ```


    ### Creating Directories


    To create a directory, use the `mkdir` command (make directory). The next example
    creates a new entry named `training` in the current directory:


    ```

    $ mkdir training

    ```


    The switch `-v` (short for `--verbose`) prints an additional message that the
    command succeeded.


    ```

    $ mkdir -v training

    mkdir: directory "training" created

    ```


    The switch `-p` (short for `--parents`) allows you to create entire subdirectory
    structures. Parent directories that do not exist yet are created as well. The
    following example creates the directory `training` as well as its subdirectories
    `linux` (level 1) and `lpic1` (level 2).


    ```bash$ mkdir -p training/linux/lpic1

    ```


    To create two subdirectories on the same level, make use of the underlying command
    line interpreter''s capabilities. The `Bash` uses values in curly brackets `{
    }` to achieve this. The next example shows you how to create the two directories
    `training/linux/lpic1` and `training/linux/lpic2` in one go:


    ```bash

    $ mkdir -p training/linux/{lpic1,lpic2}

    ```


    ### Removing Directories


    Removing a directory is done using the `rmdir` command (remove directory). The
    next example removes the entry named `training` in the current directory:


    ```bash

    $ rmdir training

    ```


    As with `mkdir`, the switch `-v` (short for `--verbose`) prints an additional
    message that the command succeeded.


    ```bash

    $ rmdir -v training

    mkdir: directory is removed, "training"

    ```


    This works well, as long as the directory is empty. In case your directory contains
    any entries like files or subdirectories, the `rmdir` command will complain when
    using this message, and keep the directory unchanged:


    ```bash

    $ rmdir training

    rmdir: failed to remove `training`: Directory not empty

    ```


    To solve this situation the `rm` command (remove) combined with the switch `-r`
    (short for `--recursive`) becomes quite handy. Then, `rm` removes all the entries
    recursively. The following example combines the two switches `-r` and `-v` to
    delete one file and three directories.


    ```bash

    $ tree training/training/

    |–––– lpic1 |–––– introduction.txt|–––– lpic22 directories, 1 file

    $ rm -rv training/„training/lpic1/introduction.txt"

    " was removedDirectory was removed: „training/lpic1"Directory was removed: „training/lpic2"Directory
    was removed: „training/"

    ```


    To be on the safe side when deleting files and directories, use the option `-i`
    (for `--interactive`) in combination with `-v` (for `--verbose`). Before deleting
    a file `rm` will then request your explicit confirmation, and prints a status
    message.


    ### Changing Directories


    The `cd` (change directory) command allows you to move through the system. To
    move one level upwards towards the root directory, use this command:


    ```bash

    $ cd ..

    ```


    To move downwards into a subdirectory, enter the `cd` command followed by the
    directory name. The command `cd /home/user/test` will take you straight into the
    `/home/user/test` directory.


    As already explained earlier, there are some shortcuts available. The commands
    `cd ~` (tilde) and `cd $HOME` will always take you to your home directory whereas
    `cd /` will take you to the `/` directory.


    **Tip**: Because Linux is case-sensitive, `cd` is not the same as `CD`. Be careful
    when using upper- and lower-case characters.


    ### Renaming Directories


    The `mv` command abbreviates the word move, and moves and renames files and directories.
    It requires two names: the name of the original file and its new name. To change
    the name of a directory from `lpic1` to `lpic-1` type in the following:


    ```bash

    $ mv lpic1 lpic-1

    ```


    The original file is removed and the new entry receives the current timestamp.
    Use the option `-i` (or `--interactive`) to prevent overwriting existing files.


    ## 5.3 Terminal-based File Managers


    Navigating Linux on the command line is not the most ideal situation. Terminal-based
    and graphical file managers are a great alternative. Terminal-based file managers
    run inside a terminal and do not open a separate window on your desktop. There
    are tons of programs available, that''s why we only present you with a selection
    of our favorites.


    ### GNU Midnight Commander (mc)


    [www.midnight-commander.org](http://www.midnight-commander.org)


    This is a free software, full-screen, text mode, visual file manager that lets
    you search, copy, move and also delete both single and multiple files, and even
    a whole directory tree. The `mc` integrates a viewer and editor.


    ![](Image00044.gif)


    ### The Vi File Manager (vifm)


    [https://vifm.info/](https://vifm.info/)


    Similar to `mc`, the Vi File Manager (`vifm`) comes with two navigation windows
    based on a curses interface. It provides a Vi(m)-like environment for managing
    files and directories. If you are familiar with the Vi key bindings, this is the
    file manager for you.


    ![](Image00045.gif)

