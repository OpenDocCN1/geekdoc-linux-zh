    `/dev` 中的一切都是设备。当系统启动时，它会检测诸如 `sda`、`sdb`、`sdc` 等设备。这些是硬盘。设备可以是 `USB`、`SCSI`、`SATA`、`PATA`。SD
    卡标记为 `mmc0`。CD/DVD 驱动器标记为 `cdrom` 或 `dvd`。


    IDE 驱动器可以是 `hd0`、`hdb` 等。分区由数字表示，例如 `sda1`、`sda2` 等。


