    \ (0.23-1) …\nProcessing triggers for man-db (2.7.6.1-2) …\n#\n```\n\nThis step\
    \ removes all of the package content except for the configuration files. To entirely\
    \ remove the package with its configuration files, add the switch `--purge` as\
    \ follows:\n\n```bash\n# apt-get remove --purge htop\n#\n```\n\n## Finding Linux\
    \ Alternatives\n\nYou may find that certain programs are not compatible with Linux\
    \ and were created to only run on Windows or macOS. The great thing about Linux\
    \ though is that for every Windows or macOS application, there is almost always\
    \ a Linux alternative. Below are two great resources for finding Linux-specific\
    \ applications.\n\n*   [https://www.linuxalt.com/](https://www.linuxalt.com/)\n\
    *   [https://linuxappfinder.com/alternatives](https://linuxappfinder.com/alternatives)\n\
    \n# 15. Process Management\n\nUnderstanding the execution of a program is essential\
    \ for being a good system administrator but also useful for general users. In\
    \ this chapter, we will be looking at processes in greater detail, as well as\
    \ how to work with and manipulate processes.\n\nA running instance of a program\
    \ is known as a process. It is made up of the program instruction, data read from\
    \ files, as well as other programs or inputs from a system user. Every process\
    \ is assigned a Process ID (`PID`) which allows the system to keep track of all\
    \ processes. The system boot process has a `PID` 0, then the initial process has\
    \ a `PID` 1, and so on in a sequential manner. The initial process `PID` 1 refers\
    \ to `/sbin/initd` on older Linux systems or `/sbin/systemd` on contemporary Linux\
    \ systems.\n\n### 15.1 Working with Processes\n\n### ps and pstree\n\nTo list\
    \ all the running processes, use either the `ps` command or the `pstree` command.\n\
    \n```bash\n# ps\nPID     TTY             TIME           CMD\n628     pts/0   \
    \        00:00:00        su\n629     pts/0           00:00:00        bash\n2507\
    \    pts/0           00:00:00        ps\n#\n```\n\nThe output of `ps` as shown\
    \ above consists of four columns that have the following:\n\n*   `PID`: the process\
    \ ID.\n*   `TTY`: the terminal from which was invoked.\n*   `TIME`: the time the\
    \ process has active.\n*   `CMD`: the command that was invoked.\n\nThe following\
    \ switches can be used to retrieve additional information:\n\n*   `-e`: shows\
    \ all processes.\n*   `-p`: shows information for the given process.\n*   `-C`:\
    \ shows the given command.\n*   `-u`: shows processes that belong to the username.\n\
    \n```bash\n# ps -u\nPID     TTY             TIME           CMD\n628     pts/0\
    \           00:00:00        su\n629     pts/0           00:00:00        bash\n\
    2507    pts/0           00:00:00        ps\n```\n\nThe `pstree` command is similar\
    \ to `ps` but displays the processes as a tree. A useful switch is `-p` which\
    \ adds the process ID to the name.\n\n### pidof\n\nThe `pidof` command simply\
    \ displays the ID of the specified process.\n\n```bash\n# pidof\n```\n\n### pgrep\n\
    \n`pgrep` is the `grep` command for processes. This command looks through the\
    \ currently running processes and outputs the process IDs that match the pattern.\
    \ The example below shows two calls. The first call asks `pgrep` to search for\
    \ the processes that have the string `term` in its name and to output the process\
    \ ID only. The second call uses the options `-l` (short for `--list-name`) and\
    \ `-a` (short for `--full`) to show the process ID and the resulting name.\n\n\
    ```bash\n# pgrep term\npgrep -la term\n```\n\n### top\n\nThe `top` command displays\
    \ the processes according to their activity. The most active process is on top,\
    \ followed by the less active ones. The list is updated every second. The single\
    \ columns contain the process ID (`PID`), the user name of the owner (`USER`),\
    \ the process priority (`PR`), the nice level (`NI`), the virtual memory usage\
    \ (`VIRT`), the reserved memory (`RES`), the shared memory (`SHR`), both the percentile\
    \ CPU and memory usage (`%CPU`, `%MEM`), the running time of the process (`TIME+`)\
    \ as well as the command that was used to invoke the process (`COMMAND`).\n\n\
    ### htop\n\n`htop` is an additional software package (refer to Chapter 4 and Chapter\
    \ 14 on installing additional packages) and contains a more interactive version\
    \ of `top`. The arrangement of the columns is similar to `top`. Use the navigation\
    \ and function keys to select the processes, sort them, or delete them. The function\
    \ keys are:\n\n*   `F1`: show help.\n*   `F2`: configure `htop`.\n*   `F3`: search\
    \ within the process list.\n*   `F4`: filter the terminal output.\n*   `F5`: display\
    \ the processes as a process tree.\n*   `F6`: change the sort order of the processes.\n\
    *   `F7`: decrease the nice level of the selected process.\n*   `F8`: increase\
    \ the nice level of the selected process.\n*   `F9`: terminate the selected process.\n\
    *   `F10`: quit the program.\n\n### 15.2 Foreground and Background Processes\n\
    \nThere are two types of processes: foreground and background processes. Foreground\
    \ processes are initialized and controlled through a terminal session. In other\
    \ words, there has to be a user connected to the system to start these processes\
    \ and the process occupies the terminal while it is executing. In contrast, background\
    \ processes are not connected to the terminal and do not explicitly require any\
    \ user input. They hence do not occupy the terminal while waiting to be completed\
    \ and allow you to run multiple processes.\n\nProcesses can be initialized in\
    \ the background with the use of the `&` symbol.\n\n```bash\n$ process1 &\n```\n"
