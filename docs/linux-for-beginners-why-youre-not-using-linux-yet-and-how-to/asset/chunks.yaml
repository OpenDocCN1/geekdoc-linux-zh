    ### 16.3 限制远程访问


    Linux 具有限制对系统的远程访问的能力`/etc/hosts.allow` 和 `/etc/hosts.deny` 两个文件调节来自其他系统对 TCP
    服务的访问。该限制涵盖了单个主机、IP 地址和整个网段。


    `/etc/hosts.allow` 文件显式地允许访问，而 `/etc/hosts.deny` 禁止访问。由于 `/etc/hosts.allow` 文件中的访问规则首先应用，因此它们的优先级高于
    `/etc/hosts.deny` 中指定的规则。因此，如果 `/etc/hosts.allow` 允许对某个服务的访问，则 `/etc/hosts.deny`
    中拒绝该相同服务的规则将否忽略。


    第一个示例说明了如何限制所有以 `example.net` 结尾的主名的设备的 SSH 访问：


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    sshd : .example.net

    ```


    第二个示例限制了来自 `192.168.30.*` 子网 IP 地址的设备访问：


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    ALL : 192.168.30.*

    ```


    第三个示例显示了如何允许所有以 `example.net` 结尾的主名的访问，但 `login.example.net` 除外：


    ```

    # /etc/hosts.deny

    ALL: ALL

    # /etc/hosts.allow

    sshd : .example.net EXCEPT login.example.net

    ```


    注意，TCP 封装服务不会缓存主机访问文件中的规则，因此 `/etc/hosts.allow` 或 `/etc/hosts.deny` 的任何更改将立即生效，无需重启网络服务。


    ### 16.4 未使用的软件


    除了端口和账户，我们还必须查看系统上安装的软件。正如我们之前提到的，在软件方面，越少越好。这条规则背后的想法是保持你的服务器精简高效。只安装你真正需要的软件包。如果存在提供未未使用服务的需要的包，请删除它们。安装的包越少，出现未修补代码和安全问题的概率就越小。


    可以使用 `deborphan` 识别残留的软件包。下方的示例显示了 `deborphan` 发现了两个包：`iceweasel` 和 `netcat`。第一列显示包的大小，后面是包类别（main/oldlibs）、包名，然后是包的类型（extra）。


    ```

    # deborphan -szP     235 main/oldlibs           iceweasel           extra      32
    main/oldlibs           netcat           extra# |

    ```


    可以使用下面的命令删除不再需要的包。这可以清理系统中的残留未用库和旧依赖项。


    ```

    # apt-get autoremove

    ```


    删除未使用的软件非常有帮助。保持剩余包处于最新状态也很重要，我们在第 14 章中讨论过。


    ### 16.5 有用的网络和系统命令


    #### `uname`


    `uname` 是 UNIX name 的缩写。该命令显示系统信息，例如 Linux 内核的准确名称和版本以及你计算机的主机名。


    下面的示例显示了使用参数 `-a`（`all` 的缩写）调用 `uname` 命令。输出包含操作系统名称（Linux）、主机名（debian106）、内核版本及其编译日期（4.9.8-7-amd64
    #1 SMP Debian 4.9.110-1 (2018-07-05））以及系统架构（x86_64）。


    ```

    $ uname -aLinux debian106 4.9.0-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05) x86_64
    GNU/Linux

    ```


    #### `uptime`


    `uptime` 显示系统运行了多久。它显示当前时间（07:36），随后是运行时间（21:56）、登录用户数（1）以及平均负载（load average:
    0.47, 0.43, 0.29），持续最后 15 分钟。


