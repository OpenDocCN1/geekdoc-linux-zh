    ## 18.2 Essential Commands & Graphical Tools


    In addition to the log files covered above, there are system commands available
    to display relevant information for your machine.


    ### dmesg


    As covered in Chapter 8, this command allows you to view the entire boot process
    including BIOS messages.


    ```bash

    dmesg

    ```


    ### journalctl -b


    Also covered in Chapter 8, this command shows the boot messages of the system.


    ```bash

    journalctl -b

    ```


    ### journalctl _UID=1000


    This command shows the log entries for a specific user. In this instance, it shows
    the entries for the user with the User ID `1000`.


    ```bash

    journalctl _UID=1000

    ```


    ### journalctl --disk-usage


    To see how much disk space is needed to store the log files, use the switch `--disk-usage`
    as follows:


    ```bash

    journalctl --disk-usage

    ```

    Archived and active journals take up 11.5M in the file system. For system administrators,
    it is quite common to use command line tools like `tail`, `cat`, or `grep`. But
    if you prefer graphical tools, two great options to consider are the log file
    navigators `lnav` or `glogg`, both displayed below.


    ![](Image0078.gif)

