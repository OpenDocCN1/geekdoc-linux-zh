    Similar to terminal-based file managers, graphical file managers assist in navigating
    Linux. These file managers do open in separate windows but provide a much nicer
    user experience. Again, there are tons of programs available, so we only list
    our favorites below.


    ### Konqueror


    [https://packages.debian.org/stretch/konqueror](https://packages.debian.org/stretch/konqueror)


    Konqueror is a powerful file manager for the KDE desktop environment. Konqueror
    offers simple file management functionalities such as copying, moving, searching,
    and deleting files and directories, plus some advanced features and functionalities
    such as access to archives, browse and rip audio CDs, and support for access to
    FTP and SFTP servers and SAMBA (Windows) shares.


    ![](Image00046.gif)


    ### Nautilus


    [https://wiki.gnome.org/Apps/Nautilus](https://wiki.gnome.org/Apps/Nautilus)


    Nautilus is the file manager on the GNOME desktop. It offers easy navigation and
    management of files on a Linux system. This includes simple file management functionalities
    such as copying, moving, searching, and deleting files and directories, as well
    as easy access to local and remote files.


