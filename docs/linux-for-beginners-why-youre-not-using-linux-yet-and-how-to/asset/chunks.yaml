    \ soft links, characters or block devices, pipes or sockets. If more than one\
    \ hard link points to a file, they must be on the same filesystem. To create a\
    \ link Linux utilizes two commands: `link` and `ln`. The `link` command is used\
    \ solely for hard links. It calls the `link()` function and does not perform error\
    \ checking when attempting to create the link. In contrast, `ln` has error checking\
    \ and can create both hard and soft links.\n\nThe command below creates three\
    \ hard links named `link1`, `link2`, and `link3` to the file `test`. The `touch`\
