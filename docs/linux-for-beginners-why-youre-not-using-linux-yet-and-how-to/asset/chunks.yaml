    Furthermore, a right-click on a file icon that resides on the XFCE desktop opens
    a properties window to show most of the information needed for everyday use:


    ![](Image00056.gif)


    ## 11.1 Types of Commonly Used Filesystems


    A number of filesystems are quite popular and widely used. This includes FAT,
    ext2, ext3, ext4, JFS, XFS, ZFS, ReiserFS, and SWAP. Let''s look at each of these
    in more detail.


    ### File Allocation Table (FAT)


    FAT was introduced in 1977 for floppy disks and then used for hard disks through
    the DOS and Microsoft Windows 9X era. It is supported by nearly all operating
    systems to date and is useful as a data transfer medium between different systems.
    It is commonly used on external media such as USB drives. The original FAT system
    was only an 8-bit system with a maximum file size of 8MB, supporting 6:3 filenames
    and no subdirectories. There are 3 main variants of FAT:


    *   `FAT12` - 12-bit File Allocation Table. Supports maximum volume sizes of 16MB
    with 4KB clusters or 32MB with 8KB clusters.

    *   `FAT16` - 16-bit File Allocation Table. Supports maximum volume sizes of 2GB
    with 32KB clusters or 4GB with 64KB clusters. Filenames must be in the 8:3 format
    with OEM characters or 256 UCS characters.

    *   `FAT32` - Supports a maximum file size of 2TB with 512B sectors, 8TB with
    2KB sectors and 32TB with 4KB clusters.


    ### Second Extended System (ext2)


    This was the first consumer-grade filesystem for Linux and was the default for
    Linux distributions such as RedHat until `ext3` became mainstream.


    ### Third Extended System (ext3)


    `ext3` is a journaled version of `ext2` and not as fast as `ext4`, `JFS`, `XFS`,
    or `ReiserFS` but uses less CPU power. `ext3` supports files up to 16GB and filesystems
    up to 32TiB.


    ### Fourth Extended System (ext4)


    `ext4` is an extension of `ext3` with extra features such as large filesystem
    support. It supports files up to 16TiB and filesystems up to 1EiB. An extent is
    a contiguous range of blocks which makes handling large files more efficient.


    ### Journaled File System (JFS)


    `JFS` was originally developed for IBM''s AIX Unix system and later ported to
    OS/2. `JFS` is a fully 64bit filesystem that uses extents, supports unlimited
    small files, and large files up to 4PB.


    ### XFS


    `XFS` is a journaling filesystem developed by Silicon Graphics (SGI) in 1993 for
    the IRIX operating system. It subdivides physical volumes into allocations allowing
    more efficient parallel I/O and filesystem bandwidth, and supports large files
    up to 8EiB.


    ### ZFS


    The Zettabyte File System (`ZFS`) combines a filesystem and a volume manager (`LVM`).
    Released by SUN Microsystems in 2005, it is scalable and includes extensive protection
    against data corruption, support for high storage capacities, efficient data compression,
    integration of filesystem and volume management, snapshots and copy-on-write clones,
    RAID-Z, and native Access Control Lists (`ACLs`) for the Network File System (`NFS`)
    version 4. The two projects `OpenZFS` and `ZFS on Linux` continue the development
    of this filesystem.


    ### ReiserFS


    `ReiserFS` is a general-purpose journaled filesystem that uses the Apple Partition
    Map based on B+Trees for managing directory contents. `ReiserFS` version 3 was
    the default filesystem used in SUSE, Elive, Xandros, Linspire, and YOPER distributions.
    Support for `ReiserFS` version 4 has declined to the point where development has
    halted, other than being made compatible with newer Linux kernels.


    ### Swap Space


    Swap space is used by Linux to swap out pages of memory when they are not in use.
    Swap space is not accessible to the user and cannot be used for normal file storage.
    The space used by swap space is follows:


    *   Desktop systems - Use 2x the total amount of memory on the system. That way
    if many large programs are running concurrently, the unused memory can be saved
    to disk and programs run more efficiently.

