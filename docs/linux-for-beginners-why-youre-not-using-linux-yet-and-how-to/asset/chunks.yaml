    # cat /etc/fstab

    `/etc/fstab`: 静态文件系统信息。


    ## 使用 ''blkid'' 输出设备的通用唯一标识符；这可以配合 `UUID=` 使用，作为一种更健壮的设备命名方式，即使在磁盘添加或移除也能正常工作。参见
    `fstab(5)`。


    ## <文件系统><挂载点><类型><选项><dump><pass>

    ```text

    / was on /dev/sda1 during installation

    UUID=dc78e6f6-8a4f-4be0-9192-e4ca37838765     /      ext4     errors      0 1

    /home was on /dev/sda7 during installation

    UUID=ac2823cc-a7b4-4bf3-808e-e13401e11eaf     /home    ext4     defaults     0
    2

    /tmp was on /dev/sda5 during installation

    UUID=faef6770-b865-43d2-b1f6-56352413d7c4     /tmp     ext4     defaults     0
    2

    /var was on /dev/sda6 during installation

    UUID=d2f4fd43-4f76-414c-9afa-6a53d4cd1d9c     /var     ext4     defaults     0
    2

    swap was on /dev/sda2 during installation

    UUID=9ef7106a-c885-4cbe-aaa1-8e2b77ee73cf     none     swap     sw     0 0

    /dev/sr0/media/cdrom0 udf,iso9660 user,noauto 0 0

    ```


    文件 `/etc/fstab` 中的列（字段）如下：


    *   `filesystem`: 指定文件系统的 UUID (`UUID=xxxxx`)、名称 (`/dev/sdb1`) 或文件系统的标签 (`LABEL=home`)。

    *   `mount point`: 定义文件系统挂载的目录。

    *   `type`: 允许的文件系统类型逗号分隔列表。

    *   `options`: 逗号分隔的选项列表。

    *   `dump`: 文件中的备份信息，`0` =关闭，`1` =开启。

    *   `pass`: 文件系统检查的顺序，从 `1` 开始。`0` 表示最后。


    请记住，单列之间由制表符分隔，空格无法正常工作。提示：要查找挂载点的 UUID，请查看 `/dev/disk/by-uuid`。


    要添加一个设备以实现自动挂载，只需通过添加一行来扩展 `/etc/fstab` 文件。为了在启动时将分区 `/dev/sdb1` 挂载为 `/space`
    并使用 `ext3` 文件系统，请在旧系统上添加此行：


    ```text

    /dev/sdb1 /space ext3 defaults 0 0

    ```


    在支持 UUID 的现代系统中，使用以下行。请注意将 `7ca005b2-a7ff-4757-bfdf-81004d4072ef` 的值替换为您分区的 UUID：


    ```text

    UUID=7ca005b2-a7ff-4757-bfdf-81004d4072ef /space ext3 defaults 0 0

    ```


    现在 `/dev/sdb1`将在启动时始终挂载为 `/space`。你可能会好奇使用 UUID 的好处是什么。通过使用 UUID，分区被清晰地标识，即使以后磁盘顺序发生变化。


    要生成 UUID（或重新生成一个新的），请使用 `uuidgen` 命令行工具。它提供两个选项。第一个是 `-r`（`--random` 的缩写），生成基于随机的
    UUID。此方法创建一个主要由随机位组成的 UUID。如果不显式指定，这是默认值。


    ```bash

    $ uuidgen -r4d545248-cf36-4d24-91ab-64a9ed276072

    ```


    第二个选项是 `-t`（`--time` 的缩写），生成基于时间的 UUID。此方法根据系统时钟加上（如果存在）系统的以太网硬件地址创建 UUID。


    ```bash

    $ uuidgen -t4afa1166-bcf1-11e8-9a0a-68f728ff3d63

    ```


    `uuidgen` 命令将新生成的 UUID 写入 `stdout`。你可以直接将新 UUID 复制并粘贴到 `/etc/fstab` 中，为分区引用唯一标识符。


    ## 12.7 设置新分区


    `fdisk` 及其对应工具 `cfdisk` 和 `gparted` 的原理是查看磁盘上的分区并添加、删除或编辑分区。在本节中，我们将查看 `fdisk`，它是
    Debian 的标准软件包，也适用于所有主要的 Linux 发行版。`cfdisk` 和 `gparted` 是非标准软件包，可能需要单独安装。我们将在第
    4 章和第 14 章中讨论额外软件包的安装。


    要使用 `fdisk`，以 root 用户身份输入 `fdisk` 后跟驱动名称。下面的示例显示了名为 `/dev/sda` 的第一个 SCSI 磁盘。


    ```bash

    # fdisk /dev/sda

    ```


