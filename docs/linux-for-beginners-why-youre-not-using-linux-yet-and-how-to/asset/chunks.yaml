    \ on chip = true...$\n```\n\n# 使用 `dmidecode`检测硬件\n\n`dmidecode` 命令报告了关于已安装系统组件的详细数据，例如处理器、主板和内存。这些信息基于桌面管理接口（DMI），该框架通过将桌面、笔记本电脑或服务器的各个组件从管理它们的软件中抽象出来，从而对它们进行分类。该工具可以通过同名的\
    \ Debian 软件包获取。下面的示例显示了在 VirtualBox 环境下于 Debian 中执行时的输出。\n\n```text\n# dmidecode\
    \ 3.0\nGetting SMBIOS data from sysfs.SMBIOS 2.5 present.10 structures occupying\
    \ 450 bytes.Table at 0x000E1000.Handle 0x0000, DMI type 0, 20 bytes\nBIOS Information\n\
    \    Vendor: innotek GmbH\n    Version: VirtualBox\n    Release Date: 12/01/2006\n\
    \    Address: 0xE0000\n    Runtime Size: 128 kB\n    Characteristics:\n      \
    \  ISA is supported\n        PCI is supported\n        Boot from CD is supported\n\
    \        Selectable boot is supported\n        8042 keyboard services are supported\
    \ (int 9h)\n        CGA/mono video services are supported (int 10h)\n        ACPI\
    \ is supported\nHandle 0x0001, DMI type 1, 27 bytes\nSystem Information\n    Manufacturer:\
    \ innotek GmbH\n    Product Name: VirtualBox\n    Version: 1.2\n    Serial Number:\
    \ 0\n```\n\n## 9. 图形化工具\n\n还有可以收集和显示硬件信息的图形化工具。这些工具提供了图形界面，许多用户更喜欢这种界面。其中一些工具包括硬件列表\
    \ (`lshw`) 和 `hardinfo`。下面的图片展示了使用 `hardinfo` 显示的内存信息。\n\n## 10. 用户与组管理\n\n###\
    \ 10.1 用户数据的存储\n\nLinux 是多用户操作系统，这意味着多个用户可以同时访问系统。为了让系统管理这些用户和组，它将这些数据存储在几个文件中：\n\
    \n* `/etc/passwd` - 用户数据。\n* `/etc/shadow` - 加密密码。\n* `/etc/group` - 组数据。\n* `/etc/gshadow`\
    \ - 加密组密码。\n\n这些文件是基于文本的数据库，具有定义的结构。可以使用文本编辑器或 `passwd`、`chage`、`chsh` 和 `usermod`\
    \ 命令修改这些文件的内容。\n\n#### /etc/passwd\n\n此文件包含除密码以外的所有用户属性。每行由七列组成，列之间用冒号（:`）分隔。属性分别是用户名、密码、用户\
    \ ID (UID)、组 ID (GID)、GECOS 字段、主目录和 shell（外壳）。第一个属性是指 UNIX 用户名，在系统中必须是唯一的。密码字段仅包含一个\
    \ x。密码本身的值已移动到 `/etc/shadow`（见下一节），该属性仅保留用于向后兼容。`UID` 指用户 ID，数值范围介于 0 到 65535\
    \ 之间。在 Debian 上，root 用户 `UID` 为 0，服务用户为 1 到 999，普通用户从 1000 开始。下面的示例显示了 root 用户和普通用户的信息。\n\
    \n```bash\n$ grep root /etc/passwd\nroot:x:0:0:root:/bin/bash own$ grep user /etc/passwd\n\
    user:x:1000:1000:Debian User,123,456:/home/user:/bin/bash\n```\n\n`GID` 属性是指用户主组的组\
    \ ID。GECOS 是 General Comprehensive System（通用综合系统）的缩写，包含用户的全名，有时还包含用逗号分隔的用户数据，如房间号和电话号码。Home\
    \ 是用户的主目录，shell 是用户的默认 shell。确切地说，它是当用户登录时立即执行的程序。\n\n#### /etc/shadow\n\n此文件包含用户的加密密码和过期数据。格式与我们上面讨论的\
    \ `/etc/passwd` 类似。每行由八列组成，列之间用冒号分隔。属性分别是用户名、密码、最后修改日期、最小使用期、最大使用期、警告期、闲期和过期日期。第一个属性再次指向\
    \ UNIX 用户名，但在这种情况下，密码字段包含哈希值。`lastchange` 指自 1970 年 1 月 1 日以来最后更改密码的天数。接两个属性 `minimum`\
    \ 和 `maximum` 显示更改密码所需的最小天数和密码有效的天数。`warn` 显示密码过期前的警告天数。`inactive` 指密码过期后账户被禁用的天数，`expire`\
    \ 是账户过期日期。下面的示例显示了普通用户的属性。密码存储在第二列中。\n\n```bash\n# grep user /etc/shadow\nuser:$6$QB0brh$R9sa5Q1Owyw4SViqMcumbqnx1173:::999999:::\n\
    ```\n\n要显示账户详情，调用 `chage` 命令并加上 `-l`（对应 `--list`）选项以及用户名。下面的示例列出了用户 user 的详情。\n\
    \n```bash\n# chage -l user\nLast password change:     Aug 20, 2020\nPassword expires:\
    \         never\nPassword inactive:        never\nAccount expires:         never\n\
    Minimum number of days between password change: 0\nMaximum number of days between\
    \ password change: 99999\nNumber of days of warning before password expires: 7\n\
    ```\n\n如你从上面的示例所示，账户没有过期日期。为了将此值设置为 2019 年 12 月 31 日，调用 `usermod` 命令并加上 `-e`（对应\
    \ `--expiredate`）以及用户名。\n\n```bash\n# usermod -e 2019-12-31 user\n```\n\n要锁定和解锁用户账户`usermod`\
    \ 命令有两个选项 `-L`（对应 `--lock`）和 `-U`（对应 `--unlock`）。下一个示例锁定了 user 用户。用户可以继续工作并完成会话，但无法再次登录系统。\n\
    \n```bash\n# usermod -L user\n```\n\n#### /etc/group\n\n此文件包含组属性。每行由四列组成，列之间再次用冒号分隔。属性分别是组名、密码、组\
    \ ID 和其成员列表。`groupname` 属性类似于用户名属性，是指 UNIX 组名，该名称在系统中必须是唯一的。密码字段包含一个 x，因为该值已移动到\
    \ `/etc/gshadow` 文件，该字段仅保留用于向后兼容。\n\n"
- fmt: '

    The `members` attribute provides a comma-separated list of users with access to
    the group. `GID` is the unique Group ID, which has a numeric range between 0 and
    65535, with a similar allocation as we have with the `UID`. The user `root` has
    a `GID` of 0, `services` will range from 1 to 999, and regular users start at
    1000. The following code snippet shows this for the root and a regular user.


    ```bash

    $ grep root /etc/group

    root:x:0:

    ```


    The example below shows the name of the groups which user is of.


    ```bash

    $ grep "^user" /etc/group

    user:x:1000:cdrom:x:24,floppy:x:25,audio:x:29,dip:x:30,video:x:44,plugdev:x:46,netdev:x:108,bluetooth:x:111:

    ```


    ### /etc/shadow

    This file contains encrypted passwords and user data for groups. The format is
    similar to `/etc/shadow`. Each line consists of four columns separated by a colon.
    The attributes are the group name, the password, administrators, and the list
    of members. The `group` attribute is again the UNIX group name, with the password
    being the encrypted password. Administrators are group members who can add or
    remove other members using the `passwd` command, and members are non-administrative
    members of the group.


    ### User and Group Commands

    There are several commands available to manage users and groups in Linux system.
    We will look at commands needed to view and change user information, change passwords,
    create and delete user accounts, as well as look into group commands. Unless stated
    otherwise, these commands can be run as a regular user.


    #### whoami

    The `whoami` command returns your current user ID as follows:


    ```

    $ whoami

    user

    ```


    #### who

    The `who` command shows the users that currently logged into your Linux system.
    The output''s first column starts with the login name of the user. This is followed
    by the name of the terminal, where `console` represents login terminal and `pts`
    abbreviates pseudo-terminal session. The last two columns contain the login time
    and host the user comes from.


    ```

    user    console 2020-08-20 09:36 (:0)

    user    pts/1   2020-08-20 09:47 (:0)

    user    pts/3   2020-08-20 09:47 (:0)

    ```


    `w` extends the output of `who` by adding additional information. The single columns
    for `w` contain the login name of the user (`LOGIN`), the name of the terminal
    (`TTY`), the name of the host the user comes (`FROM`), the idle time (`IDLE`),
    CPU usage (`JCPU`, `PCPU`) as well as the last command the user executed (`WHAT`).


    ```

    USER     TTY     LOGIN       FROM             IDLE  JCPU  PCPU    WHAT

    user     console 2020-08-20 09:36          0.00s 0.00s 0.00s

    user     pts/1    2020-08-20 09:47          1.00s 0.00s 0.00s -w

    user     pts/3    2020-08-20 09:47          0.00s 0.00s 0.00s -w

    ```


    #### users

    In contrast to the above, `users` simply outputs the name of the users as a space-separated
    list in a single line.


    ```

    $ users

    user

    ```


    #### id and groups

    The `id` command outputs the user and group information of the current user. From
    left to right the columns show the user ID (`UID`), the group ID (`GID`), and
    the name of the groups the user is member of.


    ```

    $ id

    uid=1000(user) gid=1000(user) groups=1000(user),cdrom(24),floppy(25),audio(29),dip(30),video(44),plugdev(46),netdev(108),bluetooth(111)

    ```


    To list the names of all the groups the user belongs to, you can also invoke the
    `groups` command. The output is a space-separated list of the group names.


    ```bash

    $ groups

    user cdrom audio dip video plugdev bluetooth

    ```


    #### passwd

    As described in Chapter 4, the Linux system has at least two users: an administrative
    root user and a regular user we simply called `user`. Every account is also secured
    with a password. In order to change your password, use the `passwd` command from
    the Debian package. As shown below, type in the current password first, press
    Enter, type in the new password, press Enter to confirm, retype the new password
    and press Enter again.


    ```

    $ passwd

    Changing for user.(current)

    UNIX password:Enter new password:

    Retype new password:password updated successfully

    ```


    As a regular user, you are allowed to change your own password only. The administrative
    root user can set a new password for itself and other users as well. In such a
    scenario, we call `passwd` by adding the user name.


    ```

    # passwd felix

    Changing for felix.(current)

    UNIX password:Enter new password:

    Retype new password:password updated successfully

    ```


    The password is stored as a hashed value in the configuration file named `/etc/shadow`.
    The content of this file is only visible to the administrative user. The example
    below shows how to extract the information for the user `user` with the help of
    the `grep` command.


    ```

    # grep user /etc/shadow

    user:$6$QB0brhON$R9saRX5Q1/OwYW4SViqeh6McumbqnxkJRAl…shFyblLBTZxlCoggH12p21:17763:0:99999:7:::#

    ```


    #### chfn

    This command is also from the Debian passwd package and changes the user information
    that is stored on your system in `/etc/passwd`. The basic setup was already done
    during the installation of your Debian system. To modify this information, you
    can run `chfn` without further parameters in interactive mode, or with one or
    more of the following options to adapt only a specific value:


    - `-f` or `--full-name`: changes the full name of the user.

    - `-h` or `--home-phone`: changes the home phone of the user.

    - `-r` or `--room`: changes the room number of the user.

    - `-w` or `--work-phone`: changes the work phone of the user.


    The following example changes the entry for the home phone number to 135:


    ```bash

    $ chfn -h 135

    Password:$

    ```


    #### chsh

    This command (also from the Debian passwd package) changes the entry for the shell
    that you use to log into your Linux system. Again, this information is stored
    in `/etc/passwd`. Which shells are allowed to be used are limited by the entries
    in the configuration file named `/etc/shells`.


    `chsh` works similar to the `chfn` command. Invoked without further options, an
    interactive method is used:


    ```

    $ chsh

    Password:

    Changing the shell

    Enter new shell, or press Enter for default [/bin/bash]: /bin/bash

    ```


    `chsh` accepts the option `-s` (short for `--shell`) to set the shell in non-interactive
    mode. The following example shows the command line:


    ```bash

    $ chsh -s /bin/bash

    ```


    In order to modify the shell for a different user other than yourself, invoke
    the `chsh` command with the user''s name as a parameter. Note that only the administrative
    user can do this for another user.


    ```bash

    # chsh felix /bin/bash

    ```

