    4.4 Adding Additional Packages


    Up until now the software available to be used on your Linux system has been rather
    limited. The next thing to do is to add some functionality with these four Debian
    packages:


    *   firefox-esr: the web browser Mozilla Firefox (Extended Support Release).


    *   gnome-terminal: a terminal emulation maintained by the GNOME project.


    *   xscreensaver: a basic screensaver for the X11 system.


    *   vlc: the video player Video Lan Client (VLC).


    The installation of the three packages will be done using the command-line in
    a terminal emulator (we will look at terminals in detail later in the guide).
    Currently on your system, the X11 terminal emulator xterm is installed. To open
    xterm, click on the terminal button in the lower navigation bar or select the
    entry Application > System > Xterm from the context menu.


    As step one, open xterm. Next, type in the command su next to the command-line
    prompt as follows and press Enter:


    | user@debian106: ~$ suPassword: |


    You may remember from the previous steps that only an administrative user can
    install, update, or remove software on a Debian system. The su command abbreviates
    switch user and changes your current role. Used without an additional name, the
    role changes to the administrative root user. At the password prompt type in the
    password for the administrative user and press Enter.


    As an administrative user, install the packages: firefox-esr, gnome-terminal,
    xscreenserver, and vlc as follows:


    | root@debian106: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc
    |


    The output is seen below:


    ![](Image00040.gif)


    After the installation of the four packages, you can switch back to your role
    as a regular user. Press Ctrl+D to quit the admin part, and press Ctrl+D again
    to close xterm.


    The installation of Firefox has the following effects:


    *   The new software Firefox is available from the application menu.


    *   The new command firefox is available from the command-line.


    *   The earth icon from the lower navigation bar links to the Firefox web browser.


    *   The installation of the GNOME terminal package has the following effects:


    *   The new software gnome-terminal is available from both the command-line and
    the application menu.


    *   The terminal icon from the lower navigation bar links to the GNOME terminal.


    *   The entry Open Terminal Here from the context menu refers to the GNOME terminal.


    To see the changes, select the entry Open Terminal Here from the context menu.
    The image below shows the terminal window. It comes with a white background and
    a bigger font that is easier to read.


    ![](Image00041.gif)


    4.5 Exiting Linux


    To use Linux properly, you also have to learn how to exit Linux and to reboot
    the system. Below you will learn how to quit the XFCE desktop environment, to
    shut down the Linux system, and to reboot the system. We will look at two methods,
    the first is based on the graphical interface and the second can be used on non-graphical
    systems like servers and wireless routers.


    Quitting the XFCE Desktop Environment


    The easiest way to quit the XFCE desktop and to log out from your current session
    is to click on the button in the right corner of the upper navigation bar. The
    button is labeled with your username, which in our case is Debian User . From
    the small menu select the last item labeled Log Out . Alternatively, you can choose
    either the item labeled Log Out from the Application button in the upper-left
    corner or from the context menu.


    ![](Image00042.gif)


    A second window opens that contains the five buttons labeled Log Out, Restart,
    Shutdown, Suspend, and Hibernate. Click on Log Out to quit your session. Subsequently,
    you will return to the login screen.


    Shutting Down the Linux System


    The way to shut down the entire Linux system is similar to exiting XFCE. Click
    on the button in the right corner of the upper navigation bar and select the Shut
    Down . From the next dialog window click on the button labeled Shut Down to stop
    the Linux system.


    From a terminal session, you can run the commands halt or shutdown -h now as an
    administrative user. A regular user is not allowed to issue these commands.


    | # halt |


    Rebooting the Linux System


    To restart the Linux system, click on the button in the right corner of the upper
    navigation bar and select the item labeled Restart . From the next dialog window
    click on the button labeled Restart to reboot the Linux system.


    From a terminal session, you can run the command reboot or shutdown -r now as
    an administrative user. Again, a regular user is not allowed to issue these commands.


    | # reboot |


    Subsequently, the system will reboot and you will return to the boot screen.


