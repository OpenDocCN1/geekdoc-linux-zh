  trans: '

    原始开发是用 `C` 语言完成的，这使其能够独立于硬件平台。它通过精选开发工具和库交付，允许你根据特定需求轻松扩展。它虽然简单，但具有强大的任务自动化能力，支持复杂且可维护的脚本。


    UNIX 类似于工具箱，由各种工具组成。每种工具都有特定的用途，并专为该任务设计。其核心思想是每个任务使用一个工具。为了实现更复杂的目标，你可以将几个工具组合成链。以下示例通过管道结合了两个命令
    `ls` 和 `wc`，能够统计当前目录下 Python 文件的数量。


    ```bash

    ls *.py | wc -l6

    ```


    我们将在指南的后续部分详细解释这些命令及其用法。


    ## 1.2 Linux 简史


    与 UNIX 类似，Linux 操作系统有着不同的根源，并基于多位大师的作品。其中包括 Richard M. Stallman、Andrew S. Tanenbaum
    和 Linus Torvalds。


    Richard M. Stallman 是麻省的一位黑客和开发者，他是自由软件基金会（FSF）的首任主席，也是 GNU 项目之父。GNU 是口号 `GNU
    is Not UNIX` 的缩写。该项目的目标是开发一个自由的 UNIX 操作系统。直到 20 世纪 90 年代初，工具集可用但内核仍然缺失。整个软件于 1983
    年左右根据 GNU 公许可（GPL）发布。


    Linux 的下一步来自 Andrew S. Tanenbaum。当时他是阿姆斯特丹大学的教授。为了他的学生，他开发了 `Minix`，这是一个用于教育目的操作系统，旨在演示和理解
    UNIX 原则。正如他指出的，`Minix` 并非用于实际生产。


    Linus Torvalds 是赫尔辛基大学的一名芬兰学生，他是 `Minix` 的用户并对其局限性感到不满。1990 年，他开始基于 `Minix` 的思想、UNIX
    原则和 `POSIX` 标准开发一个全新的操作系统。他的动力是拥有一个既易于理解又能最大限度发挥硬件极限的系统。他还想玩得开心，并没有商业意图。Linux
    背后的整个故事在他名为自传的《只求乐趣》（`Just for Fun`）的书中都有描述。如今，Linus Torvalds 监督着 Linux 内核的开发。


    为了让 Linux 对外产生吸引力，它需要漂亮的标志。根据一次吉祥物竞赛，人们提交了大量的提案。Larry Ewing 提交了他书中封面上所示企鹅的想法，他的提案获胜了。这只带着调皮微笑、体态肥满的企鹅命名为
    `Tux`，代表了一个快乐且满意的用户形象。


    ## 1.3 Linux 的用途范围


    Linux 最初为基于 Intel 的系统设计，如今运行在各种平台上。其中特别包括 ARM 架构（命名为 `arm` 和 `arm64`）、Motorola/Freescale
    的 68k 架构（`m68k`）、Intel x86（`i386` 和 `amd64`）、IBM s390（`s390`）、PowerPC（`powerpc`）和
    SPARC（`sparc`）。


    从一开始，Linux 就专注于服务器系统。它广泛用于 Web 服务器、文件服务器、邮件和新闻服务器、互联网网关、无线路由器和防火墙。作为计算单元，它帮助渲染了视频序列和整个电影，如《泰坦尼克号》、《史瑞克》和《玩具总员》。此外，Linux
    还应用于汽车产品、航天、军事、物流和工程环境。自 2006 年以来，Linux 服务器运行着全球所有的交易所。它还运行着几乎所有的互联网搜索引擎。


    在过去的十年里，Linux 也征服了桌面。由于其高度的灵性和稳定性，它可以作为文本处理、图形设计、桌面出版、电子计算、通信（电子邮件、聊天、音频和视频）以及手机和电视界面的可靠配置。


    ## 1.4 Linux 认证


    Linux 的广泛使用增加了对清楚自己业务的工程师和用户的需求。此时，获得 Linux 认证将变得非常有优势。这些认证可以分为通用类（不针对特定发行版）和专项类（针对特定
    Linux 发行版）。下面的列表给出了目前存在的主要认证概览。


    #### 通用认证


    - Linux Essentials

    - LPIC-1: Linux 服务器专业认证

    - LPIC-2: Linux 工程师

    - Linux Foundation Certified System Administrator (LFCS)

    - Linux Foundation Certified Engineer (LFCE)

    - CompTIA A+

    - CompTIA Network+


    #### 针对发行版的认证


    - RedHat Certified Engineer (RHCE)

    - RedHat Certified System Architect (RHCSA)

    - RedHat Certified Architect (RCA)

    - SUSE Certified Administrator (SCA)

    - SUSE Certified Engineer (SCE)

    - SUSE Enterprise Architect (SEA)


    # 2. 软件许可


    与市面上的大多数产品一样，软件也带有相应的许可。软件许可描述了软件的使用方法，并允许或限制其使用。对于商业软件，仅在非常严格的边界内允许更改和复制。例如，许可限制你并行使用
    5 个用户，并要求你获取另一个许可块来添加第 6 或第 7 个用户。常见的许可包括微软的 Shared Source 和 Apple 许可。


    对于开源软件，许可限制要少得多。更改和复制被明确允许，在某些情况下为了针对特定用户和目的进行改进甚至是鼓励的。目标是确保软件现在和将来对所有人可用。这种所谓的“拷贝左”（Copyleft）原则确保了每个人在需要时都有权进行适配，对受保护软件的使用和分发的限制被降到最低。用于单个
    Linux 组件及其工具的常用许可包括 GNU 公许可（GPL）、BSD 许可和 Apache 许可。


    开源软件许可遵循几条自由规则：


    - 为任何目的使用程序（无限使用权 - 自由 0）。

    - 理解程序如何工作以及如何根据你的需求更改它（阅读程序源代码的权利 - 自由 1）。

    - 制作软件副本以帮助你的邻居（分发权 - 自由 2）。

    - 改进软件并发布你的更改，以便所有其他用户也能从你的改进中受益（自由 3）。


    这确保了可用软件的质量不断提高，并且每个人都能获得这些改进。使用 `GPL` 时，更改必须使用相同的许可发布。其他开源许可（如 `BSD`）没有这种强制性要求。


    # 3. Linux 发行版


    有一些术语可能会让 Linux 初学者感到困惑。第一个是它的名称，Linux 与 GNU/Linux。正如第 1 章之前描述，Linux 术语仅指 Linux
    内核。实际上，许多用户将 Linux 称为整个操作系统，包括内核、库和工具。Linux 术语在实践中也包含所有运行在 Linux 上或供该操作系统可用的程序。

