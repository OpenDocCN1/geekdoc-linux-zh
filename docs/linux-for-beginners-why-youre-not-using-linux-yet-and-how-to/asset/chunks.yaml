    要将运行中的进程发送到后台，请使用 `bg` 命令后接作业 ID。或者，`fg` 会将进程发送到前台。你可以使用 `jobs` 命令显示当前正在运行的作业及其相关的作业
    ID：


    | $ process1 &$ process2 &$ jobs[1]+ Running process1[2]- Running process2$ |


    ### 15.3 停止和终止进程


    如果一个运行中的程序变得无响应并导致系统负载过高，我们可以做些什么来停止并移除它？幸运的是，我们有几种选项允许我们向程序发送特定的信号来停止它。在本例中使用的命令是
    `kill` 命令以及相应的开关。除此，我们还有以下开关：


    *   `SIGHUP` (1) - 挂断信号。程序可以监听此信号并采取采取操作。当你关闭终端时，此信号会被发送到在终端中运行的进程。

    *   `SIGINT` (2) - 中断信号。此信号发送给进程以中断它们。程序可以处理此信号并采取行动。你也可以通过在运行程序的终端窗口中输入 `CTRL+C`
    直接发出此信号。

    *   `SIGTERM` (15) - 终止信号。此信号发送给进程以终止它们。同样，程序可以处理此信号并采取行动，例如在终止之前将数据写入文件。这是 `kill`
    命令在未指定信号时发送的默认信号。

    *   `SIGKILL` (9) - 强制杀死信号。此信号会导致 Linux 内核立即终止进程。程序无法监听此信号。


    要终止并杀死一个名为 `hangingProgram` 的程序，你必须首先标识该程序。你可以通过使用 `pgrep` 如下所示找到相关的进程：


    | $ pgrep hangingProgram3167$ |


    接下来，向标识的进程发送 `SIGTERM` 信号：


    | $ kill -SIGTERM 3167 |


    作为替代方案，你可以按照如下方式调用 `kill`：


    | $ kill -15 3167 |


    或者，你也可以通过按下 `CTRL+Z` 停止挂起的进程，然后使用此命令删除进程：


    | $ kill -SIGKILL 3167 |


    如上文所示，该命令的效果相同：


    | $ kill -9 3167 |


    ### 15.4 调整进程优先级


    你机器的处理器可以同时管理多个任务。我们可以为 CPU 在执行不同任务时设定需要遵循的准则。这些准则被称为 `niceness`（性值）或 `nice values`。Linux
    的 niceness 范围从 -20 到 19，数字越小，表示任务的优先级越高。如果 nice 值很高（例如 19），任务将 own 设置为最低优先级，CPU
    将在任何有机会时处理它。默认的 nice 值 0。


    你可以使用 `ps` 如下显示进程的 nice 级别：


    | $ ps -o pid,comm,nice -p 1808PID COMMAND NI1808 bash 0$ |


    第一列包含进程 ID (PID)，第二列包含命令，第三列包含 nice 级别 (NI)。如上例所示，PID 为 `1808` 的 `bash` 进程的 nice
    级别为 0。可以使用 `renice` 命令调整现有进程的 nice 级别。要将上述进程的 nice 级别降低到 10，请执行以下命令。记住，只有 root
    用户才能对进程应用负的 nice 值。


    | $ renice 10 -p 1808 |


    # 16. 系统与网络安全


    本章的理念是建立如何设置和运行安全系统的基本理解。在接下来的章节中，我们将关注更具实操性的方法，查看开放端口、现有和活动用户、限制远程访问、更新软件以及利用可用计算能力。


    ### 16.1 开放端口


    如果你从一开始就开始关注，可能还记得我们使用极简安装设置了 Linux 发行版。我们只安装了实际需要的软件包，并在以后需要时再安装其他软件。我们建议所有新安装都这样做，因为其结果是一个非常精简、高性能的系统，所需的资源最少。第二个原因是有限的软件限制了系统内部潜在安全问题的数量。


    作为下一步，我们将检查从 Linux 系统外部可用的服务数量。这被称为端口扫描。协助我们的工具是命令行工具 `netcat` 和 `nmap`（Network
    Mapper 的缩写），以及它的图形版本 `zenmap`。


    #### netcat


    以下 `nc` (`netcat`) 命令开始扫描本地桌面系统 (`localhost`) 在端口 1 到 1024 之间可用的网络服务。开关 `-zv`
    启用端口的详细扫描：


    | $ nc -zv localhost 1-1024localhost [127.0.0.1] 631 (ipp) openlocalhost [127.0.0.1]
    111 (sunrpc) openlocalhost [127.0.0.1] 80 (http) openlocalhost [127.0.0.1] 25
    (smtp) openlocalhost [127.0.0.1] 22 (ssh) open$ |


    `nc` 每行报告一个服务。上面的结果是：

    *   `631`: 打印协议 (IPP)

    *   `111`: Sunrpc

    *   `80`: 超文本传输协议 (HTTP)

    *   `25`: 简单邮件传输协议 (SMTP)

    *   `22`: 安全 Shell (SSH)


    要检查端口是否开放，我们使用 `nc -zv`。


    ```bash

    nc -zv localhost 1-1024

    localhost [127.0.0.1] 631 (ipp) open

    localhost [127.0.0.1] 111 (sunrpc) open

    localhost [127.0.0.1] 80 (http) open

    localhost [127.0.0.1] 25 (smtp) open

    localhost [127.0.0.1] 22 (ssh) open

    ```


    #### nmap


    我们将查看的下一个命令是 `nmap`。开关 `-T4` 设置计时，`-A` 启用操作系统检测。这一步骤被称为操作系统探测。


    ```bash

    nmap -T4 -A localhost

    ```


    报告非常详细，包含了有关检测到的操作系统以及服务的信息。两个结果显示从外部可访问的服务只有 OpenSSH（Open Shell 的缩写）。


    ### 16.2 本地与远程用户


    Linux 系统的安全性包括用户及其账户。在第 10 章中我们查看了 `w`、`who` 和 `users` 等基本命令。现在我们将处理更高级的用户检测方法。


    要查看哪些本地账户，你可以查看 `/etc/passwd` 文件并验证这些条目。普通用户账户的用户 ID (UID) 从 1000 开始。


    为了查看哪些本地用户登录了系统，可以使用 `lslogins` 命令。`lslogins` 从不同的配置文件提取用户信息并以非常漂亮的方式显示结果。


    '
- fmt: '

    Invoked as an administrative user, `lslogins` adds the information for the two
    columns `PWD-LOCK` and `PWD-DENY`. These columns show if the associated account
    is locked or if login via password was denied.


    ![](Image00075.gif)


    In order to see the detailed information for a specific user, `lslogins` utilizes
    the switches `-u` followed by a username, as well as `--time iso` to display the
    time in a readable format.


    ```

    # lslogins -u user --time isoUsername:           userUID:           1000Gecos
    field:           Debian User,123,456,135Home directory:           /home/userShell:             /bin/bashNo
    login:           noPassword is locked:           noPassword not required:           noLogin
    by password disabled:           noPrimary group:           userGID:           1000Supplementary
    groups:           Bluetooth, cdrom, floppy, audio, dip, video, plugdev, netdevSupplementary
    group IDs:           111, 24, 25, 29, 30, 44, 46, 108Hushed:           noPassword
    expiration warn interval:           7Password changed:           2018-08-20Maximum
    change time:           99999Running processes:           32Last logs:2020-10-05T12:11:19+0200
    systemd[438]: Time has been changed2020-10-05T12:11:52+0200 systemd[438]: Time
    has been changed2020-10-05T12:12:24+0200 systemd[438]: Time has been changed#
    |

    ```


    As explained above, `lslogins` evaluates the local login attempts only. To retrieve
    login attempts from remote systems, use the `getent` command. It also evaluates
    databases that support the Name Service Switch library (NSS) which is configured
    in `/etc/nsswitch.conf` and covers services like Lightweight Directory Access
    Protocol (LDAP) and Network Information Systems (NIS). To get information for
    user `cararo` invoke `getent` as follows:


    ```

    | $ getent passwd caroaro:x:1005:1005:Caro,,,:/home/caro:/bin/bash$ |

    ```


    The two commands `last` and `lastlog` can also be used to show which users logged
    in last. `last` reports a detailed login as shown below. The columns contain the
    username, the terminal, and the session information.


    ```

    | $ lastuser pts/13 :0 Fri Oct 5 09:41 still logged inuser pts/13 :0 Thu Oct 4
