    # 15. Process Management


    Understanding the execution of a program is essential for being a good system
    administrator but also useful for general users. In this chapter, we will be looking
    at processes in greater detail, as well as how to work with and manipulate processes.


    A running instance of a program is known as a process. It is made up of the program
    instruction, data read from files, as well as other programs or inputs from a
    system user. Every process is assigned a Process ID (PID) which allows the system
    to keep track of all processes. The system boot process has a PID 0, then the
    initial process has a PID 1, and so on in a sequential manner. The initial process
    PID 1 refers to /sbin/initd on older Linux systems or /sbin/systemd on contemporary
    Linux systems.


    15.1 Working with Processes


    ps and pstree


    To list all the running processes, use either the ps command or the pstree command.


    | # psPID          TTY          TIME          CMD628          pts/0          00:00:00         
    su629          pts/0          00:00:00          bash2507          pts/0         
    00:00:00          ps# |


    The output of ps as shown above consists of four columns that have the following
    meanings:


    *   PID - the process ID.


    *   TTY - the terminal from which the command was invoked.


    *   TIME - the time the process has been active.


    *   CMD - the command that was invoked.


    The following switches can be used to retrieve additional information regarding
    the processes:


    *   -e: shows all processes.


    *   -p: shows information for the given process id only.


    *   -C: shows processes that refer to the given command name.


    *   -u: shows processes that belong to the given username.


    | $ ps -u fritzPID TTY TIME CMD1341 ? 00:00:00 systemd1406 ? 00:00:32 xfwm41408
    ? 00:01:10 xfce4-panel1410 ? 00:00:15 xfdesktop1411 ? 00:00:05 xfsettingsd1413
    ? 00:00:05 x-www-browser1415 ? 00:00:06 xfce4-power-man1418 ? 00:00:00 gvfsd1808
    pts/0 00:00:00 bash1841 pts/0 1-06:21:26 iceweasel4537 pts/4 00:00:00 bash4760
    pts/5 00:00:00 bash5281 pts/1 00:00:00 bash8213 pts/2 00:00:03 bash$ |


    The pstree command is similar to the ps command but displays the processes as
    a hierarchical tree. A useful switch is -p which adds the process ID to the process
    name.


    ![](Image00070.gif)


    pidof


    The pidof command simply displays the ID of the specified process. The example
    below returns the PID of the processes that run bash .


    | # pidof bash629 623# |


    pgrep


    pgrep is the grep command (seen earlier) for processes. This command looks through
    the currently running processes and outputs the process IDs that match the given
    pattern.


    The example below shows two calls. The first call asks pgrep to search for the
    processes that have the string pattern xterm in its name and to output the resulting
    process ID only. The second call uses the two options -l (short for --list-name)
    and -a (short for --list-full) to show the process ID and the resulting process
    name.


    | $ pgrep xterm741749$ pgrep -la xterm741 xterm749 xterm$ |


    top


    The top command displays the processes according to their activity. The most active
    process is on top, followed by the less active ones. The list is updated every
    second. The single columns contain the process ID (PID), the user name of the
    owner of the process (USER), the process priority (PR), the nice level (NI), the
    virtual memory usage (VIRT), the reserved memory (RES), the shared memory (SHR),
    both the percentile CPU and memory usage (%CPU and %MEM), the running time of
    the process (TIME+) as well as the command that was used to invoke the process
    (COMMAND).


    ![](Image00071.gif)


    htop


    htop is an additional software package (refer to Chapter 4 and Chapter 14 on installing
    additional packages) and contains a more interactive version of top . The arrangement
    of the columns is similar to top . Use the navigation and function keys to select
    the processes, sort them, or delete them. The function keys are:


    *   F1: show help.


    *   F2: configure htop.


    *   F3: search within the process list.


    *   F4: filter the terminal output.


    *   F5: display the processes as a process tree.


    *   F6: change the sort order of the processes.


    *   F7: decrease the nice level of the selected process.


    *   F8: increase the nice level of the selected process.


    *   F9: terminate the selected process.


    *   F10: quit the program.


    ![](Image00072.gif)


    15.2 Foreground and Background Processes


    There are two types of processes: foreground and background processes. Foreground
    processes are initialized and controlled through a terminal session. In other
    words, there has to be a user connected to the system to start these processes
    and the process occupies the terminal while it is executing. In contrast, background
    processes are not connected to the terminal and do not explicitly require any
    user input. They hence do not occupy the terminal while waiting to be completed
    and allow you to run multiple processes.


    Processes can be initialized in the background with the use of the & symbol.


    | $ process1 &...$ |'
