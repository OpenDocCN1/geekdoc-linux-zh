    # 6. Introduction to Terminals and Shells


    Working with the Linux operating system requires you to know about the terminal
    and the command line. It is essential to know what these are and to be slightly
    familiar with their usage and the standard commands available. But don''t fear,
    we will describe each in detail. These terms sound much more intimidating than
    they are in reality.


    The ability to communicate with the system in a text-based format is one reason
    why programmers have a soft spot for Linux, as this is the normal way for programmers
    to give instructions to computers. Another reason is the absolute control this
    allows you over the system that other operating systems just cannot provide, even
    with their own command line interpreters.


    Some beginners have even reported that using and becoming familiar with issuing
    commands in this text-based format has made the transition to program development
    much easier and quicker.


    ## 6.1 What is a Terminal?


    A terminal is described as "a program that emulates a video terminal within some
    other display architecture. Though typically synonymous with a shell or text terminal,
    the term terminal covers all remote terminals, including graphical interfaces.
    A terminal emulator inside a graphical user interface is often called a terminal
    window".


    To be precise, a terminal is simply the outer software. Inside a terminal runs
    a command line interpreter that is called a `shell`. The terminal is your way
    of interacting with the `shell` via a GUI.


    Debian supports a long list of terminal software. This includes the `Aterm`, as
    well as the `GNOME terminal`, the `Kterm`, the `Mate Terminal`, the `Rxvt`, the
    `Xterm`, and the `Xvt`. These different implementations of terminal software vary
    in terms of stability, support for character sets, design, colors and fonts, as
    well as the possibility to apply background images or work with transparency


    In this book, we will use the `GNOME terminal` because of its stability, simplicity,
    and adjustability. To increase and decrease the size of the content that is displayed
    inside the terminal window, use the two-key combinations `CTRL+` and `CTRL-`.


    ## 6.2 What is a Shell?


    Simply speaking, a `shell` is a sophisticated command-line interpreter. The `shell`
    reads your commands, modifies them under certain conditions, and then executes
    the result.


    Between reading from the command-line and the execution of the actual result,
    the `shell` has to interpret special characters that are part of your input. The
    table below displays the available special characters:


    | Character | Meaning |

    | :--- | :--- |

    | `$name` | Substitution of a variable |

    | `name=` | Assignment of a variable |

    | `''command''` | Substitution of a command |

    | `$( command )` | Substitution of a command |

    | `< > >> 2> 2>>` | Redirection of input and output |

    | `|` | Pipelining of commands |

    | `" '' \` | Quoting |

    | `* [ ] ?` | Creation of file names (globbing) |

    | `;` | Separation of commands |

    | `&` | Run the command in the background |

    | `|| &&` | Run the commands under certain conditions |

    | `{ } ( )` | Cramp commands |


    Purely for interest, the `shell` divides the command-line into single words to
    determine the commands, through the following process:


    | Step | Description | Special Characters |

    | :--- | :--- | :--- |

    | 1 | Read until the command separator and tagging (substitution of commands)
    | `\n` `&` `||` `&&` `;` `$(...)` `"..."` `''...''` |

    | 2 | Tagging (input-/output redirection, assignment of values) | `< > >> 2> 2>>`
    `name=` |

    | 3 | Division into single words | space, tabulator |

    | 4 | Substitution of variables | `$name` |

    | 5 | Substitution of commands | tagging, see step 1 and 2 |

    | 6 | Input-/output redirection | tagging, see step 1 and 2 |

    | 7 | Assignment of variables | tagging, see step 1 and 2 |

    | 8 | Division into words | `IFS` |

    | 9 | Creation of file names | `* [ ]` |

    | 10 | Command execution | |


    In steps 1 and 2, tagging happens for steps 5 to 7 only, and no further action
    takes place. Steps 5 to 7 are executed if tagging is completed. Next, the `shell`
    removes all the special characters. In step 10 the command-line contains only
    the arguments that are needed to execute the command. The `shell` interprets the
    first word as the name of the command to be executed, and the remaining words
    are its arguments:


    ```command arg1 arg2 ...

    ```


    ## 6.3 Available Shells


    Your Linux system allows the usage of various shells. Each shell is available
    as a separate software package through the Debian package manager, `Aptitude`,
    we installed earlier. The list of shells is quite long, so we list only a selection
    of the available shells that are the most popular:


    *   Almquist Shell (ash)

    *   Bourne Again Shell (bash)

    *   Debian Almquist Shell (dash)

    *   Z Shell (zsh)

    *   C Shell (csh)

    *   Korn Shell (ksh)

    *   Tenex C Shell (tcsh)


    Unless otherwise stated, the examples in this guide are based on the Bourne Again
    Shell (bash). At the time of writing this is the default shell on Debian.


    Which other shells are allowed in your Linux system, is set up in the configuration
    file `/etc/shells`. Using the `cat` command, you can see the list of allowed shells.
    `cat` will be discussed in detail in Chapter 7. For now, know that the command
    simply outputs the contents of a file to the screen.


    ```bash

    cat /etc/shells

    # /etc/shells: valid login shells

    /bin/sh

    /bin/dash

    /bin/bash

    /bin/rbash

    /usr/bin/screen

    ```


    The name of the shell that is currently in use in the terminal, is kept in the
    shell variable named `$0`. The following simple command outputs the shell''s name:


    ```bash

    echo $0

    #bash

    ```


    To change the shell that is currently in use, have a look at the configuration
    file `/etc/passwd` and the `chsh` command covered in Chapter 10.

