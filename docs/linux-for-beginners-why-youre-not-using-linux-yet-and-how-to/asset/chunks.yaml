    Creating New Filesystems


    So far we have empty partitions only. These partitions need to be filled with
    the appropriate filesystems. We will mount the new filesystems as follows:


    | /dev/sdb1 /mnt/root ext2/dev/sdb5 swap/dev/sdb6 /mnt/home ext4 |


    To do this, first we create the mount points that we need:


    | # mkdir /mnt/root# mkdir /mnt/home |


    Then to add the filesystems, we issue the following commands:


    | # mkfs /dev/sdb1mke2fs 1.43.4 (31-Jan-2017)Creating filesystem with 1048576
    4k blocks and 262144 inodesFilesystem UUID: 8e70eeac-83cb-43f1-a402-a10fdecab950Superblock
    backups stored on blocks:     32768,98304,163840,229376,294912,819200,884736Allocating
    group tables: doneWriting inode tables: doneWriting superblocks and filesystem
    accounting information: done# mkfs.ext4 /dev/sdb6mke2fs 1.43.4 (31-Jan-2017)Creating
    filesystem with 3931392 4k blocks and 983040 inodesFilesystem UUID: e7ab67d6-53a6-4c1a-9ee2-5f36d183bef5Superblock
    backups stored on blocks:     32768,98304,163840,229376,294912,819200,884736,1605632,2654208Allocating
    group tables: doneWriting inode tables: doneCreating journal (16384 blocks): doneWriting
    superblocks and filesystem accounting information: done |


    Next, we have to set up /dev/sdb5 as a swap partition. mkswap creates a swap filesystem,
    and swapon activates the partition as swap space.


    | # mkswap /dev/sdb5Setting up swapspace version 1, size = 1024 MiB (1073737728
    bytes)no label, UUID=a6e9f014-500b-4659-a45f-86d09238d11c# swapon /dev/sdb5 |


    It is a good idea to give each partition its own label. To do this we use tune2fs
    in combination with the option -L (volume label). The partition /dev/sdb1 is associated
    with the directory /root, and the partition /dev/sdb6 is associated with the directory
    /home.'
