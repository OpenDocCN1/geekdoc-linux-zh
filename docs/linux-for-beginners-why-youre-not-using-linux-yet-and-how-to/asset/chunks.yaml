    # About This Book


    Have you tried to install Linux in the past only to get stuck with a broken system,
    eventually giving up and resorting back to your old Windows or macOS? Or are you
    overwhelmed by which distribution to choose, using a terminal for the first time,
    or simply being able to perform the tasks you normally would on your old system?


    > "It may take you weeks to adjust to the Linux filesystem, right? Wrong."


    Linux is increasingly becoming more popular, with companies like Google, Facebook
    and IBM using Linux in one form or another. This is due to its superior privacy,
    reliability and security. Fortune Business estimates that the Linux market will
    increase by 402% in the next 7 years, making now the best time to get started
    with Linux. So, if the mythical Linux learn-ing curve is holding you back, don''t
    let it. We call it a myth, because with the right step-by-step guidance, that
    is exactly what it is - a myth.


    > "Just because you''re a beginner, doesn''t mean it should be hard."


    This book has been created to guide you through your very first steps in the Linux
    environment. If you are a complete novice or need a refresher in Linux, you''ve
    chosen the right book. In the upcoming chapters we take a detailed look at the
    Linux diversity and history, and then continue with setting up a Linux system
    from scratch. Here we will guide you through the setup and configuration process
    step by step.


    We will take a detailed look at the infamous command line by covering numerous
    essential terminal commands. We will also address specific topics such as choosing
    a distribution, adding a graphical user interface, package management, navi-gating
    the filesystem and directories, partitioning, software selection, and using the
    help system.


    We also look at the administration and management tasks required to keep a Linux
    system running. It includes network security, user and group management, working
    with libraries, hardware and software management, interpreting log files, and
    other aspects every proficient Linux user should know.


    For the examples in this book, we use the Debian Linux distribution as a reference
    point. However, the majority of the explanations apply to most distributions,
    especially Debian-based distributions such as Ubuntu, Mint, Pop! and Kali. Debian
    is merely what we use and prefer due to its outstanding stability. You are more
    than welcome to use a different Linux distribution. By the end of this book you
    will have set up and configured Linux from start to finish, and be able to use
    Linux at a proficient level.


    # 1. What is Linux?


    Linux is the name for the kernel of an operating system that is based on the UNIX
    principles. The name is derived from the first name of its Finnish inventor, Linus
    Torvalds, and follows the methodology used by other UNIX-based systems (the last
    letter is an x). Today, Linux is developed and maintained by thousands of people
    around the world.


    The kernel of an operating system is its heart. It is required for communication
    between the hardware of your computer and you, the user. An operating system is
    a collection of different software components: a kernel, various tools, and the
    accompanying libraries. It is a software that extends the basic operating system
    of your computer, known as the BIOS.


    ### 1.1 From UNIX to Linux


    The history of Linux can be traced back to the 1990s. To understand the story
    behind Linux, we also have to look back briefly at the early days of computing
    after the 2nd World War.


    At that time computing machines filled entire buildings and the transformation
    from mechanical to electronic components, like microprocessors and the usage of
    multi-layer circuits, was underway. Moreover, in the 1960s and 1970s hardware
    and software components were quite expensive and not standardized. Various vendor-specific
    platforms existed and each of them had their own interface, protocols to transfer
    and exchange data, as well as operating system. The communication between these
    single computing devices required specific knowledge and an understanding of its
    protocols. The development of UNIX was an aim to circumvent these obstacles and
    to simplify the usage of computing devices on a larger scale.


    #### UNIX


    At the beginning of 1965, the development of the Multiplexed Information and Computing
    Service (Multics) started. Multics was the result of a collaboration between the
    Massachusetts Institute of Technology (MIT), General Electric (GE) and Bell Labs/AT&T.
    Led by the developers Ken Thompson and Dennis Ritchie, the main product they developed
    was Unics. Later on it was renamed to UNIX. The UNIX operating system was mainly
    in use at the University of California in Berkeley.


    #### UNIX Variants


    The concept of UNIX became licensed to several companies that developed and maintained
    their own variant of UNIX. This included Solaris/SUN OS (SUN Microsystems nowadays
    owned by Oracle), AIX (IBM), Scenix (Siemens), SCO UNIX, Xenix (Microsoft), as
    well as HP-UX (Hewlett-Packard), NeXTSTEP, Mac OS (Apple), and Android (Google).


    Open-source implementations comprised of the Berkeley System Distribution (BSD)
    with its variants: NetBSD, OpenBSD, and FreeBSD. Today, Linux is the most popular
    free software among open source developers. There is also strong commercial support
    for the systems mentioned above.


    #### The UNIX Philosophy


    UNIX is designed with several strict principles in mind. These principles cover
    portability, multi-tasking, and multi-user orientation in combination with a time-sharing
    approach. Furthermore, it is based on network connectivity following the TCP/IP
    scheme.

