    - an interface to the on-line reference manualsman (7)          - macros to format
    man pages$ |


    Another option is the whereis command, which is helpful to locate the manual page
    of the command in the Linux system. It is a very simple utility. The example below
    shows this for the two commands mv and man .


    | $ whereis mvmv:  /bin/mv  /usr/share/man/man1/mv.1.gz$whereis manman:  /usr/bin/man 
    /usr/local/man  /usr/share/man  /usr/share/man/man1/man.1.gz  /usr/share/man/man7/man.7.gz$
    |


    Every command also provides additional information and configuration examples.
