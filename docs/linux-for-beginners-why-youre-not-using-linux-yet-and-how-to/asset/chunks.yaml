    ENTER for the new value        Login shell [/bin/bash]:# |


    su and sudo


    To change your role from one user to another, you can utilize the su command.
    su abbreviates switch user . Invoked without further options, you change to the
    root user as follows:


    | $ suPassword:# |


    Working as the administrative root user comes with great responsibility and presumes
    that you know exactly what you are doing. To work as a different user than root,
    invoke the su command with the desired user''s name as follows:


    | $ su felixPassword:$ |


    The su command changes the current role permanently. In order to run only a single
    command as an administrative user, use the sudo command. This requires the Debian
    sudo package to be installed and the additional user to be added to the configuration
    file /etc/sudoers using the visudo command.


    adduser


    The command adduser creates new user accounts. The example below shows the information
    that is required. This includes a new entry in the file /etc/passwd as well as
    the creation of a new group, plus home directory. Furthermore, prepared data from
    the directory /etc/skel is copied into the previously created home directory.
    Afterward, the account information is modified using the chsh command.'
