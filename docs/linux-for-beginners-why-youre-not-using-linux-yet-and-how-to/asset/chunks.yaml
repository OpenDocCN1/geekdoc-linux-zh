    # 11 文件系统


    文件系统是控制数据如何在驱动器上存储的一种。如果数据没有结构化，将无法知道特定条目何时结束以及下一个条目何时开始。文件系统将数据分成若干部分，每个部分都有唯一的名称。这样，信息可以很容易被隔离和识别。文件系统上的每组数据被称为条目（entry）。文件系统中的条目可以是文件、目录（也称为文件夹）、引用（也称为链接）、套接字（sockets）和
    fifo（也称为命名管道）。


    文件系统中的每个条目包含关于它的以下数据：


    *   `name` - 条目的名称。

    *   `permissions` - 哪个用户是条目的所有者并允许读取、写入和执行该条目。

    *   `creation time, last modified time, last access time` - 条目最后创建、修改或访问的时间。

    *   `file size, number of blocks, IO blocks` - 该条目在文件系统中需要多少磁盘空间。

    *   `inode number` - 索引节点的缩写，指数据条目开始位置的块编号。

    *   `number of symlinks` - 指向该条目的引用或符号链接的数量。


    你可以使用 `stat` 命令获取上述信息。`stat` 是 Debian 软件包 `coreutils` 的一部分，只需要检查条目的名称。下面的示例显示了文件
    `documentation.pdf` 的信息。


    ```bash

    $ stat documentation.pdf

    File: documentation.pdf

    Size: 512             Blocks: 8            IO Block: 4096 regular file

    Device: 808h/2056d           Inode: 260927           Links: 1

    Access: (0644/-rw-r--r--)     Uid: (0/root)       Gid: (0/root)

    Access: 2020-09-04 18:44:30.071901792 -0400

    Modify: 2020-09-04 18:44:22.358157773 -0400

    Change: 2020-09-06 18:08:14.528658813 -0400

    Birth: -$

    ```


    Midnight Commander (`mc`) 也以一种稍微精炼的方式显示这些信息：


    ![](img/Image00055.gif)


    此外，在 XFCE 桌面上右键点击文件图标会打开一个属性窗口，显示日常使用所需的大部分信息：


    ![](img/Image00056.gif)


    ## 11.1 常用文件系统类型


    有很多系统非常流行并被广泛使用。包括 FAT, ext2, ext3, ext4, JFS, XFS, ZFS, ReiserFS 和 SWAP。让我们详细查看其中的每一个。


    ### 文件分配表 (FAT)


    FAT 起于 1977 年引入软磁盘，随后在 DOS 和 Microsoft Windows 9X 时代用于硬盘。直到现在，几乎所有的操作系统都支持它，并且可以作为不同系统之间的数据传输媒介。它常用于
    USB 驱动器等外部介质。原始 FAT 系统只是一个 8 位系统，最大文件大小为 8MB，支持 6:3 的文件名且没有子目录。FAT 有 3 种主要变体：


    *   `FAT12` - 12 位文件分配表。支持使用 4KB 簇时最大 16MB 的卷大小，或使用 8KB 簇时最大 32MB 的卷大小。

    *   `FAT16` - 16 位文件分配表。支持使用 32KB 簇时最大 2GB 的卷大小，或使用 64KB 簇时最大 4GB 的卷大小。文件名必须是带有
    OEM 字符的 8:3 格式或 256 个 UCS 字符。

    *   `FAT32` - 支持 512B 扇区下最大 2TB、2KB 扇区下 8TB 以及 4KB 簇下 32TB 的最大文件大小。


    ### 第二扩展系统 (ext2)


    这是 Linux 的第一个消费级文件系统，在 `ext3` 成为主流之前，它是 RedHat 等 Linux 发行版的默认文件系统。


    ### 第三扩展系统 (ext3)


    `ext3` 是 `ext2` 的日志版本，速度没有 `ext4`、`JFS`、`XFS` 或 `ReiserFS` 快，但消耗的 CPU 更少。`ext3`
    支持 16GB 的文件和 32TiB 的文件系统。


    ### 第四扩展系统 (ext4)


    `ext4` 是 `ext3` 的扩展，具有额外功能，如大文件系统支持。它支持高达 16TiB 的文件和高达 1EiB 的文件系统。范围（extent）是连续的块范围，这使得处理大文件更加高效。


    ### 日志文件系统 (JFS)


    `JFS` 最初为 IBM 的 AIX Unix 系统开发，后移植到 OS/2。`JFS` 是一个完全的 64 位文件系统，使用范围（extents），支持无限数量的小文件以及高达
    4PB 的大文件。


    ### XFS


    `XFS` 是由 Silicon Graphics (SGI) 在 1993 年为 IRIX 操作系统开发的日志文件系统。它将物理卷划分为分配区，允许更高效的并行
    I/O 和文件系统带宽，并支持高达 8EiB 的大文件。


    ### ZFS


    Z 字节文件系统 (`ZFS`) 结合了文件系统和卷管理器 (`LVM`)。由 SUN Microsystems 于 2005 年发布，具有可扩展性，并包含了针对数据损坏的广泛保护、支持高存储容量、高效的数据压缩、文件系统与卷管理的集成、快照和写时克隆、RAID-Z
    以及针对网络文件系统 (`NFS`) 第 版本的原生访问控制列表 (`ACLs`)。这两个项目 `OpenZFS` 和 `ZFS on Linux` 继续该文件系统的开发。


    ### ReiserFS


    `ReiserFS` 是一种通用的日志文件系统，使用基于 B+树的 Apple 分区映射管理目录内容`ReiserFS` 版本 3 是 SUSE、Elive、Xandros、Linspire
    和 YOPER 发行版的默认文件系统。对 `ReiserFS` 版本 4 的支持已下降到除了与新 Linux 内核兼容外，开发已停止。


    ### 交换空间 (Swap Space)


    交换空间用于 Linux 在内存页未使用时将其换出。交换空间用户不可访问，且不能用于普通文件存储。交换空间的使用如下：


    *   桌面系统 - 使用系统总内存的 2 倍。这样当同时运行多个大型程序时，未使用的内存可以保存到磁盘，使程序运行更高效。


