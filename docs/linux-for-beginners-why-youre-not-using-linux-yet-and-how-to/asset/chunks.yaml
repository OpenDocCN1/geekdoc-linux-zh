    :0 Thu Oct 4 14:12 still logged inuser pts/8 :0 Thu Oct 4 14:04 still logged inuser
    pts/8 :0 Thu Oct 4 11:34 - 11:49 (00:15)$ |

    ```


    The `lastlog` command prints the statistics for which users logged in last. The
    first example below shows this for all users and the second example for a specific
    user.


