    ## 8.4 Commands to Restart and Stop the System


    There are several common commands available when it comes to restarting and stopping
    the system. To reboot Linux, you can use either `reboot` or `shutdown` . To stop
    Linux, you can invoke `halt`, `poweroff`, or `shutdown` . Below we will discuss
    some practical examples.


    | # `shutdown -r now` |


    The above command will restart the system. The option `-r` designates a reboot
    and restarts the system. The option `now` is a time parameter and invokes the
    action immediately. You can also use the `reboot` command to perform the same
    action as the `shutdown -r now` command.


    | # `reboot` |


    The `shutdown` command can also be used to stop the system by using the `-h` option
    instead. This instructs Linux to halt.


    | # `shutdown -h now` |


    Again, the `now` time parameter is used to stop the system immediately. The time
    parameter can also be specified as an exact time. The command shown in the example
    below will shut down the system after five minutes. It will also inform all users
    about the shutdown by sending them a relevant message. The message will be visible
    on all open terminals.


    | # `shutdown -h +5 "Server shutdown due to maintenance in 5 min"`Shutdown scheduled
    for Thu 2020-09-06 02:28:30 EDT, use `''shutdown -c''`-Similar to rebooting the
    system, stopping Linux has a -h option.


    | # `halt` |


    The `halt`, `poweroff`, and `shutdown` commands stop the system gracefully. Note
    that `shutdown` command requires administrative privileges.


