  raw: 'At first glance, a shell script may sound daunting but it is quite straightforward.
    In the simplest form, it is just a sequence of UNIX/Linux commands that are stored
    in a file, and are executed line-by-line by the command line interpreter. A shell
    script is similar to typing single commands in the terminal, but they are executed
    as a batch. This makes it much faster and helps to automate tasks. For this guide,
    we will not be delving into the programming intricacies of shell scripting. But
    it is worth noting the recommended structure of a shell script.


    *   Shebang line - defines which program will be used to properly process the
    instructions that follow the shebang line. The line starts with a #! which is
    a two-byte number indicating that the following lines are an executable shell
    script. The shebang is followed by the path to the interpreter or program that
    is to process the instructions.


    *   Docstring - a short description of what the script does and the software license
    of the code. This can be a single line but also an extensive description. Such
    lines start with a # and are treated as comments by the shell.


    *   Commands - the combination of single commands that are to be executed by the
    shell. As mentioned, this can be as little as a one-line instruction such as what
    we have in our example below, to a fully-fledged program.


    *   Exit state - defines the return value(s) of the script. Unless explicitly
    stated otherwise, the exit state of the last command executed in the script will
    be returned. It is common to return 0 on success and a value between 1 and 255
    in the event of an error.


    The following basic script contains all the single elements we mentioned above.
    The purpose of the script is to determine the uptime of the computer.


    | #!/bin/bash# determine the uptime of the system# Released under GNU Public License
    (GPL)uptime# define exit state: no errorexit 0 |


    There are two ways to execute a shell script. We can either call a shell such
    as Bash to run it or set the executable flag for the script and run it afterward.
    The first option uses Bash and looks as follows:


    | $ bash uptime.sh12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40,
    0,27$ |


    The second method is based on two steps. First, we set the executable flag for
    the script using the chmod command as follows:


    | $ chmod u+x uptime.sh$ |


    Then we can run the script:


    | $ ./uptime.sh12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28$
    |


    # 7\. Text Processing


    Linux runs on text files for the most part. For example, the configuration files
    that are stored in /etc are stored as text files. Linux offers a rich set of text
    processing commands that are quite comprehensive and also time-saving. Knowing
    what they are and how they work will play a vital role in many of the upcoming
    chapters that delve deeper into Linux. In this chapter, we will have a look at
    these commands and show how to use them.


    7.1 Text Processing Commands


    cat


    Short for concatenate, cat outputs the contents of a file to the screen or standard
    output. The command cat /etc/passwd will output all the lines of the file /etc/passwd
    to the screen.


    | $ cat /etc/passwdroot:x:0:0:root:/root:/bin/bashdaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologinbin:x:2:2:bin:/bin:/usr/sbin/nologinsys:x:3:3:sys:/dev:
    /usr/sbin/nologinsync:x:4:65534:sync:/bin:/bin/syncgames:x:5:60:games:/usr/games:/usr/sbin/nologinman:x:6:12:man:/var/cache/man:/usr/sbin/nologinlp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologinmail:x:8:8:mail:/var/mail:/usr/sbin/nologinnews:x:9:9:news:/var/spool/news:/usr/sbin/nologinuucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologinproxy:x:13:13:proxy:/bin:/usr/sbin/nologinwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologinbackup:x:34:34:backup:/var/backups:/usr/sbin/nologinlist:x:38:38:Mailing
    List Manager:/var/list:/usr/sbin/nologinirc:x:39:39:ircd:/var/run/ircd:/usr/sbin/nologin….$
    |


    cat can also write to a text file using the redirect operator (>). To do this,
    simply use the redirect operator and the name of your text file. For example:


    | cat > output.txt |


    Follow this by the lines of text you wish to output. To quit, press Ctrl+D , and
    type cat output.txt to see the result.


    | $ cat > output.txthello worldthis is a testto see if cat works$ cat output.txthello
    worldthis is a testto see if cat works$ |


    Other useful options for cat are:


    *   -E (short for --show-ends): outputs a $ at the end of each line.


    *   -n (short for --number): numbers all output lines.


    *   -s (short for --squeeze-blank): suppresses repeated empty output lines.


    The cat command can also output multiple files at once. The command cat /etc/passwd
    /etc/group will output the contents of /etc/passwd and /etc/group. Keep in mind
    that the original files are not affected. The next example below outputs the contents
    of the file output.txt twice and continuously numbers all the output lines using
    the option -n .


    | $ cat -n output.txt output.txt          1     hello world          2     this
    is a test          3     to see if cat works          4     hello world         
    5     this is a test          6     to see if cat works$ |


    For a more substantial example, we are going to create three text files named
    file1 , file2, and file3 .  Use the commands cat > file1 , cat > file2 and cat
    > file3 to create the files. Do not forget to press Ctrl+D to exit and use the
    command cat file1 file2 file3 to see them all at once.


    | $ cat > file1this is file one$ cat > file2this is file two$ cat > file3this
    is file three$ cat file1 file2 file3this is file onethis is file twothis is file
    three$ |


    Using the redirect operator, we can then write all three files to a single file.


    | $ cat file1 file2 file3 > bigfile$ cat bigfilethis is file onethis is file twothis
    is file three$ |


    tac


    The tac command works in the same manner as the cat command but displays the lines
    in reverse order. Using bigfile from the previous section, let''s display the
    file using tac :


    | $ tac bigfilethis is file threethis is file twothis is file one$ |


    more


    While cat and tac display the entire file at once, more lets you view the file
    one screen at a time. Let''s say we have a large text file named alice.txt . To
    view it type the following:


    | $ more alice.txt |


    This shows a screen of text starting at the beginning of the file. Use the spacebar
    to scroll through the pages. Alternatively, hitting Enter scrolls down one line
    at a time. The disadvantage of the more command is that it can only scroll down
    but not back up again. For that, there is the less command.


    | Chapter One - Down the Rabbit Hole: Alice a girl of seven years, is feeling
    bored and drowsy while sitting on the riverbank with her elder sister. She then
    notices a talking, clothed White Rabbit with a pocket watch run past. She follows
    it down a rabbit hole when suddenly she falls a long way to a curious hall with
    many locked doors of all sizes. She finds a small key to a door too small for
    her to fit through, but through it, she sees an attractive garden. She then discovers
    a bottle on a table labeled "DRINK ME", the contents of which cause her to shrink
    too small to reach the key which she has left on the table. She eats a cake with
    "EAT ME" written on it in currants as the chapter closes. |


    less


    The less command is a terminal pager that displays one screen of text at a time
    and allows scrolling forward and backward in a file, but it cannot edit a file.
    Inside less , there are commands to traverse the file and to find certain patterns.
    Some examples are:


    *   j - go down one line.


    *   k - go up one line.


    *   g or < - go to the first line.


    *   G or > - go to the last line.


    *   <n>G - go to line <n>.


    *   Space - go to the next page.


    *   d - go forward half a page.


    *   b - go to the previous page.


    *   u - go back half a page.


    *   v - open page in the editor set by the VISUAL environment variable.


    *   /<regex> - search forward for <regex>.


    *   ?<regex> - Search backward for <regex>.'
