    will be installed next.


    Package Management'
  toc: []
  trans: '


    *   无障碍高对比度安装菜单：切换到高对比度的黑白主题。

    *   帮助：获取进一步帮助。

    *   使用语音合成安装：在语音支持下启动安装过程。


    ![](img/Image00012.gif)


    从主启动菜单中选择 `Graphical install`（图形化安装）选项，按 `Enter` 键继续。


    ## 语言选择


    接下来，选择你希望在整个安装过程中使用的语言。对话框和消息将相应地翻译。此选择不会不可逆转地决定你 Linux 系统的语言，你以后可以随时选择不同的语言。


    下图显示了对话框。英语已被预选，因此你只需点击对话框右下角的 `Continue`（继续）按钮即可继续。


    ![](img/Image00013.gif)


    ## 位置选择


    第三，对你的位置进行选择（见下图）。根据你之前设置的语言，列表将列出主要使用该语言的国家。这也会影响本地区域设置，例如你计算机所在的时区。如果需要不同的设置，请选择列表末尾的
    `other`（其他）选项并从那里开始。完成后，点击 `Continue`（继续）按钮进入第四步。


    ![](img/Image00014.gif)


    ## 键盘选择


    第四，从列表中选择你的键盘布局（见下图）。对于美国，预选项目是美式英语。如果你使用不同的键盘布局，请从列表中选择正确的选项。完成后，点击 `Continue`（继续）按钮进入第五步。


    ![](img/Image00015.gif)


    ## 网络设置


    第五步包括从 ISO 镜像中加载安装程序组件，并检测网络硬件以加载正确的网络驱动程序。然后，安装程序将尝试连接互联网，通过本地网络服务器通过 `DHCP`
    获取 IP 地址。


    完成后，你可以设置计算机的主机名（见下文）。为你的机器选择一个唯一的名称，该名称由单个名称组成且在你的本地网络网段中不存在。使用水果、地点、乐器、作曲家和电影角色命名是很常见的。在这种情况下，我们选择了名称
    `debian106`，它简单代表 Linux 发行版及其版本号。


    ![](img/Image00016.gif)


    完成后，点击 `Continue`（继续）按钮进入第六步，添加如 `yourcompany.com` 类的域名。在这种情况下，这是需要的。因此我们留空输入框。点击对话框右下角的
    `Continue` 按钮继续安装。


    ![](img/Image00017.gif)


    ## 用户与角色


    我们的 Linux 系统至少需要两个用户才能正常运行。一个是具有固定名称 `Root` 的管理员用户，另一个是普通用户，在这种情况下我们仅将其命名为 `User`。


    在接下来的两个步骤中，你将为 root 用户设置密码，并为普通用户设置全名和账户名。简单起见，我们使用 `Debian User` 作为全名，`User`
    作为账户名。对于这两个用户，请选择一个不同且你能记住的密码。稍后登录计算机时需要这些密码。


    ![](img/Image00018.gif)


    ## 时区


    设置正确的时区对于与其他服务的通信非常重要，特别是在网络中。从下所示的列表中选择该值。列表中的项目基于你之前选择的位置。完成后，点击 `Continue`（继续）按钮定义存储媒体及相应的分区。


    ![](img/Image00019.gif)


    ## 存储媒体与分区


    Linux 系统可以分布在多个不同的存储媒体上，如硬盘和闪存驱动器。此外，存储媒体可以分为多个磁盘分区。为了实现这一点，设置程序提供了以下方法：


    *   引导式 - 使用整个磁盘：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。这将创建固定大小的分区。

    *   引导式 - 使用整个磁盘并设置 LVM：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。此选项利用逻辑卷管理（`LVM`）创建分区以后可以更改大小的分区。

    *   引导式 - 使用整个磁盘并设置加密 LVM：按照提供的步骤操作，并使用整个磁盘空间进行 Linux 安装。此选项利用逻辑卷管理（`LVM`）创建分区以后可以更改大小的加密分区。

    *   手动：逐个创建分区。这是专家模式，需要对分区和文件系统参数有更深入的。


    ![](img/Image00020.gif)


    从列表中选择 `Guided - use entire disk`（引导式 - 使用整个磁盘）。分区大小的值根据经验选择，并通过算法实现。不需要手动计算。点击对话框右下角的
    `Continue` 按钮继续安装。


    接下来，选择要分区的磁盘。在我们的案例中，只有一个可用磁盘（见下图）。在指南的后续，第一个 SCSI 磁盘将被称为 `/dev/sda`。


    ![](img/Image00021.gif)


    磁盘分区是指存储媒体上被独立组织的区域，旨在包含 Linux 文件系统树的一个分支。目前没有通用的方法来正确地进行这种分离。本指南显示了一个适用于基础系统的简单且安全的解决方案。对话框中的菜单提供以下选项：


    *   所有文件放在一个分区中：仅使用单个分区来存放程序和用户数据。

    *   独立的 `/home` 分区：在独立的分区中存储程序和用户数据。

    *   独立的 `/home`、`/var` 和 `/tmp` 分区：在独立的分区中存储用户数据、变量数据临时数据。


    如下所示，选择第二个选项 `Separate /home`。点击 `Continue` 按钮继续安装。


    ![](img/Image00022.gif)


    下一步是确认分区方案。这是根据经验计算的，包含以下分区：


    *   `sda1`：第一个磁盘的分区是主分区，大小为 2.8 GB，格式化为 `ext4` 文件系统，称为文件系统树的根部分（`/`）。

    *   `sda5`：第一个磁盘的第五分区是逻辑分区，大小为 2.1 GB，格式化为交换分区。

    *   `sda6`：第一个磁盘的第六分区是逻辑分区，大小为 3.6 GB，格式化为 `ext4` 文件系统，用于存储用户数据，称为家目录（`/home`）。


    由于历史原因，硬盘只能包含四个主分区。第四个分区在分为逻辑分区或逻辑驱动时被称为扩展分区。在我们的情况下，逻辑分区 `/dev/sda5` 和 `/dev/sda6`
    存储在主分区 `/dev/sda4` 上。分区 `/dev/sda2` 和 `/dev/sda3` 未使用。


    ![](img/Image00023.gif)


    从上方列表中选择 `Finish partitioning and write changes to disk`（完成分区并将写入磁盘）。点击右下角的 `Continue`
    按钮继续并确认分区方案（见图）。从列表中选择 `yes` 并点击 `Continue` 按钮分区磁盘。注意，所选存储设备上的所有数据将丢失，磁盘将变为空。


    ![](img/Image00024.gif)


    在将存储媒体划分为单个分区后，将按照定义的文件系统对分区进行格式化。在我们的案例中，分区 `/dev/sda1` 和 `/dev/sda6` 使用 `ext4`
    文件系统，分区 `/dev/sda5` 使用交换分区。一旦完成此步骤，下一步将安装 Debian 基础系统。


    ## 包管理

