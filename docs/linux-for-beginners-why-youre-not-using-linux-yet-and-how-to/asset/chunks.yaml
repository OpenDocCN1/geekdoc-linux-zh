    \nUpdating an installed package is quite easy and done in the following way. First,\
    \ update the package list using `apt-get update` as described earlier in this\
    \ chapter. Then run `apt-get install` to update the package. If an updated version\
    \ of the package is available, the new package will be retrieved from the package\
    \ mirror, the old package will be removed, and the new one will be installed.\n\
    \n## Removing an Installed Package\n\nRemoving an installed package is done in\
    \ a similar way as installing or updating. The `apt-get` command has the option\
    \ to remove the package as shown below.\n\n```bash\n# apt-get remove htop\nReading\
    \ package lists… Done\nBuilding dependency tree\nReading state information… Done\n\
    The following packages will be REMOVED:\n      htop\n0 upgraded, 0 newly installed,\
