    7.3 Combining Commands


    Linux commands on their own are already quite powerful, but you can boost their
    functionality even further by combining them using a pipe or redirecting the input/output.
    We will demonstrate how to achieve this below.


    Piping


    Piping (using the keyboard character | found above the \) is a way of connecting
    two or more commands in a chain. The output of one command is not sent to stdout
    but directly given as an input to the next command. This direct connection between
    commands allows them to operate simultaneously and permits data to be transferred
    directly between them continuously, rather than having to pass it through temporary
    text files or the display screen. Pipes are unidirectional, in other words, data
    flows from left to right through the pipeline. The example below shows the two
    commands cat and wc being used to count the number of words in a file.


    | $ cat file2this is file twowith a second line$ cat file2 &#124; wc -w8$ |


    Redirection


    Redirection is a feature in Linux that, when executing a command, can change the
    standard input/output devices. The basic workflow of any Linux command is that
    it takes an input and gives an output. The standard input (stdin) device is the
    keyboard, and the standard output (stdout) device is the screen. With redirection,
    the standard input/output can be changed. You can read the processed data from
    a different input source, and output the result to a different place. Output redirection
    is indicated by the > and >> symbols, and input redirection by the < symbol:


    *   The > symbol sends the output to the given file by creating a new file. If
    the file already exists it will be entirely replaced.


    *   The >> symbol sends the output to the given file and appends it at the end.


    *   The < symbol reads from the given input source.


    The first example below uses the >> operator and adds a third line of text at
    the end of an existing file.


    | $ echo "line 3" >> file2$ cat file2this is file twowith a second lineline 3$
    |


    The second example goes one step further by redirecting the standard output to
    a device. The cat command reads the file music.mp3 and sends the output to the
    device /dev/audio which is the audio device. If the sound configuration in your
    computer is correct, this command will play the music file.


    | $ cat music.mp3 > /dev/audio |


    The next example combines input and output redirection. The wc command reads the
    contents from file2 and counts the words using the option -w . The output is then
    sent to stdout and appended as a new line using the >> operator to the file statistics
    .


    | $ cat file2this is file twowith a second lineline 3$$ wc -w < file210$ wc -w
    < file2 >> statistics$ cat statistics10$ |


