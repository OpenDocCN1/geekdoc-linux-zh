- fmt: "\n```bash\ntune2fs -L root /dev/sdb1 tune2fs -L home /dev/sdb6\n```\n\nNow\
    \ we can mount the new partitions using the `mount` command. Type `df` to see\
    \ the result.\n\n![](Image00063.gif)\n\nAs the final step, let us add entries\
    \ to the configuration file `/etc/fstab` in order to be able to auto-mount these\
    \ filesystems at startup. First make a copy of `/etc/fstab` as `/etc/fstab.bak`:\n\
    \n```bash\ncp /etc/fstab /etc/fstab.bak\n```\n\nThen in order to get the block\
    \ IDs of the new partitions, type `lsblk -f`. The option `-f` (short for `--fs`)\
    \ extends the output with additional filesystem information.\n\n![](Image00064.gif)\n\
    \nNow edit the configuration file `/etc/fstab` and add the last two lines as shown\
