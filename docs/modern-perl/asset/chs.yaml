  \ tables）、关联数组（associative arrays）、字典（dictionaries）和映射。\n\n哈希有两个重要的属性：每个唯一键存储一个标量，且它们不提供键的特定排序。请记住后一个属性。这在\
  \ Perl 中一直如此，但在现代 Perl（Modern Perl）中更是如此。\n\n### 声明哈希\n\n哈希使用符号 `%`。使用以下代码可以声明一个局部作用域的哈希：\n\
  \n| ​  | ​`my %favorite_flavors;`​ |\n\n哈希初始化时是空的。你可以写 `my %favorite_flavors = ();`，但这是多余的。\n\
  \n哈希在访问单个元素时使用标量符号 `$`，并使用大括号 `{ }` 进行键值访问：\n\n| ​  | ​`my %favorite_flavors;`​\
  \ |\n\n| ​  | ​`$favorite_flavors{Gabi} = 'Dark chocolate raspberry';`​ |\n\n| ​ \
  \ | ​`$favorite_flavors{Annette} = 'French vanilla';`​ |\n\n你可以在一个表达式中将键值对列表赋值给哈希：\n\
  \n| ​  | ​`my %favorite_flavors = (`​ | |\n\n| ​  | ​`'Gabi', 'Dark chocolate raspberry',`​\
  \ |\n\n| ​  | ​`'Annette', 'French vanilla',`​ |\n\n| ​  | ​`);`​ | |\n\n哈希存储键值对。如果你给哈希分配了奇数个元素，Perl\
  \ 会向你发出警告。地道的 Perl 经常使用胖逗号运算符（fat comma） `=>` 来将值与键关联，因为这使得配对关系更加可见：\n\n| ​  | ​`my\
  \ %favorite_flavors = (`​ | |\n\n| ​  | ​`Gabi => 'Dark chocolate raspberry',`​\
  \ |\n\n| ​  | ​`Annette => 'French vanilla',`​ |\n\n| ​  | ​`);`​ | |\n\n胖逗号运算符的作用类似于普通逗号，并且会自动为之前的裸字（bareword）加上引号。`strict`\
  \ 指令不会对这种裸字发出警告——而且如果你有一个函数名称与哈希键同名，胖逗号将不会调用该函数：\n\n| ​  | ​`sub name { 'Leonardo'\
  \ }`​ |\n\n| ​  | | |\n\n| ​  | ​`my %address = (`​ | |\n\n| ​  | ​`name => '1123\
  \ Fib Place'`​ | |\n\n| ​  | ​`);`​ | |\n\n此哈希的键将将是 `name` 而非 `Leonardo`。若要调用该函数，请显式地进行函数调用：\n\
  \n| ​  | ​`my %address = (`​ | |\n\n| ​  | ​`name() => '1123 Fib Place'`​ | |\n\n\
  | ​  | ​`);`​ | |\n\n你偶尔可能会看到 `undef %hash`，但那看起来不太美观。通过分配一个空列表来清空哈希：\n\n| ​  |\
  \ ​`%favorite_flavors = ();`​ |\n\n### 哈希索引\n\n要访问单个哈希值，请使用键值访问语法：\n\n| ​  | ​`my\
  \ $address = $addresses{$name};`​ |\n\n在此示例中，`$name` 包含一个同样作为哈希键的字符串。与访问数组的单个元素一样，哈希的符号从\
  \ `%` 变为 `$`，表示对标量值进行键值访问。\n\n你也可以使用字符串字量作为哈希键。Perl 会根据与胖逗号相同的规则自动为裸字加引号：\n\n| ​ \
  \ | ​`# auto-quoted`​ |\n\n| ​  | ​`my $address = $addresses{Victor};`​ | |\n\n\
  | ​  | ​`# needs quoting; not a valid bareword`​ |\n\n| ​  | ​`my $address = $addresses{'Sue-Linn'};`​\
  \ | |\n\n| ​  | ​`# function call needs disambiguation`​ |\n\n| ​  | ​`my $address\
  \ = $addresses{get_name()};`​ | |\n\n> **别引用我的话**\n初学者往往总是给字符串字面量哈希键加上引号，但经验丰富的开发者会尽可能省略引号。如果你这样编写代码，就可以利用引号的罕见出现来表示你正在刻意进行某些特殊操作。\n\
  \n即使是 Perl 的内置函数也会受到自动加引号的处理：\n\n| ​  | ​`my %addresses = (`​ | |\n\n| ​  | ​`Leonardo\
  \ => '1123 Fib Place',`​ | |\n\n| ​  | ​`Utako => 'Cantor Hotel, Room 1',`​ | |\n\
  \n| ​  | ​`);`​ | |\n\n| ​  | | |\n\n| ​  | ​`sub get_address_from_name {`​ | |\n\
  \n| ​  | ​`return $addresses{+shift};`​ | |\n\n| ​  | `}`​ |\n\n一元加号将原本属于裸字（`shift`）的自动加引号规则转换为表达式。\n\
  \n```perl\nmy %favorite_flavors;\n%favorite_flavors = ();\n$favorite_flavors{Gabi}\
  \ = 'Dark chocolate raspberry';\n$favorite_flavors{Annette} = 'French vanilla';\n\
  %favorite_flavors = (\n    'Gabi', 'Dark chocolate raspberry',\n    'Annette', 'French\
  \ vanilla',\n);\nsub name { 'Leonardo' }\nmy %address = (\n    name => '1123 Fib\
  \ Place'\n);\nmy %address = (\n    name() => '1123 Fib Place'\n);\n%favorite_flavors\
  \ = ();\nmy $address = $addresses{$name};\nmy $address = $addresses{Victor};\nmy\
  \ $address = $addresses{'Sue-Linn'};\nmy $address = $addresses{get_name()};\nmy\
  \ %addresses = (\n    Leonardo => '1123 Fib Place',\n    Utako => 'Cantor Hotel,\
  \ Room 1',\n);\nsub get_address_from_name {\n    return $addresses{+shift};\n}\n\
  ```\n\n\n\n\n\n与数组不同，哈希（hash）元素没有明显的顺序。顺序取决于哈希的内部实现、你所使用的 Perl 版本、哈希的大小以及一个随机因素。尽管如此，哈希项的键（keys）、值（values）以及每个对项之间的顺序是一致的。修改哈希可能会改变顺序，但如果哈希保持不变，你可以依赖该顺序。然而，即使两个哈希具有相同的键和值，你也无法认为这两个哈希之间的迭代顺序是相同的。它们可能构建方式不同，或者删除过某些元素。从\
  \ Perl 5.18 开始，即使你用相同构建两个哈希，也无法依赖它们具有相同的迭代顺序。\n\n重新阅读一遍上一段。你会庆幸自己这么做的。\n\n每个哈希对于\
  \ `each` 算符只有一个唯一的迭代器。你无法可靠地使用 `each` 对哈希进行多次迭代；如果你在另一个迭代进行时开始新的迭代，之前的迭代将提前结束，而后一个将在迭代的中间开始。注意不要调用任何可能本身尝试使用\
  \ `each` 迭代哈希的函数。\n\n这通常不是问题，但调试起来并不好玩。可以在空值上下文（void context）中使用 `keys` 或 `values`\
  \ 重置哈希的迭代器：\n\n```perl\n# 重置 迭代器\nkeys %addresses;\nwhile (my ($addressee, $address)\
  \ = each %addresses) {\n    ...\n}\n```\n\n### 哈希切片 (Hash Slices)\n\n哈希切片是在单次操作中索引的哈希的键或值的列表。以下是如何一次性初始化哈希的多个元素：\n\
  \n```perl\nmy %cats;\n@cats{qw( Jack Brad Mars Grumpy )} = (1) x 4;\n```\n\n这等同于以下初始化：\n\
  \n```perl\nmy %cats = map { $_ => 1 } qw( Jack Brad Mars Grumpy );\n```\n\n但注意，哈希切片赋值也可以添加哈希现有的内容。\n\
  \n哈希切片还允许你在单次操作中从哈希中检索多个值。与数组切片一样，哈希的符号（sigil）变为 `@` 以表示列表上下文。花括号的使用表示键值访问，并使你正在处理哈希的事实变得言而无遗：\n\
  \n```perl\nmy @buyer_addresses = @addresses{ @buyers };\n```\n\n哈希切片使得合并两个哈希变得简单：\n\
  \n```perl\nmy %addresses = ( ... );\nmy %canada_addresses = ( ... );\n@addresses{\
  \ keys %canada_addresses } = values %canada_addresses;\n```\n\n这等同于手动遍历 `%canada_addresses`\
  \ 的内容，但短得多。注意，这依赖于哈希在键和值之间的迭代顺序保持一致。Perl 保证了这一点，但仅是因为这些操作发生在同一个哈希上，且在键和值操作之间没有对该哈希进行修改。\n\
  \n如果同一个键出现在两个哈希中会怎样？哈希切片方法总是覆盖 `%addresses` 中现有的键值对。如果你想要其他行为，循环更为合适。\n\n### 空哈希\
  \ (The Empty Hash)\n\n空哈希不包含任何键或值。它在布尔上下文中求值为假值。包含至少一个键/值对的哈希在布尔上下文中求结果为真值，即使所有的键或所有的值或两者本身求值结果为布尔假值。\n\
  \n```perl\nuse Test::More;\nmy %empty;\nok ! %empty, 'empty hash should evaluate\
  \ to false';\n\nmy %false_key = ( 0 => 'true value' );\nok %false_key, '包含假键的哈希应该求值为\
  \ true';\n\nmy %false_value = ( 'true key' => 0 );\nok %false_value, '包含假值的哈希应该求值为\
  \ true';\n\ndone_testing();\n```\n\n在标量上下文（scalar context）中，哈希求值为一个代表哈希中满桶比例的字符串——这是关于哈希实现的内部细节，你可以安全地忽略它。在布尔标量上下文中，该比例求值为假值，所以记住这一点，而不是比例细节。\n\
  \n在列表上下文中，哈希求值为一个键/值对列表，类似于 `each` 算符产生的列表。然而，你不能像迭代 `each` 产生的列表那样来迭代这个列表。这个循环永远不会终止：\n\
  \n```perl\nwhile (my ($key, $value) = %hash) {\n    # 非空哈希的无限循环\n    ...\n}\n```\n\
  \n你可以使用 `for` 循环遍历键和值的列表，但迭代器变量将获得键和值的列表。\n\n### 哈希惯用法 (Hash Idioms)\n\n每个哈希对于 `each`\
  \ 算符只有一个唯一的迭代器。你无法可靠地使用 `each` 对哈希进行多次迭代；如果你在另一个迭代进行时开始新的迭代，之前的迭代将提前结束，而后一个将在迭代的中间开始。注意不要调用任何可能本身尝试使用\
  \ `each` 迭代哈希的函数。\n\n这通常不是问题，但调试起来并不好玩。可以在空值上下文中使用 `keys` 或 `values` 重置哈希的迭代器：\n\
  \n```perl\n# 重置 迭代器\nkeys %addresses;\nwhile (my ($addressee, $address) = each %addresses)\
  \ {\n    ...\n}\n```\n（注：原文包含重复章节/格式伪迹；我已根据逻辑流清理了结构。）\n\n\n\n\n\n### 锁定哈希\n\n由于哈希键（hash\
  \ keys）是裸字，与严格 pragma 提供的函数和变量名保护相比，它们对防止拼写错误的作用很小。不常用的核心模块 `Hash::Util` 可以让哈希更加安全。\n\
  \n为了防止有人意外添加你并非本意的哈希键（无论是由于拼写错误还是来自不可信的用户输入），可以使用 `lock_keys()` 函数将哈希限制在其当前的键值集合中。任何尝试向哈希添加新键的尝试都将抛出异常。同样，你可以锁定或解锁哈希中给定键现有值（`lock_value()`\
  \ 和 `unlock_value()`），并使用 `lock_hash()` 和 `unlock_hash()` 设置或取消整个哈希的只读状态。\n\n这是一种宽松的安全措施；任何人都可以使用适当的解锁函数来绕过锁定。然而，它确实能防止拼写错误和其他意外事件。\n\
  \n## 强制转换\n\n在 Perl 变量的生命周期内，它可能包含不同类型的值——字符串、整数、有理数等。Perl 并没有在变量上附加类型信息，而是依赖操作符提供的上下文（数值、字符串和布尔上下文）来决定如何处理这些值。根据设计，Perl\
  \ 尝试执行你的意图——你可能会听到被称为 DWIM（do what I mean，按我的意图执行）或 dwummery——但你必须明确你的意图。如果你将一个值视为字符串，Perl\
  \ 会尽力将该值强制转换为字符串。\n\n### 布尔强制转换\n\n当测试值的真值（truthiness）时发生布尔强制转换，例如在 `if` 或 `while`\
  \ 条件中。数值 `0`、`undef`、空字符串和字符串 `'0'` 都评估为假值。所有其他值——包括数值上可能等于零的字符串（如 `'0.0'`、`'0e'`\
  \ 和 `'0 but true'`）——都被评估为真值。\n\n当标量同时具有字符串和数值部分时（双重变量），Perl 倾向于检查字符串部分的布尔真值。`'0\
  \ but true'` 在数值上评估为零，但它不是空字符串，因此在布尔上下文中被评估为真值。\n\n### 字符串强制转换\n\n当使用字符串操作符（如比较符\
  \ `eq` 和 `cmp`）、连接、`split`、`substr` 和正则表达式，以及将值或表达式作为哈希键使用时，会被字符串强制转换。未定义的值会被字符串化为空字符串，但会产生“使用未初始化的值”（use\
  \ of uninitialized value）警告。数字会被字符串化包含其数值的字符串；值 `10` 字符串化字符串 `10`。你可以通过以下方式将数字拆分为单个数字：\n\
  \n| | `my @digits = split('', 1234567890);` |\n\n### 数值强制转换\n\n当使用数值比较操作符（如 `==`\
  \ 和 `<=>`）、执行数学运算，以及将值或表达式作为数组或列表索引时，会被数值强制转换。未定义的值 `num` 数值化为零并产生“使用未初始化的值”警告。不以数字部分开头的字符串数值化为\
  \ 0 并产生“参数不是数值”（argument isn’t numeric）警告。以数值字面量允许的字符开头的字符串数值化为这些值且不产生警告，例如 `10\
  \ leptons leaping` 数值化为 `10`，`6.022e23 moles marauding` 数值化为 `6.022e23`。\n\n核心模块\
  \ `Scalar::Util` 包含一个 `looks_like_number()` 函数，它使用与 Perl 解析相同的相同的从字符串中提取数字。\n\n\
  | 数学家们的欢庆 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png) | 字符串 `Inf`\
  \ 和 `Infinity` 代表无限值并像数字一样运行。字符串 `NaN` 代表“不是数字”的概念。将它们数值化不会产生“参数不是数值”警告。注意，Perl\
  \ 对无限和非数字的理解可能与你平台的理解不匹配；这些概念并不总是可以跨操作系统移植的。即使宇宙的其他部分不一致，Perl 也是一致的。 |\n\n### 引用强制转换\n\
  \n对非引用使用解引用操作会将该值转换为引用。这种自动创建（Autovivification）的过程在处理嵌套数据结构（嵌套数据结构）时非常有用：\n\n| |\
  \ `my %users;` |\n| | |\n| `$users{Brad}{id} = 228;` |\n| `$users{Jack}{id} = 229;`\
  \ |\n\n尽管哈希从未包含 Brad 和 Jack 的值，但 Perl 帮助为他们创建了哈希引用，然后为每个分配了以 id 为键的键值对。\n\n### 缓存强制转换\n\
  \nPerl 对值的内部表示同时存储了字符串和数值值。将数值值字符串化不会替换数值值。相反，它会将字符串化后的值添加到内部表示中，该表示随后将包含这两个部分。同样，将字符串值数值化会填充数值部分，同时保持字符串部分不变。\n\
  \n某些 Perl 操作倾向于使用值的某一个组件而不是另一个——例如，布尔检查倾向于字符串。如果一个值以你不预期的形式具有缓存表示，那么依赖隐式转换可能会产生意想不到的结果。你几乎不需要显式说明你期望什么——我记得二十年里只这样做过两次。尽管如此，知道这种缓存的存在可能对你有帮助。\n\
  \n### 双重变量\n\nPerl 值的多组件特性以双重变量的形式存在。核心模块 `Scalar::Util` 提供了 `dualvar()`，允许你跳过强制转换并分别操作字符串和数值部分：\n\
  \n```perl\nmy $varname = dualvar(0, 'Sparkles & Blue');\n```\n\n## 包 (Packages)\n\
  \nPerl 命名空间关联并封装了各种实体。它就像你的姓氏或品牌名。与现实世界中的名称不同，命名空间并不意味着有直接关系。这种关系可能存在，但并不是要求的。\n\
  \nPerl 中的包（package）是单个命名空间中的代码集合。这种区别是细微的：包代表源代码，而命名空间代表 Perl 用于收集这些代码的内部数据结构。\n\
  \n内置的 package 关键字声明了一个包和一个命名空间：\n\n```perl\npackage MyCode;\nour @boxes;\nsub add_box\
  \ { ... }\n```\n\n在包声明之后声明或引用的所有全局变量和函数都指向 MyCode 命名空间内的符号。你只能通过完全限定名 `@MyCode::boxes`\
  \ 从主命名空间引用 `@boxes` 变量。完全限定名包含了完整的包名，因此你可以通过 `MyCode::add_box()` 调用 `add_box()`\
  \ 函数。\n\n包的作用范围持续到下一个包声明或文件结束，以先者为准。你也可以使用带的 package 来界定声明范围：\n\n```perl\npackage\
  \ Pinball::Wizard {\n    our $VERSION = 1969;\n}\n```\n\n默认包是主包（main package）。没有包声明的情况下，当前包就是\
  \ main。这一规则适用于单行命令、独立程序甚至 .pm 文件。\n\n除了名称外，包还有一个版本号和三个隐式方法：`import()`（导入`）、`unimport()`\
  \ 和 `VERSION()`。`VERSION()` 返回包的版本。这是一个包含在包全局变量 `$VERSION` 中的一系列数字。根据粗惯例，版本是一系列点分隔的整数，例如\
  \ 1.23 或 1.1.10。\n\n\n\n\nPerl 为版本号包含了一种更严格的语法，如 `perldoc version::Internals` 中记录所示。这些版本号必须以字符\
  \ `v` 开头，并包含至少三个由句号分隔的整数部分：\n\n```perl\npackage MyCode v1.2.1;\n```\n\n结合包声明的块形式，你可以写出以下代码：\n\
  \n```perl\npackage Pinball::Wizard v1969.3.7 { ... }\n```\n\n你更有可能看到这种旧版本的代码，其写法如下所示：\n\
  \n```perl\npackage MyCode;\nour $VERSION = 1.21;\n```\n\n每个包都从 `UNIVERSAL` 基类继承一个\
  \ `VERSION()` 方法。该方法返回 `$VERSION` 的值：\n\n```perl\nmy $version = Some::Plugin->VERSION;\n\
  ```\n\n如果你将版本号作为参数传递，除非模块的版本等于或大于该参数，否则该方法将抛出异常：\n\n```perl\n# 至少需要 2.1\nSome::Plugin->VERSION(\
  \ 2.1 );\ndie \"Your plugin $version is too old\" unless $version > 2;\n```\n\n\
  你可以重写 `VERSION()`，尽管这样做的理由并不多。\n\n### 包与命名空间\n\n每个包声明在需要时创建一个新的命名空间。在 Perl 解析该声明后，它会将所有后续的包全局符号（全局变量和函数）存储在真命名空间中。\n\
  \nPerl 拥有开放的命名空间。你可以在任何时候向命名空间添加函数或变量，可以通过一个新的包声明来实现：\n\n```perl\npackage Pack {\n\
  \    sub first_sub { ... }\n}\nPack::first_sub();\n\npackage Pack {\n    sub second_sub\
  \ { ... }\n}\nPack::second_sub();\n```\n\n或者通过使用完全限定名声明函数：\n\n```perl\n# 隐式\npackage\
  \ main;\nsub Pack::third_sub { ... }\n```\n\n你可以在编译或运行期间的任何一点向包添加内容，无论当前在哪个文件中，但从多个文件的多个声明中构建一个包可能会导致代码难以追溯（spelunk）。\n\
  \n命名空间可以根据你的组织方案具有任意层级，尽管命名空间并不是层次化的。独立包之间唯一的关系是语义上的，而非技术上的。许多项目和企业创建自己的顶层命名空间。这减少了全局冲突的可能性，并有助于在磁盘上组织代码，例如：\n\
  \n*   `StrangeMonkey` 是项目名称。\n*   `StrangeMonkey::UI` 组织用户界面代码。\n*   `StrangeMonkey::Persistence`\
  \ 组织数据管理代码。\n*   `StrangeMonkey::Test` 组织项目的测试代码。\n\n以此此类推。这是一种惯例，但它是非常有用的惯例。\n\n\
  ## 引用\n\nPerl 通常会按照你的预期行事，即使你的预期是细微的。考虑一下向函数传递值时会发生什么：\n\n```perl\nsub reverse_greeting\
  \ {\n    my $name = reverse shift;\n    return \"Hello, $name!\";\n}\n\nmy $name\
  \ = 'Chuck';\nsay reverse_greeting($name);\nsay $name;\n```\n\n在函数外部，`$name` 包含\
  \ Chuck，尽管传入函数的值被反转成了 kcuhC。你可能预料到了这一点。函数外部的 `$name` 的值与函数内部的 `$name` 是分离的。修改其中一个对另一个没有影响。\n\
  \n考虑另一种情况。如果你必须在任何值被你修改之前对每个值进行复制，那么你将编写大量的额外防御性代码。\n\n有时，原地修改值是有用的。如果你想将一个包含大量数据的哈希传递给函数以进行修改，那么为每次更改创建并返回一个新的哈希可能会是繁琐且低效的，至少在没有某些神奇编译器魔法的情况下。\n\
  \nPerl 提供了一种机制，可以在不创建副本的情况下引用一个值。对该引用的任何更改都会原地更新值，使得所有对该值的引用都指向修改后的值。引用是一个一阶标量数据类型，它引用另一个一阶数据类型。\n\
  \n### 标量引用\n\n引用操作符是反斜杠（`\\`）。在标量上下文中，它会创建一个指向另一个值的单一引用。在列表上下文中，它会创建一个引用列表。要获取 `$name`\
  \ 的引用，请执行：\n\n```perl\nmy $name = 'Larry';\nmy $ref = \\$name;\n```\n\n复杂的引用可能需要大括号块来消除表达式部分的歧义。你始终可以使用这种语法，尽管有时它会变得清晰，有时会模糊时间：\n\
  \n```perl\nsub reverse_place {\n    my $name_ref = shift;\n    ${ $name_ref } =\
  \ reverse ${ $name_ref };\n}\n```\n\n如果你忘记对标量引用解引用，Perl 可能会将引用强制转换为形式为 `SCALAR(0x9333e8)`\
  \ 的字符串值或类似于 `0x9333e8` 的数值。该值表示引用的类型（在此情况下为 `SCALAR`）以及引用在内存中的位置（因为这是一个明确的设计选择，而不是因为你可以对内存位置做任何事情）。\n\
  \n#### 迭代与别名\n\n```perl\nsub reverse_place {\n    my $name_ref = shift;\n    $_[0]\
  \ = reverse $_[0];\n}\n```\n\n```perl\nmy $name = 'alliz';\nreverse_place($name);\n\
  ```\n\n#### 使用引用节省内存\n\n原地修改值或返回引用可以节省内存。因为 Perl 在赋值时会复制值，传递引用意味着 Perl 将复制这些引用。然而，在修改代码仅传递引用之前，请进行测量以查看这是否会产生差异。\n\
  \n#### 引用不是指针\n\nPerl 不提供对内存的原生访问。引用的地址是一个用作标识符的值。与 C 等语言中的指针不同，你不能修改引用的地址，也不能将其视为内存地址。这些地址大多是唯一的，因为\
  \ Perl 在回收未使用的内存时可能会重用存储位置。\n\n### 数组引用\n\n数组引用在几种情况下非常有用：\n\n*   在函数间传递和返回数组而不进行列表扁平化\n\
  *   创建多维数据结构\n*   避免必要的数组复制\n*   持有匿名数据结构\n\n使用引用操作符创建已声明数组的引用：\n\n```perl\nmy @cards\
  \ = qw(K Q J 10 9 8 7 6 5 4 3 2 A);\nmy $cards_ref = \\@cards;\n```\n\n\n\n通过 `$cards_ref`\
  \ 进行的任何修改都会修改 `@cards`，反之亦然。你可以使用 `@` 符号作为一个整体访问整个数组，无论是将数组扁平化为列表（列表上下文）还是计算其元素（标量上下文）：\n\
  \n| | `my $card_count = @$cards_ref;` |\n| | `my @card_copy = @$cards_ref;` |\n\n\
  使用引用箭头 (`->`) 访问单个元素：\n\n| | `my $first_card = $cards_ref->[0];` |\n| | `my $last_card\
  \ = $cards_ref->[-1];` |\n\n箭头是必要的，用于区分名为 `$cards_ref` 的标量和名为 `@cards_ref` 的数组。注意这里使用标量符号来访问单个元素。\n\
  \n#### 双重符号 (Doubling Sigils)\n\n| | --- |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | 另一种语法在数组引用前再加一个标量符号。这种写法更短，但写起来更难看：`my $first_card = $$cards_ref[0];`。\n\n使用大括号引用语法对数组引用进行切片：\n\
  \n| | `my @high_cards = @{ $cards_ref }[0 .. 2, -1];` |\n\n你可以省略大括号，但它们的分组通常会提高可读性。\n\
  \n要创建一个匿名数组，用方括号包围产生列表的表达式：\n\n| | `my $suits_ref = [qw( Monkeys Robots Dinos Cheese\
  \ )];` |\n\n此数组引用的行为与命名数组引用相同，不同之处匿名数组的括号总是创建一个新的引用。在它的作用域内获取命名数组的引用始终指向同一个数组，例如：\n\
  \n| | `my @meals = qw( soup sandwiches pizza );` |\n| | `my $sunday_ref = \\@meals;`\
  \ |\n| | `my $monday_ref = \\@meals;` |\n| | `push @meals, 'ice cream sundae';`\
  \ |\n\n此时 `$sunday_ref` 和 `$monday_ref` 都包含一个甜点，而：\n\n| | `my @meals = qw( soup\
  \ sandwiches pizza );` |\n| | `my $sunday_ref = [ @meals ];` |\n| | `my $monday_ref\
  \ = [ @meals ];` |\n| | `push @meals, 'berry pie';` |\n\n此时 `$sunday_ref` 和 `$monday_ref`\
  \ 都不包含甜点。在创建匿名数组使用的大括号内，列表上下文会将 `@meals` 数组扁平化为与 `@meals` 解开连接的列表。\n\n#### 哈希引用\
  \ (Hash References)\n\n在命名哈希上使用引用操作符来创建哈希引用：\n\n| | `my %colors = (` |\n| | blue\
  \ => 'azul', |\n| | gold => 'dorado', |\n| | red => 'rojo', |\n| | yellow => 'amarillo',\
  \ |\n| | purple => 'morado', |\n| | `);` |\n| | `my $colors_ref = \\%colors;` |\n\
  \n通过在引用前加上哈希符号 `%` 来访问哈希的键或值：\n\n| | `my @english_colors = keys %$colors_ref;` |\n\
  | | `my @spanish_colors = values %$colors_ref;` |\n\n使用引用箭头或双重标量符号来访问哈希的单个值（存储、删除、检查是否存在或检索）：\n\
  \n```\nsub translate_to_spanish {\n    my $color = shift;\n    return $colors_ref->{$color};\n\
  \    # or return $$colors_ref{$color};\n}\n```\n\n使用数组符号 (`@`) 和歧义大括号对哈希引用进行切片：\n\
  \n| | `my @colors = qw( red blue green );` |\n| | `my @colores = @{ $colors_ref\
  \ }{@colors};` |\n\n使用大括号直接创建匿名哈希：\n\n| | `my $food_ref = {` |\n| | 'birthday cake'\
  \ => 'la torta de cumpleantildeos', |\n| | candy => 'dulces', |\n| | cupcake =>\
  \ 'bizcochito', |\n| | 'ice cream' => 'helado', |\n| | `};` |\n\n与词法文件句柄一样，分组通常会提高可读性。它的行为与命名数组引用相同，不同之处匿名数组的括号总是创建一个新的引用。在它的作用域内获取命名数组的引用始终指向同一个数组，例如：\n\
  \n```\nmy @meals = qw( soup sandwiches pizza );\nmy $sunday_ref = \\@meals;\nmy\
  \ $monday_ref = \\@meals;\npush @meals, 'ice cream sundae';\n```\n\n此时 `$sunday_ref`\
  \ 和 `$monday_ref` 都包含一个甜点，而：\n\n```\nmy @meals = qw( soup sandwiches pizza );\n\
  my $sunday_ref = [ @meals ];\nmy $monday_ref = [ @meals ];\npush @meals, 'berry\
  \ pie';\n```\n\n此时 `$sunday_ref` 和 `$monday_ref` 都不包含甜点。在创建匿名数组使用的大括号内，列表上下文会将 `@meals`\
  \ 数组扁平化为与 `@meals` 解开连接的列表。\n\n#### 函数引用 (Function References)\n\n使用数组符号 (`@`) 和歧义大括号对哈希引用进行切片。它的行为与命名数组引用相同，不同之处匿名数组的括号总是创建一个新的引用。在它的作用域内获取命名数组的引用始终指向同一个数组，例如：\n\
  \n```\nmy @meals = qw( soup sandwiches pizza );\nmy $sunday_ref = \\@meals;\nmy\
  \ $monday_ref = \\@meals;\npush @meals, 'ice cream sundae';\n```\n\n此时 `$sunday_ref`\
  \ 和 `$monday_ref` 都包含一个甜点，而：\n\n```\nmy @meals = qw( soup sandwiches pizza );\n\
  my $sunday_ref = [ @meals ];\nmy $monday_ref = [ @meals ];\npush @meals, 'berry\
  \ pie';\n```\n\n此时 `$sunday_ref` 和 `$monday_ref` 都不包含甜点。在创建匿名数组使用的大括号内，列表上下文会将 `@meals`\
  \ 数组扁平化为与 `@meals` 解开连接的列表。\n\n#### 文件引用 (File References)\n\n使用数组符号 (`@`) 和歧义大括号对哈希引用进行切片。它的行为与命名数组引用相同，不同之处匿名数组的括号总是创建一个新的引用。在它的作用域内获取命名数组的引用始终指向同一个数组，例如：\n\
  \n```\nmy @meals = qw( soup sandwiches pizza );\nmy $sunday_ref = \\@meals;\nmy\
  \ $monday_ref = \\@meals;\npush @meals, 'ice cream sundae';\n```\n\n此时 `$sunday_ref`\
  \ 和 `$monday_ref` 都包含一个甜点，而：\n\n```\nmy @meals = qw( soup sandwiches pizza );\n\
  my $sunday_ref = [ @meals ];\nmy $monday_ref = [ @meals ];\npush @meals, 'berry\
  \ pie';\n```\n\n此时 `$sunday_ref` 和 `$monday_ref` 都不包含甜点。在创建匿名数组使用的大括号内，列表上下文会将 `@meals`\
  \ 数组扁平化为与 `@meals` 解开连接的列表。\n\n\n\n\n在示例的内部块中，有一个 `$fh`。（源代码中多次提到它，但只有一个变量，即名为 `$fh`\
  \ 的变量）。`$fh` 只在块内具有作用域。它的值不会离开该块。当执行到块的末尾时，Perl 会回收变量 `$fh` 并减少 `$fh` 所指向的文件句柄的引用计数。文件句柄的引用计数归零，因此\
  \ Perl 会销该文件句柄以释放内存。作为过程的一部分，它会隐式地对文件句柄调用 `close()`。\n\n你不需要理解其工作原理的细节。你只需要理解，获取引用并传递它们的操作会影响\
  \ Perl 管理内存的方式（参见循环引用）。\n\n### 引用与函数\n\n当你将引用作为函数的参数时，请务必仔细地记录你的意图。在函数内部修改引用的值可能会让调用代码感到意外，因为调用代码从未料到会有其他地方修改其数据。若要在不影响引用本身的情况下修改引用的内容，请将其值复制到新变量中：\n\
  \n| |\n`my @new_array = @{ $array_ref };` | `my %new_hash = %{ $hash_ref };` |\n\
  \n这种情况仅在少数情况下是必要的，但显式克隆有助于避免调用代码出现糟糕的意外。如果你使用了嵌套数据结构或其他复杂的引用，请考虑使用核心模块 `Storable`\
  \ 及其 `dclone`（深克隆）函数。\n\n## 嵌套数据结构\n\nPerl 的聚合数据类型——数组和哈希——存储由整数或字符串键索引的标量。注意标量这个词。如果你尝试将一个数组存储在数组中，Perl\
  \ 的自动列表展化会将所有内容变成一个单一数组：\n\n| |\n`my @counts = qw( eenie miney moe );` |\n`my @ducks\
  \ = qw( huey dewey louie );` |\n`my @game = qw( duck duck grayduck );` |\n`my @famous_triplets\
  \ = (`\n`@counts, @ducks, @game`\n``);` |\n\nPerl 对此问题的解决方案是引用（引用），它们是特殊的标量，可以指向其他变量（标量、数组和哈希）。通过使用引用，可以在\
  \ Perl 中实现嵌套数据结构（例如数组的数组或哈希的哈希）。遗憾的是，引用的语法可能有点丑。\n\n使用引用操作符 `\\` 来生成指向命名变量的引用：\n\
  \n| |\n`my @famous_triplets = (`\n`\\@counts, \\@ducks, \\@game`\n`);` |\n\n或者使用匿名引用声明语法来避免使用命名变量：\n\
  \n| |\n`my @famous_triplets = (`\n`[qw( eenie miney moe )],`\n`[qw( huey dewey louie\
  \ )],`\n`[qw( duck duck goose )],`\n`);` | |\n|\n`my %meals = (`\n`breakfast =>\
  \ { entree => 'eggs',`\n`side => 'hash browns' },`\n`lunch => { entree => 'panini',`\n\
  `side => 'apple' },`\n`dinner => { entree => 'steak',`\n`side => 'avocado salad'\
  \ },`\n`);` |\n\n#### 逗号是免费的\n\n| |\n| --- |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | Perl 允许在列表最后一个元素后添加可选的尾逗号。这使得将来添加更多元素变得容易。 |\n\n使用 Perl 的引用语法来访问嵌套数据结构中的元素。符号（sigil）表示要检索的数据量。取消箭头（->）表示数据结构一部分的值是一个引用：\n\
  \n| |\n`my $last_nephew = $famous_triplets[1]->[2];` |\n`my $meal_side = $meals{breakfast}->{side};`\
  \ |\n\n访问嵌套数据结构中元素的唯一方法是通过引用，因此前述示例中的箭头是多余的。为了清晰起见，你可以省略它，调用函数引用除外：\n\n| |\n`my\
  \ $nephew = $famous_triplets[1][2];` |\n`my $meal = $meals{breakfast}{side};` |\n\
  |\n`$actions{generous}{buy_food}->( $nephew, $meal );`\n\n使用消歧义块（disambiguation\
  \ blocks）像访问第一类数组或哈希一样访问嵌套数据结构的组件：\n\n| |\n`my $nephew_count = @{ $famous_triplets[1]\
  \ };` |\n`my $dinner_courses = keys %{ $meals{dinner} };` |\n\n或者使用它们来切片嵌套数据结构：\n\
  \n| |\n`my ($entree, $side) = @{ $meals{breakfast} }{ qw( entree side ) };` |\n\n\
  空白有帮助，但不能完全消除这种结构的杂乱。有时，临时变量可以提供更高的清晰度：\n\n| |\n`my $meal_ref = $meals{breakfast};`\
  \ |\n`my ($entree, $side) = @$meal_ref{qw( entree side )};` |\n\n你还可以使用 `for` 的隐式别名来避免使用中间引用（尽管注意缺少\
  \ `my`）：\n\n| |\n`($entree, $side) = @{ $_ }{qw( entree side )} for $meals{breakfast};`\
  \ |\n\nperldoc perldsc（数据结构食谱）提供了大量如何使用 Perl 各种数据结构的示例。\n\n### 自动生存 (Autovivification)\n\
  \n当你尝试向数据结构的组件写入内容时，Perl 会创建该路径：\n\n| |\n`my @aoa;` |\n`$aoa[0][0][0] = 'nested';`\
  \ |\n\n同样，当你要求 Perl 将一个未定义值视为哈希时，Perl 会将该未定义值转换为哈希：\n\n| |\n`my %hoh;` |\n`$hoh{Santa}\
  \ = 'mostly';` |\n\n这种行为被称为自动生存（autovivification）。虽然它减少了嵌套数据结构的初始化代码，但无法区分创建缺失元素的真实意图与拼写错误。\n\
  \n| |\n`my %hoh;` |\n`$hoh{key} = {};` |\n\n你可能会对在利用自动生存的同时开启严格模式之间的矛盾感到困惑。以几个引用为代价来捕获改变程序行为的错误是否更方便？\n\
  \n答案取决于你的项目。在开发早期，给自己实验的自由。在测试和部署期间，也许可以增加严格性以防止意外影响。来自 CPAN 的自动生存指令（指令）允许你在词法作用域内针对特定类型禁用自动生存。结合严格指令，你可以在需要的地方启用这些行为。\n\
  \n### 调试嵌套数据结构\n\nPerl 取引用语法的复杂性加上多层引用可能导致的混淆，使得嵌套数据结构的调试变得困难。核心模块 `Data::Dumper`\
  \ 将任意复杂的值转换为 Perl 代码字符串，有助于可视化你所拥有的：\n\n```\nuse Data::Dumper;\n\nmy $complex_structure\
  \ = {\n    numbers => [1 .. 3],\n    letters => ['a' .. 'c'],\n    objects => {\n\
  \        breakfast => $continental,\n        lunch => $late_tea,\n        dinner\
  \ => $banquet,\n    },\n};\n\nprint Dumper($complex_structure);\n```\n\n这可能会产生类似的内容：\n\
  \n```perl\n$VAR1 = {\n  'numbers' => [\n    1,\n    2,\n    3\n  ],\n  'letters'\
  \ => [\n    'a',\n    'b',\n    'c'\n  ],\n  'objects' => {\n    'breakfast' =>\
  \ $continental,\n    'lunch' => $late_tea,\n    'dinner' => $banquet\n  }\n};\n\
  ```\n\n\n\n\n\n```perl\n[\n  'a',\n  'b',\n  'c'\n],\n  'meals' => {\n    'dinner'\
  \ => bless({...}, 'Dinner'),\n    'lunch' => bless({...}, 'Lunch'),\n    'breakfast'\
  \ => bless({...}, 'Breakfast'),\n  },\n};\n```\n\n当你需要弄清楚数据结构包含什么、你应该访问什么，以及你实际访问了什么时，请使用此工具。正如省略的示例所示，`Data::Dumper`\
  \ 可以导出对象，也可以导出函数引用（如果你将 `$Data::Dumper::Deparse` 设置为真值）。\n\n虽然 `Data::Dumper` 是核心模块且会打印\
  \ Perl 代码，但它的输出非常冗长。一些开发者倾向于使用 `YAML::XS` 或 `JSON` 模块进行调试。它们不产生 Perl 代码，但其输出读起来更清晰、更容易理解。\n\
  \n### 循环引用\n\nPerl 的引用计数（Reference Counts）内存管理系统有一个缺点。两个相互指向的引用（无论是直接还是间接）会形成 Perl\
  \ 无法自行销毁的循环引用。考虑一个生物模型，其中每个实体有两个父母和零或多个孩子：\n\n```perl\nmy $alice = { mother => '',\
  \ father => '' };\nmy $robin = { mother => '', father => '' };\nmy $cianne = { mother\
  \ => $alice, father => $robin };\n\npush @{ $alice->{children} }, $cianne;\npush\
  \ @{ $robin->{children} }, $cianne;\n```\n\n`$alice` 和 `$robin` 都包含一个包含 `$cianne`\
  \ 的数组引用。因为 `$cianne` 是包含 `$alice` 和 `$robin` 的哈希引用，Perl 永远不会将这三个人任何引用计数减零。它无法识别这些循环引用的存在，也无法管理这些实体的生命周期。\n\
  \n你可以手动打破引用计数（通过清除 `$alice` 和 `$robin` 的孩子或 `$cianne` 的父母），或者使用弱引用。弱引用不会增加其指向对象的引用计数。使用核心模块\
  \ `Scalar::Util` 的 `weaken()` 函数来弱化引用：\n\n```perl\nuse Scalar::Util 'weaken';\n\n\
  my $alice = { mother => '', father => '' };\nmy $robin = { mother => '', father\
  \ => '' };\nmy $cianne = { mother => $alice, father => $robin };\n\npush @{ $alice->{children}\
  \ }, $cianne;\npush @{ $robin->{children} }, $cianne;\n\nweaken( $cianne->{mother}\
  \ );\nweaken( $cianne->{father} );\n```\n\n`$cianne` 将保留对 `$alice` 和 `$robin` 的可用引用，但这些弱引用不会计入父母剩余引用的数量。如果\
  \ `$alice` 的引用计数达到零，Perl 的垃圾回收会将回收她的记录，即使 `$cianne` 对 `$alice` 有弱引用。当 `$alice` 被回收时，`$cianne`\
  \ 对 `$alice` 的引用将被设置为 `undef`。\n\n大多数数据结构不需要弱引用，但在需要时，它们是无价之。\n\n### 嵌套数据结构的替代方案\n\
  \n虽然 Perl 乐于处理你所想象的最深嵌套的数据结构，但理解这些数据结构及其关系的成本——更不用说复杂的语法——是非常高的。超过两三层嵌套，请考虑使用类和对象（Moose）对系统的各个组件进行建模是否会让代码更清晰。\n\
  \n#### 脚注\n\n- [[7]](#f_0020.html_FNPTR-7) | [`perl.plover.com/varvarname.html`](http://perl.plover.com/varvarname.html)\n\
  - [[8]](#f_0022.html_FNPTR-8) | [`unicode.org/charts/`](http://unicode.org/charts/)\n\
  - [[9]](#f_0022.html_FNPTR-9) | [`stackoverflow.com/questions/6162484/why-does-modern-perl-avoid-utf-8-by-default/6163129#6163129`](http://stackoverflow.com/questions/6162484/why-does-modern-perl-avoid-utf-8-by-default/6163129#6163129)\n\
  - [[10]](#f_0022.html_FNPTR-10) | [`perl.plover.com/varvarname.html`](http://perl.plover.com/varvarname.html)\n\
  \n\n\n\n\n算术运算符是二元运算符，并且通常具有左结合性。这对于相同优先级的操作数的求值顺序产生了影响。例如，`2 + 3 - 4` 会先计算 `2 +\
  \ 3`。加法和减法具有相同的优先级，但它们是左结合且二元的，因此正确的评估顺序是将最左边的运算符（`+`）应用于最左边的两个操作数（`2` 和 `3`），然后将最右边的运算符（`-`）应用于第一次操作的结果和最右边的操作数（`4`）。\n\
  \n## 固定性 (Fixity)\n\nPerl 初学者经常会对列表运算符（尤其是函数调用）与嵌套表达式之间的相互作用感到困惑。虽然括号通常有帮助，但请注意以下解析的复杂性：\n\
  \n| | *# 可能有误的代码* |\n| --- | `say ( 1 + 2 + 3 ) * 4;` |\n\n它会输出值 6，并（可能）作为一个整体求值为\
  \ 4（`say` 的返回值乘以 4）。Perl 的解析器会乐意地将括号解释为后置固定运算符（postcircumfix operators），表示 `say`\
  \ 的参数，而不是用于改变表达式优先级的固定括号（grouping）。\n\n运算符的固定性是其相对于其操作数的位置：\n\n*   中缀运算符（Infix operators）出现在两个操作数之间。大多数数学运算符都是中缀运算符，例如\
  \ `$length * $width` 中的乘法运算符。\n*   前缀运算符（Prefix operators）位于操作数之前。后置运算符（Postfix\
  \ operators）位于操作数之后。这些运算符倾向于是单元的，例如数学取反（`-$x`）、布尔取反（`!$y`）和后置自增（`$z++`）。\n*   固定运算符（Circumfix\
  \ operators）围绕操作数，例如匿名哈希构造（`{ ... }`）和引用运算符（`qq[ ... ]`）。\n*   后置固定运算符（Postcircumfix\
  \ operators）位于某些操作数之后并围绕其他操作数，如哈希和数组元素访问（`$hash{$x}` 和 `$array[$y]`）。\n\n## 运算符类型\n\
  \nPerl 运算符为其操作数提供值上下文（[数值、字符串和布尔上下文]）。要选择合适的运算符，你必须知道所提供的操作数的值，以及你期望接收到的值。\n\n###\
  \ 数值运算符\n\n数值运算符对其操作数施加数值上下文。这些运算符是标准的算术运算符：加法（`+`）、减法（`-`）、乘法（`*`）、除法（`/`）、幂（`**`）和模（`%`），它们的原地变体（`+=`,\
  \ `-=`, `*=`, `/=`, `**=` 和 `%=`），以及前后置自减（`--`）。\n\n自增运算符具有特殊的字符串行为（[特殊运算符]）。\n\n\
  几个比较运算符对其操作数施加数值上下文。这些是数值相等（`==`）、数值不相等（`!=`）、大于（`gt`）、小于（`lt`）、大于等于（`gt=`）、小于等于（`lt=`）以及排序比较运算符（`<=>`）。\n\
  \n### 字符串运算符\n\n字符串运算符对其操作数施加字符串上下文。这些运算符包括正向和反正则表达式绑定（分别为 `=~` 和 `!~`）以及拼接（`.`）。\n\
  \n几个比较运算符对其操作数施加字符串上下文。这些是字符串相等（`eq`）、字符串不相等（`ne`）、大于（`gt`）、小于（`lt`）、大于等于（`ge`）、小于等于（`le`）以及字符串排序比较运算符（`cmp`）。\n\
  \n### 逻辑运算符\n\n逻辑运算符对其操作数施加布尔上下文。这些运算符是 `&&`、`||` 和 `or`。这些中缀都表现出短路行为（[短路计算]）。单词形式的优先级低于标点形式。\n\
  \n定义或运算符 `//` 测试其操作数是否已定义。与测试操作数真值的 `||` 不同，`//` 即使在其操作数求值为数值零或空字符串时也会求值为真。这对于设置默认参数值特别有用：\n\
  \n| | `sub name_pet {` |\n| --- | `my $name = shift // 'Fluffy';` |\n| | ... |\n\
  | | `}` |\n\n三元条件运算符（`?:`）接受三个操作数。它在布尔上下文中求值第一个，如果第一个为真，则求值为第二个，否则求值为第三个：\n\n| |\
  \ `my $truthiness = $value ? 'true' : 'false';` |\n\n前缀 `!` 和 `not` 运算符返回其操作数布尔值的逻辑相反值。`not`\
  \ 是 `!` 的低优先级版本。\n\nxor 运算符是一个中缀运算符，其求值为操作数的异或结果。\n\n### 位运算符\n\n位运算符在位级别上对操作数进行数值化处理。这些不常用的运算符包括左移（`<<`）、右移（`>>`）、位与（`&`）、位或（`|`）和位异或（`^`），以及它们的原地变体（`<<=`,\
  \ `>>=`, `&=`, `|=` 和 `^=`）。\n\n## 特殊运算符\n\n自增运算符具有特殊行为。当用于具有数值组件的值（[强制转换]）时，该运算符会增加该数值组件。如果该值显然是字符串（如果它没有数值组件），该运算符会增加该值的字符串组件，使得\
  \ `a` 变为 `b`，`zz` 变为 `aaa`，而 `a9` 变为 `b0`。\n\n| | `my $num = 1;` |\n| --- | `my\
  \ $str = 'a';` |\n| | |\n| | `$num++` |\n| | `$str++` |\n| | |\n| | `$num++` |\n\
  | | `$str++` |\n| | |\n| | `$num += $str` |\n| | `$str++` |\n| | |\n| | `$num, 2`\
  \ |\n| | |\n| | `$num++` |\n| | `$str++` |\n| | |\n| | `$num += $str` |\n| | `$str++`\
  \ |\n| | |\n| | `$num, 2` |\n| | |\n| | `$num++` |\n| | `$str++` |\n| | |\n| | `$num\
  \ += $str` |\n| | `$str++` |\n| | |\n| | `$num, 2` |\n| | |\n| | `$num++` |\n| |\
  \ `$str++` |\n| | |\n| | `$num += $str` |\n| | `$str++` |\n| | |\n| | `$num, 2`\
  \ |\n| | |\n| | `$num++` |\n| | `$str++` |\n| | |\n| | `$num += $str` |\n| | `$str++`\
  \ |\n| | |\n| | `$num, 2` |\n| | |\n| | `$num++` |\n| | `$str++` |\n| | |\n| | `$num\
  \ += $str` |\n| | `$str++` |\n| | | |\n\n重复运算符（`x`）是一个具有复杂行为的中缀运算符。当在列表上下文中以列表作为第一个操作数求值时，它求值为该列表按照第二个操作数指定的次数重复。当在列表上下文中以标量作为第一个操作数求值时，它会产生一个由第一个操作数按照第二个操作数指定的次数自拼接而成的字符串。在标量上下文中，该运算符重复并拼接字符串：\n\
  \n| | `my @scheherade = ('nights') x 1001;` |\n| --- | `my $calendar = 'nights'\
  \ x 1001;` |\n| | `my $cal_length = length $calendar;` |\n| | |\n| | `is @scheherade,\
  \ 1001;` |\n| | `is $cal_length, 1001 * length 'nights';` |\n\n中缀范围运算符（`..`）在列表上下文中产生项列表：\n\
  \n| | `my @cards = ( 2 .. 10, 'J', 'Q', 'K', 'A' );` |\n\n它只能产生简单的、递增的整数或字符串范围。\n\
  \n在布尔上下文中，范围运算符执行翻转（flip-flop）操作。该运算符在左侧操作数为真之前产生一个假值。该值一直保持为真，直到右侧操作数为真，之后该值再次变为假，直到左侧操作数再次为真。想象用它来解析正式信函的文本：\n\
  \n| | `while (/Hello, $user/ .. /Sincerely/) {` |\n| --- | `say \">\" $_ \">\";`\
  \ |\n| | `}` |\n\n逗号运算符（`,`）是一个中缀运算符。在标量上下文中，它求值左侧操作数，然后返回求值右侧操作数产生的值。在列表上下文中，它从左到右求值两个操作数。\n\
  \n胖逗号运算符（`=>`）还会引用用作左侧操作数的任何裸字（[哈希]）。\n\n\n\n\n\n三点运算符（...）或类似的运算符代表单个语句。它是一个零元操作（nullary），既没有优先级也没有结合律。它可以被正确解析，但在执行时会抛出一个带有字符串\
  \ `Unimplemented` 的异常。这使得它成为示例代码中极好的占位符，而你不希望有人执行这些代码：\n\n```perl\nsub some_example\
  \ {\n    # 请自行实现此\n    ...\n}\n```\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\
  \n# 第 5 章：函数\n\nPerl 中的函数（或子程序）是一个离散、封装的行为单元。程序是许多“黑盒”的集合，这些函数之间的相互作用决定了程序的控制流。函数可以有名称，它可以接收输入信息，也可以产生输出信息。\n\
  \n函数是将代码组织成相似组、通过名称识别单个部分以及提供可重用行为单元的主要机制。\n\n## 声明函数\n\n使用内置的 `sub` 来声明函数：\n\n\
  ```perl\nsub greet_me { ... }\n```\n\n现在，你可以在程序的任何位置调用 `greet_me()`。\n\n正如你可能声明一个局部变量但不定义其值一样，你也可以声明一个函数而不定义它。前向声明（forward\
  \ declaration）告诉 Perl 记录一个具名函数的存在。你可以在之后定义它：\n\n```perl\nsub greet_sun;\n```\n\n\
  ## 调用函数\n\n使用后置括号来调用具名函数。函数的任何参数都可以放在括号内：\n\n```perl\ngreet_me('Jack', 'Tuxie',\
  \ 'Brad');\ngreet_me('Snowy');\ngreet_me();\n```\n\n虽然在这些示例中这些括号并不是严格必须的（即使启用了 `strict`\
  \ 也是如此）——但它们为人类读者以及 Perl 的解析器提供了清晰度。在不确定时，请使用它们。\n\n函数参数可以是任意表达式——包括变量和函数调用：\n\n\
  ```perl\ngreet_me($name);\ngreet_me(@authors);\ngreet_me(%editors);\ngreet_me(get_readers());\n\
  ```\n\n但 Perl 默认的参数处理有时会让新手感到惊讶。\n\n## 函数参数\n\n函数通过单一数组 `@_` 接收其参数。当你调用函数时，Perl\
  \ 将所有提供的参数扁平化为单一列表。函数必须将其参数解包到变量中，或者直接对 `@@_` 进行操作：\n\n```perl\nsub greet_one {\n\
  \    my ($name) = @_;\n    say \"Hello, $name!\";\n}\n\nsub greet_all {\n    say\
  \ \"Hello, $_!\" for @_;\n}\n```\n\n`@@_` 的行为类似于一个普通数组。大多数 Perl 函数使用 `shift` 弹出参数或使用列表赋值，但你也可以通过索引访问单个元素：\n\
  \n```perl\nsub greet_one_shift {\n    my $name = shift;\n    say \"Hello, $name!\"\
  ;\n}\n\nsub greet_two_list_assignment {\n    my ($hero, $sidekick) = @_;\n    say\
  \ \"Well if it isn't $hero and $sidekick. Welcome!\";\n}\n\nsub greet_one_indexed\
  \ {\n    my $name = $_[0];\n    say \"Hello, $name!\";\n    # 或者，不那么清晰\n    say\
  \ \"Hello, $_[0]!\";\n}\n```\n\n你还可以对 `@@_` 使用 `unshift`、`push`、`pop`、`splice` 并使用切片。记住数组内置函数在函数内部使用\
  \ `@@_` 作为默认操作数，这样 `my $name = shift;` 才能工作。利用这种习惯。\n\n要从 `@@_` 获取单个标量参数，请使用 `shift`、`@@_`\
  \ 的索引或左值列表上下文括号。否则，Perl 会很乐意地在标量上下文中为你评估 `@@_` 并分配传递的参数个数：\n\n```perl\nsub bad_greet_one\
  \ {\n    my $name = @_; # 有 bug\n    say \"Hello, $name; you look numeric today!\"\
  ;\n}\n```\n\n多个参数的列表赋值通常比多行 `shift` 更清晰。对比一下：\n\n```perl\nmy $left_value = shift;\n\
  my $operation = shift;\nmy $right_value = shift;\n```\n\n对比：\n\n```perl\nmy ($left_value,\
  \ $operation, $right_value) = @_;\n```\n\n后者更易读。作为副作用，它的性能更好，尽管你可能察觉不到。偶尔你可能会看到某些代码从\
  \ `@@_` 中提取参数并将剩余部分传递另一个函数：\n\n```perl\nsub delegated_method {\n    my $self = shift;\n\
  \    say 'Calling delegated_method()';\n    $self->delegated_method(@_);\n}\n```\n\
  \n当函数只需要单个参数时，使用 `shift`。当访问多个参数时，使用列表赋值。\n\n### 真实签名\n\nPerl 5.20 将内置函数签名作为实验性功能引入。实验性意味着它们在\
  \ Perl 的未来版本中可能会发生变化或消失，因此你需要启用它们：\n\n```perl\nuse experimental 'signatures';\n\
  ```\n\n在有此免责声明的情况下，你现在可以写：\n\n```perl\nsub greet_one($name) {\n    say \"Hello,\
  \ $name!\";\n}\n```\n\n这等同于编写：\n\n```perl\nsub greet_one {\n    die \"Too many arguments\
  \ for subroutine\" if @_ < 1;\n    die \"Too few arguments for subroutine\" if @_\
  \ > 1;\n    my $name = shift;\n    say \"Hello, $name!\";\n}\n```\n\n你可以通过为 `$name`\
  \ 分配默认值来使其成为可选变量：\n\n```perl\nsub greet_one($name = 'Bruce') {\n    say \"Hello,\
  \ $name!\";\n}\n```\n\n在这种情况下，编写 `greet_one('Bruce')` 和 `greet_one()` 都会忽略蝙侠的身份。\n\
  \n你可以在签名的结尾使用聚合参数：\n\n```perl\nsub greet_all($leader, @everyone) {\n    say \"Hello,\
  \ $leader!\";\n    say \"Hi, $_.\" for @everyone;\n}\n\nsub make_nested_hash($name,\
  \ %pairs) {\n    return { $name => %pairs };\n}\n```\n\n或者你可以指示函数不接受参数：\n\n```perl\n\
  sub no_gifts_please() {\n    say 'I have too stuff already.';\n}\n```这意味着如果你带参数调用该函数，将得到\
  \ `Too many arguments for subroutine` 异常。\n\n这些实验性签名的功能比这里讨论的多。然而，一旦超出位置参数，不兼容更改的可能性将会增加。详情请参见\
  \ `perldoc perl` 中的“Signatures”部分，特别是新版本。\n\n签名并不是你唯一的选择。多个 CPAN 分发通过额外的语法和选项扩展了\
  \ Perl 的参数处理。`Method::Signatures` 可以追溯到 Perl 5.8。`Kavorka` 适用于 Perl 5.4 及更高版本。\n\
  \n### 扁平化\n\n列表扁平化到 `@@_` 发生在函数调用侧。将哈希作为参数传递产生产生键值对列表：\n\n```perl\nmy %pet_names_and_types\
  \ = (\n    Lucky => 'dog',\n    Rodney => 'dog',\n    Tuxedo => 'cat',\n    Petunia\
  \ => 'cat',\n    Rosie => 'dog',\n);\n\nshow_pets(%pet_names_and_types);\n\nsub\
  \ show_pets {\n    my %pets = @_;\n    while (my ($name, $type) = each %pets) {\n\
  \        say \"$name is a $type\";\n    }\n}\n```\n\n\n\n\n当 Perl 将 `%pet_names_and_types`\
  \ 平化为列表时，哈希中键值对的顺序会变化，但列表始终包含一个紧随其值的键。`show_pets()` 内部的哈希赋值与显式赋值 `%pet_names_and_types`\
  \ 的方式相同。\n\n这种平化通常很有有用，但要小心在参数列表中混合标量与和平化的聚合类型。要编写一个 `show_pets_of_type()` 函数，其中一个参数是要显示的宠物类型，请将该类型作为第一个参数传递（或者使用\
  \ `pop` 将其从 `@_` 的末尾移除，如果你喜欢困扰别人的话）：\n\n```perl\nsub show_pets_by_type {\n    my\
  \ ($type, %pets) = @_;\n\n    while (my ($name, $species) = each %pets) {\n    \
  \    next unless $species eq $type;\n        say \"$name is a $species\";\n    }\n\
  }\n\nmy %pet_names_and_types = (\n    Lucky => 'dog',\n    Rodney => 'dog',\n  \
  \  Tuxedo => 'cat',\n    Petunia => 'cat',\n    Rosie => 'dog',\n);\n\nshow_pets_by_type('dog',\
  \ %pet_names_and_types);\nshow_pets_by_type('cat', %pet_names_and_types);\nshow_pets_by_type('moose',\
  \ %pet_names_and_types);\n```\n\n使用实验性的函数签名，你可以这样写：\n\n```perl\nsub show_pets_by_type($type,\
  \ %pets) {\n    ...\n}\n```\n\n#### 你应该使用签名吗？\n\n尽管函数签名具有实验性——或者 CPAN 模块有额外的依赖——所有这些选项都可以让你的代码在阅读和编写上都更短、更清晰。务必尝试这些选项，以找到最适合你和你团队的方法。即使坚持使用简单的位置参数也能改进你的工作。\n\
  \n### 吞取（Slurping）\n\n带有聚合类型的列表赋值总是贪婪的，因此赋值给 `%pets` 会吞取 `@_` 中所有的剩余值。如果 `$type`\
  \ 参数位于 `@_` 的末尾，Perl 会对向哈希分配奇数个元素发出警告。你可以绕过这一点，但会以清晰度为代价：\n\n```perl\nsub show_pets_by_type\
  \ {\n    my $type = pop;\n    my %pets = @_;\n    ...\n}\n```\n\n将数组作为参数赋值也遵循相同的原理。使用引用来避免意外的聚合平化。\n\
  \n### 别名（Aliasing）\n\n`@_` 包含一个微妙之处；它是函数参数的别名。句话说，如果你直接访问 `@_`，你可以修改传递给函数的参数：\n\n\
  ```perl\nsub modify_name {\n    $_[0] = reverse $_[0];\n}\n\nmy $name = 'Orange';\n\
  modify_name($name);\nsay $name;\n\n# 输出 egnarO\n```\n\n直接修改 `@_` 中的元素将修改原始参数。小心并严谨地解包\
  \ `@_`——或者仔细地记录修改。\n\n## 函数与命名空间\n\n每个函数都有一个所属的命名空间。未声明命名空间中的函数（未在显式 `package` 语句范围内定义的函数）存在于主命名空间中。你也可以通过为名称加上前缀在另一个命名空间内声明函数：\n\
  \n```perl\nsub Extensions::Math::add { ... }\n```\n\n这将根据需要创建命名空间并在其中声明函数。记住，Perl\
  \ 包在任何时候都是开放修改的——即使在你的程序运行时。如果你在单个命名空间中声明了多个同名函数，Perl 将发出警告。\n\n使用短名称引用同一命名空间内的其他函数。使用完全限定名来调用另一个命名空间中的函数：\n\
  \n```perl\npackage main;\n\nExtensions::Math::add($scalar, $vector);\n```\n\n记住，Perl\
  \ 包在任何时候都是开放修改的——即使在你的程序运行时。如果你在单个命名空间中声明了多个同名函数，Perl 将发出警告。\n\n#### 词域函数（Lexical\
  \ Functions）\n\nPerl 5.18 添加了一个声明词域函数的特性。它们在词域作用范围内可见。\n\n#### 导入（Importing）\n\n\
  内置的 `use` 在这些语句周围添加了一个隐式的 `BEGIN` 块，使得 `import()` 在解析器编译程序其余部分之后发生。`use` 是一个指令（pragma），因此它有其他影响。`use`\
  \ 提供了一个名为 `import()` 的特殊方法，可以带参数调用。\n\n```perl\nuse strict;\n\nuse; # 这是一个示例\n```\n\
  \n内置的 `use` 在这些语句周围添加了一个隐式的 `BEGIN` 块，使得 `import()` 在解析器编译程序其余部分之后发生。`use` 是一个指令（pragma），因此它有其他影响。`use`\
  \ 用于加载模块。\n\n## 报告错误\n\n使用内置的 `caller` 来检查函数的调用上下文。不传递任何参数时，`caller` 返回一个列表，包含调用包的名称、包含调用的文件名以及调用发生的文件行号：\n\
  \n```perl\npackage main;\n\nmain();\n\nsub show_call_information {\n    my ($package,\
  \ $file, $line) = caller();\n    say \"Called from $package in $file at $line\"\
  ;\n}\n```\n\n完整的调用链可供检查。向 `caller()` 传递一个单整数参数 `n` 以检查回溯 `n` 次的调用者的调用者。在 `show_call_information()`\
  \ 中，`caller(0)` 返回关于 `main()` 的信息。`caller(1)` 返回关于程序启动的信息。\n\n这个可选参数还告诉 `caller`\
  \ 提供额外的返回值，包括函数名和调用的上下文：\n\n```perl\nsub show_call_information {\n    my ($package,\
  \ $file, $line, $func) = caller(0);\n    say \"Called $func from $package in $file\
  \ at $line\";\n}\n```\n\n标准的 `Carp` 模块使用 `caller` 来增强错误和警告信息。在库代码中替代 `die` 时，`croak()`\
  \ 从其调用者的角度抛出异常。`carp()` 从其调用者的文件和行号报告警告。\n\n### 参数验证\n\n在验证函数的参数或先决条件时使用 `caller`（或\
  \ `Carp`），以指示调用该函数操作是错误的。\n\n\n\n\n虽然 Perl 会尽力按照你的意图执行，但它提供的原生方法很少测试传递给函数的参数的有效性。可以在标量语文中（scalar\
  \ context）下评估 `@_`，以检查传递给函数的参数数量是否正确：\n\n```perl\nsub add_numbers {\n    croak 'Expected\
  \ two numbers, received: ' . @_;\n    unless @__ == 2;\n    # ...\n}\n```\n\n得益于使用了\
  \ `croak`，这种验证从调用者的角度报告了任何参数数量错误。\n\n类型检查要困难得多，因为 Perl 存在面向操作符的类型转换。如果你想为函数参数提供额外的安全性，请参考\
  \ CPAN 模块，如 `Params::Validate`。\n\n## 高级函数\n\n函数是许多高级 Perl 特性的基础。\n\n### 上下文感知（Context\
  \ Awareness）\n\nPerl 的内置函数知道你是在空（void）、标量（scalar）或列表（list）上下文中调用它们的。你的函数也可以做到这一点。内置函数\
  \ `wantarray` 返回 `undef` 表示空上下文，返回一个假值表示标量上下文，返回一个真值表示列表上下文。是的，它的名字起错了；请参 `perldoc\
  \ -f wantarray` 获取证明。\n\n```perl\nsub context_sensitive {\n    my $context = wantarray();\n\
  \    return qw(List context) if $context;\n    say 'Void context' unless defined\
  \ $context;\n    return 'Scalar context' unless $context;\n}\n\ncontext_sensitive();\n\
  say my $scalar = context_sensitive();\nsay context_sensitive();\n```\n\n这对于可能产生昂贵返回值的函数非常有用，可以避免在空上下文中执行这些操作。一些惯用函数在列表上下返回列表，在标量上下返回列表的第一个元素或数组引用。然而，对于\
  \ `wantarray` 的使用并没有单一的最佳建议。有时，编写独立且无歧的函数会更清晰，例如 `get_all_to_ppings()` 和 `get_next_topping()`。\n\
  \nCPAN 上 Robin Houston 的 `Want` 和 Damian Conway 的 `Contextual::Return` 分发版为编写强大的上下文感知接口提供了许多可能性。\n\
  \n### 递归（Recursion）\n\n假设你想在一个排序数组中找到一个元素。你可以逐个遍历数组中的每个元素来寻找目标，但平均而言，你必须检查数组的一半元素。另一种方法是取数组减半，选取中间点的元素进行比较，然后在下半部分或上半部分重复此操作。分而治之。当没有元素可以检查或找到该元素时，停止。\n\
  \n该技术的自动化测试可以所示：\n\n```perl\nuse Test::More;\n\nmy @elements = ( 1, 5, 6, 19, 48,\
  \ 77, 997, 1025, 7777, 8192, 9999 );\n\nok elem_exists( 1, @elements ), 'found first\
  \ element in array';\nok elem_exists( 9999, @elements ), 'found last element in\
  \ array';\nok ! elem_exists( 998, @elements ), 'did not find element not in array';\n\
  ok ! elem_exists( -1, @elements ), 'did not find element not in array';\nok ! elem_exists(\
  \ 10000, @elements ), 'did not find element not in array';\nok elem_exists( 77,\
  \ @elements ), 'found midpoint element';\nok elem_exists( 48, @elements ), 'found\
  \ end of lower half element';\nok elem_exists( 997, @elements ), 'found start of\
  \ upper half element';\n\ndone_testing();\n```\n\n递归是一个看似简单的概念。在 Perl 中，每次调用函数都会创建一个调用栈帧（call\
  \ frame），这是 Perl 内部的一种数据结构，表示你调用了该函数。该调用栈帧包含了函数当前调用的词法环境——即调用函数时内部所有词法变量的值。因为词法变量值的存储与函数本身是分离的，你可以同时激活多个函数调用。函数甚至可以调用自己，即递归。\n\
  \n为了让前面的测试通过，请编写递归函数 `elem_exists()`：\n\n```perl\nsub elem_exists {\n    my ($item,\
  \ @array) = @_;\n    unless @array;\n    my $midpoint = int(@array) / 2;\n    return\
  \ 1 if $item == $array[$midpoint];\n    return elem_exists($item, @array[0..$midpoint])\
  \ if $item < $array[$midpoint];\n    return elem_exists($item, @array[$midpoint\
  \ + 1..$1]);\n}\n```\n\n\n\n\nPerl 不会自动消除尾调用，但你可以通过使用 `goto` 内置函数的特殊形式来实现相同的效果。与通常产生“面条式代码”的形式不同，`goto`\
  \ 函数形式会将当前的函数调用替换为对另一个函数的调用。你可以通过名称或引用来使用函数。通过操作 `@_` 来修改传递给替换调的参数：\n\n```perl\n\
  if ($item < $miditem) {\n    # 拆分数组并递归\n    @_ = ($item, @array[0 .. $midpoint]);\n\
  \    goto &elem_exists;\n} else {\n    # 拆分数组并递归\n    @_ = ($item, @array[$midpoint\
  \ + 1 .. $array]);\n    goto &elem_exists;\n}\n```\n\n有时候优化是丑陋的，但如果替代方案是耗尽内存的高度递归代码，不如拥抱丑陋并为实用感到庆幸。\n\
  \n## 陷阱与缺陷 (Pitfalls and Misfeatures)\n\nPerl 仍然支持从旧版本 Perl 继承的旧式函数调用。旧版本的 Perl\
  \ 要求在调用函数时带有前导符号 `&` 字符：\n\n```perl\n# 过时的样式；应避免\nmy $result = &calculate_result(\
  \ 52 );\n\n# 非常过时；真正避免\nmy $result = do &calculate_result( 42 );\n```\n\n虽然这种遗留语法是视觉上的干扰，但前导\
  \ `&` 形式还有其他意外的行为。首先，它禁用了任何原型检查。其次，它会隐式地原封不动地传递 `@_` 的内容，除非你显式地传递了参数。这种不幸的行为可能会导致令人困惑的“远距离作用”。\n\
  \n最后一个陷阱源于在函数调用时省略括号。Perl 解析器使用几种启发式方法来解析歧义的裸字（barewords）以及传递给函数的参数数量。启发式可能是错误的：\n\
  \n```perl\n# 警告；包含一个微妙的 bug\nok elem_exists 1, @elements, 'found first element';\n\
  ```\n\n对 `elem_exists()` 的调用会吞掉原本作为 `ok()` 第二个参数的测试描述。由于 `elem_exists()` 使用了贪婪（slurpy）第二个参数，在\
  \ Perl 产生关于将非数字（测试描述，它无法将其转换为数字）与数组中的元素进行比较的警告之前，这可能不会被察觉。\n\n虽然多余的括号会影响读性，但合理使用括号可以让读者和\
  \ Perl 本身理解代码。\n\n## 作用域 (Scope)\n\nPerl 中所有命实体（变量、函数、文件句柄、类）都有作用域。该作用域决定了这些实体的生命周期和可见性。作用域有助于强制封装——将相关概念放在一起并防止细节泄露。\n\
  \n### 词法作用域 (Lexical Scope)\n\n词法作用域是程序读者可见的作用域。任何由大括号界定的块都会创建一个新的作用域：裸块、循环结构块、子程序声明块、eval\
  \ 块、package 块或任何非引用块。Perl 编译器在编译期间解析此作用域。\n\n词法作用域描述了用 `my` 声明的变量——词法变量的可见性。在一个作用域中声明的词法变量在该作用域以及任何嵌套在其中的作用域内可见，但对于同级或外部作用域是不可见的：\n\
  \n```perl\n# 外部词法作用域\n{\n    package Robot::Butler;\n\n    # 内部词法作用域\n    my $battery_level;\n\
  \n    sub tidy_room {\n        # 进一步的内部词法作用域\n        my $timer;\n\n        do {\n\
  \            # 最内层词法作用域\n            my $dustpan;\n            ...\n        } while\
  \ (@_);\n\n        # 同级内部作用域\n        for (@_) {\n            # 独立的最内层作用域\n    \
  \        my $polish_cloth;\n            ...\n        }\n    }\n}\n```\n\n`$battery_level`\
  \ 在所有四个作用域中可见。`$timer` 在方法、`do` 块和 `for` 循环中可见。`$dustpan` 只在 `do` 块中可见，$polish_cloth`\
  \ 在 `for` 循环内可见。\n\n在内部作用域中声明与外部作用域词法变量同名的词法变量会隐藏或遮蔽内部作用域内的外部词法变量，例如：\n\n```perl\n\
  my $name = 'Jacob';\n\n{\n    my $name = 'Edward';\n    print $name;\n}\nprint $name;\n\
  ```\n\n（注：此处原文中存在大量重复内容，翻译已根据核心逻辑进行整合）。\n\n### 我们的作用域 (Our Scope)\n\nPerl 中所有命名的实体（变量、函数、文件句柄、类）都有作用域。该作用域决定了这些实体的生命周期和可见性。作用域有助于强制封装——将相关概念放在一起并防止细节泄露。\n\
  \n### 动态作用域 (Dynamic Scope)\n\n动态作用域在规则上类似于词法作用域，但它不是在编译时向外查找，而是回溯通过到达当前代码的所有函数调用。动态作用域仅作用于全局变量。\n\
  \n```perl\nour $scope;\n\nsub inner {\n    print $scope;\n}\n\nsub middle {\n  \
  \  print $scope;\n    local $scope = 'main() scope';\n    inner();\n}\n\nsub main\
  \ {\n    print $scope;\n    middle();\n}\n\n$scope = 'outer scope';\nmain();\nprint\
  \ $scope;\n```\n\n\n\nPerl 对包变量（package variables）和作用域变量（lexical variables）使用了不同的存储机制。每个包含作用域变量的作用域都使用一种称为作用域填充（lexical\
  \ pad 或 lexpad）的数据结构来存储其内部作用域变量的值。每当控制流进入这些作用域时，Perl 都会创建一个另一个 lexpad 来包含该特定调用的作用域变量值。这使得函数能够正常工作，特别是递归函数（递归）。\n\
  \n每个包都有一个单一符号表，用于存储包变量以及命名函数。导入（导入）是通过检查和操作此符号表来实现的。`local` 也是如此。这就是为什么你可能只能局部化全局变量和包全局变量——永远不能局部化作用域变量。\n\
  \n`local` 通常用于魔法变量（magic variables）。例如，`$/` 是输入记录分隔符，它决定了 `readline` 操作从文件句柄中读取多少数据。`$!`\
  \ 是系统错误变量，包含最近一次系统调用的错误详情。`$@` 是 Perl 的 `eval` 错误变量，包含最近一次 `eval` 操作中的任何错误。`$|`\
  \ 是自动刷新变量，它控制 Perl 是否会在每次写入操作后刷新当前选的文件句柄。\n\n`在尽可能窄的作用域内局部化这些变量可以限制你所做更改的影响。这可以防止代码其他部分出现奇怪的行为。`\n\
  \n### 状态作用域 (State Scope)\n\nPerl 的 `state` 关键字允许你声明一个具有一次性初始化和值持久化特性的作用域变量：\n\n\
  ```perl\nsub counter {\n    state $count = 1;\n    return $count++;\n}\n\nsay counter();\n\
  say counter();\nsay counter();\n```\n\n在第一次调用 `counter` 时，Perl 初始化 `$count`。在随后的调用中，`$count`\
  \ 保留其先前的值。该程序打印 1、2 和 3。将 `state` 改为 `my`，程序将打印 1、1 和 1。\n\n你可以使用表达式来设置状态变量的初始值：\n\
  \n```perl\nsub counter {\n    state $count = shift;\n    return $count++;\n}\n\n\
  say counter(2);\nsay counter(4);\nsay counter(6);\n```\n\n尽管简单阅读代码可能认为输出应该是 2、4\
  \ 和 6，但实际输出是 2、3 和 4。对 `sub counter` 的第一次调用设置了 `$count` 变量。随后的调用不会改变它的值。\n\n`state`\
  \ 对于建立默认值或准备缓存非常有用，但在你使用它时，请务必理解它的初始化行为：\n\n```perl\nsub counter {\n    state $count\
  \ = shift;\n    say 'Second arg is: ', shift;\n    return $count++;\n}\n\nsay counter(2,\
  \ 'two');\nsay counter(4, 'four');\nsay counter(6, 'six');\n```\n\n该程序的计数器按预期打印\
  \ 2、3 和 4，但传递给 `counter()` 调用的预期第二个参数的值是 two、4 和 six——因为对第一个参数的 `shift` 操作只在 `counter()`\
  \ 的第一次调用中发生。你可以更改 API 以防止此错误，或者使用以下代码进行防范：\n\n```perl\nsub counter {\n    my ($initial_value,\
  \ $text) = @_;\n    state $count = $initial_value;\n    say \"Second arg is: $text\"\
  ;\n    return $count++;\n}\n\nsay counter(2, 'two');\nsay counter(4, 'four');\n\
  say counter(6, 'six');\n```\n\n### 匿名函数 (Anonymous Functions)\n\n匿名函数是没有名字的函数。它的行为与命名函数完全相同——你可以调用它、向它传递参数、从它返回结果，并对其进行引用。然而，你只能通过引用（函数引用）访问匿名函数，而不能通过名称。\n\
  \n一种被称为分发表（dispatch table）的 Perl 惯用方法（idiom）使用哈希（（hashes）将输入与行为关联起来：\n\n```perl\n\
  my %dispatch = (\n    plus => \\&add_two_numbers,\n    minus => \\&subtract_two_numbers,\n\
  \    times => \\&multiply_two_numbers,\n);\n\nsub add_two_numbers { $_[0] + $_[1]\
  \ }\nsub subtract_two_numbers { $_[0] - $_[1] }\nsub multiply_two_numbers { $_[0]\
  \ * $_[1] }\n\nsub dispatch {\n    my ($left, $op, $right) = @_;\n    return unless\
  \ $dispatch{$op};\n    return $dispatch{$op}->($left, $right);\n}\n```\n\n`dispatch()`\
  \ 函数接收形式如 `('times', 2)` 的参数，计算该操作并返回结果。一个简单的计算器可以使用 `dispatch` 根据输入来确定执行哪种计算。\n\
  \n### 声明匿名函数\n\n不带名称地使用内置函数 `sub` 会创建并返回一个匿名函数。在需要使用命名函数引用的地方使用此函数，例如在声明分发表中的函数时：\n\
  \n```perl\nmy %dispatch = (\n    plus => sub { $_[0] + $_[1] },\n    minus => sub\
  \ { $_[0] - $_[1] },\n    times => sub { $_[0] * $_[1] },\n    dividedby => sub\
  \ { $_[0] / $_[1] },\n    raised => sub { $_[0] $_[1] },\n);\n```\n\n#### 防御性分发\
  \ (Defensive Dispatch)\n\n![aside-icons/warning.png](img/warning.png) 只有此分发表中的函数可以供用户调用。如果你的\
  \ `dispatch` 函数使用用户提供的字符串作为函数的字面名称，恶意用户可以通过传递 `Internal::Functions::malicious_function`\
  \ 来调用任何函数。\n\n你也可以看到匿名函数作为函数参数传递：\n\n```perl\nsub invoke_anon_function {\n    my\
  \ $func = shift;\n    return $func(@_);\n}\n\nsub named_func {\n    say 'I am a\
  \ named function!';\n}\n\ninvoke_anon_function(&named_func);\ninvoke_anon_function(sub\
  \ { say 'Who am I?' });\n```\n\n### 匿名函数名称 (Anonymous Function Names)\n\n使用内省（introspection）来确定函数是命名的还是匿名的，可以通过\
  \ `caller()` 或 CPAN 模块 `Sub::Identify` 的 `sub_name()` 函数：\n\n```perl\npackage ShowCaller;\n\
  \nsub show_caller {\n    my ($package, $file, $line, $sub) = caller(1);\n    say\
  \ \"Called from $sub in $package:$file:$line\";\n}\n\nsub main {\n    my $anon_sub\
  \ = sub { show_caller() };\n    show_caller();\n    $anon_sub->();\n}\n\nmain();\n\
  ```\n\n结果可能会令意外：\n\n```\nCalled from ShowCaller::main\nin ShowCaller:anoncaller.pl:20\n\
  Called from ShowCaller::__ANON__\nin ShowCaller:anoncaller.pl:17\n```\n\n输出中第二行的\
  \ `__ANON__` 表明匿名函数没有 Perl 可以识别的名称。CPAN 模块 `Sub::Name` 的 `subname()` 函数允许你为匿名函数附加名称：\n\
  \n```perl\nuse Sub::Name;\nuse Sub::Identify 'sub_name';\n\nmy $anon = sub {};\n\
  say sub_name($anon);\n\nmy $named = subname('pseudo-anonymous', $anon);\nsay sub_name($named);\n\
  say sub_name($anon);\n\nsay sub_name(sub {});\n```\n\n该程序产生以下输出：\n\n```\n__ANON__\n\
  pseudo-anonymous\npseudo-anonymous\n__ANON__\n```\n\n\n\n\n\n请注意，这两个引用指向同一个底层匿名函数。在其中一个引用上使用\
  \ `subname()` 将改变该底层函数；对该函数的所有其他引用将看到新的名称。\n\n### 隐式匿名函数\n\nPerl 允许你在不使用 `sub` 关键字的情况下将匿名函数声明为函数参数。虽然此功能在名义上是为了允许程序员编写自己的语法（如\
  \ `map` 和 `eval` 的语法），但你也可以将其用于其他用途，例如编写看起来不像函数的延迟函数。\n\n考虑 CPAN 模块 `Test::Fatal`，它接受一个匿名函数作为其\
  \ `exception()` 的第一个参数：\n\n```perl\nuse Test::More;\nuse Test::Fatal;\n\nmy $croaker\
  \ = exception { die 'I croak!' };\nmy $liver = exception { 1 + 1 };\n\nlike $croaker,\
  \ qr/I croak/, 'die() should croak';\nis $liver, undef, 'addition should live';\n\
  \ndone_testing();\n```\n\n你可以用更冗长的写法重写这段代码：\n\n```perl\nmy $croaker = exception(sub\
  \ { die 'I croak!' });\nmy $liver = exception(sub { 1 + 1 });\n```\n\n或者通过引用传递命名函数：\n\
  \n```perl\nsub croaker { die 'I croak!' }\nsub liver { 1 + 1 }\n\nmy $croaker =\
  \ exception &croaker;\nmy $liver = exception &liver;\n\nlike $croaker, qr/I croak/,\
  \ 'die() should die';\nis $liver, undef, 'addition should live';\n```\n\n但你不能将它们作为标量引用传递：\n\
  \n```perl\nmy $croak_ref = &croaker;\nmy $live_ref = &liver;\n\n# BUG：不起工作\nmy $croaker\
  \ = exception $croak_ref;\nmy $liver = exception $live_ref;\n```\n\n这是因为原型改变了 Perl\
  \ 解析器解释这段代码的方式。它无法 100% 明确确定 `$croaker` 和 `$liver` 将包含什么，因此会抛出异常。\n\n```\nType of\
  \ arg 1 to Test::Fatal::exception\nmust be block or sub {} (not private variable)\n\
  ```\n\n接受匿名函数作为多个参数之首的函数，在函数块后面不能有尾随逗号：\n\n```perl\nuse Test::More;\nuse Test::Fatal\
  \ 'dies_ok';\n\ndies_ok { die 'This is my boomstick!' } 'No movie references here';\n\
  ```\n\n这是在原本有用的语法中偶尔令人困惑的小缺陷，归功于 Perl 解析器的一个特性。通过将裸块提升为匿名函数所提供的语法清晰度是有帮助的，但请谨慎使用并仔细记录\
  \ API。\n\n## 闭包 (Closures)\n\n计算机科学术语“高阶函数”指的是操作其他函数。每当控制流进入一个函数时，该函数都会获得一个代表该调用词法作用域的新环境。这同样适用于匿名函数。这种意义是强大的，而闭包展示了这种力量。\n\
  \n### 创建闭包\n\n闭包是一个使用来自外部作用域词法变量的函数。你可能已经在不知意的情况下创建并使用了闭包：\n\n```perl\nuse Modern::Perl\
  \ '2015';\n\nmy $filename = shift @ARGV;\n\nsub get_filename { return $filename\
  \ }\n```\n\n如果这段代码对你来说很直观，那太好了！当然，`get_filename()` 函数可以看到词法变量 `$filename`。这就是作用域的工作方式！\n\
  \n假设你想遍历一个项目列表，而不需要自己管理迭代器。你可以创建一个返回函数的函数，该函数在被调用时将返回迭代中的下一个项目：\n\n```perl\nsub\
  \ make_iterator {\n    my @items = @_;\n    my $count = 0;\n\n    return sub {\n\
  \        return if $count == @items;\n        return $items[$count++];\n    }\n\
  }\n\nmy $cousins = make_iterator(qw(Alex Kaycee Eric Mandy Alex));\n\nsay $cousins()\
  \ for 1 .. 6;\n```\n\n尽管 `make_iterator()` 已执行，`$cousins` 中的匿名函数已经捕获了这些变量在 `make_iterator()`\
  \ 调用期间的值。由于调用 `make_iterator()` 会创建一个独立的词法环境，它所创建并返回的匿名子程序为每个调用捕获了一个独立的词法环境：\n\n\
  ```perl\nmy $aunts = make_iterator(qw(Carole Wendy Sylvia Lupe));\n\nsay $cousins();\n\
  say $aunts->();\n```\n\n由于 `make_iterator()` 不按值或按引用返回这些词法变量，只有闭包可以访问它们。它们的封装程度实际上与任何词法变量一样有效，尽管任何共享词法环境的代码都可以访问这些值。这种惯用法为本应是文件或包变量的变量提供了更好的封装：\n\
  \n```perl\n{\n    my $private_variable;\n\n    sub set_private { $private_variable\
  \ = shift }\n    sub get_private { $private_variable }\n}\n```\n\n命名函数具有包全局作用域；因此你不能嵌套命名函数。嵌套函数之间共享的词法变量会在外部函数销毁其词法环境时不再共享。Perl\
  \ 在发生这种情况时向你警告。\n\n### 闭包的用途\n\n使用闭包遍历固定大小的列表很有趣，但闭包可以做更多，例如遍历一个计算开销太大或大到无法一次性在内存中的列表。考虑一个根据需要创建斐波那契数列的函数。不要递归地重新计算数列，而是使用缓存并惰性地创建你需要的元素：\n\
  \n```perl\nsub gen_fib {\n    my @fibs = (0, 1);\n\n    return sub {\n        my\
  \ $item = shift;\n\n        if ($item >= @fibs) {\n            for my $calc (@fibs\
  \ .. $item) {\n                $fibs[$calc] = $fibs[$calc - 2] + $fibs[$calc - 1];\n\
  \            }\n        }\n        return $fibs[$item];\n    }\n}\n\n# 计算第 42 个斐波那契数\n\
  my $fib = gen_fib();\nsay $fib->(42);\n```\n\n`gen_fib()` 返回的函数的每次调用接受一个参数，斐波那契数列的第\
  \ n 个元素。该函数根据需要生成并缓存数列之前的值，并返回请求的元素。\n\n这就是闭包和一阶函数变得有趣的地方。这段代码做了两件事；特定的缓存缓存模式交织在一起。如果你将特定的缓存代码（初始化缓存、执行自定义代码填充缓存元素并返回计算或缓存的值）提取到函数\
  \ `gen_caching_closure()` 中会发生什么？\n\n```perl\nsub gen_caching_closure {\n    my\
  \ ($calc_element, @cache) = @_;\n\n    return sub {\n        my $item = shift;\n\
  \n        $calc_element->($item, @cache) unless $item < @cache;\n    }\n}\n```\n\
  \n\n\n\n```perl\n        return $cache[$item];\n    }\n}\n\nsub gen_fib {\n    my\
  \ @fibs = (0, 1, 1);\n    return gen_caching_closure(sub {\n        my ($item, $fibs)\
  \ = @_;\n        for my $calc ((@$fibs - 1) .. $item) {\n            $fibs->[$calc]\
  \ = $fibs->[$calc - 2] + $fibs->[$calc - 1];\n        }\n    }, @fibs);\n}\n```\n\
  \n程序的运行行为与之前相同，但现在通过函数引用和闭包将缓存初始化行为与斐波那契数列下一个数字的计算分离来。通过传递函数来自定义代码的行为（在此例中为 `gen_caching_closure()`）可以提供极大的灵活性并简化你的代码。\n\
  \n## 折叠、应用与过滤\n\n![images/aside-icons/note.png](img/note.png) 内置的 `map`、`grep` 和\
  \ `sort` 本身高阶函数。\n\n### 闭包与部分应用\n\n闭包也可以消除多余的通用性。考虑一个接受多个参数的函数：\n\n```perl\nsub\
  \ make_sundae {\n    my %args = @_;\n    my $ice_cream = get_ice_cream($args{ice_cream});\n\
  \    my $banana = get_banana($args{banana});\n    my $syrup = get_syrup($args{syrup});\n\
  \    ...\n}\n```\n\n在大型冰淇淋店里，无数种定制可能性可能非常有效，但对于一个只在香蕉上提供法式香草冰淇淋的冰淇淋车来说，每次调用 `make_sundae()`\
  \ 传递的参数永远不会改变。\n\n部分应用允许你现在将某些参数绑定到函数上，以便以后提供其他参数。将要调用的函数封装在闭包中并传递绑定的参数。以下是你的冰淇淋车如何做的：\n\
  \n```perl\nmy $make_cart_sundae = sub {\n    return make_sundae(\n        @_,\n\
  \        ice_cream => 'French Vanilla',\n        banana => 'Cavendish',\n    );\n\
  };\n```\n\n现在，每当你处理订单时，调用 `$make_cart_sundae` 中的函数引用并只传递感兴趣的参数。你永远不会忘记不变变量，也不会错误地传递它们。你甚至可以使用来自\
  \ CPAN 的 `Sub::Install` 将 `$make_cart_sundae` 函数导入另一个命名空间。\n\n这仅仅是你使用高阶函数所能做到的开始。Mark\
  \ Jason Dominus 的《Higher Order Perl》是 Perl 中一级函数和闭包的权威参考。你可以在 `http://hop.perl.plover.com/`\
  \ 在线阅读。\n\n## 状态闭包\n\n闭包使用词法作用域来控制对词法变量的访问——即使对于命名函数也是如此：\n\n```perl\n{\n    my\
  \ $safety = 0;\n    sub enable_safety { $safety = 1 }\n    sub disable_safety {\
  \ $safety = 0 }\n    sub do_something_awesome {\n        return if $safety;\n  \
  \      ...\n    }\n}\n```\n\n三个函数封装了该共享状态，而没有将词法变量暴露在共享作用域之外。这种写法在多个函数访问该词法变量的情况下非常好用，但当只有一个函数访问时就显得很笨拙。假设每百个冰淇淋店的顾客获得免费的糖针：\n\
  \n```perl\nmy $cust_count = 0;\nsub serve_customer {\n    $cust_count++;\n    my\
  \ $order = shift;\n    add_sprinkles($order) if $cust_count % 100 ==0;\n```\n\n\
  `state` 内置关键字允许你声明一个在调用之间持久的变量：\n\n```perl\nstate $cust_count = 0;\nsub serve_customer\
  \ {\n    $cust_count++;\n    my $order = shift;\n    add_sprinkles($order) if $cust_count\
  \ % 100 == 0;\n    ...\n}\n```\n\n这种方法虽然可行，但为单个函数创建一个新的词法变量显得有些繁琐。\n\n```perl\n\
  {\n    my $count = 0;\n    sub some_state {\n        state $count = 0;\n       \
  \ $count++;\n    }\n}\n```\n\n### 属性\n\nPerl 中的命名实体——变量和函数——可以以属性的形式附加额外的元数据。这些属性是用于元编程的任意名称和值。属性声明语法很笨拙，有效地使用属性更多是艺术而非科学。大多数程序从不使用它们，但当使用良好时，它们能提供清晰度。一个简单的属性是以冒号开头的标识符，附加在声明语句上：\n\
  \n```perl\nmy $fortress :hidden;\nsub erupt_volcano :ScienceProject { ... }\n```\n\
  \n当 Perl 解析这些声明时，它会调用名为 `hidden` 和 `ScienceProject` 的属性处理器，前提是这些处理器在相应的类型（分别为标量和函数）中存在。这些处理器可以执行任何操作。如果相应的处理器不存在，Perl\
  \ 将抛出编译时异常。\n\n属性可以包含参数列表。Perl 将这些参数视为常量字符串列表。来自 CPAN 的 `Test::Class` 模块很好地利用了这种参数化：\n\
  \n```perl\nsub setup_tests :Test(setup) { ... }\nsub test_monkey_creation :Test(10)\
  \ { ... }\nsub shutdown_tests :Test(teardown) { ... }\n```\n\n`Test` 属性识别包含断言的方法，并可选地识别该方法打算运行的断言数量。虽然通过对这些类进行内省可以在良好的启发式算法下发现适当的测试方法，但\
  \ `:Test` 属性是不歧义的。Test::Class 提供了属性处理器来跟踪这些方法。当类解析完成后，Test::Class 可以遍历测试方法列表并运行它们。\n\
  \n\n\n\n属性（Attributes）都有其缺点。用于处理属性的标准 pragma（即 attributes pragma）多年来一直将其接口列为实验性，这是有缘之的。Damian\
  \ Conway 的核心模块 `Attribute::Handlers` 使用起来要易用得多，而 Andrew Main 的 `Attribute::Lexical`\
  \ 则是一种较新的方法。尽可能优先使用其中一种而不是属性。\n\n属性最糟糕的特性是，它们很容易以一种不可预测的方式扭曲 Perl 的语法。你可能无法预测带有属性的代码会发生什么。良好的文档会有帮助，但如果一个看起来无害的局部变量声明在某处存储了该变量的引用，那么你对其生命期的预期可能是错误的。同样，处理程序（handler）可以将一个函数封装在另一个函数中，并在你不知情的情况下替换符号表中的它——考虑\
  \ `:memoize` 属性，它会自动调用核心 `Memoize` 模块。\n\n属性可以帮助你解决困难的问题，或者让一个 API 变得更容易使用。当使用得当时，它们是强大的——但大多数程序永远不需要它们。\n\
  \n### AUTOLOAD\n\nPerl 并不要求你在调用每个函数之前对其进行声明。即使函数不存在，Perl 也会愉快地尝试调用它。考虑这个程序：\n\n\
  ```\nuse Modern::Perl;\nbake_pie( filling => 'apple' );\n```\n\n当你运行它，Perl 会因为调用未定义的函数\
  \ `bake_pie()` 而抛出异常。\n\n现在添加一个名为 `AUTOLOAD()` 的函数：\n\n```perl\nsub AUTOLOAD {}\n\
  ```\n\n现在运行程序，不会发生明显的事情。每当正常分发失败时，Perl 会调用包中名为 `AUTOLOAD()` 的函数——如果它存在的话。修改 `AUTOLOAD()`\
  \ 输出一条消息，以证明它被调用了：\n\n```perl\nsub AUTOLOAD { say 'In AUTOLOAD()!' }\n```\n\n`AUTOLOAD()`\
  \ 函数通过 `@@` 接收传递给未定义的参数，并通过包全局变量 `$AUTOLOAD` 接收未定义函数的完全限定名（在这里是 `main::bake_pie`）：\n\
  \n```perl\nsub AUTOLOAD {\n    our $AUTOLOAD;\n    # 美化打印参数\n    local $* = ', ';\n\
  \    say \"In AUTOLOAD(@_) for $AUTOLOAD!\";\n}\n```\n\n使用正则表达式提取方法名：\n\n```perl\n\
  sub AUTOLOAD {\n    my ($name) = our $AUTOLOAD =~ /::(\\w+)$/;\n    # 美化打印参数\n \
  \   local $* = ', ';\n    say \"In AUTOLOAD(@_) for $name!\";\n}\n```\n\n无论 `AUTOLOAD()`\
  \ 返回什么，原始调用都会接收到结果：\n\n```perl\nsay secret_tangent( -1 );\nsub AUTOLOAD { return\
  \ 'mu' }\n```\n\n到目前为止，这些示例仅仅是拦截了对未定义函数的调用。你还有其他选择。\n\n### 在 AUTOLOAD() 中重新分发方法\n\
  \n面向对象编程中的常见模式是将某些方法从一个对象委托或代理到另一个对象。日志代理可以帮助调试：\n\n```perl\npackage Proxy::Log;\n\
  # 构造函数对标量引用进行 bless\nsub AUTOLOAD {\n    my ($name) = our $AUTOLOAD =~ /::(\\w+)$/;\n\
  \    Log::method_call( $name, @_ );\n    my $self = shift;\n    return $$self->$name(\
  \ @_ );\n}\n```\n\n这个 `AUTOLOAD()` 提取了未定义方法的名称。然后，它从已 bless 的标量引用中解引用代理对象，记录方法调用，然后使用提供的参数在代理对象上调用该方法。\n\
  \n### 在 AUTOLOAD() 中生成代码\n\n这种双重分发（double dispatch）很容易编写但效率低下。代理上的每次方法调用都必须在正常分发失败后才能进入\
  \ `AUTOLOAD()`。只需在程序需要时通过将新方法安装到代理类中，就可以只支付一次这种代价：\n\n```perl\nsub AUTOLOAD {\n\
  \    my ($name) = our $AUTOLOAD =~ /::(\\w+)$/;\n    my $method = sub { ... };\n\
  \    local $* = '';\n    { $method } = $method;\n    return $method( @_ );\n}\n\
  ```\n\n`AUTOLOAD()` 的体变成了一个绑定到未定义方法名的闭包（closure）。将该闭包安装到符号表中允许后续分发找到该方法。这种方法比直接调用\
  \ `AUTOLOAD()` 更整洁，尽管它可能违反封装。某些代码使用尾递归调用来替换方法：\n\n```perl\nsub AUTOLOAD {\n    my\
  \ ($name) = our $AUTOLOAD =~ /::(\\w+)$/;\n    my $method = sub { ... };\n    local\
  \ $* = '';\n    { $method } = $method;\n    goto $method;\n}\n```\n\n这与直接调用方法的效果相同，不同的是\
  \ `AUTOLOAD()` 不再出现在列表中。\n\n### AUTOLOAD 的缺点\n\n`AUTOLOAD()` 可能很有用，尽管很难正确使用。在运行时生成方法的朴素方法意味着\
  \ `can()` own 报告关于对象和类的正确信息。最简单的解决方案是使用 `subs` pragma 预先声明所有打算自动加载的函数：\n\n```perl\n\
  subs red blue ochre teal;\n```\n\n该技术很好地记录了你的意图，但需要你维护一个静态列表。重写 `can()` 效果更好：\n\n\
  ```perl\nsub can {\n    my ($self, $method) = @_;\n    # 使用父类 can() 的结果\n    my\
  \ $meth_ref = $self->SUPER::can( $method );\n    return $meth_ref if $meth_ref;\n\
  \    # 添加一些过滤\n    return unless $self->should_generate( $method );\n    $meth_ref\
  \ = sub { ... };\n    { $method } = $meth_ref;\n    $meth_ref;\n}\n\nsub AUTOLOAD\
  \ {\n    my ($self) = @_;\n    my ($name) = our $AUTOLOAD =~ /::(\\w+)$/;\n    return\
  \ unless my $meth_ref = $self->can( $name );\n    goto &$meth_ref;\n}\n```\n\n`AUTOLOAD()`\
  \ 是一把大锤；它可以捕获你无意自动加载的函数和方法，例如 `DESTROY()`，对象的析构函数。如果你写了一个没有实现的 `DESTROY()` 方法，Perl\
  \ 会愉快地分发到它那里，而不是 `AUTOLOAD()`：\n\n```perl\n# 跳过 AUTOLOAD()\nsub DESTROY {}\n```\n\
  \n\n\n如果你在单个命名空间中混合了函数和方法，而该命名空间继承自另一个提供了自己的 `AUTOLOAD()` 的包，可能会看到这种奇怪的错误：\n\n|\
  \ | 为非方法 `slam_door()` 使用继承的 `AUTOLOAD` 已弃用 |\n\n如果发生这种情况，请简化你的代码；你调用了一个函数，而该包继承自一个包含自己的\
  \ `AUTOLOAD()` 的类。这个问题在多个方面都会变得严重：在单个命名空间中混合函数和方法通常是一个设计缺陷；继承和 `AUTOLOAD()` 会迅速变得复杂；而且当你不知道对象提供哪些方法时，对代码进行推理是非常的。\n\
  \n`AUTOLOAD()` 适用于快速粗略的编程——但健壮的代码应该避免它。\n\n### Footnotes\n\n| [[11]](#f_0040.html_FNPTR-11)\
  \ | [`hop.perl.plover.com/`](http://hop.perl.plover.com/) |\n\nCopyright © 2015,\
  \ The Pragmatic Bookshelf.\n\n# 第 6 章：正则表达式与匹配\n\nPerl 有时被称为“实用提取与报告语言”。你已经看到控制流、运算符和数据结构如何让\
  \ Perl 变得实用，并且你可以想象如何创建报告。“提取”（Extraction）部分是什么意思？Perl 擅长文本处理，部分归功于正则表达式。\n\n正则表达式（也称为\
  \ `regex` 或 `regexp`）是一种描述文本特征的模式——用于提取地址、替换拼写错误，甚至从网站上抓取股票价格以帮助你决定如何处理投资账户。Perl\
  \ 的正则表达式引擎将这些模式应用于匹配或替换文本的片段。\n\n虽然精通正则表达式是一项艰巨的任务，但少量的知识将带给你巨大的力量。随着时间的推移，通过实践向工具箱添加越来越多的功能，你将会积累知识。\n\
  \n本章概述了最重要的正则表达式特征，但并不全面。Perl 的文档包含了教程（`perldoc perlretut`）、参考指南（`perldoc perlreref`）和完整文档（`perldoc\
  \ perlre`）。如果你对理论感兴趣，Jeffrey Friedl 的书籍《正则表达式正则表达式》（*Mastering Regular Expressions*）解释了正则表达式工作的理论和机制。\n\
  \n## 字面量 (Literals)\n\n正则表达式可以是非常简单的子字符串模式：\n\n| | `my $name = 'Chatfield';` |\n\
  | | `say 'Found a hat!' if $name =~ /hat/;` |\n\n匹配运算符 `m/ /`（简写为 `/ /`）识别一个正则表达式——在本例中为\
  \ `hat`。这个模式并不是一个单词，而是表示“字符 `h`，后面跟着字符 `a`，然后是字符 `t`。”模式中的每个字符都是一个不可分割的元素（原子）。原子要么匹配，要么不匹配。\n\
  \n正则绑定运算符 `=~` 是一个中缀运算符，它将第二个操作数的正则表达式应用于作为第一个操作数提供的字符串。在标量上下文中求值时，匹配将评估为代表匹配成功或失败的布尔值。绑定运算符的否定形式\
  \ `!~` 在匹配成功之前会被评估为真值。\n\n| 记住 index！ |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 内建的 `index` 也可以搜索字符串中的字面子字符串。使用正则引擎来这样做就像驾驶一架自主战斗机去街角商店买奶酪——但 Perl 允许你以你认为清晰的方式编写代码。\
  \ |\n\n替换运算符 `s///` 在某种意义上是一个带有两个操作数的环绕运算符。它的第一个操作数（第一个和第二个分隔符之间的部分）是一个正则表达式。第二个操作数（第二个和第三个分隔符之间的部分）是用于替换正则绑定运算符所使用的字符串操作数匹配部分的子字符串。例如，这里是治疗讨厌的夏季过敏的方法：\n\
  \n| | `my $status = 'I feel ill.';` |\n| | `$status =~ s/ill/well/;` |\n| | `say\
  \ $status;` |\n\n## qr// 运算符与正则表达式组合\n\n`qr//` 运算符创建一类正则表达式，你可以将其存储在变量中。将这些正则表达式作为匹配和替换运算符的操作数：\n\
  \n| | `my $hat = qr/hat/;` |\n| | `say 'Found a hat!' if $name =~ /$hat/;` |\n\n\
  或使用它们将多个正则表达式对象组合成复杂的模式：\n\n| | `my $hat = qr/hat/;` |\n| | `my $field = qr/field/;`\
  \ |\n| | |\n| | `say 'Found a hat in a field!'` |\n| | `if $name =~ /$hat$field/;`\
  \ |\n| | |\n| | `like $name, qr/$hat$field/, 'Found a hat in a field!';` |\n\n|\
  \ Like is, with More like |\n| --- |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | Test::More like 测试作为第二个参数提供的 `regex`。 |\n\n## 量词 (Quantifiers)\n\n匹配字面字符是好的，但量词控制了字符在字符串中出现的频率。最简单的量词是\
  \ `?`：\n\n| | `my $cat_or_dog = qr/cat/;` |\n| | |\n| | `$cat_or_dog =~ /cat/;`\
  \ |\n| | |\n| | `$cat_or_dog =~ /dog/;` |\n| | |\n| | `$cat_or_dog = /cat?/;` |\n\
  ...（注：原文此处存在大量重复和损坏代码，已进行优化处理）\n\n\n\n\n你可以使用数值量符来表示符号量符，但符号量符更短且更常用。\n\n## 贪婪性\
  \ (Greediness)\n\n`+` 和 `*` 量符是贪婪的：它们尝试匹配尽可能多的输入字符串。这可能是特别具有危害的。考虑对“零或多个非换行字符”模式\
  \ `.*` 的初素用法：\n\n| | `*# 一个糟糕的正则` |\n| :--- | :--- |\n| | `my $hot_meal = qr/hot.*meal/;`\
  \ |\n| | |\n| | `say 'Found a hot meal!' if 'I have a hot meal' =~ $hot_meal;` |\n\
  | | |\n| | `say 'Found a hot meal!' if 'one-shot, piecemeal work!' =~ $hot_meal;`\
  \ |\n\n贪婪量符首先匹配所有内容。如果匹配失败，正则引擎将每次回退一个字符，直到找到匹配项。\n\n`?` 量符修饰符可以将贪婪量符变为非贪婪：\n\n\
  | | `my $minimal_greedy = qr/hot.*?meal/;` |\n| :--- | :--- |\n\n当给定非贪婪量符时，正则引擎会倾向于最短的潜在匹配。如果该匹配失败，引擎将每次将\
  \ `.*?` 标记组合识别的字符数增加一个。由于 `*` 匹配零或多次，该标记组合的最小潜在匹配是零个字符：\n\n| | `say 'Found a hot\
  \ meal' if 'ilikeahotmeal' =~ /$minimal_greedy/;` |\n| :--- | :--- |\n\n使用 `+?`\
  \ 以非贪婪方式匹配一个或多个项目：\n\n| | `my $minimal_greedy_plus = qr/hot.+?meal/;` |\n| :---\
  \ | :--- |\n| | `unlike 'ilikeahotmeal', $minimal_greedy_plus;` |\n| | |\n| | `like\
  \ 'i like a hot meal', $minimal_greedy_plus;` |\n\n`?` 量符修饰符同样适用于 `?`（零或一次匹配）量符以及范围量符。它导致正则尽可能少地匹配输入。\n\
  \n正则表达式是强大的，但它们并不总是解决问题的最佳方法。对于贪婪模式 `.+` 和 `.*` 来说更是如此。一个需要填写 7 竖（“肥沃的土壤”）四个格子的字谜爱好者会发现，该模式会有太多无效的候选词：\n\
  \n| | `my $seven_down = qr/l$letters_only*m/;` |\n| :--- | :--- |\n\n如果你对字典中的所有单词运行此代码，它在到达真实答案\
  \ loam 之前就会匹配 Alabama、Belgium 和 Bethlehem。这些单词不仅太长了，而且匹配部分出现在单词的任何地方，而不仅仅是开头。\n\n\
  ## 正则锚点 (Regex Anchors)\n\n知道正则引擎如何处理贪婪匹配是重要的——但知道你想要哪种匹配也同样重要。正则锚点强制正则引擎在固定位置开始或结束匹配。字符串开头锚点\
  \ `\\A` 规定任何匹配必须从字符串开头开始：\n\n| | `* 也会匹配 \"lammed\", \"lawmaker\", 和 \"layman\"\
  ` |\n| :--- | :--- |\n| | `my $seven_down = qr/\\A${letters_only}{2}m/;` |\n\n行尾字符串锚点\
  \ `\\z` 要求匹配结束于字符串末尾：\n\n| | `* 也会匹配 \"loom\", 但这是一个明显的改进` |\n| :--- | :--- |\n\
  | | `my $seven_down = qr/\\A${letters_only}{2}m\\z/;` |\n\n你经常会看到 `^` 和 `$` 断言用于匹配字符串的开头和结尾。`^`\
  \ 确实匹配字符串开头，但在某些情况下，它可以匹配字符串内换行符之后的不可见点。同样，`$` 确实匹配字符串结尾（如果存在换行符则之前），但它可以匹配字符串中间换行符之前的不可见点。`\\\
  A` 和 `\\z` 更具体，因此更有用。\n\n单词边界锚点 `\\b` 仅在单词字符 `\\w` 和非单词字符 `\\W` 之间的边界匹配。该边界本身并不是一个字符；它没有宽度。它是不可见的。使用锚定正则来查找\
  \ loam 的同时排除 Belgium：\n\n| | `my $seven_down = qr/\\bl${letters_only}{2}m\\b/;`\
  \ |\n| :--- | :--- |\n\n这个锚点有一个可能会让你困惑（也可能不会）的缺陷：它不理解像撇号这样的标点符号。幸运的是，Perl 5.22 添加了\
  \ Unicode 单词边界元字符 `\\b{wb}`，它可以理解缩写：\n\n| | `say \"Panic\" if \"Don't Panic\" =~\
  \ /Don\\b/;` |\n| | `say \"No Panic\" unless \"Don't Panic\" =~ /Don\\b{wb}/` |\n\
  \n## 元字符 (Metacharacters)\n\nPerl 将几个字符解释为元字符。你已经见过 `\\b`、`.` 和 `?`。元字符提供了超越字面匹配的力量。`.`\
  \ 匹配除换行符外的任何字符。`s` 修饰符允许 `.` 也匹配换行符。`\\d` 匹配任何数字，`\\D` 匹配任何非数字。`\\w` 匹配任何单词字符，`\\\
  W` 匹配任何非单词字符。`\\s` 匹配任何空格，`\\S` 匹配任何非空格。`^` 匹配字符串开头，`\\$` 匹配字符串结尾。`\\A` 和 `\\z`\
  \ 是 `^` 和 `$` 更具体的版本。`\\b` 匹配单词边界，`\\b{wb}` 匹配 Unicode 单词边界。\n\n元字符有否定形式。使用 `\\\
  W` 匹配非单词字符。使用 `\\D` 匹配非数字。使用 `\\S` 匹配非空格。使用 `\\B` 匹配单词边界以外的地方，`\\B{wb}` 匹配单词边界以外的地方。\n\
  \n## 字符类 (Character Classes)\n\n当这些元字符都不具体时，将多个字符分组为字符类。字符类允许你将一组备选项视为单个原子：\n\n\
  | | `my $ascii_vowels = qr/[aeiou]/` |\n| :--- | :--- |\n| | `my $maybe_cat = qr/c${ascii_vowels}t/`\
  \ |\n\n### 插值发生\n\n如果没有这些大括号，Perl 解析器会将变量名解释为 `$ascii_vowelst`，这会导致未知变量错误，或将现有 `$ascii_vowelst`\
  \ 内容插值到正则中。\n\n连字符 `-` 允许你在类中包含一个连续的字符范围，例如这个 `$ascii_letters_only` 正则：\n\n| | `my\
  \ $ascii_letters_only = qr/[a-zA-Z]/` |\n| :--- | :--- |\n\n要将连字符作为类的一个成员，请将其放在类的开头或结尾：\n\
  \n| | `my $interesting_punctuation = qr/[-!?]/` |\n| :--- | :--- |\n\n或者转义它：\n\n\
  | | `my $line_characters = qr/[\\|\\-_]/` |\n| :--- | :--- |\n\n使用脱字符 `^` 作为字符类的第一个元素表示“除了这些字符之外”：\n\
  \n| | `my $not_an_ascii_vowel = qr/[^aeiou]/` |\n| :--- | :--- |\n\n\n\n\n\n在第一个位置以外的任何地方使用脱字符\
  \ `^` 可以使其成为字符类的一部分。要在否定字符类中包含连字符，请将其放在 `^` 之后或类的末尾——或者对其进行转义。\n\n## 捕获\n\n正则表达式允许你分组并捕获匹配的部分以供以后使用。要从字符串中提取格式为\
  \ (202) 456-1111 的美国电话号码，可以使用这个：\n\n| |   | `my $area_code = qr/\\(\\d{3}\\)/;`\
  \ |\n| ​  | `my $local_number = qr/\\d{3}-?\\d{4}/;` |\n| ​  | `my $phone_number\
  \ = qr/$area_codes?$local_number/;` |\n\n注意 `$area_code` 中转义的括号。括号在 Perl 正则表达式是特殊的。它们将原子分组为更大的单元并捕获匹配字符串的部分。要匹配字面量括号，请使用反斜杠进行转义，如\
  \ `$area_code` 所示。\n\n### 命名捕获\n\n命名捕获允许你捕获应用正则表达式时的匹配部分并在以后访问它们。这里有一个从联系信息中提取电话号码的示例：\n\
  \n| |  | `if ($contact_info =~ /(?<phone>$phone_number)/) {` |\n| ​  | `say \"Found\
  \ a number $+{phone}\";` |\n| ​  | `}` |\n\n命名捕获的语法如下：\n\n| |  | `(?<capture name>\
  \ ... )` |\n\n括号包围捕获内容。`?< name >` 紧跟在左括号之后，为该特定捕获提供名称。捕获的剩余部分是一个正则表达式。\n\n当对包含模式匹配成功时，Perl\
  \ 会更新魔法变量 `%+`。在这个哈希表中，键是捕获名称，值是匹配捕获的字符串部分。\n\n### 数字数字捕获\n\nPerl 也支持数字捕获：\n\n|\
  \ |  | `if ($contact_info =~ /($phone_number)/) {` |\n| ​  | `say \"Found a number\
  \ $1\";` |\n| ​  | `}` |\n\n这种形式的捕获没有标识名称，且不对 `%+` 执行任何操作。相反，Perl 将捕获的子字符串存储在系列魔法变量中。第一个匹配捕获进入\
  \ `$1`，第二个进入 `$2`，依此类推。捕获计数从捕获的左括号开始。因此，第一个左括号开始捕获到 `$1`，第二个到 `$2`，依此类推。\n\n虽然命名捕获的语法比数字捕获的长，但它提供了额外的清晰。数左括号是非常麻烦的，而且组合每个包含数字捕获的正则是困难的。命名捕获提高了正则的可维护性——尽管可能发生名称冲突，但这种情况相对少见。通过仅在顶层正则中使用命名捕获而不是在组成大正则的小正则中使用，可以降低风险。\n\
  \n在列表上下文中，正则匹配返回捕获的子字符串列表：\n\n| |  | `if (my ($number) = $contact_info =~ /($phone_number)/)\
  \ {` |\n| ​  | `say \"Found a number $number\";` |\n| ​  | `}` |\n\n数字捕获在简单替换中也有用，此时命名捕获可能更显冗长：\n\
  \n| |  | `my $order = 'Vegan brownies!';` |\n| ​  |  |\n| ​  | `$order =~ s/Vegan\
  \ (\\w+)/Vegetarian $1/;` |\n| ​  | `*# or*` |\n| ​  | `$order =~ s/Vegan (?<food>\\\
  w+)/Vegetarian $+{food}/;` |\n\n## 分组与选择\n\n之前的示例都将量词应用于了简单的原子上。你可以将其应用于任何正则元素：\n\
  \n| |  | `my $pork = qr/pork/;` |\n| ​  | `my $beans = qr/beans/;` |\n| ​  |  |\n\
  | ​  | `like 'pork and beans', qr/\\A$pork?.*?$beans/,` |\n| ​  | `'maybe pork,\
  \ definitely beans';` |\n\n如果你手动扩展正则表达式，结果可能会让你惊讶：\n\n| |  | `my $pork_and_beans\
  \ = qr/\\Apork?.*beans/;` |\n| ​  |  |\n| ​  | `like 'pork and beans', qr/$pork_and_beans/,`\
  \ |\n| ​  | `'maybe pork, definitely beans';` |\n| ​  | `like 'por and beans', qr/$pork_and_beans/,`\
  \ |\n| ​  | `'wait... no phylloquinone here!';` |\n\n有时特殊性有助于提高模式的准确性：\n\n| |  |\
  \ `my $pork = qr/pork/;` |\n| ​  | `my $and = qr/and/;` |\n| ​  | `my $beans = qr/beans/;`\
  \ |\n| ​  |  |\n| ​  | `like 'pork and beans', qr/\\A$pork?.*?$beans/,` |\n\n\n\n\
  \n构造 `(?!...)` 仅在短语 `astrophe` 不紧随其后时匹配短语 `cat`。零宽正向先行断言\n\n```perl\nmy $disastrous_feline\
  \ = qr/cat(?=astrophe)/;\n```\n\n仅在短语 `astrophe` 紧随其后时匹配短语 `cat`。虽然正则表达式可以实现相同的功能，但考虑使用正则来查找字典中所有以\
  \ `cat` 开头的非灾难性词：\n\n```perl\nmy $disastrous_feline = qr/cat(?!astrophe)/;\n```\n\
  \n```perl\nwhile (<$words>) {\n    chomp;\n    next unless /\\A(?<cat>$disastrous_feline.*)\\\
  Z/;\n    say \"Found a non-catastrophe '$+{cat}'\";\n}\n```\n\n零宽断言不消耗源字符串的任何字符，这使得锚定的片段\
  \ `.*\\Z` 用于匹配。否则，捕获将只会捕获源字符串的 `cat` 部分。\n\n要断言你的猫从不出现在行开头，请使用零宽负向后行断言。这些断言必须具有固定长度，因此你不能使用量符：\n\
  \n```\nmy $middle_cat = qr/(?<!\\A)cat/;\n```\n\n构造 `(?<!...)` 包含固定宽度的模式。你也可以通过零宽正向后行断言表示\
  \ `cat` 必须紧跟在空格字符之后：\n\n```perl\nmy $space_cat = qr/(?<=\\s)cat/;\n```\n\n构造 `(?<=...)`\
  \ 包含固定宽度的模式。这种方法在全局正则匹配与 `\\G` 修饰符结合时非常有用。\n\nPerl 还包含了保留断言 `\\K`。这种零宽正向后行断言可以具有变长度：\n\
  \n```perl\nmy $spacey_cat = qr/\\s+\\Kcat/;\nlike 'my cat has been to space', $spacey_cat;\n\
  like 'my cat has been to doublespace', $spacey_cat;\n```\n\n`\\K` 在某些移除模式末部的替换中异常地有用。它允许你匹配一个模式但只移除其中的一部分：\n\
  \n```perl\nmy $exclamation = 'This is a catastrophe!';\n$exclamation =~ s/cat\\\
  K\\w+!./;\nlike $exclamation, qr/\\bcat./., \"That wasn't so bad!\";\n```\n\n在 `\\\
  K` 断言之前的所有内容都会匹配，但只有断言之后的匹配部分会被替换掉。\n\n## 正则修饰符\n\n若干修饰符会改变正则表达式运算符的行为。这些修饰符出现在匹配、替换和\
  \ `qr//` 操作符的最后。例如，这里是如何启用忽略大小写的匹配：\n\n```\nmy $pet = 'ELLie';\nlike $pet, qr/Ellie/,\
  \ 'Nice puppy!';\nlike $pet, qr/Ellie/i, 'shift key br0ken';\n```\n\n第一个 `like()`\
  \ 将失败，因为字符串包含不同的字母。第二个 `like()` 将通过，因为 `/i` 修饰符导致正则忽略大小写。由于修饰符的作用，第二个正则中的 `L` 和\
  \ `l` 实际上是等效的。\n\n你还可以在模式中嵌入正则修饰符：\n\n```perl\nmy $find_a_cat = qr/(?<feline>(?i)cat)/;\n\
  ```\n\n`(?i)` 语法仅对其包裹的组（在本例中为命名捕获）启用忽略大小写的匹配。你可以使用这种形式使用多个修饰符。通过在修饰符前加上减号（`-`）来禁用特定的修饰符。\n\
  \n```perl\nmy $find_a_rational = qr/(?<number>(?-i)Rat)/;\n```\n\n多行运算符 `/m` 允许\
  \ `^` 和 `$` 锚匹配字符串中嵌入的任何换行符。\n\n`/s` 修饰符将源字符串视为单行，使得元字符 `.` 匹配换行符。Damian Conway\
  \ 提供了一个记忆：`/m` 修改多个正则元字符的行为，而 `/s` 修改单个正则元字符的行为。\n\n`/r` 修饰符导致替换操作返回替换的结果，保持原始字符串不变。如果替换成功，结果是原始字符串的修改副本。如果替换失败（因为模式不匹配），结果是原始字符串的未修改副本：\n\
  \n```perl\nmy $status = 'I am hungry for pie.';\nmy $newstatus = $status =~ s/pie/cake/r;\n\
  my $status = $status =~ s/pie/cake/r;\n```\n\n`/x` 修饰符允许你在模式中嵌入空白和注释。`/x` 修饰符使模式更具可读性：\n\
  \n\n\n\n比较的类型通常取决于右操作数的类型，然后取决于左操作数的类型。例如，如果右操作数是一个带有数值组件的标量，则比较将使用数值相等性。如果右操作数是一个正则表达式，比较将使用\
  \ `grep` 或模式匹配。如果右操作数是一个数组，比较将执行 `grep` 或递归智能匹配。如果右操作数是一个哈希表（hash），比较将检查一个或多个键的存在。perldoc\
  \ perlsyn 中一张巨大且令望而生畏的表格提供了关于智能匹配可以执行的所有比较的更多详细信息。\n\n这些示例刻意设计得很简单，因为智能匹配可能会令人困惑：\n\
  \n```perl\nuse experimental 'smartmatch';\n\nmy ($x, $y) = (10, 20);\nsay 'Not equal\
  \ numerically' unless $x ~~ $y;\n\nmy $z = '10 little endians';\nsay 'Equal numeric-ishally'\
  \ if $x ~~ $z;\n\nmy $needle = qr/needle/;\nsay 'Pattern match' if 'needle' ~~ $needle;\n\
  say 'Grep through array' if @haystack ~~ $needle;\nsay 'Grep through hash keys'\
  \ if %hayhash ~~ $needle;\nsay 'Grep through array' if $needle ~~ @haystack;\nsay\
  \ 'Array elements exist as hash keys' if %hayhash ~~ @haystack;\nsay 'Smart match\
  \ elements' if @straw ~~ @haystack;\nsay 'Grep through hash keys' if $needle ~~\
  \ %hayhash;\nsay 'Array elements exist as hash keys' if @haystack ~~ %hayhash;\n\
  \nsay 'Hash keys identical' if %hayhash ~~ %haymap;\n```\n\n即使一个操作数是指向给定数据类型的引用，智能匹配仍然有效：\n\
  \n```perl\nsay 'Hash keys identical' if %hayhash ~~ \\%hayhash;\n```\n\n除了在最简单的情况下，很难推荐使用智能匹配，但当你有一个字面量字符串或数字要与变量匹配时，它是有。\n\
  \nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 7 章：对象\n\n每个大型程序都有多个层级的设计。在底部，你有关于正在解决的问题的具体细节。在顶层，你必须组织代码使其符合逻辑。管理这种复杂性的唯一希望就是利用抽象（以相似的方式处理相似的事）和封装（将相关的细节组合在一起）。\n\
  \n对于大问题，函数是不够的。有几种技术将函数分组为相关行为的单元；你已经见过高阶函数了。另一种流行的技术是面向对象（OO）或面向对象编程（OOP），程序与对象工作——对象是具有自身标识的离散、唯一的实体。\n\
  \n## Moose\n\nPerl 的默认对象系统是极简但灵活的。它的语法有点笨拙，而且它暴露了对象系统是如何工作的。你可以在此基础上构建出伟的东西，但它没有提供许多其他语言默认提供的功能。\n\
  \nMoose 是适用于 Perl 的完整对象系统。它是一个来自 CPAN 的可用完整分发——不是核心语言的一部分，但无论如何都值得安装和使用。Moose 提供了更简单使用对象系统的方法，以及来自\
  \ Smalltalk 和 Common Lisp 等语言的高级特性。\n\nMoose 对象与原生 Perl 配合。在你的程序中，你可以混合使用用 默认对象系统和\
  \ Moose 编写的对象。\n\n| Moose 文档 |\n| :--- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ | 请查看 CPAN 上的 Moose::Manual 获取详尽的 Moose 文档。 |\n\n### 类\n\nMoose 对象是类的具体实例，类是描述特定于对象的数据和行为的模板。类通常属于一个包（package），该包提供了它的名称：\n\
  \n```perl\npackage Cat {\n    use Moose;\n}\n```\n\n这个 `Cat` 类似乎什么都没做，但那正是 Moose\
  \ 创建一个类所需的所有。你可以使用这种语法创建 `Cat` 类的对象（或实例）：\n\n```perl\nmy $brad = Cat->new;\nmy $jack\
  \ = Cat->new;\n```\n\n就像这个箭头运算符解引用引用一样，它调用了 `Cat` 上的一个方法。\n\n### 方法\n\n方法是与类关联的函数。就像函数属于一个命名空间一样，方法属于一个类。\n\
  \n当你调用一个方法时，你是通过一个调用者（invocant）来调用的。当你对 `Cat` 运行 `new()` 时，类名 `Cat` 就是 `new()` 的调用者。将此比为向类发送一条消息：“执行\
  \ `new()` 所做的任何操作。”在这种情况下，调用 `new()` 方法——发送新消息——会返回一个 `Cat` 类的新对象。\n\n当你在对象上调用方法时，该对象就是调用者：\n\
  \n```perl\nmy $choco = Cat->new;\n$choco->sleep_on_keyboard;\n```\n\n方法的第一个参数是它的调用者（按照惯例为\
  \ `$self`）。假设 `Cat` 可以 `meow()`：\n\n```perl\npackage Cat {\n    use Moose;\n\n \
  \   sub meow {\n        my $self = shift;\n        say 'Meow!';\n    }\n}\n```\n\
  \n现在，任何 `Cat` 实例都可以 `meow`：\n\n```perl\nmy $fuzzy_alarm = Cat->new;\n$fuzzy_alarm->meow()\
  \ for 1 .. 3;\n```\n\n### 属性\n\n每个 Perl 对象都是唯一的。对象可以包含与每个对象相关的私有数据——通常称为属性、实例数据或状态。你通过将其声明为类的一部分来定义属性：\n\
  \n```perl\npackage Cat {\n    use Moose;\n\n    has 'name', is => 'ro', isa => 'Str';\n\
  }\n```\n\nMoose 导出了 `has()` 函数供你声明属性。用英语读，这段代码的意思是“Cat 对象有一个 name 属性。它是只读的，并且是一个字符串。”第一个参数\
  \ `name` 是属性的名称。`is => 'ro'` 参数对声明该属性是只读的，因此在你设置属性值后不能修改该值。最后，`isa => 'Str'` 参数对声明该属性的值只能是字符串。\n\
  \n从这段代码中，Moose 创建了一个访问器方法 `name()`，并允许你向 `Cat` 的构造函数传递一个 `name` 参数：\n\n```perl\n\
  for my $name (qw(Tuxie Petunia Daisy)) {\n    my $cat = Cat->new( name => $name\
  \ );\n    say \"Created a cat for \", $cat->name;\n}\n```\n\nMoose 使用圆括号分隔属性名称和特征：\n\
  \n```perl\nhas 'name' => (is => 'ro', isa => 'Str');\n```\n\n这等同于以下代码：\n\n```perl\n\
  has('name', 'is', 'ro', 'isa', 'Str');\n```\n\nMoose 的方法对于复杂的声明非常有用：\n\n```perl\n\
  has 'name' => (\n    is => 'ro',\n    isa => 'Str',\n    # 高级 Moose 选项; perldoc\
  \ Moose\n    init_arg => undef,\n    lazy_build => 1,\n);\n```\n\n\n\n\n但本书在简单声明中倾向于使用低标点符号的方法。请选择最能带给你清晰清晰的风格。\n\
  \n当属性声明带有类型时，`Moose` 将尝试验证所有分配给该属性的值。有时，这种严谨性是无价的。虽然当你尝试将 `name` 设置为一个非字符串的值时，`Moose`\
  \ 会报错，但属性并不要求类型。在这种情况下，任何值都是可以：\n\n```\npackage Cat {\n  use Moose;\n\n  has 'name',\
  \ is => 'ro', isa => 'Str';\n  has 'age', is => 'ro';\n}\n\nmy $invalid = Cat->new(\
  \ name => 'bizarre', age => 'purple' );\n```\n\n如果你将一个属性标记为可读且可写（使用 `is => rw`），`Moose`\
  \ 将创建一个可以更改该属性值的变异器方法：\n\n```perl\npackage Cat {\n  use Moose;\n\n  has 'name',\
  \ is => 'ro', isa => 'Str';\n  has 'age', is => 'ro', isa => 'Int';\n  has 'diet',\
  \ is => 'rw';\n}\n\nmy $fat = Cat->new( name => 'Fatty', age => 8, diet => 'Sea\
  \ Treats' );\n\nsay $fat->name, ' eats ', $fat->diet;\n\n$fat->diet('Low Sodium\
  \ Kitty Lo Mein');\nsay $fat->name, ' now eats ', $fat->diet;\n```\n\n作为变异器使用 `ro`\
  \ 访问器将抛出异常 `Cannot assign a value to a read-only accessor at ........`。\n\n使用 `ro`\
  \ 或 `rw` 是设计、便利性和纯洁性的问题。`Moose` 在此处不强制执行单一哲学。有些人建议将所有实例数据设为 `ro`，这样你就必须将实例数据传递给构造函数(不可变性)）。在\
  \ `Cat` 示例中，`age()` 可能仍然是一个访问器，但构造函数可以获取猫的出生年份并根据当前年份计算年龄。这种方法整合了验证代码，并确保所有对象在创建后都拥有有效数据。\n\
  \n这说明了面向对象中一个微妙但重要的原则。对象包含相关数据，并可以对这些数据执行或基于这些数据执行行为。类描述了这些数据和行为。你可以拥有多个具有独立实例数据的独立对象，并以相同的方式处理所有对象；它们将根据其实例数据表现出不同。\n\
  \n### 封装\n\n`Moose` 允许你声明类实例拥有哪些属性（猫有一个名字），以及这些属性的属性（你可以给一只猫命名一次，此后它的名字就不能更改）。`Moose`\
  \ 本身决定如何存储这些属性——你通过访问器访问它们。这就是封装：从该对象的外部用户处隐藏对象的内部细节。\n\n考虑上述想法，通过传入猫的出生年份并在需要时计算年龄，来改变\
  \ `Cats` 管理年龄的方式：\n\n```perl\npackage Cat {\n  use Moose;\n\n  has 'name', is =>\
  \ 'ro', isa => 'Str';\n  has 'diet', is => 'rw';\n  has 'birth_year', is => 'ro',\
  \ isa => 'Int';\n\n  sub age {\n    my $self = shift;\n    my $year = (localtime)[5]\
  \ + 1900;\n\n    return $year - $self->birth_year;\n  }\n}\n```\n\n虽然创建 `Cat` 对象的语法发生了变化，但使用\
  \ `Cat` 对象的语法没有变化。在 `Cat` 之外，`age()` 的行为像既往一样。它的工作原理是隐藏在 `Cat` 类内部的细节。\n\n这种变化提供了另一个优势；默认属性允许用户在不提供出生年份的情况下构建新的\
  \ `Cat` 对象：\n\n```perl\npackage Cat {\n  use Moose;\n\n  has 'name', is => 'ro',\
  \ isa => 'Str';\n  has 'diet', is => 'rw', isa => 'Str';\n  has 'birth_year',\n\
  \    is => 'ro',\n    isa => 'Int',\n    default => sub { (localtime)[5] + 1900\
  \ };\n}\n```\n\n属性上的 `default` 关键字使用函数引用（或字面量字符串或数字），在构造新对象时返回该属性的默认值。如果创建对象的代码没有为该属性传递构造函数值，则对象将获得默认值：\n\
  \n```perl\nmy $kitten = Cat->new( name => 'Hugo' );\n```\n\n那个 `kitten` 在明年之前年龄将为\
  \ 0。\n\n#### 兼容性与 API\n\n| :--- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ | 保留创建 `Cat` 对象的旧语法。参见 `Moose::Attributes`。 |\n\n#### 多态\n\n面向对象的真正力量超越了封装。将程序对\
  \ Cats 的了解（属性）以及 Cats 能做什么（方法）的细节移动到 `Cat` 类中意味着代码变得不那么具体。\n\n考虑一个显示对象详细统计信息的函数：\n\
  \n```perl\nsub show_vital_stats {\n  my $object = shift;\n  say 'My name is ', $object->name;\n\
  \  say 'I am ', $object->age;\n  say 'I eat ', $object->diet;\n}\n```\n\n如果你向它传递一个\
  \ `Cat` 对象，这个函数显然可以工作。对于任何具有相应访问器的对象，它也会做得当的事，无论它是什么种对象——无论它是否使用了 `Moose`。`show_vital_stats()`\
  \ 只关心对象是否支持三个不带参数的方法，且每个方法返回可以在字符串文中拼接的值。\n\n这种属性是多态：如果两个类提供了相同的接口，你可以用一个类的对象替换另一个类的对象。\n\
  \n#### 鸭类型\n\n| :--- |\n| ![images/aside-icons/info.png](img/info.png) | 某些语言和环境要求在程序相互替换实例之前，必须暗示或声明两个类之间的正式关系。Perl\
  \ 没有此类要求。你可以将任何具有相同名称方法的实例视为等同。有些人称其为鸭类型，认为任何会 `quack()` 的对象都足够像鸭，以至于你可以当作鸭。 |\n\
  \n如果没有对象多态，枚举整个动物园的动物将是乏味的。同样，你可能已经开始看到计算虎豹或章鱼的年龄与计算 `Cat` 的年龄是一样的。\n\n当然，了解对象在做什么以及这意味着什么有时是有用的。\n\
  \n\n\n\n角色（Role）是一个行为和状态的命名集合。^([[12]](#f_0067.html_FOOTNOTE-12)) 类（Class）将行为和状态组织成对象的模板，而角色将行为和状态组织成一个命名的集合。你可以实例化一个类，但不能实例化一个角色。角色是类所做的事情。\n\
  \n假设有一个具有年龄的 `Animal` 和可以存放的 `Cheese`，其区别之一可能是 `Animal` 执行了 `LivingBeing` 角色，而 `Cheese`\
  \ 执行了 `Storable` 角色：\n\n```perl\npackage LivingBeing {\nuse Moose::Role;\n  requires\
  \ qw( name age diet );\n}\n```\n\n`Moose::Role` 提供的 `requires` 关键字允许你列出该角色要求组合类实现的方法。任何执行该角色的类必须提供\
  \ `name()`、`age()` 和 `diet()` 方法。`Cat` 类必须声明它执行了该角色：\n\n```perl\npackage Cat {\n\
  use Moose;\n\n  has 'name', is => 'ro', isa => 'Str';\n  has 'diet', is => 'rw',\
  \ isa => 'Str';\n\n  has 'birth_year',\n  is => 'ro',\n  isa => 'Int',\n  default\
  \ => sub { (localtime)[5] + 1900 };\n\n  with 'LivingBeing';\n\n  sub age { ...\
  \ }\n}\n```\n\n`with` 行导致 Moose 将 `LivingBeing` 角色组合到 `Cat` 类中。组合确保了角色的所有属性和方法都是类的一部分。`LivingBeing`\
  \ 要求任何组合类提供名为 `name()`、`age()` 和 `diet()` 方法。`Cat` 满足了这些约束。如果 `LivingBeing` 被组合到一个没有提供这些方法的类中，Moose\
  \ 将抛出一个异常。\n\n现在，所有 `Cat` 实例在查询是否提供 `LivingBeing` 角色时都将返回真值。`Cheese` 对象则不应该是：\n\n\
  ```perl\nsay 'Alive!' if $fluffy->DOES('LivingBeing');\nsay 'Moldy!' if $cheese->DOES('LivingBeing');\n\
  ```\n\n这种设计技术将类和对象的能力与这些类和对象的实现分离开。正如前面暗示的，`Cat` 类的出生年份计算行为本身也可以是一个角色：\n\n```perl\n\
  package CalculateAge::From::BirthYear {\nuse Moose::Role;\n\n  has 'birth_year',\n\
  \  is => 'ro',\n  isa => 'Int',\n  default => sub { (localtime)[5] + 1900 };\n\n\
  \  sub age {\n    my $self = shift;\n    my $year = (localtime)[5] + 1900;\n\n \
  \   return $year - $self->birth_year;\n  }\n}\n```\n\n从 `Cat` 中提取此角色使得该有用的行为对其他类可用。现在\
  \ `Cat` 可以组合两个角色：\n\n```perl\npackage Cat {\nuse Moose;\n\n  has 'name', is => 'ro',\
  \ isa => 'Str';\n  has 'diet', is => 'rw';\n\n  with 'LivingBeing', 'CalculateAge::From::BirthYear';\n\
  }\n```\n\n`CalculateAge::From::BirthYear` 的 `age()` 方法满足了 `LivingBeing` 角色的要求。提取\
  \ `CalculateAge::From::BirthYear` 角色只是改变了 `Cat` 计算年龄的细节。它仍然是一个 `LivingBeing`。`Cat`\
  \ 可以选择实现自己的年龄逻辑，也可以从其他地方获取。唯一重要的是它提供了一个满足 `LivingBeing` 约束的 `age()` 方法。\n\n多态（polymorphism）意味着你可以以相同的方式处理具有相同行为多个对象，而同态（allomorphism）意味着一个对象可以用多种方式实现相同的行为。普遍的同态（Pervasive\
  \ allomorphism）可以减小类的大小并增加它们之间共享的代码量。它还允许你命名特定且离的行为集合——这对于测试能力而非实现非常有用。\n\n####\
  \ 角色与 DOES()\n\n当你将一个角色组合到类中时，当对类及其实例调用 `DOES()` 时，它们将返回真值：\n\n```perl\nsay 'This\
  \ Cat is alive!' if $kitten->DOES('LivingBeing');\n```\n\n**顺序很重要！**\n\n用于将角色应用到类的\
  \ `with` 关键字必须出现在属性声明之后，以便组合过程能够识别任何生成的访问器方法。这是 Moose 实现的一个副作用影响，而不是角色的固有特性。\n\n\
  ### 继承\n\nPerl 的对象系统支持继承，它在两个类之间建立了父子关系，使得子类对其父类进行专门化。子类的行为与其父类相同——它具有相同数量和类型的属性，并可以使用相同的方法。它可能拥有额外的数据和行为，但你可以在代码期望父类的地方替换任何子类实例。在某种意义上，子类提供了父类存在所暗示的角色。\n\
  \n考虑一个 `LightSource` 类，它提供了两个公共属性（`enabled` 和 `candle_power`）和两个方法（`light` 和 `extinguish`）：\n\
  \n```perl\npackage LightSource {\nuse Moose;\n\n  has 'candle_power', is => 'ro',\
  \ isa => 'Int', default => 1;\n  has 'enabled', is => 'ro', isa => 'Bool', default\
  \ => 0, writer => '_set_enabled';\n\n  sub light {\n    my $self = shift;\n    $self->_set_enabled(1);\n\
  \  }\n\n  sub extinguish {\n    my $self = shift;\n    $self->_set_enabled(0);\n\
  \  }\n}\n```\n\n注意 `enabled` 的 writer 选项创建了一个类内部使用的访问器。\n\n#### 继承与属性\n\n`LightSource`\
  \ 的子类可以定义一个亮度是其百倍的工业级蜡烛：\n\n```perl\npackage SuperCandle {\nuse Moose;\n\n  extends\
  \ 'LightSource';\n\n  has '+candle_power', default => 100;\n}\n```\n\n`extends`\
  \ 接收一个类列表作为当前类的父类。如果这是该类中的唯一行，`SuperCandle` 对象的行为将与 `LightSource` 对象相同。`SuperCandle`\
  \ 实例将拥有 `candle_power` 和 `enabled` 属性，以及 `light()` 和 `extinguish()` 方法。\n\n属性名称开头的\
  \ `+`（例如 `candle_power`）表示当前类对该属性进行了特殊处理。在这里，超级烛覆盖了光源的默认值，因此任何新建的 `SuperCandle`\
  \ 都具有 100 个普通蜡烛的光。\n\n当你在 `SuperCandle` 对象上调用 `light()` 或 `extinguish()` 时，Perl\
  \ 会在 `SuperCandle` 类中查找方法。如果子类中没有同名方法，Perl 将查找父类、祖父类，依此类推。在这种情况下，这些方法在 `LightSource`\
  \ 类中。\n\n属性继承的工作原理类似（参见 perldoc Class::MOP）。\n\n#### 方法派发顺序\n\n\n\n\n\nPerl 的分发策略（dispatch\
  \ strategy）控制了 Perl 如何为方法调用选择适当执行的方法。正如你可能从角色（roles）和多态中所观察到的，面向对象（OO）的很大力量来自于方法分发。\n\
  \n方法分发顺序（或方法解析顺序 `MRO`）对于单父类来说是显而易见的：查看对象的类，然后是它的父类，依此类推，直到找到该方法——或用完父类。继承多个父类的类（多重继承），例如同时扩展\
  \ `Boat` 和 `Car` 的 `Hovercraft`，需要更复杂的分发。多重继承的推理非常复杂，因此尽可能避免多重继承。\n\nPerl 使用深度优先的方法解析策略。它在搜索当前类的直接父类的类之前，会递归地搜索第一个命名父类的类以及该父类的所有父类。`mro`\
  \ 编译指令 Pragmas 提供了替代策略，包括 `C3 MRO` 策略，它会在搜索任何父类的父类之前，先搜索给定类的直接父类。\n\n更多细节请参阅 `perldoc\
  \ mro`。\n\n### 继承与方法\n\n与属性一样，子类可以覆盖方法。想象有一个无法熄灭的灯：\n\n```perl\npackage Glowstick\
  \ {\n  use Moose;\n  extends LightSource;\n  sub extinguish {}\n}\n```\n\n在 `glowstick`\
  \ 上调用 `extinguish()` 没有任何作用，尽管 `LightSource` 的方法实际上会执行某些操作。方法分发会找到子类的方法。你可能并非故意这样做。当你确实这样做时，请使用\
  \ Moose 的 `override` 来明确表达你的意图。\n\n在被覆盖的方法内部，Moose 的 `super()` 允许你调用被覆盖的方法：\n\n\
  ```perl\npackage LightSource::Cranky {\n  use Carp;\n  use Moose;\n  extends LightSource;\n\
  \n  override light => sub {\n    my $self = shift;\n    carp \"Can't light a lit\
  \ LightSource!\" if $self->enabled;\n    super();\n  };\n\n  override extinguish\
  \ => sub {\n    my $self = shift;\n    carp \"Can't extinguish unlit LightSource!\"\
  \ unless $self->enabled;\n    super();\n  };\n}\n```\n\n该子类在尝试点亮或熄灭已经处于当前状态的光源时会添加警告。根据标准的\
  \ Perl 方法解析顺序，`super()` 函数分发到最近父类的当前方法的实现。（更多分发选项请参阅 `perldoc Moose::Manual::MethodModifiers`。）\n\
  \n### 继承与 isa()\n\nPerl 的 `isa()` 方法如果调用者是或继承自某个命名类，则返回真。该调用者可以是类名，也可以是对象的实例：\n\n\
  ```perl\nsay 'Looks like a LightSource' if $sconce->isa(LightSource);\nsay 'Hominidae\
  \ do not glow' unless $chimpy->isa(LightSource);\n```\n\n### Moose 和 Perl OO\n\n\
  Moose 提供了 Perl 默认 OO 系统之外的许多功能。尽管你可以自己构建 Moose 提供的所有功能（Blessed References）或通过一系列\
  \ CPAN 分发将其拼凑在一起，但 Moose 是值得使用的。它是一个完整的整体，拥有完善的文档、成熟且专注的开发社区，以及在重要项目中成功使用的历史。\n\n\
  Moose 提供了构造函数、析构函数、访问器和封装。你必须完成声明你想要的工作，作为回报的是安全且な代码。Moose 对象可以扩展并与原生 Perl 系统对象协作。\n\
  \n虽然 Moose 不是 Perl 核心的一部分，但它的流行确保了它在许多操作系统发行版中可用。Strawberry Perl 和 ActivePerl 等\
  \ Perl 分发版也包含了它。尽管 Moose 是 CPAN 模块而非核心库，但它的简洁和简单使其成为现代 Perl 编程必不可少的。\n\nMoose 还允许元编程——通过\
  \ Moose 本身操作你的对象。如果你曾经好奇过类或对象上有哪些可用方法，或者对象支持哪些属性，这些信息是可以获取的：\n\n```perl\nmy $metaclass\
  \ = Monkey::Pants->meta;\nsay 'Monkey::Pants instances have the attributes:';\n\
  say $_->name for $metaclass->get_attributes;\nsay 'Monkey::Pants instances have\
  \ the methods:';\nsay $metaclass->get_methods;\n```\n\n更多信息请参阅 `perldoc MOP`。Moose\
  \ 和 MOP 提供了元编程的可能性——特别是在 `age()` 中缺少 `my $self = shift`。注意这个示例的声明性性质：\n\n```perl\n\
  use MooseX::Declare;\n\nrole Being {\n  requires age;\n};\n\nrole CalculateAge::FromYear\
  \ {\n  has birth_year => (\n    isa => Int,\n    default => sub { localtime(time)[5]\
  \ },\n  );\n  method age {\n    return localtime(time)[5] - $self->birth_year;\n\
  \  }\n};\n\nclass Cat extends Being, CalculateAge::FromYear {\n  has name => (isa\
  \ => Str);\n  has diet => (isa => Array, is => rw);\n};\n```\n\n或者，使用 Moops 允许以下操作：\n\
  \n```perl\nuse Moops;\n\nrole Being {\n  requires age;\n};\n\nrole CalculateAge::FromYear\
  \ {\n  has birth_year => (\n    isa => Int,\n    default => sub { localtime(time)[5]\
  \ },\n  );\n  method age {\n    return localtime(time)[5] - $self->birth_year;\n\
  \  }\n};\n\nclass Cat extends Being, CalculateAge::FromYear {\n  has name => (isa\
  \ => Str);\n  has diet => (isa => Array, is => rw);\n};\n```\n\n| The Svelte |\n\
  | :--- |\n| ![images/aside-icons/tip.png](img/tip.png) | Moose 不是一个小型库，但它非常强大。最流行的替代方案是\
  \ Moo，它是一个更轻量且与 Moose Almost 完全兼容的库。在速度或内存使用成为问题时，许多项目会将部分或全部代码迁移到 Moo。从 Moose 开始；然后看看\
  \ Moo 是否适合你。 |\n\n## 绑定引用 (Blessed References)\n\nPerl 的核心对象系统是刻意极简的。它只有三条规则：\n\n\
  *   类是一个包（package）。\n*   方法是一个函数。\n*   一个（已绑定的）引用（blessed reference）是一个对象。\n\n你可以根据这三条规则构建出任何内容。这种极简主义对于大型项目来说可能是不实用的——特别是通过元编程实现更高层次抽象的可能性（Code\
  \ Generation）是笨拙且有限的。对于超过几百行的现代程序，Moose 是一个更好的选择，尽管许多遗留代码在使用 Perl 默认的 OO。\n\n\n\n\
  \n\n你已经见过前两条规则了。内置函数 `bless` 将类名与引用关联起来。该引用现在变成了一个有效的调用者（invocant）。Perl 将对其执行方法分发。\n\
  \n构造函数是一个创建并 `bless` 引用的方法。按照惯，它们被命名为 `new()`。构造函数几乎总是类方法。\n\n`bless` 两个操作数：一个引用和一个类名，并返回该引用。该引用可以是任何有效引用，无论是否为空。类并不一定非得存在。你甚至可以在构造函数或类之外使用\
  \ `bless`，但在构造函数之外暴露对象构建的细节会违反封装性。一个构造函数可以简单如下：\n\n```perl\nsub new { own    my\
  \ $class = shift;\n    bless {}, $class;\n}\n```\n\n从设计上来说，这个构造函数接收类名作为方法的调用者。你也可以硬编码类名，但是以牺牲灵活性为代价的。参数化构造函数——依赖调用者来确定类名——允许通过继承、委托或导出来实现重用。\n\
  \n所使用的引用类型仅与对象如何存储自身的实例数据有关。它对生成的对象没有其他影响。哈希引用最常见，但你可以 `bless` 任何类型的引用：\n\n```perl\n\
  my $array_obj = bless [], $class;\nmy $scalar_obj = bless $scalar, $class;\nmy $func_obj\
  \ = bless \\&some_func, $class;\n```\n\nMoose 类以声明式方式定义对象属性，但 Perl 默认的面向对象（OO）是非常松散的。一个代表篮球运动员、存储号码和位置的类可能会使用如下构造函数：\n\
  \n```perl\npackage Player {\n    sub new {\n        my ($class, %attrs) = @_;\n\
  \        bless %attrs, $class;\n    }\n}\n```\n\n它可能使用以下内容创建球员：\n\n```perl\nmy $joel\
  \ = Player->new( number => 10, position => 'center' );\nmy $damian = Player->new(\
  \ number => 0, position => 'guard' );\n```\n\n类的方法可以直接作为哈希元素直接访问对象属性：\n\n```perl\n\
  sub format {\n    my $self = shift;\n    return '#' . $self->{number} . ' plays\
  \ ' . $self->{position};\n}\n```\n\n但任何其他代码也可以这样做，因此对对象内部表示的任何更改可能会破坏其他代码。访问器方法（Accessor\
  \ methods）更安全：\n\n```perl\nsub number { return shift->{number} }\nsub position {\
  \ return shift->{position} }\n```\n\n现在你开始自己编写 Moose 免费提供的内容了。此外，Moose 通过自动生成访问器鼓励人们使用访问器而不是直接访问属性。你不会在代码中看到它们。告别诱惑。\n\
  \n### 方法查找与继承\n\n给定一个已 `bless` 的引用，如下形式的方法调用\n\n```perl\nmy $number = $joel->number;\n\
  ```\n\n会查找与已 `bless` 的引用 `$joel` 关联的类——在这种情况下是 `Player`。接下来，Perl 在 `Player` 中查找名为\
  \ `number()` 的函数（记住，Perl 不区分命名空间中的函数和方法）。如果不存在此类函数，且 `Player` 继承了父类，Perl 将在父类中查找（以此类推），直到找到\
  \ `number()`。如果 Perl 找到了 `number()`，它将以 `$joel` 作为调用者调用该方法。你以前在 Moose 中见过这个；这里的工作原理是一样的。\n\
  \n> **保持命名空间整洁**\n> CPAN 模块 `namespace::autoclean` 可以帮助避免导入函数和方法之间的意外冲突。\n\nMoose\
  \ 提供了 `extends` 来跟踪继承关系，但 Perl 使用名为 `@ISA` 的包全局变量。方法分发器查看每个类的 `@ISA` 以查找其父类的名称。如果\
  \ `InjuredPlayer` 继承自 `Player`，你可能会这样写：\n\n```perl\npackage InjuredPlayer {\n  \
  \  @InjuredPlayer::ISA = 'Player';\n}\n```\n\n`parent` 指令更简洁：\n\n```perl\npackage\
  \ InjuredPlayer {\n    use parent 'Player';\n}\n```\n\nMoose 拥有自己的元模型（metamodel）来存储扩展的继承信息。这允许\
  \ Moose 提供额外的元编程机会。你可以继承多个类：\n\n```perl\npackage InjuredPlayer {\n    use parent\
  \ qw( Player );\n}\n```\n\n### AUTOLOAD\n\n如果在调用者所在的类或其任何父类中没有适用方法，Perl 将将查找 `AUTOLOAD()`。在多重继承的情况下，`AUTOLOAD()`\
  \ 可能非常难以理解。\n\n### 方法覆盖与 SUPER\n\n与 Moose 一样，你也可以在基础 OO 中覆盖方法。若要在子类中覆盖父方法，请声明一个同名的方法。在被覆盖的方法内部，使用\
  \ `SUPER::` 提示调用父方法：\n\n```perl\nsub overridden {\n    my $self = shift;\n    warn\
  \ 'Called overridden() in child!';\n    return $self->SUPER::overridden( $@ );\n\
  }\n```\n\n> **SUPER:: 的缺陷**\n> 这是一个误功能（misfeature）：它会分发到编译该覆盖方法时所在包的父类。如果你从另一个包导入了这个方法，Perl\
  \ 会乐呵呵地分发到错误的父类。对向后兼容的追求让这一缺陷保留了下来。CPAN 上的 `SUPER` 模块提供了替代方案。Moose 的 `super()` 则没有相同的问题。\n\
  \n### 处理已 bless 引用的策略\n\n已 `bless` 的引用看起来既简单又困惑。Moose 要易用得多，因此请尽可能使用它。如果你发现自己正在维护使用已\
  \ `bless` 引用的代码，或者你还无法说服你的团队完全使用 Moose，你可以通过一些经验法则来解决已 `bless` 引用的某些问题：\n\n*   不要在同一个类中混合函数和方法。\n\
  *   每个类使用单个 `.pm` 文件，除非该类是一个从单一地方使用的小型、自包含的辅助类。\n*   遵循 Perl 标准，例如将构造函数命名为 `new()`\
  \ 并使用 `$self` 作为调用者名。\n*   广泛使用访问器方法，即使在类的方法内部也是如此。像 `Class::Accessor` 模块有助于避免重复的样板代码。\n\
  *   尽可能避免使用 `AUTOLOAD()`。如果必须使用，使用函数前置声明以避免歧义。\n\n\n\n\n\n* 预见到某人在某地最终需要对你的类进行子类化（或委托或重新实现接口）。通过不假设代码内部的细节、使用\
  \ `bless` 的双参数形式，并将你的类拆分为最小的职责代码单元，来为他们提供便利。\n* 使用如 `Role::Tiny` 等辅助模块以实现更好的使用和重用。\n\
  \n## 反射\n\n反射（reflection）或内省（introspection）是程序在运行时询问自身信息的过程。通过将代码视为数据，你可以像管理数据一样管理代码。这听起来像是一个显而易见的理，但它是现代编程的一个重要洞察。这也是代码生成（Code\
  \ Generation）的原理。\n\nMoose 的 `Class::MOP` (`Class::MOP`) 简化了对象系统的许多反射任务。其他一些 Perl\
  \ 惯也能帮助你检查和操作运行中的程序。\n\n### 检查模块是否加载\n\n如果你知道模块的名称，可以通过查看 `%INC` 哈希表来检查 Perl 是否认为已加载了该模块。当\
  \ Perl 使用 `use` 或 `require` 加载代码时，它会在 `%INC` 中存储一个目，键是要加载模块的文件路径，值是磁盘上该模块的完整路径。换句话说，加载\
  \ `Modern::Perl` 执行了以下操作：\n\n```perl\n| $INC{'Modern/Perl.pm'} = '.../lib/site_perl/5.22.1/Modern/Perl.pm';\
  \ |\n```\n\n路径细节取决于你的安装。要测试 Perl 是否成功加载了某个模块，将模块名转换为规范文件形式，并测试该键在 `%INC` 中是否存在：\n\
  \n```perl\nsub module_loaded {\n    (my $modname = shift) =~ s!::!//g;\n    return\
  \ exists $INC{ $modname . '.pm' };\n}\n```\n\n与 `@INC` 一样，任何地方的代码都可以操作 `%INC`。某些模块（如\
  \ `Test::MockObject` 或 `Test::MockModule`）出于合理的考虑操作 `%INC`。根据你的谨慎程度，你可以自己检查路径和包的预期内容。\n\
  \n`Class::Load` CPAN 模块的 `is_class_loaded()` 函数可以为你完成这一切，而无需让你手动操作 `%INC`。\n\n###\
  \ 检查包是否存在\n\n要检查程序中某处是否存在某个包——如果某处的代码执行了给定名称的包指令——请检查该包是否继承自 `UNIVERSAL`。任何扩展 `UNIVERSAL`\
  \ 的内容必须以某种方式提供 `can()` 方法（无论是通过继承 `UNIVERSAL` 还是重写它）。如果不存在此类包，Perl 将抛出关于无效调用调用者的异常，因此请将此调用封装在\
  \ `eval` 块中：\n\n```perl\nsay \"*$pkg exists*\" if eval { $pkg->can('can') };\n```\n\
  \n另一种方法是遍历 Perl 的符号表。这部分需要你自行处理。\n\n### 检查类是否存在\n\n由于 Perl 对包（package）和类（class）没有强类型区分，在没有\
  \ Moose 的情况下，你能做的最好就是检查预期类名的包是否存在。你可以检查该包是否能 `can()` 提供 `new()`，但无法保证找到的任何 `new()`\
  \ 是方法还是构造函数。\n\n### 检查模块版本号\n\n模块并不非提供版本号，但每个包都从通用父类 `UNIVERSAL` (The UNIVERSAL\
  \ Package) 继承了 `VERSION()` 方法：\n\n```perl\nmy $version = $module->VERSION;\n```\n\
  \n如果已定义，`VERSION()` 返回给定模块的版本号。否则它返回 `undef`。如果模块不存在，该方法同样会返回 `undef`。\n\n### 检查函数是否存在\n\
  \n要检查包中是否存在某个函数，可以将包名作为类方法调用 `can()`：\n\n```perl\nsay \"*$func() exists*\" if $pkg->can(\
  \ $func );\n```\n\n除非 `$pkg` 是一个有效的调用者，否则 Perl 将抛出异常；如果你对其有效性有任何怀疑，请将方法调用封装在 `eval`\
  \ 块中。注意，如果通过 `AUTOLOAD()` (AUTOLOAD) 实现的函数在实现函数的包没有预先声明函数或没有正确重写 `can()`，可能会报告错误的答案。这是另一个包的\
  \ Bug。\n\n使用此技术可以确定模块的 `import()` 是否已将函数导入到当前命名空间：\n\n```perl\nsay \"*$func() imported!\"\
  \ if __PACKAGE__->can( $func );\n```\n\n与检查包的存在一样，如果你有耐心，也可以自己在符号表中进行查找。\n\n###\
  \ 检查方法是否存在\n\n反射没有万无一失的方法来区分函数或方法。\n\n### 在符号表中进行查找\n\n符号表（symbol table）是一种特殊的哈希表，其键是包全局符号的名称，值是类型全局变量（typeglob）。类型全局变量是一种内部数据结构，可以包含标量、数组、哈希、文件句柄或引用。\n\
  \n## 高级 OO Perl\n\n在 Perl 中使用 Moose (Moose) 创建和使用对象很容易的。设计良好的程序并非如此。过度设计一个程序和设计不足的设计一样容易。只有实践经验才能帮助你理解最重要的设计技术，但一些原则可以指导你。\n\
  \n### 优先使用组合而非继承\n\n初学者的 OO 设计往往过度使用继承来重用代码和利用多态。结果是类层次结构过深，职责散落在各处。维护这种代码很困难——谁知道在哪里添加或编辑行为？当一处的代码与另一处的代码冲突时会发生什么？\n\
  \n继承只是 OO 程序员的许多工具之一。它并不总是正确的工具。它通常是错误的工具。`Car` 可以扩展 `Vehicle::Wheeled`（is-a 关系），但\
  \ `Car` 可能包含多个 `Wheel` 对象作为实例属性（has-a 关系）。\n\n将复杂的类拆分为更小、更专注的实体可以提高封装性，并减少任何类做得过多的可能性。更小、更简单且封装更好的实体更容易理解、测试和维护。\n\
  \n### 单一职责原则\n\n设计对象系统时，考虑每个实体的职责。例如，`Employee` 对象可能代表关于个人姓名、联系方式和其他个人数据的特定信息，而\
  \ `Job` 对象可能代表业务职责。按职责分离这些实体，允许 `Employee` 类仅考虑管理与该人是谁相关的信息，而让 `Job` 类代表该人在做什么。（例如，两个\
  \ `Employee` 可能有职位共享安排，或者一个 `Employee` 可能拥有 CFO 和 COO 的 `Jobs`。）\n\n\n\n\n复杂性和重复会增加开发和维护的难度。`DRY`（不要重复）原则提醒我们要寻找并消除系统内部的重复。重复不仅存在代码中，也存在数据中。与其重复配置信息、用户数据以及系统的其他产物，不如为这些信息创建一个单一的规范表示，并从其生成其他产物。\n\
  \n这一原则帮助你找到系统及其数据的最佳表示形式，并减少重复信息不同步的可能性。\n\n### 里斯科夫替换原则\n\n里斯科夫替换原则建议，你应该能够用类的特化版本或角色来替换原始类，而不违反原始类的\
  \ API。换句话说，一个对象在预期的内容方面，应该与它所替换的对象一样通用或更通用；在产生的内容方面，至少要与被替换的对象一样具体。\n\n想象有两个类 `Dessert`\
  \ 及其它的子类 `PecanPie`。如果这些类遵循里斯科夫替换原则，你可以在测试套中将所有对 `Dessert` 对象的使用替换为 `PecanPie` 对象，且所有测试都应该通过。更多细节请参阅\
  \ Reg Braithwaite 的“IS-STRICTLY-EQUIVALENT-TO-A”^([14)。\n\n### 子类型与强制转换\n\n`Moose`\
  \ 允许你声明和使用类型，并通过子类型扩展它们，从而对数据所代表的内容及其行为形成日益专门的描述。这些类型注解有助于验证函数和方法的参数是否正确——或者可以强制转换为适当的数据类型。\n\
  \n例如，你可能希望人们以字符串形式向 `Ledger` 条目提供日期，而在内部将它们表示为 `DateTime` 实例。你可以通过创建一个 `Date` 类型并添加一个从字符串类型的强制转换来实现这一点。更多信息请参阅\
  \ `Moose::Util::TypeConstraints` 和 `MooseX::Types`。\n\n### 不变性\n\n对于设计良好的对象，你告诉它要做什么，而不是怎么做。如果你发现自己在对象外部访问对象实例数据（即使通过访问器方法），那么你对对象内部实现的访问可能过多了。\n\
  \n面向对象的初学者通常将对象视为记录集合，使用方法来获取和设置内部值。这种简单的技术导致了这种遗憾的诱惑：将对象的责任分散到整个系统中。\n\n你可以通过让对象变为不可变来防止不当访问。向它们的构造函数提供必要的数据；然后禁止从类外部对这些信息的任何修改。不要暴露任何修改实例数据的方法——将所有的公共访问器设为只读，并谨慎使用内部属性写入器。一旦你构建了这样一个对象，你就知道它始终处于有效状态。你永远无法通过修改数据使其进入无效状态。\n\
  \n这需要巨大的自律，但由此产生的系统是健壮、可测试且可维护的。某些设计甚至禁止在类内部修改实例数据。\n\n#### 脚注\n\n| [12 | 许多理念来自\
  \ Smalltalk 特性：[`scg.unibe.ch/research/traits`](http://scg.unibe.ch/research/traits)\
  \ |\n| [13 | [`www.modernperlbooks.com/mt/2009/04/the-why-of-perl-roles.html`](http://www.modernperlbooks.com/mt/2009/04/the-why-of-perl-roles.html)\
  \ |\n| [14 | [`weblog.raganwald.com/2008/04/is-strictly-equivalent-to.html`](http://weblog.raganwald.com/2008/04/is-strictly-equivalent-to.html)。\
  \ |\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 8 章：风格与效率\n\n要编写好程序，我们必须在按时完成工作和正确完成工作之间找到平衡。我们必须平衡时间、资源和质量。程序会有\
  \ Bug。程序需要维护和扩展。程序有多个程序员。一个从不交付价值的美丽程序是毫无的，但一个无法维护的糟糕程序是一个注定会发生的风险。\n\n熟练的程序员理解自己的限制条件并编写正确的代码。\n\
  \n要写好 Perl，你必须理解这门语言。你还必须培养对这种语言和程序设计的良好品味。唯一的方法就是实践——不仅是写代码，还要维护和阅读良好的代码。\n\n这条路没有捷径，但确实有路标。\n\
  \n## 编写可维护的 Perl\n\n可维护性是衡量理解和修改程序易用性的模糊标准。写一些代码。六个月后（或六天后）回来。你花费多长时间来发现并修复一个 Bug\
  \ 或添加一个功能？那就是可维护性。\n\n可维护性并不衡量你是否需要查阅内置函数或库函数的语法。它并不衡量一个从未编程过的人会（或不会）读你的代码。假设你正在与一位胜任的程序员交流，她理解你正试图解决的问题。她需要投入多少工作来理解你的代码？她在过程中会遇到什么问题？\n\
  \n要编写可维护的软件，你需要解决真实问题的经验，对你编程语言的惯用法、技术和风格的理解，以及良好的品味。你可以通过专注于几个原则来开发所有这些能力：\n\n\
  - **消除重复**：Bug 潜伏在重复的代码段中——当你修复了某处代码的 Bug 时，你修复其他地方的吗？当你更新一个部分时，你更新了其他部分吗？设计良好的系统很少有重复。它们使用函数、模块、对象和角色将重复代码提取到准确建模域的独立组件中。最好的设计允许你通过删除代码来添加功能。\n\
  - **良好命名实体**：你的代码在讲述一个故事。你为变量、函数、模块、类和角色选择的每一个名称都能让你清晰或模糊化你的意图。仔细选择你的名称。如果你在选择好名称方面遇到困难，你可能需要重新思考你的设计或更详细地研究你的问题。\n\
  - **避免不必要的聪明**：简洁的代码在揭示代码意图时是好的。聪明的代码用花哨的技巧隐藏你的意图。Perl 允许你在正确的时间编写正确的代码。尽可能选择最显而易见的解决方案。经验和良好的品味会引导你。某些问题需要聪明的解决方案。当这种情况发生时，将这些代码封装在简单的接口后面并记录你的聪明之处。\n\
  - **拥抱简单**：在其他条件都相同的情况下，简单的程序比复杂的程序更容易维护。简单意味着知道什么是最重要的并只做这一点。有时你需要强大、健壮的代码。有时你需要一行代码就能解决问题。简单意味着只构建你需要的。这并不是避免错误检查、模块化、验证或安全的借口。简单代码可以使用高级功能。简单代码可以使用\
  \ CPAN 模块——而且是很多。简单代码可能需要花精力去理解。然而，简单代码可以有效地解决问题，而无需额外工作。\n\n## 编写地道的 Perl\n\nPerl\
  \ 大量地借鉴了其他语言。Perl 允许你编写你想编写的代码。C 程序员经常编写 C 风格的 Perl，就像 Java 程序员编写 Java 风格的 Perl，Lisp\
  \ 程序员编写 Lisp 式 Perl 一样。有效的 Perl 程序员通过接受语言的惯用法来编写地道的 Perl：\n\n- **理解社区智慧**：Perl 程序员经常激烈地辩论技术和惯用法。Perl\
  \ 程序员也经常分享他们的工作，不仅是在 CPAN 上。注意；做某事并不总是唯一的方法。有趣的讨论发生在关于各种理想和风格之间的权衡。\n\n\n\n\n\n\
  *   遵循社区规范。Perl 是一个由工具匠组成的社区，他们解决广泛的问题，包括静态代码分析（`Perl::Critic`）、重格式（`Perl::Tidy`）和私有分发系统（`CPAN::Mini`、`Carton`、`Pinto`）。利用\
  \ CPAN 基础设施；遵循 CPAN 的代码编写、文档、打包、测试和分发模型。\n\n*   阅读代码。加入邮件列表，例如 Perl Beginners ([`learn.perl.org/faq/beginners.html`](http://learn.perl.org/faq/beginners.html))\
  \ 并沉浸在社区中。阅读代码并尝试回答问题——即使你从未发布过答案，每天编写代码来解决一个问题也会让你迅速学到海量知识。\n\nCPAN 开发者、Perl 大师们和邮件列表参与者在各种方式解决问题方面积累了宝贵的经验。与他们交流。阅读他们的代码。提问。向他们学习，让他们引导你——并从你身上有所学习。\n\
  \n## 编写有效的 Perl\n\n编写可维护的代码意味着设计可维护的代码。良好的设计源于良好的习惯：\n\n*   编写可测试的代码。编写有效的测试套件（`Testing`）与编写有效代码锻炼的是相同的设计技能。代码本身就是代码。良好的测试还能让你有信心在修改程序的同时保持其运行正常。\n\
  \n*   模块化。强制执行封装和抽象边界。在组件之间找到合适的接口。良好的命名，并将它们放在它们该在的位置。模块化迫使你思考相似之处、差异之处以及你的设计汇合的通信点。找到那些不契合的部分。修改你的设计，直到它们完美契合。\n\
  \n*   遵循合理的编码标准。有效的指南会讨论错误处理、安全、封装、API 设计、项目布局以及可维护代码的其他方面。卓越的指南有助于开发人员通过代码进行交流。如果你看一个新项目并发现没有什么让你惊讶的，那太棒了！你的工作是用代码解决问题。让你的代码以及它周围的基础设施——清晰地表达。\n\
  \n*   利用 CPAN。Perl 程序员解决问题并分享这些解决方案。CPAN 是力量倍增器；先在它上搜索你问题的完整或部分解决方案。投入时间研究以找到你可以重用的完整或部分解决方案。这将会是有回报的。\n\
  \n如果你发现了 Bug，请报告它。如果可能，请修复它。提交一个失败的测试用例。修复拼写错误。请求新功能。说“谢谢！”然后当你准备好了——当你以可用的方式创建新事物或修复旧事物时——分享你的代码。\n\
  \n## 异常\n\n优秀的程序员会预料意外。本该的文件可能不存在。本不该满的巨大磁盘会满。永远不会掉线的网络会停止响应。不可摧毁的数据库会崩溃并吞掉一张表。\n\
  \n意外总会发生。\n\nPerl 通过异常处理异常情况：一种用于抛出和处理错误的动态作用域控制流机制。健壮的软件必须处理这些情况。如果你可以恢复，太棒了！如果不能，请记录相关信息并重试。\n\
  \n### 抛出异常\n\n假设你想写一个日志文件。如果你无法打开文件，说明出了问题。使用 `die` 抛出一个异常（或参见 `The autodie Pragma`）：\n\
  \n```\nsub open_log_file {\n    my $name = shift;\n    open my $fh, '>>', $name\
  \ or die \"Can't open log to $name: $!\";\n    return $fh;\n}\n```\n\n`die()` 将全局变量\
  \ `$@` 设置为操作数，并立即退出当前函数而不返回任何内容。这被称为抛出异常。抛出的异常将继续沿调用栈向上，直到被某些东西捕获。如果没有东西捕获异常，程序将带错误退出。\n\
  \n异常处理使用与本地符号相同的动态作用域。\n\n### 捕获异常\n\n有时允许异常终止程序是有用的。用 `eval` 运行程序可以捕获错误：\n\n```\n\
  eval {\n    open_log_file(\"test.log\");\n};\nif ($@) {\n    print \"Error: $@\"\
  ;\n}\n```\n\n\n\n\n\n现代 Perl 修复了其中的一些问题。虽然这些问题很少发生，但很难诊断。`Try::Tiny` CPAN 分发版提高了异常处理的安全性和语法：\n\
  \n```perl\nuse Try::Tiny;\n\nmy $fh = try { open_log_file('monkeytown.log') }\n\
  \      catch { log_exception( $_ ) };\n```\n\n`try` 替换了 `eval`。可选的 `catch` 块仅在 `try`\
  \ 捕获到异常时执行。`catch` 将捕捉到的异常作为主题变量 `$_` 接收。\n\n### 内置异常\n\nPerl 本身会抛出几种异常情况。`perldoc`\
  \ `perldiag` 列出了若干种“可捕获的致命错误”。某些是 Perl 在编译失败产生的语法错误，但你可以在运行时捕获其他。最有趣的是这些：\n\n* 在锁定的哈希表中使用不允许的键（锁定的哈希表）\n\
  * 对非引用进行祝福（祝福引用）\n* 在无效的调用者上调用方法（Moose）\n* 在调用者上未找到指定名称的方法\n* 以不安全的方式使用污染值（污染）\n\
  * 修改只读值\n* 对引用执行无效操作（引用）\n\n你也可以捕获由 `autodie` 产生的异常（autodie 编译指令）以及任何提升为异常的词法警告（注册你自己的警告）。\n\
  \n## 编译指令 (Pragmas)\n\n大多数 Perl 模块提供新函数或定义类（Moose）。其他模块，如 `strict` 或 `warnings`\
  \ 则影响语言本身的行为。这种第二类型的模块被称为编译指令（pragma）。按照惯，编译指令名称使用小写，以与其他模块区分开来。\n\n### 编译指令与作用域\n\
  \n编译指令通过将特定的行为或信息导出到调用者的词法作用域来工作。你已经见过声明词法变量如何让符号名称在作用域内可用。使用编译指令也会使其行为在作用域内生效：\n\
  \n```perl\n{\n  # $lexical 不可见；strict 尚未生效\n  {\n    use strict;\n    my $lexical\
  \ = 'available here';\n    # $lexical 可见；strict 已生效\n  }\n  # $lexical 再次不可见；strict\
  \ 未生效\n}\n```\n\n正如词法声明影响内部作用域一样，编译指令也会在内部作用域内保持其效果：\n\n```perl\n# 文件作用域\nuse strict;\n\
  {\n  # 内部作用域，但 strict 有效\n  my $inner = 'another lexical';\n}\n```\n\n### 使用编译指令\n\
  \n像使用任何其他模块一样使用编译指令。编译指令可以接受参数，例如要使用的最小版本号或更改行为的参数列表：\n\n```perl\n# 要求变量声明，禁止裸字\n\
  use strict qw( subs vars );\n\n# 依赖 2014 年书籍的语义\nuse Modern::Perl '2014';\n```\n\
  \n有时你需要在更深层的嵌套词法作用域内禁用这些效果的全部。内置的 `no` 执行取消导入（导入），这会反转良好编译指令的部分或全部效果。例如，当需要执行某些符号操作时，如何禁用\
  \ `strict` 的保护：\n\n```perl\nuse Modern::Perl; # 或 use strict;\n{\n  no strict 'refs';\n\
  \  # 在此处操作符号表\n}\n```\n\n### 有用的编译指令\n\nPerl 包含了几个常用的核心编译指令：\n\n* `strict` 编译指令启用对符号引用、裸字使用和变量声明的编译器检查。\n\
  * `warnings` 编译指令启用对过时、意外和笨拙行为的可选警告。\n* `utf8` 编译指令告诉 Perl 解析器使用 UTF-8 编码理解当前文件的源代码。\n\
  * `autodie` 编译指令启用对系统调用和内置函数的自动错误检查。\n* `constant` 编译指令允许你创建编译时常量值（但请参 CPAN 的 `Const::Fast`\
  \ 作为替代方案）。\n* `vars` 编译指令允许你声明包全局变量，例如 `$VERSION` 或 `@ISA`（祝福引用）。\n* `feature` 编译指令允许你单独启用或禁用\
  \ Perl 的新特性。`use 5.18;` 启用所有 Perl 5.18 特性和 `strict` 编译指令，而 `use feature ':5.18';`\
  \ 执行相同的操作。该指令在词法作用域内禁用单个特性更有用。\n* `experimental` 编译指令启用或禁用实验性特性，如函数签名或后缀引用。\n* `less`\
  \ 编译指令演示了如何编写编译指令。\n\n正如你从 `less` 中猜的那样，你可以用纯 Perl 编写自己的词法编译指令。`perldoc perlpragma`\
  \ 解释了如何这样做，而 `perldoc perlvar` 中 `^H` 的解释说明了该特性是如何工作的。\n\nCPAN 开始收集非核心编译指令：\n\n\
  * `autovivification` 禁用自动生长（自动生长）。\n* `indirect` 防止使用间接调用（间接对象）。\n* `autobox` 为\
  \ Perl 的核心类型（标量、引用、数组和哈希）启用对象行为。\n* `perl5i` 将许多实验性语言扩展合并并启用为一个贯的整体。\n\n这些工具尚未广泛使用，但它们有自己的支持者。`autovivification`\
  \ 和 `indirect` 可以帮助你编写更正确的代码。`autobox` 和 `perl5i`是对 Perl 未来可能变成样子的实验；它们在小型项目中值得尝试。\n\
  \n#### 脚脚\n\n| [[15]](#f_0070.html_FNPTR-15) | [`www.perl.org/community.html`](http://www.perl.org/community.html)\
  \ |\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 9 章：管理真实程序\n\n你可以通过编写小型程序来解决示例问题，从而从书中学习很多语法。编写良好的代码来解决真实问题需要更多的纪律和理解。你必须学习管理代码。你怎么知道它是有效的？你如何组织它？什么让它面对错误时保持健壮？什么让代码整洁？清晰？可维护？\n\
  \n现代 Perl 帮助你回答所有问题。\n\n## 测试\n\n你已经测试过你的代码了。\n\n如果你运行过它，注意到某些地方不对，进行了更改然后再次运行，你就测试过你的代码。测试是验证软件行为符合预期的过程。有效的测试自动化了这一过程。与其依靠人类完美地执行重复的手动检查，不如让计算机来。\n\
  \nPerl 的工具帮助你编写正确的测试。\n\n### Test::More\n\n测试的基本单元是测试断言。每个测试断言都是一个有“是”或“否”答案的简单问题：代码的行为是否符合我的预期？程序中可以测试的任何条件（最终）都可以变成一个或多个断言。一个复杂的程序可能有数千个单独条件。这没关系。这是可测试的。将特定行为隔离到单个断言中可以帮助你调试编码错误和理解错误，并让你的代码和测试更容易维护。\n\
  \nPerl 测试始于核心模块 `Test::More` 及其 `ok()` 函数。`ok()` 接收两个参数，一个布尔值和一个描述测试目的的字符串：\n\n\
  ```perl\nok 1, 'the number one should be true';\nok 0, '... and zero should not';\n\
  ok '', 'the empty string should be false';\nok '!', '... and a non-empty string\
  \ should not';\n\ndone_testing();\n```\n\n\n\n\n`done_testing()` 函数告诉 `Test::More`\
  \ 程序已经执行了你预期要运行的所有断言。如果程序意外退出（由于未捕获的异常、调用了 `exit` 或其他原因），测试框架将通知你发生了错误。如果没有像 `done_testing()`\
  \ 这样的机制，你如何知道呢？虽然这个示例代码简单到不会失败，但过于简单而不会失败的代码失败频率比你想象的要高得多。\n\n`Test::More` 允许一个可选的测试计划来统计你计划运行的单个断言的数量：\n\
  \n| ​  | `use` `Test::More` tests => 4;` |\n| ​  |  |\n| ​  | ok 1, `'the number\
  \ one should be true'`; |\n| ​  | ok 0, `'... and zero should not'`; |\n| ​  | ok\
  \ `''`, `'the empty string should be false'`; |\n| ​  | ok `'!'`, `'... and a non-empty\
  \ string should not'`; |\n\n`Test::More` 的 `tests` 参数设置了程序的测试计划。这是一个安全网。如果运行的测试少于四个，说明发生了错误。如果运行的测试多于四个，说明发生了错误。`done_testing()`\
  \ 更简单，但有时精确的计数很有用（例如当你想控制循环中断言的数量时）。\n\n### 运行测试\n\n这个示例测试文件是一个完整的 Perl 程序，产生所示的输出：\n\
  \n| ​  | ok 1 - the number one should be true |\n| ​  | not ok 2 - ... and zero\
  \ should not |\n| ​  | # Failed test '... and zero should not' |\n| ​  | # at truth_values.t\
  \ line 4. |\n| ​  | not ok 3 - the empty string should be false |\n| ​  | # Failed\
  \ test 'the empty string should be false' |\n| ​  | # at truth_values.t line 5.\
  \ |\n| ​  | ok 4 - ... and a non-empty string should not |\n| ​  | 1..4 |\n| ​ \
  \ | # Looks like you failed 2 tests of 4. |\n\n此输出使用了一种名为 `TAP`（Test Anything Protocol，任何测试协议）的测试输出格式。失败的\
  \ `TAP` 测试会产生用于调试的诊断信息。\n\n这个程序很容易读，但它只有四个断言。真实的程序可能有数千个断言。核心模块程序 `prove`——基于核心模块\
  \ `TAP::Harness` 构建——会运行测试、解释 `TAP` 并只显示最相关的信息：\n\n| ​  | `$prove truth_values.t`\
  \ |\n| ​  | truth_values.t .. 1/? |\n| ​  | # Failed test '... and zero should not'\
  \ |\n| ​  | # at truth_values.t line 4. |\n| ​  |  |\n| ​  | # Failed test 'the\
  \ empty string should be false' |\n| ​  | # at truth_values.t line 5. |\n| ​  |\
  \ # Looks like you failed 2 tests of 4. |\n| ​  | truth_values.t .. Dubious, test\
  \ returned 2 (wstat 512, 0x200) |\n| ​  | Failed 2/4 subtests |\n| ​  |  |\n| ​ \
  \ | Test Summary Report |\n| ​  | ------------------- |\n| ​  | truth_values.t (Wstat:\
  \ 512 Tests: 4 Failed: 2) |\n| ​  | Failed tests: 2-3 |\n\n对于显示显而易见的内容，这些输出太多了：第二个和第三个测试失败是因为\
  \ 0 和空字符串为假。幸运的是，很容易修复这些失败的测试：\n\n| ​  | ok ! 0, `'... and zero should not'`; |\n\
  | ​  | ok !''`, `'the empty string should be false'`; |\n\n通过这两个更改后，`prove` 现在显示以下内容：\n\
  \n| ​  | `$prove truth_values.t` |\n| ​  | truth_values.t .. ok |\n| ​  | All tests\
  \ successful. |\n\n查看 `perldoc prove` 获取其他测试选项，例如并行运行测试 (`-j`)、自动将相对目录 `lib/` 添加到\
  \ Perl 的包含路径中 (`-l`)、递归运行找到 `t/` 下的所有测试文件 (`-r t`) 以及优先运行缓慢测试 (`--state=slow,save`)。\n\
  \nBash Shell 别名 `proveall` 结合了许多选项：\n\n| ​  | alias proveall='prove -j9 --state=slow,save\
  \ -lr t'` |\n\n### 更好的比较\n\n尽管所有自动化测试的核心是布尔条件“这是真还是假？”，但将一切简化为该布尔条件是枯燥的且会产生尴尬的诊断。`Test::More`\
  \ 提供了其他方便的断言函数。\n\n`is()` 函数使用 Perl 的 `eq` 运算符比较两个值。如果值相等，则测试通过。`isnt()` 函数使用 Perl\
  \ 的 `==` 运算符比较两个值。如果值不等，则测试通过。\n\n`isok()` 函数使用 Perl 的 `==` 运算符比较两个值。如果值相等，则测试通过。`isne()`\
  \ 函数使用 Perl 的 `ne` 运算符比较两个值。如果值不等，则测试通过。\n\n`like()` 函数使用 Perl 的 `~` 运算符比较两个值。如果值匹配，则测试通过。`nlike()`\
  \ 函数使用 Perl 的 `!~` 运算符比较两个值。如果值不匹配，则测试通过。\n\n`match()` 函数使用 Perl 的 `==` 运算符比较两个值。如果值匹配，则测试通过。`nmatch()`\
  \ 函数使用 Perl 的 `!==` 运算符比较两个值。如果值不匹配，则测试通过。\n\n`is_()` 函数使用 Perl 的 `==` 运算符比较两个值。如果值相等，则测试通过。`n_()`\
  \ 函数使用 Perl 的 `!==` 运算符比较两个值。如果值不匹配，则测试通过。\n\n`cmp()` 函数使用 Perl 的 `cmp` 运算符比较两个值。如果值匹配，则测试通过。`ncmp()`\
  \ 函数使用 Perl 的 `!cmp` 运算符比较两个值。如果值不匹配，则测试通过。\n\n`ok()` 函数检查表达式为真。如果表达式为真，则测试通过。`nok()`\
  \ 函数检查表达式为假。如果表达式为假，则测试通过。\n\n```\n此输出使用了一种名为 TAP（任何测试协议）的测试输出格式。失败的 TAP 测试产生用于调试的诊断信息。\n\
  \n这个程序很容易读，但它只有四个断言。真实的程序可能有数千个断言。大多数情况下，你想要知道的是全部通过了，还是任何失败的具体细节。核心模块程序 `prove`——基于核心模块\
  \ `TAP::Harness` 构建——会运行测试、解释 `TAP` 并只显示最相关的信息：\n\n```\n$prove truth_values.t\n\
  truth_values.t .. 1/?\n# Failed test '... and zero should not'\n# at truth_values.t\
  \ line 4.\n# Failed test 'the empty string should be false'\n# at truth_values.t\
  \ line 5.\n# Looks like you failed 2 tests of 4.\ntruth_values.t .. Dubious, test\
  \ returned 2 (wstat 512, 0x200)\nFailed 2/4 subtests\n\nTest Summary Report\n-------------------\n\
  truth_values.t (Wstat: 512 Tests: 4 Failed: 2)\nFailed tests: 2-3\n```\n\n对于显示显而易见的内容，这些输出太多了：第二个和第三个测试失败是因为\
  \ 0 和空字符串为假。幸运的是，很容易修复这些失败的测试：\n\n```\nok ! 0, '... and zero should not';\nok !'',\
  \ 'the empty string should be false';\n```\n\n通过这两个更改后，`prove` 现在显示以下内容：\n\n```\n\
  $prove truth_values.t\ntruth_values.t .. ok\nAll tests successful.\n```\n\n查看 `perldoc\
  \ prove` 获取其他测试选项，例如并行运行测试 (`-j`)、自动将相对目录 `lib/` 添加到 Perl 的包含路径中 (`-l`)、递归运行找到 `t/`\
  \ 下的所有测试文件 (`-r t`) 以及优先运行缓慢测试 (`--state=slow,save`)。\n\nBash Shell 别名 `proveall`\
  \ 结合了许多选项：\n\n```bash\nalias proveall='prove -j9 --state=slow,save -lr t'\n```\n\
  \n\n\n\n\n混合方法是最灵活的；一个测试可以验证你的所有模块是否已编译，而其他测试则证明每个模块的行为都符合预期。随着项目的增长，第二种方法会更容易管理。保持测试文件短小且专注，这样它们会更容易维护。\n\
  \n分离的测试文件也可以加速开发。如果你正在为你的 RobotMonkey 增加喷火功能，你可能只想运行 `t/robot_monkey/breathe_fire.t`\
  \ 测试文件。如果该功能运行符合你的预期，请运行整个测试套件以验证本地更改没有产生意外之外的全局影响。\n\n## 其他测试模块\n\n`Test::More`\
  \ 依赖于名为 `Test::Builder` 的测试后端，该后端管理测试计划并将测试输出协调为 TAP。这种设计允许多个测试模块共享同一个 `Test::Builder`\
  \ 后端。因此，CPAN 有数百个测试模块可用——而且它们可以在同一个程序中共同工作：\n\n* `Test::Fatal` 帮助测试你的代码是否恰当地抛出（以及没有抛出）异常。你可能还会遇到\
  \ `Test::Exception`。\n* `Test::MockObject` 和 `Test::MockModule` 允许你通过模拟（模拟行为以产生受控结果）来测试困难接口。\n\
  * `Test::WWW::Mechanize` 帮助测试 Web 应用，而 `Plack::Test`、`Plack::Test::Agent` 以及子类 `Test::WWW::Mechanize::PSGI`\
  \ 可以在不使用外部实时 Web 服务器的情况下。\n* `Test::Database` 提供测试数据库使用和滥用的函数。`DBICx::TestDatabase`\
  \ 帮助测试用 `DBIx::Class` 构建的模式。\n* `Test::Class` 提供组织测试套件的替代机制。它允许你创建类，并在特定方法中对测试分组。你可以像代码类互相继承一样从测试类继承。这是减少测试套件重复的极佳方法。请参考\
  \ Curtis Poe 优秀的 `Test::Class` 系列。较新的 `Test::Routine` 分发通过使用 `Moose` 提供了类似的可能性。\n\
  * `Test::Differences` 测试字符串和数据结构的相等性，并在诊断中显示任何差异。`Test::LongString` 添加了类似的断言。\n\
  * `Test::Deep` 测试嵌套数据结构的等效性。\n* `Devel::Cover` 分析你的测试套件的执行情况，报告你的测试实际执行了多少代码。通常情况下，覆盖率越高越好——尽管\
  \ 100% 的覆盖并不总是可能的，但 95% 远好于 80%。\n* `Test::Most` 将几个实用的测试模块收集到一个父模块中。它节省了时间和精力。\n\
  \n有关 Perl 测试的更多信息，请参见 Perl QA 项目。\n\n## 处理警告\n\n虽然编写工作的 Perl 程序有多种方法，但其中某些方法可能会令人困惑、不清晰甚至可能是错误的。Perl\
  \ 的警告系统可以帮助你避免这些情况。\n\n### 产生警告\n\n使用内置的 `warn` 输出警告：\n\n```\nwarn 'Something went\
  \ wrong!';\n```\n\n`warn` 向 `STDERR` 文件句柄打印值列表。除非列表的最后一个元素没有以换行符结尾，否则 Perl 会附加 `warn`\
  \ 调用的文件名和行号。\n\n核心模块 `Carp` 扩展了 Perl 的警告机制。它的 `carp()` 函数从调用代码的角度报告警告。给定这样一个函数：\n\
  \n```perl\nuse Carp 'carp';\n\nsub only_two_arguments {\n    my ($lop, $rop) = @_;\n\
  \    carp('Too many arguments provided') if @_ > 2;\n    ...\n}\n```\n\n`arity`\
  \ 警告将包含调用代码的文件名和行号，而不是 `only_two_arguments()`。`Carp` 的 `cluck()` 类似，但它会产生导致当前函数的所有函数调用回溯。\n\
  \n`Carp` 的详细模式为整个程序中通过 `carp()` 和 `croak()` 产生的所有警告添加回溯：\n\n```bash\nperl -MCarp=verbose\
  \ my_prog.pl\n```\n\n在编写模块时，使用 `Carp` 而不是 `warn` 或 `die`。\n\n| 注入 Carp |\n| ---\
  \ |\n| 有时你必须调试没有使用 `carp()` 或 `cluck()` 编写的代码。在这种情况下，使用 `Carp::Always` 模块为所有 `warn`\
  \ 或 `die` 调用添加回溯：`perl -MCarp::Always some_program.pl` |\n\n## 启用和禁用警告\n\n古老的 `-w`\
  \ 命令行标志会在整个程序启用警告，即使是在其他人编写和维护的外部模块中也是如此。它是全有全无的——如果你有时间和精力消除整个代码库中的警告和潜在警告，它可以对你有所帮助。多年来，这是在\
  \ Perl 程序中启用警告的唯一方法。\n\n现代方法是使用 `warnings` 属性（或类似的 `use Modern::Perl;`）。这在词法作用域内启用警告。\n\
  \n| 全局警告 |\n| --- |\n| `-X` 标志在整个程序启用警告。两者都不常见。 | `-w`、`-W` 和 `-X` 影响全局变量 `$^W`\
  \ 的值。 |\n\n### 禁用警告类别\n\n使用带有参数列表的 `no warnings` 在作用域内禁用选择性警告。省略参数列表将禁用该范围内的所有警告。\n\
  \n`perldoc perlwarn` 列出了你版本理解的所有警告类别。其中大多数代表了真正感兴趣的情况，但某些情况在你的特定情况下可能实际上没有帮助。例如，当\
  \ Perl 检测到一个函数自调用超过了一百次时，会发生递归警告。如果你对自己编写递归终止条件有信心，你可以在递归的作用范围内禁用此警告——尽管尾调用可能更好。\n\
  \n如果你正在生成代码或本地重新定义符号，你可能希望禁用重定义警告。\n\n一些经验丰富的 Perl 黑客会在处理来自多个源的拼接值的字符串处理代码中禁用未初始化值警告。如果你对初始化变量非常小心，你可能永远不需要禁用此警告，但有时警告会阻碍编写简洁的代码。\n\
  \n### 使警告变为致命\n\n如果你的项目认为警告和错误一样繁琐，你可以让它们变成致命的（fatal）。以下是在词法作用域内将所有警告提升为异常的方法：\n\
  \n```perl\nuse warnings FATAL => 'all';\n```\n\n你也可以让特定类别的警告变为致命，例如使用过弃的结构：\n\n\
  ```perl\nuse warnings FATAL => 'deprecated';\n```\n\n通过良好的自律，可以产生非常健壮的代码——但要小心。许多警告来自\
  \ Perl 只有在代码运行时才能检测的情况。如果你的测试套件未能识别你可能遇到的的所有警告，将这些警告致命化会导致程序崩溃。新版本的 Perl 经常添加新警告。在没有经过仔细测试的情况下升级到新版本可能会导致新的异常。此外，你或你使用的库的任何自定义警告也将是致命的。\n\
  \n\n\n\n\n如果你启用了致命警告（fatal warnings），请仅在你控制的代码中这样做，千万不要在你期望他人使用的库代码中这样做。\n\n###\
  \ 捕获警告\n\n如果你愿意付出，可以像捕获异常一样捕获警告。`%SIG` 变量（参见 perldoc perlvar）包含了对 Perl 或操作系统引发的带外信号的处理器。通过将函数引用赋值给\
  \ `$SIG{__WARN__}` 来捕获警告：\n\n```perl\n{\n  my $warning;\n  local $SIG{__WARN__}\
  \ = sub { $warning .= shift };\n  # 执行某些危险操作\n  ...\n  say \"Caught warning:\\n$warning\"\
  \ if $warning;\n}\n```\n\n在警告处理程序内部，第一个参数是警告信息。诚然，这种技术不如在词域内禁用警告有用——但它可以在测试模块（如\
  \ CPAN 中的 `Test::Warnings`）中大有用场，在这些模块中警告的实际文本非常重要。\n\n`%SIG` 是一个全局变量，因此请在尽可能小的范围内对其进行局部化。\n\
  \n### 注册你自己的警告\n\n`warnings::register` 预指令允许你创建自定义警告，用户可以在词域内启用或禁用这些警告。在模块中，使用该预指令：\n\
  \n```perl\npackage Scary::Monkey;\nuse warnings::register;\n```\n\n这将创建一个以包 `Scary::Monkey`\
  \ 命名的新警告类别。使用 `use warnings 'Scary::Monkey'` 启用这些警告，使用 `no warnings 'Scary::Monkey'`\
  \ 禁用它们。\n\n使用 `warnings::enabled()` 测试调用者的词域是否已启用了某个警告类别。使用 `warnings::warnif()`\
  \ 仅在警告生效时产生警告。例如，要在弃用（deprecated）类别中产生警告，可以写：\n\n```perl\npackage Scary::Monkey;\n\
  use warnings::register;\nsub import {\n  warnings::warnif( 'deprecated',\n    'empty\
  \ imports from ' . __PACKAGE__ . ' are now deprecated' ) unless @_;\n}\n```\n\n\
  更多细节参见 perldoc perllexwarn。\n\n## 文件\n\n大多数程序主要通过读取、写入和其他操作文件来与现实世界交互。Perl 最初是作为系统管理员的工具，现在仍然是一种非常适合文本处理的语言。\n\
  \n### 输入与输出\n\n文件句柄（filehandle）代表一个特定输入输出通道的当前状态。每个 Perl 程序启动时都有三个标准文件句柄：`STDIN`（程序的输入）、`STDOUT`（程序的输出）和\
  \ `STDERR`（程序的错误输出）。默认情况下，你打印或 `say` 的所有内容都会进入 `STDOUT`，而错误和警告会进入 `STDERR`。这种输出分离允许你将输出输出和错误重定向到两个不同的地方——例如输出文件和错误日志。\n\
  \n使用 `open` 内置函数初始化文件句柄。要打开文件进行读取，使用：\n\n```perl\nopen my $fh, '<', 'filename' or\
  \ die \"Cannot read $filename: $!\";\n```\n\n第一个操作数是一个包含文件句柄的变量。第二个操作数是文件模式，决定了文件操作类型（读取、写入、追加等）。最后一个操作数是要操作的文件名。如果\
  \ `open` 失败，`die` 子句将抛出一个异常，失败原因存储在 `$!` 魔法变量中。\n\n你可以以写入、追加、读读写等模式打开文件。以下是一些是最重要的文件模式：\n\
  \n* `<` 以读取模式打开文件\n* `>` 以写入模式打开文件，如果文件存在则覆盖现有内容，否则创建新文件\n* `>>` 以写入模式打开文件，追加到任何现有内容之后，否则创建新文件\n\
  * `+<` 以读写混合模式打开文件\n* `-|` 打开一个指向外部进程的管道用于读取\n* `|-` 打开一个指向外部进程的管道用于写入\n\n你也可以使用任何现有的文件模式创建从读取或写入到普通\
  \ Perl 标量（scalars）的文件句柄：\n\n```perl\nopen my $read_fh, '<', $fake_input;\nopen my\
  \ $write_fh, '>', $captured_output;\ndo_something_awesome($read_fh, $write_fh);\n\
  ```\n\nperldoc perlopentut 详细解释了 `open` 的更多奇用法，包括它启动和控制其他进程的能力，以及使用 `sysopen` 对输入输出进行更细粒度的控制。perldoc\
  \ perlfaq5 包含了许多常用 IO 任务的代码。\n\n#### 还记得 autodie 吗？\n\n假设本节示例使用了 `autodie`；如果你选择不使用，请妥善处理错误。\n\
  \n#### Unicode、IO 层与文件模式\n\n除了文件模式，你还可以添加编码层（encoding layer），这允许 Perl 对 Unicode\
  \ 进行编码或解码。例如，要以 UTF-8 读取文件，使用：\n\n```perl\nopen my $fh, '<:UTF-8', $infile;\n```\n\
  \n或使用 UTF-8 写入文件，使用：\n\n```perl\nopen my $fh, '>:UTF-8', $outfile;\n```\n\n####\
  \ 双参数 open\n\n旧代码经常使用 `open` 的双参数形式，将文件模式与文件名挤在一起：\n\n```perl\nopen my $fh, \">$file\"\
  \ or die \"Cannot write $file: $!\";\n```\n\nPerl 必须从文件名中提取文件模式。这存在风险；只要 `$file`\
  \ 来自不可信输入。三参数的 `open()` 更安全。\n\n#### DATA 的多种名称\n\n特殊包全局变量 `DATA` 文件句柄代表当前的源代码文件。当\
  \ Perl 完成文件编译时，如果该文件包含 `__DATA__` 或 `__END__` 部分，它会保持 `DATA` 开启状态，并指向编译单元的末尾。如果你使用\
  \ `seek` 回滚文件句柄，则该标记之后的任何文本都是可读的。这对于短且自包含的程序很有用。\n\n#### 从文件读取\n\n给定一个为输入打开的文件句柄，使用\
  \ `readline` 内置函数（也写为 `<>`）从其读取。一种惯用法是在 `while()` 循环中一次读取一行：\n\n```perl\nopen my\
  \ $fh, '<', 'some_file';\nwhile (<fh>) {\n  chomp;\n  say $_;\n}\n```\n\n在标量上下文中，`readline`\
  \ 读取文件的一行并返回它；如果到达文件末尾则返回 `undef`（使用 `eof` 内置函数测试该条件）。示例中的每次迭代返回下一行或 `undef`。这种\
  \ `while` 惯用法显式检查用于迭代的变量，因此只有文件结束条件会结束循环。这种惯用法等同于以下代码：\n\n```perl\nopen my $fh,\
  \ '<', 'some_file';\nwhile (defined($_ = <fh>)) {\n  chomp;\n  say $_;\n  last if\
  \ eof $fh;\n}\n```\n\n#### 为什么用 while 而不是 for?\n\n`for` 对其操作数施加列表上下文。在列表上下文中，`readline`\
  \ 会在处理任何内容之前读取整个文件。`while` 执行迭代并一次读取一行。当考虑内存使用时，请使用 `while`。\n\n\n\n\n\n从 `readline`\
  \ 读取的每一行都包含标记行结束的字符或字符。在大多数情况下，这是一个特定平台的序列，由换行符（`\\n`）、回车符（`\\r`）或两者的组合（`\\r\\n`）组成。使用\
  \ `chomp`将其移除。\n\n在 Perl 中逐行读取文件的最方法如下：\n\n```perl\nopen my $fh, '<', $filename;\n\
  while (my $line = <$fh>) {\n    chomp $line;\n    ...\n}\n```\n\nPerl 假设文件包含文本。如果你正在读取二进制数据——例如媒体文件或压缩文件——请在执行任何\
  \ I/O 操作之前使用 `binmode`。这将强制 Perl 将文件数据视为纯数据，而不会对其进行任何修改（例如不会将 `\\n` 转换为特定平台的换行符序列）。虽然\
  \ Unix 类平台可能并不总是需要 `binmode`，但可移植的程序会采取稳妥的做法（Unicode and Strings）。\n\n### 写入文件\n\
  \n对于给定一个已打开用于输出的文件句柄，使用 `print` 或 `say` 写入文件：\n\n```perl\nopen my $out_fh, '>',\
  \ 'output_file.txt';\nprint $out_fh \"Here's a line of text\\n\";\nsay $out_fh \"\
  ... and here's another\";\n```\n\n注意文件句柄与下一个操作数之间缺少逗号。\n\n| 文件句柄歧义消除 |\n| --- |\n\
