  \ CPAN 获取。有效的 Perl 程序员会充分利用他们拥有的选项。\n\n## 有用的核心模块\n\nPerl 的语言设计过程一直尝试结合实用性与扩展性。Perl\
  \ 5 扩展了语言并使 CPAN 可能，但它仍然保留了对 1987 年编写的大部分 Perl 1 代码的后兼容性。\n\n2015 年的最佳代码与 1994 年的最佳\
  \ Perl 代码或 1987 年的最佳 Perl 代码非常不同，这部分归功于其核心库。\n\n### strict 指令\n\n`strict` 指令（Pragmas）允许你禁止（或重新启用）各种可能意外滥用的强大语言结构。\n\
  \n`strict` 禁止符号引用，要求变量声明（词法作用域）并禁止使用未定义的裸词（Barewords）。\n\n\n\n\n强制变量声明有助于检测变量名中的拼写错误，并鼓励对词法变量进行适当的作用域划分。如果所有变量都有\
  \ `my` 或 `our` 声明，就能更容易看出词法变量的预期作用范围。\n\n`strict` 在词法作用域内生效。更多详情请参阅 `perldoc strict`。\n\
  \n### warnings 指令（Pragma）\n\n`warnings` 指令（Handling 警告）控制各种警告类的报告，例如尝试将 `undef`\
  \ 值字符串化，或对值使用错误类型的运算符。它还会对使用已弃的功能发出警告。\n\n最有用的警告是解释了 Perl 在理解你的意图时遇到了困难，并对适当的解释进行了猜测。尽管\
  \ Perl 经常能猜测正确，但由你来消除歧义可以确保程序运行正确。\n\n`warnings` 指令在词法作用域内生效。更多详情请参阅 `perldoc perllexwarn`\
  \ 和 `perldoc warnings`。\n\n| 寻求更多帮助 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | 如果你同时使用 `warnings` 和诊断信息，你将为程序中存在的每个警告获取扩展的诊断信息，这些信息直接来自 `perldoc perldiag`。这在学习\
  \ Perl 时非常有帮助，但在部署程序之前，务必禁用诊断信息，以免填满日志或向用户暴露调试信息。 |\n\n### autodie 指令（Pragma）\n\n\
  Perl 将错误处理（或忽略错误）交由你决定。例如，如果你忘记检查每个 `open()` 调用的返回值，你可能会尝试从已关闭的文件句柄读取——更糟糕，在尝试写入时丢失数据。`autodie`\
  \ 指令为你改变了这一点。如果你写：\n\n```perl\nuse autodie;\nopen my $fh, ''>', $file;\n```\n\n\
  失败的 `open()` 调用将抛出一个异常。鉴系统调用失败的最佳方法是抛出异常，此指令可以消除大量的模板代码，让你放心地知道没有检查返回值。\n\n`autodie`\
  \ 的一个注意的是，当你只需要精细的小锤时，它可能像一把大铁锤；如果你只需要检查几个系统调用，可以相应地限制它的导入。更多信息请参阅 `perldoc autodie`。\n\
  \n### Perl 版本号\n\n如果你遇到一段 Perl 代码，但不知道它是何时编写或由谁编写，你能判断它需要哪个版本的 Perl 吗？如果你在 Perl\
  \ 5.10 发布前后都有丰富的 Perl 经验，你可能记得哪个版本增加了 `say`，以及 `autodie` 何时进入核心库。否则，你可能不得不猜测、遍历\
  \ `perldelta` 文件，或使用 CPAN 中的 `CPAN::MinimumVersion`。\n\n你并不需要在编写的所有新代码中添加最低所需的 Perl\
  \ 版本号，但这可以明确你的意图。例如，如果你在 Perl 5.18 下测试了代码，并且只使用了 Perl 5.18 中存在的功能，可以写：\n\n```perl\n\
  use 5.018;\n```\n\n这样你就记录了你的意图。也将让工具更容易识别你可能在代码中使用或可能不使用的特定 Perl 特性。如果以后有人证明该代码在\
  \ Perl 5.14 上也能运行良好，你可以更改版本号——而且这种更改是基于实际证据的。\n\n## 接下来做什么？\n\n尽管 Perl 包含了大量的核心库，但它并不是完备的。许多优秀的模块可以在核心库之外获得，来自\
  \ CPAN (The CPAN)。`Task::Kensho` 元发行包含几个其他代表 CPAN 顶尖水平的发行版。当你需要解决问题时，先看那里。\n\nCPAN\
  \ 还有许多其他宝石。例如，如果你想：\n\n* 通过 SQL 访问数据库，使用 `DBI` 模块。\n* 嵌入轻量级单文件数据库，使用 `DBD::SQLite`\
  \ 模块。\n* 管理数据库模式，使用 `Sqitch`。\n* 将数据库实体表示为对象，使用 `DBIx::Class`。\n* 进行基础 Web 编程，使用\
  \ `Plack`。\n* 使用强大的 Web 框架，使用 `Mojolicious`、`Dancer` 或 `Catalyst`。\n* 处理结构化数据文件，使用\
  \ `Text::CSV_XS`（或 `Text::CSV`）。\n* 管理应用程序的模块安装，使用 `Carton`。\n* 操作数值数据，使用 `PDL`。\n\
  * 处理图像，使用 `Imager`。\n* 访问共享库，使用 `FFI::Platypus`。\n* 从 XML 文件中提取数据，使用 `XML::Rabbit`。\n\
  * 保持代码整洁，使用 `Perl::Tidy`。\n* 关注限制和警告之外的问题，使用 `Perl::Critic`。\n\n列表还将继续。经常浏览 CPAN\
  \ 最近上传页面（[`search.cpan.org/recent`](http://search.cpan.org/recent)）以查看新动态和更新内容。\n\
  \n### 用 Perl 思维\n\n正如任何创作活动一样，学习 Perl 永不停止。虽然 `Modern Perl` 描述了优秀的 Perl 程序员如何对待他们的工作，但他们的技术和工具始终在演进。2015\
  \ 年和 2016 年很棒的东西在五年前可能还没被想象过——而 2020 年及之后的伟大之处现在可能只是一个进取的 Perl 黑客脑海中的一丝端倪。\n\n你有机会塑造那个未来。继续发现如何让\
  \ Perl 为你服务以及如何让 Perl 变得更好取决于你，无论是从全球 Perl 社区学习、查阅核心和 CPAN 的文档，还是通过仔细的实践。Perl 并不完美（尽管它在一年一年、一个版本的发布中不断改进）。它可以根据你需要解决的问题，变得多么整洁或多么混乱。\n\
  \n正如一位智者曾说过的：“愿你用 Perl 做些善事。”\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n\
