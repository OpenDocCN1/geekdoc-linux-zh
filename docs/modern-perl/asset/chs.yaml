- "# Modern Perl 入门指南\n\n\n\n![](img/cover.jpg)\n\n![实用书架 (Pragmatic Bookshelf)](img/cover.jpg\
  \ \"Pragmatic Bookshelf\")\n\n\n\n\n\n\n\n\n\n## 为了获得最佳阅读体验……\n\n我们强烈建议您在阅读设备或应用程序上启用“出版商默认”设置来阅读本书。如果没有此设置，某些格式和字符可能无法正常显示。请参阅阅读器说明了解如何启用出版商默认设置。\n\
  \n\n\n\n\n# 现代 Perl（第四版）序言\n\n十年前，我确信自己知道 Perl 的样子：晦涩且难以阅读。但那时 chromatic 曾向我展示了美观、结构化且富有表现力的代码。他是教授《现代\
  \ Perl》的完美人选。在本书出现之前，他就已经在编写它了。\n\n| → | Daniel Steinberg |\n| | DimSumThinking,\
  \ Inc. 总裁 |\n\n《现代 Perl》是一部地道代码的杰作，它不仅教你“如何”做，还教你“为什么”要这么做。\n\n| → | David Farrell\
  \ |\n| | PerlTricks.com 编辑员 |\n\n如果我必须选一本书来教 Perl 5，我会选这一本。在阅读它时，我想起了第一次读 K&R 语言手册时的感觉。它将教你写好\
  \ Perl 5 所需的所有知识。\n\n| → | David Golden |\n| | Perl 5 Porters 成员，Autopragmatic,\
  \ LLC 成员 |\n\n我正准备用《现代 Perl》第一版教一个新入员工 Perl。我更想用更新后的版本！\n\n| → | Belden Lyman |\n\
  | | MediaMath 首席软件工程师 |\n\n这不是你应得的 Perl 书，而是你真正需要的 Perl 书。\n\n| → | Gizmo Mathboy\
  \ |\n| | 大拉法耶特开源源码研讨会 (GLOSSY) 联合创始人 |\n\n# 前言\n\nLarry Wall 于 1987 年发布了第一版本的 Perl。这种语言从最初作为系统管理员的小众工具（他们需要比\
  \ Shell 脚本更强大、比 C 语言更易用的工具），演变成了一门通用编程语言。Perl 拥有深厚的实用主义历史，并且近年来在功能增强和向后兼容方面采取了严谨的方法。\n\
  \n在 Perl 的漫长历史中——过去二十年里 Perl 5 不断地完善——我们对什么是优秀的 Perl 程序的理解已经发生了变化。虽然你可以写出高效的程序而不必利用该语言提供的所有功能，但全球\
  \ Perl 社区发明、借用、增强并完善了许多想法，并让任何愿意学习的人都能使用它们。\n\n《现代 Perl》是一种心态。它是使用 Perl 编程语言编写优秀软件的方法。它是高效\
  \ Perl 程序员编写简洁、易维护且可扩展代码的方式。如果你已经掌握了 Perl 的基础知识，你将从中受益匪浅。\n\n我正准备用《现代 Perl》第一版教一个新入员工\
  \ Perl。我更想用更新后的版本！\n\n这不是你应得的 Perl 书，而是你真正需要的 Perl 书。\n\n《现代 Perl》是一种心态。它是使用 Perl\
  \ 编程语言编写优秀软件的方法。它是高效 Perl 程序员编写简洁、易维护且可扩展代码的方式。如果你已经掌握了 Perl 的基础知识，你将从中受益匪浅。\n\n\
  # Perl 哲学\n\nPerl 解决问题——它是灵活、宽容且易变形的。有能力的程序员每天都用它处理从单行命令、一次性自动化到多年、多人项目的各种任务。\n\n\
  Perl 是实用的。你是主宰。你决定如何解决问题，Perl 会迎合你的意图，没有任何挫败感，也没有琐节。\n\nPerl 会随你成长。在接下来的一小时内，你将学会编写真实实用的程序所需的知识，并理解该语言的工作原理以及为什么这样设计。《现代\
  \ Perl》利用这些知识以及全球 Perl 社区的共同经验，帮助你编写运行良好且易于维护的代码。\n\n首先，你需要了解如何获取更多信息。\n\n## Perldoc\n\
  \n\n\n\n\nPerl 尊重你的时间；Perl 文化重视文档。该语言自带了数千页的核心文档。`perldoc` 实用程序是每个完整的 Perl 安装的一部分。你的操作系统可能会将其作为一个额外包提供；例如，在\
  \ Debian 或 Ubuntu GNU/Linux 上安装 `perldoc`。`perldoc` 可以显示核心文档，还可以显示你安装的每个 Perl 模块的文档——无论是核心模块还是从全面\
  \ Perl 归档网络 (CPAN) 安装的模块。\n\n使用 `perldoc` 读取模块或核心文档部分的文档：\n\n|   | `$perldoc List::Util`\
  \ |\n| --- | --- |\n|   | `$perldoc perltoc` |\n|   | `$perldoc Moose::Manual` |\n\
  \n| CPAN 文档 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png) | [`perldoc.perl.org/`](http://perldoc.perl.org/)\
  \ 托管了最新版本的 Perl 文档。CPAN 在 [`search.cpan.org/`](http://search.cpan.org/) 和 [`metacpan.org/`](http://metacpan.org/)\
  \ 进行索引，并为所有 CPAN 模块提供文档。其他发行版如 ActivePerl 和 Strawberry Perl 提供 HTML 格式的本地文档。 |\n\
  \n第一个示例显示了 `List::Util` 模块的文档；这些文档就在模块本身。第二个示例是核心文档的目录。该文件纯是文档。第三个示例需要你安装 `Moose`\
  \ (Moose) CPAN 分发；它显示了纯文档手册。`perldoc` 为你隐藏了所有这些细节；阅读如 `Data::Dumper` 等核心库的文档或从 CPAN\
  \ 安装的库的文档之间没有区别。Perl 文化如此重视文档，以至于甚至外部库也遵循核心语言文档的良好典范。\n\n标准文档模板包括模块描述、示例用法，以及对模块及其接口的详细说明。虽然文档的数量取决于作者，但文档的形式表现出惊人的一致。\n\
  \n| 如何阅读文档 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | Perl 有大量的文档。从哪里开始？`perldoc\
  \ perltoc` 显示核心文档的目录，而 `perldoc perlfaq` 是 Perl 常见问题的目录。`perldoc perlop` 和 `perldoc\
  \ perlsyn` 记录了 Perl 的符号运算符和语法结构。`perldoc perldiag` 解释了 Perl 警告信息的含义。`perldoc perlvar`\
  \ 列出了 Perl 所有的符号变量。你不需要在这些文档中记忆任何内容。快速浏览它们以获得对语言的良好概述，并在有问题时再回来查看。 |\n\n`perldoc`\
  \ 实用程序可以做很多得更多（参见 `perldoc perldoc`）。使用 `-q` 选项配合关键字搜索 Perl FAQ。例如，`perldoc -q sort`\
  \ 返回三个问题：如何根据（任何内容）对数组排序？如何对哈希进行排序（可选地按值而不是键）？我该如何始终保持我的哈希排序？\n\n`-f` 选项显示内置 Perl\
  \ 函数的文档，例如 `perldoc -f sort`。如果你不知道想要运行的名称，可以在 `perldoc perlfunc` 中浏览可用内置函数的列表。\n\
  \n`-v` 选项查找内置变量。例如，`perldoc -v $PID` 解释 `$PID`，它是包含当前程序进程 ID 的变量。根据你使用的 shell，你可能需要对变量进行适当的引用。\n\
  \n`-l` 选项显示包含文档的文件路径。（一个模块除了 `.pm` 文件外，可能还有一个单独 `.pod` 文件。）\n\n`-m` 选项显示模块的所有内容（包括代码在内），没有任何特殊格式。\n\
  \nPerl 使用一种名为 POD 的文档格式，它是 Plain Old Documentation 的缩写。`perldoc perlpod` 描述了 POD\
  \ 的工作原理。其他 POD 工具包括 `podchecker`（用于验证 POD 文档的结构）以及 `Pod::Webserver` CPAN 模块（它通过极简\
  \ Web 服务器将本地 POD 显示为 HTML）。\n\n## 表现力\n\n在 Larry Wall 创建 Perl 之前，他学习过语言学。与其他围绕数学概念设计的编程语言不同，Perl\
  \ 的设计模拟了人与人之间的通信方式。这让你拥有了根据当前需求编写程序的自由。你可以编写简单、直接的代码，也可以将许多小片段组合成更大的程序。你可以从多种设计范式中进行选择，也可以舍弃或采用高级特性。\n\
  \n学习 Perl 就像学习任何口语语言。你会学习几个单词，然后把句子串起来，接着享受简单的对话。精通来自于对阅读和编写代码的练习。你不需要理解 Perl 的每一个细节就能发挥效率，但本章中的原则对你作为程序员的成长至关重要。\n\
  \n其他语言可能声称解决任何问题只有一种最佳方法。Perl 允许你决定什么是最具可读性的、最有用的、最有吸引力的或最有趣的。\n\nPerl 黑客把此称为 TIMTOWTDI，发音为“Tim\
  \ Toady”，意思是“做这件事多于一种方法！”\n\n这种表现力让大师级专家能够创造出令人惊叹的程序，但也让粗不留心的人制造混乱。你将随着经验发展出自己的良好品味。表达你自己，但要考虑到后者的可读性和可维护性，特别是对于那些在你之后之后的人来说。\n\
  \nPerl 初学者往往觉得某些语法是晦涩的。这些习式 (Idioms) 为丰富的程序员提供了强大的（尽管微妙的）力量，但在你感到舒适之前，避免它们是可以的。\n\
  \n作为另一个设计目标，Perl 试图避免让程序员感到意外。例如，两个变量相加 `$first_num + $second_num` 显然是一个数值运算 (Numeric\
  \ Operators)。你通过使用运算符表达了你的意图。无论 `$first_num` 和 `$second_num` 的内容是什么，Perl 都会乐意将它们转换为数值\
  \ (Numeric Coercion)。\n\nPerl 专家将这种原则称为 DWIM，或“按我的意思做”。你完全可以将其称为最小惊讶原则。在大致了解 Perl（特别是上下文\
  \ Context)），理解一个陌生表达式的意图应该是可能的。你将在学习 Perl 时培养这种技能。\n\nPerl 的表现力允许初学者在不需要理解整个语言的情况下编写实用的程序。这是设计使然！丰富的开发者经常将“婴儿\
  \ Perl”作为亲称。每个人都是初学者。通过练习和从丰富的程序员学习，你将理解并采用更强大的习式和技术。你编写自己理解的简单代码是可以的。继续练习，你将会成为母语使用者。\n\
  \n一个 Perl 初学者黑客可能会用这样将数字列表三倍：\n\n```perl\nmy @tripled;\nfor (my $i = 0; $i < scalar\
  \ @numbers; $i++) {\n    tripled[$i] = $numbers[$i] * 3;\n}\n```\n\n而一个 Perl 专家可能会写：\n\
  \n```perl\nmy @tripled;\nfor (my $num (@numbers) {\n    push @tripled, $num * 3;\n\
  }\n```\n\n而丰富的 Perl 黑客可以写这个：\n\n```perl\nmy @tripled = map { $_ * 3 } @numbers;\n\
  ```\n\n这三个程序每一个都生成相同的结果。每个使用 Perl 的方式都不同。\n\n\n\n\n随着你对 Perl 越来越熟悉，你可以让这种语言为你做更多。随着经验的积累，你可以关注*要做什么*而不是*怎么做*。Perl\
  \ 并不关心你写的是新手代码还是专家代码。设计并完善你的程序，以实现清晰性、表达性、重用性和可维护性（无论部分还是全部）。利用这种灵活性和务实精神：现在高效地完成任务，远比明年写出一个概念上纯粹且美丽的程序要得多。\n\
  \n## 上文\n\n在口语语言中，一个单词或短语的含义取决于你如何使用它；其他语法结构的局部上下文有助于澄清意图。例如，“Please give me one\
  \ hamburgers!”中不当的复数形式听起来很奇怪（名词的复数形式与数量不符），就像“la gato”中错误的性别（冠词是阴性的，但名词是阳性的）会让母语者会心一笑一样。有些词具有双重作用：一个\
  \ sheep 还是 sheep，就像两只 sheep 也是 sheep，而你也可以 program a program（用程序来编写一个程序）。\n\nPerl\
  \ 使用上下文来表达如何处理一段数据。这决定了数据的数量以及数据的类型。例如，若干 Perl 操作在你期望得到零、一个或多个结果时会产生不同的行为。Perl 中的某个特定结构如果你写成“执行这个，但我不在乎任何结果”，与写成“执行这个并给我多个结果”相比，执行的操作可能会不同。其他操作允许你指定你期望处理的是数值、文本还是真/假数据。\n\
  \n在阅读 Perl 代码时，必须将上下文牢在心中。每个表达式都是更大上下文的一部分。当你经过长时间的调试，发现自己对上下文的假设是错误的时，你可能会拍拍额头。相反，如果你意识到上下文，你的代码将更加正确——而且更清晰、灵活且简洁。\n\
  \n### 空值（Void）、标量上下文（Scalar）和列表上下文（List）\n\n数量上下文（Amount context）决定了你期望一个操作产生多少项内容。想想英语中的主谓数一致。即使不知道这一原则的正式描述，你可能也能理解“Perl\
  \ are a fun language.”这句话中的错误（从数量上下文的角度来看，可以说动词 `are` 期望一个复数名词或名词短语）。在 Perl 中，你请求的项目数量会影响你收到的数量。\n\
  \n假设名为 `find_chores()` 的函数按优先级对你的家务待事项列表排序。你期望从列表中读取的家务数量会影响函数的输出。如果你期望什么都没有，你只是在假装忙碌。如果你期望一个任务，你接下来的十五分钟就有事做了。如果你在一个空闲的周末精力充沛，你可以完成所有的家务。\n\
  \n为什么上下文很重要？一个感知上下文的函数可以检查它的调用上下文并决定它必须做多少工作。当你调用一个函数且从不使用它的返回值时，你就使用了空值上下文（void\
  \ context）：\n\n```\nfind_chores();\n```\n\n将函数的返回值赋值给单个项会强制执行标量上下文（scalar context）：\n\
  \n```perl\nmy $single_result = find_chores();\n```\n\n将调用函数的结果赋值给数组或列表，或者在列表中使用，则会在列表上下文（list\
  \ context）下求值函数：\n\n```perl\nmy @all_results = find_chores();\nmy ($single_element,\
  \ @rest) = find_chores();\n\n# 传递给函数的的结果列表\nprocess_list_of_results( find_chores()\
  \ );\n```\n\n上一个示例第二行中的括号将两个变量声明分组成一个单元，使得赋值同时作用于两个变量。尽管如此，单项列表仍然是一个列表。你也可以正确地写：\n\
  \n```perl\nmy ($single_element) = find_chores();\n```\n\n在这种情况下，括号告诉 Perl 解析器，你打算为单个变量\
  \ `$single_element` 使用列表上下文。这很微妙，但既然你已经知道了这一点，这两句语句之间数量上下文的差异应该是显而易见的：\n\n```perl\n\
  my $scalar_context = find_chores();\nmy ($list_context) = find_chores();\n```\n\n\
  列表会将列表上下文传播到它们包含的表达式。这通常会让新手感到困惑，直到他们理解它为止。这两个对 `find_chores()` 的调用都发生在列表上下：\n\n\
  ```perl\nprocess_list_of_results( find_chores() );\n\nmy %results = (\n    cheap_operation\
  \ => $cheap_results,\n    expensive_operation => find_chores(), # 错误！\n);\n```\n\
  \n是的，使用值列表初始化哈希表会对 `find_chores` 施加列表上下文。使用标量操作符来强制执行标量上下文：\n\n```perl\nmy %results\
  \ = (\n    cheap_operation => $cheap_results,\n    expensive_operation => scalar\
  \ find_chores(),\n);\n```\n\n再次，上下文可以帮助你决定做多少。在空值上下文中，`find_chores()` 可能什么都不做。在标量上下文中，它可以找到最重要的。在列表上下文中，它必须返回全部。\n\
  \n### 数值、字符串和布尔值上下文\n\n值上下文（Value contexts）影响 Perl 如何解释一段数据。Perl 可以判断你拥有的是一个数字还是一个字符串。\n\
  \n为了不需要显式声明变量包含什么类型，Perl 会根据你使用的操作符将值转换为特定类型。例如，`eq` 操作符测试两个值是否包含字符串值：\n\n```perl\n\
  say \"Catastrophic fail!\" if $alice eq $bob;\n```\n\n你可能有过一种不可其妙的经历：你知道字符串是不同的，但它们比较的结果仍然相同：\n\
  \n```perl\nmy $alice = 'alice';\nsay \"Catastrophic fail!\" if $alice == 'Bob';\n\
  ```\n\n`eq` 操作符通过对操作数强制执行字符串上下文将其视为字符串，但 `==` 操作符强制执行数值上下文。在数值上下文中，两个字符串都评估为 0。\n\
  \n布尔上下文发生在你在条件语句中使用一个值时。在之前的示例中，`if` 在布尔上下评估了 `eq` 和 `==` 操作的结果。\n\n在某些情况下，你可能无法使用适当的操作符来强制值上下文。要强制数值上下文，给变量加上零。要强制字符串上下文，将变量与空字符串拼接。要强制布尔上下文，双写否定操作符：\n\
  \n```perl\nmy $numeric_x = 0 + $x; # 强制数值上下文\nmy $stringy_x = '' . $x; # 强制字符串上下文\n\
  my $boolean_x = !!$x; # 强制布尔上下文\n```\n\n值上下文比数量上下文更容易识别。一旦你知道哪些操作符提供什么上下文，你就很少会犯错。\n\
  \n## 隐含概念\n\nPerl 代码初看起来可能复杂，但它充满了语言捷径。这些捷径让丰富的程序员能够一眼代码并理解其重要的含义。上下文是一种捷径。另一个是默认变量——编程中的代词。\n\
  \n### 默认标量变量\n\n\n\n默认标量变量（或主题变量）`$_` 最显著的特点是它的缺席：在没有显式变量的情况下，Perl 的许多内置操作都会直接作用于\
  \ `$_` 的内容。如果输入 `$_` 能让你的代码更清晰，你仍然可以写它，但这通常是没有必要的。\n\n如果你不提供替代变量，Perl 的许多标量运算符（包括\
  \ `chr`、`ord`、`lc`、`length`、`reverse` 和 `uc`）都会作用于默认标量变量。例如，内置函数 `chomp` 会从操作数中移除任何尾换行符（技术上是\
  \ `$/` 的内容；参见 `perldoc -f chomp`）：\n\n```\nmy $uncle = \"Bob\\n\";\nchomp $uncle;\n\
  say \"'$uncle'\";\n```\n\n`$_` 在 Perl 中的行为与其在英语中的代词相同。在没有显式变量的情况下，`chomp` 会移除 `$_`\
  \ 末尾的换行符。当你写 `chomp;` 时，Perl 总是会对其进行处理。这两行代码是等价的：\n\n```\nchomp $_;\nchomp;\n```\n\
  \n在没有其他参数的情况下，`say` 和 `print` 也作用于 `$_`：\n\n```\nprint; # 将 $_ 打印到当前文件句柄\nsay; #\
  \ 将 $_ 和一个换行符打印到当前文件句柄\n```\n\nPerl 的正则表达式功能（正则表达式与匹配）默认使用 `$_` 进行匹配、替换和转译：\n\n\
  ```\n$_ = 'My name is Paquito';\nsay if /My name is/;\ns/Paquito/Paquita/;\ntr/A-Z/a-z/;\n\
  say;\n```\n\nPerl 的循环指令（循环指令）默认使用 `$_` 作为迭代变量，无论是遍历列表：\n\n```\nsay \"#$_*\" for\
  \ 1 .. 10;\nfor (1 .. 10) {\n    say \"#$_*\";\n}\n```\n\n或者等待表达式求值为假时：\n\n```\n\
  while (<STDIN>) {\n    chomp;\n    say scalar reverse;\n}\n```\n\n或者 map 转换列表：\n\
  \n```\nmy @squares = map { $_ * $_ } 1 .. 10;\nsay for @squares; # 注意后缀 for\n```\n\
  \n或者 grep 过滤列表：\n\n```\nsay 'Brunch is possible!';\nif grep { /pancake mix/ } @pantry;\n\
  ```\n\n正如英语在有太多代词和指代对象时会变得困惑一样，Perl 在混合使用 `$_` 的显式和隐式用法时也是如此。通常情况下，只有一个 `$_`。如果你在多个地方使用它，一个运算符的\
  \ `$_` 可能会覆盖另一个。例如，如果一个函数使用了 `$_`，而你又在另一个使用 `$_` 的函数中调用了它，被调用者可能会覆盖调用者的值：\n\n```\n\
  while (<STDIN>) {\n    chomp;\n    # 错误示例\n    my $munged = calculate_value( $_\
  \ );\n    say \"Original:$_*\";\n    say \"Munged :$munged*\";\n}\n```\n\n如果 `calculate_value()`\
  \ 或任何其他函数更改了 `$_`，该更改将在循环的本次迭代中持续存在。使用具名的词法变量更安全且可能更清晰：\n\n```\nwhile (my $line\
  \ = <STDIN>) {\n    ...\n}\n```\n\n像在正式写作中使用该词一样使用 `$_`：少用，在较小且定义良好的范围内使用。\n\n###\
  \ ... 运算符\n\n三点（`...`）运算符是你打算稍后填充的代码占位符。Perl 会将其解析为完整的语句，但如果你尝试运行它，它会抛出异常，表示你试图运行未实现的代码。更多细节请参见\
  \ `perldoc perlop`。\n\n\n\n现代 Perl 编程依赖于 CPAN ([`www.cpan.org/`](http://www.cpan.org/))。全面\
  \ Perl 归档网络是一个用于可分发、可重用 Perl 代码的上传和镜像系统。它是最大的代码库之一。你可以找到从数据库访问到性能分析工具，从几乎所有创建过的网络设备的协议，再到音频和图形库以及你系统中共享库的包装器等的所有内容。\n\
  \n没有 CPAN 的现代 Perl 仅仅是另一种语言。而拥有 CPAN 的现代 Perl 则是解决问题的强大工具包。\n\nCPAN 托管发行（distributions），即可重用\
  \ Perl 代码的集合。单个发行可以包含一个或多个模块（modules）：即自包含的 Perl 代码库。每个发行都占用自己的 CPAN 命名空间并提供唯一的元数据。\n\
  \n| CPAN 很大，真的大 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png) | CPAN\
  \ 每月在数百个发行版中增加数百名注册贡献者和数千个已索引的模块。这些数字还没有考虑到更新。在 2015 年 5 月，search.cpan.org 报告有 12207\
  \ 个上传者, 150552 个模块和 31873 个发行版（与本书上一版相比，增长率分别为 10.8%、16.7% 和 9.6%）。 |\n\nCPAN 本身仅仅是一个镜像服务。作者将发行上传到中央服务\
  \ (PAUSE)，它将其复制到镜像站点，CPAN 客户端从那里下载。这一切都依赖于共同的行为；社区标准已经演变，以识别良好的 CPAN 发行的属性和特征。这些包括：\n\
  \n- 自动化 CPAN 安装器的行为\n- 描述每个发行提供和预期的元数据\n- 机器可读的文档和许可\n\n额外的 CPAN 服务提供跨平台和跨  全面自动化测试和报告。每个\
  \ CPAN 发行在 [`rt.cpan.org/`](http://rt.cpan.org/) 上都有自己的工单队列，用于报告错误和与作者合作。CPAN 站点还链接到之前的发行版本、模块评分、文档注释等。所有这些内容可以通过\
  \ [`search.cpan.org/`](http://search.cpan.org/) 和 [`metacpan.org/`](http://metacpan.org/)\
  \ 获取。\n\n现代 Perl 安装包含一个用于连接、搜索、下载、构建、测试和安装 CPAN 发行的客户端；这就是 `CPAN.pm`。使用最近的一个版本（截至本文写作时，2.10\
  \ 是最新稳定版本），模块安装变得相当简单。使用此命令启动客户端：\n\n```bash\n$ cpan\n```\n\n在客户端中安装发行，请使用此命令：\n\
  \n```bash\n$ cpan\ncpan[1]> install Modern::Perl\n```\n\n或者直接从命令行安装，使用此命令：\n\n```bash\n\
  $ cpan Modern::Perl\n```\n\nEric Wilhelm 关于配置 `CPAN.pm`^([[2]](#f_0018.html_FOOTNOTE-2))\
  \ 的教程包含一个非常好的故障排除章节。\n\n| CPAN 要求 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ | 尽管 CPAN 客户端是 Perl 分行的核心模块，但你仍需要安装标准的开发工具，例如 make 工具以及可能需要的 C 编译器。Windows 用户请参阅\
  \ Strawberry Perl^([[3]](#f_0018.html_FOOTNOTE-3)) 和 Strawberry Perl Professional。Mac\
  \ OS X 用户必须安装 XCode。Unix 和类 Unix 用户通常可以使用这些工具（尽管 Debian 和 Ubuntu 用户应该安装 build-essential）。\
  \ |\n\n### CPAN 管理工具\n\n如果你的操作系统自带 Perl 安装，它可能已经过时或依赖于特定版本的 CPAN 发行。高级 Perl 开发者经常会在系统\
  \ Perl 和他们的开发 Perl 安装之间构建虚拟墙。几个项目有助于实现这一目标。\n\n`App::cpanminus` CPAN 客户端快速且简单，且不需要配置。使用\
  \ `cpan App::cpanminus` 或以下命令安装：\n\n```bash\n$ curl -LO http://xrl.us/cpanm\n$ less\
  \ cpanm # 在运行前查看代码\n$ chmod +x cpanm\n./cpanm\n```\n\n`App::perlbrew` 是一个用于管理和在你自己的多个版本和配置的\
  \ Perl 安装之间切换的系统。安装方法同样简单：\n\n```bash\n$ curl -LO http://xrl.us/perlbrew\n$ less\
  \ perlbrew # 在运行前查看代码\n$ chmod +x perlbrew\n./perlbrew install\nperldoc App::perlbrew\n\
  ```\n\n`local::lib` CPAN 发行允许你安装和管理多个 Perl 安装。这是为单个用户或应用程序维护 CPAN 发行且而不影响整个系统的有效方法。请参阅\
  \ [`metacpan.org/pod/local::lib`](https://metacpan.org/pod/local::lib) 和 [`metacpan.org/pod/App::lib`](https://metacpan.org/pod/App::lib)。\n\
  \n\n\n\n许多 Perl 黑客使用 `GitHub` 来托管他们的项目，包括本书的源码。特别请参考 `Gitpan`，它托管了记录 CPAN 上每个发行版完整历史的\
  \ Git 仓库。\n\n| 本地 Git 镜像 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | `Gitpan` 的更新频率较低。作为从 `Gitpan` 破解 CPAN 发行版的替代方案，可以考虑使用 Yanick Champoux 优秀的 `Git::CPAN::Patch`\
  \ 模块，从 CPAN 发行版创建本地 Git 仓库。 |\n\n## 事件\n\nPerl 社区举办了无数会议、工作坊、研讨会和会议。特别是社区运行的 YAPC——又一次\
  \ Perl 会议（Yet Another Perl Conference），这是一个在多个大陆成功的成功、本地且低成本会议模型。请访问 [`yapc.org/`](http://yapc.org/)。\n\
  \n数百个当地的 Perl Mongers 小组经常聚集在一起进行技术讲座和社交互动。请访问 [`www.pm.org/`](http://www.pm.org/)。\n\
  \n## IRC\n\n当 Perl Mongers 无法面对面时，许多人通过被称为 `IRC` 的文本聊天系统进行在线协作和聊天。Perl 社区的主服务器是\
  \ `irc://irc.perl.org/`。请注意，`#perl` 通道是一个通用通道，用于参与者想要讨论的任何内容。请将问题直接向 `#perl-help`。许多流行且实用的\
  \ Perl 项目都有自己的 IRC 频道，例如 `#moose` 和 `#catalyst`；你可以在项目文档中找到这些频提及。\n\n#### 脚注\n\n\
  | [[2]](#f_0014.html_FNPTR-2) | [`learnperl.scratchcomputing.com/tutorials/configuration/`](http://learnperl.scratchcomputing.com/tutorials/configuration/)\
  \ |\n| [[3]](#f_0014.html_FNPTR-3) | [`strawberryperl.com/`](http://strawberryperl.com/)\
  \ |\n| [[4]](#f_0016.html_FNPTR-4) | [`github.com/`](http://github.com/) |\n| [[5]](#f_0016.html_FNPTR-5)\
  \ | [`github.com/chromatic/modern_perl_book/`](http://github.com/chromatic/modern_perl_book/)\
  \ |\n| [[6]](#f_0016.html_FNPTR-6) | [`github.com/gitpan/`](http://github.com/gitpan/)\
  \ |\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 3 章：Perl 语言\n\nPerl 语言是多个独立部分的组合。虽然口语语言使用细差别、语调和直觉来跨越知识和理解的鸿沟，但计算机和源代码需要精确。你可以在不了解每种语言特征每个细节的情况下编写有效的\
  \ Perl 代码，但你必须理解它们如何协同工作以写出良好的 Perl 代码。\n\n## 名称\n\n名称（或标识符）在 Perl 程序中无处不在：你为变量、函数、包、类甚至文件句柄选择名称。所有有效的\
  \ Perl 名称都以字母或下划线开头，并可选地包含字母、数字和下划线的任意组合。当 `utf8` 原指令（Unicode 与字符串）生效时，你可以在标识符中使用任何\
  \ UTF-8 字符。这些是有效的 Perl 标识符：\n\n| | |\n| --- | --- |\n| | `my $name;` |\n| | `my\
  \ @_private_names;` |\n| | `my %Names_to_Addresses;` |\n| | `sub anAwkwardName3;`\
  \ |\n| | `# with use utf8; enabled` |\n| | `package Ingy::Dôt::Net;` |\n\n这些是无效的\
  \ Perl 标识符：\n\n| | |\n| --- | --- |\n| | `my $invalid name; # 空格无效` |\n| | `my @3;\
  \ # 不能以数字开头` |\n| | `my %~flags; # 符号在名称中无效` |\n| | |\n| | `package a-lisp-style-name;`\
  \ |\n\n名称的存在主要是为了程序员。这些规则仅适用于出现在源代码中的字面量名称，例如 `sub fetch_pie` 或 `my $waffleiron`。\n\
  \n只有 Perl 的解析器强制执行标识符名称的规则。你也可以引用运行时生成或作为程序输入提供的名称实体。这些符号查找以牺牲安全性为代价换取灵活性。间接调用函数或方法或在命名空间中查找符号让你跳过\
  \ Perl 的解析器。符号查找可能会产生混淆的代码。正如 Mark Jason Dominus 建议的，优先使用哈希（哈希）或嵌套数据结构（嵌套数据结构），而不是命名为\
  \ `$recipe1`、`$recipe2` 等的变量。\n\n### 变量名称与符（Sigils）\n\n变量名称始终有一个前导符（符号），它指示变量值的类型。标量变量（标量）使用美元符号（`$`）。数组变量（数组）使用符号（`@`）。哈希变量（哈希）使用百分号（`%`）：\n\
  \n| | |\n| --- | --- |\n| | `my $scalar;` |\n| | `my @array;` |\n| | `my %hash;`\
  \ |\n\n符将变量隔离开不同的命名空间。虽然很令人困惑，但声明多个相同名称但不同类型的变量是可能的：\n\n| | |\n| --- | --- |\n|\
  \ | `my ($bad_name, @bad_name, %bad_name);` |\n\nPerl 不会困惑，但人类会。\n\n变量的符根据其用途变化；这些被称为变体符（variant\
  \ sigils）。正如上下文决定了你期望从操作中获取多少个项目或什么类型的数据一样，符决定了你如何操作数据。例如，使用标量符（`$`）来访问数组或哈希的单个元素：\n\
  \n| | |\n| --- | --- |\n| | `my $hash_element = $hash{key};` |\n| | `my $array_element\
  \ = $array[index];` |\n| | |\n| | `$hash{key} = 'value';` |\n| | `$array[index]\
  \ = 'item';` |\n\n与数量上下文的并行关系很重要。将聚合标的标量元素作为左值（赋值的目标；等号的左侧）会对右值（赋值的值；等号的右侧）施加标量上下文（上下文）。同样，访问哈希或数组的多个元素——一种被称为切片（slicing）的操作使用\
  \ @ 符号并强制列表上下文——即使列表零或只有一个元素：\n\n| | |\n| --- | --- |\n| | `@hash_elements = @hash{keys};`\
  \ |\n| | `@array_elements = @array[indexes];` |\n| | |\n| | `@hash{keys} = values;`\
  \ |\n\n### 命名空间\n\nPerl 将类似的函数收集到它们唯一的命名空间——命名空间（包）。命名空间是全局唯一名称下的符号集合。Perl 允许多级命名空间，用双冒号（`::`）连接。`DessertShop::IceCream`\
  \ 指向一组逻辑相关的变量和函数。\n\n在命名空间内部，你可以使用其成员的短名称。在命名空间外部，你必须通过完全限定名称引用成员。在 `DessertShop::IceCream`\
  \ 内部，`add_sprinkles()` 与外部的 `DessertShop::IceCream::add_sprinkles()` 指向同一个函数。\n\n\
  标准的标识符规则适用于包名称。按照惯例，Perl 核心保留小写包名称用于核心原指令（原指令),例如 `strict` 和 `warnings`。用户定义的包都以大写字母开头。\n\
  \n\n\n\n\nPerl 中的所有命名空间都是全局可见的。当 Perl 在 `DessertShop::IceCream::Freezer` 中查找符号时，它会在\
  \ `main::` 符号表中查找代表 `DessertShop` 命名空间的符号，然后在该命名空间内查找 `IceCream::` 命名空间，以此此类推。然而，`Freezer::`\
  \ 在 `IceCream::` 命名空间外部也是可见的。前者在后者中的嵌套仅仅是一种存储机制；它并不意味着父子包或兄弟包之间存在某种关系。\n\n只有你作为程序员，才能让实体之间的逻辑关系显而易见——通过选择良好的名称和良好的组织结构来实现。\n\
  \n# 变量\n\nPerl 中的变量是存储值的存储位置（值）。虽然一个简单的程序可能会直接操作值，但大多数程序都是通过变量工作的。可以将此此类比为代数：你通过操作符号来描述公式。使用变量\
  \ `a`、`b` 和 `c` 来解释勾股定理，比通过产生一长串有效值来直观理解原理要容易得多。\n\n## 变量作用域\n\n你在程序中访问变量的能力取决于变量的作用域（作用域）。现代\
  \ Perl 程序中的大多数变量具有由编写程序的语法控制的词法作用域（词法作用域）。大多数词法作用域要么是由花括号 `{` 和 `}` 分隔的块的内容，要么是整个文件。文件本身提供了词法作用域，因此单独的一个包声明并不会创建新的作用域：\n\
  \n| | `package Store::Toy;` |\n| | | |\n| | `my $discount = 0.10;` |\n| | | |\n\
  | | `package Store::Music;` |\n| | | |\n| | `# $discount still visible` |\n| | `say\
  \ \"Our current discount is $discount!\"` |\n\n你也可以为包声明提供一个块。因为引入了一个新的块，它也提供了一个新的词法作用域：\n\
  \n| | `package Store::Toy {` |\n| | `my $discount = 0.10;` |\n| | `}` |\n| | | |\n\
  | | `package Store::Music {` |\n| | `# $discount not visible` |\n| | `}` |\n| |\
  \ | |\n| | `package Store::BoardGame;` |\n| | | |\n| | `# $discount still not visible`\
  \ |\n\n## 变量标识符 (Sigils)\n\n声明中变量标识符决定了变量的类型：标量、数组或哈希。访问变量时使用的标识符取决于你对变量进行的操作。例如，你声明一个数组为\
  \ `@values`。使用 `$values[0]` 访问的第一个元素（单个值）。使用 `@values[ @indices ]` 访问数组中的值列表。你使用的标识符决定了在左值（lvalue）情况下的数量上下文（amount\
  \ context）：\n\n| `# imposes lvalue context on some_function()` |\n| `@values[ @indexes\
  \ ] = some_function();` |\n\n或者在右值（rvalue）情况下，它会被强制类型转换：\n\n| `# list evaluated\
  \ to final element in scalar context` |\n| `my $element = @values[ @indices ];`\
  \ |\n\n## 匿名变量\n\nPerl 变量不需要名称。名称的存在是为了帮助你这个程序员来跟踪 `$apple`、`@barrels` 或 `%cookie_recipes`。在源代码中没有字面名称创建的变量是匿名变量。访问匿名变量的唯一方法是通过引用（引用）。\n\
  \n## 变量、类型与强制转换\n\n变量类型、标识符和上下文之间的关系是 Perl 的关键。\n\nPerl 变量代表值（例如成本、可用的披萨配料、吉他店的名字和电话），也代表存储该值的容器。Perl\
  \ 的类型系统处理值类型和容器类型。虽然变量的容器类型（标量、数组或哈希）不能改变，但 Perl 对变量的值类型非常灵活。你可以在某一行中向变量中存储一个字符串，在下一行中向该变量追加一个数字，并在第三行中重新分配一个函数引用（函数引用），尽管这是一个让自己感到困惑的好方法。\n\
  \n对变量执行某种特定值类型的操作可能会导致变量现有值类型的强制转换（强制转换）。\n\n例如，确定数组中条目的数量记录方法是在标量上下文中评估数组（上下文）。因为标量变量只能包含标量，将数组（右值）赋值给标量（左值）会对该操作施加标量上下文，而在标量上下文评估的数组会产生数组中的元素数量：\n\
  \n| `my $count = @items;` |\n\n# 值\n\n新手程序员花费大量时间思考程序必须做什么。成熟的程序员花费大量时间思考程序应该做什么。\n\
  \n## 字符串\n\n字符串是一段文本或二进制数据。由一对字符包围。常见的定界符是单引号和双引号：\n\n| `my $name = 'Modern Perl';`\
  \ |\n| `my $address = \"Room 39, Valhalla\";` |\n\n单引号字符串中的字符完全如它们显示所示，但有两个例外。要在单引号字符串内部包含单引号，你必须使用反斜杠对其进行转义：\n\
  \n| `my $reminder = 'Don\\'t forget the quote!';` |\n\n要在字符串末尾包含反斜杠，请使用另一个反斜杠进行转义。否则\
  \ Perl 会认为你正试图转义定界符：\n\n| `my $exception = 'This string ends with a backslash:\\\
  \\` |\n\n双引号字符串提供了更多选项，例如编码字符串中的不可见字符：\n\n| `my $tab = \"\\t\";` |\n| `my $newline\
  \ = \"\\n\";` |\n| `my $carriage = \"\\r\";` |\n| `my $formfeed = \"\\f\";` |\n\
  | `my $backspace = \"\\b\";` |\n\n由此推断，你有多种方式表示同一个逻辑字符串。你可以通过输入 `\\t` 转义序列或按下 Tab\
  \ 键在字符串中包含制表符。这两个字符串对 Perl 来说相同，尽管它们在源代码中的表示可能不同。\n\n字符串声明可以跨越（并包含）换行，因此这两个声明是等价的：\n\
  \n| `my $escaped = \"two\\nlines\";` |\n| `my $literal = \"two` |\n| `lines\";`\
  \ |\n\n| `is $escaped, $literal, 'equivalent \\n and newline';` |\n\n此示例使用 `Test::More`\
  \ 证明了 Perl 认为这些行等价的断言。关于其工作原理的细节，请参阅 测试。\n\n```perl\nuse Test::More;\nis $escaped,\
  \ $literal, 'equivalent \\n and newline';\ndone_testing();\n```\n\n\n\n\n但转义序列对人类来说更容易读。\n\
  \nPerl 字符串具有可变长度——而不是固定长度。当你修改和操作它们时，Perl 会自动为你更改它们的大小。使用连接运算符 `.` 来组合多个字符串：\n\n\
  |  | `my $kitten = 'Choco' . ' . . 'Spidermonkey';` |\n\n尽管像这样连接三个字面量字符串对 Perl 来说最终与编写单个字符串是一样的。\n\
  \n当你在双引号字符串中内值标量变量的值或数组的值时，变量当前的内容将成为字符串的一部分，就像你将它们连接了一样：\n\n|  | `my $factoid =\
  \ \"$name *lives at* $address!\";` |\n|  |  |\n|  | `# 等于` |\n|  | `my $factoid\
  \ = $name . ' lives at ' . $address . '!'`` |\n\n通过在前面加一个反斜杠进行转义，可以在双引号字符串内部包含字面双引号：\n\
  \n|  | `my $quote = \"\\\"\\\"Ouch,\\\", he cried. \\\"That _hurt_!\\\"\";` |\n\n\
  反复使用反斜杠有时会变得难以处理。引用运算符允许你选择另一种字符串分隔符。`q` 运算符表示单引号（不进行插值），而 `qq` 运算符提供双引号行为（进行插值）。紧跟在运算符后的字符决定了用作分隔符的字符。如果该字符是平衡对的起始字符——例如大括号——那么结束字符将是最后一个分隔符。否则，该字符本身将同时作为起始和结束分隔符。\n\
  \n|  | `my $quote = qq{\"Ouch}\", he said. \"That _hurt_!\"};` |\n|  | `my $reminder\
  \ = q^Don't escape the single quote!^;` |\n|  | `my $complaint = q{It's too early\
  \ to be awake.};` |\n\n使用 heredoc 语法将多行赋值给字符串：\n\n|  | `my $blurb =<<'END_BLURB';`\
  \ |\n|  | He looked up. \"Change is the constant on which they all can agree. We*\
  \ |\n|  | instead, born out of time, remain perfect and perfectly self-aware.* |\n\
  |  | We only suffer change as we pursue it. It is against our nature. We* |\n| \
  \ | rebel against that change. Shall we consider them greater for it?\"* |\n|  |\
  \ END_BLURB |\n\n这种语法包含三个部分。双尖角引入了 heredoc。引号决定了 heredoc 是遵循单引号还是双引号行为；双引号行为是默认值。`END_BLURB`\
  \ 是一个由程序员选择的任意标识符，用作结束分隔符。\n\n无论 heredoc 声明本身的缩进如何，结束分隔符必须从行首开始：\n\n|  | `sub some_function\
  \ {` |\n|  | `my $ingredients =<<'END_INGREDIENTS';` |\n|  | Two eggs |\n|  | One\
  \ cup flour |\n|  | Two ounces butter |\n|  | One-quarter teaspoon salt |\n|  |\
  \ One cup milk |\n|  | Season to taste |\n|  | END_INGREDIENTS |\n|  | } |\n\n如果标识符以空白字符开头，那么在结束分隔符之前也必须存在相同的空白字符——也就是说，\n\
  \n|  | `<<' END_HEREDOC';` |\n\n在 `END_HEREDOC` 之前需要一个前空格。然而，如果你缩进了标识符，Perl 不会从\
  \ heredoc 每一行的开头移除等量的空白。记住这个设计上的缺陷；它最终会让你感到意外。\n\n在非字符串语文中使用字符串将导致强制转换（Coercion）。\n\
  \n### Unicode 与字符串\n\nUnicode 是一种用于表示世界各国书面语言的系统。大多数英语文本使用仅 127 个字符的字符集（需要 7 位存储空间，并很好地放入\
  \ 8 位字节中），但认为你某一天不会需要变音符号（umlaut）是天真的。\n\nPerl 字符串可以表示两种独立但相关的数据类型之一：\n\n#### Unicode\
  \ 字符序列\n每个字符都有码点（codepoint），这是一个在 Unicode 字符集中标识它的唯一数字。\n\n### 字节序列\n字节序列中的二进制数据——8\
  \ 位数字序列（octets），每个数字可以表示 0 到 255 之间的数字。\n\n| 词汇很重要 |\n| --- |\n| ![images/aside-icons/warning.png](img/warning.png)\
  \ | 为什么是 octet 而不是 byte？octet 是无歧的 8 位。byte 可能是更少或更多位，取决于晦涩的硬件。假设一个字符适合 1 个字节会给你带来无尽的\
  \ Unicode 苦恼。将内存存储概念与字符表示分开。忘记你曾听过字节。 |\n\nUnicode 字符串和二进制字符串在表面上看起来相似。它们都有 `length()`。它们都支持标准的字符串操作，如连接、分割和正则表达式处理（Regular\
  \ Expressions and Matching（正则表达式与匹配)）。任何不是纯二进制数据的字符串都是文本数据，因此应该是 Unicode 字符序列。\n\
  \n然而，由于你的操作系统在磁盘上、来自用户或通过网络表示数据的方式——作为字节序列——Perl 无法知道你读取的数据是图像文件、文本文档还是其他任何。默认情况下，Perl\
  \ 将所有输入数据视为字节序列。赋予这些数据意义取决于你。\n\n#### 字符编码\n\nUnicode 字符串是表示字符序列的字节序列。Unicode 编码将字节序列映射到字符。某些编码（如\
  \ UTF-8）可以编码 Unicode 字符集中的所有字符。其他编码仅表示 Unicode 字符的子集。例如，ASCII 编码纯英语文本（不允许带重音字符），而\
  \ Latin-1 可以表示大多数使用拉丁字母的语言的文本（变音符号、重音和扬抑符号等）。 |\n\n| 演进中的标准 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ | Perl 5.16 支持 Unicode 6.1 标准，5.18 支持 6.2 标准，5.20 支持 6.3 标准，5.22 支持 7.0 标准。详阅\
  \ [`unicode.org/versions/`](http://unicode.org/versions/)。 |\n\n为了避免大多数 Unicode\
  \ 问题，请在程序的输入和输出处始终对相应的编码进行解码和编码。再读一遍这句话。记住它。你以后会感谢此的。\n\n#### 句柄中的 Unicode\n\n当你告诉\
  \ Perl 特定的句柄（Files | 使用 utf8::all 模块为程序中的所有句柄添加 UTF-8 IO 层。该模块还启了其他各种 Unicode 特性。它非常方便，但它是一个粗略的工具，不能替代对你的程序需要做什么的理解。\
  \ |\n\n#### 数据中的 Unicode\n\n核心模块 Encode 的 `decode()` 函数将字节序列转换为 Perl 的内部 Unicode\
  \ 表示。相应的 `encode()` 函数将 Perl 的内部编码转换为所需的编码：\n\n|  | `my $from_utf8 = decode('utf8',\
  \ $data);` |\n|  | `my $to_latin1 = encode('iso-8859-1', $string);` |\n\n\n\n\n\
  为了妥善处理 Unicode，你必须始终通过已知的编码对输入数据进行解码，并对输出数据进行已知的编码。再次强调，你必须知道你期望消费和产生什么类型的数据。具体化将帮助你避免各种麻烦。\n\
  \n## 程序中的 Unicode\n\n在源代码中使用 Unicode 字符最简单的方法是使用 `utf8` 编译指令（Pragmas），它会告诉 Perl\
  \ 解析器将文件的剩余部分解码为 UTF-8 字符。这允许你在字符串和标识符中使用 Unicode 字符：\n\n| | `use utf8;` |\n| |\
  \ |\n| | `sub pound_to_yen { ... }` |\n| | |\n| | `my $yen = pound_to_yen('1000pound');`\
  \ |\n\n编写这段代码时，你的文本编辑器必须理解 UTF-8，并且必须使用相应的编码保存文件。再次，任何两个与 Unicode 数据通信的程序必须对该数据的编码达成一致。\n\
  \n在双引号字符串中，你还可以使用 Unicode 转义序列来表示字符编码。`\\x{}` 语法表示单个字符；将字符的 Unicode 数字的十六进制形式放在大括号内：\n\
  \n| | `my $escaped_thorn = \"\\x{00FE}\";` |\n\n某些 Unicode 字符拥有名称，这使得其他程序员更容易阅读。使用\
  \ `charnames` 编译指令通过 `\\N{}` 转义语法启用命名字符：\n\n| | `use charnames ':full';` |\n| |\
  \ `use Test::More tests => 1;` |\n| | |\n| | `my $escaped_thorn = \"\\x{00FE}\"\
  ;` |\n| | `my $named_thorn = \"\\N{LATIN SMALL LETTER THORN}\";` |\n| | |\n| | `is\
  \ $escaped_thorn, $named_thorn,` |\n| | `'Thorn equivalence check';` |\n\n你可以在正则表达式以及任何其他合法使用字符串或字符的地方使用\
  \ `\\x{}` 和 `\\N{}` 形式。\n\n## 隐式转换\n\nPerl 中大多数 Unicode 问题源于一个事实：字符串可以是字节（octets）序列，也可以是字符序列。Perl\
  \ 允许你通过隐式转换来组合这些类型。当这些转换出错时，它们很少显而易见地错误，但往往会以难以调试的方式产生极其离谱的错误。\n\n当 Perl 将字节序列与\
  \ Unicode 字符序列拼接时，它会隐式地使用 Latin-1 编码对字节序列解码。生成的字符串将包含 Unicode 字符。当你打印 Unicode 字符时，Perl\
  \ 将使用 `UTF-8` 对字符串进行编码，因为 `Latin-1` 无法表示所有的 Unicode 字符——`Latin-1` 是 `UTF-8` 的子集。\n\
  \n编码与字节之间的不对称可能导致 Unicode 字符串被编码为 `UTF-8` 输出，却被作为 `Latin-1` 解码。糟糕糟糕，当文本仅包含不带重音的英语时，该\
  \ Bug 会被隐藏，因为两种编码对每个字符都使用相同的表示方式。你现在不需要理解这一切；只需知道这种行为会发生，而且这不是你想要的。\n\n| | `my $hello\
  \ = \"Hello, \";` |\n| | `my $greeting = $hello . $name;` |\n\n如果 `$name` 包含 Alice，你永远不会发现任何问题，因为\
  \ `Latin-1` 的表示方式与 `UTF-8` 的表示相同。如果 `$name` 包含 José，`$name` 可能包含多个值：\n* `$name`\
  \ 包含四个 Unicode 字符。\n* `$name` 包含四个 `Latin-1` 字节。\n* `$name` 包含五个 `UTF-8` 字节。\n\n\
  字符串字面量有几种情况：\n* 它是一个 ASCII 字面量并包含字节：`my $hello = \"Hello, \";`\n* 它是一个没有编码的 `Latin-1`\
  \ 字符串字面量并包含字节：`my $hello = \"Hola, \";`\n* 它是一个非 ASCII 字面量（`utf8` 编译指令已生效）并包含 Unicode\
  \ 字符：`my $hello = \"Hola, \";`\n\n如果 `$hello` 和 `$name` 都是 Unicode 字符串，拼接将产生另一个\
  \ Unicode 字符串。如果两个字符串都是字节序列，Perl 将它们拼接成一个新的字节序列。如果两个值都属于相同编码的字节——例如 `Latin-1`——则拼接将正常工作。如果字节不共享相同的编码——例如在\
  \ `Latin-1` 数据后附加 `UTF-8` 数据——那么生成的字节序列在两种情况下都不合逻辑。\n\n如果只有其中一个值是 Unicode 字符串，Perl\
  \ 将另一个值解码为 `Latin-1` 数据。如果这不是正确的编码，生成的 Unicode 字符将是错误的。例如，如果用户输入是 `UTF-8` 数据而字符串字面量是\
  \ Unicode 字符串，名称将被错误地解码为五个 Unicode 字符以形成 `José` (sic)，因为 `UTF-8` 数据在解码为 `Latin-1`\
  \ 数据时含义完全不同。\n\n再次，如果你记住这一点，就不需要遵循所有的细节：始终在输入时解码，在输出时编码。\n\n参见 `perluni` 以获取关于 Unicode、编码以及在\
  \ Unicode 世界中管理输入输出数据的更详细解释。有关在整个程序中管理 Unicode 的更多详细信息，请参考 Tom Christiansen 对“为什么\
  \ Modern Perl 默认避免使用 UTF-8？”的回答以及他的“Perl Cookbook”系列。\n\n| Unicode Strings |\n|\
  \ :--- |\n| | 有关 `unicode_strings` 特性的信息，请参见相应的特征指令。 |\n\n## 数字\n\nPerl 支持作为整数和浮点值的数字。你可以使用科学计数法表示它们，也可以使用二进制、八进制和十六进制形式：\n\
  \n| | `my $integer = 42;` |\n| | `my $float = 0.007;` |\n| | `my $sci_float = 1.02e14;`\
  \ |\n| | `my $binary = 0b101010;` |\n| | `my $octal = 052;` |\n| | `my $hex = 0x20;`\
  \ |\n| | `# only in Perl 5.22` |\n| | `my $hex_float = 0x1.0p-3;` |\n\n数字前缀 `0b`、`0`\
  \ 和 `0x` 分别指定二进制、八进制和十六进制表示。请注意，整数前的零始终表示八进制模式。\n\n| 当 `1.99 + 1.99` 等于 `4` 时 |\n\
  | :--- |\n| | 虽然你可以显式地以完美精度编写浮点值，但 Perl——与大多数编程语言一样——在内部以二进制格式表示它们。这种表示法在特定情况下是不精确的；更多细节请咨询\
  \ `perldoc pernumber`。Perl 5.22 允许你使用浮点值的十六进制表示，以保持最大的精度。更多信息请参见 `perldoc perldata`\
  \ 中的“Scalar value constructors”。 |\n\n你不能在数字字面量中使用逗号分隔千位，因为解析器会将其解释为逗号操作符。相反，请使用下划线。这三个示例是等价的，尽管第二个的可读性可能：\n\
  \n| | `my $billion = 1000000000;` |\n| | `my $billion = 1_000_000_000;` |\n| | `my\
  \ $billion = 10_0_00_00_0_0_0;` |\n\n由于强制转换 (Coercion)，Perl 程序员很少需要将输入数据转换为数字。在数字上下文中求值时，Perl\
  \ 会将任何像数字的东西视为数字。在需要在不进行数字求值的情况下判断某物是否像数字的少数情况下，请使用核心模块 `Scalar::Util` 中的 `looks_like_number`\
  \ 函数。如果 Perl 认为给定参数是数字，则该函数返回真值。\n\n\n\n\nCPAN 中的 `Regexp::Common` 模块提供了几个经过测试的正则表达式，用于识别更特定类型的数值，如整数、整型数值和浮点值。\n\
  \n| 数值大小限制 |\n| --- |\n| ![images/aside-icons/note.png](img/note.png) | 在 Perl 中可以表示的最大值大小是多少？这取决于情况；你可能使用的是\
  \ 64 位版本，因此最大的整数是 `(2**31) - 1`，最小的是 `-(2**31)`——更多详细信息请参见 perldoc perlnumber。使用\
  \ `Math::BigInt` 和 `Math::BigFloat` 来处理更大、更小或更精确数字。 |\n\n### Undef\n\nPerl 的 `undef`\
  \ 值表示未赋值、未定义且未知的值。已声明但未定义的标量变量包含 `undef`：\n\n| | |\n|---|---|\n| | `my $name = undef;\
  \ # 不必要的赋值` |\n| | `my $rank; # 也包含 undef` |\n\n`undef` 在布尔上下文中求值为假。在字符串上下文中评估 `undef`——例如将其值到字符串中——\n\
  \n| | |\n|---|---|\n| | `my $undefined;` |\n| | `my $defined = $undefined . '...\
  \ and so forth';` |\n\n会产生未初始化值警告：\n\n```\nUse of uninitialized value $undefined\
  \ in concatenation (.) or string...\n```\n\n`defined` 内置函数如果其操作数求值为定义值（`undef` 除的任何值），则返回真值：\n\
  \n| | |\n|---|---|\n| | `my $status = 'suffering from a cold';` |\n| | |\n| | `say\
  \ defined $status; # 1，这是一个真值` |\n| | `say defined undef; # 空字符串；一个假值` |\n\n###\
  \ 空列表\n\n在赋值的右侧使用时，`()` 结构表示空列表。在标量上下文中，它求值为 `undef`。在列表上下文中，它是一个空列表。在赋值的左侧使用时，`()`\
  \ 结构强制实施列表上下文，因此这种惯用法可以在不使用临时变量的情况下，计算列表上下文中表达式返回的元素个数：\n\n```\nmy $count = () =\
  \ get_clown_hats();\n```\n\n由于赋值运算符的右结合性，Perl 首先通过在列表上下文中调用 `get_clown_hats()` 执行第二次赋值。这产生了一个列表。\n\
  \n向空列表赋值会丢弃列表中的所有值，但该赋值发生在标量上下文中，其求值为赋值右侧的项目数量。结果，`$count` 包含了 `get_clown_hats()`\
  \ 返回的列表元素个数。\n\n这种惯用法通常会困扰新程序员，但通过练习，你将理解 Perl 的基本设计特性是如何结合的。\n\n### 列表\n\n列表是用逗号分隔的一个或多个表达式的组。列表可以以值的形式直接出现在源代码中：\n\
  \n```\nmy @first_fibs = (1, 1, 2, 3, 5, 8, 13, 21);\n```\n\n或者作为赋值的目标\n\n```\nmy\
  \ ($package, $filename, $line) = caller();\n```\n\n或者作为表达式列表\n\n```\nsay name(),\
  \ ' => ', age();\n```\n\n括号并不创建列表。逗号运算符创建列表。这些示例中的括号仅仅是为了对表达式进行分组以改变它们的优先级。\n\n\
  作为不带括号列表的示例，使用范围运算符来创建紧凑形式的字面量列表：\n\n```\nmy @chars = 'a' .. 'z';\nmy @count = 13\
  \ .. 27;\n```\n\n使用 `qw()` 运算符根据空白字符分割字面量字符串，以产生字符串列表。由于这是一个引用运算符，你可以选择任何喜欢的分隔符：\n\
  \n```\nmy @stooges = qw! Larry Curly Moe Shemp Joey Kenny !\n```\n\n| 请勿注释 |\n|\
  \ --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 如果 `qw()` 包含逗号或注释字符（`#`），Perl\
  \ 将发出警告，因为此类字符在 `qw()` 中不仅很罕见，而且它们的出现通常意味着错误。 |\n\n列表可以（并且通常会）作为表达式的结果出现，但这些列表不会以字面量形式出现在源代码中。\n\
  \n在 Perl 中，列表和数组不是可以互换的。列表是值。数组是容器。你可以将列表存储在数组中，也可以将数组强制转换为列表，但它们是独立的实体。例如，对列表进行索引始终发生在列表上下文中。对数组进行索引可以在标量上下文中（针对单个元素）或列表上下文中（针对切片）：\n\
  \n```\n# 现在不要担心细节\nmy @list = (1, 2, 3);\nprint $list[0]; # 标量上下文\nmy @slice = @list[0..1];\
  \ # 列表上下文\n```\n\n### 控制流\n\nPerl 的基本流非常直接。执行从开始开始一直持续到结束。\n\n### 分支指令\n\n`if` 指令当其表达式求值为真值时执行关联的动作：\n\
  \n```\nmy $status = 'suffering from a cold';\nsay defined $status; # 1，这是一个真值\n\
  say defined undef; # 空字符串；一个假值\n```\n\n`if` 指令改变后续发生的情况。表达式求值为真值：\n\n```\nif ($status\
  \ = 'suffering from a cold')\n```\n\n`if` 指令由多个表达式组成，这些表达式将被转换为布尔值：\n\n```\nif ($status\
  \ = 'suffering from a cold')\n```\n\n`if` 形式对其条件需要括号，但后置形式不需要。在后置形式中，添加括号可以明确代码意图：\n\
  \n```\ngreet_user() if ($name == 'Bob');\n```\n\n`unless` 指令是 `if` 的否定形式。当表达式求值为假值时，Perl\
  \ 将执行动作：\n\n```\nunless $name == 'Bob';\n```\n\n像 `if` 一样，`unless` 也有块形式，尽管许多程序员避免使用因为它可能引起混淆：\n\
  \n```\nunless (is_leap_year() and is_full_moon()) {\n    frolic();\n    gambol();\n\
  }\n```\n\n`unless` 非常适用于后置条件，特别是函数的参数验证：\n\n```\nsub frolic {\n    # 没有参数\n    return\
  \ unless @_;\n    for $chant (@_) { ... }\n}\n```\n\n`if` 和 `unless` 的块形式都支持 `else`\
  \ 指令，当条件表达式不符合相应值时提供一个执行的块：\n\n```\nif ($name == 'Bob') {\n    say 'Hi, Bob!';\n\
  \    greet_user();\n} else {\n    say 'I don't know you.';\n    shun_user();\n}\n\
  ```\n\n`else` 块允许你相互相互重写 `if` 和 `unless` 条件：\n\n```\nunless ($name == 'Bob') {\n\
  \    say 'I don't know you.';\n    shun_user();\n} else {\n    say 'Hi, Bob!';\n\
  }\n```\n\n\n\n\n\n```perl\ngreet_user();\n}\n```\n\n然而，在 `else` 块中使用 `unless` 会产生隐含的双重否定，这可能会令人困惑。这个例子可能是你唯一一次看到这种写法。\n\
  \nPerl 同时提供了 `if` 和 `unless` 来允许你以最具可读性的方式表述条件语句，Perl 也同时具有正向和否定条件运算符：\n\n```perl\n\
  if ($name ne 'Bob') {\n    say \"I don't know you.\";\n    shun_user();\n}\nelse\
  \ {\n    say 'Hi, Bob!';\n    greet_user();\n}\n```\n\n但 `else` 块的存在所蕴含的双重否定可能难以阅读。\n\
  \n使用一个或多个 `elsif` 指令来检查多个互斥的条件：\n\n```perl\nif ($name eq 'Robert') {\n    say 'Hi,\
  \ Bob!';\n    greet_user();\n} elsif ($name eq 'James') {\n    say 'Hi, Jim!';\n\
  \    greet_user();\n} elsif ($name eq 'Armando') {\n    say 'Hi, Mando!';\n    greet_user();\n\
  } else {\n    say \"You're not my uncle.\";\n    shun_user();\n}\n```\n\n`unless`\
  \ 链也可以使用 `elsif` 块，但祝你好好运能读懂它。\n\nPerl 既不支持 `elseunless` 支持 `else if`。出于审美考虑以及对\
  \ Ada 编程语言传统的习惯，Larry 更倾向于使用 `elsif`：\n\n```perl\nif ($name eq 'Rick') {\n    say\
  \ 'Hi, cousin!';\n}\n# warning; syntax error\nelse if ($name eq 'Kristen') {\n \
  \   say 'Hi, cousin-in-law!';\n}\n```\n\n### 三元运算符\n\n三元条件运算符评估一个条件表达式并返回两个替代方案之一：\n\
  \n```perl\nmy $time_suffix = after_noon($time) ? 'afternoon' : 'morning';\n\n# 等效于\n\
  my $time_suffix;\nif (after_noon(time)) {\n    $time_suffix = 'afternoon';\n}\n\
  else {\n    $time_suffix = 'morning';\n}\n```\n\n条件表达式位于问号（`?`）之前。冒号（`:`）字符分隔两个替代方案。替代方案可以是任意复杂度的表达式——包括其他三元条件表达式，但请优先考虑清晰性而非简洁。\n\
  \n#### Lvalues 与三元运算符\n\n| | --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | 一种有趣但冷僻的用法使用三元运算符在替代变量之间进行选择，而不仅仅是值：`push @{ rand() > 0.5 ? @red_team : @blue_team\
  \ }, Player->new;` |\n\n#### 短路逻辑\n\nPerl 在遇到复杂的条件表达式时表现出短路行为。当 Perl 能够在不评估每个子表达式的情况下，确定整个表达式会成功或失败时，它就不会评估后续的子表达式。这在以下示例中最为明显：\n\
  \n```perl\nsay 'Both true!' if ok 1, 'subexpression one' && ok 1, 'subexpression\
  \ two';\ndone_testing();\n```\n\n`ok()` 的返回值是由第一个参数产生的布尔值，因此该示例输出：\n\n```\nok 1\
  \ - subexpression one\nok 2 - subexpression two\nBoth true!\n```\n\n当第一个子表达式——即第一次调用\
  \ `ok`——评估为真值时，Perl 必须评估第二个子表达式。如果第一个子表达式评估为假值，则没有必要检查后续的子表达式，因为整个表达式无法成功：\n\n```perl\n\
  say 'Both true!' if ok 0, 'subexpression one' && ok 1, 'subexpression two';\n```\n\
  \n此示例输出如下：\n\n```\nnot ok 1 - subexpression one\n```\n\n尽管第二个子表达式显然会成功，Perl 也永远不会评估它。同样的短路行为在逻辑或操作中显而易见：\n\
  \n```perl\nsay 'Either true!' if ok 1, 'subexpression one' || ok 1, 'subexpression\
  \ two';\n```\n\n此示例输出：\n\n```\nok 1 - subexpression one\nEither true!\n```\n\n第一个子表达式——即第一次调用\
  \ `ok`——评估为真值时，Perl 必须评估第二个子表达式。如果第一个子表达式评估为假值，则没有必要检查后续的子表达式，因为整个表达式无法成功：\n\n```perl\n\
  say 'Both true!' if ok 0, 'subexpression one' && ok 1, 'subexpression two';\n```\n\
  \n同样的短路行为在逻辑或操作中显而易见：\n\n```perl\nsay 'Either true!' if ok 1, 'subexpression one'\
  \ || ok 1, 'subexpression two';\n```\n\n\n\n\n当 `for` 循环使用迭代变量时，该变量的作用域限于循环内部的块。Perl\
  \ 会将此词法变量赋值为迭代中每个项的值。Perl 不修改主题变量 `$_`。如果你在外层作用域中声明了词法变量 `$i`，它的值在循环外依然存在：\n\n```perl\n\
  my $i = 'cow';\n\nfor my $i (1 .. 10) {\n    say \"$i *** $i *= \", $i * $i;\n}\n\
  is $i, 'cow', 'Value preserved in outer scope';\n```\n\n即使你没有将迭代变量重新声明为词法变量，而是保持将迭代值声明为词法变量的习惯，这种局部化也会发生：\n\
  \n```perl\nmy $i = 'horse';\nfor $i (1 .. 10) {\n    say \"$i *** $i *= \", $i *\
  \ $i;\n}\nis $i, 'horse', 'Value preserved in outer scope';\n```\n\n### 迭代与别名（Aliasing）\n\
  \n`for` 循环将迭代器别名为迭代中的值，因此对迭代器值的任何修改都会直接修改原有值：\n\n```perl\nmy @nums = 1 .. 10;\n\
  $_ *= 2 for @nums;\nis $nums[0], 1, '1 * 1 is 1';\nis $nums[1], 4, '2 * 2 is 4';\n\
  ...\nis $nums[9], 100, '10 * 10 is 100';\n```\n\n这种别名机制也适用于块风格 `for` 循环：\n\n```perl\n\
  for my $num (@nums) {\n    $num *= 2;\n}\n```\n\n同样适用于使用主题变量的迭代：\n\n```perl\nfor\
  \ (@nums) {\n    $_ *= 2;\n}\n```\n\n然而，你不能使用别名来修改常量值。Perl 会产生一个关于修改只读值的异常：\n\n\
  ```perl\n$_++ and say for qw( Huex Dewex Louid );\n```\n\n你偶尔可能会看到将 `for` 配合单个标量变量使用：\n\
  \n```perl\nfor ($user_input) {\n    s/\\A\\s+//; # 修剪前面的空格\n    s/\\s+\\z//; # 修剪后面的空格\n\
  \    $_ = quotemeta; # 转义非单词字符\n}\n```\n\n这种用法（Idioms）利用迭代运算符来实现别名 `$_` 的副作用，尽管直接操作命名变量本身会更清晰。\n\
  \n### 迭代与作用域\n\n主题变量的迭代作用域有一个微妙的陷阱。考虑一个刻意修改 `$_` 的函数 `topic_mangler()`。如果代码在调用名为\
  \ `topic_mangler()` 的列表迭代时没有保护 `$_`，你将花费一些时间来调试其影响：\n\n```perl\nfor (@values) {\n\
  \    topic_mangler();\n}\nsub topic_mangler {\n    s/foo/bar/;\n}\n```\n\n`topic_mangler()`\
  \ 中的 `s/foo/bar/` 会就地修改 `@values` 的元素。如果你必须使用 `$_` 而不是命名变量，请使用 `for` 的主题别名行为：\n\n\
  ```perl\nsub topic_mangler {\n    # 原本是 $_ = shift;\n    for (shift) {\n       \
  \ s/foo/bar/;\n        s/baz/quux/;\n        return $_;\n    }\n}\n```\n\n或者，在 `for`\
  \ 循环中使用命名迭代变量。这几乎总是最正确的建议。\n\n### C 风格循环\n\nC 风格的 `for` 循环要求你管理迭代的条件：\n\n```perl\n\
  for (my $i = 0; $i <= 10; $i += 2) {\n    say \"$i *= \", $i;\n}\n```\n\n你必须在循环结构中显式地为迭代变量赋值，因为此循环既不执行别名，也不对主题变量赋值。虽然在循环中声明的任何变量的作用域都是循环块，但\
  \ Perl 不会限制循环外声明变量的词法作用域：\n\n```perl\nmy $i = 'pig';\nfor ($i = 0; $i <= 10; $i\
  \ += 2) {\n    say \"$i *= \", $i;\n}\nis $i, 'pig', 'overwritten with number';\n\
  ```\n\n循环结构可以包含三个子表达式。第一个子表达式——初始化——在循环体执行之前执行一次。Perl 在每次循环体迭代之前评估第二个子表达式——条件比较。当该表达式评估为真值时，迭代继续。当它评估为假值时，迭代停止。最后一个子表达式在每次循环体迭代后执行。\n\
  \n```perl\nfor (\n    my $i = 0,\n    $i < 10,\n    $i++\n) {\n    say \"$i *= \"\
  , $i;\n}\n```\n\n注意最后一个子表达式后面没有分号，并且使用了逗号运算符和低优先级；这种语法非常奇特地挑剔。在可能的情况下，优先使用 `foreach`\
  \ 风格的循环而不是 `for` 循环。\n\n所有三个子表达式都是可选的。这里显示了一个无限 `for` 循环：\n\n```perl\nfor (;;) {\
  \ ... }\n```\n\n### While 和 Until\n\n`while` 循环持续执行，直到条件表达式评估为假值。这里有一个惯例的无限循环：\n\
  \n```perl\nwhile (1) { ... }\n```\n\n与迭代 `foreach` 风格循环不同，`while` 循环的条件没有副作用。如果\
  \ `@values` 包含元素，此代码也是一个无限循环，因为在标量上下文中评估 `@values` 会得到真值：\n\n```perl\nwhile (@values)\
  \ {\n    say $values[0];\n}\n```\n\n为了防止这种无限 `while` 循环，可以在每次迭代中对 `@values` 进行破坏性更新：\n\
  \n```perl\nwhile (@values) {\n    my $value = shift @values;\n    say $value;\n\
  }\n```\n\n在 `while` 条件检查中修改 `@values` 也可行，但它与每个值的真值有一些微妙之处：\n\n```perl\nwhile (my\
  \ $value = shift @values) {\n    say $value;\n}\n```\n\n当作为条件表达式的赋值表达式评估为假值时，该循环将退出。如果是这样做，请添加注释。\n\
  \n`until` 循环反转了 `while` 循环的逻辑。当循环条件值为假值时，迭代继续：\n\n```perl\nuntil ($finished_running)\
  \ {\n    ...\n}\n```\n\n`while` 循环的标准用法是从文件句柄迭代输入：\n\n```perl\nwhile (<$fh>) {\n\
  \    # 删除换行符\n    chomp;\n    ...\n}\n```\n\nPerl 将此 `while` 循环解释为你写了以下内容：\n\n```perl\n\
  while (defined($_ = <$fh>)) {\n    # 删除换行符\n    chomp;\n    ...\n}\n```\n\n如果没有隐\
  \ `defined`，从文件句柄读取的任何在标量上下文中评估为假的行（空行或仅包含字符 0 的行）都会结束循环。`<>` 只有在到达文件末尾时才会返回未定义值。\n\
  \n`while` 和 `until` 都有后置形式，例如无限循环 `1 while 1`。任何单个表达式适用于后置 `while` 或 `until`，包括\
  \ 20 世纪 80 年代 8 位计算机经典的“Hello, world!”示例：\n\n```perl\nprint \"Hello, world!\" while\
  \ 1;\n```\n\n无限循环比看起来更有用，特别是对于 GUI 程序、程序解释器或网络服务器的事件循环：\n\n```perl\n$server->dispatch_results\
  \ until $should_shutdown;\n```\n\n使用 `do` 块将多个表达式组合为一个单元：\n\n```perl\ndo {\n```\n\
  \n\n\n\n```perl\nsay 'What is your name?';\nmy $name = {};\nchomp $name;\nsay \"\
  Hello, $name!\" if $name;\nuntil (eof);\n```\n\n`do` 块被解析为一个包含多个表达式的单一表达式。与 `while`\
  \ 循环的块形式不同，带有后置 `while` 或 `until` 的 `do` 块将至少执行一次体。这种结构比其他循环形式少见，但非常强大。\n\n### 嵌套循环\n\
  \n你可以在其他循环内部嵌套循环：\n\n```perl\nfor my $suit (@suits) {\n    for my $values (@card_values)\
  \ { ... }\n}\n```\n\n注意声明迭代变量的值！否则，与主题变量及其作用域产生混淆的可能性太大了。\n\n新手在嵌套 `foreach` 和 `while`\
  \ 循环时，经常会意外地耗尽文件句柄：\n\n```perl\nuse autodie 'open';\nopen my $fh, '<', $some_file;\n\
  \nfor my $prefix (@prefixes) {\n    while (<$fh>) { # 不要使用；有 Bug 的代码\n        say\
  \ $prefix, $_;\n    }\n}\n```\n\n在 `for` 循环外部打开文件句柄，会导致 `for` 循环的每次迭代之间文件位置保持不变。在第二次迭代时，`while`\
  \ 循环将无内容可读（`readline` 将返回假值）。你可以通过许多方法解决这个问题：在 `for` 循环内部重新打开文件（浪费但简单）、将整个文件读入内存（对于小文件效果最好），或者每次迭代时将文件句柄\
  \ seek 回文件开头：\n\n```perl\nfor my $prefix (@prefixes) {\n    while (<$fh>) {\n  \
  \      say $prefix, $_;\n    }\n    seek $fh, 0, 0;\n}\n```\n\n### 循环控制\n\n有时你必须在耗尽迭代之前跳出循环。Perl\
  \ 的标准控制机制——异常和返回——有效，但你也可以使用循环控制语句。\n\n`next` 语句将重启循环的下一次迭代。当你完成了当前迭代中需要的所有工作时，使用它。要遍历文件中的行并跳过以注释字符\
  \ `#` 开头的行，可以这样写：\n\n```perl\nwhile (<$fh>) {\n    next if /\\A*#/;\n    ...\n}\n\
  ```\n\n#### 多重退出对比 嵌套 If\n\n将 `next` 的用法与替代方案：将块的剩余部分封装在 `if` 中进行对比。现在考虑如果你有多个可能导致跳过某行的条件，会发生什么。带有后置条件的循环控制修饰符可以让你的代码可读性提高。\n\
  \n`last` 语句立即结束循环。要在看到结束标记后完成文件处理，请编写以下内容：\n\n```perl\nwhile (<$fh>) {\n    next\
  \ if /\\A*#/;\n    last if /\\A__END__/\n    ...\n}\n```\n\n`redo` 语句在不重新评估条件的情况下重启当前迭代。这在某些少数情况下非常有用，即你希望在原地修改已读取的行，然后从头开始重新处理，而不会让其被另一行覆盖。要实现一个合并以反斜杠结尾的行的愚蠢文件解析器，可以尝试如下：\n\
  \n```perl\nwhile (my $line = <$fh>) {\n    chomp $line;\n    # 匹配行尾的反斜杠\n    if\
  \ ($line =~ s{\\$}{}) {\n        $line .= <$fh>;\n        redo;\n    }\n    ...\n\
  }\n```\n\n嵌套循环可能会令人困惑，特别是带有循环控制语句时。如果你无法将内部循环提取为命名函数，请使用循环标签来明确你的意图：\n\n```perl\n\
  LINE:\nwhile (<$fh>) {\n    chomp;\n    PREFIX:\n    for my $prefix (@prefixes)\
  \ {\n        next unless $prefix;\n        say $prefix; # next 是隐式的\n    }\n}\n\
  ```\n\n### Continue\n\n`continue` 结构的行为类似于 `for` 循环的第三个表达式；由于正常重复或过早重新迭代，Perl 会在循环的后续迭代之前执行任何\
  \ `continue` 块。你可以在 `while`、`until` 或 `for` 中使用它。`continue` 的示例很罕见，但当你想要确保无论迭代如何结束，每次迭代都会发生事情时，它非常有用：\n\
  \n```perl\nwhile ($i < 10) {\n    next unless $i % 2;\n    say $i;\n}continue {\n\
  \    say 'Continuing...';\n    $i++;\n}\n```\n\n注意，当控制流由于 `last` 或 `redo` 离开循环时，`continue`\
  \ 块不会执行。\n\n### Switch 语句\n\nPerl 5.10 引入了一个名为 `given` 的新结构作为 Perl 风格的 switch。它并没有成功；`given`\
  \ 仍然是实验性的，即使在较新的版本中也有 Bug。除非你确切知道做什么，否则请避免使用。如果你需要 switch 语句，使用 `for` 为主题变量（`$_`）取别名，并使用\
  \ `when` 根据智能匹配语义与简单表达式进行匹配。以下是编写石头剪刀游戏的方法：\n\n```perl\nmy @options = (&rock, &paper,\
  \ &scissors);\nmy $confused = \"I't understand your move.\";\n\ndo {\n    say \"\
  石头、石头、剪刀! 请选一个： \";\n    chomp(my $user = <STDIN>);\n    my $computer_match = $options[rand\
  \ @options];\n    $computer_match->($user);\n}until (eof);\n\nsub rock {\n    print\
  \ \"I chose rock. \";\n    for (shift) {\n        when (/paper/) { say 'You win!';\
  \ }\n        when (/rock/) { say 'We tie!'; }\n        when (/scissors/) { say 'I\
  \ win!'; }\n        default { say $confused };\n    }\n}\n\nsub paper {\n    print\
  \ \"I chose paper. \";\n    for (shift) {\n        when (/paper/) { say 'We tie!';\
  \ }\n        when (/rock/) { say 'I win!'; }\n        when (/scissors/) { say 'You\
  \ win!'; }\n        default { say $confused };\n    }\n}\n\nsub scissors {\n   \
  \ print \"I chose scissors. \";\n    for (shift) {\n        when (/paper/) { say\
  \ 'I win!'; }\n        when (/rock/) { say 'You win!'; }\n        when (/scissors/)\
  \ { say 'We tie!'; }\n        default { say $confused };\n    }\n}\n```\n\n当没有匹配到其他条件时，Perl\
  \ 执行默认规则。添加斯波克和蜥蜴留给读者练习。\n\n### 尾调用 (Tailcalls)\n\n当函数内部最后一个表达式是对另一个函数的调用时，就会发生尾调用。外部函数的返回值变为内部函数的返回值：\n\
  \n```perl\nsub log_and_greet_person {\n    my $name = shift;\n    log(\"Greeting\
  \ $name\");\n    return greet_person($name);\n}\n```\n\n直接从 `greet_person()` 返回到\
  \ `log_and_greet_person()` 的调用者比返回到 `log_and_greet_person()` 再从 `log_and_greet_person()`\
  \ 返回更高效。直接返回是尾调用优化。\n\n\n\n\n深度递归的代码（递归）——尤其是递归代码——会消耗大量内存。尾调用（Tailcalls）可以减少控制流内部记录所需的内存，并使昂贵的算法变得更廉价。遗憾的是，Perl\
  \ 不会自动进行这种优化，因此在需要时必须手动完成。\n\n内置的 `goto` 运算符有一种形式，调用函数的方式就像当前函数从未被调用过一样，从本质上消除了新函数调用的记录工作。这种拙劣的语法让听过“永远不要使用\
  \ goto”的人感到困惑，但它确实有效：\n\n```perl\nsub log_and_greet_person {\n    my ($name) = @_;\n\
  \    log(\"Greeting $name\");\n    goto &greet_person;\n}\n```\n\n这个示例有两个重要特征。首先，`goto\
  \ &function_name` 或 `goto &$function_reference` 需要使用函数符号（`&`），以便解析器知道执行的是尾调用而不是跳转到标签。其次，这种形式的函数调用会将\
  \ `@_` 的内容隐式地传递给被调用的函数。如果你需要，可以修改 `@_` 来更改传递的参数。\n\n这种技术在你想要劫持控制流以避开其他检查调用者的函数时（例如当你正在实现特殊的日志记录或某种调试功能时），或者在使用需要大量递归的算法时最有用。如果需要请记住它，但也可以完全不使用它。\n\
  \n# 标量 (Scalars)\n\nPerl 的基础数据类型是标量（scalar）：单一的离散值。该值可以是字符串、整数、浮点数、文件句柄或引用——但它始终是一个单一值。标量可以是局域、包或全局（全局变量）变量。你只能声明局域或包变量。标量变量的必须符合标准的变量命名指南（名称）。标量变量始终使用开头的美元符号（`$`）（变量符号）。\n\
  \n| 符号体与上下文 |\n| --- |\n| ![images/aside-icons/note.png](img/note.png) 标量值和标量上下文之间有深层联系；赋值给标量会强制执行标量上下文。在聚合变量上使用标量符号可以在标量上下访问哈希或数组的单个元素。\
  \ |\n\n## 标量与类型\n\n标量变量可以包含任何类型的标量值，而无需特殊的转换、强制转换或类型转换。一旦赋值，标量变量中存储的值类型可以任意更改：\n\
  \n```perl\nmy $value;\n$value = 123.456;\n$value = 77;\n$value = \"I am Chuck's\
  \ big toe.\";\n$value = Store::IceCream->new;\n```\n\n尽管这段代码是合法的，但更改标量中存储的数据类型会令人困惑。\n\
  \n这种类型的灵活性通常会导致值强制转换（强制转换 (Coercion)）。例如，你可以将标量的内容视为字符串，即使你没有显式地将其赋值为字符串：\n\n```perl\n\
  my $zip_code = 97123;\nmy $city_state_zip = 'Hillsboro, Oregon' . ' ' . $zip_code;\n\
  ```\n\n你也可以在字符串上使用数学操作：\n\n```perl\nmy $call_sign = 'KBMIU';\n# 原地更新符号并返回新值\nmy\
  \ $next_sign = ++$call_sign;\n# 返回旧值，然后更新符号\nmy $curr_sign = $call_sign++;\n# 但这种写法无效：\n\
  my $new_sign = $call_sign + 1;\n```\n\n### 单向递增魔术\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ 这种魔法字符串递增行为没有对应的魔法递减行为。你无法通过编写 `$call_sign--` 来恢复之前的字符串值。 |\n\n这种字符串递增操作将 `a`\
  \ 变为 `b`，将 `z` 变为 `aa`，并遵循字符集和大小写。而 `ZZ9` 变为 `AAA0`，`ZZ09` 变为 `ZZ10`——当有更高位进可以递增时，数字会循环，就像汽车的里程表一样。\n\
  \n在字符串上下文中评估引用（引用 (References)）会产生一个字符串。在数值上下文中评估引用会产生一个数字。两种操作都不会原地修改引用，但你无法从任何一个结果中重新创建引用：\n\
  \n```perl\nmy $authors = [ ... ]; # （注意：此处提供的文本片段不完整，但逻辑是一的）\n```\n\n## 数组 (Arrays)\n\
  \nPerl 的数组类型是一种可以存储零或多个标量的聚合类型。`@` 符号表示数组。要声明数组，写道：\n\n```perl\nmy @items;\n```\n\
  \n### 数组元素\n\n使用标量符号（`$`）访问单个元素。数组的第一个元素位于索引 0 ：\n\n```perl\nmy $first_cat = @cats[0];\n\
  ```\n\n数组的最后一个元素取决于元素的数量。在标量上下文（由于标量赋值、字符串拼接、加法或布尔上下文）求值为元素的数量：\n\n```perl\nmy $num_cats\
  \ = @cats;\n```\n\n要获取数组最后一个元素的索引，从元素数量上减 1（因为数组索引从 0 开始），或使用 `#` 语法：\n\n```perl\n\
  my $first_index = 0;\nmy $last_index = @cats - 1;\n# 或\nmy $last_index = $#cats;\n\
  ```\n\n大多数时候，你更关心数组元素的相对位置。使用负数组索引来从末尾引用元素。数组的最后一个元素可以通过索引 -1 获取。数组的倒数第二个元素可以通过索引\
  \ -2 获取：\n\n```perl\nmy $last_cat = $cats[-1];\nmy $second_to_last_cat = $cats[-2];\n\
  ```\n\n\n\n\n\n$# 还有另一种用途：通过赋值给 `$array` 来就地调整数组大小。记住，Per 数组是可变的。它们会根据需要扩展或收缩。当你收缩数组时，Perl\
  \ 会丢弃无法放入调整大小后的数组中的值。当你扩展数组时，Perl 会用 `undef` 填充扩展的位置。\n\n### 数组赋值\n\n通过索引直接对数组中的单个位置进行赋值：\n\
  \n| | `my @cats;` |\n|---|---|\n| | `$cats[3] = 'Jack';` |\n| | `$cats[2] = 'Tuxedo';`\
  \ |\n| | `$cats[0] = 'Daisy';` |\n| | `$cats[1] = 'Petunia';` |\n| | `$cats[4] =\
  \ 'Brad';` |\n| | `$cats[5] = 'Choco';` |\n\n如果你向超出数组当前边界的索引赋值，Perl 会为你扩展数组。正如你所预期的那样，所有的中间位置都将包含\
  \ `undef`。在第一次赋值后，数组在位置 0、1 和 2 处包含 `undef`，在位置 3 处包含 `Jack`。\n\n作为赋值的快捷方式，可以通过列表初始化数组：\n\
  \n| | `my @cats = ('Daisy', 'Petunia', 'Tuxedo', ...);` |\n|---|---|\n\n但请记住，这些括号并没有创建一个列表。如果没有括号，由于运算符优先级（优先级），这会将\
  \ `Daisy` 赋值为数组的第一个也是唯一的元素。`Petunia`、`Tuxedo` 以及所有其他猫将在空上下文（void context）中被求值，Perl\
  \ 会报错。（其他猫也是如此，尤其是 `Petunia`。）\n\n你可以将任何产生列表的表达式赋值给数组：\n\n| | `my @cats = get_cat_list();`\
  \ |\n|---|---|\n| | `my @timeinfo = localtime();` |\n| | `my @nums = 1 .. 10;` |\n\
  \n向数组的标量元素赋值会强制标量上下文（scalar context），而向整个数组赋值则会强制列表上下文（list context）。\n\n要清空数组，请赋值一个空列表：\n\
  \n| | `my @dates = ( 1969, 2001, 2010, 2051, 1787 );` |\n|---|---|\n| | `...` |\n\
  | | `@dates = ();` |\n\n这是括号指示列表的极少数情况之一；如果没有东西来标记列表，Perl 和代码的阅读者会感到困惑。\n\n| 数组初始为空\
  \ |\n|---|---|\n| ![images/aside-icons/note.png](img/note.png) | `my @items = ();`\
  \ 是 `my @items` 的更长且更嘈杂的版本。新声明的数组是空的。不是“填满了 undef”的空。而是真正的空。 |\n\n### 数组操作\n\n有时，数组作为有序的、可变的项目集合，比作为索引到值的映射更方便。Perl\
  \ 提供了几项操作来操纵数组元素。\n\n`push` 和 `pop` 运算符分别从数组的末尾添加和移除元素：\n\n| | `my @meals;` |\n\
  |---|---|\n| | |\n| | `# 有什么吃的？` |\n| | `push @meals, qw( hamburgers pizza lasagna\
  \ turnip );` |\n| | |\n| | `# ... 但你的侄子讨厌蔬菜` |\n| | `pop @meals;` |\n\n你可以将一个值列表推入数组中，但一次只能弹出一个。`push`\
  \ 返回数组中元素的新数量。`pop` 返回被移除的元素。\n\n由于 `push` 作用于列表，你可以通过这种方式轻松追加多个数组的元素：\n\n| | `push\
  \ @meals, @breakfast, @lunch, @dinner;` |\n\n同样，`unshift` 和 `shift` 分别从数组的开头添加和移除一个元素：\n\
  \n| | `# 扩展我们的烹饪视野` |\n| | `unshift @meals, qw( tofu spanakopita taquitos );` |\n\
  | | |\n| | `# 重新考虑那个整个大豆子的想法` |\n| | `shift @meals;` |\n\n`unshift` 将一个元素列表插入到数组开头，并返回数组元素的新数量。`shift`\
  \ 移除并返回数组的第一个元素。几乎没有人使用这些返回值。\n\n`splice` 运算符根据给定的偏移量、列表切片的长度和替换元素，从数组中移除并替换元素。替换和移除都是可选的；你可以省略其中任何一个。`perlfunc`\
  \ 对 `splice` 的描述展示了它与 `push`、`pop`、`shift` 和 `unshift` 的等效性。一个有效用法是从数组中移除两个元素：\n\
  \n| | `my ($winner, $runnerup) = splice @finalists, 0, 2;` |\n| | |\n| | `# 或者`\
  \ |\n| | `my $winner = shift @finalists;` |\n| | `my $runnerup = shift @finalists;`\
  \ |\n\n`each` 运算符允许你通过索引和值遍历数组：\n\n```\nwhile (my ($position, $title) = each @books)\
  \ {\n    say $title;\n}\n```\n\n### 数组切片\n\n数组切片允许你在列表上下文中访问数组的元素。与元素的标量访问不同，这种索引操作接收一个零或多个索引的列表，并使用数组符号（`@`）：\n\
