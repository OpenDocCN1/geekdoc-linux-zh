  \nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 10 章：超越语法的 Perl\n\n“简单”对不同的人有不同的含义。有效的程序员理解\
  \ Perl 特性是如何交互和组合的。他们的代码利用了语言模式和惯用。这种 Perl 风格思维的结果是简洁、强大、流畅且实用的代码——当你理解它时，它是简单的。\n\
  \n## 惯用\n\n每种语言都有通用的表达模式，或称惯用。地球在旋转，但我们说太阳升起或落下。我们炫耀巧妙的 hack，但对糟糕的 hack 和代码气味感到局促。\n\
  \nPerl 也有自己的惯用；它们既是语言特性，也是设计技术。它们是赋予你的代码 Perl 口音的习和机制。你不必使用它们来完成工作，但它们发挥了 Perl 的优势。\n\
  \n### 作为 $self 的对象\n\nPerl 的对象系统 (Moose) 将方法的调用者视为一个普通的参数。无论你调用类方法还是实例方法，`@@` 的第一个元素始终是调用者。按照约定，大多数\
  \ Perl 代码使用 `$class` 作为类方法调用者的名称，使用 `$self` 作为对象调用者的名称。这种约定足够强大，使得像 Moops 这样的有用扩展假设你会使用\
  \ `$self` 作为对象调用者的名称。\n\n### 命名参数\n\nPerl 喜欢列表。列表是 Perl 的基础元素。列表展平和平绑定允许你链接多个表达式，以所有可能的方式操作数据。\n\
  \n虽然 Perl 参数传递的简单性（一切都平坦化为 `@@`）有时过于简单，但在列表上下文中从 `@@` 赋值允许你将命名参数解包成对。胖逗号（声明哈希）运算符将普通列表转换为显式的参数对列表：\n\
  \n```perl\nmake_ice_cream_sundae(\n    whipped_cream => 1,\n    sprinkles => 1,\n\
  \    banana => 0,\n    ice_cream => 'mint chocolate chip',\n);\n```\n\n你可以将这些参数解包到哈希中：\n\
  \n```perl\nsub make_ice_cream_sundae {\n    my %args = @_;\n    my $dessert = $args{ice_cream};\n\
  }\n```\n\n### 哈希还是引用？\n\n![Tip](img/tip.png)\n**哈希还是引用**：**最佳实践建议传递哈希引用。这允许 Perl\
  \ 执行调用者端的验证。如果你传递的参数数量错误，将获得错误。\n\n```perl\nsub import {\n    my ($class, %args)\
  \ = @_;\n    my $calling_package = caller();\n}\n```\n\n### 施瓦茨变换 (Schwartzian Transform)\n\
  \n施瓦茨变换是从 Lisp 借用的通用列表处理惯用的一种优雅演示。假设你有一个哈希，将同事的名称与其扩展名关联：\n\n```perl\nmy %extensions\
  \ = (\n    '00' => 'Damian',\n    '002' => 'Wesley',\n    '042' => 'Robin',\n  \
  \  '088' => 'Nic',\n);\n```\n\n#### 哈希键引号规则\n\n![Warning](img/warning.png)\n**哈希键引号规则**：胖逗号哈希键引号仅适用于看起来像裸字（barewords）的内容。由于前导零，这些键看起来像八进制数。每个人至少都会犯一次错误。\n\
  \n要按字母顺序对此列表排序，你必须根据哈希的值而不是键排序。正确排序值很容易：\n\n```perl\nmy @sorted_names = sort values\
  \ %extensions;\n```\n\n但你需要一个额外的步骤来保留名称和扩展名的关联，因此引入了施瓦茨变换。首先，将哈希转换为易于排序的数据结构列表——在这种情况下是两个元素的匿名数组：\n\
  \n```perl\nmy @pairs = map { [ $_, $extensions{$_} } keys %extensions;\n```\n\n\
  `sort` 接收这个匿名数组列表，并将它们的第二个元素（名称）作为字符串比较：\n\n```perl\nmy @sorted_pairs = sort { $a->[1]\
  \ cmp $b->[1] } @pairs;\n```\n\n\n\n\n传递给排序的块（sort block）接收两个包作用域的（作用域）变量作为参数：`$a`\
  \ 和 `$b`。（有关此作用域影响的详尽讨论，请参阅 `perldoc -f sort`。）排序块每次获取两个参数。第一个成为 `$a` 的内容，第二个成为\
  \ `$b` 的内容。如果 `$a` 在结果中应该排在 `$b` 之前，则该块必须返回 `-1`。如果两个值排序后的位置相同，则该块必须返回 `0`。最后，如果\
  \ `$a` 在结果中应该排在 `$b` 之后，该块应返回 `1`。任何其他返回值都是错误。\n\n| 了解数据 |\n| --- |\n| ![images/aside-icons/warning.png](img/warning.png)\
  \ | 如果没有重名的人，原地反转哈希表将是可行的。这个特定的数据集没有遇到这种问题，但请编写防御性代码。 |\n\n`cmp` 算符执行字符串比较，而 `<=>`\
  \ 执行数值比较。给定 `@sorted_pairs`，通过第二个 `map` 操作将数据结构转换为更易用的形式：\n\n```perl\nmy @formatted_exts\
  \ = map { \"*$_->*[1], ext.*$_->*[0]\" } @sorted_pairs;\n```\n\n现在你可以打印全部内容了：\n\n\
  ```perl\nsay for @formatted_exts;\n```\n\n施瓦茨变换（Schwartzian transformation）将所有这些表达式链在一起，以省略那些临时变量：\n\
  \n```perl\nsay for @formatted_exts =\nmap { \"*$_->*[1], ext.*$_->*[0]\" }\nsort\
  \ { $a->[1] cmp $b->[1] }\nmap { [ $_ => $extensions{$_} ] }\nkeys %extensions;\n\
  ```\n\n按照评估顺序从右到左读取该表达式。对于 `extensions` 哈希表中的每个键，创建一个包含键和值的两个元素的匿名数组。通过这些匿名数组的第二个元素（哈希值）对该列表进行排序。从这些排序后的数组格式化输出输出字符串。\n\
  \nmap-sort-map 的施瓦茨变换流水线将数据结构转换为另一种易于排序的形式，然后将其转换回原始形式——或另一种形式。\n\n虽然这个排序示例非常简单，但考虑为大文件计算加密哈希值的情况。施瓦茨变换特别有用，因为它通过在第一次执行的\
  \ `map` 中执行一次计算，有效地缓存了任何昂贵的计算。\n\n### 快速文件读取 (File Slurping)\n\n`local` 对于管理 Perl\
  \ 的魔术全局变量至关重要。你必须理解作用域（作用域）才能有效使用 `local`——但如果你这样做，就可以以有趣的方式使用紧凑且轻量的作用域。例如，你可以这样用一个表达式将文件读入一个标量：\n\
  \n```perl\nmy $file = do { local $/; <$fh> };\n```\n\n```perl\n# 或者\nmy $file; {\
  \ local $/; $file = <$fh> };\n```\n\n`$/` 是输入记录分隔符。将其局部化设置为 `undef` 以等待赋值。由于分隔符的值是未定义的，Perl\
  \ 会乐意地一次性读取文件句柄的所有内容。由于 `do` 块的值为块内最后一个评估的表达式的值，因此它的评估结果是从文件句柄读取的数据：文件的内容。在表达式结束时，`$/`\
  \ 恢复到之前的状态，`$file` 包含了文件的内容。\n\n第二个示例避免了包含文件内容的字符串的第二次拷贝；它没那么漂亮，但使用的内存最少。\n\n| File::Slurper\
  \ |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | 承认，这个实用的例子对于不理解 `local`\
  \ 和作用域的人来说是抓狂的。CPAN 来自 `File::Slurper` 模块是一个值得的（且通常更快）的替代方案。 |\n\n### 处理 main\n\n\
  许多程序在将处理交交给其他函数之前，通常会设置几个文件作用域的词法变量。直接使用这些变量而不是向函数传递值并从函数返回值是很有诱惑力的，特别是当程序增长时。遗憾的是，这些程序可能会依赖于\
  \ Perl 编译过程中发生的一些细微差别——你认为一个变量会被初始化为特定值，它可能直到很久之后才被初始化。记住，Perl 创建闭包（闭包）不需要特殊的语法——你可能会无意中捕获一个词法变量。\n\
  \n为了避免这种情况，将你程序的主代码封装在一个单一函数 `main()` 中。将你的变量封装到它们适当的作用域中。在使用完所有需要的模块和编译指令（pragmas）后，在程序的开头添加一行代码：\n\
  \n```perl\n#!/usr/bin/perl\nuse Modern::Perl;\nexit main( @ARGV );\nsub main {\n\
  \    ...\n    # 成功退出\n    return 0;\n}\nsub other_functions { ... }\n```\n\n在程序中任何内容之前调用\
  \ `main()` 强制你对初始化和编译顺序进行显式说明。使用 `main()` 的返回值调用 `exit` 可以防止任何其他裸代码运行。\n\n### 可控执行\n\
  \n程序和模块之间的有效区别在于它们的意图用途。用户直接调用程序，而程序在执行开始后加载模块。然而，模块和程序仅仅都是 Perl 代码。让一个模块变得可执行很容易的。让一个程序表现得像模块也一样（这对于测试现有程序的局部很有用，而无需正式将其变为模块）。你只需要发现\
  \ Perl 如何开始执行一段代码。\n\n`caller(0)` 报告关于当前调用帧的信息。为了允许模块作为程序正确运行，将所有执行代码放在函数中，写一行：\n\
  \n```perl\nmain() unless caller(0);\n```\n\n如果没有调用，说明有人直接运行了它（使用 `perl path/to/Module.pm`\
  \ 而不是 `use Module;`）。\n\n| 改进调用检查 |\n| --- |\n| ![images/aside-icons/info.png](img/info.png)\
  \ | 返回列表的第八元素如果调用帧代表 use 或 require 则为真，否则为 undef。虽然这样更准确，但很少有人使用。 |\n\n### 后缀参数验证\n\
  \nCPAN 有几个可以帮助验证函数参数的模块；`Params::Validate` 和 `MooseX::Params` 是两个不错的选择。即使没有这些模块，简单的验证也很容易。\n\
  \n假设你的函数恰接受两个参数。你可以这样写：\n\n```perl\nuse Carp 'croak';\nsub groom_monkeys {\n   \
  \ if (@_ != 2) {\n        croak 'Can only groom two monkeys!';\n    }\n    ...\n\
  }\n```\n\n但从语言角度来看，后果比检查更重要，并且应该位于表达式的开头：\n\n```perl\ncroak 'Can only groom two\
  \ monkeys!' unless @_ == 2;\n```\n\n这种早期返回技术（特别是配合后缀条件）可以简化剩余的代码。每个这样的断言实际上都是真值表中的单行。或者，某种类型的函数签名（真实的函数签名）会为你处理这种情况。\n\
  \n### 正则表达式通过 (Regex en passant)\n\n许多 Perl 惯用法依赖于表达式评估为值的事实：\n\n```perl\nsay my\
  \ $ext_num = my $extension = 42;\n```\n\n这段笨拙的代码演示了如何在一个表达式中使用另一个表达式的值。\n\n\n\n\n\
  \n假设你想使用一个预编译的正则表达式 `$first_name_rx` 从“名+姓”的组合中提取名：\n\n```perl\nmy ($first_name)\
  \ = $name =~ /($first_name_rx)/;\n```\n\n在列表环境下，成功的正则匹配会返回一个包含所有捕获内容（捕获）的列表，Perl\
  \ 将第一个元素赋值给 `$first_name`。\n\n为了移除所有非单词字符以为系统账户创建一个有效的用户名，你可以这样写：\n\n```perl\n(my\
  \ $normalized_name = $name) =~ tr/A-Za-z//dc;\n```\n\n### 非破坏性替换\n\n| | |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | 新版代码可以使用非破坏性替换修饰符 `/r`：`my $normalized_name = $name =~ tr/A-Za-z//dcr;`. |\n\
  \n首先，将 `$name` 的值赋值给 `$normalized_name`。括号改变了优先级，使赋值先发生。赋值表达式的结果为变量 `$normalized_name`。该变量成为转置运算符的第一个操作数。\n\
  \n这种技术也适用于其他原地修改操作符：\n\n```perl\nmy $age = 14;\n(my $next_age = $age)++;\nsay \"\
  I am $age, but next year I will be $next_age\";\n```\n\n### 一元强制转换\n\n当你选择正确的操作符时，Perl\
  \ 的类型系统几乎总能妥善处理。使用字符串连接运算符，Perl 将将两个操作数都视为字符串。使用加法运算符，Perl 将将两个操作数都视为数值。\n\n偶尔，你必须通过一元强制转换给\
  \ Perl 一个提示，以强制对某个值进行特定的求值。\n\n加零以将值视为数值：\n\n```perl\nmy $numeric_value = 0 + $value;\n\
  ```\n\n对值进行双重取反以将其视为布尔值：\n\n```perl\nmy $boolean_value = !! $value;\n```\n\n将值与空字符串拼接以将其视为字符串：\n\
  \n```perl\nmy $string_value = '' . $value;\n```\n\n这些强制转换的需求极其罕见，但确实存在。虽然从表达式中移除“无用”的\
  \ `+ 0` 看起来是安全的，但这样做可能会破坏代码。\n\n## 全局变量\n\nPerl 提供了几个超全局变量（super global variables）。它们不局限于包（package）或文件。它们是真正真正的全局变量。不幸的是，对这些变量的任何直接或间接修改可能会改变程序其他部分的行为。经验丰富的\
  \ Perl 黑客已经记住了其中一些。很少有人能记住所有变量——因为它们的命名非常简短。只有少数几个是经常有用的。`perldoc perlvar` 包含了这些变量的完整列表。\n\
  \n### 管理超全局变量\n\n随着 Perl 的演进，它将更多的全局行为转换为词法作用域，这样你就可以避免许多此类全局变量。当你必须使用它们时，在尽可能小的作用范围内使用\
  \ `local` 来限制任何修改。你仍然会受到调用的代码对这些变量所做更改的影响，但你降低了作用范围之外出现意外代码的概率。正如易用的文件吸入惯用法（Easy\
  \ File Slurping）所示，`local` 通常是正确的方法：\n\n```perl\nmy $file; { local $/; $file = <$fh>\
  \ };\n```\n\n本地化 `$/` 的效果只持续到块结束。极低概率因为从文件句柄读取行而运行的 Perl 代码会在 `do` 块内更改 `$/` 的值。\n\
  \n并不是所有使用超全局变量的情况都容易防御，但这种方法通常有效。\n\n其他时候，你需要读取超全局变量的值，并希望没有其他代码修改它。使用 `eval` 块捕获异常可能会受到至少一个竞态条件的影响，即在超出作用域的词法变量上调用的\
  \ `DESTROY()` 方法可能会重置 `$@`：\n\n```perl\nlocal $@;\neval { ... };\nif (my $exception\
  \ = $@) { ... }\n```\n\n在捕获异常后立即复制 `$@` 以保留其内容。另见 Try::Tiny 替代（异常注意事项）。\n\n### 英文名称\n\
  \n核心英文模块为标点符号密集的超全局变量提供了详细的名称。通过以下方式将它们导入命名空间：\n\n```perl\nuse English '-no_match_vars';\
  \ # 在 5.20 和 5.22 中是不必要的\n```\n\n这允许你在该指令的作用范围内使用 `perldoc perlvar` 中记录的详细名称。\n\n\
  三个与正则相关的超全局变量（`$&`、`$'` 和 `$`）会对程序的所有正则表达式产生全局性能影响。这在 Perl 5.20 中已修复。如果你忘记导入 `-no_match_vars`，即使你没有显式读取这些变量，你的程序也会受到影响。现代\
  \ Perl 程序可以使用 `@-` 变量代替它们。\n\n### 有用的超全局变量\n\n大多数程序只需要使用几个超全局变量即可运行。你可能只会遇到其中的少数几个。\n\
  \n`$/`（或来自 English 指令的 `$INPUT_RECORD_SEPARATOR`）是一个零或多个字符的字符串，在每次读取一条记录输入时表示记录的结束。默认情况下，这是你平台特有的换行符序列。如果你取消定义此值，Perl\
  \ 将尝试将整个文件读入内存。如果你将此值设置为整数的引用，Perl 将每记录读取相应字节（因此请注意 Unicode 问题）。如果你将此值设置为空字符串（`\"\
  \"`），Perl 将按段落读取，段落是带有任意数量换行符的文本。\n\n`$.`（`INPUT_LINE_NUMBER`）包含最近访问的文件句柄读取的记录数。你可以读取此变量，但对其写入没有影响。本地化此变量会将它所指的文件句柄本地化。是的，这很困惑。\n\
  \n`$|`（`OUTPUT_AUTOFLUSH`）控制 Perl 是否立即刷新写入当前句柄的所有内容，或仅在 Perl 缓冲区满时刷新。对于写入不需要等待输入的管道或套接字非常有用。此变量将赋值给它的值强制转换为布尔值。\n\
  \n@ARGV 包含传递给命令行参数。\n\n`!`（`ERRNO`）是一个双值变量（Dualvars），包含最近系统调的结果。在数值上下文中，它对应于 C 的\
  \ errno，非零值表示错误。在字符串上下文中，它求值为相应的系统错误字符串。在进行系统调用（隐含或显式）之前本地化此变量，以避免覆盖其他代码的 errno\
  \ 值。Perl 内部有时会进行系统调用，因此此变量的值可能会发生变化。在使用系统调用后立即复制它以获得准确的结果。\n\n`$\"`（`LIST_SEPARATOR`）包含用于在字符串插值分离数组和列表元素的字符串。\n\
  \n`%+` 包含成功正则匹配的命名捕获（命名捕获）。\n\n`$@`（`EVAL_ERROR`）包含最近抛出的异常（捕获异常）。\n\n`$0`（`PROGRAM_NAME`）包含当前执行的程序名称。在某些类\
  \ Unix 平台上，你可以修改此值，以更改系统上其他程序（如 ps 或 top）看到的程序名称。\n\n`$$`（`PID`）包含操作系统理解的当前运行实例的进程\
  \ ID。这在 fork() 的程序之间会变化，在同一程序的不同线程之间也可能变化。\n\n@INC 存储了 Perl 查找通过 use 或 require 加载文件的文件系统路径列表。参见\
  \ perldoc -f require 获取该数组可能包含的其他项。\n\n\n\n\n\n`%SIG` 将操作系统和低层 Perl 信号映射到处理这些信号的函数引用。例如，通过捕获\
  \ `INT` 信号来拦截标准的 `Ctrl-C` 中断。有关信号和信号处理的更多信息，请参阅 `perldoc perlipc`。\n\n### 超局变量的替代方案\n\
  \nIO 和异常是“远程作用”（action at a distance）最糟糕的祸首。使用 `Try::Tiny` (异常注意事项) 来让自己从复杂的异常处理语义中解脱出来。通过本地化并复制\
  \ `$!` 的值，以避免在 Perl 执行隐式系统调用时出现奇怪的行为。使用 `IO::File` 及其在词法文件句柄上的方法（特殊文件处理变量）来限制对 IO\
  \ 行为的意外全局更改。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 11 章\n\n## 应该避免的内容\n\
  \nPerl 是一门可塑性极强的语言。你可以按照自己喜欢的任何创造性、可维护性、混淆性或怪异的方式来编写程序。优秀的程序员会编写他们想要维护的代码，但 Perl\
  \ 不会替你决定什么才算可维护的。\n\nPerl 并不完美。某些功能很难正确使用。另一些功能看起来很棒，但效果并不理想。有些功能具有奇怪的边缘情况。知道在 Perl\
  \ 中应该避免什么以及何时避免，将帮助你编写出经得起时间和真实用户双重考验的健壮代码。\n\n## 裸字 (Barewords)\n\nPerl 的解析器理解\
  \ Perl 的内置函数和操作符。它使用符号（sigils）来识别变量，使用其他标点符号来识别函数和方法调用。然而，解析器有时必须猜测你的意图，特别是当你使用裸字时——即一个没有符号或其他具有语法意义的标点符号的标识符。\n\
  \n### 裸字的良好用法\n\n尽管 `strict` 编译指令（编译指令）正当地禁止了产生歧义的裸字，但某些裸字是可以接受的。\n\n#### 裸字哈希键\n\
  \nPerl 中的哈希键通常没有歧义的，因为解析器可以识别它们为字符串键；`$games{pinball}` 中的 `pinball` 显然是一个字符串。\n\n\
  偶尔，这种解释并不是你想要的，特别是当你打算评估一个内置函数或函数来生成哈希键时。为了让这些情况变得清晰，可以向函数传递参数、使用括号，或者在前面加一个一元加号来强制对内置函数求值：\n\
  \n| | # 字面量 'shift' 是键 |\n|---|---|\n| | `my $value = $items{shift};` |\n| | |\n\
  | | # shift 产生的值是键 |\n| | `my $value = $items{shift(@)};` |\n| | |\n| | # 函数返回该键\
  \ |\n| | `my $value = $items{myshift(@)};` |\n| | |\n| | # 一元加号表示内置的 shift |\n|\
  \ | `my $value = $items{+shift};` |\n\n#### 裸字包名\n\n包名也是裸字。如果你的命名规范规定包名首字母大写而函数不大写，那么你很少会遇到命名冲突。尽管如此，Perl\
  \ 必须确定如何解析 `Package->method`。它是指“调用一个名为 `Package()` 的函数并在其返回值上调用 `method()`”，还是“在\
  \ `Package` 命名空间中调用名为 `method()` 的方法？”答案取决于 Perl 在遇到该方法调用时已经编译的代码。\n\n通过附加包分隔符（`::`）强制解析器将\
  \ `Package` 视为包名，或将其变为字符串字面量：\n\n| | # 可能类方法 |\n|---|---|\n| | `Package->method;`\
  \ |\n| | |\n| | # 确定是类方法 |\n| | `Package::->method;` |\n| | |\n| | # 稍微没那么丑的类方法\
  \ |\n| | `'Package'->method;` |\n| | |\n| | # 包分隔符 |\n| | `my $q = Plack::Request::->new;`\
  \ |\n| | |\n| | # 无歧义的字符串字面量 |\n| | `my $q = 'Plack::Request'->new;` |\n\n几乎没有真实代码这样做，但它是没有歧义的，所以你应该能够读懂它。\n\
  \n#### 裸字命名代码块\n\n特殊的命名代码块 `AUTOLOAD`、`BEGIN`、`CHECK`、`DESTROY`、`END`、`INIT` 和 `UNITCHECK`\
  \ 是无需使用 `sub` 内置函数声明函数的裸字。你以前见过过这些（代码生成）：\n\n| | |\n|---|---|\n| `package Monkey::Butler;`\
  \ |\n| | |\n| `BEGIN { initialize_simians(__PACKAGE__) }` |\n| | |\n| `sub AUTOLOAD\
  \ { ... }` |\n\n虽然你可以不使用 `sub` 来声明 `AUTOLOAD()`，但很少有人这样做。\n\n#### 裸字常量\n\n用 `constant`\
  \ 的常量是可以使用的：\n\n| | # 不要使用 |\n|---|---|\n| | `use 'NAME';` |\n| | `use NAME;` |\n\
  \n在这两种情况下，`sort` 调用函数并提供参数的方式可能会令人困惑（详情见 `perldoc -f sort`）。\n\n### 不明智的裸字用法\n\n\
  无论你多么谨慎，裸字仍然会产生错误。如果可能，考虑使用 `sort` 的块形式代替。\n\n#### 裸字哈希值\n\n| | # 糟糕的风格 |\n|---|---|\n\
  | | `my %parents = (` |\n| | `mother,` |\n| | `father,` |\n| | `);` |\n\n当 `mother()`\
  \ 和 `father()` 都不存在时，Perl 将这些裸字解释为字符串。\n\n#### 裸字函数调用\n\n未使用 `strict` 代码可能会使用裸字名。使用\
  \ `perl -MO=Deparse,-p`（见 `perldoc B`）查看 Perl 如何解析它们。\n\n#### 裸字文件句柄\n\n在使用词法文件句柄（句柄引用）之前，所有文件和目录句柄都使用裸字。Perl\
  \ 解析器识别 `STDIN`、`STDOUT` 和 `STDERR` 特殊异常。\n\n#### 裸字 sort 函数\n\n`sort` 的第二个操作数可以是用于排序的函数名。虽然这对于解析器来说很少有歧义，但可能会困扰人类读者。在标量中提供函数引用也好不到差：\n\
  \n| | # 裸字风格 |\n|---|---|\n| | `my @sorted = sort compare_lengths @unsorted;` |\n\
  | | |\n| | # 标量中的函数引用 |\n| | `my $comparison = \\&compare_lengths;` |\n| | `my @sorted\
  \ = sort $comparison @unsorted;` |\n\n第二种方案避免了使用裸字，但结果更长。遗憾的是，由于 `sort` 的特殊解析机制，Perl\
  \ 解析器不理解单行版本；你不能在原本块或标量的地方使用任意表达式（例如获取命名函数的引用）：\n\n| | # 无效 |\n|---|---|\n| | `my\
  \ @sorted = sort \\&compare_lengths @unsorted;` |\n\n## 间接对象\n\nPerl 不是一门纯面向对象的语言。它没有\
  \ `new` 操作符；构造函数可以是任何返回对象的函数。按照习惯，构造函数是命名为 `new()` 的类方法，但你可以为这些方法命名任何名称，甚至可以使用函数。一些旧的\
  \ Perl OO 教程推崇使用 C++ 和 Java 风格的构造函数调用。\n\n\n\n\n\n| ​  | `my $q = new Alces;` #\
  \ 请勿使用 * |\n\n而不是使用显式的方法调用\n\n| ​  | `my $q = Alces->new;` |\n\n这些示例产生等效的行为，除非它们失效。\n\
  \n#### 裸字间接调用 (Bareword Indirect Invocations)\n\n在第一个示例的间接对象形式（更准确地说是与格）中，方法位于调用者之前。这在动词和名词更明显的口语语言中没有问题，但在\
  \ Perl 中这引入了解析歧义。\n\n由于方法名是一个裸字（Barewords），解析器使用几种启发式方法来确定这段代码的正确解释。虽然这些启发式方法经过了充分测试且几乎总是正确的，但它们的失败模式令人困惑。当你向构造函数传递参数时，情况会变得糟糕：\n\
  \n| ​  | `my $obj = new Class( arg => $value );` # 请勿使用 * |\n\n在这个示例中，类名看起来看起来像是一个函数调用。Perl\
  \ 能够并且经常能够正确处理这种情况，但它的启发式方法取决于解析器见过哪些包名、已经解析了哪些裸字、它是如何解析这些裸字的，以及当前包中已经声明的函数名。要获得这些条件的详尽列表，你必须阅读\
  \ Perl 解析器的源代码——这并不是普通 Perl 程序员想要做的事（如果你真的好奇，可以查看 `toke.c` 中的 `intuit_method`——但请尽管忘记这个建议从未存在过）。\n\
  \n想象一下，如果你不小心运行了一个带有原型（prototyped）的函数（Prototypes），其名称恰好与某个间接调用的类或方法名冲突，例如在在使用 `JSON`\
  \ 模块的文件中有一个命名不当的 `JSON()` 方法。这种情况很少见，但调试起来非常不愉快。因此，请避免间接调用。\n\n#### 间接表示法的标量限制 (Indirect\
  \ Notation Scalar Limitations)\n\n间接语法的另一个危险是，解析器期望单个标量表达式作为对象。打印到存储变量中的文件句柄看似显而易见，但事实并非：\n\
  \n| ​  | *# 无法工作 * |\n\n| ​  | `say $config->{output} 'Fun diagnostic message!';`\
  \ * |\n\nPerl 将尝试在 `$config` 对象上调用 `say`。\n\n`print`、`close` 和 `say`——所有操作文件句柄的内置函数都是以间接方式运行的。当文件句柄是包全局时这没问题，但作用文件句柄（Filehandle\
  \ References）使得间接对象语法变得明显。为了解决这个问题，应对产生预期调用者的子表达式消除歧义：\n\n| ​  | `say {$config->{output}}\
  \ 'Fun diagnostic message!';` * |\n\n#### 间接表示法的替代方案\n\n直接调用符号没有这种歧义问题。要构造对象，直接在类名上调用构造方法：\n\
  \n| ​  | `my $q = Plack::Request->new;` |\n\n| ​  | `my $obj = Class->new( arg =>\
  \ $value );` |\n\n这种语法仍然存在裸字问题，如果你在 `Plack` 命名空间中有一个名为 `Request` 的函数，Perl 将将裸字类名解释为对函数的调用：\n\
  \n| ​  | `sub Plack::Request;` |\n\n| ​  | |\n\n| ​  | *# 你写了 Plack::Request->new，但\
  \ Perl 看到的* * |\n\n| ​  | `my $q = Plack::Request()->new;` |\n\n像通常一样消除这种语法的歧义（Bareword\
  \ package names）。\n\n对于文件句柄操作简单特殊，格的使用非常普遍，如果你给预期的调用者加上花括号，就可以使用间接调用方法。你可以在作用文件句柄上使用方法，尽管几乎没有人对\
  \ `print` 和 `say` 这样做。\n\nCPAN 模块 `Perl::Critic::Policy::Dynamic::NoIndirect`（`Perl::Critic`\
  \ 的插件）可以分析你的代码以找到间接调用。CPAN 模块 `indirect` 可以识别并禁止在运行程序中使用它们：\n\n| ​  | *# 间接使用时警告\
  \ * |\n\n| ​  | `no indirect;` |\n\n| ​  | |\n\n| ​  | *# 使用它们时抛出异常 * |\n\n| ​ \
  \ | `no indirect ':fatal';` * |\n\n#### 原型 (Prototypes)\n\n原型是附加在函数或变量上的部分元数据。函数原型改变了\
  \ Perl 解析器理解它的方式。\n\n原型允许你定义行为像内置函数的自定义函数。考虑内置的 `push`，它接收一个数组和一个列表。虽然 Perl 通常会将数组和列表扁平化为传递给\
  \ `push` 的单个列表，但 Perl 知道将数组视为一个容器且不扁平化它的值。实际上，这就像向 `push` 传递一个数组的引用和一个包含这些值的列表——因为\
  \ Perl 解析器理解这正是 `push` 需要做的。\n\n函数原型附加在函数声明上：\n\n| ​  | `sub foo (&@);` |\n\n| ​ \
  \ | `sub bar ($$) { ... }` |\n\n| ​  | `my $baz = sub ($);` |\n\n```perl\nsub foo\
  \ (&@);\nsub bar ($$) { ... }\nmy $baz = sub ($);\n```\n\n（注：提供的文本在原型部分包含大量损坏/乱码文本。我已根据标准\
  \ Perl 文档模式清理了可读的结构部分。）\n\n#### 原型的问题\n\n原型改变了 Perl 解析你代码的方式，以及 Perl 强制转换传递给函数的参数的方式。虽然这些原型表面上类似于其他语言中的函数签名（Real\
  \ Function Signatures），但它们非常不同。它们没有记录预期的参数数量或类型，也没有将参数映射到命名参数。\n\n原型强制转换以微妙的方式工作，例如对传入的参数强制执行标量上下文：\n\
  \n```perl\nsub numeric_equality($$) {\n  my ($left, $right) = @_;\n  return $left\
  \ == $right;\n}\n```\n\n```perl\n@nums = 1 .. 10;\nsay 'They\\'re equal, whatever\
  \ that means!' if numeric_equality @nums, 10;\n```\n\n但它们只作用于简单表达式：\n\n```perl\n\
  sub mypush(\\@@);\n# 编译错误：原型不匹配\n# (期望数组，得到标量赋值)\nmypush( my $elems = [], 1 .. 20\
  \ );\n```\n\n为了调试这个问题，mypush 的用户必须同时知道原型的存在以及数组原型的局限性。这给用户带来了了沉重的认知负担——如果你觉得这个错误信息晦涩难懂，那等你看到复杂的原型错误吧。\n\
  \n### 原型的良好用途\n\n\n\n\n\n原型（Prototypes）确实有一些优点，其价值大于存在的问题。例如，你可以使用一个带有原型的函数来覆盖 Perl\
  \ 的某个内置函数。首先，在一个小型测试程序中通过检查其原型（prototype）来确认是否可以覆盖该内置函数。然后，使用 `subs` 编译指令告诉 Perl\
  \ 你打算覆盖某个内置函数。最后，使用正确的原型声明你的覆盖项：\n\n```\nuse subs 'push';\n\nsub push (\\@@) { ...\
  \ }\n```\n\n请注意，`subs` 编译指令在文件的剩余部分都有效，无论任何词法作用域如何。\n\n原型还用于定义编译时常量。当 Perl 遇到一个声明为空原型（区别于无原型）的函数，且该函数求值结果为常量表达式时，优化器会将对该函数的调用替换为常量：\n\
  \n```\nsub PI () { 4 * atan2(1, 1) }\n```\n\n在作用域和可见性范围内，所有后续代码将使用 `pi` 的计算值来代替裸字\
  \ `PI` 或对 `PI()` 的调用。\n\n核心 `constant` 编译指令为你处理了这些细节。CPAN 中的 `Const::Fast` 模块创建了可以插值到字符串中的常量标量。\n\
  \n原型的一个合理用途是扩展 Perl 的语法，以将块作为匿名函数操作。CPAN 模块 `Test::Exception` 有效地利用了这一点，提供了一个带有延迟计算的良好\
  \ API。它的 `throws_ok()` 函数接受三个参数：要运行的代码块、一个用于匹配异常字符串的正则表达式，以及可选的测试描述：\n\n```\nuse\
  \ Test::More;\nuse Test::Exception;\n\nthrows_ok { my $unobject; $unobject->yoink\
  \ }\nqr/Can't call method \"yoink\" on an undefined/,Method on undefined invocant\
  \ should fail/;\n\ndone_testing();\n```\n\n导出的 `throws_ok()` 函数原型为 `&$;$.`。它的第一个参数是一个块，它会变成一个匿名函数。第二个参数是一个标量。第三个参数是可选的。\n\
  \n细心的读者可能发现了块后面缺少一个逗号。这是 Perl 解析器的一个特性，它期望在原型块之后有空白，而不是逗号操作符。这是原型语法的缺点。如果这让你感到困扰，可以在不利用原型特性的情况下使用\
  \ `throws_ok()`：\n\n```\nthrows_ok( sub { my $unobject; $unobject->yoink() }, qr/Can't\
  \ call method \"yoink\" on an undefined/,Method on undefined invocant should fail\
  \ );\n```\n\n`Test::Fatal` 允许类似的测试，并使用更简单的方法来避免这种歧义。\n\nBen Tilly 建议原型的最后一个良好用途：定义一个用于配合\
  \ `sort` 的自定义命名函数：\n\n```\nsub length_sort ($$) {\n    my ($left, $right) = @_;\n\
  \    return length($left) <=> length($right);\n}\n\nmy @sorted = sort length_sort\
  \ @unsorted;\n```\n\n`$$` 的原型强制 Perl 将排序对传递到 `@_` 中。`sort` 的文档建议这种方法比使用包全局变量 `$a`\
  \ 和 `$b` 稍微慢，但使用词法变量通常可以抵消任何速度损失。\n\n## 方法与函数的等效性（Method-Function Equivalence）\n\
  \nPerl 的对象系统设计得非常极简。类就是一个包（package），Perl 不区分存储在包中的函数和方法。同一个内置函数 `sub` 同时声明了两者。Perl\
  \ 会乐意地分发到一个作为方法调用的函数。同样，如果你手动传递调用者（invoc），你可以像调用函数一样调用方法——无论是全限定、导出的还是作为引用。\n\n\
  以错误的方式调用错误会导致问题。\n\n#### 调用方（Caller Side）\n\n考虑一个具有多个方法的类：\n\n```\npackage Order\
  \ {\n    use List::Util 'sum';\n\n    sub calculate_price {\n        my $self =\
  \ shift;\n        return sum(0, $self->get_items);\n    }\n    ...\n}\n```\n\n给定一个\
  \ `Order` 对象 `$o`，以下方法的调用似乎是等价的：\n\n```\nmy $price = $o->calculate_price;\n\n# 错误；不要使用\n\
  my $price = Order::calculate_price( $o );\n```\n\n尽管在这种简单的情况下，它们产生了相同的输出，但后者通过绕过方法查找违反了对象的封装性。\n\
  \n如果 `$o` 是 `Order` 的子类或同态体（allomorph）并覆盖了 `calculate_price()`，那么这个示例就调用了错误的方法。对\
  \ `calculate_price()` 实现的任何更改（例如通过 `AUTOLOAD()` 修改继承或委托）都可能破坏调用代码。\n\nPerl 有一种情况这种行为似乎是必要的。如果你在不进行分发的情况下强制进行方法解析，你如何调用生成的方法引用呢？\n\
  \n```\nmy $meth_ref = $o->can('apply_discount');\n```\n\n有两种可能。第一种是丢弃 `can()` 方法返回值：\n\
  \n```\n$o->apply_discount if $o->can('apply_discount');\n```\n\n第二种是使用引用本身结合方法调用语法：\n\
  \n```\nif (my $meth_ref = $o->can('apply_discount')) {\n    $o->$meth_ref();\n}\n\
  ```\n\n当 `$meth_ref` 包含函数引用时，Perl 将使用 `$o` 作为调用者执行该引用。这在严格模式（strictures）下同样有效，就像使用包含名称的标量调用方法时一样：\n\
  \n```\nmy $name = 'apply_discount';\n$o->$name();\n```\n\n通过引用调用方法有一个小小的缺点；如果在存储引用和调用引用之间程序结构发生了变化，引用可能不再指向最合适的方法。如果\
  \ `Order` 类发生了变化，导致 `Order::apply_discount` 不再是正确的调用方法，那么 `$meth_ref` 中的引用将不会更新。\n\
  \n这是一个不太可能的情况，但在使用这种调用形式时，请限制方法引用的范围以防万一。\n\n#### 被调用方（Callee Side）\n\n由于（尽管不建议）可以将给定函数作为函数或方法调用，因此写出一个既可以作为函数也可以作为方法调用的函数。\n\
  \n`CGI` 模块具有这些双面性的函数。每一个函数都必须应用多种启发式算法来判断第一个参数是否为调用者。这导致了问题。很难准确预测对于给定方法哪些调用者是潜在有效的，尤其是当你可能需要处理子类时。创建一个用户无法易于误用的\
  \ API 同样困难，你的文档负担也是如此。当项目的一部分使用过程化接口而另一部分使用对象接口时会发生什么？\n\n如果你必须为库提供独立的过程化和面向对象的接口，请创建两个独立的\
  \ API。\n\n## 自动解引用（Automatic Dereferencing）\n\nPerl 可以代表你自动解引用某些引用。给定一个数组引用 `$arrayref`，你可以写：\n\
  \n```\npush $arrayref, qw(list values);\n```\n\n给定一个返回数组引用的表达式，你可以执行同样的操作：\n\n```\n\
  push $houses{$location}[$closets], @new_shoes;\n```\n\n| Autoderef 实验 |\n| --- |\n\
  | 在 Perl 5.18 之后，你必须通过 `use experimental ’autoderef’;` 启用此功能。这应该是一个信号，在这里谨慎对待。 |\n\
  \n\n\n\n\n数组操作符 `pop`、`shift`、`unshift`、`splice`、`keys`、`values` 以及哈希操作符 `keys`、`values`,\
  \ `each` 也是如此。如果提供的引用不是正确的类型——如果它没有正确解引用——Perl 将抛出异常。虽然这似乎比直接显式解引用引用更危险，但实际上行为是相同的：\n\
  \n```perl\nmy $ref = sub { ... };\n# *# 将抛出异常\npush $ref, qw(list of values);\n\
  # # 也会抛出异常\npush @$ref, qw(list of values);\n```\n\n遗憾的是，这种自动解引用有两个问题。首先，它只作用于普通变量。如果你有一个被祝福的（blessed）数组或哈希、绑定的（tied）哈希，或者具有数组或哈希重载的对象，Perl\
  \ 将抛出运行时异常而不是解引用引用。\n\n其次，请记住 `each`、`keys` 和 `values` 可以同时作用于数组和哈希。你无法通过查看\n\n\
  ```perl\nmy @items = each $ref;\n```\n\n来判断 `@items` 包含的是键值对列表还是索引/值对，因为你不知道应该期望\
  \ `$ref` 指向哈希还是数组。是的，选择良好的变量名会有帮助，但这段代码在本质上是混淆的。\n\n这两个缺点都没有让这种语法在范围内变得不可用，但其粗糙之处和可能让读者困惑的倾向使其没有变得那么有用。\n\
  \n## Tie（绑定）\n\n重载（Overloading）允许你针对特定的类型转换自定义类和对象的行为，而一种名为绑定（binding）的机制允许你自定义原始变量（标量、数组、哈希和文件句柄）的行为。你在绑定变量上执行的任何操作都会转换为对对象的特定方法调用。\n\
  \n例如，`tie` 内置函数允许核心模块 `Tie::File` 将文件视为记录数组，让你能够随心意愿地 `push`、`pop` 和 `shift`。（`tie`\
  \ 的初意是让哈希和数组使用文件支持的存储，以便 Perl 可以处理无法无法存入可用内存的数据。二十年前，内存昂贵得多。）\n\n你绑定变量的类必须符合特定数据类型的定义接口。阅读\
  \ `perldoc perltie` 获取概述；然后查看核心模块 `Tie::StdScalar`、`Tie::StdArray` 和 `Tie::StdHash`\
  \ 获取具体细节。从从其中一个类开始；然后覆盖你需要修改的任何特定方法。\n\n| 当类名和包名冲突时 |\n| --- |\n| 如果 `tie` 还不够让人混乱，`Tie::Scalar`、`Tie::Array`\
  \ 和 `Tie::Hash` 定义了绑定标量、数组和哈希所需的接口，但 `Tie::StdScalar`、`Tie::StdArray` 和 `Tie::StdHash`\
  \ 提供了默认实现。 |\n\n### 绑定变量\n\n要绑定变量，请使用以下代码：\n\n```perl\nuse Tie::File;\ntie my @file,\
  \ 'Tie::File', @args;\n```\n\n第一个操作数是要绑定的变量。第二个是你要将其绑定的类名。`@args` 是绑定函数所需的可选参数列表。在\
  \ `Tie::File` 的情况下，`@args` 应该包含有效文件名。\n\n绑定函数类似于构造函数：`TIESCALAR`、`TIEARRAY()`、`TIEHASH()`\
  \ 或 `TIEHANDLE()` 分别对应标量、数组、哈希和文件句柄。每个函数返回一个代表绑定变量的新对象。`tie` 和 `tied` 都会返回这个对象，尽管大多数人在布尔上下文中使用\
  \ `tied`。\n\n### 实现绑定变量\n\n要实现绑定变量的类，请继承自核心模块如 `Tie::StdScalar`。然后覆盖你想要更改的操作特定方法。在绑定标量的情况下，这些可能是\
  \ `FETCH` 和 `STORE`，可能是 `TIESCALAR()`，但可能不是 `DESTROY()`。\n\n这里有一个记录标量所有读取写操作的类：\n\
  \n```perl\npackage Tie::Scalar::Logged {\n    use Tie::Scalar;\n    use parent -norequire\
  \ => 'Tie::StdScalar';\n\n    sub STORE {\n        my ($self, $value) = @_;\n  \
  \      Logger->log(\"Storing <$value> (was [$self])\", 1);\n        $$self = $value;\n\
  \    }\n\n    sub FETCH {\n        my $self = shift;\n        Logger->log(\"Retrieving\
  \ <$self>\", 1);\n        return $$self;\n    }\n}\n```\n\n假设 `Logger` 类方法 `log()`\
  \ 接收一个字符串以及在调用栈中向上报告位置的帧数。\n\n在 `STORE()` 和 `FETCH()` 方法中，`$self` 作为被祝福的标量工作。向该标量引用赋值会更改标量的值。从中读取返回其值。\n\
  \n同样，`Tie::StdArray` 和 `Tie::StdHash` 方法分别作用于被祝福的数组和哈希引用。同样，`perldoc perltie` 解析了绑定变量支持的方法，例如一次读取或写入多个值。\n\
  \n| tie 有趣吗？ |\n| --- |\n| `-norequire` 防止父 pragma 尝试为 `Tie::StdScalar` 加载文件，因为该模块是文件\
  \ `Tie/Scalar.pm` 的。没错，`Tie::StdScalar` 没有独立的 `.pm` 文件。这不很有趣吗？ |\n\n### 何时使用绑定变量\n\
  \n绑定变量看起来很聪明，但它们可能会产生混淆的接口。除非你有充分的理由让对象表现得像内置数据类型，否则请避免在没有充分理由的情况下使用 `tie()` 创建它们。绑定变量也比内置数据类型慢得多。\n\
  \n话虽如此，绑定变量可以帮助你调试复杂代码（使用记录的标量来理解值变化的位置）或使某些事情可行（访问大文件而不会耗尽内存）。\n\n最后的警告是对懒惰编程的无奈控诉：许多代码都在刻意防止使用绑定变量，往往是无意的。这很遗憾，但库代码有时运行很快且对它的预期很“懒惰”，你并不总是能修复它。\n\
  \n© 2015, The Pragmatic Bookshelf.\n\n# 第 12 章\n\nPerl 的后续步骤\n\nPerl 并不是完美的，但它是可塑的——因为没有哪种单一配置适用于每个程序员和每个目的。一些实用的行为作为核心库可用。更多功能可以从\
  \ CPAN 获取。有效的 Perl 程序员会充分利用他们拥有的选项。\n\n## 有用的核心模块\n\nPerl 的语言设计过程一直尝试结合实用性与扩展性。Perl\
  \ 5 扩展了语言并使 CPAN 可能，但它仍然保留了对 1987 年编写的大部分 Perl 1 代码的后兼容性。\n\n2015 年的最佳代码与 1994 年的最佳\
  \ Perl 代码或 1987 年的最佳 Perl 代码非常不同，这部分归功于其核心库。\n\n### strict 指令\n\n`strict` 指令（Pragmas）允许你禁止（或重新启用）各种可能意外滥用的强大语言结构。\n\
  \n`strict` 禁止符号引用，要求变量声明（Lex 法作用域）并禁止使用未定义的裸词（Barewords）。\n\n[/content] (不对，此处应该是结束)\
