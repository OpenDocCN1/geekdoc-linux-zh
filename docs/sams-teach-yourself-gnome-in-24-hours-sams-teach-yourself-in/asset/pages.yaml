  md: '# The Internet and GNOME


    # Local File System Window


    The local file system window displays the directory tree on your hard drive. Files
    are downloaded to the directory that is currently displayed. You also use the
    local file system window to select files for upload.


    # Remote File System Window


    The remote file system window displays the directory tree of the remote FTP site
    to which you are connected. You can download from and upload files to this directory.


    # Upload/Download Progress Window


    As you download or upload files, the progress window displays the files that are
    selected for download/upload and the percentage of download/upload that is complete
    for each file.


    # Log and Message Window


    The log window displays the connection process, any messages from the remote site,
    messages that your computer sends to the remote site (communication between your
    computer and the remote computer), and the progress of your file transfers. The
    log logs all directory navigation moves you make in the remote and the local file
    system.


    # Right-Click Menus


    There are several right-click menus in each window, which produce the same items
    as those in the main menu:


    +   - Local file system window right-click is the same as the Local menu.

    - Remote file system window right-click is the same as the Remote menu.

    - Progress window right-click is the same as the Transfers menu.

    - Log window right-click is the same as the Logging menu.


    # Using gFTP


    Think of using anonymous FTP as if you were a guest on another person''s computer.
    There are certain directories that you are allowed to look in, but most are private.
    You can read and download files, but you can''t manipulate files and directories,
    you can move files and directories around, and you can''t edit files.


    When you establish an FTP connection with a remote site that gives you full permissions,
    that computer''s file system becomes something like an extension of your own.
    You can copy, move, and delete files and directories. You can create symbolic
    and hard links. You can open and edit files or upload new files to the remote
    file system.'
  merge: -1
