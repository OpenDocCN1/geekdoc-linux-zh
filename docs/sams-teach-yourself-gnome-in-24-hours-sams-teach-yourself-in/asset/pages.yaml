    # Q&A


    +   Q I want to upgrade GNOME. Do I have to uninstall the old version?

    nA If you installed GNOME from tarballs, uninstall the modules that you need to
    replace before installing the new modules. If you installed from a binary package,
    you do not have to uninstall before you upgrade if you specify the Upgrade option
