  md: '# HOUR 16


    # Managing Printing with GNOME


    Compared to printing with Windows, printing a document from a Linux or UNIX system
    can be quite complicated. There are many options to consider. UNIX/Linux is meant
    to be a multiuser system, so Linux and UNIX act as if print orders are coming
    from many different users, even if you are the only user on your system. You can
    print as a user, or as root, which gives you certain powers. Your printer has
    a device name, instead of just “Printer.” Sometimes different applications use
    different printing options, and even different drivers. As usual when dealing
    with UNIX-like systems, all this complexity gives you more power, but it also
    sometimes makes it difficult to do simple tasks.


    In this hour, you will


    +   - Learn about the Linux printing process.

    - Use the printing tools lpr, lpd, lprq, and lprrm to print files.

    - Use the GNOME printer applet to print files.

    - Print files from GNOME applications.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# # Setting Up Your System for Printing


    True to their pledge to make UNIX easier to use, the GNOME developers are devising
    tools to make printing from GNOME applications simpler. Still, there is much that
    you must configure yourself.


    Before you can print any files, you must set your system up for printing. The
    necessary system information for printing is contained in a file called /etc/printcap.
    This file defines your printer or printers and stores instructions for sending
    print jobs to the printers.


    ![](img/56ffc05f2012b0375f08095ea492838b_239_0.png)


    Because /etc/printcap is rather difficult to modify, most Linux distributions
    come with print utilities that can create an /etc/printcap file based on your
    input about your system. For example, Red Hat has a printer configuration utility
    printtool (see Figure 16.1), and Calder comes with a utility called lisa.


    # Figure 16.1


    The Red Hat

    printtool creates

    etc/printcap

    file on input

    from the user.


    | Tool | | | Help |

    |---|---|---||

    | Printer Queues in /etc/printcap | |

    | HP Laser Jet 4SL/6S series, noPostScrap on /dev/lp0 | |

    | Edit | Add | Delete |

    | CUPS Local Printer Entry |

    | Names (name) [queue2...]: lp |

    | Spool Directory /var/spool/lp/ |

    | File Label in lp -l (no label) |

    | Printer Device /dev/lp0 |

    | Input Filter Select *= Laser4SL |

    | # Suppress Headers |

    | OK | Cancel |


    Listing 16.1 illustrates a simple /etc/printcap file for a one-user system with
    one printer.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Managing Printing with GNOME


    # Listing 16.1 Sample /etc/printcap File


    ```

    1: # Please don''t edit this file unless you know what you are doing!

    2: # Be warned that the control-panel printool requires a very strict format!

    3: # Look at the printcap(5) man page for more info.

    4: #

    5: # This file can be edited with the printool in the control-panel.


    6: ##PRINTTOOL## LOCAL ljet4 600x600 letter } LaserJet Default 1

    7: lp:

    8:  :sd=/var/spool/lpd/lp:

    9:  :mx#:

    10:  :sh:

    11:  lp=/dev/lp0:

    12:  :if=/var/spool/lpd/lp/filter:

    ```


    Lines 1 to 5 are comments about the /etc/printcap file. Note that line 3 tells
    you that there is a page where you can get more information about the printcap
    file.


    Line 6 is a description of the printer, including the default resolution setting
    of 600 × dpi and letter-sized paper.


    Line 7 gives the name of the printer, 1p.


    Line 8 is the pathname of the print spool directory.


    Line 9 defines the maximum file size a print job can have. A definition of 0 means
    that there is no limit to the file size.


    Line 10 gives l1pd instructions not to print a header page before each print job.


    Line 11 gives the printer name and print device.


    Line 12 provides instructions on using filters for print jobs.


    # The Printing Process


    Selecting a file to print is a simple process. When you click Print, the print
    dialog appears with a field to enter the printer name and the print command.


    The printer name is the name you gave the printer when you set up your system.
    You can enter the actual name of the printer, such as pt002, or 1p.


    The print command is a bit more complicated. There are several print commands
    you can use to send a file to the printer. In this hour, we use lpr, which is
    useful for most jobs.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'Before we get into specific print commands and options, we will review printing
    is done in UNIX-like systems. Keep in mind that UNIX—and therefore Linux—is a
    multiuser system, so all print processes are set up to accept print jobs from
    many sources simultaneously.


    # Printing Tools


    When you enter the command lpd to print a file, or click Print from an application
    menu, the print tool lpd looks in the /etc/printcap for instructions on how to
    process the file and format it for printing. The formatted print job is then submitted
    to the print daemon lpd, which accepts the print job and forks a child copy of
    itself to print the print job. The original lpd waits for the next print job.
    The file is stored in a temporary directory called the print spool. The print
    spool stores jobs from every user on the system and sends them to the printer
    in the order that the lpd daemon received. When the file is at the end of the
    print spool, lpd sends the print job to the printer.


    To clarify the process, each tool is described in detail in the following sections.


    # lpr


    lpr is the print utility that accepts each print job and submits it to the printer
    daemon lpd. Use the lpr command to activate start a print job. The syntax is as
    follows:


    ```

    $ lpr [ options ] [ filename ... ]

    ```


    Some useful options for lpr are


    +   - printer Specifies the printer you want to use.

    - s Creates a symbolic link to the print spool instead of copying the file to
    the print spool. Useful for large files.

    - #[number] Specifies the number of copies to print. lpr usually prints one copy
    by default.


    # lpd


    lpd is the print daemon that manages all print jobs from all users on the system.
    lpd must be running before a print job is created by lpr, so lpd is usual at system
    initialization.


    # lpq


    lpq displays the contents of the print spool, or the print queue, lpq displays
    the rank (active or spooled) of the print jobs, the user who requested the job,
    the job number, the file name, and the file''s size. Listing 16.2 is a sample
    lpq output.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Managing Printing with GNOME


