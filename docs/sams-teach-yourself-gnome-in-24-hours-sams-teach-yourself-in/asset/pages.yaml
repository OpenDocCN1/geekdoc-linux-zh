    - Copy, Delete, and Move open dialog boxes where you can copy, delete, and move
    files or directories. Each dialog box contains a Browse button so you don''t have
    to remember pathnames.

    - Show Directory Sizes shows the total size in bytes of the files within the active
    directory. Note that there is no check box for Show Directory Sizes. Showing the
    size of a directory is a one-time action for the active directory, not feature
