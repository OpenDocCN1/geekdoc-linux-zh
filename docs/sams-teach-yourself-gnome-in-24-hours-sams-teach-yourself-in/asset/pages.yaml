  md: '# Opening eesh


    There are three options for opening eesh:


    +   1. eesh -e [command]—This option opens eesh, sends the command to

    Enlightenment, and exits.

    2. eesh -wait [command]—This option opens eesh and sends the command, eesh

    wits for input before exiting.

    3. eesh—If you enter eesh without an option, eesh will enter interactive mode,
    which

    means the cursor drops down a line and waits for input. At this point, you can

    enter any eesh command, including help.

    eesh -h to see a list.


    # Getting Help in eesh


    To get a list of all the eesh commands, type help from within the interactive
    mode. A list

    of all the eesh commands appear. The output of eesh help is shown in Figure 10.15.


