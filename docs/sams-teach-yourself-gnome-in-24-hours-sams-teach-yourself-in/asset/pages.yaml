  md: '# Using the Panel and the Main Menu


    In GNOME, you are in full control of what goes on your desktop and in your Main
    Menu. This requires a bit of thought on your part to decide what belongs on your
    desktop, in your Main Menu, and on your panel.


    The Main Menu, in your configuration, serves as a master list of all applications
    available to run on your desktop. You learned a bit about the Main Menu in Hour
    5. Here you will learn the logic behind the organization of the Main Menu, and
    how to customize the Main Menu.


    You will notice, however, GNOME starts out with applications already placed in
    the Main Menu. When you update gnome-core, the main menu is also updated to reflect
    new or updated applications. This is the only time that the GNOME Main Menu will
    be automatically updated. So, when you add a new application, such as StarOffice,
    if you want to have an entry in the Main Menu, you must manually create it.


    In the following section we will study the format of the Main Menu, and then we
    will add items to the Main Menu using the Menu Editor.


    # Parts of the Main Menu


    The Main Menu is divided into five sections:


    +   - System menus

    - User menus

    - Other menus (menus for window managers and other desktop environments, such
    as KDE)

    - Panel menu

    - Miscellaneous items


    We will go over each section briefly.


    # System Menus


    The System menus have an entry for each application that is bundled into the gnome-core.
    Some entries include GNOME applications, Internet applications, graphics applications,
    and utilities. We will not discuss every System menu in this hour, after you have
    completed all the hours, you will be familiar with all the applications in the
    System menus.


    These menus can be edited, but you must be logged in as root to do so.


    # User Menus


    When you first install GNOME, the User menus are empty. As you add applications
    to your system, add an entry for each new application in the User menus. Any application


    ![](img/56ffc05f2012b0375f08095ea492838b_108_0.png)'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'or directory can be added to the User menus. You can also create your own submenus
    in which to place your applications.


    # Other Menus


    If you have window managers that have menus or even other desktop environments
    such as KDE, you can access those menus via the GNOME Main Menu. The Red Hat and
    Debian distributions also place menus here.


    # Panel Menu


    The complete Panel menu can be accessed via the Main Menu. This duplicate menu
    is very useful if you lose your panel and have to create a new one.


    # Miscellaneous Items


    Below the Panel menus are miscellaneous items such as screen lock, About the Panel
    button, an About GNOME button, and the logout button.


    # Editing the Main Menu


    When you want to make a change to the Main Menu, such as adding or deleting an
    application, you use the Menu Editor. Open the Menu Editor by clicking Main Menu,
    Settings, Menu Editor. You can also change the Properties of an individual entry
    in the Main Menu by right-clicking the entry and selecting Properties.


    # Adding or Deleting Entries in the Main Menu


    To add or delete an entry, open the Menu Editor by clicking Main Menu. Editor.
    The left side of the Menu Editor displays your Main Menu as it currently appears.
    On the right side of the Menu Editor, you can change the attributes of an individual
    entry in the Main Menu. The Menu Editor offers the same attribute options as the
    properties of each menu.


    To add a new entry to the Main Menu, elick New Item or New Submenu. You can also
    move an item around in your Main Menu by clicking on the item and dragging-and-dropping
    it to the desired position.


    Figure 7.4 shows the Menu Editor with the Basic tab displayed.


    To learn more about how to use the Menu Editor, see The GNOME User''s Guide [Red
    Hat, 1999].'
