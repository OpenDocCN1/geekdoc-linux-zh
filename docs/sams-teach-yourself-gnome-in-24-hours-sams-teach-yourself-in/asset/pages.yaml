  md: '# Entering Track Titles Manually


    If CDDB does not contain your CD title, use the Track Editor to manually enter
    the CD title and titles (song titles). The CD Player automatically reads the number
    and length of each track, as well as the total playing time of the CD. When you
    have finished entering all tracks, press Submit. Enter the musical category for
    the CD in the dialog box that appears and press Submit. A special mail message
    will go to the database with your new entry. You will get no message back unless
    there was an error in the transmission. Your entry will be added to the CDDB so
    that anyone with the same CD will be able to download the titles. Figure 20.7
    shows the CD Classics I: 1000–1400 submitted to CDDB. Click OK to send the submission
    message.


