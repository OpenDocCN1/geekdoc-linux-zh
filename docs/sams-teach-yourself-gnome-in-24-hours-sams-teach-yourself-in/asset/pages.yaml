    # Getting the Latest Version of GIMP


    Like most successful free software, GIMP is in a state of constant development.
    There is usually an unstable, development version that is two or three versions
    of the stable release, and a new stable release comes out every few months. The
    best way to keep up-date with the progress of GIMP is to visit the GIMP home page
    at http://www.gimp.org. The latest stable and development versions of GIMP are
    available for download here.


    # GIMP Basics


    GIMP can be used for everyday tasks such as image viewing and taking screen shots,
    or for complex graphics such as creating computer-enhanced film imagery. Some
    of the features of GIMP include


    +   - Multiple image layers.

    - Filters.

    - Sub-pixel imaging.

    - Anti-aliasing.

    - Channel operations and layers.

    - Extensibility with scripts.

    - A full suite of painting tools.

    - Multiple undo/redo.

    - Gradient editing and blending.

    - Plug-ins for adding new file formats and filters. GIMP comes with 100 pre-defined
    plug-ins.'
