    # # A Word on Three-Button Mouse Emulation


    Most UNIX graphical programs are designed to be used with a three-button mouse,
    and GNOME is no exception. If you have a two-button mouse, you can configure it
    so that pressing the left and right buttons simultaneously will substitute for
    the third mouse button. Also, if you are using a rollerball, you can configure
    it that the scroll will act as the third button.


    To emulate a three-button mouse, you must edit your X configuration file (if you
    are using XFree86, it is called XF86Config). The full pathname in Linux is usually
    /etc/X11/XF86Config or /usr/X11R6/lib/X11/XF86Config. Open the XF86Config file
    in your favorite editor or to the Pointer Selector.


    ![](img/56ffc05f2012b0375f08095ea492838b_79_0.png)


    You will find a section that deals with three-button emulation. Uncomment the
    line that reads “Emulate3Buttons.” If you do not have such a section, you can
    manually add the following line at the end of the section:


    ```

    Emulate3Timeout          50

    ```


    Alternatively, if you are nervous about directly editing your XF86Config file,
    you can use one of the XF86Config-generation scripts, as xf86config (note the
    lowercase lettering) or XF86Setup, or if you have Red Hat, Xconfig. Listing 5.1
    shows an example of the mouse section of an XF86Config script.'
