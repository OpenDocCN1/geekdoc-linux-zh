  md: '# gnome-announce Mailing List


    If you want to keep up to date on new releases of GNOME software, subscribing
    to gnome-announce is a must. GNOME developers use gnome-announce as the fastest
    way to announce new releases of GNOME software to the community. gnome-announce
    is also useful for keeping up on GNOME news, interviews, awards, and other items
    of interest to the GNOME community.


    > Announcements are generally made to gnome-announce and gnome-list, the general
    GNOME mailing list. If you subscribe to gnome-list, it is not necessary to subscribe
    to gnome-announce.


    # Downloading and Installing GNOME Applications


    Download and install GNOME applications in the same way you downloaded and installed
    the basic GNOME packages. If you need to review, “Installing GNOME from Downloaded
    rpms” in Hour 2. Remember, you can download GNOME packages from the ftp site that
    contain them


    +   - Netscape

    - wget

    - Lynx


    After downloading the package, install it using GnoRPM or whatever package installation
    manager you have chosen.


    > Make a habit of using GnoRPM to install rpm packages, so that all the rpms on
    your system are present in the GnoRPM database.


    # Tarballs Versus Binary Packages Revisited


    The developer of a GNOME application usually releases only the source code in
    tarball format. Another member of the GNOME project will then make the rpm, usually
    weeks later. Sometimes Red Hat Software will make an rpm and post it on the Red
    Hat ftp server, but only for packages that are part of the base installation.
    There are two teams on the GNOME Project that are working on making it easier
    to install GNOME:'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'the GNOME Install Project and the GNOME packaging team. Both teams are working
    to make binary packages faster for more users. Still, the first release of a new
    application is often a tarball. If you don''t want to wait for someone to make
    an rpm, you have several options, which we discuss in this section.


    # Request an rpm on gnome-list


    Sometimes the best thing to do is simply send out a general request for an rpm.
    Often, someone will volunteer to make an rpm and post it to the GNOME ftp server
    for download.


    # Make Your Own rpm


    Making your own rpm can be surprisingly easy or frustrating, depending on your
    expertise and the condition of the source code. To make an rpm, there must be
    a file called the *spec* file in the main directory of the unpacked tarball. The
    spec file provides instructions on how to make the rpm. If the spec file exists,
    try entering the following-command:


    ```

    rpm -tb [tarball_name]

    ```


    Creating rpms is beyond the scope of this book, but there is some documentation
    available that covers the subject. The rpm Web site, http://www.rpm.org, provides
    a good introduction to rpms, as well as an online book that covers rpms in detail.
    You should also review the rpm man page on your computer.


    # Install the Application from a Tarball


    There are often problems with mixing GNOME binary packages and tarballs. When
    you install an application from source code, there are files called libraries
    that must be present on your system so that the source code can compile into a
    binary executable.


    If you want to install an application from source code and your base GNOME installation
    is from rpms or other binary packages, there are some extra steps you must take
    to get the tarball to compile you can use it.


    First, download and install the development packages from the GNOME Web site or
    from your Linux distribution CD. The development packages have libraries that
    are needed for source code to compile.


    Attempt to install the GNOME application. Pay careful attention to any errors
    you get when you run the configure script. Sometimes if you download and install
    the source code of an application, it won''t find the other libraries it needs
    the required libraries were created from an rpm. For example, rpms often place
    executables in /usr/bin and libraries in /usr/lib, whereas GNOME configure and
    make files put them in /usr/local/bin and /usr/local/lib.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Installing and Running GNOME Applications


    You might have add symbolic links to the libraries or define a path to the libraries
    so the configure script can find them.


    The alternative to this problem is to install GNOME from source code and install
    all applications from source code. Installing from source code is not an easy
    endeavor and can be time-consuming, but it is the best way to learn about your
    system.


    # Summary


    In this hour, you ran GNOME applications from the Main Menu, a desktop icon, File
    Manager, a panel launcher, and a shell prompt. You learned how File Manager works
    behind the scenes to run applications. You explored the GNOME Software Map and
    found interesting applications. Finally, you installed new GNOME applications.


    # Q&A


    +   - Most of the applications on the GNOME Software Map appear to be in the early
    stages of development. Won''t there be lots of bugs? Will they crash your system?


    +   - As a project, GNOME is barely two-years-old, so most of the applications
    are new. If the Stable Source Code icon appears in an application entry, which
    means the application has been tested sufficiently for the developer to be satisfied
    with the application''s stability. Remember, however, that there are no guarantees.


    +   - How can I learn to develop my own GNOME applications?


    +   - Hours: 23, "GNOME Technologies," and 24, "Anatomy of a GNOME Application,"
    provide basic information on the anatomy of GNOME applications and GNOME programming.
    You will also learn where to get more information on GNOME application development
    in these chapters.


    # Workshop


    The quiz questions and exercises are designed to increase your understanding and
    to encourage you to continue experimenting. Answers appear in Appendix B, "Answers."


    # Quiz


