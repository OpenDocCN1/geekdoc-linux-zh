  md: 'Not all the files on a remote site can be viewed. If you do not have read permission
    on a file, you will not be able to view it. Usually, all the files in the /pub
    directory can be viewed and downloaded via anonymous login.


    +   **Edit program** If you have write permission to a file on the remote file
    system, you can edit the file via FTP. Enter the command that starts the file
    editor of your choice in the Edit Program field. You must specify an editor in
    the Edit Program field to edit files in gFTP; there is no default editor.


    If you have logged in via anonymous login, or if you do not have write permission
    on the file, you will not be able to open the file using Edit.


    +   **Connect timeout** Check this box to have gFTP close the FTP connection if
    there is no activity within the specified period.


    +   **Connect retries** Enter the number of times gFTP should try to establish
    a connection before giving up.


    +   **Retry sleep time** Enter the number of seconds to wait before trying a busy
    site again.


    +   **Bring up reconnect dialog** Check this box if you want to manually reconnect
    to a site instead of having gFTP automatically try.


    +   **Do transfer at a time** gFTP can perform several downloads simultaneously,
    because it is multithreaded. If you have low bandwidth—for instance, if you are
    connected via an ordinary telephone line and dial-up modem—check this box to prevent
    simultaneous downloads of files.


    +   **Preserve permissions** Keep the permissions that the file had on the remote
    computer for the owning user, owning user''s group, and others.


    +   **Resolve Remote Symlinks** If you want to download a file that is a symbolic
    link of another file, download the symbolic link as a standalone file with the
    same contents as the original file, not as a link. You will almost want to check
    this option.


    +   **Show hidden files** Display the hidden files in both local and remote windows.'
