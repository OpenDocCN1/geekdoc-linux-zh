  md: '# The Internet and GNOME


    # Identity Tab


    In the Identity Tab of Preferences, set your username, email address, reply-to
    address (if different from the email address), and the pathname to your signature
    file.


    The reply-to-address is useful if you want replies to your messages to go to a
    different location than where you are. For example, if you are using the Balsa
    email at work but want to receive a reply at your home email address, change the
    Reply-to field to your home email address.


    Signature files are a great way to personalize your outgoing email messages. You
    can use them as a business card, to attach your contact information to every email,
    or you can use them to attach a clever saying of the day or a favorite quote.
    To create a signature file, create a new text file in your favorite editor and
    enter the text that you want to appear in your signature. Save the file in your
    home directory with the filename .signature.


    > You can call the signature file anything you want and save it anywhere you want,
    but $HOME/.signature is the default.


    If you want to save the signature file in a location other than your home directory,
    the Browse button to navigate to your desired location.


    # Mail Servers Tab


    The Mail Servers tab is important, because although the installation dialog boxes
    have places for you to enter your SMTP server and outgoing email information,
    you still have to enter your incoming email information manually here.


    To enter an incoming email server, click Add in the Remote Mailbox Servers field.
    Enter a mailbox name for the messages to be downloaded, such as Inbox.


    Check box is the mailbox that Balsa will download messages to when you click Check.
    Password is your email password that is assigned by your ISP.


    # Display and Misc. Tabs


    The Misc. tab contains an option for you to customize the prefix that delineates
    the contents of a message that you are replying to. The default symbol is "<",
    but you can specify any character, or even a string of characters.'
