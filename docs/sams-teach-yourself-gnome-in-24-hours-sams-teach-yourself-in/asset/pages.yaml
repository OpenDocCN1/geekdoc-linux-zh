  md: '# Managing Files in GNOME


    The Help menu simply opens an About window that gives the version of gme you are
    running, the gme Web site, and an email address where you can submit bug reports.


    # The Toolbar


    The Toolbar buttons help you navigate through your system and control the File
    Manager display.


    As you navigate through your file system, File Manager remembers which directories
    you have activated. Click Back to go back to the previously active directory.
    Click Forward to return to the next directory you opened.


    > File Manager''s Back and Forward buttons work just like the Back and Forward
    buttons in an Internet browser.


    You can also use the Up and Home buttons to navigate through your directory tree.
    Click Up to go one directory in the directory tree. Clicking Up opens the parent
    directory of the active directory. You can click Up to navigate all the way to
    the root directory.


    Click Home to make your Home directory the active directory. If you are logged
    in root, this button makes the /root directory the active directory.


    Rescan scans the active directory for changes, just like the Rescan directory
    in the Edit menu.


    The four View buttons—Icon, Brief, Detailed, and Custom—change the view in the
    same way as the menu items of the same name do in the Layout directory.


    # Right-Click Menus


    File Manager has several menus that are activated by right-clicking in particular
    places in the File Manager windows, and for certain kinds of files.


    # Right-Click the Window


    Right-click an empty area in the active directory window to open a menu with three
    entries:


    +   - Rescan Directory scans the active directory for changes.

    - New Directory creates a new directory in the active directory or, if you give
    a full pathname, wherever you specify.

    - New File opens the default text editor to a new file.'
