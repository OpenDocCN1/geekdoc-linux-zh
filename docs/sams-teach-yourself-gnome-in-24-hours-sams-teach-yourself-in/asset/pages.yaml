  md: '# FIGURE 17.4


    Use the Software Map icons to find interesting-GNOME applications.


    ![](img/56ffc05f2012b0375f08095ea492838b_257_0.png)


    # Screenshot


    A Screenshot means that a screenshot of the action in action is available. Screenshots
    are usually found on the Website of the application.


    # Stable Source Code


    This icon means that the source code has been released as a stable version. Stable
    means that the source code is bug-free enough for its main functionality to work.
    Also, under normal conditions the application should not crash. A stable release
    is not necessarily a 1.0 release; don''t put off by releases that are numbered
    in the 0.10s, if the Stable Source Code is present.


    # Development Code in CVS


    The red asterisk in the Legend means that the application is checked into GNOME
    CVS. Not all applications are considered to be part of the GNOME Project, and
    not everybody who works on GNOME has a CVS account. Some applications are checked
    by individuals who use GNOME tools, who aren''t part of the core GNOME team. If
    the asterisk appears, that means that the development version of the app has been
    checked into CVS for everyone to test and debug. You will learn more about CVS
    in Hour 22, “Upgrading GNOME and Joining the GNOME Project."'
