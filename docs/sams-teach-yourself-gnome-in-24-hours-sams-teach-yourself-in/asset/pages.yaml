    # # How to Install GNOME Software from Source Code


    When you know the process of installing from source code, it is actually quite
    simple. This section is long, but don''t be put off. The more you understand about
    the underlying mechanics of compiling and installing, the easier it will be to
    recognize and fix problems, and the more likely it is that you will be successful
    with minimal effort. The first step is to make sure that you have the software
    you need to compile and install source code on your system.


    # ## Obtain the Compilation Tools


    The following sections list and describe the compilation utilities that you need.
    If you installed Linux from a distribution CD, you might already have this software
    installed. Use the whereis or locate command to make sure.


    > > When running the locate command, remember to issue the command updatedb first,
    if you haven''t done so recently.


    ![](img/56ffc05f2012b0375f08095ea492838b_327_0.png)


    # ## Autoconf


    Autoconf creates a shell script called configure that automatically adapts the
    source code of a software package to your UNIX system. You don''t need autoconf
    to run the configure script; you do need it if you want to re-create the configure
    script. The configure script tests for the presence of each item that the software
    package might need. As it tests for each feature, the script prints a one-line
    message on the screen to let you know what it is testing. If the configure script
    for an item that is needed and doesn''t find it, it exits and displays an error
    message. It also displays a line number indicating where the configure script
    was written when it exited. You can use this information to look at the script
    for information that might help you fix the error.'
