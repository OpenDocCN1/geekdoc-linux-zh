    # HOUR 21


    # Uninstalling GNOME and Getting Help


    Uninstalling GNOME is very much like installing GNOME, except that you follow
    all the steps in reverse. Like installing GNOME, the procedure differs a bit depending
    on whether you installed from tarball or a binary package.


    The biggest weakness of GNOME, which is freely admitted by the developers of the
    project, is its lack of documentation. Very few GNOME applications have more than
    the hereof files, and even The GNOME User''s Guide is not complete. Since the
    release of October GNOME in October 1999, the members of the GNOME Project have
    reinvigorated the GNOME Documentation Project, or GDP, and there are many new
    volunteers. Until more formal documentation is developed, the GNOME mailing lists
    remain the best place to get help.


    In this hour, you will


    +   - Uninstall GNOME from compiled source code and from a binary package (rpm
    or deb).


    +   - Uninstall Enlightenment in preparation for upgrade and to completely remove
    Enlightenment from the computer.'
