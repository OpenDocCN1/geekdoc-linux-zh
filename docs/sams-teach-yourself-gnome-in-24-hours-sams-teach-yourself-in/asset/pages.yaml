- img_proc: true
  md: '# How It All Comes Together


    The window manager tells GNOME where windows are located and how they are placed.
    GNOME also gets information from the window manager about which programs are open
    and how they are configured. GNOME then uses this information to make the GNOME
    Tasklist and, when you log out, save the session. The window manager and GNOME
    both send information to X, which causes the correct information to appear on
    the screen.


    In his white paper, GNOME Technologies: A Brief Description of the Technology
    Behind GNOME, David Mason described the information exchange between GNOME and
    the window manager as "hints." If the window manager cannot read the hints from
    GNOME, the window manager is not GNOME compliant, and the full functionality of
    GNOME will not be available within the window manager.


    Figure 4.2 the relationship between X, the window manager, and GNOME.


    ![](img/56ffc05f2012b0375f08095ea492838b_63_0.png)


    The window manager sends information to GNOME about the file that is open, such
    as the application name, the path, and the size and placement of the window. GNOME
    uses the information from the window manager to add to the GNOME Tasklist on the
    Panel.


    If you use drag-and-drop within the application, say to move a file from one directory
    to another in the File Manager, other functions in the GNOME libraries will send
    that information to the X server. The X server then tells the kernel to move the
    file.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'The window manager also sends information to the X Server so that the application
    appears in the correct place, and so that you can interact with the window using
    the mouse and keyboard.


    # GNOME-Compliant Window Managers


    If a window manager is “GNOME compliant,” it means that you can take full advantage
    of the functionality of GNOME within the window manager. It can accept directives
    from GNOME and give information to GNOME in order to keep track of the items that
    enable features such as the GNOME Tasklist, session management, and drag-and-drop
    to work.


    Although GNOME works to a certain extent with virtually all X window managers,
    the level of GNOME compliance varies. To date, the only fully GNOME-compliant
    window managers are Enlightenment, FVWM, sawmill, IceWM, and WindowMaker.


    ![](img/56ffc05f2012b0375f08095ea492838b_64_0.png)


    > Red Hat, which supports GNOME as the primary desktop environment, packages several
    window managers into its distribution, including FVWM, NextStep, AfterStep, and
    Enlightenment. Check your file system to see what window managers you might have
    installed already.


    # Enlightenment


    Enlightenment is the default window manager for GNOME. Like the rest of GNOME,
    Enlightenment is free software. It is continually being developed and expanded
    by the Enlightenment Project, and anyone with energy and know-how can contribute.
    The Web page for the Enlightenment Project is http://www.enlightenment.org.


    Enlightenment works on the following platforms, in addition to all flavors of
    Linux:


    +   * Solaris

    * FreeBSD

    * Linux 2.X [ libc5 and glibc2 ]

    * AIX *

    * Irix *

    * HP/*'
