  md: '# HOUR 14


    # Setting Up a Remote Connection in GNOME


    Although GNOME is exciting and fun by itself, eventually you want to connect with
    the rest of the world via the Internet. The first half of this hour is not concerned
    with GNOME in particular; it presents the information you need to set up a dial-up,
    PPP connection either to your ISP or to your office. The second half of the hour
    deals with GNOME PPP utilities and how to set them up and use them.


    If you are already familiar with Linux or a UNIX flavor, most of this chapter
    will be repetitive. You can skip to “Setting Up a New Account in GNOME PPP Dialer”
    to read about the GNOME PPP utilities. If you are new to Linux, then this section
    might reduce some of the mystery and frustration surrounding setting up a remote
    connection in Linux. This hour will give you the most basic information you need
    to set up a dial-up connection, and will walk you through the process.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 186 Hour 14


    In this hour, you will


    +   * Use the Point to Point Protocol to connect to the Internet.

    * Gather information about your ISP account and modem.

    * Set up a PPP account in GNOME PPP Dialer.

    * Configure GNOME PPP Dialer to your preferences.

    * Use the PPP Applet and Modem Lights to make and monitor your PPP connection.


    PPP stands for Point to Point Protocol. PPP is the protocol used to communicate
    with other computers over a modem, via the TCP/IP protocol. PPP is also used for
    other serial connections, for example, when you connect one computer directly
    to another via a serial cable. PPP converts digital packets to analog format,
    which can be sent via a telephone line.


    The PPP daemon, or pppd, controls ppp in Linux. When you dial to your ISP, pppd
    negotiates your PPP client with the ISP''s PPP server, and attempts to authenticate
    your password as a valid client of the PPP server. Several different authentication
    procedures can be used to set up a connection: a script-based login, PAP, or CHAP.
    Contact your ISP''s PPP server expects.


    PPP can also be used if you want to dial up your company''s PPP server. Contact
    your network administrator for information on how to set up a PPP client account.


    Some ISP''s use the older SLIP protocol for Serial Line Internet Protocol. Dialing
    up to a server that uses SLIP is similar to PPP. PPP is considered to be an improvement
    over SLIP, so most ISP''s use PPP today.


    ![](img/56ffc05f2012b0375f08095ea492838b_209_0.png)


    > This section is geared towards the home user, to help you in the times-complicated
    process of setting up a PPP connection. If you are using Linux at work, then your
    administrator should set up the connection for you.


    Setting up a PPP connection is quite a bit more complicated in Linux than in MS
    Windows or MacOS. This helps you gather all the information you need to set up
    a connection successfully. First, you should ask some questions about your ISP.
    Next, you will need some information about your modem.


    There is quite a lot of information to gather before setting up a new PPP connection.
    If you have already set up a PPP connection in Linux using wial, minicom, or seyon,
    you have all the information you need. If you haven''t used the Internet in Linux
    yet, preparations can take some time. You might have to contact your ISP for some
    of the information you will need.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Gathering Information About Your ISP


    Before you set up your account in PPP Dialer, there is information that you must
    get from your ISP or systems administrator about your account. When you have the
    follow-information, you will be ready to create an account in GNOME PPP Dialer:


    +   - **Dial-in telephone number** The phone number you dial to get a PPP connection.

    - **Username** The username assigned to you, such as judith@samsource.com or netflix/alain.

    - **Password** Your unique, user password.

    - **Protocol** PPP is the most common, but some ISPs still use the older SLIP
    protocol.

    - **Authentication** Contact your ISP for the authentication protocol it uses,
    such as CHAP, PAP, or a login script.

    - **Your IP address** Most ISPs dynamically assign you an IP address each time
    you log in. If you don''t have a fixed IP address, don''t worry about this.

    - **Dynamic Name Service (DNS)** Servers Record the addresses of the ISP’s primary
    and secondary DNS servers.

    - **Login script** If you don''t use CHAP or PAP authentication, you will need
    a login script. You can get a login script from your ISP, or you can try to improvise
    a script.

    - **Search domain** The search domain is often the same as the domain name, such
    as umich.edu, or netcom.com. Some ISPs, particularly universities, might have
    several-search domains.


    # Gathering Information About Your Modem


    ![](img/56ffc05f2012b0375f08095ea492838b_210_0.png)


    If you want to learn how modems work in Linux, read the modem HOWTO at http://www.linuxdoc.org/HOWTO/Modem-HOWTO.html.
    The HOWTO explains in layman’s terms how modems work, which can be extra-ordinarily
    useful if you are having problems getting your modem to work in Linux. The HOWTO
    is long and might be difficult to understand, but try not to put it off. The extra
    effort to read it can be well worth it.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Is Your Modem Compatible with Linux?


    Most internal and external modems that connect to the computer via a serial port
    can be used in Linux, with one major exception. If your modem is a Winmodem, that
    is, if was designed to work only under MS Windows, then it will not run under
    Linux. Winmodems contain software that is meant to emulate a chip in hardware
    modems that converts digital signals to analog signals so that they can be transmitted
    via telephone. These modems will not work under Linux at all.


    Also, if your modem is Plug and Play, you might have trouble configuring it in
    Linux. Some plug-and-play modems can be manually configured like ordinary modems.
    Otherwise, there are Linux plug-and-play drivers available. See the LDP Plug-and-Play
    HOWTO at http://www.linuxdoc.org/HOWTO/Plug-and-Play-Linux.html.


    To verify that your modem is compatible with Linux, see the Linux Hardware Compatibility
    HOWTO at http://www.linuxdoc.org/HOWTO/Hardware-HOWTO.html.


    # Which Serial Port Is the Modem Connected To?


    In Windows, serial ports are named COM1, COM2, and so on. In Linux, they are named
    tty0, tty1, and so on. Older versions of Linux named serial ports cua0, cual,
    and so on. In addition, some versions of UNIX use the cua convention. Table 14.1
    compares the three conventions for easy refrence


    | TABLE 14.1 Linux Nomenclature for Serial Ports |

    | Serial Port | Obsolete Linux Serial | Serial Port |

    | | Port Name | in Windows |

    | tty0 | cua0 | COM1 |

    | tty1 | cual | COM2 |

    | tty2 | cua2 | COM3 |


    Before you can configure your modem, you must know which serial port it is connected
    to. There are several ways to accomplish this.


    Look in the /dev/modem file for the device file it is linked to. Some Linux distributions
    automatically create this file and a symbolic link to the correct /dev/ttySx device
    file. Right-click /dev/modem and select Edit Symbolic Link. The correct /dev/ttySx
    file will be listed. In Figure 14.1, the /dev/modem file is linked to /dev/tty2.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Setting Up a Remote Connection in GNOME


    # Figure 14.1


    In many distributions, /dev/modem is created automatically during installation.
    Right-click the /dev/modem file and select Edit Symlink to display this window.


    ![](img/56ffc05f2012b0375f08095ea492838b_212_0.png)


    If /dev/modem does not exist or is pointing to the /dev/ttySx file, and if you
    have a Windows partition on your computer, an easy, cheating to find the serial
    port is to look up your system information in Control Panel. Apply the COM port
    number to Table 14.1 to determine the serial port nomenclature in Linux.


    If you have no luck with the methods mentioned previously, you can configure wdial.
    Wdial is a text-based PPP dialer that does all the work for you. After you install
    and configure it, wdial checks each serial port until it finds your modem. It
    then initializes the modem, tests the modem speed, and connects to your ISP. Wdial
    is such a wonderful program that many people use it in the desktop environment
    as well. You can download wdial from http://freshmeat.net.


    After you have determined the correct serial port, create a symbolic link from
    the serial device file where your modem is located to /dev/modem. This step isn''t
    strictly necessary to get a working PPP connection, but it makes things easier
    if you forget the correct serial port, or if someone else as a system administrator
    works on your system. Review Hour 9, "Common File Manager Tasks." if you need
    help creating links.


    # Special Initialization String


    Does your modem require a special initialization string? Most modems initialize
    with the ATZ string, which is the default in PPP Dialer. Check your modem manual
    if you have a different initialization string.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Setting Up a New Account in GNOME PPP Dialer


    Now that you have collected all the information you need, you are ready to set
    up a connection to your ISP in GNOME PPP Dialer.


    GNOME-PPP is part of the gnome-network package. It provides a graphical way to
    create a PPP connection with your Internet service provider. To use GNOME-PPP,
    you must first create a new PPP dialup account. Open GNOME-PPP from main menu.
    Internet and click Account.


    Shown in Figure 14.2, the PPP Account dialog box has many tabs that will look
    familiar if you have set up connections in Windows. The tabs are described in
    the following sections.


    # FIGURE 14.2


    The PPP dialog box of GNOME PPP Dialer provides a graphical interface for information
    that once had to be entered into scripts.


    ![](img/56ffc05f2012b0375f08095ea492838b_213_0.png)


    # Dial Tab


    In the Dial tab, enter the Account Name. This name will appear in the PPP Dialer
    window.


    In Phone Numbers field, enter the phone number or numbers you use to connect.
    If you add more than one phone number, PPP Dialer will dial each number in turn
    until it makes a successful connection. Don''t forget to include a 1 for a long-distance
    connection number, or a 9 if you dial 9 to get an outside line. A comma causes
    a one-second pause in dialing. Two commas will cause a two-second pause.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Setting Up a Remote Connection in GNOME


    If you have call waiting on your phone line, you should disable it before making
    an Internet connection. Add the code that disables call waiting in front of your
    ISP dial-up phone number. For example, if the disable call waiting code is *70
    and your ISP''s phone number is 123-4567, enter *70,1234567 in the Phone Numbers
    field to prevent the loss of connection due to an incoming call.


    ![](img/56ffc05f2012b0375f08095ea492838b_214_0.png)


    If your connection time tends to be slow, enter a higher number than the default
    of 60 seconds in Dial Timeout.


    ![](img/56ffc05f2012b0375f08095ea492838b_214_1.png)


    If you make a successful connection but your daemon dies soon after you connect,
    try increasing the Dial Timeout. The timer doesn''t stop until all negotiations
    are complete and a successful PPP connection has been established. If your Dial
    Timeout expires during an authorization, the ppp daemon can die.


    # Authentication Tab


    Enter your account username and the password in the Authentication tab. If you
    use CHAP or PAP authentication, the username and password entered here will be
    used in the authentication process. If you use a login script, the Script tab
    will use the username and a masked version of the password as part of the script.


    # IP Address Tab


    If your ISP dynamically assigns you an IP address, which is usually the case,
    check Dynamic for each field in the IP Address tab. If you have a fixed IP address,
    enter the information in the proper field. If you are dialing to your company''s
    server, rather than an ISP, you might have to enter specific values for your local
    IP address, netmask, and remote IP address. Check with your system administrator.


    # DNS Server Tab


    DNS stands for Domain Name Service, which is a worldwide database for translating
    hostnames into IP addresses. Your ISP will usually have a primary and a secondary
    IP address. In the DNS tab, enter the primary address, then the secondary. If
    your ISP has several search domains, enter them in the Search Domain field. If
    you don''t know the search domains, enter the ISP domain name or leave the entry
    blank.


    ![](img/56ffc05f2012b0375f08095ea492838b_214_2.png)'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Script Tab


    If your ISP gives you a script to connect with, instead of CHAP or PAP identification,
    enter it in the login script field. Enter the script line by line in the dialog
    box that appears when you click the Action drop-down menu, and enter Add after
    each line. You can use the Action drop-down menu to specify what each line of
    text is.


    For example, select Send in the drop-down menu, and then enter your username in
    the login script field and click Enter. In the complete script field in the lower
    half of the dialog box, the word Send appears in the Action column and your username
    in the Text column. The line of the login script is an instruction to Send the
    string of text in the Text column to the ISP server.


    If you forget to add a line, use the Insert button to open a file. Highlight the
    line below the point where you want to insert a line and click Insert. A blank
    line is opened above the selected line. A sample script is shown entered into
    the Script tab in Figure 14.3.


    Figure 14.3 give you a special script for Linux, if you don''t use CHAP or PAP
    for authentication.


    ![](img/56ffc05f2012b0375f08095ea492838b_215_0.png)


    # PPP Tab


    If your ISP gives you any information for the PPP tab, enter it in the proper
    fields. Otherwise, leave the default values.


    # Modem Tab


    The Modem tab contains areas for you to configure your modem settings. Check your
    modem manual for any adjustments you should make to the default values. Usually
    the defaults will work fine, although if your phone line quality is poor, considering
    lower the connection speed. If you choose the highest connection speed, your modem
    will connect at the fastest speed it can, limited by the quality of your phone
    connection. If your PPP daemon tends to die at random times, try choosing a lower
    modem speed'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Setting Up a Remote Connection in GNOME


    If you have an initialization string other than ATZ or any other edit to make
    to the modem commands, click Edit Modem Commands and make adjustments. The default
    modem commands are shown in Figure 14.4.


    Figure 14.4


    Check your modem user''s manual for any adjustments you might need to make to
    the default values.


    ![](img/56ffc05f2012b0375f08095ea492838b_216_0.png)


    # Making a Connection


    After you have set up your new account, click OK to close the Account dialog box.
    Click Connect to start the ppp daemon. A few seconds will lapse while your modem
    initializes. The modem dials, and then the authorization sequence begins after
    the server answers. If your PPP daemon dies unexpectedly, check your settings.
    It sometimes helps to try to make a PPP connection with another utility, such
    as wvdial. A successful connection is shown in Figure 14.5.


    Figure 14.5


    The small message box on PPP Dialer program provides brief messages about the
    connection status.


    ![](img/56ffc05f2012b0375f08095ea492838b_216_1.png)


    If you have done everything in this chapter, and still can''t get a connection,
    you might have a permissions or ownership problem. Check through these files to
    make sure you have read and executed permission for them:


    +   * /etc/chap-secrets

    * /etc/pap-secrets

    * /etc/resolv.conf'
  merge: -1
