    # Q&A


    +   - I Selected Save before logging out of my last session, but now, when I try
    to log in, my panel is missing, no windows appear, and my icons are blacked out.
    What should I do?


    +   - A sometimes in your session breaks, which can cause unpredictable results
    the next time you log in to GNOME. To fix a broken session, log out of GNOME (using
    Ctrl+Alt+Backspace if necessary). From the command line, navigate to ~/.gnome
    and delete the files that include “session.” such as session and session-manual.
