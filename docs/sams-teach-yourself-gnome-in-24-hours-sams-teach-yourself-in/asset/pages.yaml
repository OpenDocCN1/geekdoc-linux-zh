  md: '# HOUR 12


    # Understanding and Using Themes


    One of the fundamental goals of the GNOME Project is to create a desktop environment
    that can be customized and configured to meet the user''s exact desires. To this
    end, the GNOME developers have set another goal to create a suite of tools that
    enable an ordinary user to alter or her desktop without programming, and without
    understanding anything about the underlying GNOME architecture. One of the most
    dramatic and visually arresting results of these goals is the use of themes.


    ![](img/56ffc05f2012b0375f08095ea492838b_178_0.png)


    > GNOME is not the only desktop project to use themes. KDE/KWM, AfterStep, BlackBox,
    Enlightenment, IceWM, sawmill, and Windowmaker all use themes to change the look
    and feel of the desktop. This chapter concentrates on GTK and Enlightenment themes,
    but the same ideas apply to other window managers and desktop environments.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# The Magic of Themes


    In this hour, you will


    +   - Explore how themes work with the Gimp ToolKit and X to create a graphical
    user interface on your desktop.

    - Learn about the two kinds of gtk themes and the components of a gtk theme.

    - Obtain and install gtk themes.

    - Obtain and install Enlightenment themes.


    If you were to walk into a room of people using GNOME, and you looked at each
    screen, you would see a dizzying variety of designs. One desktop might have a
    very bare and sparse look to it (like most of the screen shots in this book).
    It might have a plain background, ordinary sans-serif fonts, and plain window
    borders. Another desktop might seem like the console of a starship than a computer,
    with glowing green fonts and menus that appear in the center of starbursts. One
    desktop might remind you of Merlin’s spellbook, with black webs and pop-up menus
    that resemble clouds of smoke. Some people have desktops that look very much like
    those of Windows, Macintosh, SGI, or Amiga.


    All these looks are created by different themes that work with GNOME and your
    window manager to make your computer look like anything you can dream of, limited
    only by the imagination of the theme developers and the amount of memory in your
    video card.


    # How Themes Work


    In GNOME, you actually choose two themes for your desktop: a gtk theme and a window
    manager theme. The gtk theme controls the look of your GNOME applications, menus,
    and Panel. The window manager theme controls the look of the window borders, window
    manager tools, and pop-ups. Some themes, such as blueHeart, include their own
    menus. Finally, you choose a background that corresponds with the themes on your
    desktop.


    The gtk theme and the window manager theme work differently, but the general idea
    is similar. Before we understand how themes work, we must understand a little
    about how the graphical user interface works.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Understanding and Using Themes


    As we learned in Hour 4, “Working with Window Managers,” the X Window system enables
    you to interact with your computer with a mouse, instead of merely typing commands
    on a keyboard. The X libraries interpret a mouse click on a menu item or button
    into command that the kernel understands. Before you use menus and dialog boxes,
    however, something must give directions to X to create the menu, checkbox, or
    button, so that it appears on the desktop. In GNOME, the set of libraries that
    provides this function is called the Gimp Toolkit, or GTK. It is an API, or application
    programming interface. An API is a programming library that makes it easier to
    create graphical user interfaces for programs.


    Figure 12.1 shows a window from the GNOME Address Box. You see a set of tabs on
    the top of the window, which you click on to choose different dialog boxes. The
    dialog box shows a set of checkboxes and some buttons in the middle. On the right
    is a box titled Phone List, which numbers appear after you have entered them in
    the Number field. The appearance, location, and function of all these are controlled
    by GTK.


    FIGURE 12.1

    GTK controls all the dialog components that perform some action. The Basic gik
    theme is shown here with the X11 Enlightenment theme.


    ![](img/56ffc05f2012b0375f08095ea492838b_180_0.png)


    When you apply a theme to your desktop, the theme tells GTK what color to make
    the box, the buttons, and the fields. It gives instructions on how the field color
    will change when you place the mouse over it, what color an active versus inactive
    tab will be, and in what the menu items will appear. Figure 12.2 shows the same
    dialog box as in Figure 12.1, but with a different theme. Notice how the look
    of the dialog box is completely different, but the elements are the same.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'FIGURE 12.2

    The same window as in Figure 12.1 is shown with the Expensive gtk theme and the
    Shiny Metal Enlightenment theme.

    Notice how different it looks!


    ![](img/56ffc05f2012b0375f08095ea492838b_181_0.png)


    It is important to understand that only applications written using GTK are affected
    by gtk themes. Other APIs such as Qt, which is used by KDE, and Motif, which is
    used by Netscape, will look the same regardless of which gtk theme you use. Keyboard
    shortcuts are also different when different GUI libraries are used. Do not get
    confused if a shortcut that works in WordPerfect does not work with gedit.


    ![](img/56ffc05f2012b0375f08095ea492838b_181_1.png)


    # Kinds of GTK Themes


    There are two kinds of gtk themes: plain (also called gtkrc) themes and pixmap
    themes. Plain themes only change the colors and fonts of the items in your applications.
    Some examples are Blue-N-Gray, Metal, Morphius, ThinIce, and buffERO. They tend
    to be fast, because the GTK widget only draws with color schemes and Pixmap themes,
    on the other hand, can look like anything within the limits of the GTK widget.


    A pixmap lets you store a picture as data in a file that can be used by other
    files, such as a GTK widget. (This analogy is not totally accurate, but to help
    you visualize the concept, you can think of a pixmap as a digital map of a picture.)


    gtkrc themes are much faster than pixmap themes, because with a pixmap theme,
    each pixmap must be loaded separately into a window on the screen. Pixmap themes
    eat up system resources and can slow down your whole desktop, but if you have
    sufficient memory, they can be well worth it. Figure 12.3 shows the gtk blueHeart
    theme with the Enlightenment blueHeart theme.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# FIGURE 12.3


    blueHeart is one of the most popular themes. To get the full effect, view the
    screenshot at http://ie.themes.org.


    ![](img/56ffc05f2012b0375f08095ea492838b_182_0.png)


    # Components of a gtk Theme


    There are two parts to a theme: the engine and the gtcre file, or configuration
    file. Pixmap themes also have .png files, which are the actual pixmaps. A GTK
    engine loads the GTK libraries that are needed by the theme so they can be drawn
    on the screen. The engine “instructs” the theme on how to draw a widget. If you
    look at different themes, you will notice that the components look different.
    Some have large, flat buttons: some buttons are narrow and three-dimensional.
    Some themes use radio buttons, and some use check boxes. Scrollbars are oblong,
    and others are rectangular. These differences are because of different engines
    for the individual themes. You must have the appropriate engine installed on your
    machine for the theme to work.


    NEW TERM A widget is an item in a window that performs some task, such as the
    function of a button, scrollbar, or menu.


    The gtcre file contains information on the fonts, colors, and engine for GTK to
    use. Plain themes are made with the gtcre file. The pixmap themes also have graphical
    image, or .png files.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Libraries Needed for gtk Themes


    To run a gtk theme, you must have the following libraries installed:


    +   - glib

    - gtk libraries

    - gtk-engines


    Before you install a particular theme, make sure that you have the correct version
    of the libraries for that theme; the required library version will be listed in
    the theme summary for the gtk Themes Web site at http://gtk.themes.org. Use GTK
    Downloads on the Web site to obtain the latest version of glib, gtk+, and gtk-engines.


    # Obtaining and Installing gtk Themes


    The gtk-engines module comes with many popular themes. These themes are automatically
    installed when you compile gtk-engines. In addition, the gtk Themes Web site,
    http://gtk.themes.org, has more than 100 themes available for download, links
    to theme sites for window managers, and some excellent tutorials on creating your
    own themes.


    Have a specific location to store all the tarballs that you download. For example,
    you can download a new theme to /var/tmp/, and then copy it to /usr/src/gtk_themes.


    > You should store all your tarballs in a directory such as /usr/src. When you
    want to uninstall or upgrade a module, you must know where the source files are.


    # Installing a gtk Theme


    Installing a theme is easy. Simply open the GNOME Control Center from Main Menu,
    Settings, GNOME Control Center Double-click Theme Selector to launch the theme
    selector gadget. Click Install New Theme, and enter the pathname of the tar.gz
    file in the dialog box that appears. Close GNOME Control Center, and then reopen
    it to Theme Selector. If installed correctly, your new theme will appear in the
    Available Themes list.


    > You can also install a theme manually. cd to /usr/share/themes, and create a
    new directory with the theme name. Copy the theme tarball into the new directory,
    and unpack it using the command tar -xvf [theme_filename].tar.gz'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Understanding and Using Themes


    If your theme does not appear, make sure that your GTK, glib, and gtk-engines
    libraries are correctly installed, and that you have the most up-to-date versions.
    If the theme still doesn''t work, try installing the theme manually and pay careful
    attention to any error messages. If you cannot figure out the error on your own,
    send an email with the complete error message and a description of the problem
    to the GNOME Mailing List at `theme-list@gnome.org`.


    # Using a New Theme


    Using a new theme is even easier than installing it. Open the GNOME Control Center
    by clicking Main Menu, Settings, GNOME Control Center, and select Theme Selector.
    Scroll through the Available Themes list until you find one that looks interesting.
    Check the Auto Preview box and click on the name. The Preview box displays the
    new theme. If you want to see how the theme looks on your desktop, click Try.
    If you like the theme, click OK, and the new theme will become your permanent
    theme. To go back to your old theme, click Revert. Figure 12.4 shows the Theme
    Selector in the GNOME Control Center.


    Figure 12.4

    Use the Theme Selector to try out a new theme. You can change themes as often
    as you like.


    ![](img/56ffc05f2012b0375f08095ea492838b_184_0.png)


    # Uninstalling a Theme


    Uninstalling a theme is also simple. All the gtk themes are located in the /usr/share/themes
    directory. To delete a theme, simply delete its subdirectory from /usr/share/themes.
    The next time you start the Theme Selector, the theme will no longer appear. If
    you saved the original theme archive, you can reinstall the theme at any time.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# # Installing Enlightenment Themes


    After you have chosen a gtk theme, you should find a window manager that complements
    it. http://gtk.theme.org has links to theme pages for all the major window managers.
    Often, the developer of a gtk theme will give you an Enlightenment theme, and
    vice versa. Some themes—such as blueHeart, BrushedMetal, and BlueSteel—have theme
    versions for both GTK and Enlightenment that were specifically designed to go
    together.


    # ## Downloading an Enlightenment Theme


    Enlightenment themes are found at http://e.themes.org. Make sure that the theme
    you are downloading is for your version of Enlightenment. Older themes designed
    for Enlightenment v15 will not work in newer versions of Enlightenment. Each theme
    lists the Enlightenment version that it was designed for in its summary.


    Enlightenment theme download files are ordinary tarballs, but they have the extension
    .theme instead of .tar.gz or .tgz. You can install an Enlightenment theme in either
    two ways, for one user account or for accounts.


    # ## Installing an Enlightenment Theme for One User


    The simplest way to install an enlightenment theme is to copy the [filename].ethame
    file directly into the ~/.enlightenment/themes directory. There is no need to
    untar the file. Restart Enlightenment, and select the new theme from the Enlightenment,
    Themes menu. The disadvantage of this approach is that only one account can access
    the theme, unless you manually copy the [filename].ethame file into the ~/.enlightenment/themes
    directory of each account on your system. If you have root access, you might want
    to try


    > You can also install a theme manually into ~, cd to ~/.enlightenment/themes,
    and create a new directory with the theme name. Copy the theme tarball into the
    new directory, and unpack it using the command tar -zxvf [theme_filename].ethame


    ![](img/56ffc05f2012b0375f08095ea492838b_185_0.png)


    # ## Installing an Enlightenment Theme for All User Accounts


    Make a directory for the new theme in /usr/share/enlightenment/themes, for example
    /usr/share/enlightenment/themes/Absolute_E'
  merge: -1
