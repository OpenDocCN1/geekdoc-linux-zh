  md: '# Connecting to an FTP Site


    The fastest way to connect to an FTP site via anonymous login is to enter the
    connection information in the Connect toolbar and then click the Connect button.
    If you don''t enter an FTP address in the Host field, a dialog box opens for you
    to enter an FTP address when you click the Connect button. Enter the URL of the
    site you want to connect, as shown in Figure 15.5.


    FIGURE 15.5

    Enter the hostname of the server you want to connect to. You can enter the IP
    address instead, if you know it.


    ![](img/56ffc05f2012b0375f08095ea492838b_231_0.png)


    If you want to manually specify the port number, username, and password, enter
    them in the fields on the Connect toolbar. If you leave them blank, gFTP will
    attempt anonymous login by default. To break the connection, click the red Disconnect
    button.


    As FTP connects and negotiates with the remote server, a log of the exchange is
    displayed in the log window. Messages are color coded to show the origin and purpose
    of the message:


    +   * Message text from gFTP to you is displayed in red.

    * Strings that are sent to the remote server are displayed in green.

    * Messages that come back from the remote server are displayed in blue.


    # Navigating the File Systems


    Navigating the local and remote file system is much like navigating the windows
    in File Manager. Double-click to open it and display the files inside. To navigate
    to a higher directory, double-click the parent, or "..", directory.


    > If you log in anonymously to an FTP site and no files or directories appear
    in the remote directory window, that means that no files or directories are available
    at that level for anonymous login.


    ![](img/56ffc05f2012b0375f08095ea492838b_231_1.png)


    # Downloading and Uploading Files


    Selecting a file for download is simple. Navigate through the remote directories
    until you reach the file you want to download. Then, navigate the local file system
    until you reach the directory where you want to place the downloaded item.'
