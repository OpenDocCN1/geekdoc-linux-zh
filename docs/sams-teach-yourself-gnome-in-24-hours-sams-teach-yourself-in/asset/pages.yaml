  md: '# Using GNOME for your Business


    Gnumeric comes with a full suite of data analysis tools and a “goal-seek” capability.
    Also, it can be completely automated to work within other applications, if there
    are CORBA bindings for the programming language the application is written in.


    Gnumeric comes with an online user manual and a function reference manual. The
    Web page for Gnumeric is http://www.gnome.org/gnumeric.


    # GNOME-PIM


    GNOME Personal Information Manager includes an address book, calendar, appointment
    scheduler, and task list. GNOME-PIM is fully compatible with Palm Pilot, and files
    can be downloaded and synchronized with Palm Pilot via the gnome-pilot tool.


    GNOME-PIM is available via tarball and rpm and Debian packages.


    ![](img/56ffc05f2012b0375f08095ea492838b_272_0.png)


    > For more information on gome-pilot, see http://www.gnome.org/gnome-pilot/. The
    Web page http://eunucs.org/linux/palm/index.html has useful general information
    on Palm Pilots and Linux.


    # GNOME Calendar


    Another component to GNOME-PIM, GNOME Calendar is comparable to commercially available
    calendars, such as Microsoft Schedule or Franklin-Coover Planner. If you are familiar
    with commercial time management software, GNOME Calendar will look familiar.


    The main window of GNOME Calendar contains tabs for daily, monthly, and yearly
    views of the calendar. The Daily View has an appointment calendar on the left
    and a To Do list on the right. You can customize the view in Preferences, GNOME
    Calendar is shown in Figure 18.3.


    FIGURE 18.3

    The features of GNOME Calendar are comparable to commercial calendars.


    ![](img/56ffc05f2012b0375f08095ea492838b_272_1.png)'
