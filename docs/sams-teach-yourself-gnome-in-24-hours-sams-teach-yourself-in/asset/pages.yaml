  md: '# Tarball Installation Process


    After you have verified that you have the right compilation tools, you are ready
    to download the tarballs. Before you begin the installation, download all the
    tarballs into one subdirectory. You can download and untar the tarballs into a
    shared directory, such as /usr/src or /usr/local/src, or into your home directory.
    The only step that must be performed by the superuser is to install.


    > If you download the tarballs into your home directory, it is still a good idea
    to maintain a library directory of all your tarballs in a place such as /usr/src.
    You must have the original source code in order to uninstall the binaries, once
    they are compiled.


    > Always keep the original tarball and untared source code directory tree (the
    directory that appears after you untar the tarball). You will need these files
    to uninstall the software.


    # Delete Old Versions of the Software


    If you have an older rpm version, or a binary of an older version of the software
    that you installed from source code, uninstall the older version before you install
    the new version. If you are installing libraries for GNOME or X, it is a good
    idea to exit from X and do the installation from a shell.


    # Untar the Tarballs


    Now you are ready to unzip and untar the tarballs. You can do this with one command:


    ```

    tar xvf [tarball]

    ```


    This command does several things at once:


    +   - It unzips the tarball.

    - It untars the tarball.

    - It creates an installation directory.

    - It installs all the files from the tar file into the installation directory,
    if the archived filenames begin with a directory name.'
