  md: '![](img/56ffc05f2012b0375f08095ea492838b_252_0.png)


    # # HOUR 17


    # # Installing and Running GNOME Applications


    GNOME has made a great contribution to the free software movement by making it
    easier to develop commercial-quality applications. The number of applications
    is increasing daily, and the range of the software is staggering. The base GNOME
    packages come with applications, but there are dozens more available. Applications
    are being developed for everything from spreadsheet and word processing applications
    to a car diagnostic tool. This hour will help you learn where to find GNOME applications,
    how applications work in GNOME, and the different ways to run an application.


    In Hour 7, “Using the Panel and the Main Menu,” you learned how to run applications
    while exploring the desktop environment.


    In this hour, you will


    +   * Learn how applications work within the GNOME desktop environment.

    * Open and run GNOME applications using different methods.

    * Explore the GNOME Software Map and find interesting applications to download.

    * Install new GNOME applications.'
