  md: '# Gnome-print


    Gnome-print is the set of printing libraries that will eventually be included
    in all GNOME applications that have printing capability. The package is still
    quite early in its development, so it may seem a little bare in its functionality.


    Of all the applications that use gnome-print now, Generic is in the most advanced
    stage to introduce printing in GNOME, but note that the dialog boxes for printing
    will be similar for every GNOME application that involves printing.


    Like Windows or MacOS applications, there are three stages to printing a document
    in GNOME: Print Setup, Print Preview, and Print. Print Setup contains options
    to control exactly how you want your printed page to look. Print Preview displays
    a screen preview of how the printed page will look. Print involves the printing
    action itself, including number of copies, printer to print to, and so on.


    # Print Setup


    The first Page tab (the leftmost tab) contains options for you to indicate the
    size, orientation, and scale of the printout. First, select either letter (upright)
    or landscape (horizontal) orientation.


    Next, if you want a printed page that is larger or smaller than the default, use
    Scale to adjust the printed size of the document by percentage of original, or
    by the number of pages the document should take up. The preferred scaling method
    depends on the kind of document you are printing. Graphics usually do better with
    a percentage scale, but spreadsheets are easier to read if you can fit them on
    one or two landscape pages.


