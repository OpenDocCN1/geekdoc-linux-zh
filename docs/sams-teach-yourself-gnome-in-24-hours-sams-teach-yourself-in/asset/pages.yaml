  md: '# Using the GNOME Center, or


    The GNOME Control Center, or GCC, is composed of a collection of small configuration
    applications, or capplets, each of which enable you to configure a part of the
    GNOME desktop. The number and kind of capplets that appear in the GCC vary according
    to the kinds of GNOME applications you have on your desktop. You might not have
    all the capplets described in this hour, or you might have some that are not described
    here, but the information in this hour should be used as a starting point to explore
    all the capplets you have. The capplets listed in this hour come with the base
    October GNOME installation packages.


    Figure 11.1


    Most customization of the GNOME desktop is done in the GNOME Control Center.


    ![](img/56ffc05f2012b0375f08095ea492838b_165_0.png)


    Some capplets also appear in the Main Menu as individual items. Clicking on these
    entries will open the GNOME Control Center with the capplet you have chosen.


    Not all the capplets in the GCC deal with customization. Capplets such as Theme
    Selector, MIME Types, URL Handlers, Dialogs, and MDI will be described in the
    hours that correspond with their function.'
