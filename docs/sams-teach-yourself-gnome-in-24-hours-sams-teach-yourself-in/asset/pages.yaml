- img_proc: true
  md: '# FIGURE 9.11


    The Sort By tool enables you to perform simple sorts in the active directory.


    ![](img/56ffc05f2012b0375f08095ea492838b_137_0.png)


    Remember, by default, directories will still appear before files. If you want
    directories to be sorted with files, open the Preferences dialog box, File Display,
    and check Mix Files and Directories. The next time you sort, the directories will
    be sorted with the files in the manner you specify.


    The option Reverse the Order reverses the default sort order. By default, dates
    are sorted from earliest date to most recent. Sort by Name sorts from non-alphanumeric
    to the lowercase z. Select Reverse to have Sort by Date display files with the
    most recent dates first. Select Reverse to make alphanumeric sorts begin with
    the files that start with z.


    # Symbolic Links Versus Hard Links


    Forming a symbolic link is similar to copying a file, except that the new filename
    represents the original file. Changes in one file will show up in the symlinked
    file as well. If you delete the destination file, or target file, of the symbolic
    link, the link is no longer valid. The filename will still be there, but there
    will be nothing in it. This is called a stalled symbolic link.


    Symbolic links are designated in File Manager by a small black arrow next to the
    file name or icon, as shown in Figure 9.12. The original file that the symbolic
    link points to is found in the file properties. The File Type will be Symbolic
    Link. The Target Name displays the full pathname of the original file that the
    symbolic link points to.


    # FIGURE 9.12


    ![](img/56ffc05f2012b0375f08095ea492838b_137_1.png)


    The symbolic link symbol denotes symbolic links in Icon and Detailed view.


    A hard link is superficially similar to a symbolic link, but there are fundamental
    differences. A symbolic link is nothing more than a pointer to the original file.
    Creating a hard link is somewhat like copying the file, in that the files are
    linked, but appear as separate, distinct files. There is no way to tell which
    file is the original file and which is the hard link. If you delete one of the
    files that are hard linked, the other file remains.'
  merge: -1
