    # Solving Dependency Errors


    The most common installation error when installing from binary package is the
    dependency error. A dependency error occurs when the package you are trying to
    install needs some files from another package in order to work. For example, in
    the dependency message shown here, we are trying to install guile. We get an error
    message that we must install um-scheme before installing guile.


    ```

    [root@localhost i386#] rpm -Uvh guile*

    er: failed dependencies:

    umb-scheme is needed by guile-1.3.7

    [root@localhost i386#]

    ```


    To clear up error, download the um-scheme package and install it using the command


    rpm -Uvh um-scheme.rpm.


    Attempt to install guile again, and the installation works.

    Dependency errors can be frustrating if you don''t pay attention to what you are
    doing. As you get a dependency error, write the error down on a piece of paper,
    noting the file that you are trying to install and the files that you must install
    to correct the error. As this way, you will not get confused if you end up with
    dependency errors that go several levels deep. Listing 2.3 shows a dependency
    error that is a bit more complex than the first example. As you can see, the component
    gnome-core requires three other components—enlightenment, xscreensaver, and redhat-logos—to
    be installed first. When we tried to install xscreensaver, we discovered yet another
    component, xloadimage, had to be installed before xscreensaver.


    # Listing 2.3 An Example of a Dependency Error


    ```

    [root@localhost i386#] rpm -Uvh gnome-core*

    error: failed dependencies:

    enlightenment >= 0.15.0 is needed by gnome-core-1.0.53-2

    xscreensaver >= 3.17-4 is needed by gnome-core-1.0.53-2

    redhat-logos is needed by gnome-core-1.0.53-2

    ```'
