  md: '# Math and Science Tools


    This category contains many interesting tools. Many are of particular interest
    to people involved in scientific research, but some are useful to the ordinary
    user. Some of the applications Math and Science Tools contains are


    +   - An automobile diagnostic application (in early stages of development).

    - An algebraic calculator.

    - A multiple-precision floating-point calculator, as well as many other calculators.

    - A Fractal generator.

    - You''ll also find an application that lists the periodic table of the elements,
    with information about each element, and an astronomy application that describes
    various astronomical phenomena.


    # Miscellaneous


    The Miscellaneous category is a catch-all for applications that don''t fit into
    any other Software Map category. This category includes applications such as


    +   - A college class schedule program

    - A GNOME uncompression utility

    - An automatic desktop background changer

    - A binary file editor

    - A map viewer

    - A panel applet that shows the phases of the moon

    - A catalog for your zip, CD-ROM, and floppy disks

    - A portfolio manager

    - An encrypted password manager

    - An application installer for making autoinstall CDs

    - A Post-It utility

    - A Web searching applet


    # Network Talk Clients


    The Network Talk Clients category includes software that is useful for chatting
    on the Internet. Some of the tools include an instant messaging client similar
    to AOL Instant Messenger, lots of applications, and various utilities to use with
    IRC (Internet Relay Chat), including the famous XChat and ICQ clients for instant
    messaging.'
