  md: '# Some Common Enlightenment Problems and Solutions


    The goal of Enlightenment is to be stable and easy to use as possible. While it
    is an outstanding window manager and my personal favorite, it is still in development.
    Undiscovered bugs and unforeseen problems sometimes occur. This section gives
    you just a few hints to try before you give up in disgust or post a message to
    the GNOME Enlightenment mailing list.


    # Edit or Delete ~/.enlightenment Directory to Fix a Broken Session


    The ~/.enlightenment directory contains files that control your account''s Enlightenment
    sessions. If you lose your Pager or virtual terminals, if your windows appear
    strange or bare, something in this directory is often responsible. In fact, if
    anything goes wrong with Enlightenment, deleting this file first. After you delete
    ~/.enlightenment, restart Enlightenment. Of course, this file contains all your
    configuration information, the system will return to its default state. This usually
    means that you will have to do your Enlightenment configurations over again.


    # Enlightenment Is Slow


    The flexibility and configurability of Enlightenment, which are two of its greatest
    advantages, can also cause problems if your system is low on memory. Your system
    memory, the size of your swap file, and the amount of memory in your video card
    all affect the speed at which Enlightenment operates. If Enlightenment is slow
    on startup or opening a new window, try these steps:


    +   1. Run a “cleaner” theme on both GNOME and Enlightenment. The less memory
    and other resources it eats up. Try a simple background and a theme as “Sensible”
    or “XClean”. You will learn more about obtaining and installing them in Hour 12.


    +   2. Try a different window manager. Your system simpel might not be to support
    Enlightenment. Simpler window managers like sawmill are built to be fast, and
    often work well for users with older hardware or slow X servers.


    +   3. If your X server is on a network, not on the same machine as the X client,
    you might have a network problem. Problems with X are beyond the scope of this
    book; visit www.x.org or www.x11.org for more information.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Sound Does Not Work


    Sound is not always easy to configure in Linux. Make sure that your sound card
    is properly configured and that you get sound in other applications. If you are
    getting sound in other applications, but not in Enlightenment, open the Settings
    menu (right-click the desktop), select Audio, and verify that sound is enabled.


    # Segmentation Fault


    Enlightenment is seriously broken. Everything freezes, and then you get a segmentation
    fault message.


    You have most likely encountered a bug. Enlightenment is still in development,
    and bugs still pop up now and then. Hour 22, “Upgrading GNOME and Joining the
    GNOME Project,” and Appendix A, “Troubleshooting,” go over debugging in detail.


    # Getting Help


    If you want to learn more about Enlightenment, or have a problem that you can’t
    solve, check the following sources for help:


    +   * The Enlightenment User’s Guide comes with your Enlightenment package. Help
    on the Enlightenment menu to see it.

    * The Enlightenment FAQs are updated every month or so. Check http://www.enlightenment.org
    or http://e.i-docs.org/

    * I-Docs hosts a Web forum where you can post questions and get answers about
    Enlightenment, at http://forum.hole/list.php3?num=1&collapse=1&

    * If you have a problem that cannot be solved through the previously mentioned
    channels, try the Enlightenment development mailing list. at: http://enlightenment.org/mailman/listinfo/e-develop.


    ![](img/56ffc05f2012b0375f08095ea492838b_161_0.png)


    > The mailing list archives before posting a question to ensure that your problem
    hasn’t already been posted. Also, remember that every-one on this project is a
    volunteer. Flames about how lousy Enlightenment is or demands to help fix a general
    problem will most likely be ignored.

    For some hints on posting mailing list queries, see Hour 22.'
  merge: -1
