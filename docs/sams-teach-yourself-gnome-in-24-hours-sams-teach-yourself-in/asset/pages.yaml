  md: '# Running Applications


    As you learned in Hours 7 and 8 (“Managing Files in GNOME”), there are several
    ways to open applications in GNOME:


    +   - Clicking a launcher in the Main Menu

    - Double-clicking an icon on the desktop

    - Double-clicking the entry in File Manager

    - Clicking a launcher on the panel


    You can have as many launchers as you want for the same application in the panel,
    in the Main Menu, or on the desktop. Figure 17.1 illustrates the different ways
    to open lagno, a GNOME game.


    ![](img/56ffc05f2012b0375f08095ea492838b_253_0.png)


    Each time you open an application, you are creating what is called an instance
    of the application. If you open the application twice, then you have two instances
    of the application on your desktop. Some applications will usually have only one
    instance per session; others can have several instances. For example, you can
    have three or more instances of xterm running different processes, or several
    instances of GIMP to display different graphics. In Figure 17.2, there are several
    instances of xterm running.'
  merge: -1
