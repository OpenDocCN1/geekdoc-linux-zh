    # Customizing the CD Player


    The Preferences button enables you to customize the look and feel of the CD Player
    to suit your tastes. There are three tabs in the Preferences dialog box: Preferences,
    Keybindings, and CDDB Settings. We will discuss each tab in turn.


    The Preferences tab enables you to control the behavior of your CD Player. The
    most important entry is the mount point for the CD-ROM drive. If your player is
    not working properly, check that the correct mount point is specified in the CDROM
    Device.


    You can select these events to occur automatically, when the CD Player application
    starts:


    +   - Have the player stand idle until you click a button to make a selection


    +   - Automatically start or stop playing the CD


    +   - Automatically close the CD tray'
