    # The Mailing Lists


    The basic format for communication among members of the GNOME project is via mailing
    list. Most of the lists are for the developers, documentation writers, and people
    working on a particular segment of the GNOME Project, but there are two mailing
    lists of interest to end users: gnome-list and gnome-announce. The complete archives
    of GNOME mailing lists can be viewed online at http://www.gnome.org.


    Interested in GNOME can subscribe to a list and anyone can post—in fact, the list
    is not really moderated. People can write suggestions for features, ask user questions,
    point out major bug problems, discuss articles about GNOME, ask questions about
    future developments, request documentation, or announce that they are working
    on something and ask for help.


