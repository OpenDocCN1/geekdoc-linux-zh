  md: 'In this hour, you will


    +   * Learn what makes a GNOME application.

    * Explore the basics of how graphical interface programs work.

    * Discover the libraries that are essential to the GNOME application, including
    the GNOME libraries, GTK+, CDK, Glib, and Xlib.

    * See how Glade makes it easier to develop and change the interface for a GNOME
    application.


    # # What Is a GNOME Application?


    So far, you have learned about GNOME as a desktop environment that provides a
    graphical interface to UNIX and UNIX-like operating systems. You have also seen
    GNOME as a collection of applications within the desktop environment that helps
    you perform tasks. GNOME is certainly both these things, but that''s not the whole
    picture. GNOME is also a set of powerful application development tools that make
    UNIX and Linux application development easier and provide a standard that makes
    every GNOME application look immediately familiar to you, the user.


    So, what makes a GNOME a GNOME application? The several ways of answering that
    question are different ways of stating the same thing:


    +   * A GNOME application is written using the GTK+ and GNOME application programming
    interfaces.

    * A GNOME application is written to the GNOME standard of architecture.

    * A GNOME application is written within the standards of the GNOME desktop environment.

    * A GNOME application is an application that has the look and feel of standard
    GNOME applications, can act as a CORBA object to interface with other GNOME applications,
    and can be used as a component within other GNOME applications.


    By using the GNOME libraries and adhering to GNOME standard architecture, applications
    written by different people in totally different settings, knowing nothing about
    each other''s code, can not only look and feel the same, but ultimately, if they
    incorporate Bonobo technology, will be able to work together or as components
    of each other.


    # # How Do Graphical Interface Programs Work?


    Virtually every computer program accepts input from somewhere, does something
    with that input, and then produces output. In this sense, programs that use a
    graphical'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Anatomy of a GNOME Application


    interface behave the same way as text-based programs. The difference is that with
    a traditional UNIX text-based program, your main interface with the kernel is
    via the command line. You type in commands, and the kernel calls up the resources
    and processes needed to carry out the command.


    With a program written with a graphical interface, the same process occurs, but
    through a graphical interface. Instead of typing in commands, you enter commands
    by clicking in a certain location on a window with the mouse. So how does your
    mouse click translate into a command?


    # Some Programming Terms Defined


    Before going into any detail, we must define some programming terms that are immediately
    pertinent to this chapter.


    Every GNOME application uses several groups of libraries, which are composed of
    various functions. Some of the most important libraries for GNOME are GTK+ and
    libgnomeui, which are libraries of widgets.


    A function is a miniature program that performs a certain task within a larger
    program. If a routine is used many times in a program, the programmer will call
    a function instead of just writing the code directly into the program. Functions
    also make the program easier to write and understand, because it breaks the program
    into smaller, manageable pieces. Functions also save time, because they can be
    used and reused, instead of being written directly into the program.


    A library is a collection of commonly used functions. GNOME has several libraries
    of functions that programmers can use repeatedly to perform tasks in a program.


    A widget is a special kind of function in a graphical interface library that creates
    a small graphical piece on the display. For example, buttons, menu entries, scrollbars,
    and check boxes are all widgets. Some widgets, menu bars, and scroll windows are
    containers, which hold other widgets. Widget produce signals, which tell the program
    to do something. Examples of signal widgets are menu entries, button labels, and
    scrollbar entries. Groups of widgets are collected in libraries called toolkits.


    # Parts of a GNOME Application


    A GNOME program is made up of several libraries, some of which are specific to
    GNOME and others that were created for projects and are used by GNOME. By exploring
    the libraries, you can begin to understand the many layers of a GNOME application,
    and how it all fits. At the bottom, you have the X libraries, which enable the
    application to work with the X server. The PDK and GTK libraries handle the'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'graphical interface of the application on the desktop, and handle how certain
    actions trigger an action in the program, such as a mouse click on a button. The
    top layer, the GNOME libraries, enables the application to fit comfortably in
    the GNOME desktop environment, and to work with other GNOME applications. Finally,
    you have the actual application. All the libraries described here are written
    in the C programming language. The libraries used in GNOME are illustrated in
    Figure 24.1.


    Figure 24.1


    The GNOME libraries are referred to in the source code, and compiled with the
    application to make an executable file.


    ![](img/56ffc05f2012b0375f08095ea492838b_347_0.png)


    # # GNOME Libraries


    As discussed in the introduction, GNOME is much more than a desktop environment
    or a set of applications. GNOME is also a set of libraries that help programmers
    create applications in a streamlined, standard way so that GNOME programs can
    interact with each other. Microsoft Windows has been doing this for some time,
    with ActiveX. GNOME brings the ease of programming and the ready-made tools that
    ActiveX provides Windows programmers to UNIX application programming.


    The GNOME libraries enable application developers to build GNOME-compliant applications
    quickly and easily, within the GNOME standard interface. This means that, although
    there can be hundreds of programmers working independently, creating their own
    free software, the applications will have a consistent look and feel and will
    interact with each other.'
