  md: 'If the document you want to open is on the Web, enter the Web URL in the Location
    field. If the document is a file on your local machine, enter the file’s pathname
    in the following format:


    ```

    file:pathname

    ```


    For example, to open the Linux Kernel Accessibility page from the Linux FAQ, enter
    file:/usr/doc/FAQ/html/Accessibility.html. Note that the misspelling of “accessibility”
    is intentional.


    You can also access man and info pages, if they are installed on your computer.
    To open a man page or info page, enter the following, respectively:


    ```

    man:topic

    info:topic

    ```


    To look at all man and info pages that are available, enter the Table of Contents,
    or toc command:


    ```

    toc:man

    toc:info

    ```


    The man Table of Contents is displayed in the Help Browser in Figure 21.4.


    # Figure 21.4


    The Help Browser can display all the man pages on your computer.


    ![](img/56ffc05f2012b0375f08095ea492838b_318_0.png)


    If you are not sure of the exact name of the topic you are looking for, you can
    use the whatis option. The Help Browser will display a list of all documentation
    on your system that concerns that topic. For example, if you wanted information
    on the cat command, you would enter whatis:cat in the Location field.'
