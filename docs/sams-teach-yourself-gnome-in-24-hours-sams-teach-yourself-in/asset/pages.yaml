  md: '# Installing and Running GNOME Applications


    # Productivity


    The Productivity category includes some of the GNOME Office applications, as well
    as many other applications that are useful at work. Some of the productivity applications
    include


    +   - Dia, a Visio-like drawing application

    - Emma, a money management program

