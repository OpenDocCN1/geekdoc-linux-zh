    +   1. Compare the GNOME Panel to the Enlightenment Iconbox and GNOME Tasklist.

    Do they have the same functionality? Are there differences? Which set of tools
    do you prefer?


    +   2. Open the Focus Settings dialog box and check Focus Follows Sloppy, then
    change the configuration to Focus Follows Pointer Sloppy. What is the difference
    between the two settings?

    When focus follows the pointer, the window where the mouse is located has the
    focus. If you move the window off the desktop, the window loses the focus, and
    no window has the focus until the mouse reaches a new window. Focus Follows Sloppy
    is selected, the window where the mouse used to be retains the focus until the
    mouse reaches a new window.


    +   3. Query the size of your background cached file, note the size of the file,
    then change the background of your desktop using Desktop Background Settings.
    Query your background cache again. What changed?

    When a background is replaced on the desktop, the old background is copied to
    the cache. The cache file will increase in size by a few hundred KB. After it
    is purged, it is 3KB–10KB in size.


    +   4. Remove the window border from one of your windows, then get it back.

    Right-click the window border and Set Border Style. Check No_border. To get the
    border back, hold down the Alt key and click anywhere in the window. The window
    border menu appears. Select Set Border style, and check Default. The border reappears
    after you click Apply or OK.


