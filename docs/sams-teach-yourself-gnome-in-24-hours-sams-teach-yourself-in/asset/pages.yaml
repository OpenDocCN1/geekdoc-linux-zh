  md: '# Compile and Install


    After you configure your Makefile successfully, you are ready to compile the source
    code with make. make compiles the source code and produces the binary files and
    libraries that you need to run the application. To run make, type `make` at the
    shell prompt.


    make can take a long time to run, depending on the size and complexity of the
    files involved.


    After you have made the binary files, you must place them in the correct paths
    so that you can run the application. To install the binaries, type `make install`.


    > You must be root to install the binaries, or the binaries will be installed
    in your user home directory instead of the shared directories. This might be a
    problem if you are on a multiuser system and you are the only person who will
    use the software. Check with your system administrator.


    ![](img/56ffc05f2012b0375f08095ea492838b_331_0.png)


    # Clean Up


    There are a few more steps to take before you are finished. To remove the object
    files from your system, enter `make clean`.


    If you are running a Linux or another ELF-based system, type `ldconfig` to make
    sure the new libraries you package created are found. ldconfig regenerates the
    `/etc/ld.so.cache`. ld.so.cache contains the pathnames for the shared libraries
    on your system, so that they can be found quickly when needed by programs.


    ![](img/56ffc05f2012b0375f08095ea492838b_331_1.png)


    > If something went wrong during one of these steps, particularly if make exited
    with an error, read the README and INSTALL files to verify that you have not missed
    a step. Also, check that there are no missing libraries that are needed, and that
    the location of the libraries is in your path.


    Start over at the beginning after you have corrected the error. To return the
    installation directory to the way it was before you ran configure, type `make
    install`


    # Uninstalling a Tarball


    Uninstalling a tarball is easy, if you have kept the original untarred installation
    directory in `/usr/src`. To uninstall a package, ed the directory in `/usr/src`
    that contains the Makefile for the software package. Enter the command


    ```

    make uninstall

    ```'
