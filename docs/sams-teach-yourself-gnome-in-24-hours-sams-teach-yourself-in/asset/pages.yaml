  md: '# Renaming Files


    UNIX, renaming a file is essentially the same as moving it. You use the mv command
    to move the file to the same location with a different name. In GNOME, Rename
    and Move are treated as separate commands, but they are actually just different
    interfaces to the mv command.


    There are two ways to rename a file in GNOME. The first method requires you to
    be in Icon view. In Icon view, slowly double-click the filename, to select it,
    and then again to open a text box around the filename. Be careful not to click
    the file quickly enough to actually open it. In the text box, overwrite the old
    filename and press Enter. Figure 9.6 shows how the text box looks.


    Figure 9.6


    If the text box doesn''t appear around the filename, you didn''t click the title
    correctly.


    ![](img/56ffc05f2012b0375f08095ea492838b_132_0.png)


    > You must press Enter after renaming the file, the change will not take place.


    Alternatively, you can open the file Properties by right-clicking the file and
    selecting Properties. Simply overwrite the filename in the dialog box and click
    OK.


    # Using Drag-and-Drop


    You can use drag-and-drop to move, copy, and link files in your filename or even
    in remote files, if you have mscerv installed.


    To move or copy files from one directory to another, open two File Manager windows,
    one at the location where the file(s) currently resides, and one at target location.
    Click the file you want to move, copy, or create a symbolic link for, and drag
    it to the target directory.'
