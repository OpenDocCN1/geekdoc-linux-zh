  md: '# # Windows 95/98/NT/2000 Installation Instructions


    +   1. Insert the CD-ROM into your CD-ROM drive.

    2. From the Windows 95 desktop, double-click the My Computer icon.

    3. Double-click the icon representing your CD-ROM drive.

    4. Open the README.txt file for descriptions of Third Party products.


    # # Linux and UNIX Installation Instructions


    These installation instructions assume that you have a passing familiarity with
    UNIX commands and the basic setup of your machine. As UNIX has many flavors, only
    generic commands are used. If you have any problems with the commands, please
    consult the appropriate man page or your system administrator.


    +   1. Insert the CD-ROM into your CD drive.

    2. If you have a volume manager, mounting of the CD-ROM will be automatic. If
    you don''t have a volume manager, you can mount the CD-ROM by typing `Mount -tiso9660
    /dev/cdrom /mnt/cdrom`


    NOTE: /mnt/cdrom is just a mount point, but it must exist when you issue the mount
    command. You can also use any empty directory for a mount point if you don''t
    want to use /mnt/cdrom.


    Open the README.txt file for descriptions of Third Party products, author code,
    and how to create a boot disk for installing the distribution.'
