    # HOUR 24


    # Anatomy of a GNOME Application


    In Hour 23, "GNOME Technologies," you learned about CORBA and Bonobo, the central
    technologies of GNOME applications. In this hour, you will look inside a GNOME
    application to see how it is put together. We will study the components of a GNOME
    application from a very broad user''s perspective, not a more narrow developer''s
    perspective. This chapter is written with the assumption that you have no experience
    with programming. We gloss over some details that would be difficult to discuss
    without the developer''s vocabulary. We also make some generalizations that are
    not necessarily useful to a developer, but should help you understand the material
    as a user. If you would like a more detailed view of GNOME application development,
    a list of resources is provided at the end of the chapter. Although it certainly
    won''t make you a GNOME programmer, this hour should give you a better appreciation
    of how object-oriented, graphical interface programs work, and what is actually
    happening when you open a GNOME application in a window and click a button or
    drag and drop.'
