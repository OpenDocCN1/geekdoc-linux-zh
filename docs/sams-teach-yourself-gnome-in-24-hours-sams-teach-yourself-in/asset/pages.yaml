    If you exit gmc by clicking the Kill/Annihilate button or Commands, Exit in the
    File Manager menu, you actually kill the gmc process. If you click the Close window
    button or choose the Close Window menu, you merely close the File Manager window.


    # The Edit Menu


    The Edit menu contains the following commands for selecting and searching for
    files, as well as refreshing the active directory window:


    +   - Select All selects all the files in the active directory.

    - Select Files opens a dialog box for you to enter a filter to select files with
    certain attributes.

    - Search opens the Search feature on the status bar. Search is a simple search
    tool for finding files and directories within the active directory.'
