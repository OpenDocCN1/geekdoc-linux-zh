  md: '# Introduction


    Few people who read the newspaper or watch cable television news have not heard
    of Linux. Linux and open-source software are the latest technology buzzwords in
    the main-stream media. If you have been reading about this latest technology phenomenon,
    you might have found yourself asking these questions:


    +   - What is it about Linux that is so revolutionary?

    - How can it be good if it doesn''t cost anything?

    - If it doesn''t cost anything, how do people make money with Linux?

    - Why should I replace my Windows system with Linux?

    - Now that I have Linux, how do I use it?


    The answer to all these questions can be found by learning about GNOME, Linux''s
    answer to the Windows and MacOS desktops.


    # What Is GNOME?


    GNOME, officially pronounced "guh-nohm," is several things, depending on the level
    at which you ask the question. GNOME is a windowed, graphical desktop environment
    for UNIX and UNIX-like computer systems. It is a collection of integrated applications,
    specifically created for Linux. GNOME is also a set of standards and tools for
    develop-ing integrated applications that maintain a standard look and feel and
    can be seamlessly used, embedded within each other, and controlled together.


    The word "GNOME" is an acronym, which stands for GNU Networked Object Environment.
    Consisting entirely of free software, the GNOME Project is supported by hundreds
    of volunteers all over the globe, including application developers, code devel-opers,
    writers, user interface specialists, and free software advocates.


    Some people would say that GNOME is the hole in the dike of the monopolistic hold
    that companies such Microsoft have had on the desktop computing industry. Others
    might say that GNOME is the "killer app" that will eventually fuel and maintain
    the meteor-like growth of Linux. You could also say that GNOME is a desktop windowing
    environment that combines the MacOS''s or Windows'' intuitive ease of use with
    the cus-tom features and power of UNIX. But most importantly, GNOME is simply
    fun to use.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Why Teach Yourself GNOME and Who Is This Book For?


    Sams Teach Yourself GNOME in 24 Hours is written with the beginning Linux user
    in mind, but the book is rich enough in content and in-depth enough for the experienced
    Linux or UNIX user to benefit from reading it. This book will arm you with practical
    knowledge of how to accomplish tasks in GNOME and an understanding of the system
    works.


    Sams Teach Yourself GNOME in 24 Hours assumes no prior knowledge of GNOME on the
    reader''s part, and you only need the most basic knowledge of GNOME to understand
    the book. If you are learning Linux for the first time, this book is an ideal
    companion to an introductory Linux book. Although advanced topics are discussed,
    topics that are addressed to advanced Linux users are clearly delineated, and
    there are references in almost every chapter to resources from which you can learn
    more about the Linux subjet discussed.


    If you are an experienced Linux user, this book also has plenty for you. Although
    Linux topics are explained in detail to help the beginner user, this book does
    not skimp on content, nor does it dumb-down the coverage of advanced topics.


    If you would like to learn how to develop GNOME applications, or if you are simply
    interested in how GNOME programs work, there are chapters that discuss the technology
    behind GNOME and how GNOME applications are constructed. These chapters are written
    from a user''s standpoint, and provide a gentle introduction to application development.


    After reading Sams Teach Yourself GNOME in 24 Hours, you will be able to use the
    full power of the GNOME desktop, understand how to unleash GNOME''s potential
    for the front end to Linux, be able to fully customize GNOME, and develop a simple
    GNOME application—even without any programming experience.


    Linux is rapidly growing in importance as a commercial operating system, and more
    Windows users are embracing it. As Linux ceases to exist solely within the hacker''s
    arcane and enters the mainstream-computing world, an understanding of GNOME will
    become essential to anyone who uses Linux.


    # What''s Included on the CD-ROM


    The CD-ROM that accompanies Sams Teach Yourself GNOME in 24 Hours provides you
    with everything you need to use GNOME and to follow the chapters and do the exercises
    in this book, including'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   - A full Mandrake 7.0 distribution of Linux, which includes the full base
    GNOME installation


    +   - Enlightenment, IceWM, sawmill, and WindowMaker window managers


    +   - The full GNOME Office suite of applications


    +   - Extra GNOME games and amusements


    +   - The popular blueHeart theme for GTK and Enlightenment


    +   - The GNOME C program discussed in Hour 24, “Anatomy of a GNOME Application”


    +   - A list of URLs for the Web resources mentioned in the book


    The CD-ROM is organized into folders that coincide with the chapters, for easy
    reference.


    # # How To Use This Book


    Sams Teach Yourself GNOME in 24 Hours is designed to teach you the basics of the
    GNOME desktop in 24 one-hour lessons. Each lesson begins with an overview of the
    topics that will be covered in that hour.


    The main body of each hour presents the lesson, with the major topics broken down
    into simpler, easily digestible parts.


    Throughout each lesson, you will find additional information provided in the form
    of Notes, Tips, and Cautions.


    | A Tip gives you special hints, shortcuts, or advice on how to perform a task
    that is often missed by new GNOME users.


    | A Note presents interesting information that is pertinent to the lesson, but
    not necessarily integral to your understanding.


    | A Caution alerts you to a possible problem or common pitfall, and gives you
    advice on how to avoid the problem.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'At the conclusion of each hour is a Summary to help you review the lesson,
    a Question-and-Answer section that answers common questions about the topic, or
    helps you solve problems that are frequently encountered by new GNOME users. The
    hour ends with a quiz to help you test yourself on what you have learned. The
    exercises following the quiz are designed as a starting point for you to begin
    using the practical knowledge you have acquired.


    I hope that you enjoy this book and that it helps you acquire a full understanding
    and appreciation of GNOME!'
  merge: -1
