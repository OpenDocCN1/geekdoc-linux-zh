  md: '# The Basics of GNOME File Manager


    GNOME File Manager is a graphical interface for manipulating files and performing
    basic system administration tasks. Although it is often easier to use than the
    traditional command line, GNOME File Manager is not always intuitive. To help
    you understand File Manager as a whole, this section explores the parts of the
    GNOME File Manager window. In the next section, we discuss how to perform simple
    file manipulation tasks. In Hour 9, “Common File Manager Tasks,” we will continue
    our exploration of File Manager with more advanced tasks.


    # Opening File Manager


    The gmc process is started automatically when you first log in to GNOME, but it
    runs in the background. To do anything with gmc, you must open a File Manager
    window. By default, GNOME sets up an icon on the desktop called Home Directory;
    which opens a File Manager window directly to your home directory, usually in
    the /home/username directory. You can also open a File Manager window from the
    Main Menu by clicking the File Manager entry.


    # Closing a File Manager Window


    Before we begin our exploration of the File Manager window, it is important that
    you understand the difference between closing a File Manager window and actually
    exiting gmc.


    A File Manager window should be closed either by clicking File, Close Window or
    by clicking the Close option on the window bar. This closes the particular File
    Manager window, but the process gmc continues to run. You can kill the actual
    gmc process by clicking Commands, Exit on the File Manager menu, or by selecting
    the Kill/Annihilate option on the window bar. Never exit gmc unless you have a
    very good reason. Without gmc, the GNOME desktop disappears. Figure 8.1 shows
    the warning that appears when you click Commands, Exit.


    FIGURE 8.1

    The warning message can prevent you from crashing GNOME by mistake.


    ![](img/56ffc05f2012b0375f08095ea492838b_113_0.png)'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# File Manager Window


    When you first open a File Manager window, it looks somewhat like Windows Explorer,
    in that it is divided into two subwindows. On the left is a directory tree of
    folders and subfolders, beginning with the root directory, /, branching out to
    the lowest subdirectories. A plus sign (+) to next folder indicates that there
    are subdirectories hidden below. Single-click the plus sign and the subdirectories
    appear beneath the parent directory. When all subdirectories are exposed, a minus
    sign (−) appears to the left of the directory. (If there are no subdirectories
    within a directory, no sign appears to the left of the folder icon).


    When you click a directory or subdirectory, the directory''s contents appear in
    the window on the right side of the File Manager window. The directory that is
    displayed is the active directory. There are several ways to display the contents
    of the active directory, which we will explore later in this section.


    At the bottom of the File Manager window, the status bar displays information
    about the active directory. You can configure File Manager to display the size
    of a file or directory on the left side of the status bar. On the right, the status
    bar displays the filter that is currently active (more on filters in Hour 9).
    By default, you will see Show All Files at the bottom right of the status bar,
    which means that all the files you have configured File Manager to display will
    appear in the window.


    Near the top of File Manager window, the Location field displays the full pathname
    of the active directory like the Location field in an Internet browser. The File
    Manager window also contains a toolbar with an array of buttons and a row of menus.
    Figure 8.2 shows a typical File Manager window.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# File Manager Menus


    File Manager menus can be a bit confusing because several types of functionality
    are combined in each menu category. This section gives a brief introduction to
    each menu item you won''t get lost as you are learning to perform tasks in File
    Manager.


    # The File Menu


    The File Menu contains commands for manipulating files, and some other miscellaneous
    commands. Note that this section merely introduces the commands. We will use the
    commands to perform tasks later in the hour and in Hour 9.


    +   - **Create New Window** creates a new File Manager window. It is useful to
    have more than one File Manager window open when you want to use drag-and-drop
    to move files around.

    inthe submenu New contains commands for creating the following items:

    - **Terminal** opens a GNOME terminal.

    - **Directory** opens a dialog box for creating a new directory. If you enter
    just a directory name, the directory will be created within the currently active
    directory. Specify a full pathname to create the directory anywhere in the file
    system.


