    To get more detailed help, you can


    +   * Type help all for a brief description of what every command does.

    * Type help [command] for a detailed description of what an individual command
    ndocs.


    # Exiting eesh


    To exit eesh, enter Ctrl-D or Ctrl-C.


    Some useful and harmless eesh commands are included in the Exercises.'
