  md: '# Managing Files in GNOME


    +   - The Gimp opens the GIMP graphics application.

    - New File opens the default editor for you to create a new file.


    ![](img/56ffc05f2012b0375f08095ea492838b_116_0.png)


    You can specify the editor you want to use as the default in GNOME Control Center.
    We will learn more about configuring GNOME in Hour 11, "Customizing Your GNOME
    Environment."


    ![](img/56ffc05f2012b0375f08095ea492838b_116_1.png)


