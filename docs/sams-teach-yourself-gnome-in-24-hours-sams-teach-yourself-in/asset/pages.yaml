    The GNOME Search Tool is a separate utility you can search for files. You will
    learn about GNOME Search Tool in Hour 13, \u201cGNOME Processes.\u201d


    # Sorting Files


    There are two ways to sort files within File Manager. In Brief, Detailed, or Custom
    view, simply click the column title in the active directory window. The files
    will be sorted according to the column category. To reverse the sort order, click
    the column title again, and the files will be reversed.


    Files can also be sorted using the Sort By tool, located in the Layout menu. The
    Sort By dialog box contains six options: Sort by Name, File Type, Size, Time Last
    Accessed, Time Last Modified, or Time Last Changed, as shown in Figure 9.11.


    Sort By has an option to ignore case sensitivity, which actually means the opposite
    of what it seems. If you select Ignore Case Sensitivity, the files are sorted
    by ASCII convention. Symbols appear first, then numbers, then capital letters,
    and finally small letters. If you deselect Ignore Case Sensitivity, filenames
    will be simply sorted alphabetically. Symbols and numbers still appear first,
    but files that begin with upper- and lowercase letters are sorted alphabetically.'
  merge: -1
