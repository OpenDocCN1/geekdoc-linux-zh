  md: 'Some examples of the widgets in libgnomeui follow:


    +   - GnomeDock is the widget which enables you to undock your toolbars.

    - GnomeApp widget creates a standard GNOME window.

    - gnome-about is a widget that creates the GNOME About box.

    - gnome-canvas-image creates the GNOME canvas.

    - gnome-spell is a simple spell-checker widget.

    - gnome-preferences is a widget for setting GNOME preferences.


    The third GNOME library is libgnornba, which provides CORBA interfaces for GNOME
    applications. We will not discuss libgnornba in this hour, but if you would like
    to learn more about libgnornba, see: http://developer.gnome.org/arch/component/gnorba.html.


    # GTK


    In the level of a GNOME application comes GTK, which stands for GIMP Toolkit.
    GTK provides the widgets and other tools for graphical applications. Developed
    for the GIMP graphics application, GTK+ has been extended to all kinds of uses,
    including GNOME.


    The window of an application is made up of hundreds or even thousands of small
    graphic items called widgets. Each widget in an application forms a part of the
    window on the screen, or acts as a container for another widget. Within some container
    widgets are signals that tell the program to carry out some action. To make the
    button something when the signal is emitted, another function called the signal
    handler catches the signal and the right function to perform the action that is
    called for the signal. When you interact with a widget that contains a signal,
    the signal is "turned on," a message to the X server, and the action is carried
    out.


    For example, a scroll window will hold a list widget. On screen, you see the scroll
    window with the list inside it. The scrollbar is yet widget. A button widget will
    hold a label widget that names the button. Other widgets will be used to put the
    container widgets in order, such as the horizontal and vertical box widgets that
    line up the button widgets.


    Some examples of GTK+ widgets are


    +   - Window

    - Frame

    - Button'
