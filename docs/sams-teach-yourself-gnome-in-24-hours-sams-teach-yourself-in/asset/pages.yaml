  md: '# Enlightenment Key Bindings


    | TASK | BINDING |

    | Move a window on the desktop | Alt+left-click |

    | Resize window | Alt+middle-click |

    | Display menu of current desktop | Alt+middle-click |

    | Align windows on the desktop neatly | Ctrl+Alt+Home |

    | Exit Enlightenment and out of GNOME | Ctrl+Alt+Delete |

    | Restart Enlightenment | Ctrl+Alt+End |

    | Raise window to the top | Ctrl+Alt+Up-arrow |

    | Lower window to the bottom | Ctrl+Alt+Down-arrow |

    | Go to the previous desktop | Ctrl+Alt+Left-arrow |

    | Go to the next desktop | Ctrl+Alt+Right-arrow |

    | Close window | Ctrl+Alt+X |

    | Iconify window | Ctrl+Alt+I |

    | Kill window | Ctrl+Alt+K |

    | Shade/Unshade window | Ctrl+Alt+R |

    | Stick/Unstick window | Ctrl+Alt+S |

    | Switch focus to next window | Alt+Tab |

    | Move to the virtual desktop on the left | Shift+Alt+Left-arrow |

    | Move to the virtual desktop on the right | Shift+Alt+Right-arrow |

    | Move to the virtual desktop above | Shift+Alt+Up-arrow |

    | Move to the virtual desktop below | Shift+Alt+Down-arrow |


    # GNOME File Manager Key Bindings


    | TASK | BINDING |

    | Open a file | F3 |

    | Select All in a directory | Ctrl+A |

    | Search | Ctrl+S |

    | Open Run Command dialog box | F2 |

    | Close File Manager Window | Ctrl+W |


    # XFree86 Key Bindings


    | TASK | BINDING |

    | Increase screen resolution mode setting | Ctrl+Alt+plus key |

    | Decrease screen resolution mode setting | Ctrl+Alt+minus key |

    | Emergency exit from X (kills server) | Ctrl+Alt+Backspace |

    | Go to virtual console number 0 to 11 within an X session | Ctrl+Alt+(F1 to F12)
    |

    | Return to X session from a virtual console | F7 |


    ![](img/56ffc05f2012b0375f08095ea492838b_2_0.png)'
