  md: '# Enlightenment Themes


    The Enlightenment menu contains a Themes submenu that lists all the Enlightenment
    themes installed on your machine. Notice that this list is different from the
    GNOME Control Center theme list. Enlightenment themes work independently of GNOME
    themes, and you configure them separately.


    Enlightenment themes work with the window borders, the Enlightenment Panel, Iconbox,
    Enlightenment Pager, and ToolTips. GNOME, or gtk, themes affect the GNOME Panel,
    fonts, icons, and the look and feel of the windows themselves. It is important
    that you understand this distinction, because the best-looking desktops have GNOME
    manager themes that complement each other. For example, blueHeart is a popular
    theme that has both Enlightenment and gtk versions.


    To change your current Enlightenment theme, middle-click the desktop to open the
    Enlightenment menu, and select Themes. A menu of themes currently installed on
    your system will appear. Click the theme you want, and the new theme will replace
    the old one. We will learn more about themes in Hour 12, “Understanding and Using
    Themes.”


    > If you have applications running on a second desktop and you want to remove
    that desktop, you do not need to close the applications. When you remove the desktop,
    the windows will automatically move to the original desktop.


    > It is a good idea to purge your cached files after installing a new theme or
    background.


    # Keybindings


    Keybindings, also called hotkeys, are keyboard combinations that accomplish the
    same task as a mouse or menu item. Keybindings definitions are kept in the keybindings.cfg
    file.


    > You can create your own keybindings by editing the keybindings.cfg file. See
    The Enlightenment User’s Guide.


    ![](img/56ffc05f2012b0375f08095ea492838b_157_0.png)


    ![](img/56ffc05f2012b0375f08095ea492838b_157_1.png)


    ![](img/56ffc05f2012b0375f08095ea492838b_157_2.png)'
  merge: -1
