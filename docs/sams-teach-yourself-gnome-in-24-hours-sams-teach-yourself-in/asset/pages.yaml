    # Using the Enlightenment External Shell (eesh)


    eesh is a utility for interacting with Enlightenment via IPC (Inter-Process Communication).
    If you are familiar with Microsoft Windows, it works bit like Windows DDE (Dynamic
    Data Exchange). From a terminal, you can send commands to view aspects of Enlightenment
    or make changes in the configuration. The changes immediately take place in the
    window manager, and Enlightenment generates a message on the desktop concerning
    the changes. eesh is most useful to advanced users of Enlightenment, and you should
    be careful when using it.


    Still, novices can use eesh for some things, such as figuring out what is going
    on when something on the desktop looks wrong or behaves strangely. It is also
    fun to play with.'
