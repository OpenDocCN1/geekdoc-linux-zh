  md: '# Upgrading GNOME and Joining the GNOME Project


    If configure runs successfully with no errors, it will create the following files:


    +   - A Makefile and a C header file, which you need to compile and run the software
    package

    - A log file called config.log with the results of each test

    - config.cache, a shell script that saves the results of the tests that configure
    runs

    - config.status, a shell script that recreates the Makefile and the header file


    ![](img/56ffc05f2012b0375f08095ea492838b_328_0.png)


    # Make


    Make uses the Makefile that was created by the configure script to determine which
    parts of a large program need to be compiled. Then executes the compilation commands
    that are in the Makefile, keeping track of which files are newer than other files
    so that only the files that have changes are re-created. The Makefile contains
    information on the relationships between the individual files that must be compiled,
    and the commands needed to compile them.


    > Make is not easy to explain or understand in a brief paragraph. For more information
    on make, see Managing Projects with make, by Steve Talbot and Andrew Oram, O''Reilly,
    1991.


    ![](img/56ffc05f2012b0375f08095ea492838b_328_1.png)


    # Gcc


    Gcc is the GNU compiler, which is used to compile the source code from C source
    code to object files, and then to binary executable code that runs an application.
    Gcc is a large and advanced C and C++ compiler that you will become very familiar
    with if you program in Linux. To install source code, you only use it indirectly,
    but if you are interested in learning more about Linux programming, be sure to
    study gcc.


    Some places to start learning about gcc are the gcc info and man pages. If you
    are interested in learning more about C in general, including gcc, try the bible,
    The C Programming Language: ANSI C Version, by Brian W. Kernighan and Dennis M.
    Ritchie, Prentice Hall, 1989. For a gentle introduction, an excellent tutorial
    book is Sams Teach Yourself C in 21 Days, by Peter Aitken and Brad Jones, Sams
    Publishing, 1999.


    ![](img/56ffc05f2012b0375f08095ea492838b_328_2.png)'
