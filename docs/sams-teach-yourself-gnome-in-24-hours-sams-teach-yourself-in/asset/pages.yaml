    your theme, choose a background for it and purge your cached files, as you learned
    to do in Hour 10. “Exploring Enlightenment."


    # Uninstalling an Enlightenment Theme


    To delete an Enlightenment theme, simply delete the theme''s directory in ~/.
    enlightenment or /usr/share/enlightenment/themes, and restart Enlightenment.


    # Summary


    In this hour, you learned about how themes work with the GTK application programming
    interface to control the look and feel of GNOME applications. You learned how
    to install, change, and unstall a gtk theme. You also learned about window manager
    themes and how to install and uninstall the Enlightenment window manager themes.


    # Q&A


    +   - After I installed my new theme, I found a great background to go with it.
    I copied it into ~/.enlightenment/backgrounds, but it doesn''t show up in Enlightenment
    Background Settings. What should I do?

    - After you enter a new background into ~/.enlightenment/backgrounds, you must
    regenerate your menus. Middle-click Maintenance, Purge Background Selector Cache.
    Then middle-click your old background list. Regenerate Menus. Your new backgrounds
    will appear in the Background Settings list.

    - Can I make my own themes?

    - Creating your own theme is an excellent way to begin learning about GTK programming.
    We will learn about GTK programming in Hour 24, “Anatomy of a GNOME Application.”
    Also, there is an outstanding tutorial on creating your own gtk themes at http://gtk.themes.org.


