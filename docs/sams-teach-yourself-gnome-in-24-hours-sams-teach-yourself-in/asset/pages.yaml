    # Configuring Panel Properties


    After you have created your application launchers, put them into drawers, and
    added some applets to the panel, you are ready to configure the look and feel
    of the panel itself. There are two panel configuration choices:


    +   - This Panel Properties

    - Global Panel Properties


    If you have multiple panels, you can change the properties of just one panel with
    This Panel Properties. Changes that you make to Global Panel Properties will affect
    all your panels.


    Figure 7.3 shows a typical GNOME Panel.


