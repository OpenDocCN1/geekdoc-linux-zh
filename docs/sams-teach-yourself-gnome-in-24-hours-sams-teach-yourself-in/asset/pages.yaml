  md: '# Software Categories on the Software Map


    To make it easier to find applications, the Software Map is divided into categories.
    Software within the categories is ordered alphabetically by name. The number in
    parentheses after the category title indicates the number of applications that
    are available in that category. This number changes as new applications are added
    to the Software Map.


    # Core


    The central applications and libraries of the GNOME desktop environment, such
    as GNOME applets and gnome-core, are included in the Core category. Software that
    is part of the base GNOME installation that is developed by another project, such
    as Imlib and GTK, is not included here.


    # Development Tools


    Tools that are of use for application developers of GNOME are included in this
    category, as well as tools that are useful for any application development environment.
    The Development Tools category includes Web editors, compilers, rpm package builders,
    tools to use with CVS, language bindings, programming environments, and widget
    sets.


    # Electrical Design/Programmers


    This category currently houses just one application, Oregano, which is used to
    simulate electrical circuits.


    # Entertainment


    The Entertainment category includes games, multimedia applications, panel amusement
    apples, network-based gaming tools, and other amusements. Some of the games are
    described in detail in Hour 20. "Fun with GNOME."


    # Internet Tools


    The Internet Tools category includes tools to use with the Internet, including
    an HTML editor, an http search tool, an ftp client called DPS-FTP, a Usenet reader,
    a light-weight Web browser called Express, a tool to search for certain files
    over ftp, Gnomba (a GUI Samba browser), and several PPP dialers based on the GNOME
    interface.


    # Mail Clients


    The Mail Clients category contains several mail clients written for GNOME, using
    IMAP, POP3, and SMTP protocols.'
