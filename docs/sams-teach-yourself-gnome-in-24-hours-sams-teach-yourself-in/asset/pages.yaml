  md: '# Customizing Your GNOME Environment


    # Default Editor


    Use the Default Editor capplet to select your favorite editor. For every GNOME
    application that has an Edit feature, the editor you choose here will open. Figure
    11.2 depicts the Default Editor capplet.


    Figure 11.2

    The Default Editor capplet is shown with the menu of available editors open.


    ![](img/56ffc05f2012b0375f08095ea492838b_166_0.png)


    # Background


    The Desktop Background capplet, shown in Figure 11.3, enables you to choose a
    background for your desktop. You can select the precise color from a color palette,
    choose two colors for a gradient, or select a pixmap image. The pixmap image can
    be stored anywhere in the directory tree. Use the Browse button to locate the
    file you want to use for the image. The image you select can be tiled on the screen,
    centered, or scaled to fit your screen size.


    Figure 11.3

    Use either the GNOME Background capplet or the Enlightenment Desktop Background
    Settings to select a background. Do not use both at the same time.


