    > Use lpq to get the job number of the print job you want to remove.


    # GNOME Printing Tools


    GNOME has printing tools that make it easier for you to print files from GNOME
    applications. Some tools, such as the GNOME Printer applet or the ggv and epanel
    utilities, are active tools that help you print or configure your system for printing.
    Other printing tools, such as gnome-print, are included in GNOME applications
    to help you print.


    # ggv


    ggv is a utility that makes it easy to print Post Script files.


    # epanel


    epanel helps you configure your printers. To set up a printer, right-click and
    select Properties. In the Printer Properics dialog box, specify the printer name
    and the command for printing (usually lpr).'
