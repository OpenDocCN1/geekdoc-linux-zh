    A fully configured GNOME Panel looks much different from the panel that appears
    when you first install GNOME.


    ![](img/56ffc05f2012b0375f08095ea492838b_106_0.png)


    # Global Panel Properties


    The Global Panel Properties dialog box contains dozens of options that enable
    you to customize your GNOME Panel down to the last detail. In the interest of
    space, I will discuss just few of the most important options here. For a complete
    guide to Global Panel Properties, see The GNOME User''s Guide.'
