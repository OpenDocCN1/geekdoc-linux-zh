    Dia comes with 80 shapes, five line thicknesses, and seven arrows. You can also
    create your own objects in the XML file format and add them to the collection.
    Dia files are easy to parse and embed diagrams into different applications. A
    simple flowchart is shown in Figure 18.5.


    Although certainly not as powerful as Visio, Dia is much easier to learn (you
    can learn how to use it in about five minutes), so it is a superior choice for
    simple flowcharts and diagrams, whereas Visio is unwieldy.


    Pixmap images can be easily imported and resized quickly, without having to be
    redrawn by the application.


    Dia is organized little بمعنى from Visio. Instead of a screen with a palette on
