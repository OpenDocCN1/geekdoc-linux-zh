  md: '# Copying, Deleting, Moving, and Renaming Files


    From the command line, files are copied, deleted, and moved by using the commands
    cp, rm, and mv. Each command has a long list of options and switches that change
    the behavior of the command. You have to either commit all the options to memory,
    or constantly check a man page as you enter the commands.


    GNOME File Manager has two interfaces to text-based shell commands. You can select
    Copy, Move, Delete, or Properties from the File or right-click menu to bring up
    a dialog box to help you perform the task. Alternatively, you can use drag-and-drop.
    In this section, you will learn about the menu commands. In the section that follows,
    we will examine some of the ways you can use drag-and-drop in GNOME. Parts of
    this section and the “Using Drag-and-Drop” section might seem repetitive, but
    it is important that you be aware of both methods.


    # Copy


    Click File, Copy, or right-click a file and select Copy, to bring up the Copy
    dialog box. Enter the full pathname of location to which you want to copy the
    file. You can use the Browse button if you don''t want to type in the pathname
    manually. Figure 9.3 shows the Copy dialog box.


    ![](img/56ffc05f2012b0375f08095ea492838b_130_0.png)


    Copy has some advanced options for you select when copying a file or directory,
    as shown in Figure 9.4.


    ![](img/56ffc05f2012b0375f08095ea492838b_130_1.png)'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'The Advanced Options tab contains the following choices:


    +   - **Preserve Symlinks** With Preserve Symlinks, if you copy a file that is
    a symlink, the copy will point to the original file. If you copy a symlink without
    Preserve Symlinks, the symlink will keep its old value. For example, the symlink
    frog->bull and frog is copied into the subdirectory pond without Preserve Symlinks,
    we have frog->bull, which does not exist in the subdirectory pond. If it is copied
    with Preserve Symlinks, we have pond/frog->../bull.

    - **Follow Links** If the directory you are copying hard links or symbolic links,
    the links will be copied as new files containing the contents of the original
    linked file.

    - **Preserve File Attributes** Select Preserve File Attributes to copy the original
    files'' permissions, creation, and modification dates. If you are the root, the
    file''s original owner and group will also be preserved.

    - **Recursively Copy Subdirectories** Selecting this instructs File Manager to
    copy all subdirectories within a directory as subdirectories, as well as the files
    within them. In other words, an exact replica of the original directory structure
    is re-created in the new directory.


    # Move


    To move a file, select Move from the File or right-click menu. The Move dialog
    box contains the same fields as the Copy dialog box, except that the only advanced
    option available for Move is Preserve Symlinks.


    # Delete


    To delete a file, select Delete from the File or right-click menu. If you want
    warnings about deleting a file or recursively deleting a directory that is not
    empty, be sure to select the Confirm boxes in the Confirmations tab of Preferences.
    Figure 9.5 shows a delete warning message.


    Figure 9.5\If you choose not to be presented with a warning message, you can not
    be sure if you deleted the correct file until you rescan the directory.


    ![](img/56ffc05f2012b0375f08095ea492838b_131_0.png)'
