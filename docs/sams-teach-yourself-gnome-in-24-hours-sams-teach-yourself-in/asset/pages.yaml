    from four to sixteen squares. Each square is divided into four numbered sections.
    The idea is to move the squares to the empty grid in a way that the number in
    each section on every side of every square matches its neighbor. Move the squares
    around from one board to another to turn the position of the squares around. The
    fewer moves made, the higher your score. A simple game of Gnome Tetravex is shown
    in Figure 20.11.


