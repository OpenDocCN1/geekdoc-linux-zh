  md: '# Installing GNOME


    > All the GNOME components listed in this chapter are available on the CD-ROM
    that comes with this book. After you have a working version of GNOME running,
    you can follow the instructions in this hour to make upgrades.


    # Choosing an Installation Method


    There are three ways to install GNOME: from a CD-ROM as part of a Linux distribution,
    from pre-compiled binary packages as rpms, and from source code. In this section
    we discuss the advantages and disadvantages of the first two methods. The more
    complex process of installing GNOME from source code is covered in Hour 22. "Upgrading
    GNOME and Joining the GNOME Project."


    # Installing GNOME from a CD-ROM


    The easiest way to install GNOME is from a CD-ROM as part of a pre-packaged Linux
    distribution. If you are new to Linux or just to get GNOME up quickly plainly,
    this method is for you. All the packages have been scripted to install in the
    correct order, so you do not have to worry about the errors discussed at the end
    of this chapter. If you install Linux and GNOME from the same CD, it is unlikely
    that you will encounter problems.


    The major disadvantage of installing from a CD-ROM is that the GNOME components
    are out of date. Even if you do your initial installation from CD, you should
    follow the instructions in this chapter to upgrade your GNOME components after
    the initial CD installation.


    If you have GNOME on your Linux CD, but didn''t install it when you installed
    Linux, you can either run the installation again as an upgrade (consult your Linux
    documentation), or you can rpm the files directly from the CD-ROM onto your hard
    drive.


    Insert the CD-ROM into your drive. Mount the CD-ROM using the mount point created
    in /etc/fstab (In the following example, the mount point is /mnt/cdrom).


    ```

    # mount /mnt/cdrom

    ```


    Next, update your file database by entering the command


    ```

    # updateddb

    ```


    Locate each component on the list using the locate command. In Listing 2.2, locateound
    shows that version 0.2.10 of esound is already installed.'
