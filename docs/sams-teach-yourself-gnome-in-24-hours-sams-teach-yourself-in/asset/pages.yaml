    Delete File, and Rename File options, so you can use EOG to organize a group of
    images into a new directory.

    - **Close this Window** closes the application if you have only one EOG window
    open. If you have two or more windows open, Close this Window closes the window.

    - **Exit** closes all windows and exits the application.


    The View menu provides options for zooming an image in the viewer:


    +   - **Zoom In** and **Zoom Out** enlarge or shrink the image by increments.

    - **Zoom In 1:1** returns the image to its original size.

    - **Zoom** opens a menu for setting the image enlargement to a particular ratio.

    - **Zoom to Fit** enlarges or shrinks the image to fit within the window. If you
    increase or decrease the dimensions of the window and click Zoom to Fit again,
    the image will readjust to fit the new window size.


    The Toolbar buttons repeat the options in the View menu. In and Out increment
    a size increase or decrease by the same increment as the menu options Zoom In
    and Zoom Out.


