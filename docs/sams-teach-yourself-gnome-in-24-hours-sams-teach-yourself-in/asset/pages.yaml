  md: '# HOUR 18


    # Using GNOME for Your Business


    There are a few people in the free software community who think that the concept
    of free software will eventually turn the entire software industry on its head.
    If free software breaks out of the technical community and gains a place in the
    business community, software development, perhaps even the definition of software
    itself, could change entirely.


    This hour is composed of two sections. In the first section, we discuss some possible
    models for using GNOME in an enterprise, the advantages of GNOME in business,
    and some of the disadvantages. In the second section, we explore GNOME Office,
    a group of applications designed to compete with and replace costly commercial
    productivity software.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# GNOME in an Enterprise


    In this hour, you will


    +   * Learn about the business future of free software, in general, and GNOME
    in particular.

    * Discover how GNOME can be used in an enterprise setting.

    * Examine the advantages and disadvantages of using GNOME for your business.

    * Explore GNOME Office and other GNOME productivity applications.

    * Compare GNOME Office to commercial office suite applications.


    Ever since the advent of the personal desktop computer, personal computers have
    become a fundamental part of every office. Productivity applications have become
    more complex as software companies scramble to provide as many features as a customer
    could possibly want. The end result is huge, disk-space-eating, memory-hogging,
    bloated software loaded down with features that most users don''t need or understand
    how to use. The licensed, proprietary software costs hundreds of dollars and often
    don''t work with other vendor''s software, forcing businesses and individuals
    to buy "office suites." Few people need all the applications in these suites,
    but it is easier than trying to get the individual proprietary applications of
    several vendors to work together.


    The problems with modern commercial productivity software can be boiled down to
    two issues: complexity and cost. As applications become more complex and feature-heavy,
    it gets harder and harder to make updates and improvements and to add new features.
    The learning curve for new developers and new users also grow, and the software
    becomes more expensive.


    # The GNOME Solution to Complexity


    As you will learn in Hour 24, "Anatomy of a GNOME Application," GNOME applications
    are based on the concept of component software. Instead of large, complex applications
    that contain every imaginable feature, the GNOME consists of a string of small,
    simple, and lightweight applications that easily integrate to provide whatever
    feature you need. If a feature is not in an application, it is easily developed
    and added as a component. You then have this component, or mini-application, available
    for incorporation into any other application using any scripting language that
    has a CORBA binding, including Python and Perl.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Using GNOME for Your Business


    Applications just become object servers, or containers that you plug components
    into to get the functionality you want. It becomes easy to create designer applications
    that have all the features you want, with none of the fluff. It is also easier
    to learn a very complex piece of software if you start out with your simpler functions
    and add complexity as you get more familiar with the components.


    With GNOME Office, for example, companies could design ideal word-processing applications
    based on the needs of each person''s job function. People who only needed the
    basics would get the core application, and others would add components, as they
    needed them. Accountants would get spreadsheet functionality that they could attach
    to word processing. A secretary might need only the basics of the spreadsheet
    to create simple documents, and not need hundreds of other functions. Graphics
    designers would get the graphics import component included in their word processing
    software.


    # The Business Advantage of GNOME


    GNOME as a business solution is not quite ready to be unleashed in the office.
    There are some intriguing aspects to GNOME, however, that deserve notice.


    GNOME is free. In the Microsoft era, software is expensive, prohibitively expensive
    for the small business owner. For large corporations, the price tag for licenses
    for one new application can run into the hundreds of thousands of dollars.


    GNOME is customizable. Imagine having a desktop in which your company’s logo—not
    Microsoft’s—appears on every open window, where, in fact, your desktop is “themed”
    to be uniquely free from anyone else’s.


    It is easy to understand the GNOME applications inside and out. There are no expensive
    training courses that teach you the undocumented secrets and tricks of the software,
    or even the basics. If you want to know everything there is to know about a GNOME
    application, just look at the source code.


    You also dont have programming restrictions with GNOME apps. Because the interface
    for the components is CORBA, any component can be written in any language. So,
    if you want to design your own add-on to a GNOME application that was written
    in C, but your developers prefer to work in C++ or Perl, they can write the plug-in
    in whatever-language they want and it will still work.


    # Disadvantages of GNOME


    The biggest disadvantage of deploying GNOME in business is that it is still new.
    Documentation is sparse, there is no training, and there are few system administrators
    with experience installing and implementing it.


    ![](img/56ffc05f2012b0375f08095ea492838b_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'GNOME Office applications themselves are still in development. Most have not
    had a 1.0 release yet, although the applications mentioned in this chapter are
    all stable.


    An outside support organization is probably necessary for anyone seriously considering
    using GNOME as his main desktop and applications suite. These companies can support
    your sysadmins in the GNOME installation, design a customized desktop to protect
    your users from most of the complexity of GNOME, and even design custom applications
    for you, based on the particular needs of your office.


    # GNOME Office


    The goal of GNOME Office is to create a suite of office applications out of free
    software. The free software office suite will compete with commercial office suites
    such as Microsoft Office and Corel Office. The components of GNOME Office are
    based on the GNOME architecture and development toolkit. The home page for GNOME
    Office is http://www.gnome.org/gnome-office.


    If you are familiar with Microsoft Office, there is virtually no learning curve
    to using GNOME Office. The interface will look familiar, and the applications
    work the same. This section provides an introduction to GNOME software that is
    designed for business use.


    # AbiWord


    AbiWord is the word processing component of GNOME Office. SourceGear, a for-profit
    corporation that produces open-source software, created AbiWord. Based on the
    GNOME interface, AbiWord is fast and sleek, takes up only 729Kb of disk space,
    and is intuitive to use for anyone who has experience using MS Word. It has all
    the major features of Word, including


    +   * Character formatting

    * Dynamic spell check (misspelled words turn red as you type them)

    * A rulerbar with interactive tabs

    * Type 1 fonts

    * Unlimited Undo/Redo

    * Multiple columns

    * Widow/orphan control

    * Find/Replace

    * Easy import of graphics


    AbiWord is shown in Figure 18.1.'
