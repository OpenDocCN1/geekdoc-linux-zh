  md: '# Installing and Running GNOME Applications


    233


    Now that you have learned how to run applications, you can find and install new
    GNOME applications that suit your needs. In the next section you will learn how
    to navigate the GNOME Software Map to find applications that interest you.


    # # Finding New GNOME Applications


    There are dozens of GNOME applications available for free download. The core GNOME
    team develops some applications. Increasingly, developers who are not part of
    the core team are creating applications based on GNOME tools. At present, the
    best places to look for new applications are the GNOME Software Map, the GNOME
    announcement mailing list.


    # ## The GNOME Software Map


    GNOME applications are proliferating rapidly, because one of the key goals is
    to make easy to create desktop GUI applications for UNIX. The GNOME Software Map
    is a central clearinghouse where developers can post information about the applications
    they are developing for GNOME.


    The downside to the Software Map is that it can be hard to find the applications
    you want. The map is ordered by category of software, and then alphabetically
    by application name. If you''re not sure which category a particular application
    goes in, finding it can be time-consuming. This can also be an advantage, however,
    as you can read other interesting applications along the way.


    ![](img/56ffc05f2012b0375f08095ea492838b_256_0.png)


    > Listed under the Internet Tools category, the GNOME Software Map Browser will
    browse the map for particular applications by keyword, so you don''t have to search
    manually. The browser is still in an early stage of development.


    The GNOME Software Map is found at http://www.gnome.org/applist/list-martin.html.
    When you open the Software Map page, you will see a list of icons, which give
    basic information about each item on the Software Map. The icons are shown in
    Figure 17.4.


    # ## Homepage


    A Homepage icon indicates that the application has a Web page devoted to it. The
    Homepage usually contains a description of the application, news about the application''s
    development, a link to a server where you can download the application, and sometimes
    screenshots and additional documentation.'
