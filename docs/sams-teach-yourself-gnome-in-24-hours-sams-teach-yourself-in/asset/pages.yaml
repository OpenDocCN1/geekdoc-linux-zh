  md: 'While reading through this hour, begin thinking of how you want to organize
    your desktop to make it a useful and efficient workspace. We will devise a generic
    plan, which will consist of creating icons on the desktop for important files
    including documents, databases, spreadsheets, programs, and URLs.


    # Configuring and Using the GNOME Panel


    One of the most powerful and useful tools in the GNOME Panel. You can make the
    panel the focus of everything you do in GNOME, or leave it with only its few default
    items. You can even delete all the items on the panel, or the panel itself.


    In our sample setup, we will use the panel to organize the applications and files
    you use every day. Panel drawers, application launchers, and applets can help
    you arrange your panel efficiently. We will explore each of these items in detail.


    # Adding an Application Launcher


    An application launcher starts an application with one click on the Panel icon.
    To create an application launcher, right-click an empty part of the panel, and
    select New Launcher. Enter the name of the application and the full command needed
    to it. In the Comment field, enter the name that will appear when you place the
    mouse over the launcher. Finally, specify whether the launcher is for an application
    or a directory.


    If the application you want is listed in the Main Menu, simply drag the Main Menu
    entry onto the panel; a launcher will be automatically created.


    Figure 7.1 shows the dialog box for creating a launcher.


    FIGURE 7.1 Application launchers make it easy for you to open applications that
    you use ofien.


    ![](img/56ffc05f2012b0375f08095ea492838b_103_0.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'In the Advanced tab, you can add a comment for the user and the pathname of
    documentation that is associated with the application. After creating the launcher,
    you can modify it at any time by right-clicking and selecting Properties.


    # Using Drawers to Organize Your Launchers


    After you have created several application launchers, the drawer where you''re
    storing them can get a little crowded. Drawers help you organize your application
    launchers and save space on GNOME Panel. After you have created all your launchers,
    think about which applications should be grouped together, and then make drawers
    for those groups.


    To create a drawer, right-click on an empty part of the panel and select Add Drawer.
    An empty drawer appears on the panel. Right-click the drawer and select Drawer
    Properties to name the drawer and select icon. Enter the name of the drawer in
    the ToolTip/Name field. To change the icon, double-click the icon in Properties.
    From that list above, select an icon that fits the contents of the drawer. In
    Figure 7.2, we are creating a drawer for graphics, so we will choose an icon that
    corresponds to graphics, the Electric Eyes.


    Figure 7.2

    Change the drawer name and icon to distinguish it from the other drawers on your
    panel.


    ![](img/56ffc05f2012b0375f08095ea492838b_104_0.png)


    After you have created your drawer, populate it with launchers. To move a launcher
    into a drawer, right-click the launcher, select Move Applet, and drag it into
    the drawer.


    To add an entire section of the Main Menu as a drawer, right-click the section
    title, and select Add This As Drawer to Panel. For example, if you right-click
    User Menu, all the entries in the User menus will appear as launchers in a drawer
    on the panel.'
