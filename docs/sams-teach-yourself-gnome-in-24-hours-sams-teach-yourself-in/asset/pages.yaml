  md: '# Common File Manager Tasks


    **Group** is the group that file belongs to. Groups are useful for assigning access
    rights to different groups of users. For example, you could give one group of
    users read and access to a file, and another group only read access.


    **Group ID**, displayed as GID, is the number that refers to the user''s default
    group. Every file has both a user and group owner. The GID for each group on the
    system is found in the `/etc/group` file.


    **The Inode Number** is also called the *Index number*. An inode is a datructure
    that stores the information about the file, such as owner, group, permissions,
    modify date, and so on. The *inode number* is the particular inode on the hard
    disk where information about a file is located.


    **Mode** lists the permissions for the file in octal notation. The mode is a numeric
    way of displaying the read, write, and execute permissions for the user, group,
    and others.


    ![](img/56ffc05f2012b0375f08095ea492838b_128_0.png)


    > This chapter gives only a cursory discussion of modes and permissions. For a
    detailed explanation, see the *Linux Installation and Getting Started guide* at
    `http://www.linuxdoc.org/LDP/gs/node1.html`.


    **Modification Time** is the date and time the file was last changed by either
    a user or a process.


    **Name** is the name of the file.


    **Number of Hard Links** lists the number of hard links to the file.


    **Owner** gives the username of the user who owns the file.


    **Permission** lists the file''s permissions using symbolic notation.


    **Size** is the size of the file in bytes. Note that the size given for a directory
    is the actual size of the directory itself, or the number of bytes of space that
    the directory takes up on the disk. The size of the files and subdirectories within
    the directory is not given.


    **Size (short)** is slightly different from Size. Size (short) gives the size
    of files in bytes. For directories, Size (short) indicates whether the file is
    a parent directory (also called the “..” directory) or a sub-directory. All directories
    on the system are sub-directories except the root (/) directory.


    **User ID**, or **UID**, is the ID number that represents the user who owns the
    file.'
