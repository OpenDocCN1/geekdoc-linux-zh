    # # GDK, Glib, and Xlib


    The next component of a GNOME application is GDK, which stands for the GIMP Drawing
    Kit. Like GTK, GDK was originally developed for the GIMP. GDK acts as a wrapper
    between GTK and the X libraries, or Xlib. The developer uses GDK to set a property
    for a window or to draw a special object on the window.


    GDK increases the portability of GTK. Because GTK doesn''t interact directly with
    the X libraries, it is simple to adapt GTK to window systems other than X. In
    fact, GTK has been ported to MS Windows using a modification of GDK.


    Glib is a C library, which provides routines that are useful in GNOME applications.
    Glib isn''t maintained by the GNOME project, but it is used as the foundation
    of GNOME applications. The developer uses Glib to create structures that are common
    throughout the program, and there is a collection of ready-made code for commonly
    used routines. Glib also contains utilities that help port GNOME applications
    to other systems. Glib must be included in a program in order to use GTK.


    Xlib is the collection of libraries that the X server uses to create the graphical
    interface on which GNOME resides.


    # # Glade


    Are you ready to start programming? Even if you don''t ever want to program in
    GNOME, you should be familiar with an application development tool called Glade.


    Glade is illustrated in Figure 24.2.'
