    The rotation and flip buttons enable you to rotate the image by 25% increments
    and to flip the image either horizontally or vertically.


    # Taking a Screen Shot


    The last two geometry buttons control screen shots. You can take a screenshot
    of the entire screen, or you can select a single window to grab.


    If you grab the entire screen, your virtual resolution size will be grabbed, not
    your physical screen. For example, if you have a virtual screen size of 1280x1024
    but your physical screen size is only 800x600, your screen shot will have dimensions
    of 1280x1024.


