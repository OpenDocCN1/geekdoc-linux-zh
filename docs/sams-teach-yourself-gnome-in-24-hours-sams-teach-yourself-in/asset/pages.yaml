    # The Settings Menu and the Layout Menu


    The Settings menu contains only one item, Preferences. Use Preferences to configure
    File Manager.


    The Layout menu controls how files appear in File Manager and how they are arranged
    in the active directory window. The Layout menu includes


    +   Sort By, which opens a dialog box with several choices of how to sort the
    active directory

