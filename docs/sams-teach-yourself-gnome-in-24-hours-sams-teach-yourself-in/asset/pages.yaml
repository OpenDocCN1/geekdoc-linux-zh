  md: '# HOUR 15

    nThe Internet and GNOME


    Some pundits claim that the Internet is the most fundamentally important addition
    to human culture since the invention of the printing press. When you think of
    the countless ways to use the Internet to communicate and share information, it''s
    easy to agree. You can use File Transfer Protocol to share files across the Internet.
    You can use the World Wide Web to get information about anything you can imagine.
    Email enables you to send messages instantly. Chat programs let you "talk" with
    friends and coworkers in real time. Using newsgroups, you can post and read messages
    on an electronic bulletin board. GNOME has applications to help you with just
    about anything you want to do on the Internet. This hour, we will talk about just
    a few of these applications.


    In this hour, you will


    +   - Install and configure Balsa, the GNOME email client.

    - Use Balsa to send and receive email.

    - Configure gFTP, the GNOME FTP client.

    - Use gFTP to upload and download files.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# A Word About Netscape Communicator


    Netscape Communicator is the Internet browser, news, and email client that most
    people with Linux and UNIX systems use to navigate the World Wide Web. Although
    there are a few nascent projects to develop a GNOME Web browser, none of the applications
    are a very advanced stage of development. Most GNOME users rely on Netscape Communicator
    or a text-based browser such as Lynx or x3. There are GNOME email, FTP, and news
    client applications, however, that provide viable and even superior alternatives
    to Netscape.


    We won''t go into detail over Netscape Communicator in this book, because it is
    not a GNOME or GNU application. Using Netscape is simple if you use Netscape or
    Internet Explorer in Windows. Netscape for Linux also has a comprehensive user''s
    manual and online support. See http://www.netscape.com for information. The Netscape
    Navigator window is shown in Figure 15.1.


    # FIGURE 15.1


    Netscape Navigator for UNIX/Linux looks a lot like Netscape for


    ![](img/56ffc05f2012b0375f08095ea492838b_223_0.png)


    # Getting and Sending Email with Balsa


    There are several email clients developed for GNOME. In fact, each has its category
    on the GNOME software map. The most advanced email client developed specifically
    as part of the GNOME desktop environment is Balsa. To keep up on the development
    of Balsa, see the home page at http://www.balsa.net. Some of the features of Balsa
    include'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# The Internet and GNOME


    +   * Local mailboxes.

    * POP3 and IMAP protocols for incoming messages

    * SMTP and MTA protocols for outgoing messages

    * Printing messages.

    * Multithreaded mail retrieval. (This means that, if you have the bandwidth, you
    can download several messages simultaneously.)

    * MIME support.


    ![](img/56ffc05f2012b0375f08095ea492838b_224_0.png)


    Although Balsa is easy to use and relatively stable, it does not have many features
    and has some stability problems. Many people prefer to use Mahogany, as it is
    more advanced and has features comparable to Microsoft Outlook or Netscape Messenger.
    Mahogany uses the GIMP Toolkit and GNOME development tools, but it is not strictly
    a GNOME application. Learn more about Mahogany at http://www.windows.org/Mahogany/.


    ![](img/56ffc05f2012b0375f08095ea492838b_224_1.png)


    > > If you use POP3 for incoming messages, it appears as if Balsa is frozen while
    the messages are downloading. In the 0.6 version of Balsa, you can''t use Balsa
    at all while messages are downloading. Users have reported problems with Balsa
    crashing if there are many messages to download.


    ![](img/56ffc05f2012b0375f08095ea492838b_224_2.png)


    When you start Balsa for the first time, a configuration dialog box walks you
    through setting up your email account. All you need is your email address and
    your SMTP address. Balsa suggests folders for your incoming, outgoing, and trash
    folders, and creates them for you if they don''t exist. For example, the default
    incoming mail folder is /var/($/mail/username. You can change any of these values
    later in Properties.


    If you are familiar with other email programs, Balsa is easy to understand. By
    default, there is an Inbox and Outbox for send files and Trash. The main Balsa
    window is shown in Figure 15.2.'
  merge: -1
  pgno: 224
