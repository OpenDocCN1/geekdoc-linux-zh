    # # Setting Up GNOME for Sound


    Like Windows


    Most distributions do not automatically detect and install the driver for sound
    cards, although some have scripts or utilities that you can run after installation.
    For example, Red Hat has a utility called sndconfig that will help you select
    the correct driver for your sound card, install the driver, and recompile the
    kernel automatically. Configuring your system for sound is beyond the scope of
    this book, but there are plenty of resources available on the Web to help you.
    The Linux Sound HOWTO, which can be found online at http://metalab.unc.edu/linux/HOWTO/Sound-HOWTO.html,
    has detailed instructions on how to configure sound in your Linux system.


    # ## Configuring Your Desktop for GNOME/Enlightenment Sound


    After you have your system configured for sound, you can use the sound features
    of GNOME and Enlightenment. There are two base packages that must be installed
    first:


    +   * esound

    * gome-audio


    After you have verified that you have the necessary packages, ensure sound is
    enabled in your window manager. For Enlightenment, right-click the desktop to
    open the Settings menu. Select Audio Settings and check Enable Sounds in the dialog
    box, as shown in Figure 2.1.


    Figure 20.1


    ![](img/56ffc05f2012b0375f08095ea492838b_295_0.png)


    Sounds must be enabled in the window manager before you can hear certain GNOME
    sounds.'
