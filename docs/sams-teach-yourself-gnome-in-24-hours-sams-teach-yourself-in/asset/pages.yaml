  md: '# Answers for Hour 13


    # Quiz


    +   1. What is the difference between installing and upgrading an rpm package?


    When you are installing a new package and there is no older version of the package
    on your computer, there is no difference. When you want to install a package and
    there is already an older version on your computer. Upgrade will delete the old
    version before installing the new version. Install will keep the old files intact.

    2. How are packages color-coded in rpmfind and the installation window?

    Package matches what is already installed installed: green.

    Package is newer than what is installed: blue.

    Package is older than what is installed: grey.

    3. What is the difference between Install Date and Build Date for rpm packages?

    Install Date is the date an rpm package was installed on your computer. Build
    Date is the date the package itself was created.

    4. What does MIME stand for?

    Multipurpose Internet Mail Extension.


    # Exercises


    +   1. Open gnoRPM and explore the rpm package categories. What are some of the
    categories?

    Answer varies according to the reader.

    2. Query the GTK rpm package. To which directories does gtk install files? Why
    do you think there is no executable file added to /usr/bin or /opt/bin?

    GTK adds an /etc/gtk directory, documentation files in /usr/doc, and libraries
    to /usr/lib (or /usr/local/lib) and shared libraries to /usr/share (or /usr/local/share).
    There is no executable file added to the filesystem because GTK isn''t an application,
    but a set of libraries that different applications use. You will learn more about
    GTK in Hours 23 and 24.

    3. Find the gnome-core rpm package then verify it.

    From gnoRPM''s window:

    Click Find.

    Select Find Packages that match label and type gnome-core in the field.

    Click Find.


