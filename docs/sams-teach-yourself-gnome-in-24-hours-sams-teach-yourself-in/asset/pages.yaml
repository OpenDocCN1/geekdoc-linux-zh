  md: '# Preparing to Start GNOME


    GNOME is started as part of the script that starts X on your computer. The command
    to start a GNOME session is the following:


    ```

    exec gnome-session

    ```


    You can put that in several places, however, and in order to know the right place,
    there are three things you must think about:


    +   1. How X is started on your computer

    2. Whether you want to use GNOME just for one account on your system or for all
    accounts

    3. If you want to use KDE or another desktop environment as well as GNOME


    If you log in use a text-based script and then start X using a command as startx,
    xstart, or X11, then your system most likely uses xinit, the initialization script,
    to start X. If starts automatically when you boot, and you log in some kind of
    graphical interface such as a dialog box, then you use xdm, the X Display Manager,
    or kdm ,the KDE Display Manager, to start X. The method your system uses to start
    X determines where you must place the command to start a GNOME session.


    If you want to use GNOME for just one account on your system, you will place the
    script to start GNOME in the $HOME directory of that account. If you want to use
    GNOME for all the accounts in the system, you will place the script in /etc/X11/xinit/xinitrc
    or /etc/X11/xinit/Xclients.


    Finally, if you have another desktop environment as KDE installed, and you would
    like to switch back and forth, the utility Switchdesk will take care of the startup
    scripts for you, and you will not have to manually alter any files to start GNOME.


    > Packaged Linux distributions that include GNOME, such as Red Hat and Mandrake,
    include ready-made scripts for starting GNOME and KDE. If your xinitre, Xsession,
    or Xclients script already contains references to GNOME or KDE, you may comment
    out references to KDE or use Switchdesk.


    ![](img/56ffc05f2012b0375f08095ea492838b_51_0.png)


    ![](img/56ffc05f2012b0375f08095ea492838b_51_1.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Starting and Logging Out of GNOME


    > See the following man pages to learn more about how X works:

    man X

    man Xserver

    man startx

    man xdm

    man xinit

    man xterm

    The language is technical, but you do not need a programming background to understand
    it, and the entries provide a fascinating introduction to the intricacies of X.

    \To open a man page, open an xterm and enter man followed by the term that you
    want to study, for example: # startx.


    # Starting GNOME from the Command Line (xinit)


    If you start X manually using a command such as startx, xstart, or XI, then your
    system most likely uses the xinit script to start the X server instructions on
    how X should look when it starts, what programs should start automatically with
    X, and how X should exit.


    To get the correct instructions on what to do when it starts the X server, xinit
    looks for a script that will tell it exactly what to do. That script is called
    xinitrc. Some systems have a separate ~/.xinitrc file for every account, so different
    users can have different ways to run X. For example, you can have one account
    running GNOME as the desktop environment and another running KDE.


    If you want to start GNOME as the desktop environment for just one user, open
    the user''s ~/.xinitrc in a text editor, such as vi. Add the following line to
    the end of the file:


    ```

    exec gnome-session

    ```


    > The last command in an X initialization script such as ~/.xinitrc is called
    the magic command. When you close the process that the command started, X will
    also close. You must make GNOME the last command in the ~/.xinitrc file so that
    X will automatically close when you log out of GNOME.'
  merge: -1
  pgno: 52
- img_proc: true
  md: "HOME is the pathname for the directory where all the user accounts (except\
    \ root) are kept. In most UNIX systems, this path is /home/[account_name]. For\
    \ example, if Judy and Bob have accounts on a UNIX system, Judy's .xinitrc file\
    \ is /home/judy/.xinitrc. Bob's .xinitrc is located at /home/bob/.xinitrc.\n\n\
    ![](img/56ffc05f2012b0375f08095ea492838b_53_0.png)\n\nSome systems use /etc/X11/xinit/xinitrc\
    \ for all users, instead of having a separate $HOME/.xinitrc file in each user's\
    \ home directory. The file is usually located in /etc/X11/xinit. Modify this the\
    \ same way as you did the $HOME/.xinitrc file by adding the following line at\
    \ the end of the file:\n\nexec gnome-session\n\nMake sure this command is the\
    \ last command in /etc/X11/xinit/xinitrc.\n\n# Possible Problems\n\nxinit looks\
    \ for a $HOME/.xinitrc file before the /etc/X11/xinit/xinitrc file. If you have\
    \ an .xinitrc file in your home directory, but you add the line exec gnome-session\
    \ to the /etc/X11/xinit/xinitrc, GNOME might not start. You can fix this problem\
    \ by also adding exec gnome-session to your $HOME/.xinitrc.\n\nIn some systems,\
    \ the xinit file points to an Xclients file for programs that will start when\
    \ X starts. If you have a $HOME/.Xclients or /etc/X11/xinit/Xclients file, place\
    \ the command exec gnome-session at the end of the file instead of the xinitrc\
    \ file. Otherwise, GNOME will probably start, but X might not close when you log\
    \ out of GNOME.\n\nListing 3.1 shows a section of xinit that points to .Xclients\
    \ or Xclients, which will list the X users you want to start with X. If you have\
    \ an entry similar to Listing 3.1 in xinitrc, then you should add exec gnome-session\
    \ to Xclients or .Xclients.\n\n# LISTING 3.1 xinitrc Pointing to Xclients or .Xclients\n\
