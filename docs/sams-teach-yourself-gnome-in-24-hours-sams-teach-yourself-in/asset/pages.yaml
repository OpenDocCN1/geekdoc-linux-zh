    the file type.

    Detailed View lists the item, the file size, and the last time the file was modified.

    Brief View shows only the name of the item and a folder icon, if the item is a
    directory.

    Custom View enables you to decide exactly what file information to display.


    # The Commands Menu and the Help Menu


    Commands is a miscellaneous menu, which includes only two entries that involve
    commands:


    +   Run Command is a simple dialog box for running a single command.

    Run Command in Panel is a dialog box for running commands within File Manager.


    The Commands menu holds two other options:


    +   Find Files is another search tool that searches the entire file system for
