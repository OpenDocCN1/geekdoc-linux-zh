    # Resetting the GNOME Session


    If you want to reset the GNOME session to its default condition, delete the $HOME/.gnome/session
    file from your home directory and restart GNOME. All configurations you have made
    to your GNOME session will disappear, and your GNOME desktop will return to the
    state it was the first time you logged in. This can be quite a drastic action,
    because all custom items on your panel, launchers in the Main Menu, all icons
    you made on the desktop, and all configurations made with GNOME Control Center
    will disappear. If your session is irrecoverably broken, deleting the session
    file might be the only solution. It is a good idea to log the customizations you
    have made to GNOME session, or to make a backup of the $HOME/.gnome/session file
    before deleting it, so you can recover your customizations later.'
