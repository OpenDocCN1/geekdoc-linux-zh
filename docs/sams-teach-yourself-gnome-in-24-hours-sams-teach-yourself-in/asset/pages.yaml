    # Answers for Hour 14


    # Quiz


    +   1. What does PPP stand for?

    Point to Point Protocol.


    +   2. What is the name of the daemon that starts when you make a PPP connection?

    ppppd.


    +   3. What serial port does your modem connect to?

    Answer varies according to reader. Possible answers are ttyS0, ttyS1, ttyS2, and
    so on. On older distributions of Linux, it can be cua0, cual1, cua2, and so on.


    +   4. What is the /dev/modem file?

    /dev/modem is a symbolic link to the device file that represents the serial port
    your modem is connected to.


    +   5. What are two kinds of PPP authentication protocols?

    CHAP and PAP.


    +   6. If you must dial 9 to get an outside phone line, how would you get the
    PPP Dialer to pause long enough to connect to an outside line?

    Enter a comma after the 9 and before the phone number. The dialer will pause for
    one second. Enter 2 commas to get the dialer to pause two seconds.


    +   7. What does DNS stand for, and what does it do?


    DNS stands for Dynamic Name Service. It is a database that translates hostnames
    into IP addresses.


