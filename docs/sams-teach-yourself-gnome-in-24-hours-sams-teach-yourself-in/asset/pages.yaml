  md: '# Uploading and Downloading Files with gFTP


    The Display tab has an option to display messages as separate windows or in a
    preview

    pane on the main Balsa window. It also contains toolbar display options, with
    which you

    can specify to display toolbar items as icons, text, or both icons and text.


    FTP, which stands for File Transfer Protocol, is used for transferring files and
    directories between computers via a remote connection, such as PPP. You can use
    your Web browser or a simple utility such as wget to download single files anonymously
    from an FTP site. You can also perform simple file manipulations and uploads by
    GNOME File Manager. If you want to perform tasks that are more complicated, you
    need an FTP client application such as gFTP. Some of the tasks that gFTP can help
    you accomplish are


    +   * Log in to FTP sites via user login and password

    * Upload files to an FTP site

    * Upload or download several files at once or entire directories

    * Compare directories on your computer to those of a remote computer

    * Manipulate files on a remote computer, including changing permissions, copying,
    deleting, and moving files

    * Edit files on a remote computer


    gFTP is an excellent FTP client, with dozens of features, great stability, and
    speed. Some of gFTP''s features include


    +   * ASCII and binary transfer modes

    * Multithreaded, so you can transfer several files simultaneously if you have
    enough bandwidth

    * Bookmarks supported, with useful Linux and X11 bookmarks preconfigured

    * The capability to resume interrupted file transfers

    * Drag-and-drop support

    * Support for FTP and http proxy servers

    * Automatic connection attempt


    # Exploring the gFTP Window


    If you haven''t used an FTP client before, gFTP can look a little daunting at
    first glance. Although it might not seem so at first, gFTP is as easy to use as
    a Web browser. After you are familiar with all the buttons and menus, you will
    want to use gFTP for the simplest to the most complex FTP tasks. Here is a quick
    exploration of the gFTP window.'
  merge: -1
