  md: '# Permissions


    The Permissions tab is a graphical interface for the ls -l, chown and chmod commands,
    for setting permissions and changing the ownercr of the file.


    The three permissions, Read, Write, and Execute, and the three classes of user,
    Group, and Other, are arranged into a grid. The permission for each user class
    has a button. If the button is selected, that class of user is assigned that particular
    permission. If the button is deselected, that user class loses that permission.
    As you press the buttons, the octal number for the permission is displayed in
    the Current Mode field. The current mode changes dynamically as you select and
    deselect the permission buttons. The Permissions tab is shown in Figure 9.14.


    # FIGURE 9.14


    ![](img/56ffc05f2012b0375f08095ea492838b_139_0.png)


    If you understand symbolic notation, octal notation is simple. With symbolic notation,
    the read, write, and execute permissions are listed for the user, group, and other
    users. The mode is a four-place number, where the first number stands for special
    permissions; the second number represents permissions for the user; the third,
    permissions for the group; and the fourth, permissions for other users. Each kind
    of permission is assigned a number value:


    +   * Set UID has a value of 4.

    * Set GID has a value of 2.

    * Set the sticky bit has a value of 1.

    * Read permission has a value of 4.

    * Write permission has a value of 2.

    * Execute permission has a value of 1.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Common File Manager Tasks


    The permission values are added for each kind of user. For example, 0777 is the
    same as rwxrwxwx. 0755 is the same as rxr-xr-x, and 0511 is the same as r_xr--r--.


    # File Ownership


    The bottom of the Permissions tab contains the File Ownership section, with two
    fields, Owner and Group. By default, the Owner of the file is the User who created
    the file, or the owner assigned by the superuser with the chown command. The User
    who owns the file and root are permitted to change the group who owns the file.
    This is the interface to the chown command.


    The Group field designates the group that the file belongs to. Group ownership
    is useful if you want only certain users to be able to have, for example, write
    privileges to a file, while others have read-only or, in the case of a directory,
    read and execute-only access.


    ![](img/56ffc05f2012b0375f08095ea492838b_140_0.png)


    > Read, write, and execute access mean different things when you are talking about
    a directory, versus a file. For a directory, read access means that you can list
    the contents of the directory. If you have write access, you can add or remove
    files in the directory. Execute access means that you can list specific information
    about the files in the directory, using ls -1.


    # Options


    Applications have an additional Properties tab, Options. Options enables you to
    open, view, and edit the file in other than the default manner that is set in
    the MIME Types caplet of GNOME Control Center. Also, if the file should be opened
    in an X terminal, select Needs Terminal to Run. The Options tab is shown in Figure
    9.15.


    Figure 9.15


    The File Options tab appears if the file is executable.


    ![](img/56ffc05f2012b0375f08095ea492838b_140_1.png)'
  merge: -1
