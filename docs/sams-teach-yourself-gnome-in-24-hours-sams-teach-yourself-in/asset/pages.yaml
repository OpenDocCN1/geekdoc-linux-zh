    your path is /usr, you won''t be able to run the application without specifying
    the full pathname. Other packages that depend on that package won''t be able to
    find it, and won''t be able to find the libraries it needs to run. There are ways
    to get around this problem, such as adding the new pathname to the PATH environment
    variable, but it is best if you find the rpm that matches your Linux distribution.'
