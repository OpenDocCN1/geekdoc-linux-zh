  md: 'On the Miscellaneous tab, be sure to check the ToolTips Enabled check box.
    This option causes a pop-up of the launcher or drawer name to appear when you
    place the mouse over the item. For this option to work, there must be an entry
    in the ToolTip field (for a drawer) or Comment field (for a launcher) in the Properties
    section.


    Animations control the speed at which drawers open and close, the panel will open
    and close, and so on. You can experiment with the animation speeds, or just leave
    the default values.


    The Launcher Icon, Drawer Icon, Menu Icon, and Logout Icon tabs let you configure
    the depth of these buttons on the panel, how they look when depressed, and so
    on. Be sure to check the Tiles Enabled check box in the Launcher Icon tab if you
    want to be able to set background images on empty spaces on the GNOME Panel, as
    shown in Figure 7.3.


    # This Panel Properties


    The Panel Properties dialog lets you configure individual panels. The Orientation
    boxes—Top, Bottom, Left, and Right—determine the orientation of panel to the screen.
    In essence, you can have a panel on all four sides of your screen, oriented to
    the left, right, top, or bottom. Corner panels conserve space by being only as
    large as necessary for the items on them. Edge panels catch up the entire side
    of the screen, with background color filling in the empty space on the panel.


    The Autohide check box lets a panel be hidden from view until you move your mouse
    over it. This option is useful for small screens, or if you intend to have many
    windows open once.


    Use the Background tab to choose a background image for empty spaces of your panel.
    The Standard option gives you the color chosen by the theme you are running. Pixmap
    lets you choose an image for the background, such as the background design on
    the panel in Figure 7.3. With the Color option, you can select the exact color
    you want from a gradient palette.


    # Adding a Panel


    You can have as many panels as your screen will hold. To create a new panel, select
    Create New Panel from the Panel menu and specify an edge or corner panel. To remove
    a panel, click on it and select Remove This Panel.


    # Using the Main Menu


    In Microsoft Windows, whenever a new application is added, the installation script
    usally places a menu icon on the desktop and an entry in the Main Menu "automagically.'
