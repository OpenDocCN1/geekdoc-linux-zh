  md: '# Hour 4


    > Some extra steps must be taken when installing Enlightenment for AIX, Irix,
    and HP platforms. See the Enlightenment Web site at http://www.enlightenment.org.


    ![](img/56ffc05f2012b0375f08095ea492838b_65_0.png)


    Designed to be highly configurable, Enlightenment has more customization options
    than any other X window manager. You can design your window borders, buttons,
    and menus using a graphic design like Gimp. You can choose from many options using
    the Enlightenment Configuration Manager, or download an entire theme.


    Enlightment is also a desktop shell, which means you can use it by itself to launch
    applications. According to the Enlightenment Project, eventually Enlightenment
    will have its own file manager, drag-and-drop, and applet management capability.
    Currently, however, this functionality is still in the planning stages.


    # Advantages of Enlightenment


    +   - Enlightenment is fully compliant with GNOME.

    - The default window manager for GNOME, Enlightenment is relatively simple to
    install and run.

    - Enlightenment was designed to be highly configurable in appearance and functionality.

    - Hundreds of themes are available for use with Enlightenment. Many are beautiful
    and creatively designed (see Figure 4.3).


    # Disadvantages of Enlightenment


    +   - Because of Enlightenment''s many configuration options, some people find
    it complicated to use at first.

    - Enlightenment is complex, compared to other window managers. It takes up lots
    of system resources, so it can slow down operations, as loading GNOME and opening
    windows. If you have a fast processor and a lot of RAM (more than 64MB), this
    might not be a problem.


