  md: '# GNOME and Linux


    When you type in commands at the command line, you are not really communicating
    with the Linux kernelcl directly, but through an interface called the shell. Different
    shells in Linux accept different commands and do things slightly differently.


    As you learned in Hours 4, "Working with Window Managers," and 5, "Exploring the
    Desktop," GNOME works as an interface with the X server, through which you interact
    with the Linux kernel. You can think of GNOME and X working together as a graphical
    shell. Like the Bourne-aine, C and Korn shells, X is an interface through which
    you communicate with the kernel to accomplish tasks.


    # Understanding the Multiuser System


    To understand this, you must understand that Linux is a multiuser system. When
    you have GNOME running on your Linux system, every user account can set up GNOME
    in a different way. Before we discuss how GNOME is configured differently for
    different users, let''s discuss the difference between a single-user system, like
    MacOS or Windows, and a multiuser system, like Linux.


    All UNIX and UNIX-like operating systems are designed to be multiuser, so that
    is, they are designed with the idea that there will be many people using the same
    computer at the same time to do different tasks.


    When you use a Windows or MacOS computer, you turn on the computer and start to
    use it. Although there may be several user profiles saved on the computer, only
    one person can use the computer at a time. There is only one user for one operating
    system. Linux has one operating system and one kernel, but many users. Each user
    has an account on the system. Before using Linux, the user must log in with a
    valid username and password.


    A rough analogy would be the difference between a single-family house and an apartment
    building. One family or person lives in the house. One family has the key to the
    house, and nobody else can enter the house without that family''s permission.
    The family is in charge of the electricity, plumbing, heating, and repairs on
    the house. Everything in the house belongs to one family, and that family is responsible
    for everything in the house. That is how Windows operates. (We''re not counting
    NT in this analogy, although it acts in the same way.)


    Now imagine an apartment building. There are many people living in the apartment
    building, and tenants (individuals or families) enter their respective apartments
    in the building through different doors with different keys. Although they share
    the same physical building, no one can enter anyone''s apartment without that
    person''s permission.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# GNOME Under the Hood


    To each tenant, the only part of the building that concerns him and to which he
    has access is his own apartment.


    Now, there are things in the apartment that everybody shares. They all get water
    from the same water heater or steam plan. All the plumbing is on the same system,
    as well as the heating. They might share the same laundry room. This apartment
    building has a landlord who has access to every apartment in the building. The
    landlord is responsible for the grounds, the maintenance, and all the services
    in the building. The apartment building is like a Linux system. Each tenant is
    like a user: each apartment is like a home directory. The landlord is like the
    system administrator of a Linux system. Although each tenant contains furniture
    and personal belongings that the landlord doesn''t own or control (the users''
    files and applications in their home directories), the landlord has a key to every
    apartment in the building (the root account). The landlord is responsible for
    the services in the building. The services are similar to the shared directories,
    such as /usr/bin, /usr/share, and basically everything that isn''t in a user''s
    /home directory.


    Let''s say that the landlord lives in the apartment building. He doesn''t use
    his landlord keys to get into his own apartment; he is a tenant. In the same way,
    the system administrator of a Linux system doesn''t use the root account for his
    personal use. He will also have an ordinary user account for his daily work. When
    he needs to do something that requires root access, he will log in to the root
    account, or become the superuser. When he is performing ordinary user tasks such
    as writing a letter or using the Internet, he will use his own user account.


    > If you are the only user on your Linux system, it might be tempting to always
    log as root (this author pleads to the habit) using your root account when you
    are online can lead to security problems, as well as the potential to inadvertently
    cause harm to your system.


    If you are the only user on your system and you regularly back up your files,
    don''t be afraid to explore and use your system and make mistakes. It''s the only
    way to learn. A good rule of thumb is to maintain your system in a way that you
    could format the hard drive and start over again any time if you had. That means
    backing up important files, such as email, home directories, preferences, system
    files that you have modified, and others.


    When experimenting with system administrator tasks, it is helpful to make a backup
    copy of configuration files. For example, if you want to edit /etc/wvdial.conf-backup,
    copy it to /etc/wvdial.conf. Then make changes in the original, and, if it breaks
    the application, you can always restore the backup copy.


    ![](img/56ffc05f2012b0375f08095ea492838b_94_0.png)'
