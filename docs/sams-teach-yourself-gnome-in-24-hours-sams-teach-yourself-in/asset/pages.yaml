  md: '# HOUR 6


    # GNOME Under the Hood


    Have you ever wondered, “What is really happening when I point and click the desktop?
    How does the system know what to do when I click a button? How do windows really
    work?” In addition to teaching you about how to use GNOME, this book tries to
    answer these questions in a way that the average user, with no programming background,
    and possibly no Linux background, can understand. The aim of this hour is certainly
    not to give you all the answers in a few pages, but to lead you into an exploration
    of the desktop on both the outside and the inside, to encourage you to explore
    and experiment. We begin this hour with a quick tour through the files and directories
    that are important to GNOME, in the hopes that this will foster your interest
    in exploring the mechanisms behind the rest of GNOME.


    In this hour, you will


    +   * Explore the multiuser aspect of Linux and how it relates to GNOME.

    * Learn about GNOME libraries and executable files.

    * Look inside the shared GNOME directories and files.

    * Understand configuration files and the session file.'
