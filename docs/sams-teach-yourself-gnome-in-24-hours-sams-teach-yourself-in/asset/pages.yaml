    # Gnibbles


    Also called GNOME Nibbles, this simple video game is a more advanced graphical-version
    of the traditional UNIX Worms game. The game presents you with a worm that you
    control with a set of keys on the keyboard. The object is to maneuver your worm
    so that it can eat the diamond crackers without bumping into the wall. There are
    up to 26 levels of difficulty, and up to four people can play. As your worm eats
    the diamond crackers, it gets longer. If your worm runs into a wall or on itself
    while trying to eat the diamonds, it dies, and the game is over. The player whose
    worm eats the most crackers wins.


    # GNOME Robots II


    GNOME Robots II is another graphical version of an old UNIX game, the text-based
    Robots. You can also change the robots to eggs, cow, mice, or windows. During
    each move, the robots try to box you in so you can eat them. The object is to
    move away from them in a way that makes them crash into each other or into the
    junkeaps left over collisions. You can also teleport to a far away location. You
    can wait a turn to see what the robots do, or random teleport, possibly into the
    waiting rooms of a robot.


    # Gnome-Stones


    Gnome-Stones is an arcade-like, one-player game that takes place in a diamond
    mine strewn with stones and diamonds. The mine also has a labyrinth of brick walls
    with doors, which you must navigate to find all the diamonds. The object of the
    game is to collect all the diamonds and find the exit without leaving any stones
    fall on you. Each level of play involves more complicated labyrinths and diamonds
    that are harder to reach. A game of Gnome-Stones is shown in Figure 20.16.'
