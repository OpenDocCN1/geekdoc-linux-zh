  md: '# Eye of GNOME


    Eye of GNOME is a simple, no-frills image viewer. It is fast and takes up a small
    amount of memory, but still displays high quality images and is also easy to use.
    Eye of GNOME supports these graphics file formats:


    +   * PNG

    * GIF

    * JPEG

    * BMP

    * PMN

    * RAS

    * TIFF

    * ICO

    * XPM


    Eye of GNOME is new on the GNOME scene, but it is scheduled to replace Electric
    Eyes as the default image viewer in the GNOME 2.0 release. Electric Eyes is the
    default image viewer for GNOME 1.0.5.3 (October GNOME) and earlier GNOME versions.
    Eye of GNOME works as a complete application by itself, but it can also be used
    as a component in other GNOME applications. Because it uses Bonabo technology,
    images can be embedded into other GNOME applications as quickly and easily with
    minimal use of memory. Eye of GNOME is shown in Figure 19.1.


    ![](img/56ffc05f2012b0375f08095ea492838b_281_0.png)


    > Bonobo is a CORBA (Common Object Request Architecture) technology for GNOME
    applications that enables an application to act as a component of another application.
    You will learn more about Bonobo in Hour 23, "GNOME Technologies."


    To install and run Eye of GNOME, you must first ensure that these packages are
    installed:


    +   * gdk-pixbuf

    * gdk-pixbuf-devel

    * gnome-libs

    * gnome-libs-devel'
