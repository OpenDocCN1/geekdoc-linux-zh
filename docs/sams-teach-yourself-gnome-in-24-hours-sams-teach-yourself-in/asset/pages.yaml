    +   4. What does it mean when a window has the focus?

    When a window has the focus, it is the active window, and operations can be carried
    out with the application inside. Only one window at a time can have the focus.


    +   5. What is the difference between virtual desktops and multiple desktops?

    Virtual desktops exist side by side (horizontally). You can change virtual desktops
    by dragging your mouse from one to another. Multiple desktops are stacked on top
    of one another and can only be changed via dragbar, menu, or the Enlightenment
    Pager or GNOME Desk Guide.


