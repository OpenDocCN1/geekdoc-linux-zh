  md: '# Desktops


    One of the most useful aspects of Enlightenment is its capability to manage multiple
    and virtual desktops. If you tend to have 10 or more windows open simultaneously,
    if you want to group your windows according to one task, or if you have applications
    running in the background that you check on occasion, this feature is ideal. The
    of a virtual desktop goes two steps further than the traditional X virtual desktop,
    in which your desktop can be larger than your actual screen. With multiple and
    virtual desktops, you can increase the size of your work area by a factor of two,
    four, or eleven.


    # Virtual Desktops


    Virtual desktops, also called desktop areas, expand the horizontal size of your
    workspace. The Enlightenment User''s Guide compares virtual desktops to multiple
    sheets of paper placed next to each other on a desk. Just as you would move your
    pen to paper on a desk, you can drag your mouse to move from one virtual desktop
    to another. Each desktop has its own GNOME Panel, Iconbox, and Enlightenment Pager.
    You can make applications sticky so that they appear in each virtual desktop,
    and you can open different applications in each virtual desktop. For example,
    you can have your word processing application open in one virtual desktop, games
    open in another, and a Web site and email open in yet another.


    To add or remove a virtual desktop, right-click it and select Virtual Desktop
    Settings from the Settings menu. You can have virtual desktops oriented vertically,
    horizontally, or both directions. Select Enable Edge Flip so that you can move
    to another virtual desktop by dragging the mouse. Use Resistance at Edge of Screen
    to control the amount of time your mouse must stay at the border of the virtual
    desktop before moving to the next desktop. Figure 10.12 shows the Virtual Settings
    dialog box.


    Figure 10.12

    Use virtual desktops to increase your horizontal workspace.


    ![](img/56ffc05f2012b0375f08095ea492838b_155_0.png)'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Multiple Desktops


    Multiple desktops, like virtual desktops, give you more workspace. Unlike virtual
    desktops, however, they are "stacked" on top of each other, and act as completely
    separate desktops. Also, you cannot use your mouse to change from one of these
    desktops to another. You can define a different theme and background for each
    desktop.


    To add or remove desktops, right-click the desktop and select Multiple Desktop
    Settings, as shown in Figure 10.13. To add desktops, drag the slider to the right.
    To remove desktops, drag the slider to the left. You can have up to 32 desktops.


    Figure 10.13

    Each desktop is a complete, separate desktop. Desktops are stacked on top of one
    another.


    ![](img/56ffc05f2012b0375f08095ea492838b_156_0.png)


    There are several ways to change desktops:


    +   - Click the desktop you want in the GNOME Desk Guide.

    - Holding down Ctrl, middle-click the mouse, and then select the desktop you want.

    - From the Enlightenment menu, select the Desktop submenu, and then click Goto
    Next Desktop or Goto Previous Desktop.


    There are still more ways to switch between desktops in Enlightenment. See *The
    Enlightenment User''s Guide***, which can be opened by middle-clicking the desktop
    and selecting Help.


    Figure 10.14 shows the Desktop submenu of the Enlightenment menu. Use the Desktop
    menu to move between desktops.


    Figure 10.14

    Features on the Desktop submenu. Try clicking FX- Ripples or FX- Waves, and watch
    the bottom of your screen. To turn the effect off, click the menu entry again.


    ![](img/56ffc05f2012b0375f08095ea492838b_156_1.png)


    ![](img/56ffc05f2012b0375f08095ea492838b_156_2.png)'
  merge: -1
