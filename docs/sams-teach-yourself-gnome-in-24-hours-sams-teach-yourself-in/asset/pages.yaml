    # Summary


    In this hour, you learned how GNOME uses Bonobo interfaces within a CORBA architecture
    to enable application developers to create new applications using existing code.
    Objects that are connected with CORBA interfaces do not have to be related in
    any way to be used together. Using Bonobo, applications can be strung together
    to create larger, custom applications.


