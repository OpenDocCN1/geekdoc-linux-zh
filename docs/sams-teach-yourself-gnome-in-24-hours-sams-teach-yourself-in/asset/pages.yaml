    # Summary


    In this hour, you learned how printing works in UNIX-like systems. You learned
    about the various print commands, including lpd, lpr, lpq, and lprm. You saw how
    /etc/printcap file is used to store information about your printer and print jobs.
    You also printed graphics files using GIMP.


    # Q&A


    +   Q How can I tell if my printer is supported under Linux?

    A Check the HOWTO.

    Q I ran a very large print job that I wanted to cancel, so I turned off my printer
    and rebooted Linux. When the computer restarted, my print job continued printing!
    What should I do?

    A Your print jobs remain on the print spool until they are printed or removed
    from the spool, even if you reboot your computer. Always use lprm to cancel a
    print job.'
