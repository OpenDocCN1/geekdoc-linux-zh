  md: '# HOUR 3


    # # Starting and Logging Out of GNOME


    Often, the most frustrating and harrowing part of dealing with new software is
    getting it to start after you have installed it. Fortunately, GNOME does not require
    many special configuration steps. After you have installed the required components,
    there are only a few things to do before you actually start a GNOME session.


    In this hour, you will


    +   * Start a GNOME session on your computer.

    * Make GNOME the default desktop for one user account.

    * Use GNOME as the default desktop for all accounts on your system.

    * Switch between GNOME and other desktops, such as KDE, using Switchdesk.'
