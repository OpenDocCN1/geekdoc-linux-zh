  md: '# Summary


    In this hour, you learned how to use the Enlightenment Iconbox and Pager. You
    navigated the Enlightenment menus and learned how to configure your desktop using
    the Settings menu. You learned more about Enlightenment windows and virtual and
    multiple desktops, and were introduced to themes. You were also introduced to
    eesh, the Enlightenment Shell, and discovered the solutions to some Enlightenment
    problems. Finally, you learned where you can get help if you encounter a problem
    that you can''t fix yourself.


    # Q&A


    +   - What is the horizontal bar at the top of my desktop and what is its purpose?

    - The dragbar is used to navigate around multiple desktops. To move from one desktop
    to another, drag the dragbar until you see the other desktop, and then click the
    mouse in the new desktop.

    - Where do the .enlightenment files come from, and won''t it hurt my system to
    delete?

    - The .enlightenment files are regenerated by Enlightenment every time there is
    a change in the configuration of Enlightenment. If you delete the entire directory,
    Enlightenment will regenerate all the necessary files the next time you start
    Enlightenment (This is why Enlightenment takes a long time to start you log in
    for the first time.)


    ![](img/56ffc05f2012b0375f08095ea492838b_162_0.png)


    # Workshop


    The quiz questions and exercises are designed to increase your understanding and
    to encourage you to continue experimenting. Answers appear in Appendix B, "Answers."


    # Quiz


    +   1. What is the difference in function between the Iconbox and the Enlightenment
    Pager?

    2. Which Enlightenment menu appears when you left-click the desktop? Which menu
    appears when you right-click it? How else can you access these menus?

    3. How do you turn off the ToolTips?

    4. What does it mean when a window has the focus?

    5. What is the difference between virtual desktops and multiple desktops?'
