    # Same Gnome


    Same Gnome is a single-player strategy game that consists of colored balls placed
    randomly on the board. When you click on a ball, all the horizontally and vertically
    adjacent balls disappear. The idea is eliminate all the balls in as few strokes
    as possible. To help you visualize your strategy, when you place your mouse over
    a colored ball, all the balls in the color group quiver. When you eliminate a
    group of balls, the other balls drop down, forming new groups. You cannot eliminate
    a ball that is not part of a group that does not have any balls of the same color
    adjacent to it. The game is over when you have eliminated all possible balls.
    Your score is based on the number of moves it takes you to eliminate all possible
    balls. If you eliminate all the balls, an extra 1,000 points is added to your
    score. Figure 20.15 shows a game of Same Gnome in progress.


