  md: '# Uninstalling GNOME and Getting Help


    # Uninstalling GNOME Tarballs


    Uninstalling GNOME tarballs is a simple matter if you kept the original uncompiled
    source code in your directory tree. To uninstall a tarball, `cd` to the directory
    that was created when you unzipped and untared the tarball for installation. For
    example, if you entered the command `tar -xvf gnome_core-1.5.3.tgz` in the `/usr/src`
    directory, the subdirectory `/usr/src/gnome_core-1.5.3` was created. To uninstall
    `gnome_core-1.5.3`, enter the following commands:


    ```

    cd /usr/src/gnome_core-1.5.3

    make uninstall

    ```


    Uninstall each tarball in the reverse order that you installed it.


    > When upgrading, always uninstall the old tarball before installing the new tarball.


    # Uninstalling Enlightenment


    If you installed Enlightenment from a binary package, there is no need to uninstall
    the old package before you upgrade. Simply download the new version and install
    it using the Upgrade option. In versions of Enlightenment prior to version 0.16.3,
    it was recommended that you delete the `$HOME/.enlightenment` directory. In version
    0.16.3 and later, it is no longer necessary to delete these files before upgrading.


    > If you are uninstalling Enlightenment permanently, follow the order given in
    the previous session to uninstall the Enlightenment module and all supporting
    modules, such as Ilib and Flib.


    The following steps must be executed from a shell prompt. Log out of GNOME to
    close the X session before you begin.


    Enter the following command to remove the Enlightenment binaries:


    ```

    rm -rf SPATH/enlightenment

    ```


    The path to the Enlightenment files depends on where you originally installed
    them. Some people install Enlightenment in `/usr/local/enlightenment`, `/usr/enlightenment/`,
    or `/opt/enlightenment`.'
