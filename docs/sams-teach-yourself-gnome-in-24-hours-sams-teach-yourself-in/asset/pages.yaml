  md: '# Monitoring Your Connection


    If you want to monitor your connection, click View and check Debug Terminal to
    open a viewer that displays PPP messages. The debug terminal is shown in Figure
    14.6.


    FIGURE 14.6


    The Test window displays more verbose messages about the connection than the main
    PPP Dialer window.


    ![](img/56ffc05f2012b0375f08095ea492838b_217_0.png)


    If you are not sure if are connected, a fast and simple way to verify your connection
    is to ping an Internet address. For example, in an X terminal, type


    ping www.gnome.org


    If you are connected, ping returns with the IP address of the host you pinged,
    and the size of the packets of data exchanged. Press Ctrl+C to save the link.
    Figure 14.7 shows a ping to www.redhat.com.


    FIGURE 14.7


    Ping provides the IP address of the host, as well as packet exchange data.


    ![](img/56ffc05f2012b0375f08095ea492838b_217_1.png)'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Setting Up a Remote Connection in GNOME


    In addition to ping, you can use traceroute for a more detailed test of your connection.
    Traceroute sends a packet from your computer to the IP address or hostname that
    you specify, and lists the route that it takes to get there, through each gateway.
    To use traceroute, enter traceroute [hostname]. For example, to trace a route
    to Red Hat, enter traceroute www.redhat.com


    > If you have problems with your connection, read the ISP Hookup HOWTO at http://linuxdoc.org/ISP-Hookup-HOWTO.html
    for guidance.


    # PPP Applet


    The PPP Applet is a simple applet interface to the GNOME PPP Dialer. To start
    a PPP connection, click the globe icon, choose a PPP account, and click Raise
    PPP Link. When you are ready to disconnect, click the globe icon and then Lower
    PPP Link. The advantage of using the PPP Applet is that it is a simple means to
    start a PPP connection. A timer lets you know how long you have been connected,
    and the revolving globe icon lets you know whether the link is connected or severed.
    A text message also appears to let you know whether you are online or offline.
    The PPP Applet is shown in Figure 14.8.


    Figure 14.8

    PPP Applet resides in the GNOME panel, so it takes up less space than the main
    Dialer window.


    ![](img/56ffc05f2012b0375f08095ea492838b_218_0.png)


    # Modem Lights


    Modem Lights is another PPP Dialer applet. The great advantage of Modem lights
    is that you can choose which dialer you want to use via the Properties tab. When
    you are connected, the "lights" on the app light up green. Modem Lights is shown
    in Figure 14.9.


    Figure 14.9

    The "lights" on Modem Lights turn on (get brighter) when you are connected.


    ![](img/56ffc05f2012b0375f08095ea492838b_218_1.png)


    ![](img/56ffc05f2012b0375f08095ea492838b_218_2.png)'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Summary


    In this hour, you learned how Linux uses the PPP protocol to make remote connections
    over a phone line using a modem. You created a PPP connection to your ISP using
    GNOME PPP Dialer. You pinged a Web server to validate your PPP connection, and
    used the Test window of PPP Dialer to monitor your connection. You also learned
    about making PPP connections using the PPP Applet and Modem Lights.


    # Q&A


    +   Q Are there GNOME utilities for networking over a LAN?


    +   A Although they are beyond the scope of this book, GNOME-linuxconf and epanel
    provide dialog boxes for networking. Both are available through the GNOME Software
    Map or the rpmfind database.


    +   Q Do I have to use GNOME PPP Dialer to connect to the Internet if I am in
    GNOME?


    +   A No, you can use any PPP dialer you want. You can create a panel launcher
    or a main menu entry for your non-GNOME dialer using the techniques you learned
    in Hour 7, “Using the Panel and the Main Menu.”


    +   Q I can''t get GNOME PPP Dialer to work. Where can I find another PPP dialer?


    +   A GNOME PPP Dialer is still in development stage, and although stable, doesn’t
    work for everyone. Wdial, although text-based, is more user-proof. Download wvdial
    from your Linux distribution site. Source code is also available at http://freshmeat.net.
    You can also try x-wvdial, which provides a graphical interface for wvdial.


    # Workshop


    The quiz questions and exercises are designed to increase your understanding and
    to encourage you to continue experimenting. Answers appear in Appendix B, “Answers.”


    # Quiz


    +   1. What does PPP stand for?


    +   2. What is the name of the daemon that starts when you make a PPP connection?


    +   3. What serial port does your modem connect to?


    +   4. What is the /dev/modem file?'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Setting Up a Remote Connection in GNOME


    +   5. What are two kinds of PPP authentication protocols?

    6. If you must dial 9 to get an outside phone line, how would you get the PPP
