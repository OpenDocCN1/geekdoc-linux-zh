  md: '# HOUR 9

    Common File Manager Tasks


    When you work on a user level with files and directories in Windows or MacOS,
    you are well shielded from what is happening in the filename. Options are few,
    unless you are logged in as an administrator. In Linux/UNIX, on the other hand,
    ordinary users have a wide range of options for working with files and directories.
    GNOME File Manager makes it easier to understand and more intuitive to use all
    the tools available for the UNIX filename.


    In Hour 8, "Managing Files in GNOME," you were introduced to GNOME File Manager.
    You learned about the organization of the File Manager window, including the menus,
    toolbar, and directory windows, and how to customize File Manager using Preferences.
    In this hour, you will learn how you can use File Manager to accomplish common
    file administration tasks.'
