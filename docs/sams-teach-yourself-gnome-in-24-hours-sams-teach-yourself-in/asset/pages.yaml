  md: '# HOUR 4


    # Working with Window Managers


    For many people who are new to UNIX-like platforms, the concept of window managers
    is unfamiliar. In Microsoft Windows, the software that controls the placement
    and movement of windows is indistinguishable from that which controls the graphical
    picture that you see on the screen, or the software that makes an application
    start when you double-click it.


    In GNOME all three functions—namely window operation, graphical interface, and
    desktop shell—are controlled by different pieces of software that work together
    to create the GNOME environment. GNOME is unique among desktop environments because
    it works with more than one window manager. For example, the KDE desktop environment
    works with KWM, which is integrated into the KDE environment. With GNOME, you
    have a choice of window managers to work with.


    In this hour, you will


    +   - Learn about window managers and how they work with the GNOME desktop environment.

    - Install and run three window managers that are GNOME compliant.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '+   - Install and run Enlightenment, the default GNOME window manager.

    - Discover what it means to be GNOME compliant, and how a GNOME-compliant window
    manager works with GNOME.


    # # How GNOME Works with Window Managers


    GNOME works with window managers a bit differently than other desktop environments
    because of its unique features.


    To understand how a window manager works and how GNOME works with window managers,
    it is important to understand exactly what a window manager is and what it is
    not.


    ![](img/56ffc05f2012b0375f08095ea492838b_61_0.png)


    > Like GNOME, the window managers discussed this hour don''t work only as Linux,
    but will work with any UNIX system that has an X server, such as XFree86.


    # ## The Desktop Environment


    The entire area of your display where you work with windows is the *desktop environment*,
    or *desktop shell*. A desktop shell enables you to run applications and manipulate
    files in a graphical setting, rather than using a keyboard to type input. The
    computer (or more accurately, the kernel) receives the same input as if you had
    typed commands—there is just another layer between you and the kernel. The desktop
    provides an interface that you can use to communicate with the computer.


    # ## The Graphical Interface


    The foundation of any desktop system involves pointing and clicking with a mouse
    is the graphical interface. In UNIX systems, including Linux, the graphical interface
    is called X. X displays information on your monitor as pictures, or *graphics*.
    You can interact with the graphics on the screen using a mouse. When you click
    a button or a box on the screen, X takes the input from your mouse and translates
    it into commands that your computer understands. In order for X to work, however,
    there must be something that tells X what to display and how the display will
    look. That function is accomplished by GNOME and the window manager.


    # ## The Window Manager


    Within a graphical interface environment, there is an area called the *desktop*
    that usually has icons and menus on it. You can click the name of the menu or
    the icon of an application to run it. The application opens in a window that you
    can drag anywhere on the desktop.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Working with Window Managers


    You can maximize the window to take up the size of the entire desktop, or minimize
    so that it disappears from the desktop. Usually there is a border around the window
    that has the name of the application or file, and possibly some icons that enable
    you to close and change the size of the window. As shown in Figure 4.1, the window
    manager controls all these aspects of the window:


    +   - The size of the window

    - The window borders

    - The window design and appearance

    - The window functionality

    - Window movement around the desktop

    - The general look of the desktop


    Figure 4.1

    The window manager controls the placement and function of the window, but not
    the applications that appear inside the window.


    Desktop icons -


    ![](img/56ffc05f2012b0375f08095ea492838b_62_0.png)


    Application icon GNOME panel Pagers (Enlightenment) Iconbox (Enlightenment)'
