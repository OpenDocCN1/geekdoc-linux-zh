    # Q&A


    +   - Does it matter to gnoRPM where I keep rpm packages on my computer?

    A long as you specify the directory where you keep rpm packages in gnoRPM you
    can put them in any directory you like. You really don''t even have to download
    the packages to install them; you can install them directly from rpmfind without
    saving the rpms on your local hard drive first.

    - Can I install packages using File Manager?

    A Using File Manager''s Virtual File System, you can enter any fpt address in
    the Location field. Find an fpt site that contains the rpm you want, open it using
    File Manager, and then right-click the rpm package and select Install. You will
    learn how to open an FTP site using File Manager in Hour 15, “The Internet and
    GNOME.”


