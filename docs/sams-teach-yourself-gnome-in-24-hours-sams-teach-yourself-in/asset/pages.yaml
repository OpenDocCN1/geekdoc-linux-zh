    # # The Session Files


    It is important to be familiar with the session files, because if your GNOME desktop
    behaves strangely or freezes when you log in, you might have to delete one or
    more of them and restart GNOME. You will need to know what of the files do, so
    that you know which one to back up before deleting the session. This becomes important
    as you customize your desktop more; it will be a lot of work starting all over
    again with the customizations.


    If your desktop freezes when you first log in GNOME, delete and log back in. A
    typical session file is shown in Figure 6.5.


    Figure 6.5


    ![](img/56ffc05f2012b0375f08095ea492838b_99_0.png)


    # # The .desktop Files


    The .desktop files contain configuration information about the GNOME programs
    that you have installed. Located in /usr/share/gnome/apps, /usr/local/share/gnome,
    or /opt/gnome/share in SuSE, they are in a special format that is read by the
    gnome-config. When a new application is added to the desktop by root, a .desktop
    file is created. Gnome-config uses the information to add the program to the GNOME
    Main Menu.'
