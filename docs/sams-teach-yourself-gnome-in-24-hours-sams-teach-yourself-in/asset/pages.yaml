  md: '# HOUR 2


    # Installing GNOME


    Installing GNOME can be time consuming, but it is not difficult. Some Linux distributions
    such as Red Hat automatically install GNOME as part of the Linux installation.
    As we will discuss, however, new releases of GNOME occur so often that the components
    on the CD are often already out of date by the time the CD is released. In addition,
    if you ever have to uninstall and reinstall GNOME from scratch, you should understand
    the components of GNOME and the correct installation order.


    In this hour, you will


    +   * Learn what hardware and software you must have to run GNOME.

    * Install GNOME from rpm.

    * Troubleshoot your installation.


    # Preparing to Install GNOME


    Before you install GNOME, you must be sure that you have sufficient resources
    on your computer and that you have the necessary software that GNOME needs in
    order to run.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Necessary Hardware


    Your computer must have at least 16MB of memory to run GNOME, and at least 32MB
    for optimal performance. You must also have a minimum 50MB of disk space if you
    are installing from binary files (such as rms) or 200MB of disk space if you are
    installing from source code (tarballs). The memory on your video card is also
    important—the more you have, the faster GNOME will run. If your video card is
    low, GNOME will run, but it might be slow, particularly if you have a complex
    window manager. If your video card has less than 4MB of memory, install a simple
    window manager like sawmill, and use a simple, clean theme. We will learn more
    about window managers in Hour 4, "Working with Window Managers," and more about
    themes in Hour 12, "Understanding and Using Themes."


    # Necessary Software


    To run GNOME you must have a fully functioning X server as XFree86 installed and
    configured on your computer. Before installing GNOME to get the most recent version
    of your X server. If you are running a common Linux distribution, your X server
    is most likely XFree86. Install the latest upgrades from http://www.xfree86.org
    before proceeding. At the time of writing, the latest version of XFree86 is 3.3.6.x.


