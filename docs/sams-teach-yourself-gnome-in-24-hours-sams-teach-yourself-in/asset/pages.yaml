  md: '# User Menus


    You can access the User menus either from the main Enlightenment window, or by
    left-clicking the desktop. The User menus vary according to your system. In Figure
    10.4, the KDE and GNOME menus are included, as well as the user''s GNOME menu
    and a list of commonly used applications. If you are familiar with scripting,
    you can configure the User menus to hold whatever you want, as we will learn later
    this hour.


    Figure 10.4

    The User menus vary depending on your system.


    ![](img/56ffc05f2012b0375f08095ea492838b_149_0.png)


    # Settings Menu


    You can open the Settings menu via the Enlightenment menu, or directly by right-clicking
    the desktop. Settings control how your windows move and behave, how your mouse
    behaves, and how to make a window active (also called setting the focus of the
    desktop).


    ![](img/56ffc05f2012b0375f08095ea492838b_149_1.png)


