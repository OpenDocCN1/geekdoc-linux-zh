  md: '# HOUR

    # 20


    # # Fun with GNOME


    GNOME is a powerful and cost-effective information technology tool. GNOME can
    help you be more productive in your work, and it can generally enhance the experience
    of using a UNIX-like operating system. Life is not all about work, however, and
    neither is GNOME. Because GNOME is free software and the GNOME development project
    is entirely composed of volunteers, a wide plethora of amusements and games are
    continuously being developed. GNOME developers are renowned for producing imaginative
    and complex graphics that grace even the most simple strategy games. Check out
    lagno, Gnome Tali, and Gnommind in particular.


    In this hour, you will


    +   - Prepare your Linux system to experience sound in GNOME and Enlightenment.

    - Play music on the GNOME CD Player and adjust the sound with the Audio Mixer.

    - Play some strategy and arcade games that come in the gnome--games package.'
