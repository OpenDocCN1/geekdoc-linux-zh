  md: 'If you don''t know the name of the command to start an application, right-click
    the application launcher in the Main Menu and select Properties. The command,
    also called executable file, will be be in the Command field. If there is no launcher
    in the Main Menu, in the GNOME Panel, or on the desktop, read the documentation
    that comes with the application to find the right command. As a last resort, you
    can look in the subdirectories that are defined in your path to find the correct
    command.


    # The PATH Environment Variable


    Your path is the full pathname that leads from the root directory to the subdirectory,
    which contains the executable files, or commands, on your computer. The path is
    defined by your computer by the environment variable PATH. Some examples of paths
    are /usr/bin, /usr/local/bin, /opt/bin. You might have some or all of these directories
    defined in your path.


    To determine what your path is, enter the command echo $PATH at a shell prompt.
    The output of the echo $PATH command lists all the directories that are in your
    PATH. The PATH tells where to look for the commands that will run your applications.
    Listing 17.1 shows a typical path environment variable.


    # Listing 17.1 The PATH Environment Variable


    ```

    echo $PATH

    /sbin:/usr/sbin:/bin:/usr/bin:/local/bin:/usr/X1R6/bin

    ```


    # GNOME Applications—Behind the Scenes


    Whenever you run an application—whether you open it by clicking a launcher on
    the panel, double-clicking the entry in the Main Menu, or double-clicking an icon
    on the desktop—this same process occurs:


    +   1. You click the launcher or enter the command to run an application.

    2. The shell looks at the PATH environment variable to find the location of the
    executable file that is needed to run the application, and then locates the executable
    file.

    4. Once the shell finds the corresponding program, it tells the kernel to load
    and run the program.

    5. The application runs, and a new window opens on the desktop containing your
    application.'
  merge: -1
