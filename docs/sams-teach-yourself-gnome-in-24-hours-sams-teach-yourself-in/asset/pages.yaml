  md: '# # APPENDIX A Troubleshooting


    GNOME is a stable, reliable desktop environment, but it is also very new. There
    are still quite a few bugs to be found, particularly in software with earlier
    releases. A wonderful little utility called Bug Buddy enables you to troubleshoot
    crashed programs and report bugs.


    The purpose of Bug Buddy is to make sending a bug report easy for the user, while
    automatically collecting the information that is useful for the developer. It
    can also help you determine whether a program crashed because of something wrong
    with your system, or because of a true bug in the program.


    Before Bug Buddy, if you had a core dump, you then had to start gdb, and then
    try to re-create the conditions that caused the crash. You had to know about stack
    traces, and how to run gdb (not an easy prospect), as well as enough about programming
    to be able to read the results of the trace. With Bug Buddy, anybody can submit
    useful bug reports to the GNOME bug tracking system.


    The more users discover to crash GNOME applications and the desktop environment
    itself, and the more bug reports that are submitted, the more stable GNOME will
    become in the future. Don''t be shy about submitting a'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'bug report because you think it''s probably a common problem that has already
    been reported. One of the ways the core GNOME hackers decide on which bugs to
    fix is the number of bug reports that a particular bug gets.


    As the übergeru Eric Raymond said, “Given enough eyeballs, all bugs are shallow.”


    # # Requirements for Bug Buddy


    You must have the following software installed to use Bug Buddy:


    +   - gnome-libs (1.0.53 or later recommended)

    - libglade (0.5 or later required)

