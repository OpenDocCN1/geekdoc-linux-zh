  md: '# GnoRPM Preferences


    GnoRPM includes a detailed Preferences dialog box, in which you can set the many
    options that are available in the command line version of rpm. There are also
    many preferences specific to gnoRPM and rpmfind. The following sections describe
    the Preferences dialog box''s option tabs (see Figure 13.6).


    # Behavior Preference Tab


    The Behavior tab lists the options that you can choose when using the rpm command.
    These options are derived directly from command line options. A pop-up tooltip
    naming the command line option appears over each Preferences option. Some of the
    important options are:


    +   - No Dependency Checks—When installing or uninstalling a package, gnoRPM will
    not provide a list of packages that depend on the package you want to install.
    This option is useful if you are upgrading two packages that depend on each other,
    for example, gtk and gtk-devel. If you need to, review the information on dependencies
    in Hour 2. We will address dependencies in Hour 22, “Upgrading GNOME and Joining
    the GNOME Project"


    +   - Upgrade Options—These options control the difference between the Upgrade
    and Install commands. If none of the options are checked, Upgrade behaves the
    same as Install. The Upgrade options are


    +   - Allow replacement of packages instructs gnoRPM to install the package, even
    if the package has already been installed. This option is useful if you think
    the original package is broken, or has been corrupted.


    +   - Allow replacement of files enables a package to be installed if the files
    in conflict with files already installed from another package. The files from
    this package will replace the files that belong to the other package that is already
    installed.


    +   - Allow upgrade to older version enables you to upgrade a newer package with
    an older package. These options are particularly useful if you upgraded a package
    and find later that it kills a dependency on a file needed from the older package.


    +   - Keep packages made obsolete instructs gnoRPM to keep a package in the rpm
    database even if the package has been made obsolete by another package.


    +   - Database Options—These options are useful for testing dependencies and updating
    your rpm database.'
