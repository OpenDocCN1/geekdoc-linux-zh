  md: '# Anatomy of a GNOME Application


    From a user perspective, the GNOME libraries add to the GNOME experience, because
    everything looks and behaves the same way. Rather being a patchwork quilt of utilities
    and applications for which you might have to learn 10 different printing dialog
    boxes, every dialog looks the same for every application. Standards also make
    GNOME more competitive among the commercial interfaces as well. In addition, the
    applications use less memory. Instead of each function being loaded into memory
    when you open an application, the shared library is loaded, and each application
    that it needs is referred to the library. Application development happens more
    rapidly, better applications are produced, and the whole project advances. Users
    get better applications and new releases faster, because developers can concentrate
    on the application itself, not the user interface.


    The GNOME libraries, divided according to functionality, are


    +   - Libnome

    - Libgnomeui

    - Libgnor


    # Libgnome


    Libgnome provides functions for launching applications, identifying application
    MIME types, storing metadata, and loading and saving configuration files. In Hour
    6,"GNOME Under the Hood,"you learned about desktop. The configuration loading
    function from libgnome uses the desktop files to set up your desktop. Another
    function from libgnome finds the standard GNOME file locations. Developers using
    a toolkit other than GTK can use some functions in libgnome to make their work
    with GNOME. Libgnome also contains interfaces to interact with, non-GNOME libraries,
    such as esound.


    Some examples of utilities and functions that can be found in libgnome follow:


    +   - gnome-config is a script that helps compile GNOME applications.

    - gnome-exec launches applications.

    - gnome-mime identifies MIME types.


    # Libgnomeui


    Libgnomeui is a toolkit that contains user widgets for GNOME applications. The
    library imposes standards on GNOME programmers, so that the interface of GNOME
    applications is consistent. It contains standard pixmap icons for open, closing,
    saving, and other operations, and also has routines that help the developer create
    dialog boxes, the GNOME application framework (GnomeApp), the GNOME canvas (GnomeCanvas),
    and other widgets. Libgnomeui is based on GTK, and the widgets it contains are
    meant to act as an extension of the GTK+ toolkit.'
