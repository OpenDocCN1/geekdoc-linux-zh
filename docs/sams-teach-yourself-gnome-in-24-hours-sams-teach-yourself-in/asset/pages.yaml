  md: '# BOSTON PUBLIC LIBRARY

    Copley Square

    Boston MA 02116

    Teach Yourself GNOME in 24 Hours


    # What you should already have to get the most out of this book...


    +   - Familiarity with computer basics, including using a mouse, entering commands
    with a keyboard, and printing a document on a printer

    - Basic skills in Linux, such as logging in and out of your user account, manipulating
    files, navigating through the directory tree of your system, and entering commands
    at a shell prompt

    - Familiarity with graphical user interfaces (GUIs), such as menus, dialog boxes,
    check boxes, and scrollbars

    - Basic Internet skills, such as using an Internet browser, sending email, and
    downloading files using FTP


    # What this book will help you learn...


    +   - How to use the GNOME desktop environment to get the most out of your Linux

    - How GNOME and X work to provide a graphical interface for most of the common
    tasks in Linux/Unix

    - How to find and use the hundreds of applications that are available to use within
    the GNOME desktop environment

    - How to use GNOME and Linux together as a cost-effective, stable, and superior
    alternative to commercial desktop environments


    # Where you may want to go from here...


    +   - Continue your exploration of desktop environments with KDE

    - Learn more about office productivity software that can be run in GNOME, such
    as the GIMP, StarOffice, and WordPerfect for Linux

    - Learn how to program in GTK+ and develop GNOME applications


    # Related Sams titles to look for...


