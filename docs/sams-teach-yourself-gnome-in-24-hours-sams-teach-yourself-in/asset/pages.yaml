  md: '# Common File Manager Tasks


    # Viewing Directory and File Sizes


    When you click a file in File Manager, the size of the file is displayed in bytes
    in the status bar. By default, File Manager displays only the size of individual
    files, not directories. See Figure 9.8 shows File Manager with the size of a file
    displayed in the status bar.


    FIGURE 9.8

    By default, directory sizes do not appear in the status bar.


    ![](img/56ffc05f2012b0375f08095ea492838b_134_0.png)


    If you want to see the combined size of all files in a directory, select the directory
    so that it appears in the active Directory view, and click File, Show Directory
    Sizes. The size of the combined files in the directory appears. If you want to
    check the size of another directory, click the next directory and click Show Directory
    Sizes again. The directory size appears in the lower-left corner of the status
    bar on the File Manager window, where the file size usually appears.


    > Take care when viewing the size of directories at the top of the directory structure.
    Depending on the speed of your system and the number of files in the selected
    directory, it can take a few minutes to calculate the directory size.


    # Finding Files


    File Manager has two search tools to help you find files within your filename.
    The tool Search helps you find a particular file within the active directory.
    The tool Find File can locate anywhere in the file, by either the filename or
    a string of characters, such as a word or phrase, within the file. Find File is
    similar in function to the shell commands find and grep.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Search


    To open Search, from the Edit menu, click Search. The word Search: appears in
    the bottom-left corner of the status bar, as shown in Figure 9.9. Click the status
    bar and type the first character in the name of the file you are searching for.
    For the first item in the active directory that begins with that character is
    selected.


    9.9


    If no items in the active directory match your search, the character you type
    will not appear next to Search: in the status bar.


    ![](img/56ffc05f2012b0375f08095ea492838b_135_0.png)


    Search—


    > Search is sensitive, so be sure that you type the correct case of the letters
    in the filename.


    Search highlights the first file or directory that contains the character you
    typed. The search can be as specific as you like. You can enter just the first
    letter or two of the file you are looking for or the entire name.


    If no character appears in the status bar when you type it into Search, that means
    that there is no file or directory in the active directory that begins with that
    letter.


    End the search by leaving the directory, selecting the file you were searching
    for, or using the arrow buttons or mouse to navigate away from the highlighted
    file. To start a new search, click Edit. Search again.


    # Find File


    File Manager has a more powerful tool, Find File, that enables you to search for
    files over your entire filename, not just in the current active directory.


    Using Find File is very simple. Open Commands, Find File and enter the directory
    where you want to start your search. You can also enter a word or phrase if you
    are not sure of the actual filename. If your search takes too much time, use Suspend
    to end the search and narrow the search parameters. Find File is illustrated in
    Figure 9.10.'
