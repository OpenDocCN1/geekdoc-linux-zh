    # Uninstalling Binary Packages from the Command Line


    GnoRPM is useful for people who prefer a graphical interface, but you can also
    uninstall GNOME binary packages from a shell prompt. To uninstall a package, use
    the rpm command with the -e switch, for instance:


    ```

    rpm -e [package].rpm

    ```


    There are a few options available if you uninstall from the command line, ones
    that are not yet available in GnoRPM. Some options are sometimes useful when uninstalling
    are as follows:


    +   --allmatches


    ..allmatches is useful if you (or think you might have) more than one version
    of a particular package installed. Using this option will remove all versions
    of the package you specify, as follows:


    ```

    rpm -e --allmatches

    ```


    If you have more than one package, and you do not use this option, you will get
    an error message when you try to uninstall.


    +   --nodeps


    With the --nodeps option, the package manager will uninstall the package without
    checking dependencies first. This option is useful if you are uninstalling with
    the intention of re-installing a package immediately afterwards, to troubleshoot
    a problem or test an rpm, for instance


    +   --test


    If you don''t really want to uninstall but want to see what would happen if you
    did, use the --test option. Try this option if you want to test for dependencies.
    Use it with the -v or -vv (verbose or very verbose).'
