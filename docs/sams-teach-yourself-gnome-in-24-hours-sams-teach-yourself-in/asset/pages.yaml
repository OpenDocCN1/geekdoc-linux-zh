  md: '# 1 HOUR


    # Introducing GNOME


    Once upon a time, there lived a young programmer named Miguel, who lived in the
    computer dungeons of a university in the middle of a vast, dusty city. Miguel
    loved the new operating system called Linux that he had been working with, and
    decided that it would be wonderful if ordinary people all over the world could
    enjoy it too, without having to undergo the strenuous and fearsome initiation
    rites into the ancient and secret brotherhood of UNIX hackers. He decided to create
    a special key to unlock the secrets of UNIX. The key was called the GNOME desktop
    environment. The world would never be the same again...


    Welcome to the wonderful world of the GNU Network Model Environment, or GNOME.


    In this hour, you will


    +   * Explore the basics of the GNOME desktop environment.

    * Review a brief history of the GNOME Project.

    * Learn about the GNU Project and the free software movement.

    * Look into the future of GNOME.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'GNOME is a simple, easy-to-use graphical interface to UNIX-like operating systems,
    particularly Linux. It uses point-and-click and drag-and-drop to the tasks that
    previously required an encyclopedia of text-based commands. GNOME has many faces
    and appearances. It can make your desktop applications change color, shape, and
    form as often as you change your clothes. Eventually it will have a cadre of applications
    more powerful and more customizable than—and as easy to use as—the most expensive
    office productivity suite in existence. And every piece of software, every line
    of code, is completely free.


    # The GNU Network Model Environment = GNOME!


    UNIX can be arguably the world''s most powerful operating system. Its true multitasking
    capability, infinite configurability, network transparency, power, and stability
    have made it the world''s most widely-used operating system. For the ordinary
    desktop computer user, however, it can be unwieldy and impossibly difficult to
    use. There is so much syntax to learn, so many arcane commands to remember, so
    many ways of doing the same function, that simply learning the basics of UNIX
    is a task that most people in the everyday world could, not to mention many computer
    professionals, cannot imagine undertaking.


    Not only is the operating system itself difficult to learn, the thousands of applications
    that run on UNIX, also tend to be difficult to learn and use.


    With the advent of Linux and the GNU Project—whose aim was to bring the power
    of UNIX to the masses in the form of free software—millions of non-technical people
    all over the globe being introduced to UNIX.


    Until very recently, the problem of Linux''s usability remained. Another problem
    slowing the spread of Linux has been the scarcity of everyday, user-level desktop
    applications. The GNOME Project was conceived to make UNIX an easy and logical
    choice for desktop computing. Figure 1.1 shows the GNOME footprint, which is the
    symbol for the GNOME Project.


    # Figure 1.1


    The GNOME footprint, designed by Tigert, symbolizes the GNOME Project.


    ![](img/56ffc05f2012b0375f08095ea492838b_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '+   - Create an intuitive, full-featured, easy-to-use desktop environment to
    provide a graphical interface for the Linux operating system.

    - Provide point-and-click and drag-and-drop alternatives to the traditional text-based
    UNIX interface.

    - Develop a suite of applications that have a consistent, recognizable look and
    feel and are inter-operable.

    - Develop a powerful, logical, and conceptually simple framework to encourage
    and simplify further application development.

    - Create a suite of applications for the desktop computer, including ones for
    word processing, graphic art, spreadsheets, database processing, and Internet
    and Web use.

    - Design a desktop that can be configured on-the-fly by the user, with no programming.
    This means that a user can change the entire look and feel of her desktop at any
    time, while programs are running, by using a few simple tools.

    - Achieve all these goals with free software.


    # A Brief History of the GNOME Project


    ![](img/56ffc05f2012b0375f08095ea492838b_32_0.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'At the time, considerably advanced projects were already underway to develop
    desktop environments for Linux, including KDE. Unfortunately, these desktops widget
    sets that came with licensing restrictions. Since the GNU project was designed
    to contain only free and unrestricted software, the restrictions made the desktops
    unusable.


    The members of the GNU Project decided to create a new desktop environment from
    scratch. With support from Red Hat Software, Miguel de Iaza and a group of volunteers
    began to create a desktop system that would take GNU permanently out of the realm
    of geeks and into the reach of ordinary desktop users. Thus, the GNOME Project
    was founded in 1998.


    The goal of the GNOME Project was to create a desktop environment for the GNU
    Project based entirely on free software. In March 1999, the GNOME Project released
    version 1.0 of GNOME. In October 1999, the second official release of GNOME was
    announced. Officially version 1.5.3, it is commonly called October GNOME. October
    GNOME fixed many major bugs and provided improved documentation and tighter code.
    GNOME 2.0 should be released in the first quarter of 2000.


    # # Free Software and the Free Software Foundation


    GNOME came into existence because of a desire for free software, so it is worth
    looking at exactly what the term *free software* means. The GNU Project''s definition
    of free software is as follows:


    +   * The freedom to use the program for any purpose that you want

    * The freedom to examine and study the inner workings of the program, and change
    it to suit your needs

    * The freedom to distribute as many copies of the program you want to whoever
    you want

    * The freedom to make improvements to the program, and to make those improvements
    public


    Free software does not necessarily mean software that doesn''t cost anything,
    although most GNU software costs nothing to download and use. The fundamental
    argument of the GNU Project and the Free Software Foundation is that software
    should be freely available to anybody who wants it, and that users of the software
    should be completely free to use, study, modify, and give away the software without
    restriction.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Introducing GNOME


    Free software differs in a fundamental way from open source software, although
    the terms are often used interchangeably. Open source is a slippery term that
    can mean the exact thing as free software, or it can have an insidiously different
    meaning. Open source means nothing more than the user can look at the source code.
    Open source software does not always let you modify the software for your personal
    use without notifying an author mentioned in the software license. It is not always
    freely distributable. As the term open source becomes a media buzzword, it is
    important not to confuse the concept with free software.


    ![](img/56ffc05f2012b0375f08095ea492838b_34_0.png)


    # Copylefting


    GNOME software is “copylefted” with the GNU General Public License (GPL) and the
    GNU Lesser General Public License (LGPL). These licenses are away of copywriting
    which guarantees that the GNOME software will always be freely distributable.
    Not only is GNOME copyleft, but any software that is made using GNOME tools or
    is derived from GNOME is also freely redistributable.


    # GNOME and KDE


    KDE is the other major desktop environment that was created specifically for Linux,
    and it shares many of the same features as GNOME. There are some basic differences
    in design and concept.


    GNOME was originally created in response to some controversy around the widget
    library Qt, which was in KDE. Owned by Troll Tech, the proprietary software comes
    with a license that is, for the most part, unrestricted. Troll Tech does require
    users to forward to the company any modifications of the software. The members
    of the GNU Project felt that this policy violated the tenets of free software,
    and so the GNOME Project was born.


    On the programming level, there are some basic design differences between KDE
    and GNOME. KDE is written in C++, and application developers are restricted to
    C++. GNOME uses CORBA technology, which enables GNOME applications to be written
    in any language for which there is a language binding.


    > The GNOME Frequently Asked Questions on the GNOME Web Site has an excellent
    user-level explanation of CORBA, and how it relates to the GNOME architecture.
    See http://www.gnome.org/gnomefaq/html/x703.html.


    ![](img/56ffc05f2012b0375f08095ea492838b_34_1.png)'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'GNOME uses the GIMP ToolKit, GTK, as a widget library. One of the great advantages
    of GTK is the use of themes to change the appearance of desktop displays. KDE
    is more restricted in the look and feel of the desktop and applications.


    Members of the GNOME and KDE projects work in friendly competition; there''s even
    a mailing list where developers can hash out compatibility issues. You can have
    both GNOME and KDE installed on your computer and switch between the two, depending
    on your mood.


    # # The Future of GNOME


    The major goals for GNOME in the immediate future are greater configuration and
    customization, improved user interfaces, and more user-level documentation. Specifically,
    developers are currently working towards the following goals:


    +   * The ability to configure and customize every aspect of the desktop, including
    applications, via simple utilities that require no programming or recompiling.

    * Themes that affect the entire desktop, not just applications that run on the
    desktop.

    * Integration of GNOME productivity applications with Palm Pilot software.

    * A new file manager based on an asynchronous, network-transparent virtual file
    system.

    * Greater customization of the GNOME Panel. You will be able to place the panel
    anywhere on the desktop, not just around the edges. You will also be able to completely
    control the size of the desktop panel.

    * The capability to support every language in the world, including Klingon!

    * The portability of GNOME applications to Windows and BeOS.

    * An improved user interface with the creation of the GNOME User Interface Team.

    * Creation of an office productivity suite of free software, fully comparable
    to (and probably superior) currently available proprietary office software suites.


    # # Summary


    In this hour, you were introduced to the GNU Project and GNOME Project. You learned
    about free software, and its importance in the creation of GNOME. You learned
    about the difference between GNOME and KDE, as well as the goals of GNOME, and
    you took a peek into the near future of GNOME.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Introducing GNOME


    # Q&A


    I just want to learn how to use GNOME to do my everyday tasks at work. I’ll never
    modify source code; I don’t even know what source code is. Why should I care about
    free software?


    If the concept of free software spreads to the mainstream and becomes the norm,
    the proliferation of custom software will grow exponentially, changing the entire
    concept of intellectual property and technology as we know it. This is a matter
    that concerns everybody.


    Can I run programs that are not GNOME within the GNOME desktop?


    You can run any program that you want within GNOME. Programs do not need to be
    GNOME-compliant, or even have anything to do with GNOME, in order to run within
    the GNOME desktop.


    # Workshop


    The quiz questions and exercises are designed to increase your understanding and
    to encourage you to continue experimenting. Answers appear in Appendix B, “Answers.”


    # Quiz


    +   1. What is the difference between free software and open source software?

    2. What larger project is the GNOME Project a part of?

    3. What is the basic goal of GNOME?


    # Exercises


    +   1. Explore the GNOME Web Site at http://www.gnome.org.

    2. Read the December 14, 1999 article “GNOME: Its Current State and Future” online
    at Linux Today, http://linxtoday.com/stories/13678.html, for a detailed look at
    the future of GNOME.'
  merge: -1
