  md: '# GNOME Under the Hood


    Unless you really know what you are doing, it is important that you do not manually
    edit these files. The files are created automatically by the applications, and
    the information is written in a strict format so gnome-config can read it. If
    a config file in the share directory is broken, then no user will be able to run
    the application.


    Compare the sample .desktop file syntax that follows the Properties for an application
    in Figure 6.6. Notice that the Name, Comment, Exec, Exec, and Type entries in
