  md: 'For GNOME, the best place to begin looking for help (besides this book) is
    The GNOME User’s Guide, the GNOME FAQ, and the GNOME help files. Both are listed
    on the main page of the GNOME Help Browser.


    # The GNOME User''s Guide


    The GNOME User’s Guide is the basic manual for getting up and running with GNOME.
    Written by David Mason and David Wheeler, The GNOME User’s Guide is sponsored
    by Red Hat. It is continually updated as new versions of GNOME are released and
    the need for documentation for a particular subject is addressed. Although it
    does not include everything you need to know in order to use GNOME, it is an excellent
    starting point and reference.


    # The GNOME FAQ


    The GNOME FAQ answers potential questions about material that The GNOME User’s
    Guide does not address, such as the history of the Project, installation and configuration
    of GNOME, and the basic theory behind GNOME. Many of the FAQ questions will eventually
    be addressed with tutorials and more comprehensive manuals.


    # Other GNOME Help Documents


    Unfortunately, one of the weaknesses of an-volunteer project is that the contributors
    tend to focus on what interests them, rather than on what is needed. In the case
    of GNOME, that tendency has resulted in a broad spectrum of clever and useful
    applications that have very little documentation accompanying them. The GNOME
    Help Browser lists all the help files that come with applications. As you can
    see from Figure 21.5, the list is short. As we will see in the next section, the
    situation is improving rapidly.


    # The GNOME Documentation Project


    GNOME has lagged in good documentation, which is why the mailing list is so popular.
    This problem is being aggressively pursued, with the formation of the GNOME Documentation
    Project. The Project currently has a Web site that lists items that must be written.
    Soon there will be a list of all GNOME applications, with the name of the developer
    of the application to see whether there is documentation in progress for the app
    you are interested in, and will be able to comment on the document as it is posted.
    The home page of the GNOME Documentation Project is http://www.gnome.org/gdp.'
