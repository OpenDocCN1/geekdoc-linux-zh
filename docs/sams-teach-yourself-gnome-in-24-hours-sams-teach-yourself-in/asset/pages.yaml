  md: 'Although X and user interfaces have been around for several years, before desktop
    environments such as GNOME and KDE arrived, there was not a standard interface.
    Every X application had different standards for windows, dialog, printing, nomenclature.
    GNOME takes the advances made by other desktop environments a few steps further.
    Not only is GNOME a clever and attractive desktop environment. it is also a set
    of integrated applications. Most important, it is a collection of application
    development tools to help developers quickly and easily add to the spectrum of
    GNOME applications. GNOME programmers a consistent and rich API that gives all
    programs a consistent and customizable look.


    At the center of all this integration and componentization is the Common Object
    Request Broker Architecture, or for CORBA.


    # CORBA


    CORBA makes it possible for applications to communicate across any spectrum. It
    doesn''t matter where the applications are physically; they can be on the local
    machine, or they can be on a network. It doesn''t matter what programming language
    the applications are written in. It doesn''t even matter what operating system
    the applications are, as as long as there is a CORBA interface written for them
    that enables them to communicate.


    With CORBA, you can


    +   - Use a separate, independent application as a function. or engine, inside
    another application to perform a task. For example, the CD player app in the GNOME
    panel calls whatever CD player application is installed via CORBA.

    - Control one application remotely from another application.

    - Create compound documents. A compound document is one file that contains several
    format files, because it has created using several different applications, connected
    through CORBA interfaces. For example, you can have a document that contains a
    spreadsheet, word text, and graphics.

    - Embed documents inside one another, and edit any part of the document. For example,
    if you embed a flowchart inside a word processing document, you can edit the flowchart
    inside the word processing document. When you click the flowchart, the flowchart
    application is remotely opened within the word processor application. so you can
    edit the flowchart. When you are finished editing the flowchart, the word processing
    application closes the flowchart application.'
