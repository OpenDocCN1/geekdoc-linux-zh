  md: '# Hour 11


    > If you have a virtual screen resolution that is larger than your actual physical
    screen size, when you select Scaled, the image will scale to the virtual screen
    size.


    ![](img/56ffc05f2012b0375f08095ea492838b_167_0.png)


    As you learned in Hour 10, Enlightenment also has a background configuration tool.
    If you prefer to use Enlightenment Desktop Background Settings to select a background,
    then select Disable Background Selection in the GNOME capplet before you select
    your background using Enlightenment.


    # Screensaver


    GNOME comes with dozens of screensavers to choose from. Highlight the screensaver
