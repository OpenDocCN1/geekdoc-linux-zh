- img_proc: true
  md: 'One of the advanced features of GNOME Calendar is its set of alarms. When you
    create a new appointment, you have several alarms to choose from to ensure that
    no one will miss the appointment.


    The alarm dialog box contains audio, visual, and customized alarms, but it also
    has an email feature for you to email reminders. For example, you could send automatic
    email reminders to team members about the upcoming meeting two days before the
    event. Then you could set up a display reminder for yourself 15 minutes before
    the event and an audio alarm 5 minutes before, and finally a .wav file of your
    mother yelling at you 1 minute before the event.


    An appointment can also be classified public, private, or confidential. You can
    also set up recurring appointments on a daily, weekly, monthly, or yearly schedule.
    Enter the dates of the recurring appointment or make it continue forever. You
    can also enter exceptions, which are dates on which the recurring appointment
    should be skipped.


    With GNOME Calendar, you are not limited to an 8:00 a.m. to 6:00 p.m. day. In
    Preferences, you can decide whether you want a 24-hour calendar or a 12-hour or
    you can specify the exact times your calendar will begin and end. This feature
    is useful if you''re not a 9-to-5 kind of person.


    You can customize all the calendar colors, empty days, days that have appointments,
    a highlighted day, the current day, and a day that contains an overdue To item.
    You can also customize your To Do list to annotate overdue items.


    GNOME Calendar comes with a thorough user manual, and GNOME Calendar—one of the
    few applications included in The GNOME User''s Guide.


    # GNOME Address Book


    GNOME Address Book works as both a contact management system and electronic business
    card database, similar to Act, Goldmine, or Franklin-Covey Planner. When you open
    Address Book, all your contacts are listed in the window with columns of information
    that you can customize in Preferences. Press New to make a new entry in the address
    book. The main window of Address Book is shown in Figure 18.5.


    The New Entry dialog box contains fields to enter name, organization, and birthdate
    of your contact. You can enter as many addresses as you like, including information
    on the kind of email address, for example, AOL, Prodigy, IBM, AT&T, MCI, Internet,
    and so on. There is also a field to include a URL for the Web page.


    In the Addresses and Phone tabs, there are spaces to enter multiple addresses
    and phone numbers for the contact, with checkboxes to enter the kind of address
    or phone number. In the geographical tab, you can enter the contact''s latitude,
    longitude, and time zone. GNOME Address Book supports PGP and X.509 public key
    encryption.'
