    # Summary


    In this hour, you configured GNOME and Enlightenment for sound. You played music
    on the GNOME CD Player, and downloaded the CD track titles from CDDB. You also
    played some GNOME games and learned where to find more GNOME games.


    # Q&A


    +   Q I installed a driver for my sound card, recompiled the kernel, and enabled
    sound in GNOME, but I still don''t get any sound! What can I do?


    +   A It is not easy to configure your system for sound. It often involves editing
    configuration files manually, and sometimes you also need to recompile the kernel
    manually. You might also have an IRQ or I/O conflict with another device. If the
    Sound HOWTO looks too daunting, try http://www.opensound.com. OpenSound is a commercial
    business that sells sound drivers for Linux, some of which work with sound cards
    that are not supported by freeware. You can download an evaluation copy of a driver
    for free.


    +   Q If you are getting sound in Linux applications but not GNOME, reinstall
    the esound and gnome-audio packages, and make sure that sound is enabled in your
    window manager.


    +   Q Are there other games I can play in GNOME besides those listed in the GNOME
    software map?


    +   A You can play any game that works within an X session, including KDE games.
    Most flavors of UNIX/Linux come with a set of games by default. Check your directory
    tree for a games subdirectory, such as /usr/share/games or /var/lib/games.


    +   Q Are there networked games for GNOME?

    A A are several games designed for multiple players who play via a server. Although
    many games are still in development, some are in very advanced stages. Some examples
    are Batalla Naval, a battleship game; Gnocatan, which is based on the Settlers
    of Catan board game; Mystic Arena III; and Quest.'
