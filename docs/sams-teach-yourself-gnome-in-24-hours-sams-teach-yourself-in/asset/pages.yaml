    # Uninstalling GNOME using GnoRPM


    To install a package, open GnoRPM from Main Menu. System, GnoRPM. Find the package
    you want to uninstall in the GnoRPM rpm list, and click Uninstall. The package
    is uninstalled. Repeat this process for each package, in the preceding order.
    GnoRPM is shown in Figure 21.1.


    Figure 21.1 GnoRPM, also called GNOME RPM, is the GNOME graphical interface for
    rpms.


    ![](img/56ffc05f2012b0375f08095ea492838b_314_0.png)


    If you use the recommended order for installing packages, you will not have any
    problems. However, if there are applications or other packages that the package
    you want to uninstall, will get a dependency error. It is similar to the error
    you get when you want to install a package that requires other packages to be
    installed. Figure 21.2 shows an example of a dependency error. If you get a dependency
    error, determine whether you want to uninstall the other packages as well. If
    so, uninstall the packages listed in the error message, uninstall the original
    package. If you do not want to uninstall the packages listed in the error message,
    then you should keep the original package on your computer.'
