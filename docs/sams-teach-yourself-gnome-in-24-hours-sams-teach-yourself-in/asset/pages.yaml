  md: 'When moving a launcher or another item on the panel, if I drag the launcher
    too close to another launcher or drawer, it “jumps,” to another place on the panel.
    How do I prevent this from occurring?


    The GNOME Panel is divided into square regions called tiles. If an item isn''t
    fixed to a particular tile, then the items will moved relative to each other instead
    of to the panel. To keep the location of items on your panel absolute, go to Global
    Panel Properties and check Fix Tiles. This will enable you to move each tile independently.


