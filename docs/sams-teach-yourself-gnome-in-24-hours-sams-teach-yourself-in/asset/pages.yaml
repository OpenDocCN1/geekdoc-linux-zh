  md: '# Using Filters


    A filter does exactly what the name suggests—it filters out from view the files
    that you don''t want, so that you can more easily see the files that you want.
    Filters are useful when you want to work with certain kinds of files, for example,
    files with certain extensions, or when you are looking for files in a large directory.
    By default, File Manager comes with one filter, Show All Files.


    Create your own filters by selecting Layout, Filter View. Enter the filter you
    want to use in the Set Filter dialog box. You can use shell metacharacters, also
    called wildcards, such as those listed in Table 9.1.


    Table 9.1 Wildcards to Use in Filters

    | Wildcard | Description |

    | --- | --- |

    | * | Matches any number of characters |

    | ? | Matches any character |

    | [x-z] | Matches a range of characters |

    | [xxx] or [xxx] | Matches a list of characters |


    For example, [AaBbCc].txt matches any files with the extension .txt and begin
    with the letter A, B, C, a, b, or c. Alpha*.sgml matches every file or subdirectory
    begins with the string "Alpha". [a]* displays every file and subdirectory except
    those that begin with "a".


    > See the ed man page for more information on forming expressions.


    After you set a filter, it remains in effect for the entire filename until you
    change it or restore to the default. To restore from Filter view, open the filter
    dialog box at Layout, Filter View and click Show All Files. A sample filter is
    illustrated in Figure 9.16.


    # Figure 9.16


    Use shell metacharacters to apply filters to your active directory.


    ![](img/56ffc05f2012b0375f08095ea492838b_141_0.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# The Virtual File System


    A virtual filename makes it possible to access remote filenames as if they were
    local. The Virtual File System, or VFS, is responsible for File Manager’s capability
    to open tarred and compressed files and to enable you to manipulate files within
    the tarball without untaring and decompressing. File Manager uses several kinds
    of virtual filenames to access different systems, but all the filenames appear
    in the File Manager window to be one interface.


    Some of the common file systems are


    +   - The local file system, which is used to access the files on your computer.

    - ftfpss, which enables you to manipulate files on a remote computer connected
    via ftp.

    - tarfs, which is used to open work with files that are tarred and compressed
    into a tarball. You can open, edit, copy, and delete files within the tarball
    without untaring and decompressing.

    - mcsfs, which you can use if you are running the mcserv program. mcsfs, the Midnight
    Commander network file system, lets you work with files on a remote computer as
    if they were on your local computer. The remote computer must also be running
    mcserv. mcserv can be downloaded from the GNOME ftp site at http://ftp.gnome.org/pub/GNOME/stable.


    ![](img/56ffc05f2012b0375f08095ea492838b_142_0.png)


    # Viewing Compressed and Archived Files


    When File Manager looks inside and displays the files included in a tarred (archived)
    and zipped (compressed) file, it is using the Virtual File System to set up virtual
    directories in your directory tree.


    Open a tarred or archived file in the same way as you would a regular file, either
    by clicking Open on the File menu, double-clicking the file, or right-clicking
    and selecting Open. The tarred files inside the tarball will appear in the active
    directory window as distinct, separate files. You can open this files and make
    changes to them without untaring and decompressing the tarball. If you want to
    untar the tarball, click Extract from the right-click menu.


    # Summary


    In this hour, you learned how to customize the GNOME File Manager, and to use
    GNOME File Manager to perform common system administration tasks. You used several
    different methods for selecting files and used filters to display files. You copied,'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'deleted, moved and renamed files using File Manager. You learned some common
    uses for drag-and-drop. You learned two methods, Search and Find File, for searching
    your directory tree for files. You learned about symbolic and hard links, and
    how symbolic links are annotated in File Manager. You viewed the properties of
    a file. You learned how to change the permissions for files. You also learned
    how File Manager uses a virtual file system to manage remote, archived, and compressed
    files.


    # # Q&A


    +   - How can I fix a stalled symbolic file?

    - If you can determine what the original target file was, right-click the stalled
    symbol, select Edit Symlink, and enter the target filename. If you cannot recover
    the original target file, delete the symbolic link.

    - I find File Manager to be cumbersome and slow. Do I have to use it GNOME?

    - Although you don''t have to use the File Manager window interface to manipulate
    files, gmc, which is the underlying file manager, is central to the operability
    of GNOME. And yes, it is cumbersome and slow. A completely new file manager Nautilus
    is being developed to replace gmc. Nautilus will have much greater functionality,
    particularly over networked systems, and will be easier to use gmc. Nautilus will
    be released with GNOME 2.0.


