    The Object Management Group, or OMG, controls CORBA. For more information on OMG
    or CORBA, visit the OMG Web site at http://www.omg.org.


    # ORB


    The Object Request Broker (ORB) makes it possible for two applications to communicate—sort
    of a middleman, then it is called middleware. An ORB defines and regulates the
    client/server relationship between two objects. The objects can be hardware and
    software, two applications, an application and a script, an application and a
    function, and so on.


    ORBit is the CORBA implementation that is used for GNOME. Small and lightweight
    at only 30KB in size, ORBit was written from scratch specifically for GNOME. Figure
    23.1 illustrates the relationship between two objects and the ORB.


    FIGURE 23.1

    The Object Request Broker enables two objects to communicate and interact with
    each other.


    ![](img/56ffc05f2012b0375f08095ea492838b_340_0.png)'
