  md: '# Bonobo


    The means by which reusable software components are strung together in GNOME interface.
    Bonobo is a CORBA interface, written in the CORBA Interface Definition Language.
    Bonobo provides standard interfaces for components, so they will fit together
    in any combination. The result is that any component that has been designed within
    the Bonobo architecture will fit with any other component.


    A rough analogy for this architecture is a LEGO® set. The pieces are of different
    shapes, sizes, and colors, but they all fit together because they have little
    holes and handles that fit inside each other. The holes and handles are CORBA.
    To make all the LEGO pieces that are fitted together into a cohesive whole, you
    need the handles and handles to be the same size, designed to fit into one another
    in any combination. That’s Bonobo. In short, you have a ready-made bag of tricks
    for creating some very interesting software.


    The point of Bonobo is to keep an application as simple and small as possible.
    Greater functionality and complexity is achieved by stringing the small components
    together using CORBA, not by creating a gigantic hierarchical application. Applications
    are designed as shells that hold strings of components, rather than a hierarchical
    program with functions.


    Bonobo enables developers to use components without knowing anything about the
    internals of the application. Instead of wasting time reinventing the wheel, try
    to understand and integrate different functions, or trying to port a component
    from another language and another application, the developer can simply use the
    component without knowing what it requires and what it does. The component doesn’t
    even have to be written in the same computer language as the application the developer
    creates. All this is achieved by CORBA.


    # Language Bindings


    As discussed in the last section, one of the raisons dêtre for CORBA is the ability
    to concurrently use programs that were written in different languages. For this
    to be possible, you need some kind of wrapper around each program that will enable
    the programs to communicate. The wrapper for programs in different languages is
    called a language binding. Most of GNOME and GTK is written in C. Language bindings
    make it possible to use code that is written in another programming language within
    the GNOME universe.


    Language bindings also make it easy for a user to create tasks within GNOME. With
    language bindings, the user can write the script in their favorite scripting language,
    instead of relying on C. GNOME and GTK have many language bindings because they
    were designed with scripting in mind.'
  merge: -1
