- img_proc: true
  md: 'If you really want to learn by doing, consider maintaining two separate computers
    or partitions, both running Linux and GNOME. One can be your production system,
    where all your important files are kept, and the other is the test system, where
    you see how many ways can mess things up. Since GNOME is a work in progress, you
    can actually help a lot by seeing how many ways you can crash an application and
    submit bug reports to the GNOME project.


    We will now explore some of the shared and user-specific parts of GNOME.


    # GNOME Libraries


    GNOME applications are fast because they make use of shared libraries. The libraries
    are collections of mini-programs called functions, that are used over again by
    different GNOME programs. The libraries are stored in a central location, so that
    every GNOME program knows where to look for a function or an library that it needs.
    When the GNOME program needs a function, it is entered into memory. Then, if another
    GNOME program needs the same function and it is already activated, the other program
    just goes and gets it from memory to use it. GNOME libraries are usually kept
    in /usr/lib or /usr/local/lib. Different users running GNOME at the same time
    might make use of the same library, or two different different applications can
    use the same library. You will learn more about GNOME libraries and functions
    in Hour 24. "Anatomy of a GNOME Application."


    # GNOME Executable Files


    In Linux, applications are run by programs called executable files. When you install
    an rpm, the libraries that the application needs are copied to /usr/lib or /usr/local/lib,
    and the executable file or files are copied to /usr/bin or /usr/local/bin. If
    you want to see the entire collection of executable files on your system, poke
    around your executable file directory. If you wanted to, you could start any GNOME
    application by typing the executable file at a shell prompt in xterm. Figure 6.1
    shows a list of GNOME commands in the /usr/bin directory.


    Commands and executable files that are central to a UNIX system are kept separately
    in the /bin directory. Such commands include ls, cd, cp, and so on.'
