    # Using Track Editor


    Use the Track Editor to enter the title of the CD and the titles of each track.
    You can either enter the track manually or by the CD Player search a free database
    called CDDB, for CD Database. CDDB will download the titles of your CD tracks
    automatically, so you don''t have to type them.


    # Using CDDB to Automatically List CD Tracks


    The CD Player connects to the CDDB automatically whenever you play a new CD. CDDB
    contains the titles and track listings for hundreds of thousands of CDs, and users
    submit more than 100 new titles to the database every day. See http://www.cddb.com
    for more information on CDDB.


    After inserting a CD, wait three five seconds for the CD Player to connect to
    CDDB. If your CD is listed in the database, CDDB will automatically download the
    track titles to your personal CD database. The track titles will automatically
    appear in the CD Player window every time you play that. If CDDB does not download
    the track titles, then either the CD Player cannot get a connection, or CD is
    not listed in CDDB. Click CD Status, and then Get CDDB Now. Figure 20.6 shows
    the Track Editor.


    FIGURE 20.6


    Use the Track Editor to manually enter track tracks for your music CDs.


