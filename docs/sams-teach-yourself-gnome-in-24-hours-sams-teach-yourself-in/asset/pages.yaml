  md: '# HOUR 10


    # # Exploring Enlightenment


    Enlightenment is most complex, powerful, and flexible X window manager available
    today, as well as the default window manager for GNOME. Written for use with Linux,
    Enlightenment works with every flavor of UNIX. It can be used either in conjunction
    with GNOME or by itself. In fact, the ultimate goal of the Enlightenment Project
    is to make Enlightenment a fully functioning desktop shell. There are many ways
    to use and configure Enlightenment, it almost deserves its own book. But this
    hour, we will merely introduce you to the major features, while keeping our discussion
    GNOME-centric.


    In this hour, you will


    +   - Keep track of open applications with the Enlightenment Iconbox and Pager.

    - Customize your environment with configuration tools in the Enlightenment menus.

    - Use keybindings to manipulate your windows.

    - Communicate with Enlightenment using the Enlightenment External Shell.

    - Solve some common Enlightenment problems and where to get help.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Enlightenment Tools


    When you start Enlightenment for the first time, you will see two small boxes
    on the desktop—the Enlightenment Pager and the Iconbox. These tools perform similarly
    to the GNOME Pager and Desk Guide. Within the GNOME environment they might seem
    redundant; however, many people prefer to their GNOME counterparts. Exercise 1
    gives you the opportunity to compare tools and decide for yourself.


    # Iconbox


    The Iconbox swallows windows that have been identified and displays an icon that
    represents the application or a miniature version of the window that contains
    the application. To reopen an iconified window, click the icon in the Iconbox
    and the window will be raised.


    Figure 10.1 shows an Iconbox that contains four icons. The mouse is placed over
    the GIMP icon, displaying the name of the application in a pop-up.


    10.1

    The Iconbox keeps track of your iconified applications. Use the Settings menu
    to configure your Iconbox.


    ![](img/56ffc05f2012b0375f08095ea492838b_147_0.png)


    When a ToolTip with the name of the application pops up when you place the mouse
    over the icon.


    # The Enlightenment Pager


    The Enlightenment Pager is similar to the GNOME Pager in that it keeps track of
    your active windows. Instead of a list of applications, however, the Enlightenment
    Pager displays miniature versions of the windows. When you place your mouse over
    a miniature window, the name of the application pops up. When you click a miniature
    window in the pager, that window gets the focus.


    To configure the Pager settings, right-click the desktop and select Pager Settings
    from the Settings menu. Figure 10.2 shows the GNOME Pager with the mouse placed
    over a virtual terminal window. The Pager Settings menu is also displayed.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# FIGURE 10.2


    When you hold mouse over an item in the Pager, the window expands. Use the Settings
    menu to configure your Pager.


    ![](img/56ffc05f2012b0375f08095ea492838b_148_0.png)


    # Enlightenment Menus


    There are many menus in Enlightenment, with hundreds of configuration options.
    We will review only a few of the most important menu items in this hour, to give
    you a feel for the kinds of things Enlightenment can do. Experiment with the menu
    options as we discuss them so that you will really understand their functionality.
    Next, with some of the items that are not discussed. Don''t be afraid that you''ll
    break your system; at the end of this hour, you will learn how to recover from
    problems.


    # Main Enlightenment Menu


    The Enlightenment menu is the main menu for all Enlightenment functions. Middle-click
    the desktop to open the Enlightenment menu, shown in Figure 10.3. We will look
    at each of the items in the Enlightenment menu in turn.


    # FIGURE 10.3


    Middle-click the desktop to open the Enlightenment menu. All the Enlightenment
    functions can be accessed from here.


    ![](img/56ffc05f2012b0375f08095ea492838b_148_1.png)'
