  md: '# HOUR 11


    # Customizing Your GNOME Environment


    Virtually every aspect of the GNOME desktop can be customized, from the look and
    feel of the desktop—including font, background, and sounds—to the behavior of
    GNOME applications. Most customizations are done via the GNOME Control Center.
    This hour is short and not difficult to understand, but the information is detailed,
    and there are many instances of practical application.


    In this hour, you will


    +   - Use the GNOME Control Center applets to customize your desktop.

    - Select your default text editor and font.

    - Customize your keyboard, desktop sounds, and mouse behavior.

    - Adjust the look and feel of GNOME applications.

    - Conduct advanced session maagement and reset the session to default values.'
