  md: '# HOUR 7

    Using the Panel and the Main Menu


    In Hour 5, “Exploring the Desktop.” we began to explore the various ways to work
    within the GNOME environment, using Desktop icons, the Main Menu, and the GNOME
    Panel. During this hour we will build upon what we''ve learned to study in greater
    detail the different ways we can use the GNOME environment.


    In this hour, you will


    +   - Use the GNOME Panel to launch applications that you use often. You will
