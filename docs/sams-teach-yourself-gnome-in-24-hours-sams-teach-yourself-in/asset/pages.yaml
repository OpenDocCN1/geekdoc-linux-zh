  md: '# Summary


    In this hour, you were introduced to the GNOME File Manager. You explored the
    File Manager window and learned how to safely close a File Manager window. You
    studied the menus, toolbar, and right-click menu options, and learned how to configure
    File Manager using Preferences.


    # Q&A


    +   - If I use an X terminal or regular shell session to make changes to your
    file system, will the changes show up in File Manager?

    - Any changes you make to your file system will show up in GNOME just as they
    would in another shell. Remember that File Manager is just an interface, and that
    GNOME is just an environment.

    - Can I use the KDE or Enlightenment file manager in GNOME?

    - You can use any file manager or any other application within GNOME. You must
    have gmc running, however if you don''t use the file management part of gmc.

    - My icons don''t appear when I start GNOME, and nothing seems to work right either.
    What to do?

    - If your session was saved incorrectly the last time you logged in to GNOME,
    or if GNOME was set up incorrectly, gmc might not start automatically. If this
    happens, click File Manager from the Main Menu, wait for it to start, then log
    out of GNOME, saving your session.


    # Workshop


    The quiz questions and exercises are designed to increase your understanding and
    encourage you to continue experimenting. Answers appear in Appendix B, "Answers.".


    # Quiz


    +   - 1. What is the relationship between gmc and File Manager?

    - 2. Name two ways to open File Manager.

    - 3. How would you collapse the directory tree in File Manager so that only the
    root (/) directory shows?

    - 4. What information does the status bar contain?'
