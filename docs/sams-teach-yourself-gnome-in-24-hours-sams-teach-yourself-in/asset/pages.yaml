  md: '# gFTP Menus


    The gFTP menus contain all the commands for logging in, downloading, uploading,
    manipulating files, and comparing directories. A short description of each menu
    follows. After you have been introduced to the menus and the components of gFTP,
    each component will be described in detail.


    The FTP menu has check boxes to change between ASCII and binary transfer mode
    and to set options for your remote connection.


    The Local menu lets you navigate, select, and manipulate files on your local file
    system (your hard drive).


    The Remote menu lets you navigate, select, and manipulate files on the remote
    file system.


    In the Bookmarks menu, you can create, edit, and list bookmarks for ftp sites.


    The Transfers menu contains commands for transferring files via upload and download.


    ![](img/56ffc05f2012b0375f08095ea492838b_229_0.png)


    > Upload means to transfer files from your computer to a remote computer, via
    a network connection. Generally, upload implies that the files are transferred
    from a smaller, client system to a larger system, but it is not necessary.

    Download means to transfer files from a remote computer to your computer via a
    network connection. As with an upload, you generally download from a larger server
    system to a smaller, client system.


    The Logging menu contains commands for viewing, saving, and clearing the log and
    message window.


    The Tools menu contains a tool for comparing the remote directory to the local
    directory.


    There is no manual or help for gFTP yet, so the Help menu contains only an message
    and a copy of the GNU General Public License (GPL).


    # Connection Toolbars


    The connection toolbar is a detachable toolbar that has fields for you to type
    in the FTP URL to connect to, your username, and a password. Click the Stop button
    to break the connection.'
