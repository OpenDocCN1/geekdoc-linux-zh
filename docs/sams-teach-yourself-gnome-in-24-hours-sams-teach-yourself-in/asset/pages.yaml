  md: 'You can download GNOME by opening X and using Netscape, or via command line
    interface using the Lynx browser or the utility wget (most Linux distributions
    include both). You can find the binary packages of GNOME and the tarballs at

    http://www.gnome.org/start.


    wget is a useful utility for downloading large files if you have an unstable dial-up
    connection. If your connection is lost during a download, wget will read the portion
    of the file that was already downloaded when the connection was lost. When you
    reconnect, wget will continue where it left off.


    To use wget, you must know the complete URL pathname of the file you want to download.
    You can get the URL via Netscape, and then use wget to perform the actual download.
    From a command prompt, simply type wget [URL pathname], for example


    ```

    wget ftp://ftp.gnome.org/pub/GNOME/stable/latest/sources

    ```


