  md: '# Common File Manager Tasks


    Only symbolic links are represented graphically in File Manager. There is no graphical
    representation of hard links.


    # Viewing File Properties


    The properties of a file—including information about the pathname, extension,
    creation, access and modification date, permissions, and ownership—can be viewed
    using File Properties. To open the File Properties, right-click the filename,
    as shown in Figure 9.13.


    File properties can be viewed by anyone who has access to the file, but can only
    be changed by the owner of the file or the superuser.


    Figure 9.13


    The File Properties/Statistics tab shows basic information about the file. Note
    that the date of creation is later than the date of modification or access.


    ![](img/56ffc05f2012b0375f08095ea492838b_138_0.png)


    # Statistics


    The Statistics tab provides basic information about the file. Short descriptions
    of the file fields follow.


    +   - Full Name lists the full pathname of the file.

    - The File Name appears in a text box so you can rename the file.

    - File Type is determined by the file''s extension. If the file has an extension
    that is associated with a MIME type, File Manager can determine the type of file.

    - File Size indicates the size of the file in kilobytes and bytes.

    - File Created On is the date when the file was created on your computer. This
    is not necessarily the date that the file was actually created, but the date when
    the file became part of your.

    - Last Modified indicates the date when the file was changed.

    - Last Accessed On indicates the date when a user or a process last opened the
    file.'
