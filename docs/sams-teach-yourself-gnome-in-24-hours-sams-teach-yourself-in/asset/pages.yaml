  md: '# Starting GNOME When X Starts at Boot (xdm)


    If X starts automatically when you boot into Linux, you are probably using xdm,
    the X Display Manager, to start the X server. For our purposes, xdm runs in a
    manner similar to xinit, except that the startup script xdm is called Xsession,
    rather than xinitrc.


    Edit the Xsession file exactly the same way as the xinitrc file. If you would
    like to run GNOME for only one user, edit the $HOME/.xsession file to include
    the following as the last entry:


    ```

    exec gnome-session

    ```


    Like xinit, xdm uses the system default commands in /etc/X11/xdm/Xsession if there
    is no $HOME/.xsession in the user''s home directory. The full pathname for the
    system default Xsession is /etc/X11/xdm/Xsession. Again, enter the line exec gnome-session
    in Xsession.


    Also like xinit, xdm sometimes uses an Xclients file to point to certain programs
    that will run automatically when X starts. If you already have an Xclients file,
    enter exec gnome-session at the end of the /etc/X11/xdm/Xclients file or $HOME/.Xclients
    file instead of the /etc/X11/xdm/Xsession or $HOME.xsession, respectively.


    > If currently use xinit to start X but would like to start X at boot using xdm,
    the X and xdm man pages. xdm is part of /etc/init or /etcab which is your initialization
    script. See The Linux System Administrator''s Guide in the Linux Documentation
    Project archives at http://metalab.unc.edu/linux/docs.html#guide for more information.


    # Possible Problems


    The possible problems described in the previous section also apply to xdm.


    In addition, sometimes xdm specifies a specific desktop environment in the line
    if you specify xdm in /etc/init. Then the default environment will start if you
    start in GNOME via $HOME/.xsession or /etc/X11/xdm/Xsession. If this is the case,
    you might have to edit your /etc/init or /etc/initab to remove the reference to
