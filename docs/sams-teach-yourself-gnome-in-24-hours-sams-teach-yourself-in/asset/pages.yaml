  md: 'In this hour, you will


    +   * Install GNOME from source code.

    * Install GNOME from CVS.

    * Learn how to contribute to the GNOME Project.


    ![](img/56ffc05f2012b0375f08095ea492838b_325_0.png)


    > This hour is not meant for beginners, so a lot of material that is not directly
    related to GNOME is not explained. If you are new to Linux and you don''t understand
    everything in this hour, read through it, note what you don''t understand, get
    more comfortable with your Linux system, and then come back to this hour.


    # # Installing GNOME from Source Code


    When you are first learning GNOME and Linux, binary packages as rpms are useful
    because they are easy to install and uninstall. To master GNOME and Linux, however,
    it is necessary to know how to compile and install source code.


    GNOME source code is virtually always found in the form of a tarball. A tarball
    is a file that is composed of many smaller files that have been archived, or tarred,
    into one big file. The file is then compressed, or zipped, with the zip utility.
    By historical convention, files that have been tarred and zipped have the .tgz
    or .tar.gz extension, although this is not strictly necessary.


    ![](img/56ffc05f2012b0375f08095ea492838b_325_1.png)


    > For example, the Enlightenment theme packages are tarballs, but they have the
    extension .ethere. You can untar and unzip them just like any other tarball.


    ![](img/56ffc05f2012b0375f08095ea492838b_325_2.png)


    > Most Linux/UNIX commands are actually abbreviations. For example, tar is short
    for Tape Archive.


    When you install an application from tarballs, you must compile the source code
    that the developer wrote in C or another programming language into binary code,
    also called machine code. Compiling creates executable files that the computer
    can understand. Compiling source code can seem a bit intimidating at first (unless
    you are a programmer), but there are distinct advantages in doing so that outweigh
    the extra level of complexity involved.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# The Source Code Advantage


    GNOME tarballs comprise the only release of GNOME that is monitored and sanctioned
    by the GNOME Project. Various groups make binary rpm and deb packages, but the
    packages are not always reliable and are not guaranteed to work. The disadvantage
    of binary packages is that you are at the mercy of the rpm. If the rpm does not
    match your directory tree, or if there is an error in the rpm, you will not be
    able to install the package, or you might not be able to use the application after
    the package is installed.


    When you install from source code, you can control exactly what is installed where.
    Rather than hoping that the creator of the rpm used the same directory tree as
    you did, you can tell the configure script exactly where to places.


    There is often more documentation in a tarball. All the documentation in a tarball
    was put there by the developer of the software. When you use an rpm, you are dependent
    on what the creator of the rpm thinks. Sometimes rpm lack the man and info files
    for the utility in a, you will not be able to read the source code or the comments
    in the source code (often used in solving problems, even if you can''t understand
    the code).


    You can get the most-up-date version of the software as soon as it is released.
    When a new application or an upgrade to an existing module is released, there
    is usually a waiting period of several weeks to a few months before the binary
    packages appear. When you install from source code, you can get the new software
    as soon as the developer releases it. In addition, if you install from source
    code, you can get the cutting-edge, development version of software as it is submitted
    to the code library. The GNOME code is CVS, and anyone can download the development
    versions of GNOME packages as they are created.


    You can view the source code and learn how the program really works. You can also
    change features that you don''t like, or add features, and recompile the source
    code. This is an outstanding way to learn about programming, and begin contributing
    right away, even if you are new to programming.


    You customize the software. When you compile from source code, you can often specify
    options to customize your program to fit your system and needs. With a binary
    rpm, you have to accept the options that the creator of the rpm chose


    Installing software from source code is more secure. It is much easier to insert
    malicious code into a binary than into source code. If you accept an rpm or other
    binary package from an unknown source, be from a trusted site such as Red Hat
    or Freshmeat, it is better to install from source code.


    ![](img/56ffc05f2012b0375f08095ea492838b_326_0.png)'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'The disadvantage to installing binaries from source code is that, because you
    are compiling the code and creating the binaries yourself, there is a greater
    chance that something will go wrong. Of course, you could also look up that as
    an advantage, you will learn more about the inner workings of GNOME! When everything
    goes perfect without a hitch, you usually don''t learn as much as when you must
