  md: "# 13.5 Case Study: RSYNC\n\nThe *lsbdynchk* can be used at runtime to check\
    \ a binary for compliance. The dynamic application checker examines the application\
    \ parameters at runtime according to the specification.\n\nFurther testing, such\
    \ as running the binary in the LSB Sample Implementation and running any functional\
    \ verification tests for the application, should be done at this stage.\n\n# 13.5.3\
    \ FHS Issues\n\nThe *lsbappchk* tool is not able to verify that an application\
    \ is completely LSB-compliant. Some aspects, such as File Hierarchy Standard compliance,\
    \ currently need to be checked manually. For example, by default **rsync** uses\
    \ a configuration file *rsyncd.conf* that resides in */etc*. But the FHS says\
    \ configuration files should reside in */etc/opt/package*. This can be achieved\
    \ by applying the patch in Example 13.15.\n\n> **Example 13.15: An *rsync* Patch\
    \ to Obey the FHS Requirements**\n> ```\n> --- rsync-2.5.5/rsync.h 2002-03-25\
    \ 00:29:43.000000000 -0700\n> +++ rsync-2.5.5.lsb/rsync.h 2003-05-13 18:25:25.000000000\
    \ -0600\n> @@ -26,7 +26,7 @@\n>  #define RSYNC_RSH_ENV \"RSYNC_RSH\"\n>  \n> \
    \ #define RSYNC_NAME \"rsync\"\n> -#define RSYNC_D_CONF \"/etc/rsyncd.conf\"\n\
    > +#define RSYNC_D_CONF \"/etc/opt/lsb-rsync/rsyncd.conf\"\n>  \n>  #define DEFAULT_LOCK_FILE\
    \ \"/var/run/rsyncd.lock\"\n>  #define URL_PREFIX \"rsync://\"\n\nSimilarly **rsync**\
    \ can be configured to install into */opt/lsb-rsync* instead of */usr/local* by\
    \ passing the *--prefix=/opt/lsb-rsync* parameter to the configure script.\n\n\
    # 13.5.4 Further Examples\n\nFurther examples of building LSB-compliant versions\
    \ of applications can be found in the LSB Application Battery described in Chapter\
