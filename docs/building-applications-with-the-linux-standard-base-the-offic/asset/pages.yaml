    running the Samba server, this new user ID will be used for authentication.


    For several appbat applications, some directories and files must be copied to
    expected locations to allow testing for some known results. The **rsync** application
    needs to have two directories created to act as the root directory for the files
    being shared by the **rsync** server and as a place to store files copied from
