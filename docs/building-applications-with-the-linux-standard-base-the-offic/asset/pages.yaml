    # ### 8.4 Candidate Tracking


    In the previous sections the LSB criteria and methods for identifying potential
    candidates were described. Using those, the LSB Futures subcommittee tracks the
    status of the proposed candidates on a publicly browsable Web page. $^{1}$


    For each candidate, its status with respect to meeting each of the LSB selection
    criteria is listed along with some additional tracking data and an overall summary.
    This makes it easy to see what work needs to be done for a particular candidate.
    As mentioned in the criteria section, once a candidate has met all the criteria,
    it can be added to the next version of the LSB Written Specification.


    One nice thing about this tracking system is that it allows for *any* potential
    candidate to be added; if that candidate can meet the criteria, then it belongs
    in the LSB. Sometimes a candidate will be added but will be blocked as being unable
    to meet certain parts of the criteria. It continues to be tracked, and if and
    when it can meet the criteria then it can be added. It makes the process more
    objective and protects against things being added before they are ready.


    # ### 8.5 Problem Cases


    In the course of tracking candidates, the LSB Futures subcommittee has encountered
    a few classes of candidates that, while in demand, are problematic to add. The
    following sections describe a few examples of this.


    # #### 8.5.1 Linux Specific Requests


    One of the most requested categories of interfaces are those that are related
    to the Linux kernel. In particular, developers would love to have a kernel


    1. http://www.linuxbase.org/futures/candidates/'
