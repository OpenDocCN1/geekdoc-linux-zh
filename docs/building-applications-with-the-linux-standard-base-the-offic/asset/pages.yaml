- pgno: 211
  md: '# 13.4 SHARED LIBRARIES


    When an application uses a library that is not part of the LSB Written Specification,
    it can be built in one of two ways. Either the binary is statically linked against
    that library, or, if the library is LSB-compliant, it may be dynamically linked
    with the binary. If it is dynamically linked, the shared library must be supplied
    with the rest of the application.


    The requirements for a shared library to be considered LSB-compliant are essentially
    the same as those required for a directly executable program. That is, it must
    only use dynamic interfaces supported by the specification, or alternatively supplied
    in another LSB-compliant shared library that is packaged with the rest of the
    application.


    Much like an ordinary binary, a shared library that is to be supplied with an
    LSB-compliant application should be built against the LSB headers and stub libraries.


    Do not build a shared library with **ld** (Example 13.8). This may lead to the
    use of symbol versions that are not part of the LSB Written Specification.


    ![](img/d75cffbcb54aabfb0f9854162061d394_211_0.png)


    If you are using the *lsb-build-cc* technique of building an application, then
    shared libraries must also be built using **lsbcc** (Example 13.9).


    ![](img/d75cffbcb54aabfb0f9854162061d394_211_1.png)


    If you are using the *lsb-build-chroot* technique for building an application,
    then no modifications to the build method are required.


    When it comes to linking an application, if you use **lsbcc**, by default only
    the LSB-specified libraries will be linked dynamically, even if both static and
    shared libraries are available in the search path. This behavior can be modified'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'by setting the environment variable `LSBCC_SHARED_LIBS`. Its value is a colon-separated
    list of library names that specifies which extra libraries should be dynamically
    linked.


    If you use `lsb-build-chroot` then the compiler will dynamically link all shared
    libraries available in the restricted environment, and fall back to static linking
    if only the static version of a library is present.


    # 13.5 CASE STUDY: RSYNC


    The `rsync` application is one of the programs in the LSB Application Battery.
    We use this program as an example of the types of problems that developers may
    encounter, and how to work around them when attempting to build an LSB-compliant
    binary.


    We use the `lsbCC` build tool with `rsync` version 2.5.5. The source for `rsync`
    can be downloaded from the `rsync` Web site.³


    # 13.5.1 Building an `rsync` Binary with `lsbCC`


    First, we unpack the sources and run the `configure` script (Example 13.10). We
    make sure that `configure` uses `lsbCC` as the compiler by setting the `CC` environment
    variable (and not `cc`, as `configure` might do otherwise by default).


    From the edited `configure` output shown in Example 13.10, we can see that the
    `configure` script has correctly detected that `mllninfo()` is not part of the
    LSB, so it is not used. Although `libresolv` and `libpopt` are also not in the
    LSB Written Specification, `lsbCC` has detected that there is a static version
    of the library which can therefore be used.


    Next, we attempt to compile the `rsync` binary (Example 13.11). Since we told
    the `configure` script to use `lsbCC` as the compiler, we do not need to set the
    `CC` environment variable when invoking `make`.'
