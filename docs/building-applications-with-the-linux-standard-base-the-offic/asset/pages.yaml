    # ### 4.5 ADVANCED PACKAGING


    It has been demonstrated that add-on binary-only applications are to be installed
    in the `/opt/package/bin/` and `/opt/provider/bin/` directories. The basics of
    creating a flexible relocatable RPM package have been demonstrated by being able
    to override the default `/opt/` destination and select an alternate location.
    Now let’s look at more advanced scenarious involving packaging multiple products,
    packaging for multiple architectures, packaging for multiple versions of a product,
    or any combinations thereof.


    # #### 4.5.1 Packaging Multiple Products


    Recall the WhizBang Widgets example in this chapter. What if you want to ship
