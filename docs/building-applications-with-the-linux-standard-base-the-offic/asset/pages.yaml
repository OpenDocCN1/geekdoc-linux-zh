  md: '# CHAPTER ELEVEN


    # Using the LSB Test Suites


    This chapter describes the LSB Test Suites, how to obtain them, how to use them,
    and how to add more conformance tests.


    # 11.1 UNDERSTANDING THE LSB TEST SUITES


    The LSB Test Suites are a family of test suites for testing various aspects of
    the LSB. They include tests supplied in RPM format for testing LSB Runtime Environments
    for conformance to the LSB Written Specification. The tests are built in the LSB
    Development Environment to ensure they are LSB-conformant.


    The test suites include both TET-based and non-TET-based tests. The Test Environment
    Toolkit (TET) is a framework and application program interface for test generation.
    The following sections describes each test.


    # 11.1.1 TET-Based Tests


    # 11.1.1.1 lsb-runtime-test


    This test program is made up of a number of separate test modules combined into
    a single binary RPM.


    POSIX.1-1990 test suite Runtime tests for compliance against the POSIX.1-1990
    standard.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# LSB-OS test suite


    Runtime tests for compliance of Linux-specific interfaces as defined in the LSB
    Written Specification and other interfaces from POSIX and the Single UNIX Specification
    required by the LSB Written Specification but not covered by the POSIX.1-1990
    test suite.


    # FHS test suite


    Tests for compliance against the FHS specification.


    # LSB Users/Groups test suites


    Tests for compliance against the user and group components of the LSB Written
    Specification (commands and compulsory users and groups).


    # VSTH-lite test suite


    A test suite for a subset of pthreads--POSIX 1003.1-1996 threads.


    The utility tests are a separate standalone test suite:


    # VSC-lite test suite


    Tests commands and utilities from POSIX 10003.2-1992.


    # 11.1.1.2 lsb-version-pam


    This is a binary version of the LSB pluggable authentication module (PAM) test
    suite. The PAM abstracts the mechanics of authentication from the application
    and enables the local system administrator to choose how individual applications
    will authenticate users. Header file tests from the test suites were removed.


