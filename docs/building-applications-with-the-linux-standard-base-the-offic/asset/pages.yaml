    # #### 13.3.3.3 Choosing


    Table 13.1 explains when you should use `lsb-build-cc` and when you should use
    `lsb-build-chroot`.


    **Table 13.1: Using lsb-build-cc and lsb-build-chroot**


    | Use `lsb-build-cc` if: | Use `lsb-build-chroot` if: |

    |----------------------|--------------------------|

    | * Your application uses tools or shared libraries that are not available in
    `lsb-build-chroot`. | * Your application has hard-coded paths to include files
    and shared libraries. |

    | * Your application has test scripts that are different from most Linux environments.
    | * Your application has hard-coded use of specific compilers in its `Makefile`.
    |

    | | * It is necessary to use a compiler other than GCC. |'
