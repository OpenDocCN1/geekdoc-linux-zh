    # 4.1.1   RPM Checking


    The LSB package check command, **lsbpackchk**, is a program that verifies that
    a package and its contents conform to the LSB Written Specification. The version
    number it displays refers to the version of the specification that it was built
    for, not the version of the command itself.


    # 4.2   INSTALLING YOUR APPLICATION IN THE RIGHT PLACE


    Software developers and independent software vendors (ISVs) have differing ideas
    about the best place to install applications and software packages. Some install
    in `usr/bin/` or `usr/local/bin/`, others prefer the `/opt/` directory. Your preferences
    might vary depending on whether you come from a UNIX System V, Berkeley Software
    Distribution (BSD), or GNU/Linux background. These unpredictable variations cause
    file and directory naming conflicts that sometimes disrupt software installation,
    removal, and upgrades.


    The Filesystem Hierachy Standard (FHS),⁴ referenced by the LSB, provides guidelines
    and defines requirements for file and directory placement. The FHS promotes the
    interoperability of applications, system administration tools, development tools,
    and scripts. The FHS explains in detail the content and purpose of each of the
    primary directories. Figure 4.1 shows the directory structure as specified by
    the FHS.


    In addition to the FHS, the System V Application Binary Interface,⁵ the Intel
    Binary Compatibility Standard V.2 (iBCS2), the Common Operating System Environment
    (COSE), the Linux Standard Base (LSB), and the UNIX


