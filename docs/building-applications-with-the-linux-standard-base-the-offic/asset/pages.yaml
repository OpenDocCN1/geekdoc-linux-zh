    # mkdir /mnt/lbsi

    # losetup /dev/loop0 /opt/lsb-umlsi/lib/root_fs

    # mount /dev/loop0 /mnt/lbsi

    # cp lsb-lynx-2.8.4-1.1486.rpm /mnt/lbsi/tmp

    # umount /mnt/lbsi

    # losetup -d /dev/loop0

