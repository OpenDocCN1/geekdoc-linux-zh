    # 5.5 FILES YSTEMS


    Migrating data from one filesystem to another can be accomplished either by data
    migration tools or by transferring the data over the network. Data transferri
    ng is the most time-consuming of the two. Linux has support for over thirty different
    filesystems, which are listed in the `mount (8)` manual page. In Solaris the predominant
    filesystem is UFS, in Linux it is ext2. Table 5.4 gives some filesystem differences
    between Linux and Solaris.


    # 5.6 THREADS


    Solaris provides a threading model under which all processes are based on threads
    called lightweight processes (LWP). In Solaris, a process will be associ ated
    with one or more LWP. In the case of Linux, all threads are based on processes
    and each thread will be mapped to a process.


    Solaris supports not only its native threading model but also the POSIX threading
    model; POSIX threads are also supported on Linux. If an application uses the Solaris
    native thread model then the application needs a lot of rework before it can be
    ported. If an application uses on standard proprietary functions, then the Solaris-compatible
    Thread Library (STL) ^9 available on'
