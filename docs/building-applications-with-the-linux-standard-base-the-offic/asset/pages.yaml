- pgno: 179
  md: '# The Test Specification


    +   - The premise for all the tests is that they have to be based on a written,
    publicly available test specification.


    +   - The test specification upon which the test suite is based shall conform
    to the POSIX.3 methodology (which means the use of test assertions).


    # The Test Suite


    +   - The test suite must be aligned with the current draft or issue of the relevant
    specification (mandatory).


    +   - The test suite must be able to establish conformance with all legitimate
    options and variables defined by the specification (mandatory).


    +   - Each individually executable test must provide its own setup and cleanup
    functionality (mandatory).


    +   - No individually executable test shall introduce side effects that may affect
    the results of any other tests (mandatory).


    +   - The unit of test execution should cover no more than a single interface
    function (desirable).


    +   - The test suite shall have a capability to check complete and correct configuration
    and installation; this may include a set of defined confidence checks (mandatory).


    +   - Configuration and installation checking facilities should be automated (desirable).


    +   - The test suite must include clear and comprehensive user and programmer
    documentation.


    ![](img/d75cffbcb54aabfb0f9854162061d394_179_0.png)


    These criteria are taken from the Open Group''s test suite acceptance criteria.8'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# ### 11.4.2 Writing TET-Based Test Suites


    This section will help you understand the test development process at a high level.
    This process includes the following high level steps.


    # #### 11.4.2.1 Developing the Specification


    The specification should include the following information about the test suite:


    +   * Test methodology

    +   * Functional coverage

    +   * Test architecture

    +   * Assumptions

    +   * Development schedule


    # #### 11.4.2.2 Developing the Set of Formal Assertions


    The purpose of this step is to create a list of testable statements from the specification.
    This is an intermediate step between the language of the specification and actual
    test code.


    Formal test assertions should bridge the gap between the language of the specification
    and the test suite code. Likewise, the goal of the test code is to produce an
    executable representation of the requirements of the specification. Test suites
    developed with the assertion-based technique should meet the following requirements:


    +   * They must follow the IEEE Standard for test methods (1003.3).

    +   * An assertion must be developed for each definitive statement in the specification
    under the test.

    +   * Each assertion must be designed to test whether the statement is true or
    false for the implementation under test.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 11.4.2.3 Review of Assertions


    The review of assertions helps to identify bad assumptions made by the writer
    of the assertions as well as ambiguities or errors in the specification being
    tested.


    # 11.4.2.4 Test Case Development


    This involves mapping the assertions to actual code that attempts to verify them.
    Test case writers should attempt to follow the guidelines listed in Section 11.4.1,
    in particular, only test one thing at a time and avoid having side effects between
    test cases. These two properties are especially valuable when attempting to debug
    test failures.


    # 11.4.2.5 Test Case Review


    Having the test cases run by other people on a wide variety of implementations
    helps pick up problems in test case code and the underlying specification. Test
    case reviews are used to validate the test suite. Reviews should conform to the
    following guidelines:


    +   - Use review guidelines and pro-forma responses.

    +   - Comments should be specific.

    +   - Comments should include a specific action.


    # 11.4.3 Converting Existing Test Suites to Use the TET/VSXgen Framework


    There are two methods of converting existing test cases to be usable in the TET/VSXgen
    framework used by the LSB. This section describes each method.


    # 11.4.3.1 Adding the TET-Specific Calls to the Original Test Case Source Code


    This method is best suited for test cases that include a series of macros. For
    example:


    ```

    ASSERT(foo==5, "Foo was not 5");

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# **11.4.3.2 Wrapping the Binaries in TET-Aware Shell Code**


    This method is best suited for test cases that return with informative exit codes
    or output parseable error messages, so that a shell script wrapper can be used
    to convert these to TET return codes. While this method allows for the reuse of
    existing test case code, it might make test suites harder to debug and results
    harder to understand.


