    # 11.2.8 Building `lsb-runtime-test`


    You can build the `lsb-runtime-test` using the `tcc` command.


    To build all of the test cases, use the following command:


    ```

    ```vx$ tcc -b```

    ```


    The names of the test cases are displayed as they are built, but build failures
    are not shown. You should inspect the journal file to see any failures, especially
    if you have changed the test case code.


    You can also use the `tcc` command to build a subset of the available test cases.
    The following examples show two different ways to use the `tcc -b` command to
    do this.


    ```

    `vx$ tcc -b T.fgetpos`   Builds /tset/LSB.os/streamio/fgetpos/T.fgetpos from the
    `lsb-os` test suite.

    ```


    ```

    `vx$ tcc -b string`   Builds the following test cases from the `lsb-os` test suite:

