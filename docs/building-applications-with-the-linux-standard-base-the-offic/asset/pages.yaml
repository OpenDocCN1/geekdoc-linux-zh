  md: '# ### 12.6 PACKAGING THE SAMPLE IMPLEMENTATION


    The LSB-si is released in several configurations for each of the following architectures:


    **1. Base system** A tarball containing only what is required by the LSB Written
    Specification. Can be entered via chroot. For complete conformance, requires the
    underlying Linux kernel to be LSB-conformant.


    **2. Testable system** Contains the base system plus additional files and programs
    needed to enable the LSB-si as a testing environment. This bundle can run the
    LSB Runtime test suite and LSB-conformant applications. Can be entered via chroot.
    Once running, it is possible to telnet into the environment. Complete conformance
    requires the underlying Linux kernel to be LSB-conformant.


    **3. Bootable system** The files from the base system plus a kernel and other
    support to make it possible to boot a standalone. Some additional configuration
    will be necessary---for example, an appropriate boot configuration for the target
    hardware and configuration of necessary kernel modules.


    **4. Hosted system** The files from the base system plus support to run User-Mode
    Linux, a kernel virtual machine that runs as a user-level application on the host
    system. User-Mode Linux may not be available for all LSB-supported architectures.
    The hosted bundle is also available as an installable, ready-to-run package.


    ![](img/d75cffbcb54aabfb0f9854162061d394_200_0.png)


    > When the package is being extended beyond the base, there’s a tradeoff: The
    system becomes more usable, but includes various non-LSB commands and files, and
    therefore is a little less ‘pure’ in a testing sense.'
  merge: -1
  img_proc: true
