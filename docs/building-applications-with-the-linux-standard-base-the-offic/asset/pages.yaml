- pgno: 68
  md: '# 3.12.5 Desktop


    When developing an application that uses a Graphical User Interface (GUI), it
    is best to concentrate on perfecting its usability and portability rather than
    desktop integration. No one can guarantee a specific window manager or desktop
    that the end user will be using, so it is best to not limit the application by
    loading it down with desktop-specific features.


    # 3.12.6 Threads


    At the time of the writing of this book, the current Linux distributions were
    in various states of supporting Linux threads, Next Generation POSIX Threads (NGPT),
    and Native POSIX Threads Library (NPTL). The next generation of Linux distributions
    will be supporting NPTL. LSB v2.0 specifies pthreads as implemented by NPTL and
    the 2.6 Linux kernel. Applications and middleware should migrate to NPTL.


    # 3.12.7 gets(3)


    Although `gets(3)` is specified by POSIX, the LSB has deprecated it. Both the
    LSB and POSIX recommend the use of `fgets(3)` instead of `gets(3)`.


    # 3.12.8 system(3)


    The LSB has its own definition of `system(3)` which does not reference ISO/IEC
    9945. Although it is specified, for portability it is recommended instead to use
    `popen(3)`, `execl(3)`, `execle(3)`, or `execv(3)`.


    # 3.12.9 ncurses


    Both the LSB and the SUS specify the use of `curses.h`. For source code portability,
    do not use `ncurses.h`.


    # 3.12.10 malloc(3)


    When using `malloc(3)`, include `stdlib.h` instead of `malloc.h` because, along
    with compiler option -lmalloc, these are later used for debugging (Example 3.8).'
