- pgno: 150
  md: '# CHAPTER TEN

    # Using the LSB Written Specification


    This chapter describes what the LSB Written Specification is used for and what
    it is not intended to be used for.


    # ### 10.1  UNDERSTANDING THE LSB WRITTEN SPECIFICATION


    The LSB Written Specification comprises a set of documents specifying a bi-

    nary compatibility environment. The documents are structured along hard-

    ware architectures, with the common material supported on all architectures

    in a single document called the generic specification (known as gLSB or LSB-

    Core) and then one additional supplementary document for each supported

    architecture. For LSB 2.0, the generic specification is modularized into a series

    of options to enable support for smaller footprint devices and to allow devices

    to not support all the options if they are not needed in a specific marketplace.


    Instead of duplicating the descriptions of interfaces that are standardized

    by other groups such as the IEEE POSIX standards and The Open Group

    Single UNIX Specification, the LSB references a number of published stan-

    dards and specifications. Other examples of referenced documents include

    the OpenGL Application Binary Interface for Linux document for the

    OpenGL, the appropriate ELF specifications, and the System V Interface

    Definition (SVID).'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'For each of the interfaces in these libraries, there is a specification of
    the interface behavior, the ABI it presents, and, where applicable, the symbol
    version. To reduce duplication and the chance of editing errors, references are
    made to a description in one of the base standards, or sometimes a reference plus
    a small difference (for example, "for the LSB, the -g option is also allowed").
    The LSB provides a full description only when a reference specification is not
    found.


    The LSB also defines a standard packaging format to allow portable installation
    of applications. The packaging format specified is a subset of RPMv3. Although
    packages of this format must be able to install on a compliant runtime (distribution),
    this does not mandate the use of the **rpm** program or database. For example,
    Debian-based distributions, which use the `.deb` format, can use programs such
    as **alien** to convert and install LSB-compliant software. Some features, such
    as trigger scripts, were not included; currently these cannot be supported nor
    converted easily to other packaging formats.


    A number of utilities are included in the specification. For many of these, the
    behavior has already been defined by a POSIX specification. The **gl_LSB** documents
    cases where the behavior of the command on Linux diverges from this specification
    or it is a Linux-specific command. The criteria for selecting the commands to
    be included in the specification is their usefulness for scripts used for application
    installation, configuration, and basic maintenance.


    The LSB also mandates a layout of the file tree by referencing the Filesystem
    Hierarchy Standard. In the area of system initialization, the LSB introduces some
    new concepts for init scripts. Historically, it has been difficult to automatically
    determine at what stage of the boot sequence a service should be started. LSB-compliant
    init scripts specify what services they provide and what they depend on. Thus,
    the system initialization service of the runtime is able to determine at what
    point to start or stop a service.


    It is important to note that it is not required that the LSB Written Specification
    be only implementable on Linux-based systems. The intent is to allow for other
    operating systems to be able to present an LSB-compliant runtime environment to
    applications.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 10.2 PRODUCT STANDARD DESCRIPTIONS


    *A product standard* is a concise statement identifying those parts of the LSB
    Written Specification that must be implemented in a product carrying the LSB brand.


    **LSB Runtime Environment**    *The LSB Runtime Environment for IA32* (or other
    architectures) product standard is for platforms providing services that conform
    to the LSB specifications, specifically the LSB 2.0 common specification (known
    as gLSB or LSB-Core), in conjunction with the LSB specification for the IA32 (or
    other architectures) Architecture 2.0 processor-specific supplement (known as
    archLSB or LSB-Core-IA32). For more details, see Section 6.3.4.1.


    **LSB Application**    *The LSB Application for IA32* (or other architectures)
    product standard is for applications conforming to the LSB specifications, specifically
    the LSB 2.0 common specification (known as gLSB or LSB-Core), in conjunction with
    the LSB specification for the IA32 (or other architectures) Architecture 2.0 processor-specific
    specification (known as archLSB or LSB-Core-IA32). LSB Applications are the consumers
    of services provided by the LSB Runtime Environments. For more details, see Section
    7.2.


    # 10.3 SPECIFICATION MODULE DESCRIPTIONS


    *A specification module* is a unique collection of one or more functions that
    have value for a certain group of runtime implementations. To borrow a business
    term, a specification module is specific to a “vertical market.” Specification
    modules can range from informal concepts to certified standards. Product standards
    contain one or more of the following specification modules.


    **LSB-Core**    Is a set of interfaces for developers targeting any general purpose
    Linux runtime. This includes only the basics for runtime environments.


    **LSB-Graphics**    Provides graphics interfaces such as the X Window System libraries
    and the OpenGL library. It is to be used in conjunction with the LSB-Core module.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '**LSB-Embedded**   Is minimal set of interfaces that a developer targeting
    an embedded system would expect to be able to find. This specification module
    is not currently included in any product standard, but can be added to one if
    there is demand. In addition, this module currently includes some things that
    may not be present in a version used for a product standard.


    **LSB-Open118N**   Provides additional internationalization commands and interfaces
    beyond what is included in the LSB-Core. It is to be used in conjunction with
    the LSB-Core module.


    # 10.4  FUNCTIONAL AREA DESCRIPTIONS


    A *functional area* corresponds to the smallest standards unit with reasonable
    justification for individual existence. To divide it into smaller units would
    not make sense since implementors of that interface would implement all the smaller
    units anyway. Often the justification for a functional area will be the possibility
    that it will be useful for implementors who are targeting only some portions of
    the available standards in an *a la carte* manner.


    **Executable and Linking Format (ELF)**   Is the definition of the executable
    files produced by the C compilation system.


    **Execution Environment**   Consists of the filesystem hierarchy, minimal granted
    directory and file permissions, recommendations for applications on ownership
    and permissions, regular expression localization, filename globbing localization,
    and miscellaneous API behaviors.


    **Base Libraries**   Consists of libc, libm, libpthread, libgcc_s, libdl, libcrypt,
    libpm, and libstdcxx.


    **Utility Libraries**   Consists of libz, libncurses, and libutil.


    **System Initialization**   Consists of `cron` jobs, init script actions, installation,
    and removal of `init.d` files.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '**Packaging** Consists of the RPM file format, script restrictions, package
    naming, package dependencies, and package architecture considerations.


    **Graphics** Consists of **libX11**, **libXext**, **libSM**, **libICE**, **libXt**,
    and **libGL**.


    # 10.5 SPECIFICATION AMALGAMATION


    Figure 10.1 is a visual representation of the new structure of the LSB. Each box
    represents a functional area. Functional areas are grouped according to the workgroup
    that maintains them: ELF, FHS, LSB, or Desktop. Functional areas are stacked according
    to their dependencies. The dimension arrows indicate what functional areas in
    the stack are included in a specification module.


    Product standards, such as the LSB Runtime Environment, contain one or more specification
    modules such as the LSB-Core.


    ![](img/d75cffbcb54aabfb0f9854162061d394_154_0.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# **10.6** EXPANDING THE LSB WRITTEN SPECIFICATION


    Below are some of the acceptance criteria taken from Section 8.2 for publishing
    or revising an LSB Written Specification.


    +   • The candidate must represent the “best practice” in the development community
    for the problem it solves. It needs to have emerged as a clear de facto standard
    and be available on most (or all) of the major distributions.


    +   • The upstream maintainers must be committed to backwards compatibility (for
    some defined version) and stability. They should be willing to work with developers
    and distributors on providing a standard everyone can agree on and adopt.


    +   • The upstream maintainers, distributions, and developers should be synced
    up on compatible versions. If not, they should be willing to agree on and adopt
    compatible versions.


    +   • If the distributions maintain any patches against the component, these could
    be merged upstream or dropped. Since the LSB is a behavioral standard, this is
    not required but could make things easier.


    Explicitly check the upstream support; a checklist item for supporting a new architecture
    should be an explicit check of the upstream components to ensure that the correct
    symbol versions are specified.


    A validation step must be completed prior to a specification being approved by
    the LSB workgroup. This validation step consists of the completion of all components
    of the LSB Written Specification, Test Suites, Development Environment, Sample
    Implementation, and Application Battery. Our process is a closed loop when all
    of these components are in place.


    Multiple implementations should exist and have been used in the validation step.
    If only a single implementation exists, then the LSB is not really needed, since
    no compatibility problem can exist. The LSB brand is intended for use by multiple
    vendors and distributions, and not as a marketing tool for a single vendor or
    distribution.'
  merge: -1
  img_proc: true
