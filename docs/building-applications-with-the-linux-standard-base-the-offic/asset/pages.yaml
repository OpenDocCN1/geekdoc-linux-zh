- pgno: 228
  md: 'Every LSB Certified Runtime Environment must have a package installed that
    will provide the needed dependency for LSB-compliant applications. Furthermore,
    an LSB-compliant application must not rely on any commands or applications outside
    of those listed in the LSB Written Specification. This applies to installation
    of the application as well as to its normal operation.


    When an LSB-compliant application is installed and tested on a full Linux distribution
    that is also an LSB Certified Runtime Environment, the application may perform
    properly even though it is using non-LSB commands. To help identify any potential
    problems, the application must also be tested in the LSB Sample Implementation.
    Because the Sample Implementation only has LSB-specified commands, it will cause
    the application to fail when it tries to make use of a non-LSB command. With the
    appbat applications being LSB-compliant, they have demonstrated that they only
    rely on LSB-specified commands.


    # 14.2.3 Configuring the Application Battery


    Some of the appbat applications will require a small amount of configuration before
    they can be used during LSB certification testing of a Linux runtime environment.
    Instructions for installing, configuring, and testing the applications are available
    on the LSB Web site at http://www.linuxbase.org/appbat/evt-2.0.0/. The instructions
    are divided into two sections. The first section covers the installation and setup
    of a particular application. The second section details the functional tests to
    be performed in order to validate correct execution of the application. Installation
    of the appbat applications was covered in the previous section of this chapter.
    All the appbat applications are installed in a similar fashion, so no further
    discussion is necessary. Instead, this section will describe some of the configuration
    steps performed on the applications.


    Some of the configuration steps described in the Application Battery functional
    test pages are not really necessary on most Linux distributions. The items to
    be added or modified are already present on these systems even though they are
    not specified by the LSB. Still, the steps need to be verified to ensure the application
    can run on even a minimally compliant system, such as the LSB Sample Implementation.
    Two examples of such configuration steps are the addition of entries to the /etc/services
    file for rsync and Apache.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Both these applications have server components that run as system services,
    thus requiring appropriate **tcp** and **udp** entries in `/etc/services`. No
    additional configuration would need to be performed on Debian, Red Hat, or SuSE
    distributions because these entries would already exist. Conversely, these entries
    must be added on the LSB Sample Implementation in order to allow proper operation
    of the application service.


    Another related example is the situation where the application must ensure that
    an entry for the `nobody, nobody` group, or both exist on the system. As with
    system services, the Apache and rsync application servers handle remote requests
    as the `nobody` user. The Tcl application also needs the `nobody` user when executing
    its suite of tests. Again, the LSB Sample Implementation will need extra configuration
    because the LSB only specifies the `nobody` user and group as optional.


    In order to get some of the appbat applications operational, configuration files
    will need to be created or modified. In some instances, this will be the minimal
    configuration for the application, while in other instances the configuration
    is necessary for testing the application in such a way as to produce some well-known
    behavior. Configuring Samba involves either editing or creating the `/etc/pam.d/samba`
    configuration file to ensure Samba will use PAM for user authentication. To avoid
    conflicts with services already running on the host system, new configuration
    files must be created for both Samba and rsync. The Samba configuration file,
    `/etc/opt/lsb/appbat/smb.conf`, only has enough information in it to put the Samba
    server in the workgroup called `WORKGROUP`, share users'' home directories on
    the system, and allow write access to the shared home directories. Similarly,
    the configuration file for rsync, `/etc/opt/lsb/appbat/rsyncd.conf`, sets up the
    rsync server to allow access to the `/tmp/rsync` directory and to enable write
    access to this directory.


    Some of the applications in the Application Battery have server daemons that may
    conflict with those running on the host system. This can cause problems if two
    different daemons are both trying to service requests on the same port. To avoid
    this situation, the configuration instructions for Apache, rsync, and Samba tell
    the tester to stop appropriate daemons on the host before proceeding with the
    functional test. For the Apache Web server, any **httpd** or other daemons listening
    on the standard Web server port (80) must be'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'stopped. With **rsync**, the tester must stop any **rsync** daemon currently
    running on the host system. Finally, the Samba **smbd** and **nmbd** server daemons
    must be stopped before attempting any functional tests.


    The Samba application needs an additional bit of setup before it can be used to
    communicate with any SMB clients. Normally, when a connection is made from an
    SMB client to an SMB server, the authentication on the server is handled using
