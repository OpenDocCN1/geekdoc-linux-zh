- pgno: 100
  md: '# PART III


    # Certifying for the LSB


    LSB Certification program is essential for Linux-based runtime environments (distributions)
    and Linux-based application developers and vendors. It provides an assurance to
    users and customers that the certified software product has the highest possible
    runtime adherence to the LSB specifications. It provides a foundation that ensures
    that a certified application will work with any LSB-certified or LSB-compliant
    runtime environments.


    Certification makes an LSB runtime environment and application more valuable to
    the consumer.


    Day to day operations of the LSB Certification program are managed by an independent
    Certification Authority (CA). The Certification Authority manages the process
    of becoming certified and audits the submissions for certification. The LSB Certification
    program is not a profit center for the Free Standards Group. Prices are kept to
    a minimum to encourage developers, ISVs, and Linux distributions to become LSB-certified.


    The following two chapters describe LSB Certification for runtime environments
    and applications, respectively. To become familiar with the LSB Certification
    program, you should read the following program documents available from the LSB
    Certification Web site (http://www.opengroup.org/lsb/cert/): The LSB Certification
    Policy, which covers the overarching policies of the program, and the LSB Product
    Standards, which contain the detailed conformance requirements for the different
    product types that can be certified.'
  merge: -1
  img_proc: true
- pgno: 101
