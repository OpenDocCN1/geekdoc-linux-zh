    # 12.4.1 Sample Implementation Build Process


    The source code for the LSB-si Development Environment can be obtained from the
    LSB CVS tree. The code can be checked out in several ways: as a snapshot either
    by release tag or by date, or as a working cvs directory (even if you''re not
