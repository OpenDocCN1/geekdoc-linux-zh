  md: '# # CHAPTER NINE

    Adding New Architectures



    to the LSB Portfolio


    This chapter describes the process by which the LSB workgroup added new architectures
    to the LSB Written Specification portfolio.


    # ## 9.1 ARCHITECTURE-SPECIFIC SUPPLEMENT


    The LSB is composed of two basic parts: a common specification ("generic LSB"
    or "gLSB") describing those parts of the interface that remain constant across
    all implementations of the LSB, and an architecture-specific specification ("archLSB")
    describing the parts of the interface that vary by processor architecture. Together,
    the generic LSB and the architecture-specific supplement for a single hardware
    architecture provide a complete interface specification for compiled application
    programs on systems that share a common hardware architecture.


    The architecture-specific supplement must be used in conjunction with the generic
    LSB. It provides architecture-specific information that supplements the generic
    LSB, as well as additional information that is not found in the generic LSB. Listed
    below are several components of the LSB that are architecturally specific:


    +   - Executable and Linking Format (ELF)

    +   - Library symbol versions

    +   - Header file data structures'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/d75cffbcb54aabfb0f9854162061d394_143_0.png)


    +   - Architecture-specific attributes of RPM packaging

    +   - Sample Implementation


    This chapter will briefly describe how the LSB imports and cross-checks new architecture-specific
    ABIs.


    # 9.2 ARCHITECTURE-SPECIFIC ELF


    ELF defines the linking interfaces for compiled application programs. The LSB
    has a database containing most of the ELF specifics for Linux. The LSB database
    (Figure 9.1) is what is used to build the Written Specification and the LSB tools.


    # 9.3 ARCHITECTURE-SPECIFIC SYMBOL VERSIONS


    Library stability for applications is maintained on Linux by the use of symbol
    versioning. If an ABI changes, then a copy of the ABI is created with a new symbol
    version. Previously built applications continue using the interfaces'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'they were originally linked to, and recently linked applications will use the
    latest ABIs.


    For LSB compliance, the existence of common symbol versions in system libraries
    is checked using the LSB library checker tool `lsblibchk` (Example 9.1). New or
    changed symbol versions are discovered when running `lsblibchk`. Architecturally
    differing ABI symbol versions are grouped in the LSB ABI. The common set of architecture
    symbols in the LSB ABI are what applications need to be binary compatible to.


    # Example 9.1: Using `lsblibchk`


    ```

    # rpm -i lsblibchk-2.0.0-1.i386.rpm

    # /opt/lsblibchk/bin/lsblibchk

    ```


    # 9.4\ ARCHITECTURE-SPECIFIC HEADERS


    In the LSB Development Environment, the LSB provides Linux header files according
    to the LSB Written Specification (Example 9.2). These header files are *iffle-ed*
    for architectural differences only. Using the LSB header files for compilation
    dramatically improves binary compatibility for applications.


    # Example 9.2: Installing LSB Header Files


    ```

    # rpm -i lsb-build-base-2.0.0-1.i486.rpm

    # /bin/ls /opt/lsbdev-base/include

    ```


    A Linux header files runtime can be checked using `lsbdevchk`.


    # 9.5\ ARCHITECTURE-SPECIFIC PACKAGING


    Application RPMs are packaged according to architecture. For example, the package
    `lsb-pkgechk-2.0.0-1.i486.rpm` has been compiled and packaged for an Intel 486
    or better system. The LSB package verification tool'
