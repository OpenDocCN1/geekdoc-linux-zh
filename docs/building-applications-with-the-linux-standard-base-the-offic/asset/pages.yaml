  md: 'Variable files in a package, or files that change during the normal course
    of system runtime, go in the `/var/opt/package/` and `/var/opt/provider/` directories.


    Exceptions can be made to these rules if it is necessary for a package to install
    or create files elsewhere. For example, if a package creates a new device, it
    installs in the `/dev/` directory.


    The system administrator should create a separate disk partition for the `/opt/`
    filesystem, and end users should add `/opt/package/bin/` and `/opt/bin/` to their
    PATH environment variables. Usually the end user''s shell will find applications
    in their respective `/opt/package/bin/` directories; however, the system administrator
    may have created symbolic links or wrapper scripts in `/opt/` for each package
    using setup-opt.sh.


    ```

    # setup-opt.sh /opt/whizbang/bin/widgets

    # setup-opt.sh /opt/whizbang/man/man1/widgets.1

    ```


    # 4.3 PACKAGE NAMING


    To avoid conflicts between native distribution packages and LSB-conformant packages,
    a naming scheme was specified. Names of all LSB-compliant packages begin with
    `lsb-`. If the name of the package contains only one hyphen, then the name must
    be assigned by the Linux Assigned Names and Numbers Authority.[^6] If the name
    of the package contains more than one hyphen, then the portion of the package
    name between the first and second hyphens must be either an LSB provider name
    assigned by the LANANA, or one of the owner''s fully-qualified domain names in
    lowercase.


    # 4.3.1 Init Script Naming


    The LANANA init script names are used by LSB-compliant applications and distributions
    when naming init scripts placed in the `/etc/init.d` directory. Alternatively,
    it is also possible to use a script name that begins with your fully qualified
    Internet domain name or your LSB provider name.


    > 6. http://www.lanana.org/'
