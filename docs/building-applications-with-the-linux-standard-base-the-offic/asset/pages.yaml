    # 2.2.2.1 The Austin Group


    “The Austin Group” is the name given to a joint working group created by the IEEE,
    ISO, and The Open Group in September 1998. These specification bodies agreed that
    the best thing for OS implementors and application developers was to have one
    set of documents that contained the text of the POSIX, ISO, and SUS specifications.
    In this way, conflicts and confusion between the standards, as well as the work
    needed to maintain the various documents, could be reduced.


    This body consists of individual volunteers, including members of the Free Software
    and Open Source communities. The group is chaired by the ISO project editor, and
    the founding bodies (IEEE, ISO, and Open Group) each have one organizational representative.
    The ORs hold controlling votes, which are only used when issues without a clear
    consensus require a vote. IEEE and The Open Group hold joint copyright over the
    resulting work.


    The Austin Group is the actual technical body that produced the standard known
    variously as IEEE POSIX 1003.1–2001, the Single UNIX Specification Version 3,
    and ISO/IEC 9945:2002.


    Information on the Austin Group is available from its Web site.⁶


