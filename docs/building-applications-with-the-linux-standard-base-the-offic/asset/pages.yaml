    # ### 2.4 LSB BINARY COMPATIBILITY


    *Binary compatibility* is the expectation that a properly-coded application, which
    executes successfully and correctly on one instantiation of an operating system,
    will continue to do so on another OS of the same hardware platform. The LSB is
    dedicated to the idea that Linux-based applications can be portable across Linux
    operating system distributions. Now that a specification exists that both operating
    system providers and application developers can agree upon, users are already
    benefiting from increased compatibility of their applications and tools.


    # #### 2.4.1 Binary versus Source Compatibility


    Binary compatibility is not the same as source compatibility. A source code fragment
    that describes the same operation on two instances of an OS can become a binary
    that will only operate on one of them, even on the same hardware platform. Binary
    compatibility is a “contract” between the OS and the application; the OS will
    provide a set of known functions in a specified way, and the application will
    use those functions and avoid other functions for which there is no specification.


    The LSB provides this contract. For the OS, it describes both the set of known
    functions and the known way of making them available. It does this via its programming
    interface (API) and binary interface (ABI) documents for each hardware platform.
    For applications, the LSB offers testing and certification to assure that only
    the functions provided for by the LSB are used.


    # #### 2.4.2 Coding Compatible Applications


    Applications using only the LSB-documented interfaces will run unmodified on all
    LSB-certified OSes for a given hardware architecture family, as described by that
    LSB ABI specification architecture. Application software that meets this specification
    and successfully passes testing using the LSB Application'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'certification process can be considered portable on all members of that architecture.


    This means that the application uses no undocumented interfaces, as well as has
    no dependencies on specific types of hardware (for example, specific mass storage
    devices or specific I/O or networking adaptors). This also means that only LSB-certified
    OSes for that architecture can be relied upon as a base for the application.


    # 2.4.3 Looking Forward


    Applications that are LSB-certified are binary compatible within an LSB release
    set. The LSB does not support application compatibility between major releases.
    However, it may be possible for a Linux distribution to conform to multiple versions
    of the LSB at the same time.


    # 2.4.4 Value Proposition


    In the past, the benefits of source code portability between variants of UNIXes
    and hardware platforms were well established. Today, there is no larger success
    demonstrating binary compatibility than Linux as specified by the LSB. Software
    development evolving from source code portability to binary compatibility is dramatically
    increasing product reliability in this multivendor Linux market. It enables the
    redirection of the time spent on porting and testing to product innovation.


    # 2.4.5 Shrink-Wrapped Applications


    Linux software that is LSB-certified to be binary compatible can be shrink-wrapped
    and sold in retail stores with a longer shelf life and wider customer base. Dependencies
    on specific releases of certain Linux systems are obsolete.'
