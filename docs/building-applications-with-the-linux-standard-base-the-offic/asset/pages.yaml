- pgno: 120
  md: '# **CHAPTER SEVEN**


    # LSB Certification

    for Software Products


    This chapter provides an overview of LSB Certification for application programs
    and is based on the Guide to LSB Certification (http://www.opengroup.org/lsb/cert/)
    produced by The Open Group.


    # ## 7.1 INTRODUCTION


    Products or ranges of products that meet the LSB conformance requirements can
    apply for LSB certification. The certification process requires a demonstration
    of conformance to the LSB Certification Authority (a vendor-neutral third party).
    The detailed requirements for conformance are identified in the LSB Product Standards,
    and include passing sets of tests and completing a Conformance Statement. Only
    suppliers of certified products are permitted to use the LSB trademark in connection
    with their product.¹


    > 1. Portions of this chapter were derived with permission from LSB Certification,
    The Open Group (http://www.opengroup.org/lsb/cert/).'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 7.1.1 Highlights


    Significant highlights of the LSB certification process are outlined below:


    +   - The LSB Certification program is administered on behalf of the Free Standards
    Group by its designated Certification Authority, The Open Group.


    +   - Applicants will be granted a license to use the LSB trademark in connection
    with a product once the product has passed the applicable certification test suite(s)
    and the applicant has formally agreed to all the required terms.


    +   - The LSB Trademark License Agreement must be fully signed (signatures are
    required from both the applicant and the Free Standards Group) in order to have
    a product certified.


    +   - A certified product is subject to recertification on a periodic basis as
    stated in the LSB Certification Policy.


    +   - All product information supplied to the Certification Authority will be
    treated as confidential, as required by the LSB Certification Agreement.


    +   - The LSB Certification Authority may, from time to time, request proof that
    the certified product remains in compliance with the requirements outlined in
    the LSB conformance requirements, as required by the LSB Certification Policy.


    # 7.2 ACHIEVING LSB APPLICATION CERTIFICATION


    This section lists the steps required to achieve LSB Application certification,
    and provides information on how to perform each of these steps. The process involves:


    +   - Understanding the certification program and process


    +   - Testing the product informally


    +   - Applying for certification


    +   - Formal testing and submission of results'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 7.2.1 Understading the Certification Program


    To become familiar with the program, the following program documents should be
    read:


    +   - LSB Certification Policy

    +   - LSB Product Standards


    # 7.2.1.1 LSB Certification Policy


    The LSB Certification Policy document covers more than just LSB Application certification.
    However, it provides information on what it means to be certified, what is required
    to get a product certified, and how to make sure that a product remains certified.
    It states:


    > “LSB Application certification is for applications conforming to the LSB specifications.
    LSB applications are the consumers of the services provided by LSB Runtime Environments.”


    # 7.2.1.2 LSB Product Standards


    The LSB Product Standards should be read to understand the detailed conformance
    requirements against which a product can be certified. The Certification Authority
    Web site should be consulted for the current set of product standards that LSB
    Application products can be certified against.


    # 7.2.2 Informal Testing


    Normally testing a product with the LSB certification test suite(s) is the first
    activity. The Indicators of Compliance section of each product standard identifies
    the required certification test suites. These test suites are freely available
    from the Free Standards Group and should be used, along with any additional method
    deemed appropriate, to make sure that the product meets the applicable conformance
    requirements and is ready for entry into the LSB Certification program.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 7.2.2.1 Guidelines for an LSB-Certified Application


    The following list of guidelines will help you decide whether or not an application
    can be certified as illustrated in Figure 7.1. A compliant application has at
    least the following properties:


    +   * Only relies on LSB-specified interfaces to be provided by the runtime environment
    it executes on (see Section 13.3.3)

    +   * Is linked against the LSB runtime linker and LSB stub libraries, or versions
    of libraries that by default provide LSB versions of interfaces for linking against
    (see Section 13.3.1)

    +   * Either statically links non-LSB libraries, or bundles the shared libraries
    with the application

    +   * Passes the `lsbappchk` test (see Section 13.5.2)

    +   * Is FHS-compliant (see below)

    +   * Passes the functional verification testing on the LSB Sample Implementation
    and two other LSB-compliant systems (see Section 12.3)

    +   * Is packaged in the RPMv3 format (with the restrictions as outlined in the
    specification) or uses an installer that is LSB-compliant itself (see Section
    4.1)


    # FHS compliance


    For LSB certification, applications must conform to the Filesystem Hierarchy Standard.
    During the certification process there is the following FHS questionnaire to be
    answered:


    ![](img/d75cffbcb54aabfb0f9854162061d394_123_0.png)


    Figure 7.1: LSB Application Certification'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - Is the application installed into /opt/package/ or /opt/provider/ ?

    +   - Is the application to be invoked by the end user via the library installed
    into /opt/package/bin/ or /opt/provider/bin/ ?

    +   - Are the man pages of the application installed in /opt/package/man/ or /opt/provider/man/
    ?

    +   - Are the variable files of the application created in /var/opt/package/ or
    /var/opt/provider/ ?

    +   - Are the host-specific configuration files of the application kept in /etc/opt/
    ?

    +   - Are there other package files that reside outside /opt/, /var/opt/, and
    /etc/opt/ (e.g., /var/lock/ or /var/run/)?


    # 7.2.2.2  Authorized Test Suites


    It should be noted that, for formal testing for LSB Application certification,
    only currently authorized versions of the LSB certification test suites can be
    used. So, for informal testing it is vital that an authorized version is also
    used to avoid later problems. The Certification Authority maintains a list of
    the currently authorized certification test suites.$ ^{2} $Since the test suites
    come from multiple sources, this online document includes information on how to
    obtain the test suites.


    # 7.2.3  Registering an LSB Application Product within the Web Certification System


    The LSB Application certification uses the same Web certification system as for
    the LSB Runtime Environment certification. For brevity, we include an overview
    in this chapter detailing the differences of LSB Application certification. See
    also Chapter 6 for more details on a Conformance Statement, product amendments,
    and renewals that apply equally to LSB Application certification.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'When a product is registered, a number of product details have to be provided,
    including the product name and the version or release for which conformance has
    been demonstrated.


    The supplier must select the LSB product standard against which certification
    is being sought, then optionally enter a product-related Web address. The LSB
    Certification Agreement must be accepted in order to proceed with this product
    registration.


    The product registration form is then displayed with additional fields for the
    supplier to provide the product standard specific information described below.


    **LSB Application Specific Details.** For an LSB Application, the supplier needs
    to warrant and demonstrate that the product executes correctly in a number of
    environments. The first of these environments is the LSB Sample Implementation.
    Secondly, the product needs to run correctly on two different LSB Runtime Environments,
    of which one can be chosen by the supplier and the other is selected by the Certification
    Authority.


    Suppliers are required to make their own arrangements to obtain the LSB Runtime
    Environments for testing. The Certification Authority is unable to provide assistance
    other than the contact information on the Certification Register. The Free Standards
    Group may be able to assist with obtaining a runtime environment.


    At the final stage of registering a product within the Web certification system,
    a form requires a declaration that the supplier warrants and has demonstrated
    that the application executes correctly in the required environments.


    # ## 7.2.4 Uploading a Conformance Statement


    The Web certification system will lead the supplier through the steps to register
    a product to be certified. The first document that must be uploaded to the certification
    system is the Conformance Statement for the product.


    The next steps are to perform formal testing and then upload the test results
    as a sequence of files into the Web certification system.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 7.2.5 Formal Testing for LSB Application Certification


    Formal testing is a self-test activity whose results are submitted to the Certification
    Authority for audit, via the Web certification system. Only authorized test tools
    are valid for certification.


    When a test campaign requires the warranty of the product working in a particular
    situation, or the warranty that selected applications execute correctly on the
    product, then a Web form will prompt for confirmation of that during the final
    registration stage and allow for a problem report ID to be referenced for any
    problems encountered.


    # 7.2.5.1 Test Journals


    Test results submitted should always include the full journal output from an uninterrupted
    run of the applicable test suite. If this is not possible, a problem report must
    be raised stating the nature of the problem and a response received from the Certification
    Authority before proceeding further.


    Within the Web certification system, the supplier is required to upload test journals
    for each applicable test suite. The system also allows the supplier to obtain
    a summary report of the result status for a test journal. If this test journal
    is the formal certification test run for a product, the supplier must select the
    validation tool within the Web certification system. This will then automatically
    analyze the test results, and if there are no failed test results or tests requiring
    manual resolution, then the journal will be flagged as OK in the system. If there
    are failed test results detected by the validation tool, then a screen will be
    presented with a list of test cases that need to be resolved.


    In the test journal, the failed test results that require resolution are those
    with a status of FAIL, UNINITIATED, UNRESOLVED, or UNREPORTED. The resolution
    process requires the supplier to enter a valid reference to an approved problem
    report from the Problem Reporting database for each failed test case. An approved
    problem report is one that has resulted in an agreed Interpretation of the specification,
    a Test Suite Deficiency, or a Certification System Deficiency. Each of these applies
    to a specific release of the specification, test suite, or certification system.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '7.2.5.2   Test Campaign Definition


