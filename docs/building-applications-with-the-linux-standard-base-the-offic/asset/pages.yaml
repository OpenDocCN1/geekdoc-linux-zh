- pgno: 164
  md: '# 11.2.4.1 Understanding TET Result Codes


    Executing test cases will result in the creation of journal files. The result
    codes

    from the test cases are found in the journal files in /home/tet/test_sets/

    results/xxxx/journal, where xxxx is a four-digit number starting at 0001

    that is increased with each test suite run. Results of test case compilations
    are

    placed in journal files in a similarly named directory except ending in “b”

    instead of “e”. Result codes are found in the following journal files:


    **vrpt** The *vrpt* will generate a report detailing all of the test cases executed

    and the result. There are several result types that can be separated into

    two main groups, PASS or FAIL; see below for result classification.

    For test cases that did not pass, the test assertion and test strategy will

    also be output.


    **tjreport** The binary test suites are also supplied with the **tjreport** tool.

    This will produce a summary of all the test cases run and the results,

    or optionally only display those that failed. It can also be used to intel-

    ligently compare two journal files and display those test cases whose

    results differ between the two test runs.


    **Raw journal files** If you want to interpret raw journal files manually, see

    Appendix C of the TETware User Guide.[2] This guide describes the

    format of the file.


    The following lists explain the passing and failing result codes for TET.


    # Passing result codes


    +   * **PASS** The test has been executed correctly and to completion

    +   without any kind of problem.


    +   * **WARNING** The functionality is acceptable, but you should be aware

    +   that later revisions of the relevant standards or specifications

    +   may change the requirements in this area.


    +   * **FIX** Additional information is provided, which needs to be checked

    +   manually. FIX results occur when, by default, the test suite is'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'unable to determine whether a result is a PASS or FAIL. For LSB Certification
    you have to sign these off as resolving to PASS when you submit your test results
    into the Web certification system.


    **UNSUPPORTED** An optional feature is not available or not supported in the implementation
    being tested.


    **NOTINUSE** Some tests may not be required in certain test modes. Also, when
    an interface can be implemented by a macro or function and there are two versions
    of the test, only one is used.


    **UNTESTED** No test is written to check a particular feature, or an optional
    facility is needed to perform a test which is not available on the system.


    # Failing test codes


    The following result codes are considered to be a fail for compliance testing
    purposes (unless the failure has been waived by an agreed problem report in the
    Problem Reporting database).


    **FAIL** The interface did not behave as expected.


    **UNINITIATED** The particular test in question did not start to execute.


    **UNRESOLVED** The test started but did not reach the point where the test was
    able to report success or failure.


    **UNREPORTED** A major error occurred during the testset execution.


    ![](img/d75cffbcb54aabfb0f9854162061d394_165_0.png)


    > For these result codes, F stands for *function*, and M stands for *macro*. The
    operating system testset driver automatically generates tests for the macro version
    of each interface in addition to the underlying function. In general, not many
    function interfaces are implemented as macros, hence the high NOTINUSE count in
    that column.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# ### 11.2.5 Debugging TET-Based Test Suites


    This section explains how to analyze test failures in the TET-based test suites.
    There is also additional TET documentation available.³


    The following list explains some general debugging hints:


    +   * The `in_rpt()` call works similarly to `printf()` and the output is put
    into the journal file.

    +   * Edit the makefile for the test case (it is in the same directory as the
    code for the test case), and add debugging flags to the compile line.

    +   * Many of the tests fork and execute the test code in the child, or have some
    form of communication with the parent. It can be useful to add `sleep()` calls
    in places to make it easier to attach with a debugger (especially when **gdb**
    is resisting following forks).

    +   * It is often useful to write a small standalone program, using the test case
    code as a guide, that attempts to do the same things as the test. It helps to
    isolate implementation problems from test case and test harness problems and can
    be easier to debug. Also upstream maintainers will appreciate (if not insist on)
    having an easily compilable and executable test program when fixing bugs.


    # #### 11.2.5.1 Setting Up the Debugging Environment


    To set up the environment for debugging TET-based test suites, you must log in
    as the user `v$x$0` and dot in the profile file in the `v$x$0` home directory
    as follows:


    ```

    v$x$0 . profile

    ```


    ![](img/d75cffbcb54aabfb0f9854162061d394_166_0.png)


    > There is a limited amount of analysis that can be done with the binary versions
    of the test suites alone, as they are compiled without debug symbols.


    3. http://tewrorks.opengroup.org/documents/docs33.html'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'You can also enable some debugging information to be output during the execution
    of the tests by editing the file `/home/tet/test_sets/TESTROOT/tetexec.cfg`. This
    script automates the standard build and setup procedure for TET and VSXgen. Edit
    the setting for `VSX_DEBUG_FLAGS` as follows:


    ```

    VSX_DEBUG_FLAGS=t:d,trace:1,2

    ```


    The setting `VSX_DEBUG_FILE` in the same file specifies where the debug information
    is placed. With reference to the source code for the test suite, it''s often possible
    to work out the code path executed. The source tarballs are available on the LSB
    Download Web site.$^{4}$


    # 11.2.5.2 Debugging Individual Test Cases


    This section explains how to debug individual test cases with and without the
    **tcc** (test case controller) command.


    Debugging individual test cases with tcc. If you only want to debug individual
    test cases, you can save time by not using the script for build and setup. You
    can execute individual test cases for debugging using one of the following **tcc**
    commands:


    +   `vxs05 tcc -e` The `tcc -e` command works similarly manner to the `tcc -b`
    command but in executing test cases. This command will execute all of the test
    cases.


    +   `vxs05 tcc -e T.fgetpos` This command will execute only the `T.fgetpos` test.


    The `tcc -b` (build mode) and `tcc -e` (execute mode) are shell functions that
    call `tcc`. You can find out more details on the uses of `tcc` in Chapter 6 of
    the TETware User Guide.$^{5}$


    For information on debugging individual test cases without `tcc`, see Section
    11.2.5.4.'
  merge: -1
  img_proc: true
