    # 6.3.8 Completion of Certification


    If the submission is complete and an LSB Trademark License Agreement is in place,
    the supplier will be notified of successful certification within 15 calendar days.
    If for any reason the submission was not complete, the supplier will be notified
    so that any corrections can be made and resubmitted. Such a resubmission needs
    to be done within 60 calendar days unless an extension has been granted by the
    Certification Authority. The initial fee covers one set of corrective actions.


    The details of the certified product will then be put on the Certification Register,
    which is a public document, unless it has been requested that the certification
    remains confidential. To keep the certification confidential, this option must
    be selected in the Web certification system at the time the product is submitted.


    When a product certification has been made public, the supplier will be sent a
    certificate by electronic mail.


    Certification is valid for a certain period as defined in Section 8.1, Duration
    of Certification, of the LSB Certification Policy. At the end of that period,
    if the supplier wishes the product to remain certified, the certification of the
    product will need to be renewed (see Section 6.4.1).


    For the product standards, such as the LSB Internationalized Runtime Environment,
    that are built upon other product standards, the following rules apply. If registration
    is occurring at the same time as the other product standard, then the duration
    of certification is the shorter one of the two defined durations. Otherwise, if
    the registration references a preexisting product standard certification for the
    product, then the duration for the additional product standard ends on the end
    date associated with the existing certification.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# **6.3.9 Appeals Process**


    Suppliers may appeal decisions made by the Free Standards Group or the Certification
    Authority as stated in Section 10, Appeals Process, of the LSB Certification Policy.
    Any request for appeal should be sent by electronic mail to lsb-cert@pengroup.org.
    Receipt of such a request will be acknowledged within six working days by the
    Certification Authority and the appeals process will be invoked.


    # **6.4 RENEWALS AND CERTIFIED PRODUCT UPDATES**


    # **6.4.1 The Renewals Process**


    A certified product has a defined duration of its initial certification, after
    which it must be renewed or the product will no longer be certified. The Certification
    Authority will notify the supplier about two months in advance by electronic mail
    when a renewal is due (it is important to keep contact information current). At
    any time, the supplier may use the Web certification system to obtain the renewal
    dates for certified products.


    Renewal implies that the product continues to conform and that the supplier will
    continue to support the product for the duration of the renewal period. Consult
    the Certification Authority Web site for more information on renewal policy and
    on how renewals are undertaken.


    # **6.4.2 Certified Product Updates**


    If any changes are made to a certified product, the supplier may be required to
    retest or recertify as required by Section 6, Scope of Certification and Requirements
    for Product Retest and Recertification, of the LSB Certification Policy. The supplier
    should read that section thoroughly since it describes multiple scenarios related
    to product changes, some of which require a certification-related activity. In
    some cases, a complete full certification is required since the update is equivalent
    to a new product so far as certification is concerned.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 6.4.2.1 Maintenance Releases


    If the change to a product qualifies as a maintenance release (as defined in Section
    6.1, Maintenance Releases, of the LSB Certification Policy), the supplier is not
    required to contact the Certification Authority.


    Suppliers may request an update to a product’s certification information to include
    the maintenance release. Depending on how the maintenance release is described,
    this may be a wise thing to do so as to avoid marketplace confusion regarding
    which versions of the products are certified. Updates to the certification information
    of a product can be done by contacting the Certification Authority.


    # 6.4.2.2 Renaming a Product


    If a supplier decides to rename a certified product (as defined in Section 6.3,
    Renamed Products, of the LSB Certification Policy), they should contact the Certification
    Authority including the details of the required change and a written statement
    to the Certification Authority indicating that there have been no material changes
    to the certified product. The Certification Authority will change the product
    name on the Conformance Statement and in the Certification Register and issue
    a new certificate.


    If a product is a submission in progress and has not yet been submitted for audit
    to the Certification Authority, then renaming the product can be done using the
    Web certification system.


    # 6.4.2.3 Rebranding a Certified Product


    If a supplier wants to rebrand a product (as defined in Section 6.4, Re- branded
    Products, of the LSB Certification Policy), they should locate and read the Conformance
    Statement for that product to obtain information on the product supplier’s policy
    with respect to rebranding. First, the supplier should find out whether they have
    the permission required for rebranding. Then they proceed into the Web certification
    system as if they were certifying a new product, except that when asked to input
    information about the product, they should select that this is a rebranded product.


    The main difference between a rebranded product registration and a new product
    registration is that no test results are required to be submitted.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Upon submission, the Certification Authority will verify that a supplier has
    permission.


    # 6.4.2.4  Other Scenarios


    Other scenarios are treated as new products and are subject to full certification.


    # 6.5    CURRENTLY SUPPORTED SYSTEMS


    The LSB is one of the most successful ABI standards in the history of the Information
    Technology industry. Every major GNU/Linux distribution is LSB-certified, and
    LSB conformance testing has become a staple of quality assurance for everyone
    concerned. A current list of LSB-certified distributions and applications can
