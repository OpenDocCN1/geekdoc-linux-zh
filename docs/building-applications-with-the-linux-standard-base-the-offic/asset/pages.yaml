- pgno: 170
  md: 'To run test binaries directly, complete the following steps:


    +   1. Log in as `vsx0`.

    +   2. Set the following environment variables:


    ```

    `vsx0$ export TET_CONFIG=\${TET_EXECUTE}/tetexec.cfg`

    `vsx0$ export TET_CODE=$HOME/tet_code`

    ```


    +   3. Change to the directory containing the test case and run the executable.

    +   A journal file will not be created, but the contents of what would have been
    placed in the journal file for that test will be left in `tet_xres` in the current
    directory.


    # 11.2.5.5    Executing a Single Test Case


    The lowest level of granularity in the `lsb-runtime` test allows you to execute
    individual tests. Most tests can be executed in this way, but some are dependent
    upon execution of earlier tests in the testset, in which case only groups of dependent
    tests may be executed as a single unit.


    The `tcc` can perform a one-off execution of selected test cases from a single
    testset. For example, to run test cases 3, 7, and 8 from the `T.write` test case
    in the `POSIX.os` category, use the following command:


    ```

    `vsx0$ tcc -e -l /tset/POSIX.os/ioprim/write/T.write{3,7,8}`

    ```


    # 11.2.5.6    Running Only the Tests That Failed


    To execute testsets that failed during a previous run, use the following command:


    ```

    `vsx0$ tcc -e -r code-list other-options old-journal-file`

    ```


    The `code-list` is a comma-separated list of result codes to be reexecuted. The
    `other-options` are the other `tcc` options (for example, `-y` or `-n`). The `old-journal-file`
    is the journal file the codes are extracted from. For example, to reexecute all
    the tests that failed with `FAIL`, `UNRESOLVED`, and `UNINITIATED` codes from
    journal file `results/0002e/journal`, use the following commands:'
