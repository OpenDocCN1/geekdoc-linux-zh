- pgno: 279
  md: '# Building Applications with the Linux Standard Base


    Written by Core Members of the Linux Standard Base Team


    An initiative of the Free Standards Group, the Linux Standard Base (LSB) is a
    set of standards designed to increase compatibility among Linux distributions
    and enable applications to run on any LSB-compliant system. The advent of LSB
    2.0 is revolutionary in that it allows ISVs to create “shrink-wrapped software”
    for the Linux platform much in the same way they already do for Windows.


    Written by the team that created the LSB, Building Applications with the Linux
    Standard Base shows developers how to create, test, and certify software for LSB
    2.0 compliance. The book’s hands-on approach lets readers quickly understand how
    to write Linux applications that are portable across multiple distributions, including
    those from SuSE, Mandrake, and Soloris. The accompanying CD-ROM contains the full
    LSB 2.0 specification and the sample program files used in the book.


    # Coverage includes


    +   LSB coding practices

    +   Software packing and installation issues

    +   UNIX-to-Linux migration tips

    +   Testing Linux distribution and applications for LSB compatibility

    +   Examples of applications using the LSB

    +   Relevant standards for Linux


    # Authors of This Book:


    Stuart Anderson

    Mark Brown

    Kevin Caunt

    Marvin Heffiler

    Andrew Josey

    George Kraft IV

    Scott McNeil


    Radhkrishnan Sethuraman

    Matt Taggart

    Kristin Thomas

    Theodore Ts''o

    Mats Wichmann

    Chris Yeoh


    ![](img/d75cffbcb54aabfb0f9854162061d394_279_0.png)


    www.freestandards.org


    “Community-built software and community-built standards are two sides of the same
    coin. Standards help ensure that the freedom to invent—the essence of Open Source
    and Linux—doesn''t compromise the ability to write software that works together
    effectively. The LSB is an important set of standards for the Linux community.”


    —Brian Behlendorf, Apache Software Foundation, CollabNet


    “In the days before the LSB, every change, every improvement we wanted to make
    to our Linux product was subject to somebody saying “But wait! I depend on that!”
    The LSB laid out what interfaces were defined and how they should be used. Since
    the LSB was adopted, we have been free to innovate without fear of breaking somebody
    else’s assumptions. The success of the LSB recommended it as the starting point
    for the U.S. Department of Defense’s Common Operating Environment (COE) specification
    for Linux. Without the LSB, there would be no COE-certified Red Hat products today.”


    —Michael Tiemann, Chief Technology Officer, Red Hat, Inc.


    iBM Press

    Pearson plc

    Upper Saddle River, New Jersey 07458


