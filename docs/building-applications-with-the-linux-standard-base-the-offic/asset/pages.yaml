    quickly by doing a “cvs update”). For an example using a release-tag snapshot,
    see the build instructions in Section 12.4.2.


    You can browse the CVS tree Web interface to determine the available release tags.


    You will also need to check out (or export) the tools/nALFS directory to get the
    build tool. Again, see Section 12.4.2 for an example.


    Source code for the patches to the base tarballs is in the CVS tree in si/build/patches.
    These patches should be copied to the package source directory. The base tarballs
    must be obtained separately. Once the build area has been configured, a provided
    tool can be used to populate the package source directory.


    The same tool (extras/entitycheck.py) can be used to check if all the necessary
    files are present before starting a build. With a -c option, it will do a more
    rigorous test, checking mod5ums, not just existence. Every effort has been made
    to describe reliable locations for the files, but sometimes a project chooses
    to move an old version aside after releasing a new one (if they have a history
    of doing so, the location where old versions are placed is probably already captured).
    The packages are also mirrored on the Free Standards Group Web site.5 Still, retrieval
    sometimes fails; entitycheck.py will inform of missing files and the expected
    locations are listed in extras/package_locations so it''s possible to try to fetch
    the missing packages manually.'
