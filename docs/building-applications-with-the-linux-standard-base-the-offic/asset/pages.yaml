- pgno: 139
  md: 'module API. This is problematic for two main reasons. The first is that it
    fails the criteria that requires support of the upstream developer. The Linux
    kernel community has explicitly stated that they will not commit to an ongoing
    standard interface because they want to be able to change that interface as needed
    when it makes sense. The second reason is that the LSB has yet to define anything
    kernel-related and would prefer to keep it that way in order to not preclude runtime
    implementations on non-Linux systems.


    # 8.5.2   Interpreted Languages


    Another common request is for interpreted languages such as Perl, Python, and
    Tcl/Tk. The main reason that these are currently blocked is the lack of a formal
    standard that the LSB can reference. Most of these languages have stable interfaces,
    what’s needed is a formal specification that the upstream maintainer will stand
    behind.


    # 8.5.3   License Issues


    Some candidates fail to meet the LSB license criteria due to the fact that the
    only existing implementation is under a license, such as the GPL, that requires
    anyone using that interface to also release the source code to their software.
    The LSB seeks to maximize the numbers of people using free standards and FLOSS.
    The license criteria was selected as a way of providing a “no strings attached”
    environment. If the only viable implementation of an interface is licensed under
    the GPL or a similar license, then the LSB would become less appealing to those
    not willing to use restrictive licenses. This is essentially the argument for
    the existence of licenses such as the LGPL, whose terms allow the use by all programs
    so that the interface can be put into much wider use.


    For example, the LSB Futures subcommittee is tracking two windowing toolkits,
    GTK+ and Qt. GTK+ is currently proceeding as it is licensed under the LGPL and
    requires the normal efforts to be added to the Written Specification. Qt, on the
    other hand, is currently blocked since the only implementation is covered by a
    dual license, either QPL (GPL terms, requires release of source) or commercial.
    This has generated quite a bit of discussion on the mailing list. Qt continues
    to be tracked, and if an implementation that meets the license criteria becomes
    available, it will be unblocked and can proceed.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# **8.6  HOW TO GET YOUR FAVORITE INTERFACE ADDED TO THE LSB**


    The LSB processes are designed to not get in the way of people wanting to contribute.
    If you have a candidate that you would like to see added to the standard, you
    can request that it be tracked as a candidate. If the work gets done to make the
    candidate fulfill the criteria, then it can be added. The only thing limiting
    when something can be added to the LSB is how quickly the criteria can be fulfilled.
    The LSB workgroup would love to see additional interfaces added and encourages
    all to participate.'
