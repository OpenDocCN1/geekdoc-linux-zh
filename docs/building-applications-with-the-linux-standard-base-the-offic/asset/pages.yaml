- pgno: 222
  md: '# CHAPTER FOURTEEN


    # Using the Application Battery


    The **LSB Application Battery** is a collection of several open source applications
    built to comply with the LSB Written Specification. The LSB project provides these
    applications to be used as further proof that a Linux distribution is able to
    support installation and execution of LSB-compliant applications.


    Certification of a Linux distribution requires several methods to ensure compliance
    with the LSB Written Specification. The LSB Runtime test suite is used to test
    for the proper behavior of many of the system APIs. The LSB library checker verifies
    that all LSB-specified shared libraries and their respective APIs are present
    on the system. The third major test for compliance of a Linux distribution is
    the **LSB Application Battery**.


    The choice of applications in the Battery is designed to exercise all of the LSB-specified
    shared libraries in a more real world situation. Using the Application Battery
    in this way complements the LSB Runtime test suite to provide a more thorough
    validation of a Linux distribution.


    A further area where the **Application Battery** is useful is in its use of the
    **LSB Development Environment**. By using the Development Environment to build
    applications that use all of the LSB shared libraries, it helps to identify any
    deficiencies present in the header files and stub libraries of LSB Development
    Environment. Because the `lsbdev` is created directly from the data used in the
    Written Specification, it uncovers any problem with the specification itself.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Finally, beyond its use in testing Linux distributions and in validating `lsbdev`
    the Application Battery can be used to show application developers what steps
    are necessary to build a typical application to be compliant with the LSB.


    Before going any further in discussing what the Application Battery (appbat) is
    and how it is used, it needs to be mentioned what appbat is not. The applications
    in appbat should not be considered for use in a production environment. Although
    building these applications for LSB compliance required minimal modifications
    from the upstream source, the LSB project has only performed minimal testing.
    The purpose of appbat is not to create production-ready substitutes for the same
    applications shipped with a Linux distribution. Instead, the applications in the
    Battery should only be used to test a Linux distribution for adherence to the
    LSB Written Specification.


    # ### 14.1 UNDERSTANDING THE APPLICATION BATTERY


    # #### 14.1.1 Common Open Source Applications


    The LSB Application Battery is a collection of common open source applications
    that have been built using the LSB Development Environment to ensure they comply
    with the LSB Written Specification. In some instances, the application was simply
    recompiled to ensure the LSB dynamic linker is used instead of the system linker.
    A few of the applications have small patches applied to them to fix simple problems
    where the application was using a non-LSB argument type, or where a configure
    script produced wrong results when used with the `lsbdev`. For a few others, there
    are more significant patches. One example is the `rsrc` application which uses
    the deprecated `getpass()` API. The patch for `rsrc` replaces the use of `getpass()`
    with a call to `getpassword()`, a subroutine written specifically for the LSB
    version of `rsrc` that provides the same return value as that expected from `getpass()`.


    The choice of applications that comprise appbat was influenced by several factors.
    First of all, the applications needed to exercise as many of the LSB-defined shared
    libraries as possible. This was done to augment the testing already being done
    on the libraries by way of the LSB Runtime test suites. Another factor was the
    need to include applications that are open source and'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'use a license allowing the LSB team to redistribute them along with the other
    test tools. To be considered for inclusion in appbat, an application also had
    to be fairly close to complete adherence to the LSB Written Specification. This
    means it could not use any non-LSB APIs from the LSB shared libraries, and only
    use a minimal number of non-LSB shared libraries.


    For the initial LSB v1.2 Certification program, appbat only consisted of four
    applications, of which only two needed to be tested. When the LSB v1.3 Certification
    program began, the number of applications increased to eleven for the Intel 32-bit
    architecture, eight for the Itanium architecture, and ten for the PowerPC 32-bit
    architecture. An additional requirement for LSB v1.3 is that all LSB Certification
    Ready applications in appbat must be used when certifying an LSB Runtime Environment.
    An application is considered LSB Certification Ready when it has met all the requirements
    for LSB Application certification, including things like passing the LSB application
    checker, executing properly in the LSB Sample Implementation, and executing properly
    in two different LSB Certified Runtime Environments. Here is a list of the eleven
    applications in appbat for the LSB v2.0 Certification program for all supported
    processor architectures:


    +   - Apache—Web server

    +   - Celestia—visual space simulation

    +   - expect—application that “talks” to other programs

    +   - groff—document formatting system

    +   - Lynx—text-based Web browser

    +   - Python—interpreted, interactive, object-oriented programming language

    +   - rsync—program for synchronizing files over a network

    +   - Samba—file and print server for SMB/CIFS clients

    +   - Tcl—embedded scripting language

    +   - XPaint—paint program for the X Window System

    +   - xpdf—PDF file viewer for the X Window System'
