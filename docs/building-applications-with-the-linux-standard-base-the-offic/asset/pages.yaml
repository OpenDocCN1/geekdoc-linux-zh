    2. http://www.linuxbase.org/download/'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'function allows older applications to continue to use the old version, while
    new applications can use the new version.


    When a binary is created, it inspects the shared library it is linking against
    and records the versions of those interfaces it requires. At runtime, the binary
    will look for the interfaces with the recorded version number, and fail if they
    do not exist. Thus, it is necessary to link against shared libraries that contain
    the versions of the interfaces guaranteed to exist on an LSB-compliant runtime.


    Where libraries supported by the LSB use symbol versioning, the specification
    lists specific versions of the interfaces. The LSB stub libraries only contain
    the versions of the interfaces allowed by the LSB Written Specification, and so
    if they are used, it is impossible to use a wrong version when building a binary.


    Often there are interfaces contained in shared libraries that must not be used
    by an LSB-compliant binary. These interfaces are often private functions, or interfaces
    not supported by the LSB. Since the stub libraries only contain interfaces required
    by the specification, an error will occur during the linking stage if an application
    uses an unsupported interface.


    # ### 13.3.2 LSB Header Files


    The definitions contained within a header file associated with a library may change
    over time as the ABI of that library evolves. For example, a function in one version
    of the library may take one parameter, while in the next version it may take two
    parameters.


    The LSB Written Specification defines an ABI for each supported library, and the
    header files used to compile against that library must match exactly. In order
    to avoid the problem of finding the exact version of the software that contains
    the correct definitions, header files matching the specification are supplied
    with the LSB Development Environment.


    # ### 13.3.3 Using the Development Tools


    There are currently two development tools, `lsb-build-chroot` and `lsb-build-cc`,
    that compile and link against compliant headers and libraries.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Using these tools is an easy way to build an LSB-compliant application. Both
    tools use the `lsb-build-base` package. This package contains the LSB header files
    and stub libraries.


    # **13.3.3.1** lsb-build-chroot


    The `lsb-build-chroot` uses the **chroot** command to create a virtual LSB platform
    development environment on your machine. By default, it presents a minimal environment
    which, wherever possible, does not contain header files or libraries that, if
    compiled against, would lead to a binary that is not LSB-compliant. Within this
    environment, the `/usr/include` contains the LSB header files and the `/usr/lib`
    contains the LSB stub libraries.


    To generate the virtual environment, the `lsb-build-chroot` uses bind mounts instead
    of copying the entire directory structure, so the disk space requirements are
    minimal. It also means that changes (such as compiling a binary) made within the
    environment are reflected immediately outside the environment, and vice versa.


    You do not need root access to use `lsb-build-chroot` because it is implemented
    with an **ssh** daemon which is run on a high-port. The `ssh` daemon bind-mounts
    your home directory into the *chroot* environment, so you can log in to the restricted
    environment for compilation. You can also run a full editing and debugging environment
    outside of the `chroot` operating on the same files that you are compiling within
    the restricted environment.


    In cases where applications need to compile or link against libraries that are
    not LSB-compliant, you can specifically import those libraries and header files
    into the *chroot* environment. Depending on the sophistication of the build process
    for your application, you might also have to import other tools into the environment
    so that they can run correctly.


    ![](img/d75cffbcb54aabfb0f9854162061d394_207_0.png)


    The bind mounts might cause problems if you update system packages while `lsb-build-chroot`
    is running.'
  merge: -1
  img_proc: true
- pgno: 208
