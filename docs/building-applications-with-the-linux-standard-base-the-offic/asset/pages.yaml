  md: 'The LSB trademark can only be used by LSB-certified applications; no other
    statement of compliance can be made. For more information, see Section 7.2.


    # 2.2 SOURCE CODE STANDARDS


    The standardization of a set of Application Programming Interfaces (APIs) for
    the purpose of recompile compatibility between systems is a source code standard.


    # 2.2.1 POSIX


    The Institute of Electrical and Electronics Engineers (IEEE) is the group that
    has developed and continues to develop the POSIX family of standards. Beginning
    in the mid-1980s, this group picked up on the work already done by the UNIX user
    organization UniForum (the 1984 /usr/Group Standard) and began to produce an operating
    system standard under Project 1003 (POSIX).


    The best known POSIX document is IEEE Std 1003.1 (also known as POSIX 1003.1),
    but the term “POSIX” actually covers a set of related operating system specifications.
    The various subprojects instituted under 1003 are staffed by individual volunteers
    representing a cross-section of skills such as hardware manufacturing, OS development,
    software and tools development, academia, governments, and more.


    The name POSIX was suggested by Richard Stallman, one of the participants. It
    is pronounced pahz-icks, as in positive.


    As stated in the cover material for these standards, there were several principles
    guiding their development, the key ones being application source portability,
    specification of the interface without requiring a particular implementation,
    and reliance on historical practice.


    Another goal is *consensus*. There are some features of historical (and modern)
    UNIX-based operating systems which are not found in POSIX, because no consensus
    could be reached at the time work was being done. This is the reason there is
    no mention of either **tar** or **cpio** in the 1003.2 specification, for example.
    Where there was no consensus, the feature was left out to'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'produce a specification with a high enough level of approval to pass the IEEE
    voting rules: at least a 75% return on ballots; no more than 30% of eligible ballotters
    abstaining; at least 75% "yes" votes.


    More information about the Portable Application Standards Committee (PASC), the
    guiding body for IEEE POSIX, is available online. 2


    # 2.2.1.1  *POSIX 1003.1 System Application Interface (C API)*


    Together with 1003.2 (discussed in Section 2.2.1.2), 1003.1 is the base upon which
    the POSIX family of standards has been built. This is the "API and header files"
    part of the pair, the other being the "shell and utilities." In keeping with its
    original focus on the UNIX system, it is aimed at interactive timesharing computing
    environments.


    POSIX 1003.1 was first published in 1988. A revised edition was published in 1990.
    The 1990 edition became an international standard, ISO/IEC 9945–1:1990.


    In 1996, a new edition was created, which added realtime and threads features
    as optional extension sets to the base 1990 standard. This also became an international
    standard, ISO/IEC 9945–1:1996. After that, other optional feature sets were created,
    but remained separate documents (called *amendments* to the base 1990 standard)
    until 1999.


    A major revision of the core standard, approved in 1998, rolled up the various
    amendments, options, and interpretations. The proposal also merged 1003.1 with
    1003.2 to create one document encompassing the OS space. The result is known as
    IEEE POSIX 1003.1–2001, comprised of four volumes totaling 3,760 pages.


    # 2.2.1.2  *POSIX 1003.2 Shell and Utilities*


    This specification defines a portable shell scripting environment (the so-called
    *POSIX shell*) and a base set of portable utilities. In some places, where there
    was no consensus on the current tools (and a definite need was shown), a new tool
    was invented. The *pax* archive tool is an example of this.


    2. http://www.pasc.org/'
