  md: 'developers, there are many ideas for interfaces the developers would like to
    see in the standard. The LSB Futures subcommittee solicits these suggestions,
    gathers, and organizes them. This organization helps to clarify suggestions (often
    several people suggest the same thing, but in different ways) and gauge the level
    of demand for an interface.


    # 8.3.2 Analysis of Existing Code


    In addition to the input directly from Linux developers, several methods have
    been identified to programmatically determine the interfaces most in demand by
    developers.


    +   - Linux distribution dependencies By examining packaging dependencies of the
    major distributions, we can make guesses at what interfaces are most often depended
    on. These packages might be good candidates for standardization.


    +   - Linux distribution base components The packages that major distributions
    include in their "base install" are important and represent the collective wisdom
    of the users and maintainers of the distribution. These packages might be good
    candidates for standardization. A large portion of the packages in a base system
    are the things that make a distribution unique, but the things that don''t fall
    into that category are often common across distributions and are therefore good
    candidates.


    +   - Existing commercial application dependencies By examining existing commercial
    application binaries it can be determined what interfaces they depend on and what
    other system features they expect to have available.


    # 8.3.3 Standards Ideas


    The previously mentioned methods are good for identifying library interfaces but
    are rarely helpful in identifying other things about the system that would benefit
    from standardization. The LSB Futures subcommittee also spends time brainstorming
    ideas for standards to solve these types of problems.'
