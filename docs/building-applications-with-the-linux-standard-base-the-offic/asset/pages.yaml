  md: '# 11.3 Using Non-TET-Based Tests


    # 11.3.1 Using lslibchk


    The **lslibchk** verifies whether the runtime system libraries for the current
    system appear to conform to the LSB. The **lslibchk** checks the object format,
    whether all of the required libraries are present, whether the libraries contain
    all interfaces required by the LSB, and whether the interfaces have the symbol
    versions required by the LSB. The **lslibchk** then prints warnings for any problems.


    You can also use **lslibchk** to check only the libraries in a specific module
    using the *-M* flag.


    # 11.3.1.1 Installing lslibchk


    To install the binary RPM package for **lslibchk**, complete the following steps.


    +   1. Download the package from `http://www.linuxbase.org/download/`.

    +   2. Install the binary RPM package:


    ```

    ```

    # rpm -i lslibchk-version.architecture.rpm

    ```

    ```


    # 11.3.1.2 Running lslibchk


    You can run **lslibchk** by executing the following command:


    ```

    ```

    # /opt/lsb/bin/lslibchk [-M modulename]

    ```

    ```


    **Example 11.4** shows the output of **lslibchk**.


    If there are any problems with the libraries, error messages will be displayed
    under the appropriate library symbol checking message. If your runtime environment
    contains more than one version of a library required by the specification, you
    should also verify that the correct library is located by the test program.


    A file named *journal.1.lsbeck* (Example 11.5) is produced that contains detailed
    information on the tests performed and the results of those tests.'
  merge: -1
  img_proc: true
