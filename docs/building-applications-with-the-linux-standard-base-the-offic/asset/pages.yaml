- pgno: 22
  md: '# # Preface


    # ## Who Should Read This Book


    This book is intended for anyone who wants to develop LSB-certified Linux applications
    or work with the LSB workgroup.


    Note: Because readers are likely to take different paths through the book, in
    a small number of cases we have repeated crucial information.


    # ## What the Book Is About


    This book outlines the LSB Certification program which takes advantage of the
    inherent binary compatibility nature of GNU/Linux.


    Part I, Introduction, explains the value of standards as well as the difference
    between source standards and binary standards. It also explains the benefits of
    certification for application developers, Linux distributions, and end users.


    Part II, Developing LSB Applications, covers the important aspects of porting
    to Linux. This information includes programming differences between Linux and
    UNIX, packaging software products for any LSB Certified Runtime Environment, and
    migrating Solaris applications to Linux.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Part III, Certifying for the LSB, outlines the LSB certification procedures
    for both Linux distributions and software products for those distributions. This
    information will aid readers wishing to pursue the Free Standard Group’s LSB Certification.


    Part IV, Contributing to the LSB Project, explains how new interfaces and architectures
    are added to the LSB Written Specification. Understanding the LSB standardization
    process is valuable in appreciating the veracity of the LSB and the procedure
    to follow to expand the scope of the standard.


    Part V, Using LSB Resources, outlines how to use the resources provided by the
    LSB. This information includes a description of the LSB Written Specification,
    Test Suites, Sample Implementation, Development Environment, and Application Battery.
    This part also explains how to use and obtain the latest releases of these resources.


    # HIGHLIGHTING


    The following highlighting conventions are used in this book:


    +   1. **bold** Commands.


    +   2. monospace Names of files, paths, functions, options, flags, and variables.


    +   3. monospace_oblique Replaceable elements in a file or path name such as architecture
    types or provider names.


    +   4. $ command_line Commands that can be executed as any user (in examples).


    +   5. # command_line Commands that should be executed as root (in examples).


    +   6. vxs$ command_line Commands that must be executed as user vxs0.


    +   7. \\ Backslashes are used at the end of long lines in program listing examples
    to continue to the next line.


    ![](img/d75cffbcb54aabfb0f9854162061d394_23_0.png)


    Notes are used to identify special commentaries.'
  merge: -1
  img_proc: true
