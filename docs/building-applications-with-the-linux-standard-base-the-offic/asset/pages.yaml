- pgno: 30
  md: '# **PART I**


    # Introduction


    Linux Standard Base (LSB) is a term that is used to describe both an organization
    and a standard. Since its inception in 1998, the LSB project has been supported
    by countless participants interested in developing a standard to unify and bolster
    the operability of Linux. Their cooperative effort has resulted in the releasing
    of multiple products that are calculated to establish Linux as a viable and affordable
    platform with broad market potential.


    Within the Linux community, the credibility of the LSB project is a factor of
    the legitimacy of the LSB standard. This part provides background information
    about the LSB organization.


    Chapter 1 discusses the background and basic principles behind the LSB. It also
    explains the structure of the organization and the value of standards. Chapter
    2 introduces the concept of binary compatibility. It explains the importance of
    binary compatibility and how to achieve it in your applications.'
  merge: -1
  img_proc: true
