    # 5.3 Signal Handling


    Signals are the means to notify a process or thread of the occurrence of an event.
    In this area, Linux supports most of the signals supported by UNIX systems such
    as SVR4 and the BSD implementations. However, there are some exceptions that need
    to be considered.'
