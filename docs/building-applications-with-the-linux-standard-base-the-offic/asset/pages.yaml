- pgno: 219
  md: '# **13.7.3  Using Non-LSB Interfaces**


    Sometimes developers are not able to build a completely LSB-compliant application
    as the core functionality of their program depends on a feature not included into
    the LSB Written Specification. However, for compatibility reasons, they still
    want to be as LSB-compliant as possible.


    An example of this would be a dependence on a C library interface or a system
    call that is not in the LSB Written Specification. In this case it is not possible
    to simply supply a shared library with the application or to statically link the
    requirement to make the binary LSB-compliant. By modifying the LSB Development
    Environment, it is still possible to use it to build the binary and get the associated
    benefits. In the above case, the simplest approach would be to retrieve the source
    for the stub libraries, manually add the required interfaces, and build a new
    version of the stub libraries. Similarly, prototypes can be added to the LSB header
    files.


    # **13.8  DOWNLOADING THE LSB DEVELOPMENT ENVIRONMENT**


    To obtain the LSB Development Environment go to the LSB Download Web page.6 Table
    13.2 represents the information that can be accessed via the World Wide Web.


    +   *   **lsb-build-base**    The LSB Development Environment base package provides
    stub libraries and header files. These can be used to build LSB-compliant applications.
    Note that the version number of the package refers to the version of the specification
    that the stub libraries and header files have been generated for.


    +   *   **lsb-build-c++**    This package provides interium C++ building support
    for the **lsb-build** packages. It adds C++ headers and LSB-conformant builds
    of the static C++ libraries to the files installed by **lsb-build-base**.'
  merge: -1
