- pgno: 225
  md: '# ### 14.1.2 Use of Application Battery in LSB Runtime Environment Certification


    One step in testing a Linux runtime environment for compliance with the LSB Written
    Specification is to successfully execute the applications from the LSB Application
    Battery. By doing so, you demonstrate the ability of the runtime environment to
    install a set of LSB-compliant applications and prove the applications execute
    properly. Testing of the Application Battery adds further evidence that the LSB-defined
    APIs in the shared libraries of the runtime environment are supported correctly.
    The LSB Runtime test suites test the LSB APIs in isolated fashion. The Application
    Battery tests the APIs in a more practical fashion by using them as part of an
    actual application.


    # ### 14.1.3 Caveats of Application Battery


    As stated earlier, the applications in the Application Battery are open source
    applications that may be found on many Linux distributions. However, these applications
    should not be considered fit for use in a true production environment. The primary
    reason for this is the limited testing performed on these specially built versions.
    Most of the applications will behave identically to those already available on
    most Linux systems, but some of them had certain features disabled in order to
    make them LSB-compliant. The loss of these features will usually affect only the
    internal operation of the application. In a few instances, the application may
    perform slower because it could not take advantage of some non-standard code optimizations.


    The LSB workgroup has been in contact with the upstream maintainers of many of
    the abpat applications. By demonstrating what is required to make these applications
    LSB-compliant, the LSB workgroup is helping the development teams to see how easy
    it is to adhere to the LSB Written Specification. Some of these open source projects
    have agreed to strive for LSB compliance. In some cases, they are accepting LSB-specific
    patches into their upstream source. Certain development teams are providing a
    location on their project Web sites where an LSB Certification Ready version of
    their application can be downloaded.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 14.2 USING THE APPLICATION BATTERY FOR CERTIFICATION


    # 14.2.1 Accessing the Application Battery


    The applications of the LSB Application Battery are available for download from
    the Free Standards Group FTP site.¹ This directory contains several subdirectories
    containing applications for different versions of the LSB Written Specification,
    as well as a subdirectory containing prerelease versions of the applications.
    Official versions of the applications are in directories of the format released-LSB_version,
    where LSB_version is the applicable version of the LSB Written Specification.
    For example, the appbat applications for LSB v1.3 are in the directory released-1.3.0.
    The prerelease versions of the applications are in the beta directory.


    Within each of the release directories and the beta directory there are subdirectories
    for each of the processor architectures supported by the particular version of
    the specification. Because the LSB v1.2 Written Specification was only available
    for the Intel 32-bit processor architecture, there are no subdirectories in the
    released-1.2.0 directory. Separating the applications by processor type makes
    it easier to download all the applications needed for runtime environment certification
    in one go.


    Example 14.1 is a brief snapshot of the directory structure on the FTP site to
    show how it is organized.


    # 14.2.2 Installing the Application Battery


    The installation of the appbat applications is the first step in using appbat
    for LSB certification of a Linux runtime environment. The distribution must prove
    that it can install an application packaged in the RPM package format as described
    in the LSB Written Specification. The installation can be performed using the
    rpm command itself or by using any other command capable of reading an RPM package.
    For example, on the Debian distribution, the alien command can be used to convert
    the RPM-packaged application to a .deb package. Once converted, the application
    can be installed with the dpkg command.'
  merge: -1
  img_proc: true
