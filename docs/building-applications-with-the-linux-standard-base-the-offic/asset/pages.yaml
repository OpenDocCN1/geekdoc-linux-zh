- pgno: 109
  md: '**Product information** The name of the product and its unique version or release
    identifier.


    **Operation environment** The LSB processor-specific architecture with which the
    conformance of the product has been demonstrated.


    **Indicator(s) of compliance** The names and versions of the test suites used
    to demonstrate the conformance of the product.


    **The policy on rebranding of this product** This question allows the supplier
    to state their policy with respect to third parties rebranding and recertifying
    the product. Under an open rebranding policy, you can state here that you waive
    the LSB Certification Policy requirement that a written permission be given in
    this case. Otherwise, you might just want to indicate that the policy is as stated
    in the LSB Certification Policy.


    The Conformance Statement Questionnaire also contains questions specific to a
    product standard.


    # 6.3.3 Submitting Initial Certification Information


    The LSB Certification Authority provides a Web certification system⁸ through which
    products can be submitted for certification. Applying for certification requires
    the supplier to submit some initial information via the Web. The initial submission
    involves completing a registration form (including company details and contact
    details), and accepting the terms and conditions of the LSB Certification program.
    This only has to be done for the initial product registration.


    Consult the Certification Authority Web site for further information on the process
    of registering for using the Web certification system.


    8. http://www.opengroup.org/lsb/cert/'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 6.3.4 Registering Your Product within the Web Certification System


    When a product is registered, a number of product details including the product
    name and the version or release for which conformance has been demonstrated have
    to be provided.


    The supplier must select the LSB product standard against which certification
    is being sought, can optionally enter a product-related Web address, and then
    must accept the LSB Certification Agreement in order to proceed with this product
    registration.


    The product registration form is then displayed with additional fields for you
    to provide information specific to a product standard as described in the following
    sections of this chapter.


    # 6.3.4.1 LSB Runtime Specific Details


    If a product is an LSB Runtime Environment, the supplier needs to answer to the
    following questions about the product.


    +   * Select the languages that the product supports.

    +   * Select the region where the product is targeted.

    +   * Select the hardware profile that the product requires (minimum memory, processor
    type, minimum disk space, minimum processor speed).

    +   * Select the usage profile that best matches the product (desktop/server/cluster).


    In several cases, multiple selections are allowed (for example, for the language
    and region). The responses to these questions will be published in the Certification
    Register.


    # 6.3.4.2 LSB Internationalized Runtime Environment Specific Details


    If the product is an LSB Internationalized Runtime Environment, you need only
    enter the product name since all other details are declared in the Conformance
    Statement.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 6.3.5 Uploading Your Conformance Statement


    The certification system leads suppliers through the steps required to register
    a product to be certified. The first document that must be uploaded to the certification
    system is the Conformance Statement for the product.


    The next steps are to perform formal testing and then upload the test results
    as a sequence of files into the Web certification system.


    # 6.3.6 Formal Testing for Certification


    Formal testing is a self-test activity whose results are submitted to the Certification
    Authority for audit via the Web certification system. At this point in time you
    need to make sure you understand the required test campaign (Figure 6.1), that
    is, you must know which test suites are required to be used for certification
    testing (see the following paragraph for details). You also need to make sure
    that you have obtained the currently authorized version of the certification test
    suite(s), since other versions will not be valid for formal testing.


    ![](img/d75cffbcb54aabfb0f9854162061d394_111_0.png)


    Figure 6.1: LSB Test Campaign'
