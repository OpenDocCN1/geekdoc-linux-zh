- pgno: 64
  md: '# ### 3.10  waitpid(3)


    The LSB has deprecated the use of waitid(3). Applications should call the waitpid(3)
    interface as specified in the Single UNIX Specification, but implementations need
    not support the X/Open System Interfaces Extension (XSI) functionality of WCONTINUED
    or WIFCONTINUED (Example 3.6).


    # ### 3.11  PARSING OF COMMAND OPTIONS


    The GNU getopt(3) function parses command-line arguments as specified by the Single
    UNIX Specification Version 3, when the plus sign “+” is the first character in
    the operation string of the function’s third parameter.


    The GNU operation string flags “W;” (to enable long options), “-” (to return ‘\1’
    for invalid options), and “::” (to enable optional flag arguments) should not
    be used when trying to maintain SUsv3 compliance (Example 3.7).


    # ### 3.12  LSB DON''TS


    This chapter is about portability etiquette. As an open systems developer, there
    are things you should not do. You should realize that the compromises to ensure
    portability outweigh the short-term benefits of tuning to a specific release.


    # #### 3.12.1  /proc


    The LSB only specifies the /proc/cpuinfo file and its keys. Applications should
    not attempt to collect any other data from the /proc filesystem, because it is
    unspecified and unreliable.'
