- pgno: 32
  md: '# CHAPTER ONE


    # Understanding the LSB


    This chapter describes the Linux Standard Base, giving an overview of its evolution
    from the concept to the Linux Standard Base 2.0 edition. It describes the benefits
    of the specification, provides a brief history of the work that led to its creation,
    and places the specification in context with other industry standards initiatives.


    The Linux Standard Base (LSB) Written Specification is an application binary interface
    standard for shrink-wrapped applications. The LSB draws on the source standards
    of the IEEE POSIX standards and The Open Group''s Single UNIX Specification for
    many of its behavioral interface definitions. Some interfaces are not included
    in the LSB, since they are outside the remit of a binary runtime environment;
    typically these are development interfaces or user-level tools. The LSB also extends
    the source standards in other areas (such as graphics) and includes the necessary
    details such as the binary execution file formats to support a high volume binary
    application platform.


    # 1.1 BACKGROUND


    Today, the cost of developing application software is considerably greater than
    the cost of the hardware on which the applications run. Preserving this investment
    in critical applications of an organization, while allowing the organization to
    freely mix and match platforms as hardware costs fall, has led to the idea of
    open systems. One of the cornerstones of open systems is portability—the ability
    to move the source code of an application to another platform and rebuild the
    application without changing the source.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Software portability problems do not just affect an organization directly through
    that organization''s own applications. Hardware vendors often find their market
    limited by the applications that run on their platforms. Independent software
    vendors (ISVs) often limit themselves in the number of platforms on which they
    sell their products, due to the costs of maintaining ports of the application
    for multiple platforms. Consumers are caught, often choosing hardware platforms
    based on the applications they need to purchase, but without the ability to know
    what new applications will be available on these platforms in the future.


    Whilst open systems have allowed source portability, source portability is not
    the solution for creating a large consumer market; for that, binary portability
    is a must. The LSB Written Specification provides an open consensus specification
    to support development of portable binary shrink-wrapped applications for the
    Linux platform. The stated goals of the LSB are “to develop and promote a set
    of standards that will increase compatibility,” the key differentiator being that
    LSB''s approach is at the binary interface level.


    # 1.2 THE VALUE OF STANDARDS


    The increasing popularity of the Linux operating system has spawned a large number
    of distributions with variations in the features they deliver. This could, if
    left untended, lead to unnecessary fragmentation of Linux. Standardization of
    a Linux binary platform for volume applications is both desirable and attainable,
    and a large value can be attained if the “bar of commonality,” that is, the standard,
    is raised to a sufficient level. There is often much more to be gained by having
    key functionality share a common interface and/or behave in exactly the same way,
    than for it to be different. In this context, the LSB has built on the work of
    many existing standards and specifications and thus is raising the commonality
    level. This is the value of standards.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.3 THE FREE STANDARDS GROUP


    The Free Standards Group (FSG)$^{1}$ is the industry’s first independent, non-profit
    organization dedicated to accelerating the use and acceptance of open source technologies
    through the development, application, and promotion of standards. The FSG delivers
    access to standards, tools, and compliance testing, which allows open source developers
    to concentrate on adding value to Linux, without spending time dealing with verification
    and porting issues. Key projects that fall under the FSG umbrella include the
    Linux Standard Base (LSB) and Openi18n (Open Internationalization).$^{2}$


    # 1.4 ORGANIZATIONAL STRUCTURE OF THE LSB


    The LSB workgroup is led by an elected chair and governed by a Steering Committee.
    Figure 1.1 shows the structure of the organization as a whole.


    The following list describes the roles of its workgroup members.


    # 1.4.1 Chair


    The LSB chair is the overall project lead. The chair coordinates all projects
    and represents the LSB to the Free Standards Group (FSG) and to the community.
    The chair is elected by the LSB contributors of the LSB workgroup and has a term
    of office of two years. The chair can be removed through a majority vote of no
    confidence by either the Steering Committee or the Free Standards Group board
    of directors. The chair has the following responsibilities and duties:


    +   - Overseeing the production and dissemination of the roadmap, budget, media,
    and collaboration

    +   - Conducting a workgroup telephone conference at least once per month

    +   - Conducting a face-to-face workgroup meeting at least once per year but not
    more than twice'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/d75cffbcb54aabfb0f9854162061d394_35_0.png)


    Figure 1.1: LSB Organizational Structure


    +   - Presenting a roadmap and budget to the workgroup and FSG board once per
    year

    +   - Acting as the primary spokesperson for the LSB workgroup

    +   - Nominating a project manager, a release manager, and subproject team leaders


    # **1.4.2 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Election Committee**


    The Election Committee is an ad hoc committee of LSB contributors, who are appointed
    by the Steering Committee to elect a new chair when the chair position becomes
    vacant or the term of office expires. The committee shall have two to six members
    and is responsible for selecting one or more candidates for chair at least 30
    days in advance of the election date.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# ### 1.4.3 Steering Committee


    The LSB Steering Committee includes the chair and the subproject team leaders,
    as well as any other LSB contributor the chair feels strongly should be on the
    committee. Any of the LSB Steering Committee members may represent the LSB as
    a spokesperson. Steering Committee members may serve indefinitely as long as they
    are actively conducting business in the best interest of the LSB. Steering Committee
    members may be removed on a majority vote of no confidence by the Steering Committee.
    An individual may serve as team lead for more than one subproject, but this shall
    in no event entitle him or her to more than a single vote on the steering committee.
    The Steering Committee shall have a minimum of three members; if there are not
    sufficient team leaders then the chair shall solicit a general member of the LSB
    workgroup to fill out the Steering Committee. A majority vote from the LSB Steering
    Committee is required to commence or conclude work (such as draft specifications)
    or make resolutions. A quorum of 50% of the sitting members of the Steering Committee
    is required for a valid vote. No interest group (for example, company or organization)
    may cast a majority of the votes.


    # ### 1.4.4 Project Manager/Release Manager


    The LSB chair can appoint a project manager and/or release manager to manage an
    LSB release of the Written Specification and certification materials. The project
    manager or release manager position does not confer a Steering Committee seat.


    # ## 1.5 LSB SPECIFICATION OVERVIEW


    The LSB is composed of two basic parts: a common specification ("generic LSB"
    or "gLSB") describing those parts of the interface that remain constant across
    all implementations of the LSB, and an architecture-specific specification ("archLSB")
    describing the parts of the interface that vary by processor architecture. Together,
    the generic LSB and the architecture-specific supplement for a single hardware
    architecture provide a complete interface specification for compiled application
    programs on systems that share a common hardware architecture.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The architecture-specific supplement must be used in conjunction with the generic
    LSB. It provides architecture-specific information that supplements the generic
    LSB, as well as additional information that is not found in the generic LSB.


    For an in depth description, see Chapter 10.


    # ### 1.6 Benefits for Application Developers


    A standard application binary interface for Linux provides increased confidence
    in your application, reduced expenses, and enhanced market opportunities.


    # #### 1.6.1 Increasing Confidence in Your Application


    The widespread success of a software application is heavily dependent on customers’
    confidence in the application. Instilling confidence depends on several factors,
    including compatibility, portability, and reliability. Compatibility is rapidly
    becoming a requirement for customers who need applications that run with a wide
    variety of other applications. Customers are also demanding that applications
    be written for maximum portability. Customers run applications in many different
    environments that may include different operating systems and different architectures,
    and they do not want to purchase a different version of an application for each
    environment. Reliability is also an important requirement for customers today.
    Software applications run everything from bank transactions to hospital information
    systems, so customers can not afford to use unreliable applications.


    LSB Certification provides the independent assurance that an application will
    meet customers’ compatibility, portability, and reliability expectations. Since
    the LSB allows you to standardize your software, LSB Certification assures its
    compatibility among Linux distributions. Compliance with the LSB also ensures
    that your software applications will run on any compliant system, increasing you
    and your customers’ confidence to use Linux across architectures and with other
    applications. The extensive set of LSB Test Suites also gives you the tools to
    prove your applications’ reliability to customers.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 1.6.2 Reducing Expenses


    Reducing expenses is always an important goal in any business, and there are many
    expense reducing measures that can be introduced into the development process.
    Relying on a common base of *application programming interfaces* (APIs) can greatly
    reduce the need to develop new code when you develop an application. Using common
    APIs also reduces the expenses involved in adding support for additional operating
    systems. You can also lower expenses by testing your application in only one operating
    environment. If the application runs the same way in all compatible operating
    environments, then your test effort can be much smaller. You can also reduce expenses
    by relying on a common set of preexisting test cases. Using common test cases
    lessens the time and resources involved in testing. With less time and resources
    needed to migrate and test your application, you can focus on product innovation
    instead of the bottom line.


    Instead of duplicating product testing on each operating system supported, you
    only have to fully test the application once. Software that can run on any Linux
    system without change eliminates dependencies specific to various Linux distributions.
    The value proposition of using the LSB on Linux is to be binary compatible, which
    enables reduced test expenses in the ever growing Linux domain. With the LSB,
    ISVs are able to channel their resources into product innovation instead of spending
    excessive time on maintenance.


    # 1.6.3 Enhancing Market Opportunities


    Increasing confidence in your applications and reducing the expenses involved
    in developing them can greatly enhance your market opportunities. Normally, limited
    resources can restrict a product to a certain niche market. However, increased
    confidence and reduced expenses can open up previously unavailable market opportunities.
    For example, when the need to support all the possible combinations of operating
    systems and computer hardware is eliminated, the opportunities for an application
    are expanded with minimum effort. Instead of creating custom versions of the application
    for different operating environments, you can produce a shrink-wrapped version
    with the capability to be used in multiple environments. The shrink-wrapped application
    can help you quickly meet the needs of new and changing market opportunities.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The Linux Standard Base is the tool you can use today to expand the market
    reach of your products. The choice of target Linux systems for your applications
    meets the diverse requirements of your customers. Interchangeable Linux systems
    enhance market opportunities for your software applications on Linux.


    # ### 1.7  BENEFITS FOR USERS


    The Linux Standard Base ensures a standardized binary application platform for
    Linux available from multiple suppliers, which gives users freedom of choice without
    being locked into a single supplier’s offerings. It also offers the prospect of
    a supply of applications that can run across a range of systems from multiple
    suppliers.


    # ### 1.8  BENEFITS FOR DISTRIBUTIONS


    Differentiating the core competence of the operating system is contrary to a ubiquitous
    Linux application runtime environment. Independent software vendors desire the
    stability and compatibility of Linux. The LSB gives a precise definition and an
    easy validation process. Distributions can succinctly provide compatible core
    libraries and commands, which affords the distributions more time to spend on
    other areas for their customers.


    # ### 1.9  BRIEF HISTORY OF THE LSB PROJECT


    The Linux Standard Base (LSB) project was first announced in May 1998 with a project
    proposal and call for participation.³ The announcement included the endorsement
    of Linus Torvalds, Bruce Perens, Eric Raymond, several Linux distributors, ISVs,
    members of Linux International, as well as Jordan Hubbard of the FreeBSD project.
    At that time, the stated aim of the project was to provide a “vendor-neutral standard,
    backed by source code, upon which to build Linux distributions,” including a reference
    platform. The


    > 3. http://old.lwn.net/1998/0528/a/lsb.html'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'stated result of the project would be that any program that ran successfully
    on the reference platform would be expected to run on all Linux systems that are
    in compliance with the standard.


    The project deliverables have changed since the original proposal and are now
    structured to provide a set of specifications and test tools in addition to the
    reference implementation (which is now called the Sample Implementation). There
    is also an Application Battery which is a set of real-world LSB-conformant applications
    used to test the specification and runtimes.


    Since May 2000, the legal framework under which the LSB project operates is a
    workgroup of the Free Standards Group. The Free Standards Group is an independent
