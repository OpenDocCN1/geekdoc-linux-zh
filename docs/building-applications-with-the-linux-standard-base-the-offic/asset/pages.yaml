    a few of these pages, it shows that Lynx is operating correctly.


    Two more applications in the Application Battery are very visual in nature, so
    functional tests for them are more interactive and involve making sure the images
    displayed by the application are correct. The functional test for the **XPaint**
    application tries to verify correct operation for two of the main features of
    the application. First, the application is used to draw some simple shapes on
    the screen using a few of the color choices. Next, XPaint is used to take a snapshot
    of the screen and open it in a new window. The tester of XPaint just needs to
    make sure the application shows reasonable output. The functional test for **xpdf**
    has a file processing aspect to it in addition to the visual aspect. To facilitate
    testing **xpdf**, two PDF documents are downloaded from the Free Standards Group
    FTP site. The first test document is displayed by **xpdf** and the tester enters
    a few of the interactive commands. The second document is used to validate the
    text processing features of **xpdf**. It uses the **pdfto** command to display
    information contained in the PDF file, **pdftotext** to convert the PDF file into
    a text file, and **pdftops** to convert the PDF file into a PostScript file.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'The final set of applications in the Application Battery are those that have
    a server feature. For these applications, there are interactive steps to start
    the server daemon and then perform tests to verify correct operation of the server.
    The functional test for Apache uses the Web control script (**apachectl**) to
    start the Web server. To ensure the Web server is working, a browser is used to
    open the main Web page on the system being tested. The browser can be run on the
    same system if it is not connected to a network, or it can be run on a remote
    system. The browser is then used to display several Web pages on the server.


    The testing for Samba and **rsync** is more involved because they each have a
    client side to them in addition to their server side. In the Samba functional
    test, the **smbd** and **nmbd** servers are started from the command line. After
    the servers have been started, the **smbclient** command is used to access the
    Samba server in several different ways. Testing for **rsync** is handled in a
    somewhat similar fashion. First, the **rsync** command is used to copy a file
    from one directory to another on the system. Next, **rsync** is started in daemon
    mode on the system. After the daemon is started, the **rsync** command is used
    to list the files being shared by the **rsync** daemon. A couple of files are
    then transferred to and from the **rsync** server to make sure this feature works.


    # 14.3 CREATING THE APPLICATION BATTERY


    # 14.3.1 Using LSB Development Environment


    The applications in the Application Battery (Figure 14.1), just like any applications
    seeking to become LSB-certified, must adhere to the LSB Written Specification.
    The first issue to address is the requirement to only use the shared libraries
    specified by the LSB and only use the interfaces within those libraries that are
    specified by the LSB. The process to meet this requirement can be handled in multiple
    ways. The Application Battery uses the LSB Development Environment (**lsbdev**)
    to enforce the restrictions of the LSB at compile time. Using the header files
    and sub libraries from **lsbdev** helps to identify any non-compliant interfaces
    being used by the application. The **lsbcc** and **lsbcc++** commands from **lsbdev**
    ensure that the application will search the **lsbdev**-provided headers and libraries
    before searching those on the system. This forces the application to link with
    the correct versions of any APIs'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# ### 14.3 Creating the Application Battery


    ![](img/d75cffbcb54aabfb0f9854162061d394_234_0.png)


    even though the shared libraries on the system may contain later versions of the
    same interface. Additionally, **lsbdev** causes the application to use the LSB
    dynamic linker instead of the default dynamic linker on the system. The **lsbcc**
    and **lslbc+c**+ front end commands are designed to be used with any C or C++
    compiler, but the Application Battery uses the GCC to build all the applications.


    The LSB Written Specification for applications says that only LSB-specified shared
    libraries may be dynamically linked to the application. Any other library interfaces
    being used by the application can be accessed in one of two ways. First, the application
    can provide its own copies of any needed shared libraries and include them when
    installing the application itself. The other way to use non-LSB interfaces is
    to link them statically into the application. The choice of the way to proceed
    is up to the application’s developer. For the LSB Application Battery there are
    examples of each method being used.


    The Apache application in appbat includes three shared libraries built along with
    the application. Two of the libraries contain utility routines used by several
    different commands within Apache. The third shared library, **libexpat**, is built
    along with Apache because it is not a shared library defined by the LSB. Including
    a private version of **libexpat** makes sure the binary'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'version of Apache has a known version of **libexpat** with which to work instead
    of relying on it being installed on the system where it will be executed. Counting
    on some expected behavior of a non-LSB shared library on a system is risky because
    the library’s interfaces are not guaranteed to be consistent. To make sure the
    three shared libraries packaged along with Apache do not interfere with libraries
    installed on the system, they get installed in the same overall directory structure
    as the Apache application.


    A few of the applications in appbat statically link some non-LSB libraries in
    order to meet the requirements of the LSB. For example, the XPaint application
    takes advantage of interfaces in the **libpng**, **libjpeg**, and **libtiff**
    libraries. Rather than build and package shared versions of these libraries to
    be shipped with XPaint, the Application Battery chose to link them in statically.
    To avoid being dependent on the version of the static library installed on the
    system where XPaint is built, appbat creates its own set of static libraries built
    from a known version of each one. This collection of libraries is known as the
    LSB Library Battery, or libbat. After the libbat is built, the static libraries
    are packaged together into an RPM package that is installed on top of the LSB
    Development Environment. The static libraries are placed in the same directory
    as the LSB sub libraries. Placing them there makes sure the appbat applications
    will link with the static versions of these libraries before finding whether the
    shared or static versions are installed on the system.


    # 14.3.2  Resolution of Coding Problems


    Building an application with the LSB Development Environment will help identify
    any compliance issues at compile time. This was true with many of the applications
    in the Application Battery and resulted in the need to resolve problems in the
    source code. Some of the changes were fairly simple, such as the need to use standard
    argument types instead of those not defined by the LSB. In other situations an
    application makes use of an interface that is not covered by the LSB but can be
    replaced by a similar function from the LSB. Rarely there are occasions where
    an application uses an interface with no equivalent function in the LSB. For this
    situation, the solution can involve incorporating the function into the application
    source code, disabling the portion of the application using the interface, or
    rewriting the application to handle the circumstances differently. A few examples
    from the Application'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 14.3 **Creating the Application Battery**


    Battery demonstrate some of these coding problems and how they were overcome.


    The Samba application had a few small issues with the upstream source code that
    kept it from building with the LSB Development Environment. One of the problems
    was something fairly simple where a variable was declared as the `uint` type.
    The `uint` type is usually defined in the header files of most Linux distributions,
    but it is not a standard type defined by the LSB. Most programmers use `uint`
    as shorthand instead of `unsigned short`. The solution to this problem was to
    add the capability to the configure script for Samba to detect whether or not
    the `uint` type was present in the Development Environment. When doing a non-LSB
    build `uint` will be found in the regular system headers and no changes will be
    seen in the Samba source code. The same configure script, when run in the LSB
    Development Environment, determines that `uint` has not been defined, so it adds
    a `#define uint unsigned short` to the `config.h` file included in all the Samba
    source code. The problem of using a non-LSB type definition can also be corrected
    by replacing all instances of the type by one of the types from the LSB.


    The situation with `rsync` was a little more complicated than with Samba. The
    `rsync` application makes use of the `getpass()` function call to prompt for and
    read a password from the user running the command. Unfortunately, the `getpass()`
    interface is not defined by the LSB and no convenient equivalent exists either.
    For this situation, a function called `getpassword()` was added to the `rsync`
    source code. The algorithm of `getpassword()` was taken from the `glibc` documentation
    and was modified slightly to fulfill the needs of `rsync`. Next, the instance
    in the source code that called `getpass()` was changed to make a call to `getpassword()`
    instead. After that, `rsync` was able to avoid using a non-LSB interface but still
    got the desired results.


    Another problem seen with `rsync`, as well as with some other applications, involved
    certain variables that were not handled correctly when the code was moved to a
    64-bit Linux distribution. In many places, these applications declared variables
    to hold pointers, memory address offsets, or other items that have different sizes
    on 32-bit versus 64-bit operating systems. A variable to hold a pointer value
    would be defined as the type `int` because on 32-bit systems the size of an integer
    is the same as that of a pointer—32 bits. However, this coincidence does not hold
    true on 64-bit systems where the size of an'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'integer and the size of a pointer are different. The answer to this problem
    is to change the definition of these variable types from *int* to *size_t*. The
    actual length of *size_t* variable is dependent on *whether the system is 32-bit*
    or 64-bit. Changing the code in this way allowed *rsrc* to have common code between
    the two different environments and to handle the different sizes of pointers correctly.


    The Celestia application encountered a problem that was unique to a particular
    processor architecture. As part of *building Celestia for LSB compliance*, it
    is configured to use GL for its graphical operations instead of the non-LSB libraries
    like those provided by Gnome and KDE. Early in the startup code for Celestia running
    in GL mode, the program parses the command line for any arguments provided. It
    loops on the *getopt()* function call to retrieve arguments for as long as the
    return value from *getopt()* is greater than negative one. Unfortunately, the
    argument used to hold the return value was defined as *char* when the *getopt()*
    function is really returning an *int*. On most architectures supported by the
    LSB, the use of the wrong variable type causes no problems because the *char*
    type is signed by default. However, on the PowerPC architecture, the *char* type
    is unsigned. This means the return value from *getopt()* will never be less than
    negative one, so the program loops forever trying to read command-line parameters.
    To resolve this problem in the Application Battery, the source for Celestia was
    patched to change the argument type to *int*, thus allowing the program to proceed.


    Another area where an application had to be changed involved some very old upstream
    source code. The XPaint application can read and write image files in several
    different formats, one of which is JPEG. The application has the capability by
    using function calls from the *libjpeg* shared library. As mentioned earlier,
    any non-LSB shared library must either be made available with the application,
    or the application must link the library statically. The Application Battery has
    implemented the second of these choices by statically linking *libjpeg* that is
    provided in the LSB Library Battery (libbat). As it turns out, the upstream source
    code for *libjpeg* is fairly old, so the configure script it uses to determine
    the type of hardware on which it is running is not aware of some of the newer
    hardware architectures, such as PPC64 and x86_64. The *libjpeg* library, like
    many other applications that try to do automatic configuration, uses a script
    called *config.guess* to figure out the processor architecture of the build system.
    The method used to get around this'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'limitation was to replace the version of `config.guess` present in the **libjpeg**
    source code with a more current version. This update was done via a patch. After
    the patch is made, the configure script for **libjpeg** works correctly and allows
    XPaint to build successfully on all seven LSB processor architectures.


    The previous several paragraphs give concrete examples of some coding problems
    that must be overcome when building an LSB-compliant application. Some of the
    problems were the same regardless of the processor being used, while others were
    only manifest on some of the architectures. Each application must be examined
    individually to see what difficulties exist, but the examples above should prove
    helpful in getting beyond any problems encountered.


    # 14.3.3 Disabling Non-LSB Features


    After resolving any coding problems in the application, such as those described
    in the previous section, there will still be some problems to overcome. Sometimes
    even the final choice of linking a static version of a function to the application
    will not work for various reasons. The application may use a shared library that
    cannot be linked statically to an application due to its software license. In
    other cases it can be difficult or even impossible to build a static version of
    some function needed by an application. For these situations, the only remaining
    options are to disable the part of the application using the shared library in
    question, or decide that the application is not a good candidate for meeting the
    LSB Written Specification. The LSB Application Battery encountered several situations
    like this and had to disable non-critical capabilities of the applications involved.
    This is another reason why it is important to understand that the applications
    in the LSB Application Battery cannot be considered production ready. A few examples
    of how this affected some applications should help to explain the problem as well
    as the solution.


    The Apache Web server uses a database to manage user authentication. Since Apache
    has been designed to work on many different operating systems, it has a configure
    script that will determine the best available database engine to use. It can use
    several versions of the Berkeley DB (**libdb**), the GNU DB (**libgdbm**), or
    several other choices. This flexibility is very valuable, but it causes problems
    for building Apache in an LSB-compliant fashion. The LSB'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Written Specification does not include any of the various database shared li-braries,
    so another solution must be found. Fortunately, the Apache source code even considers
    this situation by providing its own limited database en-gine that can be built
    and shipped with Apache. The trick for building Apache in the Application Battery
    was to convince the configure script to use the internal database instead of relying
    on that found on the build system. The way this is accomplished is by providing
    the `--without-gdbm` and `--without-berkeley-db` flags when running configure.
    This prevents configure from searching on the build system for these non-LSB shared
    li-braries. The configure script determines that it should use the internal shared
    library. To meet the requirement for non-LSB shared libraries, Apache pro-vides
    the database library and two other utility libraries along with the Apache application
    during installation.


    The situation with Celestia is similar to that for Apache in that it tries to
    use the best available shared libraries to handle the display of graphical in-formation.
    Normally the application will either running GTK when running within a Gnome desktop
    environment or Qt when running within a KDE desktop environment. Neither of these
    graphic interface libraries is specified by the LSB, so another alternative must
    be found. Linking these interfaces statically to Celestia proved very difficult,
    so the Application Battery took a different direction. The source code for Celestia
    also contains support for using libGL for its graphics, which is good because
    libGL is a valid LSB shared library. Because the Application Battery is built
    on systems that most likely have either GTK, Qt, or both installed, the configure
    script for Celestia is called with the `--without-gtk` and `--without-kde` flags.
    This prevents configure from trying to use either GTK or Qt. Instead, Celestia
    gets built with support for only libGL, thus allowing it to comply with the LSB
    Written Specification.


    The Samba application is another one designed to work in a variety of environments
    and take advantage of what is supported. One such feature is the use of the Common
    UNIX Printing System (CUPS) for print support. The CUPS interface provides a portability
    layer for the application and will work with whatever UNIX print system is supported,
    such as lp or lpr. This interface provides extra functionality beyond just submission
    of print jobs, so Samba exploits these capabilities. Once again, this is a problem
    for creating an LSB version of Samba since CUPS is not defined by the specification.
    The Application Battery instead uses the `--disable-cups` flag when calling'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'configure to tell Samba to not attempt using the CUPS interfaces. Then Samba
    will fall back to the less functional lp or lpr command, but print support is
    still provided.


    # 14.3.4 Alteration of Application Install Location


    Once the applications in the Application Battery compile successfully, it is time
    to consider another requirement for LSB compliance. All applications must adhere
    to the Filesystem Hierarchy Standard (FHS) with regard to where the application
    is installed on a system. For the purposes of the Application Battery, all the
    applications included are considered third-party applications because they are
    not being shipped with the Linux distribution. The FHS specifies that third-party
    applications must install its component parts in certain directories. Any static
    portion of the application, such as the main application binary, must be installed
    under the /opt directory. Any configuration files associated with the application
    must be installed under the /etc/opt directory. Any files that can be modified
    while the application is running are to be installed under the /var/opt directory.
    The LSB Application Battery installs all of its applications under the /opt/lsb/appbat,
    /etc/opt/lsb/appbat, and /var/opt/lsb/appbat directories.


    The method for modifying the install location for the Application Battery applications
    varied somewhat depending on how the application was written. Some of the more
    well-behaved applications use the DESTDIR variable in their makefiles for installation.
    This makes it easy to set DESTDIR to /opt/lsb/appbat and then use the application''s
    regular makefile to install it. Unfortunately, not all applications are as considerate
    when it comes to alternative installation locations. For these situations, the
    Application Battery used other methods, such as patching a makefile to allow other
    install locations. The general solution for this kind of problem is going to involve
    a decision tree. The best scenario is when DESTDIR is supported. If it is not,
    then an examination of the application install code is necessary to determine
    how best to modify it.'
  merge: -1
  img_proc: true
