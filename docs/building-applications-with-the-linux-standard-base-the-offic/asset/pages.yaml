  md: '# CHAPTER FIVE


    # Migrating

    Solaris Applications to Linux


    One of the consequences of the increasing popularity of Linux is that companies
    are enthusiastic to migrate their existing applications and development environments
    to Linux. An application following the standards will be easier to port than a
    nonconformant application. Since Linux and Solaris share the common API sets of
    UNIX, migrating from Solaris to Linux is easier than from an operating system
    with different APIs, such as Microsoft Windows.


    This chapter provides an outline of the advantages of such a migration and the
    path that can be taken. In addition to providing the toolkits that can be used
    in the process of migration, some standard-related porting issues are also discussed.


    # 5.1 ROADMAP TO PORT


    Developing a portable application is not a easy task. Even though both Solaris
    and Linux are UNIX variants, there are lots of differences in the APIs, system
    calls, and other components. Any Linux distribution comes with ample documentation
    on how to make use of these interfaces to develop applications. However, the documentation
    is not always clear, and standards are very versatile. One related standard is
    the Portable Operating System Interface (POSIX) specification (see Section 2.2.1).
    If you develop your application to be in compliance with this specification, it
    is much easier to port.


    Developing an application for a platform also requires a rich set of tools. Linux
    as a platform is bundled with many such tools that are open source in nature.
    These tools include code editors, code formatting tools, compilers,'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'linkers, and debuggers. Also available from various vendors are the commercial
    equivalent of these tools.


    The steps outlined here are just one way of performing a seamless migration; there
    are many other ways. Selection of a migration path depends on the amount of resources
    and time that can be spent on this task. Once a path is chosen, it has to be carried
    out with proper planning and small step executions.


    The idea of this roadmap is to adapt the Solaris application to be migrated so
    that it can run on a SPARC version of Linux. Once this is done, then the application
    migration to the target Linux platform can be carried out with relatively little
    effort.


    # 5.1.1    Step 1: Obtain the Necessary Linux Distributions


    In order to carry out this migration scheme, it is necessary to use two different
    Linux distributions: one Linux distribution for SPARC and another Linux distribution
    specific to the target platform.


    Linux/SPARC, available since 1994, is as old and mature as a regular Linux. Major
    Linux vendors, such as Red Hat and SuSE, have also released their versions of
    Linux/SPARC. Linux/SPARC is available for almost the entire line of SPARC hardware,
    including versions for 32-bit and 64-bit processors.


    Linux is also available for different hardware platforms such as Intel compatible
    PCs, PPC (PowerPC), Alpha processors, Itanium, and mainframes. The list of available
    vendors for various platforms is available on the Web.¹ This list includes both
    commercial and free versions of Linux. You can use this list to determine the
    Linux version based on the target platform, its bundled features and necessary
    funds.


    # 5.1.2    Step 2: Download the Necessary GNU Tools


    GNU has the tools needed for developmental work called GCC (GNU Compiler Collection).
    GCC supports various languages such as C, C++, Fortran,'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'and even Java. A complete list of GNU tools is available online. 2 GNU tools
    favor developing a portable source code while reducing the time spent in the migration
    process. Even a Solaris developer with little Linux knowledge can start producing
    code for the target Linux platform with these tools.


    GNU tools necessary for the Solaris environment can be downloaded from http://www.sunfreeware.com/.
    Most GNU tools for Solaris are available free of cost from this site. GNU tools
    for Linux on SPARC as well as the target platform are also shipped with their
    respective distributions.


    # 5.1.3  Step 3: Build the C/C++ Applications on Solaris


    Once all the build tools are procured, start the build process on Solaris. Use
    the GNU **gmake** utility instead of **make** to build the source code. There
    are considerable differences between these utilities even though they both serve
    the same purpose. The makefile created for the Solaris **make** utility when used
    with the **gmake** utility might generate errors depending on the constructs used
    in it. The respective **gmake** 3 and **make** 4 tool documentation is the best
    source for resolving these errors.


    In spite of the differences between these tools, they also share some common rules
    and suffixes. The targets, macros, and variables shown in Table 5.1 can be used
    interchangeably as they have the same meaning in both utilities.


    After modifying the makefile to comply with **gmake** rules, the next step is
    to try the GNU compilers instead of their Solaris counterparts. The **gcc** compiler
    should be used instead of **cc** and **g++** instead of **C++**. Once the GNU
    compiler is used, there will be lot of errors that can be categorized into errors
    due to command-line option differences and errors due to coding differences. However,
    both these kinds of errors can be resolved mostly by referring to the compiler
    documentation:


    +   * Using and Porting the GNU Compiler Collection (GCC) 5


    +   2. http://www.gnu.org/directory/GNU/

    +   3. GNU **make** (http://www.gnu.org/software/make/manual/make.html).

    +   4. Managing Projects with make (http://www.o-reilly.com/catalog/make2/).

    +   5. http://gcc.gnu.org/onlinedocs/gcc-2.95.2/gcc_toc.html'
  merge: -1
  img_proc: true
- pgno: 85
  md: '| Targets | .DEFAULT, .IGNORE, .PRECIOUS, .SILENT, .SUFFIX |

    |---|---|

    | Internal macros | $*, $§, $?, $<, $@, $$, $(), $(D) |

    | Predefined macros | ar, as, cc, ld, lex, lint, m2c, pc, rm -f, yacc |

    | Environment variable | MAKEFLAGS |

    | Variables | CC, CFLAGS, CPPFLAGS, FC, FFLAGS, LEX, LFLAGS, YACC, YFLAGS, LD,
    LDLFLAGS |


    +   - C User''s Guide⁶

    +   - C++ User''s Guide⁷


    Once the application gets compiled for the Solaris environment, the process has
    to be repeated on a Linux version running on the SPARC hardware. Since the application
    is already compliant with the GNU tools, the only problems that might arise will
    be due to the runtime application programming interfaces. These APIs differences
    need to be corrected for a fully compliant application. The following are some
    major differences between Linux and Solaris.


    # ### System calls


    There are name differences between Solaris and Linux APIs that provide support
    for logical volume support, file access control list, and system audit log. STREAMS
    support, which is useful for writing stream-based network device drivers, is not
    available on Linux but is available on Solaris. So the solution for a problem
    like this is to get a third-party, independently developed solution or rewrite
    the application to use a related technology. In this case, POSIX sockets can be
    used instead of STREAMS for networking.


    # ### Library differences


    The standard C++ libraries that are available on Linux include support for most
    of the functionalities. Solaris has some'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'additional libraries such as *compat=4*, classic *iostreams*, and *math* library
    with support for ASCII-encoded decimal conversions. If the application to be ported
    uses any of these additional libraries, it has to be modified to use the standard
    C++ libraries.


    **Threading differences** Solaris processes are based on threads called *light-weight*
    *processes* (*LWP*). In current Linux implementation, threads are based on *processes*.
    There are two types of threads available in Solaris, POSIX threads and native
    threading model. Linux supports POSIX threads, so all applications that use native
    threads should be modified to use POSIX threads.


    # 5.1.4 **Step 4: Build the Application on Linux for the Target Platform**


    Install Linux on the target platform and rebuild the modified application from
    previous step.


    # 5.2 **ISSUES WITH PORTING**


    Porting applications from a Solaris platform to Linux platform may be considered
    an easy task because of the application level portability provided by the GNU
    C libraries of the Linux platform. In most cases, the application can be ported
    by simply recompiling the program. But if the code has any system or hardware-dependent
    constructs, then some modification is needed to carry out a complete porting.
    The complexity of such a porting effort is directly proportional to the amount
    of system and hardware-dependent code. If the application uses only standard language
    constructs and does not take platform considerations, then such an application
    will be less complicated to port. If the application uses non-POSIX constructs
    or platform-specific optimizations, then the porting will be harder. Typically,
    a Java application would fall in the first category, and a non-POSIX C program
    would fall in the second category. Some of the issues related to porting are explained
    in the following sections.


    # 5.2.1 **Byte Ordering**


    Byte ordering, or *endianness*, is the property of a data element that refers
    to how its bytes are stored or addressed in memory. This property is determined'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'by the CPU architecture of the platfrom. There are two possible values of endianness,
    *big endian* and *little endian*.


    # 5.2.1.1 Big Endian


    In this type of byte ordering the most significant byte is stored at the lowest
    storage address—for example, the most significant byte is stored in the leftmost
    position. Sun SPARC, HP Precision, and the IBM PPC use this type of ordering (Example
    5.1).


    > Example 5.1: Big Endian Ordering

    > Data: 0x33445566

    > Storage:

    > | Byte 0 | Byte 1 | Byte 2 | Byte 3 |

    > | --- | --- | --- | --- |

    > | 33 (most significant) | 44 | 55 | 66 |


    # 5.2.1.2 Little Endian


    In this type of byte ordering the least significant byte is stored at the lowest
    storage address—for example, the least significant byte is stored in the leftmost
    position. Intel and DEC architectures use this ordering (Example 5.2).


    > Example 5.2: Little Endian Ordering

    > Data: 0x33445566

    > Storage:

    > | Byte 0 | Byte 1 | Byte 2 | Byte 3 |

    > | --- | --- | --- | --- |

    > | 66 (least significant) | 55 | 44 | 33 |


    # 5.2.1.3 Byte Ordering and Union Data Structure


    The byte ordering discussed in the previous sections will become an issue in porting
    if the code uses the *union* data structure. *Union* is a data structure to manipulate
    different types of data in the same storage area. It is completely the compiler''s
    responsibility to manage the size and alignment of the data'
  merge: -1
  img_proc: true
