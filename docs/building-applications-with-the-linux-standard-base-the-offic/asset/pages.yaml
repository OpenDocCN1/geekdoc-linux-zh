- pgno: 112
  md: 'When a test campaign requires a warranty of the product working in a particular
    situation, or a warranty that selected applications execute correctly on the product,
    then a Web form will prompt for confirmation during the final registration stage.
    For any problems encountered, it will allow for a problem report ID to be referenced.


    You can obtain help and information as described in Section 6.2.3.


    # 6.3.6.1 Test Journals


    Test results submitted should always include the full journal output from an uninterrupted
    run of the applicable test suite. If this is not possible, a problem report must
    be raised stating the nature of the problem and you should wait for a response
    from the Certification Authority before proceeding further.


    Within the Web certification system you are required to upload test journals for
    each applicable test suite. The system also allows you to obtain a summary report
    of the result status for a test journal. If you decide that this test journal
    is your formal certification test run for your product, you must then select the
    validation tool within the Web certification system. This tool will automatically
    analyze the test results, and, if there are no failed test results or tests requiring
    manual resolution, then the journal will be flagged as OK in the system. If there
    are failed test results detected by the validation tool, then a screen will be
    presented to you with a list of test cases that you will need to resolve. If there
    are tests requiring manual resolution, a screen is also presented with a list
    of test cases you need to resolve.


    The failed test results in the test journal that require resolution are those
    with a status of FAIL, UNINITIATED, UNRESOLVED, or UNREPORTED. The resolution
    process requires you to enter a valid reference to an approved problem report
    from the Problem Reporting database for each failed test case. An approved problem
    report is one that has resulted in an agreed interpretation of the specification,
    a Test Suite Deficiency, or a Certification System Deficiency. These apply to
    specific releases of the specification, test suite, or certification system.


    The test results in the journal that require manual resolution are denoted FIP
    (further information provided). The resolution process requires you to assert
    that the test case resolves to a PASS result for your system, and'
