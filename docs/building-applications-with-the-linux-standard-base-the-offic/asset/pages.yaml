- pgno: 56
  md: '# CHAPTER THREE


    # Using LSB Coding Practices


    This chapter describes the coding practices you should use to develop LSB-certified
    applications. It gives overviews and examples of many of the do’s and don’ts of
    LSB coding practices. Each section includes an explanation of the concept and
    a code example of that concept.


    # 3.1 C AND C++


    This chapter assumes the reader is a knowledgeable C, UNIx, or Linux programmer.
    Suggested prerequisite readings might be: *Practical C Programming, Understanding
    UNIX/Linux Programming, Programming with GNU Software,* or *Learning the bash
    Shell*.


    The LSB references both the “ISO/IEC 9899: 1999, Programming Languages—C” and
    “ISO/IEC 14882: 1998(E) Programming Languages—C++” for C and C++ programming,
    respectively. The GNU Compiler Collection (GCC) project has implemented these
    ISO/IEC standards and is monitoring compliance status. Developers should feel
    confident about this crucial element of open source development.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3.2 INTERNATIONALIZATION


    It is good to strive to write reusable and portable code; however, sometimes the
    uselessness of the software has inadvertent limits because the language and cultural
    requirements of the end user are not actively considered. Fortunately, these issues
    are well understood and the solution has been put in place by the GNU Translation
    project. Linux provides the capability to extract culturally dependent data from
    the application (internationalization) and apply it to various cultures as desired
    (localization).


    Take for example a simple "Hello World" program that prints a short text message
    on the screen. Will the message be displayed in English, Spanish, Japanese, or
    Jamaican English? This depends on whether the original text has been translated
    and properly stored in a message catalog for the application to use, and on whether
    the end user has set his or her locale to find those messages. The setlocale()
    function in Example 3.1 can initialize the locale based on the first nonempty
    value of the three environment variables LC_ALL, LC_MESSAGES, or LANG.


    If the end user sets LANG to en_US then the program will look for U.S. English
    translated text found in the gtw message catalog in the /usr/share/locale/ directory
    set by bindtextdomain().


    Instead of printing a text message directly using printf(), the gettext() function
    is called to look up the MSGID (the default text) in the current default message
    catalog for the current LC_MESSAGES locale. If it''s not found, the function returns
    MSGID itself (the default text).


    Beware that Linux has added gettext() even though POSIX defines catgets() that
    is used on UNIX. The difference between these methods is that catgets() uses a
    numeric message identifier, whereas gettext() uses the default text as the message
    identifier. The disadvantage of catgets() is that the numeric message identifiers
    can easily get out of sync between the application and the message catalog. The
    text message identifiers of gettext() at least have a chance of being found in
    the message catalog if they were moved out of sequence but not altered. For obvious
    reasons, never try to use both methods simultaneously from the same application
    or application family.'
  merge: -1
  img_proc: true
