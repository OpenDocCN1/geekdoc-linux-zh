    # 5.4 RUNTIME LIBRARIES


    A linker is responsible for linking the executables with the required shared libraries.
    Though both environments follow the same method for linking, there are some subtle
    differences (Table 5.3). Linux maintains two different sets of libraries: system
    libraries and user libraries. Solaris has only one set of libraries.


    **Table 5.3: Runtime Library Differences between Solaris and Linux**


