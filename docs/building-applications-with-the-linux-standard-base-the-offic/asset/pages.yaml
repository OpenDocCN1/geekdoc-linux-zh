  md: '# 13.6  BUILDING THE LSB DEVELOPMENT ENVIRONMENT


    Most of the source code for the **lsb-build-base** package is auto-generated from
    the LSB Written Specification database as illustrated in Figure 13.1. This has
    the benefit that the header files and stub libraries are synchronized with the
    specification. Normally it should not be necessary for people to build the source
    code from the database, though all of the scripts and the contents of the database
    are publicly available in the LSB CVS repository.^4


    Source tarballs and source RPM packages for the **lsb-build-base**, **lsb-build-cc**,
    and **lsb-build-chroot** are available from the LSB FTP Archive.^5 The tarballs
    contains a readme that describes how to build the package and the source RPM packages
    can be built as usual with the **rpm** tool (Example 13.16).


    > Example 13.16: Building RPM Packages

    > # rpm --rebuild lsb-build-base-1.3.4-1.src.rpm


    # 13.7  EXPANDING THE LSB DEVELOPMENT ENVIRONMENT


    # 13.7.1  Using Compilers Other Than GCC


    Nearly all of the testing and use of the LSB Development Environment has been
    with GCC as the compiler. It is possible to build LSB-compliant applications using
    other compilers.


    Using the header files and stub libraries of the Development Environment is not
    strictly necessary, though it almost certainly will be easier to do so. The changes
    in the build process required to use another compiler can be summarized as follows.


    +   *   Use the LSB-compliant header files (**lsb-build-base** package).'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/d75cffbcb54aabfb0f9854162061d394_218_0.png)


    Figure 13.1: LSB Development Environment


    +   - Use the LSB-compliant libraries. Using the Development Environment stub
    libraries has the advantage that link errors will occur if you attempt to use
    non-LSB interfaces.

    +   - Ensure that the binary uses the LSB dynamic linker instead of the standard
    Linux linker for that architecture. For example, on x86 machines /lib/ld-lsb.so.1
    should be used instead of /lib/ld-linux.so.2.


    If you use `lsb-build-chroot`, then the first two changes are taken care of automatically.
    The way to achieve the third one will be compiler-dependent; as an example, with
    gcc this is done by editing the `specs` configuration file.


    # 13.7.2 Integration with an IDE


    Integration of `lsb-build-cc` with an IDE should be fairly straightforward, as
    the only change required is to call **lsbcc** instead of the normal compiler.
    In the case of `lsb-build-chroot` it would be necessary to run the compilation
    process inside of the `chroot`. This could be achieved using a helper program,
    or perhaps communicating with a compilation daemon that is running inside the
    `chroot`.'
