- pgno: 194
  md: '![](img/d75cffbcb54aabfb0f9854162061d394_194_0.png)


    Figure 12.1: LSB-si Build


    The build is a multistage process (Figure 12.1), so that the final result has
    been built by the LSB-si itself, and the majority of dependencies on the build
    environment of the host machine are eliminated. Ideally, all the dependencies
    would be eliminated, but in practice a few minor things may leak through. In particular,
    the initial stage of the LSB-si build now does not do the GCC *fixincludes* step
    as this pulled in some details of the host system in the “fixed” header files
    that were then used throughout the build process.


    The *first phase*, or bootstrap, of the LSB-si build is to produce a minimal toolchain
    of static binaries as shown in Figure 12.1. Packages such as *gcc*, *binutils*,
    *kernel-headers*, and *coreutils* are built.


    The *second phase* of the build is to use the bootstrap as a *chroot* environment
    to build a more complete toolchain as shown in Figure 12.1. As binaries are rebuilt,
    the new ones are installed on top of the old static copies built in the bootstrap
    phase so that by the end of the second phase, we have a complete development environment,
    using all dynamic libraries. This environment has the characteristic that it is
    entirely isolated from the details of the build host environment, since none of
    the tools from the build host have been used to compile the final binaries and
    libraries.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'To reduce the rebuild time, the bootstrap phase is copied to another location
    before starting, and the copy is used as phase 2. During LSB-si development, there
    tend to be few changes to the bootstrap, but many to the later phases. For a released
    LSB-si source tree, this really doesn’t matter except that it increases the space
    requirements of the build area a bit. Thus the bootstrap copy of second phase
    is not essential for the build strategy, but rather a convenience for LSB-si developers.


    This intermediate phase 2 of the build can be used as an LSB Development Environment;
    in effect, this is what it does when building the final phase. The final phase
    does not have a compilation environment, as that is not part of the LSB Written
    Specification. The intermediate phase 2 is designed to be used as a chroot environment;
    using the compiler directly (not in a chroot) won’t work as things will point
    relatively to the wrong places. Although the intermediate phase 2 is for the same
    architecture as the host machine, it is more like a cross-compilation environment.
    Note that producing a more usable build environment is a future direction; the
    current intermediate phase is not officially supported as such and the bundle
    is not part of the released materials.


    The **third phase** is the construction of the actual LSB-si as it will be delivered
    as shown in Figure 12.1. In this phase, the completed second phase is used in
    a chroot as the development environment, and each package is then compiled and
    installed to a target location in the LSB-si tree. During the third phase, care
    is taken not to install unnecessary binaries or libraries, because an upstream
    source package will often bundle and install more than is required by the LSB,
    and these need to be pruned from the final tree.


    Since the LSB team has already anticipated several uses for the LSB-si that require
    more than the core set, there exists a **fourth phase** that builds add-on bundles
    that can be installed on top of the base LSB-si bundle to provide additional functionality
    as shown in Figure 12.1. There are currently three sub-phases of the fourth phase:
    the first one to build additional tools required for running the lsb-runtime-test
    suite on the LSB-si, the second to build additional binaries to make a bootable
    system, and the third to build additional binaries to make a User-Mode Linux system.
    The fourth phase is built by the second phase build environment just like third
    phase, and is completely independent of the third phase. That is, if one had a
    completed second phase, one could start off a fourth phase build without ever
    building the third phase.'
  merge: -1
  img_proc: true
