- pgno: 184
  md: '# CHAPTER TWELVE

    # Using the Sample Implementation


    The LSB Sample Implementation (LSB-si) is a minimal LSB-conformant runtime environment
    used for testing purposes. Think of it as a tiny Linux distribution that you have
    complete control over. It can be booted as a standalone system, hosted inside
    a virtual machine, or run in a change-root mode. It is particularly convenient
    to use hosted mode as a way to enable an LSB test environment to exist on a system
    without disrupting the base system, thus reducing the need for multiple dedicated
    LSB test machines.


    LSB-compliant applications should be tested inside the LSB-si to insure they haven’t
    picked up any distribution-specific quirks. The LSB Certification program, as
    outlined in Chapter 7, requires that an application be tested under the LSB-si.


    The LSB-si can also be used in a variety of validation scenarios where there’s
    a desire to limit the installed environment to the minimal set required by the
    LSB.


    # ## 12.1 UNDERSTANDING THE SAMPLE IMPLEMENTATION


    The LSB-si is an example runtime environment implementation. It is the accumulation
    of elements that are both explicitly required and implied by the LSB Written Specification,
    plus any necessary dependencies to make the runtime environment work.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The LSB-si has three main purposes. First, it is an example implementation
    to demonstrate the features and correctness of the LSB Written Specification.
    Second, it serves as an example of building an LSB-conformant system from current
    open source packages without a lot of special patching. Thirdly, the LSB-si is
    a testing sandbox to help evaluate the LSB compliance of an application. If an
    application fails because it requires something not found in the LSB-si, then
    this is an opportunity to trim or rework the dependencies of an application to
    help better conform to the LSB.


    The LSB-si is a *sample implementation*, not a *reference implementation*. The
    difference is that a sample implementation demonstrates one way to conform to
    the specification, while a reference implementation serves as a baseline for conformance
    validation. In a reference implementation scenario, other implementors are required
    to be compatible with all of the reference implementation, including all the features
    and bugs unintentionally present in it. In addition, a reference implementation
    constrains the evolution of other implementations because even legitimate enhancements
    or fixes would deviate from the reference, thus breaking adherence.


    The LSB is an ABI specification designed to capture the functional requirements
    of a conforming system without locking in any specific implementation, versions
    of software packages, and so on, as being the standard. By specifying the behavior
    of required elements and avoiding a reference implementation, the LSB permits
    conforming runtime environments and applications to evolve within the ABI confines
    of the Written Specification.


    # 12.2  SETTING UP THE SAMPLE IMPLEMENTATION


    The LSB-si can be run in one of three different modes: the `chroot` LSB-si, the
    UML LSB-si, and the bootable Knoppix LSB-si. Software for each mode can be downloaded
    from the LSB Download Web site. ${ }^{1}$


    +   1. http://www.linuxbase.org/download/'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 12.2 Setting Up the Sample Implementation


    # 12.2.1 Sample Implementation Using chroot (1)


    The chroot LSB-si is distributed as a compressed tarball that should simply be
    unpacked by the supereuser (Example 12.1). Later, other pieces can be layered
    on top of it, and packages for additional functionality can be installed inside
    it. For illustrative purposes, the IA32 (x86) architecture will be used in the
    following examples. For your situation, you may need to substitute the appropriate
    LSB architecture and version.


    ```

    **Example 12.1: Installing LSB-si on IA32 (x86) Architecture**

    ```

    # mkdir /opt/lsbsi-ia32

    # cd /opt

    # tar jxvf /tmp/lsbsi-ia32-2.0.1.tar.bz2

    ```

    ```


    The LSB-si can be started by running the `/sbin/chroot` command (Example 12.2;
    some distributions place this command in `/usr/sbin`).


    ```

    **Example 12.2: Starting LSB-si by the /sbin/chroot Command**

    ```

    # /sbin/chroot /opt/lsbsi-ia32

    ```

    ```


    To simulate a login session, use this command as shown in Example 12.3.


    ```

    **Example 12.3: Login Session**

    ```

    # /sbin/chroot /opt/lsbsi-ia32 /bin/hash -l

    ```

    ```


    When working in the chroot, only files inside the chroot tree will be accessible.
    Since this limits the usefulness of the environment, some steps should be taken
    ahead of time to make the necessary files available. One approach is to simply
    copy files from the chroot into a suitable location. If another window or terminal
    session is available on the host system, it is also possible to copy files into
    the chroot tree the same way, whenever they are needed (Example 12.4).'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Example 12.4: Copying Files into chroot


    ```

    # cp mypackage.rpm /opt/lsmi-la32/tmp


    ```


    Another approach is to establish bind mounts before starting the *chroot*. These
    bind mounts enable portions of the file system of the host to appear to be inside
    of the *chroot*. Bind-mounting a user''s home directory to the same location in
    the *chroot* will make that user''s files appear in the same path inside the *chroot*
    as on the host system. Example 12.5 shows setting up access to the files in the
    home directory of *username*.


    # Example 12.5: Bind Mounts


    ```

    # mkdir /opt/lsmi-la32/home/username

    # mount -o bind /home/username /opt/lsmi-la32/home/username


    ```


    > This does not cause the user account itself to exist in the *chroot*. The *useradd*
    command should be used to add the account. The account should be given the same
    *userid* as it has on the host system.


    The LSB-si limits itself to commands and features required by the LSB Written
    Specification, which is a set chosen to be able to minimally install, configure,
    and administer installed software. This has some testing benefits, but this also
    means there likely are a few missed components. These are not hard to work around,
    but the LSB-si philosophy leaves them out; by having to install them specifically,
    you become aware of these areas that are actually not standard across systems.


    The **rpm** tool needs access to */proc* to calculate disk space (the mounted
    file system table is found through */proc*). However, */proc* is not part of the
    LSB Written Specification. The simplest workaround is to add a line describing
    it to the */etc/fstab* of the LSB-si so that you can simply say *mount /proc*.
    Example 12.6 shows such a line, through it is best to simply copy the line from
    */etc/fstab* on the host system.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# **Example 12.6: Adding /proc to fstab**


    ```

    none /proc proc defaults 0 0

    ```


    Depending on your requirements, you may also need to perform similar steps for
    other pseudo filesystems such as /dev/shm and /dev/pts.


    Some of the commands you may be accustomed to may be missing, including editors
    and development tools. Many developers have found it useful to work in a windowed
    environment, with one window running the LSB-si chroot and others set up to be
    able to edit and otherwise modify files as necessary.


    Example 12.7 illustrates copying an installable package into the chroot tree,
    starting the chroot, installing the package, and running it. As this example will
    utilize the X Server on the host system, an additional setup step to enable access
    to this server is included before the chroot is started.


    # **Example 12.7: Installing a Package on chroot**


    ```

    # cp lsb-xpaint-2.6.2-3.1486.rpm /opt/lsb1-i32/tmp

    # xhost +localhost

    # /sbin/chroot /opt/lsb1-i32

    # cd /tmp

    # rpm -i lsb-xpaint-2.6.2-3.1486.rpm

    # rpm -qa

    # export DISPLAY=localhost:0

    # /opt/lsb-xpaint/bin/xpaint

    ```


    For networked applications, some additional support is probably needed. For example,
    the /etc/services file is not described by the LSB, and thus is not present in
    the chroot. If needed, simply copy it over from the host system.


    Also, if a server (daemon) is to be tested, it will first need to be set up to
    listen on the appropriate port; secondly, any conflicting service on the host'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'system must be disabled so the connection actually reaches the daemon in the
    LSB-si chroot.


    The base LSB-si does not have the **inetd** or **xinetd** servers, so by default
    these cannot be used to listen for service requests. The `lsb-si-archtest` package
    can be installed to provide **inetd**. Example 12.8 shows a normal run of `lsb-runtime-test`
    to validate the LSB-si. The `lsb-test` package is previously installed. One part
    of testing requires the `syslog` daemon, so the `syslogd` from the host system
    is shut down first. The test setup requires a true login, so **inetd** is started
    to watch over a `telnet` daemon.


    # Example 12.8: Using the lsb-test Package to Run inetd


    ```

    # sh /etc/init.d/syslog stop

    # /usr/sbin/chroot /opt/lsbsi-ia32

    # mount /proc

    # /sbin/syslogd -m 0

    # /usr/sbin/inetd

    ```


    Now connect to the LSB-si chroot using telnet, and log in as a user defined inside
    the LSB-si (Example 12.9).


    # Example 12.9: Connecting to chroot


    ```

    $ telnet localhost

    ```


    # 12.2.2 Sample Implementation Using UML


    The UML LSB-si runs off a *root filesystem* that is encapsulated in a file. The
    LSB-si will not be able to "see" outside this filesystem except if running *hostfs*,
    in which case the fileystem tree of the host can be mounted and accessed. This
    is the easiest way to get files, such as packages, to be installed into the UML
    LSB-si.


    It is also possible to copy files into the *root_fs* (root filesystem file) of
    the UML LSB-si. This is a little tricky, so proceed carefully (Example 12.10).'
  merge: -1
