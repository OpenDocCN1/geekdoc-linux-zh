    Standards Group FTP site. The **expect** and Tcl applications have some automated
    tests that are part of the source code used to build them. The configuration instructions
    describe creation of directories to contain these tests and the process for populating
    them. The **xpdf** application instructs on downloading two PDF documents that
    will be used during functional testing.


    There are a few additional configuration steps for several of the appbat applications,
    but they are much less involved. However, these steps will help you make testing
    of the applications go as smoothly as possible. For instance, the applications
    using X graphical interfaces (Celestia, XPaint, and **xpdf**) must make sure the
    DISPLAY environment variable is set properly. If it is not set correctly, it may
    affect their ability to execute and verify the functional tests. Another small
    configuration step is for the Python application. Part of the functional test
    for Python involves running some automated Python test'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'scripts. Before the test, the tester is instructed to temporarily set aside
    the precompiled scripts that were created when building the Python application.
    Doing this will cause the test to compile the scripts before executing them.


    # 14.2.4  Functional Testing of the Application Battery


    As mentioned previously, the Application Battery is one of the components of certification
    for a Linux distribution. The distribution must prove it can install and execute
    applications that have demonstrated themselves to be compliant with the LSB Written
    Specification. The functional testing of the Application Battery is not overly
    exhaustive, but it will exercise enough of the applications to confirm they run
    properly on the Linux distribution. Some of the functional tests take advantage
    of automated regression tests that are provided with the source code for the application.
    The rest of the applications require a set of interactive steps to operate certain
    procedures in order to produce expected results. In most instances, it should
    not take more than a few hours to run through all the functional tests in the
    Application Battery.


    In an ideal world, all applications in the Application Battery would have automated
    tests to verify their proper operation. Although the real world is far from ideal,
    at least some of the appbatt applications provide regression tests. For the **expect**
    and Tcl applications, the test scripts must be downloaded from the Free Standards
    Group FTP site. The regression test scripts for Python are included with the package
    used to install the application. In each instance, the functional test for the
    application describes how to execute the regression test scripts and what the
    tests results should look like. The functional test for **expect** contains 25
    tests, all of which must pass. The functional test for Tcl contains 6,851 tests,
    all of which must either pass or be skipped. For Python, there are more than 150
    potential tests to be executed. The number of tests to pass may vary from system
    to system depending on what features are available, but none of them should fail.


    The functional test for Celestia combines a few interactive steps with a more
    involved automated test. Unlike other automated tests, the one for Celestia does
    not produce any sort of log file nor does it report the numbers of tests passed
    and failed. Instead, the completion of the automated test is enough proof that
    the application operated successfully. The Celestia application is a graphic-intensive
    space simulator; its visual nature ensures that it stresses'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'many of the graphical interfaces defined by the LSB Written Specification.
    The first few interactive steps in the functional test for Celestia involve entering
    the proper keys to have the application “travel” to the planets Earth and Mars.
    After this, the letter “d” is entered to run a demo scenario showing the features
    of Celestia. The scenario execution will take between five and ten minutes to
    complete.


    The rest of the Application Battery functional tests are very interactive. With
    no formal regression tests available, the tests attempt to execute some of the
    more frequently used features of the applications. **The groff** application is
    part of a suite of text processing programs, but it does not provide a regression
    test and is mainly used via the command line. The LSB functional test for **groff**
    simply uses the application to format several manual pages provided with the application
    itself and display them on the screen. The **Lynx** application is a little more
    visual, being a text-based Web browser. Since the functional test for Lynx cannot
    assume that the system being tested is on a communications network, it restricts
