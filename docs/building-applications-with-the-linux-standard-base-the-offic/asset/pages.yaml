  md: '# APPENDIX B

    Resources


    # B.1 Glossary


    **Applicant** The supplier who is in the process of having a product certified.


    **Certification** The proof of compliance by some agreed measure. Sometimes there
    is not a total proof, but a warranty. Additionally, there may be a logo or mark
    that can be used in association with a certified product.


    **Certification Agreement** The agreement between the applicant and the Certification
    Authority, which defines the certification service and contains the legal commitment
    by the applicant to the conditions of the certification service.


    **Certification Authority** The organization officially sanctioned by the Free
    Standards Group to manage the day-to-day operations of the LSB Certification program.


    **Certification Register** A record of all certified products, which is maintained
    by the Certification Authority and made publicly available via the Internet.


    **Certification System Deficiency** An agreed error in the certification system,
    which is inhibiting the certification process. The certification system includes
    both the certification process and information systems'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'provided to implement certification. A Certification System Deficiency is one
    possible outcome of a problem report.


    **Certified Product** A product or product family that has successfully completed
    the certification process and for which the supplier of such product or product
    family has been notified in writing by the Certification Authority that certification
    has been achieved.


    **Compliance** A claim of conformance.


    **Conformance** Requirements are stated in a specification. They are an agreed
    set of rules defining what it means to meet the specification.


    **Conformance Requirements** A definition of the mandatory requirements a product
    must meet and any options it must implement in order to be considered conformant.


    **Conformance Statement** The documented set of claims describing precisely the
    way in which a product meets the conformance requirements, including which optional
    features are supported. It provides a precise identification of the certified
    product for which conformance is guaranteed. It also includes details on the specific
    configuration used to validate conformance, in sufficient detail to enable the
    results of any applicable tests to be reproduced.


    **Free Standards Group, The** A nonprofit corporation organized to accelerate
    the use and acceptance of open source technologies through the development, application,
    and promotion of standards.


    **Interpretation** Decision made by the Specification Authority that elaborates
    or refines the meaning of a Free Standards Group specification or a standard or
    specification referenced by a Free Standards Group specification. An Interpretation
    is one possible outcome of a problem report.


    **LSB** Linux Standard Base. This is a historical name, and does not limit the
    LSB Written Specification to any specific operating system.


    **LSB Application** LSB Application certification is for applications conforming
    to the LSB Written Specification. LSB Applications are'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'the consumers of the services provided by LSB Runtime Environments.


    **LSB Development Environment** LSB Development Environment certification is for
    platforms on which LSB-conformant applications can be built from source code.
    Platforms providing an LSB Development Environment need not provide an LSB Runtime
    Environment.


    **LSB Internationalized Runtime Environment** LSB Internationalized Runtime Environment
    certification is for platforms providing services that conform to the LSB and
    OpenII8N specifications. The platform must be registered as conformant to the
    LSB Runtime Environment product standard prior to or concurrent with an LSB Internationalized
    Runtime Environment Product Standard registration.


    **LSB Runtime Environment** LSB Runtime Environment certification is for platforms
    providing services that conform to the LSB Written Specification.


    **OpenII8N** The Free Standards Group Open Internationalization Initiative. This
    was formerly known as the LI18N/X specification.


    **Platform** An operating system environment. It may consist of a complete operating
    system with kernel, libraries, and utilities; it may also be a hosted environment
    or emulation that provides the equivalent functionality.


    **Problem Report** A question of clarification, intent, or correctness of the
    specification(s), test suites, or certification system, which, if accepted by
    the Specification Authority, will be resolved into an Interpretation, Test Suite
    Deficiency, or Certification System Deficiency, respectively.


    **Product Standard** The document in which conformance requirements are specified
    for a particular type of product, and against which products may be certified
    in the program. There will be one product standard for each type of product to
    be certified, that is, one for LSB Runtime Environment, LSB Application, LSB Development
    Environment, and LSB Internationalized Runtime Environment, respectively. Apart
    from the LSB Internationalized Runtime Environment product'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'standard, there will be a set of such product standards for each architecture
    specified by the LSB Written Specification.


    **Registration Form** A form completed by the applicant to apply for certification
    for a particular product. The form contains information on the applicant and the
    product to be certified.


    **Specification Authority** A Free Standards Group workgroup, which is responsible
    for developing, maintaining, and interpreting the applicable Free Standards Group
    specification(s).


    **Supplier** A product vendor who is interested in, is applying for certification
    in, or has certified a product in the Free Standards Group certification program.
    During the period in which a supplier is going through the certification process
    to get a product certified, the supplier is referred to as an applicant.


    **Test Suite Deficiency** An agreed error in a test suite, which is causing it
    to produce an incorrect result code that impacts certification. A Test Suite Deficiency
    is one possible outcome of a problem report.


    **Test Suite Maintenance Authority** The organization(s) sanctioned by the Free
    Standards Group to maintain the test suites.


    **Trademark License Agreement** The agreement between the supplier and the Free
    Standards Group, which contains the legal commitment by the supplier to the conditions
    of use of the Free Standards Group trademark and the Free Standards Group certification
    program.


