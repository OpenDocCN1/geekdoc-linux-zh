- pgno: 204
  md: '# # CHAPTER THIRTEEN


    # ## Using the LSB Development Environment


    The LSB Development Environment are designed to help developers build applications
    which conform to the LSB Written Specification. They primarily do this by providing
    easy ways to


    +   - Compile against header files that contain definitions required by the LSB
    Written Specification

    +   - Dynamically link against shared libraries that contain only interfaces required
    by the LSB Written Specification


    # ### 13.1 UNDERSTANDING THE LSB DEVELOPMENT ENVIRONMENT


    The LSB Development Environment is not intended to be an Integrated Development
    Environment (IDE) in itself, but rather an enhancement to existing IDEs, to allow
    them to build binaries that are LSB-compliant. Note that although the LSB Development
    Environment helps programmers build LSB-compliant applications, it not the only
    way to do so.'
  merge: -1
  img_proc: true
- pgno: 205
