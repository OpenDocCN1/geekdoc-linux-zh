- pgno: 4
  md: '# PRAISE FOR THE LINUX STANDARD BASE


    “Community-built software and community-built standards are two sides of the same
    coin. Standards help ensure that the freedom to invent, the essence of open source
    and Linux, doesn’t compromise the ability to write software that works together
    effectively. The LSB is an important set of standards for the Linux community.”


    —*Brian Behlendorf, Apache Software Foundation, CollabNet*


    “With the recent success of the LSB and the adoption on a wide scale of the LSB
    standards, building applications that are standards-compliant has become a much
    easier and more necessary part of the development on Linux as a platform.”


    —*Jeffrey “Hemos” Bates, Editor, Slashdot.org*


    “In the days before the LSB, every change and every improvement we wanted to make
    to our Linux product was subject to somebody saying, ‘But wait! I depend on that!’
    The LSB laid out what interfaces were defined and how they should be used. Since
    the LSB was adopted, we have been free to innovate without fear of breaking somebody
    else’s assumptions. The success of the LSB recommended it as the starting point
    for the U.S. Department of Defense’s Common Operating Environment (COE) specification
    for Linux. Without the LSB, there would be no COE-certified Red Hat products today.”


    —*Michael Tiemann, Chief Technology Officer, Red Hat, Inc.*


    “As an active LSB member, SUSE LINUX is committed both to providing customers
    with standardized Linux technology and to simplifying ISV’s and IHV’s Linux certification
    efforts. The availability of common standards plays a decisive role in the proliferation
    of Linux operating systems and applications on server and client systems worldwide,
    and we appreciate the LSB project’s work in developing and promoting these standards.”


    —*Markus Rex, General Manager of SUSE LINUX for Novell*


    “We are very happy to see the progress of LSB, both in the definition of the standard
    and in its broad support. LSB is an important part of our strategy and MandrakeSoft
    will continue to support the efforts of LSB to define a standardized ABI and encourage
    ISVs to build and certify to this standard.”


    —*Francois Bancilhon, Chief Executive Officer, MandrakeSoft*


    “The launch of the LSB is a significant development for the Linux community. For
    the very first time in history, a common binary computing environment will be
    able to be shared across different systems from different vendors. The LSB will
    play a pivotal role in ensuring the proper development of the Linux market. Sun
    Wah Linux is excited about this phenomenon and is dedicated to supporting LSB’s
    future efforts and endeavors.”


    —*Alex Banh, Chief Executive Officer, Sun Wah Linux, P.R.C.*'
  merge: -1
  img_proc: true
