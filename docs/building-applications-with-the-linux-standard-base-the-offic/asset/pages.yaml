- pgno: 102
  md: '# # CHAPTER SIX


    # ## LSB Certification for Linux Distributions


    This chapter provides an overview of LSB Certification for a runtime environment
    and is based on the Guide to LSB Certification ([http://www.opengroup.org/lst/cert/docs/LSB\_Certification\_Guide.html](http://www.opengroup.org/lst/cert/docs/LSB_Certification_Guide.html))
    produced by The Open Group. An overview of LSB Certification for application programs
    is provided in the next chapter.


    # ### 6.1 INTRODUCTION


    Products or ranges of products that meet the LSB conformance requirements can
    apply for LSB certification. The certification process requires a demonstration
    of conformance to the LSB Certification Authority (a vendor-neutral third party).
    The detailed requirements for conformance are identified in the LSB Product Standards
    and include passing sets of tests and completing a Conformance Statement. Only
    suppliers of certified products are permitted to use the LSB trademark in connection
    with their product.[^1]


    A number of documents contain the requirements of the LSB Certification program.
    The LSB Certification Policy governs the Free Standards Group LSB Certification
    program. The use of the LSB trademark is governed by the LSB Trademark License
    Agreement. The LSB Certification Agreement covers the


    > [^1] Portions of this chapter were derived with permission from LSB Certification,
    The Open Group ([http://www.opengroup.org/lst/cert/](http://www.opengroup.org/lst/cert/)).'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'terms and conditions of the certification service. If you intend on submitting
    a product for certification then you must agree to the terms and conditions outlined
    in all three documents prior to certification.


    # ## 6.1.1  Highlights


    Significant highlights of the LSB certification process are outlined below:


    +   - The LSB Certification program is administered on behalf of the Free Standards
    Group by its designated Certification Authority, The Open Group.

    +   - Applicants will be granted a license to use the LSB trademark in connection
    with a product once the product has passed the applicable certification test suite(s)
    and the applicant has formally agreed to all the required terms.

    +   - The LSB Trademark License Agreement must be fully signed (signatures are
    required from both the applicant and the Free Standards Group) in order to have
    a product certified.

    +   - A certified product is subject to recertification on a periodic basis as
    stated in the LSB Certification Policy.

    +   - All product information supplied to the Certification Authority will be
    treated as confidential, as required by the LSB Certification Agreement.

    +   - The LSB Certification Authority may, from time to time, request proof that
    the certified product remains in compliance with the requirements outlined in
    the LSB conformance requirements, as required by the LSB Certification Policy.


    # ## 6.2  ACHIEVING LSB CERTIFICATION


    This section details the steps required to achieve certification and provides
    information on how to perform each of these steps. The process involves


    +   - Understanding the certification program and process

    +   - Testing the product informally'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - Applying for certification

    +   - Formal testing and submission of results


    # 6.2.1 Understanding the Certification Program


    To become familiar with the program, the following program documents should be
    read:


    +   - LSB Certification Policy

    +   - LSB Product Standards


    # 6.2.1.1 LSB Certification Policy


    It is best to start with the LSB Certification Policy, which is the foundation
    of the program. It provides information on what types of products can be certified
    in the program, what it means to be certified, what is required to get a product
    certified and how to make sure that a product remains certified. The LSB Certification
    Policy defines the following types of products:


    +   - LSB Application

    +   - LSB Runtime Environment

    +   - LSB Internationalized Runtime Environment

    +   - LSB Development Environment


    The definitions of these products are included in Section 1, Overview, of the
    LSB Certification Policy.


    > In the current version of the program, registrations are only being accepted
    for the first three of these product types.


    # 6.2.1.2 LSB Product Standards


    The LSB Product Standards should then be read to understand the detailed conformance
    requirements against which a product can be certified. Product standards provide
    a mapping between certification, the LSB specifications, and the test suites needed
    to demonstrate conformance. There is an LSB product standard for each type of
    product that can be certified. The LSB'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Certification Web site should be consulted for the current set of product standards
    for which certifications are being processed.


    In order to determine which product standards are suitable for a product to be
    certified against, applicants should review Section 3, Conformance, of the LSB
    Certification Policy and the LSB Product Standards.


    # 6.2.2 Confidentiality


    The applicant’s company and product details are confidential between them and
    the LSB Certification Authority. This is effective once the applicant accepts
    the LSB Certification Agreement, which is a prerequisite to registering a product.
    The Certification Authority does not make any certification information available
    to any third party, including Free Standards Group employees, consultants, or
    members, without the written permission of the applicant.


    Upon successful completion of the certification process, the certified product
    will be included in the publicly available Certification Register. However, to
    enable applicants to launch a certified product, they can request that their certification
    remain confidential for up to six months from the date of written notification
    by the Certification Authority that a product has achieved certification. A request
    that the certification remain confidential can be made in the final step of the
    product registration (see Section 6.3.7). See Section 11.3 of the LSB Certification
    Policy for further information.


    # 6.2.3 Informal Testing


    Normally, testing a product with the LSB certification test suite(s) is the first
    activity. Applicants should read the applicable product standard for the product
    that is being considered for certification, referring to the Indicators of Compliance
    section to identify the required certification test suites. These test suites
    are freely available from the Free Standards Group and should be used, along with
    any additional method deemed appropriate, to make sure that the product meets
    the applicable conformance requirements and is ready for entry into the certification
    program.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 6.2.3.1 Authorized Test Suites


    It should be noted that for formal testing, only currently authorized versions
    of the LSB certification test suites can be used. So, for informal testing it
    is vital that you use an authorized version. The Certification Authority maintains
    a list of the currently authorized certification test suites. ${ }^{3}$ Since
    the test suites come from multiple sources, this online document includes information
    on how to obtain the test suites.


    # 6.2.3.2 Problems and Problem Reporting


    If problems are encountered when running the certification test suites, first
    read the documentation provided with the test suite. If this does not answer the
    questions, please check the Frequently Asked Questions. ${ }^{4}$ If an answer
    still cannot be found, a report should be sent to the appropriate Test Suite Maintenance
    Authority as noted in the Frequently Asked Questions file.


    If one of the authorized test suites is being used and failures occur but it is
    believed that the product conforms to the specifications, check the Problem Reporting
    ${ }^{5}$ information database. The online Problem Reporting database contains
    known information on existing bugs and interpretations of the specification. The
    issue may already be resolved by an LSB Specification Interpretation, or by an
    agreed Test Suite Deficiency. If it is not, please submit a new problem report.


    # 6.2.4 Certification


    Certification is a formal process. The supplier of a certified product warrants
    and represents that the product meets all the conformance requirements applicable
    to the product standard against which it is certified, and implements all the
    features claimed in the Conformance Statement.


    The obligations, terms, and conditions of certification are fully set out in the
    following documents:


    +   3. http://www.opengroup.org/lsb/cert/docs/testsuites.html

    +   4. http://www.opengroup.org/lsb/cert/docs/faq.html

    +   5. http://www.opengroup.org/lsb/cert/PR/'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   *   LSB Certification Policy

    +   *   LSB Trademark License Agreement

    +   *   LSB Certification Agreement


    These documents are available from the LSB Certification Web site.<sup>6</sup>
    These documents should be read before the certification process is started in
    order to fully understand the policies and requirements.


    # 6.2.5 The Trademark License Agreement


    The LSB Trademark License Agreement (TMLA) is between the supplier and the Free
    Standards Group and requires signature. It is recommended that suppliers commence
    the process to complete the Trademark License Agreement as soon as possible to
    avoid delays later in the certification process. A trademark license must be obtained
    before a product can complete the certification process and be entered onto the
    Certification Register.


    The Trademark License Agreement only needs to be entered into once per organization.
    When it is in place, multiple products can be certified.


    # 6.2.6 The Certification Agreement


    You are required to agree to the LSB Certification Agreement for each product
    registration. The LSB Certification Agreement is between the supplier and the
    Certification Authority. It defines the certification service and the legal commitment
    to the conditions of the service.


    > The LSB Certification Agreement is a Web-based agreement. When suppliers click
    the I accept button they indicate that they accept the terms and conditions of
    the Agreement.


    6. http://www.opengroup.org/lsb/cert/'
  merge: -1
  img_proc: true
