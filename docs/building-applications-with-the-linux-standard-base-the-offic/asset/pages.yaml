- pgno: 132
  md: '# # CHAPTER EIGHT


    # # Adding New Interfaces to the LSB Written Specification


    This chapter describes the process by which the LSB workgroup and Open Source
    community expands the standards by adding new interfaces to the LSB Written Specification.


    # ## 8.1 MOVING FORWARD


    As mentioned in previous chapters, the first few years of the LSB efforts and
    the initial versions of the specifications produced in those years were the product
    of a core group of Linux developers with a closely shared vision. As that vision
    matured and both the specification and audience grew, it became clear that a more
    formal process was needed. No longer could everyone using and developing the LSB
    be expected to have internalized this vision, so an official process needed to
    be created. The process used in the early years served its purpose of quickly
    identifying the "low-hanging fruit" that needed to go into the core specification
    right away, and tolerance for minor mistakes was a worthwhile trade-off for an
    accelerated schedule. However, once the first official version of the Written
    Specification was released June 2001, the audience of the standard was now much
    larger and was demanding both a high quality, stable standard and additional new
    interfaces. A group of people interested in these goals began meeting on a regular
    basis to discuss them. This group of people became the LSB Futures subcommittee
    <lsb-futures@freestandards.org> of the LSB workgroup. In addition'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'to tracking new interfaces, the group developed the official criteria and

    processes for adding new interfaces.


    The LSB effort is unique in that it is standardizing interfaces that were developed
    (or endorsed in implementation) by the Free/Libre and Open Source Software (FLOSS)
    communities. Most previous standardization efforts were the result of industry
    consortiums that could often dictate the direction of the standard, despite dissenting
    voices. This is not to say that previous standards efforts did not try to build
    consensus among those involved, only that the LSB effort represents a consensus
    on a scale not seen before. Where previous efforts could make standardization
    choices based on primarily technical factors, release a new version of a standard,
    and expect implementors to make changes to match the new specification, the LSB
    workgroup must hold to a different model. First, consensus about the interface
    must be built among the community, then the interface must be implemented among
    the major runtime providers, and finally, and only after those steps are completed,
    can it be added to the LSB Written Specification. As a method of objectively measuring
    these steps, a list of selection criteria was created.


    # 8.2 LSB SELECTION CRITERIA


    Candidates for inclusion in the LSB, via the LSB Futures process, progress by
    completing a series of steps divided into three broad categories: *identification*,
    *investigation*, and *implementation*. The first two are informational, and progress
    is made by supplying the information for tracking. If there are no blocks in these
    phases, the implementation phase can commence.


    # 8.2.1 Phase 1: Identification


    **Demand** There needs to be sufficient demand for the component to be standardized.
    Demand can be measured in many ways, such as heavy usage of a component in the
    community or multiple requests from developers. Keep in mind that, while there
    may be demand for many things, not all will meet the additional criteria.


    **License** The component should have at least one compliant implementation available
    under an open source license that also promotes a “no'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'strings attached" environment for developers. This means that the developers
    would be able to develop and deploy their software however they choose using at
    least one standard implementation. This is interpreted to mean that at least one
    implementation is available under a license that meets the Open Source Definition,
    but also does not restrict proprietary usage at runtime or in development. The
    rationale for this criteria is very similar to that of licenses like the LGPL:
    By licensing under terms that allow use by all programs, the interface can be
    put into much wider use.


    **Best Practice** The candidate must represent the "best practice" in the development
    community for the problem it solves. It needs to have emerged as a clear de facto
    standard and be available on most (or all) of the major distributions.


    **Stable ABI/API** The API/ABI is required to be stable enough to target for standardization.
    The maintainers need to follow the "best practices" for ABI/API stability; they
    should have a proven track record for doing so, and properly resolving any issues
    that arise.


    **Dependencies Present** The candidate''s runtime dependencies should either already
    exist in the LSB, or be planned to be added, or be abstracted away so that specifying
    their interfaces is not required. Dependencies provide an insight into things
    that may need to be added and/or potential problems that may be encountered. Recursive
    dependencies should be listed and discussed before proceeding.


    # ### 8.2.2 Phase 2: Investigation


    **Upstream Cooperative** The upstream maintainers must be committed to backwards
    compatibility (for some defined version) and stability. They should be willing
    to work with developers and distributors on providing a standard everyone can
    agree on and adopt.


    **Distribution Maintainers Cooperative** The component maintainers for the distributors
    should be willing to work together. They should be willing to work with upstream
    maintainers and developers on providing a standard everyone can agree on and adopt.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '**Component Versions** The upstream maintainers, distributions, and developers
    should be synced up on compatible versions. If not, they should be willing to
    agree on and adopt compatible versions.


    **Distribution patches** If the distributions maintain any patches against the
    component, these could be merged upstream or dropped. Since the LSB is a behavioral
    standard, this is not required but could make things easier.


    **Internationalization** If the component interacts with the user it should, if
    possible, have internationalization (i18n) support and support localization (l10n)
    as appropriate. The lack of a specific locale’s data should be remedied in a timely
    manner, although it is admittedly hard to support every locale.


    **Resources** Resources for working on the deliverables required in Phase 3 should
    be arranged. A component may be an excellent candidate for standardization but
    can’t proceed until there are people to do the work. Depending on the candidate,
    there may be parties who would benefit from the standardization and could reasonably
    be asked to contribute to the effort.


    **Rationale** The rationale for why the component needs to be added should be
    recorded and published. Mailing lists and meeting minutes are not sufficient;
    this data needs to be recorded in the specification or in a separate document.
    Lack of rationale documentation has already been a problem with older versions
    of the specification, so this is very important.


    # 8.2.3 Phase 3: Implementation


    **Import into LSB Database** Importing the component into the LSB database is
    a first step for working on the LSB Written Specification, Runtime Test Suites,
    Development Environment, and Sample Implementation.


    **Written Specification** Development or adaptation of the Written Specification
