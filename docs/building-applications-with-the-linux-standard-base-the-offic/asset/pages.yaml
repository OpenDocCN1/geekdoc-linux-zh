- pgno: 130
  md: '# PART IV


    # Contributing to the LSB Project


    The LSB Written Specification is by no means static. The specification will expand
    in scope according to acceptable requirements. Future enhancements will increase
    the sophistication of the LSB and confidence in applications resulting in improved
    market opportunities.


    Progress of the LSB in adding new architectures and ABIs to the specification
    is dependent on staff, volunteers, and sponsorships. The following chapters describe
    the acceptance criteria and process by which the specification can be expanded.
    Your requirements, comments, and contributions are welcomed.'
