- pgno: 42
  md: '# CHAPTER TWO


    # Ensuring

    Binary Compatibility


    Binary compatibility is a feature assurance given by an LSB Certified Runtime
    Environment to an application. You can take advantage of that assurance by using
    the LSB as guidance when coding your application. This is part of the promise
    and value of the Linux Standard Base. This chapter explains the concept of binary
    compatibility and its importance in developing LSB-certified applications. It
    also describes each step in the process of ensuring binary compatibility and discusses
    the different source code standards the LSB Written Specification adheres to.
    Finally, there is a discussion of binary versus source code compatibility.


    # 2.1        ILLUSTRATION OF BINARY COMPATIBILITY


    Linux inherently has binary compatibility. Without the need to rebuild or port
    source code from one Linux release or distribution to another, Linux has achieved
    binary compatibility for a given hardware platform. You only have to build once
    for each Linux architecture, such as IA32, PowerPC, or Itanium, and then deploy.
    The LSB has set some rules and guidelines that make this feature practical for
    applications. The path to shrink-wrapping an LSB application for Linux includes
    the following steps:


    +   • Coding to the portability layer

    +   • Using the correct ABIs

    +   • Testing with the LSB application checker'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   • Following the LSB packaging guidelines

    +   • Seeking LSB certification


    The following sections describe each of these steps in detail.


    # 2.1.1 Coding to the Portability Layer


    Rather than let applications access operating system resources directly, open
    systems such as UNIX and Linux have a portability layer for applications to be
    coded to. For UNIX, this coding layer is the set of POSIX application programming
    interfaces (APIs). However, since we know that “GNU’s Not UNIX,” the LSB has referenced
    POSIX for Linux in the form of the LSB Written Specification standard (Figure
    2.1).


    Applications must not use private interfaces of the operating system, or subvert
    the portability layer by accessing operating system resources directly. Some applications
    access system resources directly in order to be *platform-tuned*. Platform-tuning
    of an application may increase performance, but it greatly diminishes the possibility
    that the software will be binary compatible between systems or releases. This
    kind of software is sometimes platform-branded to work for a particular release
    of an operating system, which is fine


    ![](img/d75cffbcb54aabfb0f9854162061d394_43_0.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'if that is the intent. This style of programming, however, is outside the scope
    of the LSB.


    Applications that are coded to the LSB Written Specification have taken the first
    step to becoming binary compatible among the set of LSB-branded systems. By coding
    to the specification, the application is limited to using only the following system
    libraries: **libc**, **libdl**, **libm**, **libutil**, **libcrypt**, **libz**,
    **libpthread**, **libncurses**, **libX11**, **libXext**, **libXt**, **libICE**,
    **libSM**, and **libGL**.


    If an application cannot limit itself to the interfaces of the libraries previously
    listed, then—to minimize runtime errors—the application must either bundle the
    nonspecified library as part of the application, or it must statically link the
    library to the application. However, the libraries themselves must be LSB-compliant
    by using only the interfaces of the libraries listed in the previous paragraph.


    # 2.1.2 Using the Correct ABIs


    Restricting your development to the source API specification is not enough for
    binary compatibility because different releases and different systems have different
    versions of the libraries. To become binary compatible, you must develop to the
    ABI. Linux has the ability to version individual ABIs. So, if an imaginary function,
    *myFunction(x, y)*, currently returns a double, but a more recent version of the
    ABI returns an integer, then you must use the version that was specified to return
    the original data type. To help you do this, the LSB has created stub libraries.
    You can link to the LSB stub libraries and to the LSB runtime linker. Then the
    LSB-specified ABI alone can be used. Either the application build will get an
    unresolved symbol error because it was using something not specified by the LSB,
    or the LSB stub libraries will ensure the correct ABIs per the binary specification.


    To simplify the compilation of an application with the correct ABIs, the LSB provides
    an **lsbcpp** wrapper script. This script uses the LSB stub libraries with the
    correct ABIs, the LSB runtime linker (ld-lsb.so.2), and header files corresponding
    to the LSB Written Specification. You can download the *lsb-build-base* and *lsb-build-cc*
    packages, and then integrate them into your normal build procedure.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# 2.1.3 Testing with the LSB Application Checker\n\nThe LSB application checker,\
    \ `lsbappchk`, is a test tool that checks applications for LSB ABI compliance.\
    \ The `lsbappchk` tool compares the ABI symbols used by an application to ABI\
    \ symbols defined by the LSB Written Specification. Example 2.1 shows a “Hello\
    \ World” application that uses the `getpid()` API.\n\n```\nExample 2.1: ‘Hello\
    \ World’\n```c\n#include <stdio.h>\n#include <unistd.h>\n\nmain()\n{\n\tprintf(\"\
    hello world: %d\\n\", getpid());\n}\n```\n```\n\nOnce compiled, you can check\
    \ helloworld.c to determine if it is LSB-compliant (Example 2.2).\n\n```\nExample\
    \ 2.2: Checking for LSB Compliance\n```sh\n$ lsbcc -o hw_good helloworld.c\n\n\
    $ lsbappchk hw_good\nlsbappchk for LSB Specification 2.0\nChecking binary hw_good\n\
    ```\n```\n\nWe see from the `lsbappchk` output that it did not find any compliance\
    \ anomalies. However, if we slightly change the previous example to use the private\
    \ function `_getpid()`, we see different results (Example 2.3).\n\n```\nExample\
    \ 2.3: Using the `_getpid()` Function\n```sh\n$ lsbcc -o hw_bad helloworld.c\n\
    /tmp/cc5CIT2io.o: In function `main':\n/tmp/cc5CIT2io.o(.text_0xd): undefined\
    \ reference to `_getpid'\ncollect2: ld returned 1 exit status\n```\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: 'From the standard error (stderr) output of **l sbcc**, we can see that **l
    sbcc** would not compile the application with a noncompliant ABI. Using the LSB
    **lsb cc** tool helps you avoid creating noncompliant applications. But what if
    we used the native compiler?


    ```

    Example 2.4: Native Compiler


    $ cc -o hw_bad helloworld.c

    ```


    The native compiler (Example 2.4) allows the application to link with the private
    interface __getpid() of the system, but we know from the LSB Written Specification
    that this is wrong. In addition, we know that we should never use any interface
    that is prefixed with an underscore.


    From the **l sbappchk** stderr output in Example 2.5, we can see the application
    uses a wrong runtime loader and the noncompliant __getpid() ABI. So, even if you
    do not use **l sbcc** to catch nonconformance issues, you can still use **l sbappchk**
    later to validate the application. This methodology is not bulletproof, but it
    is a good indicator.


    ```

    Example 2.5: l sbappchk Stderr Output


    $ l sbappchk hw_bad

    l sbappchk for LSB Specification 2.0

    Checking binary hw_bad

    Incorrect program interpreter: /lib/ld-linux.so.2

    Symbol __getpid used, but not part of LSB

    ```


    # 2.1.4 Following LSB Packaging Guidelines


    Once your application is built using the LSB headers and linked with the LSB stub
    libraries and runtime loader, you can start packaging your application the LSB
    way. The LSB suggests that you package your application in the RPM format as specified
    by the LSB Written Specification. In addition, you may not use triggers, non depend
    on the execution order of preinstall or preuninstall scripts. You are also limited
    to using only the commands specified by the LSB in those scripts and in your application,
    because other commands are not'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'guaranteed to be present or to behave in expected ways. The LSB does not specify
    the tool to install these RPM-packaged applications. You can use the **rpm** tool
    on RPM-based systems, and **alien** on Debian. For more information on packaging,
    see Chapter 4.


    In addition to avoiding namespace collisions in the filesystem hierarchy, LSB-conforming
    packages are prefixed with `lsb-`. If the name of the package only contains one
    hyphen, this name must be registered with LANANA. If the package name contains
    more than one hyphen, then the area between the first pair of hyphens must be
    either an LSB provider name registered with LANANA, or your fully-qualified domain
    name in lowercase. For example, `lsb-java` may be a name registered with LANANA
    by Sun Microsystems, but there may be another Java package name, `lsb-unregistered.org-java`,
    which does not need to be registered. For more information on LANANA, see Section
    4.3.


    # 2.1.5 Seeking LSB Certification


    The last step in developing an LSB application is getting certified. Any LSB-certified
    application can run on any LSB-certified distribution. Today, there are dozens
    of certified distributions, and the LSB has built example conforming open source
    applications.


    To get LSB certification, you will complete the following steps:


    +   - Register yourself on the LSB Certification Web site.

    +   - Self-test your application using the LSB-provided tests, and then upload
    the results.

    +   - Warrant that the application passes your own FVT.

    +   - Complete the Conformance Statement Questionnaire.

    +   - Sign the LSB Trademark License Agreement.

    +   - Receive confirmation from the Certification Authority.

    +   - Pay the certification fees and sign the LSB Certification Agreement.'
  merge: -1
  img_proc: true
