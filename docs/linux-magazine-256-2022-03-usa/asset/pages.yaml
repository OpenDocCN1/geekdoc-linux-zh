    # # Goody Bag


    Debian Goodies lets you manage and troubleshoot packages from the command line.
    By Bruce Byfield


    +   - any users of Debian or their derivatives are aware of only a handful of
    tools. When troubleshooting for a package to install, most rely on the Debian
    web pages for each package. The expert may use


    +   - apt-cache. However, these tools give limited information. For demand better
    alternative is Debian Goodies [1] a collection of small packages that allow users
    to see the details of packages without going through them by file. First written
    and curated by Matt Zimmermann, Debian Goodies remains little known but can be
    equally useful for casual users. It adds troubleshooting packages, or a maintenance
    building package. Their strongest feature is that, unlike the web pages, Debian
    Goodies delivers directly to the command line, without the need to switch window.


    +   - dgrep and dlog Searches can be used for many purposes when you are troubleshooting.
    They can find what a package does, what the current version is, or what programming
    language a package is written in. If all else fail, they can provide to already
    existing room for them. Both dgrep and dlog are in effect search tools, each of
    which deserves its own article. Here there is only room for a general orientation.


    +   By invoking the basic grep command, grep (1) searches for strings and regular
    expressions installed


    ```

    gb@nand="$ dgrep "print" abiword

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/applx. matches

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/babelfish. matches

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/collab. matches

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/command. matches

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/docbook. matches

    Binary file /usr/lib/x86_64-linux-gnu-3.0/plugins/epub. matches

    ```


    Figure 1: dgrep searches packages for keys.


