  md: "# IN-DEPTH\n\n# RISC-V\n\n# Installing RISC-V Linux\n\nListing 1: RISC-V Ubuntu\
    \ for Qemu\n\nYou can't just install on Ubuntu to get started. In fact, for emulated\
    \ RISC-V machines, you need a BIOS, a bootloader, and the Linux operating system.\n\
    \n```\n#!/bin/bash\nBASIDIR~/risc-v\nUBUNTU_ubuntu-20.04.2-preinstalled-server-riscv64-unmatched.img\n\
    \nif test -f $type-riscv64-linux-gnu-gcc; then\n    echo \"install compiler...\"\
    \n    sudo apt install gcc-riscv64-linux-gnu\nfi\n\nif test -f $type-qemu-system-riscv64;\
    \ then\n    echo \"install qemu...\"\n    sudo apt install qemu-system-misc qemu-utils\n\
    fi\n\nif test ! -d ${BASIDIR} ]; then\n    echo \"mkdir ${BASIDIR}\"\n    mkdir\
    \ ${BASIDIR}\nfi\n\ncd ${BASIDIR}\n\nif test -f opensbi/build/platform/generic/firmware/fw_payload.bin;\
    \ then\n    wget https://cd.ubuntu.com/releases/20.04/$release/${UBUNTU_IMG}.xz\n\
    fi\n\nxz -dk ${UBUNTU_IMG}.xz\n    qemu-image rebase -f raw ${UBUNTU_IMG} +G6\n\
    \    export CROSS_COMPILER=riscv64-linux-gnu\n    git clone https://source.denx.de/u-boot/u-boot.git\n\
    \    cd u-boot/\n    git reset --hard v2021.10-2\n    make qemu-riscv64_defconfig\n\
    \    make -j$(nproc)\n    cd ../..\n    git clone https://github.com/opensbi/opensbi\n\
    \    cd opensbi/\n    make PLATFORM=generic FW_PATH=../u-boot/u.bin\n    cd ../..\n\
    fi\n\nqemu-riscv64 -machine -m 4G -nographic \\\n    -bios opensbi/build/platform/generic/firmware/fw_payload.bin\
    \ \\\n    -smp cores=2 -gdb tcp::1234 \\\n    -device virtio-net-device,netdev=eth0\
    \ -netdev user,id=eth0,hostffwd=tcp::2222-:2222 \\\n    -drive if=disk0,format=raw,id=disk0\
    \ \\\n    -device ideh3-ahci,id=ahci,device=hd-0,drive=disk0,bus=ahci.0 \\\n \
    \   -device virtio-rng-pcci\n```\n\nThis starts with the RISC-V compiler, which\
    \ you install typing\n\nDownload the latest version of the OpenSBI source, which\
    \ is well known in the embedded areas - the bootloader is U-Boot. You will need\
    \ to compile a RISC-V version of Ubuntu.\n\nThe RISC-V server [4] hosted by Canonical\
    \ has a small memory footprint at 46MB. You will need to convert it to a usable\
    \ size after downloading and unpacking the image Qemu tools.\n\nFinally, you launch\
    \ Qemu with a plethora of parameters, especially for the network connection. If\
    \ you need internet access, Our script provides the installation steps. [5] that\
    \ maps a variant that we modified except the options, adjusts, and conjures a\
    \ usable stable system or more capable alternative.\n\n```\napt install gcc-riscv64-linux-gnu\n\
    ```\n\nThe script creates a risc-v folder in your home directory, installs the\
    \ necessary software and reinstalls the other components, from the pre-built Ubuntu\
    \ image of the web. It gets the image and finally starts RISC-V Linux. Incidentally,\
