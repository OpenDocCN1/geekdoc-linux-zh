    # Function Block Diagrams


    One limitation of ladder logic is that managing analog logic can be messy; therefore,
    function block diagrams (FBDs) are used. If you are comfortable with graphical
    programming languages like Node-RED, you shouldn''t have any problems with FBDs.


    # Ladder Diagrams


    Ladder logic was the first IEC 61131-3 programming language, developed as a graphical
    representation for circuits of relay hardware. The term "ladder diagram" (LD)
    describes the appearance of the logic, which looks like a ladder (Figure 5), with
    the left side having a power rail and the right side a series of horizontal lines,
    or "ungs," which are hardware components connecting the coils.


    For FBD program (Figure 7?) I wanted to count the number of times the LED was
    lit and output to a Modbus holding register. In the ladder program, the external
    PB1 variable is defined as %QW100, an output that can be read by the Modbus protocol
    at address 100. (I''ll explain more about


    Most electricians feel very comfortable with ladder logic, and it is effective
    for managing digital logic. If you come from a programming background, ladder
    logic might feel a bit strange at start.


    Figure 5 is an example of AND/OR logic to light LEDs with two buttons. In this
    example, both buttons need to be pushed to light LED 1, when either button pushes
    LED 2


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_65_1.png)


    For my program, I want to light an LED with a single push of button. In the OpenPLC
    I referenced an external pushbutton (defined in Res0), and I created two local
    variables LB2, the output LED and TOF0, an off-delay timer.


    IEC covers a wide range of functions that can be used in ladder logic. In this
    example, an off-delay timer (TOF) function was inserted after the pushbutton,
    and the time (3,000ms) is used as a variable (Figure 6).


