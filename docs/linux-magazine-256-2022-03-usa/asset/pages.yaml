    For more advanced and fine-grained searches, you can create advanced queries using
    the available filters. For example, to find photos after a certain date, specify
    the filter in the search field as follows: `after:1970-01-01`. You can specify
    multiple filters. To find, photos in a country before a certain date, you can
    combine the before and country filters: `country.de:before:1970-01-01`. Search
    queries can use the OR operator. The query color:red or green as the dominant
    color. With PhotoPrism gives you a wide range of filters, and the detailed documentation
    page [2] contains a list of supported filters along with their descriptions and
    examples.


    Finally, upgrading PhotoPrism is a matter of running the following commands:


    ```

    docker-compose pull photoprism

    docker-compose stop photoprism

    docker-compose up -d photoprism

    ```


    # Wrap-Up


    Relegating thing and face recognition tasks to the TensorFlow engine is sets PhotoPrism
    perfect from every little thing. Does it produce perfect results? Definitely not.
    But the convenience of being able to plug your library into PhotoPrism and let
    the application handle the rest outcomes could be a huge advantage. PhotoPrism
    by its machine learning smarts only, the application''s polished and user friendly
    interface coupled with excellent capabilities makes it a perfect tool for managing
    large libraries and sharing your photos with the


    # Housekeeping


    Because PhotoPrism runs in a container, there are a handful of commands you might
    find useful for managing the application. You already know


    ```

    docker-compose up -d

    ```


    starts PhotoPrism. To stop the application, use


    ```

    docker-compose stop

    ```


    If you need to reset PhotoPrism and start from scratch, use


    ```

    docker-compose exec photoprism photoprism reset

    ```


