  md: '# LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere. Explore
    our full catalog of back issues for specific topics or to complete your collection.


    # #255/February 2022


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_0.png)


    ### Break It to Make It

    Fuzz Testing: Ever wonder how attackers discover those "carefully crafted input
    strings" that crash programs and render control? Welcome to the world of fuzz
    testing. We introduce you to the art of fusing and some leading fuzz testing techniques.


    On the DVD: Parrot OS 4.11 and Fedora Workstation 35


    # #254/January 2022


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_1.png)


    ### Phone Hacks

    Exceptionally phone manufacturers give up on supporting old hardware. If you''re
    not ready to abandon yourself, you might find a better alternative with LineageOS
    a free Android-based system that supports more than 300 phones, including many
    legacy models that are no longer supported by the vendor. We explore PostmarketOS,
    a community-based Linux distribution that runs on Android devices.


    On the DVD: Ubuntu 21.10 and EndeavourOS 2021.08.27


    # #253/December 2021


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_2.png)


    ### OpenBSD

    BSD Unix has around longer than Linux, and it still has a loyal following within
    the Free Software community. This month we explore the benefits of a leading BSD
    variant from the viewpoint of an alias.


    On the DVD: Tails 4.2 and QahoOS 4.6


    # #252/November 2021


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_3.png)


    ### Locked!

    The security landscape keeps changing, and experienced users know they need to
    keep their eyes open for techniques and tools that give an edge. This month we
    use smartcards, hard drive encryption, and a less-bloated alternative to Sudo.


    On the DVD: Debian 11 and Redux Linux 2101


    # #251/October 2021


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_4.png)


    ### From Scratch

    Building an operating system is not like creating a desktop app. You''ll need
    to create a development environment – and if you follow the steps carefully, you''ll
    emerge with a deeper understanding of Linux.


    On the DVD: Linux Mint 20.2 Cinnamon Edition and Garuda Linux Dr4600ed Edition


    # #250/September 2021


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_94_5.png)


    ### Inside the Kernel

    The only real way to celebrate the 30th anniversary of Linux is to write about
    Linux itself – not the agglomeration of kernel we know as a distro, but real the
    beating heart in the center of it: the kernel.


    On the DVD: AlmaLinux Minimal 8.4 and SystemRescueCd 8.03'
