    want to know which applications are available in Kaberower format as well as you
    have installed, the using line 1, line 2 (Figure 2). First, I will use Zenmap,
    a graphical front end for the Nmap scanner. Zenmap depends on Python libraries,
    which may make any kind of manual installation on Debian and its derivatives painful
