    # Packaging applications in Docker containers


    # Neatly Bundled


    Kaboxer lets deploy applications that may be difficult to package using Docker
    containers.


    By Ferdinand Thommes


    The way distributions deliver software is changing. New package formats like Flatpak
    and Snap are becoming more widespread, and containers are becoming important even
    for casual desktop users. There are many reasons for this. Developers want to
    see their software without creating packages in different formats. Some approaches
    also allow multiple software versions to be installed simultaneously. Sandboxing
    as a security feature also plays a role.


    In addition all software can be installed using traditional package formats. This
    is especially true for distributions like Kali Linux which ship hundreds of highly
    specialized applications. Some of these specialized applications are unavailable
    in the Debian repository. Others are difficult to package because they rely on
    outdated libraries that any comes with anyone. Another reason would be to isolate
    apps so that they do not interfere with other programs.


    Kaboxer (1), a Docker and DEB-based application developed for Kali Linux, transparently
    difficult-to-


    package applications in Docker containers within the Debian packaging system.


    # Kaboxer


    Kali Linux specializes in penetration tests and digital forensics. Based on Debian,
    Kali Linux uses the Debian package manager. Kaboxer (abbrevi-


    tion of Kali Applications extends the Debian package system with contain- but
    integrates them into the existing system and controls them transparently via Kaboxer.


    The Kaboxer developers emphasize the compatibility of this approach with other
    document-


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_59_1.png)


    Figure 1: If you want to use the container framework, make sure that your user
    accounts belongs to the kaboxer group.'
