  md: '# Node-RED


    # OpenPLC on a Raspberry Pi MAKESPACE


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_66_0.png)


    Modbus with Node-RED

    Modbus [5] was the earliest and most common communication protocol to connect
    industrial devices together. Modbus can be used with serial interfaces (RTU) or
    Ethernet-based networks (Modbus TCP); both are supported by OpenPLC.


    Node-RED has a number of Modbus TCP nodes that can be used. If found node-red-modbustcp
    works well for my application. New nodes can be added to Node-RED from the Manage
    [palette] menu.


    A single OpenPLC runtime can monitor the LED and counter status using three `modbus`
    nodes, a text node, and two number dashboard nodes (9).


    Modbus supports four types of registers: input, discrete, holding, and exception
    registers (Figure 10). In this Node-RED application, I am using two types of Modbus
    objects: a single-digit (hex) LED and holding registers (16 bits).


    Modbus reads a hold and returns a value (integer, if requested); however, a Modbus
    register returns 16 bits of information, not the single bit of interest.


    To show the status on a Node-RED dashboard, a small function is needed (Only pass
    item 0) to send the message to the first item in the array:


    ```

    msg.payload = msg.payload[0];

    ```


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_66_1.png)


    | Object Type | Size | Example |

    | --- | --- | --- |

    | 00001 | Input | 1 bit | Alarm |

    | 01001 | Discrete | 1 bit | Reset |

    | 30001 | Input | 16 bits | |

    | 40001 | Holding | 16 bits | |


    Figure 10: Modbus object types.


    Modbus when I connect to Node-RED logic.


    The FBD uses a rising edge (`R_7`) to catch when the LED turns on. From the output
    `R_7` is a boolean, which is converted to an INT and added to the value of CT1.


    # Structured Text


    One of the advantages of FBDs is that they are very readable and self-documenting.
    The disadvantage of FBDs is that they can be used for complex logic structures.
    Structured text (ST) was developed as a programming language that can work with
    other languages. Structured text is block-structured like Pascal.


    For my ST, I wanted to achieve the same functionality as FBD. Similarly, the functionality
    in ST only three lines of code (Figure 8), with five lines in FBD. In my ST I
    also added a simple IF condition if the value reaches 1000:


