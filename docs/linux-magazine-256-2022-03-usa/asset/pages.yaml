  md: '# Exploring the RISC-V processor architecture


    # # New Chip in Town


    The open source RISC-V processor architecture is poised to shake up the processor
    industry. Thanks the Qemu emulator, you can get to know the RISC-V without waiting
    for affordable hardware.


    By Eva-Katharina Kunst und Jürgen Cade


    ost of the IT industry has consolidated around Intel-x86 and (related) AMD64 architectures.
    But just two decades ago, several other manufacturers and architectures were fighting
    for a place in the market. Many of these processors (including MIPS, PowerPC,
    Alpha, and SPARC) followed a set of principles for processor design known as Reduced
    Instruction Set Computer (RISC). RISC systems live on today, most notably in the
    ARM architecture used in today''s smartphones, Raspberry Pi,


    and other electronic devices. (The acron-ym ARM actually stands for Advanced RISC
    Machine). But another RISC tender is also on the rise.

    RISC-V, pronounced "Risk Five," is widely hailed as a shooting star in the processor
    architecture sky [1].


    Proponents believe RISC-V can every-thing ARM can do – and it is all open and
    royalty free. The non-propri-nature of RISC-V means it could allow small chips
    to get in a game that is now dominated by a few tech giants. And even mainstream
    vendors


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_41_0.png)


    # ## Hardware Options


    The ESP32-C3 DevKit-02 board, which features a RISC-V core, is available in mail
    order shops for prices starting at around EUR10 (Figure 1). Chinese man-ufacturer
    Espressif has added a RISC-V-based ESP32-C3 to its well-known and successful ESP32
    model; it has slightly slower performance than the classic model, but it is smaller
    and less explan-


    Figure 1: Espressif is already offering its ESP32-C3-DevKit-02 RISC-V board for
    a low price.'
