    package (Listing 1, line 3) as one of their first Kaberower applications. This
    shows the installation process, which creates an entry in the library structure
    (Figure 4). You can set up a Kaberower, a NET-based command-and-control framework
    including a web front end (Figure 5) in the same way using the cavent-vksh package
    (line 4).


    Both apps work independently. You will not have to worry about any dependencies
    in containers. Kaberower automatically launches its web interface. The Kaberower
    version of Firefox as a full-fledged GUI application also performed without any
    issues testing.


    The Kaberower model has a disadvantage common to Flatpak and Snap: file size.
    Even programs that are only a few kilobytes tend to be several MBs as containers
    due to the unavoidable dependencies of the system (or dependencies that might
    even be duplicated in the worst case scenario), as well as the container''s overhead.
    Because of this, Kali Linux does not include these applications in its operating
    systems. You must install them if needed.


    To set up Zenmap with overhead, the Kali developers use the zenmap-kbax


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_61_0.png)


    Figure 4: Kaberower automatically creates an entry in the main desktop menu when
    you start the container.


    # Disadvantages


    Kaberower takes a longer to install than traditional DEB packages. A Kaberower
    package functions as a metadata that downloads the content as a Docker image and
    sets it up. You will not notice any issues until you launch these apps.


    # DIY setting up for Kaberower


    development is not tricky today. The documentation describes the required steps
    in [2]. The steps include creating and building a Docker image of the environment.
    For larger-scale deployments, it would make sense to automate the process via
    GitLab CI. For more information about what is described in the documentation,
    see the Kaberower pages and kaberower!


    # Conclusions and Outlook


    For Linux users, Kaberower offers the advantage of installing tools and applications
    that would otherwise be difficult or impossible to set up. You may notice (if
    all) the use of containers instead of regular DEB packages due to some longer
    installation time. With a little practice, you can package quite quickly. Whether
    the developers of Debian will eventually take advantage of Kaberower''s technology
    to be seen.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_61_1.png)


    Figure 5: Kaberower requires a more effort before you operate it via a web interface
    that the container launches in the browser.


    # Info


    +   [1] Kaberower: https://github.com/kalilinux/tools/kaberower

    [2] Documentation: https://www.kali.org/docs/development/packaging-apps-with-kaberower/'
