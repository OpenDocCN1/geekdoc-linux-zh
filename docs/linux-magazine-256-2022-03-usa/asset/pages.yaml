    Small Industry


    Create automation projects with ladder logic blocks, structured text, and Modbus
    TCP. By Pete Metcalfe


    Some automation projects can take advantage of a number of good software packages
    (e.g., Home Assistant and Node-RED) to manage and monitor sensors and devices.
    If you are interested in looking at an industrial controls approach to your automation
    projects, then OpenPLC [1] is a package to consider. A programmable logic controller
    (PLC) is a hardened hardware device that manages I/O and logic according to the
    IEC 61131-3 standard [2].


    The OpenPLC source software runs on a Raspberry Pi, Linux, or Windows PC, and
    it offers a great way to learn industrial control concepts, programming languages,
    and communications protocols.

    In this article, introduce IEC 61131-3 programming by small OpenPLC projects that
    use ladder logic, function blocks, and structured text programming languages.
    The programs in the projects presented here connect to the Raspberry Pi general
    purpose/input (GPIO) pins for basic read


