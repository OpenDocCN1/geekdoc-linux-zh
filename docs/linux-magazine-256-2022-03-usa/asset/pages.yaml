    # New Multipartarget Backdoor Malware\Targets Linux, macOS, and Windows


    The first sets of Sysjoker appeared in December 2021, when researchers at Intezer
    were investigating an attack on a Linux web server. This malware was written in
    C++ and each variant is specifically tailored for the operating system it attacks.
    VirusTotal was unable to detect the malware, even using 57 different detection
    engines.


    Once the malware has breached, it fetches the Sysjoker zip file from GitHub, unpacks,
    and executes the payload. The payload gathers information about the machine, stores
    and encodes the results in a JSON object, reaches out to a C server (hard-coded
    Google Drive link), or itself (the-malware) and forwards commands on the infected
    device.


    Intezer has provided a list of indicators for Sysjoker for each operation. On
    Linux, the files and services are created under /library/ and is created with
    the cron job Reboot (/library/Services/updatesysjob). If you discover such a cron
    job, it is imperative that you kill all related processes, manually delete the
    files and cron job, scan the system to ensure all files have been removed, and
    check for any weakness that might have allowed the attackers access to your server.


    Find out more about Sysjoker in the Initial Intezer report (https://www.intezer.com/blog/malware-analysis/new-backdoor-sysjoker/).


    # WhiteSource Releases Free

    Log4j Detection Tool


    As the Log4j vulnerability continues to wreak on the IT landscape, everyone is
    trying to prevent disaster from striking. A number of companies and development
    teams have released tools to help with the detection and remediation of the vulnerability.
    One company is WhiteSource. Their new, Log4j Detection (https://github.com/whitesource/log4j-detection-distribution),
    is an open source command-line utility that scans your projects to detect the
    known CVEs:


    +   - CVE-2021-45048

    - CVE-2021-44228

    - CVE-2021-4104

    - CVE-2021-45106


    Once the scan is complete, it will report the back path of the vulnerable files
    as well as the fixed version you''ll need to remediate the issue. Log4j Detection
    should run within the root of your projects and also search for files with .jar
    and .war extensions. Log4j Detection supports the Gradle, Maven, and Bundle managers.


    In order for Log Detection to run properly, you''ll need to install gradle if
    your project is a Gradle project or mvn (if the project is a Maven project). The
    developers have also indicated both Maven and Bundle projects must be built before
    scanning. Once you have Log4j Detection, the scan can be started with the command
    log4j-detect -d PROJECT (where PROJECT is the hosting directory).


    For more information about this, make sure to read the project README (https://github.com/whitesource/log4j-detection-distribution/blob/main/README).


