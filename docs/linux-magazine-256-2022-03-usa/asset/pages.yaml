  md: "# COVER STORY\n\nHowdy\n\n# Facial authentication with Howdy\n\n# Howdy, Friend\n\
    \nHowdy brings the convenience of facial authentication to Linux. \n\nBy Karsten\
    \ Günther\n\nFuturists and entrepreneurs have long been obsessed with the idea\
    \ of biometric authentication. Every body is unique – could you recognize the\
    \ features of your anatomy that you are? Police departments have used fingerprints\
    \ to identify suspects for years, and several computer systems now allow fingerprint\
    \ authentication. But for many researchers, the holy grail for biometric authentication\
    \ is still facial recognition.\nThe human brain recognizes all the time: that\
    \ is when you “recognize” someone. Course, when a camera takes a picture of you,\
    \ it is more like a picture of a face. Your face is looking at you all day long,\
    \ so it could be more convenient than typing your device every time you want to\
    \ access it!\nWindows Hello technology, which is built into Microsoft systems,\
    \ gives Windows an option for facial identification. Linux can now allow facial\
    \ authentication through an open source application known as Howdy [1]. Severin\
    \ from the Netherlands has developed Howdy for more than four years, and the software\
    \ is currently available on GitHub.\nAs can guess, facial authentication requires\
    \ two important components:\n- Imaging – to capture an image of the person who\
    \ is trying to authenticate\n- Artificial intelligence – to compare that image\
    \ with a reference of the user\nOnce the identity is confirmed, then the password\
    \ is the way to pass on the operating system.\nHowdy uses the OpenCV vision library\
    \ [2] for imaging and facial recognition. The Pluggable Authentication Module\
    \ (PAM) system is built into Linux and is easy to configure. Howdy uses the OpenCV\
    \ vision library for image processing and facial recognition; it then passes control\
    \ to PAM.\nSeverin points that Howdy is not intended as a complete security system\
    \ itself. As the website states, it is in no way secure as a password and will\
    \ never be...\n\nHowdy is a more quick and convenient way of logging in, not a\
    \ more secure one.\\nOne common use for facial authentication tools is to re-authenticate\
    \ a user after the user steps away from the computer. But be aware that this technology\
    \ is still experimental – if you are on counter-intelligence security, better\
    \ to stick with more conventional approaches.\n\n# The Camera\n\nIt takes a camera\
    \ to see a face. Today, IR (near infrared) cameras which are not normally installed\
    \ in laptops as standard equipment, are popular for reliable facial recognition.\
    \ Howdy theoretically works on laptops that have a standard webcam, but it won’t\
    \ be secure or reliable. The GitHub project howdy-enable-iremitter [3], which\
    \ is designed for use with Howdy, offers support for infrared cameras that are\
    \ not enabled out-of-the box.\n\n# Howdy\n\nhas yet reached the package managers\
    \ for Linux distributions; but the developer provides instructions for setting\
    \ up the software on Linux systems. In particular, Howdy offers strong support\
    \ for Ubuntu. For Arch, the required packages are in the AUR, with instructions\
    \ in the Wiki [4].\n\n# PAM Authentication\n\nThe PAM system is built into Linux\
    \ to offer ways to high-level authentication processes through APIs. PAM consists\
    \ of modules that control authentication. On one hand, this means that you can\
    \ apply several procedures in succession: for example, first facial recognition\
    \ and then, if it fails (or is denied), password input. On the other hand, you\
    \ can also use PAM to provide different procedures for programs: For instance,\
    \ use facial recognition to unlock the desktop, but require a password to install\
    \ new programs.\n\nMAR 2022 ISSUE 256 LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM"
