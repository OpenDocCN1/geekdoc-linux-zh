    ![](img/16d3ffe65f48be3e33dacc00421acc6f_29_0.png)


    # Deleting metadata from files


    # Housekeeping


    Digital camera images often reveal personal information embedded in metadata.
    Linux tools help you remove generated metadata to preserve your privacy. By Erik
    Bärwaldt


    The progressive digitalization of all areas of life makes it difficult to cope
    with the growing flood of data. Many users like to share photos and videos, web
    cams, and even PDF documents on the Internet. However, all of these file formats
    contain metadata that can be read with various programs and often reveal private
    information about the file owner. You should check for unwanted metadata and remove
    it to protect your privacy. This article looks at some Linux tools that help you
    delete metadata from files at the push of a button.


    In addition, metadata can be used to keyword the files in order to categorize
    them and make them easier to find in all applications.


    # Reading and Editing


    Reading metadata does not require any special application software: the file managers
    of all common desktop interfaces can handle the existing standards. The file managers
    show some of the metadata when you view a file, for example in many cases you
    can display the most important metadata in a context menu of the manager''s Properties
    dialog (Figure 1). However, you may need special applications that focus on one
    of the existing specifications.


    # Standards


    For video and image files, Exif, IPTC, and XMP are the standards for generating
    metadata. The respective data can be stored in fixed data fields in the files''
    headers.


    The International Telecommunications Union - Information Metadata Model (IPTC-IIM)
    specification was defined as early as 1991 and can be used for all digital media.


    # Exiftool


    The cross-platform Exiftool is the de facto-standard for editing metadata. The
    command-line tool has a powerful command set and can handle a wide variety of
    video and image files.


    More to technical details, the much younger Exchangeable Image File Format (Exif)
    is used by all common smartphones and digital cameras to store metadata. Exif''s
    last specification date is from 2010 and was last revised in 2019.


    The Extensible Metadata Platform (XMP) is a compatible format, similar to Exif
    but based on XML for image files. XMP, which was developed by about 20 years ago,
    can also store free text and is formerly popular with applications like Lightroom
    or Darktable.


    Exiftool is found in the repositories of most common Linux distributions; it can
    be set up via the package manager. After installing Exiftool, the system can handle
    any case where you use a existing Exif file


    # The Purpose of Metadata


    Metadata is generally based on basic definitions and is intended to record certain
    characteristics of the files concerned. In the case of image and video files,
    this includes the camera model and the photo technical settings. Often it is used
    to show the time and date and - if supported at the hardware side - the GPS coordinates
    where the photo was taken. For all files, the author can also be listed in the
    metadata to make it easier to create proper


    30 MARCH 2022 ISSUE 256 LINUX-MAGAZ.COM | LINUXPROMAGAZINE.COM'
