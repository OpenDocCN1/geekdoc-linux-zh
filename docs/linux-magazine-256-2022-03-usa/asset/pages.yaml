    # Linux Mint 20.3 Now Available


    Users of the popular Linux Mint can celebrate the new release by downloading a
    new release, version 20.3 (https://www.linuxmint.com/download_all.php). This latest
    iteration is based on Ubuntu 20.04.5 LTS. Although it doesn''t have any game-changing
    new features, it does offer a lot of subtle UI tweaks and a very helpful document
    manager app.


    As for the polish, default Mint doesn''t lean so much on the color theme and includes
    larger titles, bigger controls, and rounded corners. A number of the default apps
    also default to a sleek theme.


    Some of the improvements include the calendar tool showing events from multiple
    sources, some tweaks to the Nemo file manager (including the ability to rename
    a moved or copied file instead of overwriting a duplicate), new styling for the
    run dock, major updates to the Notes app which includes a new search function),
    a channel search option for Hypnot (Mint''s interpreter), and the ability to switch
    tabs with Ctrl+Tab keyboard shortcut with the Xed editor.


    There''s also the new Thingy, which is a document manager that provides quick
    access to frequently opened documents. This thing keeps track of reading progress,
    when you re-open a document it''ll start where you left off.


    To find out everything that''s in the new version, make sure to check out the
    Linux Mint 20.3 release notes (https://www.linuxmint.com/release_announcement.php).


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_7_0.png)


    # Linux Gets an

    Exciting New Firmware Feature


    When you upgrade your motherboard firmware (such the BIOS or UEFI), you have to
    reboot your system. Thanks to a new patch from Intel, both BIOS and UEFI updates
    now work without reboot.


    How is this possible? Currently, an upgrade is done by updating the firmware within
    the operating system. The desktop or server is then rebooted, at which point the
    firmware is transferred to the motherboard and flashed to the BIOS or UEFI. However,
    there''s a new API specification, which allows Platform Firmware Runtime and Telemetry
    (PFRUT), which makes it possible to flash the firmware without the reboot. Intel
    has been working on PFRUT (previously dubbed Seamless Update) for a while now,
    in order to reduce downtime for servers. The idea is to enable such machines to
    reach that 100 percent uptime.'
