    RISC-V is defined as 32– 64– and 128-bit architecture. In all worlds, hardware
    have a width of 32, 64, or 128 bits, depending on 32 or 64 of registers, which
    are numbered to X31 or X63. Apart from the X0 register, which can be used and
    where all bits are set to to, the registers can be used for various purposes,
    however, there is no special instance.

    However, the architecture provides for a separate component (PC) (i.e., an instruction
    that contains the address needs to process next).

    Whereas the x86 architecture is a widely used machine, RISC-V has three registers
    involved in one operation. If two registers add the content of two registers,
    it results in one of the two. A three-register machine, on one hand, can cause
    the result in a third register (X1 = X2 + X3).


