  md: '# IN-DEPTH


    Using Go to extract data from a server response with JSON is always difficult
    if there is no Go type on the client side that can replicate the structure down
    to the last detail. The alternative is a hack that relies on assertion to force
    the data hash maps into interface{}.


    # Smart Cache


    Of course, it would be pretty stupid to bother the server with requests that would
    return identical tracks - on one hand, because it would round trip around the
    Internet each time, and on the other, the cost of the free account would be costly.


    Armed with this package, Listing 5 can now draw a pie chart indicating what states
    the collection of GPS files covers in total and where many hiking steps are recorded.
    By using an assertion state hash map, it introduces the state key by one. More
    track points are in the respective region, the higher the count, and the bigger
    the pie slice in the graph later.


    This is highly defining 4 cache; a simple lru cache implementation from github
    potentially caches retrieved API results for later use. The route, starting in
    line 37, rounds latitude and longitude to one decimal place for including requests
    and first to see if it is already a result in cache. If not, it fetches the geodata
    with a web-side API and stores what it needs in the cache. While the program is
    running, the cache fills up visibly with the incoming requests, as a quick look
    at the cache directory in Figure 6.


    Listing 7 generates named states, and Figure 7 shows the results: My GPS files
    are mostly from California also features the states of Bavaria, Baden-Württemberg,
    and Lower Saxony.


    # I Want More


    Of course, these are only examples that show what is possible. With a little effort,
    more hidden nuggets could be extracted from the data. For example, if you want
    to identify the regions with the most popular trails, you can use an AI k-means
    method. In addition, artificial intelligence could help visualize popular hiking
    routes that you have not visited for some time. And there''s so much more; the
    data is recorded, and the world is yours.


