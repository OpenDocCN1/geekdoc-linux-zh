    # deget


    Primarily for developers than users, deget (Figure 3) lets download a package
    for study and develop in present working directory. A particular version of a
    package can be downloaded by ~VERSION to the end of the package name.


    tion KDE''s Plasma, the -g option in Gnome, or the -x option in Xnome, or Plasma
    may also be set with ~LANG. Similar, although English is the default language
    that can be used by a standard two-letter abbreviation such as fr for French or
    de for German. For any of these, you can use ~LENGTH to set a length limit (kilobytes,
    megabytes, or terabytes). Although, practically speaking, text messages are short
    enough that the last three have no parcel limit.


    # dpigs


    Similar to the top command, dpigs (Figure 4) lists the packages that take up most
    space (instead of running applications). dpigs lists the most heavy items first.
    You can limit the number of items displayed using --limit=NUMBER.


    # check-enhancements


    The check-enhancements script (Figure 7) lists any packages that add a functionality
    but are not required to run. This can be verified by the fact that, if --verbose
    option is used, results will be shown with "Enhanced". Other options --installed-packages
    (--install-packages, -ip), which displays the enhancements of packages, and --installed-enhancements
    (--installed-enhancements, -ie, -ie), displays enhancements. If no package or
    enhancement is found, then the result for enhancement is a process that can take
    some time and may be pointless, because of packages on a typical system do have
    no enhancements. If an enhancement is available but untold, a possible installation
    candidate is given.


    Figure 2: Like dgrep, dpigs searches packages.


    Packages. Similarly, dgrep invokes dgrep, and dpigs invokes dgrep by specifying
    the packages to search within. The available options are the same as dgrep, except
    for those like --directory=read, --recursive=read, --directories=read dgrep directories.
    In addition, some lines are not found.


    A possibly different approach searches than dgrep, dpigs (Figure 2) searches installed
    packages by default. However, if you want the search to include all packages and
    units, then -a is added. By contrast, -n omits installed packages from the search.
    -f lists all the lists in matched packages. The use of both -a and -n can be used
    to filter grep''s options.


    # debmary


    Using deget (Figure 5) quickly list and display the man pages associated with
    a package. The package is followed by the version, or if you do not specify a
    version, by a repetition of the package name. The local environment where the
    package is installed, the specified package extracted to a temporary directory
    with the -n option, the package name will be downloaded from the repositories;
    the -f option downloads the local, deb file.


    Searches with dpigs can also be modified with regex:


    +   - --regexp (E): Treats the search string as a regular expression

    - --ignore-case (-i): Uppercases and lowers the search

    - --exact-match (-x): Only gives results that do not match the search


    If these options are not used, the man pages of the commands show that dgrep and
    dpigs invoke.


    Using deget (Figure 6) can create a list of man pages associated with a package
