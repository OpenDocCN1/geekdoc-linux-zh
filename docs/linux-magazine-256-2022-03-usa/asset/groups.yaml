    # # Lapce


    We always joke that the reason there are so many programming editors is because
    choosing the best editor is an ideal project for programmers, especially when
    they are switching to a new language. Because Rust seems to be a popular new language,
    there are now dozens of editors written in Rust. Lapce seems to be one of those
    that are often mentioned specifically by programmers when Arch users failing to
    find their favorite Linux distribution. All of this is true of Lapce, a new programmer''s
    editor that proudly extends its credentials on believe. It does in such a way
    that


    makes it worth the installation effort. In particular, it''s fast, simple, and
    uses command modes like Vim. Lapce is still in early development stage, but others
    are using it as their daily driver for a while. The main window is sparse, but
    it''s also fast and functional. There are many panes: an editing pane, an embedded
    terminal, and others for changed files. It feels much better when you''ve used
    it before, but of course there is nothing stopping you from changing things around.


    The editor is modal, which means each edit is a command and a command palette.
    Like Vim, the command palette is opened with the : key, but you can call many
    commands, including those for opening files, creating tabs, changing the theme
    (some are light and dark),


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_85_0.png)


    Lapce takes its own proxy that manages files to sync and saves - which is quite
    unique.


    viewing the configuration. There''s also a WASI plugin system that is to be fully
    developed- but you could create your own addons now. It''s easy, but Lapce also
    does make it a good position for fast desktop editing, and it''s likely to get
    better in the future.


