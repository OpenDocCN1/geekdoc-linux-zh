    ## 结构化文本 (Structured Text)


    FBD 的优点之一是非常非常易读且具有自文档性。FBD 的缺点是它们可以用于复杂的逻辑结构。结构化文本 (ST) 被开发为一种可以与其他语言工作的编程语言。结构化文本像
