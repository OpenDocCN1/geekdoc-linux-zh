    \ 联系他，他会乐意回答。\n\n图 1：从 gpx 文件集中提取数据的工具。\n\n## 列表 1: gpxread.go\n\n```go\npackage\
    \ main\n\nimport (\n\t\"github.com/tkrajina/gpx\"\n\t\"os\"\n\t\"path/filepath\"\
    \n)\n\nfunc gpxFiles() []string {\n\ttourdir := \"tours\"\n\tfiles := []string\n\
    \n\tentries, err := os.ReadDir(tourdir)\n\tif err != nil {\n\t\tpanic(err)\n\t\
    }\n\n\tfor _, entry := range entries {\n\t\tgpxPath := filepath.Join(tourdir,\
    \ entry.Name())\n\t\tfiles = append(files, gpxPath)\n\t}\n\treturn files\n}\n\n\
    func gpxData(path string) ([]gpx.Point, error) {\n\tgpxData, err := gpx.ParseFile(path)\n\
    \tpoints := gpxData.GPPoints()\n\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\n\t\
