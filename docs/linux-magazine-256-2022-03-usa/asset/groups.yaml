    # MakerSpace Programmable light stick Painting with Light


    In the method of light painting, you expose a subject over an extended period
    of time while moving light sources. With a little technical support from Raspberry
    Pi Pico, you can achieve sophisticated results. Without light, nothing can be
    seen in photography, but with just a little light and for long exposures, you
    need a camera with manual adjustment. A flashlight or laser pointer is sufficient
    to paint simple patterns or lettering into. If you want to experiment, you might
    want to work with LEDs to achieve interesting graphics. In this article, I use
    Raspberry Pi Pico to build a programmable LED stick. The control does not require
    much interfaces, and the hardware needs to be compact as possible – a good fit
    for the Pico which is the youngest and has already seen huge interest in the last
    months, with some interesting HATs to match your interest in a creative approach
    and trying out what could be achieved with modern elements and clever programming.


    **Table 1:** Materials


    | Quantity | Item |

    |---|---|

    | 1 | Raspberry Pi Pico |

    | 2 | LED tape WS2812b |

    | 1 each | Resistors: 460 ohm, 1k |

    | 1 each | Capacitor, 22nF; electrolytic capacitor, 100uF |

    | 1 each | Switch, button |

    | 2 | 20-pin female connector strip |

    | 1 | Universal printed circuit board |

    | 4 | 5V MH batteries (or 5V battery pack) |

    | 2 | Aluminum U-section |

    | | Wiring and mounting material |


    # Light Painting


    The smallest Raspberry Pi model, the Pico comes with RP2040 microcontroller and
    an ARM Cortex-M0 processor, offering a state-of-the-art alternative to contemporary
    C/C++, and performs well with MicroPython. Because I wanted to set the lines close
    together, I decided on a strip with 60 LEDs/m, which results in a total of 120
    LEDs. The LEDs require an appropriate power supply, which can be taken from the
    Pico but must be wired directly from the strip. With a circuit in this project,
    we use the MicroPython firmware on the Pi Pico (Table 1). The light stick does
    not need a WiFi connection. For a project intended for outdoor use, it is convenient
    to switch off the supply voltage without risking damage to SD card. I will not
    go into the details of how to get started with the Pi Pico, what you need to consider
    when communicating with the device, and how to program with MicroPython, because
    enough good article on these subjects already exist on the web. Even a small breadboard
    offers sufficient components for essential tests (Figure 1). The Pico can control
    a multitude of RGB LEDs, the easiest way to implement this is with NeoPixels (e.g.,
    WS2812b), LEDs that have their own control chip and can be addressed individually
    on wire. Now available in many designs, they will be referred to in the following
    text as LEDs for the sake of simplicity. A light stick of 2m is fine, so can be
    easily transported and, above all, moved. This movement and the timed switching
    of pixels could create a satisfactory curtain of light in the finished photo (Figure
    2).


    A small resistor in the line to the light strip (GPIO18) is a good idea. For 1.2V
    NIH batteries (micro, AAA) power; they can be moved and changed as needed (Figure
    4). Alternatively, you could use a power bank (as small as possible) that delivers
    5V.


    If the circuit works in the test setup, you can move on to the build. All the
    hardware is attached directly to the stick, which is created from a standard aluminum
