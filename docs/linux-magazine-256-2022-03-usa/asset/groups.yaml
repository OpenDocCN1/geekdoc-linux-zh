    # LINUX 教程 – PHOTOPRISM


    要访问过滤器，请点击展开搜索三角形的右侧，或选择所需的或已筛选的过滤器：


    为了更高级、更细粒度的搜索，你可以使用可用过滤器创建高级查询。例如，要查找某个日期之后的照片，请在搜索字段中如下指定过滤器：`after:1970-01-01`。你可以指定多个过滤器。要查找某个日期之前某个国家的照片，你可以结合之前的过滤器和国家过滤器：`country.de:before:1970-01-01`。搜索查询可以使用
    OR 操作符。查询 `color:red` 或绿色作为主色调。PhotoPrism 为你提供了广泛的过滤器，详细文档页面 [2] 包含了支持的过滤器列表及其描述和示例。


    最后，升级 PhotoPrism 只需要运行以下命令：


    ```

    docker-compose pull photoprism

    docker-compose stop photoprism

    docker-compose up -d photoprism

