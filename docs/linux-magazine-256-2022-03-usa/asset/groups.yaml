    \ POPOV\n\n整理一个包含 RAW 文件、照片和视频的照片库是一项耗时且令人心力交瘁的任务。仅仅是照片和视频进行手动标记、分组和组织的想法，就让最有耐心的摄影师感到从从。幸运的是，我们生活在人工智能（AI）时代，它可以从我们肩上减轻无聊任务的负担。对于任何不想花费无数夜晚在保持库整洁的注定失败的战斗中来说，PhotoPrism\
    \ 简直是上天的恩赐。该应用程序提供了精美且强大的用户界面，配合强大的 TensorFlow 机器学习引擎，为你提供了一个可以按你喜欢管理照片和视频的平台。这个描述并不是夸张。TensorFlow\
    \ 的内部运作被轻松地隐藏起来——它简单到几乎让你难以发现 PhotoPrism 的动力是一项复杂的软件工程，而不是仙子的粉。TensorFlow 并不完美，会产生一些不完美的结果。但它实际上驱动\
    \ PhotoPrism 的唯一核心。\n\n## 部署 PhotoPrism\n\n由于 PhotoPrism 涉及复杂且令人生畏的部署，如果没有容器，这项工作将无法实现。PhotoPrism\
    \ 以 Docker 容器的形式分发，将启动并运行应用程序的任务简化为一项易举。\n\n首要任务是在计划用于运行 PhotoPrism 的机器上安装 Docker\
    \ 和 Docker Compose。如果该机器运行的是基于 Ubuntu 的 Linux 发行版，只需执行命令即可安装这两个包：\n\n```\nsudo\
    \ apt install docker-compose\n```\n\n安装好所需软件后，使用\n\n```bash\nwget https://get.photoprism.org/docker-compose.yml\n\
    ```\n\n来获取配置文件。\n\n当你正确启动 PhotoPrism 时，最好先调整应用程序的默认设置。打开 `docker-compose.yml`\
    \ 文件进行编辑，大多数设置保持默认值是最好的，但有少数需要微调。默认情况下，PhotoPrism 配置为在私有（受密码保护）模式下运行。如果你想保留该设置，可以通过设置\
    \ `PHOTOPRISM_ADMIN_PASSWORD` 变量将密码设置为更强的密码。如果你计划在未接入互联网的机器上运行程序，并确认你的 PhotoPrism\
    \ 实例不需要任何保护，可以通过将 `PHOTOPRISM_PUBLIC` 设置为 `true` 来启用公共模式。\n\n## Tensorflow 与 PhotoPrism\n\
    \nPhotoPrism 依赖 TensorFlow 执行三个重要任务。第一个任务是分类。TensorFlow 分析图像并为其返回标签。例如，建筑照片会获得“建筑”（Building）标签，野生动物照片根据主体内容获得各种标签（鸟类、蝴蝶等）。第二个任务是人脸识别，它允许\
    \ PhotoPrism 找到相似的图像并将它们聚类。第三个任务是检测通常被称为“工作安全”的图像，在大多数情况下这意味着包含裸内容的照片。\n\n你可能可能想通过编辑\
    \ `PHOTOPRISM_SITE_TITLE`、`PHOTOPRISM_SITE_CAPTION`、`PHOTOPRISM_SITE_DESCRIPTION`\
    \ 和 `PHOTOPRISM_OTHER_OPTIONS` 来替换 PhotoPrism 的通用名称和描述。这并不一定就是你想要的。例如，如果库中的每个\
    \ RAW 文件都有对应的 JPEG，那么对其索引就意义不大。要排除文件不被索引，请在照片库的根目录下创建一个 `.ignore` 文件，并在文件中指定所需的模式。你可以使用通配符排除\
    \ `*.NEF` 文件的索引。在 `.ignore` 中指定的模式适用于目录及所有子目录。当你将该文件放在根目录时，指定的模式将应用于整个库，其他所有文件均不受影响。\n\
    \n默认情况下，PhotoPrism 使用 `/Pictures` 作为你的照片库。如果你将图像和视频存储在不同的位置，则需要将 PhotoPrism 指向那里。要这样做，请遵循\
    \ `docker-compose.yml` 文件中的行：\n\n```yaml\nvolumes:\n  - /Pictures:photoprism/original\n\
    ```\n\n将 `/Pictures` 替换为库的绝对路径。但如果你没有将所有文件放在一个目录中呢？视频放在单独的目录或不同的存储设备上并不稀奇，你可能需要将缓存放在专用库中。PhotoPrism\
    \ 让将其他目录作为 `original` 的子目录成为可能。这样做，请在 `volumes` 部分按如下指定条目：\n\n```yaml\nvolumes:\n\
    \  - /path/to/library:photoprism/original\n  - /path/to/videos:photoprism/original/videos\n\
    \  - /path/to/images:photoprism/original/images\n```\n\n`docker-compose.yml` 中的每个选项都告诉你你是想修改它还是保持原样。一旦你完成配置文件的编辑，进行更改即可准备启动\
    \ PhotoPrism 了 —— 还有一件事你可能想做。默认情况下，PhotoPrism 支持广泛的格式，应用程序会索引包含 `docker-compose.yml`\
    \ 文件的目录中的所有兼容格式。\n\n```bash\ndocker-compose up -d\n```\n\n假设你已经在配置文件中更改了默认端口，将浏览器指向\
    \ `127.0.0.1:2242`（将 `127.0.0.1` 替换为运行 PhotoPrism 的机器的实际 IP 地址），并使用你指定的管理员和密码登录。现在\
    \ PhotoPrism 已经就绪。\n\n"
