    help network administrators learn about flows experiencing latency or many packet
    drops. Host-INT does not count latency within the route for behavior. Swift, however,
    has the ability to find the root cause. If you deploy INT-capable switches on
    your network, you can configure these switches to generate INT reports on such
    as packet drops or latency. By configuring your switches, you can quickly determine
