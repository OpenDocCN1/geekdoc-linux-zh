    ## Facial Recognition


    Biometrics got a boost recently with the arrival of Microsoft''s technology. Now
    the open source world is catching up, with an innovative tool called Howdy. Facial
    authentication might not be ready for the CIA yet, but we''ll help you get started
    with Howdy and explore the possibilities of authenticating with a glance.


    ## LINUX VOICE


    - 75 Welcome: This month in Linux Voice.

    - 76 Doghouse - Out of Poverty: Hiring the best candidates for tech jobs and increasing
    diversity and opportunities in the industry go in hand.

    - 77 Fly-Pie: No matter whether you use Gnome or KDE, Windows menus pop up from
    a bar. Fly-Pie organizes a freely configurable menu in the form of a pie chart.

    - 80 CopyQ: CopyQ extends the clipboard with practical everyday functions while
    also catering to needs.

    - 84 FOSSicks: This month Graham looks at Obsidian, lazygit, Tabby, ReverseSH,
    VCR Rack 2, Gamebuntu, and more!


    ## IN-DEPTH


    - 54 Programming Snapshot – GPS Analysis with Go: For running statistics on his
    hiking trails, Mike Schilli goes to extract the GPS data while relying on plotters
    and APIs for a bit of geoanalysis.

    - 60 Kaboxer: Use Docker containers to deploy applications that might be difficult
    to package.

    - 90 Tutorial – PhotoPrism: The combination of a powerful, user-friendly interface
    and an artificial intelligence engine makes searching, and sharing photos a breeze.


    ## MakerSpace


    - 64 OpenPLC on a Raspberry Pi: Create automation projects with ladder logic,
    function blocks, structured text, and Modbus.

    - 70 Light Painting: In the photographic method of light painting, you expose
    a subject over an extended period of time moving the light sources. With a little
    support from a Raspberry Pi Pico, you can achieve sophisticated results.

