    ## MakerSpace

    Industrial control programming and protocols on a Raspberry Pi

    Small Industry


    Create automation projects with ladder logic blocks, structured text, and Modbus
    TCP. By Pete Metcalfe.


    Some automation projects can take advantage of a number of good software packages
    (e.g., Home Assistant and Node-RED) to manage and monitor sensors and devices.
    If you are interested in looking at an industrial controls approach to your automation
    projects, then OpenPLC [1] is a package to consider. A programmable logic controller
    (PLC) is a hardened hardware device that manages I/O and logic according to the
    IEC 61131-3 standard [2].


    The OpenPLC source software runs on a Raspberry Pi, Linux, or Windows PC, and
    it offers a great way to learn industrial control concepts, programming languages,
    and communications protocols. In this article, I introduce IEC 61131-3 programming
    by small OpenPLC projects that use ladder logic, function blocks, and structured
    text programming languages. The programs in the projects presented here connect
    to the Raspberry Pi general purpose/input (GPIO) pins for basic read and an LED
    on pin 23 (Figure 3).


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_63_0.png)


    **Figure 1:** OpenPLC on a Raspberry Pi.


    ## OpenPLC on a Raspberry Pi


    OpenPLC defines the Raspberry Pi I/O using IEC 61131-3 addressing (Figure 4).
    For this project, the push-button at (BCM) pin 17 (physical pin 11) is an input
    bit on 0 or 1 bit. The LED BCM 23 (physical pin 16) is defined by ~XIO3, an output
    bit on 0 or 1 bit.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_64_0.png)


    Note that OpenPLC has allocated the left side (odd numbers) of the Raspberry inputs
    and all the right side (even) pins as outputs.


    The first step in this project is to create IEC 61131-3 programs and connect to
    the Raspberry Pi and LED. The outputs are created, they are compiled and loaded
    on the OpenPLC runtime; the web interface has a monitor to view the logic variables.


    > I wanted OpenPLC to do basic Raspberry Pi reads and writes, or I wanted a setup
    with a pushbutton on pin 17 and an LED on pin 23 (Figure 3).


    ## Getting Started


    The OpenPLC software comes in packages: a logic editor, the runtime component,
    and a graphic builder. You can find specific instructions for your installation
    (4). For my installation, I put the OpenPLC on my Ubuntu PC for standalone configuration
    and testing, but you could also load both the editor and OpenPLC runtime on a
    Raspberry Pi. The OpenPLC runtime has a web interface, so logic can be uploaded
    through a browser. I didn''t install the OpenPLC graph builder; instead, used
    Node-RED dashboards as my user interface.


    OpenPLC has a good number of communication packages and I/O components (Figure
    1). For this project, I created an OpenPLC project with three layers: a ladder
    program, a function block, and a structured text.


    The resource object (Resource) defines global variables that can be used by programs
    (e.g., pushbutton PB1) and the task cycles (Figure 2). One of the benefits of
    a PLC is that it allows for easy management of task scheduling. Because I put
    all the programs to the same task (task0), for a larger project, I might put all
    digital logic into a fast execution (20ms) and my analog logic into a slower task
    execution (250ms).


