    Haiku 是专有系统 BeOS 的产物，提供了一个统一的开源操作系统作为 Linux 的替代方案。作者：Bruce Byfield


    在千禧年之交，专有系统 BeOS 包含了许多使其与其他操作系统脱颖出的特性。尽管付出了巨大的努力，它从未获得商业立足点。然而，它确实吸引了一些狂热者的图标和小部件。在
    Plasma 和标准软件的帮助下，涌现了六次继续或克隆 BeOS 的尝试，其中只有 Haiku 留存至今（图 1）。像 LibreOffice 这样的软件通常可以用于现代计算目的。它的速度非常具有吸引力，甚至某些功能（如在单个窗口中开发多个应用程序的能力，或使用下拉列表显示窗口）也使得
    Haiku 不仅仅是一次怀旧的练习。为了了解更多关于 Haiku 的意义，我联系了声称开发 Haiku 的人员之一，他是一位开发者兼项目经理，更习惯使用 waddlesplash（或
    waddlesplash 先生）。正如我们预期的那样，他的某些观点可能会让许多 Linux 用户感到惊讶。


    尽管 Haiku 在 2022 年正式处于第三个 Beta 版，但它是一个稳定的操作系统，对于当时那个非常先进的媒体来说，它的外观显得有些过时。


