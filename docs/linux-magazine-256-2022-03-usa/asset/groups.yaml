    # 结语


    将物体和人脸识别任务交给 TensorFlow 引擎让 PhotoPrism 在每一个细节上都非常完美。它能产生完美的结果吗？显然没有。但能够将你的库接入
    PhotoPrism 并让应用程序处理其余结果的便利性可能是一个巨大的优势。PhotoPrism 凭借其机器学习智能、应用程序精美且用户友界面以及卓越的能力，使其成为管理大型库和与分享照片的完美工具。


    # 维护


    由于 PhotoPrism 运行在容器中，你可能会发现一些对管理应用程序非常有用的命令。你已经知道


    ```

    docker-compose up -d

    ```

