    The sys admin''s daily grind: DenyHosts


    # Smart Doorkeeper


    When it comes to warding off unwanted login tests on SSH port 22 and others, Charly
    also likes to log in or to himself by relying on DenyHosts instead of Fail2ban.
    By Charly Kühnast


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_39_0.png)


    any systems use Fail2ban to keep unwanted tests on SSH port 22 and others at.
    however, there are alternatives to Fail2ban. Today I would like to introduce you
    to DenyHosts which does basically the same thing as Fail2ban but has one or two
    aces up its sleeve.

    You can find DenyHosts part of the standard package on all popular distributions;
    my lab is an up-to-date Debian. To install DenyHosts, type:


    ```

    sudo apt install denyhosts

    ```


    This is followed by the most important step of the configuration: You need to
    add the IP addresses of all the systems from which you want to log in to be blocked
    by /etc/hosts.allow there is a danger that you will be locked out of the system
    permanently so it might be better to take another sip of coffee check again that
    there are no types.

    DenyHosts is controlled by the /etc/hosts.conf which contains sensible defaults,
    but if you take a look some of them the most important lines in the configuration
    file are where you define the number of failed attempts before the system locks
    a host. In rule DenyHosts takes into account when you login as a user that also
    exists in /etc/passwd (Listing 2). After adjusting the values to satisfy your
    satisfaction, it''s time to put into DenyHosts operations (Listing 3).

    DenyHosts writes all the tries to the /var/log/auth.log (Figure 1). You will see
    that


    thresholds, the IP address of the /etc/hosts.deny is entered in the knocking system
    and blocked by iptables (Figure 2). As a highlight, DenyHosts can synchronize
    with other servers worldwide - a bit further for this can be protects the section
    of the configuration file.


    The fact that DenyHosts, unlike Fail2ban, does not release an IP address after
    a certain time is seen as a disadvantage by many users. So for me nobody managed
    to intruder more than 10 times. In fact, it depends on your personal preferences
    as to which of the tools you use. I tend towards DenyHosts -


    +   Listing 1: hosts.allow

    shd:10.0.0.8

    shd:10.0.0.42


    +   Listing 2: denyhosts.conf

    # Admin failed attempts:

    * User does not exist

    DENY_THRESHOLD_INVALID = 5

    * User exists

    DENY_THRESHOLD_VALID = 10

    * User is "root"

    DENY_THRESHOLD_ROOT = 1


    Author

    Charly Kühnast uses Unix in a data center in the Rhine region of Germany. His
    responsibilities include ensuring the security and availability of frameworks


    +   Listing 3: Starting DenyHosts

    sudo systemctl restart denyhosts

    sudo systemctl enable denyhosts


