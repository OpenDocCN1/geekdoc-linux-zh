    ## COVER STORY


    ### Facial authentication with Howdy


    By Karsten Günther, Futurists and entrepreneurs have long been obsessed with the
    idea of biometric authentication. Every body is unique – could you recognize?
    Police departments have used fingerprints to identify suspects for years, and
    for many researchers, the holy grail for biometric authentication is still facial
    recognition. The human brain recognizes all the time: that is when “recognize”
    someone. Course, when a camera takes a picture of you, it is more convenient than
    typing. Windows Hello technology, which is built into Microsoft systems, gives
    an option. Howdy brings the convenience of facial authentication to Linux. Howdy
    requires two important components:


    - Imaging – to capture an image of the person who is trying to authenticate

    - Artificial intelligence – to compare image with a reference


    Once the identity is confirmed, then the way to pass on the operating system.
    Howdy uses OpenCV library for image processing and facial recognition; it then
    passes control to PAM. Howdy is not intended as a complete security system. As
    the website states, it is no way secure and will never...


    ### The Camera


    It takes a camera to see a face. Today, IR (near infrared) cameras which are not
    normally installed in laptops as standard equipment are popular for reliable facial
    recognition. Howdy theoretically works on laptops that have a standard webcam,
    but won’t be reliable. For starting, the system already activates the (built-in)
    device file. If you are unsure, try using a photo application like Cheese, or
    the v4l2-ctl command from the v4l-utils package.


    ### PAM Authentication


    The PAM system is built into Linux to offer high-level authentication processes.
    PAM consists of modules that control authentication. On one hand, this means that
    you can apply procedures in succession: for example, first facial recognition
    and then, if it fails (or denied), password input. On the other hand, you can
    also use PAM to provide different procedures: For instance, use facial recognition
    to unlock the desktop, but require a password to install new programs.


    ### Try It Out


    As a Python program, Howdy has a number of distribution-specific dependencies,
    such as python-pam. In addition to using OpenCV for face recognition, Howdy leverages
    the Hierarchical Data Format (HDF5) for data storage and FFmpeg for reading the
    video stream. The basic installation is quite simple on most distributions: Install
    the howdy package via your package manager. The system might need to add some
    packages, such as the python-pam package. Howdy requires some manual configuration
    and face recognition training. The basic software configuration and training are
    handled by few subcommands (see Table 1). You can also use options to simplify
    the steps for some actions (see Table 2). To set up your software, use:


    ```bash

    sudo howdy config

    ```


    #### Table 1: Subcommands


    | Parameter | Function |

    | --- | --- |

    | add | Add profile (model) for current user |

    | test | Test facial recognition |

    | clear | Delete profile |

    | config | Create or edit configuration |

    | disable | Disable Howdy |

    | list | Display profiles |

    | remove ID | Delete profile with ID |

    | snapshot | snapshot |

    | version | Display version |


    #### Table 2: Options


    | - | Function |

    | --- | --- |

    | -h | Online help |

    | -y | Skip profile name query |

    | -U | Define profile for user |


    This process will start the default editor with a fairly compact configuration
    file that documents all settings in detail. The few changes necessary for some
    initial experiments are shown in Listing 1. By default, the detection_notice parameter
    is set to false, which prevents Howdy from reporting successful face recognition
    tests.


    By the most important settings refer to the video device used (lens). The IR camera
    was available as /dev/video2 if normal webcams are often designated as /dev/video0
    or /dev/video1. For starting, the system already activates the (built-in) device
    file.


    #### Listing 1: Howdy Configuration


    ini

    [config]

    # Print that face detection is being attempted

    # default: false

    detection_notice = true


    # The path of the device to capture frames from

    # Should be set automatically by an installer

    # If your distro is home

    device_path = /dev/video0


    [snapshots]

    # Capture Snapshots of failed login attempts

    # and save them with metadata

    # Snapshots are saved to the "snapshots" folder

    capture_failed = true


    # Do not the same as the option above but for

    # successful attempts

    capture_successful = true

    ```

