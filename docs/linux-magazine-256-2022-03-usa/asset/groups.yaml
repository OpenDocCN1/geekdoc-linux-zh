    ## TO THE COLORS


    Dear Reader,


    Users of the colors.js code conversion library were surprised recently when their
    printers started to print "Liberty Liberty..." and then began spreading random
    characters in an infinite loop. The weird appearance of the printed page made
    users wonder if a vandal had broken into the source code, or if the bug was much
    larger. It turns out that colors.js and faker.js libraries sabotaged the code
    himself. Mark Squad had apparently disillusioned with the large companies using
    their code without contributing or providing compensation. In November 2020, he
    wrote on the faker.js GitHub page, "Respectfully, I am no longer going to support
    you with my free work. There isn''t much else to say. Take this as an opportunity
    to fix a yearly contract or for the project and have someone else"


    At the time it wasn''t clear how the story ended. We all found out.


    Also colors.js and faker.js are independent projects that are largely overseen
    by a single volunteer, they have quite a large footprint in the world. According
    to reports, colors.js received 2 million downloads per week and is integrated
    into many open source tools by commercial users, including the Amazon Cloud Development
    Kit.


    This kind of story always makes us want to choose sides for a "have and not haves"
    or "business" "everyone else" debate. It would not be inaccurate to assume that
    the Free Software offered commercial uses for all their freedoms unless the Free
    Software statement tolerates no restriction on how the code will be used (as long
    as it stays free), and that GNU.org make it clear that prohibiting commercial
    use is just another limitation on freedom.


    One of the early Free Software pioneers didn''t care if anyone else got rich was
    they totally believe that getting rich was not all they wanted. They wanted an
    identity for Free Software that was independent of wealth, and to them, the best
    way was to ensure that was not restrict wealth but to not care about it. Of course,
    they were young back then. As volunteers they get, to start back a mortgage and
    college tuition for their kids, and the idea of contributing for the joy of it
    while a large corporation is deriving value from the work was quite unsettling.


    I can see why developer was ready to stop giving his work for free - especially
    with many vendors like Amazon using his and not pitching or compensating him.
    However, the problem with this kind of dramatic exit is that it plays into the
    hands of those who deify Free Software as a playground for unruly anarchists who
    can''t be trusted with real business. I can imagine Microsoft so back now showing
    on how to work this into their pitch.


    Note that this has nothing to do with Linux - at least they are cross-platform,
    but in the long run, this kind of theatrical protest is not a good for the open
    source development model, which means it isn''t for the Linux community.


    Independent open sources burn out all the time, and, ideally, resources are available
    within the project for order of transition. However, many projects are too small
    or fragmented to provide the needed continuity. What is striking about this case
    is that Squad needs all the paycheck or was someone else would need to take over.
    We should have been listening? Perhaps it is time for the Linux Foundation or
    another of the multimillion organizations dedicated to overseeing the Linux image
    to provide some direct outreach and transition support for all small projects
    that give Linux so much of its.


    Joe Casad,

    Editor in Chief


