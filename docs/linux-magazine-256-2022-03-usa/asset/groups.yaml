    指向 `/lib/security/howdy/cl.py` 的符号链接，它读取并写入数据到 `/lib/security/howdy/cl.py`。为了保持低误报率，尽可能选择与你脸部相似的结果。添加特征有一个缺点：特征越多，运行得越慢。在识别率和速度之间找到良好的平衡是重要的。如果在身份验证期间发生错误，每次再添加一个特征。在测试中，大多数情况下
