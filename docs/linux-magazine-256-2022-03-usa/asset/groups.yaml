    # 探索以太坊智能合约功能的可能\n\n# 智能\n\n以太坊加密货币系统允许你将程序构建到区块链中，以协调复杂的交易并记录结果。我们将向你展示如何开始使用以太坊智能合约。作者\
    \ Mats Tage Axelsson。\n\n近年来，数字货币引起了巨大的轰动，比特币是第一个。中本聪（Satoshi Nakamoto）——著名的比特币创造者——产生了将比特币作为类似黄金的价值存储手段的想法。因为比特币的设计初衷是为了价值转移。\n\
    \n以太坊是第一个支持非同质化代币（NFT）[2]的区块链技术，而且以太坊仍然是创建 NFT 最流行的工具。\n\n从早期的区块一直追溯到第一个区块。第一个区块被称为创世区块（genesis\
    \ block），整个系统是一个垂直链。\n\n智能合约的能力使得以太坊成为支持去中心化自治组织（DAOs）、基于区块链的保险以及多功能系统的理想选择。\n\
    \n等一下，它是真实的还是链？实际上，它两者兼有。如果区块链仅仅是一条链，那么验证必须通过整条链。以太坊虚拟机（EVM）听起来很奇怪，但状态（state）并不像简单应用程序那样是一个值。状态有许多方式不断变化。状态以树的形式表示。\n\
    \n当维塔·布特林（Vitalik Buterin）等人设计第一版本的以太坊[1]时，他们希望扩展区块链合约以包含其他类型的交互。以太坊构建的智能合约概念是：嵌入区块链的程序，它根据预设目标自动管理、执行和行动。智能合约可以是一个协议或合同，不需要传统的监督和执行。\n\
    \n# 以太坊区块链\n\n区块链的原理是一样的，如果你花过几个小时学习编程，就会知道链表（chained lists）是如何工作的。列表从第一个项目到下一个，创建一个根据你的需求增长的列表。\n\
    \n通过以太坊，每个人任何人都可以下载链并向其添加内容。你如何确保状态正确？你如何知道不知道的人更改了历史？区块链必须是防篡的。\n\n比特币可能留有一些智能合约的残迹，其作为货币的角色支持了众筹和多元文化等功能，但以太坊将该概念扩展到了更广泛的交易和安排中。例如，\n\
    \n为了处理每个区块，每个区块都始于一个加密哈希。该哈希取决于之前区块的内容。并不是所有区块的哈希值都取决于以太坊区块链区块头部的值。这种方法允许客户端在不查询整个树的情况下进行验证。剪枝树约为\
    \ 1.2TB，完整的则为 60TB。处理起来并不容易。\n\n以太坊拥有用于验证交易的树。这些树是状态树、交易树和收据树。相对于树的一个小部分，使用链来验证一切是否正确要容易得多。\n\
    \n```\n// Example 1 - 创建并更新树\nconst Trie = require('merkle-patrie').Trie; // 导入创建基础\
    \ Patricia Trie 所需的库\nvar trie = new Trie(); // 我们创建一个空的 Patricia Trie\ntrie.root\
    \ = trie.root; // 根节点 (32字节)\nvar value = trie.put('testing', 'value'); // 我们用键值对\
    \ Testing: 'value' 进行更新\nvar value = trie.get('testing'); // 我们检索键 testing 的值：'value'\n\
    trie.update('testing', 'new_value'); // 新的根节点 (32字节)\n```\n\n当你想要使用以太坊的加密货币，或验证有关以太坊的任何内容时，你需要一个客户端（client）。\n\
    \n完整的树对于大多数系统来说需要太多的空间。轻量节点（light node）只需要树的一部分，仍然允许你验证交易。你可以使用轻量节点来平衡账户、检查账户是否存在以及运行测试。测试对于确保不会失败验证受害者至关重要。\n\
    \n树有不同的功能，你需要它们来完成任务。你的客户端需要使用状态树来检查账户余额并进行测试。交易会经常更新，但相比之下，状态变化频繁；它包含了所有的账户和记录。交易树只保留交易记录，所以它也会更新但并非如此。如果你想用更具操作性的方法处理\
