    # Knowledge editor


    # # Obsidian


    Linux is the worst choice of operating system for people who like to because there''s
    so much choice. There is also so much to learn when you make a choice that it
    makes decisions even when you postpone your decision. This is particularly true
    when it comes to note-taking because practitioners are also prone note-taker.
    There are so many ways to make your notes that it''s


    easier to spend time research than it is to make a decision and start using one.
    There are command-line tools, markdown editors, others such as Vim and Emacs mode
    and each have their advantages, but none can easily link between notes and their
    context as you add notes, make links, create differences. This is a project that
    Obsidian has been developed to, and it has become hugely popular in the world
    of productivity hacking, thanks to it supporting other applications and being
    particularly good at.


    Obsidian is a desktop-bound-note application built on Electron. It takes more
    resources than native, but you do get beautiful font rendering, spell checking,
    syntax highlighting, and excellent cross-platform compatibility, with Importers
    for ARM6 and x86. To start taking notes is like a tour through Obsidian''s Help
    vault containing your documentation. With a vault started, Ctrl+N will create
    a new note and start typing. The notes are written in simple Markdown so you can
    read them as raw text without difficulty. Obsidian allows you to show more than
    one note at a time, and a preview lets you quickly see how they look outside of
    the Markdown syntax. This can also be a bit confusing in the beginning, but with
    the excellent help documentation the help system provides you will find your options
    when you start using commands and linking. A command panel can also be opened
    to show the shortcuts, and a Markdown-book like will convert some of the special
    formatting from native applications. It also means things in the way that Obsidian
    uses links.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_83_1.png)


    +   1. Markdown files: notes are saved as Markdown and the knowledge comes from
    a SQLite database. 2. Vaults: sets of notes are organized in vaults, which are
    linked to filesystem directories. You can also add tags to help organize your
    notes.


    +   3. Graph view: Map each note from one to the note you started, making it easy
    to see the relationship between your notes. 4. Note highlight: hover over a note
    to see which notes it references and vice versa. 5. Editor: The Obsidian editor
    is simple, clean, and with an optional output mode. 6. Export: Notes can be published
    directly or compiled into a PDF. 7. Help: The help documentation is both substantial
    and well written.


    Project Website


    https://obsidian.md


