    \ from the P4 source community (1). The goal of INT is to collect and report packets\
    \ through network telemetry. Work has been built for the source community with\
    \ Host Inband Network Telemetry (Host-INT). The Host-INT framework can collect\
    \ various variables of network – such as latency and packet drops – that would\
