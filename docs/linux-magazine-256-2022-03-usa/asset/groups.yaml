    machines, you need a BIOS, a bootloader, and the Linux operating system.


    ```bash

    #!/bin/bash

    BASIDIR~/risc-v

    UBUNTU=ubuntu-20.04.2-preinstalled-server-riscv64-unmatched.img


    if test -f $type-riscv64-linux-gnu-gcc; then

    ```


    Listing 1: RISC-V Ubuntu for Qemu


    This starts with the RISC-V compiler, which you install typing


    ```

    apt install gcc-riscv64-linux-gnu

    ```


    The RISC-V server [4] hosted by Canonical has a small memory footprint at 46MB.
    You will need to convert it to a usable size after downloading and unpacking the
    image Qemu tools.


    Our script provides the installation steps. [5]


    Incidentally, the download and installation only occur the first call.


    Save the script in a file named, risc-v.linux, change the access rights to execute
    by typing


    ```bash

    chmod 755 risc-v-linux.sh

    ```


    and finally start the launch. Launch Linux in the console by calling


    ```bash

    ./risc-v-linux

    ```


    At this point, you will need some patience, because the RISC-V CPU implementation
    in Qemu is a software emulation rather than virtual. A few minutes later, you
    should hold


    ```bash

    qemu-system-riscv64 -machine -m 4G -nographic \

