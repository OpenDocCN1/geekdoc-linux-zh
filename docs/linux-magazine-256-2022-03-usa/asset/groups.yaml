    # 光绘


    作为最小的 Raspberry Pi 型号，Pico 配有 RP2040 微控制器和 ARM Cortex-M0 处理器，提供了当代 C/C++ 的先进替代方案，并且性能表现良好。由于我想让线条靠得近，所以我决定使用每米
    60 个 LED 的灯带，总共 120 个 LED。LED 需要适当的电源，可以从 Pico 获取但必须直接从灯带接线。在这个项目的电路中，我们使用 Pi
    Pico 上的 MicroPython 固件（表 1）。光灯不需要 WiFi 连接。对于打算在户外使用的项目，关闭电源电压非常方便，而无损坏 SD 卡的风险。我将不会详细介绍如何开始使用
    Pico、在与设备通信时需要考虑什么，以及如何使用 MicroPython 编程，因为网上关于这些主题已经有了足够好的文章。即使是一个很小的面包板也能提供基本测试所需的组件（图
    1）。Pico 可以控制许多 RGB LED，实现这一点最简单的方法是使用 NeoPixels（例如 WS2812b），这些 LED 有自己的控制芯片，并可以在线上进行单独寻址。现在有许多设计，为了简单起见，在下文中将它们称为
    LED。2 米的光灯就可以了，因此可以很容易地携带，而且，可以移动。这种移动和像素的定时切换可以创建出理想的光幕（图 2）。在灯带 (GPIO18) 处一个小电阻是一个好主意。1.2V
    镍氢电池（微型，AAA）电源可以根据需要移动（图 4）。或者，你可以使用尽可能小的 5V 电池宝。


    如果电路在测试设置中正常，你就可以构建。所有的硬件都直接安装在杆上，杆是由标准铝材制成的。最后，成品板看起来相当紧凑，因为只需要几个组件，你就可以通用电路板（图
    3）。理想情况下，Pico 顶部有一个槽，以便将 PCB 从其他硬件分离。Pico 还有带有焊接引脚的 版本，但只有几个引脚需要连接，所以你可以很快地完成焊接。这就是为什么图中没有连续灯带。

