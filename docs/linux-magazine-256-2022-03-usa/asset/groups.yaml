    \ Schilli。\n\n我徒步路线的 GPS 数据是在 geotrack 和 Komoot [1] 等应用的帮助记录的，具有统计分析的潜力。我在哪天最懒？具有徒步潜力的地区，以及我在世界地图上覆盖最多的区域是\n\
