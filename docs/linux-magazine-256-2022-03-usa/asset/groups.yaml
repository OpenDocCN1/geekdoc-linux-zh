    ## 制造空间 (MakerSpace)

    树莓派上的工业控制编程与协议

    小型工业


    通过阶形图块、结构化文本和 Modbus TCP 创建自动化项目。作者：Pete Metcalfe。


    某些自动化项目可以利用许多优秀的软件包（例如 Home Assistant 和 Node-RED）来管理和监控传感器及设备。如果你感兴趣在你的自动化项目中使用工业控制方法，那么
    OpenPLC [1] 是一个值得考虑的软件包。可编程逻辑控制器 (PLC) 是一种加固硬件设备，根据 IEC 61131-3 标准 [2] 管理 I/O
    和逻辑。


    OpenPLC 开源软件运行在树莓派、Linux 或 Windows PC 上，它提供了学习工业控制概念、编程语言和通信协议的绝佳方式。在这篇文章中，我将通过一些使用阶形图、功能块和结构化文本编程语言的小型
    OpenPLC 项目来介绍 IEC 61131-3 编程。这里介绍的项目程序连接到树莓派的通用输入/输出 (GPIO) 引脚进行基础读取，并在引脚 23 上有一个
    LED（图 3）。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_63_0.png)


    **图 1:** 树莓派上的 OpenPLC。


    ## 树莓派上的 OpenPLC


    OpenPLC 使用 IEC 61131-3 寻址定义树莓派的 I/O（图 4）。对于此项目，位于 (BCM) 引脚 17（物理引脚 11）的按钮是一个 0
    或 1 位的输入位。BCM 23（物理引脚 16）的 LED 定义为 ~XIO3，是一个 0 或 1 位的输出位。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_64_0.png)


    注意，OpenPLC 分配了树莓派输入的左侧（奇数）以及所有右侧（偶数）引脚作为输出。


    该项目的第一步是创建 IEC 61131-3 程序并连接到树莓派和 LED。创建输出后，将其编译并加载到 OpenPLC 运行时；Web 界面有一个监控可以查看逻辑变量。


    > 我希望 OpenPLC 执行基础的树莓派读写，或者我想要一个引脚 17 上有按钮、引脚 23 上有 LED 的设置（图 3）。


    ## 入手


    OpenPLC 软件以软件包形式提供：逻辑编辑器、运行时组件和图形构建器。你可以找到针对你安装的具体说明 (4)。对于我的安装，我将 OpenPLC 放在我的
    Ubuntu PC 上进行独立配置和测试，但你也可以在树莓派上同时加载编辑器和 OpenPLC 运行时。OpenPLC 运行时具有 Web 界面，可以通过浏览器上传逻辑。我没有安装
    OpenPLC 图形构建器；而是使用 Node-RED 仪表板作为我的用户界面。


    OpenPLC 拥有大量的通信软件包和 I/O 组件（图 1）。对于这个项目，我创建了一个包含三层的 OpenPLC 项目：阶形程序、功能块和结构化文本。


    资源对象 (Resource) 定义了程序可以使用的全局变量（例如按钮 PB1）和任务周期（图 2）。PLC 的优点之一是它允许方便管理任务调度。由于我将所有程序都放在同一个任务
    (task0) 中，对于较大的项目，我可能会将所有数字逻辑放在快速执行 (20ms)，并将我的模拟逻辑放在较慢的任务执行 (250ms) 中。


