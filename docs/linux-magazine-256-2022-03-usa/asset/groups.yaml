    ## 内核新闻


    “虚假的编译器警告”完全*不在*我们要关注的问题清单上。


    “我查看了许多现在变成错误的警告，其中许多被故意标记为‘如此’，以确保我们在 x86_64 上不会看到它们——但其中没有一个实际上是让我觉得‘错误’的判断是错误的。”


    “我这周花了大量时间尝试解决所有的警告，我特别感谢 Quentin Roek 在他追踪失败原因方面所做的工作。工作已经完成了。但现在，对于这一切，我感觉很棒，尽管这意味着我今天看了一些非常奇异的代码。我可能还会担心某一个
    EISA 驱动在几年后的问题？这是一种小小的宁静。”


    Florian Weiner 对 `-werror` 通用性表示担忧，“某些警告是由 GCC 编译器（优化器）发出的，而 `-werror` 会将这些问题的警告视为错误。这些警告具有很强的针对性，而且由于不同的优化参数导致。”他补充道，“GCC
    还有一种机制，如果警告是在优化过程中引入并在稍后再次移动的（例如内联、常量代码删除），它可以修复这些警告。”


    “因为我们每个人都曾为某些显然很久以前的事情受过苦。但它生成的警告确实存在。”


    “所以别再提说什么‘有些警告是垃圾’了。除了实际的 Bug 和我们已经关闭的琐碎愚蠢之外，情况并非那么简单。”


    “它的意思是‘不要这样做’。但整体而言，我对这一切感觉很棒，尽管这意味着我今天看了一些非常奇异的代码。”


    Linus 对 Florian 关于 `-werror` 结尾的陈述反了回去。Linus 对他说道：


    “而且，那些编译器 Bug 是存在的。新的警告总是围绕当前 gcc（未发布版）的一个问题，那里是有效的警告，而另一个编译器问题是由于我的发现而解决的。”


    “最烦恼的是，修复了一个旧编译器的案例，结果另外三个又冒了出来。但我仍然相信，我们确实有一套代码可以处理这些极端情况。”


    “人们是这么说的，但让我们面对现实吧，事实并非如此。”


    “确实存在问题的警告，我们也关闭了那些警告。那些想要开启 `W=1`（或更大值）的人，花了一辈子与产生大量假报警的随机编译器警告作斗争。”


    “而且，我们在绕过旧编译器 Bug 方面存在问题。它们不会消失，而 `-werror` 可能并不意味着我们必须处理它们。”


    “但事实是，过去几年我一直要求在 x86_64 上进行无警告构建以便注意，这真的并不是一个问题。”


    “而且，这很痛苦。我已经做过尝试。但我们只需要这样做。警告不会自动消失，不处理致命且明显的错误，就意味着它们将永远存在。”


    “一直存在的问题是：(a) 我们关注的警告，以及 (b) 我个人认为所有其他非 x86_64 架构的配置很突出，但确实存在某些其他的配置问题。”


    就这样，Linus 结束了话题。至少在那个小列表里的这一项是如此。


