- md: "\n# LINUX VOICE TUTORIAL – PHOTOPRIS\n\n## Keeping tabs on your photo library\
    \ with PhotoPrism\n### Machine Learning Smarts for Shuttersburg\n\nPhotoPrism\
    \ offers a combination of a polished, user-friendly interface and an artificial\
    \ intelligence that makes organizing, searching, and sharing photos a breeze.\n\
    \nBY DMITRI POPOV\n\nOrganizing a photo library containing RAW files, photos,\
    \ and videos can be a time-consuming and mind-numbing task. The mere thought of\
    \ manually tagging, grouping, and organizing photos and videos gives even the\
    \ most patient photographers chills. Good thing we live in the age of artificial\
    \ intelligence (AI) that can take the burden of boring tasks off shoulders. For\
    \ anyone not on spending countless evenings fighting a losing battle of keeping\
    \ their libraries organized, PhotoPrism is a manna from heaven. This application\
    \ provides a polished capable user interface with the powerful TensorFlow machine\
    \ learning engine, providing you with a platform that can take care of keeping\
    \ tabs on photos and videos as you like. This description is not an exaggeration.\
    \ The inner workings of TensorFlow are hidden away with ease—it's so easy that\
    \ it's almost too easy to find that PhotoPrism is powered by a complex piece of\
    \ software engineering and not fairy dust. TensorFlow is not perfect and produces\
    \ some imperfect results. But it is pretty much the only thing that actually powers\
    \ PhotoPrism.\n\n## Deploy PhotoPrism\n\nBecause PhotoPrism consists of complex\
    \ moving daunting deployment, it would be a reality deal if it weren't for containers.\
    \ PhotoPrism is distributed as a Docker container that reduces the task of getting\
    \ the application up and running to a simple feat.\n\nThe first order of business\
    \ is to install Docker and Docker Compose on the machine where you plan to use\
    \ for PhotoPrism. If the machine happens to run an Ubuntu-based Linux distribution,\
    \ installing both packages is a matter of issuing the command:\n\n```\nsudo apt\
    \ install docker-compose\n```\n\nWith the required software installed, use\n\n\
    ```bash\nwget https://get.photoprism.org/docker-compose.yml\n```\n\nto fetch the\
    \ configuration file.\n\nWhen you start PhotoPrism right, it's a good idea to\
    \ adjust the application defaults first. To open the docker-compose.yml file for\
    \ editing, most of the settings are best at their default values, but there are\
    \ a few that require tweaking. By default, PhotoPrism is configured to run in\
    \ the private (password-protected) mode. If you want to keep that, you can define\
    \ the password to a stronger one by setting the PHOTOPRISM_ADMIN_PASSWORD variable.\
    \ If you plan to run the application on a machine that is not exposed to the internet,\
    \ and feel confident that your PhotoPrism instance doesn't need any protection,\
    \ enable the public mode by setting PHOTOPRISM_PUBLIC to true.\n\n## Tensorflow\
    \ and PhotoPrism\n\nPhotoPrism relies on TensorFlow to perform three important\
    \ tasks. The first task is classification. TensorFlow analyzes images and returns\
    \ labels for them. For example, architectural photos get the Building label, and\
    \ wildlife photos get various labels (Bird, Butterfly, etc.), depending on the\
    \ main matter. The second task is face recognition, which allows PhotoPrism to\
    \ find similar images and group them into clusters. The third task is detecting\
    \ images that are usually referred as \"safe for work,\" which in most cases means\
    \ photos containing nudity.\n\nAnd, you might want to replace the generic name\
    \ and description of PhotoPrism by editing the PHOTOPRISM_SITE_TITLE, PHOTOPRISM_SITE_CAPTION,\
    \ PHOTOPRISM_SITE_DESCRIPTION, and PHOTOPRISM_OTHER_OPTIONS. That might not necessarily\
    \ be what you want. For example, if each RAW file in the library has a JPEG, there\
    \ is terribly little point in indexing it. To exclude files from being indexed,\
    \ create a .ignore file in the root of your photo library, and specify the desired\
    \ pattern in the file. You can use wildcards to exclude *.NEF files from being\
    \ indexed. Patterns specified in .ignore apply to the directory and all subdirectories.\
    \ When you place the file in the root, the patterns specified will be applied\
    \ to the entire library, leaving all other files untouched.\n\nBy default, PhotoPrism\
    \ uses /Pictures as your photo library. If you store images and videos in a different\
    \ location, you need to point PhotoPrism to it. To do this, follow the line in\
    \ the docker-compose.yml file:\n\n```yaml\nvolumes:\n  - /Pictures:photoprism/original\n\
    ```\n\nReplace /Pictures with the absolute path to your library. But what if you\
    \ don't keep all your files in one directory? It's not unusual to keep videos\
    \ in a separate directory or on a different storage device and you might need\
    \ to keep cache in a dedicated library. PhotoPrism makes it possible to include\
    \ other directories as subdirectories in the original. To do this, specify entries\
    \ under the volumes section as follows:\n\n```yaml\nvolumes:\n  - /path/to/library:photoprism/original\n\
    \  - /path/to/videos:photoprism/original/videos\n  - /path/to/images:photoprism/original/images\n\
    ```\n\nEach option in the docker-compose.yml tells you whether you want to modify\
    \ it or leave it as is. Once you're done editing the configuration file, make\
    \ the changes and you are ready to start PhotoPrism – there is one more thing\
    \ you might want to do. By default, PhotoPrism supports a wide range of formats,\
    \ and the application indexes all compatible formats in the directory that contains\
    \ the docker-compose.yml file.\n\n```bash\ndocker-compose up -d\n```\n\nAssuming\
    \ you've changed the default port in the configuration file, point the browser\
    \ to 127.0.0.1:2242 (replace 127.0.0.1 with the actual IP address of the machine\
    \ running PhotoPrism) and log in using the admin and password you specified. Now\
    \ PhotoPrism is up and running, you need to run an indexing operation (Figure\
    \ 1) that processes all RAW and JPEG files as well as videos (excluding of course,\
    \ the files specified in the .ignore file). To do this, go to the Library specification.\
    \ Start the indexing operation. This may take a while to complete, depending on\
    \ the number of files in your library and the hardware PhotoPrism is running on.\
    \ That's one of the reasons why you'd want to exclude files from being indexed\
    \ – it might significantly reduce the indexing time. Keep in mind that you have\
    \ to perform indexing over time add new files to the library. Don't forget to\
    \ disable the Discrete Rename option when indexing new files orders; otherwise,\
    \ PhotoPrism will perform full re-indexing of the entire library.\n\nDuring indexing,\
    \ PhotoPrism not only collects files but also related items into so-called stacks.\
    \ For example, if you have a RAW file 1780818-112501.jpg, and processed 1780818-112501.jpeg,\
    \ PhotoPrism consistently connects them together, with the 1780818-112501.jpg\
    \ file at the top of the stack (i.e., this is what PhotoPrism shows). Stacks in\
    \ PhotoPrism are identifiable by the icon in their upper-left corner. If you find\
    \ a RAW file, you can view it by clicking the Camera icon, and if the stack consists\
    \ of files in JPEG and other formats, you can view all of them by clicking on\
    \ the Stack icon (Figure 2).\n\nIn example, you'd see the processed 1780818-112501.jpeg\
    \ file the unprocessed 1780818-112501.jpg one? To do this, click on the image\
    \ to open in the view mode, then click Edit icon at the top. Switch to the Files\
    \ section (its title shows the number of files in the stack), click on the desired\
    \ file item, and press the Primary button in the Actions section. Exiting the\
    \ mode, refresh the page, and you will see the selected file at the top of the\
    \ stack.\n\nFigure 2: PhotoPrism groups into stacks. You may manually choose which\
    \ image should be the primary one.\n\n## Browse and Search\n\nIn many respects,\
    \ PhotoPrism behaves like a photo management application. The Folder module provides\
    \ access to the library, the Calendar displays all indexed files grouped by date,\
    \ and the Places module shows with a map where all photos and videos are displayed\
    \ as clusters (Figure 3). While you can use the map to drag to the desired stack,\
    \ zoom in the map or jump to the stack using the search field. Type the name of\
    \ the desired place (e.g., Ravenna) and hit Enter to search for the places.\n\n\
    The Modules module properly shows photos from the past. Instead of the more conventional\
    \ way of showing photos on the current date in previous years, PhotoPrism uses\
    \ an algorithm that creates albums a significant number (Figure 4) of photos taken\
    \ in a year and in a certain place. For example, if 2017 you will see a significant\
    \ number of photos\n\nFigure 3: Places shows all the photos in the library as\
    \ clusters on a map.\n"
  mdcn: "\n\n# LINUX 语音教程 – PHOTOPRIS\n\n## 使用 PhotoPrism 管理你的照片库\n### 为 Shutterburg\
