    After the installation, Howdy configuration involves two steps. The first step
    is the system recognizes the faces in the input data, without disturbing them.
    Differentiating them requires two people separating in the stream.


    In this training, the neural network learns specific features that represent the
    user''s face. Since Howdy does not just list images from the video stream, but
    short sequences, it is usually not a problem if you blink freely or move your
    head bit. In fact, such slight movements may take several repetitions to improve
    recognition in real-use. It takes time to build solid bases in the system.


    After configuring and training, a third step is test: Use the command that displays
    the video from the first line of Listing 3 to show a mode displays in a new window.
    The goal is not to identify a specific face, but to recognize a generic face.
