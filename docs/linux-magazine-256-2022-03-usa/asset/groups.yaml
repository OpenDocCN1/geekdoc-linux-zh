    ## 多目标后门恶意软件

    针对 Linux、macOS 和 Windows


    第一批 Sysjoker 出现于 2021 年 12 月，当时 Intezer 的人员正在调查一次针对 Linux Web 服务器的攻击。该恶意软件用 C++
    编写，每个变体都针对其攻击的操作系统进行了专门定制。VirusTotal 即使使用 57 种不同的检测引擎也未能检测到该恶意软件。


    一旦恶意软件突破防御，它将从 GitHub 获取 Sysjoker zip 压缩包，解压并执行有效负载。有效负载会收集机器信息，将结果存储并编码在 JSON
    对象中，连接 C 服务器（硬编码的 Google Drive 链接）或自身（恶意软件本身），并在受的设备上转发命令。


    Intezer 为 Sysjoker 的每种操作提供了一个指标列表。在 Linux 上，文件和服务创建在 `/library/` 目录下，并通过 cron
    任务 Reboot (`/library/Services/updatesysjob`) 创建。如果发现此类 cron 任务，务必杀死所有相关进程，手动删除文件和
    cron 任务，扫描系统以确保所有文件都已删除，并检查可能允许攻击者访问您服务器的任何漏洞。


    在 Intezer 的初始报告中了解更多关于 Sysjoker 的信息（https://www.intezer.com/blog/malware-analysis/new-backdoor-sysjoker/）。


