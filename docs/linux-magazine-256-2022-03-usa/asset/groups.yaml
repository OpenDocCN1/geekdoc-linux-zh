    除了编辑器之外，你还可以使用键盘编辑元素。在选中元素时，按 F2 打开编辑器、保存并返回主窗口。元素可以在主窗口中或你设置的默认编辑器中进行编辑。标签允许你用预定义的标签分组元素。你也可以在历史记录中看到元素将复制。请注意，你需要将其固定在历史顶部。


