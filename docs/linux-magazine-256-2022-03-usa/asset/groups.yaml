    # COPYQ LINUX 众之声


    这是一款最早于 2009 年发布的开源剪贴板管理工具，提供了多平台解决方案。CopyQ 我知道的唯一能够存储和显示包括文本和富文本 (RTF) 在内的剪贴板历史的剪贴板管理器（图
    1）。像 Clipper 或 Gpaste 仅引用图片而无法复制它们。


    CopyQ 不仅适用于 Linux，还适用于 Windows 和 macOS，因此你不需要在使用不同操作系统时更换软件。你可以从大多数 Linux 发行版的存档中安装
    CopyQ，目前可用版本为 6.0.1。如果发行版使用了与程序对应的安装包（推荐），你只需要设置 copyq 配置；否则请使用 copyq-plugins。


    # 长期记忆


    安装 CopyQ 后，你的长期记忆立即可以使用。它在未来将自动适应剪贴板内容。如果你想关闭此功能，请在主菜单中找到该功能并选择“禁用剪贴板存储”（Disable
    Clipboard Storage）或按 Ctrl+Shift+L。


    使用基础功能似乎是不言自明的，但学习曲线有点陡峭。在探索了极其丰富的设置（图 2）之后，你一定会欣赏某些详细的文档 [2]。


    在操作方面，CopyQ 位于系统托盘中，图标是一个带有绿色手柄的剪刀。点击图标可打开 CopyQ 的主窗口，你也可以通过剪贴板中的 copyq 命令自然地访问它。


    右键点击（或使用 copyq 命令）会弹出上下文菜单，显示最后五个条目并提供设置等其他内容的访问。在窗口中，窗口顶部还有一个搜索栏，你可以直接输入。Copyq
    支持命令行中 CopyQ 支持的所有。


    # 外观


    这是一种更好的方式。主窗口是你想要更改的地方。无论你使用哪一个窗口，选择所需的条目后，双击即可将其带到相应的光标位置。要做到这一点，你需要在下方设置中编辑当前窗口。你可以按
    Enter 键或 Ctrl+C 选择元素以支持剪贴板。


    CopyQ 带有八种用于软件视觉主题的默认设置。你可以编辑它们。


    为了在许多标签页中获得更好的体验，“标签”（Tabs）菜单允许你创建新标签、重命名条目并删除不需要的项目。使用左右箭头键可以在标签页之间切换。例如，使用一个经常搜索的每日标签页进行快速访问。


    # 复制与粘贴


    日常生活中最常用的场景是复制和粘贴。如果你需要最近的条目，可以在主窗口或显示最后五个条目的上下文菜单中进行。这可以轻松扩展到 10 个，例如。然而，为了获得更好的视觉效果，使用超过
    10 个条目并没有意义。


