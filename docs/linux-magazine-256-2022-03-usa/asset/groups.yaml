    ## New Multipartarget Backdoor Malware

    Targets Linux, macOS, and Windows


    The first sets of Sysjoker appeared in December 2021, when researchers at Intezer
    were investigating an attack on a Linux web server. This malware was written in
    C++ and each variant is specifically tailored for the operating system it attacks.
    VirusTotal was unable to detect the malware, even using 57 different detection
    engines.


    Once the malware has breached, it fetches the Sysjoker zip file from GitHub, unpacks,
    and executes the payload. The payload gathers information about the machine, stores
    and encodes the results in a JSON object, reaches out to a C server (hard-coded
    Google Drive link), or itself (the-malware) and forwards commands on the infected
    device.


    Intezer has provided a list of indicators for Sysjoker for each operation. On
    Linux, the files and services are created under /library/ and is created with
    the cron job Reboot (/library/Services/updatesysjob). If you discover such a cron
    job, it is imperative that you kill all related processes, manually delete the
    files and cron job, scan the system to ensure all files have been removed, and
    check for any weakness that might have allowed the attackers access to your server.


    Find out more about Sysjoker in the Initial Intezer report (https://www.intezer.com/blog/malware-analysis/new-backdoor-sysjoker/).


    ## WhiteSource Releases Free Log4j Detection Tool


    As the Log4j vulnerability continues to wreak on the IT landscape, everyone is
    trying to prevent disaster from striking. A number of companies and development
    teams have released tools to help with the detection and remediation of the vulnerability.
    One company is WhiteSource. Their new, Log4j Detection (https://github.com/whitesource/log4j-detection-distribution),
    is an open source command-line utility that scans your projects to detect the
    known CVEs:


    - CVE-2021-45048

    - CVE-2021-44228

    - CVE-2021-4104

    - CVE-2021-45106


    Once the scan is complete, it will report the back path of the vulnerable files
    as well as the fixed version you''ll need to remediate the issue. Log4j Detection
    should run within the root of your projects and also search for files with .jar
    and .war extensions. Log4j Detection supports the Gradle, Maven, and Bundle managers.


    In order for Log Detection to run properly, you''ll need to install gradle if
    your project is a Gradle project or mvn (if the project is a Maven project). The
    developers have also indicated both Maven and Bundle projects must be built before
    scanning. Once you have Log4j Detection, the scan can be started with the command
    log4j-detect -d PROJECT (where PROJECT is the hosting directory).


    For more information about this, make sure to read the project README (https://github.com/whitesource/log4j-detection-distribution/blob/main/README).


    ## Zack''s Kernel Kernel News


    ### A Butterfly Flaps Its Wings


    Andy Shevchenko, who is not a butterfly, happened to remark one day on the Linux
    Kernel Mailing List: ''When it will make sense to enable-warning level, let it
    say W=0, at some point?'' And this ended produced storms of change across the
    world.


    The warning is a command-line option for the GNU GCC (C Compiler). When compiling,
    GCC will detect errors in your code, report them to you, and abort the attempt
    to compile your code. Perhaps you haven''t made a real error, but code is still
    not good usage of the C language. In fact, GCC produces a warning and continues
    to build your executable. Maybe you are about to decide that you want to treat
    bad warnings as if they were errors. The ''-error'' option tells GCC to do that.


    Masashi Vanaka pointed out to Andy that the kernel adds new options. And ''Enabling-warning
    by default means the kernel is built with density new compilers.


    Andy replied that in case of Masashi''s objection, ''-error would at least keep
    a firm hand on the value of the changes,''


    Nick Desaullais from Google pointed out that ''Google''s kernel team carries out
    of free patch creating such errors; it helps them keep their kernel building fast.


    So there was at least a precedent for such a thing to be done? But Nick hoped
    that the ideas in side would lead to regular patches at his own company. He said,
    ''if a build is not warning free, then it is difficult to get the config to see
    how many warnings you have, which are not without hanging fruit. It also makes
    compilers upgrade difficult. If you have experience on Android, if folks are too
    busy to adapt warnings, then new warnings added by a new kernel version just get
    turned off never. Experience with the kernel has been fixes for different warnings
    also taking varying amounts of time to get accepted and their way through mainline,
    meanwhile builds are broken.


    Linus Torvalds also responded to Andy''s original post regarding-warning, saying:
    ''I would like to, and would have a long time ago, but just we have been to depend
    on compilers not having random warnings in random versions.''


    and making a config option doesn''t work well either, since just means that it
    will randomly fail if they set that, and if we make it to develop developers who
    have it set and it doesn''t help much.


    ''End-error'' works wonderfully in controlled environments. Not so in the general
    random mess.


    ''That said, I''ve been aggressive about accepting new warnings that would this
    unconditionally anyway, and then dealing with compiler faults by disabling certain
    compilers and/or options.


    ''But it would almost be perfectly peaceful.''


    Elsewhere, in an entirely different Linux, Cook posted a patch, which Linus rejected,
    saying: ''You can''t add new warnings without using them, and this adds some HORRENDOUSLY
    new warnings which would most definitely hide other warnings.''


    In a subsequent post, Linus added, ''I want to enable -Warning at some point,
    every time I think about it, and just end up working around a new compiler (or
    an old one). We have to debug various configurations (and in-code) messes.''


    But then, over his own email, Linus responded to himself, ''What I want is to
    make a new config option, make it ''default y'', and it will be for anybody adding
    codemfig builds.''


