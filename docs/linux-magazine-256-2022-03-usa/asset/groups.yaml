    \ several options for collecting additional metadata from packet headers in order\
    \ to measure latency, depth of packets that are then read by another packet, and\
    \ link utilization.\n\n# How Host-INT Works\nHost-INT is implemented in the Linux\
    \ kernel, not in the switches, and it looks out at packets from the network source.\
    \ The INT source, located at the network ingress, inserts statistics and network\
    \ information into the packet. The INT sink, located at the network egress, extracts\
    \ header and metadata and sends it to the collector. After installing and enabling\
