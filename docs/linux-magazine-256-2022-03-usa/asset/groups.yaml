    ## Listing 1: ExifTool Commands


    ```

    01 exiftool --common FILE.txt

    02 exiftool -TAG ''TAG CONTENT'' file

    02 exiftool -exif2 TAG -all

    ```


    The application takes all the metadata into account, so the output is quite long
    and confusing (2). To see the most important metadata, edit the file for testing
    (List 1). In addition to the metadata, the Tags are also easy to edit. In edit
    ExifTool, you use the command from line 2 and then verify the modified tag with
    the command from line 3. If you want to delete all the tags to protect your privacy
    before publishing an image on the Internet, enter the command from line 4 at:


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_30_0.png)


    Figure 2: Working with the command line, ExifTool lists metadata in detail.


    then you will see other of the metadata in the pane on the left. After clicking
    on one of the associated metadata details appears in the panel on the right in
    View Data bar (Figure 3). Using Edit bar, you can modify the existing data. An
    edit bar shows the corresponding data, and lets you reach the data quickly


    ## ExifTool GUI


    Due to the complexity of editing operations and the large value of metadata, ExifTool
    requires a longer learning curve. It is faster to edit metadata with a graphical
    user interface (GUI). The Java-based application requires installation of ExifTool
    and version 11 of Java Runtime Environment, which can be easily installed from
    all popular distributions. After a somewhat slow start, ExifTool GUI comes with
    a clear cut interface.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_30_1.png)


    Figure 3: ExifTool GUI lets users view and edit metadata in an easy-to-use GUI.


    ## ExifCleaner


    ExifCleaner opens a window with empty space. The source code is also available
    on GitHub. ExifCleaner starts removing metadata immediately after loading. Since
    it does not affect the original files, the deleted metadata cannot be reconstructed.
    Take care when selecting and transferring images to ExifCleaner to avoid accidents.
    Contrary to what many suggest, ExifCleaner does not make native images, but also
    formats such as AAC, MOV, and MP4. In addition, ExifCleaner removes all metadata
    except for read-only metadata (which cannot be deleted) from photos. Existing
    metadata is deleted in ExifTool without having to through a long, confusing list
    of tags and other on: To be right, you just click checkboxes to select the new
    values; by default, ExifTool will clear all boxes for saving. After completing
    the modifications, the tool applies the changes to the selected image(s) by clicking
    ''Copy to image(s)'' and save button at the bottom of the interface. ExifTool
    will then transfer the changes to the correct location in the metadata inventory.
    If necessary, you can also edit the appropriate tag by clicking edit at the bottom
    of the relevant dialog.


    ## Jhead


    Jhead is a simple command-line program to modify the headers in JPEG files. To
    define the software''s parameters, Jhead can only handle JPEGs; you will get an
    error message if you call it in any other format. To display an image''s metadata,
    use the command:


    ```

    jhead PARAMETER FILE

    jhead -all -set Artist="New Artist" image.jpg

    ```


    The individual parameters are revealed by calling jhead -H. To change the Exif
    tag multiple files located in a directory, you can also specify the file using
    wildcards, or jhead in one fell sweep. A progress bar appears at the top of the
    program window. In addition to the original file, which remains untouched, the
    new file which has the same name as cleansed, is created in the working directory.


    ## Metadata Cleaner


    Metadata Cleaner works with a modern and fully span window. Metadata Cleaner will
    suggest a backup copy and then it will delete all metadata it finds. It does not
    automatically create copies of the originals, which cannot be reconstructed.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_32_0.png)


    If you click on the icon to the left of the Cleaner, a small dialog opens where
    you can switch on a Superclean cleanup via a slider. This might not remove metadata
    from the file, but tries to preserve functionally relevant metadata. Metadata
    Cleaner is suited for file formats such as PDF where you can make changes. Modifications
    such as text in PDF or image compression may be lost and metadata will be missing.
    Consequently, you should not delete all metadata for these types of formats. The
    cleanup takes some time, depending on the number of files.


    The cleanup distribution strips metadata with the Nautilus plugin for. Only few
    distributions currently have Metadata Cleaner [10] in their repositories. Native
    binaries are available for Linux Arch, Debian, and Ubuntu and derivatives; Flatpak
    and the Python source code are also available. After installation, Metadata Cleaner
    works with modern and fully Spartan window: Metadata Cleaner has no conventional
    menu or toolbar. The GTK-based application follows the Gnome principle and integrates
    all controls into the title-bar (Figure 8).


    ## mat2


    A classical tool for removing metadata from collections, Metadata Annotation Tool
    (mat2) [9] only supports images and audio files, but it also supports PDF and
    Office file formats. The mat2 allows particular editing for users in sensitive
    areas, such as journalists or lawyers. For the Nautilus plugin you can clean up
    files at the command line without knowing the syntax. To do this, simply select
    the files to be cleaned and right-click to call the menu in which you clear Remove
    metadata option.


    Figure 7: You can use Nautilus as a plugin.


    The application lists the Exif tags in the terminal (Figure 6). To change the
    tags by parameters supported by software, use the command:


    ```

    jhead PARAMETER FILE

    jhead -all -set Artist="New Artist" image.jpg

    ```


