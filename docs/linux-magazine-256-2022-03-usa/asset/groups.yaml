    带内遥测 (INT) 是 P4 源社区的一项开放规范 (1)。INT 的目标是通过网络遥测收集并报告数据包。社区已为主机带内遥测 (Host-INT) 构建了工作。Host-INT
    框架可以收集各种网络变量——例如延迟和丢包——这些是很难获取的。Host-INT 非常需要网络对应用程序影响的开发者。例如，WAN 服务提供商可以使用 Host-INT
    来确保其服务协议得到满足。


