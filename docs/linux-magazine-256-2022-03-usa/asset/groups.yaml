    或 UDP 头部。为了让接收主机 B 能够区分数据包，主机 A 将 IPv4 服务类型（Type of Service）字段中的目的字段代码（DSP）修改为某个值。建议咨询网络管理员，分配一个下游未用于其他用途的
    DSP 值。


    INT 头部中的数字，决定了该流在网络中丢失了多少数据包。


    主机 B 在发生以下任何事件时都会生成 INT 报告：


    - 接收到带有 INT 头的新流的首数据包。

    - 每个数据包报告周期。如果检测到任何新包，或近期检测到新包，则会对每个流进行计数并生成 INT 报告。报告包含该流中检测到的数据包数量。

    - 数据包的单向延迟与该流的上一个数据包的延迟存在显著差异，会生成延迟报告。


    帮助网络管理员了解经历延迟或大量丢包的流。Host-INT 不计算路由内的行为延迟。然而，Swift 具有寻找根源的能力。如果你在网络中部署了支持 INT
    的交换机，可以配置这些交换机在发生丢包或延迟时生成 INT 报告。通过配置交换机，你可以快速确定网络中拥堵和丢包发生的实际位置。与其他方法不同，它可以检测所有被丢弃的数据包。


    当数据包到达主机 B 时，运行主机 B 内核中的 ebpf 程序对其进行处理。如果数据包包含 INT 头部（带有 DSP 值），将其发送到 Linux 网络代码，随后进行处理。


    在 INT 头部之前，主机 B 计算数据包延迟，计算方法为 B 接收数据包的时间减去主机 A 在 INT 头部中发送的时间戳。时钟同步存在某些不精确，主机
    B 在此延迟测量中引入误差。建议使用网络时间协议（NTP）或精确时间协议（PTP）同步设备时钟。


    主机 B 的 ebpf 程序在 ebpf map 中查找数据包的流（由源主机 A 使用的五元组头部决定）。对于主机 B 接收到的带有 INT 头部的数据包，它会检查：


    - 上次接收数据包的时间。

    - 主机 B 接收到的该流数据包的单向延迟。

    - 使用数据结构，并结合

    - 数据计数器的变化

    - 数据计数器的更新


    这两种变化都会以流为基础进行报告。


    Host-INT 生成从发送主机接收到的 INT 数据包导出的 INT 报告，数据从 INT 提取到文本文件中。其他添加扩展了 Host-INT 的功能。Host-INT
    支持将 INT 扩展到包含头部的数据包之外，甚至到配置的 IP 地址。


    使用配置 IP 地址的典型原因是从许多主机将 INT 报告发送到遥测分析系统，该系统可以收集、处理并显示关于网络遥测数据的洞察决策。（Intel Deep
    Insights Analytics 软件是处理 INT 报告的分析系统示例。）


