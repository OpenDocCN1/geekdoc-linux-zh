    # LINUX FOSSPICKS


    ## FOSSpicks


    Sparkling gems new releases from the world of Free and Open Source Software


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_83_0.png)


    This month, Graham is hitting off a new caffeine dependency after discovering
    his espresso machine been hacked and automated by adding an Arduino! BY GRAHAM
    MORISON


    ## Knowledge editor


    ### Obsidian


    Linux is the worst choice of operating system for people who like to choose because
    there''s so much choice. There is also so much to learn when you make a choice
    that it makes decisions even when you postpone your decision. This is particularly
    true when it comes to note-taking because practitioners are also prone to note-taking.
    There are so many ways to make your notes that it''s easier to spend time researching
    than it is to make a decision and start using one. There are command-line tools,
    markdown editors, others such as Vim and Emacs mode, and each have their advantages,
    but none can easily link between notes and their context as you add notes, make
    links, create differences. This is a project that Obsidian has been developed
    for, and it has become hugely popular in the world of productivity hacking, thanks
    to it supporting other applications and being particularly good at.


    Obsidian is a desktop-bound-note application built on Electron. It takes more
    resources than native, but you do get beautiful font rendering, spell checking,
    syntax highlighting, and excellent cross-platform compatibility, with Importers
    for ARM6 and x86. To start taking notes is like a tour through Obsidian''s Help
    vault containing your documentation. With a vault started, Ctrl+N will create
    a new note and start typing. The notes are written in simple Markdown so you can
    read them as raw text without difficulty. Obsidian allows you to show more than
    one note at a time, and a preview lets you quickly see how they look outside of
    the Markdown syntax. This can also be a bit confusing in the beginning, but with
    the excellent help documentation the help system provides you you will find your
    options when you start using commands and linking. A command panel can also be
    opened to show the shortcuts, and a Markdown-book-like will convert some of the
    special formatting from native applications. It also means things in the way that
    Obsidian uses links.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_83_1.png)


    - 1. Markdown files: notes are saved as Markdown and the knowledge comes from
    a SQLite database.

    - 2. Vaults: sets of notes are organized in vaults, which are linked to filesystem
    directories. You can also add tags to help organize your notes.

    - 3. Graph view: Map each note from one to the note you started, making it easy
    to see the relationship between your notes.

    - 4. Note highlight: hover over a note to see which notes it references and vice
    versa.

    - 5. Editor: The Obsidian editor is simple, clean, and with an optional output
    mode.

    - 6. Export: Notes can be published directly or compiled into a PDF.

    - 7. Help: the help documentation is both substantial and well written.


    Project Website


    https://obsidian.md


    84 MARCH 2022

    ISSUE 256 LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    ## Collection manager


    ### Kavita


    There are many ways to track and manage collections of things, from simple files
    in your Documents folder or an open source database legacy inherited from SQL
    to various applications or spreadsheets. There''s nothing better than finding
    a tool that''s been developed by someone with the same passion for a specific
    niche. What is Kavita? It''s a self-hosted, web-based collection manager built
    specifically for media, comics, and books. It''s not limited to that—you can create
    a collection of any type, but graphical items will be able to take advantage of
    bookmarks, browser-based reading, plus the image thumbnails used to view your
    collection will look more uniform. The project has been built with the Angular
    framework and it is an interesting project, developed by Google to make good looking
    and complex web applications to be built with relative ease. Kavita includes an
    installer to handle all dependencies, and many people run it within Docker. Whatever
    you choose, it''s easy to get up. The UI requires that you create a user account
    and then start your own library with your own titles. Kavita can manage CBR, CBZ,
    ZIP, RAR, and image files. You can read and view comics and PDF files from the
    web interface, create bookmarks, and continue reading where you left off, from
    a new session or different device. You can rate, add items to lists and categories,


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_84_0.png)


    Kavita is designed to manage and collect your book while also letting you read
    from the web interface and search across all collections and phrases you might
    be looking for. It works especially well on a tablet—you can use the web interface
    as an e-reader, easily accessible from anywhere on your network—allows you to
    start a collection that you might not have considered of.


    ## Git client


    ### lazygit


    It starts off by cloning repositories, creating branches, and pushing back changes
    to your shared code without troubling the documentation. It works like a control
    system to work, and many projects can suffer like this, perhaps with a matter
    of rebasing and cherry. But with Git, it''s like walking through a fog of war
    during your project. Turning your muscle memory commands into intricate knots
    can become almost impossible. Now I wish that you''ve used some kind of smart
    client to make better sense of it. This is what lazygit aims to be. It runs from,
    takes over, your terminal, finally the area with five six different panels. When
    first launched, it asks you to watch a YouTube video explaining its features before
    installing the latest releases. Despite easy to understand if you''ve used Git
    for some time. On the left, five panels show current file and status, including
    modified files, a list of recent commit messages, and whether there are any staged
    files (from other branches stored for later retrieval). You can navigate between
    them through each separate entry with the cursors or Vim navigation. Selecting
    a file will show the right side of the view to show both staged changes for a
    file, with diff showing what''s changed. This is one of the clearest interfaces
    you''ve seen looking for the state of a repository, and it


    # Project Website


    https://github.com/jesseduffield/lazygit


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_84_1.png)


    One of the best things about the lazygit client, other than its interface, is
    it feel like an interactive redo of your repository. It gives you an ideal feel
    for what you''ve worked on and what has been recently committed. If you''ve not
    worked on a repository before, or not working on a repository for some time, this
    experience helps you get back up to speed.


    # Project Website


    https://github.com/jesseduffield/lazygit


    ## LINUX OS FOSSPICKS


    ## Code editor


    ### Lapce


    We always joke that the reason there are so many programming editors is because
    choosing the best editor is an ideal project for programmers, especially when
    they are switching to a new language. Because Rust seems to be a popular new language,
    there are now dozens of editors written in Rust. Lapce seems to be one of those
    that are often mentioned specifically by programmers when Arch users failing to
    find their favorite Linux distribution. All of this is true of Lapce, a new programmer''s
    editor that proudly extends its credentials on believe. It does in such a way
    that de-clutter is in such a way that makes it worth the installation effort.
    In particular, it''s fast, simple, and uses command modes like Vim. Lapce is still
    in early development stage, but others are using it as their daily driver for
    a while. The main window is sparse, but it''s also fast and functional. There
    are many panes: an editing pane, an embedded terminal, and others for changed
    files. It feels much better when you''ve used it before, the de-clutter is in
    such a way that makes it worth.


    The editor is modal, which means each edit is a command palette. Like Vim, the
    command palette is opened with the : key, but you can call many commands including
    opening files, creating tabs, changing the theme (some are light and dark),


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_85_0.png)


    In addition to providing small functions, Lapce also has a WASI plugin system
    that is to be developed which is as good as a fully configured sole, but you could
    create your own addons now. It''s easy, but Lapce also does make it a good position
    for fast editing, and it''s likely to get better in the future.


    # Project Website


    https://github.com/lapce/lapce


    ## Terminal emulator


    ### Tabby


    We''re used to seeing new terminal emulators appear after not fully formed and
    ready to use. Yet this is the case with Tabby, both for the key you frequently
    use the command line and because it''s not dissimilar to that first terminal emulator
    like Kitty, but it has a good reason why Tabby has been almost fully formed and
    ready from day one. Terminus Tabby, is a terminal emulator for the modern age.
    In being, Tabby offers lots of performance and convenience that your default terminal
    might been lacking. These differences don''t make a difference on Linux, but they
    might be if you want to use the same terminal across various platforms. Tabby
    is easily installed on WSL with PowerShell, Cygwin, and Git Bash, as well as binary
    clients for Windows, macOS, and Linux. We use it for convenience. From the first
    launch, very little setup is required to create a functional environment. Tabby
    includes SSH and terminal management, with port forwarding as well as a serial
    term for remotely connecting on devices. The window can split and hold multiple
    sessions with tabs in each, both left and right-hand side, and the tabs can be
    renamed and configured to show progress and notifications. There''s also a ''quake''
    mode for sliding the terminal onto a screen, edge


    In addition to providing small functions, Tabby is easily themed to fit whichever
    environment and operating system you''re using. The same is also true of setting
    global hotkeys. You can add functionality with plugins and hidden-secrets in Tabby
    with own SSH, which is as good as a fully configured sole, but better out of the
    box, especially on Linux systems.


    # Project Website


    https://github.com/Eugeny/tabby

