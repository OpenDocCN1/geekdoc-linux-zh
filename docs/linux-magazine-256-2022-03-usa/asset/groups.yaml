    starts PhotoPrism. To stop the application, use


    ```

    docker-compose stop

    ```


    If you need to reset PhotoPrism and start from scratch, use


    ```

    docker-compose exec photoprism photoprism reset

    ```


    # Info


    +   [1] PhotoPrism: https://photoprism.app/

    [2] PhotoPrism search: https://docs.photoprism.app/org/user-guide/search/


    # The Author


    Dmitry Popov has been writing exclusively for Linux and open source for many years.
    His articles have appeared in Danish, British, German, Spanish, and Russian magazines.
    You can find more on his website at yokoma.com.


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_93_0.png)


