    \n任何与（请参阅被排除的框）相关的内容。你还可以在“设置 Cupcake”。你有选项在本地机器上运行许多节点。在界面中，你将找到与区块链交互的基本内容。你可以创建账户并在链上进行发送和接收。接着查看区块浏览器，看看交易是如何运行的。还有一个沙箱，你可以在那里部署自己的合约并测试所有函数。\n\
    \n更平的入门方法是使用 Remix 在线服务；Remix 允许你从本地磁盘或云加载函数。功能与 Cupcake 类似，但 Remix 支持协议。基础插件是\
