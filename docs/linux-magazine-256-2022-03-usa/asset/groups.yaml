    64 位版本


    在 90 年代后期，BeOS 是一个拥有大量追随者的私有操作系统。BeOS 是最早使用多处理器和广泛多线程的操作系统之一。它以速度、稳定性和精神闻名，这种精神在
    Haiku 中延续——Haiku 是一个基于 BeOS 源码的小型开源项目。


    Haiku 尚未正式发布（general release），但目前这个版本对于大多数用途来说已经足够稳定。它安装了自带应用，以及标准软件包中的部分 KDE
