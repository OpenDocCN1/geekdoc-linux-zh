    Both of these changes are reported on a per-flow basis.


    Host-INT generates INT reports that export from the INT packet received by the
    sending host, where the data is extracted from the INT to a text file. Other additions
    expand the functionality of Host-INT. Host-INT supports extending INT beyond the
    packet containing header and even to a configured IP address.


