    # CALL FOR PAPERS


    We are looking for good articles on Linux and the tools of the Linux environment.
    Although we consider any topic, the following themes are of special interest:


    - System administration

    - Useful tips and tools

    - Security, both news and techniques

    - Product reviews, examples from real-world experience

    - Community news and projects


    If you have an idea, send a proposal with an outline, estimate of the length,
    a description of your background, and contact information to edit@linux-magazine.com.


    The technical level of the article should be consistent with what you normally
    read in Linux Magazine. Remember that Linux Magazine is read in many countries,
    and your article may be translated into one of our publications. Therefore, it
    is best to avoid using slang and idioms that might not be understood by all.


    Be careful when referring dates or events in the future. Many weeks pass between
    your manuscript submission and the final copy reaching the reader''s hands. When
    sending emails or messages, please use a clear subject line in your email that
