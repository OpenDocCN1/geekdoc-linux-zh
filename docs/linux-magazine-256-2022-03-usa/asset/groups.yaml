    As a Python program, Howdy has a number of distribution-specific dependencies,
    such as *python-pam*. In addition to using OpenCV for face recognition, Howdy
    leverages the Hierarchical Data Format (HDF5) for data storage and FFmpeg for
    reading the video stream.


    The basic installation is quite simple on most distributions: Install the howdy
    package via your package manager. The system you might need to add some packages,
    such as the *python-pam* package.


    # Try It Out


    Howdy requires some manual configuration and face recognition training. The basic
    software configuration and training are handled by few subcommands (see in Table
    1). You can also use options to simplify the steps for some actions (see Table
    2).

    To set up your software, use:


    ```

    sudo howdy config

    ```


    # Table 1: Subcommands


    | Parameter | Function |

    | --- | --- |

    | add | Add profile (model) for current user |

    | test | Test facial recognition |

    | clear | Delete profile |

    | config | Create or edit configuration |

    | disable | Disable Howdy |

    | list | Display profiles |

    | remove ID | Delete profile with ID |

    | snapshot | snapshot |

    | version | Display version |


    # Table 2: Options


    | - | Function |

    | --- | --- |

    | -h | Online help |

    | -y | Skip profile name query |

    | -U | Define profile for user |


    This process will start the default editor with a fairly compact configuration
    file that documents all settings in detail. The few changes necessary for some
    initial experiments are shown in Listing 1.

    By default, the *detection_notice* parameter is set to false, which prevents Howdy
    from reporting successful face recognition tests.


    By the most important settings refer to the video device used (lens). The IR camera
    was available as */dev/video2*/ if normal webcams are often designated */dev/video0*/
    or */dev/video1/*. For starting, the system already activates the (built-in) device
    file


    If you are unsure, try using a photo application like Cheese, or the v4l2-ctl
    command from the *v4l-utils* package.


    # Listing 1: Howdy Configuration


    ```

    01 [config]

    02 # Print that face detection is being attempted

    03 # default: false

    04 detection_notice = true

    05

    06 # The path of the device to capture frames from

    07 # Should be set automatically by an installer

    08 # If your distro is home

    09 device_path = /dev/video0

    10

    11 [snapshots]

    12 # Capture Snapshots of failed login attempts

    13 # and save them with metadata

    14 # Snapshots are saved to the "snapshots" folder

    15 capture_failed = true

    16

    17 # Do not the same as the option above but for

    18 # successful attempts

    19 capture_successful = true

    ```


