    # Kavita


    There are many ways to track and manage collections of things, from simple files
    in your Documents folder or an open source database legacy inherited from SQL
    to various applications or spreadsheets. There''s nothing better than finding
    a tool that''s been developed by someone with the same passion for a specific
    niche. What is Kavita? It''s a self-hosted, web-based collection manager built
    specifically for media, comics, and books. It''s not limited to that—you can create
    a collection of any type, but graphical items will be able to take advantage of
    bookmarks, browser-based reading, plus the


    image thumbnails used to view your collection will look more uniform. The project
    has been built with the Angular framework and it is an interesting project, developed
    by Google to make good looking and complex web applications to be built with relative
    ease. Kavita includes a installer to handle all dependencies, and many people
    run it within Docker. Whatever you choose, it''s easy to get up. The UI requires
    that you create a user account and then start your own library with your own titles.
    Kavita can manage CBR, CBZ, ZIP, RAR, and image files. You can read and view comics
