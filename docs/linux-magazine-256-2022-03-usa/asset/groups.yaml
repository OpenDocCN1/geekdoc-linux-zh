    # Fly-Pie 通过饼图菜单导航系统


    ## 饼的一角


    无论你使用 Gnome 还是 KDE，Windows 还是 macOS，菜单总会从工具栏中弹出。Fly-Pie 则是以饼图的形式组织了一个可以自由配置的菜单。作者为：CHRISTOP
    LANGNERN


    自 Gnome、KDE 和 Xfce 早期以来，我们的操作方式已经发生了显著变化。尽管 Gnome 有时会对比这些范式进行批判。即使是早期的界面模型如 GEM
    或 Xerox Alto 系统（所有图形用户界面滚动条或菜单的祖先）也是如此。然而，偶尔离开熟悉的路径并尝试新事物是有用的。针对 Gnome 桌面面的 Fly-Pie
    [1] 是为那些倾向于将手停留在鼠标上而不是触碰键盘的用户的理想选择。动态饼图菜单允许你启动应用程序或将其移动到顶层、模拟热键等许多功能。该菜单可以针对全面的配置管理器进行细粒度的自定义。


    与像 Gnome Shell 的活动概览或像 Kuper [2] 启动器这种高度倾向于键盘的方法相比，Fly-Pie 是


    ## 控制手势


    Fly-Pie 并不是一个独立的程序，而是 Gnome 桌面 3.34 或更高版本的扩展。要安装它，打开 Gnome Shell 扩展框 [3]，将气泡滑块拨到
    On，并选择“Gnome Extensions”。之后，该扩展将出现在 Gnome 管理器中显示为手动安装。从那时，你可以通过齿轮图标访问设置。我在 Arch
    Linux 上配合当前的 Gnome 41 测试了该扩展。


    ## Gnome 扩展


    要通过网站 (https://gnome.org) 安装 Gnome 扩展，你需要一个带有特殊浏览器扩展的兼容浏览器。Chrome [4] 和 Firefox
    [5] 均提供扩展，但不支持扩展的内置浏览器除。此外，必须从包管理器安装 `gnome-shell-package`。这并不是每个发行版的默认安装包含内容。不要被这个名称误导，你仍然需要结合
    Firefox 安装该包。Ubuntu 拥有其自己安装 Firefox 和 Chrome Snap 包的方法，这在这里导致了问题：浏览器无法与 Gnome
    Shell 通信。作为替代解决方案，你需要安装 Chrome 浏览器。


    进行初始测试时，按下 Ctrl+Shift：这会在鼠标位置中心弹出一个饼图形式的菜单。点击你选择的扇区可以触发不同的操作。执行操作时，并不取决于距离光标有多远。在预配置的菜单项中，你可以使用环形柄跳转到上一个或下一个桌面，最大化当前窗口，或打开
    Fly-Pie 菜单。


    顶部的“运行应用程序”、“音频”和“收藏”扇区带一个新的饼图菜单，作为扇区图标周围的独立“气泡”。例如，要打开 Firefox 浏览器，按下 Ctrl+Space，点击图标以及子菜单中的
    Firefox 菜单。或者，你可以使用突出模式。在这种情况下，将鼠标指针点击 Fly-Pie 菜单条目，并按住鼠标左键至屏幕底部垃圾桶区域旁。旁边的暂存区域（Stash
    area）可以在不立即永久删除菜单的情况下禁用该菜单。


    然后将指针稍微移离中心并停止移动。此时，如果可用，子菜单将自动打开，或者执行相应的操作。


    前两种模式基本上只是为了学习工作原理。Fly-Pie 在 Turbo 模式下更高效，这意味着鼠标点击次数显著减少。要实现这一点，按下 Ctrl+Space
    调出 Fly-Pie 菜单。然后点击中心并按住鼠标键。要打开 Firefox，将鼠标指针移动到心形图标上，等待菜单打开，然后点击 Firefox。当你到达那里时，再次释放左键（图
    1）。


    当你开始创建自己的菜单或将示例调整为自己的时，Fly-Pie 会展现出它的优势。要这样做，请使用设置选项卡上的菜单编辑器。点击右侧的图标启用学习模式（图 3）。选择菜单。你可以更改名称和图标，或为其定义新的快捷键。要删除，拖动


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_77_0.png)

    图 1：运行中的 Fly-Pie 示例：将菜单移动到你周围。


    例如，你可以为媒体播放器创建一个菜单，用于网页导航菜单，以及用于使用你喜欢的编辑器进行文字处理菜单，包括指向最重要的功能和来源的链接。


    要创建自己的菜单，点击标题栏下方“所有菜单”菜单项右侧的图标。对话框显示了预定义的列表，如设备、书签和系统，其中已经包含了预定义的菜单或操作。理想情况下，从一个带有“用户菜单”的空白页面开始。从那里开始，可以通过点击加号图标添加另一个子菜单。你可以自由地组织每个部分的条目。你可能想将重要操作组织成列表，这样你只需要让菜单指针直接穿过结构即可。


    ## 入门实用练习


    其原理并不是所有人都能从一开始理解，因此 Fly-Pie 为用户提供了详细的介绍。你可以在程序设置中访问它。按下 Ctrl+Space 打开菜单，然后点击底部的心形。介绍将引导你通过几个步骤了解不同的操作模式。示例和视频解释了
    Fly-Pie 如何工作（图 2）。在最后，一旦你能足够快地控制程序，就有奖励可以获得。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_77_1.png)

    图 2：Fly-Pie 介绍逐步解释了动态菜单的工作原理。


    该项目是 Gnome 扩展的一个极佳范例。介绍帮助用户理解操作。视频分步解释了大多数操作，开发者展示了项目的最新创新。这个带有奖励的小游戏也激励人们尽可能高效地使用游戏，以发现使用
    Fly-Pie 的最佳方法。


    ## 结论


    Fly-Pie 最大的优势在于其灵活性。该程序没有将自己限制在单一菜单，而是允许你为重要的应用程序或任务创建多个菜单，每个菜单都可以通过快捷键调用。


    ## 信息


    - [1] Fly-Pie: https://schneegans.github.io

    - [2] Kuper: https://kupferlauncher.github.io

    - [3] Gnome extensions: //extensions.gnome.org/extension/3443/fly-pie/

    - [4] Gnome Shell for Chrome: https://chrome.google.com/webstore/detail/gnome-shell-integration/gphcmnejobjbbgnja

    - [5] Gnome Shell integration for Firefox: https://addons.mozilla.org/en-US/firefox/addon/gnome-shell-integration


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_78.png)

    图 3：菜单编辑器让你根据需要进行调整或从零创建新菜单。


