    # LINUX VOICE COPYQ


    ## 高级剪贴板管理器

    高级剪贴板


    CopyQ 用实用功能扩展了剪贴板同时也满足高级需求。作者为：FERDINAND THOMMES


    无论你使用 Linux、macOS 还是 Windows，剪贴板都是桌面上最常用的工具之一。它是一个临时存储可以复制并粘贴到其他应用程序中的片段的系统。


    各种桌面环境都有剪贴板管理器。为了操作存储在 RAM 中且内容在下次重启时消失的系统剪贴板，这些工具可以跨会话保留配置数量的内容。在 KDE Plasma
    中，相应的应用程序被称为 Klipper，它与剪贴板松散耦合。


    你通过 Ctrl+X、Ctrl+C 或用鼠标选择内容来填充剪贴板。剪贴板工具或密码管理器等应用程序也有在 Klipper 中保存项目或密码的菜单。


    在设置中，出于安全考虑，指定 启动时是空内存还是跨会话保留之前的内容。此外，可以指定大量操作，例如自动粘贴或基于正则表达式的过滤。


    即使 Klipper 及其类似物扩展了剪贴板的功能，使用 CopyQ 还能做更多事情 [1]。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_79.png)

    图 1：作为一个独特的卖点，CopyQ 允许你显示图像而不只是保存引用。


