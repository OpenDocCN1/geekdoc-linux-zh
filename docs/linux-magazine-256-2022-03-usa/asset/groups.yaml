    and first to see if it is already a result in cache. If not, it fetches the geodata
    with a web-side API and stores what it needs in the cache. While the program is
    running, the cache fills up visibly with the incoming requests, as a quick look
    at the cache directory in Figure 6.


    Listing 7 generates named states, and Figure 7 shows the results: My GPS files
    are mostly from California also features the states of Bavaria, Baden-Württemberg,
    and Lower Saxony.


    # I Want More


    Of course, these are only examples that show what is possible. With a little effort,
    more hidden nuggets could be extracted from the data. For example, if you want
    to identify the regions with the most popular trails, you can use an AI k-means
    method. In addition, artificial intelligence could help visualize popular hiking
    routes that you have not visited for some time. And there''s so much more; the
    data is recorded, and the world is yours.


