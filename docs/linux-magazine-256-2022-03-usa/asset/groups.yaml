    \n完整的树对于大多数系统来说需要太多的空间。轻量节点（light node）只需要树的一部分，仍然允许你验证交易。你可以使用轻量节点来平衡账户、检查账户是否存在以及运行测试。测试对于确保不会失败验证受害者至关重要。\n\
    \n树有不同的功能，你需要它们来完成任务。你的客户端需要使用状态树来检查账户余额并进行测试。交易会经常更新，但相比之下，状态变化频繁；它包含了所有的账户和记录。交易树只保留交易记录，所以它也会更新但并非如此。如果你想用更具操作性的方法处理\
    \ Merkle-Patricia 树，可以下载教程并尝试。第一个示例在图 1 中，显示了如何初始化账户。\n\n转换将取决于 gas 价格。根据维基百科，在创建交易时，发送者支付\
    \ gas 限制。交易中使用最大的 gas 量，而 gas 价格是每单位支付给矿工的 ETH 数量。大多数人使用以太坊进行交易。MetaMask 是一个很好的客户端，非常常见。在\
    \ MetaMask 中，你可以发送交易，有时可以在交易挂起时选择速度来加速。MetaMask 还可以通过提供你的公地址来请求哈希。普通钱包会自动按单位设置\
    \ gas 价格。例如，Exodus（图 2），以及加密钱包。这些钱包有多种功能和更漂亮的界面，包含了用于交易的图表。\n\n# 交易\n\n最简单的交易是支付一个金额。你可以通过在你的账户或测试之间进行支付来尝试。每笔交易都将花费你一些\
    \ wei（gwei 是以太坊的最小单位）。\n\n# Solidity 语言！\n\n你可以用许多语言编写智能合约，但最常用的是 Solidity。\n"
