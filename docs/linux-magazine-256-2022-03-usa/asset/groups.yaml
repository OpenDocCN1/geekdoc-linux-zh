    # Function Block Diagrams


    One limitation of ladder logic is that managing analog logic can be messy; therefore,
    function block diagrams (FBDs) are used. If you are comfortable with graphical
    programming languages like Node-RED, you shouldn''t have any problems with FBDs.


    # Ladder Diagrams


    Ladder logic was the first IEC 61131-3 programming language, developed as a graphical
    representation for circuits of relay hardware. The term "ladder diagram" (LD)
    describes the appearance of the logic, which looks like a ladder (Figure 5), with
    the left side having a power rail and the right side a series of horizontal lines,
    or "ungs," which are hardware components connecting the coils.


