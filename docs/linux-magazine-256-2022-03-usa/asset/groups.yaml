    # Fly-Pie navigates through the system with pie menus


    ## Piece of Pie


    No matter you use Gnome or KDE, Windows or macOS menus always pop up from a bar.
    Fly-Pie organizes a freely configurable menu in the form of a pie chart instead.
    BY CHRISTOP LANGNERN


    The we we changed significantly since the early days of Gnome, KDE, and Xfce.
    Even if Gnome prefers to take a swipe at the paradigms every now and then. Even
    early interface models like GEM or the Xerox Alto system, the forefather of all
    graphical user interface scrolls, or menus. Every now and then, however, is useful
    to step off the familiar path and trying something new. The Fly-Pie [1] for the
    Gnome desktop is a candidate for an off-the-aimed at users who prefer to keep
    their hands on the mouse instead of reaching for the keyboard. The dynamic pie
    menu lets you launch applications or move them to the foreground, simulate hotkeys,
    and much more. The menu can be customized in a granular way towards the comprehensive
    configuration manager.


    In contrast to heavily keyboard-oriented approaches such as Gnome Shell''s activity
    overview or launchers like Kuper [2], Fly-Pie is


    ## Control Gesture


    Fly-Pie is not a standalone but an extension for the Gnome desktop 3.34 or newer.
    To install it, you open the Gnome Shell extensions box [3], make the bubble slider
    to On, and select "Gnome Extensions". After, the extension appears in the Gnome
    manager as manually installed. From then, you can access the settings via the
    gear icon. I tested the extension on Arch Linux with current Gnome 41.


    ## Gnome Extensions


    To Install Gnome extensions via the website (https://gnome.org), you need a compatible
    web browser with special browser extensions. Extensions are available for Chrome
    [4], and Firefox [5], but not for the in-house browser, which does not support
    extensions. In addition, the gnome-shell-package from the package manager must
    be installed. This is not part of the default installation on every distribution.
    Don''t be confused by the name, you must still install the package in combination
    with Firefox. Ubuntu, with its own way of installing browsers like Firefox and
    Chrome Snap packages, causes issues here. The browser fails to communicate with
    Gnome Shell. As a workaround, you would need to install the Chrome browser.


    For an initial test, press Ctrl+Shift: This pops up a menu in the form of a pie
    chart at the mouse position center. Positioning on the sector you choose can trigger
    different actions by clicking. It is not how far away from the cursor when you
    perform the action. In the preconfigured menu items, you can use the ring handle
    to jump to the next or previous desktop, or maximize the current window, or open
    the Fly-Pie menus.


    The top sectors Running Applications, Sound, and Favorites bring to a new pie
    menu, as individually a ''bubble'' around the sector''s icon. For example, to
    open the Firefox browser, press Ctrl+Space, tap the icon and the Firefox menu
    in the submenu. Alternatively, you can use highlight mode. In this case, click
    the mouse pointer on the entry for Fly-Pie menu and hold down the left mouse menu''s
    next to the Trash area at the bottom of the screen. The Stash area next to it
    disables a menu without immediately and permanently deleting it.


    Then drag the pointer little away from the center and stop the movement. At this
    point, the submenu will open automatically, if available, or the corresponding
    action will be performed.


    The first two modes are basically just for learning how things work. Fly-Pie is
    more efficient in Turbo mode, which means significantly less mouse clicking. To
    do this, call up the Fly-Pie menu by pressing Ctrl+Space. Then click on the center
    and hold the mouse button. To open Firefox, drag the mouse pointer over the heart
    icon, wait until the menu opens, and click on Firefox. When you get there, release
    the left mouse button again (Figure 1).


    Fly-Pie shows its strengths when you start creating your own menu or adapt the
    sample to yours. To do this, use Menu Editor on the Settings tab. Click on the
    icon on the right to enable learning mode (Figure 3). Select the menu. You can
    change the name and icon or define a new shortcut to it. To delete, drag


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_77_0.png)

    Figure 1: The example Fly-Pie in action: move the menu to the forward around you.


    For example, you can create a menu for operating the media player, for navigating
    the web, and one for word processing with your favorite editors, including links
    to the most important features and sources.


    To create your own menu, click the icon to the right of the All Menus menu item
    below the titlebar. The dialog shows a predefined list of items such as Devices,
    Bookmarks, and System, of which already contained predefined menus or actions.
    Ideally, start on an empty page with a User Menu. Starting from there you can
    then add another submenu by pressing the plus icon. You can freely organize the
    entries in each section. You might want to organize important actions in a list
    so that you only need to move the menu pointer straight through the structure.


    ## Practical Exercises to Get Started


    The principle is not everyone understand the beginning, which is Fly-Pie offers
    users a detailed introduction. You can access this in the program settings. Open
    the menu by pressing Ctrl+Space and then click on the heart on the bottom. The
    introduction guides you in several steps through the various operating modes.
    Practical examples and videos explain how Fly-Pie works (Figure 2). At the end,
    there are awards to be won once you can control the program quickly enough


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_77_1.png)

    Figure 2: The Fly-Pie introduction explains step-by-step how the dynamic menu
    works.


    The project is a fine example of a Gnome extension. The introduction helps users
    understand operations. Videos explain the most actions step-by-step, and the developer
