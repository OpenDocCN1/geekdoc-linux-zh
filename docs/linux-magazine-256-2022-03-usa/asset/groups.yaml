    # Exploring the RISC-V processor architecture


    ## New Chip in Town


    The open source RISC-V processor architecture is poised to shake up the processor
    industry. Thanks to the Qemu emulator, you can get to know the RISC-V without
    waiting for affordable hardware.


    By Eva-Katharina Kunst und Jürgen Cade


    Most of the IT industry has consolidated around Intel-x86 and (related) AMD64
    architectures. But just two decades ago, several other manufacturers and architectures
    were fighting for a place in the market. Many of these processors (including MIPS,
    PowerPC, Alpha, and SPARC) followed a set of principles for processor design known
    as Reduced Instruction Set Computer (RISC). RISC systems live on today, most notably
    in the ARM architecture used in today''s smartphones, Raspberry Pi, and other
    electronic devices. (The acronym ARM actually stands for Advanced RISC Machine).
    But another RISC trend is also on the rise. RISC-V, pronounced "Risk Five," is
    widely hailed as a shooting star in the processor architecture sky [1].


    Proponents believe RISC-V can do everything ARM can do – and it is all open and
    royalty free. The non-proprietary nature of RISC-V means it could allow small
    chips to get in a game that is now dominated by a few tech giants. And even mainstream
    vendors could give you an edge by choosing RISC-V and avoiding licensing fees.


    ## Hardware Options


    The ESP32-C3 DevKit-02 board, which features a RISC-V core, is available in mail
    order shops for prices starting at around EUR10 (Figure 1). Chinese manufacturer
    Espressif has added a RISC-V-based ESP32-C3 to its well-known and successful ESP32
    model; it has slightly slower performance than the classic model, but it is smaller
    and less expensive.


    Figure 1: Espressif is already offering its ESP32-C3-DevKit-02 RISC-V board for
    a low price.


    # RISC-V


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_42_0.png)


    Figure 2: The RISC-V logo.


    Table 1: RISC-V Features

    | Modularity | Basic Instruction Set Extensions |

    | --- | --- |

    | Register with | 32, 64 |

    | No. of registers | 16 (for embedded), 32, 64 |

    | Architecture type | Load/Store |

    | File format | Little Endian |

    | Number of instructions | 40 (RV32), Computational, Control Flow, Memory Access
    |

    | Privilege levels | 3 |

    | Machine type | 6 (R, I, U, S, B, J) |

    | Software | Comprehensive software ecosystem with popular software stacks (Linux,
    FreeRTOS) |

    | Misc. | Stable specification, no further changes |


    At 10 years old, the RISC-V architecture is still considerably young. If you live
    without Linux and prefer FreeRTOS, you can get today and see RISC-V experience
    on realistic hardware (see the ''Hardware Options'' section). Until now, if you
    were looking for a RISC-V processor capable of running Linux, you would have to
    pay at least EUR500. As this issue goes out, affordable-ready RISC-V has finally
    reached the market, with little known about it [2]. If you want to know RISC-V
    with linux, you can do so right now writing for the hardware RISC-V compiler is
    available for Ubuntu, and the Qemu emulator is also available to emulate 32-bit
    or 64-bit RISC-V system. Small Linux distros RISC-V have many de-facto collections,
    so you can get to it quickly.


    RISC-V is defined as 32–64– and 128-bit architecture. In all worlds, hardware
    have a width of 32, 64, or 128 bits, depending on 32 or 64 of registers, which
    are numbered to X31 or X63. Apart from the X0 register, which can be used and
    where all bits are set to zero, the registers can be used for various purposes,
    however, there is no special instance. However, the architecture provides for
    a separate component (PC) (i.e., an instruction that contains the address needs
    to process next).


    Whereas the x86 architecture is a widely used machine, RISC-V has three registers
    involved in one operation. If two registers add the content of two registers,
    it results in one of the two. A three-register machine, on one hand, can cause
    the result in a third register (X1 = X2 + X3).


    # About RISC-V


    Ten years ago, scientists at the University of California, Berkeley (UC Berkeley),
    developed a new CPU instruction set architecture (ISA) known as RISC-V (Figure
    2); the idea was for RISC-V to be modern and suitable for both teaching and research,
    as well as actual applications [1]. The special highlight was the RISC-based licensing,
    which allows anyone to use the architecture for free of charge (Table 1).


    Over the past few, many small companies have begun to explore the possibilities
    of RISC-V, developing and distributing hardware with RISC-V core, and making their
    designs available free of charge. The leader in RISC-V, for example, has clearly
    mastered the RISC-V core developed, as disk manufacturer Western. Even Apple,
    with a very powerful and efficient ARM CPU up in the field, has reportedly been
    looking for RISC-V developments.


    Table 2: Selection of RISC-V Instruction Set Extensions

    | RV32 | Base Instruction Set |

    | --- | --- |

    | RV32A | A extension (atomic read-modify) |

    | RV32B | B extension (bit manipulation) |

