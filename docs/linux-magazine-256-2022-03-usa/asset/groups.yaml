    # TUTORIAL – PHOTOPRISM LINUX VOICE


    For your trip to Japan, PhotoPrism will create an album for them in the Moments
    module. In addition to that, the algorithm also finds labels with significant
    number of photos and creates albums in the Moments module based on the results.
    The "significant" varies dynamically based on the overall number of items. Navigating
    the library by traversing the available categories provides a convenient way to
    quickly locate photos where to find. But that, of course, is not always the case.
    This is where PhotoPrism''s search functionality comes into play, and the Search
    section gives you access to all the search features the application has to. Surprisingly,
    the most straightforward way to run a search is to type the desired search term
    in the Search field and hit Enter. You can search for people, objects in the photos,
    filenames, locations, and the dominating color (Figure 5). PhotoPrism also makes
    it possible to filter photos using several predefined criteria, such as country,
    year, and camera.


    Figure 4: The Moments module determines the most important moments in your life
    by the name you took.


    # IT Highlights at a Glance


    Too busy to wade through press releases and chatty tech news sites? Let us deliver
