    # 探索 RISC-V 处理器架构


    ## 镇上的新芯片


    开源 RISC-V 处理器架构正准备要撼动处理器行业。得益于 Qemu 模拟器，你可以在无需等待廉价硬件的情况下尽早了解 RISC-V。


    作者：Eva-Katharina Kunst 和 Jürgen Cade


    IT 行业的大大部分已经汇聚在 Intel-x86 和（相关的）AMD64 架构周围。但在二十年前，还有其他几个制造商和架构在为市场地位争夺之地。这些许多处理器（包括
    MIPS、PowerPC、Alpha 和 SPARC）都遵循一套被称为精简指令集计算机（RISC）的处理器设计原则。RISC 系统在今天依然存在，最著名的就是用于如今智能手机、树莓派和其他电子设备中的
    ARM 架构。（ARM 的缩写实际上代表 Advanced RISC Machine）。但另外一种 RISC 趋势也在兴起。RISC-V（读作 "Risk
    Five"）被广泛誉为处理器架构天空中的一颗*流星* [1]。


    支持者认为 RISC-V 可以做到 ARM 能做到的所有事情——而且它完全是开源且免版税的。RISC-V 的非专有性质意味着它可能允许小型芯片进入这个如今由少数几个科技巨头主导的市场。即使是主流供应商也可以通过选择
    RISC-V 并避开许可费用来获得竞争优势。


    ## 硬件选项


    ESP32-C3 DevKit-02 板板具有 RISC-V 核心，可以在邮购商店中购买，价格约 10 欧元起（图 1）。中国制造商乐鑫科技（Espressif）已在其广为人知的成功的
    ESP32 型中增加了基于 RISC-V 的 ESP32-C3；它的性能比经典型号稍慢，但体积更小且更便宜。


    图 1：乐鑫科技已以低价提供其 ESP32-C3-DevKit-02 RISC-V 板板。


    # RISC-V


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_42_0.png)


    图 2：RISC-V 标志。


    表 1：RISC-V 特性

    | 模块化 | 基础指令集扩展 |

    | --- | --- |

    | 寄存器 | 32, 64 |

    | 寄存器数量 | 16（嵌入式），32, 64 |

    | 架构类型 | 加载/存储 (Load/Store) |

    | 文件格式 | 小端序 |

    | 指令数量 | 40 (RV32)，计算、控制流、内存访问 |

    | 特权级 | 3 |

    | 机器类型 | 6 (R, I, U, S, B, J) |

    | 软件 | 完善的软件生态系统，包含流行的软件栈（Linux, FreeRTOS） |

    | 杂 | 规范稳定，不再发生更改 |


    在 10 岁的年纪，RISC-V 架构仍然非常年轻。如果你不用 Linux 且更偏好 FreeRTOS，你现在就可以在真实的硬件上体验 RISC-V（请参见“硬件选项”部分）。到目前为止，如果你正在寻找能够运行
    Linux 的 RISC-V 处理器，你必须支付至少 500 欧元。随着本期的发行，负担得起的 RISC-V 终于进入了市场，但对其了解的甚少 [2]。如果你想了解带有
    Linux 的 RISC-V，你现在就可以通过编写来实现，目前适用于 Ubuntu 的硬件 RISC-V 编译器可用，且 Qemu 模拟器也可以模拟 32
    位或 64 位 RISC-V 系统。RISC-V 轻级 Linux 发行版有很多事实上的集合，因此你可以快速上手。


    RISC-V 被定义为 32、64 位和 128 位架构。在所有世界中，硬件位宽均为32、64 或 128 位，取决于编号为 X31 或 X63 的 32
    或 64 个寄存器。除了可以使用且所有位都设为零的 X0 寄存器外，寄存器可用于各种用途，但没有特殊实例。然而，该架构提供了一个独立的组件（PC）（即包含下一个要处理的地址的指令）。


    虽然 x86 架构是一种广泛使用的机器，但 RISC-V 一个操作中涉及三个寄存器。如果两个寄存器相加两个寄存器的内容，结果将是其中一个。另一方面，三寄存器机器可以在第三个寄存器中产生结果（X1
    = X2 + X3）。


    # 关于 RISC-V


    十年前，加州大学伯尔克利分校（UC Berkeley）的科学家们开发了一种全新的 CPU 指令集架构（ISA），称为 RISC-V（图 2）；其理念是让 RISC-V
    变得现代化，并适用于教学、研究以及实际应用 [1]。其特别亮点是基于 RISC 的许可模式，它允许任何人免费使用该架构（表 1）。


    在过去的几年里，许多小公司已经开始使用 RISC-V。非专有性质的 RISC-V 允许小型芯片进入这个现在由少数科技巨头主导的游戏。即使主流供应商也可以通过选择
    RISC-V 并避开许可费用来获得优势。


    表 2：RISC-V 指令集扩展

    | 扩展 | 基础指令集 |

    | --- | --- |

    | RV32A | 原子操作 |

    | RV32B | 位操作 |

    | RV32C | 压缩指令 |

    | RV32D | 双精度浮点 |

    | RV32F | 单精度浮点 |

    | RV32M | 乘除法 |

    | RV32S | 监管器模式 |

    | RV32V | 向量扩展 |


