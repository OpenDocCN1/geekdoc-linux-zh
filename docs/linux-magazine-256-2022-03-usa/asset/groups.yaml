    此外，备注和标签可以与磁盘上的目录同步，而导入功能在反向工作。如果你想防止未经授权的访问，软件也让你加密 CopyQ（图 5）。


    你可以在 CopyQ 中启用预定义命令。你也可以添加自己的命令。这些命令在剪贴板上操作，或者通过主菜单或快捷键执行。这可以用于，例如，将新命令集成到或插入到浏览器或图像编辑器。文档提供了更多示例
    [4]，你可以运行脚本来实现更复杂的操作 [5]。预定义命令 [6] 可以在 GitHub 上找到 [7]。所有 CopyQ 功能也可以通过快捷键调用。首先，你想为下方的主窗口定义一个进程管理器让
