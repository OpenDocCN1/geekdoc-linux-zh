    # Host-INT Collects Metadata


    Inband Network Telemetry (INT) is an open specification from the P4 source community
    (1). The goal of INT is to collect and report packets through network telemetry.
    Work has been built for the open source community with Host Inband Network Telemetry
    (Host-INT). The Host-INT framework can collect various variables of network –
    such as latency and packet drops – that would be hard to obtain. Host-INT is ideal
    for developers who need to know the network''s impact on an application. For example,
    WAN service providers could use Host-INT to ensure their service agreements are
    met.


    The Host-INT specification describes several options for collecting additional
    metadata from packet headers in order to measure latency, depth of packets that
    are then read by another packet, and link utilization.


    # How Host-INT Works


    Host-INT is implemented in the Linux kernel, not in the switches, and it looks
    out at packets from the network source. The INT source, located at the network
    ingress, inserts statistics and network information into the packet. The INT sink,
    located at the network egress, extracts header and metadata and sends it to the
    collector


    After installing and enabling Host-INT on Linux (check the GitHub page for supported
    Linux distribution and versions), INT headers are added to IPv4 TCP and UDP packets
    that are then read by another Host-INT enabled on the host. For example, if you
    use Host-INT on host a and Host-INT headers, a Berkeley Packet Filter (ebpf) program
    sent from host a will be loaded into the Linux kernel on host b.


    The Host-INT configuration consists of a source host, where packets are modified
    to include telemetry information, and a sink host, where metadata is extracted
    and reported to an analytics engine (1). The result is that Host-INT is able to
    collect detailed-performance data. By using eBPF, users can also study the impact
    of the network on their application’ – performance and get much more detailed
    information than would be available using conventional tools.


    The Host-INT contains:


    +   - A sequence number that starts at 1 for the first packet of each flow and
    increments for each subsequent packet of the flow

    - IPv4 source and destination address

    - IPv4 protocol

    - TCP/UDP source and destination

    The packet encapsulation format used in Host-INT''s initial release is to add
    the headers after the packet''s TCP


    Host-INT builds on Switch-INT, another hardware-based implementation that performs
    measurements on network packets. Host-INT and Switch-INT are designed to operate
    in the data plane of a network device (e.g., in the hardware path of a switch
    or ASIC or Ethernet network adapter). Switch-INT is


    Also, organizations that depend on large WANs can use the telemetry and packet
    drop data that comes from Host-INT to ensure service levels and hold service providers
    to minimize repair time.


