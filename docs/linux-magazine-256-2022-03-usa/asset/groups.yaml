    - 本地支持


    ## 面向色彩


    亲爱的读者：


    最近，colors.js 代码转换库的用户们非常惊讶，因为他们的打印机开始打印“Liberty Liberty...”，然后开始在无限循环中扩散随机字符。打印页的怪异外观让用户怀疑是否有破坏者入侵了源代码，或者这个漏洞要大得多。事实证明，colors.js
    和 faker.js 库是自己破坏了代码。Mark Squad 显然对那些使用他们的代码却不提供贡献也不提供报酬的大公司感到幻灭。在 2020 年 11 月，他在
    faker.js 的 GitHub 页面上写道：“遗憾地，我将不再通过我的免费工作来提供你们的支持。没什么可说的了。把这视为修复年度合同或该项目的机会，并交给别人吧。”


    当时还并不清楚故事将如何结束。现在我们都知道了。


    此外，colors.js 和 faker.js 是独立项目，很大程度上由一名志愿者监督，它们在世界上拥有相当大的影响力。据报告显示，colors.js 每周获得
    200 万次下载，并被商业用户（包括 Amazon Cloud Development Kit）集成到许多开源工具中。


    这类故事总是让我们想要在“有者与无所有者”或“商业”与“其他人”的辩论中选择站队。假设自由软件为它们所有的自由提供了商业用途可能并不准确，除非自由软件声明不容忍对代码使用方式的任何限制（只要保持免费即可），而且
    GNU.org 明确表示，禁止商业用途只是对自由的另一种限制。


    自由软件的早期先驱之一并不在乎别人是否变得富有，因为他们完全相信富有并不是他们想要的全部。他们想要为自由软件建立一种独立于财富的身份，对他们来说，最好的方法是确保这不限制财富，而是对其不予关心。当然，他们那时还年轻。作为志愿者，当他们需要开始为孩子支付抵押贷款和大学学费时，而看到一家大公司从这些工作中获取价值时，这种纯粹为了快乐而做贡献的想法是非常令人不安的。


    我理解为什么开发者准备停止免费提供他的工作——尤其是当许多像 Amazon 这样的供应商使用他的工作却不向他推销或报酬他。然而，这种戏剧性退出的问题在于，它迎合了那些将自由软件神化为无法无政府主义者乐场的人，而这些人无法被信任处理真实的业务。我可以想象微软现在有多生气，正展示如何将此融入他们的推销中。


    请注意，这与 Linux 无关——至少它们是跨平台的，但从长远来看，这种戏剧性的抗议对开源开发模型没有好处，这意味着它不适合 Linux 社区。


    独立的开源项目经常会耗尽，理想情况下，项目内部会有可用资源进行有序过渡。然而，许多项目太小或碎片化，无法提供所需的连续性。这个案例中引人注目的是 Squad
    需要所有的薪水，否则就需要其他人接手。我们本该听听这些声音的。


    '
