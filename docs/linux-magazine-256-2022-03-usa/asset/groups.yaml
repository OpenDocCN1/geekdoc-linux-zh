    Then you copied the desired device, including the path to the configuration.


    For face recognition OpenCV, it does not matter whether the camera delivers monochrome
    or color images or IR. For this reason, standard laptop webcam is suitable for
    identification, unless you need genuine security.


    The snapshots in the last part of the configuration file are also important. This
    section is where you specify whether Howdy saves an image at the time of login
    (lines 19 and 25). These snapshots help analyze problems if face recognition did
    not work. Some can tell you if the image is dark, if a reflection blinded the
    camera, or if you moved too much.


    ## PAM Authentication


    To enable Howdy, you must manually edit the PAM configuration files in the /etc/pam.d/
    directory. The data in these files determines where Howdy is used.


    > Listing 2: Howdy Integration


    ```

    auth sufficient pam_python.so /lib/security/howdy/pam.py

    ```


    ## Table 3: PAM Files


    | File | Function |

    | --- | --- |

    | sudo | Controls access to the file of the same name |

    | system-login | Active for each login |

    | system-local-login | Active for local login |

    | Prefix user | Active for user management |

    | Prefix group | Active for user management |

    | Prefix | Active when editing permissions and owners |


    contains at least the files described in Table 3 – and often many more.


    To always authenticate with Howdy, first add the line from listing 2 at the beginning
    of the appropriate files. Listing 2 shows you the Python pam.py from the howdy
    package is used in logging and how such authentication is it (key=sufficient).
    If the check fails, PAM starts the next module in the file.


    ## Setup and Training


    After the installation, Howdy configuration involves two steps. The first step
    is the system recognizes the faces in the input data, without disturbing them.
    Differentiating them requires two people separating in the stream.


    In this training, the neural network learns specific features that represent the
    user''s face. Since Howdy does not just list images from the video stream, but
    short sequences, it is usually not a problem if you blink freely or move your
    head a bit. In fact, such slight movements may take several repetitions to improve
    recognition in real-use. It takes time to build solid bases in the system.


    After configuring and training, a third step is test: Use the command that displays
    the video from the first line of Listing 3 to show a mode displays in a new window.
    The goal is not to identify a specific face, but to recognize a generic face.
    If successful, OpenCV marks the face with a red circle (Figure 2). You can test
    whether the lighting conditions are sufficient, and no disturbing reflections.
    Pressing the Enter key opens and exits the program.


    Alternatively, you can take the snapshot command, which Howdy captures as images
    that you save. This option is useful if the program does not recognize faces in
    test mode. Howdy saves the snapshots, which are all black and white, in the current
    directory.


