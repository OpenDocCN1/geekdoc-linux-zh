    other methods it can detect all packets that were dropped


    When packets arrive at host B, an ebpf program running in host B''s kernel processes
    it. If the packet has INT header (with the DSP value), it sends it to the Linux
    networking code, where it will then proceed to be processed.


    Before the INT header, host B calculates the latency of the packet, calculated
    as the time B when the packet was received, minus the timestamp that host A sent
    in the INT header. There is some inaccuracy in the synchronization of the clocks,
    and host B introduces an error into this latency measurement. It is recommended
    to use Network Time Protocol (NTP) or Precision Time Protocol (PTP) to synchronize
    the clocks on the devices.


    Host B''s ebpf program looks up the packet''s flow (determined by the 5-tuple
    header used at the source A) in an ebpf map. For the packets that host B receives
    with INT headers, it checks the following:


    +   - The last time a packet was received

    - The one-way latency of the packet received by host B for this flow.

    - A data structure is used, in combination with the


