    ## Linux Mint 20.3 现已


    流行的 Linux Mint 用户可以通过下载新版本 20.3（https://www.linuxmint.com/download_all.php）来庆祝新发布。此最新迭代基于
    Ubuntu 20.04.5 LTS。虽然它没有任何改变规则的新功能，但它提供了许多微妙的 UI 调整和一个非常实用的文档应用。


    在打磨方面，默认的 Mint 不再那么依赖颜色主题，而是包含了更大的标题、更大的控制控件和圆角。许多默认应用也默认使用了洗练的主题。


    一些改进包括：显示多个来源事件的日历工具、对 Nemo 文件管理器的一些微调（包括能够重命名移动或复制的文件而不是覆盖重复文件）、运行 deck 的新样式、Notes
    应用的重大更新（包括新的搜索功能）、Hypnot（Mint 的解释器）的频道搜索选项，以及在 Xed 编辑器中使用 Ctrl+Tab 快捷键切换标签的能力。


