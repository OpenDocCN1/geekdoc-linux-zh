    auth sufficient pam_python.so /lib/security/howdy/pam.py

    ```


    ## 表 3：PAM 文件


    | 文件 | 功能 |

    | --- | --- |

    | sudo | 控制对同名文件的访问 |

    | system-login | 每次登录时有效 |

    | system-local-login | 本地登录时有效 |

    | Prefix user | 用于用户管理时有效 |

    | Prefix group | 用于用户管理时有效 |

    | Prefix | 在编辑权限和所有者时有效 |


    至少包含表 3 中描述的文件——通常还包含更多。


