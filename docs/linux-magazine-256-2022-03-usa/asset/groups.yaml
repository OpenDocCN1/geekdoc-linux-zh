    ExifTool 时，你使用第 2 行的命令，然后用第 3 行的命令验证修改后的标签。如果你想在互联网上发布图像之前删除所有标签以保护隐私，请在以下位置输入第
    4 行的命令：


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_30_0.png)


    图 2：通过使用命令行，ExifTool 会详尽地列出元数据。


    然后你将在左侧窗格中看到其他元数据。点击关联元数据详情之一后，详细信息将在右侧面板的“查看数据”栏中显示（图 3）。使用“编辑”栏，你可以修改现有数据。编辑栏显示相应的数据，并让你快速访问数据。


    ## ExifTool GUI


    由于编辑操作的复杂性和元数据的数值庞大，ExifTool 需要较长的学习曲线。使用图形用户界面 (GUI) 编辑元数据会更快。这个基于 Java 的应用程序需要安装
    ExifTool 和版本 11 的 Java 运行时环境，可以从所有流行的发行版中轻松安装。在经过缓慢的启动后，ExifTool GUI 具有一个清晰的界面。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_30_1.png)


    图 3：ExifTool GUI 让用户能够在易于使用的 GUI 中查看和编辑元数据。


    ## ExifCleaner


    ExifCleaner 会打开一个带有空白区域的窗口。源代码在 GitHub 上可用。ExifCleaner 在加载后立即开始删除元数据。由于它不影响原始文件，删除的元数据将无法恢复。在选择和传输图像到
    ExifCleaner 时要小心以避免意外。与许多人的建议不同，ExifCleaner 不仅处理原生图像，还处理 AAC、MOV 和 MP4 等格式。此外，ExifCleaner
    会删除照片中除只读元数据（无法删除）之外的所有元数据。在 ExifTool 中删除现有元数据无需通过长而令人困惑的标签列表等：要正确操作，只需勾选复选框选择新值；默认情况下，ExifTool
    将清空所有框以进行保存。完成修改后，点击界面底部的“复制到图像”和保存按钮将更改应用于所选图像。随后，ExifTool 将这些更改传输到元数据清单中的正确位置。如有必要，你还可以点击相关对话框底部的编辑来编辑相应的标签。


    ## Jhead


    Jhead 是一个简单的命令行程序，用于修改 JPEG 文件中的头部。为了定义软件参数，Jhead 只能处理 JPEG；如果你在任何其他格式中调用它，将收到错误消息。要显示图像的元数据，请使用命令：


    ```

    jhead PARAMETER FILE

    jhead -all -set Artist="New Artist" image.jpg

    ```


    通过调用 `jhead -H` 可以显示单个参数。要更改目录中多个文件的 Exif 标签，你可以使用通配符指定文件，或者一次性使用 jhead 处理。进度条出现在窗口顶部。


    ## 元数据清理


    Metadata Cleaner 在一个现代且简洁的窗口中工作。它会建议备份副本，然后删除发现的所有元数据。它不会创建原始文件的副本，被删除的无法恢复。


    ![](img/16d3ffe65f48be3e33dacc00421acc6f_32_0.png)


    如果你点击左侧的图标，会打开一个小型对话框，你可以在其中通过滑动块开启超级清理。这可能不会移除元数据，但会尝试保留功能相关的元数据。Metadata Cleaner
    适用于 PDF 等格式，可能会导致 PDF 中的文本或图像压缩丢失。因此，你不应该删除这些格式的所有元数据。清理需要一些时间，取决于文件的数量。


    清理版通过 Nautilus 插件剥离元数据。只有少数发行版目前在其仓库中包含 Metadata Cleaner [10]。原生二进制文件适用于 Linux
    Arch。这个基于 GTK 的应用程序遵循 Gnome 原则，并将所有控件集成到标题栏中（图 8）。


    ## mat2


    这是一个从集合中移除元数据的经典工具，元数据注释工具 (mat2) [9] 仅支持图像和音频文件，但它也支持 PDF 和 Office 文件。mat2 为记者或律师等敏感领域的用户提供了特定的编辑功能。对于
    Nautilus 插件，你可以在命令行清理文件而无需知道语法。要这样做，只需选择要清理的文件并右键调用菜单，从中清除“移除元数据”选项。


    图 7：你可以使用 Nautilus 作为插件。


    应用程序在终端中列出 Exif 标签（图 6）。要通过软件支持的参数更改标签，请使用命令：


    ```

    jhead PARAMETER FILE

    jhead -all -set Artist="New Artist" image.jpg

    ```


    图 6：Jhead 删除或修改 JPEG 文件中的头部。


    ## Metadata Cleaner


    Metadata Cleaner 在一个现代且简洁的窗口中工作。它会建议备份副本，然后删除发现的所有元数据。


    '
