    Modbus with Node-RED

    Modbus [5] was the earliest and most common communication protocol to connect
    industrial devices together. Modbus can be used with serial interfaces (RTU) or
    Ethernet-based networks (Modbus TCP); both are supported by OpenPLC.


    Node-RED has a number of Modbus TCP nodes that can be used. If found node-red-modbustcp
    works well for my application. New nodes can be added to Node-RED from the Manage
    [palette] menu.


    A single OpenPLC runtime can monitor the LED and counter status using three `modbus`
    nodes, a text node, and two number dashboard nodes (9).


    Modbus supports four types of registers: input, discrete, holding, and exception
    registers (Figure 10). In this Node-RED application, I am using two types of Modbus
    objects: a single-digit (hex) LED and holding registers (16 bits).


    Modbus reads a hold and returns a value (integer, if requested); however, a Modbus
    register returns 16 bits of information, not the single bit of interest.


    To show the status on a Node-RED dashboard, a small function is needed (Only pass
    item 0) to send the message to the first item in the array:


