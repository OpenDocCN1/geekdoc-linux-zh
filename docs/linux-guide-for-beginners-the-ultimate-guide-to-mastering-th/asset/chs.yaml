  \n## 3.3 进程管理\n\n了解如何检索和解释系统信息对于管理 Linux 系统至关重要。系统信息命令帮助你理解硬件和软件环境、监控系统性能并排除故障。本节涵盖了获取你的\
  \ Linux 系统详细信息的常用命令。\n\n### 查看进程\n\n* `ps` (进程状态)\n\n`ps` 命令报告当前进程的快照。\n\n```bash\n\
  ps aux\n```\n\n* `top`\n\n`top` 命令显示系统进程、CPU 和内存使用的实时信息。\n\n```bash\ntop\n```\n\
  在 `top` 中，你可以按：\n* `k` 杀死进程\n* `r` 调整进程优先级\n* `q` 退出\n\n* `htop`\n\n`htop` 命令是一个交互式进程查看器，`top`\
  \ 的增强版本。\n\n```bash\nhtop\n```\n\n* `pgrep`\n\n`pgrep` 命令根据名称查找进程。\n\n```bash\n\
  pgrep process_name\n```\n\n### 进程\n\n* `kill`\n\n`kill` 命令向进程发送信号，通常用于终止进程。默认信号是\
  \ `SIGTERM` (15)，但可以指定其他信号。\n\n```bash\nkill PID # 向 SIGTERM (15) 进程\nkill -9 PID\
  \ # 向 SIGKILL (9) 强制终止进程\n```\n\n* `killall`\n\n`killall` 命令按名称杀死所有进程。\n\n```bash\n\
  killall process_name\n```\n\n* `pkill`\n\n`pkill` 命令按名称杀死进程。\n\n```bash\npkill process_name\n\
  ```\n\n* `xkill`\n\n`xkill` 命令通过点击来强制关闭图形化窗口。\n\n```bash\nxkill\n```\n\n### 管理进程优先级\n\
  \n* `nice`\n\n`nice` 命令以指定的优先级启动新进程。优先级范围从 -20（最高优先级）到 19（最低优先级）。\n\n```bash\nnice\
