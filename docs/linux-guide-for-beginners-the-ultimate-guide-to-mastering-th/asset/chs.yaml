  \n### `sar` (系统活动报告器)\n\n`sar` 命令收集、报告并保存系统活动信息。\n\n```\nsar\n```\n\n### `Free`\n\
  \n`free` 命令显示系统中空闲和已用内存量。\n\n```\nfree -h\n```\n\n## 高级进程管理\n\n### `Strace`\n\n\
  `strace` 命令跟踪系统调用和信号。它对于调试和故障排除非常有用。\n\n```\nstrace -p PID\n```\n\n### `lsof` (列出已打开的文件)\n\
