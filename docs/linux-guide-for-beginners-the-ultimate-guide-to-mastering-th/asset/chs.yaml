  \  ```\n  $ wget http://example.com/file.zip\n  ```\n\n## 7. 搜索与过滤\n\n* `grep`:\
  \ 在文件中搜索模式。\n  ```\n  $ grep 'search_term' file.txt\n  ```\n\n* `find`: 在目录树中搜索文件和目录。\n\
