    ## Common Terminal Commands


    ### Navigation

    - `pwd`: Prints the current working directory.

    ```bash

    $ pwd

    /home/user

    ```

    - `cd`: Changes the current directory.


    ```bash

    $ cd Documents

    ```


    ### File Operations

    - `ls`: Lists files and directories.


    ```bash

    $ ls -l

    ```

    - `cp`: Copies files or directories.


    ```bash

    $ cp source.txt destination.txt

    ```

    - `mv`: Moves or renames files or directories.


    ```bash

    $ mv oldname.txt newname.txt

    ```

    - `rm`: Removes files or directories.


    ```bash

    $ rm file.txt

    ```


    ### Viewing and Editing Files

    - `cat`: Concatenates and displays file contents.


    ```bash

    $ cat file.txt

    ```

    - `less`: Views file contents one page at a time.


    ```bash

    $ less file.txt

    ```

    - `nano`: Edits files within the terminal.


    ```bash

    $ nano file.txt

    ```

    - `vim`: Advanced text editor.


    ```bash

    $ vim file.txt

    ```


    ### System Information

    - `uname -a`: Displays system information.


    ```bash

    $ uname -a

    ```

    - `top`: Shows real-time system processes and resource usage.


    ```bash

    $ top

    ```


    ### Networking

    - `ping`: Tests connectivity to another host.


    ```bash

    $ ping google.com

    ```

    - `ifconfig` / `ip`: Configures network interfaces.


    ```bash

    $ ifconfig

    $ ip addr show

    ```


    ## Command Shortcuts and History

    - **Tab Completion**: Pressing `Tab` while typing a command or file name will
    auto-complete it if there is a unique match. This can save time and reduce errors.

    - **Command History**: The terminal keeps a history of commands you''ve entered.
    Use the Up and Down arrow keys to navigate through previous commands.

    - `history` Command: Displays a list of previously executed commands.


    ```bash

    $ history

    ```


    ## Redirection and Piping

    - **Redirection**: Redirects the output of a command to a file.


    ```bash

    $ ls -l > filelist.txt

    ```

    - **Appending**: Appends the output of a command to a file.


    ```bash

    $ echo "New line" >> file.txt

    ```

    - **Piping**: Uses the output of one command as the input for another command.


    ```bash

    $ ls -l | less

    ```


    ## Permissions and Superuser

    - **File Permissions**: Use `chmod` to change file permissions and `chown` to
    change file ownership.


    ```bash

    $ chmod 755 script.sh

    $ sudo chown user:group file.txt

    ```

    - **Superuser (Root)**: Some commands require superuser privileges. Use `sudo`
    to execute a command with superuser rights.


    ```bash

    $ sudo apt update

    ```


    Mastering the terminal is a valuable skill for any Linux user. It provides unparalleled
    control over your system, allowing you to perform complex tasks efficiently. By
    understanding the basic concepts, commands, and features of the terminal, you
    can harness the full power of Linux and streamline your workflow. As you gain
    more experience, you can explore advanced shell scripting and automation to further
    enhance your capabilities.


    ## 2.5 Customizing Your Linux Environment


    Customizing your Linux environment allows you to tailor your system to meet your
    specific needs and preferences, enhancing productivity and creating a more enjoyable
    user experience. This section covers various aspects of customization, including
    the desktop environment, terminal settings, and system behavior.


    ### Customizing the Desktop Environment

    The desktop environment (DE) in Linux provides the graphical interface you interact
    with daily. Popular DEs like `GNOME`, `KDE Plasma`, `XFCE`, and `Cinnamon` offer
    various customization options.


    ### Customizing the Terminal

    The terminal is a powerful tool, but its appearance and functionality can be greatly
    improved.


    #### Changing the Shell

    The default shell is often `Bash`, but many users switch to `Zsh` for more features.


    ```bash

    chsh -s $(which zsh)

    ```


    #### Personalizing the Prompt

    The prompt displays information like the username, host name, and current directory.
    You can customize this in your `.bashrc` or `.zshrc` files.


    ```bash

    PS1=''\u@\h:\w\$ ''

    ```


    #### Using Terminal Emulators

    Different terminal emulators offer various features. For example, `Tilix` supports
    multiple panes, while `Alacritty` focuses on speed.


    #### Installing Plugins and Extensions

    Tools like `oh-my-zsh` provide themes and plugins that enhance your experience.


    ```bash

    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"

    ```


    #### Themes

    Change the visual theme of your terminal to improve its aesthetic.


    ```bash

    ZSH_THEME="agnoster"

    ```


    ### Customizing System Behavior

    Beyond the graphical interface and terminal, you can also customize how your system
    behaves.


    #### Startup Applications

    Configure applications to start automatically when you log in. This can be done
    through the startup settings in your DE.


    #### Keyboard Shortcuts

    Customizing keyboard shortcuts can significantly enhance your productivity. Most
    DEs provide a menu for managing shortcuts.


    #### Automating Tasks with Cron

    Use the cron daemon to schedule tasks and automate repetitive jobs. Edit the cron
    table with `crontab -e` and add entries in the format:


    ```

    * * * * * /path/to/command

    ```

