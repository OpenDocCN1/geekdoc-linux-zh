    Paths specify the location of files and directories. They can be absolute or relative:


    *   Absolute Path


    Specifies the complete path from the root directory.


    /home/user/documents/file.txt


    *   Relative Path


    Specifies the path relative to the current directory.


    documents/file.txt


    4.  File Permissions


    Linux file permissions determine who can read, write, or execute a file. Permissions
    are represented by a combination of characters and octal numbers:


    Permission Characters


    *   r (read)


    *   w (write)


    *   x (execute)


    -         (no permission)


    Permission Groups


    *   User (u): The file owner


    *   Group (g): The file’s group


    *   Others (o): All other users


    Viewing Permissions


    $ ls -l filename


    Changing Permissions


    chmod: Changes file permissions


    $ chmod 755 filename           # Sets permissions to rwxr-xr-x


    $ chmod u+w filename           # Adds write permission for the user


    $ chmod g-r filename           # Removes read permission for the group


    Changing Ownership


    chown: Changes file ownership


    $ sudo chown user:group filename


    5.  Basic File Management


    Managing files and directories is fundamental to using Linux effectively. Key
    commands include:


    *   cp (Copy)


    Copies files and directories.


    $ cp source destination             # Copies a file


    $ cp -r source_directory destination_directory  # Copies a directory recursively


    *   mv (Move)


    Moves or renames files and directories.


    $ mv oldname newname                # Renames a file or directory


    $ mv file /new/path/                # Moves a file to a new location


    *   rm (Remove)


    Deletes files and directories.


    $ rm filename                       # Removes a file


    $ rm -r directory                   # Removes a directory and its contents


    $ rm -i filename                    # Prompts before removing a file


    *   mkdir (Make Directory)


    Creates new directories.


    $ mkdir new_directory               # Creates a new directory


    $ mkdir -p /path/to/new_directory   # Creates parent directories as needed


    *   rmdir (Remove Directory)


    Removes empty directories.


    $ rmdir empty_directory             # Removes an empty directory


    *   Touch


    Creates an empty file or updates the timestamp of an existing file.


    $ touch newfile                     # Creates a new empty file


    Navigating the Linux file system efficiently is a foundational skill for users
    and administrators. Understanding the directory structure, mastering navigation
    commands, managing file permissions, and performing basic file management tasks
    are essential for effective system use. With these skills, you can efficiently
    locate, manage, and secure your data within the Linux environment.


    ## 4.1 Understanding the File System Hierarchy


    The Linux file system hierarchy is designed to organize and manage files and directories
    efficiently. This hierarchical structure, often referred to as the directory tree,
    starts from the root directory and branches out into various subdirectories, each
    serving a specific purpose. Understanding this hierarchy is essential for navigating,
    managing, and maintaining a Linux system.


