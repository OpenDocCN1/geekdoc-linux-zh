    - **Shell**: Shell 是用于解释并执行你在终端中输入的命令的程序。常见的 Shell 有 `Bash` (Bourne Again SHell)、`Zsh`
    (Z Shell) 和 `Fish` (Friendly Interactive SHell)。


    ## 常用终端命令


    ### 导航

    - `pwd`: 打印当前工作目录。

    ```bash

    $ pwd

    /home/user

    ```

    - `cd`: 切换目录。


    ```bash

    $ cd Documents

    ```


    ### 文件操作

    - `ls`: 列出文件和目录。


    ```bash

    $ ls -l

    ```

    - `cp`: 拷贝文件或目录。


    ```bash

    $ cp source.txt destination.txt

    ```

    - `mv`: 移动或重命名文件或目录。


    ```bash

    $ mv oldname.txt newname.txt

    ```

    - `rm`: 删除文件或目录。


    ```bash

    $ rm file.txt

    ```


    ### 查看与编辑文件

    - `cat`: 合并并显示文件内容。


    ```bash

    $ cat file.txt

    ```

    - `less`: 逐页查看文件内容。


    ```bash

    $ less file.txt

    ```

    - `nano`: 在终端内编辑文件。


    ```bash

    $ nano file.txt

    ```

    - `vim`: 高级文本编辑器。


    ```bash

    $ vim file.txt

    ```


    ### 系统信息

    - `uname -a`: 显示系统信息。


    ```bash

    $ uname -a

    ```

    - `top`: 显示实时系统进程和资源占用。


    ```bash

    $ top

    ```


    ### 网络

    - `ping`: 测试与另一个主机的连接性。


    ```bash

    $ ping google.com

    ```

    - `ifconfig` / `ip`: 配置网络接口。


    ```bash

    $ ifconfig

    $ ip addr show

    ```


    ## 命令快捷键与历史记录

    - **Tab 自动补全**: 在输入命令或文件名时按下 `Tab` 键，如果有唯一匹配项，将会自动补全。这可以节省时间并减少错误。

    - **命令历史**: 终端会保存你输入的命令历史。使用向上和向下方向键可以浏览之前的命令。

    - `history` 命令: 显示之前执行过的命令列表。


    ```bash

    $ history

    ```


    ## 重定向与管道

    - **重定向**: 将命令的输出重定向到文件。


    ```bash

    $ ls -l > filelist.txt

    ```

    - **追加**: 将命令的输出追加到文件。


    ```bash

    $ echo "New line" >> file.txt

    ```

    - **管道**: 将一个命令的输出作为另一个命令的输入。


    ```bash

    $ ls -l | less

    ```


    ## 权限与超级用户

    - **文件权限**: 使用 `chmod` 修改文件权限，使用 `chown` 更改文件所有者。


    ```bash

    $ chmod 755 script.sh

    $ sudo chown user:group file.txt

    ```

    - **超级用户 (Root)**:某些命令需要超级用户权限。使用 `sudo` 以超级用户权限执行命令。


    ```bash

    $ sudo apt update

    ```


    精通终端对于任何 Linux 用户来说都是一项非常有价值的技能。它对你的系统提供了无与伦比的控制，让你能够高效地完成复杂任务。通过理解终端的基本概念、命令和功能，你可以充分利用
    Linux 并简化工作流。随着经验的增加，你可以探索高级 Shell 脚本和自动化，以进一步增强你的能力。


    ## 2.5 定制你的 Linux 环境


    定制你的 Linux 环境允许你根据特定的需求和偏好来调整系统，提高效率并创造更愉快的用户体验。本节涵盖了定制的各个方面，包括桌面环境、终端设置和系统行为。


    ### 定制桌面环境

    Linux 中的桌面环境 (DE)提供了你每天交互的图形界面。流行的 DE 如 `GNOME`、`KDE Plasma`、`XFCE` 和 `Cinnamon`
    提供了自定义选项。


    ### 定制终端

    终端是一个强大的工具，但它的外观和功能可以大大改进。


    #### 更改 Shell

    默认 Shell 通常是 `Bash`，但许多用户切换到 `Zsh` 以获得更多功能。


    ```bash

    chsh -s $(which zsh)

    ```


    #### 个化提示符

    提示符显示用户名、主机名和当前目录等信息。你可以在 `.bashrc` 或 `.zshrc` 文件中进行自定义。


    ```bash

    PS1=''\u@\h:\w\$ ''

    ```


    #### 使用终端模拟器

    不同的终端模拟器提供不同的功能。例如 `Tilix` 支持多窗格，而 `Alacritty` 专注于速度。


    #### 安装插件和扩展

    像 `oh-my-zsh` 等工具提供了增强体验的主题和插件。


    ```bash

    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"

    ```


    #### 主题

    更改终端的视觉主题以提升其美感。


    ```bash

    ZSH_THEME="agnoster"

    ```


    ### 定制系统行为

    除了图形界面和终端，你还可以定制系统的运行方式。


    #### 启动应用程序

    配置应用程序在登录时自动启动。这可以通过 DE 中的启动设置来实现。


    #### 键盘快捷键

    自定义键盘快捷键可以显著提高你的效率。大多数 DE 都提供管理快捷键的菜单。


    #### 使用 Cron 自动化任务

    使用 cron 守护进程调度任务并自动化重复性工作。使用 `crontab -e` 编辑 cron 表并按格式添加条目：


    ```

    * * * * * /path/to/command

    ```


