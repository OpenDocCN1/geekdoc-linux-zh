    根目录由单个正斜杠 (`/`) 表示，是 Linux 文件系统的顶层目录。所有其他目录和文件都源于根目录。它是文件系统树的起点，包含了系统正常运行所需的关键系统目录。


    ## 根目录下的关键目录


    ### /bin

    `/bin` 目录包含基本的用户命令二进制文件（可执行文件），系统启动和在单用户模式下运行时需要。例如 `ls`、`cp`、`mv`、`rm` 和 `bash`。


    ### /boot

    `/boot` 目录存放系统启动过程所需的文件，包括 Linux 内内核、初始 RAM 磁盘 (`initrd`) 以及如 `grub.cfg` 等启动加载器配置文件。


    ### /dev

    `/dev` 目录包含设备文件，代表硬件设备如硬盘、光驱驱动器和外围设备。例如代表第一个硬盘的 `sda` 和代表终端设备的 `tty`。


    ### /etc

    `/etc` 目录包含系统级配置文件和用于初始化系统设置及服务的 shell 脚本。例如 `passwd`、`fstab` 和网络配置文件。


    ### /home

    `/home` 目录是用户主目录的默认位置。每个用户在 `/home` 下都有一个子目录，例如 `/home/username`，存储个人文件、设置和数据。


    ### /lib

    `/lib` 目录包含 `/bin` 和 `/sbin` 中二进制文件所需的共享库文件。这些库对于系统启动和运行至关重要。


    ### /media

    `/media` 目录作为可移动介质（如 USB 驱动、CD 和 DVD）的挂载点。当插入可移动设备时，它通常会被挂载到 `/media` 下的子目录。


    ### /mnt

    `/mnt` 目录是一个临时挂载点，管理员可以在此处手动挂载文件系统以系统维护或临时访问。


    ### /opt

    `/opt` 目录用于安装可选软件包。在此安装的应用通常是自包含的，不会干扰系统的其他部分。


    ### /proc

    `/proc` 目录是一个虚拟文件系统，提供了运行系统的视图。它以分级文件格式包含系统进程和硬件信息。例如 `/proc/cpuinfo` 和 `/proc/meminfo`。


    ### /root

    `/root` 目录是 root 用户（系统的管理员超级用户）的主目录。它与 `/home` 分离，以确保 root 的环境始终可访问。


    ### /sbin

    `/sbin` 目录包含用于系统管理任务的基本二进制文件。这些二进制文件通常由 root 用户使用，包括 `ifconfig`、`fdisk` 和 `reboot`
    等命令。


    ### /srv

    `/srv` 目录包含系统提供的服务数据，例如 Web 服务器和 FTP 服务器。该目录存放系统提供的特定站点数据。


    ### /tmp

    `/tmp` 目录用于用户和应用程序创建临时文件。`/tmp` 的内容通常在系统启动时清除以释放空间。


    ### /usr

    `/usr` 目录是最大的目录之一，包含用户应用程序和文件。它包括子目录，如 `/usr/bin`（用户二进制文件）、`/usr/lib`（库）、`/usr/share`（共享数据）和
    `/usr/local`（本地编译软件）。


    ### /var

    `/var` 目录存放在系统运行期间频繁变化的变量数据文件。这包括日志文件 (`/var/log`)、邮件和池目录 (`/var/mail`) 以及临时文件
    (`/var/tmp`)。


    理解 Linux 文件系统的层级结构对于有效的系统管理和使用至关重要。每个目录都有其特定用途，确保系统组织良好并高效运行。通过熟悉这些目录及其内容，你可以自如地导航
    Linux 文件系统，执行管理任务并有效地管理文件和应用程序。这种层级结构不仅保持了系统的组织条理，还有助于维护安全性和稳定性。


    ## 4.2 目录导航


    在 Linux 中导航目录是与文件系统交互的基础。它涉及在目录之间移动、列出内容以及理解路径的工作原理。本节涵盖了在 Linux 环境中有效导航目录的基本命令和技术。


    ### 1. pwd - 打印工作目录

    `pwd` 命令显示当前工作目录，显示从根目录开始的全路径。


    ```bash

    $ pwd

    /home/user

    ```


    ### 2. ls - 列出目录内容

    `ls` 命令列出目录的内容，提供当前目录内文件和目录的信息。


    ```bash

    $ ls              # 列出文件和目录

    $ ls -l           # 详细列表，包含权限、所有者、大小和修改日期

    $ ls -a           # 隐藏文件和目录（以 . 开头的文件）

    $ ls -lh          # 以人类易读的格式显示文件大小

    ```


    ### 3. cd - 切换目录

    `cd` 命令将当前工作目录更改为指定的目录。


    ```bash

    $ cd /path/to/directory  # 切换到绝对路径

    $ cd ..                 # 移动到上一级

    $ cd                     # 切换到主目录

    $ cd -                   # 切换到上一个目录

    ```


    ### 4. 绝对路径和相对路径

    **绝对路径**：指定从根目录的完整路径。

    ```bash

    $ cd /home/user/documents

    ```

    **相对路径**：相对于当前目录指定的路径。

    ```bash

    $ cd documents

    ```


    ### 5. 特殊目录

    .(当前目录)：代表当前目录。

    .. (父目录)：代表父目录。


    ### 6. Tab 补全

    Tab 补全是 Linux 中一个实用的功能，允许你通过按 Tab 键自动补全目录和文件名。它可以节省时间并减少错误。


    ### 7. 使用 ~

    波浪 `~` 代表当前用户的主目录。它可以作为快捷方式快速导航到主目录。


    ```bash

    $ cd ~/documents

    ```


    ### 8. 示例命令

    进入目录并列出内容：

    ```bash

    $ cd /var/log

    $ ls

    ```


    掌握目录导航是高效使用命令行的关键。通过理解如何使用 `cd` 导航、使用 `ls` 列出以及使用绝对或相对路径，你可以有效地遍历目录、访问文件并执行命令。这些技能对于日常任务和系统管理都是基础。


    ## 4.3 文件和目录权限


    在 Linux 中，文件和目录权限决定了谁可以读、写或执行文件和目录。理解和管理这些权限对于系统安全数据完整性至关重要。本节介绍了权限如何工作、如何查看以及如何修改。


    ### 理解文件和目录权限

    Linux 使用基于三种实体的权限系统：


    - **用户 (User)**：所有者。

    - **组 (Group)**：共享相同权限的用户组。

    - **其他 (Others)**：所有不是所有者也不是组组成的用户。


    字符和进制数字表示权限：


    - `r`：读取权限（进制为 4）。

    - `w`：写入权限（进制为 2）。

    - `x`：执行权限（进制为 1）。

    - `-`：无权限。


    权限分为三组：


    - **所有者权限**：适用于拥有文件的用户。

    - **组权限**：适用于属于文件所在组的用户。

    - **其他权限**：适用于系统上的所有其他用户。


    ### 查看权限

    要查看文件和目录的权限，请使用 `ls` 命令配合 `-l` 选项：


    ```bash

    $ ls -l

    ```


    输出将显示权限以及其他文件元数据，如所有者、组、大小、修改时间和文件名。


