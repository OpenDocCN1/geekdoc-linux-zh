    ## 3.4 Network Management Commands


    Network management is a crucial aspect of administering a Linux system, encompassing
    tasks such as configuring network interfaces, monitoring network activity, diagnosing
    connectivity issues, and managing network services. This section covers essential
    commands for managing network settings and troubleshooting network-related problems.


    ### Viewing and Configuring Network Interfaces


    ### `Ifconfig`


    The `ifconfig` command displays and configures network interfaces. Note that `ifconfig`
    is deprecated in favor of `ip` but is still widely used.


    ```bash

    ifconfig      # Display all active network interfaces

    ifconfig eth0   # Display details for eth0

    ifconfig eth0 down   # Disable eth0

    ifconfig eth0 up      # Enable eth0

    ```


    ### `Ip`


    The `ip` command is a more powerful and versatile tool for network management,
    replacing `ifconfig`.


    ```bash

    ip addr show            # Display all network interfaces and their IP addresses

    ip link set eth0 down   # Disable eth0

    ip link set eth0 up      # Enable eth0

    ip addr add 192.168.1.100/24 dev eth0  # Assign IP address to eth0

    ```


    ### Network Configuration


    ### `Nmcli`


    The `nmcli` command is used for managing `NetworkManager` and its network connections.


    ```bash

    nmcli dev status            # Show device status

    nmcli con show              # Show available connections

    nmcli con up id "MyConnection"     # Activate a connection

    nmcli con down id "MyConnection"  # Deactivate a connection

    ```


    ### `Nmtui`


    The `nmtui` command provides a text user interface for `NetworkManager`.


    ```

    nmtui

    ```


    ### Network Monitoring


    ### `Netstat`


    The `netstat` command displays network connections, routing tables, interface
    statistics, masquerade connections, and multicast memberships. `netstat` is deprecated
    in favor of `ss`.


    ```bash

    netstat -tuln      # Display listening sockets

    netstat -i        # Display network interfaces

    ```


    ### `Ss`


    The `ss` command is used to display socket statistics and is a replacement for
    `netstat`.


    ```bash

    ss -tuln          # Display listening sockets

    ss -s            # Display summary statistics

    ```


    ### `Iftop`


    The `iftop` command displays bandwidth usage on an interface by host.


    ```bash

    sudo iftop -i eth0

    ```


    ### `Nload`


    The `nload` command visualizes network traffic and bandwidth usage in real-time.


    ```

    nload

    ```


    ### Network Diagnostics


    ### `Ping`


    The `ping` command checks connectivity to a host by sending ICMP echo requests
    and measuring response times.


    ```

    ping example.com

    ```


    ### `Traceroute`


    The `traceroute` command traces the path that packets take to a network host,
    showing each hop along the route.


    ```

    traceroute example.com

    ```


    ### `mtr` (My Traceroute)


    The `mtr` command combines the functionality of `ping` and `traceroute` in a single
    network diagnostic tool.


    ```

    mtr example.com

    ```


    ### `dig` (Domain Information Groper)


    The `dig` command queries DNS servers for information about domain names.


    ```

    dig example.com

    ```


    ### `Nslookup`


    The `nslookup` command queries DNS to obtain domain name or IP address mapping.


    ```

    nslookup example.com

    ```


    ### Network Services


    ### `Systemctl`


    The `systemctl` command manages `systemd` services, including network services.


    ```bash

    systemctl status network.service    # Check the status of the network service

    systemctl restart network.service  # Restart the network service

    ```


    ### `Service`


    The `service` command can also manage services, including legacy init scripts.


    ```bash

    service network status

    ```


    ### Firewall Management


    ### `Iptables`


    The `iptables` command manages filtering rules.


    ```bash

    sudo iptables -L

    sudo iptables -A INPUT -p tcp --dport 80

    ```


    ### `Ufw` (Uncomplicated Firewall)


    The `ufw` command provides an easier interface for `iptables`.


    ```bash

    sudo ufw status

    sudo ufw enable

    sudo ufw allow 22

    ```


    ### Packet Analysis


    ### `Tcpdump`


    The `tcpdump` command captures packets.


    ```bash

    sudo tcpdump -i eth0

    ```


    ### `Wireshark`


    The `wireshark` tool is a graphical analyzer.


    ```bash

    wireshark

    ```


    ## 3.5 Disk Usage Commands


    Managing disk usage is crucial for maintaining a healthy Linux system.


    ### Displaying Disk Usage


    ### `df` (Disk Free)


    The `df` command displays the amount of disk space used and available on mounted
    filesystems.


    ```bash

    df -h

    df -Th

    df -i

    ```


    ### `du` (Disk Usage)


    The `du` command estimates file and directory usage.


    ```bash

    du -h /path/to/directory

    du -sh /path/to/directory

    du -ah /path/to/directory

    du -ch /path/to/directory

    ```


    ### `ncdu` (NCurses Disk Usage)


    The `ncdu` command provides an interactive interface to explore disk usage.


    ```

    ncdu /path/to/directory

    ```


    ### Checking Disk Space


    ### `ls` (List)


    The `ls` command can display file sizes in a human-readable format.


    ```bash

    ls -lh

    ls -lSh

    ```


    ### `Find`


    The `find` command can locate large files within the filesystem.


    ```bash

    find /path/to/search -type f -size +100M

    ```


    ### `lsof` (List Open Files)


    The `lsof` command lists information about files opened by processes, which can
    be useful for identifying large or numerous open files.


    ```bash

    lsof +D /path/to/directory

    ```


    ### Managing Disk Partitions


    ### `Fdisk`


    The `fdisk` command is a partitioning tool for managing disk partitions.


    ```bash

    sudo fdisk -l

    sudo fdisk /dev/sdX

    ```


