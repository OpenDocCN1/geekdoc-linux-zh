    * `/tmp`: 应用程序创建的临时文件目录。这些文件通常在系统重启时被清除。

    * `/usr`: 包含用户实用程序应用程序。子目录包括 `/usr/bin`（用户二进制文件）、`/usr/lib`（库文件）和 `/usr/share`（共享数据）。

    * `/var`: 存储在系统运行期间频繁变化的变量数据，例如日志、打印队列和缓存。关键子目录包括 `/var/log` 和 `/var/spool`。


    ## 文件系统类型


    Linux 支持多种文件系统类型，每种类型都有特定的特性和用场景：


    * `Ext4`（第四代扩展文件系统）：许多 Linux 发行版的默认文件系统。它提供了良好的性能、可靠性以及日志记录等功能，有助于防止数据损坏。

    * `XFS`：以其高性能和可扩展性著称，通常用于企业级环境和大型存储系统。

    * `Btrfs`（B-树文件系统）：为快照、子卷和多设备池等高级功能而设计。Btrfs 旨在增强数据完整性和可扩展性。

    * `FAT32` 和 `NTFS`：通常用于与 Windows 系统兼容。FAT32 适用于较小的分区和 USB 驱动器，而 NTFS 更适合较大的分区并支持更高级的功能。


    ## 权限与所有权


    Linux 采用稳健的权限和所有权模型来保护文件和目录。每个文件或目录都有一个所有者（用户）、一个组以及三类对象的权限设置：所有者、组和其他。权限包括读 (r)、写
    (w) 和执行 (x)，它们决定了允许的访问级别。


    例如，权限为 `rwxr-xr--` 的文件允许所有者读取、写入和执行，组读取并执行，其他人只能读取。


    ## 挂载与卸载


    挂载将文件系统集成到现有的目录结构中，使其系统可以访问`/etc/fstab` 文件包含了启动时自动挂载的配置。`mount` 命令也可手动挂载文件系统，而
    `umount` 命令用于卸载它们。


    Linux 文件系统是一个复杂且灵活的结构，在高效组织数据的同时，提供了强大的安全性和访问控制。理解其层次结构、关键目录、文件系统类型、权限和挂载过程是有效使用和管理
    Linux 系统的基础。这些知识为进一步探索和精通 Linux 管理奠定了基础。


    ## 2.3 基础 Linux 命令


    使用命令行是处理 Linux 的基本方面。终端提供了强大的工具，用于管理系统、自动化任务以及访问大量的功能。本节介绍了一些每个用户都应该知道的最基础、最核心的
    Linux 命令。


    ### 遍历文件系统


    * `pwd`（打印工作目录）：显示当前目录路径。


    ```bash

    pwd

    /home/user

    ```


    * `ls`（列出）：列出当前目录下的文件和目录。


    ```bash

    ls

    Documents Downloads Music Pictures

    ```


    * `cd`（切换目录）：更改当前目录。


    ```bash

    cd Documents

    pwd

    /home/user/Documents

    ```


    ### 文件和目录操作


    * `mkdir`（创建目录）：创建一个新目录。


    ```bash

    mkdir new_folder

    ```

    * `rmdir`（删除目录）：删除一个空目录。


    ```bash

    rmdir new_folder

    ```

    * `rm`（删除）：删除文件或目录。


    ```bash

    rm file.txt

    rm -r directory_name  # 删除目录及其内容

