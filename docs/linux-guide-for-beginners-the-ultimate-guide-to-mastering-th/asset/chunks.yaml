    - `Remote Backups`: Transferring backups securely over `SSH` or using cloud storage
    solutions (`AWS S3`, `Google Cloud Storage`).

    - `Disaster Recovery`: Planning and testing procedures to restore systems from
    backups in case of catastrophic failures.


