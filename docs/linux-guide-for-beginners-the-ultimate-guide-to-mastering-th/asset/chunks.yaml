- fmt: '

    Congratulations! You''ve just written and executed your first shell script.


    # Adding More Complexity


    Once you''re comfortable with the basics, you can start adding more complexity
    to your scripts. Here are a few examples of what you can do:


    ### Using Variables


    Variables store data that can be used and manipulated within a script. Here''s
    how to define and use a variable:


    ```bash

    #!/bin/bash


    # Define a variable

    greeting="Hello, World!"


    # Use the variable

    echo $greeting

    ```


    ### Reading User Input


    You can prompt the user for input and use that input in your script:


    ```bash

    #!/bin/bash


    # Prompt the user for input

    echo "Enter your name:"

    read name


    # Use the input

    echo "Hello, $name!"

    ```


    ### Conditional Statements


    Conditional statements allow your script to make decisions based on certain conditions:


    ```bash

    #!/bin/bash

    echo "Enter a number:"

    read num


    if [ $num -gt 10 ]; then

    echo "Number is greater than 10"

    else

    echo "Number is 10 or less"

    fi

    ```


    ### Loops


    Loops allow you to repeat a series of commands multiple times:


    ```bash

    #!/bin/bash

    for i in 1 2 3; do

    echo "Number: $i"

    done

    ```


    ### Functions


    Functions encapsulate a series of commands that can be reused throughout your
    script:


    ```bash

    #!/bin/bash

    function greet {

    echo "Hello, $1!"

    }

    greet "Alice"

    greet "Bob"

    ```


    Writing your first shell script is an essential step in becoming proficient with
    Linux. By following the steps outlined above, you can create simple scripts to
    automate tasks and make your workflow more efficient. As you gain more experience,
    you can start incorporating more advanced features like variables, user input,
    conditional statements, loops, and functions to create powerful and flexible scripts.
    Shell scripting is a valuable skill that will enhance your ability to manage and
    customize your Linux environment effectively.


    ## 6.3 Advanced Scripting Techniques


    After mastering the basics of shell scripting, you can explore advanced techniques
    to make your scripts more powerful, efficient, and versatile. This section covers
    various advanced scripting concepts, including positional parameters, arrays,
    error handling, and script debugging, and integrating external tools.


    ### Positional Parameters


    Positional parameters are used to pass arguments to a script. These arguments
    can be accessed using `$1`, `$2`, `$3`, and so on.


    #### Example: Using Positional Parameters


    ```bash

    #!/bin/bash

    # Using positional parameters

    echo "Script name: $0"

    echo "First argument: $1"

    echo "Second argument: $2"

    ```


    To run this script with arguments:

    `./myscript.sh arg1 arg2`


    Output:

    Script name: `./myscript.sh

    First argument: arg1

    Second argument: arg2


    ### Arrays


    Arrays allow you to store multiple values in a single variable. In Bash, arrays
    are zero-indexed.


    #### Example: Defining and Using Arrays


    ```bash

    #!/bin/bash

    # Defining an array

    fruits=("Apple" "Banana" "Cherry")


    # Accessing array elements

    echo "First fruit: ${fruits[0]}"

    echo "Second fruit: ${fruits[1]}"


    # Adding an element to the array

    fruits+=("Date")


    # Looping through an array

    for fruit in "${fruits[@]}"; do

    echo "Fruit: $fruit"

    done

    ```


    ### Error Handling


    Effective error handling ensures that your script can handle unexpected situations
    gracefully. The `set` command can be used to control error handling behavior.


    #### Example: Error Handling with set


    ```bash

    #!/bin/bash

    # Exit script on any error

    set -e


    # Example command that may fail

    cp source.txt destination.txt

    echo "File copied successfully."

    ```

    If `source.txt` does not exist, the script will exit immediately due to `set -e`.


    #### Custom Error Messages


    You can use conditional statements to provide custom error messages.


    ```bash

    #!/bin/bash

    # Check if the file exists

    if [ ! -f "source.txt" ]; then

    echo "Error: source.txt not found!"

    exit 1

    fi


    cp source.txt destination.txt

    echo "File copied successfully."

    ```


    ### Debugging Scripts


    Debugging helps identify and fix issues in your script. Bash provides several
    options for debugging.


    #### Using set -x


    `set -x` enables a mode of the shell where all executed commands are printed to
    the terminal.


    ```bash

    #!/bin/bash

    # Enable debugging

    set -x


    # Commands to debug

    echo "This is a debug message."

    ```


    #### Using trap


    `trap` allows you to execute commands when the script receives specific signals.


    ```bash

    #!/bin/bash

    # Trap signals

    trap ''echo "Script interrupted"; exit'' INT TERM


    # Infinite loop to keep the script running

    while true; do

    echo "Running..."

    sleep 1

    done

    ```

    Pressing `Ctrl+C` will trigger the `INT` signal, and the script will print "Script
    interrupted" before exiting.


    ### Functions for Modular Scripts


    Functions enable you to break your script into reusable and modular pieces.


    #### Example: Defining and Using Functions


    ```bash

    #!/bin/bash

    # Define a function

    function greet {

    echo "Hello, $1!"

    }

    # Call the function

    greet "Alice"

    greet "Bob"

    ```


    #### Returning Values from Functions


    Functions can return values using the `return` command or by echoing the result.


    ```bash

    #!/bin/bash

    # Function to add two numbers

    function add {

    local result=$(( $1 + $2 ))

    echo $result

    }


    # Capture the result of the function

    sum=$(add 5 3)

    echo "Sum: $sum"

    ```


    ### Integrating External Tools


    Shell scripts can leverage powerful external tools like `awk`, `sed`, and `grep`
    for advanced text processing and data manipulation.


    #### Example: Using awk

    * `awk` is a powerful text-processing tool.


