    * `uname`（Unix 标识）：显示系统信息。


    ```bash

    uname -a

    Linux hostname 5.4.0-26-generic #30-Ubuntu SMP Thu May 7 20:23:44 UTC 2020 x86_64
    x86_64 x86_64 GNU/Linux

    ```

    * `top`：显示实时系统进程和资源占用。


    ```bash

    top

    ```

    * `df`（磁盘剩余）：显示磁盘空间使用情况。


    ```bash

    df -h

    ```

    * `du`（磁盘使用）：估算文件和目录的空间占用。


    ```bash

    du -sh *

    ```


