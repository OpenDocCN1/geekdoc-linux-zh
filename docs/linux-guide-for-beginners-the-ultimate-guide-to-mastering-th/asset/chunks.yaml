    \n## Crontab 条目示例\n\n每分钟运行一次命令：\n```\n* * * * * /path/to/command\n```\n\n每天凌晨\
    \ 2 点运行一次脚本：\n```\n0 2 * * * /path/to/script.sh\n```\n\n每周一下午 5 点运行一次脚本：\n```\n\
