    # File Management


    `chown` (Change Owner)


    The `chown` command changes the file owner and group.


    ```bash

    sudo chown user:group file.txt

    ```


    These file management commands form the core of file and directory operations
    in Linux. By mastering these commands, you can efficiently navigate the file system,
    manage files and directories, and control access permissions. Understanding and
    using these commands will significantly enhance your ability to work effectively
    in a Linux environment. As you become more comfortable with these commands, you
    can explore more advanced options and combinations to further streamline your
    workflow.


    ## 3.2 System Information Commands


    Knowing how to retrieve and interpret system information is essential for managing
    a Linux system. System information commands help you understand the hardware and
    software environment, monitor system performance, and troubleshoot issues. This
    section covers the essential commands for obtaining detailed information about
    your Linux system.


    ### Basic System Information


    * `uname` (Unix Name)


    The `uname` command provides system information such as the operating system,
    kernel version, and more.


    ```bash

    uname -a

    ```

    Linux hostname 5.4.0-26-generic #30-Ubuntu SMP Thu May 7 20:23:44 UTC 2020 x86_64
    x86_64 x86_64 GNU/Linux


    * `hostname`


    The `hostname` command displays or sets the system’s hostname.


    ```bash

    hostname

    myhostname

    hostnamectl set-hostname newhostname # Changes the system''s hostname

    ```


    ### Hardware Information


    * `lshw` (List Hardware)


    The `lshw` command provides detailed information about the hardware configuration.


    ```bash

    sudo lshw

    ```


    * `lscpu` (List CPU)


    The `lscpu` command displays information about the CPU architecture.


    ```bash

    lscpu

    ```


    * `lsblk` (List Block Devices)


    The `lsblk` command lists information about all available or specified block devices.


    ```bash

    lsblk

    ```


    * `lsusb` (List USB)


    The `lsusb` command lists information about USB devices connected to the system.


    ```bash

    lsusb

    ```


    * `lspci` (List PCI)


    The `lspci` command lists information about PCI buses and devices connected to
    them.


    ```bash

    lspci

    ```


    ### Memory and Disk Usage


    * `free`


    The `free` command displays the amount of free and used memory in the system.


    ```bash

    free -h

    ```


    * `df` (Disk Free)


    The `df` command shows the amount of disk space used and available on filesystems.


    ```bash

    df -h

    ```


    * `du` (Disk Usage)


    The `du` command estimates file and directory space usage.


    ```bash

    du -sh /path/to/directory

    ```


    ### System Monitoring


    * `top`


    The `top` command displays real-time information about system processes, CPU,
    and memory usage.


    ```bash

    top

    ```


    * `htop`


    The `htop` command is an interactive process viewer, an enhanced version of `top`.


    ```bash

    htop

    ```


    * `vmstat` (Virtual Memory Statistics)


    The `vmstat` command reports information about processes, memory, paging, block
    IO, traps, and CPU activity.


    ```bash

    vmstat

    ```


    * `iostat` (Input/Output Statistics)


    The `iostat` command reports CPU and I/O statistics.


    ```bash

    iostat

    ```


    ### Network Information


    * `ifconfig`


    The `ifconfig` command configures network interfaces, but it is deprecated in
    favor of `ip`.


    ```bash

    ifconfig

    ```


    * `ip`


    The `ip` command shows/manages routing, devices, policy routing, and tunnels.


    ```bash

    ip addr show

    ```


    * `netstat`


    The `netstat` command displays networking statistics.


    ```bash

    netstat -tuln

    ```


    * `ss`


    The `ss` command provides detailed information about network connections, similar
    to `netstat`.


    ```bash

    ss -tuln

    ```


    * `ping`


    The `ping` command checks the connectivity to a host.


    ```bash

    ping example.com

    ```


    * `traceroute`


    The `traceroute` command shows the route packets take to a network host.


    ```bash

    traceroute example.com

    ```


    * `dig` (Domain Information Groper)


    The `dig` command queries DNS servers for information about host addresses, mail
    exchanges, and other DNS records.


    ```bash

    dig example.com

    ```


    ### Boot and System Logs


    * `dmesg` (Display Message)


    The `dmesg` command prints the kernel ring buffer messages, useful for debugging
    the kernel.


    ```bash

    dmesg

    ```


    * `journalctl`


    The `journalctl` command queries and displays logs from systemd journal.


    ```bash

    journalctl

    ```


    * `last`


    The `last` command shows the last logins of users.


    ```bash

    last

    ```


    * `uptime`


    The `uptime` command tells how long the system has been running, along with the
    current time, number of users, and system load averages.


    ```bash

    uptime

    ```


    ### Process Management


    * `ps` (Process Status)


    The `ps` command reports a snapshot of current processes.


    ```bash

    ps aux

    ```


    * `kill`


    The `kill` command sends a signal to a process, typically used to terminate processes.


    ```bash

    kill PID

    ```


    * `killall`


    The `killall` command kills all processes by name.


    ```bash

    killall process_name

    ```


    * `pkill`


    The `pkill` command sends a signal to processes based on name and other attributes.


    ```bash

    pkill process_name

    ```


    Mastering these system information commands is crucial for effective Linux system
    administration. They provide insights into the system''s hardware, software, network
    status, and resource usage, allowing users to diagnose problems, optimize performance,
    and ensure the system runs smoothly. By familiarizing yourself with these commands,
    you''ll be better equipped to manage and troubleshoot your Linux environment efficiently.


    ## 3.3 Process Management Commands


    Process management is a critical aspect of system administration in Linux, allowing
    you to monitor and control the programs running on your system. This section covers
    essential commands for managing processes, including viewing process information,
    controlling process execution, and handling system resources efficiently.


    ### Viewing Processes


    * `ps` (Process Status)


    The `ps` command provides a snapshot of the current processes running on the system.
    It can display various levels of detail depending on the options used.


    ```bash

    ps

    ps aux

    ps -ef

    ```


    * `top`


    The `top` command provides real-time, dynamic view of system processes, including
    CPU and memory usage.


    ```bash

    top

    ```

    Within `top`, you can press:

    * `k` to kill a process

    * `r` to renice a process

    * `q` to quit


    * `htop`


    The `htop` command is an enhanced version of `top` with a more user-friendly interface.


    ```bash

    htop

    ```


    * `pgrep`


    The `pgrep` command searches for processes based on their name or other attributes.


    ```bash

    pgrep process_name

    ```


    ### Processes


    * `kill`


    The `kill` command sends a signal to a process, typically to terminate it. The
    default signal is `SIGTERM` (15), but other signals can be specified.


    ```bash

    kill PID # Sends SIGTERM (15) to the process

    kill -9 PID # Sends SIGKILL (9) to forcefully terminate the process

    ```


    * `killall`


    The `killall` command sends a signal to all processes with a name.


    ```bash

    killall process_name

    ```


    * `pkill`


    The `pkill` command sends a signal to processes based on name and other attributes.


    ```bash

    pkill process_name

    ```


    * `xkill`


    The `xkill` command allows you to forcefully close a graphical window by clicking
    on it.


    ```bash

    xkill

    ```


    ### Managing Process Priority


    * `nice`


    The `nice` command starts a new process with a specified priority. The priority
    range is from -20 (highest priority) to 19 (lowest priority).


    ```bash

    nice -n 10 command_to_run

    ```


    * `renice`


    The `renice` command changes the priority of an already running process.


    ```bash

    renice -n 5 -p PID

    ```


    ### Background and Foreground


    * `&`


    Appending `&` to a command runs it in the background, allowing you to continue
    using the terminal.


    ```bash

    command_to_run &

    ```


    * `jobs`


    The `jobs` command lists the background and suspended jobs in the current shell
    session.


    ```bash

    jobs

    ```


    * `fg` (Foreground)


    The `fg` command brings a background job to the foreground.


    ```bash

    fg %job_id

    ```


    * `bg` (Background)


    The `bg` command resumes a suspended job in the background.


    ```bash

    bg %job_id

    ```


    * `ctrl+z`


    Pressing `ctrl+z` suspends the currently running foreground process and moves
    it to the background as a stopped job.


    # Press ctrl+z while a process is running


    ### Monitoring System Resources


    * `vmstat` (Virtual Memory Statistics)


    The `vmstat` command reports information about processes, memory, paging, block
    IO, traps, and CPU activity.


    ```bash

    vmstat

    ```

