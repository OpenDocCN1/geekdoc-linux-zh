    ## 3.3 Process Management Commands


    Process management is a critical aspect of system administration in Linux, allowing
    you to monitor and control the programs running on your system. This section covers
    essential commands for managing processes, including viewing process information,
    controlling process execution, and handling system resources efficiently.


    Viewing Processes


    *   ps (Process Status)


    The ps command provides a snapshot of the current processes running on the system.
    It can display various levels of detail depending on the options used.


    $ ps          # Shows processes running in the current shell


    $ ps aux      # Displays detailed information about all processes


    $ ps -ef      # Another format for detailed process information


    *   Top


    The top command provides a real-time, dynamic view of system processes, including
    their CPU and memory usage.


    $ top


    Within top, you can press:


    *   k to kill a process


    *   r to renice a process


    *   q to quit


    *   htop


    The htop command is an enhanced version of top with a more user-friendly, interactive
    interface.


    $ htop


    *   Pgrep


    The pgrep command searches for processes based on their name or other attributes.


    $ pgrep process_name


    Controlling Processes


    *   Kill


    The kill command sends a signal to a process, typically to terminate it. The default
    signal is SIGTERM (15), but other signals can be specified.


    $ kill PID           # Sends SIGTERM (15) to the specified process


    $ kill -9 PID        # Sends SIGKILL (9) to forcefully terminate the process


    *   Killall


    The killall command sends a signal to all processes with a specified name.


    $ killall process_name


    *   Pkill


    The pkill command sends a signal to processes based on name and other attributes.


    $ pkill process_name


    *   Xkill


    The xkill command allows you to forcefully close a graphical window by clicking
    on it.


    $ xkill


    Managing Process Priority


    *   Nice


    The nice command starts a new process with a specified priority. The priority
    range is from -20 (highest priority) to 19 (lowest priority).


    $ nice -n 10 command_to_run


    *   Renice


    The renice command changes the priority of an already running process.


    $ renice -n 5 -p PID


