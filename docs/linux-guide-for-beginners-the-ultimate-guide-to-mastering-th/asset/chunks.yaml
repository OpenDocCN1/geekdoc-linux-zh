    * `apt`：用于基于 Debian 的发行版（如 Ubuntu）进行包管理。


    ```bash

    sudo apt update               # 更新包列表

    sudo apt upgrade              # 升级所有软件包

    sudo apt install package_name # 安装软件包

    sudo apt remove package_name  # 移除一个软件包

