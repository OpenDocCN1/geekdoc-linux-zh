    # 第 4 章：导航 Linux 文件系统


    Linux 文件系统是操作系统的关键组成部分，以分级结构组织数据。理解如何导航和管理文件系统对于任何 Linux 用户或管理员都至关重要。本章提供了文件系统的全面指南，包括目录结构、导航命令、文件权限和基础文件管理。


    ## 1. Linux 目录结构


    Linux 文件系统以树形结构组织，以根目录 `/` 为基础。以下是一些关键目录及其用途：


    - `/` (根目录)：文件系统的顶层目录。

    - `/bin`: 包含基本的二进制可执行文件。

    - `/boot`: 存放引导加载文件。

    - `/dev`: 包含设备文件。

    - `/etc`: 包含系统配置文件。

    - `/home`: 用户的家目录。

    - `/lib`: 必要的共享库和内核模块。

    - `/media`: 可移动介质的挂载点。

    - `/mnt`: 临时挂载点。

    - `/opt`: 可选软件包。

    - `/proc`: 提供进程和系统信息的虚拟文件系统。

    - `/root`: root 用户的家目录。

    - `/sbin`: 用于管理的系统二进制文件。

    - `/tmp`: 临时文件。

    - `/usr`: 用户二进制文件和只读数据。

    - `/var`: 可变数据文件。


    ## 2. 导航命令


    导航 Linux 文件系统涉及在目录之间移动、列出内容以及理解路径。以下是基本命令：


    ### `pwd` (打印工作目录)

    显示当前目录。


    ```

    pwd

    ```


    ### `ls` (列出)

    列出目录的内容。


    ```

    ls

    ```

    # 基本列出


    ```

    ls -l

    ```

    # 带有文件权限的详细列出


    ```

    ls -a

    ```

    # 隐藏文件


    ```

    ls -lh

    ```

    # 人类可读的大小


    ### `cd` (切换目录)

    更改当前目录。


    ```

    cd /path/to/directory

    ```


    ```

    cd ~

    ```

    # 回到家目录


    ```

    cd ..

    ```

    # 向上移动一级


    ## 3. 理解路径


    路径指定文件的位置。它们可以是绝对路径或相对路径：


    - **绝对路径**：指定从根开始的完整路径。

    - **相对路径**：相对于当前目录的路径。


    ## 4. 文件权限


    Linux 权限决定谁可以读、写或执行。权限由字符和八进制数字表示。


    ### 字符

    - `r` (读)

    - `w` (写)

    - `x` (执行)


    ### 分组

    - **用户** (u)：所有者

    - **组** (g)：组

    - **其他** (o)：所有其他用户


    ### 修改权限

    `chmod` 修改文件权限。


    ```

    chmod 755 filename

    ```

    # 设置权限为 rwxr-xr-x


    ```

    chmod u+w filename

    ```

    #为用户添加写权限


    ```

    chmod g-r filename

    ```

    #为组移除读权限


    ### 修改所有者

    `chown` 修改文件所有者。


    ```bash

    sudo chown user:group filename

    ```


    ## 5. 基础文件管理


    管理文件和目录是使用 Linux 的基础。命令包括：


    ### `cp` (复制)

    复制文件和目录。


    ```

    cp source destination

    ```

    # 复制文件


    ```

    cp -r source_directory destination_directory

    ```

    # 递归复制目录


    ### `mv` (移动)

    移动或重命名文件和目录。


    ```

    mv oldname newname

    ```

    # 重命名文件


    ```

    mv file /new/path/

    ```

    # 将文件移动到位置


    ### `rm` (删除)

    删除文件和目录。


    ```

    rm filename

    ```

    # 删除文件


    ```

    rm -r directory

    ```

    # 删除目录及其内容


    ```

    rm -i filename

    ```

    # 在删除文件前提示


    ### `mkdir` (创建目录)

    创建新目录。


    ```

    mkdir new_directory

    ```

    # 创建新目录


    ```

    mkdir -p /path/to/new_directory

    ```

    # 根据需要创建父目录


    ### `rmdir` (删除目录)

    删除空目录。


    ```

    rmdir empty_directory

    ```

    # 删除空目录


    ### `touch`

    创建一个空文件或更新现有文件的时间戳。


    ```

    touch newfile

    ```

    # 创建新空文件


