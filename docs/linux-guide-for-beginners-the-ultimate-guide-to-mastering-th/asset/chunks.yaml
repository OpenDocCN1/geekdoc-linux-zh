    * `/tmp`: A directory for temporary files created by applications. These files
    are often cleared on system reboot.

    * `/usr`: Contains user utilities and applications. Subdirectories include `/usr/bin`
    (user binaries), `/usr/lib` (libraries), and `/usr/share` (shared data).

    * `/var`: Stores variable data that changes frequently during system operation,
    such as logs, spool files, and caches. Key subdirectories include `/var/log` and
    `/var/spool`.


    ## File System Types


    Linux supports various file system types, each with specific features and use
    cases:


    * `Ext4` (Fourth Extended Filesystem): The default file system for many Linux
    distributions. It offers good performance, reliability, and features like journaling,
    which helps prevent data corruption.

    * `XFS`: Known for its high performance and scalability, XFS is often used in
    enterprise environments and for large storage systems.

    * `Btrfs` (B-tree Filesystem): Designed for advanced features like snapshotting,
    subvolumes, and pooling multiple devices. Btrfs aims to provide enhanced data
    integrity and scalability.

    * `FAT32` and `NTFS`: Commonly used for compatibility with Windows systems. FAT32
    is suitable for smaller partitions and USB drives, while NTFS is better for larger
    partitions and supports more advanced features.


    ## Permissions and Ownership


    Linux employs a robust permission and ownership model to secure files and directories.
    Each file or directory has an owner (user), a group, and permission settings for
    three categories: owner, group, and others. Permissions include read (r), write
    (w), and execute (x), which determine the level of access allowed.


    For example, a file with permissions `rwxr-xr--` allows the owner to read, write,
    and execute, the group to read and execute, and others to read only.


    ## Mounting and Unmounting


    Mounting integrates a file system into the existing directory structure, making
    it accessible to the system. The `/etc/fstab` file contains configurations for
    automatic mounting at boot. The `mount` command can also be used to manually mount
    file systems, while the `umount` command is used to unmount them.


    The Linux file system is a sophisticated and flexible structure that organizes
    data efficiently while providing robust security and access control. Understanding
    its hierarchy, key directories, file system types, permissions, and mounting processes
    is fundamental to effectively using and managing a Linux system. This knowledge
    forms the foundation for further exploration and mastery of Linux administration.


    ## 2.3 Basic Linux Commands


    Using the command line is a fundamental aspect of working with Linux. The terminal
    provides powerful tools for managing the system, automating tasks, and accessing
    a vast array of functionality. This section introduces some of the most basic
    and essential Linux commands that every user should know.


    ### Navigating the File System


    * `pwd` (Print Working Directory): Displays the current directory path.


    ```bash

    pwd

    /home/user

    ```


    * `ls` (List): Lists the files and directories in the current directory.


    ```bash

    ls

    Documents Downloads Music Pictures

    ```


    * `cd` (Change Directory): Changes the current directory.


    ```bash

    cd Documents

    pwd

    /home/user/Documents

    ```


    ### File and Directory Operations


    * `mkdir` (Make Directory): Creates a new directory.


    ```bash

    mkdir new_folder

    ```


    * `rmdir` (Remove Directory): Deletes an empty directory.


    ```bash

    rmdir new_folder

    ```

    * `rm` (Remove): Deletes files or directories.


    ```bash

    rm file.txt

    rm -r directory_name  # Removes directory and its contents

    ```

    * `cp` (Copy): Copies files or directories.


    ```bash

    cp source_file.txt destination_file.txt

    cp -r source_directory destination_directory

    ```

    * `mv` (Move): Moves or renames files or directories.


    ```bash

    mv old_name.txt new_name.txt

    mv file.txt /path/to/destination/

    ```


    ### Viewing and Editing Files


    * `cat` (Concatenate): Displays the contents of a file.


    ```bash

    cat file.txt

    ```

    * `less`: Allows you to view file contents one page at a time.


    ```bash

    less file.txt

    ```

    * `nano`: A simple text editor for editing files in the terminal.


    ```bash

    nano file.txt

    ```

    * `vim`: A more advanced text editor with powerful features (requires some learning).


    ```bash

    vim file.txt

    ```


    ### System Information


    * `uname` (Unix Name): Displays system information.


    ```bash

    uname -a

    Linux hostname 5.4.0-26-generic #30-Ubuntu SMP Thu May 7 20:23:44 UTC 2020 x86_64
    x86_64 x86_64 GNU/Linux

    ```

    * `top`: Shows real-time system processes and resource usage.


    ```bash

    top

    ```

    * `df` (Disk Free): Displays disk space usage.


    ```bash

    df -h

    ```

    * `du` (Disk Usage): Estimates file and directory space usage.


    ```bash

    du -sh *

    ```


    ### Package Management


    * `apt`: Used in Debian-based distributions (like Ubuntu) for package management.


    ```bash

    sudo apt update               # Updates package lists

    sudo apt upgrade              # Upgrades all packages

    sudo apt install package_name # Installs a package

    sudo apt remove package_name  # Removes a package

    ```

    * `yum` / `dnf`: Used in Red Hat-based distributions (like Fedora and CentOS).


    ```bash

    sudo yum update               # Updates package lists (dnf for Fedora)

    sudo yum install package_name  # Installs a package

    ```

    * `pacman`: Used in Arch-based distributions.


    ```bash

    sudo pacman -Syu

    ```


    ### File Permissions


    * `chmod` (Change Mode): Changes permissions.


    ```bash

    chmod 755 script.sh

    ```

    * `chown` (Change Owner): Changes owner and group.


    ```bash

    sudo chown user:group file.txt

    ```


    ### Networking


    * `ping`: Tests connectivity to another host.


    ```bash

    ping example.com

    ```

    * `ifconfig` / `ip`: Displays or configures network interfaces.


    ```bash

    ifconfig

    ip addr show

    ```

    * `curl`: Transfers data from or to a server.


    ```bash

    curl http://example.com

    ```


    Mastering these basic Linux commands will significantly enhance your ability to
    navigate and manage your system. As you become more comfortable with the terminal,
    you can explore more advanced commands and scripting to increase your productivity.
    The command line is a powerful tool in the ecosystem.


    ## 2.4 Understanding the Terminal


    The terminal, also known as the command line interface (CLI), is a powerful tool
    that allows users to interact with their Linux system using text-based commands.
    Understanding the terminal is essential for managing a Linux system effectively,
    as it offers greater control, flexibility, and efficiency compared to graphical
    user interfaces (GUIs).


    ### The Terminal Emulator


    A terminal emulator is a software application that emulates a traditional computer
    terminal within a graphical environment. Some popular terminal emulators in Linux
    include GNOME Terminal, `KDE Konsole`, `XTerm`, and `Tilix`. These applications
    provide a command-line interface where users can enter and execute commands.


    ### Opening the Terminal


    To open the terminal, you can usually find it in the application menu of your
    desktop environment. Alternatively, you can use keyboard shortcuts:


    * GNOME: `Ctrl + Alt + T`

    * KDE Plasma: `Alt + Space` (to open KRunner), then type `konsole`

    * XFCE: `Ctrl + Alt + T`


    ### Basic Terminal Concepts


    * Prompt: The terminal prompt is the point where you enter commands. It typically
    includes information like the username, hostname, and current directory, followed
    by a symbol (e.g., `$` for regular users, `#` for root).


    ```

    user@hostname:~$

    ```

    * Command Structure: A command in the terminal consists of the command itself,
    followed by options (or flags) and arguments. For example:


    ```bash

    ls -l /home/user

    ```


    Here `ls` is the command, `-l` is an option, and `/home/user` is an argument.

