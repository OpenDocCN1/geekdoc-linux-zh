  \n# 7 Apache C 模块\n\n## 7.1 更安全的 C Web 应用程序\n\n在现实生活中，很少有 Web 管理员会梦想让任何人运行 C 程序作为\
  \ CGI 内容生成器，因为存在崩溃和核心转储的风险。然而，Apache 服务器本身是用 C 语言编写的，其开发工具附带了一些简单的实用，允许你创建代码存根（code\
  \ stubs），你可以将 C 程序放入其中，并在作为服务器的一部分加载时作为 Apache 模块运行，并在某种“沙箱”中安全地管理。在这里，我们将一个早期的示例并转换为\
  \ Apache 模块。\n\nApache2 开发库中包含一个名为 `apxs2` 的工具，可以调用它为程序生成代码存根，该程序可以编译成模块，并由 Apache\
  \ Web 服务器加载和管理。这些模块可以执行各种任务，但在我们的案例中，我们将做一些类似于 IIS 服务器中 ISAPI DLL 的工作。`apxs2` 工具的具体位置会根据你使用的\
  \ Linux 发行版而变化，但在 OpenSuse 上它的运行方式如下。\n\n在终端中输入：\n```bash\napxs2 -n labelmaker -g\n\
  ```\n\n![](img/00049.jpeg)\n\n这会创建一个你命名的名称（labelmaker）的文件夹、一个 `Makefile`、一个可以被 `Make`\
  \ 工具使用的 `modules.mk` 文件，以及一个名为 `mod_labelmaker.c` 的文件。\n\n生成的 C 文件类似于 Apache 的 \"\
  Hello World\"。它看起来可能很复杂，但它确实提供了一个很长的解释性注释头，非常值得阅读。其核心思想是，当 Apache 启动指定位置任何在服务器配置文件配置为需要加载的模块时，它们将被加载。`*_register_hooks`\
  \ 函数列出了可以在 Apache 服务器过程中特定阶段调用的函数名称和签名。在这种情况下，如果调用了名称 [`localhost/labelmaker`](http://localhost/labelmaker)，该模块将被请求处理\
  \ `*_handler` 函数中发生的任何情况。\n\n服务器的配置可能有点繁琐，但在 OpenSuse 中，我们必须将其添加到：\n\n### /etc/apache2/sites-available/default\n\
  ```apache\n<Location /labelmaker>\nSetHandler labelmaker\n</Location>\n```\n\n并且在\
  \ `/etc/config.sys/apache2` 中，我们将我们的模块名称 `labelmaker` 添加到以逗号分隔的长列表中，行位于 `APACHE_MODULES=\"\
  ...,labelmaker\"` 现在进入 `labelmaker` 文件夹并输入：\n\n```bash\nsudo axs2 -c -i mod_labelmaker.c\
  \ sudo /etc/init.d/apache2 restart\n```\n\n在浏览器中这样调用：\n\n![](img/00050.jpeg)\n\n\
  ![](img/00051.jpeg)\n\n## 7.2 添加某些功能\n\n现在我们可以将第 6 章中为图形库的工作作为替换处理函数插进来（在代码 Chapter7_1.c\
  \ 中有两个处理函数，其中一个被注释掉了）。请注意（高亮的的）对修改后的 `decode_value` 函数的调用，它使用 `r->args` 指针来获取 QUERY_STRING\
  \ 而不是 `getenv()`。此外 Apache 处理输出的方式也有所不同——通过调用 `gdImageGifPtr` 获取图像字节数组的指针，然后由 `ap_rwrite`\
  \ 函数输出数据。我们需要在输出调用后使用 `gdFree` 释放指针。\n\n![](img/00052.jpeg)\n\n![](img/00053.jpeg)\n\
  \n## 7.3 Apache 模块结论\n\n虽然编写和调试很困难，但这可能是最有回报且最深奥的领域，在其中你可以进行真正的、具有商业价值且可以安全部署的网络内容生成。很容易看出，如何通过颜色和字体参数来扩展此示例，从而创建一个实用的\
  \ Web 内容工具。\n\n\n\n\n关于 Apache 模块的清晰且简单的材料很少，但你可以先从在线文档开始：[`httpd.apache.org/docs/2.2/developer/`](http://httpd.apache.org/docs/2.2/developer/)\n\
  \n最近一本值得阅读的书是 Nick Kew 出版的《Apache 模块教程》（The Apache Modules Book）。\n\n# 8 Ghost 项目\n\
  \n## 8.1 一个 PHP 网站生成器项目\n\n使用 `C` 编写短程序来自动处理繁琐的任务，或者完成那些需要在大笨重工具上花费数小时调整的操作（例如邮件合并），这将是你学到后最感到欣幸的事情之一。这个项目非常节省时间。`Ghost`\
  \ 是一个轻量级的 PHP 生成器，供你自定义。\n\n如果你发现自己一直在不断构建 PHP 网站，那么一种能够一次性生成所有参数传递、解码、表单构建和数据库管理代码将非常有用。像\
  \ `Ruby on Rails` 这样的工具提供了这种功能，但设置和运行要复杂得多，而且你最终会发现还需要学习另一种语言才能继续下去。\n\n开始使用此工具最好的方法可能是编译并运行它。将\
  \ `ghost.zip` 源码解压到你的 `public_html` 文件夹中，这将创建一个名为 `ghost` 的文件夹`Makefile` 包含一个目标\
  \ `g1`，它可以编译并链接 `ghost`。因此，进入 `public_html/ghost` 并输入：`make g1`。\n\n运行网站生成器输入：\n\
  \n```bash\n./ghost testwebsite data1 data2 data1 data3 data4 data6 data6\n```\n\n\
  - 这将创建：\n- 一个文件夹 `public_html/testwebsite`\n- 一个名为 `testwebsite` 的 `mysql` 数据库表，带有文本字段\
  \ `data1 data2 data1 data3 data4 data6 data6`\n- 一个 `testwebsite.css` 文件\n- 空的 `header.html`\
  \ 和 `footer.html` 页面\n- 一个 `index.php`，它演示了如何对指定的数据项进行数据库表的表单输入处理、编辑、更新和删除。\n\n\
  在浏览器中，你看到的是 [`localhost/~yourname/testwebsite`](http://localhost/%7Eyourname/testwebsite)\n\
  \n![](img/00054.jpeg)\n\n这背后的思想是，创建和管理表单内容的所有机械性工作已完成，并且可以自定义。这张截图显示了提交一条记录的结果。顶行用于输入新数据，下几行允许对记录进行编辑或删除。这是一个允许你提取并应用到自己网站设计中的框架。\n\
  \n让我们分段检查这些代码。\n\n第一部分声明了所需的数据并创建了文件夹和 CSS 文件。\n\n![](img/00055.jpeg)\n\n接下来生成 `header.html`\
  \ 和 `footer.html` 文件。这些文件由 `PHP` 文件加载，可以作为通用的公共头部和页脚。CSS 文件在 `header.html` 文件中引用。\n\
  \n![](img/00056.jpeg)\n\n接下来我们创建数据库。\n\n![](img/00057.jpeg)\n\n复杂的部分现在开始，即生成 `php`\
  \ 脚本。理解此点的最好方法是在浏览器中查看页面源代码时检查程序的实际输出。\n\n顶行是一个表单，其中为运行 `ghost` 程序生成的表中的每一列都有一个文本框。\n\
  \n![](img/00058.jpeg)\n\n对于表中的每一行，我们现在生成一个允许编辑数据的表单和一个用于执行删除操作的锚链接。\n\n![](img/00059.jpeg)\n\
  \n仔细检查 `index.php` 文件将让你看到这一切发生在哪里，并能反推找到在 `ghost.c` 源码中生成这些 `PHP` 代码的地点。一个好主意是在打印件上使用荧光笔，因为我们把一种语言（`HTML`）嵌入另一种语言（`PHP`）中，而后者又在另一种语言内部，因此非常小心地使用转义字符\
  \ `\\` 在需要的地方表示单引号和双引号，以确保这一切正常运行。这看起来可能很复杂——但 `ghost` 允许快速原型，使得花时间自定义 `C` 代码是值得的，这样你想要的\
  \ `PHP` 和数据库就能按照你的要求生成。\n\n这里是 `PHP` 文件 `index.php` 中生成编辑或删除行的部分。静态 HTML 被高亮显示，其他部分通过\
  \ `MySQL PHP` 函数调用插入。\n\n![](img/00060.jpeg)\n\n如你所见，大量繁琐且重复的工作已经实现了自动化。你可以通过修改\
  \ `PHP` 代码继续进行，或者深入自定义生成所有这些内容的 `C` 程序。\n\n我个人经常使用 `ghost` 来节省构建网站的时间，这就是我编写它的原因。我厌倦了编写几乎完全相同的的代码来解码\
  \ `HTML` 表单并填充或更新数据库。\n"
