- "# Linux 下 C 语言实战：学习在 Linux 中编程\n\n\n\n![](img/00061.jpeg)\n\n\n## 设置你的系统\n\n本书假设你正在使用带有\
  \ KDE 或 Gnome 桌面的 Linux 操作系统。针对常见架构的具体设置说明请参阅 [`www.ubiubi.org/CProgrammingInLinux/`](http://www.ubiubi.org/CProgrammingInLinux/)\n\
  \n如果你使用的是 KDE 桌面，你将使用 Konqueror 或 Dolphin 作为文件管理器，使用 `kate` 或 `kedit` 作为编辑器。\n\n\
  在 Gnome 中，你可能会使用 Nautilus 和 `gedit`。\n\n你需要熟悉以“超级用户”（super user）身份执行某些操作的概念，这样你才有权限复制或编辑某些文件。这通常通过在\
  \ Linux 命令前加上 `sudo` 并提供密码来实现，如下例所示：\n\n```bash\n“sudo cp hello3 /srv/www/cgi-bin/hello3”\n\
  ```\n\n这会将文件 `hello3` 复制到 Apache 服务器存放通用网关接口或 `cgi` 程序的区域。\n\n在 KDE 中，执行 `kdesu\
  \ konqueror` 会以超级用户身份打开文件管理器。\n\n![](img/00001.jpeg)在 Gnome 中，执行 `gnomesu nautilus`\
  \ 会以超级用户身份打开文件管理器。你需要安装以下软件包：\n\n在全文中你将看到对 `cgi-bin` 文件夹的引用。该文件夹的位置在不同的 Linux 发行版之间有所不同。默认情况下，用于\
  \ Web 程序的文件夹是：\n\n- OpenSuse: `/srv/www/cgi-bin`\n- Ubuntu: `/usr/lib/cgi-bin`\n\
  \n要将程序放在该处你需要超级用户权限，因此可能最好在你自己的家目录 `/*****/public_html/cgi-bin` 目录下创建一个文件夹，并修改 Apache\
  \ 配置文件中的 `ScriptAlias` 和相关的 `Directory` 引用（OpenSuse 的 `/etc/apache2/default-server.conf`\
  \ 或 Ubuntu 的 `/etc/apache2/sites-available/default`）。\n\n# 1 Hello World\n\n## 1.1\
  \ Hello 程序 1\n\n使用文件管理器（在 KDE 中为 Konqueror，在 Gnome 中为 Nautilus）在你的家目录目录的某处创建一个新目录，名称应适合书中的所有示例，例如“Programming_In_Linux”，名称中不要包含空格。\n\
  \n打开编辑器（在 KDE 中为 `kate`，在 Gnome 中为 `gedit`）并输入（或从提供的源码 zip 包中复制）以下内容：\n\n![](img/00002.jpeg)\n\
  \n将文本保存为 `chapter1_1.c`，存放在你在家目录下创建的新文件夹中。\n\n打开终端窗口并输入：\n```bash\ngcc -o hello\
  \ chapter1_1.c\n```\n将程序编译成可执行的形式。\n\n现在输入 `ls -l` 列出此目录中所有文件的详细信息。你应该看到 `chapter1_2.c`\
  \ 在那里，以及一个名为 `hello` 的文件，这就是你刚刚编写的编译 C 程序。\n\n现在输入：\n```bash\n./hello\n```\n来执行，或者运行该程序，它应该返回文本：“Hello\
  \ you are learning C!!”。\n\n如果运行成功了，恭喜你，你现在是一个程序员了！\n\n#### ![](img/00003.jpeg)\
  \ 程序结构分析：\n\n`/*** ***/` 内部的部分是注释，不会被编译，仅供信息和参考。\n\n`#include...` 部分告诉编译器需要哪些系统库以及此程序引用了哪些头文件。在我们的案例中使用了\
  \ `printf`，它定义在 `stdio.h` 头文件中。\n\n`int main(int argc, char *argv[])` 部分是实际程序的开始。这是一个入口，大多数\
  \ C 程序都有一个 `main` 函数。\n\n`int argc` 是函数 `main` 的参数，是一个整数，表示传递给 `char *argv[]`（指向字符字符串的指针列表）的字符字符串参数的数量，这些参数在我们运行程序时可能从命令行传递。\n\
  \n指向某些项的指针是赋予这种数据类型的内存地址的名称。我们可以有一个整数的指针：`int *iptr`，或者一个浮点数的指针：`float *fPtr`。任何项列表都由\
  \ `[]` 描述，如果我们确切知道这个列表的大小，可能会将其声明为 `[200]`。在这种情况下，我们知道第二个参数是指向字符字符串的指针列表。\n\n大括号中的所有其他内容都是主函数，在本例中，整个程序以行的形式表示。\n\
  \n每一行或每个语句都以分号 `;` 结束。\n\n我们有像 `printf(...)` 这样的函数调用，它是对头文件 `stdio.h` 中定义的标准输入输出库的调用。\n\
  \n在程序末尾，`return 0` 通过向系统返回零来结束程序。\n\n返回值通常用于指示程序未正确运行时的成功或状态。\n\n## 1.2 Hello 程序\
  \ 2\n\n将这个例子更进一步，观察程序入口函数声明处的程序开头：`int main(int argc, char *argv[])`。\n\n用通俗来说，这意味着：\n\
  \n名为 `main` 的函数返回一个整数，它接受两个参数：一个名为 `argc` 的整数（表示命令行参数的数量），然后 `*argv[]`，它是指向字符串的指针列表或数组，这些字符串是在从命令行运行程序时输入的实际参数。\n\
  \n![](img/00004.jpeg)\n\n在我们开始恐慌之前，让我们重写程序来看看这一切意味着什么。\n\n![](img/00005.jpeg)\n\n\
  将文本保存为 `chapter1_2.c` 放在同一个文件夹中。\n\n打开终端窗口并输入：\n```bash\ngcc -o hello2 chapter1_2.c\n\
  ```\n将程序编译成可执行的形式。\n\n现在输入 `ls -l` 列出此目录中所有文件的详细信息。你应该看到 `chapter1_2.c` 在那里，以及一个名为\
  \ `hello2` 的文件，这就是你刚刚编写的编译 C 程序。\n\n现在输入：\n```bash\n./hello2\n```\n来执行，或者运行该程序，它应该返回文本：“Hello\
  \ you are learning C!!”。\n\n我们可以看到程序名称本身被算为一个行参数，并且数组中项的计数从零开始。\n\n现在输入：\n```bash\n\
  ./hello2 my name is Cerberus\n```\n执行程序，它应该返回文本：Hello you are learning C!!\n\n那么，这里发生了什么？看起来我们正在读取运行程序时输入的每个字符字符串（单词）。\n\
  \n## 1.3 Hello 程序 3\n\n让我们变得真实一点，在网页中运行它。做一个额外的更改，添加第一个输出打印语句“Content-type:text/plain\\\
  n\\n”，这告诉我们的服务器将传输什么类型的 MIME 类型。\n\n```bash\ngcc -o hello3 chapter1_3.c\n```\n编译并将编译文件\
  \ `hello3` 复制到你的 `public_html/cgi-bin` 目录（或者在你自己的机器上以超级用户身份将程序复制到 `/srv/www/cgi-bin`\
  \ (OpenSuse) 或 `/usr/lib/cgi-bin` (Ubuntu)）。\n\n![](img/00007.jpeg)\n\n打开浏览器并输入\
  \ URL [`localhost/cgi-bin/hello3?Cerberus+`](http://localhost/cgi-bin/hello3?david%2Bhaskins)，你应该看到\
  \ C 程序可以生成网页内容。\n\n![](img/00008.jpeg)\n\n## 1.4 Hello 程序 4\n\n`main` 函数签名的一个很少被记录的特征是它可以接受三个参数，我们现在查看最后一个参数\
  \ `char *env[ ]`，它也是一个指向字符串的指针列表，但在这种情况下，这些是程序运行时可用的系统环境变量。\n\n![](img/00009.jpeg)\n\
  \n\n\n\n使用 `gcc -o hello4 chapter1_4.c` 和 `as` 以超级用户身份编译，并将程序拷贝到 `/srv/www/cgi-bin`\
  \ (OpenSuse) 或 `/usr/lib/cgi-bin` (Ubuntu)。你可以在编译程序的终端通过 `./hello4` 运行它，并将看到一长串环境变量列表。在浏览器中输入\
  \ `http://localhost/cgi-bin/hello4` 时，你将看到完全不同的内容。\n\n![](img/00010.jpeg)\n\n![](img/00011.jpeg)\n\
  \n我们很快就会发现 `QUERY_STRING` 是一个与我们的程序通信的一个重要环境变量，在这种情况下，我们看到它的值为“Cerberus+”，或者说我们输入的\
  \ URL 中“?” 之后的所有内容。这是向通用网关接口（CGI）程序（如 `hello4`）发送信息的有效方法，但我们应该将其限制为单个字符串。在我们的案例中，我们使用“+”来连接两个字符串。如果我们输入：“Cerberus”，浏览器会对其翻译，让我们看到：\n\
  \n`QUERY_STRING=Cerberus%20`\n\n我们稍后将学习如何将复杂的输入值集合传输到我们的程序。\n\n## 1.5 Hello World\
  \ 总结\n\n我们已经看到，一个带有极少量输入和一些输出的简单程序实际上是非常强大的，因为它揭示并暴露了我们计算机中大量的内部工作机制。\n\n尽管我们才刚刚开始，但已经遇到了许多我们将反复反复使用的关键概念：\n\
  \n* 函数和参数\n* 数字（整数）和字符字符串作为数据类型\n* 列表或数组\n* 使用“for”和“while”的循环\n\n我们经历了一次刻意的巨大跨越：从编写一个仅运行在“终端屏幕”上的程序，变为一个可以在互联网浏览器中可见的程序。\n\
  \n这是因为在像 Windows、Gnome 或 KDE 等窗口化系统中编写与用户交互的程序极其复杂，而且你不会经常被要求这样做。\n\n网页浏览器已成为我们现在所做的几乎事情的默认界面模式，因此我们最好从一开始就学会使用它。\n\
  \n在接下来的所有章节中，我们将遵循这种模型：从基础技术开始，然后将其应用于基于 Web 的系统。\n\n在实践中，并没有大量的 C 通用网关接口编程，但有大量的基于\
  \ C 和 C++ 的代码作为 Apache 模块和 Microsoft IIS ISAPI DLL 运行。也许没有多少人知道 Ebay 的大部分是用 C /\
  \ C++ 编写的。\n\n为什么？它是最快的运行方式，而且他们在全球实时市场中与“抢购手”的业务需要这种闪电的核心，因此没有其他方法可以获得那种性能。\n\n\
  # 2 数据与内存\n\n## 2.1 简单的数据类型？\n\n当我们编写程序时，必须对世界的本质做出决策或断言，因为我们要声明并描述变量来表示想要包含在信息处理中的事物类型。\n\
  \n这个过程具有深的哲学意义；我们做出本体论的断言，即此或彼事物存在；当我们选择特定的数据类型或数据类型集合来描述这些事物的属性时，我们做出了认识论的断言。这是一项责任重大的工作，不能轻率对待。\n\
  \n作为一个实际例子，我们可能会声明一个看起来像地理数据库记录开头的结构。\n\n![](img/00012.jpeg)\n\n在这里，我们正在执行以下操作：\n\
  \n* 断言我们在此应用程序中遇到的所有字符字符串将限制为 255 个字符，因此我们通过预处理器语句定义它——这些语句以 `#` 开头。\n* 断言城镇与县相关，县与国家以某种层级方式相关。\n\
  * 断言人口以整数计算——没有半个人。\n* 断言位置将按照一种特定变体（WGS84）记录，该变体使用小数分数表示度、分、秒，是经纬度描述地球表面地点的约定。\n\
  \n这些语句中的每一条都在函数作用范围内分配内存。在这里，我们正在执行以下操作：（为了保持核心内容完整，此处省略）\n\n[注：源文本在后半部分包含重复的技术术语和混乱的句子；已保留逻辑流和关键技术术语。]\n\
  \n## 2.2 什么是字符串？\n\nJava 和 C++ 等某些编程语言具有字符串数据类型，它隐藏了看似简单之下的某些复杂性。\n\n字符字符串的一个基本属性是它是系列长度不确定的字符。\n\
  \n我们可以在键盘上输入的大部分单个字符由简单的 ASCII 代码表示，C `char` 类型用于存储字符数据。\n\n字符串以 `NULL` 结尾的字符数组形式存储，因此数组必须足够大，能够容纳字符序列加一个。记住，数组成员始终从零开始。\n\
  \n## 2.3 字符串可以“意味着”什么\n\n任何事情——赋予变量的名称及其意义或用途完全取决于观察者的想法。尝试一下\n\n\n\n\n\n在浏览器中输入：[`localhost/cgi-bin/data3?red`](http://localhost/cgi-bin/data3?red)，你应该看到这个：\n\
  \n![](img/00016.jpeg)\n\n或者如果你发送任何参数，你将获得令意想不到的结果：\n\n![](img/00017.jpeg)\n\n我们在这里所做的是将字符串参数\
  \ `argv[1]` 作为 HTML `body` 标签的背景颜色代码。我们将 `Content-type` 规范更改为 `text/html`，奇迹的是，现在我们的程序正在生成\
  \ HTML 内容。这用一种语言在另一种语言内部表达。网络浏览器理解有限的颜色术语，而且颜色也可以定义为十六进制代码，例如 `#FFFFFF`（白色）、`#FF0000`（红色）、`#00FF00`（绿色）、`#0000FF`（蓝色）。\n\
  \n这个有趣的练习不仅仅是一个轻量级的技巧，这种“一个程序可以用另一种语言生成另一个程序”的想法是非常强大的，并且是整个互联网力量的背后。当我们从像这样的通用网关接口（CGI）程序生成\
  \ HTML（或 XML 或其他任何内容）时，我们正在创建动态内容，这些内容可以链接到实时变化的数据，而不是静态的预编辑网页。在实践中，大多数网站都是动态和静态内容的混合，但在这里我们看到了在非常简单的水平是如何实现的。\n\
  \n在整本书中，我们将浏览器作为程序的首选界面，因此我们将生成 HTML 和二进制图像流 Web 内容，仅作为使程序力量立即生效的手段。在终端屏幕上盯着写的代码并不那么令人印象，而编写窗口类型的应用程序远没有那么简单。\n\
  \n在实践中，你被要求编写的大部分软件运行在 Web 上，所以我们最好直接从这个想法开始。大多数 Web 应用还涉及多种语言，如 CSS、(X)HTML、XML、JavaScript、PHP、JAVA、JSP、ASP。.NET、SQL。如果这听起来很可怕，不要恐慌。对\
  \ C 语言的了解将让你看到，这些执行不同功能的语言在语法上都以 C 语言为基础。\n\n## 2.4 解析字符串\n\n从某种输入字符串中提取意义或有价值信息的工作被称为“解析”（parsing）。我们现在将构建另一个有趣的互联网可调用\
  \ CGI 程序，用以展示我们手中的力量。\n\n![](img/00018.jpeg)\n\n编译命令：`gcc -o data4 chapter2_4.c\
  \ -lc`\n\n作为超级用户将程序拷贝到 `/srv/www/cgi-bin` (OpenSuse) 或 `/usr/lib/cgi-bin` (Ubuntu)。\n\
  \n在浏览器中输入：[`localhost/cgi-bin/data4?red:blue:5:5:`](http://localhost/cgi-bin/data4?red%3Ablue%3A5%3A5)，你应该看到这个：\n\
  \n![](img/00019.jpeg)\n\n在这个程序中，我们获取 `argv[1]`（在这里是 `yellow:blue:5:5:`）并使用库函数 `strtok`\
  \ 对进行解析，该函数将字符串按任意字符 `:` 分割成标记（tokens），并使用这些标记作为字符串来指定颜色，使用整数来指定表格行和单元数。\n\n`atoi`\
  \ 函数将整数的字符串表示转换为整数（将“1”转换为 1）。\n\n`strtok` 函数有点奇怪，第一次调用它时传入要解析的字符串名称，而在随后的调用中，第一个参数变为\
  \ `NULL`。\n\n使用了 `for(…)` 循环机制来执行固定次数的操作。引入的 HTML 术语有：\n\n`<html>` `<body>` `<table>`\
  \ `<tr>` 表格行 `<td>` 表格单元## 2.5 数据与内存 – 结论\n\n我们使用了一些简单的数据类型来表示某些信息并向程序传输输入，并组织和显示某些视觉输出。\n\
  \n我们使用了嵌入在输出字符串中的 HTML，使输出在网络浏览器中可见。作为一个练习，尝试一下：\n\n编写一个程序放入你的 `/public_html/cgi-bin`\
  \ 文件夹中，它可以在浏览器中调用，名称为运动队或国家以及一系列颜色（可能指定十六进制，例如 `ff0000 = 红色 (rrggbb)`，用于球队颜色或地图颜色），并能显示一些合理的内容。我的版本看起来如下：\n\
  \n![](img/00020.jpeg)\n\n![](img/00021.jpeg)\n\n# 3 函数、指针和结构体\n\n## 3.1 函数\n\n我们所有程序的入口被称为\
  \ `main()`，这是一个函数，或者说是执行某些操作的代码，通常返回某些值。我们将程序结构化为函数，以防止它们变成一个屏幕或一个页面无法显示的长且不可读的代码块，并确保我们不会在到处都是重复的相同代码段。我们可以调用\
  \ C 语言内置的 `printf` 或 `strtok` 等库函数，也可以调用我们自己的或其他人的函数和函数库。我们必须确保适当的头文件存在并可被预处理器读取，并且源代码或编译后的库也存在且可访问。\n\
  \n正如我们之前学过的，数据的作用域限制在声明它的函数中，因此我们使用指向数据和数据块的指针来传递给我们希望对这些数据进行某些操作的函数。我们已经看到字符串被处理为指向以\
  \ `NULL` 结尾的单字符数组的指针。\n\n![](img/00022.jpeg)\n\n在这个示例中，我们可以反复调用函数 `doit`，它接收两个整数参数并返回某些数学计算的结果。\n\
  \n编译：`gcc -o func1 chapter3_1.c -lm`\n\n拷贝到 cgi-bin：`cp func1 /home/Cerberus/public_html/cgi-bin/func1`\n\
  \n（你应该使用提供的 Makefile，或者在学习进展过程中维护一个 Makefile，在进行的同时添加编译示例的目标。）\n\n![](img/00023.jpeg)\n\
  \n浏览器中的结果所示，调用方式为“func1?5:5”。\n\n在这种情况下，我们函数的参数是以拷贝的形式发送的，在函数内部不会被修改，而只是被使用。如果我们想实际修改变量，必须将其指针传递给函数。\n\
  \n![](img/00024.jpeg)\n\n我们通过 `&result` 传递变量 `result` 的地址，在 `doit` 函数中，我们通过 `*result`\
  \ 解引用指针以获取浮点数并在 `main` 之外修改它的值。这与 chapter3_1.c 的输出相同。\n\n## 3.2 库函数\n\nC 包含了许多用于执行任务的内置函数。到为止我们使用了\
  \ `atoi`、`printf`、`sizeof`、`strtok` 和 `sqrt`。要获取任何内置库函数的详细信息，我们只需要输入：\n\n### man\
  \ 3 atoi\n\n我们就会看到这些：\n\n![](img/00025.jpeg)\n\n这很好地告诉了关于该函数你需要的所有知识，如何使用它以及它的变体。最重要的是，它告诉了你应该包含哪个头文件。\n\
  \n## 3.3 库函数快速参考\n\n所有可用函数的详细信息可以在 [`www.gnu.org/software/libc/manual/`](http://www.gnu.org/software/libc/manual/)\
  \ 找到。\n\n![](img/00026.jpeg)\n\n在发现你需要做某事并因此寻找为此目的编写的函数或函数库之前，学习库函数是没有意义的。你需要理解签名\
  \ – 参数列表的含义以及如何使用它，以及函数将返回什么，或对作为指针传递的变量执行什么操作。\n\n## 3.4 数据结构\n\n\n\n\n有时我们希望将一组变量视为整体进行管理，也许是从数据库记录中获取所有值，并将整个记录在程序中传递以进行处理。为了实现这一点，我们可以将数据分组到结构中。\n\
  \n此程序使用 `struct` 来为一个名为“玩家（player）”的实体定义一组属性。`main` 函数包含一个拥有 5 个 `players` 数组的声明和实例化。我们依次将数组每个成员的指针传递给一个函数来对每一个进行排名。这使用了\
  \ `switch` 语句通过检查每个玩家名称的首字母来得出一个任意排名。然后，我们依次将数组每个成员的指针传递给一个打印详细信息的函数。\n\n![](img/00027.jpeg)\n\
  \n### 结构的结果与威力\n\n结果所示，按照 usual 在浏览器中显示：\n\n![](img/00028.jpeg)\n\n这是一种非常强大的技术，虽然相当高级，但你必须有所了解。结构思想直接引出了类和对象的概念。\n\
  \n我们可以看到，使用 `struct` 极大地简化了在程序中传递数据元素以完成不同任务的业务逻辑。如果我们对 `struct` 的定义进行更改，它仍然可以工作，我们只需要添加代码来处理新属性，而无需更改执行任务的函数的参数列表或签名。\n\
  \n结构的定义实际上并没有创建任何数据，它只是列出了我们可以实例化的对象的正式形状。在 `main` 函数中，我们可以以所示的形式表示这种实例化，创建一个符合我们所做定义的数据元素序列列表。\n\
  \n你可能已经看出，一个带有额外函数或方法的 `struct` 本质上就是 Java 中的 `class`，在 C++ 中也是如此。面向对象的语言就始于此，事实上，许多被描述为“面向对象”的早期系统实际上只是用\
  \ C 语言的 `structs` 构建的。\n\n例如，如果你看一眼 Apache 服务器的开发头文件，你会看到很多 `structs`，例如在 `httpd.h`\
  \ 的这段片段中：\n\n![](img/00029.jpeg)\n\n不要担心这些意味着什么——只需要注意到这是一种非常常见且强大的技术，而数据结构的设计（就像与其密切相关的数据库表设计一样）是你作为程序员需要理解的核心、关键且至关任务。\n\
  \n你做出了哲学上的决定，认为世界是这样的，并且可以以此方式进行建模。这是一项沉重的责任——在哲学中，这项工作被称为本体论（什么是存在？）和认识论（我们如何知道它？）。我打赌你从从未想过你正在做这些！\n\
  \n## 3.5 函数、指针与结构 – 结论\n\n我们使用了一些简单的数据类型来表示某些信息并向程序传输输入，并组织和显示了一些视觉输出。\n\n我们使用了嵌入在输出字符串中的\
  \ HTML 来使输出在网络浏览器中可见。我们学习了创建可复用的函数库。\n\n我们学习了数据结构以及使用指针在程序中传递它们的方法。\n\n### 练习：\n\
  \n使用 C 库函数创建一个程序，实现以下功能：\n* 以写模式打开一个文件\n* 将命令行参数写入文件\n* 关闭文件\n* 以读模式打开文件\n* 读取内容\n\
  * 关闭文件\n* 将这些内容打印到屏幕上\n\n这将让你获得发现问题、寻找合适的库函数以及在线或从书籍中寻找示例的经验。\n\n# 4 逻辑、循环与流程控制\n\
  \n## 4.1 C 流程控制的语法\n\n我们可以使用以下 C 结构来控制程序的执行。当我们能够通过计数来遍历一个序列或系列时：\n\n### for( 初始值;\
  \ 持续直到 ; 增量变化 )\n\n### { 执行这个; 执行那个; 再执行这个; }\n\n当我们等待某些条件的改变时：\n\n### while( 如果为真\
  \ )\n\n### { 执行这个; 执行那个; 再执行这个; }\n\n或者，如果我们想至少执行一次：\n\n```\ndo { 执行这个; 执行那个; 再执行这个;\
  \ } while (true)\n```\n\n进行测试：\n\n```c\nif (如果为真) { 执行这个; 执行那个; 再执行这个; }\n```\n\n\
  当我们只有一个选项时：\n\n```c\nif (如果为真) { 执行这个; 执行那个; 再执行这个; }\n```\n\n当我们有更多选项时：\n\n```c\n\
  if (如果为真) { 执行这个; 执行那个; 再执行这个; }\n```\n\n当我们根据整数或字符有更多选项时：\n\n```c\nswitch (value)\
  \ {\n    case 0: 执行这个; 执行那个; 再执行这个; break;\n    case n: 执行这个; 执行那个; 再执行这个; break;\n\
  \    default: 执行这个; 执行那个; 再执行这个; break;\n}\n```\n\n## 4.2 控制发生什么\n\n这部分完全关于 `if`、`else`\
  \ 以及我们如何控制执行。为了让 `QUERY_STRING` 有意义并并在其中找到特定的值，我们必须进行解析，将其切分成若干部分，为此我们需要一些条件逻辑（if,\
  \ else, 等）以及一些循环来遍历变量中的字符。执行此操作的基本函数理想情况下应该被创建，因为这是一个你可能需要重复执行的任务，所以拥有一段可以重复调用的代码是有意义的。\n\
  \n在下一个示例中，我们添加了这个函数，输出上的明显区别是，我们在解析后可以将提取出的值插入到 HTML 框中。我们似乎成功地创建了类似 `getParameter()`\
  \ 的函数——或者我们真的成功了吗？\n\n在第 1 章中，我们看到可以通过隐式的 `getenv()` 访问环境变量。\n\n![](img/0030.jpeg)\n\
  \n在这里我们显示 `QUERY_STRING`，除非在 `action` 属性中另有指定，否则这就是程序从表单获取的内容。HTML 表单默认使用 `GET`，将所有表单数据以\
  \ `&` 字符分隔的变量对的形式传输。\n\n![](img/0031.jpeg)\n\n在浏览器中调用此程序，我们看到了一个表单并可以在框中输入数据：\n\n\
  ![](img/0032.jpeg)\n\n在提交表单后，我们看到：\n\n![](img/0033.jpeg)\n\n如果我在第一个字段中输入 CERBERUS\
  \ !!!：\n\n![](img/0035.jpeg)\n\n我得到了这个结果：\n\n![](img/0036.jpeg)\n\n空格字符变成了 `+`，而\
  \ `!` 变成了 `%21`。\n\n\n\n\n\n这种编码发生是因为某些字符在传输协议本身中被显式使用。例如，`&` 用于分隔 `QUERY_STRING`\
  \ 的不同部分，而空格无法原样直接发送。\n\n任何想要使用来自 `HTML` 表单信息的程序都必须能够解码这些内容，而我们现在正尝试这样做。\n\n程序 `chapter4_2.c`\
  \ 完成了我们目前为止看到的工作。它在同一个文件中包含一个 `main` 函数和一个 `decode_value` 函数。\n\n`decode_value`\
  \ 函数接收三个参数：\n1. 我们要查找的值的名称，例如 `\"ITEM1=\"` 或 `\"ITEM2=\"`\n2. 如果找到该值，则准备将其存入的变量地址\n\
  3. 要拷贝的最大字符数\n\n该函数在 `QUERY_STRING` 中查找值的起始和结束位置，然后将找到的字符逐个拷贝到 `value` 变量中，并添加一个\
  \ `NULL` 字符结束字符串。\n\n![](img/00037.jpeg)\n\n### 分解\n\n看起来我们需要对这个 `decode_value`\
  \ 包进行一些实质性的工作，因为这项工作我们预计需要反复执行，所以编写一个可以重用的函数是有意义的。\n\n首先，我们可以将此函数放入一个名为 `decode_value.c`\
  \ 的单独文件中，并为我们可能编写的所有函数创建一个名为 `c_in_linux.h` 的文件，并将所有内容编译成库。在 `Makefile` 中，我们可以添加：\n\
  \n![](img/00038.jpeg)\n\n这看起来很糟糕且复杂，但它的意思是：输入 `make all` 将：\n- 编译 `OBJ_SRC` 列表中列出的所有\
  \ `*.c` 文件为对象文件 `*.o`\n- 将所有对象文件编译成名为 `lib_c_in_linux.a` 的库归档文件\n- 使用这个新归档编译 `chapter4-4`。\n\
  \n这是我们将使用的模型，以保持文件尽可能小，并将代码的共享性最大化。\n\n我们现在可以有一个更简单的 `\"main\"` 函数文件，以及一些我们可能想要从任何地方调用的函数文件（尽管我们目前还不知道具体有哪些）。所有这些内容都组织在一个库文件中（归档为\
  \ `*.a`）——这些也可以被编译为动态加载的共享对象 `*.so`，它们非常像 Windows 的 `DLLs`。这正是所有 Linux 软件编写和交付的方式。\n\
  \n例如，`MySQL` C 应用程序接口 (API) 包含：\n- `/usr/include/mysql` 中的所有头文件\n- 库文件 `/usr/lib/mysql/libmysqlclient.a`\n\
  \n我们所做的实际上是整个 Linux 的组合方式——我们只是以相同的方式向其添加内容。\n\n我们的主文件现在看起来像：\n\n![](img/00039.jpeg)\n\
  \n这段代码以相同的方式调用函数 `decode_value`，但因为库 `c_in_linux.a` 在编译时被链接了，并且它可以访问列出库中所有函数的头文件\
  \ `c_in_linux.h`，所以一切都能正常工作。\n\n尝试用伪代码描述解码此 `QUERY_STRING` 的过程：\n1. 获取 `QUERY_STRING`\n\
  2. 在内部查找搜索字符串 `\"ITEM1=\"`\n3. 查找 `\"ITEM1=\"`值的结尾\n4. 将值拷贝到我们的 `\"value\"` 变量中，翻译一些奇怪的代码，例如：\n\
  \   - `%21` 是 `!`\n   - `%23` 是 `#`\n\n这些特殊代码是由浏览器生成的，以便你在 HTML 表单中输入的任何内容都能安全地传输，而不会干扰\
  \ HTTP 协议。这类代码有很多，本章的任务就是完成这项任务，以便键盘上的每一个按键都能像你预期的那样工作！！\n\n程序 `chapter4_3.c` 调用了这个未完成的函数\
  \ `decode_value`，到目前它只能处理空格字符和 `!` —— 它在一段条件逻辑中使用 `if`、`else`、`for` 以及库函数 `getenv`、`strcpy`、`strlen`、`strstr`，通过分析字符串来查找特定项目，然后将该项目拷贝到传递它的名为\
  \ `value` 的内存块中。\n\n结果显示解码后的值粘贴在了第一个字段中；\n\n![](img/00040.jpeg)\n![](img/00041.jpeg)\n\
  \n## 4.3 逻辑、循环和流程结论\n\n控制程序流程最重要的部分是对你正在尝试做什么有一个清晰的思路。我们还学习了如何将代码拆分成易管理的块，并开始构建和使用我们自己的库和头文件。\n\
  \n能够用普通的语言或伪代码表达一个过程是有用的，并帮助你将代码拆解成步骤。\n\n- 使用 `for` 循环显式计数已知有终点的项。\n- 使用 `while`\
  \ 和 `do...while` 循环执行操作，直到某些条件改变。\n- 当整数或单个字符决定下一步操作时使用 `switch` 语句。\n- 当可以顺序测试互斥的情况时使用\
  \ `if`、`else if` 和 `else`。\n\n复杂的 `if`、`else` 和 `not` (`!`) 条件判断组合可能会变得不可读。使用大括号\
  \ `{ }` 将它们分成块。\n\n### 练习\n现在有一个用的任务是完成 `decode_value` 函数，这样你就有了一个实用的工具从 HTML 表单中获取网页内容，解码键盘上所有的字母数字键。你将反复使用这个练习，所以将其做好是值得的。\n\
  \n# 5 使用 MySQL 处理数据库\n\n## 5.1 不要重复造轮子\n\n每个项目都从从零开始是不明智的，因此我们在前人走过的道路的基础上进行构建。我们正在使用的所有\
  \ `C` 库都是由处理更底层碎片代码的人编写的，如果我们愿意，可以访问并修改这些代码。这就是开放系统（Open Systems）的意义。在实践中，我们只想使用可靠的服务，我们将使用的前两个是无处不在的——数据库访问和图形生成。\n\
  \n## 5.2 MySQL API\n\n为了访问 MySQL 函数集，我们确保编译器可以访问头文件和库，并只需调用一些我们不需要编写的函数。在下一个示例中，我们将数据库代码与上一次的工作结合，并将解码后的数据插入数据库，然后读取我们目前获得的内容。\n\
  \n在一个新的终端窗口中，输入：\n\n```\nmysql test\ncreate table C (ITEM1 varchar(255),ITEM2 varchar(255));\n\
  ```\n\n这会在已经存在的测试数据库中创建一个供程序写入的表。\n\n如果成功，看起来应该是这样的：\n\n![](img/00042.jpeg)\n\n\
  定义的类型 `MYSQL`、`MYSQL_RES` 和 `MYSQL_ROW` 是预处理器定义，代表 `mysql.h` 中更复杂的 C 声明，我们只需要知道如何调用它们。MySQL\
  \ 提供了执行更复杂操作所需的所有信息。\n\n![](img/0043.jpeg)\n\n都理解了吗？\n\n在短短 10 行（高亮部分）C 代码中，我们就将数据插入了数据库表并可以再次读取它，这非常省力。通过\
  \ `mysql_init` 我们获得一个类型为 `MYSQL` 的数据结构指针，然后可以使用 `mysql_options` 和 `mysql_real_connect`\
  \ 连接到测试数据库，然后像在终端会话中一样执行 SQL 语句。查询结果可以通过 `mysql_use_results` 以 `MYSQL_ROW` 字符串数组的形式检索。我们使用\
  \ `mysql_free_result` 释放使用的内存并使用 `mysql_close` 关闭数据库。\n\n\n\n\n\n[`dev.mysql.com/doc/refman/5.1/en/index.html`](http://dev.mysql.com/doc/refman/5.1/en/index.html)\n\
