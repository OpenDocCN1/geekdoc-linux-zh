  \ GD 库绘制图形\n\n动态生成适应情况的有趣图像是一项愉快、具有挑战性且有回报的编程类型。我们将使用 Thomas Boutell 的 GD C 库，该库作为一个开放系统项目已经存在多年。\n\
  \n## 6.1 生成二进制内容\n\n在这里，我们创建一张图像并向其中打印 `QUERY STRING` 中 `TEXT=` 部分的值，并将内容类型设置为 `image/gif`。`gdImageGif`\
  \ 函数将二进制图像写入 `stdout`（即输出流）而不是文件，因此二进制图像数据会被发送回浏览器。\n\n![](img/00045.jpeg)\n\n当使用\
  \ `cgi-bin/gdgraph1?TEXT=Cerberus` 调用该程序时，会产生此输出：\n\n![](img/00046.jpeg)\n\n虽然这不是一个最华丽或吸引人的练习，但它至少演示了生成图形输出涉及的关键原理。通过\
  \ GD 库，你可以加载现有图像并生成多种格式（如 GIF、JPEG、PNG、WMBP），甚至创建动画 GIF。\n\n如果你用过 PHP 开发工具，你会发现这些\
  \ GD 库函数非常熟悉，因为它们几乎完全相同，这表明在 particular 情况下 PHP 是对同一个 C 库的封装。\n\n这里显示的文本使用的是内部字体之一，即\
  \ Tiny、Small、Medium Bold、Large 和 Giant，这些字体对于简单的标记足够了，但你也可以使用 TrueType 字体获得更吸引人的输出。\n\
  \n可以创建带有线条或特定样式的几何图形、填充和空多边形，以及圆、弧。需要记住的主要点是，图像的原点是左上角，这对于任何学过数学的人来说可能都不符合直觉——至于为什么如此我从未发现，但只能想象第一个在该领域做任何事情的程序员恰好不知道图表（在图表中，我们认为原点\
  \ `x=0, y=0` 在左下角）。\n\n颜色以 0 到 255 范围 RGB 值指定，因此白色为 255,255,255，红色为 255,0,0。要计算精细的色调，可以使用像\
  \ GNU GIMP 这样的图形工具，它带有颜色选择器，你可以找到微妙的 RGB 值。一张图像的调色板可以使用另一张图像，如果有空间分配，可以使用请求或创建的调色中最接近的颜色。\n\
  \n## 6.2 使用 TrueType 字体\n\n在这个示例中，我们修改了之前的程序以使用 TrueType 字体生成标签。\n\n![](img/00047.jpeg)\n\
