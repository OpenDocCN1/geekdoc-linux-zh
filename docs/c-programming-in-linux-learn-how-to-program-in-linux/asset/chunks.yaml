  trans: "\n有时我们希望将一组变量视为整体进行管理，也许是从数据库记录中获取所有值，并将整个记录在程序中传递以进行处理。为了实现这一点，我们可以将数据分组到结构中。\n\
    \n此程序使用 `struct` 来为一个名为“玩家（player）”的实体定义一组属性。`main` 函数包含一个拥有 5 个 `players` 数组的声明和实例化。我们依次将数组每个成员的指针传递给一个函数来对每一个进行排名。这使用了\
    \ `switch` 语句通过检查每个玩家名称的首字母来得出一个任意排名。然后，我们依次将数组每个成员的指针传递给一个打印详细信息的函数。\n\n![](img/00027.jpeg)\n\
    \n### 结构的结果与威力\n\n结果所示，按照 usual 在浏览器中显示：\n\n![](img/00028.jpeg)\n\n这是一种非常强大的技术，虽然相当高级，但你必须有所了解。结构思想直接引出了类和对象的概念。\n\
    \n我们可以看到，使用 `struct` 极大地简化了在程序中传递数据元素以完成不同任务的业务逻辑。如果我们对 `struct` 的定义进行更改，它仍然可以工作，我们只需要添加代码来处理新属性，而无需更改执行任务的函数的参数列表或签名。\n\
    \n结构的定义实际上并没有创建任何数据，它只是列出了我们可以实例化的对象的正式形状。在 `main` 函数中，我们可以以所示的形式表示这种实例化，创建一个符合我们所做定义的数据元素序列列表。\n\
    \n你可能已经看出，一个带有额外函数或方法的 `struct` 本质上就是 Java 中的 `class`，在 C++ 中也是如此。面向对象的语言就始于此，事实上，许多被描述为“面向对象”的早期系统实际上只是用\
    \ C 语言的 `structs` 构建的。\n\n例如，如果你看一眼 Apache 服务器的开发头文件，你会看到很多 `structs`，例如在 `httpd.h`\
    \ 的这段片段中：\n\n![](img/00029.jpeg)\n\n不要担心这些意味着什么——只需要注意到这是一种非常常见且强大的技术，而数据结构的设计（就像与其密切相关的数据库表设计一样）是你作为程序员需要理解的核心、关键且至关任务。\n\
    \n你做出了哲学上的决定，认为世界是这样的，并且可以以此方式进行建模。这是一项沉重的责任——在哲学中，这项工作被称为本体论（什么是存在？）和认识论（我们如何知道它？）。我打赌你从从未想过你正在做这些！\n\
    \n## 3.5 函数、指针与结构 – 结论\n\n我们使用了一些简单的数据类型来表示某些信息并向程序传输输入，并组织和显示了一些视觉输出。\n\n我们使用了嵌入在输出字符串中的\
    \ HTML 来使输出在网络浏览器中可见。我们学习了创建可复用的函数库。\n\n我们学习了数据结构以及使用指针在程序中传递它们的方法。\n\n##### 练习：\n\
    \n使用 C 库函数创建一个程序，实现以下功能：\n* 以写模式打开一个文件\n* 将命令行参数写入文件\n* 关闭文件\n* 以读模式打开文件\n* 读取内容\n\
    * 关闭文件\n* 将这些内容打印到屏幕上\n\n这将让你获得发现问题、寻找合适的库函数以及在线或从书籍中寻找示例的经验。\n\n# 4 逻辑、循环与流程控制\n\
    \n## 4.1 C 流程控制的语法\n\n我们可以使用以下 C 结构来控制程序的执行。当我们能够通过计数来遍历一个序列或系列时：\n\n##### for(\
    \ 初始值; 持续直到 ; 增量变化 )\n\n##### { 执行这个; 执行那个; 再执行这个; }\n\n当我们等待某些条件的改变时：\n\n#####\
    \ while( 如果为真 )\n\n##### { 执行这个; 执行那个; 再执行这个; }\n\n或者，如果我们想至少执行一次：\n\n```\ndo\
    \ { 执行这个; 执行那个; 再执行这个; } while (true)\n```\n\n进行测试：\n\n```c\nif (如果为真) { 执行这个;\
    \ 执行那个; 再执行这个; }\n```\n\n当我们只有一个选项时：\n\n```c\nif (如果为真) { 执行这个; 执行那个; 再执行这个; }\n\
    ```\n\n当我们有更多选项时：\n\n```c\nif (如果为真) { 执行这个; 执行那个; 再执行这个; }\n```\n\n当我们根据整数或字符有更多选项时：\n\
    \n```c\nswitch (value) {\n    case 0: 执行这个; 执行那个; 再执行这个; break;\n    case n: 执行这个;\
    \ 执行那个; 再执行这个; break;\n    default: 执行这个; 执行那个; 再执行这个; break;\n}\n```\n\n## 4.2\
    \ 控制发生什么\n\n这部分完全关于 `if`、`else` 以及我们如何控制执行。为了让 `QUERY_STRING` 有意义并并在其中找到特定的值，我们必须进行解析，将其切分成若干部分，为此我们需要一些条件逻辑（if,\
    \ else, 等）以及一些循环来遍历变量中的字符。执行此操作的基本函数理想情况下应该被创建，因为这是一个你可能需要重复执行的任务，所以拥有一段可以重复调用的代码是有意义的。\n\
    \n在下一个示例中，我们添加了这个函数，输出上的明显区别是，我们在解析后可以将提取出的值插入到 HTML 框中。我们似乎成功地创建了类似 `getParameter()`\
    \ 的函数——或者我们真的成功了吗？\n\n在第 1 章中，我们看到可以通过隐式的 `getenv()` 访问环境变量。\n\n![](img/0030.jpeg)\n\
    \n在这里我们显示 `QUERY_STRING`，除非在 `action` 属性中另有指定，否则这就是程序从表单获取的内容。HTML 表单默认使用 `GET`，将所有表单数据以\
    \ `&` 字符分隔的变量对的形式传输。\n\n![](img/0031.jpeg)\n\n在浏览器中调用此程序，我们看到了一个表单并可以在框中输入数据：\n\
    \n![](img/0032.jpeg)\n\n在提交表单后，我们看到：\n\n![](img/0033.jpeg)\n\n如果我在第一个字段中输入 CERBERUS\
    \ !!!：\n\n![](img/0035.jpeg)\n\n我得到了这个结果：\n\n![](img/0036.jpeg)\n\n空格字符变成了 `+`，而\
    \ `!` 变成了 `%21`。\n\n"
- fmt: "\nThis encoding occurs because certain characters are explicitly used in the\
    \ transmission protocol itself. For example, the `&` is used to separate portions\
    \ of the `QUERY_STRING` and the space cannot be sent at all as it is.\n\nAny program\
    \ wishing to use information from the `HTML` form must be able to decode all this\
    \ stuff which will now attempt to do.\n\nThe program `chapter4_2.c` accomplishes\
    \ what we see so far. It has a `main` function and a `decode_value` function all\
    \ in the same file.\n\nThe `decode_value` function takes three arguments:\n1.\
    \ the name of the value we are looking for `\"ITEM1=\"` or `\"ITEM2=\"`\n2. the\
    \ address of the variable into which we are going to put the value if found\n\
    3. the maximum number of characters to copy\n\nThe function looks for the start\
    \ and end positions in the `QUERY_STRING` of the value and then copies the characters\
    \ found one by one to the `value` variable, adding a `NULL` char to terminate\
    \ the string.\n\n![](images/00037.jpeg)\n\n### Decomposition\n\nIt looks like\
    \ we are going to have to do some serious work on this `decode_value` package\
    \ so as this is work we can expect to do over and over again it makes sense to\
    \ write a function that can be reused.\n\nFirst off we can put this function into\
    \ a separate file called `decode_value.c` and create a file for all the functions\
    \ we may write called `c_in_linux.h` and compile all this into a library. In the\
    \ `Makefile` we can add:\n\n![](images/00038.jpeg)\n\nThis looks horrible and\
    \ complex but all it means is this: typing `make all` will:\n- compile all the\
    \ `*.c` files listed in the list `OBJ_SRC` and into object files `*.o`\n- compile\
    \ all the object files into a library archive called `lib_c_in_linux.a`\n- compile\
    \ `chapter4-4` using this new archive.\n\nThis is the model we will use to keep\
    \ our files as small as possible and the share-ability of code at its maximum.\n\
    \nWe can now have a simpler `\"main\"` function file, and files for stuff we might\
    \ want to write as call-able functions from anywhere really which we do not yet\
    \ know about. All this is organized into a library file (`*.a` for archive) –\
    \ these can also be compiled as dynamically loadable shared objects `*.so` which\
    \ are much like Windows `DLLs`. This is exactly how all Linux software is written\
    \ and delivered.\n\nFor example, the `MySQL` C Application Programmers Interface\
    \ (API) comprises:\n- all the header files in `/usr/include/mysql`\n- the library\
    \ file `/usr/lib/mysql/libmysqlclient.a`\n\nWhat we are doing really is how all\
    \ of Linux is put together – we are simply adding to it in the same way.\n\nOur\
    \ main file now looks like this:\n\n![](images/00039.jpeg)\n\nThis code calls\
    \ the function `decode_value` in the same way but because the library, `c_in_linux.a`\
    \ was linked in when it was compiled and as it has access to the header file `c_in_linux.h`\
    \ that lists all the functions in the library it all works properly.\n\nTry to\
    \ describe the process in pseudocode of decoding this `QUERY_STRING`:\n1. get\
    \ the `QUERY_STRING`\n2. find the search string `\"ITEM1=\"` inside it\n3. look\
    \ for the end of the value of `\"ITEM1=\"`\n4. copy the value to our `\"value\"\
    ` variable, translating funny codes such as:\n   - `%21` is `!`\n   - `%23` is\
    \ `#`\n\nThese special codes are generated by the browser so that whatever you\
    \ put in an HTML form will get safely transmitted and not mess about with the\
    \ HTTP protocol. There are lot of them and the task for this chapter is to finish\
    \ this task off so that EVERY key on your keyboard works as you think it should!!\n\
    \nProgram `chapter4_3.c` calls this unfinished function `decode_value` which this\
    \ far can only cope with the space character and `!` – it uses `if` and `else`\
    \ and and `for` and the library function `getenv`, `strcpy`, `strlen`, `strstr`\
    \ in a piece of conditional logic in which a string is analyzed to find a specific\
    \ item and this thing then copied into a piece of memory called `value` which\
    \ has been passed to it.\n\nThe result shows the decoded value pasted into the\
    \ first field;\n\n![](images/00040.jpeg)\n![](images/00041.jpeg)\n\n## 4.3 Logic,\
    \ loops and flow conclusion\n\nThe most important part of controlling the flow\
    \ of your program is to have a clear idea about what it is you are trying to do.\
    \ We have also learned to break our code up into manageable lumps, and started\
    \ to build and use a library and header file of our own.\n\nBeing able to express\
    \ a process in normal words or pseudocode is useful and helps you to break the\
    \ code into steps.\n\n- Use `for` loops to explicitly count through things you\
    \ know have an ending point.\n- Use `while` and `do...while` loops to do things\
    \ until some condition changes.\n- Use `switch` statements when integers or single\
    \ characters determine what happens next.\n- Use `if` and `else if` and `else`\
    \ when mutually exclusive things can be tested in a sequence.\n\nComplex sets\
    \ of `if` and `else` and `not` (`!`) conditionals can end up unreadable. Use braces\
    \ `{ }` to break it all up into chunks.\n\n##### Exercise\nA useful task now would\
    \ be to complete the function `decode_value` so you have a useful tool to grab\
    \ web content from HTML forms decoding all the non alpha-numeric keys on your\
    \ keyboard. You will use this exercise again and again so it is worth getting\
    \ it right.\n\n# 5 Database handling with MySQL\n\n## 5.1 On not reinventing the\
    \ wheel\n\nIt is pretty sensible to not start from scratch at every project so\
    \ we build on work done by others who came this way. All of the `C` libraries\
    \ we are using were written by someone from even lower level bits and pieces and\
    \ we can access and modify this code should we want to. This is what Open Systems\
    \ is all about. In practice we simply want to use reliable services, and the first\
    \ two we are going to use are ubiquitous – databases access and graphical generation.\n\
    \n## 5.2 MySQL API\n\nTo access the set of MySQL functions we make sure our compiler\
    \ can access the header and libraries and simply call some functions we have not\
    \ to write. In this next example we join the database code onto the last work\
    \ we did and insert the decoded data into a database, and read out what we have\
    \ so far.\n\nIn a new terminal window, we type:\n\n```\nmysql test\ncreate table\
    \ C (ITEM1 varchar(255),ITEM2 varchar(255));\n```\n\nThis creates a table for\
    \ the program to write to in the test database that should already be created.\n\
    \nIt looks like this if it works out:\n\n![](images/00042.jpeg)\n\nThe data types\
    \ declared `MYSQL`, `MYSQL_RES`, and `MYSQL_ROW` are preprocessor definitions\
    \ that stand for more complex C declarations in `mysql.h` and all we need is how\
    \ to call them. The documentation at MySQL provides all the information you will\
    \ need to do more complex operations.\n\n![](images/0043.jpeg)\n\nUnderstood all\
    \ that?\n\nIn barely 10 lines (highlighted) of C we have inserted our data into\
    \ a database table and can read it out again, which is pretty painless. With `mysql_init`\
    \ we obtain a pointer to a data structure of type `MYSQL`, we can then use this\
    \ to connect to the test database with `mysql_options` and `mysql_real_connect`,\
    \ then we execute SQL statements just as we would in a terminal session. The results\
    \ of a query can be retrieved as a sequence of `MYSQL_ROW` arrays of strings with\
    \ `mysql_use_results`. We free up the memory used with `mysql_free_result` and\
    \ close the database with `mysql_close`.\n"
