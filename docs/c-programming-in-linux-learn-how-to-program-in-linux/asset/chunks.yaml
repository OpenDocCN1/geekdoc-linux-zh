    If  you  take  a  look  for  example,  at  the  Apache  server  development  header  files  you  will  see  a  lot  of  structs
    for example in this fragment of  httpd.h:


    ![](images/00029.jpeg)


    Don’t  worry  about  what  this  all  means  –  just  notice  that  this  is  a  very  common  and  very  powerful
    technique, and the design of data structures, just like the design of database
    tables to which it is  closely related are the core, key, vital task for you to
    understand as a  programmer.


    You make the philosophical decisions that theworld is like thisand can be modelled
    in this way.  A heavy  responsibility  –  in  philosophy  this  work  is  called  ontology  (what  exists?)  and  epistemology  (how
    we can know about it?). I bet you never thought that this was what you were  doing!


    ## 3.5 Functions, pointers and structures – conclusion


    We  have  used  some  simple  data  types  to  represent  some  information  and  transmit  input  to  a  program  and
    to organize and display some visual  output.


    We  have  used  HTML  embedded  in  output  strings  to  make  output  visible  in  a  web  browser.  We
    have learned about creating libraries of functions for  reuse.


    We  have  learning  about  data  structures  and  the  use  of  pointers  to  pass  them  around  a  program.


    ##### Exercise:


    Using C library functions create a program  that:


    • opens a file in write  mode,


    • writes a command line argument to the  file


    • closes the  file


    • opens the file in read  mode


    • reads the  contents


    • closes the  file


    • prints this to the  screen


    This  will  give  you  experience  with  finding  things  out,  looking  for  suitable  library  functions,  and  finding
    examples on-line or from a  book.


    # 4 Logic, loops and flow  control


    ## 4.1 Syntax of C Flow of  control


    We can use the following C constructs to control program  execution. When we can
    count our way through a sequence or  series:


    ##### for(  initial  value;  keep  on  until  ;  incremental  change  )


    ##### {  do  this;  and  this;  and  this;  }


    When we are waiting for some condition to  change:


    ##### while(  this  is  true  )


    ##### {  do  this;  and  this;  and  this;  }


    or if we want to do something at least once then  test:


    ##### do  {  do  this;  and  this;  and  this;  } while(  this  is  true  )


    When we have a single option to  test:


    ##### if(  this  is  true  )


    ##### {  do  this;  and  this;  and  this;  }


    ##### else


    ##### {  do  this;  and  this;  and  this;  }


    When we have more options to  test:


    ##### if(  this  is  true  )


    ##### {  do  this;  and  this;  and  this;  } else  if  (  this  is  true  )


    ##### {  do  this;  and  this;  and  this;  }


    ##### else


    ##### {  do  this;  and  this;  and  this;  }


    When we have more options to test based on an integer or single character value:


    ##### switch(  on  an  integer  or  character  value  )


    ##### {


    ##### case  0:  do  this;  and  this;  and  this;  break; case  n:  do  this;  and  this;  and  this;  break;
    default:do  this;  and  this;  and  this;  break;


    ##### }


    ## 4.2 Controlling what happens and in which  order


    This part is all aboutif, andthen, andelseandtrueandfalse– the nuts and bolts
    of how we  express and  control  the  execution  of  a  program.  This  can  be  very  dry  and  dusty  material  so  to  make  it  more
    understandable  we  are  going  to  solve  a  problem  you  are  going  to  need  to  solve  to  do  any  interactive
    web work of any  complexity.


    We  will  build  something  we  can  use  in  order  to  provide  something  like  the  functionality  that  can  be
    obtained from typicalgetParameter(“ITEM1”)method in Java servlets or  $_REQUEST[“ITEM1”]
    function in  PHP.


    In Chapter 1 we saw that environment variables can be accessed by the implicit
    argument to the  main function. We can also use the library functiongetenv()to
    request the value of any named  environment variable.


    ![](images/00030.jpeg)


    Here  we  display  the  QUERY_STRING  which  is  what  the  program  gets  as  the  entire  contents  of  an  HTML
    form which contains NAME=VALUE pairs for all the named form  elements.


    An HTML form by default uses theGETmethod which transmits all form data back to
    the program  or page  that  contains  the  form  unless  otherwise  specified  in  an  action  attribute.  This  data  is  contained  in  the  QUERY_STRING  as  a  series  of  variable  =  value  pairs  separated  by  the  &  character.


    ![](images/00031.jpeg)


    Calling this program in a browser we see a form and can enter some data in the
    boxes:


    ![](images/00032.jpeg)


    And after submitting the form we  see:


    ![](images/00033.jpeg)


    To make much sense of the QUERY_STRING and find a particular value in it, we are
    going to have  to parseit, to chop it up into its constituent pieces and for this
    we will need someconditional logic  (if, else  etc.)  and  some  loop  to  count  through  the  characters  in  the  variable.  A  basic  function  to  do  this
    would ideally be created as this is a task you might need to do do again and again
    so it makes sense  to have a chunk of code that can be called over  again.


    In  the  next  example  we  add  this  function  and  the  noticeable  difference  in  the  output  is  that  we  can  insert  the  extracted  values  into  the  HTML  boxes  after  we  have  parsed  them.  We  seem  to  have  successfully
    created something like a java getParameter() function – or have  we?


    ![](images/00034.jpeg)


    Have a  good  long  look  at  chapter4_2.c  and  try  it  out  with  characters  other  than
    A-Z a-z  or  numerals  and  you will see something is not quite right. There is
    some kind of encoding going on  here!


    If  I  were  tp  type  CERBERUS !!!  into  the  first  field:


    ![](images/00035.jpeg)


    I get this  result:


    ![](images/00036.jpeg)


    Aspacecharacter has become a+and!has become  %21.'
