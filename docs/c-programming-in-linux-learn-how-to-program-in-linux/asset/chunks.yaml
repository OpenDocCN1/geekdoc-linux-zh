  trans: "\n\n这种编码发生是因为某些字符在传输协议本身中被显式使用。例如，`&` 用于分隔 `QUERY_STRING` 的不同部分，而空格无法原样直接发送。\n\
    \n任何想要使用来自 `HTML` 表单信息的程序都必须能够解码这些内容，而我们现在正尝试这样做。\n\n程序 `chapter4_2.c` 完成了我们目前为止看到的工作。它在同一个文件中包含一个\
    \ `main` 函数和一个 `decode_value` 函数。\n\n`decode_value` 函数接收三个参数：\n1. 我们要查找的值的名称，例如\
    \ `\"ITEM1=\"` 或 `\"ITEM2=\"`\n2. 如果找到该值，则准备将其存入的变量地址\n3. 要拷贝的最大字符数\n\n该函数在 `QUERY_STRING`\
    \ 中查找值的起始和结束位置，然后将找到的字符逐个拷贝到 `value` 变量中，并添加一个 `NULL` 字符结束字符串。\n\n![](img/00037.jpeg)\n\
    \n### 分解\n\n看起来我们需要对这个 `decode_value` 包进行一些实质性的工作，因为这项工作我们预计需要反复执行，所以编写一个可以重用的函数是有意义的。\n\
    \n首先，我们可以将此函数放入一个名为 `decode_value.c` 的单独文件中，并为我们可能编写的所有函数创建一个名为 `c_in_linux.h`\
    \ 的文件，并将所有内容编译成库。在 `Makefile` 中，我们可以添加：\n\n![](img/00038.jpeg)\n\n这看起来很糟糕且复杂，但它的意思是：输入\
    \ `make all` 将：\n- 编译 `OBJ_SRC` 列表中列出的所有 `*.c` 文件为对象文件 `*.o`\n- 将所有对象文件编译成名为 `lib_c_in_linux.a`\
    \ 的库归档文件\n- 使用这个新归档编译 `chapter4-4`。\n\n这是我们将使用的模型，以保持文件尽可能小，并将代码的共享性最大化。\n\n我们现在可以有一个更简单的\
    \ `\"main\"` 函数文件，以及一些我们可能想要从任何地方调用的函数文件（尽管我们目前还不知道具体有哪些）。所有这些内容都组织在一个库文件中（归档为\
    \ `*.a`）——这些也可以被编译为动态加载的共享对象 `*.so`，它们非常像 Windows 的 `DLLs`。这正是所有 Linux 软件编写和交付的方式。\n\
    \n例如，`MySQL` C 应用程序接口 (API) 包含：\n- `/usr/include/mysql` 中的所有头文件\n- 库文件 `/usr/lib/mysql/libmysqlclient.a`\n\
    \n我们所做的实际上是整个 Linux 的组合方式——我们只是以相同的方式向其添加内容。\n\n我们的主文件现在看起来像：\n\n![](img/00039.jpeg)\n\
    \n这段代码以相同的方式调用函数 `decode_value`，但因为库 `c_in_linux.a` 在编译时被链接了，并且它可以访问列出库中所有函数的头文件\
    \ `c_in_linux.h`，所以一切都能正常工作。\n\n尝试用伪代码描述解码此 `QUERY_STRING` 的过程：\n1. 获取 `QUERY_STRING`\n\
    2. 在内部查找搜索字符串 `\"ITEM1=\"`\n3. 查找 `\"ITEM1=\"`值的结尾\n4. 将值拷贝到我们的 `\"value\"` 变量中，翻译一些奇怪的代码，例如：\n\
    \   - `%21` 是 `!`\n   - `%23` 是 `#`\n\n这些特殊代码是由浏览器生成的，以便你在 HTML 表单中输入的任何内容都能安全地传输，而不会干扰\
    \ HTTP 协议。这类代码有很多，本章的任务就是完成这项任务，以便键盘上的每一个按键都能像你预期的那样工作！！\n\n程序 `chapter4_3.c`\
    \ 调用了这个未完成的函数 `decode_value`，到目前它只能处理空格字符和 `!` —— 它在一段条件逻辑中使用 `if`、`else`、`for`\
    \ 以及库函数 `getenv`、`strcpy`、`strlen`、`strstr`，通过分析字符串来查找特定项目，然后将该项目拷贝到传递它的名为 `value`\
    \ 的内存块中。\n\n结果显示解码后的值粘贴在了第一个字段中；\n\n![](img/00040.jpeg)\n![](img/00041.jpeg)\n\
    \n## 4.3 逻辑、循环和流程结论\n\n控制程序流程最重要的部分是对你正在尝试做什么有一个清晰的思路。我们还学习了如何将代码拆分成易管理的块，并开始构建和使用我们自己的库和头文件。\n\
    \n能够用普通的语言或伪代码表达一个过程是有用的，并帮助你将代码拆解成步骤。\n\n- 使用 `for` 循环显式计数已知有终点的项。\n- 使用 `while`\
    \ 和 `do...while` 循环执行操作，直到某些条件改变。\n- 当整数或单个字符决定下一步操作时使用 `switch` 语句。\n- 当可以顺序测试互斥的情况时使用\
    \ `if`、`else if` 和 `else`。\n\n复杂的 `if`、`else` 和 `not` (`!`) 条件判断组合可能会变得不可读。使用大括号\
    \ `{ }` 将它们分成块。\n\n##### 练习\n现在有一个用的任务是完成 `decode_value` 函数，这样你就有了一个实用的工具从 HTML\
    \ 表单中获取网页内容，解码键盘上所有的字母数字键。你将反复使用这个练习，所以将其做好是值得的。\n\n# 5 使用 MySQL 处理数据库\n\n## 5.1\
    \ 不要重复造轮子\n\n每个项目都从从零开始是不明智的，因此我们在前人走过的道路的基础上进行构建。我们正在使用的所有 `C` 库都是由处理更底层碎片代码的人编写的，如果我们愿意，可以访问并修改这些代码。这就是开放系统（Open\
    \ Systems）的意义。在实践中，我们只想使用可靠的服务，我们将使用的前两个是无处不在的——数据库访问和图形生成。\n\n## 5.2 MySQL API\n\
    \n为了访问 MySQL 函数集，我们确保编译器可以访问头文件和库，并只需调用一些我们不需要编写的函数。在下一个示例中，我们将数据库代码与上一次的工作结合，并将解码后的数据插入数据库，然后读取我们目前获得的内容。\n\
    \n在一个新的终端窗口中，输入：\n\n```\nmysql test\ncreate table C (ITEM1 varchar(255),ITEM2\
    \ varchar(255));\n```\n\n这会在已经存在的测试数据库中创建一个供程序写入的表。\n\n如果成功，看起来应该是这样的：\n\n![](img/00042.jpeg)\n\
    \n定义的类型 `MYSQL`、`MYSQL_RES` 和 `MYSQL_ROW` 是预处理器定义，代表 `mysql.h` 中更复杂的 C 声明，我们只需要知道如何调用它们。MySQL\
    \ 提供了执行更复杂操作所需的所有信息。\n\n![](img/0043.jpeg)\n\n都理解了吗？\n\n在短短 10 行（高亮部分）C 代码中，我们就将数据插入了数据库表并可以再次读取它，这非常省力。通过\
    \ `mysql_init` 我们获得一个类型为 `MYSQL` 的数据结构指针，然后可以使用 `mysql_options` 和 `mysql_real_connect`\
    \ 连接到测试数据库，然后像在终端会话中一样执行 SQL 语句。查询结果可以通过 `mysql_use_results` 以 `MYSQL_ROW` 字符串数组的形式检索。我们使用\
    \ `mysql_free_result` 释放使用的内存并使用 `mysql_close` 关闭数据库。\n\n"
