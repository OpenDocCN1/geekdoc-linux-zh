    6 Graphics with GD  library


    The  ability  to  generate  interesting  images  dynamically  to  suit  the  situation  is  an  enjoyable,  challenging,
    and rewarding type of programming. We will be using Thomas Boutell’s GD C library
    which has  been around for many years as an open systems  project.


    6.1 Generating binary  content


    Here we create an image and print into it the value of the TEXT= part of the QUERY
    STRING and  set our  content  type  to  image/gif.  The  gdImageGif  function  writes  the  binary  image  out  to  stdout  which  is
    the output stream instead of to a file, so binary image data is sent back to the
    browser.


    ![](images/00045.jpeg)


    The  program  produces  this  output  when  called  with  cgi-bin/gdgraph1?TEXT=Cerberus


    ![](images/00046.jpeg)


    While this is not the fanciest or attractive exercise but does at least demonstrate
    the key  principles involved  in  generating  graphical  output.  With  the  GD  library  you  can  load  existing  images  and  generate
    them  in  many  formats  such  as  GIF,  JPEG,  PNG,  WMBP  and  even  create  animated  GIFS.


    If you have used PHP development tools you will recognize the GD library functions
    as they are  pretty well identical showing that PHP is a wrapper in this case
    around the same C library.


    The text displayed here is using one of the internal fonts, Tiny, Small, Medium
    Bold, Large and  Giant which are adequate for simple labelling but you can also
    use TrueType fonts for more attractive  output.


    Geometric  drawing  with  lines  or  certain  styles,  filled  and  open  polygons,  and  circles,  arcs  can  be  created.
    The main thing to remember is that the origin of an image is theTOP left hand
    cornerwhich  might seem  unintuitive  to  anyone  who  has  studied  mathematics  –  quite  why  this  is  I  have  never  discovered
    but  can  only  imagine  that  the  first  programmer  to  do  anything  in  this  area  happened  to  not  know  about  graphs
    in which we think of the origin x=0, y=0 as being at the bottom left hand.


    Colors  are  specified  as  RGB  values  in  the  range  0  to  255  so  that  white  is  255,255,255  and  red  is  255,0,0\.
    To  work  out  fine-grained  hues  use  a  graphics  tool  like  GNU  GIMP  which  has  color  pickers  so  you  can
    find out subtle RGB values. Palettes of colors from one image can be used in another
    and the  closest color in a palette requested or created if there is space for
    it to be  allocated.


    6.2 Using TrueType  Fonts


    In this example we modify the previous program to generate a label using TrueType
    font.


    ![](images/00047.jpeg)


    We call this program as before with cgi-bin/gdgraph1?TEXT=C+PROGRAMMING+IN+LINUX


    to  get  this  kind  of  output  which  you  will  probably  see  is  more  likely  to  be  a  useful  kind  of  tool.  The
    location and contents of your systems fonts will vary but the code gives an  example:


    - OpenSuse  /usr/share/fonts/truetype/*.ttf


    - Ubuntu.  /usr/share/fonts/truetype/ttf-dejavu/*.ttf


    ![](images/00048.jpeg)


    To get any good at using a library like GD you have to be prepared to experiment
    and take a lot of  time to understand the function parameters, looking in great
    detail at the available documentation at:


    [http://www.boutell.com/gd](http://www.boutell.com/gd)


    6.3 GD function  reference


    A full detailed set of documentation is maintained at:  [http://www.boutell.com/gd](http://www.boutell.com/gd)


