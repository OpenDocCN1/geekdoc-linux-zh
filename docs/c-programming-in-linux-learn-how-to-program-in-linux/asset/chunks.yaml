    # 7 Apache C 模块


    ## 7.1 更安全的 C Web 应用程序


    在现实生活中，很少有 Web 管理员会梦想让任何人运行 C 程序作为 CGI 内容生成器，因为存在崩溃和核心转储的风险。然而，Apache 服务器本身是用
    C 语言编写的，其开发工具附带了一些简单的实用，允许你创建代码存根（code stubs），你可以将 C 程序放入其中，并在作为服务器的一部分加载时作为 Apache
    模块运行，并在某种“沙箱”中安全地管理。在这里，我们将一个早期的示例并转换为 Apache 模块。


    Apache2 开发库中包含一个名为 `apxs2` 的工具，可以调用它为程序生成代码存根，该程序可以编译成模块，并由 Apache Web 服务器加载和管理。这些模块可以执行各种任务，但在我们的案例中，我们将做一些类似于
    IIS 服务器中 ISAPI DLL 的工作。`apxs2` 工具的具体位置会根据你使用的 Linux 发行版而变化，但在 OpenSuse 上它的运行方式如下。


    在终端中输入：

    ```bash

    apxs2 -n labelmaker -g

    ```


    ![](img/00049.jpeg)


    这会创建一个你命名的名称（labelmaker）的文件夹、一个 `Makefile`、一个可以被 `Make` 工具使用的 `modules.mk` 文件，以及一个名为
    `mod_labelmaker.c` 的文件。


    生成的 C 文件类似于 Apache 的 "Hello World"。它看起来可能很复杂，但它确实提供了一个很长的解释性注释头，非常值得阅读。其核心思想是，当
    Apache 启动指定位置任何在服务器配置文件配置为需要加载的模块时，它们将被加载。`*_register_hooks` 函数列出了可以在 Apache 服务器过程中特定阶段调用的函数名称和签名。在这种情况下，如果调用了名称
    [`localhost/labelmaker`](http://localhost/labelmaker)，该模块将被请求处理 `*_handler` 函数中发生的任何情况。


    服务器的配置可能有点繁琐，但在 OpenSuse 中，我们必须将其添加到：


    ### /etc/apache2/sites-available/default

    ```apache

    <Location /labelmaker>

    SetHandler labelmaker

    </Location>

    ```


    并且在 `/etc/config.sys/apache2` 中，我们将我们的模块名称 `labelmaker` 添加到以逗号分隔的长列表中，行位于 `APACHE_MODULES="...,labelmaker"`
    现在进入 `labelmaker` 文件夹并输入：


    ```bash

    sudo axs2 -c -i mod_labelmaker.c sudo /etc/init.d/apache2 restart

    ```


    在浏览器中这样调用：


    ![](img/00050.jpeg)


    ![](img/00051.jpeg)


    ## 7.2 添加某些功能


    现在我们可以将第 6 章中为图形库的工作作为替换处理函数插进来（在代码 Chapter7_1.c 中有两个处理函数，其中一个被注释掉了）。请注意（高亮的的）对修改后的
    `decode_value` 函数的调用，它使用 `r->args` 指针来获取 QUERY_STRING 而不是 `getenv()`。此外 Apache
    处理输出的方式也有所不同——通过调用 `gdImageGifPtr` 获取图像字节数组的指针，然后由 `ap_rwrite` 函数输出数据。我们需要在输出调用后使用
    `gdFree` 释放指针。


