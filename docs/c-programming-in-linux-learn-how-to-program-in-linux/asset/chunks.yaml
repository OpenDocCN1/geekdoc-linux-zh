    Compile with `gcc -o hello4 chapter1_4.c` and `as` as superuser copy the program
    to `/srv/www/cgi-bin` (OpenSuse) or `/usr/lib/cgi-bin` (Ubuntu). You can run this
    from the terminal where you compiled it with `./hello4` and you will see a long
    list of environment variables. In the browser when you enter `http://localhost/cgi-bin/hello4`
    you will see a different set altogether.


    ![](images/00010.jpeg)


    ![](images/00011.jpeg)


    We will soon find out that `QUERY_STRING` is an important environment variable
    for using communicating with our program and in this case we see it has a value
    of “Cerberus+” or everything after the “?” in the URL we typed. It is a valid
    way to send information to a common gateway interface (CGI) program like `hello4`
    but we should restrict this to just one string. In our case we have used a “+”
    to join up two strings. If we typed: “Cerberus” the browser would translate this
