  trans: '

    关于 Apache 模块的清晰且简单的材料很少，但你可以先从在线文档开始：[`httpd.apache.org/docs/2.2/developer/`](http://httpd.apache.org/docs/2.2/developer/)


    最近一本值得阅读的书是 Nick Kew 出版的《Apache 模块教程》（The Apache Modules Book）。


    # 8 Ghost 项目


    ## 8.1 一个 PHP 网站生成器项目


    使用 `C` 编写短程序来自动处理繁琐的任务，或者完成那些需要在大笨重工具上花费数小时调整的操作（例如邮件合并），这将是你学到后最感到欣幸的事情之一。这个项目非常节省时间。`Ghost`
    是一个轻量级的 PHP 生成器，供你自定义。


    如果你发现自己一直在不断构建 PHP 网站，那么一种能够一次性生成所有参数传递、解码、表单构建和数据库管理代码将非常有用。像 `Ruby on Rails`
    这样的工具提供了这种功能，但设置和运行要复杂得多，而且你最终会发现还需要学习另一种语言才能继续下去。


    开始使用此工具最好的方法可能是编译并运行它。将 `ghost.zip` 源码解压到你的 `public_html` 文件夹中，这将创建一个名为 `ghost`
    的文件夹`Makefile` 包含一个目标 `g1`，它可以编译并链接 `ghost`。因此，进入 `public_html/ghost` 并输入：`make
    g1`。


    运行网站生成器输入：


    ```bash

    ./ghost testwebsite data1 data2 data1 data3 data4 data6 data6

    ```


    - 这将创建：

    - 一个文件夹 `public_html/testwebsite`

    - 一个名为 `testwebsite` 的 `mysql` 数据库表，带有文本字段 `data1 data2 data1 data3 data4 data6
    data6`

    - 一个 `testwebsite.css` 文件

    - 空的 `header.html` 和 `footer.html` 页面

    - 一个 `index.php`，它演示了如何对指定的数据项进行数据库表的表单输入处理、编辑、更新和删除。


    在浏览器中，你看到的是 [`localhost/~yourname/testwebsite`](http://localhost/%7Eyourname/testwebsite)


    ![](img/00054.jpeg)


    这背后的思想是，创建和管理表单内容的所有机械性工作已完成，并且可以自定义。这张截图显示了提交一条记录的结果。顶行用于输入新数据，下几行允许对记录进行编辑或删除。这是一个允许你提取并应用到自己网站设计中的框架。


    让我们分段检查这些代码。


    第一部分声明了所需的数据并创建了文件夹和 CSS 文件。


    ![](img/00055.jpeg)


    接下来生成 `header.html` 和 `footer.html` 文件。这些文件由 `PHP` 文件加载，可以作为通用的公共头部和页脚。CSS 文件在
    `header.html` 文件中引用。


    ![](img/00056.jpeg)


    接下来我们创建数据库。


    ![](img/00057.jpeg)


    复杂的部分现在开始，即生成 `php` 脚本。理解此点的最好方法是在浏览器中查看页面源代码时检查程序的实际输出。


    顶行是一个表单，其中为运行 `ghost` 程序生成的表中的每一列都有一个文本框。


    ![](img/00058.jpeg)


    对于表中的每一行，我们现在生成一个允许编辑数据的表单和一个用于执行删除操作的锚链接。


    ![](img/00059.jpeg)


    仔细检查 `index.php` 文件将让你看到这一切发生在哪里，并能反推找到在 `ghost.c` 源码中生成这些 `PHP` 代码的地点。一个好主意是在打印件上使用荧光笔，因为我们把一种语言（`HTML`）嵌入另一种语言（`PHP`）中，而后者又在另一种语言内部，因此非常小心地使用转义字符
    `\` 在需要的地方表示单引号和双引号，以确保这一切正常运行。这看起来可能很复杂——但 `ghost` 允许快速原型，使得花时间自定义 `C` 代码是值得的，这样你想要的
    `PHP` 和数据库就能按照你的要求生成。


    这里是 `PHP` 文件 `index.php` 中生成编辑或删除行的部分。静态 HTML 被高亮显示，其他部分通过 `MySQL PHP` 函数调用插入。


    ![](img/00060.jpeg)


    如你所见，大量繁琐且重复的工作已经实现了自动化。你可以通过修改 `PHP` 代码继续进行，或者深入自定义生成所有这些内容的 `C` 程序。


    我个人经常使用 `ghost` 来节省构建网站的时间，这就是我编写它的原因。我厌倦了编写几乎完全相同的的代码来解码 `HTML` 表单并填充或更新数据库。

    '
