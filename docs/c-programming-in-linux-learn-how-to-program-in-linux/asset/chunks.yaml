    # 8 The Ghost project


    ## 8.1 A PHP web site generator project


    The ability to write short programs in `C` to automate tedious tasks or to do
    things that would otherwise take hours of fiddling about with cumbersome tools
    such as doing mail-merge, is one of the things you will be most pleased you have
    learned how to do. This project is such a time-saver. `Ghost` is a lightweight
    PHP generator for you to customize.


    If you find yourself having to build PHP web sites all the time, a quick way to
    generate all the parameter-passing, decoding, forms building and database management
    code in one step would be useful. Tools like `Ruby on Rails` offer such functionality
    but are infinitely more complex to set up and run and you end up with needing
    to learn yet another language to go any further.


    Probably the best way to start with this tool is to compile and run it. Unzip
    the `ghost.zip` source into your `public_html` folder which creates a folder called
    `ghost`. The `Makefile` contains a target `g1` that compiles and links `ghost`.
    So go to `public_html/ghost` and type: `make g1`.


    To run the site generator type:


    ```bash

    ./ghost testwebsite data1 data2 data1 data3 data4 data6 data6

    ```


    - This will create:

    - a folder `public_html/testwebsite`

    - a `mysql` database table called `testwebsite` with text fields `data1 data2
    data1 data3 data4 data6 data6`

    - a `testwebsite.css` file

    - empty `header.html` and `footer.html` pages

    - `index.php` that demonstrates a form handling entry, edit & update, and delete
    to the database table for the data items specified.


    In a browser what you see is this at [http://localhost/~yourname/testwebsite](http://localhost/%7Eyourname/testwebsite)


    ![](images/00054.jpeg)


    The idea behind this is that all the mechanical bits to create and manage the
    form content are done and can be customized. This screen shot shows the result
    of submitting one record. The top row is for entering new data, the lower row(s)
    allow editing or deleting of records. It is a framework that allows you to take
    and use parts in your own website design.


    Let us examine this code in sections.


    The first section declares the required data and creates the folder and CSS file.


    ![](images/00055.jpeg)


    Next the `header.html` and `footer.html` files are generated. These files are
    loaded by the `PHP` file and could be used as a generic common header and footers.
    The CSS file is referenced from the `header.html` file.


    ![](images/00056.jpeg)


    Next we create the database.


    ![](images/00057.jpeg)


    The complicated part starts now, of generating a `php` script. The best way to
    understand this is to examine the actual output of the program when we view the
    source of the page in the browser.


    The top row is a form with a text box for each column defined in the table generated
    by running the `ghost` program.


    ![](images/00058.jpeg)


    For each row in the table we now generate a form allowing editing of the data
    and an anchor link to do a delete operation.


    ![](images/00059.jpeg)


    Close examination of the file `index.php` will allow you to see where all this
    happens, and to work backward to find where in the `ghost.c` source code this
    `PHP` code is generated. A good idea is to use a highlighter pen on a printout
    as we are embedding a language (`HTML`) inside another language (`PHP`) which
    is in turn inside another language so very careful use is made of the escape characters
    `\` to express quotation marks both single and double where necessary to make
    it all work. This may seem complex – but the speedy prototyping that `ghost` permits
    makes it worthwhile to spend time customizing the `C` code so the `PHP` that you
    want and the database you want come out the way you want it.


    Here is the part of the `PHP` file `index.php` which generates the edit or delete
    rows. The static HTML is highlighted and the other parts are inserted by `MySQL
    PHP` function calls.


    ![](images/00060.jpeg)


    As you can see a great deal of tedious and repetitive work has been automated.
    You can move on by modifying the `PHP` code or go deeper to customize the `C`
    program which generates all of it.


    I personally use `ghost` frequently to save time on site-building and this is
    why I wrote it. I got bored making mistakes writing virtually identical code to
    decode `HTML` forms and populate or update databases.

