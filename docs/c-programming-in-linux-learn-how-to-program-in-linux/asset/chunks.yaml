    # 3 Functions, pointers and structures


    ## 3.1 Functions


    The entry point into all our programs is called `main()` and this is a function,
    or a piece of code that does something, usually returning some value. We structure
    programs into functions to stop them become long unreadable blocks of code than
    cannot be seen in one screen or page and also to ensure that we do not have repeated
    identical chunks of code all over the place. We can call library functions like
    `printf` or `strtok` which are part of the C language and we can call our own
    or other peoples functions and libraries of functions. We have to ensure that
    the appropriate header file exists and can be read by the preprocessor and that
    the source code or compiled library exists too and is accessible.


    As we learned before, the scope of data is restricted to the function in which
    is was declared, so we use pointers to data and blocks of data to pass to functions
    that we wish to do some work on our data. We have seen already that strings are
    handled as pointers to arrays of single characters terminated with a `NULL` character.


    ![](images/00022.jpeg)


    In this example we can repeatedly call the function `doit` that takes two integer
    arguments and reurn the result of some mathematical calculation.


    Compile: `gcc -o func1 chapter3_1.c -lm`


    Copy to cgi-bin: `cp func1 /home/Cerberus/public_html/cgi-bin/func1`


    (You should be using the Makefile supplied or be maintaining a Makefile as you
    progress, adding targets to compile examples as you go.)


    ![](images/00023.jpeg)


    The result in a browser looks like this called with “func1?5:5”.


    In this case the arguments to our function are sent as copies and are not modified
    in the function but used. If we want to actual modify a variable we would have
    to send its pointer to a function.


    ![](images/00024.jpeg)


    We send the address of the variable `result` with `&result`, and in the function
    `doit` we de-reference the pointer with `*result` to get at the float and change
    its value, outside its scope inside main. This gives identical output to chapter3_1.c.


    ## 3.2 Library Functions


    C contains a number of built-in functions for doing used tasks. So far we have
    used `atoi`, `printf`, `sizeof`, `strtok`, and `sqrt`. To get full details of
    any built-in library function all we have to do is type for example:


    ##### man 3 atoi


    and we will see all this:


    ![](images/00025.jpeg)


    Which pretty-well tells you everything you need to know about this function and
    how to use it and variants of it. Most importantly it tells you which header file
    to include.


    ## 3.3 A short library function reference


    Full details of all the functions available can be found at [http://www.gnu.org/software/libc/manual/](http://www.gnu.org/software/libc/manual/)


    ![](images/00026.jpeg)


    There is no point in learning about library functions until you find you need
    to do something which then leads you to look for a function or a library of functions
    that has been written for this purpose. You will need to understand the function
    signature – what the argument list means and how to use it and what will be returned
    by the function or done to variables passed as pointers to functions.


