    # 3 函数、指针和结构体


    ## 3.1 函数


    我们所有程序的入口被称为 `main()`，这是一个函数，或者说是执行某些操作的代码，通常返回某些值。我们将程序结构化为函数，以防止它们变成一个屏幕或一个页面无法显示的长且不可读的代码块，并确保我们不会在到处都是重复的相同代码段。我们可以调用
    C 语言内置的 `printf` 或 `strtok` 等库函数，也可以调用我们自己的或其他人的函数和函数库。我们必须确保适当的头文件存在并可被预处理器读取，并且源代码或编译后的库也存在且可访问。


    正如我们之前学过的，数据的作用域限制在声明它的函数中，因此我们使用指向数据和数据块的指针来传递给我们希望对这些数据进行某些操作的函数。我们已经看到字符串被处理为指向以
    `NULL` 结尾的单字符数组的指针。


    ![](img/00022.jpeg)


    在这个示例中，我们可以反复调用函数 `doit`，它接收两个整数参数并返回某些数学计算的结果。


    编译：`gcc -o func1 chapter3_1.c -lm`


    拷贝到 cgi-bin：`cp func1 /home/Cerberus/public_html/cgi-bin/func1`


    （你应该使用提供的 Makefile，或者在学习进展过程中维护一个 Makefile，在进行的同时添加编译示例的目标。）


    ![](img/00023.jpeg)


    浏览器中的结果所示，调用方式为“func1?5:5”。


    在这种情况下，我们函数的参数是以拷贝的形式发送的，在函数内部不会被修改，而只是被使用。如果我们想实际修改变量，必须将其指针传递给函数。


    ![](img/00024.jpeg)


    我们通过 `&result` 传递变量 `result` 的地址，在 `doit` 函数中，我们通过 `*result` 解引用指针以获取浮点数并在 `main`
    之外修改它的值。这与 chapter3_1.c 的输出相同。


    ## 3.2 库函数


    C 包含了许多用于执行任务的内置函数。到为止我们使用了 `atoi`、`printf`、`sizeof`、`strtok` 和 `sqrt`。要获取任何内置库函数的详细信息，我们只需要输入：


    ##### man 3 atoi


    我们就会看到这些：


    ![](img/00025.jpeg)


    这很好地告诉了关于该函数你需要的所有知识，如何使用它以及它的变体。最重要的是，它告诉了你应该包含哪个头文件。


    ## 3.3 库函数快速参考


    所有可用函数的详细信息可以在 [`www.gnu.org/software/libc/manual/`](http://www.gnu.org/software/libc/manual/)
    找到。


    ![](img/00026.jpeg)


    在发现你需要做某事并因此寻找为此目的编写的函数或函数库之前，学习库函数是没有意义的。你需要理解签名 – 参数列表的含义以及如何使用它，以及函数将返回什么，或对作为指针传递的变量执行什么操作。


