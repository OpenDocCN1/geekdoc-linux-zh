    +   2 All open source applications Shows everything that is free software (as
    opposed to proprietary software).


    +   3 Supported applications Programs that the team behind Ubuntu provide official
    support for.


    +   4 Third party applications Programs from anyone outside of the free software
    community.


    +   5 Installed applications The programs you have installed currently; generally
    used when you want to uninstall something.


