  md: '# Tomboy and you


    One of the coolest panel apps is called Tomboy – it’s like having your own personal
    wiki, because you can create links out of any text, which in turn become their
    own sticky notes that you can write to. Tomboy also understands basic formatting,
    emails, pictures and other rich media – give it a try!


    precise, right-click on the icon, choose Preferences, then go to the Location
    tab and find the nearest city to you.


    You’ll also find lots of little utilities in there that are particularly helpful
    for laptop users, including a battery charge monitor, volume controls, screen
    brightness and more. These little panel apps are great, because they nearly always
    solve just one task, they solve it really well, and they take up hardly any screen
    space when you aren’t using them.


    # Application launchers


    At the top of the Add To Panel window are two buttons that are particularly useful:
    Application Launcher and Custom Application Launcher. Ubuntu creates three application
    launchers for you by default – they sit just next to the System menu, and link
    to Firefox, Evolution and the system help. You can create more by using these
    two special panel items – the Application Launcher option creates a shortcut to
    a program that already exists in your Applications menu, and the Custom Application
    Launcher lets you create a shortcut to anything you want on your system.


    As an example, let’s take the Gimp image editing app:


    +   - Right-click on the panel and choose Add To Panel.

    +   - When the Add To Panel window appears, click on Application Launcher.

    +   - You’ll be shown a list of available programs. Open up the Graphics category.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_18_0.png)


    > Tomboy lets you write notes using text and pictures, then link them together
    just like you have your own wiki!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_18_1.png)


    > By adjust their properties, you can force panels to autohide, orient themselves
    to a different edge of the screen, or use an image for their background.


    Now choose Gimp Image Editor and click Add.


    You can actually add whole submenus as launchers if you want to – just choose
    the category you want then click Add. When you click that launcher, the list of
    programs in that category will be shown for you to choose from.


    # The task panel


    So far we’ve only looked at the top panel, but the bottom panel works in much
    the same way – you can add whatever you want there, and you can even merge the
    two panels together if you’re desperate to save space!


    By default, the bottom panel contains three things: a Show Desktop icon, the window
    list, and the trash can for deleted files. The window list is really just a holding
    area rather than a specific thing on the panel, because windows will be added
    to it automatically when they are opened. As in Microsoft Windows, you can then
    click on a window in the window list to have it brought to the foreground.


    If you’re the kind of person who likes to conserve space at all costs, you should
    right-click on the bottom panel (or indeed any panel you create), and choose Properties.
    This brings up the Panel Properties window shown above, which has several cool
    options:


    +   - Orientation This is set to Bottom for the task panel, but you can make it
    stick to any of the four edges of your screen.

    +   - Size The height of the panel. Most things will scale neatly if you increase
    this, so feel free to make it as large as you need it to be.

    +   - Expand This causes the panel to stretch to fit the size of the screen even
    if there is nothing there to fill it. Turning this off can save a lot of screen
    real estate.

    +   - Autohide With this turned on, the panel will automatically duck off the
    screen when you’re not using it.

    +   - Show/Hide Buttons This allows you to get the panel off the screen when you
    don’t need it, just by clicking one of the hide button directions.

    +   - Background The default background is plain grey, but you can go for a transparent
    colour or even a background image if you want to!


    # Linux desktop'
