- pgno: 69
  md: '# Our favourite

    Compiz plugins


    With so many plugins to choose from, we thought we’d save you some time by highlighting
    a few we can’t do without.


    There are dozens of Compiz plugins, and thanks to the rather dubious naming conventions
    used by the Compiz Configuration Manager, it’s not at all easy to divine what
    they’re supposed to do. It’s made worse by their inaccurate categorisation, with
    things like a plugin for adding caps onto the desktop cube found in the Utility
    category. But don’t despair. Here’s a selection of the plugins we think you should
    take a look at.


    # Eye candy


    If you wondered why all our screenshots had a subtle reflection on the floor of
    the rotating desktop cube, wonder no longer. It’s the Cube Reflection effect,
    and this can be found under the ‘Effects’ category. Opening the configuration
    window for the effect will let you change the colour of the ground, near and far,
    as well as the amount of reflection. There are also several different reflection
    modes you can choose.


    Another effect is ‘Wobbly Windows’. You’re either going to love it or hate it,
    and if you suffer from any kind of motion sickness, you’d best avoid the enable
    button. The Wobbly Window effect does just what it says, turning your windows
    into jelly. When you drag them across the desktop, inertia and friction play a
    part in how they''re drawn. It either looks really cool or totally unusable, but
    you can tame the distortion a little by increasing the friction and reducing the
    spring from the plugin’s options page. You should also look at the ‘Minimize’
    plugin. This gives you the option of changing the way a window is reduced to the
    icon in your taskbar, and it features some excellent transitions.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_69_0.png)


    > Many plugins have a bewildering array of options, but Rotate Cube is the worst
    offender.


    There are several other effects that are fun for a while, but you’ll want to turn
    them off to get some work done. The ‘Motion Blur’ plugin makes window movement
    look a little like an F1 Grand Prix, and it also takes a serious toll on your
    graphics card. ‘Cube Gears’ places some cogs into the middle of the desktop cube.
    ‘Water Effect’ and ‘Paint Fire on the screen’ add a crude approximation of those
    classical elements to your desktop.


    # Useful add-ons


    Not all Compiz plugins are superficial. There are some that can help your productivity.
    Top of our list is the ‘Enhanced Zoom Desktop’ plugin (found under ‘Accessibility’).
    When enabled, this gives you the ability to zoom into and out of any point on
    the screen by holding down a certain key combination. By default, you hold down
    the Windows key on your keyboard, and use the mouse wheel to zoom in and out of
    the screen, but this can be changed from the plugin options page.


    This is a plugin that you’ll wonder how you ever managed without. ‘Snapping Windows’
    is another (found in ‘Window Management’). This pulls on the edges of windows
    slightly to make them stick to the side of the screen, or to other window. It
    keeps your windows aligned and makes better use of your screen real estate. The
    ‘Shift Switcher’, found in the same category, rotates through the applications
    you’re running and shows you a preview of each window. ‘Ring Switcher’ does a
    similar thing, and they’re both useful if you’ve lost track of something on a
    desktop. If you already know where the application is hiding, ‘Window Previews’
    in the Extras category will show you what’s in the window when it’s minimised.
    Finally, for plugins that are both functional and look good. Try ‘ADD Helper’
    (Accessibility), which fades windows you’re not using into the background; and
    ‘Opacity’, which lets you alter the translucency of entire windows.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_69_1.png)


    > Many plugins are useful, including this one – the Ring Switcher. It lets you
    switch between running applications using a preview of the running window.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Desktop effects


    # Emerald theme manager


    Access dozens of separate themes using Emerald.


    If you think that Compiz is overburdened with possibility, with a wealth of options
    that make it hard to get your desktop you want, then Emerald is the answer. It
    is a simple interface to changing the appearance of your desktop. There’s no talk
    of plugins and categories in Emerald – just click on the preview you like, and
    the display changes accordingly. Themes have been created to ape many popular
    desktops, but they’re easy enough to edit and create your own. All of this is
    achieved through the manager. There’s a little hoop jumping to get everything
    installed, and you need to type a single line on the command line to be able to
    install the most useful themes, but it’s definitely worth the effort.


    The options that load below the Frame Engine menu are particular to each engine,
    but most themes will let you change the colour of the theme as well as the gradients
    used to fill in the window border. As you move each slider, the effects can be
    seen on your desktop in real time, so you can quickly tell whether you like the
    modification or not. Switch to the ‘Frame/Shadow’ tab in the Edit Themes window
    and you can change some of the more general options attached to a theme. The most
    obvious effect is a subtle distance. But changing the opacity, as well as the
    radius of the shadow, can make it more obvious in quite a pleasing way. You can
    also alter the X and Y axes to change the direction in which the shadow falls
    relative to the window.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_70_0.png)


    > The combination of Compiz and Emerald gives Linux an unbeatable desktop.


    # Create your own


    After installing the themes (see our walkthrough), you’ll find a preview for each
    listed in the ‘Themes’ tab when you first launch the Emerald Theme Manager from
    the ‘System > Preferences’ menu. Clicking on any of them will apply the theme
    to the windows on your desktop. Compiz is being used in the background to add
    transparency, reflections, blur effects, refraction and the shadows. These effects
    are handled by something called a frame engine, and you can see which one each
    theme is using by switching to the ‘Edit Themes’ tab. Just switching between frame
    engines can alter the appearance of your desktop. The ‘truglass’ engine, for instance,
    gives the impression of a reflective see-through desktop, while ‘Oxygen’ is what
    you should choose if you want a theme that looks a little like Microsoft’s Aero
    theme.


    # Save your theme


    Most importantly, you need to remember to save your changes. You can do this from
    any of the Edit Themes pages by typing a name into the bottom field and clicking
    the ‘Save’ button. This will add your new theme with your own modifications to
    the Themes list on the first page, and change the theme description. This is accomplished
    from the ‘Theme’ page, from where you can add yourself as the author, as well
    as give your theme a name and a version number. You can also attach a screenshot
    of your theme that’s used to preview its appearance in the Themes page.


    # Step by step: Install Emerald


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_70_1.png)


    1 Emerald, like everything else in Ubuntu, is installed through the Synaptic package
    manager. You need to look for and install the following packages: emerald, gnome-compiz-manager
    and subversion. The last one is a developer’s tool we’re going to use to download
    themes. You also need to make sure the Compiz ‘Windows Decorations’ plugin is
    enabled.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_70_2.png)


    2 You will now see a new addition to the System > Preferences menu. Click on Emerald
    to launch the application. By default there are no themes, and before we can get
    them, we need to add the repositories security certificate. Open a Terminal and
    type the command at the bottom of the Theme Settings > Repositories page. Press
    P to add the certificate permanently.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_70_3.png)


    3 With the connection to the theme repository authenticated, we can now download
    some themes. From the Repositories page, click on both the ‘Fetch’ buttons to
    download the latest themes into the manager. When this has completed, you will
    find them listed in the ‘Themes’ tab, and you can enable them with a double click.
    After which, you should have a shiny new desktop theme!'
