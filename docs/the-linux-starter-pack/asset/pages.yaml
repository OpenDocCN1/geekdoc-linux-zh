  md: '# Get more software


    means that it can also keep track of software updates and prompt you to install
    patches as they become available. On Ubuntu, this is done using Update Manager
    from the System > Administration menu. When run, this will scan all the software
    you have installed and compare it to the latest versions that are available for
    install, and then let you know if any updates are available. If there are updates,
    they are selected for you by default, so all you need to do is click Install Updates
    to have Ubuntu download and patch all applicable programs on your computer.


    As you might imagine, given its advanced user target, Synaptic can also upgrade
    packages. In fact, just next to the Refresh button that you click when repositories
    are enabled or disabled is the "Mark All Upgrades" button, which does exactly
    the same thing as Update Manager does – click that, then click Apply to have Synaptic
    update all your software to the latest available versions.


    # Automatic updates


    After you’ve spent a few weeks using Ubuntu, you will almost certainly encounter
    the automatic update notification system. Behind the scenes, Ubuntu checks the
    internet for new software every day, and if it finds any updates are available
    it will pop up a balloon in the top-right of your desktop to encourage you to
    update. This might seem a bit annoying, particularly if the balloon appears while
    you’re trying to work, but trust us: it’s all for a good cause! You see, it doesn’t
    matter how fast Ubuntu gets out security patches – if you don’t know about them
    and don’t install them, they are useless. Having the balloon pop up to prompt
    you means that you can get yourself patched as soon as problems are fixed, ensuring
    that your system remains as safe as possible.


    This whole auto-update system is configured through the Software Sources window
    from Synaptic, although you can get straight to it by going to System > Administration
    > Software Sources. From this window, click on the third tab (‘Updates’), and
    you’ll see that Ubuntu is configured to provide access to security and non-security
    updates, and will notify you when they become available. You would be wise not
    to alter the top options – the proposed and unsupported updates may cause problems
    with your otherwise-pristine system, and so are best avoided. But you can change
    the lower option: what do you want Ubuntu to do when it finds security updates
    are available? If you have your computer on 24/7, you’ll probably find it better
    to choose the middle option, which causes Ubuntu to download any available updates
    without actually installing them.


    One last thing: Ubuntu makes it very easy for you to upgrade from one version
    of the distro to a newer version. You see, Ubuntu works on a six-month lifecycle:
    every six months, a new version is released, and that new version updates all
    the software to the very latest version. Although these kinds of software updates
    always bring lots of great new features and often also some new programs to try,
    it’s important that you remember that this magazine was written to accompany the
    exact Ubuntu version provided on the included disc. If you upgrade to a newer
    version of Ubuntu, some things may have changed, so you’re on your own!


    Whenever there are security fixes or other patches available for your software,
    Ubuntu will let you know. Click the orange icon to start the update process.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_102_0.png)


    # Synaptic’s menu options


    Rather than just a simple "install or don’t install", Synaptic gives you more
    control over what it does with packages. When you click a check box next to a
    package, you can choose from the following options:


    +   Unmark

    +   If this file was selected for change, deselect it.

    +   Mark for Installation

    +   Add this package to the list to be installed.

    +   Mark for Reinstallation

    +   Take a fresh copy of this application and its configuration files, and use
    them to overwrite the existing data – great if you break a program.

    +   Mark for Upgrade

    +   Download and install the latest version of this package.

    +   Mark for Removal

    +   Removes the programs that come with this package.

    +   Mark for Complete Removal

    +   Removes the programs that come with this package, along with any associated
    configuration files.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_102_1.png)


    Confused by all the options in Synaptic? The Preferences window lets you customise
    the colours for easier reading.'
