- pgno: 85
  md: '# Instant messaging


    Communication is an integral part of the computer desktop, and Linux has some
    of the best applications in this class to choose from.


    # Quick tip


    For MSN, point your browser at: https://accountservices.passport.net/ppnetwork/home.srf


    For AOL point your browser at: https://my.screenname.aol.com


    With more of us staying online for longer, and persistent always-on internet connections
    becoming increasingly common, instant messaging and online personal communication
    has become an essential desktop tool. Fortunately, Linux is well catered for by
    messaging software, especially if you’re used to the advertisement-crippled, costly
    and unfriendly messenger clients you typically find on Microsoft Windows. You’ll
    find that you can do everything you’re used to with the Linux versions of the
    software you’re used to. And you’ll find that you can still chat to people who
    choose to keep to their old operating system ways, bridging the divide between
    open source and proprietary software.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_85_0.png)


    You''ll need to create an account for AOL''s instant messenger and MSN Live using
    another client or the web interface. You can''t do it from within Pidgin.


    # Pidgin


    The default instant messaging client for the Ubuntu desktop is called Pidgin.
    It''s better than it sounds. Pidgin is capable of communicating with all the main
    messaging services at the same time. This means that if you''ve got an account
    to use AOL Instant Messenger and an account to use Microsoft MSN messenger, you''ll
    be able to use both from the same client transparently. You can''t do that with
    either of those clients on the Windows platform, and Pidgin can communicate with
    plenty of other protocols too, including ICQ, Yahoo, Google Talk, Bonjour and
    IRC, all concurrently. It manages this because the developers behind Pidgin worked
    out how each client talks to one another, and have created their own library that
    brings all this functionality into one place. As a result, the Pidgin library
    is now used by several other high-profile instant messenger applications on both
    Microsoft Windows and Apple''s OS X. As Pidgin is open source, there''s nothing
    to stop any other open source developers using this library freely.


    > Pidgin can communicate with nearly every other messaging protocol, bringing
    all your contacts from these services into one place – the Buddies List.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_85_1.png)


    Start Pidgin from the Applications > Internet menu. The first time you do this,
    you''ll be guided through a simple wizard that will get you up and running. Click
    on the ''Add'' button to add a new account. To Pidgin, each messenger protocol
    is a new account. If you want to use MSN and AOL at the same time, you''ll need
    to create two accounts. Just choose the account you want to add from the drop-down
    protocol list. The one thing that Pidgin can''t do reliably from the main window
    is create accounts for each protocol if you don''t already have one. With MSN,
    for instance, you can only add your login details – you can''t create a new account.
    The only way around this problem is to either use the native version of the messenger
    protocol you want to use to create a new account, or use the website of the messenger
    protocol if it has the facility to create an account. Both AOL and MSN offer this
    as an option.


    # Getting started


    When you have the data you need – which is normally just a username and password
    – enter those details into the Add Account window. In Pidgin terminology, ''screen
    name'' is the username you use to log in to your account, while the alias is the
    name you want your contacts to see after you''ve connected. After clicking OK,
    Pidgin will attempt to make a connection to your account provider. A few moments
    later, you should see your list of contacts appear in the main window and you''re
    ready to chat. If you don''t see any of your contacts in the Buddy List window,
    you either haven''t made any friends yet, or none of your friends are online.
    By default, the Buddy List will only show friends that are currently connected
    to the network, hiding your offline contacts from view. If you want to make sure
    your contacts are registered, enable ''Show Offline Buddies'' in the Buddies menu.
    That menu can also help you change the order of your buddies if you have too many
    to be easily manageable.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Instant messaging


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_86_0.png)


    Changing your status is a nice way to keep your contacts up to date with what
    you''re up to without getting drawn in to a time-consuming conversation.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_86_1.png)


    You can change which set of emoticons are used from the Preferences window, and
    Pidgin can also download your contact''s custom emoticons when they use them.


    All you need to do to initiate a chat is double click on one of your contacts.
    After doing so, the messenger window will open, and it''s from here that you can
    chat and see your contact''s messages. If you''ve used an instant messenger client
    before, this should feel familiar, and there really isn''t all that much to it.
    You type in the lower area and the message history scrolls through the top area.
    You can add smiley characters to your conversation (known as emoticons) using
    either the insert button, or the key combination if you happen to know it. Pidgin
    will also interpret emoticons used by your buddy, and you''ll see the images for
    those embedded within the conversation window. When you receive a message, the
    window will flash as a notification, as will the tiny Pidgin icon in your toolbar.
    If you''ve got speakers connected to your Linux box, you''ll also hear a jingle,
    and sound options can be changed from the Preferences window by switching to the
    ''Sounds'' tab.


    add buddies, you need to know their messenger ID for the protocol you''re both
    using. If you''d like to see which protocol everyone is connected to all the time,
    just select ''Protocol Icons'' from the File > Show menu.


    # Status messages


    You can see your current status in the drop-down list at the bottom of the buddies
    window. Most of the time it''s ''Available'', but you can also change this from
    the same list. ''Invisible'' is a useful choice, for example, because it enables
    you to see which contacts are online without them seeing you. Another important
    aspect to status messages is leaving your computer unattended. By default, Pidgin
    will wait a set period of time (configured in preferences) when there''s no activity
    on your computer and change your status to ''Away''. Your contacts will then see
    this as your current status, and most messenger clients will also fade out your
    name in the contact list. But you can be more imaginative, and change your away
    message to something else. Many people like to say what they''re doing, and while
    you don''t have to be quite so zealous, a small message can be useful if someone
    is waiting to contact you.


    # Tyop alert!


    While typing your replies, misspelt words have a red underscore, and you can see
    the suggested correction by right-clicking on the offending work.


    With most protocols you can also format your conversation using the font button.
    You can change your font by selecting the ''Font Face'' option, but you can also
    change the appearance of general text by selecting bold, italics, underline or
    strikethrough, as well as change the colour.


    If you''re connected to more than one account at the same time, contacts for each
    account are silently added to the buddies list. Pidgin keeps the protocol each
    contact is using hidden simply to keep the user interface clear. It shouldn''t
    make any difference to conversations, as most of the major protocols share the
    same core functionality such as sharing files and the use of emoticons. The only
    way you can tell which protocol each contact is using is by holding the mouse
    over your buddy and reading the information from the window that pops up. If you
    want to


    # Google Talk


    If you use Google''s email service, GMail, you will have come across Google Talk.
    It''s the integrated messaging client you can use from your browser while you''re
    checking email. But it''s also possible to connect to the Google Talk network
    with Pidgin. The only problem is that some of the settings in the default Google
    Talk configuration are wrong. To get it working, open the Accounts window (Accounts
    > Add/Edit menu), click on ''Add'' and select the ''Google Talk'' protocol from
    the drop-down list. In the Screen Name field, enter your Gmail username without
    the @gmail.com or @googlemail.com part. For the domain field, enter the gmail.com
    or googlemail.com part of your username and switch to the Advanced tab. On this
    page you need to enable the top option (Force old (port 5223) SSL), and change
    the port to 5223 for good measure. The connect server field should also contain
    talk.google.com. When you save the options, you''ll be asked for your password
    (unless you entered one into the password field), and you will find that you connect
    to


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_86_2.png)


    Google Talk works well with Pidgin – you just have to connect to the server manually.


    Google Talk without further hassle. One thing to be wary of is that if you log
    messages in Gmail, these will still be logged even if you''re using Pidgin.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Instant messaging


    # Customising Pidgin


    Now that you’ve got Pidgin working, it’s time to make it feel more like home.


    # Quick tip


    Buddy Pounce, found in the tool menu, will send a message to a contact as soon
    as they appear online.


    There is a lot you can do to customise the Pidgin environment, but the first thing
    you should do is create an avatar for yourself. An avatar is an online representation
    of someone’s real-world character. These are seldom serious, and most people change
    them often to reflect their mood, adding some much-needed character to a world
    of text. It’s easy to create your own. First find an image you want to use – it
    needs to be square, and you might want to trim it slightly, as Pidgin offers no
    scaling options other than resizing. When you’ve found an image, click on the
    small icon in the bottom-right of the buddies list. This will open a file requester
    from where you can navigate to your image. After it’s selected, Pidgin will resize
    the image. Most protocols only use small images of 64x64 pixels, so your image
    needs to be easy to see. You can see it has replaced the original icon in the
    bottom-right of the buddies list, and it’s this image that people will see when
    they chat to you.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_87_0.png)


    There are loads of plugins to choose from – our favourite translates one language
    to another in real time.


    # Plugins


    The best way to add things to Pidgin is through its wonderful plugin system. If
    you’ve not come across plugins before, they’re separate modules that can be enabled
    to add functionality to an application. They’re left optional so that users can
    pick and choose which ones they prefer. It’s a little like adding extensions to
    Firefox, for instance. The plugins window is opened by selecting ‘Plugins’ from
    the ‘Tools’ menu. This window lists each plugin with an enable box to the left
    of a short description. Clicking on the enable box will start the plugin. Here
    are a few of our favourites:


    +   » Auto-accept If someone sends you a file, you normally have to switch to
    the message window and accept the request. This plugin does it for you, downloading
    the file automatically without you having to do anything. You don’t need to worry
    about getting spammed with files, as only your contacts can send them.


    +   » Buddy ticker If the vertical Buddies List takes up too much room, try the
    Buddy Ticker. It creates a sideways scrolling equivalent that takes up less room
    – your contacts slide across a narrow window on your screen, and you can use this
    list exactly like the normal window for starting conversations.


    +   » Contact availability This is a clever plugin. It monitors what time of day
    your contacts are online so that it can estimate when they’re likely to be available.
    This is great for people in your contacts list who are in a different time zone,
    or people who only connect to the internet at certain times of the day.


    +   » History This is an essential tool if you’ve got a lot of contacts. It shows
    the end of your previous conversation when you start a new one, so you can remember
    what you were both talking about. Even if you haven’t chatted to your buddy in
    weeks, the greyed out section of the conversation will show you your last mutterings.


    # IM troubleshooting


    Most instant messaging and VoIP problems are caused by firewalls blocking the
    ports necessary for one client to talk to another. This is because file transfers
    and chat use different ports. Opening the correct ports on your firewall isn’t
    always an easy job. If you’re not using a firewall you should have no problem,
    but if you are, you need to open ports on the firewall for the protocols you’re
    having problems with. MSN uses TCP port 1863, but if you use the HTTP option in
    Pidgin, it will use port 80. This is the same port that web browsers use, so it
    should definitely work. AIM uses TCP and UDP port 5190. Ekiga uses many different
    ports, and installing Stun (as requested by the install wizard) solves most connection
    problems. Most firewalls will have the option to enable common VoIP/SIP/Video
    Conferencing ports, and you should do this if you’re having problems. If your
    machine is connected to the internet through more than one router, this can also
    cause NAT problems. Try to create a direct route to each machine you want to use
    by creating static IP addresses and routes from one connection to the next. If
    your router has the facility, use NAT on your router to forward all VoIP ports
    to the machine you want to run Ekiga on.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_87_1.png)


    Many firewalls feature predefined rules for letting VoIP and instant messaging
    through.


    +   » Psychic mode Pidgin knows when a contact starts to type a message to you.
    With this plugin enabled, it will open the message window before the message is
    even sent. You can tell when someone is typing because a small keyboard icon appears
    in the top-right of the chat window. This is essential when you’re both in full
    flow.


    +   » Text replacement This plugin will replace certain strings you type in the
    message window with those you want them replaced with. This is useful for long
    words, or even for automatically correcting common mistakes. You might want to
    replace ‘youv’e’ with ‘you’ve’ for example, or replace a codeword with a long
    address.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Instant messaging


    # VoIP and video conferencing


    Sometimes, typing text just isn''t enough. Linux has several messaging clients
    that can manage voice and video.


    The most popular voice and video conferencing application for Linux is called
    Ekiga, and it can be found hidden in the Applications > Internet menu. When first
    launched, Ekiga will ask you for your name as well as a username and password
    that will be used to create an account on ekiga.net which is the portal through
    which people connect and disconnect. Ekiga is run by volunteers, and is entirely
    free to use. Other users of Ekiga need to do the same, and it''s through this
    portal you''ll be able to make calls to other people. If you already use an alternative
    SIP service, you can configure Ekiga to use this instead. Alternatives include
    users of Microsoft''s video conferencing software, which Ekiga can be configured
    to work with – in which case ignore the request for a username and password.


    # Setup


    After the Ekiga account setup, the configuration assistant will try to detect
    your NAT type. This sounds technical, but all it''s really doing is trying to
    work out how to reach your computer from the internet. If you have several machines
    sharing the same internet connection, and therefore the same IP address, the NAT
    type will be different from the type used by a direct connection. If your firewall
    is restrictive, you''ll also be asked to enable Stun support.


    After that, you''ll be asked for your sound configuration. If you''re using a
    microphone, you need to make sure the correct input is selected. Click on the
    Test Settings button on page 7 to open a window that shows the signal coming in
    from the selected audio input. If your microphone is working, you''ll see the
    volume meter bounce up and down and hear the output in your headphones or speakers.
    If you don''t see anything, you need to select a different input on your sound
    card. If you see something but don''t hear anything, you need to select a different
    output for your speakers or headphone output and check the volume settings. Most
    of the time, the default settings should be fine. Ekiga will then try to detect
    your webcam. Any Linux compatible webcam will work, and you shouldn''t need to
    change any of the default values.


    NAT problems account for most connection difficulties, but things have improved
    with the inclusion of the Stun package.


    A good place to start is the echo test. Dial 500, and you''ll be connected to
    a computer that will echo everything it hears. This is a good way to make sure
    everything is working as it should be. For others to dial you, they can use your
    username followed by @ekiga.net. If you know the SIP address of the person you
    want to contact, you enter this directly into the top field of Ekiga. You can
    also use the Ekiga White Pages directory to find other Ekiga users. This is opened
    from the Tools menu, and with a total of over 1/4 million registered Ekiga users,
    you need to use the ''Find'' field to search for your contact. Video and voice
    calls will work automatically, and you can fine-tune the sound and video by switching
    tabs in the lower half of the screen. The Audio tab shows the volume for incoming
    and outgoing sound so that you can be sure the person on the other end is getting
    the data, and the video tab lets you change the brightness, contrast and colour
    of the incoming image.


    Quick tip

    Skype, the phone call replacement service owned by eBay, is a popular alternative
    to Ekiga. It''s a proprietary piece of software, but it''s free to use. You only
    pay to connect to landlines and mobile phones. There''s also a Linux client available
    from the Skype website.

    www.skype.com


    The Ekiga White Pages is an online directory to find other users of Ekiga. You
    can also call anyone else with a SIP-compatible client or phone.


    It''s essential you get audio working correctly from within Pidgin. As long as
    you can see both audio meters bouncing, you can be sure your configuration is
    working.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_88_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_88_1.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_88_2.png)'
