    file, for example, left click and drag the mouse across the area you want to trim
    and select ‘Cut’ from the edit menu. You can add effects to any selected region
    from the Effects menu. If you want to mix two files together, add a stereo track
    from the Tracks > Add New menu and use Import from the File menu to add a new
    audio file to those tracks. Pressing Play now will mix all the tracks together,
    and you can save a copy of the mix from the File > Export file over time, use
    the Envelope Tool from the toolbar. This lets you draw a curve across the waveform
    that will be used to either amplify or decrease the volume of the audio at that
    point. When you’ve finished editing, save your audio file into your favourite
    format.


    # Quick tip


    You can install hundreds of other effects by searching for ‘LADSPA’ plugin in
    the Synaptic package manager. These are compatible with all Linux audio applications
    and cover everything from chorus effects to reverb


    # Close to the edit


    The main area of the Audacity editor displays an amplitude waveform for the current
    section of audio. This is exactly the same as many other audio editors. The peaks
    and troughs in the image represent high and low amplitude in the audio, with the
    two tracks representing the left and right channel of a stereo recording. If your
    audio is mono, you’ll only see a single track. Press the green Play button in
    the toolbar to hear the sound your audio makes. The level meters above the tiny
    speaker icon in the toolbar will start to bounce, and a cursor will scroll across
    the waveform view to show you which part of the image is creating the sound you
    can hear. You can zoom into and out of the waveform using the magnifying glass
    in the toolbar, and when you want to stop playback, either hit the space bar or
    press the stop button. To do any editing, you first


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_104_0.png)


    Audacity can run on Windows and OS X, and is the best free tool you can find for
