  md: '# Security


    # Secure your distro


    Linux is inherently a secure operating system, but it''s not all done for you...


    No matter what type of computing environment you''re in, it takes only a minor
    slip to allow potential hackers access to your system. Fortunately, Ubuntu is
    a fairly secure system, benefiting from swift security updates and bugfixes where
    necessary to ensure that your system remains in a safe and secure state.


    While some would argue that security is best implemented with a myriad of tools,
    it''s also fair to say that security is also a state of mind, a way of thinking
    about how you work that enhances the security available to you. In this tutorial
    we''ll take a look at some of the ways in which you can minimise any security
    risks by doing some very simple things.


    # Password protection


    One of the simplest, yet most common forms of security is the common password.
    You will have been asked to create one when you installed Ubuntu and it''s likely
    that you haven''t changed it since. However, is your password secure? Let''s take
    a look at some of the more common pitfalls that passwords can encounter.


    First of all there is the mistake of choosing something too simplistic, like the
    infamous password which is simply ''password''. Believe it or not, but there are
    people, many people out there who choose this word as their password, because
    it''s easy to remember. The trouble is, it''s also easy to guess, and quite frankly
    if you''ve used it then you deserve to have your system hacked into and trashed.
    Another common password choice is the name of a spouse or child – again, if the
    would-be hacker knows you then it''s not a bad guess to try the first names of
    all your relatives that they know in an attempt to gain access to your system.


    So what is a good choice of password? Well, it''s time to learn a very simple
    method of creating a good password that is also easy to remember, a common problem
    in our password-oriented lives. First of all, think of a phrase that you know
    well. It could be something as simple as Every Good Boy Deserves Football, a phrase
    we learned while being taught to play the piano. Take the first character of each
    of the words to give you egbf – seemingly gibberish, but easy to remember if you''re
    a musical person. Because passwords are case sensitive, we''re going to capitalise
    the first and last character to make EgbfD. Just to make it more difficult to
    guess, we''re going to add 123 to the end of it, to end up with EgbfD123 giving
    us an eight-character password with some complexity (capital letters and numbers).


    The About Me utility can be used to change your password. Once it''s open, simply
    click the Change Password button and a new window will pop up.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_95_0.png)


    Enter your current password and click the Authenticate button


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_95_1.png)


    # Make it more complicated


    The other classic example is using a modified phrase, for example, ''This is a
    good choice of password'' would give us tiagcop. You could then capitalise the
    t and the p, use an exclamation mark in place of the i and use a zero in place
    of the o, leaving us with TIag0pF giving us the added complexity of using punctuation
    as well as capitalisation and numbers.


    Obviously the longer the password, the better, especially if you include capitalisation,
    punctuation and numbers.


    Creating a single password is not the sole answer though – in order to keep it
    as secure as possible, you need to change it on a regular basis, such as every
    couple of months or so. Ubuntu makes this process easy to do, and you can get
    started by going to System > Preferences > About Me. You''re asked to authenticate
    yourself first of all by entering your existing password and clicking on the Authenticate
    button. When you''ve done this, the additional two fields below the Current Password
    field become active, allowing you to enter'
