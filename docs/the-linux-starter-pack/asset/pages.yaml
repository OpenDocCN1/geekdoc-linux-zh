- pgno: 35
  md: '# Calc: Common spreadsheet elements


    # All about cells


    A cell is the smallest element in a spreadsheet document, the smallest building
    block if you like. The purpose of a cell is to hold one specific piece of information,
    a single blob of data. Now, in the world of spreadsheets, that could be a simple,
    literal value, such as a number or a piece of text. These are the simplest pieces
    of data managed by a spreadsheet because they do not depend on anything else,
    anywhere else. They are unchangeable, except of course, if you want to edit them
    to say something different.


    It is not quite true to say that numbers and text are the same things either.
    A number has a value, and if you enter a number, Calc knows deep inside that something
    can be done with this number – it can be added, multiplied or subjected to all
    sorts of other things. By default, it will also be formatted as a number – there
    will be no leading 0s for example. Usually, if you enter a number, it is because
    ultimately you may want to actually do something with it, and so this is a good
    behaviour for Calc. But sometimes numbers are just text. A membership number,
    for example, might be 000013. In this case, you would want to keep the number
    with the leading 0s. You probably wouldn''t want to be able to add it or multiply
    it with another number, you wouldn''t want it to be counted as part of a summing
    function, and indeed you may want to manipulate it as text. To force a cell value
    to be text rather than a number, you simply start it with a single quote mark
    ''. Alternatively, you can change the format of the cell beforehand to be text.
    If you have already entered numbers, you can''t later convert them to text fields,
    so be careful.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_35_0.png)


    You can use the text formatting controls to make the spreadsheet easier to read,
    or just to look nicer.


    you select the cell, you need to edit the function definition in the text area
    just above the main window.


    To begin with, let''s consider a simple function first. Suppose we were to function:


    ```

    =2*6

    ```


    into a cell. The cell would display the value 12, but if we select the cell, we
    will see the text ''2*6'' in the edit area just above the spreadsheet itself.
    Note that a function always begins with '':'', so that Calc knows there is something
    to calculate! This is a very simple function, because it is also a literal value
    – sure, Calc has to do some maths to work out the answer, but once it is done,
    the value will never change.


    That''s all very well, but a load of functions that just calculate static results
    isn''t going to achieve much. Spreadsheets really come in handy when the results
    of one calculation are passed into another one. This is done by referring to a
    different cell, and the text you use to do that is called a reference. As you
    have probably noticed by now, the spreadsheet is arranged in rows and columns
    of cells, so each cell can easily be identified by its coordinates on that grid
    – by referring to the column and row that it is in, quite similar to grid references
    on a map. Columns are labelled with letters, and the rows with numbers, and it
    has become the standard to use the column reference first. So, the reference for
    the first cell in the spreadsheet is A1. Now, assume that we have the value 6
    already entered into cell A1. We can now enter the following function in cell
    A2:


    ```

    =A1 * 2

    ```


    When the spreadsheet comes to evaluate this function, it sees the reference, and
    goes off to calculate whatever is in cell A1, then substitutes that result into
    the function, and in this case, would come up with the answer 12.


    The real power of this is that now if you change the value entered into A1 say
    to the number 5, then without doing anything else, the value in A2 will change
    to be 10. The spreadsheet is like a very customisable calculator, and with a combination
    of functions and references, you can build up a very complicated computing engine.


    Circular references are something you need to beware of, because they can be rather
    tricky to track down. What is a circular reference? Well, say you assigned the
    value of 3 to cell A1. Now you assign B1 to be A1. Then you assign C1 to be B1*2.
    Now you go back to A1 and assign it to be equal to C1-1. What happens? All the
    cells you entered will now show the text #name


    # Functions


    One step up from a literal value is a function (often also called a formula).
    There are hundreds of built-in functions, covering everything from generating
    random numbers to calculating the compound interest on a loan. A function may
    depend on a single value, several discrete values, a range of values or any combination
    of these – it is in effect a tiny program all on its own. When you enter a function
    into a cell, the cell displays the result of that function, not the function itself.
    To edit the function, when


    Functions that reference other cells are the key to making the spreadsheet display
    complicated and useful calculations.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_35_1.png)'
