  md: '# Blender


    3D modelling and rendering environments normally cost a fortune – Blender is free
    and can compete on quality and specification.


    The story behind Blender''s open source renaissance is a good one. It started
    life as a proprietary piece of software designed to compete with the likes of
    Softimage, LightWave and 3D Studio. The company that developed Blender went bankrupt
    in 2002, but the creditors agreed to release the source code in return for €100,000.
    In mid-July of that year a campaign was started, asking people to donate funds
    to free Blender. Two months later Blender was saved, and the source code was released
    under the terms of the GPL – free for all to use and modify. Since then, Blender
    has gone from strength to strength. Thanks to its open licence, many people now
    contribute to its development, and the massive community flocks to blender.org
    with each new release. Blender has many advanced functions for the CGI artist,
    including Nurbs, Bezier curves, metaballs, particles and digital sculpting. The
    ray tracing element responsible for generating the final image can be replaced,
    and many people use the photo-realistic Yafray as a substitute. The images that
    can be produced are breathtaking.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_105_0.png)


    The Blender user interface is bewildering, for beginners and experts alike, so
    don''t let that put you off using it.


    # My first render


    But there is a cost, and that''s complexity. Blender has one of the most convoluted
    and complex user interfaces we''ve ever come across. This is a real shame, because
    you don''t necessarily need to be a CGI expert to get usable results. It just
    takes a little effort to learn the basics. When you first launch Blender from
    the Applications > Graphics menu, the window that appears is confusing. The main
    view is split into two, with the top area showing a top-down view of the scene,
    and the lower area dedicated to buttons and panels.


    Things become clearer if you select ''Camera'' from the View menu. This will switch
    the main display to the view from the in-scene camera, and by default it''s looking
    at a cuboid in the centre of the scene. Press F12 and the scene is rendered. A
    window will appear with a properly lit rendition of the scene. Close the render
    and return to the main window. Make sure


    the cube is selected by looking for the pink coloured frame. If it isn''t, make
    sure Object Mode is selected on the toolbar in the middle of the screen, and right
    click on the cube. If you look closely at the cube in the middle of the window,
    you should be able to see three coloured arrows pointing in different directions.
    These arrows point in one of the three planes – green for the Y axis, blue for
    the Z axis and red for the X axis. You can move the cube in any of these axes
    by left-clicking the corresponding arrow and dragging your mouse. You can also
    move the cube freely in the visible axes with a right-click and a drag of the
    mouse. Press S to scale the cube; press R to rotate it. The axis of rotation is
    dependent on the current view. If you switch to the side view (press 3 on the
    number pad), for example, you can rotate the cube around the X axis. Switch to
    the top view (7 on the number pad) and you can rotate it around the Z axis.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_105_1.png)


    This frame is taken from an animated short film called ''Elephants Dream,'' a
    movie created almost entirely using Blender and other open source software.


    # Textures


    If you don''t like the grey colour our cube currently has, switch to the material
    view with the F5 key. Find three colour sliders in the middle panel, and you should
    be able to dial a more appropriate colour from here. Using textures, you can change
    how the surface of objects. With the cube selected, press F6 to open the Textures
    panel. Under the drop down menu labelled ''Texture Type'', select Stucii. The
    texture preview will fill with a texture that looks a little like the surface
    of the moon through a telescope. You can change the colour of the texture by switching
    to the ''Colors'' tab and pressing on the Colorband button. Press F12 again and
    you''ll see this texture mapped onto the surface of the cube. There are hundreds
    of texture combinations, and you can layer one on top of another. If you''re after
    something realistic, try the Image texture type and use your own photos. You can
    also find texture libraries online so that you don''t need to recreate everything
    by hand. If all this seems a little overwhelming, don''t worry – if you''re able
    to persevere, the end results can be stunning.'
