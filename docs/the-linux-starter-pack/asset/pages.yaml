  md: '# Welcome to Linux


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_8_0.png)


    Have fun with Linux - there are hundreds of games to install for free, many of
    which are suitable for young children.


    The Brasero CD burner is an advanced disc creation system - great for people who
    want more power!


    +   3 Scary programming

    +   4 Command line horrors


    You see, all those things work to confuse and misdirect first-timers with Linux,
    so we want to steer well clear of them. In fact, you’ll barely see any mention
    at all of the command line that Linux is so famous for, because we’re less interested
    in explaining what things are than actually explaining what you can do with them.


    # Where to go from here


    This is the end of my short introduction, so the next step for you is to dive
    on into Linux by turning over the page and following our step-by-step install
    guide. If you have more questions, relax; we’ll try to answer them as you go.
    The important thing is that in your hands is all you need to get started – and
    have fun! – with Linux. Enjoy!


    # The Philosophy of Free


    Linux is free of charge, which is more than enough to convince a lot of people
    to switch. But Linux is also "free" in the meaning of "freedom" – that’s why you
    can see the computer programming code behind it, modify it, and even sell it if
    you want to. We call this Free Software (note those capital letters!), and many
    Linux users consider it even more important than Linux’s lack of a price tag.


    # The history bit


    I’m a big believer in empowering people to do new things, not weighing them down
    with history. After all, you don’t need to know where Linux came from to get the
    most from it! But for the curious, here’s a little bit of background.


    A long, long time ago, in a galaxy not too dissimilar from our own, most people
    who used computers were geeks. And they didn’t have their own computers, either
    – they shared one, known as a ‘mainframe’, because back then computers were far
    too expensive, bulky and unreliable to actually be personal. Back then, the primary
    operating system was known as Unix, and people passed around the source code freely,
    because it hadn’t even occurred to them that selling such software might be big
    business.


    But sooner or later the inevitable happened: some suits came along and decided
    to ‘monetise’ Unix. It split into various different brands (known as ‘forks’),
    because they all forked off the main Unix road, all competing with each other
    on features and price. Soon the various different Unices (Unices? Unixen?) became
    incompatible in different places, and the whole software community became fragmented.


    Into this software melee stepped Microsoft, bringing with it the promise of one
    platform (Windows) from one vendor (Microsoft) for one price (not cheap). The
    fragmented Unices never really stood a chance, because each of the vendors tried
    to fight Microsoft in their own way rather than banding together. Eventually,
    Windows was dominant, and things settled down again.


    Linux started life as the pet project of Linus Torvalds, a university student
    in Helsinki. It was designed to copy the fundamentals of Unix, but had one special
    difference: it was licensed under the GNU General Public License. This is a special
    software licence that says, "if you take this software, you’re welcome to redistribute
    it, change it and sell it if you want to – as long as you give the changes back
    to the creator." As a result, big computer companies such as IBM, Intel, HP and
    SGI were able to band together around a common platform – they could contribute
    features to the common pool without having to compete with each other.


    Linux today is worked on by thousands of people from around the world, and is
    finding its way into everything from mobile phones to billion-dollar server rooms.
    Google, Amazon, Yahoo and many other big internet companies rely on Linux every
    day, and if it can handle their computing needs then your desktop ought to be
    a cinch!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_8_1.png)


    Linus Torvalds, creator of Linux. What a guy!'
