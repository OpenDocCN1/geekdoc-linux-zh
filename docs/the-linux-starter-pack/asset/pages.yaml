- pgno: 6
  md: '# Welcome to Linux


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_6_0.png)


    You can download and install new software over the web using the Add/Remove Applications
    window.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_6_1.png)


    Games! Yes, Linux isn''t just for serious people: there''s lots to do when you
    want to relax...


    # 4 Linux is secure by default


    Unlike on Windows, where installing programs can lead to ''DLL Hell'' and it''s
    easy for your five-year-old to delete important system files just using Explorer,
    Linux was designed from the beginning for security. As a result, no one can install
    software if they don''t have the administrator password. No one can delete files
    that don''t belong to them. No one can spread spyware across the system just by
    surfing the web. In fact, unless you switch to the administrator account and go
    crazy, it''s pretty damn hard to break a Linux machine!


    # 5 Linux is smart by default


    If you get hit by a power cut and your computer shuts down unexpectedly, Linux
    is smart enough to auto-recover your files just where you left off – there''s
    no need to run checkdisk on Linux. Similarly, Linux is clever enough to re-arrange
    the files on your hard disk as you use them so that file fragmentation is a thing
    of the past.


    The open nature of Linux also means that anyone, anywhere can join the development
    effort and help make things better for everyone, which means that you''ll find
    your software has been translated into hundreds upon hundreds of different languages,
    most of which aren''t supported by Microsoft simply because it isn''t commercially
    viable.


    # 6 Linux is growing


    Every year, more and more people are realising there''s no point paying for software
    when there are free programs that are just as good (and often better). This is
    particularly noticeable in big companies, where converting 1,000 computers from
    Windows to Linux saves a huge amount of money, but it''s also important for home
    users who would rather save their money and buy a new computer or are perhaps
    just sick of Microsoft software.


    # 7 Linux has something for everyone


    Whether you''re a programmer, a writer, a designer, a parent looking for something
    for their children or just someone looking to get the most from their computer,
    you''ll find Linux has lots of software ready for you to use. Forget ''shareware'':
    if you want to do DTP, if you want to burn DVDs, if you want to scan for viruses,
    if you want to touch up your photos, if you want to rip music to MP3, or if you
    want to do any number of other things, you''ll find that Linux already has some
    great software ready to try. Don''t be afraid to click through the various programs
    that come installed by default – they are all safe to try, and it''s a great way
    to find your feet.


    DTP, if you want to burn DVDs, if you want to scan for viruses, if you want to
    touch up your photos, if you want to rip music to MP3, or if you want to do any
    number of other things, you''ll find that Linux already has some great software
    ready to try. Don''t be afraid to click through the various programs that come
    installed by default – they are all safe to try, and it''s a great way to find
    your feet.


    # 8 Linux looks great


    If you think Vista looks hot, Linux is about to blow you away. As with Windows,
    you can customise the look and feel of your desktop – changing fonts, colours,
    screensavers and the like. But if you have the right hardware (and it doesn''t
    take much) you can also enable a true 3D environment that puts your desktop on
    a


    # What is Linux? What is a distro?


    Most people refer to ''Linux'' to mean their entire computing desktop – the word
    processors, the games, the MP3 players and well, everything! But technically,
    ''Linux'' is actually just the core part of the system: it looks after your hardware,
    runs programs, but generally stays out of the way. This is known as the kernel,
    because it really does sit at the centre of everything.


    Now, above Linux is just about everything else you''ll be using: OpenOffice.org,
    Firefox, and such. But remember: the principle of Free Software is that anyone
    can take some programming code, modify it as they see fit, and release their own
    version. In fact, it''s very rare for Linux to have just one program for a particular
    need. For example, OpenOffice.org is a great office suite, but you could also
    use AbiWord, Gnumeric, KWord or any number of other similar products. And yes,
    they are all free, so you can try them and find which one solves your problem
    the best.


    This need to be able to choose exactly what you run extends even further with
    the concept of a ''distribution'', usually abbreviated to ''distro''. There are
    hundreds – perhaps even thousands – of different Linux distros, and each one has
    something unique or unusual about it. For example, Ubuntu is designed to be very
    easy to use; Fedora is designed for power users; Gentoo is designed for people
    who want maximum speed; and so on. Each one will come with a different selection
    of software, so when you choose your distro you will usually pick the one that
    has the software you want as standard – although, of course, you can always change
    the software selection after installation!


    Please don''t think that all this choice leads to a very fragmented Linux desktop,
    because it doesn''t: they all share the same Linux kernel, the same programming
    tools, the same desktop choices, and the same filesystem structure. As a result,
    much of what you learn about one distro applies to any other distro out there,
    because they are all building from the same common ground.'
