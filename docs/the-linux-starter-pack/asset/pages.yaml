    magazines or buy books. This special edition of Linux Format contains 100 pages
    or so of tutorial content on a wide variety of topics, but we print a magazine
    every month that usually contains 20 or more pages of tutorials to help you get
    more from Linux, along with subject introductions, interviews, product and distro
    reviews, and features. The advantage to reading the monthly editions is that you
    can slowly build up your collection, following tutorial series that interest you,
    and over time you’ll find yourself the master of your new Linux box.


    Aside from Linux Format, several other magazines regularly print Linux tutorials,
    guides and news stories that the fledgling Linux user is likely to find interesting.
    PC Plus prints at least one Linux tutorial each month, along with a great selection
    of news and reviews. For a less experienced audience, PC Answers prints beginners’
    tutorials, as does PC Format magazine.


    If you’re looking for more immediate coverage of a specific topic, it’s time to
    invest in a book or two. Four major publishers sell books on Linux:


    » Apress sells technical books for technical readers that cover a wide range of
    highly niche topics. This is not necessarily a bad thing – in fact, Apress has
    made quite a name for itself in finding new markets. Unless you’re already a well-seasoned
    veteran, Apress books probably aren’t the best choice.

    www.apress.com


    # Commercial support


    If you buy your copy of Linux you may be entitled to technical support from the
    distro maker. Most versions of Linux are free (or cost only a little. To pay for
    media and shipping), and therefore don’t come with technical support. However,
    some distros offer a few months of telephone support, and business-targeted distros
    (such as Red Hat Enterprise Linux, Mandriva Corporate Server and SUSE Linux Enterprise
    Server) come with at least one year of technical support. Commercial support is
    the fastest, easiest and most precise way to get answers to your questions. If
    you are looking to deploy Linux on mission-critical systems, purchasing a maintenance
    contract is a vital addition – you can get four-hour priority turnaround, level
    3 support (where the kernel developers themselves are assigned to fixing your
    problem), easy maintenance and more by using an enterprise distro.


    > For mastering Emacs and many other esoteric topics, O’Reilly books are best.


    » O’Reilly mainly sells highly technical books on niche topics, such as how to
    build your own compiler, how to master Emacs and how to program PHP. If you want
    accurate, well-written books on a single Linux topic, O’Reilly simply cannot be
    beaten.

    www.oreilly.com


    » Sams sells books primarily aimed at newcomers to Linux. It prints the Fedora
    Unleashed and the Teach Yourself series; as well as more complex books such as
    Advanced Unix Programming. If you’re looking to move from absolute beginner to
    intermediate level, look for Sams books.

    www.samspublishing.com


    next door, the son-in-law, or someone else stereotypically well-trained in the
    secrets of computers. It’s a shame, as the forums that have grown up around the
    open source community is a great place to get answers to your questions.


    But it’s important to remember that these people in the community aren’t paid
    to help, they aren’t trained to help and they aren’t related to you: any help
    they offer comes from goodwill, so it’s important you do your best to be nice
    to them. If you want to ask a question, follow these seven simple guidelines and
    you’ll give yourself the best chance of it being answered:


    > “If you’ve read all you can and are still drawing a blank, it’s time to reach
    out to the community and ask for help.”


    » Wiley sells a mix of intermediate and very technical books, primarily aimed
    at existing users who want to know more. Wiley publishes the Bible series, aimed
    at more experienced users, and the Dummies series, which is aimed at people who
    have little experience with computers, whatever the operating system.

    www.wiley.com


    The cost of an average ‘small’ Linux book that covers a single topic is usually
    around £15 from an online book store, and that rises to about £25 for a ‘cover
    everything’ book that can teach you a lot more. What you choose really depends
    on how much you want to learn, and most people find a mix of books and magazines
    satisfies their craving for knowledge.


    # Getting in touch


    If you’ve read the documentation, checked with magazines and books and are still
    drawing a blank, it’s time to reach out to other members of the open source community
    and ask for help. Very few people are naturally good at asking for help online
    – most of us ask the teenage kid


    +   1 Read the manuals first, and if that fails, search the web. If your question
    has a very obvious answer that you could have found in the man page or by running
    the most basic query on Google, you can expect the rather abrupt answers “RTFM
    (Read The Fine Manual) or “STFW” (Search The Flipping Web). These are meant to
    be a little insulting, as the person clearly thinks you haven’t actually tried
    to answer the question yourself. Keep in mind that a lot of these people are naturally
    very blunt-spoken, and don’t mean to hurt your feelings.


    +   2 Don’t ask to ask your question, just ask. That is, rather than saying, “Is
    this the right place to ask a question about Perl?”, just go ahead and ask the
    question. If you’re in the wrong place, you will be told.


    +   3 If your question starts with “can I…?” it’s probably best you don’t continue.
    If you want to know whether something is possible, the answer is “try it”. If
    it doesn’t work, then either »'
