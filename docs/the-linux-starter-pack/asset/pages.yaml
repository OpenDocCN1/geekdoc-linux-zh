    to cover just a few we think are the most useful. But this doesn''t mean we''ve
    exhausted all the tools we''re interested in either. One of the best things about
    Linux is choice, and there is just so much software to choose from. If you take
    a look at the Synaptic package manager, the tool used for installing extra stuff,
    you''ll find it


    contains thousands of tools, utilities, applications and games. You could spend
    weeks trawling through them all. But there are many more projects than those with
    official recognition from Ubuntu. If you look at a site such as Sourceforge.net,
    a hub for open source projects, you''ll find over 173,000 registered projects,
    most of which will work with Linux. There''s no quality control, but it just goes
    to show how active the open source community is and why Linux is a portal to a
    whole new way of thinking.


    # Kino


    The tool to use when you want to edit your own movies for YouTube and even DVD.


    Thanks to digital cameras usually having the ability to record movies as well
    as take photos, video editing is a prerequisite for a desktop computer. Both Apple''s
    OS X and Microsoft''s Windows bundle video editing applications, and this has
    helped make video editing technology mainstream. Websites like YouTube and MySpace
    wouldn''t be half as popular if you couldn''t watch something. Kino is the Linux
    equivalent to the video editing applications you find bundled with other operating
    systems. It attempts to be easy enough for the beginner to use while still being
    powerful enough to create professional results.


    After you''ve imported your videos, the timeline is the place where you can edit
    their order.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_103_0.png)


    After installation. Kino can be found lurking in the Sound & Video menu. The first
    thing you need to do is get video into the application. Kino''s native format
    is DV – the raw stream of video that many digital video recorders generate. You
    can import your video directly from your FireWire device by switching to the ''Capture''
    page and pressing record. Most


    devices will work. If you''d rather import your movies by hand, you can add video
    content from the File > Open requester, after which all imported video will appear
    in the timeline window. This is where you can re-order each sequence, placing
    clips into the correct order. If you need to edit larger segments, then the ''Trim''
    window can be used to create cut points, putting new clips back into the timeline.
    You can also add effects in the FX window, examples include blurring video or
    forcing a sepia colour on everything. The FX window is also where you find transitions
    that can be used to fade from one clip to another. Just select the transition
    from the drop-down menu, followed by the start and end point in your movie for
    the transition and click ''Render''. When you finish editing your masterpiece,
    the Export window can send your movie to your digital video recorder, a raw DV
    file or an MPEG that can be burned on to a DVD.


    # Importing videos


    One of the main problems you''re likely to encounter while dealing with audio
    and video files within Linux is compatibility. You may find that files you pull
    on to your machine from other systems don''t work. Windows Media is the main culprit,
    but Apple''s QuickTime can also cause problems, as can any of the plethora of
    formats commonly used online. Even MP3 playback can cause problems. This is because
    all these formats are proprietary, and decoding them so that they work on Linux
    is a legal grey area in some parts of the world. You can avoid these problems
    by using open formats such as Ogg Vorbis for audio and Ogg Theora for video, but
    sooner or later you''ll need to work with a proprietary format. For video, the
    answer is to install a package called FFMPeg from the Synaptic package manager.
    Applications such as Kino will then be able to convert most of your files to an
    open format when you open them. This is the next best thing to a native solution.'
