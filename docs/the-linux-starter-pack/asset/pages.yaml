    # Submitting statistics


    The Add/Remove Applications dialog gets its popularity information from a program
    known as Popcon, which is short for ‘popularity contest’. This program scans your
    system to see which packages you have installed, then uploads it to the central
    Ubuntu server so that they can figure out which packages people use and which
    they don’t, using that to guide their decisions as to which software people really
    want to see supported. By default, Popcon is installed but not enabled, which
