- pgno: 5
  md: '# Welcome to Linux!


    Step 1: Buy this magazine. Step 2: ??? Step 3: Profit! Now, let''s see if I can
    give you a little more detail about step 2...


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_5_0.png)


    Switching to Linux doesn''t have to be hard. In fact, we want to make sure it''s
    as easy for you as possible, and you''ll be glad to hear that you''ve already
    completed one of the hardest steps just by obtaining this magazine. I''m sure
    you have lots of questions, but before we get to them I first want to tell you
    a little bit about Linux.


    # 1 Linux is free!


    That''s right – Linux is completely free! You can take the DVD that came with
    this magazine, copy it a thousand times, and give it to everyone you meet if you
    want to. You can even pop your own logo on the front and sell it if you really
    want to, because everything really is completely free.


    # 2 Linux looks and works a lot like Windows


    Scaremongers like to say that Linux is really hard, that your Windows skills will
    be useless, that you''ll get stuck and won''t be able to find any help or that
    Linux just doesn''t have the same features as something like Windows Vista. But
    I can assure you they are wrong: while Microsoft Windows certainly has the lead
    in terms of market share by a large margin, it certainly isn''t the best operating
    system out there. After all, if popularity alone made something good, McDonald''s
    would be the best food on the planet! Not only does Linux match Windows feature
    for feature, it also has much lower system requirements. As anyone who has run
    Vista on 1GB of RAM or less will tell you, Windows can be pretty memory-intensive.
    Linux, on the other hand, runs comfortably on 512MB or even less – there are even
    special versions of Linux designed to run on 32MB of RAM using CPUs that haven''t
    been considered top of the line since the late 90s! Of course, if you want the
    very best that Linux has to offer, you should consider 512MB of RAM and an 800MHz
    CPU the minimum. With that, you should be able to enable all the features and
    have a great computing experience.


    > Looking for special effects? Linux is just what you''re after.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_5_1.png)


    memory-intensive. Linux, on the other hand, runs comfortably on 512MB or even
    less – there are even special versions of Linux designed to run on 32MB of RAM
    using CPUs that haven''t been considered top of the line since the late 90s! Of
    course, if you want the very best that Linux has to offer, you should consider
    512MB of RAM and an 800MHz CPU the minimum. With that, you should be able to enable
    all the features and have a great computing experience.


    # 3 Linux has lots of software ready for you to try


    Sometimes the hardest part of switching to a different operating system is figuring
    out which programs to use. For example, Microsoft Office runs just fine on Windows,
    but Microsoft doesn''t make a version for Linux – hardly a surprise, as you can
    imagine! The same goes for Microsoft''s Internet Explorer web browser. When you
    switch to Linux, you can choose either to leave those programs behind and use
    their Linux equivalents, or you can try to run them using a special Windows compatibility
    layer known as Wine. If I were you, I wouldn''t worry too much about Wine for
    now, because there are tens of thousands of programs available on Linux, and nearly
    all of them are completely free just like the rest of Linux! What''s more, you
    may be familiar with some of them already because they run on Windows as well
    as Linux – Firefox, OpenOffice.org, Thunderbird, Gimp and many more run on Windows
    and Linux, and if you''ve used them before you''ll find that they work just the
    same on Linux. The best bit about all this is that all this software lives in
    a software repository that you can access from your Linux desktop. It will show
    you all the software you can install, and you just choose the applications and
    packages you want to have them automatically downloaded for you.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_5_2.png)


    Linux is designed to have security at the very centre of the system, which is
    why it''s so popular for servers.'
