- pgno: 57
  md: '# Games


    # Linux games


    Games might not be the main reason why you''ve tried Linux, but it''s likely to
    be one of the main reasons you don''t look back.


    # What we look at:


    +   Card games

    +   Solitaire

    +   Freecell

    +   Educational

    +   GCompris

    +   Sudoku

    +   Puzzle games

    +   Fish Fillets NG

    +   Crack Attack

    +   Arcade games

    +   Trackballs

    +   Pingus

    +   Adventure

    +   Battle for Wesnoth

    +   Egobo

    +   Party games

    +   Alien Arena

    +   Frets on Fire


    We''ll get the bad news out of the way first. If you''re an ardent PC gamer, you
    won''t be able to play many of your favourite AAA titles on your new Linux desktop.


    Most games publishers don''t feel that there''s a big enough Linux market to warrant
    the extra time it would take to convert their titles to Linux. As a result, most
    of the big game releases you see on the Windows platform won''t make it to Linux.
    But if games are your thing, you shouldn''t be disheartened. There are still some
    commercial game publishers porting their games to Linux, but more importantly,
    there''s a thriving homebrew/DIY games community. This means that while many Linux
    games won''t have quite the same production values that you may be used to with
    a commercial release, they more than make up for this with their creativity and
    innovation. It''s a little like how gaming used to be before consoles made it
    big business. And the great thing about Linux games is that the overwhelming majority
    of them are free. Over the course of the next few pages, we''re going to give
    you a brief tour, covering some of the best Linux games. Give yourself a couple
    of hours, then click on the Applications > Games menu to start the fun.


    # Solitaire


    The first game most people want to play when they fire up their new operating
    system is a card game, and Linux has plenty. You can find these without installing
    anything from the Applications > Game menu, and the two most popular are Klondike
    (more commonly known as Solitaire) and Freecell. Both of these games existed before
    computers, and both could be played alone with a pack of cards.


    With Klondike, 28 of the cards are laid face down in seven columns of increasing
    numbers. The top card on each column is turned over and the rest of the pack laid
    down to the side, a pile known as the ''stock''. The idea of the game is to build
    four piles for each suit, starting with the ace and working up to the king. You
    can move cards across the columns as long they form a descending sequence of alternating
    colours. The top card of each column must always be turned over, and when you
    can do no more shuffling around with the columns, the top card from the stock
    is turned over, and you can choose to take this. If you''re more used to the ''three
    card'' deal from the stock, you can enable this option from the Klondike menu.
    Of course, on the desktop all the monotonous card management is done automatically,
    and all you have to worry about is building the four columns for each suit.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_57_0.png)


    Suzanne Vega wrote a song called Solitaire about the addiction many people suffer
    for card games such as Klondike.


    # Freecell


    Freecell is similar to Solitaire, except that all the cards are visible at the
    start of the game and are stacked into seven columns. You can move cards around
    these columns using the same stacking rules used for Solitaire. You have to shuffle
    the columns around to free the cards you need, starting with the aces, which need
    to be placed in the four cells top-right – building the suits just as you do in
    Solitaire. There''s more strategy involved, as you attempt to free the cards you
    need by moving cards across columns and into the freecells.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_57_1.png)


    Freecell plays like Solitaire but is considered a more skilful game, as success
    is less reliant on the random order in which the cards appear in the shuffled
    deck.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# GCompris


    GCompris is a suite of games designed to educate children between the ages of
    2 and 10. Each game is a mass of colour, and there are over 80 activities for
    your children to play split into various categories. There are games that let
    players assemble famous paintings, games that teach them how to use a mouse (by
    playing a dot-to-dot) and games that involve simple arithmetic, spelling and even
    algebra. All feature beautiful presentation, including spoken instructions for
    many, and everything should be clear enough that your child can play unattended.


    Before you get started with the games, you need to create an account for your
    child so that their progress can be monitored and the games list tuned to their
    ability. The administration window is launched from the Education menu. From here
    you can even configure GCompris for classes of children. For individual players,
    just click on the ''Profiles'' button followed by ''Add''. Click on OK to make
    the changes, then switch


    to the Boards view. From here you can assign what the child can and cannot play.
    Click on the filter button, and restrict the range to your child''s ability. One,
    two or three stars should suit 2-6-year-olds, while games adorned with the more
    complex star patterns are designed for those aged 6-10.


    You will be able to come back to the administration reports on the following page
    to see how well your child is going after they''ve some time playing games.


    The main application can be found in the Games menu, under ''Educational suite
    GCompris''. A few moments later, you will be presented with the Home screen. It''s
    from here that you (or your child) can launch any games they may want to play.
    Each game can be found under a sub category, with symbols representing each category
    listed down the left-hand side of the screen. Each game icon features one or more
    of the star icons we used to filter difficulty. The categories include puzzles,
    mathematics, strategy, reading, discovery, computing, amusement and experimentation.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_58_0.png)


    With so many activities to choose from, GCompris should keep your children entertained
    for hours.


    You can fine-tune GCompris to the age range of the children who are going to play.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_58_1.png)


    # Sudoku


    There can be few people who haven''t discovered the joys of Sudoku in the newspaper
    on the train journey home. With Linux, it''s also possible to play when you get
    home, although that might not always be a good thing if you''ve got a life to
    get on with.


    Sudoku is launched from the Game menu, and if you are one of the few who have
    never played it before, the matrix of numbers that greets you may seem a little
    intimidating. The idea of the game is that you have to work out what numbers should
    be in the blank spaces. These need to be a number between 1 and 9, but you can
    only have one of each digit in each row and column. The other rule is that each
    smaller nine-segment square will also contain the numbers 1-9. Between those two
    rules, you should be able to work out which number goes where. The best place
    to start is by looking at the nine square segment with the most filled squares.
    Work out which numbers are missing, and then work through the blank


    squares to see if any of the numbers will fit - remembering to make sure that
    the same number doesn''t appear again in the row or column attached to the square.
    When you think you''ve found the number, double click on the square to select
    the digit from the pop up menu. It''s easier than it sounds, at least to begin
    with.


    The game starts in beginner''s mode, so you should be able to crack it. This version
    of Sudoku also has a couple of features that can make your life easier. You can
    make notes in the corners of the blank squares by double-clicking in either the
    top or bottom half and typing your note. These are commonly used to write down
    numbers that can potentially be used within the square. The highlighter button
    can also help to read across the current column and row. Clicking on Hint will
    fill the note field with a list of possible values for the selected square, and
    as a last resort, you can click on ''Fill'' to automatically add the correct number
    to the current square. But where would be the fun in that?


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_58_2.png)


    Perhaps Sudoku''s popularity is a direct result of the terrible train service
    we endure in the UK. If it weren''t for constant delays, none of us would have
    the time to play it.'
