  md: '# 20 top apps


    # Audacity


    # Professional-grade audio editing on your Linux desktop.


    You may have come across Audacity before. It’s an audio file editor that’s as
    adept at trimming your latest podcast as it is adding fade-outs to an MP3. Like
    its proprietary counterparts, it can be used to add real-time effects, mix audio,
    record from your soundcard’s inputs and analyse audio. It’s a tool box for audio
    editing, and it should be the first app you try if you need to do anything with
    sound files.


    Audacity is launched from the Applications > Sound & Video menu. By default, Audacity
    will configure itself to use your sound card for input and output. This means
    you can make a recording by pressing the large red record button, and Audacity
    will record whatever is connected to your sound card. If you need to change the
    input, switching from line-in to a microphone for instance, this can be changed
    from the Edit > Preferences > Audio I/O window. If there is sound entering Audacity,
    the level meters above the small microphone icon will start to bounce, and it’s
    this sound that will be recorded.


    Audacity can load WAV, AIFF, MPEG, Ogg Vorbis and FLAC file formats from the File
    > Open requester, and you can load more than one at the same time by using the
