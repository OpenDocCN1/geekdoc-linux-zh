    # What''s in this magazine


    This is a magazine aimed at helping you get things done with your computer. Yes,
    we''re focusing on Linux, but we don''t think you really care what you use, because
    what you really want is a computer that''s fast, featureful and full of cool things
    to try – the fact that it''s Linux that provides all those things and more is
    probably secondary! As a result, we''ve tried to focus on helping you get more
    from your computer. So, in this magazine you''ll find:


    +   1 How to install Linux

    +   2 How to find your way around

    +   3 How to customise system settings to get things just the way you want them

    +   4 How to find common programs such as web browsers, email clients and more

    +   5 How to create brochures, spreadsheets and simple databases

    +   6 How to touch up your photos and create original artwork

    +   7 How to play games and chat to your friends


    And there''s even a special troubleshooting section starting on p110, which can
    guide you through all the most common problems newcomers experience on Linux.
    In short, this is magazine dedicated to helping you succeed with Linux – we''ve
    written it to help you learn, to help you avoid problems, and to help you get
    the most from your computer.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_7_3.png)


    # What isn''t in this magazine


    Now you know what is in this magazine, let me tell you what isn''t in here:


    +   1 Boring theory

    +   2 Useless facts

    +   3 Geeky jargon


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_7_4.png)


    Why pay for a DVD burner when you get one free with Linux?


    By buying this magazine, you''ve actually already done the hardest thing when
    switching to Linux'
