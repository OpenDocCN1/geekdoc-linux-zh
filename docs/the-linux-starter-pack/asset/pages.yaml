- pgno: 91
  md: '# Printing


    # Setting up

    your printer


    Getting your printer to work with Ubuntu is simple; just follow this tutorial
    to get the inside information on how to do it.


    Having access to a printer is a crucial part of your desktop environment, especially
    in the age of digital photography, with many people purchasing printers for the
    sole use of printing out their photographs. However, whether you are producing
    simple epistles or high-quality newsletters that are distributed to a wide number
    of recipients, it’s important that you can successfully connect and configure
    your printer to get the best results. Ubuntu makes this whole process incredibly
    easy, and you should be up and running next to no time.


    If you haven’t yet purchased your printer, it might be a good idea to do some
    preliminary research before you go out and buy one. Not only should you be interested
    in the quality and speed of printing, but also whether or not it is supported
    by Linux. Don’t worry too much, as a huge number of printers are either directly
    supported or supported through a generic driver.


    If in doubt, head on over to http://openprinting.org to search their database.
    As a rough rule, try to stick to printer-only models; multi-function machines
    (scanners, fax machines etc) can prove tricky to configure and get working. Ubuntu
    supports a range of connection methods, so you may want to consider buying a network-enabled
    printer that will allow you to use it without it having to be tethered to a computer.
    Also included is USB support and the older parallel port connectivity. Ubuntu
    will even let you share printers among a number of workstations, allowing you
    to set up a printer once and connect to it easily from other clients.


    In this walkthrough, you’ll see how Ubuntu can automatically detect and configure
    your printer. We’ll also cover some of the other printer-related options that
    you can set using the tools supplied with Ubuntu.


    # Step by step: Print with Ubuntu


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_91_0.png)


    1 The easiest way to set up a printer is simply to plug it into your computer.
    If Ubuntu detects that a printer has been connected, you’ll see a small icon appear
    in the taskbar with a magnifying glass, indicating that Ubuntu is searching for
    information and drivers about the printer.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_91_1.png)


    2 Ubuntu has detected and installed the correct drivers for the newly-connected
    printer. It is now available for printing, so you can go ahead and start using
    it. Sometimes you might need to change some of the defaults, so click the Configure
    button to open up the Printer Configuration tool.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Printing


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_92_0.png)


    3 Ah the beauty of open source; Ubuntu’s printer configuration tool is derived
    from System-config-printer, which is a tool created for Fedora, another Linux
    distro. In the opening screen you can change the Printer Description and also
    print a test page to check the configuration.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_92_1.png)


    4 Under the Policies tab you can quickly disable access to a printer should you
    need to carry out any maintenance on it. Also of use, especially in a corporate
    environment, are the starting and ending banners, which allow you to add additional
    pages before and after the main print job.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_92_2.png)


    5 Access Control allows you to specify users who can or cannot use the printer.
    In our example, we’re keeping the printer to ourselves and not letting the rest
    of LxF Towers have access to it. This could come in useful if you want to prevent
    your kids from wasting valuable colour ink cartridges!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_92_3.png)


    6 Printer Options lets you set page size, quality and whether or not you use double
    sided printing. Note that resolution, quality, ink type etc is controlled by the
    Printout Mode drop-down box, so if you choose High Quality your printer will automatically
    choose a higher resolution.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_92_4.png)


    7 Job Options is the place where you can choose exactly how each submitted print
    job is handled. Here you can choose to print multiple copies or change the margins
    of the print out. Bear in mind that these options will override any that have
    been chosen when a user prints to that printer.


    # Printing resources on the web


    Where to go for more information


    There may be occasions when Ubuntu just flat out refuses to recognise your printer.
    In these (rare) cases, your first step should be to Google the model of the printer
    along with the word Ubuntu or Ubuntu 7.10. It’s actually quite an effective way
    of finding information quickly and allows you to benefit from the experience of
    other people who may have been in the same situation as you.


    If that provides no joy, then try some of the following sites:

    www.openprinting.org Part of the Linux Foundation, you’ll find a comprehensive
    list of printers along with a breakdown of the level of compatibility that you
    can expect from Linux.

    http://hplip.sourceforge.net The official HP website dedicated to the HP laserjet
    and inkjet range of printers. You can find technical documentation, FAQs and other
    information that may be of help to you if you have an HP printer.

    www.canon-europe.com/Support/software/linux An official Linux driver download
    area for a limited number of Canon Pixma printers. However, these are unsupported
    by Canon themselves. If you have a Canon printer and would like to register your
    interest in getting a Linux driver, then click the Other Printer Users hyperlink
    and let them know!'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Printing


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_93_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_93_1.png)


    So that’s the initial plug and play installation of a printer, as well as some
    of the configuration options that you can set. In this next section we’re going
    to show you how to set up a printer that uses a network interface, something which
    is becoming more and more common. We’ll also take a look at sharing printers with
    other computers; after all, what’s the use of a printer if only one computer out
    of several can access it? Finishing off this tutorial, we’ll examine how you can
    use the CUPS web interface to configure your printers, neatly bypassing the GUI
    printer configuration.


    So you’re in the position where you need to add a network printer to your Ubuntu
    installation. By a network printer, we mean any printer that is accessed via an
    Ethernet interface, either directly connected to a network or connected via a
    network print server. In this tutorial we’ll assume that you are using an HP JetDirect
    card – these are the most common printers found in corporate environments, but
    you can tailor the instructions to your specific circumstances.


    # The CUPS way


    Doing it over the Web.


    Earlier we mentioned CUPS (the Common Unix Printing System), which forms a major
    part of the whole printing environment for Linux, not to mention Apple OS X and
    other Unix-based operating systems. CUPS is present on Ubuntu, although you tend
    to use the printer configuration tool to write the information that CUPS needs.
    It actually has a web-based interface that you can use if you want to, which is
    accessible by opening up your web browser and entering the address: http://localhost:631.
    Port 631 is the port that CUPS listens on for any requests, so when you enter
    this you’ll see the CUPS welcome page. Because it is the foundation for the printer


    configuration tool, you’ll find it very similar to what we covered earlier. Just
    click the Add Printer button on the front page to begin; all the questions you
    are asked are the same as the ones that we covered earlier with the only real
    difference being that CUPS begins by asking you to name the printer right at the
    start rather than at the end as with the printer configuration tool. As CUPS is
    integrated with the printer configuration tool, any changes you make within CUPS
    will be reflected in the printer configuration tool, and vice versa.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_93_2.png)


    The CUPS web-based configuration tool is at http://localhost:631.


    # Step by step: Setting up a networked printer


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_93_3.png)


    1 First and foremost, open up Ubuntu’s printer configuration tool by going to
    System > Administration and choosing Printing.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_93_4.png)


    2 You’ll see the blank printer config window; to get started, click the New Printer
    button in the toolbar. Ubuntu will automatically try to search for new printers
    that it might have missed. If it doesn’t find one, then you’ll be asked for the
    connection type.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Printing


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_94_0.png)


    3 If you’re setting up a network printer, we’d recommend assigning static IP addresses;
    make sure and consult your printer documentation for more information on how to
    do this. Meanwhile, click Forward to continue.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_94_1.png)


    4 The next screen that is shown allows you to select a Printer Manufacturer, in
    order to filter the sheer number of printers available. Scroll through the list
    and select the correct manufacturer for your printer and click the Forward button.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_94_2.png)


    5 Now you’ve chosen the manufacturer, it’s time to choose the specific model of
    printer that you have. You may see a couple of drivers available for a particular
    printer; we’d strongly suggest sticking with the recommendation, unless you have
    a specific reason to use another one. Once you’ve selected your printer model
    and driver, click Next to continue.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_94_3.png)


    6 Next up is the screen that allows you to provide some descriptive naming for
    the printer in question. This will help you if you have to share the printer with
    other people, as it provides a way to identify it. We’d recommend filling all
    three of these fields as they may come in use in future. The location is a must
    in a large corporate environment!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_94_4.png)


    7 We want to share this printer with other systems, so we need to tick the Share
