    +   1 **Enable remote login:** Choose the Remote tab from the Login Window Preferences
    dialog, and you''ll see that the Style option is set to "Remote login disabled."
    Change that option to be "Same as local".


    +   2 **Same as local:** This option means that whatever login theme you chose
    for local logins will be used for remote logins as well, which means your system
    will look nearly identical wherever you log in from.


