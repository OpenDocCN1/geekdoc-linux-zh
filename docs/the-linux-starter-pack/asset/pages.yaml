  md: '# Multiple accounts


    # than one account


    # Step by step: Add a new user


    1 Go to admin mode: Click System > Administration > Users And Groups from the
    top menu bar. This will ask you for your personal password before it lets you
    go any further, because changing user information is for admins only.


    2 The user setting panel: This shows you the list of all accessible users on your
    system. The "root" user is generally not used in Ubuntu, but you should also see
    your normal user account in there.


    3 Create a new user: From the User Settings window, click the Add User button
    and this screen will appear. You need to fill in the User Name, Real Name and
    Password fields. Don''t click OK just yet!


    4 User privileges: The second tab in this window shows the default settings for
    user privileges; you''ll note that they are allowed to do everything except "Administer
    The System". If you want them to be admins, just select that box too.


    5 No place like home: The default home directory for a new user starts with /home
    and ends with their username, but you can change that in the third tab of this
    window.


    6 Done: Click OK to save all the changes, and your new user will be created. When
    this is done, you''ll be back at the User Settings window, which should show the
    new user.


    7 Understanding groups: Click the Manage Groups button to see what user groups
    you have. Groups let you grant filesystem permissions easily.


    8 Log in: If you log out from your current account, you''ll be returned to the
    login screen where you can try using your new user. This is highly recommended
    to ensure the password and privileges are correct.


    9 Check privileges: We didn''t give our test user access to system administration
    tasks, and this can be confirmed by going to System > Administration – you should
    notice that the list has got a lot shorter.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Multiple accounts


    around a family, where it''s quite common to say "oh, you can get that file from
    me – it''s in my home directory under Photos." If users didn''t share permission
    to read files, it would be very hard to copy files between users! Of course, if
    you want your own files to be private from other users, this arrangement is no
    good, so let''s take a look at how you can create files and folders that can be
    read only by you.


    First, fire up Nautilus by clicking Places > Home Folder from the top menu bar.
    Right-click somewhere in the window that appears and choose Create Folder – name
    it ''Secret''. Now, like the rest of your home directory, this is visible to everyone
    else on the system, but we don''t want that, do we? So, right-click on the new
    directory and choose Properties, then activate the Permissions tab. This has quite
    a few options on it, but the one we''re interested in is about two-thirds of the
    way down, under ''Others''. Here you can set what privileges other users (ie,
    not you) should have for this directory.


    The default access permissions for directories like this one is ''Access Files'',
    which means that users can see all the files in the directory and read their contents,
    but they can''t write back


    any changes they make. Clicking the Folder Access selection box will reveal the
    other options. These are: None (deny all access); List Files Only (show the names
    of files, but don''t allow the contents to be read); and Create And Delete Files
    (allows full read and write access). That last option is great for making shared
    folders that everyone can read and save files to, but that''s the opposite of
    what we want here, so choose ''None'' and click OK. That''s it: this folder is
    now accessible only to you!


    If you want to make all your files private, what you need to do is go to Places
    > Home Folder, then look in the Nautilus toolbar for where it says the name of
    your home directory. To the left of that is a small arrow pointing left – click
    that, and a "home" button will appear, and if you click that you''ll see your
    home directory appear as an icon inside Nautilus. Now you can right-click on that,
    go to Properties > Permissions and change the permissions as if it were any other
    folder.


    > The About Me window lets you save user data beyond a simple username and password.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_65_0.png)


    # All about you


    Once your users all have their own accounts, you should quickly show them how
    to fill in a little bit of information about themselves – this is particularly
    important if they are outside of your home and you need to get in touch with them.
    In Ubuntu, user information is all set through the About Me window, found under
    System > Preferences > About Me – this lets you enter your email address, phone
    numbers and instant messaging account information, as well as your physical home
    and work address if you want to. More importantly, it also lets you change your
    password (click the button at the top-right of the window) and set your own user
    picture (click the person to the left of your username). Incidentally, all the
    options under the System > Preferences menu are individual to each user, which
    means they can have their own themes, sounds, menus, screensavers and even their
    own screen resolution, all without affecting other users.


