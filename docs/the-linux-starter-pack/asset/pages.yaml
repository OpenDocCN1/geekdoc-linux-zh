  md: '# # Ardour


    Turn your Linux box into a multi-track recording studio.


    Ardour is a multi-track recording application that''s more than up to the task
    of recording live performances. Development of Ardour is part sponsored by the
    SAE Institute, one of the largest educators of audio engineers in the world. As
    a result, Ardour can be considered a professional-grade solution, and is capable
    of recording and mixing large projects, as well as satisfying modest home studio
    requirements. If you want to see what it''s capable of, why not invite old bandmates
    over and give it a go?


    If you''ve ever used an application such as Cubase or Logic, Ardour''s main window
    should look familiar. Audio tracks can be added to the empty section with the
    audio for each track stretching as blocks to the right. By default, there''s only
    one track, which is labelled ''master''. This track represents the output on your
    sound card. To add further tracks, right-click on the light grey border to the
    left and below the master track, and select Stereo or Mono as a channel configuration.
    If you have a sound card with more than one input, you can change the input used
    for each track from the mixer window. From the Windows menu, select Show Mixer.
    This window mimics the functionality of a hardware mixing console typically found
    in recording studios. From the mixer view, you can change the volume of each track,
    as well as add effects and route the audio from one track to another. To change
    the input source for each of your new tracks, click on the small ''input'' button
    underneath the track name. The popup menu will let you choose your sound card’s
    other inputs.


    Go back to the main Ardour window. To record the sound coming into your sound
    card, record-enable each track you want to use by clicking on the red circle in
    each track before pressing the large red button at the top of the window. If you
    need a click track, press the Click button and adjust the tempo of the project
    by double-clicking on the Tempo strip. As you record, Ardour will generate blocks
    of waveform data that correspond to each track. If you''d rather use pre-recorded
    music than record your own, you can import music by right-clicking in the track
    and selecting ''Insert Existing Audio''.


    Choose the audio file you want from the file requester and Ardour will automatically
    add it to your project and insert it into the current position in the selected
    track.


    If you want to add effects to your audio, make sure you''ve installed the LADSPA
    plugin packages from Synaptic then right-click on the black space above the channel
    in the mixer view. Select New Plugin from the pop-up menu, and you''ll be presented
    with the list of plugins. From here you can add any plugin with one click, and
    you''ll be returned to the mixer view. Double-click on the plugin to open the
    editing window, and click on ''Bypass'' to enable it. You can change effect parameters
    as the audio plays, but you might want to click on S in the track view, as this
    solos the track, muting the others. When you''re happy with your mix, the final
    step is the mixdown. This is selected from the File > Export menu, and it will
    generate a final audio file that includes all the effects as well as your mix
    settings. Share this file to become famous.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_106_0.png)


    > > **Ardour is capable of recording and mixing dozens of tracks at once, which
    is a far cry from the simple days of four-track recording.**


    # ## Step by step: Track automation


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_106_1.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_106_2.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_106_3.png)


    **1. A is for auto** Automation is the ability to record mixer slider movements,
    as well as other parameters, directly into your project. Automation options appear
    when you click on a track''s A button.


    **2. Drag the fader** Select Fader from the automation menu. A track will appear
    for the fader data. Select Write from the top-right button, and any fader moves
    you make in the mixer will be recorded.


    **3. Draw a curve** You can automate almost everything. Try adding an effects
    plugin to the track and select a parameter from the automation pop-up menu. Use
    manual mode to draw automation by hand.'
