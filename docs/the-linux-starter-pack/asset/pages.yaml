- pgno: 14
  md: '# Linux desktop


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_14_0.png)


    # What''s on your desktop?


    As with Windows and OS X, your desktop is a directory on your filesystem just
    like any other. By default it starts nice and clean – if the Ubuntu install disc
    is still in your drive, you''ll see it ready to use on the desktop. Otherwise,
    your desktop will be completely clean. If you''re like us, your nice clean desktop
    will soon get really messy, and end up being swept into a single ''Old'' folder,
    before the process repeats itself and you end up with files strewn everywhere!


    A better solution is to be tidier, and if you look at the bottom-right of your
    screen you''ll see a little rubbish bin where you can drag files you no longer
    want. These aren''t deleted just yet, which means you can pull them back out if
    you change your mind later. Of course, if you''re particularly short on disk space
    you''ll want to delete them straight away – right click on the icon and choose
    ''Empty The Deleted Items Folder''.


    As with the Ubuntu install disc, any other media that gets plugged into your computer
    will appear as an icon on your desktop – that includes audio CDs, DVDs, or camera
    flash cards with photos on. In fact, you can plug your camera directly into your
    computer and import images into a photo album – it''s much more convenient than
    copying files across by hand!


    computer switched on. If you have multiple users in your household and the computer
    is left on all the time, this is the one you''ll use.


    # Restarting and shutting down


    Before you dive into the rest of the desktop, it''s important that you know how
    to turn the computer off – particularly if you''re on a train or if your dinner
    is ready! To see the various options, go to System > Quit from the menu at the
    top, and you''ll see seven options:


    +   » Log Out This logs you out of the system, but leaves the computer switched
    on. If you have multiple users in your household and the computer is left on all
    the time, this is the one you''ll use.

    +   » Lock Screen This leaves you logged in, but stops anyone else from using
    the computer without first typing your password.

    +   » Switch User This leaves you logged in, but allows another user to log into
    their account at the same time. Once they are done, they can log out and you can
    log back in to your account and pick up where you left off.

    +   » Suspend This is like a sleep mode for your computer. All the work you were
    doing is saved, and the computer shuts most of its internal systems off to save
    power – including the hard drive, the screen, the CPU, the networking, etc. To
    come out of suspend mode, press any key on the keyboard.

    +   » Hibernate This is like a deep sleep mode for your computer that actually
    switches it off completely – you can even pull out the power cable if you want
    to. When your computer hibernates, it saves all its RAM to the hard disk so that
    when it starts up next time it can reload the RAM as if nothing had happened to
    it.

    +   » Restart This reboots your computer. You may need to do this if you have
    run a system update.

    +   » Shut down This is the only option that actually turns off your computer
    the traditional way!'
  merge: -1
