- pgno: 16
  md: '# Linux desktop


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_16_0.png)


    Appearance, then choose the Background tab from the window that appears.


    The default selection of desktop backgrounds is quite thin, but that''s easily
    fixed – if you download another picture from the internet or from a camera, you
    can add it to the list by dragging it directly on to the window. Alternatively,
    if you have a whole directory of pictures you''d like to choose from, click the
    Add button. The screensavers are far more plentiful than the desktop backgrounds,
    but they are found in a different window – look under System > Preferences > Screensaver.
    Here you change which screensaver will be used, how long the system should wait
    until activating it, and whether the screen should be locked as soon as the screensaver
    is active. That last option is particularly useful, because it means that you
    can walk away from your desk and the system will be locked down as soon as the
    screensaver activates – anyone returning will have to enter a password to unlock
    the computer.


    If you''re a real tweaker, the promise of setting your own keyboard shortcuts
    is hard to resist – and Linux won''t fail you here! For example, if you have a
    laptop or special keyboard with shortcut keys, you can tell Linux what you want
    to happen when the volume keys are pressed, or Play/Pause/Stop. There are lots
    of other basic actions that are pre-defined, such as Log out (Ctrl+Alt+L) and
    Show Desktop (Ctrl+Alt+D), and many more that have no keys assigned to them by
    default.


    # Tweak your keys


    To get started customising your keys, go to System > Preferences > Keyboard Shortcuts.
    You can change any shortcut by clicking on it, then pressing the keys you want
    to use. If you want to use a letter or number (ie. A–Z or 0–9) you need to hold
    down the modifiers first. That is, if you want Ctrl+Shift+M to launch the media
    player, you can''t press M, then Shift, then Control – you need to hold down Control
    and Shift together, then press M while holding down the other two. Keep in mind
    that a fair few key combinations are already assigned for you: if you try using
    the same keys for a different shortcut, the old one will stop working!


    # Getting your keyboard to work


    If you find that "@" appears when you wanted "£", Linux probably thinks you have
    a different keyboard to the one you actually have. This is easily solved, and
    at the same time you get a whole raft of new options to play with. To change your
    keyboard settings, go to System > Preferences > Keyboard. You can change your
    keyboard type under the Layouts tab, but this is generally used for major changes
    such as the country or style (such as Qwerty or Dvorak) – minor changes, such
    as getting the Euro key to work correctly, are made under the Layout Options tab.


    The last tab in the keyboard preferences window is great for people who get sore
    wrists when they type, because it enforces a typing break at intervals you can
    set. The default is to allow you to work for 60 minutes then have a three-minute
    break – this ought to be fine unless you have very serious RSI. In which case
    you should knock down the work period as needed. Make sure you enable the ''Allow
    postponing of breaks'' option, otherwise you may have computer access cut off
    at a critical point!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_16_1.png)


    You can change the repeat rate, choose a new keyboard layout, and even enforce
    typing breaks – the keyboard preferences window has it all.'
  merge: -1
