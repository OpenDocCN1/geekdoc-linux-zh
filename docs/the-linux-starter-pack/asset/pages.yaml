- pgno: 121
  md: '# Glossary


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_121_0.png)


    **Konqueror** uses the same HTML rendering engine as Mac OS X’s Safari.


    **Kopete** Instant messaging tool for KDE that works with MSN Messenger, Yahoo,
    AIM, ICQ and Yahoo networks.


    **LGP** The GNU Lesser General Public License. This is a variant of the GPL that
    allows programs using so-licensed code to be distributed as part of proprietary
    software without the need to license that software specially.


    **Lilo** The Linux Loader, a bootloader that enables you to select which operating
    system you want to start each time your computer is turned on. Many distros allow
    you to use Grub for this instead.


    **Login** Linux requires that a user with a valid password validate themselves
    to the system before using it. This process – logging in – requires you to enter
    your username and password at a login prompt.


    **Mandriva Linux** One of the most popular Linux distros around, with a strong
    emphasis on usability and new features. Mandriva is largely funded by the community,
    through subscriptions to its Mandriva Club programme.


    **MCC** Mandriva Control Center, the heart of the system configuration system
    on Mandriva Linux. All options to install and uninstall software, set up your
    hardware and configure your network access are stored here.


    **Mount** To mount a device is to prepare it for reading and writing. For example,
    you need to mount a CD before you can use it. Some distros use a technique known
    as supermounting to automatically mount devices such as CDs and USB sticks as
    they are inserted.


    **Mozilla** Cross-platform, open-source web browser and email client based on
    the open source release of the Netscape Communicator suite. The Mozilla HTML rendering
    system, Gecko, has since been incorporated into Firefox, Epiphany, Galeon and
    several other web browsers.


    **Nautilus** The Gnome equivalent of Konqueror, with more emphasis on managing
    files and less on web browsing. Nautilus uses spatial-mode navigation, which means
    that each folder has its own Nautilus window, and it will remember the position
    and size of that window.


    **NFS** The Network Filesystem is a fairly primitive way for Unix machines to
    share drive space with other Unix machines. It is insecure, slow and inefficient,
    and so best avoided.


    **NTFS** New Technology Filesystem, developed by Microsoft for Windows NT, then
    extended in Windows 2000 and Windows XP. Linux has some support for NTFS, but
    it is limited because Microsoft has not revealed the exact data structures.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_121_1.png)


    **GNU** is a recursive acronym for GNU’s Not Unix, and is pronounced “Guh-noo”.


    **OpenOffice.org** The most powerful office suite available on Linux consists
    of Writer, the word processor; Math, the mathematics package; Calc, the spreadsheet;
    Impress, the presentation tool; and Draw, the vector art tool.


    **Package** A discrete application or container that can be installed into a Linux
    distro. There are several types of package, but the most common are RPM (for Fedora,
    SUSE and Mandriva Linux) and APT (for Debian, Ubuntu and Knoppix).


    **Package manager** Application that tracks which packages are installed, allows
    you to install or configure more packages, and also cleans up the system when
    a package is uninstalled.


    **Pan** Advanced Usenet newsreader for Gnome, with features like article header
    caching, filtering, multiple connections and easy binary decoding.


    **Partition** One slice of your hard disk that is functionally separate from the
    rest. A hard disk may contain just one partition (where everything is stored),
    but in Linux it is common to create multiple partitions – one for the OS, one
    for personal files, one for swap space, and so on. This allows you to reformat
    the OS partition, leaving your personal files intact.


    **Perl** Practical Extraction and Reporting Language (or Pathologically Eclectic
    Rubbish Lister, depending on whom you talk to) is a difficult but rewarding scripting
    language for Linux and other platforms.


    **Permissions** Access rights for files and directories on your system. Normal
    users have permissions to read programs, but not to write to them, whereas the
    root user is able to read and write over programs.


    **PHP** Recursive acronym that stands for PHP Hypertext Preprocessor. PHP is a
    web scripting language with tight links to databases and powerful XML processing.


    **PowerPC** CPU architecture used by IBM and Freescale as part of their primary
    desktop line of chips. IBM has extended PowerPC to servers and even supercomputers.


    **Prompt** Another term for the command line. There are many of these terms!


    **Proxy server** Proxy servers cache web server responses locally so that a given
    website loads faster the next time you – or someone else with access to the proxy
    – loads it. The most popular proxy server on Linux is Squid.


    **Python** Flexible, object-oriented programming language for Linux that is often
    used to create agile scripts in the minimum of time.


    **Qt** Graphical user interface toolkit produced by Norway-based Trolltech. Qt’s
    most popular use is behind the scenes of KDE, but it is also available on Mac
    OS X and Windows.


    **Red Hat** Arguably the most successful Linux company in the world. Red Hat’s
    main product is Red Hat Enterprise Linux. Its consumer-level product, Red Hat
    Linux, was spun off in 2003 with the launch of Fedora.


    **ReiserFS** Advanced journalling filesystem created by Hans Reiser and others.
    Its development has been sponsored by SUSE, Linspire and also the American Defense
    Advanced Research Projects Agency (DARPA). It is commonly thought to be the fastest
    Linux filesystem available.


    **Root** The administrator user in Linux. The root user (often called the superuser)
    has full access to the system, and can even destroy all data on the hard drive
    with a single command. It is not recommended that you log in or run as root beyond
    what you need to do.


    **Root directory** The top level in your Linux filesystem is called the root directory,
    or /. It is from this root directory that other subdirectories such as /etc and
    /home are mounted.


    **RPM** The Red Hat Package Manager was one of the earliest attempts to ease the
    burden of installing, maintaining, and uninstalling packages. Created by Red Hat,
    RPM'
