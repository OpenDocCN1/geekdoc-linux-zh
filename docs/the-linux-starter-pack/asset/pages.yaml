- pgno: 41
  md: '# Get started

    with... Base


    Storing data is easy, but searching it always used to be hard. However, now you''ve
    got *OpenOffice.org Base* on your side...


    Everyone has lots of information to keep track of: phone numbers on your mobile
    phone, addresses in a notebook, events in a diary, shopping lists on paper stuck
    to your fridge, and so on – wouldn’t it be nice to have all that information in
    one place? Wouldn’t it be nice to make it searchable, so that you can type in
    a few key words and pull up matching information? Well, that’s what *Base* offers
    to do for you: it’s a database program that stores information and makes it easy
    to find.


    In this tutorial you’ll learn how to create a CD database using Base, which means
    you’ll learn what databases and tables are, how to create them to fit your needs,
    and how to enter data. As you follow this tutorial, customise it to fit your needs
    – if you collect DVDs, stamps, spoons, or whatever, just change "CDs" for your
    type of collection!


    Before we start, there are a few basic things you need to know:


    +   1. Databases have lots of jargon that can be a bit confusing at first. If
    this is your first time using a database, don’t worry – it will all make sense!

    +   2. When working with a database, sometimes your changes are saved automatically.
    This is very important: think changes through before you make them, because the
    Undo might not help you much!

    +   3. One database in Base can hold many tables, as well as user interfaces to
    read from them and reports to make them print nicely. To give all these to someone
    else, you just need to give them one file.

    +   4. Base is capable of connecting to bigger, more complicated databases that
    run on servers – though this is beyond the scope of this beginners’ tutorial.


    If you have some experience with *Microsoft Access*, much of *Base* will look
    familiar to you, but we’d still advise you to take your time when following through
    this tutorial. At the very least, take a backup of your database before making
    any changes, just in case *Base* works a little differently to *Access*!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_41_0.png)


    Databases are the best way to store, search and sort large amounts of data.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_41_1.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_41_2.png)


    # 1 Database wizard


    When you start Base, the database wizard will automatically run. This lets you
    create a new local database (the default option), open one you created before,
    or connect to a database. That last option is for advanced users who want to connect
    to servers – just click Next for now.


    # 2 Table design


    This screen is pretty superfluous for beginners: if this is your first time running
    Base, just click Finish. However, if you have used Base before and want to get
    straight to designing your tables, click the Create Tables Using Table Wizard
    option first. We’ll just go with the first option – click Finish.'
