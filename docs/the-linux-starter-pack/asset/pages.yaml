- pgno: 61
  md: '# Games


    # Battle for Wesnoth


    As befits a title in this genre, Battle for Wesnoth is an epic. Its colossal size
    is matched only by the quality of its graphics and the quality of gameplay. Its
    developers describe it as a turn-based strategy game with a fantasy theme, and
    as soon as you start a new campaign, it’s easy to see what they mean. You can
    choose from several different scenarios, from a quest to destroy a troublesome
    black mage, to a Herculean battle across the lands of Wesnoth to wrestle control
    of the evil empire from the clutches of the Lich-Lord Jeyvan. Which is nice.


    As gameplay is turn-based, you have plenty of time to make each move, and if you’ve
    played a game like Settlers, you’ll now how it works. You start each campaign
    with several units. These could be simple peasant spearmen, horsemen or perhaps
    knights. Each unit has specific abilities, as well as a set range across different
    types of terrain. It’s your job to survey the local area, and move your units
    strategically so that you’re in


    the best possible position for any confrontation. Knights are more powerful than
    the other characters, but they don’t have the range of the spearmen, and there’s
    a similar trade-off with the other unit types.


    It might sound complicated, but thanks to excellent introduction and tutorial
    campaigns, it doesn’t take long to get up to speed with the game mechanics, and
    it’s worth the effort. Battle for Wesnoth is a wonderful game where you can spend
    hours tuning your strategy and building alliances. There’s also an excellent multiplayer
    component, where you can either join an official server, play with a friend across
    the internet, or even take turns to make moves on a single machine. This is really
    where Wesnoth is at its most fun.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_61_0.png)


    Battle for Wesnoth is a turn-based strategy game. It feels a little like a cross
    between Ultima and the Settlers series.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_61_1.png)


    # Egoboo


    There’s a long tradition of adventure games running on Linux and Unix systems.
    This is epitomised by a particular game called NetHack. NetHack is called a Rogue-like
    game because it is itself based on a game called Rogue, which was originally released
    in 1980.


    Rogue-like games share some of the same elements. There’s usually a degree of
    randomness, and a player’s strengths and weaknesses are based on random attributes.
    These attributes can be improved by gaining experience, either by finding objects
    or by destroying the enemy. And all Rogue-like games are set in a dungeon. Egoboo
    is one such game. But instead of the text-based graphics of NetHack, Egoboo has
    transformed this idea into three dimensions. And you’re no longer alone in the
    dungeon. Depending on the module you choose to play, you will be accompanied by
    other characters. Each module is a separate adventure. The quest is different
    each time, but you always play in a dungeon. One tasks is to clear the dungeon
    of


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_61_2.png)


    > Thanks to the excellent 3D graphics, Egoboo look and feels much more like a
    modern game than those that inspired it.


    grub bugs, while in another you need to rescue a group of faeries and guide them
    to a faerie ring.


    Control is entirely through the use of the mouse and keyboard – you need to press
    the A and S keys to perform actions on things while the middle mouse button will
    cause your character to jump. Combat is mild, as you use the right mouse button
    to take a swipe at any baddies in range. While the graphics


    could never be described as cutting edge, the cartoon style and the smooth gameplay
    adds a new dimension to the Rogue-like style of play. The game is a little rough
    at the edges, but that’s because it’s still being actively developed. If you enjoy
    games like Neverwinter Nights or old role playing games, then you should be able
    to get a lot of enjoyment out of this game, despite its silly name.'
