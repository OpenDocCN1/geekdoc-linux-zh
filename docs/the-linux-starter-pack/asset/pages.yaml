- pgno: 27
  md: '# Email


    free or busy on a particular date. To try this out, go to Edit > Preferences >
    Calendar And Tasks, then choose the Calendar Publishing tab and click on Add to
    create a new publishing location. In the new window that appears, choose Publishing
    Location. Here’s where it gets a bit more complicated: in order for everyone to
    be able to read your calendar information, you need to send it to a shared location.
    If you have an FTP server, a Windows server with a shared folder, a Linux server
    with SSH enabled, or (for more advanced users) a web server with WebDAV enabled,
    Evolution can help you share your calendar. If you haven’t got any of them, then
    you’re rather stuck! If you just want a quick calendar sharing system, public
    FTP is the easiest to use: specify the name of the server and the filename you
    want to give your calendar (including the


    directory), and you’re done. Back in the Calendar tab, you need to choose which
    calendar you want to synchronise to the server, then click OK when you have finished.
    The default is to synchronise calendars once a day, but you can override that
    as needed by going to Actions > Publish Calendar Information. If you want to collect
    other people’s calendar information, it’s even easier. Click the arrow next to
    the New button and choose Calendar, then change the Type option to be ‘On The
    Web’. Give it a name (eg, whose calendar is this?) and a unique colour, then type
    the full path to the calendar in the URL box. Unless it’s stored in a secure location
    you won’t need a username, and a 30-minute refresh time ought to be more than
    enough, so just click OK to have the calendar downloaded in Evolution immediately.


    # Step by step: Set up an email account


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_27_0.png)


    1 When Evolution first runs, you need to fill in its setup assistant wizard. As
    with all these wizards, you can go forward and back as you please until you get
    it right.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_27_1.png)


    2 If you’ve used Evolution before and have a backup of your settings, here’s your
    chance to use them. The rest of us should just click Next.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_27_2.png)


    3 On this screen you need to enter the name and email address you are setting
    up the account for. These will be used when sending emails so people can see where
    they have come from.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_27_3.png)


    4 There are lots of options for receiving emails; it’s really down to what your
    ISP/sys admin has told you! Chances are it’s either POP or IMAP, but you need
    to find out for sure.'
