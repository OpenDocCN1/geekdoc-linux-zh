  md: '# Step by step: Banshee and Synaptic


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_0.png)


    1 One of the other popular music players for Ubuntu is Banshee, which is not installed
    by default. To get Banshee, go to Applications > Add/Remove and search for Banshee.
    Add/Remove Applications will also automatically install any other software that
    Banshee requires.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_1.png)


    2 Banshee is a lightweight music player that allows you to use the metadata embedded
    in your ripped files to search and group music together. In common with RhythmBox,
    you can create smart playlists allowing you to easily group multiple tracks into
    a playlist according to your criteria.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_2.png)


    3 To rip your CDs using Banshee, you’ll need to set your encoding preferences,
    by going to Edit > Preferences and choosing your preferred codec. Once you’re
    ready, you can right-click the CD icon in the left-hand pane and choose the Import
    option.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_3.png)


    4 Ubuntu includes a dedicated Audio CD creator called Serpentine, found under
    Applications > Sound & Video. There are other CD-burning apps, but we’d recommend
    that you use Serpentine mainly because it shows you exactly how full your CD will
    be as you add music files.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_4.png)


    5 Click on the Add button to open up the file manager and navigate to your first
    music file to add to your new CD. Select one or more files to add, and click the
    Open button to add them to your track listing. Serpentine will show you the amount
    of time you have remaining on your CD.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_78_5.png)


    6 You can drag and drop the tracks to re-arrange the order in which they will
