- pgno: 63
  md: '# Multiple accounts


    # Working with more


    Linux is designed to work just as well whether you have one user on your machine
    or one hundred users – it’s easy!


    Back when you installed Ubuntu you were asked to create your first user, and that’s
    what you’ve been using exclusively since then. But Linux was designed to mimic
    the older Unix operating system, which was built to run on mainframes where hundreds
    – if not thousands – of users were logged in and working simultaneously. Unless
    you’re running your own internet cafe, it’s unlikely you’ll need more than a handful
    of users on your home computer, but Linux is able to handle that just as well.


    One thing to remember is that you – as the first user to be created – automatically
    have full rights over the system. You can give lower privileges to other users
    you create if you want to, or you can give them the same level as you, but be
    careful: if you give them administrator access to the computer, they will be able
    to install (and remove) software, change hardware configurations, and much more,
    which may break your Linux install! If you give them normal user privileges, this
    simply can’t happen.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_63_0.png)


    See and change user permissions for any file that belongs to you – make something
    private, or open for anyone!


    # Login options


    By default, Ubuntu prompts you for your username and password when logging in,
    but you’ll notice there’s a little button marked ‘Options’ in the bottom-left
    corner of the screen. This is most commonly used to shut down or suspend the computer
    without having to log out first, which is a real time-saver. There are also two
    other options of interest here:


    Select Session This allows you to choose a specific desktop environment to be
    logged into. The standard Ubuntu includes just Gnome, but we’ve included a version
    of Ubuntu on your disc that includes other desktops too.


    Enabling automatic login is only safe if you’re the only person using your computer,
    and not even if it’s a laptop.


    Remote Login via XDCMP This is an advanced option that lets you log into another
    machine as if you were actually there – you get the remote desktop and all your
    remote files.


    # Automatic login


    If you’re the only user of your computer, you might prefer to have Ubuntu skip
    past all the login nonsense and log you in automatically. But before you enable
    that option, you need to be aware that enabling auto-login is a security risk
    because anyone who gets physical access to your computer can read all your files
    without having to authenticate themselves. This is particularly important if your
    computer is a laptop!


    If you’re sure that automatic login is what you want, go to System > Administration
    > Login Window, then enter your password when prompted. The Login Window Preferences
    window will appear, and it has quite a few options – you need to click the fifth
    tab, ‘Security’. The first item on that tab will be a check box labelled ‘Enable
    Automatic Login’. Select that box, then choose your username from the list directly
    beneath it. Next time you restart your computer – and indeed every time you time
    until you disable this option – you’ll automatically be signed in as this user.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_63_1.png)


    # Sharing files


    Surprising as this might sound, the default setting in Ubuntu allows any user
    to read the files of any other user. This is done because most multi-user machines
    today are shared'
