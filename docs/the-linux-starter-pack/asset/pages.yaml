- pgno: 2
  md: '# Introduction


    # Welcome!


    If you''ve made it this far, you''re clearly among the growing number of people
    who are curious about Linux. I''m not sure what has led you here – perhaps you''re
    sick of installing security updates every other day, perhaps you''re tired of
    rebooting when your computer runs slowly, or maybe you''ve just had enough of
    the Blue Screen of Death – but whatever it was that brought you here, I''m glad
    to welcome you to the family of Linux users, and hope you''ll find that there''s
    a whole new world of computing here that can really put the fun back into it all
    again.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_2_0.png)


    This magazine is a one-off publication aimed at newcomers to Linux. That''s you,
    which means you''ve come to the right place! But Linux is a big world of software,
    and, while some of it looks and works just like the Windows or Mac software you''re
    used to, a lot of it will also be new, and that''s where this guide comes in –
    we''ve written it to be a comprehensive pack for new starters to Linux, with the
    goal of helping you to get the most from your computer with the least reading.
    You''ll also find a DVD bundled with this magazine that includes a complete, installable
    version of Linux for you to use. Yes, it''s true that there are lots of versions
    of Linux out there, but we''ve written this guide to accompany the software on
    that DVD, so if you want to get the most from all the tutorials we''ve provided
    for you, we recommend you use that disc to get started.


    Now it''s time for the adventure to begin. If you want to dive in straight away,
    turn to p10 for our install guide. If you''d like to read a bit more about Linux
    first – and I''d recommend it! – turn to p6. Have fun!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_2_1.png)


    Paul Hudson Editor

    paul.hudson@futurenet.co.uk


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_2_2.png)


