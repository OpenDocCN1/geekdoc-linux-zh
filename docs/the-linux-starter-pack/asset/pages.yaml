  md: '# Linux installing instructions


    # # Start here


    Your voyage to the land of Linux begins here: we’ll show you how to install it
    on to your PC and take your first steps.


    You’re just minutes away from a new journey in the world of computing. You’ve
    probably heard of Linux before picking up this magazine – and you may have heard
    some naysayers describe it as difficult to use. Far from it. Linux is simply a
    different operating system to Microsoft Windows and Mac OS X, with its own way
    of doing things, and enormous benefits:


    +   1. **Linux is free** You don’t have to pay any money for it, and you can download
    it free of charge from the internet in various flavours (called distributions).
    You can share it with friends, family and colleagues.

    +   2. **Linux is reliable** Google uses Linux on thousands of computers, a testament
    to its rock-solid foundations. It won’t randomly crash on you or get confused
    with bugs and glitches.

    +   3. **Linux is secure** Forget spyware, viruses and pop-up adverts – your Linux
    PC will be safe from hackers. This is one of the reasons why it powers millions
    of server computers around the globe.


    Accompanying this magazine you’ll find a DVD containing Ubuntu Linux 7.10, the
    most popular version of Linux. Let’s get ready to install it!


    # ## Preparation


    Chances are that your PC is currently running Microsoft Windows. (If it isn’t,
    or you’re happy to devote your entire PC to Linux, you can skip this bit.) Fortunately,
    Linux will happily co-exist with Windows on your machine, so you can choose which
    operating system to boot when you start your PC. However, there’s one vital step
    before we get going: BACK UP YOUR DATA FIRST! It’s unlikely that you’ll encounter
    any problems, but it’s better to be safe than sorry!


    # ## System requirements


    At a minimum, your PC needs:

    - 800MHz Pentium-compatible CPU

    - 300MB of RAM

    - 10GB hard drive space


    Linux needs some space on your hard drive, so if your drive is currently full
    (or heading towards that point), you’ll need to clear some room. At a minimum,
    we recommend giving Linux 10GB – but the more the merrier, especially when you
    start using it to store videos and music. So if your drive is nearly at bursting
    point, remove old applications and files to free up at least 10GB of space. We
    also recommend running the Windows Disk Defragmenter tool, to ensure that your
    hard drive is neatly organised.


    # ## Partitioning


    Your hard drive is split into sections called partitions. If you’re running Windows,
    it will most likely reside in a single, large partition occupying the entire hard
    drive. Linux needs its own chunk of the drive – its own partition – to run in,
    and the installer helps us out with this. When you’re installing, you can choose
    to resize your Windows partition and make room for Linux, or (if you don’t want
    Linux at all), let Linux occupy the entire hard drive.


    You’ll see this during the installation process (step 6). If you want to keep
    Windows, you can drag the slider across to free up room, and then the installer
    will create Linux partitions in the free space. Again, it’s best to give Linux
    at least 10GB of free space. If your hard drive is almost full, you won’t be able
    to drag the slider very far, so make space in Windows first!


    Right, with those two things covered, we''re ready to go. Follow the steps and
    get ready to become a Linux user!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_9_0.png)


    > Ubuntu Linux is simple to install – just follow our step-by-step guide, and
    you’ll be Linuxing in no time at all.


    # ## Problems booting?


    The DVD supplied with this magazine is bootable – that is, you can start your
    PC with the disc in your drive, and Linux will load up. Don’t worry, it won’t
    touch your hard drive until you choose to install it, so you can play around with
    Linux freely. However, if your PC doesn’t boot Linux but instead starts Windows
    as per usual, you will need to change some settings.


    Restart your PC and, at the very first screen that comes up (the BIOS screen),
    look for a message that tells you which key to press for the ‘Setup’ or ‘BIOS’
    screen. Normally this is Del, Esc, F1 or F2 – try pressing them if you don’t see
    a message. If nothing happens, consult your PC’s manual. When you reach the BIOS
    settings screen, look for the option to change the ‘boot order’, so that you can
    tell your PC to start from the DVD drive rather than the hard drive. Then save
    your settings and restart.'
