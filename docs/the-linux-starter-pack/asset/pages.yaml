- pgno: 31
  md: '# OpenOffice.org – writer


    # Writer: Create a List


    # 1 Enter the data


    Writer can create bullet lists and numeric lists automatically. First type each
    list item onto a separate line in the main document window. Each line will be
    used as a separate list item when Writer is instructed to format your list.


    # 2 Select relevant text


    The next step is to select the exact section of the document that you want to
    be used as a list. You can do this either by dragging the mouse cursor over the
    text, or by jumping to the start of the list text, pressing Shift and jumping
    to the end.


    # 3 Numbers or bullets


    Finally, select either the Bullet List icon or the Number List icon from the main
    toolbar (the latter has Roman numerals). Your highlighted text will be indented
    and either a number or a bullet is placed at the beginning of each line.


    # Writer: Create a Table


    # 1 Size IS important


    Click and hold down the mouse button on the table icon to open a small matrix
    representing the size of the table you want to create; e.g if you want a 3x3 sized
    table, drag the cursor until the size you want is highlighted, and then let go
    of the mouse button.


    # 2 Enter the information


    The table will be inserted into wherever the cursor is positioned in the current
    document. Select each cell and enter the information you need, pressing tab to
    move from one cell to the next. Select the entire table by clicking on its border.


    # 3 Cell formatting


    Select a cell, row or column and then use one of the text formatting tools. Try
    and add foreground and background colours using their icons in the toolbar. You
    can also drag the cell borders to stretch the size of the cells to the size you
    need.


    # Writer: Format your table


    # 1 Advanced options


    An advanced range of options for formatting your table can be accessed from the
    table toolbar, which is opened from the View menu. This, and other toolbars, will
    also open automatically when you select a table you''re already working on.


    # 2 Automatic formatting


    The AutoFormat icon lets you scan through a list of predefined table formats you
    can apply to your own table, as well as add your own modifications. Clicking on
    the More button will let you limit the parts of the table affected by the AutoFormat
    style.


    # 3 Appearance tweaks


    After changing the colours and text styles, you can change the borders that separate
    the cells. Holding the mouse button down on the Borders toolbar icon lets you
    choose between several Border styles. Experiment with the other icons for other
    styles.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Writer: Microsoft Office and PDF Output


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_1.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_2.png)


    # 1 Compatibility


    You can save your documents in a format that can be opened by Microsoft’s Office
    apps. All your formatting, tables and lists are preserved. You can also load most
    Office documents. Select Save As from the File menu to get to the Save requester.


    # 2 Microsoft Word compatible


    By default, OOo uses an open format: ‘ODT’. For best MS compatibility, choose
    Microsoft Word 97/2000/XP (.doc) for your document in the Save As Type drop-down
    list. You can then send this file to people using Word without any problems.


    # 3 Adobe PDF creation


    Writer can export a document as a PDF – Adobe’s widely used format. Either use
    the PDF button on the toolbar, or select Export from the file menu and ‘PDF’ as
    the file format. You can check the quality of the output using Adobe Acrobat Reader.


    # Writer: Insert images


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_3.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_4.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_5.png)


    # 1 Adding graphics


    You often need to insert pictures or clip art into your documents, and this can
    be done by selecting Picture > From File from the Insert menu. There are plenty
    of other formats that you can insert too, but images are the most common.


    # 2 Size and position


    After the image has loaded and been inserted into your document, resize it by
    dragging the edges of the image. You can also drag the image through your document.
    The image toolbar will appear too, and this can be used to fine-tune the image.


    # 3 Attractive layout


    To get text to flow around images, right-click on the image and select Optimal
    Page Wrap from the Wrap menu to position text. If the image uses a white background,
    try the Contour option to wrap the text around the details within the image.


    # Writer: Create labels


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_6.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_7.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_32_8.png)


    # 1 Label it!


    Sticky labels save labour and make things more legible generally. Writer has hundreds
    of label templates built-in for things like envelopes and CD cases; just start
    a new document of the type Labels by holding down the New button in the toolbar.


    # 2 Select a type


    It’s an address above, but it could be anything you want labels for. Select the
    type of label that you want to make from the drop-down Type list in the bottom
    right of the Labels window, then enter the text for the label in the area on the
    top right.


    # 3 Generate automatically


    Click New Document: the template governs how many labels are created – useful
    if you want to print a few pages of return addresses. You can even use a database
    of addresses and merge those into the document from the previous window.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Getting started with OpenOffice.org Calc


    Working with numbers has never been easier! OOo Calc has all the tools you need
    to make sense of all kinds of figures.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_33_0.png)


    If you''ve ever used Microsoft Excel before, you''ll have no problems getting
    to grips with OpenOffice.org Calc.


    Numbers make the world go round. Quite literally actually, if you think in terms
    of the Kepler equations. But no matter who you are and what your interest in office
    software is, it is almost a certainty that you will have some use for Calc. Whether
    it is for keeping track of club finances, exactly what types of beer you spent
    your student loan on, sales of your widgets or just the local football team''s
    chances of promotion at the end of the season, numbers – and things to crunch
    them – are always useful.


    OOo Calc should be pretty easy to use if you are familiar with any sort of spreadsheet,
    and you can probably skip the first part of this section, which covers dealing
    with cells and simple functions. Those of you who have not worked with a spreadsheet
    before shouldn''t worry – although the world of OOo Calc can get very, very complicated
    if you have large amounts of data to deal with, it can also be very, very simple.
    A spreadsheet is a versatile tool that helps you do things with numbers and data,
    from the very simple to the very complex.


    The spreadsheet is also like some sort of modern day forge, where the raw materials
    of information (say the results from an experiment or your monthly sales figures)
    are transformed into something more useful, like a pie chart or a short summary
    of profit and loss. The beauty of it is, you can change the machinery in this
    particular workshop without too much effort.


    > “As a rule, you can’t expect Excel macros to run properly under OOo without
    some modifications.”


    # Keyboard shortcuts


    On the face of it, OOo Calc is functionally identical to MS Office. But that is
    not quite the full story. For example, Excel has many more defined functions than
    OOo Calc. This is not really a limitation, as pretty much all of the functions
    can be made by stringing together several of the existing ones, but it obviously
    does have an impact on compatibility if you try to import an Office spreadsheet
    that uses them. Fortunately, the functions in question are usually related to
    very niche uses of a spreadsheet, so the chances that they will cause a problem
    to you are slim.


    The other problem is embedded macros. As a rule, you can’t expect Excel macros
    to run properly under OOo, because they use VisualBasic, which obviously isn’t
    a part of the OOo suite. You can make a lot of them run with some modifications
    though, and SUSE’s reworking of OpenOffice.org has much better support for this.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# OpenOffice.org – Calc


    # OpenOffice.org Calc: guide to the interface


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_34_0.png)


    1 Menus typical function locations.


    2 File operations. Load, Save and Save As.


    3 Export as PDF see p94 for more details


    4 Spellcheck activates a spell-check or the Check As You Type feature.


    5 Cut, Copy and Paste applied to cells or ranges of cells.


    6 Undo and Redo buttons for when you make mistakes.


    7 Sort text or numerical ranges in ascending or descending order.


    8 Navigation common OO.o tools, including Zoom and Help.


    9 Text Formatting choose a font and style for selected text.


    10 Justification numbers and text can be justified in common ways.


    11 Number formats common formats for your numbers – currency, decimal...


    12 Range Selection type in a range or use the menu for previous selections.


    13 Function wizard guides you through creating a function.


    14 Cell contents the cell on the main sheet shows values, but this area will show
    you the function entered in that cell, and you can edit it directly here.


    15 Columns labels start at A and go on to IV


    16 Rows are numbered. Drag the dividers to get larger row heights!


    17 Cells on the grid show their value and may have different styles depending
    on their properties (e.g. could be formatted to turn red when negative).


    18 Charts can be embedded or standalone, and can refresh to show current values.


    19 Notes individual cells can have non-printing notes attached, indicated by a
    small dot in the top right corner of the cell. Hold the mouse over them to see
    the note.


    20 Hyperlink all sorts of objects can be embedded into a spreadsheet. This is
    a working hyperlink, which will also work when exported to PDF.


    21 Embedded graphic an imported OLE object. In this case a graphic that was created
    in Ooo Draw.


    22 Sheet tabs by default there are three sheets to each document. Right-click
    to add more or rename existing sheets to something more meaningful.


    23 Status bar includes a handy timesaver, the right hand area contains a current
    sum and average for the selected area of cells.'
