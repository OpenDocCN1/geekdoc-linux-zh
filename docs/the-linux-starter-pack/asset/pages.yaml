- pgno: 81
  md: '# Burn an audio CD

    and make a track inlay


    Use the combined power of Linux apps to add some life to your party mixes.


    Even though you may have a lot of music on your computer, tucked away on your
    iPod or elsewhere, there are still times when it is useful to have them in the
    universal format of the audio compact disc. Maybe you are going to the beach,
    and would rather take a semi-disposable ghetto blaster than risk getting sand
    in your sleek MP3 player, or maybe you need a CD for a long car journey.


    In any case, it is not so difficult to mix up your favourite audio on to a CD
    using Linux. In this tutorial, we will be taking it a step further by showing
    you how to also create an inlay card for a CD case, and using some clever tricks,
    we can even generate the track listing automatically! You will need to have Inkscape
    and K3b installed for this tutorial.


    # Exploring the K3b interface


    Directory tree panel.


    Tools for converting and creating different discs.


    Current directory – click for history.


    Filter the files in the current directory by type.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_81_0.png)


    Click the Burn button when you are ready to toast a disc!


    Track listings with tag info, if available.


    The status bar shows how much of the disc you have filled.


    Select a track and click to check for MusicBrainz data.


    Listing of the available audio files.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Make a compilation CD


    # Step by step: Burn an audio CD


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_0.png)


    We''re going to start with the OGG files that you''ve ripped on to your machine.
    Most people agree it reproduces a better sound, and the file sizes are much smaller
    than mp3 files. If you do have mp3s, use the OggConverter tool to translate them
    into OGG files.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_1.png)


    K3b is currently the best all-round disc burning software for Linux. It can handle
    a variety of different formats, supports plugins for adding extra functionality
    or filetype support, and perhaps most importantly of all, it is pretty easy to
    use (see p100 to learn how to get K3b with Synaptic).


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_2.png)


    Adding tracks to your disc is pretty easy. The top half of the K3b window is split
    into two parts. On the left is a directory tree with folders from your local filesystem.
    The contents of the currently selected directory appears in the larger area of
    the window.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_3.png)


    To add the music tracks to your burn list, click on them and drag them down to
    the lower half of the window. When you release the button over the lower part
    of the window there will be a short pause as the files are scanned and the tag
    data is extracted.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_4.png)


    When you add tracks, the status bar along the bottom will start to fill with green.
    This indicates the amount of space on the CD you are using – if it goes red, you
    have added too much music and you will have to remove some. K3b is smart enough
    to make allowances for >650MB discs if you have them, though old CD players may
    have trouble with them.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_82_5.png)


    Select the Burn button from the tab at the top of the lower panel, and the disc-burning
    window will pop up. You could just go with the defaults, but if you select the
    ''Create Image'' option you''ll create the image on your hard drive first, which
    may be useful if the burn fails and you have to try again.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Make a compilation CD


    # Step by step: Design your inlay card


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_83_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_83_1.png)


    1 Now we have a list of the tracks in K3b but how do we extract that? Well, you
    can either just type it in again, which is a pain, or you can do something a bit
    tricky. K3b doesn’t have a plugin to export track listings, but there is a simple
    console script we can type in to get this information. If you’re feeling brave
    (and there’s really nothing to be scared of) open a terminal and type:


    ```

    for {x=1; x<= `dcop k3b K3bProject-0 trackCount`;x++}; do echo "$x. `dcop k3b
    K3bProject-0 trackArtist $x` - `dcop k3b K3bProject-0 trackTitle $x` >> tracklist.txt;
    done

    ```


    2 Go to Applications > Graphics and choose Inkscape from the list. The program
    will open up and create a default document, which will be A4-sized. We could just
    draw on the bit we want, but it’s much better to make the document the correct
    size to begin with. From the menu, choose File > Document properties. Now we can
    tap in the size that we want. If you have some pre-made inlays, the size may vary
    – you can always measure your CD case. The most common size is 117.5mm squared,
    so enter these numbers and make sure to select millimetres from the pop-up menu
    of unit types in the right of the box.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_83_2.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_83_3.png)


    3 If you missed out the script part earlier on, you can skip on to the next stage
    here as well. We have the text in a file, but it can be tricky to import a text
    file correctly into Inkscape on Ubuntu. The next best thing is to copy and paste
    it from some other application. Select Applications > Accessories > Text Editor
    to run a simple text editor. When the program runs, Click on the Open button and
    select the tracklist.txt file from the file requester. The text should load in
    as shown in the picture, giving us a perfect track listing for the CD. To get
    it into Inkscape, we just have to copy and paste it. Select all the text (Control+A)
    and then copy it (Control+C). The text is now in the clipboard, ready to be placed
    into Inkscape.


    4 It would be nice to have some sort of background to the image. Use the square
    tool and drag out an area slightly bigger than the document. It will just be filled
    with the default options, so most likely it will come out black. You can play
    around with this easily though. Press Control+Shift+F to bring up the Fill and
    Stroke settings. Under Fill, you can choose a gradient fill, and edit the settings
    to create a nice swooshy shade of your choice. You could also use File > Import
    to import a bitmap graphic or photograph to use as the background image. The colours
    may be a bit strong for the tracklist to show through, but we will fix that in
    the next step.'
  merge: -1
  img_proc: true
