    # ForecastFox


    British people have a natural obsession with the weather, which is strange, really,
    given how little of it we have. So if you''re feeling the need to check just how
    much rain we''re going to get tomorrow, ForecastFox is for you: tell it where
    you live, and it will tell you the latest weather forecasts for your area. When
    it''s first installed it will say you''re in Forecast Location 00000 – ignore
    that, and click Find Code. When the Location Search dialog appears, enter the
    name of your town or city and click Search, then choose the best match from the
    list that appears and click OK then Apply – your weather forecasts will now appear
    at the bottom of the Firefox window, and will update automatically. Magic!


    # AdBlock Plus


    Designed to block every advert under the sun to leave the web a content-only place,
    AdBlock Plus (ABP) is both a blessing and a curse. It''s a blessing because –
    let''s face it – some of the adverts out there are downright annoying, with flashing
    colours, silly animations, and worse. But it''s a curse because the vast majority
    of websites out there are funded through advertising, so if everyone blocked all
    their adverts then they would simply cease to exist. When you install ABP, you''ll
    be prompted to choose a set of advertiser filters – either choose the one nearest
    to you, or if you''re not sure just choose the first item on the list, then click
    Subscribe. And that''s it: you''re safe from adverts, and can go on browsing the
    web – now with a little less bandwidth wastage.


    # ChatZilla


    Before the web, there was Internet Relay Chat – an interactive text system where
    people joined channels based on common interests, and discuss/argue/flame long
    evenings away. Despite the invention and ultimate rise to supremacy of the web,
    IRC lives on, and ChatZilla is an excellent add-on for extension that builds IRC
