  md: '# Extras


    # Java and RealPlayer


    These programs are very easy to install. Click Applications > Accessories > Terminal,
    and enter the following command to get the Java plugin for Firefox, so you can
    view Java applets on websites:


    ```

    sudo apt-get install sun-java6-plugin

    ```


    You may be prompted for your password. This is a fairly hefty download (34MB),
    so if you’re on a dial-up connection you’ll need to leave it for a few hours.
    After the download has finished, you’ll be prompted to view the licence, so read
    through it and press Tab then Enter to proceed. You’ll then be asked to confirm
    your choice – press the left cursor key and Enter again.


    Once the installation has completed, you can purge the downloaded packages by
    entering sudo apt-get clean. Now start Firefox and browse to a site with Java
    (such as www.javatest.org) and check that the installation works.


    For RealPlayer, open a terminal again and enter:


    ```

    sudo apt-get install mozilla-helix-player

    ```


    This download is approximately 4MB. After installation, you should be able to
    restart Firefox and view RealMedia content on websites – or you can run a standalone
    player by clicking Applications > Sound & Video > Helix Player. (If you’re wondering
    about the name, Helix is an open source project from RealNetworks.)


    # Tweaking your Ubuntu Linux system


    No doubt you’ve already explored the System menu on your Ubuntu Linux installation,
    and have discovered the various settings and options you can change. However,
    there are other aspects of the desktop and operating system that you can fine-tune
    – these aren’t accessible to normal users by default, but with an extra download
    they become available.


    Open a terminal window and enter:


    ```

    wget http://ubuntu-tweak.googlecode.com/files/ubuntu-tweak_0.2.6.1-ppa1_all.deb

    ```


    This downloads the Ubuntu Tweak program from the project’s website. If you receive
    an error, it means that a newer version of the program is available, in which
    case you should open Firefox, browse to http://ubuntu-tweak.googlecode.com and
    grab the latest Deb package for Ubuntu 7.10 (Gutsy). Save the Deb file into your
    home directory.


    Then enter:


    ```

    sudo dpkg -i ubuntu-tweak_0.2.6.1-ppa1_all.deb

    ```


    (If you downloaded a newer version, change the filename accordingly.) Once it
    is installed, click Applications > System Tools > Ubuntu Tweak to start it up.
    You’ll notice a tree structure of icons down the left-hand side, separating the
    customisations you can make into categories. Click on the triangles next to the
    icons to expand these categories into sub-categories.


    > Helix Player lets you view RealMedia content, either embedded into web pages
    or as standalone streams.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_73_0.png)'
