- pgno: 56
  md: '# Working with photos


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_56_0.png)


    Most effects in Gimp have a real-time preview. In this case, you can even warp
    the preview with your mouse.


    # Removing blemishes


    The secret tool for magically removing blemishes is the Clone Tool. This looks
    a little like a rubber stamp, and that''s because a rubber stamp loosely describes
    how it works. It copies one area of an image to another area. But it does this
    in such a way that you can''t see the edges. For the process to be successful,
    you need to find an area within the image (or in another image) that you can use
    to replace the blemish. This usually means finding a place where the image is
    repeated. This could be a similar area of sky, grass or wall, for example. After
    selecting the Clone tool, hold the mouse over this replacement area, press Ctrl
    and click on the mouse to set the source of the clone operation. When you now
    click on the blemish, the area under the mouse will be replaced with the image
    at the source location. If you hold the mouse down, you can copy an entire area
    – useful for windows in a wall, for instance. If the wall is at an angle, try
    the perspective clone tool instead.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_56_1.png)


    We''ve cloned the background over the bike''s pedal here.


    This window is used to display any options associated with your current editing
    tool. With text entry, those extra options include size as well as choice of font,
    colour and paragraph formatting. Close the text editor when you''ve finished adding
    text. If you need to edit the text further, you can always select the Text Tool
    and double-click on the text to open the editor again. You may also need to fine-tune
    its position, which you can do with the Move tool.


    If you take a look at the Layer window, you will now see two layers. The background
    contains your original image, while an additional layer will hold your text. This
    is why you can move the text freely above the image. For example, if you choose
    one of the filter effects while your text layer is selected, only the text will
    be affected. Try the Warp filter, found under Filters > Distorts. This effect
    opens a window from where you can drag


    and distort parts of the current layer. When you click on OK it''s only this layer
    that''s processed. After messing around with the filters and your text, try Drop
    Shadow and Bevel from the Filters > Light And Shadow menu. This will generate
    an extra layer that contains a shadow for the text, as well as adding a slight
    bevel to the text area. You can then select the shadow layer and move it around.
    It will keep above your original photo and beneath the text because of the ordering
    of the layers. You can change this order from the layer window by dragging each
    layer up and down. Unfortunately, unless you save your image using Gimp''s native
    image format (called XCF), this information will be lost. Saving your file as
    a JPEG or BMP, for instance, will ''flatten'' the image. This means that each
    layer is merged into a single layer. It will look exactly the same, but you will
    no longer be able to process each layer separately.


    # Gimp''s toolbar


    Gimp has all the tools you''d expect from a professional-quality image processing
    app. Here''s a run-down of what''s on offer...


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_56_2.png)'
