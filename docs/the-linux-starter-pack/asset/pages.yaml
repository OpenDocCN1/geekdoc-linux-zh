  md: '# Answers


    Audio troubles are nearly always resolved by checking connections and the volume
    control.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_111_0.png)


    Don''t panic; it''s highly unlikely that your sound card just flat out refuses
    to work with Ubuntu. It''s true that some sound cards aren''t 100% supported under
    Linux, but this tends to be certain specialist features such as 3D sound. However,
    the vast majority of sound cards will provide simple playback functionality. First
    things first: check your speaker connections, such as the output jack from your
    computer as well as any power connections to your speakers. Once you''re happy
    that everything is plugged in and the speakers appear to have power, right-click
    on the speaker icon in the top task panel and select Open Volume Control. Check
    the various sliders to ensure that they are not turned all the way down, and also
    check the small speaker icons below each set of sliders to see if there is a red
    cross through any of the output ones. If there is a red cross through either the
    Master or the PCM channels, it means that those channels are muted. Simply click
    on the red cross to clear it, and try playing your music again.


    # Data transfer


    I''m considering moving full-time to Linux, but am a little worried about the
    masses of documents and photos that I have stored under Windows. Will I be able
    to access these in Ubuntu, or do I need to keep hold of Windows to make sure I
    can still work with all my data?


    Well, first and foremost, there are several packages available for Ubuntu that
    will handle pretty much any type of graphic file, be it JPEG, TIFF or Windows
    Bitmap, plus a few you may not have heard of. Other productivity packages such
    as OpenOffice.org are very good at handling Word documents and Excel spreadsheets
    with little or no fuss. The best course of action will ask you to do once it has
    successfully installed the driver.


    # Games


    My Ubuntu installation seems to be just fine, except for when I try to play games
    like PlanetPenguin Racer or Oolite. Every time one of these games loads, the graphics
    become really slow and jerky, making the games unplayable. What''s even more frustrating
    is that I know I have a good graphics card, and it should be able to handle these
    games without breaking a sweat. What am I doing wrong?


    The simple answer to this is to say that graphics card drivers tend to be proprietary,
    and aren''t included with Ubuntu by default. That''s not to say that you can''t
    install and use them, as Ubuntu provides the excellent Restricted Drivers Manager
    (found under System > Administration > Restricted Drivers Manager) to make installing
    proprietary drivers a breeze. You''ll be prompted for your password, so enter
    it to take you to the main window. Simply tick the ''enable'' box next to the
    driver that you need and Ubuntu will ask for confirmation before installing and
    enabling the driver. In order to make full use of the new driver, it''s necessary
    to restart your computer, something that Ubuntu will ask you to do once it has
    successfully installed the driver.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_111_1.png)


    The Restricted Drivers Manager allows you access to the proprietary 3D graphics
    card drivers for your card.'
