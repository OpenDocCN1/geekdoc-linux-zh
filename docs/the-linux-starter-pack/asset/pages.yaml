    # FoxyTunes


    Running a separate program for music is so 2004 – all the cool kids are using
    last.fm, and so it’s natural that Firefox has an extension for connecting to last.fm
    and playing music: it’s called FoxyTunes. Of course, if last.fm isn’t your thing,
    then FoxyTunes can connect to a wide variety of traditional media players or other
    online services, and can even stream music from your Xbox if you have one.


    # Greasemonkey


    Have you ever been to a web page that was excellent, but held back by one or two
    niggles that actually drive you away? If so, Greasemonkey is the perfect extension
    for you, because it allows you to run little scripts that modify pages to your
    liking, so that whenever you visit them Greasemonkey makes them work just as you
    want. Making your own scripts isn’t for the faint-hearted, but that’s OK because
    when you search for ‘greasemonkey’ on the Firefox add-ons site, it will also return
    lots of prewritten scripts for Greasemonkey that spiff up common sites – look
    out for titles like “Better Gmail” or “Better YouTube”, and install them to Firefox
    to power up your web experience!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_24_1.png)


    Writing your own Greasemonkey scripts is tedious, so do the smart thing: take
    what other people have made!


    # StumbleUpon


    Whether you have five minutes or five hours to kill, the web seems like the ideal
    place to while away your time. But surprisingly it can be rather hard to find
    cool or unique content to spark your interest, and that’s where StumbleUpon comes
    to the rescue – you tell SU what you’re interested in, and when enough users on
    the SU network mark a page in that category as cool or interesting it will be
    added to the list of things that might interest you. Then, when you’re bored,
    just click ‘Start Stumbling’, and it will take you to the first site that fits
    your criteria. Get ready to watch the hours fly by...


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_24_2.png)


    The more you tell StumbleUpon about your interests, the more likely it is to be
    able to serve up pages of interest.


    # ThumbStrips


    As the web becomes increasingly media rich, add-ons like ThumbStrips likewise
    become popular. As you surf the web, ThumbStrips takes a graphical snapshot of
    the pages you visit and shows them to you in a line across the bottom of your
    screen. When you want to go back to a previous page, it’s easy to spot it among
    all the pictures, and a single click sends you back. If pictures don’t work for
    you quite so well, try searching for any word in the search box – if the site
    contained that word anywhere on the page, it will appear in the filter results.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_24_3.png)


    One of the fancier add-ons for Firefox, ThumbStrips makes it even easier to find
    your way to your favourite sites.


    # Wizz RSS


    Wizz RSS brings the news to life in a Firefox sidebar that can hook up to live
    news feeds from across the globe to deliver breaking headlines to your desktop.
    To get the best view, make sure you click the “Open/Close Wizz RSS Sidebar” button
    so that the sidebar is visible. You can add your own feeds to the list by browsing
    to the site that has a news feed, clicking “Feed Search”, then dragging any discovered
    feeds into the sidebar under whichever category you want. Easy!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_24_4.png)


    Wizz RSS tells you when news happens, rather than you having to check every hour.
    That means more time for games, right?


    # Add-ons warning!


    When writing this piece, we started with a clean Firefox and ended with eight
    extensions installed. As you can see in the final screenshot (Wizz RSS), there’s
    not much room left to see what’s going on in the web page, which rather loses
    sight of Firefox’s main goal. Don’t let the same happen to you: choose a few extensions,
    but be warned that they use up screen space and slow down your browsing experience.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Email and more with Evolution


    You''re all installed and you''re on the web, so what next? Email, of course!
    It''s time to use Linux to stay in touch...


    The web is only one small part of your digital life. If you''re like most people,
    you will have at least one email account (often more), you''ll have a list of
    contacts for people you want to keep in touch with, you''ll have a calendar to
    keep track of special events, and you may even keep a to-do list to help stay
    organised in an increasingly hectic world. Rather than adding to your


    already-complex daily life, Linux makes things easy by bundling all these tasks
    into a single program called Evolution. In the Windows world you might say that
    Evolution is roughly equivalent to Microsoft Outlook, but if you''ve never used
    that before then your best bet is to follow the annotated picture below and just
    dive on in!


    # Exploring the Evolution interface


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_25_0.png)


    Click here to create a new item in the program – clicking the New button directly
    will create a new item for whatever view you''re in currently (mail, calendar,
    etc), but if you click the arrow next to it then you''ll see a list of all the
    items you can create.


    In the Mail view, this shows the different mailboxes you have configured. Evolution
    can check and manage multiple mail boxes all at once, each box is treated separately
    in this pane.


    Evolution is split into five views, selectable using these buttons on the left.
    Changing the view here changes what is shown in the panes on the right.


    This is the list of emails in the selected folder. You can sort by any one of
    the fields by clicking the field name at the top of the list.


    This is a live search system – as you type, Evolution will filter your messages
    to show only those that match your text.


    When you select an email, Evolution will show message header information here.
    This includes who the message is from, who it was sent to, when it was sent, and
    more.


    This is the email preview window, shown when you select a message in the message
    list pane above. If you double-click a message, it will be shown in its own separate
    window.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Managing your emails – virtually


    The first time you run Evolution you have to follow a fairly long wizard process
    to configure your initial email account. This has a lot of options to set and
    might put you off, so we suggest you follow our step-by-step walkthrough over
    the page. Once you finish the configuration, you may need to start Evolution again
    so that it takes your settings on board, but when it’s all done you should be
    sitting in front of your inbox ready to start work.


    We’re not going to spend any time explaining how Evolution’s email system works,
    because it’s just the same as every other email client out there with two exceptions:
    the first is Evolution’s system known as ‘search folders’ that let you save searches
    as virtual mail folders. When you click on one of these virtual folders, Evolution
    runs the search on all your mail and places any matching messages into the folder
    so you can browse through them. The messages haven’t really moved, of course –
    that’s why this is a virtual folder rather than a real folder! But having multiple
    saved search folders enables you to create custom views of your inbox without
    having to move things by hand: Evolution takes care of all the work for you.


    To create a saved search folder, go to Search > Create Search Folder From Scratch,
    then add all the criteria you want to search by. Give it a descriptive name, like
    “Messages from clients that I haven’t replied to”, and set it going! Alternatively,
    select a message that fits a criterion you want to filter on, then choose Message
    > Create Rule and choose one of the ‘Search Folder From…’ options.


    The second helpful feature in Evolution is its ability to group emails by thread
    so that you can see entire conversations grouped together rather than having to
    scroll through dates to find replies to messages. To enable threaded mode, press
    Ctrl+T; pressing it again exits threaded mode.


    # Time-saving tips


    +   If you have lots of emails and struggle to remember what you’ve dealt with
    and what you haven’t, go to the View menu and enable Hide Read Messages.

    +   If you’re more used to an Outlook 2003-style layout for your mail, go to View
    > Preview and choose Vertical View.

    +   If someone sends you an email that you need to act on at a later date, right-click
    on the message and choose Convert To Task.

    +   Evolution’s spam filters try to learn what is and what is not spam based on
    what you tell them. For example, if a message arrives and is junk mail, right-click
    on it and choose Mark As > Junk so that the spam filter will learn. Similarly,
    if the spam filter incorrectly identifies a message as being spam, make sure you
    go to Mark As > Not Junk, otherwise it might learn to throw away legitimate emails!

    +   If you want to work offline, right-click on your remote mail folder, choose
    Properties, then check the box marked ‘Copy Folder Content Locally’ and click
    OK.

    +   If you have an event that recurs (eg. weekly, every third Tuesday, etc), then
    bring the event up in Evolution and click the Recurrence button to define exactly
    when it recurs.

    +   If you need to assign more detail to asks other than done/not done, click
    the Status Details toolbar button while a task is open. This lets you set a custom
    status, complete percentage, priority, and even attach a URL with more information.


    the top-right corner of your desktop, you’ll see a little ‘Appointments’ area
    has appeared, and if you click the arrow next to it you’ll see your appointment
    in there as a reminder.


    This same functionality is also available for to-do list items, known in Evolution
    as Tasks. Again, this is a view all of its own just like Mail and Calendars, so
    click Tasks from the bottom-left corner of the Evolution window. To create a new
    task, click New, give it a brief summary, then click Save to dismiss the window.
    This will immediately appear in the reminder list for the Ubuntu clock – you can
    even mark it as done by clicking the small checkbox next to its name, and you
    don’t even have to run Evolution!


    # Tracking your life


    If you want to keep track of daily meetings as well as special events, Evolution’s
    calendar will surely come in handy. To try it out, click the Calendars button
    near the bottom-left corner of the window, then choose View > Current View > Month
    View to get a better overview of the days ahead. Now, to create a new event, double-click
    on a date – try choosing today – and a window will appear prompting you to enter
    a summary of the event as well as what time it’s at. Enter whatever you want here,
    because we’re only testing it right now. When you’re done, click Save, and the
    event will appear in your calendar. Now, part of the magic of Linux is that this
    event has been shared with the rest of your desktop, so if you click the clock
    in


    # Free or busy?


    Once you start using Evolution to store your calendar events, it’s a small step
    to go from there to sharing your calendar with your colleagues so that everyone
    can see whether you are


    Make an appointment (left) and have it appear in the Gnome clock automatically
    (right).


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_26_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_26_1.png)'
