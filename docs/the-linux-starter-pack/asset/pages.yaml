- pgno: 13
  md: '# Welcome to your Linux desktop!


    Linux can be scary at first simply because it''s different. Let''s look around...


    The first thing you''ll notice about your new Linux desktop is that it looks almost
    identical to the one you were able to use when the whole thing ran from CD. In
    fact, the only real difference between the two is that things will run much faster
    once Ubuntu is installed, because your hard drive is a lot faster than your DVD
    drive!


    The best way to find your feet in Linux is just to use your mouse and have a click
    around. Don''t worry – Linux won''t let you damage your system by accident. In
    fact, Linux won''t let you do anything even remotely dangerous without first asking
    you to re-enter your password as a security measure. Use the big annotation below
    to help you get started.


    # Get to know your Ubuntu desktop


    These are quick start menu icons for Firefox, Evolution and the system help. See
    our guide on p18 to add your own.


    At the top-right is the system tray, where all sorts of helpful icons live along
    with the clock – which, if you click it, folds out to show a calendar and any
    upcoming events too.


    The Applications menu stores links to all the programs you have installed, and
    will automatically be updated as you add new programs.


    The Places and System menus help you navigate and configure your system. You''ll
    be asked to enter your password for some tasks, because they are for administrators
    only.


    This is the window list panel, which shows all the windows that you have open.
    If you click on a window here, it will be brought to the front of the display.


    This is Nautilus, the file browser for Ubuntu Linux. You can learn more about
    Nautilus on p20.


    This panel controls virtual desktops, which are akin to Spaces on Mac OS X Leopard.
    Your computer can have multiple virtual desktops, meaning that apps running on
    one desktop won''t be shown on the others.


    This is the trash can – drag files here to delete them, but the files can be recovered
    from the trash can later if you change your mind.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_13_0.png)'
