- pgno: 59
  md: '# Games


    # Fish Fillets NG


    At first glance, Fish Fillets NG might not look like the average puzzle game.
    For a start, the two main characters are fish, and the cartoon graphics don’t
    look all that challenging. But from the first level, you’ll be hooked (sorry!).
    The objective is to get both fish out of the level, and you can control either
    the large fish or the small fish by switching between them with the space bar,
    using the cursor keys to move them around. You spend most of your time pushing
    objects around each level, nudging them with your fishy nose. And this is where
    danger lurks. If the object falls on either fish, it will perish.


    Both fish have slightly different attributes. The larger one can move steel objects,
    for example, where the small one would get crushed. The first level is a good
    example. Both fish are located on either side of a table and two chairs, with
    a steel bar positioned in the middle of the table. The exit for both fish is on
    the far right, but you need to move the right-hand chair to be able to squeeze
    through the gap. The big fish is too large to be able to get into the space to
    push the chair, so you need to use the big fish to push the steel bar across the
    table so that the little fish can swim across to the other side. You can then
    use the little fish to move the chair, making enough room for both of the fish
    to swim out through the exit to the right, and both fish move on the next level.


    You can undo any mistakes that you might make with the ~ key, and you can restart
    the level by pressing Escape. There are over 70 levels in total, and most of these
    are quite challenging, which makes Fish Fillets NG the perfect brain trainer when
    you find yourself with ten minutes to spare.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_59_0.png)


    Fish Fillets NG is a re-creation of a puzzle game that was popular in the 90s
    and eventually released as freeware in 2002.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_59_1.png)


    # Crack Attack


    Crack Attack is an altogether more manic game than most. Coloured blocks appear
    at the bottom, moving slowly up. You play by swapping pairs around using the cursor
    keys and the space bar so that lines of three or more blocks of the same colour
    are created. When this happens the blocks disappear, while those around them fall
    down to fill the space. If this leads to the completion of further coloured lines,
    you get a bonus combination score. The more line completions you can string together,
    the higher your score.


    A good strategy is to get five blocks together. You can often find two groups
    of two in the same vertical column, and working a single block of the same colour
    into the middle section, joining the two blocks together, is the best way to improve
    your score as well as giving you a good chance of a combo. As time passes, you
    will start to get horizontal blocks appearing at the top of coloured blocks. To
    remove these, you need get a line of three blocks or more adjacent to the horizontal
    block, which will then turn into ordinary pieces that rain on to the top of the
    playing area. The longer you play, the more of these blocks appear as the game
    starts to speed up.


    As a result, Crack Attack soon becomes a manic attempt to keep on top of things.


    But for the ultimate gameplay experience, you have to try it with two players.
    Crack Attack can connect to anyone on the local network, or even across the internet.
    One person needs to use their machine as the server, with the other being the
    client. The client needs to enter the IP address of the server machine to be able
    to connect. On the internet, you can find your IP address by visiting http://whatsmyip.org,
    and this is the number you’ll need to tell the client. If you’re both on the same
    network, you can find your IP address from the System > Administration > Network
    Tools window by selecting Ethernet Interface (or wireless) from the drop-down
    Network device list.


    > “Crack Attack soon becomes a manic attempt to keep on top of things.”


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_59_2.png)


    Crack Attack only really comes alive when you can find someone to play it with.


    It’s worth the trouble, because two-player Crack Attack games are about as much
    fun as you can have with your Linux box. The gameplay is exactly the same as with
    single player, except that when you get more than a single line, those lines are
    added to your rival’s screen. This leads to a mental tug o’ war as the two players
    try to push the other off the top of the screen. Great fun!'
