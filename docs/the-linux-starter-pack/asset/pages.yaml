    # Joystick jiggling


    Q I have a joystick that I''d like to use to play games with on Ubuntu. Is it
    safe to use, and will Ubuntu recognise it?


    A Yes, your joystick should be safe to use. Before the days of USB ports, joysticks
    used a 15-pin port that was commonly found on sound cards. However, with the advent
    of USB, these ports are no longer included on sound cards, and joysticks have
    moved to using a USB interface. That said, if your sound card has a 15-pin socket
    and your joystick can plug into it, it should work with Ubuntu. If your joystick
    does have a USB interface, simply plug it into a spare USB port and Ubuntu should
    recognise it. You''ll find that individual games will have specific options that
    relate to all the buttons on your joystick; check each game for more details.


    # Free updates


    Q I''ve had a message appear on my desktop telling me that there''s a new version
    of Ubuntu – something called 8.04LTS. What should I do?


    A This is Ubuntu''s way of telling you that development has finished on a new
    version of Ubuntu – in this case, version 8.04LTS. The clever thing about Ubuntu
    is that it allows you a seamless upgrade path between different versions, meaning
    that you can upgrade easily to the very latest version of Ubuntu. In this case,
    the only thing that you need to bear in mind is that it will take a fair amount
    of time to download and install all the software necessary to upgrade your system
    to the very latest set of packages, so you should allow a few hours to do this
    depending on the speed of your internet connection. Ubuntu itself provides 18
    months support for each release, with the exception of the LTS (Long Term Support)
    releases. In these cases, Ubuntu provides support for a total of three years for
    the desktop version and five years for the server version.


    You should also be aware that Ubuntu only supports version by version upgrading,
    so if you want to upgrade to 8.04LTS, you must first be running the previous version
    (7.10). Skipping a release is not allowed, so you can''t go from 7.04 to 8.04LTS
    – you''d have to first upgrade to 7.10 before moving to 8.04LTS.


    # Help! I need somebody


    Q I need more help! Where can I turn to help me with my problems?


    A Well it depends what kind of problem you have. If it''s a Linux-based one, why
    not try our forums at www.linuxformat.co.uk/forums – our readers are a helpful
    bunch and you''re likely to get an answer there. If not, then why not try the
    hugely popular Ubuntu Forums, found at http://ubuntuforums.org, where you''ll
    have access not only to the Ubuntu community at large, but also sometimes the
    actual developers who are involved in creating Ubuntu.


    # Code it!


    Q A few years ago I started to learn to program, but didn''t get very far and
    I''d like to give it another go. What programming tools are available for Ubuntu,
    and which languages can I learn?


    A I''ve got good news for you: Ubuntu offers you the opportunity to learn a wide
    variety of programming languages. The choice can be somewhat overwhelming as there
    are loads to choose from. For example, you could start off with some simple shell
    scripting, and then maybe move toward Perl, or you might prefer to go down the
    Object-Oriented route and learn Java or C++. Not only that, but if you need to
    learn .Net, Ubuntu allows you access to Mono, a free and open source implementation
    of the .Net technologies. Moving on to the web, you can program in PHP, JavaScript,
    or even learn simple HTML. The possibilities are endless. Keep an eye out for
    programming tutorials in regular issues of Linux Format to learn more.


