- pgno: 126
  md: '# Help and resources


    # Report a bug


    No software is perfect, even if it is open source. Sometimes a coding error can
    cause problems, or sometimes you manage to find something the developers hadn’t
    thought of that causes a program to crash. But we cannot say enough times that
    the chances of you finding a legitimate bug are exceedingly small: some of the
    Linux software has been in continuous development for more than 20 years, tested
    by time and hundreds of thousands of people again and again until any bugs that
    remain are exceedingly obscure.


    That said, if you think you have found a bug you should do the right thing and
    try to report it – hopefully someone will look into it and be able to fix it for
    others. If it is determined that the bug isn’t real, at least you tried.


    The first thing to do if you think you’ve found a bug is to figure out how to
    reproduce it as simply as possible. If you can get Firefox to crash on a given
    site every single time, that’s great; if you need to go to several sites in sequence,
    press a certain key combination, hold down Ctrl+Alt+Shift and sing the part of
    Susanna from the Marriage of Figaro the chances are the developers won’t be able
    to help you.


    Once you have a reproducible test case, discuss it with others on IRC, mailing
    lists, message boards or wherever you feel appropriate. It is important that others
    be able to verify the bug so that you know it’s not a problem with your configuration.


    Finally, once others have verified your bug and you have made the test case as
    simple as possible, it’s time to submit it to the developers. Most open source
    projects have an obvious way to submit bugs, such as http://bugzilla.mozilla.org
    for Mozilla and Firefox and http://bugs.php.net for PHP. Once you are on there,
    search for bugs like yours to make sure someone hasn’t submitted it already. If
    you pass that final test, submit your bug. Let the developers know what software
    and hardware you are using, what you tried to do, what you expected to happen,
    what actually happened and which other people if any have verified the bug. Be
    sure to include your email address so that the developers can get in touch with
    you if needed.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_126_0.png)


    If you can’t write documentation or code, you can still help out by submitting
    helpful bug reports.


    Linux users that meet up in universities and pubs across the world to chat about
    open source software, offer training and exchange ideas. If you are using a laptop
    and have a question, the best thing you can do is take that laptop to your local
    LUG and ask them to have a look – we can almost guarantee that they will be happy
    to help solve your problem right there.


    Many towns and cities in the world have their own LUG – the UK alone has more
    than 80 at the time of writing (see Linux Format for locations) – and you can
    find a good list at www.linux.org/groups. If you’re based in the UK, there’s a
    better list of UK LUGs available at www.lug.org.uk.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_126_1.png)


    Each issue of Linux Format prints a full list of Linux user groups'
