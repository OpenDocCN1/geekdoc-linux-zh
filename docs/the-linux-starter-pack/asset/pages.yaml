- pgno: 74
  md: 'Note that many of these options make significant changes to the way your operating
    system work, so if you have any doubts or confusion about any of the options,
    just steer clear of them. Here’s a list of things to look at:


    Computer This just provides information on your machine – there’s nothing you
    can change here. However, it’s useful if you’re having problems and want to provide
    plenty of feedback in a forum post.


    Startup In the Auto Start section you can disable programs from running when the
    GUI starts loading. Some of these are essential for the desktop to function correctly,
    but you can disable Print Queue if you don’t use a printer, Power Manager if you’re
    on a desktop machine and have no interest in power saving, and Evolution Alarm
    Notifier if you don’t plan to run the Evolution mail client. Disabling these will
    speed up your boot time by a few seconds.


    Desktop Via the Desktop Icon subcategory, you can add Computer, Home and Trash
    icons to the desktop. You’ll already have noticed that Ubuntu Linux’s desktop
    is empty by default, so if you prefer to have these regulars around (as in Windows),
    then you can enable them here. The icons will take a few seconds to appear after
    you’ve clicked the checkboxes.


    System This is all about power management. If you’re on a laptop, you can customise
    ‘CPU Policy’ – that is, how fast your processor runs when you’re on battery or
    mains power. You can also disable Hibernation and Suspend here if they’ve been
    giving you problems.


    Security These options are for system administrators who want to lock down a machine.
    If you’re installing Linux for someone else, and don’t want them to accidentally
    run random programs or print out 999 copies of a web page by mistake, you can
    disable various features here.


    Helix Player lets you view RealMedia content, either embedded into web pages or
    as standalone streams.


    # Adding MP3/WMV support


    Ubuntu Linux enables you to add support for MP3 playback almost automatically.
    Find an MP3 file in the file manager and double-click it; Totem will open up,
    explain that it can’t find the right codec to play it, and offer to search for
    one. So click Search, and Linux will do a quick search of the internet for the
    relevant codecs. It will then pop up a dialog box offering you a list of packages
    to install – you need the one called GStreamer extra plugins but you can install
    others as well (eg the ffmpeg plugin to play Windows Media files). Click the checkboxes
    next to the packages you want, and then the Install button. You may be prompted
    to enter your password as a security measure. The installation process will take
    around a minute, and when it’s done, you will now be able to play MP3s (and Windows
    Media files if you chose to).


    If you have an internet connection, getting MP3 playback support is just a few
    mouse clicks away.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_74_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_74_1.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Rip your CDs


    # Ripping your music collection


    You''ll learn how to import your CD collection into Ubuntu by following this tutorial.


    Are you plagued by a seemingly endless library of music CDs? Perhaps that mission
    to buy every single album by U2 has pushed your CD collection up into the several
    hundred mark? Ever stuck for what to listen to? If the answer is yes to any of
    these, it''s probably a good idea to spend time ripping all of your CDs into a
    virtual library, one that will help you manage and search through your myriad
    of CDs and albums.


    Doing this with Ubuntu is a breeze, mainly thanks to its support for audio formats
    and the tools supplied out of the box to get you started. Not only that, but you
    can even create your own compilation CDs for those long car journeys.


    It''s likely that you''ve already experimented with extracting music from your
    CDs (more commonly known as ripping) but haven''t done much with the end result.
    We''ll take a look at the tools you can use to extract the music from CDs, as
    well as some of the programs that are available to help you manage your virtual
    library of music. We''ll also take a look at creating your own CDs from tracks
    that you''ve ripped, helping you to build your own personalised Greatest Hits
    album.


    You''ll also learn a little about the different codecs (audio formats) on offer,
    as well as how to add support for the MP3 format to Ubuntu.


    If you are planning on doing a wholesale rip of all your CDs in your collection,
    you''re going to want to have as much hardware resources as possible. First and
    foremost you should have a CD drive with a decent read speed – somewhere in the
    48x-52x area is ideal in order to rip the CD as quickly as possible. You''ll never
    see that speed while you''re ripping with Sound Juicer, as it also needs to be
    able to encode the audio information into what ever format you''ve chosen. In
    order to ensure that this happens as quickly and as efficiently as possible, it''s
    best to use a pretty beefy machine. While writing this article, we used a Pentium
    4 3.4 GHz computer with a 48x speed CD drive; the fastest we could rip at was
    17–18 times the speed of the audio track, which takes around 3 minutes for standard
    70-minute audio CD. With a more modern computer such as a Core 2 Duo, we''d expect
    this speed to increase slightly in line with the performance enhancement gained
    from the new processor.


    # Step by step: Rip your CDs with Sound Juicer


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_75_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_75_1.png)


    By default Ubuntu comes with Sound Juicer, a neat GUI tool that allows you to
    quickly rip the music from your CDs. To get started, go to Applications > Sound
    & Video and choose Sound Juicer CD Extractor.


    A quicker way to get to Sound Juicer is to simply insert an audio CD into your
    CD/DVD drive. Ubuntu will start Sound Juicer when it detects the presence of a
    music CD. In any case, Sound Juicer will automatically try to retrieve the CD
    information from MusicBrainz, a free music database.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Rip your CDs


    # The need for speed


    Tweak your setting to make the job much faster


    In order to speed things up a little, you might want to set Sound Juicer to automatically
    eject the disc when it has completed. That way you can simply switch the ripped
    CD for a new one, and click on Extract again to carry on ripping. The only boring
    bit is getting all your CDs into your virtual library, which can also include
    assigning the CDs to a genre to aid your music management. It''s worthwhile getting
    it right from the start, otherwise you''re going to have to go back and make retrospective
    changes. Once you''ve done it though, your entire CD collection will be on tap
    via Ubuntu and you will be able to master your own music CDs using the Serpentine
    recording software.


    Another thing that you can do is to place all your music files on a network drive,
    and allow all your client machines in your home to have access to them, meaning
    that you''ll have music where ever you have a computer in your household. Just
    bear in mind that sharing your ripped music files with other people can constitute
    piracy! Why not consider heading on over to www.jamendo.org and downloading some
    music licensed under a sharing-friendly license such as the Creative Commons licence.
    That way you can share your music with whoever you like, subject to the terms
    of the specific licence used by the artist. And, of course, if you like the music
    why not donate a small amount of money to say thanks?


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_76_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_76_1.png)


    3 MusicBrainz isn''t perfect, and it may not recognise the CD that you''ve inserted.
    If this is the case, you''ll need to enter the data into Sound Juicer. Use the
    fields at the top to provide general information for the album, while you can
    double-click on each of the track titles to edit the name.


    4 The next step is to set the options for ripping, including the type of audio
    codec to use, so go to Edit > Preferences to see what''s on offer. If you have
    multiple CD drives, you can select which one you want to use for ripping. You
    can also choose the codec in this screen.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_76_2.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_76_3.png)


    5 Once you''ve set your preferences, click on the Close button to return to Sound
    Juicer. You''re now ready to start extracting the music, so click the Extract
    button to begin this process. Depending on the speed of your drive, this can take
    up to fifteen minutes to complete.


    6 By default, Sound Juicer saves all your ripped files into sub-directories of
    the Music directory. They''re grouped according to artist, and then grouped by
    album name. Don''t worry too much about this, as we''re going to be using a program
    to manage your music based on its metadata.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Step by step: Manage music with RhythmBox


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_0.png)


    1 The default music player supplied with Ubuntu is RhythmBox, which is more than
    capable of playing back your music. RhythmBox can also import your CDs, although
    it acts as a wrapper to SoundJuicer, meaning that it uses SoundJuicer to import
    the CDs into your library.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_1.png)


    2 When ripping CDs, you will need to edit some of RhythmBox''s preferences, so
    go to Edit > Preferences and click on the Music tab. Tick the ''Watch my library
    for new files'' check box, and select your preferred format, clicking close to
    return to RhythmBox.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_2.png)


    3 To start the import of your CD, simply right-click on the CD in the devices
    section of the left-hand pane and select Copy to Library. RhythmBox will then
    start importing your CD into the music directory and will automatically add the
    new tracks to its music database.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_3.png)


    4 By default RhythmBox shows the Browse view, which allows you to quickly isolate
    tracks based on artist and/or album. The number in brackets after each artist
    or album is the number of tracks that are assigned to that specific entry.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_4.png)


    5 The quicker way to find the music you want is to enter keywords in the search
    box. RhythmBox will automatically filter the track list according to your search
    terms, making it an easy way to narrow down a long track list to what you want
    to listen to.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_77_5.png)


    6 One of the more useful features of RhythmBox is its ability to create automatic
    playlists, found under Music > Playlist > New Automatic Playlist. With this, you
    can specify a number of criteria, and RhythmBox will create a playlist that contains
    all the qualifying tracks.'
