- pgno: 67
  md: '# Desktop effects


    # Compiz:

    The 3D desktop


    Chances are that if you’ve seen any Linux screenshots over the last year or two,
    they’ll have shown a really cool spinning cube. Welcome to the world of Compiz...


    One of the best features on a modern Linux installation is the 3D desktop. This
    incorporates the desktop cube effects, wobbly windows, drop-shadows, and dozens
    of other effects. The technology that drives all of this is called Compiz. This
    is because these type of effects are known as ‘compositing’, using hardware graphics
    acceleration on a modern graphics card to put all the pieces together and render
    them to the desktop. But we before we go any further, a mild warning: Compiz is
    considered cutting edge, and while most of us have been using it without problems
    for over a year, many users report a few stability issues. Compiz is a little
    like an elaborate hack still being worked into most Linux distros and it can’t
    be considered stable. If you need to use your Linux machine in a production environment,
    Compiz will be sure to crash at the worst possible time. For this reason, we can’t
    recommend it if you rely on your machine to pay the mortgage.


    accelerated graphics hardware with a corresponding Linux driver. Graphics cards
    that use chipsets by Intel, Nvidia or ATI should work, though the only way to
    see for sure is to try, and the first step is to install the driver.


    If your graphics card is Intel-based, then Ubuntu has already installed the best
    driver for your device. Both ATI and Nvidia hardware needs a proprietary driver,
    as only this will provide the necessary grunt. Proprietary drivers are installed
    by selecting the Restricted Drivers Manager from Ubuntu’s Administration menu.
    You’ll need to enter your password, which will bring up a window listing all the
    hardware on your machine for which there’s a proprietary driver, with the usual
    suspects being wireless and graphics. If the option list is blank, Ubuntu hasn’t
    been able to find a proprietary driver for your device. It’s worth trying Compiz
    anyway, but you may run into problems. Otherwise, enable the accelerated graphics
    driver for your device by clicking on the tick-box and wait for the driver to
    install. You’ll also need to restart your machine, but after which your graphics
    driver will be updated and ready for Compiz.


    # Installation


    Now that we’ve got that out the way, we can concentrate on installing some serious
    eye candy. Compiz effects can easily compete with Microsoft Vista’s tame Aero
    Glass effect, and while Apple recently added the desktop cube effect to OS X 10.5,
    it didn’t add anything else. Compiz uses plugins to add each separate effect,
    and with over two dozen plugins to choose from, it’s a melting pot of ideas, some
    more successful than others. But all require the same thing to be able to work
    –


    # Configuration


    Now that your graphics hardware is accelerated and working, you can easily get
    a rudimentary Compiz configuration working. Open the Preferences > Appearance
    window and switch to the ‘Desktop Effects’ tab. From here, you need to enable
    ‘Extra Effects’. Rudimentary in this sense means that you’ll get some drop-shadow
    on windows and little else. This is


    # Step by step: Installing drivers


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_67_0.png)


    1 Driver manager The Restricted Driver Manager needs to be launched from the Administration
    menu – you’ll need your password handy to be able to run the application.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_67_1.png)


    2 Enable Driver Each restricted driver is listed in the window, and you can enable
    the one you need by clicking the tick box. A confirmation window will open, the
    drivers will download, and you’ll need to restart your machine.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_67_2.png)


    3 Reboot check After a reboot, your restricted drivers should be enabled. You’re
    now ready to play 3D games, as well as play with Compiz effects. Get them working
    from the Preferences > Appearance menu.'
