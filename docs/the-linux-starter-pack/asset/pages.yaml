    3 The final screen prompts you to save your options and start the firewall. If
    for some reason you don’t wish to start the firewall at this point, un-tick the
    Start Firewall Now check box and click the Save button.


    # Password hacking


    # How outsiders get your passwords


    In Ubuntu, the user details are usually stored in /etc/passwd along with the numeric
    User ID and Group ID. The actual password is not stored here – instead you’ll
    see a small x when looking at this file, which denotes that there is a password
    present. The actual passwords are stored in an encrypted format within /etc/shadow,
    which will look like gibberish if you try to view it and will not resemble your
    true password. However, if an outsider manages to get a hold of this file then
    they can use a number of freely available tools to try to extract this password


    information. Usually these tools rely on what are known as dictionary-based tools,
    in that they have a large collection of dictionary words that they use to try
    and unlock your password information. The tools will literally cycle through all
    the words available, as well as common misspellings, in an attempt to match one
    of them with your password. By using the technique that we showed you to create
    a strong password, you will minimise the risk of any dictionary-based attack as
    your password will not be based on a dictionary word.'
