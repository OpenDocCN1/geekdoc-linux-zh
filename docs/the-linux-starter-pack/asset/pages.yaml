    # Sending an email


    The easiest way to get photos out into the wide world is to attach them to an
    email. F-Spot can even help with this if you use the Evolution email client. Select
    the photos you want to send and click on ''Send Mail'' in the File menu. A smaller


    # Understanding resolution


    Many people are scared of the term ''image resolution''. But when you''re trying
    to publish your photos – either online or on to real paper, there''s no avoiding
    it! Digital images are made up of coloured pixels. These are the squares you see
    when you look closely at a digital image, or use the zoom feature of a graphics
    editor. Your screen''s display is drawn using pixels with a common screen resolution
    being 1024x768, for example. This means there are 1024 pixels across the screen,
    and 768 down. If you want to know the total number of pixels on the screen, then
    you need to multiply these two numbers together – 1024x768 = 786,432. Digital
    camera resolutions are often described by counting the total number of pixels,
    with the term ''megapixel'' used as shorthand for a million pixels. Our screen
    resolution would therefore be 0.78 megapixels (MP). If your camera has a resolution
    of 5MP an image from the camera would be roughly four times the size of the screen.
    Another common way of expressing pixel resolution is by pixels per inch, or dots
    per inch (DPI). These both refer to the number of horizontal pixels that fit into
    an inch of length, and they normally apply to printing and scanning. If your screen
    is 17 inches wide, for instance, it''s working at 600DPI (1024/17). If you scan
    a five-inch photo at 600DPI, it will be 3,000 pixels wide (6 multiplied by 600),
    and be about three times the width of your screen. This means that if you want
    to send the image to someone with a similar screen to your own, you need to reduce
    the image by at least 66%.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_54_2.png)


    > A 5 megapixel camera will generate images that are well over four times the
    size of a 1024x768 display.'
  merge: -1
