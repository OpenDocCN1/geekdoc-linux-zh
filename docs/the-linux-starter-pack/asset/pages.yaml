    # Glossary


    Get to grips with all the Linux lingo used by the open source community.


    **ACPI** Advanced Configuration & Power Interface. Allows Linux to control power
    management on laptops and desktop machines. If ACPI is properly configured, Linux
    can power off your machine for you when shutting it down.


    **ALSA** *Advanced Linux Sound Architecture.* This library provides support for
    a number of soundcards, enabling a Linux system to give multimedia feedback.


    **Amarok** The preferred KDE media player. *Amarok* can locate and manage your
    songs, playlists, album art and song lyrics, and of course play music! Most distros
    also come with *Juk*, an alternative media player for KDE.


    **Apache** The most popular web server on the internet, behind nearly 70% of all
    web domains. The name comes from its original moniker, A Patchy Web Server, so
    named because it was built up from a number of modifications.


    **Appletalk** A common file- and print-sharing protocol used by older Macintosh
    computers. On Linux, you can allow Macs to connect to your machine with Appletalk
    support by using the *Netatalk* library.


    **APT** *Advanced Packaging Tool*, a suite of utilities authored by the Debian
    team that handles package installation and maintenance.


    **Bash** The *Bourne-Again SHell* is the predominant command-line interpreter
    for Linux. It is based on the original *Bourne SHell*, created by Stephen Bourne
    for AT&T, and includes job control, scripting and aliases.


    **Boot** A general term for starting your computer. Rebooting means to restart,
    and the boot process is the initial set of procedures through which Linux starts.


    of Linux) that is both free software and freely licensed using the BSD licence.
    The BSD licence allows inclusion of code into proprietary software without the
    release of modifications.


    **Command line** The most common name for the text-only teletype input system
    for Linux. The command-line interpreter of choice on Linux is traditionally *Bash*.


    **Compile** The process of turning source code (human-readable programming language)
    into a binary executable (a program that can be run by Linux) is known as compilation.


    **Console** Another term for the command line.


    **Debian** Popular Linux distro with an emphasis on software freedom and stability,
    named after its founder, Ian Murdock, and his then-girlfriend Deborah. The Debian
    Project is known for its very long release cycles.


    **Display manager** A session manager for X that handles user login and choosing
    your preferred desktop. The original desktop manager is *xdm* (the *X Display
    Manager*), but Gnome and KDE have produced *gdm* and *kdm* respectively.


    **BSD** Berkeley Software Distribution, a variant of Unix (and close relation


    **Distro** Short for distribution, which is a custom release of the Linux kernel
    plus a selection of packages and additional scripts and programs. Fedora, Mandriva
    Linux, Mepis, Debian and Ubuntu are all popular Linux distros.


    **Ekiga** Video conferencing tool for Gnome that uses the H.323 protocol and tunnelling
    to provide high-speed chats between attendees. Formerly known as *GnomeMeeting*.


    **Emacs** At its core, this is merely a text editor (the name comes from Editing
    Macros), but *Emacs* has many extensions and add-ons that allow you to compile
    and debug code, read your email, play games and more. Several clones of *Emacs*
    exist, including the innovative *XEmacs*.


    **Evolution** Gnome-based personal information manager that handles email, calendaring
    and contacts. For KDE, the equivalent is *Kontact*.


    **ext3** The standard Linux filesystem. Its journalling capability allows your
    system to recover safely from an unexpected shutdown or other mishap. You do not
    need to defragment ext3 disks.


    **Fedora** Popular Linux distro sponsored and primarily developed


    **Fedora** Popular Linux distro sponsored and primarily developed by Red Hat.
    The Fedora Project aims to release a new ‘Core’ update twice a year, and the distro
    is well known for incorporating cutting-edge features ahead of the pack.


    **Firefox** Successful open-source web browser produced as a spin-off from *Mozilla*.
    *Firefox* uses the same HTML rendering system as *Mozilla* (known as *Gecko*),
    but wraps it inside an intuitive and well-designed user interface. You can also
    try *Konqueror*, *Mozilla* or the proprietary (but free to download) Opera.


    **FSF** The Free Software Foundation was founded in 1985 as a non-profit organisation
    dedicated to promoting the freedom of software. The group is still the primary
    sponsor of the GNU Project.


    **FTP** The File Transfer Protocol is a client–server architecture that enables
    users to upload and download files quickly and efficiently. FTP has long been
    preferred to HTTP for file distribution in this manner, as it allows easy authentication,
    quota management, and download resumption.


    **GConf** The closest that Linux gets to an equivalent of the Windows registry.
    It is designed to store user preferences for the Gnome desktop and its applications,
    and you will find there are options that can be set in *GConf* that cannot be
    set in the applications!


    **Gentoo** The most popular source-based Linux distro. A source-based distro downloads
    all its packages as compressed source code, then extracts and compiles it according
    to your system preferences. Because of this, Gentoo is highly customisable.


    **Gimp** The *GNU Image Manipulation Program* is the most prevalent and powerful
    image editor on Linux. Although modelled loosely on the user interface of *Adobe
    Photoshop*, *Gimp* is harder to use, and lacks some more advanced features such
    as high-quality colour matching.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_119_1.png)


    ➤ **Emacs: text editor, operating system or something much more powerful? It has
    legions of fans arguing that it’s a way of life – you decide!**'
