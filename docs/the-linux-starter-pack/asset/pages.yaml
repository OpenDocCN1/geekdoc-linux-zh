  md: '# Step by step: Download with BitTorrent


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_0.png)


    1 Find something to download: BitTorrent works at its best with very large files,
    so we’ve gone right to the top – a nice big Linux distribution! But there are
    lots of other things around to download: sites like www.publicdomaintorrents.com
    are full of great content.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_1.png)


    2 Open the torrent: When you click on a Firefox link for a Torrent file, you’ll
    be asked whether you want to open it with BitTorrent or save it to disk. Chances
    are you want to open it straight away, so just click OK.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_2.png)


    3 Choose a location: BitTorrent will start up and ask you where you want to save
    the download. Keep in mind that some torrents are made up of many files, so you
    probably want to save your torrent in a subdirectory somewhere.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_3.png)


    4 Check your progress: This is the download screen, and the one you’ll be seeing
    most of the time. It shows you how much data has been transferred and how much
    time is remaining until the download completes. Note the Stop button – that’s
    for pausing downloads.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_4.png)


    5 Cap your uploads: For any given torrent, you can set upload caps. These are
    disabled by default, meaning that BitTorrent will upload as much as it can without
    sacrificing too much download speed.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_90_5.png)


    6 What’s going on?: The Events tab is important for times when your download isn’t
    working – if the tracker goes down, or if your network connection suffers problems,
    you’ll read about it here.'
