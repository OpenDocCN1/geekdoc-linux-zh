    sandbox and see what the rest of the free software world has to offer you: it’s
    time to install some new software! One last word before we get started: software
    on Linux is bundled into what we call a “package” – that’s the software itself,
    plus any configuration files, documentation, etc. These packages are traditionally
    managed by a package manager, which has the advantage that all your programs are
    available from one central place, meaning that they can be easily installed and
    easily updated, that they can be removed in the same way they were installed,
    and that they are guaranteed to work.


    Using a package manager means that you can install nearly everything that Ubuntu
    has to offer with one simple program.


