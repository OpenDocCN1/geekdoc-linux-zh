  md: "# Alien Arena\n\nThis isn’t exactly the kind of game you might want to play\
    \ at a children’s party. But get a few people together and a few Linux machines,\
    \ and you won’t have had as much fun since you got that Raleigh Chopper for your\
    \ eighth birthday.\n\nAlien Arena is a first person shooter. That means you see\
    \ through the eyes of the player, and you need to shoot at anything that moves.\
    \ Games are played online, either by hosting your own server that everybody joins,\
    \ or by joining a public online game where people are already playing. There are\
    \ usually plenty of servers running, so you’re only ever 30 seconds away from\
    \ a game. Each level is a confined map, and there are various game modes, from\
    \ deathmatch (killing everything), to capture the flag (stealing your opponent’s\
    \ flag and bringing it back to your base).\n\nIt’s very similar to another Linux\
    \ classic – Unreal Tournament. Alien Arena even has a similar array of weapons.\
    \ You start with a humble Blaster. This fires a\n\nbolt of plasma that doesn’t\
    \ harm the enemy all that much, which is why it’s imperative that you quickly\
    \ move on to something a little more destructive, such as the Alien Disruptor.\
    \ This shoots a powerful beam that’s difficult to target but effective if you\
    \ hit your mark. Right-clicking the mouse will use the alternative fire, and with\
    \ the Alien Disruptor, this is a sniper scope, making enemies easier to hit (if\
    \ you can convince them to stay still). If you get close, switch weapons to the\
    \ Flamethrower. You can use the middle mouse button or the function keys to switch\
    \ weapons. The Flamethrower will cover anything in front of you with a wall of\
    \ flame, and the longer you keep them burning, the more damage you’ll inflict.\
    \ But our favourite weapon is the Rocket Launcher. This is because you can use\
    \ it from a distance, and it also destructive within a set radius of the explosion.\
    \ A good tip is to fire rockets at the feet of your enemies so that even if they\
    \ jump, you’ll still inflict a little pain.\n\n![](img/afd38ba98c33e56aa8435c9f1db6bed0_62_0.png)\n\
    \n> If you miss some of the great first-person shooters for the Windows platform,\
    \ Alien Arena will bring a smile to your face.\n\n![](img/afd38ba98c33e56aa8435c9f1db6bed0_62_1.png)\n\
    \n> The maps, gameplay and guns of Alien Arena are all reminiscent of that Linux\
    \ classic, Unreal Tournament.\n\n# Frets on Fire\n\nIf you’ve not played Guitar\
    \ Hero on either the Playstation 2 or Xbox 360 games consoles, you’re missing\
    \ out on something. Fortunately, you can redeem your social standing by running\
    \ Frets on Fire on your Linux machine instead.\n\nLike Guitar Hero, Frets on Fire\
    \ will turn your humble computer and keyboard into an instrument of rock, and\
    \ the only thing it will cost you is your dignity. To play the game, choose a\
    \ piece of music and a difficulty level from the menu screen. The next view you\
    \ see is a fretboard stretching into the infinite distance. As the music starts,\
    \ coloured squares will start to drift down the fretboard indicating which fret\
    \ you need to play. As each square hits the bottom of the screen, you need to\
    \ hold down the function key on your keyboard that corresponds to the fret you\
    \ need to play (F1 – F6). At the same time, press the carriage return key to ‘pluck’\
    \ the strings. Only then will the notes sound, and only then will you have taken\
    \ your first step on the road to rock greatness.\n\n> Turn your keyboard skills\
    \ into legendary guitar axe grinding, and embarrass yourself in the process.\n\
    \n![](img/afd38ba98c33e56aa8435c9f1db6bed0_62_2.png)\n\nWith a little practice,\
    \ you learn to anticipate the notes you need to play, holding down the function\
    \ keys before the notes need to sound, just pressing the return at the last moment.\
    \ As you hit the notes, the beautiful sound of your guitar will sing out over\
    \ the music. Hit any dud notes, however, and the twang of embarrassment will be\
