- pgno: 29
  md: '# Getting started with Writer


    The word processor is where most users spend much of their time; luckily, this
    important application is also the easiest to use.


    Word processors haven''t changed that much in the last ten years or so. At least
    not on the surface. OpenOffice.org''s word processor, snappily dubbed Writer,
    is no exception, and that is definitely a good thing. It means that if you''ve
    used a mainstream word processor in the last decade, you''re going to feel right
    at home with Writer. Just launch the application to see what we mean.


    You get a text editing window taking up the main part of the window, a ruler down
    the left and a scroll bar down the right, and in the ancient tradition of computerised
    word processing, a series of buttons, toolbars and font selector crowning the
    editing area at the top. From the visual point of view, Writer could be almost
    any word processor – and that''s the idea. If something works, there''s no point
    messing around with the formula and if you''ve worked with virtually any modern
    word processors before, you will already be able to rustle up most documents with
    Writer. Just click on various parts of the user-interface exactly as you would
    with an alternative.


    # Quick tip


    When Writer fills in a word you''re typing, press Enter to leave the word intact.


    # Vive La Différence!


    But there are differences. And you are likely to come up against these whenever
    you want to try something slightly more interesting. You will see that the menu
    system feels totally unfamiliar, with a mass of options hidden away behind each
    menu. This is the most intimidating part of Writer and OpenOffice.org in general
    – the layout of the various menus and options windows take a little learning.
    But don''t let that put you off. It just means that Writer and its companions
    are capable of almost anything you might expect of the best commercial office
    applications, even if it takes a little effort to find the function you''re looking
    for. This is a good moment to mention the online help for Writer, as this is often
    the easiest way to find what you''re looking for. Press either the F1 key, or
    select OpenOffice.org Help from the Help menu, and the well-written user manual
    will appear. The best way to use this is to type something you''re interested
    in into the Search Term box. Try ''dictionary'' for example, and the subject list
    is automatically populated with pages that can help you use the function you''re
    looking for. You can also use the What''s This? option in the help menu to switch
    to the info cursor. If you now hold your pointer over any of the buttons in Writer,
    a small yellow panel will provide further information on the functions behind
    the cursor.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_29_0.png)


    If you find that Writer is changing the meaning of your words, then the AutoCorrect
    function is the most likely culprit – change the options to better suit your way
    of working.


    # Options


    The first place to start is with a few simple user options that you will need
    for every document you work with. Open the Options window by selecting it from
    the bottom of the Tools menu. This Options window is used across the entire suite
    of OpenOffice.org applications, so don''t be too scared by the number of options.
    A good thing to do is add your name to the User Data panel under the top option.
    This information will then be embedded into every application you work with, making
    your changes easier to trace. The next thing you should check is the default language.
    This can be found under the Language Settings menu on the right side of the Options
    window. The Language Settings panel is where, as you might expect, you can'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'change the default language used by Writer and all the other applications.
    You can also change the language used by the user interface, and for the text
    content in documents, and it''s Writer where the effect of this setting will be
    felt the most, as the dictionaries and word replacements you use while editing
    documents are all affected by the dictionary you’re using. But the most obvious
    place where you’ll see the effects of the language you choose is in spell-checking.


    # Essential information


    Like nearly all word processors of the last 10 years, as well as presenting your
    text in a WYSIWYG (What You See Is What You Get) fashion, Writer uses a toolbar
    to provide quick access to all the most common options – for a quick reference
    to what action each item on the tool bar represents, see the Writer: the toolbar
    at a glance box at the bottom of this page. The small toolbar icons might not
    look familiar, but the functions behind them will be. For example, the first four
    icons on the top left of the display will let you create a new document (the image
    shows a letter), open an existing one (an arrow shooting out of a folder), save
    your current document or email it to a contact. Two of the most common special
    elements you may want to include in a document are tables and lists. It’s for
    this reason they both feature prominently in the main toolbars, but you don’t
    even need to resort to the user-interface to create lists. Starting a new line
    with an alphanumeric character followed by a full stop, or starting a line with
    a hyphen, and helpful Writer guesses you’re creating a list and switches mode
    accordingly. Not only will the Bullets and Numbering toolbar open, but your text
    will be reformatted and tabbed further into the document. Welcome to Writer’s
    auto-correcting function.


    # Quick tip


    Select a section of text and drag it around by left-clicking with your mouse.


    # Auto correction


    You will find Auto correction either incredibly useful or a real pain to deal
    with: it all depends on how you like to format your documents. If you’d rather
    just type and let the word processor correct spelling mistakes, create lists and
    bullets, hyphenate words and swap certain keywords with one another, then the
    default settings will suit you nicely. If you’d rather leave formatting and word
    replacement to a later read through of the text, or if you’d rather format your
    lists differently, then auto correction is going to drive you mad. Fortunately,
    there’s also a fine degree of control over which elements you want to be auto
    corrected, and which you’d rather leave. These settings, along with hundreds of
    others, can be found in the AutoCorrect window. This is opened from the Tools
    menu, and when first opened it will default to the replace window. This lists
    a series of characters on a panel on the left, with a series of longer words or
    special characters that will replace them on the right. For example, the first
    entry replaces (C) with the copyright symbol ©, and there are hundreds of other
    predefined replacements, including common typographical errors like ‘you’ for
    ‘you’ and correcting ‘insurence’ with ‘insurance.’ For corrections that are most
    likely to annoy, simply switch to the Options page to stop automatic list formatting
    or hyphen replacement.


    > > “Writer and its OpenOffice.org companions are able to produce documents comparable
    to commercial office apps, and are compatible with Microsoft Office too.”


    # Writer: The toolbar at a glance


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_30_0.png)


    +   1. New document

    +   2. Open document

    +   3. Save current document

    +   4. Email document using default email client

    +   5. Edit read-only documents

    +   6. Export document as a PDF

    +   7. Send to printer

    +   8. Preview the printed pages

    +   9. Manual spellcheck

    +   10. Automatic spellcheck

    +   11–13. Cut, Copy and Paste

    +   14. Copy and Paste text formatting

    +   15. Undo and Redo

    +   17. Insert a web link

    +   18. Create a table

    +   19. Show drawing toolbar

    +   20. Find and replace

    +   21. Jump to parts of your document

    +   22. Insert clip art into your document

    +   23. Merge other data sources

    +   24. Show non-printing characters

    +   25. Set zoom level

    +   26. Open Help documentation

    +   28. Style and Formatting list

    +   29. Font selection

    +   30. Font size

    +   31–33. Bold, Italics and Underline

    +   34–36. Text justification options

    +   38. Enable bulleted and numbered lists

    +   40–41. Decrease and increase indentation

    +   42. Font colour

    +   43. Section highlighting

    +   44. Background colour'
