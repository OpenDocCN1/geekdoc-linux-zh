- pgno: 60
  md: '# Trackballs


    If you ever played the arcade classic Marble Madness back in the 1980s, then you''ll
    understand exactly what you have to do in Trackballs. It''s a modern interpretation
    of the marble rolling game, replacing the two-dimensional isometric graphics with
    a real three-dimensional environment.


    You have to roll a steel ball bearing across varying surfaces and past terrifying
    hazards in a quest to get the ball from one end of the map to the other. You can
    use either the mouse or the cursor keys, but the mouse gives you a finer degree
    of control. If you do use the cursor keys, the Shift key will add acceleration.
    You often find yourself having to compensate for too much speed, either because
    you''ve just rolled down a large hill, or accelerated off a ramp. To slow down,
    you need to roll the ball in the opposite direction to where the ball is travelling
    – effectively reversing the direction of travel. You can also jump, by pressing
    either the left mouse button or the space bar, and you need to get used to this
    for traversing


    Trackballs is a little like those old wooden marble rolling games that Victorian
    children used to play with. Except the landscape is 3D and you roll the ball rather
    than tilt the box.


    small gaps, as well as avoiding the occasional enemy. Fall off any of the edges,
    and your game is over.


    The game starts relatively easily, with a level that features a big drop, some
    spongy surfaces and a section of sharpened pencils that try to push you off. Later
    levels feature bowls of acid and icy surfaces at strange angles, challenging even
    the most dexterous player. Along the way, save position


    markers help make the task a little easier, by allowing the player to restart
    at the same position. There are over 70 levels in total, split by difficulty,
    though only a master will be able to complete them all. You can choose which set
    to play at the beginning of the game. If you ever get bored with those supplied
    with the game, then you can create your own with the level editor, or download
    dozens more from the Trackballs website.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_60_0.png)


    # Pingus


    Marble Madness, the game that Trackballs imitates, was successfully converted
    to the Commodore Amiga computer in the 1980s, and you''ll find many similar conversions
    for Linux. One of the better ones is Pingus, a game inspired by the Amiga classic
    Lemmings. This being Linux, the lemmings have been replaced by tiny penguins,
    but the idea is the same.


    To complete each level, you have to save a certain number of penguins from destruction.
    You do this by assigning a role to certain penguins, and using these to help the
    progress of the remaining penguins in some way. The roles appear as icons on the
    left-hand border of the screen. Choosing ''Digger'' for example, and clicking
    on a penguin in the main display will cause the selected penguin to start digging
    into the ground directly beneath its feet. In the first level, this tunnel helps
    all the other penguins to escape to the exit, and it''s a similar process for
    the other levels. You can find what each role does by holding the


    mouse over the icon. Gameplay always involves a bit of trial and error to begin
    with. For instance, in the second tutorial level, the penguins jump of a large
    cliff, and it''s only when they start dying that you realise you need to give
    each one the ability to fly. Fortunately, ''Floater'' is the only role available
    for that level, and applying this to the in-game penguins saves the day.


    Progression from one level to the next is across a map that outlines the main
    area of the game, and even adds a little background story. This element is sometimes
    more like Super Mario World than Lemmings, but it adds to the enjoyment of a game
    that''s quickly approaching its 20th anniversary.


    Pingus bears more than a passing resemblance to that Amiga classic Lemmings, and
    you can enjoy it for free on your Linux box.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_60_1.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_60_2.png)'
