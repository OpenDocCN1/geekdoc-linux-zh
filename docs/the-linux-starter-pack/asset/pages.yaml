  md: '# Answers


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_110_0.png)


    Select either kubuntu-desktop or xubuntu-desktop to sample the other variants
    of Ubuntu.


    # Go home Gnome


    Q Now that I''ve got Kubuntu/Xubuntu installed, how can I access the different
    environments? Every time I log in, it takes me straight to the Gnome desktop.
    What am I doing wrong?


    A You''re not doing anything wrong - Ubuntu is defaulting to the Gnome desktop,
    because that''s its standard. In order to access either Kubuntu (KDE) or Xubuntu
    (Xfce) you need to explicitly choose them. There are two main ways of doing this
    within Ubuntu. The first, and by far the simplest, is to click the Options button
    in the bottom left-hand corner of the login screen and choose Select Session.
    You''ll see a window pop up where you can select which window manager you would
    like to run. To use KDE, make sure the radio button is selected and click on the
    Change Session button. When you log in, you''ll be asked whether you want to make
    your choice the new default, or to just use it for this session (as a one-off).
    If you want to experiment, we''d suggest choosing Just For This Session. Keep
    doing this until you''ve made your mind up about the alternative environment,
    at which point you can choose to make it the default.


    The other way to change this is to use the Login Window Preferences that we referred
    to earlier: on the opening screen you can choose the default session that you
    want to use. When you''ve decided what you want to do, click on the Close button
    and your settings will be saved, so the next time you log in you''ll be taken
    to your new choice of desktop environment.


    # What desktop?


    Q I tried doing what you suggested (installing kubuntu-desktop and xubuntu-desktop)
    and now I''m a bit confused! When I boot up, I see a Kubuntu logo until I get
    to the login screen where I see the Xubuntu login window, then when I login I
    then end up in Ubuntu. What gives? Does my computer have multiple personality
    disorder?


    A No – you''re quite safe. All that has happened is that the two desktop packages
    have installed differing loading and login screens. Let''s deal with the login
    screen first. In Ubuntu, go to System > Administration > Login Window. You may
    be prompted for your password, as you are going to be making system-wide changes.
    Once the Login Window Preferences dialog has opened up, simply click on the Local
    tab and select the Human theme from the list of theme options available to you.
    Click the Close button to return to your desktop. Now for the loading screen –
    this is a little more involved. At the command line, enter the command:


    sudo update-alternatives --config usplash-artwork.so


    You''ll then see a list of options. If you want to revert to the default Ubuntu
    artwork, enter the number 1 and press the Enter key. Ubuntu will then rewrite
    the configuration file accordingly. However, there''s one final step to take,
    and that is to rebuild the initial RAM disk, which may still reference the alternative
    artwork. We need to do this by using the command:


    sudo update-initramfs -u


    Depending on your own preference, you might choose to have several different themes,
    alternating between them every so often. All you have to do is repeat these two
    commands each time you want to switch.


    # Sound of silence


    Q I don''t hear any sound when I log in to Ubuntu, or when I try to play a game
    or listen to music. What''s happened, and can it be fixed?


    Make the switch to an alternative desktop environment, with the Login Manager
    preferences tool.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_110_1.png)'
