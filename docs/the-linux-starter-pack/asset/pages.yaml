- pgno: 12
  md: '# How to get help


    Hopefully the installation process went smoothly, but if not, there''s plenty
    of help to hand if you know where to look.


    If everything went swimmingly, by now you should be exploring the Linux desktop,
    trying out the included programs and getting familiar with the new environment.
    It''s very much self-explanatory – you can click on Applications at the top-left
    to start programs, click on System to change preferences and set up your hardware,
    and click the red button in the top-right to reboot or shut down your computer.


    If you''ve encountered a problem, however, don''t panic. One of the most common
    problems relates to video card recognition: the operating system tries to detect
    the hardware in your machine, can''t recognise it, and leaves you in text mode.
    If this happens to you, reset your PC and choose the second option from the Ubuntu
    Linux boot menu (the one that says ''safe graphics mode''). Now the operating
    system will use a failsafe video driver – one that isn''t as powerful as the normal
    drivers, but will still get you up and running.


    +   - **Be specific** The more information, the better, but stay on topic. Just
    saying "It won''t boot" gets you nowhere – people need to know what error messages
    you see, what you''ve tried, what hardware you have etc.

    +   - **Consider all options** Even if someone suggests a fix that sounds unusual,
    it''s worth trying. For instance, someone may recommend unplugging your printer
    before booting, which will actually help if Linux is having trouble recognising
    it.

    +   - **Be patient** It''s frustrating when things don''t work, but bear in mind
    that the users on these forums are all doing it for the love of Linux and the
    community. They''re not being paid to help, so if you don''t get an immediate
    response (or someone asks questions), don''t get into flame wars.


    # Getting help


    If you''re unsure about anything during the installation process, or if you''ve
    come across a problem that you''re not sure how to solve, you can get help at
    various places online. Because of the millions of combinations of PC hardware
    out there, it''s impossible to provide a definitive list of fixes for any operating
    system – so you need to state your problem clearly.


    www.ubuntuforums.org is one of the busiest Linux forums on the internet, with
    over 500,000 users helping one another out when problems arise. These forums are
    separated into distinct sections: at this stage you should post your message in
    the Installation & Upgrades section.


    Ubuntu''s forums are very friendly and you''re likely to get a quick response,
    but there are a few guidelines to take note of before you post anything:


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_12_0.png)


    www.ubuntu forums.org is the best place to get help on Ubuntu Linux, with thousands
    of fellow users ready to assist.


    # Extras on your DVD


    As you''ve seen, the DVD accompanying this magazine boots and installs Ubuntu
    Linux, and this is ideal for taking your first steps with Linux. We''ve included
    a couple of extras, though, so as you become more familiar with the operating
    system you can make use of them.


    The first of these, found in the Extras folder on the DVD, is a 64-bit ISO image
    of Ubuntu Linux 7.10. You can burn this to a CD-R and use it to install on 64-bit
    machines (ie PCs with AMD64 or Intel Core 2 processors) if you want a small performance
    boost. Note that there''s not a huge gain, though, and for most users we recommend
    sticking with the standard 32-bit version, as bootable from our DVD, which runs
    happily on 64-bit PCs. Also, the bootable version includes software such as Inkscape
    and Scribus – covered in later tutorials – which you''d otherwise have to download
    separately.


    Our second distro is called SuperUbuntu, which is also in the Extras section.
    This is a special version of Ubuntu Linux 7.10 that includes a vast range of additional
    software, such as the KDE desktop and development tools. It''s overkill for your
    first forays into Linux, but later on, when you want to install Linux on other
    machines and minimise the amount of downloading required, burn it to a DVD-R and
    boot from it to install.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_12_1.png)


    Our special beefed-up version of Ubuntu, with extra programs and development tools,
    will be useful when you''re more familiar with Linux and want to take it further.'
