- pgno: 17
  md: '# Managing your programs


    If you took the opportunity to click around earlier, you''ll have noticed there
    are lots of apps to try. It''s best to keep them arranged neatly...


    Your Linux desktop is split into three parts: the main menu lives at the top,
    the task pane (often called the panel) lives at the bottom, and all the programs
    you run live between the two. The task pane is very simple: it just tracks the
    programs you''re running so that you can switch between them, and also hosts the
    trash can icon so you can delete files easily. And of course the big gap in the
    middle for your own programs is also easy to understand, because you choose what
    goes there! The menu bar is a little more complicated, however, because it''s
    split into several subsections of its own.


    # Finding your applications


    The most important entry on the menu bar is Applications, because this stores
    a link to all the programs you have installed, as well as an option to add more.
    When you click it, you''ll notice that Linux groups its programs into categories
    based on what they do rather than the Windows method of who made them. The default
    categories are likely to be Accessories, Games, Graphics, Internet, Office and
    Sound & Video – each will contain several programs that you can run. As you install
    more programs, they will automatically be placed into the right categories for
    you, and new categories will be created as needed, such as Education and Programming.


    If this default menu layout doesn''t work for you, right-click on the Applications
    menu and choose Edit Menus. On this window you''ll see the menu list down the
    left-hand side and the programs list down the right. To show or hide a program,
    just deselect it in the appropriate menu. You can also add a link to an unlisted
    program by clicking the New item button and giving it a name and a command to
    run. To change the icon for the new item, click on the picture button to the left
    of the Type field.


    If you want edit or delete an existing item, you need to right-click on it and
    choose the appropriate option. But beware: once it''s gone, the only way to retrieve
    a menu item is to click the Revert button at the bottom of the editing window,
    and that undoes all your changes!


    # Going places


    Adjacent to the Applications menu is the Places menu, which contains a series
    of shortcuts to common directories on your computer; network connections; file
    search; and a list of recently opened documents. As with the desktop, any removable
    media that gets plugged into your computer will be listed here for easy access,
    but you''ll also find any active network connections here.


    Speaking of connections, you can connect to another computer by choosing Places
    > Connect To Server. It doesn''t matter whether you want to use Windows Networking,
    FTP, WebDAV or even super-secure SSH – the Connect To Server dialog can do it
    all. You will need to provide the address of the server (eg www.example.com or
    an IP address like 192.168.0.1) and may also need to provide a username and password
    if the connection is secure, but otherwise this is very easy.


    # Extending the panel


    At the top-right of the screen is the Panel, which by default contains a quick
    logout button, a clock and other helpful little things. On the left of the panel
    you''ll see your username; that''s the fast user switching system – if you have
    more than one user, you can click there and it''ll log them in straight away.


    But if you right-click just to the left of that username, a menu will appear that
    starts with Add To Panel. This is where you get to add all sorts of weird and
    wonderful things to your panel, for example:


    Address Book Search Need to look up contacts regularly? Don''t bother opening
    up a dedicated program, because this lets you search for someone right from your
    desktop!


    Fish Puts an animated fish into your panel. As if that weren''t great enough(!),
    you can click the fish to get some sage words of advice and occasional random
    comedy: "What''s the difference between a dead dog in the middle of the road and
    a dead lawyer in the middle of the road? There are skid marks in front of the
    dog!").


    Eyes People who occasionally manage to lose their mouse on the screen need never
    worry again: this pair of eyes will follow your every move!


    Weather report This will download the latest weather predictions for your approximate
    area. To make it more


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_17_0.png)


    Right-click on a spare part of a panel, then choose Add To Panel – there are lots
    of things you can try here, but don''t go overboard!'
