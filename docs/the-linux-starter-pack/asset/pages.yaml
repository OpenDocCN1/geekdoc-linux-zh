  md: '# Desktop publishing


    # Creating documents with Inkscape and Scribus


    What’s better than a great design application? Two great design applications!


    If you need to create documents for any reason, Linux comes with some top-rate
    applications for you to use. Inkscape is a vector illustration package. Because
    it draws objects as shapes rather than pixels, the pictures you create with it
    can be resized and used as big or small as you want them with no loss of quality
    (unlike a raster graphics application, such as Gimp or Photoshop). It is a very
    capable drawing package, with features to match some of the very best commercial
    software on any platform, and it uses the Scalable Vector Graphics file format,
    a standard for vector graphics on the web.


    Scribus is a desktop publishing program – in other words, a word processor with
    plenty of extras! You can use it to produce everything from flyers for the school
    disco to proper magazines (see Linux Format issue 96!). Scribus has plenty of
    tools for creating stunning documents, but drawing complex graphics is easier
    in Inkscape. The object of this tutorial is to show you how to use them together
    to create a library of great graphics for whatever you need.


    First we will create a rubber-stamp effect in Inkscape, then import it into Scribus
    and look at the Scrapbook feature. Open up Scribus and Inkscape from the Applications
    > Graphics menu and get ready to create great graphics...


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_45_0.png)


    Not only does the latest version of Scribus serve as a versatile, professional
    design tool, it’s also a great Linux-based tool for making PDFs.


    # Step by step: Create a simple document


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_45_1.png)


    1 Fire up Inkscape from the Applications > Graphics menu. To start with we want
    to create a texture for our stamp effect, and all great textures start with a
    rectangle. Use the shape tool to drag out a big black box at the top of the page.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_45_2.png)


    2 Now choose the calligraphy tool (it looks like a pen). In the tool bar, set
    the width to 15 and ‘tremor’ to 0.4. Now squiggle over the rectangle, trying to
    cover it, but not completely. The gaps will give our ‘grungy’ effect.


    46 | Linux starter pack'
