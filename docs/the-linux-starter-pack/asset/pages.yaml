    \ be full of notes as you desperately try to work out which key combination to\
    \ press. The instructions even recommend holding your computer keyboard as you\
    \ would a real guitar, with your left hand over the function key frets and your\
    \ right over the carriage return. Frets on Fire is the perfect party game, because\
    \ it involves rock music and keyboard posturing – a combination that our inner\
    \ rockers think is a real winner.\n\n+   **Also look out for:**\n+   \n+   Frozen\
    \ Bubble\n+   Fantastic, split-screen puzzle game based on Puzzle Bobble.\n+ \
    \  \n+   Adonhell\n+   Japanese-style role playing game with a small intricate\
    \ plot and autonomous players.\n+   \n+   Nethack\n+   The classic turn-based\
    \ adventure game that never gets tired. Spawned a generation of imitations.\n\
    +   \n+   Enemy Territory\n+   First person online shooter based around storming\
    \ the beaches of WWII.\n+   \n+   LBreakout\n+   The classic pong game takes to\
