    # What root folder?


    I’m a bit confused by the naming conventions in Ubuntu. People keep referring
    to the root directory, but every time I try to access it I get an error telling
    me that I don’t have the correct permissions. What gives?


    We can understand your confusion! In Ubuntu, there are actually two directories
    that are known as root. The first one, commonly shown as just /, is the root directory,
    which is the root of your filesystem (or rather the top-most directory of your
    filesystem). Under the root (/) directory are all the many directories and files
    that make up your system. Your confusion isn’t helped by the fact that there is
    a root sub-directory called (/root) under the root directory (/), which is actually
    the second of the two directories. This belongs to the root user, and contains
    their system files and preferences. This directory is only accessible while working
    as the root user or by using the sudo command.


