  md: '# Desktop effects


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_68_0.png)


    Pressing cursor down within the Desktop Cube will lay out each virtual desktop
    horizontally, and you can scroll between them using cursor right and left.


    the polite side to Compiz, a seriously crippled version that doesn''t look too
    scary and shouldn''t make your machine unstable. It''s also a good indication
    that everything is working as it should. If your graphics hardware isn''t working,
    for example, the only option you will have in the window is ''None''. The restricted
    driver installation may have even taken the liberty of enabling the extra effects
    automatically. But for real Compiz power, you need to install the grass-roots
    Compiz configuration tool, and for that we need to open Synaptic from the Administration
    menu


    After you''ve got Synaptic running, you need to search for a package called compizconfig.
    In the list of packages that present themselves, select the top option (compizconfig-settings-manager).
    You''ll be asked for permission to install a related Python package, after which
    you should click on Apply. Synaptic will then grab the required packages and install
    them on to your system automatically. You will now find an extra configuration
    panel hidden in the ''Preferences'' menu, labelled ''Advanced Desktop Effects
    Settings''. This is the fabled Compiz configuration manager we''ve been after.


    # Compiz Configuration Manager


    The Compiz Configuration Manager is awkward to use. The main problem is that there
    are just too many options. You can change almost anything about anything – from
    which corner of the screen you use to launch an effect, to the number of virtual
    desktops you want to use. All settings are broken down into categories, which
    you can see listed on the left of the main window. Clicking on a category will
    list all the available options in the main window to the right, with each option
    accompanied by an enabling check box. With the exception of the ''General'' category,
    every other option represents a separate plugin, from the desktop cube to the
    mouse cursor flames. It also means that everything needs to be enabled explicitly,
    by scrolling through the plugin list and enabling them one at a time. To add to
    the fun, you can also double-click on any of the plugins to find a few more pages
    of configuration options.


    You should already find a few plugins enabled. These are the rudimentary desktop
    effects we enabled earlier. But by way of a brief introduction into the Compiz
    configuration framework, we''ll step through the procedure for enabling the desktop
    cube. The desktop cube can be used to quickly switch between each virtual desktop
    which are each pasted onto the sides of the cube. If you have more than four desktops,
    the effect isn''t actually a cube, as it has as many sides as you have desktops.
    The main plugin is called ''Desktop Cube'', and this can be found under the Desktop
    category. When you enable it, you''ll see the following warning, "Plugin Desktop
    Wall provides


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_68_1.png)


    feature largedesktop which is also provided by Desktop Cube." This message means
    that a feature of the plugin you''re attempting to enable is already provided
    by a currently active plugin. And both plugins are mutually exclusive. In this
    case, ''Desktop Wall'' is enabled and this also offers ''large desktop'' functionality
    – the ability to switch between virtual desktops. This causes a conflict with
    the Desktop Cube, which does exactly the same. This is why the warning window
    is asking you to enable one and disable the other, which it will do automatically
    when you select ''Disable Desktop Wall''.


    The desktop cube looks great, but it''s also a useful and functional usability
    add-on, letting you visualise which desktop you''re on.


    # Desktop cube


    Now that the cube is enabled, you might think that''s all there is to it. But
    Compiz has taken plugin modularity to extremes. You can''t do anything useful
    with the cube without enabling the Rotate Cube plugin. As its name implies, Rotate
    Cube is responsible for turning the cube around and making it useful. Double-clicking
    on the plugin will let you change the keys or shortcuts you use for switching
    desktops, but the default choices are good. Ctrl+Alt and the left and right arrow
    keys will switch desktops to the left or right. Using cursor down instead will
    flatten the cube so that you can see each desktop in a line, and you then use
    cursor left and right again to choose the desktop from that view. You can even
    use the middle mouse button to click and drag on the desktop background to freely
    spin the cube in all three axes. Welcome to Compiz!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_68_2.png)


    To install the Compiz configuration manager, you need to search for compizconfig
    in Synaptic.'
