  md: '# Security


    your new password in and re-type it in case you made a mistake. Ubuntu will keep
    you on the straight and narrow, letting you know if the two passwords don’t match.
    After entering your new password twice, you’ll be prompted to click the Change
    password button to formally change your password, so do so. Finish off by clicking
    the Close button.


    # Perimeter security


    Of course, passwords aren’t the be-all and end-all for security in Ubuntu. In
    fact, by default Ubuntu doesn’t listen on any network ports at all, meaning that
    if a remote user tries to attack your system, they won’t be able to see it on
    the network. This is a good thing, but you shouldn’t get it confused with having
    a firewall in place, as a firewall does something slightly different.


    The only issue with not listening on ports is that when you install services that
    use network ports for access, these ports then become active. For instance, if
    you install Apache (the web server) for Ubuntu, it automatically starts to listen
    on port 80, which is the standard port for HTTP traffic. Therefore your computer
    is now open to attack on port 80, something that you need to be aware of. The
    same holds true if you install any other services, such as SSH or FTP servers.
    This is where a firewall comes in, especially if you only want to have local access
    to these services while you’re learning about them. But first and foremost, it’s
    a simple rule: only install software that you actually are going to use. Keeping
    software on a system and leaving network ports open is never a good idea!


    So to the firewall then. First the good news: Ubuntu doesn’t come with a firewall
    enabled by default, because it relies on not listening on any ports. This doesn’t
    mean that there isn’t a firewall installed, as Iptables is present on every Ubuntu
    installation. What it does mean is that the firewall does not control any of the
    traffic coming into or out of the system. So we need to find some way of configuring
    and activating this


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_96_0.png)


    > > The Permissions tab under Home

    > > Properties is the place to be to define who can do what to your files.


    firewall, and to do this we’re going to install a package called Firestarter.
    Head on over to System > Administration > Synaptic Package Manager and search
    for and install the package named firestarter. Once this has completed, you’ll
    find it under Applications > Internet > Firestarter.


    # User security


    Another security feature that Ubuntu offers is the ability to restrict access
    to files and directories depending on permissions. A full discussion on file and
    directory permissions is outside the scope of this tutorial, but we can look at
    some of the basic principles to get you familiar with the concept.


    Every user on the system has a numeric user ID. Ubuntu starts these at 1000, and
    for every new user this number is incremented by 1. Each user can also belong
    to one or more groups, depending on how you manage them. By default a group is
    created with the same name as the user, and they


    # The power of root


    If you need to share information with another user, then you can add them to your
    group by going to System > Administration > Users and Groups. In the tool that
    appears, click the Manage Groups button on the right-hand side and scroll down
    until you see the group that corresponds to your username. Double-click this group
    to edit the properties, and select the users that you want to become members of
    this group. Click on the OK button to apply the changes, and give read-only access
    to your home directory.


    A user can be a member of many different groups, and you may find it more useful
    to create specialist groups rather than using the groups created as part of the
    user account creation process. The only exception to all of this is the root user,
    who has access to anything on the system at any time. By default Ubuntu disables
    the root account, instead relying on the sudo command to carry out administration
    tasks. As the primary user you have access to the root user powers, and can activate
    this at the terminal by issuing the command:


    ```

    sudo -i

    ```


    You’ll be prompted for your password, and once you’ve entered this, the prompt
    will change to a hash mark (#) to denote the fact that you are working as root.
    From here you can navigate through the entire system if you want, or you can fire
    up a file manager window by entering the command:


    ```

    nautilus &

    ```


    Be wary of careful when working as root – you have the absolute power to destroy
    everything, and Ubuntu won’t stop you.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_96_1.png)'
