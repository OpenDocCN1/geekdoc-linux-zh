    # Dual booting


    Q My system dual boots between Windows and Ubuntu. Under Ubuntu I can see my Windows
    hard drive and all the files on it, though when I boot into Windows I can’t see
    the same information from my Ubuntu hard drive. I’d like to be able to transfer
    files back and forth between the two systems, but it only seems possible to do
    this while using Ubuntu. What do you recommend I do?


    The simple answer is to create a folder on your Windows partition that you can
    use as a ‘drop box’ to transfer files across. Another alternative is to use a
    USB key, which are becoming increasingly cheap and offer increasingly larger storage
    capacities! As a side note, it was only recently that Ubuntu included support
    for NTFS, the filesystem used by Windows XP and Windows Vista. You are able to
    read and write to NTFS volumes, but unfortunately Windows XP and Vista cannot
    access ext3 volumes, the file system used by Ubuntu


    # What’s compilation?


    Q Occasionally when I’m looking for Linux software on the internet, I come across
    instructions asking me to compile things. What does that mean, and do I really
    have to do it?


    In short, compiling a program means taking the building blocks (the source code)
    and letting the computer build the program for you using some automated tools.
    However, for new users this isn’t really recommended, as it can cause problems
    if your new program depends on a newer version of some library file than the one
    you currently have. Instead, you may actually find a pre-compiled version of the
    program (commonly known as a binary package) within Synaptic; Ubuntu has access
    to over 23,000 packages, so the chances are quite good that you’ll find


    what you’re looking for. In the event that you absolutely need to compile something
    from source, then here is what you’ll need to do. First of all you’ll need to
    install the **build-essential** package, which automatically installs a suite
    of tools that are used during the compilation process. Then you’ll need to decompress
    the source code, which has most likely arrived in the shape of what’s known as
    a tarball, or a TAR archive. To do this, execute the following command:


    ```

    tar zxvf nameofatarball.tar.gz

    ```


    Next, cd into the directory:


    ```

    cd nameofatarball

    ```


    Now, read the **README** file, as this may contain important information that
    you may want to be aware of before you start the compilation process. You might
    also notice an **INSTALL** file present; if so, make sure to read this too. Forewarned
    is fore-armed! To read either the **README** file or the **INSTALL** file, enter
    the command:


    ```

    less README

    or

    less INSTALL

    ```


    Once you’ve checked these files (if available) you’re ready to being the compilation
    process. This is a straightforward command like so:


    ```

    sudo ./configure && sudo make && sudo make install

    ```


    You need to use the sudo command, as Ubuntu requires administrative rights in
    order to complete the compilation. The && symbols link these commands together,
    so that as one finishes, the next one starts, ensuring that they are all done
    one after the other.


