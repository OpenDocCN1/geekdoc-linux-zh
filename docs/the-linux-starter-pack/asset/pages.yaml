  md: '# Miro


    If you have broadband, *Miro* lets you choose from hundreds of free online TV
    channels and download and store your videos in one place.


    In a world where online entertainment is increasingly commercialised and locked
    down, *Miro* is a breath of fresh air. It’s an open source media player. But what
    makes *Miro* so different from most other media players is that it’s hardwired
    to the internet. In technical terms, *Miro* uses the same RSS feeds you use to
    keep up to date with the news, but instead of news, *Miro* subscribes to content
    tuned for video. If you’ve ever subscribed to a podcast in Apple’s *iTunes* software,
    you’ll already be familiar with the technology. *Miro* does the same for video.
    *Miro* needs to be installed through Synaptic, after which you can find tucked
    away in the Applications > Sound & Video menu. When first launched, *Miro* downloads
    the latest RSS feeds for all the channels its subscribed to by default. The front
    page that you see is the ‘Miro Guide’, an edited front-end to many of the new
    channels. It constantly updates with news from the *Miro* world – the internet
    TV equivalent to the electronic programme guide you find on many modern televisions.
    You can see each channel listed on the left panel sorted into categories. The
    blue number to the right of each channel is the number of new videos posted on
    that channel. Green numbers are the number of new and downloaded videos that area
    ready to watch.


    client is also uploading chunks of the file to other users without the same bits
    as you. It’s a process known as peer-to-peer downloading, because the other *Miro*
    users you’re connected to are your ‘peers’. You may have heard of BitTorrent in
    reference to illegal software, but this is purely because the same protocol is
    used by people who share files they don’t have permission to share. With *Miro*,
    all the content is perfectly legal, and BitTorrent is a legitimate and highly
    efficient method of getting the data to everyone.


    # BitTorrent


    Clicking on one of the channels will open the list of videos currently available.
    Along with the title, there’s normally a brief synopsis on what the video is about.
    If you find one that interests you, click on the blue down arrow near the video
    thumbnail. This will add the video to the download queue. The clever thing about
    *Miro* is that it uses the BitTorrent protocol to download the files. This is
    a great way to share the burden of hosting and downloading files, and is partly
    the reason why *Miro* and its content is free. When you download a file, you’re
    actually downloading the data from other *Miro* users, grabbing pieces from people
    who already have the same file. The *Miro*


    # Channel hopping


    Depending on the speed of your internet connection, you may need to wait a short
    while for your selected videos to download. You can check on their progress from
    the ‘Downloading’ channel on the left. When each download completes, it will be
    placed in the ‘New’ folder, and a green digit will show how many new videos there
    are to watch, as well as which channel the video originated from. Clicking on
    either of these green numbers will open the video list for that channel, and from
    there you can play your downloaded movie.


    The best part about *Miro* is that it can download videos according to your criteria,
    and do so automatically. If you find a channel or RSS feed you like, for instance,
    you can download all videos posted to that channel automatically. From the blue
    ‘Auto Download’ bar at the top of the channel list, just select ‘New – Get Only
    New Videos’, and *Miro* will do the downloading for you in the background. This
    is great if you want to leave *Miro* running overnight, because it means you’ll
    have everything ready to view when you log in to your machine in the morning.
    By default, videos will be removed automatically after ten days. If you want to
    keep a video, press on the ‘Keep’ button on the video strip after it has been
    downloaded. The video will then be appended to your Library, and you can also
    add any other video files you may have on your hard drive and use *Miro* as an
    all-encompassing media player.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_108_0.png)


    *Miro* is the gateway to a world of online entertainment. There’s even a programme
    guide with reviews of popular downloads.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_108_1.png)


    You can search and download movies from YouTube, as well as many other online
    video sites.'
