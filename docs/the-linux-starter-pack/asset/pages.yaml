    Epiphany, Lynx, Links, Amaya, Mozilla, Kazehakase, Galeon, Dillo, Chimera and
    more. To be clear, all those are real, working web browsers that are being actively
    developed, which means you can try them all and find the one that works best for
    you.


    Of course, the problem with all this choice is that your menu bars can get very
    cluttered, which is why Ubuntu ships with one application per task – you get one
    web browser, one text editor, one spreadsheet, and so on. If you’ve tried these
