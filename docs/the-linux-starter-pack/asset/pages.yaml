  md: '# Desktop publishing


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_0.png)


    3 Leaving your scribbles selected, choose Path > Simplify from the menu (or use
    Control+L). This will round off the edges of the scribbles a bit. Feel free to
    do it more than once to get a smoother, more natural effect.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_1.png)


    4 Use Control+A to select all the objects, then choose Path > Intersection. This
    merges the paths of these two shapes together, so now you have one object – a
    black rectangle with bits missing.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_2.png)


    5 Click on the object and drag the corners to resize it. We don’t want huge chunks
    out of our design, and it will probably look better if the holes are squashed
    a little in one direction, so try resizing it to a smaller square shape.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_3.png)


    6 Use the palette along the bottom to select a good colour for your texture. Now
    choose Object > Pattern > Objects to Pattern to create a new pattern from this
    shape.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_4.png)


    7 Leave the object for now. Let’s create the text for our stamp. Choose the text
    tool from the left-hand panel, then click on the page and type out your word.
    Select all the text and choose Text > Text And Font from the menu. Choose a nice
    font and size for your object.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_46_5.png)


    8 With the object selected, choose Object > Fill And Stroke. Under the Fill tab,
    choose the Pattern Fill option. As you have only one pattern, it will be automatically
    selected and applied. If it doesn’t look right, tweak the original pattern object
    and repeat from step 5.'
