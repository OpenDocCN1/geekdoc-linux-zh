- pgno: 79
  md: '# Disc burning


    # Burning CDs and


    Want to back up your documents or copy files for a friend? Here are the simple
    steps you need to follow...


    Making regular backups is something we all intend to do, but sometimes we forget
    or we''re simply too busy with other things. However, it''s still wise idea to
    keep crucial documents safely stored on CD-Rs or DVD-Rs for emergencies – in case
    something goes wrong with your hard drive, or your laptop is stolen. With the
    right backups, you can get back on your feet quickly and easily (financial hassles
    aside!).


    Of course, disc burning isn''t just limited to backups. Often you''ll want to
    make a CD-R or DVD-R of files to give to a friend or colleague, such as work-related
    documents or family photos. Ubuntu Linux makes this easy: disc burning support
    is built right into the system, so you don''t have to splash out on expensive
    third-party software or wrestle with time-limited shareware tools. On page 76''s
    guide you''ve seen how to burn discs for media files; here we''ll show you how
    to back up any kind of data. Naturally, your PC will need some form of disc burner,
    internal or external, if you''re going to follow this guide.


    When it''s done, you''ll find Brasero in the Applications menu under the Sound
    & Video category. Brasero initially displays a window letting you choose the type
    of disc to create: in our case, we want a ''Data Project'' disc, so click on that
    button. You can then drag files into the Brasero window, change the type of disc
    with the bottom-left button, and click on Burn to start the disc-writing process.
    Brasero lets you add files on to existing CD-RW/DVD-RW discs, and shows a useful
    bar chart of how much disc space is remaining, so it''s a good alternative to
    the standard Linux tools.


    # Going further


    The disc burning software supplied with Ubuntu Linux, as explained in these steps,
    is very straightforward and light on features. If you want more versatility and
    power, though, we recommend installing a program called Brasero, which is available
    via Ubuntu Linux''s online package repositories. Click on System Menu > Administration
    > Synaptic Package Manager, then search for ''brasero'' and install it. The package
    will be downloaded from the internet and installed on to your system. With a fast
    (ADSL) internet connection, this shouldn''t take more than a couple of minutes.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_79_0.png)


    If you find the file manager-based system too limiting, Brasero provides a more
    featureful disc burning tool.


    # Step by step: Burning a CD-R or DVD-R


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_79_1.png)


    1 From the desktop, click on the Places menu at the top of the screen. then click
    on CD/DVD Creator in the menu.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_79_2.png)


    2 This window will open: it''s a blank file manager window into which you can
    drag and drop files to be copied to the disc.'
  merge: -1
  img_proc: true
