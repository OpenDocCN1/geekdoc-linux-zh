- pgno: 36
  md: '# Using ranges


    ?, which is shorthand for "I don''t know what''s going on, but I can''t resolve
    the contents of this cell." Whenever you enter data on the spreadsheet, and it
    references another cell, that cell is recalculated. In this case, when Calc tried
    to work out the value for C1, it eventually worked its way back to A1, whose value
    was indeterminate — the cells are trying to reference each other, so it is impossible
    to calculate a working value.


    Usually this sort of error is just that. In the scheme of things, you are unlikely
    to intentionally create a circular reference, and when you do, it''s usually because
    you are trying to do something you didn''t really mean to do, or at least, didn''t
    really mean to do in that particular spot, so fixing the error, moving the data
    somewhere else, shouldn''t be too hard. In most spreadsheets, data flows from
    one part, through loads of functions, to the end, possibly a chart. It very rarely
    flows in two directions, just as you don''t often see a river flowing backwards.


    in column B. So, you can simply copy and paste them. select B1 and then hit Ctrl-C
    to copy the contents. Now click and drag to select all of the range B2 to B100.
    Now Press Ctrl-V to paste the function in. If you click on a cell in the B column,
    say, B13, you will see it contains the function =A13*1.175. By default, in pasting
    operations, Calc will use relative references. So if you copy something from B1
    and put it in B4, all the cell references are adjusted by the same amount.


    Sometimes, you don''t want this to happen, and in those cases you should insert
    the $ symbol before the column or the row or both to lock it. When you paste such
    values, the exact reference is always maintained.


    Now you know a little bit about how the spreadsheet actually works. Over the next
    few sections we will be looking at more advanced features of the spreadsheet,
    and how to perform simple and complex tasks.


    Some functions require a range of values to work, rather than a single cell. For
    example, the function Average(...) returns the average of a list of numbers. This
    can be a list of literal values (1,2,3,4) or cell references, or more usefully,
    a cell range. A Range is defined by the start and end cell references, separated
    by a colon. So, A1:A7 is the range of values contained in the seven cells at the
    top of column A. A range doesn''t have to be a single column or row, it could
    include a number of either. So, A1:C3 is a range of nine cells: A1,A2,A3,B1,B2,B3,C1,C2,C3.


    You should be careful with ranges though, as some functions require a range to
    be in a single column.


    You may also sometimes see values in ranges with a dollar sign in front, like
    this: $A$1. This signifies that the reference is an absolute reference and should
    always link to that cell. What''s the point of that? Well, it becomes useful when
    copying and pasting functions or cell references. Say you have a column A with
    prices in, and you want to have another column with prices plus VAT. In B1 you
    would enter the function =A1*1.175. That''s all simple enough. But now, say your
    column A contains 100 prices! It would take ages to manually enter the formulae
    for each element


    Some functions need a range of values to work properly, so get used to working
    with them.


    Cutting and pasting functions automatically updates relative cell references,
    unless you use the $ before the column or row or both.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_36_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_36_1.png)'
