  md: '# Linux desktop


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_20_0.png)


    # Disabling file previews


    One common criticism of Nautilus is that it isn’t very fast, and that’s true –
    but only because it’s providing lots of features behind the scenes! For example,
    whenever you open a directory in Nautilus, it will scan all the directories and
    count how many files they contain, then scan all the files to generate previews
    for the icons. If, for instance, a file is a picture, Nautilus will generate a
    thumbnail of that picture for the icon so that you can see exactly what it is.
    All this work can chew up a lot of CPU time, so if you want to streamline Nautilus,
    go to Edit > Preferences > Preview then change all the ‘Local Files Only’ options
    to ‘Never’.


    Don’t like how Nautilus works? Change it until you’re happy!


    The second toolbar is a bit more interesting, because it contains a location bar
    and viewing options. The location bar is mostly hidden by default – in fact, you’ll
    probably only see a pencil and paper icon, a button with a ‘left’ arrow on, and
    another button with your username on it. This location bar is designed to make
    it easy to browse to directories above the current one, because as you move around,
    the directories will all be listed there.


    To get started, click on the left-facing arrow button to make it show all the
    parent directories: the first one will be a picture of a hard disk (symbolising
    the root directory), the second one will be ‘home’ (which is where all user directories
    live), and the last one will remain as your username, to show that you’re currently
    looking at your home directory. If you want to see the location bar as a real
    path, press Ctrl+L – the buttons will disappear and be replaced with /home/yourusername.
    You can then type directly into there to change directory. Or if you’re particularly
    lazy, just typing / will bring up that path information, allowing you type a full
    path.


    On the right of the location bar are buttons to adjust the zoom level (great if
    you have a small screen or if you prefer your icons nice and chunky) and a drop-down
    selection box that alters the way the files are shown. The default is ‘View As
    Icons’, but you can change that to ‘View As List’ to get a tree view of your files,
    showing size information and more.


    # Going places


    On the left of the Nautilus window is the task pane, which is set to show the
    most popular places by default. This is just like the Places menu, but if you
    look carefully you’ll see a small arrow next to the word ‘Places’ at the top of
    the pane – if you click that, you’ll see that you can change what that area shows,
    so it’s a bit more useful than just repeating the Places menu!


    +   - Information Shows information for selected items.

    +   - Tree Shows the directory structure for your computer, similar to Windows
    Explorer:

    +   - History Remembers the directories you’ve visited recently so you can snap
    back to them quickly.


    +   - Notes Allows you type text to associate with a particular directory.

    +   - Emblems Shows a list of icons you can attach to files and folders to visually
    mark them as private, important, etc


    We think you’ll find the emblems system particularly useful, as you can drag and
    drop icons wherever you need to so that you can see at a glance what each folder
    does.


    # Tweaking to your tastes


    Nautilus is designed to be quick and clean by default, but it’s ripe for customisation
    if you want to get a little more out of it. To take a look for yourself, go to
    the Edit > Preferences menu – the particularly relevant parts of this are the
    second and third tabs (Behaviour and Display), because these affect the core parts
    of Nautilus.


    For example, the Behaviour tab has at least three interesting items:


    +   - Double Click To Open Items This is set to be the default, but if you hate
    double-clicking everything, just set it to single-click mode.

    +   - Always Open In Browser Windows The Nautilus view you’re used to (menu bar,
    two toolbars and location bar) is known as the browser view because of the up,
    back and forward buttons. Disabling this option will give you an even slimmer,
    less-cluttered Nautilus view – give it a try and see what you think!

    +   - Include A Delete Command By default, deleted items go into the trash can
    where they can be recovered later, but enabling this option means you can force
    an item to be permanently deleted immediately, which is a smart move if the document
    is confidential.


    Over in the Display tab, you can choose what information is shown about your files.
    By default, Nautilus will only show the file size, and only then if you zoom in
    enough, but using these options you can have it show the file type, modification
    date, owner, permissions and more! TIP'
