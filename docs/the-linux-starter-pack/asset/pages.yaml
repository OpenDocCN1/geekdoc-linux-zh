  md: '# Browse the web


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_22_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_22_1.png)


    Sometimes Google won’t have the best results for a search, so try changing the
    search provider to something more suitable.


    Firefox springs into action when it spots sites trying to open strange windows
    (left) or impersonating other sites (right).


    reach your favourites in a single click. You can even right-click on a blank space
    in the toolbar and open all your bookmarks at once – easily the fastest way to
    get up to speed in the morning!


    To get started, visit any page that you want to bookmark, and look to the left
    of the URL – you’ll see a small icon there. Many websites have a custom logo there,
    but if your site hasn’t chosen one then you’ll see a blank page of paper next
    to the URL. Now, click that icon, and drag it over the bookmark toolbar – that’s
    the one with ‘Getting Started’ on. Let go of your mouse, and a new button will
    appear on the toolbar using the title of the web page. That probably isn’t too
    good, because a page’s title is rarely short enough to fit onto the button, and
    often doesn’t even say what the site is! To fix that, right-click on your new
    bookmark button and choose Properties, enter some more descriptive text in the
    Name field, then click OK to save your changes.


    Firefox pushes the idea of bookmarks even further using its Live Bookmarks system,
    which is a blend of RSS feeds and bookmarks – you can put them into the bookmarks
    toolbar, and they will appear as a menu that can be clicked to show more information.
    But the magic of Live Bookmarks is that the ‘more information’ part is an RSS
    feed of news from any source you want, and clicking on any of the headlines will
    load the full story in the browser. To give this feature a try, first find an
    RSS feed that interests you. If you haven’t tried RSS before, go to http://news.bbc.co.uk,
    then look down the left-hand menu bar until you see “News Feeds”. When the page
    loads, you’ll see a long list of available news feeds down the right – choose
    any one of them, and another page will load that looks quite different to the
    normal BBC News home page. At the top, you’ll see a message saying “Subscribe
    To This Feed Using” and a selection box where “Live Bookmarks” is the default.
    Click “Subscribe Now”, and you’ll be asked where you want to create the bookmark.
    Leave the default selected and click OK, and you’re done!


    # Blocking malware


    One of the core things that Firefox does very well is protect you from web nasties
    – aggressive advertising, ‘phishing’ websites that masquerade as sites you trust,
    and cookies that store unwanted information about you.


    On the advertising front, it used to be common practice to be swamped by adverts
    when visiting certain websites. Worse, these adverts were usually ‘pop up’ style,
    which means they appeared over what you were trying to do. Some were even ‘pop
    under’, which meant they would appear below your browser, and you would only see
    them when you were done. These unwanted web irritants used to plague the web,
    but Firefox took the lead and started blocking them and other similar aggressive
    advertising. In fact, Firefox’s blocking system is so powerful that it may occasionally
    block windows that you want, so by default Firefox will notify you when it blocks
    a popup window so that you can choose to show it if you want to. When this happens,
    a small yellow bar will appear at the top of the page to notify you that the site’s
    action was blocked – clicking the Preferences button on the top right gives you
    an “Allow popups for this site” option, which allows you to selectively trust
    sites.


    # Hidden configuration options


    Are you the kind of person who loves to fiddle with things just to see what happens?
    If so, Firefox will provide hours of tweaking through its special about:config
    configuration screen. All the major user-facing options for Firefox can be changed
    using the Preferences dialog, but if you type about:config into the Location bar
    you’ll see a huge list of Firefox options, many of which can’t be set in the preferences
    dialog because most people don’t care about them. For example, HTTP pipelining
    is a technology that can dramatically boost the speed that web pages download,
    but is traditionally left disabled by many web browsers because a tiny minority
    of web servers have issues with it – and by ‘tiny’ we mean ‘we can almost guarantee
    you will never find one’. Using about:config, you can enable HTTP pipelining and
    enjoy a free speed boost!


    In fact, there are lots of settings like this that you might want to change:


    | Setting | Set it to this | What it does |

    |---|---|---|

    | browser.startup.page | 3 | When you open Firefox, it will pick up where you
    left off |

    | browser.tabs.tabMinWidth | 75 | Allows Firefox to make tabs smaller when you
    have lots of them open, rather than making you scroll around to find them. |

    | browser.urlbar.autoFill | true | Forces Firefox to auto-complete URLs from your
    history as you type them, rather than having to push Down to select one. |

    | browser.urlbar.hideGoButton | true | Hides the green arrow at the end of the
    Location bar – let’s face it, no one uses it! |

    | layout.spellcheckDefault | 2 | Forces Firefox to spellcheck text in single-line
    text boxes as well as multi-line text boxes. |

    | network.http.max-persistent-connections-per-server | 4 | Allows your client
    to connect to the same server multiple times for maximum performance. |

    | network.http.pipelining | true | Enables multiple files to be sent down one
    HTTP connection. |'
