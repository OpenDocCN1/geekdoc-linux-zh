  md: '# Look and feel


    Part of the fun of using a computer is making it work just as you want it to –
    whether that means neutral earth tones or garish neon pinks...


    How do you feel about brown? Doubtless you’ll have noticed by now that Ubuntu
    has discovered more shades of brown than Dulux, going from dark chocolate through
    to creamy orange, and if you like this sort of thing, then this is the sort of
    thing you’ll thing you’ll like. Fair point? Well, yes, but don’t worry: if the
    brown looks a little too drab for your tastes, it’s easy to change – and while
    changing that, we’ll also show you how to change all sorts of other things to
    get Linux your way.


    # Bye-bye, brown!


    Choose System > Preferences > Appearance, and a new window will appear that lets
    you customise the theme, background, fonts and more all from one place. The Theme
    tab is the best place to start, because your ‘Theme controls lots of things –
    how buttons, scrollbars and such (these are known as ‘controls’) are drawn, what
    colours are used for windows and other objects, how the window is drawn (the colouring
    as well as the buttons used for minimising, maximising and closing), and which
    icons are used for folders and other things on your filesystem. There are several
    theme packs installed for you, and choosing any one of them will set all the theme
    options at once so that they go together nicely. The default theme is known as
    Human, but a popular alternative is called Clearlooks – click on it to give it
    a try. As soon as you click any theme, it will take effect, so if you find you
    don’t like it, just click back to Human to revert to the original settings.


    If you find you like some bits of one theme and some bits of another, you need
    to click on the Customise button. This lets


    # Sounds right


    Apart from the rather grating default login and logout sounds, the default Linux
    desktop is a pretty quiet affair – but it doesn’t have to be! You can add sounds
    to message boxes, button clicks, menu items and more, all from the Sound Preferences
    window under System > Preferences > Sound. The other cool thing under this dialog
    is the System Beep tab, because here you can enable the Visual System Beep. If
    you’re working in a quiet environment (or generally prefer having your system
    sounds turned off), the visual system beep option means that a window will flash
    if it needs your attention or if you try to do something that the program can’t
    do.


    you take one theme as a base, then change individual parts of it to suit your
    own tastes. So if you like the Human colours but prefer the Clearlooks icons,
    just start with Human, click on Customise, then choose the Clearlooks icons from
    the list of available icon types. We think you’ll agree that it’s very easy to
    make Linux look just how you want it to!


    # Background and screensaver


    If you’ve gone with a non-brown theme, you may find that Ubuntu’s default brown
    wallpaper suddenly starts to clash quite badly. Fortunately, it couldn’t be easier
    to change your desktop background to something a bit nicer. To do this, either
    right-click on the desktop and choose Change Desktop Background, or you can go
    to System > Preferences >


    Along with themes, backgrounds and screensavers, you can also enable Ubuntu’s
    visual effects system for some seriously cool-looking graphics – see page 68 for
    more information.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_15_0.png)'
