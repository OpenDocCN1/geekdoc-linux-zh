  md: '# Linux desktop


    # Your filesystem


    Ready to delve right into the core of your new Linux system? The Nautilus file
    explorer is here to help!


    Nautilus is the Linux equivalent of Explorer on Windows or Finder on Mac OS X
    – it lets you browse your filesystem, create new files and directories, and work
    with all your files. Before you jump in, first you need to know a little bit about
    how the Linux filesystem is laid out:


    +   - The root of the filesystem (the equivalent of C:\ on Windows) is called
    /. All files, folders and devices come off that /.

    +   - Normal user programs are in /bin and /usr/bin.

    +   - Administrator programs are in /sbin and /usr/sbin.

    +   - Software settings live in /etc.

    +   - Log files are stored in /var/log.

    +   - System devices are represented as files in /dev (you can usually ignore
    these!).

    +   - User home directories are in /home.

    +   - Your desktop is actually a subdirectory of your home directory. eg /home/bob/Desktop.

    +   - Most users can only write files to their home directory – this is what makes
    Linux so secure!


    Your home directory is the best place to start, as that''s where you''ll be storing
    your files, and the easiest way to bring it up in Nautilus is to use the Places
    menu. Each of the shortcuts in the Places menu will launch in Nautilus, so click
    the first one: Home Folder.


    # Navigating around


    The default Nautilus window is split into three parts: along the top are the menu
    and toolbars; along the left is the task pane, and the rest of the window is there
    to show the list of files and folders in the current location. You probably won''t
    use the menu bar too much, so instead focus on the two toolbars: one contains
    Back, Forward, Up, Stop and Refresh buttons, just like a web browser – and they
    work just like a web browser too, meaning that you can navigate between your most
    commonly used folders using just these buttons. The Home and Computer toolbar
    buttons are quick links, with the former bringing you back to where you are now
    and the latter taking you to a Windows ''My Computer''-style location, from where
    you can navigate to your hard drive or any devices attached to your computer.


    # Get to know the Nautilus file browser


    These buttons work in just the same way as the web browsers they’re inherited
    from – use Back and Forward to navigate to previous directories, and Up to go
    to the parent directory.


    This location bar provides little ''breadcrumbs'' leading from your current location
    to the root of the filesystem – click any of the buttons to move to that directory.


    These buttons adjust the magnification level – a higher zoom means more detail
    will be shown about files.


    Click on this button to bring up the path as editable text that you can easily
    modify.


    This is the task pane, currently set to the Places view so that it’s easy to navigate
    to all the most important places on my filesystem.


    All the files and folders held by the current directory will be shown here, along
    with some summary information in the bottom-left corner of the window.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_19_0.png)'
