    Of course, the problem with this is that sometimes you leave a user logged in,
    then wonder why things are going a bit slow for your own programs – chances are
    that other user has left something running in the background that''s chewing up
    a lot of CPU time! If you find this happens to you, go to System > Administration
    > System Monitor, and choose the Processes tab. By default this shows the programs
    you are running, but if you go to View > Active Processes, it will only show you
    the programs that are running right now. For example, if you find out that one
    user is running a particularly large program that''s taking up too much CPU time,
    you can kill that program by selecting it and choosing End Process. Easy!


    If any of your users needs helping logging in, just enable the accessible login
    option.


    # Login preferences


    The Login Window Preferences dialog can also be used to enable and configure remote
    login, which is where another Linux computer can graphically log into your machine
    and


