- pgno: 49
  md: '# Working with photos


    # Work with photos


    Now that cameras are cheaper than ever, we’ve all become photographers. Linux
    is the perfect partner, but first you need to get your photos on to your machine.


    +   Learn how to:

    +   - Import your photos

    +   - Manage your collection

    +   - Edit and process images

    +   - Join panorama shots

    +   - Sharing your photos

    +   - Advance to the Gimp


    You might think that an entire section dedicated to the delicate art of working
    with photos is a little ambitious. But it’s not. Digital photography is booming,
    and Linux is a great choice for working with photos. From sending a few images
    with an email or printing a birthday card with your favourite photo, to touching
    up professional images and creating websites, Linux is a more than up to the task.
    Thanks to apps like Gimp and F-Spot (application names aren’t Linux’s strong point),
    you don’t need to be an expert either. Using a few simple tools, you’ll soon be
    able to import photos from your camera, send them to the printers and process
    them to remove red eye and blemishes.


    # Step by step: Get photos off your camera


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_49_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_49_1.png)


    1 Plug and play Digital camera support in Linux is excellent. This means you will
    be able to simply connect the vast majority of cameras to your machine to access
    your photos. Nearly all will use a USB connection, with a small plug on one end
    (known as mini USB) and a larger one on the other that connects to a USB port
    on your PC. As soon as you’ve made the connection, both your Linux desktop and
    the camera should spring into life. If all has gone well, a small window will
    appear to tell you that your camera has been detected. Click on ‘Import’ to launch
    the ‘Import Photos’ window.


    2 Importing photos Depending on how much space you have on your camera, you might
    not always want to import every image. This window lets you pick and choose the
    images that you want to import. To select photos individually, hold down the left
    Ctrl key and click on the thumbnails of the images you want to import. You can
    also press Ctrl and A together to select everything. When you’re happy with your
    selection, give this collection a name in the ‘Film’ field. You should also click
    on the small button to the right of the ‘Categories’ field. From here you can
    add ‘tags’ to your images, making them much easier to search through when your
    collection grows.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_49_2.png)


    3 View as thumbnails Depending on the number of photos you’re importing and the
    speed of your USB connection, you may need to wait a few minutes for your photos
    to copy over to your machine. When this has completed, your photos will be displayed
    in a program called GThumb. GThumb is Ubuntu’s default photo browser, and you
    should be able to see your entire album as a series of thumbnails. Double-clicking
    on any of these will open a single window containing the image, and you can skip
    from one photo to another using the Page Up and Page Down keys. Photos are saved
    into the Pictures directory, which you can open directly from the ‘Places’ menu.
    Each folder will be given the name of the roll you used when you imported the
    photos, and it’s easy to copy the photos from these folders on to a USB stick,
    or even on to a blank CD – just click on CD/DVD creator from the same Places menu,
    and drag the albums you want to burn into the new window, insert a blank disc
    and click on ‘Write To Disc’.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Working with photos


    # Collection management


    Don''t get bogged down in photos – get yourself organised!


    # Quick tip


    You can import your photos into F-Spot without going through GThumb first. Connect
    your camera, and select ''Import'' from F-Spot''s File menu. Click on the ''Select
    Folder'' icon, and you will see your camera in the drop-down list. Choose this,
    and you''ll be able to add your photos directly.


    # Step by step: Organise a large collection


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_50_0.png)


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_50_1.png)


    1 F-Spot There''s nothing wrong with GThumb but it just so happens that there''s
    a better application in Ubuntu for managing your photos. It''s called F-Spot and
    it''s better suited to larger collections. This is because you can organise your
    photos into albums, send them to the printers, or export them as a website from
    within a single application. F-Spot can be started from the Applications > Graphics
    menu, and the first window you see will ask you for the location of any photos
    you might already have. If you''ve just imported photos from your camera, click
    twice on the ''Select Folder'' button. This will open another window from where
    you can point F-Spot at the folder that contains your images. You should then
    click on the ''Pictures'' folder and click on ''Open''. F-Spot will now scan the
    folder for your images, showing the results as thumbnails in the main few. When
    this has completed, click on ''Import'' to add them to F-Spot. If you need to
    find your photos in the filesystem, F-Spot uses Photos by default (this is a different
    location to the one used by GThumb) but this can be changed from the Preferences
    window.


    2 Comments The first thing you might want to do is add comments for the photos
    you''ve just imported. Comments are the 21st century equivalent of writing on
    the back of the photo, and while it may seem slightly tedious to begin with, you''ll
    soon be grateful you took the time to write a line or two about what''s going
    on in the photo. To add a comment, double-click on the thumbnail to open the photo,
    and use the ''Comment'' field just below the main window. You can quickly skip
    through the album using the cursor keys, adding a comment to each new image. Comments
    like these are attached directly to the photo, so you don''t need to worry about
    saving your changes to a file. Similarly, you can add tags by dragging their icons
    from the left-hand panel on to the photos you want to label. Right-click in the
    label panel to create your own, and don''t forget your photos can have more than
    one comment!


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_50_2.png)


    3 Organising If you''ve ever used Apple''s iPhoto, you''ll feel right at home
    with the way F-Spot manages photos. By default, every image in your collection
    is listed in the large thumbnail view. A date strip at the top of the window draws
    small bars that represent the number of photos you have from a certain time frame,
    and you can scroll through the time frame by dragging the cursor across the date
    strip. The key to organising your collection in F-Spot is the tag system. At any
    point, you can double-click on the icon in the tag panel to filter your collection
    into photos that only have that tag marked against them. This makes it easy to
    see all photos of your family, for example, or those you''ve taken on holiday.
    As long as you''ve gone to the trouble of tagging your photos as you import them,
    this added tag dimension makes your collection much easier to manage. If you double-click
    on a tag, you can change the icon it uses. Tags also have a hierarchy where they
    inherit the same tag as their parent – for example, you might want to create a
    Family tag and make the ''People'' tag its parent. You will then see Family photos
    whenever you click on either the ''People'' tag (as Family is a member of this
    group), or the ''Family'' tag.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Working with photos


    # Image processing


    It''s great fun to mess around with your images after you''ve taken them...


    # Quick tip


    If you make a mistake and want to revert to the original image, you can select
    the photo and click on File > Version > Original. You can also make your own versions
    of snapshots (for editing later, for example) by clicking on File > Create New
    Version.


    # Step by step: Basic image editing


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_51_0.png)


    # 1 Crop and rotate


    Two of the more common problems with photos can be easily solved with F-Spot.
    The first is the need to crop an image, cutting the edges around a photo to make
    some detail larger. In F-Spot, double-click on the image you want to edit so that
    it now occupies the whole window. Now use the mouse to drag a selection square
    across the image that includes the area of the photo you want to keep. You might
    have noticed a small toolbar at the bottom – we need the one that looks a little
    like a scalpel. Clicking on this will remove everything in the image except the
    area you selected. If you need to straighten up your photo, you can use another
    icon on the toolbar – the one that looks like a red arrow coming out of an envelope.
    Click on this and a smaller window appears with a single draggable slider. This
    slider changes the angle of the image, which will update in real time as you drag
    it from one side to the other. When you''re happy with the new angle, click on
    Apply to make the change permanent.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_51_1.png)


    # 2 Colour adjustment


    Compensating for under or over exposed photographs taken in less than ideal conditions
    can be complicated. But there are a few simple adjustments you can make that can
    make a world of difference, and these can be accomplished from the ''Adjust Colour''
    window. Open the Adjust Colour window from the Edit Image view, either from the
    Edit menu or by clicking on the three colour circles in the toolbar. The array
    of sliders laid out beneath a colourful histogram may look technical, but it''s
    really quite straightforward. The histogram is a graph that illustrates the dynamic
    range of each colour within the image. For best results, your image''s histogram
    should touch all four sides of this window, maximising the dynamic range of the
    image. Increase the contrast slightly, and you''ll see your image become more
    polarised, and the histogram stretches slightly. If your image is a little dull,
    try adding more saturation, and if it was taken under electric light, you can
    correct an artificial hue by altering the ''Temp'' and ''Tint'' sliders.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_51_2.png)


    # 3 Red eye


    Red eye is the blight of many flash photographs involving people. It''s caused
    by the flash being too close to the lens, and the light from the flash is reflected
    directly off the retina back into the lens. The red colour is a result of the
    light being filtered by a blood-rich part of the inner eye, and while this often
    adds a demonic appearance to the photo, the saturated red colour helps to make
    the red eye effect easy to remove. F-Spot even has a built in function. In the
    Image Edit window, use the mouse to select the area directly around the eye (this
    is so that other areas of red within the photograph aren''t processed). With the
    area selected, click on the ''Red Eye Removal'' button in the toolbar. This looks
    something like a blue arrow hitting a red circle. The result should be that the
    redness in the eye dissolves, leaving a far less supernatural pose. You can repeat
    the process to remove more and more of the red colour. If this isn''t successful,
    or the process leaves too many side effects, then you''ll have to use a more serious
    image editing tool, such as Gimp.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Working with photos


    # Join panoramic photos


    Stitch a sweeping view together to create a large panoramic view from multiple


    Many digital cameras come with a panorama function. This is normally used to take
    several panoramic shots of the horizon, sweeping the camera from left to right,
    for example. With panoramic mode enabled, each photo will have the same image
    settings, making it easier to stitch each one together again on a computer. Many
    cameras even come with software to help, but stitching the images together can
    still be an arduous process. You need to find sections of each adjoining image
    that are common to both before lining them up manually and moving on to the next
    image. Over the last year or two, the software that can help find these points
    within an image has improved dramatically, making the process almost automatic.
    Hugin is one of those pieces of software. It''s so successful at attaching panoramic
    images together, that the process has become largely automatic.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_52_0.png)


    You can choose to edit the anchor points manually if you wish, but most of the
    time Hugin''s automatic settings can''t be beaten.


    view from the first image. This can normally be extracted from the metadata that
    your camera embeds in the photo, but if Hugin can''t find the data, you''ll need
    to enter it manually. Don''t worry. For most cameras, just enter a number for
    the focal length multiplier that brings the HFOV to somewhere around 50 degrees.
    After this, a text window will appear, and Hugin will begin processing each image
    to see if it can find any anchor points to pinpoint the same location in two or
    more images. Depending on the complexity, size and number of images, this could
    take anything from a few seconds to a few minutes.


    # Hugin quickstart


    Hugin is launched from the Applications > Graphics menu, and uses a wizard-based
    interface to step you through the stitching process. The first step is to click
    on the ''Load Images'' button. This will open a file requester, from which you
    will need to select every photo that''s part of the panorama. Don''t worry about
    the order – Hugin can work this out for itself. After you''ve clicked on ''Open'',
    Hugin will try to determine the field of


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_52_1.png)


    Hugin''s preview window lets you make a few changes and check that the alignment
    is correct.


    # Stitch that


    When the analysis has completed, Hugin will display a rough approximation of what
    it''s calculated the panorama to be. This is nearly always correct, but you can
    edit the centre point of the image as well as flatten the horizon using the buttons
    in the toolbar. Clicking on ''Auto'' will update the display with your changes.
    The sliders at the bottom and side of the image will crop the edges, removing
    the distortion introduced as Hugin flattens the effect of the camera lens on each
    shot.


    If you close the preview window, you can see that the main Hugin interface is
    now full of useful information derived from the analysis. Click on the Control
    Points icon, for instance, and you can see exactly which features in each image
    Hugin is using to anchor one image to the next. If there are any errors, you can
    drag and move any of these points manually. When you''ve finished messing around,
    you need to generate the final image. Open the ''Stitcher'' tab, and click on
    ''Stitch Now'', a file requester will open asking where you''d like to save the
    final photo. Like the analysis, the stitching can take some time running through
    a progress bar before opening another text window. But when it''s finished, you''ll
    find yourself with a perfect rendering of the stitched panorama.


    Quick tip


    Hugin can also be used to alter and remove perspective from photos – perfect for
    cityscapes and buildings.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_52_2.png)


    The end result is a seamless panorama.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Working with photos


    # Sharing your photos


    Now that you''ve got your photos organised and edited, it''s time to share them.


    There''s no point going to all this trouble with your photo collection if you''re
    never going to let other people see them. And in the age of the internet, that
    means sharing your photos with people online. There are as many different methods
    for uploading as there are websites, from sharing a few images privately with
    family and friends, to turning your camera lens into a window on your life for
    the whole internet to see – it''s up to you.


    F-Spot, the application we''ve been using for managing and editing our photos,
    can export your images to many of the more popular photo websites, as well as
    your own if you run one. You can see which sites are supported by opening the
    File > Export menu. The list includes names like Flickr, Picasa Web Albums and
    SmugMug. Each of these is an online photo repository. The first two offer a free
    hosting service for your own photos, while all three offer commercial packages
    that are tuned for the more serious photographer. If you want an informal, easy-to-use
    online photo presence, then choosing one of these options is likely to be the
    best option. You can choose to keep photos private, share them with your friends
    or family, as well as making them publicly visible.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_53_0.png)


    Many internet providers give you web space as part of an online package, and you
    can use this to host your web albums.


    windows for both Google Picasa and SmugMug, you need to click on the green ''+''
    symbol in the Export window and add your username and password for the remote
    site. These details will be remembered by F-Spot so that you don''t need to enter
    them again.


    But before you export any images, it''s worth spending some time writing comments
    for them and giving them titles. All this information is used by the online hosting
    site. Flickr will even use any tags you''ve assigned to the image, making a search
    your own photos (and anyone else''s) much easier. Any photos you select will be
    exported, and you can select individual thumbnails by holding down the Ctrl key.
    If none are selected, all the photos in the current view or album will be included
    by default. After choosing your export profile, you may want to resize the images
    before they''re uploaded. Both the free user accounts on Flickr and Picasa place
    a restriction on the size of the images you upload, and restricting your exported
    images to a resolution such as 1024x768 is a great way to get extra space. This
    is big enough for most web users, and small enough that the file size isn''t prohibitively
    large. To enable this feature, make sure Resize is enabled, and set the size to
    1024 pixels – this will be the scaled length of the longest side.


    # Flickr, Picasa and SmugMug


    Each service works in roughly the same way. The first step is to create an account
    with the host of your choice. This account information is needed by F-Spot so
    that it can automatically communicate with the remote site while sending your
    photos. With Flickr, for example, when you select the export module from F-Spot,
    you need to click on the large Authorise button. This will load the Flickr site
    into a web browser, and from here you''ll need to log in to your Flickr account,
    before heading back to F-Spot and clicking on the Continue Authorisation button.
    This will then update both Flickr and F-Spot with the details they need to talk
    to one another. With the export


    You can export your photos directly from F-Spot to many of the more popular online
    photo repositories.


    ![](img/afd38ba98c33e56aa8435c9f1db6bed0_53_1.png)


    # Host your own


    If you''d rather not be limited by the hosting company, you might want to consider
    hosting your own photos. This obviously requires a little more technical ability,
    but exporting an album is still an easy task. If you''ve got your own web space
    and you''re using the PHP application Gallery, F-Spot can export images and create
    the necessary web pages automatically. For this option, select ''Export To Web
    Gallery'' from the Export menu. In the window that appears, press the large Add
    button and enter the details for your website, including the full URL, a username
    and password. F-Spot will then create a new album each time you export your images.
    If you''d rather do things by hand, you can also export an HTML'
