    # Add-ons


    Without a doubt, add-ons are the most impressive thing about Firefox, because
    it has been designed to be open to its very core – the add-ons that people create
    can modify any part of the browser, and there are some incredibly powerful ones
    around.


    To help get you started, here''s our list of the best add-ons out there. But be
    warned: you should only install these from the Firefox homepage, because the fact
    that the add-ons can modify Firefox means that it''s possible to install malicious
    add-ons if you don''t get them from a trusted source. Firefox does take this very
    seriously, so if you try to install an add-on from an untrusted source, expect
    to be warned again!


    To install an add-on, go to Tools > Add-Ons, then choose Get Extensions. Note
    that the ''Get Ubuntu Add-Ons'' link is very similar, but offers a much smaller
    selection of add-ons because it only allows you to install add-ons that Ubuntu
    supports, as opposed to everything available to Firefox users. When you''re on
    the Firefox Add-Ons site, you can search for add-ons by name, then click on the
    Add To Firefox button to install the ones that interest you. Before the add-on
    is installed, you''ll be asked to confirm you want it – just click Install Now,
    then restart Firefox when installation has finished so that the add-on can be
    initialised.


