- fmt: "\n# 1. Text manipulation\n\nAs we have seen before, almost everything in Linux\
    \ is a file, text files to be precise. A good example is that all the configuration\
    \ files in Linux are text files. For one to carry out a reconfiguration of an\
    \ application in Linux, all they need to do is open the configuration file, modify\
    \ the text, re-save, and then restart the application, and just like that, the\
    \ reconfiguration will be applied. Manipulation of text becomes of essence in\
    \ managing Linux applications given the numerous text files. Let us look at a\
    \ number of commands and techniques that are used to manipulating texts in Linux.\
    \ I am going to use files from Snort for demonstration purposes.\n\n## Step 1:\
    \ Cat Command\n`cat` is the most basic text display command. Let us `cat` the\
    \ Snort config file that is normally found in `/etc/snort`.\n\n```bash\nkali >\
    \ cat /etc/snort/snort.conf\n```\nFrom above, you can see that `snort.conf` is\
    \ displayed on our screen until it comes to the end of the file. Definitely, that\
    \ is not a convenient method to work with the file.\n\n## Step 2: Use the Head\
    \ Command\nWe can use the `head` command supposing we just want to view the beginning\
    \ of a file. By default, this command displays a files’ beginning 10 lines.\n\n\
    ```bash\nkali > head /etc/snort/snort.conf\n```\nIn cases where we want to view\
    \ more or fewer lines, we can use the `-` switch between the command and the file\
    \ name.\n\n```bash\nkali > head -15 /etc/snort/snort.conf\n```\nHere, only the\
    \ first 15 lines of `snort.conf` will be displayed.\n\n## Step 3: Tail Command\n\
    Just like the `head` command, we can see the last lines of a file by using this\
    \ command. The syntax of the command is as below:\n\n```bash\nkali > tail -20\
    \ /etc/snort/snort.conf\n```\n\n## Step 4: Numbering The Lines\nWith long files,\
    \ it may be desirable to display them with line numbers. `snort.conf`, for instance,\
    \ has over 600 lines. Numbering makes it a lot easier for referencing changes,\
    \ and also, it is easy to come back to the same place within a file. To show a\
    \ file with a line number, we type:\n\n```bash\nkali > nl /etc/snort/snort.conf\n\
    ```\nEach line will now have a number making referencing much easier.\n\n## Step\
    \ 5: Grep Command\n`grep` is a filtering command, that is, it gives us a chance\
    \ to filter the content of a file for display. `grep` is an essential and powerful\
    \ command for working in Linux since it can minimize wastage of time spent in\
    \ searching for every occurrence of a word or command.\n\n## Step 6: Sed Command\n\
    This command enables us to look up for occurrences of a word or text pattern and\
    \ then work on it. The name is a contraction of two words, stream and editor.\
    \ Simply put, `sed` works in the same way as the find and replace function in\
    \ Windows.\n\n## Step 7: Less and More Commands\nLike we have previously said,\
    \ `cat` is a good utility command. However, it has a number of shortcomings where\
    \ the display of large files is involved. Remember us saying `cat` is not very\
    \ convenient?\n\n`more` came first and is the utility that manual pages use. Let's\
    \ open `snort.conf` with `more` command.\n\n```bash\nkali > more /etc/snort/snort.conf\n\
    ```\nYou will see that `more` displays only the first page and displays for us\
    \ in the lower-left corner how much of the file is being shown. `less` is similar\
    \ to `more`, although it possesses some additional functionality. To open `snort.conf`\
    \ with `less`, type the following:\n\n```bash\nkali > less /etc/snort/snort.conf\n\
    ```\nYou will see near the bottom left of the screen that `less` has highlighted\
    \ the path to the file.\n\n# 2. Bash Scripting\n\nA bash script can be described\
    \ as a file consisting of plain text having a sequence of commands. The commands\
    \ include those that we can type normally into the command line on our own and\
    \ those we we generally wouldn't type. Take note of this: Any command that is\
    \ able to be executed normally from the Kali Linux terminal may be placed in the\
    \ bash script. The reverse is also true. Nothing needs changing. The commands\
    \ just need to be typed normally, and they will behave as they are supposed to.\
    \ Let me put it this way, suppose you are familiar with the Kali command line,\
    \ you will be able to carry out bash scripting as they are almost similar. Normally,\
    \ an extension of `.sh` is affixed to all the scripts in Bash. This is, however,\
    \ not necessary as the Linux system is extensionless. A script can just work fine\
    \ without this feature.\n\n### How do these scripts work?\nIf you have been interacting\
    \ with computers generally, you appreciate that we have things we call programs\
    \ and others that we call processes. We all agree that a program comprises a sequence\
    \ of instructions made for the computer's central processing unit combined into\
    \ a package and usually stored on the computers’ hard disk.\n\nWhen a program\
    \ runs, what is actually running is its copy. This copy is referred to as a process.\
    \ What is being done here is that the instructions alongside other relevant resources\
    \ are being copied to the RAM (that is the working memory) form the hard disk.\
    \ Also, temporary storage space in the RAM is allocated for temporary data and\
    \ flags which will be used by the operating system to track and manage the process\
    \ as it executes. Ideally, a process is a running instance of a program.\n\nIn\
    \ normal circumstances, we have several processes that represent a single program\
    \ running in the computers’ memory all at the same time. Upon their completion,\
    \ the system will destroy them so that we will not have any more processes for\
    \ the program. At the terminal, we will be having a running Bash process to provide\
    \ us the Bash shell.\n\n### How does the bash script run?\nThis is quite easy.\
    \ First, running a script is also known as executing a script. We have to set\
    \ permissions to execute scripts. These permissions for safety reasons are by\
    \ default, not set. Skipping this step will only display an error message but\
    \ the code can still run. Let’s look at a sample script below.\n\n```bash\n1.#!/bin/bash\n\
    2.# This is an example of a Bash script, by Sutherland\n3.4. echo Welcome to Kali\
    \ Linux!\n```\n\nWe are going to expound a little bit on what is going on here\
    \ below:\n\n*   Line no. 1 – That as what we call the shebang. \n*   Line no.\
    \ 2 - This is a comment. Anything after `#` is not executed.\n*   Line no. 4 -\
    \ Is the command `echo` which will print a message to the screen. On Line no.\
    \ 2, you will see that it is highlighted. Highlighting the syntax only serves\
    \ to make it easy to read. You probably do not need it in your own files.\n\n\
    ### What is the use of ./\nFor normal commands, all we need to do is type the\
    \ name and voila! It starts to execute. To run a bash script, we place `./` in\
    \ front of it. Bash will attempt to find the name you have typed on the command\
    \ line without `./` in directories that are located in a variable called `$PATH`.\
    \ Separation of the directories is done using `\" : \"` This script will perform\
    \ a search in those particular directories and will not look at your current directory\
    \ or other subdirectories. Bash will run the first instance of the script or program\
    \ that it finds after searching the directories mentioned above. It is prudent\
    \ to note that the `$PATH` variable varies with each individual user and they\
    \ can set it up to their preference. Below are the reasons that this is done:\n\
    \n1. This way, we can install a number of different versions of a particular program.\
    \ We are also able to determine which of them gets executed depending on their\
    \ location in `$PATH`.\n2. It offers unprecedented convenience. From the lengthy\
    \ explanation above, the `bin` directory is found on the home directory. A user\
    \ is in a position to place their own programs and installed scripts in there.\
    \ A user is also able to utilize them regardless of their location within the\
    \ system just by doing a simple name typing.\n3. The overall safety is increased\
    \ – look at this, a malicious user may make a script intended to delete everything\
    \ from the home directory. It is in your best interest not to execute that script.\
    \ As long as the script is not in your `$PATH`, no problems will arise.\n"
