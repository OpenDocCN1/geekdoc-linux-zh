  trans: "\n\n- 用于应用层中发现数据的加密。\n- 保护在互联网上传输数据的路由器。\n- `IPsec` 为我们提供身份验证，但不进行任何加密。\n\
    - 它通过使用 `IPsec` 隧道创建电路来保护网络数据。其工作原理与虚拟专用网络（VPN）相同。\n\n## IP 安全组件\n\n以下是构成 `IPsec`\
    \ 的组件：\n\n1. 互联网密钥交换 (`IKE`) – 这是一种用于网络安全的协议，旨在动态交换加密密钥并绕过两个设备之间的安全关联 (`SA`)。`SA`\
    \ 用于建立任何两个网络元素之间共享的安全属性。这些属性是支持安全通信的基础。此外，`IKE` 为消息内容提供保护，以及一个用于实现标准算法（例如 `MD5`\
    \ 和 `SHA`）的开放帧。\n\n2. 封装安全载荷 (`ESP`) – 用于确保数据完整性、身份验证、防重放和加密。`ESP` 还负责载荷身份验证。\n\
    \n3. 身份验证头 (`AH`) – `IPsec` 使用身份验证头来确保数据完整性、防重放和身份验证。然而，身份验证头不提供加密。防重放功能用于防止未经授权的数据包传输，但它不会保持数据的机密性。\n\
    \n## IP 安全的操作\n\n1. 首先，主机将检查数据包是否需要使用 `IPsec` 发送。数据包的流量本身会触发安全策略。\n2. 互联网密钥交换阶段从两个使用\
    \ `IPsec` 的主机相互进行身份验证开始。这将启动一个安全通道。在这里，我们有两种模式：\n    - 主模式（Main mode），用于提供更高的安全性；\n\
    \    - 激进模式（Aggressive mode），使主机能够快速创建 `IPsec` 电路。\n3. 使用上述通道（在第 2 步中建立），对 `IP`\
    \ 电路如何跨电路加密数据的方式进行协商。\n4. 之后，在协商好的安全通道上进行阶段 2 互联网密钥交换。\n5. 交换的数据将通过新建立的 `IPsec`\
    \ 加密隧道进行传输。主机通过 `IPsec` `SAs` 对数据包进行加密和解密。\n6. 通信完成后或主机之间的会话超时，`IPsec` 隧道将终止。两个主机都会丢弃密钥。\n\
    \n## 第 5 章：社会工程学\n\n社会工程学日益成为虚拟实体的主要威胁，并且正成为攻击信息系统的有效向量。今天使用的大多数服务都为复杂的社会工程攻击奠定了良好基础。在全球每个主要机构中，趋势都是在工作场所、学校和社交场所自带设备（BYOD）。这似乎是私有或业务环境中实现通信与协作的有效方法。这项政策将这一问题恶化到了可怕的程度。\n\
    \n全球组织不再根据地理位置配置人员，而是采用即时策略来满足其人员需求。因此，我们看到面对互动在减少，因为它被许多弥补通信鸿沟的工具所取代。这些工具可以是电子邮件、`Skype`\
    \ 等。所有这一切为社会工程学攻击导致了新的攻击向量。当社会工程学攻击与零日漏洞相结合时，它们具有成为致命武器的潜力。这种机制是 `APTs`（即高级持续性威胁）常用的机制。\n\
    \n### 什么是社会工程学？\n\n我们将社会工程学定义为一系列通过人类交互完成的具有恶意性质的广泛活动。这种攻击利用心理操纵，目的是欺骗用户提供敏感信息或犯与安全相关的错误。通常，社会工程攻击分多个步骤进行。\n\
    \n如往常一样，犯罪者最初会对目标害者进行侦察，以便收集其背景的必要信息。这些背景信息可能包括对潜在切入点和弱安全协议的识别。这一步至关重要，因为它决定了攻击如何进行。随后，攻击者将迅速行动赢得受害者的信任，并为违反既定安全规范的后续操作提供有吸引力的激励，例如暴露敏感信息或授予关键资源的访问权限。这些攻击是致命的，因为它们依赖于人类所犯的错误，而不是操作系统或软件的漏洞。人为的错误具有不可预测性较低的特征，因此与基于恶意软件的入侵相比，这些错误难以被定位和防御。\n\
    \n### 社会工程学使用的攻击技术\n\n这类攻击可以有多种不同的形式。只要涉及人类交互，就可以进行社会工程学攻击。让我们来看以下五常见的社会工程学攻击。\n\
    \n#### 假托法（Pretexting）\n\n攻击者试图通过一系列精心设计的谎言获取信息的访问权限。大多数情况下，假托法由犯罪者假装他们需要从毫无防备的受害者那里获取某些关键信息以执行至关重要的任务。攻击者通过冒充警察、银行官员、税务官员、同事或任何具有知情权的人员来建立或赢得受害者的信任。然后，假托者会提出需要用户确认其身份的问题。通过这种方式，攻击者能够收集关键个人数据。\n\
    \n####  网络钓鱼（Phishing）\n\n流行的钓鱼诈以短信和电子邮件活动的形式出现，旨在营造好奇心、紧迫感，甚至在潜在受害者心中植入恐惧。随后，受害者被诱导披露被认为敏感的信息，或者通过点击链接访问恶意网站，或者通过下载并打开包含恶意软件的未知附件。例如，特定在线服务的用户可能会收到一封电子邮件，提醒他们违反了某项政策，需要他们采取行动。此类操作的示例是更改密码。点击链接后，用户将被重定向到一个非法网站，该网站在每个方面都与合法网站几乎相同，促使毫无防备的用户向该网站输入其凭据。一旦提交表单，信息就会发送给攻击者。\n\
    \n#### 诱饵法（Baiting）\n\n这种攻击利用虚假承诺来利用受害者的好奇心或贪婪（主要是贪婪）。用户被诱入陷阱，导致个人信息被盗取。此外，恶意软件也可以这种方式发送到他们的系统中。最令人人厌的诱饵法是使用物理媒介传播恶意软件。例如，攻击者将诱饵（通常是受恶意软件感染的闪存盘）留在潜在受害者可能看到的地方。诱饵看起来很真实。毫无防备的受害者由于好奇而拿起了诱饵。随后，他们可能会将设备插入工作或家中的电脑中。这将导致恶意软件在系统上自动安装。\n\
    \n#### 恐吓软件（Scareware）\n\n"
