- fmt: "\n# Is penetration testing necessary?\n\nFirst and foremost, a penetration\
    \ test helps a given organization ascertain the effectiveness of the laid down\
    \ security protocols. The protocols can be operational, technical or of a physical\
    \ nature. A tester's job will be to determine whether these controls are up to\
    \ the task by trying to overcome them. A penetration tester will also be gauging\
    \ an organization's vulnerability to a specific threat. As a tester, the most\
    \ crucial role is to find out how an organizations' countermeasures are effective\
    \ and inform them about areas that need improvement. Also, an organization can\
    \ identify threats against itself, and it is up to the tester to validate or invalidate\
    \ the threats.\n\nOften, companies use penetration tests to bolster their image\
    \ to their target market. Here, a company can indicate that it was able to withstand\
    \ attacks, and as such, is secure and has a robust infrastructure. This testing\
    \ can also alert an organizations' management about a potential security threat\
    \ existing within its operations or systems. A penetration test that is well-executed\
    \ can uncover vulnerabilities systematically. The management can be unaware of\
    \ the existence of these vulnerabilities.\n\n## Types of Penetration Testing\n\
    \nThe first type examines the physical infrastructure of a subject. A tester can\
    \ exploit the physical security of an organization. In most cases, the problems\
    \ do not lie in the databases and other configurations, but the physical countermeasures\
    \ in place. Questions to ask here include: is there adequate access control? Does\
    \ the building housing the organization have security guards? Are they well trained?\
    \ Is checking of sensitive materials conducted when employees exit the building?\
    \ Are electronic devices registered and verified on the entry and exit of the\
    \ building? To answer these questions, a tester will attempt to walk into the\
    \ building at a time when people are arriving to work, say in the morning. Suppose\
    \ an intruder can gain access to a company's building without being checked, they\
    \ will be in a position to obtain the information they are after.\n\nThe second\
    \ type of penetration testing is concerned with the operational aspects of an\
    \ organization. Operational testing ascertains the effectiveness of laid down\
    \ procedures of operation in the organization through circumventing those procedures.\
    \ This is unlike physical testing, which only checks the physical access to networks,\
    \ facilities, or company computers.\n\nThe third and final type deals with electronic\
    \ testing. In this testing mechanism, a tester will attack a company's' networks,\
    \ communications facilities, or computer systems. Electronic testing can be accomplished\
    \ by using automated tools, or it can also be done manually. Here, the main objective\
    \ is to decipher vulnerabilities to an attack by way of communications facilities\
    \ and data networks that are being used by the subject under consideration.\n\n\
