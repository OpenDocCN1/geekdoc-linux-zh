    因此，这意味着网络扫描是攻击者收集信息时所需的关键步骤之一。


    ## 使用 `ifconfig` 进行网络扫描

    `ifconfig` 命令是用于检查和与活动网络接口交互的基本工具之一。你只需在终端中输入 `ifconfig` 即可查询你活跃的网络连接。


    ## 使用 `iwconfig` 扫描无线网络

    如果你有一个无线适配器，可以使用 `iwconfig` 命令来收集无线黑客所需的关键信息，例如适配器的 IP 地址、MAC 地址、其所处模式等。当你使用 `aircrack-ng`
    等无线黑客工具时，从该命令中获取的信息将尤为重要。


    ## 修改你的网络信息

    能够更改 IP 地址和其他网络信息是一项很有用的技能，因为这可以帮助你在访问其他网络的同时，表现为这些网络上的一个受信任设备。例如，在拒绝服务（DoS）攻击中，你可以伪造你的
    IP 地址，使攻击看起来像是来自另一个源，从而帮助你在取证分析期间规避 IP 追踪。在 Linux 中这是一项相对简单的任务，可以通过 `ifconfig`
    命令完成。


    ### 修改你的 IP 地址

    要更改 IP 地址，请输入 `ifconfig`，后面跟着你想要重新分配的接口以及想要分配给该接口的新 IP 地址。例如，将 IP 地址 `192.168.181.115`
    分配给接口 `eth0`，你需要输入：


    ```bash

    Kali >ifconfig eth0 192.168.181.115

    ```

    如果你操作正确，Linux 将返回命令行提示符且不输出任何内容。这是好事！然后，当你再次用 `ifconfig` 检查网络连接时，你应该看到 IP 地址已更改为你刚刚分配的新
    IP 地址。


    ### 修改你的网络掩码和广播地址

    你还可以使用 `ifconfig` 命令更改网络掩码（`netmask`）和广播地址。例如，如果你想为同一个 `eth0` 接口分配 `255.255.0.0`
    的网络掩码和 `192.168.1.255` 的广播地址，你需要输入内容：


    ```bash

    Kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    ```

    再次，如果你一切都做得正确，Linux 会响应并一个新的命令行提示符。现在再次输入 `ifconfig` 以验证每个参数是否已相应更改。


    ### 伪造你的 MAC 地址

    你也可以使用 `ifconfig` 更改 MAC 地址。MAC 地址是全球唯一的，通常被用作安全措施来防止黑客进入网络，或用于追踪他们。将 MAC 地址更改为伪造的另一个
    MAC 地址几乎是轻而易举的，并且消除这些安全措施。因此，它是绕过网络访问控制的一项有效技术。要伪造 MAC 地址，请使用 `ifconfig` 命令的 `down`
    选项关闭接口（在这种情况下为 `eth0`）。然后输入 `ifconfig` 命令，后接接口名称（`hw` 代表硬件，`ether` 代表以太网）和新的伪造
    MAC 地址。最后，使用 `up` 选项启用接口以使更改生效。


    ## IP 地址分配

    Linux 有一个动态主机配置协议（DHCP）服务器，它运行着一个守护进程（后台运行进程），称为 `dhcpd` 或 `dhcp` 守护进程。DHCP 服务器将对子网上的所有系统执行
    IP 地址分配。它还会记录在任何时刻哪个 IP 地址分配给了哪台机器。这使得取证分析师在攻击后追踪黑客的极佳资源。因此，理解 DHCP 服务器如何工作非常有用。通常，要从局域网连接互联网，必须拥有由
    DHCP 分配的 IP。因此，在设置静态 IP 地址后，必须返回并获取一个新的 DHCP 分配的 IP 地址。要做到这一点，你可以随时重启系统，但我将向你展示如何在关闭和重启系统的情况下检索新的
    DHCP。向 DHCP 请求 IP 地址，只需使用 `dhclient` 调用 DHCP 服务器，后接你想要分配地址的接口。不同的 Linux 发行版使用不同的
    DHCP 客户端。例如，Kali 基于 Debian，而 Debian 使用 `dhclient`。


    ## 操纵域名系统 (DNS)

    黑客可以在目标的域名系统（DNS）中找到关于该目标的宝库信息。DNS 是互联网的关键组件，尽管它的设计是将域名翻译为 IP 地址，但黑客可以利用它来获取有关目标的信息。


    ### 使用 `dig` 检查 DNS

    DNS 是将如 `google.com` 的域名转换为相应 IP 地址的服务。通过这种方式，你的系统知道如何找到它。如果没有 DNS，意味着我们需要记忆经常访问的网站所属的数千个
    IP 地址。`dig` 是任何有志黑客都需要了解的命令之一。它提供了一种收集有关目标域名 DNS 信息的方法。存储的 DNS 信息可以是攻击前获取的关键早期侦察信息之一。这些信息可能包括目标名称服务器的
    IP 地址（将目标名称翻译为 IP 地址的服务器）、目标邮件服务器，以及可能的任何子域名和 IP 地址。你还可以通过添加 `mx` 选项（`mx` 是邮件交换服务器的写）使用
    `dig` 命令获取连接到域名的邮件服务器信息。这些信息对于邮件系统的攻击至关重要。


    ### 修改你的 DNS 服务器

    在某些情况下，你可能想使用另一个 DNS 服务器。要实现这一点，你需要编辑系统上名为 `/etc/resolv.conf` 的纯文本文件。用文本编辑器打开该文件。然后，在命令行中输入编辑器的确切名称，后接文件路径和文件名。


    ## WiFi 网络

    首先，让我们看看 WiFi。在之前，这里有一个通常经常使用的各种 WiFi 安全协议的简要介绍。原始的线缆等隐私（WEP）存在严重缺陷且容易被破解。它的替代品
    WiFi 保护访问（WPA）安全性稍高。最后，WPA2PSK 更加安全，并使用所有用户共享的预共享密钥（PSK），现在被几乎所有的 WiFi AP 使用（企业级
    WiFi 除外）。


    ## 基础无线命令

    ### `ifconfig`

    在类 Unix 操作系统中执行网络接口配置需要 `ifconfig`。它是系统中找到的一项管理实用。`ifconfig` 具有用于配置、查询和控制 TCP/IP
    接口参数的实用程序。作为一种交互式工具，`ifconfig` 可用于显示并分析网络接口的设置。


    总结来说，`ifconfig` 执行以下操作：


    *   该命令允许查看网络设置

    *   启用和禁用网络接口

    *   网络接口 IP 地址分配

    *   为网络接口分配网络掩码

    *   为网络接口分配广播地址

    *   为网络接口分配 IP、网络掩码和广播地址

    *   更改网络接口的 MTU

    *   启用和禁用混杂模式（Promiscuous Mode）

    *   向网络接口添加和删除新的别名（Alias）

    *   更改网络接口的 MAC 地址


