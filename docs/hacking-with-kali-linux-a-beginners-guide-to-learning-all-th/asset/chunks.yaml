    # 5 Day of the week 0–7


    So, if we had written a script to scan the globe for vulnerable open ports and
    wanted it to run every night at 2:30 AM, Monday through Friday, we could schedule
    it in the `crontab` file. We will walk through the process of how to get this
    information into the `crontab` shortly, but first let’s discuss the format we
    need to follow, shown in Listing 16-1.


    ```text

    M H DOM MON DOW USER COMMAND

    30 2 * * 1-5 root /root/myscanningscript own```


    Listing 16-1: The format for scheduling commands


    The `crontab` file helpfully labels the columns for you. Note that the first field
    provides the minute (`30`), the second field provides the hour (`2`), the fifth
    field provides the days (`1-5`, or Monday through Friday), the sixth field defines
    the user (`root`), and the seventh field is the path to the script. The third
    and fourth fields contain asterisks (`*`) because we want this script to run every
    day Monday through Friday regardless of the day of the month or the month.


    In Listing 16-1, the fifth field defines a range for the day of the week by using
    a dash (`-`) between the numbers. If you want to execute a script on multiple
    noncontiguous days of the week, you can separate those days with commas (`,`).
    Thus, Tuesday and Thursday.


    To edit `crontab`, you can run the `crontab` command followed by the `-e` (edit)
    option:


    ```bash

    kali >crontab-e

    ```


    Select an editor. To change later, run `select-editor`:


    ```text

    ./bin/nano easiest/usr/bin/mcedit/usr/bin/vim.basic/usr/bin/vim.gtk/usr/bin/vim.tiny
    Choose 1-5 [1]:

    ```


    The first time you run this command, it will ask which editor you would like to
    use. The default is `/bin/nano`, the 1 option. If you choose this option, it will
    open directly to crontab.


    Another option, and often a better one for the newcomer to Linux, is to open `crontab`
    directly in your favorite text editor, which you can do like so:


    ```bash

    kali >leafpad/etc/crontab

    ```


    I’ve used this command to open crontab in Leafpad. You can see a snippet of the
    file in Listing 16-2.


    /etc/crontab: system-wide crontab


    Unlike any other `crontab`, you don''t have to run the `crontab` command to install
    the new version when you edit this file and files in `/etc/cron.d`. These files
    also have username fields, which no other crontabs do.


    ```text

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

    # m h dom mon dow user command

    17 * * * * root cd / && run-parts --report /etc/cron.hourly

    25 6 * * * root test -x /usr/sbin/anacron II ( cd / && run-parts

    47 6 * * 7 root test -x /usr/sbin/anacron II ( cd / && run-parts)

    52 6 1 * * root test -x /usr/sbin/anacron II ( cd / && run-parts)

    ```

    Listing 16-2: The crontab file in use in a text editor


    Now, to set a new regularly scheduled task, you simply need to enter a new line
    and save the file.


    ## Scheduling a Backup Task


    Let’s view this utility first from the system administrator’s perspective. As
    a system administrator, you’d often want to run backups of all your files after
    hours, while the system is not being used and resources are readily available.
    (System backups tend to require system resources that are in short demand during
    business hours.) The ideal time might be in the middle of the night on the weekend.
    Rather than having to log in at 2 AM on Saturday night/Sunday morning (I’m sure
    you have other priorities at that time), you could schedule the backup to start
    automatically at that time, even though you’re not at your computer.


    Note that the hour field uses a 24-hour clock rather than using AM and PM, so
    1 PM is, for example, `13:00`. Also, note that the days of the week (`DOW`) start
    with Sunday (`0`) and end with Saturday (`6`).


    To create a job, you simply need to edit the `crontab` file by adding a line in
    the prescribed format. So, say you wanted to create a regular backup job using
    a user account named `backup`. You would write a script for backing up the system
    and save it as `systembackup.sh` in the `/bin` directory, then schedule this backup
    to run every Saturday night/Sunday morning at 2 AM by adding the following line
    to crontab:


    ```text

    00 2 * * 0 backup /bin/systembackup.sh

    ```


    Note that the `*` wildcard is used to indicate “any,” and using it in place of
    a digit for the day of the month, month, or day of the week is read as “all” days
    or months. If you read across this line, it says:

    At the top of the hour (`00`),

    Of the second hour (`2`),

    Of any day of the month (`*`),

    Of any month (`*`),

    On Sunday (`0`),

    As the backup user,

    Execute the script at `/bin/systembackup.sh`.


    The `crondaemon` will then execute that script every Sunday morning at 2 AM, every
    month.


    If you only wanted the backup to run on the 15th and 30th of every month, regardless
    of what days of the week those dates fell on, you could revise the entry in crontab`
    to appear as follows:


    ```text

    00 2 15,30 * * backup /root/systembackup.sh

    ```


    Note that the day of the month (`DOM`) field now has `15,30`. This tells the system
    to run the script only on the 15th and 30th of every month, so around every two
    weeks. When you want to specify multiple days, hours, or months, you need to list
    them separated by a comma, as we did here.


    Next, let’s assume the company requires you to be especially vigilant with its
    backups. It can’t afford to lose even a day of data in the event of a power outage
    or system crash. You would then need to back up the data every weeknight by adding
    the following line:


    ```text

    00 23 * * 1-5 backup /root/systembackup.sh

    ```


    This job would run at 11 PM (hour `23`), every day of the month, every month,
    but only on Monday through Friday (days `1-5`). Especially note that we designated
    the days Monday through Friday by providing an interval of days (`1-5`). This
    could have also been designated as `1,2,3,4,5`; either way, works perfectly fine.


    ## Using crontab to Schedule Your MySQLscanner


    Now that you understand the basics of scheduling a job with `crontab`, let’s schedule
    the `MySQLscanner.sh` script, which seeks out open ports, you built in Chapter
    8. This scanner searches for systems running MySQL by looking for open port `306`.


    To enter your `MySQLscanner.sh` to the crontab file, edit the file to provide
    the particulars of this job, just as we did with the system backups. We’ll schedule
    it to run during the day while you’re at work so it doesn’t take up resources
    when you’re using your home system. To do this, enter the following line in crontab:


    ```text

    00 9 * * * user /usr/share/MySQLscanner.sh

    ```


    We’ve set up the job to run at `00` minutes, at the ninth hour, every day of the
    month (`*`), every month (`*`), every day of the week (`*`), and to run it as
    a regular user. We simply need to save crontab file to schedule the job.


    Now, let’s say you wanted to be particularly careful and only run this scanner
    on weekends and at 2 AM when it’s less likely that anyone is watching the network
    traffic. You also want it to run in the summer, June through August. Your job
    would now look like this:


    ```text

    00 2 * 6-8 0,6 user /usr/share/MySQLscanner.sh

    ```


    You would add this to crontab like so: `/etc/crontab`


    Unlike any other `crontab`, you don''t have to run the `crontab` command to install
    the new version when you edit this file and files in `/etc/cron.d`. These files
    also have username fields, which no other crontabs do.


    ```text

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

    # m h dom mon dow user command

    17 * * * * root cd / && run-parts --report /etc/cron.hourly

    25 6 * * * root test -x /usr/sbin/anacron II ( cd / && run-parts

    47 6 * * 7 root test -x /usr/sbin/anacron II ( cd / && run-parts

    52 6 1 * * root test -x /usr/sbin/anacron II ( cd / && run-parts

    00 * 6-8 0,6 user /usr/share/MySQLscanner.sh

    ```


    Now, `scanner.sh` will only run on weekends in June, July, and August at 2 AM.


    ### crontab Shortcuts


    The `crontab` file has some built-in shortcuts you can use instead of specifying
    the time, day, and month every time. These include:

    - `@yearly`

    - `@monthly`

    - `@weekly`

    - `@daily`

    - `@midnight`

    - `@noon`

    - `@reboot`


    So, if you wanted the MySQL scanner to run every night at midnight, you could
    add the following line to crontab:


    ```text

    @midnight user /usr/share/MySQLscanner.sh

    ```


    ## Using Rc Scripts to Run Jobs at Startup


    Whenever you start your Linux system, a number of scripts are run to set up the
    environment for you. These are known as rc scripts. After the kernel has initialized
    and loaded all its modules, the kernel starts a daemon known as init.d. This daemon
    then begins to run a number of scripts found in `/etc/init.d/`. These scripts
    include commands for starting many of the services necessary to run your Linux
    system as expect.


    ### Linux Runlevels


    Linux has multiple runlevels that indicate what services should be started at
    bootup. For instance, runlevel 1 is singleuser mode, and services such as networking
    are not started in runlevel 1. The rc scripts are set to run depending on what
    runlevel is selected:

    - 0 Halt the system

    - 1 Single-user/minimal mode

    - 2–5 Multiuser modes

    - 6 Reboot the system


    ### Adding Services to rc.d


    You can add services for the `rc.d` script to run at startup using the `update-rc.d`
    command. This command enables you to add or remove services from the `rc.d` script.
    The syntax for `update-rc.d` is straightforward; you simply list the command followed
    by the name of the script and then the action to perform, like so:


    ```bash

    kali >update-rc.d<nameoftservice> <remove|defaults|enable>

    ```


    As an example of how you can use `update-rc.d`, let’s assume you always want the
    PostgreSQL database to start upon system boot so that your Metploit framework
    can use it to store pentesting and hacking results. You would use `update-rc.d`
    to add a line to your rc.d` script to have it up and running every time you boot
    your system.


    Before you do that, let’s check whether PostgreSQL is running on your system already.
    You can do so using the `psaux` command and piping it to a filter looking for
    PostgreSQL using `grep`, like so:


    ```bash

    kali >psaux|grep postgresql

    root 3876 0.0 0.0 12720 964pts/1 S+ 14.24 0.00 grep postgresql

    ```


    This output tells us that the only process found running for PostgreSQL was the
    very command we ran looking for it, so there is no PostgreSQL database running
    on this system presently.


    Now, let’ update our rc.d to have PostgreSQL run automatically at bootup:


    ```bash

    kali >update-rc.d postgres defaults

    ```


    This adds the line to the `rc.d` file. You need to reboot the system for the change
    to take place. Once you’ve done that, let’s again use the `psaux` command with
    `grep` to look for a PostgreSQL process:


    ```bash

    kali >psaux|grep postgresql

    postgresql 757 0.0 0.1 287636 25180 ? S March 14 0.00 /usr/lib/postgresql/9.6/bin/postgresql
    -D /var/lib/postgresql/9.6/main -c config_file=/etc/postgresql/9.6/main/postgresql.conf

    root 3876 0.0 0.0 12720 964pts/1 S+ 14.24 0.00 grep postgresql

    ```


    As you can see, PostgreSQL is running without you ever entering any commands manually.
    It automatically starts when your system boots up, ready and waiting to be used
    with your Metploit!


    ### Adding Services to Your Bootup via a GUI


    If you’re more comfortable working from a GUI to add services at startup, you
    can download the rudimentary GUI-based tool `rcconf` from the Kali repository,
    like so:


    ```bash

    kali >apt-get install rcconf

    ```


    Once it has completed its installation, you can start `rcconf` by entering the
    following:


    ```bash

    kali >rcconf

    ```


    This will open a simple GUI like the one in Figure 16-1. You can then scroll through
    available services, select the ones you want to start upon boot and click OK.


    Figure 16-1: The rcconf GUI for adding services to startup


    In this figure, you can see the PostgreSQL service listed from last. Press the
    spacebar to select this service, press TAB to highlight <Ok>, and then press ENTER.
    The next time you boot Kali, PostgreSQL will start automatically.


    ## Summary


    Both system administrators and hackers often need schedule services, scripts,
    and utilities to run at regular intervals. Linux enables you to schedule any script
    or utility on a regular basis using the `cronemon`, which runs these jobs. In
    addition, you can have services start automatically at bootup using the command
    `update-rc.d` or the GUI-based tool `rcconf` to update rc.d scripts.


    ### Using pip


    Python has a package manager specifically for installing and managing packages
    known as `pip` (Pip Installs Packages). Since we are working with Python 3 here,
    you will need `pip3` to download and install packages. You can download and install
    `pip3` from the Kali repository by entering the:


    ```bash

    kali >apt-get install python3-pip

    ```


    Now, to download modules from PyPI, you can simply enter this:


    ```bash

    pip3 install <package>

    ```


    When you download these packages, they are automatically placed in the `/usr/local/lib/python<version>/dist-packages`
    directory. So, for instance, if you used `pip3` to install the Python implementation
    of SNMP for Python 3.6, you would find it at `/usr/local/lib/python3.6/pysnmp`.
    If you’t sure where a package has been placed on your system (sometimes, distributions
    of Linux use different directories), you can enter `pip3` followed by show and
    the package name, as here:


    ```bash

    pip3 show pysnmp

    ```


    ```text

    Name: pysnmp

    Version: 4.4.4

    Summary: SNMP library for Python

    Home-page: https://github.com/etof/pysnmp

    Author: Ilya Etof

    email: etof@gmail.com

    Location: usr/local/lib/python3.6/dist-packages

    Requires: పరిశ, cryptography

    ```


    You can see this gives you a lot of information about the package, including the
    directory that holds it. As an alternative to using `pip`, you can download a
    package directly from the site (make that is downloaded to the proper directory),
    unpack it (see Chapter 9 on how to unpack software), and then run the following:


    ```bash

    kali >pythonsetup.py install```


    This will install any unpacked packages that haven’t been installed.


    ### Installing Third-Party Modules


    To install a third-party module created by another member of the Python community
    (as opposed to an officially released package), you can simply use `wget` to download
    it from wherever it is stored online, uncompress the module, and then run the
    `pythonsetup.py install` command.


    As an example, let’s download and install the Python module for scanning tool
    we used in Chapter 8, `nmap`, from its online repository at `https://xael.org`.


    ```bash

