    No one method is sure to keep your activities safe from prying eyes, and given
    enough time and resources; anything can be tracked. However, these methods will
    likely make the tracker’s job much more difficult.


    # How the Internet gives us away


    To begin, let’s discuss, at a high level, some of the ways our activities on the
    internet are tracked. We won’t go into all tracking methods or into too much detail
    about any one process as that would be beyond the scope of this book. Indeed,
    such a discussion could take up an entire book on its own.


    First, your `IP address` identifies you as you traverse the internet. Data sent
    from your machine is generally tagged with your `IP address`, making your activities
    easy to track. Second, Google and other email services will “read” your email,
    looking for keywords to more efficiently serve your ads. Although there are many
    more sophisticated methods that are far more time and resource-intensive, these
    are the ones we try to prevent in this chapter. Let’s start by taking a look at
    how IP addresses give us away on the internet.


    When you send a packet of data across the internet, it contains the `IP addresses`
    of the source and destination for the data. In this way, the packet knows where
    it is going and where to return the response. Each packet hops through multiple
    internet routers until it finds its destination and then jumps back to the sender.
    For general internet surfing, each hop is a router the packet passes through to
    get to its destination. There can be as many as 20–30 hops between the sender
    and the destination, but usually, any packet will find its way to the destination
    in fewer than 15 hops.


    As the packet traverses the internet, anyone intercepting the packet can see who
    sent it, where it has been, and where it is going. This is one way websites can
    tell who you are when you arrive and log you in automatically, and it is also
    how someone can track where you’ve been on the internet. To see what hops a packet
    might make between you and the destination, you can use the `traceroute` command,
    as shown next. Enter `traceroute` and the destination `IP address` or domain,
    and the command will send out packets to the destination and trace the route of
    those packets.


    ```

    traceroute <destination IP address or domain>

    ```


    # The Onion Router System


    In the 1990s, the US Office of Naval Research (ONR) set out to develop a method
    for anonymously navigating the internet for espionage purposes. The plan was to
    set up a network of routers that was separate from the internet’s routers that
    could encrypt the traffic and that only stored the unencrypted `IP address` of
    the previous router— meaning all other router addresses along the way were encrypted.
    The idea was that anyone watching the traffic could not determine the origin or
    destination of the data. This research became known as “The Onion Router (Tor)
    Project” in 2002, and it’s now available to anyone to use for relatively safe
    and anonymous navigation on the web.


    ## How Tor Works


    Packets sent over Tor are generally not sent over the regular routers so monitored
    by so many but instead are sent over a network of over 7,000 routers around the
    world, thanks to volunteers who allow their computers to be utilized by Tor. On
    top of using an entirely separate router network, Tor encrypts the data, destination,
    and sender `IP address` of each packet. At each hop, the information is encrypted
    and then decrypted by the next hop when it’s received. In this way, each packet
    contains information about only the previous hop along the path and not the `IP
    address` of the origin. If someone intercepts the traffic, they can see only the
    `IP address` of the previous hop, and the website owner can see only the `IP address`
    of the last router that sent the traffic.


    This ensures relative anonymity across the internet. To enable the use of Tor,
    you need to install the Tor browser from `https://www.torproject.org/`. Once installed,
    you can use it like any old internet browser. By using this browser, you will
    be navigating the internet through a separate set of routers and will be able
    to visit sites without being tracked by Big Brother. Unfortunately, the tradeoff
    is that surfing via the Tor browser can be a lot slower; because there are not
    nearly as many routers, the bandwidth is limited in this network.


    In addition to being capable of accessing nearly any website on the traditional
    internet, the Tor browser is capable of accessing the dark web. The sites that
    make up the dark web require anonymity, so they allow access only through the
    Tor browser, and they have addresses ending in `.onion` for their top level domain
    (TLD). The dark web is infamous for illegal activity, but there exist quite a
    number of legal services that are also available there. A word of caution, however:
    when accessing the dark web, you may come across material that many will find
    offensive.


    ## Security Concerns


    The intelligence and spy services of the United States and other nations consider
    the Tor network a threat to national security, believing such an anonymous network
    enables foreign governments and terrorists to communicate without being watched.
    As a result, we have numerous robust and ambitious research projects are working
    to break the anonymity of Tor. Tor’s anonymity has been broken before by these
    authorities and will likely be broken again. The NSA, as one instance, runs its
    own Tor routers, meaning that your traffic may be traversing the NSA’s routers
    when you use Tor.


    If your traffic is exiting the NSA’s routers, that’s even worse, because the exit
