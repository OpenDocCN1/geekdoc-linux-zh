    ![](rsrc1MB.jpg)kali >pythonsetup.pyinstallThis will install any unpacked packages
    that haven’t yet been installed.Installing Third-Party ModulesTo install a third­party
    module created by another member of the Python community (as opposed to an officially
    released Python package), you can simply use wget to download it from wherever
    it is being stored online, uncompress the module, and thenrun the pythonsetup.pyinstallcommand.As
