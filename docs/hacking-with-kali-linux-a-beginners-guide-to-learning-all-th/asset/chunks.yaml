    # Chapter 6: Network Scanning and Management\n\n![Occhio, Iris, Biometria, Iriserkennung,\
    \ Sicurezza](rsrc1N7.jpg)\n\nThe ability to scan for and connect to other network\
    \ devices from your system is crucial to becoming a successful hacker, and with\
    \ wireless technologies like WiFi and Bluetooth becoming the standard, finding\
    \ and controlling WiFi and Bluetooth connections is vital. If someone can hack\
    \ a wireless connection, they can gain entry to a device and access to confidential\
    \ information. The first step, of course, is to learn how to find these devices.\
    \ In this chapter, we are going to examine two of the most common wireless technologies\
    \ in Linux: WiFi and Bluetooth.\n\n### Network Scanning\n\nWe say that it is the\
    \ utilization of a computer network for purposes of collecting information about\
    \ IT systems. We carry out scanning of networks primarily to help us do system\
    \ maintenance or a security assessment. Hackers can also conduct a network scanning\
    \ exercise before launching their attacks. The following are some of the reasons\
    \ we scan networks:\n\n*   Identification of the available `UDP` and `TCP` network\
    \ services that may be running on the targets.\n*   To get to understand the systems\
    \ for filtering that are in between the targeted hosts and the user.\n*   Discover\
    \ the operating systems that are being used through the assessment of their `IP`\
    \ responses.\n*   Analyze a particular host that is being targeted for its `TCP`\
    \ sequence number predictability to enable the prediction of `TCP` spoofing and\
    \ the attack sequence.\n\nNetwork scanning comprises of two key aspects: Vulnerability\
    \ scanning and network port scanning. The latter denotes a way of sending data\
    \ packets through a network over to a systems’ specific port numbers. The goal\
    \ is to discover network services that are present in that particular system.\
    \ It is an excellent way for troubleshooting issues that a given system has. That\
    \ way, the problems can be dealt with so that the system is secure. For us to\
    \ discover known vulnerabilities present in network systems, a method known as\
    \ vulnerability scanning is used. Through it, we can identify weak spots both\
    \ in the operating system and the application software. It is these weak points\
    \ that are usually used to compromise computing systems.\n\nBoth vulnerability\
    \ scanning and network port scanning can be said to be techniques that are used\
    \ in information gathering. On the flip side, they can be a prelude to an attack\
    \ when they are put to use by anonymous entities. Such entities usually have malicious\
    \ intentions. The inverse mapping is another technique for network scanning. It\
    \ is useful when it comes to collecting `IP` addresses that are not mapped to\
    \ live hosts. By doing so, it will be aiding in the focussing attention on addresses\
    \ that are worth focussing on, that is, those that are feasible. There are three\
    \ stages in which information gathering can be accomplished:\n\n1.  The footprinting\
    \ stage,\n2.  The scanning stage, and\n3.  The enumeration stage.\n"
