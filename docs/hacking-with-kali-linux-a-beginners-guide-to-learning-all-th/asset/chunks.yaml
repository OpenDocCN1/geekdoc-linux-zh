    30 2 * * 1­5 root /root/myscanningscriptListing 16­1: The format for scheduling
    commandsThe crontab file helpfully labels the columns for you. Note that the first
    field provides the minute (30), the second field provides the hour (2), the fifth
    field provides the days (1-5, or Monday through Friday), the sixth field defines
    the user (root), and the seventh field is the path to the script. The third and
    fourth fields contain asterisks (*) because we want this script to run every day
    Monday through Friday regardless of the day of the month or the month.In Listing
    16­1, the fifth field defines a range for the day of the week by using a dash
    (-) between the numbers. If you want to execute a script on multiple noncontiguous
    days of the week, you can separate those days with commas (,). Thus, Tuesday and
    Thursday.![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)To edit crontab,
    you can run the crontabcommand followed by the -e(edit) option:kali >crontab-eSelect
    an editor. To change later, run ''select­editor''./bin/nano <­­­­easiest/usr/bin/mcedit/usr/bin/vim.basic/usr/bin/vim.gtk/usr/bin/vim.tiny
    Choose 1­5 [1]:The first time you run this command, it will ask which editor you
    would like to use. The default is /bin/nano, the 1 option. If you choose this
    option, it will open directly tocrontab.Another option, and often a better one
    for the newcomer to Linux, is to open crontab directly in your favorite text editor,
    which you can do like so:kali >leafpad/etc/crontabI’ve used this command to open
    crontab in Leafpad. You can see a snippet of the file in Listing 16­2.![](rsrc1ME.jpg)
    ![](rsrc1MF.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)/etc/crontab:
    system­wide crontabUnlike any other crontab, you don''t have to run the ''crontab''
    command to install the new version when you edit this file and files in /etc/cron.d.
    These files also have username fields, which no other crontabs do.SHELL=/bin/shPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin#
    m h dom mon dow user command17 * * * * root cd / && run­parts ­­report /etc/cron.hourly25
    6 * * * root test ­x /usr/sbin/anacron II ( cd / && run­parts47 6 * * 7 root test
    ­x /usr/sbin/anacron II ( cd / && run­parts52 6 1 * * root test ­x /usr/sbin/anacron
    II ( cd / && run­parts#Listing 16­2: The crontab file in use in a text editorNow,
    to set a new regularly scheduled task, you simply need to enter a new line and
    save the file.Scheduling a Backup TaskLet’s view this utility first from the system
    administrator’s perspective. As a system administrator, you’d often want to run
    backups of all your files after hours, while the system is not being used and
    resources are readily available. (System backups tend to require system resources
    that are in short demand during business hours.) The ideal time might be in the
    middle of the night on the weekend. Rather than having to log in at 2 AM on Saturday
    night/Sunday morning (I’m sure you have other priorities at thattime), you could
    schedule the backup to start automatically at that time, even though you’re not
    at your computer.Note that the hour field uses a 24­hour clock rather than using
    AM and PM, so 1 PM is, for example, 13:00\. Also, note that the days of the week
    (DOW) start with Sunday (0) and end with Saturday (6).To create a job, you simply
    need to edit the crontab file by adding a line in the prescribed format. So, say
    you wanted to create a regular backup job using a user account named “backup.”
    You would write a script for backing up the system and save it as systembackup.sh
    in the /bin directory, then schedule this backup to run every Saturday night/Sunday
    morning at 2 AM by adding the following line to crontab:00 2 * * 0 backup /bin/systembackup.shNote
    that the *wildcard is used to indicate “any,” and using it in place of a digit
    for the day of the month, month, or day of the week is read as “all” days or months.
    If you read across this line, it saysAt the top of the hour (00),Of the second
    hour (2),Of any day of the month (*),Of any month (*),On Sunday (0),As the backup
    user,Execute the script at /bin/systembackup.sh.The crondaemon will then execute
    that script every Sunday morning at 2 AM, every month.If you only wanted the backup
    to run on the 15th and 30th of every month, regardless of what days of the week
    those dates fell on, you could revise the entry in crontab to appear as follows:00
    2 15,30 * * backup /root/systembackup.shNote that the day of the month (DOM) field
    now has 15,30\. This tells the system to run the script only on the 15th and 30th
    of every month, so around every two weeks. When you want to specify multiple days,
    hours, or months, you need to list them separated by a comma, as we did here.Next,
    let’s assume the company requires you to be especially vigilant with its backups.It
    can’t afford to lose even a day of data in the event of a power outage or system
    crash.You would then need to back up the data every weeknight by adding the following
    line:00 23 * * 1­5 backup /root/systembackup.shThis job would run at 11 PM (hour
    23), every day of the month, every month, but only on Monday through Friday (days
    1–5). Especially note that we designated the days Monday through Friday by providing
    an interval of days (1-5) separated by a dash (-). This could have also been designated
    as 1,2,3,4,5;, either way, works perfectly fine.Using crontab to Schedule Your
    MySQLscannerNow that you understand the basics of scheduling a job with the crontabcommand,
    let’s schedule the MySQLscanner.sh script, which seeks out open MySQL ports, that
    you built in Chapter 8\. This scanner searches for systems running MySQL by looking
    for open port 3306.![](rsrc1MB.jpg) ![](rsrc1MC.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)To enter your MySQLscanner.sh
    to the crontab file, edit the file to provide the particulars of this job, just
    as we did with the system backups. We’ll schedule it to run during the day while
    you’re at work so it doesn’t take up resources when you’re using your home system.
    To do this, enter the following line in your crontab:00 9 * * * user /usr/share/MySQLsscanner.shWe’ve
    set up the job to run at 00 minutes, at the ninth hour, every day of the month
    (*), every month (*), every day of the week (*), and to run it as a regular user.
    We simply need to save this crontab file to schedule the job.Now, let’s say you
    wanted to be particularly careful and only run this scanner on weekends and at
    2 AM when it’s less likely that anyone is watching the network traffic. You also
    only want it to run in the summer, June through August. Your job would now look
    like this:00 2 * 6­8 0,6 user /usr/share/MySQLsscanner.shYou would add this to
    your crontab like so:/etc/crontab: system­wide crontabUnlike any other crontab,
    you don''t have to run the ''crontab'' command to install the new version when
    you edit this file and files in /etc/cron.d. These files also have username fields,
    which none of the other crontabs do.SHELL=/bin/shPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin#
    m h dom mon dow user command17 * * * * root cd / && run­parts ­­report /etc/cron.hourly25
    6 * * * root test ­x /usr/sbin/anacron II ( cd / && run­parts ­­report /etc/cron.daily)47
    6 * * 7 root test ­x /usr/sbin/anacron II ( cd / && run­parts ­­report /etc/cron.weekly
    )52 6 1 * * root test ­x /usr/sbin/anacron II ( cd / && run­parts ­­report /etc/cron.monthly
    )002*6-80,6user/usr/share/MySQLsscanner.shNow, your MySQLscanner.sh will only
    run on weekends in June, July, and August at 2 AM.crontab ShortcutsThe crontab
    file has some built­in shortcuts you can use instead of specifying the time, day,
    and month every time. These include the following:@yearly@annually![](rsrc1MK.jpg)
    @monthly![](rsrc1MK.jpg) @weekly![](rsrc1MK.jpg) @daily@midnight![](rsrc1MK.jpg)
    @noon![](rsrc1MK.jpg) @reboot![](rsrc1MK.jpg)So, if you wanted the MySQL scanner
    to run every night at midnight, you could add the following line to the crontab
    file:@midnight​ user /usr/share/MySQLsscanner.shUsing Rc Scripts to Run Jobs at
    StartupWhenever you start your Linux system, a number of scripts are run to set
    up the environment for you. These are known as the rc scripts. After the kernel
    has initialized and loaded all its modules, the kernel starts a daemon known as
    initor init.d. This daemon then begins to run a number of scripts found in /etc/init.d/rc.
    These scripts include commands for starting many of the services necessary to
    run your Linux system as you expect.Linux RunlevelsLinux has multiple runlevels
    that indicate what services should be started at bootup. For instance, runlevel
    1 is single­user mode, and services such as networking are not started in runlevel
    1\. The rc scripts are set to run depending on what runlevel is selected:0 Halt
    the system1 Single­user/minimal mode2–5 Multiuser modes6 Reboot the systemAdding
    Services to rc.dYou can add services for the rc.d script to run at startup using
    the update-rc.dcommand. This command enables you to add or remove services from
    the rc.d script. The syntaxfor update-rc.dis straightforward; you simply list
    the command followed by the name of the script and then the action to perform,
    like so:kali >update-rc.d<nameofthescriptorservice> <remove|defaults|disable|enable>As
    an example of how you can use update-rc.d, let’s assume you always want the PostgreSQL
    database to start upon system boot so that your Metasploit framework can use it
    to store pentesting and hacking results. You would use update-rc.d to add a line
    to your rc.d script to have it up and running every time you boot your system.Before
    you do that, let’s check whether PostgreSQL is running on your system already.
    You can do so using the pscommand and piping it to a filter looking for PostgreSQL
    using grep, like so:kali >psaux|greppostgresqlroot 3876​ 0.0​ 0.0 12720​ 964pts/1​
    S+ 14.24 0.00 grep postgresqlThis output tells us that the only process psfound
    running for PostgreSQL was the very command we ran looking for it, so there is
    no PostgreSQL database running on this system presently.Now, let’s update our
    rc.d to have PostgreSQL run automatically at bootup:kali >update-rc.dpostgresqldefaultsThis
    adds the line to the rc.d file. You need to reboot the system for the change to
    take place. Once you’ve done that, let’s again use the pscommand with grepto look
    for a PostgreSQL process:kali >psaux|greppostgresqlpostgresql 757 0.0 0.1 287636
    25180 ? S March 14 0.00 /usr/lib/postgresql/9.6/bin/postgresql ­D /var/lib/postgresql/9.6/main­c
    config_file=/etc/postgresql/9.6/main/postgresql.confroot 3876​ 0.0​ 0.0 12720​
    964pts/1​ S+ 14.24 0.00 grep postgresqlAs you can see, PostgreSQL is running without
    you ever entering any commandsmanually. It automatically starts when your system
    boots up, ready and waiting to be used with your Metasploit!Adding Services to
    Your Bootup via a GUIIf you’re more comfortable working from a GUI to add services
    at startup, you can download the rudimentary GUI­based tool rcconf from the Kali
    repository, like so:kali >apt-getinstallrcconfOnce it has completed its installation,
    you can start rcconf by entering the following:kali >rcconfThis will open a simple
    GUI like the one in Figure 16­1\. You can then scroll through the![](rsrc1MF.jpg)
    ![](rsrc1MF.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) available services, select
    the ones you want to start upon bootup and click OK.![](rsrc1NC.jpg)Figure 16­1:
    The rcconf GUI for adding services to startupIn this figure, you can see the PostgreSQL
    service listed second from last. Press the spacebar to select this service, press
    TAB to highlight <Ok>, and then press ENTER. The next time you boot Kali, PostgreSQL
    will start automatically.SummaryBoth system administrators and hackers often need
    to schedule services, scripts, andutilities to run at regular intervals. Linux
    enables you to schedule nearly any script or utility to run on a regular basis
    using the crondaemon, which runs these jobs from the crontable. In addition, you
    can have services start automatically at bootup by using the command update-rc.dor
    the GUI­based tool rcconf to update the rc.d scripts.Using pipPython has a package
    manager specifically for installing and managing Python packages known as pip
    (Pip Installs Packages). Since we are working with Python 3 here, you will need
    pip for Python 3 to download and install packages. You can download and install
    pip from the Kali repository by entering the following:kali >apt-getinstallpython3-pipNow,
    to download modules from PyPI, you can simply enter this:kali >pip3install<packagename>When
    you download these packages, they are automatically placed in the /usr/local//lib/<python­version>/dist­packages
    directory. So, for instance, if you had used pip to install the Python implementation
    of the SNMP protocol for Python 3.6, you would find it at /usr/local/lib/python3.6/pysnmp.
    If you aren’t sure where a package has been placed on your system (sometimes,
    different distributions of Linux use different directories), you can enter pip3
    followed by show and the package name, as shown here:kali >pip3showpysnmpName:
    pysnmpVersion: 4.4.4Summary: SNMP library for PythonHome­page: https://github.com/etingof/pysnmpAuthor:
    Ilya Etingof <etingof@gmail.com>Author­email: etingof@gmail.comLicense: BSDLocation:
    usr/local/lib/python3.6/dist­packagesRequires: ptsmi, pyansl, pycryptodomexYou
    can see this gives you a lot of information about the package, including the directory
    that holds it.As an alternative to using pip, you can download a package directly
    from the site (make certain that is downloaded to the proper directory), unpack
    it (see Chapter 9 on how to unpack software), and then run the following:![](rsrc1MB.jpg)
