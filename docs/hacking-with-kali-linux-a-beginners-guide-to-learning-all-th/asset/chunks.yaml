    - **测试者 (Tester)**：这是执行渗透测试的实体。它可以是一个个人也可以是一个群体。它是计划并执行渗透测试的测试人员。

    - **攻击者 (Attacker)**：这是渗透测试人员的原始版本。区别在于，测试者的意图是帮助提高公司的安全性，而攻击者的意图是恶意的，即窃取公司的资源或信息。

    - **攻击 (Attack)**：我们可以认为这些黑客或渗透测试人员为了绕过目标的安全控制而所做的尝试。在大多数情况下，攻击序列包含电子、物理或程序性的方法。

    - **管理层 (Management)**：这是组织的领导层。测试过程可能涉及多个层级的管理，特别是那些控制特定区域的管理。涉及的管理层级将对测试范围产生影响。

    - **测试主体 (The Test Subject)**：这可以是公司内部的一个小型组织单元，也可以是进行渗透测试的整个公司。

    - **目标 (The target)**：目标是遭受攻击的组织或系统。它可能意识到自己正在被测试，也可能不知道。无论如何，大多数目标都有自己的保护机制来保卫自己。

