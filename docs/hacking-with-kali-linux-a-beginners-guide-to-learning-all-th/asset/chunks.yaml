    \ Kali desktop\n\n## The Terminal\n\nThe first step in using Kali is to open the\
    \ terminal, which is the command-line interface we’ll use in this book. In Kali\
    \ Linux, you’ll find the icon for the terminal at the bottom of the desktop. Double­click\
    \ this icon to open the terminal or press `CTRL-ALT-T`. Your new terminal should\
    \ look like the one shown in the figure below.\n\n![](rsrc1MH.jpg)\nFigure: The\
    \ Kali terminal\n\nThis terminal opens the command line environment, known as\
    \ the shell, which enables you to run commands on the underlying operating systems\
    \ and write scripts. Although Linux has many different shell environments, the\
    \ most popular is the `bash` shell, which is also the default shell in Kali and\
    \ many other Linux distributions. To change your password, you can use the command\
    \ `passwd`.\n\n## The Linux Filesystem\n\nThe Linux filesystem structure is somewhat\
    \ different from that of Windows. Linux doesn’t have a physical drive (such as\
    \ the `C:` drive) at the base of the filesystem but uses a logical filesystem\
    \ instead. At the very top of the filesystem structure is `/`, which is often\
    \ referred to as the root of the filesystem, as if it were an upside­down tree\
    \ (see the figure below). Keep in mind that this is different from the root user.\
    \ These terms may seem confusing at first, but they will become easier to differentiate\
    \ once you get used to Linux.\n\n![](rsrc1ME.jpg) ![](rsrc1MF.jpg) ![](rsrc1MB.jpg)\
    \ ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)\
    \ ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)![](rsrc1MJ.jpg)\n\
    Figure: The Linux filesystem\n\nThe root (`/`) of the filesystem is at the top\
    \ of the tree, and the following are the most important subdirectories:\n\n- `/root`:\
    \ The home directory\n- `/etc`: Generally contains configuration files\n- `/home`:\
    \ The user’s home\n- `/mnt`: Where filesystems are mounted\n- `/media`: Where\
    \ USB devices are mounted\n- `/bin`: Where application binaries reside\n- `/lib`:\
    \ Where shared libraries reside\n\nUnderstanding these key directories is important\
    \ because you need to know where tools are located. We will spend more time with\
    \ these directories, so you need to know where they are. the,,,,,,,,,,, to to\
    \ the the\n\n.\n\n## Basic Commands\n\nTo begin, let’s look at some commands.\n\
