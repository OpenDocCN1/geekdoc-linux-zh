    `iwlist` command can be used for scanning wireless networks available and also
    for displaying any other information about the wireless networks which are not
    displayed when the `iwconfig` command is used. `iwlist` is utilized in the generation
    of wireless access points that are nearby together with their SSIDs and their
    MAC addresses.


    `iwspy` command is used for monitoring nodes in a network. It can also be used
    for recording the link quality of the nodes.


    `ifrename` this command is used for renaming wireless network interfaces depending
    on multiple criteria that are static to allocate names consistently to each interface.
    The interface names usually are dynamic by default. This command helps users decide
    the name of the network interface. The command needs to be executed before bringing
    the interfaces up.


    `iwgetid` this is used in the reporting of the NWID, ESSID, or address of the
    access point of the wireless network presently being used. By default, `iwgetid`
    will display the devices’ ESSID. Suppose that it is unavailable, it will output
    its NWID instead. The information reported is the same as the one shown by `iwconfig`.
    In comparison, it is easier to do integration in various scripts.


    # Detecting and Connecting to Bluetooth


    In recent times, nearly all gadgets, systems, and devices have inbuilt Bluetooth.
    The devices can be computers, iPods, smartphones, speakers, game controllers,
    keyboards, tablets, among others. The ability to break into Bluetooth networks
    can result in the compromising of the information on the device, assuming a devices’
    control, and acquisition of a platform to transmit privileges information from
    and to the device, among other things. We, therefore, need to understand how Bluetooth
    works if we are to exploit this technology. From this book, you will be able to
    acquire some basic knowledge that will come in handy during the scanning and connecting
    to Bluetooth devices in preparation for hacking them.


    ## How Bluetooth Works


    First, we can define Bluetooth as a wireless communication technology that enables
    devices to transmit voice or data wirelessly. This happens over a relatively short
    distance. This technology was meant to replace the ubiquitous cables that were
    being used to connect devices while still securing the communications across them.
    The process of joining two Bluetooth devices is known as pairing. Pretty much
    any two devices can pair if they are set to a discoverable mode. In the discoverable
    mode, a Bluetooth device will broadcast the following information about themselves:


    - Technical information

    - Name

    - List of services

    - Class


    Upon pairing, two Bluetooth devices will exchange a link key. The devices will
    store the key to be used in the identification of the other device in future pairings.
    Every device has a unique identifier and usually a manufacturer-assigned name.
    These will be useful pieces of data when we want to identify and access a device.


    ## Bluetooth Scanning and Reconnaissance


    Linux has an implementation of the Bluetooth protocol stack called `BlueZ` that
    we are going to use to scan for Bluetooth signals. Most Linux distributions, including
    Kali Linux, have it as an inbuilt feature by default. `BlueZ` possesses utilities
    that can help us scan and manage Bluetooth capable devices. Examples of the utilities
    are outlined below:


    - `hciconfig`: this is an equivalent of `ifconfig` in Linux, but made for Bluetooth
    capable devices.

    - `hcitool`: this is a tool that we use to perform inquiries. The inquiries can
    be the device ID, name, class, or even its clock information. This helps the devices
    to work in sync.

    - `hcidump`: sniffing of Bluetooth communications is carried out by this tool,
    it, therefore, gives us a chance to capture data that is being sent over the Bluetooth
    signal.


    The first scanning and reconnaissance step with Bluetooth is to check whether
    the Bluetooth adapter on the system that we are using is recognized and enabled
    so we can use it to scan for other devices.


    ### Scanning for Bluetooth Devices with hcitool


    Now that we know our adapter is up, we can use another tool in the `BlueZ` suite
    called `hcitool`, which is used to scan for other Bluetooth devices within range.
    With the simple `scan` command, we can find out Bluetooth devices that are transmitting
    using their discover beacons. That is, the devices set to their discovery mode.
    Most of the tools for Bluetooth hacking you are likely to encounter will be using
    these commands in a script. You should be able to create your tools from these
    commands using Python script or even bash script.


    ### Using the sdptool to scanning for services


    The service discovery protocol, SDP as it is commonly known, is a protocol of
    Bluetooth that is used in the searching of Bluetooth services (Bluetooth is a
    suite of services), and, helpfully, `BlueZ` provides the `sdptool` tool for browsing
    a device for the services it offers. It is also important to note that the device
    does not have to be in discovery mode to be scanned. The syntax is as follows:


    ```

    sdptool browse MACaddress

    ```


    ### Seeing Whether the Devices Are Reachable with l2ping


    Once we have gathered the MAC addresses of all nearby devices, we can send out
    pings to these devices, whether they are in discovery mode or not, to see whether
    they are in reach. This lets us know whether they are active and within range.
    To send out a ping, we use the `l2ping` command with the following syntax:


    ```

    l2ping MACaddress

    ```


    # Summary


    Wireless devices represent the future of connectivity and hacking. Linux has developed
    specialized commands for scanning and connecting to Wi-Fi APs in the first step
    toward hacking those systems. The `aircrack-ng` suite of wireless hacking tools
    includes both `airmon-ng` and `airedump-ng`, which enable us to scan and gather
    vital information from in-range wireless devices. The `BlueZ` suite includes `hciconfig`,
    `hcitool`, and other tools capable of scanning and information gathering, which
    are necessary for hacking the Bluetooth devices within range. It also includes
    many other tools worth exploring.


    # Chapter 7: Cryptography


    There are so much mathematics and algorithms in encryption, and that is a topic
    we would not rather venture into at this point. The explanations will be quite
    simple and surprisingly easy to understand. We are going to look at the basic
    concepts and terminologies so that you will be in a position to know some related
    topics whenever they come up. These include wireless cracking, password cracking,
    encryption technologies, and hashing. My intention, however, is not to make a
    cryptographer out of you here. It is a skill that requires time to hone, but to
    help familiarize the beginner with the terms and concepts of cryptography to help
    you become a credible hacker.


    ## A Word About Key Size


    Key size matters a lot when it comes to cryptography. More secure encryptions
    have larger keys. A 256-bit key `AES` is therefore much stronger as compared to
    a 128-bit key `AES`. That means it is also much difficult to break it. It suffices
    to say that in encryption that employs the use of a similar algorithm, the larger
    the size of the key, the stronger encryption will be. However, note that the encryptions’
    strength is based on the key size and the specifics of the algorithm as well.
    This, therefore, does not imply that larger keys denote stronger encryption between
    the various encryption algorithms. Let''s get started by breaking encryption into
    categories.


    ## Types of Cryptography


    Below are the kinds of encryptions we are going to concentrate on in this book.


    - Asymmetric Encryption

    - Symmetric Encryption

