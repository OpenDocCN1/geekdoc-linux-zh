    An attacker has at his disposal, utilities such as `scapy`, the `airrack-ng` suite,
    `file2air` among others that they can use for launching the denial of service
    de-authentication attack. An attacker just needs a networks’ SSID, `BSSID` of
    the access point, the targets’ MAC address and is good to go. `TCPdump`, `airodump-ng`,
    `Wireshark` and `kismet` are some of the tools an attacker can use to obtain this
    information. A wireless network attacker may opt to insert periods of silence
    between the transmission of de-authentication frames to evade detection and make
    the attack more stealthy.


    ## Conclusion


    I take this opportunity to thank you for being able to make it to the end of `Hacking
    With Kali Linux`. Let’s hope it has been edifying and through it, you have been
    able to accrue the requisite knowledge to enable you to begin your hacking career
    or improve your skills if you are already one.


    I sincerely hope that you have enjoyed flipping pages all the way from the first
    topic which was `Basics of Hacking`, `Cyber Attacks`, `Linux for Hacking`, `Basics
    of Kali`, `Scanning and Managing Networks`, `File and Directories Permissions`,
    `Cyber Security`, `Becoming Secure and Anonymous`, and finally onto some basics
    of cryptography. I am also hoping that by studying this book, you have got to
    learn plenty of practical concepts that you need to become a hacking expert.


    By now, you must have been able to get access to a vast body of theoretical knowledge
    regarding the various types of attacks that can be launched on your systems, the
    reason for launching them, and how you can safeguard your infrastructure against
    such attacks. These are your first steps towards becoming a professional hacker.
    The book covers topical issues like wireless network attacks, cyber-attacks, and
    penetration testing, among others. It, therefore, means that you are now in an
    excellent position to discern network attack mechanisms being perpetrated in the
    real world and recommend appropriate remedial measures.


    I have also given you several security measures you can implement to keep your
    networks safe. The formatting is such that the language is quite user-friendly
    and that you can understand the importance of securing your systems. Going forward,
    the next step is to put the concepts you have acquired from this book into practice.
    They say practice makes perfect, and it is by practicing that one can become a
    master in the field of hacking, more so using `Kali Linux`. Let the knowledge
    you have acquired from the book work for you.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!

