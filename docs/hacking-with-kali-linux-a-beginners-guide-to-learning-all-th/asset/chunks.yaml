    与之前的两种类型黑客不同，白帽客是那些将技能用在良好方面的人。他们的意图是善意的。这些人是人。这群黑客通常被称为 `ethical hackers`。他们可能是组织的员工，或在信息安全公司担任承包商。他们通常尝试通过黑客手段发现系统中的漏洞。黑客过程中使用的方法与黑帽使用的方法相似，但有一个区别点。白帽首先寻求所有者的同意。这使得黑客行为变得合法。白帽客通常执行
    `penetration tests`；他们会评估漏洞并对公司的安全系统进行现场测试。我们甚至有举办伦理黑客的认证、培训、课程和会议。


