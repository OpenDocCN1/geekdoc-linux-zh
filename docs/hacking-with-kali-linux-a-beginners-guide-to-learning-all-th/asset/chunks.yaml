    现在，要设置一个新的定期调度的任务，你只需要输入新行并保存文件即可。


    ## 调度备份任务


    让我们先从系统管理员的角度来看这个工具。作为系统管理员，你通常希望在非工作时间运行所有文件的备份，此时系统未被使用且资源可以轻松获得。（系统备份通常需要那些办公时间段需求较少的系统资源。）理想的时间可能是周末的半夜。与其在周六晚上/周日早上凌晨
    2 点登录（我确定你那个时间有其他优先事项），你完全安排备份在那个时间自动开始，即使你不在电脑前。


    请注意，小时字段使用的是 24 小时制，而不是 AM 和 PM，例如，下午 1 点是 `13:00`。此外，请注意星期（`DOW`）从周日（`0`）开始，到周六（`6`）结束。


    要创建一个作业，你只需要通过按指定的格式添加行来编辑 `crontab` 文件。例如，假设你想使用名为 `backup` 的用户账户创建一个定期备份作业。你会为系统备份编写一个脚本并将其保存为
    `/bin` 目录下的 `systembackup.sh`，然后通过向 crontab 添加以下行，来调度此备份在每周六六晚上/周日早上凌晨 2 点运行：


    ```text

    00 2 * * 0 backup /bin/systembackup.sh

    ```


    请注意，`*` 通配符用于表示“任何”，用它来代替日期、月份或星期几的数字被读作“所有”日期或月份。如果你读这一行，它的意思是：

    在每小时的开头（`00`），

    在第二个小时（`2`），

    在每月的任何一天（`*`），

    在任何月份（`*`），

    在周日（`0`），

    作为备份用户，

    在 `/bin/systembackup.sh` 执行脚本。


    随后 `crondaemon` 将在每月的周日早上凌晨 2 点执行该脚本。


    如果你只想让备份在每月的 15 号和 30 号运行，无论这些日期落在周几，你可以修改 crontab 中的条目如下：


    ```text

    00 2 15,30 * * backup /root/systembackup.sh

    ```


    请注意，日期（`DOM`）字段现在是 `15,30`。这告诉系统只在每月的 15 号和 30 号运行脚本，因此大约每两周运行一次。当你指定多个日期、小时或月份时，你需要用逗号将它们分隔，就像我们在这里这样做的那样。


    接下来，假设公司要求你对备份格外警惕。在停电或系统崩溃的情况下，它无法承受丢失任何一天的数据。这时你需要通过添加以下行来在每个工作晚上备份数据：


    ```text

    00 2 * * 1-5 backup /root/systembackup.sh

    ```


    此作业将在每个工作晚上 11 点（小时 `23`）运行，每月的每一天，但仅在周一到周五（天数 `1-5`）。特别注意通过提供日期间隔 (`1-5`) 来指定周一到周五。也可以指定为
    `1,2,3,4,5`；哪种方式运行良好。


    ## 使用 crontab 调度 MySQLscanner


    现在你已经理解了如何使用 `crontab` 调度作业的基础知识，让我们调度在第 8 章中构建的搜索开放端口的 `MySQLscanner.sh` 脚本。该扫描器通过寻找开放端口来运行
    MySQL。


    要将 `MySQLscanner.sh` 输入 crontab 文件，像我们之前处理系统备份那样编辑文件来调度它在白天运行，这样在你使用系统时就不会占用资源。执行此操作，在
    crontab 中输入以下行：


    ```text

    00 9 * * * user /share/MySQLscanner.sh

    ```


    我们设置了作业在 `00` 分、第 9 小时、每月的每一天（`*`）、每月（`*`）、每周（`*`）作为普通用户运行。你只需要保存 crontab 文件来调度作业。


    现在，假设你想格外小心，仅在周末和凌晨 2 点运行此扫描器，此时不太有人监控网络流量。你还希望它在 6 月到 8 月之间运行。你的作业现在看起来是：


    ```text

    00 2 * 6-8 0,6 user /share/MySQLscanner.sh

    ```


    你可以将此项添加到 crontab 中：`/etc/crontab`


    与任何其他 `crontab` 不同，当你编辑此文件以及 `/etc/cron.d` 中的文件时，你不需要运行 `crontab` 命令来安装新版本。这些文件也包含用户名字段，而其他
    crontabs 都没有。


    ```text

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

    # m h dom mon dow user command

    17 * * * * root cd / && run-parts --report /etc/cron.hourly

    25 6 * * * root test -x /usr/sbin/anacron II ( cd / && run-parts

    47 6 * * 7 root test -x /usr/sbin/anacron II ( cd / && run-parts)

    52 6 1 * * root test -x /usr/sbin/anacron II ( cd / && run-parts)

    00 * 6-8 0,6 user /share/MySQLscanner.sh

    ```


    现在，`scanner.sh` 将在 6 月、7 月和 8 月的周末凌晨 2 点运行。


    ### crontab 快捷键


    `crontab` 文件有一些你可以使用的快捷键，而不是每次都指定时间、日期月份。这些包括：

    - `@yearly`

    - `@monthly`

    - `@weekly`

    - `@daily`

    - `@midnight`

    - `@reboot`


    所以，如果你想让 MySQL 扫描器每天凌晨运行，可以在 crontab 中添加以下行：


    ```text

    @midnight user /share/MySQLscanner.sh


    ## 使用 Rc 脚本在启动运行时运行


    每当你启动 Linux 系统，都会运行许多脚本为你设置环境。这些被称为 rc 脚本。内核初始化并加载所有模块后，内核启动一个名为 `init.d` 的守护进程。该守护进程随后开始运行
    `/etc/init.d/` 中的许多脚本。这些脚本包含了运行 Linux 系统所需的许多服务。


    ### Linux 运行级别


    Linux 有多个运行级别，指示启动时应该启动服务。例如，运行级别 1 是单用户模式，网络等服务在运行级别 1 下不启动。rc 脚本根据所选的运行级别运行：

    - 0 停止系统

    - 1 单用户/最小模式

    - 2–5 多用户模式

    - 6 重启系统


    ### 将服务添加到 rc.d


    你可以使用 `update-rc.d` 命令为 `rc.d` 脚本添加启动时运行的服务。该命令允许从 `rc.d` 脚本中添加或删除服务。`update-rc.d`
    的语法非常简单；你只需要列出命令，后面跟着脚本名称以及要执行的操作，如下：


    ```bash

    kali >update-rc.d<servicename> <remove|defaults|enable>

    ```


    作为一个如何使用 `update-rc.d` 的示例，假设你总是希望在系统启动时启动 PostgreSQL 数据库，以便你的 Metploit 框架可以使用它来存储渗透测试和黑客结果。你会在
    rc.d 脚本中添加一行，让它在每次启动系统时都运行。


    在此之前，让我们检查系统是否已经运行了 PostgreSQL。你可以使用 `psaux` 命令并管道到使用 `grep` 查找 PostgreSQL 的过滤器，如下：


    ```bash

    kali >psaux|grep postgresql

    root 3876 0.0 0.0 12720 964pts/1 S+ 14.24 0.00 grep postgresql

    ```


    此输出告诉我们，发现的运行 PostgreSQL 的进程只有我们运行查找它的那个命令，因此目前系统中没有运行 PostgreSQL 数据库。


    现在，更新我们的 rc.d 让 PostgreSQL 在启动时自动运行：


    ```bash

    kali >update-rc.d postgres defaults

    ```


    这会将行添加到 rc.d 文件中。你需要重启系统才能使更改生效。完成后，让我们再次使用 `psaux` 命令配合 `grep` 查找 PostgreSQL
    进程：


    ```bash

    kali >psaux|grep postgresql

    postgresql 757 0.0 0.1 287636 25180 ? S March 14 0.00 /usr/lib/postgresql/9.6/bin/postgresql
    -D /var/lib/postgresql/9.6/main -c config

    ```


