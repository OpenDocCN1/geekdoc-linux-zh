    This, therefore, implies that network scanning is among the crucial steps an attacker
    needs to be able to gather information.


    ## Network scanning with `ifconfig`

    The `ifconfig` command is one of the essential tools that can be used for examining
    and interacting with active network interfaces. You can use it to query your active
    network connections by simply entering `ifconfig` in the terminal.


    ## Scanning Wireless Networks with `iwconfig`

    If you have a wireless adapter, you can use the `iwconfig` command to gather crucial
    information for wireless hacking such as the adapter’s IP address, its MAC address,
    what mode it’s in, and more. The information you can glean from this command is
    particularly important when you’re using wireless hacking tools like `aircrack-ng`.


    ## Changing your network information

    Being able to change your IP address and other network information is a useful
    skill because it will help you access other networks while appearing as a trusted
    device on those networks. For example, in a denial of service (DoS) attack, you
    can spoof your IP so that the attack appears to come from another source, thus
    helping you evade IP capture during forensic analysis. This is a relatively simple
    task in Linux, and it’s done with the `ifconfig` command.


    ### Changing Your IP Address

    To change your IP address, enter `ifconfig` followed by the interface you want
    to reassign and the new IP address you want to be assigned to that interface.
    For example, to assign the IP address `192.168.181.115` to interface `eth0`, you
    would enter the following:


    ```bash

    Kali >ifconfig eth0 192.168.181.115

    ```

    When you do this correctly, Linux will go back to the command prompt and say nothing.
    This is a good thing! Then, when you again check your network connections with
    `ifconfig`, you should see that your IP address has changed to the new IP address
    you just assigned.


    ### Changing Your Network Mask and Broadcast Address

    You can also change your network mask (`netmask`) and broadcast address with the
    `ifconfig` command. For instance, if you want to assign that same `eth0` interface
    with a netmask of `255.255.0.0` and a broadcast address of `192.168.1.255`, you
    would enter the following:


    ```bash

    Kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    ```

    Once again, if you’ve done everything correctly, Linux responds with a new command
    prompt. Now enter `ifconfig` again to verify that each of the parameters has been
    changed accordingly.


    ### Spoofing Your MAC Address

    You can also use `ifconfig` to change your MAC address. The MAC address is globally
    unique and is often used as a security measure to keep hackers out of networks—or
    to trace them. Changing your MAC address to spoof a different MAC address is almost
    trivial and neutralizes those security measures. Thus, it’s an instrumental technique
    for bypassing network access controls. To spoof your MAC address, use the `ifconfig`
    command’s `down` option to take down the interface (`eth0` in this case). Then
    enter the `ifconfig` command followed by the interface name (`hw` for hardware,
    `ether` for Ethernet) and the new spoofed MAC address. Finally, bring the interface
    back up with the `up` option for the change to take place.


    ## IP Addresses assignment

    Linux has a Dynamic Host Configuration Protocol (DHCP) server that runs a daemon,
    a process that runs in the background, called `dhcpd`, or the `dhcp` daemon. The
    DHCP server will carry out the assignment of IP addresses to all of the systems
    that are located on the subnet. It also keeps a log of which IP address is allocated
    to which machine at any one time. This makes it an excellent resource for forensic
    analysts to trace hackers after an attack. For that reason, it’s useful to understand
    how the DHCP server works. Usually, to connect to the internet from a LAN, you
    must have a DHCP-assigned IP. Therefore, after setting a static IP address, you
    must return and get a new DHCP-assigned IP address. To do this, you can always
    reboot your system, but I will show you how to retrieve a new DHCP without having
    to shut your system down and restart it. To request an IP address from DHCP, all
    that is required is to call the DHCP server using `dhclient` followed by an interface
    that you wish to assign the address. The different Linux distros use different
    DHCP clients. Kali, for instance, is based on Debian that uses `dhclient`.


    ## Manipulating the Domain Name System (DNS)

    Hackers can find a treasure trove of information on a target in its Domain Name
    System (DNS). DNS is a critical component of the internet, and although it’s designed
    to translate domain names to IP addresses, a hacker can use it to garner information
    on the target.


    ### Examining DNS with `dig`

    DNS is the service that translates a domain name like `google.com` to the appropriate
    IP address. This way, your system knows how to get to it. Without DNS, it would
    mean that we would be required to remember the thousands of IP addresses that
    belong to the websites we visit frequently. `dig` is one of the commands any aspiring
    hacker needs to know. It offers a way to gather DNS information about a target
    domain. The stored DNS information can be a crucial piece of early reconnaissance
    to obtain before attacking. This information could include the IP address of the
    target’s nameserver (the server that translates the target’s name to an IP address),
    the target’s email server, and potentially any subdomains and IP addresses. You
    can also use the `dig` command to get information on email servers connected to
    a domain by adding the `mx` option (`mx` is short for mail exchange server). This
    information is critical for attacks on email systems.


    ### Changing Your DNS Server

    In some cases, you may want to use another DNS server. To do so, you will edit
    a plaintext file named `/etc/resolv.conf` on the system. Open that file in a text
    editor. Then, on your command line, enter the precise name of your editor followed
    by the location of the file and the filename.


    ## Wi-Fi Networks

    Firstly, let us look at WiFi. Before doing so, here is a small introduction to
    the various WiFi security protocols that usually are frequently used. The original,
    Wired Equivalent Privacy (WEP), was severely flawed and easily cracked. Its replacement,
    WiFi Protected Access (WPA), was a bit more secure. Finally, WPA2PSK, which is
    much more secure and uses a preshared key (PSK) that all users share, is now used
    by nearly all WiFi AP’s (except enterprise WiFi).


    ## Basic Wireless commands

    ### `ifconfig`

    To perform a network interface configuration in Unix-based operating systems,
    one needs `ifconfig`. It is an administration utility that is found in the system.
    `ifconfig` has utilities that are utilized in the configuration, querying, and
    controlling of the parameters of the TCP/IP interface. As an interactive tool,
    `ifconfig` can be used to show settings of the network interface and analyze them.


    In summary, `ifconfig` does the following:


    *   The command enables the viewing of settings of a network.

    *   Carrying out enabling of a network Interface and also disabling it

    *   Network Interface IP address assigning

    *   Assigning network interfaces a netmask

    *   Allocating a Broadcast to Network Interface

    *   Assigning an IP, Netmask, and Broadcast to Network Interface

    *   Changing MTU for a Network Interface

    *   Enabling and disabling Promiscuous Mode

    *   Addition and removal of New Alias to Network Interface

    *   Changing the MAC address of Network Interface

