    你还可以告诉 bash 在哪里找到程序脚本，假设它不在你的 `$PATH` 包含的任何目录中。可以通过在脚本名称或程序前面包含相对路径或绝对路径来实现。请不要忘记点（`.`）指的是你当前所在的目录。假设脚本位于主目录，你可以通过使用绝对路径来执行它。


    ### Shebang (#!)


    从上面的脚本中，我们可以看到它出现在第一行。井号（#）和感叹号（!）的字符序列（`#!）被称为 Shebang。Shebang 之后的是指向程序或解释器的路径，由该程序负责执行文本文件的剩余部分。在这里确保格式正确至关重要。Shebang
    必须放置在文件的第一行。让我重复一遍，`#!` 必须插入到文件的第 1 行。


    另一个需要注意的点是，在符号 `#`、标记 `!` 和解释器路径之间不应该有空格。此外，省略 shebang 也是不明智的，因为 Bash Shell 会默认假设它是一个
    Bash 脚本。这意味着它只有在脚本运行于 Bash Shell 的这种假设下才能工作，而这并非完全真实。这是一种非常危险的情况。


    ### Bash 脚本格式


    格式是 bash 脚本中的一个重要领域，在许多领域都需要为了确保脚本的正常运行。命令之间是否存在空格可能会导致其能够工作或拒绝工作。在你的编码练习中，熟悉此问题是至重要的。这种类型的脚本编写的设计初衷是作为界面，让用户能够与系统进行交互。后来，bash
    作为脚本工具的能力不断增强。这些改进最初是根据用户需求提出的，然后脚本功能也围绕各种用户需求进行了开发。我知道让一段编写精良的代码运行失败是很令人恼的。


    另一个格式要求是代码的缩进。你可能已经知道，对于代码运行来说并不是强制要求的，但它的作用是确保代码的可读性。它也有助于避免简单的错误。


    ### 第 4 章：网络安全


    ![Comunicazione, Social Network, Contatto, Globo](img/rsrc1N5.jpg)


    我们在互联网上做的几乎每件事都会被追踪。无论是谁在进行追踪，无论是 Google 跟踪我们的在线搜索、网站访问和电子邮件，还是国家安全局 (NSA) 编目录我们所有的活动，我们所有的在线动态都会被记录、索引，然后为了某人的利益进行挖掘。普通个人，特别是黑客，需要了解如何限制这种跟踪并在网络上保持相对匿名，以限制这种无处不在的监控。在本章中，我们将研究如何使用四种方法匿名地浏览万维网（或尽可能接近匿名）：


    * 洋葱网络 (The Onion Network)

    * 代理服务器 (Proxy servers)

    * 虚拟专用网络 (Virtual private networks)

    * 私密加密电子邮件

    '
