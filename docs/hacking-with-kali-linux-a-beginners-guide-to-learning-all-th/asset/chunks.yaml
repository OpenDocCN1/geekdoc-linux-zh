    \ transmitting data over the internet.\n- `IPsec` provides us with authentication\
    \ without there being any encryption.\n- It does the safeguarding of data on the\
    \ network through the creation of circuits using `IPsec` tunneling. This works\
    \ just like the Virtual Private Network.\n\n## IP Security Components\n\nBelow\
    \ are some of the components that comprise an `IPsec`:\n\n1. Internet Key Exchange\
    \ (`IKE`) – This is a protocol for network security that has been designed to\
    \ exchange encryption keys dynamically as well as bypass the Security Association\
    \ (`SA`) between two devices. `SA` is used for the establishment of security attributes\
    \ that are shared between any two network elements. These attributes are what\
    \ support secure communications. Additionally, `IKE` offers protection to contents\
    \ of messages plus an open frame that can be used for the implementation of standard\
    \ algorithms, for instance, `MD5` and `SHA`.\n\n2. Encapsulating Security Payload\
    \ (`ESP`) – This is used to ensure data integrity, authentication, anti-replay,\
    \ and encryption. `ESP` also does payload authentication.\n\n3. Authentication\
    \ Header (`AH`) – `IPsec` uses an authentication header to ensure there is data\
    \ integrity, anti-replay, and authentication. An authentication header, however,\
    \ does not offer encryption. The anti-replay protection function is used to guard\
    \ against unauthorized packet transmission, but it does not keep the data confidential.\n\
    \n## The Operation of IP Security\n\n1. First, a host will check to see if a packet\
    \ needs to be send using `IPsec` or not. It is the traffic of the packets that\
    \ trigger the security policy on their own.\n2. Phase 1 of the internet key exchange\
    \ begins with the two hosts that are utilizing `IPsec` authenticating themselves\
    \ to each other. That will start a secure channel. Here, we have two modes:\n\
    \    - The Main mode which is used for the provision of the greater security and;\n\
    \    - The Aggressive mode that makes a host be able to create an `IPsec` circuit\
    \ expeditiously.\n3. Using the above channel (established in step 2), negotiation\
    \ on the manner in which the `IP` circuit will encrypt data across the `IP` circuit\
    \ will be done.\n4. After that, the Phase 2 internet key exchange happens over\
    \ the secure channel that was negotiated.\n5. Data exchanged is then carried out\
    \ over the newly established `IPsec` encrypted tunnel. Encryption and decryption\
    \ of packets are carried out by the hosts through `IPsec` `SAs`.\n6. Upon the\
    \ completion of communication, or time-out of a session between the hosts, the\
    \ `IPsec` tunnel will be terminated. Both the hosts will discard the keys.\n\n\
    ## Chapter 5: Social Engineering\n\nSocial engineering is increasingly becoming\
    \ a major threat to virtual entities and is also becoming an effective vector\
    \ with which to attack information systems. Most services in use today lay a good\
    \ foundation for sophisticated social engineering attacks. In every major institution\
    \ worldwide, the trend is towards bringing your own device to the workplaces,\
    \ schools and social places. That may appear an effective way of enabling communication\
    \ and collaboration in environments that are private or business in nature. This\
    \ policy has aggravated this problem to a terrifying extent.\n\nGlobal organizations\
    \ are no longer staffing geographically but rather use a just-in-time strategy\
    \ to cater to their staffing demands. Consequently, we have seen personal interaction\
    \ decreasing as it is being replaced by a plethora of tools that have bridged\
    \ the communication gap. These tools can be e-mail, `Skype`, and many more. All\
    \ this has resulted in new vectors of attack for social engineering attacks. When\
    \ social engineering attacks are combined together with zero-day-exploits, they\
    \ have the potential to be a deadly weapon. This mechanism is what is commonly\
    \ used by `APTs`, that is, advanced persistent threats.\n\n### What is Social\
    \ Engineering?\n\nWe define social engineering as a broad range of activities\
    \ that are malicious in nature that is accomplished via human interactions. This\
    \ type of attack employs the use of psychological manipulation for purposes of\
    \ tricking the users into giving away sensitive information or making security-related\
    \ mistakes. Usually, social engineering attacks are carried out in a number of\
    \ steps.\n\nAs usual, a perpetrator will initially carry out a reconnaissance\
    \ on the intended victim to enable them to collect necessary information on their\
    \ background. That background information may include identification of potential\
    \ entry points and weak security protocols. This step is essential as it will\
    \ dictate how the attack will proceed. Thereafter, an attacker will speedily move\
    \ to win the victim’s trust plus offer appealing incentives for subsequent actions\
    \ that go against the laid down security practices, like exposing information\
    \ that is sensitive or granting access to resources that are critical. These attacks\
    \ are deadly due to their reliance on errors committed by humans instead of the\
    \ vulnerabilities in the operating systems or the software. The human-made mistakes\
    \ have a characteristic of being less predictable, thus making them difficult\
    \ to pinpoint and guard against as compared to an intrusion that is malware-based.\n\
    \n### Techniques for Attacks used by Social engineering\n\nThese types of attacks\
    \ can be in multiple and different forms. As long as there is human interaction\
    \ is involved, a social engineering attack can be carried out. Let us look at\
    \ the following five commonly perpetrated social engineering attacks.\n\n####\
    \ Pretexting\n\nAn attacker will attempt to gain access to information by a sequence\
    \ of cleverly crafted lies. Pretexting is in most cases started by a perpetrator\
    \ pretending that they require some crucial information from an unsuspecting victim\
    \ to do a task that is critical. The attacker commences by building or winning\
    \ the trust of their victim by impersonating police, bank officials, tax officials,\
    \ co-workers or any other person with a right-to-know authority. The pretexter\
    \ will then ask questions that will require a user to confirm their identity.\
    \ This way, an attacker is able to collect critical personal data.\n\n#### Phishing\n\
    \nPopular phishing scams are in the form of text message and email campaigns that\
    \ are meant to create a feeling of curiosity, compelling urgency or even instill\
    \ fear in potential casualties. The victims are then prodded into disclosing information\
    \ that is deemed sensitive, following the links to malicious websites by clicking\
    \ on them, or by downloading and opening unknown attachments containing malware.\
    \ For instance, users of a particular online service can send an email to alerts\
    \ them of a policy violation that requires an action to be done on their part.\
    \ An example of such an action is a password change. Upon clicking the link, the\
    \ user will be redirected to an illegitimate website that is almost identical\
    \ in every aspect as the legitimate one, prompting an unsuspecting user to input\
    \ his/her credentials to the website. That information is sent to the attacker\
    \ once the form is submitted.\n\n#### Baiting\n\nThis type of attack utilizes\
    \ a false promise to capitalize on a victim’s curiosity or greed, mostly greed.\
    \ Users are lured into a trap which leads to stealing their personal information.\
    \ Also, malware can be sent to their systems this way. The most reviled form of\
    \ baiting uses physical media to disperse malware. For instance, attackers leave\
    \ the bait, typically malware-infected flash drives, in areas where potential\
    \ victims are likely to see them. The bait has an authentic look to it. Victims\
    \ who are unsuspecting take up the bait due to curiosity. Afterward, they are\
    \ likely to insert the device into a computer either at work or at home. This\
    \ will lead to the automatic installation of malware on the system.\n\n#### Scareware\n"
