    ## Description


    ### Introduction

    This book is not intended for the experienced hacker or the experienced Linux
    admin. Instead, it is intended for those who want to get started along the exciting
    path of hacking, cybersecurity, and pen testing. It is also intended not as a
    complete treatise on Linux or hacking, but rather a starting point into these
    worlds. It begins with the essentials of Linux and extends into some basic scripting
    in both `bash` and `Python`. Wherever appropriate, I have tried to use examples
    from the world of hacking to teach Linux principles.


    In this introduction, we’ll look at the growth of ethical hacking for information
    security, and I’ll take you through the process of installing a virtual machine,
    so you can install Kali Linux on your system without disturbing the operating
    system you are already running.


    ## Chapter 1: Brief Overview of Hacking

    ![](Computer, Sicurezza, Lucchetto, Di Hacker, L''Hacking](rsrc1M9.jpg)


    ### Hacking Definition

    This is a process of identification of flaws that are present in a given network
    or computer systems that can be used to exploit its weaknesses to gain access.


    An excellent hacking example is employing the use of a password cracking algorithm
    to secure entry into a system. In this age, computers are indispensable when it
    comes to running successful businesses. Additionally, computers need to be networked
    to be able to facilitate the exchange of communication with other external businesses.
    This means that isolated computer systems, on their own, are not enough. By networking
    them, it means that we are exposing them to the outside world, and thus making
    it possible for them to get hacked. Hacking essentially implies the use of computers
    to carry out malicious acts, for instance, stealing personal or corporate data,
    privacy invasion, fraud, and so on. Cybercrimes are known to cost organizations
    all around the world millions of dollars each year.


    It is, therefore, prudent that businesses protect themselves against such attacks.
    Most of the hacking worldwide are carried out with criminal intent. This can range
    from committing some form of fraud to ruining the reputation of the targeted organization.
    Hackers can steal crucial data, embezzle funds, and even spread misleading or
    malicious information that can be detrimental socially. Hacking is a crime and
    is, in most jurisdictions, punishable by law. In spite of this, there is a form
    of hacking that is considered beneficial. This is done by professionals, government
    law agencies, and other accredited institutions. Primarily, they intend to counter
    the malevolent intent of malicious hackers. This way, it is possible to safeguard
    systems against harm. The protection and safety of the general society and its
    citizens can be achieved by this type of professional hacking, otherwise known
    as ethical hacking.


    ### Common Hacker Attacks

    The following are the most common types of hacker attacks against computers and
    networks.


    1. **Denial of Service (DoS) Attack**


    A websites’ server can get overloaded when it is flooded by traffic more than
    it can handle. Picture this, a road designed to handle traffic from a small town
    can quickly get gridlocked when there is an influx of external traffic. The users
    will experience massive delays, and the inconvenience will be great. This is how
    a denial of service attack affect websites. The additional traffic on the site
    will make it impossible to provide service to visitors who are trying to access
    it. A practical example is a newspaper’s website carrying breaking news. Many
    people will try to access it to find out more consequently overloading the site.
    In a DoS attack, however, the overloaded traffic is ordinarily malicious. The
    intention is to shut down the website from its legitimate users. A Distributed
    Denial-of-Service Attack (DDoS) is an attack carried out by many computers at
    the same time. It is challenging to cope with this type of attack since the IP
    addresses will appear to be originating from many different locations around the
    world simultaneously. This means that it is difficult to determine the source
    of attack by network administrators.


    2. **Cross-Site Scripting (XSS)**

