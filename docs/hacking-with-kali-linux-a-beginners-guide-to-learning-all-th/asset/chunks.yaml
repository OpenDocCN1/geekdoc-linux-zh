    does not have to be in discovery mode to be scanned. The syntax is as follows:sdptool
    browse MACaddressSeeing Whether the Devices Are Reachable with l2pingOnce we have
    gathered the MAC addresses of all nearby devices, we can send out pings to these
    devices, whether they are in discovery mode or not, to see whether they are in
    reach. This lets us know whether they are active and within range. To send out
    a ping, we use the l2ping command with the following syntax:l2ping MACaddressSummaryWireless
    devices represent the future of connectivity and hacking. Linux has developed
    specialized commands for scanning and connecting to Wi-Fi APs in the first step
    toward hacking those systems. The aircrack-ng suite of wireless hacking tools
    includes both airmon-ng and airodump-ng, which enable us to scan and gather vital
    information from in-range wireless devices. The BlueZ suite includes hciconfig,
    hcitool, and other tools capable of scanning and information gathering, which
    are necessary for hacking the Bluetooth devices within range. It also includes
    many other tools worth exploring.Chapter 7: Cryptography![Analitica, Informazioni,
    Innovazione, Comunicazione](rsrc1N8.jpg)There are so much mathematics and algorithms
    in encryption, and that is a topic we would not rather venture into at this point.
    The explanations will be quite simple and surprisingly easy to understand. We
    are going to look at the basic concepts and terminologies so that you will be
    in a position to know some related topics whenever they come up. These include
    wireless cracking, password cracking, encryption technologies, and hashing. My
    intention, however, is not to make a cryptographer out of you here. It is a skill
    that requires time to hone, but to help familiarize the beginner with the terms
    and concepts of cryptography to help you become a credible hacker.A Word About
    Key SizeKey size matters a lot when it comes to cryptography. More secure encryptions
    have larger keys. A 256-bit key AES is therefore much stronger as compared to
    a 128-bit key AES. That means it is also much difficult to break it. It suffices
    to say that in encryption that employs the use of a similar algorithm, the larger
    the size of the key, the stronger the encryption will be. However, note that the
    encryptions’ strength is based on the key size and the specifics of the algorithm
    as well. This, therefore, does not imply that larger keys denote stronger encryption
    between the various encryption algorithms. Let''s get started by breaking encryption
    into categories.Types of CryptographyBelow are the kinds of encryptions we are
    going to concentrate on in this book.


    *   Asymmetric Encryption


    *   Symmetric Encryption'
