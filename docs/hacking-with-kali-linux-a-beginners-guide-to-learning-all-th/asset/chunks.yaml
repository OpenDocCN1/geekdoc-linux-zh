    # 5 天周的 0–7


    所以，如果我们写了一个脚本来扫描全球有漏洞的开放端口，并希望它在每天周一至周五的 凌晨 2:30 运行，我们可以在 `crontab` 文件中对其进行调度。稍后我们将介绍如何将这些信息放入
    `crontab` 的过程，但首先，让我们讨论一下我们需要遵循的格式，如列表 16-1 所示。


    ```text

    M H DOM MON DOW USER COMMAND

    30 2 * * 1-5 root /root/myscanningscript own

    ```


    列表 16-1: 调度命令的格式


    `crontab` 文件贴心地地为你标记了各个列。请注意，第一个字段提供分钟（`30`），第二个字段提供小时（`2`），第五个字段提供日期（`1-5`，或周一到周五），第六个字段定义用户（`root`），第七个字段是脚本的路径。第三和第四字段包含星号（`*`），因为我们希望这个脚本在周一到周五的每天运行，无论是哪月的哪一天。


    在列表 16-1 中，第五个字段通过在数字之间使用连字符（`-`）定义了一个周范围。如果你想在周的多个不连续日期执行脚本，可以使用逗号（`,`）分隔这些日期。例如，周二和周四。


    要编辑 `crontab`，你可以运行 `crontab` 命令并后接 `-e`（编辑）选项：


    ```bash

    kali >crontab-e

    ```


    选择一个编辑器。如果以后想更改，请运行 `select-editor`：


    ```text

    ./bin/nano easiest/usr/bin/mcedit/usr/bin/vim.basic/usr/bin/vim.gtk/usr/bin/vim.tiny
    Choose 1-5 [1]:

    ```


    当你第一次运行此命令时，它会询问你想使用哪种编辑器。默认是 `/bin/nano`，即第 1 个选项。如果你选择此选项，它将直接打开 crontab。


    另一个选项（而且对 Linux 初学者来说通常更好）是直接在你喜欢的文本编辑器中打开 `crontab`，你可以这样操作：


    ```bash

    kali >leafpad/etc/crontab

    ```


    我使用过这个命令在 Leafpad 中打开 crontab。你可以在列表 16-2 中看到文件的片段。


    /etc/crontab: 级级 crontab


    与任何其他 `crontab` 不同，当你编辑此文件以及 `/etc/cron.d` 中的这些文件时，你不需要运行 `crontab` 命令来安装新版本。这些文件也包含用户名字段，而其他
    crontabs 都不包含。


    ```text

    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

    # m h dom mon dow user command

    17 * * * * root cd / && run-parts --report /etc/cron.hourly

    25 6 * * * root test -x /usr/sbin/anacron II ( cd / && run-parts

    47 6 * * 7 root test -x /usr/sbin/anacron II ( cd / && run-parts)

    52 6 1 * * root test -x /usr/sbin/anacron II ( cd / && run-parts)

    ```

