- fmt: '

    This command lists both the files and directories contained in the directory.
    You can also use this command on any particular directory, not just the one you
    are currently in, by listing the directory name after the command; for example,
    `ls/etc` shows what’s in the `/etc` directory.


    To get more information about the files and directories, such as their permissions,
    owner, size, and when they were last modified, you can add the `-l` switch after
    `ls` (the `l` stands for long). This is often referred to as long listing. Let’s
    try it here:


    As you can see, `ls -l` provides us with significantly more information, such
    as whether an object is a file or directory, the number of links, the owner, the
    group, its size, when it was created or modified, and its name. I typically add
    the `-l` switch whenever doing a listing in Linux but to each their own.


    Some files in Linux are hidden and won’t be revealed by a simple `ls` or `ls -l`
    command. To show hidden files, add a lowercase `-a` switch, like so: `kali >ls
    -la`. If you aren’t seeing a file you expect to see, it’s worth trying `ls` with
    the `a` flag.


    ### Getting Help

    Nearly every command, application, or utility has a dedicated help file in Linux
    that provides guidance for its use. For instance, if I needed help using the best
    wireless cracking tool, `aircrack-ng`, I could simply type the `aircrack-ng` command
    followed by the `--help` command: `kali >aircrack-ng--help`. Note the double dash
    here. The convention in Linux is to use a double dash (`--`) before word options,
    such as help, and a single dash (`-`) before single-letter options, such as `-h`.


    When you enter this command, you should see a short description of the tool and
    guidance on how to use it. In some cases, you can use either `-h` or `-?` to get
    to the help file. Unfortunately, although many applications support all three
    options (`--help`, `-h`, and `-?`), there’s no guarantee the application you’re
    using will. So if one option doesn’t work, try another.


    ### Referencing Manual Pages with man

    In addition to the help switch, most commands and applications have a manual (`man`)
    page with more information, such as a description and synopsis of the command
    or application. You can view a man page by simply typing `man` before the command,
    utility, or application. To see the man page for `aircrack-ng`, for example, you
    would enter the following:


    `man aircrack-ng`


    This opens the manual for `aircrack-ng`, providing you with more detailed information
    than the helps. You can scroll through this manual file using the `ENTER` key,
    or you can page up and down using the `PG DN` and `PG UP` keys, respectively.
    To exit, simply enter `q` (for quit), and you’ll return to the command prompt.


    ### Finding Stuff

    Until you become familiar with Linux, it can be frustrating to find your way around,
    but knowledge of a few basic commands and techniques will go a long way toward
    making the command line much friendlier. The following commands help you locate
    things from the terminal.


    #### Searching with locate

    Probably the easiest command to use is `locate`. Followed by a keyword denoting
    what it is you want to find, this command will go through your entire filesystem
    and locate every occurrence of that word. To look for `aircrack-ng`, for example,
    enter the following:


    `kali >locateaircrack-ng`

    `/usr/bin/aircrack-ng/usr/share/applications/kali-aircrack-ng.desktop/usr/share/desktop-directories/05-1-01-aircrack-ng.directory--snip--/var/lib/dpkg/info/aircrack-ng.md`


    The `locate` command is not perfect, however. Sometimes, the results of `locate`
    can be overwhelming, giving you too much information. Also, `locate` uses a database
    that is usually only updated once a day, so if you just created a file a few minutes
    or a few hours ago, it might not appear in this list until the next day. It’s
    worth knowing the disadvantages of these basic commands so you can better decide
    when best to use each one.


    #### Finding Binaries with whereis

    If you’re looking for a binary file, you can use the `whereis` command to locate
    it. This command returns not only the location of the binary but also its source
    and man page if they are available. Here’s an example:


    `kali >whereisaircrack-ng`

    `aircrack-ng: /usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz`


    In this case, `whereis` returned just the `aircrack-ng` binaries and man page,
    rather than every occurrence of the word `aircrack-ng`. Much more efficient and
    illuminating, don’t you think?


    #### Finding Binaries in the PATH Variable with which

    The `which` command is even more specific: it only returns the location of the
    binaries in the `PATH` variable in Linux. We’ll look more closely at the `PATH`
    variable in Chapter 7, but for now, it’s sufficient to know that `PATH` holds
    the directories in which the operating system looks for the commands you execute
    at the command line. For example, when I enter `aircrack-ng` on the command line,
    the operating system looks to the `PATH` variable to see in which directories
    it should look for `aircrack-ng`:


    `kali >whichaircrack-ng`

    `/usr/bin/aircrack-ng`


    Here, `which` was able to find a single binary file in the directories listed
    in the `PATH` variable. At a minimum, these directories usually include `/usr/bin`,
    but may include `/usr/sbin` and maybe a few others.


    #### Performing More Powerful Searches with find

    The `find` command is the most powerful and flexible of the searching utilities.
    It is capable of beginning your search in any designated directory and looking
    for a number of different parameters, including, of course, the filename but also
    the date of creation or modification, the owner, the group, permissions, and the
    size.


    Here’s the basic syntax for `find`:

    `find directory options expression`


    So, if I wanted to search for a file with the name `apache2` (the open-source
    webserver) starting in the root directory, I would enter the following:


    `kali >find/ -type f -name apache2`


    First, I state the directory in which to start the search, in this case, `/`.
    Then I specify which type of file to search for, in this case, `f` for an ordinary
    file. Last, I give the name of the file I’m searching for, in this case, `apache2`.


    My results for this search are shown here:


    `kali >find / -type f -name apache2`

    `/usr/lib/apache2/mpm_itk/apache2`

    `/usr/lib/apache2/mpm_event/apache2`

    `/usr/lib/apache2/mpm_worker/apache2`

    `/usr/lib/apache2/mpm_prefork/apache2`

    `/etc/cron.daily/apache2`

    `/etc/logrotate.d/apache2`

    `/etc/init.d/apache2`

    `/etc/default/apache2`


    The `find` command started at the top of the filesystem (`/`), went through every
    directory looking for `apache2` in the filename, and then listed all instances
    found.


    As you might imagine, a search that looks in every directory can be slow. One
    way to speed it up is to look only in the directory where you would expect to
    find the file. In this case, we are looking for a configuration file, so we could
    start the search in the `/etc` directory, and Linux would only search as far as
    its subdirectories. Let’s try it:


    `kali >find /etc -type f -name apache2`

    `/etc/init.d/apache2`

    `/etc/logrotate.d/apache2`

    `/etc/cron.daily/apache2`


    This much quicker search found occurrences of `apache2` in the `/etc` directory
    and its subdirectories. It’s also important to note that unlike some other commands,
    `find` only displays exact matches. If the file `apache2` has an extension, such
    as `apache2.conf`, the search will not find a match. We can remedy this limitation
    by using wildcards, which enable us to match multiple characters. Wildcards come
    in a few forms: `*`. Let’s look in the `/etc` directory for all files that begin
    with `apache2` and have any extension:


    `kali >find /etc -type f --name apache2.*`

    `/etc/apache2.conf`


    When we run this command, we find there is one file in the `/etc` directory that
    fits `apache2.*`. When we use a period followed by a wildcard, the terminal looks
    for an extension after the filename. This can be a very useful technique for finding
    files where you don’t know the file extension. When I run this command, I find
    files that start with `apache2` in the `/etc` directory, including `apache2.conf`.


    ### Chapter 3: Hardware Hacking Using Linux

    As you begin your journey towards being a hacker, you will realize that most professional
    and expert hackers use Linux/Unix. That aside, there are types of hacks where
    Mac OS and Windows can be used. Usually, when applications are developed in Linux
    and later ported to Windows, they always lose some of their capabilities. This
    is the reason that many hacker tools are designed and built for Linux.


    Why Hackers use Linux

    Below are some reasons why hackers prefer Linux:


    1. **Linux is Open Source**: Unlike the Windows operating system, Linux distribution
    is open source. A Linux user has access to the source code. This means one can
    manipulate and change the operating system to suit their needs.

    2. **Linux is Transparent**: A thorough understanding of the operating system
    is required to carry out hacking. Unlike Windows, we can see and even manipulate
    all the working parts of Linux. The transparency aspect means working with Linux
    is effective.

    3. **Linux Offers Granular Control**: A Linux user has infinite control over the
    system, i.e., it is granular. Everything in Linux, both at the minuscule and macro
    level, is controlled by the user. This is simple and effective.

    4. **Most Hacking Tools are Written for Linux**: A majority of tools used in hacking
    are written explicitly for Linux. Some are available for the Windows platform
    but they offer limited functionalities.

    5. **The Future Belongs to Linux/Unix**: Over the years, you may have witnessed
    that Windows is slowing down. Linux is still the choice for web servers because
    of its reliability, robustness, and stability.


    What is Kali Linux?

    Kali Linux is a distribution of the Debian family. It was designed and developed
    solely for Security Auditing and Penetration Testing. The distro comprises hundreds
    of tools and utilities focused on information security tasks which may include
    Reverse Engineering, Penetration Testing, Computer Forensics, and Security research.
    Offensive Security is the organization behind Kali Linux. It developed and maintains
    Kali.


    This distribution was initially launched in March 2013 as a total rebuild of BackTrack
    Linux. It adhered to Debian development standards. Kali Linux boasts over 600
    tools that can be used for penetration testing. After a thorough review of BackTrack,
    some tools that did not work or were duplicate were eliminated. From the Kali
    Tools site, let us look at some the details:


    - **Kali Linux will always be free**: Just like BackTrack, kali is free of charge
    and always will be. This implies that you are not going to pay for it at any time
    or in the future.

    - **It is Open source**: The source code Kali Linux uses is available to everyone
    that wants to improve, modify, or rebuild packages.

    - **Kali complies with FHS**: The distribution follows the Filesystem Hierarchy
    Standard. The standards help the users of Linux to locate files, binaries, and
    libraries seamlessly.

    - **Support a wide range of wireless devices**: The system is designed with multiple
    platforms to support wireless interfaces. It can run on a wide range of hardware.

    - **The kernel is customized and is patched for injection**: Latest injection
    patches are included in the Kali Linux kernel.

    - **It was created in an environment that is secure**: The team tasked with the
    development of Kali is a small group of individuals trusted to commit packages
    and interact with the repositories. Secure protocols are used in these processes.

    - **GPG signed repositories and packages**: All packages in Kali Linux are usually
    signed by the individual developers. The packages are subsequently signed by the
    repositories as well.

    - **Support for Multiple languages**: Most penetration tools and utilities are
    often written in English. Kali, notwithstanding, offers true multilingual support.
    Users are, able to operate in their native languages.

    - **Kali is easily customizable**: All users can modify Kali to their requirements
    and preferences.


    Downloading Kali Linux

    Before I take you down the road towards being a hacker, you will first be required
    to download and install Kali Linux on your computer. This is the distribution
    of Linux that we shall be using throughout this book. That can be done from https://www.kali.org/.
    Navigate to the home page and hit the Downloads link located at the top of the
    page. It is important that the right download is selected.


    The Procedure for Installing Kali and Setting Up Kali Linux

    To start us off, you will need to boot using your preferred medium of installation.
    You should be greeted with the Kali Boot screen. Choose either Text-Mode or Graphical
    install. In this example, we chose a GUI install.


    Choose your language preference together with your country location. Also, you
    will be prompted to select your preferred keyboard layout. Select your location.
    The installer will copy the image to your hard disk, probe your network interfaces,
    and then prompt you to enter a hostname for your system. In the example below,
    we’ve entered `kali` as our hostname.


    Next, provide a full name for a non-root user for the system. A default user ID
    will be created, based on the full name you provided. You can change this if you
    like. After that, pick an appropriate time zone. Next, you will see something
    similar to the picture below. Select appropriately. Choose the disk you want to
    be partitioned. Continue to the next step below, selecting a choice depending
    on your needs. Next, hit the Continue button. The next step requires you to carry
    out a configuration of network mirrors. Next, install GRUB. Finally, click Continue
    to reboot into your new Kali installation.


