    `iwlist` 命令可用于扫描可用的无线网络，还可以显示使用 `iwconfig` 命令时未显示的任何关于无线网络的其他信息。`iwlist` 用于生成附近的无线接入点及其
    SSID 和 MAC 地址。


    `iwspy` 命令用于监控网络中的节点。它也可以用于记录节点的链路质量。


    `ifrename` 命令用于根据多个静态准则重命名无线网络接口，以便为每个接口分配分配一致的名称。接口名称默认通常是动态的。此命令帮助用户决定网络接口的名称。该命令需要在启动接口之前执行。


    `iwgetid` 此命令用于报告当前正在使用的无线网络的 NWID、ESSID 或接入点地址。默认情况下，`iwgetid` 会显示设备的 ESSID。假设其不可用，它将改为输出
    NWID。报告的信息与 `iwconfig` 显示的相同。相比之下，在各种脚本中进行集成会更加容易。


    # 检测和连接蓝牙


    在最近，几乎所有的小型设备、系统和设备都内置了蓝牙。这些设备可以是电脑、iPod、智能手机、扬声器、游戏控制器、键盘、平板电脑等。攻入蓝牙网络可能导致设备上的信息被泄露（假设控制了设备），并获取一个在设备进出传输权限信息的平台等。因此，如果我们想要利用这项技术，就需要了解蓝牙是如何工作的。通过此本书，你将获得一些基础知识，这些知识在准备黑客时扫描和连接蓝牙设备期间将非常帮助。


    ## 蓝牙的工作原理


    首先，我们可以将蓝牙定义为一种无线通信技术，允许设备无线地传输语音或数据。这发生在较短的距离。这项技术旨在取代连接设备的无处不在的电缆，同时确保跨通信的安全。两个蓝牙设备连接的过程被称为配对。只要任何两个设备都设置为可发现模式，就可以进行配对。在可发现模式下，蓝牙设备将广播关于它们的以下信息：


    - 技术信息

    - 名称

    - 服务列表

    - 类别


    配对后，两个蓝牙设备将交换一个链路密钥。设备将存储该密钥，以便在未来的配对中识别另一个设备。每个设备都有一个唯一的标识符，并且通常有一个制造商指定的名称。当我们想要识别和访问设备时，这些将是很有用的数据。


    ## 蓝牙扫描与侦察


    Linux 有一个名为 `BlueZ` 的蓝牙协议栈实现，我们将用它来扫描蓝牙信号。大多数 Linux 发行版（包括 Kali Linux）默认将其作为内置功能。`BlueZ`
    拥有可以帮助我们扫描和管理具备蓝牙能力的工具。工具的示例概述如下：


    - `hciconfig`：这是 Linux 中 `ifconfig` 的等效工具，但是为蓝牙能力设备设计的。

    - `hcitool`：这是我们用于执行查询的工具。查询可以是设备 ID、名称、类别甚至是其时钟信息。这有助于设备同步工作。

    - `hcidump`：蓝牙通信的嗅探由此工具执行，因此它给了我们机会捕获通过蓝牙信号发送的数据。


    蓝牙扫描和侦察的第一步是检查我们正在使用的系统上的蓝牙适配器是否被识别并启用，以便我们可以使用它扫描其他设备。


    ### 使用 hcitool 扫描蓝牙设备


    现在我们知道适配器已启动，我们可以使用 `BlueZ` 套件中的另一个工具 `hcitool`，它用于扫描范围内的其他蓝牙设备。通过简单的 `scan` 命令，我们可以找到正在使用其发现信标（discover
    beacons）传输的蓝牙设备。即设置为发现模式的设备。你可能会遇到的大多数蓝牙黑客工具都将在脚本中使用这些命令。你应该能够使用 Python 脚本甚至 bash
    脚本从这些命令创建你的工具。


    ### 使用 sdptool 扫描服务


    服务发现协议（通常称为 SDP）是蓝牙的一种种协议，用于搜索蓝牙服务（蓝牙是一系列服务），而且非常有帮助的是`BlueZ` 提供了 `sdptool` 工具来浏览设备所提供的服务。同样重要的是，设备并不一定处于发现模式就可以被扫描。其语法如下：


    ```

    sdptool browse MACaddress

    ```


    ### 使用 l2ping 查看设备是否可达


    一旦我们收集了所有附近设备的 MAC 地址，就可以向这些设备发送 ping（无论它们是否处于发现模式），以查看它们是否可以触及。这让我们知道它们是否处于激活状态且在范围内。要发送
    ping，我们使用 `l2ping` 命令，语法如下：


    ```

    l2ping MACaddress

    ```


    # 总结


    无线设备代表了连接和黑客攻击的未来。在攻击这些系统的第一步，Linux 开发了用于扫描和连接 Wi-Fi AP 的专用命令。`aircrack-ng` 无线黑客工具包包含了
    `airmon-ng` 和 `airedump-ng`，它们使我们能够扫描并收集范围内的无线设备的关键信息。`BlueZ` 套件包含了 `hciconfig`、`hcitool`
    和其他能够扫描和收集信息的工具，这些对于黑进范围内的蓝牙设备是必要的。它还包含了许多其他值得探索的工具。


    # 第 7 章：密码学


    加密中包含大量的数学和算法，那是我们目前不愿深入探讨的话题。解释将非常简单且出奇地容易理解。我们将观察基本概念和术语，以便在这些相关话题出现时你能够了解它们。这些包括无线破解、密码破解、加密技术和哈希。然而，我的意图并不是在这里让你变成密码学家。这是一项需要时间磨练的技能，但可以帮助初熟悉密码学的术语和概念，帮助你成为一名可靠的黑客。


    ## 关于密钥大小


    在密码学中，密钥大小非常重要。更安全的加密具有更大的密钥。因此，与 128 位 `AES` 密钥相比，256 位 `AES` 密钥要强得多。这意味着破解它也困难得多。只需说，在采用相似算法的加密中，密钥越大，加密就越强。然而，请注意加密的强度还基于密钥大小和算法的细节。因此，这并不意味着不同的加密算法之间较大的密钥代表更强的加密。让我们从将加密分类开始。


    ## 密码学的类型


    以下是我们在书中将关注的加密类型。


    - 非对称加密

    - 对称加密


