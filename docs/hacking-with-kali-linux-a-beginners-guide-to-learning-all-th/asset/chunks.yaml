    - `Drop` – 尝试进入或离开系统的数据包被直接拦截。

    - `Reject` – 与 `drop` 命令相同，但数据发送者将收到一条错误消息。

    - `Accept/Allow` – 数据包将能够通过防火墙。


    这三个命令的运行依赖于预定义的规则。当用户建立新的防火墙时，他们会配置哪些流量可以到达网络或离开网络。防火墙不仅可以根据 IP 地址，还可以根据域名、关键词、协议、端口和应用程序阻止（或允许）访问。例如，你可以配置防火墙设置，仅允许来自员工家庭
    IP 地址的流量。这样，如果该员工尝试从咖啡馆连接你的网络，他将被拦截。防火墙根据预定义的规则检查每一个数据包。如果你添加了 10 个受信任 IP 地址，防火墙将拦截所有来自列表之外
    IP 的包。如果有多条规则，每个连接都必须成功通过每一条规则。通常，用户无法预测所有可能的连接。因此，为了让防火墙在特定规则不适用时工作，有一个默认策略。


    ## 防火墙默认策略


    如果你的防火墙安全解决方案接收到的数据包不适用于用户规则，默认策略就会发挥作用。在这种情况下，它仅执行上述三个命令中的一种。假设防火墙默认策略设置为“允许（allow）”。这意味着除了明确禁止的连接外，每个连接都获得批准。这实际上是一种糟糕的安全协议，因为在这种情况下，恶意数据包可以很容易渗透网络。如果默认策略设置为“丢弃（drop）”，它将忽略所有不匹配规则的连接。


    现在，防火墙响应流量的方式存在差异。有入站流量和出站流量，因此两者都有不同的规则。通常，出站流量总是被允许的，因为它们来自一个假设受信任的源——你的服务器。然而，应该会有一些限制，因为理论上网络犯罪分子可以接管服务器。如果你认为可能会发生这种情况，你就不希望不可信的通信（如共享敏感数据）出去。网络防火墙处理入站流量的方式不同——每种特定情况都需要大量的规则。要使防火墙的安全效益最大化是一项枯燥的工作。


    这是一个配置防火墙设置的简化示例：

    ![](img/rsrc1NF.jpg)


    由于你已经对防火墙是什么有了相当深入的了解，让我们来看看不同类型防火墙之间的区别。


    ## 防火墙类型


    并没有一种防火墙可以统治一切。防火墙有不同的外壳，并有不同的流量过滤方式。最常见的防火墙类型有三种：`packet filtering`（包过滤）、`stateful`（状态）和`application-level`（应用级）。


    ### 包过滤

    包过滤是第一代防火墙。当防火墙使用这种方法时，它会检查在进入或离开网络路途的每个数据包。该防火墙通过根据用户定义的规则接受或丢弃数据包提供保护。包过滤是一个相当不错的安全选项，但绝对不是最好的。此外，它需要大量的时间和精力来配置。


    ### 状态防火墙

    状态防火墙（也称为第二代防火墙）可以将数据包与之前的数据包进行比较。这使得这类防火墙比包过滤防火墙（也称为无状态防火墙）更灵活。状态防火墙本质是用速度换取更好的安全性。简单来说，状态防火墙可以“记住”进入或离开受信任网络的数据传输，从而将防火墙规则应用于整个通信。相反，包过滤必须根据其规则衡量每个数据包。


    ### 应用层网关/代理服务器防火墙

    到目前你已经知道前两种类型的防火墙控制入站和出站流量。第三代防火墙——应用层防火墙更进一步，它分析数据，从而允许或拒绝对特定应用程序的访问（因此得如此）。它能够阻止不符合用户定义策略的应用程序和服务。


    好了，这就是三种主要的防火墙类型。然而，这并不意味着防火墙只使用其中一种技术。事实上，一个良好的网络防火墙会结合这两种或三种方法，以提供更高层次的安全。这些方法是每个软件防火墙的核心。此外，可能还有硬件防火墙，以提高防火墙安全性。


    ## 硬件防火墙

    ![](img/rsrc1NF.jpg)

    硬件防火墙通常是内置包过滤技术的设备。它们可以是独立设备，也可以实现在宽带路由器中。由于它们是防御恶意数据的第一道线，硬件防火墙旨在通过覆盖入口和出口点来保护本地网络上的所有系统。硬件防火墙的优点之一是易于配置。一旦配置完成，可以使用这些免费工具之一进行测试：`NMAP`、`Tenable`
    和 `Personal Firewall`。


    ## 软件防火墙

    软件防火墙（也称为基于主机的防火墙）是个人最常用的保护方法。与硬件防火墙不同，软件防火墙只保护其安装的设备，而不是整个网络。为了更好的安全，最好同时使用两者，这被称为基于网络的防火墙。软件防火墙允许用户定义某些功能，但未提供硬件防火墙那样的完全自定义选项。大多数软件防火墙不仅保护你免受外部威胁，还保护你免受一些常见的恶意应用程序的影响。与大多数安全元素一样，保持防火墙更新至关重要。


    ## 下一代防火墙

    2009 年，咨询公司 Gartner 定义了“下一代防火墙（next-generation firewall）”一术。正如名称所示，它是传统防火墙的改进版本。下一代防火墙（NGFW）对应用程序、协议以及端口应用策略。与传统防火墙不同，NGFW
    执行深度包检测（DPI）。这种方法与仅检查数据包头的传统包过滤不同。而 DPI 则检查包内部的数据以检查数据包是否安全。深度包检测结合了入侵检测系统（IDS）、入侵预防系统（IPS）和传统的状态防火墙。


    ## 第 10 章：密码破解！

    ![Dati, Sicurezza, Tastiera, Computer, Computer Portatile](img/rsrc1NG.jpg)


    ### 1. 破解加密

    Kali Linux 的设计初衷完全是黑客或安全专业人员的最佳工具。我们已经看到 Kali 包含许多在其他操作系统上总是无法获得的工具和程序。Kali Linux
    变得如此流行的原因之一是它能够破解用于保护无线设备的无线加密标准。无线设备的一个例子是路由器。攻击者可以使用 Kali 破解无线系统，从而获得对网络的完全访问权限。被黑客的后果在家庭环境中可能是微不足道的，但在专业环境中可能更具破坏性。让我们逐步查看如何利用
    Kali Linux 破解 WPA 和 WPA2。


    #### 需要什么

    在开始之前，请确保备齐了以下物品：

    - 一台安装了 Kali Linux 的计算机

    - 配置为使用 WPA2 的无线路由器

    - 一个能够在监控模式（monitor mode）下运行的网卡

    - `aircrack-ng` 软件


