    # The Attack Process


    Note that it would be best to have root privileges on the Kali user account you
    are using to perform the attack. Otherwise, you may have to use the `sudo` command,
    which can be extremely tedious.


    ### Step 1

    Ensure that your network card is visible in Kali by using the `ifconfig` command.
    If you are using a wireless card via USB, make sure that it is plugged in.


    ### Step 2

    Ensure that your computer is not currently connected to a wireless network. Then
    you will need to run the `airmon-ng` command from the terminal. This command will
    display all of your wireless interfaces that are capable of running in monitor
    mode.


    ### Step 3

    Now you need to actually start using `airmon-ng` on your wireless interface. After
    you have completed this step, the output in the lower-right corner of the terminal
    should display the listening wireless interface which will likely be named `mon0`.


    ### Step 4

    Next, you will need to run the `dump` command with the listening wireless interface
    as a parameter. This will show you any information obtained from wireless networks
    in range of your wireless cards such as the encryption type, the MAC address of
    the wireless device (BSSID), and other information such as the channel and model
    number of the wireless device.


    ### Step 5

    Find the wireless network that you want to crack and copy its BSSID. Thereafter,
    the information obtained from the `airodump-ng` command will be required to be
    plugged into the command which is used for starting the procedure of attack. The
    command we will need to use is as follows:


    ```

    airodump-ng -c [wireless channel] –bssid [BSSID] -w /root/Desktop/ [monitor interface]

    ```

    Remember that the monitoring interface as we have said before is likely to be
    `mon0`.


    ### Step 6

    At this step, your wireless interface will be gathering and storing information
    about the wireless network, but in order for the attack to succeed, we will need
    a host to connect to the wireless network. When a device connects to the wireless
    router, our Kali software will capture data regarding a four-way handshake that
    is the weak point in the protocol. Alternatively, you can use a de-authorization
    command. This command will create some de-authorization packets to send to the
    target wireless router to force the reconnection process for other devices. We
    will target a device to force to reconnect by using the client’s BSSID in command.
    The only requirement is that you already need to be able to see a connected client’s
    BSSID in the previous command’s output.


    ### Step 7

    Ensure that you don’t close the terminal that you started running the `airodump-ng`
    command. Then, start a second terminal and using this command:


    ```

    aireplay-ng –0 2 –a [Router-BSSID] –c [Client-BSSID] mon0

    ```


    ### Step 8

    You should now view the output that displays the indication of a successful handshake.
    If you don’t, however, there are a multitude of factors that could have caused
    it to fail. One common problem is that the wireless signal was too weak, in which
    case you would only need to move your computer closer towards the wireless router.
    In addition, the connected device may not be configured to automatically reconnect
    to the network. If that’s the case, then you will have to wait for them to reconnect.


    ### Step 9

    Upon a successful reconnection handshake, we are going to need to crack the protocol.
    Enter the following command, and plug in the parameters as they pertain to your
    configuration:


    ```

    aircrack-ng -a2 -b [Router-BSSID] -w [Wordlist-File] /root/Desktop/*.cap

    ```

    The only new parameter in this command is a wordlist we have not yet discussed.
    A wordlist is basically a file containing different character combinations that
    we will use to carry out the attack. You can find them online for free, just make
    sure you remember where you store the data on your computer and use the file’s
    path as a parameter in the preceding command. After you have entered the command,
    the software will finally initiate the process of breaking the wireless encryption.


    ### Step 10

    All that is needed is to wait for the software to break the key. Note that in
    order to successfully break the encryption, the Wi-Fi password needs to be contained
    in the wordlist. This is called a dictionary-based attack, which is a little different
    from a brute force attack. A dictionary-based attack simply tries all of the passwords
    in a list or database whereas an attack of brute force fashion will attempt to
    utilize all the possible character combinations. If your dictionary failed to
    find the correct password, you can try using an additional wordlist. Also note
    that it could take a long time to actually break the password, depending on the
    strength and complexity of the password as well as how fast your computer hardware
    is.


    ### Step 11

    Once the software successfully cracks the password, it will display the key near
    the middle of the terminal in a line that reads: `KEY FOUND! [ wireless key ]`

    Go ahead and try logging in with the key for fun.


    Finally…

    Breaking WPA and WPA2 encryption are pretty easy as far as security attacks are
    concerned. But please remember to use this information responsibly as the consequences
    could be terribly severe.


    ## 2. Attacking with Frame Networks


    This is the attack type that is also called a de-authentication DoS Attack. Here,
    the attacker saturates vast amounts of frames in the network that carries out
    de-authentication. Targets will get disconnected from a wireless network when
    they receive de-authentication frames. The network users will not be able to maintain
    a connection if the attack is prolonged. An attacker can launch a de-authentication
    DoS attack in various ways. Commonly used methods are:


    *   The attacker can create spoofed de-authentication frames and set the source
    MAC address as the victim MAC address and destination MAC address as the AP’s
    MAC address. Thus upon receipt of the frame, the AP thinks that a genuine user
    wishes to leave the network and what follows is disconnection of the particular
    user.


    *   The attacker can create spoofed de-authentication frames and set the source
    MAC address as the AP’s MAC address and destination MAC address as victim MAC
    address and inject these spoofed frames into the network. These spoofed frames
    upon reaching the user’s terminal disconnect the user from the network.


    *   The attacker can craft a packet with source MAC address of the AP and destination
    as broadcast MAC address. All the users linked to a particular Access point will
    get disconnected. A broadcast de-authentication DoS attack has impacts that are
    so severe to the extent that all users connected to a target access point in the
    network can be de-authenticated.

    '
