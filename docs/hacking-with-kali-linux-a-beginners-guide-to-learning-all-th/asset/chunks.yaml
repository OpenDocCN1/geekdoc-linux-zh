  raw: '5​ Day of the week​ 0–7So, if we had written a script to scan the globe for
    vulnerable open ports and wanted it to run every night at 2:30 AM, Monday through
    Friday, we could schedule it in the crontab file. We will walk through the process
    of how to get this information into the crontab shortly, but first let’s discuss
    the format we need to follow, shown in Listing 16­ 1.![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
