    # 数据安全


    为了最大限度地减少对数据库、网站和计算机的未经访问，我们需要能够保护数字隐私的措施。这些措施就是我们说的数据安全。它的目的是保护数据免受损坏。对于所有大小的组织来说，数据安全都是至关重要的
    IT 方面。有时它也被称为计算机安全或信息安全。用于数据安全的常用技术包括数据脱敏、备份以及数据擦除等许多技术。正如我们所说的，加密也是一种数据安全技术，对于保护数据隐私至关重要。在这里，硬件、软件、硬盘和数字数据都将被加密。这是为了确保黑客和其他用户无法读取它们。这里指的是那些可能接触到硬件或软件的未经授权的用户。


    身份验证是实施数据安全的一种方法。你可能遇到过这样的场景：登录设备甚至访问你的电子邮件时需要密码。在授予用户访问数据或系统的权限之前，用户必须提供诸如生物识别数据、密码、用户名等身份凭据来对其身份进行验证。


    ## 数字证书


    数字证书用于特定发送者 Web 凭据的验证。该证书还允许加密消息的接收实体理解数据来自受信任的源。数字证书由证书颁发机构颁发。消息加密和自签名使用数字证书。身份证书或公钥证书是我们对数字证书使用的另一个名称。`X.509`
    是常用数字证书的一个示例。


    # 第 8 章：网络安全


    ![Sicurezza Informatica, Hacker, Sicurezza, Cyber](img/rsrc1N9.jpg)


    `crondaemon` 和 `crontable` (`crontab`) 是调度定期任务最有用的工具。第一个 `crond` 是在后台运行的守护进程。`crondaemon`
    检查 `crontable` 以在指定时间运行哪些命令。我们可以修改 `crontable` 来安排在特定一天或日期、每天特定时间或每隔几周每月定期执行任务或作业。


    要调度这些任务或作业，请将其输入位于 `/etc/crontab` 的 `crontable` 文件。`crontable` 有七个字段：前五个字段用于调度运行任务的时间，第六个字段指定用户，第七个字段用于要执行的命令的绝对路径。如果我们使用
    `crontable` 来调度脚本，只需将脚本的绝对路径放在第七个字段中。


    五个时间字段中的每一个都代表不同的时间元素：分钟、小时、一个月中的几天、月份和星期，按顺序排列。每个时间元素都必须用数字表示，因此三月表示为 3（你不能直接输入“March”）。星期从
    0 开始（即星期日），到 7 结束（也是星期日）。


