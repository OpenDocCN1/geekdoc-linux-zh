    - `Drop` – The data packet trying to enter or leave the system is blocked directly.

    - `Reject` – The same as the `drop` command, but the sender of the data will receive
    an error message.

    - `Accept/Allow` – The data packet will be able to go through the firewall.


    These three commands operate thanks to predefined rules. When users establish
    a new firewall, they configure what traffic could reach the network or leave it.
    The firewall can block (or allow) access based not only on IP addresses, but also
    domain names, keywords, protocols, ports, and apps. For example, you can configure
    a firewall’s settings to accept traffic from an employee’s home IP address only.
    That way, if the same employee tried to connect to your network from a café, he
    would be blocked. The firewall checks every data packet according to the predefined
    rules. If you’ve added 10 trusted IP addresses, the firewall will block all packets,
    coming from IPs outside the list. In case there are several rules, each connection
    will have to pass successfully through every one of them. Generally, a user can’t
    predict every possible connection. So for a firewall to work whenever the specific
    rules don’t apply, there’s a default policy in place.


    ## Firewall Default Policy


    If your firewall security solution receives a data packet for which user-generated
    rules don’t apply, the default policy comes into play. In such a case, it performs
    only one of the three commands mentioned above. Let’s assume the firewall default
    policy is set to “allow.” That means every connection, besides the explicitly
    forbidden ones, is approved. This is actually a lousy security protocol since
    in this case, malicious data packets can easily infiltrate the network. If the
    default policy is set to “drop,” it will neglect all connections that don’t match
    the rules.


    Now. There’s a difference in how a firewall reacts to traffic. There’s incoming
    and outgoing traffic, thus different rules for both. Typically, outgoing traffic
    is always allowed, since it comes from a presumably trusted source – your server.
    However, there should be some limitations, since a cybercriminal can, in theory,
    overtake the server. If you think that could be the case, you wouldn’t want untrusted
    communication (like sharing sensitive data) going out. The network firewall treats
    incoming traffic in a different way – there’s a need for a whole bunch of rules
    for each specific case. Maximizing the security benefits of a firewall could be
    a tiresome job.


    This is a simplified example of configuring firewall settings:

    ![](rsrc1NF.jpg)


    Since you already have a fairly decent knowledge of what a firewall is, let’s
    see the differences between firewalls of various types.


    ## Types of Firewalls


    There isn’t like one firewall to rule them all. Firewalls come in different casings
    and have different ways of filtering the traffic. There are three most common
    types of firewalls – `packet filtering`, `stateful`, and `application-level`.


    ### Packet Filtering

    Packet filtering is the first generation of firewalls. When a firewall uses this
    method, it checks each data packet on its way into or out of the network. This
    firewall offers protection by accepting or dropping packets based on the rules
    defined by the user. Packet filtering is a decent security option, but definitely
    not the best. Moreover, it requires a lot of time and effort to configure.


    ### Stateful Firewall

    Stateful firewalls, also known as second generation firewalls, can compare data
    packets to previous ones. This makes this type of firewall more flexible than
    the packet filtering ones (also known as stateless). Stateful firewalls, in essence,
    trade speed for better security. In simple words, stateful firewalls can “remember”
    data transfers to or from a trusted network, thus applying the firewall rules
    to the whole communication. Packet-filtering, on the other hand, has to measure
    each data packet against its rules.


    ### Application Level Gateway/Proxy Server Firewall

    By now you know that the previous two types of firewall control incoming and outgoing
    traffic. The third generation firewall – application layer, goes a step further
    and analyzes the data, thus allowing or denying access to specific applications
    (hence its name). It has the ability to block apps and services which don’t meet
    its user-defined policy.


    Alright, so those were the three major types of firewalls. However, this doesn’t
    mean a firewall uses only one of these techniques. In fact, a good network firewall
    combines two or all of these methods to provide a higher level of security. These
    approaches are at the core of every software firewall. On top of that, there could
    be a hardware firewall as well, to improve the firewall security.


    ## Hardware Firewall

    ![](rsrc1NF.jpg)

    The hardware firewalls are usually devices with built-in packet filtering technology.
    They can be either a standalone device, or be implemented in a broadband router.
    Since they are the first line of defense against malicious data, hardware firewalls
    aim to protect all the systems on a local network by covering its entry and exit
    points. One of the benefits of hardware firewalls is that they are easy to configure.
    Once configured, you can test it with any of these free tools: `NMAP`, `Tenable`,
    and `Personal Firewall`.


    ## Software Firewall

    The software firewall, also known as a host-based firewall, is the most common
    method for protection for individuals. Unlike the hardware firewall, a software
    firewall protects only the device it’s installed on, not the whole network. For
    better security, it’s best to use both, which is called a network-based firewall.
    Software firewalls allow users to define some of their features but don’t offer
    the full-customization options a hardware firewall does. Most software firewalls
    will not only protect you from external threats, but also from some of the most
    common malicious apps. As with most security elements, it’s vital to keep your
    firewall up to date.


    ## Next-Generation Firewall

    In 2009, the advisory firm Gartner defined the term “next-generation firewall.”
    As the name suggests, it’s an improved version of traditional firewalls. Next-generation
    firewalls (NGFW) apply their policies for applications, protocols, as well as
    ports. Unlike traditional firewalls, the NGFW performs what’s called a deep packet
    inspection (DPI.). This method differs from conventional packet filtering, which
    checks only the packet header. DPI, on the other hand, examines the data inside
    a packet to check if the package is safe or not. Deep packet inspection combines
    an intrusion detection system (IDS), an intrusion prevention system (IPS), and
    the traditional stateful firewall.


