    referred to as ethical hackers. They may be an organizations’ employees or work
    as contractors in information security companies. They usually try to discover
    vulnerabilities in a system through hacking. The methods used in the hacking process
    are similar to those that black hats use, but there is one differentiating aspect.
    White hats first seek the owners’ consent. This makes the hacking legal. White
    hat hackers usually carry out penetration tests; they do assess vulnerabilities
    and conduct in-place testing of a company''s security systems. We even have certifications,
    training, courses, and conferences that are hosted ethical hacking.What is Ethical
    Hacking?We define ethical hacking as an approved implementation whereby there
    is bypassing of a systems’ security that helps in the identification of threats
    and potential data breaches in a network. In this scenario, an organization that
    owns a particular network or system grants permission to cybersecurity experts
    to carry out such activities to test the defenses a system has put in place. This,
    therefore, implies that, unlike malicious hacking, ethical hacking is a legal
    process that has been planned and approved. The main goal of an ethical hacker
    is to scrutinize a particular network or system for weak points. It is via these
    weak points that malicious hackers use in their exploitation or destruction.While
    at it, they do gather and perform an analysis of the information. This will help
    them in the planning process of the organization''s IT infrastructure. In doing
    so, the security footprint will be significantly improved in a manner that it
    can withstand or divert attacks. The demand for ethical hacking has witnessed
    a dramatic increase in recent times due to the growth of the information security
    sector. Ethical hacking is also known as white hat hacking. Ethical hacking is
    the practice of attempting to infiltrate and exploit a system to find out its
    weaknesses so that it cat be better secured. We can categorize it into two broad
    classes. These are penetration testing; this is mostly for a legitimate information
    security firm, and hacking by intelligence agencies or a nation’s military. There
    is a rising demand for hacking in both areas.Penetration TestingAs organizations
    become increasingly security-conscious, and the cost of security breaches rises
    exponentially, many large organizations are beginning to contract out security
    services. One of these key security services is penetration testing. A penetration
    test is essentially a legal, commissioned hack to demonstrate the vulnerability
    of a firm’s network and systems.Generally, organizations conduct a vulnerability
    assessment first to find potential vulnerabilities in their network, operating
    systems, and services. I emphasize potential, as this vulnerability scan includes
    a significant number of false positives (things identified as vulnerabilities
    that really are not). It is the role of the penetration tester to attempt to hack,
    or penetrate, these vulnerabilities. Only then can the organization know whether
    the vulnerability is real and decide to invest time and money to close the vulnerability.Espionage
    and MilitaryCyber espionage can be said to be the practice of accessing information
    and secrets without the knowledge and permission of the entities being targeted.
    They can be ordinary individuals, rivals, competitors, groups, governments, or
    even enemies. The objectives here are broad. They can be political, economic,
    personal, or even military-related. The techniques used are diverse. Hackers can
    use malicious software, cracking techniques, proxy servers among others to attain
    their stated objectives. Espionage can be carried out online by professionals
    from their computer desks, or it can be done by infiltration using trained moles
    and conventional spies. In some circumstances, it can be carried by amateurish
    hackers with malicious intent and software programmers. It is common knowledge
    that every nation on earth carries out some form of cyber espionage or even cyber
    warfare, albeit covertly. Gathering intelligence on military activities of other
    countries has been made more cost-effective by hacking. Thus, a hacker has their
    place cut out in the defense systems of any nation.Chapter 2: Kali Linux Installation![Hacking,
    Crimine Informatico, Cybersecurity](rsrc1MA.jpg)Overview of KaliKali is a distribution
    of the Linux family which is established upon the Debian architecture and was
    purposely designed and made for auditing of security and carrying out Penetration
    Testing at an advanced level. This distribution has hundreds of tools geared towards
    numerous security-related tasks, for instance, Forensics tasks, Security research,
    Testing by penetration of various security systems, and reverse engineering among
    many others. Kali has been developed and is managed by Offensive Security, an
    information security company specializing in training security solutions. Kali
    evolved from BackTrack. BackTrack was also the software of the Linux distribution
    family and was also utilized in penetration testing.Reasons why Linux is preferred
    by hackersAs part of our introduction, we are going to discuss five reasons why
    the Linux operating systems are a preferred choice for hackers.a)    It is an
    open-source softwareUnlike the Windows operating system software, Linux distribution
    is open-source. A Linux user has access to the operating systems’ source code.
    This means that one can manipulate and change a Linux operating system to suit
    their needs at will. Supposing the user wants to make a particular system operate
    in ways besides those it was originally intended to, the ability to manipulate
    and change the source code is of paramount importance.b)    The operating system
    is transparentA thorough understanding of a users’ operating system is required
    for one to carry out hacking effectively. It is also necessary to have a knowledge
    of the operating system one intends to hack. Unlike Windows, we are able to see
    and even manipulate all the working parts of Linux. That is to say, Linux is completely
    transparent. It is not easy to understand the inner workings of a Windows operating
    system. The transparency aspect means working with Linux is more effective.c)
       Linux distributions provide users with granular controlA Linux user has infinite
    control over the system i.e it is granular. This is significant when compared
    to a Windows operating system where a user is able to control only what Microsoft
    allows them to. Everything in Linux, both at the minuscule and macro level, is
    controlled by the terminal. Additionally, scripting is simple and effective for
    any scripting language in Linux.d)    Hacking resources are designed for LinuxA
    majority of tools used in hacking are specifically written for Linux. There are
    some like nmap or Metasploit that can be available for the Windows platform but
    still, not all their capabilities can be ported to Windows. They offer limited
    functionalities as compared to when they are on the Linux platform.e)    The future
    belongs to Linux/UnixOver the years, you may have witnessed that Windows is slowing
    down and even stagnating in some departments. Since the advent of the internet,
    Linux/Unix has and is still the choice operating system for web servers primarily
    because of its reliability, robustness, and stability. To date, almost two-thirds
    of web servers utilize Linux operating systems. Examples of uses of the Linux
    kernel are Citrix applications, Vmware, embedded systems in switches and routers,
    mobile devices, and so on. It has been said that the future of computing is with
    mobile devices including but not limited to phones and tablets. Android, which
    is used in most phones, is Linux while iOS is a Unix kernel. It is, therefore,
    difficult to see how the future is not Linux/Unix. Microsoft Windows commands
    a meager market share of around 7 percent. The rest of the market is either Linux
    or Unix. In summary, the future lies with Linux/Unix.Using Kali LinuxThis operating
    system, Kali Linux, was purposely meant for testing the security of a computer
    infrastructure so as to unearth vulnerabilities that require addressing. The following
    are the main steps in carrying out penetration testing on a computer network.
    The tools which can be used in the respective steps have also been included.1)
        ReconnaissanceFirst and foremost, any penetration testing begins with intelligence
    gathering. In this stage, preliminary information about a particular target is
    collected. This information is what will be used in the planning of the actual
    attack.Examples of tools for reconnaissance in Kali Linux are Nmap, DNSRecon,
    Hping3, Recon-ng among others.2)     ScanningThe second step is to scan for more
    intel about the target under consideration. A vulnerability scanner is employed
    at this step to help a penetration tester discover security loopholes that may
    be present in the target network.Tools that can be used for this purpose include
    Nikto, Cisco-auditing-tool, WebSploit, jSQL Injection, Arp-scan, and Oscanner.3)
        Gaining accessGaining access to a targeted network is the third step. Here,
    an ethical hacker will make an attempt to infiltrate a network. The intention
    is to enable the hacker to extract vital data with which they can use to compromise
    a system or use it as a platform to launch more attacks.Tools necessary for this
    include John the Ripper, Browser Exploitation Framework (BeEF), Metasploit Framework,
    Aircrack-ng, and Wireshark.4)     Maintaining accessA tester is required to maintain
    access to a system he or she has gained access to. This is to enable them to cause
    more destruction for as long as possible. To accomplish this task, stealthy tools
    capable of under-the-ground operations are necessary.Some of the tools include
    Dns2tcp, Webshells, Powersploit, Cryptcat, and Weevely5)     Covering tracksHere,
    a penetration tester will try to erase any signs or footprints of past malicious
    activity that has been carried out on the target network. A good example is returning
    original statuses of access privileges that had been escalated or altered.Kali
    Linux has the following tools for covering tracks: Smbexec, Meterpreter, and VeilIntroduction
    to Penetration TestingStill, on the introduction to Kali Linux, we are going to
    introduce penetration testing. This will give us the required background to enable
    us to understand its importance with regards to security analysis. Penetration
    testing is a valuable tool that helps security planners get to understand and
    improve the security of a computer or network they are managing. Nevertheless,
    a hacker can use penetration testing to exploit weaknesses in the system then
    afterward, attack them and steal valuable information. A security professional
    is able to use penetration testing better when he or she understands why it is
    needed in the first place, and also when the processes and issues surrounding
    it are well understood. We shall look at the terms of its use, its applications,
    and the various processes involved. The book is not intended to be a step-by-step
    guide on how to carry out penetration testing. This is a skill that requires a
    lot of practical practice to master. If it is not done correctly, it can actually
    damage the targeted or the results can be deemed invalid in some cases.So, what
    is penetration testing?We define it as an agreed set of procedures and processes
    that are used for bypassing laid down security controls of an intended or known
    system or organization purposely to test the said system’s or organization’s resistance
    capabilities against such attacks. Penetration testing is normally carried out
    to unearth weaknesses in the security of a system and also to find out the ways
    in which a systems’ security architecture can be breached by a potential attacker.Often,
    a penetration test comprises of a sequence of attacks against a select target.
    The outcome of the penetration test, successful or otherwise, is determined by
    the reaction of the targets to the attacks.The determination of the ability of
    a target to resist or withstand an attack launched by a hostile intruder is the
    overall intention of carrying out this test.Consequently, the pen-tester will
    utilize techniques and tricks that an actual attacker is likely to use. In other
    words, the tester will simulate a real-life attack against his target. This way,
    the tester can unearth the weak spots and improve its security way before a malicious
    attacker discovers them. Organizations are turning to penetration testing to help
    them ascertain the effectiveness of the measures they have in place to safeguard
    their security. During the testing process, problems might be discovered regarding
    the organization’s security. Nevertheless, the pen-tester is required to elaborate
    on the ‘enabling factors’ that resulted in the success of the test. It is not
    sufficient enough for a tester to simply state that they were able to lay their
    hands on an organizations’ sensitive data. The bonus is on the tester to give
    reasons why there was a lapse that enabled them to achieve their intended tasks.A
    penetration test has the following basic requirements:1)     Like any other task,
    a penetration test needs to have a clearly defined goal or objective which is
    to be documented clearly. A more specific goal makes it easier to determine whether
    the test was a success or failure. For instance:Goal 1: Gain access to ABC’s corporate
    networkGoal 2: Gain access to ABC’s corporate network through the internet and
    access the sales departments’ file server.Goal 1 is not precise even though it
    is attainable. Goal 2 is precise and specific. This is what we are talking about.Every
    test being done requires its individual goal. If a pen-tester intends to carry
    out testing of more than one aspect of security in an organization, multiple other
    tests need to be performed. This makes it possible for a tester to easily distinguish
    attempts that are successful from those that are not.2)     The penetration test
    is time-bound. It should be performed within a limited time period exactly as
    it would happen in the real world. Any real-life attacker would give up after
    unsuccessfully trying to penetrate a site. Additionally, the protected information
    being sought has a finite useful lifetime. Any penetration test needs to acknowledge
    this. Therefore, the goal of the test must include the time limits within which
    the test will be carried out based on the type of the target under consideration,
    the lifetime of useful information, and the level of threat that is expected.3)
        The management of an organization should approve the penetration test. Since
    this activity will involve accessing an organizations'' network and information
    systems, it must be authorized by the management.Terminologies Used in Penetration
    TestingLet us look at the commonly used terms associated with penetration testing.
    Throughout this book, we are going to use them often. They are:'
