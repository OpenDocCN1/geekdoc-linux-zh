    没有任何一种方法可以确保你的活动完全免受窥探之眼的监控，只要有足够的时间和资源，任何事情都可以被追踪。然而，这些方法可能会让追踪者的工作变得困难得多。


    # 互联网是如何暴露我们身份的


    首先，让我们从高层面上讨论一下我们在互联网上活动被追踪的一些方式。我们不会详细介绍所有的追踪方法，也不会对任何一个过程进行过细的说明，因为那超出了本书书的范畴。事实上，这样的讨论本身就足够写满一整本书了。


    首先，当你穿行于互联网时，你的 `IP address` 会识别出你的身份。从你的机器发送的数据通常会被标记上你的 `IP address`，这使得你的活动很容易被追踪。其次，Google
    和其他邮件服务会“读取”你的邮件，寻找关键词以便更高效地投放广告。尽管还有许多更复杂、更耗费时间和资源的方法，但这些是我们在本章中尝试防止的。让我们先来看看
    IP 地址在互联网上是如何暴露我们身份的。


    当你跨越互联网发送数据包时，它包含了数据源和目的的 `IP addresses`。通过这种方式，数据包知道它要去哪里以及去哪里返回响应。每个数据包都会经过多个互联网路由器，直到找到目的地，然后跳回发送者。对于一般的网络浏览，每一个“跳”（hop）都是数据包为到达目的地而经过的路由器。发送者和目的地之间可能有
    20-30 次跳跃，但通常，任何数据包都会少于 15 次跳跃即可找到目的地。


    当数据包穿过互联网时，任何拦截该数据包的人都可以看到是谁发送了它、它去过哪里以及它正前往哪里。这是网站在你到达时识别你的身份并自动登录的一种方式，这也是某人追踪你在互联网上去过的地方的方法。要查看数据包在你和目的地之间可能经过哪些跳跃，你可以使用
    `traceroute` 命令，如下所示。输入 `traceroute` 以及目的 `IP address` 或域名，该命令将向目的地发送数据包并追踪这些数据包的路由。


    ```

    traceroute <destination IP address or domain>

    ```


    # 洋洋葱路由器系统 (The Onion Router System)


    20 世纪 990 年代，美国海军研究办公室 (ONR) 致力于开发一种用于间谍目的的匿名上网方法。该计划是建立一个独立于互联网路由器的路由器网络，该网络可以加密流量，并且只存储上一个路由器的未加密
    `IP address`——这意味着沿途的所有其他路由器地址都是加密的。其想法是，任何监控流量的人都无法确定数据的来源或目的地。这项研究在 2002 年被称为“洋洋葱路由器
    (Tor) 项目”，现在任何人都可以使用它在网络上进行相对安全和匿名的浏览。


    ## Tor 的工作原理


    通过 Tor 发送的数据包通常不会通过那些被许多人监控的普通路由器发送，而是通过全球超过 7,000 多个路由器组成的网络发送，这归功于允许 Tor 利用其计算机的志愿者。除了使用完全独立的路由器网络外，Tor
    还加密了每个数据包的数据、目的地和发送者 `IP address`。在每一个跳跃处，信息都会被加密，并在接收时由下一个跳点进行解密。通过这种方式，每个数据包只包含路径上上一个跳点的信息，而不包含源的
    `IP address`。如果有人拦截了流量，他们只能看到上一个跳点的 `IP address`，而网站所有者只能看到发送流量的最后一个路由器的 `IP address`。


    这确保了互联网上的相对匿名性。要使用 Tor，你需要从 `https://www.torproject.org/` 安装 Tor 浏览器。安装后，你可以像使用任何旧版浏览器一样使用它。通过这个浏览器，你将通过一组独立的路由器浏览互联网，并能够在访问网站而不被“老大哥（Big
    Brother）”追踪。遗憾的是，代价是通过 Tor 浏览器上网速度会慢得多；因为路由器没有那么多，该网络的带宽是受限的。


    除了能够访问传统互联网上的几乎任何网站外，Tor 浏览器还能够访问暗网。构成暗网的网站需要匿名性，因此它们只允许通过 Tor 浏览器访问，并且它们的顶级域名
    (TLD) 以 `.onion` 结尾。暗网因非法活动而臭名昭著，但那里也存在许多法律服务。不过，提醒一下：在访问暗网时，你可能会遇到许多人认为具有攻击性的内容。


    ## 安全忧虑


    美国和其他国家的情报和间谍机构认为 Tor 网络对国家安全构成威胁，认为这种匿名网络让外国政府和恐怖分子能够在不被监控的情况下进行通信。因此，我们许多强大且雄心勃勃的研究项目正在致力于破解
    Tor 的匿名性。Tor 的匿名性曾被这些当局破解过，并且可能会再次破解。例如，美国国家安全局 (NSA) 运行自己的 Tor 路由器，这意味着当你使用 Tor
    时，你的流量可能正在经过 NSA 的路由器。


    如果你的流量是从 NSA 的路由器出的，情况就更糟了，因为出口路由器始终知道你的目的地。NSA 还有一种名为 `traffic correlation`（流量相关性）的方法，涉及寻找入站和出站流量中的模式，这种方法能够破解
    Tor 的匿名性。虽然这些破解 Tor 的尝试不会影响 Tor 向像 Google 等商业服务隐藏你身份的功效，但它们可能会限制浏览器在防止间谍机构追踪你保持匿名方面的功效。


    # 代理服务器


    在互联网上实现匿名性的另一种策略是使用代理，代理是作为流量中间人的中间系统：用户连接到代理，流量在被转发之前会被赋予代理的 `IP address`。


    当流量从目的地返回时，代理会将流量发回源端。通过这种方式，流量看起来像是来自代理，而不是原始的 `IP address`。很可能，代理会保留你流量的日志。然而，调查实体需要获得搜查令或传票才能获取这些日志。为了让你的流量更难被追踪，你可以使用多个代理，这种策略被称为
    `proxy chain`（代理链），我们将在本章稍后部分介绍它。Kali Linux 有一个名为 `proxychains` 的优秀代理工具，你可以设置它来隐藏你的流量。`proxychains`
    命令的语法非常直观，如下所示：


    ```bash

    proxychains <the command you want proxied> <arguments>

    ```

    你提供的参数可能包括 `IP address`。


    ## 在配置文件中设置代理


    在本节中，我们为 `proxychains` 命令设置一个代理。与 Linux/Unix 中几乎所有应用程序一样，`proxychains` 的配置由配置文件管理——具体为
    `/etc/proxychains.conf`。使用以下命令在你选择的编辑器中打开配置文件（将 `leafpad` 替换为你选择的编辑器）：


    ```bash

    leafpad /etc/proxychains.conf

    ```


