- fmt: '

    This attack is carried out by intercepting the traffic on the network. Through
    the use of eavesdropping, a malicious user will be able to get access to credit
    card numbers, passwords alongside other information that is deemed to be confidential
    in which the user may be exchanged over the network. We can either have a passive
    or an active eavesdropping attack. Let us briefly look at what they are.


    ### Passive Eavesdropping

    In this mode of eavesdropping, a malicious user will attempt to obtain information
    by way of listening in on the messages being transmitted over the network.


    ### Active Eavesdropping

    Information being transmitted is actively captured by way of an attacker disguising
    as if they were a friendly unit. This is carried out through querying the data
    transmitters. We call this `scanning`, `tampering`, or simply `probing`.


    It is prudent to note that the detection of passive eavesdropping attacks is crucial.
    This is because it is a precursor to the active attacks. `Data encryption` is
    the best countermeasure for eavesdropping.


    ### What are the types of hackers?

    Let us differentiate the different types of hackers we are likely to encounter
    below. You will notice that each category of hackers possesses different objectives.
    We will also look at the various roles and goals each of the hackers has.


    #### a) Black hat hacker

    Commonly known as black hats, they usually have extensive knowledge regarding
    the various methods about bypassing security protocols and breaking into computer
    networks. `Malware` is generally written by black hats to help gain access to
    these systems. A black hats’ main goal is usually to make a personal or financial
    gain. Some of them do carry out cyber espionage while some do it for fun. This
    category of hackers ranges from inexperienced amateurs whose idea of fun is spreading
    malware to those that are experienced whose objectives are to embezzle privileged
    data. Many a time, it is financial information they seek. They are also interested
    in harvesting login credentials and personal information. Besides stealing data,
    they usually alter or sometimes destroy the data they have obtained if it does
    not serve their purpose.


    #### b) Grey hat hacker

    These can be said to be neither the bad or good guys! Grey hats are neither white
    nor black. This category of hackers has the characteristics of both black hats
    and white hats. Most of the time, grey hats will attempt to unearth, without the
    permission or knowledge of the owners, vulnerabilities that are present in a system.
    If they discover an issue, they will report the same to the owners. Most of the
    time, they will ask for some financial compensation so that they can fix the problem.
    In the ‘unfortunate’ event that the owner does not comply, they will go ahead
    and post their exploits on the internet for everyone to see. Grey hats’ intentions
    are not necessarily malicious; all they want is to make some dollars out of their
    discoveries. After finding vulnerabilities, grey hats will not usually exploit
    the vulnerabilities that they have unearthed. What makes this grey hacking illegal
    is the fact that no prior permission was sought from the owners of a particular
    system the hackers targeted. For the readers seeking to become hackers, it is
    essential to note that not all hackers are created equal. We have white hat hackers
    who are always trying to uncover and fix vulnerabilities before black hats find
    them. This way, we have a lot fewer cyber crimes now.


    #### c) White hat hacker

    Unlike the two previous types of hackers, white hat hackers are those that put
    their skills to good use. Their intentions are benevolent. These are the good
    guys. This group of hackers is commonly referred to as `ethical hackers`. They
    may be an organizations’ employees or work as contractors in information security
    companies. They usually try to discover vulnerabilities in a system through hacking.
    The methods used in the hacking process are similar to those that black hats use,
    but there is one differentiating aspect. White hats first seek the owners’ consent.
    This makes the hacking legal. White hat hackers usually carry out `penetration
    tests`; they do assess vulnerabilities and conduct in-place testing of a company''s
    security systems. We even have certifications, training, courses, and conferences
    that are hosted ethical hacking.


    ### What is Ethical Hacking?

    We define ethical hacking as an approved implementation whereby there is bypassing
    of a systems’ security that helps in the identification of threats and potential
    data breaches in a network. In this scenario, an organization that owns a particular
    network or system grants permission to cybersecurity experts to carry out such
    activities to test the defenses a system has put in place. This, therefore, implies
    that, unlike malicious hacking, ethical hacking is a legal process that has been
    planned and approved. The main goal of an ethical hacker is to scrutinize a particular
    network or system for weak points. It is via these weak points that malicious
    hackers use in their exploitation or destruction.


    While at it, they do gather and perform an analysis of the information. This will
    help them in the planning process of the organization''s IT infrastructure. In
    doing so, the security footprint will be significantly improved in a manner that
    it can withstand or divert attacks. The demand for ethical hacking has witnessed
    a dramatic increase in recent times due to the growth of the information security
    sector. Ethical hacking is also known as white hat hacking. Ethical hacking is
    the practice of attempting to infiltrate and exploit a system to find out its
    weaknesses so that it cat be better secured. We can categorize it into two broad
    classes. These are `penetration testing`; this is mostly for a legitimate information
    security firm, and hacking by intelligence agencies or a nation’s military. There
    is a rising demand for hacking in both areas.


    ### Penetration Testing

    As organizations become increasingly security-conscious, and the cost of security
    breaches rises exponentially, many large organizations are beginning to contract
    out security services. One of these key security services is penetration testing.
    A penetration test is essentially a legal, commissioned hack to demonstrate the
    vulnerability of a firm’s network and systems.


    Generally, organizations conduct a `vulnerability assessment` first to find potential
    vulnerabilities in their network, operating systems, and services. I emphasize
    potential, as this vulnerability scan includes a significant number of false positives
    (things identified as vulnerabilities that really are not). It is the role of
    the penetration tester to attempt to hack, or penetrate, these vulnerabilities.
    Only then can the organization know whether the vulnerability is real and decide
    to invest time and money to close it.


    ### Espionage and Military

    Cyber espionage can be said to be the practice of accessing information and secrets
    without the knowledge and permission of the entities targeted. They can be ordinary
    individuals, rivals, groups, governments or even enemies. The objectives here
    are broad. They can be political, economic, personal, or military-related. The
    techniques used are diverse. Hackers can use malicious software, cracking techniques,
    proxy servers among others to attain their objectives. Espionage can be carried
    out online by professionals from their computer desks, or can be done by amateurish
    hackers with malicious intent and software. It is common knowledge that every
    nation on earth carries out some form of espionage or even warfare, albeit covertly.
    Gathering intelligence on military activities of other countries has been made
    more cost-effective by hacking. Thus, hacker has their place cut out in the defense
    systems of any nation.


    ### Overview of Kali

    Kali is a distribution of the Linux family which is established upon the Debian
    architecture and was purposely designed and made for auditing of security carrying
    out Penetration Testing at an advanced level. This distribution has hundreds of
    tools geared towards numerous security-related tasks, for instance, Forensics,
    Security research, Testing of various systems, and reverse engineering among others.
    Kali has been developed and is managed by Offensive Security, an information security
    company specializing in training solutions. Kali evolved from `BackTrack`. `BackTrack`
    was also the software of Linux distribution and was also utilized in penetration
    testing.


    ### Reasons why Linux is preferred by hackers

    As part of our introduction, we are going to discuss five reasons why the Linux
    operating systems are a preferred choice.


    #### a) It is open-source

    Unlike the Windows operating system, Linux distribution is open-source. A Linux
    user has access to the source code. This means that one can manipulate and change
    a Linux system to suit their needs. If user wants to make a particular system
    operate in ways besides those it was intended to, the ability to manipulate and
    change the source code is of paramount importance.


    #### b) The operating system is transparent

    A thorough understanding of Linux is required to carry out hacking effectively.
    Unlike Windows, we are able to see and even manipulate all working parts of Linux.
    That is to say, Linux is completely transparent. It is not easy to understand
    the inner workings of a Windows system. The transparency aspect means working
    with Linux is more effective.


    #### c) Linux distributions provide users with granular control

    A Linux user has infinite control over the system i.e it is granular. This is
    significant compared to a Windows operating system where a user is able to control
    only what Microsoft allows them. Everything in Linux, both at the minuscule and
    macro level, is controlled by the terminal. Additionally, scripting is simple
    and effective for any language.


    #### d) Hacking resources are designed for Linux

    A majority of tools used in hacking are specifically written for Linux. There
    are some like `nmap` or `Metasploit` that can be available for the Windows platform
    but still, not all their capabilities can be ported to Windows. They offer limited
    functionalities as to when they are on the Linux platform.


    #### e) The future belongs to Linux/Unix

    Over the years, you may have witnessed that Windows is slowing down and even stagnating
    in some departments. Since the advent of the internet, Linux/Unix and is still
    the choice operating system for web servers primarily because of its reliability,
    robustness, and stability. To date, almost two-thirds of web servers utilize Linux
    operating systems. Examples of uses of the Linux kernel are `Citrix applications`,
    `Vmware`, embedded systems in switches and routers, mobile devices, and so on.
    It has been said that the future of computing is with mobile devices including
    not limited to phones and tablets. Android, which is used in most phones, is Linux
    while iOS is a Unix kernel. It is, therefore, difficult to see how the future
    is not Linux/Unix. Microsoft Windows commands a meager market share of around
    7 percent. The rest of the market is either Linux or Unix. In summary, the future
    lies with Linux/Unix.


    ### Using Kali Linux

    This operating system, Kali Linux, was purposely meant for testing the security
    of a computer infrastructure so as to unearth vulnerabilities that require addressing.
    The following are the main steps in carrying out penetration testing on a computer
    network. The tools which can be used in the respective steps have also been included.


    #### 1) Reconnaissance

    First and foremost, any penetration testing begins with intelligence gathering.
    In this stage, preliminary information about a particular target is collected.
    This information is what will be used in the planning of the actual attack. Examples
    of tools for reconnaissance in Kali Linux are `Nmap`, `DNSRecon`, `Hping3`, `Recon-ng`
    among others.


    #### 2) Scanning

    The second step is to scan for more intel about the target under consideration.
    A vulnerability scanner is employed at this step to help a penetration tester
    discover security loopholes that may be present in the target network. Tools that
    can be used for this purpose include `Nikto`, `Cisco-auditing-tool`, `WebSploit`,
    `jSQL Injection`, `Arp-scan`, and `Oscanner`.


    #### 3) Gaining access

    Gaining access to a targeted network is the third step. Here, an ethical hacker
    will make an attempt to infiltrate a network. The intention is to enable the hacker
    to extract vital data with which they can use to compromise a system or use it
    as a platform to launch more attacks. Tools necessary for this include `John the
    Ripper`, `Browser Exploitation Framework (BeEF)`.


    #### 4) Maintaining access

    A Linux user has infinite control over the system i.e it is granular. This is
    significant compared to a Windows operating system where a user is able to control
    only what Microsoft allows them. Everything in Linux, both at the minuscule and
    macro level, is controlled by the terminal. Additionally, scripting is simple
    and effective for any language. Some of the tools include `Smbexec`, `Meterpreter`,
    and `Veiley`.


    #### 5) Covering tracks

    Here, an attacker will try to erase any footprints. Some of the tools include
    `Aircrack-ng`, and `Wireshark`.

