    \ level in the file structure (toward the root of the file structure, or `/`),\
    \ we use `cd` followed by double dots (`..`), as shown here:\n\n```bash\ncd ..\n\
    ```\nThis moves us up one level from `/etc` to the `/` root directory, but you\
