    # 渗透测试是必要的吗？


    首先，渗透测试有助于特定组织确定其既定安全协议的有效性。这些协议可以是操作性的、技术性的或物理性质的。测试人员的工作是尝试攻破这些控制措施，以判断它们是否能够胜任。渗透测试人员还会评估组织对特定威胁的脆弱性。作为测试人员，最关重要的角色是发现组织的防御措施大程度上有效，并告知他们需要改进的领域。此外，组织可以识别针对自身的威胁，而这些威胁的真伪则由测试人员来验证。


    通常，公司会利用渗透测试来增强其在目标市场中的形象。在这里，公司可以表明其能够抵御攻击，因此是安全的并且拥有稳健的基础设施。这种测试还可以提醒组织的管理层其运营或系统中可能存在的潜在安全威胁。执行良好的渗透测试可以系统地发现漏洞，而管理层可能并不这些这些的存在。


    ## 渗透测试的类型


    第一类检查对象的物理基础设施。测试人员可以利用组织的物理安全漏洞。在大多数情况下，问题不在于数据库和其他配置，而在于已采取的物理防御措施。这里需要问的问题包括：是否有足够的访问控制？组织所在的建筑是否有安保人员？他们受过良好培训吗？员工离开建筑时是否对敏感材料进行了检查？电子设备进出建筑是否经过注册和验证？为了回答这些问题，测试人员将尝试在人们上班的时间（例如早晨）进入建筑。假设入侵者可以在未经过检查的情况下进入公司建筑，他们将能够获取他们想要的信息。


    第二类渗透测试涉及组织的运营方面。运营测试通过绕过操作程序来确定组织内既定操作流程的有效性。这与物理测试不同，后者仅检查对网络、设施或公司计算机的物理访问。


    第三类也是最后一种类型涉及电子测试。在这种测试机制中，测试人员将攻击公司的网络、通信设施或计算机系统。电子测试可以通过自动化工具完成，也可以手动完成。在这里，主要目标是破解通过所考虑对象所使用的通信设施和数据网络遭受攻击的漏洞。


    # Kali 概览


    一旦你启动 Kali，就会看到一个登录界面，如图 1-1 所示。使用 root 账户用户名 `root` 和默认密码 `toor` 登录。


    ![](img/rsrc1MB.jpg) ![](img/rsrc1MC.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MD.jpg)

    图：使用 root 账户登录 Kali


    你现在应该可以访问 Kali 桌面（参见图 1-2）。我们将快速查看 ![](img/rsrc1ME.jpg) ![](img/rsrc1MF.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) 桌面两个最基本的方面：终端界面和文件结构。


    ![](img/rsrc1MG.jpg)

    图：Kali 桌面


    ## 终端


    使用 Kali 的第一步是打开终端，这是我们在书中将用到的命令行界面。在 Kali Linux 中，你会在桌面底部找到终端图标。双击此图标打开终端，或按下
    `CTRL-ALT-T`。你的新终端应该看起来像下图所示。


    ![](img/rsrc1MH.jpg)

    图：Kali 终端


    此终端打开了命令行环境，称为 shell（壳），它允许你在底层操作系统上运行命令并编写脚本。虽然 Linux 有许多不同的 shell 环境，但最流行的是
    `bash` shell，它也是 Kali 以及许多其他 Linux 发行版的默认 shell。要更改你的密码，可以使用命令 `passwd`。


    ## Linux 文件系统


    Linux 文件系统结构与 Windows 有些不同。Linux 在文件系统的底部没有物理驱动器（例如 `C:` 盘），而是使用逻辑文件系统。在文件系统结构的最顶端是
    `/`，它通常被称为文件系统的根（root），就像一棵倒立的树（见下图）。请记住，这与 root 用户不同。这些术语初看起来看起来可能令人困惑，但一旦你习惯了
    Linux，它们就会更容易区分。


    ![](img/rsrc1ME.jpg) ![](img/rsrc1MF.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)
    ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg) ![](img/rsrc1MB.jpg)![](img/rsrc1MJ.jpg)

    图：Linux 文件系统


    文件系统的根 (`/`) 位于树的顶部，以下是最重要的子目录：


    - `/root`: 根目录

    - `/etc`: 通常包含配置文件

    - `/home`:用户的家目录

    - `/mnt`: 挂载文件系统的地方

    - `/media`: 挂载 USB 设备的地方

    - `/bin`: 应用程序二进制文件所在地

    - `/lib`: 共享库所在地


    理解这些关键目录非常重要，因为你需要知道工具所在的位置。我们将花费更多时间研究这些目录，所以你需要知道它们在哪里。。


    ## 基本命令


    首先，让我们来看一些命令。


    ### 使用 `pwd` 找到自己的位置


    在 Linux 中，提示符并不总是明显地显示你处于何处。要查看你的目录，`pwd` 命令可以工作。工作目录命令 `pwd` 返回你的位置：


    ```bash

    pwd

    ```

    在这种情况下，`pwd` 返回 `/root`，表示我们在根目录中。如果我们在另一个目录，`pwd` 将返回该目录名称。要导航到新目录，我们需要。


    ### 使用 `whoami` 检查登录身份


    如果你忘记了自己是以 root 还是其他用户登录的，可以使用 `whoami` 命令查看你以哪个用户身份登录：


    ```bash

    whoami

    ```

    如果我是以另一个用户（例如我的个人账户）登录的，`whoami` 将返回我的用户名，如下：


    ```bash

    whoami

    ```


    ## 导航 Linux 文件系统


    从终端导航文件系统是一项基本技能。为了完成任何工作，你必须能够移动以查找位于其他目录中的应用程序、文件和目录。在基于 GUI 的系统中，你可以直观地看到目录，但当你使用命令行界面时，导航文件系统意味着使用某些命令。使用
    `cd` 切换目录


    从终端更改目录，请使用更改目录命令 `cd`。例如，这是切换到用于存储配置文件的 `/etc` 目录的方法：


    ```bash

    cd /etc

    ```

    提示符变为 `root@kali:/etc`，表示我们在 `/etc` 目录中。我们可以通过输入 `pwd` 来确认这一点：


    ```bash

    pwd

    ```

    若要在文件结构中向上移动一级（向文件结构的根，即 `/`），我们使用 `cd` 后跟两个点（`..`），如下所示：


    ```bash

    cd ..

    ```

    这将我们从 `/etc` 向上移动一级到 `/` 根目录，但你可以根据需要向上移动任意级。只需使用双点对的数量等于你想要移动的层数即可：


    - `..` 向上移动一级。

    - `....` 向上移动二级。

    - `......` 向上移动三级。


    你也可以通过输入 `cd /` 从文件结构的任何地方移动到根级别，其中 `/` 代表文件系统的根。


    ### 使用 `ls` 列出目录内容


    要查看目录的内容（文件和子目录），我们可以使用 `ls`（list）命令。这与 Windows 中的 `dir` 命令非常相似。


    '
