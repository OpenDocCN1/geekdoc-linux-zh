    which will be used by the operating system to track and manage the process as
    it executes. Ideally, a process is a running instance of a program.In normal circumstances,
    we have several processes that represent a single program running in the computers’
    memory all at the same time. Upon their completion, the system will destroy them
    so that we will not have any more processes for the program. At the terminal,
    we will be having a running Bash process to provide us the Bash shell.How does
    the bash script run?This is quite easy. First, running a script is also known
    as executing a script.We have to set permissions to execute scripts. These permissions
    for safety reasons are by default, not set. Skipping this step will only display
    an error message but the code can still run. Let’s look at a sample script below.1\.
    #!/bin/bash2\. # This is an example of a Bash script, by Sutherland3.4\. echo
    Welcome to Kali Linux!We are going to expound a little bit on what is going on
    here below:


    *   Line no. 1 – That as what we call the shebang.


    *   Line no. 2 - This is a comment. Anything after # is not executed.


    *   Line no. 4 - Is the command echo which will print a message to the screen.
    On Line no. 2, you will see that it is highlighted. Highlighting the syntax only
    serves to make it easy to read. You probably do not need it in your own files.


    What is the use of ./For normal commands, all we need to do is type the name and
    voila! It starts to execute. To run a bash script, we place ./ in front of it.
    Bash will attempt to find the name you have typed on the command line without
    ./ in directories that are located in a variable called $PATH. Separation of the
    directories is done using " : " This script will perform a search in those particular
    directories and will not look at your current directory or other subdirectories.Bash
    will run the first instance of the script or program that it finds after searching
    the directories mentioned above. It is prudent to note that the $PATH variable
    varies with each individual user and they can set it up to their preference.Below
    are the reasons that this is done:


    1.  This way, we can install a number of different versions of a particular program.
    We are also able to determine which of them gets executed depending on their location
    in $PATH.


    2.  It offers unprecedented convenience. From the lengthy explanation above, the
    bin directory is found on the home directory. A user is in a position to place
    their own programs and installed scripts in there. A user is also able to utilize
    them regardless of their location within the system just by doing a simple name
    typing. It is also possible to make scripts with a similar name as a program in
    case you desire to have a behavior that is slightly different.


    3.  The overall safety is increased – look at this, a malicious user may make
    a script intended to delete everything from the home directory. It is in your
    best interest not to execute that script. As long as the script is not in your
    $PATH, no problems will arise.'
