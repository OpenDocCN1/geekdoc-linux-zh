  raw: 'Is penetration testing necessary?First and foremost, a penetration test helps
    a given organization ascertain the effectiveness of the laid down security protocols.
    The protocols can be operational, technical or of a physical nature. A tester''s
    job will be to determine whether these controls are up to the task by trying to
    overcome them. A penetration tester will also be gauging an organization''s vulnerability
    to a specific threat. As a tester, the most crucial role is to find out how an
    organizations'' countermeasures are effective and inform them about areas that
    need improvement. Also, an organization can identify threats against itself, and
    it is up to the tester to validate or invalidate the threats.Often, companies
    use penetration tests to bolster their image to their target market. Here, a company
    can indicate that it was able to withstand attacks, and as such, is secure and
    has a robust infrastructure. This testing can also alert an organizations'' management
    about a potential security threat existing within its operations or systems. A
    penetration test that is well-executed can uncover vulnerabilities systematically.
    The management can be unaware of the existence of these vulnerabilities.Types
    of Penetration TestingThe first type examines the physical infrastructure of a
    subject. A tester can exploit the physical security of an organization. In most
    cases, the problems do not lie in the databases and other configurations, but
    the physical countermeasures in place. Questions to ask here include: is there
    adequate access control? Does the building housing the organization have security
    guards? Are they well trained? Is checking of sensitive materials conducted when
    employees exit the building? Are electronic devices registered and verified on
    the entry and exit of the building? To answer these questions, a tester will attempt
    to walk into the building at a time when people are arriving to work, say in the
    morning. Suppose an intruder can gain access to a company''s building without
    being checked, they will be in a position to obtain the information they are after.The
    second type of penetration testing is concerned with the operational aspects of
    an organization. Operational testing ascertains the effectiveness of laid down
    procedures of operation in the organization through circumventing those procedures.
    This is unlike physical testing, which only checks the physical access to networks,
    facilities, or company computers.The third and final type deals with electronic
    testing. In this testing mechanism, a tester will attack a company''s'' networks,
    communications facilities, or computer systems. Electronic testing can be accomplished
    by using automated tools, or it can also be done manually. Here, the main objective
    is to decipher vulnerabilities to an attack by way of communications facilities
    and data networks that are being used by the subject under consideration.A Tour
    of KaliOnce you start Kali, you’ll be greeted with a login screen, as shown in
    Figure 1­1\. Log in using the root account username root and the default password
    toor.![](rsrc1MB.jpg) ![](rsrc1MC.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MD.jpg)Figure: Logging into Kali using
    the root accountYou should now have access to your Kali desktop (see Figure 1­2).
    We’ll quickly look at![](rsrc1ME.jpg) ![](rsrc1MF.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) two of the
    most basic aspects of the desktop: the terminal interface and file structure.![](rsrc1MG.jpg)Figure:
    The Kali desktopThe TerminalThe first step in using Kali is to open the terminal,
    which is the command-line interface we’ll use in this book. In Kali Linux, you’ll
    find the icon for the terminal at the bottom of the desktop. Double­click this
    icon to open the terminal or press CTRL­ALT­T. Your new terminal should look like
    the one shown in the figure below.![](rsrc1MH.jpg)Figure: The Kali terminalThis
    terminal opens the command line environment, known as the shell, which enables
    you to run commands on the underlying operating systems and write scripts. Although
    Linux has many different shell environments, the most popular is the bash shell,
    which is also the default shell in Kali and many other Linux distributions. To
    change your password, you can use the command passwd.The Linux FilesystemThe Linux
    filesystem structure is somewhat different from that of Windows. Linux doesn’t
    have a physical drive (such as the C: drive) at the base of the filesystem but
    uses a logical filesystem instead. At the very top of the filesystem structure
    is /, which is often referred to as the root of the filesystem, as if it were
    an upside­down tree (see the figure below). Keep in mind that this is different
    from the root user. These terms may seem confusing at first, but they will become
    easier to differentiate once you get used to Linux.![](rsrc1ME.jpg) ![](rsrc1MF.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg)![](rsrc1MJ.jpg)Figure: The Linux filesystemThe root (/) of the
    filesystem is at the top of the tree, and the following are the most important
    subdirectories to know:/root: The home directory of the all­powerful root user/etc:
    Generally contains the Linux configuration files—files that control when and how
    programs startup/home: The user’s home directory/mnt: Where other filesystems
    are attached or mounted to the filesystem/media: Where CDs and USB devices are
    usually attached or mounted to the filesystem/bin: Where application binaries
    (the equivalent of executables in Microsoft Windows) reside/lib: Where you’ll
    find libraries (shared programs that are similar to Windows DLLs)We will spend
    more time with these key directories throughout this book. Understanding these
    first­level directories is important in navigating through the filesystem from
    the command line.It’s also important to know before you start that you should
    not log in as root when performing routine tasks because anyone who hacks your
    system (yes, hackers sometimes get hacked) when you’re logged in as root would
    immediately gain root privileges and thus “own” your system. Log in as a regular
    user when starting regular applications, browsing the web, running tools like
    Wireshark, and so on.Basic Commands in LinuxTo begin, let’s look at some basic
    commands that will help you get up and running in Linux.Finding yourself with
    pwdUnlike when you’re working in a graphical user interface (GUI) environment
    like Windows or macOS, the command line in Linux does not always make it apparent
    which directory you’re presently in. To navigate to a new directory, you usually
    need to know where you are currently. The present working directory command, pwd,
    returns your location within the directory structure.Enter pwdin your terminal
    to see where you are:kali >pwd/rootIn this case, Linux returned /root, telling
    me I’m in the root user’s directory. And because you logged in as root when you
    started Linux, you should be in the root user’s directory, too, which is one level
    below the top of the filesystem structure (/).If you’re in another directory,
    pwdwill return that directory name instead.Checking Your Login with whoamiIn Linux,
    the one “all­powerful” superuser or system administrator is named root, and it
    has all the system privileges needed to add users, change passwords, change privileges,
    and so on. Obviously, you don’t want just anyone to have the ability to make such
    changes; you want someone who can be trusted and has proper knowledge of the operating
    system. As a hacker, you usually need to have all those privileges to run the
    programs and commands you need (many hacker tools won’t work unless you have root
    privileges), so you’ll want to log in as root.If you’ve forgotten whether you’re
    logged in as root or another user, you can use the whoamicommand to see which
    user you’re logged in as:kali >whoamirootIf I had been logged in as another user,
    such as my personal account, whoamiwould have returned my username instead, as
    shown here:kali >whoamiOTWNavigating the Linux FilesystemNavigating the filesystem
    from the terminal is an essential Linux skill. To get anything done, you need
    to be able to move around to find applications, files, and directories located
    in other directories. In a GUI­based system, you can visually see the directories,
    but when you’re using the command-line interface, the structure is entirely text-based,
    and navigating the filesystem means using some commands.Changing Directories with
    cdTo change directories from the terminal, use the change directory command, cd.
    For example, here’s how to change to the /etc directory used to store configuration
    files:kali >cd/etcroot@kali:/etc#The prompt changes to root@kali:/etc, indicating
    that we’re in the /etc directory. We can confirm this by entering pwd:root@kali:/etc#
    pwd/etcTo move up one level in the file structure (toward the root of the file
    structure, or /), we use cdfollowed by double dots (..), as shown here:root@kali:/etc#
    cd.root@kali:/# pwd/root@kali:/#This moves us up one level from /etc to the /
    root directory, but you can move up as many levels as you need. Just use the same
    number of double­dot pairs as the number of levels you want to move:You would
    use ..to move up one level.![](rsrc1MK.jpg)You would use ....to move up two levels.![](rsrc1MK.jpg)You
    would use ......to move up three levels, and so on.![](rsrc1MK.jpg)So, for example,
    to move up two levels, enter cdfollowed by two sets of double dots with space
    in between:kali >cd....You can also move up to the root level in the file structure
    from anywhere by entering cd /, where /represents the root of the filesystem.Listing
    the Contents of a Directory with lsTo see the contents of a directory (the files
    and subdirectories), we can use the ls(list) command. This is very similar to
