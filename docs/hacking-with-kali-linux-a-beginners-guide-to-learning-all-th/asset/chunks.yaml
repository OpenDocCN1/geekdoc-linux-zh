    \ to find applications, files, and directories located in other directories. In\
    \ a GUI-based system, you can visually see the directories, but when you’re using\
    \ the command-line interface, navigating the filesystem means using some commands.\
    \ Changing Directories with `cd`\n\nTo change directories from the terminal, use\
    \ the change directory command, `cd`. For example, here’s how to change to the\
    \ `/etc` directory used to store configuration files:\n\n```bash\ncd /etc\n```\n\
    The prompt changes to `root@kali:/etc`, indicating that we’re in the `/etc` directory.\
