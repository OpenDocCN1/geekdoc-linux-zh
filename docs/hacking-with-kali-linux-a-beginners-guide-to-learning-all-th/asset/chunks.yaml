    In this book, however, we are going to focus on symmetric and asymmetric encryption.


    ## Symmetric Cryptography


    Here, both the sender and receiver possess similar keys. Symmetric cryptography
    is undoubtedly the commonly used form of cryptography today. Picture this; you
    encrypt a message using a password. Supposing I have the same password, I will
    be able to access the encrypted message. Any other person will not read that message.
    See how easy that is! This type of cryptography is high-speed and is well suited
    for streaming applications or bulk storage. A major stumbling block with this
    method of cryptography is the key exchange. As in the example we have seen above,
    if we have two ends requiring similar keys, what they need is another third channel
    that can be used to exchange the keys. This is where symmetric cryptography has
    its biggest weakness. Assume the entities intending to exchange messages are miles
    apart, how then, can the key be exchanged. As you may already be aware, the aspect
    of confidentiality arises. The entities can decide to exchange the key via email,
    mail, telephone, and so on. That makes it possible to intercept the key that is
    being exchanged, and as such, the encryptions’ confidentiality will be compromised.
    We have many symmetric algorithms currently in use. The common ones are briefly
    discussed below.


    1. **DES** – Developed by IBM, `DES` was among the pioneer encryption schemes.
    Later own, `DES` was discovered to possess flaws and was breakable as well. It
    was `DES` encryption that was used in hashing early systems of LANMAN originally
    (pre-2000).

    2. **3DES** – It is the flaws in `DES` that occasioned the development of this
    encryption algorithm. It works by a triple application of the `DES` hence its
    name. That makes it a bit more secure when compared to `DES`.

    3. **AES** – In full, `AES` stands for Advanced Encryption Standard. Cryptographically
    speaking, `AES` is not an encryption algorithm by itself. It was NIST that developed
    `AES`. It is one of the most robust encryption in use today. `AES` utilizes the
    128-, 196-, and 256-bit keys. Since 2001, `AES` has been occupied by the `Rijndael`
    algorithm. This standard is commonly used in `SSL/TLS`, `WPA2` among other protocols
    that need speed and confidentiality.

    4. **RC4** – This does encryption of each bit or byte instead of a single block
    of information. This is called streaming. `RC4` was designed and created by RSAs’
    Rivest Ronald. This method of encryption is commonly used in `WEP` and `VoIP`
    applications.

    5. **Blowfish** – `Blowfish` utilizes a key with a varying length. It is a very
    secure encryption scheme. It is additionally open-source and as such anyone can
    be able to use it without a license.

    6. **Twofish** – It is similar to `Blowfish`. It, however, possesses advanced
    capabilities such as the use of the 128 or 256-bit key. `Twofish` was at some
    point, a strong contender for `AES`. Examples of applications using `Twofish`
    include `cryptcat` and `OpenPGP`, among others. Additionally, it is not patented,
    just like `Twofish`.


    ## Asymmetric Cryptography


    This type of cryptography utilizes different keys for the two ends of the channel
    of communication. It is an astonishingly slow technique that when compared to
    symmetric cryptography, is about a thousand times slower! It is, therefore, an
    undesirable method for use where bulk encryption or streaming communication is
    concerned. On a positive note, it solves the problem of key exchange. This is
    because there is no need for having the same keys at both ends of a communication.
    This type of cryptography is predominantly utilized in cases where two entities
    need to exchange information but are unknown to each other. The information being
    transferred here usually is in the form of small bits, for instance, identifying
    information, i.e., a certificate or a key. Due to limitations in speed, asymmetric
    cryptography is not generally used for bulk or streaming-encryption. Below are
    some schemes found under asymmetric encryption.


    1. **Diffie-Hellman** – Without any doubt, `Diffie-Hellman` key exchange can be
    said to be the most exceptional development in cryptography. Diffie and Hellman
    came up with a method of key generation. This effectively eradicated the problem
    of key exchange that is often a characteristic of symmetric key encryption.

    2. **RSA** – This is an abbreviation for Rivest, Shamir, and Adleman. This scheme
    makes use of a method where very large prime numbers are factorized. The result
    is used as the relationship between the two keys.

    3. **PKI** – this is a Public key infrastructure mainly used for exchanging confidential
    information in an asymmetric system. `PKI` makes use of a public key alongside
    a private key.

    4. **ECC** – this is short for Elliptical curve cryptography. The scheme is slowly
    but surely gaining popularity in the world of mobile computing. This is because
    it is efficient and also requires minimal energy consumption and computing power
    to provide a similar level of security. The scheme is dependent on the relationship
    that is shared by two functions that are located on the same elliptical curve.

    5. **PGP** – an abbreviation for Pretty Good Privacy that makes use of encryption
    that asymmetric for purposes of ensuring the integrity and privacy of email messages.

