    - **Tester**: This is the entity carrying out the penetration test. It can either
    be a person or a group. It is a tester that plans and carries out the penetration
    test.

    - **Attacker**: This is an original version of a penetration tester. The differentiating
    factor is that while testers intend to help improve the security of a company,
    an attackers'' intention is malicious, i.e. to steal a company''s'' resources
    or information.

    - **Attack**: we can say these are the attempts a hacker or a penetration tester
    makes to help them bypass a targets’ security controls. The sequence of an attack,
    in most cases, has methods that are electronic, physical, or procedural.

    - **Management**: This is an organizations’ leadership. The testing process can
    include numerous levels of management especially those controlling specific areas.
    The management levels involved will have an impact with regards to the scope of
    the test.

    - **The Test Subject**: This can either be a small organizational unit within
    a company or the entire company upon whom the penetration test will be performed.

    - **The target**: The target is the organization or system being subjected to
    an attack. It can be aware of the test being done on it or not. Either way, most
    targets have their own safeguard mechanisms with which they can defend themselves.

