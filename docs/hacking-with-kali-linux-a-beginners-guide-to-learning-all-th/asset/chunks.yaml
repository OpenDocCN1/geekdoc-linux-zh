    然而，在本书中我们将关注对称加密和非对称加密。


    ## 对称加密


    在这里，发送者和接收者都拥有相同的密钥。对称加密无疑是目前最常用的加密形式。想象一下：你使用密码对消息进行加密。假设我有相同的密码，我就能访问该加密消息。任何其他人都无法读取该消息。看，这有多简单！这种加密类型速度极快，非常适用于流媒体应用或批量存储。这种加密方法的一个主要障碍是密钥交换。正如我们在上文看到的示例所示，如果两端需要相似的密钥，它们需要另一个可以用于交换密钥的第三通道。这就是对称加密最大的弱点。假设意图交换消息的实体相隔数英里，那么密钥如何交换呢？正如你可能已经意识到的，机密性问题随之出现。实体可以选择通过电子邮件、邮件、电话等方式交换密钥。这使得传输过程中的密钥可能被拦截，因此加密的机密性将受到破坏。我们目前正在使用许多对称算法。下面简要讨论了常用的算法。


    1. **DES** – 由 IBM 开发，`DES` 是早期的加密方案之一。后来，发现 `DES` 存在缺陷且是可以被破解的。早期的 LANMAN 系统（2000
    年以前）哈希系统使用的 `DES` 加密。

    2. **3DES** – 正是因为 `DES` 的缺陷导致了这种加密算法的发展。它通过三次应用 `DES` 来工作，因此得名。与 `DES` 相比，它更安全一些。

    3. **AES** – `AES` 全称为高级加密标准。从密码学的角度来说，`AES` 本身并不是一种加密算法。是 NIST 开发了 `AES`。它是目前使用的最健壮的加密之一。`AES`
    利用 128 位、196 位和 256 位密钥。自 2001 以来，`AES` 由 `Rijndael` 算法采用。该标准常用于 `SSL/TLS`、`WPA2`
    等需要速度和机密性的协议。

    4. **RC4** – 它对每个位或字节进行加密，而不是单个信息块。这被称为流加密。`RC4` 由 RSA 的 Rivest Ronald 设计创建。这种加密方法常用于
    `WEP` 和 `VoIP` 应用。

    5. **Blowfish** – `Blowfish` 使用变长密钥。它是一种非常安全的加密方案。此外，它是开源的，因此任何人都可以无需许可使用它。

    6. **Twofish** – 它与 `Blowfish` 类似。但它拥有更先进的功能，例如使用 128 位或 256 位密钥。`Twofish` 曾是
    `AES` 的有力竞争者。使用 `Twofish` 的应用示例包括 `cryptcat` 和 `OpenPGP` 等。此外，它和 `Blowfish` 没有专利。


    ## 非对称加密


    这种加密在通信通道的两端使用不同的密钥。这是一种惊人的缓慢的技术，与对称加密相比，速度慢了约千倍！因此，对于涉及批量加密或流式通信的情况，这不是理想的方法。从好的一面来说，它解决了密钥交换问题。因为不需要在通信的两端拥有相同的密钥。这种加密主要用于两个实体需要交换信息但互不认识的情况。这里传输的信息通常是小位比特形式，例如标识信息，即证书或密钥。由于速度限制，非对称加密通常不用于批量或流式加密。以下是非对称加密下的一些方案。


    1. **Diffie-Hellman** – 毫无疑问，`Diffie-Hellman` 密钥交换可以认为是密码学中最卓越的进展。Diffie 和 Hellman
    提出了一种密钥生成方法。这有效地消除了对称密钥加密中经常出现的密钥交换问题。

    2. **RSA** – 这是 Rivest、Shamir 和 Adleman 的缩写。该方案使用对大质数进行分解的方法。结果被用作两个密钥之间的关系。

    3. **PKI** – 这是公钥基础设施，主要用于在非对称系统中交换机密信息。`PKI` 使用公钥配合私钥。

    4. **ECC** – 这是椭圆曲线密码学的缩写。该方案在移动计算领域正缓慢但坚定地获得普及。这是因为它的高效，而且只需要极少的能量消耗和计算能力就能提供类似的安全水平。该方案依赖于位于同一椭圆上的两个函数之间共享的关系。

    5. **PGP** – Pretty Good Privacy 的缩写，利用非对称加密来确保电子邮件信息的完整性和隐私性。


    '
- fmt: '

    # Data Security


    For us to minimize unauthorized access to databases, websites, and computers,
    we need measures that can safeguard digital privacy. These measures are what we
    call data security. It serves to guard data against corruption. For all organizations,
    big and small alike, data security is a crucial IT aspect. Sometimes it can be
    referred by the name computer security or information security. Common technologies
    used for data security comprise data masking, backups, and also data erasure among
    many others. Encryption is also a data security technology that is essential in
    safeguarding the privacy of data as we have said. Here, hardware, software, hard
    drives, and digital data are encrypted. This is to make sure that they are unreadable
    to hackers and other users. Here we are talking about those who are unauthorized
    that may get their hands on the hardware or software.


    Authentication is one way of practicing data security. It is likely that you have
    encountered a scenario where you needed a password to log into your device or
    even to access your email. Users must provide identifying credentials such as
    biometric data, a password, a username, and so on to do a verification of their
    identities before granting them access to data or a system.


    ## Digital Certificates


    A digital certificate is used in the authentication of the web credentials of
    a particular sender. The certificate also allows the receiving entity of an encrypted
    message to get to understand that the data is from a source that is trusted. A
    certification authority issues the digital certificate. Message encryption and
    self-signatures use digital certificates. Identity certificates or public key
    certificates is the other name we use for digital certificates. `X.509` is an
    example of a commonly used digital certificate.


    # Chapter 8: Cyber Security


    ![Sicurezza Informatica, Hacker, Sicurezza, Cyber](rsrc1N9.jpg)


    The `crondaemon` and the `crontable` (`crontab`) are the most useful tools for
    scheduling regular tasks. The first, `crond`, is a daemon that runs in the background.
    The `crondaemon` checks the `crontable` for which commands to run at specified
    times. We can alter the `crontable` to schedule a task or job to execute regularly
    on a particular day or date, at a particular time daily, or every so many week
    or months.


    To schedule these tasks or jobs, enter them into the `crontable` file, located
    at `/etc/crontab`. The `crontable` has seven fields: the first five are used to
    schedule the time to run the task, the sixth field specifies the user, and the
    seventh field is used for the absolute path to the command you want to execute.
    If we were using the `crontable` to schedule a script, we could simply put the
    absolute path to the script in the seventh field.


    Each of the five time fields represents a different element of time: the minute,
    hour, day of the month, month, and day of the week, in that order. Every element
    of time must be represented numerically, so March is represented as 3 (you cannot
    simply input “March”). Days of the week begin at 0, which is Sunday, and end at
    7, which is also Sunday.


    Table 16-1 summarizes this![](rsrc1ME.jpg) ![](rsrc1MF.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)
    ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg) ![](rsrc1MB.jpg)

    Table 16-1: Time Representations for Use in the `crontab`![](rsrc1NA.jpg)![](rsrc1NB.jpg)


    | Field | Time unit | Representation |

    | :--- | :--- | :--- |

    | 1 | Minute | 0–59 |

    | 2 | Hour | 0–23 |

    | 3 | Day of the month | 1–31 |

    | 4 | Month | 1–12 |

