    # Proxy Servers


    Another strategy for achieving anonymity on the internet is to use proxies, which
    are intermediate systems that act as middlemen for traffic: the user connects
    to a proxy, and the traffic is given the `IP address` of the proxy before it’s
    passed on.


    When the traffic returns from the destination, the proxy sends the traffic back
    to the source. In this way, traffic appears to come from the proxy and not the
    originating `IP address`. Most probably, the proxy will keep a log of your traffic.
    However, an investigating entity would need to obtain a search warrant or subpoena
    in order for them to obtain the logs. To make your traffic even harder to trace,
    you can use more than one proxy, in a strategy known as a `proxy chain`, which
    we’ll look at a little later in this chapter. Kali Linux has an excellent proxying
    tool called `proxychains` that you can set up to obscure your traffic. The syntax
    for the `proxychains` command is straightforward, as shown here:


    ```bash

    proxychains <the command you want proxied> <arguments>

    ```

