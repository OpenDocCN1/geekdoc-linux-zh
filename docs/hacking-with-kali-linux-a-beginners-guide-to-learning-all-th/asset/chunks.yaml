  trans: '

    攻击者可以使用诸如 `scapy`、`airrack-ng` 工具包、`file2air` 等工具来发起拒绝服务去认证攻击。攻击者只需要网络的 SSID、接入点的
    `BSSID` 以及目标机器的 MAC 地址，即可开始攻击。`TCPdump`、`airodump-ng`、`Wireshark` 和 `kismet` 都是攻击者可以用来获取这些信息的工具。无线网络攻击者可能会选择在传输去认证帧之间插入静默期，以规避检测并使攻击更具隐蔽性。


    ## 结论


    我借此机会感谢你读完《使用 Kali Linux 进行黑客攻击》。希望这本书对你有所益启发，通过它，你已经积累了必要的知识，让你能够开启黑客职业，或者如果你已经是从业者，则可以提升你的技能。


    我衷心希望你喜欢从`黑客攻击基础`、`网络攻击`、`用于黑客的 Linux`、`Kali 基础`、`网络扫描与管理`、`文件和目录权限`、`网络安全`、`变得安全与匿名`直到最后的密码学基础的整个阅读过程。我也希望通过学习这本书，你已经学习了许多成为黑客专家所需的实用概念。


    到这里，你应该已经能够接触关于可以在你的系统上发起的各种类型攻击的大量理论知识，了解攻击的原因，以及你如何保护你的基础设施免受此类攻击。这些是你迈向专业黑客的第一步。本书涵盖了无线网络攻击、网络攻击和渗透测试等主题。因此，这意味着你现在处于一个极佳的位置，可以识别现实世界中发生的网络攻击机制并建议适当的补救措施。


    我还为你提供了若干可以实施的以保持网络安全的安全措施。格式设计使得语言非常易于理解，让你能够理解系统安全的重要性。未来，下一步是将你从书中学到的概念付诸实践。俗话说熟能生巧，只有通过实践，人们才能成为黑客领域的大师，使用
    `Kali Linux` 更是如此。让你从书中学到的知识为你效力吧。


    最后，如果你觉得这本书在任何方面都有帮助，我们将非常感谢你在 Amazon 上的评价！

    '
