    此命令列出当前目录中包含的文件和目录。你也可以通过在命令后加上目录名称对任何特定目录使用此命令，而不限于当前所在的目录；例如，`ls/etc` 会显示 `/etc`
    目录下的内容。


    要获取更多关于文件和目录的信息（例如权限、所有者、大小以及最后修改时间），你可以在 `ls` 之后添加 `-l` 选项（`l` 代表 long，长格式）。这通常被称为长列表显示。让我们在这里尝试一下：


    如你所见，`ls -l` 为我们提供了多得的信息，例如对象是文件还是目录、链接数、所有者、组、大小、创建或修改时间以及名称。每当在 Linux 中进行列出操作时，我通常都会添加
    `-l` 选项，但人有千不同。


    Linux 中的某些文件是隐藏的，通过简单的 `ls` 或 `ls -l` 命令无法显示。要显示隐藏文件，请添加小写的 `-a` 选项，如下所示：`kali
    >ls -la`。如果你没有看到预期的文件，值得尝试带有 `a` 标志的 `ls` 命令。


    ### 获取帮助

    Linux 中的几乎每个命令、应用程序或实用程序都有专门的帮助文件，提供使用指导。例如，如果我需要关于使用最佳无线破解工具 `aircrack-ng` 的帮助，我只需输入
    `aircrack-ng` 命令并后跟 `--help` 命令即可：`kali >aircrack-ng--help`。注意这里的双横线。Linux 的惯是在单词选项（如
    help）之前使用双横线（`--`），在单字母选项（如 `-h`）之前使用单横线（`-`）。


    当你输入此命令时，你应该看到该工具的简短描述和使用指南。在某些情况下，你可以使用 `-h` 或 `-?` 来进入帮助文件。遗憾的是，尽管许多应用程序支持这三个选项（`--help`、`-h`
    和 `-?`），但无法保证你使用的应用程序也会支持。因此，如果一个选项无效，请尝试另一个。


    ### 使用 man 参考手册

    除了帮助选项外，大多数命令和应用程序都有手册（`man`）页提供更多信息，例如命令或应用程序的描述和摘要。你只需在命令、实用程序或应用程序之前输入 `man`
    即可查看手册页。例如，查看 `aircrack-ng` 的手册页，你需要输入以下内容：


    `man aircrack-ng`


    这会打开 `aircrack-ng` 的手册，提供比帮助信息更详细的内容。你可以使用 `ENTER` 键滚动此手册文件，也可以分别使用 `PG DN` 和
    `PG UP` 键向上或向下翻页。要退出，只需输入 `q`（代表 quit），你将返回命令提示符。


    ### 寻找东西

    在熟悉 Linux 之前，在其中穿行可能会令感到沮丧，但掌握一些基础命令和技巧将极大地让命令行变得更加友好。以下命令帮助你从终端定位物品。


    #### 使用 locate 搜索

    可能是最易使用的命令是 `locate`。后面紧跟一个表示你想要查找内容的关键词，该命令将遍历整个文件系统并定位该词出现的所有位置。例如，查找 `aircrack-ng`，输入以下内容：


    `kali >locateaircrack-ng`

    `/usr/bin/aircrack-ng/usr/share/applications/kali-aircrack-ng.desktop/usr/share/desktop-directories/05-1-01-aircrack-ng.directory--snip--/var/lib/dpkg/info/aircrack-ng.md`


    然而，`locate` 命令并不是完美的。有时 `locate` 的结果可能会让人 overwhelming，给你过多的信息。此外，`locate` 使用的数据库通常每天更新一次，所以如果你几分钟或几小时前刚创建了一个文件，在第二天之前可能不会出现在列表中。了解这些基础命令的缺点是重要的，以便你更好地决定何时使用每一个。


    #### 使用 whereis 查找二进制文件

    如果你正在寻找二进制文件，可以使用 `whereis` 命令来定位它。该命令不仅返回二进制文件的位置，如果可用，还会返回其源码和手册页。这是一个示例：


    `kali >whereisaircrack-ng`

    `aircrack-ng: /usr/bin/aircrack-ng /usr/share/man/man1/aircrack-ng.1.gz`


    在这种情况下，`whereis` 只返回了 `aircrack-ng` 的二进制文件和手册页，而不是 `aircrack-ng` 一词的所有出现处。你不觉得这高效得多且一目了然吗？


    #### 使用 which 查找 PATH 变量中的二进制文件

    `which` 命令更加具体：它只返回 Linux 中 `PATH` 变量中的二进制文件位置。我们将在第 7 章详细查看 `PATH` 变量，但目前只需知道
    `PATH` 包含了操作系统在执行命令行执行的命令时查找的目录即可。例如，当我在命令行输入 `aircrack-ng` 时，操作系统会查看 `PATH` 变量，以确定应该在哪些目录查找
    `aircrack-ng`：


    `kali >whichaircrack-ng`

    `/usr/bin/aircrack-ng`


    在这里，`which` 能够在 `PATH` 变量列出的目录中找到单个二进制文件。至少这些目录通常包含 `/usr/bin`，但也可能包括 `/usr/sbin`
    以及其他几个。


    #### 使用 find 执行更强大的搜索

    `find` 命令是搜索工具中最强大且最灵活的。它能够从任何指定的目录开始搜索，并查找许多不同的参数，当然包括文件名，以及创建或修改日期、所有者、组、权限和大小。


    以下是 `find` 的基本语法：

    `find directory options expression`


    所以，如果我想从根目录开始搜索名为 `apache2`（开源 Web 服务器）的文件，我将输入以下内容：


    `kali >find/ -type f -name apache2`


    首先，我指定开始搜索的目录，在本例中为 `/`。然后，我指定要搜索的文件类型，在本例中 `f` 代表普通文件。最后，我给出我正在查找的文件名。


    我的搜索结果如下：


    `kali >find / -type f -name apache2`

    `/usr/lib/apache2/mpm_itk`

    `/usr/lib/apache2/mpm_event`

    `/usr/lib/apache2/mpm_worker`

    `/usr/lib/apache2/mpm_prefork`

    `/etc/cron.daily/apache2`

    `/etc/logrotate.d/apache2`

    `/etc/init.d/apache2`

    `/etc/default/apache2`


    `find` 命令从文件系统的顶部（`/`）开始，查找文件名中的 `apache2`，然后列出了所有实例。


    正如你可能想象的，搜索每个目录可能会很慢。提高速度的方法是只在你预期找到文件的目录中查找。在这种情况下，我们正在查找一个配置文件，所以我们只在 `/etc`
    目录中搜索，Linux 只搜索其子目录。让我们尝试：


    `kali >find /etc -type f -name apache2`

    `/etc/init.d/apache2`

    `/etc/logrotate.d/apache2`

    `/etc/cron.daily/apache2`


    在 `/etc` 目录及其子目录中搜索 `apache2` 快得多。还需要注意的是，与其他命令不同，`find` 只显示精确匹配。如果文件 `apache2`
    有任何扩展，我们可以通过通配符来解决此限制，通配符允许我们匹配多个字符。通配符有几种形式：


    `kali >find /etc -type f --name apache2.*`

    `/etc/apache2.conf`


    当我们运行此命令时，`find` 在 `/etc` 目录中查找符合 `apache2.*` 的。


    ### 第 3 章：硬件使用 Linux

    当你开启黑客之旅时，你会发现大多数专业和专家黑客都使用 Linux/Unix。此外，某些类型的黑客可以使用 Mac OS 和 Windows。这是许多黑客工具专门为
    Linux 设计和构建的原因。


    #### 为什么黑客使用 Linux

    以下是黑客偏好 Linux 的原因：


    1. **Linux 是开源的**：与 操作系统不同，Linux 发行版是开源的。Linux 用户可以访问源代码。这意味着人们可以根据需要操作操作系统。

    2. **Linux 是透明的**：执行黑客需要深入理解操作系统。与 Windows 不同，我们可以看到并操作 Linux 的所有部分。透明性意味着使用 Linux
    是有效的。

    3. **Linux 提供细粒度控制**：Linux 用户对系统拥有无限的控制权，无论是在微观还是宏观层面。这简单且有效。

    4. **大多数黑客工具为 Linux 编写的**：大多数用于黑客的工具都是明确为 Linux 编写的。有些适用于 Windows 但功能有限。

    5. **未来属于 Linux/Unix**：多年来，你可能看到 Windows 运行变慢。由于其可靠性和稳定性，Linux 仍然是服务器的选择。


    #### 什么是 Kali Linux?

    Kali Linux 是 Debian 系的一个发行版。它专门为安全审计和渗透测试设计和开发。该发行版包含数百种专注于信息安全任务的工具和实用程序，可能逆向工程、渗透测试、计算机取证和安全研究。Offensive
    Security 是 Kali Linux 背后的组织。他们开发并维护 Kali。


    该发行版最初于 2013 年 3 月发布，是 BackTrack Linux 的全面重建。它遵循 Debian 开发标准。Kali Linux 拥有超过 600
    种用于渗透测试的工具。对 BackTrack 进行彻底审查后，删除了一些无效或重复的工具。来自 Kali 工具网站的一些细节：


    - **Kali Linux 将永远免费**：就像 BackTrack 一样，kali 是免费的且一直是。这意味着你现在或未来都不会为它付费。

    - **它是开源的**：Kali Linux 使用的源代码适用于想要改进、修改或重建包的人。

    - **Kali 符合 FHS**：该发行版遵循文件层级标准。这些标准帮助 Linux 用户无缝定位文件、二进制文件和库。

    - **支持广泛的无线设备**：该系统设计多个平台以支持无线接口。它可以在各种硬件上运行。

    - **内核经过自定义并打了注入补丁**：最新的注入补丁包含在 Kali Linux 内核中。

    - **它创建在一个安全的环境中**：负责 Kali 开发的团队是一小群受信任提交包并与存储库交互的人员。这些过程中使用了安全协议。

    - **GPG 签名的存储库和包**：Kali Linux 中的所有包通常由个人开发者签名。包随后也会由存储库签名。

    - **支持多种语言**：大多数渗透工具和实用程序通常用英语编写。尽管如此，Kali 仍提供了真正的多语言支持。用户能够以他们的母语进行操作。

    - **Kali 易于自定义**：所有用户都可以根据自己的要求和喜好修改 Kali。


    #### 下载 Kali Linux

    在带你走上成为黑客的道路之前，你首先需要在计算机上下载并安装 Kali Linux。这是我们在整本书中都将使用的 Linux 发行版。可以通过 https://www.kali.org/
    完成。导航到主页并点击页面顶部的 Downloads 链接。选择正确的下载项非常重要。


    #### 安装 Kali 和设置 Kali Linux 的程序

    为了开始，你需要使用你偏好的安装介质启动。你应该看到 Kali 启动屏幕。选择文本模式安装（Text-Mode）或图形界面安装（Graphical install）。在本例中，我们选择了
    GUI 安装。


    选择你的语言偏好以及国家位置。此外，你会被提示选择你偏好的键盘布局。选择你的位置。安装程序将镜像拷贝到你的硬盘，探测你的网络接口，然后提示你为系统输入主机名。在下面的示例中，我们输入
    `kali` 作为主机名。


    接下来，为系统非 root 用户提供一个全名。系统将根据你提供的全名创建一个默认用户 ID。如果你喜欢，可以修改它。之后，选择合适的时区。接下来，你将看到类似图片的内容。进行相应的选择。选择你想要分区的磁盘。继续到下一步，根据你的需求选择。接下来，点击继续按钮。下一步需要你执行网络镜像的配置。接下来安装
    GRUB。最后，点击继续重启进入你新的 Kali 安装。


