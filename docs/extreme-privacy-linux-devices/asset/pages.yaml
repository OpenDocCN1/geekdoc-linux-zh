  md: '![](img/0f4cb0c004f7a6008c9865ebb193273a_26_0.png)


    Are you confused yet? I know this can seem overwhelming when first encountering
    Linux. My software installation policy is simple. If I search any programs within
    a web browser, visit the official site for the application, and identify the official
    ways of installing the software per their recommendations. If a "deb" or "apt"
    solution is available, I will typically prefer in order to incorporate the program
    into my system. If a Flatpak option is available on the official site, and in
    Pop!Shop, I will install that if the application will work in a completely isolated
    environment. If the only way to update a program is to use an official AppImage
    file, I will replicate the tutorial we just completed. We will have much more
    practice throughout the rest of this guide.


    # Calendar & Contacts


    Pop! OS possesses default calendar and contacts applications, which can be accessed
    from the "Show Applications" icon within the Dock. By default, any data entered
    within these programs is stored locally within the encrypted drive. If you only
    need your calendar and contacts within your Linux device, these options should
    work well. However, locally-stored data is not likely sufficient for your needs.
    Most people want to synchronize their calendar events and data across multiple
    devices, especially to their mobile phones. You have two secure options for this:
    If you use Proton Mail, Tutanota, or Skiff Mail for all, contacts and calendar
    entries are end-to-end encrypted for your protection (Proton Mail does not encrypt
    the name and email address in order for their system to function properly), but
    would allow you to see your data within web browsers and mobile device apps. However,
    none of these services can synchronize your data to the Stock calendar and contacts
    applications (the mobile equivalents). On mobile devices, this means that telephone
    apps and event notifications cannot access this data. For full secure synchronization,
    we need EteSync.

    teSync (etesync.com) is a service which offers end-to-end encrypted calendar,
    contacts, and notes data. For $2 monthly, they will store your data on their servers
    in a secure way in which they cannot access any of your data. You can then download
    the'
