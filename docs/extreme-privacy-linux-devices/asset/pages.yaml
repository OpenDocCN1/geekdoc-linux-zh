    # Creating a Linux VM on macOS Host


    I believe UTM (mac.getutm.app) is the best virtualization software for Apple computers.
    This phenomenal and open-source software works better with macOS than any other
    free or paid product. Install it from Terminal with the following command (assuming
    you Homebrew (brew.sh) installed.

    brew install --cask utm


    UTM allows macOS users to launch practically any virtual system within host machines
    which have either Intel or ARM (Apple) processors. This means it will work with
    any Apple computer, regardless of the hardware. UTM employs Apple''s Virtualization
    framework to run operating systems on Apple Silicon at native speeds. On Intel-based
    machines, traditional x86/x64 operating systems can be virtualized. In addition,
    lower emulation is available to run x86/x64 on Apple Silicon as well as ARM64
    on Intel. This program-paid alternatives do not offer all of these features. The
    software relies on QEMU, which has always been otherwise difficult to configure.
    I now rely solely on UTM for all VMs on my macOS machine, and I find it to be
    superior to Windows or Linux host.


    Upon opening UTM, you have the option to ''Create New Virtual Machine''. If this
    is not visible, you can replicate the action by clicking ''File'' > ''New'' within
    the program''s menu. This choosing presents several options which may need to
    readers. You can select ''Virtualize'' or ''Emulate'' for your new VM. We should
    understand the difference.


    **Virtualize:** This process is accomplished with help of hardware, typically
    the hypervisor virtually shares the hardware resources of a single physical computer
    into multiple virtual devices by allocating resources from the system to the newly
    created virtual system. This is typically much faster than emulation and the option
    we choose for our new VM. If you have an M1, M2, or newer processor, you cannot
    virtualize x86/x64 operating systems, you can only virtualize ARM-based systems.
    Similarly, you cannot virtualize ARM-based systems from an x86/x64 machine. When
    using virtualization, the operating system must be created for the processor present
    within the device.


    **Emulate:** This process is more forgiving, but can be slow. It uses software
    to emulate specific hardware. This means the VM needs a software interpreter translating
    its code into the host system''s language. This eats up a lot of resources and
    can make things drag. Since the VM does not run on the host''s physical hardware,
    emulation is slower when compared to virtualization. By contrast, in virtualization,
    the guest system gets direct access to the host''s allocated resources, resulting
    in better speed. It is great to have this option, but we will not use it in this
    chapter.

    Let''s build our first Linux VM within UTM together. Choose the "Virtualize" option
    and then select "Linux". This brings us to need to choose the proper path based
    on our hardware. You must choose the appropriate version of Linux for your processor.
    Pop! OS ISO file was previously used to install it to a host. You could also use
    the Ubuntu ISO available on their website. If you have an M1, M2, or later processor,
    you need the ARM version'
