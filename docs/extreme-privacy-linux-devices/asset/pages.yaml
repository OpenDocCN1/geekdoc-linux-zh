  md: 'PS3=''Selection: ''; PS is short for Prompt Statement. PS3 presents a menu
    of

    choices in which you can select a corresponding number to execute the option.
    This

    basic creates an option for selection of future items in the script.

    options=(\RestartNextDNS); This is where we place the options for the menu.

    These should be worded exactly as we want them to appear within Terminal. There
    is

    no limit and should be in their view quotation marks.

    select opt in $\${options[0]}"; This continues the menu functionality.

    do: This is the process of executing our menu.

    case opt in: Used as an alternative to if/then statements. It is an easier

    way to present multiple executions within one script which can loop

    indefinitely.


    "RestartNextDNS ); This identifies the menu option for which we will specify a

    command or series of commands. It should match the option as listed in the previous

    section verbatim.


    ```

    nextdns restart: This is the Terminal command which we want executed when the

    menu item is selected.

    ;;; This command (case backwards) ends our chosen case statement.

    esac:

    done. This is the end of our script.

    ```


    Next, you would create a "maintenance.desktop" file in your Documents folder which

    tells the operating system to launch the script from your Applications menu. Below
    is

    the code I used.


    ```

    [Desktop Entry]

    Type=Application

    Name=Maintenance

    Categories=Application;Maintenance

    Exec=/usr/share/applications/maintenance.sh

    Terminal=true

    ```


    Now, you want to make the script executable and move both of these files to a

    location which is out of the way and can be seen by the operating system. I used
    the

    following commands.


    ```

    cd Documents

    chmod +x maintenance.sh

    sudo mv maintenance* /usr/share/applications/

    ```


    You should now see a new shortcut option within your Applications menu titled

    "Maintenance". The image below displays mine. Clicking this launches the script.

    lauch this script weekly to apply all updates, as discussed in the next chapter.'
