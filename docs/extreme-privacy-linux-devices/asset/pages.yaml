  md: '# CHAPTER TWO: HARDWARE CONFIGURATION


    If you are a macOS user, you are limited to specific hardware approved and sold
    by Apple. If you want a laptop, you have a handful of options which can be minimally
    optimized. Linux is a different beast. Since it runs on practically any computer
    hardware, the options are endless. You likely possess an old computer which is
    capable of running Linux without much effort or commitment. If not, you probably
    have a macOS or Windows device which could host a virtual machine. If you decide
    to purchase a new computer specifically designed for Linux, you have a new set
    of overwhelming choices. Let make sense of all of these options.


    **Used Equipment:** One of the best ways to test Linux is to install it onto a
    retired machine. If your computer is capable of running Linux, it will likely
    also handle Linux. If you prefer an Apple computer, things are not as straight
    forward. Older Apple computers made before 2016 should handle just about any Linux
    variation. If you have a newer Intel-based laptop with a touch, you will need
    a special variant of Linux available from 21linux.org. If your device was made
    after 2020 and has the latest processor, I do not recommend attempting a Linux
    installation. Everything should be possible. Keep old laptops specifically for
    testing new Linux builds.


    **Virtual Machines:** If you have only one computer, then a Linux virtual machine
    is ideal for experimentation. Chapter Eight goes into great detail about creating
    virtual machines within any Linux, macOS, or Windows platform. It explains how
    to build Linux and Windows virtual machines within your Linux host. Once created,
    your virtual machine will behave like a traditional installation on a host.


    **New Computers:** This is always my preference. If you decide to commit to a
    Linux lifestyle, purchasing a dedicated Linux machine with your own specifications
    is ideal. It opens the flood gates with multiple manufacturers, models, and customizations.
    However, I will walk you through my preferred options. A new machine with Linux
    pre-installed is not the easiest way to get going, it should offer the best possible
    integration into your daily activities.


    During the rest of this chapter, I will assume that you want to purchase a new
    computer for your Linux experience. However, the next chapter explains how to
    install Linux within any device capacity. For now, let''s focus on hardware options.


    There are thousands of new and used machines which could run Linux well. You might
    have a preference for Lenovo ThinkPad laptops, you might want to stick with that
    which is familiar. Maybe you prefer Dell machines. Both Lenovo and Dell work with
    Linux, but I believe we can do better. Let''s start with the processor. The processor
    is the chip which allows your computer to complete all of the functions and tasks
    you tell it to. It is the heart of a computer. It can also be the first vulnerability
    from an outside attack. Virtually every Intel processor since 2008 possesses software
    known as the Intel Management Engine (Intel ME). It is a subsystem of proprietary
    firmware embedded directly onto the chip. It is a small operating system. Any
    traditional operating system installed to the computer, such as Linux, would have
    no control over Intel ME. The Intel ME software runs during boot, while the computer
    is running, and while it is asleep. As long as the chipset is supplied power,
    it even continues to run when the system is turned off.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'The legitimate purpose of Intel ME, and AMD''s option called AMD Secure Technology
    (AMD ST), is to allow your device to be managed within a low-powered state. Administrators
    of large computer networks take advantage of this technology to remotely control
    many aspects of a computer within the network. The concerns arise due to the control
    which Intel ME has to all aspects of the device, the overall overness around the
    closed-source code behind these functions, and several known vulnerabilities which
    have been reported since 2017.


    Let''s have a reality check. Intel ME and AMD ST are not monitoring everything
    on a machine or allowing strangers to access your system. Substantial configuration
    on your device and the network to which it connects is required. You might never
    have a problem using Intel ME enabled. My concern is any new undisclosed vulnerabilities
    which could be abused by criminals. This presents my requirement for my Linux
    device. I have a machine with Intel ME disabled. You will likely never find a
    computer with all trees of Intel ME removed from its processor. However, there
    is an active community of people and companies constantly working to minimize
    the Intel ME processes to run within a system. The most active vendor is System76
    (system76.com).


    A company called Purism has previously offered laptops without Intel, but I strongly
    advise against purchase from Purism. They are still struggling to fulfill orders
    of their Linux-based phones several years after purchase. In some cases, people
    have been waiting five years for their device to ship, while being ignored by
    customer support. They refuse issue refunds for non-shipped items. Please avoid
    them. System76 only sells devices which are targeted toward Linux users and powers
    Linux when I shipped. I placed several orders for customized machines which shipped
    the next day from Colorado. Most of their laptops have Intel ME disabled by default.
    The second reason I prefer System76 over other vendors is their use of open-source
    firmware. This software replaces the proprietary code included with most motherboards.
    It is typically much faster and more secure. More importantly, it removes the
    hidden closed-source code which could be doing things on a hardware level.


    Hopefully you have decided that you also want a machine which has Intel ME disabled
    and instead of stock firmware. This means you need an Intel-based machine from
    System76. Sounds easy, right? You still have many options. System76 currently
    offers nine different desktop models and four desktop variants. Let''s begin with
    the laptop versus System76 Helio desktop computer for all of my breach work. I
    prefer a desktop for this because I can easily expand my storage and allow the
    desktop to complete lengthy tasks while I am away. I also like the sense of walking
    away from the computer instead of always having a laptop arm within reach. However,
    I don''t typically recommend desktops to most people. Laptops are portable and
    include a screen, keyboard, and trackpad. They are also more common and appropriate
    for most of my clients. If you need a desktop, you know your reasons why and do
    not need my input.


    If you are looking at nine System76 laptops and feel confused, you are not alone.
    I spent several hours digesting all of the options before I committed to my own
    machine. Since we can only have Coreboot and disabled Intel ME on Intel-based
    devices, this eliminates the Pangolin from the chip. That leaves us with eight
    options.'
  merge: -1
  pgno: 11
- img_proc: true
