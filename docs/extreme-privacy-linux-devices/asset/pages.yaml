  md: '# CHAPTER EIGHT: VIRTUAL MACHINES


    Virtual machines (VMs) visualize or emulate a particular computer system. They
    are computer operating systems on top of computer operating systems. Most commonly,
    a software program is executed within an operating system, and individual operating
    systems can launch within that program. Each virtual machine is independent from
    the other and the host operating system. The environment of one virtual machine
    has no impact on any others.


    Quite simply, it is a way to have numerous computers within your single computer.
    VMs offer a "clean" environment with no contamination from other internet usage.
    You will be able to clone an original VM in minutes and trash them immediately.
    We will use virtual machines in order to isolate specific computer usage from
    the daily driver which gets bombarded with online tracking.


    When I discussed Windows and macOS systems in other guides, I have encouraged
    readers to consider a Linux VM for sensitive tasks such as banking. If you are
    now using Linux host, I believe Linux VMs are overkill for many readers. You already
    possess great privacy and security within your host. Therefore, my guidance within
    this guide will focus on the following areas.


    +   * Create VMs on Windows hosts to experiment with Linux or possess a secure
    Linux environment for specific tasks.

    * Create VMs on macOS hosts in order to experiment with Linux or possess a secure
    Linux environment for specific tasks.

    * Create VMs on Linux hosts in order to experiment with other Linux builds or
    possess a secondary Linux environment for specific tasks.

    * Create Windows VMs on Linux hosts in order to have traditional operating system
    options within Linux.

    * Create Android VMs on Linux hosts in order to have traditional Android operating
    system options within Linux.


    Before creating a virtual machine, you must possess virtual machine software.
    There are several free and paid programs which you allow create and execute virtual
    machines. Premium options such as VMware offer a free version, but is extremely
    limited in function. Parallels works well on macOS, but is expensive. VirtualBox
    has always been the gold standard for virtual machine creation, but it does not
    play well with newer macOS systems. UTM works well on M series Apple processors,
    but not other systems. The list goes on forever. I will break out each option
    in the following pages:


    Creating a Linux VM on a Windows Host


    For Linux on a Windows host, I recommend VirtualBox (virtualbox.org). Full installation
    steps can be found at virtualbox.org but are not usually straightforward. At the
    time of this writing, the following steps are installed VirtualBox within Windows.


    +   * Navigate to virtualbox.org/Downloads.

    * Click the first appropriate link for your OS, such as "Windows Hosts".

    * Select the highest version NOT including "Beta", such as "7.0.0".

    * Download the appropriate "exe" file for Windows.

    * Download the Extension Pack for your version, such as "7.0.0.vbox-extpack".

    * Install the exe file with all default settings.

    * Double-click the Extension Pack and install it to VirtualBox.'
