  md: '# VLC


    Pop!_OS does not include any powerful media player. If you will ever encounter
    various audio and video files, I highly recommend installing VLC from Pop!_Shop.


    Office

    Pop!_OS includes the LibreOffice suite of applications for word processing, spreadsheets,
    and presentations. I prefer ONLYOFFICE for this purpose. It can safely be installed
    from Pop!_Shop.


    BleachBit Cleaner

    After some time, your Linux device will likely become saturated with old cache
    files, leftover data, and other unnecessary files. I recommend cleaning BleachBit
    weekly to keep things under control. I prefer the BleachBit (as root) option within
    the Pop!Shop (Flatpak). I accept the default configuration upon launch. I then
    select every option except "Free Disk" and click "Clean". In this point, while
    working from a new machine, I was able to free 1.02 GB of data.


    Utilities

    I prefer to add a few system utilities to any Linux distribution including GNOME
    Feeds for RSS, GNOME Podcasts for podcasts, and Metadata Cleaner to sanitize personal
    information from within files. All of these can be installed within the Pop_Shop
    with defaults. For Metadata Cleaner to function, you also need a utility called
    mat2, which can be installed via Terminal with the following.


    ```

    sudo apt install mat2 -y

    ```


    After a reboot, you can right-click on any image, video, or other file which may
    contain hidden metadata and clean the content. This will produce a second file
    next to the original with "clean" added to the file name.


    Virtual Currencies

    If you need virtual currency access, I always recommend an offline software-based
    wallet without the need for a third-party exchange. I rely on Ethereum for Bitcoin
    and Monero GUI Wallet for Monero. You may find these programs within Pop!Shop
    or another software repository, I would only install them directly from their
    original source. I obtain the Image file from the official Ethereum site located
    at https://ethereum.org/#download and then right-click the file to install it
    with AppLauncher. I downloaded the 64-bit file from the official site at https://www.getmonero.org/downloads,
    decompress it, and then right-click the Monero Image file to finish the installation
    process.


    Application Updates

    You keep your newly-installed software updated. The "Installed" tab in Pop!_Shop
    will allow you to patch your operating system and Flatpak/Deb programs, but it
    does not update all individual applications. I keep the following commands digitally
    ready within my local notes application for easy copying and pasting, but a future
    chapter will present a custom script which will automatically execute all of these
    commands.


    ```

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autclean -y

    flatpak update -y

    ```'
