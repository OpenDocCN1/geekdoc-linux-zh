    # # Twilio Sanitization Script


    I previously explained that Twilio is my preferred VoIP provider. If you use your
    Twilio numbers often, manually sanitizing the data stored on Twilio''s servers
    is quite time consuming. I possess an automated script that conducts all actions
    on my behalf, without logging into my Twilio account. Let''s start by installing
    Twilio CLI with the following steps. This should only be applied if you have a
    Twilio account.


    +   * Navigate to https://github.com/twilio/twilio-cli/releases.

    * Expand the latent "Assets" area until you find one with "amd64.deb" file.

    * Download the file, to sanitize "twilio-5.10.0-amd64.deb".

    * Right-click on the downloaded file, select "Open with Eddy", and click "Install".


    Once installed, execute the following within Terminal.

    This will ask for your Twilio SID and Token, which can be found in your portal.

    When prompted, provide a name of "CLI". Next, execute the following.


    # twilio profiles:use CLI


    This generates a configuration file which allows your computer to use this profile
    with the default credentials for all future commands. You can manually interact
    with the Twilio CLI using the following Terminal commands.


    ```

    twilio phone-numbers:list displays your current numbers in your account.

    tilio api:core:calls:list displays all voice calls records in your log files.

    --from,body displays SMS messages stored within your account.

    tilio api:core:recordings:list displays all voicemail recordings.

    tilio api:core:transcriptions:list displays all voicemail transcriptions.

    ```


    We can now automate the sanitation steps within a script which can be downloaded
    and installed with the following Terminal commands.

    cd ~/Documents

    wget https://inteltechniques.com/data/twilio.sh

    chmod +x twilio.sh'
