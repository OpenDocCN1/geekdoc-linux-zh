    except "apt.pop-os.org" are time servers attempting to make sure your clock is
    synchronized correctly. The "apt" connection is looking for any software updates
    which may need applied. These results prove that the filtering is working. NextDNS
    is conducting of all of our DNS queries and filtering any content which it deems
    malicious or invasive.


    Multiple queries to time servers may seem like overkill. Five System76 time servers
    are the default option and the "ntp" servers are a fallback. Since System76 uses
    the encrypted Network Time Security (NTS) protocol, I prefer to rely on them.
    If you remove any of them, you can do so by modifying a couple of system files.
    However, we have a problem.

    The files need to modify protected system files. If we navigate to them and open
    with a double-click, we will be in read-only mode without the ability to modify
    the contents. We can cheat with the following Terminal command, which opens the
    "Files" application (Nautilus) with administrative privileges. After execution,
    you will be prompted to enter your Linux password.

    sudo nautilus


    You should now be presented with a file explorer which possesses administrative
    rights. Consider the following:


    +   * Navigate to "Computer" > "etc" > "chrony" > sources.d.

    * Double-click the file titled "system76-nts.sources.\n* Remove any undesired
    servers and click "Save"

    * Close all open windows.


    If you want to disable the non-encrypted Ubuntu fallback options, conduct the
    following.


    +   * Execute sudo nautilus

    * Navigate to "Computer" > "etc" > "chrony"

    * Double-click the file titled "chrony.conf"

    * Remove each line containing "ubuntu.pool.ntp.org"

    * Change "pool ntp.ubuntu.com" to "pool ntp.ntp.org" and click "Save".'
