    * Microphone transmissions

    * Index of all media files on your computer

    * Webcam data

    * Browsing history

    * Search history

    * Location activity

    * Health activity collected by HealthVault, Microsoft Band, and other trackers

    * Privacy settings across the Microsoft application ecosystem


    Almost every aspect of Linux can be modified and customized. If you are a macOS
    user, you know that you cannot uninstall stock Apple software such as Mail, Photos,
    Facetime, Music, and other undesired applications. You are stuck'
