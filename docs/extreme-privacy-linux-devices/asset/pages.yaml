  md: '# CHAPTER TEN: UPDATES & MAINTENANCE


    I hope you have your ideal Linux device configured specifically for your needs.
    Next, you need to make sure you keep it that way. I encourage you to adopt a Linux
    maintenance schedule which makes most sense for you. My routine is to conduct
    all computer maintenance on Fridays when my digital work is over. Just so that
    I am writing this chapter on Friday, July 21, 2023. This makes it easy to document
    my entire process. I try to follow the actions once weekly when I am able to shut
    my computer down without interrupting any pending work.


    First, I open the Maintenance script and quickly launch option 7. This applies
    all Apt, Pop_OS, and Flatpak updates, and removes unnecessary items from these
    updates. I then launch Pop! Shop to make sure there are no pending updates which
    my script may have missed. Next, I check for any additional updates from "Settings"
    > "Upgrade & Recovery". I run BleachBit as root and clean everything "Free Disk
    Space". Finally, I reboot the machine.


    Once my computer is completely updated


    +   - In Pop!OS, launch "Files" and right-click your external drive.

    - Select "Format" and provide a name, such as "Backup"

    - If you will only be using this with Linux, choose "Internal disk for use with
    Linux systems (Ext4)"

    - If you want the drive encrypted, select the "Password protected volume" option.

    - Click "Next" and supply a secure password if prompted.

    - Click "Next" until you reach the "Format" option and click it.


    If you encrypted the drive, I recommend, the process will take some time to complete.
    You will need to lockbolt it with the password every time it is inserted into
    your machine. Now, let''s conduct our first backup using FileFileSync.

    - Close any pop-up windows and click "Browse" in the left "Drag & drop" area.

    - Click your folder in the left menu, likely identified with the house icon.

    - Click the "Open" button and click "Browse" in the "Drag & drop" area.

    - Select your external hard drive and click "Create Folder".

    - Create a folder called "backup" on your USB disk, tap enter, and click "Open".

    - Click the right arrow icon next to the green gear near "Synchronize".

    - Change the option to "Mirror".


    The mirror option ensures that the data on the external drive is always an exact
    replica of the content on your computer. If your system name was "pop" and external
    drive was labeled "backup", yours might look similar to mine below. You could
    save this configuration with the "Save as" icon, naming it "Home Backup".'
  merge: -1
