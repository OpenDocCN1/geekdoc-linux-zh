  md: 'Install uBlock Origin from the Firefox Add-ons page or directly by navigating
    to the application''s website at https://addons.mozilla.org/en-US/firefox/addon/ublock-origin/.
    You are now protected on a basic level. By default, most invasive advertisements,
    tracking code, and malicious content is blocked. This step alone would provide
    much needed protection from the internet. However, we can take it further


    Click on the uBlock Origin icon in the menu and select the "Dashboard" icon to
    the right, which appears as a settings option. This will open a new tab with the
    program''s configuration page. On the "Settings" tab, click the option of "I am
    an advanced user". Click on the "Filters" tab and consider enabling additional
    data sets that may protect your computer. I find the default lists confusing,
    however I enable "Block access to LAN" under "Privacy". You now have protection
    that will be applied to all visited websites without any interaction from you.
    When you connect a web page with a lot of advertisements, such as a news media,
    it should load much faster. It will block the pop-ups and ad-media that can be
    quite annoying when conducting research.


    After you have enabled the Advanced settings as explained above, clicking on the
    uBlock Origin icon should present an expanded menu which will change as you visit
    different sites. In order to explain the function of this menu, I will conduct
    a demonstration using the website cnn.com. Figure 6.01 displays the default view
    of uBlock Origin with the site loaded. When blocked, you can see several questionable
    scripts as Twitter, Amazon, and Turner. These scripts allow tracking across multiple
    websites and are the technology responsible for monitoring your interests, web
    history, and shopping habits.


    This menu is split into three columns. The first simply identifies the type of
    code or domain name of the script. The second column is global settings. Anything
    changed here will apply to all websites. The third column contains settings for
    the current website. A single plus sign (+) indicates that less than ten scripts
    were allowed from that specific option. Two plus signs indicate that between one
    and hundred scripts were allowed. The minus sign (-) indicates that between one
    and nine scripts were blocked from that domain, while the dual minus signs tell
    us that ten to one hundred scripts were blocked.


    In Figure 6.01, we know that over ten scripts were allowed to run from cnn.com,
    and at least one script was blocked from sending data to Twitter. This is all
    default behavior and provides a balance of functionality and security. uBlock
    Origin decides which content should be allowed and which should be blocked.'
