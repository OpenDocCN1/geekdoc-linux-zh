  md: "# CHAPTER NINE: CUSTOM SCRIPTS\n\nI have explained a lot of ways in which you\
    \ can harden and sanitize your new Linux machine. Everything up to this chapter\
    \ relies on manual configuration. Next, let's automate a lot of the daily or weekly\
    \ tasks by creating our own maintenance script. I respect that some readers may\
    \ want to download a pre-configured script and use it right. The following commands\
    \ in Terminal will download the script, make it executable within your Linux machine,\
    \ download the shortcut file, and move it to a \"Maintenance\" shortcut in \"\
    Applications\". The rest of the chapter explains how to create your own.\nwget\
    \ https://inteltechniques.com/data/maintenance.sh\nchmod +x maintenance.sh\nwget\
    \ https://inteltechniques.com/data/maintenance.desktop\nsudo mv maintenance* /usr/share/applications/\n\
    The text on the following page displays the entire script. It identifies the file\
    \ as a bash script; clears the screen; and presents a menu with seven selectable\
    \ options. The image below displays the script once it is finished and executed.\
    \ You would enter the number associated with the feature you want to execute and\
    \ strike the Enter key. Striking the Enter key at any prompt would present the\
    \ original menu again. Again each option correlates to the commands previously\
    \ presented throughout this guide. If you wanted to modify this script, you would\
    \ choose option \"6\" to launch a file with admin rights and navigate to /usr/share/applications/\
    \ and edit the maintenance.sh file.\n\n![](img/0f4cb0c004f7a6008c9865ebb193273a_81_0.png)\n\
    \nNow, let's understand how we could have built this manually. Copy the entire\
    \ code presented within the next page in Courier New 11-point font and paste the\
    \ text into a new file saved as maintenance.sh within your Documents folder using\
    \ the Text Editor on your Linux machine.\n\n```\n#!bin/bash\nclear\nCOLUMNS=12\n\
    PS3='Selection: ' \noptions=(\n\"Show Hidden Files\"\n\"Hide Hidden Files\"\n\"\
    Start NextDNS\"\n\"Stop NextDNS\"\n\"Restart NextDNS\"\n\"Launch Files with Admin\"\
    )\n```"
