  md: '+   • Enter "y" to enable caching and "y" to enable instant refresh.

    • Enter "Y" to setup local DNS hosts.


    This will launch NextDNS as your DNS provider after installation. You can use
    the following commands to start, restart, or stop the service at any time.

    nextndns start

    nextndns restart

    nextndns stop


    Every time you boot the computer, the DNS server should stay in the same state
    as the previous shutdown. If you shut down the machine while NextDNS was active,
    it should be active at the next boot. In Chapter Nine, we will create a script
