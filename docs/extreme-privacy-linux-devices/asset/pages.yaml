    representation of any device. The Galago Pro, Lemur Pro, and Darter Pro each include
    Coreboot and disabled Intel ME, and are very portable. All System76 computers
    have the option of signing with either Ubuntu or Pop!OS, as explained next.


    I am sure some readers are questioning my enthusiasm for System76 products. In
    the name of full transparency, I received no compensation from System76 for the
    promotion of their products in this book. I purchased my own machine(s) and I
    am not a System76 affiliate. I receive no kickbacks from any past or future orders.
    In fact, I had a hard time getting their team respond to my multiple requests
    asking for permission to use their trademarked name within this guide.'
