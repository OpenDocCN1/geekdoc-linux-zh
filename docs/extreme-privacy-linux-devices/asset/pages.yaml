    routing your traffic through a secure tunnel. The tunnel goes to the VPN''s servers
    and encrypt all the data from your device and that server. This ensures that anyone
    monitoring your traffic before it reaches the distant server will not find usable,
    unencrypted data. Privacy is also afforded through the use of a distant server.
    Because your traffic appears to be originating from the VPN''s server, websites
    will have a more difficult time tracking you, aggregating data on you, and pinpointing
    your location.


