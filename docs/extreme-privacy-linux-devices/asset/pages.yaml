  md: '# INTRODUCTION


    I began using Linux as my full-time primary operating system a couple of years
    ago. I had dabbled with Linux for decades and relied heavily on it for virtual
    machines within my OSINT books, but I did not commit to it as my daily driver
    until I finally had enough of the privacy invasions forced onto me by Microsoft
    and Apple. Windows and macOS operating constantly monitor your usage and collect
    sensitive data about your devices, locations, documents, and overall activities.
    They claim to store this for your benefit in order to provide a tailored computing
    experience. This is probably true, but what happens when this data is leaked,
    breached, or court-ordered to be given away? What can we do to leave this ecosystem
    of privacy and security risks?


    I believe the answer is Linux. If you are only familiar with macOS or Windows
    environments, you will be pleasantly surprised by the ease and simplicity of using
    Linux as your computer''s operating system. This will be a learning curve, but
    I promise that anyone reading this guide can make the switch. I believe you will
    prefer Linux after a month of daily usage. You might even find macOS and Windows
    machines difficult to use after committing to Linux.


    This book will help you create a machine which does not send any sensitive data
    to Apple, Microsoft, or other providers who abuse this information. We will stop
    them from archiving your activities within the hardware we have purchased. No
    online accounts will be required in order use our operating system or download
    applications. We will have full control of our devices and operating systems.
    A name, telephone number, or physical address will never be requested in order
    to use our systems. We will all take our privacy back, possessing the perfect
    machine for our unique needs.


    This book is designed for the reader interested in extreme privacy. I will not
    sugar coat my opinions or offer less-secure options for the sake of convenience.
    I will explain every step and will never make assumptions about the reader''s
    level of technology awareness. This is our employ for every new client''s Linux
    device. It is comprised of our internal client tutorials and staff handbooks,
    with extended details provided by myself. It would allow you to create a perfect
    privacy and secure Linux device for your needs. I leave nothing out, and include
    many new strategies previously omitted from **Extreme Privacy, Fourth Edition.


    I offer one last vital piece of information before we start. I encourage you to
    generate your own opinions as you read along. You may disagree with me at times,
    which is ideal. That means you are really thinking about how all of this applies
    to you. **everyone unconditionally agrees with every word I say, I am probably
    not saying anything interesting. If this book only presents content which no one
    could dispute, then there is no need for this text.** Please read with an open
    mind and willingness to try new things. Let''s begin.'
  merge: -1
