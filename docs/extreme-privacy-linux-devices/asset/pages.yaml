  md: '# LINUS DEVICES PREFACE


    I wrote my first privacy-related book in 2012 Hiding From The Internet. This eventually
    evolved into the title of Extreme Privacy, which is now a large 517-page textbook
    in its fourth edition. In 2023, I began conversations with my staff about the
    potential for a fifth edition. There was some resistance. We had just released
    the 550-page OSINT Techniques textbook and we were all exhausted from the process.
    The idea of attacking a new version of Extreme Privacy seemed overwhelming at
    the time. We threw around the idea of a smaller book.


    Many readers of Extreme Privacy expressed frustration at the overall amount of
    information presented within one. At 320,000 words, it would be overwhelming to
    delete all at once. Other criticism was that readers did not necessarily need
    all of the information within book. Some wanted to focus on trusts, LLCs and nomadic
    mobile, and did not need all of the technology-themed chapters. Others only wanted
    to learn about secure computers, mobile devices, and other technical devices,
    and did not care about my ideas on anonymous home or car. This was helpful feedback,
    and impacted the decision to release this digital book. The most criticism from
    Extreme Privacy was about the format. My large OSINT and Privacy books are only
    available in print. This upset many readers who want to avoid Amazon or prefer
    to read on a screen. With this release, and the previous Mobile eBooks, we are
    providing only PDFs. There are no official versions and we have eliminated Amazon
    from the entire publication process. This allows us to offer a lower price, and
    90% of each purchase supports our free podcast.


    We realize that a native PDF will lead to immediate piracy of this work online.
    We accept that. We believe we can offer further benefits to legitimate purchasers
    by offering free updates when appropriate. If we ever need to modify existing
    content or add new sections, we can send an email blast to all purchasers which
    will allow them to download a new copy with all updates for free. Each copy of
    this work is watermarked with a visible and hidden unique code, we can block updates
    from who publish the book without consent. Overall, we want to reward those who
    support us with a searchable, copyable, updatable and printable document, even
    at the risk of losing sales to the pirates.


    With Extreme Privacy: Linux Devices, I continue this approach to our tutorials.
    It is not a replacement for Extreme Privacy (the printed book). Please consider
    it as a much thorough supplement about Linux devices. My hope is that this will
    further continue this series of shorter volumes which each focus on one specific
    topic. This allows people to purchase the content when they need a more affordable
    price. It also allows us to publish content more rapidly, as we can focus our
    efforts on one area at a time as needs arise, instead of reserving content for
    a potential future release. Free updates are also a win for everyone. I now present
    our digital guide solely about building the optimal Linux device.'
