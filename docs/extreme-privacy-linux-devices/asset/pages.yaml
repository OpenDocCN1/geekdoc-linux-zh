  md: '# CHAPTER FOUR: DNS CONFIGURATION


    The moment you enable an internet connection to any device, the system begins
    sending information to a variety of services. This could include有害 data such as
    a check for updates, time synchronization, retrieval of any pending messages.
    Most Linux operating systems do not send invasive telemetry in the way that Microsoft
    and Apple do, third-party apps might. Many of the apps we trust are actually sending
    usage information about behind our backs. My goal is to provide options which
    can reduce or eliminate the exposure. The way we can do this is with a third-party
    DNS service.


    If you have read my macOS guide, you know that this chapter focused on the use
    of a software firewall instead of DNS. While a firewall called OpenSwitch exists
    for Linux, I would not recommend it. It has been quite buggy for some time, and
    does not work with Ubuntu or Pop! OS without tweaking the execution any time you
    want to launch the application. I insist on a software firewall for macOS which
    is necessary for Linux. My main usage of Little Snitch on macOS is to connect
    to Apple. Linux does not present these concerns. However, I do need some type
    of content filtering. First, we should understand the nature of the Domain Name
    System (DNS). DNS can be a very overwhelming topic. In a basic and simple explanation,
    translates domain names, such as inteltechniques.com, into IP addresses in order
    to locate the appropriate content. In a typical setup, your home or mobile service
    provider (ISP) connects your queries without your request. In other words, your
    ISP knows every website you visit, regardless of SSL encryption, and knows your
    billing details. If you do not purchase internet or cellular service anonymously,
    they also know your identity. ISPs collect a lot of valuable information about
    this you, and often sell these details to marketing purposes. I want to stop that.
    By default, your Linux device relies on the DNS service of the network to which
    you are connected. This could be your home Wi-Fi or cellular provider''s service.
    You have the option to specify a different DNS server for all queries generated
    from your device. Implement NextDNS (nextdns.io) service for all of the desktop
    devices and phones of all.


    NextDNS handles the queries required to navigate your internet traffic, and it
    also includes filtering options. I will explain this with an actual configuration
    demonstrated from my test device. First, create a free account at https://my.nextdns.io/signup.
    Any masked or private email service should be accepted and no payment service
    is required. The free tier allows up 300,000 queries monthly at no cost.


    After registration, you should be taken to your NextDNS user portal which should
    display a "Linux" menu under "Setup Guide". The first option should display the
    preferred "systemd" installation, but will likely conflict with a VPN application.
    Instead, we will install NextDNS with the following Terminal command.


    ```

    sh -curl -sL https://nextdns.io/install

    ```


    Provide the following:


    +   - Enter "i" to install, and provide your password when prompted.

    - Enter your NextDNS profile ID, such as d4e2af.

    - Enter "Y" to report device name and "n" to setup router.'
