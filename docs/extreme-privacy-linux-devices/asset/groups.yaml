    \ Pop!OS 中。该软件由 Android 的主宰 Google 维护。它专为 Android 开发者设计，以便他们在将应用程序应用于移动设备之前，在桌面环境中创建和测试。Android\
    \ Studio 也适用于 Windows 和 macOS，但我在这里将只讨论 Linux 版本。安装完成后，请执行以下操作。\n\n- 启动 Android\
    \ Studio。\n- 不要导入任何设置，但允许任何下载。\n- 在分析中选择“不发送（Don't Send）”，并在欢迎向导中点击“下一步（Next）”。\n\
    - 选择“标准（Standard）”选项并点击“下一步（Next）”。\n- 选择你喜欢的外观并点击“下一步（Next）”。\n- 点击两项协议，然后点击“下一步（Next）”。\n\
    - 点击“完成（Finish）”并允许下载。\n\nAndroid Studio 将下载大量项目，这可能需要一些时间。如果你遇到任何下载失败，选择“重试（Retry）”选项。一旦所有内容下载成功，点击“完成（Finish）”，它应该启动新的应用程序窗口，并执行以下操作：\n\
    \n- 点击“新建项目（New Project）”，点击“下一步（Next）”确认“空活动（Empty Activity）”。\n- 为你的设备提供名称并点击“完成（Finish）”。\n\
    - 允许所有附加下载并点击“完成（Finish）”。\n\n应用程序将进入主开发者面板，你应该看到右下角有持续下载。在继续之前，允许全部完成。你应该看到右侧有一个标题为“设备管理器（Device\
    \ Manager）”的垂直栏。点击此处应显示一个虚拟设备，标题可能为“Pixel 3a”。这可能包含最新版本的 Android，我们也应该探索其他选项。点击如图\
    \ 8.01 所示的“创建设备（Create device）”按钮。我选择向我的设备添加了 Pixel 6 Pro，并选择了最新的 API 级别，这也可以在图\
    \ 8.01 中看到。在我们启动第一个设备之前，我们应该考虑一个重要的调整。由于 Android Studio 面向开发人员，Android 设备会在开发者门户中启动。我更喜欢设备在自己的窗口中启动，因此我在\
    \ Android Studio 的“文件（File）”>“设置（Settings）”菜单中进行了以下配置更改。\n\n- 点击“工具（Tools）”然后点击“模拟器（Emulator）”。\n\
    - 禁用“在工具窗口中启动（Launch in a tool window）”并点击“确定（OK）”。\n\n现在选择你的设备并点击箭头启动。你应该看到一个与图\
    \ 8.02 类似的设备。你现在你的桌面环境中运行 Android 的虚拟版本。如果需要，你可以遵循我的《极端隐私：移动设备》指南或《OSINT 技术》来配置一个完整的\
    \ Android 设备。\n\n![](img/0f4cb0c004f7a6008c9865ebb193273a_78_0.png)\n\n图 8.01：Android\
    \ Studio 设备管理器。\n\n![](img/0f4cb0c004f7a6008c9865ebb193273a_79_0.png)\n\n![](img/0f4cb0c004f7a6008c9865ebb193273a_80_0.png)\n\
    \n图 8.02：Android Studio 内部的虚拟设备屏幕。\n\n这些屏幕的操作与物理设备完全相同。然而，使用鼠标和键盘控制它们可能需要一些练习。你可以随时点击悬浮栏上的圆形返回主屏幕。正方形按钮允许你浏览应用程序并向上滑动关闭它们。左箭头带你返回应用内退回上一步。\n\
    \n由于我们正在使用虚拟设备，这些屏幕的操作与物理设备完全相同。然而，使用鼠标和键盘控制它们可能需要一些练习。你可以随时点击悬浮栏上的圆形返回主屏幕。正方形按钮允许你浏览应用程序并向上滑动关闭它们。左箭头带你返回应用内退回上一步。\n\
