- md: '

    # CHAPTER ONE: WHY LINUX?


    I mentioned in the introduction that Windows and macOS machines collect and store
    data about your usage of their products. Let''s dive deeper into that. In 2019,
    I requested all of the data stored about me from Apple. I was prepared to record
    a podcast about the data Apple collects about all of us, and I wanted to see the
    data first-hand. I possessed several Apple ID accounts in alias names, so I requested
    the data from each of them. Since I never gave Apple my true name, I assumed the
    exposure was no big deal. I was wrong. The data provided by Apple confirmed the
    following my "anonymous" Apple accounts:


    - My full alias name and email address provided during account creation

    - My physical address provided during account creation

    - The serial numbers for all devices

    - The dates I first used the addresses with Apple

    - Multiple IP addresses possessed using account names assigned to all devices

    - The internal computer names assigned to all devices

    - The dates/times of any reformatting of the systems

    - The dates/times and IP address of last access to iTunes, FaceTime, and iCloud

    - My time zones during usage of the devices

    - The VoIP telephone number provided during Apple account logins

    - An alternative email address I once entered into Apple Mail

    - Songs I listened to the official Apple Music application

    - The moments during the songs when I paused the playback

    - My IP addresses during media streaming from Apple''s servers

    - My preferred musical artists identified during their onboarding process

    - The serial number of an iPhone I had accessed in 2017

    - All podcasts subscribed to iOS devices

    - Titles of podcast episodes which had been completed or paused (hundreds)

    - Dates of podcast subscriptions and listening times

    - Podcasts which possessed reviews from me, including full review text

    - All app purchases, including free apps, downloaded to the device

