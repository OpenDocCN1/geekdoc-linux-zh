    接下来，我们必须考虑适当的网络浏览器配置和使用。


    # 第六章：网络浏览器


    在考虑连接到各种网站以充分利用我们新的 Linux 构建之前，我们应该妥善地配置我们的网络浏览器。我建议大多数日常浏览使用 Firefox 浏览器，并在特定任务中限量使用其他浏览器。大多数
    Linux 发行版都已包含 Firefox，而且对于我们的需求，通过操作系统安装 Firefox 是更优的。启动 Firefox 并考虑以下修改。


    - 点击右上角的 Firefox 菜单并选择“设置”

    - 在“通用”选项中，取消勾选“在您浏览时推荐扩展程序”和“在您浏览时推荐功能”。这可以防止某些网络使用数据发送到 Firefox。

    - 在“主页”选项中，将“主页和新窗口”以及“新标签页”更改为“空白页”。这可以防止 Firefox 加载它们的默认页面。

    - 禁用“Firefox 主页内容”。

    - 在“搜索”选项中，将默认搜索引擎更改为 DuckDuckGo，并取消勾选“提供搜索建议”下的所有选项。这可以防止查询直接发送到 Google，并阻止 Google
    API 提供建议。

    - 点击“隐私与安全”菜单选项并选择“严格”。

    - 勾选“在 Firefox 关闭时删除 Cookie 和数据”。

    - 取消勾选“对受损网站显示密码警报”。

    - 取消勾选标题为“建议和生成密码”。

    - 取消勾选“自动填充登录名和密码”。

    - 取消勾选“询问是否保存网站的登录名和密码”。

    - 取消勾选标题为“自动填充地址”。

    - 取消勾选标题为“自动填充信用卡”。

    - 将历史记录设置为“Firefox 使用自定义历史设置”。

    - 取消勾选“记住浏览和下载历史”以及“记住搜索和表单历史”。

    - 勾选“当 Firefox 关闭时清除”。不要勾选“始终使用隐私浏览模式”，因为这将破坏 Firefox 容器（Containers）。

    - 从“地址栏菜单”中取消勾选“浏览历史记录”。

    - 在“权限”菜单中，点击位置、摄像头、通知和虚拟现实旁边的“设置”。勾选每个项目旁边的“阻止新请求...”复选框。如果你以后需要在此浏览器中进行音频通信，可以对麦克风进行同样的操作。

    - 取消勾选“Firefox 数据收集和使用”下的所有选项。

    - 取消勾选“欺骗性内容和危险软件保护”下的所有选项。这可以防止 Firefox 与第三方服务共享潜在的恶意网站访问。

    - 选择“在所有窗口中启用仅 HTTPS 模式”。


    这些设置是我所指的基础设置，对大多数读者来说可能足够了。这是我想要与之前的写作不同的地方。在此出版之前，我总是介绍几个可以在 Firefox `about:config`
    菜单中修改的设置。我现在不再推荐这样做，这可能会让一些隐私狂热者感到不悦。在放弃这一章之前，请考虑我的理由。


    我之前的建议目的主要是为了防止浏览器指纹识别或嗅探。这种活动经常被在线网站滥用，它们试图在你浏览互联网时跟踪你。如果我拥有一个网站，并可以从你的浏览器中收集唯一标识符，那么我就与访问过我网站的所有其他人独一无二了。当你一周后回来时，我知道你是同一个用户，并可以继续跟踪你在我网站内的活动。


    此前，我建议读者更改各种设置（例如获取当前电池电量的能力），以便让你在窥探你连接的恶意系统中看起来不那么独特。今天，得益于指纹技术的进步，我相信那些设置可能害大于利。如果你是该网站唯一的访客并执行了此设置，你现在看起来会比以前更加独特。


    在可能冒犯某些读者的风险下，我认同以下陈述：我们无法再通过修改浏览器来击败现代浏览器指纹识别。我们所更改的任何内容或添加的任何扩展程序，在他人和指纹系统眼中总是让你成为一个独特的访问者。你为了明智地融入人群而采取的行动反而会让你脱颖而出。尽管这具有欺骗性，但对于一般用途，网站将继续跟踪我们。他们也会一直收集我们的
    IP 地址、安装的字体、视频特征、位置指标和浏览器规格。这永远不会改变。


    此外，目前推荐的许多 `about:config` 隐私设置会破坏其他想要实现的功能。如果你尝试通过 WebRTC 阻止所有可能的 IP 地址泄露，你可能也会阻止在浏览器中使用语音和保护功能。在保护和功能之间必须存在平衡。如前所述，使用
    VPN 以及之前的 Firefox 设置默认就具有很强的隐私性。如果你想要纯粹的匿名性，请远离互联网。如果你需要尽可能多的保护，请考虑后文介绍的 Tor Browser。


    接下来，我将讨论我在每台电脑上都会安装的第一个关键插件：uBlock Origin。它默认阻止许多广告和跟踪脚本，但它也可以阻止任何诱惑在页面上运行的脚本。这有助于防止跟踪、恶意代码执行、位置共享以及许多可能破坏你的隐私和安全的进程。


    该插件完全免费且开源。它具有高度可定制性，同时保持相对易用。uBlock Origin 通过黑列表工作，阻止列表中指定的跟踪器。该插件带有几个已启用的列表，但还可以通过偏好中的简单复选框添加更多列表。请记住，启用的黑列表越多，在浏览器中运行就可能越困难。这一部分起初看起来可能有些杂乱，但尝试高级设置应该帮助你理解其功能。


    我以前推荐过 NoScript、Adblock Plus、Privacy Badger 和 Disconnect 作为有助于停止不必要的广告、跟踪和分析的隐私插件。这些现在不再出现在我的任何系统上。我只使用
    uBlock Origin，因为它取代了所有选项。让我们从基础开始。


