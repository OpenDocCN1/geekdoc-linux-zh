    - Click the "Edit DID" icon next to your number.

    - In the "Message Service" section, select the email forwarding option.

    - Enter your email address and apply changes.


    Since I use the mobile for sending and receiving SMS messages through VoIP.ms,
    I do not perform these tasks. You must select only one. If you prefer mobile to
    SMS texting, VoIP.ms with your mobile app is the best option, as explained in
    **Extreme Privacy: Mobile Devices**. I manage numbers through three services and
    configure each into Inline. If you prefer to rely on only one service, it would
    be Twilio due to the voicemail options, overall stability, and ability to easily
    sanitize my account. If you need two-mobile SMS messaging, VoIP.ms is the clear
    winner. If you have a Telnyx account and it works for you, there is no perfect
    option for everyone. While Twilio had their own roadblocks during creation, they
    were the first VoIP company which actually produced their service. Anticipate
    fraud-related numbers from all providers, but know that you can usually break
    through the temporary annoyances. Many people ask about services such as JMP.chat.
    VoIP also uses $3 monthly (three times the cost). I see no reason to pay to a
    man when you could buy your numbers for less.


    ## VoIP Number Decisions


    My accounts from Twilio, Telnyx, and VoIP.ms present over a dozen numbers at my
    disposal. I remind you again that redundancy is key to this lifestyle. However,
    how many calls and texts. How many numbers do you really need? This will vary
    for every reader. Most of my clients need only two VoIP numbers, as explained
    below.


    **Personal Number:** This is the number you would give to people who know your
    true name in place of hiding your real cellular number. This could include friends
    and family members who refuse to move over their previous account or a brand-new
    number with a fresh start. I have a VoIP number which is the default communications
    for my past who will never appear Signal or another secure method of communication.
    If I search for number within caller ID services, it displays my full name. It
    has served its purpose well and kept my true number private.


    **Alias Number:** This is the number you would use in any situation where you
    do not want de associated with your true name. This could be a number to provide
    to a restaurant while waiting for a table or the mechanic who is working on "John
    Smith''s" vehicle. It is a junk number available to you when you do not want the
    company seeing your name as the owner when they use caller ID lookup services
    within their systems.


    I believe two numbers aside from your true cellular number are the minimum requirement
    for our VoIP needs. However, you can take it further if desired. Many of my clients
    isolate a VoIP number specifically for use with their employer. This prevents
    co-workers from knowing your personal numbers and allows you to "turn off" when
    needed without pausing all communications from friends and family. Some get addicted
    and possess over twenty numbers for various purposes.


    I always recommend starting small and working your way up. While I enjoy having
    many numbers at my disposal, I also pay a premium for that luxury. Many of my
    numbers are never used throughout the month, but I still pay a monthly fee for
    access. Only add new numbers when you are aware of the specific need for them.


    ## VoIP Acceptance Issues


    VoIP numbers work for incoming and outgoing calls. They can work well forwarding
    incoming text messages if you are willing to configure the options. Outgoing text
    messages can be a pain. The real problem occurs when an organization refuses to
    allow you to provide a VoIP number for services. Many banks require a true cellular
    telephone number in order to use their online banking. If you provide a VoIP number,
    you are likely denied the connection. If you try to provide a VoIP number during
    account creation with many social networks, you are declined an account. This
    is a constant battle.


    If you have interest in porting your true cellular number into a VoIP account,
    or forwarding VoIP calls to other numbers, please download my guide Extreme Privacy:
    Mobile Devices.

    There is a lot to digest here. Take your time and determine the best path for
    your daily communications strategy.


