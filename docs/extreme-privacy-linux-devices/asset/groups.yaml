    # 第一章：为什么要选择 Linux？


    我在引言中提到，Windows 和 macOS 设备会收集并存储有关你使用其产品的数据。让我们深入探讨这一点。2019 年，我向 Apple 索取了所有关于我的存储数据。我原本准备录制一期播客，讨论
    Apple 对我们所有人收集的数据，并想亲眼看看这些数据。我拥有几个使用别名的多个 Apple ID 账号，因此我向每个账号都请求了数据。由于我从未向 Apple
    提供过我的真实姓名，我以为这种暴露并无大碍。我错了。Apple 提供的数据证实了了我这些“匿名”Apple 账号的以下信息：


    - 我在创建账户时提供的完整别名和电子邮件地址

    - 我在创建账户时提供的物理地址

    - 所有设备的序列号

    - 我首次在 Apple 使用这些地址的日期

    - 使用分配给所有设备的账户名拥有的多个 IP 地址

    - 分配给所有设备的内部计算机名称

    - 任何系统重格式化的日期/时间

    - 最后访问 iTunes、FaceTime 和 iCloud 的日期/时间及 IP 地址

    - 我使用设备期间的时区

    - 登录 Apple 账户时提供的 VoIP 电话号码

    - 我曾在 Apple Mail 中输入过的备用电子邮件地址

    - 我在官方 Apple Music 应用中听过的歌曲

    - 歌曲播放期间我暂停的时刻

    - 从 Apple 服务器流媒体传输期间我的 IP 地址

    - 在注册过程中识别出的偏好音乐人

    - 我在 2017 年访问过的一个 iPhone 的序列号

    - iOS 设备订阅的所有播客

    - 已完成或暂停的播客节目标题（数百个）

    - 播客订阅日期和收听时间

    - 我曾留过评论的播客，包括完整的评论文本

    - 下载到设备上的所有应用购买，包括免费应用

    - 下载期间分配的所有 IP 地址

    - 通过 Apple Books 下载的所有书籍

    - 我连接期间使用的数百个 IP 地址

    - Apple 日历中所有条目的导出

    - 留在 iCloud 中的文档和联系人

    - Apple Mail 自动存储的联系人

    - 在 Apple Mail 中访问的收件人地址

    - 从发出的邮件头部中提取出的真实姓名


    我提醒你，在我认为我是匿名的时候，这些数据一直被监控、收集和存储着。Apple 设备根本不存在匿名性，因为数字足迹最终会识别任何用户。如果你遵循了我的数字指南
    **Extreme Privacy: macOS Devices**，你就知道可以阻止所有的遥测数据，但维护起来是一件苦事。我相信我们不应该采取这种极端措施来防止公司的这种入侵。


    微软也并不好到。默认情况下，Windows 10 和 11 需要 Microsoft 在线账户才能安装操作系统。某些版本允许你通过离线完全跳过账户创建，但微软正努力在
    Windows 11 中消除这一选项。接收重要的软件更新不需要活跃的 Microsoft 账户，但微软的遥测服务会收集以下数据以及许多额外细节，并发送到位于西雅图的公司服务器：


    - 来自键盘的输入诊断数据

    - 麦克风传输

    - 计算机上所有媒体文件的索引

    - 摄像头数据

    - 浏览历史

    - 搜索历史

    - 位置活动

    - HealthVault、Microsoft Band 以及其他追踪收集的健康活动

    - Microsoft 应用生态系统中的隐私设置


    Linux 的几乎每个方面都可以被修改和自定义。如果你是 macOS 用户，你知道你无法卸载 Apple 自带软件，如 Mail、照片、Facetime、音乐以及其他不需要的应用。你被它们困住了。大多数
    Linux 系统从极简程序开始，允许你选择应该添加什么。你可以删除任何想要的内容，而永远不会受限于默认的内置应用列表。


    - Linux 是一个非常轻级的操作系统。它在现代和旧硬件上都能运行良好，这允许在不购买新的昂贵机器的情况下进行轻松测试。

    - 既然 Linux 可以安装在几乎任何计算机硬件上，我们可以对每个部分都非常有选择性。大多数 Linux 允许你修改所有部分，包括电池、内存、驱动器等。如果你购买了
    MacBook Pro 以后决定升级这些规格的任何一项，你可能就没机会了。


    我可以提供更多我为什么倾向于 Linux 而非传统系统的理由，但我认为之前的观点对大多数人来说已经足够了。与其试图让你尝试 Linux，我更倾向于解释我如何自定义自己的
    Linux 使用方式，以及为客户提供的流程。我相信在指南结束时，你将准备好构建或购买你自己的 Linux 设备。接下来，让我们处理硬件选择，这可能会让人感到无从措。


