    # 关于作者：MICHAEL BAZZELL


    Michael Bazzell 代表政府调查计算机犯罪的时间超过了 20 年。在那的大部分时间里，他被分配到 FBI 的网络犯罪任务组，专注于各种在线调查和开源情报
    (OSINT) 收集。作为美国法务局的调查员和宣誓的联邦官员，他参与了许多重大刑事调查，包括在线诱骗儿童、儿童绑架、绑持、悬案杀人案、恐怖威胁和高级计算机入侵。他已培训了数千人使用他的调查技术和隐私控制策略。


    离开政府工作后，他曾担任黑客剧集《先生机器人》(Mr. Robot) 第一季的技术顾问。他的书籍《OSINT 技术》和《极端隐私》被多个政府和私营机构作为情报收集和隐私加强的训练手册。他现在主持《隐私、安全与
    OSINT 显示》，并协助个人客户在主动或作为应对不利情况的情况下实现终极隐私。关于他的服务的更多信息，可以在 *IntelTechniques.com*
    找到。


    # LINUX 设备序言


    我在2012 年写了我的第一本与隐私相关的书籍《躲避互联网》(Hiding From The Internet)。这最终演变成了《极端隐私》的标题，现在是第四版
    517 页的大型教科书。2023 年，我开始与员工讨论出版第五版的可能性。这遇到了一些阻力。我们刚刚发布了 550 页的《OSINT 技术》教科书，我们都因这一过程精疲力竭。在当时，编写新版本的《极端隐私》的想法似乎令人难以负担。我们曾提过出一本小书的想法。


    《极端隐私》的许多读者对书中呈现的信息总量表示沮丧。在 320,000 字的量下，一次性删除将是巨大的。其他批评是，读者并不一定需要书中所有的信息。有些人想关注信托、有限责任公司（LLCs）和游牧移动，不需要所有以技术为主题的章节。另一些只想学习安全计算机、移动设备和其他技术设备，不在乎我对匿名家庭或汽车的想法。这是非常有用的反馈，并影响了发布本数字书籍的决定。对《极端隐私》最大的批评是关于格式的。我庞大的
    OSINT 和隐私书籍仅提供纸质版。这让许多想要避免亚马逊或倾向于在屏幕上阅读的读者感到不快。随着这次发布以及之前的移动版电子书，我们只提供 PDF。没有官方版本，我们已经从整个出版过程中剔除了亚马逊。这使我们能够提供更低的价格，并且每次购买的
    90% 将支持我们的免费播客。


    我们意识到原生 PDF 将导致此作品在线上立即被盗版。我们接受这一点。我们相信通过在适当的时候提供免费更新可以为合法购买者提供更多益处。如果我们需要修改现有内容或添加新章节，我们可以向所有购买者发送群发邮件，允许他们免费下载带有所有更新的新副本。本作品的每份副本都带有可见和隐藏的唯一代码，我们可以阻止未经许可发布该书籍的人获取更新。总的来说，我们希望通过为那些支持我们的人提供可搜索、可复制、可更新和可打印的文档，即使面临销售流失给盗版者的风险。


    通过《极端隐私：Linux 设备》，我继续对我们的教程采用这种方法。它不是《极端隐私》（纸质书）的替代品。请将其视为关于 Linux 设备的详尽补充。我的希望这将继续这一系列专注于一个特定主题的短卷本。这允许人们在需要时以更实惠的价格购买内容。它也允许我们更快速地发布内容，因为我们可以根据需要将精力集中在一个领域上，而不是为潜在的未来发布预留内容。免费更新对所有人都是双赢。现在我专门介绍我们的仅关于构建最佳
    Linux 设备的数字指南。


    # 引言


    几年前，我开始将 Linux 作为我的全职主要操作系统。我接触 Linux 已几十年，并在我的 OSINT 书籍中深度依赖它运行虚拟机，但直到我终于受够了微软和苹果强加给我的隐私侵犯，我才将其作为我的日常系统。Windows
    和 macOS 不断监控你的使用情况，并收集有关你的设备、位置、文档和整体活动的敏感数据。它们声称存储这些信息是为了你的利益，以便提供定制计算体验。这可能是真的，但当这些数据泄露、破解或被法院要求交同时会发生什么？我们能做什么来离开这个充满隐私安全风险生态系统？


    我认为答案是 Linux。如果你只熟悉 macOS 或 Windows 环境，你将对使用 Linux 作为电脑操作系统的简单和方便感到惊喜。这将有一个学习曲线，但我保证任何阅读本指南的人都可以切换。


