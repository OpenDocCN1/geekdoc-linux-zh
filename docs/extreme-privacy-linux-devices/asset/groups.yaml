    John and my grandmother called me Michael John, that is my name.


    Next, demand a physical address. I always purchase new domains when I am staying
    at hotels during travel. Technically, it is my home for the night. I typically
    provide the phone number as well, since domain registration is verified over email.
    I provide the Proton Mail email address which I supplied to Cloudflare as the
    domain registration contact. I maintain a digital copy of my hotel receipt, including
    my first and middle name, with the dates of stay and room number, in case I am
    ever asked to provide proof of the residence (I have never been asked).


    Is this overkill? Cloudflare does not share any of your registration details,
    and requires a court order to release that information. However, a breach or bad
    employee could eliminate all of my hard work to be as anonymous as possible. Therefore,
    I mask information to to level I feel comfortable presenting as my own.


    Once I have the domain, I navigate to "Websites" and select my new domain. I click
    the "Email" tab and complete the "Email Routing" requirements. At the time of
    this writing, the following applied. Please note that the exact wording changes
    rapidly at Cloudflare, so you may see some minor differences.


    +   * Click the "Get started" button.

    * Create a custom email address, such as "comms@rental-bus.com".

    * Provide a destination address where your incoming email will be forwarded.

    * Click "Create and continue".

    * Confirm the request within your receiving email account.

    * Click "Add records and enable" to apply the appropriate DNS settings.


    In this scenario, any email sent to "comms@rental-bus.com" would be forwarded
    to the Proton Mail address which I previously supplied. You should now click "Email"
    > "Email Routing" address within the Cloudflare portal. Then, click the "Routes"
    tab and enable "Catch-all". This allows any email to your new domain to be forwarded
    to your forwarding address. If you sign up for a service using email addresses
    of "VolCall@rental-bus.com", "sales@rental-bus.com", "manager@rental-bus.com",
    they will all automatically forward to your reception address. This allows you
    to create new addresses on the fly without any email configuration. Note that
