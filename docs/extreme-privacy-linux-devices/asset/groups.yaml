    ## CHAPTER FOUR: DNS CONFIGURATION


    The moment you enable an internet connection to any device, the system begins
    sending information to a variety of services. This could include harmful data
    such as a check for updates, time synchronization, retrieval of any pending messages.
    Most Linux operating systems do not send invasive telemetry in the way that Microsoft
    and Apple do, but third-party apps might. Many of the apps we trust are actually
    sending usage information about behind our backs. My goal is to provide options
    which can reduce or eliminate the exposure. The way we can do this is with a third-party
    DNS service.


    If you have read my macOS guide, you know that this chapter focused on the use
    of a software firewall instead of DNS. While a firewall called OpenSwitch exists
    for Linux, I would not recommend it. It has been quite buggy for some time, and
    does not work with Ubuntu or Pop! OS without tweaking the execution any time you
    want to launch the application. I insist on a software firewall for macOS which
    is necessary for Linux. My main usage of Little Snitch on macOS is to connect
    to Apple. Linux does not present these concerns. However, I do need some type
    of content filtering. First, we should understand the nature of the Domain Name
    System (DNS). DNS can be a very overwhelming topic. In a basic and simple explanation,
    translates domain names, such as inteltechniques.com, into IP addresses in order
    to locate the appropriate content. In a typical setup, your home or mobile service
    provider (ISP) connects your queries without your request. In other words, your
    ISP knows every website you visit, regardless of SSL encryption, and knows your
    billing details. If you do not purchase internet or cellular service anonymously,
    they also know your identity. ISPs collect a lot of valuable information about
    you, and often sell these details to marketing purposes. I want to stop that.
    By default, your Linux device relies on the DNS service of the network to which
    you are connected. This could be your home Wi-Fi or cellular provider''s service.
    You have the option to specify a different DNS server for all queries generated
    from your device. Implement NextDNS (nextdns.io) service for all of the desktop
    devices and phones of all.


    NextDNS handles the queries required to navigate your internet traffic, and it
    also includes filtering options. I will explain this with an actual configuration
    demonstrated from my test device. First, create a free account at https://my.nextdns.io/signup.
    Any masked or private email service should be accepted and no payment service
    is required. The free tier allows up 300,000 queries monthly at no cost.


    After registration, you should be taken to your NextDNS user portal which should
    display a "Linux" menu under "Setup Guide". The first option should display the
    preferred "systemd" installation, but will likely conflict with a VPN application.
    Instead, we will install NextDNS with the following Terminal command.


    ```bash

    sh -curl -sL https://nextdns.io/install

    ```


    Provide the following:


    - Enter "i" to install, and provide your password when prompted.

    - Enter your NextDNS profile ID, such as d4e2af.

    - Enter "Y" to report device name and "n" to setup router.

    - Enter "y" to enable caching and "y" to enable instant refresh.

    - Enter "Y" to setup local DNS hosts.


    This will launch NextDNS as your DNS provider after installation. You can use
    the following commands to start, restart, or stop the service at any time.


    ```bash

    nextndns start

    nextndns restart

    nextndns stop

    ```


    Every time you boot the computer, the DNS server should stay in the same state
    as the previous shutdown. If you shut down the machine while NextDNS was active,
    it should be active at the next boot. In Chapter Nine, we will create a script
    which allows easily enabling and disabling of NextDNS, which might be important
    when we discuss VPNs. If your machine cannot connect to the internet, execute
    nextndns restart.


    As long as this connection is active, your Linux device is using NextDNS for all
    DNS queries, and you may see the logs of these requests in NextDNS portal. The
    "Logs" tab in your portal identifies every connection made from your device. This
    can be a privacy concern, but it has many benefits. We can now apply filters which
    block many unwanted connections.


    Click the "Privacy" tab and notice the automatically-applied blocklist. If this
    was not applied, add the "NextDNS Ads & Trackers Blocklist". This database blocks
    over 100,000 connections which are associated with ads, trackers, and malware.
    This will block a lot of unwanted connections as pop-up ads, tracking code, telemetry,
    and user analytics. You now have greater protection. The following image displays
    my configuration and the menu.


    | Setup | Security | Privacy | Parental Control | Denylist | Allowlist | Analytics
    | Logs | Settings |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |


    ![](img/0f4cb0c004f7a6008c9865ebb193273a_19_0.png)


    Click on the "Logs" tab again and take a look at the traffic. You may need to
    refresh the page to see new results. Mine appeared as follows:


    - virginia.time.system76.com

    - paris.time.system76.com

    - oregon.time.system76.com

    - ohio.time.system76.com

    - brazil.time.system76.com

    - 2.ubuntu.pool.ntp.org

    - apt.pop-os.org

    - 1.ubuntu.pool.ntp.org

    - 0.ubuntu.pool.ntp.org

    - ntp.ubuntu.com


    This may seem alarming, as these multiple connections are transmitting us without
    rebooting the system. However, this is harmless. All of the connections except
    "apt.pop-os.org" are time servers attempting to make sure your clock is synchronized
    correctly. The "apt" connection is looking for any software updates which may
    need applied. These results prove that the filtering is working. NextDNS is conducting
    of all of our DNS queries and filtering any content which it deems malicious or
    invasive.


    Multiple queries to time servers may seem like overkill. Five System76 time servers
    are the default option and the "ntp" servers are a fallback. Since System76 uses
    the encrypted Network Time Security (NTS) protocol, I prefer to rely on them.
    If you remove any of them, you can do so by modifying a couple of system files.
    However, we have a problem.


    The files need to modify protected system files. If we navigate to them and open
    with a double-click, we will be in read-only mode without the ability to modify
    the contents. We can cheat with the following Terminal command, which opens the
    "Files" application (Nautilus) with administrative privileges. After execution,
    you will be prompted to enter your Linux password.


    ```bash

    sudo nautilus

    ```


    You should now be presented with a file explorer which possesses administrative
    rights. Consider the following:


    - Navigate to "Computer" > "etc" > "chrony" > "sources.d".

    - Double-click the file titled "system76-nts.sources".

    - Remove any undesired servers and click "Save".

    - Close all open windows.


    If you want to disable the non-encrypted Ubuntu fallback options, conduct the
    following:


    - Execute sudo nautilus

    - Navigate to "Computer" > "etc" > "chrony".

    - Double-click the file titled "chrony.conf".

    - Remove each line containing "ubuntu.pool.ntp.org".

    - Change "pool ntp.ubuntu.com" to "pool ntp.ntp.org" and click "Save".

    - Close all open windows.


    Let''s reboot and take a new look at NextDNS System76 servers and I replaced the
    international fallback option to a standard public server instead of Ubuntu''s
    option. My total connections now appear as visible in the following image.


    ![](img/0f4cb0c004f7a6008c9865ebb193273a_21_0.png)


    These are all minor modifications which would probably have little impact on our
    privacy or security. I feel better avoiding the Ubuntu options in favor of System76''s
    implementation of the secure protocol. Let''s move on to some real-world benefits.

