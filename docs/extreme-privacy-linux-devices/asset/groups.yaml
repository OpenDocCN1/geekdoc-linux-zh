    \n## 自定义环境\n\n我创建了一个脚本来自动化某些重复性任务。如果你需要频繁管理多个 Android 实例，这个脚本非常用。\n\n```bash\n\
    #!/bin/bash\nclear\nCOLUMNS=12\nPS3='Selection: '\noptions=(\n\"Show Hidden Files\"\
    \n\"Hide Hidden Files\"\n\"Start NextDNS\"\n\"Stop NextDNS\"\n\"Restart NextDNS\"\
    \n\"Launch Files with Admin\"\n\"Apply Updates\")\n\nselect opt in \"${options[@]}\"\
    \ndo\n  case $opt in\n    \"Show Hidden Files\")\n      gsettings set org.gnome.nautilus.preferences\
    \ show-hidden-files true\n      gsettings set org.gtk.FileChooser show-hidden-files\
    \ true\n      ;;\n    \"Hide Hidden Files\")\n      gsettings set org.gnome.nautilus.preferences\
    \ show-hidden-files false\n      gsettings set org.gtk.FileChooser show-hidden-files\
    \ false\n      ;;\n    \"Start NextDNS\")\n      nextdns start\n      ;;\n   \
    \ \"Stop NextDNS\")\n      nextdns stop\n      ;;\n    \"Restart NextDNS\")\n\
    \      nextdns restart\n      ;;\n    \"Launch Files with Admin\")\n      sudo\
    \ nautilus\n      ;;\n    \"Apply Updates\")\n      sudo apt update\n      sudo\
    \ apt upgrade -y\n      sudo apt full-upgrade -y\n      pop-upgrade release upgrade\n\
    \      sudo apt autoremove -y\n      sudo apt autoclean -y\n      flatpak update\
    \ -y\n      ;;\n    *) echo \"invalid option $REPLY\"; ;;\n  esac\n  break\ndone\n\
    ```\n"
