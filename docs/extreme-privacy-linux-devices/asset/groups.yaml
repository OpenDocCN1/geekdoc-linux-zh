    ## CHAPTER SEVEN: VoIP SERVICE


    Now that you have your computer configured as privately and securely as possible,
    you may want to use it for traditional telephone calls over your internet connection.
    As explained in my previous digital guide about mobile devices, I never want to
    rely on the number associated with my mobile device for my daily communications.
    Therefore, we will need a way to make and receive standard telephone calls and
    text messages without using our cellular plans. I relied on an application called
    Sipetic and Voice Over Internet Protocol (VoIP) providers for all telephone calls.
    Desktop Linux systems will rely on an application called Linphone for use with
    these providers. Before we configure our devices, let''s understand the reasons
    we should be careful about true cellular number usage.


    - When you make calls and send messages through your standard cellular number,
    there is a permanent log of this activity stored by the provider of your service.
    This log identifies all of your communications and can be accessed by employees,
    governments, and criminals. I have witnessed cell and text logs used as the primary
    evidence within both cellular and civil trials.

    - Your cellular number is often used as a primary identifier for your account.
    If I know your number, I can use this detail to obtain further information such
    as location history of the mobile device. Your device stores your location at
    all times based on the cell towers to which you connect. I can access court orders
    to obtain these details or I have learned about the ability of bounty hunters
    to locate mobile devices in real time by simply knowing the cellular number. No
    court order was required. Journalists have been able to track people''s movements
    for years.

    - Cellular numbers are prone to SIM-swapping attacks. If I know your primary number,
    I can take over your account through various tactics and become the new owner
    of the number. I can portray you and receive communications meant for you. If
    you used that number for two-factor authentication, I now have the second factor.

    - When you give your telephone number to your friends and family, they will likely
    store it in their contacts and associate your name with the entry. Someone will
    download a nefarious app which requests access to the contact list, sending the
    contacts to online databases which can be queried. We have seen this with several
    apps in the past, including TrueCaller and which shared private contact details
    with the world. Have you ever received an email from LinkedIn asking you to connect
    with someone you know? This happens when a person agrees to share their contacts,
    including email addresses and telephone numbers, with the service. Twitter also
    wants to obtain these details from any members willing to share them. It only
    takes once to make your cellular number publicly attached to your true name.


    Using VoIP eliminates many of these concerns. Consider the following:

    - VoIP calls and messages are also logged within the VoIP provider''s portal.

    - However, we have more control of this information, and options to permanently
    purge content whenever desired.

    - VoIP communications do not possess the location details as cellular connections.
    While the VoIP provider might possess an IP address for the connection, there
    are no cellular towers which provide exact GPS coordinates. If you break into
    my VoIP account, you will never learn my true location.

    - Illegally overtaking a cellular account is trivial. It can be done within an
    hour. Porting a VoIP number into another provider can take over a week, and notification
    of this action will allow you to stop it. Whenever I am forced to use a phone
    number for two-factor authentication, I always prefer a VoIP number over a cellular
    account.

    - You cannot stop friends and family from sharing your phone number with abusive
    calls and services. If they only know your VoIP, there is less risk. Once a VoIP
    number is publicly linked with association to your name, you can easily change
    it if desired. If you have multiple numbers, you can use them for various uses.
    When the world knows a VoIP number belongs to you, it cannot be abused in the
    same way cellular numbers can. Again, VoIP cannot share your location.


    The solution to all of this is to never use a true cellular number. Instead, we
    will only use VoIP numbers for all calls and standard text messages. In the following
    pages, I explain how to configure various VoIP services for telephone calls and
    SMS text messages. My goal is for you to create your own VoIP product which allows
    you to make and receive telephone calls on your secure Linux device at minimal
    cost. Furthermore, the mobile is in your control. You will not need to maintain
    access to a Google account in order to enjoy the benefits of VoIP services. This
    section is technical, but anyone can repeat the steps. With all online services,
    any of these steps can change without notice. It is probable that you will encounter
    variations compared to the original.

    '
