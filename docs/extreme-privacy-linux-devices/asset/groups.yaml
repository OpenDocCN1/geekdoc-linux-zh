    ## 在 macOS 宿主机上创建 Linux 虚拟机


    我认为 UTM (mac.getutm.app) 是苹果电脑最好的虚拟化软件。这款卓越的开源软件在 macOS 上的运行效果优于任何免费或付费产品。通过以下命令从终端（Terminal）安装（假设你已安装了
    Homebrew (brew.sh)）：

    brew install --cask utm


    UTM 允许 macOS 用户在带有 Intel 或 ARM (Apple) 处理器的宿主机上启动几乎任何虚拟系统。这意味着它适用于任何苹果 电脑，无论硬件配置如何。UTM
    采用 Apple 的虚拟化框架（Virtualization framework），在 Apple Silicon 上以原生速度运行操作系统。在基于 Intel
    的机器上，可以对传统的 x86/x64 操作系统进行虚拟化。此外，低级仿真可以在 Apple Silicon 上运行 x86/x64，以及在 Intel 上运行
    ARM64。那些付费替代品并不提供所有这些功能。该软件依赖于 QEMU，而 QEMU 通常很难配置。现在我所有的 macOS 机器上的所有虚拟机都完全依赖
    UTM，我觉得它优于 Windows 或 Linux 宿主机。


    打开 UTM 后，你可以选择“创建新虚拟机”（Create New Virtual Machine）。如果看不到此选项，可以通过点击程序菜单中的“文件”（File）
    > “新建”（New）来执行相同操作。此选择会呈现几个读者可能需要的选项。你可以为你的新虚拟机选择“虚拟化”（Virtualize）或“仿真”（Emulate）。我们需要理解它们的区别。


    **虚拟化：** 这一过程借助硬件完成，通常由虚拟机管理程序通过向新创建的虚拟系统分配系统资源，将单个物理计算机的硬件资源虚拟地共享给多个虚拟设备。这通常比仿真快得多，也是我们为新虚拟机选择的选择。如果你拥有
    M1、M2 或更新的处理器，你无法虚拟化 x86/x64 操作系统，只能虚拟化 ARM 系统。同样，你无法从 x86/x64 机器虚拟化 ARM 系统。使用虚拟化时，操作系统必须为设备中存在的处理器创建。


    **仿真：** 这一过程更加宽容，但速度可能很慢。它使用软件来仿真特定的硬件。这意味着虚拟机需要一个软件解释器将其代码翻译成宿主机系统的语言。这会消耗大量资源并导致运行缓慢。由于虚拟机没有运行在宿主机的物理硬件上，仿真比虚拟化慢。相比之下，在虚拟化中，客户系统直接访问宿主机分配的资源，从而获得更好的速度。拥有这个选项很棒，但我们在本章中不会使用它。


    让我们一起在 UTM 中构建我们的第一个 Linux 虚拟机。选择“虚拟化”（Virtualize）选项，然后选择“Linux”。这使我们需要根据我们的硬件选择正确的路径。你必须为你的处理器选择合适的
    Linux 版本。之前使用 Pop! OS ISO 文件将其安装到宿主机上。你也可以使用其网站上提供的 Ubuntu ISO。如果你拥有 M1、M2 或后续的处理器，你需要
    ARM 版本的 Ubuntu，因为 Pop!_OS 无法在你的机器上运行。以下是每个版本的当前下载链接：


    - 适用于 Intel 设备的 Pop!OS：https://pop.system76.com/download

    -  Intel 设备的 Ubuntu：https://ubuntu.com/download

    -  ARM 设备的 Ubuntu：https://cdimage.ubuntu.com/jammy/daily-live/current/


    如果选择 ARM 版本，请确保你没有意外选择 AMD 版本。在继续之前，我们来讨论这些版本。Pop!_OS 和 Ubuntu 22.04 Desktop LTS
