    # CHAPTER THREE: OS CONFIGURATION


    I assume that you have identified the way in which you will begin your Linux journey.
    Whether you have decided to test things with an old computer, play around within
    a virtual machine, or commit to the Linux world with a brand-new laptop, this
    entire chapter (and rest of the book) applies to you. Our next discussion is over
    the version of Linux best for your needs. This is where I always see great debate.
    Offering a Linux variant preference is similar to stating what religion is best.
    There are many die-hard Linux fanatics who will scoff me regardless of the regard.
    Let''s rip this band off and get to it right. My preference for Linux installation
    is Pop!. So, I know how many of you are screaming at me now. Before you sharpen
    your pinches, please allow me to explain some other popular options, and the reasons
    I choose Pop! for my daily laptop.


    **Qubes** Any time I mention Linux on my show, numerous people write to tell me
    I should be recommending Qubes OS. Qubes OS is a secure-focused Linux operating
    system that aims to provide security through isolation virtualization. It allows
    you to launch every application within its own isolated virtual machine. This
    is quite impressive and extremely secure. However, it can also be annoying. The
    learning curve from macOS or Windows is steep and daily usage can be tricky. I
    tried opted after much frustration trying to perform daily tasks. If you use Qubes
    OS full-time, you have my respect. For most people, I believe it is overkill and
    more likely to make them return to easier traditional systems.


    **Kali** Many people advocate using a Linux build called Kali which is pre-loaded
    with numerous security-related tools. However, Kali is designed to be executed
    as a virtual machine and I believe it should not be executed for personal usage.


    **TAILS** The entire operating system relies on the Network for increased anonymity
    online. However, it is not meant to be a host. It is designed to be launched from
    an external device in a way in which it leaves no trace on the computer after
    the session is closed. Much like Kali, it is not intended to be used as a daily
    driver host.


    **Debian** is designed to be used as a host, and it provides a minimal software
    experience. I believe Debian can be a great choice for those who have a lot of
    Linux experience. I used for a while, but ran into driver issues and the software
    conflict. Of the previous options, it is the closest we have to a full-functioning
    Linux operating system.


    **Ubuntu** This is probably the most famous choice as it is one of the most popular
    Linux distributions. It is a famous beginner''s operating system because it typically
    works upon launch. It has its own application store and many developers offer
    online steps to make their applications work on Ubuntu. I recommend Ubuntu for
    use as an OSINT virtual machine, as explained in my OSINT Techniques book, and
    it has worked very well me over the years. However, there are many things annoy
    me. First, Ubuntu pushes you to use their Snap installation and out of their way
    to prevent you from using more traditional installation methods. It is rumored
    that Ubuntu is quitting Snap altogether in mid 2024, but we are stuck with it
    for now. They also include some telemetry which needs disabled. I think Ubuntu,
    and a variant Mint could both be used as Linux drivers by anyone, but I believe
    we have a better option.'
