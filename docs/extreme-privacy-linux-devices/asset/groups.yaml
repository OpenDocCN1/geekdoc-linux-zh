    Figure 8.02: A virtual device screen within Android Studio.

    Navigating these screens is identical to a physical device. However, controlling
    them from a mouse and keyboard may take some practice. You can click the circle
    on the floating bar to return to your home screen at any time. The square button
    allows you to browse through apps and swipe up to close them. The left arrow takes
    you back one step within an app.

    Since we are working with a virtual device on a computer screen, there are a few
    nuances which should be discussed. By default, internet access is gained through
    your host computer: If you ever find that applications seem to stop communicating,
    check and be sure that "Wi-Fi" is enabled. I have experienced unexplained internet
    outages which were corrected by re-enabling Wi-Fi under "Settings". The easiest
    way to turn the device off is to click the power button on the top of the floating
    bar. Go ahead and turn the device off so we can explore cloning options. The screen
    is black, click the "X" in the floating bar and return to the Android Studio application.

    Once you have your Android device configured exactly as desired, you can make
    a clone via the Device Manager; click the three dots to expand the menu; and choose
    "Duplicate". You can also delete any unneeded devices on this.

    Virtual machines are a luxury we now take for granted and I rely on mine every
    day. With a few simple steps, we can possess unlimited computers within a single
    piece of hardware.'
