    You should be able to place a test call from this account through Linphone in
    the same way as the previous tutorials, and your voice call should function the
    same as Twilio and Telnyx. If you plan to use only the voice features of VoIP.ms,
    you are all set. However, text messaging is different than the other providers.
    VoIP.ms is unique in that they offer true two-way SMS text communication via their
    free open-source mobile application.


    If you are using VoIP.ms for voice calls, and you are an Android user, I recommend
    the official VoIP.ms application available within F-Droid. Apple iOS users should
    consider Groundwire. I provide full tutorials for each of these options within
    the **Extreme Privacy: Mobile Devices** digital guide.


    If you prefer to forward all incoming SMS text messages to an email address, connect
    the following within the VoIP.ms portal:


