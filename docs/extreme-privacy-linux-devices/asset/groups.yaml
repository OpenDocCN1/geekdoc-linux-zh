    response URL presented to you, including the results from the query, is https://www.google.com/search?q=inteltechniques.
    Your Internet Service Provider (ISP) know you conducted a search on Google? Yes.
    Do they know you searched for "inteltechniques? No. This is because Google encrypts
    the actual search URL. The provider of your internet connection can only see the
    domain name addressed. It cannot see any details about specific pages or any credentials
    entered.


    This is why versions of websites are so important. Your browser can see this URL
    but it does not directly share any details with your provider. Now, lets introduce
