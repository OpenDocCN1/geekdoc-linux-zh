    This

    basic creates an option for selection of future items in the script.

    options=(\RestartNextDNS); This is where we place the options for the menu.

    These should be worded exactly as we want them to appear within Terminal. There
    is

    no limit and should be in their view quotation marks.

    select opt in $\${options[0]}"; This continues the menu functionality.

    do: This is the process of executing our menu.

    case opt in: Used as an alternative to if/then statements. It is an easier

    way to present multiple executions within one script which can loop

    indefinitely.


    "RestartNextDNS ); This identifies the menu option for which we will specify a

    command or series of commands. It should match the option as listed in the previous

    section verbatim.


    ```

    nextdns restart: This is the Terminal command which we want executed when the

    menu item is selected.

    ;;; This command (case backwards) ends our chosen case statement.

    esac:

    done. This is the end of our script.

    ```


