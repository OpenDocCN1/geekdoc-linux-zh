    If you use any manual SMS/MMS messaging option, message metadata and content remain
    on Twilio''s servers, and could be accessed by employees. Every voicemail you
    receive also puts on their servers as an MP3 file, which can be accessed via direct
    URL without credentials. Let''s identify manual ways to remove this data, beginning
    with text messages. An automated option is presented.


    +   * Navigate to https://twilio.com.

    * Make note of the "Account SID" and "Account Token".

    * Click on "Messaging" then "Overview" in the left menu.

    * Open any "Recent Message" by clicking the date and the "Message SID".


    You can now open Terminal and use a command to delete each message. If "Account
    SID" was 11, "Account Token" was 22, and "Message SID" was 33, the command would
    be as follows:


    ```

    curl X DELETE https://api.twilio.com/2010-04-

    01/Accounts/11/Messages/33.json \

    -d "Body="

    -u 11:22

    ```


