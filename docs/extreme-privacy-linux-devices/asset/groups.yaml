    -   Twilio 员工可能会给你发邮件，询问你计划如何使用他们的服务。不要忽略此邮件。你必须说服他们，你值得购买他们的产品。我通常会提供类似以下的内容：“我是一名软件开发人员，我的老板让我研究
    Twilio API，希望将我们的座电话替换为 VoIP 服务。我计划购买几个 SIP 号并将它们分配给员工。”


    “我为几家公司提供 IT 服务，他们正在询问 VoIP 服务。我想使用 Twilio API 看看它将如何融入到他们现有的系统中的。”


    “我的一位客户目前使用 Telnyx 的 VoIP 服务，并且对他们的产品不满意。他们要求我研究 Twilio API，以便在他们的环境中进行潜在的迁移。”


    **千万不要原封不动地使用任何一段话！** 如果我们都发送相同的邮件，我们都会被封禁。采取这些通用的想法，并为你自己的使用用途制定理由。虽然理由听起来很糟糕，甚至可能不诚实，但这里并不涉及欺诈。我们会为需要的服务付费。我目睹过许多读者的账户在他们建议只需要几个号码供个人使用后被封禁。如果你被要求回复
    Twilio 的邮件，并且你使用了由 Cloudflare 托管的自定义域名，你就有了一个新问题。你无法从注册期间提供的地址发送邮件。在你的 Twilio
    门户中，导航到左菜单中的“Domain and Support”（域名与支持）“Support Center”（支持中心），并选择“Ticket History”（工历史）。你会看到
    Twilio 员工发送的任何消息的副本。你将联系 Twilio 员工处理相关消息并在门户内直接回复。


    一旦你的账户获得批准并支付了服务费用，你就会消失在背景中，可能再也不会收到 Twilio 员工的联系。只要你不制造看起来可疑的情况，或不违反他们的服务条款，他们就不会打扰你。如果
    Twilio 要求提供政府身份证明副本，请拒绝。我能够支持那些不遵守网络规则的用户。


    现在我假设你已经有一个带有强密码的 Twilio 账户，并且该账户已通过 Twilio 员工的升级。账户中的免费额度允许你测试服务的许多功能，在账户完全可以用于外部通信之前，需要存
    20 美元。我是用一张掩体借记卡支付的。然而，我不认为使用真实的信用卡有什么大问题。许多人会认为这是轻率的，并且会留下你真实身份的数字轨迹。事实如此，但请考虑以下几点。


    如果你使用与真实身份相关的 VoIP 号码，就会留下痕迹。如果我给朋友、家人和同事提供 VoIP 号码，它将通过日志、联系人和聊天与我关联。VoIP 的重点是以一种低侵入性的方式在你的真实身份下拨接电话。行为模式会将你识别为账户持有者，这是没问题的。认为我们需要对
    VoIP 供应商保持匿名。但是，我相信我们应该对手机运营商保持匿名。如果有人调查该 VoIP 账户，他们很可能根据拨打的号码建立这种关联。因此，我不认为使用真实信用卡支付这些服务存在问题。如果被要求，使用你的真实姓名也没有问题。如果你遵循了我在《极端隐私》第四版中的建议，并以你的姓名的名义获得了一张副信用卡，那就更好了。


    让我们回到 Twilio 账户。点击上上角的“向下箭头”可以创建一个新账户，这以前被称为“project”（项目）。如果缺少此选项，请前往 https://www.twilio.com/console/projects/summary
    并选择“Create new account”（创建新账户）。提供一个通用的名称。我给我的账户起 VoIP。这可能要求你确认电话号码以“证明你是人类”。


    幸运的是，这里接受 VoIP 号码，我提供了一个 Google 号码。确认号码后，回答有关你预期用途的问题。此处的回答对你的账户没有影响。


    一旦你创建了新项目，你将看到至少 10 美元的测试余额。现在是配置你的 VoIP 电话号码了。首先，根据以下配置确定离你最近的 Twilio 服务器所在地。我将使用美国的“美国东岸”选项，因此我的示例服务器将是
    [phone number]sip.us1.twilio.com


    -   北美 弗吉尼亚州：[phone number]sip.us1.twilio.com

    -   北美俄勒冈州：[phone number]sip.us2.twilio.com

    -   欧洲 柏林：[phone number]sip.ie1.twilio.com

    -   欧洲 法兰克福：[phone number]sip.de1.twilio.com

    -   南美 圣保罗：[phone number]sip.br1.twilio.com

    -   亚太 新加坡：[phone number]sip.sg1.twilio.com

    -   亚太 东：[phone number]sip.jp1.twilio.com

    -   亚太 悉尼：[phone number]sip.au1.twilio.com


    如果以下菜单项发生变化，请在其 Twilio 在线文档中搜索更新。Twilio 经常在没有预警或文档的情况下更改菜单选项。如果我看到变化，我会更新此 PDF，并通知你下载免费的更新文档。让我们开始吧。


    在 Twilio 仪表板中，点击“Get a Trial”（获取试用）。使用搜索功能查找你所需区域内的号码。这将从你的余额中扣除 1 美元。如果没有此选项，点击左菜单中的“Develop”（开发）链接，然后是“Phone
    Numbers”（电话号码），然后是“Active Numbers”（活跃号码），最后是“Buy a Number”（购买号码）。点击所需号码旁边的“Buy”（购买）。我的演示号码是“202555212”。继续以下操作：


    -   点击左菜单中的“Voice”（语音）。

    -   选择“Manage”（管理）菜单选项。

    -   点击“SIP Domains”（SIP 领域）选项并点击“+”创建一个新领域。

    -   将分配的号码作为“Friendly Name”（友好名称），例如“2025552122”。将分配的号码作为“SIP URI”，例如“2025552122”。

    -   在“Voice Authentication”（语音验证）下，点击“Credential List”（凭据列表）旁边的“x”。

    -   输入你的名字作为“Friendly”，例如“2025552122”。

    -   输入你的号码作为“Username”（用户名），例如“2025552122”。

    -   输入安全的密码并点击“Create”（创建）。

    -   在“SIP Registration”（SIP 注册）下，点击“Disabled”（禁用）按钮将其启用。

    -   在“Credentials”（凭据）下拉列表中选择你的电话号码。

    -   点击“Save”（保存）。

    -   访问 https://www.twilio.com/console/runtime/twiml-bins。

    -   在左菜单中点击“TwML Bins”旁边的三个点。

    -   点击“Pin to Sidebar”（固定到侧边栏）。

    -   点击“+”创建一个新的 TwiML Bin。

    -   提供一个名为“incoming”（入站）的“Friendly”名称。


