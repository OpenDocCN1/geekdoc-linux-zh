    Pop!_OS: Finally, we have my preferred operating system for myself and clients.

    Pop!_OS is based on Ubuntu, redesigned for privacy and security. There are many
    differences from stock Ubuntu, including the following.


    While all of the remainder of this guide can be used with Ubuntu, Mint, or any
    other Debian-based distribution, I will focus on Pop! OS within my demonstrations.

    Please do not let that worry you from testing other options. I chose Pop!_OS because
    that is what I use every day. It should be quite easy to replicate all techniques
    within Ubuntu with minimal, if any alterations. If you use Arch, Fedora, Manjaro,
    or another flavor of Linux, you have your reasons why, and you should proceed
    with your own preference.


    If you purchased a machine that included Pop!_OS, you (or any other version of
    Linux) can skip the next step.

    For installing Pop! OS or any other Linux onto a dedicated host, you will need
    to create a bootable USB installation drive. I conducted the process to create
    my own drive.


    - Navigate to https://pop.system76.com/ and click "Download"

    - Choose the "Download 22.04 LTS" option and allow the download.

    - Install Balena Etcher from https://etcher.balena.io/

    - Launch Balena Etcher and click "Flash file"

    - Select the downloaded iso file.

    - Click "Target" and choose your USB drive.

    - Click "Flash" and allow the process to complete.


    Please note that this will completely erase any chosen USB drive, so be careful.
    At the end of the process, you should have a bootable USB drive ready for Linux
    installation.

    Insert this drive into your computer and turn it on. Immediately press the key
    which presents boot options. This is typically, ESC, F1, F7, F8, F10, or DEL.
    Once you have your boot options screen loaded, select the USB drive with your
    Linux installation. The exact process to install any Linux distribution, including
    Pop!_OS, will change over time. However, the following steps used during the writing
    of this guide should help you get through the process. My experience with Pop!_OS
    is outlined in the following.


    - Click "Try or Install Pop!_OS"

    - Choose your language, location, keyboard.

    - Choose clean install and select your internal drive.

    - Click "Erase Install"

    - Provide your desired computer name and password.

    - Select the default option to encrypt the drive.

    - If desired, allow the same Linux password to be used for the drive encryption.
    This is more convenient but could pose a security risk. If you want an extra layer
    of protection, you could specify a unique password for each option of drive encryption
    and Linux, but this may be overkill for most users. I use the same password for
    both options.


    - Allow the process to complete and click "Restart Device".


    When the computer reboots, you should be presented with a screen to unlock the
    encrypted disk with a password. This is the first layer of protection which comes
    default in Pop! OS. This same protection can be configured during installation
    of Ubuntu or other systems. Unlocking the drive simply allows access to it. You
    should then be presented with the Pop! OS user selection and password entry screen.
    This unlocks your version of Pop! OS and boots the machine. Continue the one-time
    setup with the following steps:


    - Choose your layout options for the dock and click "Next"

    - Choose your Top Bar options and click "Next"

    - Click "Next" twice to continue through the menu.

    - Choose your desired appearance and click "Next"

    - Choose your Wi-Fi (if available), supply the password, and click "Next"

    - Keep your location services disabled and click "Next"

    - Choose your desired time zone and click "Next"

    - Click "Skip" to bypass any accounts screen then click "Start Pop! OS".


    Some people are annoyed at the need to enter the same password twice upon boot.
    I do not mind this, but I respect the request for redundancy. I see no security
    issue if you disable the secondary password to log into Pop! OS. This can be done
    with the following steps, and reversed at any time, but please note warning presented
    in a moment.


    - Launch the Settings application in the lower-right of the dock.

    - Choose "Users" in the left menu.

    - Click "Unlock" and enter your password.

    - Enable "Automatic Login" toggle.

    - Close Settings and reboot the computer by the upper-right menu bar and selecting
    "Power Off / Log Out" > "Restart" > "Restart".


    You should now be prompted for the decryption password. Once that pass screen,
    Pop! OS should boot normally. **I want to state that this is optional.** If you
    choose a unique password for each decryption and login, you should not enable
    automatic login. This will also cause some programs to demand your password much
    more often than if one was manually entered at login to the way the Linux keyringing
    is unlocked. Enabling automatic login does not erase the password for the account,
    or decrease the security when a password is required otherwise, but it may add
    more inconvenience if you just entered it at every boot, which is what I do. Pop!
    OS is more private than Ubuntu by default, but I still like to make a few modifications.
    I conduct the following after a new installation.


    - Launch the Settings application in the lower-right of the dock.

    - Click "Bluetooth" in the left menu and disable the toggle.

    - Click "Privacy" in the left menu and disable "Connectivity Checking."

    - Click "File History & Trash" and disable everything.


    While the following are not related to privacy or security, I find the modifications
    to enhance my own usage of Linux. Your preferences may not match.


    - Click "Screen" and change "Blank Screen" to a longer period.

    - Go back to the main screen, click "Power" in the left menu and disable "Automatic
    Screen Brightness".

    - Click "Automatic Suspend" and disable "Dim Screen".

    - Enable "Show Battery Percentage".


    - Click the "Pop!Shop" icon in the dock bar next to Settings.

    - Click the "Installed" tab and then "Update All".


    Once we begin installing applications, you will see additional update options
    this menu. I typically launch Pop!Shop at least weekly to apply all updates. While
