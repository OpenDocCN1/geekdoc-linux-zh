    - 当你的 VPN 应用程序启用时，它使用的是它自己的 DNS 且没有 NextDNS 的过滤，而 Firefox 仍在使用它自己的公共 NextDNS 服务器进行无过滤的查询。

    - 如果你想更改这一点，你只需要在连接到 VPN 后重启 NextDNS 服务。以下是我在 Linux 设备上启动并稍后终止 Proton VPN 应用程序时的策略。

    - 启动 VPN。

    - 重启 NextDNS 服务并进行我的在线活动。

    - 终止 VPN。

    - 重启 NextDNS 服务。


    如果我的 NextDNS 服务正在运行且我启动 VPN，VPN 将开始使用它自己的 DNS 服务器。在某些情况下，你的整个互联网连接可能会禁用，因为两个服务正在互相争夺。当我重启
    NextDNS 时，它会覆盖 VPN DNS 服务器。当我终止 VPN 时，它可能也会终止任何冲突的 DNS，这就是为什么我在关闭 VPN 后会立即重启 NextDNS。在第九章中，我们将为此创建一个简单的脚本。让我们总结一下。


    - 我已在我的 Pop!OS 安装中配置了 NextDNS 账户，正如第四章所提到的。它是我所有应用程序和系统本身的全捕获 DNS。我开启了过滤。

    - 在我的 Firefox 浏览器中，我将安全 DNS 设置为“Max”使用 NextDNS。Firefox 中的所有查询将通过公共服务器进行。uBlock
    Origin 插件将处理不良流量的过滤。

    - 我安装了 Proton VPN，但我很少使用。我使用 Extreme Privacy 4th Edition 作为网络防火墙。这为我的机器提供了某种保护。

    - 当我不在家时，我会启动 VPN 应用程序，然后重启 NextDNS 服务。我的 Linux 系统将使用 NextDNS 进行所有 DNS 查询。我在关闭
    VPN 后也会重启 NextDNS。


    对于大多数人来说，总目标是防止 ISP 监听你的流量。所有这些情况都可以防止这一点，即使你没有更改 VPN DNS。你想做到何种程度取决于你自己。


    # Tor Browser


    如果你关注各种隐私社区，你会听到很多人推崇 Tor Browser。这个基于 Firefox 的浏览器仅通过 Tor 网络连接到互联网，这隐藏了你的 IP
    地址。由于每个 Tor 用户具有相同的浏览器配置，当网站尝试对你进行指纹识别时，你可能看起来不像独特的用户。然而，这并不完美。如果你是某个虚拟服装网站唯一的
    Tor Browser 访问者，此外许多网站完全阻止来自 Tor 网络的连接。如果你尝试从 Tor 登录银行，会被拦截。更糟糕的是，你的账户可能会被挂。


    我将 Tor Browser 用于依赖它通常以“.onion”结尾的调查。对于其他一切，我依赖于硬化的 Firefox，如前所述。在 Linux 中安装 Tor
    Browser 非常简单。在 Pop! 中搜索 Tor 会显示多个选项。在写作期间，我发现以下方案对 Pop! 最有效。


    - 打开 Pop!Shop 并搜索“Tor”。

    - 选择“Tor Browser Launcher”选项并安装默认选项。

    - 启动“Tor Browser”以完成并启动浏览器。

    - 启用“始终自动连接”并点击“连接”。


    你不应该能够随时启动 Tor 并立即使用该程序。你的浏览器是你通往互联网的窗口。确保你已根据自己的需求对其进行了硬化，但不要到限制了你必要的在线活动的程度。拥有硬化的
    Firefox 版本可以为日常行为提供极大的隐私，而 Tor Browser 则适用于更敏感的任务。'
