- md: '

    Next, we must consider proper web browser configuration and usage.


    # CHAPTER SIX: WEB BROWSERS


    Before we consider connecting to various websites in order to take full advantage
    of our new Linux build, we should properly configure our web browsers. I recommend
    the Firefox web browser for most daily browsing, with limited use of other browsers
    for specific tasks. Firefox is already included with most Linux distributions,
    and OS installation of Firefox is preferred for our needs. Launch Firefox and
    consider the following modifications.


    - Click on the Firefox menu in the upper right and select "Settings"

    - In the "General" options, uncheck "Recommend extensions as you browse" and "Recommend
    features as you browse". This prevents some internet usage being sent to Firefox.

    - In the "Home" options, change "Homepage and new windows" and "New tabs" to "Blank
    page". This prevents Firefox from loading their default page.

    - Disable "Firefox Home Content options".

    - In the Search options, change the default search engine to DuckDuckGo and uncheck
    all options under "Provide search suggestions". This prevents queries from going
    directly to Google, and blocks the Google API from offering suggestions.

    - Click the "Privacy & Security" menu option and select "Strict".

    - Check the box "Delete cookies and data when Firefox is closed".

    - Uncheck the box "Show alerts about passwords for breached websites".

    - Uncheck the box titled "Suggested and generate passwords".

    - Uncheck the box "Autofill logins and passwords".

    - Uncheck the box "Ask to save logins and passwords for websites".

    - Uncheck the box titled "Autofill addresses".

    - Uncheck the box titled "Autofill credit cards".

    - Change the History setting to "Firefox to use custom settings for history"

    - Uncheck "Remember browsing and download history" and "Remember search and form
    history"

    - Check the box "Clear when Firefox closes. Do not check the box titled "Always
    use private browsing mode", as this will break Firefox Containers.

    - Uncheck "Browsing history" from the "Address Bar menu.

    - In the Permissions menu, click "Settings" next to Location, Camera, Notifications,
    and Virtual Reality. Check the box titled "Block new requests,... on each of these.
    If you will ever need audio communications within this browser, you could do the
    same for Microphone.

    - Uncheck all options under "Firefox Data Collection and Use".

    - Uncheck all options under "Deceptive Content and Dangerous Software Protection".
    This prevents Firefox from sharing potentially malicious site visits with third-party
    services.

    - Select "Enable HTTPS-Only Mode in all windows".


    These settings are what I refer to as the basics, and may be enough for most readers.
    This is where I want to deviate from previous writings. Prior to this publication,
    I always presented several settings which could be modified within the Firefox
    "about:config" menu. I no longer recommend this, which may upset some privacy
    fanatics. Please consider my reasons before abandoning this chapter.


    The purpose of my previous recommendations was mostly to prevent browser fingerprinting
    or canvassing. This activity is often abused by online sites which try to track
    you as you navigate the internet. If I own a website and I can collect unique
    identifiers from your browser, I am unique from everyone else who has ever visited
    my site. When you come back a week later, I know you are the same user, and I
    can continue to track your activity within my site.


    Previously, I recommended readers change various settings, such as the ability
    to know your current battery level, in order to make you appear less unique to
    the malicious systems snooping on your connection. Today, thanks to advancements
    in fingerprinting technology, I believe those settings could more harm than good.
    If you are the only visitor on that site did this setting, you now appear even
    more unique than if you had before.


    At the risk of offending some readers, I believe the following statement. We can
    no longer defeat modern browser fingerprinting by making modifications to our
    browsers. By anything we change, or any extension we add, always always makes
    a unique visitor in the eyes of others and fingerprinting systems. The more actions
    you take to blend into the crowd wisely makes you stick out. There are deceptions
    to this, but for general usage, sites will continue to track us. We will also
    collect our IP addresses, installed fonts, video characteristics, location metrics,
    and browser specifications at all times. This will never change.


    Furthermore, many of the current recommended about:config privacy settings break
    other desired functions. If you try to block all possible IP address leakage via
    WebRTC, you will likely also block the ability to use voice and protections within
    your browser. There must be a balance of protections and functionality. Using
    a VPN, as explained, and the previous Firefox settings have strong privacy by
    default. If you want pure anonymity, stay off the internet. If you need the most
    protection possible, consider the Tor Browser, as explained later.


    Next, I will discuss the first vital add-on I install on every computer is uBlock
    Origin. It blocks many ads and tracking scripts by default, but it can also block
    any type of script that is tempting to run on a page. This helps prevent tracking,
    malicious code execution, location sharing, and a number of other processes that
    could undermine your privacy and security.


    This add-on is completely free and open source. It is highly customizable, while
    remaining relatively easy to work with. uBlock Origin works from blacklists which
    block trackers specified in the list(s). The add-on comes with several lists enabled,
    but there are several more that can be added through simple checkboxes in the
    preferences. Keep in mind that the more blacklists you enable, it may be diff
    to work within the browser. This section may seem a bit overwhelming at first,
    but experimenting with the advanced settings should help you understand the functionality.


    I have previously recommended NoScript, Adblock Plus, Privacy Badger, and Disconnect
    as privacy add-ons that would help stop unwanted ads, tracking, and analytics.
    These are no longer present on any of my systems. I only use uBlock Origin, as
    it replaces all of these options. Let''s start with the basics.


    Install uBlock Origin from the Firefox Add-ons page or directly by navigating
    to the application''s website at https://addons.mozilla.org/en-US/firefox/addon/ublock-origin/.
    You are now protected on a basic level. By default, most invasive advertisements,
    tracking code, and malicious content is blocked. This step alone would provide
    much needed protection from the internet. However, we can take it further.


    Click on the uBlock Origin icon in the menu and select the "Dashboard" icon to
    the right, which appears as a settings option. This will open a new tab with the
    program''s configuration page. On the "Settings" tab, click the option of "I am
    an advanced user". Click on the "Filters" tab and consider enabling additional
    data sets that may protect your computer. I find the default lists confusing,
    however I enable "Block access to LAN" under "Privacy". You now have protection
    that will be applied to all visited websites without any interaction from you.
