    ## VoIP.ms Service


    I first attempted to obtain VoIP service from VoIP.ms several years ago. Every
    time I opened an account it was immediately suspended and support staff demanded
    I send an unredacted ID to them. I always refused. This was disappointing because
    VoIP.ms offers a unique way to obtain two-way SMS messaging along with voice services.
    In July of 2023, I reached out to the CEO and asked about the issue. He stated
    that they are currently attempting to modify their fraud controls with hopes of
    minimizing the need for an ID to Know Your Customer (KYC) regulatory requirements.
    Today, I possess a working VoIP.ms account, and I encourage you to test service.
    If you are able to secure a functioning account, you will find it much easier
    than the two previous providers. First, you need an account registering at https://voip.ms/invite/Mc2NJ3


    Using this link should provide you with $10 in free credits to add $15 to your
    balance and a bit less scrutiny on your new account. However, please note of all
    my comments at the beginning of this chapter. If you supply "John Doe" with a
    burner email and Gmail address, get suspended. Since we will be using these VoIP
    numbers with people in our circles as an alternative to our cellular number, I
    see no reason to use an alias for this service. In late July, the affiliate''s
    link showed that 35% of the people who used the link were able to open an account;
    65% were denied identity verification (we do not use any names or other account
    details). I have no solutions to this. If you are able to obtain service, consider
    adding a number and connecting it to iPhone with the following steps.


