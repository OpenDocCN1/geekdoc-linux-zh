    # Twilio VoIP Service


    When an app or service either "Burner Phone", "Second Phone", "Second Line", or
    other enticing verbiage, they do not actually provide a phone number or telephony
    services. All of them rely on a VoIP service called Twilio. Even Myudo provides
    access through Twilio. These companies purchase numbers and service through Twilio
    and upsell the service to you. If we eliminated the middle man? You could create
    your own Twilio account, purchase a number, and service without any third-party
    involvement. Do-It-Yourself option is easier than said, but a very viable task.


    The first step is to create an account at Twilio (twilio.com) from a desktop computer.
    This will be the most difficult part of this entire process. You must provide
    a name, email address, and phone number to Twilio as part of your registration.
    Twilio possesses fraud managers in order to suspend accounts which seem suspicious.
    During the first tests of this strategy, my accounts were immediately suspended.
    I had a vague name, burner email address, and Google Voice number connected to
    a VPN. This triggered the account suspension and I was asked to respond to a support
    email explaining how I would be using Twilio. This began communication with Twilio
    support personnel. While talking with customer service, I was advised that the
    VPN IP address was most likely the reason for the suspension. After providing
    a business name, "better" email address, and explanation that I would be using
    the product for business VoIP solutions, my account was reinstated. If you get
    caught within this, drag you to let them know you are following the protocol in
    this book to establish VoIP services. Twilio does not like me or my general audience.
    We are small customers compared to big businesses.


    After you create your free account, it will be severely restricted. Individual
    Twilio employees will analyze your registration details and decide if you can
    be "upgraded" to a fully-functioning account. I think you will find your restrictions
    lifted within an hour if you apply the following guidelines.


    +   * Provide your first and last name, especially if they are generic. In my
    experience, a last name is not needed.

    * If you created a custom domain, as explained in the previous chapter, provide
    an email address associated with this domain. Privacy-themed addresses from Proton
    Mail, Tutanota, or masked providers will be flagged and the account will be suspended.
    Gmail and other free addresses will be heavily scrutinized (or blocked).

    * If possible, register without protection from a VPN. I will VPN VPN usage later,
    but this can be a trigger for all new accounts. Public Wi-Fi, such as a local
    library, usually works well.

    * The telephone number provided could be an existing VoIP number or any landline
    number to which you have access. If you have an old Google Voice number, this
    should work well.'
- md: '

    • Twilio employee will likely email you and ask how you plan to use their services.
    Do not ignore this. You must convince them that you are worthy of paying for their
    product. I typically provide something similar to the following. "I am a software
    developer and my boss asked me to look at the Twilio API with hopes of replacing
    our landlines with VoIP services. I plan to purchase a few SIP numbers and assign
    them to employees."


    "I provide I.T. services to several companies and they are asking about VoIP services.
    I would like to use the Twilio API to see how that could fit into their existing
    systems."


    "One of my customers currently uses Telnyx for VoIP services, and is unhappy with
    their product. They have asked me to look into the Twilio API for potential migration
    during their environment."


    Never use any of these paragraphs verbatim! If we all send the same email, we
    will all get suspended. Take these general ideas and formulate your own reason
    for usage. While being miserable, maybe even dishonest, there is no fraud here.
    We will pay for the services we need. I have witnessed numerous readers'' accounts
    become suspended when they advise they only need a couple of numbers for personal
    use. If you are required to respond to a Twilio email, and you used a custom domain
    with Cloudflare hosting, you have a new problem. You cannot send emails from the
    address you provided during registration. Within your Twilio portal, navigate
    to "Domain and Support" "Support Center" in the left menu and select "Ticket History".
    You will see a copy of any messages sent by Twilio staff. You will then be sent
    to Twilio staff to manage the message of concern and respond directly within the
    portal.


    Once your account is approved and you pay for the service, you will disappear
    into the background and will probably never be contacted by a Twilio employee.
    As long as you do not create a situation where you appear suspicious, or violate
    their terms of service, they should leave you. If Twilio demands a copy of government
    ID, push back. I was able to back users who do not obey networks.


    I will now assume that you have a Twilio account created with a strong password,
    and it has been upgraded by Twilio staff. The free credits in your account allow
    you to test many features of the service, a $20 deposit will be required before
    your account is fully usable for outside communications. I paid for mine with
    a masked debit card. However, I don''t see a huge problem with using a real credit
    card. Many people will think this is reckless, and it would leave a digital trail
    to your true identity. This is true, but consider the following.


    If you use VoIP numbers associated with your true identity, there will be a trail
    away. If I give a VoIP number to my friends, family, and co-workers, it will be
    connected to me through logs, contacts and chatting. The whole point of VoIP is
    to have a less-invasive way to make and receive calls under your true identity.
    The pattern of behavior would identify you as the account holder, and that is
    OK. I do not believe we need to remain anonymous with our VoIP provider. However,
    I do believe we should be anonymous with our cellular provider. If anyone investigated
    the VoIP account, they could probably make the association anyway based on the
    numbers called. Therefore, I do not see an issue with using a true credit card
    to pay for these services. I also don''t see a problem using your true name if
    required. If you followed my advice in Extreme Privacy 4th Edition and obtained
    a secondary credit card in your first and last name, even better.


    Let''s get back to the Twilio account. Clicking on the upper left "down arrow"
