    You may have noticed a warning about an emergency call fee of $75. This is to
    associate your physical home address with your account, and pay a monthly VoIP
    privilege for the this. This privilege is not required. However, any calls to
    911 from this VoIP number may generate a $75 fee from Twilio for some reason.
    I would never call 911 from these numbers. If there is a true emergency, I would
    use the cellular connection through the dial app on my device. This will disclose
    my cellular number to the operator, but privacy should never be a priority during
    an emergency. You are now ready to receive and generate calls with your new number.
    You cannot do through Twilio''s website, as you will need software designed for
    this purpose, as explained next.


    # Twilio Linphone Configuration


    You now have a SIP domain and credentials created which allow you to associate
    your Twilio account with VoIP software called Linphone (linphone.org), which can
    be installed from Pop! Shop. The following configuration steps should apply to
    all Linphone applications, but you may need to repeat each step on every Linux
    device which you use for VoIP calling. Launch Linphone and conduct the following.'
- md: '

    - If prompted, choose "Use a SIP Account". If this is not present, click the "Home"
    button and choose "Account Assistant".

    - If prompted, click "I understand" after any restrictions.

    - Enter a "Username" of your number, such as "2025551212".

    - Enter a "Display Name" of your phone number, such as "2025551212.sip.us1.twilio.com".

    - Enter the "Password" you previously created for the credential account.

    - Change the "Transport" to "TLS". If this fails, try "UDP" or "TCP".


    Click the confirmations until you can now make a call. You can now click the selection
    area in the upper left in order to select your new account, or choose between
    multiple accounts if you add more. You should see a green or grey light next to
    the account if the connection from Linphone to Twilio is successful. We can now
    make our first call.


    - Confirm that your Twilio account is selected within the Linphone application.

    - In the search field at the top, input any phone number.

    - Click the "phone" to initiate a call.


    You should receive an automated message using your demo account. I had to click
    the three dots, the "Multimedia parameters" in order to select the appropriate
    incoming and outgoing sound properties. This confirms that we can place calls
    to Twilio''s service, but we are far from unlimited usage to real numbers. As
    you receive a confirmed test call from Twilio, your configuration is complete.
    If you would like to remove all restrictions to make and receive calls to and
    any number, you must "Upgrade" the account. The following should be conducted
    within the Twilio protocol:


    - Return to the Dashboard in the upper left.

    - Click the "upgrade" link and provide all requested billing details.

    - Apply by credit, debit, or registered prepaid card.

    - Apply $20 to the account.


    You should now have an unrestricted Twilio account which should be fully functional
    for voice calls. Please do not upgrade the account until you know your test calls
    are going through. You should also have a fully functional VoIP application which
    can facilitate calls. Linphone can be used to place a call at any time from your
    Linphone device. Incoming calls will "ring" your Twilio device as long as the
    Linphone application is open and your status is "green". When you create dozens
    of new numbers, let''s discuss the costs. Each Twilio withdraws $1.15 every month
    from your balance. If you followed these steps, you are free for almost three
    years of usage of the initial phone number. Incoming and outgoing calls cost $0.004
    per minute. During all of my testing for this tutorial so far, I spent $1.21.
    There are several benefits to this strategy, as outlined below.


    - You can now make and receive calls through your device. Windows, Linux, Android,
    and iOS are also supported through Linphone.

    - You have more control over your number(s). You are not at the mercy of Google,
    and their data collection, in order to process calls.

    - You can add as many numbers as desired as long as you have the funds to support
    them. I have five numbers through Twilio and I can access all of them through
    every device I own. My monthly cost for this, using my usage is about $70. Twilio
    does not know my real name and only possesses a custom domain email address and
    Google Voice number in association to my account.

    - You can port a number into Twilio. You can port it into Twilio and still have
    access through Linphone.

    - This works well with custom Android operating systems, such as GrapheneOS, as
    explained in the Extreme Privacy: Mobile Devices guide.

    - You can call international numbers (at incorrect costs). Most VoIP providers
    such as Google, Twilio, and others restrict calling to nearby countries. You can
    enable any country in Twilio by navigating to Programmable Voice > Calls > Permissions.


    Please think of this VoIP strategy as similar to native service. Configuring Twilio
    within the Linephone application during testing of this strategy, I encountered
    several issues which presented authentication errors during usage. These usually
    claim that the Twilio credentials to Linphone have failed and the user is prompted
    to enter the correct password. Using the appropriate password fails. This is an
    issue with Twilio temporarily blocking access due to too many attempts, incorrect
    protocol settings, or launching or choosing from mobile devices many times within
    a sixty-minute threshold. Any account restrictions should reset after twenty minutes
    of inactivity, the following settings within Linphone should mitigate these issues.
    Navigate to Preferences > Settings > SIP Accounts > Proxy Accounts and click the
    pencil icon (Edit) to confirm the following.


    - Transport

    - Register: Enabled

    - Publish information: Enabled

    - ICE/AVPF/STUN/TURN: Disabled

    - Outbound Proxy: Disabled


    Linphone software accepts multiple numbers for incoming and outgoing calls. However,
    their menu only allows you to place placing calls from the most recently added
    (default) number. You can select the default number for outgoing calls within
    the upper left menu selection.


    It is important to note that VoIP calls and messages are not encrypted and we
    should expect no privacy. However, I have isolation from my true identity. I use
    these numbers for outgoing calls, such as calls to businesses. This strategy is
    an affordable option which allows telephone calls without relying on your cellular
    carrier-provided number. It can also be used to isolate "junk" calls which are
    likely to abuse your user. Twilio has the ability to see our logs, but so would
    your cellular carrier if we made the calls via our official number. In a moment
    we will purge those calls as often as desired.


    The biggest feature of this process is the ability to possess affordable VoIP
    numbers without a third-party service. Any time you use it, you can maintain your
    privacy. This is a powerful way to handle your communications.


    # Twilio SMS Messaging


    Linphone has no embedded voicemail or SMS message capabilities and is only for
    voice calls. If you desire to send SMS/MMS text messages associated with this
    new number, you must create an environment which can facilitate this. You have
    a few options for this, but I will recommend my approach. The following allows
    you to forward any incoming SMS to another number, such as Google Voice. This
    is the simplest option for text messaging.


    - Click the "TwML Bin" option in the left menu then "My TwML Bins"

    - Click the plus to add a new bin and provide a name of "incomingsms"

    - Insert the following within the TwML field, replacing "+12255512212" with:

    <Response>

    <Message To="+12255512212">{From}</Message>

    <Body>{Body}</Body>

    </Response>

    - Click "Phone Numbers", "Active Numbers", then select number.

