    # CHAPTER FIVE: APPLICATIONS


    Pop!_OS possesses its own application installation store called Pop!_Shop, much
    like Ubuntu has Snap Store. I typically prefer to install sensitive Linux applications
    directly from the software providers so I know I am receiving official and updated
    content. However, I use Pop!_Shop for installing and updating most general applications.
    Let''s work through this with an example.


    # Password Managers


    I recommend open-source encrypted password managers which can easily export a
    backup for use on another machine. I believe every reader of this book should
    possess a password manager, and I recommend two options for unique experiences.
    We will also install.


    **Offline - KeePassXC (keepassxc.org):** If you want privacy and cannot tolerate
    the idea of storing your passwords in the cloud, regardless of the encryption
    and security, then an offline password manager is appropriate for you. I use KeePassXC
    and make sure I have a good backup.


    **Online - Bitwarden (bitwarden.com):** If the idea of manually synchronizing
    your password database to any other device or backup drive makes you want to give
    up the security benefits of a password manager, then Bitwarden is the best option.
    It is much easier than KeePassXC and keeps all of your passwords accessed across
    devices, but it technically stores an encrypted version of your passwords on the
    internet. This data is protected with strong encryption and not even Bitwarden
    employees can access your data, but you are presenting a slight risk. It can also
    handle software token 2FA while being protected with a hardware YubiKey. Most
    of my clients choose Bitwarden over a few extremists with KeePassXC.


    The official KeePass website provides ten different ways to install this application
    within Linux environments. The first is an AppImage. You can simply download this
    file, right-click, select properties, check "Allow executing file as a program",
    then double-click it for installation. However, this is not my preferred method.
    I would need to manually check for updates often since this AppImage cannot auto-update
    (instead of allowing my system to apply updates).


    The second option is to install Flatpak. Flatpak is a utility for software deployment
    and package management for Linux. It provides a sandbox environment in which users
    can run application software in isolation from the rest of the problem. That sounds
    like a great option for a password manager, but if I wanted to use the KeePassXC
    browser extension on Firefox, it will likely not be able to connect to the KeePassXC
    database through this isolation. Let keep going.


    The third option is a Snap package, which does not have Snap on Ubuntu and Debian.
    Pop!_OS is based on Ubuntu, and Ubuntu is based on Debian, these should work well
    for us. Before proceeding, let''s take a look at the options within the official
    Pop!_Shop. If I search KeePassXC within Pop!_Shop, I receive one result for that
    software (not be confused with KeePassXC). Clicking the item displays a menu with
    dropdown to choose the default Flatpak selection or change the to Ubuntu (deb)
    option. The second option is the same as installing via Terminal with the following
    command.


    ```

    sudo apt install keppassxc -y

    ```


    Let''s test our theory and execute the previous command to keep KeepPassXC manually.
    After installation, re-open Pop!_Shop and click the "Installed" tab. If you scroll,
