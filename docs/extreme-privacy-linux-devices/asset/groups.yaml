  - '[PAGE 11]


    The legitimate purpose of Intel ME, and AMD''s option called AMD Secure Technology
    (AMD ST), is to allow your device to be managed within a low-powered state. Administrators
    of large computer networks take advantage of this technology to remotely control
    many aspects of a computer within the network. The concerns arise due to the control
    which Intel ME has to all aspects of the device, the overall overness around the
    closed-source code behind these functions, and several known vulnerabilities which
    have been reported since 2017.


    Let''s have a reality check. Intel ME and AMD ST are not monitoring everything
    on a machine or allowing strangers to access your system. Substantial configuration
    on your device and the network to which it connects is required. You might never
    have a problem using Intel ME enabled. My concern is any new undisclosed vulnerabilities
    which could be abused by criminals. This presents my requirement for my Linux
    device. I have a machine with Intel ME disabled. You will likely never find a
    computer with all trees of Intel ME removed from its processor. However, there
    is an active community of people and companies constantly working to minimize
    the Intel ME processes to run within a system. The most active vendor is System76
    (system76.com).


    A company called Purism has previously offered laptops without Intel, but I strongly
    advise against purchase from Purism. They are still struggling to fulfill orders
    of their Linux-based phones several years after purchase. In some cases, people
    have been waiting five years for their device to ship, while being ignored by
    customer support. They refuse issue refunds for non-shipped items. Please avoid
    them. System76 only sells devices which are targeted toward Linux users and powers
    Linux when I shipped. I placed several orders for customized machines which shipped
    the next day from Colorado. Most of their laptops have Intel ME disabled by default.
    The second reason I prefer System76 over other vendors is their use of open-source
    firmware. This software replaces the proprietary code included with most motherboards.
    It is typically much faster and more secure. More importantly, it removes the
    hidden closed-source code which could be doing things on a hardware level.


    Hopefully you have decided that you also want a machine which has Intel ME disabled
    and instead of stock firmware. This means you need an Intel-based machine from
    System76. Sounds easy, right? You still have many options. System76 currently
    offers nine different desktop models and four desktop variants. Let''s begin with
    the laptop versus System76 Helio desktop computer for all of my breach work. I
    prefer a desktop for this because I can easily expand my storage and allow the
