    A great feature of virtual machines is the use of Snapshots. These "frozen" moments
    allow time to revert to an original configuration or preserve an optimal setup.
    Most users use the virtual machine as previously, and then immediately create
    a snapshot of the unused environment. When you accidentally remove or break a
    feature, you can revert to the previously created snapshot and eliminate the need
    to ever reinstall. Completely shut down the Virtual Machine and conduct the following.


    - In the VirtualBox Menu, click on the "Snapshots" button in the upper right.

    - Click on the blue camera icon to "take a snapshot".

    - Create a name and click "OK".


    You can now use your virtual machine as normal. If you ever want to revert to
    the state of the machine that existed at the time of the snapshot, follow these
    instructions:

    - Completely shut down the Virtual Machine.

    - In the VirtualBox Menu, click "Snapshots" and select the snapshot to apply.

    - Click on the blue camera icon with "restore snapshot".

    - Deny the option to save the current data, and click "Restore".


    Optionally, if you ever want to remove a snapshot, simply click the icon with
    a "X". This will remove data files to eliminate wasted space, but cannot restore
    it once removed. It will not affect the current machine state. Many users remove
    old, redundant snapshots after creating clean machines.


    I wish that every reader will be able to build virtual machines on any computer.
    This is simply not the case. While most computers use virtualization, demand slight
    modifications in order to allow virtualization. Let''s take a look at the most
    common errors presented by VirtualBox.


    ## VT-x is disabled

    Any of this error is the most common reason your VMS will not start. This is usually
    because the processor of your computer does not support virtualization or the
    feature is not enabled. The fix for this varies by brand of machine and processor.
    Immediately after your computer is turned on, before the operating system starts,
    check the BIOS of the computer. This is usually accomplished by pressing F2, F10,
    or another designated key until a BIOS menu appears. In the BIOS, with many Intel
    processors, you can open the "Advanced" tab and select the "Virtualization Frequency",
    "Advanced Core" settings, and then set the "SVM Mode" to "Enable". If none of
    these options appear, conduct an online search for the model of your computer
    followed by "virtualization" for instructions.


    ## VT-x is not available

    This is usually installed to Windows 10 and 11 machines. Navigate to the Windows
    Control Panel and open "Programs and Features". Click "Turn Windows features on
    or off" and check all "Hyper-V" features. Click "OK" and reboot. If the Hyper-V
    option is not enabled, restart the computer, disable Hyper-V, and reboot again.
    Attempt to start your VM with these new settings. This may seem backwards, but
    it makes sense. Previous versions of VirtualBox cannot run if using "Hyper-V"
    in Windows. Basically, systems try to get exclusive access to the virtualization
    capabilities of the processor. Hyper-V within Windows receives the first access
    and impedes VirtualBox from the capabilities. The latest version of VirtualBox
    attempts to correct this. If the previous setting did not help, try to reenable
    all of the Hyper-V options within Windows, reboot, and try to boot your VM. If
    you are still experiencing problems, read the troubleshooting chapter of the VirtualBox
    manual at virtualbox.org/manual/ch12.html.


