    ## 第七章：VoIP 服务


    现在你已经将计算机配置得尽可能私化和安全了，你可能希望通过互联网连接进行传统的电话通话。正如我之前关于移动设备的数字指南中所解释的，我从不希望依赖与移动设备关联的号码进行日常通信。因此，我们需要一种在不使用蜂窝套餐的情况下拨打和接收标准电话及短信的方法。我依靠一个名为
    Sipetic 的应用程序和 IP 协议（VoIP）提供商来处理所有的电话。桌面 Linux 系统将依靠一个名为 Linphone 的应用程序来配合这些提供商。在配置设备之前，让我们先了解为什么在使用真实蜂窝号码时应该保持谨慎。


    - 当你通过标准的蜂窝号码拨打电话和发送消息时，服务提供商会存储此类活动的永久性日志。该日志记录了你所有的通信，并可以被员工、政府和犯罪分子访问。我曾目睹手机和短信日志在刑事和民事审判中被作为主要证据。

    - 你的蜂窝号码通常用作账户的主要标识符。如果我知道你的号码，就可以可以通过此细节获取更多信息，例如移动设备的位置历史。你的设备会根据你连接的基站始终存储你的位置。我可以获取法院令获得这些细节，或者我了解到赏金猎人只需通过知道蜂窝号码就能实时定位移动设备，这不需要任何法院令。记者们已经能够追踪人们的移动多年。

    - 蜂窝号码容易受到 SIM 卡劫持攻击（SIM-swapping attacks）。如果我知道你的主号码，可以通过各种策略接管你的账户，并成为该号码的新主人。我可以伪装成你并接收本该给你的通信。如果你使用该号码进行双重验证，那么现在我拥有了第二个因子。

    - 当你把电话号码留给亲家人时，他们可能会将其存储在联系人中并将你的名字与该条目关联。某人下载了一个请求访问联系人列表的恶意应用程序，将联系人发送到可以查询的在线数据库中。我们过去在几个应用中都见过这种情况，包括
    TrueCaller，它向世界共享了私人的联系人详情。你是否收到过 LinkedIn 的邮件，要求你和你认识的人建立联系？当一个人同意与服务共享其联系人（包括电子邮件和电话号码）时，就会发生这种情况。Twitter
    也想从任何愿意分享的成员那里获取这些细节。只需一次，你的蜂窝号码就会公开与你的真实姓名绑定。


    使用 VoIP 消除了许多此类顾虑。考虑以下几点：

    - VoIP 电话和消息在 VoIP 提供商的门户记录。

    - 然而，我们对这些信息有更多控制权，并且可以随地永久清除内容。

    - VoIP 通信不具备蜂窝连接那样的位置细节。虽然 VoIP 提供商可能拥有连接的 IP 地址，但没有基站能提供精确的 GPS 坐标。如果你破解我的 VoIP
    账户，你永远无法得知我的真实位置。

    - 非法接管蜂窝账户轻而易举，可以在一小时内完成。将 VoIP 号码转移到另一个提供商可能需要一周以上的时间，而此类操作的通知将让你能够停止。每当我被迫使用电话号码进行双重验证时，我总是倾向于使用
    VoIP 号码而不是蜂窝账户。

    - 你无法阻止亲友向滥用电话的机构分享你的电话号码。如果他们只知道你的 VoIP，风险就会更小。一旦 VoIP 号码公开并与你的名字关联，你可以根据需要轻松更改它。如果你有多个号码，可以将它们用于各种用途。当世界知道某个
    VoIP 号码属于你时，它无法像蜂窝号码那样被滥用。再次，VoIP 无法共享你的位置。


    解决这一切的方案是永不使用真实的蜂窝号码。相反，我们将仅使用 VoIP 号码进行所有的通话和标准短信。在接下来的页面中，我将解释如何配置各种用于电话通话和短信的
    VoIP 服务。我的目标是让你创建一个自己的 VoIP 产品，让你能够在你安全的 Linux 设备上以极低的成本拨打和接收电话。此外，移动设备掌握在你自己手中。为了享受
    VoIP 服务的便利，你不需要维护 Google 账户访问。这一部分具有技术性，但任何人都可以重复这些步骤。对于所有在线服务，这些步骤都可能在不通知的情况下发生变化。你可能会遇到与原文有所不同的情况。


    '
