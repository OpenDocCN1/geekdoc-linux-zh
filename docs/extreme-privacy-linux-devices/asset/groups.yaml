    Rather than use a trademark symbol this book uses the names only in an editorial
    fashion and to the occurrence of the benefit of the trademarked name owner, with
    no intention of infringement of the trademark.


    Due to the use of quotation marks to identify specific text to be used as search
    queries and data entry, the author has chosen to display the British rule of punctuation
    outside of quotes. This ensures that the quoted content is accurate for replication.
    To maintain consistency, this format is continued throughout the entire book.


    The technology referenced in this book was edited and verified by a professional
    team for accuracy. Exact tutorials in reference to websites, software, and hardware
    configurations change rapidly. All tutorials in this book were confirmed accurate
    as of July 25, 2023. Readers may find slight discrepancies within the methods
    as technology changes.


    Revision: 2023.09.18


    # CONTENTS


    - PREFACE

    - INTRODUCTION

    - CHAPTER 1: Why Linux?

    - CHAPTER 2: Hardware Configuration

    - CHAPTER 3: OS Configuration

    - CHAPTER 4: DNS Configuration

    - CHAPTER 5: Applications

    - CHAPTER 6: Web Browsers

    - CHAPTER 7: VoIP Service

    - CHAPTER 8: Virtual Machines

    - CHAPTER 9: Custom Scripts

    - CHAPTER 10: Updates & Maintenance

    - CONCLUSION


    # ABOUT THE AUTHOR: MICHAEL BAZZELL


    Michael Bazzell investigated computer crimes on behalf of the government for over
    20 years. During the majority of that time, he was assigned to the FBI''s Cyber
    Crimes Task Force where he focused on various online investigations and Open Source
    Intelligence (OSINT) collection. As an investigator and sworn federal officer
    through the U.S. Marshals Service, he was involved in numerous major criminal
    investigations including online child solicitation, child abduction, kidnapping,
    cold case homicide, terrorist threats, and advanced computer intrusions. He has
    trained thousands of individuals in the use of his investigative techniques and
    privacy control strategies.


    After leaving government work, he served as the technical advisor for the first
    season of the television hacker drama *Mr. Robot*. His books *OSINT Techniques*
    and *Extreme Privacy* are used by several government and private organizations
    as training manuals for intelligence gathering and privacy hardening. He now hosts
    the *Privacy, Security, and OSINT Show*, and assists individual clients in achieving
    ultimate privacy, both proactively and as a response to an undesired situation.
    More details about his services can be found at *IntelTechniques.com*.


    # LINUX DEVICES PREFACE


    I wrote my first privacy-related book in 2012 Hiding From The Internet. This eventually
    evolved into the title of Extreme Privacy, which is now a large 517-page textbook
    in its fourth edition. In 2023, I began conversations with my staff about the
    potential for a fifth edition. There was some resistance. We had just released
    the 550-page OSINT Techniques textbook and we were all exhausted from the process.
    The idea of attacking a new version of Extreme Privacy seemed overwhelming at
    the time. We threw around the idea of a smaller book.


    Many readers of Extreme Privacy expressed frustration at the overall amount of
    information presented within one. At 320,000 words, it would be overwhelming to
    delete all at once. Other criticism was that readers did not necessarily need
    all of the information within book. Some wanted to focus on trusts, LLCs and nomadic
    mobile, and did not need all of the technology-themed chapters. Others only wanted
    to learn about secure computers, mobile devices, and other technical devices,
    and did not care about my ideas on anonymous home or car. This was helpful feedback,
    and impacted the decision to release this digital book. The most criticism from
    Extreme Privacy was about the format. My large OSINT and Privacy books are only
    available in print. This upset many readers who want to avoid Amazon or prefer
    to read on a screen. With this release, and the previous Mobile eBooks, we are
    providing only PDFs. There are no official versions and we have eliminated Amazon
    from the entire publication process. This allows us to offer a lower price, and
    90% of each purchase supports our free podcast.


    We realize that a native PDF will lead to immediate piracy of this work online.
    We accept that. We believe we can offer further benefits to legitimate purchasers
    by offering free updates when appropriate. If we ever need to modify existing
    content or add new sections, we can send an email blast to all purchasers which
    will allow them to download a new copy with all updates for free. Each copy of
    this work is watermarked with a visible and hidden unique code, we can block updates
    from who publish the book without consent. Overall, we want to reward those who
    support us with a searchable, copyable, updatable and printable document, even
    at the risk of losing sales to the pirates.


    With Extreme Privacy: Linux Devices, I continue this approach to our tutorials.
    It is not a replacement for Extreme Privacy (the printed book). Please consider
    it as a much thorough supplement about Linux devices. My hope is that this will
    further continue this series of shorter volumes which each focus on one specific
    topic. This allows people to purchase the content when they need a more affordable
    price. It also allows us to publish content more rapidly, as we can focus our
    efforts on one area at a time as needs arise, instead of reserving content for
    a potential future release. Free updates are also a win for everyone. I now present
    our digital guide solely about building the optimal Linux device.


    # INTRODUCTION


    I began using Linux as my full-time primary operating system a couple of years
    ago. I had dabbled with Linux for decades and relied heavily on it for virtual
    machines within my OSINT books, but I did not commit to it as my daily driver
    until I finally had enough of the privacy invasions forced onto me by Microsoft
    and Apple. Windows and macOS operating constantly monitor your usage and collect
    sensitive data about your devices, locations, documents, and overall activities.
    They claim to store this for your benefit in order to provide a tailored computing
    experience. This is probably true, but what happens when this data is leaked,
    breached, or court-ordered to be given away? What can we do to leave this ecosystem
    of privacy and security risks?


    I believe the answer is Linux. If you are only familiar with macOS or Windows
    environments, you will be pleasantly surprised by the ease and simplicity of using
    Linux as your computer''s operating system. This will be a learning curve, but
    I promise that anyone reading this guide can make the switch. I believe you will
    prefer Linux after a month of daily usage. You might even find macOS and Windows
    machines difficult to use after committing to Linux.


    This book will help you create a machine which does not send any sensitive data
    to Apple, Microsoft, or other providers who abuse this information. We will stop
    them from archiving your activities within the hardware we have purchased. No
    online accounts will be required in order use our operating system or download
    applications. We will have full control of our devices and operating systems.
    A name, telephone number, or physical address will never be requested in order
    to use our systems. We will all take our privacy back, possessing the perfect
    machine for our unique needs.


    This book is designed for the reader interested in extreme privacy. I will not
    sugar coat my opinions or offer less-secure options for the sake of convenience.
    I will explain every step and will never make assumptions about the reader''s
    level of technology awareness. This is our employ for every new client''s Linux
    device. It is comprised of our internal client tutorials and staff handbooks,
    with extended details provided by myself. It would allow you to create a perfect
    privacy and secure Linux device for your needs. I leave nothing out, and include
    many new strategies previously omitted from Extreme Privacy, Fourth Edition.


    I offer one last vital piece of information before we start. I encourage you to
    generate your own opinions as you read along. You may disagree with me at times,
    which is ideal. That means you are really thinking about how all of this applies
    to you. **If everyone unconditionally agrees with every word I say, I am probably
    not saying anything interesting. then there is no need for this text.** Please
    read with an open mind and willingness to try new things. Let''s begin.

    '
