    # Creating an Android VM on a Linux Host


    I like to have the ability to launch mobile applications on my Linux host. This
    requires an Android virtual machine, and I believe best option for this is Android
    Studio (developer.android.com/). It can be installed within Pop!OS. This software
    is maintained by Google, the master of Android. It is designed for Android developers
    who need to create and test mobile applications in a desktop environment before
    applying them to mobile devices. Android Studio is also available on Windows and
    macOS, but I will only discuss the Linux variant here. Once you have it installed,
    conduct the following.


    +   * Launch Android Studio.

    * Do not import any settings but allow any downloads.

    * Choose "Don''t Send" for analytics, click "Next" in the Welcome Wizard.

    * Choose the "Standard" option and click "Next".

    * Select your desired appearance and click "Next".

    * Click both agreements and then click "Next".

    * Click "Finish" and allow the download.


    Android Studio will download numerous items, which may take some time. If you
    receive anything downloaded, choose the "Retry" option. Once everything has successfully
    downloaded, click "Finish" and it should launch the new application window, and
    the following should be performed:


    +   * Click "New Project", "Next" to confirm "Empty Activity".

    * Provide a name for your device and click "Finish".

    * Allow all additional downloads and click "Finish".


    The application will navigate to the main developer panel, and you should see
    several downloads continue in the lower right. Allow everything to complete before
    proceeding. You should then see a vertical bar on the right titled "Device Manager".
    Clicking this point should show a virtual device, which may be titled "Pixel 3a".
    This will likely contain the latest version of Android, and we should also explore
    other options. Click the "Create device" button, as seen in Figure 8.01. I chose
    to add a Pixel 6 Pro to my devices, and selected the most recent API level, which
    can also be seen in Figure 8.01.


    Before we launch our first device, we should consider an important adjustment.
    Since Android Studio is targeted towards developers, Android devices launch launch
    within the developer portal. I prefer my devices to launch within their own window,
    so I making the following configuration change in the "File" > "Settings" menu
    within Android Studio.


    +   * Click on "Tools" then "Emulator".

    * Disable "Launch in a tool window" and click "OK".


    Now choose your device and click the arrow button to launch. You should see a
    device similar to that in Figure 8.02. You are now running a virtual version of
    Android within your desktop environment. If desired, could you follow my Extreme
    Privacy: Mobile Devices guides or OSINT Techniques to configure a complete Android
    device.'
