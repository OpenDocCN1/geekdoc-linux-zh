    never需要，但如果发生灾难，我会感到很安心。


    ## 注意事项


    我是 Standard Notes (standardnotes.com) 的忠实粉丝。免费版本提供端到端加密 (E2EE) 数据。只有你能看到自己的内容，并且可以将所有数据同步到任何桌面或移动设备。我每天都依赖我的笔记。付费版本引入了更多格式选项和表格条目，但我更偏好免费编辑器的纯文本手感。然而，付费版包含了存储双重身份验证
    (2FA) 代码的能力，这是一个巨大的优势。这让我能够拥有一个真正跨平台、开源且加密的 2FA 应用程序。


    Pop!_Shop 中有一个 Standard Notes (Flatpak)，但它也是社区提供的仓库。我倾向于直接从提供者下载任何敏感程序，就像我下载 Proton
    Mail Bridge 一样。如果只是一个简单的文本编辑器，使用 Pop_Shop 没有问题。然而，这是我的加密笔记程序，对我来说极其敏感。因此，我访问官方网站
    https://standardnotes.com/download/link 并通过“Begin Download”链接下载 AppImage 文件。右键点击下载的文件并选择“用
    AppLauncher 打开”。我总是选择“整合并运行”选项并允许过程完成。如果有任何待处理的更新，Standard Notes 会在应用程序内提示你。


    ##书籍


    我更喜欢 Calibre (calibre-ebook.com) 作为我的电子书库软件。它允许我收集已购买或下载的书，并将它们同步到几乎任何电子书阅读器。它可以安全地安装在
    Pop!_Shop 应用中。


    ## 消息


    我强烈建议你和联系人在所有通信中使用加密 (E2EE) 消息。Signal (signal.org)、Element (element.io) 和 Wire
    (wire.com) 为语音、视频和文本提供了开源 E2EE 平台。还有许多其他出色的选项，但对于初次接触这一概念的人来说，这些是最好的。按照它们网站上的
    Linux 安装步骤，可以安装任何或全部程序。


    ## VLC


    Pop!_OS 不包含任何强大的媒体播放器。如果你遇到各种音频和视频文件，我强烈建议从 Pop!_Shop 安装 VLC。


    ### 办公


    Pop!_OS 包含了 LibreOffice 办公件，用于文字处理、电子表格和演示文稿。为此我更偏好 ONLYOFFICE。它可以从 Pop!_Shop
    安全安装。


    ### BleachBit 清洁器


    一段时间后，你的 Linux 设备可能会充满旧缓存文件、遗留数据和其他不需要的文件。我建议每周清理 BleachBit 以保持整洁。我更喜欢 Pop!_Shop
    (Flatpak) 中的 BleachBit (root) 选项。我在启动时接受默认配置。然后我选择除“释放磁盘”之外的所有选项并点击“清理”。在这一点上，在新机器上操作时，我释放了
    1.02 GB 的数据。


    ### 工具


    我倾向于在任何 Linux 发行版中添加几个系统工具，包括用于 RSS 的 GNOME Feeds、用于播客的 GNOME Podcasts 以及用于清除文件中个人信息的
    Metadata Cleaner。这些都可以在 Pop_Shop 中以默认设置安装。为了让 Metadata Cleaner 运行，你还需要一个名为 mat2
    的工具，可以通过终端通过以下命令安装：


    ```

    sudo apt install mat2 -y

    ```


    重启后，你可以右键点击任何可能包含隐藏元数据的图像、视频或其他文件并清理内容。将在原始文件旁边生成第二个文件，文件名中会加上“clean”。


    ### 虚拟货币


    如果你需要访问虚拟货币，我总是建议使用离线软件钱包，而不需要第三方交易所。我依赖 Ethereum 处理比特币，并使用 Monero GUI Wallet
    处理 Monero。你可以在 Pop!Shop 或另一个软件仓库中找到这些程序，但我只会从它们的原始源直接安装。我从 https://ethereum.org/#download
    的官方站点获取镜像文件，然后右键点击文件用 AppLauncher 安装。我从官方网站 https://www.getmonero.org/downloads
    下载了 64 位文件，解压它，然后右键点击 Monero 镜像完成安装过程。


    ### 应用程序更新


    你需要保持新安装软件的更新。Pop!Shop 中的“已安装”选项卡允许你修补操作系统和 Flatpak/deb 程序，但它不会更新所有单独的应用。我将以下命令保存在我的本地笔记应用中，以便复制粘贴。


    ```

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autclean -y

    flatpak update -y

    ```


    你应该拥有一个稳定、安全、隐私、已更新并包含日常所需程序的 Linux 系统。还有很多工作要做，但你已经完成了基础工作。当我们之后创建自定义维护脚本时，我们将添加更多命令来确保系统整洁。


    虽然大多数人依赖这些应用程序存储加密数据，但极端隐私追随者会考虑自托管。这个主题超出了本指南的范围，但网上有大量信息可以协助自托管 Bitwarden、EteSync、Standard
    Notes 等。接下来，我们必须处理系统中最重要的程序：浏览器。


    ## DNS 条目


    现在是回到你的 NextDNS 门户并检查日志的好时机。我喜欢启动每个程序然后关闭它，查看 NextDNS 中产生了哪些类型的连接。对我的机器造成的损害很小，如下所示（顶部）。Thunderbird
    是最大的罪祸首，因为它与自己的服务器进行同步。这并没有恶意，但如果你需要，可以阻止这些请求。Standard Notes 会连接到自己的服务器数据，如果你担心
    ONLYOFFICE 向其服务器发送任何数据，可以在 NextDNS 中阻止整个域名。这将允许程序完全离线使用。我做了此更改（第二张图片），并在下次启动时阻止了连接（第三张图片）。


