- md: "\n## Making a wireless connection\n\nThe Kinet application that is bundled\
    \ with the SUSE Linux distro allows quick'easy wireless connection to the internet.\
    \ It typically is started automatically during the boot process and resides in\
    \ the system tray at the bottom right of the desktop – represented by an icon\
    \ depicting a connector, as shown below:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_39_0.png)\n\
    \nIf the icon is not present KNetwork can be launched by clicking the \"Dial Up\"\
    \ item under the \"Internet\" group in the main menu. With KNetwork running a\
    \ right-click on its system tray icon reveals the context menu. To establish an\
    \ internet connection via a wireless ethernet card first select the \"Wireless\
    \ connection\" item in the context menu:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_39_1.png)\n\
    \nUse the \"Settings\" item on the context menu to configure KNetwork to start\
    \ automatically whenever KDE gets started.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_39_2.png)\n\
    \nA dialog box opens in which you may scan for available wireless networks. Select\
    \ the one you wish to use for internet connection then click on the \"Connect\"\
    \ button.\n\n## ...cont'd\n\nThe network shown here is simply named 'default'\
    \ — click on the 'Current' tab to discover its current signal quality.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_40_0.png)\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_40_1.png)\n\nFor protection wireless\
    \ networks should be configured to use a security protocol, as Wired Equivalent\
    \ Protocol (WEP), to require an encrypted key before permitting access to the\
    \ network. Enter the WEP key details for your wireless network into the next dialog\
    \ box then click the OK to attempt access:\n\nDo not leave the WEP key set at\
    \ its original value — choose a new value to better protect your wireless network.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_40_2.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_40_3.png)\n\
    \nIf the key is accepted a dialog box will appear confirming that you have successfully\
    \ connected to the network. You can now access the internet from any web browser\
    \ on your Linux system.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_40_4.png)\n\
    \n3. Configuring hardware 39\n\n## Changing other hardware settings\n\nIn Linux\
    \ there is often more than one way to accomplish a task – for instance, an alternative\
    \ way to launch the Control Center is to select the \"Control Center (YaST)\"\
    \ item from the System group in the main menu:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_41_0.png)\n\
    \nClicking on the Printer here in the right-hand pane opens the very same Printer\
    \ dialog described on page 37\n\nThis method of launching the Control Center always\
    \ requests the root password and allows you to configure all system hardware.\n\
    \n## Exploring the desktop\n\nThis chapter examines some features of the K Desktop\
    \ Environment (KDE) and demonstrates how to launch applications, change the desktop\
    \ appearance, and customize window decoration, to personalize the working environment.\
    \ It also illustrates some useful features which are not present in the Windows\
    \ desktop.\n\n## Chapter Four\n\n- Introducing the KDE taskbar | 42\n- Launching\
    \ applications | 44\n- Understanding virtual desktops | 46\n- Changing the desktop\
    \ background | 48\n- Customizing window appearance | 49\n- Installing a desktop\
    \ theme | 50\n- Changing the screensaver | 51\n- Getting help | 52\n\n## Introducing\
    \ the KDE taskbar\n\nThe taskbar, or “panel” in KDE, appears across the bottom\
    \ of the screen by default. It can be easily repositioned to the top or side of\
    \ the screen – just drag it to your preferred location.\n\nThe Start button is\
    \ situated, as you expect, at the extreme left of the taskbar, and features the\
    \ KDE logo. To the right of the Start button are a number of Quick Launch buttons\
    \ that installed by default. Extra Quick Launch buttons can be added by right-clicking\
    \ on the taskbar and selecting Add to Panel then choosing an item to add from\
    \ one of the sub-menus.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_43_0.png)\n\
    \nQuick Launch buttons can be removed in a similar way using Remove From Panel.\
    \ To rearrange the position of a taskbar right-click on it select the Move option\
    \ from the context menu – the cursor will change to indicate that you can drag\
    \ the button to a new location on the taskbar:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_43_1.png)\n\
    \nThe taskbar is highly customizable and has a special facility for this purpose.\
    \ Right-click on the taskbar and choose Configure Panel option from the context\
    \ menu to:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_44_0.png)\n\nA great Hiding\
    \ option adds Panel buttons to the taskbar so it can be hidden by a single click\
    \ – the animation effect is like retracting a tape.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_44_1.png)\n\
    \nThe Layout settings allow you to choose the position, height and length of the\
    \ taskbar under its Arrangement tab. Options under the Hiding tab let you decide\
    \ when the taskbar should be hidden to reveal more desktop area. Which applications\
    \ to include on the Start menu can be edited under the Menus tab.\n\nThe Appearance\
    \ settings configure buttons on the taskbar so they may display tooltips and include\
    \ individual background images. This makes them clearly appear as buttons rather\
    \ than just icons.\n\nThe Taskbar settings allow you to control how icons of running\
    \ applications will appear on the taskbar.\n\n## Launching applications\n\nClick\
    \ on the KDE Start button to open the main menu. Running the mouse pointer over\
    \ each menu item displays its sub-menu in a typical fashion – as with the Windows\
    \ Start menu. Navigate through the menus then click any application to launch.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_45_0.png)\n\nThe screenshot above illustrates\
    \ the Firefox web browser being launched from the graphical menu. Notice that\
    \ its icon also appears as a Quick Launch button on the taskbar – so Firefox can\
    \ also be launched just by clicking that button.\n\nAnother way to launch Firefox\
    \ is to click the Run Command item, then enter the application's name in the dialog\
    \ box that appears – now click the Run button to open Firefox:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_45_1.png)\n\
    \nRight-click on any menu item to reveal a context menu containing options that\
    \ allow you to easily add a shortcut to it on the desktop or taskbar. You may\
    \ also choose the option to open the KDE Menu Editor to modify how the item appears:\n\
    \n| Web Browser (Firefox) | Add Item to Desktop |\n| :--- | :--- |\n| Web Browser\
    \ (Konqueror) | Add Item to Main Panel |\n| | Edit Item |\n| | Put Into Run Dialog\
    \ |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_46_0.png)\n\nNote that the Editor\
    \ displays a command that can be used to launch the application from a command\
    \ prompt in a shell window.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_46_1.png)\n\
    \n- Applications\n- Development\n- Edutainment\n- Games\n- Graphics\n- Internet\n\
    - Administration\n- Chat\n- Data Exchange\n- Dial-Up\n- E-Mail\n- Ham Radio\n\
    - More Programs\n- Peer to Peer\n- RSS Reader\n- Telephone\n- Usenet News Reader\n\
    - Web Browser\n- Web Browser (Firefox)\n    - Web Browser (Konqueror)\n- Web Page\
    \ Creation\n- Multimedia\n- Office\n- System\n\n![](img/0494b98ec9ddc4515587e9808d73902e_46_2.png)\n\
    \n## Understanding virtual desktops\n\nOne great feature of Linux desktops not\
    \ found in Windows is the ability to support multiple “virtual” desktops. This\
    \ allows you to open applications on different desktops and to easily switch between\
    \ them running applications.\n\nBy default four virtual desktops are available\
    \ in KDE and these are depicted on the taskbar as a block of four square buttons.\n\
    \n| Document - OpenOffice | The GIMP | 1 |\n| :--- | :--- | :--- |\n| Google -\
    \ Mozilla Firefox | RealPlayer | 2 |\n\nThe active desktop in the illustration\
    \ above is desktop #1, running the OpenOffice word processor. Clicking on the\
    \ number two button switches to the Firefox browser that is running on desktop\
    \ #2:\n\n| Document - OpenOffice.org | The GIMP | 1 |\n| :--- | :--- | :--- |\n\
    | Google - Mozilla Firefox | RealPlayer | 2 |\n\nSimilarly, clicking on the number\
    \ three button switches to the GIMP image editing application that is running\
    \ on desktop #3, and clicking on the number four button switches to the RealPlayer\
    \ multimedia application that is running on desktop #4:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_47_0.png)\n\
    \nThe copy and paste process in Linux is simple, just hold down the left mouse\
    \ button while you drag the text to highlight it this copies the text to the clipboard.\
    \ Go to where you want to copy the text then press the center mouse button (or\
    \ wheel) to paste the text.\n\n| Document - OpenOffice.org | The GIMP | 3 |\n\
    | :--- | :--- | :--- |\n| Google - Mozilla Firefox | RealPlayer | 4 |\n\nEach\
    \ application continues to run its own virtual desktop so you can quickly copyn'paste\
    \ by switching desktops. For instance, in the example above you could copy images\
    \ or text from a web page in Firefox on desktop #2 then switch to desktop #1 and\
    \ paste into a document open in the OpenOffice word processor – then switch back\
    \ to desktop #2 to continue working.\n"
