  - "[PAGE 199]\n\n# Connecting across a network\n\nIn the same way that each house\
    \ on a street has a unique address, to which mail can be addressed for direct\
    \ communication, every computer on a network has a unique number, known as it's\
    \ IP (Internet Protocol) address, which can be used to directly communicate with\
    \ a particular computer.\n\n| host | show the remote hostname and IP address |\n\
    | ifconfig | show the local network IP address |\n| ping | send packets to test\
    \ if remote host is reachable |\n\nYou can discover the IP address of the computer\
    \ behind a web address by stating the URL as the argument to the “host” command.\
    \ In some cases, for large scale websites, this may reveal multiple IP addresses\
    \ as those shown below:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_199_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> host\
    \ www.google.com\nwww.google.com is an alias for www.l.google.com\n*\nwww.l.google.com\
    \ has address 66.102.9.104\nwww.l.google.com has address 66.102.9.999\nwww.l.google.com\
    \ has address 66.102.9.147\nwww.google.com is an alias for www.l.google.com\n\
    www.google.com is an alias for www.l.google.com\nuser> \n```\n\nIn Linux you can\
    \ discover the IP address of your own computer by assuming root super user status\
    \ (“su -l”) and issuing the “ifconfig” command to display all network interface\
    \ configuration. If your computer has multiple network connections each one will\
    \ be listed separately. Supply the device name as the argument to the ifconfig\
    \ command to see an individual report.\n\n198 Linux in easy steps"
