    ## OpenOffice Math 中的公式


    OpenOffice 软件套中的 Math 应用程序允许以严格控制的格式将数学公式插入到文档中。在 OpenOffice Writer 中打开文档后，点击插入（Insert）、对象（Object）、公式（Formula）菜单进入公式模式——窗口底部将出现一个“命令”（command区域区域。


    在命令区域上点击右键，可以在右键菜单中查看一系列预定义的公式控件。选择其中任何一个，或直接在命令区域中输入以构建公式。完成后，点击主窗口以关闭命令。


    在公式模式下，点击工具（Tools）、目录（Catalog）菜单可以找到可以插入公式的数学符号目录。这包括希腊字母，还有一个“特殊”（Special）集合，你可以在其中添加自己的符号。


    目录符号通过命令代码中的名称和 `&` 字符进行引用——在下方示例中，`&x` 和 `&pi` 引用特殊目录符号。注意表达式被包含在大括号内，`~` 波浪号增加了间距。


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_0.png)


    Math 应用程序无法计算公式——它只是允许在文档中进行公式格式化的工具。


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_1.png)


    伯努利原理在空气动力学中非常重要。


    伯努利数的定义为：


    ```

    e^{-x} = \frac{1}{1} - \frac{B_2}{2!}x^2 + \frac{B_4}{4!}x^4 ...

    ```


    ```

    x - \cot(x) = \frac{B_2}{2!}x^3 + \frac{B_4}{4!}x^5 + \frac{6}{6!}x ...

    ```


    ```

    size 12 color red

    1-(~x over 2)~~cot((x over 2))~~

    (B_0*x^0) over (0)~~~

    (B_2*x^4) over (4)~~~

    (B_4*x^6) over (6)~~dotsaxis

    abs(~x)~~~&pi

    ```

    '
