    点击主工具栏上的“图表”（Chart）按钮可以在绘图区域添加默认柱状图——随后该工具栏上的所有按钮都将被特殊的图表编辑按钮取代。将鼠标悬停在每个按钮上即可显示描述其用途的工具提示。你可以通过点击“编辑图表类型”（Edit
    Chart Type）按钮将默认图表更改为不同的图表或图形，然后从图表类型对话框中显示的选项。


    其他图表编辑按钮允许你调整图例、标题、行、列、外观和数据值。点击窗口空白区域可退出编辑模式并返回标准主工具栏。


    要在 OpenOffice 文档中创建图表，请使用插入（Insert）、对象（Object）、图表（Chart）菜单，然后点击对话框中的创建（Create）按钮——默认图表将添加到当前文档位置。双击此窗口的任何空白区域即可返回主工具栏按钮。


    ![](img/0494b98ec9ddc4515587e9808d73902e_88_0.png)


    上面的截图说明了柱状图及其等效的 3D 图形——两个主标题都已修改。


    导出的图像是位化的——因此它们不包含可编辑对象。


    要保存绘图，点击文件（File）、另存为（Save As），并在另存为对话框中输入文件名称——OpenOffice Draw 的原生格式添加文件扩展名 .odg。你也可以使用文件（File）、导出（Export）来创建多种图像格式的绘图图像，例如“bmp”、“gif”、“wmf”等。


    ## OpenOffice Math 中的公式


    OpenOffice 软件套中的 Math 应用程序允许以严格控制的格式将数学公式插入到文档中。在 OpenOffice Writer 中打开文档后，点击插入（Insert）、对象（Object）、公式（Formula）菜单进入公式模式——窗口底部将出现过一个“命令”（command）区域。


    在命令区域上点击右键，可以在右键菜单中查看一系列预定义的公式控件。选择其中任何一个，或直接在命令区域中输入以构建公式。完成后，点击主窗口以关闭命令。


    在公式模式下，点击工具（Tools）、目录（Catalog）菜单可以找到可以插入公式的数学符号目录。这包括希腊字母，还有一个“特殊”（Special）集合，你可以在其中添加自己的符号。


    目录符号通过命令代码中的名称和 `&` 字符进行引用——在下方示例中，`&x` 和 `&pi` 引用特殊目录符号。注意表达式被包含在大括号内，`~` 波浪号增加了间距。


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_0.png)


    Math 应用程序无法计算公式——它只是允许在文档中进行公式格式化的工具。


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_1.png)


    伯努利原理在空气动力学中非常重要。


    伯努利数的定义为：


    ```

    e^{-x} = \frac{1}{1} - \frac{B_2}{2!}x^2 + \frac{B_4}{4!}x^4 ...

    ```


    ```

    x - \cot(x) = \frac{B_2}{2!}x^3 + \frac{B_4}{4!}x^5 + \frac{6}{6!}x ...

    ```


    ```

    size 12 color red

    1-(~x over 2)~~cot((x over 2))~~

    (B_0*x^0) over (0)~~~

    (B_2*x^4) over (4)~~~

    (B_4*x^6) over (6)~~dotsaxis

    abs(~x)~~~&pi

    ```


    在线工作


    ## 目录


    - 使用 Mozilla Firefox 浏览 | 90

    - 发送和接收电子邮件 | 92

    - 阅读 RSS 订阅 | 94

    - 互联网语音通话 | 96

    - 传输文件 | 98

    - 在线消息 | 100


    第八章


    ## 使用 Mozilla Firefox 浏览


    除了 KDE 的 Konquer 浏览器外，大多数 Linux 发行版都包含了开源的 Mozilla Firefox 浏览器。这款流行的免费浏览器适用于各种平台，并包含许多强大的功能。它由开源社区从原始的
    Netscape 浏览器源代码开发，成为一个非常出色且符合标准的产品。


    在 SUSE Linux 中，点击开始（Start）、互联网（Internet）、浏览器（WebBrowser）、Firefox 来启动网络浏览器。在位置字段中输入
    URL，然后按回车键在浏览器窗口中打开该页面。


