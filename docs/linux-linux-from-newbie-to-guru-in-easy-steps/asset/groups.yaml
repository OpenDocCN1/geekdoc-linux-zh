    ## The Linux desktop: provides the tools that users require in their daily activities.
    It interfaces with the Linux operating system to access and manage files, folders,
    and programs. It provides the integrated OpenOffice suite of applications with
    the ability to save files in a number of formats including Microsoft Office formats.
    The popular desktop includes the Firefox web browser, and Evolution for email,
    calendaring, and contact management.


    - Desktop Icons – Access programs and features on your system by clicking an icon.
    You can add as many icons to your desktop as you like


    ![](img/0494b98ec9ddc4515587e9808d73902e_1_0.png)


    - Desktop Area – Right-click the background to access a menu to create objects:
    clean up the desktop, align icons, or change the background


    - Start Menu – Use the Program, System, and Help menus to access applications
    and tools on your system


    - Quickstart Launcher – Simply click an icon in the Quickstart area to open a
    program


    - Bottom Panel – Displays buttons to re-open minimized applications


    - Quickstart area to re-open minimized applications quickly


    - Workspace switcher – the Linux desktop provides multiple virtual workspaces
    to organize your work. Click the switcher to access the desired workspace


    ## The Linux shell: provides powerful access to the kernel at the heart of the
    operating system to manage files, folders, and programs. It provides multiple
    virtual consoles to control the root level, network configuration, job scheduling,
    running processes, access permissions, user and group administration, and more.
    Shell scripts can easily be created to automate tasks and customize the shell
    environment. Knowing the shell allows users to get the most from Linux.


    ```

