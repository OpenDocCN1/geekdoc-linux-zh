    ![](img/0494b98ec9ddc4515587e9808d73902e_134_2.png)


    ## II. Extending your Linux system


    ### Uninstalling packages


    The package installer that uses the RedHat Package Management (RPM) tool is also
    an uninstaller that can be used to remove applications from your system.


    In SUSE launch the Software Management dialog from the Start, Control Center,
    YaST2 Modules, Software menu. Select “Package Groups” as the Filter and choose
    the application you wish to uninstall from the list of installed packages. For
    instance, to remove the Emacs application that was installed in the previous example
    first select its entry from the Editors menu under the Productivity package group.
    Now uncheck the ticked box to indicate you want to remove it - the tick changes
    to a trash can:


    ![](img/0494b98ec9ddc4515587e9808d73902e_135_0.png)


    | Package | Summary |

    | :--- | :--- |

    | apel | A Portable Emacs Library |

    | aph-emacs | "A Portable Emacs Library" |

    | edition-linux | |

    | emacs | GNU Emacs Base Package |

    | emacs-audex | Emacs Extension (Info) |

    | emacs-info | |

    | emacs-x11 | QEmacs Simple Binary with X |

    | emacs-various | Log Libraries for Basic features |

    | mime-mode | Unicode Extensions for Multiplexing New Emacs Add-on for Editing
    |


    > Notice that the Software Management dialog displays disk usage showing how much
    space your hard drive has.


    Notice that the two other packages that were installed to support Emacs are not
    automatically selected for removal. The ticked box for each one would need to
    be unchecked manually to include them in the uninstallation process. The Check
    Dependencies button at the bottom of the dialog can be used to consider support
    package requirements.


    Click on the Accept button to begin the package removal.


    ...cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_136_0.png)


    Upon completion your Linux system rewrites its internal configuration files to
    exclude the newly installed application and its entry is removed from the Utilities,
    Editor menu:


    ![](img/0494b98ec9ddc4515587e9808d73902e_136_1.png)


    ## II. Extending your Linux system


    ### Downloading packages


    Your distro CDs are the first place to look for extra packages to install on your
    system but many more can be found online via the excellent RPM repository at http://rpmfind.net.
    This busy server is geographically located in France but there is a mirror available
    for US users at http://speakasy.rpmfind.net.


    The database of RPM packages can be searched by category, name, vendor, distributor,
    and creation date to easily find what you want:


    ![](img/0494b98ec9ddc4515587e9808d73902e_137_0.png)


