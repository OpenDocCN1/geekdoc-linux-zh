    # Matching text patterns


    The “grep" command is one of the most useful of all commands. It has many possible
    options but its purpose is simply to display all lines from a text file that contain
    a specified string or pattern.


    | command | description |

    | --- | --- |

    | grep | show all lines that contain a specified pattern |

    | uniq | ignore successive duplicate lines of text |


    A simple grep command can state a string to seek as its first argument and the
    file name as its second argument – hit the Return key and it will display all
    lines containing that string.


    Duplicate successive lines can be removed with the "uniq" command. First pipe
    the text stream from grep to sort – to arrange duplicate lines in succession.
    Pipe those lines through uniq so only unique lines remain:


    ![](img/0494b98ec9ddc4515587e9808d73902e_177_0.png)


    The topic of regular expressions could fill a book by itself – see the grep for
    more details.


