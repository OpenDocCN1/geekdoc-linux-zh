    ## 数组操作


    你可以在 shell 中创建存储多个值的变量，这些变量被称为“数组”。这些变量数组将每个值存储在名为“元素”（element）的唯一独立索引隔中。


    ![](img/0494b98ec9ddc4515587e9808d73902e_223_0.png)


    通过将一对圆括号 "()" 内的空格分隔的值列表赋值给你指定的变量名来创建数组。值可以是数字、文本或两者的混合。


    为了访问存储在数组元素中的值，你必须对它们进行解引用，使用花括号 "{}" 包围变量名和索引。你也可以使用通配符 * 代替数字来访问所有元素：


    ```

    Shell - Konsole

    session Edit Bookmarks Settings

    user> ARR=(a two 3)

    user> ARR[2]=6

    user> echo ${ARR[*]}

    a two 6

    user> echo ${ARR[0]}

    a

    ```


    ![](img/0494b98ec9ddc4515587e9808d73902e_223_1.png)


    这个脚本有效地结合了本章的几个方面：随机数生成、表达式求值、值输出、循环和数组。它通过初始化随机数器创建一个 0–49 的顺序整数数组。接下来，生成的 1–49
    范围内的随机数用于洗牌元素。这意味着数组包含了 1–49 的所有数字，顺序是随机的，且重复任何数字。元素 1–6 的值用于格式化输出：


    ![](img/0494b98ec9ddc4515587e9808d73902e_224_0.png)


    这个高级脚本运行就像一个程序。你可以使用 C 语言创建自己的编译程序，例如 ''gcc'' 来查看它是否已经安装，或者从你的发行版中安装。


    ```

    Shell - Konsole

    Session Edit Bookmarks Settings

    #!/bin/bash

    clear ; RANDOM=`date +%s`      #fill an array with values 0–49

    i=0; while [ $i -lt 50 ];

    do nums[$i]=$i; i=$expr $i + 1; ; done

    # randomize element positions

    i=1; while [ $i -lt 50 ];

    do r=$((RANDOM % 49 + 1)); temp=${nums[$i]}

    nums[$i]=${nums[$r]}; nums[$r]=$temp

    echo -expr $i + 1` ; done

    #display colored header

    echo -e "\e[41;38m" echo -e "\e[1;33m"Your lucky numbers are: "

    echo -ne "\e[44;38m"

    #display the values in elements 1-6

    i=1 ; while [ $i -lt 7 ];

    do echo -ne "${nums[$i]}"

    echo -expr $i + 1` ; done

    echo -e "\e[44;0m\n\n"      #reset bg

    ```

    Shell - Konsole

    Session Edit Bookmarks Settings

    Your lucky numbers are:

    3 10 30 46 21

    user>

    ```


    ## 有用的 Linux 资源


    书中的示例希望证明免费 操作系统以及大多数发行版自带的开源应用程序完全胜任大多数用户的日常需求。


    此外，Linux 在其他操作系统中不存在的功能提供了新的可能性。对于你选择的发行版，有大量的资源帮助你发现更多 Linux。最直观的调用是发行版网站——例如
    SUSE 用户可以检查 opensuse.org 上的邮件列表。


    ![](img/0494b98ec9ddc4515587e9808d73902e_225_0.png)


    可以从 linuxiso.org 下载免费 Linux 发行版的 ISO 镜像。这些可以刻录到 CD-ROM 生成 Linux 发行版安装集。


    大量的 Linux 通用信息可以在 linux.org 网站找到。这包含了许多 Linux 首页、下载和文档。


    关于所有问题，可以在 linuxforum.com 的 Linux 用户、开发者和爱好者论坛寻求。该网站托管了许多关于特定 Linux 主题的论坛，包括故障排除和发行问题。


    你可以在 todays.com 阅读 Linux 的最新进展。这个优秀的网站每天更新全球 Linux 新闻。


    关于 Linux 的有趣文章出现在月刊《Linux Magazine》。可以在 www.linux-mag.com 进行全球订阅，你也可以在那里阅读一些精彩专题文章。


    这些以及更多在线资源让你跟上 Linux 进入桌面操作系统市场的最新创新。它们可以帮助你开发技能，以充分利用这个优秀操作系统的力量和灵活性——Linux 计算愉快！


