- md: "\n# Switching between sessions\n\nYou don’t need to end one session before\
    \ starting another because Linux can support multiple concurrent sessions. This\
    \ means you can quickly switch between sessions that are each using a different\
    \ desktop manager. To start a new session from KDE first select the Start, Switch\
    \ User menu. Notice that the current desktop environment appears checked on a\
    \ sub-menu that provides the user name, desktop manager, screen number and virtual\
    \ terminal number. Click the Start New Session option and the login screen will\
    \ appear with the current session still running.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_143_0.png)\n\
    \nA desktop manager to use for the new session, such as the FVWM desktop manager\
    \ used on the previous page, then log in to start the new session. This session\
    \ will use the next available screen and virtual terminal – in this case 1, vt8.\n\
    \nTo switch between sessions hold down the Ctrl and Alt keys and press the F key\
    \ with the same vt number of the session you want. To return to the KDE session\
    \ here press Ctrl+Alt+F7.\n\nNow when you choose the Start, Switch User menu you\
    \ can see the session details of both running sessions:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_143_1.png)\n\
    \nYou can switch to the FVWM session by clicking its session menu, as shown above,\
    \ or press the Ctrl+Alt+F8 keys. Close any running session by choosing to Log\
    \ Out then selecting the option to End Current Session.\n\n> HOT TIP The Lock\
    \ Session menu simply launches a screensaver and requires a password to resume\
    \ the session – the Lock Current & Start New Session menu combines the Lock Session\
    \ and Start New Session menus.\n\n## Getting started with the shell\n\nThis chapter\
    \ introduces the Linux shell and illustrates how to interact directly with the\
    \ core of the operating system. It describes how to customize the shell prompt\
    \ and explains the different system run levels. It also demonstrates how to use\
    \ shell variables and how to launch applications from the shell.\n\n## Covers\n\
    \n- What is the shell? | 144\n- Becoming the Super User | 146\n- Customizing the\
    \ shell prompt | 148\n- Changing the run level | 150\n- Revealing shell variable\
    \ values | 152\n- Launching applications from the shell | 154\n\n## What is the\
    \ shell?\n\nAt the very heart of the Linux operating system is a core series of\
    \ machine instructions referred to as the “kernel” – this is a technical program\
    \ that is not user-friendly, mainly designed to communicate with electronic components.\
    \ A Linux shell is a facility that allows the user to communicate directly with\
    \ the kernel in a human readable form. It translates command line instructions\
    \ so they can be processed.\n\nMany Linux distros include several shells that\
    \ offer different features. The default Linux shell program, however, is the Bourne\
    \ Again Shell (BASH), which is an updated version of the original Bourne Shell\
    \ found in the Unix operating system.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_145_0.png)\n\
    \nOptions are not standardized–the same option can have different meanings to\
    \ different commands.\n\nThe shell understands a large number of commands and\
    \ has a number of “options” that modify their behavior – usually these are prefixed\
    \ by a hyphen. Many also accept “arguments” that provide data to be used by the\
    \ command. The typical syntax of a shell command looks like this:\n\n```\ncommand\
    \ -option argument\n```\n\nShell commands can be executed at a prompt in text\
    \ interface mode or in a shell terminal window, such as the KDE Konsole application\
    \ on a Linux graphical desktop interface. In SUSE Linux select the Start, System,\
    \ Terminal menu to launch Konsole, or Start, Run Command “konsole”.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_145_1.png)\n\
    \nWhen the shell window is launched it displays the default bash command prompt\
    \ and places the cursor after the prompt, ready to receive a command. The default\
    \ prompt comprises the current user name and host domain name, separated by an\
    \ \"@\" character.\n\n| | |\n|---|---|\n| whoami | show the current effective\
    \ user name |\n| hostname | show the host domain name |\n| type | state program\
    \ location or builtin command |\n| clear | clear the shell window |\n| exit |\
    \ logout of the shell |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_0.png)\n\
    \nCommands use lower case only - in upper case the command will not be recognized.\n\
    \nYou can confirm the current user and domain name at any time with the whoami\
    \ and hostname commands – just type the command at a shell prompt and hit the\
    \ Return key.\n\nSome commands call upon individual programs that reside on your\
    \ system whereas other commands are built into the shell itself – these are known\
    \ as \"shell builtin\" commands. You can determine whether or not a command is\
    \ a builtin with the type command. If that command calls upon a program the result\
    \ will reveal its location on your system. The example below reveals that the\
    \ exit command, used to logout of the shell, is a builtin but the clear command\
    \ calls upon a program in the /usr/bin directory:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_1.png)\n\
    \nType a -help option after any command, then hit Return, to see a list of options\
    \ for that command.\n\n```\nSession Edit View Bookmarks Settings Help\nmike@linux:->\
    \ whoami\nmike\nmike@linux:-> hostname\nlinux\nmike@linux:-> type exit\nexit is\
    \ a shell builtin\nmike@linux:-> type clear\nclear is hashed (/usr/bin/clear)\n\
    mike@linux:-> \n```\n\n## Becoming the Super User\n\nA regular user can call upon\
    \ many shell commands but some are only available to the privileged root user.\
    \ These restricted commands typically perform system administration functions\
    \ to which regular users should not be allowed access in a multiuser environment.\
    \ On a home Linux system, however, you can easily assume super user status – providing\
    \ you the root password.\n\n| | |\n|---|---|\n| su - | login as the root super\
    \ user |\n| logname | print the user login name |\n| pwd | show the current directory\
    \ address |\n\nAt a regular shell user prompt type the su command, followed by\
    \ a space, then the -l option. Hit the Return key and the shell will request the\
    \ root password. A new prompt will appear that you now have super user status.\
    \ Use the whoami command at any time to determine whether you are working as regular\
    \ user or as the root user. Use the exit command to log out from the super user\
    \ back into the regular user.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_147_0.png)\n\
    \nThe su command without the -l option maintains the location in the existing\
    \ working directory – it does not change the root user's home directory and, more\
    \ importantly, it does not set the search path to utilize the full root path.\
    \ This is almost always undesirable when you want to assume root super user status\
    \ so to be sure to always use the -l option with the su command.\n\nNotice how\
    \ the semicolon is used here to execute multiple commands at once – the results\
    \ appear on separate lines.\n\n```\nSession Edit View Bookmarks Settings Help\n\
    mike@linux:~> su -l\nPassword: ****\nlinux:~ # whoami;logname\nroot\nmike\nlinux:~\
    \ # exit\nlogout\nmike@linux:~> \n```\n\nBesides knowing your identity in the\
    \ shell it is also useful to know your current location on the system. Type the\
    \ pwd command at any time to print the (current) working directory.\n\nWhen a\
    \ regular user first into the shell the working directory is, by default, that\
    \ user's home directory. However, when a super user first into the shell, using\
    \ the su -l command, the working directory is, by default, the root user's home\
    \ directory:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_148_0.png)\n\n```\nSession\
    \ Edit View Bookmarks Settings Help\nmike@linux:~> whoami;pwd\nmike\n/home/mike\n\
    mike@linux:~ su -l\nPassword: *****\nlinux:~ # whoami;pwd\nroot\n/root\nlinux:~\
    \ # \n```\n\nThe su (switch user) command enables you to log in as any user –\
    \ providing you know their password. At the prompt type “su” followed by a space,\
    \ a hyphen and another space, type the user's name. You are then asked to enter\
    \ their password to login. Similarly, this method can be used to login as the\
    \ super user by switching to the root user account.\n"
  mdcn: "\n\n# 会话间的切换\n\n你不需要在启动另一个会话之前结束当前会话，因为 Linux 支持多个并发会话。这意味着你可以快速在运行不同桌面管理器的会话之间切换。要从\
    \ KDE 启动新会话，首先选择“开始”（Start）、“切换用户”（Switch User）菜单。注意，当前桌面环境显示在一个子菜单中，该子菜单提供了用户名、桌面管理器、屏幕编号和虚拟终端号。点击“新建会话”（Start\
    \ New Session），登录界面将会出现，此时当前会话仍在运行。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_143_0.png)\n\
    \n选择新会话使用的桌面管理器（例如上一页使用的 FVWM 桌面管理器），然后登录以启动新会话。此会话将使用下一个可用屏幕和虚拟终端——在这种情况下是 1，vt8。\n\
    \n要在会话之间切换，按住 Ctrl 和 Alt 键，并按下与目标会话相同 vt 号的 F 键。返回 KDE 会话请按下 Ctrl+Alt+F7。\n\n\
    现在，当你选择“开始”、“切换用户”菜单时，你可以看到两个运行会话的详情：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_143_1.png)\n\
    \n你可以点击其会话菜单切换到 FVWM 会话，或按下 Ctrl+Alt+F8。通过“注销”（Log Out）然后选择“结束当前会话”（End Current\
    \ Session）来关闭任何运行中的会话。\n\n> 提示：锁定会话（Lock Session）菜单仅启动屏幕保护程序并需要密码恢复会话——新建会话菜单结合了锁定会话和新建会话功能。\n\
    \n## 开始使用 shell\n\n本章介绍了 Linux shell，并说明了如何与操作系统的内核进行交互。描述了如何自定义 shell 提示符并解释了不同的运行级别。还演示了如何使用\
    \ shell 变量以及如何从 shell 启动应用程序。\n\n## \n\n- 什么是 shell? | 144\n- 成为超级用户 | 146\n-\
    \ 自定义 shell 提示符 | 148\n- 更改运行级别 | 150\n- 显示 shell 变量值 | 152\n- 从 shell 启动应用程序\
    \ | 154\n\n## 什么是 shell?\n\nLinux 操作系统的最核心是一系列机器指令，被称为“内核”（kernel）——这是一个对用户友好的程序，主要用于与电子组件通信。Linux\
    \ shell 是一种允许用户以人类可读的形式与内核通信的设施。它将命令行指令转换为可处理的形式。\n\n许多 Linux 发行版包含了提供不同功能的 shell。然而，默认的\
    \ Linux shell 程序是 Bourne Again Shell (BASH)，它是 Unix 操作系统原始 Bourne Shell 的更新版本。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_145_0.png)\n\n选项并不是标准的——同一个选项对于不同的命令有不同的含义。shell\
    \ 理解大量命令，并有很多“选项”（options）可以修改它们的行为——这些选项通常以连字符开头。许多命令还接受“参数”（arguments），为命令提供数据。shell\
    \ 命令的典型语法如下：\n\n```\ncommand -option argument\n```\n\nshell 命令可以在文本界面的提示符处或 shell\
    \ 终端窗口中执行，例如 Linux 图形桌面上的 KDE Konsole 应用程序。在 SUSE Linux 中，选择“开始”、“系统”、“终端”菜单启动\
    \ Konsole，或选择“开始”、“运行命令”、“konsole”。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_145_1.png)\n\
    \n当 shell 窗口启动时，它显示默认 bash 提示符并将光标放在提示符后准备接收命令。默认提示符包含用户名和主机名，由“”字符分隔。\n\n| |\
    \ |\n|---|---|\n| whoami | 显示当前用户名 |\n| hostname | 显示主机名 |\n| type | 显示程序位置或内置命令\
    \ |\n| clear | 清空 shell 窗口 |\n| exit | 退出 shell |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_0.png)\n\
    \n命令仅使用小写——大写命令将无法被识别。\n\n你可以随时通过 whoami 和 hostname 命令确认当前用户和主机名——只需在 shell 提示符输入命令并按回车键。\n\
    \n某些命令调用位于系统中的单独程序，而另一些命令内置在 shell 之中——这些被称为“shell 内置命令”（shell builtin）。你可以通过\
    \ type 命令判断命令是否为内置。如果该命令调用了程序，结果将显示它在系统中的位置。下面的示例显示，用于退出 shell 的 exit 命令是内置的，但\
    \ clear 命令调用了 /usr/bin 目录下的程序：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_1.png)\n\
    \n在任何命令后输入 -help 选项，然后按回，查看该命令的选项列表。\n\n```\nSession Edit View Bookmarks Settings\
    \ Help\nmike@linux:-> whoami\nmike\nmike@linux:-> hostname\nlinux\nmike@linux:->\
    \ type exit\nexit is a shell builtin\nmike@linux:-> type clear\nclear is hashed\
    \ (/usr/bin/clear)\nmike@linux:-> \n```\n\n## 成为超级用户\n\n普通用户可以调用许多 shell 命令，但某些命令只有特权\
    \ root 用户才能使用。这些受限命令通常执行系统管理功能，在多用户环境中不应允许普通用户访问。然而，在家用 Linux 系统上，只要提供 root 密码，你可以轻松获得超级用户状态。\n\
    \n| | |\n|---|---|\n| su - | 以 root 超级用户登录 |\n| logname | 打印用户名 |\n| pwd | 显示当前目录地址\
    \ |\n\n在普通 shell 用户提示符处输入 su 命令，后面跟着空格，然后是 -l 选项。按回车键，shell 将请求 root 密码。新提示符表示你现在拥有超级用户状态。随时使用\
    \ whoami 命令确定你是在以普通用户还是 root 用户身份工作。使用 exit 命令从超级用户回到普通用户。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_147_0.png)\n\
    \n不带 -l 的 su 命令会保持当前的工作目录——它不会更改 root 家目录，更重要的是，它没有设置搜索路径以利用 root 路径。当你想要假设超级用户状态时这通常是不希望的，因此在使用\
    \ su 命令时务必始终使用 -l 选项。\n\n注意这里如何使用分号在此执行多个命令——结果分行显示。\n\n```\nSession Edit View\
    \ Bookmarks Settings Help\nmike@linux:~> su -l\nPassword: ****\nlinux:~ # whoami;logname\n\
    root\nmike\nlinux:~ # exit\nlogout\nmike@linux:~> \n```\n\n除了知道 shell 中的身份，知道自己在系统中的位置也是用的。随时输入\
    \ pwd 命令打印当前工作目录。\n\n当普通用户进入 shell 时，默认工作目录是该用户的家目录。然而，当超级用户使用 su -l 命令进入 shell\
    \ 时，默认工作目录是 root 家目录：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_148_0.png)\n\
    \n```\nSession Edit View Bookmarks Settings Help\nmike@linux:~> whoami;pwd\nmike\n\
    /home/mike\nmike@linux:~ su -l\nPassword: *****\nlinux:~ # whoami;pwd\nroot\n\
    /root\nlinux:~ # \n```\n\nsu（切换用户）命令允许你登录任何用户——只要你知道他们的密码。在提示符处输入“su”后跟一个空格、一个连字符和一个空格，输入用户名。然后会被要求输入密码以登录。同样，这种方法也可以通过切换到\
    \ root 账户来作为超级用户登录。\n\n"
