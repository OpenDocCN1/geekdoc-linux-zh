    the track numbers and playing duration times listed in the tracks window. Under
    the Title heading double-click on a track and an input window will open so you
    can type that track''s title.


    When all track titles are complete add any other artist details and comments then
    click OK to save.


    Click the Extras button then select the option to Configure KsCD to open the configuration
    dialog. Under Settings & Behavior you can change the display colors and other
    simple options. The option to “Show in system tray” is checked by default so closing
    the KsCD window still leaves the application running. Click the system tray icon
    to open the player window once more.


    Kaffeine Player can also be used to play Audio CDs – select the AudioCD option
    in the drop-down Playlist menu.


