    This chapter demonstrates the intrinsic ability to execute intelligent instructions
    at the Linux shell prompt. It shows how to develop multiple instructions into
    a script that can accomplish tasks a single command cannot. It illustrates how
    to perform loops and conditional branching with variables, input, and output.


