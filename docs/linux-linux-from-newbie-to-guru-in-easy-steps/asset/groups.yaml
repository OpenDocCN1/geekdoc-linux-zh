    Real Player 不会立即播放流媒体内容，而是先缓冲部分内容。你可以在“播放”选项卡中设置缓冲区大小，以适应你的系统和连接。


    ![](img/0494b98ec9ddc4515587e9808d73902e_126_3.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_126_4.png)


    10. 播放声音和视频 125


    # 播放音频 CD


    KDE Simple CD (KsCD) 是标准的 Linux音频 CD 播放器。它的界面具有你在真实 CD 播放器上看到的熟悉的控制按钮，外还有四个额外功能的按钮。


    点击数字计数器可以循环切换显示的时间——播放时间、剩余时间以及曲目和磁盘已通过的时间：


    ![](img/0494b98ec9ddc4515587e9808d73902e_127_0.png)


    启动 KsCD，它会自动开始播放驱动器中 CD 的第 1 Track。


    如果有 CD 数据库，显示将显示艺术家和曲目详情——或者你可以创建自己的。点击 CDDB 按钮启动 CD 编辑器，并在曲目窗口查看出的曲目编号和播放时长。在“标题”栏下双击某条曲目，将打开一个输入窗口，你可以输入该曲目的标题。


    当所有曲目标题填写完成后，添加任何其他艺术家详情和注释，然后点击“确定”保存。


    点击“额外”按钮，然后选择“配置 KsCD”选项打开配置对话框。在“设置与行为”下，你可以更改显示颜色和其他简单选项。默认勾选“在系统托盘中显示”，因此关闭
    KsCD 窗口后应用程序仍在运行。点击系统托盘图标再次打开播放器窗口。


    Kaffeine Player 也可以播放音频 CD——在下拉菜单“播放列表”中选择“AudioCD”选项。


    ![](img/0494b98ec9ddc4515587e9808d73902e_127_1.png)


    # ...续上


    ![](img/0494b98ec9ddc4515587e9808d73902e_128_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_128_1.png)


    如果你看不到系统托盘，可能是不小心删除了它——右键点击面板并选择“添加小部件”、“系统托盘”。


    KsCD 系统托盘图标有一个右键菜单，可控制播放器——播放、暂停和停止、跳过曲目、推出 CD、恢复播放器窗口或完全退出应用程序。


    ![](img/0494b98ec9ddc4515587e9808d73902e_128_2.png)


    10. 播放声音和视频 127


    # 刻录 CD 和 DVD


    如果你的系统有 CD 刻录机或 DVD 刻录机，你可以使用 K3b 应用程序轻松刻录自己的磁盘。要刻录 CD，启动 K3b 然后点击“刻录 CD”按钮：


    某些 CD 有复制保护：


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_129_1.png)


    将 CD 复制对话框，你可以在其中选择要复制的 CD 驱动器。你可以在对话框中配置其他选项，例如选择 K3b 写入数据的临时目录。通常你只需接受默认。当你对选择满意时，点击对话框中的“开始”按钮从
    CD 复制到临时目录。


    如果你下载了磁盘镜像 (.iso)，例如 Linux 发行版使用的镜像，应使用“刻录镜像”按钮创建一个可用的 CD。


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_2.png)


    CD 复制对话框出现，进度条会在每条曲目复制时向你提供信息。当所有曲目复制完成后，K3b 会推出 CD 并要求你插入空白磁盘。


    复制对话框将变为写入模式，逐条将每个曲目从临时目录写入磁盘。这是一个漫长的过程，但完成后，K3b 会播放一段叮咚声通知你新磁盘已就绪。


    ...续


    ![](img/0494b98ec9ddc4515587e9808d73902e_130_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_3.png)


    10. 播放声音和视频 129


    # 录制语音


    SUSE Linux 包含一个名为 KRecord 的趣味录音应用程序。它与 Windows 中的“录音机”类似，但带有额外功能。


    在“选项”菜单下，你可以选择“采样率”和“输入电监”来查看你的声音波形：


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_0.png)


    KRecord 将你的声音记录在内存中——只有在你保存缓冲区时才会创建文件。因此你可以反复尝试直到对结果满意，然后保存为文件。


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_1.png)


    你可以将非常简短的语音作为邮件附件发送，但 WAV 文件会迅速变得巨大——将采样率调到低水平以缩小 WAV 文件大小。


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_2.png)


    录制语音时，插上麦克风，然后点击红色“录制”按钮并对着麦克风说话。完成后，点击录制按钮右侧的“停止”按钮。如所示点击“播放”按钮，通过扬声器回放你的信息。


    如果你想查看输入电平，选择“选项”、“输入电平”对话框，然后点击“M”（监视）工具栏图标开启。尝试各种选项以获得最佳结果，然后将你的语音保存为 WAV 格式。


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_3.png)


    # 扩展你的 Linux 系统


    本章说明了如何在 Linux 系统上安装和删除应用程序，包括通过发行版 CD 和通过互联网。它还演示了如何切换桌面管理器以在不同的图形环境下运行 Linux。


    | 任务 | 页码 |

    | :--- | :--- |

    | 安装组合包 | 132 |

    | 卸载包 | 134 |

    | 下载包 | 136 |

    | 安装已下载包 | 138 |

    | 切换桌面管理器 | 140 |

    | 在会话间切换 | 142 |


    # 安装组合包


    大多数 Linux 发行版包含了红帽包管理器 (RPM) 工具，简化了额外应用程序的安装。这是 Windows 中“添加/删除程序”功能的对应物，位于系统控制中心的某个菜单中。在
    SUSE 中，可以通过“开始”、“控制中心”、“YaST2 模块”、“软件”、“软件管理”启动：


    ![](img/0494b98ec9ddc4515587e9808d73902e_133_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_133_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_133_2.png)


    软件管理向我们展示了许多展开菜单，让你选择要安装的应用程序。例如，要向系统添加“emacs”文本编辑器（如果尚未安装），选择“软件包组”作为过滤器，然后展开“生产力”、“编辑器”、“Emacs”菜单，如所示。


    点击“接受”按钮开始安装过程。如果所选应用程序需要安装支持包，将弹出一个对话框请求批准——点击“继续”按钮批准该建议。


