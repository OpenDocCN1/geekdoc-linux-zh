    \ |\n\n一个或两个小文本文件可以轻松放入单个窗口，因此可以看到整个文本。然而，较大的文件会超过单个窗口的空间，因此你只能看到文本的最后部分。解决方案是通过“|”字符将文本流发送到“less”命令。这意味着文本从开始每次显示一个屏幕：\n\
