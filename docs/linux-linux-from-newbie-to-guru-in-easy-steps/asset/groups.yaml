    This illustration depicts typical standard directories in Linux - the purpose
    of each directory is described on the following pages.


    Do not confuse the "/" root directory with its "root" sub-directory.


    ![](img/0494b98ec9ddc4515587e9808d73902e_56_0.png)


    5. Touring the file structure 55


    ## Standard sub-directories


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_0.png)


    ### /bin

    Contains small executable programs (binaries) which are often considered to be
    part of the operating system itself – but they aren''t really. For instance, when
    you type the ls command at a prompt, to list the contents of a directory, Linux
    executes the ls that is located in the /bin directory. This directory is roughly
    equivalent to the C:\Windows directory in Windows.


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_1.png)


    ### /sbin

    Contains executable system programs (binaries) that are only used by the root
    superuser and by Linux when the system is booting up or performing system recovery
    operations. For instance, the clock program that maintains the system time when
    Linux is running is located in the /bin directory. This directory is roughly equivalent
    to the C:\Windows\system directory in Windows.


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_2.png)


    ### /lib

    Contains binary library files which are used by the executable programs in the
    /bin and /sbin directories. These shared libraries are particularly important
    for booting the system and executing commands within the root file system. They
    are roughly equivalent to the DLL libraries in Windows but are not scattered around
    the system. Having a specific directory for support libraries avoids the common
    problem in Windows when multiple libraries are installed and the system becomes
    confused about which to use.


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_3.png)


    ### /dev

    Contains special file system entries which represent devices that are attached
    to the system. These allow programs access to the device drivers which are essential
    for the system to function properly – although the actual driver files are located
    elsewhere. For instance, typically the entry /dev/fd0 represents the floppy drive
    and the entry /dev/cdrom0 represents the CD drive.


    ### /boot

    Contains the Linux kernel – the heart of the operating system. Many people incorrectly
    use the term “operating system” to refer to the Linux environment but, strictly
    speaking, the kernel is the operating system. It is the program that controls
    access to all the hardware devices your computer supports and allows multiple
    programs to run concurrently and share that hardware. Typically the program is
    called “vmlinuz” – other programs complementing the kernel are located in /bin
    and /sbin directories.


    ### /etc

    Contains system configuration files storing information about everything from
    user passwords and system initialization to screen resolution settings. All these
    are plain text files that can be viewed in any text editor, such as KEdit – there
    should never be any binary files in this directory. They control all configuration
    settings which are not user-specific. The files in this directory are roughly
    equivalent to the combination of .ini files and the Registry entries found in
    the Windows operating system.


    ### /proc

    Contains special files that relay information to and from the kernel. The hierarchy
    of “virtual” files within this directory represent the current state of the kernel
    – allowing applications and users to peer into the kernel’s view of the system.
    For instance, at a command prompt type


    ```

    more /proc/cpuinfo

    ```


    to see information about your computer’s processor/s. Similarly, typing the command


    ```

    more /proc/meminfo

    ```


    reveals information about your system’s current memory usage. Unlike binary and
    text files, most virtual files are listed as zero bytes in size and are time stamped
    with the current date and time. This reflects the notion that they are constantly
    updating.


    ### /mnt

    Contains sub-directories that act as gateways to temporarily mounted file systems.
    This is the default location where most distro attach mounted file systems to
    the Linux directory tree. Typically, when peripheral drives have been mounted,
    /mnt/cdrom directory lets you access the CD drive and /mnt/floppy lets you access
    the floppy disk.


    ### /usr

    Contains user-directories which include programs, libraries, and documentation.
    This directory is roughly equivalent to the C:\Windows directory in Windows. The
    /usr/local sub-directory is used for software installed locally by the user.


    ### /var

    Contains variable files that change frequently as the system operates. This includes
    logs, spool files, and temporary files. The system administrator can type the
    following to see:


    ```

    /var/log

    ```


    ### /home

    Contains sub-directories for each user. Each user has their own directory here
    where they can store personal files. This is roughly equivalent to the C:\Users
    directory in Windows


    ### /tmp

    Contains temporary files that are created by programs and users. These are usually
    deleted periodically or upon system reboot. This directory is roughly equivalent
    to the C:\Temp directory.


    ### /root

    This is the home directory for the root user. It is restricted from regular users
    for security reasons.


    ### /initrd

    Contains only a file that is used during the boot process. Removing this directory
    will leave the computer unable to boot.


    ### /opt

    Contains nothing initially, but this directory provides a special area where large
    static application packages can be installed. A package placing files in /opt
    creates a sub-directory bearing the same name as the package. For instance, “example”
    is the name of a particular package in the /opt directory, then all its files
    could be placed within sub-directories like /example/bin, /example/man, and so
    on. The entire application can be easily removed by deleting the /opt/example
    directory.


    ## Navigating with File Manager


    To graphically view the standard sub-directories within the root directory launch
    the File Manager, type a / in the location field and hit Return.


    ![](img/0494b98ec9ddc4515587e9808d73902e_61_0.png)


    Notice in the screenshot that the icon of the sub-directory called /root includes
    a lock graphic – indicating that it is not accessible to regular users. To have
    full accessibility launch the File Manager application from Start, System, File
    Manager, File Manager – Super Mode. This emulates the root superuser and allows
    greater control of the file system.


    ![](img/0494b98ec9ddc4515587e9808d73902e_61_1.png)


    Go to the / location and notice that the /root directory is no longer locked.
    Click the View menu, then select the Folder Icons Reflect Contents option to usefully
    mark the folder icons with graphics that indicate their contents.


    The icon size in the right-hand pane can be adjusted by clicking the +/- "zoom"
    buttons on the toolbar. Alternatively click the View menu, then select the Icon
    Size option and choose one of the predetermined icon sizes.


    The contents of the right-hand pane can be presented in a variety of ways by holding
    the mouse on either of the "view" buttons and selecting one screenshot of the
    menu options.

    '
  mdcn: '


    此图描绘了 Linux 中典型的标准目录 - 每个目录的用途将在接下来的页面中描述。


    请不要将 "/" 根目录与其 "root" 子目录混淆。


    ![](img/0494b98ec9ddc4515587e9808d73902e_56_0.png)


    5. 游览文件结构 55


    ## 标准子目录


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_0.png)


    ### /bin

    包含小型可执行程序（二进制文件），这些程序通常被认为是操作系统本身的一部分——但实际上并非如此。例如，当你在提示符输入 `ls` 命令来列出目录内容时，Linux
    会执行位于 /bin 目录下的 `ls`。该目录大致相当于 Windows 中的 C:\Windows 目录。


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_1.png)


    ### /sbin

    包含可执行的系统程序（二进制文件），这些程序仅供 root 超用户以及 Linux 在系统启动或执行系统恢复操作时使用。例如，在 Linux 运行时维护系统时间的时钟程序位于
    /bin 目录。该目录大致相当于 Windows 中的 C:\Windows\system 目录。


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_2.png)


    ### /lib

    包含二进制库文件，这些文件被 /bin 和 /sbin 目录中的可执行程序使用。这些共享库对于启动系统和在根文件系统中执行命令尤为重要。它们大致相当于 Windows
    中的 DLL 库，但它们不会散落在系统的各个各处。通过为支持库设置一个特定目录，可以避免 Windows 中常见的问题，即安装了多个库后，系统对应该使用哪一个感到混乱。


    ![](img/0494b98ec9ddc4515587e9808d73902e_57_3.png)


    ### /dev

    包含特殊文件系统节点，它们代表连接到系统的设备。这些节点允许程序访问设备驱动程序，驱动程序对于系统的正常运行至关重要——尽管实际的驱动文件位于其他地方。例如，通常节点
    /dev/fd0 代表软盘驱动器，节点 /dev/cdrom0 代表 CD 驱动器。


    ### /boot

    包含 Linux 内核——操作系统的核心。许多人错误地使用“操作系统”一词来指代 Linux 环境，但严格来说，内核才是操作系统。它是控制你的计算机支持的所有硬件设备访问的程序，并允许多个程序并发运行并共享这些硬件。通常该程序被称为“vmlinuz”——用于内核内核的其他程序位于
    /bin 和 /sbin 目录。


    ### /etc

    包含系统配置文件，存储了从用户密码、系统初始化到屏幕分辨率设置的所有信息。这些都是纯文本文件，可以在任何文本编辑器（如 KEdit）中查看——此目录中不应包含任何二进制文件。它们控制着所有非用户特有的配置设置。该目录中的文件大致相当于
    Windows 操作系统中 .ini 文件和注册表项的组合。


    ### /proc

    包含与内核之间传递信息的特殊文件。该目录内“虚拟”文件的层次结构代表内核的当前状态——允许应用程序和用户窥视内核对系统的视图。例如，在命令提示符输入


    ```

    more /proc/cpuinfo

    ```


    查看有关你计算机处理器的信息。同样，输入命令


    ```


    more /proc/meminfo

    ```


    会显示系统的内存使用情况。


    ### /mnt

    包含作为临时挂载系统网关的子目录。这是挂载文件系统的默认位置。通常驱动器挂载后，mnt/cdrom 让你访问 CD 驱动器，mnt/floppy 访问软盘。


    ### /usr

    包含程序、库文件和文档的用户目录。该目录大致相当于 Windows 中的 C:\Windows 目录。usr/local 用于本地安装的软件。


    ### /var

    包含随系统运行而频繁变化的文件。这包括日志、打印队列和临时文件。系统管理员可以使用以下命令查看：


    ```

    /var/log

    ```


    ### /home

    包含每个用户的子目录。每个用户在这里都有自己的目录来存储个人文件。这大致相当于 Windows 中的 \Users


    ### /tmp

    包含程序和用户创建的临时文件。这些文件通常会定期删除或在系统重启时删除。该目录大致相当于 Windows 中的 \Temp


    ### /root

    这是 root 用户的家目录。出于安全考虑，对普通用户限制。


    ### /initrd

    仅包含一个启动过程中使用的文件。删除此目录会导致计算机无法启动。


    ### /opt

    最初为空，但该目录提供了一个安装大型应用程序包的特殊区域。在 /opt 安装包会创建一个与包同名的子目录。例如，“example”是 /opt 目录中的某个包，那么它的所有文件都可以放置在
    /example/bin、/example/man 等目录下。通过删除 /opt/example 目录可以轻松移除整个应用程序。


    ## 使用文件管理器导航


    要可视化查看根目录下的标准目录，启动文件管理器，在位置字段输入 / 并按回车。


    ![](img/0494b98ec9ddc4515587e9808d73902e_61_0.png)


    注意截图，root 子目录的图标包含锁图形——表示普通用户无法访问。要获得完全访问权限，从开始->系统->文件管理器->超级模式启动文件管理器。这模拟了 root
    超用户，并允许对文件系统进行更大的控制。


    ![](img/0494b98ec9ddc4515587e9808d73902e_61_1.png)


    回到 / 位置，注意到 /root 目录不再锁定。点击查看菜单，然后选择“文件夹图标反映内容”选项，用图形标记文件夹图标非常有帮助。


    右侧面板的图标大小可以通过点击工具栏上的 +/- “缩放”按钮来调整。或者点击查看菜单，然后选择“图标大小”选项并选择一个预设的图标大小。


    右侧面板的内容可以用多种方式呈现，只需按住任一个“视图”按钮并选择菜单选项的截图。


    '
