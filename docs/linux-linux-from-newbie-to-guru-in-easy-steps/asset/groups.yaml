    Session Edit View Bookmarks Settings Help\nmike@linux:~> su -l\nPassword: ****\n\
    linux:~ # whoami;logname\nroot\nmike\nlinux:~ # # exit\nlogout\nmike@linux:~>\
    \ whoami\nmike\nmike@linux:~> \n```"
  - '[PAGE 148]


    Besides knowing your working identity in the shell it is also useful to know your
    current location on the system. Type the pwd command at any time to print the
    (current) working directory.


    When a regular user first logs into the shell the working directory is, by default,
    that user''s home directory. However, when a super user first logs into the shell,
    using the su -l command, the working directory is, by default, the root user''s
    home directory:


    ![](img/0494b98ec9ddc4515587e9808d73902e_148_0.png)


    ```

    mike@linux:~ - Shell - Konsole

    Session Edit View Bookmarks Settings Help

    mike@linux:~ whoami;pwd

    mike

    /home/mike

    mike@linux:~ su -l

    Password: *****

    linux:~ # whoami;pwd

    root

    /root

    linux:~ # ██

    ```


    The su command without the -l option maintains the location in the existing working
    directory – it does not change the root user''s home directory and, more importantly,
    it does not set the search path to utilize the full root path. This is almost
    always undesirable when you want to assume root super user status so to be sure
    to always use the -l option with the su command.


    The su (switch user) command enables you to log in as any user – providing you
    know their password. At the prompt type “su” followed by a space, a hyphen and
    another space, type the user''s name. You are then asked to enter their password
    to login. Similarly, this method can be used to login as the super user by switching
    to the root user account.'
- md: "\n## Customizing the shell prompt\n\nWhenever a user logs into a shell, Linux\
    \ looks for a hidden configuration file called .bashrc which is located in user’s\
    \ home directory. This file determines the behavior of the shell and may be edited\
    \ to customize the shell to your preference. It is especially useful to edit this\
    \ file to customize the appearance of the shell prompt to a style and color of\
    \ your liking.\n\nTo find this file with Konqueror, navigate to your home directory,\
    \ then select the View, Show Hidden Files. Now open the .bashrc file with any\
    \ text editor, such as KWrite, to edit its contents. At the bottom of the file\
    \ add this code:\n\n```bash\nif [ \"basename $SHELL\" = \"bash\" ];\nthen  export\
    \ PS1=\"\\e[34m]user> \\e[0m\"\nfi\n```\n\nThe code first checks that the shell\
    \ is indeed the bash shell, then attempts to export new configuration settings\
    \ for the shell prompt (PS1). Backslashes are needed to escape some of the characters\
    \ from recognition. The ANSI color value 34 writes the prompt “user>” in blue\
    \ and the value 0 writes everything else in the default shell window text color\
    \ – typically black.\n\nSave the file to apply the changes, then open a shell\
    \ window to reveal the new user prompt style and color:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_149_0.png)\n\
    \nThe first line uses the tick character (’) – not an apostrophe. This can be\
    \ found on the keyboard above the Tab key.\n\nANSI is an acronym for the American\
    \ National Institute – see www.ansi.org.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_149_1.png)\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_149_2.png)\n\ncont'd\n\nThe root user\
    \ prompt can also be customized to your preference to be distinct from the regular\
    \ user prompt by editing, or creating a new, hidden \".bashrc\" file in the root\
    \ user's home directory. This location is inaccessible to a regular user, so first\
    \ use the su -l command in the shell to assume super user status.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_0.png)\n\
    \nUse the F8 key to toggle the visibility of hidden files in the KWrite Open dialog.\
    \ Now type \"kwrite\" at the prompt and hit Return to launch the KWrite text editor\
    \ with root access privileges. This allows you to navigate to the /root directory\
    \ and open, or create, a .bashrc file. At the bottom of the file add this code:\n\
    \n```bash\nif [ \"basename $SHELL\" = \"bash\" ]\nthen\n    export PS1=\"\\e[31m]\
    \ root>\\e[0m\"\nfi\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_1.png)\n\
    \nRemember the period at the start of the file - the file must be named \".bashrc\"\
    \ exactly. This is similar to the code applied for the user prompt but here the\
    \ ANSI color value writes \"root>\" in red. Save the file to apply the changes,\
    \ then open a shell window to reveal the new root prompt style and color:\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_150_2.png)\n\nPossible ANSI color values\
    \ are black(30), red(31), green(32), yellow(33), blue(34), magenta(35), cyan(36)\
    \ and white(37).\n\n## Changing the run level\n\nThe Linux operating system can\
    \ exist in any one of several numbered “run level” states. Each run level number\
    \ describes the level of services that have been initialized and are running.\n\
    \n| Run level | Description |\n|:---|:---|\n| 0 | Halt – at this level the system\
    \ is currently in the process of shutting down |\n| 1 | Single User – little more\
    \ than a single console with almost all other services disabled. Typically used\
    \ for maintenance, such as recovery from hack attacks or repair of disk corruption\
    \ |\n| 2 | Basic multiuser – most services are running at this level, except for\
    \ those services that enable network connections |\n| 3 | Full multiuser – starts\
    \ enabled services in text interface mode but does not start the X-windows server\
    \ to run Graphical User Interface desktops |\n| 4 | User Defined – has no conventional\
    \ definition but may be custom configured by the user |\n| 5 | Full multiuser\
    \ graphical desktop – starts all enabled services including the X-windows server\
    \ to run Graphical User Interface desktops. Typically this is the default level\
    \ for Linux single-user installations |\n| 6 | Reboot – at this run level the\
    \ system is currently in the process of rebooting |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_151_0.png)\n\
    \nFrom switching on your system, the Linux boot process first starts basic services,\
    \ to attain run level 1, then starts further services to continue to move up through\
    \ successive run levels. Finally, when the Graphical User Interface desktop has\
    \ loaded, your Linux operating system is running at level 5.\n\nFrom switching\
    \ on your system the Linux boot process first starts basic services, to attain\
    \ run level 1, then starts further services to continue to move up through successive\
    \ run levels. Finally, when the Graphical User Interface desktop has loaded, your\
    \ Linux operating system is running at level 5.\n\nFrom switching on your system\
    \ the Linux boot process first starts basic services, to attain run level 1, then\
    \ starts further services to continue to move up through successive run levels.\
    \ Finally, when the Graphical User Interface desktop has loaded, your Linux operating\
    \ system is running at level 5.\n\nFrom switching on your system the Linux boot\
    \ process first starts basic services, to attain run level 1, then starts further\
    \ services to continue to move up through successive run levels. Finally, when\
    \ the Graphical User Interface desktop has loaded, your Linux operating system\
    \ is running at level 5.\n\ncont'd\n\n| echo var | show the value stored |\n|\
    \ export var | make var an environment variable |\n| printenv | show all environment\
    \ names |\n| unset var | remove the var |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_152_0.png)\n\
    \nEach user-defined variable remains available for recall in the current shell\
    \ session but can be removed with the unset command. So the command \"unset NYC\"\
    \ would remove that variable.\n\nShell variables can even be made available to\
    \ other programs launched from the current shell using the export command. This\
    \ effectively makes the shell variable into an environment variable until you\
    \ logout of the shell. For instance, use the command \"export NYC\" to create\
    \ a temporary environment variable that can be used by any program within the\
    \ current shell environment.\n\n## 12. Getting started with the shell\n\n## Revealing\
    \ shell variables\n\nText strings may also be stored in shell variables and their\
    \ values displayed in the same way using the echo command:\n\n```\nShell - Console\n\
    Session Edit View Bookmarks Settings\nuser> NYC=\"Big Apple\"\n> echo $NYC\nBig\
    \ Apple\nuser> \n```\n\nA list of standard environment variables that store system\
    \ information can be displayed with the printenv command and their individual\
    \ values can be seen using the echo command.\n\nThe most important environment\
    \ variable is $PATH stores a list of system directories in which seek programs\
    \ when they are requested. For instance, when you issue the clear command the\
    \ shell consults the value of $PATH and looks in each listed directory until it\
    \ finds the clear program – located in /usr/bin.\n\nTo temporarily add another\
    \ directory to the $PATH variable append it with a colon character. For example,\
    \ add the /usr/sbin directory with the command \"PATH=$PATH:/usr/sbin\".\n\nTo\
    \ create a variable, type a name of your choice at the prompt (conventionally\
    \ variable names are all uppercase) then type an \"=\" followed by any numeric\
    \ value. Now you can recall the value using the echo command followed by the variable\
    \ name prefixed with the \"$\".\n\n![](img/0494b98ec9ddc4515587e9808d73902e_153_2.png)\n"
  mdcn: "\n\n## 自定义 shell 提示符\n\n每当用户登录 shell 时，Linux 都会查找一个名为 .bashrc 的隐藏配置文件，该文件位于用户主目录下。此文件决定了\
    \ shell 的行为，并可以对其进行编辑以根据你的喜好自定义 shell。通过编辑此文件将 shell 提示符的外观自定义为你喜欢的样式和颜色特别有用。\n\
    \n要使用 Konqueror 找到此文件，导航到你的主目录，然后选择“查看（View）”、“显示隐藏文件（Show Hidden Files）”。现在使用任何文本编辑器（如\
    \ KWrite）打开 .bashrc 文件来编辑其内容。在文件的底部添加以下代码：\n\n```bash\nif [ \"basename $SHELL\"\
    \ = \"bash\" ];\nthen  export PS1=\"\\e[34m]user> \\e[0m\"\nfi\n```\n\n该代码首先检查\
    \ shell 是否确实为 bash shell，然后尝试为 shell 提示符导出新的配置设置（PS1）。需要反斜杠来转义某些字符以免被识别。ANSI 颜色值\
    \ 34 将提示符“user>”写入蓝色，而值 0 则将其他所有写入默认的 shell 窗口文本颜色——通常是黑色。\n\n保存文件以应用更改，然后打开 shell\
    \ 窗口显示新的用户提示符样式和颜色：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_149_0.png)\n\n\
    第一行使用了反引号字符（’）——而不是撇号。这可以在键盘上 Tab 键上方的找到。\n\nANSI 是美国国家标准协会（American National\
    \ Institute）的缩写——参见 www.ansi.org。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_149_1.png)\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_149_2.png)\n\n（续）\n\nroot 用户提示符也可以通过在\
    \ root 用户主目录下编辑或创建一个新的隐藏 \".bashrc”文件来根据喜好进行自定义，使其与普通用户提示符区分来。普通用户无法访问此位置，因此首先在\
    \ shell 中使用 `su -l` 命令切换到超级用户状态。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_0.png)\n\
    \n使用 F8 键切换 KWrite 打开对话框中隐藏文件的可见性。现在在提示处输入 \"kwrite\" 并按回车键启动具有 root 权限的 KWrite\
    \ 文本编辑器。这允许你导航到 /root 目录并打开或创建 .bashrc 文件。在文件的底部添加以下代码：\n\n```bash\nif [ \"basename\
    \ $SHELL\" = \"bash\" ]\nthen\n    export PS1=\"\\e[31m] root>\\e[0m\"\nfi\n```\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_150_1.png)\n\n记住文件开头的点——文件名必须精确命名为\
    \ \".bashrc\"。这与用于用户提示符的代码类似，但此处 ANSI 颜色值将 \"root>\" 写入红色。保存文件以应用更改，然后打开 shell\
    \ 窗口显示新的 root 提示符样式和颜色：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_2.png)\n\
    \n可能的 ANSI 颜色值为黑色(30)、红色(31)、绿色(32)、黄色(33)、蓝色(34)、洋红色(35)、青色(36)和白色(37)。\n\n##\
    \ 修改运行级别\n\nLinux 操作系统可以处于若干个编号“运行级别（run level）”状态之一。每个运行级别数字描述了已初始化并运行的服务级别。\n\
    \n| 运行级别 | 描述 |\n|:---|:---|\n| 0 | 停机 –在此级别下，系统正处于关机过程中 |\n| 1 | 单用户 – 仅多一个控制台，几乎所有其他服务都已禁用。通常用于维护，例如从黑客攻击恢复或修复磁盘损坏\
    \ |\n| 2 | 基础多用户 – 大多数服务在此级别运行，但启用网络连接的服务除外 |\n| 3 | 全多用户 – 在文本界面模式下启动启用的服务，但不启动运行图形用户界面桌面的\
    \ X-windows 服务器 |\n| 4 | 用户定义 – 没有传统定义，但可以由用户进行自定义配置 |\n| 5 | 全多用户图形桌面 – 启动所有启用的服务，包括运行图形用户界面桌面的\
    \ X-windows 服务器。通常这是 Linux 单用户安装的默认级别 |\n| 6 | 重启 –在此运行级别下，系统正处于重启过程中 |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_151_0.png)\n\
    \n从开启系统开始，Linux 引导过程首先启动基本服务达到运行级别 1，然后启动后续服务继续进入连续的运行级别。最后，当图形用户界面桌面加载后，你的 Linux\
    \ 操作系统运行在级别 5 上。\n\n（续）\n\n| echo var | 显示存储的值 |\n| export var | 将 var 设为环境变量\
    \ |\n| printenv | 显示所有环境变量名称 |\n| unset var | 移除 var |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_152_0.png)\n\
    \n每个用户定义的变量在当前 shell 会话中保持可调回，但可以使用 `unset` 命令移除。因此命令 `unset NYC` 将移除该变量。\n\n\
    Shell 甚至可以通过 `export` 命令对当前 shell 启动的其他程序可用。这实际上将 shell 变量变成了环境变量，直到你退出 shell。例如，使用命令\
    \ `export NYC` 创建一个可以在 shell 环境中使用的临时环境变量。\n\n## 12. 开始使用 shell\n\n## 显示 shell\
    \ 变量\n\n文本字符串也可以存储在 shell 变量中，并以相同的方式使用 echo 命令显示其值：\n\n```\nShell - Console\n\
    Session Edit View Bookmarks Settings\nuser> NYC=\"Big Apple\"\n> echo $NYC\nBig\
    \ Apple\nuser> \n```\n\n存储系统信息的标准环境变量列表可以使用 `printenv` 命令显示，单个值可以使用 `echo` 命令查看。最重要的环境变量是\
    \ $PATH，它存储了请求程序时查找的系统目录列表。例如，当你发布 clear 命令时，shell 会查询 $PATH 的值并在列出的目录中查找，直到找到\
    \ clear 程序——位于 /usr/bin。\n\n要临时向 $PATH 变量添加另一个目录，使用冒号字符附加。例如，使用命令 `PATH=$PATH:/usr/sbin`\
    \ 添加 /usr/sbin 目录。\n\n要创建一个变量，在提示处输入你喜欢的名称（通常变量名全大写），然后输入 \"=\" 后跟任何数值值。现在你可以使用\
    \ echo 命令加上前缀 \"$\" 的变量名来调回该值。\n\n"
