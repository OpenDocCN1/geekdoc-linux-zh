    ## 6. Handling files


    ## Accessing files on Windows partitions


    Dual-boot systems the Windows partition may be mounted in Linux to allow a degree
    of access to the files stored there. This process is similar to the way peripheral
    drives are mounted—allowing access to files on portable media, such as CD-ROMs.


    File system differences prohibit the modification of files on a Windows partition
    from Linux–but they can be copied into Linux and modified there.


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_0.png)


    User-friendly Linux distros, such as SUSE Linux, automatically mount the Windows
    partition for you. This means you can easily access the files in Windows from
    the /windows directory in Linux. In the example below Konqueror is able to view
    one of Photoshop''s sample images located on the Windows partition.


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_77_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_77_3.png)


    ## Linux in easy steps


    ## Visiting the OpenOffice suite


    This chapter describes the features of the free OpenOffice suite that is widely
    used in Linux. It examines how this open-source application fares against the
    market leading Microsoft Office product and illustrates some additional benefits
    of OpenOffice.


    - Introducing the OpenOffice suite | 78

    - Documents in OpenOffice Writer | 79

    - Exporting from OpenOffice | 80

    - Spreadsheets in OpenOffice Calc | 82

    - Presentations in OpenOffice Impress | 84

    - Charts & graphs in OpenOffice Draw | 86

    - Formulas in OpenOffice Math | 88


    ## Introducing the OpenOffice suite


    The OpenOffice suite is an application containing a set of tools similar to those
    in Microsoft Office. It is based on original code from the StarOffice application
    by Sun MicroSystems. Sun made the code freely for development by the open-source
    community so OpenOffice has no proprietary ties. The “About” screen shows, however,
    acknowledge its heritage.


    OpenOffice is included in many Linux distros. It can also be freely downloaded
    from www.openoffice.org – clear installation instructions are provided on the
    site too.


    ![](img/0494b98ec9ddc4515587e9808d73902e_79_0.png)


    OpenOffice.org 2.0-free Copyright 2000-2005 Sun MicroSystems Inc. This product
    has been created by Novell, Inc. based on OpenOffice using the LGPL. OpenOffice.org
    acknowledges community members, especially those mentioned at: http://www.openoffice.org/welcome/credits.html.
    Build 1.9.124


    There are versions of OpenOffice available for many platforms including Linux,
    Mac OS and Windows.


    OpenOffice comprises word processor (“Writer”), spreadsheet (“Calc”), and presentation
    (“Impress”) programs that are similar to the Word. Excel and PowerPoint programs
    in MS Office also has a program, to create charts, graphs and diagrams (“Draw”),
    and a specialized tool for formatting mathematical formulas (“Math”). If you are
    familiar with MS Office you will feel instantly at home with the OpenOffice equivalents.


    Most importantly, OpenOffice contains file filters that allow it to work with
    standard MS Office documents from Word, Excel and PowerPoint. Files can be saved
    in MS Office file formats, as well as formats native to OpenOffice.


    It can embed objects (OLE objects, plugins, video, applets, charts) within a document
    – but using these advanced features may create issues when trying to share the
    document with another office suite. For instance, an OpenOffice document containing
    an embedded spreadsheet works fine in OpenOffice, but the spreadsheet may not
    be displayed when that document is viewed in MS Word.


    ## Linux in easy steps


