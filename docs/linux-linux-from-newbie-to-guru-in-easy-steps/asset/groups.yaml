    ## CSS in easy steps


    This book instructs the reader in the use of Cascading Style Sheets. With its
    easy-to-understand text, illustrated examples and cut-to-the-case sidebars, this
    primer provides the keys to choosing font styles, controlling text content, styling
    content boxes, formatting backgrounds, creating dynamic effects, and much more.


    ![](img/0494b98ec9ddc4515587e9808d73902e_81_2.png)


    80 Linux in easy steps


    ## ...cont''d


    One real bonus in OpenOffice is the built-in support for the Portable Document
    Format. This allows you to create read-only versions of your documents in the
    popular PDF format without any additional software. The PDF format maintains the
    style and content of the original document in a very compact file that can be
    transferred around networks and the Internet.


    To export a PDF version of your document from OpenOffice click the File, Export
    As PDF menu – or click the “Export Directly As PDF” button on the Function Bar.
    Either will open the Export dialog (similar to the Save As dialog shown opposite)
    where you can choose a file name and location for the PDF file.


    The OpenOffice file filters allow documents to be saved in many other formats
    including HTML and plain text– the HTML format creates copies of embedded images
    for display in the HTML page whereas the plain text format loses all images and
    style formatting


