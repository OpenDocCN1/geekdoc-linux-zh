    ## Spreadsheets in OpenOffice Calc


    Launch OpenOffice then click the File, New menu to be presented with a sub-menu
    of possible document types – for spreadsheets choose the Spreadsheet option. A
    new blank spreadsheet comprising cells, arranged in rows and columns, appears
    where you can position the cursor and enter content.


    Click on a cell and enter text that can be a heading or descriptive label for
    the spreadsheet''s cells. Drag the mouse to select all the cells that you wish
    to contain the actual numerical content then open the Format menu and choose the
    Cells option. Under the Numbers tab select "Currency" and choose the Format for
    your currency then click the OK button – ensures that the value is shown with
    two decimal places. For instance, set US currency and type "5" into a data cell
    then select another cell to apply the entry – the value appears as "5.00". The
    data in the spreadsheet below describes a table of expenditure over a four-week
    period.


    ![](img/0494b98ec9ddc4515587e9808d73902e_83_0.png)


    To quickly select all values in a column or row click on the gray column heading
    button, or gray row button, and its sum instantly appears in the status bar.


    The power of spreadsheets lies in their ability to perform calculations on their
    data entries using formulas. For instance, to total the expenditure for Week 1
    in the above example click in the Total cell on that row, then type "=” – the
    symbol appears in that cell and also in the input field for the Formula Bar. Add
    the formula, in either that cell or the input field. In this it is the sum of
    the cells of each day on the Week 1 row – so you would type B5+C5+D5+E5+F5. Hit
    the Return key to apply the formula and the sum value appears in the Total cell.


    ## cont''d


    Alternatively a total value can be ascertained using the SUM() function. Type
    “=S” in the Total cell and a tooltip prompting you to use the SUM() function.
    Hit the Return key, to confirm you want to use this function, select the cells
    whose values you wish to total – in the example above B5,C5,D5,E5 and F5. The
    formula appears in the cells, and the Formula Bar input field, as “=SUM(B5:F5)”.
    Hit the Return key to apply the formula and the total value appears in the Total
    cell.


    ![](img/0494b98ec9ddc4515587e9808d73902e_84_0.png)


    Select an empty cell at the end of a row of data cells then click the character
    on the Formula Bar to see the suggested formula appear in the input field – hit
    the Return key to accept it and apply the formula.


    Similarly, the AVERAGE() function can be used in exactly the same way to calculate
    the average of a range of values. Type “=A” in the Average cell and a tooltip
    prompting you to use the AVERAGE() function. Hit the Return key, then highlight
    the cells whose values you wish to average. Hit Return again to apply the formula
    and the average value appears in the Average cell.


    Applying formulas exactly creates quickly totals and averages for each week and
    each day. Right-click on a range of cells and choose the Format Cells option on
    the context menu and choose a background color to highlight the data in those
    cells.


    | | | Monday | Tuesday | Wednesday | Thursday | Friday | Total | Average |

    |---|---|---|---|---|---|---|---|---|

    | 1 | Week 1 | $2.70 | $2.30 | $2.50 | $2.85 | $2.90 | $13.05 | $2.61 |

    | 2 | Week 2 | $2.75 | $2.20 | $2.40 | $2.00 | $2.35 | $11.95 | $2.39 |

    | 3 | Week 3 | $2.70 | $2.70 | $2.70 | $2.25 | $2.30 | $12.70 | $2.54 |

    | 4 | Week 4 | $2.70 | $2.70 | $2.70 | $2.70 | $2.68 | $13.48 | $2.68 |

    | 5 | Total | | $10.85 | $9.90 | $10.20 | $9.60 | $10.05 | $50.60 |

    | 6 | Average | | $2.71 | $2.48 | $2.55 | $2.40 | $2.51 | $2.53 |


    To save the spreadsheet click the File, Save As menu and type a name for the file
    in the Save dialog – the native format for OpenOffice Calc adds the file extension
    “.ods”. Choose the file format “.xls” if you want the spreadsheet to work with
    Excel in the MS Office suite.


    ## 7. Visiting the OpenOffice suite


    Launch OpenOffice then click the File. New menu to be presented with a sub-menu
    of possible document types – for slide show presentations choose the Presentation
    option. “Presentation Wizard” dialog appears where you can choose to create a
    presentation from scratch, use a supplied template, or open an existing presentation
    for editing.


    To start a new presentation check “Empty Presentation”, then click the Next button
    to see a choice of backgrounds – a preview is shown of each option when it is
    selected. Choose the preference, then click the Next button to proceed. A number
    of transitional effects are available in a drop-down list – choose your preferred
    effect then click the Create button to open the Slide dialog.


    Click the layout most suitable for the content you wish to display on the slide,
    and the chosen layout is applied to the slide.


    To run spelling check on text in any OpenOffice window click the Check option
    on the Tools menu – or hit F7.


    ![](img/0494b98ec9ddc4515587e9808d73902e_85_0.png)


    The appearance of selected text can be modified using options on the right context
    menu, or Format menu. For instance, select some text to modify the Character Font
    and Position.


    ## ...cont''d


    Animated effects can be applied to blocks of text in the context menu – but these
    should be used sparingly.


    When you''re happy with the slide looks choose the Slide, New option from the
    context menu to add another slide. Repeat the process of layout, adding content
    to the new slide.


    To run the slide select the Show option on the Slide menu, or press F5 – to advance.


    ![](img/0494b98ec9ddc4515587e9808d73902e_86_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_86_1.png)


    ## Just Visiting


    - In this remake of the presentation, modern effects are available.


    ![](img/0494b98ec9ddc4515587e9808d73902e_86_2.png)


    To save the presentation click on the File, Save As menu and type a name for the
    file in the Save dialog – the native format for OpenOffice Impress adds the file
    extension “.odp”. Choose the file format “.ppt” if you want the presentation to
    work with PowerPoint in the MS suite.


    ## Charts & graphs in OpenOffice Draw


    Launch OpenOffice then click the File, New menu to be presented with a sub-menu
    of possible document types – for charts, graphs choose the Drawing option. A blank
    drawing area appears where graphics can be created.


    The toolbar on the left side of the window contains series of predefined objects.
    Click and hold down the mouse on any one of these to open a small window showing
    associated options. For instance, the 3D object offers a cube, cone, sphere, and
    so.


    ![](img/0494b98ec9ddc4515587e9808d73902e_87_0.png)


    Click on any shape to select it then drag the cursor into the drawing area to
    create that object. As with other programs selected objects have handles that
    allow you to adjust their size. Click an existing object in the drawing area to
    select and see the handles appear – click and any handle to adjust the size. Right-click
    on a selected object to open the context menu where the appearance of the object
    can be modified. The screenshot below shows a number of vector objects in OpenOffice
    Draw – many have been modified to illustrate some of the possible fills.


    ![](img/0494b98ec9ddc4515587e9808d73902e_87_1.png)


    The range of vector objects include bezier lines, and also connectors that allow
    you to quickly create flow charts.


    | 18 | 16 | 14 | 12 | 10 | 8 | 6 | 4 | 2 | 4 | 6 | 8 | 10 | 12 | 14 | 16 | 18
