    ![](img/0494b98ec9ddc4515587e9808d73902e_96_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_96_1.png)


    馈源会被添加到 Akregator 文章窗口的列表中。选择任何感兴趣的项目可以在下方的窗口中查看标题；或者对于较长的文章，可以点击超链接在新标签页窗口中阅读全文。


    ![](img/0494b98ec9ddc4515587e9808d73902e_96_2.png)


    当 Akregator 打开时，系统中的图标会显示当前未读文章的数量。


    ![](img/0494b98ec9ddc4515587e9808d73902e_96_3.png)


    # 互联网应用程序上的语音通话


    许多 Linux 发行版现在包含了 KPhone，它可以让你通过 VoIP（IP 语音）技术通过互联网拨打电话。


    在使用 KPhone 之前，你需要向开放网络服务提供商开通账户，例如 Free World Dialup (www.freeworlddialup.com)
    —— 在写本文时，该服务是免费的。一旦你开通了 FWD 账户，你将收到你的个人 FWD 电话号码，就可以配置 KPhone 了。


    在 SUSE Linux 中，通过“开始”、“互联网”、“电话”菜单启动 KPhone，然后选择“A SIP phone for KDE”，或运行 `kphone`
    命令。接下来点击“文件”、“身份”菜单打开配置对话框并输入你的 FWD 账户详情：


    ![](img/0494b98ec9ddc4515587e9808d73902e_97_0.png)


    | kphone <2> |

    | :--- |

    | 全名: |

    | Mike McGrath |

    | SIP URL 的用户部分: |

    | <你的 FWD 电话号码> |

    | SIP URL 的主机部分: |

    | fwd.pulver.com |

    | 出站代理 (可选): |

    | 身份验证用户名 (可选): |

    | <你的 FWD 电话号码> |

    | 0.0-1.0 之间的 q-value (可选): |

    | X 自动注册 |

    | 注册：未注册 |

    | 注册帮助...  取消 |


    勾选“自动注册”文本框，点击“确定”按钮完成身份配置。


    如果你的互联网连接位于 NAT（网络地址转换）设备之后（例如家庭路由器），你还应该通过勾选 Socket 选项卡上的“使用 STUN 服务器”选项来编辑“偏好”、“SIP
    偏好”设置。


    配置完成后，KPhone 界面将在“sip:”行上显示你的 FWD 号和主机名。


    插上麦克风和耳机，然后在 KPhone 地址字段中输入“612@fwd.pulver.com”（注意是 612）。现在点击紧邻地址字段的通话按钮：


    Free World Dialup 网站包含详尽的配置指南，并在遇到问题时提供有用的支持。


    热心提示


    ![](img/0494b98ec9ddc4515587e9808d73902e_98_0.png)


    将弹出的对话框请求你的密码。输入 FWD 密码，几秒钟后你将听到。电话已挂断。现在在地址字段中输入“613@fwd.pulver.com”（注意是 613）。KPhone
    现在可以用于拨打电话了。


    # 在互联网上传输文件


    使用文件传输协议 (FTP) 在互联网上传输文件在 KDE 中变得非常简单。通过“开始”、“互联网”、“网络浏览器”启动 Konqueror 或运行 `conqueror`
    命令。


    在 Konqueror 的地址栏中输入要访问的 FTP 服务器地址，然后按回键：


    ![](img/0494b98ec9ddc4515587e9808d73902e_99_0.png)


    某些发行版还包含一个名为 ktorrent 的 BitTorrent 客户端，它可以传输文件。


    当授权对话框出现时，可以在 Konqueror 窗口中查看内容。可以将文件拖入该窗口上传到服务器，或从该窗口将其下载到你的系统。


    ...（续）


    ![](img/0494b98ec9ddc4515587e9808d73902e_100_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_100_1.png)


    # 在线消息


    KDE 即时消息应用程序名为 Kopete，可以通过 SUSE Linux 的“开始”、“互联网”、“聊天”或运行 `kopete` 命令启动。首先，在设置中选择消息服务：


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_0.png)


    注册页面包含你已经拥有的功能。注册后，你可以使用消息器发送：


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_2.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_3.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_4.png)


    # 创建和编辑图形


    本章将介绍流行的图形软件 GIMP。


    - 介绍 GIMP | 102

    - 启动 GIMP | 104

    - 打开 GIMP | 106

    - 在 GIMP 中工作 | 108

    - 使用 GIMP 工具 | 110

    - 选择工具 | 112

    - 存储 GIMP 项目 | 114


    # 介绍 GIMP


    GIMP 的功能多于 Photoshop。在某些领域它也较少。与 Photoshop 不同，GIMP 是开源软件，根据通用公共许可证免费提供。


    GIMP 的主要缺陷是不支持 CMYK 颜色或专色（如 PANTONE 色）；它只支持 8 位 RGB、灰度图和索引图像。因此，GIMP 在印前领域无法与
    Photoshop 竞争，但在创建数字图像方面提供了一些令人兴奋的可能性。


    GIMP 相比 Photoshop 的一个主要优势是它的脚本能力。你可以使用 PERL（实用提取和报告）脚本语言—— CGI 的首选语言来编写自定义效果。

    '
