    ## 输入和输出值


    Linux shell 介绍演示了如何创建变量并为它们赋值。记住，赋值时不允许有空格，因为那会截断表达式。这是因为 shell 评估由空格分隔的完整关键字，这也是为什么命令与其参数之间必须有空格的原因。严格来说，所有变量值都存储为字符串，但
    shell 会在适当的情况下智能地将它们视为数值。


    任何变量值都可以通过 echo 命令显示，该命令默认会添加一个换行符，因此提示符会在下一行重新出现。通过添加 "-n" 选项可以抑制换行符。echo 命令的另一个有用选项是
    "-e"，它允许你使用“转义”（escape）序列指定简单格式。最常用的序列是 \n（添加换行符）和 \t（添加制表符）——两者都用于 echo 命令下方的图中：


