    | cut | 显示文本文件的指定列 |

    |---|---|

    | paste | 显示合并列的文本文件 |

    | tr | 转换文本 |

    | sort | 按字母顺序排列行 |

    | tee | 将文本流写入文件然后显示为输出 |


    paste 命令是 cut 命令的相反操作，将多个文件的列合并显示：注意这里使用了 "-t" 选项，让命令将制表符显示为 "^"。可以使用其他分隔符，但默认是制表符。


