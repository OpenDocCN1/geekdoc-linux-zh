    5

    user>

    ```


    简单的字符串函数如 "length" 可以配合 expr 命令发现字符串的长度。"substr" 函数从给定位置开始提取指定长度的子字符串，“index"
    函数给出指定字符在字符串中首次出现的位置。


    表达式评估的结果可以使用 "if-then" 语句导致特定的输出。这包含两个部分：说明要评估的表达式，以及仅当结果为真时输出的文本。"if" 关键字开始语句，后面跟着一对括号内的测试表达式。整个语句的每个部分必须与后面空格分隔，以便
    shell 评估表达式。"then" 关键字开始语句的第二部分，包含如果测试为真要执行的命令。以 "fi" 关键字结束，标记语句的结束。


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_0.png)


    在 "if" 关键字后留一个空格以避免错误。在 "[]" 括号后留一个空格以避免错误。在 "[]" 括号前留一个空格以避免错误。


