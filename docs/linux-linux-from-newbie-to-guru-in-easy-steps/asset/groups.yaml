    \ -- all features\n* Keyst Commands -- quick outline\n* Line Editor -- when entering\
    \ URLs\n* Supported URLs -- how Lynx handles URLs\nURL to open: www.bn.com/\n\
    Arrow keys: Up and Down Print G screen\nHelp Options Print G screen Quit\n```\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_205_1.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nBarnes & Noble.com - Home (p1 of 12)\n\
    Barnes & Noble.com - www.bn.com\nFAST & FREE DELIVERY See details\nTitle Mike\
    \ McGrath Search\n[Option list] Hit return and use arrow keys\nArrow keys: Up\
    \ and Down to move\nHelp Options Print G screen Quit\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_205_2.png)\n\
    \nBy default you are asked to accept each cookie- press \"O\" to change the cookie\
    \ if you want to accept all without question. The line in blue and yellow changes\
    \ as you navigate around the page, indicating where you are and providing hints.\
