    ## Making space for Linux


    An operating system is installed on a defined area of the HD drive called a “partition”.
    When Windows is the only installed operating system its partition will normally
    occupy the entire HD drive. To install Linux in this situation there are three
    possible options:


    - Delete the Windows partition – replacing it with Linux partition(s) that occupy
    the entire drive. This option will delete the Windows operating system along with
    all the applications and data files that were installed there. It creates a dedicated
    Linux computer which will immediately start Linux whenever the PC gets switched
    on.


    - Reduce the Windows partition size – so that it no longer occupies the entire
    drive, then create Linux partition(s) in the resulting free space. This option
    should and retain the Windows operating system, applications and data files. It
    creates a “dual-boot” computer that allows the user to choose whether to start
    Linux or Windows whenever the PC gets switched.


    - Add a second HD drive to the system – this allows Linux partition(s) to occupy
    the second drive and retains the Windows operating system, applications and data
    files on the first drive. It too creates a “dual-boot” computer that allows the
    user to choose whether to start Linux or Windows whenever the PC gets switched.


    ![](img/0494b98ec9ddc4515587e9808d73902e_15_0.png)


    The option to install an additional HD drive for Linux is a popular choice for
    many people as they have often upgraded their original HD drive to a larger one,
    and so have their original drive spare. It also has several benefits over the
    other options:


    - The free space on the Windows drive is not reduced

    - It removes the threat of data loss through partition resizing

    - The familiar Windows operating system is retained

    - It separates the two operating systems

    - Drive failure would only disrupt one operating system


    ## Adding a second HD drive


    Most modern PCs can accommodate up to four EIDE (Enhanced Integrated Device Electronics)
    devices, such as HD drives and CD /DVD drives, but typically ship with just two
    – one HD drive and one CD drive. This means that one or two drives can be added
    simply by plugging them into the existing system.


    The first HD drive in a system is known as the “master” HD drive and a second
    HD drive is called the “slave” HD drive.


    A “jumper” connects two tiny pins to determine if the drive should be regarded
    as a master (MA) drive or slave (SL) drive. The top of each HD drive usually has
    a diagram depicting which pins need to be connected in each case.


    Before installing a second HD drive first ensure that the jumper on the original
    drive is set to master and the wide data cable is connected to the drive by its
    end plug – not the plug part way along the cable. Now set the jumper on the second
    drive to slave and connect the data cable using the plug part way along the cable.


    > HOT TIP If you are not comfortable working inside your PC case we should be
    pleased to undertake the fitting of a second drive for a modest fee.


    ![](img/0494b98ec9ddc4515587e9808d73902e_16_0.png)


    Connect the power cables and start up the PC – both HD drives should now be detected.
    If the second drive is not detected you should change the BIOS settings to auto-seek
    it when booting.


    ## Preparing to install Linux


    If you choose to install Linux on the same HD drive as Windows, it''s a good idea
    to clean up the disk before starting the installation.


    In Windows XP, click on the My Computer icon then right-click on the HD drive
    icon and select Properties to open the Local Disk Properties.


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_0.png)


    This procedure is not required if Linux is to replace Windows on a single HD drive,
    if Linux is to be installed on a second HD drive.


    Under the Tabs click the Check Now button to open the Check Disk dialog. Check
    both boxes then click the Start button to run ScanDisk – if a further dialog appears
    click Yes then reboot to run ScanDisk. The ScanDisk utility checks the condition
    of the hard disk and takes a while to execute.


    When ScanDisk completes click on the Defragment Now button in the Local Disk Properties
    dialog to tidy up the file system. When the defragmenter finishes rearranging
    the files on the hard disk you are ready to begin.


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_0.png)


    Make a backup of everything before proceeding.


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_2.png)


    ## Installing the operating system


    This chapter walks through the steps of a typical Linux installation these may
    appear in different order.


    - Starting the installation | 18

    - Setting the installation parameters | 20

    - Partitioning the disk | 22

    - Installing packages | 24

    - Setting the root password | 25

    - Network configuration | 26

    - Creating a user account | 27

    - Completing installation | 28


    ## Starting the installation


    Linux installations begin by booting the CD-ROM. If the CD drive does not contain
    boot instructions it uses those on the HD drive.


    Ensure that the first CD-ROM from your distribution is in the CD drive, then switch
    on the computer to boot from the CD-ROM. Select the “Installation” option from
    the menu then hit the Return key.


    The installer program starts out by asking you to select a language. Note that
    this is not to specify a language for use after installation but just to set the
    language the installer should use during the installation.


    Click on your preferred language, then click on the Next button to proceed to
    the next step.


    ## ...cont''


    ![](img/0494b98ec9ddc4515587e9808d73902e_20_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_20_1.png)


    The next step states the License terms and conditions. It is worth reading through
    this to understand more about the nature of Open Source software. Check the “Agree”
    option, then click the Next button to proceed.


    ## Setting the installation parameters


    | License Agreement

    | SUSE LINUX 10.0 RIGHTS AND LICENSES This Novell Software License Agreement ("
    Agreement ") is a legal agreement between You (an entity or person) and Novell,
    Inc. |


    - Yes, I Agree to the License Agreement

    - Ng, I Do Not Agree


    After agreeing the License terms check the Mode option to have a “New Installation”
    – the “Update” option can be used after installation to add further software from
    the installation disks.


    | Installation Mode

    - New Installation

    - Update

    - Other...


    > HOT TIP Make a note of this! If in the future you are having problems return
    to the Installation Mode screen then click the Other button and choose the option
    to Repair the Installed System – works a treat


    Linux in easy steps

