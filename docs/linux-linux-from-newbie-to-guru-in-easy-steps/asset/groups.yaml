    # Manipulating text content


    The shell "cut" and "paste" commands may not be what you might expect. They are
    used to work with text arranged in columns, delimited by an invisible tab character.
    Each column of text is known as a "field" and the cut command can specify an option
    to determine which field to display – for instance, the option "-f3" chooses the
    third column from the left.


    To select multiple fields specify a comma separated list. For instance -f1,3 or
    to select a range of fields, -2-4.


    ![](img/0494b98ec9ddc4515587e9808d73902e_175_0.png)


    | cut | show the specified column of a text file |

    |---|---|

    | paste | show text files combined into columns |

    | tr | transform text |

    | sort | arrange lines alphabetically |

    | tee | write text stream to file then display as output |


    The paste command is the opposite of the cut command, combining columns from multiple
    files for display together:


    Notice the use of the "-t" option here to let the cut command show tab characters
    as "^". Other delimiters may be used but tab is the default.


    ![](img/0494b98ec9ddc4515587e9808d73902e_175_1.png)


    ```

    Shell - Console

    Session Edit View Bookmark Settings Help

    user> cat -T columns.txt

    Apple^IAnthem^IAlpha

    Banana^IBloom^IBravo

    Cherry^ICheer^ICharlie

    user> cut -f2 columns.txt

    Anthem

    Bloom

    Cheer

    user> cat -T lists.txt

    Sun^ITough

    Sea^IToday

    Sand^ITrend

    user> paste columns.txt lists.txt

    Anthem Alpha Sun Tough

    Banana Bloom Sea Today

    Cherry Cheer Charlie Sand Trend

    user>>

    ```'
