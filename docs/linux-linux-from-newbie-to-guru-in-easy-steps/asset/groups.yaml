    # Browsing with Mozilla Firefox


    In addition KDE''s Konquer web browser most Linux distros include the open-source
    Mozilla Firefox browser. This popular free browser is available for various platforms
    and contains many powerful features. It has been developed by the open source
    community from original Netscape browser source code into a very competent, standards
    compliant product.


    In SUSE linux click Start, Internet, WebBrowser, Firefox to launch the web browser.
    Type a URL into the location field then hit Return to open that page in the browser
    window.


    Most web browsers are based upon the Mosaic browser of the early 1990s. the name
    Mozilla is derived from "Mosaic" and "godZILLA".


    ![](img/0494b98ec9ddc4515587e9808d73902e_91_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_91_1.png)


    If you''re using to Internet Explorer you will feel instantly at home with Firefox
    – but it also has some great extra features. Type a word or phrase into the location
    field then click the Search button to have the Google search engine return a list
    of relevant URLs.


    Firefox''s appearance can be easily customized – click on the Tools menu, then
    select Themes. You can choose from the listed themes, or select Get More Themes
    to download others from the Internet.'
