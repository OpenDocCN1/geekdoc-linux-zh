    \ |\n| file | 估算文件类型 |\n| touch | 创建文件或更新其时间戳 |\n\n在下面的示例中，stat 命令检查了一个小文件并显示了它的字节大小（40）、块大小（8）、文件类型（普通文件）、inode\
    \ 节点地址（111498）、硬链接数（1）、访问权限和时间戳：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_163_0.png)\n\
    \n如果你只想查看文件大小，可以使用带有 -b 选项的 \"du\" 命令来统计它所占的字节数。\n\n# 续\n\n![](img/0494b98ec9ddc4515587e9808d73902e_164_0.png)\n\
    \n使用 \"wc\" 字数计数命令可以快速发现文本文件包含多少行、多少单词和多少字节，或者使用 \"file\" 命令评估它是什么类型。\n\ntouch\
    \ 命令引入了一些有趣的可能性，它可以更改与文件相关的“最后访问”和“最后修改”时间戳。单独使用时，它只是会将这些更新为当前时间，但配合 -d 选项使用时，它允许你指定各种格式的日期：指定日期和月份可将时间戳设置为当年该日的午夜，或者指定一个完整的日期和时间作为你喜欢的任何时间戳。\n\
    \n下面的示例演示了这些每个命令的用法，然后使用 stat 命令显示时间戳现在的显示情况：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_164_1.png)\n\
