    # Locating files


    Locating a file on your system can be achieved from a shell prompt using the “find”
    command. This is a very powerful command, with over 50 possible options, but it
    has an unusual syntax. Possibly the one most used looks like this:


    ```

    find dir-name -type f -name file-name -print

    ```


    The directory name specifies the hierarchical starting point from which to begin
    searching. If you know the file exists somewhere in your home directory you could
    begin searching there ( ~ ). Alternatively, you could use the -l command to assume
    root super status then search the entire system by starting from the top root
    directory ( / ).


    ![](img/0494b98ec9ddc4515587e9808d73902e_167_0.png)


    In this case the -type f option specifies that the search is for a file, the -name
    option makes the search by name and the -print option simply makes the command
    print the results in the shell window.


    In the example below the user searches for a named file within the home directory.
    Switching to super user, the next search is made across the entire file system
    for any file whose name begins with the specified string:


    ```

    Shell - Konsole

    user> find ~ -type f -name linux.txt -print

    home/mike/My Documents/linux.txt

    user> su -l

    Password: ******

    root> find / -type f -name starburst* -print

    opt/gnome/share/gimp/2.0/scripts/starburst-log\usr/share/wallpapers/starburst.jpg

    find:/media/floppy: No medium found

    root> exit

    logout

    >

    ```'
