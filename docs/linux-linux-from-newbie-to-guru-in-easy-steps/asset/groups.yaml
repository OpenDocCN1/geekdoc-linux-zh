    # Compressing and extracting archives


    The traditional GNU zip file compression tool in Linux uses the “gzip" command
    to compact one or more files stated as its arguments into a single “gz" archive
    – replacing the original files. Conversely, its companion "gunzip" can be used
    to extract archives created with gzip.


    | command | description |

    | --- | --- |

    | gzip | compress files |

    | gunzip | decompress files |

    | bzip2 | compress files |

    | bunzip2 | decompress files |

    | zip | compress files |

    | unzip | decompress files |


    The modern bzip2 tool achieves better compression than gzip but is less used.
    This example first compresses a file with gzip then uncompresses the archive with
    bzip2.


    ![](img/0494b98ec9ddc4515587e9808d73902e_181_0.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> du -b *

    8284 tamoshanter.txt

    user gzip tamoshanter.txt | du -b *

    4151 tamoshanter.gz

    user gunzip tamoshanter.gz

    user du -b *

    8284 tamoshanter.txt

    user bzip2 tamoshanter.txt

    user du -b *

    3798 tamoshanter.bz2

    user |

    ```


    # cont''d


    Compressed archives created on Windows systems invariably use the zip format.
    Their contents can be extracted in Linux by the “unzip” tool. Unlike gunzip and
    bunzip2 this does not delete the archive file after extraction:


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> ls -l

    total 4

    -rw-r--r-- 1 3096 2005-10-07 09:11 grays.zip

    user> unzip grays.zip

    Archive: grays.zip

    inflating: grays.txt

    user> ls -l

    total 12

    -rw-r--r-- 1 5909 2005-10-07 07:50 grays.txt

    -rw-r--r-- 1 3096 2005-10-07 09:11 grays.zip

    user> cat grays.txt | less

    ```


