    ```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nBarnes & Noble.com\
    \ – Computing .. (p1 of 18)\nTitle\nAuthor\nKeyword\nISBN\nMike McGrath Search\n\
    (Choice list) Hit return and use arrow keys\n```\n\nAfter making your choice use\
