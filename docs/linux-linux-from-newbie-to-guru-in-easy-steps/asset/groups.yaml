    # Messaging online


    The KDE instant messaging application is called Kopete and it can be launched
    by SUSE Linux from the Start, Internet, Chat or with the Run kopete command. First,
    choose the messaging service from Settings:


    ![](img/0494b98ec9ddc4515587e9808d73902e_101_0.png)


    The registration page includes some features that you can already have. Once registered,
    you can use the messenger to send:


