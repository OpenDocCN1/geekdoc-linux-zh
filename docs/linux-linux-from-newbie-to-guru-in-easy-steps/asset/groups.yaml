  - '[PAGE 9]


    # # What is Linux?


    Linux is a computer operating system that can run on a variety of hardware including
    the popular Intel system found on most desktop computers. It is a modern derivation
    of the powerful Unix operating system that was introduced back way in 1969. In
    recent years the popularity of Linux has increased dramatically as its many benefits:


    ![](img/0494b98ec9ddc4515587e9808d73902e_9_0.png)


    Pronounce the name with a short "i" - so it''s "li-nucks" not "lie-nucks".


    +   - Linux is released under the GNU General Public License that ensures it remains
    free to all users – no-one can charge for this operating system so you will never
    have to pay for it. It is available for free download on the Internet but you
    may have to pay a distribution charge if you prefer to order a copy on CD-ROM.


    +   - Access to the source code of Linux is unrestricted and it may be changed.
    This has allowed thousands of programmers around the world to refine the code
    in order to improve performance.


    +   - Linux is truly a multi-user, multi-tasking operating system that allows
    multiple users to simultaneously work with multiple applications without experiencing
    any traffic problems. Many of the world''s web servers run on Linux for this very
    reason.


    ![](img/0494b98ec9ddc4515587e9808d73902e_9_1.png)


    Many web servers are said to have a "LAMP" configuration – an acronym for Linux,
    Apache, MySQL PHP.


    +   - Linux is an extremely stable operating system – continuous uptimes of more
    than a year are not uncommon. It can be upgraded "on the fly" so it only needs
    a reboot to add hardware.


    +   - There are a large number of quality applications available to run on the
    Linux platform. These are comparable to commercial applications that run on other
    operating systems, but like Linux, these too are free of charge. For instance,
    the free OpenOffice suite offers similar functionality to the Microsoft Office
    suite.


    +   - With open-source software an administrator can know exactly what a program
    can do and the security it presents. An open-source application cannot secretly
    gather information about the user or send confidential information to third parties.'
- md: "\n# The evolution of Linux\n\nIn 1983, a visionary programmer named Richard\
    \ Stallman began a movement that called the GNU Project. His philosophy was that\
    \ software should be free from restrictions against copying or modification in\
    \ order to make better and efficient programs. This inspired programmers around\
    \ the world to create programs driven by efficiency rather than financial incentive.\
    \ GNU C Compiler written by Stallman himself. At that time many of these tools\
    \ were incorporated into a Unix-compatible operating system, by a 21-year-old\
    \ student at the University of Helsinki. His name was Linus Torvalds and he named\
    \ the operating system Linux (Linux - Unix).\n\nThe term \"GNU\" is a recursive\
    \ acronym for GNU's Not Unix.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_10_0.png)\n\
    \nLinux was made available for download on the Internet so programmers could test\
    \ and tweak the source code, then return it to Linus Torvalds. After a period\
    \ of enthusiastic development, Linux 1.0 was made available globally under the\
    \ GNU General Public License which ensured it would remain free.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_10_1.png)\n\
    \nProgrammers were keen to explore Linux and found some amazing uses for it. In\
    \ April 1996, researchers at Los Alamos National Laboratory used Linux to run\
    \ 68 PCs as a single parallel processing machine to simulate atomic shocks. At\
    \ $150,000, this supercomputer cost just 1/10th of a comparable commercial machine.\
    \ It reached a peak speed of 19 billion calculations per second, making it the\
    \ 35th most powerful supercomputer in the world. It proved to be robust so three\
    \ months later it still hadn't been rebooted.\n\n\"Tux\" the penguin is the logo\
    \ of the Linux operating system. It commemorates an incident in which Linus Torvalds,\
    \ while on vacation in the southern hemisphere, was bitten on the hand by a penguin.\n\
    \nLinux continued to grow in popularity as a text-based operating system while\
    \ Windows became the dominant graphical operating system. Recognizing that most\
    \ PC users want the point-and-click convenience of a graphical environment, the\
    \ Linux camp began to develop a system comparable to the Windows desktop.\n\n\
    From a handful of enthusiasts in 1991 to millions of users now - Linux has come\
    \ of age. Today's sleek K Desktop Environment (KDE) and the Gnome environment\
    \ now offer a user-friendly alternative for Windows users – Linux for the desktop!\n\
    \n# Choosing a Linux distro\n\nAt the very heart of Linux is a bunch of tried\
    \ tested compiled code called the “kernel”. The kernel provides the operating\
    \ system with its core functionality, much like the engine in a car. It takes\
    \ care of the basics, such as helping other programs access hardware and sharing\
    \ your computer’s processor among various programs.\n\nIn addition to the kernel,\
    \ Linux contains a number of system-level programs, such as the services to handle\
    \ your email, web connection and bootloader. Consider these as a car’s transmission,\
    \ gears and chassis – without which the engine is not much use.\n\nLinux distributions\
    \ generally also include a large number of user-level programs – the applications\
    \ for daily use. For instance, web browsers, word processors, text editors, graphics\
    \ editors, media players, and so on. These are the finishing touches to the car\
    \ that ensure a great ride – whitewall tires and soft leather upholstery.\n\n\
    All of these components are bundled together in a wide variety of Linux distribution\
    \ packages, commonly referred to as “distros”. Just as all the components of a\
    \ car are bundled together to make a complete car.\n\nIn the same way that there\
    \ are makes and models of cars there are many Linux distros to choose from. The\
    \ most well known distros are RedHat, Mandrake, SuSE, Debian and Slack. Each distro\
    \ has its own installer and unique default configuration according to what the\
    \ distributor considers to be the best arrangement. The ideal one for you will\
    \ depend on your own personal preferences and how you want to use Linux. The most\
    \ popular distros are described below to help you choose.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_11_0.png)\n\
    \nMany other Linux distros can be found online. (disk images) can be downloaded\
    \ to create a Linux installation disk.\n\n# RedHat Fedora\n\nOne of the most published\
    \ Linux distros comprising the commercial RedHat Enterprise Linux product line\
    \ and the unsupported free Fedora Core distro that is developed by the community,\
    \ serving as a test base for RedHat Enterprise Linux. \n\nPros: Widely used, excellent\
    \ community support, innovative. \nCons: Limited product life-span of the free\
    \ edition, poor multimedia support.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_11_1.png)\n\
    \n# Fedora\n\nFree download at http://www.fedora.redhat.com.\n\n# SUSE\n\nAnother\
    \ distro with desktop focus which has received positive reviews for its installer\
    \ and YaST configuration tools. The documentation, which comes with the boxed\
    \ product, has been labeled as the most complete, thorough and usable by far.\n\
    \nPros: Attention to detail, easy-to-use YaST configuration tools \nCons: Huge\
    \ distro – including over 1,500 bundled packages\nFree download at http://www.opensuse.org.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_12_0.png)\n\n# Mandriva\n\nFormerly\
    \ called Mandrake, this distribution has experienced enormous rise in popularity\
    \ since 1998. \n\nPros: Easy-to-use graphical configuration, great support \n\
    Cons: Not fully\nFree download at http://www.mandrivalux.com.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_12_1.png)\n\
    \n# Ubuntu\n\nThis distro has stormed the scene like no other. It has done so\
    \ for those interested in the product. \n\nPros: Great community, free cycle,\
    \ free documentation \nCons: Not fully\nFree download at http://ubuntlinux.org.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_12_2.png)\n\n# Evaluating hardware\
    \ suitability\n\nBefore installing Linux on a computer it is necessary to evaluate\
    \ its hardware suitability. The table below suggests minimum specifications for\
    \ processor, memory and hard disk (HD) drive.\n\n> Linux can be installed on systems\
    \ that fall below these levels.\n\n| Hardware item | Suggested minimum |\n| ---\
    \ | --- |\n| CPU speed | 300Mhz (1.0Ghz+ is better) |\n| Memory size | 128Mb (256Mb+\
    \ is better) |\n| HD drive capacity | 5Gb (10Gb+ is better) |\n\nIt's easy to\
    \ discover the CPU and memory information if Windows is already installed on the\
    \ computer – right-click on My Computer icon then select Properties to open the\
    \ System Properties dialog box. The details are displayed under the General tab,\
    \ as illustrated below.\n\n> The CPU and memory details are also usually displayed\
    \ by the BIOS when the computer gets booted up.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_13_0.png)\n\
    \nTo discover the available drive capacity in Windows, click on the My Computer\
    \ icon then right-click on the HD drive icon and select Properties to open the\
    \ Local Disk Properties dialog box. Drive capacity information is displayed under\
    \ the General tab. On the HD drive illustrated below 5Gb of the free space could\
    \ be given over to Linux. Devoting 5Gb to Linux on the drive shown here does not\
    \ leave much space for further work in Windows.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_14_0.png)\n\
    \nConsideration should also be given to the hardware used to connect to the Internet.\
    \ Connection via a PCI ethernet card, or on-motherboard ethernet connector, is\
    \ very well supported in Linux and virtually all hardware of this type is suitable.\n\
    \nUnfortunately modems are rather more problematic. Many computers are supplied\
    \ with an internal PCI modem that will only work with Windows software. These\
    \ so-called “winmodems” are unsuitable for connection to the Internet in Linux.\
    \ If you have an internal modem and find it unusable in Linux you will probably\
    \ have to replace it with different hardware before you can connect to the Internet.\
    \ Usually the easiest solution is to connect an external modem via a traditional\
    \ RS232 serial port.\n\nIf you are really determined to try to get your winmodem\
    \ working in Linux visit.linmodems.org to discover lots of useful advice.\n"
  mdcn: "\n\n# Linux 的演变\n\n1983年，一位名叫理查·斯尔曼（Richard Stallman）的远见程序员发起了一项名为 GNU 项目的运动。他的哲学是软件应该不受反对复制或修改的限制，以便创建出更好、更高效的程序。这启发了全球的程序员去创建由效率而非金激励驱动的程序。斯尔曼本人编写了\
    \ GNU C 编译器。当时，这些工具中的许多被来自赫尔辛基大学的一名21岁学生整合到了一个兼容 Unix 的操作系统中。他的名字是林斯·托瓦兹（Linus\
    \ Torvalds），他将该操作系统命名为 Linux（Linux - Unix）。\n\n“GNU” 是 GNU's Not Unix（GNU 不是 Unix）的递归缩写。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_10_0.png)\n\nLinux 在互联网上提供下载，以便程序员测试和调整源代码，然后将其返回给林斯·托瓦兹。在经过热烈的开发后，Linux\
    \ 1.0 根据 GNU 通用公共许可证（GNU General Public License）在全球发布，该许可证确保了它将保持免费。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_10_1.png)\n\
    \n程序员们渴望探索 Linux 并发现了它的一些惊叹的用途。1996年4月，洛斯阿拉莫斯国家实验室的研究人员使用 Linux 将 68 台 PC 作为一个单机并行处理机器来模拟原子冲击。这台超级计算机花费了\
    \ 150,000 美元，仅为同类商业机器的十分之一。它的峰值速度达到了每秒 190 亿次计算，成为世界第 35 强大的超级计算机。它被证明非常健壮，三个月后仍然没有重启过。\n\
    \n企鹅“Tux”是 Linux 操作系统的标志。它纪念了一次事件：林斯·托瓦兹在南半球度假期间，手部被一只企鹅咬了。\n\n作为一种基于文本的操作系统，Linux\
    \ 继续变得流行，而 Windows 变成了主导地位的图形化操作系统。意识到大多数 PC 用户都想要图形环境的点击便利性，Linux 阵营开始开发与 Windows\
    \ 桌面可比拟的系统。\n\n从 1991 年的少数爱好者到如今的数百万用户——Linux 已经成熟。今天精良的 K 桌面环境（KDE）和 Gnome 环境现在为\
    \ Windows 用户提供了一个用户友好的替代方案——用于桌面的 Linux！\n\n# 选择 Linux 发行版\n\nLinux 的核心是一系列经过反复测试的编译代码，被称为“内核”（kernel）。内核为操作系统提供了核心功能，就像汽车的引擎一样。它负责基础工作，例如帮助其他程序访问硬件并在各种程序之间共享计算机的处理器。\n\
    \n除了内核之外，Linux 还包含许多系统级程序，例如处理您的电子邮件、网络连接和启动加载程序的服务。将这些考虑为汽车的变速箱、齿轮和底盘——没有它们，引擎就没大用处。\n\
    \nLinux 发行版通常还包含大量的用户级程序——日常使用的应用程序。例如网络浏览器、文字处理器、文本编辑器、图形编辑器、媒体播放器等。这些是汽车的最后修饰，确保了良好的驾驶体验——白壁轮胎和软皮革内饰。\n\
    \n所有这些组件都封装在各种 Linux 发行版包中，通常称为“发行版”（distros）。就像汽车的所有组件封装在一起制成一台完整的汽车一样。\n\n就像汽车有品牌和型号一样，许多\
    \ Linux 发行版供选择。最著名的发行版有 RedHat、Mandrake、SuSE、Debian 和 Slack。每个发行版都有其自己的安装程序和独特的默认配置，取决于发行者认为最佳的安排。最适合您的理想选择将取决于您的个人偏好以及您想如何使用\
    \ Linux。下面描述了最流行的发行版以帮助您做出选择。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_11_0.png)\n\
    \n网上还可以找到许多其他 Linux 发行版。（磁盘镜像）可以下载以创建 Linux 安装盘。\n\n# RedHat Fedora\n\n这是最流行的\
    \ Linux 发行版之一，包含了商业性的 RedHat Enterprise Linux 产品线以及由社区开发的、不受支持的免费 Fedora Core\
    \ 发行版，作为 RedHat Enterprise Linux 的测试基础。\n\n优点：广泛使用，卓越的社区支持，具有创新性。\n缺点：免费版的产品周期有限，多媒体支持差。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_11_1.png)\n\n# Fedora\n\n在 http://www.fedora.redhat.com\
    \ 免费下载。\n\n# SUSE\n\n另一个专注于桌面的发行版，其安装程序和 YaST 配置工具收到了好评。随盒装产品附带的文档被标记为迄为止最完整、详尽且易于使用的。\n\
    \n优点：注重细节，易于使用的 YaST 配置工具 \n缺点：庞大的发行版——包含超过 1,500 个捆绑包\n在 http://www.opensuse.org\
    \ 免费下载。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_12_0.png)\n\n# Mandriva\n\n\
    以前称为 Mandrake，该发行版自 1998 年以来普及度大幅上升。\n\n优点：易于使用的图形化配置，良好的支持\n缺点：不完全\n在 http://www.mandriva.com\
    \ 免费下载。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_12_1.png)\n\n# Ubuntu\n\n\
    这个发行版以前无与伦比的方式席卷了市场。它对该产品感兴趣的人。\n\n优点：伟大的社区，免费文档\n缺点：不完全\n在 http://ubuntlinux.org\
    \ 免费下载。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_12_2.png)\n\n# 硬件适用性\n\n在计算机上安装\
    \ Linux 之前，有必要评估其硬件适用性。下表建议了处理器、内存和硬盘（HD）的最低规格。\n\n> Linux 可以安装在低于这些标准的系统中。\n\n\
    | 硬件项目 | 建议最低 |\n| --- | --- |\n| CPU 速度 | 300Mhz (1.0Ghz+ 更好) |\n| 内存大小 | 128Mb\
    \ (256Mb+ 更好) |\n| 硬盘容量 | 5Gb (10Gb+ 更好) |\n\n如果计算机已经安装了 Windows，可以很容易发现 CPU 和内存信息——右键点击“计算机”图标然后选择“属性”打开系统属性对话框。详情显示在“常规”选项卡下，如下所示。\n\
    \n> CPU 和内存详情通常在计算机启动时由 BIOS 显示。\n\n![](/0494b98ec9ddc4515587e9808d73902e_13_0.png)\n\
    \n要在 Windows 中发现可用硬盘容量，点击“计算机”图标，然后右键点击硬盘图标并选择“属性”打开本地磁盘属性对话框。容量信息显示在“常规”选项卡下。在所示的硬盘上，可以将\
    \ 5Gb 的可用空间交给 Linux。在所示硬盘上分配 5Gb 给 Linux 不为 Windows 的进一步工作留下的空间不多。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_14_0.png)\n\
    \n"
