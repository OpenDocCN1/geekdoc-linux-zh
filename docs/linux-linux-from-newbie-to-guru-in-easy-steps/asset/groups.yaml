- md: '

    You can navigate through the file system in File Manager by clicking on a folder
    in the right-hand pane, or by clicking on a directory in the navigation panel,
    or by typing its name in the location field and pressing the Return key. For instance,
    navigate to the /bin directory where many of the Linux executables are stored.


    Shortcuts are marked with an arrow - as they are in Windows.


    ![](img/0494b98ec9ddc4515587e9808d73902e_62_0.png)


    Position the pointer over a file graphic and information describing the file is
    displayed on the window status bar – the screenshot above shows the bash program,
    used frequently as the Linux shell.


    Navigation buttons on the toolbar allow you to easily move forward, backward and
    up to a higher directory level.


    Most often you will want to work in the /home directory, which can be reached
    by any of the usual methods, or by simply clicking the “home” button on the toolbar
    when not in Super User Mode.


    The home button in Super User Mode takes you to root not to /home - root is the
    user’s home directory.


    ![](img/0494b98ec9ddc4515587e9808d73902e_62_1.png)


    ## Touring the file structure


    ### Finding files on the system


    It is important to recognize that many directories in Linux hidden sub-directories
    and hidden files containing configuration data. These are similar to the “System”
    files which are hidden by default in the Windows operating system. In Linux the
    name of each hidden directory and file always begins with a dot.


    A home directory viewed in Konqueror normally might not look like the screenshot
    immediately below but the hidden directories and hidden files can be revealed
    by selecting the Show Hidden Files from the View menu:


    ![](img/0494b98ec9ddc4515587e9808d73902e_63_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_63_1.png)


    ### ...cont''d


    The easiest way to locate files in KDE is with the kfind application that can
    be launched by selecting the “Find Files/Folders” option on the main Start menu.
    This provides three ways to search for a file or folder – by Name/Location, by
    Contents and Properties. Select the appropriate tab for the type of search you
    require.


    To search by Name just enter the file name into the “Named” input box then push
    the “Find” button – the search is then made and the results are displayed. To
    speed up to search on the system by indicating the starting point in the “Look
    in” input box. Check the “Include subfolders” box to search hierarchically down
    from the start point.


    In the screenshot below the wildcard * is used to search for all filenames that
    begin “sample”. This search starts in the user’s home file and includes all sub-directories:


    ![](img/0494b98ec9ddc4515587e9808d73902e_64_0.png)


    To search throughout the entire file set the starting point to “=” – the root
    of the file hierarchy, and check the Include subfolders box


    In this search part of the filename was known but a Contents search could have
    been made using a snippet of text to locate the text file or the file’s type used
    to locate one of the non-text files.


    Alternatively a Properties search could be made to locate files created or modified
    within specified times or by a specified user.


    ## 5. Touring the file structure 63


    ### File system dos and don''ts


    When organizing your files and directories in Linux it is advisable to adopt the
    recommendations listed below. These conform to accepted standards of practice
    and make working in Linux easier:


    - Never place files directly in the root directory ("/") and never create directories
    there – the top-level root directory should only contain the standard Linux subdirectories.


    - Always use your personal home directory to store all your data files – for instance,
    the /home/mike directory. Create as many sub-directories as your home directory
    but do not store data files elsewhere.


    ![](img/0494b98ec9ddc4515587e9808d73902e_65_0.png)


    - Use only lowercase when naming any data files you create this prevents any future
    hassle with capitalization errors. For instance, you won''t have to remember if
    you named a file "Mydata","MYDATA" or "MyData" – it will always be "mydata".


    - When naming files avoiding any spaces in the name. Linux can easily cope with
    these in graphical mode but it can create a problem in text mode – you will have
    to remember to prefix each space in the name with a "\" backslash character when
    referencing that file from the command line. It is much easier to simply avoid
    spaces.


    ![](img/0494b98ec9ddc4515587e9808d73902e_65_1.png)


    - Only use the root Super User account whenever it is absolutely necessary. If
    you are logged in root remember that you have absolute power – and, and therefore,
    the ability to wreak havoc. Get into the habit of working from a root user account.


    64 Linux in easy steps


    ## Handling files


    This chapter illustrates how to create and manipulate files in Linux. The concept
    of file ownership is explained and examples how to access.


    - Creating a new file | 66

    - Moving and deleting files | 68

    - Understanding permissions | 70

    - Compressing and extracting files | 72

    - Accessing files | 74


    ### Creating a new file


