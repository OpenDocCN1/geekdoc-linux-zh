- md: "\n## Working with user accounts\n\nUser accounts are administered by the root\
    \ super user who can issue a “useradd” command to specify the name of a new user\
    \ as its argument – “userdel” deletes an account in the same way. Existing accounts\
    \ can be modified by the options available to the “usermod” command. For instance,\
    \ the user login name can be changed with “usermod -l newname oldname”.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_189_0.png)\n\
    \nNever change any aspect of the root user account!\n\n| useradd | add a new user\
    \ account |\n|---|---|\n| usermod | modify an existing user account |\n| userdel\
    \ | delete an existing user account |\n| passwd | set a user account password\
    \ |\n| chfn | change personal user information |\n| finger | show personal user\
    \ information |\n\nUse the “passwd” command to change the login password and the\
    \ “chfn” command to change personal information details. Each user may use these\
    \ to change their own details or the super user can specify a user name to change\
    \ any user’s details. The “finger” command will show the personal details of any\
    \ specified user:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_189_1.png)\n\n```\n\
    In this example any user can now issue the command “finger tony” to see that's\
    \ personal details. Shell - Konsole\nSession Edit View Bookmarks Settings Help\n\
    root> useradd tony\nroot> usermod -l tony tony\nroot> passwd tony\nChanging password\
    \ for tony.\nNew Password: ******\nReenter New Password: ******\nPassword changed.\n\
    root> chfn tony\nChanging finger information for tony.\nEnter the new value, or\
    \ press ENTER\n  Full Name [:]: Toni Smith\n  Work Phone []: 555-1234\nFinger\
    \ information changed.\nroot> _\n```\n\n## Working with group accounts\n\nA group\
    \ is a set of user accounts whose rights can be modified simultaneously. The root\
    \ super user might, for instance, grant a group permission to access a particular\
    \ file that was previously inaccessible – all users who are members of that group\
    \ are then instantly able to access that file.\n\n| | | |\n|---|---|---|\n| groups\
    \ | show the group membership of a user |\n| groupadd | create a new group |\n\
    | groupmod | modify an existing group |\n| groupdel | delete an existing group\
    \ |\n\nAny user can discover which groups they belong to using the “groups” command.\
    \ Alternatively, the root user can specify a user name as its argument to reveal\
    \ group membership of that user.\n\nAs the root user, use \"groupadd\" to specify\
    \ the name of the new group, or use \"groupmod -n\" to change that of an existing\
    \ group:\n\n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\n\
    root> groups mike\nmike : users dialout video\nroot> groupadd executive\nroot>\
    \ groupmod -n exec executive\nroot> vi /etc/group\nroot> groups mike\nmike : users\
    \ dialout video exec\nroot> \n```\n\nNew groups are added to the /etc/group file\
    \ which the root user can edit. In the example above this was opened in the vi\
    \ editor and the user name \"mike\" inserted after the \"exec:\" entry. When the\
    \ file was saved the user becomes a member of the new group.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_190_0.png)\n\
    \n## Setting access permissions\n\nThe \"-l\" long command reveals the access\
    \ permissions of each item in the current directory as a string of 10 characters\
    \ at the beginning of each line. The first is a \"d\" for a directory, a dash\
    \ for a file. This is followed by sequential Read, Write and Execute permissions\
    \ for the owning User, Group, and Others. Characters \"r\", \"w\", and \"x\" appear\
    \ for those permissions that are set, otherwise a dash is shown.\n\nSee page 72\
    \ for more on understanding access permissions.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_191_0.png)\n\
    \nIn the listing below a \"common\" directory allows anyone Read, Write, and Execute\
    \ permissions. The current user can both Read and Write to \"mikestext\" file\
    \ but others may only Read It. their owning User can Read or Write of the other\
    \ three files:\n\n```\nSession Edit View Bookmarks Help\nuser> whoami\nmike\n\
    user> ls -lt\ntotal 16\ndrrwxrwxrwx 2 root users 48 15:35 mikestext\n-rw-r--r--\
    \ 1 mike users 17 15:35 file-4\n-rw------ 1 andrew root 24 15:35 file-3\n-rw------\
    \ 1 david root 19 15:34 file-2\n-rw------ 1 linda root 19 15:33 file-1\nuser>\
    \ groups\nusers dialout video exec\nuser> cat mikestext\nMike says \"Hi!\"\nuser>\
    \ cat file-1 file-2 file-3\ncat: file-1: Permission denied\ncat: file-2: Permission\
    \ denied\ncat: file-3: Permission denied\nuser> \n```\n\nNotice that this user\
    \ was made a member of the \"exec\" group.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_191_1.png)\n\
    \nEach set of permissions can also be described numerically where Read = 4, Write\
    \ = 2 and Execute = 1. For instance, a value of 7 describes full permissions to\
    \ Read, Write and Execute (4 + 2 + 1), 6 describes permissions to Read, Write\
    \ (4 + 2), and so on.\n\nPermissions can be changed at a shell prompt with the\
    \ “chmod” command stating the permission values and the file name as its arguments.\
    \ For example, the command \"chmod 777 myfile\" sets full permissions for a file\
    \ named “myfile” in the current directory. If you need to change permissions where\
    \ you are not the owner you must first assume super status with the “su” command.\n\
    \n| | |\n|---|---|\n| chmod | change access mode |\n| chgrp | change group membership\
    \ |\n| chown | change user ownership |\n\nThe “chgrp” command can be used to change\
    \ the group membership of a file by stating a group name and the file name as\
    \ its arguments. Similarly, the “chown” command can specify a user name and the\
    \ file name to change the ownership:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_192_0.png)\n\
    \nHere the access is changed on file-3 to let everyone read it. The access mode\
    \ changed on file-2 to allow group members to read it. Ownership of file-1 is\
    \ changed to the current user.\n\n```\nroot> chmod 644 file-3\nroot> chmod 640\
    \ file-2\nroot> chgrp exec file-2\nroot> chown mike file-1\nroot> exit\nlogout\n\
    user> ls -lt\ntotal 16\ndrwxrwxrwx 2 root users 48 15:35 common\n-rw-r---- 1 mike\
    \ users 17 15:35 miketest\n-rw-r--r-- 1 andrew root 24 15:35 file-3\n-rww----\
    \ 1 david 19 15:34 file-2\n-rw-r------ 1 mike root 19 15:33 file-1\nuser> cat\
    \ file-1 file-2 file-3\nLinda says \"Hello\"\nDavid says \"Howdy\"\nAndrew says\
    \ \"Greetings\"\nuser>\n```\n\n## Starting and stopping jobs\n\nA running application\
    \ can be suspended as a “job” by pressing the Ctrl+Z keys. The shell responds\
    \ with a job number, a “Stopped” confirmation message, the name of the application,\
    \ and the name of the file it has open where appropriate.\n\nIn the example below,\
    \ the vi application is first opened to edit an existing file, then the job is\
    \ suspended by Ctrl+Z. Next the vi pages are opened, then suspended. Finally the\
    \ text-only Lynx browser is opened, then suspended.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_193_0.png)\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_193_1.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> vi simple.txt\n[1]+ Stopped vi.txt\n\
    user> info vi\n[2]+ Stopped info vi\nuser> lynx\n[3]+ Stopped lynx\nuser> \n```\n\
    \nSuspended jobs can remain suspended indefinitely without any problem. Type “jobs”\
    \ at a shell prompt to see a list of jobs, marking those which are currently suspended\
    \ as “Stopped”.\n\n```\n - Konsole\nSession Edit View Bookmarks Settings Help\n\
    user> jobs\n[1]+ Stopped vi.txt\n[2] Stopped info vi\n[3]- Stopped lynx\nuser>\
    \ \n```\n\nTo resume a suspended job type the \"fg\" foreground command and the\
    \ job number, prefixed by a \"%\" character, then hit Return. For instance, the\
    \ command \"fg %1\" would resume job number 1 - in this case reopens to continue\
    \ editing the simple.txt file.\n\nWhen a background job completes it is marked\
    \ as \"Done\" in the list and will not appear in ensuing jobs lists.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_194_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nThis is simple\
    \ text that is being written using the vi text editor in a Linux shell.\n\n--\
    \ INSERT -- 1,1 All\n```\n\nJobs can also be made to run in the background using\
    \ the \"bg\" command to specify their job number. In the example below the find\
    \ command is making a list of all files with a .txt extension. It gets stopped\
    \ with Ctrl+Z, then made a background job so the user can continue working with\
    \ other shell programs.\n\nThe -fprint option writes the name of each .txt file\
    \ on a separate line in a new file, called \"list\", that creates in the current\
    \ directory.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_194_1.png)\n\n```\nroot>\
    \ find / -name *.txt -fprint txtlist\n[1+] Stopped find / -name *.txt -fprint\
    \ txtlist\nroot> bg %1\n[1+] find / -name *.txt -fprint txtlis &\nroot> jobs\n\
    [1+] Running find / -name *.txt -fprint txtlis\nroot> \n```\n\nUse the \"kill\"\
    \ command to specify a job number to be terminated. For instance, the command\
    \ \"kill %3\" terminates job number 3.\n"
  mdcn: "\n\n## 管理用户账户\n\n用户账户由 root 超级用户管理，该用户可以发布“useradd”命令并以新用户名称作为参数来指定新用户——“userdel”也以相同的方式删除账户。可以通过“usermod”命令提供的选项对现有账户进行修改。例如，可以使用“usermod\
    \ -l newname oldname”更改用户登录名。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_189_0.png)\n\
    \n永远不要更改 root 用户账户的任何属性！\n\n| useradd | 添加新用户账户 |\n|---|---|\n| usermod | 修改现有用户账户\
    \ |\n| userdel | 删除现有用户账户 |\n| passwd | 设置用户账户密码 |\n| chfn | 更改个人用户信息 |\n| finger\
    \ | 显示个人用户信息 |\n\n使用“passwd”命令更改登录密码，使用“chfn”命令更改个人信息详情。每个用户可以使用这些命令来更改自己的详情，或者超级用户可以指定用户名来更改任何用户的详情。“finger”命令将显示任何指定用户的个人详情：\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_189_1.png)\n\n```\n在此示例中，任何用户现在都可以发布“finger\
    \ tony”命令查看其个人详情。Shell - Konsole\nSession Edit View Bookmarks Settings Help\n\
    root> useradd tony\nroot> usermod -l tony tony\nroot> passwd tony\nChanging password\
    \ for tony.\nNew Password: ******\nReenter New Password: ******\nPassword changed.\n\
    root> chfn tony\nChanging finger information for tony.\nEnter the new value, or\
    \ press ENTER\n  Full Name [:]: Toni Smith\n  Work Phone []: 555-1234\nFinger\
    \ information changed.\nroot> _\n```\n\n## 管理组账户\n\n组是一组用户账户，其权限可以同时被修改。例如，root\
    \ 超级用户可能会某个组访问之前无法访问的特定文件的权限——随后该组的所有成员都立即能够访问该文件。\n\n| | | |\n|---|---|---|\n\
    | groups | 显示用户的组组成情况 |\n| groupadd | 创建新组 |\n| groupmod | 修改现有组 |\n| groupdel\
    \ | 删除现有组 |\n\n任何用户都可以使用“groups”命令发现自己属于哪些组。或者，root 用户可以指定用户名作为参数来显示该用户的组组成情况。\n\
    \n作为 root 用户，使用“groupadd”指定新组的名称，或使用“groupmod -n”更改现有组的名称：\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nroot> groups mike\nmike : users dialout\
    \ video\nroot> groupadd executive\nroot> groupmod -n exec executive\nroot> vi\
    \ /etc/group\nroot> groups mike\nmike : users dialout video exec\nroot> \n```\n\
    \n新组被添加到 /etc/group 文件中，root 用户可以编辑该文件。在上面的示例中，文件在 vi 编辑器中打开，用户名 \"mike\" 被插入到\
    \ \"exec:\" 条目之后。当文件保存时，该用户就成为了新组的成员。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_190_0.png)\n\
    \n## 设置访问权限\n\n“-l”长命令会显示当前目录中每个项目的访问权限，显示为每行开头的 10 个字符的字符串。第一个字符是“d”表示目录，横杠表示文件。随后是针对所有者（User）、组（Group）和其他人（Others）的顺序读（Read）、写（Write）和执行（Execute）权限。对于已设置的权限显示字符“r”、“w”和“x”，否则显示横杠。\n\
    \n关于理解访问权限的更多信息，请参见第 72 页。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_191_0.png)\n\
    \n在下面的列表中，“common”目录允许任何人读写。当前用户可以读取并写入“mikestext”文件，但其他人只能读取它。他们的所有者可以对其他三个文件进行读取或写入：\n\
    \n```\nSession Edit View Bookmarks Help\nuser> whoami\nmike\nuser> ls -lt\ntotal\
    \ 16\ndrrwxrwxrwx 2 root users 48 15:35 mikestext\n-rw-rr-- 1 mike users 17 15:35\
    \ file-4\n-rw------ 1 andrew root 24 15:35 file-3\n-rw------ 1 david root 19 15:34\
    \ file-2\n-rw------ 1 linda root 19 15:33 file-1\nuser> groups\nusers dialout\
    \ video exec\nuser> cat mikestext\nMike says \"Hi!\"\nuser> cat file-1 file-2\
    \ file-3\ncat: file-1: Permission denied\ncat: file-2: Permission denied\ncat:\
    \ file-3: Permission denied\nuser> \n```\n\n注意此用户已成为“exec”组的成员。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_191_1.png)\n\
    \n每组权限也可以用数字描述，其中读 = 4，写 = 2，执行 = 1。例如，值 7 描述读、写、执行的完全权限（4 + 2 + 1），6 描述读、写的权限（4\
    \ + 2），依此类推。\n\n可以在 shell 提示符下使用“chmod”命令更改权限，并将权限值和文件名作为参数。例如，命令“chmod 777 myfile”为当前目录中名为“myfile”的文件设置完全权限。如果你需要更改你不是所有者的文件权限，必须先使用“su”命令获取超级状态。\n\
    \n| | |\n|---|---|\n| chmod | 更改访问模式 |\n| chgrp | 更改组组成情况 |\n| chown | 更改用户所有权\
    \ |\n\n“chgrp”命令可以通过指定组名和文件名作为参数来更改文件的组组成情况。同样，“chown”命令可以指定用户名和文件名。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_192_0.png)\n\
    \n“chgrp”命令可以通过指定组名和文件名作为参数来更改文件的组组成情况。同样，“chown”命令可以指定用户名和文件名。\n\n在列表中显示“common”目录。\n\
    \n```\nSession Edit View Bookmarks Help\nuser> whoami\nmike\nuser> ls -lt\ntotal\
    \ 16\ndrrwxrwxrwx 2 root users 48 15:35 mikestext\n-rw-r--r-- 1 mike users 17\
    \ 15:35 file-4\n-rw------ 1 andrew root 24 15:35 file-3\n-rw------ 1 david root\
    \ 19 15:34 file-2\n-rw------ 1 linda root 19 15:33 file-1\nuser> groups\nusers\
    \ dialout video exec\nuser> cat mikestext\nMike says \"Hi!\"\nuser> cat file-1\
    \ file-2 file-3\ncat: file-1: Permission denied\ncat: file-2: Permission denied\n\
    cat: file-3: Permission denied\nuser> \n```\n\n## 启动和停止任务\n\n通过 Ctrl+Z 可以将运行中的应用程序挂起。shell\
    \ 会响应任务号、“已停止（Stopped）”消息以及应用程序名称。在下面的示例中，vi 程序首先被打开进行编辑，然后被挂起。最后 Lynx 浏览器被打开并挂起。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_193_0.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_193_1.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> vi simple.txt\n\
    [1]+ Stopped vi.txt\nuser> info vi\n[2]+ Stopped info vi\nuser> lynx\n[3]+ Stopped\
    \ lynx\nuser>\n```\n\n挂起的任务可以无限期挂起。在 shell 提示符下输入“jobs”可以查看任务列表，并将挂起的任务标记为“已停止（Stopped）”。\n\
    \n```\n - Konsole\nSession Edit View Bookmarks Help\nuser> jobs\n[1]+ Stopped\
    \ vi.txt\n[2] Stopped info vi\n[3]- Stopped lynx\nuser>\n```\n\n要恢复挂起的任务，输入“fg”命令以及带有“%”字符的任务号，然后按回车。例如，命令“fg\
    \ %1”将恢复任务号 1——在这种情况下是重新打开 simple.txt 文件。\n\n当后台任务完成后，它会在列表中标记为“已完成（Done）”，并将不再出现在随后的任务列表中。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_194_0.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nThis is simple text that is being written\
    \ using the vi text editor in a Linux shell.\n\n-- INSERT -- 1,1 All\n```\n\n\
    任务也可以使用“bg”命令通过指定任务号来在后台运行。在下面的示例中，find 命令正在创建所有 .txt 扩展名文件的列表。它被 Ctrl+Z 停止，然后变为后台任务，以便用户继续使用其他\
    \ shell 程序。\n\n-fprint 选项将每个 .txt 文件的名称写入一个新文件，名为“list”，该文件创建在当前目录。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_194_1.png)\n\
    \n```\nroot> find / -name *.txt -fprint txtlist\n[1+] Stopped find / -name *.txt\
    \ -fprint txtlist\nroot> bg %1\n[1+] find / -name *.txt -fprint txtlis &\nroot>\
    \ jobs\n[1+] Running find / -name *.txt -fprint txtlis\nroot> \n```\n\n使用“kill”命令指定要终止的任务号。例如，命令“kill\
    \ %3”将终止任务 3。\n\n"
