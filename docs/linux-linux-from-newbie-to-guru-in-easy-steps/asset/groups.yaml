- md: "\n...cont'd\n\nThe \"telnet\" command launches the telnet program and the prompt\
    \ changes to let you know that you are using the telnet console. Supply a hostname,\
    \ or its IP address, to the \"open\" telnet command then enter a valid login name\
    \ when requested to connect to that system. Typically the remote computer will\
    \ be using a Unix-based operating system, like Linux, so will recognize bash shell\
    \ commands for navigation – cd, ls, pwd, etc..\n\nLogging out from the remote\
    \ computer can involve some guesswork as it depends on logoff command it uses\
    \ – try \"quit\", \"end\", \"close\", \"stop\", \"logout\", and \"logoff\".\n\n\
    | command | description |\n| :--- | :--- |\n| telnet | open the telnet console\
    \ program |\n| ssh | securely connect to a remote computer |\n\nTelnet is quite\
    \ an old program and unfortunately the data transmitted by telnet is only sent\
    \ in plain text format – so is easy for others to steal passwords and information.\
    \ A more secure alternative is provided by the \"ssh\" shell command.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_202_0.png)\n\
    \nWhere possible use ssh rather than telnet for better security.\n\nThe ssh command\
    \ encrypts all data that travels across the network including your user name and\
    \ the password you will need to connect to the remote computer. It can also make\
    \ sophisticated secure logins using public keys for user authentication. A simple\
    \ password authenticated login looks like the example below:\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> ssh mike@example.com\nmike@example.com's\
    \ password: ******\nLast login: Sun Oct 9 14:10:00 2005\nYour Operating System\
    \ is Linux\nWelcome to... the example domain\nChecking your file quota... OK\n\
    mike@example.com->\n```\n\n## Transferring files over a network\n\nYou can send\
    \ files over a network using File Transfer Protocol. The \"ftp\" command launches\
    \ the ftp program and the prompt changes to let you know that you are using the\
    \ ftp console. Supply a hostname, or its IP address, to the \"open\" ftp command\
    \ then enter a valid login name when requested to connect to that system.\n\n\
    If the host is running a Unix-based operating system it will recognize bash shell\
    \ commands for navigation – cd, ls, pwd, etc.. Use the \"put\" ftp command, followed\
    \ by a file name, to transfer a copy of your file from your local system to the\
    \ remote host:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_203_0.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_203_1.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> ftp\n\
    ftp> open upload.ntlworld.com\nConnected to upload.ntlworld.com.\n220-######################################\n\
    220-\n220- Welcome to upload.ntlworld.com\n220-######################################\n\
    220 upload.ntlworld.com FTP server ready\nName (upload.ntlworld.com:mike): mike_mcgrath\n\
    331 Password required for mike_mcgrath\nPassword: ********\n230 User mike mcgrath\
    \ logged in.\nRemote system type is UNIX.\nUsing binary mode to transfer files.\n\
    ftp> put otherbooks.txt\n150 Opening BINARY mode for otherbooks.txt\n227 Entering\
    \ Passive Mode\n100% |**** 158 734.74 KB/s 00:00 ETA\n226 Transfer complete.\n\
    158 bytes sent in 00:00 (4.96 KB/s)\nftp> ls\n150 Opening ASCII mode data connection\
    \ for list\n-rw-r---- otherbooks.txt\n226-Transfer complete.\n```\n\nText files\
    \ on an ftp server can be read without downloading them to your local system –\
    \ for instance, you could issue the command “page otherbooks.txt” to read the\
    \ file uploaded in the last example:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_204_0.png)\n\
    \nThe \"page\" command recognized by the ftp server is a Unix command that works\
    \ like the Linux \"less\" command.\n\n```\nShell - Konsole\nSession Edit View\
    \ Bookmarks Settings Help\nC Programming in easy steps\nC++ Programming in easy\
    \ steps\nJava in easy steps\nJavaScript in easy steps\nHTML in easy steps\nCSS\
    \ in easy steps\nSQL in easy steps\nlines 1-8/8 (END)\n```\n\n| command | description\
    \ |\n| :--- | :--- |\n| ftp | open the ftp console program |\n| open | connect\
    \ to an ftp server |\n| put | copy a file to the remote system |\n| mput | copy\
    \ multiple files to a remote system |\n| get | copy a remote file to the local\
    \ system |\n| mget | copy multiple remote files to the local system |\n| exit\
    \ | logout of the ftp console |\n\nMultiple files can be transferred up to a remote\
    \ system using the “mput” command together with the * wildcard character. The\
    \ command “input *” simply copies all files in the current local directory to\
    \ the current remote working directory.\n\nSimilarly, the “get” and “mget” commands\
    \ can be used to copy files in the other direction – going from the remote system\
