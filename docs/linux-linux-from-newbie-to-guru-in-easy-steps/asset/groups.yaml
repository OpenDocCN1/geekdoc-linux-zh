- md: "\n## Branching statements\n\nAn “if-then” statement, specifying a command to\
    \ execute only when an expression evaluates as true, can be extended to specify\
    \ an alternate command to execute when it evaluates as false. The alternate command\
    \ is specified after an “else” keyword that is inserted into the “if-then” statement,\
    \ after the “then” part:\n\nThese expressions use “gt” greater than, and “lt”\
    \ less than, numeric comparison operators\n\n```bash\nShell - Konsole\nSession\
    \ Edit View Bookmarks Settings\nuser> if [ 7 -gt 3 ]\n> then echo \"greater\"\n\
    > else echo \"less\"\n> fi\ngreater\nuser> if [ 7 -lt 3 ]\n> then echo \"greater\"\
    \n> else echo \"less\"\n> fi\nless\nuser>\n```\n\nThis process is known as “conditional\
    \ branching” – for the statement “branches” to execute only the “condition” that\
    \ is true. You can add subsequent evaluations with the “elif” keyword. This combines\
    \ “else” and “if” to allow complex conditional branching:\n\nThe `tick characters\
    \ around “whoami” in this example make the comparison against the result from\
    \ that command – they appear in the code on page 148 that is used to customize\
    \ the shell prompt.\n\n```bash\nShell - Konsole\nSession Edit View Bookmarks Settings\
    \ Help\nuser> if [ `whoami` = \"root\" ]\n> then echo \"Hello SuperUser\"\nelif\
    \ [ `whoami` = \"mike\" ]\n> then echo \"Hello Mike\"\n> else echo \"Hello Guest\"\
    \n> fi\nHello Mike\nuser>\n```\n\nThe last example can be created as a script\
    \ and extended to identify the current directory. Bash shell scripts are simply\
    \ text files containing a series of commands, like those used at the shell prompt\
    \ in the last few examples. The start of the first line must be \"##!/bin/bash\"\
    \ to specify the location of a program to execute the script - in this case it's\
    \ the bash shell program in /bin:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_216_0.png)\n\
    \nThe first line of a bash script is known as the \"#sh-bang\" line after the\
    \ \"#!\" bang characters.\n\n```bash\n#!/bin/bash\nif [ whoami = \"root\" ]\n\
    then echo \"Hello SuperUser at $(pwd)\"\nelif [ whoami = \"mike\" ]\nthen echo\
    \ \"Hello Mike at $(pwd)\"\nelse echo \"Hello Guest at $(pwd)\"\n\n:w hello\n\
    ```\n\nWith the script saved in the current directory it just needs to become\
    \ executable with chmod 711 - so the owner can Read, Write, and Execute but all\
    \ others can just Execute. Type the \"/\" command and file name to run the script:\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_216_1.png)\n\nRemember that logging\
    \ into the root account puts you in the root directory - the super user must state\
    \ the full path to the script to execute.\n\n```bash\nuser chmod 711 hello\nuser>\
    \ ls -lo hello\n-rw-r--x 1 mike 171 2005-10-14 19:25 hello\nuser> ./hello\nHello\
    \ Mike at /home/mike\nuser> su -l\nPassword: *****\nroot> /home/mike/hello\nHello\
    \ SuperUser at /root\nroot> \n```\n\nThe \"case-in\" statement provides another\
    \ way to perform conditional branching as an alternative to \"if-then-else\" statements.\
    \ It matches a single value to a branch and executes its command/s. The supplied\
    \ value is specified after the \"case\" keyword, then the \"in\" keyword begins\
    \ a list of branches. Each branch specifies a possible value to match followed\
    \ by a \\) parenthesis, the code to execute, and a \";\" terminator. Finally,\
    \ the \"esac\" keyword marks the end of the entire case statement.\n\nOften a\
    \ case statement will be used to evaluate the value stored in a variable, typically\
    \ input from a user, and provide many branches. It is used in exactly this way\
    \ in the script below:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_217_0.png)\n\
    \n```bash\n#!/bin/bash\nclear\necho \"Font Color Menu\"\necho \"==================\"\
    \necho -en \"[1] Red\\n[2] Green\\n[3] Brown\\n\"\necho -en \"[4] Blue\\n[5] Purple\\\
    n[6] Cyan\\n\"\necho -n \"[X] Exit or make a selection: \"\nread CHOICE\ncase\
    \ $CHOICE in\n1) echo -e \"\\e[033;31m\"\n2) echo -e \"\\e[033;32m\"\n3) echo\
    \ -e \"\\e[033;33m\"\n4) echo -e \"\\e[033;34m\"\n5) echo -e \"\\e[033;35m\"\n\
    6) echo -e \"\\e[033;36m\"\nx) echo -e \"\\e[033;37m\"\nesac\nif [ $CHOICE !=\
    \ \"x\" ]\nthen echo -e \"Thank you for choosing $CHOICE\\n\"\nfi\n```\n\nThese\
    \ color specifiers are like those used on page 148 to customize the shell prompt.\n\
    \nLinux in easy steps\n\nWhen the user enters one of the possible options its\
    \ value is assigned to the variable by the “read” command. The case statement\
    \ examines the variable looks for a branch beginning with a matching value, then\
    \ executes its command. In this case the command sets a temporary font color that\
    \ is used to display a message, then the shell resumes its regular colors:\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_218_0.png)\n![](img/0494b98ec9ddc4515587e9808d73902e_218_1.png)\n\
    \n## Looping constructs\n\nLoops allow one or more commands to be executed repeatedly\
    \ while a condition remains true. Each iteration (pass) of the loop will evaluate\
    \ a specified expression and when it is found to be true the loop will continue.\
    \ The shell provides three types of loop:\n\n- The \"while\" loop construct specifies\
    \ the test expression to the \"while\" keyword and its command/s to be executed\
    \ on each iteration between \"do\" and \"done\". It will continue until evaluation\
    \ becomes false.\n- Similarly, an \"until\" loop construct specifies the test\
    \ expression to the \"until\" keyword and its command/s to be executed on each\
    \ iteration between \"do\" and \"done\". Subtly different, it will continue until\
    \ evaluation becomes false.\n- A \"for-in\" loop simply performs one iteration\
    \ for each item in a given list. A single iteration can be skipped in any type\
    \ of loop by inserting an \"if\" statement into the body of the loop. This can\
    \ make a further evaluation which, when true, can call upon the \"continue\" keyword\
    \ to skip to the next iteration. Unless the loop body changes the tested evaluation\
    \ the loop will never end you accidentally press Ctrl+C to stop the loop running.\
    \ Alternatively, the inserted \"if\" statement could end the loop entirely by\
    \ calling upon the \"break\" keyword when it found.\n\nEach type of loop appears\
    \ in the script opposite and are initially set to make eight iterations, writing\
    \ out the number of the current iteration on each pass. The \"for\" loop contains\
    \ an \"if\" statement that forces the third iteration to be skipped. It also contains\
    \ an \"if\" statement that terminates the loop on the seventh iteration.\n\nNotice\
    \ the comments added to this script - after the #! line a \"#\" character is ignored.\
    \ Trivial counter variables are normally lowercase - such as $i, $j, and $k in\
    \ this example.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_220_0.png)\n\nAlthough\
    \ the \"for\" loop in this case iterates a list of numbers it could iterate a\
    \ list of strings using the \"$string\" equality operator in place of the \"-eq\"\
    \ numeric equality operator.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_220_1.png)\n\
    \n```bash\n#!/bin/bash\nclear\ni=1; echo -n \"While loop: \"\nwhile [ $i -lt 9\
    \ ] #test\ndo\necho -n \"...$i\" #output\ni=$(expr $i + 1) #increment\ndone; echo\
    \ \"\"\n\nj=1; echo -n \"Until loop: \"\nuntil [ $j -eq 9 ] #test\ndo\necho -n\
    \ \"...$j\" #output\nj=$(expr $j + 1) #increment\ndone; echo \"\"\necho -n \"\
    For loop: \"\nfor k in 1 2 3 4 5 6 7 8\ndo\nif [ $k -eq 3 ]; then continue; fi\n\
    if [ $k -eq 7 ]; then break; fi\necho -n \"...$k\"\ndone; echo \" \"\n```\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_220_2.png)\n\n```\nWhile loop: ...1...2...3...4...5...6...7...8\n\
    Until loop: ...1...2...3...4...5...6...7...8\nFor loop: ...1...2...3...4...5...6\n\
    user> █\n```\n\n## Generating random numbers\n\nThe $RANDOM variable generates\
    \ a \"random\" positive integer from 0 to 32,767 each time it is called upon.\
    \ To set a range for the random numbers use the \"%\" modulus operator to specify\
    \ the maximum number. For instance, to set the range from 0 to 19 use ($RANDOM\
    \ % 20) – divides whatever number has been generated by 20, leaving a leftover\
    \ number of zero to 19. Adding 1 to the expression with ($RANDOM % 20 + 1) increases\
    \ the range so that random number will be between 1 and 20.\n\nThe numbers generated\
    \ by $RANDOM are not truly random as it generates the same sequence given the\
    \ starting point (seed):\n\n![](img/0494b98ec9ddc4515587e9808d73902e_221_0.png)\n\
    \n```\nSession Edit View Settings Help\nuser RANDOM=1\nuser echo $RANDOM; echo\
    \ $RANDOM; echo $RANDOM\n17767\n9158\n6249\nuser RANDOM=1\nuser echo $RANDOM;\
    \ echo $RANDOM; echo $RANDOM\n17767\n9158\n6249\nuser> \n```\n\nIn order to ensure\
    \ the $RANDOM variable generates different sequences of numbers when called it\
    \ is necessary to set it with different starting seed values.\n\nA solution is\
    \ to extract a dynamic value from one of its options using the \"date\" command.\
    \ One of its options \"+%s\" delivers the current number of seconds that have\
    \ elapsed since the epoch – defined as 00:00:00 GMT on January 1, 1970. Using\
    \ this to seed the $RANDOM variable gets better random number generation.\n\n\
    The script opposite begins by extracting the current elapsed time from the date\
    \ command to seed the $RANDOM shell variable.\n"
  mdcn: "\n\n## 分支语句\n\n“if-then”语句用于指定在表达式求为真时才执行的命令，它可以扩展为指定在表达式求为假时执行的备用命令。备用命令指定在“else”关键字之后，该关键字被插入在“if-then”语句的“then”部分之后：\n\
    \n这些表达式使用了“gt”（大于）和“lt”（小于）这些数值比较运算符\n\n```bash\nShell - Konsole\n会话 编译 视图 签签\
    \ 设置\nuser> if [ 7 -gt 3 ]\n> then echo \"greater\"\n> else echo \"less\"\n> fi\n\
    greater\nuser> if [ 7 -lt 3 ]\n> then echo \"greater\"\n> else echo \"less\"\n\
    > fi\nless\nuser>\n```\n\n这个过程被称为“条件分支”——使语句“分支”并仅执行求为真的“条件”。你可以使用“elif”关键字添加后续的评估。这结合了“else”和“if”，允许进行复杂的条件分支：\n\
    \n此示例中“whoami”周围的引号符号使结果与该命令的结果进行比较——它们出现在第 148 页用于自定义 shell 提示符的代码中。\n\n```bash\n\
    Shell - Konsole\n会话 编译 视图 签签 设置 帮助\nuser> if [ `whoami` = \"root\" ]\n> then echo\
    \ \"Hello SuperUser\"\nelif [ `whoami` = \"mike\" ]\n> then echo \"Hello Mike\"\
    \n> else echo \"Hello Guest\"\n> fi\nHello Mike\nuser>\n```\n\n最后一个示例可以创建为脚本并扩展以识别当前目录。Bash\
    \ shell 脚本仅仅是包含系列命令的文本文件，就像最后几个示例在 shell 提示符处使用的命令一样。第一行的开头必须是“#!/bin/bash”，以指定执行脚本的程序的位置——在这种情况下，它是\
    \ /bin 中的 bash 这种壳程序：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_216_0.png)\n\
    \nbash 脚本的第一行在“#!” bang 字符之后被称为“#sh-bang”行。\n\n```bash\n#!/bin/bash\nif [ whoami\
    \ = \"root\" ]\nthen echo \"Hello SuperUser at $(pwd)\"\nelif [ whoami = \"mike\"\
    \ ]\nthen echo \"Hello Mike at $(pwd)\"\nelse echo \"Hello Guest at $(pwd)\"\n\
    \n:w hello\n```\n\n将脚本保存在当前目录后，只需通过 `chmod 711` 使其变为可执行——这样所有者可以读取、写入和执行，但所有其他人只能执行。输入“/”命令和文件名来运行脚本：\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_216_1.png)\n\n记住登录 root 账户将你处于 root\
    \ 目录——超级用户必须指定脚本的完整路径才能执行。\n\n```bash\nuser chmod 711 hello\nuser> ls -lo hello\n\
    -rw-r--x 1 mike 171 2005-10-14 19:25 hello\nuser> ./hello\nHello Mike at /home/mike\n\
    user> su -l\nPassword: *****\nroot> /home/mike/hello\nHello SuperUser at /root\n\
    root> \n```\n\n“case-in”语句提供了另一种执行条件分支的方法，作为“if-then-else”语句的替代。它将单个值匹配到一个分支并执行其命令/多个命令。提供的值指定在“case”关键字之后，然后“in”关键字开始一个分支列表。每个分支指定一个可能的匹配值，后跟一个\
    \ \\) 括号、要执行的代码和一个分号 终止符。最后，“esac”关键字标记整个 case 语句的结束。\n\ncase 语句通常用于评估存储在变量中的值（通常来自用户输入）并提供许多分支。在下面的脚本中正是这种方式使用的：\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_217_0.png)\n\n```bash\n#!/bin/bash\n\
    clear\necho \"Font Color Menu\"\necho \"==================\"\necho -en \"[1] Red\\\
    n[2] Green\\n[3] Brown\\n\"\necho -en \"[4] Blue\\n[5] Purple\\n[6] Cyan\\n\"\n\
    echo -n \"[X] Exit or make a selection: \"\nread CHOICE\ncase $CHOICE in\n1) echo\
    \ -e \"\\e[033;1m\"\n2) echo -e \"\\e[033;2m\"\n3) echo -e \"\\e[033;3m\"\n4)\
    \ echo -e \"\\e[033;4m\"\n5) echo -e \"\\e[033;5m\"\n6) echo -e \"\\e[033;6m\"\
    \nx) echo -e \"\\e[033;7m\"\nesac\nif [ $CHOICE != \"x\" ]\nthen echo -e \"Thank\
    \ you for choosing $CHOICE\\n\"\nfi\n```\n\n这些颜色标识类似于第 148 页用于自定义 shell 提示符的那些。\n\
    \nLinux Linux\n\n当用户输入一个可能的选项时，“read” 命令将其值赋值给变量。case 语句检查匹配的值，然后执行其命令。在这种情况下，命令设置临时字体颜色显示消息，然后\
    \ shell 恢复常规颜色：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_218_0.png)\n![](img/0494b98ec9ddc4515587e9808d73902e_218_1.png)\n\
    \n## 循环结构\n\n循环允许在条件为真时重复执行一个或多个命令。循环每次迭代（pass）都会评估指定的表达式，当发现为真时循环继续。shell 提供了三种循环：\n\
    \n- “while”循环结构为“while”关键字指定测试表达式以及在“do”和“done”之间执行的命令。它将持续直到评估为假。\n- 同样，“until”循环结构为“until”关键字指定测试表达式以及在“do”和“done”之间执行的命令。细微的差别在于，它将持续直到评估为真。\n\
    - “for-in”循环只需为给定列表中的每个项目执行一次迭代。通过在任何类型的循环中插入“if”语句可以跳过单次迭代。这可以产生进一步的评估，当为真时调用“continue”关键字跳到下次迭代。除非循环体改变了测试评估，否则循环永远不会结束，除非意外按下\
    \ Ctrl+C 停止循环运行。或者，插入的“if”语句可以在发现时调用“break”关键字完全结束循环。\n\n每种类型的循环都出现在脚本中，并初始设置为进行八次迭代，每次通过时输出当前迭代的数字。“for”循环包含一个“if”语句强制跳过第三次迭代。它还包含一个在第七次迭代时终止循环的“if”语句。\n\
    \n注意添加到此脚本的注释——在 #! 行之后，“#”字符被忽略。简单的计数器变量通常是小写的——例如此示例中的 $i、$j 和 $k。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_220_0.png)\n\
    \n尽管此例中的“for”循环迭代的是数字列表，但它可以使用 “$string” 相等运算符代替 \"-eq” 数值相等运算符来迭代字符串列表。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_220_1.png)\n\
    \n```bash\n#!/bin/bash\nclear\ni=1; echo -n \"While loop: \"\nwhile [ $i -lt 9\
    \ ] #test\ndo\necho -n \"...$i\" #output\ni=$(expr $i + 1) #increment\ndone; echo\
    \ \"\"\n\nj=1; echo -n \"Until loop: \"\nuntil [ $j -eq 9 ] #test\ndo\necho -n\
    \ \"...$j\" #output\nj=$(expr $j + 1) #increment\ndone; echo \"\"\necho -n \"\
    For loop: \"\nfor k in 1 2 3 4 5 6 7 8\ndo\nif [ $k -eq 3 ]; then continue; fi\n\
    if [ $k -eq 7 ]; then break; fi\necho -n \"...$k\"\ndone; echo \" \"\n```\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_220_2.png)\n\n```\nWhile loop: ...1...2...3...4...5...6...7...8\n\
    Until loop: ...1...2...3...4...5...6...7...8\nFor loop: ...1...2...4...5...6...8\n\
    user> █\n```\n\n## 生成随机数\n\n$RANDOM 变量每次被调用时生成一个从 0 到 32767 的“随机”整数。要为随机数设置范围，使用“”模运算符指定最大数。例如，要将范围设置为\
    \ 0 到 19，使用 ($RANDOM % 20) 将生成的任何数字除以 20，留下零到 19 之间的数字。在表达式中加上1 ($RANDOM % 20\
    \ + 1) 会扩大范围，使随机数位于 1 到 20 之间。\n\n$RANDOM 生成的数字并不是真正的随机，因为它在给定起始点（种子）的情况下生成相同的序列：\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_221_0.png)\n\n```\n会话 编译 视图 设置 帮助\n\
    user RANDOM=1\nuser echo $RANDOM; echo $RANDOM; echo $RANDOM\n17767\n9158\n6249\n\
    user RANDOM=1\nuser echo $RANDOM; echo $RANDOM; echo $RANDOM\n17767\n9158\n6249\n\
    user> \n```\n\n为了确保 $RANDOM 变量在调用时生成不同的数字序列，有必要使用不同的起始种子值对其设置。\n\n解决方案是使用“date”命令从它的选项之一中提取动态值。它的选项之一\
    \ \"+%s”交付了自太元以来流过的当前秒数。使用这来为 $RANDOM 变量种子可以获得更好的随机数生成。\n\n相反脚本首先从 date 命令的选项中提取当前流逝时间，为\
    \ $RANDOM shell 变量种子。\n\n"
