    # Creating and editing graphics


    This chapter looks at the most popular graphics manipulation software in Linux
    – the GNU Image Manipulation Program (GIMP) that is bundled with nearly all distributions.
    This chapter examines some of the GIMP''s prominent features and contrasts the
    application to the market leading Adobe Photoshop program.


    # Covers


    +   - Introducing the GIMP | 102

    - Starting a new image | 104

    - Finding the menus | 105

    - Opening selection dialogs | 106

    - Working with layers | 108

    - Selecting areas | 110

    - Using filters | 112

    - Running scripts | 114

    - Storing photos | 116

