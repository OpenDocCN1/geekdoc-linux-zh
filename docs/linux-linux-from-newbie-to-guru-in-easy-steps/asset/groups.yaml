    \ in Easy Steps (In Easy Series)\nMike McGrath\n(Option list) Hit return and use\
    \ arrow keys\nArrow keys: Up and Down to move\nfollow a link; Left to go back.\
    \ Help Options\n```\n\n## Sending and receiving mail\n\nAll system users can send\
    \ internal mail to each other by typing the \"mail\" command at a shell prompt\
    \ and supplying the recipient’s user name as its argument. This launches the mail\
    \ program in the shell window which first invites you to enter a subject title\
