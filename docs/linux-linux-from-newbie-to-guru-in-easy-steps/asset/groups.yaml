    # Sending and receiving email


    Many Linux distros include the popular KMail application. In SUSE it can be launched
    from the Start, Internet, E-Mail menu or by running the command “kmail”.


    On initial launch, an account needs to be configured with your own email settings.
    Select the “Configure KMail” option on the Settings menu to launch the Configure
    dialog then push the Modify button to edit the default identity details. Now enter
    your own name and email address with the exact name of your incoming (POP) mail
    server and access password – your ISP will provide this information.


    KMail includes filters to control Junk Mail – find options under the Tools menu.


    ![](img/0494b98ec9ddc4515587e9808d73902e_93_0.png)


    In the next dialog enter the exact name of your outgoing (SMTP) server to complete
    the Account configuration.'
