    # Voice calling over the internet application


    Many Linux distros now include the KPhone that lets you make telephone calls over
    the internet using VoIP (Voice over IP) technology.


    Before you can use KPhone you will need to open an account with an open network
    service provider such as Free World Dialup (www.freeworlddialup.com) – at the
    time of writing this is free. Once you have opened an FWD account you will receive
    your personal FWD phone number and you''re ready to configure KPhone.


    In SUSE Linux, launch KPhone with the Start, Internet, Telephone menu then choose
    “A SIP phone for KDE”, or Run the kphone command. Next click the File, Identity
    menu to open the configuration dialog and enter your FWD account details:


    ![](img/0494b98ec9ddc4515587e9808d73902e_97_0.png)


    | kphone <2> |

    | :--- |

    | Full Name: |

    | Mike McGrath |

    | User Part of SIP URL: |

    | <your FWD phone number> |

    | Host Part of SIP URL: |

    | fwd.pulver.com |

    | Outbound Proxy (optional): |

    | Authentication Username (optional): |

    | <your FWD phone number> |

    | q-value between 0.0-1.0 (optional): |

    | X Auto Register |

    | Registration: not registered |

    | Register help... OK Cancel |


    Check the text box to Auto Register then click the OK button to complete the Identity
    configuration.


    If your Internet connection is behind a NAT (Network Address Translation) device,
    such as a household router, you should also edit the Preferences, SIP Preferences
    settings by checking the option to “Use STUN Server” on the Socket tab.


    Once configuration is done, the KPhone interface will show your FWD number and
    host name on the “sip:” line.


    Plug in a microphone and headset then in the KPhone address field type “612@fwd.pulver.com”
    (notice that it''s 612). Now push the call button situated immediately after the
    address field:


    The Free World Dialup website includes a comprehensive Configuration Guide and
    offers helpful support if you encounter problems.


    HOT TIP


    ![](img/0494b98ec9ddc4515587e9808d73902e_98_0.png)


    A dialog will appear requesting your FWD password. Enter your password then, after
    a few seconds, you will hear the time and date spoken through your headphones.
    The call is then automatically terminated.


    Now type “613@fwd.pulver.com” (notice that now''s 613) into the KPhone address
    field and again push the call button to dial before. After a few seconds you''ll
    hear a ringing tone then the other side will connect. Next you will hear a spoken
    message with instructions on how to test the echo cancellation mode.


    KPhone can now be used to make free VoIP phone calls.


    # Transferring files


    Transferring files online using the File Transfer Protocol (FTP) is made simple
    in KDE by the Konqueror browser. Launch Konqueror from the Start, Internet, Web
    Brows or using the Run konqueror command.


    Type the address of the FTP server you wish to access in Konqueror''s address
    field, then hit the Return key:


    ![](img/0494b98ec9ddc4515587e9808d73902e_99_0.png)


    Some distros also include a BitTorrent client called ktorrent which can be used
    to transfer files.


    When the Authorization Dialog appears, you can enter a valid Username and Password
    to open the target directory, displaying its contents within the Konqueror window.
    You can drag''n''drop files into that window, to upload them to the server, or
    from that window to download them to your system. This makes transferring files
    via FTP just as easy as working with local files.


