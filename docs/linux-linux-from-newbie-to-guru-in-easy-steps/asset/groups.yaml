    # Formulas in OpenOffice Math


    The Math application within the OpenOffice suite allows mathematical formulas
    to be inserted into documents in a strictly controlled format. With a document
    open in OpenOffice Writer click on the Insert, Object, Formula menu to enter formula
    mode – a “command” area appears at the bottom of the window.


    Right-click on the command area to see the range of predefined formula controls
    on the context menu. Select any one of these, or type directly in the command
    area to build the formula. When completed, click in the main window to close the
    command.


    In formula mode, click on the Tools, Catalog menu to find a catalog of mathematical
    symbols that can be inserted into a formula. This includes Greek characters and
    also has a “Special” collection where you can add your own symbols.


    Catalog symbols are referenced by their name with a & character in the command
    code – in the example shown below &, &x and &pi reference Special catalog symbols.
    Notice that expressions are enclosed within curly brackets and the ~tilde adds
    spacing.


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_0.png)


    The Math application cannot calculate a formula – it is merely a tool to allow
    formula formatting within documents.


    ![](img/0494b98ec9ddc4515587e9808d73902e_89_1.png)


    The Bernoulli principle is important in aerodynamics.


    Bernoulli numbers are defined by:


    ```

    e^{-x} = \frac{1}{1} - \frac{B_2}{2!}x^2 + \frac{B_4}{4!}x^4 ...

    ```


    ```

    x - \cot(x) = \frac{B_2}{2!}x^3 + \frac{B_4}{4!}x^5 + \frac{6}{6!}x ...

    ```


    ```

    size 12 color red

    1-(~x over 2)~~cot((x over 2))~~

    (B_0*x^0) over (0)~~~

    (B_2*x^4) over (4)~~~

    (B_4*x^6) over (6)~~dotsaxis

    abs(~x)~~~&pi

    ```'
