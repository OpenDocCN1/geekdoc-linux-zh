    # Making backups


    Linux provides many tools to archive your data and backup your system onto a tape
    drive, CD, remote machine or other location.


    | cpio | copy output to, or input from, an archive file |

    | tar | create, view, or extract, a tape archive file |


    The "cpio" command can be used to copy output to an archive, or copy input from
    an archive. It must always employ either a "i" input option or a "o" output option
    to specify the direction of data flow. An output data stream from cpio can be
    sent to an archive file using the ">" redirection operator. Similarly, an input
    stream can be retrieved from an archive using the "<" operator.


    The example below pipes the contents of the current directory to cpio which outputs
    data to a new archive file - storing the directory list and all file contents
    on a different partition. Next the entire contents of the current directory are
    deleted. The archived contents are retrieved as input to cpio by adding a "-d"
    option to restore the directory from the backup.


    ![](img/0494b98ec9ddc4515587e9808d73902e_183_0.png)


    Add a "d" option to have cpio retrieve a table of contents from an archive.


    ```

    Session Edit View Bookmarks Settings Help

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> ls | cpio -o > /dev/hda5

    2059 blocks

    user> rm *

    user> ls

    user> cpio -i < /dev/hda5

    2059 blocks

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> _|

    ```


    The “tar” tape archive command is a popular backup facility with options to “-cf”
    create file and “-xf” extract file. These are used below to recreate the previous
    archive example:


    Use a “-tf” option to have tar retrieve table of contents from an archive.


    ![](img/0494b98ec9ddc4515587e9808d73902e_184_0.png)


    ```

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> tar -cf /dev/hda5 *

    user> rm *

    user> ls

    user> tar -xf /dev/hda5

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user>

    ```


    The tar command can also incorporate a “-z” option that calls upon gunzip to work
    with a compressed archive. Typically this is used to create “tarball” archives
    of source code with names ending “.tar.gz” that you must compile (build) before
    installation, like this:


    - tar -xzf package.tar.gz – extract the files from the tarball

    - less README – read this file to discover configuration options

    - ./configure options – set the configuration options you want

    - make – create the software installer

    - make install – install the application


    # Examining disks and filesystems


    A Linux system may span multiple hard disk drives and extend across many disk
    partitions. Each partition is represented by a special file in the /dev directory
    - typically /dev/hda1 represents the first partition on your master hard disk
    drive.


    | | |

    |---|---|

    | df | show disk usage of the file system |

    | mount | make a device available to the file system |

    | umount | make a device unavailable to the file system |

    | fsck | check and repair the file system |


    During the installation process operating systems "format" partitions by writing
    a "filesystem" onto them in which files can be stored and recalled. These must
    then be "mounted" to an empty directory to become available for use by the operating
    system. Hard drives are usually mounted automatically during the boot process
    to be readily available, but they can be unmounted from the shell to make them
    inaccessible.


    The "df" disk free command shows how the file system is being used. Add its "-h"
    option to make the output more understandable and "-T" to display the file types.
    The example uses "umount" to make the Windows partition unavailable:


    ![](img/0494b98ec9ddc4515587e9808d73902e_185_0.png)


    Some distros may require you to assume super status to run these commands.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> df -hT

    Filesystem Type Size Used Avail%

    /dev/hdb2 reiserfs 9.1G 2.5G 6.7G 27%

    tmpfs tmpfs 125M 12K 125M 1%

    /dev/hda1 ntfs 9.6G 2.9G 6.7G 31%

    user> umount /dev/hda1

    user> df -hT

    Filesystem Type Size Used Avail%

    /dev/hdb2 reiserfs 9.1G 2.5G 6.7G 27%

    tmpfs tmpfs 125M 12K 125M 1%

    user>

    ```


    # cont''d


    Use the “mount” command to make the Windows partition accessible from Linux once.
    Add its “-l” option to see a list of all mounted file systems. Inserting a portable
    disk, such as a CD-ROM, will automatically mount that disk adding it to the filesystem.
    The CD drive will be offset by /dev/hdc – the master device on the second bus.
    This device gets automatically unmounted when the CD-ROM is ejected from the drive.


    One of the main reasons to have a device inaccessible is to perform maintenance
    without fear of corruption. For instance, the root user can run the “fsck” command
    to check for integrity. This is the same checker used during the boot process
    – it should not be used on mounted devices. In the example below there is a second
    mounted partition on the hard drive hda1 – labelled “data” and has the mount point
    /dev/hda5. The root user first issues an “umount” command, to unmount the device,
    then runs fsck command to check it.


    ![](img/0494b98ec9ddc4515587e9808d73902e_186_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_186_1.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    root df -h

    Filesystem Size Used Avail Mounted on

    /dev/hdb2 9.1G 2.5G 6.7G 27%

    tmpfs 125M 12K 125M 1% /sh

    /dev/hda1 8.6G 2.9G 5.7G 34% /windows

    /dev/hda5 963M 543K 912M 1% /data

    root umount /dev/hda5

    root fsck /dev/hda5

    fsck 1.38 (30-Jun-2005)

    e2fsck 1.38 (30-Jun-2005)

    /dev/hda5: clean, 17/52630 files, 66658/105226 blocks

    root

    ```


    # Viewing and controlling processes


    Your Linux system has many processes running at any given time representing applications,
    shell jobs, and background services. Each one has a unique Process ID (PID) –
    you can see a list of all current processes with the “ps” command and its “-e”
    option.


    | | |

    |---|---|

    | ps | show the current processes |

    | kill | terminate a process |

    | w | show current shell processes |

    | uptime | display a summary of system usage |

    | top | monitor the most active processes |


    Alternatively, you can see a list of all processes for any particular user with
    the “-u” option and the username. Pipe this to a grep command to see if the user
    is running that application.


    The process owner, and the root user, can terminate a process by stating its PID
    as the argument to a “kill” command.


    ![](img/0494b98ec9ddc4515587e9808d73902e_187_0.png)


    Alternatively, use the “-c” option and supply the application name to see all
    instances of that application.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    6270 pts/2 00:00:00 bash

    6472 tty1 00:00:00 bash

    6499 tty2 00:00:00 bash

    6521 tty3 00:00:00 bash

    6545 tty1 00:00:00 vi

    6547 tty2 00:00:00 lynx

    6551 tty3 00:00:00 man

    6552 tty3 00:00:00 sh

    6559 tty3 00:00:00 less

    6572 ? 00:00:00 knasapshot

    6580 pts/2 00:00:00 ps

    root> ps -u mike | grep knasapshot

    6572 ? 00:00:00 knasapshot

    root> kill 6572

    root> _

    ```


    # ...cont''d


    You can display a concise summary of the current shell process of each logged
    in user with the "w" command and its "-s" option.


    The summary begins with a header displaying the current time, the length of time
    the system has been running, and the total number of users. It also provides details
    of system loading for 1 minute, 5 minutes, and 15 minutes – the average number
    of processes ready to run in that time period.


    Each user is listed among with their console or terminal number, the length of
    time idle and what they are currently using that shell process for:


    ![](img/0494b98ec9ddc4515587e9808d73902e_188_0.png)


    Type "top" and hit Return to see the most active processes – press "q" to quit.


