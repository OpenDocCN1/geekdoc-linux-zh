    # Revealing shell variable values


    Information can be displayed in the shell window by the echo command. In its simplest
    form it simply prints on the screen any arguments supplied to the command:


    ![](img/0494b98ec9ddc4515587e9808d73902e_153_0.png)


    This is not very useful by itself but the echo command can also display values
    stored on your system in "variables":


    | echo var | show the value stored in the var variable |

    | export var | make var an environment variable |

    | printenv | show all environment variable names and values |

    | unset var | remove the var variable |


    ![](img/0494b98ec9ddc4515587e9808d73902e_153_1.png)


    To create a variable, type a name of your choice at the prompt (conventionally
    variable names are all uppercase) then type an "=" character followed by any numeric
    value. Now you can recall the stored numeric value using the echo command followed
    by the variable name prefixed with the "$" character:


    ![](img/0494b98ec9ddc4515587e9808d73902e_153_2.png)'
