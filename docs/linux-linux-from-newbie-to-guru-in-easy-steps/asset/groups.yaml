    ## 访问 OpenOffice 套件


    本章介绍了在 Linux 中广泛使用的免费 OpenOffice 办公件的功能。它研究了这款开源软件与市场领先的 Microsoft Office 产品相比如何，并说明了
    OpenOffice 的额外优势。


    - 介绍 OpenOffice 办公件 | 78

