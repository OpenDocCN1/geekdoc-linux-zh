    # Branching statements


    An “if-then” statement, specifying a command to execute only when an expression
    evaluates as true, can be extended to specify an alternate command to execute
    when it evaluates as false. The alternate command is specified after an “else”
    keyword that is inserted into the “if-then” statement, after the “then” part:


    These expressions use “gt” greater than, and “lt” less than, numeric comparison


    operators


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings

    user> if [ 7 -gt 3 ]

    > then echo "greater"

    > else echo "less"

    > fi

    greater

    user> if [ 7 -lt 3 ]

    > then echo "greater"

    > else echo "less"

    > fi

    less

    user>

    ```


    This process is known as “conditional branching” – for the statement “branches”
    to execute only the “condition” that is true. You can add subsequent evaluations
    with the “elif” keyword. This combines “else” and “if” to allow complex conditional
    branching:


    The `tick characters around “whoami” in this example make the comparison against
    the result from that command – they appear in the code on page 148 that is used
    to customize the shell prompt.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> if [ `whoami` = "root" ]

    > then echo "Hello SuperUser"

    elif [ `whoami` = "mike" ]

    > then echo "Hello Mike"

    > else echo "Hello Guest"

    > fi

    Hello Mike

    user>

    ```'
