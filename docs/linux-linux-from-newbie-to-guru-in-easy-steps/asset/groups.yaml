    ## Starting a new image


    The initial appearance of the GIMP generally leads new users to question where
    the menus and working area are – you can only see the File and Edit menus in The
    GIMP toolbox dialog, and these contain very little.


    To access the full GIMP menus a new, or existing, image must first be opened.
    Select File, Open and browse to an existing image file, or click File, New to
    create a new image. In the New Image dialog set the Image Size, preferred Fill
    Type and Image Type – RGB for color or Grayscale for mono. Then click the button
    to open the new image window:


    Optionally select one of the handy templates to quickly create a new blank image.


    ![](img/0494b98ec9ddc4515587e9808d73902e_105_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_3.png)


    ## Finding the menus


    Right-click on the image window to open the context menu – this contains all the
    menus and sub-menus that you would normally expect to find on the taskbar in other
    graphic programs. For instance, to rotate the image through 90 degrees right then
    choose Image, Transform, Rotate 90 degrees CW.


    The menus can alternatively be seen by clicking on the arrow button in the top
    left corner of the image window.


    ![](img/0494b98ec9ddc4515587e9808d73902e_106_0.png)


    This arrangement feels odd if you are used to working in Photoshop but when you
    get used to realize the benefit of moving the mouse much less distance to access
    the menus.


    The Pencil and Paintbrush tools are very similar but the Pencil will not draw
    fuzzy edges – even if a fuzzy brush is selected. Shift and click with the Pencil
    tool to draw straight lines.


    Select Dialogs, Tool Options on the context menu to open the options dialog for
    the current tool. Alternatively double-click on any button in the GIMP toolbox
    to open the options dialog for that tool. For instance, double-click the Pencil
    tool button in The GIMP toolbox to display Tool Options for the Pencil tool. These
    allow you to specify Opacity, Mode and Pressure Sensitivity for Graphics Tablet
    input.


    ![](img/0494b98ec9ddc4515587e9808d73902e_106_1.png)


    ## Opening selection dialogs


    The currently selected foreground and background colors are shown in the bottom
    left panel in The GIMP toolbox. Double-click on either one of these to open the
    Color Selection dialog where a new color can be selected.


    For instance, double-click on the white background area to open the Color Selection
    dialog box. Click the approximate color you require in the tall multi-colored
    panel, then choose a precise color in the large colored area – when you click
    the Close button the chosen color appears in the toolbox panel.


    You can also select a color by its RGB, HSV, or Hexadecimal value.


    ![](img/0494b98ec9ddc4515587e9808d73902e_107_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_107_1.png)


    Default colors of black-on-white can be selected by clicking on the small black
    and white boxes and the selected colors can be switched by clicking the arrowed
    icon.


    The bottom right panel in The GIMP toolbox displays the currently selected Brush,
    Pattern and Gradient. Click on any one of these to open its Selection dialog –
    or open them from the toolbox''s File, Dialogs menu, or choose the Dialogs option
    on the right-click context menu.


    The Brush Selection dialog contains an interesting range of predefined brushes
    to experiment with – you can also create your own brush and add it to the available
    selections.


    Similarly, the Gradient and Pattern dialogs contain a range of predefined options
    to choose from – click on any one to select it. In each case the current selection
    is displayed in the toolbox panel.


    The Gradient tool will apply the current foreground and background colors by default
    – choose Custom Gradient Blend in its Options dialog to use a selected gradient.


    ![](img/0494b98ec9ddc4515587e9808d73902e_108_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_3.png)


    Choose Pattern Fill in the tool''s Option dialog to fill with the current pattern.


    Another useful option under Dialogs allows you to select color palettes to work
    with. The Palettes menu offers a number of predefined palettes to choose from,
    double-click on any palette to open the Palette Editor to create your own.


    If you are creating an image choose the “Web” palette under the Palettes menu
    – this contains colors which are sure to display correctly however they are viewed.
    Double-click on the Palette tab to see Editor then click on the color you want
    to use.


    ## 9. Creating and editing graphics


    ### Working with layers


    The GIMP supports the concept of layers that act like transparent sheets stacked
    on the other – various objects within an image can be placed on their own layer
    so they may be manipulated independently.


    Unlike other graphics GIMP layers can occupy an area less than the entire image
    size unless the objects on that layer fill the whole image. Instead the layers
    can be optimized to the size of the object. For instance, a layer containing text
    can simply be the size of text. This capability saves disk space and improves
    processing speed.


    To create a new layer select the Layers option under Dialogs, then click the New
    Layer button. The original layer is named "Background" by default – always give
    new layers a meaningful name so they can be readily identified.


    ![](img/0494b98ec9ddc4515587e9808d73902e_109_0.png)


    Click the OK button when New Layer dialog appears to accept the default size and
    settings for the layer – enter your preferred options first. The New Layer then
    appears in the Layers dialog and in the image window. A layer that is smaller
    than the entire image is surrounded by a dotted line for identification.


    To move a single layer select the Move tool in the toolbox, click on the layer,
    then drag it to a new position.


    Layers are stacked in order from the bottom Background layer up in the Layers
    dialog. Click on a layer to select it then use the arrowed buttons at the bottom
    to change its stack position. Unlink all linked layers before moving any layer,
    otherwise all the layers may be moved even when the linked layers are not.


    ![](img/0494b98ec9ddc4515587e9808d73902e_110_0.png)


    You can click the eye icon of any layer to hide that layer in the image window.
    Layers can be linked by clicking the eye icon and the thumbnail box – a cross
    symbol appears to denote linked layers. Moving a linked layer also moves the layers
    to which it is linked.


    A copy of any selected layer can be quickly created by clicking the Duplicate
    Layer button at the bottom of the dialog box. Drag a layer over the Trash icon
    then release the mouse button to delete that layer.


    To reduce an image with layers to a single layer with a smaller file size, choose
    the Layers, Flatten Image option on the context menu. Alternatively, if you wish
    to preserve the layers save the image in GIMP’s favored “.xcf” format.


    ## Selecting areas


    The first seven tools in The GIMP toolbox are selection tools which provide various
    ways to select an area of the image for manipulation. The simplest are rectangular
    and elliptical areas – hold down the Shift key while using these to select perfectly
    square and circular areas. The Shift key also lets you add further selections
    and unites them into a single selection if they overlap. Conversely, the Ctrl
    key subtracts overlapping areas from the first selection. Hold down both Ctrl
    and Shift to select only the overlapping area.


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_0.png)


    Once an area has been selected the pointer over the selection changes to cross-arrows
    that represent the Move tool – you can drag the selected area to another place
    in the image.


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_1.png)


    The Lasso tool allows for freehand selection of an area of the image. The selected
    area automatically completes by connecting to its original starting point. You
    can add to a selection by holding down the Shift key and selecting another area,
    or you subtract from a selection by holding down the Ctrl key and selecting another
    area. Click anywhere on the image to cancel the selection.


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_2.png)


    The Fuzzy Select tool in the GIMP works like the magic wand in Photoshop – click
    on an initial point and it will select adjacent pixels of similar color until
    the color becomes too.


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_3.png)


    The Select by Color tool, unlike the Fuzzy Select tool, will select all areas
    of similar color to which you click on – even if they are not adjacent pixels.


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_4.png)


    The Path tool in the GIMP works like pen tool paths in Photoshop. Click on the
    image to create anchor points – segment lines are automatically joining each point.
    To reposition any point just drag it to the desired position. To create a bezier
    curve click on a segment line and handles appear at the anchor points on each
    side of that segment. You can now drag the line to make it curve and drag the
    handles to adjust its curvature. When you are happy with the path’s shape choose
    the Select, From Path option on the right-click context menu, or push the “Path
    to selection” button on the Paths dialog, to make the path shape into a selection
    area.

    '
  mdcn: '


    ## 创建新图像


    GIMP 的初始外观通常会让新用户疑问菜单和工作区域在哪里——在 GIMP 工具箱对话框中，你只能看到“文件”（File）和“编辑”（Edit）菜单，而且它们的内容非常少。


    要访问完整的 GIMP 菜单，必须先打开一个新的或现有的图像。选择“文件 > “打开”（Open）并浏览到现有的图像文件，或者点击“文件 > “新建”（New）来创建一个新图像。在“新建图像”对话框中，设置图像大小、首选填充类型和图像类型——彩色的选择
    RGB，单色的选择灰度。然后点击按钮打开新图像窗口：


    可以选择选择其中一个方便的模板来快速创建一个新的空白图像。


    ![](img/0494b98ec9ddc4515587e9808d73902e_105_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_105_3.png)


    ## 查找菜单


    在图像窗口上点击右键打开上下文菜单——这里包含了你通常在其他图形程序的任务栏上找到的所有菜单和子菜单。例如，要将图像顺时针旋转 90 度，选择“图像”（Image）
    > “变换”（Transform） > “顺时针旋转 90 度”（Rotate 90 degrees CW）。


    也可以通过点击图像窗口左上角的箭头按钮查看菜单。


    ![](img/0494b98ec9ddc4515587e9808d73902e_106_0.png)


    如果你习惯在 Photoshop 中工作，这种布局会很奇怪，但当你习惯了移动更短距离就能访问菜单的好处时。


    铅笔（Pencil）工具和画笔（Paintbrush）工具非常相似，但铅笔不会绘制模糊边缘——即使选择了模糊画刷也是如此。使用铅笔工具时按住 Shift 并点击可以绘制直线。


    在上下文菜单中选择“对话框”（Dialogs） > “工具选项”（Tool Options）来打开当前工具的选项对话框。或者，双击 GIMP 工具箱中的任何按钮来打开该工具的选项对话框。例如，双击
    GIMP 工具箱中的铅笔工具按钮以显示铅笔工具的工具选项。这些允许你指定不透明度（Opacity）、模式（Mode）以及数位板输入的压力敏感度。


    ![](img/0494b98ec9ddc4515587e9808d73902e_106_1.png)


    ## 打开选择对话框


    当前选的前景色和背景颜色显示在 GIMP 工具箱左下角的面板中。双击其中任一即可打开“颜色选择”（Color Selection）对话框，在其中可以选择新颜色。


    例如，双击白色背景区域打开“颜色选择”对话框。在垂直的多彩色面板中点击你所需的近似颜色，然后在较大的颜色区域中选择精确颜色——当你点击“关闭”按钮时，选定的颜色会出现在工具箱面板中。


    你也可以通过 RGB、HSV 或十六进制值选择颜色。


    ![](img/0494b98ec9ddc4515587e9808d73902e_107_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_107_1.png)


    可以通过点击黑白框选择白底黑默认颜色，可以通过点击箭头图标切换选定的颜色。


    GIMP 工具箱右下角的面板显示当前选择画笔（Brush）、图案（Pattern）和渐变（Gradient）。点击这些中的任一个即可打开其对话框——或者从工具箱的“文件
    > 对话框”打开，或在右键上下文菜单中选择“对话框”选项。


    画笔对话框包含一系列预定义的画笔供实验——你也可以创建自己的画笔并将其添加到可用选择中。


    同样，渐变和图案对话框包含一系列预定义选项供选择——在每种情况下，当前选择都显示在工具箱面板中。


    渐变工具默认应用当前的前景和背景颜色——在选项对话框中选择“自定义渐变”（Custom Gradient）以使用指定的渐变。


    ![](img/0494b98ec9ddc4515587e9808d73902e_108_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_108_3.png)


    在工具选项对话框中选择“图案填充”（Pattern Fill）以当前图案。


    对话框下的另一个有用选项允许选择调色板进行工作。“调色板”（Palettes）菜单提供了许多预定义调色板供选择，双击任一调色板打开编辑器（Editor）以创建自己的。


    如果你正在创建图像，选择调色板菜单下的“网络”（Web）调色板——它包含正确显示的颜色。双击调色板标签然后点击你想使用的颜色。


    ## 9. 创建和编辑图形


    ### 使用图层


    GIMP 支持图层概念，就像堆叠的透明片——图像中的各种对象可以放置在自己的层上，以便独立操作。


    与其他图形不同，GIMP 图层占据的区域小于整个图像，图层可以优化到对象的大小。例如，包含文本的层可以就是文本的大小。这种功能可以节省空间并提高处理速度。


    要创建一个新层，选择对话框下的“层”，然后点击“新建层”按钮。原始层默认名为“背景”（Background）——始终为新层赋予一个有意义的名字以便识别。


    ![](img/0494b98ec9ddc4515587e9808d73902e_109_0.png)


    当“新建层”对话框出现时，点击“确定”（OK）按钮以接受默认的大小和设置——先输入你的选项。新建层随后出现在“层”对话框和图像窗口中。比整个图像小的层由虚线包围。


    要移动单个图层，选择工具箱中的“移动”（Move）工具，点击该层，然后将其拖到新位置。


    图层在“层”对话框中从底部向上堆叠。点击一个层进行选择，然后使用底部的箭头按钮更改其位置。在移动任何图层之前取消所有链接图层，否则即使是未链接图层也会移动。


    ![](img/0494b98ec9ddc4515587e9808d73902e_110_0.png)


    你可以点击任何图层的眼睛图标隐藏图像窗口中的该层。通过点击眼睛图标和缩略图框链接图层——交叉符号表示链接图层。移动链接图层也会移动与其链接的图层。


    通过点击对话框底部的“复制层”（Duplicate Layer）按钮可以快速创建选定层的副本。将图层拖到垃圾桶图标上释放鼠标即可删除该层。


    要将带有图层的图像还原为文件较小的单图层，在上下文菜单上选择“层 >合并图像”（Flatten Image）。或者，如果你想保留图层，用 GIMP 喜欢的“.xcf”格式保存图像。


    ## 选择区域


    GIMP 工具箱中的前七个工具是选择工具，提供了多种选择图像区域进行操作的方法。最简单矩形和椭圆形——在使用这些工具时按住 Shift 键可以选择完美的正方形和圆形区域。Shift
    键还允许添加更多选择，如果它们重叠，则合并为单个选择。相反，Ctrl 键从第一个选择中减去重叠区域。同时按住 Ctrl 和 Shift 选择重叠区域。


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_0.png)


    一旦选择了区域，选定区域上的指针将变为代表移动工具的交叉箭头——你可以将选定区域拖到图像的另一个地方。


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_1.png)


    套索工具（Lasso）允许对图像区域进行手画选择。选定区域通过连接到原始起点自动完成。你可以按住 Shift 键并选择另一个区域来添加选择，或通过按住 Ctrl
    键并选择另一个区域来从选择中删除。点击图像上的任何地方取消选择。


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_2.png)


    GIMP 中的模糊选择（Fuzzy Select）工具类似于 Photoshop 中的魔术棒——点击初始点，它将选择相邻的相似颜色像素，直到颜色也变得相同。


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_3.png)


    “按颜色选择”（Select by Color）工具与模糊选择工具不同，会选择你点击的所有相似颜色区域——即使它们不是相邻像素。


    ![](img/0494b98ec9ddc4515587e9808d73902e_111_4.png)


    GIMP 中的路径工具（Path tool）类似于 Photoshop 中的钢笔工具路径。点击图像创建锚点——段线会自动连接每个点。要重新定位任何点，只需将其拖到所需的位置。要创建贝塞尔曲线，点击一条段线，在该段线两侧的锚点处会出现手柄。你现在可以拖动线条使其弯曲，并拖动手柄调整其曲率。当你对路径形状满意时，在右键上下文菜单中选择“选择
    > 来自路径”（Select > From Path）选项，或者点击“路径”对话框上的“路径转选择”（Path to selection）按钮，将路径形状转换为选择区域。


    '
