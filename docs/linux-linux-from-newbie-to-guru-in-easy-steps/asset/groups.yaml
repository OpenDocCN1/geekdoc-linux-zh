    # Printing from the shell


    To send a file to the printer type the command "lpr" and the file name or path
    as its argument. For instance, to print a file named simple.txt, from the current
    directory, just type the command "lpr simple.txt" then hit the Return key. This
    creates a print job containing the data from the specified file. Each job is placed
    in a queue awaiting transmission to the printer – when the job reaches the front
    of the queue it''s sent to the printer and gets printed.


    You can examine jobs in the print queue with the "lpq" command – each job is automatically
    assigned a job number. A job can be removed from the queue, before it gets sent
    to the printer, using the "lprm" command together with its jobs number.


    In the screenshot below the user initially three files to be printed. When the
    queue examines the first file has already printed, the second is currently printing,
    and the third is awaiting transmission to the printer. The user dequeues the third
    file so it does not get printed.


    ![](img/0494b98ec9ddc4515587e9808d73902e_179_0.png)


    A print job can only be dequeued by its owner or the root user.


    ```

    ### Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> lpr hi_res.jpg

    user> lpr reading-gaol.txt

    user> lpr simple.txt

    user> lpq

    Mikes-Printer is ready and printing

    Rank Owner Job File(s)

    active mike 7 reading-gaol.txt

    lst mike 8 simple.txt

    user> lprm8

    user> _

    ```


    Printing from a shell command prompt is not restricted to simply printing files
    – data can also be queued for printing using the lpr command together with the
    | pipe character. For instance, you could print a list of the contents of the
    /etc directory by piping the results of an ls command to the lpr command as "ls
    -l /etc | lpr”


