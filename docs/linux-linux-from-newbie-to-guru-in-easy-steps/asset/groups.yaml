    \nIn SUSE linux click Start, Internet, WebBrowser, Firefox to launch the web browser.\
    \ Type a URL into the location field then hit Return to open that page in the\
    \ browser window.\n\nMost web browsers are based upon the Mosaic browser of the\
    \ early 1990s. the name Mozilla is derived from \"Mosaic\" and \"godZILLA\".\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_91_0.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_91_1.png)\n\
    \nIf you're used to Internet Explorer, you will feel instantly at home with Firefox\
