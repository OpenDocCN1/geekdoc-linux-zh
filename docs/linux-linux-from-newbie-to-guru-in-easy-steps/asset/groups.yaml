    Start menu. Navigate through the menus then click any application to launch.


    ![](img/0494b98ec9ddc4515587e9808d73902e_45_0.png)


    The screenshot above illustrates the Firefox web browser being launched from the
    graphical menu. Notice that its icon also appears as a Quick Launch button on
    the taskbar – so Firefox can also be launched just by clicking that button.


    Another way to launch Firefox is to click the Run Command menu item, then enter
    the application''s name in the dialog box that appears – now click the Run button
    to open Firefox:


    ![](img/0494b98ec9ddc4515587e9808d73902e_45_1.png)'
