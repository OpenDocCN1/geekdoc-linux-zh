    ## 完成安装


    ![](img/0494b98ec9ddc4515587e9808d73902e_29_0.png)


    如果安装程序询问你是否想要运行 YaST 在线更新器 (YOU)，请接受——拥有最新版本总是好的！


    ![](img/0494b98ec9ddc4515587e9808d73902e_29_1.png)


    点击“完成 (Finish)”按钮完成安装。然后，根据提示输入你的用户名和密码以登录 Linux 系统——随后将加载图形桌面：


    ![](img/0494b98ec9ddc4515587e9808d73902e_29_2.png)


    ## 配置硬件


    本章演示了如何针对声音和屏幕分辨率自定义 Linux 安装，并说明了如何添加对本地打印机和无线网络连接的支持。


    - 发现控制中心 | 30

    - 启用声音 | 32

    - 更改屏幕分辨率 | 34

    - 安装本地打印机 | 36

    - 建立无线连接 | 38

    - 更改其他硬件设置 | 40


    第三章


    ## 发现控制中心


    默认 Linux 图形桌面的外观对于那些从 Windows 操作系统迁移过来的用户来说很熟悉，因为这两个系统都通过“开始 (Start)”按钮显示应用程序菜单——位于下方截图的左下角：


    本章描述了如何配置常用的系统设置——下一章将探讨 Linux KDE 桌面。


    ![](img/0494b98ec9ddc4515587e9808d73902e_31_0.png)


    “控制中心 (Control Center)”是 Linux 中的主要配置工具。在 SUSE Linux 发行版中，可以通过点击开始按钮，然后在主菜单中选择控制中心来找到它。


    控制中心在左侧的索引格中显示可配置的系统组件菜单。点击这些任何菜单选项都将更改菜单，在索引格中显示该组件的子菜单选项。


    从子菜单中选择所需的组件，在右侧窗格中显示其当前配置设置。


    更改任何当前配置设置并点击“应用 (Apply)”按钮将更新所选组件的配置。


    ## ...续


    ![](img/0494b98ec9ddc4515587e9808d73902e_32_0.png)


    主菜单


    开始按钮


    ![](img/0494b98ec9ddc4515587e9808d73902e_32_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_32_2.png)


    ## 3. 配置硬件


    31


    ## 启用声音


    如上一页所述启动控制中心，然后在菜单中选择“声音与多媒体 (Sound & Multimedia)”组件。当子菜单在索引格中出现时，选择“声音系统 (Sound
    System)”选项在右侧窗格中显示当前声音配置设置。勾选“启用声音系统 (Enable the sound system)”选项，然后点击“应用 (Apply)”按钮更新配置：


    ![](img/0494b98ec9ddc4515587e9808d73902e_33_0.png)


    在此窗口中。


    ![](img/0494b98ec9ddc4515587e9808d73902e_33_1.png)


    Linux 现在将启动系统声音服务器，以便播放声音。


    ![](img/0494b98ec9ddc4515587e9808d73902e_33_2.png)


    要切换系统通知音，打开控制中心，在菜单中选择“声音与多媒体”组件，然后在子菜单中选择“系统通知 (System Notifications)”选项。右侧窗格现在显示当前配置，并允许为单个界面事件指定声音。


    要轻松在整个系统中启用系统通知，勾选“应用到所有应用程序 (Apply to all applications)”选项，点击“全部开启 (Turn On All)”按钮，然后点击“应用
    (Apply)”按钮进行更改：


    ![](img/0494b98ec9ddc4515587e9808d73902e_34_0.png)


    点击操作面板中的箭头按钮以预览窗口中显示的声音文件——点击小文件夹按钮浏览到新的声音文件。


    启用系统通知后，你的 Linux 系统将在窗口打开、关闭或最小化或最大化时播放声音。


    ## 更改屏幕分辨率


    启动控制中心，然后在菜单中选择“外围设备 (Peripherals)”组件。当子菜单在索引格中出现时，选择“显示 (Display)”选项：


    显示配置中的分辨率范围和色彩深度取决于你的显卡支持的内容。


    ![](img/0494b98ec9ddc4515587e9808d73902e_35_0.png)


    欢迎来到“KDE 控制中心”，这是一个配置桌面的中心位置。


    | | |

    | :--- | :--- |

    | KDE 版本 | 3.4 |

    | 用户 | mike |

    | 主机名 | linux |

    | 系统 | Linux |

    | 版本 | 2.6.13-rc6-git13-4 |

    | 机器 | 686 |


    点击左侧的“帮助 (Help)”选项卡查看活动模块。如果你不确定查找特定配置，请使用“搜索 (Search)”选项卡。


    当前配置设置出现在右侧窗格中。从子菜单中选择所需的组件，在右侧窗格中显示其当前配置设置。


    更改任何当前配置设置并点击“应用 (Apply)”按钮将更新所选组件的配置。


    （注：原始 OCR 中的某些重复文本似乎是伪影，我已关注逻辑流。）


    ## 安装本地打印机


    如上一页所述启动控制中心，然后在菜单中选择“YaST 模块 (YaST Modules)”组件。当子菜单在索引格中出现时，选择“硬件 (Hardware)”选项：


    YaST 是“Another Setup Tool”的缩写。


    ![](img/0494b98ec9ddc4515587e9808d73902e_37_0.png)


    在此窗口中


    要切换系统通知音，打开控制中心，在菜单中选择“声音与多媒体”组件，然后在子菜单中选择“系统通知”选项。右侧窗格现在显示当前配置，并允许为单个界面事件指定声音。


    要轻松在整个系统中启用系统通知，勾选“应用到所有应用程序”选项，点击“全部开启”按钮，然后点击“应用”按钮进行更改：


    ![](img/0494b98ec9ddc4515587e9808d73902e_34_0.png)


    点击操作面板中的箭头按钮以预览窗口中显示的声音文件——点击小文件夹按钮浏览到新的声音文件。


    启用系统通知后，你的 Linux 系统将在窗口打开、关闭或最小化或最大化时播放声音。


    ## 建立无线连接


