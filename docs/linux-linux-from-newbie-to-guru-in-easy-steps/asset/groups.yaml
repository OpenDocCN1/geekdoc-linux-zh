    All information required for the base installation is now complete.


    If you continue now, partitions on your hard disk will be formatted (erasing any
    existing data in those partitions) according to the installation settings in the
    previous dialogs.

    Go back and check the settings if you are unsure.


    Click the "Install" button to begin writing the Linux operating system and bundled
    application packages onto your HD drive.'
