    # # Looping constructs


    Loops allow one or more commands to be executed repeatedly while a condition remains
    true. Each iteration (pass) of the loop will evaluate a specified expression and
    when it is found to be true the loop will continue to execute its command/s. When
    the test expression is found to be false the loop ends immediately. The shell
    provides three types of loop constructs:


    > > The "while" loop construct specifies the test expression to the "while" keyword
    and its command/s to be executed on each iteration between "do" and "done" keywords.
    It will continue until the evaluation becomes false.


    ![](img/0494b98ec9ddc4515587e9808d73902e_219_0.png)


    The decision to use a "while" loop rather than an "until" loop depends if your
    choice - it a "half-empty" or a "half-full" type of person.


    +   2 Similarly, an "until" loop construct specifies the test expression to the
    "until" keyword and its command/s to be executed on each iteration between "do"
    and "done" keywords. Subtly different, it will continue until the evaluation becomes
    false.


    +   3 A "for-in" loop simply performs one iteration for each item in a given list
    - it performs the command/s to be executed on each iteration between "do" and
    "done" keywords.


    A single iteration can be skipped in any type of loop by inserting an "if" statement
    into the body of the loop. This can make a further evaluation which, when true,
    can call upon the "continue" keyword to skip to the next iteration.


    ![](img/0494b98ec9ddc4515587e9808d73902e_219_1.png)


    Unless the loop body changes the tested evaluation the loop will never end if
    you do accidentally press Ctrl+C to stop the loop running.


    Alternatively, the inserted "if" statement could end the loop entirely by calling
    upon the "break" keyword when it found a further evaluation to be true.


    Each type of loop appears in the script opposite and all are initially set to
    make eight iterations, writing out the number of the current iteration on each
    pass. The "for" loop contains an "if" statement that forces the third iteration
    to be skipped. It also contains an "if" statement that terminates the loop on
    the seventh iteration.'
