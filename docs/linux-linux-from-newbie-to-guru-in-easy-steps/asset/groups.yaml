  - '[PAGE 119]


    # Grabbing screen shots


    Unlike Windows, Linux cannot simply grab screen captures with the “Print Screen”
    button on your keyboard. Instead KDE includes the KSnapshot application for this
    purpose. Launch it from the Start, Utilities, Desktop, Screen Capture menu, or
    Start, Run Command “ksnapshot”.


    KSnapshot grabs an image of the entire screen whenever it is started. You can
    see a preview and may elect to Save or Print this image, or you may prefer to
    take a New Snapshot:


    ![](img/0494b98ec9ddc4515587e9808d73902e_119_0.png)


    HOT TIP Give the file name a numeric suffix in the Save dialog and KSnapshot will
    automatically suggest numbers for successive screen captures – grab1, grab2, etc.


    Change the Capture mode to “Window Under Cursor” to grab only the active window,
    including its frame and toolbars. If you do not want to include these uncheck
    the box labeled “Include window decorations”. Setting a delay period useful allows
    you to do something before the image is grabbed – for instance, to launch an application
    in order to grab its splash screen.


    You can even grab a specific rectangular area of the window by setting the Capture
    Mode to “Region” and delay to “No delay”. Now drag the mouse cursor around the
    area you want to grab and it will be captured when you release the mouse button.


    Push the Save As button to store the image and the dialog will help suggest a
    name, location, and file type for that image.'
