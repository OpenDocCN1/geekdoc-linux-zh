    is roughly equivalent to the C:\Program Files directory in Windows. The /usr/local
    sub-directory is intended for use by the system administrator, when installing
    software locally, to prevent it from being overwritten when the system software
    is updated.


    # /var


    Contains variable data files that store information about ongoing system status,
    particularly logs of system activity. The system administrator (superuser) can
    type the following command at a root prompt to see the record of system activity
    messages:


    ```

    /var/log/messages

    ```


    # /home


    Contains a sub-directory for each user account to store personal data files. If
    there is a user account named "fred" there will be a /home/fred directory where
    that user can store personal files – other users cannot save there. This directory
    is where you store all your working documents, images and media files and is the
    rough equivalent of the My Documents directory in the Windows operating system.'
