    10. Playing sound and video 125


    # Playing audio CDs


    The KDE Simple CD (KsCD) application is the standard Linux audio CD player. Its
    interface has the familiar control buttons that you find on real CD players plus
    four more for additional features.


    Click on the digital counter to cycle through the displayed time – to playing
    time, remaining time, and time elapsed for the track and enter disk:


    ![](img/0494b98ec9ddc4515587e9808d73902e_127_0.png)


    Launch KsCD and it will automatically start to play track 1 of the CD in the drive.


    The display shows artist and track details if a CD Database is available – or
    you can make your own. Click on the CDDB button to launch the CD Editor and see
    the track numbers and playing duration times listed in the tracks window. Under
    the Title heading double-click on a track and an input window will open so you
    can type that track''s title.


    When all track titles are complete add any other artist details and comments then
    click OK to save.


    Click the Extras button then select the option to Configure KsCD to open the configuration
    dialog. Under Settings & Behavior you can change the display colors and other
    simple options. The option to “Show in system tray” is checked by default so closing
    the KsCD window still leaves the application running. Click the system tray icon
    to open the player window once more.


    Kaffeine Player can also be used to play Audio CDs – select the AudioCD option
    in the drop-down Playlist menu.


    ![](img/0494b98ec9ddc4515587e9808d73902e_127_1.png)


    # ...cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_128_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_128_1.png)


    If you cannot see the system tray you may have accidentally removed it - right-click
    on the panel and select Add to Panel.Applet, System Tray.


    The KsCD system tray icon has a right-click context menu that can be used to control
    the player - Play, Pause and Stop, skip tracks, eject the current CD, restore
    the player window, or exit the application completely.


    ![](img/0494b98ec9ddc4515587e9808d73902e_128_2.png)


    10. Playing sound and video 127


    # Burning CDs and DVDs


    If your system has a CD writer or DVD writer, you can easily burn your own disks
    using the K3b application. To make a CD copy launch K3b then click the button
    labelled ''Copy CD'':


    Some disks have copy protection that prevents copying


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_129_1.png)


    The CD Copy dialog will appear where you can choose which CD Reader Device to
    copy from – select the drive where your source CD is located. You can configure
    other options in this dialog, such as choose the temporary directory where K3b
    will write the data it is about to copy from your CD. Usually you can just accept
    the default. When you are happy with your choices click the Start button in the
    dialog to begin copying all from the CD to the temporary directory.


    If you have downloaded disk image (.iso) files, such as those used by Linux distros,
    you should use the Burn Image button to create a usable CD.


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_2.png)


    The Copy CD dialog appears where bars keep you informed as each track is copied.
    When all tracks have been copied K3b ejects the CD and asks you to insert a blank
    disk.


    The Copy Dialog changes into writing mode as it copies each track, in turn, from
    the temporary directory onto the disk. This can be a lengthy process but when
    it completes K3b plays a jingle to let you know that your new disk is ready.


    ...cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_130_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_2.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_130_3.png)


    10. Playing sound and video 129


    # Recording a voice message


    SUSE Linux includes a fun voice recording application called KRecord. It''s similar
    to the Sound Recorder found in Windows but with a couple of extra features.


    Under the Options menu you can choose the Sample Rate and Input Level monitor
    to see how your voice wave looks:


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_0.png)


    KRecord records your voice in a memory buffer - it only creates a file when you
    save the buffer. So you can try over and over until you like the result and then
    save as a file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_1.png)


    You could send a very brief voice message as an email attachment but WAV files
    can quickly become huge - adjust the sample rate to a low level to reduce the
    WAV file size.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_2.png)


    To record a voice message plug in a microphone then click the red “record” button
    and speak your message into the microphone. When you are finished click the “stop”
    button, just to the right of the record button. Click the “play” button, as shown
    above to hear your message played back through your speakers.


    If you want to see the input level you select the Options, Input Level dialog
    then click the “M” (monitor) toolbar icon to switch it on. Experiment with the
    options to achieve the optimum result then save your voice message in WAV format.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_3.png)


    # Extending your Linux system


    This chapter illustrates how to install and remove applications on a Linux system,
    both from the distro CDs and via the internet. It also demonstrates how to switch
    desktop managers to run Linux in a different graphical environment.


    | Task | Page |

    | :--- | :--- |

    | Installing bundled packages | 132 |

    | Uninstalling packages | 134 |

    | Downloading packages | 136 |

    | Installing downloaded packages | 138 |

    | Switching desktop managers | 140 |

    | Switching between sessions | 142 |


    # Installing bundled packages


    Most Linux distros include the RedHat Package Management (RPM) tool which simplifies
    installation of additional applications. This is the equivalent of the Add/Remove
    Programs feature in Windows and is located on a menu in the system Control Center.
    In SUSE it can be launched from the Start, Control Center, YaST2 Modules, Software,
    Software management:


    ![](img/0494b98ec9ddc4515587e9808d73902e_133_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_133_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_133_2.png)


    The Software Management displays us a number of expandable menus that let you
    select an application to be installed. For instance, to add "emacs" text editor
    to your system (if it is not already installed) select "Package Groups" as the
    Filter, then expand the Productivity, Editors, Emacs menu, as shown.


    To begin the installation process click on the Accept button. If the selected
    application requires additional support packages to be installed a dialog will
    appear requesting your approval - click the Continue button to approve the suggestion.

