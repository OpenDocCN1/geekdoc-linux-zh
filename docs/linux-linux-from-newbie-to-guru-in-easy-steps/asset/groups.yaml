  - "[PAGE 189]\n\n# Working with user accounts\n\nUser accounts are administered\
    \ by the root super user who can issue a “useradd” command to specify the name\
    \ of a new user as its argument – “userdel” deletes an account in the same way.\
    \ Existing accounts can be modified by the options available to the “usermod”\
    \ command. For instance, the user login name can be changed with “usermod -l newname\
    \ oldname”.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_189_0.png)\n\nNever change\
    \ any aspect of the root user account!\n\n| useradd | add a new user account |\n\
    |---|---|\n| usermod | modify an existing user account |\n| userdel | delete an\
    \ existing user account |\n| passwd | set a user account password |\n| chfn |\
    \ change personal user information |\n| finger | show personal user information\
    \ |\n\nUse the “passwd” command to change the login password and the “chfn” command\
    \ to change personal information details. Each user may use these to change their\
    \ own details or the super user can specify a user name to change any user’s details.\
    \ The “finger” command will show the personal details of any specified user:\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_189_1.png)\n\n```\nIn this example\
    \ any user can now issue the command “finger tony” to see that's personal details.\
    \ Shell - Konsole\nSession Edit View Bookmarks Settings Help\nroot> useradd tony\n\
    root> usermod -l tony tony\nroot> passwd tony\nChanging password for toni.\nNew\
    \ Password: ******\nReenter New Password: ******\nPassword changed.\nroot> chfn\
    \ tony\nChanging finger information for toni.\nEnter the new value, or press ENTER\n\
    \  Full Name [:]: Toni Smith\n  Work Phone []: 555-1234\nFinger information changed.\n\
    root> _\n```"
  - "[PAGE 190]\n\n# Working with group accounts\n\nA group is a set of user accounts\
    \ whose rights can be modified simultaneously. The root super user might, for\
    \ instance, grant a group permission to access a particular file that was previously\
    \ inaccessible – all users who are members of that group are then instantly able\
    \ to access that file.\n\n| | | |\n|---|---|\n| groups | show the group membership\
    \ of a user |\n| groupadd | create a new group |\n| groupmod | modify an existing\
    \ group |\n| groupdel | delete an existing group |\n\nAny user can discover which\
    \ groups they belong to using the “groups” command. Alternatively, the root user\
    \ can specify a user name as its argument to reveal group membership of that user.\n\
    \nAs the root user, use \"groupadd\" to specify the name of the new group, or\
    \ use \"groupmod -n\" to change that of an existing group:\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nroot> groups mike\nmike : users dialout\
    \ video\nroot> groupadd executive\nroot> groupmod -n exec executive\nroot> vi\
    \ /etc/group\nroot> groups mike\nmike : users dialout video exec\nroot> \n```\n\
    \nNew groups are added to the /etc/group file which the root user can edit. In\
    \ the example above this was opened in the vi editor and the user name \"mike\"\
    \ inserted after the \"exec:\" entry. When the file was saved the user becomes\
    \ a member of the new group.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_190_0.png)"
  - "[PAGE 191]\n\n# Setting access permissions\n\nThe \"-l\" long command reveals\
    \ the access permissions of each item in the current directory as a string of\
    \ 10 characters at the beginning of each line. The first is a \"d\" for a directory,\
    \ a dash for a file. This is followed by sequential Read, Write and Execute permissions\
    \ for the owning User, Group, and Others. Characters \"r\", \"w\", and \"x\" appear\
    \ for those permissions that are set, otherwise a dash is shown.\n\nSee page 72\
    \ for more on understanding access permissions.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_191_0.png)\n\
    \nIn the listing below a \"common\" directory allows anyone Read, Write, and Execute\
    \ permissions. The current user can both Read and Write to \"mikestext\" file\
    \ but others may only Read It. their owning User can Read or Write of the other\
    \ three files:\n\n```\nSession Edit View Bookmarks Help\nuser> whoami\nmike\n\
    user> ls -lt\ntotal 16\nddrwxrwxrwx 2 root users 48 15:35 mikestext\n-rw-r--r--\
    \ 1 mike users 17 15:35 file-4\n-rw------ 1 andrew root 24 15:35 file-3\n-rw------\
    \ 1 david root 19 15:34 file-2\n-rw------ 1 linda root 19 15:33 file-1\nuser>\
    \ groups\nusers dialout video exec\nuser> cat mikestext\nMike says \"Hi!\"\nuser>\
    \ cat file-1 file-2 file-3\ncat: file-1: Permission denied\ncat: file-2: Permission\
    \ denied\ncat: file-3: Permission denied\nuser> \n```\n\nNotice that this user\
    \ was made a member of the \"exec\" group in the example on the previous page.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_191_1.png)\n\nEach set of permissions\
    \ can also be described numerically where Read = 4, Write = 2 and Execute = 1.\
    \ For instance, a value of 7 describes full permissions to Read, Write and Execute\
    \ (4 + 2 + 1), 6 describes permissions to Read, Write (4 + 2), and so on."
