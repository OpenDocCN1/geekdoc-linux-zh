  - '[PAGE 151]


    # # Changing the run level


    The Linux operating system can exist in any one of several numbered “run level”
    states. Each run level number describes the level of services that have been initialized
    and are running.


    | Run level | Description |

    |---|---|n| 0 | Halt – at this level the system is currently in the process of
    shutting down |

    | 1 | Single User – little more than a single console with almost all other services
    disabled. Typically used for maintenance, such as recovery from hack attacks or
    repair of disk corruption |

    | 2 | Basic multiuser – most services are running at this level, except for those
    services that enable network connections |

    | 3 | Full multiuser – starts enabled services in text interface mode but does
    not start the X-windows server to run Graphical User Interface desktops |

    | 4 | User Defined – has no conventional definition but may be custom configured
    by the user |

    | 5 | Full multiuser graphical desktop – starts all enabled services including
    the X-windows server to run Graphical User Interface desktops. Typically this
    is the default level for Linux single-user installations |

    | 6 | Reboot – at this run level the system is currently in the process of rebooting
    |


    ![](img/0494b98ec9ddc4515587e9808d73902e_151_0.png)


    From switching on your system the Linux boot process first starts basic services,
    to attain run level 1, then starts further services to continue to move up through
    successive run levels. Finally, when the Graphical User Interface desktop has
    loaded, your Linux operating system is running at level 5.


    The boot process calls upon the init program to establish each run level and the
    root super user can also call this program to switch between different run levels
    manually.'
  - '[PAGE 152]


    # ...cont''d


    | init n | switch the system to run level n |

    | who -r | show the current run level |

    | startx | start the X-windows server |

    | shutdown -h +n | shutdown the system in n minutes |


    ![](img/0494b98ec9ddc4515587e9808d73902e_152_0.png)


    You can use the "man" command followed by a command name, space and see the manual
    page giving full information on any command.


    Many Linux systems, such as those operating as web servers, always exist at run
    level 3 – without a Graphical User Interface. From run level 5 login to the shell
    as the root user then type "init 3" and hit Return to take your operating system
    down to the Text User Interface. Here you can once more login and continue to
    use the shell.


    To see the current run level at any time may type the command "who -r" at prompt.
    The root super user can restart the X-windows server at run level 3 using the
    startx command to open the root Graphical User Interface. Alternatively, the root
    user can resume the full run level 5 Graphical User Interface with the "init 5"
    command.


    Issuing the command "init 0" will shutdown the system abruptly. A more friendly
    shutdown can be achieved, by supplying a numeric argument to the "shutdown -h
    +" command specifying the number of future minutes at which the system will be
    halted – this issues system-wide warnings to all users so they can complete current
    tasks before shutdown.


    ![](img/0494b98ec9ddc4515587e9808d73902e_152_1.png)


