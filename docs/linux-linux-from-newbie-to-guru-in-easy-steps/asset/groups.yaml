    # ...cont''d


    In Linux this type of shortcuts are known as “hard links” – they point directly
    to the system address at which the target is located on the hard disk drive.


    ![](img/0494b98ec9ddc4515587e9808d73902e_72_0.png)


    Linux also allows the creation of “soft link” shortcuts (also known a “symbolic
    links” or just “symlinks”). This type of link stores the path to the target as
    a URL which Linux knows to.


    Hard links can only point to files on the same file system whereas soft links
    can point to both local and remote locations – such as a web address page.


    To make a soft link to a file right-click on the desktop then click on the Create
    New menu and select the Link To Location option:


    ![](img/0494b98ec9ddc4515587e9808d73902e_72_1.png)


    In the dialog that appears browse to the location to which you want the shortcut
    to point then click the OK button – an icon gets added to the desktop displaying
    the same file name as that to which is soft linked.


    A soft link can be made to an application in the same way by selecting the Create
    New, Link to Application option from the desktop context menu.


