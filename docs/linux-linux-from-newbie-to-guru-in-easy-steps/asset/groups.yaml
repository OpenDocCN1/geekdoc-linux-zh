    ## Useful Linux resources


    The examples in this book hopefully demonstrate that the free Linux operating
    system, and the open-source applications bundled with most distros, are perfectly
    capable of performing all the routine daily requirements of most desktop users.


    Additionally, those features of Linux that are not available in other operating
    systems present new exciting possibilities.


    Fittingly for a network operating system there are abundant resources on the internet
    to help you discover more about Linux. The most obvious first call is the website
    for your chosen distro – for instance SUSE users can check the mailing lists on
    the openSUSE website at www.opensuse.org.


    ![](img/0494b98ec9ddc4515587e9808d73902e_225_0.png)


    Disk ISO images of freely-available Linux distros can be downloaded from www.linuxiso.org.
    These can be burned onto CD-ROM to produce a Linux distro installation set.


    A wealth of general Linux information can be found on the Linux website at www.linux.org.
    This includes links to lots of Linux application home pages, downloads, and documentation.


    Help on all matters can be sought from the vast community of Linux users, developers,
    and enthusiasts in the Linux Forum at www.linuxforum.com. This site hosts many
    individual forums on specific Linux topics including troubleshooting hardware,
    and distribution issues.


    You can read about all the latest Linux developments on the Linux Today at http://linuxtoday.com.
    This excellent site is updated daily with Linux news from around the world.


    Lots of interesting articles about Linux appear in the monthly printed publication
    “Linux Magazine”. Worldwide subscription is available online at www.linux-mag.com,
    where you can also read some great feature articles.


    These, and many more, online resources let you keep pace with the latest innovations
    as Linux continues its progress into the desktop operating system market. They
    can help develop your skills to take full advantage of the power and flexibility
    of this great operating system – happy computing with Linux!


    ## Reference section


    This section provides an alphabetical listing and brief description of common
    builtin shell commands, command line program calls, and scripting keywords. This
    is not a comprehensive list of all shell commands but simply a quick guide to
    some of the most popular ones. Refer to the man pages for more information about
    any command and to see details of available options.


    ## Commands and Keywords


    ![](img/0494b98ec9ddc4515587e9808d73902e_227_0.png)


    | Command | Description |

    | :--- | :--- |

    | alias | create a command alias |

    | aspell | interactively check spelling |

    | at | run a recurring job at a specified time |

