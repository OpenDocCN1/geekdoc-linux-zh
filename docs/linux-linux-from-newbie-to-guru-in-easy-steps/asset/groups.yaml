    # # Making a wireless connection


    The KInernet application that is bundled with the SUSE Linux distro allows quick''nasy
    wireless connection to the internet. It typically is started automatically during
    the boot process and resides in the system tray at the bottom right of the desktop
    – represented by an icon depicting a connector, as shown below:


    ![](img/0494b98ec9ddc4515587e9808d73902e_39_0.png)


    If the icon is not present KInernet can be launched by clicking the "Dial Up"
    item under the "Internet" group in the main menu. With KInernet running a right-click
    on its system tray icon reveals the context menu. To establish an internet connection
    via a wireless ethernet card first select the "Wireless connection" item in the
    context menu:


    ![](img/0494b98ec9ddc4515587e9808d73902e_39_1.png)


    Use the "Settings" item on the context menu to configure KInernet to start automatically
    whenever KDE gets started.


    ![](img/0494b98ec9ddc4515587e9808d73902e_39_2.png)


    A dialog box opens in which you may scan for available wireless networks. Select
    the one you wish to use for internet connection then click on the "Connect" button.'
