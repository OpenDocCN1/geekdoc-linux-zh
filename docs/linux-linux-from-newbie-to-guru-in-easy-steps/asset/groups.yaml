    ## Linux 桌面：为用户日常活动提供了所需的工具。它与 Linux 操作系统建立接口，用于访问和管理文件、文件夹和程序。它提供了集成的 OpenOffice
    应用程序套件，能够以多种格式（包括 Microsoft Office 格式）保存文件。流行的桌面包括 Firefox Web 浏览器，以及用于电子邮件、日历管理和联系人管理的
    Evolution。


    - 桌面图标 – 通过点击图标访问系统上的程序和功能。你可以根据意愿在桌面添加任意数量的图标


    ![](img/0494b98ec9ddc4515587e9808d73902e_1_0.png)


    - 桌面区域 – 右键点击背景访问菜单以创建对象：清理桌面、对齐图标或更改背景


    - 开始菜单 – 使用程序、系统和帮助菜单访问系统上的应用程序和工具


    - 快速启动启动器 – 只需点击快速启动区域中的图标即可打开程序


    - 底部面板 – 显示用于重新打开最小化应用程序的按钮


    - 快速启动区域 – 用于快速重新打开最小化的应用程序


    - 工作空间切换器 – Linux 桌面提供了多个虚拟工作空间来组织你的工作。点击切换器以访问所需的工作空间


    ## Linux 终端（Shell）：提供了对操作系统核心内核的强大访问权限，用于管理文件、文件夹和程序。它提供了多个虚拟控制台来控制根级别、网络配置、作业调度、运行进程、访问权限、用户和组管理等。可以轻松创建
    Shell 脚本来自动化任务并自定义 Shell 环境。了解 Shell 允许用户充分利用 Linux 的功能。


