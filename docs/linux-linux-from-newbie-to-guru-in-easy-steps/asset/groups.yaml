    Launch OpenOffice then click the File, New menu to be presented with a sub-menu
    of possible document types – for regular word processing choose the Text Document
    option. A new blank document then appears where you can position the cursor and
    begin typing text content.


    You can modify the appearance of selected text using the options on the Object
    Bar to change the font, size, style, decoration, weight, alignment, color and
    background color. Automatic numbering or bullets may also be added to list items.


    The Insert menu has options to add graphics, hyperlinks, tables and OLE objects
    in the document.


