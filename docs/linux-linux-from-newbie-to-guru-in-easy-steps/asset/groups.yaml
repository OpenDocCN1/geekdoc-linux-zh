  - '[PAGE 103]


    # Introducing the GIMP


    The GIMP has much of the functionality found in Photoshop. In some areas it even
    has more capacity – but in other areas it has less. Unlike Photoshop, the GIMP
    is open-source software available free of charge under terms of the General Public
    License.


    ![](img/0494b98ec9ddc4515587e9808d73902e_103_0.png)


    The results of GIMP plugins can be less predictable than those in Photoshop for
    inexperienced users.


    There are over 220 plug-ins included in the standard GIMP installation that cover
    virtually all the capabilities of the plug-ins that can be purchased as accessories
    for Photoshop. Many of the GIMP plug-ins are more configurable than those in Photoshop
    too, which means they can create more powerful effects in the hands of an experienced
    user.


    The GIMP can read image files in the Photoshop “psd” file format – so if you have
    a library of files in that format you can use the GIMP to edit them.


    One major advantage of the GIMP over Photoshop is its scripting ability – in no
    less than four scripting languages. You can write scripts to create custom effects
    using PERL (Practical Extraction and Reporting Language) scripting – the preferred
    language of CGI scripts. The scripting capability of the GIMP is unmatched by
    Photoshop.


    Linux in easy steps'
  - '[PAGE 104]


    # ...cont''d


    The major pitfall of GIMP is its lack of support for CMYK colors or spot colors,
    such as PANTONE – it only supports 8-bit RGB, grayscale and indexed images. The
    GIMP cannot, therefore, compete with Photoshop in the prepress field, but does
    offer some exciting possibilities in the creation of digital images for the web.


    When the GIMP is launched for the first time it installs configuration files -
    just click OK to accept the default selections. The splash screen (opposite) displays
    while the application loads.


    You will notice that the GIMP looks very different to Photoshop. It opens with
    the Toolbox dialog, and usually further dialogs for Tool Options, Layers, Channels
    & Paths, and Brush Selection – like those illustrated below.


    ![](img/0494b98ec9ddc4515587e9808d73902e_104_0.png)


    The icons on the buttons broadly correspond to those in Photoshop''s toolbox –
    hover over any button to see a tooltip describing its purpose. Notice that the
    GIMP toolbox also has menus.


    ![](img/0494b98ec9ddc4515587e9808d73902e_104_1.png)


