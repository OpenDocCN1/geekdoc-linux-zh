    ## Advanced shell scripting


    This chapter demonstrates the intrinsic ability to execute intelligent instructions
    at the Linux shell prompt. It shows how to develop multiple instructions into
    a script that can accomplish tasks a single command cannot. It illustrates how
    to perform loops and conditional branching with variables, input, and output.


    - Inputting and outputting values | 210

    - Evaluating expressions | 212

    - Branching statements | 214

    - Responding to input | 216

    - Looping constructs | 218

    - Generating random numbers | 220

    - Working with arrays | 222

    - Useful Linux resources | 224


    ## Inputting and outputting values


    The introduction to the Linux shell demonstrated how to create variables and assign
    values to them. Remember that whitespace is not permitted in assignment because
    that would truncate the expression. This is because the shell evaluates complete
    keywords, separated by whitespace, and is why there must be space between command
    and its arguments. Strictly speaking, all variable values are stored as strings
    but the shell will intelligently treat them as numeric when appropriate.


    Any variable value can be displayed by the echo command which, by default, adds
    a newline so the prompt reappears on the next line. The newline can be suppressed
    by adding the "-n" option. Another useful option for the echo command is the "-e"
    option that allows you to specify simple formatting using "escape" sequences.
    The most frequently used sequences are \n (add a newline) and \t (add a tab) –
    both used in the screenshot below the echo command:


    ![](img/0494b98ec9ddc4515587e9808d73902e_211_0.png)


    See page 52 for an introduction to shell variables. Notice that escape sequences
    are included inside the quotes – not outside.


    ![](img/0494b98ec9ddc4515587e9808d73902e_211_1.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Help

    user> INT=7

    user> PI=3.1415926

    user> CHAR=C

    user> STR="Hello World"

    user> echo "Stored integer is" $INT

    Stored integer is 7

    user> echo "Pi is worth around" $PI

    Pi is worth around 3.1415926

    user> echo "Programming with" $CHAR

    Programming with C

    user> echo -n $STR

    Hello World

    user> echo -e "\n\t$STR"

    Hello World

    user>

    ```


    210 Linux in easy steps


    As an alternative to assigning a value to a variable with the "=" operator the
    "read" command can assign one line of input to a variable – without requiring
    a string to be enclosed within quotes:


    ```

    Shell - Konsole

    Session Edit View Bookmarks Help

    user> read INT

    5

    user> read PI

    3.142

    user> read CHAR

    M

    user> read STR

    Linux in easy steps

    user> echo "Stored integer is" $INT

    Stored integer is 5

    user> echo "Pi is worth around" $PI

    Pi is worth around 3.142

    user> echo "Programming with" $CHAR

    Programming with M

    user> echo -e "\n\t$STR"


    The ability to take input, in a variable, store it, then output the stored value
    later, creates a very basic level of shell interaction that simply repeats the
    input value, parrot-fashion. More useful, shell interaction can be enhanced by
    evaluating the input values and providing meaningful output based upon the result
    of the evaluation.


    ## Evaluating expressions


    The "expr" command enables you to perform simple math calculations at the shell
    prompt. It recognizes the usual arithmetic operators but those which have other
    meanings in the shell need to be prefixed by a backslash escape character. For
    instance, the * asterisk is a wildcard in the shell, but the multiplication operator
    in math expressions – so must be escaped.


    The arithmetic operators are:

    - "+" addition

    - "-" subtraction

    - "/" division

    - "%% modulus


    ![](img/0494b98ec9ddc4515587e9808d73902e_213_0.png)


    Each argument must be separated by whitespace, and parentheses can be used to
    establish operator precedence in longer expressions – but each parenthesis character
    must be escaped.


    The expr command can also perform boolean evaluations that return true (1) or
    false (0). In the example below it is true (1) that 7 is not equal (!= to 3:


    You can quickly launch a graphical calculator from X shell window using the "xcalc"
    command.


    ![](img/0494b98ec9ddc4515587e9808d73902e_213_1.png)


    ```

    user expr 7 + 3

    10

    user expr 7 \* 3

    21

    user expr 7 \* \(3 + 1 \)

    28

    user expr 7 != 3

    1

    user expr length "Linux in easy steps"

    19

    user expr substr "Linux in easy steps" 7 13

    in easy steps

    user expr index "Linux in easy steps" "x"

    5

    user>

    ```


    Simple string functions such as "length" can be used with the expr command to
    discover the length of a string. The "substr" function extracts a substring of
    specified length, starting at a given position, and the "index" function gives
    the position at which a specified character first appears in the string.


    The result of an expression evaluation can be made to cause a particular output
    using an “if-then” statement. This has two parts that state the expression to
    be evaluated, and the text to output only when the result is true. The “if” keyword
    begins the statement and is followed by the test expression enclosed within a
    pair of brackets. Each part of the entire statement must be separated from the
    next by whitespace to enable the shell to evaluate the expression. The “then”
    keyword begins the second part of the statement and contains the command/s to
    execute if the test is true. This ends with the “fi” keyword, marking the end
    of the statement.


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_0.png)


    Leave a space after the “if” keyword to avoid an error. Leave a space after the
    “[]” bracket to avoid an error. Leave a space before the “[]” bracket to avoid
    an error.


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_1.png)


    The string comparison operators are “==” equality and “!=” inequality. The numeric
    comparison operators are “eq” equality, “ne” inequality, “gt” greater than, “lt”
    less than, “ge” greater or equal, and “le” less or equal.


    Type the first part of the statement then hit Return to be prompted to enter the
    rest of the statement. Alternatively, type the entire statement separating each
    part with a semicolon. This example illustrates both and uses the “ne” numeric
    inequality operator and the “=” string equality operator to evaluate expressions:


    Notice how output is displayed on the two occasions when the result is false.


    | Session | Edit | View | Bookmarks | Settings | Help |


    ```

    user if [ 7 -ne 3 ]

    > then echo "true"

    > fi

    true

    user if [ 7 -ne 3 ]; then echo "true"; fi

    true

    user if [ 7 -ne 7 ]; then echo "true"; fi

    true

    user if [ string = string ]

    > then echo "correct"

    > fi

    correct

    user if [ string = rope ]

    > then echo "correct"

    > fi

    user>

    ```

