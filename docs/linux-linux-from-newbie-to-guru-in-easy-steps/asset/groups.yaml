    ## 11. Extending your Linux system


    ### Switching desktop managers


    In Linux the desktop manager is responsible for controlling the graphical “X”
    environment which determines all desktop features. The KDE desktop manager provides
    one of the most popular and comprehensive desktop environments but most distros
    include other desktop managers that you can try.


    To change from the KDE desktop manager select the Start, Log Out menu as if you
    were closing the computer but choose the End Current Session on the dialog:


