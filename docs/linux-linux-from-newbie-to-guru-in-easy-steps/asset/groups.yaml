    # Creating and editing graphics


    This chapter looks at the most popular graphics software, GIMP.


    - Introducing the | 102

    - Starting the | 104

    - Opening the | 106

    - Working with | 108

    - Using the | 110

    - Selecting | 112

    - Storing the | 114


    # Introducing the GIMP


    The GIMP has much functionality than Photoshop. In some areas it has less. Unlike
    Photoshop, the GIMP is open-source software available free under the General Public
    License.


    The major pitfall of GIMP is its lack of support for CMYK colors or spot colors,
    such as PANTONE; it only supports 8-bit RGB, grayscale and indexed images. The
    GIMP cannot, therefore, compete with Photoshop in the prepress field, but does
    offer some exciting possibilities in the creation of digital images for the web.


    One major advantage of GIMP over Photoshop is its scripting ability. You can write
    custom effects using PERL (Practical Extraction and Reporting) scripting – the
    preferred language of CGI.

