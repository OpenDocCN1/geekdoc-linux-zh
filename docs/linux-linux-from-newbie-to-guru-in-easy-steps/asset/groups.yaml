    and Slack. Each distro has its own installer and unique default configuration
    according to what the distributor considers to be the best arrangement. The ideal
    one for you will depend on your own personal preferences and how you want to use
    Linux. The most popular distros are described below to help you choose.


    ![](img/0494b98ec9ddc4515587e9808d73902e_11_0.png)


    Many other Linux distros can be found online. (disk images) can be downloaded
    to create a Linux installation disk.


    # RedHat Fedora


    One of the most published Linux distros comprising the commercial RedHat Enterprise
    Linux product line and the unsupported free Fedora Core distro that is developed
    by the community, serving as a test base for RedHat Enterprise Linux. Pros: Widely
    used, excellent community support, innovative. Cons: Limited product life-span
    of the free edition, poor multimedia support.


    ![](img/0494b98ec9ddc4515587e9808d73902e_11_1.png)


    # Fedora


    Free download at http://www.fedora.redhat.com.'
  - '[PAGE 12]


    ...cont''d


    # SUSE


    Another distro with desktop focus which has received positive reviews for its
    installer and YaST configuration tools. The documentation, which comes with the
    boxed product, has been labeled as the most complete, thorough and usable by far.

    Pros: Attention to detail, easy-to-use YaST configuration tools

    Cons: Huge distro – including over 1,500 bundled packages

    Free download at http://www.opensuse.org.


    ![](img/0494b98ec9ddc4515587e9808d73902e_12_0.png)


    # Mandriva


    Formerly called Mandrake, this distribution has experienced an enormous rise in
    popularity since its first release in July 1998. The developers took the RedHat
    distribution, which changed the default desktop and added an easy-to-use installer,
    breaking the myth that Linux is hard to install. Mandrake''s hardware detection
    features and disk partitioning utilities are considered by many to be the best
    in the industry.

    Pros: User-friendly, graphical configuration utilities, enormous community support,
    NTFS partition resizing.

    Cons: Some releases are buggy, the releases are initially made to MandrivaClub
    members only.

    Free download at http://www.mandrivalinux.com.


    ![](img/0494b98ec9ddc4515587e9808d73902e_12_1.png)


    # Ubuntu


    This distro has stormed the Linux distribution scene like no other Linux project
    before. It has done so in a fashion resembling a highly sophisticated player;
    it seems to have first observed all other major distributions, learnt from their
    mistakes and combined the best features of all of them into one superior product.
    A six-month''s release cycle, up-to-date package set, a clearly set product lifetime
    (at 18 months), fast download mirrors, great documentation, even free CDs and
    free shipment anywhere in the world to those interested in the distribution.

    Pros: Great community of developers and users, fixed release cycle and support
    period

    Cons: Not fully rounded. Ubuntu''s backers have not yet built a viable business
    model around the distribution

    Free download at http://ubuntlinux.org.


    ![](img/0494b98ec9ddc4515587e9808d73902e_12_2.png)'
  - '[PAGE 13]


    # Evaluating hardware suitability


    Before installing Linux on a computer it is necessary to evaluate its hardware
    specifications for suitability. The table below suggests minimum specifications
    for processor, memory and hard disk (HD) drive.


    > ⚠️ Linux can be installed on systems that fall below these suggested levels
    but performance may be impaired.


    | Hardware item | Suggested minimum |

    | --- | --- |

    | CPU speed | 300Mhz minimum (1.0Ghz+ is better) |

    | Memory size | 128Mb (256Mb+ is better) |

    | HD drive capacity | 5Gb minimum (10Gb+ is better) |


    It''s easy to discover the CPU and memory information if Windows is already installed
    on the computer – right-click on the My Computer icon then select Properties to
    open the System Properties dialog box. The details are displayed under the General
    tab, as illustrated below.


    > 🔥 The CPU and memory details are also usually displayed by the BIOS when the
    computer gets booted up.


    ![](img/0494b98ec9ddc4515587e9808d73902e_13_0.png)'
  - '[PAGE 14]


    To discover the available HD drive capacity in Windows, click on the My Computer
    icon then right-click on the HD drive icon and select Properties to open the Local
    Disk Properties dialog box. Drive capacity information is displayed under the
    General tab. On the HD drive illustrated below 5Gb of the free space could be
    given over to Linux.


    Devoting 5Gb to Linux on the drive shown here does not leave much space for further
    work in Windows.


    ![](img/0494b98ec9ddc4515587e9808d73902e_14_0.png)


    Consideration should also be given to the hardware used to connect to the Internet.
    Connection via a PCI ethernet card, or on-motherboard ethernet connector, is very
    well supported in Linux and virtually all hardware of this type is suitable.


    Unfortunately modems are rather more problematic. Many computers are supplied
    with an internal PCI modem that will only work with Windows software. These so-called
    “winmodems” are unsuitable for connection to the Internet in Linux. If you have
    an internal modem and find it unusable in Linux you will probably have to replace
    it with different hardware before you can connect to the Internet. Usually the
    easiest solution is to connect an external modem via a traditional RS232 serial
    port.


    If you are really determined to try to get your winmodem working in Linux visit.linmodems.org
    to discover lots of useful advice.'
