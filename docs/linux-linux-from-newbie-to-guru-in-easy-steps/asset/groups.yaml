    ## OpenOffice Calc 中的电子表格


    启动 OpenOffice，然后点击“文件(File)”、“新建(New)”菜单，将显示一个可能的文档类型的子菜单——对于电子表格，选择“电子表格(Spreadsheet)”选项。会出现一个新的空白电子表格，它由行和列的单元格组成，你可以在其中放置光标并输入内容。


    点击单元格并输入文本，可以是电子表格单元格的标题或描述标签。拖动鼠标选择所有你想包含实际数值内容的单元格，然后打开“格式(Format)”菜单并选择“单元格(Cells)”选项。在“数字(Numbers)”选项卡下选择“货币(Currency)”并为你的货币选择格式，然后点击“确定(OK)”按钮——确保值保留两位小数。例如，设置美元并在数据单元格中输入“5”，然后选择另一个单元格以应用该输入——该值将显示为“5.00”。下方电子表格中的数据描述了一个四周内的支出表。


    ![](img/0494b98ec9ddc4515587e9808d73902e_83_0.png)


    要快速选择列或行中的所有值，请点击灰色列标题按钮或灰色行按钮，其总和将立即显示在状态栏中。


    电子表格的强大在于它们能够使用公式对数据输入进行计算。例如，要计算上述示例中第一周的支出总额，点击该行的“总计(Total)”单元格，然后输入“=”——符号会出现在该单元格中，也会出现在公式栏的输入框中。在该单元格或输入框中添加公式。在此处，它是第一周行中每天单元格之和——因此你需要输入
    `B5+C5+D5+E5+F5`。按回车键(Return)应用公式，总和值将出现在“总计”单元格中。


    ## 续


    另一种，可以使用 `SUM()` 函数来确定总值。在“总计”单元格中输入“=S”，会出现一个提示你使用 `SUM()` 函数的工具提示。按回车键确认你想使用此函数，选择你想计算总和的单元格——在上面的示例中为
    B5、C5、D5、E5 和 F5。公式将以 `=SUM(B5:F5)` 出现在单元格和公式栏输入框中。按回车键应用公式，总值将出现在“总计”单元格中。


    ![](img/0494b98ec9ddc4515587e9808d73902e_84_0.png)


    在数据单元格行的末尾选择一个空单元格，然后点击公式栏上的字符，查看输入框中出现的建议公式——按回车键接受并应用公式。


    同样，可以使用完全相同的方法 `AVERAGE()` 函数来计算值范围的平均值。在“平均(Average)”单元格中输入“=A”，会出现一个提示你使用 `AVERAGE()`
    函数的工具提示。按回车键，然后高亮你想计算平均值的单元格。再次按回车键应用公式，平均值将出现在“平均”单元格中。


    应用公式可以快速创建每周每每天的总和和平均值。右键点击单元格区域，在右键菜单中选择“单元格格式(Format Cells)”选项，并选择背景颜色来突出显示这些单元格中的数据。


    | | | 周一 | 周二 | 周三 | 周四 | 周五 | 总计 | 平均值 |

    |---|---|---|---|---|---|---|---|---|

    | 1 | 第1周 | $2.70 | $2.30 | $2.50 | $2.85 | $2.90 | $13.05 | $2.61 |

    | 2 | 第2周 | $2.75 | $2.20 | $2.40 | $2.00 | $2.35 | $11.95 | $2.39 |

    | 3 | 第3周 | $2.70 | $2.70 | $2.70 | $2.25 | $2.30 | $12.70 | $2.54 |

    | 4 | 第4周 | $2.70 | $2.70 | $2.70 | $2.70 | $2.68 | $13.48 | $2.68 |

    | 5 | 总计 | | $10.85 | $9.90 | $10.20 | $9.60 | $10.05 | $50.60 |

    | 6 | 平均值 | | $2.71 | $2.48 | $2.55 | $2.40 | $2.51 | $2.53 |


    要保存电子表格，点击“文件(File)”、“另存为(Save As)”菜单，并在保存对话框中输入文件名——OpenOffice Calc 的原生格式会添加文件扩展名
    “.ods”。如果你希望电子表格能在 MS Office 软件件中的 Excel 中运行，请选择文件格式 “.xls”。


    ## 7. 访问 OpenOffice 套件


    启动 OpenOffice，然后点击“文件(File)”、“新建(New)”菜单，将显示一个可能的文档类型的子菜单——对于幻灯片演示，选择“演示(Presentation)”选项。会出现“幻灯片向导(Presentation
    Wizard)”对话框，你可以在其中从头创建演示、使用提供的模板或打开现有演示进行编辑。


    要开始一个新幻灯片，勾选“空白幻灯片(Empty Presentation)”，然后点击“下一步(Next)”按钮查看背景选择——选中每个选项时都会显示预览。选择你的喜好，然后点击“下一步(Next)”继续。下拉列表中提供了多种过渡效果——选择你偏好的效果，然后点击“创建(Create)”按钮打开“幻灯片(Slide)”对话框。


    点击最适合你想在幻灯片上显示的内容的布局，所选布局将应用到幻灯片。


    要对任何 OpenOffice 窗口中的文本进行拼写检查，点击“工具(Tools)”菜单上的“检查(Check)”选项——或按 F7。


    ![](img/0494b98ec9ddc4515587e9808d73902e_85_0.png)


    可以使用右右键菜单或“格式(Format)”菜单上的选项修改所选文本的外观。例如，选择一些文本来修改字符字体和位置(Character Font and Position)。


    ## ...续


    右键菜单可以将动画效果应用于文本块——但这些应谨慎使用。


    当你对幻灯片的外满意时，从右键菜单选择“幻灯片(Slide)”、“新建(New)”来添加另一张幻灯片。重复布局过程，为新幻灯片添加内容。


    要运行幻灯片，点击“幻灯片(Slide)”菜单上的“播放(Show)”选项，或按 F5 进阶。


    ![](img/0494b98ec9ddc4515587e9808d73902e_86_0.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_86_1.png)


    ## 访问


    - 在这个重制的演示中，可以使用现代效果。


    ![](img/0494b98ec9ddc4515587e9808d73902e_86_2.png)


    要保存幻灯片，点击“文件(File)”、“另存为(Save As)”菜单，并在保存对话框中输入文件名——OpenOffice Impress 的原生格式会添加文件扩展名
    “.odp”。如果你希望演示能在 MS 软件件中的 PowerPoint 中运行，请选择文件格式 “.ppt”。


    ## OpenOffice Draw 中的图表与图形


    启动 OpenOffice，然后点击“文件(File)”、“新建(New)”菜单，将显示一个可能的文档类型的子菜单——对于图表、图形，选择“绘图(Drawing)”选项。会出现一个空白绘制区域，可以在其中创建图形。


    窗口左侧的工具栏包含一系列预定义对象。点击并按住这些对象的任意一个打开显示选项的小窗口。例如，3D 对象提供了立方体、锥体、球体等。


    ![](img/0494b98ec9ddc4515587e9808d73902e_87_0.png)


    点击任何形状将其，然后将光标拖入绘制区域创建该对象。与其他程序一样，选中的对象具有可以调整大小的句柄。点击绘制区域中的现有对象以显示句柄——点击任何句柄即可调整大小。右键点击选中的对象打开右键菜单，可以在那里修改对象的外观。下方截图显示了
    OpenOffice Draw 中的许多矢量对象——许多已过修改以说明可能的填充方式。


    ![](img/0494b98ec9ddc4515587e9808d73902e_87_1.png)


    矢量对象的范围包括贝塞尔线，以及允许你快速创建流程图的连接线。


