    Return key. The shell will create the new directory within the current working
    directory. Alternatively supply a full directory path as the argument to the mkdir
    command to create the directory there.


    ![](img/0494b98ec9ddc4515587e9808d73902e_159_0.png)


    ```

    Shell - Konsole

    Session Edit View Settings Help

    user> echo $SHELL

    /bin/bash

    user> basename $SHELL;dirname $SHELL

    bash

    /bin

    user> pwm ; ls

    /home/mike/Folder Sub1

    user> mkdir /home/mike/Folder/Sub2

    user> pwd ; ls

    /home/mike/Folder

    Sub1 Sub2

    user> |

    ```


    158 Linux in easy steps'
  - '[PAGE 160]


    In an effort to prevent accidental deletion of files the rmdir

    command will only delete the directory named as its argument if

    that directory is empty:


    ![](img/0494b98ec9ddc4515587e9808d73902e_160_0.png)


    Having to delete each file manually may provide safeguards

    but can also be tedious. The rm command offers an intelligent

    alternative when used with the recursive -ri options.

    This steps inside the directory and automatically looks at each file

    - requesting your confirmation before deleting each one. If all files

    deleted it then asks if you want to delete the directory:


    ![](img/0494b98ec9ddc4515587e9808d73902e_160_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_160_2.png)'
  - '[PAGE 161]


    # Performing basic file operations


    The shell “mv” command lets you easily move files around your Linux system from
    the command line. This command requires two arguments stating the name of the
    file to be moved and the destination to which it should be moved.


    | mv | move or rename a file |

    | cp | copy a file |

    | rm | delete a file |

    | in | create a link to a file |

    | readlink | show the target of a symbolic link |


    ![](img/0494b98ec9ddc4515587e9808d73902e_161_0.png)


    Interestingly, the mv command can also be used to rename a file by stating its
    current name and a new name as its two arguments.


    If you wish to copy, rather than move, a file to a new location the “cp” command
    can be used. This command can accept one or more names of files to be copied as
    its arguments, stating the destination as the final argument.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> ls

    Alpha Zebra

    user> ls Alpha

    doc-1 doc-2

    user> ls Zebra

    pic-1 text-1 text-2

    user> mv Alpha/doc-1 Zebra

    user> mv Alpha/doc-2 Alpha/renamed

    user> cp Zebra/pic-1 text-1 Alpha

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    doc-1 pic-1 text-1 text-2

    user>

    ```'
  - '[PAGE 162]


    # ...cont''d


    The “rm” command can be used to delete one or more files named as its arguments
    – use the * wildcard to delete all files in a directory.


    You can create hard links, pointing to the system address of a file, and soft
    (symbolic) links, storing the path to a file, with the “ln” command. By default
    this will create a hard link to the file named as its argument – use the -s option
    to create a symbolic link.


    The readlink command can be used to discover the target to which a symbolic link
    is pointing:


    ![](img/0494b98ec9ddc4515587e9808d73902e_162_0.png)


    See page 71 for more details on hard and soft links.


    ```

    Session Edit View Bookmarks Settings Help

    user> ls

    Alpha ls Zebra

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    doc-1 pic-1 text-1 text-2

    user> rm Zebra/*

    user> ln Alpha/pic-1 Zebra/pic

    user> ln -s Alpha/text-1 Zebra/txt

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    pic

    user> readlink Zebra/txt

    Alpha/text-1

    user>

    ```


    This example begins by listing the contents of two directories then deletes all
    contents of the second directory. Then it creates a hard link and a soft link
    there – pointing to files in the first directory.'
- md: "\n## Examining file properties\n\nThe Linux shell provides many commands which\
    \ can be used to examine the attributes of any file. The \"stat\" command lists\
    \ every important attribute of the file stated as its argument.\n\n| stat | show\
    \ file and directory attributes |\n| --- | --- |\n| wc | show word count of a\
    \ text file |\n| du | show disk usage of a file or directory |\n| file | estimate\
    \ the file type |\n| touch | create a file or update its time stamp |\n\nIn the\
    \ example below the stat command examines a small file and displays its size in\
    \ bytes (40), size in blocks (8), file type (regular), inode system address (111498),\
    \ number of hard links (1), access permissions, and timestamps:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_163_0.png)\n\
    \nIf you just want to see the file size use the \"du\" command with the -b option\
    \ to count the number of bytes it occupies.\n\n# cont'd\n\n![](img/0494b98ec9ddc4515587e9808d73902e_164_0.png)\n\
    \nUse the \"wc\" word count command to quickly discover how many lines, words,\
    \ and bytes a text file contains or assess what type of file it is with the \"\
    file\" command.\n\nThe touch command introduces some interesting possibilities\
    \ it can change the Last Accessed and Last Modified timestamps associated with\
    \ a file. Used alone it simply updates these to the present but used with the\
    \ -d option it allows you to specify a date in a wide variety of formats: specify\
    \ a day number and month to set the timestamps to midnight on that day of the\
    \ current year, or specify a complete date and time to be any timestamp you like.\n\
    \nThe example below demonstrates each of these commands in action then uses the\
    \ stat command to show how the timestamps now appear:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_164_1.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> wc little.txt\n\
    1 8 40 little.txt\nuser> du -b little.txt\n40 little.txt\nuser> file little.txt\n\
    little.txt: ASCII text\nuser> touch -d \"0/21\" little.txt\nuser> stat little.txt\n\
    File: 'little.txt' Blocks: 8\nSize: 40\nIO Block: 4096 regular file\nDevice: 342h/834d\
    \ Inode: 111498\nLinks: 1\nAccess: (0644/-rw-r--)\nUid: (1000/mike) Gid: (100/users)\n\
    Access: 2005-02-21 00:00:00.0000000000 +0000\nModify: 2005-02-21 00:00:00.0000000000\
    \ +0000\nChange: 2005-10-05 12:28:47.0000000000 +0100\nuser> \n```\n\n## Comparing\
    \ files\n\nThe shell provides several ways to compare two files. You can check\
    \ to see if two files are identical with the \"cmp\" command. If they are identical\
    \ the command reports nothing but if they differ it reports the location of the\
    \ first difference.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_165_0.png)\n\n\
    | | compare two files – line by line |\n| cmp | compare two files for identical\
    \ match |\n| diff | show the differences between two files |\n| md5sum | produce\
    \ a md5 checksum identifier |\n| cksum | produce a CRC identifier |\n\nText files\
    \ can be compared line by line with the \"comm\" command. Its output is slightly\
    \ unusual as it creates three columns to indicate lines that match in each file:\n\
    \n- Column 1 – lines found in the first file, but not the second\n- Column 2 –\
    \ lines found in the second file, but not the first\n- Column 3 – lines found\
    \ in both files\n\nThe first file contains three lines \"alpha\", \"beta\", \"\
    charlie\", and the second contains three lines \"alpha\", \"charlie\", \"delta\"\
    :\n\n![](img/0494b98ec9ddc4515587e9808d73902e_165_1.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> ls\nabc.txt acd.txt\nuser> cmp\
    \ abc.txt acd.txt\nabc.txt acd.txt differ: byte 7, line 2\nuser> comm abc.txt\
    \ acd.txt\n      alpha\nbeta      charlie\n      delta\nuser>\n```\n\n“diff” command\
    \ offers an alternative to the comm command for comparison of text files. It too\
    \ compares line by line and it produces a detailed report showing any unique lines.\
    \ It can also be used to compare two directories to reveal unique files.\n\nFiles\
    \ may also be compared using checksum numbers to verify their integrity. Checksum\
    \ numbers are often found on the internet. The \"md5sum\" command produces a 32-byte\
    \ checksum identifier for the file. The \"cksum\" command generates a CRC (Cyclic\
    \ Redundancy Check) value.\n\nText files can be compared line by line with the\
    \ \"comm\" command. Its output is slightly unusual as it creates three columns\
    \ to indicate lines that match in each file:\n\n- Column 1 – lines found in the\
    \ first file, but not the second\n- Column 2 – lines found in the second file,\
    \ but not the first\n- Column 3 – lines found in both files\n\nThe first file\
    \ contains three lines \"alpha\", \"beta\", \"charlie\", and the second contains\
    \ three lines \"alpha\", \"charlie\", \"delta\":\n\nThe “diff” command offers\
    \ an alternative to the comm command for comparison of text files. It too compares\
    \ line by line and it produces a detailed report showing any unique lines. It\
    \ can also be used to compare two directories to reveal unique files.\n\nFiles\
    \ may also be compared using checksum numbers to verify their integrity. Checksum\
    \ numbers are often found on the internet. The \"md5sum\" command produces a 32-byte\
    \ checksum identifier for the file. The \"cksum\" command generates a CRC (Cyclic\
    \ Redundancy Check) value.\n\nThe \"md5sum\" command produces a 32-byte checksum\
    \ identifier for the file. The \"cksum\" command generates a CRC (Cyclic Redundancy\
    \ Check) value.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_166_0)\n\n## Locating\
    \ files\n\nThe shell provides several ways to locate files. The \"find\" command\
    \ is a powerful tool used to search for files based on various criteria such as\
    \ name, size, modification time, and permissions. The syntax of the find command\
    \ is generally: `find [path] [expression]`. For example, to search for a file\
    \ by name in the current directory, you would use:\n\n`find . -name \"filename\"\
    `\n\nYou can also search in specific subdirectories:\n\n`find /home/user -name\
    \ \"filename\"`\n\nThe find command can also be used to find files by size:\n\n\
    `find . -size +10M` (finds files larger than 10MB)\n\nAnd by modification time:\n\
    \n`find . -mtime -7` (finds files modified modified within the last 7 days)\n\n\
    The find command is incredibly versatile and can be used for many complex tasks\
    \ in Linux administration.\n\n## Manipulating text in the shell\n\nThis chapter\
    \ demonstrates how to read, write, and edit documents in the shell. It shows how\
    \ to manipulate content, check spellings, and match patterns. It also illustrates\
    \ how to move around virtual consoles.\n\n- Viewing text files | 168\n- Creating\
    \ and editing files | 170\n- Switching between virtual consoles | 172\n- Manipulating\
    \ text content | 174\n- Matching patterns | 176\n- Checking spelling | 177\n-\
    \ Printing from the shell | 178\n\n## Viewing text files\n\nThe simplest way to\
    \ view a text file in the shell is with the \"cat\" command. Just state one or\
    \ more files to its arguments and it will display their content, concatenating\
    \ the text together.\n\n| cat | show concatenated text content |\n| (pipe) | redirect\
    \ text stream to another command |\n| less | show one screen at a time |\n| head\
    \ | show the first lines of text |\n| tail | show the final lines of text |\n\
    | ni | show text with each line |\n\nViewing one or two small text files will\
    \ fit comfortably in a single window so you will see the entire text. Larger files,\
    \ however, will exceed the space in a single window so you will only see the final\
    \ part of the text. The solution is to send the text stream to the “less” command\
    \ via the “|” character. This means that the text is displayed one screen at a\
    \ time, starting from the beginning:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_169_0.png)\n\
    \nThe “less” facility offers many great options – press the H key to view the\
    \ Help page when in “less mode”.\n\nIn the shell in “less mode” use the Page Down\
    \ and Page Up keys to move through the text. You can skip to the end of the text\
    \ with the “>” key and exit back to a prompt at any time by pressing the “q” key\
    \ on your keyboard.\n"
  mdcn: "\n\n## 检查文件属性\n\nLinux shell 提供了许多命令，用于检查任何文件的属性。\"stat\" 命令可以列出作为参数参数的文件的每一个重要属性。\n\
