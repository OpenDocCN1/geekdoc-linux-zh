    ## 为 Linux 留空间


    操作系统安装在硬盘（HD）驱动器上的定义区域上，称为“分区”。当 Windows 是唯一安装的操作系统时，它的分区通常会占据整个硬盘。在这种情况下，安装 Linux
    有三种可能的选项：


    -   删除 Windows 分区 – 用占据整个硬盘的 Linux 分区（或多个）替换它。此选项将删除 Windows 操作系统以及安装在其中的所有应用程序和数据文件。它将创建一个专用的
    Linux 计算机，每当 PC 开机时都会立即启动 Linux。


    -   缩小 Windows 分区大小 – 使其不再占据整个硬盘，然后在产生的空闲空间创建 Linux 分区（或多个）。此选项应该并保留 Windows 操作系统、应用程序和数据文件。它将创建一台“双启动”计算机，允许用户在每次
    PC 开机时选择启动 Linux 还是 Windows。


    -   为系统添加第二个硬盘 – 这允许 Linux 分区占据第二块硬盘，并保留第一块硬盘上的 Windows 操作系统、应用程序和数据文件。这同样创建了一个“双启动”计算机，允许用户在每次
    PC 开机时选择启动 Linux 还是 Windows。


    ![](img/0494b98ec9ddc4515587e9808d73902e_15_0.png)


    为 Linux 安装额外硬盘的选项是许多人的流行选择，因为他们经常将原始硬盘升级为更大的硬盘，因此原始硬盘就闲置了。与其他选项相比，它还有几个优点：


    -   Windows 驱动器上的空闲空间没有减少

    -   消除了通过调整分区导致数据丢失的风险

    -   保留了熟悉的 Windows 操作系统

    -   将两个操作系统分离

    -   硬盘故障只会影响一个操作系统


    ## 添加第二个硬盘


    大多数现代 PC 可以容纳多达四个 EIDE（增强型集成设备电子）设备，如硬盘和 CD/DVD 驱动器，但通常出厂时仅配备两个 – 一个硬盘和一个 CD 驱动器。这意味着只需将它们插入现有系统，即可添加一个或两个驱动器。


    系统中的第一个硬盘被称为“主盘”（master）硬盘，第二个硬盘被称为“从盘”（slave）硬盘。


    “跳线帽”（jumper）连接两个微引脚，以确定驱动器应该被视为主盘（MA）还是从盘（SL）。每个硬盘的顶部通常有一个图示，描述了各种情况下需要连接哪些引脚。


    在安装第二个硬盘之前，首先确保原始硬盘上的跳线帽设置为主盘，并且宽数据线通过其末端插头连接到驱动器上 – 不是电缆中间的插头。现在将第二个硬盘上的跳线帽设置为从盘，并使用电缆中间的插头连接数据线。


    > 小贴士 如果您不习惯在 PC 机箱内部进行操作，我们乐意在收取少量费用的情况下为您安装第二个驱动器。


    ![](img/0494b98ec9ddc4515587e9808d73902e_16_0.png)


    连接电源线并启动 PC – 现在两个硬盘都应该被检测到。如果没有检测到第二个驱动器，您应该更改 BIOS 设置，以便在启动时自动查找它。


    ## 准备安装 Linux


    如果您选择在与 Windows 相同的硬盘上安装 Linux，那么在开始安装之前清理磁盘将是一个好主意。


    在 Windows XP 中，点击“我的电脑”图标，然后右键点击硬盘图标并选择“属性”以打开本地磁盘属性。


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_0.png)


    如果 Linux 要在单个硬盘上替换 Windows，或者 Linux 要安装在第二个硬盘上，则不需要此步骤。


    在“选项卡”下点击“立即检查”按钮打开检查磁盘对话框。


    勾选两个复选框，点击“开始”按钮运行检查磁盘。检查磁盘程序检查硬盘状况并需要一些时间。


    检查磁盘完成后，点击本地磁盘属性中的“整理”按钮来整理文件系统。当整理重新排列硬盘上的文件后，就可以准备了。


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_0.png)


    在继续之前对所有内容进行备份。


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_17_2.png)


    ## 安装操作系统


    本章将介绍典型的 Linux 安装步骤，这些步骤可能会以不同的顺序出现。


    - 开始安装 | 18

    - 设置安装参数 | 20

    - 磁盘分区 | 22

    - 安装程序包 | 24

    - 设置 root 密码 | 25

    - 网络配置 | 26

    - 创建用户账户 | 27

    - 完成安装 | 28


    ## 开始安装


    Linux 安装从启动 CD-ROM 开始。如果 CD 驱动器不包含启动指令，它将使用硬盘上的指令。


    确保您发行版的第一个 CD-ROM 在 CD 驱动器中，然后打开电脑从 CD-ROM 启动。在菜单中选择“安装”选项，然后按回车。


    安装程序首先要求您选择语言。请注意，这不是指定安装后使用的语言，而是设置安装过程中使用的语言。


    点击您偏好的语言，然后点击“下一步”按钮继续下一步。


    ## ...待续


    ![](img/0494b98ec9ddc4515587e9808d73902e_20_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_20_1.png)


    ## 设置安装参数


    | 许可协议 |

    | SUSE LINUX 10.0 权利与许可 本 Novell 软件许可协议（“协议”）是您（一个实体或个人）与 Novell, Inc. 之间的法律协议。
    |


    - 是的，我同意许可协议

    - 否，我不同意许可协议


    在同意许可条款后，检查模式选项以进行“新安装” – “更新”选项可以在安装后使用，从安装盘中添加更多软件。


    | 安装模式 |

    - 新安装

    - 更新

    - 其他...


    > 小贴士 记下这一点！如果将来遇到问题，返回安装模式屏幕，然后点击“其他”按钮并选择“修复已安装的系统”选项 – 效果非常。


    Linux 易上手指南


    '
