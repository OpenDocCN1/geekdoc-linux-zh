  - '[PAGE 28]


    # Creating a user account


    The next step of the Linux installation requires at least one user account to
    be created. For the home user this will normally be the account they will use
    to login to Linux for their everyday use.


    Enter your actual name in the first field and a short user name in the second
    field. Now enter a password in both other input fields:


    ![](img/0494b98ec9ddc4515587e9808d73902e_28_0.png)


    # New Local User


    | User''s Full Name |

    | Mike McGrath |

    | Username |

    | mike Suggestion |

    | Password |

    | ******** |

    | Confirm Password |

    | |


    +   - Receive System Mail

    - Automatic Login


    Linux is case-sensitive so take care with uppercase and lowercase characters -
    username “Mike” will be regarded as a different user to the one named “mike” here.


    Optionally, you can check the “Automatic Login” option to allow a particular user
    to be automatically logged in to the system whenever the system starts.


    Create a user account for each person that will use your computer, then click
    on the Next button to proceed.'
