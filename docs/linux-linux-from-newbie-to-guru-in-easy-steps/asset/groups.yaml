  - '[PAGE 112]


    The Intelligent Scissors selection tool in the GIMP is similar to the magnetic
    lasso tool in Photoshop. Click to select anchor points around a clearly defined
    object within the image and it will attempt to automatically seek out the edge
    of that object.


    Some of the anchor points in the illustration could be adjusted to better follow


    Bart''s outline.


    ![](img/0494b98ec9ddc4515587e9808d73902e_112_0.png)


    If the line connecting two anchor points does not accurately follow the edge of
    the object click on the line midway between the points to add an intermediate
    anchor point. This may correct the problem automatically, or the new anchor point
    can be dragged manually – just as with the Path tool. When you have surrounded
    the object click on the starting point then click anywhere inside the shape to
    make it into selection.


    ![](img/0494b98ec9ddc4515587e9808d73902e_112_1.png)


    Complex selections can be stored as a Channel so they can easily be recalled later.
    To store a selection click inside it then choose Choose Select, Save To Channel
    from the right-click context menu – it gets added under the Channels dialog. To
    restore a selection right-click on the Selection Mask Copy on the Channels dialog
    then choose Channel To Selection.


    # 9. Creating and editing graphics'
  - '[PAGE 113]


    # Using filters


    Like Photoshop, the GIMP includes a large number of filters that can be used to
    apply effects to an image. These are accessed by choosing sub-menus of the Filters
    option on the right-click context menu. The GIMP filters are grouped into the
    following categories:


    # Animation


    An Animation Player that displays layers as sequential frames and lets you easily
    create animations in the GIF file format. It also provides optimization to keep
    those animations compact.


    # Artistic


    Filters to create instant artistic effects, such as cubist paintings and mosaic
    patterns. These can be applied to the entire image or just to a selected area
    to add a special effect.


    ![](img/0494b98ec9ddc4515587e9808d73902e_113_0.png)


    Add a number of different colored rectangles to a white background then use the


    Artistic. Cubism filter to create on instant masterpiece.


    # Blur


    Many types of blur filters which are useful to soften part of an image. For instance,
    to soften a shadow''s edge – real shadows seldom have hard sharp edges so it''s
    a good idea to depict them with blurred edges using a suitable blur filter. Additionally,
    blur filters are useful to disguise skin imperfections and wrinkles in portrait
    images.


    # Colors


    A range of filters that let you manipulate the Red, Green, Blue (RGB) and Hue,
    Saturation, Value (HSV) properties of an image or a selected area.


    # Distorts


    Filters that create special surface effects, such as ripples on water, wind effects,
    waves, whirl and pinch. These filters are especially useful to create textures.


    # Edge-Detect


    Filters that allow you to find the edges of an object as defined by its color
    boundary. These can be useful to make the selection of an area easy with the Fuzzy
    Select tool, or to simplify a color fill using the Paint Bucket tool.'
  - '[PAGE 114]


    # Enhance


    Useful filters to clean up an image or selection – these let you despeckle deinterlace
    and destripe. This category also contains a sharpen filter that is especially
    useful to make photo images crisp.


    # Generic


    Includes mathematical filters that use a Convolution Matrix for image manipulation
    – this can perform various manipulations but some math knowledge is required to
    use its possibilities to the full.


    # Glass Effects


    These filters do not create the appearance of various glass surfaces, as you might
    expect, but rather are useful to create different kinds of lens or curved mirror
    shapes.


    # Light Effects


    A range of filters that you can use to add shine, lustre and lighting flare to
    are a wide variety of lighting effects that can be achieved with these filters
    if you are used to Photoshop’s excellent Lighting Effects dialog you may find
    these less intuitive to apply.


    # Map


    Includes a number of filters that create interesting effects by displacement or
    distortion relative to an image map.


    # Noise


    Filters add speckles to an image or selection. These are useful to represent monitor
    noise or film graininess.


    # Render


    Spectacular effects can be added to images or objects with the filters in this
    category. These include natural effects, such as clouds and flames, together with
    pattern effects such as mosaics, grids and jigsaw puzzle.


    ![](img/0494b98ec9ddc4515587e9808d73902e_114_0.png)


    Do the time to read the Tip of the Day each time you launch the GIMP – there are
    handy gems in there.'
  - '[PAGE 115]


    # Running scripts


    The GIMP provides support for scripts that can be used to perform a number of
    set actions on an image. A wide range of custom scripts are included with the
    GIMP installation – these are written by GIMP enthusiasts and offer some great
    effects.


    Ready-made scripts can be found on the Script-Fu menu located under the Xtns menu
    in the GIMP toolbox window. There are further scripts available from the Script-Fu
    option on the right-click context menu in the image window.


    Scripts are useful to perform a series of repetitive actions to create an object
    within an image. For instance, you could create a 3-dimensional sphere object,
    by filling a circle with an appropriate gradient fill, then create a blurred shadow
    on a lower layer to give the impression of a ball sitting on a flat surface. The
    GIMP has a script to execute all the operations needed to create this object easily
    – in the toolbox Xtns menu click on the Script-Fu, Misc, Sphere option.


    ![](img/0494b98ec9ddc4515587e9808d73902e_115_0.png)


    The script items on the context menu are not the same as those under the Xtns
    menu. Generally those on the context menu operate on the current existing image
    window – the others create an object in a new window.


    ![](img/0494b98ec9ddc4515587e9808d73902e_115_1.png)


    Many scripts initially display a dialog box where you can specify parameters for
    text, font, size, background and foreground color, and so on. The Sphere script
    launches a dialog where you can specify the size of the sphere, the direction
    of the light source, whether to include a shadow, and individual colors for the
    sphere and the background area.'
  - '[PAGE 116]


    # ...cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_116_0.png)


    Push the Help button to see a description of the script together with author and
    copyright details.


    When you are happy with your choices click on the OK button to run the script.
    In this case the sphere object is created in a new image window and with the features
    you specified.


    ![](img/0494b98ec9ddc4515587e9808d73902e_116_1.png)


    Further free scripts can be downloaded from the Internet and added to the GIMP
    to provide even more functionality – try searching for “Script-Fu” or visit www.gimp.org.


    Copy additional scripts to the GIMP scripts folder. Typically this is a hidden
    folder located in your home directory named as .gimp-2.2/scripts – the new script
    should now be available from one of the Script-Fu menus in the GIMP.


    9. Creating and editing graphics 115'
  - '[PAGE 117]


    # Storing photos


    The Linux digiKam application is a versatile photo management suite for KDE. To
    enable images to be downloaded into digiKam from your digital camera select the
    Camera, Add Camera menu. Connect your camera to a USB port, and switch it on,
    then click the Auto Detect button to automatically seek your camera. Press the
    OK button when it is found or use the Add button to add your camera manually from
    the list provided. Your camera should then have been added under the Camera menu
    and you can select that menu to browse the photos stored there.


    Before downloading your photos you first need to create an Album where they will
    be kept. Select the Album, New Album menu then give the album meaningful title
    in the dialog. Your new album is added to the left pane of the digiKam window
    under the My Albums groups.


    To download your photos right-click on your new album and select the Import, Add
    Images menu. Now choose some, or all, photos for download and they are imported
    into digiKam:


    ![](img/0494b98ec9ddc4515587e9808d73902e_117_0.png)


    Use Options under the Tools menu to create a photo calendar or to view your photos
    as a slide show.'
- md: '

    # cont''d


    Double click on any photo in the right pane to open image in the digiKam Editor.
    This contains an impressive array of tools to manipulate color saturation, brightness,
    sharpness, rotation, and also includes a handy "red-eye" correction feature.


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_0.png)


    You may cross-reference your photos in your Album to be classified. The default
    tags of Events, People, and Places, provide a good starting point but you can
    add your own custom tags – just right-click on the Tags group and select the New
    Tag option.


    Click on any photo in digiKam then choose Set as Background to use that photo
    as your desktop background.


    To assign a photo to a tag right-click on the photo then hover over the Assign
    Tag menu, now select the appropriate tag from the sub-menu. Alternatively select
    the Edit Comments & Tags option from the right-click context menu to open a dialog
    where you can add comments and select a tag. Clicking any tag in the left pane
    displays those photos which have been assigned to that tag.


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_1.png)


    9. Creating and editing graphics 117


    # Grabbing screen shots


    Unlike Windows, Linux cannot simply grab screen captures with the “Print Screen”
    button on your keyboard. Instead KDE includes the KSnapshot application for this
    purpose. Launch it from the Start, Utilities, Desktop, Screen Capture menu, or
    Start, Run Command “ksnapshot”.


    KSnapshot grabs an image of the entire screen whenever it is started. You can
    see a preview and may elect to Save or Print this image, or you may prefer to
    take a New Snapshot:


    ![](img/0494b98ec9ddc4515587e9808d73902e_119_0.png)


    HOT TIP Give the file name a numeric suffix in the Save dialog and KSnapshot will
    automatically suggest numbers for successive screen captures – grab1, grab2, etc.


    Change the Capture mode to “Window Under Cursor” to grab only the active window,
    including its frame and toolbars. If you do not want to include these uncheck
    the box labeled “Include window decorations”. Setting a delay period useful allows
    you to do something before the image is grabbed – for instance, to launch an application
    in order to grab its splash screen.


    You can even grab a specific rectangular area of the window by setting the Capture
    Mode to “Region” and delay to “No delay”. Now drag the mouse cursor around the
    area you want to grab and it will be captured when you release the mouse button.


    Push the Save As button to store the image and the dialog will help suggest a
    name, location, and file type for that image.


    # Playing sound and video


    This chapter examines some of the applications that are bundled with Linux to
    play music and video files, record and playback sound, play audio disks, and to
    rip and burn music and video to your own disks.


    | Topic | Page |

    | :--- | :--- |

    | Playing music files | 120 |

    | Watching video files | 122 |

    | Playing Real media | 124 |

    | Playing audio CDs | 126 |

    | Burning CDs and DVDs | 128 |

    | Recording a voice message | 130 |


    # Playing music files


    Linux has a variety of players for sound and video but the Caffeine Player that
    ships with SUSE Linux 10 attempts to combine its features into a single application.
    When launched you see a window with 3 tabs – the one marked “Go!” is the place
    to start:


    The Caffeine Player is in fact a front-end interface that relies upon other programs
    and libraries present to support various media formats – for more details see
    the Caffeine Player home page at http://caffeine.sourceforge.net


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_2.png)


    Click on the Open Files icon to launch a dialog to browse for files. When you
    choose a file it gets added to the default playlist, entitled "Playlist 1", and
    the file begins to play. Add further files in the same way to build your playlist.


    Select the Playlist tab to view all selected files and double-click on a file
    in this window to start playing it – the usual controls at the bottom let you
    control playback as you would expect:


    Push the "Undock" button to float the playlist off in its window.


    ![](img/0494b98ec9ddc4515587e9808d73902e_122_0.png)


    | Katie Melua - Nine million bicycles.mp3 |

    | File View Player Settings Help |

    | Playlist1 |

    | Player Playlist Go |

    | Filter: Playlist Playlist1 Undock |

    | Title |

    | Katie Melua - Nine million bicycles.mp3 Katie Melua |

    | Sugarabab - Push the button-mp3 |

    | Don''t Cha (Feat. Bust Rhythms) - Clean The Pussycat Dolls |


    To create another playlist choose the New Playlist option under the Playlist menu
    then add files as before. You can now quickly switch between your playlists using
    the drop-down menu on the Caffeine Player toolbar.


    When a file is being played click on the Player tab to see great visualization
    animations. Right-click on this window to open an extensive context menu where
    you can select alternate visualizations and launch an equalizer to adjust sound
    qualities.


    The default back-end engine preferred by Caffeine Player is the Xine (pronounced
    "ex-ee-n") application that is bundled with most Linux distros. Select the Xine
    Engine Parameters option under Caffeine Player’s Settings menu to view configuration
    details.


    # Watching video files


    The multipurpose Caffeine Player that was used to play music files in the previous
    example can also play a variety of video files. Select a single video, or build
    a video playlist in the same way that would create a musical selection. You can
    even have a playlist containing both music and video – truly multimedia. Double-click
    any video file in the playlist and it will start to play in the Player window:


    ![](img/0494b98ec9ddc4515587e9808d73902e_123_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_123_1.png)


    # cont''d


    The normal screen capture tools, such as KSnapshot, do not capture the screen
    layer that videos play on but Caffeine Player lets you capture screenshots from
    a video file it is playing. Choose the Save Screenshot option from the File menu,
    or click the button on the toolbar, when you want to grab a shot of the action.


    Use your numeric keypad''s + keys to adjust volume — or the U key to mute.


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_0.png)


    In addition to playing a variety of video file formats Caffeine Player can play
    streaming video. It has a useful Save stream option from the File menu that lets
    you save stream locations so that you can easily replay them. Providing you have
    an active connection Caffeine Player will begin the video when that item is selected:


    Choose the Player, Video, Video Settings menu to open the Video dialog then drag
    the sliders to your preferred settings:


    Options to zoom, deinterlace, and adjust the aspect ratio also appear under the
    Player.


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_1.png)


    Video menu.


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_2.png)


    Video


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_3.png)


    10. Playing sound and video 123


    # Playing Real media


    Real media provides popular file formats for both audio (RealAudio) and video
    (RealVideo) and is often a alternative to Windows Media formats. So even if your
    distro did not come bundled with Real Player it is worth obtaining a copy.


    See page 32 for help on installing RPM packages


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_0.png)


    Real Player for Linux is available for free download as an RPM package at www.real.com/linux.
    Installation may not automatically add it to the Start, Multimedia menu but you
    can easily create a shortcut to launch it. Right-click on the desktop then choose
    to Create New, Link to Application. Now select the Application tab and type “realplay”
    in the Command box. Click OK to create the shortcut


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_1.png)


    To make a better desktop shortcut right-click on it and open its Properties dialog


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_2.png)


    Under the General tab enter the application name in the input field then click
    on the icon button and choose an appropriate icon


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_3.png)


    The Real Player interface is simple and straightforward yet the player supports
    an impressive array of file formats in addition to RealAudio and RealVideo. These
    include MP3 and Flash 4 compressed media and WAV, AU, and AIFF uncompressed media.


    You may be surprised to learn that the Help, General menu opens your browser at
    a “Helix Player” help page, until you discover that Real Player for Linux is based
    on the open-source Helix player. Helix player contains no open-source components
    but the Real Player version builds on that to provide wider format support.

    '
  mdcn: '


    # 续


    双击右侧面板中的任何照片即可在 digiKam 编辑器中打开图像。它包含了一系列令人印象的工具，用于调整色彩饱和度、亮度、锐度和旋转，还包含了一个实用的“红眼”修正功能。


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_0.png)


    你可以对相集中的照片进行交叉引用以便分类。活动（Events）、人物（People）和地点（Places）默认标签提供了一个很好的起点，但你可以添加自己的自定义标签——只需右键点击标签（Tags）组并选择“新建标签”（New
    Tag）选项。


    点击 digiKam 中的任意照片，然后选择“设置为背景”（Set as Background）将该照片作为桌面背景。


    要将照片分配给标签，右键点击照片，然后悬停在“分配标签”（Assign Tag）菜单上，现在从子菜单中选择相应的标签。或者从右键上下文菜单中选择“编辑注释与标签”（Edit
    Comments & Tags）选项打开对话框，你可以在其中添加注释并选择标签。点击左侧面板中的任何标签都会显示分配给该标签的照片。


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_1.png)


    9. 创建和编辑图形 117


    # 截屏


    与 Windows 不同，Linux 无法通过键盘上的“Print Screen”键简单的截屏。相反，KDE 包含了此用途的 KSnapshot 应用程序。从开始->工具->桌面->屏幕截图菜单启动它，或者从开始->运行命令输入“ksnapshot”启动。


    KSnapshot 每次启动时都会捕获整个屏幕的图像。你可以查看预览并选择保存或打印此图像，或者你可能喜欢拍摄“新快照”（New Snapshot）：


    ![](img/0494b98ec9ddc4515587e9808d73902e_119_0.png)


    热点：在保存对话框中为文件名添加数字后缀，KSnapshot 将自动为连续的屏幕截图建议数字——grab1、grab2 等。


    将捕捉模式更改为“光下窗口”（Window Under Cursor）以仅捕捉活动窗口，包括其框架和工具栏。如果你不想包含这些内容，请取消勾选标记为“包含窗口装饰”（Include
    window decorations）框。设置延迟时间允许你在捕捉图像之前执行某些操作——例如，启动一个应用程序以捕获其启动界面。


    你甚至可以通过将捕捉模式设置为“区域”（Region）并将延迟设置为“无延迟”来捕获窗口的特定矩形区域。现在拖动鼠标光标经过你想捕获的区域，释放鼠标按钮时将进行捕捉。


    点击“另存为”（Save As）按钮存储图像，对话框将帮助为图像建议名称、位置和文件类型。


    # 播放音频和视频


    本章检查了 Linux 自带的一些应用程序，用于播放音乐和视频文件、录制和播放声音、播放音频磁盘以及将音乐和视频刻录并刻入你自己的磁盘。


    | 主题 | 页码 |

    | :--- | :--- |

    | 播放音乐文件 | 120 |

    | 视频文件 | 122 |

    | 播放 Real 媒体 | 124 |

    | 播放音频 CD | 126 |

    | 刻录 CD 和 DVD | 128 |

    | 录制语音消息 | 130 |


    # 播放音乐文件


    Linux 有多种用于声音和视频的播放器，但随 SUSE Linux 10 附带的 Caffeine Player 尝试将其功能合并到单个应用程序中。启动后，你会看到一个带有
    3 个标签的窗口——标记为“Go!”的标签是开始的地方：


    Caffeine Player 实际上是一个前端界面，它依赖于系统中存在的其他程序和库来支持各种媒体格式——更多详情请参阅 Caffeine Player
    主页：http://caffeine.sourceforge.net


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_121_2.png)


    点击“打开文件”（Open Files）图标启动对话框浏览文件。当你选择一个文件时，它会被添加到名为“Playlist 1”的默认列表中并开始播放。以相同的方式添加更多文件来构建你的列表。选择“列表”（Playlist）标签查看所有已选文件，双击此窗口中的任何文件开始播放——底部的常规控件允许你按预期控制播放：


    点击“取消固定”（Undock）按钮将列表浮出窗口。


    ![](img/0494b98ec9ddc4515587e9808d73902e_122_0.png)


    | 文件 播放器设置 |

    | 列表 |

    | 播放器 播放 |

    | 过滤器: 列表 取消固定 |

    | 标题 |

    | 播放器 | 列表 |


    要创建另一个列表，在“列表”（Playlist）菜单下选择“新建列表”（New Playlist），然后像之前一样添加文件。现在你可以使用 Caffeine
    Player 工具栏上的下拉菜单在你的列表之间快速切换。当文件正在播放时，点击“播放器”（Player）标签查看可视化动画。右键点击此窗口打开扩展菜单，你可以在其中选择其他可视化效果并启动均衡器调整音质。


    Caffeine Player 默认后端引擎是 Xine（读作 "ex-ee-n"），大多数 Linux 发行版都附带该程序。在 Caffeine Player
    的设置（Settings）菜单下选择“Xine 参数”查看配置。


    # 视频文件


    之前用于播放音乐文件的多功能 Caffeine Player 也可以播放各种视频文件。选择单个视频，或以相同的方式构建视频列表来创建选择。你甚至可以拥有包含音乐和视频的列表。双击列表中的任何视频文件，它将在播放器（Player）窗口中播放：


    ![](img/0494b98ec9ddc4515587e9808d73902e_123_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_123_1.png)


    # 续


    普通的截屏工具如 KSnapshot 无法捕捉正在播放视频的屏幕，但 Caffeine Player 允许从正在播放的视频文件中截屏。从“文件”（File）菜单中选择“保存截图”（Save
    Screenshot），或当你想要获取动作画面时点击工具栏上的按钮。使用数字键盘上的 + 键调整音量——或 U 键静音。


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_0.png)


    除了播放各种视频文件格式，Caffeine Player 还可以播放流视频。它“文件”菜单中有一个实用的“保存流”（Save stream）选项，让你保存流位置以便轻松重放。只要你有活动连接，选择该项后
    Caffeine Player 将开始播放视频：选择播放器（Player）、视频（Video）、视频设置（Video Settings）菜单打开视频对话框，然后拖动滑块到你的喜好设置：缩放、去隔织和调整宽高比的选项也出现在播放器（Player）下。


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_1.png)


    视频菜单。


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_2.png)


    视频


    ![](img/0494b98ec9ddc4515587e9808d73902e_124_3.png)


    10. 播放音频和视频 123


    # 播放 Real 媒体


    Real 媒体提供了音频（RealAudio）和视频（RealVideo）流行的格式，通常是 Windows Media 格式的替代方案。因此，即使你的发行版没有附带
    Real Player，也值得获取一个。安装 RPM 包的帮助请参见第 32 页。


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_0.png)


    Real Player for Linux 可以在 www.real.com/linux 以 RPM 包形式免费下载。安装可能不会自动将其添加到开始->多媒体菜单，但你可以轻松创建一个快捷方式来启动它。右键点击桌面，选择“新建”（Create
    New）->“链接应用程序”（Link to Application）。现在选择“应用程序”（Application）标签页，并在命令框中输入“realplay”。点击确定创建快捷方式。


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_1.png)


    为了制作更好的桌面快捷方式，右键点击它并打开属性（Properties）对话框。


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_2.png)


    在“通用”（General）标签下在输入字段中输入应用程序名称，然后点击图标按钮并选择合适的图标。


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_3.png)


    Real Player 界面简单直观，但播放器除了 RealAudio 和 RealVideo 外还支持令人印象深刻的文件格式。这些包括 MP3 和 Flash
    4 压缩媒体，以及 WAV、AU 和 AIFF 未压缩媒体。


    你可能会惊讶地发现，“帮助”（Help）->通用（General）菜单会在浏览器中打开“Helix Player”帮助页面，直到你发现 Real Player
    for Linux 是基于开源 Helix player。Helix player 不包含任何开源组件，但 Real Player 版本在此基础上构建，提供了更广泛的格式支持。


    '
