    ## Introducing Linux

    Welcome to the exciting world of Linux – a free open-source operating system that
    includes numerous free applications. This chapter describes the evolution of Linux
    and explains how you can obtain your own copy. It also illustrates how to prepare
    a computer so that Linux can be installed.


    # Covers

    - What is Linux? | 8

    - Choosing a Linux distro | 10

    - Evaluating hardware suitability | 12

    - Making space for Linux | 14

    - Preparing to install Linux | 16


    ## What is Linux?

    Linux is a computer operating system that can run on a variety of hardware including
    the popular Intel system found on desktop computers. It is a modern derivation
    of the powerful Unix operating system that was introduced back in 1969. In recent
    years the popularity of Linux has increased dramatically as its many benefits:


    ![](img/0494b98ec9ddc4515587e9808d73902e_9_0.png)


    Pronounce the name with a short "i" - so''s "li-nucks" not "lie-nucks".


    - Linux is released under the GNU General Public License that ensures it remains
    free to all users – no one can charge for this operating system so you will never
    have to pay for it. It is available for free download on the Internet but you
    may have to pay a distribution charge if you prefer to order a copy on CD-ROM.


    - Access to the source code of Linux is unrestricted and it may be changed. This
    has allowed thousands of programmers around the world to refine the code in order
    to improve performance.


    - Linux is truly a multi-user, multi-tasking operating system that allows multiple
    users to simultaneously work with multiple applications without experiencing any
    traffic problems. Many of the world''s web servers run on Linux for this very
    reason.


    ![](img/0494b98ec9ddc4515587e9808d73902e_9_1.png)


    Many web servers are said to have a "LAMP" configuration – an acronym for Linux,
    Apache, MySQL PHP.


    - Linux is an extremely stable operating system – continuous uptime of more than
    a year are not uncommon. It can be upgraded "on the fly" so it only needs a reboot
    to add hardware.


    - There are a large number of quality applications available to run on the Linux
    platform. These are comparable to commercial applications that run on other operating
    systems, but like Linux, these too are free of charge. For instance, the free
    OpenOffice suite offers similar functionality to the Microsoft Office suite.


    - With open-source software an administrator can know exactly what a program can
    do and the security it presents. An open-source application cannot secretly gather
    information about the user or send confidential information to third parties.

