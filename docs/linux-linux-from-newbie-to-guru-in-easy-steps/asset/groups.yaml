  - '[PAGE 166]


    “diff” command offers an alternative to the comm command for comparison of text
    files. It too compares line by line and it produces a detailed report showing
    any unique lines. It can also be used to compare two directories to reveal unique
    files.


    Files may also be compared using checksum numbers to verify their integrity. Checksum
    numbers are often found on internet download pages so the user can ensure that
    a downloaded file is intact – typically the checksum is made using the md5 algorithm.


    The “md5sum” command produces a 32-byte checksum for the file specified as its
    argument and should exactly match that stated by the originator if the file is
    indeed intact.


    An alternative checksum can be created in the same way by the “cksum” command:
    this generates a CRC (Cyclic Redundancy Check) value and includes the file''s
    byte size in the output.


    ![](img/0494b98ec9ddc4515587e9808d73902e_166_0.png)


    Type “man diff” to view the man page describing the output from the diff command.'
