    \ environment variable is $PATH stores a list of system directories in which to\
    \ seek programs when they are requested. For instance, when you issue the clear\
    \ command the shell consults the value of $PATH and looks in each listed directory\
    \ until it finds the clear program – located in /usr/bin.\n\nTo temporarily add\
    \ another directory to the $PATH variable append it with a colon character. For\
    \ example, add the /usr/sbin directory with the command \"PATH=$PATH:/usr/sbin\"\
    .\n\nEach user-defined variable remains available for recall in the current shell\
    \ session but can be removed with the unset command. So the command \"unset NYC\"\
    \ would remove that variable.\n\nShell variables can even be made available to\
    \ other programs launched from the current shell using the export command. This\
    \ effectively makes the shell variable into an environment variable until you\
    \ logout of the shell. For instance, use the command \"export NYC\" to create\
    \ a temporary environment variable that can be used by any program within the\
    \ current shell environment.\n\nTo append a directory to the PATH each time the\
    \ shell is launched add the .bashrc file used on page 148 to customize the shell\
    \ prompt.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_154_0.png)"
- md: "\n## Launching applications from the shell\n\nIn the same way that KWrite text\
    \ editor was launched from the shell, in the example on page 149, any application\
    \ can be launched from a shell window – providing you know its correct name. This\
    \ is not always obvious but can be discovered by examining that program's properties\
    \ dialog.\n\nOpen the main Start menu then drag a menu onto the desktop and choose\
    \ the Link Here option from the context menu – creating a desktop shortcut to\
    \ the program. Now right-click on the shortcut and select the Properties dialog.\
    \ Under the Application tab in the Properties dialog is a box labelled Command\
    \ that states the command to launch that program. For example, the command used\
    \ to launch the Real Player multimedia application is revealed in the Properties\
    \ dialog to be “replay”.\n\nApplications which have been launched from a shell\
    \ window will also close when the shell window gets closed.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_155_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> Real\
    \ Player\nbash: Real: command not found\nuser> replay\n\nRealPlayer\nFile Play\
    \ View Tools Favorites Help\nreal\n0:00 / 0:00\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_155_1.png)\n\
    \n## Employing the shell more\n\nThis chapter demonstrates how to navigate around\
    \ Linux from the shell prompt and how to perform several basic file operations.\
    \ It also illustrates how to compare and locate files anywhere on the file system.\n\
    \n- Navigating at the command line | 156\n- Operating with directories | 158\n\
    - Performing basic file operations | 160\n- Examining file properties | 162\n\
    - Comparing files | 164\n- Locating files | 166\n\n## Navigating at the command\
    \ line\n\nWhen a user logs into the shell they are, by default, located in their\
    \ home directory on the Linux system but they can move to other directories using\
    \ the `cd` command.\n\n| cd dir | change directory to dir |\n| :--- | :--- |\n\
    | ~ | an alias for the user's home directory |\n| ls | an alias for the next higher\
    \ directory level / list the contents of the current directory |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_157_0.png)\n\
    \nRemember that absolute directory addresses begin with a forward slash / descending\
    \ from the / root location.\nThe user can move to any directory to which they\
    \ have permission by stating its absolute address as an argument to the cd command.\
    \ For instance, type the command `cd /etc` then hit Return to move into the /etc\
    \ directory – use the pwd command to confirm your current location.\n\nSimilarly,\
    \ the user could return to their home directory by the same method, or using the\
    \ tilde alias with the command `cd ~`.\nFor shorter hierarchical moves, use the\
    \ `cd ..` command to move up to the next higher directory, or state just the name\
    \ of any immediate sub-directory as the argument to the cd command to move down\
    \ one level into that directory.\n\n```\nShell - Konsole\nSession Edit View Bookmarks\
    \ Settings Help\nuser> pwd\n/home/mike\nuser> cd /etc ; pwd\n/etc\nuser> cd ~\
    \ ; pwd\n/home/mike\nuser> cd .. ; pwd\n/home\nuser> cd mike ; pwd\n/home/mike\n\
    user> \n```\n\nThe contents of the current directory can be revealed using the\
    \ \"ls\" command to display a list of its files and immediate sub-directories.\
    \ This is a comprehensive command that has many useful options:\n\n- use the -a\
    \ option to see all directory contents – including hidden files and hidden immediate\
    \ sub-directories\n- use the -l option to see the long format listing for each\
    \ item – including user and group ownership names\n- use the -t option to sort\
    \ the contents by the time they were created or last modified\n- use the -o option\
    \ to suppress group ownership details\n- use the -g option to suppress user ownership\
    \ details\n\nOptions can be combined to produce a complex option where each parameter\
    \ is applied. This can be seen in the screenshot below where all the options above\
    \ are combined to list all contents, including hidden files, in long format listed\
    \ by modification time – but with user and group details suppressed.\n\nNotice\
    \ that directory names that have spaces must be enclosed in quotes to avoid truncation\
    \ at the first space – without the quotes in this case the shell would try to\
    \ change to a directory simply \"My\".\n\n![](img/0494b98ec9ddc4515587e9808d73902e_158_0.png)\n\
    \n## Operating with directories\n\nIt's sometimes useful to be able to extract\
    \ the name of a file, program, or directory, from the end of a path address. The\
    \ basename command was used for this purpose in the script on page 148 to extract\
    \ the name of the shell program from the full path address stored in the $SHELL\
    \ environment variable.\n\n| basename | show only the final part of a directory\
    \ path |\n| dirname | show the path with the final part removed |\n| mkdir | make\
    \ a new directory if not already existing |\n| rmdir | remove an empty directory\
    \ |\n| rm -ri | remove a non-empty directory and its contents |\n\nBoth basename\
    \ and dirname commands simply manipulate the path string - they do not execute\
    \ any action.\n\nConversely, you can use the dirname command to remove the final\
    \ part of a path, leaving just the parent directory. To create a new directory\
    \ use the mkdir command stating the path to the directory there.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_159_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> $SHELL\n\
    /bin/bash\nuser> dirname $SHELL\n/bin\nuser> basename $SHELL\nbash\n```\n\n##\
    \ Performing file operations\n\nThe “rm” command can be used to delete one or\
    \ more files named as its arguments – use the * wildcard to delete all files in\
    \ a directory.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_160_0.png)\n\nIn effort\
    \ to prevent accidental deletion of files the “rm” command will only delete a\
    \ directory if it is empty: use the rmdir command. The shell “mv” command lets\
    \ you easily move files around. This command requires two arguments stating the\
    \ name of the file to be moved and the destination to which it should be moved.\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_160_1.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_160_2.png)\n\
    \n## ... file operations\n\nThe “mv” command lets you easily move files around.\
    \ This command requires two arguments stating the name of the file to be moved\
    \ and the destination to which it should be moved.\n\n| mv | move or rename a\
    \ file |\n| cp | copy a file |\n| rm | delete a file |\n| ln | create a link to\
    \ a file |\n| readlink | show the target of a symbolic link |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_161_0.png)\n\
    \nInterestingly, the mv command can also be used to rename a file by stating its\
    \ current name and a new name as its arguments. If you wish to copy, rather than\
    \ move, a file to a new location the “cp” command can be used. This command can\
    \ accept one or more names of files to be copied as its arguments, stating the\
    \ destination as the final argument.\n\n```\nShell - Konsole\nSession Edit View\
    \ Bookmarks Settings Help\nuser> ls\nAlpha ls Zebra\nuser> ls Alpha\npic-1 renamed\
    \ text-1\nuser> ls Zebra\ndoc-1 doc-2\nuser> mv Alpha/doc-1 Zebra\nuser> mv Alpha/doc-2\
    \ Alpha/renamed\nuser> cp Zebra/pic-1 text-1 Alpha\nuser> ls Alpha\npic-1 renamed\
    \ text-1\nuser> ls Zebra\n```\n```\n\nThe “rm” command can be used to delete one\
    \ or more files named as its arguments – use the * wildcard to delete all files\
    \ in a directory.\n\nYou can create hard links, pointing to the system address\
    \ of a file, and soft (symbolic) links, storing the path to a file, with the “ln”\
    \ command. By default this will create a hard link to the file named as its argument\
    \ – use the -s option to create a symbolic link.\n\nThe readlink command can be\
    \ used to discover the target to which a symbolic link is pointing:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_162_0.png)\n\
    \nSee page 71 for more details on hard and soft links.\n\n```\nSession Edit View\
    \ Bookmarks Settings Help\nuser> ls\nAlpha ls Zebra\nuser> ls Alpha\npic-1 renamed\
    \ text-1\nuser> ls Zebra\ndoc-1 pic-1 text-1 text-2\nuser> rm Zebra/*\nuser> ln\
    \ Alpha/pic-1 Zebra/pic\nuser> ln -s Alpha/text-1 Zebra/txt\nuser> ls Alpha\n\
    pic-1 renamed text-1\nuser> ls Zebra\npic\nuser> readlink Zebra/txt\nAlpha/text-1\n\
    user>\n```\n\nThis example begins by listing the contents of two directories then\
    \ deletes all contents of the second directory. Then it creates a hard link and\
    \ a soft link there – pointing to files in the first directory.\n"
  mdcn: "\n\n## 从 shell 启动应用程序\n\n正如 KWrite 编辑器是从 shell 启动的那样，在第 149 页的示例中，任何应用程序都可以从\
    \ shell 窗口启动——只要你知道它的正确名称。这并不总是显而易见的，但可以通过查看该程序的属性对话框来发现。\n\n打开主开始菜单，然后将菜单拖到桌面，并在右键菜单中选择“在此处链接”选项\
    \ – 为该程序创建一个桌面快捷方式。现在，右键点击该快捷方式并选择“属性”对话框。在属性对话框的“应用程序”选项卡下有一个标记为“命令”的框，其中列出了启动该程序的命令。例如，启动\
    \ Real Player 多媒体应用程序时使用的命令在属性对话框中显示为“replay”。\n\n从 shell 窗口启动的应用程序会在 shell 窗口关闭时之关闭。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_155_0.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> Real Player\nbash: Real: command\
    \ not found\nuser> replay\n\nRealPlayer\nFile Play View Tools Favorites Help\n\
    real\n0:00 / 0:00\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_155_1.png)\n\
    \n## 更多地使用 shell\n\n本章演示了如何从 shell 提示符在 Linux 中导航，以及如何执行若干基本文件操作。它还说明了如何在文件系统的任何地方比较和定位文件。\n\
    \n- 在命令行中导航 | 156\n- 操作目录 | 158\n- 执行基本文件操作 | 160\n- 检查文件属性 | 162\n- 比较文件 | 164\n\
    - 定位文件 | 166\n\n## 在命令行中导航\n\n当用户登录 shell 时，默认他们位于 Linux 系统上的家目录，但他们可以使用 `cd`\
    \ 命令移动到其他目录。\n\n| cd dir | 切换目录到 dir |\n| :--- | :--- |\n| ~ | 用户家目录的别名 |\n| ls\
    \ | 上级目录的别名 / 列出当前目录的内容 |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_157_0.png)\n\
    \n记住，绝对目录地址以斜杠 / 开头，从 / 根位置向下延伸。\n用户可以通过指定其绝对地址作为 `cd` 命令的参数，移动到任何他们有权限的目录。例如，输入命令\
    \ `cd /etc` 然后按回车键进入 /etc 目录 – 使用 `pwd` 命令确认您当前的位置。\n\n同样地，用户可以使用相同的方法返回家目录，或者使用命令\
    \ `cd ~` 使用波浪号 `~` 别名。\n对于更短的层级移动，使用 `cd ..` 命令移动到上一级目录，或者直接将任何直接子目录的名称作为 `cd`\
    \ 命令的参数，向下移动进入该目录。\n\n```\nShell - Konsole\nSession Edit View Bookmarks Settings\
    \ Help\nuser> pwd\n/home/mike\nuser> cd /etc ; pwd\n/etc\nuser> cd ~ ; pwd\n/home/mike\n\
    user> cd .. ; pwd\n/home\nuser> cd mike ; pwd\n/home/mike\nuser> \n```\n\n可以使用“ls”命令显示当前目录的内容，显示其文件和直接子目录的列表。这是一个功能强大的命令，许多许多用的选项：\n\
    \n- 使用 -a 选项查看所有目录内容 – 包括隐藏文件和隐藏的直接子目录\n- 使用 -l 选项查看每个项目的详细格式列表 – 包括用户和组所有权名称\n\
    - 使用 -t 选项按创建或最后修改时间对内容排序\n- 使用 -o 选项隐藏组所有权详细信息\n- 使用 -g 选项隐藏用户所有权详细信息\n\n可以组合选项以产生复杂的选项，每个参数都会被应用。这可以在下方的截图中看到，其中所有上述选项组合在一起，以详细格式列出所有内容（包括隐藏文件），并按修改时间排序\
    \ – 但隐藏了用户和组的详细信息。\n\n注意，带有空格的目录名称必须包含在引号中以防在第一个空格处截断 – 在这种情况下，如果没有引号，shell 将尝试切换到一个名为“My”的目录。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_158_0.png)\n\n## 操作目录\n\n有时，从路径地址的末尾提取文件、程序或目录的名称是有用的。在第\
    \ 148 页的脚本中，使用 `basename` 命令从存储的完整路径地址中提取 shell 程序的名称。\n\n| basename | 显示目录的最后部分\
    \ |\n| :--- | :--- |\n| dirname | 显示移除最后部分的路径 |\n| mkdir | 如果不存在则创建一个新目录 |\n|\
    \ rmdir | 删除空目录 |\n| rm -ri | 删除非空目录及其内容 |\n\n`basename` 和 `dirname` 命令只是处理路径字符串。\n\
    \n相反，用户可以使用 `dirname` 命令移除路径的最后部分，仅保留父目录。要在该处创建一个新目录，请使用 `mkdir` 命令并指定目录路径。\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_159_0.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> $SHELL\n/bin\nuser> dirname $SHELL\n\
    /bin\nuser> basename $SHELL\nbash\n```\n\n## 执行文件操作\n\n“rm”命令可以用于删除作为参数的一个或多个文件\
    \ – 使用通配符 * 可以删除目录中的所有文件。\n\n![](img/0494b98ec9ddc4515587e9808d73902e_160_0.png)\n\
    \n为了防止意外删除文件，“rm”命令只在目录为空时删除目录：使用 `rmdir` 命令。“mv”命令可以让你轻松地移动文件。该命令需要两个参数：要移动的文件名和目标。\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_160_1.png)\n\n![](img/0494b98ec9ddc4515587e9808d73902e_160_2.png)\n\
    \n## ... 文件操作\n\n“mv”命令可以让你轻松地移动文件。该命令需要两个参数：要移动的文件名和目标。\n\n| mv | 移动或重命名文件 |\n\
    | cp | 复制文件 |\n| rm | 删除文件 |\n| ln | 为文件创建链接 |\n| readlink | 显示符号链接的目标 |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_161_0.png)\n\
    \n有趣的是，“mv”命令也可以用于重命名文件，只需指定当前名称和新名称作为参数。如果你希望将文件复制到新位置，可以使用“cp”命令。该命令可以接受一个或多个文件名作为参数，并将目标作为最后一个参数。\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> ls\n\
    Alpha ls Zebra\nuser> ls Alpha\npic-1 renamed text-1\nuser> ls Zebra\ndoc-1 doc-2\n\
    user> mv Alpha/doc-1 Zebra\nuser> mv Alpha/doc-2 Alpha/renamed\nuser> cp Zebra/pic-1\
    \ text-1 Alpha\nuser> ls Alpha\npic-1 renamed text-1\nuser> ls Zebra\n```\n\n\
    “rm”命令可以用于删除作为参数的一个或多个文件 – 使用通配符 * 可以删除目录中的所有文件。\n\n你可以使用 `ln` 命令创建指向文件系统地址的硬链接，以及存储文件路径的软链接（符号链接）。默认情况下，该命令会为作为参数的文件创建硬链接\
    \ – 使用 -s 选项创建符号链接。\n\n`readlink` 命令可以用于发现符号链接指向的目标：\n\n![](img/0494b98ec9ddc4515587e9808d73902e_162_0.png)\n\
    \n关于硬链接和软链接的更多细节请参见第 71 页。\n\n```\nSession Edit View Bookmarks Settings Help\n\
    user> ls\nAlpha ls Zebra\nuser> ls Alpha\npic-1 renamed text-1\nuser> ls Zebra\n\
    doc-1 pic-1 text-1 text-2\nuser> rm Zebra/*\nuser> ln Alpha/pic-1 Zebra/pic\n\
    user> ln -s Alpha/text-1 Zebra/txt\nuser> ls Alpha\npic-1 renamed text-1\nuser>\
    \ ls Zebra\npic\nuser> readlink Zebra/txt\nAlpha/text-1\nuser>\n```\n\n此示例首先列出两个目录的内容，然后删除第二个目录的所有内容。然后，在那个处创建一个硬链接和一个软链接\
    \ – 指第一个目录中的文件。\n\n"
