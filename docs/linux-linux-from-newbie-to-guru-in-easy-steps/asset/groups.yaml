    As an alternative to assigning a value to a variable with the "=" operator the
    "read" command can assign one line of input to a variable – without requiring
    a string to be enclosed within quotes:


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> read INT

    5

    user> read PI

    3.142

    user> read CHAR

    M

    user> read STR

    Linux in easy steps

