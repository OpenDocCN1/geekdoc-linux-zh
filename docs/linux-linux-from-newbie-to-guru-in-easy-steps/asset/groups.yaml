    \n`find . -mtime -7`查找过去 7 天内修改的文件）\n\nfind 命令非常灵活，可以用于 Linux 管理中的许多复杂任务。\n\n\
    ## 在 shell 中操作文本\n\n本章介绍了如何在 shell 中读取、写入和编辑文档。它展示了如何操作内容、检查拼写并匹配模式。它还说明了如何在虚拟控制台之间切换。\n\
    \n- 查看文件 | 168\n- 创建和编辑文件 | 170\n- 在虚拟控制台之间切换 | 172\n- 操作文本内容 | 174\n- 匹配模式 |\
