    # Touring the file structure


    This chapter begins by highlighting some of the fundamental differences between
    the Linux and Windows file structures then goes on to describe the hierarchical
    layout of Linux directories.The purpose of each standard Linux sub-directory is
    explained, to illustrate how they are used, and demonstrations show how to effectively
    navigate through the Linux directory structure.


    +   - The Linux directory tree | 54

    - Standard sub-directories | 56

