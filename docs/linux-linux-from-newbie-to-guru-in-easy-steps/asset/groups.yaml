    [content]

    # 备份


    Linux 提供了许多工具可以将您的数据归档并将系统备份到磁带驱动器、CD、远程机器或其他位置。


    | cpio | 将输出写入归档文件或从归档文件输入 |

    | tar | 创建、查看或提取磁带归档文件 |


    "cpio" 命令可用于将输出拷贝到归档，或从归档拷贝输入。它必须始终使用 "i" 输入选项或 "o" 输出选项来指定数据流的方向。来自 cpio 的输出数据流可以使用
    ">" 重定向操作发送到归档文件。同样，可以使用 "<" 运算符从归档中检索输入流。


    下面的示例将当前目录的内容通过管道交给 `cpio`，由 `cpio` 将数据输出到一个新的归档文件 - 将目录列表和所有文件内容存储在不同的分区上。接着，删除当前目录的所有内容。通过添加
    "-d" 选项，将归档的内容作为输入传给 `cpio`，以从备份中恢复目录。


    ![](img/0494b98ec9ddc4515587e9808d73902e_183_0.png)


    添加 "d" 选项让 `cpio` 从归档中检索目录列表。


    ```

    Session Edit View Bookmarks Settings Help

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> ls | cpio -o > /dev/hda5

    2059 blocks

    user> rm *

    user> ls

    user> cpio -i < /dev/hda5

    2059 blocks

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> _|

    ```


    “tar” 磁带归档命令是一种流行的备份工具，具有 "-cf" 创建文件和 "-xf” 提取文件的选项。这些在下方被用于重建之前的归档示例：


    使用一个 "-tf” 选项让 `tar` 从归档中检索目录列表。


    ![](img/0494b98ec9ddc4515587e9808d73902e_184_0.png)


    ```

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user> tar -cf /dev/hda5 *

    user> rm *

    user> ls

    user> tar -xf /dev/hda5

    user> ls

    document.doc picture.png spreadsheet.xls

    photo.jpg plain.txt video.mpg

    user>

    ```


    `tar` 命令还可以包含一个 "-z" 选项，用于调用 `gunzip` 来处理压缩归档。这通常用于创建名称以 “.tar.gz” 结尾的源码“tarball”归档，您在安装之前必须对其进行编译（构建），如下：


    - tar -xzf package.tar.gz – 从 tarball 中提取文件

    - less README – 读取此文件以发现配置选项

    - ./configure options – 设置您想要的配置选项

    - make – 创建软件安装程序

    - make install – 安装应用程序


    # 检查磁盘和文件系统


    Linux 系统可能跨越多个硬盘，并扩展到许多磁盘分区。每个分区由 /dev 目录下的一个特殊文件表示 - 通常 /dev/hda1 代表您主硬盘驱动上的第一个分区。


    | | |

    |---|---|

    | df | 显示文件系统的磁盘使用情况 |

    | mount | 使设备对文件系统可用 |

    | umount | 使设备对文件系统失效 |

    | fsck | 检查并修复文件系统 |


    在安装过程中，操作系统会通过在分区上写入“文件系统”来对其进行“格式化”，从而可以在其中存储和召回文件。然后，这些分区必须被“挂载”到一个空目录上，以便操作系统可以使用。硬盘通常在启动过程中自动挂载以备随时使用，但也可以从
    shell 中卸载它们使其无法访问。


    "df" 磁盘空空间命令显示文件系统的使用情况。添加其 "-h" 选项使输出更易读，并添加 "-T" 显示文件类型。示例使用了 "umount" 使 Windows
    分区变为不可用：


    ![](img/0494b98ec9ddc4515587e9808d73902e_185_0.png)


    某些发行版可能需要您假设超级权限来运行这些命令。


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> df -hT

    Filesystem Type Size Used Avail%

    /dev/hdb2 reiserfs 9.1G 2.5G 6.7G 27%

    tmpfs tmpfs 125M 12K 125M 1%

    /dev/hda1 ntfs 9.6G 2.9G 6.7G 31%

    user> umount /dev/hda1

    user> df -hT

    Filesystem Type Size Used Avail%

    /dev/hdb2 reiserfs 9.1G 2.5G 6.7G 27%

    tmpfs tmpfs 125M 12K 125M 1%

    user>

    ```


    # 续


    使用 “mount” 命令让 Windows 分区在 Linux 中变得可访问。添加其 "-l” 选项以查看所有挂载的文件系统的列表。插入便携式磁盘（如 CD-ROM）会自动挂载该磁盘![](img/0494b98ec9ddc4515587e9808d73902e_186_0.png)
    某些发行版可能需要您假设超级权限来运行这些命令。


