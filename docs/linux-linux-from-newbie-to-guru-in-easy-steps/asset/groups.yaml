    ## 介绍 OpenOffice 办公件


    OpenOffice 办公件是一个包含一组与 Microsoft Office 工具的应用程序。它基于 Sun MicroSystems 的 StarOffice
    程序的原始代码。Sun 将这些代码免费提供给开源社区进行开发，因此 OpenOffice 没有所有权限制。然而，“关于”屏幕显示了它的历史渊源。


    OpenOffice 包含在许多 Linux 发行版中。你也可以从 www.openoffice.org 免费下载——该网站也提供了的安装说明。


    ![](img/0494b98ec9ddc4515587e9808d73902e_79_0.png)


    OpenOffice.org 2.0-free 版权所有 2000-2005 Sun MicroSystems Inc. 本产品由 Novell, Inc.
    基于 LGPL 使用 OpenOffice 创建。OpenOffice.org 感谢社区成员，特别是在此处提到的成员：http://www.openoffice.org/welcome/credits.html。版本
    1.9.124


    OpenOffice 提供了适用于 Linux、Mac OS 和 Windows 在内的许多平台版本。


    OpenOffice 文字处理器（“Writer”）、电子表格（“Calc”）和演示文稿（“Impress”）程序，它们与 Word 类似。MS Office
    中的 Excel 和 PowerPoint 程序也有一个用于创建图表、图形和图表的程序（“Draw”），以及一个格式化数学公式的专用工具（“Math”）。如果你熟悉
    MS Office，你会立即觉得 OpenOffice 的对应程序非常亲切。


    最重要的是，OpenOffice 包含了文件过滤器，允许它处理来自 Word,Excel 和 PowerPoint 的标准 MS Office 文档。文件可以保存为
    MS Office 文件格式，也可以为 OpenOffice 的原生格式。


    它可以在文档中嵌入对象（OLE 对象、插件、视频、小程序、图表）——但在使用这些高级功能尝试与其他办公软件共享文档时可能会出现问题。例如，包含嵌入电子表格的
    OpenOffice 文档在 OpenOffice 中运行正常，但在 MS Word 中查看该文档时，电子表格可能无法显示。


