    许多 Linux 发行版包含一种名为 Bzip2 的 GZip 压缩工具替代品。由于使用了更好的压缩技术，它通常可以产生更小的 tar 包文件。


    右键点击要归档并压缩的目录，然后从右菜单中选择 Bzip2 选项：


    ![](img/0494b98ec9ddc4515587e9808d73902e_76_0.png)


    尽管 gzip 广泛支持，但它不像普通的 ZIP 压缩格式那样无处不在——大多数下载的 tar 包仍然是 GZip 压缩的。


    tar 包将在当前目录下创建，保留原始文件名，并添加文件扩展名“.tar.bz2”。


    在下方的截图中，分别使用 GZip 和 Bzip2 创建了一个大位图文件的 tar 包。1.5Mb 的原始文件大小被 GZip 压缩到 41.7Kb，而被
    Bzip2 压缩到 24.6Kb：


    ![](img/0494b98ec9ddc4515587e9808d73902e_76_1.png)


    ## 6. 处理文件


    ## 访问 Windows 分区的文件


    在双启动系统中，Windows 分区可以在 Linux 中进行挂载，以便对其中存储的文件进行一定程度的访问。此过程类似于外接驱动器的挂载方式——允许访问 CD-ROM
    等便介质上的文件。


    文件系统的差异阻止了从 Linux 修改 Windows 分区上的文件——但可以将它们复制到 Linux 并在那里修改。


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_0.png)


    用户友好的 Linux 发行版（如 SUSE Linux）会自动为你挂载 Windows 分区。这意味着你可以轻松地从 Linux 中的 /windows
    目录访问 Windows 中的文件。在下方的示例中，Konqueror 能够查看位于 Windows 分区上的 Photoshop 示例图像。


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_1.png)

    ![](img/0494b98ec9ddc4515587e9808d73902e_77_2.png)

