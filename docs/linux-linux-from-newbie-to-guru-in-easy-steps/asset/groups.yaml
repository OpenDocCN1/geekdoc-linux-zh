    power – in KDE you can select System, File Manager to make changes in the Permissions
    dialog.


    The Advanced tab lets you see the full range of permissions that can be set by
    checking:


    ![](img/0494b98ec9ddc4515587e9808d73902e_74_0.png)


    These allow Read, Write, and Execute to be set by:


    - When a file set with UID is executed the resulting process assumes the user.

    - When a file set with GID is executed the directory all files created within
    that inherit the group ID.

    - When a file set with Sticky is executed the resulting process assumes the group
    ID.


    The symlink is a binary file. The soft link is set for a directory all files created
    within that inherit the group ID. The executable is a binary.


    ## Compressing and extracting files


    Files in Linux, and other Unix-based operating systems, are typically archived
    into a “tarball” for compact transfer. This first creates a Tape Archive (TAR)
    copy of the files then compresses that copy using a familiar compression format.


    TAR was originally used for backing up files on tape in a manner that preserves
    the file permissions. The symlink is a binary file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_75_0.png)


    In KDE right-click on a file (or directory) to be archived then select the “Compress”
    option on the context menu. In the current location – a tarball is created in
    the location – this has the same name, but adds a “.tar.gz” extension.


    ![](img/0494b98ec9ddc4515587e9808d73902e_75_1.png)


    To extract the contents of a tarball in KDE right-click on the file then select
    the Extract, “Extract Here” option from the context menu. The application associated
    with archives will then deposit all the expanded file contents in the current
    location.


    Alternatively, choose the “Open With” context menu option and select the Archive
    tool to preview the contents. This allows specific files to be selected for extraction
    from within the tarball and lets you choose a destination other than the current
    location.

