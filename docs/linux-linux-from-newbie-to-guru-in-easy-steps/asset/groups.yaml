- md: '

    ## Moving and deleting files


    Use Konqueror to graphically cut, or copy, files to the Linux clipboard then paste
    them into another directory. Right-click on the file to move, then choose the
    Cut or Copy option from the context menu that appears.


    Notice the option in the context menu to "Open in New Tab" — Konqueror can simultaneously
    work with several text documents, each in its own tabbed window.


    ![](img/0494b98ec9ddc4515587e9808d73902e_69_0.png)


    In the navigation panel, right-click on the target directory then choose Paste
    from the context menu to move the file, or to create a duplicate when copying.


    Konqueror also lets you drag-and-drop files from one directory to another. Open
    the source directory so its files appear in the right-hand pane. Left-click on
    the file you want to move and hold down the left mouse button. Drag the pointer
    across the target directory in the left-hand navigation panel then release the
    mouse button. A context menu will appear — choose the Move Here option to cut-and-paste
    the file, or choose the Copy Here option to copy-and-paste the file.


    ## ...continued


    Launch Konqueror and navigate to a location in your home directory. Right-click
    in the window to open the context menu and select the Create New, Folder option.
    Enter a name, such as ''temp'', then click the OK button to create a new directory.


    Place a text file in the new directory – write a new file or copy/paste an existing
    one. Now right-click on the new directory to open a context menu and select the
    option to ''Move To Trash'' – this will move the directory folder, and any files
    it contains, to the Trash Bin. This is a holding area from which directories and
    files can be recovered if needed.


    ![](img/0494b98ec9ddc4515587e9808d73902e_70_0.png)


    > The context menu lets you delete directories which are not empty without question;
    be sure they do not contain hidden configuration files.


    To recover items from Trash click the Trash icon on the Desktop then right-click
    on the item/s you want to recover. Select the option to Restore from the context
    menu that appears and they will be moved back to the location from which they
    were deleted.


    To permanently delete files and directories from Trash right-click on the Desktop
    icon and select the Empty Trash Bin option.


    6. Handling files 69


    ## Making shortcuts to files


    It is often convenient to create desktop shortcuts to the applications and files
    that you access most frequently. To create a new desktop shortcut to an application
    first find it on the Start menu, drag-and-drop it onto the desktop.


    ![](img/0494b98ec9ddc4515587e9808d73902e_71_0.png)


    Release the mouse button then select the Link Here option from the context menu
    that appears – an icon gets added to the desktop which you can click to launch
    that application.


    ![](img/0494b98ec9ddc4515587e9808d73902e_71_1.png)


    To create a desktop shortcut to a file drag-and-drop it onto the desktop from
    Konqueror then choose Link Here – an icon gets added to the desktop which you
    can click to open that file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_71_2.png)


    ## ...continued


    In Linux this type of shortcuts are known as “hard links” – they point directly
    to the system address at which the target is located on the hard disk drive.


    ![](img/0494b98ec9ddc4515587e9808d73902e_72_0.png)


    Linux also allows the creation of “soft link” shortcuts (also known a “symbolic
    links” or just “symlinks”). This type of link stores the path to the target as
    a URL which Linux knows to.


    Hard links can only point to files on the same file system whereas soft links
    can point to both local and remote locations – such as a web address page.


    To make a soft link to a file right-click on the desktop then click on the Create
    New menu and select the Link To Location option:


    ![](img/0494b98ec9ddc4515587e9808d73902e_72_1.png)


    In the dialog that appears browse to the location to which you want the shortcut
    to point then click the OK button – an icon gets added to the desktop displaying
    the same file name as that to which is soft linked.


    A soft link can be made to an application in the same way by selecting the Create
    New, Link to Application option from the desktop context menu.


    6. Handling files 71


    ## Understanding access permissions


    In Linux each file and directory has an “owner” – generally the user who created
    it. The owner has full permission to read, write to the file and execute the file
    (if it''s executable).


    The owner may also set permissions to specify if other users can read, write and
    execute the file. The file’s accessibility can be restricted to the owner, or
    to a “group” of which the owner is a member, or to any user of the system.


    To view the permissions of a file right-click on it, select Properties from the
    context menu


    ![](img/0494b98ec9ddc4515587e9808d73902e_73_0.png)


    An executable is a binary file. The soft link is set for a directory all files
    created within that inherit the group ID. The symlink is a binary file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_73_1.png)


    The context menu lets you delete directories which are not empty without question;
    be sure they do not contain hidden configuration files. The owner may also set
    permissions to specify if other users can read, write and execute the file. If
    you need to change permissions on files where you are not the owner you need Super
    power – in KDE you can select System, File Manager to make changes in the Permissions
    dialog.


    The file’s accessibility can be restricted to the owner, or to a “group” of which
    the owner is a member, or to any user of the system.


