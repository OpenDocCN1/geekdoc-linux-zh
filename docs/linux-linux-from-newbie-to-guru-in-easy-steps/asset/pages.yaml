  md: "# Viewing plain text files\n\nThe simplest way to view a text file in the shell\
    \ is with the “cat” command. Just state one or more files to its arguments and\
    \ it will display their content, concatenating the text together.\n\n| cat | show\
    \ concatenated text file content |\n| (pipe) | redirect text stream to another\
    \ command |\n| less | show one screen at a time |\n| head | show the first lines\
    \ of text |\n| tail | show the final lines of text |\n| ni | show text with each\
    \ line numbered |\n\nViewing one or two small text files will fit comfortably\
    \ in a single window so you will see the entire text. Larger files, however, will\
    \ exceed the space in a single window so you will only see the final part of the\
    \ text. The solution is to send the text stream to the “less” command via the\
    \ “|” pipe character. This means that the text is displayed one screen at a time,\
    \ starting from the beginning:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_169_0.png)\n\
    \nThe “less” facility offers many great options – press the H key to view the\
    \ Help page when in “less mode”.\n\n```\nShell - Konsole\nSession Edit View Bookmarks\
    \ Settings Help\nuser> cat quote0.txt\\I can resist everything except temptation.\n\
    user> cat quote1.txt quote2.txt\n[at the New York Custom House]\\I have nothing\
    \ to declare except my genius.\n[a huge fee for an operation was mentioned]\n\
    \ suppose I shall have to die beyond my means\nuser> cat reading-gaol.txt | less\n\
    ```\n\nIn the shell in “less mode” use the Page Down and Page Up keys to move\
    \ through the text. You can skip to the end of the text with the “>” key and exit\
    \ back to a prompt at any time by pressing the “q” key on your keyboard."
