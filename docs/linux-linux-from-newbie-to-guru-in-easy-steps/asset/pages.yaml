  md: '# Accessing files on Windows partitions


    Dual-boot systems the Windows partition may be mounted in Linux to allow a degree
    of access to the files stored there. This process is similar to the way peripheral
    drives are mounted—allowing access to files on portable media, such as CD-ROMs.


    File system differences prohibit the modification of files on a Windows partition
    from Linux—but they can be copied into Linux and modified there.


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_0.png)


    User-friendly Linux distros, such as SUSE Linux, automatically mount the Windows
    partition for you. This means you can easily access the files in Windows from
    the /windows directory in Linux. In the example below Konqueror is able to view
    one of Photoshop''s sample images located on the Windows partition.


    ![](img/0494b98ec9ddc4515587e9808d73902e_77_1.png)


