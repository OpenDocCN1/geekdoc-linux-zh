  md: "# Generating random numbers\n\nThe $RANDOM variable generates a \"random\"\
    \ positive integer from 0 to 32,767 each time it is called upon. To set a range\
    \ for the random numbers use the \"%\" modulus operator to specify the maximum\
    \ number. For instance, to set the range from 0 to 19 use ($RANDOM % 20) – divides\
    \ whatever number has been generated by 20s, leaving a leftover number of zero\
    \ to 19. Adding 1 to the expression with ($RANDOM % 20 + 1) increases the range\
    \ so that random number will be between 1 and 20.\n\nThe numbers generated by\
    \ $RANDOM are not truly random as it generates the same sequence given the starting\
    \ point (seed):\n\n![](img/0494b98ec9ddc4515587e9808d73902e_221_0.png)\n\n```\n\
    Session Edit View Settings Help\nuser RANDOM=1\nuser echo $RANDOM; echo $RANDOM;\
    \ echo $RANDOM\n17767\n9158\n6249\nuser RANDOM=1\nuser echo $RANDOM; echo $RANDOM;\
    \ echo $RANDOM\n17767\n9158\n6249\nuser> \n```\n\nIn order to ensure the $RANDOM\
    \ variable generates different sequences of numbers when called it is necessary\
    \ to set it with different starting seed values.\n\nA solution is to extract a\
    \ dynamic value from one of its options using the \"date\" command. One of its\
    \ options \"+%s\" delivers the current number of seconds that have elapsed since\
    \ the epoch – defined as 00:00:00 GMT on January 1, 1970. Using this to seed the\
    \ $RANDOM variable gets better random number generation.\n\nThe script opposite\
    \ begins by extracting the current elapsed time from the date command to seed\
    \ the $RANDOM shell variable."
