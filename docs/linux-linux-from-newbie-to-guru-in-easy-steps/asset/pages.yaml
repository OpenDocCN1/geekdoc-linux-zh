  md: "# Sending and receiving mail\n\nAll system users can send internal mail to\
    \ each other by typing the \"mail\" command at a shell prompt and supplying the\
    \ recipient’s user name as its argument. This launches the mail program in the\
    \ shell window which first invites you to enter a subject title for your mail\
    \ message, then moves on so you can type the actual message content.\n\nWhen your\
    \ message is complete hit Return, to end with a linefeed character, press Ctrl+D\
    \ to send the message. The mail program adds an \"EOT\" end-of-text confirmation\
    \ and returns you to a regular shell prompt:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_207_0.png)\n\
