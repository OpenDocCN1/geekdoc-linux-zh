- img_proc: true
  md: '# cont''d


    Notice the comments added to this script - after the #! line of a "#" character
    is ignored. Trivial counter variables are normally lowercase - such as $i, $j,
    and $k in this example.


    ![](img/0494b98ec9ddc4515587e9808d73902e_220_0.png)


    Although the "for" loop in this case iterates a list of numbers it could iterate
    a list of strings using the "$string" equality operator in place of the "-eq"
    numeric equality operator.


    ![](img/0494b98ec9ddc4515587e9808d73902e_220_1.png)


    ```

    #!/bin/bash

    clear

    i=1; echo -n "While loop: "

    while [ $i -lt 9 ] #test

    do

    echo -n "...$i" #output

    i=$(expr $i + 1) #increment

    done; echo ""


    j=1; echo -n "Until loop: "

    until [ $j -eq 9 ] #test

    do

    echo -n "...$j" #output

    j=$(expr $j + 1) #increment

    done; echo ""\necho -n "For loop: "

    for k in 1 2 3 4 5 6 7 8

    do

    if [ $k -eq 3 ]; then continue; fi

    if [ $k -eq 7 ]; then break; fi

    echo -n "...$k"

    done; echo " "

