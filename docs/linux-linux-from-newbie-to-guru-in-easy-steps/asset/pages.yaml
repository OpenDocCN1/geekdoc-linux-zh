  md: "# Comparing files\n\nThe shell provides several ways to compare two files.\
    \ You can check to see if two files are identical with the \"cmp\" command. If\
    \ they are identical the command reports nothing but if they differ it reports\
    \ the location of the first difference.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_165_0.png)\n\
    \n| | compare two files – line by line |\n| cmp | compare two files for identical\
    \ match |\n| diff | show the differences between two files |\n| md5sum | produce\
    \ a md5 checksum identifier |\n| cksum | produce a CRC identifier |\n\nText files\
    \ can be compared line by line with the \"comm\" command. Its output is slightly\
    \ unusual as it creates three columns to indicate lines that match in each file:\n\
    \n+   * Column 1 – lines found in the first file, but not the second\n* Column\
    \ 2 – lines found in the second file, but not the first\n* Column 3 – lines found\
    \ in both files\n\nThe first file contains three lines \"alpha\", \"beta\", \"\
    charlie\", and the second contains three lines \"alpha\", \"charlie\", \"delta\"\
    :\n\n![](img/0494b98ec9ddc4515587e9808d73902e_165_1.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> ls\nabc.txt acd.txt\nuser> cmp\
    \ abc.txt acd.txt\nabc.txt acd.txt differ: byte 7, line 2\nuser> comm abc.txt\
    \ acd.txt\n      alpha\nbeta      charlie\n      delta\nuser>\n```"
  merge: -1
  pgno: 165
- img_proc: true
  md: '“diff” command offers an alternative to the comm command for comparison of
    text files. It too compares line by line and it produces a detailed report showing
    any unique lines. It can also be used to compare two directories to reveal unique
    files.


    Files may also be compared using checksum numbers to verify their integrity. Checksum
    numbers are often found on internet download pages so the user can ensure that
    a downloaded file is intact – typically the checksum is made using the md5 algorithm.


    The “md5sum” command produces a 32-byte checksum for the file specified as its
    argument and should exactly match that stated by the originator if the file is
    indeed intact.


    An alternative checksum can be created in the same way by the “cksum” command:
    this generates a CRC (Cyclic Redundancy Check) value and includes the file''s
    byte size in the output.


    ![](img/0494b98ec9ddc4515587e9808d73902e_166_0.png)


    Type “man diff” to view the man page describing the output from the diff command.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Locating files


    Locating a file on your system can be achieved from a shell prompt using the “find”
    command. This is a very powerful command, with over 50 possible options, but it
    has an unusual syntax. Possibly the one most used looks like this:


    ```

    find dir-name -type f -name file-name -print

    ```


    The directory name specifies the hierarchical starting point from which to begin
    searching. If you know the file exists somewhere in your home directory you could
    begin searching there ( ~ ). Alternatively, you could use the -l command to assume
    root super status then search the entire system by starting from the top root
    directory ( / ).


    ![](img/0494b98ec9ddc4515587e9808d73902e_167_0.png)


    In this case the -type f option specifies that the search is for a file, the -name
    option makes the search by name and the -print option simply makes the command
    print the results in the shell window.


    In the example below the user searches for a named file within the home directory.
    Switching to super user, the next search is made across the entire file system
    for any file whose name begins with the specified string:


    ```

    Shell - Konsole

    user> find ~ -type f -name linux.txt -print

    home/mike/My Documents/linux.txt

    user> su -l

    Password: ******

    root> find / -type f -name starburst* -print

    opt/gnome/share/gimp/2.0/scripts/starburst-log\usr/share/wallpapers/starburst.jpg

    find:/media/floppy: No medium found

    root> exit

    logout

    >

    ```'
  merge: -1
