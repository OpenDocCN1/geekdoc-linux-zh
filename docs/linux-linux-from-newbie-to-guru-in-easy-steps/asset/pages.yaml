  md: '# Checking spelling


    The “look” command is a handy little program that displays a list of words that
    begin with the string you supply as argument. These are retrieved from a dictionary
    file, normally located at /usr/share/dict/words, which you can edit or replace.


    | | show the current effective user name |

    | --- | --- |

    | ispell | show the host domain name |


    Press the Ctrl+C keys to have spell leave interactive spellchecking made and return
    to the normal shell prompt.


    Use the “ispell” command for a more comprehensive spelling check. Use this command,
    hit Return, and the program prompts you to enter a word for checking. This will
    report OK if the spelling is correct, or suggest an alternative if it''s incorrect.


    Supply a file name as the argument to the ispell command to begin an interactive
    spelling session for its entire contents.


    ![](img/0494b98ec9ddc4515587e9808d73902e_178_0.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> look genius

    genius geniuses''s

    user> ispell

    (@) International Ispell Version 3.2.06

    word: freind

    how about: friend

    user> ispell reading-gaol.txt

    ```


