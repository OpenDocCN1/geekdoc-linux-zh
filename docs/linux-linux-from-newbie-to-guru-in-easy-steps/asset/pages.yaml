  md: '# cont''d


    Permissions can be changed at a shell prompt with the “chmod” command stating
    the permission values and the file name as its arguments. For example, the command
    \chmod 777 myfile sets full permissions for a file named “myfile” in the current
    directory. If you need to change permissions where you are not the owner you must
    first assume super user status with the “su -l” command.


    | | change access mode permissions |

    | chgrp | change group membership |

    | chown | change user ownership |


    The “chgrp” command can be used to change the group membership of a file by stating
    a group name and the file name as its arguments. Similarly, the “chown” command
    can specify a user name and the file name to change the user ownership:


    ![](img/0494b98ec9ddc4515587e9808d73902e_192_0.png)


    Here the access is changed on file-3 to let everyone read it. The access mode
    changed on file-2 to allow group members to read it - and the group membership
    changed. Ownership of file-1 is changed to the current user.


    ```

    root> chmod 644 file-3

    root> chmod 640 file-2

    root> chgrp exec file-2

    root> chown mike file-1

    root> exit

    logout

    user> ls -lt

    total 16

    drwxrxrwx 2 root users 48 15:35 common

    -rw-r--r-- 1 mike users 17 15:35 miketest

    -rw-r--r-- 1 andrew root 24 15:35 file-3

    -rw-r---- 1 david 19 15:34 file-2

    -rw-r------ 1 mike root 19 15:33 file-1

    user> cat file-1 file-2 file-3

    Linda says "Hello"

    David says "Howdy"

    Andrew says "Greetings"

    user>

    ```'
