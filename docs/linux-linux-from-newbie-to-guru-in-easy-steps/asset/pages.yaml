- img_proc: true
  md: 'Many Linux distros include an alternative to the GZip compression tool called
    Bzip2. This can often produce smaller tarball files because it uses better compression
    techniques.


    Right-click on a directory to archive and compress, then select the Bzip2 option
    from the context menu:


    ![](img/0494b98ec9ddc4515587e9808d73902e_76_0.png)


    Although gzip enjoys widespread support it is not ubiquitous as the regular ZIP
    compression format – most tarballs for download are still GZipped archives.


    The tarball is created in the current directory with the original file name and
    an added file extension of “.tar.bz2”.


    In the screenshot below tarballs have been created of a large bitmap file using
    both GZip and Bzip2. The original file size of 1.5Mb is compressed to 41.7Kb by
    GZip but to 24.6Kb by Bzip2:


    ![](img/0494b98ec9ddc4515587e9808d73902e_76_1.png)


