  md: '# # Transferring files over a network


    You can send files over a network using File Transfer Protocol. The "ftp" command
    launches the ftp program and the prompt changes to let you know that you are using
    the ftp console. Supply a hostname, or its IP address, to the "open" ftp command
    then enter a value login name when requested to connect to that system.


    If the host is running a Unix-based operating system it will recognize bash shell
    commands for navigation – cd, ls, pwd, etc.. Use the "put" ftp command, followed
    by a file name, to transfer a copy of your file from your local system to the
    remote host:


    ![](img/0494b98ec9ddc4515587e9808d73902e_203_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_203_1.png)


