- img_proc: true
  md: "# # Navigating at the command line\n\nWhen a user logs into the shell they\
    \ are, by default, located in their home directory on the Linux system but they\
    \ can move to other directories using the `cd` command.\n\n| cd dir | change directory\
    \ to dir |\n| ~ | an alias for the user's home directory |\n| ls | an alias for\
    \ the next higher directory level / list the contents of the current directory\
    \ |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_157_0.png)\n\nRemember that absolute\
    \ directory addresses begin with a forward slash / descending from the / root\
    \ location.\nThe user can move to any directory to which they have permission\
    \ by stating its absolute address as an argument to the cd command. For instance,\
    \ type the command `cd /etc` then hit Return to move into the /etc directory –\
    \ use the pwd command to confirm your current location.\n\nSimilarly, the user\
    \ could return to their home directory by the same method, or using the tilde\
    \ alias with the command `cd ~`.\nFor shorter hierarchical moves, use the `cd\
    \ ..` command to move up to the next higher directory, or state just the name\
    \ of any immediate sub-directory as the argument to the cd command to move down\
    \ one level into that directory.\n\n```\nShell - Konsole\nSession Edit View Bookmarks\
    \ Settings Help\nuser> pwd\n/home/mike\nuser> cd /etc ; pwd\n/etc\nuser> cd ~\
    \ ; pwd\n/home/mike\nuser> cd .. ; pwd\n/home\nuser> cd mike ; pwd\n/home/mike\n\
    user> \n```"
  merge: -1
