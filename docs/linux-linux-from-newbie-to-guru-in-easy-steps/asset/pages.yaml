  md: '# # Getting started with the shell


    This chapter introduces the Linux shell and illustrates how to interact directly
    with the core of the operating system. It describes how to customize the shell
    prompt and explains the different system run levels. It also demonstrates how
    to use shell variables and how to launch applications from the shell.


    # ## Covers


    +   - What is the shell? | 144

    - Becoming the Super User | 146

    - Customizing the shell prompt | 148

    - Changing the run level | 150

    - Revealing shell variable values | 152

    - Launching applications from the shell | 154'
  merge: -1
