  md: '# Examining file properties


    The Linux shell provides many commands which can be used to examine the attributes
    of any file. The "stat" command lists every important attribute of the file stated
    as its argument.


    | stat | show file and directory attributes |

    | --- | --- |

    | wc | show word count of a text file |

    | du | show disk usage of a file or directory |

    | file | estimate the file type |

    | touch | create a file or update its time stamp |


    In the example below the stat command examines a small file and displays its size
    in bytes (40), size in blocks (8), file type (regular), inode system address (111498),
    number of hard links (1), access permissions, and timestamps:


    ![](img/0494b98ec9ddc4515587e9808d73902e_163_0.png)


    If you just want to see the file size use the "du" command with the -b option
    to count the number of bytes it occupies.'
