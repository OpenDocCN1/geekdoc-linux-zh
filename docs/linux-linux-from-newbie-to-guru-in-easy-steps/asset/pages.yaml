    appearance and data values. Click a blank area of the window to exit edit mode
    and return to the standard main toolbar.


    To create a chart graph within a document in OpenOffice Use it Insert, Object,
    Chart menu then click the Create button in the dialog – the default chart is added
    at the current document location. Double-click this to see any blank area of the
    window to return to the main toolbar buttons.


    ![](img/0494b98ec9ddc4515587e9808d73902e_88_0.png)


    The screenshot above illustrates the bar chart and its equivalent 3D graph – both
    main titles have been modified.


    Exported images are rasterized – so they do not contain editable objects.


    To save a drawing click on the File, Save As and type a name for the file in the
    Save As dialog – the native format for OpenOffice Draw adds the file extension
    .odg. You can also use File, Export to create a graphic image of the drawing in
    a wide range of image formats, such as "bmp", "gif", "wmf" and more.'
