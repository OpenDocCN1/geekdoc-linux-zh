  md: '# # Making space for Linux


    An operating system is installed on a defined area of the HD drive called a “partition”.
    When Windows is the only installed operating system its partition will normally
    occupy the entire HD drive. To install Linux in this situation there are three
    possible options:


    +   - Delete the Windows partition – replacing it with Linux partition(s) that
    occupy the entire drive. This option will delete the Windows operating system
    along with all the applications and data files that were installed there. It creates
    a dedicated Linux computer which will immediately start Linux whenever the PC
    gets switched on.


    +   - Reduce the Windows partition size – so that it no longer occupies the entire
    drive, then create Linux partition(s) in the resulting free space. This option
    should and retain the Windows operating system, applications and data files. It
    creates a “dual-boot” computer that allows the user to choose whether to start
    Linux or Windows whenever the PC gets switched.


    +   - Add a second HD drive to the system – this allows Linux partition(s) to
    occupy the second drive and retains the Windows operating system, applications
    and data files on the first drive. It too creates a “dual-boot” computer that
    allows the user to choose whether to start Linux or Windows whenever the PC gets
    switched.


    ![](img/0494b98ec9ddc4515587e9808d73902e_15_0.png)


    The option to install an additional HD drive for Linux is a popular choice for
    many people as they have often upgraded their original HD drive to a larger one,
    and so have their original drive spare. It also has several benefits over the
    other options:


    +   - The free space on the Windows drive is not reduced


    +   - It removes the threat of data loss through partition resizing


    +   - The familiar Windows operating system is retained


    +   - It separates the two operating systems


    +   - Drive failure would only disrupt one operating system'
  merge: -1
  pgno: 15
