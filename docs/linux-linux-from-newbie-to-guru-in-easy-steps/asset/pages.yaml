  md: 'Text files on an ftp server can be read without downloading them to your local
    system – for instance, you could issue the command “page otherbooks.txt” to read
    the file uploaded in the last example:


    ![](img/0494b98ec9ddc4515587e9808d73902e_204_0.png)


    The "page" command recognized by the ftp server is a Unix command that works like
    the Linux "less" command.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    C Programming in easy steps

    C++ Programming in easy steps

    Java in easy steps

    JavaScript in easy steps

    HTML in easy steps

    CSS in easy steps

    SQL in easy steps

    lines 1-8/8 (END)

    ```


    | ftp | open the ftp console program |

    | open | connect to an ftp server |

    | put | copy a file to the remote system |

    | mput | copy multiple files to a remote system |

    | get | copy a remote file to the local system |

    | mget | copy multiple remote files to the local system |

    | exit | logout of the ftp console |


    Multiple files can be transferred up to a remote system using the “mput” command
    together with the * wildcard character. The command “input *” simply copies all
    files in the current local directory to the current remote working directory.


    Similarly, the “get” and “mget” commands can be used to copy files in the other
    direction – going from the remote system down to your computer.


    When you have completed all file transfers “exit” or “quit” to close the ftp console
    and return to a regular shell prompt.'
