  md: '# Performing basic file operations


    The shell “mv” command lets you easily move files around your Linux system from
    the command line. This command requires two arguments stating the name of the
    file to be moved and the destination to which it should be moved.


    | mv | move or rename a file |

    | cp | copy a file |

    | rm | delete a file |

    | in | create a link to a file |

    | readlink | show the target of a symbolic link |


    ![](img/0494b98ec9ddc4515587e9808d73902e_161_0.png)


    Interestingly, the mv command can also be used to rename a file by stating its
    current name and a new name as its two arguments.


    If you wish to copy, rather than move, a file to a new location the “cp” command
    can be used. This command can accept one or more names of files to be copied as
    its arguments, stating the destination as the final argument.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> ls

    Alpha Zebra

    user> ls Alpha

    doc-1 doc-2

    user> ls Zebra

    pic-1 text-1 text-2

    user> mv Alpha/doc-1 Zebra

    user> mv Alpha/doc-2 Alpha/renamed

    user> cp Zebra/pic-1 text-1 Alpha

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    doc-1 pic-1 text-1 text-2

    user>

    ```'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# ...cont''d


    The “rm” command can be used to delete one or more files named as its arguments
    – use the * wildcard to delete all files in a directory.


    You can create hard links, pointing to the system address of a file, and soft
    (symbolic) links, storing the path to a file, with the “ln” command. By default
    this will create a hard link to the file named as its argument – use the -s option
    to create a symbolic link.


    The readlink command can be used to discover the target to which a symbolic link
    is pointing:


    ![](img/0494b98ec9ddc4515587e9808d73902e_162_0.png)


    See page 71 for more details on hard and soft links.


    ```

    Session Edit View Bookmarks Settings Help

    user> ls

    Alpha ls Zebra

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    doc-1 pic-1 text-1 text-2

    user> rm Zebra/*

    user> ln Alpha/pic-1 Zebra/pic

    user> ln -s Alpha/text-1 Zebra/txt

    user> ls Alpha

    pic-1 renamed text-1

    user> ls Zebra

    pic

    user> readlink Zebra/txt

    Alpha/text-1

    user>

    ```


    This example begins by listing the contents of two directories then deletes all
    contents of the second directory. Then it creates a hard link and a soft link
    there – pointing to files in the first directory.'
