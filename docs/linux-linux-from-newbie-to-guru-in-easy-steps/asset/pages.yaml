  md: '# Compressing and extracting files


    Files in Linux, and other Unix-based operating systems, are typically archived
    into a “tarball” for compact transfer. This first creates a Tape Archive (TAR)
    copy of the files then compresses that copy using a familiar ZIP compression format.


    TAR was originally used for backing up files on tape in a manner that preserves
    the file permissions and hierarchy.


    ![](img/0494b98ec9ddc4515587e9808d73902e_75_0.png)


    In KDE right-click on a file (or directory) to be archived then select the “Compress”
    option on the context menu. In the current location – a tarball version is created
    in the location – this has the same name, but adds a “.tar.gz” extension.


    ![](img/0494b98ec9ddc4515587e9808d73902e_75_1.png)


    | Open |

    | Cut Ctrl+X |

    | Copy Ctrl+C |

    | Rename F2 |

    | Move to Trash Delete |

    | Open With |

    | Actions |

    | Compress Compress as bigbmp tar.gz |

    | Copy To Compress As |

    | Move To Add To |

    | Properties Add to Archive... |


    To extract the contents of a tarball in KDE right-click on the file then select
    the Extract, “Extract Here” option from the context menu. The application associated
    with archives will then deposit all the expanded file contents in the current
    directory location.


    ![](img/0494b98ec9ddc4515587e9808d73902e_75_2.png)


    The ZIP tool in Linux – now the standard gz part of the file extension in the
    tarball archive.


    Alternatively, choose the “Open With” context menu option and select the Archive
    tool to preview the contents. This allows specific files to be selected for extraction
    from within the tarball and lets you choose a destination other than the current
    location.


    Linux in easy steps'
  merge: -1
