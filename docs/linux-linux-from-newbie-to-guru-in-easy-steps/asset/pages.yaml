  md: '# Choosing a Linux distro


    At the very heart of Linux is a bunch of tried tested compiled code called the
    “kernel”. The kernel provides the operating system with its core functionality,
    much like the engine in a car. It takes care of the basics, such as helping other
    programs access hardware and sharing your computer’s processor among various programs.


    In addition to the kernel, Linux contains a number of system-level programs, such
    as the services to handle your email, web connection and bootloader. Consider
    these as a car’s transmission, gears and chassis – without which the engine is
    not much use.


    Linux distributions generally also include a large number of user-level programs
    – the applications for daily use. For instance, web browsers, word processors,
    text editors, graphics editors, media players, and so on. These are the finishing
    touches to the car that ensure a great ride – whitewall tires and soft leather
    upholstery.


    All of these components are bundled together in a wide variety of Linux distribution
    packages, commonly referred to as “distros”. Just as all the components of a car
    are bundled together to make a complete car.


    In the same way that there are makes and models of cars there are many Linux distros
    to choose from. The most well known distros are RedHat, Mandrake, SuSE, Debian
    and Slack. Each distro has its own installer and unique default configuration
    according to what the distributor considers to be the best arrangement. The ideal
    one for you will depend on your own personal preferences and how you want to use
    Linux. The most popular distros are described below to help you choose.


    ![](img/0494b98ec9ddc4515587e9808d73902e_11_0.png)


    Many other Linux distros can be found online. (disk images) can be downloaded
    to create a Linux installation disk.


    # RedHat Fedora


    One of the most published Linux distros comprising the commercial RedHat Enterprise
    Linux product line and the unsupported free Fedora Core distro that is developed
    by the community, serving as a test base for RedHat Enterprise Linux. Pros: Widely
    used, excellent community support, innovative. Cons: Limited product life-span
    of the free edition, poor multimedia support.


    ![](img/0494b98ec9ddc4515587e9808d73902e_11_1.png)


    # Fedora


    Free download at http://www.fedora.redhat.com.'
