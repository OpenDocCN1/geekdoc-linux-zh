  md: '# Launching applications from the shell


    In the same way that KWrite text editor was launched from the shell, in the example
    on page 149, any application can be launched from a shell window – providing you
    know its correct name. This is not always obvious but can be discovered by examining
    that program''s properties dialog.


    Open the main Start menu then drag a menu onto the desktop and choose the Link
    Here option from the context menu – creating a desktop shortcut to the program.
    Now right-click on the shortcut and select the Properties dialog. Under the Application
    tab in the Properties dialog is a box labelled Command that states the command
    to launch that program. For example, the command used to launch the Real Player
    multimedia application is revealed in the Properties dialog to be “replay”.


    Applications which have been launched from a shell window will also close when
    the shell window gets closed


