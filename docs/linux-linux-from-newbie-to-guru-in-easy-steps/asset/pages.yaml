  md: '# The evolution of Linux


    In 1983 a visionary programmer named Richard Stallman began a movement that called
    the GNU Project. His philosophy was that software should be free from restrictions
    against copying or modification in order to make better and efficient programs.
    This inspired programmers around the world to create programs driven by efficiency
    rather than financial incentive. GNU C Compiler written by Stallman himself. At
    that time many of these tools were incorporated into a Unix-compatible operating
    system, by a 21-year-old student at the University of Helsinki. His name was Linus
    Torvalds and he named the operating system Linux (Linux - Unix).


    The term "GNU" is a recursive acronym for GNU''s Not Unix.


    ![](img/0494b98ec9ddc4515587e9808d73902e_10_0.png)


    Linux was made available for download on the Internet so programmers could test
    and tweak the source code, then return it to Linus Torvalds. After a period of
    enthusiastic development Linux 1.0 was made available globally under the GNU General
    Public License which ensured it would remain free.


    ![](img/0494b98ec9ddc4515587e9808d73902e_10_1.png)


    Programmers were keen to explore Linux and found some amazing uses for it. In
    April 1996, researchers at Los Alamos National Laboratory used Linux to run 68
    PCs as a single parallel processing machine to simulate atomic shocks. At $150,000
    this supercomputer cost just 1-1th of a comparable commercial machine. It reached
    a peak speed of 19 billion calculations per second, making it the 35th most powerful
    supercomputer in the world. It proved to be robust so three months later it still
    hadn''t been rebooted.


    "Tux" the penguin is the logo of the Linux operating system. It commemorates an
    incident in which Linus Torvalds, while on vacation in the southern hemisphere,
    was bitten on the hand by a penguin.


    Linux continued to grow in popularity as a text-based operating system while Windows
    became the dominant graphical operating system. Recognizing that most PC users
    want the point-and-click convenience of a graphical environment, the Linux camp
    began to develop a system comparable to the Windows desktop.


    From a handful of enthusiasts in 1991 to millions of users now - Linux has come
    of age. Today''s sleek K Desktop Environment (KDE) and the Gnome environment now
    offer a user-friendly alternative for Windows users – Linux for the desktop!'
  merge: -1
