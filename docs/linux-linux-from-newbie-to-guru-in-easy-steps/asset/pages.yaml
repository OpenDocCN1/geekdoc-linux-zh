  md: '# Creating and editing text files


    The classic Linux shell program for creating and editing text files is the compact
    "vi" application that is also found on Unix systems – type vi at a prompt, hit
    Return, to open the text editor.


    ![](img/0494b98ec9ddc4515587e9808d73902e_171_0.png)


    The vi editor displays a tilde character at the beginning of each empty line.
    You cannot enter any text initially as vi opens in “command mode” where it will
    attempt to interpret anything you type as an instruction. Press the “i” key to
    change to “insert mode” where text can be input – vi displays "--INSERT--" at
    the bottom left corner to let you know it will now accept text input.


    ![](img/0494b98ec9ddc4515587e9808d73902e_171_1.png)


    The numbers at the bottom of the vi editor indicate the current cursor position
    – in this case at the 43rd character of the 2nd line.


    Some text into the vi editor and notice there is no automatic word wrap at line
    ends – vi will wrap to the next line mid-word unless you hit the Return key to
    manually wrap the line.


    Linux in easy steps'
