  md: '# # Burning CDs and DVDs


    If your system has a CD writer or DVD writer, you can easily burn your own disks
    using the K3b application. To make a CD copy launch K3b then click the button
    labelled ''Copy CD'':


    Some disks have copy protection that prevents copying


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_1.png)


    The CD Copy dialog will appear where you can choose which CD Reader Device to
    copy from – select the drive where your source CD is located. You can configure
    other options in this dialog, such as choose the temporary directory where K3b
    will write the data it is about to copy from your CD. Usually you can just accept
    the default options. When you are happy with your choices click the Start button
    in the dialog to begin copying all contents from the CD to the temporary directory.


    If you have downloaded disk image (.iso) files, such as those used by Linux distros,
    you should use the Burn CD Image button to create a usable CD.


    ![](img/0494b98ec9ddc4515587e9808d73902e_129_2.png)


    The Copy CD dialog appears where two barras keep you informed as each track is
    copied. When all tracks have been copied K3b ejects the CD and asks you to insert
    a blank disk.


    The Copy Dialog changes into writing mode as it copies each track, in turn, from
    the temporary directory onto the disk. This can be a lengthy process but when
    it eventually completes K3b plays a jingle to let you know that your new disk
    is ready.'
