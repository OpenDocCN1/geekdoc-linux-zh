  md: '# Browsing with Mozilla Firefox


    In addition KDE''s Konquer web browser most Linux distros include the open-source
    Mozilla Firefox browser. This popular free browser is available for various platforms
    and contains many powerful features. It has been developed by the open source
    community from original Netscape browser source code into a very competent, standards
    compliant product.


    In SUSE linux click Start, Internet, WebBrowser, Firefox to launch the web browser.
    Type a URL into the location field then hit Return to open that page in the browser
    window.


    Most web browsers are based upon the Mosaic browser of the early 1990s. the name
    Mozilla is derived from "Mosaic" and "godZILLA".


    ![](img/0494b98ec9ddc4515587e9808d73902e_91_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_91_1.png)


    If you''re using to Internet Explorer you will feel instantly at home with Firefox
    – but it also has some great extra features. Type a word or phrase into the location
    field then click the Search button to have the Google search engine return a list
    of relevant URLs.


    Firefox''s appearance can be easily customized – click on the Tools menu, then
    select Themes. You can choose from the listed themes, or select Get More Themes
    to download others from the Internet.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# ...cont''d


    Click on the Edit menu and select Preferences to open the Preferences dialog.
    The category menu allows you to configure the browser to your personal taste.
    The “Block Popup Windows” option on the Web Features menu is especially welcome
    as it allows you to suppress annoying popup windows. Check its option box then
    click the OK button to apply the change so that popup windows are no longer allowed.


    ![](img/0494b98ec9ddc4515587e9808d73902e_92_0.png)


    HOT TIP Firefox plugin information for Acrobat Reader, Flash Player, Java and
    Real Player can be found at: https://pfs.mozilla.org/plugins.


    Firefox includes a script development tool called the JavaScript Console – it’s
    found under the Tools menu. Launch the JavaScript Console and type "alert(new
    Date()" into the input field. Click the Evaluate button and a dialog box should
    pop up with current date and time information.


    Also to be found on the Tools menu which allows great extra features to be added
    to Firefox. These are provided free of charge by enthusiastic members of the open-source
    community. Click the Extensions option to open the Extensions dialog listing all
    installed Extensions, follow the hyperlink in the dialog to open the web page
    from which Extensions may be downloaded.'
