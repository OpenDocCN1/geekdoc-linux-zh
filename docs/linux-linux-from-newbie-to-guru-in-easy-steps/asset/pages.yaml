  md: '# Playing Real media


    Real media provides popular file formats for both audio (RealAudio) and video
    (RealVideo) and is often a common alternative to Windows Media formats. So even
    if your distro did not come bundled with Real Player it is worth obtaining a copy.


    See page 32 for help on installing RPM packages


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_0.png)


    Real Player for Linux is available for free download as an RPM package at www.real.com/linux.
    Installation may not automatically add it to the Start, Multimedia menu but you
    can easily create a shortcut to launch it. Right-click on the desktop then choose
    to Create New, Link to Application. Now select the Application tab and type “realplay”
    in the Command box. Click OK to create the shortcut then use it to launch Real
    Player:


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_1.png)


    To make a better desktop shortcut right-click on it and open its Properties dialog-


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_2.png)


    Under the General tab enter the application name in the input field then click
    on the icon button and choose an appropriate icon


    ![](img/0494b98ec9ddc4515587e9808d73902e_125_3.png)


    The Real Player interface is simple and straightforward yet the player supports
    an impressive array of file formats in addition to RealAudio and RealVideo. These
    include MP3 and Flash 4 compressed media and WAV, AU, and AIFF uncompressed media.


    You may be surprised to learn that the Help, General menu opens your browser at
    a “Helix Player” help page, until you discover that Real Player for Linux is based
    on the open-source Helix player. Helix player contains no open-source components
    but the Real Player version builds on that to provide wider format support.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# cont''d


    To make a permanent file association for Real media files right-click a file and
    choose Open With, then point to the Real Player menu – check the box to “Remember
    application association...” then click the OK button.


    The Real Player window automatically resizes to suit the content it is playing
    – videos have no unsightly borders and the player collapses to a minimalist control
    panel when playing audio.


    To add Real Player to the Multimedia menu right-click on the Start button and
    choose Menu Editor. Now right-click on the Multimedia group and choose New Item.
    Enter “Real Player” in the dialog. Finally, enter “replay” in the “Command” field,
    and choose File, Save.


    ![](img/0494b98ec9ddc4515587e9808d73902e_126_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_126_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_126_2.png)


    Better performance can be achieved for streaming Real media by adjusting configuration
    settings in the Tools, Preferences menu:


    Real Player does not begin playing streaming content immediately but buffers a
    part of the content first. You can set the buffer size in the Playback tab to
    suit your system and connection.


    ![](img/0494b98ec9ddc4515587e9808d73902e_126_3.png)


