    The number of another mail item, or type "quit" to exit the mail program and return
    to a regular shell prompt. Notice that the message is appended to a file called
    mbox which can be viewed later ("cat mbox") to recall all mail messages.


    If you wish to attach a file to your mail message add a "-a" option and its name.
    For instance, "mail david -a attachedfile". If the attachment is a text file its
    contents are incorporated into the mail message when it is read.


    If you wish to send additional ("CC") carbon copies of your mail message to users
    add a "-c" option followed by one or more user names in a comma-separated list.
    For instance, the command "mail david -c andrew, linda" sends two extra copies.


    The BitDefender Console crontab job, created on page 195, sends its scan report
    by mail in exactly this way.


    ![](img/0494b98ec9ddc4515587e9808d73902e_208_1.png)


    Mail is not just for users though – it can also be used by programs and shell
    scripts that summary reports, typically created by routine jobs, can be piped
    to a mail command. This deposits the report in the recipient''s mailbox for later
    viewing.


