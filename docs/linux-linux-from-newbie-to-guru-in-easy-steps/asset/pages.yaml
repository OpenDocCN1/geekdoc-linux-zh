  md: '# Storing photos


    The Linux digiKam application is a versatile photo management suite for KDE. To
    enable images to be downloaded into digiKam from your digital camera select the
    Camera, Add Camera menu. Connect your camera to a USB port, and switch it on,
    then click the Auto Detect button to automatically seek your camera. Press the
    OK button when it is found or use the Add button to add your camera manually from
    the list provided. Your camera should then have been added under the Camera menu
    and you can select that menu to browse the photos stored there.


    Before downloading your photos you first need to create an Album where they will
    be kept. Select the Album, New Album menu then give the album meaningful title
    in the dialog. Your new album is added to the left pane of the digiKam window
    under the My Albums groups.


    To download your photos right-click on your new album and select the Import, Add
    Images menu. Now choose some, or all, photos for download and they are imported
    into digiKam:


    ![](img/0494b98ec9ddc4515587e9808d73902e_117_0.png)


    Use Options under the Tools menu to create a photo calendar or to view your photos
    as a slide show.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# cont''d


    Double click on any photo in the right pane to open image in the digiKam Editor.
    This contains an impressive array of tools to manipulate color saturation, brightness,
    sharpness, rotation, and also includes a handy "red-eye" correction feature.


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_0.png)


    You may cross-reference your photos in your Album to be classified. The default
    tags of Events, People, and Places, provide a good starting point but you can
    add your own custom tags – just right-click on the Tags group and select the New
    Tag option.


    Click on any photo in digiKam then choose Set as Background to use that photo
    as your desktop background.


    To assign a photo to a tag right-click on the photo then hover over the Assign
    Tag menu, now select the appropriate tag from the sub-menu. Alternatively select
    the Edit Comments & Tags option from the right-click context menu to open a dialog
    where you can add comments and select a tag. Clicking any tag in the left pane
    displays those photos which have been assigned to that tag.


    ![](img/0494b98ec9ddc4515587e9808d73902e_118_1.png)


    9. Creating and editing graphics 117'
  merge: -1
