  md: "# Connecting across a network\n\nIn the same way that each house on a street\
    \ has a unique address, to which mail can be addressed for direct communication,\
    \ every computer on a network has a unique number, known as it's IP (Internet\
    \ Protocol) address, which can be used to directly communicate with a particular\
    \ computer.\n\n| host | show the remote hostname and IP address |\n| ifconfig\
    \ | show the local network IP address |\n| ping | send packets to test if remote\
    \ host is reachable |\n\nYou can discover the IP address of the computer behind\
    \ a web address by stating the URL as the argument to the “host” command. In some\
    \ cases, for large scale websites, this may reveal multiple IP addresses as those\
    \ shown below:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_199_0.png)\n\n```\n\
    Shell - Konsole\nSession Edit View Bookmarks Settings Help\nuser> host www.google.com\n\
    www.google.com is an alias for www.l.google.com\n*\nwww.l.google.com has address\
    \ 66.102.9.104\nwww.l.google.com has address 66.102.9.999\nwww.l.google.com has\
    \ address 66.102.9.147\nwww.google.com is an alias for www.l.google.com\nwww.google.com\
    \ is an alias for www.l.google.com\nuser> \n```\n\nIn Linux you can discover the\
    \ IP address of your own computer by assuming root super user status (“su -l”)\
    \ and issuing the “ifconfig” command to display all network interface configuration.\
    \ If your computer has multiple network connections each one will be listed separately.\
    \ Supply the device name as the argument to the ifconfig command to see an individual\
    \ report.\n\n198 Linux in easy steps"
  merge: -1
  pgno: 199
- img_proc: true
  md: "# ...cont'd\n\n![](img/0494b98ec9ddc4515587e9808d73902e_200_0.png)\n\nThe output\
    \ from ifconfig is lengthy but has been truncated here for clarity.\n\n```\nSheli\
    \ - Konsole\nSession Edit View Bookmarks Settings Help\nroot> ifconfig ra0\nra0\
    \ Link encap:Ethernet\n    inet addr:192.168.0.101\n    Bcast:192.168.0.255\n\
    \    Mask:255.255.255.0\nroot> _\n```\n\nTypically, if your computer connects\
    \ to the network via an ethernet card device will be called \"eth0\". If you are\
    \ connected to a wireless network it will be called \"ra0\" – like the example\
    \ above where the IP address is 192.168.0.101.\n\nThe most basic test to see if\
    \ another computer is reachable across the network sends tiny data packets to\
    \ its IP address using the \"ping\" command. This continues sending test packets\
    \ until you stop it but may limit the number of packets to send by adding a \"\
    c\" option stating the total number of packets to send. In the example below 3\
