- img_proc: true
  md: 'The contents of the current directory can be revealed using the "ls" command
    to display a list of its files and immediate sub-directories. This is a comprehensive
    command that has many useful options:


    +   - use the -a option to see all directory contents – including hidden files
    and hidden immediate sub-directories

    - use the -l option to see the long format listing for each item – including user
    and group ownership names

    - use the -t option to sort the contents by the time they were created or last
    modified

    - use the -o option to suppress group ownership details

    - use the -g option to suppress user ownership details


    Options can be combined to produce a complex option where each parameter is applied.
    This can be seen in the screenshot below where all the options above are combined
    to list all contents, including hidden files, in long format listed by modification
    time – but with user and group details suppressed.


    Notice that directory names that have spaces must be enclosed in quotes to avoid
    truncation at the first space – without the quotes in this case the shell would
    try to change to a directory simply "My".


    ![](img/0494b98ec9ddc4515587e9808d73902e_158_0.png)'
  merge: -1
