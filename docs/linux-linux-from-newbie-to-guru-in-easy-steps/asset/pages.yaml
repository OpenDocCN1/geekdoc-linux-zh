  md: '# Compressing and extracting archives


    The traditional GNU zip file compression tool in Linux uses the “gzip" command
    to compact one or more files stated as its arguments into a single “gz" archive
    – replacing the original files. Conversely, its companion “gunzip" can be used
    to extract files from an archive created with gzip.


    | | |

    |---|---|

    | gzip | compress files in GNU zip format |

    | gunzip | uncompress gz archive files |

    | bzip2 | compress files in Burrows-Wheeler format |

    | bunzip2 | uncompress b2 archive files |

    | zip | compress files in Windows zip format |

    | unzip | uncompress zip archive files |


    Add a "-c" option or bunzip2 command if you want to display the output in the
    shell while and keep the archive file unchanged.


    The modern "bzip2" compression tool achieves better compression than gzip but
    is less widely used – distributing ".bz" archives may not find widely acceptance.
    It works just like the gzip tool and also has a companion "bunzip2" uncompressor.


    This example first compresses a file with gzip then uncompresses the archive with
    gzip. The extracted file is then compressed with bzip2 to illustrate how it achieves
    better compression:


    ![](img/0494b98ec9ddc4515587e9808d73902e_181_0.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Help

    > du -b tam *

    8284 tamoshanter.txt

    > user gzip tamoshanter.txt | du -b tam *

    4151 tamoshanter.txt.gz

    > user gunzip tamoshanter.txt.gz

    > user du -b tam *

    8284 tamoshanter.txt

    > user bzip2 tamoshanter.txt

    > user du -b tam *

    3798 tamoshanter.txt.bz2

    > user |

    ```'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# cont''d


    Compressed archives created on Windows systems invariably use the zip compression
    format. Their contents can be extracted in Linux by the “unzip” tool. Unlike gunzip
    and bunzip2 this does not delete the archive file after extraction:


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> ls -ogl

    total 4

    -rw-r--r-- 1 3096 2005-10-07 09:11 grays.zip

    user> unzip grays.zip

    Archive: grays.zip

    inflating: grays.txt

    user> ls -ogl

    total 12

    -rw-r--r-- 1 5909 2005-10-07 07:50 grays.txt

    -rw-r--r-- 1 3096 2005-10-07 09:11 grays.zip

    user> cat grays.txt | less

    ```


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    Elegy in a Country Church Yard

    by Thomas Gray 1716-1771

    The curfew tolls the knell of parting day,

    The lowing herd winds slowly o''er the lea,

    The ploughman homeward plods his weary way,

    And leaves the world to darkness and to me.

    lines 1-8

    ```


    The intrinsic Compressed Folder feature in Windows XP can handle gz archives but
    you can use the “zip” command to create archives to be distributed to users of
    earlier versions.


