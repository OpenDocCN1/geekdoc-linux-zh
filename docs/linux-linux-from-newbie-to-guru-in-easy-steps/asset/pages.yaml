  md: '# Discovering the control center


    The appearance of the default Linux graphical desktop will seem familiar to those
    users moving from the Windows operating system as both systems display an applications
    menu from the “Start” button – at the bottom left corner in the screenshot below:


    This chapter describes how to configure common system settings – the Linux KDE
    desktop is explored in the next chapter.


    ![](img/0494b98ec9ddc4515587e9808d73902e_31_0.png)


    The “Control Center” is the main configuration tool in Linux. In the SUSE Linux
    distro it can be found by clicking the Start button, then selecting Control Center
    from the main menu.


    The Control Center displays a menu of configurable system components in the left-hand
    Index pane. Clicking on any of those menu options will change the menu to display
    a sub-menu of options for that component in the Index pane.


    Select the desired component from the sub-menu to present its current configuration
    settings in the right-hand pane.


    Changing any current configuration settings and clicking the Apply button will
    update the configuration of the selected component.'
