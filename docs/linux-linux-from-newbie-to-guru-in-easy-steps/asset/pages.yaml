  md: "# cont'd\n\n![](img/0494b98ec9ddc4515587e9808d73902e_164_0.png)\n\nUse the\
    \ \"wc\" word count command to quickly discover how many lines, words, and bytes\
    \ a text file contains or assess what type of file it is with the \"file\" command.\n\
    \nThe touch command introduces some interesting possibilitias it can change the\
    \ Last Accessed and Last Modified timestamps associated with a file. Used alone\
    \ it simply updates these to the present but used with the -d option it allows\
    \ you to specify a date in a wide variety of formats specify a day number and\
    \ month to set the timestamps to midnight on that day of the current year, or\
    \ specify a complete date and time to be any timestamp you like.\n\nThe example\
