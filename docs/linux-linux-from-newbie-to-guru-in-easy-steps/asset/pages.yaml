  md: "# # Starting and stopping jobs\n\nA running application can be suspended as\
    \ a “job” by pressing the Ctrl+Z keys. The shell responds with a job number, a\
    \ “Stopped” confirmation message, the name of the application, and the name of\
    \ the file it has open where appropriate.\n\nIn the example illustrated below,\
    \ the vi application is first opened to edit an existing file, then the job is\
    \ suspended by pressing Ctrl+Z. Next the vi pages are opened, then suspended.\
    \ Finally the text-only Lynx web browser is opened, then suspended.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_193_0.png)\n\
    \n![](img/0494b98ec9ddc4515587e9808d73902e_193_1.png)\n\n```\nShell - Konsole\n\
    Session Edit View Bookmarks Settings Help\nuser> vi simple.txt\n[1]+ Stopped vi\
    \ simple.txt\nuser> info vi\n[2]+ Stopped info vi\nuser> lynx\n[3]+ Stopped lynx\n\
    user> \n```\n\nSuspended jobs can remain suspended indefinitely without any problem.\
    \ Type “jobs” at a shell prompt to see a list of jobs, marking those which are\
    \ currently suspended as “Stopped”.\n\n```\nShell - Konsole\nSession Edit View\
    \ Bookmarks Settings Help\nuser> jobs\n[1]+ Stopped vi simple.txt\n[2] Stopped\
    \ info vi\n[3]- Stopped lynx\nuser> \n```"
  merge: -1
  pgno: 193
- img_proc: true
  md: "# cont'd\n\nTo resume a suspended job type the \"fg\" foreground command and\
    \ the job number, prefixed by a \"%%\" character, then hit Return. For instance,\
    \ the command \"fg %1\" would resume job number 1 - in this case reopens to continue\
    \ editing the simple.txt file.\n\nWhen a background job completes it is marked\
    \ as \"Done\" in the list and will not appear in ensuing jobs lists.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_194_0.png)\n\
    \n```\nShell - Konsole\nSession Edit View Bookmarks Settings Help\nThis is simple\
    \ text that is being written using the vi text editor in a Linux shell.\n\n--\
    \ INSERT -- 1,1 All\n```\n\nJobs can also be made to run in the background using\
    \ the \"bg\" command to specify their job number. In the example below the find\
    \ command is making a list of all files that a .txt extension. It gets stopped\
    \ with Ctrl+Z, then made a background job so the user can continue working with\
    \ other shell programs.\n\nThe -fprint option writes the name of each .txt file\
    \ on a separate line in a new file, called \"list\", that creates in the current\
    \ directory.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_194_1.png)\n\n```\nShell\
    \ - Konsole\nSession Edit View Bookmarks Settings Help\nroot> find / -name *.txt\
    \ -fprint txtlist\n[1+] Stopped find / -name *.txt -fprint txtlist\nroot> bg %1\n\
    [1+] find / -name *.txt -fprint txtlist &\nroot> jobs\n[1+] Running find / -name\
    \ *.txt -fprint txtlis\nroot> \n```\n\nUse the \"kill\" command to specify a job\
    \ number to be terminated. For instance, the command \"kill %3\" terminates job\
    \ number 3.\n\n15. Performing shell operations"
