- img_proc: true
  md: 'Select the File, Check Mail In menu to attempt to retrieve and download mail
    from your email account, or click the Check Mail In button on the toolbar, as
    shown below:


    ![](img/0494b98ec9ddc4515587e9808d73902e_94_0.png)


    The account folders work just like those in Outlook on Windows.


    Enter your email account password when requested and your mail appears in the
    KMail Inbox. Plain text messages are favored for security reasons and are displayed
    immediately. KMail requests you to confirm acceptance before displaying HTML mail
    and images.


    Select the Message, New Message menu to launch the Composer dialog where you can
    write a message to be sent by email. The Attach menu lets you browse your system
    to add attachments to forward along with the message. When the message is complete
    use the Message, Send Now menu, or click the Send Now button to dispatch the message
    to your outgoing mail server. Alternatively you can select the Message, Send Later
    menu, or the Message, Save in Drafts folder to store the message until later.'
