- img_proc: true
  md: '# # Evaluating expressions


    The "expr" command enables you to perform simple math calculations at the shell
    prompt. It recognizes the usual arithmetic operators but those which have other
    meanings in the shell need to be prefixed by a backslash "" escape character.
    For instance, the * asterisk is a wildcard in the shell, but the multiplication
    operator in math expressions – so must be escaped.


    The arithmetic operators are:

    "+" addition,

    "-" subtraction,

    "/" division,

    "%% modulus


    ![](img/0494b98ec9ddc4515587e9808d73902e_213_0.png)


    Each argument must be separated by whitespace, and parentheses can be used to
    establish operator precedence in longer expressions – but each parenthesis character
    must be escaped.


    The expr command can also perform boolean evaluations that return true (1) or
    false (0). In the example below it is true (1) that 7 is not equal (!= to 3:


    You can quickly launch a graphical calculator from X shell window using the "xcalc"
    command.


    ![](img/0494b98ec9ddc4515587e9808d73902e_213_1.png)


    ```

    user expr 7 + 3

    10

    user expr 7 \* 3

    21

    user expr 7 \* \(3 + 1 \)

    28

    user expr 7 !== 3

    1

    user expr length "Linux in easy steps"

    19

    user expr substr "Linux in easy steps" 7 13

    in easy steps

    user expr index "Linux in easy steps" "x"

    5

    user>

    ```


    Simple string functions such as "length" can be used with the expr command to
    discover the length of a string. The "substr" function extracts a substring of
    specified length, starting at a given position, and the "index" function gives
    the position at which a specified character first appears in the string.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'The result of an expression evaluation can be made to cause a particular output
    using an “if-then” statement. This has two separate parts that state the expression
    to be evaluated, and the text to output only when the result of the evaluation
    is true – nothing when the result is false.


    The “if” keyword begins the statement and is followed by the test expression enclosed
    within a pair of square brackets. Each part of the entire statement must be separated
    from the next by whitespace to enable the shell to evaluate the expression.


    The “then” keyword begins the second part of the statement and contains the command/s
    to execute if the test is true. This ends with the “fi” keyword, marking the end
    of the statement.


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_0.png)


    Leave a space after the “if” keyword to avoid an error. Leave a space after the
    “[]” bracket to avoid an error.


    Leave a space before the “[]” bracket to avoid an error.


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_1.png)


    The string comparison operators are “==” equality and “!=” inequality. The numeric
    comparison operators are “eq” equality, “ne” inequality, “gt” greater than, “lt”
    less than, “ge” greater or equal, and “le” less or


    Type the first part of the statement then hit Return to be prompted to enter the
    rest of the statement. Alternatively, type the entire statement separating each
    part with a semicolon. This example illustrates both and uses the “ne” numeric
    inequality operator and the “=” string equality operator to evaluate expressions:


    ![](img/0494b98ec9ddc4515587e9808d73902e_214_2.png)


    Notice how output is displayed on the two occasions when the result is false.


    | Session | Edit | View | Bookmarks | Settings | Help |


    ```

    user if [ 7 -ne 3 ]

    > then echo "true"

    > fi

    true

    user if [ 7 -ne 3 ]; then echo "true"; fi

    true

    user if [ 7 -ne 7 ]; then echo "true"; fi

    true

    user if [ string = string ]

    > then echo "correct"

    > fi

    correct

    user if [ string = rope ]

    > then echo "correct"

    > fi

    user>

    ```'
  merge: -1
