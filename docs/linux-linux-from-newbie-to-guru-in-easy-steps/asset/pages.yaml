  md: '# Understanding access permissions


    In Linux each file and directory has an “owner” – generally the user who created
    it. The owner has full permission to read, write to the file and execute the file
    (if it''s executable).


    The owner may also set permissions to specify if other users can read, write and
    execute the file. The file’s accessibility can be restricted to the owner, or
    to a “group” of which the owner is a member, or to any user of the system.


    To view the permission settings of a file in KDE right-click on it, select Properties
    from the context menu, then click the Permissions tab in the Properties dialog
    that appears:


    ![](img/0494b98ec9ddc4515587e9808d73902e_73_0.png)


    An executable file is a binary file that can be “run” – a text file is not a binary
    file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_73_1.png)


    Usually the User, Group and Others will have permission to at least Read the file.
    If you are the owner of the file the User will have permission to Write and Execute
    the file (if it’s executable).


    As the owner of the file you can use the arrow buttons to modify the permissions
    of this file then click the OK button to apply the new permission settings.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Click the Advanced Permissions button to see the full range of permissions
    that can be set by checking the boxes in the dialog:


    ![](img/0494b98ec9ddc4515587e9808d73902e_74_0.png)


    These allow Read, Write, and Execute permissions to be set by the file owner for
    the classes of User, Group, and Others, as before but there are additional Special
    permissions Set UID, Set GID, and Sticky. The Special permissions are set for
    a file or directory overall – not by a class:


    +   * When a file set with the Set UID permission is executed the resulting process
    assumes the user ID given to the User class

    * When a file set with the Set GID permission is executed the resulting process
    assumes the group ID given to the Group class. If the Set GID permission is set
    for a directory all files created within that directory inherit the group owner

    * When a file set with the Sticky permission is executed the kernel is encouraged
    to retain the process beyond its termination. If the Sticky permission is set
    for a directory users may create and modify files there, as normal, but they may
    only append to existing files of other users


    If you need to change permissions on files where you are not the owner you need
    Super User power – in KDE you can select System, File Manager - Super Mode to
    launch File Manager with suitable authority to make changes in the Permissions
    dialog of any file.'
