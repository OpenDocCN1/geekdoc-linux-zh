  md: '# Introducing the KDE taskbar


    The taskbar, or “panel” in KDE talk, appears across the bottom of the screen by
    default. It can easily be repositioned to the top or side of the screen – just
    click''drag it to your preferred location.


    The Start button is situated, as you might expect, at the extreme left of the
    taskbar, and features the KDE logo. To the right of the Start button are a number
    of Quick Launch buttons that are installed by default. Extra Quick Launch buttons
    can be added by right-clicking on the taskbar and selecting the Add to Panel option
    then choosing an item to add from one of the sub-menus. Screenshots below illustrate
    how to add the Find Files launcher to the Quick Launch panel:


    ![](img/0494b98ec9ddc4515587e9808d73902e_43_0.png)


    Quick Launch buttons can be removed in a similar way using the Remove From Panel
    option. To rearrange the position of a taskbar right-click on it select the Move
    option from the context menu – the cursor will change to indicate that you can
    drag''n''drop the button to a new location on the taskbar:


    ![](img/0494b98ec9ddc4515587e9808d73902e_43_1.png)'
  merge: -1
