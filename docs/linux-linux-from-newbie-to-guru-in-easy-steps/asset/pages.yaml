  md: '# Switching between virtual consoles


    Unix, from which Linux is derived, was introduced before graphical interfaces
    became popular. It was a text-based platform that used only a keyboard for input
    and displayed output on a simple monitor. The term "console" describes the combination
    of one input device (keyboard) and one output device (monitor).


    Linux supports the notion of "virtual consoles" that let you have several full-screen
    shell sessions active simultaneously. You can easily switch between these using
    special key combinations. This is useful when you''re working with multiple shell
    programs.


    Most Linux installations provide seven virtual consoles by default although you
    normally only see the seventh – this is the one which the X Window System is running
    the graphical desktop. The virtual consoles numbered 1 through 6 do not support
    graphics. They are, instead, configured to let you execute commands and to run
    shell programs.


    To open a specific virtual console from the graphical desktop hold down the Ctrl+Alt
    keys with one hand and press one of the F1 through F6 with your other hand – F1
    will open virtual console number 1, F2 will open virtual console number 2, and
    so on. Enter your user name and password to log in to the console. To return to
    the graphical desktop at any time press Ctrl+Alt+F7.


    Use the who command to discover of which the six text-based virtual consoles are
    being used. In the screenshot below the user is logged into consoles 1, 2 and
    3 – each could be running different shell programs, or different instances of
    the same program:


    ![](img/0494b98ec9ddc4515587e9808d73902e_173_0.png)


    To logout of a console type type "exit" then hit the Return key.


    ```

    ### Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> who

    mike tty1 2005-10-06 12:01

    mike tty2 2005-10-06 12:01

    mike tty3 2005-10-06 12:02

    mike :0 2005-10-06 12:00 (console)

    mike pts/1 2005-10-06 12:00

    user> _

    ```'
  merge: -1
