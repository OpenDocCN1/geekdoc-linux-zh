  md: '# Setting the root password


    Before you can begin using your Linux system user accounts need to be established
    to allow you to login to the system.


    Each Linux system has a system administrator account named “root” that has greater
    access privileges than regular user accounts. For security reasons system configuration
    can only be implemented by root – regular users cannot make these changes. You
    should only use the root account for such purposes and normally work in Linux
    as a regular user.


    After installing packages the Linux installer asks you to create a password for
    the root account.


    In a network environment it is essential to create a lengthy alpha-numeric password
    to ensure that the root account cannot be easily accessed.


    The home user may prefer to have a simpler password to enter when they want to
    work as root (this can arise more often than you might now imagine). Choose a
    memorable password and make a record of it. Now enter your chosen password into
    the input boxes (twice) then click on the Next button to proceed:


    > Avoid easily guessed passwords like “admin” if you want security.


    # Password for the System Administrator “root”


    Do not forget what you enter here.


    Password for root User


    ```

    ********

    ```


    Confirm Password


    ```

    ********

    ```


    Expert Options...


    2. Installing the operating system 25'
