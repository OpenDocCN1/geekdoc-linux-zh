  md: "# # Scheduling jobs\n\nLinux provides a task scheduler called the “at daemon”\
    \ that you can run a job once at a single specified future time.\n\n| at | create\
    \ a job to run once at a specified time |\n| atq | show the list of outstanding\
    \ “at” jobs |\n| atrm | remove a specified job from the “at” queue |\n| crontab\
    \ | create a job to run at a specified time |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_195_0.png)\n\
    \nSee page 208 for more about sending messages with the write command.\n\nTo use\
    \ the “at” command and\nter the “at” command and supply a run time as its argument\
    \ – you are presented with an “at> prompt. Type the command to be executed then\
    \ hit Return. Now press Ctrl+D to create the task – “<EOT>” appears and you return\
    \ to a shell prompt. You can remove a task by stating its job number to the “atrm”\
    \ command, and see a list of outstanding tasks with the “atq” command. The task\
    \ in the example below executes a write command, sending a message to a system\
    \ user at the specified:\n\nSee page 208 for more about sending messages with\
    \ the write command.\n\n```\nuser> at 4:25pm\nwarning:commands will be executed\
    \ using /bin/sh\nat> write mike\nat> Hey Mike! It's time to go.\nat> <EOT>\njob\
    \ 22 2005-10-11 16:25\nuser> \n```\n\n```\nListening on Device /dev/pts/0\n\n\
    Message from mike@linux on <no tty> at 16:25...\nHey Mike! It's time to go.\n\n\
    EOF\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_195_1.png)"
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Linux also provides a task scheduler called the “cron daemon” you can set
    to run jobs at regular intervals. This wakes up once a minute and examines your
    “crontab” configuration file then executes any jobs set to run at the current
    time.


    A crontab file contains one instruction per line, each containing fields – the
    first five fields specify the time at which the job should run and the sixth field
    contains the command to be executed. The five time fields, in order, the minute
    (0-59), the hour (0-23), the day of the month (1-31), the month of the year (1-12),
    and the day of the week (0-6) – zero is Sunday. The fields must be separated by
    a space and any field can contain a * wildcard to match any value for that field.
    For example:


    ![](img/0494b98ec9ddc4515587e9808d73902e_196_0.png)


    | | |

    |---|---|

    | | every minute |

    | 15 | 15 minutes after each hour |

    | 15 18 * | every day at 6:15PM |

    | 15 18 * | The third day of each month at 6,15PM |

    | 15 18 2 * | Every February 3 at 6.15PM |

    | 15 18 * 6 | Every Saturday at 6.15PM |


    To schedule a job you edit your crontab file using the command “crontab -e” to
    open the file in a text editor. Add the time and command to run then save the
    file and you’re all set. The crontab below runs a daily BitDefender system scan
    at 6.15PM then updates a summary in a log file within the home directory:


    ![](img/0494b98ec9ddc4515587e9808d73902e_196_1.png)'
