    Pi is worth around 3.142

    user> echo "Programming with" $CHAR

    Programming with M

    user> echo -e "\n\n\t$STR"


    Linux in easy steps

    user>|

    ```


    The ability to take input, in a variable, store it in, then output the stored
    value later, creates a very basic level of shell interaction that simply repeats
    the input value, parrot-fashion.


    More usefully, shell interaction can be enhanced by evaluating the input values
    and providing meaningful output based upon the result of the evaluation.'
