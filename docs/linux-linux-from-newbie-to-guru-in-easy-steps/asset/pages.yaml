  md: "# ...cont'd\n\nText strings may also be stored in shell variables and their\
    \ values displayed in the same way using the echo command:\n\n```\nShell - Console\n\
    Session Edit View Bookmarks Settings Help\nuser> NYC=\"Big Apple\"\n> echo $NYC\n\
    Big Apple\nuser> \n```\n\nA list of standard environment variables that store\
    \ system information can be displayed with the printenv command and their individual\
    \ values can be seen using the echo command.\n\nThe most important environment\
    \ variable is $PATH stores a list of system directories in which to seek programs\
    \ when they are requested. For instance, when you issue the clear command the\
    \ shell consults the value of $PATH and looks in each listed directory until it\
    \ finds the clear program – located in /usr/bin.\n\nTo temporarily add another\
    \ directory to the $PATH variable append it with a colon character. For example,\
    \ add the /usr/sbin directory with the command \"PATH=$PATH:/usr/sbin\".\n\nEach\
    \ user-defined variable remains available for recall in the current shell session\
    \ but can be removed with the unset command. So the command \"unset NYC\" would\
    \ remove that variable.\n\nShell variables can even be made available to other\
    \ programs launched from the current shell using the export command. This effectively\
    \ makes the shell variable into an environment variable until you logout of the\
    \ shell. For instance, use the command \"export NYC\" to create a temporary environment\
    \ variable that can be used by any program within the current shell environment.\n\
    \nTo append a directory to the PATH each time the shell is launched add the .bashrc\
    \ file used on page 148 to customize the shell prompt.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_154_0.png)"
