  md: '# Switching between sessions


    You don’t need to end one session before starting another because Linux can support
    multiple concurrent sessions. This means you can quickly switch between sessions
    that are each using a different desktop manager. To start a new session from KDE
    first select the Start, Switch User menu. Notice that the current desktop environment
    appears checked on a sub-menu that provides the user name, desktop manager, screen
    number and virtual terminal number. Click the Start New Session option and the
    login screen will appear with the current session still running.


    ![](img/0494b98ec9ddc4515587e9808d73902e_143_0.png)


    A desktop manager to use for the new session, such as the FVWM desktop manager
    used on the previous page, then log in to start the new session. This session
    will use the next available screen and virtual terminal – in this case 1, vt8.


    To switch between sessions hold down the Ctrl and Alt keys and press the F key
    with the same vt number of the session you want. To return to the KDE session
    here press Ctrl+Alt+F7.


    Now when you choose the Start, Switch User menu you can see the session details
    of both running sessions:


    ![](img/0494b98ec9ddc4515587e9808d73902e_143_1.png)


    You can switch to the FVWM session by clicking its session menu, as shown above,
    or press the Ctrl+Alt+F8 keys. Close any running session by choosing to Log Out
    then selecting the option to End Current Session.


    > HOT TIP The Lock Session menu simply launches a screensaver and requires a password
    to resume the session – the Lock Current & Start New Session menu combines the
    Lock Session and Start New Session menus.'
