  md: '# # Switching desktop managers


    In Linux the desktop manager is responsible for controlling the graphical “X”
    window environment which determines all desktop features. The KDE desktop manager
    provides one of the most popular and comprehensive desktop environments but most
    Linux distros include other desktop managers that you can try.


    To change from the KDE desktop manager select the Start, Log Out menu as if you
    were closing down the computer but choose the End Current Session option on the
    dialog:


    ![](img/0494b98ec9ddc4515587e9808d73902e_141_0.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_141_1.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'After a few moments the login screen will appear offering a Session Type menu
    from which you can choose the desktop manager you want to use when you log back
    in. KDE will be marked as the previous one used but try selecting an alternative,
    such as FVWM (F Virtual Window Manager):


    FVWM makes great use of context menus in place of the traditional taskbar – right-click
    on the desktop to see the Start menu or left-click on the desktop to see a Work
