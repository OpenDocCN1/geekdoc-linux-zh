- img_proc: true
  md: '# # What is the shell?


    At the very heart of the Linux operating system is a core series of machine instructions
    referred to as the “kernel” – this is a technical program that is not user-friendly,
    mainly designed to communicate with electronic components. A Linux shell is a
    facility that allows the user to communicate directly with the kernel in a human
    readable form. It translates command line instructions so they can be processed.


    Many Linux distros include several shells that offer different features. The default
    Linux shell program, however, is the Bourne Again Shell (BASH), which is an updated
    version of the original Bourne Shell found in the Unix operating system.


    ![](img/0494b98ec9ddc4515587e9808d73902e_145_0.png)


    Options are not standardized–the same option can have different meanings to different
    commands.


    The shell understands a large number of commands and has a number of “options”
    that modify their behavior – usually these are prefixed by a hyphen. Many also
    accept “arguments” that provide data to be used by the command. The typical syntax
    of a shell command looks like this:


    ```

    command -option argument

    ```


    Shell commands can be executed at a prompt in text interface mode or in a shell
    terminal window, such as the KDE Konsole application on a Linux graphical desktop
    interface. In SUSE Linux select the Start, System, Terminal menu to launch Konsole,
    or Start, Run Command “konsole”.


    ![](img/0494b98ec9ddc4515587e9808d73902e_145_1.png)'
  merge: -1
  pgno: 145
- img_proc: true
  md: "# ...cont'd\n\nWhen the shell window is launched it displays the default bash\
    \ command prompt and places the cursor after the prompt, ready to receive a command.\
    \ The default prompt comprises the current user name and host domain name, separated\
    \ by an \"@\" character.\n\n| | |\n|---|---|\n| whoami | show the current effective\
    \ user name |\n| hostname | show the host domain name |\n| type | state program\
    \ location or builtin command |\n| clear | clear the shell window |\n| exit |\
    \ logout of the shell |\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_0.png)\n\
    \nCommands use lower case only - in upper case the command will not be recognized.\n\
    \nYou can confirm the current user and domain name at any time with the whoami\
    \ and hostname commands – just type the command at a shell prompt and hit the\
    \ Return key.\n\nSome commands call upon individual programs that reside on your\
    \ system whereas other commands are built into the shell itself – these are known\
    \ as \"shell builtin\" commands. You can determine whether or not a command is\
    \ a builtin with the type command. If that command calls upon a program the result\
    \ will reveal its location on your system. The example below reveals that the\
    \ exit command, used to logout of the shell, is a builtin but the clear command\
    \ calls upon a program in the /usr/bin directory:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_146_1.png)\n\
    \nType a -help option after any command, then hit Return, to see a list of options\
    \ for that command.\n\n```\nSession Edit View Bookmarks Settings Help\nmike@linux:->\
    \ whoami\nmike\nmike@linux:-> hostname\nlinux\nmike@linux:-> type exit\nexit is\
    \ a shell builtin\nmike@linux:-> type clear\nclear is hashed (/usr/bin/clear)\n\
    mike@linux:-> \n```"
  merge: -1
  pgno: 146
- img_proc: true
  md: "# Becoming the Super User\n\nA regular user can call upon many shell commands\
    \ but some are only available to the privileged root user. These restricted commands\
    \ typically perform system administration functions to which regular users should\
    \ not be allowed access in a multiuser environment. On a home Linux system, however,\
    \ you can easily assume super user status – providing you the root password.\n\
    \n| su - | login as the root super user |\n| logname | print the user login name\
    \ |\n| pwd | show the current directory address |\n\nAt a regular shell user prompt\
    \ type the su command, followed by a space, then the -l option. Hit the Return\
    \ key and the shell will request the root password. Enter the root password when\
    \ you installing your Linux system. A new prompt will then appear that unlike\
    \ that of the regular user to denote that you now have super user status. You\
    \ can also use the whoami command at any time to determine whether you are working\
    \ as a regular user or as the root super user. Remember that the whoami command\
    \ shows the current user – you can use the log command to reveal the name of the\
    \ user who originally logged into that shell session. Use the exit command to\
    \ log out from the super user shell back into the regular user shell:\n\n![](img/0494b98ec9ddc4515587e9808d73902e_147_0.png)\n\
    \nFrom a root prompt you can access any file or program on your system - with\
    \ potential to wreak havoc!\n\n![](img/0494b98ec9ddc4515587e9808d73902e_147_1.png)\n\
    \nNotice how the semicolon is used here to execute multiple commands at once –\
    \ the results appear in sequence on separate lines.\n\n```\nmike@linux:~ - Shell\
    \ - Konsole\nSession Edit View Bookmarks Settings Help\nmike@linux:~> su -l\n\
    Password: ****\nlinux:~ # whoami;logname\nroot\nmike\nlinux:~ # # exit\nlogout\n\
    mike@linux:~> whoami\nmike\nmike@linux:~> \n```"
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Besides knowing your working identity in the shell it is also useful to know
    your current location on the system. Type the pwd command at any time to print
    the (current) working directory.


    When a regular user first logs into the shell the working directory is, by default,
    that user''s home directory. However, when a super user first logs into the shell,
    using the su -l command, the working directory is, by default, the root user''s
    home directory:


    ![](img/0494b98ec9ddc4515587e9808d73902e_148_0.png)


    ```

    mike@linux:~ - Shell - Konsole

    Session Edit View Bookmarks Settings Help

    mike@linux:~ whoami;pwd

    mike

    /home/mike

    mike@linux:~ su -l

    Password: *****

    linux:~ # whoami;pwd

    root

    /root

    linux:~ # ██

    ```


    The su command without the -l option maintains the location in the existing working
    directory – it does not change the root user''s home directory and, more importantly,
    it does not set the search path to utilize the full root path. This is almost
    always undesirable when you want to assume root super user status so to be sure
    to always use the -l option with the su command.


    The su (switch user) command enables you to log in as any user – providing you
    know their password. At the prompt type “su” followed by a space, a hyphen and
    another space, type the user''s name. You are then asked to enter their password
    to login. Similarly, this method can be used to login as the super user by switching
    to the root user account.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# # Customizing the shell prompt


    Whenever a user logs into a shell Linux looks for a hidden configuration file
    called .bashrc which is located in user’s home directory. This file determines
    the behavior of the shell and may be edited to customize the shell to your preference.
    It is especially useful to edit this file to customize the appearance of the shell
    prompt to a style and color of your liking.


    To find this file with Konqueror navigate to your home directory then select the
    View, Show Hidden Files. Now open the .bashrc file with any text editor, such
    as KWrite, to edit its contents. At the bottom of the file add this code:


    ```

    if [ "basename $SHELL" = "bash" ];

    then  export PS1="\e[34m]user> \e[0m"

    fi

    ```


    The code first checks that the shell is indeed the bash shell then attempts to
    export new configuration settings for the shell prompt (PS1). Back slashes are
    needed to escape some of the characters from recognition. The ANSI color value
    34 writes the prompt “user>” in blue and the value 0 writes everything else in
    the default shell window text color – typically black.


    Save the file to apply the changes then open a shell window to reveal the new
    user prompt style and color:


    ![](img/0494b98ec9ddc4515587e9808d73902e_149_0.png)


    The first line uses the tick character (’) – not an apostrophe. This can be found
    on the keyboard above Tab key.


    ANSI is an acronym for the American National Institute – see www.ansi.org.


    ![](img/0494b98ec9ddc4515587e9808d73902e_149_1.png)


    ![](img/0494b98ec9ddc4515587e9808d73902e_149_2.png)'
  merge: -1
  pgno: 149
- img_proc: true
  md: "# cont'd\n\nThe root user prompt can also be customized to your preference\
    \ to be distinct from the regular user prompt by editing, or creating a new, hidden\
    \ \".bashrc\" file in the root user's home directory. This location is inaccessible\
    \ to a regular user so first use the su -l command in the shell to assume super\
    \ user status.\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_0.png)\n\nUse the\
    \ F8 key to toggle the visibility of hidden files in the KWrite Open dialog. Now\
    \ type \"kwrite\" at the prompt and hit Return to launch the KWrite text editor\
    \ with root access privileges. This allows you to navigate to the /root directory\
    \ and open, or create, a .bashrc file. At the bottom of the file add this code:\n\
    \n```\nif [ \"basename $SHELL\" = \"bash\" ]\nthen\n    export PS1=\"\\e[31m]\
    \ root>\\e[0m\"\nfi\n```\n\n![](img/0494b98ec9ddc4515587e9808d73902e_150_1.png)\n\
    \nRemember the period at the start of the file - the file must be named \".bashrc\"\
    \ exactly. This is similar to the code applied for the user prompt but here the\
    \ ANSI color value writes \"root>\" in red. Save the file to apply the changes\
    \ then open a shell window to reveal the new root prompt style and color:\n\n\
    ![](img/0494b98ec9ddc4515587e9808d73902e_150_2.png)\n\nPossible ANSI color values\
    \ are black(30), red(31), green(32), yellow(33), blue(34), magenta(35), cyan(36)\
    \ and white(37)."
  merge: -1
