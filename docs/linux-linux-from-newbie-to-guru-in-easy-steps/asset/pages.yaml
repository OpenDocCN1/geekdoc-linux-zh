- img_proc: true
  md: '# Inputting and outputting values


    The introduction to the Linux shell demonstrated how to create variables and assign
    values to them. Remember that whitespace is not permitted in the assignment because
    that would truncate the expression – as a line break. This is because the shell
    evaluates complete keywords, separated by whitespace, and is why there must be
    space between a command and its arguments.


    Strictly speaking, all variable values are stored as strings but the shell will
    intelligently treat them as numeric when appropriate.


    Any variable value can be displayed by the echo command which, by default, adds
    a newline after the output so the prompt reappears on the next line. The newline
    can be suppressed by adding a "-n" option if desired. Another useful option for
    the echo command is the "-e" option that allows you to specify begin with simple
    formatting using "escape" sequences. The most frequently used escape sequences
    are \n (add a newline) and \t (add a tab) – both used in the screenshot below
    demonstrating the echo command options:


    ![](img/0494b98ec9ddc4515587e9808d73902e_211_0.png)


    See page 152 for an introduction to shell variables.


    Notice that the escape sequences are included inside the quotes – not outside.


    ![](img/0494b98ec9ddc4515587e9808d73902e_211_1.png)


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> INT=7

    user> PI=3.14159265

    user> CHAR=C

    user> STR="Hello World"

    user> echo "Stored integer is" $INT

    Stored integer is 7

    user> echo "Pi is worth around" $PI

    Pi is worth around 3.14159265

    user> echo "Programming with" $CHAR

    Programming with C

    user> echo -n $STR

    Hello Worlduser echo -e "\n\n\t$STR"


    Hello World

    user>

    ```


    210 Linux in easy steps'
