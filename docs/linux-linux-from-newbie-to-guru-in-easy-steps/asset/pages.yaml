- img_proc: true
  md: 'The taskbar is highly customizable and has a special facility for this very
    purpose. Right-click on the taskbar and choose the Configure Panel option from
    the context menu to open the Settings dialog:


    ![](img/0494b98ec9ddc4515587e9808d73902e_44_0.png)


    A great Hiding option adds Panel-Hiding buttons to the taskbar so it can be hidden
    by a single click – the animation effect is like retracting a steel tape measure.


    ![](img/0494b98ec9ddc4515587e9808d73902e_44_1.png)


    The Layout settings allow you to choose the position, height and length of the
    taskbar under its Arrangement tab. Options under the Hiding tab let you decide
    when the taskbar should be hidden to reveal more desktop working area. Which applications
    to include on the Start menu can be edited under the Menus tab.


    The Appearance settings configure buttons on the taskbar so they may display tooltips
