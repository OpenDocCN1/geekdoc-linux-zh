  md: '# Working with arrays


    You can create variables in the shell that store multiple values as "array". These
    variable arrays store each value in a unique individual indexed compartment called
    "element".


    ![](img/0494b98ec9ddc4515587e9808d73902e_223_0.png)


    Create an array by assigning a space separated list of values, within a pair of
    regular parentheses "()", to a variable name of your choice. Values may be either
    numeric, text, or a mixture of both.


    In order to access the values stored in array elements you must dereference them,
    using a pair of curly braces "{}\ to surround the variable name and index. You
    can also use the wildcard *, in place of a number, to access all elements:


    ```

    Shell - Konsole

    session Edit View Bookmarks Settings Help

    user> ARR=(a two 3)

    user> ARR[2]=6

    user> echo ${ARR[*]}

    a two 6

    user> echo ${ARR[0]}

    a

    ```


    ![](img/0494b98ec9ddc4515587e9808d73902e_223_1.png)


    This is shown to good effect in the script opposite which combines several aspects
    from this chapter – random number generation, expression evaluation, outputting
    values, loops, and arrays. It begins by seeding the random number generator then
    creates a sequential array of integers 0–49. Next, generated random numbers, in
    the range 1–49, are used to shuffle the element values. This means that the array
    contains all numbers 1–49, in a random order, without repeating any number. Values
    from elements 1–6 are used in stylized output:'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_224_0.png)


    This advanced script runs like a program. You can create your own compiled programs
    in the C language, like those the C Compiler – ''gcc'' to see if it is already
    installed, or install it from your distros.


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    !/bin/bash

    clear ; RANDOM=`date +%s`      #seed

    #fill an array with values 0–49

    i=0; while [ $i -lt 50 ];

    do nums[$i]=$i; i=$expr $i + 1; ; done

    #randomize element positions

    i=1; while [ $i -lt 50 ];

    do let r=$((RANDOM % 49 + 1)); temp=${nums[$i]}

    nums[$i]=${nums[$r]}; nums[$r]=$temp

    echo -expr $i + 1` ; done

    #display fg & bg colored header

    echo -e "e[41;38m" echo -e "e[1;33m"

    echo -e "Your 6 lucky LOTTO numbers are: "

    echo -ne "e[44;38m"

    #display the values in elements 1-6

    i=1 ; while [ $i -lt 7 ];

    do echo -ne "${nums[$i]}"

    echo -expr $i + 1` ; done

    echo -e "e[44;0m\n\n"      #reset bg

    ```


    ```

    Shell - Konsole

