  md: '# # Sending network messages


    | mesg | permit or deny terminal messaging |

    | write | send text messages to other users |


    ![](img/0494b98ec9ddc4515587e9808d73902e_209_0.png)


    Use the "mesg" command alone to see if messages are currently permitted.


    The "mesg" command controls whether messages can reach your shell terminal. Type
    the command "mesg y" and press the Return key to permit messages – or deny messages
    with "mesg n". To send a message to another logged user in the system use the
    "write" command with the user name as its argument. When you issue a write command
    the shell will enter write mode so you can type your message. When it''s complete
    press Ctrl+D to send it to the user:


    ![](img/0494b98ec9ddc4515587e9808d73902e_209_1.png)


    You can use the "who" command to see a list of all logged users


