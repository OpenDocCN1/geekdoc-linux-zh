  md: '# # Recording a voice message


    SUSE Linux includes a fun voice recording application called KRecord. It''s similar
    to the Sound Recorder application found in Windows but with a couple of extra
    features.


    Under the Options menu you can choose the Sample Rate and an Input Level monitor
    to see how your voice sound wave looks:


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_0.png)


    KRecord records your voice in a memory buffer - it only creates a file when you
    save the buffer. So you can try over and over until you like the result and then
    save that as a file.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_1.png)


    You could send a very brief voice message as an email attachment but WAV files
    can quickly become huge - adjust the sample rate to a low level to reduce the
    WAV file size.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_2.png)


    To record a voice message plug in a mirophone then click the red “record” button
    and speak your message into the microphone. When you are finished click the “stop”
    button, just to the right of the record button. Click the “play” button, as shown
    above to hear your message played back through your speakers.


    If you want to see the input level as you select the Options, Input Level menu
    dialog then click the “M” (monitor) toolbar icon to switch it on. Experiment with
    the options to achieve the optimum result then save your voice message in WAV
    format.


    ![](img/0494b98ec9ddc4515587e9808d73902e_131_3.png)'
