  md: '# Introducing Linux


    Welcome to the exciting world of Linux – a free open-source operating system that
    includes numerous free applications. This chapter describes the evolution of Linux
    and explains how you can obtain your own copy. It also illustrates how to prepare
    a computer so that Linux can be installed.


    # Covers


    +   What is Linux? | 8


    +   Choosing a Linux distro | 10


    +   Evaluating hardware suitability | 12


    +   Making space for Linux | 14


    +   Preparing to install Linux | 16'
