  md: '...cont''d


    The "telnet" command launches the telnet program and the prompt changes to let
    you know that you are using the telnet console. Supply a hostname, or its IP address,
    to the "open" telnet command then enter a valid login name when requested to connect
    to that system. Typically the remote computer will be using a Unix-based operating
    system, like Linux, so will recognize bash shell commands for navigation – cd,
    ls, pwd, etc..


    Logging out from the remote computer can involve some guesswork as it depends
    on logoff command it uses – try "quit", "end", "close", "stop", "logout", and
    "logoff".


    | telnet | open the telnet console program |

    | ssh | securely connect to a remote computer |


    Telnet is quite an old program and unfortunately the data transmitted by telnet
    is only sent in plain text format – so is easy for others to steal passwords and
    information. A more secure alternative is provided by the "ssh" shell command.


    ![](img/0494b98ec9ddc4515587e9808d73902e_202_0.png)


    Where possible use ssh rather than telnet for better security.


    The ssh command encrypts all data that travels across the network including your
    user name and the password you will need to connect to the remote computer. It
    can also make sophisticated secure logins using public keys for user authentication.
    A simple password authenticated login looks like the example below:


    ```

    Shell - Konsole

    Session Edit View Bookmarks Settings Help

    user> ssh mike@example.com

    mike@example.com''s password: ******

    Last login: Sun Oct 9 14:10:00 2005

    Your Operating System is Linux

    Welcome to... the example domain

    Checking your file quota... OK

    mike@example.com->

    ```'
