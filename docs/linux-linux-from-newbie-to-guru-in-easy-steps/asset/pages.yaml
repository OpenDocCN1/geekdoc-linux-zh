  md: '# Reading RSS feeds


    You can stay up to date with many web sites by subscribing to their RSS (Real
    Simple Syndication) feeds. These use XML technology to send out the latest headlines
    whenever they get updated – to view these headlines you need a “aggregator”.


    In Linux, the Firefox web browser incorporates a simple news aggregator that displays
    a small orange icon in the bottom right hand corner of the Firefox window when
    the site has an RSS feed. Hover your mouse pointer over this icon and a tooltip
    will appear offering to “Add Live Bookmark for this page’s feed":


    ![](img/0494b98ec9ddc4515587e9808d73902e_95_0.png)


    Click the orange RSS icon and a popup window will offer to subscribe to the feed
    from this website. Accepting the subscription offer causes Firefox to open its
    “Add Bookmark” dialog where you can name the bookmark and choose where it should
    be stored:


    ![](img/0494b98ec9ddc4515587e9808d73902e_95_1.png)


    Opening a bookmark to an RSS feed displays a list of the latest headlines from
    that website – you can select a headline of interest to read the full story in
    your browser window.


    Firefox is great for tracking a small number of RSS feeds but controlling larger
    numbers is best done with a dedicated news aggregator such as the KDE Akregator
    application.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'In SUSE Linux launch Akregator with the Start, Internet, RSS Reader or Run
