  md: 'The "case-in" statement provides another way to perform conditional branching
    as an alternative to "if-then-else" statements. It matches a single value to a
    branch and executes its command/s. The supplied value is specified after the "case"
    keyword, then the "in" keyword begins a list of branches. Each branch specifies
    a possible value to match followed by a \)\ parenthesis, the code to execute,
    and a ";" terminator. Finally, the "esac" keyword marks the end of the entire
    case statement.


    Often a case statement will be used to evaluate the value stored in a variable,
    typically input from a user, and provide many branches. It is used in exactly
    this way in the script below:


    ![](img/0494b98ec9ddc4515587e9808d73902e_217_0.png)


    ```

    #!/bin/bash

    clear

    echo "Font Color Menu"

    echo "=================="

    echo -en "[1] Red\n[2] Green\n[3] Brown\n"

    echo -en "[4] Blue\n[5] Purple\n[6] Cyan\n"

    echo -n "[X] Exit or make a selection: "nread CHOICE

    case $CHOICE in

    1) echo -e\e[033;31m"

    2) echo -e "\e[033;32m"

    3) echo -e "\e[033;33m"

    4) echo -e "\e[033;34m"

    5) echo -e "\e[033;35m"

    6) echo -e "\e[033;36m"

    x) echo -e "\e[033;37m"

    esac

    if [ $CHOICE != "x" ]

    then echo -e "Thank you for choosing $CHOICE\n"

    fi

    ```


    These color specifiers are like those used on page 148 to customize the


    shell prompt.


