- img_proc: true
  md: '# The Linux directory tree


    When moving from Windows, the new Linux user needs to be aware of some differences
    between the two operating systems:


    +   - Linux is case-sensitive – Windows is not. For instance, a file named “readme.txt”
    and “README.txt” are seen as two different files in Linux, but there is no distinction
    in Windows


    +   - Linux directories and files have ownership permissions that can restrict
    accessibility to the owner or group – Windows directories and files are generally
    universally accessible


    +   - Linux was developed from the outset as a multi-user network operating system
    – Windows evolved from DOS as a single-user operating system intended for home
    use


    +   - Linux users cannot change system settings, only the “root” Super User may
    do so – Windows desktop users have free reign


    +   - Linux partitions are created using the Ext3 file system – Windows partitions
    use FAT, FAT32 or NTFS file systems


    +   - Linux path names contain forward slash characters – Windows path names contain
    back slash characters. For instance, a Linux path /usr/bin and a Windows path
    C:\bin


    +   - Linux does not have drive letters – Windows typically uses A: for the floppy
    drive, C: for the hard disk drive, D: for the CD drive, and so on.


    The lack of drive letters in Linux indicates what is, probably, the biggest difference
    between Linux and Windows – the way their directory structures are arranged. In
    Linux everything is contained within a single unified hierarchical system – beginning
    with the “root” directory, symbolized by a single forward slash/


    The Linux installation creates a number of standard sub-directories within the
    root directory. Each one of these, in turn, houses its own sub-directory structure,
    creating a directory “tree” – the “root” directory is the root of the tree, as
    shown opposite.


    Contents of peripheral drives appear in the tree in the directory at which they
    are “mounted” by Linux, creating a unified structure.


    ![](img/0494b98ec9ddc4515587e9808d73902e_55_0.png)


    See page 72 for more details on access permissions.'
  merge: -1
