  md: '# Using filters


    Like Photoshop, the GIMP includes a large number of filters that can be used to
    apply effects to an image. These are accessed by choosing sub-menus of the Filters
    option on the right-click context menu. The GIMP filters are grouped into the
    following categories:


    # Animation


    An Animation Player that displays layers as sequential frames and lets you easily
    create animations in the GIF file format. It also provides optimization to keep
    those animations compact.


    # Artistic


    Filters to create instant artistic effects, such as cubist paintings and mosaic
    patterns. These can be applied to the entire image or just to a selected area
    to add a special effect.


    ![](img/0494b98ec9ddc4515587e9808d73902e_113_0.png)


    Add a number of different colored rectangles to a white background then use the


    Artistic. Cubism filter to create on instant masterpiece.


    # Blur


    Many types of blur filters which are useful to soften part of an image. For instance,
    to soften a shadow''s edge – real shadows seldom have hard sharp edges so it''s
    a good idea to depict them with blurred edges using a suitable blur filter. Additionally,
    blur filters are useful to disguise skin imperfections and wrinkles in portrait
    images.


    # Colors


    A range of filters that let you manipulate the Red, Green, Blue (RGB) and Hue,
    Saturation, Value (HSV) properties of an image or a selected area.


    # Distorts


    Filters that create special surface effects, such as ripples on water, wind effects,
    waves, whirl and pinch. These filters are especially useful to create textures.


    # Edge-Detect


    Filters that allow you to find the edges of an object as defined by its color
    boundary. These can be useful to make the selection of an area easy with the Fuzzy
    Select tool, or to simplify a color fill using the Paint Bucket tool.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Enhance


    Useful filters to clean up an image or selection – these let you despeckle deinterlace
    and destripe. This category also contains a sharpen filter that is especially
    useful to make photo images crisp.


    # Generic


    Includes mathematical filters that use a Convolution Matrix for image manipulation
    – this can perform various manipulations but some math knowledge is required to
    use its possibilities to the full.


    # Glass Effects


    These filters do not create the appearance of various glass surfaces, as you might
    expect, but rather are useful to create different kinds of lens or curved mirror
    shapes.


    # Light Effects


    A range of filters that you can use to add shine, lustre and lighting flare to
    are a wide variety of lighting effects that can be achieved with these filters
    if you are used to Photoshop’s excellent Lighting Effects dialog you may find
    these less intuitive to apply.


    # Map


    Includes a number of filters that create interesting effects by displacement or
    distortion relative to an image map.


    # Noise


    Filters add speckles to an image or selection. These are useful to represent monitor
    noise or film graininess.


    # Render


    Spectacular effects can be added to images or objects with the filters in this
    category. These include natural effects, such as clouds and flames, together with
    pattern effects such as mosaics, grids and jigsaw puzzle.


    ![](img/0494b98ec9ddc4515587e9808d73902e_114_0.png)


    Do the time to read the Tip of the Day each time you launch the GIMP – there are
    handy gems in there.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Running scripts


    The GIMP provides support for scripts that can be used to perform a number of
    set actions on an image. A wide range of custom scripts are included with the
    GIMP installation – these are written by GIMP enthusiasts and offer some great
    effects.


    Ready-made scripts can be found on the Script-Fu menu located under the Xtns menu
    in the GIMP toolbox window. There are further scripts available from the Script-Fu
    option on the right-click context menu in the image window.


    Scripts are useful to perform a series of repetitive actions to create an object
    within an image. For instance, you could create a 3-dimensional sphere object,
    by filling a circle with an appropriate gradient fill, then create a blurred shadow
    on a lower layer to give the impression of a ball sitting on a flat surface. The
    GIMP has a script to execute all the operations needed to create this object easily
    – in the toolbox Xtns menu click on the Script-Fu, Misc, Sphere option.


    ![](img/0494b98ec9ddc4515587e9808d73902e_115_0.png)


    The script items on the context menu are not the same as those under the Xtns
    menu. Generally those on the context menu operate on the current existing image
    window – the others create an object in a new window.


    ![](img/0494b98ec9ddc4515587e9808d73902e_115_1.png)


    Many scripts initially display a dialog box where you can specify parameters for
    text, font, size, background and foreground color, and so on. The Sphere script
    launches a dialog where you can specify the size of the sphere, the direction
    of the light source, whether to include a shadow, and individual colors for the
    sphere and the background area.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# ...cont''d


    ![](img/0494b98ec9ddc4515587e9808d73902e_116_0.png)


    Push the Help button to see a description of the script together with author and
    copyright details.


    When you are happy with your choices click on the OK button to run the script.
    In this case the sphere object is created in a new image window and with the features
    you specified.


    ![](img/0494b98ec9ddc4515587e9808d73902e_116_1.png)


    Further free scripts can be downloaded from the Internet and added to the GIMP
    to provide even more functionality – try searching for “Script-Fu” or visit www.gimp.org.


    Copy additional scripts to the GIMP scripts folder. Typically this is a hidden
    folder located in your home directory named as .gimp-2.2/scripts – the new script
    should now be available from one of the Script-Fu menus in the GIMP.


