- img_proc: true
  md: '# Operating with directories


    It''s sometimes useful to be able to extract the name of a file, program, or directory,
    from the end of a path address. The basename command was used for this purpose
    in the script on page 148 to extract the name of the shell program from the full
    path address stored in the $SHELL environment variable.


    | basename | show only the final part of a directory path |

    | dirname | show the path with the final part removed |

    | mkdir | make a new directory if not already existing |

    | rmdir | remove an empty directory |

    | rm -ri | remove a non-empty directory and its contents |


    Both basename and dirname commands simply manipulate the path string - they do
    not execute any action.


    Conversely, you can use the dirname command to remove the final part from a path
    address – leaving just the path to its parent. To create a new directory use the
    mkdir command and supply a directory name of your choice as an argument then the
    Return key. The shell will create the new directory within the current working
    directory. Alternatively supply a full directory path as the argument to the mkdir
    command to create the directory there.


    ![](img/0494b98ec9ddc4515587e9808d73902e_159_0.png)


    ```

    Shell - Konsole

    Session Edit View Settings Help

    user> echo $SHELL

    /bin/bash

    user> basename $SHELL;dirname $SHELL

    bash

    /bin

    user> pwm ; ls

    /home/mike/Folder Sub1

    user> mkdir /home/mike/Folder/Sub2

    user> pwd ; ls

    /home/mike/Folder

    Sub1 Sub2

    user> |

    ```


    158 Linux in easy steps'
  merge: -1
  pgno: 159
