  md: '# ...cont''d


    There are a number of special key combinations listed in the man pages that let
    you navigate to different locations in the text but most recent Linux distros
    use the enhanced vim version that let you use the arrow keys on your keyboard
    for this purpose.


    When you have completed text input and want to save it as a file hit the Esc key
    to exit "insert mode", and go to "command mode".


    Type a ":" colon to begin a command – a colon character appears at the bottom
    left corner of the vi editor. Now type a lowercase "w" (for "write") followed
    by a space and a chosen name for the text file. Hit the Return key to write the
    file in your home directory. Type ":" then hit Return to close vi and return to
    a shell prompt.


    You can launch vi and open a file for editing in one single action – by typing
    "vi" at a prompt, followed by a space and file name.


