  md: '# ...cont''d


    Simple text transformations can easily be made by piping a text stream to the
    "tr" command. This requires two arguments to specify what to change, and how it
    should be changed. For instance, the command tee "*" would change occurrences
    of the letter "a", replacing each one with an asterisk. Typically it is used to
    transform capitalization as seen in the example:


    ![](img/0494b98ec9ddc4515587e9808d73902e_176_0.png)


    The who command reveals who is logged in to the system. A large multiuser Linux
    system finding out if a particular user is logged in is much easier if the results
    of the command are alphabetical.


    | Session | Edit | View | Bookmarks | Settings | Help |

    |---|---|---|---|---||

    | user> cat quote0.txt | | | | |

    | I can resist everything except temptation. | | | | | |

    | user> cat quote0.txt | tr "a-z" "A-Z" | | | | |

    | I CAN RESIST EVERYTHING EXCEPT TEMPTATION. | | | | | |

    | user> sort lists.txt | | | | | |

    | Sand Trend | | | | | |

    | Sea Today | | | | | |

    | Sun Tough | | | | | |

    | user> | tee unsorted.who | sort | | | |

    | andrew tty2 | 2005-10-06 13:39 | | | | |

    | david tty3 | 2005-10-06 13:39 | | | | |

    | linda tty1 | 2005-10-06 13:37 | | | | |

    | mike :0 | 2005-10-06 12:00 (console) | | | | |

    | mike pts/1 | 2005-10-06 12:00 | | | | |

    | mike pts/2 | 2005-10-06 13:11 | | | | |

    | user> | | | | | |


    The "sort" command displays lines of text sorted alphabetically by default. It
    can also be used to order lines numerically if a "n" option is used. It is used
    in the example above to alphabetically sort the columns shown previously on the
    opposite page.


    The "tee" command is often used in a pipeline that ends with a sort instruction
    to write the text stream as a file before it gets rearranged. The file name is
    specified by the tee command (in this case it''s called "unsorted.who") and is
    created in the current directory.


