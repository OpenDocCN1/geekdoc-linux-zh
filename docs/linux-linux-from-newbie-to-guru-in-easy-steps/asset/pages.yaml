  md: '# Voice calling over the internet application


    Many Linux distros now include the KPhone that lets you make telephone calls over
    the internet using VoIP (Voice over IP) technology.


    Before you can use KPhone you will need to open an account with an open network
    service provider such Free World Dialup (www.freeworlddialup.com) – at the time
    of writing this is free. Once you have opened an FWD account you will receive
    your personal FWD phone number and you''re ready to configure KPhone.


    In SUSE Linux launch KPhone with the Start, Internet, Telephone menu then choose
    “A SIP phone for KDE”, or Run the kphone command. Next click the File, Identity
    menu to open the configuration dialog and your FWD account details:


    ![](img/0494b98ec9ddc4515587e9808d73902e_97_0.png)


    | kphone <2> |

    | Full Name: |

    | Mike McGrath |

    | User Part of SIP URL: |

    | <your FWD phone number> |

    | Host Part of SIP URL: |

    | fwd.pulver.com |

    | Outbound Proxy (optional): |

    | Authentication Username (optional): |

    | <your FWD phone number> |

    | q-value between 0.0-1.0 (optional): |

    | X Auto Register |

    | Registration : not registered |

    | Register help... OK Cancel |


    Check the text box to Auto Register then click the OK button to complete the Identity
    configuration.'
