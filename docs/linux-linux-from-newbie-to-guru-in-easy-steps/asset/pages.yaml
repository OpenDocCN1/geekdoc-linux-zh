  md: '# File system dos and don''ts


    When organizing your files and directories in Linux it is advisable to adopt the
    recommendations listed below. These conform to accepted standards of practice
    and make working in Linux easier:


    +   Never place files directly in the root directory ("/") and never create directories
    there – the top-level root directory should only contain the standard Linux subdirectories.


    +   Always use your personal home directory to store all your data files – for
    instance, the /home/mike directory. Create as many sub-directories as your home
    directory but do not store data files elsewhere.


    ![](img/0494b98ec9ddc4515587e9808d73902e_65_0.png)


    +   Use only lowercase when naming any data files you create this prevents any
    future hassle with capitalization errors. For instance, you won''t have to remember
    if you named a file "Mydata","MYDATA" or "MyData" – it will always be "mydata".


    +   When naming files avoiding any spaces in the name. Linux can easily cope with
    these in graphical mode but it can create a problem in text mode – you will have
    to remember to prefix each space in the name with a "\" backslash character when
    referencing that file from the command line. It is much easier to simply avoid
    spaces.


    ![](img/0494b98ec9ddc4515587e9808d73902e_65_1.png)


    +   Only use the root Super User account whenever it is absolutely necessary.
    If you are logged in root remember that you have absolute power – and, and therefore,
    the ability to wreak havoc. Get into the habit of working from a root user account.


    64 Linux in easy steps'
