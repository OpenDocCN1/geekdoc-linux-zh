  \n```\ncat /usr/share/exploitdb/exploits/linux/local/46676.php\n```\n\n![](img/Figure-8.5.jpg)\n\
  \n**图 8.5：** 46676.php 内容\n\nApache 漏洞 `46676.php` 的内容表明它利用了一个 CVE 标识为 2019-0211\
