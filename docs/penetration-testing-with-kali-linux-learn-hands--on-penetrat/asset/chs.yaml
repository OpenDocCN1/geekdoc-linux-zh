  \n# 结论\n\n现在你已经已经在实验室环境中安装了 Kali linux 和目标机器，并对 Kali linux 命令行界面有了基本的了解。我们准备好进入下一章，在下一章中介绍渗透测试规划和执行中涉及的概念。\n\
  \n## 问题\n\n1. 使用哪个命令在 Kali linux 中更新包数据库？\n2. Kali linux 中用于搜索文件的命令有哪些？请解释它们之间的区别。\n\
  3. 什么是命令替换（command substitution），它为什么有用？\n5. 在链接多个命令时，在什么情况下你会选择运算符 `&&` 而不是 `;`？\n\
  5. 为什么在编程中使用循环？\n\n# 第 4 章：理解 PT 过程和阶段\n\n在执行渗透测试时，遵循标准流程和适当阶段至关重要。这些流程和阶段也可以根据组织自身的经验和需求进行定制。俗话说，如果不妥善遵循流程并做好记录，过程就是不。安全评估领域也是如此。在本章中，我们将讨论以下几点：\n\
  \n* 遵循标准行业流程的重要性是什么？\n* 为你的活动确定最佳渗透测试（PT）方法。\n* 从组织的角度评估哪些流程适用，基本上哪个流程更合理。\n* 渗透测试的不同阶段有哪些，每个阶段的性是什么？\n\
  \n## 结构\n\n本章的重点将解释一种渗透测试框架，该框架适用于大多数中大型企业以及具有内部团队的小型组织，同时也适用于帮助没有内部测试团队的组织进行测试的独立安全测试员。\n\
  \n* 结构化渗透测试的重要性\n* 渗透测试框架\n\n## 目标\n\n读完本章后，你将能够：\n\n* 理解结构化渗透测试的重要性。\n* 理解各个阶段及其涉及的活动。\n\
  \n## 结构化渗透测试的重要性\n\n到目前为止学到的是渗透测试包含了一系列过程和技术。其中许多可以是手动操作、脚本化和/或自动化，甚至是所有这些技术的结合。执行这些操作是为了执行与攻击者对组织数字基础设施、数据和其他\
  \ IT 资产的操作非常相似的任务，旨在测试安全弱性。这些攻击可以作为内部人员或完全外部人员发起，就像真实的攻击场景一样。\n\n尽管渗透测试看起来是一个相当简单且直接的过程，但在实践中，必须遵循非常结构化且以流程为导向的方法。渗透测试本质上具有很强的技术性，很多时候输出是非常复杂的，测试人员必须利用自己的知识和技能来解析并理解这些信息。测试人员和分析师在进行测试和攻击模拟时经常会遇到某些障碍，例如测试范围应涵盖多少以及内容、如何衡量测试运行期间关键系统故障相关的影响和风险、他们应该持续测试多久，最后但同样重要的是，如果在测试过程中不小心泄露任何敏感数据，该如何处理。渗透测试过程需要良好的结构是非常重要的。为了建立这样一个模型，了解以下几个问题的答案至关重要：\n\
  \n* 为什么渗透测试与其他类型的安全测试不同？例如安全代码测试、压力测试、配置和合规性测试、漏洞评估和测试等等。\n* 在你的业务背景下进行渗透测试的必要是什么？（不应仅仅为了满足某些合规性要求和/或通过审计项或查询的标准而进行渗透测试）。\n\
  * 执行渗透测试有哪些风险，我们应该如何预先评估它们？\n\n结构化渗透测试的第一步是确保测试由经过培训、有经验且合格的渗透测试人员执行。遵循预定义的结构是必要的，因为渗透测试涉及利用系统漏洞和弱点的步骤。组织可以遵循某些渗透测试方法为其测试工作提供结构，并在测试期间保持一致性。\n\
  \n## 渗透测试框架\n\n在本章中，我们将更多地讨论简化渗透测试框架。\n\n![](img/Figure-4.1.jpg)\n\n**图 4.1：** 渗透测试框架\n\
  \n让我们层层理解这个框架。在高级层次上，在整个渗透测试周期中可以遵循以下 8 个阶段：\n\n* **阶段 1**: 参与前活动\n* **阶段 2**: 规划\n\
  * **阶段 3**: 信息收集\n* **阶段 4**: 侦察\n* **阶段 5**: 遍历\n* **阶段 6**: 漏洞研究\n* **阶段 7**:\
  \ 攻击利用\n* **阶段 8**: 报告\n\n我们的重点是确保渗透测试阶段逻辑清晰、简单、易于适应，并在需要时根据组织需求进行扩展。\n\n## 阶段 1：参与前活动\n\
  \n渗透测试的范围确定（Scoping）是第一也是最关键的阶段，关注范围将有助于测试人员准确地执行任务，并帮助他们提前规划活动。在渗透测试的范围确定期间，研究人员必须关注许多方面，例如工具的可用性、定义良好的设备列表、应用程序或网络设备、支持和网络团队的就绪准备、对环境的清晰理解和知识，以及适当的管理支持。\n\
  \n\n\n\n避免或未能对活动进行合理的范围可能会给渗透测试人员和/或其组织带来许多问题。在不利的情况下，有时甚至会导致法律责任。范围应明确定义什么需要测试、何时需要测试、测试人员被允许渗透多深，以及需要避免什么。在界定范围时需要考虑的一个关键因素是为完成手头任务预留多少时间。研究人员在界定范围时最常见的错误是根据要扫描的\
  \ IP 地址数量或 IP 范围来计算完成后续阶段所需的工作量。最佳实践是始终根据工作范围定义的任务评估完成其所需的工作量，并根据此评估来确定完成渗透测试的时间。在讨论时间和工作量估计/范围界定的主题时，让我们也考虑这样一个事实：这些估计在很大程度上取决于测试人员本身或在许多情况下取决于整个团队的技能、成熟度和经验。这意味着，如果团队/测试人员经验非常丰富，那么测试量和准确性将与经验较少的人有所不同。作为实践，测试人员必须在完成活动的原始界定时间之外留出缓冲时间。以下是一些重要的范围界定标准，可以根据需要遵循：\n\
  \n- 你进行渗透测试是为了满足任何监管或合规性要求，还是仅仅为了内部团队定期评估任何漏洞？\n- 进行渗透测试的时间窗口是什么？例如，仅限在工作时间内进行，或者组织可能希望在离峰时间进行测试以避免任何业务连续性中断，又可能仅在工作日进行？\n\
  - 必须考虑到总共需要测试多少 IP 地址，将它们分为内部 IP 和外部 IP 组也会很有用。\n- 考虑到任何设备，如防火墙、IDS/IPS 或任何 Web\
  \ 应用防火墙，因为这些设备可能会影响渗透测试的结果。\n\n范围界定活动将为测试期间的任何中断提供安全保障，而中断在渗透测试期间是非常常见的。例如，测试范围内的\
  \ Web 服务器可能会宕机，测试将一直停止直到它恢复并恢复正常服务为止。\n\n## 第 2 阶段：规划\n\n规划阶段将为收集初始信息以准备渗透测试奠定。在每次测试之前，渗透测试人员需要确保已准备好一份明确说明测试范围和持续时间的正式协议，并由双方达成一致且签署，这样做是为了为任务提供绝对的清晰度并授予法律保护。如果你是所属组织的内部团队，那么这可能只是你的团队与管理层或为你执行测试的利益相关者之间的协议。\n\
  \n为了进行后续步骤，必须建立以下内容：\n\n- 准备双方团队的联系人名单和关键利益相关者个人。\n- 准备一个升级矩阵。\n- 通知支持团队渗透测试窗口，以便他们了解正在运行的测试并保持警惕。\n\
  - 确保安全运营团队也了解测试和时间窗口，他们就可以监控扫描并检测是否发生了具有相似模式的异常或恶意攻击，而不是阻塞你的扫描。\n- 定义测试用例，以及你将在测试阶段运行的测试用例。\n\
  - 选择你将使用的工具集并据此设置测试环境。\n\n在该阶段结束时，通过遵循所有步骤，测试人员将能够获得有关目标网络的宝贵信息，例如员工姓名、其职位，在某些情况下可能还会获得联系方式、使用的技术、位置、计算平台、Web\
  \ 暴露情况（如域名和使用的域名数量）、托管详情、数据中心位置或办公地点、其网络使用的技术（来自职位招聘等等）、电子邮件地址和电话号码。\n\n## 第 3 阶段：信息收集\n\
  \n在此阶段，活动通常侧重于尽可能收集有关目标的所有信息。为了本本书的目的，我们将此阶段分为两个子阶段：阶段 3a，通用信息收集阶段，如果你计划对目标发起测试而目标是新的或者是第一次启动渗透测试，则执行该阶段；以及阶段\
  \ 3b，历史信息收集，将在稍后解释。让我们继续阶段 3a，在任何信息收集过程中，默认选择是使用互联网来寻找有关目标主机或组织的所有关键或有用信息。技术从使用搜索引擎到使用如\
  \ `WHOIS` 等基于互联网的工具或收集 `DNS` 信息不等。信息收集可以尽可能具有创意，收集的信息越多，无论是关于 IT 系统的技术信息，还是面向外部的应用程序和基础设施，或者可能是职位公告中的描述，这些描述透露了组织正在使用的技术类型或产品。非常有创意的搜索往往可以揭示存储在\
  \ `git` 仓库或类似位置的源代码，其中可能嵌入了用户或账户凭据。\n\n不过，信息不需要直接从目标处收集，你也不需要在渗透测试的这一阶段与目标和目标系统进行任何接触。那个阶段稍后就会到来。在此阶段，所有或大部分信息是从公开信息中收集的，大部分来自公共互联网资源，此阶段的唯一目的是探索所有可以提供有关目标的额外和有用信息的位置和来源。这可以分为三种不同的方法：\n\
  \n- 被动信息收集\n- 主动信息收集\n- 历史信息\n\n接下来让我们更详细地查看这两个活动。\n\n## 被动信息收集\n\n被动信息收集是在避免任何物理接触或连接信息的情况下，捕获和收集有关你的目标系统和应用程序信息的过程。要实现被动信息收集，使用公共开放的其他来源来收集有关目标的信息，它可能包括如\
  \ `whois` 查询等工具。\n\n为了定位目标的 Web 存在，你可以选择使用搜索引擎深入挖掘目标，可以搜索社交媒体以获取员工详情，你还可以使用在线资源检查目标的服务状态，例如服务运行了多久，或者过去是否有过停机，每次停机持续了多久等，你可能还会选择执行反向\
  \ DNS 查询，检查垃圾邮件数据库和各种其他公共资源，因为这些是无尽的，值得在此回一下在本阶段开头提到的内容：你越有创意，收集的信息就越多。\n\n## 主动信息收集\n\
  \n\n\n\n\n在主动信息收集期间，将与目标系统建立主动连接以获取更深层的信息。在这种情况下，你将能够获得直接有助于识别和分析目标安全性的信息。你可以选择执行诸如端口扫描、邮件头头分析（如果你收到了来自目标的任何邮件）等活动，或者你可以尝试使用从被动信息收集中获取的邮箱地址探测邮件服务器，并分析从服务器收到的响应（基本上是寻找服务器的回传响应，如果邮件投递成功，你可能会收到退信响应）。另一种技术是尝试\
  \ DNS 区域传输（DNS Zone transfer），以防外部名称服务器配置不当，导致内部 DNS 信息发生泄露。区域传输文件将包含一些关键信息，例如起始权威记录（`SOA`），`SOA`\
  \ 包含有关对 DNS 服务器所做任何更改的信息，例如主机的修改、添加或删除；`名称服务器`（`NS`）、地址记录或 `A` 记录，以及 `MX` 记录（指定邮件交换服务器）。\n\
  \n## 历史信息\n\n这是信息收集阶段的一个子阶段，位于规划阶段之后。如果你是一个内部团队，并且已经对自己的网络进行了定期的渗透测试（例如每月或每季度一次），那么在这种情况下，你可能已经从之前的扫描和规划中获得了一些特权信息。这可能包括有关目标\
  \ IP 子网、需要测试的应用程序、网络相关以及许多其他领域的信息。在企业环境中，当内部团队准备执行常规渗透测试时，他们具有使用任何之前的扫描结果和发现的漏洞的优势，因为网络在短时间内不会发生巨大变化。你对系统和应用程序的过去知识可能会导致与之前类似的发现，这将成为修复措施尚未实施的活生证明。这些重复的发现可以帮助你迫使团队更快地修复。另一方面，修复团队将在首次尝试中尝试修复，因为他们知道团队将在下一次迭代中进行扫描并发现问题。再次强调，如何利用过去和历史信息的创意对于内部渗透测试的取得更大成功至关重要。\n\
  \n**注意：** 在信息收集的两种场景中，它都会导致侦察（Reconnaissance）阶段。\n\n## 第 4 阶段：侦察\n\n通过主动和被动信息收集方法收集足够且满意的信息后，在执行渗透测试之前，密切关注侦察阶段及其活动是极为重要的。在此阶段收集的信息在执行渗透测试的后续阶段（如枚举和利用阶段）时将非常有用。侦察有时非常有趣，因为你可以发现的内容以及可以发现多深的信息没有限制，发现的信息和数据可能直接导致系统利用，而跳过枚举步骤。但相反，最佳实践始终是执行完整的侦察活动，找到所有数据，然后通过枚举进入利用阶段，而不是在发现任何有利可图的信息时直接跳到利用阶段。这样可以很容易地确保你已经涵盖了所有可能用于控制系统的角度，并发现了所有可能的漏洞，而不仅仅是通过走捷径而忽略了它们。你收集的信息越多，渗透测试就越容易、顺畅。\n\
  \n你收集的信息还取决于目标系统或基础设施，或者在某些情况下取决于组织本身，因为收集的数据性质也会有所不同。为了进一步解释，如果你正在评估一个基于 Web 的\
  \ HR 应用程序，那么如果你能识别出它运行的服务器类型、该应用程序开放的端口、运行的所有其他服务，然后从服务器、服务或应用程序的角度发现它们可能具有的漏洞，将非常有帮助。你有很多工具可供使用来执行这些测试和侦察活动。在此阶段执行的主要活动如下：\n\
  \n*   发现网络范围和活动 IP 地址、这些地址上的活动机器，在可能的情况下绘制网络地图\n*   扫描这些活动机器上的开放端口和正在运行的服务\n*  \
  \ 一项重要的活动是操作系统指纹识别（OS Fingerprinting），利用你手头的工具和技术准确猜测活动机器上正在使用的操作系统\n\n我们在本书的实验课程中重点关注的几个工具如下：\n\
  \n*   `NMap`\n*   `arp-scan`\n*   `Netdiscover`\n*   `netcat`\n\n**注意：** 这些工具已经是标准\
  \ Kali Linux 发行版的一部分。\n\n## 第 5 阶段：枚举\n\n枚举阶段是利用从之前的活动和侦察阶段收集的信息来进一步测试，并获取关于目标的越来越多、越来越深层的信息，也是迈向利用和获取目标系统访问的一步。\n\
  \n此阶段涉及详细的技术活动，用于评估网络及其 IT 资源，例如，获取更详细的网络相关信息以构建目标环境的网络拓扑结构。与其他阶段类似，使用了特定且专门的工具来发现被测试环境中活动主机及其所在网络的深层技术信息。\n\
  \n在映射网络及其资产时，目标是发现所有活动主机及其操作系统、网络交换机和防火墙、安全检测和监控系统（如 IDS 和 IPS）、应用程序服务器和运行的服务。获取这些详细信息将允许进行针对性的漏洞评估，以发现可以被利用以进一步访问系统的特定漏洞。在此阶段，测试人员可以尝试识别有效用户帐户、开放的资源共享、配置不当的服务器或应用程序以获得直接访问，以及\
  \ Web 应用程序漏洞（如远程文件包含）以直接访问应用程序服务器。\n\n枚举期间的某些活动可能包括：\n\n*   收集 AD 信息并针对弱弱或易受攻击的用户账户，例如，带有默认密码的账户\n\
  *   使用 `NBTscan` 工具枚举 NetBIOS 名称\n*   执行 SNMP 枚举\n*   连接网络共享\n\n测试人员执行的各种类型枚举：\n\
  \n*   查找运行的应用程序 banner（banners）以识别服务或应用程序版本\n*   网络资源和共享\n*   网络用户、安全和用户组\n*   识别机器和主机名\n\
  *   SNMP Walk\n\n除了上述之外，此阶段使用的技术可能包括使用发现的默认密码提取信息，对活动目录进行暴力破解以查找与用户、组和组策略相关的信息，你也可以使用\
  \ SNMP 发现网络用户。一些关键的枚举活动可能是对以下常用端口的服务和端口识别：\n\n*   `TCP 53`: DNS 区域传输\n*   `TCP 135`:\
  \ Microsoft RPC\n*   `TCP 137`: NetBIOS 名称服务\n*   `TCP 139`: NetBIOS 之 SMB\n*  \
  \ `TCP 445`: TCP 之 SMB\n*   `UDP 161`: SNMP\n*   `TCP/UDP 389`: LDAP\n*   `TCP 3389`:\
  \ RDP 服务（远程桌面）\n*   `TCP 25`: 简单邮件传输协议 (SMTP)\n*   `TCP 80`: Web 服务\n*   `TCP 8080`:\
  \ 代理服务\n*   `TCP 443`: SSL\n\n\n\n\n然而，上述服务并非所有项都必须运行在默认端口上，出于安全考虑，许多组织会为某些服务选择自定义端口，例如，他们可能选择使用端口\
  \ 8181 作为代理，或为 Web 应用选择任何其他自定义端口。除了上述端口，你可能还会发现其他服务常用的几个端口，有时这些端口可能非常特定于组织内部构建的应用，因此也会随组织而异。让我们更详细地讨论一些常见的利用技术。\n\
  \n## NetBIOS 枚举\n\n通常，NetBIOS 用于通过局域/WAN 连接的计算机之间的通信，以允许文件共享和打印机共享。在基于 Windows 的系统中，NetBIOS\
  \ 可用于通过 TCP/IP 检测并识别连接的网络设备。通常，NetBIOS 名称在本质上是唯一的，可以揭示有关可枚举设备的一些有趣信息。可以找到的常见因素包括：连接到特定域的所有计算机列表、这些主机上的开放共享等，其中大多数内容都可以使用\
  \ `Nbtstat` 等常用工具找到。\n\n## SNMP 枚举\n\n`简单网络管理协议`（`SNMP`）是一种基于 UDP 的协议，用于管理和维护路由器、交换机等网络设备。SNMP\
  \ 广泛用于大多数操作系统，包括 Windows Server、Linux 和 UNIX 服务器。SNMP 始终是研究人员和测试人员的目标，用于枚举与用户账户、密码以及目标环境中关联系统名称相关的细节。SNMP\
  \ 用于`网络管理系统`（`NMS`）对网络设备进行监控和管理。启用 SNMP 的设备允许根据访问级别通过读或写权限访问管理信息数据库。该数据库存储带有特定标识符的网络对象的描述，并作为值和设置的仓库。SNMP\
  \ 使用团体字符串（Community Strings）进行设备间的身份验证，这些团体字符串本质字符串。这种特定的身份验证机制实现允许任何攻击者或安全测试人员进行网络嗅探。如果团体字符串没有得到适当的保护或配置，可能会泄漏网络信息。在\
  \ SNMP 枚举可以使用 `SNMP-WALK`、`SolarWinds` 等工具。\n\n## DNS 枚举\n\nDNS 枚举是另一种常用方法，用于定位\
  \ DNS 服务器及其关于目标系统/网络的相关记录。它可以提供目标系统非常有用的信息，如 IP 地址、用户名、计算机名称等。DNS 记录将提供存储在区域文件中记录的概述。由于\
  \ DNS 数据通过 DNS 区域传输同步到一组 DNS 服务器中，攻击者或渗透测试人员可以执行 DNS 区域传输请求，如果 DNS 服务器由于任何配置缺陷允许未经授权方进行区域传输，在这种情况下，关联设备的\
  \ DNS 名称和 IP 地址将以明文访问。可用于此活动的工具包括 `nslookup` 或 `maltego`。\n\n## 第 6 阶段：漏洞研究\n\n\
  漏洞研究阶段考虑了在信息收集、侦察和枚举阶段收集的所有情报，以列出与目标系统相关的潜在安全问题列表，对这些安全问题进行进一步分析，以确定其严重性、影响和利用难易程度。将执行额外的验证措施以确定其有效性并消除任何误报。\n\
  \n然后将安全问题与每个已识别问题的可用利用程序和技术列表进行映射，这样做是为了得出每个可用利用程序或技术的成功和失败率。在研究阶段评估各种利用程序和技术时必须特别注意，以避免对目标系统造成任何潜在危害。\n\
  \n## 第 7 阶段：利用\n\n在利用阶段，测试人员的主要重点是使用上一阶段发现的利用程序或技术来利用发现的安全缺陷。测试人员需要仔细的评估和规划，以确定最有效且安全的方法，避免将系统踢出网络、被监控系统检测/拦截以及未能实现既定目标。在此阶段执行的所有操作都需要经过良好的控制和协调，应捕获并保留所有执行活动的证明以供下一阶段使用。\n\
  \n## 第 8 阶段：报告\n\n这是整个过程的最后阶段也是最重要的阶段之一，因为它涉及项目交付物的生成。测试人员在项目上花费的所有时间和精力的都被提炼成简洁且有意义的文档或一系列文档，准确反映了被测试系统的安全状态。\n\
  \n正如俗话说（我不知道是谁说的）“在记录之前，任何事情都不被视为完成”。交付物应准确描述在各个阶段执行的活动，每一步都必须结合发现的结果和产物进行记录，以证实测试人员的主张。这些信息必须通过适当的解释以及对执行的步骤、差距、发现的漏洞、使用的利用程序、如何使用以及它们在什么情况下有效或可能失效的详细证明来证明。\n\
  \n报告的内容应基于渗透测试人员自身观察到的实际事实，而不是假设。一旦报告定稿，必须与各种利益相关者和相关部门共享，例如高层管理、监管、运营团队、应用程序和基础设施安全团队以及组织的技术团队。\n\
  \n由于渗透测试报告被广泛的利益相关者使用以满足其特定的角色需求，因此报告的结构应该是良好的，并包含帮助他们满足项目目标和要求的章节。\n\n在报告期间可以遵循的某些章节如下：\n\
  \n## 目标\n\n此章节必须绝对清晰地涵盖渗透测试的目标。整个演练的目的以及它将实现哪些目标。例如，“渗透测试是作为年度流程的一部分进行的”，或者“渗透测试是为了满足监管机构的审计要求而进行的”，又可能简单地检查上线应用程序的有效性和韧性。\n\
  \n## 预期利益相关者\n\n定义或记录组织中谁需要共享此报告的人，例如 CIO、CTO、CISO、信息安全经理、IT 经理、技术团队、应用程序安全团队等。\n\
  \n## 方法论\n\n\n\n\n测试报告还应该包含测试阶段所遵循的方法论；你可以选择使用本章开头提到的带有图表的方法论。这将为读者提供关于测试如何进行的清晰方向，从而增加读者对测试及其发现结果的信心。\n\
  \n## 发现结果与相关细节\n\n在本节中，测试人员将尝试通过技术解释和可能的截图证明来详细说明他们的每项发现结果。测试人员需要以表格、饼图、柱状图等形式提供详细信息，随后对发现的漏洞进行详细说明，以及它们是如何被利用或利用以获取访问或可能造成危害的；还必须解释此类漏洞和利用对应用程序或系统的影响，最后但同样重要的是，还必须解释风险等级（严重、高、中、低）。\n\
  \n## 样本与示例\n\n以下是编写报告时可以考虑的一些样本：\n\n### 风险分\n\n![](img/Figure-4.2.jpg)\n\n**图 4.2：**\
  \ 风险等级\n\n风险等级金字塔示例\n\n### 详细发现\n\n![](img/Figure-4.3.jpg)\n\n**表 4.1：** 详细发现结果\n\
  \n记录详细发现结果的示例模板。\n\n# 结论\n\n在本章中，你学习了结构化渗透测试的重要性以及简化渗透测试框架，该框架涵盖了渗透测试的各个阶段。\n\n\
  在本书的后续，我们将遵循相同的框架来介绍各种用例，并借助 Kali Linux 发行版提供的各种流行工具来解释各项活动。\n\n下一章将重点关注规划阶段和侦察阶段的概念。\n\
  \n## 问题\n\n在移动到下一章之前，有一些你可能想要关注的问题。\n\n1. 在开始渗透测试之前，规划阶段有多重要？\n2. 在利用阶段，你最想记住的一点是什么？（请记住，如果执行不当，此阶段可能会造成严重危害）\n\
  3. 渗透测试完成后，报告阶段有多重要？\n\n# 第 5 章：规划与侦察\n\n本章的重点是熟悉规划成功的渗透测试的概念，并对测试范围内的目标收集信息。此外，在本章中，我们将尝试涵盖\
  \ Kali Linux 内置的各种工具，以对在本书第二章中提前设置的目标机器进行有效的侦察。\n\n## 结构\n\n本章的重点将涵盖以下主题及其子级活动：\n\
  \n* 规划渗透测试\n* 目标机器的侦察。\n\n## 目标\n\n阅读本章后，你将能够：\n\n* 理解参与渗透测试规划的各种聘约前活动。\n* 使用 Kali\
  \ Linux 中提供的各种工具对目标主机进行实操侦察。\n\n## 规划渗透测试\n\n上一章解释了渗透测试框架，正如该框架所解释的规划测试涉及到测试团队与客户/内部利益相关者（如果是内部渗透测试团队进行的评估）之间的系列聘约前交互。举行这些会议是为了便于交换关于客户切需求的战略信息，这有助于定义确切的工作范围，并使聘约合同与交付的服务保持一致。\n\
  \n在交互过程中交换的信息也有助于制定合适的战术计划、时间表，并设计最有效的聘约合同和实用的测试方法。\n\n## 预期\n\n规划的第一步是与客户讨论预期，并理解请求渗透测试的背景。渗透测试的几个共同预期如下：\n\
  \n* 绘制公司应用程序及 IT 基础设施的攻击面，发现与之相关的安全问题，并将这些发现转化为对业务的实际风险。\n* 识别安全弱点，并在恶意实体发现并利用它们之前解决这些发现。\n\
  * 理解内部安全团队和流程的有效性。\n* 源于公司信息安全策略或标准（如 `ISO/IEC 27000`、`PCI-DSS` 以及其他监管义务）的合规要求。\n\
  \n## 测试范围\n\n渗透测试的目的是确定将测试的目标信息资产、测试位置（内部或外部）、所需的测试类型（黑盒、灰盒、白盒）以及客户试图实现的深度。\n\n\
  在执行黑盒测试时，提供测试人员的系统知识非常有限，这通常涉及基础信息，例如基础设施测试中的单个 IP 地址或系统范围，或者应用程序渗透测试中的互联网域名和 URL。\n\
  \n在进行灰盒测试期间，要求客户分享更多关于系统的详细信息，例如操作系统、服务器角色、受限的用户凭据、应用程序参数等。\n\n同样，对于白盒测试，除了上述内容，还应请求访问源代码、设计文档、数据流图、配置文件、用户和管理员凭据等。\n\
  \n**注意：** 理解环境中实现的现有安全层（如网络和 Web 防火墙、入侵检测系统）非常重要，这些可能会影响扫描的可靠性和整体测试速度。\n\n## 通信\n\
  \n渗透测试的成功取决于双方建立清晰的通信，应该定义定期的日程以交换进度更新。此外，应该建立专用通道来通信双方在测试期间遇到的问题，了解紧急联系人是非常重要的。\n\
  \n由于交换的信息具有极强的敏感性，使用加密通道（密码保护的文件、PGP/GPG 加密邮件等）发送敏感信息是明智的。\n\n## 问题升级层级\n\n在渗透测试活动期间，在聘约合同中定义清晰的升级层级以及周转和问题解决时间是有关重要的。这是为了确保在测试过程中出现的任何潜在未来问题都能及时传给相关人员，并得到及时解决。需要调用升级的一些常见场景包括：\n\
  \n* 无法访问目标基础设施或应用程序。\n* 网络访问被防火墙或入侵检测与防御系统拦截。\n* 测试账户失效或被锁定。\n* 关键漏洞的通信。\n* 利用所需的审批。\n\
  * 目标基础设施或应用程序平台因测试意外宕机。\n\n升级矩阵还确保任何未解决的问题在对整个项目进度产生任何影响之前，获得充分的管理支持。\n\n## 关键人员\n\
  \n\n\n\n双方之间应交换关键人员的联系信息，如姓名、职位、电子邮件、电话号码，并说明他们在渗透测试期间将承担的角色；这些信息应记录在工作说明书（Statement\
  \ of Work）和参与合同（Engagement Contract）中。这些文件应与客户正式签署，并按照之前描述的双方同意的安全通信通道进行共享。\n\n\
  客户方人员包括以下部门的代表：\n\n*   管理层的关键利益相关者\n*   项目经理\n*   IT 管理\n*   信息安全\n*   网络安全\n* \
  \  安全运营中心 (SOC)\n*   应用开发\n\n监督、管理和执行测试的人员：\n\n*   管理层\n*   项目经理\n*   首席渗透测试员\n\
  *   团队成员\n\n## 测试窗口\n\n决定测试窗口的因素取决于客户安全团队的整体成熟度、测试环境（开发/生产环境）以及所评估系统的关键性。\n\n这范围可能从\
  \ 24x7 全天候测试到每天在非营业时间或非高峰时段仅持续几小时，在某些情况下可能仅限于周末；在准备测试计划时，这一点非常重要。客户端应配备足够的支持人员，以便在测试团队遇到任何问题时能够快速解决。\n\
  \n一旦确定了测试日期和时间，应记录在双方签署的合同文件中。\n\n## 测试局限性\n\n由于某些测试可能会直接影响测试环境，因此理解客户的顾虑并为正在进行的测试设定合理的边界至关重要。设置这些边界可能出于多种原因，包括以下方面：\n\
  \n*   为了避免被测试系统或服务崩溃（例如：拒绝服务）。\n*   为了避免对测试系统性能的影响（例如：拒绝服务）。\n*   为了防止测试运行时间过长的情况（例如对登录表单进行暴力破解）。\n\
  *   为了避免敏感数据泄露（例如将密码哈希值上传到在线破解网站）。\n*   为了避免向环境引入恶意脚本（例如上传 Web Shell、内核漏洞等）。\n\n\
  在完成参与前讨论、计划、调度和合同签署后，即可根据约定的测试窗口开始测试。\n\n# 侦察\n\n本节旨在通过在书中之前创建的实验环境中练习技能，使用户熟悉 Kali\
  \ Linux 中提供的各种侦察工具和技术。\n\n让我们在实验环境中开始渗透测试的实操部分。启动 Kali Linux 虚拟机以及各种目标机器，以练习随后的练习。在开始测试之前，请为目标机器完全启动留出足够的时间。\n\
  \n登录 Kali Linux 系统，从 Dock 打开终端窗口并执行 `ifconfig` 命令以获取分配给我们 Kali 系统的网络和 IP 详情。\n\n\
  ![](img/Figure-5.1.jpg)\n\n**图 5.1：** `ifconfig` 命令\n\n`ifconfig` 命令的输出显示我们的 Kali\
  \ 系统被分配了 IP 地址 `10.0.2.238`，掩码设置为 `255.255.255.0`。\n\n我们从目标环境中已知一点是，测试机与我们的 Kali\
  \ 系统在同一个虚拟网络上。根据子网掩码信息，我们可以推断出网络共有 256 个主机 IP 地址。排除网络 IP `10.0.2.0` 和广播 IP `10.0.2.255`，为目标系统留下了\
  \ `10.0.2.1` 到 `10.0.2.254` 之间的可用主机 IP 范围。\n\n**注意：** 所有测试将通过我们的 Kali Linux 系统在虚拟实验室网络进行，我们不会直接与测试目标进行交互。在继续后续章节之前，请记录这些细节。\n\
  \n## DC:7\n\n![](img/Figure-5.2.jpg)\n\n**图 5.2：** DC-7 登录界面\n\nDC-7 完全启动的截图。\n\n\
  DC-7 控制台显示了分配给它的当前 IP，但在实际测试中情况并非如此，因此，我们将探索通过网络查找此类信息的方法。\n\nKali Linux 上有许多现成的工具来执行目标侦察，但如果不理解其内部原理而直接使用它们将导致无法掌握核心概念。初始练习将涉及编写基础脚本来执行目标侦察，这种方法有望帮助读者在使用\
  \ Kali Linux 中的现成工具之前理清相关概念。\n\n在网络上寻找“存活”主机的一种方法是使用一系列 ping（ICMP 回显）请求对网络进行扫描，并等待正在运行的主机的响应。现在，让我们打开终端窗口，并利用\
  \ bash `for` 循环创建一个非常基本的 ping 扫描器，使用内置的 `ping` 命令向 IP 范围内的所有主机发送 ICMP 回显请求。\n\n\
  ![](img/Figure-5.3.jpg)\n\n**图 5.3：** 使用简单的 `for` 循环对网络进行扫描\n\n`ping` 命令向每个主机发送的\
  \ ICMP 回显请求数通过 `-c` 标志限制为 1，如果不进行此限制，标准的 Linux `ping` 命令将一直发送 ping 请求，除非通过按 `^c`\
  \ 中断。为了加快脚本运行速度，还通过 `-W` 标志将超时设置缩短为 1 秒。这意味着 `ping` 命令将在超时退出之前等待 1 秒钟的 ICMP 响应。\n\
  \n`ping` 的输出包含了失败的 ping 请求以及从存活“主机”收到的 ping 响应，为了避免在屏幕上看到失败的请求，我们使用 `grep` 命令关键词“bytes\
  \ from”对接收到的输出进行过滤，仅显示对我们请求响应的主机。\n\n```\nroot@kali:~# for i in $(seq 1 254); do\
  \ ping -c1 -W1 10.0.2.$i | grep \"bytes from\" ;done\n```\n\n```\n64 bytes from\
  \ 10.0.2.1: icmp_seq=1 ttl=64 time=2.37 ms\n64 bytes from 10.0.2.18: icmp_seq=1\
  \ ttl=64 time=341 ms\n64 bytes from 10.0.2.27: icmp_seq=1 ttl=64 time=0.646 ms\n\
  64 bytes from 10.0.2.180: icmp_seq=1 ttl=64 time=110 ms\n64 bytes from 10.0.2.208:\
  \ icmp_seq=1 ttl=128 time=1.74 ms\n64 bytes from 10.0.2.238: icmp_seq=1 ttl=64 time=0.049\
  \ ms\n64 bytes from 10.0.2.245: icmp_seq=1 ttl=64 time=65.5 ms\n64 bytes from 10.0.2.253:\
  \ icmp_seq=1 ttl=64 time=266 ms\nroot@kali:~#\n```\n\n从输出可以看出，该命令按预期执行，并返回了 10.0.2.X\
  \ 范围内的所有“存活”主机。\n\n我们使用的实验环境有多个活动机器，测试实验室的 ping 扫描显示了多个主机的响应，如果读者只启动了 DC-7 ，结果将会不同。\n\
  \n**注意：** 如果主机禁用了 ICMP 回显请求/响应，这种类型的网络映射将失败。\n\n我们创建的扫描命令确认了 DC-7 机器的 IP 地址 `10.0.2.27`\
  \ 在线，我们将通过编写一个类似的单行 Shell 命令检查 DC-7 机器上的开放端口来进一步探测该 IP 地址。首先，我们将仅扫描目标主机上 65535 个\
  \ TCP 端口前 1024 个。\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 使用简单的 `for` 循环进行端口扫描\n\
  \n\n\n\n上方截图显示的命令对目标机器的特权端口范围（1-1024）执行 TCP 连接扫描。它通过使用 `netcat`set 逐个探测端口来实现这一目标。`Netcat`\
  \ 对于渗透测试人员来说是一个功能非常强大的工具，因为它具有多种功能，可以利用于渗透测试的几乎所有阶段。\n\n为了加速扫描过程，使用 `-w` 标志配合 `-z`\
  \ 标志（零 I/O 模式，专门用于扫描目的）将超时窗口缩短为 `1` 秒。`-n` 标志阻止 `netcat` 执行反向域名解析，`-v` 标志则指示 `netcat`\
  \ 生成详细输出。\n\n```\nroot@kali:~# for port in $(seq 1 1024); do nc -w 1 -z -nv 10.0.2.27\
  \ $port 2>&1 | grep open; done\n(UNKNOWN) [10.0.2.27] 22 (ssh) open\n(UNKNOWN) [10.0.2.27]\
  \ 80 (http) open\nroot@kali:~#\n```\n\n端口扫描命令在目标系统上发现了总共 2 个开放端口，让我们进一步探测它们以找到运行在开放端口后的服务。\n\
