- "# Kali Linux 渗透测试：通过过程驱动框架学习实战渗透测试\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/logo.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com)\n\
  \n\n\n\n\n### 责任限制与免责声明\n\n\n\n![](img/logo1.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com/)\n\
  \n# 前言\n\n**Diana Kelley:** 每个业务主都应该知道这些关键问题的答案：“我的在线和移动应用程序安全吗？”“我的公司数据面临风险吗？”“我的客户能安全地购买我的服务吗？”\n\
  \n如果他们知道答案，那么我们必须感谢渗透（或 Pen）测试员的辛苦工作。\n\n渗透测试的概念听起来相当奇特或“酷”，特别是对于那些从未执行过它的人来说。在实践中，渗透测试可能是一项令人混乱且充满挑战的活动。测试通常在凌晨进行，如果你没有发现任何异常，并不意味着“工作完成”。相反，它建议你进行更深入的观察并尝试额外的工具，以确保你涵盖了应用程序的所有区域并尽可能进行了深度挖掘！此外，还有永恒的问题：“我们如何知道自己已经检查了所有地方？”以及“我们如何知道应用已经得到了充分测试？”\n\
  \n因此，你即将阅读的书是一项重要的资源。本书由 Deepayan Chanda 和 Pranav Joshi 编写，他们是资深的网络安全专业人士，完成了数百次渗透测试，领导过大型内部测试团队，并从失败中学了许多教训。Deep\
  \ 和 Pranav 受他们许多经历的启发写了这本书，作为你们渗透测试过程的倡导者和指南。基于多年的实战经验和通过试错来确定有效无效的方法，他们建立了一个使用\
  \ `Kali Linux` 作为平台的实用框架方法。\n\n如果你是渗透测试的新手，这本书就是你入门所需的所有。如果你已经进行渗透测试了一段时间，这个框架和经验智慧将为你改进流程的方法提供灵感，并帮助发现新方法。\n\
  \n正如 Deepayan 经常说的：“渗透测试总是反映真相；它是我们用来验证在设计和实施中的所有努力工作是否产生了一个稳健且安全的系统的衡量标准。”这就是你挖掘这一真相的分步指南。\n\
  \n**Burgess Sam Cooper:** 今天，渗透测试比以往任何时候都更有意义。威胁格局演变得更快，攻击者也变得越来越年轻。信息安全作为一个领域也在趋于成熟。此外，攻击目标不再需要技术诀窍，攻击可以在暗网上作为服务购买。\n\
  \n这导致了这样一种局面：确定你的基础设施和应用程序是否安全的唯一方法是在攻击者之前对它们进行测试。\n\n测试有时被比作艺术，它确实如此。然而，如果遵循某种流程，就可以获得一致的结果。Deepayan\
  \ 和 Pranav 在书中指定了这一流程。本书的核心优势在于它从零开始。如果你能从互联网下载一个文件，你就可以开始遵循书中的步骤了。\n\n`Kali Linux`\
  \ 作为一个平台是面向测试的。其关键优势是测试人员不需要花时间安装基础工具。`Kali` 有一个开箱即用的环境，让测试人员快速开始。\n\n书中的另一个重点是强调在做中学习。这本书带你你从设置环境到在进行测试后创建报告。清晰的报告有助于接收者理解测试发现的含义以及如何对它们进行优先级排序，并引导测试人员、应用程序团队、开发者和基础设施维护人员之间进行建设性的对话。\n\
  \n所以，拿起你的虚拟机，让 Deepayan 和 Pranav 带领你开启一段发现之旅吧！\n\n**Ajay Kumar:** 在今天这个数字连接的世界里，组织面临着风险。我们生活中网络安全威胁的规模和普遍性正在定期增加。虽然媒体上的事件很大程度上引起了大家的关注，但信息安全从业者和防御者往往没有或足够的工具、技能集和经验来理解这些复杂的新攻击的严重性。显而易见，每当团队在实际比赛之前演练时，他们在面对对手的真实比赛中就能自信从容地发挥。它判断了你在真实测试之前的准备情况。这种情况在网络安全领域也产生了共鸣，因为信息安全团队需要在真实攻击发生之前测试他们的防御并暴露差距和漏洞。这些模拟练习不仅有助于信息安全团队在不利情况下做好准备，还能帮助业务团队做出明智决策，以填补网络安全态的漏洞。\n\
  \n在书中，作者 Deepayan Chanda 和 Pranav Joshi 详细解释了渗透测试作为安全专业人员执行的关键模拟实践之一的相关性。本书用通俗易懂的语言解释了使用\
  \ `Kali Linux` 进行渗透测试的基础知识以及方法论、实践练习、示例报告和建议。`Kali Linux` 是帮助信息安全团队对抗者的众多工具之一。\n\
  \n无论你是学生还是网络安全专业人士，这本书都将给你渗透测试的基本概念，这些概念通常用于基于模拟的红蓝演习。编写这种写作需要真正的勇气和奉献，它以极其简单的方式解释了渗透测试的端到端过程和各个阶段。\n\
  \n我希望这本书能激发你深入学习的理解和兴趣，并与更大的网络安全社区分享你的知识。\n\n祝你迈出这一步，与他人分享你的见解和经验。\n\n# 献给\n\n*所有的网络战士*\n\
  \n*那些为了让互联网变得更安全*\n\n*而做出点努力的个人*\n\n# 关于作者\n\n\n\n`Pranav Joshi` 拥有 20 年以上的信息与网络安全经验，曾为多个业务领域的客户领导并交付了大型项目，涵盖银行、金融、国家证券交易所、保险、能源、石化、零售、媒体、广告、电子商务、IT/ITES、政府和国防等，其中包括财富富\
  \ 100 强公司。在之前的职位中，他负责管理信息资产、基础设施和应用程序的安全，范围涵盖 65 个国家，并显著减少了与合规相关的事件。Pranav 被认为发现了许多流行企业产品中的多个已披露和未披露的安全漏洞，这些漏洞已由领先的网络安全公司、专业机构和政府机构发布，如\
  \ `IBM Xforce`、`SecurityFocus`、`ExploitDB`、美国商务部国家漏洞数据库、美国国土安全部网络和基础设施安全局。\n\n`Deepayan\
  \ Chanda` 是一位资深的网络安全专家、架构师、网络安全战略师和顾问，致力于解决企业的网络安全问题。在超过 24 年跨多个安全领域经验的驱动下，他成功地在安全与业务目标之间取得了平衡。他曾是武装部队（印度空军）人员，目前任职于澳大利亚国家银行。他还曾工作于渣打银行以及许多大型产品和安全跨国公司，在推动安全项目和解决方案方面展现了强大的领导力。作为许多网络安全初创企业的导师和顾问，他为该行业做出了巨大贡献，并撰写了多部书籍。\n\
  \n# 关于评审员\n\n`Ajay Kumar` 是驻驻新加坡的 Crowdstrike 亚洲区网络安全服务区域负责人。此前，他曾在 `Entrust Datacard`\
  \ 担任亚太区区域总经理和亚太区营销总监。Ajay 曾获得 CMO Asia 委员会颁发的“国家营销领袖”奖，以及 2016 年世界营销大会颁发的“最具影响力的技术营销领袖”奖。\n\
  \n在开始创业之旅之前，他曾在几家金融科技、银行和 ITES 组织工作过。\n\n他是印度数据安全委员会（`DSCI`）的新加坡分会负责人，`DSCI` 是一个由\
  \ `NASSCOM®` 设立的网络安全和数据保护非营利行业机构，致力于通过建立网络安全和隐私领域的最佳实践、标准和倡议，使网络空间变得安全、可靠且值得信赖。\n\
  \nAjay 是支付、网络安全、企业技术和数据隐私领域的专家，拥有超过 21 年的专业经验。\n\n他在加齐亚巴德管理学院（Institute of Management\
  \ Studies）获得市场营销业务管理研究生学位，并在艾哈迈巴德管理学院读过高管课程。他拥有牛津大学赛德商学院的金融科技课程认证以及伦敦 `CFTE` 的金融人工智能认证。\n\
  \n`Phoram Mehta` 是 `PayPal` 亚太地区的首席信息安全官（CISO）。Phoram 是一位在信息安全领域拥有二十多年丰富经验的资深人士和技术主管，他在北美和亚太地区包括金融服务、医疗、电信和政府在内的多个公司构建安全技术解决方案方面发挥了关键作用。\n\
  \nPhoram 还负责 `PayPal` 的全球技术风险管理计划以及信息安全研究与外计划。他目前担任 `ISACA Singapore` 主席，并为新加坡、印度和美国的网络安全初创企业提供建议。\n\
  \n### `Burgess Sam Cooper,` EY EMEIA 地区网络安全负责人兼咨询服务合伙人\n\nBurgess Cooper 是合伙人兼网络安全市场负责人，拥有一支由\
  \ 600 多名专业人士组成的团队。他在保护全球一些顶级品牌免受潜在网络攻击方面拥有超过 23 年的丰富工作经验。\n\n在加入 EY 之前，他曾担任 `Vodafone`\
  \ 和 `HSBC` 的 CISO，负责电信和 BFSI（银行、金融服务、保险及保险）部门的信息安全、隐私和合规工作。\n\n他是 `BCCI`、`ASSOCHAM`、`CII`、`CISO\
  \ and E-crime` 等知名行业活动的经常演讲者和评委会成员，并且是 EC-Council 认证的行业 CISO 认证 CEI 主培训师。\n\n###\
  \ `Diana Kelley’s` 安全职业生涯跨 30 年。她是 `SecurityCurve` 的联合创始人兼 CTO。她投入大量时间从事网络安全社区的志愿者工作，包括担任\
  \ `ACM` 伦理与抄袭委员会成员、`Sightline Security` 的 CTO 和执行委员会成员、`WiCyS` 的执行委员会成员和包容性工作小组领袖、`Cyber\
  \ Future Foundation` 的执行顾问委员会成员、`CompTIA` 网络安全委员会顾问、巴莱特科学与数学学院（`Bartlett College\
  \ of Science and Mathematics`）和布里奇特州立大学（`Bridgewater State University`）的顾问委员会以及\
  \ RSAC 美国项目委员会成员。Diana 是“#MyCyberWhy”系列的制作人、`BrightTALK` “The (Security) Balancing\
  \ Act”的主以及“Your Everyday Cyber”播客的共同主持人。她还是 `TechVision Research` 的首席咨询分析师和 `The\
  \ Analyst Syndicate` 的成员。此前，她曾担任多种角色，如 `Microsoft` 网络安全领域 CTO、`IBM Security` 全球执行安全顾问、`Symantec`\
  \ 总经理、`Burton Group`（现 `Gartner`）VP 以及 `KPMG` 经理。她是一位备受欢迎的主旨演讲者，也是书籍《实用网络安全架构》和《开发者加密库》的合著者。她曾是波士顿学院网络安全硕士课程的讲师，并荣获\
  \ EWF 2020 年度高管奖以及 Cybersecurity Ventures 100 位“反击网络犯罪的迷人女性”之一。\n\n# 致谢\n\n我要感谢几位在写这本书期间向我提供持续和不断支持的人。首先，我要感谢我的妻子，在我花费许多周末和晚上写作时包容我。没有她的支持，我永远无法完成这本书。\n\
  \n如果没有我一些关键专业同事和导师的支持，这本书就不会可能，特别是 `Diana Kelly`、`Ajay Kumar`、`Phoram Mehta`、`Burgess\
  \ Cooper` 和 `Pranav Joshi`（合著者）。我向他们所有人表示感谢。\n\n最后，我要感谢 `BPB Publications` 给我为他们写这本书的机会。\n\
  \n*– `Deepayan Chanda`\n\n我诚挚地感谢我的家人和朋友，他们在我至今的旅程中坚定地支持并塑造了我。没有他们的支持、耐心和坚持不移的承诺，我无法成为今天的自己。\n\
  \n我要感谢我的妈妈、爸爸和妻子，他们不断提供灵感和支持，挑战我完成这项工作及更多成就；感谢我的儿子和女儿，他们调皮的作剧让氛围变得轻松，并让我期待每一天。\n\
  \n最后，我感谢 `Deepayan Chanda`（合著者）和 `BPB` 团队在写这本书期间提供的所有支持。没有你们大家，这项工作是不可能实现的！\n\n\
  *– `Pranav Joshi*\n\n# 前言\n\n渗透测试是为了模拟对网络、操作系统和应用程序的网络攻击，以发现其漏洞以及如何利用这些漏洞获取访问权限，这与实际攻击者的做法非常相似。整个行业的研究人员、测试人员和专家使用渗透测试方法和技术来评估和评价企业防御系统及流程的效率效能。\n\
  \n\n\n\n\n本书适用于任何想要提高企业环境渗透测试技能的人士。由于本书遵循了基于用例的循序渐进的方法论，任何具备渗透测试基础知识的人都可以通过遵循这些技术，为自己的企业安全测试进行有效的学习。\n\
  \n在本书中，安全专家和研究员 Pranav Joshi 和 Deepayan Chanda 将向你解释每位渗透测试员都需要的技能、流程和技术。通过部署一个包含\
  \ `Kali Linux` 和存在漏洞操作系统测试机的虚拟机实验室，你将能够通过使用 `Nmap`、漏洞扫描器和 `Burp Suite` 等工具，完成各种实际用例。\n\
  \n你将从搭建一个渗透测试实验室开始，该实验室由 `Kali` 框架和基于 `Linux` 的目标机器组成，将作为你学习和练习渗透测试技能的平台。随后，你将学习渗透测试过程的基本阶段。随着学习的深入，你将深入探索渗透测试的阶段，例如规划、侦察、操作系统指纹识别、服务识别、漏洞检测、利用、阶段阶段（staging）和权限提升，同时学习相关工具及其用法，以便根据你当前面临的场景找到最佳方法。你还将学习如何解释和关联多个工具的输出结果，从而建立起坚实的基础。最后，你将学习通过对测试期间进行的所有活动进行简洁的文档记录，并整理成一份精简的报告提交给利益相关者。在随章节完成的实验课程并启动各种攻击的过程中，你将学习到实际测试的核心阶段和流程，包括信息收集、对发现漏洞的利用、获取系统访问权限并维持访问以及一些后利用场景。最后，你将学会生成一份有价值的报告，因为如果没有适当的文档记录，任何工作都不是完整的。\n\
  \n本书中的渗透测试流程和自定义方法论将为你提供知识和技术，帮助你为组织交付成功的测试。关于信息收集的循序渐进的说明将指导你对将要测试的目标收集所需级别的信息。利用和后利用等阶段的用例将教你执行评估所需的工具。在每一章中，你将发现自己在渗透测试时可能面临的问题，以提供真实场景来磨练和完善你的渗透测试能力。在本书中，你将读到一种新的渗透测试方法论，该方法解释了一个针对内部专业安全测试团队的真实企业场景。\n\
  \n## 通过本书的 10 个章节，你将学习到以下内容：\n\n### 第 1 章 - 渗透测试基础\n本章将解释渗透测试的基础知识，然后深入探讨为安全测试搭建\
  \ `Kali Linux` 环境的设置，旨在为学习者提供大量最新的伦理黑客工具，并使他们能够使用虚拟实验室环境进行实操模拟。\n\n### 第 2 章 渗透测试实验室\n\
  本章将帮助你搭建目标环境，供研究人员使用 `Kali Linux` 练习他们的黑客技能。\n\n### 第 3 章 - 熟悉 Kali Linux\n本章将帮助学习者适应新搭建的\
  \ `Kali` 环境，并帮助他们熟悉环境、进行导航以及执行基础任务，如启动系统、启动和停止服务等。\n\n### 第 4 章 - 理解 PT 流程阶段\n本章将向读者介绍渗透测试过程方法论的各个各个阶段。\n\
  \n### 第 5 章 - 规划与侦察\n本章将帮助理解渗透测试的范围，并对目标机器进行主动和被动侦察，以获取有关目标系统的价值见解。\n\n### 第 6 章\
  \ - 服务枚举与扫描\n本章的重点将是利用侦察阶段收集的智能，进一步枚举并扫描目标系统以发现是否存在安全问题。\n\n### 第 7 章 - 漏洞研究\n在本章中，你将理解如何进一步完善收集有关目标漏洞的见解，利用内置工具和专门用于漏洞研究的在线资源来寻找利用代码。\n\
  \n### 第 8 章 - 利用\n在本章中，你将通过利用系统中识别出的安全弱点来检验所有知识，获取访问权限，并努力获得目标系统的特权访问。\n\n### 第\
  \ 9 章 - 后利用\n本章将深入探讨后利用主题。此阶段执行的活动将利用在目标系统上获得的初始访问以及在章节中获得的信息，通过获取管理权限来完全接管目标系统。\n\
  \n### 第 10 章 - 报告\n在本章中，你将理解构成良好的渗透测试报告的基础知识，并使用测试期间收集的数据和证据创建一个示例报告。\n\n## 下载彩色图片：\n\
