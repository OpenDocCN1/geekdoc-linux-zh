  \n![](img/Figure-5.10.jpg)\n\n**图 5.10：** Joy 登录界面\n\n实验室中的下一个目标是‘Joy’，它的控制台显示了一个图形登录界面，其中高亮了用户名\
  \ `patrick`。\n\n在实验中，我们将使用 Kali Linux 提供的一些工具对网络目标进行侦察，像上一个目标一样，我们将首先对实验室网络进行 ping\
  \ 扫描，并识别分配给目标机器的 IP 地址。\n\n我们将使用 `Nmap` 工具对网络进行 ping 扫描，该工具用于目标系统的网络发现、指纹识别和基础安全审计。\n\
  \n![](img/Figure-5.11.jpg)\n\n**图 5.11：** 使用 `nmap` 对网络进行 ping 扫描\n\n上方截图显示的 `nmap\
  \ -sP <range of IPs >` 命令通过向指定范围内的每个 IP 地址发送一系列 ping 请求（ICMP 回显）执行 ping 扫描。响应请求的\
  \ IP 地址将显示出来。在截图中可以看到 Joy 机器的 IP 地址 `10.0.2.15` 及其端口。\n\n![](img/Figure-5.12.jpg)\n\
  \n**图 5.12：** 使用 `map` 对网络进行 ping 扫描\n\n\n\n\n在 Kali Linux 系统上，从程序坞打开终端窗口，我们将使用一种不同的技术来识别分配给目标机器的\
  \ IP 地址，我们将利用地址解析协议（简称 ARP）来实现这一点，`arp-scan` 工具通过指定的网络接口发送 ARP 数据包，以识别所有活跃的 IP 地址。\n\
  \n**注意：** 地址解析协议是不可路由的，因此利用该协议的扫描只能用于识别与 Kali 主机直接连接的网络上的主机。\n\n**提示：** 由于 ARP 是一种第\
  \ 2 层协议，即使目标阻止了 ICMP 回显请求，ARP 扫描仍然可以识别出活跃目标。\n\n![](img/Figure-5.17.jpg)\n\n**图\
  \ 5.17：** 使用 `arp-scan` 进行网络扫射\n\nKioptrix5 目标已上线并正在使用 IP 地址 `10.0.2.104`。\n\n在下一步中，我们将运行带有\
  \ `-sS` 和 `-A` 标志的 `Nmap`。`-sS` 代表 SYN 扫描，也称为“*半开放*”扫描。该标志指示 `Nmap` 发送一个 TCP SYN\
  \ 数据包并尝试打开目标端口上的连接。如果目标是是的，目标端口应返回 SYN/ACK 数据包，然而 `Nmap` 并没有发送 ACK 数据包来与端口建立 TCP\
  \ 连接，而是发送一个 TCP RST 数据包来断开连接。这种类型的扫描通常比 TCP 连接扫描（`-sT`）速度更快，因为 TCP 连接是被断开而不是建立的。\n\
  \n`-A`（激进模式）选项在单个标志下提供了一种易于记忆的多种 `nmap` 技术组合，`-A` 标志包含了操作系统检测（`-O`）、版本扫描（`-sV`）、脚本扫描（`-sC`）和示踪（traceroute\
  \ 跟踪路由，`--traceroute`）功能。\n\n![](img/Figure-5.18.jpg)\n\n**图 5.18：** nmap 半开放扫描\n\
  \n我们可以观察到目标是一个 FreeBSD 机器，拥有 2 个开放的 TCP 端口。端口 80 和 8080 都运行着 Apache 2.2.21 HTTP\
