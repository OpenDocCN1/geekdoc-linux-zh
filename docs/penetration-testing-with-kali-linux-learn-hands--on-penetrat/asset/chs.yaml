  \n## 测试方法论\n\n本章涵盖了报告阶段的重要性、理解报告的不同类型利益相关者，以及在渗透测试任务过程中遵循的通用准则和禁忌。\n\n我们还展示了书中经过测试的两个目标主机的示例报告，读者可以将其作为模板，以整洁、简洁且有组织的方式将他们的发现提交给客户。\n\
  \n## 第一阶段：范围与规划\n\n此调查的目标是识别目标系统、预计时间范围以及完成所需的工作量。\n\n在范围与规划阶段建立以下内容：\n\n1. 测试范围内的系统列表。\n\
  2. 测试时间线。\n3. 测试窗口。\n4. 测试限制或局限。\n5. 关键人员和利益相关者列表。\n6. 上报矩阵。\n7. 识别可能干扰扫描的防火墙/IDS/IPS/APT\
  \ 系统。\n8. 向相关的 IT、管理员和安全人员沟通测试窗口，以便监控扫描并保持警惕。\n9. 来自公司政策或标准（如 ISO/IEC 27000、PCI-DSS\
  \ 等）的合规要求。\n\n**注意：** 在此阶段不对目标系统进行扫描。此阶段通过建立项目计划、交付物、时间线、项目协调员和团队为整个活动奠定基础。\n\n\
  ## 第二阶段：信息收集与侦察\n\n在测试的此阶段，收集目标主机的信息，以识别目标主机的性质/行为（如 Web、邮件、文件、打印服务器、网络设备、交换机、入侵检测/防御系统等）。\n\
  \n首先对系统进行端口扫描，并识别开放端口运行的服务，以构建目标系统开放端口及对应服务的完整视图。\n\n\n\n\n2. 识别开放端口后运行的服务。\n3.\
  \ 识别目标主机上运行的操作系统。\n4. 使用公开信息构建指纹。\n\n## 第 3 阶段：服务枚举与扫描\n\n此阶段利用之前阶段收集的信息，映射出进入服务的各种入口点。使用各种自动化工具和手动技术对潜在入口点进行进一步扫描，以识别与目标主机相关的潜在漏洞。\n\
  \n可能会使用不同的工具集进行重复扫描，以确保足够的扫描范围，并最大限度地减少误报或漏报的情况。\n\n## 第 4 阶段：漏洞研究\n\n此步骤的目标是理解并研究目标系统上识别出的漏洞。这是一个手动阶段，涉及搜索离线和在线漏洞数据库、安全论坛、安全门户、代码仓库、邮件列表、博客等，以识别所发现漏洞的可利用性。\n\
  \n此阶段与之前一样，可能需要对漏洞进行重新验证，以提高测试的准确性。\n\n## 第 5 阶段：利用\n\n渗透测试的此阶段专门关注通过利用上一阶段识别出的漏洞获取目标系统的访问权限。\n\
  \n通过手动技术和自动化利用框架相结合，对目标识别出的漏洞进行利用，以获取敏感数据或获得目标系统的交互式 shell 访问。\n\n## 第 6 阶段：报告\n\
  \n此阶段涉及对之前阶段收集的所有数据和证据进行关联，并将信息汇成一份有意义的文档，同时考虑各种类型的技术和非技术受众。\n\n执行摘要章节专门设计用于为非技术受众提供活动的高级视图，以及可以用于缓解漏洞的适用非技术措施。\n\
  \n技术总结章节针对精通技术的用户设计，展示了在目标主机上识别的实际漏洞及其影响，报告中提到的漏洞包含详细的技术建议和参考，以帮助技术人员进行有效的修复。\n\n\
  ## 标准定义\n\n就本文档而言，应考虑以下标准定义：\n\n`Vulnerability`：系统安全程序、设计、实现中的缺陷或弱点，在意外或故意被利用时，允许攻击者获得对系统或敏感数据的任何形式的未经授权访问。\n\
  \n`Threat`：潜在的负面行为或事件，会对计算机系统或应用程序产生非合规的影响。\n\n`Risk`：不利事件发生的概率以及该事件对组织造成的潜在影响。\n\
  \n## 严重程度分\n\n`High`：可以直接或间接导致目标主机被攻破的漏洞。此类攻破的示例包括允许以下操作的漏洞：\n\n- 服务中断。\n- 未经授权的代码执行。\n\
  - 未经授权的敏感数据窃取、修改或删除。\n\n`Medium`：可以导致主机被攻破的漏洞，但不能单独实现。需要注意的是，中等风险漏洞可以与其他中等和低风险漏洞结合以获取优势并攻破主机。\n\
  \n中等风险漏洞的示例是：\n\n- 敏感数据泄露，如内部 IP 地址和主机名。\n- 服务配置文件或系统数据的泄露。\n- 提供有关安全控制的信息，导致其有效性受到不利影响。\n\
  \n`Low`：提供有关主机或其运行环境的过多信息的漏洞，使攻击者/恶意用户能够进一步扩大对目标系统的访问权限。\n\n低风险漏洞的示例如下：\n\n- 服务横幅（Banner）泄露版本信息。\n\
  - 默认系统服务。\n- 不安全的协议。\n\n## 执行摘要\n\nSecTest 的顾问受聘对 ClientCorp 确定的两个系统进行渗透测试。此次测试的目的是评估范围内系统的安全态势，并通过主动识别安全问题来提供安全保障。\n\
  \n本次练习识别出的问题已通过验证，以消除任何误报，其安全问题已根据其严重程度进行了分级。\n\n本报告包含了 ClientCorp 可以采纳以缓解此处识别出的问题的策略和战术建议。\n\
