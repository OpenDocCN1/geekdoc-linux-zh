  \n本章涵盖了用于映射本地攻击面、执行权限提升攻击以及目标系统漏洞的各种工具和技术。\n\n我们深入研究了行业中用于获取目标主机管理权限的自动化和手动技术。\n\
  \n下一章将重点记录在目标主机上识别的各种漏洞、所识别漏洞的风险和影响、渗透测试期间执行的活动概述，以及修复所识别漏洞的建议。\n\n## 问题\n\n1. 我们在\
  \ `tail` 命令中使用哪个标记来增加显示的行数？？\n2. 我们在 `find` 命令中使用哪个标记来跳出命令限制并获取 shell 访问权限？\n3.\
  \ 我们使用什么命令和标记在 Kali 和目标系统之间传输文件？\n4. 我们使用哪个脚本对目标主机执行了自动化的本地权限提升检查？\n\n# 第 10 章\n\
  \n## 报告\n\n在之前的五个章节中，我们处理了执行渗透测试的技术方面，过程从识别网络上的目标系统开始，最终在上一章中获得了管理权限。在我们的旅程中，我们学习了测试每个阶段使用的各种工具和技术。\n\
  \n现在测试的技术阶段已经结束，我们需要学习报告这一至关重要的课题，它涉及到将我们在之前的章节中识别出的问题记录成具有操作性、简洁且最重要的是易于理解的报告。\n\
  \n## 结构\n\n本章的重点将分解并解释渗透测试报告的核心组成部分，从而使读者能够简洁地将整个渗透测试的精髓捕捉到报告中，报告包含以下内容：\n\n*  \
  \ 项目详情。\n*   范围和限制。\n*   实战规则（Rules of engagement）。\n*   测试过程的细节。\n*   活动的多维度视图。\n\
  *   从战略和战术角度缓解识别出的安全问题的高低级建议。\n*   渗透测试的准则与禁忌\n\n## 目标\n\n读完本章后，你将能够：\n\n*   理解不同的利益相关者及其需求。\n\
  *   理解报告的不同部分。\n*   创建渗透测试报告。\n*   进行报告演练和讨论。\n*   学习执行渗透测试的准则和禁忌。\n\n让我们开始吧。\n\n\
  ## 报告\n\n渗透测试的这一阶段对大多数读者来说可能有些枯燥无味，但它具有至关重要的意义，因为这是最终交付成果，展示了测试人员的工作，并证明了客户对整个项目的投入是合理的。简单来说，任何咨询项目的优坏取决于其产出的交付物。\n\
  \n最初，理解最终消耗渗透测试报告的大类利益相关者是极关重要的，采用这种以消费者为中心的方法将帮助我们制定并生成一份满足他们个人需求并为他们提供价值的文档。\n\
  \n## 利益相关者\n\n在任何渗透测试项目或执行过程中，根据性质、敏感性和业务案例，可能会涉及多个利益相关者和方。为了成功执行，了解与每个人的实战规则至关重要，并从整个练习中获得最大收益。以下是解释的一些关键利益相关者：\n\
  \n**执行管理层：**\n\n这类受众通常由 CXO 以及业务或垂直部门负责人组成，其中大多数可能并不精通技术。报告应包含一个专门的技术章节，总结整个项目并提供高层概述。报告应采用基于风险的方法，以便对控制措施的实施进行优先排序。\n\
  \n**技术人员：**\n\n小组由来自基础设施、网络、应用、开发和信息安全团队等各个团队成员组成，他们通常负责目标的部署和维护。该小组成员还负责渗透测试中建议的纠正措施。报告应包含一个专门的技术部分，详细展示目标上发现的每一个安全问题，以及确切的位置，如端口、协议、服务、资源位置等。报告应通过具体的建议强调每个漏洞的影响。\n\
  \n**审计员和监管人员：**\n\n这组人员通常负责监督组织对安全策略和行业法规的合规性。该小组的核心重点是检查是否由合格的测试人员按照行业标准定期进行安全测试。报告应包含一个详细说明测试范围、测试限制、测试窗口、时间表和详细方法，以及测试期间使用的任何测试框架。本章接下来的几页将展示由名为\
  \ `SecTest` 的虚构组织为另一个虚构客户 `Client Corp` 创建的示例报告，该报告范围涵盖了我们在之前的章节中测试的目标机器 `Kioptrix:5`\
  \ 和 `Mumbai:1`。\n\n## 渗透测试的准则与禁忌\n\n渗透测试可能是一项相当艰巨的任务，犯错甚至遗漏步骤、任务是非常常见的。以下是一份你可以随手保留的准则和禁忌列表作为开始；尽管如此，这并不是你想要遵循的唯一有限列表，该列表应被看作是护栏和最佳实践，是我们根据过去几十年运行许多渗透测试项目的经验所推荐的。\n\
  \n列表可能会根据每个项目的范围和限制而变化，因此，更有用的可能是为你的每个项目挑选选择相应的指令。\n\n## 准则\n\n**始终优先考虑你的风险因素：**\n\
  \n\n\n\n\n安全团队和专业人员在进行任何活动、实施或测试时，遵循风险规避原则是一项通用的惯例，渗透测试也不例外。作为一名渗透测试员，你必须评估与目标或多个目标相关的潜在风险，这些风险可能与组织、其业务、IT\
  \ 资产、人员及其流程有关。在尝试评估风险时，你必须努力寻找一旦被利用后可能构成严重威胁的区域。\n\n确定可能用于攻击系统的最常见方法。这些可能包括组织的敏感数据、源代码、财务记录、人员数据等，重点关注你认为对手可能针对的且对他们更有价值的方面。同时，如果只关注超级关键项目将是一个大错误，因为你可能会遗漏其他可能包含低挂漏洞的区域或资产，这些漏洞可以被用来获取初始脚点，并借此进行横向移动。\n\
  \n### 保持更新\n\n不言说，进行渗透测试极具挑战性，特别是当受到时间限制时，这就是为什么在执行过程中保持良好状态并集中注意力至关重要。保持速度的最佳方法是通过充分练习各种工作中常用的工具和技术，将流程完全融入骨化，这不仅能提高测试速度，还有助于产生准确精确的结果。作为渗透测试员，你必须意识到行业内使用的最新工具和技术。像攻击者一样思考，预测并遵循攻击者可能遵循的技术。市上有大量的商业、开源和免费工具可用，请明智地选择你的工具。\n\
  \n根据你将用于执行的技术、资产类型以及你想要执行的深度来规划工具。利用自动化来加速渗透测试工具期间的大量任务处理，这不仅可以提高扫描速度，还有助于你在执行多次扫描时保持一致性。\n\
  \n### 报告编写的重要性\n\n我从以前的一份工作中学学习过一句话：“除非文档完整，否则一切都是不完整的”。编写报告以及在其中准确捕获所有内容始终是至关重要的。作为渗透测试员，你有责任在最终报告中突出所有内容，不经过滤地写下你发现的情况，并遵循设定的格式（我们在本章稍后的部分分享了其中一种格式作为示例）。注意细节，确保你在报告中为不同的利益相关者创建了不同的章节。例如，执行摘要（Executive\
  \ summary）部分供决策者查看，作为展示高层发现和简要总结的快照；更详细的技术部分供运营和资产利益相关者阅读，以便他们进行修复。从你的发现中删除任何误报（false\
  \ positives），只保留有意义的内容。不要为了让报告看起来更大而填充错误和无意义的数据。要求是展示真实的发现，而不是一个更大的报告。要准确、具有描述性，并针对你发现的缺陷和问题提供修复建议。\n\
  \n### 修复发现的结论\n\n渗透测试的目标是发现并最终修复目标环境中的安全弱点，应该应当将修复阶段合作工作的重要性考虑在内。测试人员应尽力与修复团队合作，帮助他们理解报告并充分掌握发现，以便他们正确实施纠正措施。通常，报告没有被正确理解，导致修复没有得到有效实施，或者更糟，由于缺乏理解而被忽视。\n\
  \n一旦修复完成，必须重复渗透测试以检查已识别问题是否已关闭。集中的重测是不可的，因为它有助于检查在系统上实施的修复措施是否真正有效。\n\n### 确保备份你的所有数据\n\
  \n在开始渗透测试之前，备份所有基本和关键数据、配置、应用程序快照、服务器始终是一项最佳实践。你还必须充分考虑存储在数据存储、数据库中的共享文件，这些文件可能在测试范围内。如果你计划扫描或测试托管代码仓库的系统和应用程序，必须对源代码文件给予适当重视。备份最重要的资产之一是活动目录（Active\
  \ Directory）和域控制器（Domain Controllers），如果它们在范围内，并且你计划运行各种身份相关的测试。\n\n### 不要做（Don'ts）\n\
  \n渗透测试员很容易沉浸在测试中，以至于忘记或绕过为任务设置的边界，或者为了获得结果而采取绕过或回避某些必须遵循的规则。这是极其危险的，会无意中给测试人员和组织带来严重后果。\n\
  \n让我们来看看你作为渗透测试员绝不能做的事情，并在整个执行过程中时刻记住这些点。\n\n### 不遵守伦道德\n\n渗透测试常用的替代术语是“伦理黑客”（Ethical\
  \ Hacking），这是所有测试人员应该牢记的一这一点。在履行测试职责时，不能表现得不专业或不合道德。在测试期间，你可能会遇到一些敏感的个人、财务或其他受限数据。你必须始终遵循参与规则（rules\
  \ of engagement）来处理此类暴露，并向组织内部的相关高层咨询你的所有发现，而不是为了以后的个人利益保留或隐藏此类信息。黑客的伦理部分是你获得项目的原因，也是帮助组织与`测试人员/测试团队`之间建立信任的唯一纽带。\n\
  \n### 不接受测试结果\n\n在测试期间，你可能会遇到尝试了所有已测试方法、工具和利用技术后没有任何发现的情况。这非常正常，你必须接受它，这可能是由于各种原因，最简单的可能是系统确实安全并经过了补丁处理，实施了适当的反制措施。没有发现任何缺陷并不反映测试人员或测试团队的能力不足或效率低下。相反，这证实了你为了发现缺陷没有遗漏努力，并且发现它是真正安全的。测试人员必须将情绪排除在工作中，渗透测试不是测试你的能力，而是相反。\n\
  \n另一方面，事实也是如此，如果你在多个阶段持续没有发现任何东西，那么可能是时候改变方法、工具或技术了，或者可能是系统知识方面存在缺失，这些也必须进行评估。不要太安逸，要找到平衡并根据具体情况进行分析。\n\
  \n### 不遵守项目范围\n\n我确定，作为渗透测试员，你被赋予任务或付费是为了打破规范、现状，甚至是系统的标准规则，就像任何攻击者会做的那样。但如果没有仔细考虑，你可能会做得过头，并可能执行了约定范围内未经授权或许可的行为。\n\
  \n\n\n\n\n尽管渗透测试的工作是模拟攻击者如何执行其职责，但你必须保持在设定的测试范围内，尽管发现漏洞、运行利用程序来攻破并接管目标可能非常有诱惑力。不要执行任何你未获得明确授权执行的操作。必须记住，测试通常是在生产系统上运行的，测试人员任何疏忽行为都可能导致现实世界的影响。\n\
  \n务必确保在每次测试之前，双方已对测试规则（rules of engagement）达成一致，或者作为内部团队的框架，并且在任何情况下都不应违反这些规则。\n\
  \n## 不要让测试计划不频繁，或仅为了满足合规性要求而进行测试：\n\n组织通常遵循每年仅进行两次测试的惯。\n\n这样做是因为他们仅仅意图满足组织政策或监管要求提出的合规性要求。如果你偶尔进行测试，那么你的测试很可能无法充分覆盖所有的潜在安全弱点。虽然维持合规性非常，但在任何阶段，这都不应该是执行渗透测试的唯一理由。\n\
  \n记住，攻击者在攻击目标系统时不必遵守任何合规性要求，那么为什么组织要把自己限制在合规性要求之内？渗透测试的主要驱动力始终应该是发现安全漏洞和弱点并在它们被攻击者针对之前修复它们，而不仅仅是因为你要维护合规并满足审计员。不频繁或不规则的测试无法为实际情况提供任何可见，因为测试结果仅在测试时有效，且仅反映测试时安全状态的快照，无法显示在此期间可能发生什么。这种方法通常会导致环境在测试之间存在漏洞，除非你持续寻找。\n\
  \n## 未授权工具和脚本的使用：\n\n作为渗透测试人员，我们大多数都可以访问许多用于工作的免费、开源和商业工具。我们还可以访问其他研究人员自定义开发的脚本或工具，尽管这些工具或脚本可能很好并让测试人员的工作更容易，但对我们来说，确保了解这些工具实际的作用至关重要。这些工具的预期结果是什么？它们是否符合我们的测试规则？在完全理解其工具及其影响之前，你不应该使用任何工具、脚本或命令。你可能会在无意或非故意的情况下导致系统。务必确定你正在使用的工具，并且这些工具已经过你组织或客户的测试、验证和授权。在某些情况下，由于缺乏经验或知识，客户或你的组织无法验证这些工具，那么你作为测试人员应该足够专业，自己进行这些验证并确保使用正确的工具集。渗透测试人员的专业性始终是重要的。\n\
  \n# 结论\n\n本章涵盖了报告阶段的重要性、理解报告的不同类型利益相关者，以及在渗透测试任务过程中遵循的通用准则和禁忌。\n\n我们还展示了书中经过测试的两个目标主机的示例报告，读者可以将其作为模板，以整洁、简洁且有组织的方式将他们的发现提交给客户。\n\
