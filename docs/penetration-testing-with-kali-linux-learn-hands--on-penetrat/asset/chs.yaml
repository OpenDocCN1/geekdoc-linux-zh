  \n## 影响\n\n上述应用程序包含若干已知的安全问题，例如拒绝服务、目录遍历和远程代码执行。恶意攻击者可以利用这些漏洞导致服务中断、获取敏感文件访问权限并在目标上执行任意代码。\n\
