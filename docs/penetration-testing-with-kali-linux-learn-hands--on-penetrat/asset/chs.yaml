  \n\n\n\n让我们从对 `test.php` 页面上的查询参数进行模糊测试（fuzzing），以发现其可能存在的任何漏洞。\n\n**提示：** 你可以在\
  \ `/usr/share/wfuzz/wordlist/` 目录下找到 `wfuzz` 工具所使用的各种字典文件（wordlists）。请花时间探索这些提供的各种字典文件。\n\
  \n打开终端窗口并输入以下命令开始模糊测试：\n\n```bash\nwfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt\
  \ -d \"query=FUZZ\" http://10.0.2.6:8000/test.php\n```\n\n![](img/Figure-7.37.jpg)\n\
  \n**图 7.37：** 对 test.php 页面的查询参数进行模糊测试\n\n你可能会注意到服务器返回了大量的假阳报，服务器响应的共同属性如下：行数 =\
  \ 1，单词数 = 4，字符数 = 26。我们将根据这些计数来过滤服务器响应，因为任何偏离已知模式的偏差都意味着攻击可能成功，且该响应值得进一步调查。\n\n\
  我们将重新运行命令，并添加额外的 `--hl/hw/hc` 标志来过滤服务器响应。\n\n为了示例说明，我们将使用 `--hw` 标志过滤服务器响应：\n\n\
  ```bash\nwfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt -d \"query=FUZZ\"\
  \ --hw 4 http://10.0.2.6:8000/test.php\n```\n\n![](img/Figure-7.38.jpg)\n\n**图 7.38：**\
  \ 过滤假阳性结果\n\n看起来 `test.php` api 中的查询参数可能受到使用符号 `;`、`|` 和 `%0a`（“回车”键的 URL 编码表示）的命令注入攻击。\n\
