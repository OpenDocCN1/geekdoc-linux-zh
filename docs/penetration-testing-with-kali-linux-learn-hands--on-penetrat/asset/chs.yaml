  \n有关 BPB 的更多信息，请访问 [www.bpbonline.com](http://www.bpbonline.com/)。\n\n# 第 1 章：渗透测试基础\n\
  \n渗透测试（Penetration Testing）术语通常也称为 pen-testing 或 `PT`，在行业内已存在数十年，通过成为更大型 IT 安全体系中至关重要的一部分证明了其重要性。它是一种攻击模拟练习，在此期间，安全专业人员尝试识别、枚举并攻击应用程序、基础设施、网络或任何其他\
  \ IT 设备中的漏洞，并利用这些漏洞获取访问权限，并在组织的信息环境中建立立足点。\n\n此类模拟攻击的目的是确定安全实现或边界防御机制中的漏洞，这些漏洞可能会被有别动机的未授权实体所利用。\n\
  \n## 结构\n\n在本章中，我们将涉及以下主题：\n\n*   渗透测试及其类型。\n*   渗透测试的必要性和重要性。\n*   参与前的活动和阶段。\n\
  *   安装 `VirtualBox`，设置实验室网络并导入虚拟机。\n\n## 目标\n\n读完本章后，你将能够：\n\n*   概述渗透测试的基本理论和常用行业术语。\n\
  *   理解渗透测试的类型。\n*   概述渗透测试中包含的活动。\n*   拥有一个可用的 `Kali` 配置，用于执行后续章节中所示的操作。\n\n## 什么是渗透测试？\n\
  \n渗透测试不要与`漏洞评估`（Vulnerability Assessment，`VA`）混淆（`VA` 限于枚举漏洞，而不深入挖掘已识别漏洞的利用），尽管\
  \ `VA` 可能是渗透测试的前身，但它并不是绝对要求，因为渗透测试可以在需要或不需要预先执行 `VA` 的情况下进行。\n\n渗透测试可以有许多不同的方式，取决于项目的需求和范围，但广义上，典型的渗透测试任务始于安全专业人员收集范围内的目标信息，对目标进行探测以发现托管的服务，然后系统地检查这些服务以识别其安全弱点。随后，对识别出的弱点进行研究和评估，以分析风险评分、利用可用性、技术、可靠性和潜在影响。然后，测试人员尝试使用所选漏洞获取对范围内目标的访问。如果利用成功且攻击者能够在系统上建立立足点，安全测试人员将确定可用的访问级别，并进一步枚举系统，以尝试识别安全问题、配置弱点或敏感信息，这些信息可能帮助他们进一步提升本地或范围内任何互联目标上的访问级别。大多数阶段并不是顺序执行的，因此测试人员可能根据需要这些阶段之间来回移动。最后但同样重要的是，在整个渗透测试期间，对所有阶段的所有活动进行记录是至关重要的。这包括：扫描类型、工具命令、观察结果、初始发现、存在哪些漏洞、每个系统是如何被利用的。渗透人员要求在报告阶段提供所遵循的整个过程的详细说明以及支持性证据。\n\
  \n## 渗透测试的参与前活动\n\n与任何测试不同，渗透测试具有非常明确的阶段。但根据初始观察结果，测试人员和研究人员可能会通过合并或偏离通常设定的流程来开发自己的测试方法。这将取决于与客户商定的测试信息和范围。本书的重点将是介绍行业中广泛遵循的标准渗透测试流程，以测试基础设施和\
  \ Web 应用程序资产。本书将不涵盖无线和物理渗透测试。\n\n**范围定义**：当您计划进行任何渗透测试活动时，测试人员与请求测试方之间定义并同意范围是非常重要的。可以定义的信息包括：执行测试的位置、IP\
  \ 范围、系统细节和应用程序名称以及用于测试的 URL。执行测试需要遵循的时间安排是什么？在上述和定义的窗口内进行测试活动非常重要，以避免关键系统出现任何意外或偶然的停机（除非客户明确说明不受任何测试时间和窗口的限制）。除了范围内的内容，在必要情况下，合同中定义范围之外的内容（暴力破解、拒绝服务攻击和攻破后的活动，如\
  \ Shell 上传、本地漏洞评估或权限提升）也是同样重要的。\n\n**升级点**：您的合同中应该定义一个升级点，即在整个过程中可能发生任何事件时应联系谁。可以根据定义的渗透测试窗口遵循升级树。\n\
  \n**法律条款**：在某些情况下，安全测试人员可能需要包含一些关键的法律条款，例如谁授权执行渗透测试、何时以及执行什么。特别是在被测试系统并非由要求测试的方托管的情况下。执行测试的许可必须是书面形式（纸质或数字）。以避免出现以下情况：如果客户系统检测到活动并将其标记为入侵，授权人员可以干预并破例。否则，在大多数国家，这可能被视为受法律惩罚的入侵尝试。\n\
  \n## 渗透测试的阶段\n\n渗透测试是一项复杂的练习，涉及多种类型的活动，包括探测、扫描、发现和研究漏洞以及获取访问权限，这些活动根据目标类型以及测试过程中获得的知识进行选择。\n\
  \n在没有化方法的情况下进行测试会带来有关测试覆盖、时间管理和成本超出的各种风险。为了避免这些问题并为混乱带来秩序，该练习被拆分为不同的阶段，这允许测试人员在测试期间组织他们的思想和努力。\n\
  \n下面我们将介绍一个渗透测试中包含的典型阶段：\n\n# 信息收集\n\n\n\n\n在信息收集阶段，研究人员会进行搜索以收集和汇总公开可见的信息，例如域名搜索、`whois`\
  \ 查询、反向 DNS 以及类似信息。在某些情况下，你可能需要采用专门的高级搜索技术来寻找有关目标组织的敏感信息，例如 Google Dork。\n\n# 侦察与扫描\n\
  \n在侦察阶段，测试人员倾向于使用特定的高级工具和技术，通过使用探测工具来获取进一步的信息，例如使用 `Nmap`（书中稍后将对其详细介绍）来扫描网络，或使用任何漏洞扫描工具（如\
  \ `Nikto`）。基于 `Nmap` 或类似工具的结果，渗透测试人员还将尝试查找系统上运行的操作系统 (OS) 和服务类型、可用的开放共享，以及关于目标的许多其他详细信息。\n\
  \n# 漏洞研究\n\n此阶段涉及对之前测试阶段识别出的所有潜在问题进行研究。测试人员需要筛选所获得的所有信息，以识别并精炼可操作的漏洞，这些漏洞对于获取目标访问权限非常有用。\n\
  \n# 利用与获取访问\n\n在此阶段，渗透测试人员将尝试根据收集的信息以及他们从扫描和侦察阶段识别出的漏洞，对目标运行漏洞利用。通常，研究人员会尝试使用 Web\
  \ 应用程序攻击、网络攻击，可能还会尝试使用某些后门，有时还会使用自定义的利用程序，以获取目标的访问权限。\n\n# 后利用与维持访问\n\n此阶段通常被称为后利用阶段。此时，测试人员可能已经获得了系统的完全访问权限（该系统原本由特权访问控制），或者可能会尝试提升到更高的权限级别，有时还会尝试渗透到网络中下一个可用系统。\n\
  \n# 文档记录与报告\n\n这是整个渗透测试过程中最后也是最重要的阶段，绝非如此。因为如果文档不完整，工作永远是不完成的。在此阶段，测试人员需要汇总所有与漏洞、问题、缺失配置、可能泄露敏感数据的公开信息相关的信息，并将其汇成一份报告，其中包含执行摘要、技术总结和修复建议。\n\
  \n# 渗透测试的类型\n\n渗透测试可以在不同的场景下进行，这些主要由你的测试范围驱动。\n\n## 内部测试\n\n这是通过与内部边界内的团队协作进行的，且无论是否完全了解目标基础设施都可能进行。在大多数情况下，这种测试将模拟内部攻击场景。根据要测试的攻击场景类型，客户可能会决定提供给测试人员的访问权限，这种访问范围可能从简单的网络访问到授权用户不等。内部测试是为了检查安全相关流程和基础设施抵御内部威胁的韧性。\n\
  \n## 外部测试\n\n外部渗透测试正如其名，用于评估面向外部的 IT 资产安全性，例如公司门户、电子邮件服务器、Web 服务器、DNS 服务器、文件服务器、云资源或任何其他面向公众的信息资产。这些测试通常从客户网络之外的远程位置进行。这种形式的测试是为了从防御任何对手发起的外部攻击的角度，检查安全相关流程和基础设施的有效性和韧性。\n\
  \n## 黑盒、白盒与灰盒测试\n\n黑盒渗透测试是一种参与场景，不向渗透测试人员提供任何关于目标或访问的预先信息，渗透测试人员的责任是通过对公开信息的侦察来收集有关目标的所有信息。这种形式的测试试图模拟真实的攻击场景，即对手在没有任何预先信息的情况下利用公开信息构建关于目标的战术知识。黑盒渗透测试需要花费大量时间来绘制目标映射。预计顾问将对侦察期间识别的资产获得确认，以消除任何误报。黑盒方法并不总是可行，因为时间投入的大幅增加会导致项目成本上升；黑盒测试的另一个缺点是目标的所有在线资产可能无法被发现，可能导致测试覆盖不完整。\n\
  \n在白盒渗透测试任务中，完整的信息——如软件架构、应用程序逻辑、源代码、网络架构图、IP 地址方案、操作系统、平台或设备配置文件等——将提供给渗透测试人员，这导致了最全面的测试覆盖，因为渗透测试人员可以识别出许多漏洞和安全配置错误，这些漏洞对于外部攻击者来说是不可见的。这类测试通常需要大量时间，因为白盒方法需要进行大量的分析评估。此类测试在开发阶段或应用程序及基础设施资产发布到生产环境之前进行。\n\
  \n灰盒渗透测试正如其名，是一种结合了黑盒和白盒渗透测试特征的参与方法。测试人员会被提供有关目标应用程序或基础设施的常见信息，这涵盖了如 `URL`、IP 地址、所使用的技术、有限的访问凭据等细节。提供给渗透测试人员的这些信息显著减少了测试人员需要的时间、分析和猜测，因为它有效地消除了黑盒和白盒测试方法中对详细侦察以及源代码/配置/逻辑/架构分析的需求。\n\
  \n# 搭建渗透测试实验室\n\n现在你已经对渗透测试及其各种活动和子活动有了相当的了解，下一个逻辑步骤是搭建用于执行渗透测试的实验室环境。为了本书的目的，我们将使用各种开源工具、软件、虚拟机和目标机器。\n\
  \n我们的实验室将基于 VirtualBox `https://www.virtualbox.org/`，并使用 Kali Linux `https://www.kali.org/`\
  \ 作为我们的渗透测试工具集。\n\n## Setup VirtualBox\n\n为了本书的目的，你将使用 Oracle VirtualBox（开源）来构建我们的虚拟渗透测试实验室。（在编写本书时我们使用的是\
  \ 6.0 版本，但在你计划构建自己的实验室时，可以使用可最新版本）\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1:** Oracle\
  \ VirtualBox 6.0\n\nVirtualBox 适用于各种操作系统，在书中我们将继续使用 Windows 版本。二进制文件可以从此处下载：`https://www.virtualbox.org/wiki/Downloads`。\n\
  \n从网页上选择 `Windows hosts` 作为 Windows 安装程序。\n\n![](img/Figure-1.2.jpg)\n\n**图 1.2:**\
  \ VirtualBox 下载页面和位置\n\n\n\n\n\n一旦成功下载了安装程序，请继续安装 VirtualBox 并按照屏幕上的指示操作。VirtualBox\
  \ 有许多实用的功能，其中一个重要功能是能够托管多个虚拟机（VM）并创建一个完全隔离于主机网络的私有网络。在某些情况下，将流量隔离在虚拟机网络内部至关重要，特别是在处理恶意软件文件、漏洞时，或者为了防止误扫描主机网络。但在我们的实验室中，我们将出于各种目的访问主机互联网，更多关于单个虚拟机的网络设置将在本章节的后续部分详细介绍。\n\
  \n![](img/Figure-1.3.jpg)\n\n**图 1.3:** VirtualBox 工具菜单\n\n安装完成后，可以通过访问 `Preference`（选项）选项（你也可以按下键盘\
  \ `Ctrl+G`）来配置 VirtualBox 并执行各种配置。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4:** VirtualBox\
  \ 选项窗口\n\n## 设置 VirtualBox 网络\n\n本实验将使用 NAT 网络。要为实验创建一个 NAT 网络，请从工具菜单打开设置。从左侧面板选择\
  \ `Network`（网络）选项，在这里你可以通过选择右面板上的三个选项之一，创建新的、删除旧的或编辑现有的 `NatNetwork`。\n\n![](img/Figure-1.5.jpg)\n\
  \n**图 1.5:** Virtual NAT 网络设置\n\n双击 NAT 接口会弹出一个窗口，可以在其中配置实验网络使用的名称和 IP 范围。我们将选择名称\
  \ `NatNetwork` 以及 IP 地址范围 10.0.2.0 和 CIDR 前缀 `/24`。\n\n![](img/Figure-1.6.jpg)\n\
  \n**图 1.6:** VirtualBox 选项\n\n## 安装 Kali Linux\n\n设置和配置完成后，让我们继续按照以下说明安装 Kali Linux（我们的第一个虚拟机）。Kali\
  \ 是一个基于 Linux 的虚拟机，已针对渗透测试目的进行了预配置。书中的所有的测试和练习都是基于 Kali Linux 和其他目标虚拟机的（关于目标虚拟机的更多信息请见其他章节）。你可以从此处的父网站下载最新版本的\
  \ Kali Linux 各种镜像：**[`www.kali.org/downloads/`](https://www.kali.org/downloads/)**。在我们案例中，我们选择了\
  \ VirtualBox 作为虚拟平台，因此 Kali Linux 镜像需要与 VirtualBox 兼容，可以在此位置找到：**[`www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/`](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/)**（我们将在实验中使用\
  \ 64 位版本，如下图所示）。在编写此书时，可用版本为 2019.3。\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7:** Kali\
  \ Linux 下载\n\n一旦下载了兼容 VirtualBox 的 OVA 文件，让我们继续按照下面的说明将其设置为 VirtualBox 中的虚拟机。\n\n\
  参考上图 1.3 图中提到的 VirtualBox 工具菜单，我们将使用 `import`（导入）选项，通过指向下载的 OVA 文件位置来创建 Kali Linux\
  \ 虚拟机。按照如下图所示的屏幕指示操作：\n\n![](img/Figure-1.8.jpg)\n\n**图 1.8:** VirtualBox 导入虚拟机选项\n\
  \n点击 next（下一步）继续，下一个屏幕将显示有关虚拟机的所有参数和细节，在这里可以更改虚拟机的几个参数。选择从 OVA 提取并存储虚拟机的基础文件夹位置，完成后点击\
  \ `Import`（导入）按钮开始导入。\n\n![](img/Figure-1.9.jpg)\n\n**图 1.9:** 导入虚拟机\n\n导入完成后，它将出现在左侧面板。选择\
  \ Kali Linux 虚拟机，右面板将显示该机的选项。\n\n![](img/Figure-1.10.jpg)\n\n**图 1.10:** Kali Linux\
  \ 虚拟机详情\n\n安装完成后，继续进行网络设置，将 Adapter 1（适配器 1）连接到 NAT 网络以及你在上一步中创建的网络（如下例图截图所示）。\n\
  \n![](img/Figure-1.11.jpg)\n\n**图 1.11:** Kali 网络设置\n\n实验室中的所有虚拟机连接到同一个 NAT 网络是非常重要的，这样在网络设置完成后，它们就可以相互通信。\n\
  \n可以通过双击要启动的虚拟机名称，或右键点击虚拟机名称导航到 `Start`（启动）子菜单并选择 `Normal Start`（正常启动）选项来启动虚拟机，这样做将打开一个新窗口并启动引导过程。\n\
  \n可以通过关闭按钮并选择 `Send the shutdown signal`（发送关闭信号）来关闭虚拟机，这将向虚拟机发送 ACPI 关闭信号，从而触发操作系统中的关闭进程。\n\
  \n![](img/Figure-1.12.jpg)\n\n**图 1.12:** 关闭虚拟机\n\n在不需要关闭虚拟机的情况下，可以使用 `Save the\
  \ machine state`（保存机器状态）选项，选择这将冻结机器状态并保存到系统硬盘中，此选项等于 Windows 的休眠功能，所有打开的程序和服务将保持保持激活状态，你可以从离开的地方继续。\n\
  \n![](img/Figure-1.13.jpg)\n\n**图 1.13:** Kali 图形桌面环境\n\n现在设置已准备好进行渗透测试活动了。\n\n\
  ## 总结\n\n本章提供了渗透测试的概述、可用的测试类型以及测试阶段。本章还涵盖了 VirtualBox 的安装、网络设置以及 Kali 机的导入。\n\n\
  接下来，下一章将重点通过填充各种目标机器来扩展我们的虚拟实验室设置。\n\n# \n\n1. 解释什么是渗透测试及其重要性？\n2. 为什么渗透测试被划分为不同的阶段？\n\
  3. 设置虚拟网络使用的 IP 地址范围是什么？\n\n# 第 2 章\n\n# 渗透测试实验室\n\n在上一章中我们在虚拟环境中安装了 Kali Linux。在本章中，我们将解释如何在环境中安装目标机器，这些目标将作为故意留有漏洞的测试平台，以便安全地学习和实践真实的渗透测试技能。\n\
  \n**注意：** 虽然书中的章节安排与渗透测试的各个阶段同步，但建议在尝试下一个机器之前完成每个台机器的操作。虽然这并非强制，但这种方法可以让读者通过重复练习保持思路并充分吸收方法论。\n\
  \n## 结构\n\n在本章中，我们将学习以下主题：\n\n* 下载目标机器。\n* 在我们的虚拟环境中填充目标机器。\n\n## 目标\n\n阅读完本章后，你将能够：\n\
  \n* 在虚拟环境中导入不同类型的目标系统。\n* 拥有一个可用于执行后续章节中练习的运行实验室设置。\n\n## 目标机器\n\n书中展示的目标机器经过精心挑选，通过提供广泛的用例来最大化读者的学习体验。这是为了让读者在学习旅途中逐渐掌握各种渗透测试技能。\n\
  \n\n\n\n为了本书的目的，目标机器将从 VulnHub 下载，它是一个漏洞目标机器的开放仓库。其网站 `[www.vulnhub.com](http://www.vulnhub.com)`\
  \ 是一个可搜索的仓库，包含数百个精心制作的漏洞机器，并根据从初学者到专家的不同经验级别进行分类。\n\n在本章中，我们将学习将 VulnHub 上提供的几个目标机器安装到我们的虚拟实验室环境中。\n\
  \n![](img/Figure-2.1.jpg)\n\n**图 2.1:** `[www.vulnhub.com](http://www.vulnhub.com)`\
  \ 网站\n\n下表展示了书中涵盖的目标虚拟机：\n\n| **机器名称** | **VulnHub 页面** |\n| :--- | :--- |\n| **DC:**\
  \ 7 | **[`www.vulnhub.com/entry/dc-7,356/`](https://www.vulnhub.com/entry/dc-7,356/)**\
  \ |\n| **Kioptrix:** 2014 (#5) | **[`www.vulnhub.com/entry/kioptrix-2014-5,62/`](https://www.vulnhub.com/entry/kioptrix-2014-5,62/)**\
  \ |\n| **Digitalworld.local:** Joy | **[`www.vulnhub.com/entry/digitalworldlocal-joy,298/`](https://www.vulnhub.com/entry/digitalworldlocal-joy,298/)**\
  \ |\n| **HackInOS:** 1 | **[`www.vulnhub.com/entry/hackinos-1,295/`](https://www.vulnhub.com/entry/hackinos-1,295/)**\
  \ |\n| **Sunset:** Nightfall | **[`www.vulnhub.com/entry/sunset-nightfall,355/`](https://www.vulnhub.com/entry/sunset-nightfall,355/)**\
  \ |\n| **Mumbai:** 1 | **[`www.vulnhub.com/entry/mumbai-1,372/`](https://www.vulnhub.com/entry/mumbai-1,372/)**\
  \ |\n\n**表 2.1:** 目标机器\n\n**提示：** 目标系统通常占用几个 GB，一次性下载并安装所有镜像将减少计算机可用空间。因此，为了优化磁盘空间利用率，我们建议在开始测试之前下载并安装单个目标机器，并在完成后删除它们。\n\
  \n## 设置目标机器\n\n每台目标机器的下载链接可以通过访问 `表 2.1` 中提供的链接并浏览到页面的下载部分找到。\n\n![](img/Figure-2.2.jpg)\n\
  \n**图 2.2:** DC7 目标虚拟机设置\n\nVulnHub 网站上的虚拟机可能是压缩过的，如果是这种情况，你可能需要使用 `7-zip` 或任何你喜欢的其他工具解压相关的\
  \ zip/rar/bz2 文件。\n\n`7-zip` 是一款免费软件，可以从网站 `https://www.7-zip.org/download.html`\
  \ 下载。\n\n## 导入虚拟机目标\n\n一旦下载并解压了相关的虚拟机，就可以开始导入过程。在 VirtualBox 应用程序中点击 `file`>`import`\
  \ 或按 `Ctrl-I` 打开导入窗口，浏览到相关文件夹并点击 `.ova` 文件。这样做将填充 `.ova` 文件中的所有配置设置并将其显示在设备设置（Appliance\
  \ settings）中。然后你可以点击窗口底部的导入按钮开始导入过程。\n\n![](img/Figure-2.3.jpg)\n\n**图 2.3:** DC\
  \ 7 设置\n\n导入过程完成后，你应该能够在左侧窗格中看到新导入的机器。\n\n![](img/Figure-2.4.jpg)\n\n**图 2.4:**\
  \ DC 7 虚拟机\n\n## 导入 Kioptrix: 2014 (#5) 的特殊说明\n\nKioptrix:2014 机器设计为在 VMware 上运行，因此我们需要一些额外工作才能使其在\
  \ VirtualBox 上运行。\n\n从 VulnHub 站点下载并解压 `kiop2014.tar.bz2` 虚拟机和 `kiop2014_fix.zip`\
  \ 到文件夹中，双击 `kioptrix2014.vbox`（虚拟机定义）文件将设置导入到 VirtualBox。\n\n![](img/Figure-2.5.jpg)\n\
  \n**图 2.5:** Kioptrix 导入设置\n\n此虚拟机的机的虚拟硬盘映射错误，在使用目标机器之前需要对其进行修正，可以通过点击 IDE 主驱动器并在下拉菜单中选择\
  \ `choose a disk`（选择磁盘）选项来打开文件浏览器。浏览到并打开 `kioptrix2014.vmdk` 文件以修复问题。\n\n我们现在将配置此机器使用我们预配置的\
  \ NAT 网络，而不是开发者可能配置的任何其他内容。可以通过右键点击虚拟机名称并选择设置，或者选择虚拟机名称然后点击菜单中的设置按钮来打开虚拟机设置。一旦打开设置面板，点击左侧窗格中的\
  \ `Network`（网络）部分，并将 `attached to`（连接到）值更改为 NAT Network，在下拉列表中选择我们在 `第 1 章：渗透测试基础`\
  \ 中创建的网络名称。点击 `OK` 确认新设置。\n\n![](img/Figure-2.7.jpg)\n\n**图 2.7:** DC 7 网络设置\n\n\
  我们的目标机器现在已配置好并准备好测试。你可以使用上述相同的过程来下载和导入书中列出的其他目标机器。\n\n## 实践测试涵盖的概念\n\n在本书过程中，通过使用目标机器的不同组合，将以逐步的方式解释许多用例，以便实现最大程度的学习。\n\
  \n*   主机发现扫描\n*   端口扫描\n*   操作系统指纹识别\n*   服务识别和版本检测\n*   命令链\n*   使用 `bash` 脚本进行自动化\n\
  *   服务枚举\n    *   HTTP\n    *   SNMP\n    *   FTP\n    *   SMB\n    *   SQL\n* \
  \  从页面源代码收集价值信息\n*   模糊测试 (Fuzzing)\n*   本地文件包含\n*   目录遍历\n*   OS 命令注入\n*   通过操控用户代理绕过\
  \ Web 访问过滤\n*   远程代码执行\n*   绕过文件上传限制\n*   枚举并攻击 WordPress\n*   暴力破解在线登录表单\n*   有效载荷编码\n\
  *   漏洞研究\n    *   搜索引擎\n    *   漏洞利用网站\n    *   `searchsploit`\n    *   `Metploit`\n\
  \    *   获取反向 shell\n    *   使用 `netcat` 获取反向 shell 并传输文件\n*   使用 `fifo` 和输入输出重定向处理固化的\
  \ `netcat` 反向 shell\n*   修复受限的反向 shell 问题并升级到 TTY shell\n*   本地系统枚举\n*   SUID 二进制文件\n\
  *   使用 `sudo` 以超级用户身份运行命令\n*   内核利用\n*   滥用未身份的 TFTP 服务\n*   使用 `Metploit` 进行利用\n\
  *   使用 `PHP` 后门获取反向 shell\n*   密码破解\n*   对输入参数进行模糊测试以漏洞\n*   权限提升和获取 root\n\n我们将使用\
  \ Kali Linux 中提供的各种工具来测试上述用例，通过这种方式，读者将逐渐掌握渗透测试所需的各种实践知识。\n\n## 总结\n\n舞台已经准备好可以用于测试，在下一章中，我们将介绍如何操作\
  \ Kali Linux 虚拟机的一些方面，并熟悉一些重要的命令和常用工具。\n\n## 问题\n\n1.  我们使用什么快捷键将设备导入到 VirtualBox？\n\
  2.  描述用于我们的 kali 和目标系统之间建立网络的网络适配器？\n\n\n\n\n到为止，我们已经涵盖了渗透测试的基础知识以及行业使用的术语。我们还创建了一个虚拟实验室环境，作为一个可以让我们安全地学习和练习技能的平台。在本章接下来的内容，我们将教你如何在新安装的\
  \ Kali Linux 中操作，熟悉 Kali Linux 发行版中提供的工具和技术，以及如何有效地使用它们。\n\n## 结构\n\n在本章中，我们将涉及以下领域：\n\
  \n* Kali Linux 概述。\n* 基础账户和系统管理。\n* 软件包管理。\n* 系统操作\n* Shell 脚本\n\n## 目标\n\n读完本章后，你将能够：\n\
  \n* 浏览界面并学习有用的命令。\n* 执行与系统管理相关的任务。\n* 安装、更新和删除软件包。\n* 理解 Shell 脚本概念。\n* 使用 Shell\
  \ 脚本自动化和简化复杂任务。\n\n让我们启动 Oracle VM VirtualBox Manager 中安装的 Kali Linux 虚拟机。在左窗格中选择\
  \ Kali Linux 虚拟机，然后选择 `Machine`（虚拟机）菜单及其 `Start`（启动）选项。选择 `Normal Start`（正常启动）运行\
  \ Kali 虚拟机。你会注意到 Kali Linux 虚拟机的启动序列已经开始。继续使用用户名 `root` 和密码 `toor` 登录系统（如果你使用的是较版本的\
  \ kali，则使用用户名 `kali` 和密码 `kali`）。如果使用 dvd 镜像安装虚拟机，在安装过程中会被要求提供备用密码，在这种情况下，你需要使用提供的密码登录。\n\
  \n![](img/Figure-3.1.jpg)\n\n**图 3.1：** Kali 图形桌面环境\n\n桌面的左侧是“Dock”栏，它包含几个常用应用程序的快捷方式，以帮助快速启动最常用的程序。用户可以通过拖放来自底部的\
  \ `Show Applications`（显示应用程序）图标的快捷方式来轻松自定义 Dock 栏中的快捷方式。界面顶部分为几部分，左侧是下拉菜单 `Applications`（应用程序），它是\
  \ Kali Linux 中可用各种应用程序的集合，这些应用程序进一步划分为不同的类别（例如：信息收集、漏洞分析等），这样做是为了便于识别在渗透测试不同阶段使用的工具。请花些时间浏览所有类别，以熟悉\
  \ Kali Linux 中提供的工具列表。`Applications` 菜单的紧邻右侧是 `Places`（位置）菜单，它包含指向常用用户目录的链接，如当前用户主目录、桌面和其他几项。面板的右侧包含用户菜单，其中包含配置声音、网络连接、电池的图标，以及用户设置、锁屏和关机菜单。\n\
  \n## 修改默认密码\n\n可以使用 `passwd` 命令更改 root 用户的密码，运行 `passwd` 命令后，系统会要求你输入两次新密码，新密码将在系统中更新，且更改将在下次登录时生效。\n\
  \n![](img/Figure-3.2.jpg)\n\n**图 3.2：** Kali 终端\n\n作为一个提醒，请记住默认密码是严峻的安全风险，也是导致系统被攻破的主要原因，这些密码应该始终被更改。\n\
  \n## 修改时区\n\nKali Linux 默认设置的时区是 UTC，可以通过点击面板右侧的用户菜单进行更改。点击当前用户 `root`，然后点击 `Account\
  \ Settings`（账户设置），这将打开一个新的设置窗口，导航到 `Date and Time`（日期和时间）设置，配置这些设置以匹配你的时区、日期和时间。\n\
  \n![](img/Figure-3.3.jpg)\n\n**图 3.3：** tzdata 的软件包配置\n\n通过命令行更改这些设置的另一种方法是以 root\
  \ 身份输入命令 `dpkg-reconfigure tzdata` 并在提示时更改设置。\n\n## 命令帮助\n\n在使用任何 *nix 平台时需要注意的一点是，与系统的大部分交互是通过命令行进行的，并且每个软件命令都有多种输入选项和子选项。由于\
  \ Kali Linux 中提供了大量工具，用户忘记命令语法和选项是非常常见的现象。\n\n为了解决这个问题，Linux 发行版上的软件包附带了帮助文件，被称为\
  \ man page（manual pages 的缩写）。可以通过输入命令 `man <command name>` 来访问这些手动帮助页。\n\n![](img/Figure-3.4.jpg)\n\
  \n**图 3.4：** nmap 命令的帮助页\n\n`man nmap` 命令的截图，帮助页展示了 nmap 中可选项及其用法。\n\n## 安装、删除和更新软件包\n\
  \nKali 带有许多黑客工具和支持软件包，但在某些情况下，可能需要安装额外的工具或库，这些工具可能不是标准 Kali 构建的一部分。在编译二进制文件或使用新软件包执行\
  \ perl 或 python 脚本时，经常会遇到缺少库的错误。\n\n在 Kali Linux 中安装软件包有多种方法，最常用且最简单的方法是使用一组名为 `apt`\
  \ 的默认软件包管理工具，它是“advanced packaging tool”（高级软件包工具）的缩写，该工具维护 Kali Linux 软件仓库中可用软件的本地数据库。\n\
  \n用于软件包管理的最常用 apt 命令选项如下：\n\n## apt search <search-string>\n\napt 中的 `search` 选项用于通过名称或类型查找软件包，该选项提供了存储库中匹配搜索标准的软件包列表，这在不确定切软件包名称时特别有帮助。\n\
  \n![](img/Figure-3.5.jpg)\n\n**图 3.5：** 使用 apt 搜索软件包\n\n使用命令 `apt search screenshot`\
  \ 搜索包含关键词 `screenshot` 的软件包，将提供匹配搜索标准的软件包列表。\n\n## apt show <package name>\n\napt\
  \ 中的 `show` 选项在提供合适的包名时会列出有关该软件包的所有信息，详情包括软件包版本、作者、安装大小、与其他软件包的依赖以及软件包的详细描述。\n\n\
  ![](img/Figure-3.6.jpg)\n\n**图 3.6：** gnome-screenshot 软件包的详情\n\n使用命令 `apt show\
  \ gnome-screenshot` 显示 gnome-screenshot 软件包详情的示例。\n\n## apt install <package name>\n\
  \n此用于安装软件包，执行此命令后，apt 软件包管理器将提供满足给定软件包所需的所有依赖项列表，以及安装所需的空间，并请求确认；如果用户给出了确认，软件包管理器将安装该软件包以及该软件包所需的所有依赖项。\n\
  \n![](img/Figure-3.7.jpg)\n\n**图 3.7：** 安装 gnome-screenshot 软件包\n\n使用命令 `apt install\
  \ gnome-screenshot` 安装 gnome-screenshot 软件包。\n\n## apt remove <package name>\n\n\
  \n\n\nremove 选项用于删除与提供的名称匹配软件包，执行此命令时，apt 软件包管理器将要求用户确认删除软件包，如果用户给予确认，软件包管理器将继续从系统中删除该软件包。\n\
  \n*警告：Kali 包含了数百个不同的软件包及其相互依赖的库，下处展示的 update 和 upgrade 选项用于同步软件包数据库并将软件包更新到全局范围内的最新版本。为了确保读者能够完成本书中的所有练习，作者建议在完成本书中的所有练习之前不要使用这些选项。*\n\
  \n## apt update\n\nApt 软件包管理器工具使用本地数据库来维护全局仓库中可用软件的列表，这可能会导致本地 apt 数据库与全局软件仓库之间的软件包列表或其版本出现差异。Update\
  \ 选项将本地软件包数据库中的可用软件包列表与全局软件包仓库中的列表进行同步。\n\n![](img/Figure-3.8.jpg)\n\n**图 3.8:**\
  \ apt update\n\n## apt upgrade\n\nupgrade 选项用于将所有可升级的软件包升级到本地软件数据库引用的最新版本号，使用此选项时，将从全局仓库下载可升级的软件并安装到系统中。\n\
  \n## dpkg\n\n你有时可能会遇到所需的软件包在 Kali 仓库中不可安装的情况，在这种情况下，可以针对系统架构（i386、amd64、SPARC 等）下载兼容的\
  \ `.deb` 软件包并使用命令 `dpkg -i <path-to-file.deb>` 安装。\n\n**注意：** `dpkg` 命令不解决依赖问题，因此在安装\
  \ .deb 软件包文件之前需要先安装依赖。\n\n## 查找文件\n\nKali 中提供了多种工具来帮助你查找系统中的文件，最常用的查找文件程序是 locate、`whereis`\
  \ 和 `find`。你可能需要根据想要实现的结果使用其中某一个。\n\n## locate <file name>\n\n`locate` 命令在系统范围的文件名数据库中搜索查询的文件，这实现了极快的搜索速度。缺点是，使用这种方法的搜索结果的相关性仅在数据库保持更新时才有效，应该使用\
  \ `updatedb` 命令来更新 locate 数据库。\n\n![](img/Figure-3.9.jpg)\n\n**图 3.9:** locate 命令\n\
  \n使用 `locate` 命令查找包含 `wordlists` 单词的文件。\n\n**信息：** `locate` 命令在整个文件路径中显示匹配的关键词，而不仅仅是文件名。\n\
  \n## whereis <file name>\n\n`whereis` 命令用于搜索二进制执行文件、手册（帮助文件）和源文件，该命令在标准 Linux 目录以及当前用户环境变量（`PATH`\
  \ 和 `$MANPATH`）中指定的目录内搜索提供的文件名。\n\n![](img/Figure-3.10.jpg)\n\n**图 3.10:** whereis\
  \ 命令\n\n上述 `whereis wordlists` 命令显示的输出显著减少，因为关键词 `wordlists` 仅匹配到文件名结尾，而不是整个文件路径，这种行为在已知精确文件名时是理想的。\n\
  \n## find <search directory> <criteria> <search string>\n\n`find` 命令是一种查找匹配搜索条件的文件的更为激进的方法，`find`\
  \ 命令允许用户使用更细粒度的准则来搜索文件，例如文件名（`-name`）、文件权限（`-perm`）、创建时间（`-ctime`）、修改时间（`-mtime`）、组\
  \ ID（`-gid`）、组名（`-group`）以及许多其他选项。\n\n![](img/Figure-3.11.jpg)\n\n**图 3.11:** find\
  \ 命令\n\n使用 `find` 命令在 `/usr/sbin` 目录内搜索所有具有 suid 权限的文件。\n\n```\nfind /usr/sbin -perm\
  \ -4000\n```\n\n# 在 Kali Linux 上管理服务\n\n默认的 Kali Linux 设置带有一些预装服务，如 apache、mysql、ssh\
  \ 等，可以使用 `service` 命令或通过使用 `systemctl` 命令来启动或停止这些服务。\n\n## service <service name>\
  \ start\n\n`service` 命令配合跟随服务名称的 start 选项用于启动服务。\n\n![](img/Figure-3.12.jpg)\n\n\
  **图 3.12:** 启动服务\n\n使用 `service apache2 start` 命令启动 apache2 服务。\n\n## service <service\
  \ name> restart\n\nrestart 选项用于重启服务，这在对服务进行任何配置更改时非常有用。\n\n![](img/Figure-3.13.jpg)\n\
  \n**图 3.13:** 重启服务\n\n使用 `service apache2 restart` 命令重启 apache2 服务。\n\n## service\
  \ <service name> status\n\nstatus 选项用于检查服务的当前状态。\n\n![](img/Figure-3.14.jpg)\n\n\
  **图 3.14:** 检查服务状态\n\n使用 `service apache2 status` 命令查看 Apache Web 服务器状态。\n\n## service\
  \ <service name> stop\n\nstop 选项用于停止服务。\n\n![](img/Figure-3.15.jpg)\n\n**图 3.15:**\
  \ 停止服务\n\n使用 `service apache2 stop` 命令停止 apache2 服务。\n\n## 使用 update-rc.d 实现服务持久化\n\
  \n默认的 Kali Linux 不带有预启的远程访问启动服务，可以使用 `update-rc.d` 命令允许服务跨重启保持持久化。\n\n![](img/Figure-3.16.jpg)\n\
  \n**图 3.16:** 使用 update-rc.d 命令启用 ssh 服务\n\n`update-rc.d <service name> enable/disable`\
  \ 命令可配置服务是否在启动时运行。\n\n# Shell 脚本基础\n\nKali Linux 自带的默认 shell 设置为 bash，这可以通过执行命令\
  \ `echo $SHELL` 来确认。bash shell 支持脚本编写、命令替换、输出重定向等，以帮助在 bash shell 中实现基础程度的自动化，消除了对单独语言的需求，这一\
  \ bash 特性在渗透测试尝试执行重复性任务或将多个任务链为一个任务时非常有用。\n\n## 命令替换\n\n这只是将命令的输出替换到变量中或将其作为另一个命令内部的输入的能力。\n\
  \n![](img/Figure-3.17.jpg)\n\n**图 3.17:** 命令替换\n\n上面的示例展示了使用系统命令 `echo` 和 `whoami`\
  \ 进行命令替换，`whoami` 命令的输出在 `echo` 命令字符串内展开并显示在用户的屏幕上。\n\n下一个示例将展示如何使用命令替换设置变量 `cuser`。\n\
  \n![](img/Figure-3.18.jpg)\n\n**图 3.18:** 检查变量 `cuser` 的值\n\n`echo` 命令显示变量 `cuser`\
  \ 的值设置为 `whoami` 命令的输出，正如预期。\n\n## 命令链和输入、输出、错误的重定向\n\n命令链是在单行内按顺序逐一个执行多个命令的能力，这是通过使用运算符符号（如\
  \ `;` | `&`）实现的。当使用运算符 `;` 时，每个命令在前一个命令执行完毕后执行。\n\n在我们上一个示例中使用的两个命令 `whoami` 和 `echo`\
  \ 可以使用 `;` 运算符链在单行中，而无需单独发布每一个命令。\n\n![](img/Figure-3.19.jpg)\n\n**图 3.19:** 使用\
  \ ; 运算符进行命令链\n\n\n\n\n前面的命令使变量 `cuser` 输出了 `whoami` 命令的执行，随后使用 `echo` 命令将 `cuser`\
  \ 变量的值打印在用户的屏幕上。\n\n命令链也可以使用 `&&` 运算符实现。这里的主要区别在于，只有在前一个命令执行成功时，才会执行序列中的下一个命令；如果上一个命令以错误退出，则链将停止执行。\n\
  \n![](img/Figure-3.20.jpg)\n\n**图 3.20:** 使用 `&&` 运算符的命令链\n\n上面的截图展示了两种场景：第一种命令链执行正确，设置了\
  \ `cuser` 变量，`echo` 命令在终端中显示了它的值；而在第二种场景中，`cat` 命令返回了错误，命令链在显示 `cuser` 变量值之前停止了。\n\
  \nBash 提供了使用文件描述符重定向命令输入和输出的能力。为了更好地理解这一点，Linux 中的程序从键盘获取输入（**标准输入** (**STDIN**）并产生输出（**标准输出**\
  \ (**STDOUT**）或错误（**标准错误** (**STDERR**），这两者都会被发送到用户的屏幕上。bash 为我们提供了使用运算符 `|` `<`\
  \ 和 `>` 重定向这些内容的能力。\n\n当使用运算符 `|` 进行命令链接时，原本应显示在用户屏幕上的命令输出（`STDOUT` 和 `STDERR`）将作为输入（`STDIN`）传递给下一个命令。\n\
  \n详细说明之前的例子，`cuser` 变量将被设置为 `whoami` 命令的输出，此外我们将利用 `cat` 命令读取 `/etc/passwd` 文件的内容，并将其输出通过\
  \ `grep` 过滤并显示与 `cuser` 变量值相关的行。\n\n![](img/Figure-3.21.jpg)\n\n**图 3.21:** 使用 `|`\
  \ 运算符的输出重定向\n\n上述命令成功完成并显示了 passwd 文件中与 `root` 的条目，而不是整个 passwd 文件的内容。\n\n在我们之前的示例中，使用了\
  \ `cat` 命令来读取 `/etc/passwd` 文件的内容。`cat` 命令的 STDOUT 输出通过 `grep` 管道显示了存储在 `cuser`\
  \ 变量中的值（即 root）相关的行。我们也可以通过 `<` 运算符将 `/etc/passwd` 文件的整个内容重定向为 `grep` 命令的 STDIN\
  \ 来实现相同的结果。\n\n![](img/Figure-3.22.jpg)\n\n**图 3.22:** 输入重定向\n\n我们通过简单的输入重定向在不使用\
  \ `cat` 命令的情况下实现了相同的结果。\n\n*灯泡：需要注意的一个区别是，`|` 运算符也可以用于链接多个命令，而 `<` 用于将文件重定向为命令或变量的输入。*\n\
  \n在下一个示例中，我们将学习如何将上一个命令的输出重定向到名为 `cuser.txt` 的文件中，然后我们将使用 `cat` 命令验证 `cuser.txt`\
  \ 文件的内容。\n\n![](img/Figure-3.23.jpg)\n\n**图 3.23:** 输出重定向到文件\n\n除了重定向 STDOUT 之外，`>`\
  \ 运算符还会创建一个之前不存在的名为 `cuser.txt` 文件。\n\n***警告：如果你使用运算符 `>` 将命令输出重定向到文件，你将只能注意到最后一次执行的输出，因为文件在每次执行命令时都会被覆盖。在使用运算符\
  \ `>` 时，必须采取足够的预防措施以防止意外覆盖有用文件。*\n\n如果你尝试重复执行第一个命令几次然后读取 `cuser.txt` 输出，你会发现文件中只有一个条目，这是因为该运算符会覆盖任何同名的预存在文件，导致每次都产生新的条目。使用\
  \ `>>` 运算符可以解决覆盖问题，它会将输出追加到文件中而不是完全覆盖它。\n\n![](img/Figure-3.24.jpg)\n\n**图 3.24:**\
  \ 输出重定向并向文件追加输出\n\n## 循环\n\n在使用 bash shell 时，有几种方法可以实现循环。为了本书的需要，我们将关注 `for 循环`，它用于在项目列表上运行一组给命令。\n\
  \n在接下来的示例中，我们将创建一个简单的 `for 循环`，变量 `i` 的值设置为使用 `seq` 命令生成的 1 到 5 的值列表。循环将运行 `sleep`\
  \ 命令并将变量 `i` 的值 echo 到文件 `loop.txt` 中；循环将对 `i` 的下一个值继续运行同一组命令，直到 `i` 的值达到 5，随后循环将完成最后一次命令执行并退出。\n\
  \n![](img/Figure-3.25.jpg)\n\n**图 3.25:** For 循环\n\n如你所注意的，上面的脚本由于每次执行都增加了 1 秒的\
  \ sleep 延迟，执行了 5 秒，但 `loop.txt` 文件只显示内容为“5”。此的原因是命令在 `for 循环` 中的执行方式。命令集（在此情况下为\
  \ `sleep` 和 `echo`）为每个 `i` 的值重新运行，且当前命令的输出每次都会覆盖文件。这种情况会一直发生直到循环结束，最后一个命令的输出覆盖 `loop.txt`\
  \ 文件。在这种情况下，有必要使用 `>>` 运算符在每次执行时追加 `loop.txt` 文件，而不是覆盖它。\n\n![](img/Figure-3.26.jpg)\n\
  \n**图 3.26:** for loop - 使用 `>>` 运算符向文件追加数据\n\n上述发出的命令结果显示了上一次运行的输出（即 5）以及当前 `for\
  \ 循环` 生成的输出，它们按顺序追加到同一个文件中。\n\nBash 高度依赖特殊字符来进行命令链、输入/输出重定向、进程后台化等。在某些情况下，可能需要使用\
  \ `\\` 运算符对特殊字符进行转义，这样做会消除分配给它们的特殊属性，并允许 bash 将这些字符视为普通字符。\n\n![](img/Figure-3.27.jpg)\n\
  \n**图 3.27:** 使用 `\\` 运算符转义特殊字符\n\n第一个示例中的 `echo` 命令由于语法错误而失败，这是因为 bash 解释了特殊字符\
  \ `<>?()[]&|'';,`\n\n第二个命令成功完成，因为使用反斜杠 `\\` 字符正确地中和了所有特殊字符，允许输出回显到屏幕上。\n\n## 浏览器插件\n\
