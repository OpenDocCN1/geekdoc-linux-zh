  \n在本章后续部分，我们使用了网络主机发现技术（如 ICMP/ARP 扫射）对目标进行了实战侦察，包括不同类型的端口扫描、操作系统和服务版本检测。了解开放端口、服务以及目标运行的软件版本提供了有关目标运行的有用见解，并有助于识别目标系统可能受的任何安全问题。\n\
  \n\n\n\n接下来，下一章将重点关注 Kali Linux 中提供的各种扫描和枚举工具，并进行实操练习以发现目标系统中的安全问题。\n\n## 问题\n\n\
  1. 使用哪些协议来确定 IP 网络上的存活主机？\n2. 哪种 `nmap` 扫描类型被称为半开放扫描（half-open scan）？\n3. `nmap`\
  \ 中的激进模式（aggressive mode）是什么？为什么要使用它？\n\n# 第 6 章\n\n## 服务枚举与扫描\n\n上一章分为两个主要部分。上一章的前半涵盖了规划成功的渗透测试所需的各种前接活动。该章的后半部分涵盖了侦察理论，并演示了如何使用\
  \ Kali Linux 上的工具来获取有关目标系统的有价值信息。\n\n本章将解释如何利用在上章中获取的目标知识，对我们之前识别出的服务进行进一步的扫描和枚举。\n\
  \n## 结构\n\n在本章中，我们将涉及以下主题：\n\n* 各种服务的枚举\n* 扫描服务以识别潜在的漏洞和切入点\n\n## 目标\n\n阅读本章后，你将能够：\n\
  \n* 理解枚举和服务扫描的理论。\n* 使用 Kali Linux 中提供的工具执行枚举和服务扫描。\n\n## DC-7\n\n我们之前已经识别出目标端口\
  \ `80` 运行运行着一个基于 Drupal 网站的 Apache Web 服务器，接下来我们将进一步枚举该服务，以找到其上存在的任何重要文件或目录。\n\n\
  让我们打开终端，使用命令 `dirb http://10.0.2.27` 对网站进行基于字典的 Web 内容扫描。\n\n![](img/Figure-6.1.jpg)\n\
  \n**图 6.1：`dirb` 扫描\n\n你会注意到，不带任何开关的默认扫描需要花费大量时间，且大部分扫描输出都是 403 访问错误页面，如上方截图中的扫描结果所示。\n\
  \n你可以通过运行此命令来优化扫描的耗时和输出：\n\n`dirb http://10.0.2.27 -r -N 403`\n\n![](img/Figure-6.2.jpg)\n\
  \n**图 6.2：`dirb` 调优\n\n`-r` 开关阻止 `dirb` 工具递归检查已识别目录中的任何相同文件。DC-7 目标对许多目录返回了大量的 403\
  \ 消息，而 `-N` 选项用于指示 `dirb` 工具忽略或过滤掉不需要的响应，并尽可能减少扫描结果中出现的虚假条目。\n\n注意目标系统上存在 `robots.txt`\
  \ 文件；该文件被网站管理员用于阻止搜索引擎索引敏感文件和目录。\n\n现在，从程序坞中打开 Firefox 浏览器并访问：\n\n`http://10.0.2.27/robots.txt`\n\
  \n![](img/Figure-6.3.jpg)\n\n**图 6.3：DC-7 上的 `robots.txt`**\n\n在上一个截图中，我们可以看到 `robots.txt`\
  \ 列出了了一些不打算索引的目录。这些目录对于渗透测试人员可能非常感兴趣，因为它们可能包含敏感信息或管理界面。\n\n\n\n\n以下是列表中突出的几个文件和目录名：\n\
