  **图 10.1：** 发现\n\n## 漏洞列表\n\n![](img/p260.jpg)\n\n**表 10.6：** 发现列表\n\n识别出的漏洞的技术细节及其相应的截图可以在本文档的技术总结章节中进一步找到。\n\
  \n## 总结分析\n\nSecTest 确定 ClientCorp 系统的整体安全态势为 `Poor`（差）。我们的测试人员识别了多个影响目标系统的安全问题，并利用这些问题获取了对目标的未经授权访问，并进一步利用它们实现了对目标的完全管理控制。\n\
  \n- 发现多个服务横幅实例泄露了有关目标系统上运行的服务类型和版本的详细信息。此类信息可能使攻击者理解目标的后台机制，发现漏洞并精调其攻击方法。\n- 网页源代码中的开发者注释泄露了有关隐藏资源位置的细节。此类信息可能使攻击者理解目标的后台机制，发现漏洞并精调其攻击方法。\n\
  - 在目标系统上发现了包含多个已知安全问题的应用程序包的不安全版本。这些问题允许我们读取敏感的系统文件并执行系统命令，最终导致 `Kioptrix:5` 目标被攻破。\n\
  - 缺乏服务加固，发现 `FTP` 服务允许匿名用户登录。服务器托管了一个包含开发者注释的文件，泄露了有关服务器实现的敏感信息。\n- 发现一个测试 API 页面包含一个漏洞，允许我们能够在服务器上执行代码并获得对\
  \ `Mumbai:1` 目标的交互式 shell 访问。\n- 安全配置错误，例如执行 `docker` 的 `sudo` 权限（无需密码）以及 `docker`\
  \ 组权限，允许 `apiuser` 获取管理员权限并接管 `Mumbai:1` 目标。\n\n## 策略建议\n\n可以实施以下可选措施来提高整个组织的安全态势：\n\
  \n- 强烈建议采用并规范加固程序，以避免服务信息泄露。\n- 应采取检查和措施以确保代码在移动到生产环境之前经过清理。\n- 实施程序化控制，定期监控、识别和维护系统软件包以发现安全问题。\n\
  \n\n\n\n*   应实施检查和测量，以确保在将服务移动到生产环境之前已进行了加固、禁用了不必要的功能，并移除或清理了任何不需要的数据。\n*   应采用安全编码实践，以尽可能地减少安全问题。\n\
