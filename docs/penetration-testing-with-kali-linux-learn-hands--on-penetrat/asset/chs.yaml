  \n# 参考文献\n\n**[`owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities`](https://owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities)**\n\
  \n![](img/p266.jpg)\n\n## 观察\n\n目标系统上安装的 FreeBSD 版本包含一个权限提升漏洞。\n\n## 影响\n\n该漏洞被利用时，允许普通系统用户获得管理员权限并接管目标系统。\n\
  \n## 攻击证据\n\n![](img/Figure-10.10.jpg)\n\n**图 10.10**\n\n我们在目标系统上上传了利用代码并使用 `gcc`\
  \ 对其进行了编译。\n\n![](img/Figure-10.11.jpg)\n\n**图 10.11**\n\n编译后的利用程序使我们能够在 `Kioptrix:5`\
  \ 目标上获得 root 用户权限，并获得完全的管理员控制。\n\n## 建议\n\n建议将上述的软件包升级到最新版本。\n\n# 参考文献\n\n**[`nvd.nist.gov/vuln/detail/CVE-2012-021`](https://nvd.nist.gov/vuln/detail/CVE-2012-021)**\n\
  \n**[`www.freebsd.org/security/adversories/FreeBSD-SA-12.0`](https://www.freebsd.org/security/adversories/FreeBSD-SA-12.0)**\n\
  \n## 观察\n\n目标系统上安装的 FreeBSD 版本配置允许匿名登录。\n\n## 影响\n\n敏感信息的泄露可能使攻击者了解目标的内部机制，发现漏洞并精调他们的攻击方法。\n\
  \n## 攻击证据\n\n（注：提供的源代码中，关于 CVE-2012-021 的最后一个观察部分的文本似乎是碎片化的或不完整的）。\n\n\n\n\n\n##\
  \ 建议\n建议对所有用户提供的输入进行输入验证，以检查并过滤恶意字符。\n\n# 参考文献\n**[`owasp.org/www-community/attacks/Command_Injection`](https://owasp.org/www-community/attacks/Command_Injection)**\n\
  \n![](img/p270a.jpg)\n\n## 观察\n在 Mumbai:1 目标上发现了以下安全配置错误：\n\n1. `apiuser` 账户已被授予\
  \ `docker` 组成员权限。\n2. `apiuser` 被配置为通过 `sudo` 命令以 root 身份执行 `docker`。\n\n## 影响\n\
  所突出的问题具有严重性，`apiuser` 可以利用这些问题获取管理员权限并接管目标系统。\n\n## 攻击证据\n![](img/Figure-10.19.jpg)\n\
  \n**图 10.19**\n我们利用 `docker` 组权限问题创建了一个新的交互式 `docker` 容器，并将根目录 `/` 挂载到 docker 容器内的\
  \ `/tmp/mumbai` 目录。\n\n创建一个新的 `docker` 容器使我们对所有连接到容器的文件系统获得了“root”权限，包括挂载在 `/tmp/mumbai`\
  \ 目录中的父文件系统。\n\n![](img/Figure-10.20.jpg)\n\n**图 10.20**\n通过使用 `chroot` 命令将根目录 `/`\
  \ 改回 `/tmp/mumbai`，获得了 Mumbai:1 目标文件系统的 root 权限。\n\n## 建议\n建议撤销 `apiuser` 账户的 `sudo`\
  \ 和 `docker` 组权限。作为一般原则，建议避免向系统用户授予过度权限。\n\n# 参考文献\n**[`owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration`](https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration)**\n\
