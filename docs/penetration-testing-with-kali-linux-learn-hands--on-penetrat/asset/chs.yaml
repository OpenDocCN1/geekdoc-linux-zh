  \ patrick 家目录下的文件列表。\n\n### SNMP 服务\n\n让我们继续枚举我们在目标 UDP 端口 161 上发现的 SNMP 服务。\n\n\
  SNMP 代表简单网络管理协议（Simple Network Management Protocol），是一种广泛用于收集和组织 TCP/IP 网络上管理设备信息的协议。SNMP\
  \ Agent 以变量的形式共享管理数据，这些数据组织成层次结构，被称为管理信息库（`MIBs`）。SNMP 使用具有不同访问权限的团体字符串来建立管理器与代理之间的信任。常见的团体字符串名称有\
  \ public（通常为只读）和 private（通常为读写）。\n\n打开终端并输入命令执行扫描：\n\n```\nsnmpwalk 10.0.2.15 -v\
  \ 1 -c public\n```\n\n`-v` 标志指定使用的 SNMP 协议版本，`-c` 标志设置扫描期间使用的团体字符串。\n\n![](img/Figure-6.15.jpg)\n\
  \n**图 6.15：** SNMP 枚举\n\n来自 snmpwalk 工具输出的截图。\n\n从已安装软件包中收集到的少量细节：\n\n- **Linux\
