    \   SNMPv1 server; net-snmp SNMPv3 server (public)\n\n*   36969/udp tftp (found\
    \ using snmpwalk)\n\n    *   Mapped to patrick’s home directory\n\n# [Kioptrix:5](#toc.xhtml_s120a)\n\
    \nPreviously, enumeration of the Apache web server instance running on port 80\
    \ revealed the existence of pChart2.1.3 application on the target, our enumeration\
    \ of port 8080 displayed HTTP 403 forbidden pages and did not reveal anything\
    \ of importance.\n\nWe will search for vulnerabilities on the services and applications\
    \ running on the target machine employing the information found in the previous\
    \ phases:\n\nApache2 package version 2.2.21\n\n*   mod_ssl version 2.2.1\n\n*\
    \   OpenSSL version 0.9.8q\n\n*   PHP version 5.3.8\n\npChart version 2.1.3\n\n\
    Open the terminal window and issue **`searchsploit <software-name><version>`**\
    \ command one by one on the list of packages given as follows:\n\n![](images/Figure-7.15.jpg)\n\
    \n**Figure 7.15:** list of Apache 2.2.21 exploits\n\nThe command outputs a single\
    \ Apache exploit for Apache version 2.2.21, however as by the path location, this\
    \ is a ‘dos’ a.k.a denial of service exploit and cannot be used to obtain remote\
    \ access.\n\n![](images/Figure-7.16.jpg)\n\n**Figure 7.16:** list of pChart 2.1.3\
    \ exploits\n\nSearching for pchart 2.1.3 in searchsploit gives us an exact version\
    \ match:\n\npChart 2.1.3 - Multiple Vulnerabilitie | exploits/php/webapps/31173.txt\n\
    \nLet’s take a look at the exploit by using the command:\n\n**`cat /usr/share/exploitdb/exploits/php/webapps/31173.txt\
    \ | less`**\n\n![](images/Figure-7.17.jpg)\n\n**Figure 7.17:** Contents of pChart\
    \ directory traversal exploit 31173.txt\n\nThe pchart application seems to be\
    \ affected by directory traversal vulnerability which could result in disclosure\
    \ of sensitive files.\n\nA sample exploit url has been provided by the exploit\
    \ author, lets customize the sample URL and try it out on our target.\n\nOpen\
    \ up the Firefox browser from the dock and browse to **http://10.0.2.104/pChart2.1.3/examples/index.php?Action=View&Script=%2f..%2f..%2fetc/passwd**\n\
    \n![](images/Figure-7.18.jpg)\n\n**Figure 7.18:** Exploiting pChart vulnerability\
    \ to view contents of passwd file\n\nAs you can notice that the directory traversal\
    \ exploit worked, we are able to view the passwd file.\n\nSince Apache is the\
    \ only remotely accessible service running on the target, and there aren’t many\
    \ loopholes to exploit. We will use the same directory traversal vulnerability\
    \ to read the Apache configuration file to find any configurational weaknesses\
    \ and the reason for getting 403 forbidden message while accessing port 8080.\n\
    \nThe operating system running on the target host is FreeBSD 9.0 and doing a google\
    \ search reveals that the Apache config file is situated at **`/usr/local/etc/apache22/httpd.conf`**\n\
    \nCraft the exploit URL to read the Apache config file and open it in the web\
    \ browser:\n\n**http://10.0.2.104/pChart2.1.3/examples/index.php?Action=View&Script=%2f..%2f..%2fusr/local/etc/apache22/httpd.conf**\n\
    \n![](images/Figure-7.19.jpg)\n\n**Figure 7.19:** Viewing Apache configuration\
    \ using pChart directory traversal exploit\n\nWe now have access to the Apache\
    \ configuration file. Scrolling through the configuration brings us to the VirtualHost\
    \ configuration for port 8080 as shown in the screenshot above. We can see that\
    \ the access to port 8080 is allowed only in cases where the ‘user-agent’ of the\
    \ client matches Mozilla/4.0 Mozilla4_browser. This string is sent from the client\
    \ to the server while establishing a HTTP connection. As the client is under our\
    \ control the responses sent by it can be manipulated to send the data expected\
    \ by the server and allow our connection to go through. This effectively bypasses\
    \ any client-based filtering or restrictions implemented on the server side.\n\
    \nThere are multiple ways to change the user-agent string sent by the client as\
    \ shown in the three options given as follows:\n\n1.  Enter ‘**`about.config`**’\
    \ in firefox browser, right click on the list and add a new ‘String’ type variable\
    \ named ‘**`general.useragent.override`**’ containing value ‘**`Mozilla/4.0 Mozilla4_browser`**’.\n\
    \n2.  Use a firefox addon such as ‘*User-Agent Switcher and Manager*’ to change\
    \ the default user-agent string.\n\n3.  Use an HTTP intercepting proxy such as\
    \ burpsuite or zaproxy to intercept all outgoing requests and rewrite the string\
    \ before submitting to the server.\n\nChange the firefox user-agent string using\
    \ any of the method above, and browse to **http://10.0.2.104:8080**\n\n![](images/Figure-7.20.jpg)"
