    However, it is not necessary that some of the above services, have to run on default
    ports, for security reasons many a times organizations choose to use custom ports
    for certain services, like for example, they may choose to use port 8181 for proxy,
    or any other custom port for web applications. Apart from the above ports, you
    might also discover few more commonly used ports by other services, and sometimes
    it may be very specific to applications those are built inhouse by the organization,
    so it will vary from organization to organization also. Let’s discuss some of
    the common exploitation techniques in little more detail.


    # NetBIOS enumeration


    NetBIOS in general is used for communicating between computers connected over
    a LAN/WAN to allow file sharing and printers. NetBIOS can be used to detect and
    identify connected network devices over TCP/IP in Windows based systems. Usually
    NetBIOS names are unique in nature, and can reveal some interesting information
    about the devices which can be enumerated. Some common factors that can be found
    are like, all the list of computers which are connected to a particular domain,
    open shares on those hosts, and so on., most of these can be found by using common
    tools like `Nbtstat`.


    # SNMP enumeration


    `Simple Network Management Protocol` (`SNMP`) is a UDP based protocol which is
    used to manage and maintain network devices like routers, and switches. SNMP is
    very commonly used in most of the OS including Windows Server, Linux & UNIX servers
    too. SNMP is always targeted by researchers and testers to enumerate details related
    to user accounts, their passwords, associated system names in the target environment.
    SNMP is used in `Network Management System` (`NMS`) for monitoring and management
    of network devices. The SNMP enabled devices allows access to a management information
    database with read or write access permissions based on the access levels. This
    Database holds description of network objects with specific identifiers, and also
    acts as a repository of values and settings. SNMP used Community Strings to authenticate
    between devices, these community strings are nothing but text strings. This particular
    implementation of authentication mechanism allows any attackers or security testers
    to perform network sniffing. If the community strings are not protected or configured
    properly then network information can be leaked. Some of the tools like `SNMP-WALK`
    `SolarWinds` can be used during SNMP enumeration.


    # DNS Enumeration


    DNS enumeration is another very commonly used method to locate the DNS servers
    and its related records about the target systems/networks. It can provide very
    useful information like IP addresses, usernames, computer names, and so on. of
    the target systems. DNS record will provide an overview of resource records that
    is stored in the zone files. Because DNS data is replicated via DNS Zone Transfer
    for a pool of DNS servers. Attackers or penetration tester can perform a DNS zone
    transfer request, and if the DNS server allows zone transfers because of any configuration
    flaws to the unauthorised party, then in that case the DNS names and IP addresses
    associated with the devices can be accessed in clear text. Some of the tools that
    can be used for this activity are like `nslookup` or `maltego`.


    # Phase 6: Vulnerability research


    The vulnerability research phase takes into account all the intelligence collated
    during the information gathering, reconnaissance and enumeration phases to come
    up with a list of potential security issues pertaining to the target systems,
    the security issues are analyzed further to determine their severity, impact and
    ease of exploitation. Additional verification measures are performed to determine
    their validity and eliminate any false positives.


    The security issues are then mapped with the list of known exploits and techniques
    available for each security issue identified, this is done to arrive at the success
    and failure rates for each exploit or technique available. Particular attention
    has to be paid during the research phase while evaluating various exploits and
    techniques to avoid any potential harm to the target system.


    # Phase 7: Exploitation


    In the exploitation phase the primary focus of the tester is to exploit the security
    flaws found using the exploits or techniques found during the previous phase.
    Careful evaluation and planning is required on behalf of the tester to determine
    the most effective and safest approach, and avoid knocking the system off the
    network, getting detected/blocked by the monitoring systems, and not achieving
    the set objectives. All actions performed in this phase need to be well controlled
    and coordinated, proof of all activities performed should be captured and retained
    for the next phase.


    # Phase 8: Reporting


    This is the final and one of the most important phase of the entire exercise as
    it deals in generation of the deliverables pertaining the project. All the time
    and efforts spent on the project by the tester are distilled into concise and
    meaningful document or a set of documents which accurately reflect the security
    state of the tested systems.


    As the saying goes (I have no idea who said it) “Nothing is considered complete,
    until its documented”. The deliverables should accurately describe the activities
    performed during the various phases, and each step must be documented with the
    findings and artifacts to substantiate the tester’s claims. This information must
    be justified with proper explanation and detailed proof of steps performed and
    gaps, vulnerabilities found, exploits used, how they were used and under what
    circumstances those worked and may be did not work.


    The contents of the report should be based on actual facts as observed by the
    penetration tester themselves and not a hypothesis. Once the report is finalized
    it must be shared with various stakeholders and relevant authorities, like the
    senior management, regulators, operations teams, Application and Infrastructure
    security teams and technical team of organization.


    As the penetration testing report is consumed by wide range of stakeholders to
    meet their role specific requirements, hence, the report should be structured
    well and contain section which help them meet their project objectives and requirements.


    Some of the sections that can be followed during the reporting is as follows:


    ## Objective


    This section must cover the objective of the penetration test absolutely crystal
    clear. The purpose of the complete exercise and what goals it’s going to meet.
    For example, “The penetration testing is being conducted as part of the annual
    process”, OR “The penetration testing is being conducted to satisfy the audit
    requirements from the regulators” OR may be as simple as to check the effectiveness
    and resiliency of the applications going live.


    ## Intended stakeholders


    Define or document who in the organization needs to be shared this report with,
    For example, CIO, CTO, CISO, Infosec Manager, IT Manager, Technical Teams, Application
    Security teams, and so on.


    ## Executive Summary


    This section is targeted towards the Executive management. Testers must keep this
    section as precise and crisp as possible. Avoid writing too much detailed explanations
    in this section. The intention is to get the attention of the senior management
    and not to overwhelm them. Instead, you can focus on keeping some details like
    the scope of work, timeline, your summary of findings, and what are your recommendations
    for mitigating the found risks.


    ## Methodology

