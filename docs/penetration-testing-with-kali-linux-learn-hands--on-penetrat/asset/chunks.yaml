    \n1.  Open up the Drupal page on the target system using Firefox browser and login\
    \ with admin and password ‘**`admin123`**’.\n\n2.  Click on the ‘**`Content`**’\
    \ option under the manage ‘**`Manage`**’ section.\n\n    ![](images/Figure-8.1.jpg)\n\
    \n    **Figure 8.1:** DC7 admin page\n\n3.  Click on the ‘**`+Add content`**’\
    \ button and click on the ‘**`Basic page`**’ link in the resulting page.\n\n4.\
    \  Add the PHP reverse shell in the ‘**`Title`**’ field, paste the code for **`php-reverse-shell.php`**\
    \ in the ‘**`Body`**’ section and select ‘PHP code’ in the ‘Text format’ drop-down\
    \ menu.\n\n    ![](images/Figure-8.2.jpg)\n\n    **Figure 8.2:** Creating a PHP\
    \ webshell on Drupal\n\nIn the preceding screenshot, notice the “**`Body`**” section,\
    \ Modify the $ip and $port variables in the PHP code to receive the reverse shell\
    \ on our Kali system and click on the ‘**`Save`**’ button to save the code. In\
    \ the screenshot above we have modified the value for the $ip variable to 10.0.2.238\
