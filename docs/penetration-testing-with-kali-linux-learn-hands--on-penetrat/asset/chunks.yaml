    \n        *   Exploits found\n\n            ![](images/ent.jpg) PhpTax - 'pfilez'\
    \ Execution Remote Cod | exploits/php/webapps/21833.rb\n\n            ![](images/ent.jpg)\
    \ PhpTax 0.8 - File Manipulation 'newval | exploits/php/webapps/25849.txt\n\n\
