    \n![](images/Figure-9.22.jpg)\n\n**Figure 9.22:** Creating a copy of shadow file\
    \ using the nano text editor\n\nThe contents of the file have been copied to a\
    \ file on our Kali system, we can now proceed to crack the hashed passwords using\
    \ `john the ripper`. Execute the command in the directory containing the password\
    \ hashes execute the command `john <filename>`.\n\n![](images/Figure-9.23.jpg)\n\
