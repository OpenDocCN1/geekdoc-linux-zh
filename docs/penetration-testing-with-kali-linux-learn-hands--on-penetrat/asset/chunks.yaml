  raw: 'The command shown in the screenshot above performs a TCP connect scan on the
    privileged port range (1-1024) of the target machine. It achieves this by probing
    the ports one by one using the netcat utility. Netcat is a highly versatile tool
    for penetration testers as it has multiple functionalities which can be leveraged
    in virtually all phases of the penetration test.


    In order to speed up the scanning process the timeout window has been reduced
    to 1 using the **`-w`** flag along with **`-z`** flag (zero - I/O mode) used specifically
    for scanning purposes. The **`-n`** flag stops netcat from performing reverse
    domain resolution and **`-v`** flag instructs netcat to produce verbose output.


    **`root@kali:~# for port in $(seq 1 1024); do nc -w 1 -z -nv 10.0.2.27 $port 2>&1
    | grep open; done`**


    **`(UNKNOWN) [10.0.2.27] 22 (ssh) open`**


    **`(UNKNOWN) [10.0.2.27] 80 (http) open`**


    **`root@kali:~#`**


    The port scanning command found a total of 2 ports open on the target system,
    let’s probe them further to find the services running behind the open ports.


    ![](images/Figure-5.5.jpg)


    **Figure 5.5:** Probing services using the netcat command


    Netcat <IP port> command output shows the banner information of SSH service running
    on the target system. The SSH service banner shows that it is an OpenSSH version
    7.4p1 and further information that the target is a Linux system running Debian
    10 based distribution.


    Using the same approach let’s see what we can find out about the HTTP service
    using netcat.


    ![](images/Figure-5.6.jpg)


    **Figure 5.6:** Banner grabbing using netcat


    **`Netcat <IP port>`** command followed by junk input causes the HTTP service
    to display an error page. Looking at the HTTP response shows that HTTP service
    running on port 80 is an Apache server version 2.4.25\. The web server also seems
    misconfigured as we can notice a loopback IP address **`127.0.1.1`** in the server’s
    response page.


    Let’s see if we can enumerate this service further by taking a look at the website
    running on port 80 using the firefox browser.


    ![](images/Figure-5.7.jpg)


    **Figure 5.7:** DC-7 landing webpage


    Browsing the DC7 HTTP service using Firefox brings up a fairly basic website seemingly
    designed purely to provide some hints regarding the **capture the flag** (**CTF**)
    challenge. Firstly, that the challenge is not very technical and secondly to think
    outside the box.


    Bottom of the webpage shows that the website is using Drupal which is an open-source
    content management framework written in PHP language. The last line of the page
    is @DC7USER which is either the local Drupal account username or some sort of
    an online account handle.


    Let’s explore the webpage source-code to see if we can find anything useful there.
    With the DC7 webpage in view press *Ctrl+U* within the firefox browser to open
    the page-source.


    ![](images/Figure-5.8.jpg)


    **Figure 5.8:** DC-7 page source


    The page source reveals that the version 8 of Drupal running on the target system
    but nothing much apart from that.


    Let’s see if we can find something about @DC7USER through a Google search.


    ![](images/Figure-5.9.jpg)


    **Figure 5.9:** Google search results for @DC7USER


    The google search brought up a few interesting entries on Github and Twitter.


    Take notes on the observations made so far, and we will continue with this machine
    in the next chapter.


    **Observation Notes:**


    **IP address:** 10.0.2.27


    **Operating System:** Linux (Debian 10 based)


    **Open Ports & Services:**


    22/tcp - SSH


    OpenSSH 7.4p1 (gathered from service banner)


    80/tcp - HTTP


    Apache 2.4.25 (gathered from service banner)


    Drupal 8 (gathered from page source)


    Internet handle @DC7user on the main page


    Google search of the handle revealed Twitter and Github accounts.


    # [Digitalworld.local:Joy](#toc.xhtml_s99a)


    ![](images/Figure-5.10.jpg)


    **Figure 5.10:** Joy login screen


    Out next target in the lab is ‘Joy’ and its console displays a graphical login
    screen with a username patrick highlighted.


    In this lab we will use a few tools available on Kali Linux to perform reconnaissance
    of our target over the network, like the previous target we will begin by performing
    a ping sweep of the lab network, and identify the IP address assigned to our target
    machine.


    We will perform a ping sweep of the network by using the Nmap tool which is used
    for network discovery, fingerprinting and basic security auditing of target systems.


    ![](images/Figure-5.11.jpg)


    **Figure 5.11:** Ping sweeping the network using nmap


    The **`nmap -sP <range of IPs >`** command shown in the screenshot above performs
    a pingsweep by sending a series of ping requests (ICMP echo) to each individual
    IP address in the range specified. The IP addresses which respond to requests
    are displayed back. The IP address of Joy machine can be seen displayed in the
    screenshot 10.0.2.15 along with its MAC address.


    With this information now available we can probe the IP address further and find
    out the open ports on the target machine.


    ![](images/Figure-5.12.jpg)


    **Figure 5.12:** TCP port scanning using nmap


    As in the case of DC7 where we had created a bash script the **`Nmap -sT`** command
    performs a similar TCP connect scan, however at a much faster pace.


    The nmap scan found 12 open ports on the target system, going further let’s use
    nmap to fingerprint the operating system and identify the details of the services
    found running on the target.


    ![](images/Figure-5.13.jpg)


    **Figure 5.13:** exploring service scanning, OS fingerprinting and limited port
    scanning using nmap


    In the preceding example **`Nmap`** command was used to automate the process of
    service identification and operating system fingerprinting by using the flags
    -sV and -O respectively, this activity was limited specifically limited to the
    TCP ports found previously by using the directive **`-p <comma separated ports>`**.


    Nmap can also be used to identify open UDP ports on the target system. This becomes
    necessary in some cases as open UDP ports do not come up in TCP port scans. Nmap
    can be directed to perform a UDP scan of the target by using the **`-sU`** flag.


    ![](images/Figure-5.14.jpg)


    **Figure 5.14:** UDP port scanning using nmap


    The screenshot of the nmap output shows 3 open UDP ports on the target namely
    123, 137, and 161, the next step is to identify the services running behind those
    open UDP ports.


    ![](images/Figure-5.15.jpg)


    **Figure 5.15:** UDP service detection


    We can see that the target is running NTP v4 on udp port 123, Samba service on
    udp port 137 and SNMP server on udp port 161.


    Take notes on the observations made so far, and we will continue with this machine
    in the next chapter.


    **Observation Notes:**


    **IP address:** 10.0.2.15


    **Operating System:** Linux (Unknown)


    **Open Ports & Services:**


    21/tcp FTP


    ProFTPD 1.2.10


    22/tcp SSH


    Dropbear sshd 0.34 (protocol 2.0)


    25/tcp SMTP


    Postfix smtpd


    80/tcp HTTP


    Apache httpd 2.4.25


    110/tcp POP3


    Dovecot pop3d


    139/tcp netbios-ssn


    Samba smbd 3.X - 4.X (workgroup: WORKGROUP)


    143/tcp IMAP


    Dovecot imapd


    445/tcp netbios-ssn


    Samba smbd 3.X - 4.X (workgroup: WORKGROUP)


    465/tcp SMTP


    Postfix smtpd


    587/tcp SMTP


    Postfix smtpd


    993/tcp ssl/imaps?


    995/tcp ssl/pop3s?


    123/udp ntp


    NTP v4 (unsynchronized)


    137/udp netbios-ns


    Samba nmbd netbios-ns (**workgroup:** WORKGROUP)


    161/udp snmp


    SNMPv1 server; net-snmp SNMPv3 server (public)


    # [Kioptrix:5](#toc.xhtml_s100a)


    After starting the Kioptrix target you will be presented with a ‘mountroot>’ prompt
    type in the command **`ufs:/dev/ada0p2`** and press the *Enter* key to complete
    the bootup process.


    ![](images/Figure-5.16.jpg)


    **Figure 5.16:** Kioptrix bootscreen'
