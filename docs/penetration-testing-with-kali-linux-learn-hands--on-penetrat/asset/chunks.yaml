  trans: "\n\n一旦成功下载了安装程序，请继续安装 VirtualBox 并按照屏幕上的指示操作。VirtualBox 有许多实用的功能，其中一个重要功能是能够托管多个虚拟机（VM）并创建一个完全隔离于主机网络的私有网络。在某些情况下，将流量隔离在虚拟机网络内部至关重要，特别是在处理恶意软件文件、漏洞时，或者为了防止误扫描主机网络。但在我们的实验室中，我们将出于各种目的访问主机互联网，更多关于单个虚拟机的网络设置将在本章节的后续部分详细介绍。\n\
    \n![](img/Figure-1.3.jpg)\n\n**图 1.3:** VirtualBox 工具菜单\n\n安装完成后，可以通过访问 `Preference`（选项）选项（你也可以按下键盘\
    \ `Ctrl+G`）来配置 VirtualBox 并执行各种配置。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4:** VirtualBox\
    \ 选项窗口\n\n# 设置 VirtualBox 网络\n\n本实验将使用 NAT 网络。要为实验创建一个 NAT 网络，请从工具菜单打开设置。从左侧面板选择\
    \ `Network`（网络）选项，在这里你可以通过选择右面板上的三个选项之一，创建新的、删除旧的或编辑现有的 `NatNetwork`。\n\n![](img/Figure-1.5.jpg)\n\
    \n**图 1.5:** Virtual NAT 网络设置\n\n双击 NAT 接口会弹出一个窗口，可以在其中配置实验网络使用的名称和 IP 范围。我们将选择名称\
    \ `NatNetwork` 以及 IP 地址范围 10.0.2.0 和 CIDR 前缀 `/24`。\n\n![](img/Figure-1.6.jpg)\n\
    \n**图 1.6:** VirtualBox 选项\n\n# 安装 Kali Linux\n\n设置和配置完成后，让我们继续按照以下说明安装 Kali Linux（我们的第一个虚拟机）。Kali\
    \ 是一个基于 Linux 的虚拟机，已针对渗透测试目的进行了预配置。书中的所有的测试和练习都是基于 Kali Linux 和其他目标虚拟机的（关于目标虚拟机的更多信息请见其他章节）。你可以从此处的父网站下载最新版本的\
    \ Kali Linux 各种镜像：**[`www.kali.org/downloads/`](https://www.kali.org/downloads/)**。在我们案例中，我们选择了\
    \ VirtualBox 作为虚拟平台，因此 Kali Linux 镜像需要与 VirtualBox 兼容，可以在此位置找到：**[`www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/`](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/)**（我们将在实验中使用\
    \ 64 位版本，如下图所示）。在编写此书时，可用版本为 2019.3。\n\n![](img/Figure-1.7.jpg)\n\n**图 1.7:**\
    \ Kali Linux 下载\n\n一旦下载了兼容 VirtualBox 的 OVA 文件，让我们继续按照下面的说明将其设置为 VirtualBox 中的虚拟机。\n\
    \n参考上图 1.3 图中提到的 VirtualBox 工具菜单，我们将使用 `import`（导入）选项，通过指向下载的 OVA 文件位置来创建 Kali\
    \ Linux 虚拟机。按照如下图所示的屏幕指示操作：\n\n![](img/Figure-1.8.jpg)\n\n**图 1.8:** VirtualBox\
    \ 导入虚拟机选项\n\n点击 next（下一步）继续，下一个屏幕将显示有关虚拟机的所有参数和细节，在这里可以更改虚拟机的几个参数。选择从 OVA 提取并存储虚拟机的基础文件夹位置，完成后点击\
    \ `Import`（导入）按钮开始导入。\n\n![](img/Figure-1.9.jpg)\n\n**图 1.9:** 导入虚拟机\n\n导入完成后，它将出现在左侧面板。选择\
    \ Kali Linux 虚拟机，右面板将显示该机的选项。\n\n![](img/Figure-1.10.jpg)\n\n**图 1.10:** Kali\
    \ Linux 虚拟机详情\n\n安装完成后，继续进行网络设置，将 Adapter 1（适配器 1）连接到 NAT 网络以及你在上一步中创建的网络（如下例图截图所示）。\n\
    \n![](img/Figure-1.11.jpg)\n\n**图 1.11:** Kali 网络设置\n\n实验室中的所有虚拟机连接到同一个 NAT 网络是非常重要的，这样在网络设置完成后，它们就可以相互通信。\n\
    \n可以通过双击要启动的虚拟机名称，或右键点击虚拟机名称导航到 `Start`（启动）子菜单并选择 `Normal Start`（正常启动）选项来启动虚拟机，这样做将打开一个新窗口并启动引导过程。\n\
    \n可以通过关闭按钮并选择 `Send the shutdown signal`（发送关闭信号）来关闭虚拟机，这将向虚拟机发送 ACPI 关闭信号，从而触发操作系统中的关闭进程。\n\
    \n![](img/Figure-1.12.jpg)\n\n**图 1.12:** 关闭虚拟机\n\n在不需要关闭虚拟机的情况下，可以使用 `Save the\
    \ machine state`（保存机器状态）选项，选择这将冻结机器状态并保存到系统硬盘中，此选项等于 Windows 的休眠功能，所有打开的程序和服务将保持保持激活状态，你可以从离开的地方继续。\n\
    \n![](img/Figure-1.13.jpg)\n\n**图 1.13:** Kali 图形桌面环境\n\n现在设置已准备好进行渗透测试活动了。\n\n\
    # 总结\n\n本章提供了渗透测试的概述、可用的测试类型以及测试阶段。本章还涵盖了 VirtualBox 的安装、网络设置以及 Kali 机的导入。\n\n\
    接下来，下一章将重点通过填充各种目标机器来扩展我们的虚拟实验室设置。\n\n# \n\n1. 解释什么是渗透测试及其重要性？\n2. 为什么渗透测试被划分为不同的阶段？\n\
    3. 设置虚拟网络使用的 IP 地址范围是什么？\n\n# 第 2 章\n\n# 渗透测试实验室\n\n在上一章中我们在虚拟环境中安装了 Kali Linux。在本章中，我们将解释如何在环境中安装目标机器，这些目标将作为故意留有漏洞的测试平台，以便安全地学习和实践真实的渗透测试技能。\n\
    \n**注意：** 虽然书中的章节安排与渗透测试的各个阶段同步，但建议在尝试下一个机器之前完成每个台机器的操作。虽然这并非强制，但这种方法可以让读者通过重复练习保持思路并充分吸收方法论。\n\
    \n# 结构\n\n在本章中，我们将学习以下主题：\n\n* 下载目标机器。\n* 在我们的虚拟环境中填充目标机器。\n\n# 目标\n\n阅读完本章后，你将能够：\n\
    \n* 在虚拟环境中导入不同类型的目标系统。\n* 拥有一个可用于执行后续章节中练习的运行实验室设置。\n\n# 目标机器\n\n书中展示的目标机器经过精心挑选，通过提供广泛的用例来最大化读者的学习体验。这是为了让读者在学习旅途中逐渐掌握各种渗透测试技能。\n\
    \n"
- fmt: "\nFor the purpose of this book the target machines will be downloaded from\
    \ VulnHub which is an open repository of vulnerable target machines. Its website\
    \ `[www.vulnhub.com](http://www.vulnhub.com)`, is a searchable repository of hundreds\
    \ of carefully crafted vulnerable machines segregated by varying experience levels\
    \ ranging from beginner to expert.\n\nIn this chapter, we will learn to install\
    \ a few target machines available on VulnHub into our virtual lab environment.\n\
    \n![](images/Figure-2.1.jpg)\n\n**Figure 2.1:** the `[www.vulnhub.com](http://www.vulnhub.com)`\
    \ website\n\nThe following table showcases the target virtual machines which have\
    \ been covered in the book:\n\n| **Machine Name** | **VulnHub Webpage** |\n| :---\
    \ | :--- |\n| **DC:** 7 | **[https://www.vulnhub.com/entry/dc-7,356/](https://www.vulnhub.com/entry/dc-7,356/)**\
    \ |\n| **Kioptrix:** 2014 (#5) | **[https://www.vulnhub.com/entry/kioptrix-2014-5,62/](https://www.vulnhub.com/entry/kioptrix-2014-5,62/)**\
    \ |\n| **Digitalworld.local:** Joy | **[https://www.vulnhub.com/entry/digitalworldlocal-joy,298/](https://www.vulnhub.com/entry/digitalworldlocal-joy,298/)**\
    \ |\n| **HackInOS:** 1 | **[https://www.vulnhub.com/entry/hackinos-1,295/](https://www.vulnhub.com/entry/hackinos-1,295/)**\
    \ |\n| **Sunset:** Nightfall | **[https://www.vulnhub.com/entry/sunset-nightfall,355/](https://www.vulnhub.com/entry/sunset-nightfall,355/)**\
    \ |\n| **Mumbai:** 1 | **[https://www.vulnhub.com/entry/mumbai-1,372/](https://www.vulnhub.com/entry/mumbai-1,372/)**\
    \ |\n\n**Table 2.1:** Target Machines\n\n**Tip:** Targets systems usually run\
    \ into a few gigabytes each, downloading and installing all the images at once\
    \ will reduce the space available on your computer. Hence, in the interest of\
    \ optimizing the disk space utilization we recommend downloading and installing\
    \ the individual target machine before starting the test and removing them after\
    \ completion.\n\n# Setting up the targets\n\nThe download links for each target\
    \ machine can be found by visiting its webpage links given in `[Table 2.1](#c02.xhtml_tab2_1)`\
    \ and browsing to the download section of the page.\n\n![](images/Figure-2.2.jpg)\n\
    \n**Figure 2.2:** DC7 Target VM Setup\n\nThe virtual images on the VulnHub website\
    \ may be compressed, if this is the case then you may have to uncompress the relevant\
    \ zip/rar/bz2 files in a folder using `7-zip` or any other tool of your choice.\n\
    \n`7-zip` is a free software and can be downloaded from the website `https://www.7-zip.org/download.html`.\n\
    \n# Importing the Virtual targets\n\nOnce the relevant VMs are downloaded and\
    \ extracted you can start the import process. Click on `file`>`import` or `Ctrl-I`\
    \ within the VirtualBox application to open the import window, browse to the relevant\
    \ folder and click the `.ova` file. Doing this will populate all the configuration\
    \ settings from within the `.ova` file and display them in Appliance settings.\
    \ You can then start the import process by clicking on the import button at the\
    \ bottom of the window.\n\n![](images/Figure-2.3.jpg)\n\n**Figure 2.3:** DC 7\
    \ Setting\n\nYou should be able to see the newly imported machine in the left\
    \ pane after the import process finishes.\n\n![](images/Figure-2.4.jpg)\n\n**Figure\
    \ 2.4:** DC 7 VM\n\n# Special instructions for importing the Kioptrix: 2014 (#5)\n\
    \nThe Kioptrix:2014 machine had been designed to run on VMware so we will need\
    \ to a bit of extra work to make it run on VirtualBox.\n\nDownload and extract\
    \ `kiop2014.tar.bz2` VM and `kiop2014_fix.zip` from the VulnHub site into a folder,\
    \ double click the `kioptrix2014.vbox` (virtual machine definition) file to import\
    \ the settings into VirtualBox.\n\n![](images/Figure-2.5.jpg)\n\n**Figure 2.5:**\
    \ Kioptrix Import Settings\n\nThe virtual hard drive of this VM has been incorrectly\
    \ mapped which needs to be corrected before we can use the target, this can be\
    \ fixed by clicking on IDE master drive and selecting `choose a disk` option from\
    \ the drop menu to open file browser. Browse to the location of and open the `kioptrix2014.vmdk`\
    \ file to fix the issue.\n\nWe will now configure this machine to use our pre-configured\
    \ NAT network instead of anything else the developer may have configured. To do\
    \ so click open VM settings by either right clicking on the VM name and selecting\
    \ settings or by selecting the VM name and then clicking on the settings button\
    \ from the menu. Once the settings panel is open click on `Network` section in\
    \ the left pane and change the `attached to` value to NAT Network, select the\
    \ name of the network that we created in `[Chapter 1: The Basics of Penetration\
    \ Testing](#c01.xhtml)` in the name down menu. confirm the new settings by clicking\
    \ on the `OK` button.\n\n![](images/Figure-2.7.jpg)\n\n**Figure 2.7:** DC 7 Network\
    \ Setting\n\nOur target machine is now configured and ready to be tested. You\
    \ can use the same process shown above for downloading and importing the other\
    \ target machines listed in this book.\n\n# Concepts covered with hands-on testing\n\
    \nDuring the course of the book and using various combinations of the target machines,\
    \ many use cases will be explained in a step-by-step manner so that maximum learning\
    \ is achieved.\n\n*   Host discovery scans\n*   Port scans\n*   Operating System\
    \ fingerprinting\n*   Service identification and version detection\n*   Command\
    \ chains\n*   Automation using `bash` scripts\n*   Service enumeration\n    *\
    \   HTTP\n    *   SNMP\n    *   FTP\n    *   SMB\n    *   SQL\n*   Gather valuable\
    \ information from page source\n*   Fuzzing\n*   Local file inclusion\n*   Directory\
    \ traversal\n*   OS command injection\n*   Bypassing web access filtering through\
    \ user agent manipulation\n*   Remote code execution\n*   Bypassing file upload\
    \ restrictions\n*   Enumerating and attacking WordPress\n*   Brute-forcing online\
    \ login forms\n*   Encoding payloads\n*   Vulnerability research\n    *   Search\
    \ engines\n    *   Exploit websites\n    *   `searchsploit`\n    *   `Metploit`\n\
    *   Gaining reverse shell\n*   Using `netcat` for reverse shell and to transfer\
    \ files\n*   Reverse shell on hardened `netcat` with `fifo` and input/output redirection\n\
    *   Fixing limited capability reverse shell issues and upgrading to a TTY shell\n\
    *   Local system enumeration\n*   SUID binaries\n*   Explore commands run as superuser\
    \ using `sudo`\n*   Kernel exploitation\n*   Abusing unauthenticated TFTP service\n\
    *   Exploitation using `Metploit`\n*   Reverse shell using `PHP` backdoor\n* \
    \  Password Cracking\n*   Fuzzing input parameters to test vulnerabilities\n*\
    \   Privilege escalation and gaining root\n\nWe will use various tools available\
    \ in Kali linux to test out the use cases listed above, in doing so the reader\
    \ will gradually pick up the working knowledge of the various skills required\
    \ for penetration testing.\n\n# Conclusion\n\nThe stage is set and the lab is\
    \ almost ready to be used for testing purposes, in the next chapter we will touch\
    \ upon a few aspects of how to get around Kali Linux VM and familiarise ourselves\
    \ with some of the important commands and commonly used tools.\n\n# Questions\n\
    \n1.  Which keyboard shortcut did we use to import appliance into VirtualBox?\n\
    2.  Describe the networking adapter to enable networking between our kali and\
    \ target systems?\n"
