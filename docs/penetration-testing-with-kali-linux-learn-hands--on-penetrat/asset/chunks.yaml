    \ 中发现 pChart 应用程序\n*   8080/tcp http\n    *   Apache httpd 2.2.21\n    *   mod_ssl/2.2.21\n\
    \    *   OpenSSL/0.9.8q\n    *   DAV/2 PHP/5.3.8)\n\n# HackInOS\n\n我们在目标机器上发现了\
    \ 2 个开放端口，一个运行在端口 22/tcp 的 SSH 服务器，以及一个运行在非标准端口 8000/tcp 的 Apache HTTP 服务器。\n\n\
    让我们枚举该 HTTP 服务，并获取关于它的信息。从程序坞中打开 Firefox 浏览器，并访问 `http://10.0.2.4:8000`。\n\n![](img/Figure-6.24.jpg)\n\
    \n**图 6.24：** 端口 8000 默认 WordPress 页面\n\n我们可以看到目标服务器上运行着一个基础 WordPress 站点。让我们通过运行\
    \ `dirb` 扫描进一步枚举服务，以寻找其他文件和目录。\n\n打开终端并使用命令对 Apache 服务器运行 `dirb` 扫描：\n\n`dirb\
    \ http://10.0.2.4:8000`\n\n![](img/Figure-6.25.jpg)\n\n**图 6.25：** 对端口 8000 进行非递归\
    \ `dirb` 扫描\n\n我们可以看到目标系统中存在一个 `robots.txt` 文件；该文件被网站管理员用于阻止搜索引擎索引敏感文件和目录。\n\n\
    打开终端输入命令：\n\n`curl http://10.0.2.4:8000/robots.txt`\n\n![](img/Figure-6.26.jpg)\n\
    \n**图 6.26：** 使用 `curl` 查看 `robots.txt` 内容\n\n如上面的截图所示，`robots.txt` 列出了潜在的敏感文件和目录。\n\
    \n在浏览器中检查 `upload.php` 页面。打开 Firefox 浏览器并访问 `http://10.0.2.4:8000/upload.php`。\n\
    \n![](img/Figure-6.27.jpg)\n\n**图 6.27：** upload.php 页面\n\n上传页面似乎非常简单，仅具有上传功能。让我们通过查看\
    \ 页面源码看看能发现什么有趣的内容。\n\n打开终端输入命令 `curl http://10.0.2.4:8000/upload.php`。\n\n![](img/Figure-6.28.jpg)\n\
    \n**图 6.28：** 使用 `curl` 查看 `upload.php` HTML 页面\n\n代码显示了一个使用 POST 方法向服务器上传文件的表单。\n\
    \n![](img/Figure-6.29.jpg)\n\n**图 6.29：** HTML 页面中的 GitHub 链接\n\n我们可以看到页面源码的注释部分包含一个\
    \ URL；在现实世界中，你可能会遇到此类情况。通过仔细观察和检查测试过程中遇到的每一个细节来穷尽所有选项，对于渗透测试的整体成功和结果至关重要。让我们使用\
    \ Firefox 访问 `https://github.com/fatihhcelik/Vulnerable-Machine` 并进一步探索。\n\nGitHub\
    \ 页面包含两个文件 `README.md` 和 `upload.php`，开发者可能使用了该网站的源码。打开 GitHub 上的 `upload.php`\
    \ 文件研究代码。\n\n![](img/Figure-6.30.jpg)\n\n**图 6.30：** GitHub 上的 `upload.php` PHP\
    \ 源码\n\n记录目前的观察结果，我们将在下一章继续处理该机器。\n\n**观察笔记：**\n\n**IP 地址：** 10.0.2.4\n\n**操作系统：**\
    \ Ubuntu Linux\n\n**开放的端口与服务：**\n\n*   22/tcp SSH\n    *   OpenSSH 7.2p2 Ubuntu4.7\n\
    *   8000/tcp HTTP\n    *   Apache httpd 2.4.2\n    *   WordPress 5.0.3\n*   http-robots.txt:\
    \ 2 条目\n    *   /upload.php ![](img/ent.jpg) `https://github.com/fatihhcelik/Vulnerable-Machine---/blob/master/upload.php`\n\
    \n# Sunset: Night\n\n我们在目标机器上发现了 2 个开放端口，一个运行在端口 22/tcp 的 SSH 服务器，和一个运行在非标准端口\
    \ 8000/tcp 的 Apache HTTP 服务器。\n\n让我们枚举 HTTP 服务并获取关于它的信息。打开 `http://10.0.2.5` 显示的是默认\
    \ Debian 首页，让我们运行 `dirb` 扫描以寻找可能作为潜在入口点的文件和目录。\n\n打开终端并使用命令 `dirb http://10.0.2.5`\
    \ 对 Web 服务器运行 `dirb` 扫描。\n\n![](img/Figure-6.31.jpg)\n\n**图 6.31：** `dirb` 扫描\n\
    \n`dirb` 扫描在端口 8080 上的服务器上没有发现任何文件或目录。\n\n我们在目标主机上发现了 FTP、SSH、HTTP 和 mdns 等服务。让我们使用另一个名为\
    \ `Nikto` 的工具看看是否能发现什么。\n\n打开终端对网站运行 `nikto` 扫描：\n\n`nikto -h http://10.0.2.5`\n\
    \n![](img/Figure-6.32.jpg)\n\n**图 6.32：** `nikto` 扫描\n\nNikto 显示了一些关于 Apache 配置的结果，但没有发现新文件。\n\
    \n现在对目标主机上运行的 SMB 协议端口（139/tcp, 445/tcp）进行枚举，查找主机名、域名、操作系统、用户列表、用户组、密码策略等细节。\n\
    \n打开终端输入以下命令进行扫描：\n\n`enum4linux 10.0.2.5`\n\n![](img/Figure-6.33.jpg)\n\n**图\
    \ 6.33：** SMB 协议枚举\n\n显示 `enum4linux` 扫描结果的截图。\n\n扫描结果中的重要条目如下：\n\nVersion Samba\
    \ 4.9.5-Debian\n\nDomain NIGHTFALL\n\nUsers: matt, nightfall\n\n我们成功地从 Samba 服务收集了两个系统用户名，现在我们将学习使用这些信息对\
    \ FTP 账户进行爆破。\n\n让我们使用以下脚本或任一文本编辑器创建一个包含已识别用户列表的 `users.txt` 文件。\n\n![](img/Figure-6.34.jpg)\n\
    \n**图 6.34**\n\nKali 中的 `/usr/share/wordlists` 目录包含许多用于暴力破解和内容扫描的字典。Kali 自带的默认字典是\
    \ `rockyou.txt.gz`，包含 1434 万个唯一密码，非常适合破解本地密码哈希。然而，该字典被认为非常大，不适用于通过网络攻击密码。为了应对这一点，我们将使用\
    \ `wget` 命令从互联网下载一个较小的前 1000 个常用密码列表。\n\n在终端中输入命令：\n\n`wget https://raw.githubusercontent.com/DavidWittman/wpxmlrpcbrute/master/wordlists/1000-most-common-passwords.txt`\n\
    \n这将文件下载到当前目录。\n\n![](img/Figure-6.35.jpg)\n\n"
- fmt: "\n## Figure 6.35: Downloading files using wget\n\nMove the password list file\
    \ to the common kali wordlists directory using the command `mv 1000-most-common-passwords.txt\
    \ /usr/share/wordlists/` after the file completes downloading successfully.\n\n\
    We now have the user and password lists ready, let’s use hydra to bruteforce the\
    \ user accounts of matt and nightfall by sequentially trying out the passwords\
    \ we downloaded on the target’s FTP service.\n\nTo begin the password enumeration\
    \ for users, type the command in the terminal:\n\n```\nhydra -L users.txt -P /usr/share/wordlists/1000-most-common-passwords.txt\
    \ ftp://10.0.2.5\n```\n\nThe `hydra` tool is a network based password cracking\
    \ tool which supports brute-forcing of multiple protocols over the network. The\
    \ `-L` flag is used to specify a filename containing the list of users while the\
    \ `-P` flag specifies the file containing the list of passwords.\n\n![](images/Figure-6.36.jpg)\n\
    \n**Figure 6.36:** Bruteforcing FTP accounts\n\nThe `hydra` tool was successful\
    \ in brute-forcing the password for user matt as cheese.\n\nLet’s try to use matt’s\
    \ credentials to login into the target system by using the following command in\
    \ the terminal:\n\n```\nssh matt@10.0.2.5\n```\n\n![](images/Figure-6.37.jpg)\n\
    \n**Figure 6.37:** SSH login denied for user matt\n\nSSH login permission was\
    \ denied for user matt using the password cheese. We can see that the SSH service\
    \ also uses publickey authentication. However, so far we do not have the publickey\
    \ for user matt so let’s try to access the MySQLdatabase server running on port\
    \ 3306/tcp by using the command:\n\n```\nmysql -u matt -p -h 10.0.2.5.\n```\n\n\
    The `-u` flag specifies the username to use for logging into the MySQLserver `-p`\
    \ specifies that password is to be used for establishing the session and `-h`\
    \ flag specifies the host to establish the connection with.\n\n![](images/Figure-6.38.jpg)\n\
    \n**Figure 6.38:** MySQL access denied for user matt\n\nWe received an access\
