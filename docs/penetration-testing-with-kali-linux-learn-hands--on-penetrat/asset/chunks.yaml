    # CHAPTER 1: The Basics of Penetration Testing


    The term Penetration Testing also commonly known as pen-testing or `PT` has been
    around in the industry for decades, proving its importance by becoming a crucial
    piece of the larger IT security umbrella. It is a form of attack simulation exercise
    during which security professionals attempt to identity enumerate and attack vulnerabilities
    in applications, infrastructure, network or any other IT equipment and leverage
    these to gain access, and establish a foothold on the organization’s information
    environment.


    The intent of such a simulated attack is to determine gaps in the security implementation
    or perimeter defense mechanisms which may be exploited by unauthorized entities
    with ulterior motives.


    ## Structure


    In this chapter, we will touch upon the following topics:


    *   Penetration testing and its types.

    *   Need and importance of Penetration Testing.

    *   Pre engagement activities and phases.

    *   Install `VirtualBox`, set up lab networking and import virtual machines.


    ## Objectives


    After reading this chapter, you will be able to:


    *   Get an overview on the basic theory of Penetration Testing and common industry
    terminology.

    *   Understand the types of Penetration Tests.

    *   Get an overview on the activities which go into a Penetration Test.

    *   Have a working `Kali` setup which can be used to perform exercises shown in
    the chapters ahead.


    ## What is Penetration Testing?


    Penetration testing, not to be confused with `Vulnerability Assessment` (`VA`)
    (which is limited to enumerating vulnerabilities and does not delve into the exploitation
    of the vulnerabilities identified), even though `VA` may be pre-cursor to Penetration
    tests it is not an absolute requirement as Penetration tests can be performed
    with or without a need to perform `VA` in advance.


    A pen-test can vary in many different ways, depending on the need and scope of
    the project, but broadly a typical pen-test engagement starts with a security
    professional gathering information on the targets in scope, the targets are probed
    to discover the services hosted, the services are then systematically checked
    to identify their security weaknesses. The weaknesses identified are then researched
    and evaluated to analyze the risk rating, exploit availability, technique, reliability
    and potential impact. The tester then attempts to gain access to the target in
    scope using the exploits selected. If the exploitation is successful and the attacker
    is able to gain a foothold on the system, the security tester will ascertain the
    level of access available and further enumerate the system in an attempt to identify
    security issues, configuration weaknesses or sensitive information which may help
    them in further escalating the level of access available locally or on any interconnected
    targets in scope. Most of the phases are not in sequence, and hence the tester
    may move back and forth between them as and when required. Last but not the least,
    it is vitally important that all the activities from all the phases during the
    entirety of the pen-test are documented. This includes, scans type, tool command,
    observations made, the initial findings, what were the gaps, how each system was
    exploited, Pentesters are required to provide detailed account of the entire process
    followed along with the supporting evidences during the reporting phase.


    ## Pre-engagement activities for penetration testing


    Unlike any testing, Penetration testing has very well-defined phases. But depending
    on the initial observations the testers and researchers may choose to develop
    their own test approach by merging or deviating from usual laid out process. This
    will depend on the information and scope of testing agreed with the client. The
    focus of this book will be to walk through the standard penetration testing process
    that is broadly followed in the industry to test out infrastructure and web application
    assets. This book will not cover wireless and physical penetration testing.


    **Scope Definition**: Whenever you plan to pick up any pentesting activity, it
    is very important that the scope for the same is defined and agreed upon between
    the tester and the party requesting the testing. Some of the information that
    can be defined is, locations from where test is to be performed, IP ranges, System
    details and Application names, and URLs for testing. What are the timings to be
    followed to perform the tests, this is important to perform the testing activities
    within the said and defined window to avoid any unintentional or accidental downtime
    of critical systems (unless and otherwise explicitly stated by the client not
    to be bound by any time and window of testing)? Apart from what is in-scope, it
    is also important that the out of scope (Brute force attacks, Denial of Service
    and post compromise activities such as shell upload, local vulnerability assessment
    or privilege escalation) are defined in the contract wherever necessary.


    **Point of Escalation**: Your contract should have a point of escalation defined,
    whom to contact in cases of any incidents that might occur during the entire process.
    The escalation tree can be followed based on the defined window of penetration
    testing.


    **Legal Terms**: In some cases, the security tester might need to include some
    critical legal terms, such as who authorized the penetration testing to be performed,
    when and what to perform. Especially in cases where the systems being tested are
    not hosted by the same party who is asking to test it. The permission to perform
    the test has to be in written, on paper or digitally. This is to avoid any situation
    where if the client systems detect the activities and flag it as an intrusion,
    then the authorized person can intervene and make an exception. Otherwise in most
    of the countries it might be considered as an attempt to intrusion that is punishable
    by law.


    ## Phases of penetration testing


    A Penetration test is a complex exercise involving various types of activities
    which include probing, scanning, finding and researching vulnerabilities, and
    obtaining access on them, these activities are selected based on the type of target,
    and the knowledge gained during the test.


    Performing a test without a structured approach presents various risks pertaining
    to test coverage, time management and cost overruns. To avoid these issues and
    put some order to chaos the exercise is broken down into various phases which
    allow the tester to organise their thoughts and efforts during the testing.


    We will look at the typical phases which go into a penetration test below:


