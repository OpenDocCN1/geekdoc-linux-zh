    This will allow to successfully log into the system as dc7user. We can see the
    SSH post login message which reveals the Debian release and Kernel version, furthermore
    you will also notice that the user has received a new email.


    Let’s explore the user’s home directory to find out more about the target system.


    ![](images/Figure-7.3.jpg)


    **Figure 7.3:** Directory listing of dc7user’s home and backup directory


    Issuing the `ls -la` command in the home directory of the `dc7user`’s, shows a
    file called `mbox` and directory named `backups`, further looking into the backup
    directory shows two gpg files.


    Let’s view the contents of the user’s mbox file using the command `cat mbox |
    less` and scroll through the output using the arrow keys.


    ![](images/Figure-7.4.jpg)


    **Figure 7.4:** contents of mbox file


    You will notice a lot of emails from `root@dc-7` generated by Cron Daemon which
    is a typical task scheduling service for `*nix` system.


    The contents of the email tell us that the Cron scheduler executed `/opt/scripts/backup.sh`
    script and that the dump of the database was stored to `/home/dc7user/backups/website.sql`


    Let’s take a look at the `backup.sh` script permissions to check if we can modify
    it.


    ![](images/Figure-7.5.jpg)


    **Figure 7.5:** backup.sh file permissions


    The script is owned by root user and the group access is limited to www-data other
    users on the system do not have write permission on the file. This means that
    we will not be able to edit the backup script.


    We do have read access to the file so let’s check the contents of the script by
    running the command `cat /opt/scripts/backup.sh` from the terminal.


    ![](images/Figure-7.6.jpg)


    **Figure 7.6:** backup.sh file contents


    Examination of the contents of the backup script tells us that the script is being
    used to backup the contents of `/var/www/html` and sql database to `/home/dc7user/backups`.
    We can see that drush is being used for taking sql database backup and also that
    the `website.sql` and `website.tar.gz` files are encrypted using gpg using a passphrase
    `PickYourOwnPassword`


    A quick web search for drush reveals that it is a command line tool for performing
    administrative tasks on Drupal based websites. This functionality includes functionality
    of resetting password for users.


    [https://www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password](https://www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password)


    Let’s change the current directory in the terminal to `/var/www/html` and run
    the command `drush upwd --password=”admin123” admin` to change the current password
    for the admin user to `admin123`.


    ![](images/Figure-7.7.jpg)


    **Figure 7.7:** changing Drupal admin password using Drush


    The admin password for Drupal site was successfully changed to `admin123`. We
    should now have full control on the Drupal website.


    We now need to focus on leveraging the Drupal admin access to obtain shell access
    on the target system, for this to happen we need to create a PHP script or find
    a way to upload and execute a php script target system.


    A bit of information gathering on the internet reveals that PHP code functionality
    is provided by a Drupal module named ‘php’ which has been removed from Drupal
    versions 8.x and above.


    Interestingly Drush provides a way to enable modules so let’s re-enable this module
    using the command `drush en php` from the terminal and press ‘y’ when prompted
    to confirm the download.


    ![](images/Figure-7.8.jpg)


    **Figure 7.8:** Drupal of PHP module download failed using Drush due to lack of
    write permissions


    The download failed, looks like the dc7user does not have write permissions to
    the `/var/www/html/directory`. The earlier approach did not work however we should
    still be able to install the module by accessing our Drupal installation through
    browser.


    Using the firefox browser download the php module to our Kali system from [https://www.drupal.org/project/php](https://www.drupal.org/project/php).


    Login to the target Drupal installation using the admin credentials, click on
    `Extend` and then on `+install new module` button. Browse to the `php-8.x-1.0.tar.gz`
    module and upload it to the Drupal site by clicking on the `Install` button.


    ![](images/Figure-7.9.jpg)


    **Figure 7.9:** uploading the PHP module


    Once this step is complete you will be presented with a message that the module
    was installed successfully, click on `enable newly added modules` link in message
    or browse to the `http://10.0.2.27/admin/modules` page.


    Scroll through the modules list to find the ‘PHP Filter’ module, click on the
    checkbox next to the module, and then click on the `Install` button.


    ![](images/Figure-7.10.jpg)


    **Figure 7.10:** php module has been enabled


    The ‘PHP Filter’ module has been enabled on the target; we should now be able
    to conclude the research.


    The contents of the `version_control` file indicate to us that it may be internal
    notes shared between server administrators. The file gives us valuable information
    on the version numbers of Apache, Dropbear SSH, Proftpd, and Samba services.


    You will also notice comments stating that the default webroot directory has been
    changed to `/var/www/tryingharderisjoy` and that the admin may be learning bash
    scripting suggesting the possibility of finding vulnerable shell scripts on the
    target system.


    Using the information found in `version_control` document and service enumeration
    phase, we now have a master list of package versions for the external facing services
    running on the target machine:


    Apache2 package version 2.4.25-3


    ProFTPD version 1.3.5


    Dropbear SSH version 0.34


    Dovecot package version 1:2.2.27-3


    Postfix package version 3.1.8-0


    Samba package version 4.5.16


    Snmpd package version 5.7.3


    At this moment you may use this information to find out if there are any known
    weaknesses in the versions of packages that we identified on the remote target.

