    到为止，我们已经涵盖了渗透测试的基础知识以及行业使用的术语。我们还创建了一个虚拟实验室环境，作为一个可以让我们安全地学习和练习技能的平台。在本章接下来的内容，我们将教你如何在新安装的
    Kali Linux 中操作，熟悉 Kali Linux 发行版中提供的工具和技术，以及如何有效地使用它们。


    # 结构


    在本章中，我们将涉及以下领域：


    * Kali Linux 概述。

    * 基础账户和系统管理。

    * 软件包管理。

    * 系统操作

    * Shell 脚本


    # 目标


    读完本章后，你将能够：


    * 浏览界面并学习有用的命令。

    * 执行与系统管理相关的任务。

    * 安装、更新和删除软件包。

    * 理解 Shell 脚本概念。

    * 使用 Shell 脚本自动化和简化复杂任务。


    让我们启动 Oracle VM VirtualBox Manager 中安装的 Kali Linux 虚拟机。在左窗格中选择 Kali Linux 虚拟机，然后选择
    `Machine`（虚拟机）菜单及其 `Start`（启动）选项。选择 `Normal Start`（正常启动）运行 Kali 虚拟机。你会注意到 Kali
    Linux 虚拟机的启动序列已经开始。继续使用用户名 `root` 和密码 `toor` 登录系统（如果你使用的是较版本的 kali，则使用用户名 `kali`
    和密码 `kali`）。如果使用 dvd 镜像安装虚拟机，在安装过程中会被要求提供备用密码，在这种情况下，你需要使用提供的密码登录。


    ![](img/Figure-3.1.jpg)


    **图 3.1：** Kali 图形桌面环境


    桌面的左侧是“Dock”栏，它包含几个常用应用程序的快捷方式，以帮助快速启动最常用的程序。用户可以通过拖放来自底部的 `Show Applications`（显示应用程序）图标的快捷方式来轻松自定义
    Dock 栏中的快捷方式。界面顶部分为几部分，左侧是下拉菜单 `Applications`（应用程序），它是 Kali Linux 中可用各种应用程序的集合，这些应用程序进一步划分为不同的类别（例如：信息收集、漏洞分析等），这样做是为了便于识别在渗透测试不同阶段使用的工具。请花些时间浏览所有类别，以熟悉
    Kali Linux 中提供的工具列表。`Applications` 菜单的紧邻右侧是 `Places`（位置）菜单，它包含指向常用用户目录的链接，如当前用户主目录、桌面和其他几项。面板的右侧包含用户菜单，其中包含配置声音、网络连接、电池的图标，以及用户设置、锁屏和关机菜单。


    # 修改默认密码


    可以使用 `passwd` 命令更改 root 用户的密码，运行 `passwd` 命令后，系统会要求你输入两次新密码，新密码将在系统中更新，且更改将在下次登录时生效。


    ![](img/Figure-3.2.jpg)


    **图 3.2：** Kali 终端


    作为一个提醒，请记住默认密码是严峻的安全风险，也是导致系统被攻破的主要原因，这些密码应该始终被更改。


    # 修改时区


    Kali Linux 默认设置的时区是 UTC，可以通过点击面板右侧的用户菜单进行更改。点击当前用户 `root`，然后点击 `Account Settings`（账户设置），这将打开一个新的设置窗口，导航到
    `Date and Time`（日期和时间）设置，配置这些设置以匹配你的时区、日期和时间。


    ![](img/Figure-3.3.jpg)


    **图 3.3：** tzdata 的软件包配置


    通过命令行更改这些设置的另一种方法是以 root 身份输入命令 `dpkg-reconfigure tzdata` 并在提示时更改设置。


    # 命令帮助


    在使用任何 *nix 平台时需要注意的一点是，与系统的大部分交互是通过命令行进行的，并且每个软件命令都有多种输入选项和子选项。由于 Kali Linux 中提供了大量工具，用户忘记命令语法和选项是非常常见的现象。


    为了解决这个问题，Linux 发行版上的软件包附带了帮助文件，被称为 man page（manual pages 的缩写）。可以通过输入命令 `man <command
    name>` 来访问这些手动帮助页。


    ![](img/Figure-3.4.jpg)


    **图 3.4：** nmap 命令的帮助页


    `man nmap` 命令的截图，帮助页展示了 nmap 中可选项及其用法。


    # 安装、删除和更新软件包


    Kali 带有许多黑客工具和支持软件包，但在某些情况下，可能需要安装额外的工具或库，这些工具可能不是标准 Kali 构建的一部分。在编译二进制文件或使用新软件包执行
    perl 或 python 脚本时，经常会遇到缺少库的错误。


    在 Kali Linux 中安装软件包有多种方法，最常用且最简单的方法是使用一组名为 `apt` 的默认软件包管理工具，它是“advanced packaging
    tool”（高级软件包工具）的缩写，该工具维护 Kali Linux 软件仓库中可用软件的本地数据库。


    用于软件包管理的最常用 apt 命令选项如下：


    ## apt search <search-string>


    apt 中的 `search` 选项用于通过名称或类型查找软件包，该选项提供了存储库中匹配搜索标准的软件包列表，这在不确定切软件包名称时特别有帮助。


    ![](img/Figure-3.5.jpg)


    **图 3.5：** 使用 apt 搜索软件包


    使用命令 `apt search screenshot` 搜索包含关键词 `screenshot` 的软件包，将提供匹配搜索标准的软件包列表。


    ## apt show <package name>


    apt 中的 `show` 选项在提供合适的包名时会列出有关该软件包的所有信息，详情包括软件包版本、作者、安装大小、与其他软件包的依赖以及软件包的详细描述。


    ![](img/Figure-3.6.jpg)


    **图 3.6：** gnome-screenshot 软件包的详情


    使用命令 `apt show gnome-screenshot` 显示 gnome-screenshot 软件包详情的示例。


    ## apt install <package name>


    此用于安装软件包，执行此命令后，apt 软件包管理器将提供满足给定软件包所需的所有依赖项列表，以及安装所需的空间，并请求确认；如果用户给出了确认，软件包管理器将安装该软件包以及该软件包所需的所有依赖项。


    ![](img/Figure-3.7.jpg)


    **图 3.7：** 安装 gnome-screenshot 软件包


    使用命令 `apt install gnome-screenshot` 安装 gnome-screenshot 软件包。


    ## apt remove <package name>


    '
- fmt: '

    The remove option is used to remove the package matching the name provided, upon
    issuing this command the apt package manager will ask the user for confirmation
    for package removal, if a confirmation is given by the user the package manager
    will proceed to remove the package from the system.


    *Warning: Kali contains hundreds of different packages and their interdependent
    libraries, the update and upgrade options showcased below are used for synchronizing
    the package database and updating the packages to the latest versions available
    globally. In the interest of the reader being able to complete all the exercises
    given in this book the authors recommend against using these before completing
    all the exercises given in this book.*


    # apt update


    Apt package manager tools use a local database to maintain a list of software
    available on the global repository, this may eventually lead to version differences
    in list of packages or their version between local apt database and global software
    repository, Update option synchronizes the list of packages available in the local
    package database to the list available in global package repositories.


    ![](images/Figure-3.8.jpg)


    **Figure 3.8:** apt update


    # apt upgrade


    The upgrade option is used for upgrading all upgradable packages to the latest
    version numbers referenced in the local software database, when this option is
    used the upgradable software are downloaded from the global repository and installed
    on the system.


    # dpkg


    You may sometimes encounter situations that a package required is not available
    on Kali repositories for installation, in such cases a compatible `.deb` package
    can be downloaded for the system architecture (i386, amd64, SPARC, and so on.)
    and installed using the command `dpkg -i <path-to-file.deb>`.


    **Note:** the `dpkg` command does not resolve dependency issues so the dependencies
    need to be installed prior to installing the .deb package file.


    # Searching for files


    There are multiple tools available within Kali to help you find files on your
    system, the most commonly used programs for finding files are locate, which `whereis`
    and `find`. You may have to use one or the other depending on the results that
    you are trying to achieve.


    # locate <file name>


    The `locate` command searches for file queried within a system-wide database of
    file names, this results in extremely fast search timing, on the downside, using
    this approach the search results are only as relevant as long as the database
    remains updated, the `updatedb` command should be used to update the locate database.


    ![](images/Figure-3.9.jpg)


    **Figure 3.9:** locate command


    Searching for files containing the word `wordlists` using `locate` command.


    **Info:** the `locate` command displays matching keywords in entire file path
    not just the file name.


    # whereis <file name>


    The `whereis` command is used to search for binaries, manuals (help files) and
    source files, the command searches for the supplied filenames within the standard
    Linux directories and directories specified in the environment variables (`$PATH`
    and `$MANPATH`) of the current user.


    ![](images/Figure-3.10.jpg)


    **Figure 3.10:** whereis command


    The `whereis wordlists` command displayed above shows a significantly reduced
    output as the keyword `wordlists` is only matched to the end filename instead
    of the entire file path this behavior is desirable when exact filenames are known.


    # find <search directory> <criteria> <search string>


    The `find` command is a far more aggressive approach towards finding files which
    match the search criteria, the `find` command allows the user to search for files
    in a much more granular fashion using criteria such as file name (`-name`), file
    permissions (`-perm`), creation time (`-ctime`), modification time (`-mtime`),
    group id (`-gid`), group name (`-group`) and many other options.


    ![](images/Figure-3.11.jpg)


    **Figure 3.11:** find command


