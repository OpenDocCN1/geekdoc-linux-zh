    \n`OpenSSHd 7.2p2 - Username Enumeration  | exploits/linux/remote/40113.txt`\n\
    \n对目前观察到的结果进行记录，我们将在下一章继续这台机器。\n\n**观察笔记：**\n\n**IP 地址：** 10.0.2.4\n\n**操作系统：**\
    \ Ubuntu Linux\n\n**开放端口与服务：**\n\n*   22/tcp SSH\n    *   OpenSSH 7.2p2 Ubuntu\
