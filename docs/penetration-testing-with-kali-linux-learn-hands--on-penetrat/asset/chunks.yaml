    The preceding command caused the variable `cuser` to output of `whoami` command,
    and later the `echo` command was used to print value of `cuser` variable on the
    user’s screen.


    Command chaining can also be achieved using the `&&` operator. The main difference
    here is that next command in sequence is executed only if the previous command
    succeeds, the chain stops executing if the previous command exits with an error.


    ![](images/Figure-3.20.jpg)


    **Figure 3.20:** Command chaining using `&&` operator


    The preceding screenshot showcases two scenarios, the first chain command executed
    correctly where the `cuser` variable was set, and the `echo` command displayed
    its value in the terminal, whereas in the second scenario the `cat` command returned
    an error, and the command chain stopped before the value of `cuser` variable was
    displayed.


    Bash provides the capability to redirect the input and output of commands using
    file descriptors, to understand this better a program in Linux takes an input
    from keyboard (**Standard Input** (**STDIN**)) and produces an output (**Standard
    Output** (**STDOUT**)) or an error (**Standard Error** (**STDERR**)) both of which
    are sent to the user’s screen, bash provides us capability to redirect these using
    operators `|` `<` and `>`.


    When using the operator `|` for chaining commands the output (`STDOUT` and `STDERR`)
    of the command which would have otherwise been displayed on the user’s screen
    are passed as the input (`STDIN`) to the next one.


    Elaborating on the previous example the `cuser` variable will be set to the output
    of `whoami` command, additionally we will utilize the `cat` command to read the
    contents of the `/etc/passwd` file, and pipe its output through `grep` to filter
    and display the line pertaining to the value of the `cuser` variable.


    ![](images/Figure-3.21.jpg)


    **Figure 3.21:** Output redirection using `|` operator


    The above command completed successfully and displayed the entry pertaining to
    `root` in the passwd file, instead of the entire passwd file contents.


    The `cat` command was employed in our previous example to read the contents of
    the `/etc/passwd` file. The STDOUT output of `cat` command was piped through `grep`
    display the line pertaining to the value stored in `cuser` variable that is, root.
    We can also achieve the same results by redirecting the entire contents of `/etc/passwd`
    file as the STDIN of `grep` command using the `<` operator.


    ![](images/Figure-3.22.jpg)


    **Figure 3.22:** Input redirection


    We achieved the same results without using the `cat` command through simple input
    redirection.


    *Lightbulb: One difference to note is that `|` operator can also be used for chaining
    multiple commands whereas `<` is used to redirect files as an input to a command
    or a variable.*


    In our next example we will learn how to redirect the output of our previous command
    into a file called `cuser.txt`, we will then use the `cat` command to verify the
    contents of the `cuser.txt` file.


    ![](images/Figure-3.23.jpg)


    **Figure 3.23:** output redirection into a file


    Apart from redirecting the STDOUT, the `>` operator also creates a previously
    non-existent file called `cuser.txt`.


    ***Warning:** If you redirect the command output into a file using operator `>`
    you will only be able to notice the output of the last execution as the file is
    overwritten each time the command is executed. Good amount of precaution becomes
    necessary when using the operator `>` to prevent any accidental overwrites of
    useful files.*


    If you try repeating the first command a few times and then read the `cuser.txt`
    output, you will notice there is only one entry in the file, this is because the
    operator overwrites any pre-existing files with the same name resulting in a fresh
    entry each time. Using the `>>` operator resolves the overwriting issue by appending
    the output in the file instead of completely overwriting it.


    ![](images/Figure-3.24.jpg)


    **Figure 3.24:** Output redirection appending output to a file


    # Loops


    There are a few ways to achieving loops when using bash shell, for the sake of
    this book we will focus on the `for loop` which is used for running a given set
    of commands on a list of items.


    In the following example we will create a simple `for loop` with the value of
    the variable `i` is set to a list of values from 1 to 5 generated using the `seq`
    command, the loop will run the `sleep` command and echo the value of variable
    `i` into a file `loop.txt`, the loop will continue to run the same set of commands
    for the next value in `i` till value of the `i` gets to 5 post which is when the
    loop will complete its final execution of commands and exit.


    ![](images/Figure-3.25.jpg)


    **Figure 3.25:** For loops


    As you may have noticed the above script took 5 seconds to execute due to a 1
