    Moving on, the next chapter will focus on various scanning and enumeration tools
    that are available in Kali Linux and perform hands-on exercises to find security
    issues in the target systems.


    # Questions


    1. Which protocols are used to determine alive hosts on an IP network?

    2. Which `nmap` scan type is also known as half-open scan?

    3. What is aggressive mode in `nmap` and why is it used?


    # CHAPTER 6


    ## Service Enumeration and Scanning


    The previous chapter was divided into two main parts. The first half of the previous
    chapter covered the various pre-engagement activities which are needed to plan
    a successful penetration test. The latter half of the chapter covered the theory
    of reconnaissance along with hands-on usage of tools available on kali linux to
    obtain valuable information about the target systems.


    This chapter will explain how to utilize the knowledge gained about the targets
    in the previous chapter to perform further scanning and enumeration of the services
    identified by us earlier.


    ## Structure


    In this chapter, we will touch upon the following topics:


    * Enumeration of various services

    * Scanning services to identify potential weaknesses and entry points


    ## Objectives


    After reading this chapter, you will be able to:


    * Understand the theory of enumeration and service scanning.

    * Perform enumeration and service scanning using the tools available within Kali
    Linux.


    ## DC-7


    We had previously identified an Apache web server running a Drupal based website
    on port `80` of the target, moving forward we will be enumerating this service
    further to find any important files or directories present on it.


    Let’s open up a terminal and run a dictionary based web content scan against the
    website using the command `dirb http://10.0.2.27`


    ![](images/Figure-6.1.jpg)


    **Figure 6.1:** `dirb` scan


    You will notice that the default scan without any switches takes a significant
    amount of time and most of the scan output consists of 403 forbidden error pages,
    as reflected in the scan results in above screenshot.


    You can improve this scan timing and output by running this command:


    `dirb http://10.0.2.27 -r -N 403`


    ![](images/Figure-6.2.jpg)


    **Figure 6.2:** `dirb` fine tuning


    The `-r` switch stops the `dirb` tool from recursively checking for the same files
    in any directories identified. The DC-7 target responds with a lot of 403 messages
    for many directories, and `-N` option is used to instruct the `dirb` tool to ignore
    or filter out unwanted responses and minimize false entries from showing up in
    the scan results.


    Notice the `robots.txt` file is present on the target system; this file is used
    by website administrators to stop search engines from indexing sensitive files
    and directories.


    Now, open up the Firefox browser from the dock and browse to:


    `http://10.0.2.27/robots.txt`


    ![](images/Figure-6.3.jpg)


    **Figure 6.3:** `robots.txt` on DC-7


    In the preceding screenshot we can see that `robots.txt` lists some directories
    that are not intended to be indexed. These can be very interesting for a penetration
    tester as they may contain sensitive information or administrative interfaces.

