    Contact information about the key personnel such as name, designation, email,
    phone number should be exchanged between the parties along with the role they
    would play during the penetration test, this information should be documented
    in the statement of work and engagement contract. The documents should be duly
    signed with the client, and shared over the mutually agreed secure communication
    channels as described before.


    Personnel from the client’s side include representatives from:


    * Key stakeholders from the management

    * Project manager

    * IT Administration

    * Information security

    * Network security

    * Security operations center

    * Application development


    Personnel overseeing, managing and carrying out the testing:


    * Management

    * Project manager

    * Lead penetration tester

    * Team members


    # Testing window


    The factor by which you should be able to decide a testing window will depend
    on the overall maturity of the customer’s security team, the environment provided
    for testing (development/production) and criticality of the systems under review.


    This could range anywhere from 24x7 testing to just a few hours a day during off
    business or non-peak hours or in some cases could be weekend only, it is very
    important to bear this in mind while preparing a test schedule. Adequate support
    staff should be available at the customer’s end for quickly addressing any problems
    encountered by the testing team should any issues arise.


    Once the test dates and timing are agreed they should be noted down in the contract
    document signed by both parties.


    # Test limitations


    As some of the testing may impact the test environment directly. It is crucial
    to understand the customer’s reservations, and set adequate boundaries for the
    test being undertaken, this setting of boundaries may be done for multiple reasons
    some of which include the following:


    * To avoid crashing the tested systems or services (example: denial of service).

    * To avoid impact to the performance of test systems (example: denial of service).

    * To conserve time in case tests may run for too long (example: brute forcing
    of login forms).

    * To avoid exposure of sensitive data (example: uploading of password hashes to
    online cracking websites).

    * To avoid malicious scripts being introduced to the environment (example: uploading
    web shells, kernel exploits, and so on.)


    Upon completion of pre-engagement discussions, planning, scheduling, and contract
    signing. The testing can begin as per the test window agreed.


    # Reconnaissance


    This section is aimed at familiarizing the user with different reconnaissance
    tools and techniques available in Kali Linux by practicing their skills in the
    lab environment which was created earlier in the book.


    Let’s proceed with the practical aspects of penetration testing in our lab environment.
    Boot up the Kali Linux machine, and the various target machines to practice the
    exercises given ahead. Please allow an adequate amount of time for the target
    machines to fully boot up before starting the test.


    Log into the Kali Linux system, open a terminal window from the dock and issue
    an `ifconfig` command to get the network and IP details assigned to our Kali system.


    ![](images/Figure-5.1.jpg)


    **Figure 5.1:** `ifconfig` command


    The output of `ifconfig` command shows that our Kali system has been assigned
    an IP address `10.0.2.238` and the network mask is set to `255.255.255.0`.


    One thing we know from our target environment is that the test machines are on
    the same virtual network as our Kali system. Going by the network mask information
    we can derive that the network consists of a total of 256 host IP addresses. Excluding
    the network IP `10.0.2.0` and the broadcast IP `10.0.2.255` addresses we are left
    with a usable host IP range between `10.0.2.1` through `10.0.2.254` for the target
    systems.


    **Note:** All the testing will be carried out from our Kali Linux system over
    the virtual lab network and we will not be interacting with the test targets directly.
    Make a note of the details before proceeding with the next section.


    # DC:7


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** DC-7 login screen


    Screenshot of DC-7 machine fully booted up.


    The DC-7 console displays the current IP assigned to it, however in a real-world
    test, this will not be the case hence, we will explore means to find out this
    information over the network.


    There are many readymade tools available on Kali Linux to perform target reconnaissance
    but using them directly without understanding their inner workings would result
    in not grasping the core concepts. The initial exercises would involve writing
    basic scripts for performing target reconnaissance taking this approach should
    hopefully help clarify things for the reader before using the readymade tools
    available in Kali Linux.


    One option to find ‘alive’ hosts on a network is to perform a scan of the network
    with a series of ping (ICMP echo) requests and wait for responses from the hosts
    which are up and running. So, let’s open a terminal window and create a very basic
    ping sweeper utilising a bash `for` loop to send ICMP echo requests to all the
    hosts in the IP range using the built-in `ping` command.


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Ping sweeping the network using a simple `for` loop


    The number of ICMP echo requests sent by the `ping` command to each host have
    been restricted to 1 using the `-c` flag without this restriction standard Linux
    `ping` command will keep sending ping requests indefinitely unless interrupted
    by pressing `^c`. To speed up the script run time the timeout setting has also
    been reduced and set to 1 second using the `-W` flag. This means that the `ping`
    command will wait for ICMP responses for 1 second before timing out and exiting.


    The `ping` output contains failed ping requests along with the ping responses
    received from alive ‘hosts’, to avoid seeing the failed requests on our screen
    we piped the output received through the `grep` command using keywords “bytes
    from” to only show us the hosts which have responded to our requests.


    ```

    root@kali:~# for i in $(seq 1 254); do ping -c1 -W1 10.0.2.$i | grep "bytes from"
    ;done

    ```


    ```

    64 bytes from 10.0.2.1: icmp_seq=1 ttl=64 time=2.37 ms

    64 bytes from 10.0.2.18: icmp_seq=1 ttl=64 time=341 ms

    64 bytes from 10.0.2.27: icmp_seq=1 ttl=64 time=0.646 ms

    64 bytes from 10.0.2.180: icmp_seq=1 ttl=64 time=110 ms

    64 bytes from 10.0.2.208: icmp_seq=1 ttl=128 time=1.74 ms

    64 bytes from 10.0.2.238: icmp_seq=1 ttl=64 time=0.049 ms

    64 bytes from 10.0.2.245: icmp_seq=1 ttl=64 time=65.5 ms

    64 bytes from 10.0.2.253: icmp_seq=1 ttl=64 time=266 ms

    root@kali:~#

    ```


    As seen from the output, the command performed as expected, and returned all the
    ‘alive’ hosts within the 10.0.2.X range.


    The lab environment we are using has multiple active machines, and the ping sweep
    of test lab shows replies from multiple hosts, this output would be different
    in the case of the reader if only DC-7 machine is booted up.


    **Note:** This type of network mapping will fail if hosts have ICMP echo requests/responses
    disabled.


    The pingsweep command that we created confirmed that the IP address of DC-7 machine
    was online with the IP address `10.0.2.27`, we will further probe the IP address
    by checking for open ports on the DC-7 machine by crafting a similar one-line
    shell command. To start off, we will scan only the first 1024 out of 65535 tcp
    ports available on the target host.


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Port scanning using a simple `for` loop

