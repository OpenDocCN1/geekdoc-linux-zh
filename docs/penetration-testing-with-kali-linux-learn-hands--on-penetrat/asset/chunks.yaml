    # Phase 3: Service enumeration and scanning


    This phase uses the information gathered in the previous phases to map out the
    various entry points into the services. The potential entry points are further
    scanned using various automated tools and manual techniques to identify the potential
    vulnerabilities associated with the target hosts.


    Repeat scanning using a different set of tools may be undertaken to ensure adequate
    scanning coverage and minimization of false positive or negative findings.


    # Phase 4: Vulnerability research


    The objective of this step is to understand and research upon the vulnerabilities
    identified on the target systems. This is a manual phase which involves searching
    offline and online vulnerability databases, security forums, security portals,
    code repositories, mailing lists, blogs, and so on. to identify the exploitability
    of the vulnerabilities identified.


    This phase like the previous one may require re-verification of the vulnerabilities
    to increase the accuracy of the exercise.


    # Phase 5: Exploitation


    This phase of the penetration test focuses solely on obtaining access on the target
    systems by leveraging the vulnerabilities identified in the previous stage.


    The vulnerabilities identified on the target are exploited using a combination
    of manual techniques and automated exploitation frameworks to gain access to sensitive
    data or obtain interactive shell access on the target system.


    # Phase 6: Reporting


    This phase involves correlation of all the data and evidence gathered during the
    previous stages and compiling the information into a meaningful document keeping
    various types of technical and non-technical audience in mind.


    The executive summary section is designed specifically to provide the non-technical
    audience a high-level view of the engagement along with the applicable non-technical
    measures which can be adopted to mitigate the vulnerabilities.


    The technical summary section is designed with technically savvy users in mind
    and showcases the actual vulnerabilities identified on the targets and their impacts,
    the vulnerabilities reported contain detailed technical recommendations and references
    to aid the technical staff in their effective mitigation.


    # Standard definitions


    For the purpose of this document, following standard definitions are to be considered:


    `Vulnerability`: A flaw or weakness in system security procedures, design, implementation
    which when exploited accidentally or intentionally allows the attacker to gain
    any form of unauthorized access to the system or sensitive data.


    `Threat`: A potential negative action or event that results in an unwanted impact
    to a computer system or application.


    `Risk`: The likelihood of occurrence of an adverse event and the potential impact
    of the event to the organization.


    # Severity rating


    `High`: Vulnerability that can directly indirectly lead to the target host being
    compromised. Some examples of such compromise are vulnerabilities that allow the
    following:


    - Disruption of services.

    - Unauthorized execution of code.

    - Unauthorized theft, modification or deletion of sensitive data.


    `Medium`: Vulnerability that can lead to compromise of the host, but not by itself.
    It is important to note that medium risk vulnerabilities can be combined with
    other Medium and low risk vulnerabilities to obtain leverage and compromise the
    host.


    Some examples of Medium risk vulnerabilities are:


    - Leakage of sensitive data such as internal IP addresses and hostnames.

    - Leakage of service configuration files or system data.

    - Provide information on security controls causing adverse impact to their effectiveness.


    `Low`: Vulnerability that provides excessive information about the host or its
    operating environment enabling an attacker / malicious user to further his/her
    access to the target system/s.


    Some examples of Low risk vulnerabilities are as follows:


    - Service banner leaking version information.

    - Default system services.

    - Insecure Protocols.


    # Executive summary


    Consultants from SecTest were engaged to conduct a Penetration Test on two systems
    identified by ClientCorp. This test was performed with the intention to assess
    the security posture of the systems in scope, and provide security assurance through
    proactive identification of security issues.


    The issues identified as a part of this exercise have been validated to remove
    any false findings, their security issues have been rated to reflect their severity.


    This report contains the strategic and tactical recommendations that ClientCorp
    can adopt to mitigate the issues identified herein.


    # Graphical overview


    The following chart denotes the number and severity of vulnerabilities found on
    the target systems during the engagement along with the risk distribution:


    ![](images/Figure-10.1.jpg)


    **Figure 10.1:** Findings


    # Vulnerability listing


    ![](images/p260.jpg)


    **Table 10.6:** List of findings


    The technical details of the vulnerabilities identified along with their respective
    screenshots can be found further in the technical summary section of this report
    document.


    # Summarized analysis


    SecTest determined that the overall security posture of the ClientCorp’s systems
    was `Poor`. Our testers identified multiple security issues affecting the target
    systems and exploited them to gain unauthorized access on the targets and further
    leverage them to achieve full administrative control on the targets.


    - Service banners instances were found leaking details regarding the type and
    versions of services running on the target systems. Such information may enable
    attackers to understand background workings of the target, find vulnerabilities
    and fine tune their attack methodology.

    - Developer comment in a web page source code leaked details regarding a hidden
    resource location. Such information may enable attackers to understand background
    workings of the target, find vulnerabilities and fine tune their attack methodology.

    - Insecure versions of applications application packages containing multiple known
    security issues were found on the target systems. The issues present allowed us
    to read sensitive system files and execute system commands leading to the eventual
    compromise of the `Kioptrix:5` target.

    - Lack of service hardening, an `FTP` service was found to allow logins from anonymous
    users. The server hosted a file containing developer comments which leaked sensitive
    information about server implementation.

    - Test API page was found to contain a vulnerability which allowed us to execute
    code on the server and obtain interactive shell access on the `Mumbai:1` target.

    - Security misconfigurations such as `sudo` permissions to execute `docker` (without
    password) and `docker` group membership allows the `apiuser` to obtain administrative
    privileges and take over the `Mumbai:1` target.


    # Strategic recommendations


    The following optional measures can be implemented to improve security posture
    across the organization:


    - It is highly recommended that hardening procedures be adopted and regularized
    to avoid leakage of service information.

    - Checks and measures should be adopted to ensure sanitization of code before
    moving it to the production environment.

    - Implement procedural controls to periodically monitor, identify and maintain
    system packages for security issues.

