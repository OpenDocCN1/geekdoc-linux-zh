    \n![](img/Figure-7.28.jpg)\n\n**图 7.28：** Apache 2.4 漏洞列表\n\n我们对 Apache 2.4 的搜索为我们提供了一份潜在的漏洞列表，我们可以看到两个与目标机安装的\
