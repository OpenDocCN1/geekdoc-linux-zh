    \nFor example, the full path of the first exploit shown in the table above is\n\
    \n**`/usr/share/exploitdb/exploits/linux/local/46676.php.`**\n\nOpen up a terminal\
    \ session, and type the following command to examine the exploits.\n\n**`cat /usr/share/exploitdb/exploits/linux/local/46676.php`**\n\
    \n![](images/Figure-8.5.jpg)\n\n**Figure 8.5:** 46676.php contents\n\nThe contents\
    \ of the Apache exploit **`46676.php`** indicates that it exploits a ‘privilege\
    \ escalation’ vulnerability with CVE identifier 2019-0211\\. The type of vulnerability\
    \ is useful to obtain elevated privileges on the target system. To use this exploit\
    \ the tester has to have a pre-existing access on the target system and it relies\
    \ on the tester to upload a php file on the target server in order to obtain elevated\
    \ privileges.\n\nThis exploit is not applicable in the current scenario as we\
    \ do not have initial shell access to the system, however it may come in handy\
    \ to obtain root access in the next chapter after we obtain an initial foothold.\n\
    \nRecommended is to read all the exploit codes one by one to understand more about\
    \ the vulnerability, applicability of the exploit and their usage.\n\n**Tip:**\
    \ Looking up the CVE identifier page on **[https://nvd.nist.gov/vuln/](https://nvd.nist.gov/vuln/)**search\
    \ page will help the reader understand the impact of the vulnerability and determine\
    \ applicability of the exploit better.\n\nLet us move to the next Apache exploit\
    \ given in the table above, reading the contents of **`/usr/share/exploitdb/exploits/linux/webapps/42745.py`**\
    \ tells us that the vulnerability has an identifier CVE-2017-9798.\n\nOpen up\
    \ the firefox web browser, go to **[https://nvd.nist.gov/vuln/search](https://nvd.nist.gov/vuln/search)**\
    \ page, type CVE-2017-9798 in the keywords field and click on **`Search`**.\n\n\
    ![](images/Figure-8.6.jpg)\n\n**Figure 8.6:** Vulnerability research with NIST\n\
    \nThe CVE page on the NVD website tells us that the vulnerability allows the attacker\
    \ to read sensitive data on the system but does not provide remote access to the\
    \ affected system. We can discard this exploit for the moment and focus on exploits\
    \ which will provide us with access to the target host.\n\nMoving on, reading\
    \ the contents of the Dropbear 0.34 exploit indicates that the procedure requires\
    \ the use a specific patched version of **`openssh-3.6p1`** on the Kali system\
    \ in order for the exploit to function properly. The exploit code also does not\
    \ mention any specific CVE identifier associated with the vulnerability, however\
    \ the code does give out the date 2004-08-09, indicating when it was published\
    \ on the last line, the date indicates that the vulnerability is more than 15\
    \ years old (at the time writing this chapter) and that the vulnerability might\
    \ not exist on the Debian 9 target which is comparatively recent.\n\nLet’s move\
    \ and view the code of the next exploit in the table which is: **`/usr/share/exploitdb/exploits/linux/remote/37262.rb`**\n\
    \n![](images/Figure-8.7.jpg)\n\n**Figure 8.7:** Viewing exploit 37262.rb source\
    \ code\n\nReading the code immediately tells us that the exploit is part of the\
    \ Metasploit framework and that the vulnerability allows remote command execution,\
    \ the identifier for the vulnerability is CVE-2015-3306.\n\nOpen up Metasploit\
    \ by typing the **`msfconsole`** command in the terminal window, you can then\
    \ use the search command followed by the keyword from the **`msf5>`** prompt.\n\
    \n![](images/Figure-8.8.jpg)\n\n**Figure 8.8:** Searching ProFTPD exploits within\
    \ Metasploit\n\nThe preceding screenshot shows the results for search proftpd\
    \ command, we can see the exploit for ProFTPd 1.3.5 located in **`exploit/unix/ftp/proftpd_modcopy_exec`**,\
    \ the exploit supports ‘check’ which allows the tester to check whether the target\
    \ is vulnerable without actually exploiting the vulnerability. Metasploit also\
    \ features a ranking system for its modules based on the reliability of the module\
    \ and the likelihood of causing service disruptions.\n\nLet’s load the exploit\
    \ modules in the framework by using the command **`use <search result #>`** or\
    \ **`use <module path>`**.\n\n![](images/Figure-8.9.jpg)\n\n**Figure 8.9:** Exploit\
    \ usage\n\nOnce the exploit has been loaded in the framework, take a look at the\
    \ exploit configuration by using the **`show options`** command.\n\n![](images/Figure-8.10.jpg)\n\
    \n**Figure 8.10:** Show options for exploit"
