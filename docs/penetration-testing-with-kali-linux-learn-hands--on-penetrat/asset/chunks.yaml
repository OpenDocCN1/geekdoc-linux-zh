    \ the target systems using the information gathered so far along with exploits\
    \ identified during the previous chapters.\n\n# [Structure](#toc.xhtml_s126a)\n\
    \nIn this chapter, we will touch upon the following topics:\n\n*   Creating web-shells\
    \ using php and using them to execute commands\n\n*   Upgrading webshells to fully\
    \ interactive reverse shells using netcat\n\n*   Using the Metasploit exploitation\
    \ framework\n\n*   Manual exploitation and reverse shell listeners\n\n# [Objectives](#toc.xhtml_s127a)\n\
    \nAfter reading this chapter, you will be able to:\n\n*   Understand the concepts\
