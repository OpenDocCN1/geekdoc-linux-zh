  trans: "\n让我们从对 `test.php` 页面上的查询参数进行模糊测试（fuzzing），以发现其可能存在的任何漏洞。\n\n**提示：** 你可以在\
    \ `/usr/share/wfuzz/wordlist/` 目录下找到 `wfuzz` 工具所使用的各种字典文件（wordlists）。请花时间探索这些提供的各种字典文件。\n\
    \n打开终端窗口并输入以下命令开始模糊测试：\n\n```bash\nwfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt\
    \ -d \"query=FUZZ\" http://10.0.2.6:8000/test.php\n```\n\n![](img/Figure-7.37.jpg)\n\
    \n**图 7.37：** 对 test.php 页面的查询参数进行模糊测试\n\n你可能会注意到服务器返回了大量的假阳报，服务器响应的共同属性如下：行数\
    \ = 1，单词数 = 4，字符数 = 26。我们将根据这些计数来过滤服务器响应，因为任何偏离已知模式的偏差都意味着攻击可能成功，且该响应值得进一步调查。\n\
    \n我们将重新运行命令，并添加额外的 `--hl/hw/hc` 标志来过滤服务器响应。\n\n为了示例说明，我们将使用 `--hw` 标志过滤服务器响应：\n\
    \n```bash\nwfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt -d \"\
    query=FUZZ\" --hw 4 http://10.0.2.6:8000/test.php\n```\n\n![](img/Figure-7.38.jpg)\n\
    \n**图 7.38：** 过滤假阳性结果\n\n看起来 `test.php` api 中的查询参数可能受到使用符号 `;`、`|` 和 `%0a`（“回车”键的\
    \ URL 编码表示）的命令注入攻击。\n\n我们将使用 `curl` 命令验证该漏洞，使用 `-X` 标志指定 HTTP 方法为 POST，并使用 `-d`\
    \ 标志指定要提交的数据：\n\n```bash\ncurl -X 10.0.2.6:8000/test.php -X POST -d “query=;id”\n\
    ```\n\n![](img/Figure-7.39.jpg)\n\n**图 7.39：** 使用命令注入漏洞执行 id 命令\n\n命令注入成功了，我们能够在目标机器上执行‘id’\
    \ 命令。服务器的响应显示该服务以 `apiuser` 权限运行。\n\n记录下目前为止观察结果，我们将在下一章中继续研究这台机器。\n\n**观察笔记：**\n\
    \n* **IP 地址：** 10.0.2.6\n* **操作系统：** Ubuntu Linux\n* **开放端口与服务：**\n    * 21/tcp\
    \ ftp\n        * `vsftpd` 3.0.3\n        * 允许匿名 FTP，名为 Note 的文件揭示了安全问题\n    *\
    \ 22/tcp ssh\n        * `OpenSSH` 7.6p1 Ubuntu\n    * 80/tcp http\n        * `Apache\
    \ httpd` 2.4.29\n        * 发现利用利用\n            * `Apache 2.4.17 < 2.4.38 - 'apache2ctl\
    \ g | exploits/linux/local/46676.php`\n            * `Apache < 2.2.34 / < 2.4.27\
    \ - OPTIONS M | exploits/linux/webapps/42745.py`\n        * WordPress 5.2.3\n\
    \        * XMLRPC 已启用，可能导致安全问题\n        * 发现用户 absozed\n    * 3306/tcp mysql\n\
    \    * 8000/tcp http\n        * `nginx` 1.14.0\n        * 发现 `.bash*` 文件，表明 Web\
    \ 根目录可能存在问题\n"
- fmt: "\nNetcat is also known as the swiss army knife of penetration testing tools,\
    \ it offers a ton of extremely useful features to the testers some of which we\
    \ will be progressively exploring as we go on exploiting various targets covered\
    \ in this book. In the example above we have set up a simple listener using the\
    \ `-l` flag, the `-v` flag sets netcat in verbose mode which may help in troubleshooting\
    \ connection related issues and finally the `-p` flag is used to set the port.\
    \ As the above example uses the `-p` port flag in `-l` listener mode the `netcat`\
    \ command will listen for incoming connections on port 9876.\n\nOnce the listener\
    \ has been successfully set up go back on the Drupal page and click on the `preview`\
    \ button to execute our malicious PHP code on our DC7 target.\n\n![](images/Figure-8.4.jpg)\n\
    \n**Figure 8.4:** Reverse shell connection in action\n\nGreat! The PHP code ran\
    \ perfectly on the target and you should now have a working shell access on the\
    \ DC7 system with privileges of user `www-data`.\n\nThe initial exploitation of\
    \ DC7 target is now complete and we have shell access to the `www-data` user,\
    \ in the next chapter you will learn to exploit the backup script running as cron-job\
    \ to obtain root access.\n\nTake notes on the observations made so far, and we\
    \ will continue with this machine in the next chapter.\n\n**Observation Notes:**\n\
    \n**IP address:** 10.0.2.27\n\n**Operating System:** Linux (Debian 10 based)\n\
    \n**Open Ports & Services:**\n\n*   22/tcp - SSH\n    *   OpenSSH 7.4p1 (gathered\
    \ from service banner)\n    *   SSH allows login for `dc7user` using the credentials\
    \ found on GitHub page.\n    *   Bash script `/opt/scripts/backup.sh` used to\
    \ backup website and sql database.\n    *   Cron is being used to run the `backup.sh`\
    \ script periodically.\n    *   `backup.sh` script can be modified by the root\
    \ user or users belonging to the `www-data` group.\n    *   Drush is being used\
    \ to administer Drupal\n*   80/tcp - HTTP\n    *   Apache 2.4.25 (gathered from\
    \ service banner)\n        *   Found `robots.txt`\n        *   Drupal 8 (gathered\
    \ from page source)\n        *   Admin password changed to `admin123`\n      \
    \  *   PHP Filter module was uploaded and enabled to allow custom PHP code execution.\n\
    \        *   PHP reverse shell was uploaded to the server.\n            ![](images/ent.jpg)\
    \ Reverse connection established with privileges of `www-data` user.\n    *  \
    \ Internet handle `@DC7user` on the main page\n        *   Google search of the\
    \ handle revealed Twitter and Github accounts.\n        *   Found source-code\
    \ and credentials `dc7user` and `MdR3xOgB7#dW`\n\n# Digitalworld.local\n\nWe had\
    \ left off the research phase after identifying potential exploits for ProFTPD,\
    \ Dropbear and Apache services, during this section of the chapter we will be\
    \ using the identified exploits to obtain initial shell access on the Joy target\
    \ machine.\n\nThe exploits identified in the previous phase are given in the table\
    \ as follows:\n\n*   `Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    *   `Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n\
    *   `Dropbear SSH 0.34 - Remote Code Execut | exploits/linux/remote/387.c`\n*\
    \   `ProFTPd 1.3.5 - 'mod_copy' Command Exe | exploits/linux/remote/37262.rb`\n\
    *   `ProFTPd 1.3.5 - 'mod_copy' Remote Comm | exploits/linux/remote/36803.py`\n\
    *   `ProFTPd 1.3.5 - File Copy | exploits/linux/remote/36742.txt`\n\nThe exploits\
    \ identified by the `searchsploit` tool are located in the `/usr/share/exploitdb/`\
    \ folder, you will need to type in the full path in order to access the exploits.\n\
    \nFor example, the full path of the first exploit shown in the table above is\
    \ `/usr/share/exploitdb/exploits/linux/local/46676.php`.\n\nOpen up a terminal\
    \ session, and type the following command to examine the exploits.\n\n```\ncat\
    \ /usr/share/exploitdb/exploits/linux/local/46676.php\n```\n\n![](images/Figure-8.5.jpg)\n\
    \n**Figure 8.5:** 46676.php contents\n\nThe contents of the Apache exploit `46676.php`\
    \ indicates that it exploits a ‘privilege escalation’ vulnerability with CVE identifier\
    \ 2019-0211. The type of vulnerability is useful to obtain elevated privileges\
    \ on the target system. To use this exploit the tester has to have a pre-existing\
    \ access on the target system and it relies on the tester to upload a php file\
    \ on the target server in order to obtain elevated privileges.\n\nThis exploit\
    \ is not applicable in the current scenario as we do not have initial shell access\
    \ to the system, however it may come in handy in the next chapter.\n"
