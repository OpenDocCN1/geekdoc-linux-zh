    On Kali Linux system, open a terminal window from the dock, we will use a different
    technique to identify the IP address assigned to our target machine, we will do
    so by utilizing address resolution protocol a.k.a ARP, `arp-scan` tool sends out
    ARP packets through the network interface specified to identify all active IP
    addresses.


    **Note:** Address Resolution Protocol is non-routable so scans utilizing this
    protocol can only be used to identify hosts which are present on networks which
    are directly connected to the Kali host.


    **Tip:** As ARP is a layer 2 protocol, ARP scan can identify active targets even
    if the target blocks ICMP echo requests.


    ![](images/Figure-5.17.jpg)


    **Figure 5.17:** Network sweeping using `arp-scan`


    The Kioptrix5 target is up and using the IP address `10.0.2.104`.


    In the next step we will run an `Nmap` with a `-sS` and `-A` flags. The `-sS`
    stands for a SYN scan also known as the ‘half-open*’ scan. This flag instructs
    `Nmap` to send a TCP SYN packet and attempt to open a connection to a port on
    the target. The target port should reply with SYN/ACK packet if it is open, however
    instead of sending an ACK packet to build the TCP connection with the port `Nmap`
    sends a TCP RST packet to tear down the connection. This type of scanning usually
    provides speed improvement over a TCP connect scan (`-sT`) as the TCP connection
    is torn down instead of being established.


    The `-A` (Aggressive) option offers an easier to remember combination of multiple
    `nmap` techniques under a single flag, The `-A` flag includes operating system
    detection (`-O`), version scanning (`-sV`), script scanning (`-sC`) and traceroute
    (`--traceroute`) functionalities.


    ![](images/Figure-5.18.jpg)


    **Figure 5.18:** nmap half-open scan


    We can observe that the target is a FreeBSD machine that has 2 TCP open ports.
    Port 80 and 8080 are both running an Apache 2.2.21 HTTP service.


    Take notes on the observations made so far, and we will continue with this machine
    in the next chapter.


    **Observation Notes:**


    **IP address:** 10.0.2.104


    **Operating System:** FreeBSD


    **Open Ports & Services:**


    80/tcp http


    Apache httpd 2.2.21


    mod_ssl/2.2.21


    OpenSSL/0.9.8q


    DAV/2 PHP/5.3.8


    8080/tcp http


    Apache httpd 2.2.21


    mod_ssl/2.2.21


    OpenSSL/0.9.8q


    DAV/2 PHP/5.3.8)


