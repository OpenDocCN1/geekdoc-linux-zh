    接下来，下一章将重点关注 Kali Linux 中提供的各种扫描和枚举工具，并进行实操练习以发现目标系统中的安全问题。


    # 问题


    1. 使用哪些协议来确定 IP 网络上的存活主机？

    2. 哪种 `nmap` 扫描类型被称为半开放扫描（half-open scan）？

    3. `nmap` 中的激进模式（aggressive mode）是什么？为什么要使用它？


    # 第 6 章


    ## 服务枚举与扫描


    上一章分为两个主要部分。上一章的前半涵盖了规划成功的渗透测试所需的各种前接活动。该章的后半部分涵盖了侦察理论，并演示了如何使用 Kali Linux 上的工具来获取有关目标系统的有价值信息。


    本章将解释如何利用在上章中获取的目标知识，对我们之前识别出的服务进行进一步的扫描和枚举。


    ## 结构


    在本章中，我们将涉及以下主题：


    * 各种服务的枚举

    * 扫描服务以识别潜在的漏洞和切入点


    ## 目标


    阅读本章后，你将能够：


    * 理解枚举和服务扫描的理论。

    * 使用 Kali Linux 中提供的工具执行枚举和服务扫描。


    ## DC-7


    我们之前已经识别出目标端口 `80` 运行运行着一个基于 Drupal 网站的 Apache Web 服务器，接下来我们将进一步枚举该服务，以找到其上存在的任何重要文件或目录。


    让我们打开终端，使用命令 `dirb http://10.0.2.27` 对网站进行基于字典的 Web 内容扫描。


    ![](img/Figure-6.1.jpg)


    **图 6.1：`dirb` 扫描


    你会注意到，不带任何开关的默认扫描需要花费大量时间，且大部分扫描输出都是 403 访问错误页面，如上方截图中的扫描结果所示。


    你可以通过运行此命令来优化扫描的耗时和输出：


    `dirb http://10.0.2.27 -r -N 403`


    ![](img/Figure-6.2.jpg)


    **图 6.2：`dirb` 调优


    `-r` 开关阻止 `dirb` 工具递归检查已识别目录中的任何相同文件。DC-7 目标对许多目录返回了大量的 403 消息，而 `-N` 选项用于指示 `dirb`
    工具忽略或过滤掉不需要的响应，并尽可能减少扫描结果中出现的虚假条目。


    注意目标系统上存在 `robots.txt` 文件；该文件被网站管理员用于阻止搜索引擎索引敏感文件和目录。


    现在，从程序坞中打开 Firefox 浏览器并访问：


    `http://10.0.2.27/robots.txt`


    ![](img/Figure-6.3.jpg)


    **图 6.3：DC-7 上的 `robots.txt`**


    在上一个截图中，我们可以看到 `robots.txt` 列出了了一些不打算索引的目录。这些目录对于渗透测试人员可能非常感兴趣，因为它们可能包含敏感信息或管理界面。

