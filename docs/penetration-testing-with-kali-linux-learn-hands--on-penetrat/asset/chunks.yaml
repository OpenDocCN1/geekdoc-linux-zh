    ## Phase 1: Scoping and planning


    The objective of this survey is to identify the target systems, estimated time
    frame and the work-effort required to complete.


    The following is established during the Scoping and Planning phase:


    1. List of systems in scope of testing.

    2. Testing timeline.

    3. Testing window.

    4. Testing constraints or limitations.

    5. List of key personnel and stakeholders.

    6. Escalation matrix.

    7. Identify Firewalls/IDS/IPS/APT systems which have the potential to interfere
    with the scanning.

    8. Communication about the penetration testing window to the relevant IT, Admin
    and Security staff, to monitor the scans and remain vigilant during the testing
    window.

    9. Compliance requirements arising out of company policy or standards such as
    ISO/IEC 27000, PCI-DSS, and so on.


    **Note:** No scanning is performed on the target systems in this phase. This phase
    sets the stage for the entire exercise by setting up the project plan, deliverables,
    timelines, project coordinators and the team.


    ## Phase 2: Information gathering and reconnaissance


    During this phase of testing, information about the target hosts is gathered to
    identify the nature / behavior of the target hosts such as web, mail, file, print
    server, network devices such as routers, firewalls, switches, intrusion detection
    / prevention systems and so on.


    The systems are initially scanned for open ports and the services running behind
    the open ports are identified to help in building a complete picture of the open
    ports and corresponding services running on the target systems.

