    # 使用 Kali Linux 进行渗透测试


    ![](img/line.jpg)


    ## 学习实践渗透测试：使用流程驱动的框架


    ![](img/line.jpg)


    ### Pranav Joshi

    ### Deepayan Chanda


    ![](img/logo.jpg)


    [www.bpbonline.com](http://www.bpbonline.com)


    **2021 年第一版**


    **版权 © BPB Publications, India**


    **ISBN: 978-93-90684-793**


    所有权利保留。未经出版者事先书面许可，不得以任何形式或通过任何手段对本书的任何部分进行复制、分发、传输或存储在数据库或检索系统中，但在计算机系统中输入、存储和执行的程序列表除外，这些程序不能通过出版、复印、录制或任何电子和机械手段进行复制。


    ### 责任限制与免责声明


    本书包含的信息力求准确正确，并代表了作者和出版者所知的最佳水平。作者已尽一切努力确保这些出版物的准确性，但出版者对因书中任何信息引起的任何损失或损害不承担责任。


    书中提到的所有商标均承认其各自所有者的财产，但 BPB Publications 无法保证这些信息的准确性。


    ![](img/logo1.jpg)


    [www.bpbonline.com](http://www.bpbonline.com/)


    # 前言


    **Diana Kelley:** 每个业务主都应该知道这些关键问题的答案：“我的在线和移动应用程序安全吗？”“我的公司数据面临风险吗？”“我的客户能安全地购买我的服务吗？”


    如果他们知道答案，那么我们必须感谢渗透（或 Pen）测试员的辛苦工作。


    渗透测试的概念听起来相当奇特或“酷”，特别是对于那些从未执行过它的人来说。在实践中，渗透测试可能是一项令人混乱且充满挑战的活动。测试通常在凌晨进行，如果你没有发现任何异常，并不意味着“工作完成”。相反，它建议你进行更深入的观察并尝试额外的工具，以确保你涵盖了应用程序的所有区域并尽可能进行了深度挖掘！此外，还有永恒的问题：“我们如何知道自己已经检查了所有地方？”以及“我们如何知道应用已经得到了充分测试？”


    因此，你即将阅读的书是一项重要的资源。本书由 Deepayan Chanda 和 Pranav Joshi 编写，他们是资深的网络安全专业人士，完成了数百次渗透测试，领导过大型内部测试团队，并从失败中学了许多教训。Deep
    和 Pranav 受他们许多经历的启发写了这本书，作为你们渗透测试过程的倡导者和指南。基于多年的实战经验和通过试错来确定有效无效的方法，他们建立了一个使用
    `Kali Linux` 作为平台的实用框架方法。


    如果你是渗透测试的新手，这本书就是你入门所需的所有。如果你已经进行渗透测试了一段时间，这个框架和经验智慧将为你改进流程的方法提供灵感，并帮助发现新方法。


    正如 Deepayan 经常说的：“渗透测试总是反映真相；它是我们用来验证在设计和实施中的所有努力工作是否产生了一个稳健且安全的系统的衡量标准。”这就是你挖掘这一真相的分步指南。


    **Burgess Sam Cooper:** 今天，渗透测试比以往任何时候都更有意义。威胁格局演变得更快，攻击者也变得越来越年轻。信息安全作为一个领域也在趋于成熟。此外，攻击目标不再需要技术诀窍，攻击可以在暗网上作为服务购买。


    这导致了这样一种局面：确定你的基础设施和应用程序是否安全的唯一方法是在攻击者之前对它们进行测试。


    测试有时被比作艺术，它确实如此。然而，如果遵循某种流程，就可以获得一致的结果。Deepayan 和 Pranav 在书中指定了这一流程。本书的核心优势在于它从零开始。如果你能从互联网下载一个文件，你就可以开始遵循书中的步骤了。


    `Kali Linux` 作为一个平台是面向测试的。其关键优势是测试人员不需要花时间安装基础工具。`Kali` 有一个开箱即用的环境，让测试人员快速开始。


    书中的另一个重点是强调在做中学习。这本书带你你从设置环境到在进行测试后创建报告。清晰的报告有助于接收者理解测试发现的含义以及如何对它们进行优先级排序，并引导测试人员、应用程序团队、开发者和基础设施维护人员之间进行建设性的对话。


    所以，拿起你的虚拟机，让 Deepayan 和 Pranav 带领你开启一段发现之旅吧！


    **Ajay Kumar:** 在今天这个数字连接的世界里，组织面临着风险。我们生活中网络安全威胁的规模和普遍性正在定期增加。虽然媒体上的事件很大程度上引起了大家的关注，但信息安全从业者和防御者往往没有或足够的工具、技能集和经验来理解这些复杂的新攻击的严重性。显而易见，每当团队在实际比赛之前演练时，他们在面对对手的真实比赛中就能自信从容地发挥。它判断了你在真实测试之前的准备情况。这种情况在网络安全领域也产生了共鸣，因为信息安全团队需要在真实攻击发生之前测试他们的防御并暴露差距和漏洞。这些模拟练习不仅有助于信息安全团队在不利情况下做好准备，还能帮助业务团队做出明智决策，以填补网络安全态的漏洞。


    在书中，作者 Deepayan Chanda 和 Pranav Joshi 详细解释了渗透测试作为安全专业人员执行的关键模拟实践之一的相关性。本书用通俗易懂的语言解释了使用
    `Kali Linux` 进行渗透测试的基础知识以及方法论、实践练习、示例报告和建议。`Kali Linux` 是帮助信息安全团队对抗者的众多工具之一。


    无论你是学生还是网络安全专业人士，这本书都将给你渗透测试的基本概念，这些概念通常用于基于模拟的红蓝演习。编写这种写作需要真正的勇气和奉献，它以极其简单的方式解释了渗透测试的端到端过程和各个阶段。


    我希望这本书能激发你深入学习的理解和兴趣，并与更大的网络安全社区分享你的知识。


    祝你迈出这一步，与他人分享你的见解和经验。


    # 献给


    *所有的网络战士*


    *那些为了让互联网变得更安全*


    *而做出点努力的个人*


    # 关于作者'
- fmt: '

    `Pranav Joshi` has over 20 years of Information and Cybersecurity experience in
    leading and delivering large scale projects for clients across diverse business
    verticals such as banking, finance, national stock exchanges, insurance, energy,
    petrochemical, retail, media, advertising, e-commerce, IT/ITES, government and
    defense including fortune 100 companies. In his previous role, he was responsible
    for managing security of information assets, infrastructure and applications covering
    65 countries and significantly reducing compliance related incidents. Pranav is
    credited for the discovery of several disclosed and undisclosed security vulnerabilities
    in many popular enterprise products, which have been published by leading cybersecurity
    corporates, professional bodies and governmental agencies such as `IBM Xforce`,
    `SecurityFocus`, `ExploitDB`, `National Vulnerability Database-US Department of
    Commerce`, `CyberSecurity and Infrastructure Security Agency-US Department of
    Homeland Security`.


    `Deepayan Chanda`, a seasoned cyber security professional, architect, cybersecurity
    strategist and advisor has a strong intent to solve cyber security problems for
    enterprises. Driven by more than 24 years of diverse security domain experience,
    he has successfully managed to create a balance between security and business
    goals. An ex-Armed Forces (Indian Air Force) personnel, he is currently working
    for National Australia Bank. He has also worked for Standard Chartered Bank and
    many major product and security MNCs, demonstrating strong leadership in driving
    security projects and solutions. He has made significant contributions to the
    industry as a mentor and advisor to many cyber security start-ups and has authored
    books.


    # About the Reviewers


    `Ajay Kumar` is the Regional Head of Cyber Security Services, Asia with Crowdstrike
    based out of Singapore. Previously, he worked with `Entrust Datacard` as a Regional
    Managing Director-Asia Pacific and Marketing Director-Asia Pacific. Ajay has received
    “National Leaders in Marketing” award from CMO Asia Council and “Most Influential
    Technology Marketing Leaders” award from World Marketing Congress in 2016.


    He had worked with several fintech, banking and ITES organizations before starting
    his journey as an entrepreneur.


    He is the Singapore Chapter Anchor for Data Security Council of India (`DSCI`),
    a not-for-profit industry body on cyber security and data protection setup by
    `NASSCOM®` which is committed to making the cyberspace safe, secure and trusted
    by establishing best practices, standards and initiatives in cyber security and
    privacy.


    Ajay is a subject expert in payments, cyber security, enterprise technology and
    data privacy and has more than 21 years of professional experience.


    He has a Post Graduate Degree in Business Management in Marketing from Institute
    of Management Studies, Ghaziabad and has pursued Executive Program from Indian
    Institute of Management Ahmedabad. He is certified in Fintech Program from Said
    Business School, Oxford and AI in Finance from `CFTE`, London.


    `Phoram Mehta` is the CISO for `PayPal`''s Asia-Pacific region. A seasoned professional
    and technical leader with over two decades of rich experience in Information Security,
    Phoram has been instrumental in building secure technology solutions for multiple
    companies across a spectrum of sectors including financial services, healthcare,
    telecommunications and government in North America and Asia-Pacific regions.


    Phoram also oversees `PayPal`''s Global Tech Risk Management Program and Infosec
    Research and Outreach initiatives. He currently serves as the President of `ISACA
    Singapore` and advises cybersecurity startups in Singapore, India and the USA.


    ### `Burgess Sam Cooper,` Deputy Cybersecurity Leader and Partner - Consulting
    Services, EMEIA Region, EY


    Burgess Cooper is a Partner and Head of the Cyber Security Market with a team
    of 600+ professionals. He has over 23 years of rich work experience in securing
    some of the biggest brands in the world from potential cyber-attacks.


    Earlier to EY, he was a CISO with `Vodafone` and `HSBC` and was responsible for
    Information Security, Privacy and Compliance across the Telecom and BFSI sectors.


    He is a regular speaker and a jury member at prominent industry events such as
    `BCCI`, `ASSOCHAM`, `CII`, `CISO and E-crime` and a qualified EC-Council’s CEI
    Master Trainer for Industry CISO certification courses..


    ### `Diana Kelley’s` security career spans over 30 years. She is the Co-founder
    and CTO of `SecurityCurve`. She dedicates much of her time towards volunteering
    work in the cybersecurity community, including serving the `ACM` Ethics and Plagiarism
    Committee, as a CTO and Executive Board member at `Sightline Security`, Executive
    Board member and Inclusion Working Group champion at `WiCyS`, Executive Advisory
    Board member at `Cyber Future Foundation`, Cybersecurity Committee Advisor at
    `CompTIA`, Advisory Council, `Bartlett College of Science and Mathematics`, `Bridgewater
    State University` and `RSAC US Program Committee`. Diana is the producer of ‘#MyCyberWhy’
    series, host of `BrightTALK`’s ‘The (Security) Balancing Act’ and co-host of ‘Your
    Everyday Cyber’ podcast. She is also a Principal Consulting Analyst at `TechVision
    Research` and a member of `The Analyst Syndicate`. Previously, she functioned
    in various roles such as the Cybersecurity Field CTO for `Microsoft`, Global Executive
    Security Advisor at `IBM Security`, GM at `Symantec`, VP at `Burton Group` (now
    `Gartner`) and Manager at `KPMG`. She is a sought-after keynote speaker and co-author
    of the books ‘Practical Cybersecurity Architecture’ and ‘Cryptographic Libraries
    for Developers’. She was a lecturer at Boston College''s Master’s program in cybersecurity
    and was conferred the `EWF 2020 Executive of the Year and one of Cybersecurity
    Ventures 100 Fascinating Females Fighting Cybercrime.


    # Acknowledgements


    There are a few people I want to thank for the continued and ongoing support they
