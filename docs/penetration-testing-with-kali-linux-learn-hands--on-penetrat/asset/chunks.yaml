    ## Recommendation

    It is recommended that input validation be performed to check and scrub malicious
    characters on all user supplied input.


    ## References

    **[https://owasp.org/www-community/attacks/Command_Injection](https://owasp.org/www-community/attacks/Command_Injection)**


    ![](images/p270a.jpg)


    ## Observation

    The following security misconfigurations were seen on the Mumbai:1 target:


    1. The `apiuser` account has been granted membership of `docker` group.

    2. The `apiuser` is configured to execute `docker` as root via the `sudo` command.


    ## Impact

    The issues highlighted are of serious nature and can be exploited by the `apiuser`
    to obtain administrative privileges and take over the target system.


    ## Exploitation Evidences

    ![](images/Figure-10.19.jpg)


    **Figure 10.19**

    We exploited the `docker` group membership issue to create a new interactive `docker`
    container and mounted the root `/` directory to the `/tmp/mumbai` directory within
    the docker container.


    Creating a new `docker` container granted us ‘root’ privileges over all the filesystems
    attached to the container including the parent filesystem mounted in `/tmp/mumbai`
    directory.


    ![](images/Figure-10.20.jpg)


    **Figure 10.20**

    Ye obtained root privileges over the Mumbai:1 target filesystem by changing the
    root `/` directory back to `/tmp/mumbai` using the `chroot` command.


    ## Recommendation

    It is recommended to revoke `sudo` and `docker` group membership for `apiuser`
    account. As a general rule it is advisable to avoid granting excessive permissions
    to system users.


    ## References

    **[https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration](https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration)**


