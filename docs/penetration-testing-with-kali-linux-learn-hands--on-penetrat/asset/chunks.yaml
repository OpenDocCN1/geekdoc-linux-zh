  trans: "\n为了本书的目的，目标机器将从 VulnHub 下载，它是一个漏洞目标机器的开放仓库。其网站 `[www.vulnhub.com](http://www.vulnhub.com)`\
    \ 是一个可搜索的仓库，包含数百个精心制作的漏洞机器，并根据从初学者到专家的不同经验级别进行分类。\n\n在本章中，我们将学习将 VulnHub 上提供的几个目标机器安装到我们的虚拟实验室环境中。\n\
    \n![](img/Figure-2.1.jpg)\n\n**图 2.1:** `[www.vulnhub.com](http://www.vulnhub.com)`\
    \ 网站\n\n下表展示了书中涵盖的目标虚拟机：\n\n| **机器名称** | **VulnHub 页面** |\n| :--- | :--- |\n|\
    \ **DC:** 7 | **[`www.vulnhub.com/entry/dc-7,356/`](https://www.vulnhub.com/entry/dc-7,356/)**\
    \ |\n| **Kioptrix:** 2014 (#5) | **[`www.vulnhub.com/entry/kioptrix-2014-5,62/`](https://www.vulnhub.com/entry/kioptrix-2014-5,62/)**\
    \ |\n| **Digitalworld.local:** Joy | **[`www.vulnhub.com/entry/digitalworldlocal-joy,298/`](https://www.vulnhub.com/entry/digitalworldlocal-joy,298/)**\
    \ |\n| **HackInOS:** 1 | **[`www.vulnhub.com/entry/hackinos-1,295/`](https://www.vulnhub.com/entry/hackinos-1,295/)**\
    \ |\n| **Sunset:** Nightfall | **[`www.vulnhub.com/entry/sunset-nightfall,355/`](https://www.vulnhub.com/entry/sunset-nightfall,355/)**\
    \ |\n| **Mumbai:** 1 | **[`www.vulnhub.com/entry/mumbai-1,372/`](https://www.vulnhub.com/entry/mumbai-1,372/)**\
    \ |\n\n**表 2.1:** 目标机器\n\n**提示：** 目标系统通常占用几个 GB，一次性下载并安装所有镜像将减少计算机可用空间。因此，为了优化磁盘空间利用率，我们建议在开始测试之前下载并安装单个目标机器，并在完成后删除它们。\n\
    \n# 设置目标机器\n\n每台目标机器的下载链接可以通过访问 `表 2.1` 中提供的链接并浏览到页面的下载部分找到。\n\n![](img/Figure-2.2.jpg)\n\
    \n**图 2.2:** DC7 目标虚拟机设置\n\nVulnHub 网站上的虚拟机可能是压缩过的，如果是这种情况，你可能需要使用 `7-zip` 或任何你喜欢的其他工具解压相关的\
    \ zip/rar/bz2 文件。\n\n`7-zip` 是一款免费软件，可以从网站 `https://www.7-zip.org/download.html`\
    \ 下载。\n\n# 导入虚拟机目标\n\n一旦下载并解压了相关的虚拟机，就可以开始导入过程。在 VirtualBox 应用程序中点击 `file`>`import`\
    \ 或按 `Ctrl-I` 打开导入窗口，浏览到相关文件夹并点击 `.ova` 文件。这样做将填充 `.ova` 文件中的所有配置设置并将其显示在设备设置（Appliance\
    \ settings）中。然后你可以点击窗口底部的导入按钮开始导入过程。\n\n![](img/Figure-2.3.jpg)\n\n**图 2.3:**\
    \ DC 7 设置\n\n导入过程完成后，你应该能够在左侧窗格中看到新导入的机器。\n\n![](img/Figure-2.4.jpg)\n\n**图 2.4:**\
    \ DC 7 虚拟机\n\n# 导入 Kioptrix: 2014 (#5) 的特殊说明\n\nKioptrix:2014 机器设计为在 VMware 上运行，因此我们需要一些额外工作才能使其在\
    \ VirtualBox 上运行。\n\n从 VulnHub 站点下载并解压 `kiop2014.tar.bz2` 虚拟机和 `kiop2014_fix.zip`\
    \ 到文件夹中，双击 `kioptrix2014.vbox`（虚拟机定义）文件将设置导入到 VirtualBox。\n\n![](img/Figure-2.5.jpg)\n\
    \n**图 2.5:** Kioptrix 导入设置\n\n此虚拟机的机的虚拟硬盘映射错误，在使用目标机器之前需要对其进行修正，可以通过点击 IDE 主驱动器并在下拉菜单中选择\
    \ `choose a disk`（选择磁盘）选项来打开文件浏览器。浏览到并打开 `kioptrix2014.vmdk` 文件以修复问题。\n\n我们现在将配置此机器使用我们预配置的\
    \ NAT 网络，而不是开发者可能配置的任何其他内容。可以通过右键点击虚拟机名称并选择设置，或者选择虚拟机名称然后点击菜单中的设置按钮来打开虚拟机设置。一旦打开设置面板，点击左侧窗格中的\
    \ `Network`（网络）部分，并将 `attached to`（连接到）值更改为 NAT Network，在下拉列表中选择我们在 `第 1 章：渗透测试基础`\
    \ 中创建的网络名称。点击 `OK` 确认新设置。\n\n![](img/Figure-2.7.jpg)\n\n**图 2.7:** DC 7 网络设置\n\
    \n我们的目标机器现在已配置好并准备好测试。你可以使用上述相同的过程来下载和导入书中列出的其他目标机器。\n\n# 实践测试涵盖的概念\n\n在本书过程中，通过使用目标机器的不同组合，将以逐步的方式解释许多用例，以便实现最大程度的学习。\n\
    \n*   主机发现扫描\n*   端口扫描\n*   操作系统指纹识别\n*   服务识别和版本检测\n*   命令链\n*   使用 `bash` 脚本进行自动化\n\
    *   服务枚举\n    *   HTTP\n    *   SNMP\n    *   FTP\n    *   SMB\n    *   SQL\n\
    *   从页面源代码收集价值信息\n*   模糊测试 (Fuzzing)\n*   本地文件包含\n*   目录遍历\n*   OS 命令注入\n*   通过操控用户代理绕过\
    \ Web 访问过滤\n*   远程代码执行\n*   绕过文件上传限制\n*   枚举并攻击 WordPress\n*   暴力破解在线登录表单\n* \
    \  有效载荷编码\n*   漏洞研究\n    *   搜索引擎\n    *   漏洞利用网站\n    *   `searchsploit`\n  \
    \  *   `Metploit`\n    *   获取反向 shell\n    *   使用 `netcat` 获取反向 shell 并传输文件\n\
    *   使用 `fifo` 和输入输出重定向处理固化的 `netcat` 反向 shell\n*   修复受限的反向 shell 问题并升级到 TTY shell\n\
    *   本地系统枚举\n*   SUID 二进制文件\n*   使用 `sudo` 以超级用户身份运行命令\n*   内核利用\n*   滥用未身份的 TFTP\
    \ 服务\n*   使用 `Metploit` 进行利用\n*   使用 `PHP` 后门获取反向 shell\n*   密码破解\n*   对输入参数进行模糊测试以漏洞\n\
    *   权限提升和获取 root\n\n我们将使用 Kali Linux 中提供的各种工具来测试上述用例，通过这种方式，读者将逐渐掌握渗透测试所需的各种实践知识。\n\
    \n# 总结\n\n舞台已经准备好可以用于测试，在下一章中，我们将介绍如何操作 Kali Linux 虚拟机的一些方面，并熟悉一些重要的命令和常用工具。\n\
    \n# 问题\n\n1.  我们使用什么快捷键将设备导入到 VirtualBox？\n2.  描述用于我们的 kali 和目标系统之间建立网络的网络适配器？\n"
