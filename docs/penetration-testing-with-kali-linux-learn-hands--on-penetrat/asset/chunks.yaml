    It is a common practice for security teams and professionals to follow a risk
    averse approach for any activities, implementations, or testing they do and Penetration
    testing is no exception to this. As a penetration tester, you must assess the
    probable risks associated with your target or targets, these risks may be associated
    with the organization, its business, IT assets, people, processes they have. While
    trying to assess the risks, you must try to find areas that could pose serious
    threat if exploited.


    Determine the most common attack methods that could be used to target the systems.
    These could include organization’s sensitive data, source codes, financial records,
    personnel data, and so on., focus on the aspects that you believe the adversaries
    could target and could be more valuable to them. Also, at the same time focusing
    only on super critical items is a big mistake, as you may leave out other areas
    or assets that may contain low hanging vulnerabilities which can be used to obtain
    initial foothold and leveraged to pivot from there.


    ### Keeping yourself updated


    It is needless to say that performing penetration testing is highly challenging
    especially when it comes along with time constraints, this is why it is important
    to have your act together and maintain focus during the engagements. The best
    way to maintain speed is to fully ingrain the process by practicing various commonly
    used tools and technique used to perform the job, which will not only improve
    the test speed but also help produce accurate and precise results. As a penetration
    tester you must be aware of the latest tools and techniques used in the industry.
    Think like an attacker, anticipate and follow the techniques which probably the
    attackers would follow. There are abundant tools available in form of commercial,
    opensource and freeware, choose your tools wisely.


    Plan the tools based on the techniques you are going to use to execute and the
    type of assets, depth of testing you would like to perform. Utilize automation
    to speed up large volume tasks during a penetration testing tools, this will not
    only increase speed of the scanning but also help with consistency over multiple
    scans that you would perform.


    ### Importance of report writing


    There is a saying which I learnt from one of my previous job, “Nothing is complete,
    unless the documentation is complete”. The importance of report writing and accurately
    capturing everything in it is always paramount. As a penetration tester it is
    your responsibility to highlight everything in your final report, un-filtered,
    write what you found, follow a set format (we have shared one such format in this
    chapter later as an example). Pay attention to details, make sure you have created
    distinct sections in the report for various stakeholder. For example, Executive
    summary section is for the decision makers to look at as a snapshot showing the
    high-level findings and a brief summary, more detailed and technical section for
    the operations and asset stakeholder to read, so that they can carry out remediation.
    Remove any false positives in your findings and only keep things that make sense.
    Don’t just fill out erroneous and meaningless data to make the report bloated
    to make it look bigger. Requirement is to show the true findings and not a bigger
    report. Be accurate, descriptive, and provide recommendations to fix for the flaws
    and issues you found.


    ### Remediate discovered findings


    The goal of penetration testing is to find and eventually remediate security weaknesses
    in the target environment, the importance of working together during the remediation
    phase should be into account. The testers should make it a point to work along
    with the remediation teams to help the team make sense of the report and understand
    the finding well, so that they can implement the corrective measures correctly.
    Oftentimes the report is not properly understood and hence the remediation does
    not get implemented effectively, or even worse, ignored due to lack of understanding.


    Once the remediation is complete, the penetration test must be repeated to check
    for closure of the issues identified., there is no alternative to a focused re-test
    as it helps check whether the remediations implemented on the systems truly worked.


    ### Make sure to backup all your data


    Before you commence penetration testing, it’s always a best practice that you
    backup all the essential and critical data, configurations, snapshots of your
    applications, servers. You must also give due considerations to the shared files
    stored in data stores, databases, which may be in the scope for testing. You must
    also give proper importance to source code files if you are planning to scan or
    test the systems and applications hosting code repositories. One of the most important
    assets to backup is the Active Directory, and Domain Controllers, if they are
    in scope, and you are planning to run various identity related tests.


    # Don’ts


    It is easy for a penetration tester to get quite engrossed in the testing such
    that one may forget or bypass the boundaries set for the engagement, or may be
    take a bypass, or just avoid certain rules to follow to achieve results. This
    is extremely dangerous and will inadvertently lead to serious consequences for
    the tester and the organization.


    Let’s take a look at such points that you as a penetration tester must not do
    and keep in mind at all times during an engagement.


    ### Not being ethical


    The common alternative term used for penetration testing is “Ethical Hacking”,
    and this is one thing that all the testers should always bear in mind. One cannot
    afford to be unprofessional, or unethical in performing your duties as a tester.
    During testing you should expect to come across some sensitive, personal, financial
    or otherwise restricted data. You must always follow the rules of engagement for
    dealing with such exposure and consult all your findings with the relevant higher
    authorities in the organization instead of keeping or hiding such information
    for any personal gain later. The ethical part of hacking is what got you the project
    and is the only thread which helps builds trust between the organization and the
    `testers/testing` team.


    ### Not accepting of test results


    During tests you might face situations when there are no findings at all, even
    after trying all known testing methods, tools and exploitation techniques. This
    is quite normal and you must embrace it, this could be due to various reasons,
    simplest could be that the systems are really secured and patched, with proper
    countermeasures implemented. Not finding any flaws does not in any way reflect
    the inability or inefficiency of the tester or the testing team. Instead, it does
    solidify the fact that you left no stones unturned to find flaws, and you found
    it to be really secured. Testers must keep emotions out of the job, penetration
    testing is not about the testing of your ability but the other way around.


    On the other hand, this is also true that if you are not finding anything consistently
    over multiple periods of time, then in that case may be its time to change the
    approach, tools, or technique, or maybe there is something lacking in the system
    knowledge and so on., which must be evaluated too. Don’t get too comfortable either,
    find a balance and be analytical on a case-to-case basis.


    ### Not following the scope of the project


    I am sure that as a penetration tester you are being tasked or paid to break the
    norms, status quo, or even the standard rules of the system, just like any attacker
    would do. But if this is not thought out carefully then you may end up taking
    it too far, and you might end up doing something that has not been authorized
    or permitted within the agreed scope.

