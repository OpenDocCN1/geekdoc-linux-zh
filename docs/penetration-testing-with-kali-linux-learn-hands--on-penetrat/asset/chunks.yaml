    在信息收集阶段，研究人员会进行搜索以收集和汇总公开可见的信息，例如域名搜索、`whois` 查询、反向 DNS 以及类似信息。在某些情况下，你可能需要采用专门的高级搜索技术来寻找有关目标组织的敏感信息，例如
    Google Dork。


    # 侦察与扫描


    在侦察阶段，测试人员倾向于使用特定的高级工具和技术，通过使用探测工具来获取进一步的信息，例如使用 `Nmap`（书中稍后将对其详细介绍）来扫描网络，或使用任何漏洞扫描工具（如
    `Nikto`）。基于 `Nmap` 或类似工具的结果，渗透测试人员还将尝试查找系统上运行的操作系统 (OS) 和服务类型、可用的开放共享，以及关于目标的许多其他详细信息。


    # 漏洞研究


    此阶段涉及对之前测试阶段识别出的所有潜在问题进行研究。测试人员需要筛选所获得的所有信息，以识别并精炼可操作的漏洞，这些漏洞对于获取目标访问权限非常有用。


    # 利用与获取访问


    在此阶段，渗透测试人员将尝试根据收集的信息以及他们从扫描和侦察阶段识别出的漏洞，对目标运行漏洞利用。通常，研究人员会尝试使用 Web 应用程序攻击、网络攻击，可能还会尝试使用某些后门，有时还会使用自定义的利用程序，以获取目标的访问权限。


    # 后利用与维持访问


    此阶段通常被称为后利用阶段。此时，测试人员可能已经获得了系统的完全访问权限（该系统原本由特权访问控制），或者可能会尝试提升到更高的权限级别，有时还会尝试渗透到网络中下一个可用系统。


    # 文档记录与报告


    这是整个渗透测试过程中最后也是最重要的阶段，绝非如此。因为如果文档不完整，工作永远是不完成的。在此阶段，测试人员需要汇总所有与漏洞、问题、缺失配置、可能泄露敏感数据的公开信息相关的信息，并将其汇成一份报告，其中包含执行摘要、技术总结和修复建议。


    # 渗透测试的类型


    渗透测试可以在不同的场景下进行，这些主要由你的测试范围驱动。


    ## 内部测试


    这是通过与内部边界内的团队协作进行的，且无论是否完全了解目标基础设施都可能进行。在大多数情况下，这种测试将模拟内部攻击场景。根据要测试的攻击场景类型，客户可能会决定提供给测试人员的访问权限，这种访问范围可能从简单的网络访问到授权用户不等。内部测试是为了检查安全相关流程和基础设施抵御内部威胁的韧性。


    ## 外部测试


    外部渗透测试正如其名，用于评估面向外部的 IT 资产安全性，例如公司门户、电子邮件服务器、Web 服务器、DNS 服务器、文件服务器、云资源或任何其他面向公众的信息资产。这些测试通常从客户网络之外的远程位置进行。这种形式的测试是为了从防御任何对手发起的外部攻击的角度，检查安全相关流程和基础设施的有效性和韧性。


    ## 黑盒、白盒与灰盒测试


    黑盒渗透测试是一种参与场景，不向渗透测试人员提供任何关于目标或访问的预先信息，渗透测试人员的责任是通过对公开信息的侦察来收集有关目标的所有信息。这种形式的测试试图模拟真实的攻击场景，即对手在没有任何预先信息的情况下利用公开信息构建关于目标的战术知识。黑盒渗透测试需要花费大量时间来绘制目标映射。预计顾问将对侦察期间识别的资产获得确认，以消除任何误报。黑盒方法并不总是可行，因为时间投入的大幅增加会导致项目成本上升；黑盒测试的另一个缺点是目标的所有在线资产可能无法被发现，可能导致测试覆盖不完整。


    在白盒渗透测试任务中，完整的信息——如软件架构、应用程序逻辑、源代码、网络架构图、IP 地址方案、操作系统、平台或设备配置文件等——将提供给渗透测试人员，这导致了最全面的测试覆盖，因为渗透测试人员可以识别出许多漏洞和安全配置错误，这些漏洞对于外部攻击者来说是不可见的。这类测试通常需要大量时间，因为白盒方法需要进行大量的分析评估。此类测试在开发阶段或应用程序及基础设施资产发布到生产环境之前进行。


    灰盒渗透测试正如其名，是一种结合了黑盒和白盒渗透测试特征的参与方法。测试人员会被提供有关目标应用程序或基础设施的常见信息，这涵盖了如 `URL`、IP 地址、所使用的技术、有限的访问凭据等细节。提供给渗透测试人员的这些信息显著减少了测试人员需要的时间、分析和猜测，因为它有效地消除了黑盒和白盒测试方法中对详细侦察以及源代码/配置/逻辑/架构分析的需求。


    # 搭建渗透测试实验室


    现在你已经对渗透测试及其各种活动和子活动有了相当的了解，下一个逻辑步骤是搭建用于执行渗透测试的实验室环境。为了本书的目的，我们将使用各种开源工具、软件、虚拟机和目标机器。


    我们的实验室将基于 VirtualBox `https://www.virtualbox.org/`，并使用 Kali Linux `https://www.kali.org/`
    作为我们的渗透测试工具集。


    #  Setup VirtualBox


    为了本书的目的，你将使用 Oracle VirtualBox（开源）来构建我们的虚拟渗透测试实验室。（在编写本书时我们使用的是 6.0 版本，但在你计划构建自己的实验室时，可以使用可最新版本）


    ![](img/Figure-1.1.jpg)


    **图 1.1:** Oracle VirtualBox 6.0


    VirtualBox 适用于各种操作系统，在书中我们将继续使用 Windows 版本。二进制文件可以从此处下载：`https://www.virtualbox.org/wiki/Downloads`。


    从网页上选择 `Windows hosts` 作为 Windows 安装程序。


    ![](img/Figure-1.2.jpg)


    **图 1.2:** VirtualBox 下载页面和位置


    '
- fmt: '

    Once you have successfully downloaded the installer, continue to install the VirtualBox,
    and follow the on-screen instructions. VirtualBox has many useful features and
    among those the important feature is the ability to host multiple VMs and create
    a private network completely isolated from the host network. This is crucial sometime
    to keep traffic isolated within the VM network especially if working with malware
    files, exploits, or to prevent mistakenly scanning the host network. But in our
    lab, we will have access to host Internet for various purposes, more about the
    network setup for individual VMs is mentioned further into the chapter.


    ![](images/Figure-1.3.jpg)


    **Figure 1.3:** VirtualBox Tools Menu


    Once the installation is complete, the VirtualBox can be configured by accessing
    the `Preference` option (you may also press `Ctrl+G` from keyboard) and perform
    various configurations.


    ![](images/Figure-1.4.jpg)


    **Figure 1.4:** VirtualBox Preference Window


    # Setting up VirtualBox Network


    NAT network will be used for the purpose of this lab. To create a NAT network
    for the lab, open the preferences from the tool’s menu. From the left panel select
    the `Network` option, here you can create new, delete old or edit existing `NatNetwork`
    as per your choice by selecting one of the three options on the right panel.


    ![](images/Figure-1.5.jpg)


    **Figure 1.5:** Virtual NAT Network Setting


    Double clicking the NAT interface brings up a window where the network name and
    IP range used for the lab network can be configured. We will select the name `NatNetwork`
    and IP address range 10.0.2.0 and CIDR prefix `/24`.


    ![](images/Figure-1.6.jpg)


    **Figure 1.6:** Virtual box Preferences


    # Setting up Kali Linux


    Once the setup and configurations are complete, lets proceed to follow the next
    instructions to install Kali Linux (our first VM), Kali is a Linux based VM which
    is preconfigured for the purpose of penetration testing. All the testing and exercise
    in this book is based on Kali Linux and other target VMs (more about target VMs
    in other chapters). The latest distribution of Kali Linux various images can be
    downloaded from the parent website here, **[https://www.kali.org/downloads/](https://www.kali.org/downloads/)**,
    in our case we have chosen the virtual platform as VirtualBox, so the Kali Linux
    image needs to be compatible to VirtualBox, which can be found at this location,
    **[https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/](https://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/)**
    (we will be using the 64bit version for our lab, as shown in the picture below).
    At the time of writing this book the version available was 2019.3.


    ![](images/Figure-1.7.jpg)


    **Figure 1.7:** Kali Linux Download


    Once you have downloaded the VirtualBox compatible OVA file, lets continue to
    follow the instructions below to set it up as a VM in VirtualBox.


    Refer to the VirtualBox tools menu mentioned in above image 1.3, we will use the
    import option to create the Kali Linux VM by pointing to the location of the OVA
    file that was downloaded. Follow the on-screen instructions as shown in the following
    image:


    ![](images/Figure-1.8.jpg)


    **Figure 1.8:** VirtualBox Import VM Option


    Click next to proceed, the next screen shows all the parameters and details about
    the VM, here few parameters can be changed for the VM. Select the location of
    the base folder where the VM will be extracted from OVA and stored, once done
    click the `Import` button to initiate the import.


    ![](images/Figure-1.9.jpg)


    **Figure 1.9:** Import VM


    Once the import is complete, it will appear in the left panel. Select the Kali
    Linux VM to show the option of the VM on the right panel.


    ![](images/Figure-1.10.jpg)


    **Figure 1.10:** Kali Linux VM Details


    Post the installation, continue with the setting up of the network by attaching
    the Adapter 1 to NAT Network, and the network you created (as in the following
    example screenshot) in the previous step.


    ![](images/Figure-1.11.jpg)


    **Figure 1.11:** Kali Network setup


    It is important that all the VMs in the Lab are connected to the same NAT network
    so that they all can communicate with each other after the network setup is complete.


    Starting the VM can be done by double clicking the name of the VM to be started
    or by right clicking the VM name navigating to the `Start` sub menu and selecting
    the `Normal Start` option, doing this will open up a new window, and start the
    boot process.


    Shutting down the VM can be done by clicking on the close button and selecting
    `Send the shutdown signal` this will result in the sending an ACPI shutdown signal
    to the virtual machine which triggers the shutdown process in the operating system.


    ![](images/Figure-1.12.jpg)


    **Figure 1.12:** Shutdown VMs


    In cases when shutting down the VM is not desired you can use the `Save the machine
    state` option, selecting this will freeze the machine state and save it to the
    system hard disk, this option is equivalent to the windows hibernate feature,
    all open programs and services remain active so you can resume from where you
    left off.


    ![](images/Figure-1.13.jpg)


    **Figure 1.13:** Kali graphical desktop environment


    The setup is now ready to proceed with penetration testing activities.


    # Conclusion


    This chapter provided an overview of Penetration Testing, the types of testing
    available, the phases of testing its sub activities. The chapter also covered
    installation for VirtualBox, setting up lab networking and importing Kali VM.


    Moving on, the next chapter will focus on expanding our virtual lab setup by populating
    it with various target machines which will serve as a platform to safely run the
    tests and practice our skills.


    # Questions


    1. Explain penetration testing and its importance?

    2. Why is a penetration test broken down into various phases?

    3. What IP address range was used to set up the virtual lab network?


    # CHAPTER 2


    # Penetration Testing Lab


    In the previous chapter we installed Kali Linux in our virtual environment. In
    this chapter we will explain about installing the target machines in lab environment,
    these targets will serve as intentionally vulnerable testbeds to learn and practice
    real-life penetration testing skills in a safe manner. It is important to use
    these target machines for all testing purposes so that no production systems,
    or any other real network are harmed in the process of learning your skills.


    **Note:** While the chapters in this book are laid out to be in sync with the
    various phases of penetration testing, it is recommended to follow each machine
    to its completion before attempting the next one. While this is certainly not
    mandatory this approach will allow the reader to maintain the flow and fully absorb
    the methodology through repetitive practice.


    # Structure


    In this chapter we will learn about the following topics:


    * Downloading target machines.

    * Populating our virtual lab environment with targets.


    # Objectives


    After reading this chapter, you will be able to:


    * Import different types of target systems in the virtual lab environment.

    * Have a working lab setup which can be used to perform exercises shown in the
    chapters ahead.


    # Target machines


    The targets machines showcased in this book have been carefully selected to maximize
    the readers learning experience by providing a wide array of use-cases. This is
    to get the reader to gradually pick up various penetration testing skills as they
    proceed along their learning journey.

