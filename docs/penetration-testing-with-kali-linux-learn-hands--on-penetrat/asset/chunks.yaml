    \ begin with the next steps,\n\n# [DC-7](#toc.xhtml_s128a)\n\nIn the previous\
    \ steps we logged into the target system using the dc7user’s credentials and changed\
    \ the Drupal admin user’s password to admin123 using the Drush utility. Additionally,\
    \ we also downloaded and enabled the ‘PHP Filter’ module on the remote Drupal\
    \ installation in order to allow us to add and execute custom PHP code on the\
    \ target system.\n\nContinuing further, now let’s attempt to leverage this extended\
    \ functionality of Drupal to obtain web-based shell access on the target. To do\
