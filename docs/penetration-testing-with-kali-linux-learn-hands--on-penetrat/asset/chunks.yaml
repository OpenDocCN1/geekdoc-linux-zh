    `Pranav Joshi` 拥有 20 年以上的信息与网络安全经验，曾为多个业务领域的客户领导并交付了大型项目，涵盖银行、金融、国家证券交易所、保险、能源、石化、零售、媒体、广告、电子商务、IT/ITES、政府和国防等，其中包括财富富
    100 强公司。在之前的职位中，他负责管理信息资产、基础设施和应用程序的安全，范围涵盖 65 个国家，并显著减少了与合规相关的事件。Pranav 被认为发现了许多流行企业产品中的多个已披露和未披露的安全漏洞，这些漏洞已由领先的网络安全公司、专业机构和政府机构发布，如
    `IBM Xforce`、`SecurityFocus`、`ExploitDB`、美国商务部国家漏洞数据库、美国国土安全部网络和基础设施安全局。


    `Deepayan Chanda` 是一位资深的网络安全专家、架构师、网络安全战略师和顾问，致力于解决企业的网络安全问题。在超过 24 年跨多个安全领域经验的驱动下，他成功地在安全与业务目标之间取得了平衡。他曾是武装部队（印度空军）人员，目前任职于澳大利亚国家银行。他还曾工作于渣打银行以及许多大型产品和安全跨国公司，在推动安全项目和解决方案方面展现了强大的领导力。作为许多网络安全初创企业的导师和顾问，他为该行业做出了巨大贡献，并撰写了多部书籍。


    # 关于评审员


    `Ajay Kumar` 是驻驻新加坡的 Crowdstrike 亚洲区网络安全服务区域负责人。此前，他曾在 `Entrust Datacard` 担任亚太区区域总经理和亚太区营销总监。Ajay
    曾获得 CMO Asia 委员会颁发的“国家营销领袖”奖，以及 2016 年世界营销大会颁发的“最具影响力的技术营销领袖”奖。


    在开始创业之旅之前，他曾在几家金融科技、银行和 ITES 组织工作过。


    他是印度数据安全委员会（`DSCI`）的新加坡分会负责人，`DSCI` 是一个由 `NASSCOM®` 设立的网络安全和数据保护非营利行业机构，致力于通过建立网络安全和隐私领域的最佳实践、标准和倡议，使网络空间变得安全、可靠且值得信赖。


    Ajay 是支付、网络安全、企业技术和数据隐私领域的专家，拥有超过 21 年的专业经验。


    他在加齐亚巴德管理学院（Institute of Management Studies）获得市场营销业务管理研究生学位，并在艾哈迈巴德管理学院读过高管课程。他拥有牛津大学赛德商学院的金融科技课程认证以及伦敦
    `CFTE` 的金融人工智能认证。


    `Phoram Mehta` 是 `PayPal` 亚太地区的首席信息安全官（CISO）。Phoram 是一位在信息安全领域拥有二十多年丰富经验的资深人士和技术主管，他在北美和亚太地区包括金融服务、医疗、电信和政府在内的多个公司构建安全技术解决方案方面发挥了关键作用。


    Phoram 还负责 `PayPal` 的全球技术风险管理计划以及信息安全研究与外计划。他目前担任 `ISACA Singapore` 主席，并为新加坡、印度和美国的网络安全初创企业提供建议。


    ### `Burgess Sam Cooper,` EY EMEIA 地区网络安全负责人兼咨询服务合伙人


    Burgess Cooper 是合伙人兼网络安全市场负责人，拥有一支由 600 多名专业人士组成的团队。他在保护全球一些顶级品牌免受潜在网络攻击方面拥有超过
    23 年的丰富工作经验。


    在加入 EY 之前，他曾担任 `Vodafone` 和 `HSBC` 的 CISO，负责电信和 BFSI（银行、金融服务、保险及保险）部门的信息安全、隐私和合规工作。


    他是 `BCCI`、`ASSOCHAM`、`CII`、`CISO and E-crime` 等知名行业活动的经常演讲者和评委会成员，并且是 EC-Council
    认证的行业 CISO 认证 CEI 主培训师。


    ### `Diana Kelley’s` 安全职业生涯跨 30 年。她是 `SecurityCurve` 的联合创始人兼 CTO。她投入大量时间从事网络安全社区的志愿者工作，包括担任
    `ACM` 伦理与抄袭委员会成员、`Sightline Security` 的 CTO 和执行委员会成员、`WiCyS` 的执行委员会成员和包容性工作小组领袖、`Cyber
    Future Foundation` 的执行顾问委员会成员、`CompTIA` 网络安全委员会顾问、巴莱特科学与数学学院（`Bartlett College
    of Science and Mathematics`）和布里奇特州立大学（`Bridgewater State University`）的顾问委员会以及
    RSAC 美国项目委员会成员。Diana 是“#MyCyberWhy”系列的制作人、`BrightTALK` “The (Security) Balancing
    Act”的主以及“Your Everyday Cyber”播客的共同主持人。她还是 `TechVision Research` 的首席咨询分析师和 `The
    Analyst Syndicate` 的成员。此前，她曾担任多种角色，如 `Microsoft` 网络安全领域 CTO、`IBM Security` 全球执行安全顾问、`Symantec`
    总经理、`Burton Group`（现 `Gartner`）VP 以及 `KPMG` 经理。她是一位备受欢迎的主旨演讲者，也是书籍《实用网络安全架构》和《开发者加密库》的合著者。她曾是波士顿学院网络安全硕士课程的讲师，并荣获
    EWF 2020 年度高管奖以及 Cybersecurity Ventures 100 位“反击网络犯罪的迷人女性”之一。


    # 致谢


    我要感谢几位在写这本书期间向我提供持续和不断支持的人。首先，我要感谢我的妻子，在我花费许多周末和晚上写作时包容我。没有她的支持，我永远无法完成这本书。


    如果没有我一些关键专业同事和导师的支持，这本书就不会可能，特别是 `Diana Kelly`、`Ajay Kumar`、`Phoram Mehta`、`Burgess
    Cooper` 和 `Pranav Joshi`（合著者）。我向他们所有人表示感谢。


    最后，我要感谢 `BPB Publications` 给我为他们写这本书的机会。


    *– `Deepayan Chanda`


    我诚挚地感谢我的家人和朋友，他们在我至今的旅程中坚定地支持并塑造了我。没有他们的支持、耐心和坚持不移的承诺，我无法成为今天的自己。


    我要感谢我的妈妈、爸爸和妻子，他们不断提供灵感和支持，挑战我完成这项工作及更多成就；感谢我的儿子和女儿，他们调皮的作剧让氛围变得轻松，并让我期待每一天。


    最后，我感谢 `Deepayan Chanda`（合著者）和 `BPB` 团队在写这本书期间提供的所有支持。没有你们大家，这项工作是不可能实现的！


    *– `Pranav Joshi*


    # 前言


    渗透测试是为了模拟对网络、操作系统和应用程序的网络攻击，以发现其漏洞以及如何利用这些漏洞获取访问权限，这与实际攻击者的做法非常相似。整个行业的研究人员、测试人员和专家使用渗透测试方法和技术来评估和评价企业防御系统及流程的效率效能。


