    然而，上述服务并非所有项都必须运行在默认端口上，出于安全考虑，许多组织会为某些服务选择自定义端口，例如，他们可能选择使用端口 8181 作为代理，或为 Web
    应用选择任何其他自定义端口。除了上述端口，你可能还会发现其他服务常用的几个端口，有时这些端口可能非常特定于组织内部构建的应用，因此也会随组织而异。让我们更详细地讨论一些常见的利用技术。


    # NetBIOS 枚举


    通常，NetBIOS 用于通过局域/WAN 连接的计算机之间的通信，以允许文件共享和打印机共享。在基于 Windows 的系统中，NetBIOS 可用于通过
    TCP/IP 检测并识别连接的网络设备。通常，NetBIOS 名称在本质上是唯一的，可以揭示有关可枚举设备的一些有趣信息。可以找到的常见因素包括：连接到特定域的所有计算机列表、这些主机上的开放共享等，其中大多数内容都可以使用
    `Nbtstat` 等常用工具找到。


    # SNMP 枚举


    `简单网络管理协议`（`SNMP`）是一种基于 UDP 的协议，用于管理和维护路由器、交换机等网络设备。SNMP 广泛用于大多数操作系统，包括 Windows
    Server、Linux 和 UNIX 服务器。SNMP 始终是研究人员和测试人员的目标，用于枚举与用户账户、密码以及目标环境中关联系统名称相关的细节。SNMP
    用于`网络管理系统`（`NMS`）对网络设备进行监控和管理。启用 SNMP 的设备允许根据访问级别通过读或写权限访问管理信息数据库。该数据库存储带有特定标识符的网络对象的描述，并作为值和设置的仓库。SNMP
    使用团体字符串（Community Strings）进行设备间的身份验证，这些团体字符串本质字符串。这种特定的身份验证机制实现允许任何攻击者或安全测试人员进行网络嗅探。如果团体字符串没有得到适当的保护或配置，可能会泄漏网络信息。在
    SNMP 枚举可以使用 `SNMP-WALK`、`SolarWinds` 等工具。


    # DNS 枚举


    DNS 枚举是另一种常用方法，用于定位 DNS 服务器及其关于目标系统/网络的相关记录。它可以提供目标系统非常有用的信息，如 IP 地址、用户名、计算机名称等。DNS
    记录将提供存储在区域文件中记录的概述。由于 DNS 数据通过 DNS 区域传输同步到一组 DNS 服务器中，攻击者或渗透测试人员可以执行 DNS 区域传输请求，如果
    DNS 服务器由于任何配置缺陷允许未经授权方进行区域传输，在这种情况下，关联设备的 DNS 名称和 IP 地址将以明文访问。可用于此活动的工具包括 `nslookup`
    或 `maltego`。


    # 第 6 阶段：漏洞研究


    漏洞研究阶段考虑了在信息收集、侦察和枚举阶段收集的所有情报，以列出与目标系统相关的潜在安全问题列表，对这些安全问题进行进一步分析，以确定其严重性、影响和利用难易程度。将执行额外的验证措施以确定其有效性并消除任何误报。


    然后将安全问题与每个已识别问题的可用利用程序和技术列表进行映射，这样做是为了得出每个可用利用程序或技术的成功和失败率。在研究阶段评估各种利用程序和技术时必须特别注意，以避免对目标系统造成任何潜在危害。


    # 第 7 阶段：利用


    在利用阶段，测试人员的主要重点是使用上一阶段发现的利用程序或技术来利用发现的安全缺陷。测试人员需要仔细的评估和规划，以确定最有效且安全的方法，避免将系统踢出网络、被监控系统检测/拦截以及未能实现既定目标。在此阶段执行的所有操作都需要经过良好的控制和协调，应捕获并保留所有执行活动的证明以供下一阶段使用。


    # 第 8 阶段：报告


    这是整个过程的最后阶段也是最重要的阶段之一，因为它涉及项目交付物的生成。测试人员在项目上花费的所有时间和精力的都被提炼成简洁且有意义的文档或一系列文档，准确反映了被测试系统的安全状态。


    正如俗话说（我不知道是谁说的）“在记录之前，任何事情都不被视为完成”。交付物应准确描述在各个阶段执行的活动，每一步都必须结合发现的结果和产物进行记录，以证实测试人员的主张。这些信息必须通过适当的解释以及对执行的步骤、差距、发现的漏洞、使用的利用程序、如何使用以及它们在什么情况下有效或可能失效的详细证明来证明。


    报告的内容应基于渗透测试人员自身观察到的实际事实，而不是假设。一旦报告定稿，必须与各种利益相关者和相关部门共享，例如高层管理、监管、运营团队、应用程序和基础设施安全团队以及组织的技术团队。


    由于渗透测试报告被广泛的利益相关者使用以满足其特定的角色需求，因此报告的结构应该是良好的，并包含帮助他们满足项目目标和要求的章节。


    在报告期间可以遵循的某些章节如下：


    ## 目标


    此章节必须绝对清晰地涵盖渗透测试的目标。整个演练的目的以及它将实现哪些目标。例如，“渗透测试是作为年度流程的一部分进行的”，或者“渗透测试是为了满足监管机构的审计要求而进行的”，又可能简单地检查上线应用程序的有效性和韧性。


    ## 预期利益相关者


    定义或记录组织中谁需要共享此报告的人，例如 CIO、CTO、CISO、信息安全经理、IT 经理、技术团队、应用程序安全团队等。


    ## 方法论


    '
- fmt: '

    Testing reports should also contain the methodology followed during the testing
    phases; you may choose to use the methodology mentioned in the beginning of this
    chapter with the diagram. This will provide a clear direction to the reader that
    how the test was conducted, which will add to the confidence of the reader about
    the testing and the findings.


    ## Findings and related details


    This section tester will attempt to explain each of their findings in details
    with technical explanations and possible proofs with screenshots. Testers need
    to provide details in form of tables, pie graphs, bar charts, and so on., followed
    by detailed explanations about the vulnerabilities found, and how they are exploited
    or leveraged to gain access or likelihood of causing any harm, must also explain
    the impact of such vulnerabilities and exploits on the applications or systems,
    and last but not the least, the risk level (Critical, High, Medium, Low) must
    be explained too.


