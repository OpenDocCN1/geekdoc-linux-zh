- fmt: '

    Avoiding or failing to adequately scope the activities may lead to numerous issues
    for the penetration tester and/or their organization. In adverse situations it
    may even lead to legal liabilities sometime. The scope should clearly define what
    needs to be tested, when needs to be tested, how much the testers should be allowed
    to penetrate, what need to be avoided. A key factor to consider while scoping
    is that how much time one should allow to complete the task in hand. The most
    common mistake that researchers do while scoping is to calculate the efforts based
    on number of IP addresses or IP ranges to scan and complete rest of the phases.
    The best practice is to always assess the amount of effort needed to complete
    the task as defined by the scope of work, and based on this assessment the time
    to complete the penetration testing must be scoped. While still on this topic
    of time and effort estimation/scoping, lets also consider the fact that these
    estimations will greatly depend on the skill, maturity, experience of the testers
    themselves or in many cases the team as a whole. It means that if the team/tester
    is highly experienced then the amount and accuracy of the test will vary as compared
    to less experienced ones. As a practice, the testers must scope for buffer time
    to the original scoped time to complete the activities. Some of the important
    scoping criteria is as follows, which can be followed as per the need:


    - Are you performing the penetration test to fulfil any regulatory or compliance
    requirements or is it just to assess any weaknesses by the internal team on a
    regular basis?

    - What is the time window to conduct the penetration test, for example, during
    business hours only, or may be the organization wants to perform the tests during
    the -off-peak hours to avoid any business continuity disruptions, or may be only
    on the weekdays?

    - It must also account for how many total IP addresses need to be tested, it will
    be also useful to separate in groups of internal and external IP addresses.

    - Account for any devices such as a firewall, IDS/IPS or any web application firewall,
    as these devices may impact the penetration testing results.


    The scoping activity will provide the safety net in case there are any disruptions
    during the testing, and disruptions are quite common during penetration testing.
    For example, a webserver under the testing scope may go down, and the testing
    is halted till it recovers and resumes normal services.


    # Phase 2: Planning


    The planning phase will set the stage to gather initial information to prepare
    for the penetration testing. Prior to every testing, the penetration tester needs
    to ensure that a formal agreement explicitly detailing the test its scope and
    duration has been prepared, agreed and signed by both parties, this is to done
    to provide absolute clarity and grant legal protection for the assignment. In
    case you are an internal team to your organization then this could just be an
    agreement between your team and the management or the stakeholders for whom you
    are performing the tests.


    Following must be established to proceed for the next steps:


    - Prepare a list of contacts and key stake holder individuals from both the team.

    - Prepare an escalation matrix.

    - Inform the support team about the penetration testing window, so that they are
    aware of the tests being run and can stay vigilant.

    - Make sure the security operations teams are aware of the testing and the time
    window too, they can then monitor the scans and detect if any anomalous or malicious
    attacks are happening with similar patterns, and not block your scans.

    - Define the test cases, and tests those you will run during the testing phases.

    - Choose the tool set you will use and set up the testing environment accordingly.


    At the end of this phase and by following all the steps, the tester will be able
    to gain valuable information about the target network, like Employee names, their
    positions and in some instances might also get contact details, technologies used,
    locations, computing platforms, Web exposure like domain names and number of domains
    used, hosting details, data center locations, or office locations, technologies
    used for their networks (from job postings and so on.), E-mail addresses and phone
    numbers.


    # Phase 3: Information gathering


    In this phase, the activities are generally focused to gather as much information
    as possible about the target, for the purpose of our book we have divided this
    phase into two subphases, Phase 3a, General Information gathering phase which
    you would perform if the target you are planning to launch the testing against
    are just new or it’s the first time launching a penetration testing. And Phase
    3b, Historical Information gathering, which will be explained subsequently. Let''s
    continue with phase 3a, during any information gathering the default choice is
    the use of Internet, to find all the critical or useful information that can be
    found about the target host or the organization. The techniques may vary from
    the usage of search engines to use of internet-based tools like `WHOIS` or gathering
    `DNS` info. Information gathering can be as creative as possible, more the amount
    of information gathered, be it technical information about the IT systems, or
    external facing applications and infrastructure, or maybe it can also be descriptions
    in job posts which give away the type of technology or products the organization
    is using. A very creative search can many times reveal stored source codes in
    `git` repositories or similar locations, which may have embedded user or account
    credentials.


    It is not necessary though that the information has to be collected directly from
    the target, or you need to make any contacts with the target and target systems
    at this stage of penetration testing. That phase comes a bit later though. During
    this phase, all or most of the information is collected from openly available
    information, mostly from public internet resources, the sole purpose of this phase
    is to explore all possible locations and sources of information which can give
    additional and useful information about the target. This can be divided into three
    distinct methods:


    - Passive Information Gathering

    - Active Information Gathering

    - Historical Information


    Following let’s look a little bit in more detail about these two activities.


    # Passive Information Gathering


    Passive information gathering is the process to capture and gather information
    about your target systems, and applications by avoiding any physical contact or
    connection to access the information. To achieve passive information gathering,
    use other sources those are open in the public to gather information about the
    target, it may include tools like `whois` query for example.


    To locate the web presence of the target, you may choose to use search engines
    to dig deep about the target, Social media can be searched to get employee details,
    you can also use resources online to check the service status of the target, like
    how long the services are active or if there were any downtime in past, how long
    were those downtime each occurrence, and so on, you may also choose to perform
    reverse DNS lookup, check spam databases and various other public resources as
    there is no end to it, it is worth to recall here what was mentioned at the beginning
    of this phase, more creative you are, more information you can gather.


    # Active information gathering

