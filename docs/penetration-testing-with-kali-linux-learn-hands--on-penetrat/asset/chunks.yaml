- fmt: '

    In Information gathering researchers perform searches to collect and gather information
    that is publicly visible, Domain name searches, `whois` queries, reverse DNS and
    similar information. In some cases, you might need to employ specialized advanced
    searching techniques to find sensitive information regarding the target organization
    such as Google Dork.


    # Reconnaissance and scanning


    In reconnaissance stage testers prefer to use specific and advanced tools and
    techniques to gain further information by using probing tools, such as `Nmap`
    (more about it later in the book) to scan the network, or any vulnerability scanning
    tools such as `Nikto`, based on the results from `Nmap` or similar tools, penetration
    testers will also try to find the types of OS & Services running on the systems,
    open shares available, and many more other detailed information about the targets.


    # Vulnerability research


    This phase involves performing research on all potential issues identified during
    the previous phases of the test. The tester is expected to shift through all the
    information gained to identify and refine actionable vulnerabilities which can
    prove useful to gain access on the targets.


    # Exploitation and gaining access


    At this stage Pentesters would attempt to run the exploits against the target
    based on the information gathered and the vulnerabilities they identified from
    the scanning and recon phase. Typically, the researchers would attempt to use
    web application attacks, network-based attacks, may be also try and use some backdoors,
    sometimes custom-built exploits too so as to gain access of the target.


    # Post-exploitation and maintaining access


    This phase is often known as post-exploitation phase. By this time the tester
    would have full access to the system, which is otherwise controlled by privileged
    access, or may be try to elevate to higher privilege access level, sometimes also
    try and pivot to next available systems in the network.


    # Documentation and reporting


    This is the last and important phase in the entire Penetration testing process
    but not the least. As no work is ever complete if documentation is not complete.
    In this phase the tester needs to compile all the information related to vulnerabilities,
    issues, missing configurations, public information that may have revealed some
    sensitive data, and compile it into a report with an Executive Summary, Technical
    Summary and Recommendation to remediate.


    # Types of penetration testing


    Penetration testing can be performed with different scenarios, and these are mostly
    driven by the scope of your test.


    ## Internal testing


    This is performed by working together with the internal teams within the internal
    perimeter, and with or without full knowledge of the target infrastructure. In
    most cases this testing will simulate the scenario of an insider attack. depending
    on the type of attack scenario to be tested, the client may decide on the access
    level to be provided to the tester, this access may range from simple network
    access all the way to an authorized user. Internal testing is done to check the
    resilience of the security related processes and infrastructure against insider
    threats.


    ## External testing


    External penetration testing just like the name suggests is used to assess the
    security of the external facing IT assets, such as the company portal, email servers,
    web servers, DNS Servers, File servers, Cloud resources, or any other public facing
    information assets. These tests are often carried out from a remote location,
    outside of the client’s network. This form of testing is performed to check the
    effectiveness and resilience of security related processes and infrastructure
    from the perspective against an external attack launched by any adversary.


    ## Black box, White box and Grey box testing


    Blackbox penetration testing is an engagement scenario where no prior information
    about the targets or access is provided to the penetration tester, it is the penetration
    testers'' responsibility to gather all information about the targets through reconnaissance
    of publicly available information, this form of testing attempts to simulate a
    real-world attack scenario where an adversary without any prior information builds
    tactical knowledge of the target using publicly available information. Blackbox
    penetration testing requires that a lot of time to be devoted to mapping out the
    target. It is expected for the consultant obtain confirmation on the assets identified
    during reconnaissance to eliminate any false positives. The Blackbox approach
    may not always feasible as it leads to hiked up project costs due to significant
    escalation in time investment, another downside to Blackbox testing is that not
    all the online assets of the target may be discovered which may result in incomplete
    test coverage.


    In a Whitebox penetration testing engagement complete information such as software
    architecture, application logic, source codes, network architecture diagrams,
    IP address schemes, OS, platform or device configuration files and so on. `are
    made available to the penetration tester, this leads to the most comprehensive
    test coverage as the penetration tester can identify a lot of vulnerabilities
    and security misconfiguration which may not be visible to an external attacker.
    This type of testing usually takes a lot of time as Whitebox approach testing
    requires a lot of analytical assessment to be carried out. Such testing is carried
    out in the development stage or prior to launch of application or infrastructure
    assets into production environment.


    Greybox penetration test as the name suggests is an engagement approach which
    combines the features of Blackbox and Whitebox penetration testing. The tester
    is provided with common information on the target application or infrastructure,
    this covers details such as `URL`, IP addresses, technology being used, limited
    access credentials, and so on. This information provided to the penetration tester
    results in significant reduction of the amount of time, analysis and guesswork
    required on the penetration tester’s behalf, by effectively eliminating the need
    for detailed reconnaissance and source code/configuration/logic/architecture analysis
    in Blackbox and Whitebox testing approaches.


    # Setting up virtual penetration testing lab


    Now that you have a fair understanding about the penetration testing its various
    activities and sub-activities, the next logical step is to set up the lab environment
    for performing penetration testing. For the purpose of our book, we will be using
    various open-source tools, software, VMs and target machines.


    Our lab will be based on VirtualBox `https://www.virtualbox.org/` with Kali Linux
    `https://www.kali.org/` for our Penetration testing tool sets.


    # Setting up VirtualBox


    For the purpose of this book, you will be using Oracle VirtualBox (open-source)
    to build our virtual penetration testing lab. (at the time of writing the book
    we used version 6.0, but you may use the latest version that is available when
    you plan to build your own lab)


    ![](images/Figure-1.1.jpg)


    **Figure 1.1:** Oracle VirtualBox 6.0


    VirtualBox is available for various operating systems, in this book we will continue
    with the Windows version. The binaries can be downloaded from this location `https://www.virtualbox.org/wiki/Downloads`.


    From the webpage choose the `Windows hosts` for the windows installer.


    ![](images/Figure-1.2.jpg)


    **Figure 1.2:** VirtualBox Download page and location

