    双方之间应交换关键人员的联系信息，如姓名、职位、电子邮件、电话号码，并说明他们在渗透测试期间将承担的角色；这些信息应记录在工作说明书（Statement of
    Work）和参与合同（Engagement Contract）中。这些文件应与客户正式签署，并按照之前描述的双方同意的安全通信通道进行共享。


    客户方人员包括以下部门的代表：


    *   管理层的关键利益相关者

    *   项目经理

    *   IT 管理

    *   信息安全

    *   网络安全

    *   安全运营中心 (SOC)

    *   应用开发


    监督、管理和执行测试的人员：


    *   管理层

    *   项目经理

    *   首席渗透测试员

    *   团队成员


    # 测试窗口


    决定测试窗口的因素取决于客户安全团队的整体成熟度、测试环境（开发/生产环境）以及所评估系统的关键性。


    这范围可能从 24x7 全天候测试到每天在非营业时间或非高峰时段仅持续几小时，在某些情况下可能仅限于周末；在准备测试计划时，这一点非常重要。客户端应配备足够的支持人员，以便在测试团队遇到任何问题时能够快速解决。


    一旦确定了测试日期和时间，应记录在双方签署的合同文件中。


    # 测试局限性


    由于某些测试可能会直接影响测试环境，因此理解客户的顾虑并为正在进行的测试设定合理的边界至关重要。设置这些边界可能出于多种原因，包括以下方面：


    *   为了避免被测试系统或服务崩溃（例如：拒绝服务）。

    *   为了避免对测试系统性能的影响（例如：拒绝服务）。

    *   为了防止测试运行时间过长的情况（例如对登录表单进行暴力破解）。

    *   为了避免敏感数据泄露（例如将密码哈希值上传到在线破解网站）。

    *   为了避免向环境引入恶意脚本（例如上传 Web Shell、内核漏洞等）。


    在完成参与前讨论、计划、调度和合同签署后，即可根据约定的测试窗口开始测试。


    # 侦察


    本节旨在通过在书中之前创建的实验环境中练习技能，使用户熟悉 Kali Linux 中提供的各种侦察工具和技术。


    让我们在实验环境中开始渗透测试的实操部分。启动 Kali Linux 虚拟机以及各种目标机器，以练习随后的练习。在开始测试之前，请为目标机器完全启动留出足够的时间。


    登录 Kali Linux 系统，从 Dock 打开终端窗口并执行 `ifconfig` 命令以获取分配给我们 Kali 系统的网络和 IP 详情。


    ![](img/Figure-5.1.jpg)


    **图 5.1：** `ifconfig` 命令


    `ifconfig` 命令的输出显示我们的 Kali 系统被分配了 IP 地址 `10.0.2.238`，掩码设置为 `255.255.255.0`。


    我们从目标环境中已知一点是，测试机与我们的 Kali 系统在同一个虚拟网络上。根据子网掩码信息，我们可以推断出网络共有 256 个主机 IP 地址。排除网络
    IP `10.0.2.0` 和广播 IP `10.0.2.255`，为目标系统留下了 `10.0.2.1` 到 `10.0.2.254` 之间的可用主机 IP
    范围。


    **注意：** 所有测试将通过我们的 Kali Linux 系统在虚拟实验室网络进行，我们不会直接与测试目标进行交互。在继续后续章节之前，请记录这些细节。


    # DC:7


    ![](img/Figure-5.2.jpg)


    **图 5.2：** DC-7 登录界面


    DC-7 完全启动的截图。


    DC-7 控制台显示了分配给它的当前 IP，但在实际测试中情况并非如此，因此，我们将探索通过网络查找此类信息的方法。


    Kali Linux 上有许多现成的工具来执行目标侦察，但如果不理解其内部原理而直接使用它们将导致无法掌握核心概念。初始练习将涉及编写基础脚本来执行目标侦察，这种方法有望帮助读者在使用
    Kali Linux 中的现成工具之前理清相关概念。


    在网络上寻找“存活”主机的一种方法是使用一系列 ping（ICMP 回显）请求对网络进行扫描，并等待正在运行的主机的响应。现在，让我们打开终端窗口，并利用
    bash `for` 循环创建一个非常基本的 ping 扫描器，使用内置的 `ping` 命令向 IP 范围内的所有主机发送 ICMP 回显请求。


    ![](img/Figure-5.3.jpg)


    **图 5.3：** 使用简单的 `for` 循环对网络进行扫描


    `ping` 命令向每个主机发送的 ICMP 回显请求数通过 `-c` 标志限制为 1，如果不进行此限制，标准的 Linux `ping` 命令将一直发送
    ping 请求，除非通过按 `^c` 中断。为了加快脚本运行速度，还通过 `-W` 标志将超时设置缩短为 1 秒。这意味着 `ping` 命令将在超时退出之前等待
    1 秒钟的 ICMP 响应。


    `ping` 的输出包含了失败的 ping 请求以及从存活“主机”收到的 ping 响应，为了避免在屏幕上看到失败的请求，我们使用 `grep` 命令关键词“bytes
    from”对接收到的输出进行过滤，仅显示对我们请求响应的主机。


    ```

    root@kali:~# for i in $(seq 1 254); do ping -c1 -W1 10.0.2.$i | grep "bytes from"
    ;done

    ```


    ```

    64 bytes from 10.0.2.1: icmp_seq=1 ttl=64 time=2.37 ms

    64 bytes from 10.0.2.18: icmp_seq=1 ttl=64 time=341 ms

    64 bytes from 10.0.2.27: icmp_seq=1 ttl=64 time=0.646 ms

    64 bytes from 10.0.2.180: icmp_seq=1 ttl=64 time=110 ms

    64 bytes from 10.0.2.208: icmp_seq=1 ttl=128 time=1.74 ms

    64 bytes from 10.0.2.238: icmp_seq=1 ttl=64 time=0.049 ms

    64 bytes from 10.0.2.245: icmp_seq=1 ttl=64 time=65.5 ms

    64 bytes from 10.0.2.253: icmp_seq=1 ttl=64 time=266 ms

    root@kali:~#

    ```


    从输出可以看出，该命令按预期执行，并返回了 10.0.2.X 范围内的所有“存活”主机。


    我们使用的实验环境有多个活动机器，测试实验室的 ping 扫描显示了多个主机的响应，如果读者只启动了 DC-7 ，结果将会不同。


    **注意：** 如果主机禁用了 ICMP 回显请求/响应，这种类型的网络映射将失败。


    我们创建的扫描命令确认了 DC-7 机器的 IP 地址 `10.0.2.27` 在线，我们将通过编写一个类似的单行 Shell 命令检查 DC-7 机器上的开放端口来进一步探测该
    IP 地址。首先，我们将仅扫描目标主机上 65535 个 TCP 端口前 1024 个。


    ![](img/Figure-5.4.jpg)


    **图 5.4：** 使用简单的 `for` 循环进行端口扫描


