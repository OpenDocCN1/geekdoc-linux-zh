    \ for version 1.3.5\n\nProFTPd 1.3.5 - 'mod_copy' Command Exe | exploits/linux/remote/37262.rb\n\
    \nProFTPd 1.3.5 - 'mod_copy' Remote Comm | exploits/linux/remote/36803.py\n\n\
    ProFTPd 1.3.5 - File Copy              | exploits/linux/remote/36742.txt\n\nSearching\
    \ for dovecot, postfix, samba, and snmpd did not produce any meaningful exploit\
    \ or shellcode results for the versions installed on the target host.\n\nTake\
    \ notes on the observations made so far, and we will continue with this machine\
    \ in the next chapter.\n\n**Observation Notes:**\n\n**IP address:** 10.0.2.15\n\
    \n**Operating System:** Linux (Debian 9)\n\n**Open Ports & Services:**\n\n*  \
    \ 21/tcp FTP\n\n    *   ProFTPD 1.3.5\n\n        *   Found listing of user patrick’s\
    \ home directory in /upload/directory.\n\n        *   Exploits found\n\n     \
    \       ![](images/ent.jpg) ProFTPd 1.3.5 - 'mod_copy' Command Exe | exploits/linux/remote/37262.rb\n\
    \n            ![](images/ent.jpg) ProFTPd 1.3.5 - 'mod_copy' Remote Comm | exploits/linux/remote/36803.py\n\
    \n            ![](images/ent.jpg) ProFTPd 1.3.5 - File Copy | exploits/linux/remote/36742.txt\n\
    \n*   22/tcp SSH\n\n    *   Dropbear sshd 0.34 (protocol 2.0)\n\n        *   Exploit\
    \ found\n\n            ![](images/ent.jpg) Dropbear SSH 0.34 - Remote Code Execut\
    \ | exploits/linux/remote/387.c\n\n*   25/tcp SMTP\n\n    *   Postfix smtpd package\
    \ version 3.1.8-0\n\n*   80/tcp HTTP\n\n    *   Apache httpd 2.4.25, /ossec directory\
    \ contains web interface for OSSEC-HIDS\n\n        *   Exploits found\n\n    \
    \        ![](images/ent.jpg) Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \n            ![](images/ent.jpg) Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n\
    \n*   110/tcp POP3\n\n    *   Dovecot pop3d package version 1:2.2.27-3\n\n*  \
    \ 139/tcp netbios-ssn\n\n    *   Samba smbd package version 2:4.5.16\n\n*   143/tcp\
    \ IMAP\n\n    *   Dovecot imapd package version 1:2.2.27-3\n\n*   445/tcp netbios-ssn\n\
    \n    *   Samba smbd package version 2:4.5.16\n\n*   465/tcp SMTP\n\n    *   Postfix\
    \ smtpd package version 3.1.8-0\n\n*   587/tcp SMTP\n\n    *   Postfix smtpd package\
    \ version 3.1.8-0\n\n*   993/tcp ssl/imaps?\n\n*   995/tcp ssl/pop3s?\n\n*   123/udp\
