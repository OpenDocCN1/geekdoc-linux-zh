    在你的 Kali Linux 系统上打开终端窗口，我们将首先使用 `netdiscover` 对实验室网络进行主动 ARP 扫射，并识别分配给目标机器的 IP
    地址。输入命令 `netdiscover -r 10.0.2.0/24` 并等待扫描完成，按 `Ctrl-C` 退出 `netdiscover` 命令。


    ![](img/Figure-5.20.jpg)


