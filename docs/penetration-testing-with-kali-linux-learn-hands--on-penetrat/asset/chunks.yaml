    \   Mapped to patrick’s home directory\n\n# [Kioptrix:5](#toc.xhtml_s130a)\n\n\
    In the last chapter during the research phase of our penetration testing we viewed\
    \ the Apache configuration file using a **`pChart 2.1.3`** directory traversal\
    \ vulnerability and discovered that access to port 8080 was being restricted to\
    \ *Mozilla/4.0* browser using the User-Agent matching. We bypassed the restriction\
    \ by spoofing our User-Agent and got access to the PHPTAX application running\
    \ on port 8080.\n\nThe exploits identified for PHPTAX application in the previous\
    \ phase are given in the following table:\n\n**`PhpTax - 'pfilez' Execution Remote\
    \ Cod | exploits/php/webapps/21833.rb`**\n\n**`PhpTax 0.8 - File Manipulation\
    \ 'newval | exploits/php/webapps/25849.txt`**\n\n**`phptax 0.8 - Remote Code Execution    \
    \ | exploits/php/webapps/21665.txt`**\n\nOpen up a terminal session, and check\
    \ the code for each exploit given above using the **`cat`** command.\n\nExamining\
    \ the code for the **`21833.rb`** file tells us that it is a metasploit exploit\
    \ module, as we have already used metasploit last time we will use a more manual\
    \ approach this time.\n\nThe second exploit **`25849.txt`** shows us the vulnerable\
    \ parameter named field and the exploit URL which can be leveraged to gain access\
    \ to the system.\n\n![](images/Figure-8.19.jpg)\n\n**Figure 8.19:** Exploit 25849.txt\
    \ source code\n\nAs shown in the screenshot the code above leverages a remote\
    \ code execution vulnerability in **`index.php`** file to create a basic php based\
    \ command shell **`rce.php`**.\n\n![](images/Figure-8.20.jpg)\n\n**Figure 8.20:**\
    \ rce.php webshell execution technique\n\nThe code at the end of **`25849.txt`**\
    \ shows us the location of **`rce.php`** web-shell file and gives clues to execute\
    \ commands using the cmd parameter once the web shell has been created on the\
    \ system.\n\nNow, craft an exploit URL from the code above and send it to the\
    \ Kioptrix:5 target machine using **`curl`** command:\n\n**`curl -A \"Mozilla/4.0\
    \ Mozilla_4browser\" \"http://10.0.2.104:8080/phptax/index.php?field=rce.php&newvalue=%3C%3Fphp%20passthru(%24_GET%5Bcmd%5D)%3B%3F%3E\"\
    \ -v`**\n\nOutput of the exploit is below:\n\n![](images/Figure-8.21.jpg)\n\n\
    **Figure 8.21:** Running the crafted exploit URL using curl\n\nThe command ran\
    \ without any errors, let’s confirm whether **`rce.php`** has been created on\
    \ the server and execute some system commands on the target.\n\n**`curl -A \"\
    Mozilla/4.0 Mozilla_4browser\" http://10.0.2.104:8080/phptax/data/rce.php?cmd=id`**"
