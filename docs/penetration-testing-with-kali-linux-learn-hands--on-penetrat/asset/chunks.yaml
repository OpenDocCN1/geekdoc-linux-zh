    **图 3.13:** 重启服务


    使用 `service apache2 restart` 命令重启 apache2 服务。


    # service <service name> status


    status 选项用于检查服务的当前状态。


    ![](img/Figure-3.14.jpg)


    **图 3.14:** 检查服务状态


    使用 `service apache2 status` 命令查看 Apache Web 服务器状态。


    # service <service name> stop


    stop 选项用于停止服务。


    ![](img/Figure-3.15.jpg)


    **图 3.15:** 停止服务


    使用 `service apache2 stop` 命令停止 apache2 服务。


    # 使用 update-rc.d 实现服务持久化


    默认的 Kali Linux 不带有预启的远程访问启动服务，可以使用 `update-rc.d` 命令允许服务跨重启保持持久化。


    ![](img/Figure-3.16.jpg)


