- fmt: "\n## Figure 7.20: Port 8080 shows index page instead of forbidden 403 error\
    \ page\n\nGreat, the server responded with a webpage instead of the usual 403\
    \ or forbidden message, we can see a link to phptax application.\n\n![](images/Figure-7.21.jpg)\n\
    \n### Figure 7.21: PHPTax application on port 8080\n\nThe page title shows that\
    \ the phptax application has been developed by William L. Bergrenn and copyright\
    \ year is 2003. No version details are mentioned either on the page or in the\
    \ source code.\n\nLet’s search for any known exploits for the phptax application\
    \ using `searchsploit`.\n\n![](images/Figure-7.22.jpg)\n\n### Figure 7.22: list\
    \ of PHPTax exploits\n\nSearchsploit found three results for phptax application:\n\
    \n- PhpTax - 'pfilez' Execution Remote Cod | `exploits/php/webapps/21833.rb`\n\
    - PhpTax 0.8 - File Manipulation 'newval | `exploits/php/webapps/25849.txt`\n\
    - phptax 0.8 - Remote Code Execution | `exploits/php/webapps/21665.txt`\n\nTake\
    \ notes on the observations made so far and we will continue with this machine\
    \ in the next chapter.\n\n#### Observation Notes:\n\n- **IP address:** 10.0.2.104\n\
    - **Operating System:** FreeBSD\n- **Open Ports & Services:**\n    * 80/tcp http\n\
    \        * Apache httpd 2.2.21\n        * mod_ssl/2.2.21\n        * OpenSSL/0.9.8q\n\
    \        * DAV/2 PHP/5.3.8\n        * pChart application found: `http://10.0.2.104/pChart2.1.3/index.php`\n\
    \            * Exploit found\n            ![](images/ent.jpg) pChart 2.1.3 - Multiple\
    \ Vulnerabilitie | `exploits/php/webapps/31173.txt`\n    * 8080/tcp http\n   \
    \     * Apache httpd 2.2.21\n            * User-agent required: ‘Mozilla/4.0 Mozilla4_browser’\n\
    \        * mod_ssl/2.2.21\n        * OpenSSL/0.9.8q\n        * DAV/2 PHP/5.3.8\n\
    \        * PhpTax application found: `http://10.0.2.104:8080/phptax/`\n      \
    \      * Exploits found\n            ![](images/ent.jpg) PhpTax - 'pfilez' Execution\
    \ Remote Cod | `exploits/php/webapps/21833.rb`\n            ![](images/ent.jpg)\
    \ PhpTax 0.8 - File Manipulation 'newval | `exploits/php/webapps/25849.txt`\n\
