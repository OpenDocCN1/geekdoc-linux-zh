    \n        *   Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n\
    \n    *   WordPress 5.2.3\n\n        *   XMLRPC was enabled which could lead to\
    \ security issues\n\n        *   User absozed found\n\n*   3306/tcp mysql\n\n\
    *   8000/tcp http\n\n    *   nginx 1.14.0\n\n    *   .bash* files found suggesting\
    \ that the web root might be user’s home directory\n\n        *   Docker container\
    \ was built by a system user and /api directory was added to the PATH variable.\n\
    \n    *   API http://10.0.2.6:8000/test.php which executes a python script keywords.py\
    \ for producing word count.\n\n        *   API is vulnerable to command injection\
    \ using symbols ; | and %0a\n\n# [Conclusion](#toc.xhtml_s124a)\n\nThis chapter\
    \ covered the tools and techniques used to find vulnerabilities on the target\
    \ system. We performed hands-on exercises to find known vulnerabilities in services,\
    \ bypassing user-agent filtering, bypassing file upload filters, creating web\
    \ shells, fuzzing web services and parameters, and so on. The next chapter will\
    \ focus on exploiting the vulnerabilities identified and obtaining shell access\
    \ on each of the target hosts.\n\n# [Questions](#toc.xhtml_s125a)\n\n1.  Where\
