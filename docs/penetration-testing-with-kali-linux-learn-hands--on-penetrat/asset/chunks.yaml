    Though the job of a pen tester is to simulate how an attacker would perform their
    duties, you must stay within the boundaries set aside as a testing scope even
    though may be very enticing to find flaws, run exploits to compromise and take
    over the targets, Do not do anything that you have not been explicitly authorized
    to carry out, it is important to keep in mind that oftentimes the tests are being
    run on production systems and any negligent behaviour of behalf of the tester
    may cause real world impact.


    Always ensure that the rules of engagement are agreed upon by the parties before
    each test or as a framework if it’s an internal team, and under no circumstances
    are those to be broken.


    ## Don’t be infrequent in testing schedule or perform testing solely to meet compliance
    requirements:


    Organizations often follow a practice of performing testing only once or twice
    in a year.


    It’s done because they solely intend to meet compliance requirements set forth
    by the organizational policies or regulatory requirements. If you perform tests
    occasionally then it might be quite possible that your tests may not be able to
    adequately cover all potential security weaknesses. Though meeting compliance
    is very important to maintain, but at no stage can this be the only reason to
    perform penetration tests.


    Remember, attackers do not have to adhere to any compliance requirements to attack
    the target systems, so why should an organization limit themselves to compliance
    requirements? The primary driver of a penetration testing should always be to
    uncover security flaws and weaknesses and fix them before they are targeted by
    attackers, and not just because you have to maintain compliance and satisfy the
    auditors. Infrequent or irregular tests also do not provide any visibility to
    the actual situation, as the test results are only valid at the time of testing,
    and only reflect the snapshot of the security state at the time of testing and
    cannot show what could go wrong in between. This approach often allows gaps to
    exist in the environment between tests unless you are looking for them continuously.


    ## Usage of unauthorized tools and scripts:


    Most of us as penetration testers have access to many free, opensource and commercial
    tools for our jobs. We also have access to many custom developed scripts or tools
    by other researchers, though these tools or scripts may be good and makes the
    job as a tester easier, it is extremely important for us to make sure that we
    make sure what these tools actually do. What is the intended outcome from those
    tools, and they align with our rules of engagement? You should not use any tools,
    scripts, commands without fully understanding it and its impact. You might end
    up taking down the system unknowingly or unintentionally. Be absolutely sure what
    tools you are using and those are tested, verified and authorized by your organization
    or client. In case the client or your organization is not able to validate those
    tools in some cases due to lack of experience or knowledge, then you as a tester
    should be professional enough to do that verification on your own and make sure
    to use the right set of tools. Professionalism as a penetration tester is always
    paramount.


