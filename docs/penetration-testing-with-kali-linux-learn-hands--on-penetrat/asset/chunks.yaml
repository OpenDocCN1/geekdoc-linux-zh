    \n**Figure 9.19:** sudo command failed\n\nThe command for `sudo` listing returned\
    \ a blank response and checking the presence of `sudo` binary using `whereis`\
    \ confirmed that it was missing from the target.\n\nWe will have to find other\
    \ means to escalate our privileges, we will start by finding all SUID binaries\
    \ on the target which automatically run with administrative privileges upon execution.\
    \ We will use the `find` command given below for this:\n\n```bash\nfind / -perm\
    \ -4000 2>/dev/null\n```\n\n![](images/Figure-9.20.jpg)\n\n**Figure 9.20:** Finding\
    \ SUID binaries\n\nThe output of `find` command came up with a list of binaries\
    \ with SUID privileges, all the binaries shown in the list except the `tail` command\
    \ are required to perform administrative activities on the user’s behalf like\
    \ changing user’s shell, password, mount and unmount filesystems.\n\nThe `tail`\
    \ command is used to display the last 10 lines of a text file; we should be able\
    \ to abuse the SUID functionality to read sensitive system files.\n\nThe 10-line\
    \ limit may present a problem so we will change the limit using the `-n` flag\
    \ and read the `/etc/shadow` file.\n\n```bash\ntail -n 100 /etc/shadow\n```\n\n\
