    以下是列表中突出的几个文件和目录名：


    ```

    -rwxrwxrwx  1 patrick      0 Jan  9  2019 haha

    d---------  2 root  root       4096 Jan  9  2019 script

    -rw-r--r--  1 patrick patrick      0 Jan  6  2019 Sun

    -rw-r--r--  1 patrick patrick      0 Jan  6  2019 .txt

    -rw-r--r--  1 patrick patrick    407 Jan 27  2019 version_control

    ```


    ### 分析


    已经排除了 Desktop、Documents、Downloads、`.config`、`.gnupg` 等属于家目录一部分的标准用户文件目录。


    ![](img/Figure-6.10.jpg)


    **图 6.10：** ‘reminder’文件的内容


    `reminder` 文件除了提示我们系统加固可能存在问题外，没有包含任何其他有用信息。


    浏览 FTP 服务上的剩余文件没有获得更多信息，因此我们现在将继续枚举其他服务。


    ### HTTP 服务


    让我们开始枚举在目标主机上运行的 HTTP 服务。访问 URL `http://10.0.2.15` 显示网站上存在一个名为 ‘ossec’ 的目录。


    ![](img/Figure-6.11.jpg)


    **图 6.11：** 在端口 80 上运行的 HTTP 服务


    打开该目录显示了一个 OSSEC WebUI 应用程序。


    ![](img/Figure-6.12.jpg)


    **图 6.12：** ossec 目录落地页


    关于（about）部分告诉我们该应用程序是 OSSEC-HIDS 项目的开源 Web 界面。


    通过对基础 URL `http://10.0.2.15/` 和 `http://10.0.2.15/ossec` 目录运行 `dirb` 扫描来枚举 HTTP
    服务。


    打开终端，使用命令 `dirb http://10.0.2.15 -r` 和 `http://10.0.2.15/ossec -r` 对 ossec 应用进行非递归扫描。


    ![](img/Figure-6.13.jpg)


    **图 6.13：** dirb 非递归扫描


    上面的截图展示了 `dirb` 对目标 `/ossec` 目录的扫描结果，扫描发现了一些与 ossec 应用相关的通用文件和目录。


    ### SMB 协议


    我们现在对在目标主机上运行的 SMB 端口（139/tcp, 445/tcp 和 137 udp）进行枚举。这些端口是 netbios 服务的一部分，用于共享网络上的文件、打印机、串口端口和其他资源。


    我们将使用一个名为 `enum4linux` 的工具来枚举目标主机，并枚举如主机名、域名、操作系统详情、用户列表、用户组、密码策略等细节。


    打开终端并输入命令 `enum4linux 10.0.2.15` 执行扫描。


    ![](img/Figure-6.14.jpg)


    **图 6.14：** 枚举 SMB 协议


    查看 `enum4linux` 扫描结果并熟悉工具的输出。


    扫描结果中的重要条目如下：


    - **Version（版本）：** Samba 4.5.16-Debian

    - **Domain（域）：** JOY

    - **Users（用户）：** patrick, ftp


    到目前为止，我们对目标系统上的用户有了很好的了解，并有了用户 patrick 家目录下的文件列表。


    ### SNMP 服务


    让我们继续枚举我们在目标 UDP 端口 161 上发现的 SNMP 服务。


    SNMP 代表简单网络管理协议（Simple Network Management Protocol），是一种广泛用于收集和组织 TCP/IP 网络上管理设备信息的协议。SNMP
    Agent 以变量的形式共享管理数据，这些数据组织成层次结构，被称为管理信息库（`MIBs`）。SNMP 使用具有不同访问权限的团体字符串来建立管理器与代理之间的信任。常见的团体字符串名称有
    public（通常为只读）和 private（通常为读写）。


    打开终端并输入命令执行扫描：


    ```

    snmpwalk 10.0.2.15 -v 1 -c public

    ```


    `-v` 标志指定使用的 SNMP 协议版本，`-c` 标志设置扫描期间使用的团体字符串。


    ![](img/Figure-6.15.jpg)


    **图 6.15：** SNMP 枚举


    来自 snmpwalk 工具输出的截图。


    从已安装软件包中收集到的少量细节：


    - **Linux Distribution（Linux 发行版）：** Debian 9

    - **Kernel version（内核版本）：** vmlinuz-4.9.0-8-amd64

    - Apache2 包版本 2.4.25-3

    - Dovecot 包版本 1:2.2.27-3

    - Postfix 包版本 3.1.8-0

    - Samba 包版本 4.5.16

    - Snmpd 包版本 5.7.3


    服务（services）部分显示了一个关于运行在端口 36969 上的 TFTP 服务器的奇特条目，该端口在我们的默认 UDP 端口扫描中没有出现过，这是因为该端口不在
    `nmap` 使用的前 1000 个 UDP 端口列表中。该服务器似乎映射到了用户 patrick 的家目录。


    ![](img/Figure-6.16.jpg)


    **图 6.16：** SNMP 枚举显示 UDP 端口 36969 上运行着 TFTP 服务器


    我们现在将使用此 TFTP 服务从我们之前识别的 patrick 家目录中下载文件。


    使用终端通过命令 `tftp 10.0.2.15` 连接到 TFTP 服务器，并执行 `tftp 10.0.2.15 -r get haha`、`tftp
    10.0.2.15 -r get Sun`、`tftp 10.0.2.15 -r get .txt` 和 `tftp 10.0.2.15 -r get version_control`。


    ### Kioptrix:5


    我们之前识别了目标端口 80 和 8080 上运行的两个 Apache Web 实例，我们将进一步枚举这些服务以查找上面任何重要的文件或目录。


    从停栏打开 Firefox 浏览器并访问 `http://10.0.2.104`


    ![](img/Figure-6.18.jpg)


    **图 6.18：** HTTP 服务落地页


    访问 URL `http://10.0.2.104` 显示了一个标准的 Apache 占位页。让我们通过运行 `dirb` 扫描来进一步枚举服务，以寻找其他文件和目录。


    打开终端，使用以下命令对 Apache 服务器运行 `dirb` 扫描：


    ```

    dirb http://10.0.2.104

    ```


    ![](img/Figure-6.19.jpg)


    **图 6.19：** 使用 dirb 扫描 HTTP 服务


