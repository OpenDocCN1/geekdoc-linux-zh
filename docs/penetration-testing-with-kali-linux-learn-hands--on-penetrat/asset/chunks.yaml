- fmt: '

    During active information gathering an active connection is established with the
    target system/s in order to gather deeper information. In this scenario you will
    be able to gain the information that will directly help in identifying and analyzing
    the target security. You may choose to perform activities like Port scanning,
    Email header analysis (if you have received any emails from target) or you may
    try to probe the email server with the email addresses gathered from passive information
    gathering and analyze the response you receive from the servers (basically looking
    for a response back from the server, you might get a bounce response if the email
    is delivered). One other technique is to try DNS Zone transfer, just in case the
    external name servers are misconfigured and allow the internal DNS information
    to leak out. Zone transfer files will have some critical information, like Start
    of Authority Record (`SOA`), `SOA` holds information about any changes made to
    the DNS servers, like a host is modified, added or deleted. `Name Server` (`NS`),
    Address Record or `A` record, and also `MX` Record (which specifies mail exchange
    server).


    # Historical Information


    This is a sub phase of information gathering, after planning phase, if you are
    an internal team, and have already performed regular penetration testing on our
    own network, say on a monthly or quarterly basis, then in that case you might
    already have some privileged information from previous scans and planning. This
    may include information about the target IP subnet, Applications that need to
    be tested, network related information and many other areas. In an enterprise
    environment, when an internal team is going to perform a regular penetration testing,
    they have the advantage of using any previous scan results and flaws that they
    found, as the network does not undergo massive changes over a short period of
    time. Your past knowledge about the systems and applications may lead to findings
    those are similar to the previous ones, which would then be a living proof that
    the fixes are not implemented. These repeated findings can help you force your
    teams to remediate faster. Or on the other hand the remediation team will try
    to fix it in first attempt as they will be aware that the team will scan in and
    find in the next iterative. Once again creativity on how to use the past and historical
    information will be crucial for the greater success of the internal penetration
    testing.


    **Note:** In both the scenarios of information gathering, it will lead to Reconnaissance
    phase.


    # Phase 4: Reconnaissance


    Once enough and satisfactory information is gathered in through active and passive
    info-gathering methods, then before performing penetration test, it is extremely
    important to give proper attention to reconnaissance phase and its activities.
    The information that will be collected during this phase will be very useful while
    performing the next phases in penetration testing like, during enumeration and
    exploitation phases. Reconnaissance can be very interesting at times as there
    is no limit what you can discover, and how deep you can discover, information
    and data found may simply lead to system exploitation bypassing the need for enumeration.
    But on the contrary it’s always a best practice to perform complete reconnaissance
    activities, find all the required data and then proceed towards the next phases
    via enumeration towards exploitation, rather than directly jumping into exploitation
    if anything lucrative information found. That way it is easy to ensure that you
    have covered all possible angles which can be used to gain control of the systems,
    and discovered all possible flaws, not just overlooked them by taking a shortcut.
    More information you can gather, much easier and smooth the penetration testing
    would be.


    The information that you are collecting would also depend on the target systems
    or infrastructure or in cases the organization itself, as the nature of the data
    collected will also differ, just to explain it a bit further, if you are assessing
    an HR application, that is web based, then it will be helpful if you can identify
    the type of server it is running from, ports open for the application, all the
    other services running and then find what vulnerabilities those may have, from
    server, service, or application point of view. There are many tools are your disposal
    to perform these testes and reconnaissance activities. The major activities that
    is performed during this phase are as follows:


    *   Discover the network range and live IP addresses, active machines on those
    addresses, Map the network if possible

    *   Scan for open ports and running services on those live machines

    *   One important activity is OS Fingerprinting, to accurately guess the OS being
    used on the active machines with help of tools and techniques at your disposal


    Few tools that we will focus during the lab session in this book are as follows:


    *   `NMap`

    *   `arp-scan`

    *   `Netdiscover`

    *   `netcat`


    **Note:** These tools are already part of the standard Kali Linux distribution.


    # Phase 5: Enumeration


    The enumeration phase is where the information gathered from the previous activities
    and from reconnaissance phase will be used to further the tests and gain more
    and more deep information about the target, and also a step forward to the exploitation
    and gaining access to the target systems.


    This phase involves a detailed technical activity to assess the network and its
    IT resources such as, gaining more detailed network related information to build
    a network topology of the target environment. Similar to other phases, there are
    specific and purpose-built tools are used to discover deep technical information
    about the live hosts, and its networks of the environment under test.


    While mapping the network and its assets the target is to discover all live hosts
    and its OS, network switches and firewalls, security detection and monitoring
    systems like IDS and IPS, application servers and running services. Acquiring
    this detailed information will allow to perform targeted vulnerability assessment
    to find specific vulnerabilities which can be exploited for further gaining access
    to the systems. In this phase the tester can try to identify valid user accounts,
    open resource shares, poorly configured servers or applications to gain direct
    access, web application flaws like remote file inclusions to gain direct access
    to the application server.


    Some of the activities during enumeration may involve:


    *   Gathering AD information and targeting week or vulnerable user accounts, for
    example, accounts with default passwords

    *   Enumerating NetBIOS name by using `NBTscan` tool

    *   Performing SNMP enumeration

    *   Connecting with network shares by leveraging null sessions


    Various types of enumeration performed by testers:


    *   Finding our running applications banners to identify the service or application
    version

    *   Network Resource and shares

    *   Network Users, Security and user Groups

    *   Identify machine and host names

    *   SNMP Walk


    Apart from above, the techniques used in this phase may include extracting information
    by using default password found, applying brute force on active directory to find
    relevant information related to users, groups and group policies, you can also
    use SNMP to discover network users. Some of the key enumeration activities could
    be service and port identification of common ports like following:


    *   `TCP 53`: DNS Zone transfer

    *   `TCP 135`: Microsoft RPC

    *   `TCP 137`: NetBIOS Name Service

    *   `TCP 139`: SMB over NetBIOS

    *   `TCP 445`: SMB over TCP

    *   `UDP 161`: SNMP

    *   `TCP/UDP 389`: LDAP

    *   `TCP 3389`: RDP Service (remote desktop)

    *   `TCP 25`: Simple Mail Transfer Protocol (SMTP)

    *   `TCP 80`: Web Service

    *   `TCP 8080`: Proxy services

    *   `TCP 443`: SSL

