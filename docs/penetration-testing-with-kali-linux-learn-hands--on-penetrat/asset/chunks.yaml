    # [Project details](#toc.xhtml_s155a)


    ClientCorp intends to safeguard its cyber assets against accidental or deliberate
    attempts to access or compromise sensitive information.


    In line with ClientCorp’s vision to continuously improve its Information Security
    posture, 2 critical systems belonging to ClientCorp were identified for Penetration
    Testing.


    The exercise was carried with an objective to identify the security vulnerabilities
    in the targets identified in the scope of work and simulate the true impact by
    simulating a real-world hacker attack by exploiting the weaknesses identified.


