    \ and scroll through the output using the arrow keys.\n\n![](images/Figure-7.4.jpg)\n\
    \n**Figure 7.4:** contents of mbox file\n\nYou will notice a lot of emails from\
    \ **`root@dc-7`** generated by *Cron Daemon* which is a typical task scheduling\
    \ service for **`*nix`** system.\n\nThe contents of the email tell us that the\
    \ Cron scheduler executed **`/opt/scripts/backup.sh`** script and that the dump\
    \ of the database was stored to **`/home/dc7user/backups/website.sql`**\n\nLet’s\
    \ take a look at the **`backup.sh`** script permissions to check if we can modify\
    \ it.\n\n![](images/Figure-7.5.jpg)\n\n**Figure 7.5:** backup.sh file permissions\n\
    \nThe script is owned by root user and the group access is limited to www-data\
    \ other users on the system do not have write permission on the file. This means\
    \ that we will not be able to edit the backup script.\n\nWe do have read access\
    \ to the file so let’s check the contents of the script by running the command\
    \ **`cat /opt/scripts/backup.sh`** from the terminal.\n\n![](images/Figure-7.6.jpg)\n\
    \n**Figure 7.6:** backup.sh file contents\n\nExamination of the contents of the\
    \ backup script tells us that the script is being used to backup the contents\
    \ of **`/var/www/html`** and sql database to **`/home/dc7user/backups`**. We can\
    \ see that drush is being used for taking sql database backup and also that the\
    \ **`website.sql`** and **`website.tar.gz`** files are encrypted using gpg using\
    \ a passphrase **PickYourOwnPassword**\n\nA quick web search for drush reveals\
    \ that it is a command line tool for performing administrative tasks on Drupal\
    \ based websites. This functionality includes functionality of resetting password\
    \ for users.\n\n**[https://www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password](https://www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password)**\n\
    \nLet’s change the current directory in the terminal to **`/var/www/html`** and\
    \ run the command **`drush upwd --password=”admin123” admin`** to change the current\
    \ password for the admin user to **`admin123`**.\n\n![](images/Figure-7.7.jpg)\n\
    \n**Figure 7.7:** changing Drupal admin password using Drush\n\nThe admin password\
    \ for Drupal site was successfully changed to ‘**`admin123`**’. We should now\
    \ have full control on the Drupal website.\n\nWe now need to focus on leveraging\
    \ the Drupal admin access to obtain shell access on the target system, for this\
    \ to happen we need to create a PHP script or find a way to upload and execute\
    \ a php script target system.\n\nA bit of information gathering on the internet\
    \ reveals that PHP code functionality is provided by a Drupal module named ‘php’\
    \ which has been removed from Drupal versions 8.x and above.\n\nInterestingly\
    \ Drush provides a way to enable modules so let’s re-enable this module using\
    \ the command **`drush en php`** from the terminal and press ‘y’ when prompted\
    \ to confirm the download.\n\n![](images/Figure-7.8.jpg)\n\n**Figure 7.8:** Drupal\
    \ of PHP module download failed using Drush due to lack of write permissions\n\
    \nThe download failed, looks like the dc7user does not have write permissions\
    \ to the **`/var/www/html/directory`**. The earlier approach did not work however\
    \ we should still be able to install the module by accessing our Drupal installation\
    \ through browser.\n\nUsing the firefox browser download the php module to our\
    \ Kali system from **[https://www.drupal.org/project/php](https://www.drupal.org/project/php)**.\n\
    \nLogin to the target Drupal installation using the admin credentials, click on\
    \ ‘**`Extend`**’ and then on ‘**`+install new module`**’ button. Browse to the\
    \ **`php-8.x-1.0.tar.gz`** module and upload it to the Drupal site by clicking\
    \ on the ‘**`Install`**’ button.\n\n![](images/Figure-7.9.jpg)\n\n**Figure 7.9:**\
    \ uploading the PHP module\n\nOnce this step is complete you will be presented\
    \ with a message that the module was installed successfully, click on ‘**`enable\
    \ newly added modules`**’ link in message or browse to the **`http://10.0.2.27/admin/modules`**\
    \ page.\n\nScroll through the modules list to find the ‘PHP Filter’ module, click\
    \ on the checkbox next to the module, and then click on the ‘**`Install`**’ button\
    \ to enable it.\n\n![](images/Figure-7.10.jpg)\n\n**Figure 7.10:** php module\
    \ has been enabled\n\nThe ‘PHP Filter’ module has been enabled on the target;\
    \ we should now be able to upload custom PHP scripts on Drupal in order to obtain\
    \ a reverse shell access.\n\nWith the ground work now complete, we will conclude\
    \ the research phase for the DC7 machine and exploit the loophole in the next\
    \ chapter.\n\nTake notes on the observations made so far, and we will continue\
    \ with this machine in the next chapter.\n\n**Observation Notes:**\n\n**IP address:**\
    \ 10.0.2.27\n\n**Operating System:** Linux (Debian 10 based)\n\n**Open Ports &\
    \ Services:**\n\n*   22/tcp - SSH\n\n    *   OpenSSH 7.4p1 (gathered from service\
    \ banner)\n\n    *   SSH allows login for dc7user using the credentials found\
    \ on GitHub page.\n\n    *   Bash script /opt/scripts/backup.sh used to backup\
    \ website and sql database.\n\n    *   Cron is being used to run the backup.sh\
    \ script periodically.\n\n    *   Drush is being used to administer Drupal\n\n\
    *   80/tcp - HTTP\n\n    *   Apache 2.4.25 (gathered from service banner)\n\n\
    \        *   Found robots.txt\n\n    *   Drupal 8 (gathered from page source)\n\
    \n        *   Admin password changed to ‘admin123’\n\n        *   PHP Filter module\
    \ was uploaded and enabled to allow custom PHP code execution.\n\n    *   Internet\
    \ handle @DC7user on the main page\n\n        *   Google search of the handle\
    \ revealed Twitter and GitHub accounts.\n\n        *   Found source-code and credentials\
    \ ‘dc7user and ‘MdR3xOgB7#dW’\n\n# [Digitalworld.local:Joy](#toc.xhtml_s119a)\n\
    \nWe had left off the last chapter after downloading four files (**`haha`**, **`Sun`**,\
    \ **`.txt`** and **`version_control`**) from user Patrick’s home directory.\n\n\
    Read the downloaded files one by one to see if we find something useful by using\
    \ the **`cat <filename>`** command in the terminal.\n\n![](images/Figure-7.11.jpg)\n\
    \n**Figure 7.11:** contents of version_control\n\nThe contents of the **`version_control`**\
    \ file indicate to us that it may be internal notes shared between server administrators.\
    \ The file gives us valuable information on the version numbers of Apache, Dropbear\
    \ SSH, Proftpd, and Samba services.\n\nYou will also notice comments stating that\
    \ the default webroot directory has been changed to **`/var/www/tryingharderisjoy`**\
    \ and that the admin may be learning bash scripting suggesting the possibility\
    \ of finding vulnerable shell scripts on the target system.\n\nUsing the information\
    \ found in **`version_control`** document and service enumeration phase, we now\
    \ have a master list of package versions for the external facing services running\
    \ on the target machine:\n\nApache2 package version 2.4.25-3\n\nProFTPD version\
    \ 1.3.5\n\nDropbear SSH version 0.34\n\nDovecot package version 1:2.2.27-3\n\n\
    Postfix package version 3.1.8-0\n\nSamba package version 4.5.16\n\nSnmpd package\
    \ version 5.7.3\n\nAt this moment you may use this information to find out if\
    \ there are any known weaknesses in the versions of packages that we identified\
    \ on the remote target."
