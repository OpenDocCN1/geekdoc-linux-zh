    \ -X .php,.py\n```\n\n![](images/Figure-6.52.jpg)\n\n**Figure 6.52:** Scanning\
    \ HTTP port 8000 for PHP and Python files\n\nThe `dirb` command found 2 files\
    \ `test.php` and `keywords.py`. Access the files using a browser or `curl`.\n\n\
    ![](images/Figure-6.53.jpg)\n\n**Figure 6.53:** Message on test.php page\n\nBrowsing\
    \ to `test.php` using Firefox shows us the test API page with a message “Please\
    \ POST a proper query. ex: `https://caffeinatedengineers.com`” message. The page\
    \ is expecting a URL as an input for processing our request.\n\nBrowse to `http://10.0.2.6:8000/keywords.py`\
    \ using Firefox browser, and open the file in a text editor.\n\n![](images/Figure-6.54.jpg)\n\
    \n**Figure 6.54:** keywords.py source code\n\nGoing through the source code tells\
    \ us that this script accepts URL as an input using the `--query` flag. The script\
    \ crawls the URL specified and creates a list of words and the number of times\
    \ each word is used.\n\nLet’s go back to the `test.php` page and use the target’s\
    \ WordPress site URL to check whether the keywords script is executed in the background.\n\
    \nUse Firefox to open the URL `http://10.0.2.6:8000/test.php?query=http://10.0.2.6/wordpress`.\n\
    \n![](images/Figure-6.55.jpg)\n\n**Figure 6.55:** test.php query failed using\
