    \ Which webserver vulnerability allows the attacker to view files outside the\
    \ webroot?\n\n3.  Which is a command injection vulnerability?\n\n# [CHAPTER 8](#toc.xhtml_c08)\n\
    \n# [Exploitation](#toc.xhtml_c08)\n\nIn *[Chapter 7, Vulnerability Research](#c07.xhtml)*\
