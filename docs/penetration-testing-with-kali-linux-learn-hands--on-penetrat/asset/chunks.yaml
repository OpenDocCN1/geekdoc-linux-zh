    \ resulted in one match:\n\n**`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`**\n\
    \nSearch for pyftpdlib, OpenSSH and MySQL did not produce any meaningful exploit\
    \ or shellcode results for the versions installed on the target host.\n\nThe enumeration\
    \ of smb service revealed two users (matt and nightfall) on the target system,\
    \ we were later able to bruteforce the password for user matt as cheese using\
    \ the ftp protocol. The credentials were tried on the SSH service however login\
    \ was denied.\n\nLogging in to the FTP service with credentials of user ‘**`matt`**’\
    \ gave us access to the user’s home directory. We will attempt to leverage the\
    \ FTP access to gain shell access on the remote system.\n\nOpen up a terminal\
    \ and run the **`ssh-keygen`** command, and accept the default choices provided.\n\
    \n![](images/Figure-7.32.jpg)\n\n**Figure 7.32:** Generating rsa public/private\
    \ keys using ssh-keygen\n\nThe public key has been generated and stored in **`/root/.ssh/id_rsa.pub`**.\n\
    \nNext step is to copy the **`id_rsa`** key to the current working directory using\
    \ command:\n\n**`cp /root/.ssh/id_rsa.pub ./authorized_keys`**\n\n![](images/Figure-7.33.jpg)\n\
    \n**Figure 7.33:** Copying SSH public key\n\nWe have the **`authorized_keys`**\
    \ file in place.\n\nOpen a ftp connection to the target system using command **`ftp\
    \ <target ip>`** and login into the service as matt.\n\n![](images/Figure-7.34.jpg)\n\
    \n**Figure 7.34:** connecting to user matt’s FTP account\n\nCreate a **`.ssh`**\
    \ directory using mkdir **`.ssh`** command, enter the directory using **`cd .ssh`**\
    \ and upload the key using the put **`authorized_keys`** command.\n\n![](images/Figure-7.35.jpg)\n\
    \n**Figure 7.35:** Uploading the public key\n\nThe public key has been uploaded\
    \ to the target system; you can terminate the ftp session by entering the ‘**`bye`**’\
    \ command.\n\nTake notes on the observations made so far, and we will continue\
    \ with this machine in the next chapter.\n\n**Observation Notes:**\n\n**IP address:**\
    \ 10.0.2.5\n\n**Operating System:** Debian Linux\n\n**Open Ports & Services:**\n\
    \n*   21/tcp ftp\n\n    *   pyftpdlib 1.5.5\n\n    *   User:mattPassword:cheese\
    \ (via bruteforce attack using hydra)\n\n    *   Uploaded authorized_keys to .ssh\
    \ folder inside user matt’s home directory\n\n*   22/tcp ssh\n\n    *   OpenSSH\
    \ 7.9p1 Debian 10 (protocol 2.0)\n\n    *   Login denied for user matt\n\n*  \
    \ 80/tcp http\n\n    *   Apache httpd 2.4.38 ((Debian))\n\n    *   Exploit found\n\
    \n        *   Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \n*   139/tcp netbios-ssn\n\n    *   Samba smbd 3.X - 4.X (workgroup: WORKGROUP)\n\
    \n    *   Found users: matt, nightfall\n\n*   445/tcp netbios-ssn\n\n    *   Samba\
