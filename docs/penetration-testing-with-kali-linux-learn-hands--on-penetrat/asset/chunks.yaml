    This book is meant for anyone who would like to improve their skills of penetration
    testing for an enterprise environment. As it follows use case based step-by-step
    methodical approach, anyone with a basic knowledge of penetration testing can
    learn effectively by following these techniques for their own enterprise security
    testing.


    In this book, security experts and researchers, Pranav Joshi and Deepayan Chanda
    explain you the skills, procedures and techniques that every penetration tester
    needs. Deploying a virtual machine lab Including `Kali Linux` and vulnerable operating
    system test machines, you will be able to follow through a variety of practical
    use cases with tools like `Nmap`, vulnerability scanners and `Burp Suite`.


    You will begin by setting up a penetration testing lab consisting of a `Kali`
    framework and `Linux` based target machine, which will serve as a platform to
    learn and practice your penetration testing skills. You will then learn about
    the fundamental stages of the penetration testing process. As you go further,
    you will explore the phases of penetration testing in-depth such as planning,
    reconnaissance, OS fingerprinting, service identification, vulnerability detection,
    exploitation, staging and privilege escalation while simultaneously learning about
    the relevant tools and their usage to find the best approach depending on the
    scenario you are currently facing. You will also learn to interpret and correlate
    the output of multiple tools so that you have a rock-solid foundation to build
    upon. Finally, you will learn to wrap-up with a concise documentation of all the
    activities done during testing in a crisp report which can be delivered to the
    stakeholders. During the lab sessions that you will follow through the chapters
    and launch various attacks, you will learn the essential stages and process of
    an actual testing, which includes information gathering, exploitation of found
    vulnerabilities, gaining access to systems and maintaining access, and some post
    exploitation scenarios. Finally, you will learn to generate a valuable report,
    as nothing is ever complete if there is no proper documentation.


    The penetration testing processes and custom methodologies in this book will provide
    you with the knowledge and techniques that will assist you to deliver successful
    tests for your organizations. The step-by-step instructions provided about information
    gathering will guide you to gather the required level of information about the
    targets that you are going to test. The phases like exploitation and post-exploitation
    use cases will teach you about the tools needed to perform the assessment. In
    each chapter, you will find the issues that you may face while doing pentest to
    provide a real-world situation to sharpen and perfect your penetration testing
    abilities. In this book, you will read about a new penetration testing methodology
    explaining a real enterprise scenario for an internal professional security testing
    team.


    ## Over the 10 chapters in this book, you will learn the following:


    ### Chapter 1 - The Basics of Penetration Testing](#c01.xhtml)

    This chapter will explain about the basics of penetration testing and then dive
    into setting up of `Kali Linux` environment for security testing with the aim
    to provide the learners with a vast array of latest ethical hacking tools and
    enable them to perform hands-on simulations using a virtual lab environment.


    ### Chapter 2 Penetration Testing Lab](#c02.xhtml)

    This chapter will help you in setting up of target environments to be used by
    the researchers to practice their hacking skills using `Kali Linux`.


    ### Chapter 3 - Finding your way around Kali Linux](#c03.xhtml)

    This chapter will help in making the learners comfortable with the newly setup
    `Kali` environment and helping them familiarize themselves, navigate and perform
    basic tasks such as booting, starting and stopping services, etc.


    ### Chapter 4 - Understanding the PT process stages](#c04.xhtml)

    This chapter will provide the audience an introduction to various stages of penetration
    testing process methodology.


    ### Chapter 5 - Planning and reconnaissance](#c05.xhtml)

    This chapter will help to understand the scope of penetration testing and perform
    active and passive reconnaissance against target machines to gain valuable insights
    about the target systems.


    ### Chapter 6 - Service enumeration and scanning](#c06.xhtml)

    The focus of this chapter will be to use the intelligence gathered in the reconnaissance
    stage to further enumerate and scan the target system for existence of security
    issues.


    ### Chapter 7 - Vulnerability Research](#c07.xhtml)

    In this chapter, you will understand how the insight gathered about the target
    vulnerabilities can be further refined to find exploit codes using in-built tools
    and online resources dedicated to vulnerability research.


    ### Chapter 8 - Exploitation](#c08.xhtml)

    In this chapter, you will put all the knowledge to the test by exploiting security
    weaknesses identified in the system, gain access and work your way to obtain privileged
    access to the target system.


    ### Chapter 9 - Post Exploitation](#c09.xhtml)

    This chapter will delve into the subject of post exploitation. The activities
    performed in this phase will leverage upon the initial access obtained on the
    target systems and information gained about them during the previous chapters
    to completely take over the target systems by obtaining administrative access
    on them.


    ### Chapter 10 - Reporting](#c10.xhtml)

    In this chapter, you will understand the basics of what constitutes a good penetration
    testing report and create a sample report using the data and evidence gathered
    during testing.


