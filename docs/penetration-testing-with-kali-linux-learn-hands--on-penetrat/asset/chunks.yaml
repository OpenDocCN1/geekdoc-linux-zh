    So far, we have covered the basics of penetration test, and the terminology used
    in the industry. We also created a virtual lab environment to serve as a platform
    where we can safely learn and practice our skills. Moving ahead this chapter we
    will teach you to maneuver around the newly installed Kali Linux, and get familiarized
    with the tools and techniques available on the Kali linux distribution, and how
    to use them effectively.


    # Structure


    In this chapter we will touch upon the following areas:


    * Overview of Kali linux.

    * Basic account and system administration.

    * Package Management.

    * System operation

    * Shell scripting


    # Objectives


    After reading this chapter you will be able to:


    * Navigate through the interface and learn useful commands.

    * Perform system administration related tasks.

    * Install, update and remove packages.

    * Understand shell scripting concepts.

    * Automate and simplify complex tasks using shell scripting.


    Let’s boot up the Kali Linux virtual machine that was installed in Oracle VM VirtuaBox
    Manager. Select the Kali Linux VM in the left pane, then select the `Machine`
    menu followed by `Start` option. Select `Normal Start` to run the Kali VM. You
    should notice that the Kali Linux VM booting sequence has started. Continue to
    login into the system with username `root` and password `toor` (or username kali
    and password kali if you are using a later version of kali). If the VM is installed
    using a dvd image then you will be asked to supply an alternate password during
    the installation process, in that case you would need to login with the password
    supplied.


    ![](images/Figure-3.1.jpg)


    **Figure 3.1:** Kali graphical desktop environment


    To the left of the desktop is the ‘Dock’ which houses shortcuts for a few popular
    applications to help quick launch of most used applications. The shortcuts in
    the dock can be easily customized by the user by dragging and dropping shortcuts
    from the `Show Applications` icon which can be found at the bottom of the dock.
    The top of the interface is divided in few parts, left side is the drop down `Applications`
    menu which is collection of various applications available in Kali Linux, the
    applications are further divided into various categories (for example, Information
    Gathering, Vulnerability Analysis, and so on.) this is done to for easy identification
    of tools used in various phases of penetration testing. Do spend some time going
    through all the categories to become familiar with the list of tools available
    in Kali Linux. Towards the immediate right side of the `Applications` menu is
    the `Places` menu which contains links to common user directories such as current
    user’s home, desktop and few other items. The right side of the panel contains
    the user menu which contains icons for configuring sound, network connectivity,
    battery along with user settings, lock screen and shutdown menu.


    # Changing the default password


    The password for the root user can be changed by using the `passwd` command, upon
    running the `passwd` command you will be asked to enter the new password twice,
    the new password will be updated in the system, and the change will take effect
    on your next login.


    ![](images/Figure-3.2.jpg)


    **Figure 3.2:** Kali terminal


    Just as a reminder please keep in mind that default passwords are a serious security
    risk, and a major reason of compromise, these should always be changed.


    # Changing time zone


    The time zone set by default in Kali Linux is in UTC, this can be changed by clicking
    on the user menu to the right of the panel. Click on the current user `root` and
    then click on `Account Settings` this will open up a new settings window, navigate
    to `Date and Time` settings, configure these to match your time zone, date and
    time.


    ![](images/Figure-3.3.jpg)


    **Figure 3.3:** Package configuration of tzdata


    An alternate way to change these settings through command line is by typing the
    command `dpkg-reconfigure tzdata` as root and changing the settings as and when
    prompted.


    # Command Help


    A point to bear in mind while using any *nix based platform is that most of the
    interaction with the system is through the command line, and each software command
    has a variety of input options and sub options. It is quite common for users to
    forget the command syntax, and options due to the large number of tools available
    in Kali Linux.


    To solve this issue, packages on Linux distributions ship with their help files
    which are known as man page which is short for manual pages. These man pages can
    be accessed by typing the command `man <command name>`.


    ![](images/Figure-3.4.jpg)


    **Figure 3.4:** Manual page of the nmap command


    Screengrab of man nmap command, the man page showcases the options available within
    nmap and their usage.


    # Installing, removing, and updating packages


    Kali comes with a lot of hacking tools and supporting packages however in some
    situations there might be a need to install additional tools or libraries which
    may not be a part of the standard Kali build. Missing library errors are commonly
    encountered while compiling binaries or executing perl or python scripts with
    a new package.


    There are multiple ways to install packages in Kali Linux of which the most common
    and easiest method is to use the set of default package management tools called
    `apt` which is an acronym for ‘advanced packaging tool’, the tool maintains a
    local database of software which are available on Kali Linux software repositories.


    The most commonly used apt command options for package management are given as
    follows:


    ## apt search <search-string>


    Search option in apt is used for finding packages by name or type, this option
    provides a list of packages available within the repository matching the search
    criteria, this is particularly helpful when the exact package names aren’t available.


    ![](images/Figure-3.5.jpg)


    **Figure 3.5:** Searching for packages using apt


    Search for package containing keyword `screenshot` using command `apt search screenshot`
    provides a list of packages matching the search criteria.


    ## apt show <package name>


    Show option in apt with supplied with a suitable package name lists all information
    available regarding the package, the details include information on the package
    version, author, installation size, dependencies on other packages, and detailed
    description of the package.


    ![](images/Figure-3.6.jpg)


    **Figure 3.6:** Details of gnome-screenshot package


    Example showing details of the gnome-screenshot package using the command `apt
    show gnome-screenshot`


    ## apt install <package name>


    This is used for installing packages, upon issuing this command the apt package
    manager will provide a list of all dependencies which need to be satisfied for
    the given package along with the space required for installation ask for confirmation,
    if a confirmation is given by the user the package manager will go ahead and install
    the package along with all the dependencies required for the package.


    ![](images/Figure-3.7.jpg)


    **Figure 3.7:** Installing gnome-screenshot package


    Install the `gnome-screenshot` package using the command `apt install gnome-screenshot`
    the apt package management tool will automatically identify all the dependencies
    and ask for user confirmation after providing a list of packages which need to
    be installed along with the disk space required.


    ## apt remove <package name>

    '
