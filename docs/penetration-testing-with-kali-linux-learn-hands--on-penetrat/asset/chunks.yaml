    \ 对于渗透测试人员来说是一个功能非常强大的工具，因为它具有多种功能，可以利用于渗透测试的几乎所有阶段。\n\n为了加速扫描过程，使用 `-w` 标志配合\
    \ `-z` 标志（零 I/O 模式，专门用于扫描目的）将超时窗口缩短为 `1` 秒。`-n` 标志阻止 `netcat` 执行反向域名解析，`-v` 标志则指示\
    \ `netcat` 生成详细输出。\n\n```\nroot@kali:~# for port in $(seq 1 1024); do nc -w 1\
    \ -z -nv 10.0.2.27 $port 2>&1 | grep open; done\n(UNKNOWN) [10.0.2.27] 22 (ssh)\
    \ open\n(UNKNOWN) [10.0.2.27] 80 (http) open\nroot@kali:~#\n```\n\n端口扫描命令在目标系统上发现了总共\
    \ 2 个开放端口，让我们进一步探测它们以找到运行在开放端口后的服务。\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5：** 使用\
    \ `netcat` 命令探测服务\n\n`Netcat <IP port>` 命令的输出显示了运行在目标系统上的 SSH 服务横幅（banner）信息。SSH\
    \ 服务横幅显示它是 `OpenSSH` 版本 `7.4p1`，进一步的信息表明目标是一个运行基于 `Debian 10` 发行版的 Linux 系统。\n\
    \n使用相同的方法，让我们看看使用 `netcat` 可以发现哪些关于 HTTP 服务的信息。\n\n![](img/Figure-5.6.jpg)\n\n\
    **图 5.6：** 使用 `netcat` 获取横幅\n\n`Netcat <IP port>` 命令后跟垃圾输入会导致 HTTP 服务显示错误页面。查看\
    \ HTTP 响应可以发现运行在端口 80 上的 HTTP 服务是版本 `2.4.25` 的 Apache 服务器。该 Web 服务器似乎配置不当，因为我们在服务器的响应页面中注意到回环\
    \ IP 地址 `127.0.1.1`。\n\n让我们看看是否可以通过 firefox 浏览器查看运行在端口 80 上的网站来进一步枚举此服务。\n\n![](img/Figure-5.7.jpg)\n\
    \n**图 5.7：** DC-7 落地网页\n\n使用 Firefox 浏览 DC7 HTTP 服务会弹出一个相当简单的网站，似乎纯粹是为了提供有关夺旗赛（CTF）挑战的一些提示。首先，该挑战的技术性并不高，其次是要跳出框架思考。\n\
    \n网页底部显示该网站正在使用 `Drupal`，这是一个用 `PHP` 语言编写的开源内容管理框架。页面的最后一行是 `@DC7USER`，它是本地 `Drupal`\
    \ 账户用户名，或者是某种在线账户标识。\n\n让我们探索网页源代码，看看是否能从中找到任何用的东西。在查看 DC7 网页时，在 firefox 浏览器中按\
    \ `Ctrl+U` 打开页面源码。\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8：** DC-7 页面源码\n\n页面源码显示目标系统上运行着\
    \ `Drupal` 的 `8` 版本，但除此之外没有太多发现。\n\n让我们看看是否可以通过 Google 搜索找到关于 `@DC7USER` 的信息。\n\
    \n![](img/Figure-5.9.jpg)\n\n**图 5.9：** `@DC7USER` 的 Google 搜索结果\n\nGoogle 搜索在\
    \ Github 和 Twitter 上带来了一些有趣的条目。\n\n记录目前为止的观察结果，我们将在下一章继续这台机器。\n\n**观察笔记：**\n\n\
    - **IP 地址：** `10.0.2.27`\n- **操作系统：** Linux (基于 Debian 10)\n- **开放端口与服务：**\n \
    \   - 22/tcp - SSH: OpenSSH `7.4p1`（从服务横幅获取）\n    - 80/tcp - HTTP: Apache `2.4.25`（从服务横幅获取）\n\
    \    - `Drupal 8`（从页面源码获取）\n    - 主页上的互联网标识 `@DC7user`\n    - Google 搜索该标识显示了\
    \ Twitter 和 Github 账号。\n\n# Digitalworld.local:Joy\n\n![](img/Figure-5.10.jpg)\n\
    \n**图 5.10：** Joy 登录界面\n\n实验室中的下一个目标是‘Joy’，它的控制台显示了一个图形登录界面，其中高亮了用户名 `patrick`。\n\
    \n在实验中，我们将使用 Kali Linux 提供的一些工具对网络目标进行侦察，像上一个目标一样，我们将首先对实验室网络进行 ping 扫描，并识别分配给目标机器的\
    \ IP 地址。\n\n我们将使用 `Nmap` 工具对网络进行 ping 扫描，该工具用于目标系统的网络发现、指纹识别和基础安全审计。\n\n![](img/Figure-5.11.jpg)\n\
    \n**图 5.11：** 使用 `nmap` 对网络进行 ping 扫描\n\n上方截图显示的 `nmap -sP <range of IPs >` 命令通过向指定范围内的每个\
    \ IP 地址发送一系列 ping 请求（ICMP 回显）执行 ping 扫描。响应请求的 IP 地址将显示出来。在截图中可以看到 Joy 机器的 IP 地址\
    \ `10.0.2.15` 及其端口。\n\n![](img/Figure-5.12.jpg)\n\n**图 5.12：** 使用 `map` 对网络进行\
    \ ping 扫描\n"
