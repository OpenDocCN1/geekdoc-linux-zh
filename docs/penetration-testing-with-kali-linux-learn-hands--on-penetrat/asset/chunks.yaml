    ![](img/Figure-6.48.jpg)


    **图 6.48:** MySQL 连接错误


    在此时此刻，我们无法对 `MySQLport` 做太多事情，因为从我们的机器被拒绝了到该端口的连接。


    让我们继续枚举其他 HTTP 端口 8000。


    从程序坞（dock）中打开 Firefox 浏览器并浏览到 `http://10.0.2.6:8000`。


    ![](img/Figure-6.49.jpg)


    **图 6.49:** HTTP 端口 8000 上的落地页


    访问端口 8000 后，我们在页面上看到一个“API Coming Here Soon!”（API 即将上线！）的消息。让我们进一步枚举此端口，以寻找可能作为潜在切入点的隐藏文件和目录。


    打开终端并使用以下命令对 apa 服务器运行 `dirb` 扫描：


    ```bash

    dirb http://10.0.2.6:8000 /usr/share/wordlists/dirb/big.txt

    ```


    ![](img/Figure-6.50.jpg)


    **图 6.50:** 使用 big.txt 字典文件对 HTTP 端口 8000 进行 dirb 扫描


    `dirb` 的结果显示了 `.bash_history` 和 `.bashrc` 文件，这表明我们可能在某些用户的家目录下。


    使用 `curl` 或 Firefox 浏览器访问我们在目标主机上发现的 `.bash_history` 和 `.bashrc` 文件。


    ![](img/Figure-6.51.jpg)


    **图 6.51:** .bash_history 文件内容


    `.bash_history` 和 `.bashrc` 文件的内容显示用户在系统上构建了一个 docker 容器，并且 `/api` 目录已被添加到系统路径。


    我们仍然没有进入此服务器上测试 API 的切入点。我们必须使用 `-X` 标志进一步枚举此服务，并搜索扩展名为 `.php` 和 `.py` 文件。


    ```bash

    dirb http://10.0.2.6:8000 /usr/share/wordlists/dirb/big.txt -X .php,.py

    ```


    ![](img/Figure-6.52.jpg)


    **图 6.52:** 扫描 HTTP 端口 8000 的 PHP 和 Python 文件


    `dirb` 命令发现了两个文件 `test.php` 和 `keywords.py`。使用浏览器或 `curl` 访问这些文件。


    ![](img/Figure-6.53.jpg)


    **图 6.53:** test.php 页面上的消息


    使用 Firefox 浏览 `test.php` 显示了测试 API 页面，上面有一条“Please POST a proper query. ex: `https://caffeinatedengineers.com`”（请
    POST 正确的查询。例如）消息。页面期望接收 URL 作为输入来处理我们的请求。


    使用 Firefox 浏览器访问 `http://10.0.2.6:8000/keywords.py`，用文本编辑器打开该文件。


    ![](img/Figure-6.54.jpg)


    **图 6.54:** keywords.py 源代码


    通过源码我们知道该脚本使用 `--query` 标志接受 URL 作为输入。脚本会爬取指定的 URL 并创建一个单词列表以及每个单词被使用的次数。


    回到 `test.php` 页面并使用目标的 WordPress 站点 URL 来检查关键词脚本是否在后台执行。


    使用 Firefox 打开 URL `http://10.0.2.6:8000/test.php?query=http://10.0.2.6/wordpress`。


    ![](img/Figure-6.55.jpg)


    **图 6.55:** 使用 GET 方法查询 test.php 失败


    我们通过浏览器发送的请求显示我们需要使用 `-X` 标志并搜索扩展名为 `.php` 和 `.py` 的文件来进一步枚举此服务。

