    * mod_ssl version 2.2.1\n* OpenSSL version 0.9.8q\n* PHP version 5.3.8\n* pChart\
    \ version 2.1.3\n\nOpen the terminal window and issue `searchsploit <software-name><version>`\
    \ command one by one on the list of packages given as follows:\n\n![](images/Figure-7.15.jpg)\n\
    \n**Figure 7.15:** list of Apache 2.2.21\n\nThe search for vulnerabilities using\
