    \ | exploits/linux/remote/40136.py\n        *   OpenSSHd 7.2p2 - Username Enumeration\
    \  | exploits/linux/remote/40113.txt\n*   8000/tcp HTTP\n    *   Apache httpd\
    \ 2.4.25\n    *   发现漏洞\n        *   Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \        *   Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n\
    \    *   WordPress 5.0.3\n    *   发现漏洞\n        *   WordPress Plugin Quick Page/Post\
    \ Redir | exploits/php/webapps/32867.txt\n    *   http-robots.txt: 2 条禁止条\n  \
    \      *   /upload.php\n            ![](img/ent.jpg) 源代码可用 [`github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php`](https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php)\n\
    \            ![](img/ent1.jpg) 允许 GIF 和 PNG 文件，上传的文件被重命名为 md5-hash(filename +\
    \ 随机数 1-100).ext 并存储在 /uploads 目录。\n            ![](img/ent1.jpg) 带有 GIF89a 标签的\
    \ Basic webshell cmd.php 已上传到服务器。\n            ![](img/ent1.jpg) Web 服务器以用户 www-data\
    \ 的权限运行。\n*   /uploads\n\n# Sunset:Nightfall\n\n在在前一阶段执行的服务枚举为我们提供了目标机器上运行的服务版本，服务列表及其对应的版本号列如下：\n\
    \npyftpdlib 版本 1.5.5\n\nOpenSSH 版本 7.9p1\n\nApache2 软件包版本 2.4.38\n\nMySQL 软件包版本\
    \ 5.5.5-10.3.15-MariaDB-1\n\n打开终端窗口，并对上方提供的软件包列表依次执行 `searchsploit <software-name><version>`\
    \ 命令。\n\n![](img/Figure-7.31.jpg)\n\n**图 7.31：** Apache 2.4.38 漏洞列表\n\n在 searchsploit\
    \ 上搜索 Apache 2.4.38 得到了一个匹配项：\n\n`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    \n对 pyftpdlib、OpenSSH 和 MySQL 的搜索没有针对目标主机上安装的版本产生任何有意义的漏洞或 shellcode 结果。\n\nSMB\
    \ 服务枚举揭示了目标系统上的两个用户（matt 和 nightfall），我们后来能够通过 FTP 协议破解用户 matt 的密码为 cheese。这些凭据在\
    \ SSH 服务上进行了尝试，但登录被拒绝了。\n\n使用用户 `matt` 的凭据登录 FTP 服务为我们提供了用户主目录的权限。我们将尝试利用 FTP\
    \ 访问来获取远程系统的 shell 访问。\n\n打开终端并运行 `ssh-keygen` 命令，并接受提供的默认选项。\n\n![](img/Figure-7.32.jpg)\n\
    \n**图 7.32：** 使用 ssh-keygen 生成 rsa 公钥\n\n公钥已生成并存储在 `/root/.ssh/id_rsa.pub`。\n\n\
    下一步是将 `id_rsa` 密钥拷贝到当前工作目录：`cp /root/.ssh/id_rsa.pub ./authorized_keys`\n\n![](img/Figure-7.33.jpg)\n\
    \n**图 7.33：** 拷贝 SSH 公钥\n\n使用 `ftp <target ip>` 命令连接目标系统并以 matt 登录。\n\n![](img/Figure-7.34.jpg)\n\
    \n**图 7.34：** 连接 matt 的 FTP 账户\n\n使用 `mkdir .ssh` 创建 .ssh 目录，使用 `cd .ssh` 进入目录并\
    \ `put authorized_keys` 命令上传密钥。\n\n![](img/Figure-7.35.jpg)\n\n**图 7.35：** 上传公钥\n\
    \n公钥已上传到目标系统；你可以通过 `bye` 命令终止 ftp 会话。\n\n对目前观察到的结果进行记录，我们将在下一章继续这台机器。\n\n**观察笔记：**\n\
    \n**IP 地址：** 10.0.2.5\n\n**操作系统：** Debian Linux\n\n**开放端口与服务：**\n\n*   21/tcp\
    \ ftp\n    *   pyftpdlib 1.5.5\n    *   通过 hydra 攻击获得:mattPassword:cheese\n  \
    \  *   将 authorized_keys 上传到 matt 用户的文件夹\n*   22/tcp ssh\n    *   OpenSSH 7.9p1\
    \ Debian 10 (protocol 2.0)\n    *   matt 登录拒绝\n*   80/tcp http\n    *   Apache\
    \ httpd 2.4.38\n    *   发现漏洞\n        *   Apache 2.4.17 < 2.4.38 - 'apache2ctl\
    \ g | exploits/linux/local/46676.php\n*   139/tcp netbios\n    *   Samba smbd\
    \ 3.X (workgroup: WORKGROUP)\n*   445/tcp netbios\n    *   Samba smbd 3.X (workgroup:\
    \ WORKGROUP)\n    *   matt, nightfall\n*   3306/tcp mysql\n    *   MySQL 5.5.5-10.3.15-MariaDB-1\n\
    \    *   matt 登录拒绝\n*   137/udp netbios\n    *   Samba nmbd (workgroup: WORKGROUP)\n\
    *   5353/udp mdns\n    *   基于 DNS 的服务\n\n# Mumbai\n\n对目标机的 http 服务的枚举显示了 80 端口有一个\
    \ WordPress 站点，以及一些内部文件和一个在 8000 端口运行的 API。FTP 服务的枚举揭示了管理员之间的内部通信，表明该服务器过去存在安全问题。\n\
    \nvsftpd 版本 3.0.3\n\nOpenSSH 版本 7.6p1\n\nApache 版本 2.4.29\n\nWordPress 版本 5.2.3\n\
    \nMySQL\n\nnginx 版本 1.14.0\n\n"
- fmt: "\nLet’s begin by fuzzing the query parameter on the `test.php` page in order\
    \ to uncover any potential vulnerabilities in may have.\n\n**Tip:** You can find\
    \ the various wordlists used by the `wfuzz` tool stored in `/usr/share/wfuzz/wordlist/`\
    \ directory. Take your time to explore the various wordlists available.\n\nOpen\
    \ up a terminal window and type the following command to begin fuzzing:\n\n```bash\n\
    wfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt -d \"query=FUZZ\"\
    \ http://10.0.2.6:8000/test.php\n```\n\n![](images/Figure-7.37.jpg)\n\n**Figure\
    \ 7.37:** Fuzzing the query parameter on test.php page\n\nYou may notice that\
    \ the server responds with a lot of false positives, the common attributes to\
    \ the server responses are as follows line count = 1, word count =4 and character\
    \ count = 26, we will filter the server responses based on these counts as any\
    \ deviation from the known pattern means that the attack may have worked and the\
    \ response warrants further investigation.\n\nWe will re-run the command with\
    \ additional `--hl/hw/hc` flags to filter the server response.\n\nFor the sake\
    \ of example, we will filter the server responses using the `--hw` flag:\n\n```bash\n\
    wfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt -d \"query=FUZZ\"\
    \ --hw 4 http://10.0.2.6:8000/test.php\n```\n\n![](images/Figure-7.38.jpg)\n\n\
    **Figure 7.38:** Filtering false positive results\n\nLooks like the query parameter\
    \ in `test.php` api may vulnerable to command injection attack using symbols `;`\
    \ `|` and `%0a` which is the url-encoded representation of the ‘Enter’ key.\n\n\
    We will verify the vulnerability using the `curl` command with `-X` flag to specify\
    \ the HTTP method as POST and -d flag to specify the data to be submitted:\n\n\
    ```bash\ncurl -X 10.0.2.6:8000/test.php -X POST -d “query=;id”\n```\n\n![](images/Figure-7.39.jpg)\n\
    \n**Figure 7.39:** Executing id command using a command injection vulnerability\n\
    \nThe command injection works, we were able to execute the ‘id’ command on the\
    \ target. The server response shows that the service is running with privileges\
    \ of apiuser.\n\nTake notes on the observations made so far, and we will continue\
    \ with this machine in the next chapter.\n\n**Observation Notes:**\n\n* **IP address:**\
    \ 10.0.2.6\n* **Operating System:** Ubuntu Linux\n* **Open Ports & Services:**\n\
    \    * 21/tcp ftp\n        * `vsftpd` 3.0.3\n        * Anonymous FTP allowed,\
    \ file called Note revealed security issues\n    * 22/tcp ssh\n        * `OpenSSH`\
    \ 7.6p1 Ubuntu\n    * 80/tcp http\n        * `Apache httpd` 2.4.29\n        *\
    \ Exploits found\n            * `Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    \            * `Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n\
    \        * WordPress 5.2.3\n        * XMLRPC was enabled which could lead to security\
    \ issues\n        * User absozed found\n    * 3306/tcp mysql\n    * 8000/tcp http\n\
    \        * `nginx` 1.14.0\n        * `.bash*` files found suggesting that the\
    \ web root might be user’s home directory\n            * Docker container was\
    \ built by a system user and `/api` directory was added to the `PATH` variable.\n\
    \        * API `http://10.0.2.6:8000/test.php` which executes a python script\
    \ `keywords.py` for producing word count.\n        * API is vulnerable to command\
    \ injection using symbols `;` `|` and `%0a`\n\n# Conclusion\n\nThis chapter covered\
    \ the tools and techniques used to find vulnerabilities on the target system.\
    \ We performed hands-on exercises to find known vulnerabilities in services, bypassing\
    \ user-agent filtering, bypassing file upload filters, creating web shells, fuzzing\
    \ web services and parameters, and so on. The next chapter will focus on exploiting\
    \ the vulnerabilities identified and obtaining shell access on each of the target\
    \ hosts.\n\n# Questions\n\n1. Where is the exploit-DB archive used by the command\
    \ `searchsploit` stored?\n2. Which webserver vulnerability allows the attacker\
    \ to view files outside the webroot?\n3. Which is a command injection vulnerability?\n\
    \n# CHAPTER 8\n\n# Exploitation\n\nIn [Chapter 7, Vulnerability Research] we had\
    \ explained how important vulnerability research is during any security testing\
    \ along with familiarizing you with the tools available within Kali, and on the\
    \ internet for identifying relevant exploits available for the services running\
    \ on the target hosts.\n\nThis chapter will dive into exploitation of the target\
    \ systems using the information gathered so far along with exploits identified\
    \ during the previous chapters.\n\n# Structure\n\nIn this chapter, we will touch\
    \ upon the following topics:\n\n* Creating web-shells using php and using them\
    \ to execute commands\n* Upgrading webshells to fully interactive reverse shells\
    \ using `netcat`\n* Using the Metasploit exploitation framework\n* Manual exploitation\
    \ and reverse shell listeners\n\n# Objectives\n\nAfter reading this chapter, you\
    \ will be able to:\n* Understand the concepts of vulnerability exploitation.\n\
    * Create web-shells.\n* Bypass target restrictions.\n* Perform manual and automated\
    \ exploitation.\n\nSo let's begin with the next steps,\n\n# DC-7\n\nIn the previous\
    \ steps we logged into the target system using the dc7user’s credentials and changed\
    \ the Drupal admin user’s password to admin123 using the `Drush` utility. Additionally,\
    \ we also downloaded and enabled the ‘PHP Filter’ module on the remote Drupal\
    \ installation in order to allow us to add and execute custom PHP code on the\
    \ target system.\n\nContinuing further, now let’s attempt to leverage this extended\
    \ functionality of Drupal to obtain web-based shell access on the target. To do\
    \ this, create a page on Drupal containing the malicious PHP code.\n\nKali Linux\
    \ offers a lot of webshells under the `/usr/share/webshells` directory, for this\
    \ exercise let’s use the php based reverse shell located in `/usr/share/webshells/php/php-reverse-shell.php`.\n\
    \nOpen the `php-reverse-shell.php` file using the `cat` command or any favourite\
    \ text editor and copy the entire contents of the file onto clipboard.\n\n1. Open\
    \ up the Drupal page on the target system using Firefox browser and login with\
    \ admin and password `admin123`.\n2. Click on the `Content` option under the manage\
    \ `Manage` section.\n   ![](images/Figure-8.1.jpg)\n   **Figure 8.1:** DC7 admin\
    \ page\n3. Click on the `+Add content` button and click on the `Basic page` link\
    \ in the resulting page.\n4. Add the PHP reverse shell in the `Title` field, paste\
    \ the code for `php-reverse-shell.php` in the `Body` section and select ‘PHP code’\
    \ in the `Text format` drop-down menu.\n   ![](images/Figure-8.2.jpg)\n   **Figure\
    \ 8.2:** Creating a PHP webshell on Drupal\n\nIn the preceding screenshot, notice\
    \ the `Body` section, Modify the `$ip` and `$port` variables in the PHP code to\
    \ receive the reverse shell on our Kali system and click on the `Save` button\
    \ to save the code. In the screenshot above we have modified the value for the\
    \ `$ip` variable to 10.0.2.238 which is the IP address of our Kali system and\
    \ the `$port` variable has been set to 9876. (matching our lab environment)\n\n\
    Now open terminal and start a netcat session on Kali system and configure it to\
    \ listen for incoming sessions on port 9876. (Issue the command `nc -lvp 9876`)\n\
    \n![](images/Figure-8.3.jpg)\n\n**Figure 8.3:** Setting up a netcat listener\n"
  raw: "Let’s begin by fuzzing the query parameter on the **`test.php`** page in order\
    \ to uncover any potential vulnerabilities in may have.\n\n**Tip:** You can find\
    \ the various wordlists used by the wfuzz tool stored in the /usr/share/wfuzz/wordlist/\
    \ directory. Take your time to explore the various wordlists available.\n\nOpen\
    \ up a terminal window and type the following command to begin fuzzing:\n\n**`wfuzz\
    \ -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt -d \"query=FUZZ\" http://10.0.2.6:8000/test.php`**\n\
    \n![](images/Figure-7.37.jpg)\n\n**Figure 7.37:** Fuzzing the query parameter\
    \ on test.php page\n\nYou may notice that the server responds with a lot of false\
    \ positives, the common attributes to the server responses are as follows line\
    \ count = 1, word count =4 and character count = 26, we will filter the server\
    \ responses based on these counts as any deviation from the known pattern means\
    \ that the attack may have worked and the response warrants further investigation.\n\
    \nWe will re-run the command with additional **`--hl/hw/hc`** flags to filter\
    \ the server response.\n\nFor the sake of example, we will filter the server responses\
    \ using the **`--hw`** flag:\n\n**`wfuzz -w /usr/share/wfuzz/wordlist/Injections/All_attack.txt\
    \ -d \"query=FUZZ\" --hw 4 http://10.0.2.6:8000/test.php`**\n\n![](images/Figure-7.38.jpg)\n\
    \n**Figure 7.38:** Filtering false positive results\n\nLooks like the query parameter\
    \ in **`test.php`** api may vulnerable to command injection attack using symbols\
    \ ; | and %0a which is the url-encoded representation of the ‘*Enter*’ key.\n\n\
    We will verify the vulnerability using the curl command with **`-X`** flag to\
    \ specify the HTTP method as POST and -d flag to specify the data to be submitted:\n\
    \n**`curl -X 10.0.2.6:8000/test.php -X POST -d “query=;id”`**\n\n![](images/Figure-7.39.jpg)\n\
    \n**Figure 7.39:** Executing id command using a command injection vulnerability\n\
    \nThe command injection works, we were able to execute the ‘id’ command on the\
    \ target. The server response shows that the service is running with privileges\
    \ of apiuser.\n\nTake notes on the observations made so far, and we will continue\
    \ with this machine in the next chapter.\n\n**Observation Notes:**\n\n**IP address:**\
    \ 10.0.2.6\n\n**Operating System:** Ubuntu Linux\n\n**Open Ports & Services:**\n\
    \n*   21/tcp ftp\n\n    *   vsftpd 3.0.3\n\n    *   Anonymous FTP allowed, file\
    \ called Note revealed security issues\n\n*   22/tcp ssh\n\n    *   OpenSSH 7.6p1\
