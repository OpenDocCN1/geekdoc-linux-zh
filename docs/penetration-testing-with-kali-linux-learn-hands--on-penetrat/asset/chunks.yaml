    \ M | exploits/linux/webapps/42745.py`\n\n![](img/Figure-7.29.jpg)\n\n**图 7.29：**\
    \ WordPress 5.0.3 漏洞列表\n\n在 searchsploit 上搜索 WordPress 得到了一个与存储型 XSS 和 CSRF 组合漏洞的匹配项：\n\
    \n`WordPress Plugin Quick Page/Post Redir | exploits/php/webapps/32867.txt`\n\n\
