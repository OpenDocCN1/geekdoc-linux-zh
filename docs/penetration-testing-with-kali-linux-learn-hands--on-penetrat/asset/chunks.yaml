    # [Sunset:Nightfall]


    ![](img/Figure-5.22.jpg)


    **图 5.22：** Nightfall 启动屏幕


    在你的 Kali Linux 系统上打开终端窗口。输入命令 `netdiscover -r 10.0.2.0/24` 并等待 ARP 扫射完成。按 `Ctrl-C`
    退出 `netdiscover` 命令。


    ![](img/Figure-5.23.jpg)


    **图 5.23：** 使用 netdiscover 命令扫描活跃主机


    `netdiscover` 的输出显示 Nightfall 目标已上线并使用该 IP 地址。


    让我们对目标系统执行一次 nmap TCP-SYN 和 UDP 端口扫描，并结合激进的服务检测。`-A`（激进模式）选项在单个标志下提供了一种易于记忆的多种
    `nmap` 技术组合，`-A` 标志包含了操作系统检测（`-O`）、版本扫描（`-sV`）、脚本扫描（`-sC`）和示踪（`--traceroute`）功能。`-sS`
    代表 SYN 扫描，也称为“*半开放*”扫描。该标志指示 `Nmap` 发送一个 TCP SYN 数据包并尝试打开目标端口上的连接。如果目标是开启的，目标端口应返回
    SYN/ACK 数据包，然而 `Nmap` 并没有发送 ACK 数据包来与端口建立 TCP 连接，而是发送一个 TCP RST 数据包来断开连接。这种类型的扫描通常比
    TCP 连接扫描（`-sT`）速度更快，因为 TCP 连接是被断开而不是建立的。


    netdiscover 的输出显示 Nightfall 目标已上线并使用该 IP 地址。


    `netdiscover` 提供了被动模式的选项，在该模式下不发送任何数据包，该工具依靠嗅探网络上的 ARP 数据包来构建目标网络上的活跃主机列表，此功能对于保持不被发现至关重要的红队场景非常有帮助。


