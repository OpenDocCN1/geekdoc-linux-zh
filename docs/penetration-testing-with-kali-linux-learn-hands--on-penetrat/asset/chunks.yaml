    \n# [Conclusion](#toc.xhtml_s144a)\n\nThis chapter covered various tools techniques\
    \ used to map out the local attack surface and perform privilege escalation attacks,\
    \ vulnerabilities on the target system.\n\nWe also delved into automated and manual\
    \ techniques used in the industry to obtain administrative access on the target\
    \ hosts.\n\nThe next chapter will focus on documenting the various vulnerabilities\
    \ identified on the target hosts, risks and impact of the vulnerabilities identified,\
    \ overview of the activities performed during the penetration test along with\
    \ recommendations to fix the vulnerabilities identified.\n\n# [Questions](#toc.xhtml_s145a)\n\
    \n1.  Which flag did we use in the tail command to increase the number of lines\
    \ displayed?\n\n2.  Which flag did we use in the find command to break out of\
    \ the command and get shell access?\n\n3.  What command and flags did we use to\
    \ transfer files between Kali and Target systems?\n\n4.  Which script did we use\
    \ to perform automated local privilege escalation checks on the target?\n\n# [CHAPTER\
    \ 10](#toc.xhtml_c10)\n\n# [Reporting](#toc.xhtml_c10)\n\nIn the previous five\
    \ chapters we dealt with technical aspects of conducting a penetration test, the\
    \ process started with identifying the target systems on the network, and finally\
    \ culminated in obtaining administrative access in the previous chapter, during\
    \ our journey we learnt about various tools and techniques used in each phase\
    \ of testing.\n\nNow that the technical phases of the testing are over, we need\
    \ to learn about the crucial subject of reporting which involves documenting the\
    \ issues we identified during the previous chapters into actionable, concise and\
    \ most importantly easily understandable reports.\n\n# [Structure](#toc.xhtml_s146a)\n\
    \nThe focus of this chapter will be to break-down and explain the core constituent’s\
    \ penetration testing report thereby enabling the reader to succinctly capture\
    \ the essence of the entire penetration test into a report which contains the\
    \ following:\n\n*   Project details.\n\n*   Scope and limitations.\n\n*   Rules\
    \ of engagement.\n\n*   Details of the testing process.\n\n*   Multi-level view\
    \ of the engagement.\n\n*   High-and low-level recommendations to mitigate the\
    \ security issues identified from a strategic and tactical perspective.\n\n* \
    \  Do’s and Don’ts of Penetration testing\n\n# [Objectives](#toc.xhtml_s147a)\n\
    \nAfter reading this chapter, you will be able to:\n\n*   Understand different\
    \ stakeholders and their requirements.\n\n*   Understand the various sections\
    \ of the report.\n\n*   Create a penetration test report.\n\n*   Report walkthrough\
    \ and discussion.\n\n*   Learn few do’s and don’ts about performing penetration\
    \ testing.\n\n    So let's begin.\n\n# [Reporting](#toc.xhtml_s148a)\n\nThis phase\
    \ of a penetration test will seem a bit dry and boring to most readers however\
    \ it holds utmost importance as this is the final deliverable that will showcase\
    \ the tester’s work and justify the client’s spending towards the entire engagement.\
    \ To put that in a context any consulting engagement will only be as good as the\
    \ deliverable that comes out of it.\n\nAt the outset it is extremely crucial to\
    \ understand the broad types of stakeholders who will ultimately consume the penetration\
    \ testing report, adopting this consumer-centric approach will help us in shaping\
    \ and generating a document which satisfies their individual requirements and\
    \ provides value to them.\n\n# [The Stakeholders](#toc.xhtml_s149a)\n\nDuring\
    \ any penetration testing project, or execution, there could be multiple stakeholder\
    \ and parties involved, based on the nature, sensitiveness and business case.\
    \ It is crucial to know the rules of engagement with each one of them for a successful\
    \ execution, and get the maximum benefit out of the complete exercise. Following\
    \ are few of those key stakeholders explained:\n\n**Executive management:**\n\n\
    This audience typically consists of CXOs and members from business or vertical\
    \ department heads, the majority of which may not be technically savvy. The report\
    \ should contain a dedicated non-technical section for this audience which summarizes\
    \ the entire engagement and provides a high-level view highlighting the number\
    \ and types of weaknesses observed during the testing. The report should adopt\
    \ a risk-based approach such that the implementation of the mitigation controls\
    \ can be prioritized effectively.\n\nThe members of executive management group\
    \ have the requisite powers needed to implement broad and sweeping changes to\
    \ the security environment of the organizational policies and procedures hence,\
    \ the section designed for executive management should provide effective non-technical\
    \ strategies to mitigate the issues at a high level.\n\n**Technical Staff:**\n\
    \nThis group consists of members from various teams such as Infrastructure, Network,\
    \ Application, Development and Information Security teams who are typically responsible\
    \ for the deployment, upkeep of targets which were tested. The members of this\
    \ group also look after the implementation of the corrective actions recommended\
    \ in the penetration test report. The report should contain a dedicated technical\
    \ section which showcases every security issue found on the target systems in\
    \ detail along with the exact location of the vulnerability such as port, protocol,\
    \ service, resource location, and so on. The report should highlight the impact\
    \ of every vulnerability along with specific recommendations to address the issues\
    \ identified. Wherever applicable, the vulnerabilities should be highlighted with\
    \ appropriate screenshots detailing the attack.\n\n**Auditors and Regulatory personnel:**\n\
    \nThis set of individuals typically look after the organization’s compliance towards\
    \ the security policies and industry regulations. The core focus of this group\
    \ is to check that security tests are being performed periodically by competent\
    \ testers and as per industry standards. The report should contain a section detailing\
    \ the test scope, test limitations, testing window, timelines and detailed methodology\
    \ along with any testing framework (OSSTMM, OWASP) used during the test. The next\
    \ few pages of this chapter will showcase a sample report created by a fictitious\
    \ consulting organization called *SecTest* for another fictitious client company\
    \ named ‘*Client Corp*’, the scope of this report covers target machines Kioptrix:5\
    \ and Mumbai:1 tested by us in the previous chapters.\n\n# [Do’s and Don’ts of\
    \ Penetration Testing](#toc.xhtml_s150a)\n\nPenetration testing could be quite\
    \ a daunting task, and it’s very common to make mistakes, or even miss out on\
    \ steps, tasks. Following is a list of Do’s and Don’ts that you can keep handy\
    \ to start with; having said that, this is not the only finite list of items that\
    \ you want to follow, the list should be considered to be more of a guardrail\
