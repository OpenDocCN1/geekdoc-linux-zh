    \ netbios-ns\n\n    *   Samba nmbd netbios-ns (workgroup: WORKGROUP)\n\n*   5353/udp\
    \ mdns\n\n    *   DNS-based service discovery\n\n# [Mumbai:1](#toc.xhtml_s123a)\n\
    \nEnumeration of the http service on the target revealed a WordPress site on port\
    \ 80 along few internal files and an API running on port 8000\\. Enumeration of\
    \ the FTP service revealed internal communication between administrators suggesting\
    \ that the server has had security related issues in the past and that privilege\
    \ escalation exploits may still be present on the system.\n\nWe will start by\
    \ searching for vulnerabilities on the services and applications running on the\
    \ target machine employing the information found in the previous phases:\n\nvsftpd\
    \ version 3.0.3\n\nOpenSSH version 7.6p1\n\nApache version 2.4.29\n\nWordPress\
    \ version 5.2.3\n\nMySQL\n\nnginx version 1.14.0\n\nOpen the terminal window and\
    \ issue **`searchsploit <software-name><version>`** command one by one on the\
    \ list of packages given above.\n\n![](images/Figure-7.36.jpg)\n\n**Figure 7.36:**\
    \ List of Apache 2.4 exploits\n\nOur search for Apache 2.4 presents us with a\
    \ list of potential exploits, we can see two Apache exploits which match with\
    \ the Apache version installed on the target and may be useful to us:\n\n**`Apache\
    \ 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`**\n\n**`Apache\
    \ < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`**\n\nSearching\
    \ for vsftpd, openssh, WordPress, mysql, and nginx did not produce any meaningful\
    \ exploit or shellcode results for the versions installed on the target host.\n\
    \nWe had come across **`test.php`** and **`keywords.py`** files on the nginx web\
    \ server, the **`test.php`** contains a parameter called ‘**`query`**’ which accepts\
    \ URL as input using HTTP POST method. The **`test.php`** api executes **`keywords.py`**\
    \ file in the background to produce the word count results and display it on the\
    \ page."
