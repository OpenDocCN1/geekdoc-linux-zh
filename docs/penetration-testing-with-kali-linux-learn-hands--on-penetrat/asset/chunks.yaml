    # Shell 脚本基础


    Kali Linux 自带的默认 shell 设置为 bash，这可以通过执行命令 `echo $SHELL` 来确认。bash shell 支持脚本编写、命令替换、输出重定向等，以帮助在
    bash shell 中实现基础程度的自动化，消除了对单独语言的需求，这一 bash 特性在渗透测试尝试执行重复性任务或将多个任务链为一个任务时非常有用。


    # 命令替换


    这只是将命令的输出替换到变量中或将其作为另一个命令内部的输入的能力。


