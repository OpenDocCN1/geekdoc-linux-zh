    ## Conclusion


    In this chapter you learned about the importance of structured penetration testing
    and Simplified Penetration Testing Framework, which covered the various phases
    of a penetration test.


    During the course of this book, we will follow the same framework to go over various
    use cases and explain each of the activities with help of different popular tools
    available in Kali Linux distribution.


    The next chapter will focus on the concepts of planning phase and reconnaissance
    phases.


