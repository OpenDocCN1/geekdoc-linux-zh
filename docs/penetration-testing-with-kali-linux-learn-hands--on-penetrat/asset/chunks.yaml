    # CHAPTER 4: Understanding the PT Process and Stages


    While performing penetration testing, it is important to follow a standard process
    and proper stages. These process and stages can also be customized based on organization’s
    own experiences and needs. As the saying goes, it’s not complete unless process
    is properly followed and documented well. Same applies to the world of security
    assessments also. In this chapter, we will discuss about the following points:


    * What is the importance of following a standard industry process?

    * Determine the best PT methodology for your activities.

    * Asses what is the applicable process flow from your organizations point of view,
    basically which process makes more sense.

    * What are the different stages of penetration testing, and importance of each
    of those stages?


    # Structure


    In this chapter the focus will be to explain a penetration testing framework that
    can be applied to most of the medium and large enterprise and other small organizations,
    with internal teams, and at the same time for independent security testers who
    help other organizations to test if they do not have any internal testing team.


    * Importance of structured penetration testing

    * Penetration testing Framework


    # Objective


    After reading this chapter you will be able to:


    * Understand the importance of structured penetration testing.

    * Understand the various phases and the activities involved in them.


    # Importance of structured penetration testing


    What is learned so far is that penetration test includes a series of process and
    techniques. Many of which can be either a manual effort, scripted and/or automated,
    or even a combination of all these techniques. These are performed to execute
    tasks very similar to that of an attacker on an organization’s digital infrastructure,
    data and other IT assets, with an intent to test the security weaknesses. These
    attacks can be launched as an insider or a complete outsider like a real attack
    scenario.


    Though it may appear that Penetration testing is fairly a simple and straight
    process, but in practice one has to follow a very structured and process-oriented
    methodology. Penetration testing is extremely technical in nature and also many
    a times it will throw outputs that will be complex in nature, and the testers
    have to make use of their knowledge and skills to unpack and understand that information.
    Testers and Analysts quite commonly also face certain roadblocks while conducting
    the tests and attack simulations, like how much and what to cover in their testing
    scope, be able to measure the impact and risks associated with critical system
    failure during the test runs, how long should they keep trying the tests, and
    last but not the least, how to handle a situation if accidentally any sensitive
    data leaks out during the testing processes.


    It is highly important that process of penetration testing need a proper structure.
    And to build such a model, it is crucial to know the answers to few questions:


    * Why is penetration testing different than other kind of security testing? Like
    for example, secure code testing, stress testing, configuration and compliance
    testing, Vulnerability Assessment and testing, and so on.

    * What is the need for conducting penetration testing within the context of your
    business? (one should not conduct penetration test just because they have to fulfil
    some compliance requirements and/or clear a check box criteria for an audit item
    or query).

    * What are the risks associated in conducting penetration test, and how should
    we pre-assess them?


    The first step towards a structured penetration testing is to make sure that the
    tests are conducted by a trained, experiences and qualified and penetration tester.
    Following a pre-defined structure is necessary because penetration testing involves
    steps to exploit vulnerabilities and weaknesses of the system. Organizations can
    follow certain penetration methodologies to provide structure to their testing
    efforts, and maintain consistency during the tests.


    # Penetration testing framework


    In this chapter, we will discuss more about the simplified Penetration Testing
    Framework.


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Penetration Testing Framework


    Let’s understand this framework layer by layer. At a high level there are below
    8 Phases that can be followed during the entire cycle of penetration testing.


    * **Phase 1**: Pre engagement activities

    * **Phase 2**: Planning

    * **Phase 3**: Information gathering

    * **Phase 4**: Reconnaissance

    * **Phase 5**: Enumeration

    * **Phase 6**: Vulnerability Research

    * **Phase 7**: Exploitation

    * **Phase 8**: Reporting


    Our focus is to make sure that the penetration testing phases are logical, simple,
    easily adaptable and in case required, extensible as per the organizational need.


    # Phase 1: Pre engagement activities


    Scoping for penetration testing is the first and the crucial phase, focusing on
    scoping will assist the testers to perform their tasks with accuracy, and also
    help them plan their activities well in advance. During scoping of penetration
    testing, researchers must focus on many aspects, like the availability of tools,
    a well-defined list of devices, application or network devices, about the readiness
    and preparedness of the support and network teams, clear understanding and knowledge
    of the environment, and proper management supports.

