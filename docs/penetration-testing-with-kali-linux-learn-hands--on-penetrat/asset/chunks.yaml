    当使用运算符 `|` 进行命令链接时，原本应显示在用户屏幕上的命令输出（`STDOUT` 和 `STDERR`）将作为输入（`STDIN`）传递给下一个命令。


    详细说明之前的例子，`cuser` 变量将被设置为 `whoami` 命令的输出，此外我们将利用 `cat` 命令读取 `/etc/passwd` 文件的内容，并将其输出通过
