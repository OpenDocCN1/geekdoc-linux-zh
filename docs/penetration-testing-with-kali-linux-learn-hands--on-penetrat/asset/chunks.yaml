  trans: "\n\n## 图 6.35：使用 wget 下载文件\n\n在文件下载完成后，使用命令 `mv 1000-most-common-passwords.txt\
    \ /usr/share/wordlists/` 将密码列表文件移动到 kali 常用词汇表目录。\n\n现在我们已经准备好了用户名和密码列表，让我们使用\
    \ hydra 通过在目标的 FTP 服务上按顺序尝试我们下载的密码，对 matt 和 nightfall 的用户账户进行暴力破解。\n\n要开始对用户进行密码枚举，在终端中输入以下命令：\n\
    \n```\nhydra -L users.txt -P /usr/share/wordlists/1000-most-common-passwords.txt\
    \ ftp://10.0.2.5\n```\n\n`hydra` 工具是一个基于网络的密码破解工具，支持对网络上的多个协议进行暴力破解。`-L` 标志用于指定包含用户列表的文件，而\
    \ `-P` 标志指定包含密码列表的文件。\n\n![](img/Figure-6.36.jpg)\n\n**图 6.36:** 对 FTP 账户进行暴力破解\n\
    \n`hydra` 工具成功破解了用户 matt 的密码为 cheese。\n\n让我们尝试在终端中使用以下命令使用 matt 的凭据登录目标系统：\n\n\
    ```\nssh matt@10.0.2.5\n```\n\n![](img/Figure-6.37.jpg)\n\n**图 6.37:** 用户 matt\
    \ SSH 登录被拒绝\n\n用户 matt 使用密码 cheese 的 SSH 登录权限被拒绝。我们可以看到 SSH 服务也使用了公钥认证。然而，到目前为止，我们还没有用户\
    \ matt 的公钥，因此让我们尝试使用以下命令访问运行在端口 3306/tcp 上的 MySQL 数据库服务器：\n\n```\nmysql -u matt\
    \ -p -h 10.0.2.5.\n```\n\n`-u` 标志指定登录 MySQL 服务器时使用的用户名，`-p` 指定用于建立会话的密码，`-h` 标志指定要建立连接的主机。\n\
    \n![](img/Figure-6.38.jpg)\n\n**图 6.38:** 用户 matt MySQL 访问被拒绝\n\n当我们使用 matt 的凭据连接\
    \ MySQL 服务时，收到了一个拒绝访问的错误。\n\n使用命令 `ftp 10.0.2.5` 通过终端登录目标的 ftp 服务，并发布 `ls` 命令以获取目录列表。\n\
    \n![](img/Figure-6.39.jpg)\n\n**图 6.39:** 用户 matt 的 FTP 文件列表\n\n目录列表显示了属于用户 matt\
    \ 和组 matt 的文件，`.bash*` 文件的存在表明我们可能位于用户 matt 的家目录中。\n\n对目前为止的观察结果记录笔记，我们将在下一章继续研究这台机器。\n\
    \n**观察笔记：**\n\n* **IP 地址：** 10.0.2.5\n* **操作系统：** Debian Linux\n* **开放端口与服务：**\n\
    \    * 21/tcp ftp\n        * `pyftpdlib` 1.5.5\n        * 用户:matt 密码:cheese (通过使用\
    \ `hydra` 进行暴力破解攻击)\n    * 22/tcp ssh\n        * OpenSSH 7.9p1 Debian 10 (protocol\
    \ 2.0)\n        * 用户 matt 登录被拒绝\n    * 80/tcp http\n        * Apache httpd 2.4.38\
    \ ((Debian))\n    * 139/tcp netbios-ssn\n        * Samba smbds 3.X - 4.X (workgroup:\
    \ WORKGROUP)\n        * 发现用户: matt, nightfall\n    * 445/tcp netbios-ssn\n   \
    \     * Samba smbd 3.X - 4.X (workgroup: WORKGROUP)\n    * 3306/tcp mysql\n  \
    \      * MySQL 5.5.5-10.3.15-MariaDB-1\n        * 用户 matt 登录被拒绝\n    * 137/udp\
    \ netbios-ns\n        * Samba nmbd netbios-ns (**workgroup**: WORKGROUP)\n   \
    \ * 5353/udp mdns\n        * 基于 DNS 的服务发现\n\n# Mumbai\n\n该目标上运行着多个服务，如 FTP、SSH、HTTP\
    \ 和数据库服务器。我们将枚举这些服务，以收集关于该目标的任何重要信息。\n\n从 FTP 服务开始我们的练习。打开终端并输入命令 `ftp 10.0.2.6`，通过尝试使用“anonymous”作为用户名登录，并在密码字段中输入任何电子邮件地址来检查是否允许匿名登录。\n\
    \n![](img/Figure-6.40.jpg)\n\n**图 6.40:** FTP 匿名登录\n\n你可以看到匿名登录是被允许的，因此我们可以浏览目标\
    \ FTP 服务器上的文件和目录。在这种情况下，我们可以看到 FTP 服务器上存在名为 `Note` 的单文件。\n\n通过在 FTP 会话中发布 `get\
    \ <filename>` 命令从 FTP 服务器下载文件。你也可以使用 Firefox 建立匿名 FTP 会话，并如下屏所示查看文件内容：\n\n![](img/Figure-6.41.jpg)\n\
    \n**图 6.41:** ‘Note’ 文件的内容\n\n‘Note’ 文件的内容表明服务器过去出现过安全相关问题，并且过重建。为了应对这一点，服务器可能已迁移到\
    \ Docker 容器以作为安全措施。权限提升漏洞利用。\n\n我们将注意力转向运行在 80 端口的 Apache 服务器。\n\n使用 Firefox 访问\
    \ `http://10.0.2.6`。\n\n![](img/Figure-6.42.jpg)\n\n**图 6.42:** HTTP 登录页\n\n使用终端运行以下命令来发现可能的漏洞。使用\
    \ Firefox 访问 `http://10.0.2.6`。\n\n![](img/Figure-6.43.jpg)\n\n**图 6.43:** dirb\
    \ 扫描\n\ndirb 扫描结果显示了如 Drupal 和 WordPress 等内容管理系统。访问 `http://10.0.2.6` 显示 WordPress\
    \ 的功能即将上线。\n\n![](img/Figure-6.44.jpg)\n\n**图 6.44:** WordPress 页面\n\n我们现在使用 `wpscan`\
    \ 来枚举 WordPress，它是专门为这项任务设计的扫描器。\n\n要扫描目标系统上的 WordPress 安装，打开终端窗口并运行命令：\n\n```\n\
    wpscan --url http://10.0.2.6/wordpress\n```\n\n![](img/Figure-6.45.jpg)\n\n**图\
    \ 6.45:** WordPress 扫描器\n\n结果显示 xmlrpc 已启用，并带有几个可能出现的漏洞。结果还显示安装的 WordPress 版本为\
    \ 5.2.3。\n\n`wpscan` 工具还提供了额外的选项来进一步枚举 WordPress 安装，使用 `-e` 标志加上选项，我们将此来枚举目标主机上的\
    \ WordPress 用户。在终端中输入命令：\n\n```\nwpscan --url http://10.0.2.6/wordpress -e u\n\
    ```\n\n![](img/Figure-6.46.jpg)\n\n**图 6.46:** 在 WordPress 上识别的用户\n\n`wpscan`\
    \ 用户枚举结果发现了一个名为 absozed 的 WordPress 用户。\n\n我们现在使用以下命令对该用户的密码进行暴力破解：\n\n```\nwpscan\
    \ --url http://10.0.2.6/wordpress -U absozed -P /usr/share/wordlists/1000-most-common-passwords.txt\n\
    ```\n\n![](img/Figure-6.47.jpg)\n\n**图 6.47:** 使用 wpscan 对 WordPress 账户进行暴力破解\n\
    \n"
