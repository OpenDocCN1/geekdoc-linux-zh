    \nApache2 package version 2.2.21\n* mod_ssl version 2.2.1\n* OpenSSL version 0.9.8q\n\
    * PHP version 5.3.8\n* pChart version 2.1.3\n\n打开终端窗口，并对给出的软件包列表逐执行 `searchsploit\
    \ <software-name><version>` 命令：\n\n![](img/Figure-7.15.jpg)\n\n**图 7.15：** Apache\
