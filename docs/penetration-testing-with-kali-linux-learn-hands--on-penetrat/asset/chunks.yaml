    # 命令链和输入、输出、错误的重定向


    命令链是在单行内按顺序逐一个执行多个命令的能力，这是通过使用运算符符号（如 `;` | `&`）实现的。当使用运算符 `;` 时，每个命令在前一个命令执行完毕后执行。


    在我们上一个示例中使用的两个命令 `whoami` 和 `echo` 可以使用 `;` 运算符链在单行中，而无需单独发布每一个命令。


    ![](img/Figure-3.19.jpg)


    **图 3.19:** 使用 ; 运算符进行命令链


