  trans: "\nNetcat 也被称为渗透测试工具的“瑞士军刀”，它为测试人员提供了大量极其实用的功能，在利用本书中所涵盖的各种目标的过程中，我们将逐步探索其中的一些。在上面的示例中，我们使用\
    \ `-l` 标记设置了一个简单的监听器，`-v` 标记将 netcat 设置为详细模式，这有助于排查与连接相关的问题，最后 `-p` 标记用于设置端口。由于上面的示例在\
    \ `-l` 监听模式下使用了 `-p` 端口标记，`netcat` 命令将在端口 9876 上监听入站连接。\n\n一旦监听器成功建立，返回 Drupal\
    \ 页面并点击 `preview` 按钮，在我们的 DC7 目标机器上执行恶意 PHP 代码。\n\n![](img/Figure-8.4.jpg)\n\n\
    **图 8.4：** 运行中的反向 shell 连接\n\n太棒了！PHP 代码在目标上运行完美，你现在应该拥有对 DC7 系统具有 `www-data`\
    \ 用户权限的 shell 访问权限。\n\nDC7 目标的初始利用已经完成，我们已经获得了 `www-data` 用户的 shell 权限。在下一章中，你将学习如何利用作为\
    \ cron 任务运行的备份脚本来获取 root 权限。\n\n记录下目前观察到的结果，我们将在下一章继续处理这台机器。\n\n**观察笔记：**\n\n\
    **IP 地址：** 10.0.2.27\n\n**操作系统：** Linux（基于 Debian 10）\n\n**开放端口与服务：**\n\n*   22/tcp\
    \ - SSH\n    *   OpenSSH 7.4p1（从服务 banner 获取）\n    *   SSH 允许使用在 GitHub 页面找到的凭据登录\
    \ `dc7user`。\n    *   Bash 脚本 `/opt/scripts/backup.sh` 用于备份网站和 sql 数据库。\n    *\
    \   使用 cron 定期运行 `backup.sh` 脚本。\n    *   `backup.sh` 脚本可以被 root 用户或属于 `www-data`\
    \ 组的用户修改。\n    *   使用 Drush 管理 Drupal。\n*   80/tcp - HTTP\n    *   Apache 2.4.25（从服务\
    \ banner 获取）\n        *   发现 `robots.txt`\n        *   Drupal 8（从页面源码获取）\n   \
    \     *   管理员密码已更改为 `admin123`。\n        *   已上传并启用 PHP Filter 模块以便执行自定义 PHP 代码。\n\
    \        *   PHP 反向 shell 已上传到服务器。\n            ![](img/ent.jpg) 已建立具有 `www-data`\
    \ 用户权限的反连接。\n    *   主页上的互联网账号 `@DC7user`\n        *   通过 Google 搜索该账号发现了了 Twitter\
    \ 和 Github 账号。\n        *   发现了源代码以及凭据 `dc7user` 和 `MdR3xOgB7#dW`。\n\n# Digitalworld.local\n\
    \n在识别出 ProFTPD、Dropbear 和 Apache 服务的潜在漏洞后，我们完成了研究阶段。在本章的这一节中，我们将使用识别出的漏洞获取对 Joy\
    \ 目标机器的初始 shell 权限。\n\n上一阶段识别出的漏洞如下表所示：\n\n*   `Apache 2.4.17 < 2.4.38 - 'apache2ctl\
    \ g | exploits/linux/local/46676.php`\n*   `Apache < 2.2.34 / < 2.4.27 - OPTIONS\
    \ M | exploits/linux/webapps/42745.py`\n*   `Dropbear SSH 0.34 - Remote Code Execut\
    \ | exploits/linux/remote/387.c`\n*   `ProFTPd 1.3.5 - 'mod_copy' Command Exe\
    \ | exploits/linux/remote/37262.rb`\n*   `ProFTPd 1.3.5 - 'mod_copy' Remote Comm\
    \ | exploits/linux/remote/36803.py`\n*   `ProFTPd 1.3.5 - File Copy | exploits/linux/remote/36742.txt`\n\
    \n由 `searchsploit` 工具识别出的漏洞位于 `/usr/share/exploitdb/` 文件夹中，你需要输入完整路径才能访问这些漏洞。\n\
    \n例如，上表所示第一个漏洞的完整路径为 `/usr/share/exploitdb/exploits/linux/local/46676.php`。\n\n\
    打开终端会话，输入以下命令来检查漏洞。\n\n```\ncat /usr/share/exploitdb/exploits/linux/local/46676.php\n\
    ```\n\n![](img/Figure-8.5.jpg)\n\n**图 8.5：** 46676.php 内容\n\nApache 漏洞 `46676.php`\
    \ 的内容表明它利用了一个 CVE 标识为 2019-0211 的“权限提升”漏洞。这种漏洞类型对于获取目标系统上的提升权限非常有用。要使用此漏洞，测试人员必须已经对目标系统拥有访问权限，并且依赖测试人员在目标服务器上上传\
    \ php 文件以获得提升权限。\n\n该漏洞在当前场景中并不适用，因为我们没有系统的初始 shell 权限，但它在下一章可能会派上用场。\n\n"
- fmt: "\nThe preceding figure shows the configuration options for the proftpd exploit,\
    \ the configuration options have a unique name given in the `Name` field and can\
    \ be modified using the `set <option name>` command. Not all the options are mandatory\
    \ as suggested in the `Required` field. In case of the above exploit the required\
    \ options are `RHOSTS`, `RPORT`, `RPORT_FTP`, `SITEPATH`, `TARGETURI` and `TMPPATH`.\n\
    \nThe default values for `RPORT`, `RPORT_FTP`, `TARGETURI` and `TMPPATH` are correct\
    \ for our scenario, so we will keep them as is. The options we need to change\
    \ are `RHOSTS` and `SITEPATH`. The path for the webroot was changed to `/var/www/tryingharderisjoy`\
    \ as suggested in the `version_control` document.\n\nUse the `set` command followed\
    \ by `<option name>` and `<value>` to set the value for `RHOST` with the IP address\
    \ of the Joy target system and set `SITEPATH` to `/var/www/tryingharderisjoy`.\n\
    \n![](images/Figure-8.11.jpg)\n\n**Figure 8.11:** Setting `RHOST` and `SITEPATH`\
    \ options\n\nOnce the values have been correctly set, you can exploit the target\
    \ by issuing the `exploit` command.\n\n![](images/Figure-8.12.jpg)\n\n**Figure\
    \ 8.12:** Exploiting the ProFTPD service\n\nAt this stage you will have a basic\
    \ shell session on the Joy target system. Great stuff !!, let’s check the level\
    \ of access we have on the target using the `id` command.\n\n![](images/Figure-8.13.jpg)\n\
    \n**Figure 8.13:** 'id' command output\n\nThe `id` command output shows that we\
    \ have gained privileges of `www-data` user and `www-data` group. This user is\
    \ also a member of the ossec group.\n\n![](images/Figure-8.14.jpg)\n\n**Figure\
    \ 8.14:** directory listing of /var/www/tryingharderisjoy\n\nThe `pwd` command\
    \ tells us that we are inside `/var/www/tryingharderisjoy` directory and `ls -la`\
    \ command output shows us a `bYkz9u.php` file and the ossec directory that we\
    \ came across during the enumeration phase.\n\n![](images/Figure-8.15.jpg)\n\n\
    **Figure 8.15:** Exploring ossec directory\n\nThe directory listing of the ossec\
    \ directory shows us a lot of files and directories for the ossec application.\
    \ We can see a non-standard file named `patricksecretsofjoy`. Let’s read the content\
    \ of this file to see what it contains.\n\n![](images/Figure-8.16.jpg)\n\n**Figure\
    \ 8.16:** Contents of ossec/patricksecretsofjoy\n\nYou will notice that the file\
    \ contains two sets of credentials for patrick and root.\n\npatrick:apollo098765\n\
    \nroot:howtheheckdoiknowwhattherootpasswordis\n\nAs you may have noticed the current\
    \ shell is a very basic interactive shell and does not support TTY, we will need\
    \ to upgrade the shell to support full TTY mode in order to use `su` command needed\
    \ to elevate our privileges.\n\nRun the command within the limited shell to obtain\
    \ full TTY support.\n\n```bash\npython -c 'import pty; pty.spawn(\"/bin/sh\")`\n\
    ```\n\n![](images/Figure-8.17.jpg)\n\n**Figure 8.17:** Upgrading to an interactive\
    \ shell\n\nWe can see that the TTY support has been activated in the shell session\
    \ so we should be able to use the `su` command to elevate our access using the\
    \ credentials found above.\n\n![](images/Figure-8.18.jpg)\n\n**Figure 8.18:**\
    \ Getting into user patrick’s account\n\nThe password for the root user was invalid\
    \ however we were successful in obtaining access to patrick’s credentials.\n\n\
    Take notes on the observations made so far, and we will continue with this machine\
    \ in the next chapter.\n\n### Observation Notes:\n\n**IP address:** 10.0.2.15\n\
    \n**Operating System:** Linux (Debian 9)\n\n**Open Ports & Services:**\n\n*  \
    \ 21/tcp FTP\n    *   ProFTPD 1.3.5\n        *   Found listing of user patrick’s\
    \ home directory in `/upload/directory`.\n        *   Exploits found\n       \
    \     ![](images/ent.jpg) ProFTPd 1.3.5 - 'mod_copy' Command Exe | exploits/linux/remote/37262.rb\n\
    \            ![](images/ent.jpg) Obtained shell with www-data privileges using\
    \ metasploit.\n            ![](images/ent.jpg) Password for patrick is apollo098765\n\
    \            ![](images/ent1.jpg) ProFTPd 1.3.5 - 'mod_copy' Remote Comm | exploits/linux/remote/36803.py\n\
    \            ![](images/ent1.jpg) ProFTPd 1.3.5 - File Copy | exploits/linux/remote/36742.txt\n\
    *   22/tcp SSH\n    *   Dropbearsshd 0.34 (protocol 2.0)\n        *   Exploit\
    \ found\n            ![](images/ent.jpg) Dropbear SSH 0.34 - Remote Code Execut\
    \ | exploits/linux/remote/387.c\n*   25/tcp SMTP\n    *   Postfix smtpd package\
    \ version 3.1.8-0\n*   80/tcp HTTP\n    *   Apache httpd 2.4.25, `/ossec` directory\
    \ contains web interface for OSSEC-HIDS\n        *   Exploits found\n        \
    \    ![](images/ent.jpg) Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \            ![](images/ent1.jpg) Privilege escalation exploit\n            ![](images/ent.jpg)\
    \ Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n*\
    \   110/tcp POP3\n    *   Dovecot pop3d package version 1:2.2.27-3\n*   139/tcpnetbios-ssn\n\
    \    *   Samba smbd package version 2:4.5.16\n*   143/tcp IMAP\n    *   Dovecot\
    \ imapd package version 1:2.2.27-3\n*   445/tcpnetbios-ssn\n    *   Samba smbd\
    \ package version 2:4.5.16\n*   465/tcp SMTP\n    *   Postfix smtpd package version\
    \ 3.1.8-0\n*   587/tcp SMTP\n    *   Postfix smtpd package version 3.1.8-0\n*\
    \   993/tcpssl/imaps?\n*   995/tcpssl/pop3s?\n*   123/udpntp\n    *   NTP v4 (unsynchronized)\n\
    *   137/udpnetbios-ns\n    *   Samba nmbdnetbios-ns package version 2:4.5.16\n\
    *   161/udpsnmp\n    *   SNMPv1 server; net-snmp SNMPv3 server (public)\n*   36969/udptftp\n"
