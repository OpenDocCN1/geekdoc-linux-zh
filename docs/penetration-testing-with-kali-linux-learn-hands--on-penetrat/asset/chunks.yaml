    # 第 1 章：渗透测试基础


    渗透测试（Penetration Testing）术语通常也称为 pen-testing 或 `PT`，在行业内已存在数十年，通过成为更大型 IT 安全体系中至关重要的一部分证明了其重要性。它是一种攻击模拟练习，在此期间，安全专业人员尝试识别、枚举并攻击应用程序、基础设施、网络或任何其他
    IT 设备中的漏洞，并利用这些漏洞获取访问权限，并在组织的信息环境中建立立足点。


    此类模拟攻击的目的是确定安全实现或边界防御机制中的漏洞，这些漏洞可能会被有别动机的未授权实体所利用。


    ## 结构


    在本章中，我们将涉及以下主题：


    *   渗透测试及其类型。

    *   渗透测试的必要性和重要性。

    *   参与前的活动和阶段。

    *   安装 `VirtualBox`，设置实验室网络并导入虚拟机。


    ## 目标


    读完本章后，你将能够：


    *   概述渗透测试的基本理论和常用行业术语。

    *   理解渗透测试的类型。

    *   概述渗透测试中包含的活动。

    *   拥有一个可用的 `Kali` 配置，用于执行后续章节中所示的操作。


    ## 什么是渗透测试？


    渗透测试不要与`漏洞评估`（Vulnerability Assessment，`VA`）混淆（`VA` 限于枚举漏洞，而不深入挖掘已识别漏洞的利用），尽管
    `VA` 可能是渗透测试的前身，但它并不是绝对要求，因为渗透测试可以在需要或不需要预先执行 `VA` 的情况下进行。


    渗透测试可以有许多不同的方式，取决于项目的需求和范围，但广义上，典型的渗透测试任务始于安全专业人员收集范围内的目标信息，对目标进行探测以发现托管的服务，然后系统地检查这些服务以识别其安全弱点。随后，对识别出的弱点进行研究和评估，以分析风险评分、利用可用性、技术、可靠性和潜在影响。然后，测试人员尝试使用所选漏洞获取对范围内目标的访问。如果利用成功且攻击者能够在系统上建立立足点，安全测试人员将确定可用的访问级别，并进一步枚举系统，以尝试识别安全问题、配置弱点或敏感信息，这些信息可能帮助他们进一步提升本地或范围内任何互联目标上的访问级别。大多数阶段并不是顺序执行的，因此测试人员可能根据需要这些阶段之间来回移动。最后但同样重要的是，在整个渗透测试期间，对所有阶段的所有活动进行记录是至关重要的。这包括：扫描类型、工具命令、观察结果、初始发现、存在哪些漏洞、每个系统是如何被利用的。渗透人员要求在报告阶段提供所遵循的整个过程的详细说明以及支持性证据。


    ## 渗透测试的参与前活动


    与任何测试不同，渗透测试具有非常明确的阶段。但根据初始观察结果，测试人员和研究人员可能会通过合并或偏离通常设定的流程来开发自己的测试方法。这将取决于与客户商定的测试信息和范围。本书的重点将是介绍行业中广泛遵循的标准渗透测试流程，以测试基础设施和
    Web 应用程序资产。本书将不涵盖无线和物理渗透测试。


    **范围定义**：当您计划进行任何渗透测试活动时，测试人员与请求测试方之间定义并同意范围是非常重要的。可以定义的信息包括：执行测试的位置、IP 范围、系统细节和应用程序名称以及用于测试的
    URL。执行测试需要遵循的时间安排是什么？在上述和定义的窗口内进行测试活动非常重要，以避免关键系统出现任何意外或偶然的停机（除非客户明确说明不受任何测试时间和窗口的限制）。除了范围内的内容，在必要情况下，合同中定义范围之外的内容（暴力破解、拒绝服务攻击和攻破后的活动，如
    Shell 上传、本地漏洞评估或权限提升）也是同样重要的。


    **升级点**：您的合同中应该定义一个升级点，即在整个过程中可能发生任何事件时应联系谁。可以根据定义的渗透测试窗口遵循升级树。


    **法律条款**：在某些情况下，安全测试人员可能需要包含一些关键的法律条款，例如谁授权执行渗透测试、何时以及执行什么。特别是在被测试系统并非由要求测试的方托管的情况下。执行测试的许可必须是书面形式（纸质或数字）。以避免出现以下情况：如果客户系统检测到活动并将其标记为入侵，授权人员可以干预并破例。否则，在大多数国家，这可能被视为受法律惩罚的入侵尝试。


    ## 渗透测试的阶段


    渗透测试是一项复杂的练习，涉及多种类型的活动，包括探测、扫描、发现和研究漏洞以及获取访问权限，这些活动根据目标类型以及测试过程中获得的知识进行选择。


    在没有化方法的情况下进行测试会带来有关测试覆盖、时间管理和成本超出的各种风险。为了避免这些问题并为混乱带来秩序，该练习被拆分为不同的阶段，这允许测试人员在测试期间组织他们的思想和努力。


    下面我们将介绍一个渗透测试中包含的典型阶段：


    # 信息收集

