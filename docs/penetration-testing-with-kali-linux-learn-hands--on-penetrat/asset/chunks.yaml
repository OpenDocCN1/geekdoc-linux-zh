    *   Docker container was built by a system user and `/api` directory was added
    to the `PATH` variable.

    *   API `http://10.0.2.6:8000/test.php` which executes a python script `keywords.py`
    for producing word count.

    *   API is vulnerable to command injection using symbols `;`, `|` and `%0a`.

    *   `Netcat` did not support execution functionality.

    *   Reverse shell obtained reverse shell using command piping and input/output
    redirection.

    *   `apiuser` can run `docker` as root using `sudo`.

    *   `apiuser` is member of `docker` group.

    *   ![](images/ent.jpg) Docker vulnerability was exploited by creating a container
    and root filesystem was mounted in `/tmp/mumbai` within the container.

    *   `MySQL` accepts root login without password.


    # Conclusion


    This chapter covered various tools techniques used to map out the local attack
    surface and perform privilege escalation attacks, vulnerabilities on the target
    system.


    We also delved into automated and manual techniques used in the industry to obtain
    administrative access on the target hosts.


    The next chapter will focus on documenting the various vulnerabilities identified
    on the target hosts, risks and impact of the vulnerabilities identified, overview
    of the activities performed during the penetration test along with recommendations
    to fix the vulnerabilities identified.


    # Questions


    1. Which flag did we use in the `tail` command to increase the number of lines
    displayed?

    2. Which flag did we use in the `find` command to break out of the command and
    get shell access?

    3. What command and flags did we use to transfer files between Kali and Target
    systems?

    4. Which script did we use to perform automated local privilege escalation checks
    on the target?


    # CHAPTER 10


    # Reporting


    In the previous five chapters we dealt with technical aspects of conducting a
    penetration test, the process started with identifying the target systems on the
    network, and finally culminated in obtaining administrative access in the previous
    chapter, during our journey we learnt about various tools and techniques used
    in each phase of testing.


    Now that the technical phases of the testing are over, we need to learn about
    the crucial subject of reporting which involves documenting the issues we identified
    during the previous chapters into actionable, concise and most importantly easily
    understandable reports.


    # Structure


    The focus of this chapter will be to break-down and explain the core constituent’s
    penetration testing report thereby enabling the reader to succinctly capture the
    essence of the entire penetration test into a report which contains the following:


    *   Project details.

    *   Scope and limitations.

    *   Rules of engagement.

    *   Details of the testing process.

    *   Multi-level view of the engagement.

    *   High-and low-level recommendations to mitigate the security issues identified
    from a strategic and tactical perspective.

    *   Do’s and Don’ts of Penetration testing


    # Objectives


    After reading this chapter, you will be able to:


    *   Understand different stakeholders and their requirements.

    *   Understand the various sections of the report.

    *   Create a penetration test report.

    *   Report walkthrough and discussion.

    *   Learn few do’s and don’ts about performing penetration testing.


    So let''s begin.


    # Reporting


    This phase of a penetration test will seem a bit dry and boring to most readers
    however it holds utmost importance as this is the final deliverable that will
    showcase the tester’s work and justify the client’s spending towards the entire
    engagement. To put that in a context any consulting engagement will only be as
    good as the deliverable that comes out of it.


    At the outset it is extremely crucial to understand the broad types of stakeholders
    who will ultimately consume the penetration testing report, adopting this consumer-centric
    approach will help us in shaping and generating a document which satisfies their
    individual requirements and provides value to them.


    # The Stakeholders


    During any penetration testing project, or execution, there could be multiple
    stakeholder and parties involved, based on the nature, sensitiveness and business
    case. It is crucial to know the rules of engagement with each one of them for
    a successful execution, and get the maximum benefit out of the complete exercise.
    Following are few of those key stakeholders explained:


    **Executive management:**


    This audience typically consists of CXOs and members from business or vertical
    department heads, the majority of which may not be technically savvy. The report
    should contain a dedicated non-technical section which summarizes the entire engagement
    and provides a high level. The report should adopt a risk-based approach such
    that the implementation of controls can be prioritized.


    **Technical Staff:**


    This group consists of members from various teams such as Infrastructure, Network,
    Application, Development and Information Security teams who are typically responsible
    for the deployment, upkeep of targets. The members of this group also look after
    the corrective actions recommended in the penetration test. The report should
    contain a dedicated technical section which showcases every security issue found
    on the target in detail along with the exact location such as port, protocol,
    service, resource location, and so on. The report should highlight the impact
    of every vulnerability with specific recommendations.


    **Auditors and Regulatory personnel:**


    This set of individuals typically look after the organization’s compliance towards
    the security policies and industry regulations. The core focus of this group is
    to check that security tests are performed periodically by competent testers and
    as per industry standards. The report should contain a section detailing the test
    scope, test limitations, testing window, timelines and detailed methodology along
    with any testing framework used during the test. The next few pages of this chapter
    will showcase a sample report created by a fictitious organization called `SecTest`
    for another fictitious client named `Client Corp`, the scope of this report covers
    target machines `Kioptrix:5` and `Mumbai:1` tested by us in the previous chapters.


    # Do’s and Don’ts of Penetration Testing


    Penetration testing could be quite a daunting task, and it’s very common to make
    mistakes, or even miss out on steps, tasks. Following is a list of Do’s and Don’ts
    that you can keep handy to start with; having said that, this is not the only
    finite list of items that you want to follow, the list should be considered to
    be more of a guardrail and best practices which we recommend from our experience
    of running many penetration testing projects over the past decades.


    The list may change for every project based on the scope and limitations of the
    project hence, what may be more useful is to pick and choose the instructions
    for each of your projects.


    # Do’s


    **Always prioritize your risk factors:**

