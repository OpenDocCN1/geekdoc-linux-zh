    In the last chapter we exploited a vulnerability in the PHPTAX application to\
    \ upload a basic webshell on the Kioptrix target, we leveraged this webshell access\
    \ to send back a reverse shell connection on port 9877.\n\nLet’s open up the reverse\
    \ shell on port 9877 and start exploring the Kioptrix target.\n\n![](images/Figure-9.13.jpg)\n\
    \n**Figure 9.13:** uname –a output shows the FreeBSD release and version information\n\
    \nNotice that the output of the **`uname -a`** command gives us the exact information\
