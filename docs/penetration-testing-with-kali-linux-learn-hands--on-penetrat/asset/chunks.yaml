    3. How important is reporting phase once the penetration testing is completed?


    ## CHAPTER 5: Planning and Reconnaissance


    The focus of this chapter is to familiarize the concepts of planning a successful
    penetration test, gathering information about the targets that are in scope of
    the testing. Additionally, in this chapter we will attempt to cover the various
    tools built into Kali Linux to effectively perform reconnaissance on the target
    machines set up earlier in the chapter two of this book.


    ## Structure


    The focus of this chapter will be covering the following topics and their sub
    activities:


    * Planning a Penetration Test

    * Reconnaissance of the target machines.


    ## Objective


    After reading the chapter you will be able to:


    * Understand the various pre-engagement activities involved in planning a penetration
    test.

    * Perform hands on reconnaissance of target hosts using various tools present
    in Kali linux.


    ## Planning a penetration test


    Previous chapter explained about the penetration testing framework, as explained
    in that framework, planning the test entails the set of pre-engagement interactions
    between the testing team and the customer/internal stakeholders (if it''s an assessment
    by an internal PT team). These meetings are held to facilitate exchange of strategic
    information regarding the exact customer requirements, this helps in defining
    the exact scope of work and in aligning the engagement contract with the services
    delivered.


    The information exchanged during the interactions also helps in deriving a suitable
    tactical plan, schedule and in designing the most effective engagement contract
    and a practical test approach.


    ## Expectations


    The first step in planning is to discuss the expectations with the customer, and
    understand the context in which the penetration testing is being requested. A
    few common expectations from penetration testing are as follows:


    * Mapping the attack surface of the company’s applications, and the IT infrastructure,
    finding security issues associated with them and translating these findings to
    actual risk to the business.

    * Identifying security weaknesses, and to address the findings before they are
    found and exploited by malicious entities.

    * Understanding the effectiveness of internal security teams and processes.

    * Compliance requirements stemming from company information security policy or
    standards such as `ISO/IEC 27000`, `PCI-DSS` and other regulatory obligations.


    ## Scope of testing


    The purpose of the penetration testing is to identify the target information assets
    which will undergo testing, the location of testing (internal or external), the
    type of testing required (blackbox, greybox, whitebox) and depth of testing that
    the customer is trying to achieve.


    While performing a blackbox test, a very limited knowledge of the systems is provided
    to the tester, this will usually involve basic information such as individual
    IP addresses or ranges of the systems in case of infrastructure testing or internet
    domain names and URLs in case of application penetration testing.


    During greybox testing, it is required that the customer share more details regarding
    the systems such as operating systems, server roles, restricted user credentials,
    application parameters, and so on.


    Similarly, for a whitebox testing, in addition to the above, further access to
    application source-code, design documents, data flow diagrams, configuration files,
    user and admin credentials, and so on. should be requested.


    **Note:** It is important to understand the existing security layers implemented
    in the environment such as network and web firewalls, intrusion detection systems
    which may impact the reliability of scans and the overall speed of testing.


    ## Communication


    Success of the penetration testing depends on establishing clear communication
    between the parties, periodic schedule should be defined for exchange of progress
    updates. Additionally, dedicated channels should be established to communicate
    issues encountered by both parties during testing, it is important to understand
    the emergency contacts.


    Due to the extremely sensitive nature of the information being exchanged. It is
    wise to agree upon encrypted channels (password protected files, PGP/GPG encrypted
    emails, and so on.) for sending sensitive information.


    ## Problem escalation hierarchy


    During a penetration testing exercise, it is important to have clear escalation
    hierarchy defined in the engagement contract along with the turn-around and problem
    resolution times. This is established to ensure that any potential future issues
    arising during the course testing are promptly communicated to the right set of
    people and get addressed in a timely manner. Some common scenarios which require
    invoking escalation include:


    * Unavailability of access to target infrastructure or application.

    * Network access blocked by firewall or intrusion detection and prevention systems.

    * Test account inactivation or lockout.

    * Communication of critical vulnerabilities.

    * Approvals required for exploitation.

    * Target infrastructure or application platforms inadvertently getting knocked
    out due to testing.


    Escalation matrix also ensures that any unresolved issues get adequate management
    support before they can cause any impact to the overall project schedule.


