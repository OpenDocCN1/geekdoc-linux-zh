    # [结论]


    在本章中，我们涵盖了规划有效渗透测试所需的各种前期活动，例如范围、预期、沟通、问题升级、测试窗口和局限性等。


    在本章后续部分，我们使用了网络主机发现技术（如 ICMP/ARP 扫射）对目标进行了实战侦察，包括不同类型的端口扫描、操作系统和服务版本检测。了解开放端口、服务以及目标运行的软件版本提供了有关目标运行的有用见解，并有助于识别目标系统可能受的任何安全问题。


