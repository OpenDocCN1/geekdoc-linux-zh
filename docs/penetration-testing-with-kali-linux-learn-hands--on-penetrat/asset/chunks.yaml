    \n*   8080/tcp http\n\n    *   Apache httpd 2.2.21\n\n        ![](images/ent.jpg)\
    \ User-agent required: ‘Mozilla/4.0 Mozilla4_browser’\n\n        *   mod_ssl/2.2.21\n\
    \n        *   OpenSSL/0.9.8q\n\n        *   DAV/2 PHP/5.3.8\n\n        *   PhpTax\
    \ application found: http://10.0.2.104:8080/phptax/\n\n        *   Exploits found\n\
    \n            ![](images/ent.jpg) PhpTax - 'pfilez' Execution Remote Cod | exploits/php/webapps/21833.rb\n\
    \n            ![](images/ent.jpg) PhpTax 0.8 - File Manipulation 'newval | exploits/php/webapps/25849.txt\n\
    \n            ![](images/ent1.jpg) Web-shell uploaded at /phptax/data/rce.php\n\
