    这将允许以 `dc7user` 的身份成功登录系统。我们可以看到 SSH 登录后的消息，其中显示了 Debian 版本和内核版本，此外，你还会注意到用户收到了一封新邮件。


    让我们探索用户的主目录以获取更多关于目标系统的信息。


    ![](img/Figure-7.3.jpg)


    **图 7.3：** dc7user 主目录和备份目录的列表


    在 `dc7user` 主目录下执行 `ls -la` 命令，显示有一个名为 `mbox` 的文件和一个名为 `backups` 的目录，进一步查看备份目录可以发现两个
    gpg 文件。


    让我们使用命令 `cat mbox | less` 查看用户 mbox 文件的内容，并使用方向键滚动输出内容。


    ![](img/Figure-7.4.jpg)


    **图 7.4：** mbox 文件内容


    你会注意到有大量由 Cron Daemon 生成的来自 `root@dc-7` 的邮件，Cron 进程是 `*nix` 系统的典型任务调度服务。


    邮件内容告诉我们 Cron 调度器执行了 `/opt/scripts/backup.sh` 脚本，并且数据库转储被存储在 `/home/dc7user/backups/website.sql`。


    让我们查看 `backup.sh` 脚本的权限，检查我们是否可以修改。


    ![](img/Figure-7.5.jpg)


    **图 7.5：** backup.sh 文件权限


    该脚本由 root 用户所有，组访问限制为 www-data，系统上的其他用户对该文件没有写权限。这意味着我们无法编辑备份脚本。


    但我们对该文件拥有读取权限，因此在终端中运行命令 `cat /opt/scripts/backup.sh` 来检查脚本内容。


    ![](img/Figure-7.6.jpg)


    **图 7.6：** backup.sh 文件内容


    检查备份脚本的内容告诉我们，该脚本用于将 `/var/www/html` 的内容和 sql 数据库备份到 `/home/dc7user/backups`。我们可以看到正在使用
    drush 进行 sql 数据库备份，并且 `website.sql` 和 `website.tar.gz` 文件已使用密码 `PickYourOwnPassword`
    通过 gpg 进行了加密。


    在互联网上对 drush 进行快速搜索可以发现它是一个用于对基于 Drupal 的网站执行管理任务的命令行工具。该功能包括重置用户密码的功能。


    [`www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password`](https://www.a2hosting.in/kb/installable-applications/optimization-and-configuration/drupal2/resetting-the-drupal-administrator-password)


    让我们在终端中切换当前目录到 `/var/www/html`，并运行命令 `drush upwd --password=”admin123” admin`
    将 admin 用户的当前密码更改为 `admin123`。


    ![](img/Figure-7.7.jpg)


    **图 7.7：** 使用 Drush 修改 Drupal 密码


    Drupal 站的管理员密码已成功更改为 `admin123`。我们现在应该对 Drupal 网站拥有完全控制权。


    我们现在需要利用 Drupal admin 权限获取目标系统的 shell 访问权限，为了实现这一点，我们需要创建一个 PHP 脚本，或者找到一种在目标系统中上传并执行
    php 脚本的方法。


    在互联网上进行一些信息收集发现，PHP 代码功能是由名为“php”的 Drupal 模块提供的，该模块在 Drupal 8.x 及以上版本中已被移除。


    有趣的是，Drush 提供了一种启用模块的方法，让我们在终端中使用命令 `drush en php` 重新启用该模块，并在提示确认下载时按“y”。


    ![](img/Figure-7.8.jpg)


    **图 7.8：** 由于缺少写权限，使用 Drush 下载 Drupal PHP 模块失败


    下载失败了，看起来 dc7user 对 `/var/www/html/` 目录没有写权限。之前的方法不起作用，但我们仍然应该通过浏览器访问 Drupal 安装来安装该模块。


    使用 firefox 浏览器从 [`www.drupal.org/project/php`](https://www.drupal.org/project/php)
    将 php 模块下载到我们的 Kali 系统。


    使用管理员凭登录目标 Drupal 安装，点击 `Extend` 然后点击 `+install new module` 按钮。找到 `php-8.x-1.0.tar.gz`
    模块并点击 `Install` 按钮将其上传到 Drupal 站点。


    ![](img/Figure-7.9.jpg)


    **图 7.9：** 上传 PHP 模块


    完成此步骤后，你将看到模块成功安装的消息，点击消息中的 `enable newly added modules` 链接或访问 `http://10.0.2.27/admin/modules`
    页面。


    滚动模块列表找到“PHP Filter”模块，点击模块旁边的复选框，然后点击 `Install` 按钮。


    ![](img/Figure-7.10.jpg)


    **图 7.10：** php 模块已启用


    目标机的“PHP Filter”模块已启用；我们现在可以结束研究了。


    `version_control` 文件的内容告诉我们，这可能是服务器管理员之间共享的内部笔记。该文件提供了关于 Apache、Dropbear SSH、Proftpd
    和 Samba 服务版本的宝贵信息。


    你还会注意到注释说明默认的 webroot 目录已更改为 `/var/www/tryingharderisjoy`，管理员可能正在学习 bash 脚本，这暗示可能在目标系统中发现漏洞的
    shell 脚本。


    利用 `version_control` 文档发现的信息和服务枚举阶段的信息，我们现在拥有了目标机器上运行的外部服务的包版本主列表：


    Apache2 包版本 2.4.25-3


    ProFTPD 版本 1.3.5


    Dropbear SSH 版本 0.34


    Dovecot 包版本 1:2.2.27-3


    Postfix 包版本 3.1.8-0


    Samba 包版本 4.5.16


    Snmpd 包版本 5.7.3


    此时，你可以使用这些信息来发现在远程目标机上识别出的包版本是否存在任何已知漏洞。

