  trans: "\n我们正在使用的 shell 不是完全交互式的，因此我们无法使用像 `vim` 或 `nano` 这样的编辑器来编辑文件。由于这一局限性，如果我们选择通过这种方法处理，将需要将\
    \ shell 升级为完全交互式的 TTY，或者在 Kali 系统上下载密码或 shadow 文件，并在修改后重新上传到 Joy 目标机器。这种方法涉及直接修改核心系统文件，因此如果操作不符合预期，会对目标造成非常严重的风险。\n\
    \n幸运的是，我们有一个更好、更简单的方法，我们可以利用它来修改父目录‘script’和‘test’脚本的权限。一旦我们获得写权限，我们就可以用我们的有效负载（payload）覆盖测试脚本。\n\
    \n现在你已经有了一个可行的计划，让我们执行命令 `sudo /home/patrick/script/test` 开始行动，并将 `../script`\
