    `netdiscover` 的输出显示 HackInOS 目标已上线并使用 IP 地址 `10.0.2.4`。


    `netdiscover` 提供了被动模式的选项，在该模式下不发送任何数据包，该工具依靠嗅探网络上的 ARP 数据包来构建目标网络上的活跃主机列表，此功能对于保持不被发现至关重要的红队场景非常有帮助。


    让我们对目标系统执行一次 nmap TCP-SYN 和 UDP 端口扫描，并结合激进的服务检测。


