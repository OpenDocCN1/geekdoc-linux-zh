    Here are a few names of files and directories which stood out in the list:


    ```

    -rwxrwxrwx  1 patrick      0 Jan  9  2019 haha

    d---------  2 root  root       4096 Jan  9  2019 script

    -rw-r--r--  1 patrick patrick      0 Jan  6  2019 Sun

    -rw-r--r--  1 patrick patrick      0 Jan  6  2019 .txt

    -rw-r--r--  1 patrick patrick    407 Jan 27  2019 version_control

    ```


    ### Analysis


    Standard user files directories such as Desktop, Documents, Downloads, `.config`,
    `.gnupg,` and so on. which are a part of home directory have been excluded.


    ![](images/Figure-6.10.jpg)


    **Figure 6.10:** Contents of ‘reminder’ file


    The `reminder` file did not contain any useful information apart from giving us
    a hint that there may be an issue with the system’s hardening.


    Browsing the remaining files on the FTP service did not yield any further information
    so we will now proceed to enumerate the other services.


    ### HTTP Service


    Let’s move on to enumerate the HTTP service running on the target host. Browsing
    to the URL `http://10.0.2.15` shows us that a directory named ‘ossec’ is present
    on the website.


    ![](images/Figure-6.11.jpg)


    **Figure 6.11:** HTTP service running on port 80


    Opening the directory presents an OSSEC WebUI web application.


    ![](images/Figure-6.12.jpg)


    **Figure 6.12:** ossec directory landing page


    The about section tells us that the application is an open source web interface
    for the OSSEC-HIDS project.


    Let’s enumerate the HTTP service by running a `dirb` scan against the baseurl
    `http://10.0.2.15/` and `http://10.0.2.15/ossec` directories.


    Open up a terminal and run a non-recursive scan against the ossec application
    using commands `dirb http://10.0.2.15 -r` and `http://10.0.2.15/ossec -r`


    ![](images/Figure-6.13.jpg)


    **Figure 6.13:** dirb non recursive scanning


    Screenshot above showcases the results of `dirb` scan on `/ossec` directory of
    the target, the scan found a few generic files, and directories pertaining to
    the ossec application.


    ### SMB Protocol


    We will now perform enumeration on the SMB protocol ports (139/tcp, 445/tcp and
    137 udp) that we found running on the target host. These ports are a part of netbios
    services and are used for sharing of files, printers, serial ports and other resources
    on a network.


    We will use a tool called `enum4linux` to enumerate the target host, and enumerate
    details such as host name, domain name, operating system details, user list, user
    groups, password policy, and so on.


    Open up a terminal and type the command `enum4linux 10.0.2.15` to perform the
    scan.


    ![](images/Figure-6.14.jpg)


    **Figure 6.14:** Enumerating SMB protocol


    Go through the results of `enum4linux` scan and familiarise yourself with the
    tool output.


    Important entries from the scan results are given as follows:


    - **Version:** Samba 4.5.16-Debian

    - **Domain:** JOY

    - **Users:** patrick, ftp


    So far, we have good idea about the users on the target system and a listing of
    files in user patrick’s home directory.


    ### SNMP Service


    Let’s move forward and enumerate the SNMP service that we found running the target
    on UDP port 161.


    SNMP which stands for Simple Network Management Protocol is a widely used protocol
    for collecting and organizing information about managed devices on TCP/IP networks.
    SNMP agents share management data as variables which are organized in hierarchies
    which are known as Management Information Bases (`MIBs`). SNMP uses community
    strings with different levels of access to set trust between the managers and
    the agents. Common community strings names are public (usually read-only) and
    private (usually read-write).


    Open up a terminal and type the command to perform the scan:


    ```

    snmpwalk 10.0.2.15 -v 1 -c public

    ```


    The `-v` flag specifies the version of SNMP protocol to use while the `-c` flag
    sets the community string to be used during scanning.


    ![](images/Figure-6.15.jpg)


    **Figure 6.15:** SNMP enumeration


    Screenshot from the snmpwalk tool output.


    Few details gathered from the installed packages:


    - **Linux Distribution -** Debian 9

    - **Kernel version -** vmlinuz-4.9.0-8-amd64

    - Apache2 package version 2.4.25-3

    - Dovecot package version 1:2.2.27-3

    - Postfix package version 3.1.8-0

    - Samba package version 4.5.16

    - Snmpd package version 5.7.3


    The services section shows a curious entry regarding a tftp server running on
    port 36969 which did not show up on our default UDP port scan as this port is
    not a part of the top 1000 UDP port list used by `nmap`. The server seems to be
    mapped to user patrick’s home directory.


    ![](images/Figure-6.16.jpg)


    **Figure 6.16:** SNMP enumeration shows a TFTP server on UDP port 36969


    We will now use this TFTP service to download the files from patrick’s home directory
    that we had identified earlier.


    Using the terminal connect to the tftp server using the command `tftp 10.0.2.15`
    and issue `tftp 10.0.2.15 -r get haha`, `tftp 10.0.2.15 -r get Sun`, `tftp 10.0.2.15
    -r get .txt`, and `tftp 10.0.2.15 -r get version_control`.


    ### Kioptrix:5


    We had previously identified two instances of Apache web running on ports 80 and
    8080 of the target, we will be enumerating these services further to find any
    important files or directories on it.


    Open up the Firefox browser from the dock and browse to `http://10.0.2.104`


    ![](images/Figure-6.18.jpg)


    **Figure 6.18:** HTTP service landing page


    Browsing to the URL `http://10.0.2.104` shows a standard Apache placeholder page.
    Let’s enumerate the service further by running a `dirb` scan to find other files
    and directories.


    Open up a terminal, and run a `dirb` scan against the Apache server using the
    command:


    ```

    dirb http://10.0.2.104

    ```


    ![](images/Figure-6.19.jpg)


    **Figure 6.19:** Scanning the HTTP service using dirb

