    # 循环


    在使用 bash shell 时，有几种方法可以实现循环。为了本书的需要，我们将关注 `for 循环`，它用于在项目列表上运行一组给命令。


    在接下来的示例中，我们将创建一个简单的 `for 循环`，变量 `i` 的值设置为使用 `seq` 命令生成的 1 到 5 的值列表。循环将运行 `sleep`
    命令并将变量 `i` 的值 echo 到文件 `loop.txt` 中；循环将对 `i` 的下一个值继续运行同一组命令，直到 `i` 的值达到 5，随后循环将完成最后一次命令执行并退出。


    ![](img/Figure-3.25.jpg)


    **图 3.25:** For 循环


    如你所注意的，上面的脚本由于每次执行都增加了 1 秒的 sleep 延迟，执行了 5 秒，但 `loop.txt` 文件只显示内容为“5”。此的原因是命令在
    `for 循环` 中的执行方式。命令集（在此情况下为 `sleep` 和 `echo`）为每个 `i` 的值重新运行，且当前命令的输出每次都会覆盖文件。这种情况会一直发生直到循环结束，最后一个命令的输出覆盖
    `loop.txt` 文件。在这种情况下，有必要使用 `>>` 运算符在每次执行时追加 `loop.txt` 文件，而不是覆盖它。


    ![](img/Figure-3.26.jpg)


    **图 3.26:** for loop - 使用 `>>` 运算符向文件追加数据


    上述发出的命令结果显示了上一次运行的输出（即 5）以及当前 `for 循环` 生成的输出，它们按顺序追加到同一个文件中。


    Bash 高度依赖特殊字符来进行命令链、输入/输出重定向、进程后台化等。在某些情况下，可能需要使用 `\` 运算符对特殊字符进行转义，这样做会消除分配给它们的特殊属性，并允许
    bash 将这些字符视为普通字符。


    ![](img/Figure-3.27.jpg)


    **图 3.27:** 使用 `\` 运算符转义特殊字符


    第一个示例中的 `echo` 命令由于语法错误而失败，这是因为 bash 解释了特殊字符 `<>?()[]&|'''';,`


    第二个命令成功完成，因为使用反斜杠 `\` 字符正确地中和了所有特殊字符，允许输出回显到屏幕上。


