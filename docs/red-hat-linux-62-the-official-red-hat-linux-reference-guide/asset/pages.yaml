  md: 'Chapter 3:System Configuration


    # Please Note


    If you require a username and password for an SMB (LAN Manager) or NCP (NetWare)
    print queue, they are stored unencrypted in a local script. Thus, it is possible
    for another person to learn the username and password. It is therefore recommended
    that the username and password for use of the printer be different than that for
    a user account on the local Red Hat Linux system, so that the only security compromise
    would be unauthorized use of the printer. If there are file shares from the SMB
    server, it is recommended that they also use a different password than the one
    for the print queue.


    After you have added your print queue, you may need to restart the printer daemon
    (lpd). To do so, choose Restart lpd from the lpd menu.


