- pgno: 228
  md: '# Section 10.10:Partitioning Your Disk for Red Hat Linux


    As you scroll through the Current Disk Partitions section, you might see an Unallocated
    Requested Partitions title bar, followed by one or more partitions. These are
    partitions that have been requested, but for one reason or another, have not been
    allocated. A common reason for an unallocated partition is a lack of sufficient
    free space for the partition. In any case, the reason the partition remains unallocated
    will be displayed after the partition''s mount point.


    # 10.10.2 The Drive Summaries Section


    Each line in the Drive Summaries section represents a hard disk on your system.
    Each line has the following fields:


    +   - Drive -- Shows the hard disk''s device name.


    +   - Geom [C/H/S] -- Shows the hard disk''s geometry. The geometry consists of
    three numbers representing the number of cylinders, heads and sectors as reported
    by the hard disk.


    +   - Total -- Shows the total available space on the hard disk.


    +   - Used -- Shows how much of the hard disk''s space is currently allocated
    to partitions.


    +   - Free -- Shows how much of the hard disk''s space is still unallocated.


    +   - Bar Graph -- Presents a visual representation of the space currently used
    on the hard disk. The more pound signs there are between the square braces, the
    less free space there is. In Figure 10–15, Disk Druid Main Screen, the bar graph
    shows no free space.


    # Please Note


    The Drive Summaries section is displayed only to indicate your computer''s disk
    configuration. It is not meant to be used as a means of specifying the target
    hard drive for a given partition. This is described more completely in Section
    10.10.5, Adding a Partition.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 10.10.3 Disk Druid’s Buttons


    These buttons control Disk Druid’s actions. They are used to add and delete partitions,
    and to change partition attributes. In addition, there are buttons that are used
    to accept the changes you’ve made, or to exit Disk Druid entirely. Let’s take
    a look at each button in order.


    +   * Add -- Request a new partition. Selecting this button causes a dialog box
    to appear containing fields that must be filled in.

    * Edit -- Modify the mount point of the partition currently highlighted in the
    Current Disk Partitions section. Selecting this button will cause a dialog box
    to appear allowing you to change the name of the mount point.

    * Delete -- Delete the partition currently highlighted in the Current Disk Partitions
    section. Selecting this button will cause a dialog box to appear asking you to
    confirm the deletion.

    * OK -- Confirm changes made to your system’s partitions to be written to disk.
    You will be asked to confirm the changes before Disk Druid rewrites your hard
    disk partition table(s). In addition, any mount points you’ve defined are passed
    to the installation program, and will eventually be used by your Red Hat Linux
    system to define the filesystem layout.

    * Back -- Abort without saving changes you’ve made. When this button is selected,
    the installation program will take you back to the previous screen, so you can
    start over.


    # 10.10.4 Handy Function Keys


    Use the [F5] (Reset) key to discard all changes you may have made while in Disk
    Druid, and return the list of partitions to those read from the partition table(s)
    on your hard disk(s). When selected, you’ll be asked to confirm whether you want
    to discard the changes. Note that any mount points you’ve specified will be lost,
    and will need to be reentered.'
  merge: -1
  img_proc: true
