    # Modifying Group Membership


    There are two ways to modify the list of users that belong to a group. You can
    either update each user account itself, or you update the group definitions. In
    general, the fastest way is to update each of the group definitions. If you''re
    planning on changing more information for each user than just the group information,
    then updating each user account may prove easier.


    We''ll start by detailing the group definitions methods.


    +   - Start linuxconf at typing the shell prompt.


    +   - Open Config => Users accounts => Normal => Group definitions.


    Depending on the filter settings in Control => Features, you may see a filter
    screen. Use the filter to narrow the list, or just select Accept to bypass the
    filter.


    +   - Select the user you wish to modify. This will open the Group specification
    screen (see Figure 3–9, Group Specification Screen).


    +   - Add or remove each user from the Alternate members field. Make sure that
    all of the user names are separated by a space character.


    +   - Select Accept, which can be found at the bottom of the screen.'
