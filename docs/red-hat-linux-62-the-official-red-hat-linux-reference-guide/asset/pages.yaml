    The first line is a comment. (Any line that starts with a # character is a comment.)

    Lines through four stack three modules for login authorization. Line

    makes sure that if the user is trying to log as root, the root on which they are

    logging in is listed in the /etc/security file that exists. Three lines causes

    t user to be asked for a password and the password checked. Four checks to

    see if the /etc/login exists and if it does, displays the contents of the file,

    if the user is not root, does not let him or her in.


    Note that all three modules are checked, even if the first module fails. This
    is a security

    decision -- it is designed to prevent the user from knowing why their authentication

    was disallowed, because knowing why it was disallowed might allow them to break

    the authentication more. You can change this behavior by changing required

    to requisite; if any requisite module returns failure, PAM fails immediately without

    calling any other modules.


    The fifth line causes any necessary accounting to be done. For example, if shadow

    passwords have been enabled, pam_pwdb.so module will check to see if the

    account has expired, or if the user has not changed his password and the grace

    period for changing the password has expired.


    The sixth line subjects a newly changed password to a series of tests to ensure
    that it

    cannot, for example, be easily determined by a dictionary-based password cracking

    program.


    The seventh line (which may be wrapped) specifies that if the login program changes

    t user’s password, it should use the pam_pwdb.so module to do so. (It will do'
