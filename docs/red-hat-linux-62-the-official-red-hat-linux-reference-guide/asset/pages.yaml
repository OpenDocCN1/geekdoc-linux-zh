    However, if your root filesystem is undamaged, you can mount it and then run your
    standard Linux utility. For example, suppose your root filesystem is in /dev/hda5.
    Here''s how to mount this partition:


    ```

    mount -t ext2 /dev/hda5 /foo

    ```


    Where /foo is a directory that you have created.


    Now you can run chroot, fsck, man, and other utilities. At this point, you are
    running Linux in single-user mode.


    If you don''t know the names of your Linux partitions, you can guess: mounting
    nonexistent partitions will do no harm.


    # Booting Single-User Mode Directly


    You may be able to boot single-user mode directly. If your system boots, but does
    not allow you to log in when it has completed booting, then rebooting and specifying
    one of the options at the LILO boot prompt:


    ```

    LILO boot: linux single

    LILO boot: linux emergency

    ```


    In single-user mode, your computer boots to runlevel 1. Your local filesystems
    will be mounted but your network will not be activated. You get a usable system
    maintenance shell.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 2:System Administration


    In emergency mode, you are booted into the most minimal environment possible.
    The root filesystem will be mounted read-only and almost nothing will be set up.
    The main advantage of this linux single is that your init files are not loaded.
    If init is corrupted or not working, you can still mount filesystems to recover
    data that could be lost during a re-installation.


    # A Handy Trick


    Have you ever rebuilt a kernel, and eager to try out your new handiwork, rebooted
    before running LILO? And you didn''t have an entry for an older kernel in lilo.conf?
    Read on...


    In many cases, it is possible to boot your Red Linux/Intel system from the Red
    Hat boot disk with your root filesystem mounted and ready to go. Here’s how:


    Enter the following command at the boot disk’s: prompt:


    ```

    linux single root=/dev/hdXX initrd=

    ```


    (Replace the XX in /dev/hdXX with the appropriate letter and number for your root
    partition.)


    What does this do? First, it starts the boot in single-user mode, with the root
    partition set to your root partition. The empty initrd specification bypasses
    the installation-related image on the boot disk, which will cause you to enter
    single-user mode immediately.


    Is there a downside? Unfortunately, yes. Because the kernel on the Red Hat boot
    disk disk only has support for IDE built-in, those of you with SCSI-based systems
    won’t be able to use this trick. In that case, you’ll have to use the boot/rescue
    disk combination mentioned above.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 3 System Configuration


    One of the main strengths of Red Hat Linux is that the operating system can be
    configured to do just anything. In the past, this meant editing cryptic configuration
    files by hand, then restarting system services and crossing your fingers in the
    hope that your changes were correctly made. Additionally, the variety of configuration
    options can be bewildering to new users, who may not know where to look for a
    particular configuration file.


    Red Hat Linux provides two system configuration utilities: linuxconf and the control
    panel. The control panel provides a launcher for various Red configuration tools,
    including linuxconf. Instructions on how to use the control panel and the tools
    it includes be found in Section 3.2, System Configuration with the Control Panel.


    The linuxconf configuration tool can ease some of the burdens of system configuration.
    Linuxconf is:


    +   - A configuration interface -- You type the values needed to configure your
    system into a user interface.


    +   - A configuration activator -- When you''re satisfied with your edits, you
    tell linuxconf to apply the changes you''ve made.


    While linuxconf can do nearly everything the control panel tools can, there are
    two areas in which the control panel still holds the upper hand:


    +   - Printer configuration


    +   - Loading kernel modules to support new hardware


    Let''s take a look at linuxconf.


    # 3.1 System Configuration with linuxconf


    Linuxconf allows you to configure and control various aspects of your system,
    and is capable of handling a wide range of programs and tasks. Complete documentation
    of linuxconf could be a separate book in its own right and is certainly more than
    we can'
  merge: -1
  img_proc: true
