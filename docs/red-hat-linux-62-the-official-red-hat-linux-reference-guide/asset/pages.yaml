- pgno: 32
  md: '# Section 2.4:Configuring Console Access


    able to run, and they can access certain files (normally special device files
    used diskettes, CD-ROMS, and so on) that they would not otherwise be able to access.


    Since there are multiple consoles on a single computer, and multiple users can
    be logged into the computer locally at the same time, one of the users has to
    "win" the fight to access the files. The first user to log in at the console owns
    those files. The first user logs out, the next user who logs in will win the ones.


    In contrast, every user who logs in at the console will be allowed to run programs
    normally restricted to the root user. By default, those programs will ask for
    the user''s password. This will be done graphically if X is running which makes
    it possible to include these actions as menu items in a graphical user interface.
    As shipped, the console-accessible programs are shutdown, halt, and reboot.


    # 2.4.1 Disabling Console Program Access


    In environments where the console is otherwise secured (BIOS and LILO passwords
    are set, [Ctrl]-[Alt]-[Delete] is disabled, the power and reset switches are disabled,
    etc.), it may not be desirable to allow arbitrary users at the console to run
    shutdown, halt, and reboot.


    In order to disable all access by console users to console programs, you should
    run the command:


    ```

    rm -f /etc/security/console.apps/*

    ```


    # 2.4.2 Disabling All Console Access


    In order to disable all console access, including program and file access, in
    the /etc/pam.d/ directory, comment out all lines that refer to pam_console.so.
    The following script will do the trick:


    ```

    cd /etc/pam.d

    for i in *; do

    sed ''/[^#].*pam_console.so/s/^/#/'' < $i > foo && mv foo $i

    done

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 2:System Administration


    # 2.4.3 Defining the Console


    The /etc/security/console.perms file defines the console group. The syntax of
    that file is very flexible; you can edit the file so that these instructions no
    longer apply. the default file has a line that looks like this:


    ```

    <console>=tty[0-9]* * :[0-9]\.[0-9] :[0-9]

    ```


    When users log in, they are attached to some sort of named terminal, either an
    X server with a name like : or mymachine.example.com:1.0; or a device /dev/ttyS0
    or /dev/pts/2. The default is to define local virtual consoles and local X servers
    are considered, but if you want to consider the serial terminal next to you on
    port /dev/tty1 to also be local, you can change that line to read:


    ```

    <console>=tty[0-9]* * :[0-9]\.[0-9] :/dev/tty1

    ```


    # 2.4.4 Making Files Console-Accessible


    In /etc/security/dev[0-1]*, there has a section with lines like:


    +   - <floppy>=dev/fd[0-1]*

    - <cdrom>=dev/cdrom

    - <jaz>=dev/zip


    You can also add your own lines:


    ```

    <scanner>=/dev/sga

    ```


    (Of, make sure that /dev/sga is really your scanner and not, say, your hard drive.)

    That''s the first part. to define what is done with those files. In the last section
    of /etc/security/console.perms for lines similar to:


    ```

    <console> 0660 <floppy> 0660 root.floppy

    <console> 0600 <cdrom> 0660 root.disk

    <console> 0600 <jaz> 0660 root.disk

    ```


    and add a line like:'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Section 2.4:Configuring Console Access


    ```

    <console> 0600 <scanner> 0600 root

    ```


    Then, when you log in at the console, you will be given ownership of the /dev/sga
    device and the permissions will be 0600 (readable and writable by you only). When
    you log out, the device will be owned by root and still have 0600 (now: readable
    and writable by root only) permissions.


    # 2.4.5 Enabling Console Access for Other Applications


    If you wish to make other applications besides shutdown, reboot, and halt accessible
    to console users, you will have to do just a little bit more work.


    First of all, console access only works for applications which reside in /sbin
    or /usr/sbin, so the application that you wish to run must be the.


    Create a link from the name of your application to the /usr/bin/console-helper
    application:


    ```

    cd /usr/bin

    ln -s consolehelper foo

    ```


    Create the file /etc/security/console.apps/foo:


    ```

    touch /etc/security/console.apps/foo

    ```


    Create a PAM configuration file for the foo service in /etc/pam.d/. We suggest
    that you start with a copy of the shutdown service, then change it if you want
    to change the behavior:


    ```

    cp /etc/pam.d/shutdown /etc/pam.d/foo

    ```


    Now, when you run /usr/bin/foo, it will call consolehelper, which with the help
    of /usr/sbin/userhelper will authenticate the user (asking for the user’s password
    if /etc/pam.d/foo is a copy of /etc/pam.d/shutdown; otherwise, it will precisely
    do what is specified in /etc/pam.d/foo) and then run /usr/sbin/foo with root permissions.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 2.5 The floppy Group


    If, for whatever reason, console access is not appropriate for you, and you need
    to give non-root users access to your system''s diskette drive, this can be done
    using the floppy group. Simply add the user(s) to the floppy group using the tool
    of your choice. Here''s an example showing how gpasswd can be used to add user
    fred to the floppy group:


    ```

    [root@bigdog root]# gpasswd -a fred floppy

    Adding user fred to group floppy

    [root@bigdog root]#

    ```


    User fred will now be able to access the system''s diskette drive.


    # 2.6 User Authentication with PAM


    Programs which give users access to privileges of any sort need to be able to
    authenticate the users. When you log into a system, you provide your name and
    password, and the login process uses those to authenticate the login -- to verify
    that you are who say you are. Forms of authentication other than passwords are
    possible, and it is possible for the passwords to be stored in different ways.


    PAM, which stands for Pluggable Authentication Modules, is a way of allowing the
    system administrator to set authentication policy without having to recompile
    authentication programs. With PAM, you control how the modules are plugged into
    the programs by editing a configuration file.


    Most Red Hat Linux users will never need to touch this configuration file. When
    you use RPM to install programs that require authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you must understand
    the configuration file.


    # 2.6.1 PAM Modules


    There are four types of modules defined by the PAM standard.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Section 2.6:User Authentication with PAM


    +   - auth modules provide the actual authentication, perhaps asking for and check-password,
    and they set "credentials" such as group membership or kerberos "tickets."


    +   - account modules check to make sure that the authentication is allowed (the
    account has not expired, the user is allowed to log in at this time of day, and
    so on).


    +   - password modules are used to set passwords.


    +   - session modules are used once a user has been authenticated to allow them
    to use their account, perhaps mounting the user''s home directory or making their
    mailbox available.


    These modules may be stacked, so that multiple modules are used. For instance,
    login normally uses one of least two authentication methods: if hosts authentication
    succeeds, it is sufficient to allow the connection; if it fails, then standard
    password authentication is done.


    New modules can be added at any time, and PAM-aware applications can then be made
    to use them. For instance, if you have a one-time-password calculator system,
    and you can write a module to support it (documentation on writing modules is
    included with the system in /usr/doc/pam*), PAM-aware programs can use the new
    module and work with the new one-time-password calculators without being recompiled
    or otherwise modified in any way.


    # 2.6.2 Services


    Each program using PAM defines its "service" name. The login program defines the
    service type login, tpd defines the service ftp, and so on. In general, the service
    type is the name of the program used to access the service, (if there is a difference)
    the program used to provide the service.


    # 2.6.3 The Configuration Files


    The directory /etc/pam.d is used to configure all PAM applications. (This used
    to be /etc/pam.conf in earlier PAM versions; while the pam.conf file is still
    used'
  merge: -1
  img_proc: true
