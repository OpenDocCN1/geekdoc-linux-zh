  md: '# Section 3.1:System Configuration with linuxconf


    # 3.1.14 Getting Connected with Linuxconf (Network Configuration)


    The first thing to determine when getting hooked up is whether you''re connecting
    to a local area network, such as a group of computers in an office, or a wide
    area network, such as the Internet. Before continuing, it''s important to know
    what hardware you have and how you intend to connect. If you''re going to dial
    into another computer, make sure your modem is installed and that the cables are
    arranged properly. If you''re using a network card, make sure it is installed
    properly and that the cables are correctly connected. Regardless of what network
    configuration you specify, if every phone line or cable is not in place, you''ll
    never get connected. We''ll start with modem connections and then move on using
    network cards.


    # Adding Modem/PPP/SLIP connections


    Red Hat Linux 6.2 uses the utility called RP3, or the RH PPP Dialer, a graphical
    tool which helps users configure and monitor network accounts -- particularly
    PPP accounts. To read more about RP3, see the related chapter in the Official
    Red Hat Linux Getting Started Guide.). However, you can still depend on linuxconf
    to set up network configuration.


    There are several pieces of information you will need to get from your ISP (Internet
    Service Provider) or systems administrator before getting your PPP or SLIP account
    working. In the case of some providers, you may have to sort through directions
    on how to set up a PPP connection on a Linux system. Some ISPs are ill-equipped
    to handle individuals using Linux. Don''t worry, you can still get connected;
    just need some additional information from your ISP.


    The following is what you need for a connection with Red Hat Linux. The ISP representatives
    may respond that you don''t need this information, or suggest that you need more
    than that. Red Hat has streamlined the information needed using intelligent defaults
    and tools such as linuxconf to simplify this process for you. Unless you have
    a document specifically for Red Hat Linux, just request the information below
    and go from there. Specifically, you''ll need:


    +   - The IP address for the ISP''s domain name server


    +   - The telephone number to dial'
  merge: -1
  img_proc: true
