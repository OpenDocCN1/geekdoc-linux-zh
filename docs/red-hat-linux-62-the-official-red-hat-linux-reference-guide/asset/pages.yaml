    column, you can view the “state” of the package; you’ll receive information if
    any files are reported as “missing” from the package (and therefore probably there’s
    a problem with the package).


    If you''re querying a package that''s already installed, you''ll also find two
    additional buttons at the bottom of this window: Verify and Uninstall. If you''re
    performing a query on a package that hasn''t been installed, the buttons on the
    bottom will be labeled Install, Upgrade and Check Sig.


    To close the query window without performing any action, left-click on the X at
    the top right of the window bar.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 7.5.2 Verifying Packages


    Verifying a package checks all of the files in the package to ensure they match
    the ones present on your system. The checksum, file size, permissions, and owner
    attributes are all checked against the database. This check can be used when you
    suspect one of the program’s files has been corrupted for some reason.


    Choosing the packages to verify is like choosing the packages to query. Select
    the packages in the display window and use the Verify button on the toolbar or
    from Packages => Verify on the menu. A window opens like the one in Figure 7–12,
    Verify Window.


    Figure 7–12 Verify Window


    ![](img/a62cd8edb5919f938a546de403f602c6_177_0.png)


    As the package is being checked, you’ll see the progress in the Verify window.
    If there are any problems discovered during the verify process, they’ll be described
    in the main display area.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Section 7.5:Package Manipulation


    # 7.5.3 Uninstalling Packages


    Uninstalling a package removes the application and associated files from your
    machine. When a package is uninstalled, any files it uses that are not needed
    by other packages on your system are also removed. Changed configuration files
    are copied to `<filename>.rpmsave so you can reuse them later.


    > Please Note

    Remember that you must be root to uninstall packages.


    Uninstalling a package would break "dependencies" (which could hobble other applications
    that require one or more of the removed files in the package), a dialog will pop
    up, asking you to confirm the deletion. This will occur if you haven''t selected
    the **No dependency checks** box from the Preferences menu (as shown in Figure
    7–13, The Behavior Tab in Preferences).


    # Figure 7-13 The Behavior Tab in Preferences


    ![](img/a62cd8edb5919f938a546de403f602c6_178_0.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'There are a variety of methods through which you can remove a selected package:
    from the menu, under Packages; from the toolbar and from the Query function. If
    you decide to remove more than one package at a time, you can choose either an
    incremental or global selection in the same way as you would installing, querying
    or verifying. The total of your selections will be reflected in the status bar
    on the bottom of the main window. Because you can remove more than one package
    at a time, use caution to select only those which you wish to remove.


    Figure 7–14 Uninstall Window


    ![](img/a62cd8edb5919f938a546de403f602c6_179_0.png)


    Once you''ve begun the uninstall, Gnome-RPM asks for confirmation, showing a window
    like the one in Figure 7–14, Uninstall Window. All of the packages that are about
    to be uninstalled are listed. You should look at all them to ensure you''re not
    about to remove something you want to keep. Clicking the Yes button will start
    the uninstallation process. After it completes, the packages and groups that have
    been removed will disappear from any windows they were in.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Section 7.5:Package Manipulation


    # Upgrading new Packages


    When a new version of a package has been released, it is easy to install it on
    your system. Select the packages from the window of available packages in the
    same way you select packages for installation. Both the Upgrade button on the
    toolbar and, from the menu, under Operations => Upgrade will begin the process.
    You simply Add packages in the same manner as you would a new package installation.


    During the upgrade, you''ll see a progress indicator like the one for installing
    packages. When it''s finished, any old versions of the packages will be removed,
    unless you specify otherwise (refer to Section 7.4, Configuration for more information).


    It is much better to use the upgrade option than to uninstall the old versions
    of a package and then install the new one. Using upgrade ensures that any changes
    you made to package configuration files are preserved properly, while uninstalling
    and reinstalling a new package could cause those changes to be lost.


    If you run out of disk space during an installation, the install will fail. However,
    the package which was being installed when the error occurred may leave some files
    around. To clean up after this error, reinstall the package after you''ve made
    disk space available.'
  merge: -1
  img_proc: true
