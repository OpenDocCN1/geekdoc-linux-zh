- pgno: 148
  md: '# Section 6.1:RPM Design Goals


    # 6 Package Management with RPM


    The RPM Package Manager (RPM), is an open packaging system available for anyone
    to use, and works on Red Hat Linux as well as other Linux and UNIX systems. Red
    Hat, Inc., encourages other vendors to take the time to look at RPM and use it
    for their own products. RPM is distributable under the terms of the GPL.


    For the end user, RPM provides many features that make maintaining a system easier
    than it has ever been. Installing, uninstalling, and upgrading RPM packages are
    all line commands, and the messy details have been taken care of you. RPM maintains
    a database of installed files, which allows you to perform powerful queries and
    verification of your system.


    During upgrades, RPM handles configuration files specially, so that you never
    lose your customizations -- a feature that is impossible with straight .tar.gz
    files.


    For the developer, RPM allows you to take source code for software and package
    it into source and binary packages for end users. This process is quite simple
    and driven from a single file and optional patches that you create. This clear
    delineation of "pristine" sources and your patches and build instructions eases
    the maintenance of the package as new versions of the software are released.


    # Please Note


    Although it can be important to understand the concepts behind RPM, for those
    who prefer a graphical interface to the command line, we suggest you use Gnome-RPM.
    Please see Chapter 7, Gnome-RPM for more information.


    # 6.1 RPM Design Goals


    Before trying to understand how to use RPM, it helps to have an idea of what the
    design goals are.


    # Upgradability'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Chapter 6:Package Management with RPM


    With RPM you can upgrade individual components of your system without completely
    reinstalling. When you get a new release of an operating system based on RPM (such
    as Red Hat Linux), you don''t need to reinstall on your machine (as you do with
    operating systems based on other packaging systems). RPM allows intelligent, fully-automated,
    in-place upgrades of your system. Configuration files in packages are preserved
    across upgrades, so you won''t lose your customizations.


    # Powerful Querying


    RPM is also designed to have powerful querying options. You can do searches through
    your entire database for packages or certain files. You can also easily find out
    what package belongs to and where it came from. The files an RPM package contains
    are in a compressed archive, with a custom binary header containing useful information
    about the package and its contents, allowing you to query individual packages
    quickly and easily.


    # System Verification


    Another powerful feature is the ability to verify packages. If you are worried
    that you deleted an important file for some package, simply verify the package.
    You will be notified of any anomalies. At that point, you can reinstall the package
    if necessary. Any configuration files that you modified are preserved during reinstatement.


    # Pristine Sources


    A crucial design goal was to allow the use of "pristine" software sources, distributed
    by the original authors of the software. With RPM, you have the pristine sources
    along with any patches that were used, plus complete build instructions. This
    is a big advantage for several reasons. For instance, if a new version of a program
    comes out, you don''t necessarily have to start from scratch querying to compile.
    You can look at the patch to see what you might need to do. All the compiled-in
    defaults, and all of the changes that were made to get the software to build properly
    are easily visible this way.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Section 6.2:Using RPM


    This goal may only seem important for developers, but it results in higher quality
    software for end users too. We would like to thank the folks from the BONUS distribution
    for originating the pristine source concept.


    # 6.2 Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and try rpm --help, or turn to Section 6.4,
    Other RPM Resources for more information on RPM.


    # 6.2.1 Installing


    RPM packages typically have file names like foo-1.0-1.i386.rpm, which includes
    the package name (foo), version (1.0), release (1), and architecture (i386). Installing
    a package is as simple:


    ```

    # rpm -ivh foo-1.0-1.i386.rpm

    ###########################################################

    ```


    As you can see, RPM prints out the name of the package (which is not necessarily
    the same as the file name, which could have been l.rpm), and then prints a succession
    of hash marks as the package is installed, as a progress meter.


    Installing packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    If the package is already installed, you will see:


    ```

    # rpm -ivh foo-1.0-1.i386.rpm

    foo package foo-1.0-1 is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    #

    ```


    If you really want to install the package anyway, you can use --replacepkgs on
    the command line, which tells RPM to ignore the error:


    ```

    # rpm -ivh --replacepkgs foo-1.0-1.i386.rpm

    ###########################################################

    foo

    ```'
  merge: -1
  img_proc: true
- pgno: 151
  md: "# # Conflicting Files\n\nIf you attempt to install a package that contains\
    \ a file which has already been installed by another package, you'll see:\n\n\
    ```\n# rpm -ivh foo-1.0-1.i386.rpm\n    /usr/bin/foo conflicts with file from\
    \ bar-1.0-1\nfoo\nerror: foo-1.0-1.i386.rpm cannot be installed\n#\n```\n\nTo\
    \ cause rpm to ignore that error, use --replacefiles on the command line:\n\n\
    ```\n# rpm -ivh --replacefiles foo-1.0-1.i386.rpm\nfoo\n######################################\n\
    #\n```\n\n# # Unresolved Dependency\n\nRPM packages can \"depend\" on other packages,\
    \ which means that they require other packages to be installed in order properly.\
    \ If you try to install a package for which there is such an unresolved dependency,\
    \ you'll see:\n\n```\n# rpm -ivh bar-1.0-1.i386.rpm\nfailed dependencies:\nfoo\
    \ is needed by bar-1.0-1\n#\n```\n\nTo handle this error you should install the\
    \ requested packages. If you want to force the installation anyway (a bad idea\
    \ since the package probably will not run correctly), use --nodepeps on the command\
    \ line.\n\n# # 6.2.2 Uninstalling\n\nUninstalling a package is just as simple\
    \ as installing:\n\n```\n# rpm -e foo\n#\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Section 6.2:Using RPM


    Notice that we used the package name "foo," not the name of the original package
    file "foo-1.0-1.i386.rpm".


    You can encounter a dependency error when uninstalling a package if some other
    installed package depends on the one you are trying to remove. For example:


    ```

    # rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    #

    ```


    To cause RPM to ignore that error and uninstall the package anyway (which is also
    a bad idea since the package depends on it will probably fail to work properly)
    use --nodeps on the command line.


    # 6.2.3 Upgrading


    Upgrading a package is similar to installing.


    ```

    # rpm -Uvh foo-2.0-1.i386.rpm

    ####################################foo

    #

    ```


    You don''t see above is that RPM automatically uninstalled any old versions of
    the foo package. In fact you may want to always use -U to install packages, it
    works even when there are no previous versions of the package installed.


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like:


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    This means that your changes to the configuration file may not be "forward compatibility"
    with the new configuration file in the package, so RPM saved your original file,
    and installed a new one. You should investigate and resolve the differences between
    the two files as soon as possible to ensure that your system continues to function
    properly.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Since upgrading is really a combination of uninstalling and installing, you
    can en-counter any errors from those modes, plus one more: If RPM thinks you are
    trying to upgrade to a package with an older version number, you will see:


    ```

    # rpm -Uvh foo-1.0-1.i386.rpm

    foo package foo-2.0-1 (which is newer) is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    #

    ```


    To cause RPM "upgrade" anyway, use --oldpackage on the command line:


    ```

    # rpm -Uvh --oldpackage foo-1.0-1.i386.rpm

    foo

    #####################################

    ```


    # 6.2.4 Freshening


    Freshening a package is similar to upgrading:


    ```

    # rpm -Fvh foo-1.2-1.i386.rpm

    foo

    ####################################

    ```


    RPM’s freshen option checks the versions of the packages specified on the command
    line against the versions of packages that have already been installed on your
    system. When a newer version of an already-installed package is processed by RPM’s
    freshen option, it will be upgraded to the newer version. However, RPM’s freshen
    option will not install a package if no previously-installed package of the same
    name exists. This differs from RPM’s upgrade option, as an upgrade will install
    packages, whether or not an older version of the package was already installed.


    RPM’s freshen option works well with single packages or a group of packages. It’s
    especially handy if you’ve just downloaded a large number of different packages,
    and especially if you only want to upgrade those packages that are already installed
    on your system. Using the freshen option means that you won’t have to pick through
    the downloaded packages, deleting any unwanted ones before using RPM.


    In this case, you can simply issue the following command:


    ```

    # rpm -Fvh *.rpm

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Section 6.2:Using RPM


    RPM will automatically upgrade only those packages that have already been installed.


    # 6.2.5 Querying


    Querying the database of installed packages is accomplished with rpm -q. A simple
    use is rpm -q foo which will print the package name, version, and release number
    of the installed package foo:


    ```

    # rpm -q foo

    foo-2.0-1

    ```


    Instead of specifying the package name, you can use the following options with
    -q to specify the package(s) you want. These are called Package Specification
    Options.


    +   - a queries all currently installed packages.

    - f <file> will query the package owning <file>.

    - p <packagefile> queries the package <packagefile>.


    There are a number of ways to specify what information to display about queried
    packages. The following options are used to select the type of information for
    which you are searching. These are called Information Selection Options.


    +   - i displays package information as name, description, release, size, built
    date, install date, vendor, and other miscellaneous information.

    - l displays the list of files that the package "owns".

    - s displays the state of all the files in the package.

    - d displays a list of files marked as documentation (man pages, info pages, READMEs,
    etc.).

    - c displays a list of files marked as configuration files. These are the files
    you change after installation to adapt the package to your system (sendmail.cf,
    passwd, inittab, etc).'
  merge: -1
  img_proc: true
- pgno: 155
  md: "# Chapter 6:Package Management with RPM\n\nFor those options that display file\
    \ lists, you can add -v to your command line to get the lists in a familiar ls\
    \ -l format.\n\n# 6.2.6 Verifying\n\nVerifying a package compares information\
    \ about files installed from a package with the same information from the original\
    \ package. Among other things, verifying covers the MD5 sum, permissions, type,\
    \ owner and group of each file.\n\nThe command rpm -V verifies a package. You\
    \ can use any of the Package Selection Options listed for querying to specify\
    \ the packages you wish to verify. A simple use is rpm -V foo which verifies that\
    \ all the files in the foo package are as they were when they were originally\
    \ installed. For example:\n\n+   - To verify a package containing particular file:\n\
    \  rpm -Vf /bin/vi\n\n+   - To verify ALL installed packages:\n  rpm -Va\n\n+\
    \   - To verify an installed package against an RPM package file:\n  rpm -Vp foo-1.0-1.1386.rpm\n\
    \nThis can be useful if you suspect there will be no output. If there are any\
