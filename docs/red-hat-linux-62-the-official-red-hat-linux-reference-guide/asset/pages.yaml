  md: '# Section 10.1:The Installation Program User Interface


    Figure 10–2 Installation Program Widgets as seen in Disk Druid


    ![](img/a62cd8edb5919f938a546de403f602c6_206_0.png)


    +   - Window -- Windows (usually referred to as dialogs in this manual) appear
    on your screen throughout the installation process. At times, one window may overlay
    another; in these cases, you can only interact with the window on top. When you
    are finished in that window, it will disappear, allowing you to continue working
