    each add-tional selection.


    To select more than one package globally, that is, make larger selections within
    a folder, left-click one package, while holding down the [Shift] key, left-click
    on the final package you wish to select. By doing so, you''ll notice that individual
    packages between your starting and ending selections will also be highlighted
    for selection. Using this option makes selecting groups of packages quicker than
    selecting each package individually.


    The status bar at the bottom of Gnome-RPM will display the total number of packages
    you have selected.


    # 7.3 Installing New Packages


    To install new packages, choose Install from the toolbar. The Install window will
    open, revealing packages which are either already installed, newer packages or
    other options, which can be selected from the Filter drop-down bar at the top
    of the window. See Figure 7–4, The Add Packages Window for an example of the install
    window, using the filter for "All but installed packages."


    Using the Filter feature allows you to winnow your choices for viewing packages:


    +   * All packages

    * All but installed packages

    * Only uninstalled packages

    * Only newer packages

    * Uninstalled or newer packages


    You can switch the display of packages by using the drop-down bar at the top of
    the window.'
