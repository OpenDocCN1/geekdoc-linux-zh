- pgno: 82
  md: '# Section 3.1:System Configuration with linuxconf


    In the Supplementary groups field, you can specify additional groups. Group names
    should be separated by spaces. The default for this field is blank, meaning no
    supplementary groups are specified.


    The Home directory specifies the name or login directory for the account. The
    default is /home/login, where login is replaced by the login name. A home directory
    is your starting point in the directory structure when you log in, or if X, for
    each Xterm window. This is also where specific preference fares are stored.


    The Command interpreter is the default shell for the account. The bash shell is
    the default shell for Red Hat Linux.


    The User ID is the number associated with each user account. This is automatically
    generated by the system when the account is created, so just leave this field
    blank. The system uses the UID to identify an account.


    # Mail settings for User Accounts


    The Redirect messages to field sets the system to forward e-mail messages sent
    to the user to this address instead


    An E-mail alias is a supplemental e-mail address that will be accepted by the
    system and forwarded to the user. For example, you could add the alias jane_smith@yourdomain.com
    to user smitj''s account. Then, e-mail sent to jane_smith@yourdomain.com would
    automatically be forwarded to smitj@domain.com.


    # Privileges for User Accounts


    In the Privilege section, you can grant access and/or control over various aspects
    of system configuration. As a default, users are denied all privileges on this
    screen. You may choose to grant or silently grant them specific privileges. The
    difference between Granted and Granted/silent is that if the privilege is granted,
    linuxconf will ask for the user''s password before allowing them privilege. If
    the privilege is granted silently, linuxconf will not prompt for their password.


    Generally, careful administrators won''t grant any system configuration privileges
    unless it is absolutely necessary. If you grant privileges, be careful when granting
    them silently. If a user with silently granted privileges logs in to his/her'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Chapter 3:System Configuration


    machine and walks away, their privileges are wide open for the next person who
    sits down at their desk. Silently granted privileges are less risky if used on
    machines in a physically restricted area.


    **May linuxconf**: the user is allowed to access all of linuxconf''s capabilities,
    and they can set up or change linuxconf parameters. Note that use of linuxconf
    is separate from the privilege of activating configuration. System administrators
    might want to grant the use of linuxconf, but deny the activation privilege, so
    that the sysadmin has a final "yes/no" on whether to activate any configuration
    changes.


    **May activate changes**: After you change a parameter in linuxconf, at some point
    you''ll have to indicate to linuxconf that the changes you made should be applied.
    Depending upon the flavor of linuxconf that you''re using, you might do this by
    clicking on an **Activate the changes** button in GUI linuxconf, or clicking on
    an **Accept** button in Web-based linuxconf, or selecting an **Accept** button
    in text-mode linuxconf, etc.


    You can grant the privilege of activating changes to a user. In that case, the
    user will be able to activate any changed system configuration parameters in linuxconf.


    **May shutdown**: A user can be granted the right to shutdown the system. Note
    that Red Hat Linux is set in /etc/inittab to cleanly shutdown following the [Ctrl]-[Alt]-[[Del]
    keystroke combination.


    Once you have entered the login name and any other desired selection select the
    **Accept** button at the bottom of the screen. If you decide against creating
    a new user, select Cancel instead.'
  merge: -1
