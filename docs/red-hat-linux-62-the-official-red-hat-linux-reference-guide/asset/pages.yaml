- pgno: 48
  md: '# Section 2.9:Sendmail


    creating sendmail configuration files. Also, O’Reilly & Associates publishes a
    good sendmail reference entitled *sendmail*, by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, at Red Hat we have machine
    mail.redhat.com that does all our mail. On that machine we simply need to add
    the names of machines for which mail.redhat.com will handle mail to /etc/sendmail.cw.
    Here is an example:


    ```

    # sendmail.cw - include aliases for your machine

    # here.

    # torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    Then on the other machines, torgo, poodle, and devel, we need to edit /etc/sendmail.cf
    to "masquerade" as mail.redhat.com when sending mail, and to forward any local
    mail processing to redhat.com. Find the DH and DM lines in /etc/sendmail.cf and
    edit them as:


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who gets all local email traffic

    DHmail.redhat.com

    ```


    ```

    # who I masquerade as (null for no masquerading)

    DMredhat.com

    ```


    With this type of configuration, all mail sent will appear as if it were sent
    from redhat.com, and any mail sent to torgo.redhat.com or the other hosts will
    be delivered to mail.redhat.com.


    Please be aware that if you configure your system to masquerade as another e-mail
    sent from your system to your system will be sent to the machine you are masquerading
    as. For example, in the above illustration, log files that are periodically sent
    to root@poodle.redhat.com by the cron daemon would be sent to root@mail.redhat.com.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 2.10 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a TCP wrapper. The protected services are those listed in /etc/inetd.conf
    that specify /usr/sbin/tcpd. tcpd can allow or deny access to a service based
    on the origin of the request, and the configuration in /etc/hosts.allow and /etc/hosts.deny.


    By default Red Hat Linux allows all service requests. To disable or limit services
    you can edit /etc/hosts.allow. Here is an example /etc/hosts.allow file:


    ```

    ALL: redhat.com .redhat.com

    in.talkd: ALL

    in.ntalkd: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```


    This configuration allows all connections from redhat.com and *.redhat.com machines.
    It also allows talk, finger, and FTP requests from all machines.


    tcpd allows much more sophisticated access control, using a combination of /etc/hosts.allow
    and /etc/hosts.deny. Read the tcpd(8) and hosts_access(5) man pages for complete
    details.


    # 2.11 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    RPM package (which you may have already installed at time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.


    # /etc/ftpaccess


    This file defines most of the access control for your FTP server. Some of the
    things you can do are: set up logical "groups" to control access from different
    sites, limit the number of simultaneous FTP connections, configure transfer logging,
    and much more. Read the ftpaccess man page for complete details.


    # /etc/ftphosts'
