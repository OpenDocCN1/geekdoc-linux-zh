    killall -HUP rpc.nfsd rpc.mountd

    ```


    See the following man pages for more details: nfsd(8), mountd(8), and exports(5).
    Another good reference is Managing NFS and NIS Services, by Hal Stern, published
    by O''Reilly & Associates.


    # 2.13 The Boot Process, Init, and Shutdown


    This section contains information on what happens when you boot or shut down your
    Red Linux system.


    # 2.13.1 Behind the Scenes of the Boot Process


    When a computer is booted, the processor looks at the end of the system memory
    for the BIOS (Basic Input/Output System) and runs it. The BIOS program is written
    into read-only permanant memory, and is always ready to go. The BIOS provides
    the lowest level interface to peripheral devices and controls the first step of
    the boot process.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Section 2.13:The Boot Process, Init, and Shutdown


    The BIOS tests the system, looks for and checks peripherals and then looks for
    a drive to boot. Usually, it checks the floppy drive (or CD-ROM drive on many
    newer systems), if present, and then it looks on the hard drive. On the hard drive,
    the BIOS looks for a Master Boot Record (MBR) starting at the first sector on
    the first hard drive and starts the MBR running.


    The MBR looks for the first partition and reads the partition''s boot record.
    The boot record contains instructions on how to load the boot loader, LILO (LinuxLoader).
    The MBR then reads LILO and LILO takes over.


    LILO reads the file /etc/lilo.conf, which spells out which operating system(s)
    to configure or which kernel to start and where to install it (for example, /dev/hda
    for your hard drive). LILO displays a LILO prompt on the screen and waits for
    a preset period of time (also in the lilo.conf file) for input from the user.
    Your lilo.conf is set to give LILO a choice of whichever OS you wanted to boot.


    After waiting for a set period of time (five seconds is common), LILO proceeds
    to boot whichever operating system appears first in the lilo.conf file.


    If LILO is booting Linux, it first boots the kernel, which is a vmlinux (plus
    a version number, for example, vmlinux-2.2.15-xx) located in the /boot directory.
    Then the kernel takes over.


    The kernel looks in several different places for init (/sbin is a common location)
    and runs the first one of it. Init finds.


    Init starts (and the parent or grandparent of) all the processes which make your
    Linux system. It runs from /etc/rc.d/rc.sysinit, which sets your path, sets up
    networking if necessary, starts swapping, checks the filesystems, and so on. Basically,
    rc.sysinit is taking care of everything your system needs to have done at system
    initialization. For example, on a networked system rc.sysinit uses the information
    in the /etc/sysconfig/network and /etc/sysconfig/clock files to initialize processes
    and the clock. It may also run rc.serial, if you have serial processes that need
    to be initialized.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Init looks at and implements the /etc/inittab file. The /etc/inittab describes
    how the system should be set up in each runlevel and sets the default runlevel.
    This file states that /etc/rc.d/rc and /sbin/update should be run whenever a runlevel
    starts.


    The /sbin/update file flushes dirty buffers to disk.


    When the runlevel changes, /etc/rc.d/rc starts and stops services. First, rc sets
    the source function library for the system (commonly /etc/rc.d/init.d/functions),
    which spells out how to start/kill a process and how to find out the PID of a
    process. The rc then finds the current and the previous runlevel and tells linux
    the appropriate runlevel.


    The rc file starts all of the background processes for the system to run, and
    looks for an rc directory for runlevel /etc/rc.d/rc<x>.d, where the <x> is numbered
    0-6. kills all of the kill scripts (their file name starts with a K) in /rc.d/.
    Then it initializes all of the start scripts (their file name starts with an S)
    in the appropriate runlevel directory (so that all services and applications are
    started correctly).


    For example, for runlevel 5, rc looks into the /etc/rc.d/rc5 directory and finds
    that it needs to kill ruserserd, rwald, rwhod, miscerv, mars-ne, apmd, and pomcia.
    In the bloody aftermath, rc looks into the same directory and finds start scripts
    for kmod, network, nfsd, random, syslog, atd, crowd, portmap, snmpd, init, xntpd,
    lpf, nfs.rpsave, dhcpd, ybind, autofs, keytable, sendmail, gdm, and smb.rmpsave.
    Life begins anew.


    The /etc/initab forks a process for each virtual console (login prompts) for each
    runlevel (runlevels 2-5 get all six; runlevel 1, which is user mode, only gets
    one console; runlevels 0 and 6 get no virtual consoles). /etc/inittab also states
    that gdm, the X login manager, should start in runlevel 5.


    Also, /etc/inittab describes how the system should handle translating [Ctrl]-[Alt]-[[Delete]
    into something like the command /sbin/shutdown -t3 -r now. And finally, /etc/inittab
    states what the system should do in case of power failures.


    At this point, you should be looking at a login prompt. All that, and it only
    took a few seconds.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Section 2.13:The Boot Process, Init, and Shutdown\n\nNext, we'll discuss\
    \ information on the files in /etc/sysconfig.\n\n# 2.13.2 Sysconfig Information\n\
    \nThe following information outlines the various files in /etc/sysconfig, their\
