    \nNow, how do you run all the right scripts? If you enter ls -1 on rc3.d, you\
    \ might see something like:\n\n```\nlrwxxrwx 1 root root 17 3:11 S10Network ->\
    \ .. /init.d/network\nlrwxxrwx 1 root root 16 3:11 S30Syslog -> .. /init.d/syslog\n\
    lrwxxrwx 1 root root 16 3:11 S40scron -> .. /init.d/cron\nlrwxxrwx 1 root root\
    \ 14 3:32 S50Inet -> .. /init.d/init\nlrwxxrwx 1 root root 13 3:11 S60nfs -> ..\
    \ /init.d/nfs\nlrwxxrwx 1 root root 15 3:11 S70nfs -> .. /init.d/nfs\nlrwxxrwx\
    \ 1 root root 18 3:11 S90lpd -> .. /init.d/lpd\nlrwxxrwx 1 root root 11 3:11 S991local\
    \ -> .. /rc.local\n```\n\nWhat you'll notice is there are no \"real\" files in\
    \ the directory. Everything there is a link to one of the scripts in the init.d\
    \ directory. The links also have an \"S\" and a number at the beginning. The \"\
    S\" means to start this script and a \"K\" would mean to stop it. The number in\
    \ the file name is for ordering purposes. Init will start all the services based\
    \ on the order in which they appear. You can duplicate numbers, but it will only\
    \ confuse you somewhat. You only need to use two digit number, along with an upper\
    \ case \"S\" or \"K\" to start or stop the services you require."
