- pgno: 360
  md: '# Section F.5:Kickstart Commands


    "zerombr" is specified, and "yes" is its sole argument, any invalid partition
    tables found on disks are initialized. This will destroy all of the contents of
    disks with invalid partition tables. This command should be used as:


    ```

    zerombr yes

    ```


    No other format is effective.


    # F.5.22 %packages – Package Selection


    Use the %packages command to begin a kickstart file section that lists the packages
    you''d like to install (this is for installations only, as package selection during
    upgrades is not supported).


    Packages can be specified by component or by individual package name. The installation
    program defines several components that group related packages. See the RedHat/base/comps
    file on any Red Linux CD-ROM for a list of components. The components are defined
    by the lines that begin with a space, and then the component name. Each package
    in that component is then listed, line-by-line. Individual packages lack the leading
    number found in front of component lines.


    Additionally, there are three other types of lines in the comps file you may run
    across:


    # Architecture specific (alpha; i386; and sparc6):


    If a package name begins with an architecture type, you only need to type in the
    package name, minus the architecture name. For example:


    ```

    For i386: netscape-common you only need to use the netscape-common part for this
    specific package to be installed.

    ```


    # Lines beginning with ?


    Lines that begin with a ?, are specific to the installation program. You do not
    have to do anything with these type of lines.


    # Lines beginning with --hide


    If a package name begins with --hide, you only need to type in the package name,
    minus the --hide. For example:'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# Appendix F:Kickstart Installations


    For --hide KDE Workstation you only need to use the KDE Workstation part for that
    specific package to be installed.


    In most cases, it''s only necessary to list the desired components and not individual
    packages. Note that the Base component is always selected by default, so it''s
    necessary to specify it in the %packages section.


    Here''s an example %packages selection:


    ```

    %packages

    @ Networked Workstation

    @ C Development

    @ Web Server

    @ X Window System

    bsd-games

    ```


    As you can see, components are specified, to one line, starting with an @ symbol,
    a space, and then the full component name as given in the comps file. Specify
    individual packages with no additional characters (the bsd-games line in the example
    above is an individual package).


    # Please Note


    You can also direct the kickstart installation to use the workstation- and server-class
    installations. To do this, simply add one of the following lines to the %packages
    section:


    ```

    @ Gnome Workstation

    @ KDE Workstation

    @ Server

    ```


    # F.5.23 %post – Post-Installation Configuration Section


    You have the option of adding commands to run on the system after the installation
    is complete. This section must be at the end of the kickstart file and must start
    with the %post command. Note, you can access the network in the %post section;
    however, name service has not been configured at this point, so only IP addresses
    will work.


    Here''s an example %post section:'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Section F.5:Kickstart Commands


    ```

    %post

    # add comment to /etc/motd

    echo "Kickstart-installed Red Hat Linux ''//bin/date''" > /etc/motd


    # add another nameserver

    echo "nameserver 10.10.0.2" >> /etc/resolv.conf

    ```


    This section creates a message-of-the-day file containing the date the kickstart
    installation took place, and gets around the network command''s "one name server
    only" limitation by adding another name server to /etc/resolv.conf.


    # Please Note


    > Note that the post-install script is run in a chroot''ed environment; therefore
    performing tasks such as copying scripts or RPMs from the installation media will
    not work.


    --nochroot


    Allows you to specify commands that you would like to run outside of the chroot''ed
    environment.'
  merge: -1
  img_proc: true
