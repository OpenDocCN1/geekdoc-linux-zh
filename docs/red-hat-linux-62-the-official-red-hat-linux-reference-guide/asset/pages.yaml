- pgno: 342
  md: '# F Kickstart Installations


    # F.1 What are Kickstart Installations


    Due to the need for automated installation, Red Hat has created the kickstart
    installation method. With this method, a system administrator can create a single
    file containing the answers to all the questions that would normally be asked
    during a typical Red Hat Linux installation.


    Kickstart files can be kept on single server system, and read by individual computers
    during the installation. The kickstart installation method is powerful enough
    that often a single kickstart file can be used to install Red Hat Linux on multiple
    machines, making it ideal for network and system administrators.


    Kickstart lets you automate most of a Red Hat Linux installation, including:


    +   * Language selection

    * Network configuration

    * Keyboard selection

    * Boot loader installation (LILO)

    * Disk partitioning

    * Mouse Selection

    * X Window System configuration


    # F.2 How Do You Perform a Kickstart Installation?


    Kickstart installations can only be performed using a local CD-ROM, a local hard
    drive, or NFS installation methods. FTP and HTTP installations cannot be automated
    using kickstart mode.


    To use kickstart mode, you must first create a kickstart file (`ks.cfg`), and
    make it available to the Red Hat Linux installation program.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# F.2.1 Where to Put A Kickstart File


    A kickstart file must be placed in one of two locations:


    +   - on a boot disk

    - on a network


    Normally a kickstart file is copied to the boot disk, or made available on the
    network. The network-based approach is most commonly used, as most kickstart installations
    tend to be performed on networked computers.


    Let’s take a more in-depth look at where the kickstart file may be placed.


    To perform a de-fiskette-based kickstart installation, the kickstart file must
    be named ks.cfg, and reside in the boot disk’s top-level directory. Note that
    the Red Hat Linux disks are in MS-DOS format, making it easy to copy the kickstart
    file from a local CD-ROM using the `copy` command:


    ```

    mcopy ks.cfg a:

    ```


    (or, if you insist, you can use Windows). You can also mount the MS-DOS boot disk
    and cp the file over. Although there’s no technological requirement for it, most
    disk-based kickstart installations install Red Hat Linux from a local CD-ROM.


    Network installations using kickstart are quite common, because system administrators
    can easily automate the installation on many networked computers quickly and painfully.
    In general, the approach most used is for the administrator to have a BOOT/DHCP
    server and an NFS server on the local network. The BOOT/DHCP server is used to
    give the client system its networking information, while the actual files used
    during the installation are served by the NFS server. Often, two servers run on
    the same physical machine, but there is no requirement for this.


    To do a network-based kickstart installation, you must have a BOOT/DHCP server
    on your network, and it must include configuration information for the machine
    on which you are attempting to install Red Hat Linux. The BOOT/DHCP server will
    be used to give the client its networking information as well as the location
    of the kickstart file.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Section F.3:Starting a Kickstart Installation


    If a kickstart file is specified by the BOOTP/DHCP server, the client system will
    attempt an NFS mount of the file''s path, and will copy the specified file to
    the client, using it as the kickstart file. The exact settings required vary depending
    on the BOOTP/DHCP server you use.


    Here''s an example of a line from the dhcpd.conf file for the DHCP server shipped
    with Red Hat Linux:


    ```

    filename="/usr/new-machine/kickstart/"

    next-server blarg.redhat.com;

    ```


    Note that you use filename for the kickstart file''s name (or the directory in
    which the kickstart files resides) and next-server to set the NFS server name.


    If the filename returned by the BOOTP/DHCP server ends with a slash ("/


    ```

    <ip-addr>-kickstart

    ```


    The <ip-addr> section of the filename should be replaced with the client''s IP
    address in dotted decimal notation. For example, the filename for a computer with
    an IP address of 10.10.0.1 would be 10.10.0.1-kickstart.


    Note that you do not specify a name, then the client system will attempt to use
    the server that answered the BOOTP/DHCP request as its NFS server. If you do not
    specify a path or filename, the client system will try to mount /kickstart from
    the BOOTP/DHCP server, and will try to find the kickstart file using the same
    <ip-addr>-kickstart filename as described.


    # F.3 Starting a Kickstart Installation


    To begin a kickstart installation, you must boot the system from a Red Hat Linux
    boot disk, and enter a special boot command at the boot prompt. If the kickstart
    file resides on the boot disk, the proper boot command would be:


    ```

    boot: linux ks=floppy

    ```'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Appendix F:Kickstart Installations


    If, on the other hand, the kickstart file resides on a server, the appropriate
    boot command would be:


    ```

    boot: linux ks

    ```


    Anaconda looks for a kickstart file if the ks command line argument is passed
    to the kernel. It can take a number of forms:


    # ks=floppy


    The installation program looks for the ks.cfg on a VFAT filesystem on the floppy
    in drive /dev/fd0.


    # ks=hd:<device/>


    The installation program will mount the filesystem on <device> (which must be
    VFAT or ext2), and look for the kickstart configuration file as <file> in that
    filesystem (for example, ks=hd:sda3/mydir/ks.cfg). This is normally used if the
    kickstart file is already on the initrd image.


    # ks=:/<file>


    The installation program will try to read the <file> from the filesystem; no mounts
    will be done. This is normally used if the kickstart file is already on the initrd
    image.


    # ks=fs:<server>:/path>


    The installation program will look for the kickstart file on the NFS server <server>,
    as file <path>. The installation program will use DHCP to configure the Ethernet
