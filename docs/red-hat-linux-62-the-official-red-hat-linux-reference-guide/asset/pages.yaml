    # 3.1.13 Filesystems


    A filesystem is composed of files and directories, all starting from a single
    root directory. The root directory may contain any number of files and other directories,
    with each directory in turn following suit. The average filesystem looks like
    an inverted tree with the directories as branches and the files as leaves. Filesystems
    reside on mass storage devices such as disk drives, hard drives, and CD-ROMs.


    For example, a disk drive on DOS and Windows machines is typically referred to
    as A:\ This describes both the device (A:), and the root directory on that device
    (\). The primary hard drive on the same systems is typically referred to as the
    "C" drive because the device specification for the first hard drive is C:\. To
    specify the root directory on the C drive, you would use C:\


    Under this arrangement, there are two filesystems -- the one on A:\, and the one
    on C:\. In order to specify any file on a DOS/Windows filesystem, you must either
    explicitly'
