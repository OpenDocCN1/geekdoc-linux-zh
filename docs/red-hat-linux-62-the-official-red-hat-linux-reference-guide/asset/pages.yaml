- pgno: 76
  md: '# Section 3.1:System Configuration with linuxconf


    # 3.1.2 Linuxconf User Interfaces


    Linuxconf has four user interfaces:


    +   - Text-based -- Using the same user interface style as the Red Hat Linux text-mode
    installation program, the text-based interface makes it easy to navigate your
    way through linuxconf if you aren''t running X. If you are running X, you can
    switch to a virtual console, log in as root, and type linuxconf to bring up text-mode
    linuxconf. Use the [Tab] and [arrow] keys to navigate the text-mode screens. A
    down arrow on a line indicates that a pull-down menu exists on that line. The
    [Ctrl]-[x] key combination will make pull-down menus appear.

    - Graphical user interface (GUI) -- linuxconf can take advantage of X, and give
    you an easy-to-use "point and click" tree interface (see Section 3.1.3, Tree Menu
    Interface for more information). Red Hat Linux includes a GUI interface for linuxconf
    called gnome-linuxconf.

    This document will display linuxconf screens using the gnome-linuxconf interface,
    but you shouldn''t have any trouble using the other interfaces with the instructions
    provided here.

    - Web-based -- A Web-based interface makes remote system administration a breeze;
    it can also be displayed with the Lynx text-mode browser.

    To use the Web-based interface, use your browser to connect to port 98 on the
    machine running linuxconf (i.e., http://your_machine:98).

    Before you use the Web-based interface, you''ll need to configure linuxconf to
    allow connections from the machine running the browser. See Section 3.1.4, Enabling
    Web-Based Access for instructions on enabling Web access to linuxconf.

    - Command line -- linuxconf''s command-line mode is handy for manipulating your
    system''s configuration in scripts.


    Linuxconf will start in either character-cell or X mode, depending on your DISPLAY
    environment variable. The first time you run linuxconf, an introductory message
    will be shown; although, it is only displayed once, accessing help from the main
    screen will give you the same basic information.'
  merge: -1
  img_proc: true
