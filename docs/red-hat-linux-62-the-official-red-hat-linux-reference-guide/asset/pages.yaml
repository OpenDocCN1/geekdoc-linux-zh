- pgno: 254
  md: "# Section 10.18:Authentication Configuration\n\n# Figure 10–33 Authentication\
    \ Configuration Dialog\n\n![](img/a62cd8edb5919f938a546de403f602c6_254_0.png)\n\
    \nHere's a brief explanation of the authentication password prompts:\n\n+   *\
    \ Use Shadow Passwords -- provides a very secure method of retaining passwords\
    \ for you. The password filled in the /etc/passwd is replaced by /etc/shadow which\
    \ is readable by root.\n\n+   * Enable MDS Passwords -- allows a long password\
    \ to be used (up to 256 characters) instead of the standard eight letters or less.\n\
    \n+   * Enable NIS -- allows you to run a group of computers in the same Network\
    \ Information Service domain with a common password and group file. There are\
    \ two options here to choose from:\n  * NIS Domain -- this option allows you to\
    \ specify which domain or group of computers your system will belong to."
  merge: -1
