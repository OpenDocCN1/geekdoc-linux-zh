- pgno: 204
  md: '# Section 10.1:The Installation Program User Interface


    # 10 Installing Red Hat Linux via Text Mode


    This release of Red Hat Linux features a graphical, mouse-based installation program,
    documented in the Official Red Hat Linux Installation Guide. But you can also
    install Red Hat Linux with a text mode, keyboard-based installation program. This
    chapter explains how to use it. Here are some recommendations:


    +   * If you''re new to Linux installations, read the Official Red Hat Linux Installation
    Guide first. Although it focuses on the graphical installation process, most of
    the concepts apply to the text mode installation as well. After that, you''ll
    find Chapter 9, Preparing for a Text Mode Installation, Preparing for a Text Mode
    Installation, will give you in-depth information regarding those aspects of installing
    Red Hat Linux that do not apply to the graphical installation.

    * Additionally, you''ll find Appendix B, An Introduction to Disk Partitions, An
    Introduction to Disk Partitions, helpful, as it discusses disk partition resizing
    (cial if you plan to install Linux on a disk where other system is currently installed).

    * If you need PCMCIA support to perform the installation (for example, you''re
    installing on a laptop equipped with a PCMCIA card), you must make a PCMCIA boot
    disk. The Official Red Hat Linux Installation Guide explains how to do this.

    * If you need to install over a network (via NFS, FTP, or HTTP), you must make
    a network boot disk. The Official Red Hat Linux Installation Guide explains how
    to do this.

    * If you''ve never used the text mode installation program, or need a refresher
    on its user interface, read the next section.

    * To begin installation without further delay, turn to Section 10.2, Starting
    the Installation Program.


    # 10.1 The Installation Program User Interface


    The Red Hat Linux text mode installation program uses a screen-based interface
    that includes most of the on-screen ''widgets'' commonly found on graphical user
    interfaces. Figure 10–1, Installation Program Widgets as seen in Configure TCP/IP
    and'
  merge: -1
  img_proc: true
