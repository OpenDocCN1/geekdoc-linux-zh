    # 2.1.2 /usr/local in Red Hat Linux


    In Red Hat Linux, the intended use for /usr/local is slightly different from that
    specified by the FHS. The FHS says that /usr/local should be where you store software
    that is to remain safe from system software upgrades. Since system upgrades from
    Red Hat are done safely with the RPM system and Gnome-RPM, you don''t need to
    protect files by putting them in /usr/local. Instead, we recommend you use /usr/local
    for software that is local to your machine.


    For instance, let''s say you mentioned /usr via read-only NFS from beavis. If
    there is a package or program you would like to install, but you are not allowed
    to write to beavis, you should install it under /usr/local. Later perhaps, if
    you''ve managed to convince the system administrator of beavis to install the
    program on /usr, you can uninstall it from /usr/local.


    # 2.2 Special Red Hat File Locations


    In addition to the files pertaining to the RPM system that reside in /var/lib/rpm
    (see Chapter 6, Package Management with RPM for more information on RPM), there
    are two other special locations that are reserved for Red Hat Linux configuration
    and operation.'
