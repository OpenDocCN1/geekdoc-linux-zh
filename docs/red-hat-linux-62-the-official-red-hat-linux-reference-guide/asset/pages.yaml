- pgno: 196
  md: '# Section 9.1:Things You Should Know


    # 9 Preparing for a Text Mode Installation


    # 9.1 Things You Should Know


    Before attempting to install Red Hat Linux, you should collect some system information
    in order to prevent any surprises during the installation. You can find most of
    this information in the documentation that came with your system, or from the
    system’s vendor or manufacturer.


    The most recent list of hardware supported by Red Hat Linux can be found at http://www.redhat.com/hardware.
    It’s a good idea to check your hardware against this list before proceeding.


    > Please Note

    You can perform a text mode installation of Red Hat Linux 6.2 by following instructions
    in this chapter and in Chapter 10, Installing Red Hat Linux via Text Mode. However,
    if you''re installing from a CD-ROM, you might prefer to use the graphical installation
    mode, which offers both ease of use and a flexible, custom-class installation
    mode. For more information on graphical installations, turn to the Official Red
    Hat Linux Installation Guide.


    > Tip

    At the end of the Before You Begin chapter in the Official Red Hat Linux Installation
    Guide is a table for you to fill out with your specific system requirements, which
    will help you keep up with any information you will need during installation.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Chapter 9:Preparing for a Text Mode Installation


    # 9.1.1 Basic Hardware Configuration


    You should have a basic understanding of the hardware installed in your computer,

    including:


    +   - hard drive(s) -- Specifically, the number, size, and type. If you have more
    than

    one, it is helpful to know which one is first, second, and so on. It is also good
    to

    know if your drives are IDE or SCSI. If you have IDE drives, you should check

    y computer''s BIOS to see if you are accessing them in linear mode. Please

    refer to your computer''s documentation for the proper key sequence to access

    t BIOS. Note that your computer''s BIOS may refer to linear mode by other

    names, such as "large disk mode." Again, your computer''s documentation should

    be consulted for clarification.

    - memory -- The amount of RAM installed in your computer.

    - CD-ROM -- Most importantly, the unit''s interface type (IDE, SCSI, or other

    interface) and, for non-IDE, non-SCSI CD-ROMs, the make and model number.

    IDE CD-ROMs (also known as ATAPI) are the most common type in recently

    manufactured, PC-compatible computers.

    - SCSI adapter (if one is present) -- The adapter''s make and model number.

    - network card (if one is present) -- The card''s make and model number.

    - mouse -- The mouse''s type (serial, PS/2, or bus mouse), protocol (Microsoft,

    Logitech, MouseMan, etc.), and number of buttons; also, for mice, the serial

    port it is connected to.


    On many newer systems, the installation program is able to automatically identify

    most hardware. However, it''s a good idea to collect this information anyway,
    just to

    be sure.


