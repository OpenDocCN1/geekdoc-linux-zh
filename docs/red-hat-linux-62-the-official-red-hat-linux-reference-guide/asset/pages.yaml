- pgno: 294
  md: '# Section B.1:Hard Disk Basic Concepts


    # B An Introduction to Disk Partitions


    Disk partitions are a standard part of the personal computer landscape, and have
    been for quite some time. However, with so many people purchasing computers featuring
    preinstalled operating systems, relatively few understand how partitions work.
    This chapter attempts to explain how disk partitions work so you''ll find your
    Red Hat Linux installation is as simple as possible.


    If you''re reasonably comfortable with disk partitions, you could skip ahead to
    Section B.1.4, Making Room For Red Hat Linux for more information on the process
    of freeing up disk space to prepare for a Red Hat Linux installation. This section
    also discusses the partition naming scheme used by Linux systems, sharing disk
    space with other operating systems, and related topics.


    # B Hard Disk Basic Concepts


    Hard disks perform a very simple function -- they store data and reliably retrieve
    it on command.


    When discussing issues such as disk partitioning, it''s important to know a bit
    about the underlying hardware; unfortunately, it''s easy to become bogged down
    in details. Therefore, let''s use a simplified diagram of a disk drive to help
    us explain what goes on "under the hood." Figure B–1, An Unused Disk Drive shows
    a brand-new, unused disk drive.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Figure B–1 An Unused Disk Drive


    ![](img/a62cd8edb5919f938a546de403f602c6_295_0.png)


    Not much to look at, is it? But if we''re talking about disk drives on a basic
    level, it will do. Let''s say that we''d like to store some data on this drive.
    As things stand now, it won''t work. There''s something we need to do first...


    # B.1.1 It''s Not What You Write, it''s How You Write It


    The old-timers in the audience probably got this one on the first try. We need
    to **format** the drive. Formatting (usually known as "making a **filesystem**"
    in Linux parlance) writes information to the drive, creating order out of the
    empty space in an unformatted drive.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Section B.1:Hard Disk Basic Concepts


    Figure B–2 Disk Drive with a Filesystem


    ![](img/a62cd8edb5919f938a546de403f602c6_296_0.png)


    As Figure B–2, Disk Drive with a Filesystem implies, the order imposed by a filesystem
    involves some tradeoffs:


    +   - A small percentage of the drive’s available space is used to store filesystem-related
    data, and can be considered as overhead.


    +   - A filesystem splits the remaining space into small, consistently-sized segments.
    In the Linux world, these segments are known as blocks. 1


    Given that filesystems make like directories and files possible, these tradeoffs
    are usually seen as a small price to pay.


    It’s also worth noting that there is no single, universal filesystem; as Figure
    B–3, Disk Drive with a Different Filesystem shows, a disk drive may have one of
    many different filesystems written on it. As you might guess, different filesystems
    tend


    > 1 Blocks really are consistently sized, unlike our illustrations. Keep in mind,
    also, that an average disk drive contains thousands of blocks. But for the purposes
    of this discussion, please ignore these minor discrepancies.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'to be incompatible; that is, an operating system that supports one filesystem
    (or a handful of related filesystem types) may not support another. This last
    statement is not a hard-and-fast-rule, however. For example, Red Hat Linux supports
    a wide variety of filesystems (including many commonly used by other operating
    systems), making data interchange easy.


    # Figure B–3 Disk Drive with a Different Filesystem


    ![](img/a62cd8edb5919f938a546de403f602c6_297_0.png)


    Of course, writing a filesystem to disk is only the beginning. The goal of this
    process is to actually store and retrieve data. Let’s take a look at our drive
    after some files have been written to it.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Section B.1:Hard Disk Basic Concepts


    Figure B–4 Disk Drive with Data Written to It


    ![](img/a62cd8edb5919f938a546de403f602c6_298_0.png)


    As Figure B–4, Disk Drive with Data Written to It shows, 14 of the previously-empty
    blocks are now holding data. We cannot determine how many files reside on this
    drive; it may be as few as one or as many as 14, as all files use at least one
    block. Another important point to note is that the used blocks do not have to
    form a contiguous region; used and unused blocks may be interspersed. This is
    known as fragmentation. Fragmentation can play a part when attempting to resize
    an existing partition.


    As with most computer-related technologies, disk drives continued to change over
    time. They changed in one specific way -- they got bigger. Not bigger in size,
    but bigger in capacity. And it was this additional capacity that drove a change
    in the way disk drives were used.


    # B.1.2 Partitions – Turning One Drive Into Many


    As disk drive capacities soared, some people started wondering if having all that
    space in one big chunk wasn’t such a great idea. This line of thinking was driven
    by several'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'issues, some philosophical, some technical. On the philosophical side, above
    a certain size, it seemed that the additional space provided by a larger drive
    created more clutter. On the technical side, some filesystems were never designed
    to support larger drives. Or the filesystems could support larger drives, but
    the overhead imposed by the filesystem became excessive.


    The solution to this problem was to divide disks into partitions. Each partition
    can be accessed as if it was a separate disk. This is done through the addition
    of a partition table.


    # Please Note


    While the diagrams in this chapter show the partition table as being separate
    from the actual disk drive, this is not entirely accurate. In reality, the partition
    table is stored at the very start of the disk, before any filesystem or user data.
    But for clarity, we''ll keep it separate in our diagrams.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Section B.1:Hard Disk Basic Concepts


    Figure B–5 Disk Drive with Partition Table


    ![](img/a62cd8edb5919f938a546de403f602c6_300_0.png)


    As Figure B–5, Disk Drive with Partition Table shows, the partition table is divided
    into four sections. Each section can hold the information necessary to define
    a single partition, meaning that the partition table can define no more than four
    partitions. Each partition table entry contains several important characteristics
    of the partition:


    +   - The points on the disk where the partition starts and ends;

    - Whether the partition is “active";

    - The partition’s type.


    Let’s take a closer look at each of these characteristics. The starting and ending
    points actually define the partition’s size and location on the disk. The “active”
    flag is used by some operating systems'' boot loaders. In other words, the operating
    system in the partition that is marked “active” will be booted.


    The partition’s type can be a bit confusing. The type is a number that identifies
    the partition’s anticipated usage. If that statement sounds a bit vague, that’s
    because the'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Appendix B:An Introduction to Disk Partitions


    meaning of the partition type is a bit vague. Some operating systems use the partition
    type to denote a specific filesystem type, to flag the partition as being associated
    with a particular operating system, to indicate that the partition contains a
    bootable operating system, or some combination of the three.


    Table B–1, Partition Types contains a listing of some popular (and obscure) partition
    types, along with their numeric values.


    # Table B–1 Partition Types


    | Partition Type | Value | Partition Type | Value |

    |---|---|---|--|

    | Empty | 00 | Novell Netware 386 | 65 |

    | DOS 12-bit FAT | 01 | PIC/IX | 75 |

    | XENIX root | 02 | Old MINIX | 80 |

    | XENIX usr | 03 | Linux/MINUX | 81 |

    | DOS 16-bit <=32M | 04 | Linux swap | 82 |

    | Extended | 05 | Linux native | 83 |

    | DOS 16-bit >=32 | 06 | Linux extended | 85 |

    | OS/2 HPFS | 07 | Amoeba | 93 |

    | AIX | 08 | Amoeba BBT | 94 |

    | AIX bootable | 09 | BSD/386 | a5 |

    | OS/2 Boot Manager | 0a | OpenBSD | a6 |

    | Win95 FAT32 | 0b | NEXTSTEP | a7 |

    | Win95 FAT32 (LBA) | 0c | BSDI fs | b7 |

    | Win95 FAT16 (LBA) | 0e | BSDI swap | b8 |

    | Win95 Extended (LBA) | 0f | Syrinx | c7 |

    | Venix 80286 | 40 | CP/M | db |

    | Novell? | 51 | DOS access | e1 |'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Section B.1:Hard Disk Basic Concepts


    | Partition Type | Value | Partition Type | Value |

    |---|---|---|--|

    | Microport | 52 | DOS R/O | e3 |

    | GNU HURD | 63 | DOS secondary | f2 |

    | Novell Network 286 | 64 | BBT | ff |


    Now you might be wondering how this additional complexity is normally used. See
    Figure B–6, *Disk Drive With Single Partition* for an example.


    # Figure B–6 Disk Drive With Single Partition


    ![](img/a62cd8edb5919f938a546de403f602c6_302_0.png)


    That’s right -- in many cases there is but a single partition spanning the entire
    disk, essentially duplicating the pre-partitioned days of yore. The partition
    table has only one entry used, and it points to the start of the partition.


    We’ve labeled this partition as being of type "DOS," although as you can see Table
    B–1, *Partition Types*, that’s a bit simplistic, but adequate for the purposes
    of this discussion. This is a typical partition layout for most newly purchased
    computers with some version of Windows pre-installed.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# B.1.3 Partitions within Partitions – An Overview of Extended Partitions


    Of course, in time became obvious that four partitions would not be enough. As
    disk drives continued to grow, it became more and more likely that a person could
    configure four reasonably-sized partitions and still have disk space left over.
    There needed to be some way of creating more partitions.


    Enter the extended partition. As you may have noticed in Table B–1, Partition
    Types, there is an "Extended" partition type; it is this partition type that is
    at the heart of extended partitions. Here’s how it works.


    When a partition is created and its type is set to "Extended," an extended partition
    table is created. In essence, the extended partition is like a disk drive in its
    own right -- it has a partition table that points to one or more partitions (now
    called logical partitions, as opposed to the four primary partitions) contained
    entirely within the extended partition itself. Figure B–7, Disk Drive With Extended
    Partition shows a disk drive with one primary partition, and one extended partition
    containing two logical partitions (along with some unpartitioned free space).'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Section B.1:Hard Disk Basic Concepts


    Figure B–7 Disk Drive With Extended Partition


    ![](img/a62cd8edb5919f938a546de403f602c6_304_0.png)


    As this figure implies, there is a difference between primary and logical partitions
    -- there can only be four primary partitions, but there is no fixed limit to the
    number of logical partitions that can exist. (However, in reality it probably
    not a good idea to define and use more than 12 logical partitions on a single
    disk drive.)


    Now that we''ve discussed partitions in general, let''s see how to use this knowledge
    to get Red Hat Linux installed.


    # B.1.4 Making Room For Red Hat Linux


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    +   - Unpartitioned free space is available.

    - An unused partition is available.

    - Free space in an actively used partition is available.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Appendix B:An Introduction to Disk Partitions


    Let’s look at each scenario in order.


    # Please Note


    Please keep in mind that the following illustrations are simplified in the interest
    of clarity, and do not reflect the exact partition layout that you will encounter
    when actually stalling Red Hat Linux.


    # Using Unpartitioned Free Space


    In this situation, the partitions already defined do not span the entire hard
    disk, leaving unallocated space that is not part of any defined partition. Figure
    B–8, Disk Drive with Unpartitioned Free Space shows what this might look like.


    Figure B–8 Disk Drive with Unpartitioned Free Space


    ![](img/a62cd8edb5919f938a546de403f602c6_305_0.png)


    If you think about it, an unused hard disk also falls into this category; the
    only difference is that all the space is not part of any defined partition.'
