    +   * The preferred display mode (see Figure 10–43, Select Video Modes Dialog).
    Select one or more modes by pressing [Space].


    Xconfigurator then saves all of your choices to the configuration file /etc/X11/X86Config.
    To modify your X configuration after installation, as root issue the Xconfigurator
    command.


    # 10.23 Creating a Boot Disk


    If you are performing a custom-class installation, the Bootdisk dialog (see Figure
    10–47, Creating a Boot Disk) gives you the opportunity to create a customized
