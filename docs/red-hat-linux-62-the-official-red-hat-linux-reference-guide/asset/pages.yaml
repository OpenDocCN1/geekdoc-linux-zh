    ![](img/a62cd8edb5919f938a546de403f602c6_81_0.png)


    # Base info for User Accounts


    The **Login name** is the name of the account and is usually all lowercase letters.
    First or last names, or some combination thereof are fairly common login names.
    For a user named John T. Smith, **smith, smith, jts, or jsmith** would be common
    user names. Of course use **spike** or something else works fine, too. You can
    also use numbers, **jts2** would be fine if you had a second person with the same
    initials. There is no default for this field.


    The **Full name** is the name of the user or the account. For an individual, it
    would be their name, **John T. Smith** for example. If the account represents
    a position rather than a person, the full name might be the title. So an account
    called **webmaster** might have a full name of **Red Webmaster** or just **Webmaster**.
    There is no default for this field.


    Since Red Linux uses the User Private Group scheme, each user will be assigned
    to a default group consisting only of the user. For more information on User Private
    Groups, see **Section 2.3.3,**, *User Private Groups*.'
