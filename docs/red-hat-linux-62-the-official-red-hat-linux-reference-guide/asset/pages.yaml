- pgno: 306
  md: '# Section B.1:Hard Disk Basic Concepts


    In any case, you can simply create the necessary partitions from the unused space.
    Unfortunately, this scenario, although very simple, is not very likely (unless
    you''ve just purchased a new disk just for Red Hat Linux).


    Let''s move on to a slightly more common situation.


    # Using Space From An Unused Partition


    In this case, you may have one or more partitions that you just don''t use anymore.
    Perhaps you''ve dabbled with another operating system in the past, and the partition(s)
    you''ve dedicated to it never seem to be anymore. Figure B–9, Disk Drive With
    an Unused Partition illustrates such a situation.


    # Figure B–9 Disk Drive With an Unused Partition


    ![](img/a62cd8edb5919f938a546de403f602c6_306_0.png)


    If you find yourself in this situation, you can use the space allocated to the
    unused partition. You''ll first need to delete the partition, and then create
    the appropriate Linux partition(s) in its place. You can either delete the partition
    using DOS fdisk, or you''ll be given the opportunity to do so during a custom-class
    installation.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Using Free Space From An Active Partition


    This is the most common situation. It is also, unfortunately, the hardest to work
    with. The main problem is that, even if you have free space, it''s precisely allocated
    to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk most likely has one massive partition holding the operating
    system and data.


    Aside from adding a new hard drive to your system, you have two choices:


    # Destructive Repartitioning


    +   Basically, you delete the single large partition, and create several smaller
    ones. As you might imagine, any data you had in the original partition is destroyed.
    This means that making a complete backup is necessary. For your own sake, make
    two backups, use verification (if available in your backup software), and try
    to read data from your backup before you delete the partition. Note also that
    if there was an operating system of some type installed on that partition, it
    will need to be reinstalled as well.


    After creating a smaller partition for your existing software, you can reinstall
    any software, restore your data, and continue with your Red Hat Linux installation.
    Figure B–10, Disk Drive Being Destructively Repartitioned shows this being done.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Section B.1:Hard Disk Basic Concepts


