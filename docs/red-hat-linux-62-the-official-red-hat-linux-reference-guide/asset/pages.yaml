    When you click on Accept linuxconf will prompt you to enter the password, as in
    Figure 3–5, Change Password Screen. You’ll have to re-type the password, to prevent
    unusable passwords caused by typos. Passwords must be at least six characters
    in length, but you can increase the length and set other parameters for users’
    passwords at the Users Accounts => Password & Account Policies screen.


    Good passwords contain a combination of letters, numbers, and special characters.
    It should use both upper case and lower case letters. Don’t use your username,
    your anniversary, your social security number, your dog’s name, your middle name
    or the root word. Don’t use any variation of a word associated with your account
    or yourself. Don’t use a word that can be found in a dictionary; dictionary words
    are easy to create.


    A simple technique for creating a password is to familiar to you the first letters
    from each word of a phrase (a line from a favorite song might be appropriate).
    Make a few letters uppercase, and insert a few numbers and/or special characters
    in place of letters and you’ll have a decent password.'
