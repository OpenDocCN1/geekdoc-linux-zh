- pgno: 201
  md: '# 9.1.2 Video Configuration


    If you will be installing the X Window System, you should also be familiar with
    the following:


    +   - your video card -- The card''s make and model number (or the video chipset
    it uses), and the amount of video RAM it. (Most PCI-based cards are auto-detected
    by the installation program.)

    - your monitor -- The unit''s make and model number, along with allowable ranges
    for horizontal and vertical refresh rates. (Newer models may be auto-detected
    by the installation program)


    # 9.1.3 Network-related Information


    If you are connected to a network, be sure you know the following:


    +   - IP address -- Usually represented as a set of four numbers separated by
    dots, such as 10.0.2.15.

    - netmask -- Another set of four numbers separated by dots. An example netmask
    would be 255.255.248.0.

    - gateway IP address -- Yet another set of four dot-separated numbers. For instance,
    10.0.2.254.

    - one or more name server IP addresses -- One or more sets of dot-separated numbers.
    For example, 10.0.2.1 might be the address of a name server.

    - domain name -- The name your organization uses. For instance, Red Hat has a
    domain name of redhat.com.

    - hostname -- The name assigned to your individual system. A computer might be
    named pooh, for instance.'
  merge: -1
  img_proc: true
