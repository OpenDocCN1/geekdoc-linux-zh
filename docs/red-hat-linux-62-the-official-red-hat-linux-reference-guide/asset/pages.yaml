- pgno: 200
  md: '# Section 9.1:Things You Should Know


    # Please Note


    In some cases, there may be no CD-ROM icon, your computer has a functioning CD-ROM
    drive. This is normal, depending on how Windows was originally installed. In this
    case, you may be able to learn additional information by looking at the CD-ROM
    driver loaded in your computer''s config.sys file.


    +   - Mouse -- The type of mouse present on your computer can be found here.

    - Display adapters -- If you''re interested in running the X Window System, you
