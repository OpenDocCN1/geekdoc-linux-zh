- pgno: 90
  md: '# # Section 3.1:System Configuration with linuxconf


    # ## 3.1.12 Groups


    All users belong to one or more groups. Just as each file has a specific owner,
    each file belongs to a particular group as well. The group might be specific to
    the owner of the file, or may be a group shared by all users. The ability to read,
    write or execute a file can be assigned to a group; this is separate from the
    owner''s rights. For example, the owner of a file will be able to write to a document,
    while other group members may only be able to read it.


    # ## Creating a Group


