  md: '# Chapter 5:Working with Update Agent


    +   - Do not replace config files -- Packages which contain configuration files
    that are modified on your system will not be selected for updating. Let''s say,
    example, that you''ve modified the /etc/syslog.conf configuration file. If there
    is an update available for syslogd, which would create a new /etc/sys.conf file,
    this package will not be downloaded and installed. If you haven''t modified the
    configuration file on your system, it will be available for downloading and installation
    -- and the previous file will be backed up (in this case, as /etc/syslog.conf.rpmsave).


    +   - Display all available packages -- Select this box if you want Update Agent
    to show you all available packages, not just the packages specific to your installed
    system.


    +   - Retrieve packages -- By default, this option is selected. If this option
    is selected, Update Agent only downloads packages into a temporary directory.
    Once downloaded, you will be able to install the packages yourself. If this option
    is unchecked, Update Agent will download and automatically install your selections.
    Uncheck this option, to both download and install updated packages; to install
    the packages yourself, refer to the location specified in the Package directory
    at the bottom of the location.


    +   - Keep packages after installation -- Retains the package files after they''ve
    been installed. This could be useful if you want to keep copies of packages, however
    selecting this could potentially eat quite a bit of disk space.


    +   - Attempts to resolve dependencies -- The value associated with this option
    instructs Update Agent on the number of times to check for possible dependency
    problems with selected packages. The value ranges from 1 to 10, and can be adjusted
    by using the scroll buttons on the side of the box. The higher the value, the
    greater the number of dependency checks before your update packages are installed.


    Beyond the package options, two additional boxes allow you to specify the version
    of Red Hat Linux files you want to update, and the location where upgrade will
    be kept.


    The drop-down menu for Override version will show you a current or previous versions
    of Red Hat Linux. Most users will probably retain the default entry, which is
    Red Hat Linux 6.2. If no value is specified, the proper value will automatically
    be determined.'
