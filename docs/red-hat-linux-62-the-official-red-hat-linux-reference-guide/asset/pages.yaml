    # 8.9 Configuring Your System to Authenticate Using OpenLDAP


    This section provides a brief overview of how to configure your Red Hat Linux
    system to authenticate using OpenLDAP. Unless you''re an OpenLDAP expert, you
    will probably need more documentation than is provided here. Please refer to the
    references provided in Section 8.10, LDAP Resources on the Web for more information.


    # 8.9.1 Install the Necessary LDAP Packages


    First, you''ll need to make sure that the appropriate packages are installed on
    both the LDAP server and the LDAP client machines. The LDAP server needs the openldap
    package.


    The LDAP client machines need the following packages installed: openldap, auth_ldap,
    nss_ldap and pam_ldap.


    # 8.9.2 Edit Configuration Files /etc/openldap/slapd.conf


    The slapd conf file, located in /etc/openldap, contains the configuration information
    needed by your slapd LDAP server. You''ll need to edit this file to make it specific
    to your domain and server.


    The suffix line names the domain for which the LDAP server will provide information.
    The suffix line should be changed from:


    ```

    suffix "dc=your-domain, dc=com"

    ```


    so that it reflects your domain name. For example:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Chapter 8:Lightweight Directory Access Protocol (LDAP)


    suffix "dc=acewidgets, dc=com"


    or


    suffix "dc=acmeuniversity, dc=org"


    The rootdn entry is the DN for a user who is unrestricted by the access control
    or administrative limit parameters set for operations on the LDAP directory. The
    rootdn user can be thought of as the root user for the LDAP directory. The rootdn
    line needs to be changed from:


    ```

    rootdn "cn=root, dc=your-domain, dc=com"

    ```


    to something like:


    ```

    rootdn "cn=root, dc=redhat, dc=com"

    ```


    or


    ```

    rootdn "cn=ldapmanager, dc=my_organization, dc=org"

    ```


    Change the rootpw line from:


    ```

    rootpw secret

    ```


    to something like:


    ```

    rootpw {crypt}s4L9sOI4kBM

    ```


    In the example, you''re using an encrypted root password, which is a much better
    idea than leaving a plain text password in the slapd.conf file. To make this crypt
    string, you should copy it out of a passwd file, or use Perl:


    ```

    perl -e "print crypt(''password'',''a_salt_string'');",

    ```


    In the previous Perl line, salt_string is a two character salt, and passwd is
    the plain version of the password.


    You could also copy a passwd entry out of /etc/passwd, but this won''t work if
    the passwd entry is an MD5 password (the default in Red Hat Linux 6.2).


    # Edit ldap.conf


    Edit the ldap.conf files in /etc and in /etc/openldap on the LDAP server and clients.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Section 8.9:Configuring Your System to Authenticate Using OpenLDAP 191


    Edit /etc/ldap.conf, the configuration file for nss_ldap and pam_ldap, to reflect
    your organization and search base. The file /etc/openldap/ldap.conf is the configuration
    file for the command line tools like ldsearch, ldapadd, etc., and it will also
    be edited for your LDAP setup. Client machines will need to have both of these
    files modified for your system.


    # Edit /etc/nsswitch.conf


    To use nss_ldap, you will need to add ldap to the appropriate fields in /etc/nsswitch.conf.
    (Be very careful when editing this file; be sure you know what you''re doing.)
    For example:


    ```

    passwd: files ldap

    shadow: files ldap

    group: files ldap

    ```


    # Copy the PAM Configuration Files


    To use pam_ldap, you will need to copy the PAM configuration files from /usr/doc/nss_ldap<version>/pam.d/
    to your /etc/pam.d/ directory. These are a set of PAM configuration files that
    allow all of the standard PAM-enabled applications to use LDAP for authentication.
    (PAM is beyond the scope of this LDAP overview, so if you need help, consult Section
    2.6, User Authentication with PAM and/or PAM man pages.)


    # 8.9.3 Migrate Your Old Authentication Information to LDAP Format


    The /usr/share/openldap/migration directory contains a set of shell and Perl scripts
    for migrating your old authentication information into LDAP format. (Yes, you
    will need to perform on your system to use these scripts.)


    First, you will need to modify the migrate_common.ph file so that it reflects
    your domain. The default DNS domain should be changed from:


    ```

    DEFAULT_MAIL_DOMAIN = "padl.com";

    ```


    to something like:


    ```

    DEFAULT_MAIL_DOMAIN = "your_company.com";

    ```


    The default base should also be changed, from:'
  merge: -1
