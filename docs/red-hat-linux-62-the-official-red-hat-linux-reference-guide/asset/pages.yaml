- pgno: 274
  md: '# Section A.1:A Note About Kernel Drivers


    # A General Parameters and Modules


    This appendix is provided to illustrate some of the parameters that may be needed
    by certain drivers. It should be noted that, in most cases, these additional parameters
    are unnecessary. Also included is a list of network hardware and the associated
    modules required by that hardware.


    Keep in mind that if a device you are attempting to use one of these parameters,
    and support for device is not compiled into the kernel, the traditional method
    of adding the parameter to the LILO boot command will not work. Drivers loaded
    as modules require that these parameters are specified when the module is loaded.
    The Red Hat installation program gives you the option to specify module parameters
    when a driver is loaded.


    # A.1 A Note About Kernel Drivers


    During installation of Red Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all filesystems available under Linux. At install time the modularized
    kernel has support for (E)IDE devices, including ATAPI CD-ROM drives), SCSI adapters,
    and network cards. Additionally, all mice, SLIP, CSLIP, PPP, PLIP, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.


    > Because Red Linux supports installation on many different types of hardware,
    many drivers (including those for SCSI adapters, network cards, and many CD-ROMs)
    are not built into the kernel used during installation; they are available as
    modules and loaded as you need them during the installation process. If necessary,
    you will have the chance to specify options for these modules at the time they
    are loaded, and in fact these drivers will ignore any options you specify for
    them at the boot: prompt.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Appendix A:General Parameters and Modules


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See Section 2.8, Building a
    Custom Kernel for information on building a customized kernel. Note that, in most
    cases, a custom-built kernel is not necessary.


    # A.2 CD-ROM Module Parameters


    # Please Note


    Not all of the cards that are listed are supported. Please check the hardware
    compatibility list on Red Hat''s World Wide Web site at http://www.redhat.com/support/docs/hardware.html
    to make sure your card is supported.


    One of the more commonly used parameters, the hdX=cdrom parameter, can be entered
    at the boot prompt, as it deals with support for IDE/ATAPI CD-ROMs, which is part
    of the kernel.


    In the tables below, most modules without any parameters listed are either able
    to auto-probe to find the hardware, or require you to manually change settings
    in the module source code, and recompile.


    # Table A-1 Hardware Parameters


    | Hardware | Module | Parameters |

    | --- | --- | --- |

    | ATAPI/IDE CD-ROM Drives | | hdX=cdrom |

    | Aztech CD268-01A, Orchid CD-3110, Okano/Wearnes CDD1110, Conrad TXC, CyCDROM
    CR520, CyCDROM CR540 (non-IDE) | aztcd.o | aztcd=io_port |'
  merge: -1
