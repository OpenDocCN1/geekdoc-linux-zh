    # 6.3 Impressing Your Friends with RPM


    RPM is a very useful tool for both managing your system and fixing problems. The
    best way to make sense of all the options is to look at some examples.


    +   - Let’s say you delete some files by accident, but you aren’t sure what you
    deleted. If you want to verify your entire system and see what might be missing,
    you would enter:

    ```

    rpm -Va

    ```


    If some files are missing, or appear to have been corrupted, you should probably
    re-install the package or uninstall, then re-install the package.


    +   - Let’s say you run across a file that you don’t recognize. To find which
    package owns it, you would enter:

    ```

    rpm -qf /usr/X11R6/bin/xjewel

    ```


    The output would look like:


    ```

    xjewel-1.6-1

    ```'
