    Not Probe. This option is provided because an unsuccessful probe of your video
    card could cause your system not to boot properly or a program to hang.


    While the probe is in progress, it is normal for your display to blink.


    When the probe is finished, Figure 10–42, Probing Finished appears, displaying
    the results of the probe.


    Figure 10–42 Probing Finished


