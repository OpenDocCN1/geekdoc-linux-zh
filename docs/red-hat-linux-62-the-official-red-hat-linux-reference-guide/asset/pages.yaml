- pgno: 269
  md: '# Chapter 10:Installing Red Hat Linux via Text Mode


    # Figure 10–47 Creating a Boot Disk


    ![](img/a62cd8edb5919f938a546de403f602c6_269_0.png)


    A boot disk can be handy in these situations:


    +   - Use Instead of LILO -- You can use a boot disk instead of LILO. If you''re
    trying Red Hat Linux for the first time, and you''d feel more comfortable if the
    process for your other operating system is left unchanged. With a boot disk, going
    back to your other operating system is as easy as removing the boot disk and rebooting.

    - Use It When Another Operating System Overwrites LILO -- Other operating systems
    may not be as flexible as Red Hat Linux when it comes to supported boot methods.
    Often, installing or updating another operating system can cause the master boot
    record (originally containing LILO) to be overwritten, making it impossible to
    boot your Red Hat Linux installation. The boot disk can then be used to boot Red
    Hat Linux so you can reinstall LILO.


    Select Yes and press [Space] to create a boot disk. Next, you''ll be prompted
    to insert a blank, formatted diskette.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Section 10.24:Finishing Up


    Figure 10–48 Boot Disk Dialog


    ![](img/a62cd8edb5919f938a546de403f602c6_270_0.png)


    For instructions on how to create a boot disk after the installation, read the
    mkboot-disk man page. Be sure you create a new boot disk if you make any changes
    to your kernel.


    # 10.24 Finishing Up


    When finished, the installation program displays the Complete dialog (as in Figure
    10–49, Compete Dialog), telling you to reboot your computer. Remove any diskette
    from the diskette drive (unless you skipped the LILO installation, in which case
    you must use the boot disk created during the installation), or the Red Hat Linux
    CD if your system booted from the CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Chapter 10:Installing Red Hat Linux via Text Mode


    # Figure 10–49 Compete Dialog


    ![](img/a62cd8edb5919f938a546de403f602c6_271_0.png)


    Select OK to reboot your newly installed system. After your computer''s normal

    power-up sequence has completed, you should see LILO''s standard boot: prompt,

    at at which you can do any of the following:


    +   - Press [Enter] -- Causes LILO''s default boot entry (as seen in Figure 10–25,
    Selecting Bootable Partitions in LILO Configuration Dialog) to be booted.

    - Enter a Boot Label, followed by [Enter] -- Causes LILO to boot the operating

    system corresponding to the boot label.

    - Wait -- After LILO''s timeout period (which, by default, is five seconds) LILO

    will automatically boot the default boot entry.


    Whatever is appropriate to boot Red Hat Linux. You should see one or more

    screens of messages scroll by. Eventually, you should see either a graphical login

    screen, or a login: prompt.


    Congratulations! Your Red Hat Linux installation is complete!'
  merge: -1
