- pgno: 357
  md: '# Appendix F:Kickstart Installations


    ```

    raid <mntpoint> --level <level> --device

    <mddevice><<partitions>*>

    ```


    The <mntpoint> is the location to mount the RAID filesystem. If it is /, the RAID
    level must be 1 unless a boot partition (/boot) is present in which the /boot
    partition has to be level 1 and the root (/) can be any of the available types.
    The <partitions*> (which denotes that multiple partitions can be listed) lists
    the RAID identifiers to add to the RAID array.


    --level<level>


    RAID level to use (0, 1, or 5).


    --device <mddevice>


    Name of the RAID device to use (such as md0 or m1). RAID devices range from md0
    to md7, and each may only be used once.


    Here''s an example of how to create a RAID level 1 partition for /, and a RAID
    level 5 for /usr, assuming there are three SCSI disks on the system. It also creates
    three swap partitions, one on each drive.


    ```

    part raid.01 --size 60 --ondisk sda

    part raid.02 --size 60 --ondisk sdb

    part raid.03 --size 60 --ondisk sdc

    ```


    ```

    part swap --size 128 --ondisk sda part swap --size 128 --ondisk

    dbd part swap --size 128 --ondisk sdc

    ```


    ```

    part raid.11 --size 1 --grow --ondisk sda part raid.12 --size 1

    --grow --ondisk sdb part raid.13 --size 1 --grow --ondisk sdc

    ```


    ```

    raid / --level 1 --device md0 raid.01 raid.02 raid.03 raid /usr

    --level 5 --device md1 raid.11 raid.12 raid.13

    ```


