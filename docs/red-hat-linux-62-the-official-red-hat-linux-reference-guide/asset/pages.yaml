  md: '# Section F.4:The Kickstart File


    +   - If DHCP is specified and the "bootfile" begins with something other than
    a /, that file is looked for in the /kickstart directory on the NFS server.


    +   - If DCHP did not specify a "bootfile", then the installation program tries
    to read the file /kickstart/1.2.3.4-kickstart, where 1.2.3.4 is the numeric IP
    address of the machine being installed.


    # F.4 The Kickstart File


    Now that you have some background information on kickstart installations, let''s
    take a look at the kickstart file itself. The kickstart file is a simple text
    file, containing a list of items, each identified by a keyword. You can create
    it by editing a copy of the sample.ks file found in the /doc directory of the
    Red Hat Linux CD-ROM, or you can create it from scratch. You should be able to
    edit it with any text editor or word processor that can save files as ASCII text.


    First, some rules to keep in mind while creating your kickstart file:


    +   - Items must be specified in order. It is not a good idea to try to change
    the order of the required items.

    - Items that aren''t required can be omitted.


    +   - Omitting any required item will result in the installation program prompting
    the user for the related item, just as during a typical installation. Once the
    answer is the installation will continue unattended (unless it comes across another
    item).


    +   - Lines starting with a pound sign ("#") are treated as comments, and are
    ignored.


    +   - For kickstart upgrades, the following items are required:

    - language

    - installation method

    - device specification (if device is needed to perform installation)

    - keyboard setup

    - the upgrade keyword'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Appendix F:Kickstart Installations


    +   - LILO configuration

    If any other items are specified for an upgrade


    +   - Kickstart files are split into three sections: commands, package list, and
    scripts. The file must be of the following:

    - <kickstart commands>

    - %packages

    - <package list>

    - %post

    - <post script>


    The order matters; it can’t be random. The post section goes to the end of the
    file and ends the file, no marker is necessary to end the file other than the
    post section itself.


