- pgno: 312
  md: '# Section B.1:Hard Disk Basic Concepts


    # Please Note


    Many people have successfully used fips to repartition their hard drives. However,
    because of the nature of the operations carried out by fips, and the wide variety
    of hardware and software configurations under which it must run, Red Hat cannot
    guarantee that fips will work properly on your system. Therefore, no installation
    whatsoever is available for fips; use it at your own risk.


    That said, if you decide to repartition your hard drive with fips, it is vital
    that you do two things:


    +   Perform a Backup -- Make two copies of all the important data on your computer.
    These copies should be to removable media (such as tape or diskettes), and you
    should make sure they are readable before proceeding.


    +   Read the Documentation -- Completely read the fips documentation, located
    in the /dosutils/fipsdocs subdirectory on Red Linux/Intel CD 1.


    Should you decide to use fips, be aware that after fips runs you will be left
    with two partitions: the one you resized, and the one fips created out of the
    newly freed space. If your goal is to use that space to install Red Linux, you
    should delete the newly created partition, either by using fdisk under your current
    operating system, or while setting up partitions in a custom-installation.


    # B.1.5 Partition Naming Scheme


    Linux refers to disks using a combination of letters and numbers which may be
    confusing, particularly if you''re used to the "C drive" of referring to hard
    disks and their partitions. In the DOS/Windows world, here is how partitions are
    named:


    +   Each partition''s type is checked to determine if it can be read by DOS/Windows.


    +   If the partition''s type is compatible, it is assigned a "drive letter." The
    drive letters start with "C".'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Appendix B:An Introduction to Disk Partitions


    +   - The drive letter can then be used to refer to that partition as well as
    the filesystem contained on that partition.


    Red Hat Linux uses a naming scheme that is more flexible and conveys more information
    than the approach used by other operating systems. The naming scheme is file-based,
    with filenames in the form:

    ```/dev/xxynN```


    Here''s how to decipher the partition naming scheme:

    /dev/


    This string is the name of the directory in which all device files reside. Since
    partitions reside on hard disks, and hard disks are devices, the files representing
    all possible partitions reside in /dev/.


    xx The first two letters of the partition name indicate the type of device on
    which the partition resides. You''ll normally see either hd (for IDE disks), or
    sd (for SCSI disks).


    y This letter indicates which device the partition is on. For example, /dev/hda
    (the first IDE hard disk) or /dev/sdb (the second SCSI disk).


    N The final number denotes the partition. The first four (primary or extended)
    partitions are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3
    is the third or extended partition on the first IDE hard disk; /dev/sdb6 is the
    second logical partition on the second SCSI hard disk.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Section B.1:Hard Basic Concepts


    # Please Note


    There is no part of this naming convention that is based on partition type; unlike
    DOS/Windows, *all* partitions can be identified under Red Hat Linux. Of course,
    this doesn''t mean that Red Hat Linux can access data on every type of partition,
    but in many cases it is possible to access data on a partition dedicated to another
    operating system.


    Keep this information in mind; it will make things easier to understand when you''re
    setting up the partitions Red Hat Linux requires.


    # B.1.6 Disk Partitions and Other Operating Systems


    If your Red Hat partitions will be sharing a hard disk with partitions used by
    other operating systems, most of the time you''ll have no problems. However, there
    are certain combinations of Linux and other operating systems that require extra
    care. Information on creating disk partitions compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs, available on the Red Hat
    Linux CD in the doc/HOWTO and doc/HOWTO/mini directories. In particular, the Mini-HOWTOs
    whose names start with Linux+ are quite helpful.


    # Intel


    If Red Hat Linux/Intel will coexist with your machine with OS/2, you must create
    your disk partitions with the OS/2 partitioning software---otherwise, OS/2 may
    not recognize the disk partitions. During the installation, do not create any
    new partitions, but do set the proper partition types for your Linux partitions
    using the Linux fdisk.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# B.1.7 Disk Partitions and Mount Points


    An area that many people new to Linux find confusing is the matter of how partitions
    are used and accessed by the Linux operating system. In DOS/Windows, it is relatively
    simple: If you have more than one partition, each partition gets a "drive letter."
    You then use the drive letter to refer to files and directories on a partition.


    This is entirely different from how Red Hat deals with partitions, and for that,
    with disk storage in general. The main difference is that each partition is used
    to form part of the storage necessary to support a single set of files and directories.
    This is done by associating a partition with a directory through a process known
    as mounting. Mounting a partition makes its storage available starting at the
    specified directory (known as a mount point).


    For example, if partition /dev/hda5 were mounted on /usr, that would mean that
    all files and directories under /usr would physically reside on /dev/hda5. So
    the file /usr/doc/FAQ/txt/Linux-FAQ would be stored on /dev/hda5, while the file
    /etc/X11/gdm/Sessions/Gnome would not.


    Continuing example, it is also possible that one or more directories below /usr
    would be mount points for other partitions. For instance, a partition (say, /dev/hda7)
    could be mounted on /usr/local, meaning that, for example, /usr/local/man/whatis
    would then reside on /dev/hda7 rather than /dev/hda5.


    # B.1.8 How Many Partitions?


    At this point in the process of preparing to install Red Hat Linux, you will need
    to give some consideration to the number and size of the partitions to be used
    by your new operating system. The question of "how many partitions" continues
    to spark debate within the Linux community and, without any end to the debate
    in sight, it''s safe to say that there are probably many partition layers as there
    are people debating the issue.


    Keeping this in mind, we recommend that, unless you have a reason for doing otherwise,
    you should create the following partitions:'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Section B.1:Hard Disk Basic Concepts


    +   - A swap partition -- Swap partitions are used to support when there is not
    RAM to hold the data system is processing. If your computer has 16 MB of RAM or
    less, you must create a swap partition. Even if you have more memory, a swap partition
    is still recommended. The minimum size of your swap partition should be equal
    to your computer''s RAM, or 16 MB (whichever is larger).


    # Intel


    The following partition is specific to Red Hat Linux/In- installations.


    A /boot partition -- The partition mounted on /boot contains the operating system
    kernel (which allows your system to boot Red Hat Linux), along with a few other
    files used during the bootstrap process. Due to the limitations of most PC BIOSes,
    creating a small partition to hold these files is a good idea. This partition
    should be no larger than 16MB.


    # Please Note


    Make sure you read Section B.1.9, One Last Wrinkle: Using LILO -- the information
    there applies to the /boot partition!'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Appendix B:An Introduction to Disk Partitions


    # Alpha


    The following partition (/) is specific to Red Hat Linux/Alpha installations.


    A MILO partition -- Alpha owners that will be using MILO to boot their systems
    should create a 2MB partition where MILO can be copied after the installation.
    We recommend using /dos as the mount point.


    +   A root partition -- The root partition is / (the root directory) resides.
    In this partitioning layout, all files (except those stored in /boot) reside on
    the root partition. Because of this, it''s in your best interest to maximize the
    size of your root partition. A 600MB root partition will permit the equivalent
    of a workstation-class (with very little free space), while a 1.5GB root partition
    let you install every package.


    # B.1.9 One Last Wrinkle: Using LILO


    LILO (the Linux LOader) is the most commonly used method to boot Red Hat Linux
    on Intel-based systems. An operating system loader, LILO operates "outside" of
    any operating system, built into the computer hardware itself. This section describes
    LILO’s interactions with PC BIOSes, and is specific to Intel-compatible computers.


    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOSes can''t access more than two drives and they can''t access
    any data stored beyond cylinder 1023 of any drive. Note that some recent BIOSes
    do not have these limitations, but this is by no means universal.


    All the data LILO needs to access at boot time (including the Linux kernel) are
    located in the /boot directory. If you follow the partition layout recommended
    above, or you are performing a workstation- or server-class install, the /boot
    directory will be in a small, separate partition. Otherwise, it will reside in
    the root partition. In either'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Section B.1:Hard Disk Basic Concepts


    case, the partition in which /boot resides must conform to the following guidelines
    if you are going to use LILO to boot your Red Hat Linux system:


    # On First Two IDE Drives


    If you have 2 IDE (or EIDE) drives, /boot must be located on one of them. Note
    that this two-drive limit also includes any IDE CD-ROM drives on your primary
    IDE controller. So, if you have one IDE drive, and one IDE CD-ROM on your primary
    controller, /boot must be located on the first hard drive only, even if you have
    other hard drives on your secondary IDE controller.


    # On First IDE or First SCSI Drive


    If you have one IDE (or EIDE) drive and one or more SCSI drives, /boot must be
    located either on the IDE drive or the SCSI drive at ID 0. No other SCSI IDs will
    work.


    # On First Two SCSI Drives


    If you have only SCSI hard drives, /boot must be located on a drive at ID 0 or
    ID 1. No other SCSI IDs will work.


    # Partition Completely Below Cylinder 1023


    No matter which of the above configurations apply, the partition that holds /boot
    must be located entirely below cylinder 1023. If the partition holding /boot straddles
    cylinder 1023, you may face a situation where LILO will work initially (because
    all the necessary information is below cylinder 1023), but will fail if a new
    kernel is to be loaded, and kernel resides above cylinder 1023.


    As mentioned earlier, it is possible that some of the newer BIOSes may permit
    LILO to work with configurations that don''t meet our guidelines. Likewise, some
    of LILO''s more esoteric features may be used to get a Linux system started, even
    if the configuration doesn''t meet our guidelines. However, due to the number
    of variables involved, Red Hat cannot support such extraordinary efforts.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Please Note


    Disk Druid as well as the workstation- and server-class in-stalls take these BIOS-related
    limitations into account.'
  merge: -1
