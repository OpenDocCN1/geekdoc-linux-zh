    \ and install updated packages from Red Hat for your system.\n\nThrough a secure\
    \ connection to priority.redhat.com, Red Hat's own fast FTP server, you are assured\
    \ that new packages are specific to your Red Hat Linux system, rather than might\
    \ be the case with upgrades you could find through another source. Upgrades and\
    \ bug fixes are presented to you on a single \"page\" in your Web browser. You\
    \ can select individual packages or all of the packages for download. You can\
    \ also configure Update Agent to automatically install the new packages once they've\
