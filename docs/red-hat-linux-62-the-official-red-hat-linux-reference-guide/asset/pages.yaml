- pgno: 38
  md: '# Section 2.6:User Authentication with PAM


    so only if an auth module has determined that the password needs to be changed
    --- for example, if a shadow password has expired.


    The eighth and final line specifies that the pam_pwdb.so module should be used
    to manage the session. Currently, that module doesn''t do anything; it could be
    replaced (or supplemented by stacking) any necessary module.


    Note that the order of the lines within each file matters. While it doesn''t really
    matter in which order modules are called, there are other control flags available.
    While optional is rarely used, and never used by default on a Red Hat Linux system,
    sufficient and requisite cache order to be important.


    Let''s look at the auth configuration for login:


    ```

    auth required      /lib/security/pam_securetty.so

    auth sufficient    /lib/security/pam_rosts_auth.so

    auth required      /lib/security/pam_pwdb.so shadow nullok

    auth required      /lib/security/pam_nlogin.so

    ```


    That looks almost like the login entry, but there''s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, pam_securetty.so keeps root logins from happening on insecure terminals.
    This effectively disallows all root login attempts. If you wish to allow them
    (in which case we recommend that you be Internet-connected or behind a good firewall),
    you can simply remove that line.


    Second, if pam_rosts_auth.so authenticates the user, PAM immediately returns success
    to login without any password checking. If pam_rosts_auth.so fails to authenticate
    the user, that failed is ignored.


    Third, if pam_rosts_auth.so has failed to authenticate the user, the pam_pwdb.so
    module performs normal password authentication.


    Finally pam_nlogin.so checks /etc/nlogin, as specified above.


    Note that if you do not want to prompt for a password if the security check fails,
    you can change the pam_securetty.so module from required to requisite.'
