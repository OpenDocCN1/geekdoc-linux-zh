- pgno: 222
  md: '# Section 10.9:Upgrading or Installing


    +   - Upgrade Existing System -- Upgrade an earlier version of Red Hat Linux (2.0
    or later) without deleting any existing data. The installation program updates
    the modular 2.2.x kernel and all currently installed software packages.


    # 10.9.1 Upgrading


    If you choose to upgrade and the installation program detects more than one installed
    Linux version on the system, you will be asked which version to upgrade. After
    you indicate this, if there''s only one installed Linux version on the system,
    the installation program probes your existing system to determine which software
    packages require updating and presents the Customize Packages to Upgrade dialog
    (Figure 10–12, Customize Packages to Upgrade Dialog).


    # Figure 10-12 Customize Packages to Upgrade


    ![](img/a62cd8edb5919f938a546de403f602c6_222_0.png)


    If you answer No, the installation program starts upgrading packages.


    Answer Yes if you want to add or remove items from the list of individual packages
    to be upgraded. The package selection dialog is seen in Section 10.19.1, *Selecting
    Individual Packages*. The upgrade starts when you finish making your changes.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Please Note


    Some upgraded packages may require that other packages are also installed for
    proper operation. The upgrade process takes care of these dependencies, but in
    doing so it may need to install additional packages which are not on your existing
    system.


    The upgrade process preserves existing configuration files by renaming a .rpmsave
    extension (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions it
    took in /tmp/upgrade.log. As software evolves, configuration file formats can
    change, so you should carefully compare your original configuration files to the
    new files before integrating your changes.


    The next dialog you''ll see is Figure 10–40, Package Installation Status Dialog.
    This dialog remains on the screen until the upgrade is complete.


    # 10.9.2 Installing


    If you choose a workstation- or server-class installation, Figure 10–13, Automatic
    Partitioning Dialog appears.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Section 10.9:Upgrading or Installing


    Figure 10–13 Automatic Partitioning Dialog


    ![](img/a62cd8edb5919f938a546de403f602c6_224_0.png)


    If you select **Continue** and press **OK**, the installation program partitions
    your disk and decides which software packages to install. Next, you''ll see the
    **Hostname** dialog explained in Section 10.12, **Naming Your Computer.**.


    If you select **Manually partition** or choose to perform a custom-class installation,
    Disk Rigid will begin. The disk partitioning dialogs described in the next section
    will appear, showing you any current partitions on your system. It is up to you
    to indicate the partitions and mount points to be used for installation of this
    version of Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 10.10 Partitioning Your Disk for Red Hat Linux


    > CAUTION

    Installing Red Hat Linux over another installation does not preserve any information
    (files or data) from the prior installation. Make sure you save any important
    files! If you are worried about saving the current data on your existing Red Hat
    Linux system (without making a backup on your own), you should consider performing
    an upgrade instead.


    If you have not yet planned how you will set up your partitions, turn to Appendix
    B, An Introduction to Disk Partitions. There you''ll find an introduction to basic
    partitioning concepts. As a bare minimum, you''ll need an appropriately-sized
    root partition, and a swap partition of at least 16 MB.


    Figure 10–14, Disk Setup Dialog shows the two disk partitioning applications that
    are available for you to use.


    If you will be using fdisk to partition your drive, please see Section 10.10.11,
