- pgno: 30
  md: '# Section 2.3:Users and User-Private Groups


    The traditional UNIX umask is 022, which prevents others and other members of
    a user’s primary group from modifying a user’s files. Since every user has their
    own private group in the UPG scheme, this "group protection" is not needed. A
    umask of 022 will prevent users from modifying others'' private files. The umask
    is set in /etc/profile.


    # setgid bit on Directories


    If you set the setgid bit on a directory (with chmod g+s directory), files created
    in that directory will have their group set to the directory’s group.


    Most IT organizations like to create a group for each major project and assign
    people to the groups they should be. Managing files traditionally has been difficult,
    though when someone creates a file it is owned by the primary group he she belongs
    to. When a single person works on multiple projects, it becomes hard to associate
    the right files to the right ownership group. In the UPG scheme, groups are automatically
    assigned to files on a project-by-project basis, which makes managing groups very
    simple.


    Let’s say you have a big project called devel, with many people editing the devel
    files in a devel directory. Make a group called devel, chgrp the devel directory
    to devel, and add the all the devel users to the devel group. Now, all devel users
    will be able to edit the devel files and create new files in the devel directory,
    and these files will always retain their group. Thus, they will always be edit-able
    by other devel users.


    If you have multiple projects like devel, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The setgid bit on each project’s main directory
    "selects" the proper group.


    Since each user’s home directory is owned by the user and their private group,
    it is safe to set the setgid bit on the home directory. However, by default, files
    are created with the primary group of the user, so the setgid bit would be redundant.


    # User Private Group Rationale


    Although UPG is not new to Red Hat Linux 6.2, many people still have questions
    about it, such as why UPG is necessary. The following is the rationale for the
    scheme.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Chapter 2:System Administration


    +   - You’d like to have a group of people work on a set of files in say, the
    /usr/lib/emacs/site-lisp directory. You trust a few people to mess around in there,
    but certainly not everyone.


    +   - So you enter:

    ```bash

    own -R root.emacs /usr/lib/emacs/site-lisp

    ```


    and you add the proper users to the group.

    to allow them to actually create files in the directory you enter:

    chmod 755 /usr/lib/emacs/site-lisp


    +   - But when a user creates a new file it is assigned the group of the user’s
    default group (usually users). To prevent this you:

    ```bash

    chmod 2775 /usr/lib/emacs/site-lisp

    ```


    which causes everything in the directory to be created with the "emacs" group.

    But the new file needs to be 664 for another user in the emacs group to be able
    to edit it. To do this you make the default umask 002.


    +   - Well, this all works fine, except if your default group is "users", every
    file you create in your home directory will be writable by everybody in "users"
    (usually everyone).


    +   - To fix this, you make each user have a "private group" as their default
    group.

    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up users that can take advantage of without doing any
    magic. Just create the group, add the users, and do the above chown and chmod
    on the group’s directories.


