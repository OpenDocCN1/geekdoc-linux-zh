    would just allow speedy to mount /mnt/export read-only.


    Each time you change /etc/exports, you must tell the NFS daemons to examine it
    for new information. One simple way to accomplish this is to just stop and start
    the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

