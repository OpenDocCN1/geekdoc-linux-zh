- pgno: 66
  md: '# Section 2.13:The Boot Process, Init, and Shutdown


    The init program is run by the kernel at boot time. It is in charge of starting
    all the normal processes that need to run at boot time. These include the getty
    processes that allow you to log in, NFS daemons, FTP daemons, and anything else
    you want to run when your machine boots.


    SysV is quickly becoming the standard in the Linux world to control the startup
    of software at boot time, because it is easier to use and more powerful and flexible
    than the traditional BSD init.


    SysV init differs from BSD init in that the configuration files are in a subdirectory
    of /etc instead of residing directly in /etc. In /etc/rc.d, you will find rc.sysinit
    and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    The init.d directory contains a variety of scripts. Basically, you must have one
    script for each service you may need to start at boot time or when entering another
    runlevel. Services include things like networking, nfs, sendmail, httpd, and so.
    Services do not include things that must only run once and then exited. Things
    that should go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include even though
    it doesn''t do much. You can also include an rc.serial file in /etc/rc.d if you
    need to perform serial specific tasks at boot time.


    The chain of events is as follows:


    +   * The kernel looks in several places for init and runs the first one it finds


    +   * init runs /etc/rc.d/rc.sysinit


    +   * rc.sysinit handles most of the boot loader''s processes and then runs rc.serial
    (if it exists)'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Chapter 2:System Administration\n\n+   - init runs all the scripts for the\
