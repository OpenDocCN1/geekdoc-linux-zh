  md: '# Section 4.3:Installing PowerTools Packages


    # 4 PowerTools


    # 4.1 PowerTools Packages


    Red Hat PowerTools is a collection of software packages built for the Red Hat
    Linux 6.2 operating system. PowerTools includes the latest versions (as of this
    product’s release date) of hundreds of programs -- so finding an interesting application
    should be easy.


    Among the many applications are audio programs, chat clients, development tools,
    editors, file managers, emulators, graphics programs, productivity applications,
    math/statistics packages, systems administration and network management tools,
    and window managers.


    Additionally, for PalmPilot personal organizer users, the pilot directory on the
    CD-ROM contains applications for use with PalmPilots.


    Now that you know what you can find on PowerTools, you may want to know how to
    install them. See Section 4.3, Installing PowerTools Packages for installation
    information.


    # 4.2 Reading the Contents of the CD-ROM


    You can read the contents of the PowerTools CD-ROM from a shell prompt (either
    in a terminal window or in console mode). Mount the CD-ROM (mount /mnt/cdrom).
    Once this is done, change directories by issuing the cd /mnt/cdrom command. Finally,
    type less CONTENTS to view the available applications.


    # 4.3 Installing PowerTools Packages


    # 4.3.1 Installing PowerTools in a GUI Environment


    If you’re using GNOME or KDE, place the CD-ROM in your CD-ROM drive. You’ll be
    prompted for the root password (you must be to root in order to install packages).
    After you type in the root password, either the Gnome-RPM or the Kpackage package'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'management program will start automatically (depending on you GUI environment)
    and can be used to install PowerTools.


    See Chapter 7, Gnome-RPM for specific instructions on how to use Gnome-RPM. See
    http://www.general.uwa.edu.au/u/toivo/kpackage/ for more information on how to
    use Kpackage.


    If you''re not using GNOME or KDE, you''ll need to use the shell prompt to install
    PowerTools. See Section 4.3.2, Installing PowerTools from the Shell Prompt for
    more information.


    # 4.3.2 Installing PowerTools from the Shell Prompt


    First, mount the PowerTools CD-ROM in your CD-ROM drive.


    Place the PowerTools CD in your CD-ROM drive. As root, type the following:


    ```

    # mount -t iso9660 /dev/cdrom /mnt/cdrom

    #

    ```


    > Please note

    on your system, you or the system administrator may already allow users (instead
    of only root) to mount the CD-ROM drive. Users have this privilege if the user
    option is included in the /dev/cdrom line in the /etc/fstab file. However, keep
    in mind that you must be logged in as root to install any PowerTools RPMs.


    After you''ve mounted the drive, cd to the mounted CD-ROM directory with the following
    command:


    ```

    # cd /mnt/cdrom

    ```


    When you list the contents of the CD with ls, you''ll see the following directories:
    SRPMS, alpha, i386, i586, i686, noarch, nosrc, sparc, and sparc64. The SRPMS directory
    contains the PowerTools source RPMs. The alpha, i386,'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Section 4.3:Installing PowerTools Packages


    sparc, and sparc64 directories contain the RPMs for the three specified operating
    architectures. The noarch directory contains RPMs which are not architecture-specific
    and should install on any of the three architectures.


    The i386 path is used as a general example. You should substitute the correct
    directory for i386, depending upon your architecture and which package you''re
    installing.


    cd to the i386 directory:


    ```

    # cd i386

    #

    ```


    List the RPM files in the directory with ls to see the complete list of RPM packages
    included for Intel-compatible systems.


    You will probably want more information about a specific package before you can
    decide whether you to install it. You can use RPM''s capability to find out more
    information about the packages, such as the packages'' functions and orig. See
    Section 6.3, Impressing Your Friends with RPM for instructions on how to query
    packages using RPM.


    You can install your selected packages with RPM. RPM is a powerful command line-driven
