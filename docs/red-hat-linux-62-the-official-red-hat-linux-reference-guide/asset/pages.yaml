- pgno: 320
  md: '# Section C.1:Why Do I Need a Driver Disk?


    # C Driver Disks


    # C.1 Why Do I Need a Driver Disk?


    While the Red Hat Linux installation program is loading, you may see a screen
    that asks you for a driver disk. The driver disk screen is most often seen in
    three scenarios:


    +   * if you are running the installation program in expert mode

    * if you run the installation program by entering linux dd at the boot: prompt

    * if you run the installation program on a computer which does not have any PCI
    devices


    # C.1.1 So Is a Driver Disk Anyway?


    A driver disk adds support for hardware that is not otherwise supported by the
    installation program. The driver disk could be produced by Red Hat, it could be
    a disk you make yourself, or it could be a disk that a hardware vendor includes
    with a piece of hardware.


    There is really no need to use a driver disk unless you need a particular device
    in order to install Red Hat Linux. You will most likely use a driver disk for
    SCSI adapters and NICs, as those are the only devices which are used during the
    installation that might require driver disk support. If an unsupported device
    is not needed to install Red Hat Linux on your system, continue with a regular
    installation and then add support for the new piece of hardware after the installation
    is complete.


    # C.1.2 How Do I Obtain a Driver Disk?


    Your best option for finding driver disk information is on Red Hat''s website
    at http://www.redhat.com/support/errata/ under the section Bug Fixes.


    If you find a driver disk that is appropriate for your device support needs, create
    a boot disk using that filename.img file. For instructions on how to make a boot
    disk, see the Official Red Hat Linux Installation Guide section Making Installation
    Diskettes.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'Once you have created your driver disk, boot your system using the diskette
    as a boot disk and enter either linux expert or linux dd at the boot: prompt.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Section D.1:If Your Computer Already Has An Operating System ... 323


    # # How to Create a Dual-Boot System


    This document explains your options for installing Red Hat Linux on a computer
    that currently runs another operating system, and how to create a dual-boot environment.


    # ## D.1 If Your Computer Already Has An Operating System ...


    If the computer you want to install Red Hat Linux is currently running Windows
    (or some other system), you have an important decision to make. Your choices are:


    +   - Do you want to install Red Hat Linux but feel timid about disk partitioning?
    You can install Red Hat Linux on your system without creating any Linux partitions
    by performing a partitionless installation. The installation program can install
    Red Hat Linux on an existing, formatted Windows partition and you''ll only need
    to create a boot disk during the installation to access Red Hat Linux on your
    system.

    - This method is perfect for those who do not want to install Red Hat Linux as
    the primary OS or as a dual-boot OS on your system. It is a great way of trying
    out Red Hat Linux without creating partitions on your system.

    - If this is your preferred choice, refer to Official Red Linux Installation Guide,
    Appendix B. Installing Without Partitioning, for those instructions.


    +   - Do you want to install Red Hat Linux and have the option of booting either
    Red Hat Linux or your other operating system? Performing a workstation or custom-class
    installation will allow Red Hat Linux to install on your system without affecting
    the other operating system. In a custom-installation, you must install LILO (the
    Linux Loader) on the MBR (Master Boot Record) -- unless Windows NT is your OS
    or if you are already using another boot loader on your system. The Official Red
    Linux Installation Guide has instructions on installing and configuring LILO.
    After the installation, whenever you start the computer, you will indicate whether
    you want to start Red Hat Linux or the other operating system.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Appendix D:How to Create a Dual-Boot System


    > WARNING


    Don''t perform a workstation-class installation if you’re sharing a disk with
    Windows NT; you will be unable to boot Windows NT. LILO will overwrite NT’s boot
    loader and you will be unable to boot NT. You must perform a custom-class installation
    and configure LILO so that it is not installed on the MBR.


    To create a dual-boot environment on a system that currently has NT, you must
    install LILO on the first sector of the root partition, not the MBR. Please be
    sure to create a boot disk. In a case such as this, you will either need to use
    the boot disk, or configure the NT system loader to boot LILO from the first sector
    of the root partition. Be sure to check http://www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html
    for more information on setting up LILO and NT.


    If this is your preferred choice, read Section D.2, Setting Up a Dual-Boot Environment


    +   Do you want Red Hat Linux to be the only operating system on your computer?
    The Red Hat Linux installation program will remove the other operating system
    and also any data you have created using that operating system.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Section D.2:Setting Up a Dual-Boot Environment


    # Please Note


    In order to install Red Hat Linux and keep another OS on your system, there must
    be sufficient space for Red Hat Linux to be installed. Otherwise, Red Hat Linux
    will replace the current OS and files on your system. If you have not partitioned
    your hard drive to make room for Red Hat Linux or made sure that there is sufficient
    unpartitioned space available for your installation, Red Hat Linux will install
    over the existing information by default. This will also happen if you select
    a server-class installation (note that a server-class installation does not install
    the X Window System so no GUI environment will be present). So a dual-boot environment
    is incompatible with this choice.


    If this is your preferred choice, back-up any information on your computer that
    you want to save or perform a full backup if you think you want to restore your
    system to its original configuration), then proceed with installation as explained
    in the *Official Red Hat Linux Installation Guide.*


    # D.2 Setting Up a Dual-Boot Environment


    Sharing a computer between two operating systems requires dual booting. You can
    use either operating system on the computer but not at all. Each operating system
    boots from its own hard drives or disk partitions (a partition is a physical division
    on a hard drive).


    For clarity, we will assume that the other operating system is Windows. But the
    general procedures are similar for other operating systems.


    > ¹ A server-class installation is most appropriate for you if you''d like your
    system to function as a Linux-based server, and you don''t want to heavily customize
    your system configuration.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Appendix D:How to Create a Dual-Boot System


    Please Note

    If Red Hat Linux will coexist on your system with OS/2, you must create your disk
    partitions with the OS/2 partitioning software -- otherwise, OS/2 may not recognize
    the disk partitions. During the installation, do not create any new partitions,
    but do set the proper partition types for your Linux partition using fdisk.


    Before starting the installation program, you must first make room for Red Hat
    Linux. Your choices are:


    +   * Add a new hard drive

    * Use an existing hard drive or partition

    * Create a new partition


    # D.2.1 Add a New Hard Drive


    The simplest way to make room for Red Hat Linux is to add a new hard drive to
    the computer and then install Red Hat Linux on that drive. For example, if you
    add a second IDE hard drive to the computer, the Red Hat Linux installation program
    will recognize it as `hdb` and the existing drive (the one used by Windows) as
    `sda`. With SCSI hard drives, the newly installed hard drive would be recognized
    as `sdb` and the other hard drive as `sda`.


    If you choose to install a new hard drive for Linux, you don''t need to read any
    further. After starting the Red Hat Linux installation program, just make sure
    you tell it to install Linux on the newly installed hard drive (`hdb`, `sdb`)
    rather than the one Windows uses.


    # D.2.2 Use an Existing Hard Drive or Partition


    The simplest way to make room for Linux is to use a hard drive or disk partition
    that is currently being used by Windows. For example, suppose that Windows Explorer
    shows two hard drives, C: and D:. This could indicate either that the computer
    has'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Section D.2:Setting Up a Dual-Boot Environment


    two hard drives, or a single hard drive with partitions. In either case (assuming
    it is large enough), you can install Red Hat Linux on the hard drive or disk partition
    that Windows recognizes as D :


    This choice is available to you only if the computer has two or more hard drives
    or disk partitions.


    # Please Note


    Windows uses letters to refer to removable drives (for example, a ZIP drive) and
    network storage (virtual drives) as well as for local hard drive space: you cannot
    install Linux on a removable or network drive.


    If a local Windows partition is available that you want to install Linux in, you
    don''t need to read any further. Just do the following:


    +   1. Copy all data you want to save from the selected hard drive or partition
    (D : in this example) to another location.

    2. Start the Red Hat Linux installation program and tell it to install Linux in
    the designated drive or partition -- in this example, in the hard drive or partition
    that Windows designates as D :. Note that Windows distinguishes between hard drives
    and disk partitions. Thus:


    +   * If C: and D : on this refer to two separate hard drives, the installation
    program will recognize them as hda and hdb (IDE) or sda and sdb (SCSI). Tell the
    installation program to use hdb or sdb.

    * If C: and D : refer to a single partition on drive, the installation program
    will recognize them as hda1 and hda2 (sda1 and sda2). During the partitioning
    phase of Linux installation, you''ll delete the second partition (hda2 or sda2),
    then partition the unallocated free space for Linux partitioning. (You don''t
    have to delete the second partition prior to beginning Linux. But if you don''t,
    Windows will complain whenever you boot that it cannot read Drive D; and should
    should someone accidentally format D, your Linux system would be destroyed.)'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Appendix D:How to Create a Dual-Boot System


    # D.2.3 Create a New Partition


    The third way to make room for Linux is to create a new partition for Red Hat
    Linux on the hard drive being used by the other operating system. If Windows Explorer
    shows only one hard drive (C :), and you don''t want to add a new hard drive,
    you must partition the drive. After partitioning, Windows Explorer will reveal
    a smaller C : drive; and, when you run the Red Hat Linux installation program,
    it will partition the remainder of the drive for Linux.


    You can use a destructive partitioning program, such as fdisk, to divide the hard
    drive, but doing so will require you to re-install Windows. (This is probably
    not your best option.)


    A number of non-destructive third-party partitioning programs are available for
    the Windows operating system. If you choose to use one of these, consult their
    documentation.


    For instructions on how to partition with FIPS, a program that is on the Red Hat
    Linux CD-ROM, turn to Section D.3, Partitioning with FIPS.


    # D.3 Partitioning with FIPS


    As a convenience to our customers, we provide the FIPS utility. This is a freely
    available program that can resize FAT (File Allocation Table) partitions. It’s
    included on the Red Hat Linux CD-ROM in the듯이 directory.


