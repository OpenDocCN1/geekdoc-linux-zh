- pgno: 14
  md: '# # Red Hat Linux 6.2 New Features


    This chapter describes features that are new to Red Hat Linux 6.2.


    # ## 1.1 Installation-related Enhancements


    The Red Hat Linux 6.2 installation program includes a number of new features.
    For more information, please refer to the Official Red Hat Linux Installation
    Guide.


    # ## 1.2 System-Related New Features


    There are many new features to Red Hat Linux 6.2 that are not part of the installation
    process. Some new features are tools or applications that you can use, others
    are new versions of the kernel or desktop environments. This list will provide
    a little more information about what to expect from Red Hat Linux 6.2 once you
    are actually using the OS itself.


    ### Network services split into client, server packages:


    The following network services have been split into client and server packages
    --


    +   - telnet

    - finger

    - talk

    - rsh

    - users

    - rwall

    - tftp


    For example, the Intel-compatible platform telnet is now packaged in two RPMs
    --


    +   - telnet-0.16-5.i386.rpm'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Chapter 1:Red Hat Linux 6.2 New Features


    +   - telnet-server-0.16-5.i386.rpm


    sysctl now controls system settings:


    In Red Hat Linux 6.2, kernel options such as IPv4 forwarding and enabling or disabling
    of the "magic sysrq" keys is done via the sysctl program, as opposed to being
    controlled by the contents of files in /etc/sysconfig. The sysctl settings are
    stored in /etc/sysctl.conf, and are loaded at each boot by the command:


    ```

    sysctl -p /etc/sysctl.conf

    ```


    Here is a sample /etc/sysctl.conf:


    ```

    # Disables IPv4 packet forwarding

    net.ipv4.ip_forward = 0

    # Enables source route verification

    # This drops packets that come in over interfaces they shouldn''t;

    # (for example, a machine on an external net claiming to be one on your

    # local network)

    net.ipv4.conf.rl_filter = 1

    # Disables automatic defragmentation

    # Automatic defragmentation is needed for masquerading and Linux

    # Virtual Server use; it is not needed otherwise.

    net.ipv4.ip_always_defrag = 0

    # Disables the magic-sysrq key

    kernel.sysrq = 0

    # Disables stop-a on the sparc

    kernel.stop-a = 0

    ```


    Many other kernel tunable parameters can be set; to see the full list, run sysctl
    -a, or look in the file /usr/doc/kernel-doc-<version>/sysctl.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Section 1.2:System-Related New Features


    # Please Note


    If you are upgrading your Red Hat Linux system to Red Hat Linux 6.2, any changes
    you have made to files in /etc/sysconfig will be migrated to /etc/sysctl.conf.
    You should confirm this by reviewing the file.


    # Linux 2.2.14 kernel:


    Red Hat Linux 6.2 includes the latest stable version of the 2.2.x Linux kernel
    ident service now run as daemon:


    The ident service is now run as a stand-alone service (called "identd"), and is
    controlled by settings in the /etc/identd.conf file.


    # Workstation-class installation now more secure:


    Workstation-class installations no longer install the inetd "super server." This
    means that the following network-related services will not be available if you
    perform a workstation-class installation:


    +   - ftp

    - telnet

    - shell

    - talk

    - finger


    If you require the above network-related services, you should consider an installation
    type other than workstation-class.


    # XFree86 version 3.3.6:'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 1:Red Hat Linux 6.2 New Features


    Red Hat Linux 6.2 contains the latest version of XFree8 (version 3.3.6 which supports
    many new drivers.


    # Services no longer run by default:


    To permit a more fine-tuned system configuration, Red Hat Linux 6.2 no longer
    runs the following services by default --


    +   - The automount daemon amd (in the am-utils RPM)

    - The bind name server

    - The dhcpd DHCP server

    - The inn news server

    - The knfsd NFS server

    - The samba CIFS server used to support Windows-based file and print services


    To enable these services, either use chkconfig --level 35 <service-name> on, or
    edit the list of services to start with the ntsysv or tksys utilities.


    # Mesa graphics library now included:


    The Mesa 3-D graphics library (version 3.2) is now included. Mesa is compatible
    with the OpenGL graphics API.


    # Sawmill window manager now included:


    The sawmill window manager is now included in Red Hat Linux 6.2. Based on a Lisp-like
    language, sawmill is extensible, and GNOME-aware.


    # Man pages now compressed:


    All pages are now compressed (using gzip) to save disk space.


    # Starting programs at X startup:


    By placing scripts in /etc/X11/xinitrc/xinitrc.d, it is now possible to automatically
    start programs whenever X starts.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Section 1.3:Miscellaneous New Features


    Fonts recognized automatically:


    X fonts have been added to your Red Hat Linux 6.2 system will now be recognized
    automatically, when the font server starts. This can be done during an X session
    by issuing the following command as root:


    ```

    /etc/rc.d/init.d/xfs restart

    ```


    Encryption-related changes:


    By relaxation of U.S. encryption laws, encryption-related changes have been made
    to the following packages:


    +   - Kerberos authentication has been added to mut, pine, fetchmail, cvs, and
    imam.

    - The GNU Privacy Guard (GnuPG) is now included in all editions of Red Hat Linux
    6.2.

    - For those platforms that support it, Netscape Communicator built with 128-bit
    encryption is included in Red Hat Linux 6.2.


    # # 1.3 Miscellaneous New Features


    These new features defy categorization:


    **Packages moved to PowerTools --


    The following packages have been moved to PowerTools:


    +   - The dosemu DOS emulator

    - Version 1 of the twm window manager

    - The aktion and xanim movie viewers

    - The mxpx fractal generator

    - The xwpick window grabber

    - The xearth eye candy application'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 1:Red Hat Linux 6.2 New Features


    Changes to termcap and terminfo entries --


    The termcap and terminfo entries have been changed to make the actions of the
    following keys consistent:


    +   * [Backspace]

    * [Delete]

    * [Home]

    * [End]


    Changes may be made by editing your .inputrc file.


    # DocBook support --


    Red Hat Linux 6.2 includes support for editing and processing SGML documents written
    to use the DocBook DTD.


    # New documentation CD-ROM --


    Red Hat Linux 6.2 boxed sets now include a documentation CD-ROM. The CD-ROM can
    be used in two ways:


    +   * To install RPM-packaged documentation on your Red Hat Linux system.

    * To read the documentation directly from the CD-ROM. For more information, please
    read the README on the documentation CD-ROM.


    # Colorized ls command --


    The ls command is known by default. To turn off this feature, add the command
    unalias ls in your .bashrc file (or disable color on a system-wide basis) delete
    the colors.* files in /etc/profile.d/.


    # Deprecated features and packages --


    The following features and packages are deprecated, and may not be supported or
    included in future releases of Red Hat Linux:


    +   * The AnotherLevel environment'
  merge: -1
  img_proc: true
