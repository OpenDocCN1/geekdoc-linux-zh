  img_proc: true
- pgno: 50
  md: '# Section 2.12:NFS Configuration


    The ftphosts file is used to allow or deny access to certain accounts from various
    hosts. Read the ftphosts man page for details.


    /etc/ftpusers


    This file lists all the users that are not allowed to FTP into your machine. For
    example, root is listed in /etc/ftpusers by default. That means that you cannot
    FTP to your machine and log in as root. This is a good security measure, but some
    administrators prefer to remove root from this file.


    # 2.12 NFS Configuration


    NFS stands for Network File System; it is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can export filesystems to other systems, and
    mount filesystems from other machines.


    # 2.12.1 Mounting NFS Filesystems


    Use the mount command to mount an NFS filesystem from another machine:


    ```

    mkdir /mnt/local # Only required if /mnt/local doesn''t exist

    mount bigdog:/mnt/export /mnt/local

    ```


    In this command, bigdog is the hostname of the NFS fileserver, /mnt/export is
    the filesystem that bigdog is exporting, and /mnt/local is a directory on the
    machine where we want to mount the filesystem. After the mount command runs (and
    if we have the proper permissions from bigdog) we can enter ls /mnt/local- and
    get a listing of the files in /mnt/export on bigdog.


    # 2.12.2 Exporting NFS Filesystems


    The file that controls filesystems you wish to export is /etc/exports. Its format
    is:


    ```

    directory          hostname(options)

    ```


    the (options) are discretionary. For example:


    ```

    /mnt/export      speedy.redhat.com

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 2:System Administration


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export      speedy.redhat.com(ro)

