- pgno: 251
  md: '# Chapter 10:Installing Red Hat Linux via Text Mode


    # Figure 10–30 Root Password Dialog


    ![](img/a62cd8edb5919f938a546de403f602c6_251_0.png)


    The root password must be at least six characters long; the password you type
    is echoed to the screen. You must enter the root password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You should make the root password something you can remember, but not something
    that is easy to guess. Your name, your phone number, password, root, 123456, and
    antealer are all examples of poor passwords. Good passwords mix numerals with
    upper and lower case letters and do not contain dictionary words: Aard387vark
    or 420BMttNT, for example. Remember that the password is case-sensitive. Write
    down this password and keep it in a secure place.'
