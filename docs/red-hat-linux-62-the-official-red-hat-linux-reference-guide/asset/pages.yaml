    # 2.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious, but Red Hat Linux has
    a few tools and conventions that make users and groups easier to manage.


    While you can useradd to create a new user from the shell prompt, the easiest
    way to manage users and groups is through Linuxconf (see Chapter 3, System Configuration).


    Next, we''ll discuss the basic structure behind managing users and groups.


    # 2.3.1 Standard Users


    In Table 2–1, Standard Users, you''ll find the standard users set up by the installation
    process (this is essentially the /etc/passwd file). The Group ID (GID) in this
    table is the primary group for the user. See Section 2.3.3, User Private Groups
