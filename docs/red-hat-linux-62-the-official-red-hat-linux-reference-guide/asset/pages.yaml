    # 7.2.1 Selecting Packages


    To select a single package, click on it with the left mouse button. You''ll notice
    highlighting will appear around the package title (as shown in Figure 7–2, Selecting
    Packages in Gnome-RPM) which reflects the selection. To unselect, either click
