  md: '# Section 10.17:Creating a User Account


    # 10.17 Creating a User Account


    Next, you can create a user account for yourself which is for your everyday use
    (as in Figure 10–31, Add User Dialog). If you do not create a user account, after
    installation you''ll have to log in as the **root user** (also known as the **superuser**).
    Root has complete access to the entire system. **Logging** in as the root user
    is best done only to perform system maintenance or administration. For instructions
    on how to create or modify user accounts after installation, refer to Chapter
    3, *System Configuration* or the *Getting Started* chapter in the *Official Red
    Hat Linux Getting Started Guide.*


    Figure 10–31 Add User Dialog


    ![](img/a62cd8edb5919f938a546de403f602c6_252_0.png)


    If you choose to create a user account, the account directory will be under the
    /home/ (for example, /home/claire). Passwords are case-sensitive and must contain
    at least six characters.


    After you add a user account for yourself, the **User Account Setup** dialog (Figure
    10–32, *User Account Setup Dialog*) appears, giving you the opportunity to create
    additional accounts. Select **Add** to do so or **OK** to continue.'
