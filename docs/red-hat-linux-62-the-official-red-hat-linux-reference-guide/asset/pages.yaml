    - Sound, video and game controllers -- If your computer has sound capabilities,
    you''ll find more information about that here.

    - Network adapters -- Here you''ll find additional information on your computer''s
    network card (if you have one).

    - SCSI controllers -- If your computer uses SCSI peripherals, you''ll find additional
    info on the SCSI controller here.


    While this method is not a complete substitute for opening your computer''s case
    and physically examining each component, in many cases it can provide sufficient
    information to continue with the installation.


    # Please Note


