- pgno: 68
  md: '# Section 2.13:The Boot Process, Init, and Shutdown


    How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be "start" and "stop". You can execute these scripts
    by hand, in fact, with a command like:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    This will stop the httpd server. init reads the name and if it has a "K," it calls
    the script with the "stop" argument. If it has an "S" it calls the script with
    a "start" argument.


    Why all these runlevels? Some people want an easy way to set up machines to be
    multi-purpose. You could have a "user" runlevel that runs httpd, sendmail, networking,
    etc. Then you could have a "user" runlevel that runs gdm, networking, and so on.


    # 2.13.4 Init Runlevels


    Generally, Red Hat Linux operates in runlevel 3 -- full multi-user mode. The follow-runlevels
    are defined in Red Hat Linux:


    +   - 0 Halt

    - 1 Single user mode

    - 2 Multi-user mode, without NFS

    - 3 Full multi-user mode

    - 4 Not used

    - 5 Full multi-user mode (with an X-based login screen)

    - 6 Reboot


    If your machine gets into a state where it will not boot due to a bad /etc/initt,
    or will not let you log in because you have a corrupted /etc/passwd or have simply
    forgotten your password, boot into single user mode by typing linux single at
    the LILO boot prompt. A very bare system will boot and you will have a shell from
    which you can fix things.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 2.13.5 Initscript Utilities


    The chconfig utility provides a simple command-line tool for maintaining the /etc/rc.d
    directory hierarchy. It relieves system administrators from having to directly
    manipulate the numerous symlinks in /etc/rc.d.


    In addition, there is the ntsys utility, that provides a screen-oriented interface,
    versus chconfig''s command-line interface.


    Please see the chconfig and ntsys man pages for more information.


    # 2.13.6 Running Programs at Boot Time


    The file /etc/rc.d/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you run levels. You can add additional initialization
    commands. For instance, you may want to start up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit /etc/rc.d/rc.serial,
    and it will be executed automatically at boot time.


    The default /etc/rc.d/rc.local simply creates a nice login banner with your kernel
    version and machine type.


    # 2.13.7 Shutting Down


    To shut down Red Hat Linux, issue the shutdown command. You can read the shutdown
    man page for complete details, but the two most common usages are:


    ```

    shutdown -h now

    shutdown -r now

    ```


    Each will cleanly shutdown the system. After shutting everything down, the -h
    option will halt the machine, and the -r option will reboot.


    Although the reboot and halt commands are now "smart" enough to invoke shutdown
    if run while the system is in runlevels 1-5, it is a bad habit to get into, as
    not all Linux-like operating systems have this feature.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Section 2.14:Rescue Mode


    # 2.14 Rescue Mode


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. We will present the ways that
    you can boot into rescue modes where you can use your own knowledge to rescue
    the system.


    # 2.14.1 What is Rescue Mode?


    Rescue mode is a term used to describe a method of booting a small Linux environment
    completely from a disk, CD or other method.


    What follows in this section may help you recover from a problem at some point.


    As the name implies, rescue mode is there to rescue you from something. In normal
    operation, your Red Hat Linux system uses files located on your system’s hard
    drive to do everything -- run programs, store your files, and more.


    However, there may be times when you are unable to get Linux running completely
    to access its files on your system’s hard drive. By using rescue mode, it’s possible
    to access the files stored on your system’s hard drive, even if you can’t run
    Linux from that hard drive.


    Normally, you’ll need to get into rescue mode for one of two reasons:


    +   - You are unable to boot Linux, and you’d like to fix it.

    - You are having hardware or software problems, and you want to get a few important
    files off your system’s hard drive.


    Let’s take a closer look at each of these scenarios.


    # Unable to boot Linux


    Many times this is caused by the installation of another operating system after
    you’ve installed Red Hat Linux. Some other operating systems assume that you have
    no other operating systems on your computer, and overwrite the Master Boot Record
    (or MBR) that originally contained the LILO bootloader. If LILO is overwritten
    in this manner, you’re out of luck -- unless you can get into rescue mode.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 2:System Administration


    # Hardware/software problems


    There can be as many different situations under this category as there are systems
    running Linux. Things like failing arid hard drives and forgetting to run LILO
    after building a new kernel are just two instances that can keep you from booting
    Red Hat Linux. If you can get into rescue mode, you might be able to resolve the
    problem -- or at least get copies of your most important files.


    To boot your system in rescue mode, entering the following parameter at the installation
    boot prompt:


    ```

    boot: linux rescue

    ```


    You can get to the installation boot prompt in one of these ways:


    +   * By booting your system from the diskette or CD-ROM that came with your Red
    Hat Linux boxed set.

    * By booting from a network or PCMCIA disk diskette. These methods assume your
    network connection is working and require you to identify the network host and
    transfer type. For an explanation of how to specify this information, see "Installing
    over the Network" in Chapter 10, Installing Red Hat Linux via Text Mode.


    Once you have your system in rescue mode, a prompt appears:


    ```

    bash#

    ```


    From this prompt, you can run the commands listed below:


    | anaconda gzip mkfs.ext2 ps |

    | badblocks head mknod python |

    | bash hwclock mkraid python1.5 |

    | cat config mkswap raidstart |

    | chatter init mlabel raidstop |

    | chmod insmod mmd rcp |

    | chroot less mmount rlogin |

    | clock ln move rm |

    | collage loader modprobe rmod |

    | cp ls mount route |

    | cpio lsattr mpartition rpm |'
  merge: -1
  img_proc: true
